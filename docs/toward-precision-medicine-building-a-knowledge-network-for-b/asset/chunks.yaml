    # Appendix A: The Statement of Task with Additional Context


    ## THE NATIONAL ACADEMIES


    | NATIONAL ACADEMY OF SCIENCES | NATIONAL ACADEMY OF ENGINEERING |

    | --- | --- |

    | INSTITUTE OF MEDICINE | NATIONAL RESEARCH COUNCIL |

    | DIVISION ON EARTH AND LIFE STUDIES | BOARD ON LIFE SCIENCES |


    ## PROJECT DESCRIPTION


    ### Framework for Developing a New Taxonomy of Disease


    #### Statement of Task

    At the request of the Director’s Office of NIH, an ad hoc Committee of the National
    Research Council will explore the feasibility and need, and develop a potential
    framework, for creating a “New Taxonomy” of human diseases based on molecular
    biology. As part of its deliberations, the Committee will host a large two-day
    workshop that convenes diverse experts in both basic and clinical disease biology
    to address the feasibility, need, scope, and consequences of defining this New
    Taxonomy. The workshop participants will also consider the essential elements
    of the framework by addressing topics that include, but not limited to:


    *   Compiling the huge diversity of extant data from molecular studies of human
    disease to assess what is known, identify gaps, and recommend priorities to fill
    these gaps.

    *   Developing effective and acceptable mechanisms and policies for selection,
    collection, and management of data, as well as means to provide access to and
    interpret these data.

    *   Defining the roles and interfaces among the stakeholder communities—public
    and private funders, data contributors, clinicians, patients, industry, and others.

    *   Considering how to address the many ethical concerns that are likely to arise
    in the wake of such a program.


    The Committee will also consider recommending a small number of case studies that
    might be used as an initial test for the framework.


    The ad hoc Committee will use the workshop results in its deliberations as it
    develops recommendations for a framework in a consensus report. The report may
    form a basis for government and other research funding organizations regarding
    molecular studies of human disease. The report will not, however, include recommendations
    related to funding, government organization, or policy issues.


    ### Project Context and Issues:

    The ability to sequence genomes and transcriptomes rapidly and cheaply is producing
    major advances in molecular genetics. These advances, in turn, provide new tools
    for defining diseases by their biological mechanisms. The recognition and classification
    of human diseases are fundamental for the practice of medicine, with accurate
    diagnoses essential for successful treatment. Although diagnostics have begun
    to embrace the identification and measurement of molecular disease mechanisms,
    the classification of disease is still largely based on phenotypic factors, or
    “signs and symptoms.” Assigning a name to a disease is not necessarily accompanied
    by a clear understanding of its biochemical causes or of the variations in disease
    manifestations among patients.


    Remarkable advances in molecular biology have brought biomedical research to an
    “inflection point,” putting the life sciences at the cusp of delivering dramatic
    improvements in understanding disease to reap the health benefits that formed
    the rationale for the Human Genome Project. In 2010, we are now poised to use
    genomics, proteomics, metabolomics, systems analyses, and other derivatives of
    molecular biology to:


    *   understand disease based on biochemical mechanisms rather than clinical appearances
    or phenotypes;

    *   transform disease diagnosis;

    *   develop improved screening for, and management of, risk factors for disease;

    *   discover new drugs and reduce side effects by predicting individual responses
    based on genetic factors; and

    *   transform the practice of clinical medicine.

