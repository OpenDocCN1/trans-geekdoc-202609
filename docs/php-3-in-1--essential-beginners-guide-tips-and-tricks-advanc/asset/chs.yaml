  ```\n\n## PHP __destruct 方法\n\n析构函数通常在你需要销毁之前创建的对象时调用。如果你需要停止或退出脚本，也可以调用它。如果你创建了\
  \ `__destruct()` 方法，PHP 会在脚本结束时调用它。析构函数以双划线开始。我在下面的示例中销毁一个对象。\n\n```php\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<?php \nclass Guns { \n    // Class Properties\n    var\
  \ $gname;\n    var $gcolor;\n    var $gcapacity;\n    // Class Methods\n    function\
  \ __construct($gname, $gcolor, $gcapacity) {\n        $this->gname = $gname;\n \
  \       $this->gcolor = $gcolor;\n        $this->gcapacity = $gcapacity;\n    }\n\
  \    function getting_the_name() {\n        return $this->gname;\n    }\n    function\
  \ getting_the_color() {\n        return $this->gcolor;\n    }\n    function getting_the_capacity()\
  \ {\n        return $this->gcapacity;\n    }\n    function __destruct() {\n    \
  \    echo \"$this->gname\\n. $this->gcolor\\n. $this->gcapacity\\n\";\n    }\n}\
  \ \n$bazooka = new Guns('This is a hard-hitting bazooka ready for waging war.',\
  \ 'The color of my bazooka is black.', 'I can load up to six rockets to my bazooka.\
  \ This is a beast for the enemy.');\n$revolver = new Guns('This is a revolver to\
  \ kill the guards at the gates silently.', 'The color of the revolver is silver\
  \ grey.', 'I can load up to ten bullets to my revolver. This is a beast for the\
  \ enemy.');\n$Ak47 = new Guns('This is an Ak47 to kill the guards at the gates silently.',\
  \ 'The color of the gun is brown.', 'I can load up to twenty bullets to my gun.\
  \ This is a beast for the enemy.');\n$shotgun = new Guns('This is a shotgun to kill\
  \ the enemy with a bang.', 'The color of the gun is brown.', 'I can load up to two\
  \ bullets to my gun. This is a beast for the enemy.');\n?>\n</body>\n</html>\n```\n\
  \n### 访问修饰符\n\n在下面的示例中，我将为方法添加访问修饰符。如果你尝试调用颜色和容量的额外函数，你会看到致命错误，因为尽管代码中的属性是公共的，这两个被认为是私有或保护的。\n\
  \n```php\n<!DOCTYPE html>\n<html>\n<body>\n<?php \nclass Guns { \n    // Class Properties\n\
  \    public $gname ;\n    public $gcolor;\n    public $gcapacity;\n    // Class\
  \ Methods\n    function setting_the_name ($n) {\n        $this->gname = $n;\n  \
  \  }\n    protected setting_the_color($n) {\n        $this->gcolor = $n;\n    }\n\
  \    private getting_the_capacity($n) {\n        $this->gcapacity = $n;\n    }\n\
  } \n$bazooka = new Guns();\n$bazooka->setting_the_name('This is a hard-hitting bazooka\
  \ ready for waging war.');\n// 以下代码将失败\n?>\n</body>\n</html>\n```\n\n\n\n# 第八章：在\
  \ PHP MySQL 中创建数据库\n\nMySQL 是你仅可以在网站上使用的数据库。你必须将其连接到服务器才能成功运行。你可以以表格的形式在 `MySQL`\
  \ 或 `SQL` 数据库中存储数据。表格是相互关联数据的集合，由行和列组成。你可以使用数据库来分类存储信息。公司可以建立如 `customers`(客户）、`employees`(员工）、`products`(产品）和`orders`(订单）之类的表格。你需要下载带有\
  \ MySQL 数据库的 PHP 服务器，你可以从互联网免费下载。`MySQL` 用于存储海量数据。\n\n## 连接\n\n第一步是在 `PHP` 和数据库之间建立连接。\n\
  \n```php\n<!DOCTYPE html>\n<html><body><?php\n$theservername = \"this is a localhost\"\
  ;\n$theusername = \"this is the username box\";\n$thepassword = \"this is the password\
  \ box\";\n// Create connection\n$myconnection = new mysqli($theservername, $theusername,\
  \ $thepassword);\n// Check connection\nif ($myconnection->connect_error) {\n   \
  \ die(\"Connection has fully failed: \" . $myconnection->connect_error);\n}\necho\
  \ \"You have been connected successfully to the database\";\n?>\n</body></html>\n\
  ```\n\n如果连接失败，你将得到上述结果：\n\n```text\nConnection has fully failed: php_network_getaddresses:\
  \ getaddrinfo failed: Name or service not known\nPHP Warning: mysqli::__construct():\
  \ php_network_getaddresses: getaddrinfo failed: Name or service not known in /home/cg/root/4530372/main.php\
  \ on line 11\nPHP Warning: mysqli::__construct(): (HY000/2002): php_network_getaddresses:\
  \ getaddrinfo failed: Name or service not known in /home/cg/root/4530372/main.php\
  \ on line 11\n```\n\n## MySQLi 过程化\n\n这是将 `PHP` 连接到 `MySQLi` 数据库的另一个示例。\n\n```php\n\
  <!DOCTYPE html>\n<html><body><?php\n$theservername = \"this is a localhost\";\n\
  $theusername = \"this is the username box\";\n$thepassword = \"this is the password\
  \ box\";\n// Create connection\n$myconnection = new mysqli_connect($theservername,\
  \ $theusername, $thepassword);\n// Check connection\nif (!$myconnection) {\n   \
  \ die(\"Connection has fully failed: \" . $myconnection->connect_error);\n}\necho\
  \ \"You have been connected successfully to the database\";\n?>\n</body></html>\n\
  ```\n\n## 数据库创建\n\n在这个示例中，我将编写代码帮助你创建一个数据库并加载到你的网站上。\n\n```php\n<!DOCTYPE html>\n\
  <html><body><?php\n$theservername = \"this is a localhost\";\n$theusername = \"\
  this is the username box\";\n$thepassword = \"this is the password box\";\n// Create\
  \ connection\n$myconnection = new mysqli_connect($theservername, $theusername, $thepassword);\n\
  // Check connection\nif (!$myconnection) {\n    die(\"Connection has fully failed:\
  \ \" . $myconnection->connect_error);\n}\necho \"You have been connected successfully\
  \ to the database\";\n// This will help you create a database\n$sql = \"I am trying\
  \ to create a database\";\nif ($myconnection->query($sql) === TRUE) {\n    echo\
  \ \"Thank you, you have got your database. You are now free to use it.\";\n} else\
  \ {\n    echo \"There is an error in the creation of the database: \" . $myconnection->error;\n\
  }\n$myconnection->close();\n?>\n</body></html>\n```\n\n## 过程化 MySQLi 中的数据库创建\n\n\
  ```php\n<!DOCTYPE html>\n<html><body><?php\n$theservername = \"this is a localhost\"\
  ;\n$theusername = \"this is the username box\";\n$thepassword = \"this is the password\
  \ box\";\n// Create connection\n$myconnection = new mysqli_connect($theservername,\
  \ $theusername, $thepassword);\n// Check connection\nif (!$myconnection) {\n   \
  \ die(\"Connection has fully failed: \" . $myconnection->connect_error);\n}\necho\
  \ \"You have been connected successfully to the database\";\n// This will help you\
  \ create a database\n$sql = \"I am trying to create a database\";\nif (mysqli_query($myconnection,\
  \ $sql)) {\n    echo \"Thank you, you have got your database. You are now free to\
  \ use it.\";\n} else {\n    echo \"There is an error in the creation of the database:\
  \ \" . mysqli_error($myconnection);\n}\n$mysqli_close($myconnection);\n?>\n</body></html>\n\
  ```\n\n## 表格创建\n\n这里是用于 `PHP` 的创建表格的代码块。\n\n```php\n<!DOCTYPE html>\n<html><body><?php\n\
  $theservername = \"this is a localhost\";\n$theusername = \"this is the username\
  \ box\";\n$thepassword = \"this is the password box\";\n// Create connection\n$myconnection\
  \ = new mysqli_connect($theservername, $theusername, $thepassword);\nif (!$myconnection)\
  \ {\n    die(\"Connection has fully failed: \" . $myconnection->connect_error);\n\
  }\necho \"You have been connected successfully to the database\";\n$sql = \"CREATING\
  \ THE TABLE BuyingDetails ( id INT(6) UNSIGNED AUTO_INCREMENT PRIMARY KEY, Serial#\
  \ VARCHAR(30) NOT NULL, BuyerName VARCHAR(30) NOT NULL, PostalAddress VARCHAR(30)\
  \ NOT NULL, Age VARCHAR(30) NOT NULL, Nameofcountry VARCHAR(30) NOT NULL, MoneySpent\
  \ VARCHAR(30) , reg_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP\
  \ )\";\nif (mysqli_query($myconnection, $sql)) {\n    echo \"Thank you, you have\
  \ got your table. You can use it as per need.\";\n} else {\n    echo \"There is\
  \ an error in the creation of the database: \" . mysqli_error($myconnection);\n\
  }\n$mysqli_close($myconnection);\n?>\n</body></html>\n```\n\n## PHP 和 SQL 命令\n\n\
  在开始创建之前，数据库的设计应该是正确的。否则，你将不得不通过调整表格、合并表格或移动不同的列来建立 MySQL 可以使用的关系。\n\n### 列的选择\n\n\
