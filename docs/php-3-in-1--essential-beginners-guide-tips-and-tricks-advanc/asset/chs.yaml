  \n## SELECT INTO\n\n在数据量巨大且始终存在丢失风险的大型中，你必须创建多个副本存储在数据库中。如果你手动操作，通过在数据库中手动填写每个记录条来创建一个完美的副本将花费大量时间。此外，在某些情况下，数据是特定用户的，这意味着你无法轻松检索它。`MySQL`\
  \ 允许你创建需要的数据副本。请查看以下示例。\n\n| Customer ID | 客户名称 | 联系电话 | 密钥代码 | 国家 |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 1 | Fanny | 55779034 | 007 | 美国 |\n| 2 | Marlow | 34568988\
  \ | 7 | 英国 |\n| 3 | Marlow | 34578899 | 7 | 爱尔兰 |\n| 4 | Victoria Ann | 23768800\
  \ | 67 | 德国 |\n| 5 | Marlow | 45327899 | 7 | 美国 |\n| 6 | Marlow | 23897609 | 7 |\
  \ 法国 |\n| 7 | Emilia Tim | 45890093 | 3 | 意大利 |\n\n\n\n\n\n| 8. | Marlow | 34980900\
  \ | 7 | 瑞典 |\n| 9. | Emilia Jackson | 45980999 | 4 | 美国 |\n| 10. | Harry Styles\
  \ | 47889933 | 0 | 美国 |\n| 11. | Marlow | 45789809 | 7 | 美国 |\n| 12 | Sylvia | 15769091\
  \ | 9 | 美国 |\n\n语句是：`SELECT * INTO MembersBackup2020 FROM Members;`\n\n# 第八章 构建\
  \ Web 应用程序\n\n![](img/Image00003.jpg)()\n\n\n\n\n在 PHP 中，你已经在之前的章节中学习过如何使用 PHP 编程了。你已经见过了如何创建一个一个程序、设置条件判断、创建循环等等。所有这些知识都赋予了你构建在\
  \ Web 上运行良好的 PHP 程序的能力。然而，你可以让它们变得更好、更易用。随着你程序复杂性的增加，你会发现大量的 `require_once()` 和\
  \ `includes` 函数。每当你想要创建一个新文件或在公共函数中进行某些操作时，你都可以向程序中添加一个 `require_once`。如果你引导访客访问任何如\
  \ [`www.example.com/login.php`](http://www.example.com/login.php) 的 URL，你可以使用 `auto_prepend_file`\
  \ 在运行 `login.php` 代码之前加载一个辅助文件。这个辅助文件具有启动会话（session）、提供多个可以在程序内部使用的函数或加载多个文件的功能。`auto_prepend_file`\
  \ 函数是 `php.ini` 文件的不可或缺的一部分，但在 Apache 配置中通过 `php_value` 指令来设置它也是很常见的做法。\n\n### 预加载文件\
  \ (Prepend File)\n本节将解释：如果你正准备使用会话，你必须在所有使用会话的页面上调用 `session_start()` 函数。如果你打算跟踪多个\
  \ PHP 程序中的会话，这可能会非常困难。这时你可以使用 auto-prepend-file 来调用 `session_start`。创建两个文件：一个是主文件，另一个包含一个用于启动特定会话的预加载函数。\n\
  \n在执行练习之前，你应该确保 `.htaccess` 文件可以正常工作，或者你能够修改 Apache Web 服务器的配置。如果你打算对配置进行更改，请确保你已重启\
  \ Apache。在文档根目录的 `.htaccess` 文件中，你需要放置以下代码：\n\n```\nphp_value auto_prepend_file\
  \ \"prepend.php\"\n```\n\n你也可以在下述脚本内部添加相同的行。\n\n```php\n<Directory \"/my/documentroot/path\"\
  >\n    php_value auto_prepend_file \"/my/documentroot/path/prependfile.php\"\n</Directory>\n\
  ```\n\n如果文档根目录是 `/var/www`，你应该在 `<Directory \"/var/www\">` 之后添加该行。现在打开你的文本编辑器，并创建一个新的空文件。在该文件中，你需要放置以下代码：\n\
  \n```html\n<html>\n<head>\n    <title>This is PHP</title>\n</head>\n<body>\n   \
  \ <?php \n    if (isset($_SESSION)) {\n        print \"Your Session starts!\";\n\
  \    } else {\n        print \"Your session did not start\";\n    } \n    ?>\n</body>\n\
  </html>\n```\n\n```php\n$php main.php\n```\n\n```html\n<html>\n<head>\n    <title>This\
  \ is PHP</title>\n</head>\n<body>Your session did not start</body>\n</html>\n```\n\
  \n现在将该文件保存为 `session.php` 并保放在文档根目录下。你现在可以打开 Web 浏览器并输入 [`localhost/session.php`](http://localhost/session.php)。你现在可以最小化浏览器，并在文本编辑器中创建一个新文件。现在在新文件中放置以下代码：\n\
  \n```php\n<?php session_start(); ?>\n```\n\n你可以将此文件保存为 `prepend.php` 并保放在文档根目录下。在浏览器中，你可以刷新\
  \ `session.php` 文件以查看你之前创建的相同内容。如果你在浏览器上看到空白页面或某种错误，意味着预加载文件不存在。请检查拼写以验证你是否书写正确。如果你看到显示“Session\
  \ has not started”的页面，很可能是你的 Apache 没有检测到 `auto_prepend_file` 指令。如果你将 `.htaccess`\
  \ 文件放置在文档根目录下，你应该确保 Apache 已经读取了 `.htaccess` 文件。继续阅读或咨询主机提供商查看是否允许 `.htaccess` 文件。某些\
  \ Web 服务器配置没有 `.htaccess` 文件的空间。你可以通过更改读取 `.htaccess` 文件的目录 `AllowOverride` 为 `All`\
  \ 来修改 Apache 配置以允许这些文件。\n\n### 为了效率的类 (Classes for Efficiency)\n你可以使用类来让你的应用程序更高效。你可以创建一个类来定义用户。之后，你可以继续为该用户类添加函数（称为方法），用于处理用户在\
  \ Web 应用上可能想要的简单操作，例如更新密码。在没有类的情况下，你可能会在程序中散落在许多函数。这将使代码变得复杂，并看起来像一团糟。此外，编写程序将花费更长时间。\n\
  \n如果你不使用类编写程序，你将不得不添加大量函数来正确运行程序。例如，如果你想在没有类的情况下编写不同的用户管理程序，你将不得不包含如 `setEmail`、`changePassword`\
  \ 等许多函数。现在，你将不得不将代码与另一个合并，以为你的程序添加不同的角色。你可以编写这些程序，它们将与你的程序共享相同的函数名。例子是 `addPermission`。当你旨在合并它们时，`addPermission`\
  \ 函数不会与其他函数冲突。另一方面，如果你以特定的面向对象的方式（使用 `New` 关键字）定义类，你将像下面这样实例化：\n\n```php\n$user\
  \ = new User;\n```\n\n### 代码复用 (Code Reuse)\n这也是编程中最重要的方面之一。大多数程序员在需要时会频繁复用函数或程序。大多数可复用的代码是为了启动程序以节省时间。\n\
  \n### 函数 (Functions)\n函数是 PHP 编程中的重要部分。通过 `auto_prepend_file` 的帮助，你可以创建包含在你的 PHP\
  \ 程序中的函数。这些函数可以简单如启动会话，也可以复杂如登录。你可以在多个地方使用 `auto_prepend_file`。一个函数可以将州的三字母缩写转换为全称。现在，清理\
  \ `prepend.php` 之外的代码，并将其放入文件中：\n\n```html\n<html>\n<head>\n    <title>This is PHP</title>\n\
  </head>\n<body>\n    <?php \n    if (!isset($_SESSION)) {\n        session_start();\n\
  \    }\n    function convertState($nstate) {\n        $thestateList = array(\n \
  \           \"ALA\" => \"Alabama\",\n            \"AKA\" => \"Alaska\",\n      \
