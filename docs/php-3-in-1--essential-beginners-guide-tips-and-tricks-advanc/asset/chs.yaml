  ## 结论\n## 资源\n\n### 引言\nPHP 被认为是最流行的开发语言和 Web 应用语言之一。它的创建是为了制作动态网页；然而在存在的多年里，PHP\
  \ 语言已变成了更有用的东西。得益于 PHP 开发，人们可以轻松地创建复杂的应用程序，例如论坛、图库等。本书将向你介绍使用 PHP 语言编写代码和开发的过程。它将引导你从创建一个包含内容的简单网页到构建交互式\
  \ Web 应用。我们将涉及安全问题、数据库交互以及为你的 PHP 应用创建开发环境。在阅读本书的过程中，你将编写一个小型但可靠的博客应用程序，以便将每章中学到的理论知识应用于真实的开发过程中。在开始一场激烈的战斗之前，了解信息并做好准备是一个良好的习惯。正如一位我不知道名字也无法证明其存在的伟人可能说过的：“战斗在准备阶段就已经胜利了一半。”在今天的菜单上，你将找到关于\
  \ PHP 基础知识特别是其运行机制的简要介绍。至于甜点，将让你自己发现什么是编程。\n\n\n\n# 第一章 ![](img/Image00003.jpg)\n\
  \n## PHP 基础\n\n在开始编写脚本之前，你必须从基础做起：`PHP` 的语法。这部分至关重要；如果你不掌握这种语言的基础知识，以后将会浪费大量时间。\n\
  \n### PHP、Web，它们到底是什么？\n\n`PHP`，全称为 `Hypertext Preprocessor`（超文本预处理器），是一种编程语言。还有许多其他语言，如\
  \ `C`、`Java`、`OCaml` 等，但我们可以说 `PHP` 是一种面向 Web 或网站的编程语言。记录一下，`PHP` 是由 `RasmusLerdorf`\
  \ 在 1994 年创造的。起初它非常基础，于 1995 年以 `PHP / FI` 的名称公开。随后，开发工作从 `RasmusLerdorf` 手中交给了两位学生——`ZeevSuraski`\
  \ 和 `Andi Gutmans`，他们后来创立了 `Zend Technologies` 来推广 `PHP`。如果你用 `PHP` 开发应用程序，你无疑会听说过\
  \ `Zend`，无论是通过他们的框架、开发环境还是服务器，分别是 `Zend Framework`、`Zend Studio` 和 `Zend Server`。\n\
  \n`PHP` 不仅仅是一种编程语言，它还是一种解释型语言。当你使用应用程序时（例如在 Windows 下），你双击程序来启动它；程序随后运行，你的计算机可以直接运行该程序。对于\
  \ `PHP` 来说，有些不同。事实上，你的计算机并不懂 `PHP`；它不知道如何运行它；为了执行 `PHP`，包含 `PHP` 代码的文件必须被……`PHP`\
  \ 解释器解释。\n\n具体来说，解释器是什么？正如我所，你的计算机不能像运行经典应用程序那样运行 `PHP` 代码。为了让你的代码运行起来，解释器（一个可执行程序）会读取它，将其翻译成一种中间语言——`Opcode`，最后要求你的计算机执行与生成的\
  \ `Opcode` 对应的指令。你将在本书的其余部分再次听到 `Opcode`，所以现在先不要在此停留，只需知道它的存在即可。\n\n## Web - 它是如何工作的？\n\
  \n首先，什么是 Web？`Web`——或万维网——是允许你阅读这些内容的系统，它让你访问内容、网站页面，通常通过互联网访问。`Web` 经常与 `Internet`（互联网）混淆，但\
  \ `Internet` 绝对不在 `Web` 之：许多其他系统、应用程序和协议都在使用 `Internet`。某些实体（例如公司）利用这种混淆来提供更具吸引力的报价，这非常可悲；他们用“无限上网”之类的口号轰炸我们，而实际上他们只提供了对\
  \ Web 的访问权限，而且并不总是真正的“无限”……但我又偏题了；这不是主题。\n\n`web` 的运行基于包含两个说话者的模型：`client`（客户端）和\
  \ `server`（服务器）。你可以完美地与餐厅进行类比，这非常贴切而且很有趣。当你坐在餐厅里，安静地坐着，选择一道菜，招唤服务员并告诉他你需要什么。一旦收到\
  \ `client` 的请求，`server` 将进行内部烹饪，最终交付你订的食物。因此有两条消息：首先是从 `client` 到 `server` 的请求，然后是从\
  \ `server` 到 `client` 的响应。\n\n对于网站来说也是一样。你的 `browser`（浏览器）——充当 `client`——会向 `server`（服务器）——一个\
  \ `server`——发送请求……\n\n（注：提供的源文本在结尾处中断/重复，已根据提供的片段进行格式化。）\n\n……web 服务器，我们将选择目前最流行且广为人知的：`Apache\
  \ HTTP Server` 或 `HTTPD`。这个 `web server` 由同名的非营利组织 `Apache Software Foundation`\
  \ 发布。该组织也因其他项目以及他们的许可协议 `Apache license` 而闻名，它是免费且开源的。\n\n\n\n我们在这里所做的是描述、陈述、表达对问题的解决方案，而这里正处于编程的核心。我们的汽车为我们提供了某些概念，例如汽车的加速度或方向改变，并允许我们通过前进或转向等基本操作使用这些概念，从而允许我们表达对问题的解决方案。这几个操作看起来可能不起什么，但它们足以表达你对汽车可以进行的许多操作。一旦方案被表达，剩下的就是使用你汽车特定的踏板、方向盘和其他工具来实现它。一种计算机语言，例如\
  \ `PHP`，做的事情和这辆车完全相同：它为我们提供了某些概念，允许我们表达解决方案，并提供了将这些解决方案翻译成解释器可以执行的代码的工具。必须理解的是，编程不仅仅一件事，而是两个不同的步骤：解决问题和应用解决方案。问题的解决方案是程序的设计，而解决方案的应用是它的实现，即翻译成代码。我们以后会回到设计和实现；重要的是你要记住，编程发生在两个阶段。\n\
  \n## 当你想学习时应采取的态度\n\n如果你决定继续这门课程——我希望会有很多人这样做——那么应该采取什么样的态度呢？正如我的介绍介绍所暗示的，我坐在这里不是为了制作“快餐版”编程。我的目标不是让你学会\
  \ `PHP` 的所有领域。所以你有时必须在看到努力的成果之前保持耐心。至于我的解释，我不会把你们当成笨蛋。虽然我们是初学者，但我们不是婴儿；我们可以思考并自力。这就是为什么我经常会让你先去\
  \ `RTFM` —— 读那该死的手册（Read The Fucking Manual），或者更棘手的版本：自己去找。我不想让你处于受照顾的状态。我会帮助你，引导你，但我不会把所有煮熟好的东西都直接喂到你嘴里。毫无疑问，你将在某个时候被迫去自己寻找。这种能力、这种变通能力是一种非常重要的品质，所以我想让你利用它，为此，我显然不需要担任你的专业助理。当然，有时会发生即使花了时间也找不到解决方案。在这种情况下，你必须在例如零网站的论坛上寻求帮助。如果你这样做，或者说，当你这样做时，不要忘记一些事情。\n\
  \n## 主题的标题\n\n假设我有一个问题，而我的搜索没有帮助。我来到关于 `PHP` 的论坛，创建一个新主题。你首先需要注意的是标题。它旨在描述你的主题；这样一来，访问论坛的人就能知道他们是否可能帮助你，而无需阅读正文。因此，选择一个描述你主题的标题是关重要的。如果你放了类似“大问题”、“急需帮助”之类的内容，你就不知道主题是什么。一个很小而有趣的细节，有些人会写一个类似于“关于\
  \ `PHP` 的问题”的标题。我们不能说它没有描述主题，但你觉得在一个专门用于 `PHP` 的论坛里，我们谈论…… `PHP` 有逻辑吗？这只是说你不需要指定你正在谈论\
  \ `PHP`。我们看到了不该怎么做，但到底如何选择一个好的标题呢？嗯，没有魔法方法；你必须思考。如果我有一个显示文本的问题，我可以放什么标题？如果我写“`PHP`\
  \ 问题”，它是没用的。反之，像“显示文本的问题”这样的标题已经更明确了，对吧？你必须尝试用几个词总结主题的目的。如果你这样做，你通常会有一个很好的标题。如果你无法总结你的主题，只需放入你认为最相关的关键词即可。\n\
  \n## 主题的内容\n\n标题之后是主题的内容。标题是摘要；内容是主题的主体。人们在你的主题中首先必须看到的是一句礼貌的话。是的，当我没有看到“你好”或其他任何内容时，我不喜欢，而且不会回复该主题。礼貌体现在几个字、你几秒钟的时间里，但许多人忽略了它。如果我这样去你家要糖：“给我一些糖”，你会给我一些吗？我想不会的。现在，如果我说：“你好，可以借我一些糖吗？非常感谢，我完成蛋糕的机会就更大了。”你在论坛上发主题时也是同样的道理。一点礼貌将确保那些帮助你的人给你更温暖的欢迎。你必须写有意义的句子，你必须注意你的拼写（不要用短信体），并且必须清晰地表达自己。有时人们的主题写得非常糟糕，以至于我们什么都听不懂。在这种情况下，帮助是很困难的。如果你需要在主题中放入\
  \ `PHP` 或其他代码，也要注意这一点！事实上，有些论坛提供了工具让阅读变得更有趣，当代码更具可读性时，提供帮助会更容易……（注：原文此处存在大量重复的段落，翻译已按要求去重并保持逻辑连贯）\n\
  \n## Apache 和 Php\n\n### Windows\n你必须在你的机器上拥有管理员权限才能继续安装。前往 Apache HTTPD 网站，在左侧菜单“下载”旁边你会找到一个“来自镜像”链接。目前，你到达的页面提供了四个版本：\n\
  \n\n\n\n- 2.3.8-alpha\n- 2.2.16\n- 2.0.63\n- 1.3.42\n\n\n\n这显然会发生变化，只需获取最新的既不是 alpha\
  \ 也 beta 的版本即可。在我的情况下，我会选择发布版本 `2.2.16`。然后你可以在各种选项之间进行选择，例如 `Unix Source`、`Win32\
  \ Source` 或 `Win32 Binary`。由于你使用的是 Windows 系统，请选择 `Win32 Binary` 之一，选择包含 `OpenSSL`\
  \ 的 `Win32 Binary`。文件下载完成后，运行它。在安装开始时，你会被要求接受许可协议，在到达域名选择屏幕和一些其他信息界面后执行即可。然后，你可以在两种安装类型之间选择：`Typical`（典型）和\
  \ `Custom`（自定义）。由于我们不是来学习如何用极小洋葱配置 Web 服务器的，我们将选择 `Typical` 选项。实际安装现在将开始，它不会花费很长时间，最多只需要几分钟。一旦完成后，安装向导将退出；你需要查看\
  \ Windows 任务栏。你应该能看到一个微小、可爱的图标。现在打开你最喜欢的浏览器并访问 `http://localhost.com`。文字可能会有所不同，重要的是你没有看到类似“主机不存在”、“无法访问”或我不清楚之类的错误。\n\
  \n### 什么是“本地主机 (Local Host)”？\n\n记住 Apache 是一个 Web 服务器。因此，为了与之联系，我们必须通过网络，更准确地说，通过\
  \ Web 地址即 URL。就像 URL `http://siteduzero.com` 将你与 zero 站的服务器连接一样，`http://localhost`\
  \ 将我们与安装在你的机器上的 Web 服务器连接起来。\n\n如果万一不起作用，不要惊慌，我们会尝试修复它。要这样做，我们需要进入 Windows 服务管理器。同时按下\
  \ `Windows` 和 `R` 键；这将打开窗口。输入值 `services.msc` 并确定，然后你就会发现服务管理器。在服务列表中，你应该找到 `HTTPD`\
  \ 服务。如果没有在那里，说明安装没有正常进行，或者没有将 `HTTPD` 安装为服务。在这两种情况下，请尝试重新安装服务器。如果你找到了它且它不处于 `Started`（已启动）状态，右键点击它即可启动它。PHP\
  \ 的安装并不比 Apache 复杂，所以先去 PHP 下载页面。你会发现各种版本的 PHP，取最新的一个，对我来说是 `5.3.3`。在为你的版本提供的四个解决方案中，寻找\
  \ `x86 Thread Safe` 并下载安装程序。一旦下载完成，运行新获取的文件。就像 Apache 一样，你会被要求接受许可协议，执行即可，勾选 `Apache\
  \ 2.2.x Module` 框，这将允许你的 Web 服务器使用 PHP 解释器。然后继续安装，你会很快进入一个邀请你选择 Apache 配置目录的屏幕。点击“browse”（浏览）按钮选择文件夹，默认情况下它位于\
  \ `C:\\Program Files\\Apache Foundation\\Apache (version)\\`。你只需要选择 `conf` 文件夹并确认。在屏幕继续显示时，滚动到标题为“Choose\
  \ items to install”的界面。在这个界面，你可以看到将安装哪些 PHP 组件。拉下 `extension` 菜单，如果尚未执行则激活 `mbyte`\
  \ 和 `pdo`。然后拉下 `PDO` 菜单并激活 `pgsql`。你只需确认所有内容，安装即可完成。恭喜，一切都应该安装好了。要检查这一点，进入你之前选择的\
  \ Apache 文件夹，并在 `htdocs` 文件夹中创建一个 `test.php` 文件。不要忘记使用你最喜欢的代码编辑器，将以下内容放入其中并保存：\n\
  \n```php\n<?php phpinfo(); ?>\n```\n现在是时候重启浏览器并输入以下地址：`http://localhost/test.php`。为了让你的安装准备好服务，只剩下一个细节需要修复。目前，你会发现如果重启电脑或切换用户，Apache\
  \ 会自动启动。我猜你和我一样，你有生活，所以不要把所有时间都花在让 Apache 运行。为了避免这种情况，有两件事要做。首先，如上述说明返回服务管理器并找到\
  \ `Apache` 行。右键点击它并点击 `Property`（属性），窗口将打开。从此窗口中，你可以将 Apache 的启动模式从 `Automatic`（自动）更改为\
  \ `Manual`（手动）。多亏此，Apache 将不会自动启动；你必须手动启动它。然而，你会注意到任务栏中的图标会一直存在。这并不神秘，那个图标并不代表服务器，而是一个允许你停止、启动和重启服务器的应用程序。要防止自动执行，再次按下\
  \ `Windows` 和 `R` 键，但这次输入值 `msconfig`。确定后，将打开一个新窗口，点击 `Start`（启动）选项卡。在列表中找到引用 Apache\
  \ 的行，取消勾选，点击 `Apply`（应用），最后点击 `Ok`。Windows 会提示你重启系统；不需要这样做。\n\n### 启动 Apache\n\n\
  Apache 现在绝对很安静，不会再打扰你。要启动 Apache，你有两种方案可用。你知道第一种了，直接通过服务管理器即可。第二种涉及已安装程序列表中的命令提示符。在提示符中，你只需要输入\
  \ `net start apache2.2` 即可启动 Apache，如所示。你可能需要输入 `apache2.2` 以外的内容。你可以在服务管理器中找到服务的准确名称。要停止服务并不复杂，只需使用\
  \ `net stop` 命令代替 `net start` 即可。\n\n### 在 GNU Linux、Mac OS X 及其他系统下的 Apache 和 PHP\n\
  \n你必须在机器上拥有管理员权限才能继续安装。\n\n#### GNU Linux 安装\n\n例如，我选择了一个现在非常流行的发行版：取决于你的发行版，安装过程应该很少或没有变化；使用你最喜欢的包管理器，一切都应该没问题。如果你仍然遇到困难，请参考你发行版的文档或论坛。你也可以向我发送与特定发行版相关的异常或问题。\n\
  \n首先要做的安装 Apache 服务器。没什么特殊，`apache2` 包就在那里：我们将立即检查 Apache 是否安装并运行：\n\n```bash\n\
  service apache2 status\n# 应该显示 is running (pid)\n```\n\n如果没有，执行 `sudo service apache2\
  \ start` 来启动 Apache。\n\n```bash\nwget http://localhost index.html\n# 应该显示 <html>\n\
  ```\n\n#### 什么是 \"localhost\"？\n\n记住 Apache 是一个 Web 服务器。因此，为了与之联系，我们必须通过网络，更准确地说，通过\
  \ Web 地址即 URL。就像 URL `http://siteduzero.com` 将你与 zero 站的服务器连接一样，`http://localhost`\
  \ 将我们与安装在你的机器上的 Web 服务器连接起来。\n\n在安装 PHP 之前，你必须检查它的版本。确实，所需的版本 `5.3` 较新，对于某些发行版，提供的包可能并不。让我们检查这一点：\n\
  \n```bash\nsudo apt-cache show php5\n```\n\n版本部分应该给出 5.3 或更高。如果 PHP 版本正确，完美，安装该包。如果不幸并非如此，你有两种解决方案。第一种是找出是否有友好的贡献者专门为\
  \ PHP 5.3 或以上版本创建了仓库或包，如果是这样，你只需要更改仓库或直接下载包。如果没有找到任何合适的仓库或包，第二种解决方案将是编译 PHP。让我们从该地址获取源代码。在最新版本中，源代码以\
  \ `Bzip2` 或 `Gzip` 压缩提供，取你喜欢的，我选择了 `Gzip`。剩下的就是移动压缩包、解压、配置安装，最后进行安装。\n\n```bash\n\
  sudo cp /home/cedric/Downloads/php-5.3.3.tar.gz /usr/local/src\ncd /usr/local/src\n\
  sudo tar -xvzf php-5.3.3.tar.gz\ncd php-5.3.3.tar.gz\n./configure --with-apxs2=/usr/bin/apxs2\
  \ --with-gettext --enable-mbstring --with-pdo --with-pgsql\nsudo make\nsudo make\
  \ install\n```\n\n\n\n\n# 第二章：配置以更好地运行\n\n在使用这些新安装的工具之前，有必要对它们进行配置。我在这里向你保证，我们不会去配置\
  \ PHP 和 Apache 这两个小家伙。尽管如此，有些工作还是必须完成的。\n\n## PHP 配置\n\nPHP 的配置集中在一个文件中，著名的 `php.ini`。这是一个非常简单的文件，将键（key）映射到值（value）。例如，有一个连接默认标识符的键以及与这些标识符关联的值。我们接下来要做的是配置\
  \ PHP，使其能够在良好的状态下学习。\n\n要做的第一件事是找到配置文件。这一步相对简单；答案就在之前的几行中，就在我们创建的测试文件中。回到你喜欢的浏览器并访问\
  \ `http://localhost/test.php`。在接收到的页面中搜索“Loaded Configuration File”（加载的配置文件），你会在旁边看到配置文件的路径。\n\
  \n打开这个文件并寻找以 `error_reporting`、`display_errors` 和 `date.timezone` 开头的三行。在每一行中，你都会发现键值对应的原理，语法为`<key>\
  \ = <value>`。我们将更改这三个键的值。将以下内容作为值：\n\n```ini\nerror_reporting = E_ALL | E_STRICT\n\
  display_errors = On\ndate.timezone = 'Europe / Brussels'\n```\n\n需要注意的是，对于最后一个键，值取决于你的地理位置。你可以在\
  \ PHP 文档的这一页面找到最合适的值。例如，我住在欧洲，所以我点击相应的链接，离我居住地最近的城市是布鲁塞尔，所以我使用了 `Europe / Brussels`\
  \ 这个值，并在周围加上了单引号。我会在之后向你解释为什么要这样做。\n\n## Apache 配置\n\n像 PHP 一样，Apache 也使用 `httpd.conf`\
  \ 文件进行配置。该文件位于 Apache 安装目录下的 `conf` 文件夹中。它的语法与 `php.ini` 不同，但并不更复杂。打开这个 `httpd.conf`\
  \ 并寻找定义 `DocumentRoot` 的行。这个 `DocumentRoot` 是 Apache 获取所请求的文件的位置。让我们举个例子：如果我访问 `http://localhost/test.php`，我连接到\
  \ `http://localhost` 的 Web 服务器并请求 `test.php` 文件。这个文件，Apache 会去哪里获取它呢？在 `DocumentRoot`\
  \ 中。\n\n你可以测试一下：删除或重命名你安装 Apache 后创建的 `test.php` 文件，你会发现 URL `http://localhost/test.php`\
  \ 会引导你进入错误。取决于你的操作系统——通常是 Windows——`DocumentRoot` 可能位于需要管理员权限的文件夹中，每当你想要创建新文件或修改新文件时，仍然需要管理员身份。为了避免这种情况，我们将修改这个\
  \ `DocumentRoot`。\n\n在我所在的机器上，`DocumentRoot` 是 `C:\\Program Files\\Apache Software\
  \ Foundation\\Apache2.2\\htdocs`，我将将其更改为 `C:\\www` 例，只要它是你可以创建和编辑文件的文件夹，这并不重要。最后要执行的修改是查看文件中的行\
  \ `<Directory \"DocumentRoot\">`。当然，请记得将 `DocumentRoot` 替换为旧值，在我的情况下，我必须查找 `<Directory\
  \ \"C:\\Program Files\\Apache Software Foundation\\Apache2.2\\htdocs\">`。在这行中，我们将更改路径，因为我们更改了\
  \ `DocumentRoot`。\n\n总之，开始时我们是这样的：\n\n```apache\nApache DocumentRoot \"C:\\Program\
  \ Files\\Apache Software Foundation\\Apache2.2\\htdocs\"\n<Directory \"C:\\Program\
  \ Files\\Apache Software Foundation\\Apache2.2\\htdocs\">\n```\n\n而最后，我们变成了：\n\n\
  ```apache\nApache DocumentRoot \"C:\\www\"\n<Directory \"C:\\www\">\n```\n\n当你修改\
  \ Apache 配置文件时，必须重新加载才能使更改生效。如果你的系统允许，请记住执行重载操作，否则请完全重启 Apache。\n\n好了，你已经安装了自己的\
  \ Web 服务器和 PHP，更不用说代码编辑器了。你已经拥有所需的一切，并准备好攻克 PHP 学习了。某一天，也许有人会告诉你，用这种方式安装这些软件太疯了。事实上，你应该知道存在现成的集成包，那些单独安装\
  \ PHP、Apache 和其他软件的包。如果我选择不使用这些集成包，是因为没有哪一个包包含了我需要的所有正确版本的软件，而且我认为了解一下我们如何安装——即使是相当基础——这些不同的软件是一件好事。\n\
  \n## 第一步\n\n在花费了这么多时间安装、测试和配置不同的软件之后，我觉得你想要开始真正的学习了。这就是为什么我不建议你等待，直接建议你看看什么是 PHP\
  \ 标签和注释，以及它们的用途。\n\n### PHP 标签\n\n让我们取上一章中一个非常可爱、非常小、非常软的 PHP 文件：\n\n```php\nPHP\
  \ - Example 1\n<?php phpinfo();\n```\n\n我将用另一种形式重写它，这样对我的解释更简单：\n\n```php\nPHP -\
  \ Example 2\n<?php phpinfo(); ?>\n```\n\n正如我们看到的，PHP 是一种解释型语言；解释器将读取并处理这个文件。一个小问题是：PHP\
  \ 文件可以包含 PHP，也可以包含其他内容，如文本、HTML、CSS、Javascript。\n\n```php\nPHP - Example 3\nHello,\
  \ Robert.\n<?php phpinfo(); ?>\nGoodbye, Paul.\n```\n\n当然，PHP 解释器不理解这些文本；它们对它没有意义，因为它们不是语法。更糟糕的是，如果解释器尝试对这些文本进行操作，它会报错，导致你的代码失效。这就是为什么\
  \ PHP 标签如此重要；它们会告诉解释器什么是 PHP 代码，从而忽略其他部分。如果你想标记 PHP 代码的开始，将使用开始标签 `<?php`；如果你想结束，将使用结束标签\
  \ `?>`。\n\n正如你所注意到的，代码没有结束标签但仍然工作。解释器的行为非常简单：“当我遇到开始标签，我开始处理代码，直到遇到结束标签。”在这方面，我建议你不要放置结束标签，除非必要（如示例\
  \ 3 所示）。在学习过程中，这些标签对 `<?php` 和 `?>` 是过时的做法，所以你不应该使用它们。在上面的示例中，你现在知道了每个项的作用：`phpinfo()`。我们稍后会看到它。为了好玩，我提议一个小练习：编写非\
  \ PHP 的内容。\n\n```php\nPHP\n<?php phpinfo(); ?>\n任何非 PHP 内容都排除在标签之外。\n```\n\n###\
  \ 注释\n\n现在你已经知道如何注释一行，但假设你想注释几行。来看另一个重要元素：注释。和所有语言一样，PHP 支持注释，即标签之间的元素不会被解释。为了清楚，我们将使用上一章的例子做一个小改：\n\
  \n```php\nPHP - Example 4\n<?php // phpinfo();\n```\n\n将该放入你的 `test.php` 文件并访问该地址，你现在知道发生了什么吗？是的，代码中出现了注释，`phpinfo()`\
  \ 元素没有被解释，因为它位于注释之后，所以页面是空的。所以你猜到了：PHP 解释器认为双斜杠 `//` 之后的所有都是注释。解释器不解释被注释的内容。\n\n\
  那么有什么意义呢？对于解释器来说，没有；它不在乎。但对于开发者来说，注释至关重要。目前，你的脚本极其简单。但以后当你开始编写长而复杂的脚本时，注释将变得必不可少，以便你或其他人找到代码。假设你写了一段长复杂的代码。几个月后，由于某种原因，你需要修改它。如果你没有注释，寻找标记将很困难，你会浪费时间。你可能什么也无法理解。但不要过度使用。事实上，我们有时会看到每一行都被注释的脚本。最终，你可能会发现这样很漂亮，但注释不是为了把你的脚本翻译成另一种语言！它们是为了帮助你找到代码。如果你开始写注释说明你做了添加，它就不再有用。所以你必须小心不要滥，在需要指出某些内容时少量使用。例如，如果你使用了土豆方法，加一个小注释说明以下代码是该方法的实现是非常用的。回到之前的代码再次修改：\n\
  \n```php\nPHP - Example 5\n<?php // phpinfo();\nphpinfo();\n```\n\n你认为会发生什么？我们会看到两次大表吗？还是什么也看不到？答案是：我们会看到一次大表。为什么？答案很简单。我说\
  \ `//` 被用来指示注释。注释只在 `//` 所在的行上是“有效的”。第一个 `phpinfo()` 因此被忽略，因为它遵循 `//`，但由于第二个在另一行，它不是注释并生成了一个大表。你可以试着把第二个\
  \ `phpinfo()` 放在第一个同一行，两者都成为注释，你会看到空白页面。\n\n现在你知道如何注释一行，但假设你想注释多行。我取之前的代码，我想把两个\
  \ `phpinfo()` 都放入注释中，但让它们处于不同的行。代码看起来像这样：\n\n```php\nPHP - Example 6\n<?php // phpinfo();\n\
  // phpinfo();\n```\n\n但你会同意：如果我们有很多行要注释，使用 `//` 会很快变得沉重；如果由于某种原因你想注释或取消注释块代码，你会浪费大量时间输入或删除所有的\
  \ `//`。这就是为什么有另一种注释文本的方法。比长篇演讲更好：一段代码。\n\n```php\nPHP - Example 7\n<?php /*\nphpinfo();\n\
  phpinfo();\n*/\n```\n\n测试这段代码。发生了什么？你再次发现自己面对一个空白页面。正如你理解的，`/*` 和 `*/` 之间的所有内容都被视为注释。但注意！注释开始于\
  \ `/*` 并结束于 `*/`。再次，一段代码：\n\n```php\nPHP - Example 8\n<?php /*\nphpinfo();\n*/\n\
  phpinfo();\n?>\n```\n\n如果你测试这段代码，你会看到一些新且意想不到的东西：一个 PHP 错误！如果你理解注释从 `/*` 开始到 `*/`\
  \ 结束，你应该能够解释为什么。当 PHP 解释器解释你的代码时，它找到了 `/*` 并说：“注释开始，我不知道任何内容直到我遇到 `*/`”；它继续读取你的代码并遇到了这个著名的\
  \ `*/`。紧之后它读取了 `phpinfo()`，这是一个合法的语句。\n\n\n\n\n\n# 第三章：变量，PHP 的核心\n\n我们将处理一个基础性的章节。你必须跟上节奏，因为进度会非常快。你将面对最长的章节之一，并看到许多新事物，所以请不要进展得太快。慢慢来，当然，如果有必要，不要犹豫反复几次！\n\
  \n## 第一种方法：变量……它到底是什么？\n\n在数学中，变量是一个名称，一个代表未知数量或给定领域内任何事物的符号。在计算中，情况也是如此：变量将一个名称与一个随时间变化的值关联起来。\n\
  \n我们来看一个例子。假设你有一袋装满的苹果。袋子就是变量的名字，袋里的苹果就是变量的值。例如，我可以很容易地把袋里的苹果换成梨。变量的名字始终保持不变（袋子），但变量的值改变了：我们不再是苹果，而是梨。\n\
  \n变量代表了任何编程语言的一个基础概念。这就是为什么我把这一部分称为“变量，PHP 的核心”。当你学习 PHP（或任何其他编程语言）时，你会不断地操作变量。现在，你知道它们的名称和值定义了变量。不过，还有第三个至关重要的特征：值的类型。\n\
  \n再看装满苹果的袋子的例子。袋子是变量的名字，苹果是变量的值，但这个值的类型是什么呢？很简单；苹果是水果。因此，变量是“水果”类型。现在，如果我把牛排放在袋子里，变量的名字保持不变，值变了，但类型也变了！事实上，牛排是肉：那么变量就是“肉类”类型。如果我把苹果换成梨，变量的值改变了，但类型没有变！是的，梨也是水果。你可以看到变量的类型始终与值的类型匹配：两者必须一致。\n\
  \n这番关于杏子的连篇大论，唯一目的是引入变量、名称、值和类型这些概念。如果你不理解这个概念，请不要继续，重新阅读并尝试再次理解。\n\n## 带有 PHP 调料的变量\n\
  \n很好，我们理解了变量的概念。不过，我必须承认：每种编程语言对变量都有特殊的规则。当然，在这里我将讨论带有 PHP 的变量。与其长篇大论，让我们在 PHP 中创建第一个变量吧！\n\
  \n输入这段代码，将其保存为 PHP 文件，打开这个文件，并睁大眼睛！代码如下：\n\n```php\n<?php $my_variable;\n```\n\n\
  恭喜，你刚刚创建了自己的第一个变量。但你发现自己仍然面对一个空白页面；这完全正常。我们创建了一个变量，声明了它，但还没有对它做任何操作。\n\n我们将一起分析这行对你来说是新的代码\
  \ `$ma_variable`。第一个符号是 `$`，用于告诉 PHP 解释器这是一个变量。在 PHP 中操作变量时，必须始终在变量名前加上一个 `$`。在这个第一个符号之后，就是变量本身的名字。在这里，变量的名字是\
  \ `ma_variable`。\n\n但要小心！你不能随任意地命名变量。以下是 PHP 变量的命名规则：你可以使用任何字母（包括小写和大写写字母）、数字字符或下划线。但是，变量名不能以数字开头。\n\
  \n这里是一些有效名称的示例：\n- `$variable;`\n- `$VARIABLE;`\n- `$variable2;`\n- `$variable_3;`\n\
  - `$_Variable;`\n\n现在，是一些无效名称：\n- `$1truc;`\n- `$answer;`\n- `$Var ^;`\n\n\n\n\n\
  \n# PHP 变量与基础\n\n在有效变量名列表中，你可以找到 `$` 和 `VARIABLE`。你应该知道，在 PHP 中，变量名是区分大小写的，这意味着\
  \ PHP 解释器会区分大和小写字母。因此，这行代码创建了两个不同的变量：`K`。\n\n```php\n<?php\n$Variable;\n$VARIABLE\n\
  ```\n\n在这段代码中，与其他所有代码一样，你可能会注意到 `$` 之外还有一个经常出现的符号：分号（`;`）。这个符号也非常重要。它用于告诉 PHP 解释器指令已完成。你必须在每条语句的末尾加上分号，否则\
  \ PHP 解释器会向你报错。\n\n## 什么是语句？\n\n语句是一段代表解释器指令的文本。例如，`phpinfo()` 就是一个语句。你记得吗？它们看起来像这样：\n\
  \n```php\n<?php\nphpinfo();\n\n\n我们发现了什么？分号标志着语句的结束。在这里，语句是 `phpinfo()`，它是你非常熟悉的指令。\n\
  \n## 变量\n\n让我们回到变量上。到目前为止，我们看到了如何创建一个变量（我们也可以称之为赋值）。太棒了。如果我没记错，你被困扰过另外两个概念：值和变量类型。到目前为止，这两个概念还没有介入。我们只是声明了一个变量，而没有给它任何值或类型。但别担心，稍后我们会让事情变得复杂一点点。\n\
  \n## 值与赋值运算符\n\n我之前告诉过你，你只是声明了一个变量：在理论上是 true；但在实践中并非如此。PHP 解释器很懒，你会通过几件事看到这一点。所以我们声明了变量，但没有给它赋值，因此它是空的。我并不确定这一点，但当我们给它某些东西时，它存在了。在\
  \ PHP 中，情况是一样的：你的变量没有被考虑，它没有被声明。为了让它存在，我们必须对它做点什么。在我们的故事里，苹果和梨，赋值值意味着向袋子里填充东西。大致来说，我们可以说它们是一样的事。这就是为什么\
  \ PHP 开发者创建了一个非常有用的工具：赋值运算符（`=`）。\n\n```php\n<?php\n$my_variable = VALUE;\n```\n\
  \n不要尝试运行这段代码，否则你会得到错误。通常情况下，在我们感兴趣的这一行中，我们发现了一个熟悉的元素。在它的右侧有一个新符号代表值。这个新符号，赋值运算符（`=`），允许我们给变量赋值。\n\
  \n如果变量在之前不存在（即我们从未给它赋值过），那么 PHP 解释器在赋值之前会先声明它。赋值运算符（`=`）并不意味着 `$my_variable` 等于\
  \ `value`。这段代码意味着我们将右侧的值赋值给变量 `$my_variable`。这是一个术语问题，但很重要！\n\n## 类型故事\n\n在名字之后，我们刚刚看到了如何给变量赋值。现在，我要告诉你必须了解的第三个概念：类型。但是，类型故事比看起来要复杂得多。正如我之前说的，每种语言对变量都有自己的规则。变量名是如此，类型也是如此。我们可以根据类型的强度对编程语言进行分类。有强类型语言和弱类型语言。严格的规则统治着这个类型概念。但在\
  \ PHP 的情况下，许多人认为它是弱类型的。当你编写 PHP 代码时，不需要担心变量的类型。PHP 解释器会自己处理，并在必要时动态更改类型。\n\n由于我确定我困扰了你，我会给你讲一个新的故事。我去农场主的家里，请他给我\
  \ 3 公斤黄油和 24 个鸡蛋。我可以把它们加起来吗？把鸡蛋和黄油加在一起有意义吗？不，没有意义。另一方面，如果我现在把这两种商品的价格加起来，有意义吗？可以加\
  \ 4 6 欧元，因为它们是一样的东西：欧元加欧元等于欧元。你不能同时处理不同的东西。你不能把一个数字和一个句子相加；你可以加两个分数。但在 PHP 中，你不需要担心这些。\n\
  \n假设我们有两个变量：一个包含数字，另一个包含其他东西，比如字符串“Eve”。如果我在强类型语言中想 sum 这变量，我会遇到问题。在 PHP 中，没问题，你可以这样做。PHP\
  \ 解释器会为你的变量提供正确的类型以便完成加法。这种改变变量类型的操作被称为 `cast` 或类型转换。你知道吗？赋值运算符也是如此！\n\n```php\n\
  <?php\n$ma_variable = 5;\n```\n\n我声明了一个名为 `my_variable` 的变量，类型为 `int`（整数），值为 `5`。另一个例子：\n\
  \n```php\n<?php\n$other_variable = 'Eve';\n```\n\n这一次，我声明了一个名为 `other_variable`\
  \ 的变量，类型为 `string`，值为 \"Eve\"。你不需要关心变量的类型。根据你想要给特定变量赋值的值，PHP 解释器为正确的变量提供了正确的类型。\n\
  \n如果你听了我的话，你现在应该会说：“呃，你傻吗？你跟我们谈论一些完全没用的东西，还是你试图无故混淆我们？！”我承认：类型在 PHP 中先不是什么重要的东西。然而，之后它将极其有用。事实上，我撒了一点小谎（真的非常少，这更多是细节上的死胡同）。我告诉你变量的类型是\
  \ `x` 或 `y`，但为了严格准确，我应该说变量继承了赋值给它的值的类型。记住，这很重要！\n\n## 原生类型\n\n在名字之后，我们刚刚看到了如何给变量赋值。现在，我要告诉你必须了解的：原生类型！\n\
  \n\n\n\n\n# 第四章：PHP 编码者的圣经\n\n在本文教程中，我已经给过你一个或两个链接，让你访问网站 `http://fr.php.net`。但这个网站是什么？这个网站是一座金矿。理论上，要成为一个优秀的\
  \ PHP 编码者（或至少了解该语言的所有技术方面），只需浏览这个网站即可。只是初眼看上去，它似乎很枯燥且毫无吸引力。我将简单解释一下如何深入探索。\n\n首先，当你来到这个网站时，看顶部的链接列表。你可以看到\
  \ `Download`（下载）、`Documentation`（文档）、`Faq` 等。我们感兴趣的链接是 `documentation`。当你点击它时，会进入一个页面。你可以在这个页面看到一个表格；里面有行\
  \ `Formats`、`View Online`（在线查看）和 `Download`。我们感兴趣的是在线文档（在 PHP Group 网站上）：我们将查看 `View\
  \ Online` 这一行！从这里你可以到达文档的所有文章。\n\n你可以看到一切都是按主题分类的。例如看第三部分 `Language Reference`（语言参考）。如果你看这个主题的页面名称，你一定能认出它们：`Functions`（函数）、`variables`（变量）、`expressions`（表达式）、`control\
  \ structures`（控制结构），我们在教程中见过这些。还有一些我们没见过的，如 `references`（引用）、`classes`（类）和 `objects`（对象），但目前并不重要。\n\
  \n我想让你理解的是，一切都是按主题分类的。因此，如果你在文档中寻找某些内容，第一件事就是问你要找的内容主题是什么。如果我想获取关于 `if()` 的信息，我知道它是一个\
  \ `control structure`，所以我会看第三部分的第 16 点 `control structures`。如果你点击这个链接，你会来到一个新的目录：`control\
  \ structures` 的目录。是的，有很多种结构，所以我们把它们都放在不同的页面上，以防混淆。点击该链接，你就会面对其作用描述、运行机制等。\n\n你还可以看到代码示例：我邀请你经常测试它们；这会有助于你的理解。如果你继续向下看页面，有时会看到（红色或黄色的））注释，它们是补充、说明，是你必须阅读的。它们有时包含至关重要的信息。但注意不要盲目信任这些注释，因为可能会出现巨大的错误（已经见过几次了）。你必须始终对你读到的内容进行批判。\n\
  \n现在我们已经简单介绍了文档（内部人士的 doc）是什么，我将向你展示你最常用的部分：函数列表。我们学会了如何编写函数，但函数已经数以千计了，超过一千个！知道这一点非常重要，在创建一个函数之前，检查它是否已经存在。但如何知道呢？非常简单。\n\
  \n让我们举一个真实的例子。假设我想创建一个计算数字平方根的函数。第一件事是问：“我研究的主题是什么？”我在找一个函数，主题是“函数”。我去文档目录，向下移动到第\
  \ VI 部分，函数参考（reference of the functions）。我知道我在找一份工作，但我还能知道什么？我知道平方根是数学的一部分。所以我去寻找数学函数的目录。我查看列表，到了第\
  \ LXXIX 点，`Mathematics`（数学）。酷了，这正是我想要的。\n\n我点击链接，现在就到了数学函数的目录。在页面上向下移动一点，你就会看到目录。这个表格列出了所有函数，并对每个函数的作用给出简短的解释。所以我去找一个谈论平方根的部分。我正在寻找\
  \ `sqrt()`，我找到了它的描述。太棒了，这就是我要找的！点击链接，现在就到了数学函数的目录。\n\n在页面上向下移动一点，你会看到目录。这个表格列出了所有函数，并对每个函数的作用给出简短的解释。所以我去找一个谈论平方根的部分。我正在寻找\
  \ `sqrt()`，我找到了它的描述。太棒了，这就是我要找的！点击链接，现在就到了关于 `sqrt()` 的页面。\n\n在这个页面上，你有几部分信息。首先是大致的说明，在蓝色部分是函数名称（这里是\
  \ `sqrt()`）。紧接着下方有括号，显示了该函数适用于哪些 PHP 版本（例如 `PHP 4`）。如果你使用一个不支持的 PHP 版本，将会产生致命错误（fatal\
  \ error）。此外，你还会看到函数的返回类型。例如，`void` 意味着该函数不返回任何值。如果你使用一个不支持的 PHP 版本，将会产生致命错误。你可能会遇到更复杂的情况，例如\
  \ `PHP 4.3.0`，`PHP 5`。\n\n然后你有一个新行，包含函数名和简短描述。但如何阅读？首先是第一个单词，`float`。这是函数返回的类型。后续部分是参数。在\
  \ `sqrt()` 的情况下，只有一个参数，浮点数（floating-point number），我们想要计算。你还会看到原始类型和数组（arrays）。你可能会看到\
  \ `void`，这意味着该函数不返回任何值。在 `sqrt()` 的情况下，只有一个参数，浮点数，我们想要计算。对于每个参数，你都会有一个名称和一个类型。\n\
  \n有些类型是未知的，例如 `mixed` 或 `callback`。最后两个类型是伪类型（pseudo-types），它们实际上并不存在，只是为了简化阅读。这里有伪类型：\n\
  - `Mixed`：表示可以给出任何类型的参数。\n- `Callback`：表示必须给出一个回调函数名。\n- `Number`：表示必须给出一个数字或整数。\n\
  \n对于回调函数，我们稍后会看到。不要担心，这意味着它们是可选的（optional）。你可能会看到某些参数在方括号 `[]` 中。一旦理解了原型（prototype），你就会看到函数的完整描述。确保阅读它，因为它非常重要。在\
  \ `sqrt()` 的情况下，只有一个参数，浮点数，我们想要计算。\n\n还有其他函数，例如 `mysql_real_escape_string()`。查看描述后，你有一个新标题：参数列表（List\
  \ of parameters）。这一部分将告诉你这个或那个参数的作用。阅读这一部分非常重要。\n\n后续部分告诉你返回值，这也很重要。想象以下情况：函数返回一个数字或布尔值（Boolean）。如果由于某种原因，第一个函数返回了布尔值会怎样？你会得到一个错误。这类错误很常见（已经见过几次）。所以要小心，始终检查你的变量类型。\n\
  \n## 类型转换 (Casting)\n\n在接下来的章节中，我将介绍 PHP 经常执行：类型转换。这是将类型从一种表达式转换为另一种的操作，它是至关重要的。记住我的加法例子：谁能告诉我\
  \ `'Apple' + 'Pear'` 是多少？通过类型转换，我可以回答你：0！我们可以通过两种方式转换变量：使用运算符或函数。我将先简单介绍函数，然后是运算符，最后用转换表结束。\n\
  \n三个函数允许你将表达式转换为特定类型：`strval()`、`floatval()` 和 `intval()`。只需看到函数名，你就应该理解它们的作用。\n\
  - `strval()` 将表达式转换为字符串，例如：\n```php\n$var = 5;\nvar_dump($var);\n$var = strval($var);\n\
  var_dump($var);\n```\n我们确认已经转换了变量！另外两个函数的用法相同：\n```php\n$var = 'lala';\nvar_dump($var);\n\
  $var = intval($var);\nvar_dump($var);\n$var = floatval($var);\nvar_dump($var);\n\
  ```\n三个函数，很多类型，这似乎是个问题，对吧？确实，其他类型没有这种函数（我们可以创建它们，但那没用）。幸运的是，它们有一个第四个函数来救场了：`settype()`。这个函数接受两个参数：我们想要转换的变量（这次不是表达式）以及我们想给它的类型。这里是它的用用示例，非常简单：\n\
  ```php\n$var = '';\nvar_dump($var);\nsettype($var, 'int');\nvar_dump($var);\nsettype($var,\
  \ 'bool');\nvar_dump($var);\nsettype($var, 'float');\nvar_dump($var);\nsettype($var,\
  \ 'array');\nvar_dump($var);\nsettype($var, 'null');\nvar_dump($var);\nsettype($var,\
  \ 'string');\nvar_dump($var);\n```\n你注意到我没有直接在表达式上使用 `settype()`，它是在变量上工作的。支持类型转换的\
  \ PHP 版本：`PHP 4`、`PHP 4.3.0`、`PHP 5`。如果你使用一个不支持的 PHP 版本，将会产生致命错误。\n\n### 布尔值 (Boolean)\n\
  \n我们将布尔值转换为所有类型。正如你所知道，布尔值值 false 或 true。\n- `false` false\n- ` ``` false\n- `0.0`\
  \ false\n- `''`（空字符串）得到 false\n- `'0'` 和 `\"0\"`得到 false\n- 空数组 false false\n-NULLNULL`\
  \ false\n\n### 完整转换 (Full Cast)\n\n如果我们将布尔值转换为整数，如果布值为 false 则结果为 0，如果为 true 则为\
  \ 1。如果我们将浮点数转换为整数，如果浮点数为正数，如果是负数，将向下取整（接近 0）。\n```php\nvar_dump((int) 4.65);\nvar_dump((int)\
  \ -4.65);\n```\n如果我们想将字符串转换为整数，有几种情况：\n- 如果字符串以数字开头（例如 `'0'` 或 `'3.9hello'`），结果整数为整数部分。\n\
  - 如果字符串不以数字开头，结果整数为 0。\n- 对于其他类型（数组、`null` 等），转换未定义，可以变成任何。\n\n### 浮点数 (Floating-Point\
  \ Number)\n\n如果我们将布尔值转换为浮点数，有两种情况：\n- `true` 得到 1\n- `false` 得到 0\n\n如果我们将整数转换为浮点数，浮点数等于整数（逻辑上，`1.0`\
  \ 等于 `1`）。如果我们想将字符串转换为浮点数，与整数一样，取决于字符串从哪里开始`-1.3`得到`-1.3`，`1e3`得到`1000`。对于其他类型，与整数一样。如果我们将布尔值转换为字符串，得到字符串\
  \ `'1'`。如果布值为 false，得到空字符串。如果我们将整数或小数转换为字符串，得到一个表示该数字的字符串（即一个转换到初始类型的字符串得到初始值）。如果我们尝试将数组转换为字符串，得到字符串\
  \ `'Array'`。\n\n### 数组 (Array)\n\n这是最简单的情况：如果你将一个类型转换为数组，你会得到一个以该值为键的数组。在这里我们又提到了类型转换。这个\
  \ PHP 很奇怪，你不觉得吗？这一章确实很长但不复杂。不要犹豫回来重读，这是一个很好的备忘。\n\n## 传递变量 (Pass Variables)\n\n\
  在经历了几个密集的 PHP 章节后，你开始开始积累经验了。到为止，你创建代码，进入页面，只是查看结果而不请求。如果我们通过允许访问者在不修改脚本的情况下与脚本交互来让它变得生动呢？有几种方法传递变量，但我们将从简单的开始：地址（URL）。目前，URL\
  \ 只是告诉你的浏览器调用哪些文件，但 URL 隐藏了很多内容，因为它们可以传输变量！创建一个 PHP 文件，命名为 `url.php` 并输入以下代码：\n\
  ```php\necho '<pre>';\nprint_r($_GET);\necho '</pre>';\n```\n如果你认真学习了数组章节，你应该知道\
  \ `print_r()` 是一个可以漂亮地显示数组的函数。因此，你可以得出 `$_GET` 是一个数组。但你也注意到我没有设置 `$_GET`。所以你可能认为在测试这个脚本时会有错误：谁想要？要到达这个页面，你会在浏览器输入一个\
  \ URL，如 `http://localhost/url.php` 或 `http://127.0.0.1/url.php`。当你到达页面时，运气不错，没有错误！我们看到：\n\
  \n### 全局变量 (Superglobal Variables)\n\n这不会让你成为世界之王，但它告诉了一些：`$_GET` 是一个数组，是定义的，而我没有做它。别被这些大标题吓到——确实，PHP\
  \ 创建了全局变量。这是一个机会，引入了一个新概念：作用域（scope）。你记得我关于变量和函数的说的吗？我说过，是因为作用域。有三“类”变量：全局变量、静态变量和局部变量。我们将来看一个简单的代码：\n\
  ```php\nfunction function_one() {\n    $a = $_GET;\n    return $a;\n}\n$b = function_one();\n\
  if (true) {\n    var_dump($b);\n}\n```\n你会注意到我使用了 `isset()` 函数，它会检查变量是否存在。确实，如果我直接使用\
  \ `$_GET['name']`，而不是去到 `http://localhost/url.php?name=something`，如果 `name` 不存在，PHP\
  \ 将返回一个未定义索引（undefined index）错误。`$_GET` 是数组。\n\n## 魔法引号 (Magic Quotes)\n\n对于这部分，如果你没有\
  \ HTML 基础，你什么也理解。如果你不知道什么是引号，我邀请你看另一个教程，否则你会继续挣扎。在非常有趣的 XSS 漏洞之后，我们将花时间讨论另一个问题（我很烦人的，但很有教育意义）：魔法引号。我想在这里讨论魔法引号（`magic_quotes`）以及它们你仍然未知。我将简要介绍一下。测试这段代码：\n\
  ```php\n$text = 'lala of \"more\"';\necho $text;\necho addslashes($text);\n```\n\
  你看到两个 `echo` 是结构而不是函数，没有显示相同的内容。你可以猜到一个直接显示 `$text`，而另一个显示 `addslashes()` 的返回值。这个函数的目的是非常简单：它在这些字符串（`\"\
  `、`' ` 和 `NULL`）前面添加反斜杠（`\\`）。好的，你可能会问意义是什么，我可以回答你，但我们还没有处理这个主题。可以说，长期以来，这个函数是许多编码者防御可能漏洞的手段。这和表单有什么关系？很简单。在\
  \ PHP 配置文件（我们从未见过的模糊内容），有很多指令。其中一个叫做 `magic_quotes_gpc`。如果这个指令被激活，PHP 将对数组（`$_GET`、`$_POST`、`$_COOKIE`）中的所有值应用\
  \ `addslashes()`。我们也如此！理想情况下，这个指令应该消失：它是为了克服缺乏安全措施。然而，由于这个指令可以被禁用，配置可能会改变。如果你在一个禁用了它的服务器上编写脚本，然后决定换到一个启用了它的服务器，你到处都是反斜杠。你必须修改脚本来修复损坏。坦率地说，PHP\
  \ 6 版本将移除这个指令。\n```php\nif (magic_quotes_gpc()) {\n    $_POST = stripslashes($_POST);\n\
  \    $_GET = stripslashes($_GET);\n    $_COOKIE = stripslashes($_COOKIE);\n}\n```\n\
  操作非常简单：首先，我们检查 `magic_quotes_gpc()`。如果是这样，我们将使用 `addslashes()` 的反向函数：`stripslashes()`。为了对一组值应用函数，我们使用数组。第一个参数是要应用的函数名（在本例中是\
  \ `stripslashes()`）。第二个参数是我们要处理的数组。这个函数是原始的，可以改进，但目前它足够了。无论如何，我们在教程的第二部分还会回来，找出为什么存在这个指令。\n\
  \n## 常量 (Constants)\n\n现在我将非常简单地介绍与表单或变量传输无关的东西：常量。我在这里提到它，是因为我没有别的地方。我们已经听说过常量，但直到现在，我们只说了常量值（例如，常量值\
  \ 5 或常量值 `'lala'`）。\n\n常量和任何其他表达式一样，就像变量、返回值的函数一样。我们可以使用 `define()` 函数来定义常量，第一个参数是名称，第二个是值。\n\
  ```php\ndefine(CONSTANT, 1);\necho CONSTANT;\n```\n常量一旦定义，就无法重新值。测试以下代码：\n```php\n\
  define(NAME, 'VALUE');\necho NAME;\n```\n你可以看到两个 `echo` 是结构而不是函数，没有显示相同的内容。你可以猜到一个直接显示值，而另一个显示返回值。尝试用常量重定义：\n\
  ```php\ndefine(A, 5);\necho A;\ndefine(A, 7);\necho A;\n```\nPan！一个美丽的错误指着他的鼻子。\n\
  \n\n\n\n\n# 第五章 ![](img/Image00003.jpg)\n\n## 第一个实验：计算器\n\n正如第四章所出的，是时候总结一下了。我们已经一起学习了很多\
  \ PHP 的基础知识：通过我们所看到的一切，你可以做出非常了不起的事情。在教程的下半部分，我们将把所有这些付诸实践。但在之前，我们将进行一些实际性工作，以便你自己判断自己的知识水平。这个实验也是第一部分的最后一章，所以请留心。\n\
  \n### 目标\n\n这次 TP（实验课）的目的是让你实现一个计算器。但不要担心，你将制作一个非常简单的计算器。首先，因为你们并不是都有足够的数学技巧来处理更复杂的东西。其次，最重要的是，由于你们已经开始为一些简单的事情而垂口水了，我确信很少有人能写出一个运行完全完美的程序。但不要担心，这个实验很有难度，它是自愿的。我想让你们自己明白，你们并不遥远。你们已经学习了基础知识，但还没有进行很多练习。因此你们极地缺乏经验，正如俗话所：“不经磨不成钢”。所以，如果在整个实验过程中你处处都感到吃力，不要感到意外。\n\
  \n这个计算器将非常简单。它将包含一个带有两个小型文本框和一个下拉列表的表单。访问将使用文本框输入他想要处理的两个数字。用户被要求输入整数。我们可以接受浮点数，但我不想（反正这也不会改变任何结果！）。下拉列表将提供五种操作，即基础操作：加、减、除、乘、取模。一旦访问者输入了数字和操作类型，你的脚本应该显示计算过程和答案。\n\
  \n注意访问者想要除以零（或进行取模）的情况。事实上，在数学中，你不能将一个数字除以零；它得到一个未定义的结果。在 PHP 中也是如此（会显示错误）。因此，你需要检查访问者输入的数字。如果他想除以零或进行取模，你必须显示一条消息：发生错误：不能除以零。\n\
  \n然而，还有第二点你需要检查。某些浏览器通过扩展程序允许你修改表单（即使是所有的 HTML 源代码！）。因此，我们可以修改 `value` 和 `name`\
