  \ the time at the moment is 10:13:16am\n</body>\n</html>\n```\n\n## 第七章：面向对象编程\n\
  \n普通的过程化编程围绕执行简单数据操作的简单过程或函数展开。与之相比，面向对象编程围绕包含数据和函数的对象展开。在转向高级 PHP 编程时，你必须考虑面向对象编程的几个优势。\n\
  \n* 面向对象编程加快了编码和执行速度。\n* 面向对象编程为程序提供了良好的结构。\n* 面向对象编程有助于保持代码整洁。它使代码维护变得容易。\n* 面向对象编程使代码调试变得更容易。\n\
  * 面向对象编程帮助你创建可以重用的应用程序。因此，它减少了代码量和开发时间。\n\n\n\n\n\n# PHP 类\n\n我将创建一个名为 `guns` 的类。它将拥有不同的属性，如\
  \ `name`、`capacity`、`color` 和 `weight`。我会定义不同的变量如 `$gname`、`$gcapacity`、 `$gcolor`\
  \ 和 `$gweight` 来存储属性的特定值。当我创建单个对象时，它们都将继承类的属性和行为。\n\n在创建类的第一步，你必须定义它。你可以使用 `class`\
  \ 关键字来定义类，后面可以跟类名和大括号。这里是定义的枪类。\n\n```php\n<!DOCTYPE html>\n<html>\n<body>\n<?php\
  \ \nclass Guns { \n    // Class Properties\n    public $gname;\n    public $gcolor;\n\
  \    public $gcapacity;\n    public $gweight;\n    // Class Methods\n    function\
  \ setting_the_name($gname) {\n        $this->gname = $gname;\n    }\n    function\
  \ getting_the_name() {\n        return $this->gname;\n    }\n    function setting_the_color($gcolor)\
  \ {\n        $this->gcolor = $gcolor;\n    }\n    function getting_the_color() {\n\
  \        return $this->gcolor;\n    }\n    function setting_the_capacity($gcapacity)\
  \ {\n        $this->gcapacity = $gcapacity;\n    }\n    function getting_the_capacity()\
  \ {\n        return $this->gcapacity;\n    }\n    function setting_the_weight($gweight)\
  \ {\n        $this->gweight = $gweight;\n    }\n    function getting_the_weight()\
  \ {\n        return $this->gweight;\n    }\n} \n?>\n</body>\n</html>\n```\n\n##\
  \ 类对象\n\n现在我已经定义了类，我可以在其基础上构建对象了。我可以根据程序的需求创建一个或多个对象。每个对象都拥有类中正确定义的所有方法和属性，但属性的值会有所不同。你可以使用\
