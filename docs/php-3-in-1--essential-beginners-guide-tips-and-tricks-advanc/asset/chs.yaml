  \ `krsort` 关键字。\n\n\n\n\n\n# 第六章：PHP 超全局变量\n\n超全局变量基本上是内置变量，在不同的作用范围内都是可用的。我将在接下来的代码示例中逐一讨论它们，并看看它们的功能。\n\
  \n## PHP $GLOBALS\n\n`$GLOBALS` 是 PHP 中的一个超级变量，你可以用它从 PHP 脚本的任何位置（例如方法和函数）访问不同的全局变量。PHP\
  \ 倾向将变量存储在一个名为 `$GLOBALS[index]` 的数组中。索引的名称即变量名。\n\n```php\n<!DOCTYPE html>\n<html>\n\
  <body>\n<?php\n$a = 55;\n$b = 15;\nfunction additionofnumbers() {\n    $GLOBALS['c']\
  \ = $GLOBALS['a'] + $GLOBALS['b'];\n}\nadditionofnumbers();\necho $c;\n?>\n</body>\n\
  </html>\n```\n\n```php\nphp main.php\n```\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n70\n</body>\n</html>\n```\n\n## PHP 超全局变量 = $_SERVER\n\n超全局变量是某种内置变量，在不同的作用范围内均是可用的。`$_SERVER`\
  \ 包含了有关路径、标头和脚本位置的信息。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<form method=\"\
  post your information\" action=\"<?php echo $_SERVER['PHP_SELF'];?>\">\n    Name:\
  \ <input type=\"text\" name=\"firstname\">\n    <input type=\"submit\" value=\"\
  Please submit here\">\n</form>\n<?php\nif ($_SERVER[\"REQUEST\"] == \"POST\") {\n\
  \    $uname = $_REQUEST['firstname'];\n    if (empty($uname)) {\n        echo \"\
  Name is currently empty. Please fill in the requisite information.\";\n    } else\
  \ {\n        echo $uname;\n    }\n}\n?>\n</body>\n</html>\n```\n\n```php\nphp main.php\n\
  ```\n\n```html\n<html>\n<body>\n<form method=\"post your information\" action=\"\
  main.php\">\n    Name: <input type=\"text\" name=\"firstname\">\n    <input type=\"\
  submit\" value=\"Please submit here\">\n</form>\n</body>\n</html>\n```\n\n## PHP\
  \ $_POST\n\n### 变量变量\n\n`$_POST` 是一个超全局变量，你可以用它在提交 HTML 表单后收集数据。你可以用它来传递不同的变量。下面的示例展示了一个带有输入框和提交按钮的表单。当用户点击按钮提交数据时，表单数据将处理到你在\
  \ HTML 表单 `action` 属性中指定的文件。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<form\
  \ method=\"post your information\" action=\"<?php echo $_SERVER['PHP_SELF'];?>\"\
  >\n    Name: <input type=\"text\" name=\"firstname\">\n    <input type=\"submit\"\
  \ value=\"Please submit here\">\n</form>\n<?php\nif ($_SERVER[\"REQUEST\"] == \"\
  POST\") {\n    $uname = $_POST['firstname'];\n    if (empty($uname)) {\n       \
  \ echo \"Name is currently empty. Please fill in the requisite information.\";\n\
  \    } else {\n        echo $uname;\n    }\n}\n?>\n</body>\n</html>\n```\n\n```php\n\
  php main.php\n```\n\n```html\n<html>\n<body>\n<form method=\"post your information\"\
  \ action=\"main.php\">\n    Name: <input type=\"text\" name=\"firstname\">\n   \
  \ <input type=\"submit\" value=\"Please submit here\">\n</form>\n</body>\n</html>\n\
