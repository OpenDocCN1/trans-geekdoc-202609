  \ 循环\n\nPHP 代码中还有另一种循环，即 `for` 循环。它是强大的循环，因为它允许你在循环内部设置变量、在迭代时测试条件并在不同的迭代中修改变量。`for`\
  \ 循环的第一部分是初始化，你可以在此处声明循环计数器。`for` 循环的第二部分是条件，我们可以检查计数器是否匹配条件。当返回假时，循环停止执行代码块。当循环结束时，执行修改表达式。\n\
  \n```html\n<html>\n<head>\n<title>这是我的 PHP 脚本</title>\n</head>\n<body>\n<?php\n\
  for ($a = 1; $a <= 25; $a++) {\n    echo \"The requisite value of the variable a\
  \ should be: \" . $a . \"\\n\";\n    echo \"The do...while loop will go on.\\n\"\
  ;\n}\n?>\n</body>\n</html>\n```\n\n`php main.php`\n...（输出 1 到 25）\n\n分号分隔 `for`\
  \ 循环中的所有表达式。在 `for` 循环的首次迭代开始时，执行初始化表达式。计数从 0 开始。每次测试条件，在发现条件为真后循环继续进行。最后，在迭代结束时，执行修改表达式。`for`\
  \ 循环设计用于一个经常变化的单个值。\n\n## for each 循环\n\n遍历数组内部每个元素的循环被称为 `foreach` 循环。\n\n```html\n\
  <html>\n<head>\n<title>这是我的 PHP 脚本</title>\n</head>\n<body>\n<?php\n$states = array(\"\
  New York\", \"Los Angles\", \"Florida\", \"California\", \"Texas\", \"Virginia\"\
  , \"South Dakota\", \"North Dakota\");\nforeach ($states as $states) {\n    echo\
  \ \"I visited \" . $states . \"\\n\";\n}\n?>\n</body>\n</html>\n```\n\n### break\
