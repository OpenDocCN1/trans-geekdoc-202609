  \ . \"\\n\";\n?>\n</body>\n</html>\n```\n\n### 多维数组\n多维数组是包含多个数组的数组。PHP 支持深度为二、四或六级的数组。然而，深度超过三级的数组很难获取。在处理二维数组时，你可能需要两个索引来选择特定元素。在处理三维数组时，你可能需要三维数组。我将创建一个三列的数组；第一列指示汽车名称，第二列指示库存位置，第三列指示售出的汽车数量。\n\
