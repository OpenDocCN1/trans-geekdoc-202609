  \ Pratt\n\n### 引言\n\n这关于 `PHP` 编程的书包含了关于如何编写 `PHP` 代码和构建网站的经过证明的步骤和策略。我提供了功能性代码以便你研究细节、理解其工作原理并立即开始实践。你可以将代码加载并直接显示在网页上，因为每段代码都嵌入在\
  \ `HTML` 页面中。处理代码的最佳方法是通过引入你想做的更改来对其进行自定义，然后将其加载到网页上。`PHP` 是一门有趣的语言，但也具有很的技术性。你可能会看到编辑器中到处弹出错误。因此，你应该仔细学习书中提供的代码。首先将它们按编写的内容粘贴到编辑器中，然后加载它们以显示网页。最具技术性的部分是关于对象编程的章节。然而，通过额外的关注，你也可以掌握它。编程取决于你在文本编辑器中练习的多少。你用不同的风格和不同的值编写代码次数越多，掌握它的机会就越大。\n\
  \n\n\n\n\n## 第一章：学习 PHP 的第一步\n\n有很多理由可以使用 PHP 创建你的程序。你可能对学习 PHP 感兴趣，因为你想创建一个带有交互元素的网站。\n\
  \n### Web 世界中的 PHP\n\nPHP 用于构建网站。与运行在个人桌面电脑上仅供单人使用的 PHP 程序不同，它通常运行在 Web 服务器上，并由许多使用电脑\
  \ Web 浏览器的人访问。本节将解释 `PHP` 如何调整到 Web 服务器和 Web 浏览器之间的交互中。\n\n当你坐在电脑前并借助 `Firefox`\
  \ 或 `Safari` 等浏览器打开一个页面时，你可能会在互联网上引发你的电脑和你任何人的电脑之间的一小段“对话”。Web 服务器读取你用 PHP 编写的程序。这些程序就像是你通过\
  \ `PHP` 传给 Web 服务器的简单指令。Web 服务器会决定做什么。\n\n`PHP` 既指解释器也指编程语言。`PHP` 被称为服务器端语言，因为它倾向于运行在特定的\
  \ Web 服务器上。像 `Flash` 和 `JavaScript` 这样的技术和语言被称为客户端，因为它们运行在桌面 PC 或 Web 客户端上。`PHP`\
  \ 程序中给指令会导致解释器输出网页。这些指令会触发 Web 浏览器执行如弹出新窗口等的操作。一旦 Web 浏览器将生成的网页发送给客户端，`PHP` 似乎就消失了。如果页面内容包含\
  \ `JavaScript`，`JavaScript` 会运行，但与生成页面的 `PHP` 程序保持断开。\n\n由 `PHP` 生成的动态页面就像写给世界另一端朋友的信。你可以在页面上添加你脑海中的任何内容，并将其发送给世界另一边的朋友。信的内容是为你发送的特定人员定制的。一旦信封放入信箱，你就无法更改它了。它会立即飞向目的地。你无法在朋友阅读时对其进行修改。\n\
  \n### 为什么选择 PHP？\n\n`PHP` 是免费使用的。无论你在旧 PC 还是价值百万美元的超级计算机上运行解释器，你都不需要支付任何许可费、维护费、升级费和支持费。大多数\
  \ `Linux` 发行版都预装了 `PHP`。如果你的系统没有安装，你可能正在使用其他操作系统，如 `Windows`。作为开源项目之一，`PHP` 允许任何人检查它。即使你缺乏\
  \ `PHP` 的技术知识，你也可以安排人来为你进行调查。\n\n# 安装 PHP\n\n在接下来的章节中，我将解释在电脑操作系统上安装 `PHP` 的不同步骤。\n\
  \n## 安装 Web 服务器\n\n你不能像运行 `HTML` 那样直接在浏览器中运行 `PHP`。如果你想运行 `PHP`，需要在电脑系统中安装一个服务器，以便浏览器可以解析\
  \ `PHP` 脚本，然后对该数据库运行几次 `MySQL` 查询以返回结果。你也可以使用支持 `MySQL` 和 `PHP` 的主机，以便他们将其上传到服务器并允许你测试你的网站。你可以在电脑系统上安装不同的服务器，如\
  \ `WAMP`、`XAMP` 和 `MAMP`。我将解释适用于 Windows 操作系统的 `XAMP` 安装过程。它是一个适用于 Windows、Linux\
  \ 和 Mac 的完全免费开源平台 Web 服务器包。\n\n该过程的第一步是下载最新版本的 `XAMP`。一旦下载完成，你需要在本地机器上找到该文件，然后双击它以启动安装过程。你的防毒病毒系统可能会干扰该过程。你可能需要关闭它，直到服务器完成安装，以避免潜在的问题。\n\
  \n### 文本编辑器\n\n你需要一个文本编辑器来编写 `PHP` 代码。任何文本编辑器都可以满足你的需求。你甚至可以使用 `Notepad` 来编写代码。然而，`Notepad++`\
  \ 将帮助你以更简洁高效的方式编写代码。它会高亮语法并具有自动完成功能。文本编辑器将为你节省时间。\n\n现在你已经安装了 `XAMP`，你应该启动 `apache`\
  \ Web 服务器让浏览器运行你的脚本。点击 `XAMP` 的控制面板。它将启动 `Apache`。每个 `PHP` 脚本嵌入在 `HTML` 页面中，因为 `PHP`\
  \ 脚本用于构建网页。\n\n### PHP 变量\n\n如果你想用 `PHP` 构建网站，你需要大量的数据并知道如何存储它们。数据可以是名称、日期、图片或数字。`PHP`\
  \ 提供了一种存储数据的方法。每个 `PHP` 变量前面都有 `$` 符号。变量名和符号之间没有空格。\n\n```html\n<html>\n<head>\n\
  <title>This is a PHP page</title>\n</head>\n<body>\n<?php\n$txt = \"I am learning\
  \ PHP scripts to build my webpage.\";\necho $txt;\n?>\n</body>\n</html>\n```\n\n\
  `php main.php`\n```html\n<html>\n<head>\n<title>This is a PHP page</title>\n</head>\n\
  <body>I am learning PHP scripts to build my webpage.</body></body>\n</html>\n```\n\
  \n上面的代码包含两个部分。第一部分是在文本编辑器中创建的脚本，第二部分位于 `$PHP main.php` 行。这一部分在你执行 `PHP` 脚本时显示在服务器端。变量是区分大小写的，这意味着\
  \ `$txt` 和 `$Txt` 是不同的。此外，它们必须以字母或下划线开头。它们不能以数字开头，可以包含字母数字。`PHP` 是一种类型语言，所以你不需要为变量定义数据类型。常见的数据类型有整数、字符串、浮点数、数组、布尔和对象。\n\
  \n### 字符串拼接\n\n在这个脚本中，我将解释如何组合两个 `PHP` 脚本。我将使用点 (`.`) 来连接两个字符串。\n\n```html\n<html>\n\
  <head>\n<title>This is a PHP page</title>\n</head>\n<body>\n<?php\n$txt = \"I am\
  \ learning PHP scripts to build my webpage.\";\necho \"Hey Stephen! .\" .$txt. \"\
  \ You may join me if you have time.\";\n?>\n</body>\n</html>\n```\n\n`php main.php`\n\
  ```html\n<html>\n<head>\n<title>This is a PHP page</title>\n</head>\n<body>Hey Stephen!\
  \ I am learning PHP scripts to build my webpage. You may join me if you have time.</body>\n\
  </html>\n```\n\n### PHP 常量\n\n常量类似于变量的区别在于不能更改它们的值。当你定义常量时，使用 `define()` 方法为其分配一个名称和值。下面的示例显示了如何定义常量。\n\
  \n```html\n<html>\n<head>\n<title>This is a PHP page</title>\n</head>\n<body>\n\
  <?php\ndefine(\"msg\", \"I am learning PHP scripts to build my webpage.\");\necho\
  \ msg;\n?>\n</body>\n</html>\n```\n\n`php main.php`\n```html\n<html>\n<head>\n<title>This\
  \ is a PHP page</title>\n</head>\n<body>I am learning PHP scripts to build my webpage.</body>\n\
  </html>\n```\n\n你可以通过添加一个参数来指定是否希望常量对大小写敏感。否则，它是区分大小写的。我将通过更改 `echo` 命令的大小写来运行上面的脚本。\n\
  \n```html\n<html>\n<head>\n<title>This is a PHP page</title>\n</head>\n<body>\n\
  <?php\ndefine(\"msg\", \"I am learning PHP scripts to build my webpage.\");\necho\
  \ MSG;\n?>\n</body>\n</html>\n```\n\n`php main.php`\n```html\n<html>\n<head>\n<title>This\
  \ is a PHP page</title>\n</head>\n<body>MSG</body>\n</html>\n```\n`PHP Notice: Use\
  \ of undefined constant MSG - assumed 'MSG' in /home/cg/root/7025528/main.php on\
  \ line 9` 现在我将为脚本添加另一个接收布尔值的参数。即使你更改大小写，脚本也会运行良好。\n\n```html\n<html>\n<head>\n<title>This\
  \ is a PHP page</title>\n</head>\n<body>\n<?php\ndefine(\"msg\", \"I am learning\
  \ PHP scripts to build my webpage.\", true);\necho MSG;\n?>\n</body>\n</html>\n\
  ```\n\n`php main.php`\n```html\n<html>\n<head>\n<title>This is a PHP page</title>\n\
  </head>\n<body>I am learning PHP scripts to build my webpage.</body>\n</html>\n\
  ```\n常量必须以下划线和符号开头。它们不应该以 `$` 符号开头。## PHP 运算符\n\n`PHP` 使用不同的运算符对值和变量执行各种操作。现在我们将以分组的形式查看\
  \ `PHP` 中使用的不同运算符。某些运算符会对值执行特定的数学运算并返回计算结果。\n\n\n\n\n\n* `$a + $b` 用于计算两个变量的和。\n\
  * `$a - $b` 用于计算两个变量的差。\n* `$a * $b` 用于计算两个变量的乘积。\n* `$a / $b` 用于计算两个变量的除。\n* `$a\
  \ % $b` 用于计算两个变量的余数。\n* `$a ** $b` 用于计算两个变量的幂。\n* `$a = $b` 用于获取 `$b` 的值并赋值给 `$a`。\n\
  \n## 第二章：表达式与控制\n\n前面的章节向你介绍了 PHP 的基础知识，如安装框架和 PHP 变量。本章将带你了解 PHP 编程是如何工作的，以及你如何控制程序的流程。\n\
  \n### 表达式\n\n我现在将从 PHP 的基础部分开始。表达式是值、运算符、变量和函数的组合，并结果。你可以通过组合布尔运算符（如 `OR`、`AND`\
  \ 和 `XOR`）来编写表达式。在下一个示例中，我将在以下代码块中解释简单的表达式。\n\n```html\n<html>\n<head>\n  <title>This\
  \ is a PHP web page</title>\n</head>\n<body>\n  <?php\n  echo \"e: \\[\" . (80 >\
  \ 9) . \"]\\n\";\n  echo \"f: \\[\" . (10 == 6) . \"]\\n\";\n  echo \"g: \\[\" .\
  \ (5 == 0) . \"]\\n\";\n  echo \"i: \\[\" . (2 == 2) . \"]\\n\";\n  ?>\n</body>\n\
  </html>\n```\n\n```bash\nphp main.php\n```\n\n```html\n<html>\n<head>\n  <title>This\
  \ is a PHP web page</title>\n</head>\n<body>\n  e: [1]\n  f: []\n  g: []\n  i: [1]\n\
  </body>\n</html>\n```\n\n你也可以通过以下代码来获取 `true` 和 `false` 的输出。\n\n```html\n<html>\n\
  <head>\n  <title>This is a PHP web page</title>\n</head>\n<body>\n  <?php\n  echo\
  \ \"e: \\[\" . TRUE . \"]\\n\";\n  echo \"f: \\[\" . FALSE . \"]\\n\";\n  ?>\n</body>\n\
  </html>\n```\n\n```bash\nphp main.php\n```\n\n```html\n<html>\n<head>\n  <title>This\
  \ is a PHP web page</title>\n</head>\n<body>\n  e: [1]\n  f: []\n</body>\n</html>\n\
  ```\n\n在某些语言中，`FALSE` 可能被定义为 `-1` 或零，因此在其他语言中，你应该验证此布尔表达式的定义。\n\n### 关系运算符\n\n关系运算符接收两个操作数。它测试这些操作数并返回布尔结果（`FALSE`\
  \ 或 `TRUE`）。三种关系运算符：逻辑、相等和比较如下：\n\n### 相等运算符\n\n相等运算符是 `==`。千万不要将其与单等号赋值运算符混淆。第一个语句分配一个特定的值，第二个语句对其进行测试以检查表达式中的相等性。\n\
  \n```html\n<html>\n<head>\n  <title>This is a PHP web page</title>\n</head>\n<body>\n\
  \  <?php\n  $month = \"June\";\n  if ($month == \"June\") echo \"The summer season\
  \ has arrived. It is time to go to the beach.\";\n  ?>\n</body>\n</html>\n```\n\n\
  ```bash\nphp main.php\n```\n\n```html\n<html>\n<head>\n  <title>This is a PHP web\
  \ page</title>\n</head>\n<body>\n  The summer season has arrived. It is time to\
  \ go to the beach.\n</body>\n</html>\n```\n\n通过返回 `TRUE` 或 `FALSE`，相等运算符允许你使用 `if`\
  \ 语句测试某些条件。然而，PHP 被认为是一种弱类型语言。如果相等表达式的两个操作数属于不同的类型，PHP 将其转换为某种有意义的形式。任何由数字组成的字符串在与数字比较时都将被转换为数字。\n\
  \n### 比较运算符\n\n通过使用比较运算符，你可以测试大于相等和不等的情况。在构建网站时，PHP 提供了大于、小于选项供你使用。\n\n```html\n\
  <html>\n<head>\n  <title>This is a PHP web page</title>\n</head>\n<body>\n  <?php\n\
  \  $x = 20;\n  $y = 35;\n  if ($x > $y) echo \"$x is greater than $y\\n\";\n  if\
  \ ($x < $y) echo \"$x is less than $y\\n\";\n  if ($x >= $y) echo \"$x is greater\
  \ than or equal to $y\\n\";\n  if ($x <= $y) echo \"$x is less than or equal to\
  \ $y\\n\";\n  ?>\n</body>\n</html>\n```\n\n```bash\nphp main.php\n```\n\n```html\n\
  <html>\n<head>\n  <title>This is a PHP web page</title>\n</head>\n<body>\n  20 is\
  \ less than 35\n  20 is less than or equal to 35\n</body>\n</html>\n```\n\n### 逻辑运算符\n\
  \n逻辑运算符产生假或真的结果，因此它们也被称为布尔运算符。共有四种这样的运算符。\n\n* `AND`\n* `OR`\n* `XOR`\n* `NOT`\n\
  \n\n\n\n\n```html\n<html>\n<head> <title>This is a PHP web page</title> </head>\n\
  <<body>\n<?php\n$x = 1;\n$y = 0;\necho ($x AND $y) . \"\\n\";\necho ($x or $y) .\
  \ \"<\\n\";\necho ($x XOR $y) . \"\\n\";\necho !$x . \"\\n\";\n?>\n</body>\n</html>\n\
  ```\n`$php` `main.php`\n\n```html\n<html>\n<head> <title>This is a PHP web page</title>\
  \ </head>\n<body> 1< 1 </body>\n</html>\n```\n\n### PHP 条件语句\n\nPHP 条件语句会改变程序的执行流。它们允许你对不同的事物提出特定问题，然后以多种方式对答案做出响应。条件语句在动态网页中占据核心地位，因为它们让观众每次访问你的网页时都能轻松获得不同的输出。条件语句有三种类型：`if`\
  \ 语句、`?` 运算符和 `switch` 语句。\n\n## if 语句\n\n控制程序流的方法一种是使用 `if` 语句。`if` 语句的内容可以是有效的\
  \ PHP 表达式，包括比较、相等性判断以及函数的返回值。你希望 PHP 在 `if` 条件为**真 (TRUE)** 时执行的操作需要放在大括号 `{}` 中。如果你只有一条语句要执行，可以忽略大括号。但是，如果你始终使用大括号，就可以避免寻找那些难以排查的\
  \ Bug。\n\n```html\n<html>\n<head> <title>This is a PHP Script</title> </head>\n\
  <<body>\n<?php\nif ($my_account_balance < 1000) {\n    $my_money = 10000;\n    $my_account_balance\
  \ += $my_money;\n}\n?>\n</body>\n</html>\n```\n\n## else 语句\n\n当条件语句不为**真 (TRUE)**时，你可能需要继续执行主代码，但你可能也想做一些别的事情。这就是\
  \ `else` 语句发挥用场的地方。通过 `if-else` 语句的帮助，如果条件为**真 (TRUE)**，则执行第一个条件语句；如果为**假 (FALSE)**，则执行第二个。这两个选项中必须有一个被执行。在当前情况下，两者都不会同时执行。接下来的示例展示了\
  \ `if-else` 结构。\n\n```html\n<html>\n<head> <title>This is a PHP Script</title> </head>\n\
  <<body>\n<?php\n$greetings_time = date(\"H\");\nif ($greetings_time < \"12\") {\n\
  \    echo \"I wish you a very good day!\";\n} else {\n    echo \"I wish you have\
  \ an excellent night!\";\n}\n?>\n</body>\n</html>\n```\n`$php` `main.php`\n\n```html\n\
  <html>\n<head> <title>This is a PHP Script</title> </head>\n<<body> I wish you a\
  \ very good day!</body>\n</html>\n```\n\n## if….elseif….else 语句\n\n这种语句比前两种长，并且可以针对两个以上的条件执行多个代码块。它非常适合测试多种可能性。请看以下示例中代码是如何工作的。\n\
  \n```html\n<html>\n<head> <title>This is a PHP Script</title> </head>\n<<body>\n\
  <?php\n$greetings_time = date(\"H\");\nif ($greetings_time < \"12\") {\n    echo\
  \ \"I wish you a very good morning!\";\n} elseif($greetings_time < \"20\") {\n \
  \   echo \"I wish you have a very good noon!\";\n} else {\n    echo \"I wish you\
  \ have an excellent night!\";\n}\n?>\n</body>\n</html>\n```\n`$php` `main.php`\n\
  \n```html\n<html>\n<head> <title>This is a PHP Script</title> </head>\n<<body> I\
  \ wish you a very good morning!</body>\n</html>\n```\n\n我现在将更改时间来测试其他代码块是否工作。我将在代码中填入\
  \ `10`。\n\n```html\n<html>\n<head> <title>This is a PHP Script</title> </head>\n\
  <<body>\n<?php\n$greetings_time = date(\"10\");\nif ($greetings_time < \"12\") {\n\
  \    echo \"I wish you a very good morning!\";\n} elseif($greetings_time < \"20\"\
  ) {\n    echo \"I wish you have a very good noon!\";\n} else {\n    echo \"I wish\
  \ you have an excellent night!\";\n}\n?>\n</body>\n</html>\n```\n`$php` `main.php`\n\
  \n```html\n<html>\n<head> <title>This is a PHP Script</title> </head>\n<<body> I\
  \ wish you a very good morning!</body>\n</html>\n```\n\n现在我将为计时器添加 `15`。\n\n```html\n\
  <html>\n<head> <title>This is a PHP Script</title> </head>\n<<body>\n<?php\n$greetings_time\
  \ = date(\"15\");\nif ($greetings_time < \"12\") {\n    echo \"I wish you a very\
  \ good morning!\";\n} elseif($greetings_time < \"20\") {\n    echo \"I wish you\
  \ have a very good noon!\";\n} else {\n    echo \"I wish you have an excellent night!\"\
  ;\n}\n?>\n</body>\n</html>\n```\n`$php` `main.php`\n\n```html\n<html>\n<head> <title>This\
  \ is a PHP Script</title> </head>\n<<body> I wish you have a very good noon!</body>\n\
  </html>\n```\n\n在最后一个示例中，我将为计时器添加 `23`。\n\n```html\n<html>\n<head> <title>This is\
  \ a PHP Script</title> </head>\n<<body>\n<?php\n$greetings_time = date(\"23\");\n\
  if ($greetings_time < \"12\") {\n    echo \"I wish you a very good morning!\";\n\
  } elseif($greetings_time < \"20\") {\n    echo \"I wish you have a very good noon!\"\
  ;\n} else {\n    echo \"I wish you have an excellent night!\";\n}\n?>\n</body>\n\
  </html>\n```\n`$php` `main.php`\n\n```html\n<html>\n<head> <title>This is a PHP\
  \ Script</title> </head>\n<<body> I wish you have an excellent night!</body>\n</html>\n\
  ```\n\n## switch 语句\n\n当你处理单个变量的多个 `cases` 时，`switch` 语句非常有用。当某个情况发生时，将执行相应的条件语句。参考以下示例：\n\
  \n```html\n<html>\n<head> <title>This is a PHP Script</title> </head>\n<<body>\n\
  <?php\n$states = \"Texas\";\nswitch ($states) {\n    case \"Texas\":\n        echo\
  \ \"I have visited Texas in the United States\";\n        break;\n    case \"California\"\
  :\n        echo \"I have visited California in the United States\";\n        break;\n\
  \    case \"Los Angeles\":\n        echo \"I have visited Los Angeles in the United\
  \ States\";\n        break;\n    case \"Florida\":\n        echo \"I have visited\
  \ Florida in the United States\";\n        break;\n    case \"New York\":\n    \
  \    echo \"I have visited New York in the United States\";\n        break;\n  \
  \  case \"Las Vegas\":\n        echo \"I have visited Las Vegas in the United States\"\
  ;\n        break;\n    case \"Virginia\":\n        echo \"I have visited Virginia\
  \ in the United States\";\n        break;\n    default:\n        echo \"I have not\
  \ visited any state in the United States which I have not visited the United States\"\
  ;\n}\n?>\n</body>\n</html>\n```\n\n我只在语句开头提了一次 `$states`。之后，`case` 命令检查代码中的匹配项。在\
  \ `switch` 语句的帮助下，你永远不会在 `case` 命令中使用大括号。相反，它们以冒号开始并以 `break` 语句结束。`switch` 语句内部完整的\
  \ `cases` 列表封装在大括号内。如果你想跳出 `switch` 语句，可以使用 `break` 命令。该命令要求 PHP 跳出语句并跳过下一个语句。`switch`\
  \ 语句中必须添加 `default` 操作，这样如果没有满足任何 case 条件，代码就会回退到该操作。你可以在我上面包含的最新示例中看到这一点。\n\n###\
  \ 替代语法\n\n有一种替代语法可以让你获得相同的结果。你可以用冒号和 `endswitch` 命令替换大括号。它的工作效果和之前一样良好。\n\n```html\n\
  <html>\n<head> <title>This is a PHP Script</title> </head>\n<<body>\n<?php\n$states\
  \ = \"New York\";\nswitch ($states):\n    case \"Texas\":\n        echo \"I have\
  \ visited Texas in the United States\";\n        break;\n    case \"California\"\
  :\n        echo \"I have visited California in the United States\";\n        break;\n\
  \    case \"Los Angeles\":\n        echo \"I have visited Los Angeles in the United\
  \ States\";\n        break;\n    case \"Florida\":\n        echo \"I have visited\
  \ Florida in the United States\";\n        break;\n    case \"New York\":\n    \
  \    echo \"I have visited New York in the United States\";\n        break;\n  \
