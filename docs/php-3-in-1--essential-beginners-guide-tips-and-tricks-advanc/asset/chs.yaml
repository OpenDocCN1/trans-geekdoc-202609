  ;\n        break;\n    case \"Virginia\":\n        echo \"I have visited Virginia\
  \ in the United States\";\n        break;\n    default:\n        echo \"I have not\
  \ visited any state in the United States which I have not visited the United States\"\
  ;\nendswitch;\n?>\n</body>\n</html>\n```\n\n\n\n\n\n## 第三章：PHP 循环\n\n计算机最优秀的特性之一是它们能够不知疲倦且快速地重复某些计算任务。你可能希望软件重复某些代码，直到你从中推导出某些结果为止。PHP\
  \ 提供了不同类型的循环结构，为实现这一目标提供了完美的方法。一旦进入代码块，只有在条件正确的情况下才能退出。\n\n### while 循环\n\n`while`\
  \ 循环在特定条件一直为真的情况下多次执行代码块。以下代码将执行相同的操作。只要我设置的条件保持真，它就会一直运行。\n\n```html\n<html>\n\
  <head>\n<title>这是我的 PHP 脚本</title>\n</head>\n<body>\n<?php\n$a = 1;\nwhile ($a <=\
  \ 25) {\n    echo \"The requisite value of the variable a should be: \" . $a . \"\
  \\n\";\n    $a++;\n}\n?>\n</body>\n</html>\n```\n\n`php main.php`\n\n```html\n<html>\n\
