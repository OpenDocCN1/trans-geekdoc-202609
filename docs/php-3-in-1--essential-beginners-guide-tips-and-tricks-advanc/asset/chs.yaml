  \ \"7 + 33 = \" . summing(7, 33) . \"\\n\";\necho \"2 + 9 = \" . summing(2, 9) .\
  \ \"\\n\";\necho \"2 + 10 = \" . summing(2, 10) . \"\\n\";\necho \"29 + 14 = \"\
  \ . summing(29, 14) . \"\\n\";\necho \"82 + 94 = \" . summing(82, 94) . \"\\n\"\
