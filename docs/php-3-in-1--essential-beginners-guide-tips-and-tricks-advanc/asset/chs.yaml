  \n\n\n\n## 第四章：PHP 函数\n\n任何编程语言的基础之一都包括一个存储数据的地方，这是控制程序流的手段。当你编写一个复杂的程序时，你需要一些东西来辅助并简化这一过程。这正是函数发挥作用的地方。\n\
  \n函数是一组执行特定任务并返回一个值的语句。你可以将多次使用的某部分特定代码提取出来，并将其放入函数中。然后，当你需要执行这些代码时，可以通过该函数的名称来调用它。\n\
  \n与内联代码相比，函数具有许多优势：\n- 减少字数输入量。\n- 减少编程错误。\n- 缩短加载时间。\n- 缩短执行时间。\n- 卓越的效率。你只需要编译一次，然后就可以通过名称调用它，其包含的整个代码块都会执行。\n\
  \n本章将带你了解定义和调用函数的过程，以及如何前后向传递参数。PHP 提供了许多现成的内置函数，这使得 PHP 成为一种非常丰富的语言。如果你想使用一个函数，可以通过它的名称进行调用。函数内部的括号告诉\
  \ PHP 你正在引用一个函数。\n\n`print` 函数是一个伪函数，也称为构造函数（construct）。唯一的区别在于，你有时可能想省略括号。你可以向函数填充任何数量的参数。你甚至可以填充零参数。\n\
  \n`phpinfo()` 函数对于获取当前 PHP 安装信息非常有用。然而，它对于白帽黑客来说也同样有用。函数调用不应保留在 Web 准备绪模式下以避免受到攻击。估计大约有\
  \ 1000 个内置函数。除此之外，你也可以创建自己的自定义函数。\n\n### PHP 函数的关键特性\n\n- 函数是一组语句包，你可以在程序中多次使用它。\n\
  - 函数不会在网页加载时加载。\n- 只有在你进行函数调用时，函数才会执行。\n\n\n\n\n\n### 定义函数\n\n函数定义以 `function` 关键字开始。在名称之后，你必须输入一个字母或下划线。之后，你可以输入不同的字母、下划线或数字。你还必须为函数加上括号。函数名是区分大小写的，这意味着\
  \ `print` 和 `PRINT` 是两个不同的函数。函数语句可以包含多个 `return` 语句，这会强制你的函数停止执行并返回到调用代码。如果你向 `return`\
  \ 语句传载一个值，调用代码就可以获取它。\n\n```html\n<html>\n<head>\n<title>这是我的 PHP 脚本</title>\n</head>\n\
  <body>\n<?php\nfunction greetings() {\n    echo \"在这个美丽而阳光的日子里，祝你早安！\";\n}\ngreetings();\n\
  // 我正在调用这个函数\n?>\n</body>\n</html>\n```\n\n```php\nmain.php\n```\n```html\n<html>\n\
  <head>\n<title>这是我的 PHP 脚本</title>\n</head>\n<body>\n在这个美丽而阳光的日子里，祝你早安！\n</body>\n\
  </html>\n```\n\n# PHP 函数参数\n\n你可以通过参数向函数传递信息。函数中的参数就像一个变量。你可以在括号内指定参数，并根据需要添加任意数量的参数。用逗号将它们分开。我将创建一个带有一个参数的函数。我将在此基础上继续通过同一个参数向函数传递信息。\n\
  \n```html\n<html>\n<head>\n<title>这是我的 PHP 脚本</title>\n</head>\n<body>\n<?php\n\
  function greetings($name) {\n    echo \"$name，在这个美丽而阳光的日子里，祝你早安！\\n\";\n}\ngreetings('James');\n\
  // 我正在调用这个函数\ngreetings('Jasmine');\ngreetings('Martha');\ngreetings('Tim');\ngreetings('David');\n\
  greetings('Chelsea');\n?>\n</body>\n</html>\n```\n\n```php\nmain.php\n```\n```html\n\
  <html>\n<head>\n<title>这是我的 PHP 脚本</title>\n</head>\n<body>\nJames，在这个美丽而阳光的日子里，祝你早安！\n\
  Jasmine，在这个美丽而阳光的日子里，祝你早安！\nMartha，在这个美丽而阳光的日子里，祝你早安！\nTim，在这个美丽而阳光的日子里，祝你早安！\n\
  David，在这个美丽而阳光的日子里，祝你早安！\nChelsea，在这个美丽而阳光的日子里，祝你早安！\n</body>\n</html>\n```\n\n\
  # 多参数\n\n在接下来的示例中，我将给出多个参数的示例。\n\n```html\n<html>\n<head>\n<title>这是我的 PHP 脚本</title>\n\
  </head>\n<body>\n<?php\nfunction greetings($name, $day) {\n    echo \"$name，在这个美丽而阳光的日子里，祝你早安！\\\
  n\";\n    echo \"无论如何，我们应该从 $day 开始工作。\\n\";\n}\ngreetings('James', 'Monday');\n\
  // 我正在调用这个函数\ngreetings('Jasmine', 'Tuesday');\ngreetings('Martha', 'Wednesday');\n\
  greetings('Tim', 'Thursday');\ngreetings('David', 'Friday');\ngreetings('Chelsea',\
  \ 'Saturday');\n?>\n</body>\n</html>\n```\n\n```php\nmain.php\n```\n```html\n<html>\n\
  <head>\n<title>这是我的 PHP 脚本</title>\n</head>\n<body>\nJames，在这个美丽而阳光的日子里，祝你早安！\n\
  无论如何，我们应该从周一开始工作。\nJasmine，在这个美丽而阳光的日子里，祝你早安！\n无论如何，我们应该从周二开始工作。\nMartha，在这个美丽而阳光的日子里，祝你早安！\n\
