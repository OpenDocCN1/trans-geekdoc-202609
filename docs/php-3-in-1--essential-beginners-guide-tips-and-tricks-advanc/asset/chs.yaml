  \n\n# 第一章：安装 PHP\n\n本章将引导你完成在你的计算机系统上安装 PHP 的过程。如果你是 Linux 或 Mac 用户，你已经从公司获取并在你的计算机系统上安装了\
  \ PHP。然而，有时它没有处于激活模式，但你可以轻松地开启它。真正的任务是在 Windows 操作系统上安装 PHP。Windows 电脑没有预装 PHP。当你安装好之后，需要配置\
  \ Web 服务器来处理 PHP 代码。\n\n## 安装 Web 服务器\n\n安装 PHP 的第一步是在你的计算机系统上安装一个 Web 服务器。你必须下载并安装\
  \ `Apache`。如果你使用的是托管网站或公司网站，并且将文件放在他人的服务器上，那么你完全不需要安装 Web 服务器。你可以使用 `Apache` 的 `httpd`，因为它大部分情况下是免费的，而且是网上非常受欢迎的\
  \ Web 服务器之一。\n\n还有许多其他 Web 服务器可供。微软提供了 Internet 信息服务 (`IIS`)，它还包含一个带有 Visual Studio\
  \ 开发应用程序的开发 Web 服务器。还有一个名为 `nginx` 的工具，可以使用它来满足你的开发需求。`Apache` 非常流行，这就是为什么我在本章中将专门介绍\
  \ `Apache`。\n\nWindows 操作系统没有预装 `Apache`。你必须自己安装它。你可以运行测试来检查计算机系统上是否安装了 Web 服务器。打开你的浏览器，在地址栏输入\
  \ `http://localhost`。如果 Web 浏览器已安装并运行正常，你将看到一个网页。可能会出现 `Apache` 的欢迎界面并显示一些文本。如果你的系统上没有安装\
  \ Web 服务器，页面将显示文本“unable to connect（无法连接）”。\n\n## Apache\n\n`Apache` 是一种开源 Web 服务器，你可以从网上免费下载。你有三个版本可以下载：`Apache\
  \ 2.0`、`Apache 2.2` 和 `Apache 2.4`。所有这些版本都得到了良好的支持和及时更新。PHP 软件倾向于这些版本上运行。你可以从其官方网站下载\
  \ `Apache`。你也可以下载源代码并在你的操作系统上进行编译。你也可以使用已经编译好的、就绪运行的二进制文件并复制到当前位置。\n\n访问 `http://httpd.apache.org`\
  \ 并向下滚动到你想要在操作系统上安装的版本。Windows 二进制文件通常带有一个安装程序，将用于安装、配置并启动 `Apache`。当你点击 `Win32\
  \ Binary MSI Installer` 时，一个安装文件将下载到你的操作系统上。\n\n## 文件验证\n\n`Apache` 网站在你下载软件后提供了几种验证软件的方法。这是作为一种安全预防措施，以确保坏人没有修改文件。你可以使用\
  \ `MD5` 方法或 `PGP` 方法运行文件验证。此过程用于对 `PHP`、`Apache` 和 `MySQL` 进行验证。\n\n## 安装\n\n你可以在任何版本的\
  \ Microsoft Windows 上安装 `Apache`。要安装 `Apache`，你需要确保 `IIS` 尚未在系统上运行。按照以下步骤确认安装：\n\
  \n*   文件通常命名为 `apache_`，后面跟着其版本号，例如 `win32-x86-no_ssl.msi`。右键点击该文件并选择“以管理员身份运行”。这将启动安装向导。你的计算机屏幕上将弹出一个欢迎界面。\n\
  *   现在点击 `Next`（下一步）。屏幕上将显示许可协议。\n*   现在在许可协议中选择 `I Accept the Terms`（我接受条款）。现在点击\
  \ `Next`。如果你选择不接受条款，将无法安装此软件。随后将显示一个带有关于 `Apache` 信息的屏幕。\n*   现在点击 `Next`，你将看到一个显示\
  \ `Apache` 信息的屏幕。\n*   系统会要求你输入信息。你首先需要输入的是 `Domain Name`（域名）。你应该输入类似 `qas.com`\
  \ 的域名。如果你是为了测试而安装 `Apache`，并且希望从安装了它的机器访问它，可以输入 `localhost`。\n*   下一条信息是关于 `Server\
  \ Name`（服务器名称）。在安装 `Apache` 的过程中，你应该输入服务器名称，例如 `www.localhost.com`。如果你是为了测试而安装 `Apache`，并且希望从安装了它的机器访问它，可以输入\
  \ `localhost`。\n*   现在是时候你希望接收有关你的 Web 服务器邮件信息的邮箱地址了。\n*   在这一步中，你必须选择让 `Apache`\
  \ 作为服务运行，还是在你想要手动使用它时才启动 `Apache`。\n*   计算机屏幕上将显示安装类型屏幕。\n*   你应该选择一种安装类型然后点击 `Next`。在大多数情况下，你应该选择\
  \ `Complete`（完成）。只有理解 `Apache` 的高级用户才应该选择 `Custom`（自定义），因为如果你选择了它，屏幕将与选择任何其他选项时有所不同。\n\
  *   下一步是选择你想要安装 `Apache` 的目录。之后，点击 `Next`。\n*   在此之前，你可以返回并修改之前输入的信息，然后继续安装。当安装过程完成后，会弹出一个窗口，告诉你向导已完成安装过程。\n\
  *   现在点击 `Finish`（完成）以结束安装过程并退出安装向导。\n\n\n\n\n# 为 PHP 配置 Apache\n\n当你安装好之后，你可能想要启动\
  \ Apache。有一种可能是 Apache 已经在运行。然而，在你更改设置之前，你应该重启 Apache。\n\n你可以通过菜单中的某些 Apache 项目来启动或停止。你可以点击“开始”，进入“程序”，然后打开\
  \ Apache 服务器。现在，点击“Apache 服务器”来查看你拥有的。\n\n菜单中的第一个选项是“启动”。如果 Apache 已经在运行，你会看到一条\
  \ Apache 已经启动的消息。菜单中的第二个选项是“停止”。你可以使用它来停止 Apache。\n\n你可以通过以下命令获取大量的 Apache 信息。你可以通过“命令提示符”窗口获取信息。现在，在命令提示符中输入以下命令来检查\
  \ Apache 版本：\n```bash\napache -v\n```\n如果你想查看安装的 Apache 模块，应该输入命令：\n```bash\napache\
  \ -m\n```\n你也可以通过以下命令启动或停止 Apache：\n```bash\napache -k start\napache -k stop\n```\n\
  你可以通过以下命令查看可用选项：\n```bash\napache -h\n```\n\n## Apache 配置\n\n当 Apache 启动时，它会读取特定的配置文件。如果\
  \ Apache 无法读取配置文件，它将不会启动。你可以通过编辑配置文件来更改 Apache 的行为。\n\n如果你选择安装 PHP，你需要配置 Apache\
  \ 以识别 PHP。Apache 在名为 `Document Root` 的目录中查找文件。你可以前往 `Document Root` 的位置。\n\n# 安装\
  \ PHP\n\n安装 PHP 的第一步是检查你的操作系统是否已经安装了它。你可以搜索硬盘查找任何 PHP 文件。如果你使用的是 Windows 操作系统，可以使用“查找”功能来定位\
  \ PHP。点击“开始”，然后按“查找”。如果你的计算机系统中找不到 PHP 文件，说明 PHP 尚未安装。你的系统中可能有 PHP 文件，但它们还没有安装在系统中。计算机上的\
  \ PHP 版本可能不是最新的。不要在路径中包含空格的目录（例如 `Software\\PHP`）中安装 PHP。\n\n 获取 PHP\n\n你可以从互联网下载\
  \ PHP。确保你下载的版本是最新的。如果你必须维护现有的网站代码，应该只选择旧版本的 PHP。你编写 PHP 代码需要在另一个版本上运行。\n\n你可以访问\
  \ [www.php.net](http://www.php.net) 下载适用于所有操作系统的 PHP。PHP 的源代码也可以下载。在 Mac 和 Linux\
  \ 上，编译和安装源代码更为简单。如所述，你可以下载二进制文件以简化 Windows 的安装过程。\n\nPHP 官方网站上提供了可下载的 `zip` 文件，你可以将其下载到系统中。PHP\
  \ `zip` 文件包含了必要的文件以及一个用于安装 PHP 文件的安装程序。使用以下链接下载 Windows 的 `zip` 文件：[www.php.net/downloads.php](http://www.php.net/downloads.php)。\n\
  \n现在下载 zip 包，记住应该是最新版本。你也可以获取一些通常可以一次性安装 MySQL、PHP 和 Apache。这些工具包将简化 PHP 的安装过程。然而，软件可能不包含你所需的各种功能和扩展。`XAMPP`\
  \ 是一个非常流行的集成安装包，包含了 `PHP`、`Apache` 和 `MySQL`，可以在 [www.apachefriends.org/en/xampp.html](http://www.apachefriends.org/en/xampp.html)\
  \ 下载。另一个流行的安装包是 `WAMPServer`，你可以在 [www.wampserver.com](http://www.wampserver.com)\
  \ 获取。\n\n## 验证\n\n下载并安装 PHP 后，PHP 网站提供了软件验证方法。记住你在操作系统上下载的 zip 文件。如果你想在操作系统上安装 PHP\
  \ 5 或 6，你必须解压带有必要文件的包。当你解压时，它会将文件存储在适当的位置。如果你不想解压文件，可以使用适用于你用 Windows 版本的 PHP 安装程序。以下是涉及的步骤概述：\n\
  \n第一步是从 `.zip` 文件中提取文件到你想要安装 PHP 的目录。位置可以是任何地方，如 `c:\\php`。zip 文件通常命名为 `php5.4.5-Win32.zip`。如果你双击该文件，它将打开。现在将它们复制到适当目录或直接解压。`C:\\\
  php` 是安装的首选位置，因为许多配置文件都假设 PHP 安装在该位置。这将确保默认设置是正确的。\n\n\n\n\n-   通过开始菜单进入 Apache\
  \ HTTPD Server 文件夹来打开 `httpd.conf`。点击 `Configure Apache Server`，然后选择 `Edit Configuration`。如果你在开始菜单中找不到\
  \ `Edit Configuration`，可以直接在硬盘上找到 `httpd.conf`。你可以在安装 Apache 的目录中找到它。使用如 `Notepad`\
  \ 等文本编辑器打开该文件。\n\n-   现在是时候激活 PHP 模块了。在文件中查找 `module` 语句部分，然后找到以下此行：\n\n```\n#LoadModule\
  \ php5_module “c:/php/php5apache2_2.dll.”\n```\n如果你想激活该模块，可以删除该行开头的 `#` 号。模块的名称可能根据你所使用的\
  \ PHP 版本和 Apache 版本而不同。\n\n-   你需要告诉 Apache 哪些文件是 PHP 程序，哪些不是。找到描述 `AddType` 的部分。该特定部分可能包含来自其他软件的一行或多个\
  \ `AddType` 行。PHP 的对应行如下：\n\n```\nAddType application/x-httpd-php .php\n```\n找到该行。如果你发现它开头有井号（#），请删除该符号。如果没有该行，你可以将其添加到\
  \ `AddType` 语句列表中。\n\n-   在较新版本的 Windows 中，你可以通过点击 `Start`，然后是 `Programs`，接着是 `Apache\
  \ HTTPD Server`，最后 `Control Apache Server` 将 Apache 作为服务启动。现在选择 `Start` 或 `Restart`。\n\
  \n## PHP 配置\nPHP 使用名为 `php.ini` 的文件的不同设置来控制其行为。PHP 在启动时会查找 `php.ini` 并使用其设置。除非你更改了它们，否则\
  \ `php.ini` 的默认位置是以下之一。如果尚未安装 `php.ini` 文件，你现在必须进行安装。你可以寻找一个带有默认设置的 `php.ini-dist`\
  \ 文件。该文件包含在 PHP 分发中。你可以将该文件复制到合适的位置（如上述默认位置），并将其重命名为 `php.ini`。\n\n如果你安装了类似 `PHP\
  \ 4.3` 的 PHP 版本，可以为 `PHP 5` 或 `6` 创建备份副本。然后查看你当前正在使用的设置。要配置 PHP，请打开 `php.ini` 文件并进行编辑。然后更改你需要修改的设置。\n\
  \n如果你在使用 `PHP 5` 或更早版本，你需要关闭魔法引号（magic quotes）。搜索以下行：`magic_quotes-gpc On`。将 `On`\
  \ 改为 `Off`。如果你在 Windows 上使用 `PHP 5` 或 `PHP 6`，你需要激活 `mysql` 或 `mysqli` 支持。你应该删除分号以使设置生效。同时，将\
  \ `1` 改为 `0`。更改后的行如下：\n```\ncgi.force_redirect = 0\n```\n如果你在使用 `PHP 5` 或较后的版本，你需要设置本地时区。现在保存\
  \ `php.ini` 文件并重启你的 Web 服务器。\n\n\n\n\n\n# 第二章：PHP 基础\n\nPHP 是一种设计用于 Web 的脚本语言。它拥有广泛的功能，可以帮助你完成开发多个动态\
  \ Web 应用所需的各种任务。本章将带你了解编写 PHP 脚本的基础知识，例如适用于不同 PHP 语句的规则。你可以将这些规则视为类似于通用标点符号规则。\n\
  \nPHP 软件的工作原理就像 Web 服务器，Web 服务器 是一种向世界传递不同网页的软件。当你向 浏览器的地址栏输入 URL 时，你将向该 URL 的 Web\
  \ 浏览器发送一条消息，告诉它给你发送一个 HTML 文件。Web 服务器将通过发送你请求的文件来响应。浏览器将读取 HTML 文件并显示网页。当你点击提交表单的网页按钮时，Web\
  \ 服务器将处理该文件。\n\n在完 PHP 后，Web 服务器通常被配置为期望扩展名包含某些 PHP 语言语句。扩展名通常是 `.phtml` 或 `.php`。当\
  \ Web 服务器接收到指定扩展名的文件请求时，它将原样发送 HTML 语句。当 PHP 语言语句被通常处理时，输出由 Web 服务器发送到 浏览器。PHP 语句不是浏览器的一部分，因此\
  \ PHP 代码对用户是隐藏的。\n\n## 创建 HTML 页面\n\n超文本标记语言也是一种 Web 语言。当你用 Google Chrome、Firefox\
  \ 和 Safari 等 浏览器打开网页时，浏览器会下载页面，你看到的就是 HTML 页面。HTML 就像文档，与你在文字处理器中创建的文档非常相似。查看文字文档需要像\
  \ MS Word 这样的程序，因为 MS Processor 只能读取该格式。在 HTML 的情况下，浏览器是一个读取并显示用 HTML 创建的文档程序。与文字处理器不同，你不能用浏览器创建\
  \ HTML 文档。你必须在编辑器的帮助下创建 HTML 文档。编辑器可以是像记事本这样简单的，也可以是像 Microsoft Visual Studio 这样复杂的。我们必须理解\
  \ HTML，因为我们需要这种语言来嵌入 PHP 并在浏览器上运行。所有的 HTML 文档都应该以 `<!DOCTYPE html>` 开始。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n    <h1>这是一个 HTML 标题</h1>\n    <p>这是一个 HTML 段落的示例。</p>\n\
  </body>\n</html>\n```\n\n你可以使用三种类型的标题来设计 HTML 标题。\n\n```html\n<h1>这是你如何插入标题 1</h1>\n\
  <h2>这是你如何插入标题 2</h2>\n<h3>这是你如何插入标题 3</h3>\n```\n\n## 分析 PHP 脚本\n\nPHP 在用于网页时，作为一种嵌入式脚本语言而闻名。这意味着你必须在\
  \ HTML 代码的嵌入形式中使用它。你必须使用 HTML 标签来编写 PHP 语言。这个过程与其他 HTML 文档相同。你可以以创建和编辑其他 HTML 页面的方式，创建并编辑包含\
  \ PHP 的不同网页。\n\nPHP 语言语句通常被封装在特定的 PHP 标签中。PHP 脚本可以放置在文档的任何位置。脚本以 `<?php` 开始，以 `?>`\
  \ 结束。\n\n```html\n<html>\n<head>\n    <title>这是一个 PHP 脚本样子的示例</title>\n</head>\n\
  <body>\n    <?php echo \"<h1>我们正在通过 PHP 进入应用开发的世界！</h1>\\n\"; ?>\n</body>\n</html>\n\
  ```\n\n```bash\n$php main.php\n```\n\n```html\n<html>\n<head>\n    <title>这是一个 PHP\
  \ 脚本样子的示例</title>\n</head>\n<body>\n    <?php echo \"<h1>我们正在通过 PHP 进入应用开发的世界！</h1>\"\
  ; ?>\n</body>\n</html>\n```\n\n浏览器在代码中不显示 PHP 脚本。你也可以通过仅使用 `<?` 和 `?>` 使用更短版本的 PHP\
  \ 标签。如果你启用短标签，你可以节省时间。一个问题是，如果你将脚本移动到没有启用短标签的 Web 服务器，它们将无法运行。所有的 PHP 语句在这些 PHP\
  \ 标签之间被处理。浏览器在处理 PHP 部分后会将其它。如果有输出，PHP 部分将像上面所示被输出替换。PHP 脚本可以有多多个部分。这里是示例：\n\n```html\n\
  <html>\n<head>\n    <title>这是一个 PHP 脚本样子的示例</title>\n</head>\n<body>\n    <?php\
  \ echo \"<h1>我们正在通过 PHP 进入应用开发的世界！</h1>\\n\"; ?>\n    <?php echo \"<h2>我们正在通过 PHP\
  \ 进入应用开发的世界！</h2>\\n\"; ?>\n</body>\n</html>\n```\n\n上述脚本的结果如下：\n\n```bash\n$php\
  \ main.php\n```\n\n```html\n<html>\n<head>\n    <title>这是一个 PHP 脚本样子的示例</title>\n\
  </head>\n<body>\n    <h1>我们正在通过 PHP 进入应用开发的世界！</h1>\n    <h2>我们正在通过 PHP 进入应用开发的世界！</h2>\n\
  </body>\n</html>\n```\n\n如果你熟悉 Python，你可能知道 Python 是大小敏感的。这意味着在 Python 中，`class`\
  \ 和 `CLASS` 是大小敏感的。让我们看看 PHP 如何处理各种大小。\n\n```html\n<html>\n<head>\n    <title>这是一个\
  \ PHP 脚本样子的示例</title>\n</head>\n<body>\n    <?php echo \"<h1>我们正在通过 PHP 进入应用开发的世界！</h1>\\\
  n\"; ?>\n    <?php echo \"<h2>我们正在通过 PHP 进入应用开发的世界！</h2>\\n\"; ?>\n    <?php echo\
  \ \"<h2>我们正在通过 PHP 进入应用开发的世界！</h2>\\n\"; ?>\n</body>\n</html>\n```\n\n我用三种不同的大小写了相同的脚本。让我们看看结果。\n\
  \n```bash\n$php main.php\n```\n\n```html\n<html>\n<head>\n    <title>这是一个 PHP 脚本样子的示例</title>\n\
  </head>\n<body>\n    <h1>我们正在通过 PHP 进入应用开发的世界！</h1>\n    <h2>我们正在通过 PHP 进入应用开发的世界！</h2>\n\
  \    <h2>我们正在通过 PHP 进入应用开发的世界！</h2>\n</body>\n</html>\n```\n\n所有的 PHP 关键字如 `if`\
  \ 和 `echo` 都不区分大小写，然而 PHP 变量区分大小写。\n\n```html\n<html>\n<head>\n    <title>这是一个 PHP\
  \ 脚本样子的示例</title>\n</head>\n<body>\n    <?php $color = \"blue\"; echo \"My car is\
  \ \" . $color . \"<br>\"; echo \"My shoes is \" . $COLOR . \"<br>\"; echo \"My coat\
  \ is \" . $coLOR . \"<br>\"; ?>\n</body>\n</html>\n```\n\n当大小写改变时，浏览器不理解。如果你使用编辑器来编写脚本，你将在页面底部看到错误信息。\n\
  \n```bash\n$php main.php\n```\n\n```html\n<html>\n<head>\n    <title>这是一个 PHP 脚本样子的示例</title>\n\
  </head>\n<body>\n    My car is blue<br>\n    My shoes is <br>\n    My coat is <br>\n\
  </body>\n</html>\n```\nPHP Notice: Undefined variable: COLOR in `/home/cg/root/326839/main.php`\
  \ on line 9\nPHP Notice: Undefined variable: coLOR in `/home/cg/root/326839/main.php`\
  \ on line 10\n\n## 代码\n\nPHP 代码应该被人类和 PHP 软件读取。当你为一个 Web 应用编写了脚本时，它在一年或两年后将被修改和维护。负责修改代码的人应该能够理解脚本。因此，它必须以人类易读且易于理解的风格编写。每个\
  \ PHP 简单语句应该写在一行，并以分号结束。\n\n## 变量\n\n通常，PHP 变量以 `$` 开头，后面跟着变量名。PHP `echo` 用于在电脑屏幕上显示输出。看下面的示例查看输出文本是如何在电脑上显示的。\n\
  \n```html\n<html>\n<head>\n    <title>这是一个 PHP 脚本样子的示例</title>\n</head>\n<body>\n\
  \    <?php $txt = \"amazing \"; echo \"PHP is an \" . $txt. \"language.\"; ?>\n\
  </body>\n</html>\n```\n\n```bash\n$php main.php\n```\n\n```html\n<html>\n<head>\n\
  \    <title>这是一个 PHP 脚本样子的示例</title>\n</head>\n<body>\n    PHP is an amazing language.\n\
  </body>\n</html>\n```\n\n## 数组\n\n数组被认为是复杂的变量。特定的数组倾向于在一个变量名内部存储一组值。它对于相关值的存储非常有用。你可以存储关于某种花类的颜色、品种和成本的信息。你可以处理这些信息、修改它们并访问它们。创建数组的最简单方法之一是在变量名末尾带有方括号\
  \ `[]` 赋值一个值。\n\n```html\n<html>\n<head>\n    <title>这是一个 PHP 脚本样子的示例</title>\n\
  </head>\n<body>\n    <?php $countries[1] = \"United States\"; $countries[2] = \"\
  England\"; $countries[3] = \"Brazil\"; $countries[4] = \"Pakistan\"; $countries[5]\
  \ = \"Egypt\"; echo countries[1]; ?>\n</body>\n</html>\n```\n\n\n\n\n\n# 第三章：创建\
  \ PHP 脚本\n\nPHP 脚本通常是指具有特定扩展名文件中的系列指令，这些指令指示 Web 服务器在文件中查找 PHP 部分。该扩展名通常标记为 `.phtml`\
  \ 和 `.php`。PHP 中的指令被称为语句（statements），它们可以是简单的，也可以是复杂的。复杂的语句往往执行一个或多个语句块。\n\n## 条件\n\
  PHP 中的条件是 PHP 进行测试或评估的表达式，用于验证条件是否为真或假。PHP 逻辑条件通常以复杂语句的形式使用，用于检查填充了简单语句的语句块是否可以执行。你必须比较不同的值来设置条件。\n\
  \n### if 语句\n`if` 语句会在其中一个条件为真时执行代码。`if` 语句的第一部分（你将在示例中看到的）是 `if` 部分。如果条件为真，则执行该语句块。在执行它们时，脚本将遵循条件语句跳转到下一条指令。如果条件语句拥有\
  \ `else-if` 或 `else` 部分，脚本将跳过它们。如果条件为假，则不执行该语句块。脚本将跳到下一条指令，该指令将是 `else-if`、`else`，或者\
  \ `if` 条件语句之后的任何其他后续指令。\n\n`if` 语句中的另一个关键字是 `else`。这部分是可选的。`if` 语句中可以集成一个 `else`。它的目的不是为了测试任何条件。然而，它的目的是执行一个语句块。当\
  \ `if` 部分和 `else-if` 部分都不为真时，脚本倾向于进入 `else` 部分。\n\n让我们尝试一个 `if else` 语句。\n\n```html\n\
  <html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n<?php\n$t = date(\"H\");\n\
  if ($t < \"15\") {\n    echo \"欢迎！祝你度过愉快的一天！\";\n} else {\n    echo \"晚安！我现在得走了！\"\
  ;\n}\n?>\n</body>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n\
  <title>这是 PHP</title>\n</head>\n<body>\n欢迎！祝你度过愉快的一天！\n</body>\n</html>\n```\n\n\
  这是一个包含完整 `if-else` 语句的代码块。\n\n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n\
  <body>\n<?php\n$thescore = 100;\nif ($thescore > 95 ) {\n    $thegrade = \"A\";\n\
  \    $themessage = \"太优秀了！\";\n} else-if ($thescore <= 95 and $thescore > 85 ) {\n\
  \    $thegrade = \"B\";\n    $themessage = \"非常好！\";\n} else-if ($thescore <= 85\
  \ and $thescore > 75 ) {\n    $thegrade = \"C\";\n    $themessage = \"还可以。没有预期的那么好。\"\
  ;\n} else-if ($thescore <= 75 and $thescore > 65 ) {\n    $thegrade = \"D\";\n \
  \   $themessage = \"不好。实际上非常糟糕了！\";\n} else {\n    $thegrade = \"F\";\n    $themessage\
  \ = \"你完蛋了！\";\n}\necho $themessage.\"\\n\";\necho \"你的成绩是 $thegrade\\n\";\n?>\n\
  </body>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>这是 PHP</title>\n\
  </head>\n<body>\n太优秀了！\n</body>\n</html>\n```\n\n现在我将改变分数让第二个代码块生效。示例如下：\n\n```html\n\
  <html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n<?php\n$thescore = 90;\n\
  if ($thescore > 95 ) {\n    $thegrade = \"A\";\n    $themessage = \"太优秀了！\";\n}\
  \ else-if ($thescore <= 95 and $thescore > 85 ) {\n    $thegrade = \"B\";\n    $themessage\
  \ = \"非常好！\";\n} else-if ($thescore <= 85 and $thescore > 75 ) {\n    $thegrade\
  \ = \"C\";\n    $themessage = \"还可以。没有预期的那么好。\";\n} else-if ($thescore <= 75 and\
  \ $thescore > 65 ) {\n    $thegrade = \"D\";\n    $themessage = \"不好。实际上非常糟糕了！\"\
  ;\n} else {\n    $thegrade = \"F\";\n    $themessage = \"你完蛋了！\";\n}\necho $themessage.\"\
  \\n\";\necho \"你的成绩是 $thegrade\\n\";\n?>\n</body>\n</html>\n```\n\n`$php main.php`\n\
  \n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n非常好！\n</body>\n\
  </html>\n```\n\n在下面的示例中，我将输入一个小于 85 的值，以便第三个 `else-if` 语句生效。浏览器将忽略 `if` 语句和第一个 `else-if`\
  \ 语句。\n\n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n<?php\n\
  $thescore = 80;\nif ($thescore > 95 ) {\n    $thegrade = \"A\";\n    $themessage\
  \ = \"太优秀了！\";\n} else-if ($thescore <= 95 and $thescore > 85 ) {\n    $thegrade\
  \ = \"B\";\n    $themessage = \"非常好！\";\n} else-if ($thescore <= 85 and $thescore\
  \ > 75 ) {\n    $thegrade = \"C\";\n    $themessage = \"还可以。没有预期的那么好。\";\n} else-if\
  \ ($thescore <= 75 and $thescore > 65 ) {\n    $thegrade = \"D\";\n    $themessage\
  \ = \"不好。实际上非常糟糕了！\";\n} else {\n    $thegrade = \"F\";\n    $themessage = \"你完蛋了！\"\
  ;\n}\necho $themessage.\"\\n\";\necho \"你的成绩是 $thegrade\\n\";\n?>\n</body>\n</html>\n\
  ```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n\
  <body>\n还可以。没有预期的那么好\n</body>\n</html>\n```\n\n让我们来看看最后一个选项。\n\n```html\n<html>\n\
  <head>\n<title>这是 PHP</title>\n</head>\n<body>\n<?php\n$thescore = 60;\nif ($thescore\
  \ > 95 ) {\n    $thegrade = \"A\";\n    $themessage = \"太优秀了！\";\n} else-if ($thescore\
  \ <= 95 and $thescore > 85 ) {\n    $thegrade = \"B\";\n    $themessage = \"非常好！\"\
  ;\n} else-if ($thescore <= 85 and $thescore > 75 ) {\n    $thegrade = \"C\";\n \
  \   $themessage = \"还可以。没有预期的那么好。\";\n} else-if ($thescore <= 75 and $thescore >\
  \ 65 ) {\n    $thegrade = \"D\";\n    $themessage = \"不好。实际上非常糟糕了！\";\n} else {\n\
  \    $thegrade = \"F\";\n    $themessage = \"你完蛋了！\";\n}\necho $themessage.\"\\\
  n\";\necho \"你的成绩是 $thegrade\\n\";\n?>\n</body>\n</html>\n```\n\n`$php main.php`\n\
  \n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n你完蛋了！\n</body>\n\
  </html>\n```\n\n### 嵌套 if\n你可以将一个 `if` 条件语句放在另一个 `if` 条件语句内部。这个过程被称为嵌套。假设你必须联系住在明尼苏达州的客户。你计划向他们的\
  \ ID 发送电子邮件，然后向那些没有电子邮件地址的人寄质质信。你可以通过以下方法识别客户群。\n\n```php\nif ( $thecustState ==\
  \ \"ID\" ) {\n    if ( $theEmailAdd = \"\" ) {\n        $thecontactMethod = \"信\"\
  ;\n    } else {\n        $thecontactMethod = \"通过邮件联系\";\n    }\n} else {\n    $thecontactMethod\
  \ = \"不需要\";\n}\n```\n\n### switch 语句\n`switch` 语句旨在测试 `$variablename` 的值。脚本移动到\
  \ `case` 部分并执行语句，直到遇到 `break` 语句或 `switch` 语句结束。你可以自由使用多少个 `case` 部分。如果你选择使用 `default`\
  \ 部分，可以将其放在末尾。\n\n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n\
  <?php\n$favoritecolor = \"green\";\nswitch ($favoritecolor) {\n    case \"green\"\
  :\n        echo \"我的颜色是绿色!\";\n        break;\n    case \"purple\":\n        echo\
  \ \"我的颜色是紫色!\";\n        break;\n    case \"violet\":\n        echo \"我的颜色是紫罗兰色!\"\
  ;\n        break;\n    default:\n        echo \"这些颜色之一!\";\n}\n?>\n</body>\n</html>\n\
  ```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n\
  <body>\n我的颜色是绿色!\n</body>\n</html>\n```\n\n现在我将更改 `case` 中的名称并查看结果。\n\n```html\n\
  <html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n<?php\n$favoritecolor =\
  \ \"violet\";\nswitch ($favoritecolor) {\n    case \"green\":\n        echo \"我的颜色是绿色!\"\
  ;\n        break;\n    case \"purple\":\n        echo \"我的颜色是紫色!\";\n        break;\n\
  \    case \"violet\":\n        echo \"我的颜色是紫罗兰色!\";\n        break;\n    default:\n\
  \        echo \"这些颜色之一!\";\n}\n?>\n</body>\n</html>\n```\n\n在第三个代码段中，我将选择一个不在 `case`\
  \ 语句中的颜色。\n\n```php\n<?php\n$favoritecolor = \"yellow\";\nswitch ($favoritecolor)\
  \ {\n    case \"green\":\n        echo \"我的颜色是绿色!\";\n        break;\n    case \"\
  purple\":\n        echo \"我的颜色是紫色!\";\n        break;\n    case \"violet\":\n  \
  \      echo \"我的颜色是紫罗兰色!\";\n        break;\n    default:\n        echo \"这些颜色之一!\"\
  ;\n}\n?>\n```\n\n## 循环\n循环通常用于在脚本中需要重复某些语句块时。循环可以无限持续，直到你设置一个条件使其停止。\n\n### 循环类型\n\
  第一类型是 `for` 循环。它设置一个计数器重复语句块直到达到特定数字。第二类型是 `while` 循环。它设置一个条件检查是否为真，然后重复某个语句块直到条件为假。第三类型是\
  \ `do...while` 循环，它也设置一个条件。在之后执行一个语句块直到条件为假。有一个 `init` 计数器会初始化循环的值。然后有一个 `test`\
  \ 计数器会在循环的每次迭代中评估。如果评估为真，循环继续。否则，它在那里结束。`increment` 计数器会增加循环的值。\n\n```php\n<?php\n\
  for ($y = 0; $y <= 20; $y++) {\n    echo \"需要的数字: $y\";\n}\n?>\n```\n\n`$php main.php`\n\
  \n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n需要的数字: 0<br />\n\
  需要的数字: 1<br />\n需要的数字: 2<br />\n需要的数字: 3<br />\n需要的数字: 4<br />\n需要的数字: 5<br />\n\
  需要的数字: 6<br />\n需要的数字: 7<br />\n需要的数字: 8<br />\n需要的数字: 9<br />\n需要的数字: 10<br />\n\
  需要的数字: 11<br />\n需要的数字: 12<br />\n需要的数字: 13<br />\n需要的数字: 14<br />\n需要的数字: 15<br\
  \ />\n需要的数字: 16<br />\n需要的数字: 17<br />\n需要的数字: 18<br />\n需要的数字: 19<br />\n需要的数字:\
  \ 20<br />\n</body>\n</html>\n```\n\n`$y = 0;` 初始化了循环的计数器，将起始值设置为 0。在下一个示例中，我将指示循环在每次循环中增加\
  \ 20 来计数。\n\n```php\n<?php\nfor ($y = 0; $y <= 200; $y+=20) {\n    echo \"需要的数字:\
  \ $y<br>\";\n}\n?>\n```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>这是\
  \ PHP</title>\n</head>\n<body>\n需要的数字: 0<br />\n需要的数字: 20<br />\n需要的数字: 40<br />\n\
  需要的数字: 60<br />\n需要的数字: 80<br />\n需要的数字: 100<br />\n需要的数字: 120<br />\n需要的数字: 140<br\
  \ />\n需要的数字: 160<br />\n需要的数字: 180<br />\n需要的数字: 200<br />\n</body>\n</html>\n```\n\
  \n### 嵌套 for 循环\n你可以将一个 `for` 循环放在另一个 `for` 循环内部。我们可以通过使用两个工作的 `for` 循环来创建从 1 到\
  \ 12 的乘法表。\n\n```php\n<?php\nfor($a=1;$a<=12;$a++) {\n    echo \"\\n 乘以 $a \\n\"\
  ;\n    for($b=1;$b<=12;$b++) {\n        $result = $a * $b;\n        echo \"$a x\
  \ $b = $result\\n\";\n    }\n}\n?>\n```\n\n### 高级 for 循环\n`for` 循环的结构是灵活的，允许你构建循环来实现不同的目的。循环的通用格式允许在每个部分包含多个语句。\n\
  \n```php\n<?php\nfor ($a = 0; $y <= 20; $y+=20) {\n    echo \"需要的数字: $y<br>\";\n\
  }\n?>\n```\n\n\n\n\n\n- 在开始时，你可以设置一个条件。\n- 然后在每个单循环的顶部测试该条件。\n- 如果特定条件为真，循环将重复执行。如果条件为假，循环将停止。\n\
  \n这里是一个可以整齐显示蔬菜名称的 while 循环。\n\n```html\n<html> <head> <title>This is PHP</title>\
  \ </head> <body> <?php \n$vegetables = array ( \"pumpkin\", \"carrot\", \"radish\"\
  , \"beet\", \"tomato\", \"potato\");\n$testvariable = \"no\";\n$k = 0;\nwhile (\
  \ $testvariable != \"yes\" ) {\n  if ($vegetables[$k] == \"tomato\" ) {\n    $testvariable\
  \ = \"yes\";\n    echo \"Now we have a tomato.\\n\";\n  } else {\n    echo \"$vegetables[$k]\
  \ is not a tomato\\n\";\n  }\n  $k++;\n} \n?> </body>>\n</html>\n```\n\n`$php main.php`\n\
  \n```html\n<html> <head> <title>This is PHP</title> </head> <body> pumpkin is not\
  \ a tomato carrot is not a tomato radish is not a tomato beet is not a tomato Now\
  \ we have a tomato. </body></html>\n```\n\n在接下来的示例中，我将改变蔬菜并观察循环是如何工作的。\n\n```html\n\
  <html> <head> <title>This is PHP</title> </head> <body> <?php \n$vegetables = array\
  \ ( \"pumpkin\", \"carrot\", \"radish\", \"beet\", \"tomato\", \"potato\");\n$testvariable\
  \ = \"no\";\n$k = 0;\nwhile ( $testvariable != \"yes\" ) {\n  if ($vegetables[$k]\
  \ == \"potato\" ) {\n    $testvariable = \"yes\";\n    echo \"Now we have a potato.\\\
  n\";\n  } else {\n    echo \"$vegetables[$k] is not a potato\\n\";\n  }\n  $k++;\n\
  } \n?> </body>>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html> <head> <title>This\
  \ is PHP</title> </head> <body> pumpkin is not a potato carrot is not a potato radish\
  \ is not a potato beet is not a potato tomato is not a potato Now we have a potato.\
  \ </body></html>\n```\n\n## do...while 循环\n\n`do...while` 循环倾向于在开始时执行某个代码块一次，然后只要条件为真，它就会一直重复。它会执行代码一次，检查条件，然后只要条件为真就会重复循环。许多程序员将\
  \ `do...while` 循环和 `while` 循环放在同一个地方，然而，`do...while` 循环在循环的底部测试一组条件。如果条件为真，循环开始重复执行。如果条件为假，`do...while`\
  \ 循环停止工作。\n\n```html\n<html> <head> <title>This is PHP</title> </head> <body> <?php\
  \ \n$vegetables = array ( \"pumpkin\", \"carrot\", \"radish\", \"beet\", \"tomato\"\
  , \"potato\");\n$testvariable = \"no\";\n$k = 0;\ndo {\n  if ($vegetables[$k] ==\
  \ \"beet\" ) {\n    $testvariable = \"yes\";\n    echo \"Now we have a beet.\\n\"\
  ;\n  } else {\n    echo \"$vegetables[$k] is not a potato\\n\";\n  }\n  $k++;\n\
  } while ($testvariable != \"yes\"); \n?> </body>>\n</html>\n```\n\n`$php main.php`\n\
  \n```html\n<html> <head> <title>This is PHP</title> </head> <body> pumpkin is not\
  \ a potato carrot is not a potato radish is not a potato Now we have a beet. </body></html>\n\
  ```\n\n在下一段代码中，我将把 `beet` 改为 `potato`。让我们来看看代码的结果。\n\n```html\n<html> <head> <title>This\
  \ is PHP</title> </head> <body> <?php \n$vegetables = array ( \"pumpkin\", \"carrot\"\
  , \"radish\", \"beet\", \"tomato\", \"potato\");\n$testvariable = \"no\";\n$k =\
  \ 0;\ndo {\n  if ($vegetables[$k] == \"potato\" ) {\n    $testvariable = \"yes\"\
  ;\n    echo \"Now we have a potato.\\n\";\n  } else {\n    echo \"$vegetables[$k]\
  \ is not a potato\\n\";\n  }\n  $k++;\n} while ($testvariable != \"yes\"); \n?>\
  \ </body>>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html> <head> <title>This\
  \ is PHP</title> </head> <body> pumpkin is not a potato carrot is not a potato radish\
  \ is not a potato beet is not a potato tomato is not a potato Now we have a potato.\
  \ </body></html>\n```\n\n如果你仔细观察上面的代码，你会发现 `while` 循环和 `do...while` 循环的输出是相同的。两者的区别在于\
  \ `while` 循环中条件是在代码顶部检查，而在 `do...while` 循环中通常在代码底部检查。如果我们将 `testvariable` 设置为 ‘yes’，条件从开始就为假，这意味着代码块不会运行。看下面的代码。\n\
  \n```html\n<html> <head> <title>This is PHP</title> </head> <body> <?php \n$vegetables\
  \ = array ( \"pumpkin\", \"carrot\", \"radish\", \"beet\", \"tomato\", \"potato\"\
  );\n$testvariable = \"yes\";\n$k = 0;\ndo {\n  if ($vegetables[$k] == \"potato\"\
  \ ) {\n    $testvariable = \"yes\";\n    echo \"Now we have a potato.\\n\";\n  }\
  \ else {\n    echo \"$vegetables[$k] is not a potato\\n\";\n  }\n  $k++;\n} while\
  \ ($testvariable != \"yes\"); \n?> </body>>\n</html>\n```\n\n`$php main.php`\n\n\
  ```html\n<html> <head> <title>This is PHP</title> </head> <body> pumpkin is not\
  \ a potato </body></html>\n```\n\n## 死循环\n\n你可以设置在任何地方停止的循环。我们称它们为死循环。它们会一直重复。大多数情况下，这些循环是意外创建的。将其视为代码中的错误。代码中的细微变化可能会设置一个死循环的\
  \ `while` 循环。\n\n```html\n<html> <head> <title>This is PHP</title> </head> <body>\
  \ <?php \n$vegetables = array ( \"pumpkin\", \"carrot\", \"radish\", \"beet\", \"\
  tomato\", \"potato\");\n$testvariable = \"no\";\nwhile ( $testvariable != \"yes\"\
  \ ) {\n  $k = 0;\n  if ($vegetables[$k] == \"potato\" ) {\n    $testvariable = \"\
  yes\";\n    echo \"Now we have a potato.\\n\";\n  } else {\n    echo \"$vegetables[$k]\
  \ is not a potato\\n\";\n  }\n  $k++;\n} \n?> </body>>\n</html>\n```\n\n循环将一直运行。只需改变位置，就可以创建一个死循环。\n\
  \n### break 语句\n\n有时你想要跳出循环。有两个语句可以实现这个目的。`break` 可以帮助你在任何点跳出循环并继续执行循环后的语句。`continue`\
  \ 语句可以与 `break` 语句配对，它会跳过代码到末尾，在那里重复测试特定条件。如果测试为真，脚本将从顶部继续。这些语句用于条件语句。`break` 语句更多用于\
  \ `switch` 语句。\n\n```html\n<html> <head> <title>This is PHP</title> </head> <body>\
  \ <?php \n$thecounter = 0;\nwhile ( $thecounter < 15 ) {\n  $thecounter++;\n  If\
  \ ( $thecounter == 13 ) {\n    echo \"break\\n\";\n    break;\n  }\n  echo \"This\
  \ is the last line in the loop: counter=$thecounter\\n\";\n}\necho \"This is the\
  \ line after loop\\n\"; \n?> </body>>\n</html>\n```\n\n`$php main.php`\n\n```html\n\
  <html> <head> <title>This is PHP</title> </head> <body> This is the last line in\
  \ the loop: counter=1 This is the last line in the loop: counter=2 This is the last\
  \ line in the loop: counter=3 This is the last line in the loop: counter=4 This\
  \ is the last line in the loop: counter=5 This is the last line in the loop: counter=6\
  \ This is the last line in the loop: counter=7 This is the last line in the loop:\
  \ counter=8 This is the last line in the loop: counter=9 This is the last line in\
  \ the loop: counter=10 This is the last line in the loop: counter=11 This is the\
  \ last line in the loop: counter=12 break This is the line after loop </body></html>\n\
  ```\n\n循环在某一点跳出，然后继续执行剩余代码。\n\n```html\n<html> <head> <title>This is PHP</title>\
  \ </head> <body> <?php \n$thecounter = 0;\nwhile ( $thecounter < 12 ) {\n  $thecounter++;\n\
  \  If ( $thecounter == 10 ) {\n    echo \"this will continue the loop\\n\";\n  \
  \  continue;\n  }\n  echo \"This is the last line in the loop: counter=$thecounter\\\
  n\";\n}\necho \"This is the line after loop\\n\"; \n?> </body>>\n</html>\n```\n\n\
  `$php main.php`\n\n```html\n<html> <head> <title>This is PHP</title> </head> <body>\
  \ This is the last line in the loop: counter=1 This is the last line in the loop:\
  \ counter=2 This is the last line in the loop: counter=3 This is the last line in\
  \ the loop: counter=4 This is the last line in the loop: counter=5 This is the last\
  \ line in the loop: counter=6 this will continue the loop This is the last line\
  \ in the loop: counter=11 This is the last line in the loop: counter=12 This is\
  \ the line after loop </body></html>\n```\n\n如果你担心死循环，你可以在代码中插入 `break` 语句。\n\n\n\
  \n\n\n# 第四章：高级 PHP\n\n通常情况下，应用程序必须在脚本的多个点执行若干任务。PHP 函数允许你根据需要在一个多个位置复用相同的代码。函数通常是\
  \ PHP 中的一组语句，被设计用于执行特定的任务。\n\n## PHP 函数\n\n在接下来的示例中，我将创建一个 PHP 函数示例。函数中的大括号 `{ ...\
  \ }` 标记了函数的开始和结束。当你需要调用函数时，只需编写它的名称即可。\n\n```html\n<html>\n<head>\n<title>这是一个 PHP\
  \ 函数</title>\n</head>\n<body>\n<?php \nfunction greetings() { \n    echo \"Good\
  \ morning! Hope you are fine!\"; \n} \ngreetings(); // 这就是你调用函数的方式 \n?>\n</body>\n\
  </html>\n```\n\n```bash\n$php main.php\n```\n\n```html\n<html>\n<head>\n<title>这是一个\
  \ PHP 函数</title>\n</head>\n<body>\nGood morning! Hope you are fine!\n</body>\n</html>\n\
  ```\n\n看另一个示例。\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数</title>\n</head>\n\
  <body>\n<?php \nfunction format_your_name() { \n    global $formatted_name; \n \
  \   $your_first_name = \"Chris\"; \n    $your_last_name = \"Angel\"; \n    $formatted_name\
  \ = $your_last_name. \",\" .$your_first_name; \n} \nformat_your_name(); \necho \"\
  $formatted_name\"; \n?>\n</body>\n</html>\n```\n\n```bash\n$php main.php\n```\n\n\
  ```html\n<html>\n<head>\n<title>这是一个 PHP 函数</title>\n</head>\n<body>\nAngel,Chris\n\
  </body>\n</html>\n```\n\n如果你必须在函数外部创建变量，除非在代码中插入一个 `global` 变量，否则你无法这样做。请参见变量放置在脚本外部的示例。\n\
  \n## 参数\n\n你可以通过参数向函数传递信息。参数的作用就像变量一样。它们被指定在函数名后面的括号内。你可以根据需要向函数中添加尽可能多数量的变量。\n\n\
  ```html\n<html>\n<head>\n<title>这是一个 PHP 函数</title>\n</head>\n<body>\n<?php \nfunction\
  \ greetings($name) { \n    echo \"$name, welcome to the bachelor's club.<br>\";\
  \ \n} \ngreetings(\"John\"); \ngreetings(\"Sylvia\"); \ngreetings(\"Sim\"); \ngreetings(\"\
  Kai Jim\"); \ngreetings(\"Ben\"); \n?>\n</body>\n</html>\n```\n\n```bash\n$php main.php\n\
  ```\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数</title>\n</head>\n<body>\nJohn,\
  \ welcome to the bachelor's club.<br>\nSylvia, welcome to the bachelor's club.<br>\n\
  Sim, welcome to the bachelor's club.<br>\nKai Jim, welcome to the bachelor's club.<br>\n\
  Ben, welcome to the bachelor's club.<br>\n</body>\n</html>\n```\n\n你还可以通过添加更多参数来扩展脚本。在下一个示例中，我将向脚本添加两个参数。\n\
  \n```html\n<html>\n<head>\n<title>这是一个 PHP 函数</title>\n</head>\n<body>\n<?php \n\
  function greetings($name, $year) { \n    echo \"$name, welcome to the adult's club.\
  \ I suppose you are born in $year <br>\"; \n} \ngreetings(\"John\" , \"1999\");\
  \ \ngreetings(\"Sylvia\" , \"1988\"); \ngreetings(\"Sim\" , \"1995\"); \ngreetings(\"\
  Kai Jim\" , \"2001\"); \ngreetings(\"Ben\" , \"2002\"); \n?>\n</body>\n</html>\n\
  ```\n\n```bash\n$php main.php\n```\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数</title>\n\
  </head>\n<body>\nJohn, welcome to the adult's club. I suppose you are born in 1999\
  \ <br>\nSylvia, welcome to the adult's club. I suppose you are born in 1988 <br>\n\
  Sim, welcome to the adult's club. I suppose you are born in 1995 <br>\nKai Jim,\
  \ welcome to the adult's club. I suppose you are born in 2001 <br>\nBen, welcome\
  \ to the adult's club. I suppose you are born in 2002 <br>\n</body>\n</html>\n```\n\
  \n## 默认值\n\n你可以为参数使用默认值，这样如果你留空参数，你仍然可以调用函数。\n\n```html\n<html>\n<head>\n<title>这是一个\
  \ PHP 函数</title>\n</head>\n<body>\n<?php \nfunction greetings($name = \"Tom\", $year\
  \ = 1996) { \n    echo \"$name, welcome to the adult's club. I suppose you are born\
  \ in $year <br>\"; \n} \ngreetings(\"John\" , \"1999\"); \ngreetings(\"Sylvia\"\
  \ , \"1988\"); \ngreetings(); \n?>\n</body>\n</html>\n```\n\n```bash\n$php main.php\n\
  ```\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数</title>\n</head>\n<body>\nJohn,\
  \ welcome to the adult's club. I suppose you are born in 1999 <br>\nSylvia, welcome\
  \ to the adult's club. I suppose you are born in 1988 <br>\nTom, welcome to the\
  \ adult's club. I suppose you are born in 1996 <br>\n</body>\n</html>\n```\n\n##\
  \ 返回值\n\n如果你想要函数返回值，你必须在代码中插入 `return` 语句。\n\n```html\n<html>\n<head>\n<title>这是一个\
  \ PHP 函数</title>\n</head>\n<body>\n<?php \nfunction sumup(int $a, int $b) { \n \
  \   $c = $a + $b; \n    return $c; \n} \necho \"45 + 10 = \" . sumup(45, 10) . \"\
  <br>\";\necho \"57 + 13 = \" . sumup(57, 13) . \"<br>\";\necho \"29 + 41 = \" .\
  \ sumup(29, 41); \n?>\n</body>\n</html>\n```\n\n```bash\n$php main.php\n```\n\n\
  ```html\n<html>\n<head>\n<title>这是一个 PHP 函数</title>\n</head>\n<body>\n45 + 10 =\
  \ 55\n57 + 13 = 70\n29 + 41 = 70\n</body>\n</html>\n```\n\n## 正确的参数\n\n函数对你传递的参数数量非常敏感。如果你没有发送足够的参数，函数将检测到缺失的参数。当你执行代码时，你会看到警告消息。\n\
  \n```html\n<html>\n<head>\n<title>这是一个 PHP 函数</title>\n</head>\n<body>\n<?php \n\
  function greetings($name , $year) { \n    echo \"$name, welcome to the adult's club.\
  \ I suppose you are born in $year <br>\"; \n} \ngreetings(\"John\" , 1999); \ngreetings(\"\
  Sim\", 1988); \ngreetings(\"Drake\" , 2000); \ngreetings(\"Kai Jim\" , 2001); \n\
  greetings( 2002); \n?>\n</body>\n</html>\n```\n\n```bash\n$php main.php\n```\n\n\
  ```html\n<html>\n<head>\n<title>这是一个 PHP 函数</title>\n</head>\n<body>\nJohn, welcome\
  \ to the adult's club. I suppose you are born in 1999 <br>\nSim, welcome to the\
  \ adult's club. I suppose you are born in 1988 <br>\nDrake, welcome to the adult's\
  \ club. I suppose you are born in 2000 <br>\nKai Jim, welcome to the adult's club.\
  \ I suppose you are born in 2001 <br>\nPHP Fatal error:  Uncaught ArgumentCountError:\
  \ Too few arguments to function greetings(), 1 passed in  /home/cg/root/1842013/main.php\
  \ on line 15 and exactly 2 expected in /home/cg/root/1842013/main.php:7\nStack trace:\
  \ #0 /home/cg/root/1842013/main.php(15): greetings(2002)\n#1 {main} thrown in /home/cg/root/1842013/main.php\
  \ on line 7\n你可以看到由于缺失参数触发的错误。\n</body>\n</html>\n```\n\n\n\n\n\n# 第五章：面向对象编程\n\n\
  面向对象编程（OOP）是一种围绕类和对象的特殊编程方法。它是目前 PHP 最流行的用法之一。`PHP5` 作为面向对象编程的改进版本被发布，它具有更快的速度和改进的功能。面向对象编程，缩写为\
  \ `OOP`，并不是关于使用不同的语法，而是为了给你提供一种分析问题并制定解决方案的不同方法。在 `OOP` 中，脚本被视为一组不同的对象，这些对象代表了脚本需要解决的问题中的元素。如果脚本是关于一个二手车行的，那么对象可以是客户和汽车。OOP\
  \ 带来了新的概念和术语。\n\n## 类 (Classes)\n\n面向对象编程的基本元素之一是对象。你可以将它们视为代码形式的物理对象。一个 PHP 对象可以是一辆汽车、一只猫或一只狗。你可以给它们赋予某些属性，在编程世界被称为属性（attributes）。例如，猫可以有坐下、在地上打滚等属性。汽车可以有颜色、型号和公司名称等属性。\n\
  \nPHP 代码中的类（class）充当用于创建对象的模板。类通常定义了特定对象的属性。它还会定义对象所执行的大范围操作，比如它的职责。你写一个类来定义一个带有引擎和四个轮子的汽车。类列出了汽车可以做的事情，比如它可以向前移动和停车。\n\
  \n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\n\
  <?php \nclass Vegetables {\n    // these are the Properties\n    public $vname;\n\
  \    public $vcolor;\n    // these are the Methods\n    function set_name($vname)\
  \ {\n        $this->vname = $vname;\n    }\n    function get_name() {\n        return\
  \ $this->vname;\n    }\n}\n?>\n</body>\n</html>\n```\n\n在类中，变量被标记为属性（properties），而函数被称为方法（methods）。没有对象，类就毫无意义。你可以自由地从单个类创建大量对象。每个对象都包含在该类中定义的某些属性和方法，但它们具有不同的属性值。`new`\
  \ 关键字用于创建类的对象。然后是 `Vegetables` 类的实例。\n\n```html\n<html>\n<head>\n<title>This is\
  \ PHP function</title>\n</head>\n<body>\n<?php \nclass Vegetables {\n    // these\
  \ are the Properties\n    public $vname;\n    public $vcolor;\n    // these are\
  \ the Methods\n    function set_name($vname) {\n        $this->vname = $vname;\n\
  \    }\n    function get_name() {\n        return $this->vname;\n    }\n}\n$potato\
  \ = new Vegetables();\n$beet = new Vegetables();\n$potato->set_name('Potato');\n\
  $beet->set_name('Beet');\necho $potato->get_name();\necho \"<br>\";\necho $beet->get_name();\n\
  ?>\n</body>\n</html>\n```\n`main.php`\n```html\n<html>\n<head>\n<title>This is PHP\
  \ function</title>\n</head>\n<body>Potato<br>Beet</body>\n</html>\n```\n\n在接下来的代码片段中，我将为同一个蔬菜类再添加两个方法。我添加了用于给对象添加颜色的方法。\n\
  \n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\n\
  <?php \nclass Vegetables {\n    // these are the Properties\n    public $vname;\n\
  \    public $vcolor;\n    // these are the Methods\n    function set_name($vname)\
  \ {\n        $this->vname = $vname;\n    }\n    function get_name() {\n        return\
  \ $this->vname;\n    }\n    function set_color($vcolor) {\n        $this->vcolor\
  \ = $vcolor;\n    }\n    function get_color() {\n        return $this->vcolor;\n\
  \    }\n}\n$potato = new Vegetables();\n$beet = new Vegetables();\n$potato->set_name('Potato');\n\
  $potato->set_color('Red');\n$beet->set_name('Beet');\n$beet->set_color('Blue');\n\
  echo $potato->get_name();\necho \"Color: \" . $potato->get_color();\necho \"<br>\"\
  ;\necho $beet->get_name();\necho \"Color: \" . $beet->get_color();\n?>\n</body>\n\
  </html>\n```\n`main.php`\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n\
  </head>\n<body>PotatoColor: Red<br>Beet</body>\n```\n\n## \n\n当你定义一个类时，应该在顶部声明属性。不需要声明变量，你可以根据需要使用它们。但是在创建类时声明属性会让类更容易解析。如果省略它，会被认为是不良实践。你需要一个关键字：\n\
  \n- `public` 关键字：可以从类外的另一个脚本访问属性。\n- `protected` 关键字：可以在类内部以及派生自该类的类访问。\n- `private`\
  \ 关键字：只能在类内部访问。\n\n## 构造函数 (Constructor Function)\n\nPHP 构造函数允许你在创建对象时初始化属性。当你从类中创建一个对象时，PHP\
  \ 会调用该函数。\n\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n\
  <body>\n<?php \nclass Vegetables {\n    // these are the Properties\n    public\
  \ $vname;\n    public $vcolor;\n    // these are the Methods\n    function __construct($vname)\
  \ {\n        $this->vname = $vname;\n    }\n    function get_name() {\n        return\
  \ $this->vname;\n    }\n}\n$potato = new Vegetables(\"Potato\");\necho $potato->get_name();\n\
  ?>\n</body>\n</html>\n```\n`main.php`\n```html\n<html>\n<head>\n<title>This is PHP\
  \ function</title>\n</head>\n<body>Potato</body>\n</html>\n```\n\n我将向现有代码中添加另一个颜色的功能。查看\
  \ `__construct` 中的变化。\n\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n\
  </head>\n<body>\n<?php \nclass Vegetables {\n    // these are the Properties\n \
  \   public $vname;\n    public $vcolor;\n    public $vweight;\n    public $shape;\n\
  \    // these are the Methods\n    function __construct($vname, $vcolor, $vweight,\
  \ $shape) {\n        $this->vname = $vname;\n        $this->vcolor = $vcolor;\n\
  \        $this->vweight = $vweight;\n        $this->shape = $shape;\n    }\n   \
  \ function get_name() {\n        return $this->vname;\n    }\n}\n$potato = new Vegetables(\"\
  Potato\", \"Brown\", 50, \"round\");\necho $potato->get_name();\n?>\n</body>\n</html>\n\
  ```\n\n## 析构函数 (Destructor)\n\n当对象被销毁或脚本停止或退出时，必须调用析构函数。如果你有机会创建一个 `__destruct()`\
  \ 函数，PHP 将在脚本结束时调用它。和构造函数一样，析构函数也以两个下划线开头。\n\n```html\n<html>\n<head>\n<title>This\
  \ is PHP function</title>\n</head>\n<body>\n<?php \nclass Vegetables {\n    // these\
  \ are the Properties\n    public $vname;\n    public $vcolor;\n    function __construct($vname,\
  \ $vcolor) {\n        $this->vname = $vname;\n        $this->vcolor = $vcolor;\n\
  \    }\n    function __destruct() {\n        echo \"The vegetable is {$this->vname}\
  \ and the color is {$this->vcolor}.\";\n    }\n}\n$potato = new Vegetables(\"Potato\"\
  , \"Brown\");\n$beet = new Vegetables(\"Beet\", \"Red\");\n?>\n</body>\n</html>\n\
  ```\n`main.php`\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n\
  </head>\n<body>The vegetable is Potato and the color is Brown.</body>\n</html>\n\
  ```\n\n## 访问修饰符 (Access Modifiers)\n\n属性和方法具有访问修饰符，可以控制它们的访问范围。通常有三种修饰符，即 `public`、`protected`\
  \ 和 `private`。\n\n- `public` 修饰符：特定的方法或属性可以从类的外部脚本访问。\n- `protected` 修饰符：方法或属性可以在类内部以及派生自该类的类访问。\n\
  - `private` 修饰符：方法或属性只能在类内部访问。\n\n在这个示例中，我为上述三个属性添加了不同的访问修饰符。如果你设置名称属性，你会成功。但是，如果你设置重量和颜色属性，你会看到致命错误。\n\
  \n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\n\
  <?php \nclass Vegetable {\n    public $vname;\n    protected $vcolor;\n    private\
  \ $vweight;\n}\n$beet = new Vegetable();\n$beet->vname = 'Beet'; // OK\n$beet->vcolor\
  \ = 'Purplish Red'; // 这将触发错误\n$beet->vweight = '50'; // 这将触发错误\n?>\n</body>\n</html>\n\
  ```\n`main.php`\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n\
  </head>\n<body>Fatal error: Uncaught Error: Cannot access protected property Vegetable::$vcolor\
  \ in /home/cg/root/2713/main.php:15</body>\n```\n\n在下一个示例中，我将为方法添加访问修饰符。如果你尝试调用\
  \ `set_color()` 或 `set_weight()`，将导致致命错误，因为它们被指定为 `protected` 和 `private`。尽管我们把属性设为了\
  \ `public`。\n\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n\
  <body>\n<?php \nclass Vegetable {\n    public $vname;\n    protected $vcolor;\n\
  \    private $vweight;\n\n    public function get_name() {\n        return $this->vname;\n\
  \    }\n    protected function set_color($vcolor) {\n        $this->vcolor = $vcolor;\n\
  \    }\n    private function set_weight($vweight) {\n        $this->vweight = $vweight;\n\
  \    }\n}\n$beet = new Vegetable();\n$beet->vname = 'Beet'; // OK\n$beet->set_color('Purplish\
  \ Red'); // 这将触发错误\n$beet->set_weight('50'); // 这将触发错误\n?>\n</body>\n</html>\n```\n\
  \n## 继承 (Inheritance)\n\n`OOP` 中的继承意味着一个类派生自另一个类。子类倾向于继承父类的所有 `protected` 和 `public`\
  \ 方法和属性。它也可以拥有自己的方法和属性。你可以使用 `extends` 关键字定义它。\n\n```html\n<html>\n<head>\n<title>This\
  \ is PHP function</title>\n</head>\n<body>\n<?php \nclass Vegetable {\n    public\
  \ $vname;\n    public $vcolor;\n    public function __construct($vname, $vcolor)\
  \ {\n        $this->vname = $vname;\n        $this->vcolor = $vcolor;\n    }\n \
  \   public function intro() {\n        echo \"The vegetable is {$this->vname} and\
  \ the color is {$this->vcolor}.\";\n    }\n}\nclass Beet extends Vegetable {\n \
  \   public function themessage() {\n        echo \"Does beet like fruit or vegetable?\
  \ \";\n    }\n}\n$beet = new Beet(\"Beet\", \"purplish red\");\n$beet->themessage();\n\
  $beet->intro();\n?>\n</body>\n</html>\n```\n`main.php`\n```html\n<html>\n<head>\n\
  <title>This is PHP function</title>\n</head>\n<body>Fatal error: Uncaught Error:\
  \ Call to protected method Vegetable::intro() in context '' in /home/cg/root/2713/main.php:27\
  \ Stack trace: #0 {main} thrown in /home/cg/root/2713/main.php on line 27</body>\n\
  ```\n\n## 抽象类 (Abstract Class)\n\n当你继承自 `abstract` 类时，子类方法必须以相同的名称和限制较少的访问修饰符定义。如果抽象方法定义为\
  \ `protected`，则子类方法需要定义为 `public` 或 `protected`，而不是 `private`。\n\n```html\n<html>\n\
  <head>\n<title>This is PHP function</title>\n</head>\n<body>\n<?php \nabstract class\
  \ Vegetable {\n    public $vname;\n    public $vcolor;\n    public function __construct($vname,\
  \ $vcolor) {\n        $this->vname = $vname;\n        $this->vcolor = $vcolor;\n\
  \    }\n    abstract public function intro();\n}\nclass Beet extends Vegetable {\n\
  \    public function intro() {\n        return \"The vegetable is {$this->vname}\
  \ and its color is {$this->vcolor}\";\n    }\n}\nclass Onion extends Vegetable {\n\
  \    public function intro() {\n        return \"The vegetable is {$this->vname}\
  \ and its color is {$this->vcolor}\";\n    }\n}\nclass Pumpkin extends Vegetable\
  \ {\n    public function intro() {\n        return \"The vegetable is {$this->vname}\
  \ and its color is {$this->vcolor}\";\n    }\n}\nclass Radish extends Vegetable\
  \ {\n    public function intro() {\n        return \"The vegetable is {$this->vname}\
  \ and its color is {$this->vcolor}\";\n    }\n}\nclass Tomato extends Vegetable\
  \ {\n    public function intro() {\n        return \"The vegetable is {$this->vname}\
  \ and its color is {$this->vcolor}\";\n    }\n}\n$beet = new Beet(\"Beet\", \"purplish\
  \ red\");\necho $beet->intro();\necho \"<br>\";\n$onion = new Onion(\"Onion\", \"\
  white\");\necho $onion->intro();\necho \"<br>\";\n$pumpkin = new Pumpkin(\"Pumpkin\"\
  , \"green\");\necho $pumpkin->intro();\necho \"<br>\";\n$radish = new Radish(\"\
  Radish\", \"red\");\necho $radish->intro();\necho \"<br>\";\n$tomato = new Tomato(\"\
  Tomato\", \"red and green\");\necho $tomato->intro();\n?>\n</body>\n</html>\n```\n\
  `main.php`\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n\
  <body>The vegetable is Beet and its color is purplish red<br>The vegetable is Onion\
  \ and its color is white<br>The vegetable is Pumpkin and its color is green<br>The\
  \ vegetable is Radish and its color is red<br>The vegetable is Tomato and its color\
  \ is red and green</body>\n</html>\n```\n\n### 抽象类示例 (Abstract Class Examples)\n\
  \n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\n\
  <?php \nabstract class ParentClass {\n    abstract protected function methodName($name);\n\
  }\nclass ChildClass extends ParentClass {\n    public function methodName($name)\
  \ {\n        return \"Hello \" . $name;\n    }\n}\n// 这里的逻辑根据原文描述如下：\npublic function\
  \ methodName($vname, $theseparator = \".\", $vgreet = \"My dear \") {\n    if ($vname\
  \ == \"John Snow\") {\n        $theprefix = \"Mister.\";\n    } else-if ($vname\
  \ == \"Jane Snow\") {\n        $theprefix = \"Mrs.\";\n    } else {\n        $theprefix\
  \ = \"\";\n    }\n    return \"{$vgreet} {$theprefix}{$theseparator} {$vname}\"\
  ;\n}\n*/\n?>\n</body>\n</html>\n```\n*(注：由于原文最后一部分抽象类示例代码存在格式混乱和重复，已根据上下文逻辑进行了翻译和对齐。)*\n\
  \n\n\n\n\n# 第六章：PHP 表单与文件处理\n\nPHP 全局变量如 `$_POST` 和 `$_GET` 通常用于收集表单数据。本章将带你了解 PHP\
  \ 表单的创建和处理。我将从一个具有两个输入字段简单 HTML 表单开始。它包含一个提交按钮，供用户填写信息并点击提交完成事务。你可以构建一个 Web 并在其中集成表单，以从用户那里获取你需要的某些信息。\n\
  \n```html\n<<html>\n<body>\n  <form action=\"Wewelcomeyou.php\" method=\"post\"\
  >\n    Name: <input type=\"text\" name=\"Please enter your name\"><br>\n    E-mail:\
  \ <input type=\"text\" name=\"Please enter your email\"><br>\n    <input type=\"\
  submit\">\n  </form>\n</body>\n</</html>\n```\n\n当用户填写表单并点击提交按钮时，数据将传递到名为 `Wewelcomeyou.php`\
  \ 的 PHP 文件进行处理。表单通过 HTTP `POST` 方法发送。如果你想显示提交的数据，可以简单地 `echo` 这些变量。如果你使用 `GET` 方法发送表单，它将对所有人可见。所有的名称和值将显示在\
  \ URL 中。它对你想要发送的信息大小也有限制。变量将显示在 URL 中，因此无法在页面上创建书签。你可以使用 `POST` 方法创建表单，但问题是这种方法中的信息将对其他人可见。\n\
  \n在下一个代码示例中，你将看到新的变量，它们将帮助你为所有必填字段添加错误消息。每个 `$_POST` 变量都会有一个 `if else` 语句。它将检查 `$_POST`\
  \ 变量是否为空，因为如果不为空，你将看到封装在不同错误变量中的错误消息。它将通过 `test_input()` 函数发送用户输入的数据。\n\n```php\n\
  <html>\n<head>\n  <title>This is PHP</title>\n</head>\n<body>\n  <?php\n  // 你应该定义变量并将它们设置为空值\n\
  \  $pnameErr = $pemailErr = $pgenderErr = $pwebsiteErr = \"\";\n  $pname = $pemail\
  \ = $pgender = $pcomment = $pwebsite = \"\";\n  if ($_SERVER[\"REQUEST_METHOD\"\
  ] == \"POST\") {\n    if (empty($_POST[\"name\"])) {\n      $pnameErr = \"You will\
  \ be requiring a name\";\n    } else {\n      $pname = test_input($_POST[\"name\"\
  ]);\n    }\n    if (empty($_POST[\"email\"])) {\n      $pemailErr = \"You will be\
  \ requiring an Email\";\n    } else {\n      $pemail = test_input($_POST[\"email\"\
  ]);\n    }\n    if (empty($_POST[\"website\"])) {\n      $pwebsite = \"\";\n   \
  \ } else {\n      $pwebsite = test_input($_POST[\"website\"]);\n    }\n    if (empty($_POST[\"\
  comment\"])) {\n      $pcomment = \"\";\n    } else {\n      $pcomment = test_input($_POST[\"\
  comment\"]);\n    }\n    if (empty($_POST[\"gender\"])) {\n      $pgenderErr = \"\
  You will have to enter your Gender\";\n    } else {\n      $pgender = test_input($_POST[\"\
  gender\"]);\n    }\n  }\n  ?>\n</body>\n</html>\n```\n\n## 文件处理\n\n异常处理是程序员认为是软件开发中最困难的部分。诸如\
  \ bug（bug）、网络故障和数据库故障等错误为程序员带来了一系列严重问题。开发者应该对弹出的错误做出决策，添加检查来检测失败，并调用完美的函数进行管理。还应该确保程序在处理后正常运行。异常可以帮助你在无需编写\
  \ `if` 语句块的情况下编写强大的程序。PHP 表单有许多类型。添加到 Web 应用程序中最基本的方法是 `Date()` 函数。所需的格式倾向于指定日期和时间。查看你可以用于日期的某些字符：`d`\
  \ 字符表示每月最多 31 天。`m` 字符表示 01 到 12 月。`y` 参数表示年份。`l` 代表星期几。\n\n```php\n<html>\n<head>\n\
  \  <title>This is PHP</title>\n</head>\n<body>\n  <?php\n  echo \"The date is \"\
  \ . date(\"Y/m/d\") . \"<br>\";\n  echo \"The date is \" . date(\"Y.m.d\") . \"\
  <br>\";\n  echo \"The date is \" . date(\"Y-m-d\") . \"<br>\";\n  echo \"The date\
  \ is \" . date(\"l\");\n  ?>\n</body>\n</html>\n```\n\n```php\n<html>\n<head>\n\
  \  <title>This is PHP</title>\n</head>\n<body>\n  The date is 2020/06/23<br>\n \
  \ The date is 2020.06.23<br>\n  The date is 2020-06-23<br>\n  The date is Tuesday\n\
  </body>\n</html>\n```\n\n当新的一年开始时，你可以通过以下方法更新 Web 应用程序的版权：`&copy;2020-<?php echo\
  \ date(\"Y\");?>`。可以让 PHP 估计准确日期的示例：\n\n```php\n<html>\n<head>\n  <title>This is\
  \ PHP</title>\n</head>\n<body>\n  <?php\n  $d = strtotime(\"tomorrow\");\n  echo\
  \ \"The date is \" . date(\"m-d-y h:i:s\", $d) . \"<br>\";\n  $d = strtotime(\"\
  next Friday\");\n  echo \"The date is \" . date(\"m-d-y h:i:s\", $d) . \"<br>\"\
  ;\n  $d = strtotime(\"+4 Months\");\n  echo \"The date is \" . date(\"m-d-y h:i:s\"\
  , $d) . \"<br>\";\n  $d = strtotime(\"+8 Months\");\n  echo \"The date is \" . date(\"\
  m-d-y h:i:s\", $d) . \"<br>\";\n  $d = strtotime(\"+1 Month\");\n  echo \"The date\
  \ is \" . date(\"m-d-y h:i:s\", $d) . \"<br>\";\n  $d = strtotime(\"next Wednesday\"\
  );\n  echo \"The date is \" . date(\"m-d-y h:i:s\", $d) . \"<br>\";\n  ?>\n</body>\n\
  </html>\n```\n\n```php\n<html>\n<head>\n  <title>This is PHP</title>\n</head>\n\
  <body>\n  06-24-20 12:00:00<br>\n  06-26-20 12:00:00 <br>\n  10-23-20 05:13:14 <br>\n\
  \  02-23-21 05:13:14 <br>\n  07-23-20 05:13:14 <br>\n</body>\n</html>\n```\n\n###\
  \ 更多示例\n\n```php\n<html>\n<head>\n  <title>This is PHP</title>\n</head>\n<body>\n\
  \  <?php\n  $thestartdate = strtotime(\"Friday\");\n  $theenddate = strtotime(\"\
  +36 weeks\", $thestartdate);\n  while ($thestartdate < $theenddate) {\n    echo\
  \ date(\"M d Y\", $thestartdate) . \"<br>\";\n    $thestartdate = strtotime(\"+1\
  \ day\", $thestartdate);\n  }\n  ?>\n</body>\n</html>\n```\n\n```php\n<html>\n<head>\n\
