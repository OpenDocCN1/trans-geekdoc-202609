  \n## do...while 循环\n\n这是 `while` 循环的稍微变体。当你需要代码块执行一次后再进入条件判断时，可以使用它。请看以下代码：\n\n\
  ```html\n<html>\n<head>\n<title>这是我的 PHP 脚本</title>\n</head>\n<body>\n<?php\n$a\
