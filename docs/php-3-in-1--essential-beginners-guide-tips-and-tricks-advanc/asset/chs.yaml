  </html>\n```\n\n将其保存为 `prepend.php` 并保放在文档根目录下。现在创建另一个包含以下脚本的新文件：\n\n```html\n<html>\n\
  <head>\n    <title>This is PHP</title>\n</head>\n<body>\n    <?php\n    $stateAbbreviation\
  \ = \"WIS\";\n    print \"The State abbreviation should be \" . $stateAbbreviation\
  \ . \"<br>\";\n    $stateFull = convertState($stateAbbreviation);\n    if ($stateFull)\
  \ {\n        print \"The Full name of the state is \" . $stateFull . \"<br>\";\n\
  \    } else {\n        print \"The Full name of the state is not found for \" .\
  \ $stateAbbreviation . \"<br>\";\n    }\n    ?>\n</body>\n</html>\n```\n\n你应该将此文件保存为\
  \ `stateabbreviation.php` 并保放在文档根目录下。现在打开浏览器并打开 [`localhost/state.php`](http://localhost/state.php)。代码将检查会话是否已启动。如果没有，它将显示错误。`convertState`\
  \ 函数将接受一些参数进行转换。该函数将设置一个包含州全名的数组。如果你没有三字母缩写，你将在屏幕上看到错误。否则，你将看到州名。\n\n### 应用构建 (App\
  \ Building)\n大多数人使用 PHP 构建不同类型的网站。这种计算机语言允许程序员创建交互式 Web 应用。动态 Web 应用可以使用 HTML 表单从用户那里收集数据。从用户处获取并保存到网站数据库中的数据保持机密，这使得网站的安全性成为严重关注的问题。PHP\
  \ 具有允许程序员收割和安全存储数据的功能。PHP 包含了程序员构建 Web 应用所需的所有内容。\n\n### PHP 和 HTML\n没有必要将 PHP 代码嵌入不同的\
  \ HTML 文件中。你始终可以创建包含任何 HTML 元素的 PHP 文件。当你创建 Web 应用时，你会将这些语言合并到单个文件中。计算机专家认为 PHP\
  \ 是为了构建网站而创建的。正如你在之前的示例中看到的，你可以结合 PHP 和 HTML。这些语言并肩运行。让我们分析一下我提供的最新示例以理解它们是如何结合的。\n\
  \n```html\n<html>\n<head>\n    <title>This is PHP</title>\n</head>\n<body>\n   \
  \ <?php\n    abstract class ParentClass {\n        // 带有参数的抽象方法\n        abstract\
  \ function theprefixName($name);\n    }\n    class ChildClass extends ParentClass\
  \ {\n        public function theprefixName($vname, $separator = \".\", $vgreet =\
  \ \"My dear \") {\n            if ($vname == \"John Snow\") {\n                $theprefix\
  \ = \"Mister.\";\n            } elseif ($vname == \"Jane Snow\") {\n           \
  \     $theprefix = \"Mrs.\";\n            } else {\n                $theprefix =\
  \ \"\";\n            }\n            return $vgreet . $theprefix . $separator;\n\
  \        }\n    }\n    $class = new ChildClass();\n    echo $class->theprefixName(\"\
  John Snow\");\n    echo \"<br>\";\n    echo $class->theprefixName(\"Jane Snow\"\
  );\n    ?>\n</body>\n</html>\n```\n\n如果你分析该示例，你可以在 `body` 标签之后理解 PHP 是开始和结束的。在示例中，`<?php`\
  \ 表示嵌入 HTML 的 PHP 代码开始。`?>` 标记 PHP 脚本的结束。\n\n### 用户输入 (User Input)\n现在你已经理解 PHP\
  \ 如何存在于 HTML 文件中，现代 Web 应用需要操作空间。假设有一个在线书店需要登录系统。创建这样一个应用程序，你需要在注册过程中从用户那里获取许多信息，如用户名、密码和电子邮件\
  \ ID。查看下述代码以创建应用程序：\n\n```html\n<html>\n<head>\n    <title>This is a Sign-up app</title>\n\
  </head>\n<body>\n    <h1>You can freely Register</h1>\n    <form method=\"get\"\
  \ action=\"signup.php\">\n        <table>\n            <tr>\n                <td>填写你的电子邮件地址：</td>\n\
  \                <td><input type=\"text\" name=\"email\"/></td>\n            </tr>\n\
  \            <tr>\n                <td>姓名：</td>\n                <td><input type=\"\
  text\" name=\"first_name\"/></td>\n            </tr>\n            <tr>\n       \
  \         <td>这是期望的密码：</td>\n                <td><input type=\"password\" name=\"\
  desiredpassword\"/></td>\n            </tr>\n            <tr>\n                <td\
  \ colspan=\"5\"><input type=\"submit\" name=\"signup\" value=\"Sign up\"/></td>\n\
  \            </tr>\n        </table>\n    </form>\n</body>\n</html>\n```\n\n###\
  \ 构建 PHP CMS (Building a PHP CMS)\n可以认为，每个网站都使用某种内容管理系统 (CMS)。有很多很好的选项让我们使用 WordPress\
  \ 或 Drupal。然而，一个简单的 PHP 类可以帮助你创建一个。使用 PHP 将网站连接到数据库，显示表单，保存通过表单的数据并从数据库显示数据。通过下面的类，你将知道\
  \ MySQL 和 PHP 是交互的。\n\n### 类创建 (Class Creation)\n第一步是构建 PHP 类并将其保存为 `classCMS.php`。在\
  \ PHP 编辑器中查看如何创建类：\n\n```html\n<html>\n<head>\n    <title>This is PHP</title>\n\
  </head>\n<body>\n    <?php\n    class thisisCMS {\n        var $vhost;\n       \
  \ var $vusername;\n        var $vpassword;\n        var $vtable;\n        public\
  \ function dis_public() { }\n        public function dis_admin() { }\n        public\
  \ function vwrite() { }\n        public function vconnect() { }\n        private\
  \ function vbuildDB() { }\n    }\n    ?>\n</body>\n</html>\n```\n\n在 PHP 编辑器中创建了一个\
  \ CMS 的类。类中有四个变量。我使用面向对象编程来构建这个 CMS 应用，因为它有助于在大项目中保持代码整洁。它更容易接近和实践。这四个变量将用于将代码连接到数据库。它们将作为访问服务器数据库的桥梁。我现在将它们留空。我将进入数据库并使用\
  \ PHP 方法构建它：\n\n```php\nprivate function vbuildDB() {\n    $sql = <<<MySQL_QUERY\n\
  CREATE TABLE IF NOT EXISTS testDB (\n    title VARCHAR(150),\n    bodytext TEXT,\n\
  \    created VARCHAR(100)\n)\nMySQL_QUERY;\n    return mysql_query($sql);\n}\n```\n\
  \nprivate function vbuildDB() {\n    $sql = <<<MySQL_QUERY\nCREATE TABLE IF NOT\
  \ EXISTS testDB (\n    title VARCHAR(150),\n    bodytext TEXT,\n    created VARCHAR(100)\n\
  )\nMySQL_QUERY;\n    return mysql_query($sql);\n}\n```\n\n函数中有一个 MySQL 命令将检查数据库以验证\
  \ `testDB` 是否存在。如果是，它将传递一个成功通知；如果不是，将创建一个表并分配三列来保存数据。下一步是创建一个连接数据库的函数：\n\n```php\n\
  public function vconnect() {\n    mysql_connect($this->vhost, $this->vusername,\
  \ $this->vpassword) or die(\"I am unable to connect. \" . mysql_error());\n    mysql_select_db($this->vtable)\
  \ or die(\"I am unable to select the database. \" . mysql_error());\n    return\
  \ $this->vbuildDB();\n}\n```\n\n我调用了 `mysql_connect()` 连接数据库。之后，我使用了 `mysql_select_db()`\
  \ 来确保我将数据保存在正确的地方。这两个函数都应该带有 `die()` 命令。这确保了如果函数失败，脚本执行将停止，程序员可以看到消息来决定现在向哪个方向移动。`connect()`\
  \ 函数将帮助你与数据库建立连接并引导你进入正确的方向。在运行 `buildDB()` 函数之后，该函数每次用户加载页面都会运行。因此，我们必须确保不会在每次函数调用时覆盖数据库。当你创建了数据库后，你必须用内容填充它：\n\
  \n```php\npublic function dis_admin() {\n    return <<<ADMIN_FORM\n<form action=\"\
  <?_SERVER['PHP_SELF']}\" method=\"post\" >\n    <label for=\"this is the title\"\
  >Title:</label>\n    <input name=\"this is the title\" id=\"title\" type=\"text\"\
  \ maxlength=\"200\" />\n    <label for=\"bodytext\">Body Text:</label>\n    <textarea\
  \ name=\"bodytext\" id=\"bodytext\"></textarea>\n    <input type=\"submit\" name=\"\
  signup\" value=\"Sign up\"/>\n</form>\nADMIN_FORM;\n}\n```\n\n\n\n\n\n# 第九章：PHP\
  \ 在现代应用开发中的地位\n\nPHP 被认为是全球范围内受欢迎的编程语言之一。得益于 `Drupal` 和 `WordPress` 等内容管理系统（CMS）的巨大流行，大多数顶级网站都在使用它。借助\
  \ `Laravel` 和 `Symfony` 等流行框架，PHP 在开发 Web 应用方面一直需求巨大。基于 JavaScript 的 `Node.js` 曾挑战\
  \ `PHP` 的地位。然而，它未能撼动 PHP 长期以来占据的地位。仍有大量程序员在使用 PHP。尽管 PHP 是最面向对象且效率最高的语言之一，但在开发创新型和现代应用的选项上，它经常被忽视。开发者和决策者之间最常见的共识是，它在许多网站网站使用的\
  \ CMS 软件应用构建者中非常流行。它倾向于在 CMS 类电子商务商店和网络门户网站等通用编程项目中表现优异。PHP 仍然是全球一些最流行、最成功的科技公司的核心，例如\
  \ `Blablacar`、`Facebook` 和 `Slack`。`Slack` 对于需要管理数百名员工远程团队的企业来说非常受欢迎。越来越多的企业选择使用\
  \ `PHP` 为其初创公司构建现代应用。`PHP` 随着每天都在变得更好，为企业和开发者提供了许多优势。尽管存在刻板印象，它可以与 `WebSocket` 一起工作；但它也有自己的局限性。如果你有一个希望尽快投入市场的业务，你可以选择\
  \ `PHP`。当你与众多企业竞争时，你启动想法的速度至关重要。为了在竞争中保持领先，快速启动是一个好主意。快速启动将帮助你发现以前可能没有考虑过的独特业务模式。如果业务想法要求你创建一个\
  \ Web 应用，`PHP` 可以是一个完美选择。你可以使用流行的 PHP 框架 `Laravel` 和 `Symfony` 以非常快的方式创建 Web 应用程序。你可以从约\
  \ 81% 的网站使用 `PHP` 作为服务器端脚本语言这一事实中判断出 `PHP` 的流行程度。PHP 在现代应用开发中日益兴起是因为某些经过证实的益处。\n\
  \n## 内置功能\n与许多其他编程语言不同，`PHP` 最初是为 Web 应用开发而设计的。因此，设计者从一开始就向它塞入了许多构建不同类型网站和 Web 应用所需的特殊内置功能。你可以使用\
  \ `PHP` 中的内置功能（如 `functions` 和 `classes`）来执行各种 Web 开发操作和任务。在构建程序时，你可以在代码的任何点调用 `classes`\
  \ 和 `functions` 来执行特定任务。这使得 `PHP` 构建应用变得简单而有趣。`PHP` 支持多种操作系统，如 `Mac OSX`、`Windows`\
  \ 和 `UNIX`。用 `PHP` 编写的 Web 应用运行在所有主要平台上。你还可以将 `PHP` 部署在 `IIS`、`Netscape`、`Apache`、`Personal\
  \ Web server` 和 `iPlanet server` 上。因此，你可以构建 `PHP` 网站和应用程序，而不必担心托管选项和部署。\n\n## 灵活性\n\
  `PHP` 是一种高度灵活的语言，基于 `C++` 和 `C` 等流行编程语言设计。你可以轻松地阅读脚本、理解并使用这种服务器端编程语言的语法，而无需花费任何额外的精力和时间。你还有多种方式编写和使用\
  \ `PHP` 代码。你可以像我们在书中所有代码中做的那样将其嵌入 `HTML` 代码中，也可以将代码与 Web 框架结合。你还可以通过命令行界面执行它。\n\n\
  ## 流行数据库\n如今大多数 Web 应用都考虑如何高效快速地访问和交付大量数据。大企业总是希望在后端环境中使用高级数据库。`PHP` 支持许多广泛使用的数据库，如\
  \ `SQLite`、`MySQL` 和 `Frontbase` 等。这就是你如何满足不同业务客户的需求。如果我们分析 `PHP`，我们可以发现，通过使用大量的开源库和框架，我们可以大幅缩短编码时间。根据手头项目的需求，你可以从不同的\
  \ PHP 框架中选择，如 `CodeIgniter`、`CakePHP` 等许多。这些框架使得编码变得简单快速。你不需要通过使用 `Requests`、`Mink`、`Ratchet`\
  \ 和 `Faker` 等常用 PHP 库来编写大量的脚本和复杂的代码。`PHP` 以开源许可分发；因此，被许可使用所有组件而无需支付任何许可费用。\n\n##\
  \ PHP 的优势\n超文本预处理器（或 `PHP`）开发改变了过去 Web 开发的方式。毫无疑问，PHP 软件开发一直是用于开发动态和精确网站所部署的最敏捷、最先进的系统。`PHP`\
  \ 可以满足大型企业的需求。集成到网站中的功能必须是流畅的。毫无疑问，这是构建者喜欢它为客户定制大型网站的最青睐方面。这是因为使用 `PHP` 有许多优势。`Laravel`\
  \ PHP 内部开发由于一个出色的身份验证系统而不断增长。通过使用它，应用身份验证变得简洁。\n\n简单 API\n`Laravel` 超文本预处理器提供了一个流畅的平台，通过云服务或本地服务向不同人员发送应用内邮件。它还支持通过\
  \ `Slack` 等动态通道推送通知。当互联网应用在专业开发集成公司的帮助下移动时，它是完全安全的。\n\n## 优化\n许多 B2C Web 应用不仅应该非常易于使用，而且应该更容易被客户发现。互联网上的电子商务商店只有在拥有顶级搜索引擎优化（SEO）服务的情况下才能生存。如果你希望你的\
  \ Web 应用在在线上排名更高，你就必须为它填充最相关的关键词，以便在最流行的搜索引擎中排名。在开发阶段，你应该考虑这些事实。搜索引擎爬虫喜欢整洁的 `HTML`，因为它更容易阅读。创建整洁的代码是\
  \ `PHP` 最初创建的原因之一。以 Wikipedia 为例，它每天吸引海量流量。它是用 `PHP` 语言构建的。一些专家甚至，每个吸引惊人流量的富文本网站都是用\
  \ `PHP` 编写的。\n\n应用稳定性\n`PHP` 在过去的二十年里表现良好，它已被证明是一个稳定的解决方案。`Laravel` 和 `Symfony`\
  \ 已经用于现代应用开发多年。它们随着时间的推移而趋于成熟，并消除了曾经困扰这种语言的大多数缺陷。然而，随着技术趋势的改变和开发者预期的提高，这些框架正在不断改进。\n\
  \n## 维护\n与其它编程语言不同，`PHP` 对代码的可读性和维护性几乎没有强调。PHP 框架倾向于通过支持模型-视图-控制器（MVC）架构来简化应用的开发和维护。开发者可以利用该架构将\
  \ PHP 拆分为视图、模型和控制器。他们可以使用此功能将业务逻辑和界面逻辑层分离开来。除了为你编写代码外，`PHP` 还允许你自动处理一些常见任务。\n\n\n\
  \n\n\n# 第十章：PHP 应用开发技巧\n\n在过去的几年中，PHP 在速度和性能方面取得了显著改进。它已经变得惊人地快速。它为方法编写和返回类型提供了类型提示，并对语言进行了润色，使其更加一致。有许多辅助方法可以让你在编写更少代码的同时实现更多功能。如果你已经决定从现在开始使用\
  \ PHP 构建网站和应用程序，你应该迁移到 `PHP 7`。PHP 是如此流行，一些大公司已选择它来构建网站和应用，例如 Tumblr、Wikipedia、Facebook、TED\
  \ 和《国家地理》。是的，Facebook 运行在 PHP 之上。开发者喜欢这种语言，是因为它有非常好的文档。社区规模庞大，这意味着在开发过程中遇到任何问题，你都能获得支持。PHP\
  \ 高度可靠、成熟且稳定。PHP 团队在发布可能破坏旧功能的新功能时非常谨慎。此外，他们对发布版本有专业的路线图。\n\nPHP 的大部分声誉归功于 PHP 框架。该领域有两个巨头，在开发者中始终处于并不相让的状态。两者都非常出色，并且可以为你加快速度。然而，Laravel\
  \ 被认为更受欢迎。\n\n## Laravel\n该框架由 Taylor Otwell 创建，被定义为 Web 工艺人（Web Artisans）的最佳选择。它自\
  \ 2011 年以来就一直存在。Laravel 最棒的一点是它拥有极佳的学习曲线。如果你是一个传统的 PHP 开发者，你会发现使用起来非常顺滑。你还可以将其与队列、`Laravel\
  \ mix` 和缓存集成。它的主要特性包括用户管理、登录、用户注册、通知和身份验证系统。这些特性允许你在构建应用程序时加快进度。集合（collections）辅助方法允许你将数据转化为一种优雅的形式。\n\
  \n## PHP 技巧\n\n### 服务端语言\n服务端语言通常被设计得非常复杂，以便使网站受到恶意攻击的脆弱性降到最低。然而，PHP 通过简化服务端代码编写彻底改变了这一领域。由于其开源特性，PHP\
  \ 能够建立一个不断壮大的 Web 开发者社区，他们将其塑造成了如今的模样。由于这些开发者的头脑风暴，函数列表是无尽的，而能够简化你编码过程的框架也看不见头。\n\
  \n### 错误报告功能\n排在第一位的是 PHP 的错误报告功能。在开始使用 PHP 开发一个新项目之前，你应该开启 PHP 的错误报告功能。即使是专业开发者也对此深不怀疑。那么，接下来会发生什么？在生产模式中，你将看到很多有助于错误信息，而不是在每次发生问题时看到空白屏幕。它将帮助你在扫描代码时处理错误。总的来说，它会让编码过程变得高效且快速。在脚本开头包含以下功能，错误报告功能将自动开启。这将节省你为了检测错误时扫描数千行代码的痛苦。\n\
  \n```\ndisplay_errors = on\n```\n\n### 代码草图\n与你用 PHP 构建的所有程序一样，最终目标是为代码创建一个可用的界面。在深入开发\
  \ Web 应用程序之前，你应该对你的代码和数据结构画一个草图。在制作界面之前，你可能需要清楚你希望界面呈现成什么样。\n\n### 更新后的 PHP\nPHP\
  \ 被认为是一种广泛使用的语言。当你阅读这本书时，你会遇到许多术语，如 `constants`（常量）、`functions`（函数）、`classes`（类）和\
  \ `interfaces`（接口）。这些术语构成了 PHP 的主体。还有其他术语如 `variables`（变量）、`comments`（注释）、`inheritance`（继承）、`methods`（方法）和\
  \ `properties`（属性）。学习并理解这些术语是让你的网站极高效运行的关键。\n\n### 词汇\n你可以查看官方网站 `php.net` 上的来扩展你的词汇并掌握高级技能。\n\
  \n### OOP（面向对象编程）\n如果你还没有进入对象编程的世界，你就处于了劣势。你最终会落后。OOP 是你在书之前的章节中深入过的，它围绕 `classes`（类）或\
  \ `objects`（对象）展开，这可以将不同的事物连接在一起。它们消除了对代码的需求并帮助你完成任务。对象是允许开发者在开发阶段反复使用的类。\n\n###\
  \ 注释\n许多初级开发者认为不应该浪费时间写注释。但事实是，这是你应该在生活中尽早养成的习惯。作为一名开发者，你应该像编写代码时一样专注。每条注释都是你的参考，让你知道自己写了什么。这些注释倾向于解释你的程序或应用程序将走向的方向。然而，在代码中添加注释并不意味着让它混乱。只需做一些简短的笔记来提高代码的可读性，这样当你完成代码回到开头时，就不需要猜测你写了什么。另一种方法是对文件中的复杂部分进行文档说明，以便你可以理解一些复杂的细节。你绝不要在更改代码时忘记更改注释，否则它会让你困惑这到底是怎么回事。\n\
  \n### PHP 框架\nPHP 框架的设计目的是帮助开发者。如果你是一个理想的编码员，你可能需要几周或几个月才能从零创建一个 Web 应用程序。大部分时间将消耗在产生重复性代码上，这很很无聊。如果你愿意投入时间和精力，你应该去尝试。否则，请使用像\
  \ Laravel 这样的框架，我已经在书中解释过了。PHP 框架为这些问题提供了可行的解决方案。框架还确保了数据库与应用程序之间的连接。\n\n\n\n\n\n\
  ## 结论\n\n现在你已经读到了这本书的最后，我希望你学习了许多关于 `PHP` 脚本语言的基础知识。我在书中为你提供了实用的代码、说明和深度解释，以便你利用它们来理解脚本，并通过编辑它们来创建独特的脚本。如果你能够应用书中学学的课程，你将在短时间内成为一名熟练的用户。\n\
  \n除了旨在通过登录界面猜测密码的暴力破解外，日日夜地工作以利用网站 `PHP` 代码中漏洞的机器人，被认为是针对你网站漏洞的最常见的攻击形式。你必须不断考虑\
  \ `PHP` 编码中的漏洞，以便你能够消除它们并让你的 `PHP` 代码更强大。\n\n远程代码执行\n远程代码执行（RCE）是指黑客向网站上传恶意代码并立即执行它的攻击方式。如果\
  \ `PHP` 中存在漏洞，它将接受用户的恶意输入并将其视为 `PHP` 代码。这允许黑客指示网站创建一个包含代码的新文件，该代码将授予恶意黑客对网站的完全访问。当黑客将代码发送到\
  \ Web 应用并被及时执行时，将授予黑客访问你网站的权限。通过这种方式，他们可以成功利用 `RCE` 漏洞。\n\nSQL 注入\nSQL 注入是黑客可以利用来攻击你\
  \ Web 应用的另一种漏洞。通过 `SQL Injection`，黑客可以向 Web 应用的数据库发送恶意指令。由于代码中的漏洞，Web 应用数据库执行这些指令并允许黑客进入。这种攻击通常发生在\
  \ Web 人员没有用户输入安装过滤屏的情况下。这允许恶意用户在 Web 应用中填充恶意代码。SQL 注入将允许黑客访问网站数据。黑客可以在数据库中创建可能包含垃圾网站链接的新数据。攻击者可能使用\
  \ `SQL Injection` 创建管理员账户，并使用它获取你网站应用程序的完全控制权。防止此类漏洞的最佳方法是为用户输入设置过滤屏。应该先验证输入，然后允许其进入网站数据库。\n\
  \n跨站脚本 (XSS)\n当恶意黑客找到在网站上加载并执行恶意代码的方法时就会发生跨站脚本（XSS）。这种恶意代码可以授予恶意黑客管理员权限。存储型 XSS\
  \ 发生在黑客让网站存储恶意代码，这些代码随后在另一个用户的浏览器中呈现并相应执行时。一个实际例子是黑客在 `WordPress` 网站上发布包含恶意代码的评论。反射型\
  \ XSS 发生在攻击者创建一个包含恶意代码的链接并将其加载到浏览器中。网站将其读取为网站内容。代码随后在用户的浏览器中执行，可能会让黑客窃取 cookie 或执行恶意任务。\n\
  \n这些是你学习 `PHP` 之后应该考虑的一些 Web 应用漏洞。这本书是学习 `PHP` 及其内部细节的完整教程。我详细解释了主要主题，以便你了解网站应用程序是如何工作的。网站的两个主要部分已经得到了详细解释。你可以利用这些实用的信息，并在\
  \ Web 应用领域进一步增强你的知识。\n\n## 资源\n\n1. https://css-tricks.com/php-for-beginners-building-your-simple-cms/\n\
