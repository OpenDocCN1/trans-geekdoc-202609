  \ `while` 关键字旁，来改变 `while` 循环。这样它就成了 `while` 循环条件表达式的一部分。PHP 在所有 `while` 循环迭代的开始时都会检查\
  \ `$a` 变量，在此之前观察到它首先自增了变量并与其值进行比较。唯一的区别是循环将从 2 开始。若要将其调整为 1，你需要调整变量的初始值。\n\n```html\n\
