  ```\n\n# PHP 中的弱类型类型\n\n由于 PHP 是一种弱类型语言，我们不需要告诉 PHP 它正在处理的是什么类型的变量。你可以看到它处理整数的方式与处理字符串相同。不需要将整数转换为字符串，就像我们在\
  \ Python 语言中必须做的那样。Python 根据变量的值自动为变量关联数据类型。由于数据类型在严格意义上没有设置，你可以进行许多操作，例如字符串与整数相加，而不会触发错误。\n\
  \n```html\n<html>\n<head>\n<title>这是我的 PHP 脚本</title>\n</head>\n<body>\n<?php\n\
  function addingtheNumbers(int $x, int $y) {\n    return $x + $y;\n}\necho addingtheNumbers(10,\
