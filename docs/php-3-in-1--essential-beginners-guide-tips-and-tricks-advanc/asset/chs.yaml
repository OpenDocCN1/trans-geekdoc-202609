  \n# PHP ![](img/Image00004.jpg)\n## 构建现代 PHP 应用的技巧与窍门 Logan Pratt\n\n\n\n\n\n# 简介\n\
  \n![](img/Image00003.jpg)\n\n本书包含了关于如何使用 `PHP` 编写 Web 应用的经过的步骤和策略。你将通过功能性代码学习 `PHP`\
  \ 的独特特性，这些代码可以在 `PHP` 编辑器中用于实践练习。我已确保你将学习到创建 Web 应用（如内容管理系统 `CMS`）所需的所有基础和高级别代码。\n\
  \n由于 `MySQL` 是 `PHP` 的不可或缺的一部分，我专门用了一个章节介绍了 `MySQL` 的各种语句，你可以用它们来操作数据库。没有 `MySQL`，`PHP`\
  \ 就是空壳，因为每个 Web 应用都需要数据库来引导用户信息并将其存储供以后使用。`PHP` 并不老；我们可以将它的起源追溯到 1994 年，当时 Rasmus\
  \ Lerdorf 编写了第一个版本。它在最初阶段是用 `C` 语言构建的，目的是替换他在个人主页上使用的 `Perl` 代码段。\n\n它一直在演进；然而，直到\
  \ 1995 年，他才发布了这种语言第一个正式公开版本。此时，`PHP` 被称为“个人主页工具”（Personal Homepage Tools）。`JavaScript`\
  \ 将于 1996 年作为一种客户端语言发布。`PHP` 此时作为服务端语言的发布，说明了当时互联网工具的巨大增长。\n\n1998 年，`PHP` 获得了由\
  \ Andi Gutmans 和 Zeev Suraski 发布的第三版本。新版本有了它独特的名称“超文本预处理器”（Hypertext Preprocessor）。这个版本让\
  \ `PHP` 赢得了巨大的关注。`PHP` 第 4 版本于 2000 年推出，被称为“Zend Engine”。这个版本将 `PHP` 提升到了前所未有的水平。它消除了\
  \ `PHP` 的某些缺点，使其成为更完整的语言。\n\n`PHP` 第 5 版本于 2004 年发布，具有许多新特性，例如改进的面向对象编程版本和更好的性能。`PHP\
  \ 7` 于 2014 年和 2015 年发布。它进一步更新了 `PHP` 以适应更高层次的 Web 开发。当世界知道马克·扎克伯格（Mark Zuckerberg）使用它创建了世界著名的应用\
  \ `Facebook` 时，`PHP` 声名大噪。当马克在 2003 年从哈佛退学时，他采用了这种语言创建了该应用，而 `Facebook` 应用后端仍在使用这种语言。`Facebook`\
  \ 此后开发了自己的名为 `Hack` 的语言，但它是 `PHP` 的一个版本。\n\n本书包含了实用的步骤，帮助你理解 Web 应用服务端发生了什么。它将帮助你了解\
  \ `PHP` 和 `MySQL` 的细节，它们在创建 Web 应用时通常是并行的。我将本章分为 11 章，以方便读者阅读。书的每一章都涉及一个独特的话。我建议你在读书时下载并安装一个\
  \ `PHP` 编辑器或打开在线 `PHP` 编辑器进行练习。你可以使用书中的示例代码，并理解它们在放入编辑器后是如何工作的。我希望你的阅读之旅是奇妙的，你将成为一个知识渊博的人。\n\
  \n## 第 1 章：PHP 的安装\n\n书的第一章侧重于在你的计算机上安装 `PHP`。这是一个复杂的过程。你应该读几次以理解如何操作。在 `Linux`\
  \ 和 `Mac OS` 上的过程不会像在 `Windows` 操作系统上那么困难。我按步骤解释了这个话题。第一章是在你的操作系统上安装 Web 服务器，市场上有许多可用服务器，你可以随意选择。\n\
