  \          \"NCA\" => \"North Carolina\",\n            \"NDA\" => \"North Dakota\"\
  ,\n            \"OHO\" => \"Ohio\",\n            \"OKA\" => \"Oklahoma\",\n    \
  \        \"ORG\" => \"Oregon\",\n            \"PSA\" => \"Pennsylvania\",\n    \
  \        \"RDI\" => \"Rhode Island\",\n            \"SCA\" => \"South Carolina\"\
  ,\n            \"SDA\" => \"South Dakota\",\n            \"TNS\" => \"Tennessee\"\
  ,\n            \"TXS\" => \"Texas\",\n            \"UTA\" => \"Utah\",\n       \
