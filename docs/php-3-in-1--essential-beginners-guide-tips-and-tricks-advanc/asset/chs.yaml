  \ 包含因子\n\n为了在页面中包含页脚文件，你应该使用 `include` 语句。\n\n```php\n<html>\n<head>\n  <title>This\
  \ is PHP</title>\n</head>\n<body>\n  <h1>You are welcome to this home page!</h1>\n\
  \  <p>I would love to help in making your business successful.</p>\n  <p>Would like\
  \ to consider into our offers.</p>\n  <?php include 'footer.php';?>\n</body>\n</html>\n\
  ```\n\n## 文件处理\n\n文件处理是 Web 应用程序不可的一部分。有很多函数用于读取、编辑和上传文件。当你尝试操作文件时，应该小心，以免无意中删除内容给程序造成重大损害。\n\
  \n```php\n<?php echo readfile(\"countrieslist.txt\"); ?>\n```\n\n## readfile() 函数\n\
  \nPHP `readfile()` 函数通常读取文件并将其写入输出缓冲区。你可以添加其他关键字如 `fread()` 和 `fclose()` 来读取文件后关闭它。\n\
  \n## 异常处理\n\n异常是一个揭示 PHP 脚本错误或任何意外行为的对象。PHP 函数或类通常带有许多异常。当遇到无法使用的数据时，异常是停止特定函数的更好方法。`throw`\
  \ 语句允许自定义函数抛出异常。当抛出一个异常时，后续代码将不会执行。如果异常从未捕获，将发生致命错误。\n\n```php\nfunction thedivide($thedividend,\
  \ $thedivisor) {\n  if($thedivisor == 0) {\n    throw new Exception(\"This is a\
  \ division by zero\");\n  }\n  return $thedividend / $thedivisor;\n}\ntry {\n  echo\
  \ thedivide(10, 0);\n} catch(Exception $e) {\n  echo \"This is unable to be divided.\"\
  ;\n}\n```\n\n## finally 语句\n\n`try...catch...finally` 语句也可以用于检测某些异常。`finally`块中的代码无论异常是否被捕获都会运行。如果你在代码中添加\
  \ `finally`，`catch` 块将是可选的。\n\n```php\nfunction thedivide($thedividend, $thedivisor)\
  \ {\n  if($thedivisor == 0) {\n    throw new Exception(\"It will be a division by\
  \ zero\");\n  }\n  return $thedividend / $thedivisor;\n}\ntry {\n  echo thedivide(200,\
  \ 10);\n} catch(Exception $e) {\n  echo \"This is unable to be divided. \";\n} finally\
  \ {\n  echo \"This means that the process is complete.\";\n}\n```\n\n查看数字不能整除的示例：\n\
  \n```php\nfunction thedivide($thedividend, $thedivisor) {\n  if($thedivisor == 7)\
  \ {\n    throw new Exception(\"It will be a division by zero\");\n  }\n  return\
  \ $thedividend / $thedivisor;\n}\ntry {\n  echo thedivide(17, 7);\n} catch(Exception\
  \ $e) {\n  echo \"This is unable to be divided. \";\n} finally {\n  echo \"This\
  \ means that the process is complete.\";\n}\n```\n\n查看另一个示例。\n\n```php\nfunction\
  \ thedivide($thedividend, $thedivisor) {\n  if($thedivisor == 19) {\n    throw new\
  \ Exception(\"It will be a division by zero\");\n  }\n  return $thedividend / $thedivisor;\n\
  }\ntry {\n  echo thedivide(5276, 47);\n} catch(Exception $e) {\n  echo \"This is\
  \ unable to be divided. \";\n} finally {\n  echo \"This means that the process is\
  \ complete.\";\n}\n```\n\n\n\n\n\n# 第七章：MySQL 基础\n\n许多网站都需要后端数据库，用于存储网页向用户显示的信息，或者存储用户在网站上填写的信息。`MySQL`\
  \ 是一种非常受欢迎的网站数据库。它被开发为一种轻量级且快速的网站系统。`MySQL` 在使用 `PHP` 编写的网站中特别流行。简而言之，`MySQL` 和\
  \ `PHP` 能够很好地协作。\n\n`MySQL` 包含一个 `MySQL server`、一组辅助管理 `MySQL` 数据库的实用程序，以及 `MySQL\
  \ server` 需要的一些辅助软件。`MySQL server` 被视为数据库系统的管理器，可以处理所有的数据库指令。作为一个关系型数据库系统 (`RDBMS`)，`MySQL\
  \ server` 倾向于同时管理多个数据库。许多人可能控制由一个 `MySQL server` 管理的不同数据库。\n\n每个数据库都有一个可以存储数据的结构。通常情况下，数据库在没有数据的情况下。你可以以表格的形式在数据库内部存储数据。在向数据库添加数据之前，必须先创建表。开始时创建一个空数据库，稍后再填充数据。表中的每一行代表一个实体，例如一本书或一个项目。每一列携带有关实体的项信息，例如书名或客户名。数据库包含一个或多个表，每个表都可以通过特定的名称标识。就像普通表一样，`MySQL`\
  \ 表包含列和行。\n\n## MySQL 查询\n\n查询语言主要是英语。它由英语短语和句子组成。你不需要看懂并学习一种深奥的技术语言来编写查询。语句的第一个单词是它的名称；它是一个动词，告诉\
  \ `MySQL` 你想让它做什么。这些语句将在本章中讨论。\n\n你不能在你的系统上安装或卸载 `MySQL`，因为它运行在网络托管计算机上。你可以通过账户访问\
  \ `MySQL` 中的数据。\n\n### SQL SELECT\n\n第一行语句是 `SQL select` 语句。我有一个目前存放在数据库中的演示数据库。你数据库中的表如下：\n\
  \n| CustomerID | Customer Name | Contact Number | Secret Code | Country |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 1. | Emily Jack | 55779034 | 45 | United States\
  \ |\n| 2. | Jason Austin | 34568988 | 2 | United Kingdom |\n| 3. | Amanda McMahon\
  \ | 34578899 | 1 | Ireland |\n| 4. | Victoria Ann | 23768800 | 67 | Germany |\n\
  | 5. | Simon Wiz | 45327899 | 9 | United States |\n| 6. | Tracy Drupal | 23897609\
  \ | 8 | France |\n| 7. | Emilia Tim | 45890093 | 3 | Italy |\n| 8. | Tyson Jackson\
  \ | 34980900 | 2 | Sweden |\n\n这就是我们拥有的，我们可以通过 `SQL` 语句来访问它。如果你想显示整个表，可以使用以下语句：\n\
  \n```\nSELECT * FROM Members;\n```\n\n在这个语句中，`Members` 是上述表的名称。其余部分属于 `SQL`。如果你使用得当，`Select`\
  \ 语句非常有趣。你可以用它来显示表中不同的列。例如，你在一家拥有上述数据库的公司工作。你的老板要求你只打印成员姓名及其原产国的列表，而忽略数据库的其他部分。你可以使用以下语句在几秒钟内完成：\n\
  \n```sql\nSELECT CustomerName, Country FROM Members;\n```\n\n| Customer Name | Country\
  \ |\n| :--- | :--- |\n| Emily Jack | United States |\n| Jason Austin | United Kingdom\
  \ |\n| Amanda McMahon | Ireland |\n| Victoria Ann | Germany |\n| Simon Wiz | United\
  \ States |\n| Tracy Drupal | France |\n| Emilia Tim | Italy |\n| Tyson Jackson |\
  \ Sweden |\n\n`DISTINCT` 语句经常用于返回唯一值。当 `MySQL` 表包含重复值时，`DISTINCT` 语句可以过滤掉它们。\n\n\
  | Customer ID | Customer Name | Contact Number | Secret Code | Country |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 1. | Emily Jack | 55779034 | 45 | United States\
  \ |\n| 2. | Jason Austin | 34568988 | 2 | United Kingdom |\n| 3. | Amanda McMahon\
  \ | 34578899 | 1 | Ireland |\n| 4. | Victoria Ann | 23768800 | 67 | Germany |\n\
  | 5. | Simon Wiz | 45327899 | 9 | United States |\n| 6. | Tracy Drupal | 23897609\
  \ | 8 | France |\n| 7. | Emilia Tim | 45890093 | 3 | Italy |\n| 8. | Tyson Jackson\
  \ | 34980900 | 2 | Sweden |\n\n`WHERE` 子句用于过滤记录。例如：\n\n```sql\nSELECT * FROM Members\
  \ WHERE Country = 'United States';\n```\n\n看 `WHERE` 语句的另一个示例：\n\n```sql\nSELECT\
  \ * FROM Members WHERE CustomerID=1; WHERE CustomerID=2; WHERE CustomerID=3; WHERE\
  \ CustomerID=4; WHERE CustomerID=5; WHERE CustomerID=6; WHERE CustomerID=7;\n```\n\
  \n\n\n\n\n| 7 | Emilia Tim | 45890093 | 3 | Italy |\n\n## AND 语句\n\n以下语句将选择 `Members`\
  \ 表中所有国家为美国（United States）或 `Secret Code` 为 7 的字段。执行语句之前，我将对数据库表进行一些更改并显示出来。\n\n\
  | Customer ID | Customer Name | Contact Number | Secret Code | Country |\n| ---\
  \ | --- | --- | --- | --- |\n| 1 | Emily Jack | 55779034 | 45 | United States |\n\
  | 2 | Jason Austin | 34568988 | 7 | United Kingdom |\n| 3 | Amanda McMahon | 34578899\
  \ | 7 | Ireland |\n| 4 | Victoria Ann | 23768800 | 67 | Germany |\n| 5 | Simon Wiz\
  \ | 45327899 | 7 | United States |\n| 6 | Tracy Drupal | 23897609 | 7 | France |\n\
  | 7 | Emilia Tim | 45890093 | 3 | Italy |\n| 8 | Tyson Jackson | 34980900 | 7 |\
  \ Sweden |\n| 9 | Tom Dick | 45980999 | 4 | United States |\n| 10 | Dane harry |\
  \ 47889933 | 0 | United States |\n\n这是该语句：\n```\nSELECT * FROM Members WHERE Members=\
  \ ‘United States’ AND SecretCode=7;\n```\n\n| Customer ID | Customer Name | Contact\
  \ Number | Secret Code | Country |\n| --- | --- | --- | --- | --- |\n| 1 | Emily\
  \ Jack | 55779034 | 45 | United States |\n| 2 | Jason Austin | 34568988 | 7 | United\
  \ Kingdom |\n| 3 | Amanda McMahon | 34578899 | 7 | Ireland |\n| 5 | Simon Wiz |\
  \ 45327899 | 7 | United States |\n| 6 | Tracy Drupal | 23897609 | 7 | France |\n\
  | 8 | Tyson Jackson | 34980900 | 7 | Sweden |\n| 9 | Tom Dick | 45980999 | 4 | United\
  \ States |\n| 10 | Dane harry | 47889933 | 0 | United States |\n\n另一个惊人的语句被称为 `OR`\
  \ 语句。它允许你在从数据库中检索数据时更有选择性。\n```\nSELECT * FROM Members WHERE Country= ‘United States’\
  \ OR SecretCode=7;\n```\n\n| Customer ID | Customer Name | Contact Number | Secret\
  \ Code | Country |\n| --- | --- | --- | --- | --- |\n| 1 | Emily Jack | 55779034\
  \ | 45 | United States |\n| 2 | Jason Austin | 34568988 | 7 | United Kingdom |\n\
  | 3 | Amanda McMahon | 34578899 | 7 | Ireland |\n| 5 | Simon Wiz | 45327899 | 7\
  \ | United States |\n| 6 | Tracy Drupal | 23897609 | 7 | France |\n| 8 | Tyson Jackson\
  \ | 34980900 | 7 | Sweden |\n| 9 | Tom Dick | 45980999 | 4 | United States |\n|\
  \ 10 | Dane harry | 47889933 | 0 | United States |\n\n再看另一个例子。\n```\nSELECT * FROM\
  \ Members WHERE Members= ‘United States’ OR CustomerID=2;\n```\n\n| Customer ID\
  \ | Customer Name | Contact Number | Secret Code | Country |\n| --- | --- | ---\
  \ | --- | --- |\n| 1 | Emily Jack | 55779034 | 45 | United States |\n| 2 | Jason\
  \ Austin | 34568988 | 7 | United Kingdom |\n| 5 | Simon Wiz | 45327899 | 7 | United\
  \ States |\n| 9 | Tom Dick | 45980999 | 4 | United States |\n| 10 | Dane harry |\
  \ 47889933 | 0 | United States |\n\n如果你想保留一条目并检索其他条目，可以在脚本中使用 `NOT` 语句。\n```\nSELECT\
  \ * FROM Members WHERE NOT Country= ‘Sweden’;\n```\n\n| Customer ID | Customer Name\
  \ | Contact Number | Secret Code | Country |\n| --- | --- | --- | --- | --- |\n\
  | 1 | Emily Jack | 55779034 | 45 | United States |\n| 2 | Jason Austin | 34568988\
  \ | 7 | United Kingdom |\n| 3 | Amanda McMahon | 34578899 | 7 | Ireland |\n| 4 |\
  \ Victoria Ann | 23768800 | 67 | Germany |\n| 5 | Simon Wiz | 45327899 | 7 | United\
  \ States |\n| 6 | Tracy Drupal | 23897609 | 7 | France |\n| 7 | Emilia Tim | 45890093\
  \ | 3 | Italy |\n| 9 | Tom Dick | 45980999 | 4 | United States |\n| 10 | Dane harry\
  \ | 47889933 | 0 | United States |\n\n## 组合 AND, OR NOT\n\n你可以组合这三个语句使操作更加精确和整洁。以下语句将选择\
  \ `Members` 表中国家为美国且名字为 Emilia Jackson 的字段。这是该表：\n\n| Customer ID | Customer Name\
  \ | Contact Number | Secret Code | Country |\n| --- | --- | --- | --- | --- |\n\
  | 1 | Emilia Jackson | 55779034 | 45 | United States |\n| 2 | Jason Austin | 34568988\
  \ | 7 | United Kingdom |\n| 3 | Amanda McMahon | 34578899 | 7 | Ireland |\n| 4 |\
  \ Victoria Ann | 23768800 | 67 | Germany |\n| 5 | Harry Styles | 45327899 | 7 |\
  \ United States |\n| 6 | Tracy Drupal | 23897609 | 7 | France |\n| 7 | Emilia Tim\
  \ | 45890093 | 3 | Italy |\n| 8 | Tyson Jackson | 34980900 | 7 | Sweden |\n| 9 |\
  \ Emilia Jackson | 45980999 | 4 | United States |\n| 10 | Harry Styles | 47889933\
  \ | 0 | United States |\n\n让我们编写 SQL 语句。\n```\nSELECT * FROM Members WHERE Members=\
  \ ‘United States’ AND (CustomerName=‘Emilia Jackson’ OR CustomerName=‘Harry Styles’);\n\
  ```\n\n你可以使用 `AND NOT` 语句从表中排除两个条目，然后在屏幕上完整打印出来。\n\n| Customer ID | Customer Name\
  \ | Contact Number | Secret Code | Country |\n| --- | --- | --- | --- | --- |\n\
  | 1 | Emilia Jackson | 55779034 | 45 | United States |\n| 2 | Jason Austin | 34568988\
  \ | 7 | United Kingdom |\n| 3 | Amanda McMahon | 34578899 | 7 | Ireland |\n| 4 |\
  \ Victoria Ann | 23768800 | 67 | Germany |\n| 5 | Harry Styles | 45327899 | 7 |\
  \ United States |\n| 6 | Tracy Drupal | 23897609 | 7 | France |\n| 7 | Emilia Tim\
  \ | 45890093 | 3 | Italy |\n| 8 | Tyson Jackson | 34980900 | 7 | Sweden |\n| 9 |\
  \ Emilia Jackson | 45980999 | 4 | United States |\n| 10 | Harry Styles | 47889933\
  \ | 0 | United States |\n\n```\nSELECT * FROM Members WHERE NOT Country= ‘Sweden’\
  \ AND NOT Country= ‘United Kingdom’;\n```\n\n## ORDER BY 关键字\n\n你可以使用 `ORDER BY`\
  \ 关键字按升序或降序对结果排序。`ORDER BY` 关键字默认按升序排序记录。要按降序排序，可以使用 `DESC` 关键字。这是当前形式的表。\n\n| Customer\
  \ ID | Customer Name | Contact Number | Secret Code | Country |\n| --- | --- | ---\
  \ | --- | --- |\n| 1 | Emilia Jackson | 55779034 | 45 | United States |\n| 2 | Jason\
  \ Austin | 34568988 | 7 | United Kingdom |\n| 3 | Amanda McMahon | 34578899 | 7\
  \ | Ireland |\n| 4 | Victoria Ann | 23768800 | 67 | Germany |\n| 5 | Harry Styles\
  \ | 45327899 | 7 | United States |\n| 6 | Tracy Drupal | 23897609 | 7 | France |\n\
  | 7 | Emilia Tim | 45890093 | 3 | Italy |\n| 8 | Tyson Jackson | 34980900 | 7 |\
  \ Sweden |\n| 9 | Emilia Jackson | 45980999 | 4 | United States |\n| 10 | Harry\
  \ Styles | 47889933 | 0 | United States |\n\n\n\n\n\n| 10\\. | Harry Styles | 47889933\
  \ | 0 | United States |\n\n这是你需要输入的语句。\n```\nSELECT * FROM Members ORDER BY Members;\n\
  ```\n\n| Customer ID | Customer Name | Contact Number | Secret Code | Country |\n\
  | --- | --- | --- | --- | --- |\n| 6\\. | Tracy Drupal | 23897609 | 7 | France |\n\
  | 4\\. | Victoria Ann | 23768800 | 67 | Germany |\n| 3\\. | Amanda McMahon | 34578899\
  \ | 7 | Ireland |\n| 7\\. | Emilia Tim | 45890093 | 3 | Italy |\n| 8\\. | Tyson\
