  \ 方法\n\nPHP 构造函数允许你在创建对象时初始化其属性。如果你创建了 `__construct()` 方法，PHP 会在构建对象时调用它。构造函数以双划线开始。\n\
  \n```php\n<!DOCTYPE html>\n<html>\n<body>\n<?php \nclass Guns { \n    // Class Properties\n\
  \    public $gname;\n    public $gcolor;\n    public $gcapacity;\n    function __construct($gname,\
  \ $gcolor, $gcapacity) {\n        $this->gname = $gname;\n        $this->gcolor\
  \ = $gcolor;\n        $this->gcapacity = $gcapacity;\n    }\n    function getting_the_name()\
  \ {\n        return $this->gname;\n    }\n    function getting_the_color() {\n \
  \       return $this->gcolor;\n    }\n    function getting_the_capacity() {\n  \
  \      return $this->gcapacity;\n    }\n} \n$bazooka = new Guns('This is a hard-hitting\
  \ bazooka ready for waging war.', 'The color of my bazooka is black.', 'I can load\
  \ up to six rockets to my bazooka. This is a beast for the enemy.');\n$revolver\
  \ = new Guns('This is a revolver to kill the guards at the gates silently.', 'The\
  \ color of the revolver is silver grey.', 'I can load up to ten bullets to my revolver.\
  \ This is a beast for the enemy.');\n$Ak47 = new Guns('This is an Ak47 to kill the\
  \ guards at the gates silently.', 'The color of the gun is brown.', 'I can load\
  \ up to twenty bullets to my gun. This is a beast for the enemy.');\n$shotgun =\
  \ new Guns('This is a shotgun to kill the enemy with a bang.', 'The color of the\
  \ gun is brown.', 'I can load up to two bullets to my gun. This is a beast for the\
  \ enemy.');\necho \"Name of the bazooka: \" . $bazooka->getting_the_name();\necho\
  \ \"\\n\";\necho \"Color of the bazooka: \" . $bazooka->getting_the_color();\necho\
  \ \"\\n\";\necho \"Capacity of the bazooka: \" . $bazooka->getting_the_capacity();\n\
  echo \"\\n\";\necho \"Name of the revolver: \" . $revolver->getting_the_name();\n\
  echo \"\\n\";\necho \"Color of the revolver: \" . $revolver->getting_the_color();\n\
  echo \"\\n\";\necho \"Capacity of the revolver: \" . $revolver->getting_the_capacity();\n\
  echo \"\\n\";\necho \"Name of the rifle: \" . $Ak47->getting_the_name();\necho \"\
  \\n\";\necho \"Color of the rifle: \" . $Ak47->getting_the_color();\necho \"\\n\"\
