  # 第 7 章 — 商业智能


  ## 什么是商业智能？

  商业智能（`BI`）是用于分析业务数据的技术和设备的集合。当商业智能任务将外部数据源与内部数据热点相结合以获得显著的理解时，这些任务整体变得愈发重要。


  业务分析（也称为高级分析）是一个经常与商业智能交替使用的术语。然而，业务分析是商业智能的一个子集，因为商业智能管理方法论和设备，而业务分析更侧重于技术手段。商业智能是描述性的，而业务分析则越来越具有规范性，倾向于解决特定问题或业务问题。


  竞争情报是商业智能的一个子集。竞争情报是用于收集、获取和分析竞争对手业务数据的数据、工具和形式。竞争情报通常用于筛选产品之间的差异。


  ## 商业智能在企业估算中的应用

  许多商业智能工具被应用于估算场景中。它们可以从传感器、`CRM`框架、网络流量等获取输入数据以衡量 `KPIs`。例如，一家大型组装公司的办公小组解决方案可能包含传感器，用于测量关键硬件的温度，以优化支持计划。


  ### 分析

  分析是对数据进行调查以发现重要模式和见解的过程。这是商业智能工具的一个著名用途，因为它允许企业深入理解其数据，并通过数据驱动的决策产生动力。例如，一家营销公司可以使用分析来决定客户细分，以更好地转化另一类客户。


  ### 报告

  报告生成是商业智能软件的标准用途。`BI`产品现在可以持续为内部相关者生成常规报告，为分析师自动化基础任务，并减少对电子表格和文字处理程序的需求。例如，一名业务活动分析师可以使用该工具创建一份周报，按地理位置列出上周的交易情况——这项任务在手动操作时显然需要更多精力。有了了高效的报告工具，创建此类报告所需的精力将完全减少。有时，商业智能工具可以完全自动化报告流程。


  ### 协作

  协作功能允许用户对相同的数据和记录进行渐进的工作，这在当今的商业智能平台中非常常见。跨设备协作将继续推动比以往更好的商业智能工具的发展。在创建新的报告或仪表板时，`BI`平台上的协同工作可能至关重要。例如，一家创新公司的
  CEO 可能需要在 24 小时内获得关于另一个产品的亮点系列数据的定制报告或仪表板。产品管理员、数据分析师和 QA 分析师可以使用协作式`BI`工具同时创建他们各自的报告或仪表板部分，以准时完成。


  ## 商业智能的最佳实践

  如果组织投入并审慎地执行，商业智能活动极有可能成功。基本因素包括：


  ### 业务赞助

  业务赞助是最成功的因素，因为即使是最完美的系统也无法克服业务责任的缺失。如果组织无法项目的预算限制，或者官员忙于非`BI`活动，该任务将无法成功。


  ### 业务需求

  理解业务需求对于正确实施商业智能框架至关重要。这种理解是双向的——终端用户和 IT 部门都有重要的需求，且这些需求经常变化。为了获得对`BI`需求的这种基本理解，组织必须分析其成员的所有不同需求。


  ### 数据的总量和质量

  如果商业智能活动能够大规模整合优质数据，它就是有效的。基础数据源包括客户关系管理（`CRM`）软件、传感器、营销活动和资源计划（`ERP`）设备。糟糕的数据将导致糟糕的决策，因此数据质量至关重要。处理数据特性的典型程序是数据分析，即对数据进行检查并收集统计以改进数据管理。它维护了一致性，降低了风险并通过元数据简化搜索。


  ### 客户体验

  一致的客户体验对于商业智能来说是基础，因为它可以促进客户接受，并最终从`BI`产品和活动产生更多动力。如果没有真实且实用的界面，终端用户的接受将是一场战斗。


  ### 数据收集和清洗

  数据可以从大量来源收集，并可以轻易使组织崩溃。为了预测这一点并从商业智能项目中产生动力，组织必须区分基础数据。商业智能数据经常包含`CRM`数据、竞争对手数据、行业数据等。


  ### 项目管理

  稳固项目最基本的解决方法之一是在项目人员、IT 部门和终端用户之间建立必要的通信渠道。


  ### 获得支持

  在获取另一个商业智能产品时，获得高层管理者的支持至关重要。可以通过告知 IT 偏好和需求来获得 IT 的支持。终端用户也有自己的需求和偏好，具有各种要求。


  ### 需求收集

  需求收集似乎是应该遵循的最重要的实践，因为在对几个`BI`设备进行评估时，它考虑了更多的透明度。需求源于几次成员会议，包括 IT 和业务客户。


  ### 培训

  培训驱动终端用户的选择。如果终端用户没有准备准备好，接受和价值创造将变得越来越难以实现。许多商业智能供应商（包括`MicroStrategy`）提供培训服务，其中包括针对所有相关客户的培训和认证。培训可以涵盖任何与商业智能项目相关的关键收集。


  ### 支持

  支持工程师（通常由商业智能供应商提供）解决产品或服务内部的专业问题。熟悉`MicroStrategy`的支持功能。


  ### 其他

  组织在使用尖端分析之前，应确保建立基本的`BI`能力，这在产生价值之前需要一些关键先决条件。例如，商业智能活动是——如文中提供的。





  # 第 8 章 — 数据挖掘


  数据挖掘是机器学习技术中的一个热门领域。该概念最早产生于 20 世纪 90 年代。从广义角度来看，数据挖掘的思想已被称为大数据或数据科学。该概念的定义取决于具体的应用场景和范围。


  ![00081.jpeg](img/rsrcRM.jpg)


  得益于计算机网络技术的进步，数据现在可以有效且廉价地存储。此外，由于电子资源的可用性，数据传输也得到了增强。这些原因以及许多其他因素促成了数据挖掘技术的普及。因此，许多组织能够在数据库中存储海量数据，而无需担心丢失敏感信息。


  在数据库中存储海量数据的能力是非常棒的。然而，了解如何分析和解释手头的数据集也至关重要。如果我们拥有大量无法解释且无法从中得出有意义信息的数据，那么这些数据等同于完全没有数据。这引出了一个如何分析存储在各种数据库中的数据的问题。


  传统的数据分析方法包括手工分析过程。然而，传统方法被证明是耗时且枯燥的，而且结果可能无法反映准确的情况。传统方法忽略了数据集中的关键信息，导致分析过程出现偏差。此外，海量数据集的出现使得传统技术变得过时且不实际。


  为了缓解这些问题，人们设计了自动化方法来帮助分类数据并提取可能的有用信息、趋势和模式。这就是数据挖掘方法和技术大显身手的领域。简单来说，数据挖掘过程旨在解释事件的结果、预测未来的结果并帮助理解复杂数据。数据挖掘科学已被用于描述某些现象，例如船只为何沉没或飞机为何坠毁。在飞机中，数据挖掘通过黑匣子完成，黑匣子与每次飞行的数据集和信息相结合。通过这种方式，很容易判断导致坠毁的情况。与其他预测结果的机器学习方法不同，数据挖掘技术是根据事实而非直觉来预言可能的结果。


  ## 数据分析流程


  为了实现高效的数据挖掘，必须遵循被称为“数据库中的知识发现”（KDD）的七个步骤。下面展示了数据库中知识发现的七个阶段：


  1. **数据清洗**：这是分析数据的的第一步。在此阶段，通过对数据进行清洗以消除噪声和其他可能阻碍适当分析的波动。

  2. **数据集成**：数据清洗后的第二步是数据集成。这一过程涉及将来自不同来源的数据进行链接、融合和整合，以准备待分析的数据。例如，如果信息存储在不同的数据库中，则通过集成将数据汇总到一个数据库中。

  3. **数据选择**：在数据汇总到单个文件后，选择相关的数据集进行分析。这一过程被称为数据选择。

  4. **数据转换**：在完成上述所有步骤后，数据现在已准备转换为适合的格式。进行转换是为了便于分析。例如，某些数据挖掘技术可能要求对所有算术值进行标准化。

  5. **数据挖掘**：这一步涉及应用数据挖掘算法来分析数据，并从分析的数据集中提取有意义的模式和信息。

  6. **提取的模式和知识的评估**：数据挖掘的这一步涉及对从分析数据中得到的模式和信息进行研究和评估。结果的审查可以基于主观或客观的角度。

  7. **数据可视化**：数据挖掘过程的最后一步是对分析数据中提取出的信息进行概念化。这一步是我们尝试理解结果的时候。


  必须知道，上述步骤可能会根据所使用的技术和算法而异。例如，某些数据挖掘算法可能会并发或连续执行这些步骤。


  ## 数据挖掘在相关领域的应用


  在数据分析至关重要的各个行业和领域，可以使用多种数据挖掘算法。以下列出了其中一些应用：


  * 欺诈检测

  * 股票估值预测

  * 分析客户的购买模式


  从广义上说，数据挖掘技术的选择是基于以下指标的：


  * 要分析的数据类型

  * 所需从数据集中提取信息的形式。

  * 提取知识的应用（即如何使用这些信息）。






  ## 数据挖掘与其他研究领域的关系


  数据挖掘是一项跨学科的研究领域，它与机器学习、计算机科学、软计算等不同领域存在交叉和对应关系。数据挖掘与这些领域之间的关系体现了补充人工智能的基本概念。这一观点认为，人工智能中的每个子领域和方向相互互补，并以相互依赖且独立的方式工作。


  ## 数据挖掘与统计学

  数据挖掘与统计学之间存在显著差异。然而，这两个研究领域有许多共同组件和概念。过去，描述性统计侧重于使用指标对数据进行标记，而推断统计学则更注重理论分析，以从数据中得出显著的推断或生成原型。相反，数据挖掘技术更关注研究的结果，而不是算术含义。只要最大程度地满足可行性和精度等给定指标，许多数据挖掘方法并不关注算术测试或内涵。此外，数据挖掘通常集中于对数据集的自动化分析，在大多数情况下，通过可以扩展到海量数据的机器来实现。范围上的接近性是由数学家实现的，他们有时将统计学中的数据挖掘称为“统计学习”。


  ## 主要数据挖掘软件

  为了成功执行数据挖掘过程，有一些可用的软件和算法计算机程序。软件在模型和用途上有所不同。某些软件是通用实现工具，提供各种类型的算法，另一些软件更具针对性。需要注意的是，某些软件是为了商业目的开发的，而另一些则免费访问和配置（开源）。各种软件可以对多种数据类型进行数据挖掘。数据挖掘软件和算法专门开发用于处理不同类型的数据。下面，我总结了经常遇到的无数种数据示例，这些数据可以使用数据挖掘方法进行分析。


  - **关系型数据库**：关系型数据库是机构和公司中最常见的经典类型数据库。在这种形式下，数据以表格的形式进行分类结构化处理。传统方法（如 `SQL`）用于在尝试从数据库中查找更快信息时查询数据库。然而，数据挖掘能够发现数据库内部复杂的复杂的模式。

  - **客户交易数据库**：另一种常用的数据库类型是客户交易数据库。这种类型主要用于零售店。该数据库由客户进行的所有交易组成。研究该数据库对于理解买卖模式至关重要。它允许零售商理解市场变化，从而帮助规划销售和营销策略。

  - **时间数据**：另一种常见的数据形式是时间数据。普通类型考虑数据中的时间维度。在这里，排列出现在许多领域中，例如客户购买的一系列物品、纯素食者人群的链等。时间数据被进一步划分为时间序列。该序列是算术值的系统列表，例如股市中的股票价格。

  - **空间数据**：另一组可以易于分析的数据是空间数据。这种类型的数据由聚合信息组成，如环境数据、森林数据以及关于铁路线路和空气分布通道等子结构的数据。

  - **时空数据**：这是一种兼具空间数据和时间数据特征的数据。例如，数据可以是关于气候条件、人群中野兽的移动等等。

  - **文本数据**：文本类型的数据已成为数据挖掘中一个广泛研究的领域。尽管文本数据大多是无形的，但其应用仍在扩展。文本文档大多是无序的，且缺乏固定的形式。文本数据的示例包括情感分析和作品归识别（预测给定文本的作者）。

  - **网络数据**：这是一种源自网站的数据类型。数据主要是一组文档，例如带有附件链接的网页期刊。这些集合被绑定形成一个图结构。互联网上某些特定的数据挖掘活动示例包括预测网站上可能的下一个页面、根据主题自动对网页分组，以及评估在每个网页上花费的时间。

  - **图数据**：图也是另一种类型的数据库。图出现在社交网络中（例如 Facebook 朋友列表）和化学中（例如生物化学分子和原子的图）。

  - **杂乱数据**：不同或混合类型的数据是许多类数据的集合。这些类别相互关联，并可以排序成特定的排列。

  - **数据流**：数据流被认为是连续且高速的理论上无限的数据流。例如，数据流可以是生态数据、摄像头数据或数字电视数据。这种类型数据的局限性是无法充分存储在计算机中。因此，应该使用合适的数据挖掘方法对数据进行评估。流数据中的日常数据挖掘任务通常是检测变化和趋势。


  ## 数据中的模式

  如所述，数据挖掘的目标是从数据中挖掘出理想的信息模式。从数据中可以提取的主要设计类型如下（注意此列表并非最终产品）：


  ### 聚类

  用于聚类的算法始终适用于数据集被预期分类成相似实例的组（聚类）的情况。这些算法的主要目标是压缩数据，以便于理解和做出推断。类似于 `K-Means` 的聚类操作模式可以用于自动对表现相似的学生进行分组。


  ### 分类模型

  用于分类任务的算法旨在提取模型，这些模型可将对象和新实例分到类别中。例如，如 `Naïve Bayes`、`decision trees` 和 `neural
  networks` 等分类算法可以创建能够预测客户行为趋势或学生通过考试可能的设计。这些模型也可以被提取出来执行对未来的预测。


  ### 模式与关联

  某些方法设计用于研究数据与频繁出现模式之间的关系。例如，可以使用数据挖掘算法分析项目集的频率，以确定特定零售店最畅销的商品。其他模式类型包括时间模式、进展规则、不规则模式和循环子图。


  ### 异常检测

  AD 是一种机器学习方法，旨在检测给定数据集中的故障和变异。






  # 第 9 章 —— 机器学习及其如何融入数据科学


  只要我们使用得当，机器学习绝对可以是数据科学过程中一个至关重要的部分。请记住，在我们执行这一过程中，数据科学的一个部分是进行数据分析。这帮助我们处理在沿途中收集的大量数据，并实际上看到其中包含的洞察和预测。为了实现这一目标，我们需要能够创建模型（这些模型可以筛选所有数据）、发现隐藏的模式并为我们提供洞察。为了定义这些模型并确保它们按照我们想要的方式运行，我们需要配备多种良好的算法，而这正是机器学习大显身手。你会发现，在机器学习以及机器学习中各种算法的帮助下，我们可以创建出处理我们拥有的任何类型数据的模型，无论数据大小，并为我们提供此处所需的答案。


  机器学习是一个过程，我们可以通过这个过程让我们正在处理的系统或机器以人类的方式进行思考。这允许算法以人类能够的方式去发现隐藏的模式，但其执行速度比任何手动操作的人类都要快且高效得多。想一下，对于任何个人、甚至是一组试图处理所有数据的人来说，手动完成这些工作将有多困难。他们可能需要数几年才能处理完所有数据并找到他们需要的洞察。而且考虑到数据生成和收集的速度之快，在我们达到那个点时，那些预测和洞察已经毫无价值了。


  机器学习可以让这个过程变得简单得多。它允许我们有一种思考数据的方式，并发现其中满足我们需求的隐藏模式和洞察。通过正确的机器学习算法，我们可以学习该过程是如何运作的，以及为实现这一目标所需的所有步骤。考虑到这些，是时候密切关注机器学习，以及我们为了满足需求而需要了解的所有部分了。


  ## 什么是机器学习？


  我们首先需要关注机器学习的基础知识。机器学习是人工智能的应用之一，它可以赋予系统自主学习的能力，而不需要程序员来告诉系统该做什么。系统甚至可以更进一步，根据自己的经验来工作改进，而这一切在过程中都不需要对系统进行显式编程。机器学习的理念将专注于在计算机上开发程序，这些程序可以访问你拥有的任何数据，然后利用这些呈现的数据来学习新知识，以及你希望它如何运行。


  在涉及到机器学习的使用时，我们可以查看几种不同的应用。当我们开始更多探索机器学习能做什么时，你可能会注意到多年来，它已经改变并发展成为程序员比以往任何时候都更喜欢工作的东西。当你想要让你的机器或系统独立完成大量工作，而不需要你干预并编写每一个步骤时，那么机器学习就是你的正确选择。


  在技术领域，我们会发现机器学习非常独特，并可以为我们编写的代码增添乐趣。已经有许多不同行业的公司（我们稍后会讨论）在使用机器学习，并已经从中获得了巨大的益处。


  在机器学习机器学习方面，有许多不同的应用，我们利用这种人工智能所能做的一切令人惊叹。在机器学习方面，我们可以遵循并投入时间关注的某些最佳方法包括：


  - **统计学研究**：在 IT 领域，机器学习已经取得了一些进展。你会发现，机器学习可以帮助你处理大量的复杂数据，寻找数据中大型且重要的模式。此类类别下机器学习的某些不同应用将包括垃圾邮件过滤、信用卡和搜索引擎等。

  - **大数据分析**：许多公司花费了时间收集所谓的“大数据”，现在他们必须找到一种方法，在短时间内对这些数据进行筛选并从中学习。。公司可以使用这些数据来更多地了解客户是如何花钱的，甚至可以帮助他们对未来做出重要决策。如果我们让某人手动完成这些工作，将花费太长时间。但通过机器学习，我们可以完成所有工作。医疗领域、竞选活动甚至零售店等已经开始转向机器学习以获得这些益处。

  - **金融世界**：许多金融公司已经能够依靠机器学习。例如，在线股票交易将依靠这种工作，我们会发现机器学习可以帮助欺诈检测、贷款审批等。


  为了帮助我们开始这项工作，并理解如何从机器学习中获得我们想要的价值，我们必须将最佳算法与正确的流程和工具配对。如果你使用错误的算法来筛选这些数据，你将获得大量不准确的信息，结果无法为你提供所需的帮助。始终使用正确的算法将产生巨大的差异。


  我们将看到的酷的一点是，目前有很多机器学习算法供我们选择来构建你的模型。这些算法中的每一个工作方式都不同，但这确保了你可以处理项目中出现的任何类型的问题。然而，尽管如此，你会注意到一些不同的可用用算法包括随机森林、神经网络、聚类、支持向量机等。


  当我们致力于我们生成的某些模型时，我们还会注意到有许多工具和其他流程可供我们使用。我们需要确保选择正确的工具，以确保你正在处理的算法和模型能够以你想要的方式运行。机器学习提供的不同工具将包括：


  - 全面的管理和数据质量。

  - 模型的自动集成评估，帮助查看哪些是表现最好的。

  - 用于帮助构建你想要的模型的图形用户界面（GUI），以及流程图的构建。

  - 易于部署，以便你能够快速获得可靠且可重复的结果。

  - 数据的交互式探索，甚至一些帮助我们更轻松查看信息的可视化工具。

  - 端到端的集成平台，帮助实现从数据到你希望遵循的决策过程的自动化。

  - 用于比较不同机器学习模型的工具，帮助我们快速高效地识别出最佳模型。






  # 第 10 章 — 机器学习与商业


  商业领域的机器学习也有助于提高业务的可扩展性，并提升了全球范围内不同公司的运营能力。人工智能工具和机器学习算法旨在对大数据进行操作，并在无需人工干预的情况下进行学习。组织和企业可以从理解“在系统中实施机器学习算法的必要性”中获益。


  ## 机器学习对商业世界的意义


  机器学习允许企业通过有效分析大数据、用户趋势和市场场景来实现增长和繁荣。由于算法能够从原始数据中提取有意义的见解，以解决复杂且数据丰富的业务问题，算法具有从数据中进行迭代学习的能力，计算机可以在没有显式编程的情况下发现不同类别的隐藏见解。


  机器学习模型和算法在商业分析社区已变得非常流行，以考虑数据量不断增长等因素。随着数据水平的提高，公司现在利用机器学习和人工智能模型来管理运营和日常任务，而无需定期更新系统；由于机器学习算法设计为通过经验进行学习，大数据可以被有效处理。金融、经济、教育、交通、医疗和医学行业现在已使用最新的机器学习模型更新了系统，以实现流程自动化获得准确的结果。


  ## 机器学习的影响


  机器学习彻底改变了我们日常生活中使用的系统的操作和性能。从自动化到准确预测，人工智能和机器学习模型可以在无需人工干预的情况下执行特定任务。由于机器被编程为独立运行，各行业的系统操作和功能现在已经发生了完全改变。


  我们注意到，对人力的需求每天都在减少，这是一个需要考虑的大问题。虽然机器学习在日常生活中具有惊人的益处，但它也影响了数千人的工作。通过实施编程为独立工作和学习的自动化机器，对人力资源的需求在很大程度上被消除了。另一方面，在新的系统上建立机器学习和人工智能模型的成本较高，但从长远来看，它确实为行业带来了更多益处。


  每项技术都有其优缺点，机器学习和人工智能技术也不例外。由于系统中不断增加的数据，对机器学习工程师的需求非常迫切。人工智能无处不在，我们可能在不知不觉的情况下在使用它。机器学习在计算机和软件中进行建模，是因为设备可以通过认知进行工作，其工作方式与人类大脑相同。今天，公司专注于机器学习，以改进业务决策并提高生产力。随着技术的呈指数级增长，我们需要更好的工具来分析和理解收到的数据，并为未来几年不断增加的数据或大数据做好系统准备。


  ## 考虑与启示


  机器行使的智能水平被称为道德成分，它是接收到的数据的直接结果。根据输入数据，机器可以训练自己朝着某个方向工作，甚至违背某些人的利益。科学家和研究人员仍然无法从机器学习算法中消除偏见，这些算法可能会产生不适合政治正确社会的结果。此外，研究人员、专家和科学家认为人工智能对社会是有害的，因为它会被开发反映人类大脑及其所有偏见。


  风险评估的准确性是机器学习算法的另一个重要方面。风险评估用于衡量和评估特定场景中可能涉及的风险，允许人工智能代表人类做出重要决策可以增加人与机器之间的信任。倡导者在应用人工智能时建立透明度，创建一个不受具有操纵数据的单一权威管理的共享数据库。算法透明度也将有助于用户与机器之间建立高水平的信任。


  ## 与机器学习相关的风险


  虽然机器学习模型非常准确并能做出准确预测，但与智能机器相关的风险可能会给人类带来负面结果。机器可以超越最高智能水平，并在心理上操纵人类并对人类产生破坏性。通常，人们无法将人工智能的目标与人类价值观对齐，允许机器做出人类无法实现的决策。


  对大量无关的大数据执行多次操作的机器所发现的关联和模式最好是无意义的，最坏是错误的。从长远来看，机器甚至会在错误的输入上进行自我训练，教会它们做出做出不符合人类利益的决策。机器学习的风险是真实的，如果管理不当，可能会非常危险。


  数据、设计和输出是与风险直接相关的机器学习三个主要类别。偏见、数据、缺乏模型可变性以及输出解释是机器学习运行过程中可能产生风险。在学习和做出预测时，机器学习模型可能会产生偏见并做出不准确的预测。由于它主要取决于数据输入，数据不足或数据错误也会给建模过程带来巨大风险。此外，如果模型没有经过适当的训练，缺乏模型可变性和输出解释也可能对人类构造成巨大风险。


  ## 预防机器学习中的偏见


  自我纠正是人工智能行业关注的重点，研究人员正在寻找新方法来增强基于规则的人工系统的伦理并减少偏见。考虑到人类偏见，人工智能在几个重要的伦理方面需要努力。以下是设计机器学习和人工智能模型时避免偏见的一些最佳方法：


  -   选择正确的学习模型：并非所有人工智能模型都适用于每个任务。由于每个问题都需要特定的解决方案并需要不同的数据源，因此没有经过证明的避免偏见的方法。为了解决这个问题，机器学习模型的设计必须具有与部署系统的行业最匹配的参数。此外，提前通知开发团队可以帮助公司和行业使用最合适的机器学习模型。


  监督学习和无监督机器学习模型有各自的优缺点。监督模型对数据选择中的偏见提供了更强的控制，而执行降维的无监督模型有能力从其数据集中消除偏见。数据科学家必须针对特定情况识别并展示最佳模型，以便实施有效的策略以获得长期利益。






  ### 选择训练数据集


  人工智能和机器学习模型从输入的数据中进行学习。因此，为了获得准确且安全的预测，数据科学家需要为 AI 模型提供不同类型的数据，并排除任何漏洞。进行训练算法处理是为了避免数据选择中的偏差，为此，我们需要确保训练数据的多样性。如果某组数据量不足，可以使用加权方法来提高训练的有效性，但在此进行此操作时必须极度谨慎。


  ### 通过真实数据监控性能


  歧视性模型通常在控制环境中运行，没有任何一家公司会有意识地创建带有偏见的人工智能模型。遗憾的是，测试组被用于检查已经投入生产并可能引发未来问题的算法。使用统计方法而非真实数据，是通过真实数据监控性能的更好方法，因为在寻求公平时，我们需要检查数据在结果平等和机会均等方面的表现。


  虽然很难证明机会均等，但在现实世界中测试和监控机器学习模型确实可以帮助研究人员开发出高精的模型和算法。对于自学习系统，使用带偏的数据喂给模型有时会导致意想不到且危险的结果。






  ## 结论


  随着时间的推移，机器学习正变得越来越重要。这是一个进入计算机科学和数据科学领域，并学习如何使用这些工具来完成惊人任务的绝佳时代。尽管机器学习看起来像是一个全新的事物，但机器与学习的概念可以追溯到历史的黎明。人类一直是工具的制造者和使用者，而如今的机器学习系统和人工智能仅仅是人类通过工具扩展头脑的漫长历史中的最新一次“迭代”。这是一个重要的概念。


  遗憾的是，如今对于人工智能存在着许多恐慌情绪。尽管经验证明事实并非如此，人们似乎很容易受到同样老调重弹幻想的影响。卢德分子是错误的，机器创造的工作比它们消除的要多
  10 到 100 倍。机器解放了人们去从事更有生产力的活动，而当生产力提高时，工作、活动和机会也会随之增加。今天也是如此，一向如此。每一代新人的出现都会引发旧的卢德思想，结果只是眼睁睁看着它们再次死去。


  这种情况发生在 20 世纪 80 年代初，当时个人电脑电子表格和会计程序的发明导致人们陷入了恐惧，想象会计师和办公人员将不再被需要。接着他们又对文字处理器做了同样的事情，想象秘书工作将被消除。这两者都没有发生。现在我们又回到了这个时刻。在沉寂了十年之后，人工智能终于活了了。机器人技术正在增强制造业以更低的成本和劳动力生产更多产出的能力。尽管在我写下这些文字时，经济正处于充分就业状态，但政治家和媒体人士再次发出了卢德分子式的指责。这一次，人工智能和机器学习要抢夺你的工作了。


  助这些恐惧的短视者完全偏离了要点，他们没有看到世界目前正在经历的变革将像往常做的那样，提高生产力并释放人们去做其他事情。希望他们不会停止这台令人兴奋的引擎。我怀疑他们无法做到这一点。政府和公司已经爱上了机器学习。原因很简单：机器学习行之有效。在经历了十年被过度透支的承诺后，计算机现在处于可以学习的水平，而且一旦经过训练，它们就能自主工作。机器学习让公司运行得更高效，并帮助政府识别欺诈、防止网络攻击并完成数百万件其他事情。由于智能是通用的，机器学习和人工智能的应用也是通用的。


  人工智能对于持有卢德分子观点的人来说有一种特殊的恐惧。说机器将摧毁你的工作是一回事，但人们对机器学习系统也有不切实际的恐惧。他们似乎认为 AI 和机器人将接管世界，仿佛他们生活在某种科幻幻想中。毫无疑问，随着时间的推移，机器学习将继续改进并能够承担更多任务，但这些任务的用途完全掌握在人类手中。


  这些工具可能被用于不法目的。在中华人民共和国，人脸识别等机器学习工具被用来控制和骚扰人们。在美国和欧洲被用于确定个人贷款信誉的工具，在中国被用来给人们评分“社会信用”。根据新闻报道，社会信用可以被用于限制人们旅行或出国。


  ## 给有志执业者的建议


  如果你是机器学习的新手，我希望你离开时已经剥离了其背后的一些神秘感。当你初接触这些概念，或只是在媒体中听到它们时，它们并没有看起来看起来那么复杂。如果你对机器学习真的感兴趣，并希望接受相关教育且可能将其作为职业，最好的起点是学习如何编程。为了在这个竞争激烈的领域获得工作，你可能需要一些学术学位，而这是大学里少数几个你可以去学校直接学习所需技能的领域之一。但你可以通过学习
  `python` 开始，这是一种可以在任何系统运行的简单编程语言。你可以在网上搜索用 `python` 构建的机器学习算法，它们可以使用小型数据集来开始提供实践。如果你决定进一步深造，我的建议是主修统计学或计算机科学，或者理想情况下双修计算机科学和数学。单学计算机科学可能是不够的，因为要从事数据科学工作，你需要对概率和统计学有深入的掌握。


  我还会建议上几门商业课程。你将了解到物流等领域，数据科学通常被应用于为大公司生成解决方案。这种方法非常有效，我可以向你保证，只要你接受了正确的教育，你一定能找到这份工作。


  处理机器学习与传统的计算机编程是完全不同的活动。当然，传统的计算机编程仍然存在并充满活力，所以让我们先不要把它把它杀掉。


