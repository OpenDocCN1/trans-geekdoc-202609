  ## 简介

  你可能对机器学习是什么有了很清楚的了解，但也许你听到的解释只是有点模糊。你知道它是人工智能的核心组件，但即使是这个定义也有些含不清。要理解这个概念可能非常困难。理解机器学习的基础深实植根于我们自身的生物学，这会有帮助。长期以来，我们一直把人脑视为唯一能够从复杂数据中学习并处理信息的产物。现在，我们被告诉，无生命物体也可以通过这种创新学习并改变其行为。这样想确实令人不可思议。然而，有一个充分的理由说明这不仅是可能的，而且已经成为我们今天生活和经营业务的主要部分。


  ### 它是什么？

  用最简单的话来说，机器学习是计算机编程的艺术，它允许计算机学习并自动调整其功能，以完善它们完成任务的能力。具有机器学习能力的计算机实际上可以根据自己的经验来提高性能，而不需要显式程序告诉它们具体要做什么。这种学习过程实际上始于程序观察收集的数据并将其与之前的数据进行比较，以找到模式和结果，并据此进行调整。这一切都是通过复杂的神经网络和算法系统共同工作完成的，产生所需的结果。本质上，这意味着计算机开始慢慢学习像人类一样思考，从经验中学习并通过改变来改进它们获得的结果。它现在是简化必须完成的工作的最有效手段之一。通过减少为机器可以执行的每种可能的功能编写程序的需求，它允许机器学会如何以更快、更高效的方式完成这些工作。


  如果你不完全确定它是如何工作的，让我们来看一个例子。假设你需要创建一个程序，要求计算机过滤掉某些类型的数据。在传统的编程方法中，你必须：

  1) 让人类检查你想要消除的数据，然后列出不需要的数据可能出现的方式清单，并识别出可能出现的特定模式。

  2) 然后，人类必须编写一个特定的算法来教计算机具体要寻找什么。

  3) 接着，人类必须开发一个软件程序，能够识别这些模式和其他细节并对其进行相应的标记。

  4) 测试程序并发现任何可能在寻找不需要的数据时产生问题的异常，然后返回第一步反复重复该过程，直到程序真正完善。


  即使有了这些非常基本的步骤列表，你也只能让计算机完成一项任务，并且对于你可能需要计算机执行的任何其他任务，都必须重复该过程。为了完成所有这些任务，你必须遵守大量的规则才能使其正常运行。这使得你的编程工作容易出现错误并干扰整个过程。然而，如果你选择使用机器学习来完成相同的事情，该过程将完成得得多，而且产生错误的风险更小。


  此外，一旦使用传统方法更新了程序，程序设计者永远无法觉得工作已经完成。他（或她）必须经常回来并定期对其进行更新，以确保它与当时使用的最新技术兼容。这必须反复进行，直到被另一个程序完全取代。机器学习是一种技术，一旦上传，它就会运行。它会自动告知何时需要进行更新，甚至可以接入系统并获取自己的更新，释放人类去处理其他事情。机器学习使得以最少的人类干预解决最复杂的问题成为可能。取决于你使用的机器学习类型，一旦它在系统中上线并激活，只要保持这种状态，机器就可以继续进行自己的调整并识别自己的失败和成功。在今天的计算机编程中使用机器学习有很多优势，但无疑未来将会有更多新方法来使用它。现在，它主要用于：


  * 解决涉及长规则列表的问题

  * 解决没有明显解决方案的非常复杂的问题

  * 适应非稳定环境中的新数据


  随着越来越多的人意识到机器学习是多么伟大，它可能会被用于成百上千种其他用途。随着时间的推移，它被应用到存在的每一个行业是可行的，并在某点甚至可能被用于创建新的行业。





  # 第一章 — 机器学习简介


  机器学习是计算机所做的事情，而这对于人类来说是自然而然的从从中学习。机器学习算法利用计算程序直接从材料中“发现”信息，而不依赖于预先定义的方程模型。随着外部学习样本数量的增加，其功能会自适应地改进。教育也是一种机器学习。机器学习是人工智能（AI）的一个分支，它使系统在不需要显式自动编程的情况下，具备在专业知识方面进行学习和改进的能力。学习方法始于信息或观察（例如即时经验案例或教育），以便在未来做出更好的选择，并在数据中寻找模式。其意图是允许计算机在没有人类干预的情况下，适应行为并理解这些行为。


  许多人利用机器学习来改善高级生活。它包括专业领域的程序，也包括工业领域的程序。然而，什么是机器学习？它是人工智能的一个子集，专注于使用统计方法从数据库中提取信息以构建计算机系统。机器学习被应用于商业以及医学研究、图像处理、预测、分类、学习机构、回归等学科领域。机器学习是当今世界上最具影响力的技术之一。我们远未能看到它的全部潜力。毫无疑问，它在未来将继续成为头条新闻焦点。


  本指南旨在作为入门介绍，难度不会过大，涵盖了所有基本概念。我们大多数人并没有意识到，我们每刻都在与机器学习交互。当我们在 Google 上搜索某些东西、听一首歌曲甚至看一张照片时，机器学习都是其背后的引擎的一部分，从每次交互中不断学习和进步。它也是许多改变世界的改进背后的推动力，如自动驾驶汽车、生产新药和发现癌症。


  ## 机器学习的类型


  ### 监督机器学习

  “监督机器学习”被广泛应用于预测性大数据分析，因为它们能够评估并应用从迭代和交互中学到的教训到新的数据集中。这些学习算法能够根据提供的指令对所有当前事件进行标记，以高效地预报和预测未来事件。例如，机器可以被程序化为数据点标记为“R”（运行）、“N”（负面）或“P”（正向）。然后，机器学习算法按照程序设定对输入数据进行标记，并获得正确的输出数据。算法将其自身的生成结果与“预期或正确”的输出进行比较，识别潜在的修改并解决错误，使模型更准确、更智能。


  通过采用“回归”、“预测”、“分类”和“特征增强”等方法来正确训练学习算法，任何新的输入数据都可以作为“目标”数据集输入机器中，以按要求组装学习程序。这启动了分析，并推动学习算法创建“推断特征”，该特征可以根据未来事件的输出值生成预报和预测。例如，金融机构和银行严重依赖机器学习算法来跟踪信用卡欺诈，并预测潜在客户无法按时偿还贷款的概率。


  ### 无监督机器学习

  公司经常发现自己处于一种境地：无法获得生成标记和分类训练数据集所需的数据源。在这些情况下，使用无监督机器学习是理想的。“无监督学习算法”通常用于描述机器如何产生“推断特征”，以阐明数据栈中未标记和未分类组件的隐藏模式。这些算法可以探索数据，从而在海量数据中定义出结构。尽管无监督机器学习算法在探索输入数据和从中提炼见解方面与监督学习算法一样有效，但无监督算法无法识别正确的输出。这些算法可以用于定义离群值；产生定制的产品建议；以及使用“自组织映射”、“奇异值分解”和“k-means
  聚类”等技术对主题进行分类。例如，客户识别可以将客户划分为具有共同属性的组，并针对类似的营销策略和活动进行目标定位。


  ### 半监督机器学习

  “半监督机器学习算法”非常灵活，能够从“已标记”以及“未标记”或原始数据中学习。通常，训练数据集由大部分未标记数据组成，仅包含极小部分已标记数据。将“预测”、“回归”和“分类”等分析方法与半控学习相结合，允许计算机显著提高其在学习和训练中的准确性。当原始数据的处理和标记对公司而言资源消耗极高且性价比不高时，通常会使用这些算法。公司正在使用半监督学习系统来避免额外的人员和设备费用。例如，“脸识别”技术的应用需要分散在多个来源的海量数据。


  ### 强化学习

  此类算法执行活动并仔细记录每个动作的结果，要么作为失败结果的错误，要么作为优秀结果的奖励。区分强化学习算法的两个主要特征是“试错”分析技术和“延迟奖励”反馈循环。计算机使用各种计算持续分析输入数据并对每个正确或预期的输出发送强化信号，以最终优化结果。该算法创建了一个易的动作和奖励反馈回路，用于评估、记录和学习哪些活动是有效的，因为它在更短的时间跨内产生了正确或预期的输出。此类算法的使用使得系统能够确定最佳行为，并在特定语境下使其效率最大化。因此，在游戏、机器人和导航系统学科中，强化机器学习被大量利用。


  ## 机器学习的重要性

  对机器学习看似不可抑制的兴趣源于那些使得“数据挖掘”和“贝叶斯分析”比以往任何时候更常见的变量。导致这种受欢迎的根本因素是数据数量和多样性的增加、更廉价更有效的计算处理，以及廉价的数据存储。我们无法想象机器学习对我们日常生活的意义，数据驱动因素正影响着生活的方方面面。人工智能和机器学习技术是“第四次工业革命”的核心理念，旨在扩展人类能力并提高效率。这些因素意味着机器学习可以在更大规模上自动产生模型。公司通过构建机器学习模型可以轻松识别增长机会或规避未知风险。机器学习提供了解锁业务数据的魔力，通向可执行的措施和决策。


  机器学习在过去几年中证明了许多被认为只有人类才能完成的任务可以自动化，例如图像识别、文本处理和游戏。2014 年，人工智能和机器学习专业人士认为围棋游戏至少需要十年才能击败世界顶级棋手，但
  Google 的 DeepMind 证明他们是错误的，它展示了机器在围棋这种复杂的游戏中具有学习能力。在游戏领域，我们看到了更多创新，如来自 OpenAI 团队的
  Dota Bot。机器学习对我们的生活产生巨大的经济和社会影响。大量工作活动和整个行业可能被自动化，劳动力市场将被彻底改变。


  ## 重复学习自动化与信息发现

  与仅自动手动任务的机器人自动化不同，机器学习持续、可靠地执行高数量、海量和面向计算机的任务。人工智能机器学习算法使机器或系统能够学习、注意并减少之前的错误。机器学习算法作为分类器或预测工具，开发独特的能力。例如，一种机器学习算法创建了一个能够自学下棋甚至能根据消费者活动和行为数据创建产品建议的模型。该模型非常有效，因为它可以轻松适应任何新数据集。






  ## 第二章 — 机器学习的优势


  由于任务量巨大且规模大，在某些情况下，工程师或开发者无论如何努力都无法成功；在这些情况下，机器相对于人类的优势是显而易见的。


  ### 识别模式

  当工程师向带有人工智能的机器提供训练数据集时，它将学习如何识别数据中的模式，并对工程师提供的任何其他类似输入产生结果。这种效率远超普通的分析师。由于机器学习与数据科学（即对海量数据处理并挖掘底层变量之间关系的过程）之间存在紧密的联系，通过机器学习，可以从海量数据中推导出重要的见解。


  ### 提高效率

  人类在设计某些机器时，可能并未充分理解其能力，因为他们可能不知道计算机或机器运行的各种情况。通过机器学习和人工智能，机器将学会适应环境的变化并提高其自身的效率，无论其周围环境如何变化。


  ### 完成特定任务

  程序员通常会开发一种机器来完成某些任务，其中大多数任务涉及复杂且艰巨的程序，程序员在其中可能会出现疏漏错误。他或她可能会忘记本该包含在程序中的某些步骤或细节。一个能够自主学习的人工智能机器就不会面临这些挑战，因为它会自己学习这些任务和流程。


  ### 帮助机器适应变化的环境

  随着技术的不断演进以及用于交流这些技术进步的新编程语言的开发，几乎不可能将所有现有程序和系统转换为这些新语法。从编码阶段开始重新设计每个程序以适应技术进步是事得其反的。在这些时候，使用机器学习是非常高效的，这样它们就可以独立地升级并适应不断变化的技术气候。


  ### 帮助机器处理大型数据集

  机器学习带来了在不确定条件下同时处理多个维度和多种类型数据的能力。具有自主学习能力的人工智能机器可以在动态环境中运行，强调了资源的有效利用。机器学习已帮助开发出各种工具，在小型和较大的流程环境中提供持续的质量改进。


  ## 机器学习的劣势

  获取用于训练机器的数据是困难的。工程师必须知道想用哪种算法来训练它，只有这样他才能识别出需要使用的数据集。如果工程师没有做出正确的决策，可能会对获得的结果产生重大影响。


  * 很难准确解释结果以确定机器学习算法的有效性。

  * 工程师在选择一种算法来训练机器之前，必须对不同的算法进行实验。

  * 超越机器学习的技术正在研究中；因此，机器不断学习和转型以适应新技术是非常重要的。






  ## 机器学习涉及的学科


  机器学习是一个使用多个学科概念的过程。这些学科中的每一个都能帮助程序员开发出用于机器学习的新方法，而这些概念共同构成了该主题的学科体系。


  ### 统计学

  统计学中的一个常见问题是假设检验以及识别数据遵循的概率分布。这允许统计学家预测未知数据集的参数。假设检验是机器学习中使用的统计学概念之一。另一个用于机器学习的统计学概念是利用样本值来预测函数值。此类问题的解决方案都是机器学习的实例，因为所涉及的问题使用了历史（过去）数据来预测未来事件。统计学是机器学习中至关重要的部分。


  ### 大脑建模

  神经网络与机器学习密切相关。科学家们建议，可以使用带有加权输入的非线性元素来创建神经网络。目前正在进行广泛的研究以评估这些元素的作用。


  ### 自适应控制理论

  自适应控制理论是该学科的一部分，涉及处理帮助系统适应此类变化并继续保持最佳性能的方法。其思想是，系统应该预判变化并据此进行修改。


  ### 心理学建模

  多年，心理学家一直试图理解人类的学习。`EPAM` 网络是一种常用于理解人类学习的方法。当为机器提供一个函数时，该网络被用于从数据库中存储和检索单词。近期，心理学研究受到了人工智能的影响。心理学的另一个方面，即强化学习，在近期也得到了广泛研究，这一概念也被用于机器学习。


  ### 人工智能

  如前所述，机器学习的很大一部分与人工智能学科有关。人工智能领域的研究侧重于利用类比来实现学习目的，以及过去的经验如何帮助预判和适应未来事件。近年来，研究重点转向了为使用归纳逻辑编程和决策树方法的系统设计规则。


  ### 演化模型

  演化论中的一个常见理论是，动物倾向于学习如何更好地适应周围环境以增强其性能。例如，早期人类开始使用弓箭来保护自己免受比他们更快、更强壮的捕食者的侵害。对于机器而言，学习和进化的概念可以是同义的。因此，用于解释进化的模型也可以用于设计机器学习技术。利用演化模型开发的的最著名的技术是`遗传算法`。


  ### 编程语言

  `R` 是一种估计拥有近 200 万用户的编程语言。自 1990 年诞生以来，这门语言迅速发展并变得非常流行。人们普遍认为 `R` 不仅是一种用于统计分析的编程语言，还可以用于多种功能。该工具不仅限于统计领域。它有许多特性使其成为一门强大的语言。编程语言
  `R` 可用于许多用途，特别是数据科学家，用它通过数据来分析和预测信息。开发 `R` 的背后的想法是让统计分析变得更简单。随着时间的推移，这门语言开始被应用于不同的领域。有许多人精通
  `R` 编码，尽管他们并不是统计学家。这种情况的出现是因为许多帮助执行数据处理、图形可视化和其他分析等许多的包正在被开发中。`R` 现在被应用于金融、遗传学、语言处理、生物学和市场研究等领域。


  #### Python

  `Python` 是一门拥有多种范式的语言。你可能会把 `Python` 想象成编码世界的“瑞士军刀”，因为这门语言支持结构化编程、面向对象编程、函数式编程和其他类型的编程。`Python`
  是世界上第二好的语言，因为它可以用于编写各行业的程序，并用于数据挖掘和网站建设。它的创建者 `Guido Van Possum` 决定将该语言命名为 `Python`，以自
  `Monty Python`。如果你使用一些内置包，你会发现代码或文档中存在 `Monty Python` 的一些草图。正是由于这些以及许多其他原因，`Python`
  是一门大多数程序员喜欢的语言，尽管工程师或那些具有科学背景的现任数据科学家可能会发现很难与之工作。`Python` 的简单性和可读性使其变得非常易理解。互联网上提供的众多库和包证明了不同领域的数据科学家已经编写了量身定制其需求的程序，并可供下载。由于
  `Python` 可以扩展以最适合不同程序的方式进行工作，数据科学家已开始使用它来分析数据。学习如何用 `Python` 编码是最好的，因为它将帮助你分析和解释数据，并识别出对业务最有效的解决方案。






  # 第 3 章 — 机器学习算法


  ## 回归 (Regression)

  在学习过程中，你提供已知的确定性示例。你说明对于给定的特征值 `x1`，输出信号为 `y1`；对于 `x2` 为 `y2`，以此此类推。根据这些信息，你允许计算机确定
  `x` 和 `y` 之间的经验联系。


  当使用足够的数据点以此方式对系统进行训练时，你可以要求设备根据给定的 `X` 预测 `Y`。假设你知道该 `X` 对应的 `Y` 真实值，你就有能力推断机器的预测是否准确。当你对系统能够以理想的精度水平进行预测（例如
  80% 到 90%）满意时，利用测试信息测试机器是否发现了规律；此时你可以停止对机器的额外训练。


  你可以使用该系统执行预测数据请求，要求机器为某个未知 `Y` 值的给定 `X` 预测 `Y`。这就是我们说过的这种做法。


  ## 分类 (Classification)

  你可以利用机器学习方法解决分类问题。在分类问题中，你将具有特定特征的对象分为一组。例如，在 100 名学生的状态中，你可能根据他们的身高将他们分为三类：矮、中等和高。


  在评估每个学生的身高后，你可以将他们归为一组。当一个新学生进来时，你可以通过测量他的身高将其归入相应的。你将遵循回归指令的原理来训练系统。在机器完成分组形成后，它将能够正确分类任何未知的新学生。


  在将开发的版本投入应用之前，你会使用评估数据来确认设备已经发现了你的分类方法。


  AI 开始其监督学习是一个历程。这种技术已应用于许多场景。你在机器上进行精确的手写识别时就使用过这个版本。开发了许多用于学习的算法，你将要学习它们。


  ## 使用逻辑回归生成预测 (Generating Predictions Using Logistic Regression)

  你的训练数据应用于估计逻辑回归算法的系数（`beta` 值 `b`）。这是通过极大似然估计完成的。极大似然估计是多种机器学习算法使用的常用学习算法，但它对你的数据分布做了假设。


  最优方程将得出一个公式，该公式会对默认类别估计出一个非常接近 1 的值（例如男性），对另一类估计出一个非常接近 0 的值（例如女性）。逻辑回归的最大原理是扫描方法搜索系数值（`beta`
  值），以减少数据中那些样本模型预测概率的误差（即如果数据属于主要类，则为 1 的似然）。


  我们不会深入分析最高概率。只需说明使用了一种最小化算法来优化你训练数据系数的最优值。这通常是使用有效的数值优化方法（类似于拟牛顿法）完成的。如果你在学习逻辑回归，可以自己从零开始实现要更简单的梯度下降算法。


  ## 使用逻辑回归进行预测 (Making Predictions With Logistic Regression)

  使用逻辑回归模型进行预测只需将数字代入并将结果估计到逻辑回归方程中，这非常直接。


  通过一个具体的例子，让我们这变得具体化。假设我们有一个模型，可以通过身高（纯虚构）判断一个人是男性还是女性。（*注：原文此处存在重复句子，已根据要求去重*）


  使用逻辑回归模型进行预测只需将数字代入并将结果估计到逻辑回归方程中。


