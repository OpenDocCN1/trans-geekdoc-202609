  ### 朴素贝叶斯的局限性


  * 对于在数据集中未出现过的某些类别的分类变量，模型会分配零概率，导致其无法生成预测。这被称为“零频率（Zero Frequency）”。可以使用平滑技术来解决这个问题，并可以采用拉普拉斯估计（Laplace
  estimation）来解决。

  * 朴素贝叶斯被认为是一种糟糕的估计器。有时它输出的结果并不被重视。

  * 朴素贝叶斯还假设预测变量之间是独立的。在现实生活中，我们几乎不可能获得独立的预测变量。


  ## 朴素贝叶斯算法的应用


  朴素贝叶斯分类应用于以下领域：


  #### 实时预测

  朴素贝叶斯是一种学习速度更快的分类器。这使其适用于实时预测。


  #### 多分类预测

  * 众，朴素贝叶斯分类器在多分类预测表现良好。我们可以将其用于多个类别的目标变量。


  #### 文本分类 / 情感分析 / 垃圾邮件过滤

  当用于文本分类时，朴素贝叶斯算法与其他类型的模型相比具有更高的准确率。它还用于垃圾邮件过滤以识别垃圾邮件，以及情感分析（例如在社交媒体上确定客户的正面或负面评论）。


  #### 推荐系统

  朴素贝叶斯分类器结合协同过滤可以构建一个推荐系统，该系统利用数据挖掘和机器学习技术来过滤任何未见信息。它还可以预测用户会喜欢还是拒绝某个资源。






  # 第 4 章 — 神经网络学习模型


  机器学习中一种广泛使用的方法是人工神经网络，其灵感源于人类的大脑系统。神经网络的目标是模拟人类大脑的学习方式。神经网络系统由输入层、输出层以及一个隐藏层组成，隐藏层将输入层转换为有用信息并传递到输出层。通常，人工神经网络中会实现多个隐藏层。下图展示了一个由
  2 个隐藏层组成的神经网络系统示例：![](img/rsrcRH.jpg)


  ## 人工神经网络的示例


  在进一步探讨并解释神经网络如何工作之前，让我们先定义什么是神经元。神经元简单来说就是一个表示为加权输入之和的数学方程。假设 `X={x1 , x2 ,….xM
  }` 是一个包含 `N` 个输入的向量，则神经元是所有输入的线性组合，定义如下：`F(X={x1 , x2 ,….xM })=w1 x1 +w2 x2 +….+wM
  xM`；其中 `w1 , w2,…wM` 是分配给每个输入的权重。函数 `F` 也可以表示为：`F(X)=WX`，其中 `W` 是权重矩阵，`X` 是数据向量。第二种公式形式在编写神经网络模型时非常方便。权重是在训练过程中确。事实上，训练人工神经网络意味着找到能够提供最准确输出的最优权重
  `W`。对于每个神经元，对其加权输入之和 `X` 应用一个激活函数。激活函数的作用是根据模型的预测决定神经元是否应该激活。这一过程应用于神经网络的每一层。


  ## 人工神经网络的组件


  ### 神经元

  人工神经网络保留了大脑的生物学特性，即通过输入接收数据、通过激活进行处理并使用输出函数传递结果。然而，在计算机中，信息通常是外部数据（例如图像和文件），然后通过组织和识别数据中的模式进行处理并提供输出。因此，神经元在通过隐藏层提供输入与输出之间的转换方面起着重要作用。


  ### 连接与权重

  人工神经网络具有允许信息从一个神经元传输到另一个神经元的连接。这促进了数据从输入到隐藏层再到输出的移动。此外，每个连接都根据神经元的重要性分配了其自身的权重。在大多数情况下，一个神经元拥有多个输入和输出连接，权重相对变化。这种关系模式通常被称为其架构，而权重则以给定神经网络涉及的算法、训练和学习过程的形式确定。


  ### 传播函数

  这是计算输入神经元、输出神经元以及前驱神经元的函数。传播函数主要促进与当前神经网络加权和相关的连接。在某些情况下，神经元可能缺乏处理特定数据的能力，这通常由这些函数决定。传播函数在数据从输入传输到输出时计算数据的关系、有效性和某些复杂性，且对网络的影响有限。


  ## 人工神经网络有哪些类型？


  ![00007.jpeg](img/rsrcRJ.jpg)


  存在具有不同属性和复杂性的多种人工神经网络类别。开发的第一种最简单的神经网络是感知机。感知机计算输入之和，应用激活函数，并将结果提供给输出层。另一种旧而简单的方法是前馈神经网络。这种类型的人工神经网络只有一个层。它是一个与后续层全连接的类别，其中每个节点都与其他所有节点连接。它通过隐藏层从输入到输出单向地传播信息。这一过程被称为前向传播波，通常使用所谓的激活函数。该激活函数处理每层中每个节点的数据。该神经网络根据隐藏层的激活函数计算输入并返回权重之和。前馈神经网络类别通常使用反向传播法进行训练过程，并使用逻辑函数作为激活函数。


  其他几种神经网络都是这种类型网络的派生。例如，径向基函数神经网络。这是一种依赖于径向基函数而非逻辑函数的前馈神经网络。这种类型的神经网络有两个层，其中内部层、特征和径向基函数结合在一起。径向函数计算每个点到相对中心的距离。这种神经网络适用于连续值，用于评估与目标值的距离。相比之下，逻辑函数用于映射任意的二值值（即
  0 或 1；是或否）。


  深度前馈神经网络是多层前馈神经网络。它们成为机器学习中最常用的神经网络类型，因为它们能产生更好的结果。一种称为深度学习的新型学习类型从这种神经网络中脱颖而出。


  循环神经网络是另一类使用类型节点的网络。然而，隐藏层的输出会被保存并传回前一层处理。基本上，由输入层组成的第一层被处理为加权特征之和的乘积。它在计算运行时实际上使用了内存功能。换句话说，与前馈神经网络不同，信息是在两个方向上处理的。


  多层感知机或多层神经网络具有至少三层或更多层的神经网络。这类网络是全连接的，每个节点都与后续层中的所有其他节点连接。


  卷积神经网络通常用于图像分类或识别。这种类型人工神经网络使用的处理方法旨在处理像素数据。卷积神经网络是基于卷积的多层网络，卷积应用滤波器进行神经元激活。当相同的滤波器应用于神经元时，会导致相同特征的激活，并产生所谓的特征图。特征图反映了输入数据特征的强度和重要性。


  模块化神经网络由多个连接的神经网络组成。这些网络依赖于“分治法”的概念。它们对于非常复杂的问题非常有用，因为它们允许结合不同类型的神经网络。因此，它们允许结合不同神经网络的优点来解决特定问题的复杂问题。


  ## 如何训练人工神经网络？


  正如开头所示，神经网络计算输入的加权之和并在每层应用激活函数。然后将最终结果提供给输出层。这一过程通常称为正向传播。为了训练这些人工神经网络，需要优化权重以获得产生最准确输出的最优权重。训练人工神经网络的过程如下：


  * 初始化权重

  * 应用正向传播过程

  * 评估神经网络性能

  * 应用反向传播过程

  * 更新权重






  - 重复步骤 2 中的步骤，直到达到最大迭代次数，或者神经网络的性能不再提升提升。


  ### 损失函数

  正如我们在上面介绍的人工神经网络训练步骤所示，我们需要一个能够描述神经网络准确性的性能衡量标准。这个函数被称为损失函数或代价函数。


  `J=(1/N) *∑(ypredicted -ytarget )2`


  其中：

  - `N`: 输出的数量

  - `yppredicted`: 输出值

  - `ytarget`: 输出的真实值


  该函数提供了神经网络的误差。`J` 的值越小，反映神经网络的准确性越高。到此为止，我们定义了损失函数以及神经网络的基本工作原理。现在，让我们深入了解训练过程中每个步骤的细节。


  ### 训练过程细节

  让我们考虑一组输入 `X` 和输出 `Y`。我们将 `W`（即权重）和 `B`（即偏置）初始化为空矩阵。


  #### 前向传播

  下一步是应用前向传播，它包括向人工神经网络的每一层输入权重与输入的乘积之和加上偏置。假设我们有两层。我们可以使用以下方程计算第一个隐藏层的输出：


  `Z1=W1*X+b1`


  其中 `W1` 和 `b1` 分别是神经网络的参数，作为第一层的权重和偏置。


  接下来，我们应用激活函数 `F1`，它可以之前介绍过的任何激活函数：


  `A1=F1(Z1)`


  得到的结果是第一层的输出，然后将其按如下传递到下一层：


  `Z2=W2*A1+b2`


  其中 `W2` 和 `b2` 分别是第二层的权重和偏置。对此结果，我们应用激活函数 `F2`：


  `A2=F2(Z2)`


  现在 `A2` 应该是人工神经网络的输出。取决于数据集和预期输出，激活函数 `F1` 和 `F2` 可能是相同的激活函数，也可能是不同的激活函数。


  #### 反向传播

  在前向传播之后，我们使用损失函数比较神经网络输出与目标输出。在此阶段估计输出与实际值之间的差异可能很大。因此，我们必须通过反向传播过程调整权重。


  我们计算每个激活函数关于偏置和权重的梯度。我们从评估最后一层的导数开始，然后是该层的前一个层，依此类推，直到输入层。然后根据梯度或激活函数的导数更新权重。


  将这些步骤应用于我们的两层神经网络示例中，结果如下：


  ```

  W2=W2-α*(dF2(W, b)/dW)

  B2=b2- α*(dF2(W, b)/db)

  W1=W1-α*(dF2(W, b)/dW)

  B1=b1- α*(dF2(W, b)/db)

  ```


  参数 `α` 是学习率参数。该参数决定了权重更新的速率。我们刚刚在这里描述的过程被称为梯度下降算法。重复该过程直到达到预设的最大迭代次数。我们将基于人工神经网络开发一个分类器。






  # 第 5 章 — 开启深度学习所需的知识


  ![machine-and-deep-learning](img/rsrcRK.jpg)


  深度学习取得的创新和突破足以让许多人对其感到兴奋。人们说，我们生活在科技时代，随着深度学习已经取得的巨大进步；下一个时代可能将是人工智能时代。为此，将越来越多的人希望进入这一领域，以便在开启这一新时代中发挥作用。然而，在做到之前，有许多事情你必须理解。既然这些基础知识已经如此清晰地实现，我们将开始看到人工智能在各种行业中涌现。这是一个复杂的领域，对于任何想要牢牢掌握它的人，对线性代数、微积分、概率和编程等学科的基础理解会有帮助。如果你没有这些背景，并不意味着你无法掌握这些概念，但意味着你必须多做一些作业才能攻克其核心内容。你还需要了解深度学习与之前的任何类型人工智能之间的实际区别，以及为什么它比以前的任何都要高效得多。


  ## 深度学习、机器学习、人工智能 — 它们之间有什么区别


  通常当你研究深度学习时，你会遇到几个似乎交替使用的术语。深度学习、机器学习和人工智能，虽然这三者都相关，但它们之间存在某些区别，将它们彼此区分来。


  那么，深度学习到底是什么？基本上，它是机器学习的一种类型，使用一种神经网络系统，该系统旨在模拟人类大脑的学习。这种网络的重点是简化机器使用某些学习算法的方式，这些算法可以应用于人工智能和机器学习中。事实上，没有深度学习，人工智能几乎是不可能的。


  正因为有了深度学习，我们现在有了开发大规模神经网络的能力，这些网络能够吸收信息并对其做出响应，而不需要人类对其每一个动作进行编程。人们预期，某一天，这些机器将能够自主运行，完全独立于任何形式的人类干预。


  对于外行人来说，我们对“人工智能”这个词很熟悉。它是无数科幻电影的素材。然而，很少有人理解它不再是科幻小说，而是确实在现实领域中涌现。


  解释一下：深度学习是机器学习的一种，用于教机器如何以类似于人大脑学习过程的方式进行学习。机器学习是一系列算法，赋予机器收集数据、分析数据并根据该分析做出决策的能力。人工智能是经过机器学习程序编写的机器，因此它可以收集数据并根据这些数据做出决策。在最基本的的形式下，深度学习只是另一种机器学习。基础机器学习多年来得到了改进，而深度学习是进化链中最新的环节。在开发的早期阶段，深度学习机器只能从已经标记并存储在机器中的数据中学习。这意味着它只能在人类的监督下运行。无监督学习仍然是遥远的未来，但许多人认为这是一个非常现实的可能性。现在，机器可以以各种方式进行学习。


  ## 机器如何学习


  谈到学习时，我们人类是在没有任何任何思考或编程的情况下完成的。我们的大脑从未需要接受训练如何学习某事。从我们出生开始，我们的五感就会立即行动，收集数据并将其提交给大脑。我们的大脑处理信息、分析它们，然后根据它们做出决策。如果我们在晚上出门，大脑会自动评估场景，确定危险程度，并告诉双脚移动得快一点。如果我们在看电影，大脑会吸收所有信息，并决定我们应该哭泣、大笑还是生气。我们拥有所谓的无监督学习。没有人需要为我们编写那些细节和反应。此外，一旦我们学会了一个概念，它就成了我们可以在其基础上构建的基础。我们首先学习字母表（初始概念），然后学习与字母表相关的声音，然后学习将声音组合在一起形成单词。最终，我们将能够阅读，这被称为分层学习。带着这个想法，我们可以继续构建我们的知识库并从那里成长。


  机器学习的概念是类似的。虽然与人类大脑能做的惊人事情相比还有很大差距，但仍然是一个很好的开始。机器学习的目标是创建可以学习并执行通常需要人类智能的任务的机器。通过使用算法和数据，我们可以构建可以识别模式、预测甚至做出决策的系统。


  深度学习的目标是将机器学习提升一个水平。通过使用神经网络，我们可以创建能够从复杂数据中学习并执行以前无法完成的任务的机器。这导致了医学、金融等领域的许多突破。深度学习被应用于更多场景中，如图像识别、语音识别、自动驾驶汽车等。






  - 将宠物替换为机器

  - 将零食替换为奖励函数

  - 将良好行为替换为结果动作


  为了使这一过程生效，你需要一个反馈循环，以强化机器实际学习的内容。当它执行某些动作时，它会获得奖励；当它出错时，它会受到惩罚。你可能会奇怪，如何奖励或惩罚一个没有感觉和情感的机器呢？系统的运行机制如下：


  - 机器被赋予一个必须维持的内部状态。该状态用于学习环境。

  - 奖励函数用于教导机器如何行为。

  - 环境是机器必须运行的情境或场景。它包含了智能体可以观察并响应的所有事物。

  - 动作是机器的行为。

  - 智能体执行所有的操作。





  # 第 6 章 — 数据科学生命周期与技术


  ## 数据科学生命周期

  数据分析师将花费一些时间解释发生的情况，因为他们能够处理数据所经历的历史。另一方面，数据科学家不仅要进行探索性分析以找出其中的洞解，还将受益于使用机器学习中一些更先进的算法，以确定未来某个事件发生的概率。


  数据科学家在这方面将有一份很有趣的工作。他们将专门花时间从许多不同的角度来观察数据，其中某些角度可能是全新的，是那些过去没有人考虑过的角度。因此，简单来说，数据科学将通过许多不同的方法帮助我们做出一些预测和决策。其中一种方法就是通过机器学习。


  ## 数据科学生命周期

  了解这是什么以及它是如何工作的，将对你在这个领域取得的成功产生巨大影响，并将帮助你从过程中获得尽可能的结果。数据科学生命周期中的一些步骤包括：


  ### 发现 (Discovery)

  我们需要探索的第一步是发现。在这一领域启动任何项目之前，你需要了解不同的属性、需求、规范以及所需的预算。否则，很难知道该从何开始。一旦你掌握了这些信息，就可以对人员、时间、数据、支持和技术进行评估，以确定该项目是你能够完成的。如果你在这些任何方面都短缺，那么可能是时候评估你是否可以在没有它们的情况下完成，或者在开始之前获取它们了。


  对于这一阶段，你需要花一些时间进行研究。你需要对想要做的项目有充分理解，并且知道你是否有足够的资源来完成所有工作。如果有需要且该项目是必须的，你想做它但没有足够的资源，你需要找出可以做什么来改变这种局面。


  在这一阶段工作时，你需要关注的另一件事是，你需要构建你想要修复和改进的业务问题，同时正式化你想要测试的初始假设。


  ### 数据准备 (Data Preparation)

  当你完成上述步骤后，就是时候进入第二个阶段了。在这一阶段，你需要一些分析来查看结果。你希望有一个分析沙盒，以便在处理项目的整个期间执行正确的分析。在建模之前，你需要进行探索，花时间进行预处理并对数据进行条件处理。


  一旦你完成了其中一些步骤，就可以更进一步了。你需要执行被称为 `ETLT` 的操作。这代表提取（extract）、转换（transform）、加载（load）和再次转换。这允许你将想要的数据放入沙盒，以便你可以进行想要的一些实验。这是你将所有数据设置好并准备使用的绝佳时机。如果你不花时间以适当的方式处理现有数据，那么几乎不可能获得正确的算法，甚至无法以正确的方式使用它。一旦你清理了数据并进行了一些准备，你就可以对其进行所谓的探索性分析以学习更多信息。


  ### 模型规划 (Model Planning)

  一旦你能够清理并准备好要在模型中使用的任何数据，就是时候要实际规划模型了。在第三步中，你将花一些时间来规划模型。在这一阶段，你将关注另一件事是，你需要构建你想要修复和改进的业务问题，同时正式化你想要测试的初始假设（*注：此处对应原文逻辑*）。


  如果有需要且该项目是必须的，你想做它但没有足够的资源，你需要找出可以做什么来改变这种局面。*注注：根据上下文逻辑，一旦你清理了数据并进行了一些准备，你就可以进行
  `EDA`（探索性数据分析）来了解更多信息（*：一旦你清理了数据并进行了一些准备，你就可以对其进行所谓的探索性分析以学习更多信息。*）。


  ### 模型构建 (Model Building)

  当你能够清理并准备好要在模型中使用的任何数据后，就是时候要实际规划模型了。在第三步中，你将花一些时间来规划模型。在这一阶段，你将关注另一件事是，你需要构建你想要修复和改进的业务问题，同时正式化你想要测试的初始假设。*（注：原文在此处似乎存在逻辑重复，译文已保持语意连贯）。*


