    # Chapter 5 — What You Need to Know to Get Started with Deep Learning


    ![machine-and-deep-learning](rsrcRK.jpg)


    The innovations and breakthroughs that have been accomplished with deep learning
    are enough to get a lot of people excited about it. It is said that we live in
    the age of technology and with the many strides already achieved by deep learning;
    the next age will probably be the age of artificial intelligence. To that end,
    there will be more and more people looking to enter this field, so they can have
    a role in ushering in this new era. However, before they can do that, there are
    a lot of things you must come to understand. Now that these fundamentals are so
    clearly realized, we will begin to see artificial intelligence emerge in all sorts
    of industries. This is a complex field and for anyone to get a firm grasp on it,
    it helps to have a basic understanding of subjects like linear algebra, calculus,
    probability, and programming. If you don’t have this background, it doesn’t mean
    that you cannot grasp these concepts, but it does mean you’ll have to do a little
    extra homework to get through the meat of it all. You’ll also need to know some
    practical differences in how deep learning differs and why it is so much more
    efficient than any other type of artificial intelligence before it.


    ## Deep Learning, Machine Learning, Artificial Intelligence — What’s the Difference


    Often when you research deep learning, you’ll come across several different terms
    that seem to be used interchangeably. Deep learning, machine learning, and artificial
    intelligence, while these are all related, there are some distinct differences
    that set them all apart from each other.


    So, what exactly is deep learning? Basically, it is a type of machine learning
    that uses a system of neural networks that are designed to mimic the learning
    of the human brain. This network’s focus is to simplify how a machine uses certain
    learning algorithms, which can be applied in artificial intelligence and machine
    learning. In fact, it is virtually impossible to have artificial intelligence
    without deep learning.


    Because of deep learning, we now have the ability to develop massively large neural
    networks that have the ability to absorb information and respond to it without
    the need for a human to program its every move. The expectation is that one day,
    these machines will be able to operate autonomously, completely on their own without
    any form of human interference.


    For the layperson, we are familiar with the term “artificial intelligence.” It
    is the stuff of countless science fiction movies. However, few people understand
    that it is no longer science fiction but is definitely emerging in the realm of
    reality.


    To explain: Deep learning is a form of machine learning that is used to teach
    machines how to learn in a way that is similar to the learning process in the
    human brain. Machine learning is a series of algorithms that give machines the
    ability to collect data, analyze it, and make decisions based on that analysis.
    Artificial intelligence is a machine programmed with machine learning, so it can
    gather data and make decisions based on that data. In its most basic form, deep
    learning is simply another type of machine learning. Basic machine learning has
    improved over the years and deep learning is the latest link in the evolutionary
    chain. In its early stages of development, deep learning machines were only capable
    of learning from data that had already been labeled and stored into the machine.
    This meant it could only function with human supervision. Unsupervised learning
    was still far into the future, but many believed it was a very real possibility.
    Now, machines can learn in all sorts of ways.


    ## How a Machine Learns


    When it comes to learning, we humans do it without any thinking or programming.
    Our minds have never had to be trained in how to learn something. From the time
    we’re born, our five senses go immediately into action, collecting data and submitting
    it to our brains. Our brains process it, analyze it, and then make decisions based
    on it. If we’re walking out at night, our brain automatically assesses the scene,
    determines a level of danger, and tells our feet to move faster. If we’re watching
    a movie, our brain takes all that information in and determines whether we should
    cry, laugh, or be angry. We have what is called unsupervised learning. No one
    has to program those details and responses to us. In addition, once we learn a
    concept, it then becomes a foundation from which we can build on. We first learn
    the alphabet (the initial concept) then we learn the sounds related to that alphabet,
    then we learn to string sounds together, creating words. Eventually, we’ll be
    able to read and this is called layered learning. With that thought in mind, we
    can continue to build our knowledge base and grow from there.


    The concept of machine learning is similar. While it is a far cry from doing the
    amazing things that the human brain can, it is still a great start. The goal of
    machine learning is to create machines that can learn and perform tasks that normally
    require human intelligence. By using algorithms and data, we can build systems
    that can identify patterns, make predictions, and even make decisions.


    The goal of deep learning is to take machine learning to the next level. By using
    neural networks, we can create machines that can learn from complex data and perform
    tasks that were previously impossible. This has led to many breakthroughs in fields
    such as medicine, finance, and beyond. Deep learning is used in many more applications,
    such as image recognition, speech recognition, autonomous vehicles, and more.

    '
