    ### 选择训练数据集


    人工智能和机器学习模型从输入的数据中进行学习。因此，为了获得准确且安全的预测，数据科学家需要为 AI 模型提供不同类型的数据，并排除任何漏洞。进行训练算法处理是为了避免数据选择中的偏差，为此，我们需要确保训练数据的多样性。如果某组数据量不足，可以使用加权方法来提高训练的有效性，但在此进行此操作时必须极度谨慎。


    ### 通过真实数据监控性能


    歧视性模型通常在控制环境中运行，没有任何一家公司会有意识地创建带有偏见的人工智能模型。遗憾的是，测试组被用于检查已经投入生产并可能引发未来问题的算法。使用统计方法而非真实数据，是通过真实数据监控性能的更好方法，因为在寻求公平时，我们需要检查数据在结果平等和机会均等方面的表现。


    虽然很难证明机会均等，但在现实世界中测试和监控机器学习模型确实可以帮助研究人员开发出高精的模型和算法。对于自学习系统，使用带偏的数据喂给模型有时会导致意想不到且危险的结果。


