    # 第 9 章 —— 机器学习及其如何融入数据科学


    只要我们使用得当，机器学习绝对可以是数据科学过程中一个至关重要的部分。请记住，在我们执行这一过程中，数据科学的一个部分是进行数据分析。这帮助我们处理在沿途中收集的大量数据，并实际上看到其中包含的洞察和预测。为了实现这一目标，我们需要能够创建模型（这些模型可以筛选所有数据）、发现隐藏的模式并为我们提供洞察。为了定义这些模型并确保它们按照我们想要的方式运行，我们需要配备多种良好的算法，而这正是机器学习大显身手。你会发现，在机器学习以及机器学习中各种算法的帮助下，我们可以创建出处理我们拥有的任何类型数据的模型，无论数据大小，并为我们提供此处所需的答案。


    机器学习是一个过程，我们可以通过这个过程让我们正在处理的系统或机器以人类的方式进行思考。这允许算法以人类能够的方式去发现隐藏的模式，但其执行速度比任何手动操作的人类都要快且高效得多。想一下，对于任何个人、甚至是一组试图处理所有数据的人来说，手动完成这些工作将有多困难。他们可能需要数几年才能处理完所有数据并找到他们需要的洞察。而且考虑到数据生成和收集的速度之快，在我们达到那个点时，那些预测和洞察已经毫无价值了。


    机器学习可以让这个过程变得简单得多。它允许我们有一种思考数据的方式，并发现其中满足我们需求的隐藏模式和洞察。通过正确的机器学习算法，我们可以学习该过程是如何运作的，以及为实现这一目标所需的所有步骤。考虑到这些，是时候密切关注机器学习，以及我们为了满足需求而需要了解的所有部分了。


    ## 什么是机器学习？


    我们首先需要关注机器学习的基础知识。机器学习是人工智能的应用之一，它可以赋予系统自主学习的能力，而不需要程序员来告诉系统该做什么。系统甚至可以更进一步，根据自己的经验来工作改进，而这一切在过程中都不需要对系统进行显式编程。机器学习的理念将专注于在计算机上开发程序，这些程序可以访问你拥有的任何数据，然后利用这些呈现的数据来学习新知识，以及你希望它如何运行。


    在涉及到机器学习的使用时，我们可以查看几种不同的应用。当我们开始更多探索机器学习能做什么时，你可能会注意到多年来，它已经改变并发展成为程序员比以往任何时候都更喜欢工作的东西。当你想要让你的机器或系统独立完成大量工作，而不需要你干预并编写每一个步骤时，那么机器学习就是你的正确选择。


    在技术领域，我们会发现机器学习非常独特，并可以为我们编写的代码增添乐趣。已经有许多不同行业的公司（我们稍后会讨论）在使用机器学习，并已经从中获得了巨大的益处。


    在机器学习机器学习方面，有许多不同的应用，我们利用这种人工智能所能做的一切令人惊叹。在机器学习方面，我们可以遵循并投入时间关注的某些最佳方法包括：


    - **统计学研究**：在 IT 领域，机器学习已经取得了一些进展。你会发现，机器学习可以帮助你处理大量的复杂数据，寻找数据中大型且重要的模式。此类类别下机器学习的某些不同应用将包括垃圾邮件过滤、信用卡和搜索引擎等。

    - **大数据分析**：许多公司花费了时间收集所谓的“大数据”，现在他们必须找到一种方法，在短时间内对这些数据进行筛选并从中学习。。公司可以使用这些数据来更多地了解客户是如何花钱的，甚至可以帮助他们对未来做出重要决策。如果我们让某人手动完成这些工作，将花费太长时间。但通过机器学习，我们可以完成所有工作。医疗领域、竞选活动甚至零售店等已经开始转向机器学习以获得这些益处。

    - **金融世界**：许多金融公司已经能够依靠机器学习。例如，在线股票交易将依靠这种工作，我们会发现机器学习可以帮助欺诈检测、贷款审批等。


    为了帮助我们开始这项工作，并理解如何从机器学习中获得我们想要的价值，我们必须将最佳算法与正确的流程和工具配对。如果你使用错误的算法来筛选这些数据，你将获得大量不准确的信息，结果无法为你提供所需的帮助。始终使用正确的算法将产生巨大的差异。


    我们将看到的酷的一点是，目前有很多机器学习算法供我们选择来构建你的模型。这些算法中的每一个工作方式都不同，但这确保了你可以处理项目中出现的任何类型的问题。然而，尽管如此，你会注意到一些不同的可用用算法包括随机森林、神经网络、聚类、支持向量机等。


    当我们致力于我们生成的某些模型时，我们还会注意到有许多工具和其他流程可供我们使用。我们需要确保选择正确的工具，以确保你正在处理的算法和模型能够以你想要的方式运行。机器学习提供的不同工具将包括：


    - 全面的管理和数据质量。

    - 模型的自动集成评估，帮助查看哪些是表现最好的。

    - 用于帮助构建你想要的模型的图形用户界面（GUI），以及流程图的构建。

    - 易于部署，以便你能够快速获得可靠且可重复的结果。

    - 数据的交互式探索，甚至一些帮助我们更轻松查看信息的可视化工具。

    - 端到端的集成平台，帮助实现从数据到你希望遵循的决策过程的自动化。

    - 用于比较不同机器学习模型的工具，帮助我们快速高效地识别出最佳模型。


    '
