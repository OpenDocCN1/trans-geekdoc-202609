    # Relationship Between Data Mining and Other Research Areas


    Data mining is an inter-categorical field of study that overlaps and corresponds
    to different segments such as machine learning, computer science, soft computing,
    etc. The relationship between data mining and these fields overlay the fundamental
    notion of supplementing artificial intelligence. This notion holds that each subsect
    and area in artificial intelligence complement each other and work both dependently
    and independently.


    ## Data Mining and Statistics

    There are striking differences between data mining and statistics. However, the
    two fields of research have many components and concepts in common. In the past,
    descriptive statistics concentrated on labeling data using metrics, while inferential
    statistics put more weight on theory analysis to draw noteworthy inference from
    the data or generate prototypes. On the contrary, data mining techniques are more
    concerned about the outcome of the study as opposed to arithmetical implication.
    Many methods of data mining do not focus on the arithmetic test or connotation,
    as long as given metrics like viability and precision are met to the maximum.
    Additionally, data mining is usually concentrated on automated analysis of datasets,
    and in most cases, by machinery that can scale to a massive amount of data. The
    proximity in scope is realized by mathematicians, who sometimes refer to data
    mining in statistics as “statistical learning.”


    ## Main Data Mining Software

    To successfully perform the process of data mining, there are some software and
    algorithmic computer program available. The software varies in model and use.
    Some software is all-purpose implements that offer algorithms of different kinds,
    other software is more specified. It is important to note that some software is
    developed for commercial purposes, while others are free to access and configure
    (open-source). The various software can perform data mining on several data types.
    Data mining software and algorithms are specifically developed to be used on different
    types of data. Below, I offer a summary of the countless examples of data generally
    bumped into, and which can be analyzed using the methods of data mining.


    - **Relational databases**: relational databases are the classic type of database
    that is mostly found in institutions and firms. In this form, data is categorically
    structured in tables. Conventional methods, like `SQL`, are used to query the
    database when trying to find faster information in the database. However, data
    mining enables the finding of sophisticated patterns within the database.

    - **Customer transaction databases**: another commonly used type of database is
    the customer transaction database. This type is mostly used in retail stores.
    The database is made up of all dealings made by the clients. The study of this
    database is essential in understanding the patterns of purchase and sales. It
    allows the retailers to understand the changes in the market, thus helping in
    planning sales and marketing strategies.

    - **Temporal data**: Another prevalent form of data is temporal data. The mundane
    type considers the time dimension in the data. Here, arrangements are created
    in many realms such as a sequence of items purchased by a customer, a chain of
    part of the population that is vegan, etc. The temporal data is further divided
    into time series. The series is a systematic list of arithmetic values, like the
    price of shares in the stock market.

    - **Spatial data**: another set of data that can be easily analyzed is spatial
    data. This type of data consists of aggregate information like environmental data,
    forestry data, and data about substructures such as railway lines and air distribution
    channels.

    - **Spatio-temporal data**: this is a type of data that has both characteristics
    of spatial and temporal data. For instance, the data can be about climatic conditions,
    the movement of the wilder beast in crowds, etc.

    - **Text data**: the text type of data has become a widely studied area in data
    mining. The utilization spreads even though text data is mostly amorphous. Text
    documents are mostly disorganized and lack a definite form. Examples of text data
    are in feeling analysis and composition acknowledgment (predicting the author
    of a given text).

    - **Web data**: this a a type of data that originates from websites. The data
    is mainly sets of a document, e.g., journals from the web with attached links.
    The sets are bound to form a graph. Some specific examples of data mining activities
    on the internet include predicting the possible next page on the website, grouping
    the webpages according to subjects automatically, and evaluating the time taken
    on every webpage.

    - **Graph data**: graphs are also another type of database. Charts are found in
    social networks (for instance, the list of Facebook friends) and chemistry (for
    example, a graph of biochemical molecules and atoms).

    - **Assorted data**: Different or miscellaneous type of data is a collection of
    many kinds of data. The classes are linked and can be sorted into a specific arrangement.

    - **Data streams**: A data stream is said to be a continuous and high-speed torrent
    of data that is theoretically boundless. For instance, the data stream can be
    ecological data, data from video cameras, or digital television data). The limitation
    of this type of data is that it cannot be adequately stored in the computer. Therefore,
    the data should be evaluated regularly using suitable methods of data mining.
    Everyday data mining tasks in stream data are usually the detection of variations
    and tendencies.


    ## Patterns Found in Data

    As deliberated, the objective of data mining is to mine desirable patterns of
    information from data. The leading types of designs that can be extracted from
    data are as follows (take note that this list is not the finished product):


    ### Clusters

    Algorithms used for clustering are always applied in a situation where the sets
    of data are supposed to be sort in groups of similar instances (clusters). The
    main aim of these algorithms is condensing data to make it easy to understand
    and make an inference. Clustering modus operandi likes `K-Means` can be utilized
    to robotically group student showing similar performance.


    ### Classification Models

    The algorithms used for classification tasks are purposed to extract models, which
    can be used to group objects and new instances into classes. For example, classification
    algorithms such as `Naïve Bayes`, `decision trees`, and the `neural networks`
    can be used to create designs capable of predicting the trends in customer behaviors
    or the possibility of individual students to pass an examination. These models
    can also be hauled out to execute a forecast about the future.


    ### Patterns and Associations

    Some methods are designed to study the relationship between data and frequently
    occurring patterns. For instance, the frequency of an item set can be analyzed,
    using data mining algorithms, to determine the most purchased items in particular
    retail outlets. Additional types of patterns are temporal patterns, progressive
    rules, irregular patterns, and recurrent subgraphs.


    ### Anomaly Detection

    The AD is a method of machine learning that seeks to detect glitches and variances
    within a given set of data.

