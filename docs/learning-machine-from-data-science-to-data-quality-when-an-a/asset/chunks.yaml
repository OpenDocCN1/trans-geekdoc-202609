    - 将宠物替换为机器

    - 将零食替换为奖励函数

    - 将良好行为替换为结果动作


    为了使这一过程生效，你需要一个反馈循环，以强化机器实际学习的内容。当它执行某些动作时，它会获得奖励；当它出错时，它会受到惩罚。你可能会奇怪，如何奖励或惩罚一个没有感觉和情感的机器呢？系统的运行机制如下：


    - 机器被赋予一个必须维持的内部状态。该状态用于学习环境。

    - 奖励函数用于教导机器如何行为。

    - 环境是机器必须运行的情境或场景。它包含了智能体可以观察并响应的所有事物。

    - 动作是机器的行为。

    - 智能体执行所有的操作。

