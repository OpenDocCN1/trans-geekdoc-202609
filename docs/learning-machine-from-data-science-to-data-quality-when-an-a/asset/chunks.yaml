    And that is an important concept. Unfortunately, these days there is a lot of
    fear-mongering regarding artificial intelligence. People seem to be vulnerable
    to the same old fantasies even if the empirical evidence says otherwise. The Luddites
    were wrong, the machines actually created 10 – 100 more jobs than they eliminated.
    Machines free up people to engage in more productive activities, and when productivity
    is increased jobs, activities, and opportunities increase as well.  The same holds
    true today, as it always has. Each new generation brings up the old Luddite ideas,
    only to see them die yet again. This happened in the early 1980s when the invention
    of spreadsheets and accounting programs on personal computers led people to a
    state of fear where they imagined accountants and office workers would no longer
    be necessary. Then they did the same thing with word processors, imagining that
    secretarial work would be eliminated. Neither happened. Now here we are again.
    After languishing for decades, artificial intelligence is finally coming to life.
    Robotics is enhancing the capability of manufacturing companies to produce more
    output with less cost and labor. Despite the fact that as I am writing this, the
    economy is at full employment, politicians and people in the media are once again
    making the Luddite charge. This time artificial intelligence and machine learning
    are coming for your jobs. The short-sighted people who promote these fears miss
    the point entirely, they fail to see that the changes the world is currently going
    through are going to do what they always have and that raises productivity and
    free people to do other things.  Hopefully, they won’t stop this exciting engine.
    I suspect they won’t be able to. Governments and corporations are already in love
    with machine learning. The reason is simple. Machine learning works. After decades
    of oversold promises, computers are now in a position where they can learn, and
    once trained, they work autonomously. Machine learning makes corporations run
    more efficiently and helps the government identify fraud, prevent cyberattacks,
    and do a million other things. Since intelligence is general, the applications
    of machine learning and AI are general.  AI holds out a special fear for people
    who hold the Luddite perspective. It’s one thing to say that a machine is going
    to destroy your job, but people also have unrealistic fears of machine learning
    systems. They seem to think that AI and robots are going to take over the world
    as if they are living in some kind of science fiction fantasy. There is no doubt
    that as the years go by, machine learning is going to continue to improve and
    be able to take on more tasks, but what those tasks are used for is entirely in
    human control. These tools can be used for nefarious purposes. In the Republic
    of China, machine learning tools like facial recognition are being used to control
    and harass people. Tools that in the United States and Europe are used to determine
    someone’s creditworthiness for a loan are being used in China to give people a
    ‘social score.’ According to news reports, the social score can be used to keep
    people from traveling or being able to leave the country. So there is no question
    that in the wrong hands, the tools of machine learning can be used with bad intent.
    But that has nothing to do with the tools themselves and this kind of situation
    applies to any technology that human begins have ever invented. We can’t control
    what everyone does in other countries, but we can control how the tools are used
    here. Each of us has a responsibility to do this. If the government misuses these
    tools, then they need to be called out for doing so and you should vote for politicians
    who will manage AI in an ethical fashion. With private companies, that task is
    easier, simply avoid any private company that uses them in an unethical fashion.
    At this point, I’d like to personally thank every reader for taking the time to
    read and making it all the way to the end. If you are new to machine learning,
    my hope is that you’ve come away with some of the mystery behind it stripped away.
    It’s not as complicated as it might seem when you are first exposed to the ideas,
    or just hearing about them in the media. If you are really interested in machine
    learning and would like to become educated in it and possibly pursue it as a career,
    the best place to start is to learn how to code. In order to get a job in this
    competitive field, you are probably going to need some kind of academic degree
    and this is one of the few areas in college where you can go to school and directly
    learn the skills you are going to need on the job. But you can get started by
    learning python, which is a simple programming language that runs on any system.
    You can get online and search for machine learning algorithms built in python
    that can use small data sets to start giving you practice in this field. If you
    decide to go further, my advice is to either major in statistics or computer science,
    or ideally double-major in computer science and mathematics. Studying computer
    science alone is probably inadequate because you need to have an advanced grasp
    of probability and statistics in order to actually pursue a career in data science. 
    I would also recommend taking a few business courses. You will want to learn about
    things like logistics, where data science is often applied to generate solutions
    for large corporations. It works well and I can guarantee that one thing you will
    be able to count on is you will be able to get a job doing this if you get the
    right education. How far you go is up to you, the more education, the higher level
    at which you are going to start and these types of fields can be very competitive.
    A master’s degree would be great and for those who want it, a Ph.D. will put them
    in the best position. If you have followed my advice with a double major, you
    can pick one or the other for a master’s degree; it’s not necessary to continue
    trying to get more academic credentials in both.  Working with machine learning
    is a different type of activity than traditional computer programming. Of course,
    traditional computer programming is still around and alive and well, so let’s
    not kill it off yet.
