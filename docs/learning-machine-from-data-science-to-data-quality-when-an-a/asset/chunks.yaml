    or neural network performance does not improve.


    ### Loss Function

    As we can see from the steps of training an artificial neural network presented
    above, we need a performance measure that describes how accurate the neural network
    is. This function is called the loss function or cost function.


    `J=(1/N) *∑(ypredicted -ytarget )2`


    Where:

    - `N`: the number of outputs

    - `yppredicted`: the output

    - `ytarget`: the true value of the output


    This function provides the error of the neural network. Small values of `J` reflect
    the high accuracy of the neural network. So far, we defined loss function and
    how the neural network works in general. Now, let’s go into the details for each
    step of the training process.


    ### Training Process Details

    Let’s consider a set of inputs `X` and outputs `Y`. We initialize `W` (i.e., weights)
    and `B` (i.e., bias) as a null matrix.


    #### Feedforward Propagation

    The next step is to apply the feedforward propagation that consists of feeding
    each layer of the artificial neural network with the sum of the weights by the
    inputs and the bias. Let’s consider that we have two layers. We can calculate
    the first hidden layer’s output using the following equation:


    `Z1=W1*X+b1`


    Where `W1` and `b1` are the parameters of the neural network as the weights and
    bias of the first layer, respectively.


    Next, we apply the activation function `F1`, that can be any activation from the
    function presented previously:


    `A1=F1(Z1)`


    The result is the output of the first layer, which then is feed to the next layer
    as:


    `Z2=W2*A1+b2`


    Where `W2` and `b2` are the weights and bias of the second layer, respectively.
    To this result, we apply an activation function `F2`:


    `A2=F2(Z2)`


    Now `A2` is supposed to be the output of the artificial neural network. The activation
    function `F1` and `F2` might be the same activation function or different activation
    function depending on the dataset and the expected output.


    #### Backpropagation

    After the feedforward propagation, we compare the neural network output against
    the target output with the loss function. It is highly likely the difference between
    the estimated output and the actual values at this stage is very high. Therefore,
    we have to adjust the weights through the backpropagation process.


    We calculate the gradient of each activation function concerning biases and weights.
    We start by evaluating the derivative of the last layer, then the layer before
    this layer on so on until the input layer. Then update the weights according to
    the gradient or the derivative of the activation function.


    Applying these steps to our example of two layers neural network it provides:


    ```

    W2=W2-α*(dF2(W, b)/dW)

    B2=b2- α*(dF2(W, b)/db)

    W1=W1-α*(dF2(W, b)/dW)

    B1=b1- α*(dF2(W, b)/db)

    ```


    The parameter `α` is the learning rate parameter. This parameter determines the
    rate by which the weights are updated. The process that we just describe here
    is called the gradient descent algorithm. The process is repeated until it attains
    a pre-fixed maximum number of iterations. We will develop a classifier based on
    an artificial neural network.

