    # 第 7 章 — 商业智能


    ## 什么是商业智能？

    商业智能（`BI`）是用于分析业务数据的技术和设备的集合。当商业智能任务将外部数据源与内部数据热点相结合以获得显著的理解时，这些任务整体变得愈发重要。


    业务分析（也称为高级分析）是一个经常与商业智能交替使用的术语。然而，业务分析是商业智能的一个子集，因为商业智能管理方法论和设备，而业务分析更侧重于技术手段。商业智能是描述性的，而业务分析则越来越具有规范性，倾向于解决特定问题或业务问题。


    竞争情报是商业智能的一个子集。竞争情报是用于收集、获取和分析竞争对手业务数据的数据、工具和形式。竞争情报通常用于筛选产品之间的差异。


    ## 商业智能在企业估算中的应用

    许多商业智能工具被应用于估算场景中。它们可以从传感器、`CRM`框架、网络流量等获取输入数据以衡量 `KPIs`。例如，一家大型组装公司的办公小组解决方案可能包含传感器，用于测量关键硬件的温度，以优化支持计划。


    ### 分析

    分析是对数据进行调查以发现重要模式和见解的过程。这是商业智能工具的一个著名用途，因为它允许企业深入理解其数据，并通过数据驱动的决策产生动力。例如，一家营销公司可以使用分析来决定客户细分，以更好地转化另一类客户。


    ### 报告

    报告生成是商业智能软件的标准用途。`BI`产品现在可以持续为内部相关者生成常规报告，为分析师自动化基础任务，并减少对电子表格和文字处理程序的需求。例如，一名业务活动分析师可以使用该工具创建一份周报，按地理位置列出上周的交易情况——这项任务在手动操作时显然需要更多精力。有了了高效的报告工具，创建此类报告所需的精力将完全减少。有时，商业智能工具可以完全自动化报告流程。


    ### 协作

    协作功能允许用户对相同的数据和记录进行渐进的工作，这在当今的商业智能平台中非常常见。跨设备协作将继续推动比以往更好的商业智能工具的发展。在创建新的报告或仪表板时，`BI`平台上的协同工作可能至关重要。例如，一家创新公司的
    CEO 可能需要在 24 小时内获得关于另一个产品的亮点系列数据的定制报告或仪表板。产品管理员、数据分析师和 QA 分析师可以使用协作式`BI`工具同时创建他们各自的报告或仪表板部分，以准时完成。


    ## 商业智能的最佳实践

    如果组织投入并审慎地执行，商业智能活动极有可能成功。基本因素包括：


    ### 业务赞助

    业务赞助是最成功的因素，因为即使是最完美的系统也无法克服业务责任的缺失。如果组织无法项目的预算限制，或者官员忙于非`BI`活动，该任务将无法成功。


    ### 业务需求

    理解业务需求对于正确实施商业智能框架至关重要。这种理解是双向的——终端用户和 IT 部门都有重要的需求，且这些需求经常变化。为了获得对`BI`需求的这种基本理解，组织必须分析其成员的所有不同需求。


    ### 数据的总量和质量

    如果商业智能活动能够大规模整合优质数据，它就是有效的。基础数据源包括客户关系管理（`CRM`）软件、传感器、营销活动和资源计划（`ERP`）设备。糟糕的数据将导致糟糕的决策，因此数据质量至关重要。处理数据特性的典型程序是数据分析，即对数据进行检查并收集统计以改进数据管理。它维护了一致性，降低了风险并通过元数据简化搜索。


    ### 客户体验

    一致的客户体验对于商业智能来说是基础，因为它可以促进客户接受，并最终从`BI`产品和活动产生更多动力。如果没有真实且实用的界面，终端用户的接受将是一场战斗。


    ### 数据收集和清洗

    数据可以从大量来源收集，并可以轻易使组织崩溃。为了预测这一点并从商业智能项目中产生动力，组织必须区分基础数据。商业智能数据经常包含`CRM`数据、竞争对手数据、行业数据等。


    ### 项目管理

    稳固项目最基本的解决方法之一是在项目人员、IT 部门和终端用户之间建立必要的通信渠道。


    ### 获得支持

    在获取另一个商业智能产品时，获得高层管理者的支持至关重要。可以通过告知 IT 偏好和需求来获得 IT 的支持。终端用户也有自己的需求和偏好，具有各种要求。


    ### 需求收集

    需求收集似乎是应该遵循的最重要的实践，因为在对几个`BI`设备进行评估时，它考虑了更多的透明度。需求源于几次成员会议，包括 IT 和业务客户。


    ### 培训

    培训驱动终端用户的选择。如果终端用户没有准备准备好，接受和价值创造将变得越来越难以实现。许多商业智能供应商（包括`MicroStrategy`）提供培训服务，其中包括针对所有相关客户的培训和认证。培训可以涵盖任何与商业智能项目相关的关键收集。


    ### 支持

    支持工程师（通常由商业智能供应商提供）解决产品或服务内部的专业问题。熟悉`MicroStrategy`的支持功能。


    ### 其他

    组织在使用尖端分析之前，应确保建立基本的`BI`能力，这在产生价值之前需要一些关键先决条件。例如，商业智能活动是——如文中提供的。

