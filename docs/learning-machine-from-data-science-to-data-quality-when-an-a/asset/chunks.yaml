    # 第一章 — 机器学习简介


    机器学习是计算机所做的事情，而这对于人类来说是自然而然的从从中学习。机器学习算法利用计算程序直接从材料中“发现”信息，而不依赖于预先定义的方程模型。随着外部学习样本数量的增加，其功能会自适应地改进。教育也是一种机器学习。机器学习是人工智能（AI）的一个分支，它使系统在不需要显式自动编程的情况下，具备在专业知识方面进行学习和改进的能力。学习方法始于信息或观察（例如即时经验案例或教育），以便在未来做出更好的选择，并在数据中寻找模式。其意图是允许计算机在没有人类干预的情况下，适应行为并理解这些行为。


    许多人利用机器学习来改善高级生活。它包括专业领域的程序，也包括工业领域的程序。然而，什么是机器学习？它是人工智能的一个子集，专注于使用统计方法从数据库中提取信息以构建计算机系统。机器学习被应用于商业以及医学研究、图像处理、预测、分类、学习机构、回归等学科领域。机器学习是当今世界上最具影响力的技术之一。我们远未能看到它的全部潜力。毫无疑问，它在未来将继续成为头条新闻焦点。


    本指南旨在作为入门介绍，难度不会过大，涵盖了所有基本概念。我们大多数人并没有意识到，我们每刻都在与机器学习交互。当我们在 Google 上搜索某些东西、听一首歌曲甚至看一张照片时，机器学习都是其背后的引擎的一部分，从每次交互中不断学习和进步。它也是许多改变世界的改进背后的推动力，如自动驾驶汽车、生产新药和发现癌症。


    ## 机器学习的类型


    ### 监督机器学习

    “监督机器学习”被广泛应用于预测性大数据分析，因为它们能够评估并应用从迭代和交互中学到的教训到新的数据集中。这些学习算法能够根据提供的指令对所有当前事件进行标记，以高效地预报和预测未来事件。例如，机器可以被程序化为数据点标记为“R”（运行）、“N”（负面）或“P”（正向）。然后，机器学习算法按照程序设定对输入数据进行标记，并获得正确的输出数据。算法将其自身的生成结果与“预期或正确”的输出进行比较，识别潜在的修改并解决错误，使模型更准确、更智能。


    通过采用“回归”、“预测”、“分类”和“特征增强”等方法来正确训练学习算法，任何新的输入数据都可以作为“目标”数据集输入机器中，以按要求组装学习程序。这启动了分析，并推动学习算法创建“推断特征”，该特征可以根据未来事件的输出值生成预报和预测。例如，金融机构和银行严重依赖机器学习算法来跟踪信用卡欺诈，并预测潜在客户无法按时偿还贷款的概率。


    ### 无监督机器学习

    公司经常发现自己处于一种境地：无法获得生成标记和分类训练数据集所需的数据源。在这些情况下，使用无监督机器学习是理想的。“无监督学习算法”通常用于描述机器如何产生“推断特征”，以阐明数据栈中未标记和未分类组件的隐藏模式。这些算法可以探索数据，从而在海量数据中定义出结构。尽管无监督机器学习算法在探索输入数据和从中提炼见解方面与监督学习算法一样有效，但无监督算法无法识别正确的输出。这些算法可以用于定义离群值；产生定制的产品建议；以及使用“自组织映射”、“奇异值分解”和“k-means
    聚类”等技术对主题进行分类。例如，客户识别可以将客户划分为具有共同属性的组，并针对类似的营销策略和活动进行目标定位。


    ### 半监督机器学习

    “半监督机器学习算法”非常灵活，能够从“已标记”以及“未标记”或原始数据中学习。通常，训练数据集由大部分未标记数据组成，仅包含极小部分已标记数据。将“预测”、“回归”和“分类”等分析方法与半控学习相结合，允许计算机显著提高其在学习和训练中的准确性。当原始数据的处理和标记对公司而言资源消耗极高且性价比不高时，通常会使用这些算法。公司正在使用半监督学习系统来避免额外的人员和设备费用。例如，“脸识别”技术的应用需要分散在多个来源的海量数据。


    ### 强化学习

    此类算法执行活动并仔细记录每个动作的结果，要么作为失败结果的错误，要么作为优秀结果的奖励。区分强化学习算法的两个主要特征是“试错”分析技术和“延迟奖励”反馈循环。计算机使用各种计算持续分析输入数据并对每个正确或预期的输出发送强化信号，以最终优化结果。该算法创建了一个易的动作和奖励反馈回路，用于评估、记录和学习哪些活动是有效的，因为它在更短的时间跨内产生了正确或预期的输出。此类算法的使用使得系统能够确定最佳行为，并在特定语境下使其效率最大化。因此，在游戏、机器人和导航系统学科中，强化机器学习被大量利用。


    ## 机器学习的重要性

    对机器学习看似不可抑制的兴趣源于那些使得“数据挖掘”和“贝叶斯分析”比以往任何时候更常见的变量。导致这种受欢迎的根本因素是数据数量和多样性的增加、更廉价更有效的计算处理，以及廉价的数据存储。我们无法想象机器学习对我们日常生活的意义，数据驱动因素正影响着生活的方方面面。人工智能和机器学习技术是“第四次工业革命”的核心理念，旨在扩展人类能力并提高效率。这些因素意味着机器学习可以在更大规模上自动产生模型。公司通过构建机器学习模型可以轻松识别增长机会或规避未知风险。机器学习提供了解锁业务数据的魔力，通向可执行的措施和决策。


    机器学习在过去几年中证明了许多被认为只有人类才能完成的任务可以自动化，例如图像识别、文本处理和游戏。2014 年，人工智能和机器学习专业人士认为围棋游戏至少需要十年才能击败世界顶级棋手，但
    Google 的 DeepMind 证明他们是错误的，它展示了机器在围棋这种复杂的游戏中具有学习能力。在游戏领域，我们看到了更多创新，如来自 OpenAI
    团队的 Dota Bot。机器学习对我们的生活产生巨大的经济和社会影响。大量工作活动和整个行业可能被自动化，劳动力市场将被彻底改变。


    ## 重复学习自动化与信息发现

    与仅自动手动任务的机器人自动化不同，机器学习持续、可靠地执行高数量、海量和面向计算机的任务。人工智能机器学习算法使机器或系统能够学习、注意并减少之前的错误。机器学习算法作为分类器或预测工具，开发独特的能力。例如，一种机器学习算法创建了一个能够自学下棋甚至能根据消费者活动和行为数据创建产品建议的模型。该模型非常有效，因为它可以轻松适应任何新数据集。


