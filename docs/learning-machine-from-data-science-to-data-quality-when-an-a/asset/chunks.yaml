- fmt: '

    ### Limitations of Naïve Bayes


    * For a categorical variable with some category that hasn’t been observed in the
    data set, the model assigns a zero-probability making it unable to generate a
    prediction. This is called a “Zero Frequency.” The smoothing technique can be
    used to solve this problem. Laplace estimation can be employed to solve it.

    * Naïve Bayes is referred to as a bad estimator. Sometimes the outputs it gives
    are not taken seriously.

    * The Naïve Bayes also assumes the predictors are independent. In a real-life
    situation, it’s nearly impossible for us to get independent predictors.


    ## Applications of Naïve Bayes Algorithm


    The Naïve Bayes Classifier is applied in the following fields:


    #### Real-Time Prediction

    Naïve Bayes is a faster learning classifier. This makes it applicable in making
    real-time predictions.


    #### Multi-Class Prediction

    * The Naïve Bayes Classifier is known to be good in multi-class prediction. We
    can use it for the prediction of target variables of multiple classes.


    #### Text Classification / Sentiment Analysis / Spam Filtering

    When used for text classification, Naïve Bayes Algorithm models give a high accuracy
    compared to the other types of models. It is also used in spam filtering to identify
    spam emails and in sentiment analysis, for example, in social media to determine
    positive as well as negative customer comments.


    #### Recommendation Systems

    The Naïve Bayes Classifier together with Collaborative Filtering can be used to
    build a recommendation system that uses data mining and machine learning techniques
    for filtering any unseen information. It can also generate a prediction on whether
    a user will like or reject a resource.

