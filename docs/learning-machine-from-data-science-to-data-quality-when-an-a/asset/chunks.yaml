    # Chapter 4 — Neural Network Learning Models


    A widely used approach in machine learning, the employment of artificial neural
    networks is inspired by the brain system of humans. The objective of neural networks
    is to replicate how the human brain learns. The neural network system is an ensemble
    of input and output layers and a hidden layer that transforms the input layer
    into useful information to the output layer. Usually, several hidden layers are
    implemented in an artificial neural network. The figure below presents an example
    of a neural network system composed of 2 hidden layers: ![](rsrcRH.jpg)


    ## Example of an Artificial Neural Network


    Before going further and explaining how neural networks work, let’s first define
    what a neuron is. A neuron is simply a mathematical equation expressed as the
    sum of the weighted inputs. Let’s consider `X={x1 , x2 ,….xM }` a vector of `N`
    inputs, the neuron is a linear combination of all inputs defined as follows: `F(X={x1
    , x2 ,….xM })=w1 x1 +w2 x2 +….+wM xM` ; With `w1 , w2,…wM` is the weights assigned
    to each input. The function `F` can also be represented as: `F(X)=WX`, With `W`
    a weight matrix and `X` a vector of data. The second formulation is very convenient
    when programming a neural network model. The weights are determined during the
    training procedure. In fact, training an artificial neural network means finding
    the optimal weights `W` that provide the most accurate output. To each neuron,
    an activation function is applied the resulted weighted sum of inputs `X`. The
    role of the activation function is deciding whether the neuron should be activated
    or not according to the model’s prediction. This process is applied to each layer
    of the network.


    ## Components of Artificial Neural Networks


    ### Neurons

    The artificial neural network retained the biological resemblance of the brain
    in terms of receiving data through inputs, activation, processing, and delivering
    results using output functions. In computers, however, the information is usually
    external data, for example, images and files, which are then processed and provision
    of outputs through organizing and recognizing patterns in data. The neurons, therefore,
    play a significant role in providing a transition between the input and the output
    through the hidden layers.


    ### Connections and Weights

    Artificial neural networks have links that allow the transmission of information
    from one neuron to another. This henceforth facilitates the process of movement
    of data from the input to the hidden layers and the output. More so, each connection
    has its own weight assigned to it based on the importance of the neuron. In most
    cases, one neuron possesses several inputs and output connections with relatively
    varying weights. The pattern of relationship is usually referred to as its architecture,
    while the weight is determined in the form of algorithms, training, and learning
    processes involved in a given neural network.


    ### Propagation Function

    This is the function that calculates the input and output neuron as well as the
    predecessor neurons. The propagation function primarily facilitates the connections
    in relation to the weighted sum of the neural network at hand. In some cases,
    neurons may lack the capability of handling specific data, which are typically
    determined by these functions. The propagation function computes the relationship,
    effectiveness, and some complexity of data when transmitting from the input to
    the output with limited impact to the network.


    ## What Are the Types of Artificial Neural Networks?


    ![00007.jpeg](rsrcRJ.jpg)


    Several categories of artificial neural networks with different properties and
    complexities exist. The first and simplest neural network developed is the perceptron.
    The perceptron computes the sum of the inputs, applies an activation function,
    and provides the result to the output layer. Another old and simple approach is
    the feedforward neural network . This type of artificial neural network has only
    one single layer. It is a category that is fully connected to the following layer
    where each node is attached to the others. It propagates the information in one
    direction from the inputs to the outputs through the hidden layer. This process
    is known as the front propagated wave that usually uses what is called the activation
    function. This activation function processes the data in each node of the layers.
    This neural network returns a sum of weights by the inputs calculated according
    to the hidden layer’s activation function. The category of feedforward neural
    network usually uses the backpropagation method for the training process and the
    logistic function as an activation function.


    Several other neural networks are a derivation of this type of network. For example,
    the radial basis functions neural network. This is a feedforward neural network
    that depends on the radial basis function instead of the logistic function. This
    type of neural network has two layers, wherein the inner layer, the features,
    and radial basis functions are combined. The radial function computes the distance
    of each point to the relative center. This neural network is useful for continuous
    values to evaluate the distance from the target value. In contrast, the logistic
    function is used for mapping arbitrary binary values (i.e., 0 or 1; yes or no).


    Deep feedforward neural networks are a multilayer feedforward neural network.
    They became the most commonly used neural network types used in machine learning
    as they yield better results. A new type of learning called deep learning has
    emerged from this type of neural network.


    Recurrent neural networks are another category that uses a different type of nodes.
    However, outputs of the hidden layers are saved and processed back to the previous
    layer. Basically, the first layer, comprised of the input layer, is processed
    as the product of the sum of the weighted features. It actually uses memory, while
    the computation is running. In other words, information is processed in two directions,
    unlike the feedforward neural networks.


    A multilayer perceptron or multilayer neural network is a neural network that
    has at least three or more layers. This category of networks is fully connected,
    where every node is attached to all other nodes in the following layers.


    Convolutional neural networks are typically useful for image classification or
    recognition. The processing used by this type of artificial neural network is
    designed to deal with pixel data. The convolutional neural networks are a multi-layer
    network that is based on convolutions, which apply filters for neuron activation.
    When the same filter is applied to a neuron, it leads to an activation of the
    same feature and results in what is called a feature map. The feature map reflects
    the strength and importance of a feature of input data.


    Modular neural networks are formed from more than one connected neural network.
    These networks rely on the concept of ‘divide and conquer.’ They are handy for
    very complex problems because they allow combining different types of neural networks.
    Therefore, they allow combining the strengths of a different neural network to
    solve a complex problem where each neural network can handle a specific task.


    ## How to Train an Artificial Neural Network?


    As explained at the beginning, neural networks compute a weighted sum of inputs
    and apply an activation function at each layer. Then it provides the final result
    to the output layer. This procedure is commonly named as forward propagation.
    In order to train these artificial neural networks, weights need to be optimized
    to obtain the optimal weights that produce the most accurate outputs. The process
    of the training an artificial neural network is as follows:


    * Initialize the weights

    * Apply the forward propagation process

    * Evaluate the neural network performance

    * Apply the backward propagation process

    * Update the weights

