    # 第 4 章 — 神经网络学习模型


    机器学习中一种广泛使用的方法是人工神经网络，其灵感源于人类的大脑系统。神经网络的目标是模拟人类大脑的学习方式。神经网络系统由输入层、输出层以及一个隐藏层组成，隐藏层将输入层转换为有用信息并传递到输出层。通常，人工神经网络中会实现多个隐藏层。下图展示了一个由
    2 个隐藏层组成的神经网络系统示例：![](img/rsrcRH.jpg)


    ## 人工神经网络的示例


    在进一步探讨并解释神经网络如何工作之前，让我们先定义什么是神经元。神经元简单来说就是一个表示为加权输入之和的数学方程。假设 `X={x1 , x2 ,….xM
    }` 是一个包含 `N` 个输入的向量，则神经元是所有输入的线性组合，定义如下：`F(X={x1 , x2 ,….xM })=w1 x1 +w2 x2 +….+wM
    xM`；其中 `w1 , w2,…wM` 是分配给每个输入的权重。函数 `F` 也可以表示为：`F(X)=WX`，其中 `W` 是权重矩阵，`X` 是数据向量。第二种公式形式在编写神经网络模型时非常方便。权重是在训练过程中确。事实上，训练人工神经网络意味着找到能够提供最准确输出的最优权重
    `W`。对于每个神经元，对其加权输入之和 `X` 应用一个激活函数。激活函数的作用是根据模型的预测决定神经元是否应该激活。这一过程应用于神经网络的每一层。


    ## 人工神经网络的组件


    ### 神经元

    人工神经网络保留了大脑的生物学特性，即通过输入接收数据、通过激活进行处理并使用输出函数传递结果。然而，在计算机中，信息通常是外部数据（例如图像和文件），然后通过组织和识别数据中的模式进行处理并提供输出。因此，神经元在通过隐藏层提供输入与输出之间的转换方面起着重要作用。


    ### 连接与权重

    人工神经网络具有允许信息从一个神经元传输到另一个神经元的连接。这促进了数据从输入到隐藏层再到输出的移动。此外，每个连接都根据神经元的重要性分配了其自身的权重。在大多数情况下，一个神经元拥有多个输入和输出连接，权重相对变化。这种关系模式通常被称为其架构，而权重则以给定神经网络涉及的算法、训练和学习过程的形式确定。


    ### 传播函数

    这是计算输入神经元、输出神经元以及前驱神经元的函数。传播函数主要促进与当前神经网络加权和相关的连接。在某些情况下，神经元可能缺乏处理特定数据的能力，这通常由这些函数决定。传播函数在数据从输入传输到输出时计算数据的关系、有效性和某些复杂性，且对网络的影响有限。


    ## 人工神经网络有哪些类型？


    ![00007.jpeg](img/rsrcRJ.jpg)


    存在具有不同属性和复杂性的多种人工神经网络类别。开发的第一种最简单的神经网络是感知机。感知机计算输入之和，应用激活函数，并将结果提供给输出层。另一种旧而简单的方法是前馈神经网络。这种类型的人工神经网络只有一个层。它是一个与后续层全连接的类别，其中每个节点都与其他所有节点连接。它通过隐藏层从输入到输出单向地传播信息。这一过程被称为前向传播波，通常使用所谓的激活函数。该激活函数处理每层中每个节点的数据。该神经网络根据隐藏层的激活函数计算输入并返回权重之和。前馈神经网络类别通常使用反向传播法进行训练过程，并使用逻辑函数作为激活函数。


    其他几种神经网络都是这种类型网络的派生。例如，径向基函数神经网络。这是一种依赖于径向基函数而非逻辑函数的前馈神经网络。这种类型的神经网络有两个层，其中内部层、特征和径向基函数结合在一起。径向函数计算每个点到相对中心的距离。这种神经网络适用于连续值，用于评估与目标值的距离。相比之下，逻辑函数用于映射任意的二值值（即
    0 或 1；是或否）。


    深度前馈神经网络是多层前馈神经网络。它们成为机器学习中最常用的神经网络类型，因为它们能产生更好的结果。一种称为深度学习的新型学习类型从这种神经网络中脱颖而出。


    循环神经网络是另一类使用类型节点的网络。然而，隐藏层的输出会被保存并传回前一层处理。基本上，由输入层组成的第一层被处理为加权特征之和的乘积。它在计算运行时实际上使用了内存功能。换句话说，与前馈神经网络不同，信息是在两个方向上处理的。


    多层感知机或多层神经网络具有至少三层或更多层的神经网络。这类网络是全连接的，每个节点都与后续层中的所有其他节点连接。


    卷积神经网络通常用于图像分类或识别。这种类型人工神经网络使用的处理方法旨在处理像素数据。卷积神经网络是基于卷积的多层网络，卷积应用滤波器进行神经元激活。当相同的滤波器应用于神经元时，会导致相同特征的激活，并产生所谓的特征图。特征图反映了输入数据特征的强度和重要性。


    模块化神经网络由多个连接的神经网络组成。这些网络依赖于“分治法”的概念。它们对于非常复杂的问题非常有用，因为它们允许结合不同类型的神经网络。因此，它们允许结合不同神经网络的优点来解决特定问题的复杂问题。


    ## 如何训练人工神经网络？


    正如开头所示，神经网络计算输入的加权之和并在每层应用激活函数。然后将最终结果提供给输出层。这一过程通常称为正向传播。为了训练这些人工神经网络，需要优化权重以获得产生最准确输出的最优权重。训练人工神经网络的过程如下：


    * 初始化权重

    * 应用正向传播过程

    * 评估神经网络性能

    * 应用反向传播过程

    * 更新权重


