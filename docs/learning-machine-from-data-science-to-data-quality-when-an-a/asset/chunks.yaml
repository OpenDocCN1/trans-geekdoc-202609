    # 机器学习涉及的学科


    机器学习是一个使用多个学科概念的过程。这些学科中的每一个都能帮助程序员开发出用于机器学习的新方法，而这些概念共同构成了该主题的学科体系。


    ### 统计学

    统计学中的一个常见问题是假设检验以及识别数据遵循的概率分布。这允许统计学家预测未知数据集的参数。假设检验是机器学习中使用的统计学概念之一。另一个用于机器学习的统计学概念是利用样本值来预测函数值。此类问题的解决方案都是机器学习的实例，因为所涉及的问题使用了历史（过去）数据来预测未来事件。统计学是机器学习中至关重要的部分。


    ### 大脑建模

    神经网络与机器学习密切相关。科学家们建议，可以使用带有加权输入的非线性元素来创建神经网络。目前正在进行广泛的研究以评估这些元素的作用。


    ### 自适应控制理论

    自适应控制理论是该学科的一部分，涉及处理帮助系统适应此类变化并继续保持最佳性能的方法。其思想是，系统应该预判变化并据此进行修改。


    ### 心理学建模

    多年，心理学家一直试图理解人类的学习。`EPAM` 网络是一种常用于理解人类学习的方法。当为机器提供一个函数时，该网络被用于从数据库中存储和检索单词。近期，心理学研究受到了人工智能的影响。心理学的另一个方面，即强化学习，在近期也得到了广泛研究，这一概念也被用于机器学习。


    ### 人工智能

    如前所述，机器学习的很大一部分与人工智能学科有关。人工智能领域的研究侧重于利用类比来实现学习目的，以及过去的经验如何帮助预判和适应未来事件。近年来，研究重点转向了为使用归纳逻辑编程和决策树方法的系统设计规则。


    ### 演化模型

    演化论中的一个常见理论是，动物倾向于学习如何更好地适应周围环境以增强其性能。例如，早期人类开始使用弓箭来保护自己免受比他们更快、更强壮的捕食者的侵害。对于机器而言，学习和进化的概念可以是同义的。因此，用于解释进化的模型也可以用于设计机器学习技术。利用演化模型开发的的最著名的技术是`遗传算法`。


    ### 编程语言

    `R` 是一种估计拥有近 200 万用户的编程语言。自 1990 年诞生以来，这门语言迅速发展并变得非常流行。人们普遍认为 `R` 不仅是一种用于统计分析的编程语言，还可以用于多种功能。该工具不仅限于统计领域。它有许多特性使其成为一门强大的语言。编程语言
    `R` 可用于许多用途，特别是数据科学家，用它通过数据来分析和预测信息。开发 `R` 的背后的想法是让统计分析变得更简单。随着时间的推移，这门语言开始被应用于不同的领域。有许多人精通
    `R` 编码，尽管他们并不是统计学家。这种情况的出现是因为许多帮助执行数据处理、图形可视化和其他分析等许多的包正在被开发中。`R` 现在被应用于金融、遗传学、语言处理、生物学和市场研究等领域。


    #### Python

    `Python` 是一门拥有多种范式的语言。你可能会把 `Python` 想象成编码世界的“瑞士军刀”，因为这门语言支持结构化编程、面向对象编程、函数式编程和其他类型的编程。`Python`
    是世界上第二好的语言，因为它可以用于编写各行业的程序，并用于数据挖掘和网站建设。它的创建者 `Guido Van Possum` 决定将该语言命名为 `Python`，以自
    `Monty Python`。如果你使用一些内置包，你会发现代码或文档中存在 `Monty Python` 的一些草图。正是由于这些以及许多其他原因，`Python`
    是一门大多数程序员喜欢的语言，尽管工程师或那些具有科学背景的现任数据科学家可能会发现很难与之工作。`Python` 的简单性和可读性使其变得非常易理解。互联网上提供的众多库和包证明了不同领域的数据科学家已经编写了量身定制其需求的程序，并可供下载。由于
    `Python` 可以扩展以最适合不同程序的方式进行工作，数据科学家已开始使用它来分析数据。学习如何用 `Python` 编码是最好的，因为它将帮助你分析和解释数据，并识别出对业务最有效的解决方案。


    '
