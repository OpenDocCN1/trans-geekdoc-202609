    # Chapter 6 — Data Science Lifecycle and Technologies


    ## Data Science Lifecycle

    The data analyst is going to spend some time explaining what is going on because
    they are able to process the history that the data went through. On the other
    hand, the scientist of data is not only going to do exploratory analysis in order
    to figure out what insights are there, but they get the benefit of using some
    of the more advanced algorithms in machine learning in order to figure out how
    likely an event is going to happen in the future.


    The data scientist is going to have a fun job at this. They are going to specifically
    take the time to look at the data from a lot of different angles, and some of
    these angles may be brand new, and ones that no one had considered in the past.
    So, to keep it simple, data science is going to be used to help us make some predictions
    and decisions through a lot of different methods. And one of these methods is
    going to be through machine learning.


    ## The Lifecycle of Data Science

    Knowing what this is and how it works is going to make a big difference in the
    amount of success that you are able to get with this field, and it will help you
    to get the best results possible out of the process. Some of the steps that come
    with the data science lifecycle include:


    ### Discovery

    The first step that we need to explore is going to be the discovery. Before you
    begin any kind of project in this field, you will need to know the different properties,
    the requirements, the specifications, and the required budget. Otherwise, it is
    hard to know where you need to get started. Once you have a bit of this information
    in place, you will be able to do an assessment of the people, time, data, support,
    and technology to figure out if the project is something that you will be able
    to do. If you are short on any of those aspects, then it may be time to evaluate
    whether or not you would be able to do without them or get them before you start.


    For this stage, you are going to need to take some time to do some research. You
    need to have a full understanding of the project you would like to do, and you
    need to know if you have the right resources to get all of it done. And if it
    is needed and the project is something that is necessary and you want to do it
    but without the right resources, you need to figure out what you can do to change
    this around.


    Another thing that you are going to need to focus on when you are working in this
    stage is that you will need to frame the business problem that you want to fix
    and make better, while also formalizing that initiation hypothesis that you would
    like to be able to test.


    ### Data Preparation

    When you are done with the steps above, it is time to move on to the second stage.
    In this one, you are going to need some analysis to see results. You want to have
    a kind of analytical sandbox in order to perform the right analytics for the whole
    time that you are working on the project. You will need to explore, take some
    time to preprocess, and condition the data before you do the modeling.


    Once you are done with some of those steps, it is time to go take this a bit further.
    You will need to do something known as `ETLT`. This stands for extract, transform,
    load, and transform. This allows you to get the data that you want into the sandbox
    so that you can do some of the experiments that you would like to do. This is
    a great time for you to get the data all set up and ready to use. If you don’t
    take the time to process through the data that you have in the proper manner,
    then it is going to be almost impossible for you to get the right algorithm, or
    to even be able to use it in the proper way either. Once you have been able to
    clean out the data and prepare it a bit, you can then go through and do what is
    known as exploratory analytics on it to learn more.


    ### Model Planning

    Once you have been able to clean and prepare any of the data that you would like
    to use in your models, it is time to actually plan out the models. In this third
    step, you are going to take some time to determine the proper techniques and models
    that you want to use in order to draw a good relationship between the variables.
    You will find, and we will talk about, a lot of different models that you can
    work with in order to see some separation and understanding of the data, but you
    need to pick the one that is right for you.


    These relationships are important to find and define in the proper manner. These
    are basically going to set up the base that you need for any algorithm that you
    want to implement. You will then be able to apply the `EDA` or the `Exploratory
    Data Analytics` using a lot of different visualization tools and even statistical
    formulas, based on your own needs.


    There are a lot of different tools that you are able to choose to use for this,
    but `R` is going to be the one that is used the most. Once you have a bit of an
    insight into the nature of your data, and you have taken that information to pick
    out the algorithm that you would like to use, it is the time to move on to stage
    four, where we are going to apply that chosen algorithm and built up a model to
    help us out.


    ### Model Building

    When we get to this phase, you will need to develop some sets of training and
    testing the data that you have. You first need to take a look at some of the tools
    that you already have and then decide if they are going to be enough for running
    the model that you want, or if you need an environment that is more robust. Depending
    on the kind of algorithm that you want to use, you may need to pick out something
    that is faster and needs to work with parallel processing instead.


    When you are building up the model that you would like to use, remember that you
    are going to be using a lot of different techniques. Even though we spend a lot
    of different techniques, you may use things like `classification`, `clustering`,
    and `association`.


    ### Operationalize

    Now, we need to move on to the fifth phase. In this one, you are going to have
    some time to create and get your data organized and ready to use. When you get
    to this phase, you will be able to deliver technical documents, briefings, and
    final reports. In addition to the things above, you should be able to work in
    a real-time environment. This is a great time because you are able to get a clear
    picture of how the algorithms performed.


    ### Communicate the Results

    After you have had the time to present your findings and maybe deploy the model
    on a small scale, it is time to communicate whether this was able to achieve its
    goals. It is important for everyone to come together and really evaluate if they
    achieved the goals set early on. This means that again you need to do some analysis
    of what you did. In this last phase, you will need to identify the key findings
    that showed up, spend some time communicating how you came to those results with
    the stakeholders, and then determine whether the results that you saw in the project
    were a failure or a success based on the goals that you wanted in the beginning.


    Everyone needs to come together during this phase and determine whether or not
    the results were what they thought. If they were completely off and no one is
    happy with them, then it is time to move on and try out something instead. If
    it worked out, but some things were missing, it is time to see what adjustments
    can come into play to make it a bit better. If the model worked the way that you
    want and there doesn’t seem to be any glitches or issues that you need to fix
    up with it, it is time to start making the goals that are needed in order to implement
    it throughout the whole business. This should be an exciting time because you
    have already seen the results that come with it working on a trial run. It is
    time to let it go free and see what results you are able to get overall.

