    # 第二章 — 机器学习的优势


    由于任务量巨大且规模大，在某些情况下，工程师或开发者无论如何努力都无法成功；在这些情况下，机器相对于人类的优势是显而易见的。


    ### 识别模式

    当工程师向带有人工智能的机器提供训练数据集时，它将学习如何识别数据中的模式，并对工程师提供的任何其他类似输入产生结果。这种效率远超普通的分析师。由于机器学习与数据科学（即对海量数据处理并挖掘底层变量之间关系的过程）之间存在紧密的联系，通过机器学习，可以从海量数据中推导出重要的见解。


    ### 提高效率

    人类在设计某些机器时，可能并未充分理解其能力，因为他们可能不知道计算机或机器运行的各种情况。通过机器学习和人工智能，机器将学会适应环境的变化并提高其自身的效率，无论其周围环境如何变化。


    ### 完成特定任务

    程序员通常会开发一种机器来完成某些任务，其中大多数任务涉及复杂且艰巨的程序，程序员在其中可能会出现疏漏错误。他或她可能会忘记本该包含在程序中的某些步骤或细节。一个能够自主学习的人工智能机器就不会面临这些挑战，因为它会自己学习这些任务和流程。


    ### 帮助机器适应变化的环境

    随着技术的不断演进以及用于交流这些技术进步的新编程语言的开发，几乎不可能将所有现有程序和系统转换为这些新语法。从编码阶段开始重新设计每个程序以适应技术进步是事得其反的。在这些时候，使用机器学习是非常高效的，这样它们就可以独立地升级并适应不断变化的技术气候。


    ### 帮助机器处理大型数据集

    机器学习带来了在不确定条件下同时处理多个维度和多种类型数据的能力。具有自主学习能力的人工智能机器可以在动态环境中运行，强调了资源的有效利用。机器学习已帮助开发出各种工具，在小型和较大的流程环境中提供持续的质量改进。


    ## 机器学习的劣势

    获取用于训练机器的数据是困难的。工程师必须知道想用哪种算法来训练它，只有这样他才能识别出需要使用的数据集。如果工程师没有做出正确的决策，可能会对获得的结果产生重大影响。


    * 很难准确解释结果以确定机器学习算法的有效性。

    * 工程师在选择一种算法来训练机器之前，必须对不同的算法进行实验。

    * 超越机器学习的技术正在研究中；因此，机器不断学习和转型以适应新技术是非常重要的。


    '
- fmt: '

    # Subjects Involved in Machine Learning


    Machine learning is a process that uses concepts from multiple subjects. Each
    of these subjects helps a programmer develop a new method that can be used in
    machine learning, and all these concepts together form the discipline of the topic.


    ### Statistics

    A common problem in statistics is testing a hypothesis and identifying the probability
    distribution that the data follows. This allows the statistician to predict the
    parameters for an unknown data set. Hypothesis testing is one of the many concepts
    of statistics that are used in machine learning. Another concept of statistics
    that’s used in machine learning is predicting the value of a function using its
    sample values. The solutions to such problems are instances of machine learning
    since the problems in question use historical (past) data to predict future events.
    Statistics is a crucial part of machine learning.


    ### Brain Modeling

    Neural networks are closely related to machine learning. Scientists have suggested
    that nonlinear elements with weighted inputs can be used to create a neural network.
    Extensive studies are being conducted to assess these elements.


    ### Adaptive Control Theory

    Adaptive control theory is a part of this subject that deals with methods that
    help the system adapt to such changes and continue to perform optimally. The idea
    is that a system should anticipate the changes and modify itself accordingly.


    ### Psychological Modeling

    For years, psychologists have tried to understand human learning. The `EPAM` network
    is a method that’s commonly used to understand human learning. This network is
    utilized to store and retrieve words from a database when the machine is provided
    with a function. In recent times, research in psychology has been influenced by
    artificial intelligence. Another aspect of psychology, called reinforcement learning
    has been extensively studied in recent times, and this concept is also used in
    machine learning.


    ### Artificial Intelligence

    As mentioned earlier, a large part of machine learning is concerned with the subject
    of artificial intelligence. Studies in artificial intelligence have focused on
    the use of analogies for learning purposes and on how past experiences can help
    in anticipating and accommodating future events. In recent years, studies have
    focused on devising rules for systems that use the concepts of inductive logic
    programming and decision tree methods.


    ### Evolutionary Models

    A common theory in evolution is that animals prefer to learn how to better adapt
    to their surroundings to enhance their performance. For example, early humans
    started to use the bow and arrow to protect themselves from predators that were
    faster and stronger than them. As far as machines are concerned, the concepts
    of learning and evolution can be synonymous with each other. Therefore, models
    used to explain evolution can also be utilized to devise machine learning techniques.
    The most prominent technique that has been developed using evolutionary models
    is the `genetic algorithm`.


    ### Programming Languages

    `R` is a programming language that is estimated to have close to 2 million users.
    This language has grown rapidly to become very popular since its inception in
    1990. It is a common belief that `R` is not only a programming language for statistical
    analysis but can also be used for multiple functions. This tool is not limited
    to only the statistical domain. There are many features that make it a powerful
    language. The programming language `R` is one that can be used for many purposes,
    especially by data scientists, to analyze and predict information through data.
    The idea behind developing `R` was to make statistical analysis easier. As time
    passed, the language began to be used in different domains. There are many people
    who are adept at coding in `R`, although they are not statisticians. This situation
    has arisen since many packages are being developed that help to perform functions
    like data processing, graphic visualization, and other analyses. `R` is now used
    in the spheres of finance, genetics, language processing, biology, and market
    research.


    #### Python

    `Python` is a language that has multiple paradigms. You can probably think of
    `Python` as a Swiss Army knife in the world of coding since this language supports
    structured programming, object-oriented programming, functional programming, and
    other types of programming. `Python` is the second-best language in the world
    since it can be used to write programs in every industry and for data mining and
    website construction. The creator, `Guido Van Possum`, decided to name the language
    `Python`, after `Monty Python`. If you were to use some inbuilt packages, you
    would find that there are some sketches of the `Monty Python` in the code or documentation.
    It is for this reason and many others that `Python` is a language that most programmers
    love, though engineers or those with a scientific background who are now data
    scientists would find it difficult to work with. `Python`s simplicity and readability
    make it quite easy to understand. The numerous libraries and packages available
    on the internet demonstrate that data scientists in different sectors have written
    programs that are tailored to their needs and are available to download. Since
    `Python` can be extended to work best for different programs, data scientists
    have begun to use it to analyze data. It is best to learn how to code in `Python`
    since it will help you analyze and interpret data and identify solutions that
    will work best for business.

