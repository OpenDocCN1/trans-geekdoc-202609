    # Chapter 2 — Advantages of Machine Learning


    Due to the sheer volume and magnitude of the tasks, there are some instances where
    an engineer or developer cannot succeed, no matter how hard they try; in those
    cases, the advantages of machines over humans are clearly stark.


    ### Identifies Patterns

    When the engineer feeds a machine with artificial intelligence a training data
    set, it will then learn how to identify patterns within the data and produce results
    for any other similar inputs that the engineer provides the machine with. This
    is efficiency far beyond that of a normal analyst. Due to the strong connection
    between machine learning and data science (which is the process of crunching large
    volumes of data and unearthing relationships between the underlying variables),
    through machine learning, one can derive important insights into large volumes
    of data.


    ### Improves Efficiency

    Humans might have designed certain machines without a complete appreciation for
    their capabilities, since they may be unaware of the different situations in which
    a computer or machine will work. Through machine learning and artificial intelligence,
    a machine will learn to adapt to environmental changes and improve its own efficiency,
    regardless of its surroundings.


    ### Completes Specific Tasks

    A programmer will usually develop a machine to complete certain tasks, most of
    which involving an elaborate and arduous program where there is scope for the
    programmer to make errors of omission. He or she might forget about a few steps
    or details that they should have included in the program. An artificially intelligent
    machine that can learn on its own would not face these challenges, as it would
    learn the tasks and processes on its own.


    ### Helps Machines Adapt to the Changing Environment

    With ever-changing technology and the development of new programming languages
    to communicate these technological advancements, it is nearly impossible to convert
    all existing programs and systems into these new syntaxes. Redesigning every program
    from its coding stage to adapt to technological advancements is counterproductive.
    At such times, it is highly efficient to use machine learning so that they can
    upgrade and adapt to the changing technological climate all on their own.


    ### Helps Machines Handle Large Data Sets

    Machine learning brings with it the capability to handle multiple dimensions and
    varieties of data simultaneously and in uncertain conditions. An artificially
    intelligent machine with abilities to learn on its own can function in dynamic
    environments, emphasizing the efficient use of resources. Machine learning has
    helped to develop tools that provide continuous improvements in quality in small
    and larger process environments.


    ## Disadvantages of Machine Learning

    It is difficult to acquire data to train the machine. The engineer must know what
    algorithm he or she wants to use to train it, and only then can he or she identify
    the data set they will need to use to do so. There can be a significant impact
    on the results obtained if the engineer does not make the right decision.


    * It’s difficult to interpret the results accurately to determine the effectiveness
    of the machine-learning algorithm.

    * The engineer must experiment with different algorithms before he or she chooses
    one to train the machine with.

    * Technology that surpasses machine learning is being researched; therefore, it
    is important for machines to constantly learn and transform to adapt to new technology.

    '
