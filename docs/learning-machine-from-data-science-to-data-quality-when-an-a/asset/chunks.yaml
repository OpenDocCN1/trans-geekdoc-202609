    # 学习机器


    ## 目录

    - 简介

    - 第 1 章 — 机器学习简介

    - 第 2 章 — 机器学习的优势

    - 第 3 章 — 机器学习算法

    - 第 4 章 — 神经网络学习模型

    - 第 5 章 — 深度学习需要了解的

    - 第 6 章 — 数据科学周期与技术

    - 第 7 章 — 商业智能

    - 第 8 章 — 数据挖掘

    - 第 9 章 — 机器学习及其与数据科学结合

    - 第 10 章 — 机器学习与业务

    - 结论


    ## 简介

    你可能对机器学习是什么有了很清楚的了解，但也许你听到的解释只是有点模糊。你知道它是人工智能的核心组件，但即使是这个定义也有些含不清。要理解这个概念可能非常困难。理解机器学习的基础深实植根于我们自身的生物学，这会有帮助。长期以来，我们一直把人脑视为唯一能够从复杂数据中学习并处理信息的产物。现在，我们被告诉，无生命物体也可以通过这种创新学习并改变其行为。这样想确实令人不可思议。然而，有一个充分的理由说明这不仅是可能的，而且已经成为我们今天生活和经营业务的主要部分。


    ### 它是什么？

    用最简单的话来说，机器学习是计算机编程的艺术，它允许计算机学习并自动调整其功能，以完善它们完成任务的能力。具有机器学习能力的计算机实际上可以根据自己的经验来提高性能，而不需要显式程序告诉它们具体要做什么。这种学习过程实际上始于程序观察收集的数据并将其与之前的数据进行比较，以找到模式和结果，并据此进行调整。这一切都是通过复杂的神经网络和算法系统共同工作完成的，产生所需的结果。本质上，这意味着计算机开始慢慢学习像人类一样思考，从经验中学习并通过改变来改进它们获得的结果。它现在是简化必须完成的工作的最有效手段之一。通过减少为机器可以执行的每种可能的功能编写程序的需求，它允许机器学会如何以更快、更高效的方式完成这些工作。


    如果你不完全确定它是如何工作的，让我们来看一个例子。假设你需要创建一个程序，要求计算机过滤掉某些类型的数据。在传统的编程方法中，你必须：

    1) 让人类检查你想要消除的数据，然后列出不需要的数据可能出现的方式清单，并识别出可能出现的特定模式。

    2) 然后，人类必须编写一个特定的算法来教计算机具体要寻找什么。

    3) 接着，人类必须开发一个软件程序，能够识别这些模式和其他细节并对其进行相应的标记。

    4) 测试程序并发现任何可能在寻找不需要的数据时产生问题的异常，然后返回第一步反复重复该过程，直到程序真正完善。


    即使有了这些非常基本的步骤列表，你也只能让计算机完成一项任务，并且对于你可能需要计算机执行的任何其他任务，都必须重复该过程。为了完成所有这些任务，你必须遵守大量的规则才能使其正常运行。这使得你的编程工作容易出现错误并干扰整个过程。然而，如果你选择使用机器学习来完成相同的事情，该过程将完成得得多，而且产生错误的风险更小。


    此外，一旦使用传统方法更新了程序，程序设计者永远无法觉得工作已经完成。他（或她）必须经常回来并定期对其进行更新，以确保它与当时使用的最新技术兼容。这必须反复进行，直到被另一个程序完全取代。机器学习是一种技术，一旦上传，它就会运行。它会自动告知何时需要进行更新，甚至可以接入系统并获取自己的更新，释放人类去处理其他事情。机器学习使得以最少的人类干预解决最复杂的问题成为可能。取决于你使用的机器学习类型，一旦它在系统中上线并激活，只要保持这种状态，机器就可以继续进行自己的调整并识别自己的失败和成功。在今天的计算机编程中使用机器学习有很多优势，但无疑未来将会有更多新方法来使用它。现在，它主要用于：


    * 解决涉及长规则列表的问题

    * 解决没有明显解决方案的非常复杂的问题

    * 适应非稳定环境中的新数据


    随着越来越多的人意识到机器学习是多么伟大，它可能会被用于成百上千种其他用途。随着时间的推移，它被应用到存在的每一个行业是可行的，并在某点甚至可能被用于创建新的行业。

