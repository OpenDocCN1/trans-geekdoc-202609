    # 第 10 章 — 机器学习与商业


    商业领域的机器学习也有助于提高业务的可扩展性，并提升了全球范围内不同公司的运营能力。人工智能工具和机器学习算法旨在对大数据进行操作，并在无需人工干预的情况下进行学习。组织和企业可以从理解“在系统中实施机器学习算法的必要性”中获益。


    ## 机器学习对商业世界的意义


    机器学习允许企业通过有效分析大数据、用户趋势和市场场景来实现增长和繁荣。由于算法能够从原始数据中提取有意义的见解，以解决复杂且数据丰富的业务问题，算法具有从数据中进行迭代学习的能力，计算机可以在没有显式编程的情况下发现不同类别的隐藏见解。


    机器学习模型和算法在商业分析社区已变得非常流行，以考虑数据量不断增长等因素。随着数据水平的提高，公司现在利用机器学习和人工智能模型来管理运营和日常任务，而无需定期更新系统；由于机器学习算法设计为通过经验进行学习，大数据可以被有效处理。金融、经济、教育、交通、医疗和医学行业现在已使用最新的机器学习模型更新了系统，以实现流程自动化获得准确的结果。


    ## 机器学习的影响


    机器学习彻底改变了我们日常生活中使用的系统的操作和性能。从自动化到准确预测，人工智能和机器学习模型可以在无需人工干预的情况下执行特定任务。由于机器被编程为独立运行，各行业的系统操作和功能现在已经发生了完全改变。


    我们注意到，对人力的需求每天都在减少，这是一个需要考虑的大问题。虽然机器学习在日常生活中具有惊人的益处，但它也影响了数千人的工作。通过实施编程为独立工作和学习的自动化机器，对人力资源的需求在很大程度上被消除了。另一方面，在新的系统上建立机器学习和人工智能模型的成本较高，但从长远来看，它确实为行业带来了更多益处。


    每项技术都有其优缺点，机器学习和人工智能技术也不例外。由于系统中不断增加的数据，对机器学习工程师的需求非常迫切。人工智能无处不在，我们可能在不知不觉的情况下在使用它。机器学习在计算机和软件中进行建模，是因为设备可以通过认知进行工作，其工作方式与人类大脑相同。今天，公司专注于机器学习，以改进业务决策并提高生产力。随着技术的呈指数级增长，我们需要更好的工具来分析和理解收到的数据，并为未来几年不断增加的数据或大数据做好系统准备。


    ## 考虑与启示


    机器行使的智能水平被称为道德成分，它是接收到的数据的直接结果。根据输入数据，机器可以训练自己朝着某个方向工作，甚至违背某些人的利益。科学家和研究人员仍然无法从机器学习算法中消除偏见，这些算法可能会产生不适合政治正确社会的结果。此外，研究人员、专家和科学家认为人工智能对社会是有害的，因为它会被开发反映人类大脑及其所有偏见。


    风险评估的准确性是机器学习算法的另一个重要方面。风险评估用于衡量和评估特定场景中可能涉及的风险，允许人工智能代表人类做出重要决策可以增加人与机器之间的信任。倡导者在应用人工智能时建立透明度，创建一个不受具有操纵数据的单一权威管理的共享数据库。算法透明度也将有助于用户与机器之间建立高水平的信任。


    ## 与机器学习相关的风险


    虽然机器学习模型非常准确并能做出准确预测，但与智能机器相关的风险可能会给人类带来负面结果。机器可以超越最高智能水平，并在心理上操纵人类并对人类产生破坏性。通常，人们无法将人工智能的目标与人类价值观对齐，允许机器做出人类无法实现的决策。


    对大量无关的大数据执行多次操作的机器所发现的关联和模式最好是无意义的，最坏是错误的。从长远来看，机器甚至会在错误的输入上进行自我训练，教会它们做出做出不符合人类利益的决策。机器学习的风险是真实的，如果管理不当，可能会非常危险。


    数据、设计和输出是与风险直接相关的机器学习三个主要类别。偏见、数据、缺乏模型可变性以及输出解释是机器学习运行过程中可能产生风险。在学习和做出预测时，机器学习模型可能会产生偏见并做出不准确的预测。由于它主要取决于数据输入，数据不足或数据错误也会给建模过程带来巨大风险。此外，如果模型没有经过适当的训练，缺乏模型可变性和输出解释也可能对人类构造成巨大风险。


    ## 预防机器学习中的偏见


    自我纠正是人工智能行业关注的重点，研究人员正在寻找新方法来增强基于规则的人工系统的伦理并减少偏见。考虑到人类偏见，人工智能在几个重要的伦理方面需要努力。以下是设计机器学习和人工智能模型时避免偏见的一些最佳方法：


    -   选择正确的学习模型：并非所有人工智能模型都适用于每个任务。由于每个问题都需要特定的解决方案并需要不同的数据源，因此没有经过证明的避免偏见的方法。为了解决这个问题，机器学习模型的设计必须具有与部署系统的行业最匹配的参数。此外，提前通知开发团队可以帮助公司和行业使用最合适的机器学习模型。


    监督学习和无监督机器学习模型有各自的优缺点。监督模型对数据选择中的偏见提供了更强的控制，而执行降维的无监督模型有能力从其数据集中消除偏见。数据科学家必须针对特定情况识别并展示最佳模型，以便实施有效的策略以获得长期利益。


    '
- fmt: '

    ### Choose the training data set


    Artificial intelligence and machine learning models learn from the data input.
    Thus, to obtain accurate and secure predictions, data scientists are required
    to provide the AI models with data of different types and exclude any vulnerabilities.
    Training algorithms are done to avoid bias in data selection, for which we need
    to ensure that training data is diverse. If there is insufficient data for a group,
    the weighting approach can be used to increase effectiveness on training, but
    this should be done with extreme care.


    ### Monitor performance through real data


    Discriminatory models usually operate in controlled environments, and no company
    consciously creates biased artificial intelligence models. Unfortunately, test
    groups are used to check algorithms that are already in production and that pose
    future problems. Using statistical methods instead of real data is a better approach
    for monitoring performance through real data, because when looking for equality,
    we need to examine data for equality of outcome and equal opportunities.


    While it is difficult to prove the equality of opportunity, testing and monitoring
    machine learning models in the real world can certainly help researchers develop
    highly accurate models and algorithms. For self-learning systems, using biased
    data to feed the models can sometimes lead to unintended and dangerous results.

    '
