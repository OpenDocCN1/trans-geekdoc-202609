    # 第 8 章 — 数据挖掘


    数据挖掘是机器学习技术中的一个热门领域。该概念最早产生于 20 世纪 90 年代。从广义角度来看，数据挖掘的思想已被称为大数据或数据科学。该概念的定义取决于具体的应用场景和范围。


    ![00081.jpeg](img/rsrcRM.jpg)


    得益于计算机网络技术的进步，数据现在可以有效且廉价地存储。此外，由于电子资源的可用性，数据传输也得到了增强。这些原因以及许多其他因素促成了数据挖掘技术的普及。因此，许多组织能够在数据库中存储海量数据，而无需担心丢失敏感信息。


    在数据库中存储海量数据的能力是非常棒的。然而，了解如何分析和解释手头的数据集也至关重要。如果我们拥有大量无法解释且无法从中得出有意义信息的数据，那么这些数据等同于完全没有数据。这引出了一个如何分析存储在各种数据库中的数据的问题。


    传统的数据分析方法包括手工分析过程。然而，传统方法被证明是耗时且枯燥的，而且结果可能无法反映准确的情况。传统方法忽略了数据集中的关键信息，导致分析过程出现偏差。此外，海量数据集的出现使得传统技术变得过时且不实际。


    为了缓解这些问题，人们设计了自动化方法来帮助分类数据并提取可能的有用信息、趋势和模式。这就是数据挖掘方法和技术大显身手的领域。简单来说，数据挖掘过程旨在解释事件的结果、预测未来的结果并帮助理解复杂数据。数据挖掘科学已被用于描述某些现象，例如船只为何沉没或飞机为何坠毁。在飞机中，数据挖掘通过黑匣子完成，黑匣子与每次飞行的数据集和信息相结合。通过这种方式，很容易判断导致坠毁的情况。与其他预测结果的机器学习方法不同，数据挖掘技术是根据事实而非直觉来预言可能的结果。


    ## 数据分析流程


    为了实现高效的数据挖掘，必须遵循被称为“数据库中的知识发现”（KDD）的七个步骤。下面展示了数据库中知识发现的七个阶段：


    1. **数据清洗**：这是分析数据的的第一步。在此阶段，通过对数据进行清洗以消除噪声和其他可能阻碍适当分析的波动。

    2. **数据集成**：数据清洗后的第二步是数据集成。这一过程涉及将来自不同来源的数据进行链接、融合和整合，以准备待分析的数据。例如，如果信息存储在不同的数据库中，则通过集成将数据汇总到一个数据库中。

    3. **数据选择**：在数据汇总到单个文件后，选择相关的数据集进行分析。这一过程被称为数据选择。

    4. **数据转换**：在完成上述所有步骤后，数据现在已准备转换为适合的格式。进行转换是为了便于分析。例如，某些数据挖掘技术可能要求对所有算术值进行标准化。

    5. **数据挖掘**：这一步涉及应用数据挖掘算法来分析数据，并从分析的数据集中提取有意义的模式和信息。

    6. **提取的模式和知识的评估**：数据挖掘的这一步涉及对从分析数据中得到的模式和信息进行研究和评估。结果的审查可以基于主观或客观的角度。

    7. **数据可视化**：数据挖掘过程的最后一步是对分析数据中提取出的信息进行概念化。这一步是我们尝试理解结果的时候。


    必须知道，上述步骤可能会根据所使用的技术和算法而异。例如，某些数据挖掘算法可能会并发或连续执行这些步骤。


    ## 数据挖掘在相关领域的应用


    在数据分析至关重要的各个行业和领域，可以使用多种数据挖掘算法。以下列出了其中一些应用：


    * 欺诈检测

    * 股票估值预测

    * 分析客户的购买模式


    从广义上说，数据挖掘技术的选择是基于以下指标的：


    * 要分析的数据类型

    * 所需从数据集中提取信息的形式。

    * 提取知识的应用（即如何使用这些信息）。


