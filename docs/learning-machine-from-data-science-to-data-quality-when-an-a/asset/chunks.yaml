    # 数据挖掘与其他研究领域的关系


    数据挖掘是一项跨学科的研究领域，它与机器学习、计算机科学、软计算等不同领域存在交叉和对应关系。数据挖掘与这些领域之间的关系体现了补充人工智能的基本概念。这一观点认为，人工智能中的每个子领域和方向相互互补，并以相互依赖且独立的方式工作。


    ## 数据挖掘与统计学

    数据挖掘与统计学之间存在显著差异。然而，这两个研究领域有许多共同组件和概念。过去，描述性统计侧重于使用指标对数据进行标记，而推断统计学则更注重理论分析，以从数据中得出显著的推断或生成原型。相反，数据挖掘技术更关注研究的结果，而不是算术含义。只要最大程度地满足可行性和精度等给定指标，许多数据挖掘方法并不关注算术测试或内涵。此外，数据挖掘通常集中于对数据集的自动化分析，在大多数情况下，通过可以扩展到海量数据的机器来实现。范围上的接近性是由数学家实现的，他们有时将统计学中的数据挖掘称为“统计学习”。


    ## 主要数据挖掘软件

    为了成功执行数据挖掘过程，有一些可用的软件和算法计算机程序。软件在模型和用途上有所不同。某些软件是通用实现工具，提供各种类型的算法，另一些软件更具针对性。需要注意的是，某些软件是为了商业目的开发的，而另一些则免费访问和配置（开源）。各种软件可以对多种数据类型进行数据挖掘。数据挖掘软件和算法专门开发用于处理不同类型的数据。下面，我总结了经常遇到的无数种数据示例，这些数据可以使用数据挖掘方法进行分析。


    - **关系型数据库**：关系型数据库是机构和公司中最常见的经典类型数据库。在这种形式下，数据以表格的形式进行分类结构化处理。传统方法（如 `SQL`）用于在尝试从数据库中查找更快信息时查询数据库。然而，数据挖掘能够发现数据库内部复杂的复杂的模式。

    - **客户交易数据库**：另一种常用的数据库类型是客户交易数据库。这种类型主要用于零售店。该数据库由客户进行的所有交易组成。研究该数据库对于理解买卖模式至关重要。它允许零售商理解市场变化，从而帮助规划销售和营销策略。

    - **时间数据**：另一种常见的数据形式是时间数据。普通类型考虑数据中的时间维度。在这里，排列出现在许多领域中，例如客户购买的一系列物品、纯素食者人群的链等。时间数据被进一步划分为时间序列。该序列是算术值的系统列表，例如股市中的股票价格。

    - **空间数据**：另一组可以易于分析的数据是空间数据。这种类型的数据由聚合信息组成，如环境数据、森林数据以及关于铁路线路和空气分布通道等子结构的数据。

    - **时空数据**：这是一种兼具空间数据和时间数据特征的数据。例如，数据可以是关于气候条件、人群中野兽的移动等等。

    - **文本数据**：文本类型的数据已成为数据挖掘中一个广泛研究的领域。尽管文本数据大多是无形的，但其应用仍在扩展。文本文档大多是无序的，且缺乏固定的形式。文本数据的示例包括情感分析和作品归识别（预测给定文本的作者）。

    - **网络数据**：这是一种源自网站的数据类型。数据主要是一组文档，例如带有附件链接的网页期刊。这些集合被绑定形成一个图结构。互联网上某些特定的数据挖掘活动示例包括预测网站上可能的下一个页面、根据主题自动对网页分组，以及评估在每个网页上花费的时间。

    - **图数据**：图也是另一种类型的数据库。图出现在社交网络中（例如 Facebook 朋友列表）和化学中（例如生物化学分子和原子的图）。

    - **杂乱数据**：不同或混合类型的数据是许多类数据的集合。这些类别相互关联，并可以排序成特定的排列。

    - **数据流**：数据流被认为是连续且高速的理论上无限的数据流。例如，数据流可以是生态数据、摄像头数据或数字电视数据。这种类型数据的局限性是无法充分存储在计算机中。因此，应该使用合适的数据挖掘方法对数据进行评估。流数据中的日常数据挖掘任务通常是检测变化和趋势。


    ## 数据中的模式

    如所述，数据挖掘的目标是从数据中挖掘出理想的信息模式。从数据中可以提取的主要设计类型如下（注意此列表并非最终产品）：


    ### 聚类

    用于聚类的算法始终适用于数据集被预期分类成相似实例的组（聚类）的情况。这些算法的主要目标是压缩数据，以便于理解和做出推断。类似于 `K-Means` 的聚类操作模式可以用于自动对表现相似的学生进行分组。


    ### 分类模型

    用于分类任务的算法旨在提取模型，这些模型可将对象和新实例分到类别中。例如，如 `Naïve Bayes`、`decision trees` 和 `neural
    networks` 等分类算法可以创建能够预测客户行为趋势或学生通过考试可能的设计。这些模型也可以被提取出来执行对未来的预测。


    ### 模式与关联

    某些方法设计用于研究数据与频繁出现模式之间的关系。例如，可以使用数据挖掘算法分析项目集的频率，以确定特定零售店最畅销的商品。其他模式类型包括时间模式、进展规则、不规则模式和循环子图。


    ### 异常检测

    AD 是一种机器学习方法，旨在检测给定数据集中的故障和变异。


    '
