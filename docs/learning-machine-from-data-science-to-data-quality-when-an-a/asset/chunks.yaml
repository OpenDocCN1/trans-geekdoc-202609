    In order for this to work, you need to have a feedback loop that will reinforce
    what the machine is actually learning. It is rewarded when it performs certain
    actions and is disciplined when it is wrong. You might wonder how you can reward
    or discipline a machine that has no feelings and no emotions. The system will
    work something like this:


    - The machine is given an internal state that it must maintain. This state is
    used to learn about the environment.

    - The reward function is used to teach the machine how to behave.

    - The environment is the situation or scenario that the machine must operate in.
    It consists of all the things the agent can observe and respond to.

    - The action is the behavior of the machine.

    - The agent performs all the deeds.

