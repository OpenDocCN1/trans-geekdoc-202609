    - 重复步骤 2 中的步骤，直到达到最大迭代次数，或者神经网络的性能不再提升提升。


    ### 损失函数

    正如我们在上面介绍的人工神经网络训练步骤所示，我们需要一个能够描述神经网络准确性的性能衡量标准。这个函数被称为损失函数或代价函数。


    `J=(1/N) *∑(ypredicted -ytarget )2`


    其中：

    - `N`: 输出的数量

    - `yppredicted`: 输出值

    - `ytarget`: 输出的真实值


    该函数提供了神经网络的误差。`J` 的值越小，反映神经网络的准确性越高。到此为止，我们定义了损失函数以及神经网络的基本工作原理。现在，让我们深入了解训练过程中每个步骤的细节。


    ### 训练过程细节

    让我们考虑一组输入 `X` 和输出 `Y`。我们将 `W`（即权重）和 `B`（即偏置）初始化为空矩阵。


    #### 前向传播

    下一步是应用前向传播，它包括向人工神经网络的每一层输入权重与输入的乘积之和加上偏置。假设我们有两层。我们可以使用以下方程计算第一个隐藏层的输出：


    `Z1=W1*X+b1`


    其中 `W1` 和 `b1` 分别是神经网络的参数，作为第一层的权重和偏置。


    接下来，我们应用激活函数 `F1`，它可以之前介绍过的任何激活函数：


    `A1=F1(Z1)`


    得到的结果是第一层的输出，然后将其按如下传递到下一层：


    `Z2=W2*A1+b2`


    其中 `W2` 和 `b2` 分别是第二层的权重和偏置。对此结果，我们应用激活函数 `F2`：


    `A2=F2(Z2)`


    现在 `A2` 应该是人工神经网络的输出。取决于数据集和预期输出，激活函数 `F1` 和 `F2` 可能是相同的激活函数，也可能是不同的激活函数。


    #### 反向传播

    在前向传播之后，我们使用损失函数比较神经网络输出与目标输出。在此阶段估计输出与实际值之间的差异可能很大。因此，我们必须通过反向传播过程调整权重。


    我们计算每个激活函数关于偏置和权重的梯度。我们从评估最后一层的导数开始，然后是该层的前一个层，依此类推，直到输入层。然后根据梯度或激活函数的导数更新权重。


    将这些步骤应用于我们的两层神经网络示例中，结果如下：


    ```

    W2=W2-α*(dF2(W, b)/dW)

    B2=b2- α*(dF2(W, b)/db)

    W1=W1-α*(dF2(W, b)/dW)

    B1=b1- α*(dF2(W, b)/db)

    ```


    参数 `α` 是学习率参数。该参数决定了权重更新的速率。我们刚刚在这里描述的过程被称为梯度下降算法。重复该过程直到达到预设的最大迭代次数。我们将基于人工神经网络开发一个分类器。


