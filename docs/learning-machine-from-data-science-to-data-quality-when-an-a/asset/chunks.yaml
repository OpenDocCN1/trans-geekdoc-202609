- fmt: "\n# Chapter 8 — Data Mining\n\nData mining is a trendy field in machine technology.\
    \ The concept was first generated in the 90s. The idea of data mining has been,\
    \ from a broad perspective, referred to as big data or data science. The definition\
    \ of this concept varies depending on the application and scope.\n\n![00081.jpeg](rsrcRM.jpg)\n\
    \nThanks to the advancement in computer networks, data can now be stored effectively\
    \ and cheaply. Additionally, the transfer of data has been enhanced due to the\
    \ availability of electronic sources. These reasons and many more have enabled\
    \ the spread of data mining techniques. Many organizations are thereby able to\
    \ store massive amounts of data in databases without the fear of losing sensitive\
    \ information. \n\nThe ability to store vast amounts of data in databases is excellent.\
    \ However, it is also essential to know how to analyze and interpret the sets\
    \ of data at your disposal. Possessing larges sets of data that we cannot explain\
    \ and draw meaningful information from is as good as having no data at all. That\
    \ brings the question of how to analyze data stored in various databases.\n\n\
    Traditional methods of analyzing data included the manual hand analysis process.\
    \ However, conventional methods have proved to be time-consuming, tedious, and\
    \ the result may not reflect accurate outcomes. The traditional ways missed critical\
    \ information in datasets making the analysis processes a miss. Additionally,\
    \ the emergence of massive sets of data has made conventional techniques irrelevant\
    \ and unrealistic.\n\nTo mitigate the problems, automated methods have been designed\
    \ to help sort data and extract useful information, trends, and patterns that\
    \ may be desirable. The field is where data mining methods and techniques come\
    \ in handy. In clear terms, data mining processes aim at explaining the outcome\
    \ of an event, forecasting future results, and helping in understanding complex\
    \ data. The science of data mining has been used to describe phenomena such as\
    \ why a ship sank or plane crushed. In airplanes, data mining is done through\
    \ black boxes that fit with datasets and information about every flight. This\
    \ way, it’s easy to tell the circumstances that led to a crush. As opposed to\
    \ other machine learning methods of predicting outcomes, data mining techniques\
    \ are used to foretell the possible outcome based on facts and not instinct.\n\
    \n## The Process for Analyzing Data\n\nFor an efficient means of data mining,\
    \ there must be an observance of seven steps called the knowledge discovery in\
    \ databases. The seven stages of knowledge discovery in databases are illustrated\
    \ below.\n\n1. **Data cleaning**: This is the first step in analyzing data. In\
    \ this phase, data is cleaned to remove noise and other variations that may hamper\
    \ proper analysis.\n2. **Data integration**: The second step following data cleaning\
    \ is data integration. This process involves linking, infusing, and incorporating\
    \ data from various sources to prepare the data that is to be analyzed. For instance,\
    \ if the information is stored in different databases, integration is done to\
    \ put the data together in one database.\n3. **Data selection**: After data is\
    \ put together in a single file, the relevant set is chosen for analysis. This\
    \ is a process called data selection.\n4. **Data transformation**: Having done\
    \ all the procedures above, the data is now ready to be converted into a fitting\
    \ format. The conversion is done to make analysis easy. For instance, some techniques\
    \ of mining data may require that all arithmetic values be standardized.\n5. **Data\
    \ mining**: This step involves the application of data mining algorithms to analyze\
    \ the data and extract meaningful patterns and information from the analyzed sets\
    \ of data.\n6. **Assessment of the extracted patterns and knowledge**: This step\
    \ in data mining involves the study and evaluation of the derived patterns and\
    \ information from the analyzed data. The review of results can be done in subjective\
    \ or objective terms.\n7. **Visualization of data**: The last step in the data\
    \ mining process is the conception of the extracted information from the analyzed\
    \ data. This step is when we try to understand the outcome.\n\nIt is essential\
    \ to know that the steps above may vary depending on the technique and the algorithms\
    \ used. For instance, some algorithms of data mining may perform the steps concurrently\
    \ or continuously.\n\n## Application of Data Mining in Related Fields\n\nSeveral\
    \ data mining algorithms can be used in the various sectors and domains where\
    \ data analysis is vital. Some of these applications are listed below:\n\n* Detection\
    \ of fraud\n* Prediction of stock market valuations\n* Analyzing the purchasing\
    \ patterns of clients\n\nIn a broad sense, the techniques of data mining are chosen\
    \ based on the following metrics:\n\n* The type of data to be analyzed\n* The\
    \ form in which the information extracted from datasets is required.\n* The application\
    \ of extracted knowledge (how the information is used)\n"
