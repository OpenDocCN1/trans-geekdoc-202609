    # 结论


    随着时间的推移，机器学习正变得越来越重要。这是一个进入计算机科学和数据科学领域，并学习如何使用这些工具来完成惊人任务的绝佳时代。尽管机器学习看起来像是一个全新的事物，但机器与学习的概念可以追溯到历史的黎明。人类一直是工具的制造者和使用者，而如今的机器学习系统和人工智能仅仅是人类通过工具扩展头脑的漫长历史中的最新一次“迭代”。这是一个重要的概念。


    遗憾的是，如今对于人工智能存在着许多恐慌情绪。尽管经验证明事实并非如此，人们似乎很容易受到同样老调重弹幻想的影响。卢德分子是错误的，机器创造的工作比它们消除的要多
    10 到 100 倍。机器解放了人们去从事更有生产力的活动，而当生产力提高时，工作、活动和机会也会随之增加。今天也是如此，一向如此。每一代新人的出现都会引发旧的卢德思想，结果只是眼睁睁看着它们再次死去。


    这种情况发生在 20 世纪 80 年代初，当时个人电脑电子表格和会计程序的发明导致人们陷入了恐惧，想象会计师和办公人员将不再被需要。接着他们又对文字处理器做了同样的事情，想象秘书工作将被消除。这两者都没有发生。现在我们又回到了这个时刻。在沉寂了十年之后，人工智能终于活了了。机器人技术正在增强制造业以更低的成本和劳动力生产更多产出的能力。尽管在我写下这些文字时，经济正处于充分就业状态，但政治家和媒体人士再次发出了卢德分子式的指责。这一次，人工智能和机器学习要抢夺你的工作了。


    助这些恐惧的短视者完全偏离了要点，他们没有看到世界目前正在经历的变革将像往常做的那样，提高生产力并释放人们去做其他事情。希望他们不会停止这台令人兴奋的引擎。我怀疑他们无法做到这一点。政府和公司已经爱上了机器学习。原因很简单：机器学习行之有效。在经历了十年被过度透支的承诺后，计算机现在处于可以学习的水平，而且一旦经过训练，它们就能自主工作。机器学习让公司运行得更高效，并帮助政府识别欺诈、防止网络攻击并完成数百万件其他事情。由于智能是通用的，机器学习和人工智能的应用也是通用的。


    人工智能对于持有卢德分子观点的人来说有一种特殊的恐惧。说机器将摧毁你的工作是一回事，但人们对机器学习系统也有不切实际的恐惧。他们似乎认为 AI 和机器人将接管世界，仿佛他们生活在某种科幻幻想中。毫无疑问，随着时间的推移，机器学习将继续改进并能够承担更多任务，但这些任务的用途完全掌握在人类手中。


    这些工具可能被用于不法目的。在中华人民共和国，人脸识别等机器学习工具被用来控制和骚扰人们。在美国和欧洲被用于确定个人贷款信誉的工具，在中国被用来给人们评分“社会信用”。根据新闻报道，社会信用可以被用于限制人们旅行或出国。


    ## 给有志执业者的建议


    如果你是机器学习的新手，我希望你离开时已经剥离了其背后的一些神秘感。当你初接触这些概念，或只是在媒体中听到它们时，它们并没有看起来看起来那么复杂。如果你对机器学习真的感兴趣，并希望接受相关教育且可能将其作为职业，最好的起点是学习如何编程。为了在这个竞争激烈的领域获得工作，你可能需要一些学术学位，而这是大学里少数几个你可以去学校直接学习所需技能的领域之一。但你可以通过学习
    `python` 开始，这是一种可以在任何系统运行的简单编程语言。你可以在网上搜索用 `python` 构建的机器学习算法，它们可以使用小型数据集来开始提供实践。如果你决定进一步深造，我的建议是主修统计学或计算机科学，或者理想情况下双修计算机科学和数学。单学计算机科学可能是不够的，因为要从事数据科学工作，你需要对概率和统计学有深入的掌握。


    我还会建议上几门商业课程。你将了解到物流等领域，数据科学通常被应用于为大公司生成解决方案。这种方法非常有效，我可以向你保证，只要你接受了正确的教育，你一定能找到这份工作。


    处理机器学习与传统的计算机编程是完全不同的活动。当然，传统的计算机编程仍然存在并充满活力，所以让我们先不要把它把它杀掉。


    '
