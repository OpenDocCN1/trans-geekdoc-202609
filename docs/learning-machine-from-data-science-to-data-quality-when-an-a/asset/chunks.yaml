    - [Chapter 6 — Data Science Lifecycle and Technologies](#part0009.xhtml)

    - [Chapter 7 — Business Intelligence](#part0010.xhtml)

    - [Chapter 8 — Data Mining](#part0011.xhtml)

    - [Chapter 9 — Machine Learning and How It Fits With Data Science](#part0012.xhtml)

    - [Chapter 10 — Machine Learning and Business](#part0013.xhtml)

    - [Conclusion](#part0014.xhtml)


    ## Introduction

    You probably already have a pretty good idea of what machine learning is, but
    maybe the explanations you’ve gotten are just a little bit cloudy. You know it’s
    a key component of artificial intelligence, but even that definition is a little
    fuzzy. It can be very difficult to wrap your head around the concept. It helps
    to understand that the foundation of machine learning lies firmly rooted in our
    own biology. For eons, we’ve viewed the human brain as the only creation with
    the ability to learn and process information from complex data. Now, we’re told
    that inanimate objects can learn and change their behavior through this innovation.
    It boggles the mind to think of it that way. However, there is a good reason why
    it is not only possible, but it is already a major part of how we live and do
    business today.


    ### What Is It?

    To put it in the simplest of terms, machine learning is the art of computer programming
    that allows the computer to learn and to automatically adjust its functions to
    perfect how well they accomplish their task. A computer with machine learning
    capabilities can actually improve their performance based on their own experience
    without having an explicit program to tell them exactly what to do. This process
    of learning actually begins with the ability of the program to observe collected
    data and compare it with previous data to find patterns and results and adjust
    itself accordingly. All of this is done through a complex system of neural networks
    and algorithms working together in order to produce the desired results. In essence,
    it means that computers are slowly beginning to learn to think like humans, learning
    from their experiences and changing in order to improve the results they pick
    up. It is now one of the most effective means of simplifying work that has to
    be done. By reducing the need for every program to be written for every possible
    function a machine can do, it allows the machine to teach itself how to perform
    the work done in a faster and more efficient manner.


    If you’re not quite sure how this works, let’s use an example. Suppose you need
    to create a program that requires the computer to filter out certain types of
    data. In the traditional programming method, you would have to:

    1) Have a human examine what data you want to be eliminated and then compile a
    list of ways that unwanted data might appear and identify the specific patterns
    that may appear.

    2) Then the human would have to write a specific algorithm created to teach the
    computer exactly what to look for.

    3) The human would then have to develop a software program that could identify
    those patterns and other details and label them accordingly.

    4) Test the program and find any anomalies that could create a problem in finding
    the unwanted data and then go back to step one and repeat the process over and
    over again until the program is actually perfected.


    Even with this pretty basic list of steps, you would only be able to program the
    computer to complete one task and would have to repeat the process for any other
    task that you also may need the computer to do. To complete all of these tasks,
    you will have to comply with an extensive list of rules in order for it to work
    correctly. This leaves your programming efforts open to errors popping up and
    disrupting the whole process. However, if you had chosen to use machine learning
    to accomplish the same thing, the process would have been done much more quickly
    with less risk of errors developing.


    In addition, once the program is updated using the traditional method, the designer
    of the program could never feel like the job is done. He (or she) will always
    have to periodically go back and update it on a regular basis to ensure that it
    is compatible with the latest technology being used at the time. This would have
    to be done repeatedly until it is replaced by another program altogether. Machine
    learning is a technique that, once uploaded, will run itself. It will automatically
    tell when updates need to be made and can even latch onto a system and get its
    own updates, freeing up the human to do other things. Machine learning makes it
    possible to solve even the most complex problems with minimal human interference.
    Depending on the type of machine learning you use, once it is live and active
    in the system, the machine can continue to make its own adjustments and recognize
    its own failures and successes for as long as it remains that way. There are many
    advantages to using machine learning in computer programming today, but no doubt
    there will be many more new ways to use it in the future. Right now, it is primarily
    used to:


    * Solve problems that involve long lists of rules

    * Solve very complex problems that do not have any apparent solution

    * Adapt to new data in non-stable environments


    As more and more people become aware of how great machine learning can be, it
    is likely that it will be used in hundreds or thousands of other purposes. In
    time, it is feasible that it will be used in every industry in existence and may
    be used at some point to even create new ones.

