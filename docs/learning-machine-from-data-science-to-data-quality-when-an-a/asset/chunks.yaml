    # Chapter 9 — Machine Learning and How It Fits With Data Science


    Machine learning can definitely be an important part of the data science process,
    as long as we use it properly. Remember, as we go through this process, that part
    of data science is working on data analysis. This helps us to take a lot of the
    data we have collected along the way, and then actually see the insights and the
    predictions that are inside of it. To make this happen, we need to be able to
    create our models (that can sort through all of the data), find the hidden patterns,
    and provide us with our insights. To define these models, and to make sure that
    they work the way that we want, we need to have a variety of good algorithms in
    place, and this is where machine learning is going to come into play quite a bit.
    You will find that with the help of machine learning, and the variety of algorithms
    that are present in machine learning, we can create models that can go through
    any kind of data we have, whether it is big or small, and provide us with the
    answers that we need here.


    Machine learning is a process that we can use to make the system or the machine
    we are working with think in a manner that humans do. This allows the algorithm
    to go through and find hidden patterns in the same manner that a human would be
    able to do, but it can do it much faster and more efficiently than any human could
    do manually. Think about how hard this would be to do manually for any human,
    or even for a group of people who are trying to get through all of that data.
    It could take them years to get through all of that data and find the insights
    that they need. And with how fast data are being generated and collected, those
    predictions and insights would be worthless by the time we got to that point anyway.


    Machine learning can make this process so much easier. It allows us to have a
    way to think through the data and find the hidden patterns and insights that are
    inside for our needs. With the right machine learning algorithm, we can learn
    how the process works, and all of the steps that are necessary to make this happen
    for us. With this in mind, it is time to take a closer look at machine learning,
    and all of the parts that we need to know to make this work for our needs.


    ## What Is Machine Learning?


    The first thing that we need to take a look at here is the basics of machine learning.
    Machine learning is going to be one of the applications of artificial intelligence
    that can provide a system with the ability to learn, all on its own, without the
    help of a programmer telling the system what to do. The system can even take this
    a bit further and can work to improve based on its own experience, and none of
    this is done with the system being explicitly programmed in the process. The idea
    of machine learning is going to be done with a focus on the development of programs
    on the computer that can access any data you have, and can then use that presented
    data to learn something new, and how you would like it to behave.


    There are going to be a few different applications that we can look at when it
    comes to using machine learning. As we start to explore more about what machine
    learning can do, you may notice that over the years, it has been able to change
    and develop into something that programmers are going to enjoy working with more
    than ever. When you want to make your machine or system does a lot of the work
    on its own, without you having to step in and program every step, then machine
    learning is the right option for you.


    When it comes to the world of technology, we will find that machine learning is
    pretty unique and can add to a level of fun to the coding that we do. There are
    already a lot of companies, in a variety of industries (which we will talk about
    in a bit), that will use machine learning and are already receiving a ton of benefits
    from it.


    There are a lot of different applications when it comes to using machine learning,
    and it is amazing what all we can do with this kind of artificial intelligence.
    Some of the best methods that we can follow and focus our time on when it comes
    to machine learning include:


    - **Research on statistics**: Machine learning is already making some headway
    when it comes to the world of IT. You will find that machine learning can help
    you go through a ton of complex data, looking for the large and important patterns
    that are in the data. Some of the different applications of machine learning under
    this category will include things like spam filtering, credit cards, and search
    engines.

    - **An analysis of big data**: There are a lot of companies who have spent time
    collecting what is known as big data, and now they have to find a way to sort
    through and learn from that data, in a short amount of time. Companies can use
    these data to learn more about how money is spent by the customers, and even to
    help them make important decisions about the future. If we had someone go through
    and manually do the work, it would take much too long. But with machine learning,
    we can get it all done. Options like the medical field, election campaigns, and
    even retail stores have started to turn to Machine Learning to gain some of these
    benefits.

    - **The financial world**: Many financial companies have been able to rely on
    machine learning. Stock trading online, for example, will rely on this kind of
    work, and we will find that machine learning can help with fraud detection, loan
    approvals, and more.


    To help us get going with this one, and to understand how we can receive the value
    that we want out of machine learning, we have to make sure that we pair the best
    algorithms with the right processes and tools. If you are using the wrong kind
    of algorithm to sort through these data, you are going to get a lot of inaccurate
    information, and the results will not give you the help that you need. Working
    with the right algorithm, the whole time will make a big difference.


    The cool thing that we will see with this one is that there is a lot of machine
    learning algorithms that we can choose from at this point to work on your model.
    Each of these works in a different manner than the others, but this ensures that
    you can handle any kind of problem that comes along with your project. With this
    in mind, though, you will notice that some of the different available algorithms
    include random forests, neural networks, clustering, support vector machines,
    and more.


    As we are working on some of the models that we want to produce, we will also
    notice that there are a ton of tools and other processes that are available for
    us to work with. We need to make sure that we pick the right one to ensure that
    the algorithm and the model that you are working with will perform the way that
    you would like. The different tools that are available with Machine Learning will
    include:


    - Comprehensive management and data quality.

    - Automated ensemble evaluation of the model to help see where the best performers
    will show up.

    - GUIs for helping to build up the models that you want, along with the process
    flows being built up as well.

    - Easy deployment of this so that you can get results that are reliable and repeatable
    in a quick manner.

    - Interactive exploration of the data and even some visualizations that help us
    to view the information easier.

    - A platform that is integrated and end to end to help with the automation of
    some of the data to the decision process that you would like to follow.

    - A tool to compare the different models of machine learning to help us identify
    the best one to use quickly and efficiently.

