    a human brain can do, its function is based on a similar set of situations. A
    massive set of neural networks are created, each one communicating with the other.
    It also collects data and responds to the information it receives.  With artificial
    intelligence, the machine will be able to take in raw data and respond with a
    selection of pre-programmed responses. They will be able to “learn” from the data
    input and build on it. The major difference is that at present, machines can only
    learn from human input and develop their own concepts from the information gathered.
    This is one step closer to mimicking the human learning process.  Deep learning
    is basically a unique form of machine learning that is much more flexible than
    other previous forms used. By using a nested hierarchy of concepts, it can access
    many layers of non-linear information processing and achieve both supervised and
    unsupervised learning, which is ideal for pattern analysis and classification.
    Deep neural networks consist of several layers called a hierarchical neural network.
    In this type of network, every layer has the ability to change its input data
    into something that is more abstract. The output layer will then combine the various
    features of input data and formulate a prediction. This method improves calculations,
    so it is much easier to understand.  While there are several different ways that
    machines can learn information, their strategies can be categorized into two separate
    classes. The first being supervised learning that uses labeled data to classify
    information. This form of learning is based on data that produces “expected answers.”
    For example: Visual Recognition Imagine an AI designed to identify pedestrians
    walking across a street. It can be trained by inputting millions of short videos
    of street scenes collected. Some of the videos will have pedestrians walking while
    other videos will not. Some of the videos will have many people walking while
    some may have only one.  With a number of learning algorithms applied to the data,
    each giving the machine access to the correct answers, a variety of models are
    designed to teach the machine how to identify pedestrians in fast-moving scenes.
    The algorithms are tested against an unlabeled set of data that will check for
    accuracy. Predictions Supervised learning can also be used in making different
    predictions. A machine can be taught to estimate risk by inputting a large number
    of actual trades made by real investors and the results they received. It can
    then be asked to give an estimate of risk for each trade based on several fundamental
    factors of previous trades: price, volume, company, etc.  It then takes its estimated
    risk and compares it to the historical results during several different time intervals
    (day, week, month, and year) to determine if its predictions are accurate or within
    normal expectations. Unsupervised learning works a little differently. The machine
    receives input without any related yield factors. The answers are derived purely
    from the calculations made. The goal of this type of learning is to demonstrate
    the basic structure or dissemination of the information so that the machine can
    gather even more details about the information. Unlike with supervised learning,
    the machine is not given any right answer and there is no human instructor guiding
    its data. The AI may collect the data and sort it according to its similarities
    or differences, even if there is no classification. The goal is to show a fundamental
    structure in the information in an effort to get a better understanding of it. 
    It is referred to as unsupervised learning because there is no instructor guiding
    it to the right conclusions. The machine will perform its own calculations in
    an effort to determine the nature of the data that it has collected.  While there
    are obvious advantages to unsupervised learning, there are still some problems
    it has yet to resolve. For example, a machine may be capable of identifying basic
    visual images (it can tell a cat from a dog) it may also end up creating new classifications
    in an attempt to distinguish between varying differences within a certain classification.
    It may not be able to tell a German shepherd from a Chihuahua. Its purpose is
    to find relationships within the data it receives, but this can create several
    problems when it tries to go further than that. Clustering is when the AI attempts
    to decipher different groups within the data, whereas the association is an attempt
    to determine specific rules that will describe the data. Both of these can present
    huge problems in AI when their results are skewed by unanticipated groupings.
    In reinforcement learning, the machine is trained to recognize activities. To
    come to this conclusion, it learns from its own actions and not from a human instructor
    giving it the necessary input. The goal, in this case, is not to make a classification
    or a prediction of events but instead to develop a policy of behavior. We can
    find a perfect example of this in our relationship with household pets. If you’re
    going to teach your dog a new trick, you can’t just input the information and
    give it instructions on how you want it to behave. However, if you reward it for
    doing something and penalize it for other actions, eventually, the dog will learn
    how to do the things that give it rewards and avoid the behavior and those actions
    that bring on discipline.  Reinforcement learning in machines works in a similar
    way with a few differences. '
