    ## 使用行为深度学习模型监测并向创伤病例相关医师发出警报


    Digvijay Singhᵃ,*, Pallavi Prahladᵇ, Priyank Singhalᶜ, Rajesh Guptaᵈ, Meghna Pooniaᵉ,
    Jyotirmaya Sahooᶠ


    ᵃ 工程与计算学院，Dev Bhoomi Uttarakhand University，Dehradun，Uttarakhand，印度

    ᵇ 心理学系，理学院，Jain (Deemed to be University)，Bangalore，印度

    ᶜ 计算科学与信息技术学院，Teerthankar Mahaveer University，Moradabad，Uttar Pradesh，印度

    ᵈ 管理系，Sanskriti University，Mathura，Uttar Pradesh，印度

    ᵉ 生理学系，Jaipur National University，Jaipur，印度

    ᶠ 药学院，Arka Jain University，Jamshedpur，Jharkhand，印度


    ## ARTICLE INFO


    **Keywords:**

    - 物联网 (IoT)

    - 机器学习

    - 深度卷积神经网络 (DCNN)

    - 医疗保健

    - 监测系统

    - 警报系统


    ## ABSTRACT


    目前每个国家都高度重视医疗保健，这主要是由于创伤病例的增加。在这种情况下，基于物联网 (IoT) 的健康监测系统被认为是最理想的方法。利用互联网技术的新方法，物联网
    (IoT) 是一个日益增长的研究领域，主要在医疗保健领域。随着可穿戴传感器和手机的广泛使用，这些远程医疗保健监测系统得以迅速发展。物联网健康监测有助于患者即使在医生远离时也能获得与其当前健康状况相适应的适当护理。本研究将物联网的概念与深度学习相结合，提出了一种系统方法，更有效地识别创伤病例。通过利用患者身体的一些生物信息，如体温、心率和其他因素，该方法概述了物联网，并用于监测人体健康状况和识别症状。对于使用传感器节点的跌倒检测，深度卷积神经网络
    (DCNN) 分析个体的运动和架构。所建议的方法可以用较低的成本实施，但具有显著的潜力，通过为患者和疑似病例提供所需的护理并对生死攸关的情况做出反应来识别症状。在应用分类算法时，使用精确度、召回率、F
    测度和准确率等指标来评估结果。与决策树 (DT)、支持向量机 (SVM) 和 K 近邻 (k-NN) 等技术相比，研究结果表明其非常成功。


    ## 1. Introduction


    人们在不断扩大的全球人口中以显著的速度发展出慢性疾病。每日吸烟、使用酒精、过度压力、缺乏身体锻炼等因素是其主要原因 [1]。医疗保健是日常生活的关键组成部分。有了适当的护理，健康问题可以在早期阶段得到诊断和预防
    [2]。利用 CT、MRI、PET 等多种诊断工具，很容易识别我们体内或皮肤下存在的异常。此外，某些罕见疾病，如心脏问题等的早期检测和预防也非常简单。心率、体温、血氧水平等是创伤性疾病中的关键因素。患者监测系统使医生能够同时监视多名患者
    [3]。


    在爆发流行的地区，使用远程健康监测技术来检查这些创伤受害者始终是一个更好的主意。当前的解决方案是基于物联网的健康监测系统 [4]。图 1 展示了物联网与机器学习交叉发展的技术
    [5]。正在创建智能服务，利用机器学习快速分析和应用大量数据，以提供简单易用的用户体验并提高系统性能。这些服务利用物联网设备的各种传感器收集人类活动数据。


