    # 2. Literature review


    These convergence technologies primarily interest healthcare. IoT technology may
    enhance patient care and allow sensors to gather vast volumes of medical data
    and illness data [6].


    Systems may automatically learn from experience and become more effective due
    to machine learning, which eliminates the need for explicit programming. Artificial
    intelligence is being used in this state. Supervised learning, unsupervised learning,
    semi-supervised learning, and reinforcement learning are common categories for
    machine learning techniques [7]. With the integration of ML with IoT devices,
    monitoring, managing, and analysing medical information are made simpler. To analyze
    complicated illnesses, many deep learning methods have been developed. The following
    categories may be used to categorize various kinds of neural networks. Network
    with Feedforward Processing [8], Recurrent Neural Network (RNN) [9], Radial Basis
    Function Neural Network [10], Kohonen Self-Organizing Neural Network [11] and
    Modular Neural Network [12]. Deep Neural Networks are implemented in the following
    popular ways: Sparse Autoencoders [13], Convolution Neural Networks (CNNs or ConvNets)
    [14], Restricted Boltzmann Machines (RBMs) [15], and Long Short-Term Memory (LSTM)
    [16].


    Data science, which also includes statistics and predictive modelling, contains
    machine learning as a crucial component. The use of machine learning in data science
    is very advantageous since it expedites and simplifies the process of gathering,
    analysing, and interpreting massive volumes of data. There is currently no recognized
    method in this area that can effectively track the condition of trauma in the
    human body. As a consequence, trauma patients were unable to obtain the appropriate
    care when it was needed. In order to identify biological and environmental data,
    the implanted numerous sensors demonstrated high accuracy. Raspberry Pi and Arduino
    modules may upload data to the cloud network or cloud storage for extended periods
    of time.


    Combining the ideas of IoT and Deep Learning, the study more effectively provided
    solutions to the problems. The severity of the patients is predicted using a DL
    method combined. The system can continue the real-time connection with the trauma
    sufferers because of the data''s aggregation by IoT devices. By using some biological
    information from the patient''s body, like body temperature, heart rate, etc.,
    it is primarily used to track the patient''s overall health and to assess the
    severity of trauma cases. The findings show that when compared to current approaches,
    the proposed system has high monitoring and alerting with the ability to give
    healthcare and emergency medical help to patients.


    Ru et al. [17] A new algorithm is being presented that aims to integrate IoT technology
    with health monitoring, create specific time adjustments, and permit device connectivity.
    The suggested technique aims to identify different health monitoring devices worn
    by individuals to track physical. The health monitoring system is established
    using the information that is gathered and wireless sensors. Real-time monitoring
    is accomplished by combining the data with the aid of IoT for connecting, processing,
    and computing. The temperature is monitored using a temperature thermometer, and
    the monitoring system calculates the average, which shows that the system has
    been tested and established as reliable and stable. Similar to the findings of
    the medical pulse meter, the ECG and pulse rate tests were also performed. The
    matching system, semantic recognition, and reasonably accurate character mating
    system are used to get the physiological information. Finally, the study finds
    that the IoT-based human monitoring system gives individuals access to daily health
    management and helps to raise the level and quality of healthcare services.


    Philip et al. [18] IoT was offered as a new technique for home health monitoring
    systems in order to increase quality of life while also reducing the need for
    hospitalization and associated costs. The aim of the method is to improve with
    the help of three folds: 1. The development and use of IoT based in-home remote
    monitoring are examined from a key perspective; 2. The most recent design and
    major building elements for an IoT-based in-home remote monitoring system; 3.
    The prediction for the future, as well as the suggestions for the various in-home
    remote monitoring programs moving ahead. As a consequence of the performance assessment,
    the privacy, scalability, and security systems are all improved.


    Valsalan et al. [19] presented here is a newly constructed algorithm for monitoring
    healthcare utilizing Internet of Things and using a portable physiological testing
    framework. Then continuously captured the temperature, heartbeat, and other fundamental
    room data of the patient. Utilizing the suggested technique, monitor the patient''s
    condition using a continuous monitoring and control system while also storing
    the patient''s information for server-based remote communication. For authorized
    users to access personal data saved on any IoT platform, a remote health monitoring
    system is employed. Considering the results and from a distance, physicians diagnose
    disorders using this system.


    Islam et al. [20] presented real-time monitoring of a patient''s vital signs and
    the state of their current room using an IoT environment for


