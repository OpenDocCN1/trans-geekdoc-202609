    ## 2. Literature review


    这些融合技术主要引起医疗保健的兴趣。物联网技术可以改善患者护理，并允许传感器收集大量医疗数据和疾病数据 [6]。


    由于机器学习可以从经验中自动学习并变得更有效，因此无需显式编程。人工智能正在此状态下使用。监督学习、无监督学习、半监督学习和强化学习是机器学习技术的常见类别
    [7]。将 ML 与物联网设备集成后，医疗信息的监测、管理和分析变得更加简单。为了分析复杂的疾病，已经开发了许多深度学习方法。可以用以下类别对各种神经网络进行分类。具有前馈处理的网络
    [8]、循环神经网络 (RNN) [9]、径向基函数神经网络 [10]、Kohonen 自组织神经网络 [11] 和模块化神经网络 [12]。深度神经网络以以下流行方式实现：稀疏自编码器
    [13]、卷积神经网络 (CNNs 或 ConvNets) [14]、受限玻尔兹曼机 (RBMs) [15] 和长短期记忆 (LSTM) [16]。


    数据科学，其中还包括统计学和预测建模，包含机器学习作为关键组成部分。机器学习在数据科学中的使用非常有利，因为它加快并简化了收集、分析和解释大量数据的过程。目前该领域尚无公认的方法能够有效跟踪人体创伤状况。因此，创伤患者无法在需要时获得适当的护理。为了识别生物和环境数据，所植入的众多传感器显示出高精度。Raspberry
    Pi 和 Arduino 模块可以将数据上传到云网络或云存储以供长时间使用。


    结合物联网和深度学习的思想，研究更有效地提供了问题的解决方案。患者的严重程度是使用结合的 DL 方法预测的。由于物联网设备的数据聚合，系统可以继续与创伤受害者保持实时连接。通过使用患者身体的一些生物信息，如体温、心率等，它主要用于跟踪患者的整体健康状况并评估创伤病例的严重程度。研究结果表明，与现有方法相比，所提出的系统具有高监测和警报能力，能够为患者提供医疗保健和紧急医疗帮助。


