    ## 5. Conclusion


    This research demonstrates and provides better IoT in healthcare using Deep Learning
    (DL) technology. This study presents a trauma cases IoT-based healthcare platform
    that links with smart sensors linked to the human body for health monitoring for
    a daily check-up. This study offers the chance to continually monitor a patient
    utilizing the free and open-source Thing Speak cloud platform, which also includes
    remote monitoring and mobile messaging services that can differentiate between
    normal and abnormal situations predicted using DCNN algorithms. The proposed method
    improves the trauma case detection, improves the physician monitoring and alerting
    reduces the error rate and enhances the accuracy 95.21% and reduces the false
    detection. Classification metrics Accuracy, Recall, Precision, F-Measure and error
    has been evaluated and compared with proposed system and existing methods. Plan
    to gather larger and multicenter datasets for future work in order to do additional
    validations of all these models on other datasets. Prediction models become more
    reliable as a result. The research results are more accurate since looked into
    patients’ health issues over a shorter period of time. It could result in a quicker
    prognosis that more precisely directs medical care. The mortality rate was the
    only subject of this study. But efforts can also be made to forecast the patients’
    functionality after a specified period of time. As it gives doctors more information,
    it results in better health care. Future research should include testing the findings
    on a large number of patients and determining the accuracy. To increases the trauma
    patient’s data collections, using high-end sensor to reduce the patients processing
    time and displeasure.


