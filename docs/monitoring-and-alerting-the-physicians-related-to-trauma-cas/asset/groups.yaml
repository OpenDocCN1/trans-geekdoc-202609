    # Monitoring and alerting the physicians related to trauma cases using behavioural
    DL models


    Digvijay Singhᵃ,*, Pallavi Prahladᵇ, Priyank Singhalᶜ, Rajesh Guptaᵈ, Meghna Pooniaᵉ,
    Jyotirmaya Sahooᶠ


    ᵃ School of Engineering and Computing, Dev Bhoomi Uttarakhand University, Dehradun,
    Uttarakhand, India

    ᵇ Department of Psychology, School of Sciences, Jain (Deemed to be University),
    Bangalore, India

    ᶜ College of Computing Science and Information Technology, Teerthankar Mahaveer
    University, Moradabad, Uttar Pradesh, India

    ᵈ Department of Management, Sanskriti University, Mathura, Uttar Pradesh, India

    ᵉ Department of Physiology, Jaipur National University, Jaipur, India

    ᶠ Department of Pharmacy, Arka Jain University, Jamshedpur, Jharkhand, India


    # ARTICLE INFO


    +   **Keywords:**

    +   - Internet of things (IoT)

    +   - Machine learning

    +   - Deep convolutional neural network (DCNN)

    +   - Healthcare

    +   - Monitoring system

    +   - Altering system


    # ABSTRACT


    Presently Every nation places a high value on healthcare due to the rise in trauma
    instances. The ideal approach in this case is thought to be an Internet of Things
    (IoT) based health monitoring system. A novel approach using internet technology,
    the Internet of Things (IoT) is an increasing study area, mainly in the field
    of healthcare. The rising use of wearable sensors and cellphones has allowed these
    remote health care monitoring systems to grow at such a rapid rate. IoT health
    monitoring helps patients receive the appropriate care for their present level
    of health even when a physician is far away. The notion of the IoT and deep learning
    are combined in this study to present a systematic method to identify trauma instances
    more effectively. By utilizing some of the biological information from the patient’s
    body, such as temperature, heart rate, and other factors, this approach presents
    an overview of the IoT and is also used to monitor health status and identify
    symptoms in the human body. For fall detection using sensor nodes, the Deep Convolutional
    Neural Network (DCNN) analyses individuals’ motion and architecture. The suggested
    method may be put in place for less money but has significant potential to identify
    symptoms by giving patients and suspected cases the care they need and reacting
    to life-or-death circumstances. Metrics such as precision, recall, F-measure,
    and accuracy are utilized to evaluate the results when applying classification
    algorithms. When compared to techniques like the Decision Tree (DT), Support Vector
    Machine (SVM), and K Nearest Neighbour (k-NN), the findings show that it has been
    very successful.


    # 1. Introduction


    People are developing chronic illnesses at a significant pace in the expanding
    global population. Daily cigarette use, alcohol intake, excessive stress, lack
    of physical exercise, and other factors are the primary causes of this [1]. A
    crucial part of everyday living is healthcare. With the right care, health problems
    may be diagnosed diagonally and avoided at an early stage [2]. Using numerous
    diagnostic tools like CT, MRI, and PET, among others, it is simple to identify
    the anomalies that are present inside of us or under the skin. Additionally, early
    detection and prevention of certain rare disorders, such as heart problems and
    techniques are quite simple. The heart rate, body temperature, blood oxygen levels,
    etc., are crucial factors in trauma disorders. Patient monitoring systems allow
    doctors to keep an eye on multiple patients at once [3].


    It is always a better idea to use remote health monitoring technologies to keep
    a check on these trauma victims in those locations where the outbreak is prevalent.
    The present solution is an Internet of Things-based health monitoring system [4].
    Fig. 1 demonstrates the developing technology of the intersection of IoT and Machine
    Learning [5]. Intelligent services are being created to quickly analyze and apply
    massive amounts of data using machine learning to deliver easy user experiences
    and enhance system performance. These services gather data on human activities
    using a variety of sensors from IoT devices.


