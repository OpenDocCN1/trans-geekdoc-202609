    intelligence is being used in this state. Supervised learning, unsupervised learning,
    semi-supervised learning, and reinforcement learning are common categories for
    machine learning techniques [7]. With the integration of ML with IoT devices,
    monitoring, managing, and analysing medical information are made simpler. To analyze
    complicated illnesses, many deep learning methods have been developed. The following
    categories may be used to categorize various kinds of neural networks. Network
    with Feedforward Processing [8], Recurrent Neural Network (RNN) [9], Radial Basis
    Function Neural Network [10], Kohonen Self-Organizing Neural Network [11] and
    Modular Neural Network [12]. Deep Neural Networks are implemented in the following
    popular ways: Sparse Autoencoders [13], Convolution Neural Networks (CNNs or ConvNets)
    [14], Restricted Boltzmann Machines (RBMs) [15], and Long Short-Term Memory (LSTM)
