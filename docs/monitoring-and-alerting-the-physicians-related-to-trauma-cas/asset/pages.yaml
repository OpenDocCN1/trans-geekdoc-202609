    # 4. Results and discussion


    Thus, by receiving the right care and receiving an early diagnosis, trauma illness,
    which is a leading cause of mortality worldwide, may be reduced. This internet-of-things
    project uses an Arduino and pulse rate sensor to capture real-time data from trauma
    patients, which is then reported using thing speak. As a result, human trauma
    disorders were predicted using machine learning techniques.


    # 4.1. Datasets


    Machine learning techniques are employed with the patient data from the 40-sample
    collection. Following a real-time comparison of all algorithms, it primarily focused
    on Deep Conventional Neural Network (CNN), RNN, and Artificial Neural Network
    (ANN).


