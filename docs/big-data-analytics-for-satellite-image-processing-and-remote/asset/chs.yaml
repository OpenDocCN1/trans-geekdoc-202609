  \n# 有序排序 (Ordered Sorting)\n\n该算法的目标是以并行方式对输入数据集进行优化的排序。基本上，它的目的是根据并行键对数据进行排序。在顺序编程中，排序是简单的。但由于\
  \ map reduce 使用了“分治”法，使得在 map reduce 编程模型中实现这一过程变得有些困难。一种方法是获取所有输入数据并对数据的特定部分进行排序，但这作为全局方法是不可行的，因为排序不是一种交换和结合属性。这种数据流的类型需要进行分区，以便每个分区都进行本地排序，当所有这些分区合并时，我们就得到了全局有序的数据。\n\
  \n有序数据具有许多实用的属性。有序数据通过提供数据的范围和时间线，为数据提供了许多洞察。有序数据通过提供二分搜索类型的方法帮助在数据集上执行搜索操作，其复杂度为\
  \ `O(logn)`，而普通的搜索方法复杂度通常为 `O(n)`。因此，其应用范围涵盖了数据索引以及在特定范围内以高效且优化的方式查找某些数据。\n\n此过程的主要要求是键应该是可比较的数据类型，以便进行排序。这是通过使用表示数据特定部分的键来实现的，即构造键使得数据在它们之间均匀分布，并且只有特定范围内的数据出现在每个分区中。因此需要对数据进行预分析，以便\
  \ map reduce 任务能够了解整体的数据变化，从而为分区操作构建键。这随后将有助于将数据分配到每个分区中，每个分区都可以进行本地排序，然后根据构造的键对分区进行排序，最终我们就能获得有序数据。\n\
  \n对于某些特定类型的数据，分析阶段可能是可选的，例如具有唯一元素的数据集，因此可以借此找到数据中特定参数的精确范围，从而很容易基于该参数对数据进行分区。如果需要，分析阶段会对数据进行随机采样，并基于这些样本构建分区。mapper\
  \ 执行简单的随机采样。当输出时，仅输出作为键的即排序后的值，与之关联的值设为 null，因为该值不会与任何其他值关联。这里只使用一个 reducer，因为它将作为最终的排序列表，通过这种方式处理数据将变得容易。\n\
  \n最后，将根据获得的数据范围执行执行阶段（practitioner phase）。mapper 以分析步骤相同提取排序键。然而，这一次记录本身被存储为值，而不是被忽略。自定义执行器接收所有值，并根据分析阶段决定的范围发送到\
  \ reducer。reducer 仅将获取的值作为排序后的值输出。最重要的的一点是，reducer 的数量将等于分析阶段决定的分区数量。这是一个沉重的操作，因为它涉及到两个阶段：一个是寻找数据范围，另一个是实际对数据进行排序，后者基本上是一个更沉重的阶段，因为这实际上涉及到所获取数据的洗牌。寻找分区的实际成本将非常低，因为它只涉及一个\
  \ reducer，因此摊销成本将大幅降低。排序步骤将涉及大量数据通过网络传输，因此多个 reducer 将使任务变得更容易且更优化。\n\n# 倒排索引 (Inverted\
  \ Index)\n\n近年来，大规模图像检索在现实应用中展现了巨大的潜力（Nguyen, B. V., Pham, D., Ngo, T. D., Le, D.\
  \ D., & Duong, D. A., 2014）。这种类型的工作基本上用于列出数据集中的重要术语，因此对文档中的重要单词进行标记非常有用，以便追踪特定值。大多数搜索引擎都执行此任务，以便在网络上进行高效搜索。mapper\
  \ 输出带有值的所需的唯一键。分区阶段用于确定在处理完成后将数据发送到哪个 reducer，从而使 reducer 的最终处理任务以分布式的方式进行。因此，reducer\
  \ 最终接收一组不同的行标识符，以便将它们链接回输入键。最后，可以使用唯一分隔符的 reducer 来执行分离键值对的操作。最终输出具有与输入文件中唯一 ID\
  \ 关联的值，因此它们可以与文件中的数据元素相关联。因此，性能取决于索引键的唯一类型以及键的基数（即每个键关联的值的数量）。\n\n# 结论 (CONCLUSION)\n\
  \n数据的黄金时代已经到来。处理大规模数据集的能力取决于服务器能力以及可用的通用服务器数量。通过使用通用服务器，数据处理已经实现了水平扩展。这在软件规模上通过如\
  \ map reduce 和 mpp 等创新才成为可能的。这主要涉及在处理任务中避免系统级的集成，从而使开发更容易。\n\n# 参考文献 (REFERENCES)\n\
