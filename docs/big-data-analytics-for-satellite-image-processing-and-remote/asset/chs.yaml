  \n# 作者\n\nLeonid Datta 是维特理工大学（VIT University）计算机科学与工程专业的大四级学生。他完成了题为“搜索引擎截断技术”、“Web\
  \ 设计与数据分析”以及“基于 RFID 传感器的通用学生识别”的项目。\n\nSameera K. 是维特理工大学计算机科学与工程学院的研究助理。\n\nChetan\
  \ Kumar 是维特理工大学的一名学生。\n\nVenkatesan M. 是卡纳塔克邦国立技术学院（曼格加洛尔）计算科学与工程系的的助理教授。他从事大数据分析、数据科学和空间数据挖掘领域的工作。他的研究领域包括数据库、数据仓库、数据挖掘、大数据以及数据挖掘在各种实时应用中的应用。他在使用\
  \ `Clementine` 和 `Rapidminer` 等数据挖掘工具方面拥有深厚的知识。他是印度空间研究组织（ISRO）资助的滑坡体数据挖掘项目的首席研究员。他拥有空间数据挖掘领域的工程学士（BE）、技术硕士（MTech）和博士（PhD）学位。\n\
  \nAbhishek Mukherjee 是维特理工大学的一名学生。\n\nPrabhavathy P. 目前担任维特理工大学（韦洛尔）信息技术与工程学院的副教授。她已获得计算智能领域的博士学位。她的兴趣领域包括粗糙集、模糊集、序列挖掘和数据挖掘。她在国际期刊和国际会议上发表了大量论文。\n\
  \nPronay Peddiraju 是一位计算机科学工程师，在游戏引擎技术、增强现实与虚拟现实开发以及 3D 对象可视化方面拥有经验。Pronay 曾在游戏技术和问题解决领域进行过研究。\n\
  \nDhanasekaran Pillai 于 2015 年在印度安纳大学信息与通信工程学院获得计算机科学与工程博士学位。2009 年他在安纳大学获得计算机科学与工程学硕士（M.E.）学位，目前是卡纳塔克邦贝尔加姆\
  \ JGI-Jain 工程学院的副教授。他在数据挖掘、信息提取、大数据分析、遥感等问题上有大量广泛的写作和演讲，是 `IJRCIS` 的编辑和评审委员会成员。\n\
  \nRemya S. 目前在维特理工大学（韦洛尔）进行研究。她于 2009-2011 年期间在里卡特大学完成技术硕士（M.Tech），并在 2002-2006\
  \ 年在 `CUSAT` 完成工程学士（B.Tech）。\n\nShweta Shinde 是在 `Genesys` 工作的维特理工大学学生。\n\nRamasubbareddy\
  \ Somula 目前在维特理工大学担任助理教授。他在安得拉拉邦的 Alfa 工程与技术学院完成工程学士（BTech），在安得拉拉邦的 Srirama 工程学院完成技术硕士（MTech）。\n\
  \nUtkarsh Srivastava 是维特理工大学计算机科学背景的大四级本科生。他对学习和实施技术充满热情。他对大数据领域也有深厚的兴趣。他本质上是一个通晓多语言者，可以使用多种语言进行编程和交流。\n\
  \n"
