  \ W. (1977). 探索性数据分析. 学术出版社。\n\n# 第 10 章\n\n*   Shreya Tuli\n    印度 VIT 大学\n*  \
  \ Gaurav Sharma\n    印度 VIT 大学\n*   Nayan Mishr\n    印度 VIT 大学\n\n## 摘要\n\n大数据是指由于规模巨大或极其复杂以至于传统的数据处理应用软件无法对其处理的数据集。其挑战包括数据采集、数据存储、数据分析、搜索、共享、传输、可视化、查询、更新和信息隐私。最近，大数据这一术语倾向于指使用预测分析、用户行为分析或某些从数据中提取价值的高级数据分析方法，而很少指特定大小的数据集。在本章中，作者区分了伪钞票与真钞票，并希望将其提升到可以处处使用的水平。在检测出真伪后，其数据可以存储在数据库中。要存储的数据将是巨大的。为了解决这个问题，我们可以采用大数据。它将帮助在瞬间存储大量数据。真钞与伪钞的区别在于，真钞的光细丝带在多程度上是连续的，而伪钞的丝带内带有破碎的细线。可以说伪钞的光细丝带内有多于一条线，而真钞只有一条。因此，如果我们只看到一条线，它就是真品；但如果我们看到多条线，它就是伪品。在本章中，作者使用了外币。\n\
  \n## 引言\n\n区分伪币和正版货币有 6 个不同的步骤。在这个项目中，我们使用一种著名的分割技术，即阈值化（thresholding）。此外，我们的项目还涉及开运算（opening）和闭运算（closing）等各种过程……在这里，我们使用一张真钞和两个伪钞，根据其上面的黑带对它们进行区分。\n\
  \n### 阈值化\n\n这是最简单的图像分割方法。从灰度图中，可以使用阈值化创建二值图像。最简单的阈值方法是：如果图像强度小于某个固定常数 `T`，则将图像中的每个像素替换为黑色像素；如果图像强度大于该常数，则替换为白色。在右侧的示例图中，这导致深色的树变得完全黑色，白雪变得完全白色。\n\
  \n### 开运算\n\n在数学形态学中，开运算是使用结构元素 `B` 对集合 `A` 进行腐蚀后的膨胀。它与闭运算一起，在计算机视觉和图像处理中作为形态学去噪的基础工具。开运算从图像的前景（通常被认为是亮像素）中移除小物体，并将其置于背景中，而闭运算则移除前景中的小空洞，将背景的小孤屿变为前景。这些技术也可以用于寻找图像中的特定形状。开运算可以用于寻找特定的结构元素可以嵌入的物体（边缘、角、……）。\n\
  \n### 闭运算\n\n在数学形态学中，使用结构元素 `B` 对集合 `A` 进行闭运算是对 `A` 进行腐蚀后的膨胀。它与闭运算一起，在计算机视觉和图像处理中作为形态学去噪的基础工具。开运算从图像的前景（通常被认为是亮像素）中移除小物体，并将其置于背景中，而闭运算则移除前景中的小空洞，将背景的小孤屿变为前景。这些技术也可以用于寻找图像中的特定形状。\n\
