  \ Semantic Web Evaluation Challenge (pp. 150-156). Springer International Publishing.\
  \ doi:10.1007/978-3-319-12024-9_19\n\nSankaranarayanan, S., & Perumal, T. P. (2014).\
  \ 通过数据挖掘方法和技术进行糖尿病预测，” Intelligent Computing Applications (ICICA), 2014 International\
  \ Conference on, 162-166.\n\nTaylor, R. C. (2010). Hadoop/MapReduce/HBase 框架及其在生物信息学中的当前概述\
  \ . BMC Bioinformatics , 11.\n\nTukey, J. W. (1977). 探索性数据分析. Academic Press.\n\n\
  White. (2012). Hadoop 权威 . O'Reilly Media, Inc.\n\n# 第 8 章：分析、工具、建模与挑战\n\n*   Remya\
  \ S., 印度 VIT 大学\n*   Ramasubbareddy Somula, 印度 VIT 大学\n*   Sravani Nalluri, 印度 VIT\
  \ 大学\n*   Vaishali R., 印度 VIT 大学\n*   Sasikala R., 印度 VIT 大学\n\n## 摘要\n\n本章介绍了大数据的基础知识，包括架构、建模和所使用的工具。`Big\
  \ data`（大数据）是一个用于处理海量数据的术语，可以作为 `RDBMS` 以及其他分析技术（如 `OLAP`）的替代方案。每个应用程序都有包含基本信息的数据库。但数据库在不同应用中的规模各异，我们需要存储、提取和修改这些数据库。为了使其变得有用，我们必须高效地处理它们。这正是大数据发挥重要作用的地方。大数据超过了其他传统数据库的处理能力和整体容量。在本章中，每一节将介绍基本架构、工具、建模和挑战。\n\
  \n## 1 引言\n\n一天复一日，我们看到数据正各种形式迅速增长。我们有一些传统的数据处理软件来处理少量数据。但当每秒处理数万亿字节的信息时，传统的软件技术在处理这些数据时就显得失效了。我们需要重新思考一种能够处理这些数据的解决方案。现在大数据为我们提供了一个解决方案。`Big\
  \ Data` 是用于创建、捕获、通信、聚合、存储和分析大量数据的术语。量化数据量增长率的尝试被称为信息爆炸。\n\n在数据量规模的历史以及大数据术语的演变过程中发生了若干重大里程碑。以下是其中：\n\
  \n*   1971 年，Arthur Miller 在《攻击隐私》中指出：太多的信息处理者似乎根据个人档案所占用的存储容量比特数来衡量一个人。\n*   1980\
  \ 年 4 月，I.A.Tjomsland 在“第四届 IEEE 大规模存储系统会议”上发表了题为“我们以后将走向何方？”的演讲，他提到：数据会扩展以填充可用空间，我认为大量数据正在被保留。\n\
  *   1997 年，Michael Lesk 发表了《有多少数据？》，并得出结论：数据会扩展以填充可用空间，我认为大量数据正在被保留。\n\n`Big Data`\
  \ 一词被用在各种语境中。以下是大数据与传统商业智能的区别之处：\n\n*   数据位于分布式系统中。\n*   数据以不同的格式存在。\n*   数据既是结构化的也是非结构化的。\n\
  *   数据既是实时的也是离线的。\n*   技术依赖于 `MPP`。\n\n类似于云计算架构，大数据版图可以分为四层：\n\n*   **基础设施即服务 (`IaaS`)**：包括作为基础的存储服务器和网络。\n\
  *   **平台即服务 (`PaaS`)**：包括使用查询语言的数据存储分布式缓存。\n*   **数据即服务 (`DaaS`)**：包括搜索引擎、集成适配器和批处理程序。\n\
  *   **作为服务的大数据业务功能 (`BFaaS`)**：健康、零售、电子商务、能源和银行等行业。\n\nGartner 最近的“新兴技术技术曲线”可视化了大数据的缺失。在过去的\
  \ 5 年里，大数据在 Gartner 周期中占有一席，但令人震惊的是，它在 2016 年 7 月被移除了。Gartner 分析师 Burton 给出的原因是，我不认为大数据是一项新兴技术。\n\
  \n以下是一些在特定行业提供解决方案的大数据提供商：\n\n*   证券交易委员会 (`SEC`) 正在使用大数据监控金融市场活动。\n*   在通信、媒体和娱乐行业，同时分析客户数据和行为数据。\n\
  *   一些医院正在使用大数据技术来实施循证医学。\n*   大数据也被用于解决当制造业的挑战。\n*   在公共服务领域，大数据有非常广泛的应用，包括能源开发、金融市场分析、欺诈检测、健康相关搜索和环境保护。\n\
  \n\n\n\n\n*   智能电表读取器允许几乎每 15 分钟收集一次数据，而旧的电表读取器每天收集一次。这种细粒度数据被用于更好地分析公用事业消耗，从而改进客户反馈并更好地控制公用事业的使用（David\
  \ R. Hardoon & Galit Shmueli, 2013）。\n\n我们有大数据的 4V：\n\n*   `Velocity`（速度）：数据正以非常快的速度增长。估计数据量每年翻一倍。\n\
  *   `Variety`（多样性）：如今数据不再以行和列（即结构化格式）存储。我们看到数据正以日志文件（即非结构化）的形式存储。\n*   `Volume`（数量）：我们处理的数据量非常大，达到了拍字节（PB）。\n\
  *   `Veracity`（真实性）：解释数据的可靠性（Foster Provost & Tom Fawcett, 2013）。\n\n## 2. 大数据建模\
  \ (4V)\n\n大数据可以被定义为大量数据集的集合。使用传统工具很难处理如此庞大的数据集。这就是为什么大数据在存储和分析大量数据方面变得重要的原因。这些数据可以通过数据挖掘工具或\
  \ DBMS 工具进行挖掘。基于此，大数据的主要组成部分可以称为 4V 集合（P. Hitzler & K. Janowicz, 2013）。\n\n| 图 1.\
  \ 大数据建模 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch008.f01](img/ch008.f01.png) |\n\
  | --- |\n\n## 2.1 数量、速度、多样性、真实性\n\n*   `Volume`（数量）指的是数据量\n*   `Velocity`（速度）指的是数据生成和传输的速率\n\
  *   `Variety`（多样性）指的是不同类型的数据，如结构化、半结构化和非结构化数据\n*   `Veracity`（真实性）指的是数据的完整性\n\n\
  大数据根据这 4 个组件区别于传统数据：\n\n### 2.1.1 数量\n\n我们生活在数据时代，2013 年的分析显示数据存储总量为 4.4 艾字节（zeta\
