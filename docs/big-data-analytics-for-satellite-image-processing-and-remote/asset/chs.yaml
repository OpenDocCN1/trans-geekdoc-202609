  - 大数据 (Big Data)：通过计算分析的大数据集。\n- 密文 (Cipher-Text)：文本的加密形式。\n- 云计算 (Cloud Computing)：提供共享计算资源。\n\
  - 簇 (Clusters)：可分配的磁盘空间单位。\n- 加密 (Encryption)：将信息转换为代码的过程。\n- 层次聚类 (Hierarchical\
  \ Clustering)：构建聚类层次的方法。\n- 最小哈希子树 (Minimum Hash Sub-tree)：根节点具有子树中的最小值。\n- 对称方案\
  \ (Symmetric Scheme)：用于密码学的算法。\n\n# 第 6 章\n\n- Pronay Peddiraju, 印度 VIT 大学\n- P.\
  \ Swarnalatha, 印度 VIT 大学\n\n## 摘要\n本章的目的是观察使用增强现实和虚拟现实技术创建真实世界解决方案的 3D 资产开发和产品开发流程。为了实现这一目标，作者创建了模拟软件解决方案，用于协助企业的培训活动。该方法涉及使用增强现实\
  \ (AR) 和虚拟现实 (VR) 培训工具来降低成本。通过将 AR 和 VR 技术应用于培训，可以观察到成本的减少。AR 和 VR 技术的应用有助于利用手机、高性能计算机、头戴显示器\
  \ (HMDs) 以及其他技术通过模拟环境提供解决方案。通过实施良好的 UX（用户体验），这些解决方案能够能够改善培训、减少现场培训风险并快速降低成本。通过创建由引擎机制驱动的\
  \ 3D 仿真，AR 和 VR 技术的应用非常广泛，从纯计算机科学导向的应用（如数据和流程仿真）到机械设备和环境仿真。这可以帮助用户进一步熟悉潜在的场景。\n\n\
  ## 引言\n\n### 研究背景\n增强现实和虚拟现实允许用户使用头戴式设备 (HMDs) 以沉浸式视角体验计算机生成的环境和仿真。本项目旨在阐明创建增强现实和虚拟现实产品时涉及的一些开发流水线。通过利用创建这些涉及\
  \ 3D 资产和计算机生成关卡的模拟环境的软件，这些增强现实 (AR) 和虚拟现实 (VR) 产品可以用于为许多现实世界问题提供解决方案。这些解决方案从环境模拟器到企业和个人用于降低成本和提高效率的培训软件。创建这些产品使用的各种流水线包括\
  \ 3D 资产开发、使用游戏引擎进行关设计、实施所需的音频和声学、为目标平台创建所需的交付物以及在运行环境中的最终实施。\n\nAR 和 VR 技术的范围涵盖从游戏开发到创建可用于工业以降低运营成本以及实时可视化最终产品的培训仿真等多个领域。然而，受益于这些技术的行业将根据所创建产品的复杂性和需求，面临大量的初始投资。通常，AR\
  \ 应用对资源的消耗性较小，可以在手机上使用且初始投资较低；而大多数 VR 应用是庞大的、高资源消耗，并且需要强大的计算环境配合精确的 HMD，因此使得这种体验更加昂贵但也更流畅。\n\
  \n本论文旨在理解制作 AR 和 VR 解决方案涉及的开发流水线，并提供相应的定制化开发模型。从软件工程的角度来看，有许多模型适用于 AR 和 VR 领域，但为了获得可能的结果，拥有一个专门针对此类解决方案的模型是重要的。通过对涉及的流水线进行彻底研究，我们可以得出一些结论，帮助我们理解每个阶段所需的资源，并识别过程中的工作流。然后，可以通过在开发过程中涉及各种组件时实施并行模型来进一步简化工作流。\n\
  \n### 问题陈述\n增强现实和虚拟现实在应用于移动设备硬件时具有广阔前景，因为它可以触及更广泛的用户群体 (Jason Jong Kyu Park, 2013)。但由于开发过程和技术本身的复杂性，很难确定一个可以用于软件开发、维护以及在需要时进行迭代的稳固模型。引擎优化仍在持续进行中，以实现更精确的颜色、细节、追踪和操作\
  \ (Jacob B. Madsen, 2014)。这使得开发过程在利用游戏引擎方面变得越来越简单，但尚没有方法可以将每个流水线之间的工作流关联起来。VR 和\
  \ AR 的演进速度极快，正见证着许多软件插件的消失 (Dey, 2016)。需要能够对现有产品进行修改和迭代，以确保此类产品的扩展性和生命力。由于手持设备硬件能力的限制，在\
  \ VR 环境中成功渲染的 3D 模型多边形数量受到限制 (Ahmad Hoirul Basori, 2015)。这必须在开发过程开始前被正确识别并考虑到，以确保不会在平台支持方面遇到任何问题。创建一个能够感知用户位置和方向的智能\
  \ UI（用户交互）是至关重要的，以便在应用程序中提供更好的用户体验 (Hsin-Kai Wu, 2103)。制作 VR 和 AR 应用时面临的一个共同问题是提供良好的\
  \ UI 和 UX（用户体验）。\n\n通过对上述识别的问题进行审查，我们可以考虑每种情况并提出一个与 VR 和 AR 开发流水线匹配的模型，确保每个涉及的流水线都能以确保减少上述段落中列出的问题的方式进行处理。\n\
  \n### 动机\n本研究的动机是理解围绕 VR 和 AR 技术的开发过程，并有效地利用这些工具。通过创建基于 VR 和 AR 的仿真，我们能够创建一个更真实的\
  \ 3D 视角，用户会发现适应这种视角更加舒适。通过本研究，我们将尝试对比和分析实现 VR 和 AR 应用开发过程的各种方法论，并最终尝试为其概念化一个模型。\n\
  \n\n\n\n\n从软件工程的角度来看，由于 VR 和 AR 应用具有复杂且灵活的特性，很难对其进行分类并为开发实现一种特定的模型。为了能够可视化开发过程并对项目的时间线和性质得出结论，对这进行研究至关重要，以便实施更高效的方法论或遵循专门为这些应用设计的模型。\n\
  \n通过进一步理解 VR 和 AR 的工作原理，我们可以推出一种针对它们的开发模型。该模型将考虑到涉及的所有开发过程，从而提供应用开发的全景视图。\n\n# 开发流水线\
  \ (Development Pipelines)\n\n尽管在开发 VR 和 AR 应用时没有特定的规则，但常用的方法是使用游戏引擎配合某些 3D 建模软件。这种方法围绕以下过程展开：\n\
  \n- **产品概念化 (Product Conceptualization)**：理解产品需求的过程。对其运行环境进行分析。规划将涉及的资源。为目标平台实现所需的\
  \ `SDK`。理解项目范围及其未来的支持。\n- **资产开发 (2D 或 3D) (Asset Development)**：开发应用程序中所需资产的过程。这涉及创建\
  \ 2D 图像、3D 对象，甚至是生成的动画、纹理以及其他进入游戏引擎的元素。\n- **音频工程 (Audio Engineering)**：根据用例和应用创建所需音频的过程。音频以可以在游戏引擎中实现的格式进行设计和导出。\n\
  - **关卡设计 (Level Design)**：设计用户将所在的 3D 级的过程。这涉及在用户附近放置资产，并在 3D 空间内应用所需的位置实现所需的资产。\n\
  - **实现所需的 SDK (Implementing Required SDKs)**：在项目中链接所需的 `SDK`，以允许在应用内进行引用。`SDK` 将提供针对所用技术或平台的特定功能。\n\
  - **程序应用逻辑 (Programming Application Logic)**：将所有资产和关卡与控制它们在应用中运行的逻辑连接的过程。通常这个过程与关卡设计过程同步进行。应用逻辑将定义应用中每个元素的工作原理，其范围可以从\
  \ 1 个简单脚本到应用于各种场景元素的多个脚本不等。\n- **运行环境分析 (Analysis of Operating Environment)**：对运行环境进行分析，以考虑在上述环境中实现产品可能出现的特定需求。在开发的这一阶段，将对应用程序进行必要的更改，以支持目标环境。\n\
  - **目标平台测试 (Testing on Target Platform)**：这是开发周期中的一个至关重要的过程。软件开发完成后，测试阶段将识别应用中的任何问题。在目标平台上进行测试将允许开发者与应用交互，并识别在部署之前需要进行的更改，以确保产品顺畅运行。\n\
  - **部署 (Deployment)**：涉及将产品交付给目标用户群或客户的阶段。部署阶段需要对项目进行打包，并确保能够轻松安装到目标平台上。应该考虑到可能导致无法顺畅安装的情况，并相应实施更改以使过程成功完成。\n\
  - **支持 (Support)**：部署后的阶段，确保可以通过采取必要的步骤和对产品进行必要的更改来解决可能遇到的任何错误或问题。它允许开发者发布更新和修复，通过提高效率和延长寿命来维持产品的顺畅运行。\n\
  \n这些每一个开发过程都将在本文的后续章节中进行详细讨论。除了上述列出的步骤外，VR 和 AR 应用的开发可能涉及额外的步骤。为了我们的研究，我们将仅考虑最常用的方法，该方法在大多数情况下将实现上述步骤。\n\
  \n在本文中，我们将观察每个过程中涉及涉及的步骤，研究哪些任务可以并行执行以提高效率，可以优化上述流水线的方法，并设计一个可以对其实施的模型。由于所有资产的集成和使用都是在用于开发的游戏引擎中完成的，重点将主要放在如何从游戏引擎的角度改进过程上。\n\
  \n## 开发模型的必要性 (Need for Development Model)\n\n通过拆解每个开发流水线，我们可以对制作资产将其集成到产品中的步骤有良好的理解。研究将应用这一概念来理解哪些流水线可以同时进行，哪些流水线需要赋予更大的优先级。\n\
  \n该模型将为应用流提供洞察，以及如何创建一种减少风险、成本和其他可能导致开发过程中产生缺陷因素的进度方法。同时，该模型还将提供一个框架，通过执行必要的软件规划提高目标平台上的效率和性能。\n\
  \n为了对上述过程得出结论并推导出可以使用的模型，我们将实现一个 VR 应用来理解这些。拟议的系统将在智能手机上应用 VR，并在应用内实现 3D 对象以及音频的使用。\n\
  \n## 相关概念介绍 (Introduction to Related Concepts)\n\n拟议的系统是将简单的手持智能手机结合适用于 AR 和 VR\
  \ 应用的低成本软件解决方案。通过利用 `Unity3D` 游戏引擎的功能并结合 `GoogleVR SDK` 提供的功能，我们能够创建各种具有交互性和沉浸感的\
  \ 3D 模拟空间。用户对应用的控制仅限于单个按钮交互和基于视角的视觉选择。\n\n图 1 提供了 `GoogleVR Reticle Pointer` 在场景中用于创建视角选择的具体视图。\n\
  \n| 图 1. VR 场景视图 |\n\n| --- |\n\n| ![Figure978-1-5225-3643-7.ch006.f01](img/ch006.f01.png)\
  \ |\n\n| --- |\n\n## VR 相机设置 (VR Camera Setup)\n\n为了创建一个真实的 3D 透视视图，我们需要在设计的场景中使用\
  \ 2 台相机。如图 1 所示，VR 视图提供了使用左眼和右眼相机的渲染，随后合并为一个单一的透视视图，提供光照和深度信息。这允许用户体验非常真实的环境。\n\n\
  ## VR 准星指针 (VR Reticle Pointer)\n\n`VR Reticle pointer` 用于为用户在屏幕中心提供一个点，以便使用户可以识别自己的视角在哪里以及视图中的哪些对象是可操作的。从图\
  \ 1 可以观察到，当用户面前场景有一个可操作对象时，用户准星（屏幕中心的白圆）会放大并形成一个圆。在这种情况下，我们看到当用户看向它时，传送圆柱会变为绿色。\n\
  \n## VR 视口 (VR View Port)\n\n\n\n\n\nVR 视口实现了如前所述的双摄像头的使用。这双路摄像头在视口上提供两个视图，在 VR\
  \ 头显设备中使用时会创建一个单幅图像（由于人类的透视）。视口不仅考虑了生成的视图，还提供了深度、对比度，并根据场景光照提供了真实的图像。\n\n# 光照\n\n\
  光照是关卡设计中最重要的元素之一。如果场景内的光照处理不当，可能会影响关卡的外观，从而影响用户对场景中物体的感知。光照质量较低会导致场景中的物体无法提供相同水平的真实感，进而导致在应用程序中产生糟糕的用户体验。\n\
  \n# 用户界面\n\nVR 情况下的用户界面与使用游戏引擎开发游戏时实现的常规 UI 有些不同。VR 或 AR 应用的 UI 必须依赖世界空间（world space），而不是在屏幕上创建覆盖层（overlay），因为对于所有场景都不是理想的。UI\
  \ 的放置方式也允许使用户在游戏场景中清晰地看到它。良好的做法是确保无论用户的朝向如何，UI 始终面对用户。这将允许用户在世界空间中以更高的清晰度查看 UI。\n\
  \n# 文献综述\n\n从上述参考文档中，我们获得了多年来 VR 和 AR 开发过程的演变视角。从这些文档中识别出的差距列如下：\n\n1. VR 和 AR 技术的交互在大多数成本效益型实现中仍然受到限制。由于产品和开发过程的复杂性，如果初始投资较低，其实现通常会受到限制。这可以通过更好的规划和使用优化模型来解决，允许采取成本措施，从而将资金投入到可以帮助改进用户交互的其他技术。\n\
  \n2. VR 和 AR 的使用仍然不常见，因为使用这些技术的初始投资相对较高。同样，由于开发过程的复杂性和实现产品所需的技术成本，这是一个显而易见的问题。这不一定可以通过实施开发模型来解决，但该模型可能为实施解决方案提供空间，减少投资，使其成为更具成本效益的实现。\n\
  \n3. 硬件方面存在许多限制，限制了开发者创建基于 VR 和 AR 的解决方案的能力。这需要优化和提高效率。需要进行的优化应该考虑运行环境，通过提出有效的模型，可以在注意这些点的情况下进行规划和开发。\n\
  \n4. 随着引擎关卡复杂性的增加，VR 可能并不总是看起来是一个实用的解决方案。这使得开发者难以识别和修改在游戏引擎中创建的场景和关卡。通过使用实施适当规划阶段的模型，并在开发过程中实施参考文档，可以解决上述差距。\n\
  \n5. 由于使用头显时产生的朝向和条件，在物理使用和对物体施加作用力方面存在限制。用户会遇到心理压力，甚至可能感到恶心，因为 VR 开发者有权在观众面前模拟一个世界。因此，应避免在场景中增加力或以影响用户位置的方式操纵摄像头。这些条件可以通过编写有效的开发方法论来实现。\n\
  \n6. 对于 AR 和 VR 用户在长时间使用应用程序后观察到的恶心及其他心理影响问题，仍然没有完美的解决方案。虽然可以通过实施有效的开发方法论采取措施来避免这一问题，但由于该问题的主观性，在产品开发之前必须获得足够的数据。这将允许开发者考虑到观察这些体验的原因和如何观察到的各种结果，从而制造出更可靠、更易用的软件。\n\
  \n# 实现的架构\n\n图 2 是描述工作模型架构的框图，该模型用于对流水线的各个方面进行分析。\n\n| 图 2. 提议的系统架构。 |\n| --- |\n\
  | ![Figure978-1-5225-3643-7.ch006.f02](img/ch006.f02.png) |\n| --- |\n\n图 2 描述了增强现实（AR）平台的架构，该平台将用于分析参与其开发的所有流水线中的步骤和过程。\n\
  \n以下是提议系统架构图中所示每个子系统的功能的简要描述：\n\n* **应用程序子系统 (Application Subsystem)**：定义应用程序及其工作方法的代码块，并结合用于操作的用户界面的系统。\n\
  * **上下文子系统 (Context Subsystem)**：从各个子系统收集上下文数据的子系统。示例包括偏好和进度数据。\n* **世界模型子系统 (World\
  \ Model Subsystem)**：控制在应用程序的 3D 世界空间中使用真实世界元素的子系统。该子系统的实现是增强现实与虚拟现实解决方案之间的主要区别。\n\
  * **跟踪子系统 (Tracking Subsystem)**：使用设备上的传感器跟踪用户相对于 3D 空间的位置的子系统。跟踪模块在运行期间为应用程序提供平滑的视频流和运动流。\n\
  * **交互子系统 (Interaction Subsystem)**：控制用户输入和输出的子系统。用户与系统之间所有形式的交互都由该子系统控制。\n* **呈现子系统\
  \ (Presentation Subsystem)**：负责如何生成应用程序并将其呈现给用户。它包括渲染引擎和纹理仓库等模块。\n\n# 深度分析\n\n为了理解提议模型中的\
  \ 6 个子系统，我们将查看它们各自的功能图。每个子系统之间的功能和交互对于确保应用程序的流流以及确保应用程序中的任何内容在任何时间点都不是异步的至关重要。\n\
  \n## 应用程序子系统\n\n为了理解应用程序子系统，我们将参考图 3 以观察系统内部的链接和流。在这个子系统中，代码与各种库和引用的游戏对象交互，为实现提供意义。应用程序源代码中可能存在许多协程、单例或其他此类实体，用于控制应用程序的一个部分。单例的一个例子是使用游戏管理器代码脚本，它在设计的场景中只能以单实例的形式存在。\n\
  \n代码将与引擎编辑器和引擎头文件交互，以便在场景中提供功能。此外，代码还将与使用的 SDK 和插件一起工作，例如 `iTween`（一种常用的提供游戏对象过渡和动画的工具）。对\
  \ SDK 的引用为应用程序提供了所需的 SDK 功能，例如 VR 视网格（Reticle）的使用和双场景摄像头设置。\n\n## 上文子系统\n\n上下文子系统与所有子系统通信，汇总应用程序的上下文设置和细节，包括偏好、进度数据和用户设置的应用内设置。该子系统执行粗略的系统分析以理解工作原理并将其调节到推荐设置，以确保应用程序的流畅运行。\n\
  \n\n\n\n\n上下文文件与内部系统细节交互，并读取硬件中存在的预设，以便针对当前的特定工作环境优化应用程序的运行。\n\n# 世界模型子系统\n\n世界模型子系统主要用作应用程序中设计关卡的管理器。确保关卡的正确运行以及在应用程序内保持适当的视角视觉由世界模型子系统处理。在该子系统内部，我们通过在头戴显示设备（HMD）上的智能手机平台，根据用户的旋转、朝向和移动，考虑到相对于世界模型视图的实时运动追踪。\n\
  \n通过实现与设备中 `Tracker` 模块的链接，世界模型子系统能够从 `tracker` 读取数据，为世界视图提供准确的更新，并确保实时的稳定性能，因为现实世界中发生的任何移动都将立即反映在虚拟世界中。\n\
  \n# 追踪子系统\n\n追踪子系统负责利用 HMD 或配合 HMD 使用设备上的可用传感器对用户进行追踪。例如，在 `Oculus Rift` 或 `HTC\
  \ Vive` 等 VR 头显设备的情况下，追踪将使用 HMD 部分的某些特种传感器进行，以确保流畅性并保持实时 110 度的视野。而在手机的情况下（我们应用程序中实验的情况），我们观察到手机传感器（如陀螺传感器）以及某些情况下\
  \ `Google` 的 `Tango` 等特殊硬件的可用性可以应用程序内的空间追踪。\n\n该子系统主要与传感器交互，并确保从那里接收的反馈被其余子系统准确记录。\n\
  \n# 交互子系统\n\n该子系统使用可用的输入设备提供用户与应用程序之间的交互。在 VR 和 AR 情况下，场景中的交互元素可能很多，但为了允许用户与应用程序交互，我们的硬件能力是有限的。这就是为什么交互子系统用于控制各种排列组合，以最大化利用可用输入的效用。\n\
  \n该子系统只能与有限的输入交互，但这些输入通过转换为单个事件进行处理。因此生成的事件系统用于为用户提供所需的功能和交互。\n\n# 展示子系统\n\n该子系统由于其负责处理的任务，本质上是复杂的。它通过加载所需的纹理和利用渲染引擎为用户提供应用程序展示。这需要最大的计算能力，因为它生成了用户交互的关卡。图\
  \ 3 是在 `Game Engine` 中生成的关卡示例图像。\n\n| 图 3. 子系统 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch006.f03](img/ch006.f03.png)\
  \ |\n| --- |\n\n图 3 显示了引擎内从场景中两个客户端视角拍摄的场景渲染。客户端需要生成它们自己的视图，并且两者都需要实时生成。场景中的角色和场景中的武器由此子系统渲染，并提供实时输出，在这种情况下，该输出通过网络进行同步。\n\
  \n# 提议的设计\n\n## 概述\n\n为了从软件开发的角度进一步理解开发周期，提议的模型是深入探索以下内容，以对该过程得出结论性分析：\n\n创建 AR\
  \ 涉及的方法包括：\n\n* 1. 使用 `Unity` 创建环境。 \n* 2. 使用 `Autodesk Maya`  3D 模型。\n* 3. 将 `SDK`\
  \ 集成到应用程序中。\n* 4. 在设备上设置运行环境。\n* 5. 将应用程序与现实世界集成。\n\n该项目的范围延伸到通过使用软件解决方案提供丰富的用户体验，使其用户友好、具有交互性、简单，并作为\
  \ `Android` 和 `iOS` 等现有平台的更廉替代方案。\n\n## 预期结果\n\n能够创建一个在设备上运行并与现实世界交互的虚拟现实应用程序。应用程序将使用一系列技术提供解决方案。这些技术包括空间追踪、基于\
  \ `GPS` 坐标的追踪和现实视角。因此，开发此应用程序的结果应为与操作系统的集成提供进一步的清晰。\n\n# 实现\n\n## 应用程序设计\n\n下面是作为本项目一部分开发的实现。为了理解\
