  \ |\n| ![Figure978-1-5225-3643-7.ch001.f01](img/ch001.f01.png) |\n| --- |\n\n对于数据存储和管理，可以使用\
  \ `DSpace` 来存储和维护大量的异构数据。`DSpace` 是一个开源的动态数字存储库，在使用大数据的同时用于图像分析。它实现了数据的免费访问。\n\n\
  本章使用户能够理解结合图像数据大数据处理的与遥感相关的主要问题和困难。在分析了解决这些问题的建议方案后，用户将能够理解开发新框架、工具或软件系统以满足当前需求的过程。\n\
  \n# 背景\n\n大多数遥感数据采集是为了分析病害状况、植物生长、污染、土地利用、道路交通拥堵以及灾害影响等。解决这些问题的方案之一是开发可能的计算模型，这些模型为数据分析表示多个模块。为特定问题创建主题地图需要有意义的分析，旨在展示出满意的结果。\n\
  \n各种工程问题的分析解决方案需要在特定的语境下进行稳健的分析。从这个角度来看，必须解决与场景相关的各种问题，因为不同场景的复杂性随时间而变化。对于大多数现有的开发工作，分析和开发计算模型是使用图像的遥感应用的主要动力。\n\
  \n通过多光谱图像传感采集的图像数据可以提供元素级的信息。它也可以通过像素间的关系提供复合层级的信息。在某些应用中，输出信息被用于评估分析师的用户信任或专家建议。软件程序验证了用户提出的假设。在大多数情况下，分析的失败是由于用于优化的用户定义性能指标与可能产生预期结果的目标之间存在兼容性问题。因此，每项分析都需要迭代应用。分析中涉及的对象的排序和最优选择可能是未知的。因此，一种有效的方法必须对图像遥感和分析应用中的对象使用合适的选择和排序技术。\n\
  \n大多数实际工程问题无法百分之百、完美地解决，因为软件系统的性能在很大程度上取决于错误容忍度、资源可用性以及处理所需的时间。工程解决方案需要对算法进行迭代分析的实验。本章提出的新计算模型将在提新的解决与图像遥感和大数据相关的各种问题的新系统时将有所帮助。\n\
  \n大豆和玉米的作物相关映射已经在区域尺度上进行，专注于热带和温带平原（Arvor, Jonathan, Meirelles, Dubreuil, & Durieux,\
  \ 2011）。大多数方法已使用土地覆盖类的光谱特征进行分类，基于基于监督学习方法或基于无监督学习方法。\n\n遗传编程（`GP`）利用自然选择原理通过软件程序发现信息（Alavi\
  \ & Gandomi, 2011）。事实上，`GP` 是遗传算法的一种特殊版本，其中编码的个体是软件程序而非二进制字符串。\n\n`GP` 在最近的一些工作中关注行为表征，一些研究将\
  \ `GP` 作为解释遥感数据的工具，并用于分析地面模式、物体模式和变化检测等。\n\n温度、营养和病害的影响通过开发高效特征分类模型得到了预测（Kuttiyapillai\
  \ & Rajeswari, 2014）。该计算模型专注于使用大间隔最近邻分类器进行提取特征分析。\n\n一种提取食品安全信息的方法在题为《从生物文本源提取面向任务的信息》的文章中被讨论（Kuttiyapillai\
  \ & Rajeswari, 2015）。它专注于信息提取和利用动态规划技术从序列中寻找相关基因。\n\n在农业领域，需要区域的详细信息来改进产量估计，因此可以将其作物产量模型（Lobell,\
  \ Thau, Seifert, Engle, & Little, 2015）。为了发现区域相关和作物相关的见解，涉及计算模型的图像遥感将是一个可行的方案。\n\
  \n另一种基于机器学习的方法已被开发用于选择和组合特征组。它允许用户提供正反面示例。这种方法改进了用户交互和查询质量（Minka, & Picard, 1997）。下文段落讨论的两种方法基于信息挖掘的概念。\n\
  \n一些现有的方法不能适应不同的情况以满足用户需求。因此，图像检索已基于相关性反馈进行开发（Rui, Huang, Ortega, & Mehrota, 1998）。此外，系统设计根据用户的建议搜索图像，考虑到反馈。\n\
  \n在过去的十年里，传统的数据库系统被用于存储考虑颜色、纹理和形状等特征的数据。进一步的发展关注基于区域的图像检索，因为基于内容的图像检索由于图像和信息内容的增长而不再理想（Veltkamp,\
  \ Burkhardt, & Kriegel, 2001）。这种方法被证明是处理图像内容变化的性的可行解决方案。在这种方法中，每幅图像被分割，并使用对象特征对单个对象进行索引。\n\
  \n\n\n\n由于大气分子引起的瑞利散射、臭氧、水蒸和其他气体的吸收，以及大气溶胶的吸收等大气影响，数据采集环境会频繁发生变化。因此，数据修正变成了一项计算密集型任务，需要创新的误差修正方法，例如用于处理高分辨率图像数据集的标准\
  \ `6S` 辐射传输算法 (Vermote, Tanre, Deuze, Herman, & Morcrette, 1997)。否则，数据处理在实践上是不可行的。\n\
  \n# 本章主要重点\n\n遥感技术的进步和互联网访问的普及增加了通过卫星成像技术从不同地点采集的数据量。单个卫星数据中心采集的遥感数据以每天数 TB 的速度急剧增长。近期的研究表明，由于高分辨率地球观测数据的出现，采集的数据甚至将超过\
  \ Exabyte 范围，这导致了图像数据方面的维度灾难问题。这些数据在某种意义上被称为大数据。\n\n地球系统变化的方式将改变当前全球地球数据的准确性和更新。为了处理在规模和动态性方面日益的复杂性，多传感器遥感数据和时空大数据挖掘对于大数据处理非常有用。由于遥感数据的快速增长，出现了主要的数据密集型计算问题和挑战。因此，处理与大数据相关的计算复杂性的方法必须转向高性能计算范式。\n\
  \n由于对数据可用性的要求以及处理海量数据所需的巨大计算力，基于集群的高性能计算在遥感应用中仍然是一个巨大的挑战。此外，遥感数据不规则的数据访问模式增加了 I/O\
  \ 负担，使得常见的并行文件系统不再适用。此外，当前的任务调度寻求以数据可用性为主要考虑的计算资源之间的负载均衡。为了降低复杂性，可以将大任务分解为具有顺序约束的小型数据依赖任务。处理这一关键另一种方法是引入任务调度优化技术，同时尝试实现更高的性能。\n\
  \n此外，特别是支持消息传递接口 (`MPI`) 且支持规模不断扩展的多层次结构的集群系统，在对遥感应用使用并行编程技术时，会导致困难且易错的任务。在不久的将来，对实时处理日益增长的需求进一步增加与遥感应用相关的问题。然而，与传统系统不同，新兴的遥感系统可以对环境中采集的传感数据提供及时的实时处理。\n\
  \n遥感被定义为远距离感知物体或表面以识别其特征的技术。它需要数据采集仪器或设备。遥感数据被视为大数据，因为大数据不仅是指导致计算复杂性的数据量和速度，多样性、复杂性（或高维）和可靠性等其他问题使得这些数据成为大数据。\n\
  \n通常，遥感大数据的处理涉及流程中的以下阶段：卫星观测网络、数据采集与记录、遥感数据处理（预处理、中间处理、信息抽象与表示）以及遥感应用运行。\n\n预处理技术被用于消除噪声和修正不一致的数据。它涉及平滑、离值检测和降维等技术。中间处理组件负责相关数据的进一步修正、修改和合并。信息抽象和表示将涉及机器学习技术，以执行分类、聚类和关联分析等高效任务。\n\
  \n遥感和监测的一些示例包括：灾害响应与监测、气候变化控制与监测、水资源管理与使用监测、工业运行控制与监测、欺诈检测与监测等。示例传感器支持空间传感器、时间传感器、温度传感器、湿度传感器、水分传感器等。遥感和的示例数据包括\
  \ GPS 数据、GIS 数据和其他传感器的数据。海量遥感数据的处理带来了挑战性；其中一些问题是：\n\n## 1. 遥遥感大数据的困难。\n\n自然地，从不同数据中心捕获的遥感数据是分布式的，这些数据中心通常很远，并通过互联网连接。因此，数据管理组件必须批判性地管理这些分布的、大量的量，以提高互操作性和全球数据共享。\n\
  \n这意味着对引入更多存储设备和提高易访问性具有需求。为了应对这些挑战，需要新的技术和方法。此外，遥感数据的高维特性使得分布式数据共享和访问变得更加复杂。在尝试组织和将多维遥感图像映射到一维数组时会出现一个主要问题。\n\
  \n此外，遥感数据分区需要合适的空间填充曲线，而高效的数据组织取决于数据可用性。此外，与遥感数据相关的结构化复杂元数据使得数据处理变得稍微复杂了一些。它也影响了元数据存储和索引的有效能。\n\
  \n## 2. 不规则的数据访问模式。\n\n关键数据处理和数据共享组件需要高数据可用性。大多数遥感应用在不规则的数据访问模式上进行处理。示例问题包括：由于算法计算与遥感数据之间不同程度的依赖关系引起的不规则\
  \ I/O 模式和 CPU 负载增加。\n\n## 3. 大数据的加载与传输。\n\n由于海量遥感大数据的数维性，数据加载、内存管理和数据传输变得稍微复杂且低效。当考虑到多维图像和复杂的元数据时，图像大数据的容量有时会超过计算机内存的有限容量。\n\
  \n因此，需要大型、高效的数据结构来在本地内存中存储这些海量的遥感大数据。此外，处理节点之间的数据传输需要高带宽来以数据块的形式传输图像大数据，因此当要通信的数据量很大时，这将是一个耗时的过程。\n\
  \n## 4. 大量数据依赖任务的调度。\n\n水资源管理和远程监测的大规模设计建模将涉及大量的的小型数据依赖任务。因此，主处理模块变得极其困难，并可能需要顺序约束来处理数据依赖任务。为了获得良好的性能，需要优化的调度算法。有时，数据依赖的解耦有助于实现更好的执行路径选择。\n\
  \n## 5. 高效的并行编程。\n\n\n\n\n传统的聚类系统必须处理多层层次组织结构和快速增加的可扩展性问题。它需要高效的并行编程技术来处理遥感和实时监控应用中的数据密集型计算任务。最近，`OpenMP`被设计为共享内存集群计算的新范式。\n\
  \n## 解决方案与建议\n\n本节介绍了处理相关问题、争议或问题的解决方案和建议。为了解决与遥感图像感知相关的各种问题，本章以计算模型的形式提供了解决方案，并建议了一些问题解决技术。\n\
  \n## 1. 高性能计算模型\n\n需要复杂模型来处理大量多传感器和时间数据集的遥感与监测，可能需要应用广泛使用的预处理算法。对于使用大量地球观测的问题，其计算和存储需求通常超过了单一计算平台的可用能力。\n\
  \n为了应对这种计算复杂性，引入了一种新的计算模型，该模型将可扩展的分布式异构网络与高性能软件程序相结合，用于海量遥感数据的处理、索引和组织。图 2 中的高性能计算模型使用分层数据管理来实现逻辑传感器处理节点之间的负载均衡，并关注于最小化\
  \ I/O 开销。\n\n| 图 2. 遥感图像感知的高性能计算模型 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch001.f02](img/ch001.f02.png)\
  \ |\n| --- |\n\n该计算模型处理遥感图像数据的误差纠正，包括主要组件，如使用分层连接组件进行图像分割，随后通过计算函数检索数据分布，以及基于层次的数据组织（后者允许按需处理和检索信息）。这种方案可以通过添加或删除某些软件模块，来改进基于遥感的应用中的计算时间。\n\
  \n大多数信息分析系统都需要来自各种来源和仪器的数据融合。在生态系统响应建模中使用这些数据集时，不同类型的数据在处理海量数据存储和高计算复杂性方面面临挑战。因此，遥感数据的获取、处理、映射和转换涉及复杂的建模和增加的计算复杂性。涉及卫星数据各种预处理（例如土地利用数据）的计算任务包括复杂的邻域操作。\n\
  \n例如，全球土地覆盖数据集的总存储需求有时需要处理 TB 级（Tera bytes）、G 次浮点运算（GFLOPs）或 PB 级浮点运算（Peta FLOPs）的数据处理能力。因此，需要高性能计算技术来从地球观测系统中获取所需的信息。\n\
  \n尽管已经为处理异构分布式环境的大数据集开发了创新的并行处理算法，但仍有进一步改进和新开发的良好途径。通常，遥感图像处理包括预处理、图像分割、通过函数检索分布以及用于处理、存储和检索数据的软件模块等步骤。\n\
  \n## 2. 基于云的大数据处理模型\n\n由于海量实时数据，寻找任务相关的信息已成为了一项繁杂的任务。为了提取有意义的信息，系统在收集遥感数据的同时需要高效的数据分析、聚合和存储机制。图\
  \ 3 中的基于云图像大数据处理模型由四个主要单元组成，如遥感数据采集（`DA`）、本地预处理（`LP`）、本地存储与处理（`LSP`）以及云存储与检索（`CSR`）。\n\
  \n| 图 3. 基于云的遥感图像大数据处理模型 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch001.f03](img/ch001.f03.png)\
  \ |\n| --- |\n\n云数据处理在处理遥感大数据时具有处理扩展性问题的能力。使用地球观测系统的系统需要进行本地处理以纯化通常不一致的原始数据。由于大数据的大小和复杂性，传统的数据库管理在处理大数据方面面临困难。\n\
  \n大数据处理的主要挑战包括：1) 体量（volume），指从遥远地区产生量数据；2) 速度（velocity），指数据生成和共享的频率和速度；3) 多样性（variety），指从各种来源收集的数据类型的多样性。处理这些挑战的系统可以使用较小的子集通过相关性分析创建结果集。传统系统的主要缺点包括：1)\
  \ 遥感连续流数据的数据转换困难；2) 从遥远地区收集的数据不是适用于进一步数据分析的有效格式；3) 远程传感器网络可能会产生大量的原始数据。\n\n为了应对遥感大数据分析中的各种挑战，可以开发一种结合离线数据存储滤波与负载均衡子系统的系统，以提取有用信息。大数据系统的输入来自社交网络、卫星图像、传感器设备、Web\
  \ 服务器、金融数据存储和银行数据存储等。\n\n在这个计算模型中，负载均衡器通过将实时数据分发到基站正在处理数据的服务器来平衡处理能力。它还可以增强系统的效率。数据提取发现了数据模型中的洞察并发现信息以创建数据的结构化视图。在这里，应用机器学习技术来处理和解释图像数据，以生成地图和摘要结果。处理海量大数据的系统可以在\
  \ `Python`、`R Analytics platform` 和 `Hadoop` 等开发平台中使用 `MapReduce` 实现。\n\n使用 I/O\
  \ 优化的并行处理模型\n\n提供按需信息的密集数据应用需要高效的索引方案和数据替换技术以实现最大的并行 I/O 吐量。这些技术被广泛用于处理不同分辨率的时空数据集。\n\
  \n大气效应会根据时空数据的背景而变化，并且取决于波长和观测几何结构。有时组件效应的解耦在遥感应用中非常有用。基于特征选择的误差消除对于处理错误数据也有帮助。\n\
  \n基于连接组件的并行算法在处理复杂的计算密集型任务（如遥感图像区域分类的图像增强和分割）时可以高效执行。这意味着这类算法可以提高准确性和处理时间。\n\n纠正方法涉及两个步骤。第一步是从图像中估计大气属性。第二步是检索表面反射率。该方法涉及以下步骤：\n\
  \n* • 输入图像（`i.e. 像素窗口`）\n\n*   • 识别暗目标（`i.e. 密植被`）\n\n*   • 设置反射率阈值\n\n*   • 计算反射率小于设定阈值的像素平均值\n\
  \n*   • 针对暗像素估计专题波段器（`TM`）的反射率\n\n\n\n\n*   使用查找表来估计专题制图（Thematic Mapper）波段的气胶光学厚度。然后，检查估计值是否大于或等于设置的气胶光学厚度。否则，使用较小的阈值重复之前的步骤，直到第一个气胶光学厚度大于或等于第三个气胶光学厚度。\n\
  \n*   利用波长与气胶光学厚度之间的指数关系推导出系数。\n\n*   一旦确定了所有 TM 波段的气胶光学厚度，则使用查找表对窗口中心像素进行误差校正。\n\
  \n*   通过增加像素位置来移动窗口，直到通过重复执行覆盖整个图像。\n\n图像遥感并行处理模型涉及的流程步骤如图 4 所示。\n\n| 图 4. 图像遥感并行处理模型\
  \ |\n| --- |\n| ![Figure978-1-5225-3643-7.ch001.f04](img/ch001.f04.png) |\n| ---\
  \ |\n\n在这个计算计算模型中，验证了估计测量值与地面或标准测量值之间的相关性。应用误差校正方法后的结果图像比原始图像更清晰。此外，气胶光学厚度的空间模式与普通图像相比保持一致性。在所有处理器或处理节点之间同步交换消息的实验设置必须通过以太网和高性能交换机连接所有处理器。使用单程序多数据（SPMD）模型的方法适用于在输入图像的不同部分上并行运行相同的代码。\n\
  \n为了实现并行处理，将输入图像划分为若干块。然后，将等大小的块分配到所有处理节点中。根据节点数量的函数来衡量线性运行时间。该计算模型可以通过高效的误差校正方法最大限度地缩短运行时间。同时使用定性和定量分析来提高计算模型的可靠性。各个组件的模块化实现方法允许对大气属性进行于修改。遥感图像的分割用于形成包含相似类型像素区域的聚类。这些区域可以被归类以提高预测准确性。\n\
  \n# 遥感图像中的信息挖掘模型\n\n基于内容的信息挖掘系统侧重于管理和探索大量的遥感图像数据。这类系统可能包括离线处理，以及一个用于在线提取和处理的接口。离线模块提取图像特征，并尝试改进压缩、数据削减、无监督图像索引的生成以及在数据库中存储内容。此外，图像内容的语义解释（即用户的兴趣）与基于内容索引的贝叶斯网络相关。由于该方法仅获得少数训练样本，链接计算可以通过在完整的图像库上进行在线搜索来完成。图\
  \ 5 展示了遥感图像的信息挖掘模型。\n\n| 图 5. 遥感图像信息挖掘模型示意图 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch001.f05](img/ch001.f05.png)\
  \ |\n| --- |\n\n在过去的几十年里，光学传感器、合成孔径雷达和其他卫星传感器等图像卫星传感器获取了大量的图像场景。未来，由于高分辨率卫星传感器的数据采集，实时图像传感数据量将进一步增加。先进的系统通过使用地理坐标、采集时间和传感器类型传递查询来访问这些数据和图像。使用传统系统收集的信息通常相关性较低，因此只能使用少数图像。因为相关性是根据考虑其结构、模式、对象或散射特的图像内容决定的。\n\
  \n在这种方法中，建议开发一种结合了离线图像传统数据库概念和带语义解释的在线搜索的高效信息挖掘系统，应用贝叶斯网络进行高效推理。该系统可以根据用户的兴趣做出决策。基于图像内容的语义解释，结合内容索引的贝叶斯网络，可以从目标库中搜索图像。\n\
  \n# 图像分析与挖掘的计算方法\n\n遥感在提供有关作物生产力和环境的实时信息方面起着至关重要的作用。由于重复训练的成本、解释的不一致性以及处理天气和作物生长的难度，传统的映射是非常困难的。在本节中，讨论了用于分析和挖掘杂交和番茄的自动方法。使用手动编写的规则构建决策树分类器。当需要进行多年制图时，自动方法将更具优势，因为不需要重新训练。\n\
  \n利用短波红外波的表面反射率以识别两种作物之间的相似性。制图区域可以通过标准值进行验证。混合像素的影响也可以通过分类技术来识别，并可以使用参考数据集评估结果图。此外，考虑到不同的尺度和高分辨率图像，自动映射可以应用于其他图像序列。在在该模型中使用以下变量进行测量和分类：\n\
  \n*   V[b]:非生长季节背景的植被指数值。\n*   V[a]:生长周期内植被指数变化的振幅。农作物的 V[a] 值高于自然植被。杂交番茄的平均 V[a]\
  \ 大于原始作物。\n*   p, q：对应增加和减少段的变化率参数。在这种情况下，农作物周期的植被指数值快速增加或减少。\n*   D[i], D[d]:增加或减少速率高时的段中间日期。这些变量被用作快速生长和需要收获日期的指标。\n\
  *   D[1], D[2], D[3], D[4]:表示曲线二阶导数达到局部最大或极值的时刻。D[1] 表示起始日期，D[4] 表示生长季节结束日期。\n*\
  \   L：表示 D[4] 和 D[1]之间的差。它代表生长季节的长度。长度应保持一致性。杂交番茄的生长时间比原始番茄短。\n\n\n\n\n在这里，自动化映射是基于树状结构的分类规则执行的。代表植被变化和生长期间过渡阶段的变量，对于根据作物周期进行季节分类非常有用。图\
  \ 6 描述了作物图像模式映射的数据和控制流表示。\n\n| 图 6. 作物图像模式映射的数据和控制流表示插图 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch001.f06](img/ch001.f06.png)\
  \ |\n| --- |\n\n如果季节变异性较大，可以使用限制较少的规则来提高算法在不同条件下的重复性。此外，有必要基于物候光谱变量（利用不同阶段的光谱特性）制定额外的分类规则以提高分离效果。\n\
  \n# 遥感领域的机器学习方法\n\n机器学习是人工智能的一个子领域。为了开发能够从机器可读数据中学习的算法，机器学习已经进化为数据挖掘、电信、市场分析和其他软件应用等许多应用领域的关键技术。它包括算法，如\
  \ `决策树`、`贝叶斯推理`、`朴素贝叶斯`、`k-近邻`、`支持向量机`、`神经网络`、`自组织映射`，以及集成方法，如`随机森林`、`遗传算法`、`基于案例的推理`、`遗传编程`、`模糊逻辑`、`神经模糊`等。将机器学习技术应用于图像遥感的主要动力是提供多元、非线性且非参数的回归或分类。它在科学和工程中起着至关重要的作用。机器学习能够处理与地球科学和遥感相关的各种问题。\n\
  \n机器学习有两类方法，即监督和无监督，用于开发非线性系统的回归方法或分类方法。涉及这种技术的系统将涉及少数或数千个变量。在机器学习中，训练数据集由预分类的图像数据向量组成。训练样本的一个集可能不需要单独验证。如果理论知识不完整，且有一些观测结果和数据，那么机器学习将有助于解决这类问题。\n\
  \n在过去的几十年里，机器学习已成为地球科学和观测系统中的广泛使用的技术，例如土地利用检测、海洋变化检测、道路提取以及大气、灾害预测、作物病害预测、活动检测等。在此，总结了机器学习的若干相关应用，以理解其在地球科学和遥感中的适用性。主要重点可能分为两类：一类是如何应用多元非线性非参数回归，另一类是如何使用多元非线性无监督分类。\n\
  \n机器学习实际上是一种通用近似技术，从一组训练数据中学习潜在的行为模式。关于该技术的另一个事实是，它不需要关于数据之间关系性质的先验知识。机器学习的应用包括五个领域：1)\
  \ 计算昂贵的确定性模型；2) 非确定性模型，或可以从现有数据导出的经验模型；3) 分类模型；4) 聚类模型以及；5) 混合模型。`模糊逻辑`、`神经模糊`、`模糊遗传`、`神经计算`成功应用的研究可以在油气勘探、智能储层勘探、作物面积制等领域找到。\n\
  \n在所有其他机器学习方法中，`遗传编程`（GP`）在遥感和图像分析领域的应用被限于极少数领域，而且是新的。尽管`支持向量机`（SVM`）和`人工神经网络`（ANNs`）等技术已显示出良好的性能，但这些机器学习遵循黑箱模型。也就是说，它们无法产生实际的预测。因此，`GP`被认为是处理遥感应用中实际问题的一种可行技术。\n\
  \n`GP`的变体，即`多表达式编程`（MEP`）、`线性遗传编程`（LGP`）和`基因表达编程`（GEP`）用于预测粉质和粘土质软岩石的单轴压缩强度和拉伸强度。与其他使用参数作为预测变量的模型相比，GP\
  \ 模型提供了更高的预测，例如完整岩石的弹性模量、单轴压缩强度、每米节隙数量、岩体质量评价、干密度和地质强度指数。在岩体设计中，`GP`可以根据重量吸水、孔隙率和实际重量估计岩石的单轴压缩强度。\n\
  \nGP 在遥感和大数据分析中的一些示例应用包括：利用多变量气象卫星数据估计灾害地区附近的强降雨、使用图像监测水质、食品中化学污染物制图、使用图像阈值检测滑坡、作物种植面积制图和土壤水分分析。图像遥感的主要过程涉及图像表征和图像分类。\n\
  \n## 图像分类\n\n图像分类根据图像特征将图像分配到预定义目标类中的过程。它包括预处理、特征提取、目标检测、目标分割和目标分类等技术。图像分类是视频监控、生物医学成像、交通检测和导航、工业监控、遥感和实时监控等应用领域的一项挑战性任务。\n\
  \n用于图像分类的一些常用机器学习算法包括`支持向量机`、`k-近邻算法`、`人工神经网络`、`遗传算法`、`期望最大算法`、`C4.5 决策树算法`、`AdaBoost`、`CART`、`k-means\
  \ 算法`等。大多数机器学习算法用于预测未来趋势或质量决策。涉及机器学习的数据挖掘任务旨在发现信息并生成大量规则。大数据挖掘中，图像分类主要关注在预定义的类别或目标标签下分类新物体或未知向量。\n\
  \n## 图像挖掘\n\n图像挖掘是从大型图像集中提取有意义图像内容的领域之一。图像分类根据图像数据之间的自然评估和关系自动将图像像素分类到适当的目标中。它有两类分类，即监督分类和无监督分类。\n\
  \n\n\n在灾害响应领域，航空影像可以在几小时内通过无人机获取，而卫星影像的获取可能需要数天。此外，航空影像的空间分辨率比卫星生成的影像更高。为了实时处理海量的航空图像数据，应用了机器学习来提供解决方案。众包为感兴趣的特征提供了标注方法，例如受损的避难所、被碎片堵塞的道路、坍塌的建筑等。这些航空图像的特征已用于训练监督式机器学习系统，这些系统能够学习如何从未知或新的图像中解释特征。此外，灾害响应系统还包含一个文本处理模块，可向救援队发送信息。解决此问题的另一种方法是开发一种既能处理航空图像又能处理卫星图像的混合系统。\n\
  \n# 未来研究方向\n\n用于分析和解释的图像大数据遥感具有若干特殊特征，如动态行为、多尺度、多源、高维、同质性和非线性特征。虽然分析哪些是这些特征与数据获取密切相关，但观察发现，内在特征包括动态状态、多尺度和非线性特征。然而，其他特征是遥感大数据的外在特征。\n\
  \n遥感提供了一种快速直接从地球表面获取数据的方法。信息科学和环境工程中大数据遥感的新兴趋势使得遥感和监测技术应用于各个领域，包括生态学、地震预测与分析、土壤污染、空气污染分析、水污染分析、环境地质、固体废物检测与监测、路灯监测、作物病害分析与损失预测、工业欺诈检测与监测、天气预报、客户行为预测、患者监测、家电监测、工业气体泄漏检测与监测、能源消耗和可持续发展等。本章讨论的计算模型了特定模型在问题领域的重要性。\n\
  \n近年来，印度、美国和俄罗斯等主要国家发射了遥感卫星。遥感特征和数据根据图像分辨率、光谱、成像模式、重访周期、幅度和时间而不同。现在有不同的遥感系统。低分辨率卫星成像示例包括气象卫星\
  \ `MODIS` 和微波卫星 `Envisat`。中分辨率卫星成像示例包括陆地卫星（如 `Landsat`）、长重周期卫星（如 `EO-1`）、微波卫星（如\
  \ `Terra` 和 `RADARSAT`）。高分辨率卫星成像示例包括 `QuickBird`、`IKONOS` 和 `WorldView`。这需要高效的调查和技术来应对日益增长的数据多样性。\n\
  \n卫星还可以根据在观测区域的重访周期进行分类。例如，静止轨道业务环境卫星 (`GOES`) 可以提供来自地球表面的高质量、连续的时间相关观测数据。使用短重访周期的卫星包括\
  \ `MODIS`、`WorldView` 和 `RapidEye`。\n\n处理遥感数据的另一个挑战是处理日益增长的或海量的数据。在图像遥感中，对于单个场景，数据量可能达到\
  \ GB 级或太字节（TB）级。某国在特定时期收集的卫星遥感数据作为历史数据维护。这些数据量可能达到拍字节（PB）级，全球维护的大型存档可能达到艾字节（EB）级。因此，遥感数据被称为“大数据”，需要高效的大数据处理技术。\n\
  \n## 结论\n\n本章介绍了图像遥感和大数据处理的不同计算模型。将遥感图像信息以分层形式或具有不同语义抽象的适当形式表示，是基于计算模型所涉及的层次。例如，贝叶斯模型可能包含以下层次：1)\
  \ 使用信号模型提取图像特征和元特征；2) 通过对预提取的图像参数应用无监督机器学习（或聚类），为每个模型获取信号类词汇；3) 最后，通过贝叶斯网络将用户感兴趣的内容（即语义标签）与这些词汇的组合连接起来。为了从图像数据中推导出涵盖类别标签或目标标签的信息，系统必须根据用户提供的输入样本学习概率链接。\n\
  \n从遥感图像中自动提取有意义的信息涉及信息挖掘技术以及对从观测图像数据中提取的信息进行稳健性评估。该模型侧重于通过选择正确解释图像内部结构的先验模型从图像中提取结构信息。在最低层次上，应用随机模型从图像中获取空间、光谱和几何结构信息。近年来，这种参数模型被发现适用于描述图像中的空间信息。高阶模型主要用于处理具有不同尺度特征的复杂结构（例如山、河等）。当邻域大小增加时，参数数量增加，并且必须面对不同参数的平均效应。结果是提取特征的判别能力下降可能导致数据解释失效。\n\
  \n为了克服这一缺点，可以生成一个多分辨率图像数据立方，其中原始图像位于数据立方的最底层，较高层是图像的低分辨率表示。通过将使用吉布斯随机场的纹理模型应用于有限邻域大小的层，可以从不同结构中提取各种信息。它为表征大量空间信息提供了一种方法。特征提取的输出可能有大量数据，在实际应用中可能难以存储和管理。此外，聚类可能会由于大量的数据减少而降低准确性。为了消除不必要的结构并避免耗时的相似性检查过程，对所有图像进行聚类。即使模型生成了大量的类，算法也可以通过应用某些专注于并行处理的计算模型来提高系统效率，从而产生理想的结果。\n\
