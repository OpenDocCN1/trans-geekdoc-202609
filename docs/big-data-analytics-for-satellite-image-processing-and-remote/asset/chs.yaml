  \ | 数据存储、实时分析、社交媒体集成 | 分析与可视化 |\n\n## 5. 大数据面临的挑战\n\n`Bigdata` 一词意味着它具有海量数据。随着许多行业产生从太字节（terabytes）到拍字节（petabytes）的数据，处理原始数据以为业务提供益处的需求不断，人们对数据存储和处理的关注也随之增加。在特性、数据分析和处理能力方面，`Bigdata`\
  \ 潜在地面临着许多挑战。在本节中，我们主要讨论主要研究领域中的挑战（`X. Yi`, `F. Liu`, `J. Liu`, & `H. Jin`, 2014）。\n\
  \n### 5.1 数据复杂度\n\n`Bigdata` 从不同来源收集大规模数据并解决计算问题。`big data` 最显著的特征是数据类型、不同的结构以及数据样本之间复杂的通信。“Big\
  \ data` 指数据（或）`Information`，始终可以通过分析、可视化等先进技术进行处理。许多业务机构拥有大量数据，但由于缺乏高效系统，这些数据无法被妥善利用，导致数据利用率持续下降（`Oracle\
  \ Big Data Strategy`）。每个业务机构每天产生几太字节的数据，要处理信息检索、发现、分析、情感分析等传统方法，但它们并不适用于海量数据。目前，我们对大数据的分布规律和关联关系尚无良好的了解。现在技术日益发展异，移动设备和传感器在产生数据并进行存储方面发挥着重要作用（`Open\
  \ Source Distribution of Hadoop`）。例如，铁路公司决定每隔几英尺安装传感器，以监控导致火车事故的内部和外部事件。通过监控每一个事件，铁路人员知道了哪些部分需要更换，哪些部分需要维修（`James\
  \ Manyika`, `Michael Chui`, `Brad Brown`, `Jacques Bughin`, `Richard Dobbs`, `Charles\
  \ Roxburgh`, & `Angela Hung Byers`, 2011）（`Big Data, Big Impact: New Possibilities\
  \ for International Development`）。\n\n### 5.2 计算复杂度\n\n由于对数据复杂度和计算复杂度之间关联缺乏深度理解，这种问题随之产生。基础问题是理解大数据复杂性的本质特征。对复杂性理论的基础研究将为复杂性及其形成方式提供清晰的视角。\n\
  \n\n\n\n\n大数据包含三个主要特征：快速变化、多源性、海量。这些特征使得机器学习、数据检索、数据分析等传统处理方法变得难以胜任。需要新的大数据计算工具来克服由于数据独立同分布性带来的问题，以生成准确的统计数据。为了解决大数据问题，我们需要检查计算复杂性和所使用的算法。由于大数据在存储和网络上的普及，通过社交网站生成的数据所需的可用存储空间已不再足够。服务器将资源密集型数据卸载到云端，并发送更多数据到云端进行处理。仅仅将数据卸载到云端并不能解决问题，因为我们需要收集并检索从\
  \ TB 级到 PB 级的所有数据。将所有数据全部卸载到云端将花费大量时间，而且数据每秒都在变化，会导致数据难以实时更新。通过两种方式可以避免数据从存储位置到处理位置的迁移：一是在存储位置进行处理，二是仅卸载需要的数据（这将花费更多时间进行处理）。为存储的数据建立索引可以方便检索过程，并缩短处理时间。为了解决大数据的计算复杂性，我们需要了解大数据的生命周期应用，研究依赖于大数据行为的集中式处理机制。我们需要从传统的以计算为中心的方法转向分布式计算范式。我们需要关注用于分布式流处理机制的新方法和数据分析机制。我们还需要更多关注启动自举和本地计算，以及处理海量数据的新算法。\n\
  \n### 5.3 系统复杂度\n\n大数据可以处理海量的异构数据类型和应用程序，以支持大数据的研究。由于大数据处理不足以应对海量数据的生成和实时性需求，这些限制为建立新的系统架构、处理系统和能量优化模型提出了挑战。解决复杂度问题将导致设计新型硬件和软件框架，以优化大数据的能耗。系统可以处理大小和结构相似的数据，但当数据以不同的模式和尺寸呈现时处理就会变得困难。我们需要对所有大数据工具、不同工作负载条件、不同数据类型、各种数据模式进行小规模研究，并在分布式环境、集中式环境中进行性能评估，包括用于性能预测的机器学习算法、能量优化算法、单位能耗和递归工作。我们应该关注能够在不同场景下处理所有类型数据的新型数据处理系统。\n\
  \n### 6. 大数据的应用\n\n*   **大数据分析 (BDA)**：这类应用利用并行处理框架分析海量数据。BDA 应用在伪云环境中使用样本数据。之后，它们在具有更强处理能力和大输入数据的真实云环境中构建。这些应用利用了无法放入硬盘的大量数据。数据产生于不同的来源，如流量、社交网站、在线游戏信息、股票市场以及国际赛事期间。\n\
  *   **聚类**：用户可以通过 `k-means` 算法等工具，通过点和点击对话并基于特定的数据维度，轻松地识别出群体。聚类在大数据中起着重要作用，通过考虑客户类型、患者文档、购买模式、行为产品来解决人群分类问题。\n\
  *   **数据挖掘**：`决策树` 将帮助用户理解预期结果的结果与属性之间的关系。这棵 `决策树` 反映了隐藏在你的数据中的概率结构。`决策树` 帮助我们预测欺诈风险、在线注册、在线购物和疾病风险。\n\
  *   **银行**：在银行业，敏感数据的使用导致了隐私问题。研究显示，超过 62% 的银行员工由于隐私问题对银行客户信息持谨慎态度。将客户数据分配到不同分行也导致了安全问题。针对包含用户敏感信息（如收入、储蓄和保险单）的银行数据进行的调查最终导致其落入错误的人手中。这阻碍了客户在银行交易中分享个人细节。\n\
  *   **股票**：数据分析可以在私有股票交易所期间在数据库中建立全面系统来检测欺诈。\n*   **信用卡**：信用卡公司依赖数据库内分析以准确且快速地识别欺诈交易。这种欺诈交易的删除将跟踪用户的敏感数据（如金额、位置），并在验证可疑活动之前进行跟进。\n\
  \n#### 企业\n\n它将帮助世界各地的行业人士。数据不需要在工作和之间来回移动。它为业务人士提供了洞察，以比传统工具更低的成本做出准确的决策。\n\n*\
  \   **消费品**：消费品制造商收集与客户偏好和购买数据相关的调查数据、网页标签、客户服务中心、从在线网站获取的文本以及所有关于产品的话题提取内容。通过这种分析，业务人士将了解到哪些产品会成功，哪些会失败。最后，他们可以发现营销媒体中产品的特征趋势。\n\
  *   **农业**：农业公司利用传感器收集作物效率数据。起初，农业领域的专家种植作物并运行模拟，以寻找作物在不同条件下的反应。农业研究将收集包括各种属性、温度、生长水平、土壤成分在内的数据，为特定基因类型寻找优化环境。\n\
  *   **金融**：流行的金融公司更多关注使用第三方进行信用评分。今天，金融机构使用他们自己的分析，利用信用卡、投资、交易、储蓄等广泛信息为现有用户生成信用评分。\n\
  *   **经济**：`Hadoop` 可以帮助组织执行低成本交易。\n*   **电信**：人们口袋里带着人脸识别技术。`Android` 用户使用 `remember\
  \ app` 从数据库中识别（或）收集与拍摄快照相关的数据，而“iPhone”用户通过 `recognize me` 解锁设备，该应用广泛开发，每年为解决忘记密码节省了近\
  \ 250 万美元。\n*   **医疗保健**：传统医疗行业在数据方面落后于其他行业，医院的每个利益相关者独立做出决策，而不是依赖大数据工具（James Manyika,\
  \ Michael Chui, Brad Brown, Jacques Bughin, Richard Dobbs, Charles Roxburgh, & Angela\
  \ Hung Byers, 2011）。\n\n## 7. 结论\n\n\n\n\n\n大数据是我们数据时代的一项重要技术，能够处理结构化、半结构化和非结构化数据。它为大型复杂数据提供了可行的解决方案，并成为如今的挑战。每个大数据系统都提供了巨大的力量，为了提供这种能力使用了不同的工具。本文介绍了大数据的重要方面、架构及其应用。然而，本文也介绍了面临的挑战。显而易见，我们现在正进入大数据时代，必须发现许多关于大数据的东西以便在这个数据世界中竞争。\n\
