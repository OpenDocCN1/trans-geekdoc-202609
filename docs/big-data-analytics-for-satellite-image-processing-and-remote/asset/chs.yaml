  \n## 摘要\n\n本章介绍了 MapReduce，它作为通用服务器发挥作用。本章主要讨论了 MapReduce 在机器学习、数据分析和数据科学等领域的应用。\n\
  \n## 引言\n\n在信息感知的不断变化中，收集和查看的数据已经达到了特定的水平。这种现象是因为日常软件无法处理业务人员所使用的操作，即处理、存储、分析、传输、查询和更新。我们现在生活在一个每刻都在产生海量数据的时代。如果这些数据需要被处理，串行处理的方法将无法产生结果，因为其消耗的时间比要求的要长。因此，为了避免这种串行处理的问题，我们采用并行处理。这是关于本章内部内容的简要介绍。\n\
  \n# 背景\n\n在定义大数据时，很难准确地区分数据和大数据。数据也可以在这种环境中被处理，但那并不是合适的方法。然而，大数据处理在日常软件中完全不适用。在处理大数据时，输入数据具有以下特性：\n\
  \n- 体量（Volume）：数据的数量决定了权重和潜在的洞察力。\n- 多样性（Variety）：数据的性质和多样性分析了数据的折衷程度。\n- 速度（Velocity）：数据实际上随时间产生波动而变化，这决定了数据的有用性。\n\
  - 变异性（Variability）：基础分析的不一致数据集会阻碍处理。\n- 真实性（Veracity）：捕获数据的质量差异很大，影响分析的准确性。\n\n\
  # 本章重点\n\n本章的重点是了解现代系统，以便及时跟进并处理所有信息，新技术已经开发出来，旧技术也得到了改进。大规模并行处理，或 `MPP` (Metropolis,\
  \ N., 1986) 以及 `MapReduce` 就是这样的技术。\n\n\n\n\nMPP（大规模并行处理）利用不同的处理器对大型数据集进行协调处理。这使得针对海量数据分布中心运行的多维度查询具有极快的执行速度。这项技术出现的首要原因是海量数据淹没了并非为处理此类巨量而设计的应用程序。由于调查研究需要对这些数据进行处理，促使发明者创建了极快的准备系统。如果没有\
  \ MPP 采用的方法，查询可能需要很长时间才能完成，这使得现代的业务洞察框架和数据仓库变得不再那么好用。MPP 是各种大数据解决方案的核心，并作为一项关键创新取得了显著进展。Amazon\
  \ Redshift 是一种快速、全托管的 PB 级数据仓库解决方案，也是一种流行的云端信息（Gupta, A., Agarwal, D., Tan, D.,\
  \ Kulesza, J., Pathak, R., Stefani, S., & Srinivasan, V., 2015）存储架构，它利用 MPP 设计实现了极快速的查询执行。MPP\
  \ 是 Redshift 五大关键执行辅助器之一，其他列式数据存储、数据压缩、查询优化和编译代码。\n\n### MPP 如何工作\n\nMPP 的原理本质上非常简单。它将大型、难以管理的数据集拆分为易于处理的块，并将每个块分配给一个处理器。可能有数百甚至几千个处理器处理来自同一数据集的块。当所有数据都处理完毕后，来自许多不同处理器的结果将组合成一个最终的结果集。MPP\
  \ 真正实现这一点的手段是通过各个处理器之间用于相互通信的提示接口。每个处理器都有自己的工作框架和内存。这允许每个人都独立地在被分配的数据库部分上工作，同时与其它处理器进行松散的通信。因此，MPP\
  \ 框架被称为“无共享”（shard nothing）框架。由于在无共享设计中，操作系统、内存、磁盘或其他任何其他内容都不在各个节点之间共享，因此可以实现预期的结果以及精调框架的切入点。MPP\
  \ 框架可以根据需要扩展到相同数量的额外节点，进一步隔离工作并使框架加速到最佳水平。此外，由于每个节点的处理器都独立于其他节点工作，因此不存在阻碍性能的瓶颈。\n\
  \n### MPP 对 Map 比 MapReduce\n\nMPP 绝不是处理海量数据的唯一可用技术。MapReduce 作为 Apache Hadoop 计划的一部分，是另一种实现了与\
  \ MPP 类似功能的创新，但有几处不同。实际上，你甚至可以说 MPP 和 MapReduce 是远远的表亲。乍看之下，两者之间的技术差异可能并不显得太遥远，而是取决于你的数据分布中心的需求，选择其中一个另一个可能会产生巨大的影响。\n\
  \n*   **性能**：MPP 的优化和分布组件允许它处理不同节点之间的数据分发。这大大缩短了处理时间，使其成为比 MapReduce 更好的性能决策。此外，MPP\
  \ 数据库符合 ACID 兼容性，该兼容性保持了原子性（Coyle Jr, D. J., Chang, A., Malkemus, T. R., & Wilson,\
  \ W. G., 1997），即如果任何节点的更新失败，则需要回滚所有更新；一致性（Eswaran, K. P., Gray, J. N., Lorie, R.\
  \ A., & Traiger, I. L., 1976），即数据满足某些一致性约束；隔离性[14]，即隔离性要求事务观察数据库的“最新”快照；以及持久性（Elnikety,\
  \ S., Dropsho, S., & Pedone, F., 2006），即提交和使事务效果持久化是在单个动作中执行的。ACID 确保数据库事务被准确可靠地处理。这不是\
  \ Hadoop 中自然实现的内容，这使得 MPP 相比 MapReduce 具有通用执行优势。\n*   **扩展性**：MPP 框架使用的高度特化硬件使得适应性成为一个困难且成本昂贵的建议。MapReduce\
  \ 和 Hadoop 尽管如此，可以部署在廉价的服务器上，允许根据需要开发。\n*   **部署与维护**：MPP 通常易于部署和维护。MapReduce 和\
  \ Hadoop 则可能变成一个需要昂贵专业知识的项目。\n*   **数据限制**：与 MPP 不同，Hadoop 和 MapReduce 可以处理非结构化数据，而无需在使用对其进行处理。在这里，MapReduce\
  \ 略为受欢迎。\n*   **语言**：MapReduce 背的语言基本上是 Java。MPP 使用 SQL，使其更易使用且更具成本效益。SQL 是一种数据库专家常用的查询语言，消除了对\
  \ Hadoop 专家的需求。此外，现有的基于 SQL 的商业工具支持 MPP。MapReduce 并非如此，因此必须探索替代方案。\n\nMPP 比 MapReduce\
  \ 好吗还是反之？这取决于组织的目标，对于它们来说，这是适用于不同场景的工具。事实上，有些组织同时使用 MPP 和 MapReduce，从而获得两者的最佳优势。\n\
  \n### 问题、争议与难点\n\n*   没有必要区分大数据分析与传统数据分析。\n*   Hadoop 并不总是最佳工具：在某些情况下，Hadoop 不适用于组织的数据；在处理实时数据时，当组织拥有无法放入单一数据基础设施的数据源和业务流程，且组织缺乏复杂数据科学工具的人才储备时。\n\
  \n\n\n\n上述所有问题都有多种解决方案，其中一种就是各种分析算法的 map reduce 实现。在此之前，我们需要了解 map reduce 算法的各个阶段及其工作原理、各个阶段之间的数据流，以及它如何处理并行数据处理。Map\
  \ reduce 是由 Google™（Schatz, M. C., 2009）开发并使用的一种软件框架，专门用于支持密集数据处理的并行处理任务。它作为一个数据仓库，用于并行处理作业并允许大规模分布式数据分析（Taylor,\
  \ R. C., 2010）。Map Reduce 中的每个任务都分为以下几个主要阶段：`mapper`、`sort` 和 shuffle，最后是 `reducer`。此外，名为\
  \ `combiner` 的阶段可以作为局部 reducer 使用在 `mapper` 和 `reducer` 之间，用于优化目的，即减少跨网络的数据量。`map`\
  \ 任务的输出（称为中间键和值）被发送到 `reducers`。数据处理接收一组输入键/值对，并产生一组输出键/值对。如上所述，用户根据 `map` 和 `reduce`\
  \ 任务决定处理流程，其中 `map` 任务基本上旨在根据后续阶段的要求初步创建后续处理所需的键和值。在中间的 sort 和 shuffle 阶段，操作类似于\
  \ group by 算子，将相同键的所有值分组，从而最终给出唯一的键，并在每个键上附加一个值元组。`reducer` 阶段最终完成由分隔符分隔的键值对的工作，其中值的逻辑可以被认为根据程序要求从值元组或值列表中提供单个值。如上所述，许多分析任务可以通过\
  \ map reduce 完成，其中一些是聚合、数据过滤、数据组织，最后是一些机器学习算法（非迭代）。这主要涉及获取数据各种统计参数的洞察，这些参数通常用于获取有关数据变化一般性质、数据摘要和范围的信息。下面列出了每个类别的若干算法。\n\
  \n### 平均值 (Mean)\n算术平均值是数据的中心位置量量。在稳健中心趋势的情况下，通常会提供数据平均值的更好估计（Tukey, J. W., 1977）。它可以通过相加给定集合中的所有值并将总和除以数值个数来衡量。因此，我们需要根据\
  \ map reduce 算法调整计算，以便从一组数据中形成用于计算平均值的元组。在这里我们只处理数值数据，因为无法对字符串值进行求和。平均值计算需要假设一个键，所有值都将在该键上积累并除以项数。在这里我们假设一个包含由逗号分隔的由逗号分隔的数字数据集，其目标是最终找到每列的平均值。因此，我们最初假设两个阶段（`map`、`reduce`）：\n\
  \n1. **Map 阶段 (Map Phase)**：如上所述，`map` 阶段逐行读取输入文件，因此 map 阶段输入的键值对将每行的字节偏移量作为键，并将整行作为与每个键（即字节偏移量）关联的值。字节偏移地址翻译的使用最少只需一个时钟周期即可完成（Senthil,\
  \ G., 2004）。因此，这作为遍历行并执行所需操作的基准。因此，在编写代码时，我们可以假设在迭代器函数的每次调用中都保留一个变量，因此可以程序化计数器，当我们不断获取特定列的值时，它会递增。因此，map\
  \ 输出将具有许多键，每个键对应于输入文件中行数的多个值。在 sort 和 shuffle 阶段，所有值（即相同列中的数字）将根据键进行排序，此阶段的输出是关联一个值元组（列表）的键，这意味着每个列数字（键）都与其相应列中的所有值相关联。\n\
  \n2. **Reduce 阶段 (Reduce Phase)**：如上所述，`reduce` 阶段的输入是作为键的列号以及与键关联的值列表。因此，现在 `reducer`\
  \ 阶段可以以列表的形式访问特定列中的所有值。因此，需要维护一个运行总和，它在值列表迭代期间保留其值，不断累加数字，因此在迭代结束时，我们在变量中得到了最终总和。因此，得到的和被除以列表中值的个数，并最终与输入键（即列号）关联。因此，通过这种方式获得了每列的平均值。\n\
  \n这种方法可能听起来很完美，但它有一个巨大的缺陷。考虑一个具有大量行的巨大数据集。因此，当 `reducer` 接收到值列表时，每个键在其元组中的值数量将与数据中的行数相同。这将增加网络流量，即大量值需要在\
  \ sort 和 shuffle 结束时一起进行序列化，并发送到 reduce 阶段。这可以通过根据大小/行数划分文件并使用作为局部 reducer 的 `combiner`\
  \ 阶段来优化。为了提高效率，在每个值中存储两个内容：即每个键的平均值和计算该平均值的项数。因此，与其发送列相关的所有值，不如找到子列的平均值，并发送平均值以及计算总和时涉及的项数。因此，在\
  \ reducer 端获得了一个值列表（取决于文件被分成了几份）。现在，要计算平均值，每个键键获取的每个值都乘以元组中存在的出现次数。将所有此类值相加并除以出现次数的总和，即可产生数据的平均值，从而实现了优化。\n\
  \n### KNN(k 最近邻)\n这是一种非常著名的分类算法，用于为特定的可用数据指定特定的类别。与朴素贝叶斯和其他一些基于分类的算法相比，KNN 显示出最高的准确率（Bijalwan,\
  \ V., Kumar, V., Kumari, P., &Pascual, J., 2014）。因此，由于它对数据进行分类，必须使用某些指标来执行分类操作。在这种情况下，我们欧几里得距离作为分类任务的衡量指标。基本算法遵循将参数\
  \ `k` 作为输入，并根据它们与相关数据点的距离对所有数据类别进行排序的原则。在数据类别按距离排序后，按升序取前 `k` 个类别。最后，计算每个唯一类别的出现次数。相关数据点属于这些获得的\
  \ `k` 个最近类别中出现次数最多的类别。由于它在这里作为非迭代算法使用，我们可以根据 map reduce 框架构建阶段以实现 knn 算法。\n\n\n\n\
  \n\n### 1. Map 阶段 1\n在实现的第一阶段，即映射器阶段（mapper phase），对数据集进行迭代，以计算输入数据集中每个数据点与待计算类变量所在的数据值之间的距离。每个距离都关联一个类变量，即\
  \ `i.e.` 计算该距离的特定输入数据值所所属的类。在这里使用 `tree map`（树形映射）非常方便。它被实现为链接“二叉树”结构，速度极快：`O(log\
  \ N)`；键按排序顺序存储（Reges, S., &Stepp, M., 2014）。`Tree map` 基本上是二叉搜索树的变体，它根据关联的值（通常是数值值）来存储某些数据元素。这是因为\
  \ `binary search tree` 中存储的值是通过与之前已存储的值进行比较来存储的。使用这种数据结构是为了能够更简单地以排序的方式访问和存储每个元素。由于查找和存储任何元素的最坏情况复杂度为\
  \ `O(n)`，因此优先选择 `tree map`。在这种情况下，存储在类变量中的值以及与其关联的键（基于该键存储类变量）就是与其相关的距离。由于 `k` 的值对于过程中是静态的，一旦\
  \ `tree map` 的大小超过 `k`，距离最大的值就会元素。这有助于仅存储最近的 `k` 个类变量。\n\n## 2. Map 阶段 2\n上阶段完成了存储最近\
  \ `k` 个类变量的主要任务。此阶段与词频映射阶段非常相似，每个类变量关联的值为 `1`。因此在该阶段结束时，我们得到了键值对，其中类变量为键，`1` 为与键关联的值。\n\
  \n## 3. Reduce 阶段 1\n在这一阶段，排序和洗牌（sort shuffle）输出的键为 `k` 个最近数据元素中的每个唯一类变量，`1` 为与这些键元素关联的数值元元组，其中\
  \ `1` 出现的次数等于从映射阶段获取的类变量的出现次数。在此阶段，与每个键关联的所有值被相加，最终此阶段的输出是以每个唯一类变量为键、该类变量在最近 `k`\
  \ 集合中出现的次数。\n\n## 4. Map 阶段 3\n这是一个给出数据元组所属类的最终输出的阶段。在这里再次使用 `tree map` 来存储最大的键，即\
  \ `i.e.` 出现次数最多的键。\n\n## 数据推荐系统\n协同过滤推荐系统的关键构建模块是寻找输入数据集中出现频率最高的数据（Ristoski, P.,\
  \ Mencía, E. L., & Paulheim, H., 2014）。该算法旨在标记文档，这基本上基于特定单词在文档中出现的频率。这对于寻找文档中的关键词和文档的重要部分特别有用。因此，它为数据提供了有用的见解，以找到输入数据的重要内容。初始阶段涉及词计数算法。在此阶段，主要将文件中的单词相互分离，以执行输入文件的频率聚合任务。在接下来的几个阶段中，根据获取的每个单词的频率对数据进行排序。详细分析和阶段任务说明如下：\n\
  \n### 1. Map 阶段 1\n在此阶段，按行读取数据并将所有单词以 `1` 的形式收集起来，因此此阶段识别了文件中所有的出现频率。\n\n### 2.\
  \ Reduce 阶段 1\n此阶段涉及映射阶段的输出。洗牌和排序阶段（shuffle and sort phases）对键即 `i.e.` 单词执行分组操作。排序阶段将所有相同值的键（单词）收集在一起，因此通过字符串比较对所有键进行排序。在洗牌阶段，所有相同键的值被收集在一起形成一个值元组。最后在\
  \ Reduce 阶段，将每个键的所有 `1` 相加，因此通过累加值来获得每个唯一键的频率。\n\n### 3. Map 阶段 2\n在接下来的步骤中，利用了排序阶段的优势，因此\
  \ `i.e.` 频率现在将用作键，而之前作为键的单词现在将用作值。因此，此映射器的任务是交换或翻转频率作为键并将单词作为值。\n\n### 4. Reduce\
  \ 阶段 2\n在排序和洗牌期间，相同频率的单词以元组的形式收集在一起，因此排序和洗牌阶段的输出将是排序后的频率作为键，以及相同频率的所有单词。由于还原器（reducer）输出的是单个键值对，而不是键和值列表（在许多单词具有相同频率时可能会出现），因此当对键即\
  \ `i.e.` 频率的值列表进行迭代时，最初假设一个空字符串，并在从还原器获取新单词时进行拼接。这导致了频率作为键、相同频率单词作为值的形成。可以使用特殊字符作为唯一单词之间的分隔符，以便获取相同频率单词之间的分离。这些阶段可以通过在\
  \ Map 阶段 1 和 Reduce 阶段 1 之间使用合并阶段（combiner phase）来优化，从而减少跨网络传输的数据量，从而优化网络流量使用。合并器通过计算部分数据中所有单词的频率充当局部还原器，由于它是交换运算，之后可以轻松地合并。\n\
  \n\n\n\n# 有序排序 (Ordered Sorting)\n\n该算法的目标是以并行方式对输入数据集进行优化的排序。基本上，它的目的是根据并行键对数据进行排序。在顺序编程中，排序是简单的。但由于\
  \ MapReduce 使用了“分治”法，使得在 MapReduce 编程模型中实现这一过程变得有些困难。一种方法是获取所有输入数据并对数据的特定部分进行排序，但这作为全局方法是不可行的，因为排序不是一种交换和结合属性。这种数据流的类型需要进行分区，以便每个分区都进行本地排序，当所有这些分区合并时，我们就得到了全局有序的数据。\n\
  \n有序数据具有许多实用的属性。有序数据通过提供数据的范围和时间线，为数据提供了许多洞察。有序数据通过提供二分搜索类型的方法帮助在数据集上执行搜索操作，其复杂度为\
  \ `O(logn)`，而普通的搜索方法复杂度通常为 `O(n)`。因此，其应用范围涵盖了数据索引以及在特定范围内以高效且优化的方式查找某些数据。\n\n此过程的主要要求是键应该是可比较的数据类型，以便进行排序。这是通过使用表示数据特定部分的键来实现的，即构造键使得数据在它们之间均匀分布，并且只有特定范围内的数据出现在每个分区中。因此需要对数据进行预分析，以便\
  \ MapReduce 任务能够了解整体的数据变化，从而为分区操作构建键。这随后将有助于将数据分配到每个分区中，每个分区都可以进行本地排序，然后根据构造的键对分区进行排序，最终我们就能获得有序数据。\n\
  \n对于某些特定类型的数据，分析阶段可能是可选的，例如具有唯一元素的数据集，因此可以借此找到数据中特定参数的精确范围，从而很容易基于该参数对数据进行分区。如果需要，分析阶段会对数据进行随机采样，并基于这些样本构建分区。Mapper\
  \ 执行简单的随机采样。当输出时，仅输出作为键的即排序后的值，与之关联的值设为 `null`，因为该值不会与任何其他值关联。这里只使用一个 Reducer，因为它将作为最终的排序列表，通过这种方式处理数据将变得容易。\n\
  \n最后，将根据获得的数据范围执行执行阶段（practitioner phase）。Mapper 以分析步骤相同提取排序键。然而，这一次记录本身被存储为值，而不是被忽略。自定义执行器接收所有值，并根据分析阶段决定的范围发送到\
  \ Reducer。Reducer 仅将获取的值作为排序后的值输出。最重要的的一点是，Reducer 的数量将等于分析阶段决定的分区数量。这是一个沉重的操作，因为它涉及到两个阶段：一个是寻找数据范围，另一个是实际对数据进行排序，后者基本上是一个更沉重的阶段，因为这实际上涉及到所获取数据的洗牌（shuffling）。寻找分区的实际成本将非常低，因为它只涉及一个\
  \ Reducer，因此摊销成本将大幅降低。排序步骤将涉及大量数据通过网络传输，因此多个 Reducer 将使任务变得更容易且更优化。\n\n# 倒排索引 (Inverted\
  \ Index)\n\n近年来，大规模图像检索在现实应用中展现了巨大的潜力（Nguyen, B. V., Pham, D., Ngo, T. D., Le, D.\
  \ D., & Duong, D. A., 2014）。这种类型的工作基本上用于列出数据集中的重要术语，因此对文档中的重要单词进行标记非常有用，以便追踪特定值。大多数搜索引擎都执行此任务，以便在网络上进行高效搜索。Mapper\
  \ 输出带有值的所需的唯一键。分区阶段用于确定在处理完成后将数据发送到哪个 Reducer，从而使 Reducer 的最终处理任务以分布式的方式进行。因此，Reducer\
  \ 最终接收一组不同的行标识符，以便将它们链接回输入键。最后，可以使用唯一分隔符的 Reducer 来执行分离键值对的操作。最终输出具有与输入文件中唯一 ID\
  \ 关联的值，因此它们可以与文件中的数据元素相关联。因此，性能取决于索引键的唯一类型以及键的基数（即每个键关联的值的数量）。\n\n# 结论 (CONCLUSION)\n\
  \n数据的黄金时代已经到来。处理大规模数据集的能力取决于服务器能力以及可用的廉价服务器数量。通过使用廉价服务器，数据处理已经实现了水平扩展（scaled out）。这在软件规模上通过如\
  \ MapReduce 和 MPP 等创新才成为可能的。这主要涉及在处理任务中避免系统级的集成，从而使开发更容易。\n\n# 参考文献 (REFERENCES)\n\
