  *   Prabu Sevugan\n\n    印度 VIT 大学\n\n## 摘要\n\n本章改进了方案以应对这些困难。在开发中，采用了层次聚类技术来处理海量数据的情况，通过最小相关性阈值对聚类进行划分，直到达到最终聚类。该方法可能会影响线性复杂度。为了验证搜索的有效性，还实现了最小哈希树。\n\
  \n## 引言\n\n个人受益于云计算，因为它减少了工作量并简化了计算和存储。\n\n\n\n\n在处理上述事项时，可搜索加密（例如 (Song,Wagner\
  \ & Perrig, 2000), (Li,Xu,Kang,Yow & Xu, 2014), (Li,Lui,Dai,Luan & Shen, 2014)）已成为一种基础方法，允许对云端加密数据进行搜索，从而优化流程。首先，数据所有者将产生若干对应外包数据的关键词。云服务器将用于存储这些加密关键词。当需要访问外包数据时，可以选择大致合适的关键词，并将指定关键词的密文发送到云服务器。然后，云服务器使用密文对加密的外包关键词进行匹配，并最终向搜索的用户返回匹配结果。为了在加密数据上实现类似于明文关键词搜索的搜索效果和准确性，文献中已经开展了广泛的研究。Wang\
  \ 等人（2014）推荐了一种考虑关键词相关性评分的排名关键词搜索系统。遗憾的是，由于使用了保序加密（**OPE**）（**Boldyreva,Chenette,\
  \ Lee & Oneill**, 2009）来获得排序属性，该方案无法实现陷阱门的不可区分性。\n\n随后，Sun 等人（Sun,Wang,Cao,Li,Lou,Hou\
  \ & Li, 2013）建议了一种多关键词文本搜索方案，该方案考虑了关键词的相关性评分，并利用多维树方法来实现作者组织的查询。（J. Yu, P. Lu, Y.\
  \ Zhu, G. Xue, & M. Li, 2013）建议了一种多关键词 Top-k 检索组织，通过全同态加密加密索引/陷阱门以确保高安全性。Cao 等人（2014）建议了多关键词排名搜索（MRSE），将坐标匹配作为关键词匹配规则，即它将返回关键词匹配度最高的数据。尽管在关于精确和作者组织的可搜索加密的早期文献中，许多搜索功能得到了改进，但对于可搜索加密来说，要实现类似于\
  \ Google 搜索那样的用户参与度仍然存在问题。这主要归因于随后的两个问题。首先，带有用户喜好的查询在明文搜索中非常流行（**Liang, Cai,Huang,Shen,\
  \ & Peng**, 2012), (**Mahmoud & Shen**, 2012）。它允许定制化搜索并能更精确地表示用户需求，但在数据加密领域尚未被系统地研究和维护。其次，为了进一步提高用户的搜索体验，一个重要且关键的功能是允许带有综合逻辑操作的多关键词搜索，即关键词的“AND”、“OR”和“NOT”操作。这对于搜索用户缩小搜索范围和快速分类预期数据至关重要。\n\
  \nCao 等人建议的坐标匹配搜索方案（MRSE）可以作为具有“OR”操作的可搜索加密系统；（Shen,Liang, Shen,Lin, & Luo, 2014）推荐了一种合取关键词搜索方案，可以看作是具有“AND”操作的可搜索加密方案，返回匹配所有关键词的文档。尽管如此，目前大多数建议仅允许使用单一逻辑操作进行搜索，而不是关键词上多种逻辑操作的混合，这为本工作提供了动力。\n\
  \n### 细粒度多关键词搜索（FMS）\n\n在此，作者通过在云端加密数据上提出两种细粒度多关键词搜索（FMS）方案来讨论上述两个问题。我们的独特贡献可以归括为以下三个特征：\n\
  \n*   作者熟悉了可搜索加密中关键词的相关性评分和偏好因子。关键词的相关性评分可以允许更详细的返回结果，而关键词的偏好因子代表了关键词在用户搜索量化的关键词集中的地位，且作者始终在个性化水平上搜索以满足用户的精确偏好。因此，进一步增强了搜索功能和用户体验。\n\
  *   作者理解了可搜索加密多关键词搜索中的“AND”、“OR”和“NOT”过程。结合所提方案中的安排可以实现更全面的功能并降低作者的查询复杂度。\n*   作者采用了了分类子字典技术来提高上述两种方案的有效性。大量的实验表明，增强后的方案在索引构建、陷阱门生成和查询判断方面与现有方案相比具有更好的效果。\n\
  \n### 移动云计算\n\n移动云计算通过发现云端可用且虚拟化的存储和计算资源（Dinh, Lee, Niyato, & Wang, 2013; Li, Dai,\
  \ Tian, & Yang, 2009）克服了移动设备的硬件限制，从而可以为用户提供更显著且可扩展的移动服务。在移动云计算技术中，移动运营商的典型特征是将信息外包给外部云服务器（例如\
  \ `iCloud`），以实现数据存储和访问提供一种稳定、低成本且可扩展的方式。然而，由于外包数据包含敏感隐私信息（如个人照片、电子邮件等），如果没有有效的保护，将导致严重的机密性和隐私违规（W.\
  \ Sun, 2013）。因此，在将敏感数据外包到云端之前对其进行加密至关重要。由于加密数据搜索的问题，当其他用户需要搜索访问感兴趣的数据时，数据加密会导致显著问题。移动云计算中的这一根本性问题启发了近年来对可搜索加密性能检查的广泛调查，以实现作者对外包加密数据的深度细化控制（Wang,\
  \ Lou, & Hou, 2014; Yang, Liu, & Yang, 2014）。\n\n\n\n关于加密数据上的多关键词搜索，已经建立了一系列研究。Cash\
  \ 等（Jarecki, Jutla, Krawczyk, Ro³, & Steiner, 2013）提供了一种对称可搜索加密方案，该方案对大型数据库具有高效率，但在安全性保障方面存在不确定性。Cao\
  \ 等（Cao, Wang, Li, Ren, & Lou, 2014）提出了一种多关键词搜索结构，通过允许 k-最近邻（kNN）技术（Wong, Cheung,\
  \ Kao, & Mamoulis, 2009）来支持结果排名。Naveed 等（2014）提出了一种主动可搜索加密系统，通过完全盲存来隐藏用户搜索的访问模式。\n\
  \n为了满足实际的搜索需求，加密数据的搜索结果应提供以下三个功能：\n\n首先，可搜索加密系统应该提供多关键词搜索，并为用户提供与在 Google 中使用不同关键词进行深度搜索相同的体验；仅通过单关键词进行搜索，只会反复返回非常不完整且不精确的结果，这是完全不可接受的。\n\
  \n其次，为了快速分类最相关的结果，搜索用户通常倾向于让云服务器根据基于相关性的指令（Pang, Shen, & Krishnan, 2010），按搜索文档的相关性顺序对返回的搜索结果进行分类排名。此外，根据排名向用户显示搜索结果也可以通过仅从云端分发与搜索用户最相关的的结果，来消除网络网络流量。\n\
  \n第三，对于搜索的有效性，数据库中不完美的文档数量可能非常巨大，可搜索加密结构应该以作者设计的方式快速响应搜索需求，并将中断降至最低。\n\n除了所提出的优点外，针对许多普通方案，作者深入研究了接近全功能可搜索加密构建的合意直觉。作为该领域的应用，作者针对移动端的加密云数据，提出了一种通过盲存实现的、由作者组织的多关键词排名搜索（EMRS）方案。我们的主要贡献可以概括为：\n\
  \n*   作者解释了可搜索加密中的相关性评分，以完成针对加密移动云数据的多关键词排名搜索。此外，作者提出并组织了索引以提高搜索效率。\n*   通过采用中的盲存方案，作者解决了陷阱不可区分性问题，并隐藏了用户在云服务器上的搜索访问模式。\n\
  *   作者对安全性进行了系统分析，证明了 EMRS 在文档机密性和索引安全性方面可以提供高水平的保障，包括陷阱隐私、陷阱不可区分性以及对搜索用户访问模式的覆盖。此外，作者实施了大量实验，表明与现有方案相比，EMRS\
  \ 在功能和搜索有效性方面可以实现效率的提升。\n\n### 云计算\n\n云计算被认为是过时信息技术的替代品，并由于其固有的资源共享和低维护特性，逐渐被公认为信息技术扩张中最重要的转折点。云计算是一种计算模型，根据需求向设备和计算机提供共享的信息、资源和软件。这允许终端用户随时从手机或桌面（作为移动计算平台）等所需的平台访问云计算资源。\n\
  \n云是虚拟化的、易于扩展且可用的巨大资源池。工作所需的软件、数据和应用程序并不存储在他们自己的计算机上；而是存储在用户控制的远程服务器上。这是一种按需付费的模型，根据服务水平协议（SLAs）提供的资源进行付费（Vaquero,\
  \ Rodero-Merino, Caceres, & Lindner, 2009）。随着云计算的普及，越来越多的敏感信息被汇集到云端，例如电子邮件、相册、个人健康记录、财务交易、税务文件和政府文件等。\n\
  \n### 隐私与安全\n\n数据所有者和云服务器不再处于同一个信任域，这可能导致未加密的数据面临风险。云服务器可能会泄露数据信息给非法实体或被黑客攻击。为了保护隐私，敏感数据在外包到公共云之前需要先进行加密（Kamara\
  \ & Lauter, 2010）。由于云规模级系统中巨大的带宽限制，传输所有信息并在本地进行解密的解释显然是不合理的。\n\n鉴于云端可能存在海量的数据主权用户和海数量的云外包数据文档，在云端加密数据上发现保护隐私并实现真实搜索具有极重要的地位。这个问题具有极大的挑战性，因为要同时满足性能、系统易用性和扩展性的加密需求是极其困难的；鉴于可能存在大量的外包信息文件，加密使得数据的有效利用成为一项极具挑战性的任务。此外，在云计算中，数据所有者可能会将其外包信息与许多用户共享，而这些用户只想检索某些特定的数据文件。他们正处于会议中。这样做最流行的方法之一是全关键词搜索，允许用户智能地检索感兴趣的文件。信息检索的需求是用户从服务器获取数据最常见的任务。通常，云服务器按照指令完成相关结果排名，以使搜索更快。这种排名搜索方案允许数据所有者快速找到最相关的信息，而不是返回无法区分的结果。排名搜索可以在云的“按需付费”模式下，通过只分发高度所需的最相关数据，优雅地消除不必要的网络流量。\n\
  \n为了机密性保护，作者的这种排名过程不能泄露任何与关键词相关的数据。另一方面，为了提高搜索结果的准确性以及恢复用户体验，此类排名系统也需要支持多关键词搜索，因为单关键词搜索往往产生过于粗略的结果。正如今天搜索引擎（例如\
  \ Google 搜索）的常见做法，数据用户可能倾向于提供一组关键词而非仅一个作为兴趣的指示，以检索最相关的数据。搜索请求中的每个关键词都可以进一步缩小搜索结果。“坐标匹配”（Witten,Moffat\
  \ & Bell,1999），即尽可能多的匹配，是这种多关键词含义之间的一种作者组织的相似性度，用于提高结果的相关性，并在明文数据检索（IR）社区被广泛使用。然而，由于存在不同的隐私和安全问题，包括数据隐私、索引隐私、关键词隐私等许多严格要求，如何将其应用于加密云数据搜索方案仍然是一个极具挑战性的任务。\n\
  \n\n\n\n云计算被认为是旧式数据技术的替代品，由于其固有的资源共享和低成本维护的特性，它已逐渐成为信息技术扩展中最重要的转点。云计算还是一种基于网络的计算模型，其中信息是共享的，资源和软件根据需求在其他设备和计算机上提供。这允许终端用户随时随地通过任何平台（如移动计算平台、手机云）访问云计算资源。云是虚拟化的、易于服务且可用的资源大池。工作所需的信息和软件应用程序并不存储在自己的处理器上，而是存储在受其他用户控制的远程服务器上。这是一种按需付费模式，组织根据定制的服务水平协议（`SLAs`）资源来获取收益（Vaquero,\
  \ Rodero-Merino, Caceres, & Lindner, 2009）。\n\n## 云安全\n\n尽管对容纳云计算有许多吸引因素，但也存在一些重大的接受障碍（Seung\
  \ Hwan, Gelogo & Park, 2012）。接受的最大主要障碍之一是安全，涉及合规性、隐私和授权等问题。由于云计算代表了一种较新的计算模式，对于如何实现各个级别（网络、主机、应用、数据层级等）的安全，以及如何保障云计算中应用程序的安全，存在大量的不确定性。这种不确定性导致信息经理一致认为安全是他们对云计算的首要关注问题。安全忧虑涉及风险领域，例如外部数据存储、对公共互联网的依赖、缺乏控制、集成以及安全性的多户性。与传统技术相比，云具有许多独特的拓扑，例如其巨大的规模，以及进入云提供者的资源是完全分散、异构且完全虚拟化的。传统的安全机制（如身份验证和授权）对于目前形式的云来说不再足够。云设施的复制工作、工作副本以及用于云服务的丢弃实践。云计算可能带来与旧式\
  \ IT 解决方案不同的安全风险。遗憾的是，将安全集成到这些方案中通常被认为会让它们变得僵化。\n\n## 加密云数据搜索\n\n随着云计算变得广泛，更敏感的数据被传输到云端，例如个人健康记录、电子邮件、机密视频和图像、业务财务数据、政府文件等。通过这种将信息存储在云端的方式，所有者可以从存储空间和保护的问题中解放出来，例如按需的高性能数据存储服务（Reddy,\
  \ 2013）。然而，信息供应商和云服务器不在同一可靠区域的现实可能会使外包数据面临危险。在这样的环境中，由于多种原因，云服务器不再是完全可靠的，这些：云服务器可能会将数据泄露给非法实体或可能被切断。敏感信息通常可以在外包前进行加密以确保数据机密并防止未经授权的访问。然而，由于存在大量的外包数据文件，数据加密使得数据利用的效率成为一项极具挑战性的任务。此外，在云计算中，数据所有者/供应商可能将其外包数据与许多用户共享。单个用户只想通过给会议检索他们感兴趣的某些特定数据文件。最广认可的做法之一是通过基于关键字的搜索特定检索文件，而不是像以前那样检索所有加密文件，这在云计算情况下是完全不合逻辑的（Khan,Wang,Kulsoom\
  \ & Ullah, 2013）。这种基于关键字的搜索技术允许用户有意义地检索信息文件，并在明文情况下（如 Google 搜索）中具有很高的价值。遗憾的是，信息加密限制了用户执行关键词搜索的能力，并导致过时的明文搜索方法不再适用于云计算。\n\
  \n最近，云计算模式（Mell & T. Grance, 2011）正在改变机构有效获取信息的方法，主要在于他们收集、访问和处理信息的方式（Paillier,1999）。作为一种不断发展的计算模式，对于云计算，其灵活性、成本效益和消除管理开销方面的潜力让许多机构感兴趣。云通过检测可变的数据接入设计，即使信息已加密，也能产生有关真实数据的有价值和敏感信息（Capitani,\
  \ Vimercati, Foresti, & Samarati, 2012; Williams, Sion, & Carbunar, 2008）。通常，政府会将计算处理过程与其数据一起接入云端。云的优势在于云中的隐私和安全问题规避了生产的使用。当信息高度敏感时，可以在外包给云之前对信息加密。当信息加密后，无论使用什么基础加密系统，在不解密信息的情况下完成任何数据挖掘都是非常有趣（Samanthula,\
  \ Elmehdwi, & Jiang, 2014）。\n\n\n\n\n云计算是将计算作为一种实用服务的扩展虚幻梦想，通过云定制，所有客户都可以将其信息存储在云端，从而从配置计算资源的公共资源池中按需获取卓越的性能和设施（Vaquero,\
  \ Lodero-Merino, Caceres, & Lindner, 2009）。其无限的弹性和效益正激励着个人和项目将其本地组合存储架构外包到云端。\n\n\
  为了保护信息机密性并应对云端及外部可能发生的未经授权访问，敏感数据（例如电子邮件、私人健康记录、快照、纳税文件、财务通信）应在外包给公共公共云之前由信息所有者进行加密（Kamara\
  \ & Lauter, 2010）。这改变了基于明文关键词搜索的旧式信息使用模式。由于云存储方案中巨大的带宽成本，传输所有信息并在本地进行解密显然是不合理的。此外，除了移除本地存储架构外，将存储信息存入云端如果不能被轻松地检索和使用，将毫无意义。因此，发现一种既能保护隐私又能对加密数据提供真实搜索服务具有至关重要的地位。\n\
  \n考虑到云端可能存在的海量按需数据操作员和大量的外包信息形式，这个问题极具挑战性，因为它不仅极其困难，而且必须满足表示、方案可扩展性和可用性的需求。为了满足真实信息检索的核心需求，大量的格式要求云服务器实现结果的相关性排名，而不是反复出现无差异的结果。基于排名的搜索方案允许信息操作者快速发现最相关的数据，而不是在满足的分组中对每个竞争项进行分类（Singhal,\
  \ 2001）。基于排名的搜索可以通过分发最相关的信息来优雅地消除网络中的无效流量，这在“按需付费”的云模型中是非常必要的。\n\n然而，这种保护隐私的排名过程不应泄露任何与关键词相关的数据。相应地，为了恢复搜索准确性的效果和用户的浏览体验，系统排名提供基于关键词的多次搜索是重要的，因为仅凭关键词搜索往往会产生极不均匀的结果。作为当今搜索引擎训练的共同重复操作（例如\
  \ `Search for Google`），数据管理员可能会设定一组关键词标准，而不仅仅是根据他们搜索兴趣的指针来检索最相关的数据。此外，仅进行关键词查询非常有助于减少额外的搜索结果负担。“组织协调”（Witten,\
  \ Moffat, & Bell, 1999），即尽可能的多个竞争，是此类多关键词意图之间一种有效的相关和，旨在增强结果的相关性，并广泛应用于明文信息检索（IR）领域的一部分。\n\
  \n尽管如此，如何在加密云信息搜索框架中应用它，由于特定的安全和保护障碍，仍然是一项极其困难的任务，包括各种严格先决条件，如信息安全、列表保护、密码安全等许多其他。在本文，可搜索加密（Song,\
  \ Wagner, & Perrig, 2000; Golle, Staddon, & Waters, 2004）是一种有效的策略，它将加密信息视为报告，允许客户端通过单个关键词安全地搜索并检索感兴趣的文档。无论如何，协调这些方法来处理大规模云信息使用框架在根本上是不合理的，因为它们是作为加密原语设计的，无法满足框架易用性、用户搜索理解和简单数据展示等高级管理需求。\n\
  \n目前已提出一些方案来增强布尔关键词查找（Golle, Staddon, 2004; Shen, Shi, & Waters, 2009），作为提高搜索灵活性的尝试，但它们尚不足以为用户提供足够的定位实用性。我们的早期工作（Wang,\
  \ Cao, Li, Ren, & Lou, 2010）已经注意到这个问题，并且作者此前针对加密信息的安全定位搜索问题，仅限于包含单个关键词的查询。设计一个支持多关键词语义且不发生安全漏洞的高效加密信息搜索系统仍然是一个具有挑战性的开放性问题。\n\
  \n在本章中，意外的是，作者在分布式计算视角下，描述并解决了针对编码云信息的多关键词定位搜索（`MRSE`）问题，同时保护了严格的框架感知安全。在不同的多键词语义中，作者选择了“组织协调”这种有效的比较度量，即尽可能匹配任意数量的词，以捕捉信息报告与查询问题的相关性。作者利用“内部项目比较性”（即记录中出现的查询关键词数量）来定量评估该文档与查询查询之间的相似性度量。\n\
  \n在文件开发过程中，每条记录都与一个双向量作为子索引相关，其中每个部分代表比较关键词是否包含在报告中。搜索同样被描述为一个并行向量，其中每个部分表示比较关键词是否出现在此查询请求中，因此可以通过查询向量与信息向量的内积来精确衡量比较性。然而，直接外包信息向量或查询向量将破坏文件保护或搜索安全。为了满足在不破坏保护的情况下支持此类多关键词语义的，作者提出了一种用于\
  \ `MRSE` 的核心思想，利用安全的内部项目计算，它从安全的 k-最近邻（`kNN`）过程调整而来，随后按照作者的顺序提供了两个根本改进的 MRSE 方案，以满足具有扩展攻击能力的两种威胁模型中不同的严格保护需求。我们的贡献概述如下：\n\
  \n1. 第一次，作者研究了针对编码云信息的多关键词定位搜索问题，并为这种安全的云信息使用框架建立了一套严格的保护需求方案。\n2. 作者考虑“组织协调”相似性度量提出了两种\
  \ MRSE 方案，同时在两种不同的威胁模型中满足特定的保护要求。\n3. 对所提方案的保护和有效性进行了详尽分析，并在现实数据集上的研究进一步证明所提方案在计算和通信方面的开销无疑很低。\n\
  \n\n\n\n\n分布式计算被视为大型企业 IT 基础的另一种模型，它可以构成注册、存储和应用的巨大资产，并使客户能够随时随地、方便且按需地访问一个共享的可配置处理资源池，且具有极高的效率和几乎忽略不计的成本。受这些迷人组件的吸引，个人和企业都被激发将其数据外包到云端，而不是购买程序和设备来自己处理数据。无论云服务的各种有利情况如何，将敏感数据（例如消息、个人信息、作者的记录、组织财务信息、政府报告等）外包到远程服务器都会带来安全问题。为客户存储信息的云服务提供商（CSPs）可能会在未经授权的情况下访问客户的敏感数据。确保信息机密性的一种通用方法是在外包之前对信息进行加密。尽管如此，这会在信息的易用性方面带来巨大的成本。例如，目前基于密码的数据恢复系统（通常用于明文）在云环境中是不可行的。\n\
  \n# 分布式计算与安全简介\n\n分布式计算被视为大型企业 IT 基础的另一种模型，它可以构成注册、存储和应用的巨大资产，并使客户能够随时随地、方便且按需地访问一个共享的可配置处理资源池，且具有极高的效率和几乎忽略不计的成本。受这些迷人组件的吸引，个人和企业都被激发将其数据外包到云端，而不是购买程序和设备来自己处理数据。\n\
  \n无论云服务的各种有利情况如何，将敏感数据（例如消息、个人信息、作者的记录、组织财务信息、政府报告等）外包到远程服务器都会带来安全问题。为客户存储信息的云服务提供商（CSPs）可能会在未经授权的情况下访问客户的敏感数据。确保信息机密性的一种通用方法是在外包之前对信息进行加密。尽管如此，这会在信息的易用性方面带来巨大的成本。例如，目前基于密码的数据恢复系统（通常用于明文）在云环境中是不可行的。\n\
  \n# 数据加密与可搜索加密\n\n确保信息机密性的一种通用方法是在外包之前对信息进行加密。尽管如此，这会在信息的易用性方面带来巨大的成本。可搜索加密（SE）允许用户在不先解密数据的情况下对加密数据进行搜索。许多研究人员提出了各种技术来解决这个问题，例如同态加密（Gentry,\
  \ 2009）或安全内存（Orei et al., 1996）。\n\n可搜索加密系统特别是在按需付费模式下为云客户提供了帮助。研究人员一直在研究对加密数据进行搜索，以寻求经济上可行的可搜索加密策略。在可搜索加密中，相关的写入、计算时间和计算开销是该领域专家在分析其方案执行性能时最常用的两个参数。\n\
  \n\n\n\n\n分布式计算改变了企业处理 IT 的方式，使他们变得更加敏捷，能够推出新的业务、提供更多服务并降低 IT 成本。分布式计算技术可以在多种设计中实施，采用不同的管理和配置模型，并可以与许多技术和软件框架共存。分布式计算基础正在不断取得飞速发展。\n\
  \n对于安全专家而言，云呈现出一个巨大的难题：如何在利用云的优势的同时，保持对企业资产的安全控制？这变成了一个权衡问题，即无论敏捷性和财务优势如何，增加的风险是否真的值得。保持对数据的控制对云的成功至关重要。\n\
  \n10 年前，数据通常存储在企业的物理架构中，即企业服务器机房中的独立服务器上，人们可以在单独的物理服务器中隔离敏感数据。今天，通过虚拟化和云，数据可能处于组织的智能控制下，但在物理上被存在由另一个实体拥有并管理的设施中。这种所有权的转移是需要新方法和系统来确保企业能够保持数据安全的主要原因。当第三方声称、控制并管理基础设施和计算资源时，如何确保业务或管理数据的私密性和安全性，并保护您的企业免受破坏性数据泄露的侵害？这使得云数据安全变得至关重要。\n\
  \n## 云计算的意义\n\n随着分布式计算，云计算的重要性也在扩大，它在逻辑和技术领域都是一个不断发展的概念。`NIST`（美国国家标准与技术研究院）对分布式计算的定义如下：\n\
  \n分布式计算是一种便利机制，允许按需访问一组共享的可配置资源池（例如系统、服务器、存储、应用程序和服务），这些资源可以以极少的管理工作量或专家协作通信被快速配置和释放。这种云模型提高了可用性（Mell\
  \ & Grance, 2012）。\n\n云增强了协作、敏捷性、灵活性、可用性以及根据需求调整变化的能力，加速了开发工作，并通过增强和更高效的处理提供了降低成本的潜力。分布式计算整合了各种处理思想，此外，例如面向服务的架构（`SOA`）、云\
  \ 2.0、虚拟化以及依赖互联网的各种技术，通过云程序支持在线业务应用程序，以满足客户的处理需求，同时将其产品和数据维护在服务器上。\n\n## 云交付模型\n\
  \n*   `私有云`：云框架供一个包含不同部门的单一组织使用。私有云可能在本地或异地运行，并位于组织的防火墙之后。\n*   `公有云`：云服务提供商向不同的组织、教育机构、政府部门和各类协会提供服务，通过互联网访问。\n\
  *   `混合云`：混合云结合了两种云交付模型，它们作为元素保持独立，但通过实现数据和应用程序可迁移性的技术连接在一起。云扩容是一种单向操作的示例，利用混合云在需求高峰期内调整负载。\n\
  *   `社区云`：云基础设施为一组具有共享计算需求（例如安全性、策略和合规性）的客户组织提供选择性使用而提供。\n\n## 服务层\n\n这些交付模型的服务层为：\n\
  \n*   `基础设施即服务 (IaaS)`：云框架是硬件和软件的集合。`IaaS` 允许客户对这些资源进行配置。\n*   `平台即服务 (PaaS)`：`PaaS`\
  \ 让开发者利用编程语言、库和其他工具创建云原生应用程序。\n*   `软件即服务 (SaaS)`：用户可以通过云基础设施运行应用程序。\n\n## 云中的安全\n\
  \n尽管分布式计算具有巨大的优势，但其认可也面临着一些巨大的障碍（Seung Hwan, Gelogo & Park.2012）。选择过程中最主要的障碍之一是安全，其次是关于合规性的问题。由于云处理代表了一种相对新的注册模型，因此在任何层（网络、硬件、应用、数据层等）上如何实现安全性，以及应用程序安全如何迁移到云计算方面，存在巨大的脆弱性。这种脆弱性一直促使数据管理员表示，安全是他们对云计算的首要考虑问题。分布式计算研究小组，特别是云安全联盟，已经意识到了云中的安全问题。在《云计算十大安全威胁报告（版本\
  \ 1.0）》（`Top Threats to Cloud Computing Report (Ver.1.0)`,2010）中，它记录了分布式计算的七大主要威胁：\n\
  \n1. 分布式计算的错误处理和滥用。\n2. 不安全的应用程序接口（API）。\n3. 恶意内部人员。\n4. 共享技术的漏洞。\n5. 数据丢失或泄露。\n\
  6. 记录、管理和活动捕获。\n7. 模糊的安全概况。\n\n加密的云数据\n\n\n\n\n\n通过采取这种方式，即将其信息存储到云端，信息所有者/供应商可以从信息存储空间和支持的责任中解放出来，从而享受按需的高级信息存储服务（Reddy,\
  \ 2013）。尽管如此，信息供应商与云服务器不在同一个受信任空间这一事实可能会使外包数据面临风险，因为由于若干原因，在这种云情况下，云服务器可能不再被完全信任，它们是：云服务器可能会向未经授权元素泄露数据内容，或者被黑客攻击。为了信息安全并防止意外访问，敏感信息在外包之前通常应该被加密。由于存在大量的外包信息记录，信息加密使得信息使用的有效性和效率成为一项极其困难的任务。此外，在云计算中，信息所有者/供应商可能会将外包信息提供给大量客户端。单个客户端可能只想恢复他们在整个会话期间感兴趣的某些特定信息记录。最受认可的方法之一是通过基于关键词的搜索来特定恢复文档，作为恢复所有加密文档的选项，这在分布式计算环境中是完全不现实的（Khan\
  \ & Wang, 2010）。\n\n# 背景\n\n首先，他们使用“休眠语义分析”来发现术语与报告之间的关系。休眠语义分析利用术语与文档关系中的某些高阶结构（“语义结构”），并获得一个缩减的向量空间来表示术语和报告。通过这种方式，术语之间的关系被自然地捕捉到。此外，他们的方案使用了安全的“k-最近邻\
  \ (k-NN)”来完成安全的搜索功能。所提出的方案可以返回正确的协调记录，因为作者的文档包含了与问题关键词语义上相关的术语。最后，实验结果表明他们的方法优于第一种\
  \ MRSE 算法（Song & Wagner, 2000）。他们的程序有几个关键要点。它们被证明是安全的：它们为加密提供了可证明的机密性，因为当仅给定密文时，不可信服务器无法学习有关明文内容的任何信息；它们为查询提供了查询隔离，意味着不可信的服务器无法获得查询输出之外的关于明文的其他信息；它们提供了受控搜索，使得不可信的服务器在没有客户端许可的情况下无法搜索主观词；它们还支持隐藏查询，以便客户端可以在向不可信服务器查询秘密词，而无需向服务器暴露该词（Sun,\
  \ Wang, Cao, Li, Lou, Hou, & Li, 2013）。他们提出了一种基于树的列表结构和用于多维（MD）计算的不同通用技术，以便搜索效率大大优于直接查询。为了进一步提高查询安全性，他们提出了两种安全文件方案以满足强危险模型下的严格保护要求，即已知密文显示和已知演示。此外，他们基于所提出的文件树结构设计了一种方案，用于对返回的索引列表进行真实性检查。最后，作者通过广泛的实验评估了所提方案的可行性和有效性。（Yu,\
  \ Lu, Zhu, Xue, & Li, 2013）。\n\n分布式计算已成为信息外包和卓越信息管理的充满前景的示例。云端敏感数据的担忧可能导致安全问题。信息加密在某种程度上确保了信息安全，但是以牺牲效率为代价的。搜索对称加密（SSE）允许在云上恢复编码信息。在本章中，重点是利用\
  \ SSE 处理信息安全问题。有趣的是，作者从比较性和计划激性的角度定义了安全问题。他们注意到考虑服务器端的订单范围加密 (OPE) 会泄露信息安全。为了消除泄露，作者提出了一种双轮可搜索加密\
  \ (TRSE) 算法，该算法支持多密钥关键词恢复。（Wong, D, Cheung, Kao, & Mamoulis, 2009）\n\n在本章中，他们讨论了在加密数据库上进行安全计算的通用问题，并提出了\
  \ SCONEDB（加密数据库上的安全计算）方案，它满足了执行和安全需求。作为背景分析，作者专注于加密数据库上的 k-最近邻 (kNN) 计算问题。作者构建了另一种非对称标量项保护加密\
  \ (ASPE)，它能够处理一种特殊的标量项。他们利用 `APSE` 开发了两种支持在加密信息上进行 `kNN` 计算的安全方案；这些方案中的每一个似乎都能抵御另一种基础学习水平的现实攻击，但代价是另一种开销。他们进行了广泛的执行研究以评估这些方案的开销和效率（Zhang\
  \ & Zhang, 2011）。\n\n自从 Boneh 等人提出带关键词搜索公钥加密 (PEKS) 算法的想法和开发以来，已经有了许多更新和扩展。合词关键词查询是这些扩展之一。许多此类构建方案无法理解子集关键词的合词搜索。子集关键词搜索意味着受益者可以查询密文中植入的所有关键词的子集。作者考虑了合词子集关键词搜索的问题，讨论了现有方案的缺点，然后给出了一种更有效的合词子集关键词搜索公钥加密\
  \ (PECSK) 算法。展示了与不同方案在效率方面的相关性。他们还列出了他们方案的安全要求，然后给出了安全性分析（Song, Wagner, & Perrig,\
  \ 2000）。\n\n# 作者主要关注\n\n## 问题、争议、困难\n\n### 数据所有者\n信息所有者将其信息外包给云端，以便相同的搜索操作员方便且一致地访问数据。为了保护信息机密性，信息所有者使用对称加密加密唯一信息。为了提高搜索效率，数据所有者为每个外包文档制作近似关键词。然后通过关键词和密钥形成等效索引。之后，数据所有者将加密文档和索引目录发送到云端，并将对称密钥和密钥发送给搜索操作员。\n\
  \n### 云服务器\n云服务器是作者的一个实体，提供由信息所有者建立的加密文档和索引索引，并为搜索用户提供信息访问和搜索设施。当搜索操作员向云服务器发送关键词访问时，它根据固定的算法解析一组等效文档。\n\
  \n### 搜索用户\n\n\n\n\n\n搜索操作符通过以下三个步骤从云服务器查询分包的小册。首先，搜索操作符从信息所有者处接收对称密钥和秘密密钥。其次，根据搜索关键词，搜索操作符使用秘密密钥生成哈希并将其发送到云服务器。最后，它从云服务器获取相应的文本集合，并使用对称密钥对其进行解密。\n\
  \n# RSA 算法\n\nRSA 是现代计算机用于解密和加密消息的过程。它是一种非对称加密技术。非对称资源意味着有两个不同的密钥。这被称为公钥加密，因为其中一个可以预先分配给所有人。另一个密钥必须是私有的。总之，整数的因数分解是极其困难的（分解分解问题）。RSA\
  \ 类的工作者随后会产生两个大素数的乘积，并以辅助速率作为他们的公钥。质数因子保持保密。任何人都可以公钥对通信进行加密，但在现有的方法下，如果公钥足够大，只有拥有素数因子信息的人才能实际上解码该通信。它被现代计算机用于加密和解密通信。它是一种非对称加密程序。非对称意味着有两个不同的密钥。这被称为公钥加密，因为其中一个可以给所有人。另一个密钥必须保持私密。\n\
  \n# 层次聚类\n\n它产生聚类的层次结构。\n\n两种方法：\n\n1. **凝聚法 (Agglomerative)**：一种自下而上的方法。每个观点从其个体聚类开始。随着层次结构的向上移动，若干聚类合并为一个。\n\
  2. **分裂法 (Divisive)**：一种自上而下的方法。解释从一个聚类开始，随着向层次向上移动递归地实现分裂。\n\n## 解决方案与建议\n\n##\
  \ 对称密钥算法\n\n1. 对称加密使用相同的密钥进行相互解密和加密。\n2. `DES` 被用作对称算法。\n3. 它们快速且复杂度低，因此很容易实现。\n\
  4. 在所有主机上应配置秘密密钥。\n\n## 非对称密钥算法\n\n1. 非对称密钥使用一个密钥解密，另一个密钥加密。\n2. `RSA` 是非对称算法之一。\n\
  3. 它比对称密钥算法慢。\n4. 不需要向所有主机上配置秘密密钥。\n\n## Knn 算法\n\n1. 划分聚类。\n2. 划分区域之间相互独立。\n3.\
  \ 对聚类中心的初始化敏感。\n4. 由于初始化不当，可能会出现收敛速度慢和整体聚类效果差。\n5. 仅适用于圆形。\n6. 对非凸形状效果不佳。\n\n# 层次聚类算法\n\
  \n1. 层次聚类。\n2. 使用树结构进行可视化。\n3. 可以给出不同的划分。\n4. 不需要指定聚类的数量。\n5. 它可能很慢。\n6. 有两种类型：凝聚法和分裂法。\n\
  \n# 未来研究方向\n\n作者建议进一步扩展应用，以考虑文件集的可扩展性和云的多用户环境。通过这种方式，可以在扩展性和多用户云环境方面获得初步结果。另一个性的主题是改进高度可的可搜索加密，允许作者在大型实际数据库上进行组织探索。\n\
  \n## 结论\n\n研究了基于云加密数据的细粒度多密钥搜索 (FMS) 方法，并提供了两种 FMS 方案。`FMS I` 包含了关键词的偏因子和相关性评分，以提高搜索准确性并相应提高用户的知识。`FMS\
  \ II` 实现了安全以及作者组织的函数搜索，即关键词的“与”、“或”和“否”操作。此外，作者还规划了支持分类子字典 (`FMSCS`) 的改进方法以提高效率。作者在这些方面使用了层次聚类计算。\n\
