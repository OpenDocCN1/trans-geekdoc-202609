  \n# 第 4 章\n\n* Sameera K. - 印度维特理工大学 (VIT University)\n* P. Swarnalatha - 印度维特理工大学\
  \ (VIT University)\n\n## 摘要\n\n随着行政注册和分布式计算的普及，越来越多的行政机构在互联网上发展，产生了海量信息。行政管理产生的令人惊叹的信息过于庞杂且复杂，无法通过传统方法进行有效处理。如何存储、管理并从行政产生的海量数据中提取价值，已成为一项重要的研究课题。面对不可阻挡的海量数据增长，迫切需要一个能够为管理和分析各种行政产生的数据提供通用功能的单一框架。为了应对这一挑战，本章对行政产生的大数据数据和`大数据即服务`（big\
  \ data-as-a-service）进行了综述。首先，利用三类行政产生的大数据来优化框架性能。随后，利用`大数据即服务`（包括`大数据基础设施即服务`、`大数据平台即服务`和`大数据分析软件即服务`）为客户提供常规的大数据相关服务（例如访问服务产生的大数据和数据调查结果），以提高效率并降低成本。\n\
  \n## 引言\n\n进入 21 世纪后，全球经济结构正在从“机械经济”向“服务经济”转型。根据`世界银行`的见解，现代服务业的产值占全球总产值的 60%以上，而在发达国家的比例超过了\
  \ 70%。当前服务业领域的竞争正成为全球经济增长的焦点。服务注册通过为现代服务业提供灵活的注册设计方案，已发展成为一个极具前景的研究领域。随着分布式计算的普及，越来越多的现代行政机构被部署在云平台上以提供丰富的功能。行政机构及其客户数量正在快速增长。在移动设备普及、客户非正式组织以及大规模服务定位框架的背景下，这些行政机构的数据时代引发了巨大的信息爆炸。行政产生的惊人数据同样庞大且复杂，无法通过传统方法进行可行的处理。\n\
  \n在数据创新领域，大数据已成为一种广泛认可的趋势，吸引了政府、工业和学术界的关注。大数据是高容量、高速度且高多样性的数据资源，需要新型的数据处理方法来增强基础决策能力、理解揭示和流程改进（M.\
  \ A. Beyer & D. Laney）。根据`合规、治理与监督委员会`（`CGOC`，一个专注于信息治理的协会）的规定，大多数机构的数据量每 18-24\
  \ 个月翻一倍，且全球 90%的信息是在过去两年内产生的（D. Austin）。2012 年 3 月，`奥马`政府报告了一项大数据创新活动，研究了如何利用大数据来解决立法面临的紧迫问题。领先的\
  \ IT 组织，例如`SAG`、`Oracle`、`IBM`、`Microsoft`、`SAP`和`HP`在购买数据上的花费已超过 150 亿美元。仅这一个行业的价值就超过\
  \ 1000 亿美元，并以每年 10%的速度增长。\n\n\n\n\n# 图 1 展示了管理产生的海量信息和大数据即服务的概述。\n\n如图所示，一方面，我们将介绍一些常见的应用，这些应用分别利用三类由管理产生的海量信息来用于框架执行的升级。首先，通过挖掘要求管理请求的追踪日志，对日志表示以及程序执行结论进行检查。其次，根据业务\
  \ QoS 数据，重点关注 QoS 感知的故障弹性愈性管理和管理 QoS 预测。最后，通过检查管理关系，完成重要的管理可观测性证明和业务迁移。这些实用的应用将通过挖掘使用产生的海量信息，揭示关于海量信息研究问题的一些见解。\n\
  \n此外，为了便于访问管理产生的海量信息和不同的海量信息逻辑，`Big Data-as-a-Service` 也作为一种基础架构被提出，用于存储、管理和从海量信息中获取激励。图\
  \ 1 显示了大数据即服务的结构，它包含三层，即大数据基础设施即服务、大数据平台服务和大数据分析程序服务。通过标准和可编程的 API，大数据即服务赋予了各种海量信息的动态加入以及各种大数据分析方式的结合，以处理从管理产生的海量信息中获取激励。\n\
  \n| 图 1. 使用触发的海量数据与大数据服务的分析 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch004.f01](img/ch004.f01.png)\
  \ |\n| --- |\n\n## 使用触发的海量数据\n\n如今，互联网上提供了各种在线服务，每天都有大量的客户使用。每当你执行查询、发送电子邮件、发布微博或（另一方面）在在线商务网站上购物时，你都在为管理创建了一条追踪信息。\n\
  \n如图 2 所示，随着管理端和客户端数量的扩大，管理产生的信息（包括管理日志、业务 QoS 数据和管理关系）不断增长，引发了海量数据奇。随着管理产生的海量信息不断增加，如何从信息中提取价值成为一个关键的研究问题。相关的子领域将详细描述如何对业务产生的信息进行准备和分析，以升级框架执行。\n\
  \n| 图 2. 使用触发的海量数据 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch004.f02](img/ch004.f02.png)\
  \ |\n| --- |\n\n## A. 使用指示的注册\n\n随着大规模业务定位框架的推广，以及管理客户端（例如 PC、手机等）数量的不断增加，管理安排的框架每天产生大量的追踪日志。每天产生数十亿条日志、日志文件以及来自各种管理框架的结构化/非结构化信息。例如，阿里巴巴（全球最大的网络商务组织之一）提供的电子邮件服务每小时会产生约\
  \ 30-50 GB（约 1.2 亿-2 亿行）的追踪日志（H. Mi, H.Wang, Y. Zhou, M. R. Lyu, & H. Cai）。这些日志可以用于改进阶段，也可以用于日常运行，以理解和研究复杂框架的行为。\n\
  \n随着分布式框架的规模和复杂性迅速增加，大规模分布式框架（如分布式计算框架）通常包含无数业务分段，有时跨越许多台机器，这使得从物理上分析执行问题变得极其困难。通过挖掘这些使用产生的追踪日志的方法，可以获取重要数据，帮助业务源者和工程师理解并改进框架的特性。例如，可以通过分析追踪日志来实现执行瓶颈定位。然而，目前仍有很多待处理的困难。一方面，管理产生的海量追踪日志使得发现工作集中；另一方面，对持续框架分析的需求不断增长。\n\
  \n该领域讨论了如何研究追踪日志以发现其中隐藏的价值，包括追踪日志感知以及执行问题结论。\n\n### 1. 触发注册愿景\n\n分布式框架在规模和业务协作方面不断发展。对于框架规划者和主席来说，理解框架的属性正变得越来越困难。日志表示提供了工具，能够对日志记录（或日志查询结果）以用户最易理解的方式进行处理。\n\
  \n### 2. 执行困难检测\n\n在当今的分布式框架中，特别是云框架，一个管理请求会经历不同的主机，唤起各种编程模块。当管理无法向客户满足保证的业务水平协议（SLA）时，及时识别是哪个模块（例如一个被调用的技术）是执行问题的根本原因是非常基础的。追踪日志提供了发现执行问题原因的重要数据。\n\
  \n\n\n\n在近期的研究中，已有大量研究工作致力于解决这一问题。例如，Magpie (P. Barham, A. Donnelly, R. Isaacs,\
  \ & R. Mortier)、Pip (P. Reynolds, C. Killian, J. L. Wiener, J. C. Mogul, M. A. Shah,\
  \ & A. Vahdat) 以及 Iron 模型 (E. Thereska & G. R. Ganger) 都是特定应用的方法，它们需要空间学习来构建执行结论模型。Pinpoint\
  \ (M. Chen, E. Kiciman, E. Fratkin, A. Fox, & E. Brewer) 利用聚合计算来收集失败和成功日志。Spruce\
  \ (B. H. Sigelman, L. A. Barroso, M. Burrows, P. Stephenson, M. Plakal, D. Beaver,\
  \ S. Jaspan, & C. Shanbhag) 利用 `Bigtable` 来处理大量的追踪日志。信息挖掘技术，例如主成分分析 (`PCA`) 和强主成分分析，也被用于通过展示和挖掘追踪日志来识别执行瓶颈（H.\
  \ Mi, H.Wang, Y. Zhou, M. R. Lyu, & H. Cai），(L. Shao, J. Zhang, Y. Wei, J. Zhao,\
  \ B. Xie, & H. Mei, 2007)。\n\n无论如何，用户产生的海量且高频率的追踪日志使得实时分析变得极其困难。大多数过去的方案在处理海量信息时面临着效率低的负面影响。针对用户产生的追踪日志，需要更有效的容量、管理和调查方法。\n\
  \n### B. 使用 QoS 数据\n\n当前的大规模分布式阶段（例如不同的云分阶段）为异构且扩展的客户端提供了各种服务。这些服务的海量 QoS 信息在服务器端和客户端均有记录。由于不同的客户端在同一服务上可能观察到非常独特的\
  \ QoS 执行情况（例如响应时间），用户端的 QoS 信息量远大于服务器端的 QoS 信息。此外，服务段的 QoS 估计随时间不断演变，导致客户端服务 QoS\
  \ 数据大幅增长。\n\n通过研究这些客户端服务 QoS 数据，可以获取有效信息，其目标是提升系统性能，例如实现灵活的容错并为用户提供定制化的 QoS 预期。\n\
  \n*   **1. 故障偏差**：服务的配置环境极其复杂且异构，其中某些服务可能会失效，新服务可能会被加入，服务的 QoS 可能会经常变化。与传统的单一编程框架相比，在如此极端的环境下构建稳健的容错框架要困难得多。容错编程适配（M.\
  \ R. Lyu）是利用功能相似的组件来忍受故障以构建可靠系统的重要途径。在 Web 领域，可以利用不同关联提供的功能相同的 Web 服务来构建容错的体系化框架。在设计容错技术时，可以考虑服务\
  \ QoS 数据以改进性能。\n\n在大规模分布式阶段中，大量的服务在运行时被不断观测。记录了大量的 QoS 信息（例如响应时间、可用性、吞吐量等）。此外，在调用主服务后，客户端还会记录被调用服务的\
  \ QoS 情况。如何高效可靠地处理这些海量的服务 QoS 信息，以配置出能够适应动态条件并实现最佳性能的容错系统，是一项挑战性的研究问题。\n\n在我们过去的工作中（Z.\
  \ Zheng & M. R. Lyu），已设计了一种用于容错 Web 服务的性中间件。尽管如此，该中间件并未为不同的客户端提供定制的容错系统。在动态的互联网环境下，服务器端对非关键故障的适应是不够的，因为关联连接可能会随时崩溃。应该考虑定制化的客户端非关键故障适应性。此外，为了加速海量服务\
  \ QoS 数据的调查和计算，应当探索基于 Web 的学习算法（H. Yang, Z. Xu, I. King, & M. Lyu），以便在新的 QoS 值出现时对容错过程进行增量式刷新。\n\
  \n*   **2. QoS 预测**：Web 服务 QoS 预测通过利用不同客户端的可观测 QoS 估计，为服务客户端提供定制化的 QoS 值预测。Web 服务\
  \ QoS 预测通常比客户端服务框架更复杂，网络中的每个节点代表服务客户端看到的某个 Web 服务特定 QoS 属性（例如响应时间）的估计。客户端服务矩阵通常非常稀疏且有很多缺失，因为客户端过去通常只访问了少数\
  \ Web 服务。问题在于如何利用已有的 QoS 值精确预测客户端服务矩阵中缺失的 QoS 值。在预测出客户端服务框架中缺失的 Web 服务 QoS 值后，每个客户端都可以对每个服务进行\
  \ QoS 评估，即使是对未使用的服务。因此，可以可以选择最佳的服务来实现卓越性能。\n\n在服务处理过程中，Web 服务 QoS 预期近期引起了大量关注。为了解决这一问题，已提出了多种\
  \ QoS 预期方法，包括基于客户端的 QoS 预测方法（L. Shao, J. Zhang, Y. Wei, J. Zhao, B. Xie, & H. Mei）、基于客户端和基于混合方法（Z.\
  \ Zheng, H. Ma, M. R. Lyu, & I. King）、基于排序的方法（Z. Zheng, H. Ma, & M. R. Lyu）以及基于\
  \ I. King 聚合的方法（X. Chen, Z. Zheng, X. Liu, Z. Huang, & H. Sun）等。一些目前的工作（M. Tang,\
  \ Y. Jiang, J. Liu, & X. F. Liu），（W. Lo, J. Yin, S. Deng, Y. Li, & Z. Wu）还考虑了 Web\
  \ 服务和服务客户端的领域，以改进服务状态的状况数据并相应提升预期质量。\n\nC. 使用关联\n\n\n\n\n现如今，大规模的分布式框架通常包含大量的服务组件。这些服务组件通常被部署在分布式的计算节点（即物理机或虚拟机）中，并具有复杂的调用关系。例如，为了在\
  \ Amazon 的某一个业务目的地的页面生成动态 Web 内容，每个请求通常都需要页面渲染组件通过向 150 多个服务发送请求来构建其响应（G. DeCandia,\
  \ D. Hastorun, M. Jampani, G. Kakulapati, A. Lakshman, A. Pilchin, S. Sivasubramanian,\
  \ P. Vosshall, & W. Vogels）。这些组件之间相互关联。服务组件之间的调用关系可以显示为加权协调图，其中图中的一个节点代表一个服务组件，从一个节点指向另一个节点的有向边表示调用关系。每条边上的权重可以表示为调用的成本或发生频率。这种服务调用图可以在运行时根据某些原因进行逐步更新，例如：实例的增加/减少、实例迁移、堆栈调整等。\n\
  \n通过分析和利用服务调用图，可以获取重要数据以识别出关键服务组件，从而实现更高效的服务迁移。\n\n### 1. 关键使用组件的识别\n\n不同服务组件的稳定性可能对整个服务框架产生不同的影响。通过分析服务调用图，可以识别出关键服务（例如中心组件或薄弱组件）。这能极大帮助我们了解如何优化框架结构以及如何提高框架的稳定性。例如，可以针对这些大型服务组件设计额外的非关键故障处理策略，以实现更高的稳定性。然而，由于服务组件的动态创建机制，服务调用图在运行时不断刷新。此外，大规模框架的趋势使得服务调用图变得非常庞大且复杂。可以使用随机定位算法来针对特定框架识别图中的关键服务。\n\
  \n在我们的探索性研究中，我们认为一个尽可能经常被许多其他关键组件调用的组件是极其关键的，并提出了一种基于随机游走的方法来处理云框架中的关键服务识别。此外，Liu\
  \ 等人（A. Liu, Q. Li, L. Huang, & S. Wen）提出利用服务关系来帮助服务的权重计算，这进一步增强了框架的健壮性。尽管如此，仍有许多研究问题需要解决，例如：（1）证明不同服务组件之间的关联（例如，组件\
  \ `a` 和 `b` 调用同一个组件 `c`，则认为组件的 `a` 和 `b` 之间存在连接）；（2）证明组件对整个框架的影响，这有助于我们增强整个框架的健壮性；（3）设计更高效、成功的方法来构建和分析服务调用图，并识别关键服务。\n\
  \n### 2. 使用迁移\n\n分布式框架通常包含各种服务组件，这些组件应被部署到各个节点（即物理机或虚拟机）。由于服务环境非常复杂，在底层部署后，定期优化候选节点之间的服务迁移策略，以便在限制运营成本的同时实现理想的整体框架性能。因此，动态服务迁移需要在运行时将服务从一台物理机移动到另一台。这是许多商业云平台中的一种典型做法。\n\
  \n通过展示和利用服务调用关系以及以往的服务经验，服务的合法迁移可以提升现有用户的体验。在我们的过去工作中（Y. Kang, Z. Zheng, & M. Lyu），定义了一个基于整数规划的初步模型，以实现服务的理想重部署。然而，这种基于整数规划的模型在面对无数且竞争性的节点时会遇到扩展性问题。该模型在（J.\
  \ Zhu, Z. Zheng, Y. Zhou, & M. R. Lyu）中通过考虑服务关系得到了进一步增强，该研究建议使用遗传算法来高效求解证明问题。随着云组织的发展，其他工作（例如，(Q.\
  \ Zhang, Q. Zhu, M. F. Zhani, & R. Boutaba; M. Steiner, B. G. Gaglianello, V. K.\
  \ Gurbani, V. Hilt, W. D. Roome, M. Scharf, & T. Voith, M. Alicherry & T. V. Lakshman）还考虑了地理位置合理的云中的动态服务部署和迁移，以获得理想的服务性能。\n\
  \n为了适应日益增长的服务迁移问题，需要更高效的方法。例如：（1）在考虑服务间调用关系的同时，可以考虑服务区域以进一步增强迁移执行；（2）利用 QoS 预期策略，安排服务之间以及客户端与服务之间的延迟，以实现更好的服务迁移执行；（3）为了加速理想服务迁移程序的计算，可以研究整数规划、不同的机器学习算法（例如基于\
  \ Web 的学习）、k-means 增强、遗传算法等，以实现高效的服务迁移。\n\n### 结论与未来工作\n\n本文介绍了服务产生的大数据和“大数据即服务（Big\
  \ Data-as-a-Service）”。三类使用产生的大数据被用于提升面向服务型框架的特性。为了提供基础的大数据管理和分析功能，探索了大数据即服务，通过向客户端提供\
  \ API 来访问服务产生的大数据以及产生的大数据分析。\n\n未来，将在服务跟踪日志、QoS 数据、服务关系等更多类型的服务产生数据的基础上进行研究。对不同的服务产生大数据方法进行更全面的调查。还将探讨本文范围之外的安全问题。\n\
