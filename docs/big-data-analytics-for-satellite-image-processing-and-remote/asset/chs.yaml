  \ (印度 VIT 大学)\n\n## 摘要\n\n在数据挖掘、机器学习和模式识别领域，有许多方法可以解决分类问题。在过去的几年几年里，从海量数据中检索和提取信息正在快速增长。分类无非是使用某些现有数据对响应进行逐步预测的过程。一些现有的预测算法是`support\
  \ vector machine`（支持向量机）和`k-nearest neighbor`（k 近邻）。但根据数据类型，每个算法总是存在缺点。为了减少误分类，引入了一种新的支持向量机方法。不再让超平面正好位于中间，而是根据超平面附近类别数据点的数量来改变超平面的位置。为了优化分类算法计算的时间消耗，使用了某些多核架构同时计算多个独立模块。所有这些导致了误分类的减少，并加快了数据点类别的计算速度。\n\
  \n## 引言\n\n如今，许多机构正在使用“大数据”、“机器学习”技术进行数据分析。这些术语描述了可用数据是复杂且庞大，以至于使用限制数据大小和类型的现有统计算法变得变得非常笨拙。现有的数据挖掘算法通常可以分为子类型，如“关联规则挖掘”、“分类”、“聚类”（高效文本分类的特征选择技术和分类算法综述）。分类技术适用于从非结构化数据到良好结构化数据的关联。大数据领域引入了大量的分类技术。由于每个算法根据需要分类的数据类型，都有其自己的优缺点。这些技术的性能通常用成本来衡量，而成本就是所需的计算时间和误分类率。\n\
  \n### 什么是机器学习？\n\n可以这样看待“机器学习”：作为一个人类，并作为创新的客户，你完成了某些任务迫使你选择或对某物进行分组的事务。例如，当你早晨阅读你的收件箱时，你选择将那封“点击此处，机会赢得免费游轮”的邮件标记为垃圾邮件。计算机如何知道做类似的事情呢？机器学习涉及指示计算机执行个人每天完成的任务的算法。\n\
  \n指导计算机的主要努力包括通过指令计算机来指导计算机。如果我们需要教导计算机预测天气，我们可能会写一个程序：如果天气阴天且降雨概率大于一半，那么建议带伞。\n\
  \n### 为什么大家都在谈论机器学习？\n\n正如上面提到的，用于指导计算机完成任务并像人类的基本算法可以追溯到很久以前。与模型最初设计时相比，现在的不同在于，进入模型中的数据越多，它们就变得越精确。过去的几十年见证了信息的巨大灵活性，提供了比长期机器学习历史上所想象的精确得多的预测。\n\
  \n机器学习领域的新系统——通常包括整合目前已经存在的各个部分——促成了“深度神经网络 (DNN)”领域研究的卓越进展。这并不是某项重大飞跃的结果，而是速度快得计算机以及大量分析师做出增量改进的结果。这使科学家能够扩展机器学习的可能性，直到机器在困难但难以描述的任务上击败人类，例如识别外观或下围围棋。\n\
  \n\n\n\n机器学习具有一些功能极其强大的应用，它们驱动了真实业务的产生——例如节省时间和金钱——这些应用可能会显著影响你组织的最终命运。特别是在 `Connections`，我们看到客户服务行业正在发生巨变，机器学习正让人们能够以更快、更高效的方式完成任务。通过虚拟助手安排，机器学习将某些本应以某种方式由人工操作员执行的任务自动化——例如，重置密钥或检查记录调整。这节省了大量的操作员时间，这些时间可以集中在人类最擅长的客户服务类型上：高接触、复杂的领导工作，而这些是机器无法得到有效处理的。在\
  \ `Associations`，我们还通过消除“应将需求发送给人类还是机器”的选择来进一步优化了流程：这是一种独特的通用理解技术，机器学会了自己的局限性，并在对提供正确方案的置信度较低时交由人类处理。\n\
  \n# 支持向量机\n\n在“支持向量机”中，决策边界是根据决策平面定义的。该平面分离不同类别的数据点（Ali AlShaari, M., 2014）。示例如图\
  \ 1 所示。在这个示例中，有两个类别的数据点，用两种不同的颜色表示。在图中，一侧是同类的数据点，另一侧是另一类的数据点，它们被一条线隔开。新数据点的类别可以根据该数据点属于分割线的哪侧来决定。分类算法分为两种：“线性分类”和“非线性分类”。当且仅当存在清晰的直线可以将数据点划分为不同的组时，“分类”就是线性的，这无非是线性分类（Guang-chao,\
  \ W., 2008）。如果没有清晰的直线来分离两个不同的类别，那么就是非线性分类。\n\n| 图 1. SVM 分类器 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch003.f01](img/ch003.f01.png)\
  \ |\n| --- |\n\n上述是线性分类器的经典示例，即用一条线将一组数据点划分到各自的类别（在本例中为绿色和红色）的分类器。大多数分类工作具有更复杂的结构，并且需要进行最优分离，这并不简单，即根据已知类别的现有数据点来正确地分类新数据点。这种情况在下面的插图中所示。与之前的示意图相比，完全分离绿色和红色对象需要一条曲线（这比直线更复杂）。基于绘制分割线以区分不同类别成员数据点的分类任务被称为超平面分类器。“支持向量机”特别适合处理此类任务。\n\
  \n| 图 2. SVM 分类器 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch003.f02](img/ch003.f02.png)\
  \ |\n| --- |\n\n下方的表述展示了“支持向量机”背后的核心思想。在这里我们看到原始数据点被映射（即调整），使用了一组被称为核函数的函数。这种重构数据的方法被称为映射（Gumus,\
  \ F., 2014）。\n\n# 背景\n\n分类适用于从非结构化到良好结构化的数据。该领域引入了大量的分类技术。根据数据类型的不同，每个算法在计算时间和成本方面都有其自身的优缺点。\n\
  \n# 分类在数据挖掘中的作用\n\n根据收集到的信息，利用数据挖掘算法来创建所存储信息的表描述，或者预测结果（Laskov, P., & Lippmann,\
  \ R., 2010）。然而，在标准的 KDD 过程中，任何这些任务的组合都可以被调用以实现预期的结果。KDD 需要的步骤是：\n\n## 1. 描述任务这些任务描述了正在挖掘的信息，它们是：\n\
  \n* **总结**：专注于描述信息子集的最少模式。用于完成此任务的技术是关联规则算法。\n* **分段或聚类**：将信息对象分离成彼此相似的子集。利用基于分段的算法来完成这项任务。\n\
  * **变化和离群检测**：识别连续信息中的变化（例如，蛋白质测序、行为分组等）。\n* **依赖建模**：构建信息内部的因果关系模型。\n\n## 2. 预测任务\n\
  \n根据不同字段的数据预测数据库中某些字段的内容。\n\n* **分类**：预测离散变量的所有可能状态（其类别）。\n* **回归**：预测数值连续型因素的结果。\n\
  \n## 分类\n\n## 分类\n\n### 模型构建\n模型开发是从训练集中构建模型。\n\n* 每个元组/测试用例被预期具有一个预定义的类别\n* 元组/测试用例的类别由类别名称属性决定\n\
  * 元组/测试用例的训练集用于模型开发\n* 模型表示为排列规则、决策树或科学公式\n\n### 模型使用\n* 对未来或未知的项目进行分组\n* 评估模型的准确性\n\
  * 将测试元组/测试用例的已知类别进行比较，并给出模式产生的结果\n* 准确率 = 模型有效分类的测试元组/测试用例率\n\n# 数据分类中的现有方法\n\n\
  随着数据库和数据中心存储了海量信息，开发有能力的工具来调查此类信息并从中挖掘有趣的知识变得日益紧重要。信息挖掘是从这种海量信息中解释学习的过程。信息挖掘有三个重要的部分：聚类或分类、关联规则和序列分析。信息分类是信息挖掘应用中的一个关键步骤。\n\
  \n\n\n\n\n根据简单定义，在表征/聚类中，我们对信息的排列进行拆分，并产生一组集合原则，这些原则可用于对未来的信息进行分组。例如，人们可以对感染进行排序，并给出描述每个类或子类的副作用。这与测量和机器学习中的传统工作有许多相似之处。无论如何，由于信息量的庞大，出现了一些重要的新问题。数据挖掘中的核心问题之一是以分类为引导的学习，它包括发现能够将给定的信息划分到预定义类别的决策。在包含大量记录和数以亿计记录的数据挖掘空间中，现有算法的执行时间可能变得非常受，特别是在直观的应用程序中。在数据表征中，根据类名准备数据排列中展示的特征，为数据库中的每个类构建一个表征或模型。已经有了许多数据组织技术，例如决策树策略、例如统计技术、神经网络、模糊集、数据库定位技术等。\n\
  \n# 数据分类方法\n\n下面的列表展示了可用的数据组织技术。\n\n- **统计算法**：统计学分析框架，例如 `SAS` 和 `SPSS` 已被专家用于识别意外模式并利用统计模型（例如`线性模型`）解释模式。此类框架有其地位，并将继续被使用。\n\
  - **神经网络**：人工神经网络模拟了人类大脑发现模式的能力，因此一些专家建议将 `Neural Network` 算法应用于模式映射。神经网络已成功应用于包括聚类在内的若干应用中。\n\
  - **遗传算法**：利用共同进化的思想，在框架中利用过程（例如遗传交叉、变异和选择选择）的优化系统。\n- **最近邻方法**：该程序通过考虑验证数据集中与它最相似的\
  \ `k` 条记录的类别组合，对数据集中的每个记录进行排序。有时称为 `k-最近邻` 方法。\n- **规则提取**：从考虑了统计重要性的信息中提取有用的 `if-then`\
  \ 规则。\n- **数据可视化**：多维信息中复杂关系的视觉化阐释。\n\n许多现有方法建议在将测试信息划分到不同的类之前对其进行抽象。在排序之前进行反思有几种选择：信息索引可以被总结为微小汇总的决策水平、过渡性决策水平或高决策水平。决策水平过低可能导致类别分散、密集的聚类树以及紧凑语义理解的困难；但水平过高可能会导致表征准确性的丢失。\n\
  \n## 1. 遗传算法\n\n进化已成为发现困难问题佳答案的有效工具。人们可以将正交选择视为一种进化策略，它尝试为特定条件创建足够的答案。\n\n尽管 `GA`\
  \ 在各种优化问题中有大量的应用，但几乎没有关于利用这种方法来处理分类问题的研究。考虑到这项技术已在不同领域和问题中出现的排列性质（Beasley, Bull\
  \ & Martin, 1993a, & Mitchell, 1996），尝试在分类问题中使用它是有前景的。\n\n`GA` 的灵活性是一个需要优先考虑的关键观点。通过相似的基因组表征并仅通过改变适应度函数就可以获得另一种算法。由于空间搜索，这尤为重要，因为人们可以在探索阶段尝试不同的适应度函数。\n\
  \n在基因中，每个属性代表一个数据点并表征类成员。所有重要的进化操作都可以按照此计划执行。正如 Demiriz (1999) 指出的，与这种表征计划相关的每个实际问题，是它是不可适应的，但在数据焦点不是非常大的时候，它在计算上无疑是有效的。\n\
  \n## 2. 决策树\n\n决策树是一种表征计划，它产生一棵树和一组规则，表示来自给定数据集中不同类别的模型。用于创建表征策略的可用记录排列大部分分为两个互不相交的子集，如下：\n\
  \n- a. **准备集**：用于推断分类器。\n- b. **测试集**：用于评估分类器的准确性。\n\n分类器的准确性取决于被准确分类的测试用例的比例。记录的特征被分为两种类型，如下：\n\
  \n- a. **数值特征**：空间为数值的属性。\n- b. **离散特征**：区域不是数值的属性。\n\n有一个已知的属性称为 `类标记`。排列的目标是构建一个紧凑的模型，用于预测类标记未知的记录的类别。\n\
  \n决策树是一棵树，其中内部节点是对某个属性的测试，树分支是测试的结果，而叶子节点是类名或类分布。\n\n决策树的生成有两个阶段：\n\n### 树构建\n\n\
  - 在开始，所有准备用例都在根节点\n    - 考虑所选属性的划分用例\n    - 根据启发式或统计量选择测试属性\n\n### 树剪枝\n- 识别并消除反映噪声或异常的分支\n\
  \    - 从根到叶子的树中的每条路径产生一条规则\n    - 沿着路径结构的每个属性值匹配结构构成一个合与\n    - 叶子节点持有类期望\n    -\
  \ 规则通常比树更易理解\n\n### 树构建原则\n\n从给定的准备信息索引构建决策树有多种技术。下面检查了决策树工作所需的若干基本思想。\n\n#### 分割属性\n\
  在决策树的每个节点处，都有一个相关的属性，其属性决定了节点扩展时信息索引的分配。\n\n#### 分割准则\n节点处部分属性的合格条件被称为该节点的属性准则。\n\
  \n\n\n\n\n在处理 k-means 问题最著名的启发式方法中，一种非常颖出的方法取决于一种寻找局部理想布局的基本迭代方案。该算法通常被称为 `k-means`\
  \ 算法。该算法有多种变体，为了阐明我们使用的是哪一个版本，我们将其称为`轻信 k-means`（credulous k-means）算法，因为它与此处描述的其他算法相比，实质上要简单得多。\n\
  \n朴素的 `k-means` 算法将数据集划分为 `k` 个子集，最终目标是每个子集中的所有记录（从现在开始，未来提到的统称为焦点）对于某个相似的焦点都有一个“归处”。同样，每个子集中的焦点到其内部焦点的距离比到其他焦点的距离近。这种空间的划分与\
  \ `Veronesi` 的划分形成对比：在 `Veronesi` 中是根据分离性来划分空间，而在这里是根据分离性来划分焦点。\n\n该算法监控各个子集的质心，并持续进行简单的迭代。初始划分是随机创建的，也就是说，我们随机在空间中的几个焦点处建立质心。在每一个循环步中，利用当前的质心布局通过通过两个极其简单的步骤创建另一个质心布局。让我们通过以下方式来确定第\
  \ `i` 次迭代后的质心布局：\n\n以下操作在中间步骤中执行：\n\n*   根据质心 `C(i)` 划分焦点，即找到数据集中的每个焦点属于哪一个质心。焦点根据它们与质心之间的欧几里得距离进行分配。\n\
  *   将另一个质心 `c(i+1)` ∈ `C(i+1)` 设置为距离 `c(i)` ∈ `C(i)` 最近的若干焦点的平均值。质心在特定区域的新区域被称为旧质心的新区域。\n\
  \n当重新重新计算分配不再导致划分变化时，该算法认为已收敛。在我们使用的术语中，当 `C(i)` 和 `C(i – 1)` 无法区分时，算法已完全收敛。对于没有点到多个焦点处于等距离的设计，可以很容易达到上述收敛条件。这种收敛属性及其简单性增强了\
  \ `k-means` 算法的吸引力。\n\n朴素的 `k-means` 需要对数据集中的焦点执行无数“邻居”查询。如果数据是 `d` 维的且数据集中有 `N`\
  \ 个焦点，单次强调的代价为 `O(kdN)`。由于需要运行几个循环，对于大量的焦点，运行朴素的 `k-means` 算法通常是不可行的。\n\n有时，质心的合并（即\
  \ `C(i)` 和 `C(i+1)` 无法区分）需要几个循环。同样，在最后几次迭代中，质心几乎不移动。由于运行如此高成本的循环在许多情况下并不高效，我们需要一种质心合并措施，以便在满足收敛标准时停止迭代。扭曲（Twisting）是最广泛接受的措施。\n\
  \n聚类误差（Bunching error）遵循类似的规则，有时被用来代替扭曲。事实上，`k-means` 算法旨在改进扭曲。将簇焦点放在若干焦点的平均值限制了组内焦点的扭曲。同样，当另一个簇焦点比其当前的簇焦点更像一个点时，将组从其当前簇移动到下一个簇可以进一步减少扭曲。这两个阶段正是\
  \ `k-means` 组所执行的方法。借此，`k-means` 在每次局部迭代中都会减少扭曲。`K-Means` 算法终止于一个扭曲能力局部理想的答案。因此，扭曲是一个收敛标准的特征决策。在不同分析人员使用的不同合并标准中，我们可以量化新质相对于旧质心的总欧几里得距离。在这个命题中，我们通常使用聚类误差/扭曲作为所有\
  \ `k-means` 算法变体的收敛规则。\n\n## 5. 贪心 K-Means 算法\n\n该算法改进了 `k-means` 的局部收敛属性。同样，它不需要选择基础的质心布局。其思想是通过具有少一个组的全局聚类通过一系列邻居搜索来达到全局最小值。\n\
  \n**假设：** 算法使用的假设是，通过运行 `k-means` 达到全局最优，其中 `(k-1)` 个簇放在 `(k-1)` 聚类问题的理想位置，并将第 $k$\
  \ 个组放在一个尚未发现的合适位置可以达到全局最优。\n\n让我们假设问题是找到 `K` 个簇，且 `K' ≤ K`。我们使用上述假设，对于 `k = K'`\
  \ 个簇的全局最优被记录为一系列邻居搜索。假设我们已经解决了 `K' – 1` 个簇的 `k-means` 聚类问题，我们需要将另一个组放在合适的区域。为了找到未知的合适区域，我们运行\
  \ `k-means` 算法，直到数据集整个焦点布局中的每个焦点都轮流作为候选新组，逐一被加入到 `K' – 1` 个簇中。在上述邻居搜索中通过 `k-means`\
  \ 合并后，具有基础误差的中心化 `K` 个簇就是全局 `k-means` 的簇。我们知道对于 `k = 1`，理想的聚类布局是若干焦点的平均值。利用上述技术，我们可以确定\
  \ `k = 2, 3, ... K` 的理想位置。随后，该过程包括确定每个 `K = 1, 2...K` 簇的理想 `k-means` 社区。该算法是完全确定的。\n\
  \n尽管全局 `k-means` 的魅力在于它能找到全局布局，但该方法的代价是巨大的。`K-means` 需要运行 `N` 次（其中 `N` 是数据集中的焦点数量），以便嵌入每个组。通过不在每个数据集焦点处嵌入新组来运行\
  \ `K-means`，而是寻找另一个可以作为新组包含区域的焦点布局，可以显著减少这种不确定性。\n\n`kd-tree` 的变体通过通过节点焦点平均值的平面并与焦点本质部分相反的平面来划分节点中的焦点。如果一个节点没有恰指定数量的焦点或者达到叶节点数量的上限，则该节点不是部分。其思想是，即使没有将\
  \ `kd-tree` 用于最近邻居查询，仅根据该系统开发 `kd-tree` 就会对数据给出良好的准备聚类。相应地，我们可以将 `kd-tree` 焦点作为新簇的候选/初始包含位置。\n\
  \n\n\n\nK-means 将持续运行，直到将此额外点作为新组进行新的聚类轮次并达到合并。其假设是，使扭曲产生最剧烈减小的点，也是使聚焦聚类产生损耗最小的点。这些结果导致了算法运行时间的显着变化，因为对所有可能的包含位置运行\
  \ k-means 是没有意义的。尽管如此，该安排可能并非全完备的理想方案，而是一个不精确的全局安排。\n\n## 6. 自组织映射 (Self-Organizing\
  \ Map)\n\nSOM 可以被描述为：\n\n一种无监督系统，它尝试将信息源排列映射到输出排列上进行持续的拓扑映射，使得输出通过对信息情况的自关联，获得与贡献源不可区分的拓扑请求结构（Openshaw\
  \ & Wymer 1994）。\n\n神经元通常排列在 2D 矩阵中，SOM 试图发现聚类，使得在晶格空间中彼此靠近的任何两个聚类，其码本向量在信息空间中也是彼此靠近的。\n\
  \n在自关联过程中，将信息向量引入系统，并选择权重向量最近（通常根据欧几里得距离）的单元作为获胜者。下一步是刷新获胜单元及其邻域单元的估计，这将使单元的估计接近于信息向量的估计。这是单元向信息向量的移动，这种进展的程度取决于学习率，学习率在合并的过程中逐渐减小。记得向量量化（VQ）基本上与\
  \ k-means 算法相同，且 VQ 是 SOM 的一个特殊实例（其区域大小为零），可以说 SOM 和 k-means 之间存在邻域连接。Openshaw 和\
  \ Wymer (1994) 进一步指出，基本的 SOM 算法……基本上与 K-means 分类器相同；由于由于邻域准备而存在一些对比，这可以被看作是一种重建的调优类型，它可能提供更好的结果并规避某些局部最优。\n\
  \n机器学习技术也可以被划分为监督学习和无监督学习。\n\n### 监督学习\n\n监督学习是一种算法，其中信息源和输出都是可见的。考虑到这些准备信息，算法需要汇总一个终极目标，使其能够准确地对每一个可能的信息做出反应（Kulesza,\
  \ A., 2012）。该算法用于为训练期间未遇过的信息源创建改进的输出。在监督学习中，必须发现的内容对于每个示例都是确定的。当教练为每个示例提供特征描述时，就会发生监督学习。当操作员被给予每个活动估计的提示输入时，活动的监督学习就会发生（Kulesza,\
  \ A., 2012）。利用监督学习算法解决特定问题必须遵循某些特定步骤：\n\n1. 确定训练示例的类型。\n2. 收集训练集。\n3. 确定包含教育能力描述的信息。\n\
  4. 确定学习能力的结构和相关的学习算法。\n5. 完成计划并在汇总数据集上运行学习算法。\n6. 必须评估已教育能力的准确性，并同样衡量学习能力的执行情况，然后在与准备集不同的集合上再次衡量执行情况。\n\
  \n| 图 3. 监督学习 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch003.f03](img/ch003.f03.png)\
  \ |\n| --- |\n\n### 无监督学习\n\n无监督学习考虑框架如何发现特定信息模式的方法，这种方法反映了整体信息模式集合的可测量结构（Laskov,\
  \ P., & Lippmann, R., 2010）。与“监督学习或强化学习”不同，每个信息之间没有明确的目标输出或相关的自然评估；相反，无监督学习器通过表达来维持关于信息结构哪些部分应该被输出捕获的先验假设（Laskov,\
  \ P., & Lippmann, R., 2010）。\n\n无监督学习是至关重要的，因为它在脑中可能比监督学习常见得多。例如，每个眼睛中都有数百万光光受体，其功能始终随着视觉世界显示变化的迹象，并提供所有可用数据来证明地球上存在哪些斑块、它们是如何呈现的、光照条件如何等。发育和成年灵活性在动物视觉中是基础性的（参见\
  \ VISION AND LEARNING）——已知新皮层中神经递质的辅助和生理属性受到发生的实体神经元运动模式的显著影响。尽管如此，关于场景本质的数据在学习中几乎是不可用的。这使得无监督策略变得基础，并且同样允许它们作为突触调整的计算模型。\n\
  \n无监督学习技术需要处理的主要内容是观测到的输入模式，这些模式通常被认为是来自基础模糊概率表示的自由样本，以及关于什么是重要的早期数据中的某些明确或特定的信息。一个核心思想是信息（例如场景的图像）具有远端自主原因，例如位于特定光照照射的给定区域的物体（Laskov,\
  \ P., & Lippmann, R. (2010）。由于我们通常应该根据这些自由原因采取行动，因此信息的最佳描述是在它们的术语中的。对于无监督学习已经推荐了两类技术。密度估计方法显式地构建事实模型（例如“贝叶斯网络”），说明隐藏原因如何产生信息。特征提取系统尝试从信息源中直接分离可测的规律（或是不一致性）（Laskov,\
  \ P., & Lippmann, R., 2010）。\n\n无监督学习通常有一个悠久且广知的历史。一些早期影响包括“霍拉斯·巴特洛”（see Barlow,\
  \ 1992），他寻找神经编码的方法、“唐纳德·麦凯”（1956），他接受了一种机器人理论方法，以及“大卫·马尔”（1970），他在新皮层模型中对学习目标提出了早期的无监督学习建议。赫布算法（Hebb,\
  \ 1949）将可测量技术与神经生理实验相结合，同样投下了深远的影响。“杰弗里·霍顿”和“特伦斯·塞杰诺斯基”在设计一种名为波尔兹曼机的学习模型（1986）时，从现在主导密度估计技术的观点引入了大量的观点（Grenander,\
  \ 1976-1981）。特征提取策略的研究还没那么广泛。\n\n聚类提供了一个有利的案例。考虑每个信息源是苹果或橙子的不同图像产生的光受体活动的情况。在所有可能的练习中，这些特定的信息源形成两个聚类，其变异程度比黄色度测量要少得多。无监督学习的一个常规任务是发现并描述这些不同的低维聚类。\n\
  \n\n\n\n概率学习的大类包括极大概率（ML）估计方法。这些方法依赖于构建具有参数的（带有参数）概率分布，其中模型（参数）由原始数据强制规定。\n\n无监督学习的较小类旨在通过表征某些特征来发现数据。例如，考虑以下情况：输出是数据投影到权重向量上。根据极大概率假设推断，大多数此类投影将具有高斯特性。因此，在给定数据的情况下，可以发现某些非高斯的（例如多模块的）权重。这种方法被称为统计投影。已经证明可以使用调整的\
  \ Hebb 学习（Cooper, 1992）（Laskov, P., 2010）来实现投影。无监督学习方法应当能够描述数据的不同部分。\n\n投影也可以执行某种类型的聚类。考虑连接簇的超平面。所有样本的分布将是双峰的——即每个类一个模式——并且极是非高斯的。请注意，这种单一投影并很好地描述类的性质或状态。\n\
  \n另一种无监督学习的启发式方法是某些特征具有相似性。例如，考虑给定数据之间的相似性。不同的样本可能共享一些组件，除非它们位于两个数据之间的差异。这是全局的组件。通过在不同数据的基础上增强共享数据，可以发现这种差异。这种方法由\
  \ Becker 和 Hinton (1992) 设计，并称为 IMAX。\n\n## 一些监督学习方法包括：\n\n### 1. 支持向量机\n\n“支持向量机”（`SVM`）是数据挖掘领域最优分类算法之一，但其较长的准备时间限制了应用。`SVM`\
  \ 的目的是找到两类之间具有最大间隔的理想分离超平面，为未来数据提供良好的泛化能力。它们的存储和计算需求随向量数量的增加而迅速增加（AlShaari, M.,\
  \ 2014）。假设数据有两个类别，目标是选择数据点属于哪类。在“支持向量机”中，数据点是 `P` 维向量，我们需要知道是否可以使用 `(P-1)` 维超平面来分离这些数据点（AlShaari,\
  \ M., 2014）。这被称为线性分类器。存在许多可以分类数据的超平面。最优超平面是距离不同数据点间隔最大的直线。因此，我们选择超平面，使其到每侧最近数据点的距离最大。这种超平面被称为最大间隔超平面。\n\
  \n### 2. K 近邻\n\n“K 近邻”（`KNN`）是数据挖掘中是最常用的分类算法之一，它依赖于关系学习，即通过对比给定的测试组与其相似的现有组来进行学习（Dayan,\
  \ P）。当概率密度的可靠参数估计模糊或难以确定时，`K-NN` 分类通过局部决策边界来解决问题。\n\n| 图 4. KNN 分类器 |\n| --- |\n\
  | ![Figure978-1-5225-3643-7.ch003.f04](img/ch003.f04.png) |\n| --- |\n\n现有数据是多维空间中的向量，每个向量都有类别标记。算法的训练阶段仅包括现有数据点的特征向量和标签。\n\
  \n在分类阶段，`k` 是用户根据数据类型确定的常量，通过分配目标数据点最近的 `k` 个样本中最常见的标签对无标签向量进行分类。连续数据的常用指标是“欧几里得距离”。对于离散数据（例如内容分类），可以使用另一种指标，例如重叠指标（或“汉明距离”）（Dubey,\
  \ V., 2016）。对于基因表达微阵数据等，`k-NN` 也被用于相关系数，例如 Pearson 和 Spearman。通常，如果通过算法确定距离度量，`k-NN`\
  \ 的分类准确率可以得到本质性的提升。\n\n# 本章重点\n\n“支持向量机”（`SVM`）是数据挖掘领域最优分类算法之一，但其较长的准备时间限制了应用。`SVM`\
  \ 的目的是找到两类之间具有最大间隔的理想分离超平面，为未来数据提供良好的泛化能力。它们的存储和计算需求随向量数量的增加而迅速增加。“K 近邻”（`KNN`）是数据挖掘中是最常用的分类算法之一，它依赖于关系学习，即通过对比给定的测试组与其相似的现有组来进行学习（Dayan,\
  \ P）。当概率密度的可靠参数估计模糊或难以确定时，`K-NN` 分类通过局部决策边界来解决问题。\n\n\n\n\n如图 5 和图 6 所示，有一个被称为 `hyper\
  \ plane`（超平面）的直线，它可以清晰地分隔两个不同的类别。在图 5 中，`hyper plane` 与 `margin`（边界）之间的距离 `z1` 和\
  \ `z2` 应该是相等的。`Hyper plane`可以通过 `kernel function`（核函数）找到。这本质上是寻找向量空间中点绘制点之间的最大距离。正中间的位置就是\
  \ `hyper plane`。靠近 `margin` 和 `hyper plan` 的点很有概率被误分类。在图 5 中，六边形表示的点需要被分类。因此，由于该点靠近\
  \ `hyper plane`，它可能会被误分类。\n\n在改进后的所提算法中，通过结合另一种技术来分类靠近 `margin` 和 `hyperplane` 的点，可以减少误分类。这意味着\
  \ `hyper plane` 并不一定位于正中间。可以通过逻辑找到 `Hyper plane`，即我们需要获取靠近两个 `margins` 的数据点数量比例。根据该比例可以决定\
  \ `hyperplane` 距离两个 `margins` 的距离。就像在 `k-nearest neighbor`（k 最近邻）算法中，我们通过比较新数据点与其他\
  \ `k` 个数据点的距离来找到新数据点的类别，并根据这 `k` 个点中哪个类别的点更多来确定新数据点属于该类。因此，`k-NN` 的主要缺点我们需要找到其他点相对于新数据点的距离。但在所提方法中，我们只需要找到一次比例，然后确定\
  \ `hyper plane`。\n\n| 图 5. 支持向量机 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch003.f05](img/ch003.f05.png)\
  \ |\n| --- |\n| 图 6. 所提的支持向量机 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch003.f06](img/ch003.f06.png)\
  \ |\n| --- |\n\n新的所提方法在不增加实际执行时间的情况下减少了误分类。算法的独立模块可以并行执行，从而大幅缩短执行时间。这种新的所提方法将分析靠近该类别数据点边界的现有数据点。根据分析结果考虑比例。如果某一类的数据点更靠近边界区域，则\
  \ `hyper line` 将向相反方向移动，以减少误分类。按照现有的 `Support Vector Machine`（如图 5 所示），由红色六边形表示的新数据点属于不同的矩形类别。但使用\
  \ `K-Nearest Neighbor` 时，相同的数据点属于圆形类别。但通过新方法，这种误分类可以减少，因为靠近边界区域的数据点是间接使用两种最流行的分类算法进行分类的，且不会增加实际执行时间。\n\
  \n## 解决方案与建议\n\n改进的 `support vector machine` 在不增加实际执行时间的情况下减少了误分类。参考下文提到的图 7 和图\
  \ 8，分隔不同颜色数据类别的 `hyper plane` 的位置存在差异。由于存在两种颜色的数据对象（即红色和蓝色），它们被 `hyper plane` 分隔。在图\
  \ 7 这一现有的 `SVM` 分类算法散点图中，`margins` 距离 `margin` 等距离。但与现有的分类算法相反，如图 8 所示，`margins`\
  \ 距离 `margin` 的距离并不完全相同。\n\n在图 7 这一现有的 `SVM` 分类算法散点图中，`margins` 距离 `margin` 等距离。但与现有的分类算法相反，如图\
  \ 8 所示，`margins` 距离 `margin` 的距离并不完全相同。\n\n| 图 7. SVM 分类 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch003.f07](img/ch003.f07.png)\
  \ |\n| --- |\n| 图 8. 后的 SVM |\n| --- |\n| ![Figure978-1-5225-3643-7.ch003.f08](img/ch003.f08.png)\
  \ |\n\n### 未来方向\n\n`support vector machine` 在不增加实际执行时间的情况下减少了误分类。\n\n## 结论\n\n新的所提方法在不增加实际执行时间的情况下减少了误分类。算法的独立模块可以并行执行，从而大幅缩短执行时间。\n\
