  \ 4. | 纸币的特征提取 | |\n\n## 步骤\n\n现在让我们来看看其中涉及的各个步骤：\n\n*   步骤 1：读取图像。\n\n在这一步中，我们将从给定位置读取特定图像，如果图像不符合所需尺寸，我们对其进行缩放。在这里，我们将使用命令\
  \ `imread` 直接从桌面读取我们的图像。\n\n代码如下：\n\n```\nclear all; close all;\nIreal = imread('C:\\\
  Users\\Bunny\\Desktop\\SqbnIm.jpg');\n% Real\nIfake = imread('C:\\Users\\Bunny\\\
  Desktop\\2U3DEm.jpg');\n% Fake\nIfake2 = imread('C:\\Users\\Bunny\\Desktop\\SVJrwaV.jpg');\n\
  % Fake #2\n% 缩放尺寸，使其与其他图像具有相同的维度\nIfake2 = imresize (Ifake2, [160 320], 'bilinear');\n\
  ```\n\n这一步的输出是：\n\n这里第一张是真图像，另外两个是伪图像（图 2）。\n\n\n\n\n\n| 图 2. |\n| --- |\n| ![Figure978-1-5225-3643-7.ch010.f02](img/ch010.f02.png)\
  \ |\n| --- |\n\n###  2 ：提取黑色条带\n\n在这一步中，正如我们最初讨论的，我们的项目将根据黑色条带的数量原理工作。如果黑色条带的数量为\
  \ 1，则它是原始图像；如果不等于 1，则它是伪造图像。\n\n对应的代码如下：\n\n```matlab\nBlackStripReal = Ireal (:195:215,:);\
  \  \nblackStripFake = Ifake(:195:215,:);  \nblackStripFake2 = Ifake2(:,195:215,:);\
  \  \nFigure (1);  \nsubplot(1,3,1);  \nimshow(blackStripReal);  \ntitle('Real');\
  \  \nsubplot (1,3,2);  \nimshow(blackStripFake);  \ntitle('Fake');  \nsubplot (1,3,3);\
  \  \nimshow(blackStripFake2);  \ntitle('Fake #2');\n```\n\n在这段代码中，我们使用命令 `black\
  \ strip` 来检测图像中的黑色条带。通过观察所有注释，黑色条带的值分布在第 195 列到第 215 列之间。这是假设每张图像有 320 列。这里的 `subplot`\
  \ 表示 `1*3` 矩阵网格，以及特定的轴（可以是 1、2、3， 分别代表原始、伪造、伪造 2）。\n\n这一步的输出是：（图 3）。\n\n| 图 3. |\n\
  | --- |\n| ![Figure978-1-5225-3643-7.ch010.f03](img/ch010.f03.png) |\n| --- |\n\n\
  ### 第 3 步：将 RGB 图像转换为灰度图并进行阈值化\n\n在这一步中，我们将使用命令 `rgb2gray` 将 RGB 图像转换为灰度图像。同样，`subplot`\
  \ 的含义与上述讨论相同。在图像转换为灰度图像后，我们执行阈值处理。这是通过首先使用命令 `im2bw` 将图像转换为二值化，并使用阈值 30 完成的。我们启发式地使用\
  \ 30，是因为这主要是黑色条带所包含的强度。\n\n这一步的代码为：\n\n```matlab\nBlackStripReal = rgb2gray(blackStripReal);\
  \  \nblackStripFake = rgb2gray(blackStripFake);  \nblackStripFake2 = rgb2gray(blackStripFake2);\
  \  \nFigure (2);  \nsubplot (1,3,1);  \nimshow (blackStripReal);  \ntitle('Real');\
  \  \nsubplot (1,3,2);  \nimshow (blackStripFake);  \ntitle('Fake');  \nsubplot (1,3,3);\
  \  \nimshow (blackStripFake2);  \ntitle ('Fake #2');\n```\n\n这一步的输出是：（图 4）。\n\n\
  | 图 4. |\n| --- |\n| ![Figure978-1-5225-3643-7.ch010.f04](img/ch010.f04.png) |\n\
  | --- |\n\n对于阈值化：-\n\n```matlab\nblackStripRealBW = ~im2bw (blackStripReal, 30/255);\
  \ \nblackStripFakeBW = ~im2bw (blackStripFake, 30/255); \nblackStripFake2BW = ~im2bw\
  \ (blackStripFake2, 30/255);  \nfigure (3);  \nsubplot (1,3,1);  \nimshow(blackStripRealBW);\
  \  \ntitle('Real');  \nsubplot (1,3,2);  \nimshow(blackStripFakeBW);  \ntitle('Fake');\
  \  \nsubplot (1,3,3);  \nimshow (blackStripFake2BW);  \ntitle ('Fake #2');\n```\n\
  \n在这里我们再次由于上述相同原因使用了 `subplot`：这一步的输出是：（图 5）。\n\n| 图 5. |\n| --- |\n| ![Figure978-1-5225-3643-7.ch010.f05](img/ch010.f05.png)\
  \ |\n| --- |\n\n### 第 4 步：开运算（Opening）\n\n在这一步中，我们对图像进行区域开运算，通过指定一个约 100 的较大区域，确保图像消除任何杂散噪声和孤立像素。你会注意到对于每张图像，边缘都有噪声像素。我们使用命令\
  \ `bwareaopen` 执行此开运算。该函数会移除黑白图像中面积小于特定值的像素区域。\n\n对应的代码为：\n\n```matlab\nareaopenReal\
  \ = bwareaopen (blackStripRealBW, 100);  \nsubplot(1,3,1);  \nimshow(areaopenReal);\
  \  \ntitle('Real');  \nsubplot(1,3,2);  \nareaopenFake = bwareaopen (blackStripFakeBW,\
  \ 100);  \nimshow(areaopenFake);  \ntitle('Fake');  \nsubplot(1,3,3);  \nareaopenFake2\
  \ = bwareaopen (blackStripFake2BW, 100); \nimshow(areaopenFake2);\ntitle ('Fake\
  \ #2');\n```\n\n在这里我们由于上述原因再次使用 `subplot`。这一步的输出是：（图 6）。\n\n| 图 6. |\n| --- |\n\
  | ![Figure978-1-5225-3643-7.ch010.f06](img/ch010.f06.png) |\n| --- |\n\n### 第 5\
  \ 步：后处理（Post Process）\n\n这本质上就是闭运算（closing）。在此过程中，我们使用 `5 x 5` 的方形结构元素，以确保任何不连通的区域相互连接。对于这一过程，我们使用命令\
  \ `imclose`。\n\n该过程的代码为：\n\n```matlab\nse = strel ('square', 5);  \nBWImageCloseReal\
  \ = imclose (areaopenReal, se);  \nBWImageCloseFake = imclose (areaopenFake, se);\
  \  \nBWImageClose2 = imclose (areaopenFake2, se);  \nFigure(5);  \nsubplot(1,3,1);\
  \  \nimshow(BWImageCloseReal);  \ntitle('Real');  \nsubplot (1,3,2);  \nimshow(BWImageCloseFake);\
  \  \ntitle('Fake');  \nsubplot (1,3,3);  \nimshow(BWImageClose2);  \ntitle ('Fake\
  \ #2');\n```\n\n在这里我们由于上述原因再次使用 `subplot`。这一步的输出是：（图 7）。\n\n| 图 7. |\n| --- |\n\
  | ![Figure978-1-5225-3643-7.ch010.f07](img/ch010.f07.png) |\n| --- |\n\n\n\n\n\n\
  ```matlab\nBWImageCloseFake = imclose (areaopenFake, se);\n\nBWImageCloseFake2 =\
  \ imclose (areaopenFake2, se);\n\nFigure (5);\n\nSubplot (1,3,1);\n\nImshow (BWImageCloseReal);\n\
  \nTitle ('Real');\n\nSubplot (1,3,2);\n\nImshow (BWImageCloseFake);\n\nTitle ('Fake');\n\
  \nSubplot (1,3,3);\n\nImshow (BWImageCloseFake2);\n\nTitle ('Fake #2');\n\n%% //计算此条带中的物体总数\
  \ \n\n[~, countReal] = bwlabel (BWImageCloseReal);\n\n[~, countFake] = bwlabel (BWImageCloseFake);\n\
  \n[~, countFake2] = bwlabel (BWImageCloseFake2);\n\nDisp(['The total number of black\
  \ lines for the real note is: ' num2str(countReal)]);\n\nDisp(['The total number\
  \ of black lines for the fake note is: 'num2str(countFake)]);\n\ndisp(['The total\
  \ number of black lines for the second fake note is: ' \nnum2str(countFake2)]);\n\
  ```\n\n## 结果\n\n| 图 8. |\n| --- |\n| ![Figure978-1-5225-3643-7.ch010.f08](img/ch010.f08.png)\
  \ |\n| --- |\n\n如上所示，这些我们在运行此过程时获得的结果。\n\n## 结论\n\n结论是，正在使用各种图像处理技术来判断纸币的真伪。我们根据图像上出现的黑色条纹数量来得出结论。我们使用了阈值化、开运算、闭运算等过程。在这里，我想得出结论，大数据帮助我们即时且高效地解决了存储大量数据的问题。\n\
  \n大数据依赖于以下 3V：\n\n-   **量（Volume）**：大数据不进行采样；它只是观察并跟踪发生的情况。\n-   **速度（Velocity）**：大数据通常是实时的。\n\
  -   **多样性（Variety）**：数据源自文本、图像、音频、视频；此外它通过融合完善缺失的部分。\n\n## 未来前景\n\n该项目有良好的前景。现在，大多数人都在打印这些违法的假钞。因此，银行人员可以使用此过程来检测哪些是真币、哪些是假币，这非常有帮助。\n\
  \n未来大数据将在存储大量数据方面发挥重要作用，用于存储检测到的多少张假钞和多少张真币的信息。\n\n| 图 9. |\n| --- |\n| ![Figure978-1-5225-3643-7.ch010.f09](img/ch010.f09.png)\
