  \n## 关键术语与定义\n\n- **大数据 (Big Data)**：指海量数据，或通常通过简单的计算模型和技术难以处理的复杂数据。\n- **计算模型 (Computational\
  \ Model)**：系统的抽象表示，基于开发人员或科学家开发的方案对系统进行计算，以解决计算问题。\n- **数据挖掘 (Data Mining)**：从从数据源产生的数据集中提取有意义信息的过程。\n\
  - **图像分类 (Image Classification)**：根据现有的、预分类的向量对未知数据、新模式或新图像进行分类的过程。\n- **机器学习 (Machine\
  \ Learning)**：利用现有知识并在系统改变状态时考虑反馈，以发现所需信息并产生良好结果的过程。\n- **并行处理 (Parallel Processing)**：同时执行多个任务的过程，以缩短处理的等待时间。\n\
  - **遥感 (Remote Sensing)**：识别图像和结构性特征的任务。\n- **卫星成像 (Satellite Imaging)**：利用环境图像将图像转换为依赖于系统的格式的图像的过程。\n\
  \n## 第 2 章\n\n- Venkatesan M.\n  印度卡拉纳塔克国立技术学院\n- Prabhavathy P.\n  印度 VIT 大学\n\n\
  ## 摘要\n\n有效且高效的数据获取、管理和分析数据策略可以带来更好的决策和竞争优势。云计算的发展和大数据时代的到来给传统数据挖掘算法带来了挑战。传统数据库系统的处理能力、架构和算法无法应对大数据分析。大数据现在在所有科学和工程领域（包括生物学、生物医学科学和灾害管理）都在迅速增长。复杂性特征为从大数据中发现有用知识构成了极端挑战。空间数据是复杂的大数据。本章的目的是提出一种多级决策树大数据方法，用于处理复杂的空间滑坡数据。所提分类器的性能已通过海量实时数据集进行了验证。结果表明，该分类器既具有时间效率，又具有可扩展性。\n\
  \n## 引言\n\n海量的地理空间数据导致了复杂关系的定义，这为当今的数据挖掘研究带来了挑战。目前的科学进步导致了来自不同领域（如医疗保健和科学传感器、用户生成数据、互联网和灾害管理）的数据如如而至。大数据是指超过了传统数据库系统处理能力的数据。这些数据过大、移动过快，或者不符合您的数据库架构的限制。例如，大数据通常是非结构化的，并且需要更多的实时分析。这种发展需要用于数据获取、传输、存储和大规模数据处理的架构。Hadoop\
  \ 是一个将计算问题分发到许多服务器的平台。它最初由 Yahoo 作为开源开发并发布，实现了由 Google 在编译其搜索索引时开创的 `MapReduce`\
  \ 方法。Hadoop 的 `MapReduce` 涉及将数据集分发到多个服务器上并对数据进行操作：`map` 阶段。然后对部分结果重新组合：`reduce`\
  \ 阶段。为了存储数据，Hadoop 使用了自己的分布式文件系统 `HDFS`，这使得数据对多个计算节点可用。\n\n自然灾害如飓风、地震、侵侵、海啸和滑坡造成了无数死亡，并对基础设施和环境造成了可怕的破坏。滑坡是丘陵地区的主要问题之一。可以根据\
  \ GIS 技术利用不同方法识别滑坡风险。在尼尔吉里地区的乌提湖（Ooty），由于强降雨和土地利用特征的频繁改变，发生了滑坡。如果能对预报和缓解措施有更多了解，滑坡灾害是可以被减少的。到为止，人们仅尝试过预测这些滑坡或防止它们造成的损害。在之前的研究中，各种方法被应用于此类问题，这表明很难理解且准确预测起来非常棘手。为了分析这些滑坡，考虑了降雨、地质、坡度、土地利用、土壤和地貌等各种因素，并在\
  \ GIS 中准备了相关的图层用于滑坡易发性制。从与滑坡相关的研究所收集的数据有助于预测和分析滑坡易发性。空间滑坡数据是复杂大数据之一。为了处理大量的滑坡数据，改进了之前的研究加权决策树方法，并使用\
  \ map reduce 编程模型提出了多级决策树分类器。\n\n## 相关工作\n\n\n\n\n\n决策树是多种数据挖掘应用中最受接受的分类方法之一（H.\
  \ I. Witten & E. Frank, 2005; M. J. Berry & G. S. Linoff, 1997），有助于决策的制定（J. R. Quinlan,\
  \ 1990）。著名的决策树算法之一是 `C4.5`（J. R. Quinlan, 1993; J. R. Quinlan, 1996），它是基础 `ID3`\
  \ 算法的扩展（J. R. Quinlan, 1986）。然而，随着云计算的不断进步（M. Armbrust, A. Fox, R. Griffith, A.\
  \ D. Joseph, R. Katz, A. Konwinski, G. Lee, D. Patterson, A. Rabkin, I.Stoica and\
  \ M. Zaharia, 2010）以及大数据挑战（D. Howe, M. Costanzo, P. Fey, T. Gojobori, L. Hannick,\
  \ W. Hide, D.P. Hill, R. Kania, M. Schaeffer, S.S., 2008）的出现，传统的决策树算法显示出了许多限制。首先，当数据集规模极其巨大时，构建决策树可能非常耗时，应该为集群应用新的计算范式。其次，虽然集群中的并行计算（V.\
  \ Kumar, A. Grama, A. Gupta & G. Karypis, 1994）可以用于基于决策树的分类算法（K. W. Bowyer, L. O.\
  \ Hall, T. Moore, N. Chawla & W. P. Kegelmeyer, 2000; J. Shafer, R. Agrawal & M.\
  \ Mehta, 1996），但应该优化数据分布策略，以确保构建一个节点所需的数据是本地化的，同时最小化通信开销。加权分类适用于许多现实世界的二分类问题。加权分类（J.L.Polo,\
  \ F.Berzal, & J.C.Cubero, 2007）为不同的属性分配不同的重要性。文献中提出了许多不同的属性选择划分准则，它们都倾向于提供相似的结果（F.Berzal,\
  \ J.C.Cubero, F.Cuenca, & M.J.Martín-Bautista, 2003）。\n\nHACE 定理（Xindong Wu,Xingquan\
  \ Zhu,Gong-Qing Wu, & WeiDing.S, 2014）被提出，刻画了大数据革命的特征，并从数据挖掘的角度提出了大数据处理模型。这种数据驱动模型涉及信息源的需求驱动聚合、挖掘与分析、用户兴趣建模以及安全和隐私考量。我们分析了数据驱动模型以及大数据革命中的挑战性问题。\n\
  \n遥感、地理信息系统（GIS）和数据挖掘技术的集成已用于预测滑坡风险。概率和统计方法被用于估计滑坡易发性区域。滑坡易发性图减少了滑坡危害，并用于土地覆盖规划。频率比模型优于逻辑回归模型。模糊隶属函数和因子分析被用于通过各种因素评估滑坡敏感性。收集并处理空间数据，使用\
  \ GIS 和图像处理技术创建空间数据库。识别并处理滑坡发生因素。确定每个因子的权重并使用反传播算法进行训练。改进的贝叶斯分类方法（Venkatesan M\\\
  *, Rajawat A S, Arunkumar T, Anbarasi M, & Malarvizhi K, 2014）和决策树方法（Venkatesan.M,\
  \ Arunkumar .Thangavelu, & Prabhavathy.P, 2013）已用于预测尼尔吉里里地区的滑坡敏感性。\n\n# 多级排序决策树分类器\n\
  \n分类是使用训练数据集预测未知类别标签的过程。分类方法可分为决策树、反传播神经网络、支持向量机（SVM）、基于规则的分类和贝叶斯分类。在当前场景下，滑坡分析研究使用了神经网络和贝叶斯方法，但这些方法难以理解且预测困难。在本章中，提出了一种多级排序决策树分类器用于滑坡风险分析。所提方法的性能通过多种参数进行衡量。\n\
  \n决策树（DT）方法用于以树的形式分析数据。树使用自顶向下的递归划分技术构建。树形结构由根节点、内部节点和叶子节点组成。排序分类技术为重要类别提供了更简单的模型。排序分类为不同的滑坡因素分配不同的重要性。在本章中，对不同的滑坡因素分配排名，以表示每个滑坡因素的相对重要性。在分布式计算环境中，大型数据集由一个名为\
  \ Hadoop 的开源框架处理。它包含 MapReduce、Hadoop 文件分布系统（HDFS）以及许多相关项目 Apache Hive、HBase 和 Zookeeper。\n\
  \n## Hadoop 架构与组件\n\nHadoop 分布式文件系统（HDFS）架构如图 1 所示。`NameNode` 是处理元数据的 `HDFS` 主节点，`DataNode`\
  \ 是按块存储数据的从节点。同样，Hadoop MapReduce 的主节点被称为 `JobTracker`，负责管理和调度多个任务，从节点被称为 `TaskTracker`，`Map`\
  \ 和 `Reduce` 过程在此处执行。\n\n| 图 1. HDFS 架构 |\n| --- |\n| ![Figure978-1-5225-3643-7.ch002.f01](img/ch002.f01)\
