  \n\n\nManoj Sharma（印度 BVC）\n\n\n\nNeil G. Shaw（美国德克萨斯大学阿林顿分）\n\n\n\n\n\n当我受邀为《卫星图像处理与遥感大数据分析》一书撰写序言时，我很高兴注意到大数据在卫星图像处理中多样化的工具、挑战和方法。这本书是一部由\
  \ 10 章组成的重要合集，涵盖了图像处理、卫星图像处理、大数据和云处理，以及这些技术在近几十年中新兴的应用。这本书为回顾卫星图像处理的各个领域提供了一个很好的平台，并满足了该领域初学者以及资深研究人员和从业者的需求。书中记录了卫星图像处理和大数据的巨大增长，例如专注于各种应用的`大数据`、`卫星图像处理`、`遥感`、`计算方法`、`3D\
  \ 资产开发与产品开发`、`滑坡易发性`、`层次聚类`、`改进支持向量机`、`大数据服务`以及`基于云的工作流调度`技术。\n\n据我所知，这是该领域的首次尝试，涵盖了`大数据`、`卫星图像处理`和`云计算`及其应用的关键课题。这本书是该领域极具价值、话题性且及时的知识源，可以很好地作为本科、研究生课程以及学者的几门课程的主要教科书。它也是对上述特定领域的新挑战、理论和实践感兴趣的科学家、专业人士和学术者的关键参考文献。\n\
  \n我非常赞赏编辑和作者的成就，并告知读者，他们正在面对的是组织决策计算智能发展的一项重大成果。我熟悉你们在相关研究领域`大数据服务`、`大数据行业标准`、`大数据项目部署经验`方面的研究兴趣和专业知识。用于图像遥感和`大数据`的`新型计算模型`将成为是该出版物的绝佳补充。这本书是该领域走向成熟的重要一步，并将从许多重要方面向学术、研究和科学界提出挑战。\n\
  \n*   Gopinath Ganapathy\n    印度，巴拉塔希达桑大学\n*   V. Susheela Devi\n    印度，班加罗尔科学学院\n\
  *   Ravee Sundararajan\n    英国，伦敦南岸大学 (LSBU)\n\n随着我们进入高分辨率地球观测时代，`遥感`数据正经历着爆炸式增长。数据的激增也导致了遥感数据复杂性的增加，例如数据的多样性和更高维度的特征。本书旨在讨论和解决在处理应用于各种领域的大数据和遥感数据时面临的困难和挑战。编辑们收到了关于利用大数据进行卫星图像处理及相关主题的不同方面的章节。此外，书中还探讨了此类方法论对实施这些先进技术的应用的影响。\n\
  \n这部全面且及时的出版物旨在成为一份重要的参考源。它帮助致力于卫星图像处理的研究人员利用遥感图像处理领域中关于大数据技术的现有文献，同时为这一动态领域提供了进一步的研究机会。希望这本书能为开发者和经理提供必要的资源技术，以便他们在开发高效解决方案时采用并实施这些技术、平台和方法。\n\
  \n## 主题书籍的必要性\n\n`大数据`是一个不断演变的术语，描述任何海量的结构化、半结构化和非结构化数据，这些数据具有挖掘有意义信息的潜力。由于科学可视化的缺口，图像处理和识别的范围已经扩大。因此，新的成像技术不断涌现，研究这种演进过程对于优化利用从各种形式遥感中接收的数据至关重要。\n\
  \n《卫星图像处理与遥感大数据分析》是一部关键的学术资源，探讨了在图像处理及相关领域实施大数据的挑战和困难。该书涵盖了分布式计算、并行处理和空间数据等广泛主题，面向寻求在卫星图像处理中使用大数据分析当前研究的科学家、专业人士、研究人员和学术者。\n\
  \n## 书的结构\n\n本书由 10 章组成。以下各章节的简要描述：\n\n### 1. 图像遥感与大数据的新型计算模型\n本章侧重于开发用于大数据遥感应用的新型模型。此外，本章介绍了遥感系统开发的流程概述。文中介绍了各种问题和挑战，以讨论与无线传感器网络中处理图像大数据相关的各种问题。此外，文中还介绍了应对这些挑战的可能解决方案和未来建议，并包含了对趋势的讨论和结论。\n\
  \n### 2. 基于遥感数据的滑坡风险分析大数据计算模型\n如今，必须通过有效高效的策略来获取、管理和分析数据，以获得更好的决策和竞争优势。云计算和大数据时代的到来给传统的数据挖掘算法带来了挑战。空间数据是复杂的字节。为了处理复杂的空间滑坡数据，本章提出了一种基于`多排序决策树`大数据的方法。通过海量实时数据集验证了`分类器`的性能。结果表明，我们的分类器兼具时间效率和可扩展性。\n\
  \n### 3. 改进的支持向量机算法以减少误分类并优化时间复杂度\n本章处理分类算法计算时间消耗的优化。所有这些结果导致了误分类的减少并加快了数据点类别的计算。这是由于每种算法根据数据类型存在某些缺陷导致的。为了减少误分类，引入了一种新的`支持向量机`方法，即不再让超平面精确位于超平面的中间位置，而是根据超平面附近可用类别数据点的数量进行调整。因此，本章展示了一些多核架构，这些架构被用于同时计算多个依赖的模块。\n\
  \n\n\n\n\n本章探讨了“使用产生的大数据分析”。如何有效地存储、监控并从管理产生的海量信息中提取价值，已成为一个关键的研究课题。随着信息量的不可避免的巨大增长，迫切需要一种能够监控和分析各种类型管理产生的大型数据的通用框架。本章旨在解决这一问题，并对管理产生的大数据以及`大数据即服务`（Big\
  \ Data-as-a-Service） 进行了综述，涵盖`大数据基础设施即服务`、`大数据平台即服务`以及`大数据分析软件即服务`，向客户提供常规大数据相关服务（例如：获取产生的大数据和数据分析结果），以提高效率并降低成本。\n\
  \n\n通过层次聚类进行云端搜索：本章提出了一种改进的搜索加密（SE）方案以应对竞争挑战。在开发过程中，典型的层次聚类技术旨在引入额外的搜索语义，其辅助特性是使该方案能够处理海量数据等大规模环境下的随机密文搜索需求。本研究关注于分包加密信息的云数据获取，在不损失理念的前提下，通过传输属性密钥到下一级信息，利用多级置信隐私保护方案改进了安全性和隐私。\n\
  \n\n本章的目标是 3D 资产开发、产品开发流程以及使用增强现实和虚拟现实技术创建真实世界的解决方案。方法涉及创建模拟软件解决方案，用于协助企业进行培训活动，利用增强现实（`AR`）和虚拟现实（`VR`）培训工具来降低成本。本章将\
  \ `AR` 和 `VR` 技术应用于训练目的，观察到成本降低了 60%。`AR` 和 `VR` 技术的应用有助于利用手机、高性能计算机、头戴式显示（`HMDs`）等技术通过模拟环境提供解决方案。因此，本章证明了在培训中实施良好的用户体验（UX）可以减少现场培训风险并降低成本。\n\
  \n\n本章的目标是分析并提取分布式环境中数据分析的增强性能。迭代 MapReduce（`i-MapReduce`）通过通过减少 mapper 扫描来发现有用的数据模式，在优化分析性能方面发挥着重要作用。“大数据”一词指的是海量的结构化和非结构化信息，这些信息无法直接使用传统的数据库管理框架。随着印度城市化的快速发展及其多种决定因素的影响，信息将变得巨大，并成为传统\
  \ `DBMS` 无法处理的大数据。在本章中，研究了 `Hadoop`（一种允许在计算机组对大型数据集进行分布式处理的开源框架），并通过部署迭代 MapReduce\
  \ 产生了更好的结果。\n\n\n本章介绍了大数据的基础知识，包括架构、建模和所使用的工具。`大数据` 是用于处理海量数据的术语，可以作为 `RDBMS` 以及其他分析技术（如\
  \ `OLAP`）的替代方案。为了使其有用，本章探讨了基本架构、工具、建模和挑战，以利用大数据提供高效的解决方案。\n\n\n本章描述了 `MapReduce`，它作为分布式计算的编程算法，从而减少服务器维护成本并消除了对专用服务器的需求。这还有效地讨论了\
  \ `map reduce` 在这些领域中的各种方法，并将 `map reduce` 编程模型适配到机器学习、数据分析和数据科学等各个领域。\n\n\n在章中，作者试图区分伪钞和真钞，并希望将其提升到可以到处使用的水平。检测出伪钞和真钞后的数据可以存储在数据库中。由于需要存储的数据量巨大，为了解决这个问题，本章涉及了\
  \ `大数据`。它将帮助我们迅速存储大量数据。真钞与伪钞的区别在于，真钞的光变线更细且更连续，而伪钞的条纹内有碎片化的线条。可以说，伪钞的条纹上有多条线，而真钞只有一条。因此，本章处理的是：只有一条线就是真的，但如果用户看到多条线就是伪造的。在这里，实验结果使用的数据集是外币。\n\
  \n\n\n\n\n开发新的计算模型的目标是实现创建新的基于大数据的遥感基础设施，用于分析和挖掘图像数据。该系统必须包含一个数据收集组件，用于聚合、集成数据并对图像数据进行验证。然后，系统的核心组件将执行过滤、分析以及从图像数据中提取相关模式等任务。提取和预测的结果可以用于农业监测、作物监测，或天气和市场价值的预测。\n\
  \n大多数使用图像遥感的大数据框架都涉及以下步骤：\n\n1. 整理并整合来自基于场景的模型、卫星图像和其他遥感工作站的数据。\n2. 开发数据挖掘和相关性分析技术，以执行时间序列数据挖掘、空间数据分析或时空分析。\n\
  3. 开发分类方法以执行图像数据分类。\n4. 通过将数据与标准值或索引进行比较，来评估数据模型的拟合度。\n5. 开发利用低分辨率或高分辨率图像进行活动监测的方法。\n\
