  ```\nProcedure Map_Update_Count((A[best],(row_id,C)))\n    Emit(A[best,] (C,Cnt'))\n\
  End Procedure\n\nProcedure Map_Hash((A[best,] row_id))\n    Compute node_id= hash(A[best]\
  \ )\n    emit(row_id, node_id)\nEnd Procedure\n```\n\n算法 –`IV` 展示了通过在节点之间建立连接来生长决策树的过程。\n\
  \n```\nProcedure Map((A[best],row_id))\n    Compute node_id=hash(A[best])\n    If\
  \ node_id is same with the old value then\n        emit(row-id,node_id)\n    end\
  \ if\n    add a new subnode\n    emit(row_id,node_id,subnode_id)\nEnd Procedure\n\
  ```\n\n排序分类技术为重要类别提供了更简单的模型。排序分类为不同的不同的滑坡因素分配了不同的重要程度。在本章中，对不同的滑坡因素分配了排序，以表示每个滑坡因素的相对重要性。如上述算法所示，利用\
  \ MapReduce 编程模型将加权决策树分类算法改进为多排序决策树分类器。开发的分类器用于分析尼尔吉吉里县（Niligiris district）乌提（Ooty）地区的滑坡风险。所提分类器的可扩展性得到了提高，并与现有分类方法进行了比较。\n\
  \n### 实验与结果分析\n\n所提出的多排序决策树分类器在 Hdoop 集群上实现。我们拥有拥有 6 个节点的 HPC 集群。我们让其中一个作为 HDFS\
  \ NameNode 和 MapReduce JobTracker（即主节点），其余节点作为 HDFS DataNode 和 MapReduce TaskTracker（即从节点）。在我们先前的研究中，加权决策树分类算法的效率在理论和实验上都得到了证明。在本文中，我们关注的是大数据环境下加权决策树分类算法并行版本的时间效率。本章侧重于使用大数据计算技术进行滑坡风险分析。所需的地形图和地图是从印度地质调查局收集的。许多因素导致山区发生滑坡，但有四个因素对滑坡研究非常重要，例如降雨、坡度、地质和土地利用/植被。上述因素的主题层使用\
  \ ArcGIS 工具从 LISS III+ 图像制备。乌提（尼尔吉里县）被视为研究区域。我们将所提出的多排序决策树分类器应用于乌提的滑坡数据，如表 1 所示。\n\
