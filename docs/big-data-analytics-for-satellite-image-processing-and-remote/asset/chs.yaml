  \n### 2.1.2 速度\n\n数据来自多个源，这些源需要并行运行。因此，下一个重要问题是如何以极高的速度并行运行这些源进行数据生成和传输。例如，考虑天气传感器，它每小时从多个源收集天气数据。这些数据需要移动到特定的存储器，且数据日志非常高。传统系统无法完成这种存储和频繁的移动。\n\
