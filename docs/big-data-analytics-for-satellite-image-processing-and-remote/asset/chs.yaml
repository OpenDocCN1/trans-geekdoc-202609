  \n\n\n随着印度糖尿病患者数量的快速增加以及糖尿病因素的众多，信息量变得极其庞大，并变成了传统数据库管理系统（DBMS）无法处理的大数据。在这里我们讨论了\
  \ Hadoop，这是一种开源结构，允许在计算机组上对海量数据集进行分布式处理，从而通过部署迭代 MapReduce（Iterative MapReduce）最终产生更好的结果。其主要目标是分析并提取分布式环境中数据分析性能的提升点。迭代\
  \ MapReduce（i-MapReduce）在优化分析性能方面起着重要作用。该实现是基于在 Hortonworks Data Platform (HDP)\
  \ 沙箱之上引入的 Cloudera Hadoop。Hortonworks Hadoop 用于根据从 IBM quest 获取的糖尿病数据集不同因素的查询结果，提取有用的数据模式。用于序列模式挖掘的迭代\
  \ MapReduce 算法利用分布式计算环境。它由两个过程组成：映射过程和还原过程，这两个过程进一步用于两个独立的阶段，即扫描阶段（Scanning phase）和挖掘阶段（Mining\
  \ phase）。在扫描阶段，通过将查找元素的任务分配到不同的 mapper 任务上，获得了高性能，这些任务可以在带有分布式数据库或文件系统的多台机器上并行运行。在挖掘阶段，mapper\
  \ 任务创建一个词序列树以寻找模式，并提高在树上运行的有限深度深度优先搜索（dfs）的效率，而 reducer 任务寻找模式的支持值（support value），从而找到有用的模式。因此，为了避免序列化处理的问题，我们在大数据环境中选择了并行处理。这种并行处理不仅缩短了计算时间，还优化了资源利用。\n\
  \n这是本章的简要介绍，我们将在后续章节中介绍其实现和影响。\n\n# 背景\n\n大数据也像普通数据，但其规模巨大。这个术语通常用于描述一组规模非常大且随时间推移呈指数级增长的数据。简而言之，这种难以通过传统数据库和其他管理工具处理的大型数据集合被称为“大数据”。大数据的通用特征是：\n\
  \n- 体量（Volume）\n- 速度（Velocity）\n- 变异性（Variability）\n- 真实性（Veracity）\n\n此类分析的主要目标是根据数据集给定属性的条件依赖关系寻找有趣的模式。随着数据生成率的提高，分析数据集中的模式变得非常困难。此外，当数据集中存在序列模式（即依赖顺序很重要）时，情况变得更加关键。这种数据行为在日常活动中非常常见，例如客户购物行为、导致未来疾病的医疗症状、金融股市数据预测等。使用\
  \ Hadoop 进行大数据模式挖掘在数据存储、数据洗牌、数据扫描、数据处理单元等方面面临许多问题。\n\n| 图 1. 大数据的影响 |\n| --- |\n\
  | ![Figure978-1-5225-3643-7.ch007.f01](img/ch007.f01.png) |\n\n序列模式挖掘是现代世界各种应用技术领域的最重要的数据挖掘技术之一。示例包括基因分析、系统攻击的入侵检测和客户行为预测。序列模式挖掘背后的中心逻辑是在事务或操作数据库中寻找频繁序列。正式定义详细如下。\n\
  \n定义 1：设 `D` 为一个序列数据库，`I = {y1, · · ·, ym}` 是 `m` 个不同项目的集合。`S = {d1, · · ·, di}`\
  \ 是一个由有序项集列表组成的序列。项集 `di` 是项目 `⊆ I` 的子集。序列 `Dr = {r1, · · ·, rn}` 是序列 `Dt = {t1,\
  \ · · ·, tm}` 的子序列，其中 `1 ≤ i1 < · · · < in ≤ m` 使得 `r1 ⊆ ti1, r2 ⊆ ti2, · · ·, rn\
  \ ⊆ tin`。序列模式挖掘通常用于寻找所有出现频率 ≥ 最小支持度 `*D|` 的序列模式集。在此方面，非常有帮助的模式算法包括基于支持的、基于增长的基于投影的算法。\n\
  \n模式挖掘算法主要分为两类：\n\n- 基于连接的算法（Join based algorithm）\n- 基于树的算法（Tree based algorithm）\n\
  \n### 基于连接的算法\n基于连接的算法包括以递归方式执行的基本 Apriori 算法。它包含三个主要步骤，针对不同的 `k` 值重复执行。第一步涉及生成候选模式，然后进行模式剪枝，最后对数据集进行验证。Apriori\
  \ 算法利用广度优先搜索（bfs）寻找枚举树。它通过连接方法生成候选键。观察 Apriori 的执行过程可以发现虽然没有显式使用枚举树，但在扫描阶段之后构建了树结构。该领域的其他主要算法包括树投影（TreeProjection）和频率增长（FP-growths）。这两种算法都利用了数据集与其模式之间的层次关系，从而减少了数据扫描次数。\n\
  \n### 基于树的算法\n基于树的算法包括 DHP（直接哈希与剪枝），它是作为 Apriori 算法的改进提出的。它建立在传统逻辑之上，但有两个主要的改进。第一个改进是在每次迭代中剪枝项集，第二个改进是修剪事务以使支持计数更高效。在对数据集进行第一次扫描后，它维护一个分布式哈希表（DHT），并将其用于后续计算。正是这个\
  \ DHT 用于制作位图（BitMap）表示表，以确定数据集中是否存在是否存在。对于数据集中的项目，会考虑其归一化频率计数。\n\n# 本章重点\nIBM Watson\
  \ Analytics 最初为金融行业引入，旨在基于 IBM 先端的认知处理能力提供一个简单的分析系统。它利用自然语言处理（NLP）根据输入数据提供预测性决策。\n\
  \n\n\n\n本章的主要议题是理解传统的模式挖掘算法，并针对分布式环境下的大数据处理对这些算法进行改进。我们将看到数据是如何存储在主节点和从节点中的，以及它们如何同步以交替运行，从而获得更好的结果。这种方法不仅能够缩短计算时间，还能提高资源利用率。这种情况的最优解决方案是在分布式环境中使用并行计算结合\
  \ `MapReduce` 算法。它涉及许多参数，如支持计数、置信度、离散属性、连续属性、分级标签等。基于所有这些属性，模式可以分类为：\n\n### 负频繁模式\
  \ (Negative Frequent Patterns)\n\n模式挖掘中的主要挑战之一是从其他模式中分离出有用的模式。正是因为这个原因，才考虑不同的属性以得出恰当分离。其中一些是\
  \ `support`、`confidence`、`normalization factor` 等。假设某个项目在数据集中具有某定的出现频率，但这并不能向我们展示该项目的真实情况。有许多条件参数决定了项目的出现。因此我们可以说，项目的绝对频率在模式挖掘中是没有意义的。它需要考虑到所有偏差和相关因素进行条件分析。各种模式挖掘方法都关注频率归一化，它们能够获得数据集中模式的正确视图。在负关联的情况下，通常观察到一个高支持度的项目出现意味着数据集中不存在另一个项目。\n\
  \n### 约束频繁模式 (Constrained Frequent Patterns)\n\n通常我们需要根据用户需求对模式进行过滤，并对区分参数做出适当选择。例如，客户可能希望在挖掘数据集中存在特定的项目集，但定义了一些区分因素，决定了该特定挖掘模式的条件规则库。事实上，我们可以直接将所有约束推入挖掘过程。这具有许多优势，因为与其他方法相比，可以在低得的支持水平下进行挖掘。因此可以说，约束模式挖掘涉及部署具有归一化频率值的条件模式。\n\
  \n### 压缩频繁模式 (Compressed Frequent Patterns)\n\n模式挖掘中的主要问题之一是给定数据集中模式的数量和冗余。所有传统算法都需要进行多次数据扫描来寻找有趣的模式。这增加了操作和系统需求。大多数时候，频繁模式集的一个子集也是频繁的。为了使过程变得简单，大多数算法利用有用模式的\
  \ `bitmap` 表示并同时修剪剩余模式。因此，它解决了多次数据扫描的问题，并减少了计算需求。\n\n所提系统的主要目标是让这一过程对用户变得省心，即他们将不必维护集群，也不需要花费大量资金用于硬件设备来挖掘信息以及调度负责大数据分析的任务。该系统基于\
  \ `Hadoop` 生态系统构建。对于客户来说，它是独立服务和托管服务的混合，并将极大减少他们的工作量。它旨在根据用户输入找到数据集中所有有趣的模式，从而帮助从其他模式中分类出有用模式。其旨在减少计算的硬件需求，并产生资源优化的结果。它将极大推动市场行业中任何产品或服务的发展，涉及：\n\
  \n* 投资者\n* 业务分析师\n* 电子商务公司\n* 广告代理\n* 批发商\n\n如果事务数据库具有大量的频繁模式，那么将完整数据加载到内存中将变得困难。为了克服这个问题，可以使用各种并行挖掘技术，它们并行挖掘频繁模式并给出所需的输出。现在，为了解决这个问题，我们可以利用云端的\
  \ `Sequential Pattern Mining`（序列模式挖掘），它利用云框架。它部署 `bitmap` 表示来寻找挖掘模式。传统方法以集中化的方式运行，限制了计算能力和效率。云端的\
  \ `Sequential Pattern Mining` 为这个问题提供了良好的解决方案。它利用具有两个主要阶段的递归 `MapReduce` 技术。首先它扫描数据集，然后挖掘数据集。在扫描阶段，它扫描数据并生成一个分布式哈希表。现在在挖掘阶段，它利用迭代的\
  \ `MapReduce` 过程，形成同时的 `Mappers` 并并发执行该过程。它部署了分布式版本的序列模式挖掘，利用了分治法策略。我们的算法利用 `MapReduce`\
  \ 计算算法在分布式环境中进行序列模式挖掘。它由两个过程组成：映射过程和还原过程，这两个过程被进一步用于两个独立的阶段，即扫描阶段和挖掘阶段。\n\n####\
  \ 扫描阶段 (Scanning Phase)\n在扫描阶段，通过将寻找元素的任务分配到不同的 `mapper` 任务上来获得高性能，这些任务可以在带有分布式数据库或文件系统的多台机器上并行运行。然后运行\
  \ `Reducer` 任务来查找不同模式的频率，并随后从记录中删除不频繁的模式。结果可以存储并传递给挖掘阶段。\n\n#### 挖掘阶段 (Mining Phase)\n\
  在挖掘阶段，主要目标是找到数据集中所有可能的模式，并修剪非序列和非有用的模式，从数据集中过滤出重要信息。我们尝试使用词法序列树（lexical sequence\
  \ tree）来实现这一点，该树可以生成数据集中存在的所有可能的模式，然后对该树进行修剪以找到有用的或序列模式。\n\n现在有了一个非常明显的问题：在分布式环境中，迭代的\
  \ `MapReduce` 为什么比传统算法更好？以下是一些比较参数：\n\n*   **内存可扩展性 (Memory Scalability)**：由于采用了主从架构，这种方法极大地减少了内存需求。这里还考虑了数据的动态性质，这有助于并行处理。所需的内存也减少了，因为所有不必要的模式都在不断地修剪掉。\n\
  *   **工作划分 (Work Partitioning)**：大多数数据处理作业被分为两个阶段，即扫描阶段和挖掘阶段。这两个阶段都有一个 `Mapper`\
  \ 任务和一个 `Reducer` 任务。现在，主节点 mapper 阶段的执行不会干扰从节点 mapper 阶段的执行，反之亦然。这将消除除了各种 `MapReduce`\
  \ 任务之间的相互依赖。\n*   **扩展性 (Scaling)**：设置 `Hadoop` 是一次性投资，之后可以随着新的集群节点轻松扩展。它可以部署在廉价的商品化服务器上，允许节点组根据需要进行发展。\n\
  *   **数据限制 (Data Restrictions)**：`Hadoop` 可以处理非结构化数据，而无需在使用之前对其进行处理。在使用之前不需要对数据进行清洗。因此，这里稍微更偏于\
  \ `MapReduce`。\n*   **语言 (Language)**：`MapReduce` 控制组件背后的语言基本上是 `Java`。它还利用内部的 `Pig`\
  \ 和 `Python`，这将使管理和部署过程变得更容易。\n\n\n\n\n随着数据生成率的不断提高，在单个设备上存储所有数据并在本地计算已变得非常困难。这就是分布式计算出现用场的原因。传统模式挖掘算法的主要问题是它们需要反复扫描同一个数据集，从而增加了计算需求。此外，还缺乏一种离散的方法将有用模式与无意义的模式分离来。这些算法大部分利用了本地计算，这受到本地存储数据和重复扫描数据的限制。另一个应用领域是基因组测序。基因组测序解码了基因组中\
  \ DNA 核苷酸（或碱基）的顺序——即构成生物 DNA 的 A、C、G 和 T 的顺序。人类基因组由超过 30 亿个遗传字母组成。从患有遗传疾病的患者身上采集样本，进行基因组测序以确定患者适当的遗传异常。这些基因组测序样本产生数字节级的数据，需要进行实时分析以提供准确的结果，并与现有序列进行解密和验证。在大数据领域，数据分析还有许多应用场景。在许多场景下，我们需要从大型数据集中即时结果，但由于各种限制，我们无法及时获得结果。这些可能是由于处理能力不足、技能短缺等原因。因此，迭代\
  \ MapReduce (i-MapReduce) 为我们带来了救，并减少了对硬件模块和集群的依赖。\n\n因此，为了克服所有问题，我们可以利用顺序模式挖掘的分布式版本，该版本利用了分治策略。算法的核心重点是利用\
  \ MapReduce 计算算法在分布式环境中进行顺序模式挖掘。它由两个过程组成：映射过程和还原过程，进一步分为两个独立的阶段，即扫描阶段和挖掘阶段。\n\n\
  ## 解决方案与建议\n\n架构包含以下元素：数据存储、数据解析器、数据采样器、数据分析以及数据可视化层。\n\n采样层负责收集随机数据片段以执行一些初始预处理任务。它的任务是从所有测量值的原始集中选择一个子集。由于输入该层的是非结构化数据，因此结构化任务由采样层完成。这是通过寻找输入数据的分隔符并找到采样数据的有效摘要来完成数据概述，从而在相同数据上运行优化的算法。采样的类型从简单随机采样（其中任何特定数据被采样的概率相等）到自定义采样（用户指定从输入数据中采样多大百分比的数据）。\n\
  \n数据解析层支持提取任何类型数据的各种属性。该层支持多种格式，如 `CSV`、`XML` 和 `JSON`，因为大多数用于分析的数据以这些格式之一存在。该层还支持提取数据的特定属性。这同样基于用户针对任何三种输入类型提供的自定义查询。\n\
  \n核心分析层细分为若干子层。这些子层分别命名为聚合层、过滤层、分类层和数据组织层。数据在采样和解析后进入此层，因此准备好进行用户指定的类型分析。过滤层的目标是根据某些应用函数提取某些数据块，或随机提取大小和维度各异的数据块。该层的主要功能是找到参数字符串中出现的所有不同值，以便过滤掉所有重复项，从而减少模式的冗余。\n\
  \n可视化层的作用目标是帮助更好地理解数据。该层让普通用户看到的图像变得更清晰。在输入数据集上运行指定算法后，将生成一个输出文件，该文件将输入到名为 `Tableau`\
  \ 的软件中，并带上集群详情和端口号。这将为我们的输出数据生成图形表示以改进理解。\n\n它有两个主要阶段：\n\n### 1. 扫描阶段\n\n在扫描阶段，通过将查找元素的任务分发到不同的映射（mapper）任务上获得高性能，这些任务可以在带有分布式数据库或文件系统的多台机器上并行运行。然后运行还原（reducer）任务以查找不同模式的频率，并随后从记录中删除低频模式。结果可以被存储起来以传递给挖掘阶段。此阶段的主要任务是创建词法序列树（LST）。每个公共节点或其关联子树代表数据集中的一个序列。通过将数据集分成部分并在每个部分上独立运行映射器，我们在此阶段获得了可扩展性，从而在分布式系统上提供更快的执行时间。映射器在树上进行深度搜索以挖掘模式，但搜索是深度限制搜索，以减轻映射器程序的负载。这消除了\
  \ LST 构建和挖掘中的一个瓶颈，并为每个映射阶段提供了更多平衡。映射阶段创建一个中间输出，该输出可以由还原过程处理，以剪掉非顺序模式。模式以格式 `<pattern,\
  \ bit-AND -result>` 存储，以供还原侧处理。映射阶段输出模式连同节点深度，并假设节点深度有一个阈值，任何支持计数计数低于阈值的节点将不被处理，其扩展部分也不会被处理。\n\
  \n#### 扫描阶段伪代码（映射器）\n\n```\n* 客户端输入：`p` (分区器)\n* 步骤 1：变量 `p` = 接收输入数据；\n* 步骤 2：变量\
  \ `data` = `p.value`; // < Custid, Tid, Item >\n* 步骤 3：循环 `p` 中的每条数据\n* 步骤 4：输出\
  \ `< data.Item, (data.Custid, data.Tid) >;\n* 步骤 5：结束循环\n```\n\n#### 扫描阶段伪代码（还原器）\n\
  \n```\n* 映射输入 `<k, v>\n* `sup`, `threshold`\n* 步骤 1：变量 `i` = `k`; // 存储输入\n* 步骤\
  \ 2：变量 `sup` = `s`; // 用于存储支持\n* 步骤 3：循环 `v` 中的每个值\n* 步骤 4：查找每个项目 (i) 的支持计数\n* 步骤\
  \ 5：结束循环\n* 步骤 6：循环 `sup` 中的每个 `< i, s >`\n* 步骤 7：如果 `s(i).support >= sup` 则\n*\
  \ 步骤 8：变量 `bit` = 为每个项目 (i) 创建位图\n* 步骤 9：将 `< i, (data, bit) >`  DHT\n* 步骤 10：结束如果\n\
  * 步骤 11：结束循环\n```\n\n### 2. 挖掘阶段\n\n\n\n\n\n在挖掘阶段，`mapper task`（映射任务）创建一个词法序列树，用于寻找模式并提高运行在树上的有限深度\
  \ `dfs` 的效率，而 `reducer task`（归器任务）则寻找模式的支持度并发现实用的模式。这些阶段将进一步进一步阐述。在扫描阶段，数据被加载到机器上进行扫描和挖掘。为了避免在加载过程中丢失数据，每个\
  \ `mapper task` 和 `reducer task` 都会根据内存分块或行数读取预分区的局部数据。`mapper task` 将数据 `Tuples`（元组）转换为键值对以进行快速处理。元组根据\
  \ `itemID` 进行分组，并将事务 ID 存储在值部分。例如，`item,(tid,tid)`。`reducer task` 统计项目和模式的支持度，这可以用于移除低频模式。为了处理\
  \ `mappers` 和 `reducers` 之间的数据，具有相同键（keys）的 `mapper` 和 `reducer` 会处理相同的数据集。通过识别一个\
  \ `threshold`（阈值）来移除低频模式。为了移除低频模式，任何置信度值小于 `threshold` 的模式都将被移除，`reducer` 将数据存储在分布式哈希表或分布式文件系统中，该系统供挖掘阶段的下一个\
  \ `MapReduce` 任务访问。\n\n### 挖掘阶段伪代码 (Mapper)\n\n```\n* 输入: `X`, `depth (d)`, 子树的最大深度\n\
  * 步骤 1: 变量 `LST`; // 本地机器上的词法序列树\n* 步骤 2: `LST = 生成一个根节点为 X 且深度为 d 的子树`\n* 步骤 3:\
  \ 遍历 `LST` 中的每个节点\n* 步骤 4: 变量 `bit-A_r = 执行位与操作`\n* 步骤 5: 如果 (bit-A_r > 0)\n* 步骤\
  \ 6: 输出 < node.pattern, (Cid, bit-A_r) >;\n* 步骤 7: 如果结束\n* 步骤 8: 循环结束\n```\n\n###\
  \ 挖掘阶段伪代码 (Reducer)\n\n```\n* 挖掘输入：一组 < pattern, (Custid, bit-A_r) > 对\n* `min_sup`,\
  \ 最小支持度阈值\n* 步骤 1: 遍历每个模式\n* 步骤 2: `Freq = 存储此模式的净支持计数;`\n* 步骤 3: 如果 freq >= min_sup\n\
  * 步骤 4: 输出模式 < pattern, freq >;\n* 步骤 5: 如果此模式是当前子扩展树中的叶节点\n* 步骤 6: 将模式输出到可扩展集;\n\
  * 步骤 7: 如果循环结束\n* 步骤 8: 如果循环结束\n* 步骤 9: 循环结束\n```\n\n这里的主要目标是在数据集中寻找所有可能的模式，并剪掉非顺序和无用的模式，以便从数据集中过滤出重要信息。我们尝试使用词法序列树来实现这一点，该树可以生成数据集中存在的所有可能的模式，然后对该树进行剪枝以找到实用或顺序模式。`reducer\
  \ phase` 的任务是合并 `mapper phase` 和 `reducer phase` 的输出，并剪掉支持计数低的模式。`reducer phase`\
  \ 从 `BitANDresult` 中提取深度和支持计数，以从 `mapper phase` 的预处理数据中获取信息；`reducer phase` 在并行运行的\
  \ `mapper processes` 构建的分布式环境中，并行处理唯一 `mapper` 的输出。我们可以从这种行为中得出结论：通过同步主节点和从节点，可以更好地处理更大的的数据集。更好的选项是始终通过递归的从节点调用回来触发主节点。\n\
  \n在各种数据集的模式挖掘中，已经考虑了多种用于性能评估的参数。某些包括：\n\n* 内存可扩展性\n* 工作划分\n* 负载均衡。\n\n| 图 2. 架构图\
