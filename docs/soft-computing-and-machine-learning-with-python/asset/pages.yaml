- pgno: 339
  md: '# BACKGROUND


    The number of computer programs for the analysis of genetic data is increasing
    significantly, but it still needs to be improved greatly because of the importance
    of result analysis with appropriate methods and the exponential growth in the
    volume of genetic data.


    Genetic data are typically represented by a set of strings [1], where each string
    is a sequence of symbols from a generic alphabet. The string representation, called
    primary structure, reflects the facts that the molecules storing genetic information
    (DNA and RNA) are biopolymers of nucleotides, while proteins are polypeptide chains.
    The secondary, tertiary, and quaternary structures need to be considered to understand
    the interactions among nucleotides or amino acids, but they are used less frequently
    in computer programs. The secondary structure includes the hydrogen bonds between
    nucleotides in DNA and the RNA bonds between peptide groups in proteins, where
    the molecules are represented by graphs. The tertiary structure refers to the
    positions of atoms in three-dimensional space, and the quaternary structure represents
    the higher level of organization of molecules. The representations of molecules
    are extended based on connections between sequences or subsequences, which denotes
    similarity from various perspectives. Moreover, these data are supplemented with
    human-readable descriptions, which facilitate an understanding of the biological
    means of the sequence, its function and/or structure.


    The large number of possible candidate solutions for the analysis of genetic data
    means that the employed algorithms must be selected carefully [2]. Exhaustive
    search algorithms must be supported by heuristics based on biological properties
    of the modeled objects. Particular importance in this field are dynamic programming
    algorithms, which allow us to find the optimal alignment of biological sequences
    (i.e., arranging the sequences by inserting gaps to identify regions of similarity
    [1]) in polynomial time, although the search space grows exponentially. Dynamic
    programming is used to search for similarity (local or global), to generate a
    multisequence representation (profile), and to examine sequences with Markov models.
    In addition, backtracking algorithms are used to search for motifs (i.e., identifying
    meaningful patterns in genetic sequences), greedy algorithms to detect genome
    rearrangements and to sort by reversals, divide-conquer algorithms to perform
    space-efficient sequence alignments, and graph algorithms for DNA assembly.'
  merge: -1
  img_proc: true
