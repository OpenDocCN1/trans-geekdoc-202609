  md: '# Scikit-learn: Machine Learning in Python 273


    framework. While the package is mostly written in Python, it incorporates the
    C++ libraries LibSVM (Chang and Lin, 2001) and LibLinear (Fan et al., 2008) that
    provide reference implementations of SVMs and generalized linear models with compatible
    clients. Binary packages are available on a rich set of platforms including Windows
