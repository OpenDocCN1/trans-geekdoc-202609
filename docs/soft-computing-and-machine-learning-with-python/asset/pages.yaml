    **Keywords:** Bayesian networks, python, open source software


    # # INTRODUCTION

    esian networks (BN) have become a popular methodology in many fields because they
    can model nonlinear, multimodal relationships using noisy, inconsistent data.
    Although learning the structure of BNs from data is now common, there is still
    a great need for high-quality open-source software that can meet the needs of
    various users. Users require software that is easy to use; supports learning with
    different data types; can accommodate missing values and hidden variables; and
    can take advantage of various computational clusters and grids. Researchers require
    a framework for developing and testing new algorithms and translating them into
    usable software. We have developed the Python Environment for Bayesian Learning
    (PEBL) to meet these needs.


    # # PEBL FEATURES

    PEBL provides many features for working with data and BNs; some of the more notable
    ones are listed below.


    # ## Structure Learning

    PEBL can load data from tab-delimited text files with continuous, discrete and
    class variables and can perform maximum entropy discretization. Data collected
    following an intervention is important for determining causality but requires
    an altered scoring procedure (Pe''er et al., 2001; Sachs et al., 2002). PEBL uses
    the BDe metric for scoring networks and handles interventional data using the
    method described by Yoo et al. (2002).'
