  md: 'Data Mining with Skewed Data 63


    are average balance of a bank account within the last 6 months, minimum balance
    of a bank account within the last 12 months, and maximum days in arrears3 over
    the last 3 months:


    +   3. Interaction: variable combining two or more different characteristics (of
    any type) in order to map interacting phenomena. For example, average credit limit
    utilization = average utilization / credit limit.


    # CATEGORISATION (GROUPING)


    Categorisation (discretising, binning or grouping) is any process that can be
    applied to a characteristic in order to turn it into categorical values Witten
    & Franku (2005). For example, let us suppose that the variable ranges from 0 to
    99 and all values within this interval are possible. A valid categorisation in
    this case could be


    +   1. category 1: if age is between 1 and 17;

    2. category 2: if age is between 18 and 30;

    3. category 3: if age is between 31 and 50;

    4. category 4: if age is between 51 and 99.


    Among others, there are three main reasons for categorising a characteristic:
    firstly, to increase generalisation power; secondly, to apply certain types of
    methods, as e.g. a Generalised Linear Model4 (GLM) Witten & Franku (2005), or
    a logistic regression using Weight of Evidence5 (WoE) formulations Agterberg et
    al. (1993); third, to add stability to the model by getting rid of variations
    noise. Categorisation methods include:


    +   1. Equal width: corresponds to breaking a characteristic into groups of equal
    width. In the example we easily break age into 5 groups of 20 decimals in each:
    0-19, 20-39, 40-59, 60-79, 80-99.

    2. Percentile: this method corresponds to breaking the characteristic into groups
    of equal volume, or percentage, of occurrences. Note that in this case groups
    will have different widths. In some cases breaking a characteristic into many
    groups may not be possible because occurrences are concentrated. A possible algorithm
    to create percentile groups is:'
  merge: -1
  img_proc: true
