    For example, attributes of an airplane include its wingspan, its manufacturer,
    and its current location, direction, and airspeed.


    We can classify attributes into static and dynamic attributes, depending on whether
    they change or not. For example, the wingspan and model number of an airplane
    do not change, but its location and velocity can.


