  md: '# Survey of Machine Learning Algorithms for Disease Diagnostic 83


    These techniques are used to classify the data set.


    +   1) Supervised learning: Offered a training set of examples with suitable targets
    and on the basis of this training set, algorithms respond correctly to all feasible
    inputs. Learning from exemplars is another name of Supervised Learning. Classification
    and regression are the types of Supervised Learning.


    Classification: It gives the prediction of Yes or No, for example, "Is this tumor
    cancerous?", "Does this cookie meet our quality standards?"


    Regression: It gives the answer of "How much" and "How many".


    +   2) Unsupervised learning: Correct responses or targets are not provided. Unsupervised
    learning technique tries to find out the similarities between the input data and
    based on these similarities, unsupervised learning technique classify the data.
    This is also known as density estimation. Unsupervised learning contains clustering
    [1].


    Clustering: it makes clusters on the basis of similarity.


    +   3) Semi supervised learning: Semi supervised learning technique is a class
    of unsupervised learning techniques. This also uses unlabeled data for training
    purpose (generally a minimum amount of labeled-data with a huge amount of unlabeled-data).
    Semi-supervised learning lies between unsupervised-learning (unlabeled-data) and
    supervised learning (labeled-data).


    +   4) Reinforcement learning: This learning is encouraged by behaviorist psychology.
    Algorithm is informed when the answer is wrong, does not inform how to correct
    it. It has to explore and test various possibilities until it finds the right
    answer. It is also known as learning with a critic. It does not recommend improvements.
    Reinforcement learning is different from supervised learning in the sense that
    accurate input and output sets are not offered, nor sub- optimal actions clearly
    précised. Moreover, it focuses on on-line performance.


    +   5) Evolutionary Learning: This biological evolution learning can be considered
    as a learning process: biological organisms are adapted to make progress in their
    survival rates and chance of having offspring. By using the idea of fitness, to
    check how accurate the solution is, we can use this model in a computer [1].'
