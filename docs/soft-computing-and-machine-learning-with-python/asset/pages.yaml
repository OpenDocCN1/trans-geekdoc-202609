- pgno: 72
  md: '# Types of Machine Learning Algorithms 47


    # B. Get Best Matching Unit


    This is a very simple step, just go through all the weight vectors and calculate
    the distance from each weight to the chosen sample vector. The weight with the
    shortest distance is the winner. If there are more than one with the same distance,
    then the winning weight is chosen randomly among the weights with the shortest
    distance. There are a number of different ways for determining which actually
    means mathematically. The most common method is to use the Euclidean distance:


    ```

    \sum_{i=0}^{n} x_i^2

    ```


    where x[i] is the data value at the ith data member of a sample and n is the number
    of dimensions to the sample vectors.

    In the case of colour, if we have chosen green which is value we can think of
    them as 3D points, each being an axis. The light color green (3,6,3) will be closer
    to green than red at (0,6,0).


    Light green = Sqrt(3-0)^2+(6-6)^2+(3-0)^2 = 4.24 Red = Sqrt(6-0)^2+(0-6)^2+(0-0)^2
    = 8.49


    So green is now the best matching unit, but this operation of calculating distances
    and comparing them is done over the entire map and the weight with the shortest
    distance to the sample vector is the winner and the BMU. The square root is not
    computed in the java program for speed optimization for this section.


    # C. Scale Neighbors


    # 1. Determining Neighbors


    There are actually two parts to scaling the neighboring weights: determining which
    weights are considered as neighbors and how much each weight can become more like
    the sample vector. The neighbors of a winning weight can be determined using a
    number of different methods. Some concentric squares, others hexagons, I opted
    to use a gaussian function when every point with a value above zero is considered
    a neighbor.


    As mentioned previously, the amount of neighbors decreases over time. This is
    done so samples can first move to an area where they will probably be, then they
    jockey for position. This process is similar to coarse adjustment'
  merge: -1
  img_proc: true
