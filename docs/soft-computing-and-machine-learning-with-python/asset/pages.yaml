    # # CONCLUSION


    Scikit-learn exposes a wide variety of machine learning algorithms, both supervised
    and unsupervised, using a consistent, task-oriented interface, thus enabling easy
    comparison of methods for a given application. Since it relies on the scientific
    Python ecosystem, it can easily be integrated into applications outside the traditional
    range of statistical data analysis. Importantly, the algorithms, implemented in
    a high-level language, can be used as building blocks for approaches specific
