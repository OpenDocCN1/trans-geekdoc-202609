  md: 'fairly conducting the same procedure for the other methods. In general, for
    the other methods, default parameters, or a parameter set set in some previous
    work is used. Therefore, it is not a surprise that the new proposed method wins.
    At a first glance, the usage of the default parameter set seem to be biased and
    this bias is also occured in publications. However, using default sets can be
    biased by the original training set and, thus, not fair.


    Parameter optimisation takes time and is rarely conducted. For a fair comparison,
    we argue that one has to fine tune the parameters for all compared method. This
    can be done, for instance, via an exhaustive search of the parameter space if
    such is affordable, or some kind of sampling like in Genetic Algorithm (GA) (see
    Figure 1). Notice, that the final parameter set cannot be claimed to be optimal
    in this.


    Unfortunately, this sampling procedure is not as easy as one may suppose. There
    is not a single universal optimisation algorithm for all problems (No Free Lunch
    theorem - Wolpert and Macready 1997 Wolpert & Macready (1997)). Even the genetic
    algorithm scheme as shown in Figure 1 might require parameter adjustment. According
    to our experience, we verified that a simple mistake in the probability distribution
    computation may drive the results to completely different and or misleading results.
    A good genetic algorithm requires expert expertise, knowledge about the problem
    that should be optimised by the GA, an intelligent design, and resources. The
    more, the better. These considerations also imply that comparisons involving methods
    with suboptimal parameter sets depend very much on how well each parameter sampling
    was conducted.


    # ROBUSTNESS OF PARAMETERS


    After the parameter optimisation has been conducted, it can be advantageous or
    desirable to have the optimised parameters independent from the training set,
    i.e. they can be applied to different datasets of the same problem. In this case
    we can call this parameter robust.


    When the parameter are not robust, the optimisation process is not as strong as
    expected since the optimised parameter set has no or little generalisation power.
    In this case, in our experiments, we found that it is a good approach to sacrifice
    some prediction power in order to gain robustness in the parameter set. Note that
    a procedure using n-fold validation could lead to a parameter set that is more
