    # Data Domain Description


    This interpretation motivated us to consider the problem to be a data domain description
    problem, also known as a one-class classification problem. In particular, rather
    than predict whether or not a graph is RNA-like, we instead explore the degree
    to which the 18 verified graphs quantify the entire class of RNA-like graphs.


    To do so, we use a "cognitive learning" approach in association with an artificial
    neural network [14]. While this is typically performed with a support vector machine
    [15, 16], our goal is to examine how the RNA multigraphs of order 5 are distributed
    about the 18 verified multigraphs. In particular, the graded response of the neural
    network can be used to implement a genetic algorithm for successively refining
    the learning set of a neural network.


    Suppose that we are given a training set P that contains examples from only one
    class of data along with a test set S of unbiased data that may or not contain
    examples from another class. The method begins with a prior assumption: patterns
    that are many standard deviations away from'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# Classifying Multigraph Models of Secondary RNA Structure Using... 341


    any pattern in the training set at least one other class of patterns. This assumption
    is used to generate an initial "negative example set", N, of large sigma patterns,
    after which the algorithm proceeds as follows.


    +   (1) Train the neural network with P U N.


    +   (2) Classify the set S with the neural network. The classifications are numbers
    in [0, 1].


    +   (3) Use the Receiver Operating Characteristic (ROC) or similar method to find
    the optimal threshold for distinguishing between patterns in N and patterns in
    P.


    +   (4) Choose some number n of the highest patterns in S to be moved into P,
    being careful to stay above the threshold in step 3.


    +   (5) Choose some number m of the lowest patterns in S to be moved into N, being
    careful to stay below the threshold in step 3.


    +   (6) Move the q patterns in N and the r patterns in P not correctly classified
    into the set S.


    +   (7) Eliminate the large sigma patterns (after the first iteration).


    The algorithm proceeds until S is empty, or through some set number of iterations.
    In practice, changes to N, P, and S are based on upper and lower thresholds based
    on the results of step 3.


    Although the process is closely supervised in practice, the goal is to mimic the
    cognitive learning process of grouping via reinforcement. Ideally, if there is
    more than one class in the initial P U set of patterns, then a two-class classifier
    will emerge in the process. If there is only one class in P U S, the algorithm
    will proceed until all (or in practice) of the patterns initially in S are in
    P and all the patterns in N are large sigma patterns. Moreover, the rate at which
    a pattern moves into P can be used as a measure of how close those patterns are
    to P itself.


    The algorithm was tested on several standardized datasets from various sources
    and repositories. When there are two or more distinct classes, which is to say
    that one or more classes distinct from P initially, the algorithm stabilizes to
    a distinct non-P class containing N in each iteration. When there is only one
    class overall, the set N is eventually empty. Within a domain description problem,
    the final set of patterns in N,by which we denote Nf , is significant in that
    it differs the most in some sense from the initial P class.


    The latter was the case with the classification of the RNAlike multigraphs of
    order 5. In each of 10 trials, the set N became empty after a relatively'
