  md: '# 324 Soft Computing and Machine Learning with Python


    # DISCUSSION


    To speed up the creation of new software, the developer can use a specialized
    framework. The most popular, freely available frameworks are Bioconductor [11],
    MEGA tool [12], and OpenMS [13]. On the other hand, the programmer can use general-purpose
    programming language and specialized libraries, for example, C++ with NCBI C++
    Toolkit [14], Python with BioPython [7], Java with BioJava [15], and BioWeka [16].
    All these solutions impose limitations connected with the usage of only one programming
    language [17] and do not support the user interface in a web browser.


    The polyglot environment is common among web software, that is software accessible
    from a web browser, because the client-side software (JavaScript, HTML, and CSS)
    has different responsibilities compared to server side. The ubiquity of mobile
    applications and the advent of big data change the software development to multiple
    languages [18]. Similar trends are evident in the bioinformatics software and
    the examples are GBrowse [19] or GEMBASSY [20]. Bioweb provides a framework for
    the construction of such applications. There are many application development
    frameworks that connect C++ with Python or Python with JavaScript. Presented solution
    is similar but combines three programming languages.


    The bioweb is small, but it can be extended, and it can use specialized libraries.
    The heavyweight web-based genome analysis frameworks, such as Galaxy [21], have
    a lot of ready-made modules and meet most of the requirements for systems for
    the genetic data analysis. However, creating custom modules and algorithms is
    not trivial. Presented framework allows the user to create smaller and independent
    solutions, which are easier to manage and to customize. It could be easily extended
    to use GPU and/or computing clusters, which is required in production-scale analysis.


    # CONCLUSION


    The bioweb framework is freely available from http://bioweb.sourceforge.net under
