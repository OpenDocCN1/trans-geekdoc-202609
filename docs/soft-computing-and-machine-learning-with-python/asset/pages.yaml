    When Python starts up, three variables are always defined: __builtins__,

    doc__, and __name__. These variables are for advanced work and needn''t

    concern us now.


    Note that when we define a variable (frankness), next time we call dir(),

    ame is in the result list. When we define a function (oi), its name is also

    added. Note that you can also use the type(function) to find the type of any

    currently defined name: frankness has type float, and oi has type function.


    Now let''s see what happens when we import the math module

    into the global namespace:


    ```

    >>> from math import *

    >>> dir()

    [''__builtins__'', ''__doc__'', ''__name__'', ''acos'', ''asin'', ''atan'', ''atan2'',

    ''ceil'', ''cos'', ''cosh'', ''degrees'', ''e'', ''exp'', ''fabs'', ''floor'',
    ''fmod'', ''frankness'',

    ''frexp'', ''hypot'', ''ldexp'', ''log'', ''log10'', ''modf'', ''oi'', ''pi'',
    ''pow'', ''radians'',

    ''sin'', ''sinh'', ''tan'', ''tanh]

    >>> sqrt(64)

    8.0

    >>> pi*10.0

    31.415926535897931

    >>> cos(0.0)

    >>>

    ```


    As you can see, the names we have defined (oi and frankness) are still

    there, but all of the variables and functions from the math module are now in

    t namespace, and we can use its functions and variables like sqrt() and pi.


    In general, an import statement of this form copies all the functions and

    variables from the module into the current namespace:


    ```

    from someModule import *

    ```


    However, you can also be selective about which items you want to

    import. Use a statement of this form:


    ```

    from someModule import item1, item2, ...

    ```'
