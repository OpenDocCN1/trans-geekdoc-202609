- pgno: 64
  md: '# Types of Machine Learning Algorithms 39


    This division into multiple subsets is very unfortunate, given that we usually
    have less data than we ideally desire for a single subset. We can get around this
    problem by resampling. Experiments can be conducted using different divisions
    of the available data into training, selection, and test sets. There are a number
    of approaches to this subset, including random (monte-carlo) resampling, cross-validation,
    and bootstrap. If we make design choices, using the best configuration of neural
    network to, based upon a number of experiments with different subset examples,
    the results will be more reliable. We can then use those experiments solely to
    guide the decision as which network types to use, and train networks from scratch
    with new samples (removes any sampling bias); or, we can retain the best networks
    found during the sampling process, but average their results in an ensemble, which
    at mitigates the sampling bias.


    To summarize, network design (once the input variables have been selected) follows
    a number of stages:


    +   - Select an initial configuration (typically, one hidden layer with the number
    of hidden units set to the sum of the input and output units).

    - Iteratively conduct a number of experiments with each configuration, retaining
    the best network (in terms of selection error). A number of experiments are required
    with each configuration to avoid being fooled if training locates a local minimum,
    and it is also best to resample.

    - On each experiment, if under-learning occurs (the network doesn''t achieve an
    acceptable performance level) try adding more neurons to the hidden layer(s).
    If this doesn''t help, try adding an extra hidden layer.

    - If over-learning occurs (selection error starts to rise) try removing hidden
    units (and possibly layers).

    - Once you have experimentally determined an effective configuration for your
    networks, resample and generate new networks with that configuration.

    - Data Selection: All the above stages rely on a key assumption. Specifically,
    the training, verification and test data must be representative of the underlying
    model (and, further, the three sets must be independently representative). The
    old computer science adage “garbage in, garbage out” could not apply more strongly'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Soft Computing and Machine Learning with Python


    than in neural modeling. If training data is not representative, then the model''s
    work is at most compromised. At worst, it may be useless. It is worth spelling
    out the kind of problems which can corrupt a training set:


    The future is not the past. Training data is typically historical. If circumstances
    have changed, relationships which held in the past may no longer hold. All eventualities
    must be covered. A neural network can only learn from cases that are present.
    If people with incomes over $100,000 per year are a bad credit risk, and your
    training data includes over $40,000 per year, you cannot expect it to make a correct
    decision when it encounters one of the precisely-unseen cases. Extrapolation is
    dangerous with any model, but some types of neural network may make particularly
    poor predictions in such circumstances.


    A network learns the easiest features first. A classic (possibly apocryphal) illustration
    of this is a vision project designed to automatically recognize tanks. A network
    is trained on a hundred pictures including tanks, and a hundred not. It achieves
    a perfect 100% score. When tested on new data, it proves hopeless. The reason?
    The pictures of tanks are taken on dark, rainy days; the pictures on sunny days.
    The network learns to distinguish the (trivial matter of) differences in overall
    light intensity. To work, the network would need training cases including all
    weather and lighting conditions under which it is expected to operate - not to
    mention all types of terrain, angles of shot, distances...


    Unbalanced data sets. Since a network minimizes an overall error, the proportion
    of types of data in the set is critical. A network trained on a set with 900 good
    cases and 100 bad will bias its decisions towards good cases, as this allows the
    algorithm to lower the overall error (which is much heavily influenced by the
    good cases). If the representation of good and bad cases is different in the real
    population, the network''s decisions may be wrong. A good example would be disease
    diagnosis. Perhaps 90% of patients routinely tested are clear of a disease. A
    network is trained on an available data set with 90/10 split. It is then used
    in diagnosis of patients complaining of specific problems, where the likelihood
    of disease is 50/50. The network will react over-cautiously and fail to recognize
    disease in some unhealthy patients. In contrast, if trained on the "complainants"
    data, the network may raise a high number of false positives. In such circumstances,
    the data set may need to be crafted to take into account the distribution of data
    (e.g., you could replicate the numerous cases, or remove some of the numerous
    cases), or the network''s'
