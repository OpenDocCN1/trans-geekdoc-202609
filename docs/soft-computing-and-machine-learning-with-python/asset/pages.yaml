    # ABSTRACT


    Applications used for the analysis of genetic data process large volumes of data
    with complex algorithms. High performance, flexibility, and a user interface with
    a web browser are required by these solutions, which can be achieved by using
    multiple programming languages. In this study, I developed a freely available
    framework for building software to analyze genetic data, which uses C++, Python,
    JavaScript and several libraries. This system was used to build a number of genetic
    data processing applications and it reduced the time and costs of development.


