    # MODEL STABILITY


    In industry, generally the aim of modelling is to apply a model to a real situation
    and to generate profit, either by automating decision making where a model was
    not previously available or replacing old models by a new and improved one. For
    doing so, most model development rely on past information for their training.
    Therefore, it is very important to be able to assess whether or not a model is
    fit for propose when it is in use, and to have a set of actions to expand the
    model''s life span. In this section we explore out-outstime samples, monitoring
    reports, stability by vintage, vintage selection and how to deal with different
    scales over time.


    # Out-of-time


    An Out-Of-Time sample (OOT) is any sample of the same phenomena used in the model
    development that is not in the development window8 , historic vintages or observation
    point selected for development. In most cases in reality a simple split of the
    development sample into training and testing data cannot identify a real over-fitting
    of the model Sobehart et al. (2000). Therefore, the most appropriated approach
    to identify this change is either to select a vintage or observation point posterior
    to the development window or select this previously to the development window.
    The second approach gives the extra advantage of using the most up-to-date information
    for the development.


    # Monitoring reports


    The previous action, OOT, should be best done before the actual model implementation;
    after that, it becomes important to evaluate whether the implemented model still
    delivers a good prediction. For this purpose, it is crucial to create a set of
    period based monitoring reports to track the model''s performance and stability
    over time.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Soft Computing and Machine Learning with Python


    # Stability by Vintage


    Stability by vintage corresponds to breaking the development sample down by time
    within the development window and evaluate the model''s performance in all of
    the periods within the data. For example, if one has information collected from
    January 08 to December 08, a good stability by vintage analysis would be to evaluate
    the model''s performance over each month of 2008. This tends to increase the chance
    of a model to be stable after its implementation.


    # Vintage Selection


    Many phenomena found in nature, and even in human behaviour, repeat themselves
    year after year in a recurrent manner; this is known as seasonality. Choosing
    a development window from a very atypical month of the year can be very misleading;
    in credit cards, for example, choosing only December as the development window
    can lead to overestimation of expected losses since it is the busiest time of
    the year. Two approaches intend to mitigate this problem. Both approaches are
    based on selecting the broadest development window possible. One common window
    is 12 months, allowing the window to cover the whole year. Please notice, there
    is no need to fix the window to any particular month. The first approach corresponds
    to simply develop the model with this pool of observation points; it is expected
    for the model to be an average model that will work throughout the year. A second
    approach is to introduce a characteristic indicating the “month of the year” the
    information was collected from, or any good combination of it, and then to develop
    the model. A as result, one would expect a model that adjusts better to each observation
    point in the development window.


    # Different Scale over Time


    Another problem applies to the situation where characteristic values fall outside
    the training sample boundaries or some unknown attributes occur. To reduce the
    impact of this problem, one can always leave the groups with the smallest and
    biggest boundaries as negative infinite and positive infinite, respectively, for
    example, changing [0,10];[11,20];[21,30] to [-\infty,10];[11,20];[21,+\infty].
    Furthermore, undefined values could also be assigned to a default group. For example,
    if for a numeric a non-numeric value occurs it could be assigned to a default
    group.'
  merge: -1
  img_proc: true
