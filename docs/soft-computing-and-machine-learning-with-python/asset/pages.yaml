  md: '# Polyglot Programming in Applications Used for Genetic Data Analysis 319


    The server application uses the Python language in presented solution, mainly
    because this type of development is faster compared with C++. Modules that do
    not constitute a bottleneck during calculations should be implemented in Python.
    Python is a scripting language, so it is small and has a simple, regular syntax.
    The language is dynamically type-checked, uses a uniform data model, and provides
    reference counting management, so there is no problem with memory leaks. The Python
    repository of software (PIP) https://pypi.python.org/pypi contains over 30,000
    packages and a number of ready-made solutions can be used, particularly the packages
    for exchanging data and packages that support the creation of the web applications
    used. It should be noted that the Biopython library [7] provides a set of tools
    for biological computation which are written in Python.


    In biow the Boost.Python [5] library enables interoperability between the C++
    modules and the Python modules. Other solutions, such as using API from Python
    directly, code generation using Simplified Wrapper and Interface Generator (SWIG),
    C++, Pyrex, and cyton, were considered to be less useful because the interface
    was less convenient and there was a lack of support for the techniques used in
    genetic data software development. The Boost.Python uses Python API and metaprogramming
    techniques, which allows the exposure of C++ classes, functions, and objects to
    Python and vice-versa, supporting the use of Python inside C++ code. BoostPython
    allows the exposure of elements and the register of conversions using a simple
