    # Measures and Procedures


    # The Inductive Reasoning Developmental Test (TDRI) and Its Self-Appraisal Scale
    (SA_TDRI)


    The Inductive Reasoning Developmental Test (TDRI) was developed by Gomes and Golino
    (2009)and by Golino and Gomes (2012) to assess developmental stages of reasoning
    based on Common''s Hierarchical Complexity Model (Commons, 2008; Commons & Pekker,
    2008; Commons & Richards, 1984) and on Fischer''s Dynamic Skill Theory (Fischer,
    1980; Fischer & Yan, 2002). This is a pencil-and-paper test composed of 66 items,
    with a time limit of 100 minutes. Each item presents five letters or set of letters
    (see Figure 2), four with the same rule and one with a different rule. The task
    is to identify which letter or set of letters has the different rule.


    Gomes and Golino (2012) evaluated the structural validity of the TDRI using responses
    from 1459 Brazilian people (52.5% women) aged between 5 to 86 years (M = 15.75,
    SD = 12.21). The results showed a good fit to the Rasch model (INFIT mean = .96;
    SD = .17) with a high separation reliability for items (1.00) and a moderately
    high for people (.82). The item''s difficulty distribution formed a seven cluster
    structure with gaps between them, presenting statistically significant differences
    in the 95% C.I. level (t-test). The CFA showed an adequate fit for a model with
    seven first-order factors and one general factor [χ (61) = 8832.594, p = .000,
    CFI = .96, RMSEA = .059]. The latent class showed that the best model is the one
    with seven latent classes (AIC: 263.380; BIC: 303.887; Loglik: -111.690). The
    TDRI test has a self-appraisal scale attached to each'
