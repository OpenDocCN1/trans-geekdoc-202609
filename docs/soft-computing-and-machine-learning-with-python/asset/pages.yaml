    # SAMPLING


    As computers become more and more powerful, sampling, to reduce the sample size
    for model development, seems to be losing attention and importance. However, when
    dealing with skewed data, sampling methods remain extremely important Chawla et
    al. (2004); Elkan (2001). Here we present two reasons to support this argument.


    First, to help ensure that no over-fitting happens in the development, a sampling
    method can be used to break the original dataset in training and holdout samples.
    Furthermore, a stratified sampling can help guaranteeing that a desirable factor
    has similar percentage in both training and holdout samples. In our work Gadi
    et al. (2008b), for example, we executed a random sampling process to select multiple
    splits of 70% and 30%, as training and holdout samples. However, after evaluating
    the output datasets we redo the sampling process using stratified sampling by
    fraud/legitimate flag.


    Second, to improve the model prediction, one may apply an over- or under-sampling
    process to take the different cost between classes into account. Cost-sensitive
    procedure Elkan (2001) replicates (oversampling) the minority (fraud) class according
    to its cost in order to balance different costs for false positives and false
    negatives. In Gadi et al. (2008a) we achieved interesting results by applying
    a cost-sensitive procedure.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Two advantages of a good implementation of a cost-sensitive procedure are:
    first, it can enable changes in cut-off to the optimal cut-off, For example, in
    fraud detection, if the cost tells one, a cost-sensitive procedure will consider
    a transaction with as little as 8% of probability of fraud as a potential fraud
    to be investigated; second, if the cost-sensitive procedure considers cost per
    transaction, such an algorithm may be able to optimise decisions by considering
    the product [probability of event] x [value at risk], and decide on investigating
    those transactions in which this product is bigger.


    # CHARACTERISTICS SELECTION


    Characteristics selection, also known as feature selection, variable selection,
    feature reduction, attribute selection or variable subset selection, is commonly
    used in machine learning and statistical techniques to select a subset of relevant
    characteristics for the building of robust models Witten & Franku (2005).


    Decision trees do characteristics selection as part of their training process
    when selecting only the most powerful characteristics in each subpopulation, leaving
    out all weak or highly correlated characteristics. Bayesian nets link different
    characteristics by cause and effect rules, leaving out non-correlated characteristics
    Charniak (1991). Logistic Regression does not use any intrinsic strategy for removing
    weak characteristics; however, in many implementations methods such as forward,
    backward and stepwise are always available. In our tests, we have applied a common
    approach in the bank industry that is to consider only those characteristics with
    information value greater than a given percentage threshold.


    # OBJECTIVE FUNCTIONS


    When defining an objective function, in order to compare different models, we
    found in our experiments that two facts are especially important:


    +   1. We have noticed that academia and industry speak in different languages.
    In the academic world, measures such as Kolmogorov Smirnov (KS) Chakrabravarti
    et al. (1967) or Receiver Operating Characteristic (ROC curve) Green & Swets (1966)
    are the most common; in industry, on the other hand, rates are more commonly used.
    In the fraud detection area for example it is common to find measures such as
    hit rate (confidence) and detection rate (cover). Hit rate and detection rate
    are two different dimensions and they'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'are not canonical. To optimise a problem with an objective having two outcomes
    is not a simple task Trautmann & Mehnen (2009). In our work in fraud detection
    we avoided this two-objective function by calculating one outcome value: the total
    cost of fraud;


    In an unbalanced environment it is common to find that not only the proportion
    between classes differs, but also the cost between classes. For example, in the
    fraud detection environment, the loss by fraud when a transaction is fraudulent
    is much bigger than the cost to call a customer to confirm whether he/she did
    or not do the transaction.


    # BOTTOM LINE EXPECTED PREDICTION


    The problem of finding the best model can be computationally expensive, as there
    are many parameters involved in a search. For this reason, it is very common for
    model developers to get satisfied with suboptimal models. A question equally difficult
    to answer, in general, is how far we are from an optimum. We do not intend to
    respond to this question: what we want to address is a list of ways to help the
    model developer to estimate a minimum acceptable performance before getting close
    to the end of the model development. In our fraud analysis we found two good options
    for estimating a bottom line for expected suboptimal: a first option could be
    the cost resulting from a Naive Bayes model. It is important to notice that Na
    Bayes does not need any grouping, characteristics selection or parameter tuning;
    a second option could be to consider the cost from a first “quick and dirty” model
    developed using the method chosen by the model developer.


    # LIMITED RESOURCE SITUATION


    Many real-world application present limited resource problems. This can make the
    decision of what is the best model different compared to a model without restrictions.
    In a hospital, for example, there may be a limited number of beds for patients;
    in a telephone customer service facility there may be a limited number of attendants;
    in the fraud detection world the number of people available to handle manual transactions
    is in general fixed; and the number of transactions each member of fraud detection
    can handle per day is also fixed due to practical reasons. In such applications,
    being aware of the capacity rate becomes very important. It is also extremely'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Data Mining with Skewed Data 69


    important for the model outcome to indicate the probability6 of the event rather
    than providing a simple yes/no response. By having the outcome as a probability,
    models can be compared for use, cutoffs that keep the selecting rate equal to
    the capacity rate. In fraud detection, comparing models detection rate and hit
    rate fixing for example 1000 transaction to be investigated.


    # PARAMETRIC OPTIMISATION


    Once we have the data and the optimisation criteria, the following questions have
    to be answered:


    +   Which classification method is recommended for producing the best model for
    any given application?


    +   Which parameter set should be used?


    For instance, we can apply any classification methods such as: Neural Networks
    (NN), Bayesian Networks (BN), Naïve Bayes (NB), Artificial Immune Systems (AIS)
    and Decision Trees (DT), Support Vector Machines (SVM), Logistic Regression and
    others. In fact, there is no final and unique answer to this first question. Support
    Vector Machines, for instance, is known to be effective with a very large number
    of characteristics and is reported to perform well in categorisation problems
    in Information Retrieval. However, our experience with SVM on fraud data did not
    meet our expectations. For many parameter sets, the method did not even converge
    to a final model and this behaviour for unbalanced data is reported to not uncommon.


    In order to assess methods many factors can be used including the chosen optimisation
    criteria, scalability, time for classification and time spent in training, and
    sometimes more abstract criteria as to understand how the method works. Most of
    the time, when a method is published, or when an implementation is done, the method
    depends on parameter choices that may influence the final results significantly.
    Default parameters, in general, are a good start. However, most of the time, they
    are far from producing the best model. This comprises with our experience with
    many methods in many areas of Computer Science. This is particular for classification
    problems with skewed data.


    Quite often we see comparisons against known methods where the comparison is done
    by applying a special parameter variation strategy (sometimes a parameter optimisation)
    for the chosen method while not'
