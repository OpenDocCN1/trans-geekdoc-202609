    of the 56 items. In this scale, the participants are asked to appraise their achievement
    on the TDRI items, by reporting if he/she passed or failed the item. The scoring
    procedure of the TDRI self-appraisal scale works as follows. The participant receive
    a score of 1 in two situations: 1) if the participant passed the ith item and
    reported that he/she passed the item, and 2) if the participant failed the ith
    item and reported he/she failed the item. On the other hand, the participant receives
    a score of 0 if his appraisal does not match his performance on the ith item:
    1) he/ she passed the item, but reported that failed it, and 2) he/she failed
    the item.


    # The Metacognitive Control Test (TCM) and Its Self-Appraisal Scale (SA_TCM)


    The Metacognitive Control Test (TCM) was developed by Golino and Gomes (2013)
    to assess the ability of people to intuitive answers to logical-mathematical tasks.
    The task is based on Shane Frederick’s Cognitive Reflection Test (Frederick, 2005)
    and is composed by 15 items. The structural validity of the test was assessed
    by Golino and Gomes (2013) using responses from 908 Brazilian people (54.8% women)
    aged between 9 to 86 years (M = 27.70, SD = 11.90). The results showed a good
    fit to the Rasch model (INFIT mean = 1.00; SD = .13) with a high separation reliability
    for items (.99) and a moderately high for people (.81). The TCM also has a self-appraisal
    scale attached to each one of its 15 items. The self-appraisal scale is scored
    exactly as the TDRI self-appraisal scale: an incorrect appraisal receives a score
    of 0, and a correct appraisal receives a score of 1.


    # The Brazilian Learning Approaches Scale (EABAP)


    The Brazilian Learning Approaches Scale (EABAP) is a self-report questionnaire
    composed by 17 items, developed by Gomes and colleagues (Gomes, 2010; Gomes, Golino,
    Pinheiro, Miranda, & Soares, 2011). Nine items were elaborated to measure deep
    learning approaches, and eight items measure surface learning approaches. Each
    item has a statement that refers to a student’s behavior while learning. The student
    considers how much of the behavior described is present in his life, using a Likert-like
    scale ranging from (1) not at all, to (5) entirely present. BLAS represents reliability,
    factorial structure validity, predictive validity and incremental validity as
    good marker of learning approaches. These psychometrical properties are'
