- pgno: 161
  md: '# 136 Soft Computing and Machine Learning with Python


    64.86%. The difference between the two data sets is due to the overfit of the
    tree to the training set.


    The second issue is exactly a consequence of the overfitting, and is known as
    the variance issue. The predictive error in a training set, a set of features
    and outputs used to grow a classification tree for the first time, may be very
    different from the predictive error in a new test set. In the presence of overfitting,
    the errors will present a large variance from the training set to the test set
    used, as shown by the results of Golino and Gomes (2014) . Additionally, the classification
    tree does not have the same predictive accuracy as other classical machine learning
    approaches (James et al., 2013) . In order to prevent overfitting, the variance
    issue and also to increase the prediction accuracy of the classification trees,
    a strategy named ensemble trees can be used.


    The ensemble trees are simply the junction of several models to perform the classification
    task based on the prediction made by every single tree. The most famous ensemble
    algorithm is the Random Forest (Breiman, 2001a), that is used to increase the
    prediction accuracy, decrease the variance between data sets and to avoid overfitting.


    The procedure takes a random subsample of the original data set (with replacement)
    and of the feature space to grow the trees. The number of the selected features
    (variables) is smaller than the number of total elements of the feature space.
    Each tree assigns a single class to each region of the feature space for every
    observation. Then, each class of each region of every tree is recorded and the
    majority vote is taken (Hastie et al., 2009; James et al., 2013). The majority
    vote is simply the most commonly occurring over all trees. As the Random Forest
    does not use the entire observations (only a subsample of it, usually 2/3), the
    remaining observations (known as out-of-bag, or OOB) are used to verify the accuracy
    of the prediction. The out-of-bag error can be computed as a “valid estimate of
    the test error for the bagged model, since the response for each observation is
    predicted using only the trees that were not fitting that observation” (James
    et al., 2013: p. 323).


    As pointed by Breiman (2001a) , the number of selected variables is held constant
    during the entire procedure for growing the forest, and usually is set to square-root
    of the total number of variables. Since the Random Forest subsamples the original
    sample and the predictors, it is considered'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Predicting Academic Achievement of High-School Students Using ... 137


    an improvement over other ensemble trees, as the bootstrap aggregating technique
    (Breiman, 2001b), or simply bagging. Bagging is similar to Random Forest, except
    for the fact that does not subsample the predictors. Thus, bagging creates correlated
    trees (Hastie et al., 2009), which may affect the quality of the prediction. The
    Random Forest algorithm decorrelates the trees grown, and as a consequence it
    also decorrelates the errors made by each tree, yielding a more accurate prediction.


    Why decorrelating the trees is so important? Following the example created by
    James et al. (2013), imagine that we have a strong predictor in our feature space,
    with other moderately strong predictors. In the bagging procedure, the strong
    predictor will be in the top split of most of the trees, since it is the variable
    that best separates the classes available in our data. By consequence, the bagged
    trees will be very similar to each other, making the predictions and the errors
    highly correlated. This may not lead to a decrease in the variance if compared
    to a single tree. The Random Forest, on the other hand, forces each split to consider
    only a subset of the features, opening chances for the variables to do their job.
    The strong predictor will be left out of the bag in a number of situations, making
    the trees very different from each other. Therefore, the resulting trees will
    present less variance in the classification error and the OOB error, leading to
    a more reliable prediction. In sum, the Random Forest is an ensemble of trees
    that improves the prediction accuracy, decreases variance and avoids overfitting
    by using only a subsample of the observations and a subsample of predictors. It
    has two main tuning parameters. The first is the size of the subsample of features
    used which is mandatory to be smaller than the total number of features, and is
    usually set as the square root of the total number of predictors. The second tuning
    parameter is the number of trees to grow (n_rec).


