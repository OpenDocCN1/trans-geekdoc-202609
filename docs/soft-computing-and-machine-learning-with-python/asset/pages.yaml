    Geurts, Irrthum and Wenkel (2009) argue that learning are among the most popular
    algorithms of machine learning due to its interpretability, flexibility and ease
    of use. Interpretability refers to its easiness of understanding. It means that
    the model constructed to map the feature space (predictors) into the output space
    (dependent variable) is easy to understand, since it is a roadmap of if-then rules.
    The description of Figure 1 shows exactly that. James, Witten, Hastie and Shibirani
    (2013) points out that the trees are easier to explain than linear regression,
    since it mirrors more the human decision-making than other predictive models.
    Flexibility means that the tree techniques are applicable to a wide range of problems,
    handles different kind of variables (including nominal, ordinal, interval and
    ratio scales), are non-parametric techniques and does not make any assumption
    regarding normality, linearity or independence(Geurts et al., 2009). Furthermore,
    it is sensible to the addition of additional variables to the model, being especially
    relevant to the study of incremental validity. It assesses which variable or combination
    of them, better predicts a given outcome, as well as calculates cutoff values
    are maximally predictive of it. Finally, the ease of use means that the tree based
    techniques are computationally simple, yet powerful.


    In spite of the qualities of the learning trees, it suffers from two related limitations.
    The first one is known as the overfitting issue. Since the feature space is linked
    to the output space by recursive binary partitions, the tree models can learn
    too much from data, modeling it in such a way that may turn out a sample dependent.
    Being sample dependent model, in the sense that the partitioning is so suitable
    to the data set in hand, it will tend to behave poorly in new data sets.Golino
    and Gomes (2014) showed that in spite of having a total accuracy of 72.50% in
    the training sample, the tree presented in Figure 1 behaved poorly in a testing
    set, with a total accuracy'
