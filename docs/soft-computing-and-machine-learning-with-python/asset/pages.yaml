    # 2. Learning


    The second part to scaling the neighbours is the learning function. The winning
    weight is rewarded with becoming more like the sample vector. The neighbours also
    become more like the sample vector. An attribute of this learning process is that
    the farther the neighbour is from the winning vector, the less it learns. The
    rate at which the amount we can learn decreases and can also be set to whatever
    you want. I chose to use a gaussian function. This function will return a value
    ranging between 0 and 1, where each neighbor is then changed using the parametric
    equation. The new color is:


    Current color*(1.-t) + sample vector*t


    So in the first iteration, the best matching unit will get a t of 1 for its learning
    function, so the weight will then come out of this process with the same exact
    values as the randomly selected sample.'
