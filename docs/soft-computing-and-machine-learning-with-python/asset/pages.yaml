    # Special Methods: Sorting Snail Race Data


    Certain method names have special meaning to Python; each of these special method
    names starts with two underscores, “ ”.


    A class''s constructor method, `__init__()`, is an example of a special method.
    When you use the class''s name as if it were a function, in an expression like
    “SnailRun`(''Judy’, 67.3)”, Python executes the constructor to build the new instance.


    There is a full list of all the Python special method names in the Python quick
    reference. Next we will look at another special method, `__cmp__`, that Python
    calls whenever you compare two instances of that class.


    Going back to our snail-racing application, an instance of the SnailRun class
