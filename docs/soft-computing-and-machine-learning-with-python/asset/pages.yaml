  md: '# Classifying Multigraph Models of Secondary RNA Structure...


    Python, and this algorithm was used to generate the 30 + 118 line graphs of the
    multigraphs of orders 4 and 5. The multigraphs and line graphs were verified by
    the authors via a comparison to the RAG database and by manual inspection and
    reconstruction.


    To calculate the graph-based measures, we used the GraphTheory package in Maple,
    the networkx package in Python, and the network analysis plugin in Cytoscape 2.8.2
    [13]. Many invariants—such as diameter, radius, and clique numbers—were calculated
    in all 3 or 2 of the 3. This allowed us to verify the results of each software
    tool or to identify any variations in the graph invariant and/or topological index
    techniques. Most not all of the measures we used can be found in least one of
    the three tools mentioned above. In order to calculate a number of the measures,
    especially the topological indices, we need to determine the distance matrix of
    the graph. In a simple graph, the distance from a vertex to itself is zero. However,
    with the presence of a loop, we considered three possibilities. One is the standard
    distance matrix with zeros down the diagonal. In the second case, we place either
    a zero or one, depending on whether the vertex has a loop. In the third case,
    we not only modify the diagonal but also if the shortest path includes a vertex
    with a loop, we include the loop in the edge count of edges encountered. Thus
    we were requiring any traversal to a loop to include a loop when encountered.
    We also modified the Balaban index, motivated by recent results using random walks
    on graphs. To find the distance between two vertices u and v in a dual graph,
    observe that if u is a vertex with a loop and if there are two edges between u
    and v, then the following options arise:(i)one of the edges from u to v is traversed;(ii)the
    other edge from u to v is traversed;(iii)the loop is followed by a traversal of
    one of the edges.


    There are four possibilities, so each traversal is assigned an equal weight of
    1/4. The shortest route is the traversal of one edge which can happen in two ways.
    Thus the distance from u to v is 1/2.


    We subsequently calculated approximately 100 invariants and indices of the multigraphs
    and line graphs using the 3 graph theoret software tools mentioned above, with
    slight modifications to account for the presence of loops and multiple edges.
    The invariants were normalized with respect to the values of the graphs that are
    verified as representing a known RNA secondary structure.'
