- pgno: 76
  md: '# Types of Machine Learning Algorithms


    # Advantages grey and Disadvantages of SOM


    Self organise map has the following advantages:


    +   - Probably the best thing about SOMs that they are very easy to understand.
    It''s very simple, if they are close together and there is grey connecting them,
    then they are similar. If there is a black ravine between them, then they are
    different. Unlike Multidimensional Scaling or N-land, people can quickly pick
    up on how to use them in an effective manner.

    - Another great thing is they work very well. As I have shown you classify data
    well and then are easily evaluate for their own quality so you can actually calculated
    how good a map is and how strong the similarities between objects.


    These are the disadvantages:


    +   - One problem with SOMs is getting the right data. Unfortunately you need
    a value for each dimension of each member of samples in order to generate a map.
    Sometimes this simply is not possible and often it is very difficult to acquire
    all of this data so is a limiting feature to the use of SOMs often referred to
    as missing data.

    - Another problem is that every SOM is different and finds different similarities
    among the sample vectors. SOM organize sample data so that in the final product,
    the samples are usually surrounded by similar samples, however similar samples
    are not always near each other. If you have a lot of shades of purple, not always
    will you get one big group with all the purples in that cluster, sometimes the
    clusters will get split and there will be two groups of purple. Using colour we
    can tell that two clusters will look totally unrelated. So a lot of maps needs
    to be constructed in order to get one final good map.

    - The final major problem with SOMs is that they are very computationally expensive
    which is a major drawback since the dimensions of the data increases, dimension
    reduction visualization techniques become more important, but unfortunately then
    the time also increases. For calculating that black and white map, the more neighbours
    you use to calculate the distance the better similarity map you will get, but
    the number of distances the algorithm needs to compute increases exponentially.'
  merge: -1
  img_proc: true
