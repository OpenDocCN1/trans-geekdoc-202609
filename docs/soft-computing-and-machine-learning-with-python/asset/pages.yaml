    as a script or included as part of a larger application.


    PEBL can handle missing values and hidden variables using exact marginalization
    and Gibbs sampling (Heckman, 1998). The Gibbs sampler can be resumed from a previously
    suspended state, allowing for interactive inspection of preliminary results or
    a manual strategy for determining satisfactory convergence.


    A key strength of Bayesian analysis is the ability to use prior knowledge. PEBL
    supports structural priors over edges specified as ''hard'' constraints or ''soft''
    energy matrices (Imoto et al., 2003) and arbitrary constraints specified as Python
    functions or lambda expressions.


    PEBL includes greedy hill-climbing and simulated annealing learners and makes
    writing custom learners easy. Efficient implementation eliminates redundant computation.
    PEBL provides components to alter, score and rollback changes to BNs in a simple,
    transactional manner and with these, efficient learners look remarkably similar
    to pseudocode.


    # Convenience and Scalability


    PEBL includes both a library and a command line application. It aims for a balance
    between ease of use, extensibility and performance. The majority of PEBL is written
    in Python, a dynamically-typed programming language that runs on all major operating
    systems. Critical sections use the numpy library'
