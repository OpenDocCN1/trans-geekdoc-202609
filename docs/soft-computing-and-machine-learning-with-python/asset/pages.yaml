    There is no reason to believe that human learning methods are the only possible
    mean of acquiring knowledge and skills. In fact, common sense suggests that human
    learning represents just one point in an uncharted space of possible learning
    methods- a point that the evolutionary process is particularly well suited to
    cope with the general physical environment in which we exist. Most theoretical
    work in machine learning is centred on creation, characterization and analysis
    of general learning methods, with the major emphasis on analyzing generality and
    performance rather than psychological plausibility.


    Whereas theoretical analysis provides a means of exploring the space of possible
