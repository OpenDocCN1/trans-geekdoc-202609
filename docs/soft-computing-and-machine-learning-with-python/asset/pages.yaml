- pgno: 281
  md: "# INTRODUCTION\n\nIn recent years there has been a wealth of research in methods\
    \ for learning structured prediction, as well as in their application in areas\
    \ such as natural language processing and computer vision. Unfortunately few implementations\
    \ are publicly available—many applications are based on the non-free implementation\
    \ of Joachims et al. (2009).\n\nPyStruct aims at providing a high-quality implementation\
    \ with an easy-to-use interface, in the high-level Python language. This allows\
    \ practitioners to efficiently test a range of models, as well as allowing researchers\
    \ to compare to baseline methods more easily than is possible with current implementations.\
    \ PyStruct is BSD-licensed, allowing modification and redistribution of the code,\
    \ as well as use in commercial applications. By embracing paradigms established\
    \ in the scientific Python community and reusing the interface of the widely-used\
    \ scikit-library (Pedregosa et al., 2011), PyStruct can be used in existing projects,\
    \ replacing standard classifiers. The online documentation and examples help new\
    \ users understand the somewhat abstract behind structured prediction.\n\n# STRUCTURED\
    \ PREDICTION AND CASTING INTO SOFTWARE\n\nStructured prediction can be defined\
    \ as making a prediction f(x) by maximizing a compatibility function between an\
    \ input x and the possible labels y (Nowozin and Lampert, 2011). Most current\
    \ approaches use linear labels, leading to:\n\n```\n$f(x) = \\arg \\max_{y \\\
    in Y} \\theta^T \\Psi(x, y).\n(1)\n```\n\nHere, y is a structured label, $\\Psi$\
    \ is a joint feature function of x and y, and $\theta$ are parameters of the model.\
    \ Structured means that y is more complicated than a single output label, for\
    \ example a word in a sentence or a label for each pixel in an image. Learning\
    \ structured prediction means learning the parameters $\theta$ from training data.\n\
    \nUsing the above formulation, learning can be broken down into three sub-problems:\n\
    \n+   1. Optimizing the objective with respect to $\theta$.\n2. Encoding the structure\
    \ of the problem in a joint feature function $\\Psi$."
  merge: -1
  img_proc: true
- pgno: 282
  md: '# PyStruct- Learning Structured Prediction in Python 257


    3. Solving the maximization problem in Equation 1.


    The later two problems are usually tightly coupled, the maximization in Equation
    1 is usually feasible by exploiting the structure of Ψ, while the first is treated
    as independent. In fact, when 3. not be done exactly, learning θ strongly depends
    on the quality of the approximation. However, treating approximate inference and
    learning as a joint optimization problem is currently out of the scope of the
    package, and we implement a more modular setup. PyStruct takes an object-oriented
    approach to decouple the task-dependent implementation of 2, and 3. from the general
    algorithms used to 1.


    Estimating θ is done in learner classes, which currently support cutting plane
    algorithms for structural support vector machines (SVMs et. (2009)), subgradient
    methods for SVMs Rattriff et al. (2007), BlockcoordinateFrank-Wolfe (BCFW) (LacosteJulien
    et al., 2012), the structured perceptron and latent variable SVMs (Yu and Joachim,
    2009). The cutting plane implementation uses the cvopt package (Andersen et al.,
    2012) for quadratic optimization. Encoding the structure of the problem is done
    using model classes, which compute Ψ and encode the structure of the problem.
    The structure of Ψ determines the hardness of the maximization in Equation (1)
    and is a crucial factor for learning. PyStruct implements models (corresponding
    to particular forms of Ψ) for many cases, such as multi-class and multi-label
    classification, conditional random fields with constant or data-dependent pairwise
    potentials, and several latent variable models. The maximization for y in Equation
    1 is carried out using external libraries, such as OpenGM (Kappes et al., 2013),
    LibDAI (Mooij, 2010) and others. This allows the user to choose from a wide range
    of optimization algorithms, including (loopy) belief propagation, graph-cuts,
    QPBO, dual subgradient, TRWs, and many other algorithms. For problems where exact
    inference is infeasible, PyStruct allows the use of linear programming relaxations,
    and provides modified loss and feature functions to work with the continuous labels.
    This approach, which was outlined in Finley and Joachim (2008) allows for principled
    learning when exact inference is intractable. When using approximate integral
    solvers, learning may finish prematurely and results in this case depend on the
    inference scheme and learning algorithm used.


    Table 1 lists algorithms and models that are implemented in PyStruct and compares
    them to other public structured prediction libraries: Dlib (King, 2009), SVMstruct
    (Joachims et al., 2009) and CRFsuite (Okazaki, 2007). We also give the programming
    language and the project license.'
