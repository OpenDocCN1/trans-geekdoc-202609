  md: '# PACKAGE OVERVIEW


    PATTERN is organized in separate modules that can be chained together, as shown
    in Figure 1. For example, text from Wikipedia (pattern.web) can be parsed for
    part-of-speech tags (pattern.en), queried by syntax and semantics (pattern.search),
    and used to train a classifier (pattern.vector).


    pattern.web Tools for web mining, using a download mechanism that supports caching,
    proxies, asynchronous requests and redirection. A SearchEngine class provides
    a uniform API to multiple web services: Google, Bing, Yahoo!, Twitter, Wikipedia,
    Flickr and news feeds using FEED PARSER (packages.python.org/parser). The module
    includes an HTML parser based on BEAUTIFUL SOUP (crummy.com/software/beautifulsoup),
    a PDF parser based on PDFMINER (unixuser.org/eusse/python/pdmfiner), a web crawler,
    and a webmail interface.


    pattern.en Regular expressions-based shallow parser for English (identifies constituents,
    e.g., nouns, verbs) using a finite state part-of-speech tagger (Brill, 1992) extended
    with a tokenizer, lemmatizer and chunker. Accuracy for Brill''s tagger is 95%
    and a parser with higher accuracy (MBSP) can be plugged in. The module has a Sentence
    class for parse tree traversals, functions for singularization/pluralization (Conway,
    1998), conjugation, modality and sentiment analysis. It comes bundled with WORDNET3
    (Fellbaum, 1998) and PYWORDNET.


    pattern.nl Lightweight implementation of pattern.en for Dutch, using the BRILL-NL
    language model (Geertzen, 2010). Contributors are encouraged to read the developer
    documentation on how to support for other languages.


    pattern.search N-gram pattern matching for Sentence objects. The algorithm uses
    an approach similar to regular expressions. Search queries can include a mixture
    of words, phrases, part-of-speech-tags, taxonomy terms (e.g., pet = dog, cat or
    goldfish) and control characters (e.g., + = multiple, * = any, () = optional)
    to extract relevant information.


    pattern.vector Vector space model using a Document and a Corpus class. Documents
    are lemmatized bag-of-words that can be grouped in a sparse corpus to compute
    TF-IDF, distance metrics (cosine, Euclidean, Manhattan, Hamming) and dimension
    reduction (Latent Semantic Analysis). The module includes a hierarchical and k-means
    clustering algorithm, optimized with the kmeans++ initialization algorithm (Arthur
    and Vassilvitskii, 2007) and triangle inequality (Elkan, 2003). A Naive Bayes,
    a k-NN, and a SVM classifier using LIBSVM (Chang and Li, 2011) are included, with
    tools for'
