    and in commercial distributions such as the “Enthought Python Distribution”.


    # PROJECT VISION


    **Code quality:** Rather than providing as many features as possible, the project’s
    goal has to provide solid implementations. Code quality is ensured with unit tests—as
    of release 0.8, test coverage is 81%—and the use of static analysis tools for
    functions and parameters as pylakes and pep8. We finally strive to ensure consistent
    naming for the functions and parameters throughout a strict adherence to the Python
    coding guidelines and numpy style documentation.


    **BSD licensing:** Most of the Python ecosystem is licensed with non-copyleft
    licenses. While such policy is beneficial for adoption of these tools by commercial
    projects, it does impose some restrictions: we are unable to use some scientific
    code, such as the GSL.


    **Bare-bone design and API:** To lower the barrier of entry, we avoid framework
    code and keep the number of different objects to a minimum, relying on numpy arrays
    for data containers.


    **Community-driven development:** We base our development on collaborative tools
    such as git, github and public mailing lists. External contributions are welcome
    and encouraged.


    **Documentation:** Scikit-learn provides a ~300 page guide including narrative
    documentation, class references, a tutorial, installation instructions, as well
    as more than 60 examples, some featuring real-world applications. We try to minimize
    the use of machine-learning jargon, while maintaining precision with regards to
    the algorithms employed.


    # UNDERLYING TECHNOLOGIES


    **Numpy:** the base data structure used for data and model parameters. Input data
    is presented as numpy arrays, thus integrating seamlessly with other'
