  md: '# Types of Machine Learning Algorithms 41


    decisions modified by the inclusion of a loss matrix (Bishop C. M., 1995). Often,
    the best approach is to ensure even representation of different cases, then to
    interpret the network’s decisions accordingly.


    # Self Organised Map


    Self Organizing Feature Map (SOFM, or Kohonen) networks are used quite differently
    to the other networks. Whereas all the other networks are designed for supervised
    learning tasks, SOFM networks are designed primarily for unsupervised learning
    (Haykin, 1999), (Patterson, 1996), (Fausett, 1994) (Whereas in supervised learning
    the training data set contains cases featuring input variables together with the
    associated outputs (and the network must infer a mapping from the inputs to the
    outputs), in unsupervised learning the training data set contains only input variables.
    At first glance this may seem strange. Without outputs, what can the network learn?
    The answer is that the SOFM network attempts to learn the structure of the data.


    Also Kohonen (Kohonen, 1997) explained one use is therefore in exploratory data
    analysis. The SOFM network can learn to recognize clusters of data, and can also
    relate similar clusters to each other. The user can build up an understanding
    of the data, which is used to refine the network. As classes of data are recognized,
    they can be labelled, so that the network becomes capable of classification tasks.
    SOFM networks can also be used for classification when output classes are immediately
    available - the advantage in this case is their ability to highlight similarities
    between classes.


    A second possible use is in novelty detection. SOFM networks can learn to recognize
    clusters in the training data, and respond to it. If new data, unlike previous
    cases, is encountered, the network fails to recognize it and this indicates novelty.


    A SOFM network has only two layers: the input layer, and an output layer of radial
    units (also known as the topological map layer). The units in the topological
    map layer are laid out in space - typically in two dimensions (although ST Neural
    Networks also supports ondimensional Kohonen networks).


    SOFM networks (Patterson, 1996) are trained using an iterative algorithm. Starting
    with an initially-random set of radial centres, the algorithm gradually adjusts
    to reflect the clustering of the training data. At one level, this compares with
    the sub-sampling and KMeans algorithms to assign centres in SOM network and indeed
    the SOFM algorithm'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Soft Computing and Machine Learning with Python


    can be used to assign centres for these types of networks. However, the algorithm
    also acts on a different level.


    The iterative training procedure also arranges the network so that units representing
    centres close together in the input space are also situated together on the topological
    map. You can think of the network''s topological layer as a crude two-dimensional
    grid, which might be folded and distorted into the N-dimensional input space,
    so as to preserve as far as possible the original structure. Clearly any attempt
    to represent an N-dimensional space in two dimensions will result in loss of detail;
    however, the technique can be worthwhile in allowing the user to visualize data
    which might otherwise be impossible to understand.


    The basic iterative Kohonen algorithm simply runs through a number of epochs,
    each epoch executing each training case and applying the following algorithm:


    +   * Select the winning neuron (the one who''s centre is nearest to the input
    case);

    * Adjust the winning neuron to be more like the input case (a weighted sum of
    the old neuron centre and the training case).


    The algorithm uses a time-decaying learning rate, which is used to perform the
    weighted sum and ensures that the alterations become more subtle as the epochs
    pass. This ensures that the centres settle down to a compromise representation
    of the cases which cause neuron to win. The topological ordering property is achieved
    by the concept of a neighbourhood to the algorithm. The neighbourhood is a set
    of neurons surrounding the winning neuron. The neighbourhood, like the learning
    rate, decays over time, so that initially quite a large number of neurons belong
    to the neighbourhood (almost the entire topological map); in the later stages
    the neighbourhood will be zero (i.e., consists solely of the winning neuron itself).
    In the Kohonen algorithm, the adjustment of neurons is actually applied not just
    to the winning neuron, but to all the members of the current neighbourhood.


    The effect of this neighbourhood update is that initially large areas of the network
    are “dragged towards” training cases - and dragged quite substantially. The network
    develops a crude topological ordering, with similar cases activating clumps of
    neurons in the topological map. as epochs pass the learning rate and neighbourhood
    both decrease, so that finer distinctions within areas of the map can be drawn,
    ultimately resulting in finetuning of individual neurons. Often, training is deliberately
    conducted'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Types of Machine Learning Algorithms


    in two distinct phases: a relatively short phase with high learning rates and
    neighbourhood, and a long phase with low learning rate and zero or near-zero neighbourhoods.


    Once the network has been trained to recognize structure in the data, the Win
    Frequencies Datasheet (counts of the number of times each neuron wins when training
    cases are executed) can be used as a visualization tool to examine the data. Win
    can see if distinct clusters have formed on the map. Individual cases are executed
    and the topological map observed, to see if some cases may be assigned to the
    clusters (this usually involves referring back to the original application area,
    so that the relationship between clustered cases can be established). Once clusters
    are identified, neurons in the topological map are labelled to indicate their
    meaning (sometimes individual cases may be labelled, too). Once the topological
    map has been built up in this way, new cases can be submitted to the network.
    If the winning neuron has been labelled with a class name, the network can perform
    classification. If not, the network is regarded as undecided.


    SOFM networks also make use of the accept threshold, when performing classification.
    Since the activation level of a neuron in a SOFM network is the distance of the
    neuron from the input case, the accept threshold acts as a maximum recognized
    distance. If the activation of the winning neuron is greater than this distance,
    the SOFM is regarded as undecided. Thus, by labelling all neurons and setting
    the accept threshold appropriately, a SOFM network can act as a novelty detector
    (it reports undecided only if the input case is sufficiently dissimilar to all
    radial units).


    SOFM networks expressed as Kohonen (Kohonen, 1997) are inspired by some known
    properties of the brain. The cerebral cortex is actually a large flat sheet (about
    0.5m squared; it is folded up into the familiar shape for convenience in fitting
    into the skull!) with known topological properties (for example, the area corresponding
    to the hand is next to the arm, and a distorted human frame can be topologically
    mapped out in two dimensions on its surface).


