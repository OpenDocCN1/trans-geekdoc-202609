    # Knowledge Acquisition


    When approaching a task-oriented knowledge acquisition task, one must be aware
    that, the resultant computer system must interact with humans, and therefore should
    closely parallel human abilities. The traditional argument that an engineering
    approach need not reflect human or biological performance is not, truly applicable
    to machine learning. Since airplane, a successful result on an almost pure engineering
    approach, better little resemblance to their biological counterparts, one may
    argue that applied knowledge acquisition systems could be divided from any consideration
    of human capabilities. This argument does not apply here because airplanes need
    not interact, with or understand learning machines, on the other hand, will have
    to interact, with the people who make use of them, and consequently the concept
    and skills they acquire- if not necessarily their internal mechanism and must
    be understandable to human.


    # Machine Learning as a Science


    The clear contender for the cognitive invariant in human is the learning mechanism
    which is the ability facts, skills and more abstractive concepts. Therefore understanding
    human learning well enough to reproduce aspect of that learning behaviour in a
    computer system is, in itself, a worthy scientific goal. Moreover, the computer
    can render substantial assistance to cognitive psychology, in that it may be used
    to test the consistency and completeness of learning theories and enforce a commitment
    to the fine-structure processlevel that precludes meaningless tautological or
    untestable theories (Bishop, 2006).


    The study of human learning processes is also of considerable significance. Gain
    insights into the principles underlying human learning abilities is likely to
    lead to more effective educational techniques. Machine learning research is all
    about developing intelligent computer assistant or a computer tutoring systems
    and many of these goals are shared within the machine learning fields. According
    to Jaime et al (Jaime G. Carbonell, 1983) who stated computer tutoring is starting
    to incorporate abilities to infer models of student competence from observed performance.
