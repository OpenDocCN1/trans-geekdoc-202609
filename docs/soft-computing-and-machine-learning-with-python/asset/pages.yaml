    # CONCLUSION


    The most reasonable conclusion of this extensive analysis is that all the graphs
    of order 5 are likely to be verified as RNA structures. Indeed, across several
    variations of nearest neighbor analysis, machine learning, and clustering techniques
    using a variety of subsets of different graph invariants and topological indices,
    we consistently found that more than 90% of the unclassified graphs were closer
    to one of the 18 already verified as a RNA structure than the 18 were to each
    other.


    This result is not surprising. Initial classification of the graph structures
    in the database RAG classified more than half of the dual graphs of order 4 as
    not RNA-like in structure. However, as secondary RNA structures were identified,
    an update to the RAG database now predicts only a third to be not RNA-like in
    structure [9]. We predict that as the number of motifs continues to increase,
    eventually almost all structures will be classified as RNA-like or verified as
    an RNA topology. This means that the graph model in the database is too coarse
    to be of value and therefore should not be pursued as a model to characterize
    secondary RNA structure? No, not at all. It does suggest however that the model
    needs to contain more information in order to be discriminating. One way this
    can be achieved by assigning weights to the vertices and edges based on the number
    of nucleotides, bases, and bonds in the respective stems and regions with unpaired
    bases. Karlin et al. [17] developed a labeled dual graph representation and defined
    a similarity measure using marginalized kernels. Using this measure they train
    support vector machine classifiers to identify known families of'
  merge: -1
  img_proc: true
- pgno: 372
  md: RNAs from random RNAs with similar statistics. They achieved better than seventy
    percent accuracy using these biologically relevant vertex and edge labels. Efforts
    to synthesize RNA molecules for various purposes such as novel drug applications
    as well as efforts to develop efficient genomwide screens for RNA molecules from
    existing families may be aided by the graph representation in the RAG database
    when coupled with vertex and edge weighting schemes. Indeed, the authors have
    successfully used vertex weighted graphs to characterize the residue structure
    of amino acids in order to build a predictive model of binding affinity levels
    resulting from single point mutations [18]. Future work naturally points to using
    vertex weighted graphs for the characterization of a secondary RNA structure.
    Information revealed by the labeled dual graph representation which shows that
    a secondary RNA structure is not consistent with those known to be found in nature
    can be considered a valuable resource for biotechnological applications, automated
    discovery of uncharacterized RNA molecules, and computationally efficient algorithms
    that can be used in conjunction with other methods for RNA structure identification.
