    | tuple | Any values | (23, "Ruth", 69.8) (44,) | No |


    str and unicode are used to hold text, that is, strings of characters.


    +   - list and tuple are used for sequences of zero or more values of any type.
    Use a list if the contents of the sequence may change; use a tuple if the contents
    will not change, and in certain places where tuples are required. For example,
    the right-hand argument of the string format operator (see Section 3.4, "The string
    format method") must be a tuple if you are formatting more than one value.

