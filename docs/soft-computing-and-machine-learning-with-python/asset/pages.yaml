    # # INTRODUCTION


    Machine learning is a subfield of computer science. It allows computers to build
    analytical models of data and find hidden insights automatically, without being
    unequivocally coded. It has been applied to a variety of aspects in modern society,
    ranging from DNA sequences classification, credit card fraud detection, robot
    locomotion, to natural language processing. It can be used to solve many types
    of tasks such as classification. Bankrupt prediction is a typical example of classification
    problems.


    Machine learning was born from pattern recognition. Earlier works of the same
    topic (machine learning in bankruptcy) use models including logistic regression,
    regression algorithm, and inductive learning.


    Logistic regression is a statistical method allowing researchers to build predictive
