    # PLATFORM ARCHITECTURE


    This platform generates one dataset to classify fragments of binary code (individuals
    or rows in the dataset) by considering the occurrence of a finite set of binary
    patterns (features or columns in the dataset). All the individuals and patterns
    (features) are obtained from a collection of binary programs, which are processed
    by the platform.


    In our motivating example, the individuals in the dataset are functions; and the
    features are the generalized assembly code patterns extracted by'
