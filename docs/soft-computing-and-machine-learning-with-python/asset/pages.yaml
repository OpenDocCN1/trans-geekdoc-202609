    # ABSTRACT


    Scikit-learn is a Python module integrating a wide range of state-of-the-art machine
    learning algorithms for medium-scale supervised and unsupervised problems. This
    package focuses on bringing machine learning to non-specialists using a general-purpose
    high-level language. Emphasis is put on ease of use, performance, documentation,
    and API consistency. It has minimal dependencies and is distributed under the
    simplified BSD license, encouraging its use in both academic and commercial settings.
    Source code, binaries, and documentation can be downloaded from http://scikit-learn.sourceforge.net.


    **Keywords:** Python, supervised learning, unsupervised learning, model selection


    # INTRODUCTION


    The Python programming language is establishing itself as one of the most popular
    languages for scientific computing. Thanks to its high-level interactive nature
    and its maturing ecosystem of scientific libraries, it is an appealing choice
    for algorithmic development and exploratory data analysis (Dubois, 2007; Milmann
    and Avizais, 2011). Yet, as a general-purpose language, it is increasingly used
    not only in academic settings but also in industry.


    Scikit-learn harnesses this rich environment to provide state-of-the-art implementations
    of many well known machine learning algorithms, while maintaining an easy-to-use
    interface tightly integrated with the Python language. This answers the growing
    need for statistical data analysis by non-specialists in the software and web
    industries, as well as in fields of computer-science, such as biology or physics.
    Scikit-learn differs from other machine learning toolboxes for various reasons:
    i it is distributed under the BSD license ii it compiles code for efficiency,
    unlike MDP (Zito et al., 2008) and pybrain (Schaul et al., 2010), iii it depends
    only on numpy and scipy to facilitate easy distribution, unlike pymvpva (Hanke
    et al., 2009) that has optional dependencies such as R and shogun, and iv) it
    focuses on imperative programming, unlike pybrain which uses a data-flow'
  merge: -1
  img_proc: true
