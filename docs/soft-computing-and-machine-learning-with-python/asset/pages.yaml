- pgno: 187
  md: 'In this diagram, the value appearing on the right shows its type, int (integer),
    and the value, 5100.


    In Python, values have types, but names are not associated with any type. A name
    can be bound to a value of any type at any time. So, a Python name is like a luggage
    tag: it identifies a value, and lets you retrieve it later.


    Here is another assignment statement, and a diagram showing how the global namespace
    appears after the statement is executed.

    >>> j = foo = i + 1


    ![](img/e1ab17402154bec3fa9a7873fe3ee232_187_0.png)


    The expression “i + 1” is equivalent to “5100 + 1”, since variable i is bound
    to the integer 5100. This expression reduces to the integer value 5101, and then
    the names j and foo are both bound to that value. You might think of this situation
    as being like one piece of baggage with two tags tied to it. Let’s examine the
    global namespace after the execution of this assignment statement:

    >>> foo = foo + 1


    ![](img/e1ab17402154bec3fa9a7873fe3ee232_187_1.png)


    Because foo starts out bound to the integer value 5101, the expression “foo +
    1” simplifies to the value 5102. Obviously, foo = foo + 1 doesn’t make sense in
    algebra! However, it is a common way for programmers to add one to a value.


    Note that name j is still bound to its old value, 5101.'
