- pgno: 185
  md: '# The Assignment Statement


    So far we have worked with numeric constants and operators. You can attach a name
    to a value, and that value will stay around for the rest of your conversational
    Python session.


    Python names must start with a letter or the underbar (_) character; the rest
    of the name may consist of letters, underbars, or digits. Names are case-sensitive:
    the name Count is a different name than count.


    For example, suppose you wanted to answer the question, "how many days is a million
    seconds?" We can start by attaching the name to a value of a million:


    ```

    >>> sec = 1e6

    >>> sec

    1000000.0

    ```


    A statement of this type is called an assignment statement. To compute the number
    of minutes in a million seconds, we divide by 60. To convert minutes to hours,
    we divide by 60. To convert hours to days, divide by 24, and that is the final
    answer.


    ```

    >>> minutes = sec / 60.0

    >>> minutes

    16666.6666666666668

    >>> hours=minutes/60

    >>> hours

    277.7777777777777

    >>> days=hours/24.

    >>> days

    11.574074074074074

    >>> print days, hours, minutes, sec

    ```'
