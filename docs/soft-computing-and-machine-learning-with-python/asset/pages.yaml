    # Extra Keyword Arguments


    You can declare your function in such a way that it can accept any number of keyword
    parameters, in addition to any keyword arguments you declare.


    To do this, place an argument of the form “**name” last in your argument list.


    When the function is called, that name is bound to a dictionary that contains
    any keyword-type parameters that are passed in that have names that don''t match
    your function’s keyword-type arguments. In that dictionary, the keys are the names
    used by the caller, and the values are the values that the caller passed.


    Here’s an example.


    ```

    >>> def k(p0, p1, nickname=''Noman'', *extras, **extraKeys):

    ... print p0, p1, nickname, extras, extraKeys

