  md: '# An Efficient Platform for the Automatic Extraction of Patterns in ... 285


    the platform. The classification variable (target) is the return type (we consider
    all the C built-in types; for compound types (structs, unions, pointers, and arrays),
    we only consider the type constructor, e.g., int* and char** are classified as
    pointers) of each function (individual). The generated dataset may be used later
    to build a machine learning model that classifies the return type depending on
    the patterns found in the binary code.


    The platform has two working modes. The most versatile is the one shown in Figure
    1. The system receives the high-level source program that will be used to generate
    the binary application. In this mode, the platform allows instrumenting the high-level
    program and use the debug information produced by the compiler. When the high-level
    program is not available, we provide another configuration to process binary files,
    described in Section 3.6.


    ![](img/e1ab17402154bec3fa9a7873fe3ee232_310_0.png)


    Figure 1: Platform architecture, receiving high-level code.


    # Instrumentor


    This module allows code instrumentation of the high-level input program. The objective
    is to add information to the input program, so that it will be easier to find
    the patterns in the corresponding binary code generated by the compiler. It can
    also be used to delineate those sections of the generated binary code we want
    to extract patterns from (Section 3.2), ignoring the rest of the program. Notice
    that once the machine learning model has been trained with the dataset generated
    by the platform, the binary files passed to the model will not include that instrumented
    code. Therefore, the instrumentation module should not be used to extract patterns
    that cannot be later recognized from stripped binaries.'
