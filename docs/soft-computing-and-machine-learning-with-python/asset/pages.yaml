  md: '# Scikit-learn: Machine Learning in Python 275


    The important object is the cross-validation iterator, which provides pairs of
    train and test indices to split input data, for example K-fold, leave one out,
    stratified cross-validation.


    **Model selection:** Scikit-learn can evaluate an estimator’s performance or select
    parameters using cross-validation, optionally distributing the computation to
    several cores. This is accomplished by wrapping an estimator in a GridSearchCV
    object, where the “CV” stands for “cross-validated”. During the call to fit, it
    selects the parameters on a specified grid, maximizing a score (the score method
    of the underlying estimator). predict, score, or transform are then delegated
    to the tuned estimator. This object can therefore be used transparently as any
    other estimator. Cross validation may be more efficient for certain estimators
    by exploiting specific properties, such as warm restarts or regularization paths
    (Friedman et al., 2010). This is supported through special objects, such as the
    Lasso. Finally, a Pipeline object can combine several transformers and an estimator
    to create a better estimator to, for example, apply dimension reduction before
    fitting. It behaves as a standard estimator, and GridSearchCV therefore tunes
    the parameters of all steps.


    # HIGH-LEVEL YET EFFICIENT: SOME TRADEoffs


    While scikit-learn focuses on ease of use, and is mostly written in a high level
    language, has been taken to maximize computational efficiency. In Table 1, we
    compare computation time for a few algorithms implemented in the major machine
    learning toolkits accessible in Python. We use the Madelon data set (Guyon et
    al., 2004), 4400 instances and 500 attributes, The data set is large, but small
    enough for most algorithms to run.


    **SVM:** While all of the packages compared libsvm in the background, the performance
    of scikitlearn can be explained by two factors. First, our bindings avoid memory
    copies and have up to 40% less overhead than the original libsvm Python bindings.
    Second, we patch libsvm to improve efficiency on dense data, use a smaller memory
    footprint, and use better memory alignment and pipeling capabilities of modern
    processors. This patched version also provides unique features, such as setting
    weights for individual samples.


    **LARS:** Iteratively refining the residuals instead of recomputing them gives
    performance gains of 2–10 times over the reference R implementation'
