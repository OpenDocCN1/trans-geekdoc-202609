    # GRAPH-THEORETIC MEASURES FOR THE DUAL GRAPHS


    As stated previously, the dual graph representation method of the RAG database
    results in a multigraph. We began by writing a program in the computer language
    Python which generates 30 multigraphs of order 4 and the 118 multigraphs of order
    5. This program realized colorless graphs using networkx [12] multiple structures
    and then generated edges in accordance with the secondary RNA structural constraints.
    Several algorithms to calculate topological indices and graph invariants were
    also written in Python based on the networkx graph object.


    In order to draw upon the wealth of graph-theoretic measures to quantify the topologies
    of the RNA model, we note that the majority of such measures is defined for simple
    graphs, and simple graphs do not have multiple edges nor do they have loops. Given
    that the dual graph representation has, we therefore determined the line graph
    of each of the dual graphs and we use the line graph representation to determine
    the graphical measures of the topologies such as the clique number (both edge
    and vertex), independence number, and diameter and domination numbers. The line
    graph of a graph G is defined as the graph whose vertex set is the edge set of
    G and two vertices are adjacent in the line graph if the corresponding edges in
    G are incident. Thus the vertices in the line graph correspond to the regions
    in the RNA molecule with unpaired bases. Using the line graph allows quantification
    of the structural properties of the RNA molecule with graph-theoretic descriptors,
    even those containing pseudoknots. An algorithm for generating the line graph
    of a multigraph was also written in'
