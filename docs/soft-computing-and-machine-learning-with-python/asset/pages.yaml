    # INTRODUCTION


    In many contexts like in a new e-commerce website, fraud experts start investigation
    procedures only after a user makes a claim. Rather than working reactively, it
    would be better for the fraud expert to act proactively before a fraud takes place.
    In this e-commerce example, we are interested in classifying sellers into local
    customers or fraudsters. If a seller is involved in a fraudulent transaction,
    his/her license to sell can be revoked by the e-business. Such a decision requires
    a degree of certainty, which comes with experience. In general, it is only after
    a fraud detection expert has dealt with enough complains and enough data that
    he/she acquired a global understanding of the fraud problem. Quite often, he/she
    is exposed to a high number of cases in a short period of time. This is when automatic
    procedures, commonly computer based, can step in time to reproduce expert procedures
    thus giving experts more time to build a model for fraud. Such a model requires
    fraud evidences that are commonly present in fraudulent behavior. One of the difficulties
    of fraud detection is that fraudsters try to conceal themselves under a “normal”
    behavior. Moreover, fraudsters rapidly change their modus operandi once it is
    discovered. Many fraud evidences are illegal and just a more drastic measure after
    discovered. However, a single observed indicator is not strong enough to be considered
    a proof and needs to be evaluated as one variable among others. All variables
    taken together can indicate high probability of fraud. Many times, these variables
    appear in the literature by the name of characteristics or features. The design
    of characteristics to be used in a model is called characteristics extraction
    or feature extraction.


    # DATA PREPARATION


    # Characteristics Extraction


    One of the most important tasks on data preparation is the conception of characteristics.
    Unfortunately, this depends very much on the application (See also the discussions
    in Section 4 and 5). For fraud modelling for instance, one starts from fraud expert
    experience, determine significant'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Data Mining with Skewed Data 59


    characteristics as fraud indicators, and evaluates them. In this evaluation, one
    is interested in measuring how well these characteristics:


    +   - covers (is present in) the true fraud cases;

    - and how clearly they discriminate fraud from non-fraud behavior.


    In order to cover as many fraud cases as possible, one may verify how many of
    them are covered by the characteristics set. The discrimination power of any of
    these characteristics can be evaluated by their odds ratio. If the probability
    of the event (new characteristics) in each of two compared classes (fraud and
    non-fraud in our case) are $p_f$ (first class) and $p_n$ (second class), then
    the odds ratio is


    ```

    $OR = \frac{p_f/(1-p_f)}{p_n/(1-p_n)} = \frac{p_f(1-p_n)}{p_n(1-p_f)}$

    ```


    An odds ratio equal to 1 describes the characteristics as equally probable in
    both classes (fraud and non-fraud). The more this ratio is greater/less than 1,
    the more likely this characteristic is in the first/second class than in the other
    one.


    # Data Cleansing


    In many manuals on best practice in model development, a chapter on data consistency
    checks, or data cleansing, is present. The main reason for this is to avoid wasting
    the effort applied in the model development stage, because of data inconsistency
    invalidating the dataset in use.


    Here we understand data consistency checks as being a set of expert rules to which
    expert rules can be based on expert knowledge or common sense. For example, a
    common error when filling the date-of-birth section in a credit card application
    form is to put the current year instead of the year the person was actually born.
    In many countries under sixteen years old can not have a credit card. Therefore,
    an easy way of checking this inconsistency is to simply calculate the applicant''s
    age and if it falls within a valid range. With more information available, more
    complex checks can be applied, such as, e.g. matching name with gender or street
    name with post code. In some cases the model developer has access to reports stored
    in Management Information Systems (MIS). If that is the case, it is a highly recommended
    idea to calculate key population indicators and compare these to portfolio'
  merge: -1
  img_proc: true
