  md: '# Operations on Dictionaries


    The idea is that you store values in a dictionary associated with some key, so
    that later you can use that key to retrieve the associated value.


    The general form used to create a new dictionary in Python looks like this: $\{k_j:
    v_j, k_l: v_l, ...\}$


    To retrieve the value associated with key $k$ from dictionary $d$, use an expression
    of this form: $d[k]$


    Here are some conversational examples:


    ```

    >>> numberNames = {0:''zero'', 1:''one'', 10:''ten'', 5:''five''}

    >>> numberNames[10]

    ''ten''

    >>> numberNames[0]

    ''zero''

    >>> numberNames[999]

    Traceback (most recent call last):

    File "<stdin>", line 1, in =

    KeyError: 999

    ```


    Note that when you try to retrieve the value for which no key exists in the dictionary,
    Python raises a KeyError exception.


    To add or replace the value for a key $k$ in dictionary $d$, use an assignment
    statement of this form: $d[k] = v$


    ```

    >>> numberNames[2] = "two"

    >>> numberNames[2]

    ''two''

    >>> numberNames

    {0:''zero'', 1:''one'', 10:''ten'', 2:''two'', 5:''five''}

    ```'
