  md: '# Soft Computing and Machine Learning with Python


    the gradient vector of the error surface is calculated. This vector points along
    the line of steepest descent from the current point, so we know that if we move
    it along a “short” distance, we will decrease the error. A sequence of such moves
    (slowing as we near the bottom) will eventually find a minimum of some sort. The
    difficult part is to decide how large the steps should be.


    Large steps may converge more quickly, but may also overstep the solution (if
    the error surface is very eccentric) go off in the wrong direction. A classic
    example of this in neural network training is when the algorithm progresses very
    slowly along a steep, narrow, bouncing from one side to the other. In contrast,
    small steps may go in the correct direction, but they also require a larger number
    of iterations. In practice, the step size is proportional to the slope (so that
    the algorithm settles down in a minimum) and to a special constant: the learning
    rate. The correct setting for the learning rate is application-dependent, and
    is typically chosen by experiment; it may also be time-varying, getting smaller
    as the algorithm progresses.


    The algorithm is also modified by inclusion of a momentum: this encourages movement
    in a fixed direction, so that if several steps are taken in the same direction,
    the algorithm “picks up speed”, which gives it the ability to (sometimes) escape
    local minimum, and also to move rapidly over flat spots and plateaus.


    The algorithm therefore progresses iteratively, through a number of epochs. On
    each epoch, the training cases are submitted in turn to the network, and target
    and actual outputs computed and the error calculated. This error, together with
    the error surface gradient, is used to adjust the weights, and then the process
    repeats. The initial network configuration is random, and stopping when a given
    number of epochs lapses, or when the error reaches an acceptable level, or when
    the error stops improving (you can select which of these stopping conditions to
    use).


