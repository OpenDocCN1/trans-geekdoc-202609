- pgno: 30
  md: '# Machine Learning Overview


    the early days when the idea of “self-organizing systems” was popular, the limitations
    inherent in the early neural network approaches led to a temporary decline in
    research volume. More recently, new symbolic methods and knowledge-intensive techniques
    have yielded promising results and these in turn have led to the current, revival
    in machine learning research. This book examines some basic methodological issues,
    existing techniques, proposes a classification of machine learning techniques,
    and provides a historical review of the major research directions.


    Machine Learning according to Michie et al (D. Michie, 1994) is generally taken
    to encompass automatic computing procedures based on logical or binary operations
    that learn a task from a series of examples. Here we are just concerned with classification,
    and it is argueable what come under the Machine Learning umbralla. Attention has
    focussed on decision-tree approaches, in which classification results from a sequence
    of logical steps. These are capable of representing the most complex problem given
    sufficient data (but this may mean an enormous!). Other techniques, such as genetic
    algorithms and inductive logic procedures (ILP) are currently under active development
    and in principle would allow us to deal with more types of data, including cases
    where the number and type of attributes vary, and where additional layers of learning
    are superimposed, with hierarchical structure of attributes and classes and so
    on. Machine Learning aims to generate classifying expressions simple enough to
    be understood easily by the human. They must mimic human reasoning sufficiently
    to provide insight into the decision process. Like statistical approaches, background
    knowledge may be exploited in development, but operation is assumed without human
    intervention. Machine learning has always been an integral part of artificial
    intelligence according to Jaime et alJaime G. Cobenberg, 1983), and its methodology
    has evolved in concert, with the major concerns of the field. In response to the
    difficulties of encoding ever increasing volumes of knowledge in model AI systems,
    many researchers have recently turned their attention to machine learning as a
    means to overcome the knowledge acquisition bottleneck. This book presents a taxonomic
    analysis of machine learning organized primarily by learning strategies and secondly
    by knowledge representation and application areas. A historical survey out lining
    the development of various approaches to machine learning is presented from early
    neural networks to present knowledge-intensive techniques.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# The Aim of Machine Learning


    The field of machine learning can be organized around three primary research Areas:


    +   - Task-Oriented Studies: The development and analysis of learning systems
    oriented toward solving a predetermined set, of tasks (also known as the “engineering
    approach”)

    - Cognitive Simulation: The investigation and computer simulation of human learning
    processes (also known as the “cognitive modelling approach”)

    - Theoretical Analysis: the theoretical exploration of the space of possible learning
    methods and algorithms independent application domain.


    Although many research efforts strive primarily towards one of these objectives,
    progress in objective often lends to progress in another. For example, in order
    to investigate the space of possible learning methods, a reasonable starting point
    may be to consider the only known example of robust learning behaviour, namely
    humans (and perhaps other biological systems). Psychological investigations of
    human learning held by theoretical analysis that may suggest various learning
    models. The need to acquire a particular form of knowledge in stone task-oriented
    study may spawn new theoretical analysis or pose the question: “how do humans
    acquire this specific skill (or knowledge)?” The existence of these mutually supportive
    objectives reflects the entire field of artificial intelligence where expert system
    research, cognitive simulation, and theoretical studies provide some (cross-fertilization
    of problems and ideas (Jaime G. Carbonell, 1983).


    # Applied Learning Systems


    At present, instructing a computer or a computer-controlled robot, to perform
    a task requires one to define a complete and correct, algorithm for that task,
    and then laboriously program the algorithm into a computer. These activities typically
    involves a tedious and time-consuming effort by specially trained personnel. Present-day
    computer systems cannot learn to perform a task through examples or by analogy
    to a similar, previously-solved task. Nor can they improve significantly on the
    basis of past, mistakes or acquire new abilities by observing and imitating experts.
    Machine learning research strives to open the possibility of instructing computers
    in such'
  merge: -1
  img_proc: true
