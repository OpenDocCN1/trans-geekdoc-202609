  md: '# 330 Soft Computing and Machine Learning with Python


    graph models of secondary structure have been developed to quantify and thereby
    characterize the topological properties of the secondary folds. In this work we
    utilize a multigraph representation of a secondary RNA structure to examine the
    ability of existing graph-theoretic descriptors to classify all possible topologies
    as either RNA-like or not RNA-like. We use more than one hundred descriptors and
    several different machine learning approaches, including nearest neighbor algorithms,
    one-class classifiers, and several clustering techniques. We predict that more
    topologies will be identified as RNA structures than currently predicted in the
    RAG (RNA-As-Graphs) database. The results also suggest which descriptors and algorithms
    are more informative in classifying and exploring secondary RNA structures.


    # INTRODUCTION


    The need for a more complete understanding of the structural characteristics of
    RNA is evidenced by the increasing awareness of the significance of RNA molecules
    in biological processes as their role in gene regulatory networks which give the
    overall expressions of genes. Consequently, the number of studies investigating
    the structure and function of RNA molecules continues to rise and the characterization
    of the structural properties of RNA remains a tremendous challenge in computational
    biology. RNA molecules are seemingly more sensitive to their environment and have
    greater degrees of backbone freedom than proteins, resulting in even greater structural
    diversity [1]. Although the tertiary structure is of significant importance, it
    is much more difficult to predict than the tertiary structure of proteins. Advances
    in molecular modeling have resulted in accurate predictions of small RNAs. However,
    the structure prediction for large RNAs with complex topologies is beyond the
    reach of the current at initio methods [2].


    A coarse-grained model to refine RNA structure prediction was developed by Ding
    et al. [2] to produce useful candidate structures by integrating biochemical footprinting
    data with molecular dynamics. Although the focus is on tertiary folds, their method
    uses information about RNA base pairings from known secondary structures as a
    starting point. This, coupled with the understanding that the RNA folding mechanisms
    producing tertiary structure are believed to be hierarchical in nature, implies
    that much can be achieved by discovering all possible secondary structural RNA
    topologies.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Classifying Multigraph Models of Secondary RNA Structure... 331


    Given the primary sequence of an RNA molecule, there are a number of algorithms
    and tools available to predict the most likely set of resulting secondary structures.
    The most widely used algorithms such as Zucker’s Mfold [3] and Vienna RNAfold
    [4] typically base their predictions on the minimum free energy paradigm. While
    these algorithms have been highly beneficial, it is not always the case that the
    predicted structure with minimum free energy is the correct one and consequently
    some suggest that the actual RNA secondary structure may not have a global free
    energy, only local ones [5]. Other means of characterizing the topology of RNA
    structures are still an active avenue of pursuit.


    The graph representations used in this work can be found in the database RAG:
    RNA-As-Graphs [6]. Secondary RNA structure is modeled by two graph-theoretical
    representations in the database RAG for additional details on the differences
    between the two. In one of these representations, regions of the secondary structure
    that consist of unpaired bases such as junctions, hairpins, and bulges are represented
    by vertices. The connecting stems are represented quite naturally as connecting
    edges. The resulting graph is a connected, acyclic graph, that is, a tree. One
    advantage of this representation is the fact that these have been highly studied
    in the graph theory providing a wealth of information about the model. For instance
    it is known by the generating function by Harary and Prins [7] how many distinct
    trees can be constructed for a given number of vertices. This allows the entire
    space, that is, all possible configurations, to be considered. Unfortunately,
    secondary RNA structures containing a pseudoknot cannot be represented as described
    above by the tree model. If, however, the model is reversed and stem regions represented
    as vertices and connecting strings of unpaired bases as the edges, all secondary
    RNA structures can now be modeled, including those that contain a pseudoknot.
    This representation is called the dual graph in the RAG database. The resulting
    dual graph however is no longer a simple graph; instead this method produces a
    multigraph. Unlike a simple graph, a multigraph can have more than one edge connecting
    a pair of vertices. And, unlike simple graphs, multigraphs have not been as studied
    in the theoretical setting. In previous work [8], the authors of this paper, together
    with Koessler et al., capitalize on the knowledge afforded by the graph theory
    and exploit the tree representation of the secondary RNA structure to build a
    predictive model that identifies whether a given tree structure is RNA-like or
    not RNA-like. In this work, we now consider the dual graph representation.'
