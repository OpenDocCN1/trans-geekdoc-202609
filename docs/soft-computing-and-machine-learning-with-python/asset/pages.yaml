  md: '# An Efficient Platform for the Automatic Extraction of Patterns in ... 281


    identified and extrapolated to a code base, such that functions potentially suffering
    from the same flaw can be suggested to the analyst. With that method, they managed
    to identify 18 previously unknown vulnerabilities in the source code of the Linux
    kernel.


    The research context of finding code patterns using machine learning algorithms
    is based on 3 ideas. First, machine learning techniques can be used to build predictive
    models to identify patterns in data; besides, these techniques do not require
    domain specific knowledge about the problem domain [4]. Second, the existing open
    source code repositories create new opportunities for gathering massive pattern
    repositories to be analyzed. Third, the existing big data technologies and platforms
    facilitate the analysis of large datasets.


    When processing native code, a platform to extract binary patterns (if any) generated
    by the compiler. This information would be very valuable to extract binary patterns,
    which may later be used by a machine learning algorithm to create predictive tools.
    A large number of patterns may be extracted from a small binary program, since
    the number of assembly instructions is much higher than in its source high-level
    program. Therefore, the need of processing debug information, plus the potentially
    huge number of patterns to be extracted, makes it critical to use highly parallelized
    and efficient tools for extracting those patterns.


    A platform capable of extracting patterns from programs should also be highly
    parameterized. The individuals (rows in the dataset generated) to be detected
    by the platform must be defined by the user. For instance, we may be interested
    in finding patterns for functions, snippets, fusion entry points, or regions of
    binary code. The same parameterization is also required to specify the features
    of each individual (columns in the dataset). For example, we may define the feature
    <mov> <generic ax>, <any> to represent the assembly instruction that moves any
    value to the accumulator register (ah, al, eax, or rax). If that pattern (feature
    or column) occurs in one region of binary code (individual or row), then the corresponding
    value in the dataset (row and column) will be 1.


    The traditional method to extract features from binary code is to identify a syntactically
    fixed unit of code, such as [5] or basic blocks, and extract the binary code inside
    them [5]. However, pattern extraction does not always follow this scheme. Sometimes,
    nonsequential patterns such as subgraphs of control flow and data dependency graphs
    need to be'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'extracted. In these cases, a binary extraction platform should allow the association
    of patterns to pieces of code outside their basic blocks, representing subgraph
    structures (Section 3.7). Another scenario where the traditional method is not
    sufficient for the analysis of binary code between two memory addresses, where
    the inconsistency overlapping problem caused by the variable-length instruction
    set must be tackled [6]. This kind of binary code analysis has been used for different
    purposes such as entry points detection [6], compiler recognition [7], authorship
    attribution [8], and malware detection [9, 10]. Therefore, a generic platform
    for pattern extraction must be flexible enough to support any binary pattern extraction
    (not just the traditional one) and reduce development and execution times.


    The main contribution of this paper is a platform for the automatic extraction
    of patterns in native code. The platform is highly parameterized so that it could
    be used in different scenarios. Its parallel implementation provides important
    runtime benefits when multicore architectures are used. It also uses the debug
    information provided by a compiler. The extracted patterns may be used by other
    tools for different purposes. We present an evaluation of binary pattern extraction,
    measuring the execution time of different configurations for a large number of
    programs. The parallelization provides significant performance improvements, and
    its efficiency is maintained for big volumes of programs.


    The rest of this paper is structured as follows. Section 2 describes a motivating
    example, and the platform is described in Section 3. Section 4 presents an evaluation
    of the platform and Section 5 discusses the related work. The conclusions and
    future work are presented in Section 6.


