- pgno: 24
  md: '# PREFACE


    A definition states that the machine learning is a discipline that allows the
    computers to learn without explicit programming. The challenge in machine learning
    is how to accurately (algorithmic) describe some kinds of tasks that people can
    easily solve (for example face recognition, speech recognition etc).

    Such algorithms can be defined for certain types of tasks, but they are very complex
    and or require large knowledge base (e.g. machine translation-MT).


    In many of the areas - data are continuously collected in order to get "some knowledge
    out of them"; for example - in medicine (patient data and therapy), in marketing
    (the users / customers and what they buy, what are they interested in, how products
    are rated etc.).


    Data analysis of this scale requires approaches that will allow you to discover
    patterns and dependencies among the data, that are neither known, obvious, but
    can be useful (data mining).


    +   - Information retrieval - IR, is finding existing as quickly as possible.
    For example, web browser - finds pages within the (large) set of the entire WWW.

    - Machine Learning - ML, is a set of techniques that generalize existing knowledge
    of the new information, as precisely as possible. An example is the speech recognition.

    - Data mining - DM, primarily relates to the disclosure of something hidden within
    the data, some new dependency, which have not previously been known. Example is
    CRM - the customer analysis.


    Python is high-level programming language that is very suitable for web development,
    programming of games, and data manipulation / machine learning applications. It
    is object-oriented language and interpreter as well, allowing the source code
    to execute directly (without compiling).


    This edition covers machine learning theory and applications with Python, and
    includes chapters for soft computing theory, machine learning techniques/applications,
    Python language details, and machine learning examples with Python.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Section 1 focuses on soft computing theory, describing machine learning overview,
    types of machine learning algorithms, and data mining with skewed data.


    Section 2 focuses on machine learning techniques and applications, describing
    machine learning algorithms for disease diagnostic, bankruptcy prediction using
    machine learning, prediction of solar irradiation quantum support vector machine
    and predicting academic achievement of high-school students.


    Section 3 focuses on Python language details, describing Python 2.7 programming
    tutorial, pattern for Python, Pustruct - learning structured prediction in Python.


    Section 4 focuses on machine learning with Python use cases, describing Bayesian
    learning: inferring the structure of Bayesian Networks from knowledge and data,
    Scikit-learn: Machine Learning in Python, Efficient Platform and the Automatic
    Extraction of Patterns in native code, polyglot programming in applications used
    for genetic data analysis, and classifying multigraph models of secondary RNA
    structure using graph-theoretic descriptors.'
  merge: -1
  img_proc: true
