    # CODE DESIGN


    Objects specified by interface, not by inheritance: To facilitate the use of external
    objects via scikit-learn, inheritance is not enforced; instead, code conventions
    provide a consistent interface. The central object is an estimator, that implements
    a fit method, accepting arguments as input data array and, optionally, an array
    of labels for supervised problems. Supervised estimators, such as SVM classifiers,
    can implement a predict method. Some estimators, that we call transformers, for
    example, PCA, implement a transform method, returning modified input data. Estimators
    may also provide a score method, which is an increasing evaluation of goodness
    of fit: a likelihood, or a negated loss function.


