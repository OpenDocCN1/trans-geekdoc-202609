  md: '# Soft Computing Machine Learning with Python


    The answer is to check progress against an independent data set, the selection
    set. Some of the cases are reserved, and not actually used for training in the
    back propagation algorithm. Instead, they are used to keep an independent check
    on the progress of the algorithm. It is invariably the case that the initial performance
    of the network on training and selection sets is the same (if it is not at least
    the same, the division of cases between the two sets is probably biased). As training
    progresses, the training error drops, and providing the true error function, the
    selection error drops. However, if the selection error stops dropping, this indicates
    that the network is starting to overfit the data, and training should cease. When
    over-fitting occurs during the training process like this, it is called over-learning.
    In this case, it is usually advisable to decrease the number of hidden units and/or
    hidden layers, as the network is over-powerful for the problem at hand. In contrast,
    if the network is not sufficiently powerful to model the underlying function,
    over-learning is not likely to occur, and neither selection errors will drop to
    a satisfactory level.


    The problems associated with local minima, and decisions over the size of network
    to use, imply that using a neural network typically involves experimenting with
    a large number of networks, probably training each one of number of times (to
    avoid being fooled by local minima), and observing individual performances. The
    key guide to performance here is that, all being equal, a simple model is always
    preferable to a complex model, you can also select a smaller network in preference
    to a larger one with a negligible improvement in selection error.


    A problem with this approach of repeated experimentation is that the selection
    set plays a key role in selecting the model, which means that it is actually part
    of the training process. Its reliability as an independent guide to performance
    of the model is therefore compromised - with sufficient experiments, you may just
    hit upon a lucky network that happens to perform well on the selection set. To
    add confidence in the performance of the final model, it is normal practice (at
    least the volume of training allows) to reserve a third set of cases - the test
    set. The final model is tested with the test set data, to ensure that the results
    on the selection and training set are real, and not artifacts of the training
    process. Of course, to fulfill this role properly the test set used only once
    - if it is in turn used to adjust and reiterate the training process, it effectively
    becomes selection data!'
