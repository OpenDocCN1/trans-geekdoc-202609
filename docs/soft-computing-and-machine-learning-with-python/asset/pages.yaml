    # Support Vector Machines


    Support vector machine learning is the most commonly used “off-the-shelf” supervised
    learning algorithm [1]. SVM solves problems in both classification and regression.
    It uses the principle of maximum margin classifier to separate data. For a d-
    dimensional data, SVM uses a d ? 1 hyperplane for data separation. For instance,
    if data are supplied on a plane (two dimensions), SVM would use a line (one dimension)
    for classification. The principle of maximum margin classification ensures that
    there is a maximum separation between positive results (y = 1) and negative results
    (y = -1). The margin in this case is the distance between the decision boundary
    and the support vectors, where support vectors are data points closest to the
    decision boun.


    One of the key advantages of support vector machines is that unlike other supervised
    learning algorithms, its loss function is a global optimization problem, hence
    it is not to local optima [4]. Additionally, SVM is robust against over-fitting,
    hence it is suitable for making generalizations even with a small dataset. Lastly,
    by using a technique known as kernel trick, SVM can separate data which is not
    linearly separable in its input space, where a separating linear hyperplane can
    be found.


