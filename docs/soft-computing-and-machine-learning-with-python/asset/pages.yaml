  md: '# Polyglot Programming in Applications Used for Genetic Data Analysis 315


    A characteristic feature of the computer programs applied to genetic data is the
    necessity to analyze large amounts of data using complex algorithms, which means
    that high performance is crucial. Different user and system requirements mean
    that the flexibility of software is also important. Finally, users prefer a graphical
    interface that is accessible from a web browser and applications that update automatically.


    Scientists are becoming increasingly involved in software development [3]. They
    should use software engineering practices and tools to avoid common mistakes and
    to speed up the development tasks [4]. The architecture of working application
    with explanation of development decisions could help in developing new computer
    programs. Biological and medical terminology is simplified to invite developers
    to discuss the presented solutions.


    In this study, I describe the bioweb framework, including application architecture,
    the programming languages, libraries, and tools, to develop applications for processing
    genetic data. I propose a multilingual platform using C++, Python, and JavaScript.
    The use of appropriate and tested architectures, libraries, and tools decrease
    the risk of failure in software system development as well reduces the costs and
    time requirements. The use of appropriate systems also facilitates rapid prototyping,
    which allows us to verify concepts by obtaining the requisite information from
    end users: biologists and doctors.


    # RESULTS


    # Deployment Model


    A three-layer software architecture was selected where the presentation layer,
    data processing layer, and data storage layer were kept separate. The use of a
    multilayered model makes computer programs flexible and reusable, because applications
    have different responsibilities. Thus, it is beneficial to seg models into layers
    that communicate via well-defined interfaces. Layers help to separate different
    subsystems, and the code is easier to maintain, clean, and well structured.


    Four possible deployment models were considered for the three-layer architecture:
    the desktop, the database server, the client, and the web application, as shown
    in Figure 1. The desktop architecture (Figure 1(a)) was rejected because the framework
    was designed to support multiuser applications. Collaboration features were hard
    to implement in this architecture because of the lack of central data server that
    could be accessed'
  merge: -1
