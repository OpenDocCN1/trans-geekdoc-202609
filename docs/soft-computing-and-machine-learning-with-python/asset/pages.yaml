    The general form of an assignment statement looks like this:

    name_i = name_j = ... = expression


    Here are the rules for evaluating an assignment statement: Variable names


    +   * Each name, is some Python variable name. name must start with either a letter
    or the underbar (_) character, and the remaining characters must be letters, digits,
    or underbar characters. Examples: skateKey; x47; sum_of_all_fears.

    * The expression is any Python expression.

    * When the statement is evaluated, first the expression is evaluated so that it
    is a single value. For example, if the expression is “(2+3)*4”, the resulting
    value is the integer 20.


    Then all the names_i are bound to that value.

    What does it mean for a name to be bound to a value? When you are using Python
    in conversational mode, the names and value you define are stored in an area called
    the global namespace. This area is like a two-column table, with names on the
    left and values on the right.


    Here is an example. Suppose you start with a brand new Python session, and type
    this line:

    >>> i = 5100


    Here is what the global namespace looks like after the execution of the assignment
    statement.


    # Global namespace


    | Name | Value |

    |---|---|

    | i | int 5100 |


