    Finally, the model in the training set will be applied in the testing set for
    cross-validation. Since the Random Forest is a black box technique—ie. there is
    only a prediction based on majority vote and no "typical tree"—to look at the
    partitions—to determine which variable is important in the prediction one importance
    measure will be used: the mean decrease of accuracy. It indicates how much in
    average the accuracy decreases on the out-of-bag samples when a given variable
    is excluded from the model (James et al., 2013).


    # Descriptive Analysis Procedures


    After estimating the student’s ability in each test or scale the Shapiro-Wilk
    test of normality will be conducted in order to discover which variables presented
    a normal distribution. To verify if there is any statistically significant difference
    between the students’ groups (high achievement vs. low achievement) the two-sample
    T test will be conducted in the normally distributed variables and the Wilcox
    Sum-Rank test in the non-normal variables, both at the .05 significance level.
    In order to estimate the effect sizes of the differences, the R’s compute package
    (Del Re, 2013) is used. This package computes the effect sizes, along with their
    variances, confidence intervals, p-values and the common language effect size
    (CLES) indicator using the p-values of the significance testing. McGraw and Wong
    (1992) developed the CLES indicator as a more intuitive tool than the other effect
    size indicators. It converts an effect into a probability that a score taken at
    random from one distribution will be greater than a score taken from another distribution(McGraw
    & Wong, 1992). In words, it expresses how much (in %) the score from one population
    is greater than the score of the other population if both are randomly selected
    (Del Re, 2013).


