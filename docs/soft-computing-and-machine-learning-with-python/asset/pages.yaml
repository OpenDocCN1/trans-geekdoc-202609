- pgno: 273
  md: '# INTRODUCTION


    The Wide Web is an immense collection of linguistic information that has in the
    last decade gathered attention as a valuable resource for tasks such as machine
    translation, opinion mining and trend detection, as “Web as Corpus” (Kilgarriff
    and Grefette, 2003). This use of the WWW poses a challenge since the Web is interspersed
    with code (HTML markup) and lacks metadata (language identification, part-of-speech
    tags, semantic labels).


    “Pattern” (BSD license) is a Python package for web mining, natural language processing,
    machine learning and network analysis, with a focus on ease-of-use. It offers
    a mash-up of tools often used when harnessing the Web as a corpus, which usually
    requires several independent tools chained together in a practical application.
    Several toolkits with a user interface exist in the scientific community, example
    ORANGE (Demsar et al., 2004) for machine learning and GEPHI (Bastian et al., 2009)
    for graph visualization. By contrast, PATTERN is related to toolkits such as NLTK
    (Bird et al., 2009), PYBRAIN (Schaul et al., 2010) and NETWORKX (Hagberg et al.,
    2008), in that it is geared towards integration in the user’s own programs. Also,
    it does not specialize in one domain but provides general cross-domain functionality.


    The package aims to be useful for both a scientific and a non-scientific audience.
    The syntax is straightforward. Function names and parameters were chosen as to
    make the commands selfexplanatory. The documentation assumes no prior knowledge.
    We believe that PATTERN is valuable as a learning environment for students, as
    a rapid development framework for web developers, and in research projects with
    a short development cycle.


    ![](img/e1ab17402154bec3fa9a7873fe3ee232_273_0.png)


    **Figure 1:** Example workflow. Text is mined from the web and searched by syntax
    and semantics. Sentiment analysis (positive/negative) is performed on matching
    phrases.'
