  md: '# Soft Computing and Machine Learning with Python


    tasks as processes to obtain a better performance improvement with multicore architectures
    [21].


    +   (5) Concurrent Workers. To parameterize the level of parallelization of the
    platform, we configured its implementation to run with a different number of worker
    processes (Section 4.2). A scheduler analyzes the task DAG and tells each worker
    is the following task to be executed. In Figure 4, two workers are running in
    parallel. Tasks 1, 2.1, and 2.2 have already been executed; Tasks 3.1 and 3.2
    are run by Workers 1 and 2, respectively; and Task 2.3 is the following one to
    be executed, once one worker is free.


    +   (6) Communication between tasks. Since we implemented tasks as processes,
    communication between them is costly. However, the dependency between tasks shown
    in Figure 4 indicates that the output of one task is taken as the input of the
    following one. Therefore, this data communication was implemented through a database,
    appropriately configured to obtain the expected runtime performance.


    +   (7) Task Synchronization. Workers should indicate when they terminate executing
    one task, and the scheduler should tell them which task should be executed next.
    To synchronize this process, we used a Queue object in the multiprocessing module.


    +   (8) Tool Parameterization. We configured the IDA disassembler to allow the
    concurrent processing of the same input file. The compilation task is represented
    by a Python class that can be parameterized to use different compilers, package
    managers, compiler options, and automating software. The external tools used write
    information in the standard output (e.g., the C compiler). We captured those messages
    and sent them to a concurrent logger, adding additional information of the processes.


