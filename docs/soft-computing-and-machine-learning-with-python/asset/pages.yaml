    # Defining the Achievement Classes (High vs. Low)


    The final grade in the nine school subjects was provided by the school at the
    end of the academic year: arts, philosophy, physics, history, informatics, math,
    chemistry, sociology and Brazilian Portuguese. The final grades ranged from 0
    to 10, and the students were considered approved in the academic year in each
    school subject only if he/she had a grade equal to or above seven. Students with
    grades lower than seven in a particular school subject are submitted to an additional
    assessment. those with an average grade of seven or more are considered able to
    proceed to the'
