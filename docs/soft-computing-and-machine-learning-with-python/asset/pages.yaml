    # EXPERIMENTS


    While PyStruct focuses on usability and covers a wide range of applications, it
    is also important that the implemented learning algorithms run in acceptable time.
    In this section, we compare our implementation of the 1-slack cutting plane algorithm
    (Joachims et al., 2009) with the implementation in SVMstruct. We compare performance
    of the CramerSinger multi-class SVM with respect to learning time and accuracy
    on the MNIST data set of handwritten digits. Multi-class classification is not
    very interesting from a structured prediction point of view, this problem is well-suited
    to benchmark the cutting plane solvers with respect to accuracy and speed.


    Results are shown in Figure 1. We report learning times and accuracy for varying
    regularization parameter C. The MNIST data set has 60 000 training examples, 784
    features and 10 classes. The figure indicates that PyStruct has competitive performance,
    while using a high-level interface in a dynamic programming language.'
