    # A Module is a Namespace


    Modules are yet another example of a Python namespace, just as we’ve discussed
    in Section 2.2, “The assignment statement” and Section 5.3, “A namespace is like
    a dictionary.”


    When you import a module using the form “import moduleName”, you can refer to
    some N inside that module using the period operator: `moduleName.N`.


    So, like any other namespace, a module is a container for a unique set of names,
    and the values to which each name is connected.


