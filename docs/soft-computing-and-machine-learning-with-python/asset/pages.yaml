    # INTRODUCTION


    Machine learning is a relatively new science field composed by a broad class of
    computational and statistical methods to make predictions, inferences, and to
    discover new relations in data (Flach, 2012; Tibshirani, & Friedman, 2009). There
    are two main areas within the machine learning field. The unsupervised learning
    focuses on the discovery and detection of new relationships, patterns and trends
    in data. The supervised learning area, by the other side, focuses on the prediction
    of an outcome using a given set of predictors. If the outcome is categorical,
    or it is numeric then the task to be accomplished is named classification, or
    is called regression.


    There are several types of algorithms to perform classification and regression
    (Hastie et al., 2009). Among these algorithms, the tree based models are supervised
    learning techniques of special interest to the psychology and to the education
    research field. It can be used to discover which variable, or combination of variables,
    better predicts a outcome, e.g. high or low academic achievement. It can identify
    the cutoff points for each variable that maximally predict the outcome, and can
    also be applied to study the non-linear interaction effects of the independent
    variables'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Predicting Academic Achievement of High-School Students Using ... 133


    and its relation to the quality of the prediction (Golino & Gomes, 2014) . Within
    psychology, there are a growing number of applications of the tree-based models
    in different areas, from ADHA diagnosis (Elyan et al., 2012; Skogli et al., 2013)
    to perceived stress (Scott, Jackson, 2011), suicidal behavior (Baca-García et
    al., 2007; Kuroki & Tilley, 2012), adaptive depression assessment (Gibbons et
    al., 2013) and emotions (Tian et al., 2014; var for der Wal & Kowalczyk, 2013)and
    education (Blanch & Aluja, 2013; Cortez & Silva, 2008; Golino & Gomes, 2014; Hardman,
    Paucar-Caceres, & Fielding, 2013).


    The main benefit of using the tree-based models in psychology is that they do
    not make any assumption regarding normality, linearity of the relation between
    variables, homoscedasticity, collinearity or independence (Geurts, Irthum & Wehenkel,
    2009). The tree-based models also do not demand a high sample-to-predictor ratio
    and are more to interaction effects (especially non-linearity) than the classical
    techniques, such as linear and logistic regression, ANOVA, MANOVA, structural
    equation modelling and so on. Finally, the tree-based models, especially the techniques,
    can lead to high prediction accuracy, since they are known as the state-of-the-art
    methods in terms of prediction accuracy (Flach; 2012; Ebert et al., 2009). The
    current paper focuses on the methodological aspects of the classification tree
    (Breiman, Friedman, Olshen, & Stone, 1984) and its most famous ensemble technique,
    Random Forest (Breiman, 2001a). To illustrate the use of tree-based models in
    educational psychology, the Random Forest algorithm will be used to predict levels
    of academic achievement of high school students (low vs. high). Finally, we will
    discuss the limits and possibilities of this new predictive method to the field
    of educational psychology.


    # Recursive Partitioning and Ensemble Techniques


    A classification tree partitions the feature space into several distinct mutually
    exclusive regions (non-overlap-ping). Each region is fitted with a specific model
    that designates one of the classes to that particular space. The class is assigned
    to the region of the feature space by identifying the majority class in that region.
    In order to arrive in a solution that separates the feature space into pure nodes
    (regions), recursive binary partitioning is used. A node is considered pure when
    100% of the cases are of the same class, for example, low academic achievement.
    A node with 90% of low achievement and 10% of high achievement students is more
    “pure” then a node with 50% of each. Recursive binary partitions work as follows.'
  merge: -1
  img_proc: true
- pgno: 159
