  md: '# ASSESSING THE GRAPH-THEORETIC MEASURES AS DESCRIPTORS OF RNA TOPOLOGY


    The total invariants were divided into 3 categories—topological indices, graph-theoretic
    invariants, and measures on line graphs. In order to compare the efficacy of an
    invariant or index in discriminating between the RNA graphs and the remaining
    graphs, the invariants were normalized with respect to the RNA graphs of orders
    4 and 5, respectively. In particular, for each invariant or index, we calculated
    the mean and standard deviation of the RNA graphs of order 4, after which we used
    this mean and standard deviation to normalize all the values for graphs of order
    4 of the given invariant or index according to the formula


    ```

    $I_{normalized} = \frac{I_{observed} - Mean_{RNA graphs}}{StDev_{RNA graphs}}
    (1)$

    ```


    Figure 1 shows the 10% percentile to 90% percentile of each normalized index/invariant
    in the topological indices collection as a rectangle. The mean is zero and the
    standard deviation is one for the given index order 4 across the RNA graphs of
    order 4. The values of the unverified graphs of order 4 are shown as points, so
    that a point inside the green rectangle is between the 10% and 90% percentiles
    for that index. The dotted lines correspond to the numbers of standard deviations
    from the mean. In general, if the values of the unverified graphs are all on or
    inside the rectangle for a given invariant (i.e., if the dots are all on or inside
    the rectangle), this invariant will not be useful as a factor in a machine learning
    classifier. For example, invariants 12–18 are poor predictors of RNA-like not
    RNA-like simply because there is not enough variation among the values for all
    the multigraphs of order 4. A support vector machine, a neural network, and logistic
    regression trained on the multigraphs of order 4 using invariants 12–18 were no
    better classifiers than were the uniformly random assignment to different classes,
    as evidence by the Receiver Operating Characteristic analysis in which the area
    under the curve for each method was approximately 0.5.'
