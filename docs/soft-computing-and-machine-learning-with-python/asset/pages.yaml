    feature space is split into two regions using a specific cutoff of the variable
    of the feature space (predictor) that leads to the most purity configuration.
    Then, each region of the tree is modeled accordingly to the majority class. One
    or two original nodes are also split into more nodes, using some of the given
    predictors that provide the best fit. This splitting process continues until the
    feature space achieves the most purity configuration possible, with Rm regions
    or nodes classified with a distinct Cl class. If more than one predictor is given,
    the selection of each variable used to split the nodes will be given by the variable
    that splits the feature space into the most purity configuration. In a classification
    tree, the first split indicates the most important variable, or feature, in the
    prediction. Let''s take a look in Figure 1 to see how a classification tree looks
    like.


