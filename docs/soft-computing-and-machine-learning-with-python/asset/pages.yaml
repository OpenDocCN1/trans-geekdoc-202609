    # DICTIONARIES


    Python''s dictionary type is useful for many applications involving table lookups.
    In mathematical terms:

    A Python dictionary is a set of zero or more ordered pairs (key, value) such that:


    +   - The value can be any type.

    - Each key may occur only once in the dictionary.

    - No key may be mutable. In particular, a key may not be a list or dictionary,
    or a tuple containing a list or dictionary, and so on.'
