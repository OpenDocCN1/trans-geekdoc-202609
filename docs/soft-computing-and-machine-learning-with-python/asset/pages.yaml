    In traditional modeling approaches (e.g., linear modeling) it is possible to algorithmically
    determine the model configuration that absolutely minimizes this error. The price
    paid for the greater (non-linear) modeling power of neural networks is although
    we can adjust a network to lower its error, we can never be sure that the error
    could not be lower.


    A helpful concept here is the error surface. Each of the N weights and thresholds
    of the network (i.e., the free parameters of the model) is taken to be a dimension
    in space. The N+1th dimension is the error for. Any possible configuration of
    weights the error can be plotted in the N+1th dimension, forming an error surface.
    The objective of network training is to find the lowest point in this multi-dimensional
    surface.


    In a linear model with squared error function, this error surface is a parabola
    (quadratic), which means that it is a smooth bowl-shape with a single minimum.
    It is therefore "easy" to locate the minimum.


    Neural network error surfaces are much more complex, and are characterized by
    a number of unhelpful features, such as local minima (which are lower than the
    surrounding terrain, but above the global minimum), flatspots and plateaus, saddle-points,
    and long ravines.


    It is not possible to analytically determine where the global minimum of the error
    surface is, and so neural network training is essentially an exploration of the
    error surface. surface. From an initially random configuration of weights and
    thresholds (i.e., a random point on the error surface), the training algorithms
    incrementally search for the global minimum. Typically, the gradient (slope) of
    the error surface is calculated at the current point, and used to make a downhill
    move. Eventually, the algorithm stops at a low point, which may be a local minimum
    (but hopefully is the global minimum).


