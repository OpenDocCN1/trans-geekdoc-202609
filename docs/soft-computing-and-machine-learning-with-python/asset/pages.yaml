  md: "# A Python 2.7 Programming Tutorial 243\n\nIn a Python class, if you define\
    \ a method named \"__cmp__\", that method is called whenever Python compares two\
    \ instances of the class. It must return a result using the same conventions as\
    \ the built-in cmp()function: negative for \"<\\\n\nIn the case of \"SnailRun\"\
    , we want snail with better finishing time to be considered less than the slower\
    \ snail. So here is one way to define the __cmp__ method for our class:\n\n```\n\
    def __cmp__(self, other ):\n    \"\"\"Define how to compare two SnailRun instances.\"\
    \"\"\n    if self.time < other.time:\n        return -1\n    elif self.time >\
    \ other.time:\n        return 1\n    else:\n        return 0\n```\n\nWhen this\
    \ method is called, self is an instance of class SnailRun, and other should also\
    \ be an instance of SnailRun.\n\nHowever, this logic exactly duplicates what the\
    \ built-in cmp() function does to compare two float values, so we can simplify\
    \ it like this:\n\n```\ndef __cmp__(self, other ):\n    \"\"\"Define how to compare\
    \ two SnailRun instances.\"\"\"\n    return cmp(self.time, other.time)\n```\n\n\
    Let's look at another special method, __str__. This defines how Python converts\
    \ an instance of a class into a string. It is called, for example, when you use\
    \ an instance in a print statement, or when you pass an instance to Python's built-in\
    \ str() function.\n\nThe __str__ method of a class returns a string value. It\
    \ is up to the writer of the class what string value gets returned. As usual for\
    \ Python methods, the self argument contains the instance. In the case of SnailRun,\
    \ we'll want to display the snail's name (.name attribute) and finishing time\
    \ (.time attribute). Here's one version:\n\n```\ndef __str__(self ):\n    \"\"\
    \"Return a string representation of self.\"\"\"\n    return \"{:0.1f}{{}\".format(self.time,\
