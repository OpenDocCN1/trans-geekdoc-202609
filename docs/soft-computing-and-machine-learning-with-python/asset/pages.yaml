  md: 'created a versatile platform for the automatic extraction of patterns from
    native code, capable of processing big binary files. Its implementation has been
    parallelized, providing important runtime benefits for multicore architectures.
    Compared to the single-processor execution, the average performance improvement
    obtained with the best configuration is 3.5 factors over the maximum theoretical
    gain of 4 factors.


    # INTRODUCTION


    Many software tools analyze programs, looking for specific patterns defined beforehand.
    When a pattern is found, an action is then performed by the tool (e.g., improve
    the quality, security, or performance of the input program). Patterns are defined
    for both high-level and binary code. Different examples of tools that analyze
    high-level patterns are refactoring tools, code quality analyzers, or detectors
    of common programming mistakes. In the case of binary code, examples are decompilers,
    packed executable file recognizers, authorship analyzers, or malware detectors.


    In the traditional approach, an expert identifies these patterns to be found by
    the software tool. His or her expertise is used to define the code patterns that
    should be searched (e.g., for improving the application). On the contrary, a machine
    learning approach can be used to build models, which can then be applied to large
    repositories of code to effectively search for and identify specific patterns.
    This second approach allows the analysis of huge amounts of programs, sometimes
    detecting patterns not found with the traditional approach. Additionally, this
    approach could automatically evaluate the accuracy of the patterns obtained.


    An emerging research topic called big code has recently appeared [1]. Big code
    is based on the idea that open source code repositories (e.g., GitHub, SourceForge,
    BitBucket, CodeLex) can be used to create new kinds of programming tools and services
    to improve software reliability and construction, using machine learning and probabilistic
    reasoning. One of the research lines included in big code is finding extrapolated
    patterns, detecting software anomalies, or computing the cooccurrence of different
    patterns in the same program [2].


    One example (more real examples can be consulted in [2]) of detecting patterns
    in programs is the vulnerability discovery method proposed by the MLSEC research
    group [3]. It assists the security analyst during auditing of source code, extracting
    ASTs from the programs and determining structural patterns in them. Given a known
    vulnerability, their patterns are'
