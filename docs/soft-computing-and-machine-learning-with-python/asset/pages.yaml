    Deploying the calculation modules on a server machine, as shown in Figures 1(c)
    and 1(d), allows the use of many platforms on the client side, which reduces the
    development costs. Importantly, the computational power of the server is used,
    so the computational time is relatively short, for poorly equipped client machines.
    These solutions simplify scalability if the size of the problem or the number
    of clients grows, because only the servers need to be prepared.


    Web applications have advantages compared to application with a thin client architecture
    because the client contains a portion of the data processing layer, which can
    handle activities such as output formatting, graph generation, and user input
    validation. Client-based processing reduces the amount and frequency of client-server
    traffic, and it reduces the load on the server while the reactions to users are
    faster. This solution uses web browser plugins (such as Flash) or HTML5/JavaScript
    programs on the client side. The client modules are downloaded during initialization,
    which helps to avoid the issue of updating the software.


