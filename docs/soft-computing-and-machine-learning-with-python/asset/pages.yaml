  md: '# 284 Soft Computing and Machine Learning with Python


    The platform presented in this paper is being used to extract binary patterns
    from native code, which are later used to improve certain highlevel information
    gathered by these decompilers. Particularly, we face the problem of detecting
    the type returned by a function. An excerpt of the dataset generated by our platform
    for this particular case is shown in Table 2: individuals (rows) are functions
