    next school grade (11th grade). Otherwise, the students need to re-do the current
    grade (10th grade). From the total sample, only 65.18% (n = 88) were able to proceed
    to the next school year and 34.81% (n = 47) were requested to re-do the 10th grade.
    These two groups could be used to compose the high and the low achievement classes.
    However, since the tree-based models require balanced classes (i.e., classes with
    approximately the same number of cases) we needed to subset the high achievement
    class (those who proceeded to the next school grade) in order to obtain a subsample
    closer to the low achievement class size (those who would need to re-do the 10th
    grade). We computed the mean final grade over all nine grades for every student,
    and verified the mean of each group of students. Those who passed to the next
    school grade had a mean final grade of 7.69 (SD = .48), while those who needed
    to re-do the 10th grade had a mean final grade of 6.06 (SD = 1.20). We select
    every student with a mean final grade equals to or higher than 7.69 (n = 41) and
    called them “high achievement” group. The 47 students who needed to re-do the
    10th grade formed the “low achievement” group. Finally, we had 88 students divided
    in two balanced classes.


    # Machine Learning Procedures


    The sample was randomly split in two sets with equal sizes, training and testing,
    for cross-validation. The training set is used to grow the trees, to verify the
    quality of the prediction in an exploratory fashion, and to adjust the tuning
    parameters. Each model created using the training set is applied in the testing
    set to verify how it performs on a new data set.


    Since the single trees usually lead to overfitting and to high variance between
    datasets, we used only the Random Forest algorithm through the Random Forest package
    (Liaw & Wiener, 2012) of the R software (R Development Core Team, 2011). As pointed
    in the introduction, the Random Forest has two main tuning parameters: the number
    of trees ($n_{tree}$) and the number of variables (mtry). We set mtry as two,
    because the integer closest to the square root of the total number of predictors
    (5), and $n_{tree}$ as 10,000. In order to verify the quality of the prediction
    both in the training (modeling phase) and in the testing set (cross-validation
    phase), the total accuracy, the sensitivity and specificity were used.'
