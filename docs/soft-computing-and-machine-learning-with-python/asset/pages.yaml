  md: '# 294 Soft Computing and Machine Learning with Python


    In order to show this second working mode of our platform, we use the research
    work done by Rosenblum et al. [6] as an example. They extract patterns from stripped
    binary files to detect function entry points (FEP), which existing disassemblers
    do not detect perfectly yet [5]. They analyze consecutive bytes in binary files,
    representing them as 3 grams of assembly instructions. Once the grams are extracted,
    they formulate the FEP identification problem as structured classification using
    Conditional Random Fields (CRF) [16]. An initial flat model is later enriched
    with the evidence that a call instruction indicates the existence of a FEP in
    the callee address. The model detects FEPs more accurately than GCC, ICC, and
    MSVS compilers [6].


    Figure 3 shows the changes to the architecture when we want to process binary
    files, and the high-level program is not available. White elements are the same
    as in the previous architecture. Blue elements are modifications of the previous
    working mode. All the modules related to processing high-level programs are not
    present.


    ![](img/e1ab17402154bec3fa9a7873fe3ee232_319_0.png)


    **Figure 3: Platform architecture to process binary code.


    Although the behavior of the Binary Pattern Extractor is the same, the rules for
    detecting individuals and patterns are different. The main difference is that
    no instrumented code is added, since the source code is not available. Depending
    on the case, debug information is not available either (i.e., stripped binaries
    are used). Regarding the Classifier module, the Classification Rules must consider
    a plain binary file instead of a high-level program representation.'
