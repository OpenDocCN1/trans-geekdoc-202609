  md: '# An Efficient Platform for the Automatic Extraction of Patterns in ... 295


    In the example of FEP detection in binary files, this is how the platform has
    been used to generate a dataset valid to create the CRF model. The output dataset,
    individuals (rows) are instruction offsets in the binary file; one feature (column)
    will be created for each 1, 2, and 3 grams in the binary code, indicating the
    occurrence of that pattern in each individual; another call <offset> feature is
    added, associating function invocation with the <offset> individual. Finally,
    the classifier variable (target) is 1 if the individual is a FEP and 0 otherwise
    (debug information is available).


    In order to create the dataset described above, the Individual Detector creates
    as many individuals as instruction offsets in the binary file. The Pattern Detector
    extracts 1, 2, and 3 grams for each offset and a call feature for each different
    function. In this second case, the feature is not associated with the offset where
    the pattern is detected, but to the offset (memory address) being called (as done
    in Algorithm 6). Pattern Generalization is done via the normalization process
    described in [6]. Finally, the Classification Rules use the debug information
    to set 1 to one individual identified as a FEP and 0 otherwise.


    This platform configuration (and the previous one) to extract datasets valid to
    create the CRF model proposed by Rosenblum et al. is available for download at
    [17].


    # Representing Nonsequential Patterns


    In the analysis of binary applications, it is common to require the detection
    of nonsequential patterns, such as subgraphs of control flow and data dependency
    graphs. The detection of these subgraphs can be used for many different purposes,
    such as the FEP detection problem described in the previous subsection.


    Although the Binary Pattern Detector module of our platform (Figures 1 and 3)
    is aimed at extracting patterns made up of contiguous binary instructions, the
    rest of the modules can be used to represent nonsequential structures as graphs.
    This functionality is provided by the versatile way our platform considers the
    sequential patterns (features), permitting the definition of different criteria
    to associate these features to the corresponding individuals.


    One example of this functionality is present in the decompiler scenario. Algorithm
    5 shows how RET features are associated with the function'
