  md: '# Classifying Multigraph Models of Secondary RNA Structure... 333


    # The Dual Graph Representation of Secondary RNA Structure


    Gan et al. [6] have used tree graphs and the corresponding dual graphs which results
    in a multigraph representation of RNA secondary structures. Here, however, we
    will restrict our study to the multigraph representations of RNA secondary structures.
    As mentioned previously, the dual graphs can represent all types of RNA secondary
    structures, including the complex pseudoknots. When representing an RNA structure
    with a dual graphs, a vertex is used to represent stems (two or more complementary
    base pairs), and circular edges are used to represent the RNA motifs (hairpin
    loops, bulge, internal loops, and junctions). Dual graphs may contain multiple
    edges and loops; however, neither of these structures is required. Since a double-stranded
    RNA stem is connected to at most 2 strands on each side, in fact, all vertices
    of degree 4 except (a) one of degree 2 or (b) two of degree 3. It follows that
    dual graphs of order n are size 2n-1 [6]. Given these constraints, we use a constructive
    graph algorithm to enumerate the number of dual graphs of order five. These 118
    graphs have been shown in Figure 6.


    # Previous Results for the Dual Graph Model


    The dual graph representation with 4 or fewer vertices was used in a previous
    work to train an artificial neural network (ANN) to recognize a dual graph as
    having the structural properties of secondary RNA [11]. In particular, we quantified
    the structures using graph invariants from graph theory and molecular descriptors
    from chemical graph theory and used a multilayer perceptron artificial neural
    network to verify the findings in the RAG database regarding the classification
    of the dual graphs of order four. A set of ten structures that have been verified
    as RNA-like were chosen randomly from the set of 11 RNA-like graphs of order four.
    These graphs, in addition to the ten classified as not RNA-like, comprised the
    training set for the ANN. All graphs that were classified to be RNA-like were
    predicted to be RNA-like by the neural network. However, one of the graphs whose
    structure represents a known topology was predicted with much lower probability
    than the other graphs in the set. Since this earlier work, the RAG database has
    been updated and a dual graph considered to be not RNA-like has since been changed
    to RNA verified [9]. This particular structure is similar to the structure that
    the neural network predicted to be RNA-like, but with lower probability. Given
    the updated information in'
