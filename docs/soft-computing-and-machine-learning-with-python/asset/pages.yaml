    The most important manifestation of this distinction is the problem of over-learning,
    or over-fitting. It is easiest to demonstrate this concept using polynomial curve
    fitting rather than neural networks, but the concept is precisely the same.


    A polynomial is an equation with terms containing only constants and powers of
    the variables. For example:


    ```

    y=2x+3

    y=3x^2+4x+1

    ```


    Different polynomials have different shapes, with larger powers (and therefore
    larger numbers of terms) having steadily more eccentric shapes. Given a set of
    data, we may want to fit a polynomial curve (i.e., a model) to explain the data.
    The data is probably noisy, so we don''t necessarily expect the best model to
    pass exactly through all the points. A low-order polynomial may not be sufficiently
    flexible to fit close to the points, whereas a high-order polynomial is actually
    too flexible, fitting the data exactly by adopting a highly eccentric shape that
    is actually unrelated to the underlying function. See figure 4 below.


    ![](img/e1ab17402154bec3fa9a7873fe3ee232_62_0.png)


    **Figure 4:** High-order polynomial sample.


    Neural networks have precisely the same problem. A network with more weights models
    a more complex function, and is therefore prone to over-fitting. A network with
    less weight may not be sufficiently powerful to model the underlying function.
    For example, a network with no hidden layers actually models a simple linear function.
    How can we select the right complexity of network? A larger network will almost
    invariably achieve a lower error eventually, but this may indicate over-fitting
    rather than good modeling.'
