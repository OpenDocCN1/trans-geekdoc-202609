  md: '# More Mathematical Operations


    Python has a number of built-in functions. To call a function in Python, we

    this general form:

    f(arg, arg, ... )


    That is, use the function name, followed by an open parenthesis “(",

    followed by zero or more arguments separated by commas, followed by a

    closing parenthesis ””,


    For example, the round function takes numeric argument, and

    returns the nearest number (as a float number). Examples:


    ```

    >>> round ( 4.1 )

    4.0

    >>> round(4.9)

    5.0

    >>> round(4.5)

    5.0

    ```


    The result of that last case is somewhat arbitrary, since 4.5 is equidistant

    from 4.0 and 5.0. However, as in most modern programming languages,

    the value chosen is the one further from zero. More examples:


    ```

    >>> round (-4.1 )

    -4.0

    >>> round (-4.9)

    -5.0

    >>> round (-4.5)

    -5.0

    ```


    For historical reasons, trigonometric and transcendental functions are

    not built-in to Python. If you want to do calculations of those kinds, you will

    need to tell Python that you want to use the math package. Type this line:

    >>> from math import *


    Once you have done this, you will be able to use a number of mathematical

    functions. For example, sqrt(x) computes the square root of x:


    ```

    >>> sqrt(4.0)

    2.0

    >>> sqrt(81)

    ```'
