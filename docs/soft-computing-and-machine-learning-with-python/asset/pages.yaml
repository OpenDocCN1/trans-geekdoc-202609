    # **Pattern Generator**


    The subpatterns are too specific. For example, the MOV eax,5 and MOV ax,1 subpatterns
    are recognized as two different ones. However, for detecting whether a function
    is returning a value or not, they may be considered as the same pattern, meaning
    that a literal has been assigned to the accumulator register (i.e., a MOV <generic
    ax>,<literal>pattern). To this end, the objective of the Pattern Generator module
    is to allow us to reduce the number of subpatterns, by generalizing them.


    This necessity of generalizing (or normalizing) assembly instructions for binary
    pattern extraction was already detected in previous works. In [6],'
