  md: '# Predicting Academic Achievement of High-School Students Using ... 147


    he tree-based models are also more suitable to non-linear interaction effects
    from the classical techniques. When several trees are ensemble to perform a prediction
    it generally leads to a high accuracy (Flach, 2012; Geurts et al., 2009), decreasing
    the chance of overfitting and diminishing the variance between datasets. The focus
    of the current paper was the application of this relatively new predictive method
    in the educational psychology field.


    Psychology is taking advantage of the tree-based models in a broad set of applications
    (Baca-Garcia et al., 2007; Eloyan et al., 2012; Gibbons et al., 2013; Kuroki &
    Tiley, 2012; Scott, Jackson, & Bergman, 2011; Skogli et al., 2013; Tian et al.,
    2014; van der Wal & Kowalczyk, 2013). Within education, Blanch and Aluja (2013),
    Cortes and Silva (2008) and Golino and Gomes (2014) applied the tree-based models
    to predict the academic achievement of students from the secondary and tertiary
    levels using a set of psychological and socio-demographic variables as predictors.
    The discussion of their methods and results are beyond the scope of the current
    paper, since we focused on the methodological aspects of machine learning, and
    how it can be applied in the educational psychology field.


    In the present paper we showed the Rasch scores of the tests and scales significantly
    differentiated the high achievement from the low achievement 10th grade students.
    Inductive reasoning presented a large effect size, while the deep learning approach,
    metacognitive control and self-appraisals moderate effect sizes. The random forest
    prediction led to a total accuracy of 75%, a sensitivity of 68% and a specificity
    of 73.69% in the training set. The testing result was a bit worse, with a total
    accuracy of 68.18%, a sensitivity of 72.72% and a specificity of 63.63%. The most
    important variable in the prediction was the inductive reasoning that was associated
    with a mean decrease accuracy of 66.22% when left of the prediction bag. The deep
    learning approach was the second most important variable (mean decrease accuracy
    of 28.45%), followed by metacognitive control (19.68%), TDRI self-appraisal (19.50%)
    and TCM self-appraisal (5.78%). This reinforces previous findings that showed
    incremental validity of the learning approaches in the explanation of academic
    performance beyond intelligence, using traditional techniques (Chamorro-Pruzmic
    & Furnham, 2008; Furnham Monsen, & Ahmetoglu, 2009; Goses & Golino, 2012 ). It
    also reinforces the incremental validity of metacognition, over intelligence,
    in the explanation of academic achievement (van der Stel & Veenman, 2008; Veenman
    & Beishuizen, 2004).'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# CONCLUSION


    The application of machine learning models in the prediction of academic achievement/performance,
    especially the tree-based models, represents an innovative complement to the traditional
    techniques such as linear and logistic regression, as well as structural equation
    modelling (Blanch & Aluja, 2013) . More than the advantages pointed earlier, the
    tree-based models can help us understand the non-linear interactions between psycho-
    educational variables in the prediction of academic outcomes. These machine learning
    models not only only represent an advance in terms of prediction accuracy, but
    also represent an advance in terms of inference. Future studies could benefit
    from employing a larger and broader sample, involving students from different
    schools. It would also be interesting to investigate, in the future, the impact
    of varying the tuning parameters of the random forest model in the accuracy, sensitivity,
    specificity and variability of the prediction.


