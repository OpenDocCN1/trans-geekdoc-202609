    # RELATED WORK


    There exist different works aimed at extracting assembly patterns from existing
    applications. To the knowledge of the authors, none of them have built a platform
    to extract those patterns automatically. They define custom processes and, some
    of them, even manual procedures.


    Rosenblum et al. extract every combination of 1, 2, and 3 consecutive assembly
    instructions from a big set of executable files [6]. Then, they use forward feature
    selection to filter the most significant patterns and later train a Conditional
    Random Fields to detect the function entry points. The same authors use this methodology
    to detect the classifier used to generate the executables [7]. This research work
    was later extended to consider the compiler options and programming language used
    in the source application [8], to identify the programmer who coded the application
    [25], and to identify the functions belonging to the operating system [26].'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# An Efficient Platform for the Automatic Extraction of Patterns in ... 307


    WEIGHT provides another approach to find function entry points [5]. They apply
    machine learning to recognize the patterns, so that different compilers and optimization
    options may be used. Analyzing the training binaries, an extraction process generates
    prefix trees from sequences of bytes or normalized instructions. The prefix tree
    represents possible function sequences. Then, they assign a weight representing
    the likelihood that the path from the root to the node is a function in the training
    set. Finally, the weighted prefix tree is used to classify the input binary file.


    Apart from assembly extraction, there are other situations where other parts of
    the binary files need to be processed. One example is the detection of packed
    executable files [27]. To this end, it is necessary to recognize not only assembly
    patterns, but also other types of information existing in the binaries, as header
    patterns, entropy values, and characteristics of the file sections. Ugarte-Pedreiro
    et al. propose a custom collective-learning-based process to solve this problem,
    detecting packed executables upon structural features, and heuristics [28].


    Regarding decompilation, Cifuentes et al. identified the existing limitations
    on recognizing high-level control structures [29]. They later define a technique
    to recover jump tables and their target addresses and incorporated it into the
    DCC decompiler [30]. The Phoenix decompiler uses a structuring algorithm to detect
    control flows structures, being able to decompile more structures than Hex-Rays
    [13]. Regarding decompilation of high-level types, Mycroft proposes a constraint-based
    algorithm to infer types from binary code [31]. Another recovery approach is the
    VSA algorithm based on value propagation [32]. Laika is a system that uses Bayesian
    unsupervised learning to detect high-level data structures, analyzing the process
    memory images [33].


    # CONCLUSIONS


    We propose a platform for the automatic extraction of patterns in binary files,
    capable of analyzing binary executable files. The platform is highly parameterized
    to be used in different scenarios. The extracted patterns can be used to predict
    features in native code, when the high-level source code and the debug information
    are not available.


    The platform implementation has been parallelized to increase its runtime performance
    on multicore architectures. Data and task parallelization schemes have been followed.
    We have evaluated its performance, obtaining a performance benefit of 3.5 factors
    over the maximum theoretical value'
