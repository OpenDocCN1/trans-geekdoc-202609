    few software packages take advantage of it. PEBL can execute tasks in parallel
    over multiple processors or CPU cores, an Apple Xgrid,1 an IPython cluster2 or
    the Amazon EC2 platform is particularly attractive for scientists because it allows
    one to rent processing power on an-demand and execute PEBL tasks on them.


    With appropriate configuration settings and the use of parallel execution, PEBL
    can be used for large learning tasks. Although PEBL has been tested successfully
    with data sets with 10000 variables and samples, BN structure learning is a known
