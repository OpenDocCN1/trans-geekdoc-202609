  md: '# Soft Computing and Machine Learning with Python


    superimposed, with hierarchical structure of attributes and classes and so on.
    Machine Learning aims to generate classifying expressions simple enough to be
    understood easily by the human. They must mimic human reasoning sufficiently to
    provide insight into the decision process. Like statistical approaches, background
    knowledge may be exploited in development, but operation is assumed without human
    intervention.


    To learn is:


    +   - to gain knowledge, comprehension, or mastery of through experience or study
    or gain knowledge (of something) or acquire skill in (some art practice)

    - to acquire experience of or an ability or a skill in

    - to memorize (something), to gain by experience, example, or practice.


    Machine Learning can be defines as a process of building computer systems that
    automatically improve with experience, and implement a learning process. Machine
    Learning can still be defined as learning the theory automatically from the data,
    through a process of inference, fitting, or learning from examples:


    +   - Automated extraction of useful information from a body of data by building
    good probabilistic models.

    - Ideally suited for areas with lots of data in the absence of a general theory.


    A major focus of machine learning research is to automatically produce models
    and a model is a pattern, plan, representation, or design described to show the
    main working of a system, or concept, such as rules determine for performing a
    mathematical operation and obtaining a certain result, from a function of formulae
    or patterns ( model which can be used to generate things or parts of a thing.


    Learning is a MANY-FACETED PHENOMEN described by Jaime et al (Jaime G. Carbonell,
    1983) and also stated that Learning processes include the acquisition of new declarative
    knowledge, the development of motor and cognitive skills through instruction or
    practice, the organization of new knowledge into general, effective representations,
    and the discovery of new facts and theories through observation and experimentation.
    The study and computer modelling of learning processes in their multiple manifestations
    constitutes the subject matter of machine learning. Although machine learning
    has been a central concern in artificial intelligence since'
