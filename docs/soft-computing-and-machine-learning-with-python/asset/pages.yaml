    protection. In this case, one possible explanation could be a system failure,
    where all international transaction are not being correctly converted when passed
    to the fraud prevention system. This loophole may have been found by some fraudster
    and exploited. Of course, this error would have passed unnoticed had one paid
    attention to any missing or common values in the dataset.


    # DERIVED CHARACTERISTICS


    New or derived characteristics construction is one of, if not, the most important
    part of modelling. Some important phenomena mapped in nature are easily explained
    using derived variables. For example, in elementary physics speed is a derived
    variable of space over time. In data mining, it is common to transform date into
    birth age or, e.g., year of study into primary, secondary, degree, master, or
    doctorate. Myriad ways exist to generate derived characteristics. In the following
    we give three typical examples:


    +   Transformed characteristics: transform characteristics to gain either similarity
    or generalisation power. For example, date of birth age, date of starting a relationship
    with a company into time on books, and years of education into education level;


    +   Time series characteristics: a new characteristic built on a group of historical
    months of a given characteristic. Examples'
  merge: -1
  img_proc: true
