    # # Testing


    Software testing is an integral part of the development process. Thus, testing
    techniques and libraries that support this process are specified in presented
    framework. Three types of tests are considered: unit tests, integration tests,
    and system tests. Unit testing checks individual functions, procedures, and classes
    in isolation. Integration tests examine the communication between modules, based
    on a consideration that they are created in different programming languages. System
    tests examine the functions of a computer program as a whole, without the knowledge
    of the internal structure of the software.


    Unit testing uses Boost.Test [5] for C++ modules, the standard Python unit package
    for Python code, and QUnit [unitjs.com for modules written in JavaScript. C++
    unit unit testing is performed in both environments: g++ and msvc. Integration
    tests are implemented with the same tools and libraries as unit tests, but the
    features of C++++ modules exported to Python by the Boost.Python library are tested
    in Python using unitittest.'
