    # DISCUSSION


    The present paper briefly introduced the concept of recursive partitioning used
    in the tree-based models of machine learning. The tree-based models are very useful
    to study the role of psychological and educational constructs in the prediction
    of academic achievement. Unlike the most classical approaches, such as linear
    and logistic regression, as well as the structural equation modeling, the tree-based
    models do not make assumptions about the normality of data, the linearity of the
    relation between the variables, neither requires heteroscedasticity, collinearity
    or independence (Geurts, Irrum, & Weenzel, 2009) . A high predictor-to-sample
    ratio can be used without harm to the quality of the prediction, and missingness
    is well handled by the prediction algorithms.


