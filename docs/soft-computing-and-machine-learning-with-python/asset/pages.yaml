    K-means (Bishop C. M., 1995) and (Tapas Kanungo, 2002) is one of the simplest
    unsupervised learning algorithms that solve the well known clustering problem.
    The procedure follows a simple and easy way to classify a given data set through
    a certain number of clusters (assume k clusters) fixed a priority. The main idea
    is to define k centroids, one for each cluster. These centroids should be placed
    in a cunning way because of different location causes different result. So, the
    better choice is to place them as much as possible away from each other. The next
    step is to take each point belonging to a given data set and associate it to the
    nearest centroid. When no point is pending, the first step is completed and an
    early groupage is done. At this point we need to re-calculate k centroids as barycenters
    of the clusters resulting from the previous step. After we have these k centroids,
    a new binding has to be done between the same data set points and the nearest
    centroid. A loop has been generated. By a result of this loop we notice that the
    k centroids change their location by step until no more changes are done. In other
    words centroids do not move any more.


    Finally, this algorithm aims at minimizing an objective function, in the data
    set a squared error function. The objective function


    ```

    $$\pm = \sum_{j=1}^{k} \sum_{i=1}^{n} ||x^{(i)} - c_j||^2$

