  md: '# String Methods


    Many of the operations on strings are expressed as methods. A method is sort of
    a function that lives only inside values of a certain type. To call a method,
    use this syntax:


    ```

    expr.method(arg, arg, ...)

    ```


    where each arg is an argument to the method, just like an argument to a function.


    For example, any string value has a method called center that produces a new string
    with the old value centered, using extra spaces to pad the value out to a given
    length. This method takes as an argument the desired length. Here''s an example:


    ```

    >>> star = ""

    >>> star.center(5)

    ```


    ```

    '' *   ''

    ```


    The following sections describe some of the more common and useful string methods.


    .center(): Center Some Text


    Given some string value s, to produce a new string containing s centered in a
    string of length n, use this method call:


    ```

    s.center(n)

    ```


    This method takes one argument n, the size of the result. Examples:


    ```

    >>> k = "Ni"

    >>> k.center(5)

    ```


    ```

    '' Ni   ''

    ```


    ```

    >>> "<->".center(12)

    ```


    ```

    ''    <->    ''

    ```


    Note that in the first example we are asking Python to center the string "Ni"
    in a field of length 5. We can''t center a 2-character string in 5 characters,
    so Python arbitrarily adds the leftover space character before the old value.


