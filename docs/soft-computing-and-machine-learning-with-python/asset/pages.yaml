    Supervised learning is the most common technique for training neural networks
    and decision trees. Both of these techniques are highly dependent on the information
    given by the pre-determined classifications. In the case of neural networks, the
    classification is used to determine the error of the network and then adjust the
    network to minimize it, and in decision trees, the classifications are used to
    determine what attributes provide the most information that can be used to solve
    the classification puzzle. We’ll look at both of these examples more in detail,
    but for now, it would be sufficient to know that both of these examples thrive
    on having “supervision” in the form of pre-determined classifications.


    Inductive machine learning is the process of learning a set of rules from instances
    (examples in a training set), or more generally speaking, creating a classifier
    that can be used to generalize from new instances. The process of applying supervised
    ML to a realistic problem is described in Figure F. The first step is collecting
    the dataset. If a expert is available, then s/he could suggest which fields (attributes,
    features) are the most informative. If not, then the simplest method is that of
    “bruteforce,” which means measuring everything available in the hope that the
    right (informative, relevant) features are isolated. However, a dataset collected
    by the “brute-force” method is not directly suitable for induction. It contains
    in most cases noise and missing feature values, and therefore requires significant
    pre-processing according to Zhang et al. (2002).


    The second step is the data preparation and data pre-processing. Depending on
    the circumstances, researchers have a number of methods to choose from handling
    missing data (Batista, 2003). Hodge et (Hodge, 2004), have recently introduced
    a survey of contemporary techniques for outlier (noise) detection. These researchers
