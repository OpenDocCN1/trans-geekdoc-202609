    # DATA SKEWNESS


    A dataset for modelling is perfectly balanced when the percentage of occurrence
    of each class is 100/n, where n is the number of classes. If one or more classes
    differ significantly from the others, this dataset is called skewed or unbalanced.
    Dealing with skewed data can be very tricky. In the following sections we explore,
    based on our experiments and literature reviews, some problems that can appear
    when dealing with skewed data. Among other things, the following sections will
    explain the need for stratified sampling, how to handle missing values carefully
    and how to define an objective function that takes the different costs for each
    class into account.


    # Missing Values


    Missing values are of little importance when dealing with balanced data, but can
    become extremely harmful or beneficial when dealing with skewed data. See how
    the example looks harmful at first glance, but indeed exposes a very powerful
    characteristic.


    Table 1 shows an example of a characteristic called Transaction Amount. By looking
    at the first line of the table one may conclude that the number of missing values
    is small (1.98%) and decide not to investigate any further. Breaking it down into
    fraudulent and legitimate transactions, one can see 269 (32.5%) data items whose
    values are missing are frauds, which is nearly 9 times bigger than the overall
    fraud rate in our dataset (1,559/41,707 = 3.74%) see Table 2).


    Table 1: Fraud/legitimate distribution


    | Population | # transaction | # missing | % missing |

    |---|---|---|--|

    | Total | 41707 | 825 | 1.98% |

    | Fraud | 1559 | 269 | 17.26% |

    | Legitimate | 40148 | 556 | 1.39% |


    Investigating even further, by analysing the fraud rates by ranges shown that
    the characteristic being analysed helps to predict fraud; on the top of this,
    missing values seem to be the most powerful attribute for this characteristic.'
