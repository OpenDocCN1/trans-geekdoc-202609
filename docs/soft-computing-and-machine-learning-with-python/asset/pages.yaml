    # # TYPES OF MACHINE LEARNING ALGORITHMS


    Taiwo Oladipupo Ayodele


    University of Portsmouth United Kingdom


    # MACHINE LEARNING: ALGORITHMS TYPES


    Machine learning algorithms are organized into taxonomy, based on the desired
    outcome of the algorithm. Common algorithm types include:


    +   - Supervised learning --- where the algorithm generates a function that maps
    inputs to desired outputs. One standard formulation of the supervised learning
    task is the classification problem: the learner is required to learn (to approximate
    the behavior of) a function which maps a vector into one of several classes by
    looking at several input-output examples of the function.

    - Unsupervised learning --- which models a set of inputs: labeled examples are
    not available.


    Citation: Taiwo Oladipupo Ayodele (February 1st 2010). “Types of Machine Learning
    Algorithms", New Advances in Machine Learning Yagang Zhang, IntechOpen, DOI: 10.5772/9385.


    Copyright: © 2010 by authors and Intech. This paper is an open access article
    distributed under a Creative Commons Attribution 3.0 License'
  merge: -1
  img_proc: true
- pgno: 45
  md: '+   - Semi-supervised learning --- which combines both labeled and unlabeled
    examples to generate an appropriate function or classifier.


    +   - Reinforcement learning --- where the algorithm learns a policy of how to
    act given observation of the world. Every action has some impact in the environment,
    and the environment provides feedback that guides the learning algorithm.


    +   - Transduction --- similar to supervised learning, but does not explicitly
    construct a function: instead, tries to predict new outputs based on training
    inputs, training outputs, and new inputs.


    +   - Learning to learn --- where the algorithm learns its inductive bias based
    on previous experience.


    The performance and computational analysis of machine learning algorithms is a
    branch of statistics known as computational learning theory.


    Machine learning is about designing algorithms that allow a computer to learn.
    Learning is not necessarily involves consciousness but learning is a matter of
    finding statistical regularities or other patterns in the data. Thus, many machine
    learning algorithms will barely remember how human might approach a learning task.
    However, learning algorithms can gain insight into the relative difficulty of
    learning in different environments.


    # Supervised Learning Approach


    Supervised learning is common in classification problems because the goal is to
    get the computer to learn a classification system that we have created. Digit
    recognition, once again, is a common example of classification learning. More
    generally, classification learning is appropriate for any problem where deducing
    a classification is useful and the classification is easy to determine. In some
    cases, it might not even be necessary to give predetermined classifications to
    every instance of a problem if the agent can work out the classifications for
    itself. This would be an example of unsupervised learning in a classification
    context.


    Supervised learning often leaves the probability for inputs undefined. This model
    is not needed as long as the inputs are available, but some of the input values
    are missing, it is not possible to infer anything about the outputs. Unsupervised
    learning, all the observations are assumed to be caused by latent variables, that
    the observations is assumed to be at the end of the causal chain. Examples of
    supervised learning and unsupervised learning are shown in the figure 1 below:'
