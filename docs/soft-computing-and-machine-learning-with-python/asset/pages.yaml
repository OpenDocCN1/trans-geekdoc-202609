    # HOW TO WRITE A SELF-EXECUTING PYTHON SCRIPT


    So far we have used Python’s conversational mode to demonstrate all the

    features. Now it’s time to learn how to write a complete program.


    Your program will live in a file called a script. To create your script, use

    your favorite text editor (emacs, vi, Notepad, whatever), and just type your

    Python statements into it.


    How you may make it executable depends on your operating system.


    +   - On Windows platforms, be sure to give your script file a name

    that ends in “py”. If Python is installed, double-clicking on any

    script with this ending will use Python to run the script.

    - Under Linux and MacOS X, the first line of your script must look

    like this:

    - #pythonpath


    The pythonpath tells the operating system where to find Python. This

    path will usually be “usr/local/bin/python”, but you can use the “which”

    shell command to find the path on your computer:


    ```

    $ which python

    /usr/local/bin/python

    ```


    Once you have created your script, you must also use this command to

    make it executable:

