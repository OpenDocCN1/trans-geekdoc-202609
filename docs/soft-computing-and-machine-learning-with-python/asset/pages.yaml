    Total accuracy is the proportion of observations correctly classified:


    ```

    $Acc = \frac{1}{n|T_E|} \sum_{x_i \in T_E} (y_i = C_k)$

    ```


    where $n|T_E|$ is the number of observations in the testing set. In spite of being
    an important indicator of the measure of the general prediction''s quality, the
    total accuracy is not an informative measure of the errors in each class. For
    example, a general accuracy of 80% can represent an error-free prediction for
    the C1 class, and an error of 40% for the C2 class. In the educational scenario,
    it is preferable to have lower error in the prediction of the low achievement
    class, as students at risk of academic failure compose this class. So, the sensitivity
    will be preferred over general accuracy and specificity. The sensitivity is the
    rate of observations correctly classified in a target class, e.g. C1 = low achievement,
    over the number of observations that belong to that class:


    ```

    $Sens = \frac{\sum_{y_i \in T_E} 1(y_i = C_1)}{\sum_{y_i \in T_E} (C_1)}$

    ```


    Specificity, on the other hand, is the rate of correctly classified observations
    of the non-target class, e.g. C2 = high achievement, over the number of observations
    that belong to that class:'
