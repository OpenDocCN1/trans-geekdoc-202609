    Figure 4: Parallelization of the platform implementation.


    +   (1) Data Parallelization. We identify each module in the compiler (obj files
    used) as a different portion of data to work in parallel. This obj files can be
    combined in lib or exe files to produce bigger modules. In the example in Figure
    4, three different modules are processed in parallel.


    +   (2) Task Identification. The tasks to be parallelized are those identified
    as modules in the platform architecture (Section 3). As shown in Figure 4, an
    additional initialization task was defined to initialize the database and create
    a temporary folder where the input files are copied.


    +   (3) Task Dependency. After identifying the tasks, we defined the dependencies
    among them with a Directed Acyclic Graph (DAG). These dependencies define when
    two tasks can run in parallel, and when a task has to wait for others to end.
    As shown in Figure 4, the instrumentation, compilation, binary pattern extraction,
    generalization, and classification tasks can run in parallel. For the same piece
    of data, one has to wait for the previous to complete. The initialization (at
    the beginning) and dataset generation (at the end) tasks cannot be parallelized.
    The last one waits for all the classification tasks to process all the data.


    +   (4) Task Implementation. Tasks should be mapped to threads or processes. The
    current implementation uses the Python programming language to combine all the
    different modules of the architecture (implemented in Python itself or C++). Since
    most implementations of Python use the Global Interpreter Lock (GIL) to synchronize
    the execution of threads [20], we implemented'
