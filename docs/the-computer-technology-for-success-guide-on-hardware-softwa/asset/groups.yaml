    be impossible, and it would be impossible for banks to keep these purchases secure.
    Information technology has also made it faster and easier than ever to send or
    receive money. It’s now also easier to open an online small business to sell whatever
    you want. If you don’t want to have to file for a domain name, set up a website,
    and all the other steps required for registering an online business, you can use
