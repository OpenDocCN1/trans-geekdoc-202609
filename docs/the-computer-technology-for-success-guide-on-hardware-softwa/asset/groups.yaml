    计算机相关学科。理解数据库管理软件、操作系统工具、开发环境和网络平台软件以及企业资源计划工具也有帮助。


    ## 计算机系统分析师 – 这项工作也被称为系统架构师，要求对 IT（信息技术）和业务系统都有理解。与许多信息技术职业一样，该工作的典型背景是计算机或信息科学领域的学士学位，但也有人是在学习商业甚至文科之后后才从事这一工作。强大的计算机技能是必不可少的，通常包括编程工具、数据库管理软件和开发环境软件。同时，从事这项工作的人必须能够应用计算机系统解决工作流、库存控制和生产流程等业务管理问题。随着越来越多的企业转向云计算，该领域的工作将会增长。根据劳工统计局（BLS）的数据，2018年该工作的中位薪资为88,000美元。


    ## 信息安全分析师 – 这是 IT 领域增长最快的工作之一，根据 BLS 数据，预计到2028 年将增长32%。这些职位的人士负责保护公司网络和系统免受网络攻击。这些工作通常需要计算机相关专业的学士学位，并具备一些
    IT 领域的经验。该领域的专业人士需要使用开发环境工具，以及网络监控、操作系统和特定的安全工具。根据 BLS 数据，2018 年该工作的中位薪资为98,000美元。


    从这份列表中可以看出，IT 职位代表了高薪、快速增长的职业路径。同样明显的是，其中许多职业的第一步是获得学士学位。在高等教育的背景下，计算机科学主要侧重于编程和软件开发，而信息技术是对与业务运营相关的计算机系统和网络的研究。其中任何一种都可以成为在该领域获得卓越职业的基石。学生还可能选择专攻网络安全等特定的计算机相关领域，或者通过获得相关领域的硕士学位继续深造。无论你的具体路径如何，Leavitt
    和 Whistler 在 1958 年看到的正在新兴的 IT 机会世界在今天仍在增长，且没有尽头。


    ## 信息技术包含什么？


    “信息技术”一词已扩展到涵盖一系列技术和相关学科。IT 仍然由基于计算机的信息系统组成，包括计算硬件、操作系统（OS）、应用程序软件以及处理以产生有用信息的数据。随着时间的推移，这些
    IT 组件和功能都变得越来越复杂，涵盖了不断增长的技术和方法论子集。例如，应用程序开发最初是一个相对线性的过程，系统分析师和程序员创建代码来实现业务目的。它现在已演变为一种更具合作性和有机的过程，体现了应用创建流程，例如
    DevOps 和敏捷软件开发。即使是操作系统——让服务器和客户端计算机运行的基础代码——也承担了新的维度。可视化和容器化等技术已经打破（或至少改变了）操作系统与宿主机硬件之间的纽带。结果是，IT
    不仅仅发生在本地；云计算环境现在补充甚至取代了传统数据中心的本地部署资源。所有这些发展都使 IT 变得更加复杂，并要求 IT 员工具备更高的专业化以及新的角色和职责。


    ## 哪些兴趣和价值观与计算机信息技术相关？


    CIT（计算机信息）学生通常对新技术充满热情。他们好奇、富有创造力、耐心且负责。他们喜欢协助新技术的应用和创建，并能够独立工作或在小组环境中工作。CIT 学生通常对计算机、问题解决、游戏和音乐感兴趣。他们应该具备良好的口头和面交流能力，并擅长处理和组织数值数据。


    ## 哪些职业领域与计算机信息技术相关？


    - 计算机与信息科学

    - 计算机工程

    - 计算机工程技术

    - 计算机编程

    - 计算机科学

    - 计算机软件与媒体应用

    - 计算机系统管理

    - 计算机系统网络与电信

    - 计算机系统分析

    - 数据输入与微型计算机应用

    - 制图/CAD/设计技术

    - 电气设备安装/维护/维修

    - 信息处理/数据输入技术

    - 信息科学与研究

    - 管理信息系统/服务

    - 数学与计算机科学

    - 机械制图/CAD 技术

    - 技术/工业艺术教师教育


    ## 为什么信息技术很重要？


    简单来说，如果没有运行 IT 系统，大多数机构的工作将变得极其缓慢。你很难找到一家至少部分依赖计算机和连接它们的网络的企业。维持标准的服务水平、安全性和连接性是一项巨大的任务，但这并不是他们面临的唯一优先级或潜在挑战。越来越多的公司想要实施更直观、更复杂的解决方案。首席信息安全官兼技术博客
    Edward Kiledjian 表示：“IT 可以为公司提供超越、领先于并交付优于竞争对手的产品所需的优势。”让我们来看看当前和未来的 IT 专家将处理的需求：


    **数据过载：** 企业需要处理海量数据。数据需要大量的处理能力、复杂的软件和人类分析技能。


    **移动和无线使用：** 越来越多的雇主提供远程办公选项，这需要使用带有无线热点和漫游能力的智能手机、平板电脑和笔记本电脑。


    **云服务：** 大多数企业不再运营自己的“服务器场”来存储大量数据。许多企业现在与云服务第三方托管平台合作，由这些平台维护数据。


    **视频托管的带宽：** 视频会议解决方案变得越来越，因此需要更多的网络带宽来充分支持它们。


    根据这些需求的数量，根据劳工统计局（BLS）的数据，你可能不会感到意外，预计从2016年2026年，计算机和信息技术职业的就业人数将增长13%，这快于所有职业的平均水平。*

