    ## Information technology and the health sector:


    The use of information technology has helped in improved patient care all over.
    Patients using the internet can now communicate with expert physicians from their
    home via virtual healthcare application systems. Also, tele-medicines, electronic
    health records, and health grids have resulted in a greater impact on delivering
