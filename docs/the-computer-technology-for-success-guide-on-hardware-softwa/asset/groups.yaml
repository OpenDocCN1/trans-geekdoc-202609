    IT 包含了多层物理设备（硬件）、虚拟化、管理系统、自动化工具、操作系统以及用于执行基本功能的其他系统软件和应用程序。如上所述，用户设备、外围设备和软件也可以包含在
    IT 领域。IT 也可以指管理数据使用和存储的架构、方法和法规。


    ## 软件


    软件分为两类：系统软件和应用程序。

    系统软件涵盖管理基本计算功能的计算机程序。它们包括：


    - 操作系统 (OS)；

    - 基本输入输出系统 (BIOS)；

    - 启动程序；

    - 汇编器；以及

    - 设备驱动程序。


    业务应用包括：


    - 数据库，例如 SQL Server；

    - 交易系统，例如实时订单输入；

    - 电子邮件服务器，如 Microsoft Exchange

    - Web 服务器，如 Apache 和微软的 Internet 信息服务 (IIS)；

    - 客户关系管理 (CRM)，例如 Oracle NetSuite 和 HubSpot；以及

    - 企业资源计划 (ERP) 系统，如 SAP S/4HANA。


    这些应用利用程序指令来为了业务目的对数据进行操纵、整合、分散或其他其他方式的处理。


    运行在智能手机、平板电脑和其他便携设备上的移动应用通常通过互联网连接云端或数据中心应用。这些应用扩展了计算范围，并创建了一类需要特殊专业知识来维护的新型软件和电信。


    ## 硬件


    有许多不同的计算机硬件。计算机服务器运行业务应用。在客户端-服务器模型中，服务器与客户端设备交互。它们还通过计算机网络与其他服务器进行通信，这些网络通常连接到互联网。


    存储是另一种类型的硬件。它是任何以数据形式承载信息的技术。存储可以是特定服务器上的本地存储，也可以在许多服务器之间共享，并可以安装在现场，也可以通过云服务访问。存储的信息可以采取许多形式，包括文件、多媒体、电话以及
    Web 和传感器数据。存储硬件包括易失性随机存储器 (RAM) 以及非易失性磁带、硬盘驱动器和固态硬盘。


    电信设备由网卡 (NIC)、电缆、无线通信和交换设备组成，将硬件元素连接在一起并到外部网络。


    ## 硬件与软件


    你已经知道处理硬件和软件是 IT 部门工作的大部分内容，但什么算作硬件？什么是软件？让我们来详细区分这一重要区别。硬件包括计算机系统的所有物理部分。这包括安装在计算机内部的硬件，如主板、中央处理器和硬盘。硬件还描述可以连接到计算机外部的组件，如键盘、鼠标和打印机。但请记住，某些平板电脑和较小的笔记本电脑将键盘和鼠标等集成在设备内部。基本上，硬件是指任何与计算机及其网络相关的你可以物理触摸和操纵的部件、组件或设备。与硬件不同，软件不是你可以物理改变的东西。软件涵盖了所有电子形式存储的数据、应用程序和程序，例如操作系统或视频编辑工具。那么这种区别如何适用于
    IT 职业呢？几乎每份 IT 工作都需要硬件和软件方面知识的结合。某些 IT 工作人员可能会花费更多时间在配置硬件组件上，但这些组件也受软件的控制。此外，IT
    专业人员负责为用户部署和设置软件应用程序。


    ## IT 职业机会


    现在你了解了 IT 部门的一般职责，你可能在好奇内部具体的角色是什么。以下你可以在许多 IT 部门中找到的一些职位：


    计算机支持专家在前线工作，排除任何技术问题，包括软件问题、计算机崩溃和硬件故障。这些专家可能还会协助高级 IT 成员处理更大规模的网络问题。


    网络系统管理员关注大局，即网络系统的整体和性能。


    计算机系统分析师在幕后工作，将 IT 与业务解决方案相结合。他们通常在技术公司工作。


    信息安全分析师负责组织计算机网络的安全，进行测试并开发公司范围的安全实践。


    请记住，这些职位将根据公司规模而变化。在较小的公司，你的大部分日常工作将围绕打印机等平庸事务，但另一方面，你可能被要求更像一个全才。在大型公司，IT 员工拥有更多样化的关注领域，有些人可能会进入管理和战略规划职位，而另一些人可能会追求网络安全等专业领域。


    ## 信息技术与计算机科学


    计算机科学家实际上是科学家。他们关注计算理论。这意味着他们理解计算机程序背后的“为什么”。利用算法和高级数学，计算机科学家发明了处理传输信息的新方法。计算机科学家通常关注软件、操作系统和实现。就像《矩阵》中的
    Neo 一样，计算机科学家可以看到并理解代码。计算机科学的学生将学习不同编程语言的基础知识、线性和离散数学以及软件设计和开发。计算机科学家研究机器本身，并理解各种计算机过程之所以运作。简单来说，计算机科学家可以与计算机交流。该领域建立在数学（计算机的语言）的基础上。计算机科学家理解计算机如何工作，并可以创建一个实现你要求的程序或操作系统。


    ## 计算机科学职业


    计算机科学是一个快速发展的领域，预计其就业机会将大幅增加。高薪通常与计算机科学职业相关。如果你正在攻读计算机科学学位，以下职业路径向你开放：


    应用软件开发人员：作为应用程序和程序背后的创意大脑，软件开发者为计算机和技术设备设计并构建程序和应用程序。《愤怒鸟》？是软件开发者开发的。微软 Office？那是软件开发者开发的。软件开发人员的中位工资为
    98,260 美元。


    系统工程师：操作系统为计算机和设备运行提供基础。微软 Windows、Linux 和 iOS 是操作系统类型的示例。系统工程师为个人电脑、手机甚至汽车设计并创建这类系统。根据
    PayScale 的数据，系统工程师的中位工资为 76,593 美元。


    Web 开发人员：Web 开发人员不是图形设计师。图形设计师创建你在网站上看到的图像；Web 开发人员编写使网站运行的代码。Web 开发人员将图形、音频和视频集成到网站，并监控流量、性能和容量。


