    # IT career opportunities


    Now that you know the general responsibilities of an IT department, you may be
    wondering what the individual roles are within. Here are some of the positions
    that you’ll find in many IT departments:


    Computer support specialists work on the front lines troubleshooting any technology
    issues including software issues, computer crashes and hardware trouble. These
    specialists may also assist senior-level IT members with larger-scale network
    issues.


    Network systems administrators focus on the big picture of the network system,
    security and performance.


    Computer systems analysts work behind the scenes to marRY IT with smart business
    solutions. They usually specialize in a particular industry while working for
    a technology firm or work directly in an industry, like finance or government.


    Information security analysts are responsible for the security of an organization’s
    computer networks, conducting tests and developing company-wide best security
    practices.'
  - '[PAGE 26]


    Keep in mind that some of these roles will change depending on the size scope
    of the company. In smaller companies, most of your daily work will revolve around
    relatively mundane things like troubleshooting printers, but on the other hand,
    you may be required to be more of a jack-of-all-trades with broader knowledge.
    With large firms, IT employees have a more diverse array of potential focus areas
    some may work upward into management and strategic planning roles, while others
    may pursue specialized areas like cybersecurity.'
  - '[PAGE 27]


    # Information technology vs. computer science


    # Computer Science


    Computer scientists are, in fact, scientists. They are focused with the theory
    of computational applications. That means they understand the “why” behind computer
    programs. Using algorithms and advanced mathematics, computer scientists invent
    new ways to manipulate and transfer information. Computer scientists are generally
    concerned with software, operating systems and implementation. Like Neo In The
    Matrix, computer scientists can see and make sense of code. Computer science students
    will learn the fundamentals of different programming languages, linear and discrete
    mathematics, and software design and development. Computer scientists study the
    machine itself and understand how and why various computer processes operate the
    way they do. Simply put, computer scientists can talk to computers. The field
    is based in mathematicsôí the language of computers. Computer scientists understand
    why computers work and can create a program or operating system that does what
    you want it to do.'
  - '[PAGE 28]


    # Careers in Computer Science


    Computer science is a rapidly growing field and is expected to see large increases
    in employment opportunities. High salaries are generally associated with computer
    science careers. If you''re pursuing a computer science degree, the following
    career paths are open to you:


    **Applications Software Developer:** As the creative minds behind applications
    and programs, software developers design and build programs and applications for
    computers and technological devices. Angry Birds? A software developer made that.
    Microsoft Office? That would be software developers again. The median salary for
    a software developer is $98,260.


    **Systems Engineer:** Operating systems provide the foundation for computers and
    devices to function. Microsoft Windows, Linux, and iOS are examples of types of
    operating systems. Systems engineers design and create those types of systems
    for use in personal computers, phones, and even cars. According to PayScale, the
    median pay for systems engineers is $76,593.


    **Web Developer:** Web developers are not graphic designers. Graphic designers
    create the images you see on websites; web developers program the code that makes
    a website function. Web developers integrate the graphics,'
  - '[PAGE 29]


    audio, and video into the site and monitor the site’s traffic, performance, and
    capacity.'
  - '[PAGE 30]


    Information technology (IT) may adopt the monik information systems or systems
    administration. Essentially, IT professionals are the users of technology. IT
    utilizes existing operating systems, software and applications in tandem to create
    a larger system that solves a specific business problem. IT constructs a network
    from established building blocks to carry out a task, such as an automated supplies
    ordering service. Due to the nature of the work, IT professionals are more likely
    to interact with clients and co-workers outside of their department. They may
    help explain to a client how to solve technology problems or work with executives
    and business owners to construct a technology plan that will meet their business
    needs. IT students will study network and database design in depth, and receive
    an introduction to basic theory and applied mathematics. Successful IT candidates
    will possess strong critical thinking skills; IT professionals are tasked with
    resourcefully and cost-effectively applying the tools at their disposal.'
