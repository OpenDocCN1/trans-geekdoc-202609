    ## Remote accessibility:


    Advancements in information technology systems provide access to your company’s
    electronic network from many other places other than the office itself. You can
    now work from home, or even from the road. This increases one’s productivity and
    work keeps coming in even when one is not physically present in office. Mobility
    is now so commonplace that most people don’t even notice it!


    ## Disadvantages of information and communication technology


    ### Reduction in available job opportunities for humans


    Organizations consider technology a better “employee” when it’s utilized in the
    production processes of the business. Not only can work be finished on time, but
    also certain processes can be automated for ease of operation. Hence, software
