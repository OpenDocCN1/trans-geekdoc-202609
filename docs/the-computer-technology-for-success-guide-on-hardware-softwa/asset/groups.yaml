    # Introduction


    Computer and Information Technology is a minor within the Department of Computer
    and Information Science. For many people, information technology (IT) is basically
    synonymous with the guys and gals you call when you need help with a computer
    issue. While that view of information technology isn’t totally wrong, it drastically
    understates the scope of this critical career field.


    If you’re looking to get a better handle on what information technology is and
    the many facets of this field, then you’ve come to the right place. We’ve done
    the digging for you and spoke with IT industry pros to create this helpful beginner’s
    guide to the field.


    Information technology (IT) is the use of any computers, storage, networking and
    other physical devices, infrastructure and processes to create, process, store,
    secure and exchange all forms of electronic data. Typically, IT is used in the
    context of business operations, as opposed to technology used for personal or
    entertainment purposes. The commercial use of IT encompasses both computer technology
    and telecommunications.


    Information technology (IT) is the use of any computers, storage, networking'
  - '[PAGE 4]


    and other physical devices, infrastructure and processes to create, process, store,
    secure and exchange all forms of electronic data.


    The Harvard Business Review coined the term information technology to make a distinction
    between purpose-built machines designed to perform a limited scope of functions,
    and general-purpose computing machines that could be programmed for various tasks.
    As the IT industry evolved from the mid-20th century, computing capability increased,
    while device cost and energy consumption decreased, a cycle that continues today
    when new technologies emerge.'
  - '[PAGE 5]


    # What Is Information Technology?


    Computer information technology (CIT) is the use and study of computers, networks,
    computer languages, and databases within an organization to solve real problems.
    The major prepares students for applications programming, networking, systems
    administration, and internet development. Technologies studied in information
    systems include programming, networking, server administration, information security,
    database design and development, systems analysis and designing, and web development.
    The most basic information technology definition is that it''s the application
    of technology to solve business or organizational problems on a broad scale. No
    matter the role, a member of an IT department works with others to solve technology
    problems, both big and small.


    There are three primary pillars of responsibility for an IT department:


    **IT governance:** This refers to the combination of policies and processes that
    ensure IT systems are effectively run and in alignment with the organization''s
    needs.


    **IT operations:** This is a catchall category for the daily work of an IT department.
    This includes providing tech support, network maintenance,'
  - '[PAGE 6]


    security testing and device management duties.


    # **Hardware and infrastructure:** This focus area refers to all the physical
    components of IT infrastructure. This pillar of IT includes the setup and maintenance
    of equipment like routers, servers, phone systems and individual devices like
    laptops.


    Even though an organization’s IT department handles many different functions and
    plays a critical role in keeping things running, Andrey Prokopchuk, head of IT
    at Belitsoft, says the perfect IT department is the one you aren’t even aware
    of. This means that they are able to automate and create processes for many of
    their daily tasks, so that the business continues to run smoothly. The ideal IT
    department is also aligned with the business’s goals and transparent in its processes
    in a way that the rest of the business can understand and provide input on.'
  - '[PAGE 7]


    # Information Technology Examples


    When it comes to career paths in information technology, examples run from tiny
    consulting firms to huge multinational corporations, and from highly technical
    specialties to management ladders that demand strong people skills. Here are some
    examples of routes you might choose:


    Computer Support Specialist – These positions require bachelor’s degree and are
    a good fit if you enjoy answering questions about computer software and hardware,
    setting up equipment, and training computer users. People in this position need
    to have a strong grasp of many kinds of software, including database interface
    programs, development of environment tools and operating system software. The
    median annual pay for this job is $53,000, and positions in this field are growing
    faster than average, according to BLS.


    Network and Computer Systems Administrator – This job often require bachelor’s
    degree in a computer-related field, though some employers may only ask for an
    associate degree or postsecondary certificate. Either way, these jobs are often
    available to professionals without prior work experience in the field, and BLS
    reports that they paid a median salary of $82,000 in 2018. Daily tasks in this
    job could include maintaining computer network hardware and software, backing
    up data and troubleshooting network'
