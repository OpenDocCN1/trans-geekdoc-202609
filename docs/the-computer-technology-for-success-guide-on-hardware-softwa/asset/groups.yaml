    - 信息技术在医疗健康中的重要\n- 信息技术在安全中的重要\n- 学习信息技术的 5 个理由\n- 信息技术的优势\n- 经济进步：\n- 信息技术与教育：\n\
    - 信息通信技术的缺点\n- 结论\n\n# 引言\n\n计算机与信息技术是计算机信息科学系的一个辅修。对于很多人来说，信息技术（IT）基本上等同于当你遇到计算机问题时找的人。虽然这种观点并非完全错误，但它大大低估了这一关键职业领域的范围。\n\
    \n如果你希望更好地了解信息技术以及该领域的许多方面，那么你来对地方了。我们已经为你完成了调研，并与 IT 行业专业人士交流，了这份实用的入门指南。\n\n\
    信息技术（IT）是使用任何计算机、存储、网络和其他物理设备、基础设施和流程，来创建、处理、存储、保护和交换所有形式的电子数据。通常，IT 用于业务运营背景，而不是用于个人或娱乐目的的技术。IT\
    \ 的商业用途涵盖了计算机技术和电信。\n\n信息技术（IT）是使用任何计算机、存储、网络和其他物理设备、基础设施和流程，来创建、处理、存储、保护和交换所有形式的电子数据。\n\
    \n《哈佛商业评论》提出了“信息技术”一词，以区分用于执行有限范围功能的专用机器与可以为各种任务编程的通用计算机器。随着 IT 行业从 20 世纪中期开始发展，计算能力不断提高，而设备成本和能耗不断降低，这种循环在今天新技术出现时仍在继续。\n\
    \n# 什么是信息技术？\n\n计算机信息技术（CIT）是在组织内部使用和研究计算机、网络、计算机语言和数据库来解决实际问题。该专业为学生从事编程、网络、系统管理和互联网开发做准备。信息系统中学习的技术包括编程、网络、服务器管理、信息安全、数据库设计与开发、系统分析与设计以及\
    \ Web 开发。最基础的信息技术定义是应用技术在大规模范围内解决业务或组织问题。无论担任什么角色，IT 部门的成员都与他人合作解决各种大小不同的技术问题。\n\
    \nIT 部门有三个主要的责任支柱：\n\n**IT 治理：** 这指的是政策和流程的结合，确保 IT 系统有效运行并与组织需求保持一致。\n\n**IT\
    \ 运营：** 这是 IT 部门日常工作的统称。这包括提供技术支持、网络维护、安全测试和设备管理职责。\n\n**硬件与基础设施：** 这一关注领域指的是\
    \ IT 基础设施的所有物理组件。IT 的这一支柱包括路由器、服务器、电话系统和笔记本电脑等个人设备的安装和维护。\n\n尽管组织的 IT 部门处理许多不同的功能，并在保持业务运行方面发挥着着性作用，但\
    \ Belitsoft 的 IT 负责人 Andrey Prokopchuk 表示，完美的 IT 部门是你甚至察觉不到的那一个。这意味着他们能够为许多日常任务实现自动化并创建流程，使业务能够顺畅运行。理想的\
    \ IT 部门还与业务目标保持一致，并在流程上保持透明，以便业务的其他部分能够理解并提供建议。\n\n# 信息技术示例\n\n涉及信息技术的职业路径时，示例从微型咨询公司到大型跨国公司不等，从高技术专业领域到需要强大人际技巧的管理阶梯。以下是一些你可能选择的路线示例：\n\
    \n- 计算机支持专家 – 这些职位需要学士学位，如果你喜欢回答有关计算机软件和硬件的问题、设置设备以及培训计算机用户，那么这些职位非常适合你。该职位的人员需要熟悉各种软件，包括数据库接口程序、环境工具开发和操作系统软件。根据美国劳工统计局（BLS），这份工作的中位年薪为\
    \ 53,000 美元，该领域的增长速度快于平均水平。\n\n- 网络和计算机系统管理员 – 这份工作通常需要计算机相关领域的学士学位，尽管某些雇主可能仅要求副科学学位或专科证书。无论如何，这些工作通常对没有该领域之前工作经验的人士开放，BLS\
    \ 报告显示，2018 年的中位薪为 82,000 美元。该工作的日常任务可能包括维护计算机网络硬件和软件、备份数据和排除网络问题。要从事这项工作，你需要了解如何使用数据库管理软件以及网络监控和\
    \ Web 开发工具。\n\n- 计算机网络架构师 – 这是网络管理员职业阶梯的提升，通常需要学士学位和 IT 领域的领域经验。该职位的人员设计并构建网络，例如内网、局域网（LAN）和广域网（WAN）。根据\
    \ BLS，2018 年此类工作的中位薪为 109,000 美元。网络架构师通常需要理解各种软件系统，包括管理工具、开发环境软件和操作系统。这项工作通常还包含人情味，因为网络架构师可能需要与客户以及销售和营销人员合作，满足客户需求并确保账户设置正确。\n\
    \n- 数据库管理员 – 这一快速发展的领域涉及财务信息和客户发货记录等数据的保护和安全。这些工作通常位于为其他公司服务的专业公司中，或保险等数据密集型行业。根据\
    \ BLS，2018 年这项工作的中位薪为 90,000 美元。大多数雇主期望该职位的候选人拥有信息或\n\n"
