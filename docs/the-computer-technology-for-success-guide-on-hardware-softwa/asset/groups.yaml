    IT includes several layers of physical equipment (hardware), virtualization, management
    systems, automation tools, operating systems, other system software and applications
    used to perform essential functions. As noted above, user devices, peripherals
    and software can be included in the IT domain. IT can also refer to the architectures,
    methodologies and regulations governing the use and storage of data.'
