    computer-related discipline. It’s also helpful to understand database management
    software, as well as operating system tools, development environment and web platform
    software, and tools for enterprise resource planning.


    ## Computer Systems Analyst – This job, also known as system architect, demands
    an understanding of both IT and business systems. As with many information technology
    careers, the typical background for the job is a bachelor’s degree in a computer
    or information science field, but some people come to this work after studying
    business or even liberal arts. Strong computer skills, often including programming
    tools, database management software and development environment software are a
    must. At the same time, people doing this work must be able to apply computer
    systems to address business management issues like workflow, inventory control
    and production processes. As more businesses move into cloud computing, work in
    this area will grow. The median pay for the job was $88,000 in 2018, according
    to BLS.


    ## Information Security Analyst – This is one of the fastest-growing jobs in IT,
    with an expected 32% increase by 2028, according to BLS. Professionals in these
    positions shield company networks and systems from cyber attacks. These jobs generally
    require a bachelor’s degree with a computer-related major, plus some experience
    in the IT field. Professionals in this field need to use development environment
    tools, as well as network monitoring and operating software and specific security
    tools. The median wage in this job was $98,000 in 2018, according to BLS.


    It''s clear from this list that positions in IT represent high-paying, fast-growing
    career paths. It''s also clear that the first step toward many of them is earning
    a bachelor''s degree. Within the higher education context, computer science is
    largely focused on programming and software development, while information technology
    is the study of computer systems and networks as they relate to the operation
    of a business. Either can be the foundation for a great career in the field. Some
    students may also choose to specialize in particular computer-related areas like
    cyber security or continue their education with a master''s degree in a related
    field. Regardless of your specific path, the world of opportunities in IT that
    Leavitt and Whistler saw emerging back in 1958 is still growing today, with no
    end in sight.


    ## What does information technology encompass?


    The term information technology has grown to embrace an array of technologies
    and related disciplines. IT still comprises basic computer-based information systems,
    including computing hardware, operating systems (OSes), application software and
    the data that is processed to produce useful information. Over time, each of these
    IT components and functions have become more complex, embracing ever-growing subsets
    of technologies and methodologies. For example, application development began
    as a relatively linear process where systems analysts and programmers created
    code to achieve a business purpose. It has evolved into a more cooperative and
    organic process that embodies application creation processes, such as DevOps and
    agile software development. Even operating systems—the basic code that makes servers
    and client computers work—have taken on new dimensions. Technologies such as visualization
    and containerization have broken, or at least changed, the bond between OSes and
    host hardware. As a result, IT no longer just happens locally; cloud computing
    environments now complement and even replace on-premises resources of the traditional
    data center. All these developments have made IT more complex and require greater
    specialization and new roles and responsibilities from the IT workforce.


    ## What interests and values are related to computer information technology?


    CIT students are usually enthusiastic about new technology. They are curious and
    creative, patient and responsible. They enjoy assisting in the application and
    creation of new technology, and have the ability to work both independently and
    in a group setting. Students of CIT are usually interested in computers, problem
    solving, games, and music. They should have good oral and written communication
    skills, and should be good at working with and organizing numerical data.


    ## What career fields are related to computer information technology?


    - Computer & Information Sciences

    - Computer Engineering

    - Computer Engineering Technology

    - Computer Programming

    - Computer Science

    - Computer Software & Media Applications

    - Computer System Administration

    - Computer System Networking & Telecommunication

    - Computer Systems Analysis

    - Data Entry & Microcomputer Application

    - Drafting/CAD/Design Technology

    - Electrical Equipment Installation/Maintenance/Repair

    - Information Processing/Data Entry Technology

    - Information Science & Studies

    - Management Information Systems/Services

    - Mathematics & Computer Science

    - Mechanical Drafting/CAD Technology

    - Technology/Industry Arts Teacher Education


    ## Why is information technology important?


    Simply put, the work of most organizations would slow to a crawl without functioning
    IT systems. You’d be hard-pressed to find a business that doesn’t at least partially
    rely on computers and the networks that connect them. Maintaining a standard level
    of service, security and connectivity is a huge task, but it’s not the only priority
    or potential challenge on their plates. More and more companies want to implement
    more intuitive and sophisticated solutions. “IT can provide the edge a company
    needs to outsmart, outpace and out-deliver competitors,” says Edward Kiledjian,
    a Chief Information Security Officer and technology blogger. Let’s take a look
    at the needs that current and future IT specialists will be working on:


    **Data overload:** Businesses need to process huge amounts of data. Data requires
    large amounts of processing power, sophisticated software and human analytical
    skills.


    **Mobile and wireless usages:** More employers are offering remote work options
    that require use smartphones, tablets and laptops with wireless hotspots and roaming
    ability.


    **Cloud services:** Most businesses no longer operate their own “server farms”
    to store massive amounts of data. Many businesses now work with cloud services
    third-party hosting platforms that maintain that data.


    **Bandwidth for video hosting:** Videoconferencing solutions have become more
    and more popular, so more network bandwidth is needed to support them sufficiently.


    Based on the volume of these needs, you probably won’t be surprised to learn that
    employment of computer and information technology occupations is projected to
    grow 13 percent from 2016 to 2026, which is faster than the average for all occupations,
    according to the Bureau of Labor Statistics.*

