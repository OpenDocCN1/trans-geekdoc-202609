- pgno: 22
  md: '# Hardware


    There are many different types of computer hardware. Computer servers run business
    applications. Servers interact with client devices in the client-server model.
    They also communicate with other servers across computer networks, which typically
    link to the internet.


    Storage is another type of hardware. It''s any technology that holds information
    as data. Storage may be local on a specific server or shared among many servers,
    and it may be installed on premises or accessed via a cloud service. Information
    that is stored can take many forms, including file, multimedia, telephony, and
    web and sensors data. Storage hardware includes volatile random-access memory
    (RAM) as well as non-volatile tape, hard disk drives and solid-state drives.


    Telecom equipment, comprising network interface cards (NICs), cabling, wireless
    communications and switching devices, connect the hardware elements together and
    to external networks.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Hardware vs. software


    You know that working with hardware and software is a large part of an IT department’s
    work, but what counts as hardware? And what’s software? Let’s break down this
    important distinction. Hardware includes all the physical parts of a computer
    system. This includes hardware installed inside the computer like the motherboard,
    central processing unit and hard drive. Hardware also describes components that
    can be connected to the outside of a computer like a keyboard, mouse and printer.
    Keep in mind though some tablets and smaller laptops integrate items like a keyboard
    and a mouse within the device. Basically, hardware is any part, component or device
    related to computers and their networks that you can physically touch and manipulate.
    Unlike hardware, software is not something you can physically change. Software
    encompasses all the data, application and programs stored electronically, like
    an operating system or a video-editing tool. So how does this distinction apply
    to an IT career? Nearly every IT job requires a blend of hardware and software-based
    know-how. Some IT workers may spend more time working with configuring hardware
    components, but those components are also governed by software. Additionally,
    IT professionals are responsible for deploying and setting up software applications
    for users.'
  merge: -1
  img_proc: true
