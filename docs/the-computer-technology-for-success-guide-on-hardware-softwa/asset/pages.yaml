  md: '# Information Technology Examples


    When it comes to career paths in information technology, examples run from tiny
    consulting firms to huge multinational corporations, and from highly technical
    specialties to management ladders that demand strong people skills. Here are some
    examples of routes you might choose:


    Computer Support Specialist – These positions require bachelor’s degree and are
    a good fit if you enjoy answering questions about computer software and hardware,
    setting up equipment, and training computer users. People in this position need
    to have a strong grasp of many kinds of software, including database interface
    programs, development of environment tools and operating system software. The
    median annual pay for this job is $53,000, and positions in this field are growing
    faster than average, according to BLS.


    Network and Computer Systems Administrator – This job often require bachelor’s
    degree in a computer-related field, though some employers may only ask for an
    associate degree or postsecondary certificate. Either way, these jobs are often
    available to professionals without prior work experience in the field, and BLS
    reports that they paid a median salary of $82,000 in 2018. Daily tasks in this
    job could include maintaining computer network hardware and software, backing
    up data and troubleshooting network'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'problems. To do this work, you need to know how to use database management
    software, as well as network monitoring and web platform development tools.


    Computer Network Architect – This is a step up the career ladder for a network
    administrator and usually re qires bachelor’s degree and previous experience in
    the IT field. People in this position design and build networks, such as intranets,
    local area networks (LANs) and wide area networks (WANs). Median pay for this
    kind of work was $109,000 in 2018, according to the BLS. Network architects often
    need to understand a variety of software systems, including administration tools,
    development environment software and operating system programs. There’s also often
    an element of human touch to this job since network architects may need to work
