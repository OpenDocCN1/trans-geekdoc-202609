    data-heavy industries like insurance. The median pay for this work was $90,000
    in 2018, according to BLS. Most employers expect candidates for the jobs to have
    a bachelor’s degree in an information- or'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'computer-related discipline. It’s also helpful to understand database management
    software, as well as operating system tools, development environment and web platform
    software, and tools for enterprise resource planning.


    # Computer Systems Analyst – This job, also known as system architect, demands
    an understanding of both IT and business systems. As with many information technology
