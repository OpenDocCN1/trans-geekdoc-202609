  md: '# What does information technology encompass?


    The term information technology has grown to embrace an array of technologies
    and related disciplines. IT still comprises basic computer-based information systems,
    including computing hardware, operating systems (OSes), application software and
    the data that is processed to produce useful information. Over time, each of these
    IT components and functions have become more complex, embracing ever-growing subsets
    of technologies and methodologies. For example, application development began
    as a relatively linear process where systems analysts and programmers created
    code to achieve a business purpose. It has evolved into a more cooperative and
    organic process that embodies application creation processes, such as DevOps and
    agile software development. Even operating systems the basic code that makes servers
    and client computers work have taken on new dimensions. Technologies such as visualization
    and containerization have broken, or at least changed, the bond between OSes and
    host hardware. As a result, IT no longer just happens locally; cloud computing
    environments now complement and even replace on-premises resources of the traditional
    data center. All these developments have made IT more complex and re qu greater
    specialization and new roles and responsibilities from the IT'
  merge: -1
  img_proc: true
