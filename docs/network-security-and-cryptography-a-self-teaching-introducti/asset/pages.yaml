    # 8.3.7.4 Characteristics of a Hash Function


    The purpose of a Hash Function is to produce a “fingerprint” of a file or a message
    or a block of data. To be useful for message authentication, a hash function H
    must satisfy the following properties:


    +   1. **H can be applied to a block of data of any size.**


    +   2. **H produces a hash value $h$ of fixed size.**


    +   3. **One-Way Property:** For a given $x$, it should be easy to compute its
    hash value $h = H(x)$. And for a given hash value $h$, it should be computationally
    infeasible to compute $x = H^{-1}(h)$. This is called the One-Way Property.


    +   4. **Weak Collision Resistance:** For any given $x$, it should be computationally
    infeasible to find $y \neq x$ such that $H(y) = H(x)$. This property is called
    Weak Collision Resistance.


    +   5. **Strong Collision Resistance:** It should be computationally infeasible
    to find a pair $(x,y)$ such that $H(y) = H(x)$. This property is called Strong
    Collision Resistance.


    The “One-Way Property” refers to the feature that it is easy to generate the hash
    value of a given message $M$, but it is impossible to determine $M$ from being
    given $h = H(M)$. The property of “Weak Collision Resistance”'
  merge: -1
