    # 3.3.3 Security Mechanisms


    In , the security mechanisms are defined under two major categories:


    +   - Specific Mechanisms

    - Pervasive Mechanisms


    +   1. Specific Security Mechanisms – A Security Mechanism that pertains to a
    particular layer of protocol is called a specific security mechanism. The specific
    security mechanisms are further subdivided into following sub-categories:


    +   A. Enciphering/Deciphering: The mechanism of Enciphering (Encryption) refers
    to the use of mathematical algorithms that along with a key plaintext to cipher-text.
    Deciphering refers to the mathematical algorithms that along with a secret key
    cipher-to-plaintext. Only one key is used for enciphering and deciphering in case
    of symmetric cryptography and two (but related) keys are used for enciphering
    and deciphering for public key cryptography. The mathematical operations performed
    in enciphering and deciphering are mainly substitution and permutation.


    +   B. Digital Signature: It refers to the block of data that comprises a hash
    value (called a message digest) of the message, encrypted using the sender''s
    private key and appended to the sender''s end prior to its transmission. It is
    feasible only in Public Key Cryptography (not in Symmetric Cryptography). The
    digital signature serves the following purposes:


    +   - It proves the identity of the sender (called data origin); that is, it attempts
    to assure the recipient about the identity of the alleged sender of data. The
    recipient verifies the signature by deciphering using sender''s public key.'
