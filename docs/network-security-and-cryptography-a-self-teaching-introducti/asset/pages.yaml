    # 5.3.2 Rectangular Transposition Cipher


    +   - The scheme uses a key that is communicated to the intended recipients by
    secure means. The length of the key is N.


    +   - The key comprises N digits in the range 1 ... N, with each digit appearing
    precisely once.


    **Encryption:** For encryption, the plain-text is written row by row in rectangular
    form, with each row having N elements. Some dummy letters may have to be appended
    at the end to complete the rectangle formed by the message.


    Then, the message is read off, column by column, permuting the order of the columns
    in accordance with the key. Supposing the key is 4312, column 3 is read off first,
    followed by column 4, column 2, and finally column 1.


    **Decryption:** For decryption, the received text is divided into N equal groups.
    Each group is written as a column, in accordance with the key. Then the resulting
    rectangle is read off row by row, thus forming the original plaintext.


