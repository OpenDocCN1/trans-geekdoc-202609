  md: '# SECURITY OF EMERGGING TECHNOLOGY • 521


    +   **Self-Organization:** In WSN no fixed infrastructure exists, hence, every
    node is independent, having properties of adaptation to the different situations,
    and maintains self-organizing and self-healing properties.


    +   **Data Freshness:** Each message transmitted over the channel is new and fresh.
    It guarantees that the old messages cannot be replayed by any node. This can be
    solved by adding some time-related counter to check the freshness of the data.


    # 14.7.3 The Attack Categories in WSNs:


    +   **Outider vs. Insider attacks:** Outer attacks are external attacks and the
    insider attacks are internal attacks. An outsider attack comes from outside the
    WSN. With the help of an Outer attack the bad data is inserted in the network
    for the services interruption. An insider attack is also known as the internal
    attack; these attacks come from the inside of the WSN.


    +   **Passive vs. Active Attacks:** Passive attacks include eavesdropping on or
    monitoring packets exchanged within the WSN; in active attacks, an attacker has
    the capability to remove or modify the messages during the transmission on the
    network.


    +   **Mote-Class versus Laptop-Class attacks:** In Monte-class attacks, an adversary
    attacks a WSN by utilizing a few nodes with similar capabilities to the network
    nodes; in laptop-class attacks, an adversary can use more powerful devices to
    attack a WSN. These devices have greater transmission range, processing power,
    and energy reserves than the network nodes.'
