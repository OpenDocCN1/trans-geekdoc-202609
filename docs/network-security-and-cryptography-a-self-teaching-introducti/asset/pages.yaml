    # 2. Direct Signature with Data Confidentiality by Public Key Encryption


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_374_0.png)


    The validity of a direct digital signature depends on the security of the sender’s
    private key. If a sender later wishes to deny the sending of a message, he or
    she can claim that his or her private key was lost or stolen and that else has
    forged it or her signature. Such ploys can be thwarted to a great extent by including
    a time stamp (date/time) and by making prompt reporting of compromised private
    keys to a central authority mandatory.


    # 8.4.2 Arbitrated Digital Signature


    This addresses the problems associated with Direct Signatures. Every signed message
    from a sender X to receiver Y first goes to an arbitrator A. The arbitrator verifies
    the message and ensures that it is encrypted using a private key that was not
    compromised at the time of signing the message. Then the arbitrator time-stamps
    the message and sends it to the intended receiver Y, with an indication that it
    has been verified to the satisfaction of the arbiter. Various modes of Arbitrated
    Digital Signature are as:


    # 1. Conventional Encryption: Arbitrator can see the Message


    +   * A. X → Y: M || E_{K_{xy}}[ID_X || H(M)]

    * B. A → Y: E_{K_{ay}}[ID_X || E_{K_{xy}}[ID_X || H(M)]] || T


