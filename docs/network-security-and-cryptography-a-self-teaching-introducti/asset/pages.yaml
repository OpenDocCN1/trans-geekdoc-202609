- pgno: 249
  md: '# MODERN SYMMETRIC CIPHERS ∙ 225


    Figure 6.2 depicts a general Feistel Cipher Structure for Encryption with $n$
    identical rounds of processing. The inputs to the Encryption Algorithm comprise
    (i) a plaintext block of length $2w$ bits and (ii) a key $K$. The plaintext is
    divided into two halves $L_0$ and $R_0$ of $w$ bits, each are fed to Round 1 of
    the encryption algorithm. The data passes through $n$ rounds of processing and
    produces a cipher-text block of size $2w$ bits, as the size of the input plaintext.
    The inputs to round $i$ are denoted as $L_{i-1}$ and $R_{i-1}$, which are derived
    from the output of the previous round, and a sub-key $K_i$, which is derived from
    the overall key $K$. In general, the sub-keys are different from each other and
    also different from the overall key $K$.


    All the rounds of processing have the same general structure. A substitution is
    performed on the left half of the data by taking the XOR (Exclusive OR) of the
    Left Half with the output of function $F$, which has the Right Half Data and Sub-Key
    $K$ as inputs. The function $F$ has the same structure for each round, and it
    is parameterized by the sub-key $K_i$, which is different for each round. Following
    the substitution of the Left Half, a Permutation is performed on the data by switching
    the two halves. So, each round performs the right-hand input, without any change,
    into the left-hand output with the output of function $F$ that operates on the
    right-hand input acted upon by a 48-bit sub-key. So, in each round, only half
    of the Input gets transformed, and the other half remains unchanged. In fact,
    one half of the input data is used to transform the other half, and the two halves
    are swapped.


    The Decryption Algorithm is exactly the same as the Encryption Algorithm, except
    that the sub-keys are applied to the decryption rounds in reverse order, that
    is, key $K_s$ is applied to round 1, and key $K_i$ is applied to round 16 of decryption.'
