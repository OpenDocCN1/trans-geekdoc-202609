  md: 'PUBLIC-KEY CRYPTOGRAPHY FOR DATA CONFIDENTIALITY • 293


    +   - The algorithm can be used for data confidentiality as well as for digitally
    signing the messages to assure source authentication, data integrity, and source
    non-repudiation.


    +   - The strength of the algorithm lies in the extent of difficulty encountered
    in factoring a large composite number into its prime factors.


    # 7.4.1 Main Components


    +   - Determination of Keys


    +   - Encryption Algorithm


    +   - Decryption Algorithm


    # 7.4.1.1 Determination of Keys


    A User (Say “A”) computes its private key and public key as follows:


    +   - Choose two prime numbers $p$ and $q$. (The larger the prime numbers, the
    more difficult it would be to break the cipher).


    +   - Compute $n = pq$


    +   - Compute $\Phi(n) = (p - 1)(q - 1)$


    +   - Choose an integer $e$ such that $e$ is less than $\Phi(n)$ and relatively
    prime to $\Phi(n)$, that is, GCD $(e, \Phi(n)) = 1$. Note that $e$ will always
    be odd, since $\Phi(n)$ is even.


    +   - Compute $d$ as the multiplicative inverse of $e$ mod $\Phi(n)$


    ```

    $D = e - 1 \(mod \Phi(n))$

    ```


    Thus, $e$ and $d$ form multiplicative inverses of each other $(mod \Phi(n))$.


    +   - The pair $(e, n)$ forms the Public Key of the user “A”, which is made public
    and distributed to other users in the cryptosystem.


    +   - The pair $(d, n)$ forms the Private Key of the user “A,” which keeps secret;
    it is not known to anyone except “A”.'
