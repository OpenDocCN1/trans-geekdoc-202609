  md: '# 2.9.1 Continuous versus Discrete Random Process


    A continuous-time random process is one that has both a continuous random variable
    and continuous time. Noise in transistors and wind velocity are examples of continuous
    random processes. So are the Wiener process and Brownian motion. A discrete-time
    random process is one in which the random variables are discrete, that is, a sequence
    of random variables. The binomial counting and random walk processes are discrete
    processes. It is also possible to have a mixed or hybrid random process which
    is partly continuous and partly discrete.


    # 2.9.2 Deterministic versus Non-Deterministic Random Process


    A deterministic random process is one for which the future value of any sample
    function can be predicted from the knowledge of the past values. For, consider
    a random process described


    ```

    $X(t) = A\cos(\omega t + \Phi) \quad (2.79)$

    ```


    Where $A$ and $\omega$ are constants and $\Phi$ is a random variable with a known
    probability distribution. Although $X(t)$ is a random process, one can predict
    its future values and hence $X(t)$ is deterministic. For a nondeterministic process,
    each sample function is a function of time and its future values cannot be predicted
    from the past values.


    # 2.9.3 Stationary versus Nonstationary Random Process


    A stationary random process is one in which the probability density function of
    the random variable does not change with time. In other words, a random process
    is stationary when its statistical characteristics are timeinvariant, that is,
    not affected by a shift in time origin. Thus, the random process is stationary
    if all marginal and joint density functions of the process are not affected by
    the choice of time origin. A nonstationary random process is one in which the
    probability density function of the random variable is a function of time.


    # 2.9.4 Ergodic versus Nonergodic Random Process


    An ergodic process is one in which every member of the ensemble possesses the
    same statistical behavior as the entire ensemble. Thus, for ergodic processes,
    it is possible to determine the statistical characteristic by examining only one
    typical sample function; that is, the average value and'
