  md: '# 34 * NETWORK SECURITY AND CRYPTOGRAPHY


    Queuing theory is applied in several scientific disciplines such as computer systems,
    traffic management, operations, production, and manufacturing. It plays a significant
    role in modeling computer communication networks.


    Reduced to its most basic form, a computer network consists of communication channels
    and processors (nodes). As message flow from node to node, queues begin to form
    different nodes. For high traffic intensity the waiting or queuing time can be
    dominant, so that the performance of the network is dictated by the behavior of
    the queues at the nodes. Analytical derivation of the waiting time requires the
    knowledge of queuing theory.


    This chapter provides a cursory review of the basic mathematical concepts needed
    throughout this book for computer networking and security. A reader already well-versed
    in these concepts may skip this chapter.


    # 2.2 PROBABILITY FUNDAMENTALS


    A fundamental concept in probability theory is the idea of an experiment. An experiment
    (or trial) is the performance of an operation that leads to results called *outcomes*.
    In other words, an outcome is a result of performing the experiment once. An *event*
    is one or more outcomes of an experiment. The relationship between outcomes and
    events is shown in the Venn diagram of Figure 2.2. Thus,


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_58_0.png)


    FIGURE 2.2 Sample space (rectangle) illustrating the relationship between outcomes
    (dots) and events (cirles).'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# MATHEMATICAL FOUNDATIONS FOR COMPUTER NETWORKS • 35


    An experiment consists of making a measurement or observation.

    An outcome is a possible result of an experiment.

    An event is a collection of outcomes.


    An experiment is said to be random if its outcome cannot be predicted. Thus, a
    random experiment is one that can be repeated a number of times but yields unpredictable
    outcomes at each trial. Examples of random experiments are tossing a coin, observing
    the number of cars arriving at a toll booth, and keeping track of the number of
    telephone calls on your iPhone.


    # 2.2.1 Simple Probability


    We define the probability of an event. The probability of event A is the number
    of ways A can occur divided by the total number of possible outcomes. Suppose
    we perform $n$ trials of an experiment and observe that outcomes satisfying event
    A $n_A$ times. We define the probability $P(A)$ of event A occurring as


    ```

    $P(A) = \lim_{n\to\infty} \frac{n_A}{n}$ (2.1)

    ```


    This is known as the relative frequency of event A. Two key points should be noted
    from Equation (2.1). First, we note that the probability P of an event is always
    a positive number and that


    ```

    $0 \le P \le 1$ (2.2)

    ```


    where $P = 0$ (0%) when an event is not possible (never occurs or is impossible)
