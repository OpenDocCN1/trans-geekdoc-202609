- pgno: 401
  md: '# AUTHENTICATION SCHEMES • 377


    +   - Encrypt the Hash value $H(M)$ using an RSA Algorithm and Private Key $(d,
    n)$


    Sign = (H(M))^d \mod n.


    +   - The Signature is appended to the message $M$ and transmitted to the intended
    recipient.


    # 8.8.1.3 Signature Verification


    Figure 8.17 illustrates the Signature verification. The recipient of the signed
    message verifies the Signature as follows:


    +   - Computes the Hash Value of the received message $M$.


    +   - Decrypts the Sign using the sender''s public key $(e, n)$ and extracts the
    hash value of the message that was computed at the sender end.


    $H(M) = (Sign)^n \mod n = ((H(M))^d \mod n$


    +   - Compares the hash value of the message computed at the recipient end with
    the one computed at the sender end. If both match exactly, the signature is considered
    to be verified.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_401_0.png)


    FIGURE 8.17 A schematic diagram of the Signature verification.


    # Example 8.1: RSA Signature Scheme


    Let $p = 11, q = 7$

    Then $n = p \times q = 77$

    $\Phi(n) = 10 \times 6 = 60$'
