- pgno: 146
  md: '# 3. Data Confidentiality – This service protects the transmitted data against
    passive attacks. This is achieved by encrypting the data in such a way that only
    the intended recipient, having access to the decryption key, can decrypt the cipher-text;
    any adversary should find it extremely difficult to decrypt it.


    # 4. Data Integrity – In a connection-oriented environment, the Data Integrity
    Service assures that the messages are delivered to the intended recipient without
    duplication, insertion, modification, reordering, or replay. Any destruction of
    data is also considered a loss of data integrity. In a connectionless communication,
    the Data Integrity Service is provided at an individual datum level. The service
    attempts to assure the recipient against any alteration of message in transit.
    This can be achieved by computing the Cyclic Redundancy Check (CRC) value of the
    message at the sender end and appending it to the message prior to its transmission.
    At the recipient end, the message CRC is re-computed and compared with the CRC
    value received along with the message; if both values match, then the message
    is considered to be received without any alteration in transit and data integrity
    is considered to be.


    # 5. Non-repudiation – This service prevents the sender of a message from refuting
    having sent a message. If a sender refutes having sent a message, the service
    enables the recipient to prove beyond doubt that the message was sent only by
    the alleged sender. This can be achieved by requiring the sender to sign the message
    using its private key. The signature can be verified by the recipient using the
    sender’s public key. The recipient can save the sender’s signature along with
    the received message for ensuring source non-repudiation. The service should also
    prevent the recipient from later denying received the message. When a message
    has been delivered to the intended recipient, the sender can prove that the message
    was in fact received by the alleged recipient; this can be achieved by requiring
    the recipient to acknowledge of message. The acknowledgement can be saved by the
    sender for ensuring the recipient non-repudiation.


    # 6. Availability – The availability service assures that system resources are
    made available to the authorized entities, as per the accepted specs, and when
    the authorized entities request these resources. It provides protection against
    “Denial-of-Service” Attacks. For its functioning, the service'
