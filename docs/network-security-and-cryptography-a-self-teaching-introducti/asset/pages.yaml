  md: '# 8.7.1 Difference between MD5 and SHA-1


    Though the design of SHA-1 is based on the design of MD5, there are some major
    differences between the two, which are tabulated here in Table 8. 2.


    | Parameter | MD5 | SHA-1 |

    | --- | --- | --- |

    | Input Message Size | Any Size | < 2^32 bytes |

    | Message Digest Size | 128 bits | 160 bits |

    | Number of Processing Steps per round | 16 | 20 |

    | Format of Data Storage | Little-Endian | Big-Endian |

    | Additive Used in Step Processing | 64 random and distinct Size – one per Step
    | 4 Additive Constants – one per Round |


    The other parameters like the block size of 512 bits, size of 32 bits, four steps
    per processing round, and the size of logical and arithmetic functions used in
    processing of MD5 and SHA-1 are identical. The concept of padding is also similar
    in both.


    # 8.7.2 Various Upgrades of SHA


    SHA has many upgrades with increasing levels of security, like SHA-256, SHA-384,
    and SHA-512; the numeric part represents the size of the Message Digest Output.
    Though some of the parameters like 4 processing rounds, 20 steps per round, and
    a Big-endian format of data storage remain the same in all the upgrades, there
    are some major differences in other parameters. A parameter-wise comparison of
    the upgrades is tabulated in Table 8.3.


    | Parameter | SHA-1 | SHA-256 | SHA-384 | SHA-512 |

    | --- | --- | --- | --- | --- |

    | Input Message Size | < 2^32 bytes | < 2^32 bytes | < 2^32 bytes | < 2^32 bytes
    |

    | Message Digest Size | 160 bits | 256 bits | 384 bits | 512 bits |

    | Processing Block Size | 512 bits | 512 bits | 1024 bits | 1024 bits |

    | Word Size | 32 bits | 32 bits | 64 bits | 64 bits |'
