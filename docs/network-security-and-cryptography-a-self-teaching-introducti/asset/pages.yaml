- pgno: 293
  md: '# 6.8.2 Generation of Sub-Keys in IDEA


    IDEA encryption/deryption uses 52 sub-keys: Six sub-keys are in each round, and
    the remaining 4 sub-keys are used in the final output transformation. The sub-keys
    are generated from the overall 128-bit key as follows:


    +   1. The first 128-bit overall key is divided into 8 16-bit sub-keys. The first
    six are used in the first round, and the remaining two are used as the first two
    sub-keys of the second round.

    2. The 128-bit overall key is rotated left by 25 bits and again divided into 8
    16-bit sub-keys. Four are used in the second round, and the remaining 4 are used
    in the third round.

    3. Step (2) is repeated to generate all the remaining sub-keys.


    # 6.8.2.1 Decryption Algorithm in IDEA


    The decryption in IDEA is exactly same as encryption, except that the sub-keys
    are applied as follows:


    +   * The sub-keys applied in decryption are in reverse order vis-à-vis the sub-keys
    applied in encryption.

    * The sub-keys applied to the addition blocks in decryption are the additive inverse
    of the sub-keys applied to the addition blocks in encryption.

    * The sub-keys applied to the multiplication blocks in decryption are multiplicative
    inverses of the sub-keys applied to the multiplication blocks in encryption.


    # 6.8.2.2 Why is multiplication performed modulo (2¹⁶ + 1)?


    +   * The decryption algorithm uses multiplicative inverses of the sub-keys used
    for multiplication operations in the encryption algorithm, each sub-key must have
    its multiplicative inverse defined.

    * 2¹⁶ + 1 = 65537 is a prime number. All integers $n$ ($0$” $2^{16}$) will have
    their multiplicative inverses defined except integer value zero.

    * To ensure integer value zero also has its multiplicative inverse defined, this
    value is taken as $2¹⁶ = -1$, and $(-1) \mod(2¹⁶+1)$ will be congruent to $2¹⁶$.
    Thus, zero will have its multiplicative inverse = $2¹⁶ = 0$.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '+   Therefore, all integers $n$ ($0$ '''' $2^{16}$) will have their multiplicative
    inverses-defined, thus making the decryption process feasible.


    +   Thus, in IDEA, the multiplicative inverse of 0 is 0. (Actually, in Modular
    Arithmetic, the multiplicative inverse of 0 does not exist).


    # ### 6.8.2 Speed of IDEA and Strength of IDEA


    IDEA implementations are considered to be twice as fast as DES.


    IDEA''s key size is 128, which is more than twice fast as DES. For a Brute Force
    attack, it would require the order of $2^{127}$ encryptions to recover the key.
    For a chip that can test billions of keys per second, it would take $10^{13}$
    years (longer than the age of universe) to recover the key. An array of 1034 such
    chips will require a day, but sufficient silicon does not exist on the earth to
    make 1034 keys. So, brute force is not the way to recover the key.


    The designers have done their best to make the algorithm immune to Differential
    Cryptanalysis. IDEA is claimed to be immune to differential cryptanalysis after
    the first four rounds.


    # ### 6.8.3 IDEA Modes of Operation


    It can work with any mode of Block Cipher Operation. It is used extensively for
    encryption of sensitive information such as banking data. It forms part of popular
    Pretty Good Privacy (PGP) used for the security of e-mails.


    # ### 6.9 ADVANCED ENCRYPTION STANDARD (AES)


    The Advanced Encryption Standard (AES) is a Symmetric Cipher Standard that was
    adopted by the U.S. Government in 2002 as a replacement for 3-DES.


    **Major Parameters:**


    +   - Plaintext Block Size: 128 bits


    +   - Key Size: 128 bits (caters to 192-bit and 256-bit key-size also)


    +   - Number of Rounds: 10/12/14 (depending on key-size; 10 rounds for 128-bit
    key-size, 12 rounds for 192-bit key-size, and 14 rounds for 256-bit key-size)


    +   - Round-Key Size: 128 bits'
