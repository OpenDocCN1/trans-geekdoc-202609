- pgno: 483
  md: '1. Confidentiality: Confidentiality is assured by using Symmetric Cryptography
    (DES, RC4, etc.). The Record Protocol can also be used without encryption. The
    keys for Symmetric Encryption are generated for each connection and are based
    on a secret value negotiated by the TLS Handshake Protocol.


    2. Data Integrity: It provides a message integrity check using MAC. Secure hash
    algorithms (like SHA, MD5, etc.) are used for MAC computations. The Record Protocol
    can also operate without MAC.


    The Record Protocol takes messages to be transmitted, fragments the messages into
    blocks of manageable size, compresses the data (optional), computes MAC for each
    fragment and appends to the fragment, encrypts the resulting block, and transmits
    it. At the recipient end, the data is decrypted, decompressed, verified, and reassembled
    and delivered to the highest-level clients.


    # 12.7.9 TLS Handshake Protocol


    The TLS Handshake Protocol enables the server and the client to authenticate each
    other and to negotiate encryption algorithms and graphic keys before the application
    begins to transmit or receive any data. The TLS Handshake Protocol provides connection
    security with the following features:


    +   1. The peer identity is authenticated using RSA or DSS.


    +   2. Negotiation of a shared secret is made secure. It is made resistant to
    Man-in-the-Middle Attack.


    +   3. No attacker can modify the handshake sequence without being detected.


    The TLS Handshake Protocol comprises a suite of three sub-protocols:


    +   a. Change cipher spec protocol


    +   b. Alert protocol


    +   c. Handshake protocol'
