  md: '# MATHEMATICAL FOUNDATIONS FOR CRYPTOGRAPHY * 171


    Proof:


    By definition of Euler''s Totient Function, an integer $n$ will have precisely
    $\phi(n)$ integers less than $n$ and relatively prime to $n$. The set of those
    $\phi(n)$ integers be:


    ```

    $X = \{x_1, x_2, \dots, x_{\phi(n)}\}$

    ```


    Multiplying the elements of $X$ by $(a \bmod n)$, we get set $Y$:

    Y = \{ax \bmod n, ax \bmod n, \dots, ax_{\phi(n)} \bmod n\}$


    Since $x_i (i=1..phi(n))$ are relatively prime to $n$ and also $a$ is relatively
    prime to $n$, all elements of set $Y$ will be less than $n$ and relatively prime
    to $n$.


    Also, since $x_i(i=1..phi(n))$ are distinct and $a$ is relatively prime to $n$,
    all elements of set $Y$ will be distinct.


    Therefore $Y$ is a set of $\phi(n)$ distinct integers less than $n$ and relatively
    prime to $n$. This is the precise definition of set $X$. Thus, $Y$ is a permutation
    of set $X$.


    Therefore, the product of all elements of set $Y$ will be congruent to the product
    of all elements of set $X$.


    ```

    .. $Y = [(ax \bmod n)(ax \bmod n)\dots\times(ax_{\phi(n)} \bmod n)] \equiv (x_1,
    x_2, \dots, x_{\phi(n)}) \bmod n$

    ```


    Using the identity $a \bmod p b \bmod p = (A \times B) \bmod p$, we get:


    ```

    $(x_1)^{a}(x_2)^{a}\dots\times(x_{\phi(n)})^{a} \equiv (x_1, x_2, \dots, x_{\phi(n)})
    \bmod n$

    ```


    ```

    .. a^{\phi(n)} = \prod_{i=1}^{\phi(n)} x_i \equiv \prod_{i=1}^{\phi(n)} x_i \bmod
    n$

    ```


    Since $\prod_{i=1}^{\phi(n)} x_i$ is the product of integers relatively prime
    to $n$, $\prod_{i=1}^{\phi(n)} x_i$ will also be relatively prime to $n$. Therefore,
    we can divide the above congruence by:


    ```

    .. a^{\phi(n)} = 1 \bmod n

    ```'
