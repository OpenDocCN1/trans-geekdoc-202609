  md: "# 4.5 EUCLID’S ALGORITHM TO DETERMINE GCD\n\n+   - Let $a$ and $b$ be two integers.\n\
    \n+   - The Greatest Common Div (GCD) of $a$ and $b$, denoted by GCD $(a,b)$,\
    \ is defined as a positive integer $c$ that satisfies the following two conditions:\n\
    \n+   1. $c$ should be a divisor of both $a$ and $b$.\n\n+   2. Any divisor of\
    \ $a$ and $b$ should also be divisor of $c$.\n\n+   - Alternatively, $GCD(a,b)$\
    \ can be defined as:\n\n+   $GCD(a,b) = \\max(k, \text{such that } k|a \text{\
    \ and } k|b)$\n\n+   $GCD(a,b) = GCD(a,-b) = GCD(-a,-b)$\n\n+   - Thus, $GCD(a,b)\
    \ = GCD(|a|,|b|)$\n\n+   - Also, $GCD(a,0)=|a|$, since all non-zero integers are\
    \ divisors of 0.\n\n+   - Since $GCD(a,b)$ is independent of the sign of $a$ and\
    \ $b$, we restrict our discussion to the GCD of positive integers only.\n\nAlgorithm\n\
    GCD(a,b) for $a > b \\ge 0$\n\nStep 1: $A \\leftarrow a; B \\leftarrow b$\n\n\
    Step 2: If $B=0$ then return $A = GCD(a,b)$\n\nStep 3: $R = A \text{ mod } B$\n\
    \nStep 4: $A \\leftarrow B$\n\nStep 5: $R \\leftarrow B$\n\nStep 6: go to 2\n\n\
