  md: 'implies that it should be extremely difficult to determine an alternative message
    hashing onto the same value as a given message.


    The property of “Strong Collision Resistance” implies that it should be extremely
    difficult to determine a message pair $(x, y)$ having the same hash value, that
    is, $H(x) = H(y)$.


    These properties are necessary to prevent any forgery of the digital signature
    appended to a message.


    # 8.4 APPLICATION MODES OF DIGITAL SIGNATURES


    Mainly there are two modes of application of Digital Signatures:


    +   - Direct Digital Signature

    - Arbitrated Digital Signature


    # 8.4.1 Direct Digital Signature


    Direct Digital Signature involves only the communicating parties (the Source and
    the intended Recipient). It is assumed that the intended recipient knows the Public
    Key of the Source. A digital signature may be formed either by encrypting the
    entire message or a hash code of the message with the Sender’s Private Key. Data
    Confidentiality can be provided by encrypting the message plus the signature with
    either the intended recipient’s public key (in Public-Key Encryption) or with
    the secret that may be shared with the intended recipient (in symmetric encryption),
    as indicated here:


    +   1. Direct Signature with Data Confidentiality by Symmetric Encryption


    | Source “A” | $E_{K_{AR}}[M || E_{K_{BA}}[H(M)]]$ | Intended Recipient “B” |'
