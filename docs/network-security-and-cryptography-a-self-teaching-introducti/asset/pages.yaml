    **Data Integrity:** It refers to the mechanisms that assure the recipient about
    integrity of a data unit or a data stream. To achieve this, a checksum or CRC
    is computed at the sender end and appended to the data unit. At the recipient''s
    end, a checksum/CRC is computed by the recipient and compared with that received
    from the sender. If both the values match, the data unit is assumed to have been
    received correctly.


    **Traffic Padding:** It refers to the insertion of dummy bits into the gaps among
    the data units so that eavesdroppers are not able to determine the length and
    frequency of messages. It protects the communication against “Traffic Analysis
    Attacks.”


    **Routing Control:** It refers to the mechanisms that enable the sender to select
    physically secure routes for communicating certain sensitive data and change the
    routes without any security breach is suspected.'
