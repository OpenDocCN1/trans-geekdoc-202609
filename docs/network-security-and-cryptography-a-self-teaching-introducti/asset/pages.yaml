- pgno: 560
  md: '+   • Consensus mechanism may trigger a cooperative attack. The consensus mechanism
    of blockchain is based on an assumption that the majority of nodes is honest to
    run and maintain the system.


    # **Potential Risk of Cryptography Application:**


    +   - The issue of private key management is not solved in blockchain. Existing
    blockchain applications usually use private key to confirm a user’s identity and
    complete a payment transaction. Therefore, the precondition that information can''t
    be falsified is the security of private key. Blockchain users are responsible
    for their own private keys, which mean that a private key is generated and taken
    care of by user instead of a third-party. If a user loses his private key, it
    will be impossible to get access to his digital assets on blockchain.


    +   - Wide application of cryptographic algorithm may introduce unknown backdoors
    or vulnerabilities. There is an extensive adoption of cryptographic algorithms
    in blockchain, such as ECC and RSA. Backdoors and security vulnerabilities may
    emerge in the algorithms themselves and the implementation processes. In addition,
    the new computing technologies such as quantum computer can increase the chance
    of cracking the asymmetric encryption algorithms.


    # **Opensource Blockchain Platforms Attract Intensive Attacks:**


    +   - Blockchain platform supports interoperation of different applications and
    users of the upper layer applications. The vast economic benefit motivates hackers
    flocking to digging the security vulnerabilities of open source blockchain platform.


    # **Security Management of Self-organization and Anonymity:**


    +   - Distributed data storage may cause autonomous and frequent data cross border
    in blockchain use cases. Once a new transaction is being added to a block, all
    the data copies should update synchronously.


    +   - Blockchain calculates the hash value of a user’s public key to identify
    a unique user. However, this privacy preserving operation make it impossible verify
    and trace a user’s true identity in network attack backtrack and cybersecurity
    regulation.'
  merge: -1
  img_proc: true
