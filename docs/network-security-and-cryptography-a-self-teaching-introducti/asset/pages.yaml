    With Plaintext $M$ and Secret Key $K$ as inputs, the Encryption Algorithm would
    generate Cipher-text $C = [C_1, C_2, ..., C_n]$. We express the Encryption Process
    as $C = E_K(M)$.


    The Decryption Algorithm would take Cipher-text $C$ and Key $K$ as inputs and
    produce Plaintext $M$ as output. The Decryption can be expressed as $M = D_K(C)$.


    # 3.5.1 Types of Attacks on a Conventional Encryption Scheme


    In general, it is presumed that the Cipher-text $C$ is prone to tapping by an
    adversary during the transit of Cipher-text from Sender to Intended Receiver.
    Also, it can be presumed characteristics of the Encryption/Decryption Algorithm
    may be known to an adversary. An adversary may employ the following approaches
    to attack a conventional encryption scheme:


    +   1. Cryptanalysis – For this type of attack, it is presumed that the attacker
    has full knowledge of the characteristics of the Encryption Algorithm. The attacker
    in this case attempts to analyze a captured cipher-text by exploiting the characteristics
    of the algorithm and the key used for encryption. That is, a Cryptanalyst may
    capture cipher-text $C$ from the communication media and may attempt to recover
    $M$ (*plaintext estimate*) and $K$ (*key estimate*). If an attacker is successful
    in deducing the key $K$, the results will be catastrophic. All the messages encrypted
    with key will be presumed to be compromised.


    +   2. Brute Force Attack – The attacker tries every possible key on a cipher-text
    until an intelligible translation is obtained, which is presumed to be the corresponding
    plaintext. On the average, half of the possible keys would need to be tried to
    attain success. To defeat this approach, the key-space, that is, set of possible
    keys, must be made very large. For example, if the key-size is 128 bits, then
    the attacker must try an average of $2^{127}$ keys, which is extremely large,
    that is, on the order of $10^{38}$.'
