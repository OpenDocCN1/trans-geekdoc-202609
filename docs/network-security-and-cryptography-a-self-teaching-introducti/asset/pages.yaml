  md: 'The Denning Protocol ensures a higher degree of security as compared to the
    Needham Schroeder Protocol, but it relies on Time-Stamps, the efficiency of which
    depends on accurate synchronization of clocks. However, in case of the failure
    of the synchronization of clocks, the scheme would provide ample scope for replay
    attacks.


    Another approach avoids use of time-stamps and instead prevents replay attacks,
    is depicted as follows:


    # 8.5.5 NEUM Protocol


    +   1. A → KDC: $ID_a \parallel N_s$


    +   2. B → KDC: $ID_b \parallel N_b \parallel E_{kd} [ID_a \parallel T_b]$


    +   3. KDC → A: $E_{kb} [ID_b \parallel N_a \parallel K_b] \parallel E_{kd} [ID_a
    \parallel K_b \parallel T_b] \parallel N_b$


    +   4. A → B: $E_{kd} [ID_a \parallel K_b \parallel T_b] \parallel E_{kb} [N_b]$


    where $T_b$ is the time-limit for session key $K_s$ is valid. Let us follow this
    protocol step-by-step:


    +   1. The Nonce $N_s$, sent encrypted by A to B, is returned to A along with
    session key $K_s$ in an encrypted message at Step 2, thus assuring of the timeliness
    of the session key $K_s$.


    +   2. The Nonce $N_b$, sent by B to the KDC is returned back to B along with
    session key $K_b$ in an encrypted message at Step 3, thus assuring B of the timeliness
    of the session key $K_s$.


    +   3. B instructs the KDC about the validation periodicity of the session key
    to be issued, preventing the replay of old session keys.


    +   4. In Step 4, A encrypts the Nonce $N_b$ by the session key $K_s$, which authenticates
    at B that the message has been sent by A and is not a replay message.


    This protocol provides secure means for issue of a session key. This key can be
    used between A and B for multiple sessions, but within the time-limit $T_b$, thus
    avoiding overheads for the issue of a fresh session key. To avoid attacks, $T_b$
    should not have too high a value. Since the time specified is with respect to
    B''s clock, its validity is with respect to B''s clock only. For the repeat session,
    A and B will proceed as follows:'
