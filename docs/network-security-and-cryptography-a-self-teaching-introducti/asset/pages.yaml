  md: '# MATHEMATICAL FOUNDATIONS FOR CRYPTOGRAPHY * 177


    +   - The lowest value of m that satisfies $g^m \equiv 1 \mod n$ is called the
    “Order of $g(mod n)$”.


    +   - If the “Order of $g(mod n)$” equals $\phi(n)$, then integer g is called
    a “Primitive Root of $n$”.


    # 4.11.1.1 Significance of Primitive Roots


    If $g(1 < g < \phi(n))$ is a primitive of positive integer $n$, then its powers
    $\{g^2, g^3, \dots, g^{\\phi(n)}\mod n\}$ are all distinct relatively prime to
    $n$.


    Conversely, we can say that a positive integer g is called a primitive root of
    positive integer $n$, if its powers $\{g, g^2, \dots, g^{\\phi(n)}\mod n\}$ are
    all distinct and relatively prime to $n$.


    If $p$ is a prime number and $g$ is a primitive root of $p$, then the powers $g^2,
    g^3, \dots, g^{p-1}(\mod p)$ will all be distinct and relatively prime to $p$.
    The set of these values will be a permutation of $\mathbb{Z}_p^*=\{1, 2, 3, \dots,
    (p-1)\}$.


    # Example 4.32


    Let $n=7$. Is $g=2$ a primitive root of $n$?


    # Solution


    $\phi(n) = n-1 = 6$. Table 4.19 illustrates the calculation of $y = g^k(\mod n)$
    for $n=7$ and $g=2$.


    TABLE 4.19 Calculation of $y = g^k(\mod n)$


    | X | $g^k$ | $y=g^k(\mod n)$ |

    |---|---|---|

    | 1 | 2 | 2 |

    | 2 | 4 | 4 |

    | 3 | 8 | 1 |

    | 4 | 16 | 2 |

    | 5 | 32 | 4 |

    | 6 = $\phi(n)$ | 64 | 1 |


    2 is not a primitive root of 7, since its powers $2, 2^2, 2^3, \dots, \, 2^6$
    are not distinct (mod 7).'
