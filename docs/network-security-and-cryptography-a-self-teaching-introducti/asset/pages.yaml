- pgno: 321
  md: '# 7.4.2 STRENGTH OF RSA


    Knowing public key $(e, n)$ and plaintext $M$, it is easy to compute Cipher-text
    $C = M \pmod n$ but knowing $C$ and public key $(e, n)$, it is computationally
    difficult to determine $M = \log_C (\pmod n)$. Thus, even if an adversary intercepts
    a cipher-text, it would be computationally infeasible to extract $M$ without knowledge
    of the related public key $(d, n)$.


    To determine the private key $(d, n)$ from the knowledge of public key $(e, n)$,
    the adversary has to follow the following approach.


    +   * Factorize $n$ into its prime factors $p$ and $q$

    * Determine $\Phi(n) = (p - 1)(q - 1)

    * Determine $d \equiv e^{-1} \pmod{\Phi(n)}$


    Since the prime factors of modulus $n$ are chosen to be very high, factorizing
    $n$ is considered to be computationally infeasible. For $n$ having 1024 bits (or
    309 digits) it is considered computationally infeasible to factor it into primes
    $p$ and $q$. To make it more robust, the steps are recommended:


    +   1. The primes $p$ and $q$ should differ in length only by a few digits. Thus,
    for a 1024-bit (309 digits) key, both $p$ and $q$ should be of the order of $10^{75}$
    to $10^{100}$.

    2. $(p - 1)$ and $(q - 1)$ should contain a large prime factor.

    3. GCD $(p - 1, q - 1)$ should be small.


    # 7.4.2.1 Different Types of Attacks on RSA


    RSA is prone to the following types of attacks:


    +   1. Attempt to Determine Private Key without Knowledge of Prime Factors p and
    q of Modulus n.


    To determine the private key of a third party, an adversary may follow any of
    the following approaches:


    +   (a) – Factoring $n$ into primes $p$ and $q$

    * Determining $\Phi(n) = (p - 1)(q - 1)$

    * Computing $d \equiv (e - 1) \pmod{\Phi(n)}$'
