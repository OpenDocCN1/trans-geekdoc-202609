  md: 'distribution through cryptographic means. A Session Key, assigned for a session,
    is used for session and discarded thereafter.


    # 6.10.21 Strength of Encryption Using Master Keys vs. Encryption Using Session
    Keys


    The messages encrypted using master keys are not as safe as the messages encrypted
    using Session Keys. But since the messages encrypted using Master Keys are normally
    very short messages, cryptanalysis of such messages is difficult.


    The Centralized Key Distribution Scheme operates as follows:


    Let us assume that end-user “A” wishes to establish connection with end-user a
    one-time session key. Let $K_A$ be the Master Key that “A” shares with the KDC.
    Similarly, let $K_B$ be the Master Key that “B” shares with the KDC. The Distribution
    of the Session Key would need the following steps:


    +   A” issues a request to the KDC for issue of a Session Key to protect a logical
    connection to “B”. The message includes the identities of “A” and “B” and a unique
    identifier $N_1$ called Nonce. The Nonce may be a time-stamp, counter, or a random
    number. This message is encrypted using Master Key $K_A$, so that only the KDC
    can read the message successfully. Also, it verifies that the message has been
    originated by “A”.


    +   The KDC responds with a message, part of is encrypted using $K_A$, the master
    key shared between KDC and “A.” Since it is encrypted using $K_A$, “A” is the
    only one who can read it successfully. Also, it verifies that the message has
    originated at the KDC. The message includes the following items:


    +   One-time session key K5, assigned for the Session.


    +   The Original Request Message received from “A” and Nonce $N_1$. This is echoed
    back to “A” so to enable “A” to verify that its original request-message was received
    by the KDC unaltered. The presence of Nonce in the message provides verification
    that the message from the KDC is not a replay of some earlier response of the
    KDC. Thus, it prevents masquerade.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '3. The second part of the message is encrypted using $K_b$, that is, master
    key shared between the KDC and “B.” It includes the following data items, intended
    to be delivered to “B.” Since it is encrypted $K_b$, “A” cannot tamper with it.


    +   - One-Time Session Key $K_s$, to be used for the session


    +   - An identifier of W (network address of “A”, i.e., $ID_A$)


    These data items are used by “B” to establish connection with “A.”


    +   4. “A” decrypts the portion of the message encrypted with $K_s$, recovers
    the session key $K_s$, and saves it for use in the upcoming session. Since this
    portion of the message is encrypted using $K_s$, it is also verified that this
    message has originated at KDC.


    +   5. Also, “A” forwards $E_{K_b}[K_s || ID_A]$ to “B.” Because it is encrypted
    with $K_b$, only “B” can read it. “B” decrypts the message, recovers $K_s$, and
    saves it for use in next session with “A.” Now, “B” has the session key $K_s$,
    and also knows the identity of the other party $ID_A$.


    +   6. Encrypted with session key $K_s$, “B” sends a Nonce $N_2$ to “A.”


    +   7. “A” responds to “B” $f(N_2)$ encrypted using $K_s$.


    The last two steps are meant to provide mutual authentication between “A” and
    “B.”


    # Limitations of Centralized Key Control using KDC:


    +   1. The scheme is based on the trust placed by all users in the KDC. The trust
    may be betrayed.


    +   2. If KDC fails, then the scheme will be rendered non-functional. It is an
    “all eggs in one basket” situation.


    # 6.10.2.2 Decentralized Key Distribution


    The Decentralized Key Control Scheme attempts to obviate the limitations of the
    Centralized KDC-based Key Distribution Scheme. The Decentralized Scheme is based
    on the concept that each end-user must be able to establish secure connection
    with any other end-user independently. Figure 6.27 illustrates the Decentralized
    Key distribution schemes.'
