- pgno: 26
  md: '# 2 * NETWORK SECURITY AND CRYPTOGRAPHY


    # 1.2 OPEN SYSTEMS INTERCONNECTION (OSI) MODEL


    The Open Systems Interconnection (OSI) is a reference model that was created by
    the International Organization for Standardization (ISO). The OSI model defines
    a networking conceptual framework to implement protocols in seven layers. It is
    an ideal tool for learning how networks function. The advantage for the OSI model
    to be a layered network model is to simplify the learning of the network and reduce
    its complexity, accelerate velocity, standardize interfaces, ensure interoperability,
    and facilitate modular engineering. Figure 1.1 shows the OSI model.


    | Layer Number | Layer Name | Layer Type | Encapsulation / Protocol Data Unit
    (PDU) | Function |

    |---|---|---|---|--|

    | 7 | Application | Host | Data | Provides network services to user applications.
    This layer does not provide service to any other layer. |

    | 6 | Presentation | Host | Data | Ensures common data format between computers.
    Data representation, encryption and decryption, convert dependent data, machine
    independent data, compression. |

    | 5 | Session | Host | Data | Establishes, manages, and terminates sessions. Maintains
    communication sessions between Host layer applications. |

    | 4 | Transport | Host | Segment | Provides a reliable delivery of segments between
    points on a network. Provides end-to-end reliable transport, error checking, and
    flow control. |

    | 3 | Network | Media | Packet | Provides connectivity and path selection on IP
    addresses. Provides addressing, routing, and delivery of packets between points
    on a network. |

    | 2 | Data Link | Media | Frame | Provides a reliable direct point-to-point data
    connection. Provides access to the media and addressing based on physical MAC
    addresses.'
  merge: -1
  img_proc: true
