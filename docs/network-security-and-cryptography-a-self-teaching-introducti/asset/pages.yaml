    # 5.2.1 Caesar Cipher


    It is believed to have been used by Julius Caesar for communication of secret
    messages. The Caesar Cipher is used to transform messages coded in the English
    alphabet (letters “A” . . . “Z”). Each letter in the plaintext is replaced by
    a letter three places down in the alphabetic sequence, in a cyclic manner, as
    explained in the following:


    +   - Each letter in the alphabet is coded as its numeric equivalent, that is,
    “A”:0, “B”:1, “C”:2, . . “Y”:24, and “Z”:25.


    +   - Let M[o...n-1] represent plaintext n alphabetic characters and let C[O...n-1]
    represent its cipher.


    +   - Then C[i]=(M[i]+3)mod26 for 0<i<n.


    +   - “A” will be substituted by “D”, “B” will be substituted by “E”, . . . “X”
    will be substituted by “A”, “Y” will be substituted by “B” and “Z” will be substituted
    by “C”.


    The Caesar cipher can be made more robust if each letter in the plaintext is substituted
    by a letter that falls k places down in the alphabetic sequence (0<k<26) in a
    cyclic manner, and if the value of k is kept confidential by the sender and the
    recipient. The value of k may be changed from time to time for security reasons.
    Whenever k is changed, the recipient of the message must be informed in advance
    in a secure message. Now, the encryption process can be expressed as:


    ```

    C[i]=(M[i]+k)mod26, for 0<i<n and 0<k<26    (5.1)

    ```'
