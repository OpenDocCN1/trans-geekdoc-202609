    valid except the timestamp field.


    +   - Message Modification: This is similar to a replay attack, but the message
    is modified to cause unwanted behavior in the system. This attack can also involve
    message delay and reordering a message stream.


    +   - Impersonation: This is when the intruder pretends to be an authorized entity
