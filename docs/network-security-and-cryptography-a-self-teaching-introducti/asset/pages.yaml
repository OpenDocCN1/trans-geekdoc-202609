    Proxy-able, and so on. Times will indicate the validity period, and this can be
    post-dated in the Flag.


    Message 3 Ticket Granting Service Request (KRB_TGS_REQ) from C to TGS, for obtaining
    Service Ticket Ticket and a Session Key K_{c,s} for communication between C and
    Application Server V.


    AS→C: Options || ID_e || Times || Nounce_e || Ticket_{tgs} || Authenticator Authenticator_{c1}
