- pgno: 271
  md: "# 6.7.1.3 Strength of Double DES\n\nIt uses two keys, each the size of 56 bits.\
    \ So, the combined key size is 112 bits. Any brute force attack will require an\
    \ effort of the order of $2^{112}$ attempts to break the cipher. However, Double\
    \ DES is prone to a special type of attack known as “Meet-in-the-Middle” Attack,\
    \ which can break the cipher with much less effort.\n\n# 6.7.1.4 “Meet-in-the-Middle”\
    \ Attack on Double DES\n\nThis attack is performed as:\n\n+   - **Step 1**: Take\
    \ a pair of plaintext and cipher-text, say $(P, C)$\n- **Step 2**: Use all possible\
    \ values of key $K_1$ to encrypt the plaintext, and save the output values that\
    \ comprise the intermediate cipher-text $(X)$ in the following table. The table\
    \ will have $2^{56}$ values of $X$ one for each possible value of $K_1$\n\n| $K_1$\
    \ | $X$ |\n|---|---|\n| | |\n\n+   - **Step 3**: Sort the table in ascending or\
    \ descending order of $X$ so that the table can be used for a binary search of\
    \ $X$ values.\n  Now decrypting $C$ for all possible values of $K_2$\n- **Step\
    \ 4**: Decrypt $C$ using the next value of $K_2$ This will produce a value of\
    \ $X$\n- **Step 5**: Carry out a binary search in the previous table to find a\
    \ match for the value of $X$ generated in Step 4.\n- **Step 6**: If a match is\
    \ found for $X$ then the value of $K_1$ (which matches $X$), along with the value\
    \ of $K_2$, selected at Step 4, form the likely key-pair. Now take another plaintext-cipher-text\
    \ pair, say $(P_i, C_i)$ and encrypt the plaintext $P_i$ using the likely key-pair.\
    \ If the cipher-text generated by the likely key-pair matches with $C_i$ then\
    \ $(K_1, K_2)$ is the key-pair with a very high probability. To confirm it more,\
    \ test with more plaintext-cipher-text pairs. If the test passes with all chosen\
    \ pairs, quit as the key-pair is confirmed; if the test fails then go back to\
    \ Step 4."
  merge: -1
  img_proc: true
- pgno: 272
  md: "If no match is found, then go back to Step 4 and repeat Steps 4 to Steps 6\
    \ with the next value of key $K_2$\n\n# 6.7.1.5 Effort Required for “Meet-in-the-Middle”\
    \ Attack on Double DES\n\nThe effort required for the “Meet-in-the-Middle” attack\
    \ can be divided into two parts:\n\n+   1. Creation of $K_1$ vs. $X$ Table: The\
    \ attacker needs to try all possible values of the 56-bit key $K_1$, so the effort\
    \ required will be the order of $2^{56}$\n\n+   2. Decryption of cipher-text using\
    \ $K_2$ and finding a match with $X$ values stored in the table: On the average,\
    \ the attacker may need to half the possible values of $K_2$ This requires an\
    \ effort of order $\frac{2^{56}}{2} = 2^{55}$\n\nThe total effort required will\
    \ be of the order of $2^{56} + 2^{55}$ that is, the order of $2 \times 2^{56}\
    \ = 2^{57}$\n\nThis effort is slightly more than the effort required for breaking\
    \ a Single DES by Brute Force Attack (i.e., $2^{55}$). Thus, Double DES is almost\
    \ as insecure as Single DES.\n\n# 6.7.2 Triple DES\n\nIt makes use of three blocks\
    \ of DES with two 56-bit keys, $K_1$ and $K_2$ It is a relatively popular alternative\
    \ to DES, and it has been adopted for the key management standards.\n\n# 6.7.2.1\
    \ Encryption\n\nFor encryption, it makes use of both the Encrypt $(E)$ and Decrypt\
    \ $(D)$ functions. For the same key value, the function $D$ is the inverse of\
    \ function $E$ Figure 6.13 illustrates the three blocks of DES with two 56-bit\
    \ keys $K_1$ and $K_2$ used for encryption."
  merge: -1
  img_proc: true
