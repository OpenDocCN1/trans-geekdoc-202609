    # 1.1 INTRODUCTION


    Computer networks have grown rapidly in recent years due to critical users'' needs
    in their daily living. A computer network is a collection of devices (nodes) connected
    to each other (wired or wireless) in order to allow every device to communicate,
    access, and share its resources with other devices. This chapter gives a basic
    introduction and overview of computer networking to help in understanding and
    learning network security.'
