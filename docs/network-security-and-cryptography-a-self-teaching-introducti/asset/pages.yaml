    # 6.7.4.2.2 Advantages and Limitations of CBC


    **The advantages of CBC are:**


    +   - Like ECB, CBC also uses the key for the encryption of all plaintext blocks,
    but identical plaintext blocks still do not result in identical cipher-text blocks.
    Thus, CBC is more secure as compared to ECB Mode and is suitable for sending long
    messages.


    **The limitations of CBC are:**


    +   - If a cipher-text block gets corrupted in transit, it will affect the decryption
    of two cipher-text blocks.


    # 6.7.4.3 Cipher Feedback (CFB) Mode


    +   - The Cipher Feedback Mode makes use of a Shift Register the size of, for
    example, 64 bits.


    +   - It encrypts plaintext elements of size $s$ bits. Normally, $s$ equals 8,
    the size of a character. Thus, Cipher Feedback Mode is suitable for a stream cipher.


    +   - This is suitable for real-time applications wherein a data character (normally
    8 bits) can be encrypted and sent without waiting for a large block of data to
    be ready.'
