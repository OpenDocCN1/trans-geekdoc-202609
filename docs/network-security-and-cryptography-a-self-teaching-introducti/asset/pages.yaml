  md: '+   It is presumed that adversaries can easily capture the cipher-text from
    the transmission media. The encryption should be such that an adversary should
    not be able to easily extract the plaintext from the cipher-text.


    +   The intended recipient should be able to decipher the received cipher-text
    and recover the plaintext using the decryption keys available with the recipient.
    For this to be feasible, the sender and the intended recipient first exchange
    keys that are needed for encryption and decryption. The Decryption Key may be
    the same as the Encryption Key (as the case of Symmetric Cryptography) or the
    two keys may be different (as in the case of Public Key Cryptography).


    +   The exchange of keys is done prior to the exchange of messages. In the case
    of Symmetric Cryptography, the exchange of a secret key (shared between the two
    parties) has to be done by the most secure means. The sender of a message will
    encrypt the message using the secret key and the intended recipient will use the
    same key for decryption. Since the key is known only to the sender and the intended
    recipient, no eavesdropper should be able to recover the plaintext easily. However,
    in the case of Public Key Cryptography, each party will generate a pair of keys
    that will relate to each other. One of the keys, the Private Key, is kept by the
    party generating it, and the other key, known as the Public Key, is made public;
    that is, is made known to all other users. Any message to be transmitted is encrypted
    using the Public Key of the intended recipient. The intended recipient will be
    able to decrypt the cipher-text using the Private Key. Since the Private Key is
    kept secret by each party, only the intended recipient will be able to recover
    the plaintext from the received cipher-text; an attacker will find it extremely
    hard to decrypt the cipher-text.


    +   If a cipher-text gets modified in transit (either intentionally or unintentionally
    due to some system error), the intended recipient should be able to detect that
    the cipher-text has been modified in transit, and the recipient should be able
    to take appropriate recovery action.


    +   If some entity (say “A”) impersonates some other entity (say “B”) and sends
    a message to entity “C” with the intention of making “C” feel as if the message
    was sent by “B,” it is called a “masquerade.” In this'
