  md: "# 306 • NETWORK SECURITY AND CRYPTOGRAPHY\n\n# 7.6.1 Determination of Private\
    \ Key and Public Key (by User “A\")\n\n+   1. Choose a large prime number $p$\
    \ such that $\\Phi(p)$ has a large prime factor.\n\n+   2. Choose $g$: a primitive\
    \ root of $p$\n\n+   3. Choose an integer $x$ such that $1 < x < \\Phi(p)$.\n\n\
    +   4. Compute $y = g^x \bmod p$.\n\n+   5. The triplet $(x, g, p)$ forms the\
    \ Private Key and the triplet $(y, g, p)$ forms the Public Key of User “A”.\n\n\
    +   6. User “A” keeps the private key $(x, g, p)$ secret and makes the public\
    \ key $(y, g, p)$ available to all users with whom “A” intends to communicate.\n\
    \n# 7.6.1.1 Encryption\n\nWhen any (User “B”) possessing Public Key $(y, g, p)$\
    \ intends to send a message $M$ $(0 \\le M < p)$ to User “A”, User “B” proceeds\
    \ as follows:\n\n+   1. Choose a random integer $k$ such that $(1 < k < \\Phi(p))$.\n\
    \n+   2. Knowing public key, $(y, g, p)$ of intended recipient “A”, User “B” computes\
    \ the cipher-text, which comprises a pair of integers:\n\n> $g^k \bmod p, My^k\
    \ \bmod p$\n\n3. User “B” transmits the cipher-text to the intended recipient,\
    \ User “A”.\n\n4. The first component of the cipher-text, that is, $g^k \bmod\
    \ p$, is called Clue. It contains a clue of the random value $k$, which is not\
    \ known to the intended recipient of the cipher-text. The intended recipient will\
    \ use the clue for extraction of plaintext from the second component of the cipher-text.\n\
    \n# 7.6.1.2 Decryption\n\nUser “A” receives the cipher-text $(g^k \bmod p, My^k\
    \ \bmod p)$.\n\n“A” proceeds to decrypt the received cipher-text using its private\
    \ key $(x, g, p)$.\n\n+   1. Compute $(-x) \bmod \\Phi(p) = \\Phi(p) - x = p -\
    \ 1 -x$\n\n+   2. Compute $(g^k \bmod p)^{-x} \bmod \\Phi(p) = g^{-kx} \bmod p$\n\
    \n+   3. Compute $M = ((My^k \bmod p) \times (g^{-kx} \bmod p))$"
