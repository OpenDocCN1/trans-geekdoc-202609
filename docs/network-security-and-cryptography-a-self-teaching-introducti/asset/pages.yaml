    The message is encrypted using the one-time key $K_s$. Only B will be able to
    extract the key $K_s$ using its private key $KR_b$. Then using $K_s$, B can decrypt
    the message M.


    ```

    A → B: $E_{KU_b}}[K] || E_{K_s}$

    ```


    However, if only authentication is the concern, then the following suffice:


    ```

    A → B: M || $E_{KR_b}[H(M)]$

    ```


    This scheme guarantees that A cannot deny having sent the message M. It does not
    provide confidentiality. Anyone can read the plaintext and misuse it. To counter
    this, both the message and signature can be encrypted with receiver''s public
    key.


    ```

    A → B: $E_{KU_b}[M || E_{KR_b}[H(M)]]$

    ```


    The above schemes require that B knows A''s Public Key $KU_a$. An effective way
    of assuring B about A''s valid public key is to append a digital certificate issued
    by the Authentication Authority, as depicted as follows:


    ```

    A → B: $E_{KU_b}[M || E_{KR_b}[H(M)]] || E_{KR_s}[T || ID_A || KU_a]]$

    ```


    The time-stamp T assures the timeliness of Public Key $KU_a$ of sender A.'
