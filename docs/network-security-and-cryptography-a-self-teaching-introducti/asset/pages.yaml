    # ## 2.2.3 Conditional Probability


    Sometimes we are confronted with a situation in which the outcome of one event
    depends on another event. The dependence of event B on event A is measured by
    the *conditional probability* $P(B|A)$ given by


    ```

    $P(B|A) = \frac{P(A \cap B)}{P(A)}$

    ```


    where $P(A \cap B)$ is the joint probability of events A and $B$. The notation
    $B|A$ stands for “B given A.\ In case events $A$ and $B$ are mutually exclusive,
    the joint probability $P(A \cap B) = 0$ so that the conditional probability $P(B|A)
    = 0$. Similarly, the conditional probability of A given B is


    ```

    $P(A|B) = \frac{P(A \cap B)}{P(B)}$

    ```


    From Equations (2.15) and (2.16), we obtain


    ```

    $P(A \cap B) = P(B|A)P(A) = P(A|B)P(B)$

    ```


    Eliminating $P(AB)$ gives


    ```

    $P(B|A) = \frac{P(A|B)P(B)}{P(A)}$

    ```


    which is a form of *Bayes’ theorem*.


