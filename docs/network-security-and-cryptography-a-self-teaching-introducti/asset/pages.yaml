- pgno: 35
  md: 'The NIC converts the data to electrical impulses if copper wire is used, or
    to light signals if a fiber-optic cable is used. Each NIC carries a unique Media
    Access Control (MAC) address. The NIC controls user (host) access to the networking
    medium. Figure 1.6 shows a NIC card.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_35_0.png)


    FIGURE 1.6 NIC card.


    +   * Repeaters


    Repeaters work against attenuation (degradation of signal) by cleaning and repeating
    signals that they receive on a network, as shown in Figure 1.7. A repeater enables
    signals to travel longer distances over a network.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_35_1.png)


    FIGURE 1.7 A Repeater.


    Repeaters operate at the Physical layer (Layer 1) of the OSI model. They cannot
    connect different network architectures. Also, they can’t format, resize, or manipulate
    the data signal. A repeater is used to re-time, re-shape, and re-amplify the data
    signal to its original shape. A repeater receives data on one port and repeats
    them on the other port. It can be used as a connection device on a network. Figure
    1.8 shows a repeater on a network.'
