  md: '# 212 • NETWORK SECURITY AND CRYPTOGRAPHY


    Strength of the Vigere Cipher: If the length of the code word used for key generation
    is large enough, then the Vigere Cipher will be highly secure.


    # 5.2.6 One-Time Pad


    This cipher is similar to the Vigere Cipher, but with the following differences:


    +   It uses an additional character, blank (" "), added to the character set;
    thus, the encryption and decryption will be mod 27.

    It for each message, a new string of characters is chosen as a key, which is exactly
    the same length as the plaintext to be encrypted. The key is conveyed to the recipient
    in a secure manner prior to transmission of the message.

    It makes use of a $27 \times 27$ matrix comprising characters from the set ("A"
    .."Z" and " \) for encryption/decryption, similar to the Vigere Cipher.


    Let $p[0..n-1]$ be plaintext and $k[0..n-1]$ be the chosen key, each comprising
    letters.


    # Encryption:


    ```

    $c[i] = (p[i] + k[i]) \bmod 27, \quad 0 \le i < n$

    ```


    # Decryption:


    ```

    $p[i] = (c[i] + k[i]) \bmod 27, \quad 0 \le i < n$

    ```


    # 5.2.6.1 Strength of the One-Time Pad:


    Since the key is a random string of the same length as the plaintext to be encrypted
    and a new key is generated for each message to be sent, the One-Time Pad is considered
    highly secure, in fact, unbreakable.


    # 5.2.6.2 Limitations of the One-Time Pad:


    The One-Time Pad Scheme has the following limitations:


    +   There is a practical problem of creating a large number of random keys (a
    new key for each message).'
