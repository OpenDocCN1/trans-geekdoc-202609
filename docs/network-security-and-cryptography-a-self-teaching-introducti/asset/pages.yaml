    +   - A digital picture is stored in the form of a matrix of pixels with each
    pixel represented by 24-bits of RGB information. If the Least Significant Bit
    (LSB) of each pixel is modified, the picture quality remains almost unaffected.
    This feature is exploited for steganography.


    +   - If user "A" is used to send a message to user "B", then "A" will choose
    a digital picture. Suppose the picture is 2048×3072 pixels.


    +   - 2048×3072 bits of binary information (one bit in the LSB of each pixel)
    can be inserted into the picture by substituting the LSBs with the bits of information
    to be sent.


    +   - The modified picture is transmitted to user "B," the recipient.


    +   - The recipient will extract the information from the pixels.


