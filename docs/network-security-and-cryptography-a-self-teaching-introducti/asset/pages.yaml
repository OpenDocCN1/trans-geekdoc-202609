    \ same birthday as “A” is greater than 1/2.\n\n# ## 8.5.17 Strengths of Hash Functions\n\
    \n+   - The larger of the Hash Code, the more secure the system will be against\
    \ attacks, since the effort required for the birthday attack is of the order of\
    \ $2^{m/2}$, where m is the size of the hash code.\n- There are three desirable\
    \ properties of hash functions:\n  - **One-Way Function:** For a given hash code\
    \ h, it is computationally infeasible to find x such that $H(x) = h$.\n  - **Weak\
    \ Collision Resistance:** For any given message x, it is computationally infeasible\
    \ to find $y \\neq x$ such that $H(y) = H(x)$.\n  - **Strong Collision Resistance:**\
    \ It is computationally infeasible to find a pair $(x, y)$ such that $H(x) = H(y)$.\n\
    - Effort required to break the “Weak Collision Resistance” in Hash Functions.\
    \ The level of effort required for attacks to break the “Weak Collision Resistance”\
    \ in hash functions will be the order of $2^m$.\n- Effort required to break the\
    \ “Strong Collision Resistance” in Hash Functions. The level of effort required\
    \ to break the Strong Collision Resistance will be of the order of $2m12$, like\
    \ in the case of the Birthday Attack.\n\nThe strength of a hash function equals\
    \ the level of effort required to break the strong collision resistance in that\
    \ function.\n\nA 128-bit Hash Code generated by MD5 was broken in 24 days. However,\
    \ for a hash code length of 160 bits, the same machine will take more than 4000\
    \ years to find a collision. Two most popular hash codes, SHA-1 and RIPEND-160,\
    \ use 160-bit hash code."
