    +   ii. Server Write MAC Secret: The secret key used in the MAC operation on the
    data sent by the server.


    +   iii. Client Write MAC Secret: The secret key used in the MAC operation on
    the data sent by the client.


    +   iv. Server Write Key: The convention encryption key for data encrypted by
    the client and decrypted by the client.


    +   v. Client Write Key: The convention encryption key for data encrypted by the
    client and decrypted by the server.


    +   vi. Initialization Vectors(IV): IV for CBC Mode. It is initialized by the
    SSL Handshake Protocol.


    +   vii. Sequence Numbers: Each party maintains a sequence number for its transmitted
    messages for each connection. When a party sends or receives a cipher spec message,
    the sequence is set to zero.


    # 12.7.7 Transport Layer Security (TLS)


    TLS is a Transport Layer protocol defined in RFC 2246. The protocol is similar
    to SSLv3, with some minor differences. The protocol is based on the Secure Socket
    Layer (SSL) protocol that was originally created by Netscape. One advantage of
    TLS is that it is application-independent. It runs above TCP/IP and below the
    application protocols like HTTP or IMAP. The HTTP running on top of TLS or SSL
    is often called HTTPS. The choice of how to implement the TLS handshake and how
    to interpret the authentication certificates exchanged is left to the designers
    of application protocols that run on top of TLS. TLS provides data confidentiality
    and integrity between two communicating entities.


    Basically, the TLS comprises two layers:


    +   1. TLS Record Protocol


    +   2. TLS Handshake Protocol


    # 12.7.8 TLS Record Protocol


    The TLS Record Protocol is used for encapsulation of various higher-level protocols.
    It operates on top of the TCP layer and provides connection security, with the
    following features:'
