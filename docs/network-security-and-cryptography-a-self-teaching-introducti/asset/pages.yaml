    3. Issuer: The Issuer is a financial institution (such as a bank) that issues
    credit cards (like MasterCard or Visa, etc.) to customers, after due verification.
    Each card will have an account opened in the issuer bank, which is linked to the
    credit card. The issuer bank is fully responsible for the clearing of all debts
    of its cardholders.


    4. Acquirer: The Acquirer is also a financial institution (bank) that establishes
    relationships with merchants. Each merchant will have an account opened at its
    acquirer bank, and the acquirer is responsible for the following:


