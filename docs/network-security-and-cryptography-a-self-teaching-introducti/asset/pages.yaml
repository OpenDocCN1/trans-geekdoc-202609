  md: '# 14.4.13 Lightweight Cryptography in the IoT:


    +   - Efficiency of end-to-end communication: Application of the light-weight
    symmetric key algorithm allows lower energy consumption for end devices.

    - Applicability to lower resource devices: The lightweight cryptographic primitives
    would open possibilities of more network connections with lower resource devices.


    # 14.4.14 Prevention of Attacks on IoT:


    Cyber attacks are exploiting vulnerabilities in IoT devices in an increasing number
    of distributed denials of service (DDoS) attacks. The Prevention of attacks on
    IoT can be summarized in five steps:


    +   - Changing the default credentials of IoT devices: With weak or default credentials
    are vulnerable to compromise. IoT devices should be secured with strong authentication
    to avoid brute force attacks.

    - Disabling universal plug and play (UPnP) on gateway routers: UPnP allows ports
    inside a network to be opened easily. Using UPnP, external computers are able
    to communicate with devices inside the network. To prevent this, we should disable
    UPnP on gateway routers. Some applications may be affected by disabling UPnP,
    so reconfiguration could be necessary.

    - Update IoT devices frequently: Update IoT devices with the latest firmware and
    patches as soon as possible to ensure that the known vulnerabilities are addressed.

    - Ensure proper firewall configuration and identify malicious traffic: Configure
    the firewall to block incoming User Datagram Protocol (UDP) packets because they
    are used to exploit IoT devices.

    - Review reliance on easily identified internet connections: Examine the level
    of reliance on public-facing web servers that are easy to identify externally
    and that are used for critical operations. It is important to review incident
    response procedures as well as that operations are not halted by a cyberattack.
    In addition, IoT devices that are on public-facing servers should be secured to
    prevent unauthorized access.'
  merge: -1
  img_proc: true
