  md: '# MODERN SYMMETRIC CIPHERS • 287


    +   - The “Next-Bit Test” is defined as follows:


    A Pseudo-Random Bit Generator algorithm passes the Next-Bit Test if there exists
    no polynomial time algorithm, that, on the input of the first $k$ bits of its
    output, can predict the $(K+1)$ st bit with a probability significantly higher
    than 1/2.


    # iv. Output Feedback (OFB) Random Number Generator


    +   - The Output Feedback Random Number Generator makes use of a Shift Register
    the size of, for example, $b$ bits. Normally $b$ equals 64 or 128. Figure 6.30
    illustrates the Output Feedback Random Number Generator.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_311_0.png)


    FIGURE 6.30 A Schematic diagram of the Output Feedback Random Number Generator.


    +   - The Shift Register is initialized to a value IV.

    - The contents of the Shift Register are encrypted using a secret key $K$. This
    encrypted value of the shift register contains the next random number.

    - After generating a random number, the contents of the shift register are shifted
    left $s$ bits, and those $s$ bits are filled by copying $s$ bits from the encrypted
    value of the shift register.

    - The modified contents of the shift register are used for generating the next
    random number.'
