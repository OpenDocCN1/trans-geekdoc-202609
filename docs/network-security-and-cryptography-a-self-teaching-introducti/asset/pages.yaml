  md: '# 5.2.2.1 Key Space of Mono-Alphabetic Cipher


    The letter “A” in plaintext can be mapped to any of the 26 letters in the cipher-alphabetic
    cipher (say “X”); the letter “B” in the plaintext can be mapped onto any of the
    remaining 25 letters (except “X”) in the cipher-text, and so on.


    Number of possible keys = $26 \times 25 \times 24 \times \dots \times 2 \times
    1 = 26!$


    Thus, 26! is the size of the key space in a mono-alphabetic cipher. This works
    out to be larger than $4 \times 10^{26}$, which is a very large figure as compared
    to the Caesar Cipher.


    # 5.2.2.1.1 Strength of the Mono-Alphabetic Cipher


    Since the size of the key space is very large ($> 4 \times 10^{26}$), it is extremely
    hard to determine the key by brute force attack.


    # 5.2.2.1.2 Weaknesses of the Mono-Alphabetic Cipher


    The Mono-alphabetic cipher is prone to a statistical analysis attack. Extensive
    research has established that any English text of the following relative frequency
