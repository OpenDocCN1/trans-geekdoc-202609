    # 10.1 INTRODUCTION


    A Public Key, as the name suggests, is to be made available to all users in the
    cryptosystem.


    The Public Key Infrastructure (PKI) is the infrastructure that is necessary for
    making the public keys available to all users in a convenient, secure, and efficient
    manager.


    RFC 2822 defines PKI as the hardware, software, people, policies, and procedures
    to create, store, manage, distribute, and revoke Public Key Certificates. ITU-T
    Recommendations X.500 defines a Directory Service for management of public key
    certificates.


    X.509, which forms part of X.500, defines the formats for Public Key Certificates.
    The certificates are issued under the digital signatures of designated Certification
    Authorities (CAs).'
  merge: -1
  img_proc: true
- pgno: 434
  md: '410 • NETWORK SECURITY AND CRYPTOGRAPHY


    There are many companies that provide CA service, like VeriSign and the U.S. Postal
    Services. VeriSign is the most popular CA service.


    **Registration with CA:** To get a Public Key Certificate issued, a user has to
    first register with a designated CA by furnishing some information.


    **Issue of Public Key Certificate:** When a user furnishes a Public Key to a CA
    for issue of a certificate, the CA will issue a certificate digitally signed using
    its private key. The certificate binds the public key with the user name. A copy
    of the certificate is returned to the user''s workstation, and a copy is stored
    in the repository available on the Internet. A CA''s public key is available to
    the user for verifying the CA''s digital signature on the certificate. Any user
    can fetch the certificate from the repository.


    **Certificate Revocation:** X.509 defines a set of authentication protocols and
    standards for the Certificate Revocation List (CRL). The CRL lists the certificates
    that have been revoked due to various reasons.


    Suppose a user (“A” intends to send encrypted data to another user (“B”), then
    user


    “A” would need “B”s public key certificate. User A can fetch the certificate from
    the repository. “A” can extract “B’s public key from that certificate and use
    it to encrypt the message intended for “B.” “B” can decrypt the encrypted message
    using its private key.


    Similarly, if user “A” receives a document digitally signed by user “B”. Then
    user “A” would fetch “B’s Public Key Certificate for verification of the digital
    signature on the document.


