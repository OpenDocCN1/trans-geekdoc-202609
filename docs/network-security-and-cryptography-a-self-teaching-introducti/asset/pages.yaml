  md: '# ELSE


    Each letter in the pair is replaced by a letter that falls at the intersection
    of the row of the given letter and column of the other letter in the pair.


    # Decryption:


    The Decryption algorithm is the reverse of the Encryption Algorithm. The cipher-text
    letters are also divided into pairs for decryption. The decryption is performed
    according to the following rule:


    +   If a pair of letters falls in the same row, then the letters are replaced
    by the respective letters on the left in that row. For this purpose, the last
    letter of a row is taken as letter to the left of the first letter in that row.


    # ELSE


    +   If a pair of letters falls in the same column, then the letters are replaced
    by the respective letters just above in that column. For this purpose, the last
    letter in a column is taken as letter above the first in that column.


    # ELSE


    +   Each letter in the pair is replaced by a letter that falls at the intersection
    of the given letter''s row and the other letter''s column.


