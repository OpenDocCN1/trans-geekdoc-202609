  md: "204 • NETWORK SECURITY AND CRYPTOGRAPHY\n\n+   An adversary can analyze a captured\
    \ cipher-text to determine the relative frequency of occurrence of different letters\
    \ in the cipher-text, and from that the adversary can attempt to predict the corresponding\
    \ plaintext letters. For example, if the letter “Q” is found to be occurring with\
    \ the highest frequency in a cipher-text, then the letter “Q” appearing in the\
    \ cipher-text may be representing the letter “E” in the plaintext, since “E” is\
    \ expected to have the highest frequency of occurrence in any text. Similarly,\
    \ if the letter “P” has the lowest frequency of occurrence in a cipher-text, then\
    \ it may be representing the letter “Z” or “Q” in the corresponding plaintext,\
    \ since the letters “Z” and “Q” are expected to have the lowest frequency of occurrence\
    \ in any text. This way, the cryptanalyst can attempt to decipher the cipher-text\
    \ without resorting to the brute force approach.\n A cipher should be such that\
    \ the statistical structure of the plaintexts should not be reflected in the corresponding\
    \ cipher-texts. The statistical structure of the plaintexts must be dissipated\
    \ (or diffused) into the long-term statistics of cipher-texts.\n\n# 5.2.3 Hill\
    \ Cipher\n\nThe Hill Cipher is a substitution cipher in which the statistical\
    \ structure of the plaintext is not transferred to the resulting cipher-text.\
    \ Rather, the statistical structure of the plaintext is diffused in the resulting\
    \ cipher-text. The encryption algorithm uses a non-singular square matrix of size\
    \ n × n as an encryption key. It takes n successive letters of plaintext and substitutes\
    \ for them n cipher-text letters. Each letter in the alphabet is assigned a numerical\
    \ value, where “A” = 0, “B” = 1, ... “Z” = 25.\n\n**Encryption:** The encryption\
    \ process is defined as:\n\nC = KP mod 26 (5.3)\n\nwhere\n\n$P$: Plaintext—a column\
    \ matrix of size n. It contains the equivalent numerical values of the plaintext\
    \ letters to be encrypted.\n\n$K$: n × n key matrix—the values have to be so chosen\
    \ that a matrix should be non-singular.\n\n$G$: Cipher-text—a column matrix of\
    \ size n. It contains numeric values of the cipher-text letters obtained after\
    \ encryption."
