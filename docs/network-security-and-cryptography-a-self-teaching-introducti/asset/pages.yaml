  md: '# CLASSICAL CIPHER SCHEMES • 205


    For $n=3$, $C$ and $P$ are column vectors of length 3, representing the plaintext
    and cipher-text, and $K$ is a $3\times 3$ matrix, representing the encryption
    key. Operations are performed mod 26. The system can be described in terms of
    column vectors and matrices as:


    ```

    $$\begin{bmatrix} c_1 \ c_2 \ c_3 \end{bmatrix} = \begin{bmatrix} k_{11} & k_{12}
    & k_{13} \ k_{21} & k_{22} & k_{23} \ k_{31} & k_{32} & k_{33} \end{bmatrix} \begin{bmatrix}
    p_1 \ p_2 \ p_3 \end{bmatrix} mod 26$

    ```


    This can be expressed in terms following equations:


    ```

    $c_1 = (k_{11}p_1 + k_{12}p_2 + k_{13}p_3) mod 26$\nc_2 = (k_{21}p_1 + k_{22}p_2
    + k_{23}p_3) mod 26$\nc_3 = (k_{31}p_1 + k_{32}p_2 + k_{33}p_3) mod 26$

    ```


    The cipher-text letters are generated by the linear combination of $n$ successive
    plain-text letters.


    **Decryption:** The multiplicative inverse of matrix $K$, that is, $K^{-1}$, is
    used as the decryption key, and the decryption process is defined as:


    ```

    $P = K^{-1} mod 26 \quad (5.4)$

    ```


    Since $K^{-1}$ is required for the decryption of the cipher-text at the recipient
    end, the matrix $K$ is required to be non-singular.


