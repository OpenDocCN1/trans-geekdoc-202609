- pgno: 365
  md: '| M |

    | E_{prA}[H(M)] |


    +   * At the recipient end, the encrypted hash value is decrypted using the sender’s
    Public Key. Also, another value is generated from the received message M. This
    hash value is compared with the hash value received from the sender. If the two
    hash values match, the message is considered to be authenticated. This also assures
    integrity of the received message. Since the hash value received from sender side
    is encrypted using a key that is known only to the sender, it assures Source Non-Reputation.


    # ### 8.3.2 Digital Signatures Using Public-Key Cryptography


    +   1. “User A” can digitally sign a message by encrypting a Hash Value of M using
    the Private Key PR_A and then append the digital signature to the message M and
    send the package to the intended recipient.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_365_0.png)


    **FIGURE 8.3** A schematic diagram of digital signatures using Public-Key Cryptography.


    +   2. At the recipient end, the recipient decrypts the digital signature using
    the sender’s Public Key PU_A and compares the decrypted value with the Hash Value
    of the Message M. If the two values match, the digital signature is deemed to
    be verified. A digital signature provides the following services:


    +   * Source Authentication: Since the recipient is able to decrypt the digital
    signature using the alleged sender’s private key, it implies that the signature
    was created using the alleged sender’s private key; thus, it authenticates the
    alleged sender’s identity.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# 342 • NETWORK SECURITY AND CRYPTOGRAPHY


    +   * Data Integrity: The decrypted value of the signature is the hash value of
    the message that was computed at the sender end. If it matches with the hash value
    of the message computed at the recipient end, it implies that the message was
    not altered in transit.


    +   * Source Non-Repudiation: The recipient will preserve the digital signature
    along with the message received. If the sender denies having sent the message,
    the recipient can disprove the sender''s claim by verifying the digital signature
    using the sender''s public key. Since it is decrypted using the sender''s public
    key, it implies that it was encrypted using the sender''s private key.


    # 8.3.3 Message Authentication Code (MAC)


    The sender and the intended recipient share a secret key K. When the sender (User
    “A”) has to send message $M$ (of any arbitrary length) to the intended recipient
    (say “B”), then “A” computes MAC as follows:


    ```

    $MAC = C_k(M)$

    ```


    The MAC is a code of fixed length, which is appended to message $M$ prior to its
    transmissions. At the receiving end, “B” also computes the MAC using global function
    $C$ and secret key K, and compares this value with the received value of MAC.
    If the two values match:


    +   1. The recipient “B” is assured that the message has been sent by “B”, since
    “A” shares the secret key K only with “B.”. Thus, it provides authentication of
    the message source.


    +   2. The recipient is assured that the message has not been altered on route,
    since an attacker cannot generate MAC without the knowledge of key K. Thus, the
    integrity of the received data is also assured.


    # 8.3.4 Many-to-One Relationship between Messages and MAC Values


    If an $m$-bit message is mapped onto an $n$-bit MAC (where $m$ is larger than
    $n$), then the message-space will comprise $2^m$ distinct messages and the MAC-space
    will comprise $2^n$ distinct MAC Codes. The $2^m$ messages will map onto $2^n$
    MAC Codes, making the MAC a many-to-one function, which is not reversible. If
    the secret key K is $k$ bits long, then there will be $2^k$ different keys and
    thus $2^k$ different mappings from the message-space to the MAC-space.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# AUTHENTICATION SCHEMES • 343


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_367_0.png)


    **FIGURE 8.4** A schematic diagram of the Many-to-One Relationship between Messages
    and MAC Values.


    Suppose the messages are 1024 bits long and the MACs are 64 bits long, the message
    space will have $2^{1024}$ distinct messages and the MAC space will have $2^{64}$
    distinct MAC Codes. On the average, $2^{1024}/2^{64} = 2^{960}$ long, then if
    the secret key is 256 bits long, there will be $2^{256}$ different mappings from
    the message space to the MAC space.


    # 8.3.5 Use of MAC for Message Authentication


    # 1. Message Authentication only


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_367_1.png)


    **FIGURE 8.5** A schematic diagram of the use of MAC for Message Authentication.


    +   * If the MAC value generated at the recipient matches exactly with the hash
    value received from the sender end, the message is considered to be authenticated.

    * Also, it ensures Data Integrity, no adversary could have modified the message
    $M$, since the adversary cannot generate another MAC-without knowledge of key
    $K$.

    * But it does not assure source non-repudiation since key $K$ is also known to
    the recipient.'
