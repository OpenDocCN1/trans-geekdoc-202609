    +   - **FCFS**: first-come first-served


    +   - **LCFS**: last-come first-served


    +   - **LIFO**: last-in first-out


    +   - **FIRO**: first-in random-out


    +   - **PR**: priority


    +   - **GD**: general-discipline


    It is common in practice to represent a queue by specifying only the three symbols
    of Kendall''s notation. In this case, it is assumed that K = ∞, n = ∞, and Z =
