    # 8.3.7 Hash Function


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_370_0.png)


    **Figure 8.8** A schematic diagram of the Hash Function.


    +   - A hash value $h$ is generated by a public function $H$ as $h=H(M)$, where
    $M$ is a message of variable length and $h$ is the hash value of fixed size.


    +   - The hash value is encrypted using a sender''s private key. The encrypted
    hash value is called a Digital Signature.


    +   - At the sender, the encrypted hash value is appended to the message prior
    to its transmission.


    +   - Using the sender''s public key, the recipient of the message decrypts the
    encrypted hash value received from the sender end.


    +   - The recipient re-computes the hash value from the received message and compares
    it with the hash value received from the sender end. If the two values match exactly,
    then the message is considered to be authenticated.'
