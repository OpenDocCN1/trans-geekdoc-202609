  md: "# 6.8.1 Description of IDEA\n\nIDEA is a Block Cipher, which operates on 64-bit\
    \ plaintext blocks and uses a 128-bit overall Key.\n\n+   - The encryption and\
    \ decryption algorithms are identical, except for the application of sub-keys.\n\
    - Each 64-bit plaintext block is divided into 4 sub-blocks $X_1, X_2, X_3$, and\
    \ $X_4$ of 16 bits each. These 4 sub-blocks are input to the first round of the\
    \ encryption algorithm.\n- The 4 sub-blocks of data are repeatedly subjected to\
    \ the following mathematical operations, which can be easily implemented in hardware\
    \ as well as:\n  - Modulo $(2^{64} + 1)$ Multiplication\n  - Modulo $2^{16}$ Addition\n\
    \  - Bit-by-bit XOR\n- The encryption/decryption algorithm comprises 8 identical\
    \ rounds of mathematical operations, followed by one final output-transformation\
    \ round.\n- The algorithm uses a total of 52 sub-keys (16 bits each) generated\
    \ from the overall 128-bit key. Six sub-keys are used in each of the 8 identical\
    \ rounds, and the remaining 4 sub-keys are used in the final outputtransformation\
    \ round.\n- In each round, the 4 sub-blocks of data are XORed, added, and multiplied\
    \ with each other and the 6 sub-keys used in the round. Between the rounds, the\
    \ middle 2 sub-blocks are swapped with each other.\n- Finally, the 4 sub-blocks\
    \ are subjected to the final output-transformation round, which outputs 4 16-bit\
    \ sub-blocks of cipher-text.\n- The mathematical operations performed in each\
    \ round are depicted in the schematic diagram in Figure 6.23."
