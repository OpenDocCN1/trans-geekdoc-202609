    # 6.10 KEY MANAGEMENT: SYMMETRIC ENCRYPTION


    The main issues concerning any Key Management are:


    +   - Secure Distribution of Keys

    - Generation of Keys


    # 6.10.1 Secure Distribution of Keys


    Key distribution refers to the function of delivering a secret key to two concerned
    parties without compromising the key. The strength of a cryptographic system lies
    in a foolproof Key-Distribution Technique. For Symmetric Encryption, two parties
    exchanging information will share a Secret Key, which must not be known to others.
    Also, it is advisable to change the keys frequently so to limit the amount of
    data that will be compromised in case of a key leak.


    The Key distribution to two parties (“A” and “B”) can be achieved by any of the
    following techniques:


    +   - “A” selects a Key and delivers it to “B” physically.

    - A trusted third party can select the Key and physically deliver to “A” and “B”.

    - “A” and “B” have previously exchanged a master key, a key can be exchanged that
    is encrypted by the master key. In this case, the issue is “how to exchange the
    master key securely.” Also, if an attacker gets hold of the master key, then all
    future keys will be compromised.'
  merge: -1
  img_proc: true
