    **Subject Name:** Name of the user to whom the certificate is issued.


    **Public Key Algorithm Parameters and Key:** It comprises the subject''s public
    key information, that is, the Algorithm for which the key is to be used, Parameters
    of the algorithm, and the Public key value.


    **Issuer''s Unique Identifier:** This field, included in Versions 2 and 3, has
    to be unique for each CA.


    **Subject''s Unique Identifiers:** This field is to be unique for each subject
    (user) to whom the certificate is being issued. This field exists in Versions
    2 and 3.


    **Extensions:** These fields contain some information considered necessary for
    proper function of PKI. The fields are explained on the next page.


    **CA Signature:** It comprises the Algorithm used for the CA''s signature. Parameters
    of the Algorithm and encrypted value of the message digest: The message digest
    is generated by hashing the certificate, minus the signature fields. The CA''s
