    2. Pervasive Security Mechanisms – The following pervasive security mechanisms
    are the ones that do not pertain to any particular protocol layers:


    +   A. Trusted Functionality: It refers to the functionality of a system resource,
    as perceived to be correct with respect to accepted specifications and norms.


    +   B. Security Label: It refers to the designation of security attributes of
    a resource (like Top-Secret, Secret, Confidential, etc.), which are used for access
    control. A security label indicates the class of entities to whom the access can
    be granted.


    +   C. Event Detection: It refers to the detection of security-related events,
    like intrusion detection.


    +   D. Security Audit Trail: It refers to the data that is gathered for carrying
    out a Security Audit, that is, to carry out an independent review of system records
    and activities with respect to security.


    +   E. Security Recovery: It refers to the mechanisms that enable recovery in
    case of security failures, to reduce the damage caused by such failures.


    Attack Categorization is based on the extent of information available to the adversaries:


    +   1. Cipher-text only attack

    2. Known Plaintext attack

    3. Chosen Plaintext attack

    4. Adaptively-chosen plaintext attack

    5. Chosen and adaptively chosen cipher-text attack'
