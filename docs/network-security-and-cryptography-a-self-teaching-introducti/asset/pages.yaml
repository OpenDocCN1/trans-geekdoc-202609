- pgno: 278
  md: '+   Identical plaintext blocks will result in identical cipher-text blocks;
    thus, the statistical structure of the plaintext is reflected in the resulting
    cipher-text. This feature can be exploited by the cryptanalysts. ECB is, therefore,
    not suitable for the sending of long messages, which are likely to have repetitive
    plaintext blocks.


    # 6.7.4.2 Cipher Block Chaining (CBC) Mode


    +   In Cipher Block Chaining (CBC) Mode, the cipher-text produced by a plaintext
    block is chained to the input of the next encryption block, influencing the value
    of the cipher-text block.


    +   Since no cipher-text block is available for the encryption of the first plaintext
    block, an Initial Vector (IV) is input to the first encryption block, which affects
    the value of the first cipher-text block. The $N$ is communicated to the intended
    recipients by the same secure means as secret key $K$


    +   The value, resulting from the XOR of the plaintext block and chained cipher-text
    block, is encrypted using secret key $K$ thus producing a cipher-text block, which
    is chained to the input of the next encryption block.


    +   The decryption is the reverse of encryption, wherein the cipher-text block
    is first decrypted using the “Decrypt” function and key $K$. Then, XOR is performed
    between the output of the “Decrypt” function and the cipher-text derived from
    the previous decryption block, thus resulting in the output of the plaintext block.


    # 6.7.4.2.1 Encryption and Decryption of CBC


    At the sender side, XOR is done before encryption; at the receiver site, the decryption
    is done before XOR.


    # Encryption of CBC


    In Cipher Block Chaining (CBC) Mode, the input to the encryption algorithm is
    the XOR of the next 64 bits of plaintext and proceeding 64 bits of cipher-text.
    The CBC mode is a general-purpose, block-oriented transmission. Figure 6.17 shows
    the CBC mode-encryption.'
