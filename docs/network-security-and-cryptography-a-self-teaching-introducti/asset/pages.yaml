- pgno: 361
  md: '# CHAPTER 8


    # # AUTHENTICATION SCHEMES


    # ## Chapter Outline


    +   - Introduction

    - What Is Message Authentication?

    - Types of Authentication Services

    - Application Modes of Digital Signatures

    - Authentication Protocols

    - Message Digest (Hash Function) Algorithms

    - Secure Hash Algorithm (SHA-1)

    - Digital Signature Schemes

    - Exercises


    # ## 8.1 INTRODUCTION


    This chapter covers the concepts and the mechanisms needed to provide Message
    Authentication, namely, Message Authentication Codes, Hash Functions, and Digital
    signatures, followed by detailed coverage of popular algorithms for the generation
    of Message Digests (Hash Values) and Digital Signatures. The chapter also provides
    in detail the mathematical concepts of the ''Birthday Attack'' on Digital Signatures.


    # ## 8.2 WHAT IS MESSAGE AUTHENTICATION?


    +   - Message Authentication is a service that assures the recipients of messages
    about the identity of senders.'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'Digital Signature is an authentication technique that also assures the recipient
    about the integrity of the received message, that is, that messages are received
    without any alteration in transit. Integrity also covers the sequencing and timeliness
    of the received messages.


    Digital Signature also assures the recipient about source non-repudiation, that
    is, the sender cannot later refute having sent the message.


    # 8.3 TYPES OF AUTHENTICATION SERVICES


    There are two kinds of authentication services:


    +   Peer-to-Peer Authentication: This service is applicable to a connection-oriented
    environment, like TCP. It provides confidence against masquerade or unauthorized
    replay of previous connections.


    +   Data Origin Authentication: This service is applicable to a connectionless
    communication, for example, UDP. It provides confidence to the recipient that
    the message received has in fact been sent by the alleged sender.


    # 8.3.1 Different Techniques of Message Authentication


    +   Encryption of Entire Message: This is the mode used normally in Symmetric
    Cryptography. The cipher-text of the entire message serves as a value for authentication.
    In this case, the recipient is assured of the source of the message, since the
    message is encrypted using a secret key that the recipient shares only with the
    alleged sender.


    # A. Symmetric Encryption


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_362_0.png)


    FIGURE 8.1 A schematic diagram of symmetric encryption.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '+   - The Sender encrypts the entire message using symmetric encryption and
    secret key K.


    +   - The recipient attempts to decrypt the received cipher-text using symmetric
    decryption and the same key $K$ as used by the alleged sender.


    +   - If the recipient is able to successfully decrypt the cipher-text using key
    $K$, then the recipient is assured of the following:


    +   - The sender’s identity, since the message could have been encrypted using
    only key $K$, which is known only to User "A" and User "B".


    +   - Also, the recipient is assured of data integrity of the received message,
    since no adversary could have modified the message that is encrypted using key
    $K$, which is known only to "A" and "B" and no one else.


    +   - In addition, it assures data confidentiality, since key $K$ is not known
    to anyone else except "A" and "B".


    +   - But this does not ensure source non-repudiation, since the key $K$ is known
    to "B," and "B" can create cipher-text $C$ by encrypting using key $K$.


    # B. Public Key Encryption


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_363_0.png)


    FIGURE 8.2 A schematic diagram of public key encryption.


    +   - The Sender encrypts the entire message using public key encryption and the
    private key $PR_A$. The private key $PR_A$ is known only to "A."


    +   - The recipient attempts to decrypt the received cipher-text using public
    key decryption and public key $PU_A$ from the sender.


    +   - If the recipient is able to successfully decrypt the cipher-text using key
    $PU_A$, then the recipient is assured of the following:'
