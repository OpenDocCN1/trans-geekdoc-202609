- pgno: 137
  md: 'The modern encryption schemes can be broadly classified into two categories—Symmetric
    Schemes and Asymmetric (or Public Key) Schemes. In symmetric schemes, there is
    only one key that is kept between the sender and recipient of secure messages.
    The secret key is used both for encryption and decryption. In asymmetric schemes,
    each user generates a pair of related keys, one that is made public and one (private).
    The public key is used by others for encryption of messages that are intended
    to be received by the owner of the related private key. The private key is used
    for decryption. Thus, if a user “A” has to send a message to another “B”, then
    “A” will encrypt the message using “B”s public key and then send the resulting
    cipher-text to “B.” Since only “B” has the private key for decryption of this
    message, no one except “B” can decrypt it. The Public-key algorithms are based
    on certain computational difficulties. The popular RSA algorithm (a public encrypter)
    is based on the difficulty of factoring a very large composite number into its
    prime factors. Some other schemes are based on the difficulty of computing Discrete
    Logarithms.


    New areas have emerged in the field of cryptography. One area is digital signing
    of electronic documents. The documents exchanged through the Internet need authentication,
    which is, surety that the document has been initiated by the party claiming to
    be the sender. The digital signature should be such that it could have been created
    only by the initiator of the document, and it should be possible for the recipient
    to verify that the document has been signed only by the initiator. There is another
    aspect of non-repudiation. This implies that the signer of a document should not
    be able to deny having signed the document. If the signer disowns a signature,
    the recipient should be able to prove that the signer is lying. This is feasible
    only with Public Key Cryptography. The signer uses a private key to encrypt the
    signature. The recipient would use the associated public key to decrypt the signature
    (called verification of the signature). Now, since the private key is known only
    to the owner of the key, the signer cannot refuse having signed a document. If
    the signer denies having sent the message, then the recipient will be able to
    rebut the denial.


    The advancement of computers has also enhanced the capabilities of cryptanalysis.
    A continuous fight goes on between the designers of cipher schemes and the cryptanalysts
    (called hackers). The cryptanalysts break'
