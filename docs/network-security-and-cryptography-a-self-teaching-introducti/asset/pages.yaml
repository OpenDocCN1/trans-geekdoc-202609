    GIF (image)<br>• TIFF (image)<br>• MPEG (sound/video)<br>• Quicktime (sound/video)
    |

    | 5 | Session | PC | • Session Control Protocol (SPC)<br>• Remote Procedure Call
    (RPC) from Unix<br>• Zone Information Protocol (ZIP) from AppleTalk |'
