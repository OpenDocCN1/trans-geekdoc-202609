    # 13.8 FIREWALL


    A Firewall is a mechanism that protects a local system or a Local Area Network
    (LAN) from network-based programs security threats, while at the same time permitting
    access to the outside world through the network.'
  merge: -1
  img_proc: true
- pgno: 507
  md: 'SYSTEM SECURITY • 483


    Workstation "A"


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_507_0.png)


    FIGURE 13.1 A Firewall.


    # 13.8.1 Firewall Characteristics


    +   1. All inbound and outbound traffic at a Local Area Network must pass through
    the firewall.


    +   2. Only authorized traffic as per the local security policy should be permitted
    to the LAN.


    +   3. The firewall must use a Trusted System with a Secure Operating System so
    as to achieve immunity against penetration of unwanted traffic.


    # 13.8.2 Firewall Techniques to Control Access


    +   1. Service Control: It determines the types of services that can be accessed
    on the Internet. It may filter traffic on the basis of IP Address and TCP Port
    Number. It may use a Proxy Software to interpret each service


    +   2. Direction Control: It determines the direction in which particular service
    requests may be initiated and allowed to pass through the Firewall.


    +   3. User Control: It permits particular local users (within the LAN) to access
    only particular services on the Internet. It may also be applied to external users
    for the access of local services.


    +   4. Behavior Control: It controls how particular services are used; for example,
    filtering emails to eliminate spam.'
  merge: -1
  img_proc: true
- pgno: 508
  md: '484 • NETWORK SECURITY AND CRYPTOGRAPHY


    # 13.9 TYPES OF FIREWALLS


    +   1. Packet Filtering Router: It applies a set of rules to each incoming IP
    Packet and decides whether to forward it or discard. The filtering rules are based
    on the information contained in the packet, such as Source IP Address, Destination
    IP Address, Source port number, Destination Port Number, IP Protocol Field, Router
    Port Number, and so on.


    +   2. State-Full Inspection Firewalls: It tightens the rules for TCP traffic
    by creating a directory of outbound TCP connections. The filtering is performed
    on the inbound traffic on the basis of destination port numbers.


    +   3. Application-Level Gateway: The Application Level Gateway is also called
    a proxy server. A proxy server can be configured to support only specific features
    of an application, while denying other features.


    +   4. Circuit-Level Gateway: It is a stand-alone system or a specialized function
    performed by an Application-Level Gateway. It does not permit an end-to-end TCP
    connection; rather it splits an TCP connection into two parts—one between itself
    and a TCP user inside and between itself and a TCP user outside. The security
    function decides which connections to allow and which connections to deny.


    +   5. Bastion Host: A Bastion host serves as a platform for an Application-level
    or Circuit-level Gateway.


    The characteristics of a Bastion Host are:


    +   * It executes a secure version of OS, making it a trusted system.


    +   * Only essential services like Telnet, SMTP, DNS, and FTP are installed.


    +   * A user has to authenticate himself prior to access of proxy services through
    the Bastion Host.


    +   * Each supports only a subset of a standard application command-set, and each
    proxy allows access only to specific host systems. It runs as a non-privileged
    user in a secure private directory on the bastion host.


    +   * Each proxy maintains an audit log of network operations. It acts as a tool
    for detection and termination of intruders'' attacks.'
  merge: -1
  img_proc: true
- pgno: 509
  md: '+   The proxy modules are less complex and easy to debug. Also, each proxy
    module is independent of other proxy modules on the Bastion Host. Thus, failure
    of one proxy module does not affect others. If any additional functionality is
    required, it can be provided by including another proxy module.


    +   A proxy module normally does not perform any disk access, except initially
    reading its configuration file. Thus, it is not vulnerable to attacks like Trojan
    Horse Sniffing.


    # 13.9 Firewall Configurations


    1. Simple Configurations: A simple configuration consists of a single packet-filtering
    router or a single gateway, but it does not provide flexibility in defining security
    policy.


    2. Screened Host Firewall, Single-Homed Bastion: It consists of two systems:(a)packet-filtering
    router and (b) bastion host. The router is configured such that only IPs destined
    for the bastion host are allowed. The bastion host performs authentication and
    proxy functions. Thus, this configuration is more secure than simple configurations,
    as it provides both packet-level and application-level filtering, and it provides
    more flexibility identifying security policy.


    However, in a single-homed configuration, if the packet-filtering router is completely
    compromised, traffic could flow directly through the router between the Internet
    and other hosts in the private network.


    3. Screened Host Firewall, Dual-Homed Bastion: This configuration prevents direct
    flow of information between the Internet and other hosts in the private network.


    4.ed Subnet Firewall: This is the most secure configuration. In this configuration,
    two packet-filtering routers are used—one between the bastion host and the internal
    private network and the other between the bastion host and the Internet. This
    creates an isolated but more secure sub-network. It offers the following advantages:


    +   A. There are now three levels of defense — outside packet-filtering router,
    bastion host, and inside packet-filtering router.'
  merge: -1
  img_proc: true
- pgno: 510
  md: 'B. The outside router only advertises the existence of the screened sub-network
    to the internal systems; therefore, the systems network cannot directly access
    the Internet.


    # 13.10 TRUSTED SYSTEMS


    +   - A trusted system is a system that can be relied upon to a specified extent
    to enforce a specified security policy.

    - Its failure may break the specified policy that it implements.

    - According to the concept followed in the U.S. Department of Defense, a Trusted
    System is implemented as a “Reference Monitor” that is responsible for all access-control
    decisions.

    - The most important design goal of a trusted system is to minimize the size of
    the “Trusted Computing Base” (TCB). The TCB is a combination of hardware, software,
    and firmware that enforces the desired system security policy. Because the failure
    of TCB breaks the implanted security policy, a smaller TCB provides higher assurance.

    - Security Labels are attached to Data “Objects,” indicating their levels of sensitivity.
    Also, labels are attached to “Subjects,” that is, users indicating trustworthiness.

    - The Subjects are permitted to access the Objects using two security properties:
    (i) Simple Security Property, and (ii) Confinement Property.

    - Simple Security Property: A Subject can only read from an Object if the Subjects
    Trustworthiness exceeds the Object’s sensitivity. This is also called the “No
    Read Up” property. In layman’s language, it implies that information at higher
    sensitivity level should not be permitted to be accessed by a user having lower
    trustworthiness.

    - Confinement Property: It is also called “Property.” A Subject can only write
    to an Object if the Object’s sensitivity exceeds the Subject’s Trustworthiness.
    This is also called the “No Write Down” Property. This implies that information
    should flow uphill and not downhill.

