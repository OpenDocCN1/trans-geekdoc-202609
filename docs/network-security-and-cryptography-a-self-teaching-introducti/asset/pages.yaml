    # Hub


    +   - A hub is a multiple port repeater. It generates and re-times network signals.
    A hub connects devices on an Ethernet twisted pair network.

    - It forms a central point on a network where the cables of other network devices
    come together at its ports.

    - Hubs operate at the physical layer (Layer 1) of OSI model.

    - A hub does not perform any tasks besides signal regeneration. A hub receives
    data on one port and transmits it on all the other ports. Figure 1.9 shows a network
    with a hub in the center.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_36_1.png)'
