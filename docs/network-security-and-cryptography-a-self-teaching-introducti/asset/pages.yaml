  md: 'OVERVIEW OF CRYPTOGRAPHY • 133


    +   - The scheme needs a large number of encryption/decryption keys to be provided—one
    for each link. Thus, management of keys is a big task.


    +   - Since the message needs to be decrypted and encrypted at each switch node,
    it adds to delays in message delivery.


    # 3.5.3.1 End-to-End Encryption


    +   - The encryption/decryption is performed only at the end points (sender and
    recipient ends).


    +   - The sender encrypts the data and transmits. In this scheme, only the data
    portion of a packet (called the payload) is encrypted; the header is left clear
    so that the route switches can access the destination address from the packet
    header


    Let Message $M = H|PL$, and let $K_{ab}$ be the secret key shared between nodes
    $A$ and $B$. Then, Cipher-text $C = H|E_{ab}[PL]$.


    +   - The data in the cipher-text form travels unaltered through the network to
    the destination.


    +   - The destination shares a secret key with the source node (like $K_{ab}$
    between the nodes $A$ and $B$), which is used to decrypt the data.


    # Advantages


    +   - This scheme requires fewer keys as compared to link encryption; thus, management
    is simpler.


    +   - Since the encryption/decryption is performed only at the end nodes, there
    are fewer delays than with the link encryption scheme.


    +   - The payload portion of the message is protected throughout the travel of
    the message from the source to the destination.


    +   - Since the message is encrypted using a key that is shared between the sender
    and the recipient, it provides source authentication.


    # Disadvantage


    +   - Since the message-header is not encrypted, any adversary can monitor source
    and destination addresses. Thus, the messages are vulnerable to traffic analysis
    attacks.'
