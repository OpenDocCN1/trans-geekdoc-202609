    # 10.5.1 Rules for Revocation


    An X.509 Certificate can be revoked under any one of the following conditions:


    +   1. When the corresponding Private Key of the certificate holder has been compromised.

    2. When the CA''s private key used to sign the certificate has been compromised.

    3. When the CA is no longer a certification authority for the certificate holder.'
