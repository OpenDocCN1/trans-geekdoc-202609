    is granted a ticket to access the Ticket Granting Server (TGS). The TGS grants
    tickets to users for the type of service requested by the user. Every time the
    user wishes to access this service, the Service-Granting Ticket is to be produced
    by the user to the application server. If the user wishes to access another type
    of service, then it has to approach TGS again to obtain a ticket for that type
    of service.


    # 9.5 ARCHITECTURE OF KERBEROS V.4


    Figure 9.1 illustrates the overview of the Kerberos Version 4 Authentication Exchange.
    The KERBEROS V.4 makes use of the following Servers to perform its assigned functions:


    +   1. Authentication Server (AS): The Authentication Server (AS) stores user-id
    and hashed passwords of all authorized users in a centralized database. Its function
    is to authenticate the clients requesting access to application servers and issue
    "Ticket-Granting Tickets" to those clients who are authenticated successfully.


    +   2. Ticket Granting Server (TGS): The TGS is approached by those clients who
    have been successfully authenticated by the AS. Such clients approach the TGS
    with the "Ticket-Granting Ticket" issued by the AS. The TGS issues "Service-Granting
    Tickets" to such clients. The TGS shares a secret key with the AS, which is used
    by the AS to encrypt the Ticket Granting Tickets. In addition, the TGS also shares
    unique secret keys with all registered application servers. These keys are used
    by the TGS to encrypt the Service-Granting Tickets that are issued by the TGS
    to the authenticated clients to access application servers. The application servers
    trust the authentication performed by the AS. The secret keys shared among different
    servers are distributed physically or by some other secure means.'
