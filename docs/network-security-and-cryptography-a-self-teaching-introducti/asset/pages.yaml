    # 6.2 SOME BASIC CONCEPTS FOR SYMMETRIC CIPHERS


    # 6.2.1 Concept of Binary Block Substitution


    A Block Cipher takes a plaintext block of a particular size (say n bits) and produces
    a cipher-text block of the same size. Figure 6.1 illustrates the logic of a general
    substitution cipher for n = 4.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_244_0.png)


    Figure 6.1 General n-bit-n-bit Block Substitution with n = 4.


    +   - For a block size n, there will be 2n possible different plaintext blocks.

    - For the encryption to be reversible, each distinct plaintext block must map
    onto a distinct cipher-text block. Thus, there must be 2^n distinct cipher-text
    blocks, each mapping onto a distinct plaintext block. Such a transformation is
    called a reversible or non-singular transformation.'
  merge: -1
  img_proc: true
