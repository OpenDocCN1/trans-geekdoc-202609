- pgno: 46
  md: '# 1.7 COMPUTER NETWORK TOPOLOGY


    Computer networks are connected based on a topology. Topology means how network
    equipment is arranged in order to communicate. It defines the structure of the
    network. There are two types of topology: physical topology and logical topology.


    +   **Physical topology**: the way in which the devices of the network are physically
    connected. It is the actual layout of the wires or media.

    * **Logical topology**: the way the hosts access the media to send data. It shows
    the flow of data on a network.


    The most common topologies are described as follows:


    # 1. Point-to-Point Topology:


    A point-to-point link is simply topology in which one device has one connection
    (link) to another device. Each device can add a secondary link connection, but
    if the device fails, then there will be no connectivity. It is used mainly for
    WAN links.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_46_0.png)


    FIGURE 1.13 Point to Point topology.


    # 2. Bus Topology:


    Bus topology is a topology in which all devices are connected to a single thick
    backbone cable. If the backbone cable fails, then the network goes down. If a
    cable linking the device to the backbone cable fails, then only device will lose
    connection.


    10Base-2 (ThinNet) and 10Base-5 (ThickNet) are popular Ethernet cabling options
    in bus topology.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/d3b56042c756fbcc011ff06f1b9f53f0_47_0.png)


    FIGURE 1.14 Bus topology.


    # 3. Star Topology:


    Each network device in a star topology is connected to a central device such as
    a hub or switch or router. If one of the cables to the devices fails, then only
    that device becomes disconnected. Devices typically connect to the hub with the
    Unshielded Twisted Pair (UTP) Ethernet. It is the most commonly used physical
    topology in the Ethernet LANs.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_47_1.png)


    FIGURE 1.15 A Star topology.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 4. Ring Topology:


    A ring topology connects hosts in the form of a ring or a circle. Every device
    in the ring topology has exactly two neighbors for communication purposes. All
    messages travel through a ring in the same direction (either clockwise or counter-clockwise).
    A failure in any device or any cable breaks the loop and can take down the entire
    network.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_48_0.png)


    FIGURE 1.16 Ring topology.


    # 5. Mesh Topology:


    A mesh topology allows multiple access links between between network devices.
    A mesh topology provides network reliability because whenever one network device
    fails, the network does not stop operations; it finds a bypass to the failed node,
    and the network continues to operate. A mesh topology can handle high amounts
    of traffic, because multiple devices can transmit data simultaneously. In a mesh
    topology, every device has a directed point-to-point link to every other device.
    The link carries traffic only between the two devices it connects.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/d3b56042c756fbcc011ff06f1b9f53f0_49_0.png)


    FIGURE 1.17 Mesh Network topology.


    # 6. Tree (Hierarchical) Topology:


    A tree topology puts the network devices in a hierarchical structure. A Central
    device on the top level of the hierarchy is connected to one or more other devices
    that are one level lower in the hierarchy. A tree topology is a combination of
    a Bus and a Star topology.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_49_1.png)


    FIGURE 1.18 Tree Network topology.'
  merge: -1
  img_proc: true
