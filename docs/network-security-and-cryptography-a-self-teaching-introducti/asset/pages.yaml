- pgno: 45
  md: '# OVERVIEW OF COMPUTER NETWORKS • 21


    1. Broadcast: data packets that are sent to all nodes on a network.


    2. Multicast: single packets copied by the network and sent to a specific subset
    of network addresses.


    3. Unicast: message sent to a single network destination.


    +   Virtual Local Area Network (VLAN)


    +   The VLAN groups hosts with a common set of requirements (common broadcast
    domain) regardless of their physical location in the internet.


    +   It has the same attributes as a physical LAN, but is configured via software
    (virtual).


    +   To physically replicate the functions of a VLAN would require a separate,
    parallel collection of network equipment.


    +   The VLAN improves performance and security in the switched network by controlling
    the broadcast propagation.


    +   It is a logical broadcast domain that can cover multiple physical LAN segments.


    +   It enables switches to create multiple broadcast domains within a switched
    network.


    +   Metropolitan Area Network (MAN)


    +   MAN is a network that covers a distance 10 km greater than LAN but lesser
    than WAN for a location such as a city or town.


    +   WAN-Wide Area Network


    +   WAN covers a large distance, typically up to a 100 km away for one more cities
    or countries.


    +   The speeds are limited by cost and bandwidth.


    +   SAN-Storage Area Network


    +   SAN is a high-speed network of storage devices that connects them to servers.'
  merge: -1
