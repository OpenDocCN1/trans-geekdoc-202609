    | 5 | 101 | x² + 1 |

    | 6 | 110 | x² + x |

    | 7 | 111 | x² + x + 1 |


    Each integer in the range 0...(2³-1) is represented by a distinct polynomial.


    # 4.7.4 Arithmetic Operations within GF (2ⁿ)


    +   - The arithmetic operations like addition, subtraction, multiplication, and
    division are performed within the finite field GF (2ⁿ), using the usual polynomial
    arithmetic, with the following additional rules:


    +   1. The coefficients of the polynomials are reduced (mod 2). Thus, the additive
    inverse of an integer “w” belonging to GF (2ⁿ) will be “w” itself.'
