    # 7.7.2 Elliptic Curves in Cryptography (ECC)


    The Elliptic Curve Cryptography (ECC) makes use of Elliptic Curves with finite
    sets. The ECC quadratic equations draw the values of their variables and coefficients
    from a finite set of integers.


    There are two types of Elliptic Curves used in Cryptography:


    +   1. **Prime Curves**: A prime curve is defined over a prime field $Z_p = \{0,
    1, 2, 3, \dots, (p-1)\}$ where $p$ is a large prime number.


    A Prime Curve makes use of a quadratic congruence, whose variables and coefficients
    draw their values from the set of residues $(mod p)$, that is, $Z_p$ where $p$
    is a prime number.


    +   2. **Binary Curves**: A Binary Curve is defined over Galois Field (GF) $(2^n)$
    where $n$ is an integer. It is a finite field with $2^n$ values.'
