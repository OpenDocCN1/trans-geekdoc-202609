  md: '# AES encryption:


    Step 1: Get the plaintext and the key

    Step 2: Perform the pre-round transformation using the plaintext

    Step 3: With “n” key length, perform transformation for “n” rounds

    Step 4: cipher-text achieved


    # AES decryption:


    Repeat the steps followed in encryption in reverse order:


    +   Step 1: cipher-text achieved

    Step 2: With “n” key length, perform transformation for “n” rounds

    Step 3: Perform the pre-round transformation using the plaintext

    Step 4: Get the plaintext and the key


    # Key Generation:


    +   Step 1: Get the key

    Step 2: based upon number of round, calculate required number of words

    Step 3: In an array of 4 bytes, the first four words are made from the key

    Step 4: Get the next word

    Step 5: Repeat step 4 until the required number of words are reached


