- pgno: 164
  md: "# 4.1 INTRODUCTION\n\nThis chapter covers the mathematical concepts of finite\
    \ fields, primes, primes, discrete logarithms, primitive roots, and the Chinese\
    \ Remainder Theorem, which form the foundation of cryptography. It also covers\
    \ modular arithmetic, without the knowledge of which it would be difficult to\
    \ grasp the concepts of cryptography.\n\n# 4.2 INTRODUCTION TO GROUPS, RINGS,\
    \ AND FIELDS\n\n# 4.2.1 Groups\n\nA Group $(G, \\bullet)$ is a set of elements\
    \ $G$ with a binary operator $\bullet$ that obeys the following axioms:\n\n+ \
    \  $(A_1)$ **Closure**: For each pair of elements $(a,b) \\in G$, $a \\bullet\
    \ b$ also belong to $G$.\n$(A_2)$ **Associative**: For all $a,b,c$ in $G$, then\
    \ $a \\bullet (b \\bullet c) = (a \\bullet b) \\bullet c$.\n$(A_3)$ **Identity\
    \ Element**: There exists an element $e \\in G$ (called the identity element),\
    \ which satisfies $e \\bullet a = a \\bullet e = a$ for each $a \\in G$.\n$(A_4)$\
    \ **Inverse Element**: For each element $a \\in G$, there exists an element $a'\
    \ \\in G$ such that $a \\bullet a' = a' \\bullet a = e$. Element $a'$ is called\
    \ the inverse of element $a$.\n\n> **Finite Group** - A group having a finite\
    \ number of elements is called a *Finite Group* and the number of elements in\
    \ the Group is called the *Order* of the Group. Otherwise, the Group is an *Infinite\
    \ Group*.\n\nExample 4.1\n\n+   1. The set of all integers (positive, negative,\
    \ and 0) forms a group with respect to the addition operator; that is, $(I, +)$\
    \ is a group. It obeys all axioms of a group. Zero is the identity operator; for\
    \ each integer $k$, $-k$ will be its additive inverse. However, the set of all\
    \ integers does not form a group with respect to the multiplication operator,\
    \ since it does not satisfy the requirement of “Inverse Element.” For a given\
    \ integer, its multiplicative inverse will not be an integer; also, no inverse\
    \ exists for the integer 0."
