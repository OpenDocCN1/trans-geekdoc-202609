  md: 'It proves integrity of the data unit to the recipient; that is, it assures
    the recipient that the received data unit has not been altered in transit either
    intentionally by an adversary or unintentionally by a system malfunction like
    a noisy channel.


    It protects the data unit against forgery (by the recipient). The recipient cannot
