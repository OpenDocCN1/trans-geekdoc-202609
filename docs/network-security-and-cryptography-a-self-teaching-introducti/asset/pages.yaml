  md: '# CHAPTER 11


    # PRETTY GOOD PRIVACY


    # Chapter Outline


    +   - Introduction

    - Services Supported by Pretty Good Privacy (PGP)

    - Radix-64 (R64) Transformation

    - Concept of Public Key Ring and Private Key Ring in PGP

    - S/MIME (Secure/Multipurpose Internet Mail Extension)

    - Exercises


    # 11.1 INTRODUCTION


    Pretty Good Privacy (PGP) is a freely downloadable open-source software that provides
    Confidentiality and Authentication Services to emails and file storage applications.
    It is not controlled by any government organization.


    # 11.2 SERVICES SUPPORTED BY Pretty Good Privacy (PGP)


    +   1. Data confidentiality: It provides data confidentiality by symmetric encryption
    using 3-DES or IDEA or CAST-128. It makes use of a “one-time” session key for
    the symmetric encryption/decryption. The session keys are generated using the
    Pseudo Random Number Generation Algorithm specified by ANSI X-12.17. The key is
    conveyed to the recipient along with cipher-text by encrypting the key with the
    recipient’s Public Key Encryption Algorithm (RSA or ElGamal).'
  merge: -1
  img_proc: true
- pgno: 444
  md: '420 • NETWORK SECURITY AND CRYPTOGRAPHY


    2. Authentication: The Authentication Service is provided by pre-pending the message
    with the sender''s digital signature at the sender end. The Message Digest for
    the signature is generated by SHA, and the Message Digest is encrypted by using
    DSS/DSA or RSA.


    3. Data Compression: Data Compression is performed using ZIP at the sender end
    after signing the message but prior to encryption for data confidentiality. At
    the recipient end the compression is undone using ZIP.


    4. Radix-64 Transformation: Most of the email services process only printable
    character information, but cipher-text does not fall in this category. PGP performs
    RADIX-64 Transformation (also called Base-64 Transformation) prior to the transmission
    of the message at the sender end. The RADIX-64 transformed data comprises only
    printable characters ("A"..."Z"..."0"..."9"..."+"..."/"). This feature makes the
    PGP compatible with all email services. At the recipient end, reverse transformation
    is performed to undo the RADIX-64 transformation. With Radix-64 transformation,
    the length of data is increased by 33 percent.


    5. Segmentation and Reassembly: Most of the email services handle a max message
    size of only 50,000 bytes. So, if the message length exceeds 50,000 bytes (octets),
    then the message is segmented such that the length of each segment is within 50,000
    bytes. At the recipient end, the segments are reassembled.


    # 11.2.1 Implementation of the Security Services in PGP


    +   * Authentication Only


    +   * Confidentiality Only


    +   * Authentication and Confidentiality


    i. Authentication Only:


    Figure 11.1 illustrates the diagram depicting the "Authentication Only" service.'
