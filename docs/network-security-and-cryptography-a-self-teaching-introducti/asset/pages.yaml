  md: '# Solution


    The center can be modeled as an M/M/20. The arrival rate $\lambda = \frac{30}{60}
    = 0.5$ per minute and the service rate of $\mu = \frac{1}{10}$ per minute


    The traffic intensity $\rho = \frac{\lambda}{k\mu} = \frac{0.25}{20(1/10)}$


    # 2.18.5 M/M/$\infty$ Queueing System


    This is case in which we have an infinite number of servers so that an arriving
    customer can always find a server and not queue. This model can be used to study
    the effect of delay in large systems. The state transition diagram for the M/M/$\infty$
    system is shown in Figure 2.28. Like we did before, we assume a Poisson arrival
    at rate $\lambda$ and exponentially distributed service times with mean $1/\mu$.
    We adopt a birth-and-death process with parameters


    ```

    $\lambda_n = \lambda, \quad n=0,1,2,\dots \quad (2.176)

    ```


    ```

    $\mu_n = n\mu, \quad n=0,1,2,\dots \quad (2.177)

    ```


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_120_0.png)


    FIGURE 2.28 State transition diagram for M/M/$\infty$ queueing system.


    The balance equation is


    ```

    $\lambda p_n = (n+1)\mu p_{n+1} \quad (2.178)

    ```


    which can be solved to give


    ```

    $p_n = \frac{\rho^n}{n!} p_0, \quad n=0,1,2,\dots \quad (2.179)

    ```'
