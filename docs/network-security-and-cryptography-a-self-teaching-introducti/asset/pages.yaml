- pgno: 144
  md: '# 3.3.1 Security Attacks


    Security Attacks are divided into the following categories:


    +   1. Passive Attacks – A Passive Attack is in the form of eavesdropping or monitoring
    the communications by an adversary. The goal of the adversary is to capture information
    or to obtain the pattern of information flow. The intruder is only listening to
    the communications and does not alter any information, the passive attacks are
    very difficult to detect; therefore, the emphasis should be on preventing such
    attacks. The passive attacks are divided into two sub-categories:


    +   A. Unauthorized Disclosure of Message Contents – The adversary may capture
    the cipher-text by tapping the communication media and attempt to decrypt it either
    by brute force or by cryptanalysis techniques.


    +   B. Traffic Pattern Analysis – The attacker may attempt to determine the traffic
    pattern, like frequency and length of messages being transmitted. This may provide
    some leads to the nature of information being transmitted. For example, in the
    defense scenario, if the frequency of messages suddenly goes up, it may indicate
    that some operations are imminent.


    +   2. Active Attacks – Active attacks involve the modification of data streams
    or the creation of false data streams. The Active attacks can be subdivided into
    the following four categories:


    +   A. Masquerade – It refers to a scenario, wherein an entity (say “A”) pretends
    to be another entity (say “B”) and sends a message to “C.” This is possible if
    “A” is able to capture the authentication sequences of “B” and replay them in
    order to send an unauthorized message to entity “C.” The recipient “C” will tend
    to believe that the message has been sent by “B.”


    +   B. Replay – It involves the capturing of a data unit and its subsequent retransmission
    to produce an unauthorized effect. Suppose a message “ARRIVING TODAY AT 4:00 PM”
    is captured on July 15, 2009 and replayed on July 17, 2009. The recipient will
    wrongly believe that the alleged sender of the message is arriving on July 17th.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'C. Modification of Messages – It involves capturing a data stream, altering
    the data stream, and then transmitting it to the intended recipient to produce
    an unauthorized effect. The altering may involve modification, deletion, appending,
    or reordering of the data stream.


    D. Denial of Service – It refers to preventing or inhibiting normal communication
    services; for example, the adversary may suppress all the messages meant for a
    particular destination or saturate the network by flooding it with spurious messages
    that degrade the network''s performance. If the network is saturated, then the
    transmission of valid messages will get unduly delayed, and some messages may
    even get lost in transit. Such a type of attack means a denial of service.


    # 3.3.2 Security Services


    X.800 defines the Security Services under the following categories:


    +   1. Authentication – Authentication is of two kinds:


    +   A. Peer-to-Peer Authentication – This service is specific to a connection-oriented
    environment and attempts to provide confidence to the recipient against masquerade,
    that is, against unauthorized replay of previous connections.


    +   B. Data Origin Authentication – It is specific to a connection-less environment
    and provides data source authentication; that is, ensures that the received message
    has been sent by the alleged sender only.


    +   2. Access Control – This service controls and limits the client''s access
    to the host systems (on the Internet) and to the applications running on the host
    systems. Each entity attempting to access a host system or an application running
    on a host system must first identify and authenticate itself; only then is it
    granted access. The access is granted only to the extent authorized for that entity.'
