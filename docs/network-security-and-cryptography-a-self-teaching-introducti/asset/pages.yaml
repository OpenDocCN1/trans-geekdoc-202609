  md: '(in the queue and the server) at time $t$, the probability of the queue being

    in state $n$ at a steady state is given by


    ```

    $p_n = \lim_{t \to \infty} \text{Prob}[N(t) = n], \quad n = 0, 1, 2, \dots \quad
    (2.126)

    ```


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_106_0.png)


    Our goal is to find $p_n$ and use it to find some performance measures of

    interest.


    Consider when the system is in state 0. Due to an arrival, the rate at

    which the process leaves state 0 for state 1 is $\lambda p_0$. Due to a departure,
    the

    rate at the process leaves state 1 for state 0 is $\mu p_1$. In sta-

    tary probability to exist, the rate of leaving state 0 must equal the rate of

    entering it. Thus


    ```

    $\lambda p_0 = \mu p_1 \quad (2.127)

    ```


    when the system is in state 1. Since $p_1$ is the proportion of time in which

    t system is in state 1, the total rate at which arrival or departure occurs

    is $\lambda p_0 + \mu p_1$, which is the rate at which the process leaves state
    1. Similarly,

    the rate at which the process enters state 1 is $\lambda p_0 + \mu p_2$. Applying
    the

    rate-equality principle gives


    ```

    $\lambda p_1 + \mu p_1 = \lambda p_0 + \mu p_2 \quad (2.128)

    ```


    We proceed in this manner for the general case of the system being in

    state n and obtain


    ```

    $(\lambda + \mu)p_n = \lambda p_{n-1} + \mu p_{n+1}, \quad n \geq 1 \quad (2.129)

    ```


    The right-hand side of this equation denotes the rate of entering state

    n, while the left-hand side represents the rate of leaving state n. Equations

    (2.127) to (2.129) are balance equations.'
