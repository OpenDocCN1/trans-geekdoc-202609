- pgno: 381
  md: '# 8.5.10 The Birthday Paradox


    The Birthday Paradox can be stated as follows:


    "What must be the minimum value of “k” so that the probability of at least two
    persons have the same birthday among a group of “k” persons is more than 1/2 (assuming
    that the birthdays'' distribution is uniform)?”


    Number of persons in the group = k.


    Number of possible values of birthdays = n = 365 (ignoring the leap years)


    Let P (n, k) denote the Probability that at least one pair of persons among the
    k persons have the same birthday.


    Let Q (n, k) denote the probability that no pair among the k persons have same
    birthday.


    : P (n, k) = 1 - Q (n, k)


    If k > n (i.e., the number of persons in the group is more than 365), then it
    is impossible for each person in the group to have a distinct birthday. P (n,
    k) will be equal to 1 and Q (n, k) will be equal to 0.


    Here, we assume that k < n (i.e., the number of persons in the group is less than
    365).


    # 8.5.10.1 Determining Q (n, k)


    For Q (n, k) to be non-zero, the k persons can have their birthdays as follows:


    +   The first person can have any of the possible n birthdays.


    +   The second person can have any of the remaining (n-1) birthdays.


    +   Likewise, the k-th person can have any of the remaining (n-(k-1)) birthdays.


    Thus, for Q (n, k) to be non-zero, the number of ways that k persons can have
    their birthdays = n × (n-1) × (n-2) × ...... × (n-(k-1)).


    As such, any of the k persons can have any of the n birthdays.


    : The total number of ways that k persons can have their birthdays = n^k'
  merge: -1
  img_proc: true
