    2. The Private Key $PR_A$ is kept private (secret) by the user “A,” and the Public
    Key $PU_A$ is made available to all other users in the cryptosystem.


    3. A Public Key can be easily obtained by adversaries. Though the Private Key
    $PR_A$ is related to the Public Key $PU_A$, by just knowing the Public Key $PU_A$
    it is computationally infeasible to generate Private Key $PR_A$. Thus, an adversary
