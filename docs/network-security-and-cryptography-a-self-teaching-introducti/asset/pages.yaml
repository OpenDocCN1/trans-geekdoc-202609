    # 3. Method of processing the plaintext


    +   A. Block Cipher: The plaintext is divided into blocks of fixed size and encryption/decryption
    is performed block-by-block. A plaintext block of size N will result in a cipher-text
    block of the same size.


    +   B. Stream Cipher: The Stream Cipher processes a continuous stream of plaintext,
    one element at a time, and produces cipher-text one element at a time. It is suitable
    for real-time systems where information is produced as a stream.


    # 3.5 SYMMETRIC (OR CONVENTIONAL) ENCRYPTION MODEL


    A Conventional Encryption Scheme (also known as a Symmetric Encryption Scheme
    or a Single-Key Encryption Scheme) involves the following:


    +   1. A common Secret Key K, shared by the sender and the intended recipients.'
