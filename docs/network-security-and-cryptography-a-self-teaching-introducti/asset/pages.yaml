  md: '# 2.13.14 Poisson Processes


    From an application point of view, Poisson processes are very useful. They can
    be used to model a large class of stochastic phenomena. A Poisson process is one
    in which the number of events occur in any time interval is distributed according
    to a Poisson random variable, with mean $\lambda t$. In this process, the interarrival
    time is exponentially distributed. A process is called a Poisson process when
    the time intervals between successive events are exponentially distributed.


    Given a sequence of discrete events occurring at times $t_0, t_1, t_2, t_3, \dots$,
    the intervals between successive events are $\Delta t_1 = (t_1 - t_0), \Delta
    t_2 = (t_2 - t_1), \Delta t_3 = (t_3 - t_2), \dots$, and so on. For a Poisson
    process, these intervals are treated as independent random variables drawn from
    an exponentially distributed population, that is, a population with the density
    function $f(x) = \lambda e^{-\lambda x}$ for some fixed constant $\lambda$. The
    interoccurrence time between events of a Poisson process with parameter $\lambda$
    are independent identically distributed (IID) random variables with mean $1/\lambda$.


    The Poisson process is a counting process for the number of randomly occurring
    point-events in a given time interval. For example, suppose the arrival process
    has a Poisson type distribution. If $N(t)$ denotes the number of arrivals in time
    interval $(0,t]$, the probability mass function for $N(t)$ is


    ```

    $p_n(t) = P[N(t)=n] = \frac{(\lambda t)^n e^{-\lambda t}}{n!$

    ```


    Thus, the number of $N(t)$ in the interval $[0,t]$ has a Poisson distribution
    with parameter $\lambda t$ and the parameter $\lambda$ is called the arrival rate
    of the Poisson process.


    Two properties of the Poisson process are the superposition property and decomposition
    property.


    The superposition (additive) property states that the superposition of Poisson
    processes is also a Poisson process, as illustrated in Figure 2.15. Thus, the
    sum of $n$ independent Poisson processes with parameters $\lambda_k, k=1, 2, \dots,
    n$ is a Poisson process with parameter $\lambda = \lambda_1 + \lambda_2 + \dots
    + \lambda_n$.'
