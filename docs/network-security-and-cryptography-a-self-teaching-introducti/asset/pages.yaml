  md: '480 • NETWORK SECURITY AND CRYPTOGRAPHY


    +   1. **Virus**: Fragment of a program that attaches itself to another program
    and executes secretly when the host program is run. Once a virus is running, it
    can perform any function like the erasing of files, and so on.


    +   2. **Worm**: A self-contained program that when executed may produce more
    copies of itself, to be activated later in the same or another system.


    # 13.5.1 Different Phases in the Lifetime of a Virus


    During its lifetime, a virus goes through the following four phases:


    +   1. **Dormant Phase**: A virus initially hibernates, till it is activated by
    an event like a date, presence of another file, or disk exceeding some limit,
    and so on. A virus may not have this state.


    +   2. **Propagation Phase**: A virus places an identical copy of itself into
    another program or into some system areas on the disk. Each infected program will
    now contain a copy of the virus that will further enter a propagation phase, thus
    multiplying exponentially.


    +   3. **Triggering Phase**: The virus is triggered to perform the intended function.
    This triggering may be caused by an event like the number of clones created by
    the virus.


    +   4. **Execution Phase**: The intended function is performed.


    **Types of Virus:**


    +   1. **Parasitic Virus**: It attaches itself to executable files and replicates
    when the infected program is executing.


    +   2. **Memory-Resident Virus**: It lodges itself in RAM as part of a resident
    system program. Then it infects every program that is executed.


    +   3. **Boot Sector Virus**: It infects a master boot record or boot record and
    spreads when the system is booted from the infected disk.


    +   4. **Stealth Virus**: Designed to hide itself from anti-virus software.


    +   5. **Polymorphic Virus**: A virus that mutates (undergoes change) with every
    infection, making detection by its signature difficult.


    +   6. **Macro Virus**: The Macro Virus takes advantage of the “Macro” feature
    of MS applications like MS Word and MS Excel. A Macro is an'
