    # 9.5.1 Inter-Kerberos Authentication


    Different organizations have their Kerberos Realms catering to their registered
    clients and servers.


    But Clients in one realm may like to access servers in other realms. Also, servers
    in a realm may be willing to provide service to clients in other realms the clients
    are authenticated by their own parent Kerberos. If a user logs on at Client Workstation
    at $C$ in Realm “A” intends to access a Remote Server $V$ in Realm “B”, the user
    request is processed as follows:


    +   1. The client requests a Ticket to access the local TGS. The request comprises
    the ID of the user logged on the Client Workstation $C$, $ID_{tgs}$, and Time
    Stamp $TS_{tgs}$.


    +   2. The local AS issues Ticket $_{tgs}$, and a session key $K_{c,tgs}$ for
    communication between C and the local TGS. The Ticket $_{tgs}$ is encrypted using
    secret key $K_{as,tgs}$ that is shared between the AS and the local TGS. So, Ticket
    can be opened only by the local TGS. The session key $K_{c,tgs}$ is to be used
    for communication between C and the local TGS.


    +   3. Now, the client workstation sends a request to the local TGS for issue
    of a Ticket for accessing Remote TGS in Realm “B”. The request comprises $ID_{tgrem}$
    Ticket $_{tgs}$ and Authenticator $_{c^1}$.'
