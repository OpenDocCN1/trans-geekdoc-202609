    a secret key K_{ay} with the receiver Y. The signature comprises ID, and H(M),
    encrypted using K_{ay}. A decrypts a signature using K_{ay} and recovers H(M).
    A re-computes H(M) and compares it with the received value for verification. It
    transmits the message to Y after appending time-stamp T and encrypting the entire
    message using K_{ay} Y decrypts the received'
