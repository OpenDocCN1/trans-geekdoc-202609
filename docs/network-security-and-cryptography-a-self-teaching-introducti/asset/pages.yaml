    # 5.3 TRANSPOSITION CIPHERS


    The Transposition Ciphers perform permutations on the plaintext to produce a scrambled
    cipher-text.


    # 5.3.1 Rail-Fence Cipher


    The Rail-Fence Cipher is a form of transposition cipher. The plaintext is written
    as a sequence of diagonals as shown in the following example, and then read off
    as a sequence of rows. The depth of the rail fence forms the key that needs to
    be exchanged between the communicating parties.


    # Example 5.8


    Plaintext: ATTACK TIGER HILL AT SEVEN PM


    Encryption: Suppose the depth of the rail fence is chosen to be 3. This parameter
    is a key which must be communicated to the intended recipient prior to transmission
    of the encrypted message. Then, for encryption, the plaintext is represented as
    a sequence of diagonals as shown in the following:


    A A T E I A E N

    T C I R L T V P

    T K G H L S E N


    If the message length is not a whole-number multiple of the fence depth, then
    some dummy letters are appended at the end.


    Now read off row-wise to generate the cipher-text:


    Cipher-text: AATEIAENTCIRLTVPTKGHHLSEM


    Decryption: Knowing that the depth of the rail fence is 3, the cipher-text is
    divided into three equal parts and the parts are written row-wise. Then, the resulting
    message is read column-wise, and that represents the plaintext.'
