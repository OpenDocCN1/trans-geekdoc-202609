    # 13.1 INTRODUCTION


    In an open networked environment, System Security deals with the protection of
    vital information that is made available to authorized users on the NET against
    security attacks by intruders. This chapter will give an overview of system security.


    # 13.2 INTRUDERS


    An intruder (also called a hacker) is an individual who performs security attacks
    on others’ domains in a networked computing environment. The intruder may attempt
    to read privileged data (like password cracking), performform unauthorized modification
    of data, or disrupt normal functioning of a system. There are three classes of
    intruder:'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# 478 • NETWORK SECURITY AND CRYPTOGRAPHY


    +   1. Masquerader: An individual who is not an authorized user of a system, but
    who penetrates the access control mechanism of the system to exploit the access
    rights of an authorized user. The Masquerader is likely to be an outsider.


    +   2. Misfeasar: A legitimate user who exceeds access rights by increasing the
    range of his or her privileges. Obviously, a Misfeasar is an insider.


    +   3. Clandestine User: An individual who seizes supervisory control of a system
    and uses this control to evade auditing or to bypass access control or to suppress
    audit collection.


    # 13.3 INTRUSION DETECTION


    Intrusion detection refers to determining whether some unauthorized entity (called
    an intruder) has attempted to gain access or has gained access to a protected
    system. The Intrusion Detection relies on the assumption that the behavior of
    an intruder differs from that of a legitimate user, in parameters that can be
    quantified. A fundamental tool for intrusion detection is audit records, which
    records of ongoing activities of the users that form a vital input for intrusion
    detection. But there will be some overlap between the behavior of legitimate users
    and intruders. So, an intrusion detection system is likely to generate some false
    alarms; at the same time, it may fail to detect some actual intrusions.


    # 13.3.1 Intrusion Detection Techniques


    +   1. Statistical Anomaly Detection involves the following:


    +   Collection of data relating to the behavior of users over a period of time.


    +   Application of statistical tests to the observed behavior of users, to determine
    with a high level of confidence whether that behavior is of a legitimate user
    or of an intruder. Mainly, there are two approaches for statistical anomaly detection:


    +   Threshold Detection: This involves the defining of thresholds (independent
    of user) for the frequency of occurrence of various events. Detection involves
    counting the number of any of such'
  merge: -1
  img_proc: true
- pgno: 503
  md: 'occurrences over an interval of time, and if the count exceeds the threshold
    then an intrusion is assumed.


    +   - Profile-Based Detection: This technique is based on developing the activity
    profile of each legitimate user. The intrusion detection is performed on the basis
    of "sudden and significant change in the behavior" of a user.


    Rule-Based Detection: This involves defining a set of rules that can be used to
    decide whether a given behavior is that of a legitimate user or of an intruder.
    It has two approaches:


    +   - Anomaly Detection: It attempts to detect deviations from the previous established
    usage pattern.


    +   - Penetration Identification: It refers to use of an expert system to detect
    suspicious users.


    # 13.4 PASSWORD MANAGEMENT


    A password is the biggest defense against intruders. Each user in a multi-user
    environment will be assigned a User ID and a Password. A user can change the password
    anytime. A fundamental principle of Password Management is that it should be known
    only to its owner. When a user changes a password, the password is transformed
    using a one-way function, and the transformed value is only saved in the system
    along with the corresponding User ID. Whenever a user enters passwords to gain
    access into the system, the password entered by the user is transformed using
    the same one-way function, and the transformed value is compared with the one
    saved in the system. If both values match, the user authentication is considered
    to be verified.


    # 13.5 MALICIOUS PROGRAMS


    These are malicious programs used by intruders to attack system security. There
    are two classes of these programs:'
