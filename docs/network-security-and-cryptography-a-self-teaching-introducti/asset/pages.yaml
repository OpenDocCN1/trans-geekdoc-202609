    # 9.4.2 Full-Service Kerberos Environment (Kerberos Realm)


    A Full-Service Kerberos Environment consists of the following:


    +   1. A Kerberos that includes an Authentication Server (AS) and a Ticket-Granting
    Server (TGS).


    +   2. A set of Users (Clients) registered with the Kerberos. The Kerberos database
    stores the User-Id and hashed Password of all registered users.


    +   3. A set of Application Servers registered with the Kerberos. The Kerberos
    shares unique secret keys with the registered Application Server.


    Such an environment is called a Full-Service Kerberos Environment, also called
    a Kerberos Realm. The Kerberos also implements the security policy of the parent
    organization, by implementing access rights of the registered users for accessing
    the services provided by the registered servers.


    # 9.4.3 Kerberos Version 4


    Kerberos Version 4 is a Full-Service Kerberos. The messages exchanged between
    clients and servers are made secure by encrypting using DES. The main features
    of KERBEROS V.4 are as follows:


    +   1. The identity of individual users is assured by their respective workstations,
    and the servers enforce security policy on the basis of user identification.'
