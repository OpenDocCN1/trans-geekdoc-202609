    FIGURE 8.18 A schematic diagram of ElGamal''s Digital Signature Scheme.


    # ### 8.8.2.1 Global Parameters


    The ElGamal Signature Scheme makes use of two Global Parameters that are made
    available to all users in the cryptystem:


    +   * $p$: A large prime number

    * $g$: A primitive root of $p$


    The scheme comprises Key Generation, Signature Algorithm, and Signature Verification
    Algorithm.


    # ### 8.8.2.2 Key Generation


    Each user in the cryptystem will generate a Private Key and a Public Key, as follows:


    +   * Chooses a random integer $x$ such that $1 < x < \Phi(p)$.

    * Computes $y = g^x \pmod p$.

    * $(p, g, x)$ forms the private key and $(p, g, y)$ forms the public key of the
    user.

    * The user keeps the private key secret and distributes the public key to all
    other users in the cryptystem.'
  merge: -1
  img_proc: true
- pgno: 404
  md: "# 8.8.2.3 Signature Algorithm\n\nGiven a message $M$, the sender sends it as\
    \ follows:\n\n+   1. Computes a hash function $m = H(M)$ such that $0 \\le m <\
    \ p$.\n\n+   2. Selects a random number $k$ such that $1 < k < \\Phi(p)$ and $GCD(k,\
    \ \\Phi(p)) = 1$, that is, Integer $k$ must be relatively to $\\Phi(p)$ so that\
    \ $k^{-1} \\pmod{\\Phi(p)}$ is defined. (It is a time-consuming function to determine\
    \ $k$ relatively prime to $\\Phi(p)$).\n\n+   3. Computes $r = g^k \\mod \\Phi(p)$.\n\
    \n+   4. Computes $s = k^{-1}(m - rx) \\mod \\Phi(p)$.\n\n+   5. Now, $(r, s)$\
    \ forms the digital signature of the sender, which is appended to the message\
    \ prior to its transmission.\n\n# 8.8.2.4 Signature Verification Algorithm\n\n\
    Having the public key $(p, g, y)$ of the signer, the recipient verifies the signature\
    \ $(r, s)$ as follows:\n\n+   * Computes Hash Function $m = H(M)$.\n\n+   * Verifies\
    \ $0 < r < \\Phi(p)$; else rejects the signature.\n\n+   * Computes $v = g^m \\\
    mod \\Phi(p)$ and $w = y^r \\mod \\Phi(p)$.\n\n+   * Signature is accepted if\
    \ $v = w$; else rejected.\n\n> Note: $r$ is reduced mod $\\Phi(p)$ and $r$ is\
    \ one of the base values for the computation of $w$, thus $w$ is also to be reduced\
    \ mod $\\Phi(p)$. Since $v$ is compared with $w$, so $v$ is also to be reduced\
    \ mod $\\Phi(p)$. Thus, both $v$ and $w$ are also to be computed mod $\\Phi(p)$;\
    \ not mod $p$.\n\n# Proof of Correctness:\n\n```\n$w = (y \times r^r) \\mod \\\
    Phi(p)\ny = g^k \\mod p\nr = g^k \\mod \\Phi(p)\n.: w = (g^r \times g^{kr}) \\\
    mod \\Phi(p)\ns = k^{-1}(m - rx)\n.: w = (g^{rx} \times g^{im^{-kx}}) \\mod \\\
    Phi(p)\n.: w = g^m \\mod \\Phi(p) = v$\n```"
  merge: -1
  img_proc: true
