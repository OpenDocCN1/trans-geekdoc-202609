- pgno: 156
  md: '# 3.5.3 Link Encryption


    In Link Encryption, the entire message including the header is encrypted as illustrated
    in Figure 3.4.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_156_0.png)


    **FIGURE 3.4** Schematic diagram showing link encryption.


    Each link is equipped with an Encryption/Decryption Device on both ends and has
    a secret key shared between the link-nodes. This key is used for the encryption/decryption
    of the messages routed on the link.


    The message is decrypted at each switch node, since the switch needs to access
    the destination address from the message header for further routing of the message.
    After making a decision on routing, the switch node encrypts the message and sends
    it to the next link.


    Let Message $M = H||PL$, where $H$ is a Header containing the IP address and $PL$
    is the Payload.


    Let $K_1,K_2\dots$ be the link encryption/decryption keys. Then, Cipher-text $C_1
    = E_{K_1}[M]$ and Cipher-text $C_2 = E_{K_2}[M]$.


    # Advantage


    +   - The link encryption covers the entire message. Thus, the entire message
    is protected from adversaries, except at the switch nodes.


    # Disadvantages


    +   - At the switch nodes, the messages are completely unprotected and the switch
    nodes are not under user control.'
