    +   - Denial of Service: It aims to suspend or interrupt the system communications.
    To accomplish this effect, the attacker can flood the communication network with
    messages to disable the physical components'' access, inhibiting the system''s
    normal operation.


    +   - Malware: It aims to exploit internal weaknesses of the system with the goal
    of stealing, modifying, and destroying information or physical components of the
    system. It can also obtain unauthorized access to the system.


