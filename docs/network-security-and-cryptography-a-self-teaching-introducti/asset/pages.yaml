    **Procedure to determine a Prime Number with very high degree of certainty (using
    the Miller-Rabin Algorithm repeatedly):


    If the Miller-Rabin Test is invoked repeatedly for a given value of $n$, each
    time selecting a different randomly selected value of “a”, and the test returns
    “Likely to be prime” contiguously $t$ times, then the probability that $n$ is
    greater than $1-\frac{1}{4}$. If $t=10$, then the probablity that $n$ is greater
    than $0.999999$.


    **The Flow Chart in Figure 4.1 can be explained by the following steps:


    +   Step 1: Choose a very large odd integer $n$


    +   Step 2: Choose an integer “a” such that $1 < a < n-1$


    +   Step 3: Perform Miller-Rabin Test


    +   Step 4: If the Miller-Rabin Test does not pass, reject the current value of
    $n$ since it is a composite number, and go back to Step 1 and choose another odd
    integer $n$.


    +   Step 5: If the Miller-Rabin Test is passed, then check whether the current
    value of $n$ has passed the Miller-Rabin Test with “t” $(t \geq 10)$ different
    randomly selected values of “a”. If “No,” then go back to Step 2 and choose another
    value of “a” for the Miller-Rabin Test.


    +   Step 6: If the current value of $n$ has passed the Miller-Rabin Test with
    “t” randomly selected values of “a,” then “n$ is a prime number, with very high
    degree of certainty.”'
