    We now apply the method of $z$-transforms to solve for $p_n$. We define the generating
    function


    ```

    $G(z) = \sum_{t=0}^{\infty} p_t z^t$$

    ```


    Multiplying the balance equation for state $n$ by $z^n$ and summing, we obtain


    ```

    $(\lambda + \mu m)p_n z^n = \sum_{n=1}^{\infty} \mu p_{n+1} z^n + \sum_{n=1}^{\infty}
    \lambda p_{n-m} z^n$$

