    # 3.3 OSI SECURITY ARCHITECTURE X.800


    Open Systems Interconnection (OSI) Architecture X.800 is a set of standards relating
    to Security of Information. These standards have been developed by the International
    Telecom Union (ITU-T), UN-sponsored body that is responsible for the development
    of standards relating to telecommunications. The standards pertain to Security
    Attacks, Security Mechanisms, and Security Services.


    **Security Attacks** – Security Attacks refer to the actions intending to compromise
    the security of information belonging to an organization.


    **Security Mechanisms** – Security Mechanisms refer to the processes (or devices
    incorporating the processes) that are designed to prevent, detect, or recover
    from Security Attacks.


    **Security Services** – Security Services refer to the services that make use
    of Security Mechanisms to counter Security Attacks.'
