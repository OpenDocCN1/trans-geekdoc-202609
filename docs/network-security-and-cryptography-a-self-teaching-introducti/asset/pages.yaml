    # ## Information Security in a Smart City


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_552_0.png)


    +   * There are some of the key privacy and data protection considerations for
    smart cities. With each challenge there are a number of ways in which negative
    effects can be reduced, resisting in smart city initiatives that enhance both
    privacy and information security.


    **Data collection:** The information communications technology (ICT) used to enable
    smart cities has the ability to gather unprecedented amounts of data about citizens.
    Properly managing and protecting this data is integral


    Figure 14.14 Factors of Influencing for Information Security in a smart city'
  merge: -1
  img_proc: true
- pgno: 553
  md: 'to mitigating need and security risks. Limiting the collection of personal
    information to that which is necessary to achieve the desired outcome of an initiative
    is a critical step.


    **Human error:** Intentional or accidental human error can elevate risk of privacy
    and security breaches. This is often the result of lack of training, oversight
    practices and access controls. Those with access to personal information need
    to understand their responsibilities and act in accordance with policies and procedures.


    **Information sharing:** Smart cities are based on connectivity, requiring information
    sharing both within the public sector and with external entities. Many large datasets
    will be linked or released through open data platforms. Ongoing information sharing
    agreements combined with techniques such as de-identification are useful to enhance
    citizens'' privacy.


    **Chilling effect:** When individuals feel they are monitored, there is potential
    for change of behavior known as the “chilling effect.\” This is largely due to
    a lack of trust that collected information will be used appropriately. There are
    several avenues to alleviate this concern including obtaining consent, giving
    notice of data collection, and providing the option of anonymity or opting-out.


    **Security risk management:** Technical solutions such as encryption, digital
    signature and server reliability are important, as are defined document policies,
    procedures, incident and risk management protocols, physical security, and personnel
    training and awareness.


    **Governance:** Strong leadership, clear policies, and guidance, accountability,
    transparency, and a commitment to privacy and security by design will be fundamental
    regardless of whether smart cities are lead by the public or private sector.


    **Malicious attacks:** If an entire city is connected and has an “operating system”
    containing vast amounts of personal information and with control of critical infrastructure,
    there may be incentive for a malicious intruder to seek unauthorized access.'
  merge: -1
  img_proc: true
