    2. A secure mechanism for distribution of the Secret Key K to the sender and to
    the intended recipients. Only the sender and the intended recipients should know
    the key. To keep it secure against leakage, the key must be replaced periodically.


    3. An Encryption Algorithm to transform plaintext M to cipher-text C, as illustrated
