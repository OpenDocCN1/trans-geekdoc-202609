- pgno: 431
  md: '# CENTRALIZED AUTHENTICATION SERVICE • 407


    4. Ticket Lifetime: In Kerberos V4, the maximum lifetime for a ticket is restricted
    to 1280 minutes, which may be insufficient for some applications. Kerberos V5
    permits any start-time and end-time of the validation period of a ticket. If the
    validation period is unduly large then the system becomes more prone to replay
    attacks, which are prevented by including Nounce in the ticket requests.


    5. Authentication Forwarding: Suppose a client sends a request to a Print Server
    to print a requested file and the file may be stored on a different server, that
    is, File Server. This requires the Print Server to fetch the requested file from
    the File Server. In V5, the Print Server can forward the authentication credentials
    of the Client to the File Server and obtain the required file for printing. This
    mechanism of Authentication Forwarding is not supported in V4.


    6. Double Encryption of Tickets: In Kerberos V4, the tickets have double encryption—one
    inner using the key shared between the issuing server and the target servers,
    and the other outer encryption using the key shared between the issuing server
    and the client. The outer encryption is not necessary; it only increases the encryption
    decryption overheads. In Kerberos V5, the tickets have only inner encryption,
    reducing the overheads.


    7. Renegotiation of Session Keys within a Session: Kerberos V5 permits re-negotiation
    of session keys within a session, which is not available in Kerberos V4. Thus,
    V5 is more secure.


    8. Inter-Realm Authentication: In Kerberos V4, for Inter-Realm Authentication
    the client has to go through the local TGS; whereas in V5, the AS issues a ticket
    directly for the remote TGS, thus making it faster.


