  md: '160 • NETWORK SECURITY AND CRYPTOGRAPHY


    # 4.7.1 GF($p$):


    $Z_p = \{0,1,2,3,4,...(p-1)\}$ is a Galois Field of order $p$, where $p$ is a
    prime number.


    $Z_p$ is also called a set of residues (mod $p$).


    Proof:


    +   For each integer $n$, the set residue (mod $p$) that is, $Z_p$, forms an integral
    domain of size $n$. But $Z_p$ may not be a field, since a multiplicative inverse
    exists only for those elements of $Z_p$ that are relatively prime to $n$.


    +   But all elements in $Z_p$ (except 0) are relatively prime to $p$. Therefore,
    multiplicative inverses (mod $p$) exist for all the elements of $Z_p$ (except
    0).


    +   Thus, $Z_p$ satisfies all the properties of the Field.


    +   $\cdot: Z_p$ is a field of size $p$.


    # 4.7.2 Set $Z_p$:


    $Z_p$ is a set of residues (excluding 0) mod $p$ where $p$ is a prime number.


    $Z_p = \{1,2,3,4,...(p-1)\}$


    Each element in $Z_p$ has its unique multiplicative inverse (mod $p$). Thus, multiplication
    within $Z_p$ is reversible, which is an important property of a finite set from
    a cryptography point of view.


    # Example 4.17


    Prove that there exists a Reversible Multiplication of elements within the Set
    $Z_p$


    # Solution


    Each element of $Z_p$ will be relatively prime to $p$, since $p$ is a prime number.


    Therefore, if all the elements of $Z_p$ are multiplied by any element $a \in Z_p$,
    the result will be a set of integers that will be a permutation of set $Z_p$.


    Thus, the multiplication of elements within the set $Z_p$ is reversible.'
