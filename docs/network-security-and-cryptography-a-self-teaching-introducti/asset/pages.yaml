    services like health care, governance and energy/utility issues in a smart city.


    The issues in information security in a smart city have several factors that can
    be taken under consideration as following:


    +   - Technical Factors –IoT Technologies:


    +   - RFID, WSN M2M communication, samrtphones, and smart grid


    +   - Governance Factors:


    +   - Utility, critical infrastructure, smart mobility, management'
