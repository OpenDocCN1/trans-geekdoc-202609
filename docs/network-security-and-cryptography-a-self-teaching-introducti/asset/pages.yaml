  md: 'The joint probability of queue lengths of k queues is the product of individual
    probabilities.


    ```

    $P(n_1, n_2, ..., n_k) = (1-\rho_1)\rho_1^{n_1}(1-\rho_2)\rho_2^{n_2}\cdots(1-\rho_k)\rho_k^{n_k}\n=
    P_1(n_1)P_2(n_2)\cdots P_k(n_k)$

    ```


    This is known as the Jackson theorem after J. R. Jackson who proved the property.
    The queuing network is therefore a product-form network. A network to which Jackson''s
    theorem is applicable is known as the Jackson network. In general, for a product-form
    network


    ```

    $P(n_1, n_2, ..., n_k) = \frac{1}{G}\prod_{i=1}^k \rho_i^{n_i}$

    ```


    where G is a normalization constant and is a function of the total number of jobs
    in the system. The product-form networks are easier to solve non-product-form
    networks.


