    # 2.3.3 Joint Distribution


    We have focused on cases when a single random variable is involved. Sometimes
    several random variables are required to describe the outcome of an experiment.
    Here we consider situations involving two random variables X and Y; this may be
    extended to any number of random variables. The joint cumulative distribution
    function of X and Y is the function


    ```

    $F_{XY}(x,y) = P(X \le x, Y \le y)$ \\quad (2.30)$

    ```


    where $-\infty < x < \infty$, and $-\infty < y < \infty$. If $F_{XY}(x,y)$ is
    continuous, the joint probability density function of X and Y is given by


    ```

    $f_{XY}(x,y) = \frac{\partial^2 F_{XY}(x,y)}{\partial x\partial y}$ \quad (2.31)$

    ```


    where $f_{XY}(x,y) \ge 0$. Just as we did for a single variable, the probability
    of event $x_1 < X \le x_2$ and $y_1 < Y \le y_2$ is


    ```

    $P(x_1 < X \le x_2, y_1 < Y \le y_2) = F_{XY}(x_2, y_2) = \int_{y_1}^{y_2} \int_{x_1}^{x_2}
    f_{XY}(x,y)dxdy$ \quad (2.32)$

    ```


    From this, we obtain the case where the entire sample space is inclusive


    ```

    $F_{XY}(-\infty, \infty) = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} f_{XY}(x,y)dxdy$
    \quad (2.33)$

    ```


    since the total probability must be unity.


    Given the joint cumulative distribution function of X and Y, we can obtain the
    individual CDFs of the random variables X and Y. For X,


    ```

    $F_X(x) = P(X \le x, -\infty < Y < \infty) = F_{XY}(x, \infty) = \int_{-\infty}^{\infty}
    f_{XY}(x,y)dxdy$ \quad (2.34)$

    ```


    and for Y,


    ```

    $F_Y(y) = P(-\infty < x < \infty, Y \le y) = F_{XY}(\infty, y) = \int_{-\infty}^{y}
    \int_{-\infty}^{\infty} f_{XY}(x,y)dxdy$ \quad (2.35)$

    ```'
