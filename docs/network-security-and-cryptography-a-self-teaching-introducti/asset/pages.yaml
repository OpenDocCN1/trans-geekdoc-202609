  md: '# MODERN SYMMETRIC CIPHERS • 241


    **Algorithm and S-Boxes:** The Strength of DES lies basically in the design of
    S-boxes. The design criteria of S-boxes have never been made public, and no fatal
    weaknesses have so far been reported in their design.


    **Resistance to Timing Attacks:** Timing attacks exploit the fact that Encryption
    or Decryption Algorithms take a slightly different amount of time on different
    inputs. The algorithm for timing attacks yields the Hamming Weight (i.e., number
    of bits equal to 1) of the Secret Key. DES is fairly resistant to such attacks.


    In 1998, DES encryption was broken in less than three days, using a special “DES
    Cracker” machine. Thus, a simple DES with a 56-bit key is virtually useless.


    # 6.6.2 Possible Attacks on DES


    DES is claimed to be prone to the following types of Cryptanalysis attacks:


    +   - Differential Cryptanalysis

    - Linear Cryptanalysis


    # 6.6.2.1 Differential Cryptanalysis


    +   - A Differential Cryptanalysis Attack is an “Adaptively Chosen Plaintext,”
    wherein the attacker has access to encryption equipment.

    - The attacker analyzes the effect of particular differences in plaintext pairs
    on the differences in resulting cipher-text pairs.

    - The attacker chooses plaintext pairs with a particular XOR difference (say Δm).
    The chosen plaintext pairs are made to pass through the encryption process and
    their XOR differences are observed at the output of each round.

    - It will be observed that certain XOR differences in the plaintext pairs have
    a high probability of causing certain XOR differences in the corresponding cipher-text
    pairs. Such pairs are of interest to the analysts.

    - The transformation of XOR difference at the output of successive rounds is a
    function of the sub-keys of those rounds. This information is used to predict
    the sub-keys. This attack requires chosen plaintexts of the order of $2^{47}$
    to break the cipher.'
