    # 1. Message Authentication Code (MAC) Appended to Message


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_364_0.png)


    +   - MAC refers to a small fixed-length code, generated by a public function
    C, in relation to a message $M$ of any length and a secret key $K$. MAC is also
    called Cryptographic Checksum.


    +   - The MAC is appended to the message $M$ prior to its transmission.


    | M |

    | $C_AM$ |


    # i. Encrypted Hash Function Appended to Message


    +   - This method is used in Public-Key Cryptography. It makes use of a public
    function $H$, which maps a message $M$ of any length onto a fixed-length hash
    value $b$ (also called message-digest).


    +   - The hash value is encrypted using the private key of the sender and is appended
    to the message $M$ prior to its transmission. The encrypted hash value is called
    a digital signature.'
