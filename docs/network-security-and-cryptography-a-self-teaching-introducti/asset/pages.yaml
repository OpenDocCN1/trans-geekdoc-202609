    # 6.7 MULTIPLE DES


    The Single DES was cracked in 1998 by the use of a special machine known as a
    “DES Cracker.” The attack took just three days to break the cipher. Since then,
    the single DES became virtually useless, so the designers came out with some solutions
    involving multiple blocks of DES used for encryption and decryption.


