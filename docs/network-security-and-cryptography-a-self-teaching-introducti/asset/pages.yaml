- pgno: 31
  md: '+   Address Resolution Protocol (ARP): ARP is used to convert an IP address
    to a physical address such as an Ethernet address. ARP is a low-level network
    protocol, operating at Layer 2 of the OSI model. When any device wishes to send
    data to another target device over the Ethernet, it must first determine the MAC
    address of that target, given its IP address. ARP resolves or discovers the appropriate
    destination MAC (layer 2) address to use using a destination IP address. Map Layer
    3 address to a Layer 2 address.


    +   Dynamic Host Configuration Protocol (DHCP): DHCP automatically configures
    the IP address for every host on a network, ensuring that each host has a valid,
    unique IP address. DHCP automatically reconfigures IP addresses as hosts come
    and go. DHCP can save a network administrator many of tedious configuration work.


    +   Internet Protocol (IP): IP is a routable protocol that uses IP addresses to
    deliver packets to network devices. IP is an intentionally unreliable protocol,
    so it doesn''t guarantee delivery of information.


    +   Internet Control Message Protocol (ICMP): It provides control and feedback
    messages between IP devices. ICMP sends and receives diagnostic messages. ICMP
    is the basis of the everywhere ping command. It sends query and error reporting
    messages.


    +   Internet Group Management Protocol (IGMP): Used to multicast (has more than
    one destination) messages to multiple IP addresses at once.


    Layer 2 Protocols are responsible for providing a reliable link between two directly
    connected nodes, by detecting and possibly correcting errors that may occur in
    the physical layer. Some of the common Layer 2 Protocols today are:


    +   ARP – Address Resolution Protocol

    STP – Spanning Tree Protocol

    SPB – Shortest Path Bridging


    +   Layer 3 Protocols are responsible for providing the functional and procedural
    means of transferring variable length data sequences (called datagrams) from a
    source to a destination host connected via one or more networks, while maintaining
    the quality of service standards.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 8 • NETWORK SECURITY AND CRYPTOGRAPHY


    Some of the common Layer 3 Protocols today are:

    IP – Internet Protocol

    OSPF – Open Shortest Path First

    RIP – Routing Information Protocol

    ICMP – Internet Control Message Protocol


    These protocols enable routers to route data between networks via the shortest
    path, or alternate paths, if one path is unavailable. They also define how routers
    across networks can dynamically share this information so all routers are aware
    of the available paths.


    +   Layer 4 Protocols are responsible for the reliable transport between nodes
    on the network. These protocols ensure that a packet makes it to its destination—kind
    of a return receipt. TCP is the transport layer protocol for IP.


    +   Some of the Common 4 Protocols today are:

    TCP – Transport Control Protocol; this is the transport layer for IP. It ensures
    IP packets are delivered to their destination.

    UDP – Unified Datagram Protocol; this is a lighter transport layer for IP. It
    does not provide the overhead of error checking for simple queries like DNS or
    NTP.

    SPX – Sequenced Packet Exchange; this is the transport layer for IPX. It ensures
    IP packets are delivered to their destination.


    +   Open Shortest Path First (OSPF): Link-state, hierarchical IGP routing algorithm
    as a successor to RIP in the Internet community. OSPF features include least-cost
    routing, multipath routing, and load balancing. OSPF was derived from an early
    version of the Intermediate System to Intermediate System (IS-IS).


    +   Intermediate System-Intermediate System (ISIS): One of family of IP Routing
    protocols, it is an Interior Gateway Protocol (IGP) for the Internet, used to
    distribute IP routing information throughout a single Autonomous System (AS) in
    an IP network. IS-IS is a link-state routing protocol, which means that the routers
    exchange topology information with their nearest neighbors. The topology information
    is flooded throughout the AS, so that every router within the AS has a complete'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# OVERVIEW OF COMPUTER NETWORKS • 9


    picture of the topology of the AS. This picture is then used to calculate end-to-end
    paths through the AS, normally using a variant of the Dijkstra algorithm. Therefore,
    in a link-state routing protocol, the next hop address to which data is forwarded
    is determined by choosing the best end-to-end path to the eventual destination.


    +   - Autonomous System (AS): Collection of networks under a common administration
    sharing a common routing strategy. Autonomous systems are subdivided by areas.


    +   - Spanning Tree Protocol (STP): It is a Layer 2 Protocol that runs on bridges
    and switches. The specification for STP is IEEE 802.1D. The primary purpose of
    STP is to ensure the network does not create redundant loops


    +   - Shortest Path Bridging (SPB): SPB is the IEEE 802.1aq specification for
    enabling multipath routing in the data center. It allows all paths to be active
    with multiple equal cost paths, provides much larger layer 2 topologies, supports
    faster convergence times, and improves the efficiency by allowing traffic to load
    across all paths of a mesh network.


    # 1.4 HIERARCHICAL MODEL


    A Hierarchical model simplifies design, implementation, and management of the
    network. As shown in Figure 1.5, A Hierarchical model consists of three layers:
    Core, Distribution, and Access.


    | Layer Number | Layer Name | Function |

    |---|---|---|

    | 3 | Core Backbone | It is a high-speed backbone that is designed to switch packets
    as quickly as possible optimize communication within the network. It provides
    fast and efficient data transport. It represents the enterprise in a network that
    is available to end users (clients). Network devices used in the core layer are:
    High-speed routers or Multi-layer switches. |

    |  | Distribution or Aggregation | It is a separation layer between the access
    and core layers and a connection point between the diverse access sites and the
    core layer. It defines the quickest, shortest, and least expensive route the data
    needs to pass through to the destination. It defines the local policies and routing.
    Distribution layer devices control access to resources that are available at the
    core layer in order to use bandwidth efficiently. Network devices used in the
    distribution layer are Routers. |'
  merge: -1
  img_proc: true
