- pgno: 150
  md: '126 • NETWORK SECURITY AND CRYPTOGRAPHY


    +   1. Cipher-Text Only Attack – It is presumed that the cipher-text is transiting
    in the media from the sender to the recipients, it can be easily captured by the
    adversaries by tapping the media. In a “Cipher-text Only Attack,” the adversary
    has access only to the Cipher-text and attempts to extract the plaintext from
    the captured cipher-text. For a reasonably secure cipher scheme, the attacker
    would find it extremely difficult to determine plaintext from the captured cipher-text.


    +   2. Known Plaintext Attack – The adversary may be able to obtain plaintext
    of some captured cipher-texts. This is feasible if the adversary gets access to
    the encryption equipment for some time. From the plaintext-cipher-text pairs,
    the adversary would attempt to determine the decryption key using sophisticated
    cryptanalysis techniques. If successful, the adversary would have the capability
    to decipher all captured cipher-texts.


    +   3. Chosen Plaintext Attack – An adversary may have the ability to obtain cipher-texts
    of chosen plaintexts. This is slightly different than the known plaintext Attack.
    Here, the adversary may not have access to the Encryption Equipment, but may send
    some interesting messages to the Encryption Side, hoping that the Encryption Side
    will encrypt the received messages and send the cipher-text back. Then the adversary
    may gather the corresponding Cipher-text. Using information from plaintext-cipher-text
    pairs, the adversary may attempt to determine the decryption key and use it to
    decipher all captured cipher-texts.


    +   4. Adaptively Chosen Plaintext Attack – This attack is the same as the Chosen
    Plaintext Attack, except that the adversary may do some analysis on the gathered
    plaintext-cipher-text pairs and subsequently get more pairs to refine the analysis.
    Then, the adversary may use the refined information to decrypt the cipher-texts
    for which plaintext is not available. The adversary may periodically switch over
    refining the analysis.


    +   5. Chosen and Adaptively Chosen Cipher-Text Attack – Here the adversary has
    access to the Decryption Device. The adversary can choose Cipher-texts and obtain
    corresponding plaintexts. By analyzing the gathered cipher-text-plaintext pairs,
    the attacker attempts to determine the decryption key. Then the attacker obtains
    more pairs of cipher-text and plaintext to refine the analysis process, till the
    decryption key is recovered.'
