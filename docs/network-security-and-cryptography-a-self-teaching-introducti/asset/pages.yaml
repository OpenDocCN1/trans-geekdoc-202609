  md: "# 6.11 PSEUDO-RANDOM NUMBER GENERATORS\n\nA Pseudo-Random-Number Generator\
    \ output must have the following characteristics:\n\n+   1. **Randomness**: The\
    \ numbers appearing in the sequence must be random.\n2. **Uniform Distribution**:\
    \ All random numbers in the sequence should have approximately equal frequency\
    \ of occurrence.\n3. **Independence**: It should not be possible to infer a random\
    \ number from other random numbers in the sequence.\n4. **Unpredictability**:\
    \ It should not be possible to predict the sequence of random numbers.\n\n# 6.11.1\
    \ Pseudo-Random Number Generation (PRNG) Algorithms\n\n+   * Linear Congruential\
    \ PRNG (also known as Lehmer's Method)\n\"* Cyclic PRNG\n\"* ANSI X9.17 PRNG\n\
    \"* Blum Blum Shub (BBS) Pseudo-Random Bit Generator\n\"* Output Feedback (OFB)\
    \ PRNG\n\n+   i. Lehmer's Algorithm (Linear Congruential Method)\n* Choose the\
