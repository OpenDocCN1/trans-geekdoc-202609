- pgno: 446
  md: '# 11.2.2 Functions at the Sender End and at the Recipient End


    +   1. The sender prepares message $M$ for transmission.


    +   2. A 160-bit message-digest of the message is generate using SHA-1.


    +   3. The sender''s digital signature is generated by encrypting the message
    digest $H(M)$ by using algorithm DSA or RSA and private key $PR$ of the sender.
    The encrypted message $E_{PR}(H(M))$ is pre-pended to the plain message $M$.


    +   4. The resulting message is compressed using zip. It is followed by R64 transformation,
    segmentation, and then transmission of the segments to the recipient.


    +   5. At the receiving end the received message is first reassembled and then
    the inverse of $R$ is performed. The resulting message is decompressed.


    +   6. The recipient decrypts the digital signature using the sender''s public
    key $PU_S$. This result is compared with the hash value of the message generated
    at the recipient end. If the two match then the signature is considered to be
    verified and the message source is authenticated.


    # ii. Confidentiality Only:


    Figure 1.2 illustrates the schematic diagram depicting “Confidentiality Only”
    service.


    # Functions at Sender End


    +   1. At the sender end, first the message $M$ is compressed using ZIP.


    +   2. Then the sender generates a 128-bit session key $K_s$ using Random Number
    Generator (RNG).


    +   3. The compressed message $Z(M)$ is encrypted using a symmetric encryption
    algorithm (CAST-128 or IDEA or 3DES) and the session key $K_s$.


    +   4. The session key $K_s$ is also encrypted using a Public Key Algorithm (RSA
    or ElGamal) and the recipient''s Public Key $PU_R$. The encrypted session key
    is pre-appended to the encrypted message $M$.


    +   5. Then the resulting package is R64 transformed, segmented, and transmitted.'
  merge: -1
  img_proc: true
