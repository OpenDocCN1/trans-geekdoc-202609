    - Network and Routing Layer: Responsible for routing of sensors based on addressing
    and location awareness, sensor networking, power efficiency, and topology management.
    It provides more efficient routing of data. From "Node to node, node to sink,
    node to base station, and node to Cluster head & vice versa.\ Due to the broadcast
    method every node works as a router.

    - Data Link Layer: Responsible for the multiplexing of data streams, data frame
    detection, medium access, and error control.

    - Physical Layer: Responsible for frequency selection, carrier frequency generation,
    signal detection, modulation, and data encryption.


    # 14.7.2 Security Requirements in WSNs:


    +   - Data Confidentiality: To provide the data confidentiality, encrypted data
    is used so that only recipient decrypts the data to its original form. Only the
    authorized sensor nodes get the content of the messages.

    - Data Integrity: Data received by the receiver should not be altered or modified.
    Original data is changed by an intruder or due to a harsh environment. The intruder
    may change the data according to its need and sends this new data to the receiver.

    - Data Authentication: It is the procedure of confirmation that the communicating
    node is the one that it claims to be. The receiver needs to make verification
    that the data is received from an authenticated node.

    - Data Availability: The services are available all the time whenever necessary.

    - Source Localization: For data transmission some applications use location information
    of the sink node. It is essential to give security to the location information.
    Non-secured data can be controlled by a malicious node.'
