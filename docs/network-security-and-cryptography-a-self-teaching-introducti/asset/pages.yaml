  md: 'iv. AH Information: It specifies the Authentication Algorithms, associated
    keys, key life-times, and other related parameters for AH. The hashing algorithms
    that are supported for HMAC are MD5 and SHA-1.


    v. ESP Information: It specifies the Encryption and Authentication Algorithms,
    associated keys, key life-times, Initialization Values, and other related parameters
    for ESP. The Symmetric Encryption Algorithms supported by IPSec:


    +   - Three-key 3-DES

    - IDEA

    - Three-key IDEA

    - RC5

    - Blowfish


    vi. SA Lifetime: It specifies the SA Lifetime in terms of period or in terms of
    byte-count. It also specifies that, after the life-time, whether the SA is to
