  md: "# 11.4.5 The Trust Model for Management of Public Keys in PGP\n\n+   - In PGP,\
    \ any user can have any number of Public Key-Private Key Pairs.\n- Each user has\
    \ a Private Key Ring, where it stores its private keys in encrypted form.\n- Also,\
    \ each user has a Public Key Ring, where it stores the public key certificates\
    \ of other users.\n- There are no designated certification agencies for the signing\
    \ of public key certificates.\n- The users themselves act as certification agencies\
    \ for each other.\n  Whenever a user creates a public key certificate, it obtains\
    \ digital signatures from some users.\n- The main issue here is the trust that\
    \ PGP should have in the ownership of public key certificates, that is, whether\
    \ a public key certificate claimed to be owned by a user \"A\" is really owned\
    \ by user \"A\".\n- PGP makes use of a “Trust Model” to determine if it can have\
    \ the binding between a public key and its owner (User-Id), as reflected in a\
    \ public key certificate. For this, the PGP makes use of the following fields\
    \ that make part of the Public Key Certificate:\n\n+   1. Owner Trust Field: This\
    \ indicates the extent of trust in the owner of the Public Key Certificate for\
    \ signing others' public key certificates.\n2. Signature Trust Field: Each Signature\
    \ on Public Certificate will have an associated Signature Trust Field. The value\
    \ of this field indicates the extent of trust that PGP has in the Signatory for\
    \ the signing of public key certificates. Its value equals the value of the Owner\
    \ Trust Field in the Signatory’s Public Key Certificate.\n\n+   3. Key Legitimacy\
    \ Field: This indicates the extent of trust that PGP has in the binding between\
    \ the associated User-Id and the Public Key in the Certificate. A value of 1 indicates\
    \ “Complete Trust.” Its value is computed as a weighted sum of the Signature Trust\
    \ Fields on the subject Public Key Certificate.\n\nThe owner trust field and Signature\
    \ Trust Field will assume any of the six values:"
