    # 8.5 AUTHENTICATION PROTOCOLS


    # 8.5.1 Mutual Authentication


    These protocols enable the communicating parties to be mutually satisfied about
    each other''s identity and to exchange session keys. The messages pertaining to
    the exchange of session keys have the prior existence of shared secret keys or
    public/private keys specifically meant for this purpose. The second issue is to
    prevent message replays. The techniques used to counter the message replays are:


    +   1. Time-Stamps: This approach requires synchronization of clocks among the
    communicating parties. This scheme must allow a sufficiently large window of time
    to accommodate network delays; at the same time the window should be sufficiently
    small to prevent attacks.


    +   2. Nonce Value: Party A, expecting a fresh message from B, sends Ba Non N
    (random integer value) and requires that the subsequent message from B contains
    the correct Nonce value N. This scheme is unsuitable for connectionless communication,
    since it requires a prior “handshake” of the communication parties, which goes
    against the basic principle of the connectionless approach.'
