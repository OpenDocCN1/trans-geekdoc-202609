  md: '# 14.3.1 Cloud Deployment models:


    +   - Public Cloud: the cloud infrastructure is typically owned by an organization
    selling cloud services known as a cloud service provider (CSP), and it is delivered
    to the general public on a subscription basis.


    +   - Private Cloud: the cloud infrastructure is operated only for an individual
    organization. The infrastructure may be managed by the organization itself or
    by a third party, and it may be located either on-premises or off.


    +   - Community Cloud: the cloud infrastructure is shared by several organizations
    and supports a specific community that has shared concerns. The infrastructure
    may be managed by the organizations or by a third party and may be located on-premise
    or off-premise.


    +   - Hybrid Cloud: the cloud infrastructure is a combination of both private
    and public cloud instances that remain unique entities but are bound together
    by standardized or proprietary technology that enables data and application portability.


