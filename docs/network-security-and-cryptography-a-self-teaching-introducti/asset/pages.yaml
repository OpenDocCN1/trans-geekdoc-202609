  md: '# 9.4 SIMPLE AUTHENTICATION EXCHANGE IN OPEN ENVIRONMENT


    In an open client-server environment, a server is required to authenticate the
    users requesting services from the server. Then, each application needs to store
    information like user-IDs and user passwords, which are required for authentication
    of users. This places a substantial burden on the server. An elegant alternative
    is to use a centralized Authentication Server (AS) that has passwords of all the
    authorized users stored in its database. The AS shares a unique Secret Key with
    each application server. A simplified authentication exchange using centralized
    AS in an open environment is appended here:


    +   1. C→AS: $ID_c || P_c || IDV$

    2. AS→C: Ticket

    3. C→V: $ID_v$ || Ticket


    ```

    Ticket = $EK_s[ID_e || AD_c || IDV]$

    where C: Client

    AS: Authentication Server

    V: Server

    $ID_c$: Identifier of user on Client C

    $ID_v$: Identifier of Server V

    $P_c$: Password of user on Client C

    $AD_c$: Network Address of Client C

    $K_s$: Secret Key shared between AS and server V

    ```


    In this scenario, a user with identification $ID_c$ logs onto a workstation and
    requests access to server V. The client module C in the user’s workstation requests
    the server for its password. User enters its password $P_c$ and then the client
    module C sends a message to AS. The message comprises user identification $ID_c$,
    password $P_c$, and requested server identification $ID_v$. AS checks its database
    to determine whether the user’s password matches or not and whether the user is
    authorized to access server V or not. If both tests are passed, then AS sends
    an authentication ticket to C.'
