- pgno: 248
  md: '224 • NETWORK SECURITY AND CRYPTOGRAPHY


    plaintext into long-range statistics of the cipher-text, that is, the letter frequencies
    in the resulting cipher-text will be more nearly equal than the frequencies in
    the plaintext. Another example is the Hill cipher, in which each letter of cipher-text
    is generated by linear combination of plaintext letters. In the Binary-Block Cipher,
    the diffusion is achieved by repeatedly performing some permutation on the plaintext
    bits and then applying some complex mathematical function to the permuted bit
    sequence. The mathematical function is applied using a secret key. The effect
    will be that many bits from different positions in the plaintext will contribute
    to each bit of the cipher-text, or each cipher-text bit will be affected by many
    plaintext bits. The main goal is that the statistical relationship between the
    plaintext and the cipher-text be made as complex as possible, so as to make the
    cryptanalysis extremely difficult.


    # 6.3.2 Confusion


    Confusion makes the relationship between the key and the statistical structure
    of the cipher-text as complex as possible, so that it is not possible to deduce
    the key from the cipher-text statistical structure. This is achieved by making
    the application of the key complex. In a Binary-Block Cipher, confusion is achieved
    by using a Complex Substitution Algorithm.


    # 6.4 FEISTEL CIPHER


    +   - Consider the impractical key size of a simple substitution cipher, Feistel
    proposed a structure known as a "Feistel Cipher Structure" that represents a practical
    implementation of Claude Shannon''s Diffusion and Confusion concepts.


    +   - It performs transformations of the plaintext by performing substitution
    and permutation repeatedly. That is why it is also known as a Substitution-Permutation
    Network (SPN). It makes use of both Diffusion and Confusion very effectively.'
