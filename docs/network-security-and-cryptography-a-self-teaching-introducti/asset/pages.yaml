    # 7.5.1 Diffie-Hellman Algorithm for Key Distribution


    This algorithm facilitates the exchange of a secret key securely among users.
    The key can be subsequently used for encryption/decryption of messages using a
    symmetric cipher.


    The effectiveness of the algorithm depends on the difficulty of computing discrete
