  md: '# OVERVIEW OF COMPUTER NETWORKS • 15


    +   - They operate at the Network layer (Layer 3) of the OSI model.


    +   - Routers use the logical address (IP Address).


    +   - Internetworks are Networks connected by multiple routers.


    +   - A router is a type of internetworking device that passes data packets between
    networks based on layer 3 addresses.


    # Gateways


    +   - Gateways are usually a combination of hardware and software.


    +   - They translate between different protocol suites; that is, they convert
    information from one protocol stack to another.


    +   - Gateways have the most negative effect on network performance.


    +   - Packets must be inbuilt not just at the lower levels but at the very upper
    levels so that actual data content can be converted into a format the destination
    cannt process.


    +   - Gateways create the most latency.


    # Firewalls


    +   - Firewalls act as a security guard between the Internet and your local area
    network (LAN). All network traffic into and out of the LAN must pass through the
    firewall, which prevents unauthorized access to the network.


    +   - Firewalls protect a private network''s resources from users in other networks.


    +   - They provide controlled data access between networks. Firewalls can be hardware
    or software.


    # Access points (APs)


    +   - An AP is a wireless LAN transceiver that can act as a center point of a
    standalone wireless network or as connection point between wired networks.


    +   - It provides cell-based areas where hosts can connect to the network by associating
    with the AP.'
