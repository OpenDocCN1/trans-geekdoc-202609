  md: '# 2.14 RENEWAL PROCESSES


    A renewal process generalizes the notion of a Markov process. In a Markov process,
    the times between state transitions are exponentially distributed. Let $X_1, X_2,
    X_3\dots$ be times of successive occurrences of some phenomenon and let $Z_i =
    X_i - X_{i-1}$ be the times between $(i-1)$th and $i$th occurrences, and if $\{Z_i\}$
    are independent and identically distributed (IID), the process $\{X_i\}$ is called
    a renewal process. The study of renewal processes is called renewal theory.


    One common example of a renewal process is the arrival to a queuing system. The
    times between successive arrivals are IID. In a special case where the interarrival
    times are exponential, the renewal process is a Poisson process. Poisson processes,
    binomial processes, and random walk processes are special cases of renewal processes.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_100_0.png)'
