    $a \cdot (b \cdot c) = (a \cdot b) \cdot c = (1, 3, 2)$ holds.


    $(A_n)$ **Identity Elements**: The identity element is $e = (1, 2, 3, ... , n)
    \in S_n$, which satisfies $e \cdot a = a \cdot e = a$ for each $a \in S_n$.


