- pgno: 19
  md: '# PREFACE


    Network Security and Cryptography introduces the basic concepts in computer networks
    and the latest trends and technologies in cryptography and network security. Primarily
    intended as a textbook for courses in computer science, electronics and communication,
    and electrical engineering, the book also serves as a basic reference and refresher
    for professionals in these areas. Mainly this book is organized into the 14 chapters.


    Chapter 1 is an overview of computer networks that defines its various terms and
    concepts. It also covers the Open Systems Interconnection (OSI) Model, the Transmission
    Control Protocol/Interworking Protocol (TCP/IP) Model, the Hierarchical model,
    computer network equipment, computer network topology.


    Chapter 2 covers the mathematical foundations for computer networks including
    probability fundamentals, random variables, discrete probability models, continuous
    probability models, transformation of random variables, generating functions,
    central limit theorem, classification of random processes, statistics of random
    processes and stationary, time averages of random processes, and Ergodicity, multiple
    random processes, sample random processes, and Kendall’s notation.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Chapter 3 is an overview of cryptography that defines its various terms and
    concepts. It also covers the genetic model of secure communication, OSI security
    architecture, security attacks, security services, security mechanisms, categorization
    of security attacks, categorization of cryptographic systems, symmetric encryption
    model, link encryption, end-to-end encryption, and traffic pattern confidentiality.


    Chapter 4 covers the mathematical foundations for cryptography including groups,
    rings, integral domain and fields, modular arithmetic, residue classes, primes
    and co-primes, the Euclidean Algorithm and the extended Euclidean Algorithm, the
    Galois Field, Fermat''s theorem and its corollaries, Euler''s totient function,
    Euler''s theorem, prime numbers, discrete logarithms, primitive roots, primality
    testing, and Chinese remainder theorem.


    Chapter 5 provides classical cipher schemes. It contains the Caesar cipher, the
    mono-alphabetic cipher. Hill cipher, play fair cipher, polyalphabetic cipher,
    one time pad and rail fence ciphers, rectangular transposition cipher, and steganography.


    Chapter 6 discusses modern symmetric ciphers. It covers the concepts of the symmetric
    cipher, Claude Shannon''s theory of diffusion and confusion, the Feistel cipher,
    the Data Encryption Standard (DES), avalanche effect, differential cryptanalysis
    attack on the DES, linear cryptanalysis attack on the DES, double DES, meet-in-the-middle
    attack on double DES, triple DES, block/stream cipher modes of operation, International
    Data Encryption Algorithm (IDEA), Advanced Encryption Standard (AES), key management
    in symmetric schemes, and Pseudo-Random Number Generator (PRNG) algorithms.


    Chapter 7 addresses public-key cryptography for data confidentiality. It covers
    requirements of public key cryptography, data confidentiality using public key
    cryptography, the RSA algorithm, types of attacks against RSA, Diffie-Hellman
    Key Exchange algorithm, man-in-the-middle attack against Diffie-Hellman Key exchange
    algorithm, ElGamal encryption scheme, and elliptic curve cryptography (ECC).'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Chapter 8 addresses the authentication schemes including message authentication,
    authentication services and techniques, digital signature for message authentication;
    message authentication code (MAC) and secure hash functions, characteristics of
    hash functions, authentication protocols, birthday attack against digital signatures,
    message digest algorithm (MD5), Secure Hash Algorithm (SHA-1), and the Digital
    Signature Algorithm (DSA).


    Chapter 9 covers the concept and details of the Centralized Authentication Service,
    motivation for the Centralized Authentication Service, the Simple Authentication
    Exchange in Open Environment, Centralized Authentication Kerberos Version 4, Inter-Kerberos
    Authentication Service, and Authentication Service Kerberos Version 5.


    Chapter 10 discusses the public key infrastructure (PKI) including X509 public
    key certificate; Hierarchical Organization of Certification Authorities (CAs),
    creation of certificates'' for CA''s Signature Verification; Revocation of X509
    certificates, and X509 authentication protocols.


    Chapter 11 explains in detail all aspects of Pretty Good Privacy including Email
    service PGP, services supported by PGP, components of PGP, concept of public key
