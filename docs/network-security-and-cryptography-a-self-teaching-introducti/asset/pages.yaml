  md: '# 12.7.4 SSL Alerts Protocol


    This protocol is used for conveying SSL-related alerts to peer entities.


    # 12.7.5 SSL Record Protocol


    The SSL Record Protocol provides two services for SSL connections:


    +   1. Confidentiality: The Handshake Protocol defines a shared secret key that
    is used for Conventional encryption of SSL payloads.


    +   2. Message Integrity: The Handshake Protocol also defines a shared secret
    key that is used to form a MAC. It is similar to HMAC.


