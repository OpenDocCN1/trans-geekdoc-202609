    # **Example 4.27**


    Suppose $G$ is a finite cyclic group of order $|G|$. Prove that it will have exactly
    $\phi(|G|)$ Generators.


    # **Solution**


    Let $G = \{0, 1, 2, 3, 4, ..., (n-1)\}$ be a finite cyclic group of order $|G|=n$.
    With respect to Addition Operation $(\mod n)$, any integer $a \in G$ will be a
    generator of $G$ provided $a$ is relatively prime to $n$, that is, $GCD(a,n) =
    1$.


    Now, the number of integers in $G$ that are relatively prime to $n$ is $\phi(n)=\phi(|G|)$.'
