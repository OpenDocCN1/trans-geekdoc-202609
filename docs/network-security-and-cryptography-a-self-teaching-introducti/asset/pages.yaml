    +   Step 2: Determine positive integers $<\phi(n)$ and relatively prime to $\phi(n)$.
    Let the set of integers be $\{x_1, x_2, \dots, x_k\}$.


    +   Step 3: Determine the primitive roots of $n$ by the following algorithm:

    For $i=1$ to $k$ do

    Primitive roots of $[i] = (g)^i \mod n$


    Thus, the primitive roots of $[1], \dots$, primitive roots of $[k]$ represent
    $k$ primitive roots of $n$.


