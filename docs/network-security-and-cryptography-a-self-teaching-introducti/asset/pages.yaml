  md: 'cipher-texts. The encryption/decryption keys and the transformation algorithms
    are pre-decided and known to the communicating parties.


    There are some classical cipher schemes that were vogue in the old days. These
    schemes can be categorized as Transposition Ciphers and Substitution Ciphers.
    In Transposition Ciphers, the message contents are systematically scrambled (reordered)
    so as to make the message unintelligible. For example, the word “object” may be
    scrambled to boejtc.” In the substitution ciphers, message letters are systematically
    replaced by other letters in the alphabet. For example, in the classical Caesar
    Cipher, each letter in the plaintext is substituted by three positions down in
    the alphabetic order, a cyclic manner.


    For example, “a” is substituted by “d,” “b” is substituted by “e,” and “x” is
    replaced by “a” (“a” is three positions down from “x” in the alphabet, in a cyclic
    manner). Julius Caesar is believed to have used this cipher in his confidential
    communications. But classical ciphers are of academic interest today, as they
    are extremely easy to break. The cipher-texts contain sufficient statistical information
    about the plaintext, which betrays their secrecy.


    The act of breaking ciphers is known as Cryptanalysis (also known as Hacking).
    Hacking is attempted by adversaries with the ulterior motive of gaining unauthorized
    access to encrypted messages. These days, the cipher designers also employ a kind
    of hacking called Ethical Hacking, with the aim of detecting weaknesses in their
    cipher schemes so that such weaknesses can be effectively plugged, and the cipher
    schemes do not remain vulnerable to unethical hacking.


    Cryptography has been used for maintaining the secrecy of military plans. The
    success of military operations depends largely on surprising the adversary. During
    World War II, the Germans used a complex electromechanical cipher machine known
    as the Enigma Machine.


    With the development of digital computers after World War II, a sea change was
    observed in the development of sophisticated and highly secure cipher systems.
    The computers enabled data to be represented in a binary form, and highly complex
    encryption/decryption algorithms could come into form. Each scheme involved the
    use of one or more secret keys which were kept confidential among the communicating
    parties. As long as the confidentiality of the keys was maintained, the cipher
    schemes would remain secured even if the underlying encryption algorithms were
    made publicly known.'
