- pgno: 275
  md: '# 6.7.2.3 “Meet-in-the-Middle” Attack on Triple DES


    +   - Triple DES is highly secure against a “Meet-in-the-Middle” Attack.


    +   - If an adversary attempts a “Meet-in-the-Middle” Attack against Triple DES,
    the middle point for the attack can be chosen as intermediate cipher-text $X_1$
    or intermediate cipher-text $X_2$


    +   - If the point chosen is $X_2$ then:


    +   - The attacker will need to create a table that will give values of $X_2$
    for every possible value of key $K_1$ and every possible value of key $K_2$. The
    total number of possibilities will be $2^{56+56} = 2^{112}$


    +   - $X_2$ will need to be generated by decrypting cipher-text using possible
    values of $K_1$. On the average, at least half the possible values will need to
    be tried. This will need an effort of the order $2^{55}$


    +   - Thus, the total effort will be of the order of $2^{112}+2^{55}$ The second
    term is negligible compared to the first term. Thus, the effort required will
    be of the order of $2^{112}$


    +   - This effort is extremely large as compared to the effort required for breaking
    a single DES using a brute force attack.


    +   - Triple DES, being highly secure, is used for encryption of highly sensitive
    data.


    # 6.7.3 Block Cipher vs. Stream Cipher


    +   - A Block Cipher divides plaintext into blocks of a fixed size, a normal block
    size being 64/128 bits. The encryption is performed by block-by-block, producing
    cipher-text blocks of the same size. For encryption to be reversible (or non-singular),
    each distinct plaintext block must produce a distinct cipher-text block. Now,
    for block-size $n$ there will be $2^n$ distinct plaintext-text blocks and $2^n$
    distinct cipher-text blocks.


    +   - A Stream Cipher encrypts a digital data stream bit-by-bit or by-by-byte,
    producing cipher-text of the same denomination as the plain-text. Normally stream
    ciphers handle one character (8 bits) at a time.


    +   - A Stream Cipher is more suitable for real-time inputs where data is continuously
    flowing. The moment a byte is received, it is immediately encrypted and transmitted
    without any delay at the sender end. Yet'
