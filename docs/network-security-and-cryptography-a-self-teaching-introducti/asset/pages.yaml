    The probability that the first ball is yellow is 7/10, since 7 of the 10 balls
    are yellow. So, if the first ball is yellow, then the probability that the second
    ball is yellow is 6/9, since only 6 of the remaining 9 balls are yellow. If the
    first two drawn balls are yellow, then the probability that the third ball is
    yellow is 5/8, since only 5 of the remaining balls are yellow. Therefore, using
    the multiplication theory of conditional probability,'
