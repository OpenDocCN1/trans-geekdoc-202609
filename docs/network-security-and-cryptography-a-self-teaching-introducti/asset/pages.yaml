    # 3.1.1 Cryptographic Primitives


    Encryption and Decryption Algorithms, Cryptographic Hash Functions, and Pseudo-Random
    Number Generators are basic building blocks of Crypto Systems. These are called
    *Cryptographic Primitives*.


    # 3.1.2 Cryptographic Protocols


    A single building block (or *Cryptographic Primitive*) may not be sufficient to
    provide a complete solution to achieve secrecy, validation, and integrity of data.
    It may require a series of building blocks to accomplish the task. Such a well-defined
    series of steps is called a *Cryptographic Protocol*. Figure 3.1 shows a generic
    model of secure communication.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_141_0.png)


    FIGURE 3.1 Generic model of secure communication (M: Plaintext Message, C: Cipher-text,
    K: Encryption Key, K'': Decryption Key).


    # 3.1.3 Encryption (at the Sender''s End)


    $C = E_{K_k} [M]$


    # 3.1.4 Decryption (at the Recipient''s End)


    $D_{K_{k''}} [C] = D_{K_k} [E_{K_k} [C]] = (E_{K_k})^{-1} [E_{K_k} [M]] = M$


    # 3.2 REQUIREMENTS OF SECURE COMMUNICATION


    Cryptography meets the following requirements of secure communication:


    +   The sender of a confidential message should be able to encrypt the message
    easily. What travels from the sender to the intended recipient is the cipher-text.'
