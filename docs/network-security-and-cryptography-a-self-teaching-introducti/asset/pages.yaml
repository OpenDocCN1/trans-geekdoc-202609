  md: '# 14.7 SECURITY OF WIRELESS SENSOR NETWORKS (WSNs)


    +   - A Wireless Sensor Network (WSN) is an infrastructure-less network composed
    of a large number of sensor nodes. These cooperatively sense and control the environment
    to enable its interaction with people or devices.


    +   - Wireless Sensor Networks (WSNs) are considered as one of the core technologies
    in implementing Cyber Physical Systems (CPSs).


    +   - WSNs include sensor nodes, actuator nodes, gateways, and clients. A large
    number of sensor nodes deployed randomly inside of or near the monitoring area
    form networks through self-organization.


    +   - The data is captured at the level of the sensor node, compressed and transmitted
    to the gateway. Through the gateway connection, data is then passed by the base
    station to a server.


    +   - Sensor nodes monitor the collected data to transmit to other sensor nodes
    by hopping. During the process of transmission, the monitored data may be handled
    by multiple nodes to get to the gateway node after multi-hop routing, and finally
    reach the management node through the Internet or satellite.


    +   - It is the user who configures and manages the Wireless Sensor Network with
    the management node, publish monitoring missions and collection of the monitored
    data.


