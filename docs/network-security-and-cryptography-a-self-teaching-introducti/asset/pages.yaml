    # 13.6 ANTI-VIRUS SCANNERS


    The best option is to prevent the virus from the Internet to the Local Area Network,
    but it is not possible to completely block the virus. So, a practical approach
    is to "detect, identify, and remove." This needs anti-virus scanner software to
    be installed on the system to be protected.


    # 13.6.1 Different Generations of Anti-Virus Scanners


    +   * First Generation Scanner: It requires a virus signature to identify a virus.
    Such scanners can tackle only known viruses.


    +   * Second Generation Scanner: It uses heuristic rules to search for probable
    virus infection. It may attempt to identify fragments of code which are often
    associated with a virus, or it may perform some integrity check like checksum
    verification.


    +   * Third Generation Scanner: These are memory resident and identify a virus
    by its actions, like mass deletion of files, and so on.


    +   * Fourth Generation Scanner: Packages that implement variety of anti-virus
    techniques.


    # 13.7 WORMS


    A worm infects networked machines in quick succession, and each infected machine
    acts as an automated landing pad for other machines. A network worm exhibits the
    characteristics of a virus. To replicate itself, a network worm uses some sort
    of transport:'
  merge: -1
  img_proc: true
