  md: '# 14.4.8 Three Primary Targets of Attack against the IoT:


    +   - Attacks against a device:


    An attacker takes advantage of IoT devices because many of the devices will have
    an inherent value by the simple nature of their function.


    As devices will be trusted with the ability to control and manage things, they
    also present a value for their ability to impact things. The devices have a value
    based on what is entrusted to those devices.


    +   - Attacks against the communication between devices and masters:


    An attacker invokes monitoring and altering messages as they are communicated.
    The volume and sensitivity of data traversing the IoT environment these types
    of attacks especially dangerous, as messages and data could be intercepted, captured,
    or manipulated while in transit. All of these threats endanger the trust in the
    information and data being transmitted, and the ultimate confidence in the overall
    infrastructure.


    +   - Attacks against the masters:


    Attacks against manufacturers, cloud service providers, and IoT solution providers
    have the potential to inflict the most amount of harm. These masters will be entrusted
    with large amounts of data, some of it highly sensitive in nature. This data also
    has value to the IoT providers because of the analytics, which represent a core,
    strategic asset—and a significant vulnerability if exposed. Disrupting services
    to devices also poses a threat as many of the devices will depend on the ability
    to communicate with the masters in order to function. Attacking a master also
    presents the opportunity to manipulate many devices at once, some of which may
    be deployed in the field.


