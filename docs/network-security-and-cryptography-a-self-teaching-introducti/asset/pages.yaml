- pgno: 37
  md: '# There are two types of Hubs:


    +   - **Active hub:** It amplifies or repeats signals that pass through it; it
    provides a path for the data signals and regenerates the signal before it forwards
    it to all of the connected devices.


    +   - **Passive hub:** It just connects cables on a network and provides no signal
    regeneration; it provides only a pathway for the electrical signals to travel
    along.


    # Bridges


    +   - A Bridge is a network device that connects multiple network segments. It
    breaks networks into separate segments and directs the transmission to the appropriate
    segment in order to filter traffic between network segments. Bridges reduce network
    traffic by keeping local traffic on the local segment. A Bridge examines the destination
    Media Access Control (MAC) (hardware address) in order to either forward or discard
    the frame. It operates at the Data Link layer (Layer 2) of the OSI model.


    +   - Bridging allows two or more communication networks or network segments to
    create and aggregate a Network. Bridging is different than routing, which allows
    networks to communicate independently as separate networks.


    +   - A Bridge is more intelligent than a hub. A Bridge maintains a MAC address
    table known as a “Bridge Table,” which is stored on the Bridge memory.


    # Switches


    +   - A switch is a multi-port bridge, and it creates a network.


    +   - A switch is a network device with several inputs and outputs leading to
    and from the hosts that the switch interconnects.


    +   - A switch allows multiple physical LAN segments to be interconnected into
    single larger networks.


    +   - A switch connects devices on twisted pair networks, and it forwards data
    to its destination by using the MAC address embedded in each packet.'
  merge: -1
  img_proc: true
- pgno: 38
