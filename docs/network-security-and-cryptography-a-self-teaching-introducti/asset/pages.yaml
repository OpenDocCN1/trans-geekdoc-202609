  md: '# 8.6 MESSAGE DIGEST (HASH FUNCTION) ALGORITHMS


    # 8.6.1 MD5 Message Digest Algorithm


    MD5 is a Hash Algorithm that takes as input a message of arbitrary length and
    produces as output a 128-bit Hash Value called a Message Digest. The input message
    is divided into 512-bit blocks and each block is divided into sixteen 32-bit words
    for processing. The algorithm makes use of a 128-bit Message Digest Buffer (MD
    Buffer) that holds the intermediate and final 128-bit Message Digest value.


    Figure 8.12 depicts the overall processing of an MD5 Algorithm that consists of
    the following steps:


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_388_0.png)


    FIGURE 8.12 A schematic diagram of the overall processing of an MD5 algorithm.'
  merge: -1
  img_proc: true
- pgno: 389
  md: "# Step 1: Append Padding Bits\n\n+   - The input message can be of any arbitrary\
    \ length ($K$ bits).\n- It is always padded with $1 \\dots 512$ bits such that\
    \ the message after padding becomes congruent to 448 mod 512.\n- Even if $K$ is\
    \ already congruent to 448 mod 512, padding is still added; in that case the padding\
    \ will be 512 bits.\n- The bit pattern of padding is a “1”-bit, followed by remaining\
    \ “0”-bits.\n\n# Step 2: Append Message Length\n\n+   - After padding, a 64-bit\
    \ message length equal to ($K$ mod $2^{64}$) is appended to the padded message,\
    \ where $K$ is the length of the original unpadded message.\n- After the message\
    \ length, the overall length of the message will become an exact multiple of 512.\n\
    - The overall message is divided into $L$ blocks of 512-bit blocks. Let the $L$\
    \ blocks be denoted as $Y_0, \\dots, Y_{L-1}$\n- Each block is further divided\
    \ into sixteen 32-bit words. Let the overall message $M$ be denoted as $M$ $[0\
    \ \\dots N-1]$, where $N = 16 \times L$ is the total number of 32-bit words to\
    \ be processed.\n\n# Step 3: Initialize the MD Buffer\n\n+   - The 128-bit MD\
    \ Buffer is divided into four 32-bit registers designated as A, B, C, and D, which\
    \ are used to hold the intermediate values and the final result of the message\
    \ digest (hash value).\n- These four registers are initialized to the following\
    \ HEX values:\n$A = 67452301$\n$B = EFCDAB89$\n$C = 98BADCFE$\n$D = 103254776$"
  merge: -1
  img_proc: true
