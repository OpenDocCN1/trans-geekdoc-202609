    **Figure 8.7** A schematic diagram of the Message Authentication and Confidentiality
    (MAC linked to cipher-text).


    +   - The plaintext is first encrypted using symmetric encryption and key $K_n$.
    MAC is then generated as a function of the cipher-text and key $K_p$. The MAC
    is appended to the cipher-text. The MAC is thus linked to the cipher-text.'
