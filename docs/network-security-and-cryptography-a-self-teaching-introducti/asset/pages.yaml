    # 9.2 CENTRALIZED AUTHENTICATION SERVICE


    In a distributed client-server environment like the Internet, a client can log-on,
    authenticate itself once, and then access many services without authenticating
    itself repeatedly. This is made possible by a centralized authentication service
    provided by KERBEROS. In Greek Mythology, KERBEROS means “Three-Headed Dog.”'
  merge: -1
  img_proc: true
- pgno: 416
  md: '+   KERBEROS is a centralized authentication service, meant for a client-server-based
    open environment like the Internet.


    +   Originally, it was conceived with a view to provide three services; namely,
    Authentication, Accounting, and Auditing. That is why it is named KERBEROS—“Three-headed
    Dog.” But in its present form, KERBEROS caters only to Authentication; the other
    two services never took off.


    +   Its main functions include authentication of registered users (clients) to
    the registered application servers and authentication of the registered application
    servers to the registered clients.


    +   KERBEROS stores the USER-ID and hashed Password of each registered client
    in a centralized database.


    +   Whenever any registered client approaches the Authentication Server (AS) for
    accessing services provided by any of its registered-registered application servers,
    the AS performs authentication of the user.


    +   If the user authenticates successfully, it is granted a Ticket by AS that
    is used by the user to access services from the application servers. The application
    servers trust the authentication performed by KERBEROS. In return, the application
    server also authenticates itself to the authenticated-user.


    +   KERBEROS caters to the secure communication of all message exchanges related
    to this authentication process.


    # 9.3 MOTIVATION FOR CENTRALIZED AUTHENTICATION SERVICE


    For this, we need to understand the authentication process in an open client-server
    environment. First, we consider a simple authentication exchange in an open environment.'
