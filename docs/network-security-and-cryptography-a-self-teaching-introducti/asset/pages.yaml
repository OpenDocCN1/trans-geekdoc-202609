    # 1.1.4.1 Alternate Interpretation of the Chinese Remainder Theorem


    Suppose $m_1, m_2, \dots, m_n$ be positive integers, pair-wise relatively prime
    to each other, that is, $GCD(m_i, m_j)$ where $i \le j$.


    Let $m = m_1 \times m_2 \times \dots \times m_n$.


    Then, the following set of congruence (mod $m$) has a unique solution, that is,
    $x$ has a unique solution in the range $0 \le x \le m$.


    ```

    $x \equiv a_1 \pmod{m_1}\n$x \equiv a_2 \pmod{m_2}$

    ```


    ```

    $x \equiv a_n \pmod{m_n}$

    ```


    **Proof.**


    Let $M_k = m / m_k,(1 \le k \le n)$, that is, $M_k$ is the product of all the
    moduli, except $m_k$. Since $m_k$ is relatively prime to all the other moduli
    in the previous set, $m_k$ will be relatively prime to their product $M_k$ too.


    $\\cdot GCD(M_k, m_k)=1$


    Thus, there exists a multiplicative inverse $y_k$ of $M_k (mod \ m_k)$.


    $\\cdot y_k M_k \equiv 1 \pmod{m_k}$


    $\\cdot M_k y_k \equiv 1 \pmod{m_k},(1 \le k \le n)$


    Multiplying both sides by $a_k$


    ```

    $a_k M_k y_k \equiv a_k \pmod{m_k}$

    ```


    Thus, we have


    ```

    $a_1 M_1 y_1 \equiv a_1 \pmod{m_1}$\n$a_2 M_2 y_2 \equiv a_2 \pmod{m_2}$

    ```


    ```

    $A_n M_n y_n \equiv a_n \pmod{m_n}$

    ```'
