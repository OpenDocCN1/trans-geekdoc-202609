- pgno: 107
  md: 'We can solve Equation (2.129) in several ways. An easy way is to solve

    Equation (2.129) as


    ```

    $$\begin{aligned} \lambda p_n - \mu p_{n+1} &= \lambda p_{n-1} - \mu p_n \ &=
    \lambda p_{n-2} - \mu p_{n-1} \ &= \lambda p_{n-3} - \mu p_{n-2} \ &:\vdots \
    &= \lambda p_0 - \mu p_1 = 0 \end{aligned}$ (2.130)

    ```


    Thus


    ```

    $$\lambda p_n = \mu p_{n+1}$ (2.131)

    ```


    or


    ```

    $$\p_{n+1} = \rho p_n, \quad \rho = \lambda / \mu$ (2.132)

    ```


    If we apply this repeatedly, we get


    ```

    $$\p_{n+1} = \rho^2 p_{n-1} = \rho^3 p_{n-2} = \cdots = \rho^{n+1} p_0, \quad
    n=0,1,2,\cdots$ (2.133)

    ```


    We now apply the probability normalization condition,


    ```

    $$\sum_{n=0} p_n = 1$ (2.134)

    ```


    and obtain


    ```

    $$\p_0 \left[1 + \sum_{n=1} \rho^n\right] = 1$ (2.135)

    ```


    If $\rho < 1$, we get the probability of zero jobs in the system


    ```

    $$\p_0 \frac{1}{1-\rho} = 1$ (2.136)

    ```


    or


    ```

    $$\p_0 = 1 - \rho$ (2.137)

    ```


    From Equations (2.132) and (2.137), we get the probability of $n$ jobs in the
    system'
