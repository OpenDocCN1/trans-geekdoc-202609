    \ layer. It is used to control user (client) access to the network resources.\
    \ Access layer control traffic by localizing service requests to the access media.\
    \ Network devices used in the access layer are Switches, Bridges, or Hubs. |\n\
    \n**1.5** The Hierarchical model.\n\n# 1.5 COMPUTER NETWORK EQUIPMENT\n\nNetwork\
    \ equipment includes network devices that connect directly to a network segment.\
    \ There are two types of devices (equipment):\n\n+   - **End devices or user devices**\n\
    \  User devices are network devices that provide services directly to the user\
    \ (host). Examples of end devices are scanners, fax machines, PCs, laptops, printers,\
    \ servers, iPhones, smart TVs, and iPads.\n- **Network Devices (Hardware)**\n\
    \  Network devices provide transport for the data that needs to be transferred\
    \ between end users' devices.\n- **Network interface cards (NICs)**\n  - Network\
    \ interface cards (NICs) are printed circuit boards that are installed in workstations\
    \ to enable systems to connect to the network.\n  - They provide the physical\
    \ connection between the network cable and the workstation. In addition, they\
    \ possess the circuitry necessary to gain access to the network.\n  - The NIC\
    \ formats information from the workstation that it can be transmitted across the\
    \ network. The NIC operates at the physical layer (Layer 1) of the OSI model,\
    \ and it is also considered a data link device. Part of the NIC's function is\
    \ to format information from the workstation and the network, and also to control\
    \ the transmission of data onto the wire."
