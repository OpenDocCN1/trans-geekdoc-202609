  md: '436 • NETWORK SECURITY AND CRYPTOGRAPHY


    # 12.2 INTERNET PROTOCOL SECURITY (IPSec)


    The Internet Protocol Security (IPSec) is an end-to-end security protocol that
    enables enterprises to set up secure, virtual, private networks over the Internet.
    Mainly, it covers Data Confidentiality, Data Origin Authentication, and Key Management
    related to network security.


    IPSec operates between the Network Layer and Transport Layer (Layer 3 and Layer
    4 of the OSI Model), and is thus completely transparent to the upper layers (TCP/UDP
    upward).


    It is implemented at the routers and the firewalls available at the LAN boundaries,
    and provides security only to the traffic that leaves the LAN and enters the WAN;
    the traffic within the LAN boundaries remains free of security-related overheads.


    # 12.3 SERVICES PROVIDED BY IPSec


    +   - Access Control

    - Connectionless Integrity

    - Data Origin Authentication

    - Data Confidentiality

    - Anti-Replay service (Rejection of Replay Packets)

    - Limited Traffic Flow Confidentiality


    # 12.3.1 IPSec Headers


    IPSec provides security services through two special headers that are included
    in the IP packets:


    +   - Authentication Header (AH): The AH supports Data Authentication and Connectionless
    Data Integrity of packets.


    +   - Encapsulating Security Payload (ESO) - The ESP provides data confidentiality
    to packets through symmetric encryption of payload. It also provides limited traffic
    flow confidentiality through padding. Optionally, it also provides Data Origin
    Authentication and Data Integrity of packets.'
  merge: -1
  img_proc: true
- pgno: 461
  md: '# 12.3.2 Authentication Header (AH)


    The Authentication Header supports a connectionless data integrity and data origin
    authentication of IP packets, using Integrity Check Value (ICV). IPSec also supports
    protection against replay attacks by using a sliding window protocol at the recipient
    end. The ICV covers all of the packet except the mutable fields (the fields that
    are likely to be altered in transit). One of the mutable fields in the IP Header
    is the TTL (Time to Live) field. The format of AH is depicted here as Figure 12.1:


    | IP Header | TCP Header | Data |

    |---|---|--|

    | IP-V4 Packet without AH | | |


    | IP Header | AH | TCP Header | Data |

    | IP-V4 Packet with AH | | |


    FIGURE 12.1 Placement of AH in IP-V Packet.


    # 12.3.3 AH Fields


    **Next Header:** It indicates the type of the next payload after the Authentication
    Header.


    **Payload length:** This indicates length of the AH Header in a 32-bit field that
    in combination with the Destination IP Address identifies the Security Association
    (SA) parameters. A Security Association is a one-way relationship between a sender
    and a recipient that defines the security services to be provided to the traffic
    flowing from the sender to the recipient. For a two-way peer-to-peer interaction,
    it needs two SAs to be defined.


    **Sequence Number:** A monotonically increasing sequence number assigned to the
    packets in the order they are sent on the SA.


    **Integrity Check Value (ICV):** The ICV is a 96-bit Hashed Mac (HMAC) generated
    by the following:


    +   - Computing Message Authentication Code (MAC) of Payload M and secret key
    K.'
  merge: -1
  img_proc: true
- pgno: 462
  md: '+   • Hashing the MAC value using an embedded Hash function (MD-5 or SHA-1).


    +   • Truncating the HMAC output by selecting the lowest 96 bits.


    There are some mutable fields in the IP Header that change during transit from
    source to destination, like Time to Live (TTL). Their value is set to 0 for computation
    of ICV at the sender end and at the recipient end. Figure 12.2 illustrates the
    schematic of AH Fields.


    | Next Header | Payload | Reserved |

    | --- | --- | --- |

    | | | Security Parameters Index (SPI) |

    | | | Sequence Number |

    | | | ICV (Variable Size) |


    FIGURE 12.2 Schematic of AH fields.


    # 12.3.4 Algorithm for Generation of Integrity Check Value (ICV)


    +   • ICV supports MD5 and SHA-1 as an embedded and Hashing function.


    +   • A secret key K, shared between the sender and the recipient, is used for
    generating ICV, so that no adversary can modify the message on route. The secret
    key K is chosen to be size > n bits, where n is the output message-digest size
    of function H. For MD5, n equals 128 bits and for SHA-1, it is 160 bits.


    +   • Depending upon the Hashing function H used, the ICV-generating algorithm
    is designated as:


    HMAC-MD5-96: Hashed MAC using embedded Hash-Functions MD5 and selecting lowest
    96 bits of the output.'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# HMAC-SHA-1-96: Hashed MAC using embedded Hash Function SHA-1 and selecting
    lowest 96 bits of the output.


    +   Let b bits be the input block size of embedded function H. For both MD5 and
    SHA-1, the input block size b = 512 bits.


    +   The Payload M is divided into K blocks of b bits each, with the last block
    suitably padded as per the algorithm. The L blocks are denoted as $X_0, X_1, \dots,
    X_{K-1}$.


    +   An additional b-bit block, generated as an XOR of $K^*$ and ipad, is appended
    to the payload blocks and hashed using H.


    where $K^*$: Secret Key K is padded with zeros on the left side to get the resulting
    size of b bits (equal to the input block size of H)


    ipad: HEX value 36 (00110110) repeated b/8 times that the resulting size is b
    bits


    +   The n-bit output of H is expanded to b-bits by appending zeros on its left
    side and it is appended with a b-bit block generated as XOR of $K^*$ and o-pad,
    where $K^*$ is the same as previously and o-pad is HEX value 5C (01011100) repeated
    b/8 times. The resulting value is again hashed using H.


    +   The lowest 96 bits are selected from the n-bit message digest output, and
    that form the 96-bit Integrity Check Value (ICV).


    # 12.3.5 Encapsulating Security Payload (ESP)


    The ESP supports confidentiality of payload through symmetric encryption and limited
    protection against traffic analysis through padding. Optionally, it also provides
    data-origin authentication and data-integrity through Integrity Check Value as
    in the case of AH. Figure 12.3 illustrates the schematic diagram of the ICV-Generating
    Algorithm.'
