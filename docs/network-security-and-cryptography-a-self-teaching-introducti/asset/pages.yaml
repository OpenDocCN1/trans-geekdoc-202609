    # 12. SECURITY ASSOCIATION (SA)


    It is a concept supported in IPSec. A Security Association (SA) is a one-way relationship
    between a sender and a recipient that affords security services to the traffic
    flowing from the sender to the recipient. Alternately, it can be viewed as a bundle
    of algorithms and parameters (such as keys)'
  merge: -1
  img_proc: true
- pgno: 467
  md: 'are being used to encrypt and authenticate the flow of traffic in one direction.
    For a two-way secure communication, we need to provide two Security Associations.
    The choice of encryption and authentication algorithms (from the defined list)
    is left to the IPSec administrator. A SA will permit AHI or ESP, not both. Depending
    upon the type of protection required to be provided for an outgoing packet, the
    IPSec will specify the following three parameters in the packet header, that together
    form the Security Association:


    +   - A Security Parameter Index (SPI): it is a 32-bit string that points to the
    parameters associated with the SA. It enables the recipient to select the SA under
    which the packet is to be processed.


    +   - Protocol Identifier: it indicates whether the SA protocol is AH or ESP.
    It can be either AH or ESP, but not both.


    +   - IP Destination Address: It indicates the Destination IP Address of the SA
    end-point.


    # 12.4.1 SA Parameters


    Each implementation of IPSec has a Security Association Database (SAD) that defines
    the parameters associated with each SA. The parameters that define an SA are:


    +   i. Sequence Number Counter: It is a 32-bit monotonically increasing counter
    value associated with the SA, which is included in the ESP/AH header. Whenever
    a new packet is to be sent, the counter is incremented by ONE and the value after
    incrementing is assigned to the Sequence Number Field in the AH/ESP Header of
    the packet.


    +   ii. Sequence Counter Overflow Flags: It is a flag that indicates whether the
    overflow of the Sequence Number Counter should raise an audible event and prevent
    further transmission of packets on the associated SA.


    +   iii. Anti-Replay Window: It is a sliding-window protocol implemented at the
    recipient end for rejection of replay packets. The default width of the window
    is 64 slots.'
