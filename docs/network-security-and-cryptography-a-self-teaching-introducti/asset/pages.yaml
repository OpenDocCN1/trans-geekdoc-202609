    # 2.2.4 Statistical Independence


    Lastly, suppose events $A$ and $B$ do not depend on each other. In this case,
    events $A$ and $B$ are said to be statistically independent. Since $B$ has no
    influence on $A$ or vice versa,


    $P(A|B) = P(A), P(B|A) = P(B)$


    From Equations (2.12) and (2.14), we obtain


    $P(A \cap B) = P(A)P(B)$


    indicating that the joint probability of statistically independent events is the
    product of the individual event probabilities. This can be extended to three or
    more statistically independent events


    $P(A \cap B \cap \dots...) = P(A)P(B)P(C)\dots$


    # Example 2.3


    Roll three dice separately one time. Find the probability of getting a five and
    a two and a three.


    # Solution


    Let a five event = $A$, a two event = $B$, and a three event = $C$.


    The probability of event $A$ is $P(A) = \frac{1}{6}$ the probability of event
    $B$ is $P(B) = \frac{1}{6}$, and the probability of event $C$ is $P(C) = \frac{1}{6}$.


    $A$, $B$, and $C$ are independent, because the occurrence of one event is not
    influenced by the occurrence of another.


    Therefore, the probability for all events to occur is multiplying together the
    probabilities of the individual events, that is, $P(A$ and $B)$ and $P(A$ and
    $B$ and $C) = P(A \cap B \cap C) = P(A)P(B)P(C) = \frac{1}{6} \times \frac{1}{6}
    \times \frac{1}{6} = \frac{1}{216}$.'
