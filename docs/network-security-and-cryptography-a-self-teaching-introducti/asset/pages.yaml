  md: 'OVERVIEW OF CRYPTOGRAPHY • 131


    # 3.5.2 Conventional Encryption for Confidentiality


    One of the major goals of information security is Confidentiality. A plaintext
    message is first encrypted and then transmitted to the intended recipients. The
    cipher-text generated by encryption is considered to meet confidentiality criteria
    if it satisfies the following requirements:


    +   - An adversary, not having knowledge of the decryption key, must find it extremely
    difficult to decrypt the cipher-text. An adversary may be able to capture cipher-text
    from the communication media.

    - The intended recipients, possessing the decryption key, should be able to easily
    decrypt the cipher-text.


    Consider a message transiting from the sender "A" to the intended recipient "B"
    via the Internet. En route the message will pass through many Routers/Switches.
    The Routers/Switches will make use of the destination IP address, stored in the
    message (packet) header, for routing the message from "A" to "B", as given in
    the schematic in Figure 3.3.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_155_0.png)


    FIGURE 3.3 A schematic diagram showing the routing of message from "A" to "B".


    The various approaches for the placement of Encryption/Decryption Devices could
    be categorized into the three categories:


    +   - Link Encryption

    - End-to-End Encryption

    - Combined End-to-End and Link Encryption'
