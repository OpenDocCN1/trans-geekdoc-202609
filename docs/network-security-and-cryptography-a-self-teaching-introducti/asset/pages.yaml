- pgno: 56
  md: '32 * NETWORK SECURITY AND CRYPTOGRAPHY


    # 2.1 INTRODUCTION


    The most essential branches of mathematical concepts in computer network security
    is probability and random variables, stochastic process, and queueing theory.
    The theory of probability is used to quantify uncertainty, and it provides essential
    techniques in analyzing telecommunications, computer network systems, and network
    security.


    Most network communications signals we deal with in practice are random (unpredictable
    or erratic) and not deterministic. Random signals are encountered in one form
    or another in every practical communication system. They occur in network communications
    both as information-conveying signals and as unwanted noise signals.


    A random quantity is one values which are regulated in some probabilistic way.


    Therefore, our work with random quantities must begin with the theory of probability,
    which is the mathematical discipline that deals with the statistical characterization
    of random signals and random processes.


    The concept of random (or stochastic) process is the generalization of a random
    variable to include another dimension—time. While a random variable depends on
    the outcome of a random experiment and time, a random process depends on both
    the outcome of a random experiment and time. If a random variable X is time-dependent,
    X(t) is known as a random process. Thus, a random process may be regarded as any
    process that changes with time and is controlled by some probabilistic law. For
    example, the number of customers N in a queuing system varies with time; hence
    N is a random process.


    Figure 2.1 portrays typical realizations or sample functions of a random process.
    From this, we notice that a random process is mapping from the sample space into
    an ensemble (family, set, collection) of time functions as sample functions. Here
    X(t, s) denotes the sample function or a realization of the random process for
    the s experimental outcome. It is customary to drop the s variable and use X(t)
    to denote a random process. For a fixed time t, X(t)=Xt is a random variable.
    Thus,


    A random (or stochastic) process is a family of random variables X(t), indexed
    by the parameter t and defined on a common probability space.


    It should be noted that the parameter t does not have to always represent time;
    it can represent any other variable as space.'
  merge: -1
  img_proc: true
