    # 1.3 TRANSMISSION CONTROL PROTOCOL/ INTERWORKING PROTOCOL (TCP/IP) MODEL


    The Transmission Control Protocol/Interworking Protocol (TCP/IP) is the networking
    model used in today''s Internet. The TCP/IP is the basic protocol system by which
    computers on a network talk to each other. It is a logical address, and without
    TCP/IP, networks wouldn''t work. The TCP/IP consists of four layers—Application,
    Transport, Internet, and Network Access—as shown in Figure 1.3.


    | Layer Number | Layer Name | Protocols | Function |

    |---|---|---|--|

    | 4 | Application layer | FTP, Telnet, SMPT, DNS, SNMP, HTTP | Provides services
    to user such as electronic email, file transfer, and remote login. |

    | 3 | Transport | TCP, UDP, SCTP | Provides the delivery of a message from one
    application program running on the host to another. |'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# OVERVIEW OF COMPUTER NETWORKS


    # The TCP/IP Model


    | Layer Number | Layer Name | Protocols | Function |

    | --- | --- | --- | --- |

    | 2 | Network layer or Internet layer | IP, ICMP, IGMP, ARP, RARP | Provides the
    delivery of individual packets from the source host to the destination host. |

    | 1 | Network Interface or Network Access or Physical/Link | Ethernet - IEEE 802.3
    10BaseT 100BaseTX 1000BaseT With - IEEE 802.11b/g/n RS232 | Provides an interface
    with the physical network. Formats the data for the transmission medium and addresses
    for the subnet based on physical hardware addresses. Provides error control for
    data delivered on the physical network. |


    FIGURE 1.3 The TCP/IP model.


    A TCP/IP can provide the following operations:


    +   - Responsible for dividing messages into controllable portions of data that
    will send efficiently through the transmission medium.

    - Responsible to interface with the network adapter hardware.

    - Capability of addressing data. The source device must be capable of targeting
    data to a destination. The destination device must be capable of recognizing a
    message that it is supposed to receive.

    - Capability of routing data to the subnet of the destination device, even if
    the source subnet and the destination subnet are in different physical networks.

    - Responsible for performing error control, flow control, and acknowledged. For
    reliable communication, the sending and receiving network devices must be able
    to identify and correct faulty transmissions and control the flow of data.

    - Responsible for accepting data from an application and sending it to the network.

    - Responsible for receiving data from the network and sending it to an application.

    - Figure 1.4 illustrates the TCP/IP model mapped to the OSI model.'
  merge: -1
  img_proc: true
