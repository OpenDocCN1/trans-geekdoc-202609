    # 4.3 MODULAR ARITHMETIC


    If an integer $a$ (positive, negative, or 0) is divided by a positive integer
    $n$, then we get an integer quotient $q$ and an integer remainder $r$ such that:


    ```

    $a=nq+r$, for $0 \leq r < n$ and $q=(a/n)$ (4.1)

    ```


    The remainder $r$ is called *residue*.


    Example 4.6


    +   1. For $a=11, n=7 \Rightarrow q=1, r=4

    2. For $a=-11, n=7 \Rightarrow q=-2, r=3

    3. For $a=-21, n=5 \Rightarrow q=-5, r=4$


    **Modulus** - If an integer $a$ is divided by a positive integer $n$ such that
    $a=nq+r$, for $0 \leq r < n$ and $q=(a/n)$, then $r=a \bmod n$. (4.2)


    Example 4.7


    +   1. $11 \bmod 7=4

    2. $-11 \bmod 7=3

    3. $-23 \bmod 5=2$


    **Congruent Modulo** - Two integers $a$ and $b$ are said to be congruent modulo
    $n$, if $a \bmod n = b \bmod n$. It is expressed as


    ```

    $a \equiv b(bmod n)$ (4.3)

    ```'
