    # **Example 2.1**


    Consider two events A and B with $P(A) = 0.6, P(B) = 0.3$, and $P(A \cap B) =
    0.1$.


    Find: (a) the probability of A does not occur, (b) the probability of A or B occurs,
    and (c) the probability of A but not B occurs.


    # **Solution**


    +   - **A.** $P(\text{not } A) = P(\bar{A}) = 1-P(A) = 1-0.6 = 0.4$

    - **B.** $P(A \text{ or } B \text{ occurs}) = P(A \cup B) = P(A) + P(B) - P(A
    \cap B) = 0.6+0.2-0.1 = 0.9$

    - **C.** $P(A \text{ but not } B) = P(A-B) = P(A) - P(A \cap B) = 0.6-0.1 = 0.5$'
