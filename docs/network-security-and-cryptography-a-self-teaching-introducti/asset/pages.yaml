    # 4.4 INTRODUCTION TO PRIMES AND CO-PRIMES


    # 4.4.1 Prime Numbers


    Any positive integer $p > 1$ is said to be prime if its divisors are $\pm p$ and
    $\pm I$. For example, $2,3,5,7,11,13,17, ...$


    # 4.4.2 Co-Prime Numbers or Relatively Prime Numbers


    Two integers $a$ and $b$ are said to be relatively prime (or co-primes) if the
    Greatest Common Divisor (GCD) of the two numbers is equal to 1, that is, $GCD(a,b)=1$.
    For example, 8 and $15$ are relatively prime numbers, though none of them is a
    prime number.


    # 4.4.2.1 Special Cases of Co-Primes


    # Integer 0


    Integer 0 is relatively prime to integer 1, since $GCD(0, 1) = 1$. But $0$ is
    not relatively prime to any integer other than 1, since $GCD(0, N) = N$.


    # Integer 1


    Integer 1 is relatively prime to all integers $N \geq 0$, since $GCD(1, N) = 1$.'
