    # Abelian Group:


    A Group is called an *Abelian Group* if it is a Group (i.e., obeys axioms 1 through
    4 obeyed by a group) and also obeys the following additional axiom:


    +   $(A_3)$ **Commutative:** $a \bullet b = b \bullet a$, for all $a, b \in G$


    The Set of all *integers (positive, negative, and 0)* is an Abelian Group under
    "Addition" with 0 as the identity element. The Set of non-zero real numbers is
    an Abelian Group with respect to "Multiplication", with 1 as the identity element.
    The element 0 is not included in the group, since it does not have a multiplicative
    inverse.


    For "Addition" the identity element is 0, and the additive inverse of an element
    $a$ is $-a$. *Subtraction* is defined by $a - b = a + (-b)$.


    For "Multiplication" the identity element is 1, and the multiplicative inverse
    of an element $a$ is $a^{-1}$.


    **Division** is defined as $a / b = ab^{-1}$.


    # 4.2.1.1 exponentiation within a Group


    Exponentiation in a Group is defined as repeated application of the Group Operator.


    For example, if element $a \in \{G, \+\}$ then $a^k = a \bullet a \bullet a \dots$
    ($k$ times), with $a^0 = e$ (the identity element) and $a^{-n} = (a^n)^{-1}$.


    ```

    For $\{G,+\}$, \quad a^k = a + a + a + \dots + a \quad (k times)\n\quad kn\n\quad
    a^0 = 0n = 0 \quad (additive identity element)\nFor $\{G, \times\}$, \quad a^k
    = a + a + a + \dots + a \quad (k times)\n\quad a^k\n\quad a^0 = 1 \quad (multiplicative
    identity element)

    ```'
