    # 4.12.3 Another Method of Determining the Primitive Roots of a Number $n$


    +   Step 1: Determine integer $g(1 < g < \phi(n))$ such that $\{g^1 \mod n, g^2
    \mod n, \dots, g^{(e)} \mod n\}$ are all distinct and relatively prime to $n$.
