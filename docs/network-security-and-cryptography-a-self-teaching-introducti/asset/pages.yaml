  md: '# MODERN SYMMETRIC CIPHERS • 227


    +   1. Block Size: The larger block size, the more secure the cipher will be.
    Currently, the typical size is 128 bits.


    +   2. Key Size: The larger the key-size, the more secure the cipher. Currently,
    the typical size is 128 bits.


    +   3. Number of Rounds: The higher the number of Rounds, the higher the security.
    The typical number is 16.


    +   4. Complexity of Sub-Key Generation Algorithm: The more complex the algorithm,
    the more secure the cipher will be.


    +   5. Complexity of Round Function “F": The more complex the Round Function “F”,
    the more secure the cipher will be.


    While the design of a cipher system should be resistant to cryptanalysis, it should
    also meet the following criteria:


    +   1. Faster Encryption/Decryption: It should meet the system throughput requirement.


    +   2. Easy to Understand: Though performing complex transformations, the algorithm
    should be concise and easy to understand, so that it can be easily analyzed for
    any vulnerability to cryptanalysis.


    Increasing the security level of a cipher scheme may result in higher encryption/decryption
    overheads. A balance has to be struck between the two.


    # 6.5 DATA ENCRYPTION STANDARD (DES)


    The Data Encryption Standard (DES) was adopted by the National Bureau of Standards
    (now called the National Institute of Standards and Technology) as Federal Information
    Processing Standard 46 (FIPS 46). The algorithm used in DES is called the Data
    Encryption Algorithm (DEA), which encrypts plaintext data blocks of a size of
    64 bits using a 56-bit overall key and outputs 64-bit cipher-text blocks as in
    Figure 6.3. DES is built around a Feistel Cipher Network with 16 rounds of processing,
    each round having a 48-bit sub-key drawn from a 56-bit overall key. Figures 6.4
    and 6.5 show Feistel encryption and decryption algorithm processes for DES.'
