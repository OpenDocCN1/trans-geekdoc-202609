- pgno: 310
  md: '# C. Strength of ANSI X. 9. 17 PSNG


    The value of a pseudo-random number is a function of:


    +   - Secret Keys used in three blocks of 3-DES. As such, 3-DES is considered
    to be highly secure. The effort required to break a 3-DES cipher is of the order
    of $2^{11}$.


    +   - Current Date-Time value $DT$, obtained in real-time from the system. It
    is extremely difficult to predict its value that existed at the time of generation
    of a random number.


    +   - A seed $V_i$, obtained as output during the generation of a previous random
    number. This number is also difficult to predict.


    Thus, ANSI X.9.17 is considered to be highly secure and used in sensitive financial
    transactions.


    # iii. Blum Blum Shub (BBS) Pseudo-Random Bit Generator


    A Cryptographically Secure Pseudo-Random Bit Generator (CSPRBG), it proceeds as
    follows:


    +   - Choose two prime numbers $p$ and $q$ such that $p\equiv q\equiv 3(mod4)$.
    For example, prime numbers 7 and 11 satisfy this condition.


    +   - Compute $n=pq$


    +   - Now choose a random number $s$, which should be relatively prime to $n$,
    that is, $s$ should not have $p$ and $q$ as its factors.


    +   - The BBS generator produces a series of bits according to the following algorithm:


    ```

    $X_n = s^3 mod n$

    ```


    For $I=1$ to $\alpha$ do


    ```

    $X_i = (X_{i-1})^2 mod n$

    ```


    ```

    $B_i = X_i mod 2$

    ```


    +   - The least significant bit is taken as output at each iteration


    +   - BBS is considered a “Cryptographically Secure Pseudo-Random Bit Generator,”
    since it passes the “Next-Bit Test."'
