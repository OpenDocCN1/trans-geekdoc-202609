  md: '# 3.5.3.2 Combined End-to-End and Link Encryption


    +   - To achieve greater security, both link and end-to-end encryption schemes
    may be implemented.

    - The Link Encryption is implemented at the Data Link Layer and the end-to-end
    encryption is implemented at the Network Layer.

    - The sender at the source node first encrypts the payload portion of the message,
    leaving the header clear, using the end-to-end encryption key that it shares with
    the destination node. Then the source applies link encryption, which covers the
    entire message including the header.

    - As the packet traverses the network, each switch decrypts the link decryption
    key to access its header and then encrypts the entire packet again, using another
    link encryption key prior to its retransmission of another link. At the switch
    nodes, only the Packet Header is vulnerable to attack.

    - At the destination node, first the link encryption is removed using the link
    key and then the end-to-end encryption is removed using the key that is shared
    with the source node.

    - The scheme has the advantages and disadvantages of both link encryption and
    end-to-end encryption.


    # 3.5.3.3 Traffic-Pattern Confidentiality


    The following information can be derived by an adversary from the Traffic-Pattern:


    +   - Identities of the communicating partners. This can be determined from the
    Source and Destination IP addresses stored in the Packet Header.

    - Frequency and length of the messages among different communicating partners.

    - The adversary will also monitor the events correlating with the exchange of
    information.


    # 3.5.3.4 Schemes to Achieve Traffic-Pattern Confidentiality


    +   - Link Encryption: In Link Encryption, the Network Layer Headers (Packet Headers)
    are encrypted, reducing the opportunity of Traffic Analysis. However, it is still
    possible for an attacker to get the number'
