  md: '# 6.10.2 Key Distribution Schemes


    Figure 6.26 illustrates the following key distribution schemes:


    +   - Centralized Key Distribution

    - Decentralized Key Distribution


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_302_0.png)


    FIGURE 6.26 Key distribution schemes.


    There are two kinds of keys:


    +   - **Master Keys:** A Master Key is shared between a KDC and an end-user. If
    there are N end-users, then will there be N Master Keys. The Master Keys are distributed
    by Non-Cryptographic methods, like physical delivery by secure post.


    +   - **Session Keys:** Data Communication between end-users is protected using
    temporary keys called Session Keys. A Session Key for a session between end-user
    A and end-user B is assigned by the KDC, and its'
  merge: -1
