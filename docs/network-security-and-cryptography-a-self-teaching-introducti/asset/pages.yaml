    # 5.1 INTRODUCTION


    In classical cryptography, primarily two kinds of crypto-systems were in vogue,
    that is, the Substitution Ciphers and the Transposition Ciphers. In the Transposition
    Cipher, the plaintext letters are systematically scrambled (reordered) so as to
    make the plaintext unintelligible. For example, the word “software” may be scrambled
    to read as “foseawter.” that is, letters are swapped with each other. In the transposition
    ciphers, the letters in the plaintext are systematically replaced by other letters.
    In this chapter, we discuss some of the popular classical cipher schemes.


    # 5.2 CLASSICAL SUBSTITUTION CIPHERS


    In classical substitution Ciphers, the letters of the plaintext are replaced by
    other letters or by numbers or symbols; or if plaintext is viewed as a sequence
    of bits, then substitution involves replacing the plaintext bit with'
