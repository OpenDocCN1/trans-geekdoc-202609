    # 5.2.2 Mono-Alphabetic Cipher


    In the mono-alphabetic cipher, each plaintext letter is mapped onto a cipher-text
    letter. To make the encryption process reversible, the mapping from plaintext
    alphabets to cipher-text alphabets is one-to-one, that is, mapping is unique both
    ways. To implement this scheme, a look-up table is created defining the mapping
    from plaintext alphabets to cipher-text alphabets, and that table acts as a key
    for encryption and decryption. The table is kept confidential between the sender
    and the intended recipients. Table 5.2 may form the encryption/decryption key:


