    # 2.3.1 Cumulative Distribution Function


    Whether X is discrete or continuous, we need a probabilistic description of it
    in order to work with it. All random variables (discrete and continuous) have
    a cumulative distribution function.


    The cumulative distribution function is given by the probability that the random
    variable X is less than or equal to x, for every value x.


    Let us denote the probability of the event X ≤ x, where x is given as P(X ≤ x).
    The cumulative distribution function of X is given by


    ```

    $F_X(x) = P(X \leq x), -\infty \leq x \leq \infty$ (2.22)

    ```


    for a continuous random variable X. Note that $F_X(x)$ does not depend on the
    random variable X, but on the assigned value of X. $F_X(x)$ has the following
    properties:


    +   1. $F_X(-\infty) = 0$ (2.23a)


    +   2. $F_X(\infty) = 1$ (2.23b)


    +   3. $0 \leq F_X(x) \leq 1$ (2.23c)


    +   4. $F_X(x_1) \leq F_X(x_2)$, if $x_1 < x_2$ (2.23d)


    +   5. $P(x_1 < X \leq x_2) = F_X(x_2) - F_X(x_1)$ (2.23e)


    The first and second properties show that $F_X(-\infty)$ includes no possible
    events and $F_X(\infty)$ includes all possible events. The third property follows
    from the fact that $F_X(x)$ is a probability. The fourth property indicates that
    $F_X(x)$ is a nondecreasing function. And the last property is easy to prove since


    ```

    $P(X \leq x_2) = P(X \leq x_1) + P(x1 < X \leq x_2)$

    ```


    or


    ```

    $P(x_1 < X \leq x_2) = P(X \leq x_2) - P(X \leq x_1) = F_X(x_2) - F_X(x_1)$ (2.24)

    ```


    If X is discrete,


    ```

    $F_X(x) = \sum_{i=0}^{x} P(x_i)$ (2.25)

    ```'
