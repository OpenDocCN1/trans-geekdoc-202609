  md: "For block size $n$, the number of distinct reversible transformations is equal\
    \ to $2^n$! For a practical block size of 64 or 128 bits, the number of distinct\
    \ reversible transformations will be extremely high, thus making the substitution\
    \ cipher highly resistant to brute-force attacks.\n\n# 6.2.3 Key Size for the\
    \ Simple Substitution Cipher\n\nThe ordered set of entries on the right-hand side\
    \ of the encryption table forms the key, the first entry representing the cipher-text\
    \ corresponding to plain-text 0 and the last entry representing the cipher-text\
    \ corresponding to plaintext $2^n$ - 1.\n\nThe size of the key (for $n=4$) = $4\
    \ \times 24 = 64$ bits.\nIn general, an $n$-bit block size, the key size = $n\
    \ \times 2^n$ bits.\n\nFor a 64-bit block size, the size of key = $64 \times 2^{64}\
    \ = 2^{70}$ bits (very large value).\n\nTo get an idea for the memory space required\
    \ to store the key, the memory of a PC with 4GB RAM is $2^{32}$ bits. Thus, the\
    \ number of PCs required to store the key of a 64-bit substitution cipher is $2^{35}$\
    \ or 4GB. This makes the simple substitution cipher very difficult to implement.\n\
    \n# 6.3 CLAUDE SHANNON’S THEORY OF DIFFUSION AND CONFUSION\n\nIn cryptographic\
    \ terms, Diffusion and Confusion are two encryption processes that making the\
    \ resulting cipher-text very difficult to cryptanalyze.\n\n# 6.3.1 Diffusion\n\
    \nDiffusion causes each element of the plaintext to affect many elements of the\
    \ resulting cipher-text. Thus, each element of the resulting cipher-text is influenced\
    \ by many elements of the plaintext. For example, suppose $M = m_1, m_2 \\dots\
    \ m_n$ is a plaintext message comprising $n$ letters of the English alphabet.\n\
    \nThe encryption algorithm may generate each cipher-text letter $c$ by modular\
    \ addition of $k$ successive letters of plaintext, that is, $c_n = \\sum_{i=1}^{k}\
    \ m_{n+1} \\pmod{26}$.\n\nThus, each letter of the cipher-text is influenced by\
    \ $k$ successive letters of plaintext. This operation dissipates (diffuses) the\
    \ statistical structure of the"
