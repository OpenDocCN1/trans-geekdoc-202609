  md: '# 12.7 SECURE SOCKET LAYER/TRANSPORT LAYER SECURITY (SSL/TLS)


    Secure Socket Layer (SSL) operates above layer 4 (TCP Layer) and provides confidentiality
    and authentication services to the TCP Layer. Transport Layer Security (TLS) is
    an Internet Engineering Task Force (IETF) which is an Internet standard for SSL.


    # 12.7.1 Components of SSL


    +   - SSL Handshake Protocol

    - SSL Change Cipher Specs Protocol

    - SSL Alerts Protocol

    - SSL Record Protocol


    Figure 12.12 illustrates the components of SSL.


    | SSL Handshake Protocol | SSL Change Cipher Spec Protocol | SSL Alert Protocol
    | HTTP |

    |---|---|---|--|

    | SSL Record Protocol | | | |

    | TCP | | | |

    | IP | | | |


    FIGURE 12.12 Components of SSL.


    # 12.7.2 SSL Handshake Protocol


    This protocol enables clients and servers to validate each other over the Internet
    and to negotiate Encryption and MAC Algorithms, along with their cryptographic
    keys, for use in the SSL Record Protocol. It consists of a series of messages
    exchanged between the clients and servers. This protocol is used prior to transmission
    of any application data.


    # 12.7.3 SSL Change Specs Protocol


    This protocol causes a pending state to be copied into a current state, thus causing
    a change of service cipher specs.'
