    # Localized Encryption and Authentication Protocol (LEAP)


    +   LEAP is a protocol with key management scheme that is very efficient with
    its security mechanisms used for large scale distributed sensor networks. It is
    designed to support in-network processing such as reduction of the energy consumption
    in network. To provide the confidentiality and authentication to the data packet,
    LEAP uses multiple keys mechanism. For each node four symmetric keys are used
    as follows:


    +   Individual Key: Used for the communication between source node and the sink
    node.


    +   Pair Key: Shared with another sensor node.


    +   Cluster Key: Used for locally broadcast messages and is shared between the
    node and all its neighboring nodes.


    +   Group Key: Used by all of the network Nodes.


    # TINYSEC


    +   TINYSEC is a lightweight protocol and link layer security architecture for
    WSNs.


    +   It supports integrity, confidentiality, and authentication. To achieve confidentiality,
    encryption is done using CBC (Cipher-block chaining) mode with cipher text stealing,
    and authentication is done using CBC-MAC. No counters are used in TINYSEC. Hence,
    it doesn''t check the data freshness. Authorized senders and receivers share a
    secret key to compute a MAC.'
  merge: -1
