    # 11.2.3 Placement of Compression/Decompression Functions in PGP


    The compression algorithm used is ZIP. The message is compressed after applying
    the signature before encryption, for the following reasons:


    +   1. The signature is applied before compression, since only thecompressed message
    will need to be saved along with the signature at receiving end; this can be used
    later for signature verification. Otherwise, either the compressed message would
    need to be saved or the message would need to be compressed for subsequent signature
    verification, and a compatible ZIP version may not be readily available for compression.

    2. Bulk encryption is performed after compression since it reduces the size of
    the plaintext to be encrypted, saving the encrypted overheads.


    # 11.3 RADIX-64 (R64) TRANSFORMATION


    Many email services permit the use of only printable ASCII characters. To comply
    with this requirement, the PGP performs R64 that converts the input binary data
    to printable ASCII Characters. Each group of 3 octets'
  merge: -1
  img_proc: true
- pgno: 449
  md: 'of input binary data is divided into four blocks of 6 bits each. Each 6-bit
    block is mapped onto an 8-bit printable ASCII character, using the follow-ing
    transformation:


    | 0 | "A" | 26 | "a" | 52 | "0" | 62 | "+" |

    |---|---|---|---|---|---|---||}{

    | 1 | "B" | 27 | "b" | 53 | "1" | 63 | "/" |

    | 2 | "C" | | | | | | |

    | | | | | | | | |

    | 25 | "Z" | 51 | "z" | 61 | "9" | | |


    One more character "=" is used for padding.

    The format also uses CRC to detect errors in transmission. Radix-64 the size of
    the message gets increased by 33 percent. This is the price paid to make the info
    comprising printable characters to the PGP email-compatible.


    Suppose original size, prior to R64 Transformation = X

    Size after R64 Transformation = 1.33X

    Size after ZIP Compression (assuming 1:2 ratio) = 0.665X

    Overall size reduction = 0.335X

    % Age Reduction = 33.5 %


    # 11.3.1 Segmentation and Reassembly


    Almost all facilities put a max limit on the message size. To accommodate this
    restriction, PGP automatically fragments a message after applying the R64 conversion.
    At the other end the segments are assembled prior to processing.


    # 11.4 CONCEPT OF THE PUBLIC KEY RING AND PRIVATE KEY IN PGP


    In PGP, an email user can have any number of private keys and corresponding public
    keys. The private keys owned by a user are kept in their private key ring. The
    corresponding public keys are sent to other users, which are kept on their public
    key ring. Thus, each PGP user has a private Key ring and a Public Key ring.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# 11.4.1 Fields of the Private Key Ring


    The private key ring is a table stored as a file on the disc. Figure 11.4 illustrates
    the fields of pretty privacy of the private key ring. Each row in the table comprises
    the following fields:


    +   - Time-Stamp: This is Date/Time when the private key entry is made on the
    ring.


    +   - Key-Id: the key id comprises 64 least significant bits of the corresponding
    public key.


    +   - Public Key: Public key corresponding to the private key.


    +   - Encrypted Private Key: Encrypted value of the private key. The encryption
    is performed using the hash value of a pass phrase known only to the owner of
    the private key.


    +   - User-Id: The user comprises the email address of the private key owner.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_450_0.png)


    **Figure 11.4** A schematic diagram of the fields of pretty privacy of the private
    key ring.


    After encryption of the private key, *PGP* discards the pass-phrase and hash value
    of the pass-phrase. The owner must remember the pass phrase for subsequent decryption
    of the private key.


    To decrypt the private key, the owner is prompted to enter its pass phrase. The
    hashed value of the entered pass phrase is used as the decryption key. *PGP* will
    be able to decrypt and recover the private key only if the user has entered the
    correct pass phrase.


    # 11.4.2 Generation of Session Keys


