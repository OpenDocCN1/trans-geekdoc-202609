  md: '# 2.15 KENDALL''S NOTATION


    In view of the complexity of a data network, we first examine the properties of
    a single queue. The results from a single queue model can be extended to a network
    of queues. A single queue is comprised of one or more servers and customers waiting
    for service. As shown in Figure 2.18, the queue is characterized by three quantities:


    +   * the input process,

    * the service mechanism, and

    * the queue discipline.


    ![](img/d3b56042c756fbcc011ff06f1b9f53f0_101_0.png)


    **FIGURE 2.18** A typical queuing system.


    The input process is expressed in terms of the probability distribution of the
    interarrival time of arriving customers. The service mechanism describes the statistical
    properties of the service process. The queue discipline is the rule used to determine
    how customers waiting get served. To avoid ambiguity in specifying these characteristics,
    a queue is usually described in terms of a well-known shorthand notation devised
    by D. G. Kendall. In Kendall''s notation, a queue is characterized by six parameters
    as follows:


    > A/B/C/K/m/z (2.118)


    where the letters denote:


    +   **A:** Arrival process, that is, the interarrival time (t) distribution

    **(M)** exponential, D = deterministic, G = general, arrival rate = λ = 1 / E(τ)

    **B:** Service process, that is, the service time (s) distribution

    **(M)** exponential, D = deterministic, G = general, service rate = μ = 1 / E(s)

    **C:** Number of servers (1 server, c servers, ∞)

    **K:** Maximum capacity of the queue (default = ∞)

    **m:** Population of customers (default = ∞)

    **z:** Service discipline (default = FIFO)'
