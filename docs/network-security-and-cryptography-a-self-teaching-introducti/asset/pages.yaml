  md: 'and frequency of messages. Protection against this analysis can be provided
    by Traffic Padding. Traffic Padding produces a continuous stream of cipher-text,
    filling the gaps among messages with encrypted data. This dummy data is recognized
    and ignored at the recipient end. An attacker cannot assess the quantum computing
    of traffic and the message''s length.


    +   - End-to-End Encryption: In End-to-End Encryption, the traffic analysis can
    be prevented by inserting some dummy messages randomly at the Network Layer. At
    the other end, such messages should be easily recognizable to avoid confusion.


    # 3.5.3.5 Security Level of Encryption Schemes


    The security level of an encryption scheme be defined as follows:


    +   1. Unconditionally Secure Schemes: An Encryption Scheme is said to be unconditionally
    secure if the cipher-text generated by that scheme does not contain enough information
    for uniquely determining the responding plaintext, irrespective of how much of
    cipher-text may be available to an adversary.


    +   2. Computationally Secure Schemes: An Encryption Scheme is said to be computationally
    secure if it satisfies either of the two conditions:


    +   A. The cost of breaking the cipher exceeds the value of the encrypted information.


    +   B. The time required to break the cipher far exceeds the useful lifetime of
    the encrypted information.


    # 3.5.3.6 Cipher Designers vs. Cryptanalysts


    Strictly speaking, no cipher scheme is unconditionally secure. Given an unlimited
    memory space and unlimited processing speed, any cipher can be broken in a reasonable
    timeframe. The commercially available cipher schemes are considered only to be
    “Computationally Secure” until someone succeeds to break it. Then the designers
    attempt to make the scheme more secure either by refining the algorithm or by
    increasing the key size. As'
