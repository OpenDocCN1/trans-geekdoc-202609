    like `Sapien` and `Killi` are solving this issue. `Sapien` provides control, access,
    and ownership to all users who participate and contribute to its network. `Killi`
    compensates social users for their contributions. In both cases, users are not
    treated as a product; instead, they contribute to the social economy.


    *   **Effective content control:** Manipulation of social user emotions by leveraging
    data is not uncommon, and several stories have recorded such events. One potential
    reason triggering such events is the sole authority over data utilization, as
    social user data is accessible to a central governing authority. With blockchain,
    no single entity can dictate content, making manipulative content on the network
    easy to eliminate. There will be more effective control over content on social
    networks due to the inherent decentralized nature of the network. Organizations
    like `DTube` are solving this issue. It is a decentralized video distribution
    platform based on the `STEEM` blockchain. The purpose is to eliminate the central
    authority and reduce control over content distribution. `STEEM` is a decentralized,
    blockchain-based public content system. It supports community building by promoting
    social interactions based on a rewards system. The platform rewards community
    participants for making quality contributions. `STEEM` is a liquid currency and
    can be bought or sold on exchanges.


    *   **Improved security:** Social media platforms can go far to reach and breach
    social interactions to govern social user behaviors. Several allegations have
    been reported against `Facebook` for accessing social user data without explicit
    permission. Moreover, less secured communication channels over social networks
    raise many potential data leaks and identity theft issues. Blockchain technology
    provides a convenient and robust security layer for the exchange of messages or
    communications. Organizations like `SoMee` are working in this direction to provide
    a secured social communication network. It is a platform based on a decentralized
    blockchain to cryptographically secure user data.


    *   **Expanding and protecting freedom of speech:** In the democratic culture
    of expression, the technological dominance of controlling speech and expression
    is somewhat detrimental to societal growth. Many incidents of blocking and controlling
    access to social media sites have been attempted. Even though popular sites promise
    to encrypt communication messages to avoid identity issues, they become identifiable
    due to the presence of metadata with the message. Blockchain provides an effective
    solution to this problem, as metadata is not tied to a single identity and is
    distributed across the network, thus providing true anonymity. An organization
    like `Civil` has based its solution on a decentralized blockchain network. It
    supports freedom of speech and offers services to small outlets and journalists.
    The `Civil` community governs the `Civil` registry. Community members approve
    newsrooms joining the civil society. `Civil` tokens can be used to raise issues
    against any newsrooms.

    '
