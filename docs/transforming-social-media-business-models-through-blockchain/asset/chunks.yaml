  trans: '


    # 沟通


    企业参与者可以通过适当使用社交媒体策略来实现经济高效的沟通。它既可用于正式讨论，也可用于非正式讨论。公司采用前者，而员工采用后者来疏导沟通。社交媒体应用可以放大非正式沟通结构，人们可以利用它来分享项目目标和工件，并提高效率和知识水平。此外，社交媒体应用带来了多元化的沟通，因为它允许共享和利用不同类型的媒体。


    像 Salesforce.com 和 Cisco 这样的公司已将社交媒体战略性地引入各自的业务中。为了跟上其产品供应的步伐并在培训能力上保持优势，Salesforce.com
    开始利用 YouTube 视频培训客户，从而减少了相当于数百名销售人员的工作量。Cisco 利用各种社交媒体平台与不同的利益相关者建立联系。它利用近 31
    个博客来服务受众，涵盖公司信息、供应、产品等众多内容。


    此外，它还利用 Facebook 粉丝页传播解决方案、供应、服务和相关信息。它还利用 Twitter 扩大客户群。Cisco 还使用 Flickr 来展示产品、活动和供应的照片。


    # 社区存在


    在没有时间和空间障碍的情况下建立虚拟社区是轻而易举的。社交媒体应用提供了多种方式，让人们聚集在一起讨论、辩论和分享共同感兴趣的话题。例如，LinkedIn
    为专业社区提供了聚集在一起、分享与群组相关的关切和解决方案的平台。企业可以战略性地识别社区中的子社区和影响者。通过影响者引导供应、服务和解决方案，有助于提升利润率和增长。


    # 集体智慧


    管理、控制和管理由社交媒体利益相关者构建的集体知识是至关重要的一环。随着越来越多的人加入社区，参与沟通形成了知识语料库。企业可以深入了解其产品和服务，还可以收集竞争对手的业务产品组合。通过处理社交媒体社区产生的知识语料库，企业可以在竞争和绩效方面占据优势。


    Starbucks 根据集体智慧战略性地构建产品、服务和供应。它运营一个 Facebook 粉丝页，并维护 MyStarbucksIdea 网站以收集潜在消费者的想法。通过社交媒体应用的集体智慧，Starbucks
    获得了更多客户，开发了富有洞察力的体验，生产了实用的供应，并执行了社会责任项目。


    可口可乐“Freestyle”自动售货机展示了 100 多种口味选择。顾客有机会混合口味、品尝并将体验分享给社交媒体上的朋友。此类富有洞察力的细节帮助公司推出了新的创新产品。


    Cisco 举办了一场“十亿美元创意大赛”，吸引了来自 157 个国家的 3,000 名参与者贡献了 800 个创意。获奖者获得了 250,000 美元的奖金。社交媒体助推了
    Cisco 的“十亿美元创意”，因为每个创意的成本约为 321 美元，却能产生十亿美元的业务。


    # 协作


    社交媒体应用最强大的功能是协作。它为人们在个人和职业领域进行协作提供了多种途径。有确凿的记录表明，社区主动站出来，共同合作，在像“保护森林”这样成功的可持续项目上进行了协作。


    埃森哲是一家全球性的咨询、技术服务和外包公司，在全球雇佣了 200,000 多名员工。它利用 Facebook 和 LinkedIn 构建了一个交互式协作平台，以连接和协作运行、管理和执行项目。


    # 风险与挑战


    无论您从事业务的哪个领域，采用社交媒体都可能带来多种风险。这些风险——如声誉管理、信息不对称、信息溯源、完整性和可靠性、可见与不可见的影响范围——都会影响业务。一些风险与组织的核心（即其基因）息息相关，但有些可以通过技术干预来解决。一些公司是封闭文化，因为它们不相信共享和传播信息。因此，它们是受社交媒体采用影响最大的群体。对它们而言，拥有共同的社交媒体沟通语言和目标至关重要。此外，还需要解决实施、集成和互操作性问题，以促进不同社交媒体平台之间的融合并实现数据可移植性。


    # 新社交媒体


    有趣的是，过去的社交媒体为我们提供了大量信息。其中一些有用，但许多却受到不可靠、质量低劣、缺乏完整性、不可追溯、可信度低和不道德等问题的困扰。现在是时候开发框架和标准来管理、控制、管制和监管社交媒体的各个方面了。监管应由
    AI 和数据驱动技术的适当使用来管辖。


    此外，重点需要从中心化控制（由一个中央权威控制社交媒体的各个方面）转移到同伴控制（参与的同伴对其行为拥有所有权和控制权）（Casey & Vigna, 2018）。我们应该拥有一种机制，共同商定正确信息的可信度和完整性。每个贡献者都应因其贡献获得回报，而不是仅由
    Facebook 或 Google 等单一中央权威获取所有人贡献带来的所有收入。此外，对社交媒体上信息传播的信任至关重要。社交媒体需要发挥积极作用，确保所提供的信息和来源准确、可信且真实，以避免任何错误信息。


    物联网已成为人类社会不可或缺的一部分，人机组合促成了数据的指数级增长（Dorri, Kanhere, & Jurdak, 2016; Kitchin, 2014）。三星健康支持许多活动和挑战，来自世界各地的人们参与并执行。它还提供排行榜，用户可以在其中查看自己在挑战中的表现，并评估自己相对于其他参与者的位置。


    社交物联网正在改变人类社会的经济、物理和行为层面。当智能家居与社交媒体集成时，会生成关于家庭及其环境的有用信息。例如，每当房屋环境照明发生变化或有人签到进入房屋时，消息可能会自动发布到
    Twitter 上。


    信息搜索是最重要但也是最耗时的活动。许多商业模式通过在信息搜索模型上结合广告业务获益。虽然此类模式对广告商有利，因为他们的信息在搜索时会出现在巨大网络的顶端，但消费者并未真正获益。此外，如果搜索结果不当，搜索的完整性就会受到质疑。因此，未来的信息搜索社交媒体商业模式必须重新思考参与者和利益相关者的角色和责任，以提供真正的价值主张（Gillin
    & Schwartzman, 2010; Haenlein, 2011）。它必须在内容搜索和个性化过程中保障消费者的利益，而不应仅使社会的某一个阶层受益。


