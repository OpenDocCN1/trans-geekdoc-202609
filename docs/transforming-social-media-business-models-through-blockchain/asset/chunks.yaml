  fmt: '

    用户可以通过现有的社交媒体账户或 `Scatter` 登录。通过 `Scatter` 登录时，用户有机会授权提议的编辑。当使用 `OreID` 时，它通过现有的社交媒体账户生成，结合
    PIN 码来确认提议的编辑。一旦 `Scatter` 或 `OreID` 授权了更改，文章或编辑就会向社区开放投票，一旦获得批准，编辑就会合并到文章中。


    读者不再是被动地阅读文章，还可以通过投票来塑造呈现给世界的信息。任何拥有 `EOS` 账户、持有 `IQ` 代币并通过 `Scatter` 登录的用户都有能力投票。每位投票给多数派的贡献者都可以获得与其投票量成比例的奖励。如果提交的编辑被拒绝，或者投票给了少数派，则贡献者的代币会在“惩罚”阶段被锁定一段时间。


    #### 用例


    让我们通过用例场景来了解 `Everipedia` 平台的运作。假设 `Nick` 首次使用现有的社交媒体账户（例如 `Facebook`）加入 `Everipedia`
    平台。`Nick` 默认获得 250 个 `IQ` 代币和最多五次编辑提议的能力。每次编辑提议消耗 `Nick` 50 个 `IQ` 代币。由于 `Nick`
    是通过社交媒体账户加入的，他仅限于创建文章和提议编辑。他没有资格参与投票。


    此外，由于账户功能访问受限，`Nick` 的任何贡献都不会获得奖励。另一方面，`John` 通过 `Scatter` 账户加入 `Everipedia` 网络并持有通过
    `IQ` 代币的 `EOS`。他立即获得功能完整的特性集，可以为 `Everipedia` 网络做贡献。对于他参与的每一次编辑、贡献和投票（只要投票给多数派），他都能获得奖励。


    | Solution | Everipedia |

