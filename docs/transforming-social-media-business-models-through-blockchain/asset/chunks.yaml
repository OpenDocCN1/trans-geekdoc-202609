    ## 区块链价值主张


    区块链中的社交用户也能直接从代币经济和网络效应中获益（Kraft, 2016; Lewis, Larsen, Goh, Tan, & Tacchi, 2016）。社会企业可以在首次代币发行（ICO）期间分发代币，用户可以直接获取代币，而非用他们的数据换取。他们还可以使用代币来享受社会企业提供的服务。与只有中心化社交媒体平台能直接从规模网络中获益的知名企业不同，区块链社交媒体企业中的社交用户因其贡献和参与也能获得奖励并受到激励。像
    Facebook 这样的组织必须重塑其商业模式，通过引入代币化、共识、去中心化、不可篡改性和透明度，在其综合性社会企业中采用区块链。


    ### 社交用户——收益


    基于区块链的社交媒体企业中的社交用户将获得以下收益：


    #### 数据控制


    与典型的社交媒体企业不同，基于区块链的社交媒体企业中的社交用户掌控自己的数据，并为了服务和奖励而向利益相关者发布数据。


    #### 信息完整性与真实性


    分布式账本和信息的不可篡改性帮助社交用户验证信息来源、信息完整性及其可靠性。一旦交易被验证，就会被记录在区块链上。社交用户将能够验证内容和信息溯源，以避免任何虚假新闻或错误信息。


    #### 众筹机会


    社交媒体企业可以集成区块链，为众筹项目提供透明度和开放性。智能合约可被高效用于执行金融交易，用户能实时了解流程执行状态，从而能够追踪和控制资产。用户可以无缝地追踪、监控和捕捉交互节点。


    #### 直接客户


    组织可以使用支持区块链的社交媒体应用程序直接与客户打交道，无需中介参与。因此，营销人员可以直接与客户互动。此外，随着越来越多的社交用户向心仪的组织分享其数据统计信息，他们成为收益分成模式的一部分。信息生产者和消费者之间将建立紧密联系。由于数据服务中没有中介参与，组织可以显著获得更高的每千次展示成本率（CPM）。


    区块链将迅速改变用户在社交网络中互动和参与的方式。信息完整性和可靠性的责任在于对等参与者。系统将能够生成准确数据、保持可追溯性和溯源性、展示定向广告、开发增强的用户体验并提供透明度。去除中介将帮助组织提高投资回报率（ROI）。但它们也需要考虑对社交用户的激励模型，以在社交网络上生成社交内容。


    表 3.1 总结了基于区块链的社交媒体平台的直接收益。


    **表 3.1. 社交用户收益。**


    | 属性 | 描述 |

    | --- | --- |

    | 产品认知 | 消费者将不再被视为产品。因为他们对生成的数据拥有更多控制权，所以有权同意并授权选定方访问其数据，以使用适当的服务或获取奖励或代币。 |

    | 数据控制 | 用户将负责拥有数据，因为他们发起的交易由网络中的对等参与者验证。权力和所有权掌握在数据贡献者手中。 |

    | 应用内支付 | 用户可以在社交媒体应用程序中使用代币化系统，通过贡献适当数量的代币来享受服务。 |

    | 帖子与影响者的补偿 | 用户在贡献和扩大社交网络方面将占据优势。对于每一次此类贡献和参与，他们都会获得激励。 |

    | 信息的合法性 | 用户的贡献只有在基于共识机制经对等参与网络批准和验证后，才会被记录在不可篡改的分布式账本上。此过程保证了信息的合法性。 |

    | 数据溯源 | 用户可以追踪和溯源社交对象，因为交易被记录在不可篡改的分布式账本中。这有助于识别数据来源。 |


    ### 社交用户——挑战


    尽管在重新定义社交媒体企业方面使用区块链有诸多好处，组织也应考虑与之相关的挑战以规避风险。社交媒体网络以交易规模著称，而由于区块链需要执行共识协议，验证此类交易的速度通常较低。例如，基于区块链的社交游戏
    CryptoKitties 曾导致以太坊平台上的流量拥堵。与 Facebook 或 Twitter 上的流量相比，CryptoKitties 在区块链平台上造成的流量微不足道。所有内容都必须经过验证和认证，这导致交易的周转时间较长。此外，交易挖掘消耗大量能源，考虑到每天数百万甚至数十亿次贡献交易，这对大规模社交网络而言效率低下。而且，贡献者在社交网络上执行的每一次贡献交易所产生的交易费用，阻碍了社交互动的初衷。


    区块链从根本上基于对等参与并去除中介。区块链将受到社交网络上审核挑战的影响。设想社交参与者在网络上发布数千个视频，这使得对等网络难以审核视频内容。批准或拒绝视频交易将是一个巨大的挑战。这可能进一步引发一个根本问题：是否需要第三方来审核交易，这违背了区块链的原则。否则，我们将让对等参与网络承担此类审核的责任，但这将非常复杂。此外，社交媒体企业在更新
    dApp 时面临挑战，因为必须考虑社交社区和参与者的信任与共识才能进行任何修改。表 3.2 总结了用户面临的挑战。


    **表 3.2. 挑战。**


    | 属性 | 描述 |

    | --- | --- |

    | 可扩展性 | 区块链需要执行共识协议，导致交易速度低。它无法支持高度可扩展的交易集。 |

    | 经济价值 | 网络倾向于使用高计算和能源资源来执行和记录交易。 |

    | 审核 | 网络上的可扩展性给内容审核带来挑战。 |

    | 更新 | 对等节点需要就向参与网络推出更新达成一致。 |


    ## 4


