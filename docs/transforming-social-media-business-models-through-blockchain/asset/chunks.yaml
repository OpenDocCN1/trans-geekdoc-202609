  trans: '

    社交媒体企业需要在平台层面推动技术，以实现其最佳性能。此外，由于该技术固有的点对点参与和共识机制组件，组织的边界将受到影响。然而，技术、市场和组织朝着统一增长战略的恰当交汇，将为采用和引入区块链以重新定义社交媒体企业铺平道路。


    本书采用连贯的方法来定义社交媒体企业不断变化的格局。读者将了解区块链在重新定义社交媒体企业方面的效用。未来的社会企业经济将转变为信任与所有权的分布式网络，参与者只需拥有互联网连接和社交媒体应用程序，即可参与区块链网络上的社交交易。此外，当区块链技术与社交网络集成时，它为自我执行的社交代码提供了一个平台，使各种社交互动成为可能。


    **Nitin Upadhyay 博士**


    ## 1 社交媒体商业模式


    社交媒体平台已变得极受欢迎，并涉及人们在内容专业知识方面的参与。在本章中，读者将了解社交媒体平台不断变化的格局。


    ### 简介


    交易并非新鲜事物。人类社会一直在考量和观察它。亚当和夏娃之间的第一次神秘交易揭示了世界的真相。或许有人会争论触发交易的煽动者的重要性，但我们必须明白，交易发生在两个接受交易后果的人之间。交易是人们和社区互动、沟通、交谈、协作与共存的基本单位（Agnihotri,
    Kothandaraman, Kashyap, & Singh, 2012; An & Weber, 2015）。社交互动界面的变化维度催生了许多技术驱动的生态系统，互联网是首要因素。


    互联网的出现影响了我们互动和进行商业交易的方式。当互联网商业化时，人们对其能力和适用性相当担忧。世界上大部分地区参与万维网的接入有限。正如研究人员所建议的，技术采用遵循钟形曲线，这非常适用于互联网（Anderson,
    2006; Bjørn-Andersen, Rasmussen, & Rasmussen, 2009）。1990 年代只有少数采用者——创新者和早期采用者，他们通过在万维网上推出各种服务和解决方案进行了多种方式的尝试。


    社交媒体已实现民主化，以至于它不再是企业的可选项，而是实现竞争力的必要战略和增维手段（Baghdadi, 2013; Bechmann & Lomborg,
    2013）。根据麦肯锡的一份最新报告，社交媒体对商业的贡献可能在 9000 亿美元至 1.3 万亿美元之间。企业现在面临着社交媒体的巨大潜力，并拥有广阔的机会空间来利用并建立竞争优势（Ballantyne,
    2014）。然而，增加价值的唯一来源不仅仅是纳入社交广告和营销活动，还包括在行业内部和跨行业拥有适当的战略性协作与合作构成。大多数时候，企业对社交媒体格局的战略优势和价值主张并不清晰。因此，他们无法建立能力、品牌、关系和商誉，从而受限于为提高效率、绩效和生产力做出贡献。


    几乎没有任何业务能不受社交媒体影响。它提供了巨大的潜力，此前未被开发，可触达大众，说服他们了解其产品和服务（Berthon, Pitt, McCarthy,
    & Kates, 2007）。此外，企业的存在感和品牌印记已显著超越原有范围。社交媒体通过互联网催生了动态的全球社区，使其能够贡献、协作与合作。许多网页和移动应用程序促进了全球社区的动态互动。正如我们所知，Web
    2.0 为社交媒体平台提供了场所，是一个持续演进和扩展的领域。它改进并使社交媒体应用程序更加用户友好。传统上，参与者仅限于查看企业网站上的内容。但在网络空间中，人们可以评论、分享、点赞、讨论、协作并生成自己的内容。对企业而言，此类互动触点正转化为宝藏触点。企业几乎可以从各处更多地了解其产品和服务。


    ### 社交媒体在商业中的应用


    无数应用程序促成了社交媒体的成功（Butterfield, 2003; Enders et al., 2008）。`物联网 (IoT)`、高端基础设施、智能设备和智能平台的进步，能够提供包容性和沉浸式的体验，以及不同层面的参与和协作（Choi
    & Varian, 2012）。世界不再局限于 `Facebook`、`Twitter`、`LinkedIn`、`WhatsApp`、`Instagram`、`Snapchat`
    等，选择众多，每个应用程序的含义都为企业带来新的机遇和可能性。在新款 `iPhone XR` 上分享增强版虚拟形象，或在 `Samsung Note 9`
    上发布实时消息，都能给参与带来完美的体验。连接设备打破了物理距离，让不同的世界相遇并提供令人难以置信的体验。当今时代的社交媒体平台和应用程序推动动态全球社区不仅更紧密地协作、合作和参与，更沉浸于其中的环境中。


    企业可以通过使用单个或组合多个社交媒体应用程序来获得最佳收益（Chen, 2009）。随着对集成新技术的增值功能需求日益增长，这对企业来说已成为不小的挑战。它们需要了解下一代社交媒体平台和应用程序的范围、可行性和潜力（Chesbrough
    & Rosenbloom, 2002）。尽管社交媒体提供了无数机会，让我们了解如何系统地利用这些机会。存在五个理想机会（Kunz & Werning, 2013;
    Tuesta et al., 2015; Wang, White, & Chen, 2015），图 1.1：


    ![image](img/f01-01.jpg)


    **图 1.1.** 社交媒体机会。


    #### 全球市场影响力


    无论您在何处经营业务、在哪个市场运营，社交媒体都提供了前所未有的渠道，使您能触达几乎任何地方。


    此外，通过利用搜索引擎优化技术，可以在巨大的网络上获得可见性。一个人在互联网上的可见性越高，预期拥有的市场影响力和商业机会就越大。社交媒体帮助 `Groupon`（高朋）使其业务成倍增长，并在短短五年内使其达到
    120 亿美元的估值。`Groupon` 成为全球品牌，并因社交媒体而实现转型。


    `Groupon` 通过引入社交媒体重新配置了行业，将其折扣券优惠扩展到大量客户。这些优惠通常有时效性，因此需要最优数量来兑换。社交媒体在优惠券营销中的融合，保证了
    `Groupon` 扩大业务并获取客户细分市场。


