    ## Blockchain Value Proposition


    The social users in the blockchain also get the direct benefit of the token economies
    and network effect (Kraft, 2016; Lewis, Larsen, Goh, Tan, & Tacchi, 2016). The
    social enterprise can distribute the tokens during the initial coins offerings
    (ICOs), and the users can take the direct advantage to acquire the tokens instead
    of their data. They can also use the tokens to avail the services provided by
    social enterprises. In contrast to the well-known enterprises where only the centralized
    social media platforms get the direct benefit of the network of scale, the social
    users in the blockchain social media enterprise for their contributions and participation
    also receives the rewards and are incentivized. Organizations like Facebook have
    to rework on its business model, by including tokenization, consensus, decentralization,
    immutability and transparency to adopt the blockchain in its comprehensive social
    enterprise.


    ### Social Users – Benefits


    The social users in the blockchain-based social media enterprise will get the
    following benefits:


    #### Data Control


    In contrast to the typical social media enterprise, the social users in the blockchain-based
    social media enterprise takes control of the data and in place of the services
    and rewards release their data to the stakeholders.


    #### Information Integrity and Authenticity


    The distributed ledger and the immutable aspect of the information help the social
    users to verify the information source, information integrity and its reliability.
    As and when the transactions are verified, they get recorded on the blockchain.
    The social users will be able to verify content and information provenance to
    avoid any fake news or misinformation.


    #### Opportunities for Crowdfunding


    Social media enterprises can integrate blockchain to provide transparency and
    openness to the crowdfunding projects. The smart contracts can efficiently be
    utilized to perform the financial transactions, and the user can get to know in
    the real time the process execution state and thereby able to trace and control
    the assets. The users can track, monitor and capture interaction points seamlessly.


    #### Direct Customers


    The organization can use blockchain-enabled social media applications to directly
    deal with the customers without the involvement of the intermediaries. Thus, it
    is possible for marketers to interact with the customers directly. Moreover, as
    more and more social users share their data statistics to the desirable organizations,
    they become part of the revenue sharing model. There will be a strong tie between
    the producers and consumers of the information. As no intermediary is involved
    in data services, the organizations can significantly get an increased rate of
    cost per impression.


    The blockchain will quickly change the way that users interact and participate
    in the social network. The onus of information integrity and reliability lies
    with the peer participants. The system will be able to generate accurate data,
    maintain traceability and provenance, showcase targeted ads, develop enhanced
    user experience and provide transparency. The removal of intermediaries will help
    organizations to increase their ROI. But, they also need to consider the incentivization
    models to the social users for generating the social content on the social network.


    [Table 3.1](#CH003-9781838673024.xhtml#tbl1) summarizes the immediate benefits
    of the blockchain-based social media platforms.


    **Table 3.1. Benefits for Social Users.**


    | Property | Description |

    | --- | --- |

    | Product perception | The consumers will no longer be treated as the product.
    As they have more control of the data that they generate, they have rights to
    provide the consent and access to their data to the selected parties for using
    appropriate services or availing rewards or tokens. |

    | Data control | Users will be responsible for owning the data as they initiate
    the transactions which get validated by the peer participants in the network.
    The power and ownership lie with the contributor of the data. |

    | In-app payments | Users can use the tokenized system inside the social media
    applications to avail the services by contributing the appropriate number of tokens.
    |

    | Compensation for posts and influencers | Users will have an edge in contributing
    and scaling up the social network. For each such contribution and participation,
    they get incentivized. |

    | The legitimacy of the information | Users'' contributions are recorded on the
    immutable distributed ledger only after the approval and validation of the peer
    participating network based on the consensus mechanisms. Such a process holds
    the legitimacy of the information |

    | Data provenance | Users can track and trace the objects of sociality as the
    transactions are recorded in the immutable distributed ledger. It helps in identifying
    the source of the data. |


    ### Social Users – Challenges


    Though there are several benefits to the usage of the blockchain in redefining
    the social media enterprise, the organizations should also consider the challenges
    associated with it to avoid any risks. The social media network is known for the
    scale of transactions, and since blockchain needs to execute the consensus protocol,
    the speed to validate such transactions is typically low. For example, the CryptoKitties,
    a blockchain-based social game managed to congest the traffic on the Ethereum
    platform. The traffic caused by CryptoKitties over the blockchain platform is
    nothing as compared to the traffic over Facebook or Twitter. Everything must be
    verified and authenticated, which leads to higher turnaround time for the transactions.
    Moreover, the mining of the transactions takes a lot of energy, which is not efficient
    for the social network of scale, considering millions and billions of transactions
    for the contributions every day. Also, the transaction fee accounted for every
    contribution that a contributor executes on the social network hinders the sole
    purpose of the social interaction.


    The blockchain is fundamentally based on peer participation with the removal of
    intermediaries. The blockchain will get affected by the moderation challenge over
    the social network. Consider social participants posting thousands of videos over
    the network, which makes the peer network challenging to moderate the content
    of the videos. It will be a great challenge to approve or disapprove the video
    transactions. It may further lead to the fundamental question of whether we require
    the third party to moderate the transactions, which violated the principle of
    the blockchain. Otherwise, we will let peer participating network take the onus
    of such moderation, which will be very complicated. Also, the social media enterprise
    face challenge in updating dApps as the social communities and participants trust
    and consensus needs to be taken into account to do any modifications. [Table 3.2](#CH003-9781838673024.xhtml#tbl2)
    summarizes the challenges for the users.


    **Table 3.2. Challenges.**


    | Property | Description |

    | --- | --- |

    | Scalability | Blockchain needs to execute the consensus protocol resulting into
    low transaction speed. It is unable to support highly scalable set of transactions.
    |

    | Economic value | The network is prone towards usage of high computational and
    energy resource for executing and recording transactions. |

    | Moderation | The scalability over the network place challenge for moderating
    the content. |

    | Updates | The peer needs to agree on rolling out the updates to the participating
    network. |


