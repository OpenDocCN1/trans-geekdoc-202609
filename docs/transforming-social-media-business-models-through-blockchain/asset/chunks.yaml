    The social media enterprises need to push technology at the platform level to
    achieve the best performance out of it. Further, the boundary of the organizations
    will get affected due to the intrinsic components of the peer-to-peer participation
    and consensus mechanisms of the technology. However, the proper intersection of
    the technology, market and organization towards a unified growth strategy will
    pave the way to adopt and include blockchain to redefine the social media enterprise.


    The book adopts the coherent approach to define the changing landscape of social
    media enterprise. The readers will be exposed to the utility of the blockchain
    in redefining the social media enterprises. The future social enterprise economy
    will be transformed to the distributed network of trust and ownership, where the
    participants can get involved in the social transactions over the blockchain network
    by just having the Internet connection and the social media applications. Moreover,
    blockchain technology, when integrates with social networks, provides a platform
    for self-executable social codes to make possible all sorts of social interactions.


    **Dr Nitin Upadhyay**


    ## 1 Social Media Business Model


    Social media platforms have become hugely popular and involve people''s participation
    in content know-how. In this chapter, readers will understand the changing landscape
    of social media platforms.


    ### Introduction


    The transaction is not a new phenomenon. Human societies have always considered
    and observed it. The first mystical transaction between Adam and Eve unfolded
    the realities of the world. Perhaps one can argue the significance of the instigator
    to trigger the transaction, but we must understand that the transaction happened
    between two people accepting the consequences of the transaction. Transactions
    are the fundamental unit for the people and community to interact, communicate,
    converse, collaborate and co-exist (Agnihotri, Kothandaraman, Kashyap, & Singh,
    2012; An & Weber, 2015). The changing dimensions of the social interact interface
    have given rise to many technology-driven ecosystems, and Internet is the prime.


    The emergence of the Internet has impacted the way that we interact and perform
    business transactions. When Internet got commercialized, people were quite apprehensive
    about its capability and applicability. Most parts of the world had limited access
    to participate in the World Wide Web network. As suggested by the researchers,
    the adoption of the technology follows a bell curve, which was very well applicable
    to the Internet (Anderson, 2006; Bjørn-Andersen, Rasmussen, & Rasmussen, 2009).
    The 1990s era had few adopters – innovators and early adopters, and they experimented
    in a variety of ways by rolling services and solutions over the World Wide Web.


    Social media has been democratized such that it is no longer the choice for the
    business but a necessary strategy and added dimensions to achieve competitiveness
    (Baghdadi, 2013; Bechmann & Lomborg, 2013). In a recent report by McKinsey, it
    has been identified that the contribution of social media to business could range
    between $900 billion and $1.3 trillion. Enterprises are now exposed to so much
    potential of social media and have a vast opportunity space to leverage and build
    a competitive advantage (Ballantyne, 2014). However, the only source to added
    value is not only the inclusion of social advertisements and campaigns but also
    having a proper strategic composition of collaborations and cooperation within
    and across the industries. Most of the times, businesses are unclear about the
    strategic advantage and value proposition of the social media landscape. Thus
    they are unable to build the capability, brand, relationships, and goodwill thereby
    constrained to contribute to increased efficiency, performance and productivity.


    There is no business that is virtually untouched by social media. It has provided
    great potential, which was earlier untapped, to reach to the masses, persuade
    them about their products and services (Berthon, Pitt, McCarthy, & Kates, 2007).
    Moreover, businesses have outgrown their presence and brand imprint significantly.
    Social media has given rise to the dynamic global community to contribute, collaborate
    and cooperate, through the Internet. Many web and mobile applications facilitate
    the dynamic interaction of the worldwide community. Web 2.0, as we all know has
    given the place for the social media platforms, is a continually evolving and
    expanding domain. It improvises and makes social media applications more user-friendly.
    Conventionally, the participants were restricted to view the content of the business
    on their websites. But, now in the cyberspace, people can comment, share, like,
    discuss, collaborate and generate their content. For the business, such engagement
    touch points are turning as treasure points. Business could understand more about
    their products and services from virtually everywhere.


    ### Social Media in Business


    Myriad applications contribute to the success of social media (Butterfield, 2003;
    Enders et. al., 2008). The advancements in the `Internet of Things (IoT)`, high-end
    infrastructure, smart devices and smart platforms have been able to provide an
    inclusive and immersive experience and different levels in participation and collaboration
    (Choi & Varian, 2012). The world is not restricted to `Facebook`, `Twitter`, `LinkedIn`,
    `WhatsApp`, `Instagram`, `Snapchat`, etc., but the choices are many, and the implications
    of each application bring new opportunities and possibilities for the businesses.
    Sharing of one''s augmented avatar on the new `iPhone XR` or a live message on
    `Samsung Note 9` brings impeccable experience to the participation. The connected
    devices are breaking the physical proximities and allowing the different world
    to meet and provide an incredible experience. The social media platforms and applications
    of today''s era are pushing the dynamic global community not just to come closer
    to collaborate, cooperate and participate but to get immersed in the environment.


    Businesses can take optimal benefit by using single or the combination of social
    media applications (Chen, 2009). With the ever-increasing demand on the added
    value features integrated with the new technologies, it has become quite a challenge
    to the businesses. They need to understand the scope, feasibility and potential
    of using the next-generation social media platforms and applications (Chesbrough
    & Rosenbloom, 2002). Though social media provide countless opportunities, let
    us know how we can leverage such opportunities systematically. There exist five
    ideal opportunities (Kunz & Werning, 2013; Tuesta et al., 2015; Wang, White, &
    Chen, 2015), [Fig. 1.1](#CH001-9781838673024.xhtml#fig1):


    ![image](images/f01-01.jpg)


    **Fig. 1.1.** Social Media Opportunities.


    #### Global market presence


    No matter where you run your business and which market you operate on, social
    media provide unprecedented channels to make you reach to virtually everywhere.


    Moreover, by utilizing search engine optimization techniques, one can become visible
    on the giant web. The higher visibility one has on the Internet, the higher market
    presence and business opportunity one may expect to have. Social media helped
    `Groupon` to increase its business manifold, and in just five years enabled it
    to reach to 12 billion dollars'' worth value. `Groupon` became the global brand
    and got transformed by social media.


    `Groupon` reconfigured the industry by including social media to expand its discounted
    coupon offers to the vast array of customers. These offers usually are for a limited
    time, and thus optimal numbers are required to redeem the offers. The blend of
    social media in the marketing of coupons guaranteed `Groupon` to expand the business
    and also to attain customer segments.

