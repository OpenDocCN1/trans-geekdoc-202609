- raw: "In a decade, the blockchain technology's position in the technology S curve\
    \ makes it suitable for embracing innovations, adoption and investments (Crosby,\
    \ Nachiappan, Pattanayak, Verma, & Kalyanaraman, 2016). It promotes the inclusive\
    \ economy and enables the person to participate in the democratic process. The\
    \ success of the Bitcoin depends on the blockchain infrastructure supporting software-based\
    \ validation, verification and consensus. The ever-increasing computational power\
    \ sources to mine and create the blocks enable blockchain enthusiasts to look\
    \ blockchain beyond the currency transfer (Don & Alex, 2016).\n\nThere are a plethora\
    \ of applications that can get impacted by the use of blockchain. More importantly,\
    \ social media platforms and applications centred on the social entities experience\
    \ will get operated and governed appropriately. Social graphs are not about the\
    \ website connectedness rather the experiences.\n\nUnfortunately, integrated usage\
    \ of social media to deploy a unified strategy that can bring participants’ experience\
    \ to the forefront is missing (Cortimigila, Ghezzi, & Renga, 2011). All social\
    \ media platforms are centralized focused and support the restricted sphere of\
    \ reach and engagement. As suggested by Corcoran (2009), the social media ecosystem\
    \ comprises three typical media types – owned media, paid media and earned media.\n\
    \n*Owned media*: Such media systems are governed and owned by the organization.\
    \ For example, the company's website and the postings on it about its services,\
    \ solutions and offerings are entirely controlled by the concerned group such\
    \ as marketers.\n\n*Paid media*: Such media system helps to create visibility\
    \ and reach. Association of company's presence through sponsorship and advertising\
    \ are some such ways to showcase brand effectiveness.\n\n*Earned media*: Such\
    \ media systems are neither controlled nor managed by the company's resources.\
    \ Word of mouth or viral media typically triggers immediate and instant buzz about\
    \ the specific point of concern.\n\nAccording to Li and Bernoff (2008), in the\
    \ social media ecosystem, active participants are segmented as per the different\
    \ type of social behaviours.\n\n*   *Creator*\n\n    They are the one who actively\
    \ creates the object of sociality. They also publish, maintain, update and upload\
    \ objects using appropriate features and tools as supported by the social media\
    \ platforms.\n\n*   Collector\n\n    People under this category are responsible\
    \ for collecting objects of sociality and sharing them appropriately with the\
    \ peers or the participating network.\n\n*   Joiners\n\n    Sometimes people are\
    \ sure about participating in the group or they participate in understanding the\
    \ group feelings, and if it matches with their aspiration, then they indulge themselves\
    \ in the further course of interaction.\n\n*   Critics\n\n    People under this\
    \ segment typically comment and rate the objects of sociality. They are responsible\
    \ for making or breaking the artefacts and moreover, if they represent the power\
    \ zone of influence, then it becomes critical to monitor and administer their\
    \ actions to avoid unnecessary risks.\n\nThe decentralized database supports effective\
    \ communication or message transmission. For example, file and video sharing are\
    \ becoming economically effective such that the conventional and centralized network\
    \ or electronic platforms such as Google Drive, Yahoo, Gmail etc., are becoming\
    \ less essential. It is possible to send, share, retrieve and access the encrypted\
    \ messages and files through the decentralized mechanism without any intervention\
    \ of the central authority. The decentralized network allows information to be\
