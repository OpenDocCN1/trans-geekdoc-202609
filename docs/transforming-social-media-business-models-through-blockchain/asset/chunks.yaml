    用户为集体智慧做出贡献的范围和程度对组织至关重要。了解社交性的目的、对象的参与度、信息交换以及有意义的对话是必不可少的。不重视身份的社交媒体平台也不重视关系。一些社交媒体平台为参与提供正式的结构、协议和规则，而另一些则不提供任何预定义的布局。一些社交媒体平台专注于维护关系而非扩展关系。例如，Skype
    和 AOL 是相互认识的人使用的平台，而非用于任何形式的扩展。社交图谱中的结构和流向驱动着集体智慧，更密集和更大的连接图谱负责驱动集体智慧。社交媒体平台应提供工具、功能和选项，用于创建、建立和管理涵盖社交图谱、行为等方面的集体智慧。影响者或更密集的群体直接为语料库做出贡献。虽然遵循中心性规则的连接链可以治理分散的集体智慧，但利用这些链将提升认知表现。


    > **注意：** 考虑到直接和间接集体智慧使用之间平衡的社交媒体集体智慧管理至关重要，因此需要一种能提供此类平衡组合的解决方案。


    ## 区块链价值驱动因素与价值机遇


    我们注意到，社交媒体平台的基础构建模块对于企业利用其潜力实现增长至关重要。然而，传统或 Web 2.0 社交媒体应用存在局限性，如表 4.2 所示。


    ### 表 4.2. 社交媒体构建模块的局限性


    | 构建模块 | 描述 | 局限性 |

    | --- | --- | --- |

    | 身份 | 用户透露其信息和身份的范围和程度 | 考虑到共享身份与保护隐私之间平衡的社交媒体身份管理是无效且受限的 |

    | 在线状态 | 用户知晓他人可用的范围和程度 | 考虑到真实与虚拟在线状态之间平衡的社交在线状态管理是无效且受限的 |

    | 群组 | 用户被允许形成社区的范围和程度 | 考虑到直接与间接影响之间平衡的社交媒体群组管理是无效且受限的 |

    | 声誉 | 用户知晓他人及内容的社会地位的范围和程度 | 考虑到内容与人员声誉之间平衡的社交媒体声誉管理是无效且受限的 |

    | 协作 | 用户可以协作的范围和程度 | 考虑到直接与间接社交性对象使用之间平衡的社交媒体协作管理是无效且受限的 |

    | 对话 | 用户相互沟通并建立对话的范围和程度 | 考虑到直接与间接对话之间平衡的社交媒体对话管理是无效且受限的 |

    | 集体智慧 | 用户为集体智慧做出贡献的范围和程度 | 考虑到直接与间接集体智慧使用之间平衡的社交媒体集体智慧管理是无效且受限的 |


    未来的社会企业经济将转型为信任与所有权的分布式网络，参与者只需拥有互联网连接和社交媒体应用，即可在区块链网络上参与社交交易。任何拥有互联网接入权限的人都可以参与基于区块链的交易。区块链技术与社交网络相结合，为自我执行的社交代码提供了平台，使各种社交互动成为可能。由于没有中央或单一权威机构控制互动，所有参与者都可以使用并协助运行社会企业经济。因此，只要社交网络中有一个节点是安全的，社交交易和数字共享账本就可以访问。


    表 4.2 展示了社交媒体平台的构建模块及其局限性。


    通常有四个不同阶段（图 4.2）构成了社交媒体商业模式区块链基础的特征：


    ![image](img/f04-02.jpg)


    **图 4.2.** 社交媒体区块链阶段。


    ### 社交媒体区块链 1.0


    社交媒体 1.0 将区块链技术视为基础，并专注于交易。因此，用加密货币交换以推动内容、推广特定方面或建立更密集的网络是主要驱动力。社交媒体区块链 1.0 (`SMB
    1.0`) 基于点对点交易，没有中央权威机构来监控和控制内容的生成、传递和交换。区块链的使用影响着社交媒体构建模块。身份模块不再由中央权威机构负责和管辖。社交交易可以在不知晓其他参与者身份详情的情况下进行。此外，贡献者因做出有意义的贡献而获得奖励，例如生成活跃且有意义的对话、领导和建设群组、执行协作项目。中央权威机构不管理内容和人员的声誉；相反，整个参与网络以民主方式决定声誉。


    ### 社交媒体区块链 2.0


    社交媒体区块链 2.0 (`SMB 2.0`) 是 `SMB 1.0` 的延伸，还集成了隐私保护、智能合约以及非原生资产、代币和功能。例如，Everipedia
    帮助人们向去中心化平台贡献信息，该平台不受无理监管和信息压制的影响。此外，它通过智能合约为每一项合法贡献向贡献者提供奖励。


    ### 社交媒体区块链 3.0


    社交媒体区块链 3.0 专注于引入去中心化应用 (`dApps`) 以便于参与网络。`dApp` 利用开放的去中心化区块链网络和加密代币系统。


    ### 社交媒体区块链 4.0


    它涉及引入智能和自动化代理以及人工智能来驱动区块链上的社交媒体。基础构建模块的管理在 `SMB 4.0` 中可自动完成，但这仍是一个远期目标。


    建立在区块链技术上的各种社交媒体商业模式通常共享基础方面，但服务于不同目的。组织应为 `SMB` 项目制定价值创造路线图。第一步是确定要提供或利用的社交模块功能，而非技术本身。例如，`SMB
    1.0` 固有地支持加密货币金融流程中的安全性、透明度和交易优势。然而，`SMB 2.0` 通过在业务流程中引入智能合约，除金融交易外，还为参与用户提供了若干额外收益。在第二步中，将每个赋能器映射到社交媒体的基础模块，并检查各自的价值驱动因素以纳入其中。表
    4.3 总结了 `SMB`、赋能器、价值驱动因素和基础模块的映射关系。

