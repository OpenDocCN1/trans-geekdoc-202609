- raw: '**Communication**: Business players can achieve affordable communication by
    appropriately using social media strategies. It can be used for both formal and
    informal discussions. The company employs the former, and the employees adopt
    the latter to channelize the communication. Social media applications can amplify
    informal communication structure, and people can leverage it for sharing project
    goals and artefacts, and gaining efficiency and knowledge. Moreover, social media
    applications result in diversified communication as it allows a different type
    of media to be shared and utilized. Companies like Salesforce.com and Cisco have
    strategically introduced social media into their respective business. To keep
    abreast about their product offerings and an edge on training capabilities, Saleforce.com
    started utilizing YouTube videos to train customers resulting in cut down of efforts
    of worth several 100 salespeople. Cisco deals with a variety of social media platforms
    to connect with different stakeholders. It utilizes almost 31 blogs to cater to
    audience covering information about the company, offerings, products and many
    more.


    Moreover, it utilizes Facebook fan pages to spread solutions, offerings, services
    and relevant information. It also takes advantage of Twitter in expanding its
    customer base. Flickr has also been used by Cisco to cover photos of products,
    events and offerings.


    **Community presence**: It is effortless to build the virtual community without
    the time and space barrier. Social media applications provide various ways by
    which people can come together to discuss, debate and share topics of common interest.
    For example, LinkedIn provides the professional community to come together and
    share concerns and solutions relevant to the group. Business can strategically
    identify the subcommunities and influencers in the communities. Channelizing offerings,
    services and solutions through the influencers help in boosting the profit margins
    and growth.


    **Collective intelligence**: It is an utmost vital part to manage, control and
    administer the collective knowledge build by the social media stakeholders. As
    more and more people join the communities, participation in communication results
    in the knowledge corpora. Businesses can get insights about their product and
    services and also gather the competitors'' business product portfolio. By working
    on the knowledge corpora generated through the social media communities, a business
    can get at the edge to compete and perform. Starbucks strategically build products,
    services and offerings based on collective intelligence. It runs a Facebook fan
    page and also maintains the MyStarbucksIdea website to collect ideas from the
    potential consumers. The collective intelligence through social media applications
    helped Starbucks to acquire more customers, develop insightful experiences, produce
    useful offerings and execute social responsibility projects. Coca-Cola ‘Freestyle’
    vending machine showcases more than 100 options of flavours. The customers get
    a chance to mix the flavours, taste it and share the experience with their friends
    on social media. Such kind of insightful details helped the company to launch
    new and innovative products. Cisco organized a billion-dollar ideas competition,
    which resulted in contribution from 3,000 participants from 157 countries generating
    800 ideas. The winner bagged the 250,000 dollar price. The social media boosted
    the billion-dollar idea to Cisco, as it costs approximately 321 dollars per idea
    to yield a billion-dollar business.


    **Collaboration**: The most powerful feature of the social media application is
    collaboration. It provides various ways for the people to collaborate both on
    personal and professional fronts. There is a proven track record where communities
    came forward and have worked together and collaborated on a successful sustainable
    project like ‘Conserve Forests’. Accenture is a global consulting, technology
    services and outsourcing company employing more than 200,000 employees worldwide.
    It has built an interactive collaboration platform utilizing Facebook and LinkedIn
    to connect and collaborate to run, manage and execute projects.


    No matter which segment of the business you are working with, chances may happen
    that the adoption of social media poses several risks. These risks such as reputation
    management, information asymmetry, information provenance, integrity and reliability,
    visible and invisible reach impact the business. Some risks are tied with the
    core of the organization, i.e. its DNA, but some could be tackled through the
    technological interventions. Some companies are closed-culture, as they do not
    believe in sharing and disseminating the information. Thus, they are the one who
    gets hugely impacted by social media adoptions. For them, it is essential to have
    a common language and goal for social media communication. Further implementation,
    integration and interoperability issues need to be tackled to facilitate convergence
    between different social media platforms and enable data portability.


    New Social Media


    Interestingly, yesteryears'' social media have fed us lots of information. Some
    were useful, but many were hit by unreliable, poor quality and integrity, untraceable,
    low credibility and unethical issues. It is a time to develop frameworks and standards
    to manage, control, administer and regulate the aspects of social media. Regulations
    to be governed by the appropriate usage of AI and data-enabled technologies.


    Moreover, the focus needs to shift from the centralized control, where one central
    authority controls the aspects of social media, to peer control where the participating
    peers take the ownership and controls for their actions (Casey & Vigna, 2018).
    We should have the mechanism to agree collectively on the credibility and integrity
    of the right information. Each of the contributors should get the reward for the
    contribution rather only one central authority like Facebook or Google gets all
    the revenue from the people''s contributions. Besides, trust in the information
    dissemination on social media is crucial. Social media need to play an active
    role in ensuring that the information and the source provided are accurate, credible
    and authentic to avoid any misinformation.


    The IoT has become an integral part of human society, and the man–machine duo
    is contributing to the exponential growth of the data (Dorri, Kanhere, & Jurdak,
    2016; Kitchin, 2014). Samsung Health supports many activities and challenges where
    people from different parts of the world participate and perform. It also provides
    leaderboard where one can check his/her performance for the challenges and evaluate
    one''s position concerning the other participants. Social IoT is changing the
    economic, physical and behavioural aspects of human society. The smart house,
    when integrated with social media generates helpful information about the home
    and its environment. For example, the message might get automatically posted on
    Twitter whenever there is a change in the ambient lightings of the house or when
    someone checks in the house.


    Information search is the most important but time-consuming activity. Many business
    models have paved its benefit by incorporating advertising ventures on the information
    search model. Though such models are beneficial to the advertisers as there information
    comes right at the top of the giant web during the search, but the consumers are
    not truly getting the benefits. Moreover, search integrity is questionable if
    the search results are inappropriate. Thus, the future information search social
    media business models must rethink the roles and responsibilities of the participant
    and stakeholders to provide the true value proposition (Gillin & Schwartzman,
    2010; Haenlein, 2011). It must safeguard the interest of the consumers during
    content search and personalization, and should not just be beneficial to only
    one class of the society.'
