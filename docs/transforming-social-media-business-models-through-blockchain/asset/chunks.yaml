    # Props 平台概述


    这是一个旨在推动代币化数字媒体经济的平台。它支持数字媒体应用网络，并使贡献者能够因其在 Props 网络上的活动获得奖励。Props 代币授予社区中参与、贡献和参与内容创作的用户。Props
    利用以太坊平台来支持 Props 应用，并通过数据层和代币化模型连接，以实现集体网络效应。用户可以累积 Prop 代币，以代表其声誉、身份和贡献。Props
    网络构建了其首类应用，在区块链网络上实现交互式直播视频服务。Props 网络上的 “YouNow” 应用在交互式视频领域实现了由微交易驱动的双边虚拟经济。它为网络上的用户提供多项功能。例如，用户可以使用服务向现场观众广播视频，并与内容创作者、主播和其他用户互动。


    ## 平台模型


    该平台承诺通过整合奖励系统来支持众多面向消费者的应用。该平台为用户社区提供以下几项实用特性：


    *   **Props 代币**：用户有机会利用 Props 代币享受网络上的服务。此外，代币可在网络中跨各类应用无缝使用。

    *   **应用内钱包**：用户获得钱包以持有 Props 代币，可用于网络内的任何形式交易。

    *   **数据共享**：用户可在网络内跨应用共享、移动或分发其数据。凭借其在 Props 网络中持有的声誉、关系和资本，即可实现访问。

    *   **奖励**：用户可在 Props 网络的应用组合中获得 Props 奖励。奖励层整合网络上的任何此类体验，并相应地通过 Props 代币将其货币化。此外，Props
    网络用户可以直接向其他用户 “打赏”，以推广其在网络上的内容。验证者需要质押其代币以获取奖励。


    该平台的典型结构包含：


    *   **Props 应用**：面向消费者的应用，通过促进奖励、数据共享和体验货币化能力。

    *   **开源软件和工具**：此类资源有助于集成和连接网络上的多应用。

    *   **智能合约**：基于贡献者的贡献，实现代币的自动交易。


    ## 用例


    让我们通过用例场景来了解 Props 平台的运作。假设 Nick 加入 Props 网络。Nick 决定主持一场广播会话并启动直播视频分享应用。参与者加入并观看该特定会话，为
    Nick 贡献奖励。Nick 决定检查发布视频的内容合法性，为了获得内容验证奖励，他需要向网络质押 Props 代币。通过点赞和发表被 Props 社区接受的评论，Nick
    有资格获得 Props 代币作为奖励。交互式视频内容的创作者也能获得 Props 代币作为奖励。


    | 解决方案 | Props – YouNow |

    | --- | --- |

    | 成立时间 | 2017 |

    | 核心团队 | 七名成员 |

    | 客户类型 | 企业级 |

    | 市场维度 | 增长中 |

    | 竞争对手 | 较少 |

    | 赋能基础设施 | 以太坊 |

    | 合作伙伴 | 不同层级的合作伙伴关系 |

    | 用例 | 应用内通信、内容分享 |


