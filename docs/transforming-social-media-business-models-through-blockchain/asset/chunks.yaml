    ## 5


    Blockchain-based Social Media Enterprise


    Blockchain provides an excellent opportunity for social media enterprises to transform
    its business model by incorporating inclusive and collective growth. The readers
    will get the chance in this chapter to explore the potential business use cases
    impacting the social community and the business. Also, the emerging blockchain-based
    social enterprises are also covered to understand their strategic advantage and
    business model for the new-age social media business.


    Introduction


    In this chapter, we will investigate several case studies showing the implementation
    of blockchain in emerging social media enterprises. Further, we will cover and
    discuss the role of technology in bringing success to the social media business.
    However, the social media enterprises are still in the nascent stage to embrace
    the blockchain. Thus the use cases are still developing. The underlying rationale
    to select the emerging social media enterprises is twofold. Firstly, to describe
    the characteristics and solution of the blockchain-based social media enterprises
    already covered in the previous chapters. Secondly, most of the emerging social
    media enterprises based on blockchain have already reached the market and thus
    show potentials of the technology in redefining the social media platforms. Each
    business use case is supported by a brief description of the social media enterprise,
    highlighting the main characteristics of the application or software. Further,
    information related to the key stakeholders and motivations behind the offerings
    are covered. Also, the time to market and user perception indicators are discussed
    to measure the feasibility of the proposed solution.


    Blockchain Use Cases in Practice


    The blockchain is shaping the social media enterprises, and there exist several
    potential use cases to mitigate the risks and limitations of conventional social
    media applications.


    *   *User is no longer a product:* The social media platforms offer services to
    the customers so that they can build the revenue empire by collecting customers''
    data and share that with the potential advertisers. Moreover, the target advertising
    industry flourishes on such accounts and monetization benefits the service provider
    that acts as an intermediary. The decentralized nature of the blockchain enables
    and empowers the social users to take the onus of their data and contribution,
    and as such, they are no longer be a product but now can be the part of the revenue.
    Blockchain social media organizations like Sapien and Killi are solving such an
    issue. Sapien provides the control, access and ownership to all the users who
    participates and contributes to its network. Killi compensates social users for
    their contributions. In both cases, the users are not treated as a product; instead,
    they contribute to the social economy.


    *   *Effective content control:* Manipulation of social user emotions by leveraging
    the data is not uncommon, and several stories have been around us, which has recorded
    such events. One potential reason to trigger such events is due to the sole authority
    of utilizing the data as the data of the social users are accessible to the central
    and governing authority. But, with the blockchain, no single entity can dictate
    the content and thus manipulative content on the network are easy to eliminate.
    There will be more effective control on the content over the social networks due
    to the inherent decentralized nature of the network. Organizations like DTube
    are solving such an issue. It is a decentralized video distribution platform based
    on STEEM blockchain. The purpose is to eliminate the central authority and reduce
    the control on the content distribution. STEEM is a decentralized, blockchain-based
    public content system. It supports the building of community by addressing the
    promotion of social interactions based on the rewards system. The platform rewards
    the community participants for making quality contributions. The STEEM is a liquid
    currency as such it can be bought or sold at the exchanges.


    *   *Improved security:* The social media platforms can go far to reach and breach
    the social interactions to govern social users'' behaviors. Few allegations have
    been reported against Facebook for accessing social users'' data without their
    explicit permissions. Moreover, the less secured channel for communications over
    the social network raises many potential data leaks and identity theft issues.
    The blockchain technology provides a convenient and robust security layer for
    the exchange of the messages or communications. Organizations like SoMee are working
    in this direction to give a secured social communication network. It is a platform
    based on the decentralized blockchain to cryptographically secure users'' data.


    *   *Expanding and protecting freedom of speech:* In the democratic culture of
    expression, the technological dominance of controlling the speech and expression
    is somewhat detrimental to the growth of the society. Many incidences of blocking
    and control access to social media sites have been attempted. Even though popular
    sites promise to encrypt the communication messages to avoid any identity issues,
    it becomes identifiable due to the presence of the metadata with the message.
    The blockchain provides an effective solution to such a problem as the metadata
    is not tied to a single identity and moreover, it is distributed across the network.
    Thus, it provides true anonymity. An organization like Civil has based their solution
    on the decentralized blockchain network. They are supporting freedom of speech,
    and services are offered to small outlets and journalists. The civil community
    governs the civil registry. Members of the community approve the newsrooms which
    join the civil society. Civil tokens can be used to raise the issues against any
    newsrooms.'
