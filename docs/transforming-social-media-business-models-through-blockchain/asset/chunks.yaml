    infrastructure and economic model. The business model should at the bare minimum
    cover value proposition, value creation and provision, as well as financial endurance
    (Wielki, 2010).


    Blockchain and Building Blocks of Social Media


    The business should focus on the fundamental building blocks of the social media
    business model (Kietzmann, Hermkens, McCarthy, & Silvestre, 2011; Singaraju, Nguyen,
    Niininen, & Sullivan-Mort, 2016). These blocks are neither exclusive nor all inclusion
    is mandatory. Instead, it directs and helps the business to align the efforts
    in strategizing their growth plan. Each block helps the organization to understand
    the specific social media user experience and its implications. [Fig. 4.1](#CH004-9781838673024.xhtml#fig1)
