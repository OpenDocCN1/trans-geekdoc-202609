- raw: 'It is a platform to promote the tokenized digital media economy. It supports
    the network of digital media applications and enables the contributors to get
    rewards for their activity on the Props network. The Props token are given to
    the users in the community who engage, contribute and participate in the content
    creation. The Props utilizes the Ethereum platform for supporting the Props applications
    and is connected by the data layer and a tokenized model to enable the collective
    network effects. The users can accumulate the Prop token in place of their reputation,
    identity and contribution. The Props network builds its first category of the
    application enabling interactive live video service on the blockchain network.
    The ‘YouNow’ application over the Props network enabled the microtransaction-driven
    two-side virtual economy in the domain of interactive video. It provides several
    functionalities to the users on the network. For example, user can use service
    to broadcast video to the live audience, be engaged with the content creators,
    broadcasters and other users.


    #### Platform Model


    The platform promises to support numerous consumer-facing applications by integrating
    the reward system. The platform provides several useful characteristics to the
    user community:


    *   Props tokens: The user gets the chance to utilize the Props token to avail
    the services over the network. Further, the tokens are used across the network
    with varied applications seamlessly.


    *   In-app wallet: The user gets the wallet to hold the Props token which can
    be used for any form of the transaction within the network. For example,


    *   Data sharing: The user can share, move or distribute their data across the
    applications within the network. The access becomes possible using the reputation,
    relationships and capital that they hold across the Props network.


    *   Rewards: The user gets the Props rewards across the application portfolio
    on the Props network. The reward layer integrates any such experience over the
    network and then monetizes it accordingly in exchange for the Props tokens. Also,
    the Props network user will be able to ‘tip’ the other user directly to promote
    their content on the network. The validators need to stake its tokens to avail
    the rewards.


    The typical structure of the platform comprises:


    *   Props Apps: The consumer-facing application by facilitating reward, data sharing
    and experience monetization capabilities.


    *   Open-source software and tools: Such resources are useful to integrate and
    interface multiapplication on the network.


    *   Smart contracts: It enables the automatic transaction of the tokens based
    on the contribution made by the contributors.


    #### Use Case


    Let us understand the use case scenario for the functioning of the Props platform.
    Consider Nick joins the Props network. Nick has decided to host a broadcasting
    session and triggers the live video sharing application. The participants join
    and watch the particular session contributing to the reward for Nick. Nick decided
    to check the content legitimacy of the posted video and to get a reward on the
    content validation, he needs to stake the Props token into the network. By upvoting
    and posting comments which are accepted by the Props community makes Nick eligible
    to get the Props token as rewards. The creator of the interactive video content
    also gets the Props token as reward.


