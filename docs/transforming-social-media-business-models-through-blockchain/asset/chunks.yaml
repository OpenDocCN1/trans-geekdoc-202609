    # Journalism and Social Media Challenges


    Journalism is facing a lot of turbulence due to the presence of fake news. It
    has become easy for everyone to contribute information to social media accessible
    to the broader reach. The journalistic social media is putting all efforts into
    making sure that an audience gets the attention for the media content. But somehow
    it lacks in ensuring the source and reliability of the information. The social
    entertainment industry is also not untouched by social media.


    ## Digital Publishing Transformation


    The digital publishing industry got transformed by the value proposition that
    it offers by introducing the disintermediation and involving a new set of players
    (Garci-Agreda, 2013; Wikström & Ellonen, 2012). However, the essential roles of
    creating and publishing the content are still intact. The way that the content
    now is distributed to the masses and later consumed by them depends upon the potential
    use of social media platforms (Enders, Hungenberg, Denker, & Mauch, 2008; Frow,
    Nenonen, Payne, & Storbacka, 2015). It helps in establishing an engaging platform
    as the audience can discuss and be part of the creative process. Several social
    media platforms such as `Flipboard`, `Medium`, etc. have emerged that run communities
    of interest and have a robust social presence.


    The user-generated content is the driver to user engagement (Kaplan & Haenlein,
    2010). Many social enterprises are developing social tools and framework to facilitate
    users. Features such as media content generation, acquisition and processing elements
    with the ability to distribute and monetize it are prominent.


    ## Centralized Focus and Challenges


    The current social media platforms have the ‘centralized focus’ and offer channels
    for distributing and sharing the content. Also, the administration and control
    of the content, thereby lies with the centralized agency. The agency curates and
    integrates the relevant content which needs to be delivered to the participants
    in the social network. The process helps the agency to draw the intent and preferences
    of the users for the specific content and accordingly by using the appropriate
    strategies the user-generated content is processed and utilized. It can be argued
    that the ‘centralized focus’ is the prime focus to establish the marketplace for
    the premium content (targeted advertisers) to contribute to the revenue growth
    of the agency. The centrality of such social media platforms suffers from several
    challenges (Lehmkuhl & Jung, 2013; Okada & Yamamoto, 2011):


    *   Inability to control the flow and structure of information

    *   Imprecise personalized offerings

    *   Excessive liberty in privacy and ethical controls

    *   Overpowered trust issues related to misinformation and fake news


    ## Augmented Content Distribution Models


    The typical centrality focus can be overcome by including the augmented model
    of content distribution, considering the significant impact of the IoT. The inclusion
    of sensory perception through digital intervention by integrating AR/VR environment
    stimulates the development of an inclusive environment (Csik, 2015; Spaulding,
    2010; Wang & Zhang, 2012). It is not a far-reaching goal when the next-generation
    social media models support the dynamic real-world social interactions with the
    social users'' environment.


    Today many digital natives and digital migrants use social media in different
    ways. Similarly, social media enterprises targeting both the digital natives and
    digital migrants have separate strategies for the engagements. In this environment,
    the organizations are developing a creative profile to nurture the social network
    by integrating it with the dynamic real world. We can find the requirement of
    the more real-world inclusive interactions not just with the people but with their
    environment. The significant contributions of the 3D technologies with the AR/VR
    will drive more personal and deep interactions. Thus, social media platforms will
    support machine-to-machine communication to take a proactive role in understanding
    human behaviour and moderating the communities. The release of the user information
    of the social network in the dynamic environment will lead to more personalized
    and targeted marketing.


    ## Democratization and Information Overload


    Due to the proliferation of mobile devices, digital news distribution and consumption
    are now democratized. Social networks have outgrown in scale and elevated as the
    news consumption platforms, though it merely means that the new-generation users
    can now easily surf and interact with the information layer presented to them.
    Moreover, it is unlikely that the relevant information is showcased to them due
    to the impact of the added dimension of information overload. Besides, the mesh
    aspect of integrating multiple social media sites to pump the information makes
    the overall interaction platform to be more complicated. The users face few challenges
    with the social media platforms, and new business models by employing new technologies
    are expected to overcome such challenges (Dorri et al., 2016; He et al., 2015;
    Lewis, 2015):


    *   **Authenticity**: The information overload is giving rise to the critical
    issue of the authenticity of the information. It is sometimes challenging to identify
    the valid source and integrity of the data. The social users tend to pass the
    information quickly, which falls following the snowball effect and thus difficult
    to obtain the actual source.

    *   **Bias**: The centralized social media develops over the time their specific
    regulation, ethics and editorial policy and thus knowingly or unknowingly enforce
    particular bias to the information. The denser control driven by the centrality
    focuses more on the bias presence visible in the social network. Such bias leads
    to the different interpretation of the news information.


    ## Centralization Risks and Data Monetization


    Social media applications are mostly operated in the centralized fashion. But
    one must not confuse centralization with the safety. Most platforms are susceptible
    to many issues such as information leaks, identity thefts, securities, censorship,
    hacking, etc. Facebook''s recent information leak is an example of such a problem.
    The personal information of more than 87 million people was leaked and utilized
    to promote few candidates during the last US presidential election. Mostly, the
    customer data generated over the social media platforms are being used for advertising
    revenue. The platform acts as an intermediary to the advertisers. It helps to
    impart the targeting advertisements to the customers to generate the revenue.
    The content quality also plays a critical role in streamlining traffic. One must
    not jeopardize the content quality to mauve the traffic as it does not directly
    link with the content value. Users are not rewarded and incentivized for populating
    the social media platforms by contributing to the knowledge corpora. Moreover,
    they now realized that their data are being utilized by the service providers
    for profit earning to which they are not the part.


    In some case, few social media platforms have some added features to share the
    small portion of the revenue to the social users for contributing to the data.
    These users are typically influential in the community and thus gather massive
    traffic over the content. The improper distribution of value among the users triggers
    the dissatisfaction in the social community.


    ## Information Verification and Propaganda


    The information present to the users on the social network is in the compressed
    form, and the user has no sufficient time and skills to verify and validate the
    trueness of the information. The adoption of mass information is prone to develop
    disturbed emotions and feelings, which is unavoidable in absolute respect. Some
    propaganda activities are intentional to insinuate particular emotions to the
    user community by sharing misrepresented information. Though it seems to be a
    complicated job to control such propaganda, the social enterprise must find ways
    to tackle through such a difficult way of executing propaganda.


