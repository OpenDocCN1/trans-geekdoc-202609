    Introduction


    The social media business model helps organization to discover ways by which they
    can derive and generate values through social media tools and platforms, which
    was not possible otherwise. Typically, two types of organizations utilize social
    media models. Firstly, those organization that owns and manages the social media
    platforms and tools. Secondly, the other one who use it to share, communicate,
