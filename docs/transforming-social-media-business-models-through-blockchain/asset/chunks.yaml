    # Blockchain Technology and Social Media


    In a decade, the blockchain technology''s position in the technology S curve makes
    it suitable for embracing innovations, adoption and investments (Crosby, Nachiappan,
    Pattanayak, Verma, & Kalyanaraman, 2016). It promotes the inclusive economy and
    enables the person to participate in the democratic process. The success of the
    Bitcoin depends on the blockchain infrastructure supporting software-based validation,
    verification and consensus. The ever-increasing computational power sources to
    mine and create the blocks enable blockchain enthusiasts to look blockchain beyond
    the currency transfer (Don & Alex, 2016).


    There are a plethora of applications that can get impacted by the use of blockchain.
    More importantly, social media platforms and applications centred on the social
    entities experience will get operated and governed appropriately. Social graphs
    are not about the website connectedness rather the experiences.


    Unfortunately, integrated usage of social media to deploy a unified strategy that
    can bring participants’ experience to the forefront is missing (Cortimigila, Ghezzi,
    & Renga, 2011). All social media platforms are centralized focused and support
    the restricted sphere of reach and engagement. As suggested by Corcoran (2009),
    the social media ecosystem comprises three typical media types – owned media,
    paid media and earned media.


    ## Owned media


    Such media systems are governed and owned by the organization. For example, the
    company''s website and the postings on it about its services, solutions and offerings
    are entirely controlled by the concerned group such as marketers.


    ## Paid media


    Such media system helps to create visibility and reach. Association of company''s
    presence through sponsorship and advertising are some such ways to showcase brand
    effectiveness.


    ## Earned media


    Such media systems are neither controlled nor managed by the company''s resources.
    Word of mouth or viral media typically triggers immediate and instant buzz about
    the specific point of concern.


    According to Li and Bernoff (2008), in the social media ecosystem, active participants
    are segmented as per the different type of social behaviours.


    ### Creator


    They are the one who actively creates the object of sociality. They also publish,
    maintain, update and upload objects using appropriate features and tools as supported
    by the social media platforms.


    ### Collector


    People under this category are responsible for collecting objects of sociality
    and sharing them appropriately with the peers or the participating network.


    ### Joiners


    Sometimes people are sure about participating in the group or they participate
    in understanding the group feelings, and if it matches with their aspiration,
    then they indulge themselves in the further course of interaction.


    ### Critics


    People under this segment typically comment and rate the objects of sociality.
    They are responsible for making or breaking the artefacts and moreover, if they
    represent the power zone of influence, then it becomes critical to monitor and
    administer their actions to avoid unnecessary risks.


    The decentralized database supports effective communication or message transmission.
    For example, file and video sharing are becoming economically effective such that
    the conventional and centralized network or electronic platforms such as Google
    Drive, Yahoo, Gmail etc., are becoming less essential. It is possible to send,
    share, retrieve and access the encrypted messages and files through the decentralized
    mechanism without any intervention of the central authority. The decentralized
    network allows information to be published and distributed seamlessly eliminating
    the ability of the single power to censor.


    Organizations involving social media platforms based on blockchain usage must,
    therefore, analyze its applicability considering media types and active segments
    of participants. In Chapter 4, we will look at finding the enablers and value
    drivers to link the social media sphere with the value proposition. The blockchain-based
    social media enterprises impact both the media types and the participants significantly.
    The participants get reward and incentives for contributing to the media types
    over the blockchain network. Moreover, the inclusion of the smart contracts to
    initiate and execute the end-to-end process of recording transactions and distributing
    the reward tokens make the revenue for the peer participants (Chesebro, 2015).
    As the intrinsic property of the blockchain network, the participants hold the
    ownership of the data and can use it for the monetization purpose. [Fig. 2.1](#CH002-9781838673024.xhtml#fig1)
    represents the inclusion of blockchain as an underlying foundation to support
    media types and participants.


    ![image](images/f02-01.jpg)


    **Fig. 2.1.** Blockchain and Media Types and Participants.


    The early movers will get the advantage to redefine the social media and innovate
    with the blockchain to develop new edge social media community. The social media
    enterprise can utilize the technology, market and organization as a structural
    framework to measure and redesign its strategy to enter into the blockchain market.


    The social media enterprises need to push technology at the platform level to
    achieve the best performance out of it. Further, the boundary of the organizations
    will get affected due to the intrinsic components of the peer-to-peer participation
    and consensus mechanisms of the technology. However, the proper intersection of
    the technology, market and organization towards a unified growth strategy will
    pave the way to adopt and include blockchain to redefine the social enterprise.


    # 3 Challenges and Opportunities


    The Internet has created new possibilities that we didn''t foresee in its early
    years. Blockchain technology is unique and has great potential to penetrate existing
    markets and to develop new markets. In this chapter, readers will understand the
    challenges and opportunities associated with the blockchain in the social media
    industry. It will help them to explore how a current business can be transformed
    and also how to create new markets.


    ## Introduction


    Redefining social media with the blockchain provides the immediate benefit of
    the data ownership to the contributors. Since the technology is based on the peer-to-peer
    transactions recorded over the distributed ledger, no one central authority controls
    it. The ownership shifts from a central authority to the periphery of the peers.
    For example, the conventional social media enterprises such as Facebook will not
    be able to peek into the data shared by the social participants over the social
    network until unless they have the right and consent to do so. The social interaction
    transactions will be stored on the blockchain network and support privacy, confidentiality,
    and immutability (Crosby, Nachiappan, Pattanayak, Verma, & Kalyanaraman, 2016;
    Don & Alex, 2016).


    Moreover, the users can also keep the data off the chain over the cloud. The social
    users are the key contributors to the objects of sociality. By using blockchain,
    social enterprises won''t be able to store and mine the users'' data. Since the
    users now can decide on who has access to the data and the purpose where the data
    will be used, they can get the fair chance to earn the revenue share. For example,
    the user might be interested in a particular set of advertisements and instead,
    social enterprise pushing the ads to the users, the user can share the data and
    decide on the advertisements based on the cryptocurrency or token share one gets.

