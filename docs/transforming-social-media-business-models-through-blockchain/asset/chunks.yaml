  trans: "\n\n*   **应用内支付：** 社交媒体平台为其用户群提供多样化服务以提高参与度和价值主张，这并不罕见。少数社交媒体平台率先引入了应用内支付系统，用于在不离开社交媒体应用的情况下发起金融交易。这不仅增加了客户群，还提高了客户参与度和留存时间。然而，并非所有此类应用都能安全运行，它们容易发生数据泄露和身份盗窃；因此，许多知名社交媒体网站已撤回此类服务。区块链技术解决了此类问题并提供了有效的解决方案。除了通过\
    \ `Bitcoin` 加密货币提供金融交易外，基本交易还可通过 `smart contracts`（智能合约）提供支持。`Steemit` 和 `SocialX`\
    \ 等组织正为其客户群推出多项应用内服务。`Steemit` 因用户对社交互动和影响力的贡献，向其奖励原生货币。`SocialX` 用户通过在社交网络中贡献视频和图片赚取\
    \ `SOCX` 代币，并利用这些代币获取服务和产品。\n\n*   **补偿与奖励：** 社交经济增长的基本原则是包容性和集体贡献。知名社交媒体企业将社交用户置于一旁，专注于独占利益、赚取并保留大部分收入，从而忽视了真正的社会和经济增长。只有少数影响者能获得一小部分收入。例如，`YouTube`\
    \ 根据内容贡献向影响者提供定向广告收入的一部分。此类模式不公平，且最有利于单一实体。区块链技术解决了这一问题，凡是通过有效、真实且经批准的交易为社交网络做出贡献者，均可获得奖励。内容创作者因创意贡献而得不到报酬的日子已成过去。流程中嵌入的\
    \ `smart contracts`（智能合约）能在贡献被接受且上链后，立即向贡献者处理补偿和奖励。`Steemit` 和 `Sapien` 是提供此类服务的新时代基于区块链的组织。`Foresting`\
    \ 是区块链上的生活方式社交媒体平台，为其社区群体提供补偿政策，涵盖其内容创作、分享/活动、奖励及在网络上使用奖励等方面。\n\n*   **确认内容合法性：**\
    \ 由于社交媒体平台上流通和发布的信息质量问题，媒体公信力和真实性备受质疑。`MIT` 的一项研究发现，虚假新闻和信息传播至社交社区的速度更快，印象更深。要确定数据可信度的来源颇具挑战性。但区块链为假信息和误导信息提供了稳健的解决方案。区块链上的所有信息均视为交易，由于交易带有时间戳且可追溯，因此很容易追踪数据的起源和来源。\n\
    \n    此外，还可确立信息的可信度。社交网络 `Flixxo` 是一个去中心化的、基于区块链的点对点视频分享平台。平台社区用户通过 `Flixx` 代币因分享优质合法视频而获得奖励。平台用户需提供证据证明或关于视频合法性的信息，一经参与者批准，视频即可在网络上线。创作者可设置观看和分享视频所需的\
    \ `Flixx`。同样，广告商可在用户观看定向视频时投放一些 `Flixx`。社区用户需质押代币才能在平台上传视频。\n\n*   **信息获取：** 传统社交媒体企业不仅推动社交互动，还能控制展示给用户的信息。此类信息也可能受到监管机构的限制和准入管控。例如，`Wikipedia`\
    \ 的访问权限仅限于特定社区和地理位置。将区块链视为存储和传播信息的平台，只要网络中有节点在线，它就为用户提供了前所未有的数据访问选择。没有任何方式能让任何人对信息获取施加限制或实施任何形式的审查。`Everipedia`\
    \ 是一个基于区块链的内容分发平台，旨在支持信息共享和社区共识。与中心化的 `Wikipedia` 形成对比，`Everipedia` 认可将通用信息作为点对点资源的使命。\n\
    \n*   **验证市场：** 社交市场因无法为客户提供价值而备受困扰，因为它们往往充斥着对客户非个性化或不相关的商品和服务。区块链网络上的社交网络中的社交互动，将使各利益相关方（如用户、商家、供应商和服务提供商）能够接受并发布其信息，从而提供一个更好、更有意义的市场。像\
    \ `Indorse` 这样的区块链社交平台为其用户提供了更好的职业市场。参与用户可声称拥有一组特定技能，这将由同伴参与者 `Indorsed`（背书/认证）。参与者获得奖励并向招聘人员展示获背书的声明，这在职业解决方案服务中变得突出。\n\
    \n*   **用户参与动力：** 社交媒体平台需要为社交社区提供持续的创新和功能，使其始终感到有动力成为社区一员。其中一种方式是补偿和奖励每位为社区做出贡献的用户。通过引入能够为记录在案的贡献转移金融价值的\
    \ `smart contracts`（智能合约），平台可将价值与社交社区的受欢迎程度挂钩。随着用户有资格参与更重要的变现流程，他们将被激励贡献更多。`YouNow`\
    \ 是通过 `Props` 项目提供的应用，允许社交用户为社区做贡献，并在平台上跨多种应用分享奖励。\n\n*   **身份：** 社交媒体平台受虚假身份和机器人贡献的影响，严重阻碍了社交社区的增长。验证贡献者的真实身份至关重要，以避免错误信息和信息过载的不必要流通、分发和泛滥。区块链可解决虚假身份问题。社交社区可对贡献者的合法身份进行投票并达成共识，从而在第一时间避免并消除来自虚假身份的贡献。若贡献不合法或涉及虚假身份，区块链网络还能通过没收质押代币来惩戒用户。`Civic`\
    \ 提供的平台提供了控制和保护身份的工具。\n\n## 基于区块链的社交媒体\n\n考虑到区块链处于初期阶段，我们将介绍一些具有潜力成为成功的基于区块链的社交媒体企业的实际商业案例。这些企业利用了支持去中心化、分布式共享账本、不可篡改交易、共识机制、\
    \ `smart contracts`（智能合约）和代币化系统的区块链底层框架。\n\n### Indorse\n\n"
