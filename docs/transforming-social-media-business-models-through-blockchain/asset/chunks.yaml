- raw: 'The social media enterprises need to push technology at the platform level
    to achieve the best performance out of it. Further, the boundary of the organizations
    will get affected due to the intrinsic components of the peer-to-peer participation
    and consensus mechanisms of the technology. However, the proper intersection of
    the technology, market and organization towards a unified growth strategy will
    pave the way to adopt and include blockchain to redefine the social media enterprise.


    The book adopts the coherent approach to define the changing landscape of social
    media enterprise. The readers will be exposed to the utility of the blockchain
    in redefining the social media enterprises. The future social enterprise economy
    will be transformed to the distributed network of trust and ownership, where the
    participants can get involved in the social transactions over the blockchain network
    by just having the Internet connection and the social media applications. Moreover,
    blockchain technology, when integrates with social networks, provides a platform
    for self-executable social codes to make possible all sorts of social interactions.


    **Dr Nitin Upadhyay**


    ## 1


    Social Media Business Model


    Social media platforms have become hugely popular and involve people''s participation
    in content know-how. In this chapter, readers will understand the changing landscape
    of social media platforms.


    Introduction


    The transaction is not a new phenomenon. Human societies have always considered
    and observed it. The first mystical transaction between Adam and Eve unfolded
    the realities of the world. Perhaps one can argue the significance of the instigator
    to trigger the transaction, but we must understand that the transaction happened
    between two people accepting the consequences of the transaction. Transactions
    are the fundamental unit for the people and community to interact, communicate,
    converse, collaborate and co-exist (Agnihotri, Kothandaraman, Kashyap, & Singh,
    2012; An & Weber, 2015). The changing dimensions of the social interact interface
    have given rise to many technology-driven ecosystems, and Internet is the prime.


    The emergence of the Internet has impacted the way that we interact and perform
    business transactions. When Internet got commercialized, people were quite apprehensive
    about its capability and applicability. Most parts of the world had limited access
    to participate in the World Wide Web network. As suggested by the researchers,
    the adoption of the technology follows a bell curve, which was very well applicable
    to the Internet (Anderson, 2006; Bjørn-Andersen, Rasmussen, & Rasmussen, 2009).
    The 1990s era had few adopters – innovators and early adopters, and they experimented
    in a variety of ways by rolling services and solutions over the World Wide Web.


    Social media has been democratized such that it is no longer the choice for the
    business but a necessary strategy and added dimensions to achieve competitiveness
    (Baghdadi, 2013; Bechmann & Lomborg, 2013). In a recent report by McKinsey, it
    has been identified that the contribution of social media to business could range
    between $900 billion and $1.3 trillion. Enterprises are now exposed to so much
    potential of social media and have a vast opportunity space to leverage and build
    a competitive advantage (Ballantyne, 2014). However, the only source to added
    value is not only the inclusion of social advertisements and campaigns but also
    having a proper strategic composition of collaborations and cooperation within
    and across the industries. Most of the times, businesses are unclear about the
    strategic advantage and value proposition of the social media landscape. Thus
    they are unable to build the capability, brand, relationships, and goodwill thereby
