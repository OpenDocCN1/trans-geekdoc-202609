  trans: '


    # Indorse


    Indorse 是一个基于新兴区块链驱动的社交网络平台的专业人士平台，涵盖代币化和去中心化。它成立于 2017 年，总部位于新加坡。Indorse 成立于
    2017 年。Indorse 平台致力于推动专业人士在平台上分享专业技能，并由参与网络中的同行进行验证。这样做具有双重益处：首先，专业人士每获得一个背书就会得到激励；其次，专业人士的声望在社区中得到提升并变得可见。Indorse
    社区设想了一个未来，成员将在其中建立专业档案并从其声誉中获益。


    ## 平台模型


    Indorse 将数据的所有权归还给贡献者。平台内的代币系统激励诚实的贡献，而对于每一个错误的背书，贡献者都会受到惩罚。Indorse 利用 `Ethereum`
    平台作为计算引擎，存储方面使用 `Inter Planetary File System (IPFS)`。每个平台用户参与两种角色：


    ### 声明者


    负责对特定技能提出“声明”，从而将“声明”交易发起到 Indorse 平台。声明者还需要提交证据证明或信息来支持该声明。一旦“声明”及其相关数据在同行网络平台上可用，审核员就会选择处理这些声明，并给予背书或标记。


    ### 审核员


    审核员负责批准或标记声明者提出的声明。系统采用基于权益证明的 Indorse 评分，声明者和审核员在声明或背书上押注其声誉。


    该平台支持以下第三方 DApp：


    *   **Indorse DE**：它方便成员在平台上部署档案和内容。

    *   **Attores 证书颁发 (CI) 平台**：它是一个证书颁发模块，可将证书与平台上的智能合约映射。

    *   **IPFS**：它是去中心化存储，大多数文档、声明、信息都将存储在 IPFS 上。

    *   **uPort**：它是一个自主身份系统，方便人们识别和认证自己。

    *   **Truffle**：支持 `Ethereum` 智能合约的模块。

    *   **Spectrum**：它是一个钱包，用户和开发者均可使用。

    *   **Status**：它是一个开源消息平台和移动界面，方便与去中心化应用程序交互。


    ## 用例


    让我们通过用例场景来了解 Indorse 平台的运作。假设 Nick 首次加入 Indorse 平台。因此，他在平台上获得最低限度的合格 Indorse 代币。接着，他在平台上创建个人档案，并针对其技能提出多项声明。对于每一项技能声明，他都分享证据信息或证明。Indorse
    平台随机选择审核员（假设为 John）来验证声明，随后声明进入孵化期。John 根据证据信息检查声明，并为 Nick 背书。孵化期结束，达成关于验证的共识。Nick
    和 John 均获得 `SCR` 代币奖励，可用于享受 Indorse 平台上的服务。此外，Nick 和 John 的 Indorse 评分和声誉均有所提升。


    声明者有两种技能背书选项。选择基于匿名背书协议。第一，通过平台随机选择的过程；第二，声明者可以通过向平台支付 `SCR` 代币来选择特定的审核员。平台采用的代币化模型提供两种代币：可交易代币（`IND`
    代币）和内部核算代币（`SCR` 代币）。`SCR` 代币不可交易，永不离开平台。`IND` 代币是贡献收入模型的来源。例如，广告位可使用 `IND` 代币购买。广告主需通过交易所购买
    `IND` 代币。此外，人力资源和人才招聘服务将仅通过可交易代币启用。


    Indorse 平台通过去中心化方式将个人的身份、档案和成就与一个 `Ethereum` 地址关联，解决了“了解你的客户”方面的问题。此外，在预测市场方面更进一步，他们可以从专业人士那里获取数据，以预测未来专业技能的可行性和能力。


    | 解决方案 | Indorse |

    | --- | --- |

    | 成立时间 | 2017 |

    | 核心团队 | 七名成员 |

    | 客户 | 企业 |

    | 市场维度 | 增长中 |

    | 竞争对手 | 较少 |

    | 赋能基础设施 | Ethereum |

    | 合作伙伴 | 不同层级的合作伙伴关系 |

    | 用例 | KYC、广告、身份和专业技能声明 |


    # Everipedia


    这是一个支持并促进世界任何地方、任何人贡献的平台。其目的是开发一个去中心化、分布式的知识共享平台。每位贡献者都可以参与并贡献其所知所重的内容给参与网络。它成立于
    2014 年。基于区块链的平台将贡献信息复制到参与系统中的数千个节点上，从而使信息可被世界大部分地区访问。即使少数参与者试图封锁某些节点以阻止信息访问，由于区块链的固有特性，信息仍可通过网络中的其他节点访问，除非整个区块链被封锁，而理论上这是不可能的。相比于中心化的
    Wikipedia，Everipedia 作为点对点资源支持普世信息的使命。


    ## 平台模型


    该平台支持点对点信息库，从而为参与网络提供不间断的信息访问。这也意味着信息网站可访问且实际上变得不可审查。Everipedia 构建于 `EOS` 之上。参与者需要持有并质押
    `EOS` 以执行编辑或投票交易。`EOS` 代表计算资源（RAM 和带宽），并提供拥有支持 Everipedia 网络平台股份的能力。该平台支持代币化模型，向贡献者分发代币
    `IQ`。代币系统承诺吸引更多贡献者共同努力，创建世界上最大的百科全书。该平台旨在开发通用知识库，参与者可在其中阅读、参与并贡献他们感兴趣的文章。最初，平台已导入所有来自
    Wikipedia 的文章。贡献者可通过 `Scatter` 访问平台，并参与提议编辑的批准和拒绝。


    贡献者通过参与 Everipedia 网络获得 `IQ` 代币。贡献者因在平台上创建和维护内容而获得激励。每位贡献者执行一些任务以领取代币：


    *   编辑内容

    *   添加内容

    *   创建文章

    *   对提议的编辑进行投票


    贡献者可查看平台的活动动态，以查看所有建议编辑的活动日志。它包含两部分：


    *   **最新编辑**：显示在活动日志顶部的活动编辑提议。

    *   **即将过期**：列出即将过期、需尽快投票的活动编辑提议。


