    them. For example, Skype and AOL are the platforms being used by the people who
    already know each other and not for any form of expansions. The structure and
    the flow in the social graphs drive the collective intelligence, and denser and
    the larger connect graphs are responsible for driving the collective intelligence.
    The social media platforms should provide tools, features and options for creating,
    establishing and managing collective intelligence covering social graphs, behaviours,
    etc. The influencer or denser groups directly contributes to the corpora. While
    the chain of connections following the rules of the centrality could govern the
    disparate collective intelligence, tapping such would improve the cognitive performance.


    Note: Social media collective intelligence management considering the balance
    between direct and indirect collective intelligence usage is crucial, and thus
    a solution promising such balance mix is required.


    Blockchain Value Drivers and Value Opportunities


    We have noticed that foundational building blocks of the social media platforms
    are essential for the businesses to leverage their potential for their growth.
    However, the conventional or Web 2.0 social media applications have limitations,
    as shown in [Table 4.2](#CH004-9781838673024.xhtml#tbl2).


    Table 4.2. Limitations of Social Media Building Blocks.


    | Building Block || Description || Limitations |


    | --- | --- | --- |


    | Identity || The scope and extent to which users reveal their information and
    identities || Social media identity management considering the balance between
    sharing identities and protecting privacy is ineffective and constrained |


    | --- | --- | --- |


    | Presence || The scope and extent to which users know other are available ||
    Social presence management considering the balance between real and virtual presence
    is ineffective and constrained |


    | Group || The scope and extent to which users are allowed to form communities
    || Social media group management considering the balance between direct and indirect
    implications is ineffective and constrained |


    | Reputation || The scope and extent to which users are aware of the social standing
    of others and the content || Social media reputation management considering the
    balance between content and people reputation is ineffective and constrained |


    | Collaboration || The scope and extent to which users can collaborate || Social
    media collaboration management considering the balance between direct and indirect
    sociality objects usage is ineffective and constrained |


    | Conversation || The scope and extent to which users can communicate with each
    other and establish a conversation || Social media conversation management considering
    the balance between a direct and indirect conversation is ineffective and constrained
    |


