- raw: '*   *In-app payments:* It is not uncommon for social media platforms to offer
    varied service to its user base to increase their engagement level and value proposition.
    Few social media platforms have pioneered inclusion of in-app payments systems
    to initiate financial transactions without leaving the social media application.
    It has resulted not only in increased customer base but also improving the customer
    engagement and retention time. But all such applications are not run safe and
    prone to data leaks and identity thefts, and thus many high-profile social media
    sites have withdrawn such services. Blockchain technology paves such an issue
    and provides an effective solution. The fundamental transaction can be supported
    through the smart contracts apart from offering the financial transactions through
    the Bitcoin cryptocurrency. Organizations like Steemit, SocialX are introducing
    several in-app offerings for its customer base. Steemit rewards its native currency
    to the customer base for contributing to social interaction and influence. SocialX
    users earn SOCX tokens by contributing video and images in the social network
    and utilize those to avail services and products.


    *   *Compensation and rewards:* The fundamental principle for the growth of the
    social economy is inclusive and collective contributions. The well-known social
    media enterprises ignored the real social, economic growth by leaving the social
    users aside and concentrating on the sole benefit by earning and saving the bigger
    pie of the revenue. Only a few influencers get the fraction of the revenue. For
    example, Youtube provides the influencer portion of the targeted ads revenue over
    the content contribution. Such models are unfair and most beneficial to the single
    entity. The blockchain technology solves this problem, and whosoever contributes
    to the social network using valid, authentic and approved transactions get the
    rewards. No more the days when the content creator is unpaid for his/her creative
    contributions. The smart contracts embedded in the process will be able to process
    compensation and rewards to the contributor immediately once the contributions
    are acceptable and available on the network. Steemit and Sapien are new-age blockchain-based
    organizations that provide such offerings to the user base. Foresting is a lifestyle
    social media platform on the blockchain which offers its community base a compensation
    policy considering their content creation, sharing/activities, rewarding and use
    of rewards over the network.


    *   Confirming the legitimacy of the content: The media credibility and the truth
    are questionable due to the issue related to the quality of the information circulated
    and published on social media platforms. In the research study done by MIT, it
    was found that false news and information reach faster to the social community,
    and have deeper impressions. It is somewhat challenging to identify the source
    of the credibility of the data. But blockchain provides a robust solution to the
    fake and misinformation. All the information on the blockchain are considered
    as the transactions, and since transactions are time-stamped and traceable, it
    becomes easy to trace the origin and source of the data.


    Moreover, the credibility of the information can also be established. The social
    network Flixxo is a decentralized, peer-to-peer video sharing blockchain-based
    platform. The users in the platform community get rewarded for sharing quality
    legal video through Flixx tokens. The users in the platform need to support the
    proof of evidence or information about the legality of the video, and once approved
    by the participants, the video is available on the network. The creator can set
    up the Flixx for watching and sharing the video. Similarly, the advertisers can
    place some Flixx for introducing targeted video whenever the user in the platform
    watches them. Users in the community need to stake the tokens to upload the video
    on the platform.


    *   Information accessibility: The conventional social media enterprise not only
    drives the social interactions but is also able to control the information shown
    to the users. Such information can also be restricted and limited to access by
    the regulatory agencies. For example, access to Wikipedia is limited to specific
    communities and geographical locations. Considering blockchain as a platform to
    store and disseminate information, it offers an unprecedented choice to the user
    to access the data as long as a node is up in the network. There is no way that
    anyone can put a restriction or impose any form of censorship exclusively on information
    access. Everipedia is a blockchain-based content distribution platform to support
    information sharing and community consensus. In contrast to the centralized Wikipedia,
    the Everipedia endorses the mission of universal information as a peer-to-peer
    resource.


    *   Verified marketplaces: The social marketplace suffers from the inability to
    provide value to the customers, as they are often cluttered with the goods and
    services that are not personalized or relevant to the customers. The social interactions
    in the social network over the blockchain network will enable and empower varied
    stakeholders such as users, merchant, vendors and service providers to accept
    and release their information to provide a better a significant marketplace. Blockchain
    social platforms like Indorse provide a better career marketplace for its user.
    The participating user can claim a particular set of skills which will be Indorsed
    by the peer participants. The participants get the rewards and showcase the indorsed
    claims to the recruiters, which becomes prominent in the career solution offerings.


    *   User participation motivation: Social media platforms needs to offer continuous
    innovation and features to the social community so that they always feel motivated
    to the part of the community. One way is to compensate and reward each user for
    providing contributions to the community. By including smart contracts capable
    of transferring financial values for the recorded contributions, the platforms
    can tie the values with the popularity of the social community. The user will
    be motivated to contribute more as they become eligible for more significant monetization
    process. YouNow, an application offered through the Props project, allows social
    users to contribute to the community and share their rewards across the variety
    of applications over the platform.


    *   Identities: The social media platforms are affected by the contributions of
    the fake identities and bots, which are significantly hampering the social community
    growth. It is essential to verify the true identity of the contributions to avoid
    unnecessary circulation, distribution and population of misinformation and information
    overload. The blockchain can solve the problem of the fake identities. The social
    community can vote and agree on the consensus for the legitimate identity of the
    contributor and thus at the very first place avoid and eliminate the contributions
    from the fake identities. The blockchain network will also be able to reprimand
    the user involving throwaway of the staked tokens in case contributions are not
    legitimate or fake identities are concerned. The platform provided by Civic offers
    the tools to control and protect the identities.


    Blockchain-based Social Media


    Considering the nascent stage of the blockchain, we will cover a few practical
    business examples that have the potential to emerge as a successful social media
    enterprise based on blockchain. These businesses have utilized the underlying
    framework of blockchain that supports decentralization, distributed shared ledger,
    immutable transactions, consensus mechanisms, smart contracts and tokenization
    system.


    ### Indorse'
