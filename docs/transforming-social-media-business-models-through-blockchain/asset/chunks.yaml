    | Founded | 2014 |

    | Core team | Seven members |

    | Client | Enterprise |

    | Market dimensions | Growing |

    | Competitors | Few |

    | Enabling Infrastructure | EOS |

    | Partners | Different levels of partnership |

    | Use case | Peer-to-peer information creation and maintenance |


    ### Sapien


    它是一个社交区块链去中心化新闻平台。传统的社交媒体平台掌握所有数据并将其变现以谋取利益，还会推广虚假新闻和侵入式广告。为了推广准确的新闻，该平台使用 `SPN`
    代币赋予贡献者生成优质内容的能力。平台上生成的内容也可以通过平台支持的微支付功能进行变现。用户可以选择与平台上的广告合作伙伴共享他们的数据，并获得额外奖励积分的收益。`Sapien`
    市场和生态系统中的其他利益相关者（如商家、发布者等）参与其中，并通过奖励系统从他们的交易和贡献中获益。当贡献被社区中声誉良好的同行高度评价时，用户就会在社区中建立声誉。平台采用的全球声誉系统会阻止模糊和低质量的贡献。`Sapien`
    是一个民主化的平台，支持同行参与者生成优质内容作为其真实价值。


    #### 平台模型


    `Sapien` 使用 `Ethereum` 区块链平台模型以及代币化系统。它使用 `SPN` 代币在网络上发布优质内容、评论、点赞并执行其他操作。该平台不仅仅是一个虚拟公告板。`Sapien`
    平台承诺通过克服传统平台的局限性，支持所有类型的媒体和信息，而不必拥有像 `Facebook`、`Twitter`、`YouTube` 这样针对不同形式的新闻和媒体的多个社交媒体应用程序。此外，它还允许用户创建群组并成为信息共享社区的一部分。平台通过其奖励系统补偿内容策展人。`Sapien`
    在其平台上推广几类用户：


    *   **Creator（创作者）**：向网络提交原创贡献的用户

    *   **Curator（策展人）**：在 `Sapien` 网络上其部落中发现并分享高质量内容的用户

    *   **Freelancer（自由职业者）**：自愿为 `Sapien` 网络提供服务以换取 `SPN` 代币的用户

    *   **Developer（开发者）**：通过开发第三方去中心化应用程序来增强生态系统功能，从而为平台做贡献的用户

    *   **Media（媒体）**：可以成为合作伙伴建立独立发布业务，从而参与内容独家定价的用户


    `SPN` 代币被质押以访问平台上的社交功能。质押的代币用于评论、提交提议、策展、分享和发布内容等。参与者在网络上做出的贡献会计入声誉分数。个人的声誉分数描述了该个人在网络或参与社区中的历史参与度和交易情况。社区根据用户的行为评估声誉分数，并相应地给予正面或负面评分。`Sapien`
    网络还支持市场，用户可以在其中创建广告访问独家补偿、激励和组件，既可以在网络内部，也可以通过第三方企业。此外，由于平台赋予用户数据所有权，他们可以决定将数据共享给广告商，而不是在定向广告上分享收入。部落也可以参与在部落中投放特定广告并获得奖励。


    #### 用例


    让我们通过用例场景来了解 `Sapien` 平台的运作。假设 `Nick` 加入 `Sapien` 网络。为了获得发布、评论或投票的奖励，`Nick` 首先必须在平台上质押他的
    `SPN` 代币。如果 `SPN` 代币没有质押，那么 `Nick` 在网络上执行社交活动将不会获得任何奖励。由于 `Nick` 质押了他的 `SPN` 代币，他参与了帖子的投票。帖子的质量根据点赞数进行评分，同时考虑声誉分数。奖励会分配给帖子的创作者和点赞该帖子的用户。平台通过限制
    `Nick` 仅能使用固定数量的 `SPN` 代币进行活动，帮助他避免参与任何恶意活动。如果声誉分数为负，则他所有质押的代币都会转移给平台。


    | Solution | Sapien |

    | --- | --- |

    | Founded | 2018 |

    | Core team | Seven members |

    | Client | Enterprise |

    | Partners | DAOstack, BitClave, BlockchainLab, Civic |

    | Market dimensions | Growing |

    | Competitors | Few |

    | Enabling infrastructure | EOS |

    | Partners | Different levels of partnership |

    | Use case | Peer-to-peer information creation and maintenance |


    ### Props

