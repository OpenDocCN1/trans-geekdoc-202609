    plans. The constructs help streamline the whole business vision and align the
    business goals. Although the business models have around us since ages, people
    have used varied terms and constructs to define it. For example, Morris, Schindehutte,
    and Allen (2005) suggested 24 different elements contributing to the business
    models after studying 19 definitions of the business models. However, the more
