    # 区块链技术与社交媒体


    十年间，区块链技术在技术 S 曲线上的位置使其适合拥抱创新、采用与投资 (Crosby, Nachiappan, Pattanayak, Verma, &
    Kalyanaraman, 2016)。它促进了包容性经济，并使个人能够参与民主进程。比特币的成功依赖于支持基于软件的验证、核实与共识的区块链基础设施。用于挖掘和创建区块的不断增长的算力来源，使区块链爱好者得以将目光投向货币转移之外的区块链应用
    (Don & Alex, 2016)。


    区块链的使用可能影响大量应用。更重要的是，以社会实体为中心的社交媒体平台和应用将得到适当的运营和治理。社交图谱关注的不是网站的连通性，而是体验。


    遗憾的是，缺乏社交媒体的整合使用来部署统一战略，以将参与者的体验置于前沿 (Cortimigila, Ghezzi, & Renga, 2011)。所有社交媒体平台都以中心化为重点，支持有限范围的触达和互动。正如
    Corcoran (2009) 所言，社交媒体生态系统包含三种典型的媒体类型——自有媒体、付费媒体和赢得媒体。


    ## 自有媒体


    此类媒体系统由组织治理和拥有。例如，公司的网站及其上关于服务、解决方案和产品的发布，完全由相关团队（如市场部门）控制。


    ## 付费媒体


    此类媒体系统有助于创造知名度和触达。通过赞助和广告关联公司的形象，是展示品牌效力的部分途径。


    ## 赢得媒体


    此类媒体系统既不受公司资源控制，也不由其管理。口碑或病毒式媒体通常会引发对特定关注点的即时热议。


    根据 Li 和 Bernoff (2008) 的观点，在社交媒体生态系统中，活跃参与者根据不同的社会行为类型进行细分。


    ### 创作者


    他们是主动创造社交对象的人。他们还利用社交媒体平台支持的适当功能和工具，发布、维护、更新和上传对象。


    ### 收集者


    此类别下的人负责收集社交对象，并将其适当地与同伴或参与网络分享。


    ### 加入者


    有时人们确定要参与某个群体，或者他们参与是为了解群体情感，如果这与他们的诉求相符，则会进一步投入互动。


    ### 评论者


    该细分人群通常对社交对象进行评论和评分。他们负责成就或毁掉制品，此外，如果他们代表影响力核心区，则监控和管理其行为以避免不必要的风险变得至关重要。


    去中心化数据库支持有效的通信或消息传输。例如，文件和视频共享正变得经济高效，以至于传统的中心化网络或电子平台（如 Google Drive、Yahoo、Gmail
    等）变得不那么必要。通过去中心化机制，无需中央机构干预，即可发送、共享、检索和访问加密消息和文件。去中心化网络允许信息无缝发布和分发，消除了单一权力进行审查的能力。


    因此，涉及基于区块链使用的社交媒体平台的组织，必须考虑媒体类型和活跃参与者细分来分析其适用性。在第 4 章中，我们将探讨寻找赋能因素和价值驱动因素，以将社交媒体领域与价值主张联系起来。基于区块链的社交媒体企业显著影响媒体类型和参与者。参与者因在区块链网络上为媒体类型做出贡献而获得奖励和激励。此外，智能合约的引入用于启动和执行记录交易和分发奖励代币的端到端流程，为同伴参与者创造了收入
    (Chesebro, 2015)。作为区块链网络的内在属性，参与者拥有数据的所有权，并可将其用于变现目的。图 2.1 表示区块链作为底层基础的引入，以支持媒体类型和参与者。


    ![image](img/f02-01.jpg)


    **图 2.1.** 区块链与媒体类型和参与者。


    早期进入者将获得优势，重新定义社交媒体并利用区块链进行创新，以开发新边缘社交媒体社区。社交媒体企业可以利用技术、市场和组织作为结构框架，来衡量和重新设计其进入区块链市场的战略。


    社交媒体企业需要在平台层面推动技术，以发挥其最佳性能。此外，由于技术的内在组件——点对点参与和共识机制，组织的边界将受到影响。然而，技术、市场和组织朝向统一增长战略的恰当交汇，将为采用和引入区块链以重新定义社会企业铺平道路。


    # 3 挑战与机遇


    互联网创造了我们在其早期未曾预见的新可能性。区块链技术独一无二，具有渗透现有市场和开发新市场的巨大潜力。在本章中，读者将了解区块链在社交媒体行业相关的挑战与机遇。这将帮助他们探索现有业务如何转型，以及如何创造新市场。


    ## 简介


    利用区块链重新定义社交媒体，为贡献者带来了数据所有权的即时收益。由于该技术基于分布式账本上记录的点对点交易，没有任何单一中央机构对其进行控制。所有权从中央机构转移到了同伴的边缘。例如，传统社交媒体企业（如
    Facebook）将无法窥探社交参与者在社交网络上共享的数据，除非他们获得权利和同意。社交互动交易将存储在区块链网络上，并支持隐私、保密性和不可篡改性 (Crosby,
    Nachiappan, Pattanayak, Verma, & Kalyanaraman, 2016; Don & Alex, 2016)。


    此外，用户还可以将数据保存在链下的云端。社交用户是社交对象的关键贡献者。通过使用区块链，社交企业将无法存储和挖掘用户数据。既然用户现在可以决定谁有权访问数据以及数据将用于何处，他们就能获得公平的机会赚取收入分成。例如，用户可能对特定的一组广告感兴趣，与其由社交企业向用户推送广告，不如用户共享数据并根据获得的加密货币或代币份额来决定广告。


