    ### Identity


    Identity is associated with the individual to distinguish one from the other.
    Several information contribute to the identification of an individual in the social
    media setting. These can include name, age, sex, location and additional critical
    information by which one''s identity is revealed. A research study (Kaplan & Haenlein,
    2010) has disclosed that user knowingly or unknowingly through the conscious and
    unconscious efforts reveals the subjective information such as behaviour traits,
    thoughts, feelings and emotions. However, to tackle such issues, users have a
    different set of preferences and features provided by social media sites and applications
    manage their identities.


    The identity threat is the primary threat associated with social media platforms.
    Manipulating information and influencing the social network by the use of fake
    IDs are becoming common. There exist many platforms to work around people setting
    up their IDs (personal profiles). For example, Facebook allows users above a certain
    age to create self-profile before they become part of the social network. They
    also get various controls on the way they share their posts or messages. Keeping
    several IDs to work with multiple social media platforms is daunting, and thus
    secondary ID services like DandyID is becoming famous that provides one solution
    to prevent and manage all the IDs securely.


    Moreover, social media users are now promoting social media user profiles through
    services like Retaggr. It facilitates them to showcase their different profiles
    and encourage others to follow them. As identity is core to the social media platforms,
    organizations are having concerns about the privacy and security of its presence
    and getting engaged with other sites and applications. Several, lawsuits have
    been filed and got initiated in violation of privacy related to social media sites
    (Kravets, 2010). The social community has identified few strategies, for example,
    real identity vs virtual identity, to work with which help them to establish self-promotion
    (e.g. Facebook) or self-branding (e.g. LinkedIn). Specific sites provide anonymity
    to the users considering the critical context of involvement in the community.
    For example, Divorce360 includes help and support to the social group going through
    the phase of divorce, and thus, people participate in discussions when anonymity
    is addressed. Several technological advances have also been in progress, such
    as the development of OAuth protocol (Hammer-Lahav, 2007). By the OAuth protocol,
    an individual can give access to the information without revealing identity information.
    For, example, Twitter provides use of OAuth protocol by sharing several tokens
    and keys so that individual can handshake to utilize Twitter application and work
    with Twitter data.


    Note: Social media identity management considering the balance between sharing
    identities and protecting privacy is crucial and thus a solution promising such
    balance mix is required.


