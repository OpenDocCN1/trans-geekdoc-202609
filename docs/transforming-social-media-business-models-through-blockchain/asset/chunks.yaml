    # 区块链在社交媒体平台中的适用性


    区块链在社交媒体平台中的适用性极为广泛；因此，企业可以创造真正的价值。所提出的价值主张模型将助力社交媒体行业在数字化转型中实现飞跃。在本章中，读者将了解如何利用区块链价值主张来转型社交媒体商业模式。


    ## 简介


    社交媒体商业模式帮助组织发掘途径，通过社交媒体工具和平台获取并创造价值，而这在以往是不可能实现的。通常，两类组织会利用社交媒体模式。首先是拥有并管理社交媒体平台和工具的组织。其次是利用它们在组织内外进行分享、沟通和协作的组织。商业模式帮助企业向潜在客户、客户、合作伙伴和利益相关者传递其价值（Wirtz,
    2011; Zott, Raphael, & Massa, 2011）。商业模式涵盖的是业务构建要素，而非指导实施和行动计划的战略。这些构建要素有助于理顺整体业务愿景并对齐业务目标。尽管商业模式由来已久，但人们使用不同的术语和构建要素来定义它们。例如，Morris、Schindehutte
    和 Allen（2005）在研究了 19 种商业模式定义后，提出了 24 个促成商业模式的不同要素。然而，更通用且广泛使用的要素包括价值主张、目标市场、客户关系、基础设施和经济模式。商业模式至少应涵盖价值主张、价值创造与提供，以及财务持久性（Wielki,
    2010）。


    ## 区块链与社交媒体的构建模块


    企业应关注社交媒体商业模式的基本构建模块（Kietzmann, Hermkens, McCarthy, & Silvestre, 2011; Singaraju,
    Nguyen, Niininen, & Sullivan-Mort, 2016）。这些模块既不互斥，也非全部强制包含。相反，它们指导并帮助企业协调力量，以制定增长战略规划。每个模块都有助于组织理解特定的社交媒体用户体验及其影响。图
    4.1 展示了社交媒体的构建模块。


    ![image](img/f04-01.jpg)


    **图 4.1.** 社交媒体构建模块。


    表 4.1 总结了功能构建模块及其影响。


    ### 表 4.1：社交媒体构建模块的影响


    | 构建模块 | 描述 | 影响 |

    | --- | --- | --- |

    | 身份 | 用户透露其信息和身份的范围和程度。 | 用于创建、建立和管理身份的工具、功能和选项的可用性。 |

    | 在场感 | 用户知晓他人可用状态的范围和程度。 | 用于在特定情境下创建、发展和管理亲密感、真实感和即时性的工具、功能和选项的可用性。 |

    | 群组 | 允许用户形成社区的范围和程度。 | 用于创建、建立和管理社区的工具、功能和选项的可用性。支持管控成员资格规则和协议的功能。 |

    | 声誉 | 用户知晓他人及内容的社会地位的范围和程度。 | 用于创建、建立和管理用户、品牌及内容的强度、热情、情感和影响力的工具、功能和选项的可用性。 |

    | 协作 | 用户可以协作的范围和程度。 | 用于在特定情境下创建、建立和管理项目、目标和任务协作的工具、功能和选项的可用性。 |

    | 对话 | 用户相互沟通并建立对话的范围和程度。 | 考虑到沟通速度以及发起和参与的风险；交换、分发和接收内容，用于创建、建立和管理沟通的工具、功能和选项的可用性。
    |

    | 集体智慧 | 用户贡献于集体智慧的范围和程度。 | 用于创建、建立和管理涵盖社交图谱、行为等的集体智慧的工具、功能和选项的可用性。 |


    ## 身份


    身份与个人相关联，用于将个体彼此区分。在社交媒体环境中，有多条信息有助于识别个人。这些信息可以包括姓名、年龄、性别、位置，以及揭示个人身份的其他关键信息。一项研究（Kaplan
    & Haenlein, 2010）披露，用户无论知情与否，都会通过有意识和无意识的努力，透露行为特征、思想、感受和情绪等主观信息。然而，为了应对此类问题，用户拥有社交媒体网站和应用程序提供的不同偏好设置和功能来管理其身份。


    身份威胁是与社交媒体平台相关的主要威胁。通过使用虚假 ID �纵信息和影响社交网络的现象日益普遍。存在许多平台致力于解决人们设置 ID（个人档案）的问题。例如，`Facebook`
    允许达到一定年龄的用户在加入社交网络前创建个人档案。他们还能通过各种控制来管理分享帖子或消息的方式。在多个社交媒体平台上维护多个 ID 令人望而生畏，因此像
    `DandyID` 这样的二级 ID 服务越来越受欢迎，提供统一解决方案以安全地防范和管理所有 ID。


    此外，社交媒体用户现在正通过 `Retaggr` 等服务推广社交媒体用户档案。它方便用户展示其不同的档案并鼓励他人关注他们。由于身份是社交媒体平台的核心，组织对其存在的隐私和安全，以及与其他网站和应用程序的互动表示担忧。已有多起诉讼因侵犯社交媒体网站相关隐私而被提起（Kravets,
    2010）。社交社区已确定了一些策略，例如真实身份与虚拟身份，以便于开展工作，这有助于他们建立自我推广（如 `Facebook`）或自我品牌化（如 `LinkedIn`）。考虑到社区参与的关键背景，特定网站为用户提供匿名性。例如，`Divorce360`
    为正在经历离婚阶段的社会群体提供帮助和支持，因此在匿名性得到保障时，人们才会参与讨论。多项技术进步也在进行中，例如 `OAuth` 协议的开发（Hammer-Lahav,
    2007）。通过 `OAuth` 协议，个人可以在不透露身份信息的情况下授予信息访问权限。例如，`Twitter` 通过共享多个令牌和密钥提供 `OAuth`
    协议的使用，以便个人进行握手验证，从而使用 `Twitter` 应用程序并处理 `Twitter` 数据。


    > **注意：** 考虑到在共享身份与保护隐私之间取得平衡，社交媒体身份管理至关重要，因此需要一种能承诺这种平衡组合的解决方案。


