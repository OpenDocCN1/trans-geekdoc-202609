- raw: 'User can sign through existing social media accounts or Scatter. When signed-in
    through Scatter, the user gets the chance to authorize the proposed edit. While
    OreID is used, that is generated through the existing social media accounts, to
    confirm the proposed edit in conjunction with the pin code. Once Scatter or OreID
    authorize the changes, then the articles or edits are open to the community for
    the voting, and once approved the edits are incorporated in the articles.


    The readers, instead of passively reading the articles, can also shape the information
    to be presented to the world by way of votings. Any user who has an EOS account
    and holds the IQ token and logged in through the Scatter has the ability to vote.
    Each contributor who votes to the majority can earn the reward proportional to
    the amount that they vote. In case the submitted edit is rejected, or the vote
    is to the minority then the contributor''s tokens are locked for a while under
    the phase ‘slashing’.


    #### Use Case


    Let us understand the use case scenario for the functioning of the Everipedia
    platform. Consider Nick joins the Everipedia platform for the first time using
    the existing social media accounts, for example, Facebook. Nick gets by default
    250 IQ tokens and maximum five edits proposal ability. Each edit proposal cost
    Nick 50 IQ tokens. Since Nick has joined though social media account, he is restricted
    to creating articles and proposing edits. He is not eligible to participate in
    votes.


    Further, no reward in return to Nick is provided for any of his contributions
    due to his limited account feature access. On the other side, John joins the Everipedia
    network through Scatter account and holds EOS via IQ tokens. He immediately gets
    the fully functional feature set to contribute to the Everipedia''s network. For
    every edit, contribution and vote that he participates in towards the majority
    vote, he gets the reward.


    | Solution || Everipedia |


    | --- | --- |


    | Founded || 2014 |


    | --- | --- |


    | Core team || Seven members |


    | Client || Enterprise |


    | Market dimensions || Growing |


    | Competitors || Few |


    | Enabling Infrastructure || EOS |


    | Partners || Different levels of partnership |


    | Use case || Peer-to-peer information creation and maintenance |


    ### Sapien


    It is a social blockchain decentralized news platform. The conventional social
    media platforms hold all the data and monetize it for its benefits and promote
    fake news and invasive advertisements. To promote accurate news, the platform
    uses SPN tokens to provide the capability to the contributors to generate quality
    content. The content generated on the platform can also be monetized through the
    micropayment feature supported by the platform. The users can opt in to share
    their data with the advertising partners on the platforms and get the benefits
    of extra rewards points. Other stakeholders such as a merchant, publishers, etc.
    in the Sapien''s marketplace and platform participate and get the benefits through
    the reward system for their transactions and contributions. The users build their
    reputation in the community when the contributions are rated highly by the peer
    reputed participation in the community. The global reputation system employed
    by the platform discourages the obscure and poor quality contributions. Sapien
    is the democratized platform that supports the involvement of the peer participants
    to generate quality content as its real value.


    #### Platform Model


    Sapien is using the Ethereum blockchain platform model along with the tokenization
    system. It uses the SPN token for posting quality content, commenting and upvoting,
    and perform other actions over the network. The platform is more than the virtual
    bulletin board. Instead of having multiple social media applications like Facebook,
    Twitter, YouTube for different forms of news and media, Sapien platform promises
    to support all kinds of media and information by overcoming the limitations of
    the conventional platforms. Also, it allows the users to create groups and be
    the part of the information-sharing community. The platform compensates the content
    curators through its reward system. Sapien promotes several types of users on
    its platforms:


    *   Creator: Users who submit original contributions to the network


    *   Curator: Users who discover and share high-quality content within their tribes
    on the Sapien network.


    *   Freelancer: Users who willingly provide services to the Sapien network in
    exchange for SPN tokens.


    *   Developer: Users who would contribute to the platform by developing third-party
    decentralized applications to enhance the functionality of the ecosystem.


    *   Media: Users who can become partners to establish independent publishing and
    thereby involve in exclusive pricing for the content.


    The SPN tokens are staked to access the social features on the platform. The staked
    tokens are used for commenting, contributing proposals, curating, sharing and
    posting content, etc. The contributions made by the participants on the network
    contribute to a reputation score. An individual''s reputation score describes
    the historical involvement and transaction of the individual within the network
    or the participating community. The community based on the user''s action evaluates
    the reputation score and scores it positive or negative accordingly. The Sapien
    network also supports the marketplace for users to create ad access exclusive
    compensations, incentives and components both within the network and through third-party
    businesses. Moreover, since the platform provides the right to ownership of the
    data to the users, they can decide to share the same with the advertisers instead
    of the revenue share on the targeted ads. The tribe can also participate in placing
    particular ads on the tribes and get reward for the same.


    #### Use Case


    Let us understand the use case scenario for the functioning of the Sapien platform.
    Consider Nick joins the Sapien network. To receive a reward for posting, commenting
    or voting, Nick has first to stake his SPN tokens on the platform. In case the
    SPN tokens are not staked, then Nick will not get any reward to perform social
    activities on the network. Since Nick has staked his SPN tokens, he participates
    in voting the post. The post''s quality is scored based on the upvotes, considering
    the reputation score. The rewards are distributed to both the creator of the post
    and the users who upvote the post. The platform helps Nick to avoid any indulgence
    in any malicious activities by restricting him to utilize only a fixed amount
    of SPN tokens for the activities. In case, the reputation score results in negative,
    then all his staked token are transferred to the platform.


    | Solution || Sapien |


