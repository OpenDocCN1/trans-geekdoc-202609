    # Blockchain: A Decentralized and Distributed Public Ledger


    Blockchain provides a decentralized and distributed public ledger for all the
    participating parties and professes no intermediary involvement. In this chapter,
    readers will be exposed to the various features of the blockchain for accomplishing
    its functioning.


    ## Introduction


    Why do we need another technological revolution? Is it worth trying? Do we need
    to worry about the incoming technological wave of the trust-free economy? Many
    such questions need to be answered to unfold the real value of the blockchain.
    Competition is high, and we have witnessed the downfall of many Fortune 500 companies
    during the rise of the Internet wave. The yesteryears'' Internet has changed not
    only the dynamics of the business but also the society. With the advent of the
    social media platforms, the business, society and human all have come closer as
    the ‘trio’ contributing towards the development, growth and benefit of each other.


    Blockchain technology enables the peer-to-peer transaction of the physical and
    digital asset without the involvement of any intermediaries or central authority.
    Initially, it was developed to support the cryptocurrency – Bitcoin – as the mode
    of financial transactions. But it is quite amazing to know that various software
    programs were implemented to support the responsibilities of the central authority
    such as verification, validation and consensus. The purpose was to remove the
    intermediaries in any form altogether, and the transactions of value must get
    executed on the network seamlessly. Later, the computational elements were added
    to the blockchain platform, which opened up the plethora of innovations beyond
    just the currency transactions.


    ## What Is Blockchain?


    Enables peer-to-peer transaction in a decentralized network while establishing
    trust among unknown peer and recording the transaction in the immutable distributed
    ledger.


    It is a long journey for all of us to move away from the centralized authority
    and embrace the decentralized platform without disturbing the overall outcome.
    Let us try to understand the scenarios for the centralized and decentralized ways
    of performing the transaction for a particular item.


    ### Scenario: Purchase of an Item Using a Credit Card


    #### Centralized System


    Taking into account the centralized network to accomplish the complete transactions,
    let us first enumerate what all intermediaries would facilitate the transactions
    in part or whole.


    *   Credit card agency

    *   Customer''s bank

    *   Credit card''s bank

    *   Exchange

    *   Merchant''s bank

    *   Merchant


    All the above intermediaries need to verify and validate the transaction to complete
    the purchasing of the item. Consider the same scenario where the item is to be
    bought over the e-commerce site, which involves five different vendors for the
    delivery of the item. Damn! Such a complicated interaction of the intermediaries.
    It does not just top up the cost by involving the transaction fee but also triggers
    delays (more in case the transaction requires the cross-border processing).


    #### Decentralized System


    The decentralized system provides an underlying infrastructure to support peer-to-peer
    transactions. The role of the intermediaries is substituted by the software components
    to push them towards the periphery with their peers. There is no desirable requirement
    for the peers to be known to each other to complete the transaction. Moreover,
    they can be anywhere, and their physical location does not hamper the transaction.
    Such kind of transaction becomes possible in the system when it materializes the
    trust among the peers by establishing the process of verification, validation
    and confirmation of the transaction considering the consensus.


    > **Note:** In a blockchain network, the transactions are created into the distributed
    ledger of blocks. These blocks are added as an immutable record to the chain of
    blocks once the confirmation is achieved.


    In the blockchain business network, the distributed ledger is replicated and shared
    among the network peer participants. Whenever a new transaction happens, the updated
    blockchain is available once a new block is approved and added to the blockchain
    (Kraft, 2016). The peer replication provides the ability for the peer to act as
    both the publisher and the subscriber for the transaction. Each participant represents
    a node in the peer network, and the data and transactions are synchronized in
    the system. Since the efforts required to validate the transactions shift from
    central to peer network, the blockchain network becomes an economical and viable
    choice for the business (Buterin and Mougayar, 2016). There is no need for intermediaries
    to approve the transactions, and because of consensus mechanisms to validate the
    transactions, they become more reliable, secure and verifiable. The modus operandi
    of the transaction remains the same. For example, the participants entering into
    the transaction are the same. But the change is in the way that now the transaction
    is materialized. The transaction record is shared and available to all the participating
    parties as a single truth.


    The blockchain network typically showcases the following characteristics (Tuesta
    et al., 2015; Buterin and Mougayar, 2016):


    **Consensus:** The transaction is the fundamental unit in the system, and to approve
    the transaction, the peer participant in the network should validate it. There
    exist several consensus mechanisms by which the peers validate the transaction.


    **Provenance:** It helps in identifying the origin of the assets and how the ownership
    has changed over time. The users can get to know the details of the ownership
    of the assets before they freeze the transactions of interest.


    **Immutability:** Once the transaction is recorded on the blockchain, it cannot
    be altered in any form. Thus, it achieves the immutable nature. Even if a transaction
    results into an error, it cannot be modified, and a new transaction must be recorded
    to correct the thing. Both the transaction record exists in the blockchain network
    at all the time.


    **Finality:** A single truth about the ownership or the origin of the asset or
    the details about the transaction is available through the shared ledger. There
    exist no multiple versions of the transactions or information associated with
    the asset.


    It is easy to establish trust through the blockchain network. It supports cryptographic
    proof and consensus-based mechanisms to record the transactions. The peer participating
    community is responsible for authenticating, verifying and validating the transactions,
    and thus, central authorities like government or regulatory bodies are not required
    anymore to perform such operations. Blockchain network achieves trust through
    the following (Lemieux, 2016; Lewis, 2015):


    **Independency:** The ledger holding the single truth of the transactions is replicated
    and shared among the peer participating network. Any sole authority or party does
    not own such distribution. The continued existence of the blockchain is not dependent
    on central authority and is not prone to a single point of failure.


    **Auditable:** The transactions are time-stamped and ordered and can be accessed
    in the near real time. It becomes easy to audit the transaction trail over the
    blockchain network. Everyone has access to the data.


    **Consensus:** To record the transaction as a valid state, all the relevant peer
    participants in the network must agree on the same. The onus of approving the
    transaction remains on the peer participation and gets executed based on the consensus
    mechanisms.


    **Orchestration:** The blockchain network can redefine and reengineer the business
    processes. Moreover, by including the smart contracts into the network, the end-to-end
    process becomes economical and sustainable.

