- raw: 'Blockchain holds the potential for the business. It is not required to utilize
    only public blockchain for the business. Blockchain for a business can be private,
    permissioned where participants are known to each other and there is no need for
    the cryptocurrencies for establishing the transactions. Moreover, a certain level
    of authority is distributed to the participants. The network needs to maintain
    shared ledger. The shared ledger is accessible to the participants in the permissioned
    network, but only those transactions are visible to the participants to which
    they are authorized to view. The permissioned blockchain imposes a certain level
    of control over the blockchain network. For example, it can put up the constraint
    such as to record the transaction of a particular section of the participant,
    say auditor, must approve the transaction.


    Blockchain as a Technology Disrupter


    The exponential increase of the data due to the advent of the social media platforms
    poses many challenges – data provenance, privacy, security to the business and
    society. People on the one side worried about their identity leaks, privacy concerns,
    but on the other hand, not reluctant to open up their data on the social media
    platforms. Businesses have by far trying hard with a variety of tools and techniques
    to manage the complexity of the social ties. As technology progresses and human
    society utilizes more devices to connect (Internet of Things), the complexity
    of both the interaction and data for managing it efficiently will only increase.
    The blockchain technology seems to follow similar trends as mentioned by Geroski
    in his book *The Evolution of New Markets*. Blockchain adoption is influenced
    by:


    *   early movers to develop and offer solutions


    *   astonishing products that sweep out the existing and competing for products


    *   slow market development leading to dip and then technology uptake to establish
    the market


    The advocates and enthusiasts of the blockchain map its growth similar to other
    technologies such as mobile phones, personal computers, etc. Nonetheless, it is
    characterized by the ‘slow growth’ towards the ‘waiting phase’ followed by an
    explosive ‘take-off’ phase and finally pacing to ‘leveling-off’ phase. The participants
    and the players taking the blockchain roadmap (Froystad & Holm, 2015) on the lines
    of the innovation adoption cycle to innovate and penetrate the market can be classified
    as innovators (Bitcoin), early adopters (other cryptocurrencies), early majority
    (IBM, Softbank, consultancies, system integration providers, consortiums). The
    blockchain technology is yet to be embraced by the late majority and laggards.


    Blockchain helps in alleviating following market frictions (Chanal & Caron-Fasan,
    2008; Chesbrough, 2010):


    **Information frictions:** Typically, in a transaction, the information details
    are incomplete or not shared at the same level as the participating parties. Moreover,
    the information due to its complex nature of storing, processing and sharing sometimes
    becomes unavailable or inaccessible. The risks of information damage and privacy
    result in poor decisions, delayed processes and damage to brand reputations. The
    distributed shared ledger helps in removing the information friction, and at all
    time the single version of the truth required for the transaction is available
    to all the participating parties.


    **Interaction frictions:** The interaction frictions become complex when there
    exist more interaction points among the parties. It happens either due to the
    presence of the degree of the separation or the complex process of the transaction.
    The blockchain network results in removing the unwanted interaction points due
    to the distribution of the trust and consensus mechanism. The smart contracts
    eliminate the delays in the business process as the automatic execution of the
    process can be embedded into the blockchain network using the smart contracts.


    Blockchain Structure


    The essential element of the Bitcoin blockchain is the transaction. The transactions
    are broadcasted in the network. Later, they are validated by their peers in the
    participating network. Many transactions are combined to form the blocks, and
    many blocks linked through the immutable link form the blockchain. The addition
    of a new block is not straightforward, preferably it has to follow a pre-defined
    process. Each block that is added to the blockchain must be agreed based on the
    underlying consensus mechanism. The peer nodes execute the validation and consensus
    process known as miners. The miners are nothing but the high computational nodes
    running the software to perform computation desirable to achieve consensus and
    validation.


    ### Unspent Transaction Output


    At any given point of time, the state of the Bitcoin blockchain can be obtained
    collectively by the unspent transaction outputs (UTXOs). The UTXOs are present
    at both the places, first as the input to the transaction and then the output
    to the transaction. These UTXOs are stored by the participating nodes in the databases.
    For a given transaction, following UTXO details are generated:


    *   Unique identifier of the transaction that created the UTXO


    *   Reference of this UTXO in the transaction''s output list


    *   Value of the transaction


    *   An optional condition under which the output can be spent


    The transaction includes:


    *   Reference number of the current transaction


    *   Reference(s) to one or more input UTXOs


    *   Reference(s) to one or more output UTXOs


    *   The total input and output amount


    Operations in the decentralized network are the responsibility of the peer participants
    and their respective computational and storage nodes. Some typical operations
    are:


    *   Validation of transactions


    *   Gathering transactions


    *   Broadcasting the transactions and blocks


    *   Consensus on block transactions


    *   Chaining blocks


    There exist two major roles for the participants:


    *   Initiate the transactions


    *   Mine the transactions and add the transaction into the block and integrate
    with the exiting blockchain. Such participants are responsible for verifying transactions,
    broadcast transactions, compete to create a block, validate block by consensus,
    broadcast new block, confirm transactions. Each such participant is incentivized
    to manage the blockchain. All miners carry an independent task to verify the transactions.


    Consensus ensures the integrity of the chain. Different consensus protocols are
    used for guaranteeing consensus in the blockchain. When participants are anonymous,
    then the validation becomes expensive. In such case, consensus mechanism like
    proof of work is utilized, which means every participating node is challenged
    to solve a particular computational problem. The node that solves the puzzle broadcasts
    the transaction block, and once verified by the peer participants for its validity
    and authenticity, it is integrated or chained in the blockchain network.


    The blockchain network achieves privacy and confidentiality (Christidis & Devetsikiotis,
    2016). Privacy is the right to protect the data, attributes, assets for observation
    by the unintended and unconsented party. Confidentiality of the data ensures that
    only authorized entities have access to the data. Both privacy and confidentiality
    are essential aspects to the blockchain. The Bitcoin blockchain is the public
    blockchain, and thus we can see the transactions happening on the Bitcoin blockchain.
    The platforms like Hyperledger and Ethereum are permissioned blockchains. They
    limit access of the blockchain to the select entities or participants of the blockchain.
    It is possible to achieve confidentiality and privacy through such platforms.
    Operation rights such as data read, write and update are controlled and administered.
    Some blockchain platforms like Multichain require that the transacting nodes be
    on the permissioned list.


