  trans: '


    用户知晓他人可用性的范围和程度。这也意味着受众对社交用户的位置、地位或可用性感兴趣。现在，这具有三大关键优势：首先，受众有兴趣获取社交影响者的实时动态；其次，他们希望参与缩小现实世界与虚拟世界之间的鸿沟；第三，某人出现的真正重要性在于获取品牌建设、连接性和人际关系方面的收益。社交媒体平台正提供极具前景的工具、功能和选项，用于在该语境下创建、建立和管理亲密性、真实性和即时性。组织必须意识到，社交媒体形象是由社交用户在关系媒介上的积极且充满活力的参与所驱动的。高影响力的对话是改进且活跃的社交形象的结果。


    > **注意：** 考虑到现实形象与虚拟形象之间平衡的社交形象管理至关重要，因此需要一种能提供此类平衡组合的解决方案。


    ## 声誉


    声誉是用户知晓他人（包括他们自己）的社会地位以及社交媒体平台上内容的范围和程度。从根本上说，声誉与信任相关联，由于技术基础设施在设计上并不支持信任因素，“机械土耳其人”成为社交媒体网站用来聚合社交媒体用户可信度的方式。例如，Guy
    Kawasaki 在 Twitter 上的 292,000 名粉丝，基于他在专业领域的推文，揭示了技术专家的声誉。同样，LinkedIn 通过背书和推荐来促进声誉的建立。获得影响者背书和推荐的人，其可信度显著增加的机会要大得多。然而，社交媒体声誉不仅关乎人，也关乎他们的内容，各种社交媒体网站采用不同的机制来执行声誉建立。例如，YouTube
    通过“点赞”或“#观看数”的投票机制来建立/破坏内容的声誉。目前，社交媒体平台在奖励贡献者及其相关声誉方面存在缺失。大多数中心化治理的社交媒体平台分走了内容利润的大头，这基于广告和推广的收入模式。


    > **注意：** 考虑到内容声誉与人员声誉之间平衡的社交媒体声誉管理至关重要，因此需要一种能提供此类平衡组合的解决方案。


    ## 群组


    Danbar 在研究工作中指出，由于认知极限的存在，人们为了维持关系中的社会稳定性，最多只能维持 150 个社交联系。然而，考虑到社区形成和构建的方式，社交媒体平台的成员数量已远远超出这一规模。建立群组的目的多种多样：人们参与群组是为了贡献知识库，或者他们可以成为观察者。社交媒体平台在促进群组活动方面越灵活，对社交媒体社区构成的脆弱性就越大。然而，对内容共享和访问的特定控制和偏好设置，为群组管理铺平了道路。建立群组的直接含义是管控聚焦任务和活动，而间接影响则比较复杂，例如，它可能导致认知智能和集体智能的产生，进而可用于开发新的任务和活动。


    > **注意：** 考虑到直接含义与间接影响之间平衡的社交媒体群组管理至关重要，因此需要一种能提供此类平衡组合的解决方案。


    ## 对话


    对话是用户相互沟通并建立对话的范围和程度。通常，社交媒体平台促进个人与群组之间的对话。这些对话采取各种形式，企业需要了解哪种类型的对话能给他们的业务带来收益，或有助于建立品牌、推广服务和解决方案。对话的原因多种多样，因此，有意义的对话对于维持参与讨论的受众的注意力跨度至关重要。例如，Twitter
    处理短消息，粉丝完全没有义务回复“推文”。组织必须将其视为一个对话平台，而非身份平台。一项研究（McCarthy 等人，2010）主张了对话速度对企业绩效的影响。企业需要识别对话的速度和主题，这些对企业声誉产生有利或不利的影响。


    此外，试图驱动、参与和主导“操纵性对话”既有风险又有益处。一切取决于让社交受众参与此类对话的正确时机。例如，联合利华在 2004 年的 Dove 宣传活动期间，开启了“操纵性对话”。参与者感到受到重视，并更多地谈论产品和活动。


    > **注意：** 考虑到直接对话与间接对话之间平衡的社交媒体对话管理至关重要，因此需要一种能提供此类平衡组合的解决方案。


    ## 协作


    协作是用户通过交换、分发和接收内容进行协作的范围和程度。Engeström (2005) 主张，“社会性”关乎中介社交参与者之间联系的对象的使用。因此，使用正确的对象和协议来管理这些对象以建立协作至关重要。不同社交媒体平台的社会性对象各不相同。例如，LinkedIn
    使用职业，Flickr 使用照片作为社会性对象。在缺乏社会性对象的情况下，关系可能依然存在，但有意义的对话和协作可能会消失，因此，社交媒体平台必须提供工具、功能和选项，用于在语境中创建、建立和管理项目、目标、任务上的合作伙伴关系。此类社交平台应便于识别用于协作的有用社会性对象。


    > **注意：** 考虑到直接与间接社会性对象使用之间平衡的社交媒体协作管理至关重要，因此需要一种能提供此类平衡组合的解决方案。


    ## 集体智能


