  trans: '


    # 新闻业与社交媒体挑战


    新闻业因假新闻的存在而面临巨大动荡。每个人都能轻松地向覆盖面更广的社交媒体贡献信息。新闻类社交媒体竭尽全力确保受众关注媒体内容。但不知为何，它在确保信息来源和可靠性方面却有所欠缺。社交娱乐行业也未能幸免于社交媒体的影响。


    ## 数字出版转型


    数字出版行业通过其提供的价值主张实现了转型，引入了去中介化并吸纳了一批新参与者（Garci-Agreda, 2013; Wikström & Ellonen,
    2012）。然而，创建和发布内容的核心角色依然保持不变。内容如今如何分发给大众并被他们消费，取决于社交媒体平台的潜在用途（Enders, Hungenberg,
    Denker, & Mauch, 2008; Frow, Nenonen, Payne, & Storbacka, 2015）。这有助于建立一个引人入胜的平台，因为受众可以参与讨论并成为创作过程的一部分。诸如
    `Flipboard`、`Medium` 等多个社交媒体平台应运而生，它们运营着兴趣社区，并拥有强大的社交影响力。


    用户生成内容是用户参与度的驱动力（Kaplan & Haenlein, 2010）。许多社交企业正在开发社交工具和框架以便利用户。媒体内容生成、获取和处理等功能，以及分发和变现内容的能力，均十分突出。


    ## 中心化焦点与挑战


    当前的社交媒体平台具有“中心化焦点”，并提供内容分发和共享渠道。此外，内容的管理和控制权因此掌握在中心化机构手中。该机构策划并整合需传递给社交网络参与者的相关内容。这一过程帮助机构洞察用户对特定内容的意图和偏好，并据此利用适当策略处理和利用用户生成内容。可以认为，“中心化焦点”是建立优质内容市场（面向目标广告主）以促进机构收入增长的主要焦点。此类社交媒体平台的中心化面临诸多挑战（Lehmkuhl
    & Jung, 2013; Okada & Yamamoto, 2011）：


    *   无法控制信息的流向和结构

    *   个性化推荐不精准

    *   隐私和伦理管控过度宽松

    *   与虚假信息和假新闻相关的信任问题日益严重


    ## 增强型内容分发模型


    通过引入考虑物联网重大影响的增强型内容分发模型，可以克服典型的中心化焦点。通过整合 AR/VR 环境，利用数字干预引入感官知觉，刺激了包容性环境的发展（Csik,
    2015; Spaulding, 2010; Wang & Zhang, 2012）。当下一代社交媒体模型支持社交用户环境中的动态现实世界社交互动时，这并非遥不可及的目标。


    如今，许多数字原住民和数字移民以不同方式使用社交媒体。同样，面向这两类人群的社交媒体企业也有独立的参与策略。在此环境下，组织正在通过将社交网络与动态现实世界相融合，打造创意画像以培育社交网络。我们可以发现，不仅需要与人进行更具现实包容性的互动，还需要与他们的环境互动。3D
    技术与 AR/VR 的显著贡献将驱动更个人化、更深度的互动。因此，社交媒体平台将支持机器间通信，在理解人类行为和管理社区方面发挥主动作用。在动态环境中释放社交网络的用户信息，将带来更个性化和精准的营销。


    ## 民主化与信息过载


    由于移动设备的普及，数字新闻的分发和消费现已实现民主化。社交网络规模激增，晋升为新闻消费平台，尽管这仅意味着新一代用户现在可以轻松浏览并与呈现给他们的信息层进行交互。此外，由于信息过载这一额外维度的影响，相关信息不太可能被展示给他们。此外，整合多个社交媒体站点以推送信息的网状特性，使整体交互平台变得更加复杂。用户面临社交媒体平台的若干挑战，预计采用新技术的新商业模式将克服这些挑战（Dorri
    et al., 2016; He et al., 2015; Lewis, 2015）：


    *   **真实性**：信息过载引发了信息真实性的关键问题。有时难以识别数据的有效来源和完整性。社交用户倾向于快速传递信息，这遵循滚雪球效应，导致难以追溯实际来源。

    *   **偏见**：中心化社交媒体随时间形成其特定的法规、伦理和编辑政策，从而有意或无意地对信息施加特定偏见。中心化驱动的密集控制更侧重于社交网络中显性的偏见存在。这种偏见导致对新闻信息的不同解读。


    ## 中心化风险与数据变现


    社交媒体应用大多以中心化方式运营。但切勿将中心化与安全混为一谈。大多数平台易受信息泄露、身份盗窃、安全漏洞、审查、黑客攻击等问题困扰。Facebook 近期的信息泄露事件便是此类问题的例证。超过
    8700 万人的个人信息被泄露，并被用于在上届美国总统大选中推广少数候选人。大多数在社交媒体平台上生成的客户数据被用于广告收入。平台充当广告主的中介。它帮助向客户投放定向广告以产生收入。内容质量在疏导流量方面也起着关键作用。不应为了牟取流量而牺牲内容质量，因为这并不直接关联内容价值。用户通过贡献知识语料库来充实社交媒体平台，却未获得奖励和激励。此外，他们现在意识到自己的数据被服务提供商用于牟利，而他们并未分得一杯羹。


    在某些情况下，少数社交媒体平台增加了功能，向为数据做贡献的社交用户分享一小部分收益。这些用户通常在社区中具有影响力，从而在内容上聚集巨大流量。用户间价值分配不当引发了社交社区的不满。


    ## 信息验证与宣传


    呈现在社交网络用户面前的信息是压缩形式的，用户没有足够的时间和技能来核实和验证信息的真实性。大规模信息的采纳容易引发紊乱的情绪和感受，这在绝对意义上是不可避免的。某些宣传活动故意通过分享歪曲信息，在用户社区中煽动特定情绪。尽管控制此类宣传似乎是一项复杂的工作，但社交企业必须寻找途径，应对这种难以对付的宣传执行方式。


    # 区块链


    '
