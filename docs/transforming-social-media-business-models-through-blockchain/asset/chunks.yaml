- raw: 'Indorse is a professionals platform based on the emerging blockchain-powered
    social network platform covering tokenization and decentralization. It was founded
    in the year 2017 and is based in Singapore. Indorse was founded in 2017. The Indorse
    platform is promoting the professionals to share professional skills on the platform
    and get validated by the peer participating network. Doing so have dual benefits:
    first, for each endorsement the professionals get incentivized, and second, the
    professional stake gets increased and visible in the community. The Indorse community
    envisions the future where the members will build their professional profile and
    get benefits from their reputation.


    #### Platform Model


    Indorse give back the ownership of the data to the contributors. The in-platform
    token system incentivized the honest contributions while for every wrong indorsements
    the contributors are penalized. The Indorse utilized the Ethereum platform as
    the compute engine, and for the storage, it uses Inter Planetary File System (IPFS).
    Each platform users participates in two roles:


    *   Claimant


    Responsible for making a ‘claim’ about a particular skill and thus initiates the
    ‘claim’ transaction into the Indorse platform. The claimant also needs to submit
    the proof of evidence or information to support the claim. Once the ‘claim’ and
    the associated data are available on the peer network platform, the moderator
    chooses the work on the claims and either Indorse it or flag it.


    *   Moderator


    A moderator is responsible for approving or flagging the claims raised by the
    claimant. An Indorse score based on the proof of stake is utilized where claimant
    and moderator stake his/her reputation on the claims or indorsement.


    The platforms support the following third-party DApps:


    *   Indorse DE: It facilitates the members to deploy profiles and content on the
    platform.


    *   Attores Certificate Issuance (CI) Platform: It is a certificate issuance module,
    which can map the certificate with the smart contract on the platform.


    *   IPFS: it is decentralized storage, and most of the documents, claims, information
    are going to be stored on the IPFS.


    *   uPort: It is a self-sovereign identity system to facilitate people to identify
    and authenticate themselves.


    *   Truffle: Module to support Ethereum smart contracts.


    *   Spectrum: It is a wallet which can be used by both the users and the developers.


    *   Status: It is an open-source messaging platform and mobile interface and facilitates
    interaction with the decentralized applications.


    #### Use Case


    Let us understand the use case scenario for the functioning of the Indorse platform.
    Consider Nick joins the Indorse platform for the first time. So he gets the minimum
    eligible Indorse tokens on the platform. Further, he creates his profile on the
    platform and raises several claims about his skills. For every skills claim, he
    shares proof of information or evidence. The Indorse platform randomly chooses
    the moderator, say John, to verify the claims and then claim enters the gestation
    period. John checks the claims based on the proof of information and Indorse Nick.
    The gestation period ends, and consensus about the verification is achieved. Both
    Nick and John get the rewards in terms of SCR tokens, which can be utilized to
    avail the services over the Indorse platform. Moreover, the Indorse score and
    reputation are increased for both Nick and John.


    The claimant has two options for the skills indorsement. The selection is based
    on the Anonymous Indorsement protocol. Firstly, through the random process chosen
    by the platform, and second, where a claimant can choose the particular moderator
    by giving SCR tokens to the platforms. The tokenization model adopted by the platform
    provides two types of tokens: tradeable (IND token) and internal accounting token
    (SCR token). The SCR tokens are not exchangeable tokens and never leave the platform.
    The IND tokens are the source to contribute to the revenue model. For example,
    the advertising space can be bought by using IND tokens. The advertiser needs
    to purchase the IND tokens through the exchange. Moreover, the human resource
    and talent acquisition service will be enabled only through the use of tradeable
    tokens.


    The indorse platform resolves the issues for ‘Know Your Customer’ aspect by associating
    identity, profile and achievements of an individual to an Ethereum address in
    a decentralized manner. Further, a step forward in the prediction market they
    can acquire the data from the professionals to predict on the feasibility and
    capability of the future professional skills.


    | Solution || Indorse |


    | --- | --- |


    | Founded || 2017 |


    | --- | --- |


    | Core team || Seven members |


    | Client || Enterprise |


    | Market dimensions || Growing |


    | Competitors || Few |


    | Enabling infrastructure || Ethereum |


    | Partners || Different levels of partnership |


    | Use case || KYC, advertising, identity, and professional skills claims |


    ### Everipedia


    It is a platform to support and facilitate the contributions from anyone, anywhere
    in the world. The purpose is to develop a decentralized, distributed knowledge-sharing
    platform. Each contributor can participate and contribute to what they know and
    value to the participating network. It was founded in the year 2014. The blockchain-based
    platform replicates the contributory information over thousands of nodes in the
    participating system, and thus, the information becomes accessible to most of
    the world. Even few players if attempt to block certain nodes to avoid information
    access, due to the inherent nature of the blockchain, the information can be accessed
    via other nodes of the network until the complete blockchain is blocked, and theoretically
    that is not possible. Over the centralized Wikipedia, the Everipedia supports
    the mission of universal information as a peer-to-peer resource.


    #### Platform Model


    The platform supports the peer-to-peer information base, and thus, it provides
    uninterrupted information access to the participating network. It also means that
    the information website is accessible and effectively becomes uncensorable. Everipedia
    is built on EOS. The participant needs to hold and stake EOS to perform the edit
    or vote transaction. The EOS represents the computing resources (RAM and bandwidth)
    and provides the ability to own the shares in the platform that supports the Everipedia
    network. The platform supports the tokenization model and distributes the token
    ‘IQ’ to the contributors. The token system promises to engage more contributors
    in the collective effort to create the world''s largest encyclopedia. The platform
    aims at developing the universal knowledge base where the participants can read,
    participate and contribute to the articles that interest them. Initially, the
    platform has imported all the articles from Wikipedia. The contributor can access
    the platform through Scatter and can participate in the approval and rejection
    of the proposed edits.


    Contributors are provided with the IQ tokens for participating in the Everipedia
    network. The contributors are incentivized to create and maintain content on the
    platform. Each contributor performs a few tasks to claim the tokens:


    *   Edit the content


    *   Add the content


    *   Create the articles


    *   Vote on proposed edits


    The contributors can view the activity feed of the platform to look at the activity
    log for all the suggested edits. It contains two parts:


    *   Latest edits: activity edit proposals that show on the top of the activity
    log.


    *   Expiring soon: lists those activity edit proposals those are expiring soon
    to vote.'
