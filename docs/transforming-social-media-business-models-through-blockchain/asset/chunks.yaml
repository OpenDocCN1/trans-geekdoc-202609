    ### Reputation


    Reputation is the scope and extent to which users are aware of the social standing
    of others, including themselves, and the content on the social media platforms.
    Reputation at the fundamental is associated with trust, and since the technological
    infrastructure does not by design support the trust factors, the ‘mechanical Turks’
    are the way used by the social media sites to aggregate trustworthiness of the
    social media users. For example, Guy Kawasaki''s 292,000 followers on Twitter
    reveal the reputation of technical experts based on his tweets on the professional
    spheres. Similarly, LinkedIn facilitates reputation established by means of endorsement
    and recommendation. A person endorsed and recommended by the influencer has a
    significantly higher chance of increased trustworthiness. However, the social
    media reputation is not about just the people but to their content as well as
    different mechanisms are being employed by various social media sites to execute
    reputation establishment. For example, YouTube facilitates voting mechanisms through
    ‘likes’ or ‘#views’ to develop/destroy the reputation of the content. Currently,
    social media platforms lack in rewarding the contributors and their associated
    reputations. Mostly, the centralized governed social media platforms eat the bigger
    pie of the content profits, considering the revenue model of the advertisements
    and promotions.


    Note: Social media reputation management considering the balance between content
    and people reputation is crucial, and thus a solution promising such balance mix
    is required.


    ### Groups


    Danbar in the research work identified that due to the presence of the cognitive
    limit, people are restricted to a maximum 150 to have social stability in the
    relationships. However, social media platforms have outgrown to huge membership
    number considering the way that the communities are formed and structured. The
    purpose of establishing groups is manifold: people participate in the group to
    contribute to the knowledge corpora, or they can become the observer. The more
    flexible is the social media platforms in facilitating the group activities, the
    more vulnerability it poses on the social media community. However, specific controls
    and preferences on the content share and access pave the way for managing the
    groups. Direct implications of establishing groups are to govern the focus tasks
    and activities while the indirect effects are complicated, for example, it might
    lead to the cognitive and collective intelligence which can further be used to
    develop new tasks and activities.


    Note: Social media group management considering the balance between direct and
    indirect implications is crucial, and thus a solution promising such balance mix
    is required.


    ### Conversation


    Conversation is the scope and extent to which users can communicate with each
    other and establish a conversation. Typically, social media platforms facilitate
    conversation among individuals and groups. These conversations take all forms,
    and firms need to understand the type of conversation that could bring benefits
    to their business or help in establishing brands or promoting services and solutions.
    The reasons for the conversations are enormous, and thus, the meaningful conversations
    are essential to maintain the attention span of the audience participating in
    the discussion. For example, Twitter handles short messages, and followers are
    not at all obligated to respond to the messages ‘Tweets’. The organization must
    see it as a conversation platform rather than the identity platform. A research
    study (McCarthy et al., 2010) has advocated the implications of the conversational
    velocity on the firm''s performance. The firm''s needs to identify the speed and
    topic of the conversation, contributing favourably or unfavourably to the firm''s
    reputation.


    Moreover, attempting to drive, participate and lead the ‘manipulative conversation’
    is both risky and beneficial. It all depends on the right time of involving the
    social audience to be part of such a conversation. For example, Unilever, during
    its Dove Campaign in the year 2004, opened the ‘manipulative conversation’. The
    participants felt involved and conversed more about the product and campaign.


    Note: Social media conversation management considering the balance between a direct
    and indirect conversation is crucial, and thus a solution promising such balance
    mix is required.


    ### Collaboration


    Collaboration is the scope and extent to which users can collaborate by exchanging,
    distributing and receiving content. Engeström (2005) advocated that ‘sociality’
    is all about the usage of objects that mediates the ties between the social participants.
    Thus, the usage of the right objects and protocols to manage those to establish
    collaboration is crucial. Sociality objects are different for different social
    media platforms. For example, LinkedIn uses career, Flickr uses photos as sociality
    objects. In the absence of the sociality objects, the relationships might exist,
    but the meaningful conversation and collaboration might disappear, and thus, the
    social media platforms must provide tools, features and options for creating,
    establishing and managing partnerships on projects, goals, tasks within the context.
    Such social platforms should facilitate to identify useful sociality objects for
    collaborations.


    Note: Social media collaboration management considering the balance between direct
    and indirect sociality objects usage is crucial, and thus a solution promising
    such balance mix is required.


