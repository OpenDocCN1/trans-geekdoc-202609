    # 表 4.3. 映射 – 社交媒体区块链（SMBs）、赋能要素、价值驱动因素和基础模块


    | SMBs | 赋能要素 | 价值驱动因素 | 基础模块 |

    | --- | --- | --- | --- |

    | SMB 1.0 | 去中心化验证与共识 | 交易成本 | 身份 |

    | SMB 2.0 | 智能合约 | 非原生、增值服务 | 身份、声誉、群组 |

    | SMB 3.0 | 去中心化应用、流程、资源、存储和计算 | 组织范围与边界 | 状态、协作、对话 |

    | SMB 4.0 | 去中心化自动化智能与人工智能 | 自主决策 | 集体智能 |


    当社交媒体企业不从广告中获取收入时，可被用于广告目的。例如，音乐人和乐队可以宣传他们的创意作品，社交企业可成为创意艺术家的市场。智能合约可自动执行，以在每首歌曲播放或每件音乐售出时自动分配金额。SMB
    还可通过集成 dApp 相结合，为社交用户提供统一空间。例如，社交媒体平台可允许参与者将他们正在观看的电影分享给他们的 Skype 联系人。而对于每一次被接受并观看的分享，参与者均可获得经济奖励。


    ## 5. 基于区块链的社交媒体企业


    区块链为社交媒体企业提供了绝佳机会，通过融入包容性与集体增长来转型其商业模式。读者将在本章中有机会探索影响社交社区和业务的潜在商业用例。同时，也涵盖了新兴的基于区块链的社交企业，以了解其在新时代社交媒体业务中的战略优势和商业模式。


    ### 简介


    在本章中，我们将调查若干案例研究，展示区块链在新兴社交媒体企业中的实施情况。此外，我们将探讨并讨论技术在推动社交媒体业务成功方面的作用。然而，社交媒体企业拥抱区块链仍处于起步阶段。因此，用例仍在发展中。选择新兴社交媒体企业作为研究对象的根本理由有二。首先，是为了描述前几章已涵盖的基于区块链的社交媒体企业的特征与解决方案。其次，大多数新兴基于区块链的社交媒体企业已进入市场，从而展示了该技术在重新定义社交媒体平台方面的潜力。每个商业用例均辅以相关社交媒体企业的简要描述，重点突出该应用或软件的主要特征。此外，还涵盖了与关键利益相关者及产品背后动机相关的信息。同时，也讨论了上市时间和用户感知指标，以衡量所提解决方案的可行性。


    ### 区块链实战用例


    区块链正在重塑社交媒体企业，存在若干潜在用例以缓解传统社交媒体应用的风险与局限。


    *   **用户不再是产品：** 社交媒体平台向客户提供服务，以便通过收集客户数据并将其共享给潜在广告商来建立营收帝国。此外，定向广告行业依此类账户蓬勃发展，变现收益归作为中介的服务提供商所有。区块链的去中心化特性赋能社交用户掌握其数据和贡献的所有权；因此，他们不再是产品，而可成为收益的一部分。`Sapien`
    和 `Killi` 等区块链社交媒体组织正在解决这一问题。`Sapien` 向所有参与并为其网络做出贡献的用户提供控制权、访问权和所有权。`Killi` 为社交用户的贡献提供补偿。在这两种情况下，用户不再被视为产品；相反，他们为社交经济做出贡献。


    *   **有效的内容控制：** 利用数据操纵社交用户情绪并不罕见，已有多起此类事件被记录在案。此类事件的一个潜在诱因是对数据利用的唯一掌控权，因为社交用户数据可被中央管理机构访问。有了区块链，没有单一实体能够左右内容，使得网络上的操纵性内容易于消除。得益于网络固有的去中心化特性，社交网络上的内容将得到更有效的控制。`DTube`
    等组织正在解决这一问题。它是一个基于 `STEEM` 区块链的去中心化视频分发平台。其目的是消除中央权威，减少对内容分发的控制。`STEEM` 是一个去中心化的、基于区块链的公共内容系统。它通过基于奖励机制推广社交互动来支持社区建设。平台奖励做出优质贡献的社区参与者。`STEEM`
    是一种流通货币，可在交易所买卖。


    *   **安全性提升：** 社交媒体平台可不遗余力地触达并侵入社交互动，以管控社交用户行为。针对 `Facebook` 未经明确许可访问社交用户数据的指控屡见不鲜。此外，社交网络上安全性不足的通信渠道引发了许多潜在的数据泄露和身份盗窃问题。区块链技术为消息或通信的交换提供了便捷且稳健的安全层。`SoMee`
    等组织正朝此方向努力，以提供安全的社交通信网络。它是一个基于去中心化区块链的平台，可对用户数据进行加密保护。


    *   **拓展与保护言论自由：** 在表达的民主文化中，控制言论和表达的技术霸权在一定程度上不利于社会发展。曾多次尝试封锁和控制对社交媒体网站的访问。尽管主流网站承诺加密通信消息以避免身份问题，但由于消息附带元数据，它们仍具可识别性。区块链为这一问题提供了有效解决方案，因为元数据不与单一身份绑定，而是分布在网络中，从而提供真正的匿名性。`Civil`
    等组织将其解决方案建立在去中心化区块链网络之上。它支持言论自由，并为小型媒体和记者提供服务。`Civil` 社区治理 `Civil` 注册表。社区成员批准新闻室加入
    Civil 社区。`Civil` 代币可用于对任何新闻室提出质疑。


    '
