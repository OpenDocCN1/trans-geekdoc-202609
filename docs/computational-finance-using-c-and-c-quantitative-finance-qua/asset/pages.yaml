- pgno: 13
  md: '# 1 Overview of financial derivatives


    A financial derivative is a contract between two counterparties (here referred
    to as A and B) which derives its value from the state of underlying financial
    quantities. We can further derivatives into those that carry a future obligation
    and those that don''t. In the financial world a derivative which gives the owner
    the right but not the obligation to participate in a given financial contract
    is called an option. We will now illustrate this using both a Foreign Exchange
    Forward contract and a Foreign Exchange option.


    # Foreign Exchange Forward—a contract with an obligation


    In a Foreign Exchange Forward contract a certain amount of foreign currency will
    be bought (or sold) at a future date using a prearranged foreign exchange rate.


    For instance, counterparty A may own a Foreign Exchange Forward which, in one
    year''s time, contractually obliges A to purchase from B the sum of $200 for £100.
    At the end of one year several things may have happened.


    +   - The value of the pound may have decreased with respect to the dollar

    - The value of the pound may have increased with respect to the dollar

    - Counterparty B may refuse to honor the contract—B may have gone bust, etc.

    - Counterparty A may refuse to honor the contract—A may have gone bust, etc.


    We will now consider events (i)–(iv) from A''s perspective.

    Firstly, if (i) occurs then A will be able to obtain $200 for the current market
    rate, say £120. In this case $200 can be bought for £100 and immediately sold
    for £120, giving a profit of £20. This profit can only be realized if B honors
    the contract—that is, event (iii) does not happen.

    Secondly, if (ii) occurs then A is obliged to purchase $200 for more than the
    current market rate, say £90. In this case $200 are bought for £100 but could
    have been bought for £90, giving a loss of £10.

    The probability of events (iii) and (iv) occur are related to the Credit Risk
    associated with counterparty B. The value of the contract is not affected by (iv),
    although A may be sued if both (ii) and (iv) occur. Counterparty A should only
    be concerned with the possibility of events (i) and (iv) occurring—that is, the
    probability that the contract is a positive amount in one year'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'and the probability B will honor the contract (which is one minus the probability
    that event (iii) will happen).


    From B''s point of view the important Credit Risk is when both (ii) and (iv) occur—that
    is, when the contract has positive value but counterparty A defaults.


    # Foreign Exchange option—a contract without obligation


    A Foreign Exchange option is similar to the Foreign Exchange Forward, the difference
    between that if event (ii) occurs then A is not obliged to buy dollars at an unfavorable
    exchange rate. To have this flexibility A needs to buy a Foreign Exchange option
    from B, which here can be regarded as insurance against unexpected exchange fluctuations.


    For instance, A may own a Foreign Exchange option which, in one year, contractually
    allows A to purchase from B the sum of $200 for £100. As before, at the end of
    one year the following may have happened:


    +   (i) The value of the pound may have decreased with respect to the dollar

    (ii) The value of the pound may have increased with respect to the dollar

    (iii) Counterparty B may refuse to honor the contract—B may have gone bust, etc.

    (iv) Counterparty A may have gone bust, etc.


    We will now consider events (i)-(iv) from A''s perspective.


    Firstly, if (i) occurs then A will be able to obtain $200 for less than the current
    market rate, say £120. In this case the $200 can be bought for £100 and then immediately
    for £120, giving a profit of £20. However, this profit can only be realized if
    B honors the contract—that is, event (iii) does not happen.


    Secondly, if (ii) occurs then A will decide not to purchase $200 for more the
    current market rate; in this case the option is worthless.


    We can see that A is still concerned with the Credit Risk when events (i) and
    (iii) occur simultaneously.


    The Credit Risk from counterparty B''s point of view is different. B has sold
    to A a Foreign Exchange option, which matures in one year, and has already received
    the money—the current price for the option. Counterparty B has no Credit Risk
    associated with A. This is because if event (iv) occurs, and A goes bust, it doesn''t
    matter to B since the money for the option has already been received. On the other
    hand, if event (iii) occurs B may be sued by A B still has no Credit Risk associated
    with A.


    This book considers the valuation of financial derivatives that carry options
    and financial options.


    Chapters 1–7 deal with both the theory of stochastic processes and the pricing
    of financial instruments. In Chapter 8 this information is applied to a C# portfolio
    value. The application is easy to use (the portfolios and current market rates
    are defined in text files) and can also be extended to include new trade types.'
  merge: -1
  img_proc: true
