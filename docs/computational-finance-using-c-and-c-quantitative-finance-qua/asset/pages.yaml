    \ with volatility:\n\n```\n$$\\mathcal{V} = \\frac{\\partial f}{\\partial\\sigma}$\n\
    ```\n\nIn a binomial lattice $\\mathcal{V}$ cannot be computed directly. A simple\
    \ approach is to use two binomial latices as follows:\n\n```\n$$\\mathcal{V} =\
    \ \\frac{f_{\\sigma+\\Delta\\sigma} - f_{\\sigma}}{\\Delta\\sigma}$\n```\n\nwhere\
    \ $f_{\\sigma+\\Delta\\sigma}$ is the option value computed using a binomial lattice\
    \ with volatility $\\sigma+\\Delta\\sigma$, and $f_{\\sigma}$ is the option value\
    \ computed using another binomial lattice with a volatility of $\\sigma$; all\
    \ other lattice parameters remain constant.\n\nThe implied volatility of American\
