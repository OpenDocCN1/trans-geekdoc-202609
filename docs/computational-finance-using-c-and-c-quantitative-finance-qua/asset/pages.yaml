  md: 'Generation of random variates


    It can then be seen that the diagonal elements of $B^T B$ are


    ```

    $$(B^T B)_{i,i} = \sum_{k=1}^n (x_{i,k})^2 = 1$$

    ```


    The Cholesky decomposition can be formed by setting the angles of the upper triangular
    elements of $B^T$ to zero, and this results in


    ```

    $$L^T = \begin{pmatrix} 1 & 0 & 0 & \dots \ \cos(\theta_{2,1}) & \sin(\theta_{2,1})
    & 0 & \dots \ \cos(\theta_{3,1}) & \sin(\theta_{3,1})\cos(\theta_{3,2}) & \sin(\theta_{3,2})
    & \dots \ \vdots & \vdots & \vdots & \ddots \end{pmatrix} $$

    ```


    ```

    $$L_{1,1}^T = 1$$

    ```


    ```

    $$L_{i,1}^T = \cos(\theta_{i,1})$$

    ```


    ```

    $$L_{i,j}^T = \cos(\theta_{i,j}) \prod_{k=1}^{j-1} \sin(\theta_{i,k}), \quad j
    = 2, \dots, i-1,$$

    ```


    ```

    $$L_{i,i}^T = \prod_{k=1}^{i-1} \sin(\theta_{i,k}), \quad i > 1,$$

    ```


    ```

    $$L_{i,j}^T = 0, \quad j = i+1, \dots, n$$

    ```


    We want to find the positive definite matrix $C^*$ that minimizes $||C_r - C^*||$.
    This can be found by writing


    ```

    $$C^* = L^T L$$

    ```


    and numerical optimization to determine the appropriate $n(n-1)/2$ angles. An
    initial approximation can be obtained by computing the Cholesky factorization
    $\hat{C}_r = L^T L$ and then calculating the angles corresponding to each nonzero
    element of $\hat{L}^T$.


    # Covariance matrix


    We will now consider the case when a covariance matrix $C$ is supplied which is
    not positive definite—that is, there is no Cholesky decomposition $C = L^T L$,
    where $L$ is lower triangular.


    In these instances, since a covariance matrix does not require unit diagonal elements,
    it is possible to repair $C$ using:


    ```

    $$C^+ = VK(VK)^T$$

    ```


    where $V$ and $K$ have the same meanings as before. A better approximation could
    be obtained via numerical optimization of the elements of the Cholesky decomposition.
    However, these optimal points are no longer constrained to lie on the $n$-dimensional
    unit hypersphere.'
