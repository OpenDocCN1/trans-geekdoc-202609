    Code example 8.4 C code showing the addition of USD currency market data to the
    CurrencyTable dictionary.


    It is straightforward to add currency data to CurrencyTable. The C# code fragment
    shown in Excerpt 8.4 illustrates the addition of USD information.

    The information in the CurrencyTable is accessed by the deal classes and used
    to compute discount factors, forward rates and FX spots. In the market data (see
    Excerpt 8.2) the YieldCurve is a set of time/value pairs and is defined using
    the following syntax:

    YieldCurve = {(t₁, r₁), ..., (tᵢ, rᵢ), ..., (tn, rn)}, where $t_i$ is the time
    in years, and $r_i$ is the corresponding zero coupon bond rate with tenor $t_i$.

    The value, at $t=0$, of a zero coupon bond with cash flow amount at $t_i$, is
    $\exp(-r_i * t_i)$, and is known as the discount factor $DF(0, t_i)$. Code excerpt
    8.4 shows the addition of two items to the USD yield curve, Code excerpt 8.5 illustrates
    the retrieval of $DF(0, t_i)$, of $r_i$. The code fragment:


    ```

    double discount_fac = DF(0, Time_To_Expiry);

    RiskFreeRate = -Math.Log(discount_fac) / Time_To_Expiry;

    ```


    computes the zero coupon rate RiskFreeRate and can be used as a value for the
    risk free rate required by the option routines in AnalyticsLib.dll. It should
    be mentioned that it would have been more efficient to write code to directly
    obtain the interpolated risk free rate from the USD yield curve (without first
    computing the associated discount factor). However, the required code can be supplied
    by the reader.

    Discount factors and rates are accessed from an ICurve object. The discount factor
    is accessed as follows:


    ```

    ICCurve DF = MarketDataDictionaries.

    CurrencyTable[CurrencyTable_].YieldCurve;

    ```'
