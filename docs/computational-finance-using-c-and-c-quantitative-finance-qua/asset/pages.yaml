    # 5.4.4 The log transformation and uniform grids


    Up to this point we have been dealing with the Black–Scholes equation, which is:


    ```

    $$\frac{\partial f}{\partial t} + (r-q)\frac{\partial f}{\partial S} + \frac{\sigma^2}{2}\frac{\partial^2
    f}{\partial S^2} = rf$$

    ```


    However, if we introduce the change of variable $Z = \log S$, we obtain the following
    equation:


    ```

    $$\frac{\partial f}{\partial t} + b\frac{\partial f}{\partial Z} + \frac{\sigma^2}{2}\frac{\partial^2
    f}{\partial Z^2} = rf$$

    ```


    where $b = r - q - \sigma^2/2$. This form of the Black–Scholes equation has beneficial
    numerical properties—see Appendix F.'
