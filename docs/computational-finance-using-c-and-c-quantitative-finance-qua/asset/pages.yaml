    It should be noted that the main advantage of type E1 deal entries is not just
    that the portfolio definition is smaller—it also ensures consistent market data
    values are used to price all the trades in the portfolio. When E2 deal entries
    are used, it is necessary to ensure that all the extra deals are attributed as
    new market data becomes available. This would be a time-consuming task, and if
    only a partial update occurs, could give rise to invalid deals caused by inconsistent
    deal attributes such as FXCurrency, DividendYield.


