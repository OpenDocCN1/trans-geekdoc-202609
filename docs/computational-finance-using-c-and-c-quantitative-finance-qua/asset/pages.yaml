    Substituting for $f(X > B)$ we have $c_{do} = I_A + I_B$ where:


    ```

    $I_A = \frac{\exp(-r\tau)}{\sigma\sqrt{2\pi}} \int_{\log(E/S)}^{\infty} \{exp(X)
    - E\}$

    \times exp\(-\{X - (r - q - \sigma^2/2)\tau)^2 / 2\sigma^2\tau\right)dX

