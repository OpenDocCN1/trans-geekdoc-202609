  md: "# Simply compounded spot rate\n\nWhen simple compounding is used $\\Delta I(t,\
    \ T) = L(t, T)(T - t)$, where $L(t, T)$ is the simply compounded spot rate between\
    \ time $t$ and $T$. Thus,\n\n```\n$DF(t, T) = \\{1 + L(t, T)(T - t)\\} = 1$\n\
    ```\n\nand so the simply compounded rate:\n\n```\n$L(t, T) = \\frac{1}{T - t}\
    \ \\left\\ \\frac{1}{DF(t, T)} \\right\\}$  (7.2.4)\n```\n\n# 7.2.1 Forward rate\
    \ agreement\n\nA Forward Rate Agreement (FRA) is a contract between two counterparties\
    \ (referred here as $A$ and $B$), in which one counterparty (say $A$) agrees to\
    \ pay interest at the (variable) spot rate, while the other agrees to pay at a\
    \ fixed rate. The agreement start at time $T_s$ and end at the maturity $T_m$,\
    \ at which the counterparties settle the amount that is owed. If $P$ is the principal,\
    \ then at time $T_m$, the contract has the following value to:\n\n```\n$V(T_m)\
    \ = P\\{(T_m - T_s)K - L(T_s, T_m)(T_m - T_s)\\}$  (7.2.5)\n```\n\nwhere $K$ is\
    \ the agreed fixed rate, and $L(T_s, T_m)$ is the simply compounded rate between\
    \ times $T_s$ and $T_m$. From Eq.(7.2.4) we have:\n\n```\n$L(T_s, T_m) = \\frac{1}{T_m\
    \ - T_s} \\left\\ \\ \\frac{1}{DF(T_s, T_m)} \\right\\}$\n```\n\nso\n\n```\n$V(T_m)\
    \ = P\\{(T_m - T_s)K - \\left\\ \\frac{1}{DF(T_s, T_m)} \\right\\ \\right\\}$\
    \  (7.2.6)\n```\n\nThe value of the FRA to A at time $t \\le T_m$ is therefore\
    \ $FRA(t) = DF(t, T_m)V(T_m)$ which means that\n\n```\n$FRA(t) = DF(t, T_m)P\\\
    {(T_m - T_s)K - \\left\\ \\frac{1}{DF(T_s, T_m)} \\right\\ \\right\\}$  (7.2.7)\n\
    ```\n\nUsing $DF(t, T_m) = DF(t, T_s)DF(T_s, T_m)$ we can rewrite Eq.(7.2.7) as\n\
    \n```\n$FRA(t) = DF(t, T_s)P\\{(T_m - T_s)K - \\left\\ \\frac{1}{DF(T_s, T_m)}\
    \ \\right\\ \\right\\}$  (7.2.8)\n```\n\nThe value of $K$ that sets $FRA(t)$ to\
    \ zero is the time $t$ forward forward rate between times $T_s$ and $T_m$, and\
    \ it is denoted by $F(t, T_s, T_m)$. From Eq.(7.2.9)\n\n```\n$F(t, T_s, T_m) =\
    \ \\frac{1}{T_m - T_s} \\left\\ \\ \\frac{DF(t, T_s)}{DF(T_s, T_m)} \\right\\\
    }$  (7.2.9)\n```\n\nCombining Eqs.(7.2.8) and (7.2.10) we can express the value\
    \ of the FRA as:\n\n```\n$FRA(t) = DF(t, T_m)P\\tau\\{K - F(t, T_s, T_s + \\tau)\\\
    }$  (7.2.10)\n```\n\nwhere $\tau = T_m - T_s$ is known as the tenor of the FRA,\
    \ and $T_s$ is the reset time for forward rate $F(t, T_s, T_s + \tau)$."
  merge: -1
