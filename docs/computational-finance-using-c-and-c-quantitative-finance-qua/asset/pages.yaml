    important applications in the pricing of financial derivatives. Here the function
    $\phi(S,t)$ is taken as the price of a financial derivative, $f(S,t)$, that depends
    on the value of an underlying asset $S$, which is assumed to follow GBM. In Chapter
    4 we use Eq. (2.3.3) to derive the process followed by $\phi = \log(S_t)$. We
