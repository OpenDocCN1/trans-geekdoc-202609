    dsl1 = s[M-2]-s[M];\nd2 = v[1];\nd3 = s[M]-s[M-2];\nh = 0.5*d2;\ngreeks[5] = (dd1/dsl1)/(dv2/dt);\n\
    /* assign the value of theta */\ngreeks[2] = (v[1]-v[5])/(2.0*dt); /* can also\
    \ write write:greeks[2] = (v[1]-v[5]) /_\\n(2.0*dt); */\n```\n\nCode example 5.11\
    \ Function to compute the value of an American option using a standard binomial\
    \ lattice.\n\n# 5.3.3 Binomial lattice with a control variate\n\nThe control variate\
    \ technique is used to enhance the accuracy that a standard binomial lattice gives\
    \ for the value of an American vanilla option. It involves using the same standard\
    \ binomial lattice to value both an American option and the equivalent European\
    \ option. The Black–Scholes formula is if we assume that the error in pricing\
    \ the European option is the same as for the American option, we can achieve an\
    \ improved estimate for the value of the American option.\n\nWhen applied to the\
    \ valuation of an American put option this can be expressed as follows:\n\n> European\
    \ pricing error, $\\Delta_E = p^{BS}(S, E, \\tau) - p^L(S, E, \\tau)$\nAmerican\
    \ pricing error, $\\Delta_A = P^*(S, E, \\tau) - P^L(S, E, \\tau)$\n\nwhere $S$\
    \ is the current value of the asset, $E$ is the strike price, and $\\tau$ is the\
    \ maturity of the option. $p^{BS}(S, E, \\tau)$ is the Black-Scholes Values of\
    \ the European put option, $p^L(S, E, \\tau)$ is the binomial lattice estimate\
    \ of the European put option, $P^*(S, E, \\tau)$ is the (unknown) accurate value\
    \ of the American put option, and $P^L(S, E, \\tau)$ is the binomial lattice estimate\
    \ of the American put option.\n\nLet $\\Delta_A = \\Delta_E$ then we have:\n\n\
    > $p^{BS}(S, E, \\tau) - p^L(S, E, \\tau) = P^*(S, E, \\tau) - P^L(S, E, \\tau)$\n\
    \nwhich on rearrangement yields:\n\n> $P^*(S, E, \\tau) = p^{BS}(S, E, \\tau)\
    \ - p^L(S, E, \\tau) + P^L(S, E, \\tau)$\n\nWe use $P^*(S, E, \\tau)$ as the improved,\
    \ control variate estimate for the value of the American put option. Of course,\
    \ exactly the same approach can be used to obtain an improved estimate for the\
    \ value of an American call."
