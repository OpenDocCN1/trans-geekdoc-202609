  md: "We will now consider the situation when $\\epsilon_t$ either jumps up or down\
    \ by an amount $\nu = \\sigma\\sqrt{\\Delta t}$. For an up jump:\n\n```\n$\\log\\\
    left(\\frac{S_{t+\\Delta t}}{S_t}\right) = \\sigma\\sqrt{\\Delta t}$\n```\n\n\
    and therefore $S_{t+\\Delta t} = S_t \\exp(\\sigma\\sqrt{\\Delta t})$.\nWhile\
    \ a down jump we have\n\n```\n$\\log\\left(\\frac{S_{t+\\Delta t}}{S_t}\right)\
    \ = -\\sigma\\sqrt{\\Delta t}$\n```\n\nand therefore $S_{t+\\Delta t} = S_t \\\
    exp(-\\sigma\\sqrt{\\Delta t})$.\nThe reader will notice that these expressions\
    \ are the same as those for the CCR rate of Chapter 5. For an up jump $S_{t+\\\
    Delta t} = S_t u$, for a down jump $S_{t+\\Delta t} = S_t d$, and $u = 1/d = \\\
    exp(\\sigma\\sqrt{\\Delta t})$.\nThe probability of undergoing either an up or\
    \ down jump can be found by matching the mean and variance of $\\epsilon_t$.\n\
    From the:\n\n```\n$E[\\epsilon_t] = \nu(p_u - p_d) = \\mu\\Delta t$ (6.4.1)\n\
    ```\n\nand the variance:\n\n```\n$Var[\\epsilon_t] = \nu^2(p_u + p_d) = \\sigma^2\\\
    Delta t$ (6.4.2)\n```\n\nSo combining Eqs. (6.4.1) and (6.4.2) we obtain:\n$\\\
    mu\\Delta t + \\sigma^2\\Delta t = 2\nu^2p_u$\n\nso\n\n```\n$p_u = \\frac{1}{2}\\\
    left(\\frac{\\sigma^2\\Delta t}{\nu^2} + \\frac{\\mu\\Delta t}{\nu}\right)$\n\
    ```\n\nSubstituting $\nu = \\sigma\\sqrt{\\Delta t}$ we obtain:\n\n```\n$p_u =\
    \ \\frac{1}{2}\\left(1 + \\frac{\\mu\\sqrt{\\Delta t}}{\\sigma}\right)$ (6.4.3)\n\
    ```\n\nand using the fact that $p_d = 1 - p_u$ gives:\n\n```\n$p_d = \\frac{1}{2}\\\
    left(1 - \\frac{\\mu\\sqrt{\\Delta t}}{\\sigma}\right)$ (6.4.4)\n```\n\nWe shall\
    \ now show that this is equivalent to the Cox-Rubinstein–Ross binomial model.\n\
    For the CRR model (Chapter 5, Eq. (5.3.19)) we have:\n\n```\n$p_u = \\frac{\\\
    exp(r\\Delta t) - d}{u - d}$\n```\n\nexpanding $\\exp(r\\Delta t)$, $u$ and $d$\
    \ to order $\\Delta t$ we obtain:"
