  md: 'The Black-Scholes formula for the value of a European call including continuous
    dividends is:


    ```

    $c(S, E, \tau) = S\exp(-q\tau)N_1(d_1) - E\exp(-r\tau)N_1(d_2) \quad (4.4.55)

    ```


    and the corresponding formula for a put can be used (using call parity) to be:


    ```

    $p(S, E, \tau) = -S\exp(-q\tau)N_1(-d_1) + E\exp(-r\tau)N_1(-d_2) \quad (4.4.56)

    ```


    or equivalently, using $N_1(-x) = 1 - N_1(x)$, we have


    ```

    $p(S, E, \tau) = E\exp(-r\tau)[1 - N_1(d_2)]\n- S\exp(-q\tau)\{1 - N_1(d_1)\}
    \quad (4.4.57)

    ```


    where


    ```

    $d_1 = \frac{\log(S/E) + (r - q + \sigma^2/2)\tau}{\sigma\sqrt{\tau}}, \quad d_2
    = \frac{\log(S/E) + (r - q - \sigma^2/2)\tau}{\sigma\sqrt{\tau}}$

    ```


    Thus put/call options with continuous dividends can be priced using Eqs. (4.4.47)
    and (4.4.50) but with $S$ replaced by $S\exp(-q\tau)$.


    These formulae also be re-expressed in terms of the current equity forward price
    with maturity $T$, $S(t,T)$, as follows:


    ```

    $c_t = \exp(-r(T-t))\{S(t,T)N_1(d_1) - EN_1(d_2)\} \quad (4.4.58)

    ```


    ```

    $p_t = \exp(-r(T-t))\{-S(t,T)N_1(-d_1) + EN_1(-d_2)\} \quad (4.4.59)

    ```


    where we have used theshort notation $p_t$ and $c_t$ to denote the current (time)
    value of put and call; the current equity forward price with maturity $T$ is


    ```

    $S(t,T) = S\exp((r-q)(T-t)), \quad t \le T,$

    ```


    and


    ```

    $d_1 = \frac{\log(S(t,T)/E) + (\sigma^2/2)(T-t)}{\sigma\sqrt{T-t}}, \quad d_2
    = \frac{\log(S(t,T)/E) - (\sigma^2/2)(T-t)}{\sigma\sqrt{T-t}}$

    ```


    The inclusion of discrete dividends


    Here we consider discrete cash dividends $D_{t_i,i} = 1, \dots, n$, at times $t_i,i
    = 1, \dots, n$, during the life of the option. In these circumstances the Black-Scholes
    formula can be used to price European options, but with the current asset value
    $S$ reduced by the present value of the cash dividends.


    This means that instead of $S$ we use the quantity $S_D$ which is computed as


    ```

    $S_D = S - \sum_{i=1}^n D_i\exp(-rt_i)$

    ```'
