    \exp\left(-\frac{\{X-(r-q-\sigma^2/2)\tau\}-2\log(B/S)}{\sigma^2\tau}\right)\n=
    \exp\left(-\frac{\{X-(r-q-\sigma^2/2)\tau\}-4\log(B/S)\tau}{\sigma^2\tau}\right)
    \quad (B.1.3)$

