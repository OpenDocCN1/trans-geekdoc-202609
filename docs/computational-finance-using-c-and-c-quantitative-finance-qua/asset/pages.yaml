    \ file and reads a portfolio configuration file to determine which portfolios\
    \ are to be valued. Valuation proceeds for all the deals contained in the portfolio\
    \ files and the results are written to the appropriate portfolio results.\n\n\
    The project DealLibrary.csproj is concerned with the valuation of the available\
    \ trades. A separate C# class, derived from a single abstract class BaseDeal,\
    \ is provided for each trade type. The BaseDeal class provides abstract methods\
    \ such as Price() and Validate(), need to be implemented in deal classes. We will\
    \ be primarily concerned with the method Price(), which is used to return the\
    \ current value of a trade. Deal valuation may either be performed completely\
    \ in C# code or calling appropriate C routines in the Analytics_MathLib dynamic\
    \ library—this contains C pricing functions discussed in previous sections of\
    \ the book and also utilities (such as random generators),\n\nCode 8.2 provides\
