    change options and, in the real-world probability measure $\mathbb{P}$, they are:


    ```

    $dB^f = r^f dB^f$\ndX^f = X_d^f \mu dt + X_d^f \sigma dW^P, \quad dW^P \sim N(0,
    dt)\ndB^f = r^d dB^d$  (7.3.5)

    ```


    Where $X_d^f$ is the value of one unit of foreign currency in domestic currency,
    where money grows at the (constant) risk free rate $r^d$, $B^f$ is the foreign
    money account where money grows at the (constant) risk free rate $r^f$, and $\sigma$
    is the volatility of $X_d^f$. From a domestic point of view there are only two
    assets—the money market account $B^d$, and the value of the foreign market account
    in domestic currency, $B^f X_d^f$.


    From Ito''s rule in Chapter 2, using Eq. (2.6.3) with $X_1 = X_d^f$ and $X_2 =
    B^d$, we have:


    ```

    $d(X_d^f/B^d) = X_d^f(r^f + \mu)dt + X_d^f \sigma dW^P$

    ```


    We now consider $B^d$ as the numaire and obtain the process for $B^f X_d^f/B^d$
    using the Ito rule given in Chapter 2. Substituting $X_1 = B^f X_d^f$ and $X_2
    = B^d$ in Eq. (2.6.8) we obtain:


    ```

    $d(X_d^f/B^d) = \frac{B^f X_d^f}{B^d}[(r^f - r + \mu)dt] + \frac{B^f X_d^f}{B^d}
    \sigma dW^P$

    ```


    If we choose the probability measure $Q$ such that:


    ```

    $dW^P = dW^Q - \frac{(r^f - r + \mu)}{\sigma}dt$  (7.3.6)

    ```


    then $(B^f X_d^f/B^d)$ is a martingale since


    ```

    $d(\frac{B^f X_d^f}{B^d}) = \frac{B^f X_d^f}{B^d} \sigma dW^Q$

    ```


    Substituting for $dW^P$ in Eq. (7.3.5) yields:


    ```

    $dX_d^f = X_d^f \mu dt + X_d^f \{dW^Q - \frac{(r^f - r^d + \mu)}{\sigma}\}\nX_d^f
    = X_d^f \mu dt - X_d^f(r^f - r^d + \mu)dt + X_d^f \sigma dW^Q$

    ```


    so


    ```

    $dX_d^f = X_d^f(r^d - r^f)dt + X_d^f \sigma dW^Q$  (7.3.7)

    ```


    It can be seen that Eq.(7.3.7) is identical to Eq. (4.4.53) if using the following
    mapping:


    ```

    $S \rightarrow X_d^f, \quad r \rightarrow r^d, \quad q \rightarrow r^f$  (7.3.8)

    ```


    This means that the above mapping allows us to price European FX puts and calls
    with the Black-Scholes formulae given in Eqs. (4.4.55) and (4.4.56).'
