    where $\mu$ is the constant drift and the diffusion of the other symbols is as
    before. Let us now consider a portfolio consisting of $-1$ derivative and $\frac{\partial
    f}{\partial S}$ units of the asset. In other words we go *short* (that is sold)
    a derivative of an asset and have $\frac{\partial f}{\partial S}$ stocks of the
    (same) underlying asset. The value of the portfolio, $\Pi$, is therefore:


    ```

    $$\Pi = -f+\frac{\partial f}{\partial S}$.$\nn(4.4.3)

    ```


    and the change, $\Delta\Pi$, in the value of the portfolio over $\Delta t$ is:


    ```

    $$\Delta\Pi = -\Delta f+\frac{\partial f}{\partial S}\Delta S$.$\n(4.4.4)

    ```


