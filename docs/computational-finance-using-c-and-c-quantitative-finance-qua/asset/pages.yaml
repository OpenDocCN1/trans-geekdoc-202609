- pgno: 126
  md: '# 5.3 Lattice methods for vanilla options


    # 5.3.1 Binomial lattice


    In this section we will derive equations for a binomial lattice that describes
    the GBM movement of asset price changes. The approach that we will adopt is based
    on the work of Cox, Ross, and Rubinstein (1979) and will be referred to as the
    CRR lattice.


    From Chapter 2, Eq. (2.3.9), we know that if the price of an asset, $S_t$, follows
    GBM then the change in value of price over time interval $\Delta t$ has the following
    distribution:


    ```

    $\log\left(\frac{S_{t+\Delta t}}{S_t}\right) \sim N\left((r-\frac{\sigma^2}{2})\Delta
    t, \sigma^2\Delta t\right)$

    ```


    If we use the notation:


    ```

    $X = \frac{S_{t+\Delta t}}{S_t}$

    ```


    and


    ```

    $\eta = (r-\frac{\sigma^2}{2})\Delta t, \quad \nu^2 = \sigma^2\Delta t$

    ```


    the above equation becomes:


    ```

    $\log(X) \sim N(\eta, \nu^2)$

    ```


    or equivalently


    ```

    $X \sim \Lambda(\eta, \nu^2)$

    ```


    where $\Lambda(\eta, \nu^2)$ is the lognormal distribution derived from a Gaussian
    distribution with mean $\eta$ and variance $\nu^2$. It is well known—see for example
    Evans, Hastings, and Peacock (2000)—that the first two moments of a variable $X$
    drawn from a lognormal distribution are:


    Lognormal mean


    ```

    $E[X] = \exp(\eta+\frac{\nu^2}{2}) \quad (5.3.1)$

    ```


    substituting $\eta$ and $\nu^2$ gives:


    ```

    $E[X] = \exp\left((r-\frac{\sigma^2}{2})\Delta t+\frac{\sigma^2}{2}\Delta t\rightright)
    \quad (5.3.2)$

    ```'
