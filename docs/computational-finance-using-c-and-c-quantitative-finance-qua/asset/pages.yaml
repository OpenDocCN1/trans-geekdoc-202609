  md: "Now since $\\phi$ is a martingale under $Q^{k+1}$ we know that $D = 0$, and\
    \ therefore Eq. (7.2.65) results in:\n\n```\n$$(1 + F_{k+1})F_k\\mu_k \\, dt =\
    \ -\rho_{k,k+1}\\sigma_k\\sigma_{k+1}F_k F_{k+1} \\, dt$$\n```\n\nThis means the\
    \ drift is:\n\n```\n$$\\mu_k = -\\frac{\rho_{k,k+1}\\sigma_k\\sigma_{k+1}}{1 +\
    \ F_{k+1}}$ $$(7.2.66)$\n```\n\nSubstituting for $\\mu_k$ in Eq. (7.2.61) gives:\n\
    \n```\n$$dF_k = F_k\\sigma_k \\left\\{ \\frac{\rho_{k,k+1}\\sigma_k\\sigma_{k+1}F_{k+1}}{1\
    \ + F_{k+1}} \\ dt + dW^{k+1} \\right\\}$$ $$(7.2.67)$\n```\n\nComparing Eq. (7.2.67)\
    \ with Eq. (7.2.40) we have:\n\n```\n$$dW^k = -\\frac{\rho_{k,k+1}\\sigma_k\\\
    sigma_{k+1}F_{k+1}}{1 + F_{k+1}} \\, dr + dW^{k+1}$$ $$(7.2.68)$\n```\n\nwhich\
    \ is the relationship between Brownian motions $dW^k$ and $dW^{k+1}$.\n\n$i \\\
    geq k+2$\nLet the stochastic process followed by $F_k$ under $Q^{k+1}$ be:\n\n\
    ```\n$$dF_k = F_k\\mu_k \\, dt + F_k\\sigma_k \\, dW^{k+2}$$ $$(7.2.69)$\n```\n\
    \nWhere $W^k$ is Brownian motion under probability measure $Q^{k+2}$, and drift\
    \ term $\\mu_k$ is to be found.\nReplacing $k$ with $k+1$ in Eq. (7.2.68) gives:\n\
    \n```\n$$dW^{k+1} = -\\frac{\rho_{k+1,k+2}\\sigma_{k+1}\\sigma_{k+2}F_{k+2}}{1\
    \ + F_{k+2}} \\, dr + dW^{k+2}$$ $$(7.2.70)$\n```\n\nand using Eq. (7.2.70) to\
    \ substitute for $dW^{k+1}$ in Eq. (7.2.68) gives:\n\n```\n$$dW^k = -F_k\\sigma_k\
    \ \\left\\{ \\frac{\rho_{k,k+1}\\sigma_k\\sigma_{k+1}F_{k+1}}{1 + F_{k+1}} \\\
    , dt - \\frac{\rho_{k+1,k+2}\\sigma_{k+1}\\sigma_{k+2}F_{k+2}}{1 + F_{k+2}} \\\
    , dt \\right\\}$$ $$(7.2.71)$\n```\n\nSubstituting for $dW^k$ in Eq. (7.2.40)\
    \ gives:\nand thus the drift is\n\n```\n$$\\mu_k = -\\frac{\rho_{k,k+1}\\sigma_k\\\
    sigma_{k+1}F_{k+1}}{1 + F_{k+1}} - \\frac{\rho_{k+1,k+2}\\sigma_{k+1}\\sigma_{k+2}F_{k+2}}{1\
    \ + F_{k+2}}$$ $$(7.2.72)$\n```\n\nThe following general expression can be derived\
    \ in a similar manner:\n\n```\n$$dF_k = -F_k\\sigma_k \\sum_{j=k+1}^i \\frac{\r\
    ho_{k,j}\\sigma_k\\sigma_j}{1 + F_j} \\, dt + \\sigma_k F_k \\, dW^i$ $$(7.2.73)$\n\
    ```\n\nwhere all the symbols have the same means as before, but now $i$ can take\
    \ any integer value greater than $k$."
