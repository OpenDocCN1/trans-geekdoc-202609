    \times \exp\left(\frac{2\log(B/S)(X-\log(B/S))}{\sigma^2\tau}\right)$


    We will first consider $I_D$ and transform the integrand as follows:


    ```

    $-\exp\left(-\frac{\{X-(r-q-\sigma^2/2)\tau\}}{\sigma^2\tau}\right)\exp\left(\frac{2\log(B/S)(X-\log(B/S))}{\sigma^2\tau}\right)\n=
