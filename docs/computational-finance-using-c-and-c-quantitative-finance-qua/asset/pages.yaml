    # 7.4.3 Total return swap


    A Total Return Swap (TRS) is a synthetic replication of the return of a reference
    asset (bond) B. The receiver of the TRS receives the coupon payments of the reference
    asset during the life of the swap in return for making periodic payments at the
    risk-free floating rate plus an margin. In the event of default, the receiver
    makes a payment to the payer equal to the agreed initial price of the reference
    asset less the price at default, and the transaction terminates. If there is no
    default then the difference between the initial asset (bond) price $B_0$ and the
    price at maturity $B(t_m)$ is settled by the payer and the receiver, with the
    receiver paying (receiving) if the asset (bond) is less (more) at maturity. The
    maturity of the reference asset (bond) may be longer than the maturity $t_m$ of
    the swap.


    To the receiver of the reference asset coupons a TRS has value $TRS_r$, which
    is given by:


    $TRS_r = total bond return – total floating coupon payments of the swap$


    where total return = total bond fixed coupons over the duration of the TRS+increase
    in the value at maturity of the TRS–default payment, if the bond defaults over
    the duration of the TRS


    The value of $TRS_r$ at time $t$ is:


    ```

    $TRS_r(t) = \begin{cases} \C \sum_{t_j=t_1}^{t_m} DF(t_j, t_j) & fixed reference
    bond payments \ + P \frac{B(t_m) - B_0}{B_0} DF(t_m, t_m) & increase in value
    of reference bond \ - \sum_{t_j=t_1}^{t_m} Cj DF(t_j, t_j) & floating payments
    of swap at LIBOR + margin \ - P(1 - R) \sum_{t_j=t_1}^{t_m} DF(t_j, t_j) \times
    \{S(t, t_{j-1}) - S(t)\} & bond default payments \end{cases}$

    ```


    and the reference bond satisfies:


    ```

    $B(t_R) = 1$

    B(t_m) = \overline{DF}(t_m, t_R)|t + \C \sum_{t_j=t_m}^{t_R} DF(t_m, t_j)|t$

    ```'
