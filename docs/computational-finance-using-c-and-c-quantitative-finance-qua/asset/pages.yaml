    # 3.4.4 Lognormal distribution


    The multivariate lognormal distribution is important because it is the asset return
    distribution assumed by the Black-Scholes equation.


    Let the $p$-element vectors $Y$ and $X$ be related by $Y = \log(X)$ where $Y \sim
    N(\mu, \Sigma)$, $\mu$ is a $p$-element vector, and $\Sigma$ is a $p \times p$
    matrix. Then $X = \exp(Y)$ and $X$ has multivariate lognormal distribution, which
    we denote by $X \sim \Lambda(\mu, \Sigma)$. We will represent the $p$-element
    mean vector of $X$ by $\hat{m}$ and the $p \times p$ covariance matrix of $X$
    by $\mathcal{S}$.'
