  md: "# 104 Computational Finance Using C and C#\n\nwhere as usual S is the set price,\
    \ r is the continuously compounded interest rate, q is the continuously compounded\
    \ dividend, $\\sigma$ is the volatility, and time t increases from the time to\
    \ the expiry T.\n\nWe will now introduce the variable $h(t) = 1 - \\exp(-r t)$\
    \ and use the factorization $v(S, E, \tau) = h(t)g(S, E, h)$. From standard calculus\
    \ we obtain:\n\n```\n$\\frac{\\partial v}{\\partial t} = g\\frac{\\partial h}{\\\
    partial t} + h\\frac{\\partial g}{\\partial t} = rg(h-1) + h\\frac{\\partial^2\
    \ g}{\\partial h}\\frac{\\partial h}{\\partial t} = rg(h-1) + lr(h-1)\\frac{\\\
    partial g}{\\partial h}$\n```\n\nand also\n\n```\n$\\frac{\\partial v}{\\partial\
    \ S} = h\\frac{\\partial g}{\\partial S}$ and $\\frac{\\partial^2 v}{\\partial\
    \ S^2} = h\\frac{\\partial^2 g}{\\partial S^2}$\n```\n\nSubstituting these results\
    \ into Eq. (5.20) yields the transformed Black-Scholes equation:\n\n```\n$S^2\\\
    frac{\\partial^2 g}{\\partial S^2} + (r-q)Sh\\frac{\\partial g}{\\partial S} +\
    \ rg(h-1) + rh(h-1)\\frac{\\partial g}{\\partial h} = rgh$ (5.2.11)\n```\n\nwhich\
    \ can be further simplified to give:\n\n```\n$S^2\\frac{\\partial^2 g}{\\partial\
    \ S^2} + \\frac{2(r-q)S}{\\sigma^2}\\frac{\\partial g}{\\partial S} - \\frac{2rg}{h\\\
    sigma^2} - \\frac{2r(1-h)}{\\sigma^2}\\frac{\\partial g}{\\partial h} = rgh$ (5.2.12)\n\
    ```\n\nor\n\n```\n$S^2\\frac{\\partial^2 g}{\\partial S^2} + \\beta S\\frac{\\\
    partial g}{\\partial S} - \\frac{\\alpha}{h}\\frac{\\partial g}{\\partial h} -\
    \ g - (1-h)\\frac{\\alpha}{\\partial h} = 0$ (5.2.13)\n```\n\nwhere $\\alpha =\
    \ 2r/\\sigma^2$ and $\beta = 2(r-q)/\\sigma^2$.\n\nWe now consider the last term\
    \ of Eq. (5.2.13) and note that when $\tau$ is large, $1-h(t) \\sim 0$. Also when\
    \ $\tau \\to 0$ the option is close to maturity, and the value of both European\
    \ and American options converge, this means that $v(S, E, \\tau) \\sim 0$ and\
    \ $\\frac{\\partial v}{\\partial t} \\sim 0$. It can then be seen that the last\
    \ term is generally small and the Macmillan-Barone-Deese-Whaley approximation\
    \ assumes that it can be integrated. This results in the following equation:\n\
    \n```\n$S^2\\frac{\\partial^2 g}{\\partial S^2} + \\beta S\\frac{\\partial g}{\\\
