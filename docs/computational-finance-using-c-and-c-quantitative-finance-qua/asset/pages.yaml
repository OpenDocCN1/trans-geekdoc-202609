    # H.2 Proof of Eq. (H.1.2)\n\nFrom Eq. (H.1.1):\n\n$X_t = \\sigma\\sqrt{t}, Z_t\
    \ \\sim N(0, 1)$\n\nwhere $X_0 = 0$. We will derive the probability of events\
    \ $m_t^X \\leqslant b$ and $X_t \\geqslant x$ occurring. For each event $m_\t\
    au^X$ to occur there must be a time $\tau$ at which $X_\tau \\leqslant b$, where\
    \ $0 < \\tau \\leqslant t$. At time $\tau$, instead of continuing with the original\
    \ Brownian motion, we will consider the *reflected* motion $X_t^R$ defined by:\n\
    \n```\n$X_s^R = X_s, \\quad s < \\tau\\nX_s^R = 2b - X_s, \\quad s \\geqslant\
    \ \\tau$\n```\n\nTherefore, before time $\tau$ the motion $X_s$ is identical to\
    \ the event $X_s^R$. For $s \\geqslant \\tau$ the *coordinates* of $X_s^R$ are\
    \ obtained by reflecting the values of $X_s$ about the level $b$. (remember $b\
    \ \\leqslant x$). The event $X_t \\geqslant x$ is then equivalent to the event\
    \ $X_t^R \\leqslant 2b-x$ (remember $b \\leqslant 0$ and $x \\geqslant 0$). However,\
    \ the event $X_\tau^R \\leqslant 2b-x$ only occurs if $m_\tau^X \\leqslant b$\
    \ also occurs, giving:\n\n```\n$P(X_\tau^R \\leqslant 2b-x) = P(m_\tau^X \\leqslant\
    \ b, X_\tau \\leqslant x)$\n```\n\nAt time $\tau$\n\n```\n$X_\tau^R = 2b - X_\t\
    au \\quad(H.2.1)$\n```\n\nand after time $\\tau$\n\n```\n$X_{\tau+\\gamma}^R =\
    \ 2b - X_{\tau+\\gamma}, \\quad \\gamma > 0 \\quad(H.2.2)$\n```\n\nThus subtracting\
    \ Eq. (H.2.1) from Eq. (H.2.2) gives::\n\n```\n$X_{\tau+\\gamma}^R - X_\tau^R\
    \ = X_\tau - X_{\tau+\\gamma}\\nX_{\tau+\\gamma}^R - X_\tau^R = -(X_{\tau+\\gamma}\
    \ - X_\tau) \\quad(H.2.3)$\n```\n\nHowever, we know that:\n\n```\n$(X_{\tau+\\\
    gamma} - X_\tau) \\sim N(0, \\sigma^2\\gamma) \\quad(H.2.4)$\n```\n\nSo\n\n```\n\
    $(X_{\tau+\\gamma}^R - X_\tau^R) \\sim -N(0, \\sigma^2\\gamma)$\n```"
