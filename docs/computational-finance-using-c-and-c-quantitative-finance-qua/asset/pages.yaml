  md: "Other financial derivatives\n\nNow, from Eq. (7.2.35) we have:\n\n```\n$E^Q\
    \ [F(t_{k-1}, t_{k-1}, t_k)]$\n$$= E^Q \\left[ F(t_0, t_{k-1}, t_k) \\exp\\left((t-t_0)\\\
    mu_k - \\frac{(t_{k-1}-t_0)\\sigma_k^2}{2} + \\sigma_k W_{k-1}^i\right) \right]$$\n\
    $$= F(t_0, t_{k-1}, t_k) \\exp((t_{k-1}-t_0)\\mu_k)$$\n$$=times E^Q \\left[ \\\
    exp\\left(-\\frac{(t_{k-1}-t_0)\\sigma_k^2}{2} + \\sigma_k W_{k-1}^i\right) \r\
    ight]$$\n$$= F(t_0, t_{k-1}, t_k) \\exp((t_{k-1}-t_0)\\mu_k) \\quad (7.2.37)$\n\
    ```\n\nwhere, as before we have the expectation given in Appendix D.2.\nBy Expanding\
    \ Eq. (7.2.37) to first order obtain:\n\n```\n$E^Q [F(t_{k-1}, t_{k-1}, t_k)]$\n\
    $$= F(t_0, t_{k-1}, t_k) + F(t_{k-1}, t_k)(t_{k-1}-t_0)\\mu_k \\quad (7.2.38)$\n\
    ```\n\nSubstituting Eq. (7.2.38) into Eq. (7.2.36), we obtain a general expression\
    \ for the value of the coupon payment:\n\n```\n$V_{t_0} = \tau \\left\\{ F(t_0,\
    \ t_{k-1}, t_k) + F(t_0, t_k, t_k)(t_{k-1}-t_0)\\mu_k \\text{\\text{}} \right\\\
    } \\quad (7.2.39)$\n```\n\nWe will consider the cases of early and late coupon\
    \ payments.\n\n# Early coupon payment\n\nLet us consider the case when $i = k\
    \ - 1$. From Eq. (7.2.50):\n\n```\n$$\\mu_k = \\frac{\\sigma_k^2 F(t, t_{k-1},\
    \ t_k)}{1 + \tau F(t, t_{k-1}, t_k)}$\n```\n\nFirst we freeze the forward rates\
    \ in $\\mu_k$ so we obtain the following:\n\n```\n$$\\mu_k = \\frac{\\sigma_k^2\
    \ F(t, t_{k-1}, t_k)}{1 + \tau F(t, t_{k-1}, t_k)}$\n```\n\nSubstituting for $\\\
    mu_k$ in Eq. (7.2.39) we obtain:\n\n```\n$V_{t_0} = DF(t_0, t_k) \tau \\left\\\
    { F(t_0, t_{k-1}, t_k) + (t_{k-1}-t_0)\\frac{\\sigma_k^2 \tau_k F^2(t_0, t_{k-1},\
    \ t_k)}{1 + \tau F(t_0, t_{k-1}, t_k)} \\right\\}$\n```\n\n(see Brito and Mercurio,\
    \ 2001, p. 387, and Hull, 2003).\n\n# Late coupon payment\n\nWe consider the case\
    \ when $i = k + 1$. From Eq. (7.2.66):\n\n```\n$$\\mu_k = \\frac{\\rho t_{k,k+1}\\\
    sigma_k\\sigma_{k+1}F(t, t_k, t_{k+1})}{1 + \tau F(t, t_k, t_{k+1})}$\n```"
