    $S^* - E = c(S^*, E, \tau) + \frac{S^*}{\gamma^2}\{1 - \exp(-q\tau)N_1(d_1(S^*))\}$
    \quad (5.2.24)

    ```


    This equation can be solved for $S^*$ using standard iterative methods (see the
    section on the numerical solution of critical asset values). Once $S^*$ has been
    found Eq. (5.2.23) gives:


    ```

    $ha_2 = A_2S^{\gamma/2}$

    ```


    where


    ```

    $A_2 = \frac{S^*}{\\gamma^2}\{1 - \exp(-q\tau)N_1(d_1(S^*))\}$

    ```


    From Eq. (5.2.19) the value of an American call is thus of the form:


    ```

    $C(S, E, \tau) = c(S, E, \tau) + A_2\frac{S}{\\gamma^2} \quad \text{when } S <
    S^*$ \quad (5.2.25)

    ```


    # American put options


    For an American put option we proceed in a similar manner to that for the American
    call. We now use the fact that both the value and early exercise premium $(v_p(S,
    \tau) = h_p(S, E, \tau))$ of an American put tend to zero as the asset price $S
    \to \infty$. Since $\gamma^2 > 0$ the only way this can be achieved by Eq. (5.2.18)
    is if $a_2 = 0$. This gives $g_p(S, E, \tau) = a_1S^{\gamma_1}$ and the value
    of the American put is:


    ```

    $P(S, E, \tau) = p(S, E, \tau) + ha_1S^{\gamma_1}$ \quad (5.2.27)

    ```


    An expression for $a_1$ can be found by considering the critical asset price


    Continuity of the American option value at the critical asset price gives:


    ```

    $E - S^{**} = p(S^{**}, E, \tau) + ha_1S^{**\gammagamma_1}$ \quad (5.2.28)

    ```'
