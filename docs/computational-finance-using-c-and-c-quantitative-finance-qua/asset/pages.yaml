  md: '# Other financial derivatives


    where $P_i$ is the value of the principal at time $t_i$ and $P_0 = P$.

    The value of the floating leg is now computed as:


    ```

    $FLT(t) = \sum_{i=k}^n P_{i-1}DF(t, t_i)\tau_i \left{\frac{DF(t, t_{i-1})}{DF(t,
    t_i)} - 1\right\} \frac{1}{\tau_i}$

    $= \sum_{i=k}^n P_{i-1}\{DF(t, t_{i-1}) - DF(t, t_i)\}\n$= P_kDF(t, t_k) - P_kDF(t,
    t_{k+1})$

    $+ P_{k+1}DF(t, t_{k+1}) - P_{k+1}DF(t, t_{k+2}) + \dots$

    $+ P_{n-2}DF(t, t_{n-1}) - P_{n-1}DF(t, t_{n-1}) - P_{n-1}DF(t, t_n)\n P_kDF(t,
    t_k) - DF(t, t_k)(P_k - P_{k+1}) - P_{k+1}\dots$

    $- DF(t, t_{n-2})(P_{n-2} - P_{n-1}) - \sum_{i=k}^{n-1} AM_iDF(t, t_i)$

    $= P_kDF(t, t_k) - P_{n-1}DF(t, t_n) + \sum_{i=k}^{n-1} AM_iDF(t, t_i) \quad (7.2.19)$

    ```


    and so the value of the floating leg is:


    ```

    $FLT(t) = P_kDF(t, t_k) - P_{n-1}DF(t, t_n) + \sum_{i=k}^{n-1} AM_iDF(t, t_i)
    \quad (7.2.20)$

    ```


    When there is no association ($P_k = P_{n-1}$ and $AM_i = 0, i = 0, \dots, n-1$)
    then Eq. (7.2.20) reduces to Eq. (7.2.15).


    # Basis swap


    This is very similar to an interest rate swap, but now there are two floating
    legs, each with their associated principal amount.


    For example, floating leg 1 could be associated with the one month LIBOR (London
    Inter Bank Offer Rate) and have a schedule of monthly payments, while floating
    leg 2 could use the three month LIBOR rates and quarterly payments. In this case,
    the forward rates and discount factors for leg 1 would be computed using one month
    LIBOR yield curve and the forward factors for leg 2 will be computed using the
    three month LIBOR yield curve.


    We will use the subscripts 1 and 2 to denote quantities associated. The payment
    times associated with leg 1 are $t''_i, i=1, \dots, n_1$, while for leg 2 are
    $t''''_i, i=1, \dots, n_2$, and (for this example) $n_1 = 3n_2$.


    If counterparty A makes the quarterly payments (that is, receives the payments
    made on leg 1), then the time $t$ value of the basis swap is:


    ```

    $BS(t) = C_1DF(t, t_k) + FLT_1(t) - C_2DF(t, t_k) - FLT_2(t) \quad (7.2.21)$

    ```'
