    # 5.4 Grid methods for vanilla options


    # 5.4.1 Introduction


    In Section 5.3 we discussed the use of binomial lattice methods for valuing both
    European and American options. The lattice methods we have described the advantage
    that they are fairly easy to implement and can value simple options, such as vanilla
    puts and calls, reasonably accurately. The use of up and down jump probabilities
    at the lattice nodes is also an appealing feature, since they are directly to
    the stochastic process which is being modelled. However, lattice techniques have
    the following drawbacks:


    +   - They require small time steps to ensure numerical stability'
