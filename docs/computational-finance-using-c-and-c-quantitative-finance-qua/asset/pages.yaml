  md: "Freezing the forward rates we obtain:\n\n```\n$$\\mu_k = \\frac{\tau\\rho_{k,k+1}\\\
    sigma_k\\sigma_{k+1}F(t_0, t_k, t_{k+1})}{1+\tau F(t_0, t_k, t_{k+1})}$$\n```\n\
    \nSubstituting for $\\mu_k$ in Eq. (7.2.39) we obtain:\n\n```\n$V_{t_0} = DF(t_0,\
    \ t_{k+1}) \\times \\tau P \\left\\{ F(t_0, t_{k-1}, t_k) - \\frac{\\tau\\rho_{k,k+1}\\\
    sigma_k\\sigma_{k+1}F(t_0, t_{k-1}, t_k)F(t_0, t_k, t_{k+1})}{1+\tau F(t_0, t_k,\
    \ t_{k+1})} \\right\\}$\n```\n\n# 7.2.3 Timing adjust\n\nIn this section we derive\
    \ expressions for the drift of the forward rate $F(t, t_{k-1}, t_k)$ under various\
    \ probability measures. We will denote the time $t$ of a zero coupon bond with\
    \ 1 unit of currency at maturity $t$ by $DF(t)$. For convenience we will also\
    \ use the shortened notation $F_k = F(t, t_{k-1}, t_k)$ and $DF_k = DF(t, t_k)$.\n\
    \nThe probability measure under which all tradable assets are priced relative\
    \ to the bond price $DF_k$ (that is, $DF_k$ is the numeraire) will be denoted\
    \ by $\\mathbb{Q}^k$; under this probability the relative prices will be martingales.\
    \ We will also denote Brownian motion under probability measure $\\mathbb{Q}^k$\
    \ by $W^k$.\n\nCase $i = k$\n\nHere the maturity of the numeraire $DF_k$ is at\
    \ the expiry of the forward rate $F_k$. Since $(1+\\tau F_k)$ is a tradable relative\
    \ price, $(1+\\tau F_k)/DF_k$, is a martingale under $\\mathbb{Q}^k$ and thus\
    \ has zero drift. Also $DF_i(1+\\tau F_k)/DF_k = 1+\tau F_k$ and since $\tau$\
    \ and 1 are constants, $F_k$ must be a martingale under $\\mathbb{Q}^k$. Thus\
    \ the process for $F_k$ has zero drift and is:\n\n```\n$dF_k = F_k\\sigma_k dW^k$\
    \ (7.2.40)\n```\n\nFor the general case in which $i \\neq k$, the process followed\
    \ by $F_k$ is:\n\n```\n$dF_k = F_k\\mu_k dt + F_k\\sigma_k dW^i$ (7.2.41)\n```\n\
    \nwhere $\\mu_k$ is a drift that needs to be determined. Equation (7.2.41) can\
    \ then be rewritten as:\n\n```\n$dF_k = F_k\\sigma_k \\left( \\frac{\\mu_k}{\\\
    sigma_k} dt + dW^i \\right)$ (7.2.42)\n```\n\nComparing Eqs. (7.2.41) and (7.2.42)\
    \ we have:\n\n```\n$dW^k = \\frac{\\mu_k}{\\sigma_k} dt + dW^i$ (7.2.43)\n```\n\
    \nThis equation gives the relation between Brownian motions under probability\
    \ measures $\\mathbb{Q}^k$ and $\\mathbb{Q}^i$. We will now show how to compute\
    \ the value of $\\mu_k$."
