  md: "# Other financial derivatives\n\nAs $\\Delta T \rightarrow 0, H(t, T+\\Delta\
    \ T) \rightarrow h(t, T)$, where $h(t, T)$ is the continuous hazard rate between\
    \ times $t$ and $T$.\n\nWe observe that $\\Delta T \rightarrow 0$ Eq. (7.4.2)\
    \ becomes:\n\n```\n$h(t, T) = \\frac{\\partial S(t, T)}{\\partial \\Delta T} \\\
    frac{1}{S(t, T)} \\quad (7.4.3)$\n```\n\nNow Eq. (7.4.3) can be re-expressed as:\n\
    \n```\n$h(t, s) = \\frac{\\partial S(t, s)}{\\partial s} \\frac{1}{S(t, s)} =\
    \ -\\frac{\\partial \\ln(S(t, s))}{\\partial s} \\quad (7.4.4)$\n```\n\nwhere\
    \ $s > t$, and we have used:\n\n```\n$$\\frac{1}{S(t, T)} = \\frac{\\partial \\\
    ln(S(t, T))}{\\partial T}$\n```\n\nIntegrating Eq. (7.4.4) yields:\n\n```\n$\\\
    int_{s=t}^{T} h(t, s) ds = \\int_{s=t}^{T} d\\ln(S(t, s)) \\n = -{\\ln(S(t, T))\
    \ - \\ln(S(t, t))}\\\\n = -\\ln(S(t, T)) \\quad (7.4.5)$\n```\n\nwhere we used\
    \ $S(t, t) = 1$ and $\\ln(S(t, t)) = 0$.\nUsing Eq. (7.4.5) the survival probability\
