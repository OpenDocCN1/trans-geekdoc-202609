- pgno: 210
  md: '# Computational Finance Using C and C#


    and


    $$\log(S_{2,t+\Delta t}) = \log(S_{2,t}) + \varepsilon_{2,t}$


    where $\varepsilon_{1,t}$ is a random normal variable with mean $\mu_1\Delta t$
    and variance $\sigma_1^2\Delta t$, and $\varepsilon_{2,t}$ is a random normal
    variable with mean $\mu_2\Delta t$ and variance $\sigma_2^2\Delta t$.


    In the binomial lattice model, over the interval $\Delta t$, the variate $\log(S_{1,t})$
    is only allowed to jump up or down by the amount $v_1 = \sigma_1\sqrt{\Delta t}$,
    and similarly the variate $\log(S_{2,t})$ is only permitted to jump up and down
    by the amount $v_2 = \sigma_2\sqrt{\Delta t}$. We will denote the probability
    of both $\log(S_{1,t})$ and $\log(S_{2,t})$ having an up jump and $\log(S_{2,t})$
    having a down jump by $p_{ud}$, etc.


    The mean values in Eqs. (5.15) and (5.16) then give


    $E[\varepsilon_{1,t}] = v_1(p_{uu} + p_{ud} - p_{du} - p_{dd}) = \mu_1\Delta t$


    $E[\varepsilon_{2,t}] = v_2(p_{uu} + p_{ud} - p_{du} - p_{dd}) = \mu_2\Delta t$


    and the variance/covariance terms yields


    $Var[\varepsilon_{1,t}] = v_1^2(p_{uu} + p_{ud} + p_{du} + p_{dd}) = \sigma_1^2\Delta
    t$


    $Var[\varepsilon_{2,t}] = v_2^2(p_{uu} + p_{ud} + p_{du} + p_{dd}) = \sigma_2^2\Delta
    t$


    $E[\varepsilon_{1,t}\varepsilon_{2,t}] = v_1v_2(p_{uu} - p_{ud} - p_{du} - p_{dd})
    = \mu_1\sigma_2\Delta t$,


    where $\rho$ is the correlation coefficient between $\varepsilon_{1,t}$ and $\varepsilon_{2,t}$.

    We obtain:


    +   $p_{uu} + p_{ud} - p_{du} - p_{dd} = \frac{\mu_1\sqrt{\Delta t}}{\sigma_1}$

    $$p_{uu} - p_{ud} + p_{du} - p_{dd} = \frac{\mu_2\sqrt{\Delta t}}{\sigma_2}$

    $$p_{uu} + p_{ud} + p_{du} + p_{dd} = 1$$

    $$p_{uu} - p_{ud} - p_{du} + p_{dd} = \rho$


    These lead to the following jump probabilities:


    +   $p_{uu} = \frac{1}{4}\{1 + \sqrt{\Delta t}(\frac{\mu_1}{\sigma_1} + \frac{\mu_2}{\sigma_2})
    + \rho\}$

    $$$p_{ud} = \frac{1}{4}\{1 + \sqrt{\Delta t}(\frac{\mu_1}{\sigma_1} - \frac{\mu_2}{\sigma_2})
    - \rho\}$

    $$$p_{dd} = \frac{1}{4}\{1 + \sqrt{\Delta t}(-\frac{\mu_1}{\sigma_1} + \frac{\mu_2}{\sigma_2})
    + \rho\}$

    $$$p_{du} = \frac{1}{4}\{1 + \sqrt{\Delta t}(-\frac{\mu_1}{\sigma_1} - \frac{\mu_2}{\sigma_2})
    - \rho\}$


    In Code example 6.4, we provide the code for a standard binomial lattice which
    prices options on the maximum and minimum of two assets.'
