- pgno: 320
  md: 'We have:


    ```

    Cov[Z_1, Z_2] = Cov[a+b_1X_1+b_2X_2, c+dY]

    = E[(a+b_1X_1+b_2X_2)(c+dY)]

    - E[(a+b_1X_1+b_2X_2)]E[(c+dY)]

    = E[(a+b_1X_1)(c+dY)+b_2X_2(c+dY)]

    - {E[(a+b_1X_1)]E[c+dY]+E[b_2X_2]E[c+dY]\}

    = E[(a+b_1X_1)(c+dY)+E[b_2X_2(c+dY)]

    - E[(a+b_1X_1)]E[c+dY]-E[b_2X_2]E[c+dY]

    = {E[(a+b_1X_1)(c+dY)-E[a+b_1X_1]E[c+dY]}

    - {E[(b_2X_2)(c+dY)-E[b_2X_2]E[c+dY]}

    Cov[Z_1, Z_2] = b_1d Cov[X_1, Y]+b_2d Cov[X_2, Y]

    ```


    # Four variables


    Let Z_1 = a+b_1X_1+b_2X_2+b_3X_3 and Z_2 = c+dY, where a, b_1, b_2, b_3, c and
    d are constants.


    We have:


    ```

    Cov[Z_1, Z_2] = Cov[a+b_1X_1+b_2X_2+b_3X_3, c+dY]

    = E[(a+b_1X_1+b_2X_2+b_3X_3)(c+dY)]

    - E[(a+b_1X_1+b_2X_2+b_3X_3)]E[c+dY]

    = E[(a+b_1X_1+b_2X_2)(c+dY)+b_3X_3(c+dY)]

    - {E[(a+b_1X_1+b_2X_2)]E[c+dY]+E[b_3X_3]E[c+dY]}

    = E[(a+b_1X_1+b_2X_2)(c+dY)+E[b_3X_3(c+dY)]

    - {E[(a+b_1X_1+b_2X_2)]E[c+dY]-E[b_3X_3]E[c+dY]}

    = {E[(a+b_1X_1+b_2X_2)(c+dY)]}

    - E[(a+b_1X_1+b_2X_2)]E[c+dY]-E[b_3X_3]E[c+dY]

    + {E[(b_3X_3)(c+dY)]-E[b_3X_3]E[c+dY]}

    Cov[Z_1, Z_2] = b_1d Cov[X_1, Y]+b_2d Cov[X_2, Y]+b_3d Cov[X_3, Y]

    ```


    # Covariance of n variables


    In a similar manner to that outlined above:


    ```

    Cov[a+\sum_{i=1}^n b_iX_i, c+dY] = d \sum_{i=1}^n b_i Cov[X_i, Y]

    ```'
