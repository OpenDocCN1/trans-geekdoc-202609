    Methods for Pricing Financial Instruments, which contained information on pricing
    equity options using C code. The current book covers the following instrument
    types:


    +   - Equity derivatives

    - Interest rate derivatives

    - Foreign exchange derivatives

    - Credit derivatives


    There is also an extensive final chapter which demonstrates how a C-based analytics
    pricing library can be used by C# portfolio valuation software. In addition to
    this application:


    +   - illustrates the use of C# dictionaries, abstract classes and .NET InteropServices

    - permits the reader to value bespoke portfolios

    - allows market data to be specified via a configuration file

    - contains a generic basket pr for which the reader can specify the payoff function

    - can be freely downloaded by the reader.


    The current book also contains increased coverage of stochastic processes, Ito
    calculus and Monte Carlo simulation. These topics are supported by practical applications
    and solved example problems.


    In addition the Numerical Algorithms Group (NAG) has allowed readers to enjoy
