  md: "# 224                               Computational Finance Using C and C#\n\n\
    where $P$ is the principal, $K$ is the strike, $\tau = t_{k-1} - t_k$, $F^f(t_0,\
    \ t_{k-1}, t_k)$ is the foreign currency forward rate, $\\sigma_f$ is the volatility\
    \ of $F^f(t_0, t_{k-1}, t_k)$ and\n\n```\n$d_1 = \\frac{\\log(F^f(t_0, t_{k-1},\
    \ t_k)/K + (\\alpha + \\sigma_f^2/2)(t_{k-1} - t_k))}{\\sigma_f\\sqrt{t_{k-1}-t_0}}$\n\
    ```\n\n```\n$d_2 = \\frac{\\log(F^f(t_0, t_{k-1}, t_k)/K + (\\alpha - \\sigma_f^2/2)(t_{k-1}\
    \ - t_k))}{\\sigma_f\\sqrt{t_{k-1}-t_0}}$\n```\n\nWe will now derive the value\
    \ of $\\alpha$.\nFirst we define two processes $X_1(t)$ and $X_2(t)$ in such that:\n\
    \n```\n$X_1(t) = \\left(\\frac{DF^f(t, t_{k-1}) - DF^f(t, t_k)}{DF^f(t, t_k)}\\\
    right)X_d^f(t) \\quad (7.2.80)\n```\n\nand\n\n```\n$X_2(t) = \\tau X_d^f(t)\\\
    frac{DF^f(t, t_k)}{DF^f(t, t_k)} = \\tau X_d^f(t, t_k) \\quad (7.2.81)\n```\n\n\
    $X_d^f(t, t_k)$ is the forward foreign exchange rate (Section 7.3). Therefore,\n\
    \n```\n$X_1(t) = \\frac{DF^f(t, t_{k-1}) - DF^f(t, t_k)}{\\tau DF^f(t, t_k)} =\
    \ F^f(t, t_{k-1}, t_k) \\quad (7.2.82)\n```\n\nNow $X_1$ and $X_2$ are martingales\
    \ under $\\mathbb{Q}$ so we have:\n\n```\n$dX_1 = \\sigma_1 X_1 dW_1^{\\mathbb{Q}}\
    \ \\quad (7.2.83)\n```\n\nand\n\n```\n$dX_2 = \\sigma_2 X_2 dW_2^{\\mathbb{Q}}\
    \ \\quad (7.2.84)\n```\n\nEquation (7.2.84) can be expressed as\n\n```\n$d(\\\
    frac{\\tau X_d^f(t, t_k)}{\\tau X_d^f(t, t_k)}) = \\sigma_x dW_x^{\\mathbb{Q}}\
    \ \\quad (7.2.85)\n```\n\nUsing Itto we obtain:\n\n```\n$d(\\frac{X_1}{X_2}) =\
    \ \\frac{X_1}{X_2}[\\sigma_1 dW_1^{\\mathbb{Q}} - \\sigma_2 dW_2^{\\mathbb{Q}}]\
