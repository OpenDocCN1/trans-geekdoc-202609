    \ S} = a\\gamma S^{\\gamma-1}$, $\\frac{\\partial^2 g}{\\partial S^2} = a\\gamma(\\\
    gamma-1)S^{\\gamma-2} = a\\gamma^2 S^{\\gamma-2} - a\\gamma S^{\\gamma-2}$\n```\n\
    \nso\n\n```\n$S^2\\frac{\\partial^2 g}{\\partial S^2} = a\\gamma^2 S^{\\gamma}\
    \ - a\\gamma S^{\\gamma} = a\\gamma^2 g - a\\gamma g$\n```\n\nand\n\n```\n$\\\
    beta S\\frac{\\partial g}{\\partial S} = \\beta a\\gamma S^{\\gamma} = \\beta\
    \ \\gamma g = \\beta S\\gamma g$\n```"
