    # 2.10 Ornstein-Uhlenbeck process


    The Ornstein-Uhlenbeck process is often used to model interest rates because of
    its mean reverting property. It is defined by the equation


    ```

    $dX_t = -\alpha X_t dt + \sigma dW_t \quad (2.10.1)$

    ```


    Using the integrating factor $exp(\alpha t)$ we have:


    ```

    $exp(\alpha t) dX_t = -\alpha X_t exp(\alpha t) dt + \sigma exp(\alpha t) dW_t$

    ```


    so


    ```

    $exp(\alpha t) dX_t + \alpha X_t exp(\alpha t) dt = \sigma exp(\alpha t) dW_t
    \quad (2.10.2)$

    ```


    Using the Ito product rule we have:


    ```

    $d(X_t exp(\alpha t)) = exp(\alpha t) dX_t + \alpha X_t exp(\alpha t) dt \quad
    (2.10.3)$

    ```'
