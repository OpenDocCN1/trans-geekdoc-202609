  md: "# European options\n\n```\nvoid hist_vol(double *sigma, double *err, double\
    \ data[], long n, double dt, long *ifail) {\n    // Input parameters:\n    data\
    \ - the data, which consists of n asset prices\n    - the number of data points\n\
    \    dt - the (constant) time spacing between the data points (years)\n    Output\
    \ parameters:\n    sigma - the computed historical volatility\n    err - the standard\
    \ error in the volatility estimate sigma\n    iflag - an error indicator\n}\n\n\
    #define DATA(i) data(i-1)\n\ndouble mean=0.0,sum=0.0;\ndouble temp,tn;\n\nfor(i\
    \ = 2; i <= n; i++) {\n    mean += log(DATA(i))-log(DATA(i-1));\n}\nmean = mean/(double)(n-1);\n\
    \nfor(i = 2; i <= n; i++) {\n    temp = log(DATA(i))-log(DATA(i-1));\n    sum\
    \ += (temp-mean)*(temp-mean);\n}\nsigma = sqrt(sum/dt);\ntn = (double)dt*(n-1);\n\
    er = sigma/sqrt(tn);\n    return;\n}\n```\n\nCode 4.2 To compute the historical\
    \ volatility from asset data.\n\nThe estimated standard error in $\\hat{\\sigma}$\
    \ is given by\n\n> $$\\hat{\\sigma}_{std} = \\frac{1}{\\sqrt{2(n-1)}}$ (4.4.71)\n\
    \nA computer program to perform these calculations is given in Code excerpt 4.2.\n\
    \n# Implied volatility\n\nThe implied volatility of a European option is the volatility\
    \ that, when substituted into the Black-Scholes equation, yields the market value\
    \ quoted for the same option. In general the implied volatility will depend on\
    \ the time to expiry of the option and the ratio of the current asset price to\
    \ the strike—this is known as the volatility smile. These values are usually stored\
    \ in a multidimensional volatility surface, and the volatility for pricing a given\
    \ option obtained via multidimensional interpolation.\n\nThe routine provided\
    \ in Code excerpt 4.3 uses Newton's method to calculate the implied volatility\
    \ for a European option from its market price. We will illustrate this technique\
    \ for a European call with market value opt_value. The implied volatility, $\\\
    sigma$, is then that value which satisfies:\n\n$K(\\sigma) = c(S, E, \\tau, \\\
    sigma) - opt\\_value = 0$\n\nwhere $c(S, E, \\tau, \\sigma)$ represents the value\
    \ of the European call and the other symbols have their usual meaning."
