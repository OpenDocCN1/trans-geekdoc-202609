    \ if $S^1$ is a numereraire the prices of the other assets denominated in units\
    \ of $S^1$ are the relative prices $Z'_i = (S'_i/S'_1), i = 2, \\dots, n$.\n\n\
    One can find a unique probability measure $\\mathbb{Q}$ such that the relative\
    \ prices $Z'_i, i = 2, \\dots, n,$ are martingales. If the economy is free of\
    \ arbitrage opportunity every payoff pattern $H_t$ is represented as a linear\
    \ combination of the asset values $S'_i, i = 1, \\dots, n,$ and in addition the\
    \ relative price process $(H_t/S'_1)$ is a martingale.\n\nThis means we can write\n\
    \n```\n$E^{\\mathbb{Q}}\\left[\\frac{H_i}{S'_i}\right] = E^{\\mathbb{Q}}\\left[\\\
    frac{H_t}{S'_1}\right], \\quad \\text{where } 0 \\leqslant t \\leqslant T$\n```\n\
    \nThe current (time $t$) value $V_t$ of the payoff $H_t$ is thus\n\n```\n$V_t\
