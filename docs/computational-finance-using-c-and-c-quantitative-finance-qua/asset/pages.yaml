    \ method), but also on the unknown option values $f_{i,j-1}$ and $f_{i,j+1}$.\
    \ It is now necessary to solve a system of simultaneous equations in order to\
    \ compute the value $f_{i,j}$. This is therefore called an *implicit method*;\
    \ see Smith (1985).\n\nThe implicit $\\Theta_m = 0$ is also called the *fully\
    \ implicit method*, since the new unknown value $f_{i,j}$ only depends on the\
