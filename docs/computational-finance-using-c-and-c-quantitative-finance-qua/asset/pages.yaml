    \ used to obtain improved estimates for any integral (or exotic option) so long\
    \ as an accurate (closed form) solution of a similar integral is known. One common\
    \ use of the control variate method is to improve the accuracy of Monte Carlo\
    \ estimates.\n\n# 5.3.4 The Binomial lattice with BBS and BSSR\n\nHere we consider\
    \ the Binomial Black-Scholes (BBS) method and also the Binomial Black-Scholes\
    \ method with Richardson extrapolation (BSSR) (see Broadie and DeTemple (1996)).\
