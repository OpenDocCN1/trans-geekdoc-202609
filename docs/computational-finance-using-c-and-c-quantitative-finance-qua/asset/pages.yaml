  md: "where r is the riskless interest rate.\n\nNow consider an American call option,\
    \ with strike price E and expiry time T, which is taken out on this asset. At\
    \ $t_1$ there will be a ex-dividend asset price, $S^*$, over which the option\
    \ will be exercised early. This value can be found by solving the following equation:\n\
    \n```\n$$c(S^*, E, \\tau_1) = S^* + D_1 - E$ \\quad (5.2.2)$\n```\n\nwhere $c(S^*,\
    \ E, \\tau_1)$ is the Black-Scholes value of a European call option with strike\
    \ price $E$ and maturity $\tau_1 = T - t_1$, on an asset with current value $S^*$\
    \ at time $t_1$. If prior to the ex-dividend date $S_t > S^*$ the American option\
    \ will be exercised and realize a payoff of $S_{t_1} + D_1 - E$. On the other\
    \ hand if $S_{t_1} \\le S^*$ then the option is more exercised and will be held\
    \ until option maturity at time T.\n\nWe can rewrite Eq. (5.2.2) as $S^*$ is the\
    \ root of the following equation:\n\n```\n$K(S^*) = c(S^*, E, \\tau_1) - S^* -\
    \ D_1 + E = 0$ \\quad (5.2.3)$\n```\n\nwhere $K(S^*)$ denotes the function in\
    \ the single variable $S^*$. A well-known technique for solving Eq. (5.2.3) is\
    \ Newton's method, which we use in this case the:\n\n```\n$S_{i+1}^* = S_i^* -\
    \ \\frac{K(S_i^*)}{K'(S_i^*)}$ \\quad (5.2.4)$\n```\n\nwhere $S_i^*$ is the $i^{th}$\
    \ approximation to $S^*$ and $S_{i+1}^*$ is the improved $(i+1)$th approximation.\
    \ If we consider the case in Eq. (5.2.4) we have from Eq. (5.2.2) and (5.2.3)\
    \ that\n\n```\n$K(S^*) = c(S^*, E, \\tau_1) - S^* - D_1 + E$\n```\n\nand\n\n```\n\
    $K'(S^*) = \\frac{\\partial K(S_i^*)\\partial S_i^*} = \\frac{\\partial c(S_i^*,\
    \ E, \\tau_1)}{\\partial S_i^*} - 1$\n```\n\nAlso from Eq. (A.3.2) in Appendix\
    \ A.3:\n\n```\n$\\frac{\\partial c(S_i^*, E, \\tau_1)}{\\partial S_i^*} = N_1(d_1(S_i^*))$\n\
    ```\n\nwe note that the continuous dividend yield $q = 0$. So\n\n```\n$K'(S^*)\
    \ = \\frac{\\partial K(S_i^*)}{\\partial S_i^*} = N_1(d_1(S_i^*)) - 1$\n```\n\n\
    ```\n$d_1 = \\frac{\\log(S_i^*/E) + (r + \\sigma^2/2)\\tau_1}{\\sigma\\sqrt{\\\
    tau_1}}$\n```\n\nSubstituting these results into Eq. (5.2.4) gives:\n\n```\n$S_{i+1}^*\
    \ = S_i^* - \\frac{c(S^*, E, \\tau_1) - (S^* + D_1)}{N_1(d_1(S_i^*)) - 1$\n```"
