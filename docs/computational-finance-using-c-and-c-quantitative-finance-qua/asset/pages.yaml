  md: '# Appendix F: Black–Scholes finite-difference schemes


    If the eigenvalues of $T_l$ are $\lambda_k, k = 1, \dots, n_s - 2$, the eigenvalues
    of $T_l^{-1}$ are $\lambda_k^{-1}, k = 1, \dots, n_s - 2$. This means that the
    system is stable if all the eigenvalues of $T_l$ have a modulus greater than one.
    This result can be proved by considering the eigenvalues with the smallest modulus,
    $\lambda_{\min}$. If $|\lambda_{\min}| > 1$ then the result is proved.


    Now the eigenvalues of $T_l$, see Smith (1985), are given by:


    ```

    $$\lambda_k = 1 + \Delta t\left(r + \frac{\sigma^2}{2}\right) + 2\sqrt{AC} \cos\left(\frac{k\pi}{n_s
    - 2 + 1}\right) \quad (F.2.8)$

    nk = 1, \dots, n_s - 2,$

    ```


    where the term


    ```

    $2\sqrt{AC} = \sqrt{\frac{\Delta t^2(\sigma^4 - b^2\Delta Z^2)}{\Delta Z^4}} \quad
    (F.2.9)$

    ```


    It can be seen that if $b^2\Delta Z^2 > \sigma^4$ then eigenvalues are complex
    and if $\sigma^4 > b^2\Delta Z^2$ then eigenvalues are real. We will consider
    each of these cases in turn.


    # **Complex eigenvalues: $b^2\Delta Z^2 > \sigma^4$


    We represent the $k$th complex eigenvalue as:


    ```

    $$\lambda_k = R + iY$

    ```


    where the real part is


    ```

    $$\R = 1 + \Delta t\left(r + \frac{\sigma^2}{\Delta Z^2}\right)$

    ```


    and the imaginary part is


    ```

    $$\Y = 2\sqrt{AC} \cos\left(\frac{k\pi}{n_s - 2 + 1}\right)$

    ```


    Since


    ```

    $|\lambda_k| > |R| + |Y| \quad \text{and} \quad |R| > 1,$

    ```


    we conclude that


    ```

    $|\lambda_{\min}| > 1$

    ```


    # **Real eigenvalues: $\sigma^4 \geqslant b^2\Delta Z^2$


    In this case the $k$th eigenvalue is real, and from Eq. (F.2.8) we have:


    ```

    $$\lambda_k = 1 + \Delta t\left(r + \frac{\sigma^2}{\Delta Z^2}\right) - 2\sqrt{AC}$

    ```'
