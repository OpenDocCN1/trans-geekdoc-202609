    The $k$th asset price at the $i$th time step, $S_i^k$, then generates the following
    asset prices at the $(i+1)$th time step:


    ```

    $S_{i+1}^{(k-1)+b+j} = dS_i^k, \quad j=1, \dots, b, k=1, \dots, b^i$

    ```


    (where Eq. (5.5.1)), $dS_i^k$ is a random variable from a *given* distribution.
    $S_i$ follows GBM, we therefore have


    ```

    $S_{i+1}^k = \exp((r - \frac{\sigma_i^2}{2})Delta t + \sigma_i dW_i), \quad j=1,
    \dots, b, k=1, \dots, b^i$

    ```


