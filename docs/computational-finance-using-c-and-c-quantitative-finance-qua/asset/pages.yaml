    sigma_s\\sigma_x\\rho_{xs}dt\\quad(7.15.18)$\n\nUsing the values of $d(S^f/B^f)$\
    \ and $d(X_d^{B_f}/B^d)$ from Eqs. (7.15.17) and Eq. (7.15.16) results in:\n\n\
    $d\\left(\\frac{S^f}{B^f}\\right)d\\left(\\frac{X_d^{B_f}}{B^d}\\right)=\\\\frac{S^f}{B^f}\\\
    frac{X_d^{B_f}}{B^d}\\alpha dt + \\frac{S^f}{B^f}\\frac{X_d^{B_f}}{B^d}\\sigma_s\\\
    sigma_x dW_x^Q\\n+\\sigma_x\\frac{X_d^{B_f}}{B^d}dW_x^Q + \\frac{S^f}{B^f}\\frac{X_d^{B_f}}{B^d}\\\
    sigma_s\\sigma_x\\rho_{xs}$\n\nRearranging as we obtain:\n\n$d\\left(\\frac{X_d^{B_f}}{B^d}\\\
    right)=\\frac{X_d^{B_f}}{B^d}(\\alpha + \\sigma_s\\sigma_x\\rho_{xs})\\n+\\frac{X_d^{B_f}}{B^d}(\\\
    sigma_x dW_x^Q + \\sigma_s dW_s^Q)\\quad(7.15.19)$\n\nWe already mentioned that\
    \ $X_d^{B_f}/B^d$ is a martingale under probability measure $\\mathbb{Q}$ so the\
    \ drift term in Eq. (7.15.19) must be zero. This means that:\n\n$\\alpha =-\\\
    sigma_s\\sigma_x\\rho_{xs}$ is volatility of the foreign equity, $\\sigma_x$ is\
    \ volatility of the foreign exchange rate and $\rho_{xs}$ is the correlation between\
    \ $dW_s$ and $dW_x$.\n\nEquation (7.15.13) can be written as:\n$dS^f=\\{r^f-\\\
    sigma_s\\sigma_x\\rho_{xs}\\}S^f dt+\\sigma_s S^f dW_s^Q\\quad(7.15.20)$\n\n#\
    \ Equity quantity forward\n\nThe time (t) value of a domestic equity forward contract\
    \ with maturity $T$ is:\n$F(t)=D^d(t,T)\\S^d(t,T)-K^d\\}$\n\nWhere $K^d$ is the\
    \ strike in domestic currency and $S^d(t,T)$ is the domestic forward price.\n\n\
    To value an equity forward contract we need to know the forward price of the foreign\
    \ equity $S^f$."
