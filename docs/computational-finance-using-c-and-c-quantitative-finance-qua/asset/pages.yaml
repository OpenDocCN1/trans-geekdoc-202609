    \nlarations are given in Code except 8.9. It can be seen that C function parameters\
    \ by value and declared as double val long int correspond to C# double val and\
    \ int parameters, C functions that are passed by reference are a little more tricky\
    \ to deal with C#. This is because C# does not explicitly specify pointers. A\
    \ double parameter passed by reference using double *can be used in C# by using\
    \ ref double. Similarly, the C function length* is declared in C# as ref int.\
    \ It should be noted for clarity we use the syntax double_val[] and long[] for\
    \ arrays of double and long, respectively; it is also correct to declare these\
    \ as *a_val, and long *a_ival.\n\nHowever, there is still a problem because C\
    \ functions can be coded to check whether or not a null pointer has been supplied\
    \ as a parameter, and then take appropriate action. For instance, the function\
    \ black_scholes in Code excerpt 4.1, will not compute the Greeks if the parameter\
    \ Greeks[] is null. The code fragment below shows how IntPtr, which is a recent\
    \ addition to C#, can be used to resolve this:\n\n```\n[DllImport(\"MathLib.dll\"\
    , EntryPoint = \"black_scholes2\")]\npublic static extern void ref(double ref\
