    Finance literature contains many references to the benefits of using quasirandom
    numbers for computing financial integrals. For instance, Brotherton-Ratliffe (1994)
    discusses the use of Sobol sequences for the valuation of geometric stock options,
    and provides results that show that the root-mean-squared pricing obtained using
    quasi-random numbers is considerably less than that computed with pseudo-random
    numbers. Another financial application of quasi-random numbers is the efficient
    pricing mortgage backed securities, Caflisch, Morokoff, and Owen (1997). Here
    Brownian bridge techniques are employed to reduce the effective dimension of the
    problem and thus provide greater pricing accuracy if pseudo-random numbers were
    used.


