    # 2.8 The Brownian bridge


    Let a Brownian process have values $W_{t0}$ at time $t_0$ and $W_{t1}$ at time
    $t_1$. We want to find the conditional distribution of $W_t$, where $t_0 < t <
    t_1$. This distribution will be denoted by $P(W_t|W_{t0}, W_{t1})$, to indicate
    that $W_t$ is conditional on the end values $W_{t0}$ and $W_{t1}$. We write $W_{t0}$
    and $W_{t1}$ as


    ```

    $W_t = W_{t0} + \sqrt{t-t_0}X_t, \quad X_t \sim N(0, 1),$$ (2.8.1)

    ```


    ```

    $W_t = W_{t1} - \sqrt{t_1-t}Y_t, \quad Y_t \sim N(0, 1),$$$ (2.8.2)

    ```


    where $X_t$ and $Y_t$ are independent normal variates. Combining Eqs. (2.8.1)
    and (2.8.2) we have


    ```

    $W_t = W_{t0} + \sqrt{t-t_0}X_t + \sqrt{t_1-t}Y_t$$

    ```


    which can be re-expressed as


    ```

    $W_t - W_{t0} = \sqrt{t-t_0}X_t + \sqrt{t_1-t}Y_t$$

    ```


    Using the Brownian motion property (iii) in Section 2.1


    ```

    $W_{t} - W_{t0} = \sqrt{t-t_0}Z_t, \quad Z_t \sim N(0, 1)$$$$

    ```


    So


    ```

    $$\sqrt{t-t_0}Z_t = \sqrt{t-t_0}X_t + \sqrt{t_1-t}Y_t$$

    ```'
