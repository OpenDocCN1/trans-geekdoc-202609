    \ equation at time instant $t_i = i\\Delta t$ on the previously computed option\
    \ values $f_{i+1,j}, j = 1, \\dots, n_s-2$.\n\n# Backwards iteration and early\
    \ exercise\n\nThe Black–Scholes equation can be solved over the time interval\
    \ $t$ to $t+\tau$ by iteratively solving Eq. (5.4.28). We iterate backwards in\
    \ time by solving Eq. (5.4.28) at the $i$th time step and then using the computed\
    \ values to solve Eq. (5.4.28) for the $(i-1)$th time step. The option values\
    \ at current time $t$ are obtained when time index $i=0$ is reached. It can be\
    \ seen that the grid method yields $n_s-2, f_{0,j}=1,\\dots,n_s-2$, which correspond\
    \ to the current asset prices:\n\n$S_0'=j\\Delta S, \\quad j=1,\\dots,n_s-2$\n\
    \nAs previously mentioned the asset price $S_0$ coincides with grid index $j=n_1$.\
    \ Therefore $S_0=S_0^n$, and the option value for the current asset price $S_0$\
    \ is given by $f_{0,j}$.\n\nThis is contrast to the lattice methods discussed\
    \ in Chapter 4, which yield a single option value corresponding to the root node.\n\
    \nThe option values obtained using the grid methods we have just described are\
    \ for vanilla European options. However, vanilla European options can be more\
    \ accurately valued by using the Black–Scholes pricing formula discussed in Chapter\
    \ 4. The importance of finite differences is that, by slightly modifying our backward\
    \ iterative method, we can take into account the possibility of early exercise,\
    \ and thus price American options.\n\nThis can be achieved using Code excerpt\
