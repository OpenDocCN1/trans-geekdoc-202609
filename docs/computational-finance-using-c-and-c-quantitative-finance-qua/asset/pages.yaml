    is:


    ```

    $S^f(t, T) = S^f(t) \exp((r^f - \sigma_s\sigma_f\rho_{sf})(T-t)) \quad (7.5.21)$

    ```


    where $S^f(t)$ is the current price of the foreign equity and $T$ is the maturity
    of the forward.


    In an equity quantum the payoff is in foreign currency but it is converted to
    domestic currency at a predetermined exchange rate (which we denote here by X).
    The value equity quantum is:


    ```

    $QF(t, T) = DF^f\{S^f(t, T) - K^f\}X$

    ```


    where $X$ is the exchange rate, $K^f$ is the strike in units of foreign currency,
    and $S^f(t, T)$ is the foreign equity price.


