  md: '# Computational Finance Using C and C#


    and


    ```

    $$d_2 = \log(S/E) + (r-q-\sigma^2/2)(T-t) = d_1 - \sigma\sqrt{T-t} \quad (A.1.5)$

    ```


    We have:


    ```

    $$$\frac{\partial d_2}{\partial S} = \frac{\partial d_1}{\partial S}\frac{1}{S\sqrt{T-t}}
    \quad (A.1.6)$

    ```


    ```

    $$$\frac{\partial d_2}{\partial \sigma} = \frac{\partial d_1}{\partial \sigma}-\sqrt{T-t}
    \quad (A.1.7)$

    ```


    ```

    $$$\frac{\partial d_1}{\partial r} = \frac{\partial d_2}{\partial r}\frac{\sqrt{T-t}}{\sigma}
    \quad (A.1.8)$

    ```


    ```

    $$$\frac{\partial d_1}{\partial t} = \frac{\partial d_1}{\partial t}\frac{-2(T-t)}{\sigma}
    \quad (A.1.9)$

    ```


    Also:


    ```

    $$n(d_2) = \frac{1}{\sqrt{2\pi}}exp(-\frac{d_2^2}{2})$$

    $$= \frac{1}{\sqrt{2\pi}}exp(-\sigma d_1\sqrt{T-t}-\frac{\sigma^2(T-t)}{2})$$

    $$= n(d_1)exp(-\log(\\frac{S}{E})+(r-q+\frac{\sigma^2}{2})(T-t)-2{\frac{\sigma^2(T-t)}{2}))$$

    ```


    so


    ```

    $$n(d_2) = \frac{S}{E}exp(r(T-t))exp(-q(T-t)) \quad (A.1.10)$

    ```


    We note that:


    ```

    $$$\frac{\partial N_1(d_1)}{\partial S} = \frac{\partial N_1(d_1)}{\partial d_1}\frac{\partial
    d_1}{\partial S} = n(d_1)\frac{1}{S\sqrt{T-t}}$$

    ```


    This technique will be used for computing the Greeks.


    # A.2 Gamma


    Gamma is defined as the second derivative of the option value with respect to
    the underlying stock price. This means (see Section A.3) it is the rate of delta
    with to the underlying stock price.


    For a European call the value of gamma is:


    ```

    $$$\Gamma_c = \frac{\partial^2 \Delta_c}{\partial S^2} = \frac{\partial \Delta_c}{\partial
    S}\frac{\partial \Delta_c}{\partial S}\{N_1(d_1)exp(-q(T-t))\}$$

    ```


    where value of $\Delta_c$ is given in Section A.3. So


    ```

    $$$\Gamma_c = exp(-q(T-t))frac{\partial d_1}{\partial S} = exp(-q(T-t))n(d_1)\frac{\partial
    d_1}{\partial S}$$

    ```'
