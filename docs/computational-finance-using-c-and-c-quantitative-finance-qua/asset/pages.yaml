  md: '# Appendix C: Standard statistical results


    For the most general case let: $Z_1 = a + \sum_{i=1}^n b_i X_i$ and $Z_2 = c +
    \sum_{j=1}^M b_j Y_j$. So


    ```

    $$\text{Cov}[Z_1, Z_2] = \text{Cov} \left[ a + \sum_{i=1}^n b_i X_i, c + \sum_{j=1}^M
    d_j Y_j \right]$\n\n= \text{Cov} \left[ a + \sum_{i=1}^n b_i X_i, c + \sum_{j=1}^M
    d_j Y_j \right]$$

    ```


    So


    ```

    $$\text{Cov} \left[ a + \sum_{i=1}^n b_i X_i, \sum_{j=1}^M d_j Y_j \right] = \text{Cov}
    \left[ b_i X_i, \sum_{j=1}^M d_j Y_j \right]$\n\n= \sum_{i=1}^n b_i \text{Cov}
    \left[ X_i, \sum_{j=1}^M d_j Y_j \right]$\n\n= \sum_{i=1}^n b_i \sum_{j=1}^M d_j
    \text{Cov} \left[ X_i, Y_j \right]$$

    ```


    ```

    $$\text{Cov}[Z_1, Z_2] = \sum_{i=1}^n \sum_{j=1}^M b_i d_j \text{Cov}[Y_j, X_i]
    \text{ \{, \} \}$$$

    ```


    # C.3.3 Covariance matrix


    Let $X$ denote the $n$ element vector containing the random variables $X_i, i
    = 1,\dots,n$. The mean and variance of the $i$th variable is $E[X_i]$ and $E(X_i
    - E[X_i]^2)$ respectively. The covariance $\text{Cov}[X]_{ij}$ between the $i$th
    and $j$th variables is $E[(X_i - E[X_i])(X_j - E[X_j])]$. The elements of $n$
    by $n$ covariance matrix $\text{Cov}[X]$ are them:


    ```

    $$\text{Cov}[X]_{ij} = E[(X_i - E[X_i])(X_j - E[X_j])]$$\n\n$i = 1,\dots,n, j
    = 1,\dots,n \quad \quad (C.3.1)$

    ```


    We will now show that $\text{Cov}[X + A] = \text{Cov}[X]$ where $A$ is an $n$
    element vector containing the constants $A_i, i = 1,\dots,n$. Since $E[X_i + A_i]
    = E[X_i] + A_i$ we obtain:


    ```

    $$\text{Var}[(X + A)_i] = \text{Var}[X_i + A_i]$$\n\n= E[(X_i + A_i - E[X_i +
    A_i])^2] = E[(X_i - E[X_i])^2]$$$

    ```


    and


    ```

    $$\text{Cov}[X + A]_{ij} = E[(X_i + A_i - E[X_i + A_i])(X_j + A_j - E[X_j + A_j])]$$\n\n=
    E[(X_i - E[X_i])(X_j - E[X_j])]$$\n\n= \text{Cov}[X]_{ij} \quad \quad \quad (C.3.2)$$$

    ```'
  merge: -1
  img_proc: true
