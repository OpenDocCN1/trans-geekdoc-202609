    # 10(a)


    Let $\phi = S_0 \exp(\mu t + \sigma W_t)$.\nUsing Ito''s formula:


    ```

    $d\phi = \frac{\partial\phi}{\partial t}dt + \frac{\partial\phi}{\partial W_t}dW_t
    + \frac{1}{2}\frac{\partial^2\phi}{\partial W_t^2}E[(dW_t)^2]$

    ```


    So


    ```

    $d\phi = \mu \phi dt + \sigma \phi dW_t + \frac{1}{2}\phi \sigma^2 dt$

    ```


    where we have used $\frac{\partial^2\phi}{\partial W_t^2} = \phi \sigma^2$ and
    $E[(dW_t)^2] = dt$.


    Therefore


    ```

    $dS_t = \left(\mu + \frac{1}{2}\sigma^2\right)S_t dt + \sigma S_t dW_t$

    ```


    # 10(b)


    From part (a) we have


    ```

    $\int_{\tau=0}^t dS_\tau = \left(\mu + \frac{1}{2}\sigma^2\right) \int_{\tau=0}^t
    S_\tau d\tau + \int_{\tau=0}^t \sigma S_\tau dW_\tau$

    ```


    Therefore


    ```

    $S_t - S_0 = \left(\mu + \frac{1}{2}\sigma^2\right) \int_{\tau=0}^t S_\tau d\tau
    + \sigma \int_{\tau=0}^t S_\tau dW_\tau$

    ```


    Taking expectations we have


    ```

    $E[S_t] - E[S_0] = \left(\mu + \frac{1}{2}\sigma^2\right) E\left[\int_{\tau=0}^t
    S_\tau d\tau\right] + \sigma E\left[\int_{\tau=0}^t S_\tau dW_\tau\right]$

    ```'
