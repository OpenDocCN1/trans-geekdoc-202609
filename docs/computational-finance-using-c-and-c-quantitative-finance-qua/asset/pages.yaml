    Therefore


    ```

    $f''''_{i+1,j} = \frac{\Delta X_j^+ f_{i+1,j-1} + \Delta X_{j-1}^+ f_{i+1,j-1}
    - \Delta X_j^- f_{i+1,j} - \Delta X_j^+ f_{i+1,j}}{(\Delta X_j^+)^2 \Delta X_j^-
    + (\Delta X_j^-)^2 \Delta X_j^+}$

    ```


    So


    ```

    $f''''_{i+1,j} = \frac{2[\Delta X_j^+ f_{i+1,j-1} + \Delta X_j^- f_{i+1,j+1} -
    f_{i+1,j}(\Delta X_j^+ + \Delta X_j^-)]}{(\Delta X_j^+)^2 \Delta X_j^- + (\Delta
    X_j^-)^2 \Delta X_j^+}$

    \n$(5.4.34)$

    ```


    To calculate $f''_{i+1,j}$ we rearrange Eq. (5.4.33) to obtain


    ```

    $-f''_{i+1,j} \Delta X_j^- = f_{i+1,j-1} - f_{i+1,j} - \frac{1}{2} f''''_{i+1,j}(\Delta
    X_j^-)^2$

    ```


    and


    ```

    $f''_{i+1,j} = \frac{f_{i+1,j} - f_{i+1,j-1}}{\Delta X_j^-} + \frac{1}{2} f''''_{i+1,j}
    \Delta X_j^-$

    \n$(5.4.35)$

    ```


    If we now substitute for $f''''_{i+1,j}$, from Eq. (5.4.34), into Eq. (5.4.35)
    we have


    ```

    $f''_{i+1,j} = \frac{f_{i+1,j} - f_{i+1,j-1}}{\Delta X_j^-} + \frac{[\Delta X_j^+
    f_{i+1,j-1} - (\Delta X_j^- + \Delta X_j^+)f_{i+1,j} + \Delta X_j^- f_{i+1,j+1})\Delta
    X_j^-]}{(\Delta X_j^+)^2 \Delta X_j^- + (\Delta X_j^-)^2 \Delta X_j^+}$

    ```


    which simplifies to give


    ```

    $f''_{i+1,j} = \frac{(\Delta X_j^+)^2 (f_{i+1,j-1} - f_{i+1,j}) - (\Delta X_j^-)^2
    f_{i+1,j} + (\Delta X_j^-)^2 f_{i+1,j+1}}{(\Delta X_j^+)^2 \Delta X_j^- + (\Delta
    X_j^-)^2 \Delta X_j^+}$

    ```


    so that we finally have


    ```

    $f''''_{i+1,j} = \frac{(\Delta X_j^-)^2 f_{i+1,j+1} + ((\Delta X_j^+)^2 - (\Delta
    X_j^-)^2)f_{i+1,j} - (\Delta X_j^+)^2 f_{i+1,j-1}}{(\Delta X_j^+)^2 \Delta X_j^-
    + (\Delta X_j^-)^2 \Delta X_j^+}$

    \n$(5.4.36)$

    ```


