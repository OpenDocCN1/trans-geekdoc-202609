    # 6.4 Introduction to multidimensional lattice methods


    Finite-lattices can be used to value options on about 4 assets before they require
    immensely large amounts of memory. The main advantage of finite-lattice methods
    is that they are easier to cater for American style exercise within the option.
    This is not true of Monte Carlo methods. They can easily model complex European
    options, but have difficulty modelling American-style options.


    In this section we use the approach of Kamrad and Ritchen (1991), and we will
    call the BEKR method, for price basket options. We first derive expressions for
    the jump size and jump probabilities for a single asset, and show that these are
    equivalent to those of the Cox, Ross, and Rubinstein binomial lattice (CRR lattice)
    discussed in Chapter 5. We will then give expressions for the jump sizes and jump
    probabilities of a general basket option.


    To derive the BEKR equations for one asset we assume that the asset follows a
    lognormal process with drift $\mu=r-\sigma^2/2$, which is the riskless interest
    rate and $\sigma$ is the instantaneous volatility.'
