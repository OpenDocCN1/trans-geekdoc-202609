    where for compactness we have written $\Theta_m = 1-\Theta_m$, and denote the
    partial derivatives w.r.t. S at node $(i, j)$ as: $f_{i,j}'' = \frac{af}{S}l_{i,j}$
    and $f_{i,j}'''' = \frac{af^2}{S^2}l_{i,j}$.


    Finite-difference approximations for these derivatives can be obtained by considering
    a Taylor expansion about the point $f_{i,j}$. We proceed as follows:-


    ```

    $f_{i,j}+1 = f_{i,j} + f_{i,j}''\Delta S + \frac{1}{2}f_{i,j}''''(\Delta S)^2
    $\quad (5.4.8)

    ```


    ```

    $f_{i,j}-1 = f_{i,j} - f_{i,j}''\Delta S + \frac{1}{2}f_{i,j}''''(\Delta S)^2
    $\quad (5.4.9)

    ```


    Subtracting Eq. (5.4.9) from Eq. (5.4.8) we obtain:


    ```

    $f_{i,j}+1 - f_{i,j}-1 = 2f_{i,j}''\Delta S$

    ```


    and


    ```

    $f_{i,j}'''' = \frac{f_{i,j}+1 - f_{i,j}-1}{2\Delta S}$ $\quad (5.4.10)

    ```


    Adding Eqs. (5.4.9) and (5.4.8) we obtain:


    ```

    $f_{i,j}+1 + f_{i,j}-1 = 2f_{i,j}'' + f_{i,j}''''\Delta S^2$

    ```


    which gives


    ```

    $f_{i,j}'''' = \frac{f_{i,j}+1 - 2f_{i,j} + f_{i,j}-1}{\Delta S^2}$ $\quad (5.4.11)

    ```


    The complete finite-difference equation can then be found by substituting the
    approximations for the first and second partial derivatives, given Eqs. (5.4.10)
    and (5.4.11), into (5.4.7). We obtain


    ```

    $r\Delta t{\{\Theta_m f_{i,j}+1 + \Theta_m^* f_{i,j}\} = f_{i,j}-1 - f_{i,j} +
    \frac{(r-q)j\Delta t.A_1}{2} + \frac{\sigma^2j^2\Delta t.A_2}{2}$ $\quad (5.4.12)

    ```


    where we have used the fact $S_j = j\Delta S$, and for compactness have defined
    the terms:


    ```

    $A_1 = \Theta_m f_{i,j}+1 - \Theta_m f_{i,j}-1 + \Theta_m^* f_{i,j}+1 - \Theta_m^*
    f_{i,j}-1$

    ```


    and


    ```

    $A_2 = \Theta_m f_{i,j}+1 + \Theta_m f_{i,j}-1 - 2\Theta_m f_{i,j}+1 + \Theta_m^*
    f_{i,j}+1 + \Theta_m^* f_{i,j}-1 - 2\Theta_m^* f_{i,j}$

    ```


    Collecting like terms in $f_{i,j}, f_{i,j}^*$, etc. results in:


    ```

    $B_1 f_{i,j}+1 + B_2 f_{i,j} + B_3 f_{i,j}+1 + C_1 f_{i,j}-1 + C_2 f_{i,j}+1 +
    C_3 f_{i,j}+1 = 0$ $\quad (5.4.13)

    ```'
