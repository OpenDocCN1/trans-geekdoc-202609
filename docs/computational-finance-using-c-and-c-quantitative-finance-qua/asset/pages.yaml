    Taking expectations of both sides of Eq. (2.10.5) yields


    ```

    $E[X_t] = E[X_{t_0} \exp(-\alpha t)] + E[\sigma \int_{s=0}^{t} \exp(-\alpha s)
    dW_s] \quad (2.10.6)$

