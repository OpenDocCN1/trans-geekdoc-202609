  md: '# # 3 Generation of random variates


    # ## 3.1 Introduction


    Monte Carlo simulation and random number generation are techniques that are widely
    used in financial engineering as a means of assessing the level of exposure to
    risk. Typical applications include the pricing of financial derivatives and scenario
    generation in portfolio management. In fact many of the financial applications
    that use Monte Carlo simulation involve the evaluation of various stochastic integrals
    which are related to the probabilities of particular events occurring.


    In many cases, however, the assumptions of constant volatility and a lognormal
    distribution for $S_T$ are quite restrictive. Real financial applications may
    require a variety of extensions to the standard Black–Scholes model, time-varying
    volatities, caps, floors, barriers, etc. In these circumstances, it is often the
    case that there is no closed solution to the problem. Monte Carlo simulation can
    then provide a very useful method of evaluating the required integrals.


    When we evaluate the integral of a function, $f(x)$, in the s-dimensional cube
    $I^s$, by the Monte Carlo method we are in calculating the average of the function
    at a set of randomly sampled points. Each point adds linearly to the accumulated
    sum that will become the integral and linearly to the accumulated sum of squares
    that will become the variance of the integral.


    When there are $N$ sample points, the integral is:


    ```

    $$\nu = \sum_{i=1}^{N} f(x^i)$

    ```


    where $

    u$ is used to denote the approximation to the integral and $x^1, x^2, \dots, x^N$
    are the $N$, $s$-dimensional, sample points. If a pseudo-random number generator
    is used the points $x^i$ will (should be) independently and identically distributed.
