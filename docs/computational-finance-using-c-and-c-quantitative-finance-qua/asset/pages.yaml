    \ = (t-t_0)\\mu_k + \\sigma_k W_t^i$\n\nA constant $\\mu_k$ can be achieved by\
    \ freezing the forward rates that make up $\\mu_k$; for example, $F(t, t_{k-1},\
    \ t_k) \to F(t, t_{k-1}, t_k)$; see Section 7.2.3 for more details concerning\
    \ $\\mu_k$.\n\nThis means that $F(t, t_{k-1}, t_k)$ follows the process:\n\n```\n\
