  md: "# # Appendix C:\nStandard statistical results\n\n# ## C.1 The law of large\
    \ numbers\n\nLet $x_1, x_2, \\dots$ be a sequence of independent, identically\
    \ distributed random variables (IID), each with expected value $\\mu$ and variance\
    \ $\\sigma^2$. Define the sequence of averages\n\n$y_n = \\sum_{i=1}^n x_i = \\\
    frac{x_1 + x_2 + \\dots + x_n}{n}, \\quad n = 1, 2, \\dots$\n\nThen the law of\
    \ large numbers states that $y_n$ converges to $\\mu$ as $n \to \\infty$, that\
    \ is $Var[y_n] \to 0$.\n\nThe mean of $y_n$ is:\n\n$E[y_n] = \\frac{1}{n}(E[x_1]\
    \ + E[x_2] + \\dots + E[x_n]) = \\frac{1}{n}\\mu = \\mu$\n\nThe variance of $y_n$\
    \ we have:\n\n$Var[y_n] = Var\\left[\\frac{\\sum_{i=1}^n x_i}{n}\\right] = \\\
    frac{1}{n^2}Var\\left[\\sum_{i=1}^n x_i\\right] = \\frac{1}{n^2}n\\sigma^2 = \\\
    frac{\\sigma^2}{n}$\n\nwhere we have used the fact that the variance of the sum\
    \ of independent random variables is the sum of their variances; see Section C.2.\n\
    \nWe have therefore shown that $n \\to \\infty, Var[y_n] \\to 0$.\n\n# ## C.2\
    \ The central limit theorem\n\nLet $x_1, x_2, \\dots$ be a sequence of independent,\
    \ identically distributed random variables (IID), each with expected value $\\\
    mu$ and variance $\\sigma^2$. If we define $u_i = x_i - \\mu$ then:\n\n$E[u_i]\
    \ = E[u] = 0,\\quad Var[u_i] = E[u^2] = \\sigma^2$"
