  md: '# Single asset American options 175


    nal nodes and then iterating backward. Here we denote the $k$th option value at
    the $i$ time step by $f_i^k$.


    The option values at the terminal nodes, time instant $t_{d-1}$, are computed
    in the usual manner. For a put we have:


    ```

    $f_{d-1}^k = \max(E - S_{d-1}^k, 0), \quad k = 1, \dots, b^{d-1}$

    ```


    Where E is the exercise price.


    The option values at the $(i-1)$ time step are computed from those at the $i$
    time step as follows:


    ```

    $f_{i-1}^k = \max(f_i^k, h_{i-1}^k)$

    ```


    where


    ```

    $h_{i-1}^k = \frac{\exp(-r\Delta t)}{b} \sum_{j=1}^b f_i^{(k-1)b+j}$

    ```


    and


    ```

    $g_{i-1}^k = \max(E - S_{i-1}^k, 0)$

    ```


    The option value for the $p$th stochastic lattice is therefore:


    ```

    $\theta_{H}^p = f_0 = \frac{\exp(-r\Delta t)}{b} \sum_{j=1}^b f_1^j$

    ```


