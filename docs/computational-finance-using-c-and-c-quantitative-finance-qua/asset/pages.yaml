- pgno: 193
  md: '# # 6 Multiasset options


    # ## 6.1 Introduction


    In this section we consider the valuation of multisset, basket, options within
    the Black-Scholes pricing framework. These options will be priced using the following
    techniques:


    +   * Analytic methods

    * Monte Carlo methods

    * Multidimensional lattices


    Analytic methods can be useful for pricing multisset European options which have
    a known closed form solution. These are particularly appropriate for low dimensional
    European options, when the closed form expressions are not too difficult to evaluate.


    Monte Carlo methods have the advantage that they can easily compute the value
    of multisset European options, but have difficulty including the possibility of
    early exercise; this is required for American-style options.


    On the other hand, multidimensional lattice techniques allow American options
    to be evaluated with ease. However, lattices become increasingly difficult to
    program as the number of dimensions increases, and the constraints of computer
    storage limits their to problems involving (about) four or less assets.


    # ## 6.2 The multasset Black–Scholes equation


    In Chapter 2 we mentioned that the price, S, of a single asset follows geometric
    Brownian motion (GBM) the change in price, dS, over a time interval, dt, is given
    by:


    ```

    dS = rSdt + σSdW

    ```


    where r is the free interest rate, σ is the volatility of asset S, and dW ~ N(0,
    dt).


    We also proved using Ito’s lemma that the process followed by Y = log(S) is:


    ```

    dY = (r - σ²/2)dt + σ dW

    ```'
  merge: -1
  img_proc: true
- pgno: 194
  md: "where $dY$ is the change in the value of $\\log(S)$ over the time interval\
    \ $dr$. Later on we derived the (Black-Scholes) partial differential equation\
    \ that is satisfied by the value, $V$, of an option written on a single asset.\
    \ The equation is\n\n```\n$$\\frac{\\partial V}{\\partial t\\|+\\frac{\\sigma^{2}}{2}\\\
    frac{\\partial^{2} V}{\\partial S^{2}}+rS\\frac{\\partial V}{\\partial S}-rv=0$\n\
    ```\n\nThe above result can be generalized to deal with multiset options. Suppose\
    \ that $m$ assets are described by the following processes:\n\n```\n$dY_{i}=(r-\\\
    \\frac{\\sigma_{i}^{2}}{2})dt+\\sigma_{i}dW_{i},\\quad i=1,...,m,\\quad(6.2.1)\n\
    ```\n\nwhere the subscript $i$ refers to value associated with the $i$th asset.\
    \ The $m$-element random vector $dW$ is distributed according $dW \\sim N(0,C)$.\
    \ The diagonal elements of $C$ are $C_{ii}=\\text{Var}[dW_{i}]=dt, i=1,...,m$,\
    \ and off-diagonal elements are:\n\n```\n$C_{ij}=E[dW_{i}dW_{j}]=\\rho_{ij}dt,\\\
    quad i=1,...,m,j=1,...,m,i\\neq j$\n```\n\nWe also write the above equation in\
    \ vector form by introducing the $m$-element vector $dY$ which is normally distributed:\n\
    \n```\n$dY\\simN(\\\bar{\\mu},\\bar{C}),\\quad(6.2.2)\n```\n\nwhere $\\bar{\\\
    mu}$ is the mean vector and $\\bar{C}$ is the covariance matrix. The elements\
    \ of the covariance matrix are:\n\n```\n$$\\bar{C}_{ii}=\\sigma_{i}^{2}dt,\\quad\
    \ i=1,...,m$\\n$\\bar{C}_{ij}=\\sigma_{i}\\sigma_{j}\\rho_{ij}dt,\\quad i\\neq\
    \ j,i=1,...,m,j=1,...,m,\\quad(6.2.3)\n```\n\nwhere $\\rho_{ij}$ is the correlation\
    \ coefficient between asset $i$ and asset $j$; that is, the correlation between\
    \ $dW_{i}$ and $dW_{j}$. The elements of the mean vector are:\n\n```\n$v_{i}=r-\\\
    \\frac{\\sigma_{i}^{2}}{2},\\quad i=1,...,m,\\quad(6.2.4)\n```\n\nThe value $V$\
    \ of an option on $m$ assets satisfies the following differential equation:\n\n\
    ```\n$$\\frac{\\partial V}{\\partial t\\|+\\sum_{i=1}^{m}\\sum_{j=1}^{m}\\sigma_{i}\\\
    sigma_{j}\\rho_{ij}S_{i}S_{j}\\frac{\\partial^{2} V}{\\partial S_{i}\\partial\
    \ S_{j}}+rS\\sum_{i=1}^{m}\\frac{\\partial V}{\\partial S_{i}}-rv=0$\n```\n\n\
    For a European call on the maximum of $m$ assets (time $\tau$) is given by $P_{c}^{MAX}=\\\
    max(S_{c}^{1},S_{c}^{2},...,S_{c}^{m})-E$, where $S_{c}^{i},i=1,...,m$, denotes\
    \ the value of the $i$th asset at maturity, and $E$ represents the strike price.\
    \ Similarly a European put option on the minimum of $m$ assets has a pay-off,\
    \ $P_{p}^{MIN}$, at time $\tau$, given by $P_{p}^{MIN}=max-\\min(S_{c}^{1},S_{c}^{2},...,S_{c}^{m}),0$."
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 6.3 Multidimensional Monte Carlo methods


    We have already mentioned that Monte Carlo simulation can easily price European
    multasset options (also sometimes referred to as basket options, or rainbow options)
    involving a large number of assets (say 20 or more).


    In addition Monte Carlo simulation can also include the following features


    +   - Non-Gaussian distribution of stock returns; distributions with heavy tails
    are usually of interest because they more accurately represent what is observed
    in the financial markets

    - Options with path dependency (such as barrier options, etc.); these are known
    as exotic options

    - Complex time dependency (e.g., ARMA, GARCH or Levy processes) of model parameters
    such as interest rates, asset prices, etc.


    The main drawbacks with Monte Carlo simulation are:


    +   - It is difficult to compute the value of American-style options

    - It is difficult (or impossible) to achieve the same accuracy that can be obtained
    using finite difference methods.


    In a different section of this book we will show how Monte Carlo simulation can
    be used to price American options by using a hybrid Monte Carlo lattice approach
    developed by Boyle, Evnine, and Gibbs (1997).


    In Chapter 3 we show that when pseudo-random numbers are used, the standard errors
    of integrals computed via Monte Carlo simulation decrease at the rate $N^{1/2}$,
    where $N$ is the number of simulations. This means that it can require hundreds
    of thousands of simulations to achieve an accuracy of $10^{-1}$ or $10^{-2}$ in
    the estimated option price. It is because this various Monte Carlo variance reduction
    techniques are used to increase the accuracy of the computed integral.


    In this section we show how to price a three-asset basket option using Monte Carlo
    simulation; the accuracy of the results obtained with quasirandom numbers and
    pseudo-random numbers are compared.


    The options consider European put and call options on the maximum and minimum
    of three assets. All the options have a maturity of one year, and the other model
    parameters are used in Tables 6.1 and 6.2.


    In code 6.1 most of the work is given by the routine multivariate-normal. This
    generates a vector of multivariate pseudo-random numbers with a particular covariance
    matrix. In the program values of the assets at current time $t$ are $S_1 = S_2
    = S_3 = 100$, and the option monitors in one year.


    The asset evolves according to


    ```

    $dY_i = \log(S_{i,t+dt}) - \log(S_{i,t}) = \left(r - \frac{\sigma_i^2}{2}\right)dt
    + \sigma_i dW_i, \quad i=1,\dots,m,$

    ```'
  merge: -1
  img_proc: true
