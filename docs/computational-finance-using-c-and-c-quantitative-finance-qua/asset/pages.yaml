  md: "# 80 Computational Finance Using C and C#\n\n```\nvoid implied_volatility(double\
    \ value, double s0, double x, double sigma[]){\n    double t, double r, double\
    \ q, long put, long iflag)\n    /* Input parameters:\n    ===================\n\
    \    value       - the current value of the option\n    s0          - the current\
    \ price of the underlying asset\n    x           - the strike price\n    sigma[]\
    \     - the input bounds on the volatility: sigma[0], the lower bound, and sigma[1],\
    \ the upper bound\n    t           - the time to maturity\n    r           - the\
    \ interest rate\n    q           - the continuous dividend yield\n    put    \
    \     - if put is 0 then a call option, otherwise a put\n    Output parameters:\n\
    \    ===================\n    sigma[]      - the element sigma[0] contains the\
    \ estimated volatility\n    iflag       - an error indicator\n}\ndouble zero=0.0;\n\
    double fx, sig1, sig2;\ndouble temp, exps, epsqrt, vi1, vi2;\nlong max_iters,\
    \ i, ind;\ndouble greeks[5],c[20],sig,vega;\nlong done;\n\ntolx = exps;\nepsqrt\
    \ = sqrt(EPSPS);\nif(put == 0) { /* a call option */\n    temp = MAX(x*exp(-r)*t-x*exp(-q)*t),zero);\n\
    } else { /* a put option */\n    temp = MAX(x*exp(-r)*t-x*exp(-q)*t),zero);\n\
    }\nlab = fabs(value-temp);\nif (vl < epsqrt) { /* the volatility is too small\
    \ */\n    iflag = 3;\n    return;\n}\niflag = 0;\ni = 0;\nmax_iters = 50; /* initial\
    \ estimate */\ndone = 0;\nsig = sigma[0];\nwhile (i < max_iters) && (!done) {\
    \ /* Newton iteration */\n    black_scholes(4,val,greeks,s0,sig,t,r,q,put,iflag);\
    \ /* compute the Black-Scholes option value, val, */\n    vega = greeks(4); /*\
    \ and vega */\n    sig = sig - ((val - value)/vega); /* compute the new estimate\
    \ of sigma using Newton's method */\n}\nif (tolx < fabs((sig - sig)/sig)) { /*\
    \ check whether the specified accuracy has been reached */\n    done = 1;\n}\n\
    sig = sig1;\n++;\n}\nsigma[0] = sig; /* return the estimate for sigma */\nreturn;\n\
    ```\n\n# Code 4.3 Function to compute the implied volatility of European options.\n\
    \nFrom Newton's method we have:\n\n$$\\sigma_{i+1} = \\sigma_i - \\frac{F(\\sigma_i)}{F'(\\\
    sigma_i)}$\n\nwhere\n\n$F'(\\sigma_i) = \\frac{\\partial F}{\\partial \\sigma}\
