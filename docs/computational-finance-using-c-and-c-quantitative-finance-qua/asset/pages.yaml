    \ that the memory requirements are only of order $b \\times d$; as before, b is\
    \ the number of branches per node and $d$ is the number of time intervals.\n\n\
    Here we assume the underlying asset GBM and the function normal (M, S) to generate\
    \ a normal distribution with M and standard deviation S. We can then check the\
    \ accuracy of the simulation with that obtained by a closed form which assumes\
    \ a lognormal distribution, in this case the formula in Gekse and Janson (1984).\n\
    \nHowever, the power of this method is when the underlying asset follows a more\
    \ realistic process which is non-Gaussian and time varying. The only modification\
