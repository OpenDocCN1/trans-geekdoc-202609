    We will now consider the case in which the basis swap has been traded at time
    $t$, and will also assume that $C_1 = C_2 = 0$ and $t_{k_1} = t_{k_2}$. In addition,
    we will specify that principal exchange occurs at the start (time) and end (time)
    of the swap.


    The cash flows associated with principal exchange at the start of the swap are
    in the opposite direction to those for the remainder of the swap; Hull (2003).


    $FLT_1(t) = P_1 - P_1DF_1(t, t_n) + \{-P_1 + P_1DF_1(t, t_n)\} \quad (7.2.24)$


    and


    $FLT_2(t) = P_2 - P_2DF_2(t, t_n) + \{-P_2 + P_2DF_2(t, t_n)\} \quad (7.2.25)$


    where the principal exchange terms are in the curly brackets, and use discount
    factors $DF_1(t, T)$ from the *main currency yield curve* (in this GBP) rather
    than $DF_1(t, T)$ or $DF_2(t, T)$.


    It can be seen from Eq. (7.2.21) that principal exchange at the start of the swap
    causes leg 2 to contribute the *positive* $P_2$ to the value of the swap, while
    leg 1 contributes the *negative* $P_2$ to the value. In contrast, principal exchange
    at the end of the swap results in leg 2 contributing the *negative* $-P_2DF(t,
    t_n)$ to the swap value, while leg 1 contributes the *positive* $P_1DF(t, t_n)$.
