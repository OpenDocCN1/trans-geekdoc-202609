    where we have used superscripts to denote the domestic currency, and the current
    equity quantum forward price with maturity T is:


    ```

    $S^d(t, T) = S^d(t)\exp(r^d(T-t)), \quad t \le T$

    ```


    The value of an equity quantum option can be found by substituting $S^f$ for $S^d$
    in the above expression.


