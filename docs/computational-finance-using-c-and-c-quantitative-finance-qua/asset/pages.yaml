  md: "# Generation of random variates\n\nwhere the matrix $K$ is formed by taking\
    \ the square root of the maximum of each eigenvalue and a very small number $\\\
    epsilon$ (say $\\sim10^{-16}$). Thus:\n\n```\n$K = \\begin{pmatrix} \\sqrt{\\\
    max(\\lambda_1, \\epsilon)} & & \\ & \\sqrt{\\max(\\lambda_2, \\epsilon)} & \\\
    \ & & \\sqrt{\\max(\\lambda_p, \\epsilon)} \\end{pmatrix}$\n```\n\nThe matrix\
    \ $C_r^+$ is not acceptable as a correlation matrix because, although real, symmetric\
    \ and positive definite, its diagonal elements are not unit. It is possible to\
    \ remedy this by premultiplying and postmultiplying $C^+$ by the diagonal matrix\
    \ $F$:\n\n```\n$\\tilde{C}_r = FC_r^+F = FC_r^+F^T$\n```\n\nwhere $\tilde{C}_r$\
    \ is the new repaired correlation matrix—i.e., it is positive definite, symmetric,\
    \ and has unit diagonal elements. To achieve this, the diagonal elements of $F$\
    \ must be given:\n\n```\n$F_{ii} = \\frac{1}{\\sqrt{C_{ii}^+}}$\n```\n\nWe thus\
    \ have:\n\n```\n$\\tilde{C}_r = FC_r^+F^T\\n= FVK(VK)^TF^T\\n= (FVK)(K^TVF)^T\\\
    n= (FVK)(FVK)^T \\quad (3.4.1)$\n```\n\nAn optimally repaired correlation matrix\
    \ $C_r^*$, which minimizes the distance $\\|C_r - C_r^*\\|$, can be obtained via\
    \ numerical optimization on the $n$-dimensional unit hypersphere; this is described\
    \ below.\n\nHowever, it has been found that $\tilde{C}_r$ is a very good approximation\
    \ for the optimal estimate $C_r^*$,\n\n# Optimally repaired correlation matrix\n\
    \nWe provide details of how to obtain an optimally repaired correlation matrix\
    \ using hyperspherical coordinates and the method of Rebonato and Jäck (1999/2000)—for\
    \ a different approach such Higham (2002) or Qi and Sun (2006).\n\nThe Cartesian\
    \ coordinates of the $ith$ point on an $n$-dimensional hypersphere with radius\
    \ $r$ can be shown to be:\n\n```\n$x_{i,1} = r \\cos(\\theta_{i,1})$\\nx_{i,2}\
