    ```

    $k_3 = \frac{\log(E/S)-(r-q-\sigma^2/2)\tau-2\log(B/S)}{\sigma\sqrt{\tau}}\n=
    \frac{\log(ES/B^2)-(r-q-\sigma^2/2)\tau}{\sigma\sqrt{\tau}}$

    ```


    So


    ```

    $I_D = \frac{B}{S}^{2r/\sigma^2-1}} E\exp(-r\tau)N_1(-k_3) \quad (B.1.4)$

    ```'
