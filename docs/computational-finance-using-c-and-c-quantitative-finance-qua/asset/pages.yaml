    \ dt + dW^{k-1}$ (7.2.54)\n```\n\nand using Eq. (7.2.54) to substitute for $dW^{k-1}$\
    \ in Eq. (7.2.52) we obtain:\n\n```\n$dW^k = \\frac{\\tau\\sigma_k F_k}{1+F_k\\\
    tau} dt - \\frac{\\tau\\sigma_{k-1} F_{k-1}}{1+F_{k-1}\\tau} dt + dW^{k-1}$ (7.2.55)\n\
    ```\n\nReplacing $dW^k$ in Eq. (7.2.40) with that given in Eq. (7.2.55):\n\n```\n\
    $dF_k = F_k\\sigma_k \\left\\ \\frac{\\tau\\sigma_k F_k}{1+F_k\\tau} dt - \\frac{\\\
    tau\\sigma_{k-1} F_{k-1}}{1+F_{k-1}\\tau} dt \\right\\} + F_k\\sigma_k dW^{k-1}$\
    \ (7.2.56)\n```\n\nso the drift is:\n\n```\n$\\mu_k = \\frac{\\tau\\sigma_k^2\
    \ F_k}{1+F_k\\tau} - \\frac{\\tau\\sigma_k\\sigma_{k-1} \\rho_{k,k-1} F_{k-1}}{1+F_{k-1}\\\
    tau}$ (7.2.57)\n```\n\nThe following general expression can be derived in a similar\
    \ manner:\n\n```\n$dF_k = \\sigma_k F_k \\sum_{j=i+1}^k \\frac{\\rho_{k,j}\\tau\\\
    sigma_j F_j}{1+F_j\\tau} dt + \\sigma_k dW^i$ (7.2.58)\n```\n\nwhere all the symbols\
    \ have the same meanings as before, but now $i$ can take any value less than $k$."
