  md: "Substituting for $E^{Q_t}[F(t_{k-1}, t_{k-1}, t_k)]$ in Eq. (7.2.228):\n\n\
    ```\n$V_{t_0} = P\tau F(t_0, t_{k-1}, t_k) = DF(t_0, t_k) - \\frac{1}{\tau}\\\
    left(\\frac{DF(t_0, t_{k-1})}{DF(t_0, t_k)}\right)P\tau$\n```\n\nThis yields\n\
    \n```\n$V_{t_0} = P\\{DF(t_0, t_{k-1}) - DF(t_0, t_k)\\}$, (7.2.32)\n```\n\nwhich\
    \ is our current method of valuing the future coupons generated by forward rates.\n\
    \n# General payment timing\n\nFor the general case, in which the coupon date does\
