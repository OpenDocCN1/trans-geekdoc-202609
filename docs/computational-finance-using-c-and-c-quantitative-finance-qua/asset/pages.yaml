    \ these techniques can be used in conjunction with a standard binomial lattice\
    \ to improve the computed results.\n will first discuss the BBS method.\n\n# The\
    \ bbs method\n\nThe bbs method is identical to the standard binomial lattice except\
    \ that in the last step (that is just before option maturity) the Black–Scholes\
    \ formula is used to calculate the option values at maturity. For an $n$ step\
    \ binomial lattice this involves evaluating the Black–Scholes formula at each\
    \ of the $n$ nodes in the penultimate step; see Fig. 5.1. In Code excerpt 5.13\
    \ we define the function bs_lattice incorporates the BBS method into a standard\
    \ binomial lattice. The reader will have noticed that bbs_lattice is rather lack\
    \ concern the amount of storage that is required; see Section 5.3.2. It uses an\
    \ array of size $L_N$ rather than $L_S$, to store the asset prices; the modification\
    \ to use an array of size $L_S$, is left as an exercise.\n\nThe benefits of using\
