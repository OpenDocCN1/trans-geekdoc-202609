- pgno: 223
  md: "# 7.2.2 Interest rate swap\n\nInterest Rate Swaps (IRS) are very common financial\
    \ instruments—it is not uncommon for 80 percent of the trades in a portfolio to\
    \ be IRS deals. Here we will provide a description of some of the characteristics\
    \ of interest rate swaps; more detail can be found in Hull (2003).\n\nA vanilla\
    \ IRS consists of a strip of FRA trades, each FRA starting when the previous FRA\
    \ finishes. The maturity date of the IRS corresponds to the maturity date of the\
    \ FRA.\n\nLet the start of the FRAs be $t_i, i = 0, \\dots, n-1$, and the maturity\
    \ times of the FRAs be $t_i, i = 1, \\dots, n$; note that the FRA start corresponds\
    \ to the forward rate reset times, and the maturity times correspond to the FRA\
    \ payment times. We will now adopt the (common) convention of calling the trades\
    \ *swaps*, so an IRS is made up of a number of swaps.\n\nWhen the counterparty\
    \ A pays the fixed rate and receives the floating rate (from A perspective) it\
    \ is a payer IRS. Alternatively, if A receives the fixed rate and pays the floating\
    \ rate, the term is a receiver IRS.\n\nThe value of an IRS at time $t_k$, where\
    \ $t_{k-1} < t < t_k$, will be considered. We will assume that discount factors\
    \ used to compute the forward rates and those used to discount the coupon payments\
    \ are associated with the same yield curve. Using Eq. (7.2.10) we have\n\n```\n\
    $IRS(t) = CDF(t, t_k) + \\sum_{i=k+1}^n DF(t, t_i)\\tau_i[K - F(t, t_{i-1}, t_{i-1}\
    \ + \\tau_i)]$\n\n(7.2.11)\n```\n\nwhere $C$ is the *next coupon payment* after\
    \ current time $t$ (this occurs at time $t_k$), and $\tau_i$ is the tenor of the\
    \ $i$-th swap which starts at time $t_{i-1}$ and ends at time $t_i$.\n\nNote that\
    \ the next coupon payment $C$ for the swapping starting at time $t_{k-1}$ and\
    \ maturing at time $t_k$ is already known with certainty at time $t$ because the\
    \ forward rate $F(t, t_{k-1}, t_k)$ was reset in the past; $t_{k-1} < t$.\n\n\
    We will now rewrite Eq. (7.2.11) as:\n\n```\n$IRS(t) = CDF(t, t_k) + FXD(t) -\
    \ FLT(t)$\n\n(7.2.12)\n```\n\nwhere $FXD(t)$, the time value of the fixed leg\
    \ is,\n\n```\n$FXD(t) = PK \\sum_{i=k+1}^n DF(t, t_i)\\tau_i$\n\n(7.2.13)\n```\n\
    \nand $FLT(t)$, the time value of the floating leg is,\n\n```\n$FLT(t) = P \\\
    sum_{i=k+1}^n DF(t, t_i)\\tau_i F(t, t_{i-1}, t_{i-1} + \\tau_i)$$\n\n(7.2.14)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 224
  md: "# The floating leg\n\nWe will now evaluate Eq. (7.2.14). The floating leg coupon\
    \ payment at time $t_i$\nwill be denoted by $C_i$ and has value:\n\n```\n$C_i\
    \ = PF(t, t_{i-1}, t_{i-1} + \tau_{t_i})$\n```\n\nwhere\n\n```\n$F(t, t_{i-1},\
    \ t_{i-1} + \tau_{t_i}) = \\left\\{ \\frac{DF(t, t_{i-1})}{DF(t, t_{i-1} + \t\
    au_{t_i})} - 1 \\right\\}$\n```\n\nFrom Eq. (7.2.14) we have thus:\n\n```\n$FLT(t)\
    \ = \\sum_{i=k+1}^{n} C_i DF(t, t_i)\\n= P \\sum_{i=k+1}^{n} DF(t, t_i)\tau_{t_i}\
    \ \\left\\{ \\frac{DF(t, t_{i-1})}{DF(t, t_i)} - 1 \\right\\}$$\\n= P \\sum_{i=k+1}^{n}\
    \ \\{DF(t, t_{i-1}) - DF(t, t_i)\\}\\n= P\\{DF(t, t_k) - DF(t, t_{k+1}) + DF(t,\
    \ t_{k+1}) - \\dots\\n- DF(t, t_i) + DF(t, t_i) - \\dots - DF(t, t_n)\\}\\n= P\\\
    {DF(t, t_k) - DF(t, t_n)\\}$\n```\n\nand so the value of floating leg is\n\n```\n\
    $FLT(t) = P\\{DF(t, t_k) - DF(t, t_n)\\}$, (7.2.15)\n```\n\n# The swap rate\n\n\
    The time $t$ swap rate $SR_t$ is the value of the fixed rate $K$ that makes the\
    \ IRS\nzero. Thus, from Eqs. (7.2.12)-(7.2.14):\n\n```\n$P\\{DF(t, t_k) - DF(t,\
    \ t_n)\\} = PSR_t \\sum_{i=k+1}^{n} DF(t, t_i)\tau_{t_i}$ (7.2.16)\n```\n\nso\n\
    \n```\n$SR_t = \\frac{DF(t, t_k) - DF(t, t_n)}{\\sum_{i=k+1}^{n} DF(t, t_i) \\\
    tau_{t_i}}$ (7.2.17)\n```\n\n# Amortization\n\nSo we have assumed that the principal\
    \ is fixed and set to the value $P$. We\nwill now deal with the situation where\
    \ the principal varies with time according\nto the following amortization schedule:\n\
    \n```\n$AM_i = P_{i-1} - P_i, \\quad i = 0, \\dots, n-1$,$ (7.2.18)\n```"
