  md: '# Single asset American options


    When the above results are substituted in Eq. (5.2.14) we obtain the quadratic
    equation:


    ```

    $$\gamma^2g - \gamma_g + \beta\gamma - \frac{\alpha}{h} = g\left(\gamma^2 - \gamma
    + (\beta - 1)\gamma - \frac{\alpha}{h}\right) = 0$$

    ```


    or


    ```

    $$\gamma^2 - \gamma + (\beta - 1)\gamma - \frac{\alpha}{h} = 0 \quad (5.2.15)$

    ```


    which has the two solutions


    ```

    $$\gamma_1 = \frac{1}{2}\left\{-(\beta - 1) - \sqrt{((\beta - 1)^2 + 4\frac{\alpha}{h}}\right\
    \quad (5.2.16)$

    ```


    and


    ```

    $$\gamma_2 = \frac{1}{2}\left\{-(\beta - 1) + \sqrt{((\beta - 1)^2 + 4\frac{\alpha}{h}}\right\
    \quad (5.2.17)$

    ```


    where not since that $\alpha/h > 0$, we have $\gamma_1 < 0$ and $\gamma_2 > 0$.

    The General solution to Eq. (5.2.14) is as follows:


    ```

    $$\g(S, E, h) = a_1S^{v1} + a_2S^{v2}$ \quad (5.2.18)$

    ```


    We will now decide the appropriate strategies pertaining to American call options
    and American puts.


    # American call options


    Here we use the fact that both the value and the early premium tend to zero as
    the asset price $\nu_c(S, E, \tau) = h_g(S, E, h)$ as $S \to 0$, $g_c(S, E, h)
    \to 0$.


    However since $\gamma_1 < 0$, the only way this can be achieved in Eq. (5.2.18)
    is if $a_1 = 0$. $g_c(S, h) = a_2S^{v2}$, and the value of American call is:


    ```

    $C(S, E, \tau) = c(S, E, \tau) + ha_2S^{v2}$ \quad (5.2.19)$

    ```


    An expression for $a_2$ can be found by considering the critical asset price (point
    on early exercise boundary), $S^*$, above which the American option will be exercised.
    For $S < S^*$, the value of the American call is given by Eq. (5.2.19), and when
    $S > S^*$ we have $C(S, E, \tau) = S - E$.


    Now, since the value of the American option is continuous, at the critical asset
    $S^*$ we have:


    ```

    $S^* - E = c(S^*, E, \tau) + ha_2S^{*v2}$ \quad (5.2.20)$

    ```


    Furthermore since the gradient of the American option is also continuous, at $S^*$
    we have:


    ```

    $$\frac{\partial(S^* - E)}{\partial S^*} = \frac{\partial}{\partial S^*} \left\{
    c(S^*, E, \tau) + ha_2S^{*v2} \right\}$ \quad (5.2.21)$

    ```


    which gives


    ```

    $1 = \exp(-q\tau)N_1(d_1(S^*)) + \gamma_2ha_2S^{*(\gamma_2-1)}$ \quad (5.2.22)$

    ```'
