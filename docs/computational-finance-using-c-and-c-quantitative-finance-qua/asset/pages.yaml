    derivatives are as follows:


    ```

    \frac{\partial\phi}{\partial X_i} = \phi\frac{dX_i}{X_i} \text{ for } i=1, \dots,
    n\n\frac{\partial^2\phi}{\partial X_i^2} = 0 \text{ for } i=1, \dots, n

    ```'
