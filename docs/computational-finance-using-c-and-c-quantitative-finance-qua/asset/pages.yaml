- pgno: 383
  md: "# Glossary\n\nThe notation used is as follows:\n\n+   - GBM Geometric Brownian\
    \ motion\n- BM Brownian motion\n- $W_t$ Brownian motion at time $t$\n- $\rho$\
    \ the correlation coefficient\n- $E[x]$ the expectation value of $X$\n- $Var[X]$\
    \ the variance of $X$\n- $Cov[X, Y]$ the covariance between $X$ and $Y$\n- $Cov[X]$\
    \ the covariance between the variates contained in the vector $X$\n- $\\sigma$\
    \ the volatility. Since assets are assumed to follow GBM it is computed as the\
    \ annualized standard deviation of the $n$ continuously compounded returns\n\n\
    $N_1(a)$ the univariate normal distribution function. It gives the cumulative\
    \ probability, in a standardized univariate normal distribution, that the variable\
    \ $x_1$ satisfied $x_1 \\le a$\n\n$N_2(a, b, \rho)$ the bivariate cumulative normal\
    \ distribution. It gives the cumulative probability, in a standardized bivariate\
    \ normal distribution, that the variables $x_1$ and $x_2$ satisfy $x_1 \\le a$\
    \ and $x_2 \\le b$ when correlation coefficient between $x_1$ and $x_2$ is $\\\
    rho$\n\n$r$ the free interest rate\n\n$q$ the continuously compounded dividend\
    \ yield\n\n$S_{it}$ the it asset price at time $t$\n\n$I_{nn}$ the $n$ by $n$\
    \ unit matrix\n\n$\\Lambda(\\mu, \\sigma^2)$ a lognormal distribution with parameters\
    \ $\\mu$ and $\\sigma^2$. If $y = \\log(x)$ and $y \\sim N(\\mu, \\sigma^2)$ then\
    \ the distribution for $x = e^y$ is $x \\sim \\Lambda(\\mu, \\sigma^2)$. We have\
    \ $E[x] = \\exp(\\mu + \\frac{\\sigma^2}{2})$ and $Var[x] = \\exp(2\\mu + \\sigma^2)(\\\
    exp(\\sigma^2) - 1)$\n\nContinued on back cover"
  merge: -1
