  md: "# 3.4.3 Normal distribution\n\nWe show how to generate a p variate normal distribution\
    \ with a given mean and covariance matrix.\n\nWe will denote the vector containing\
    \ the variates of the ith observation from a p variate zero normal distribution\
    \ by $Z_i$; that is, we use a sample of $n$ observations as:\n\n```\n$Z_i \\sim\
    \ N(0, C), \\quad i = 1, \\dots, n,$\n```\n\nwhere $C$ is the $p \times p$ covariance\
    \ matrix.\nFurther $Z_{i,k}$ is used to denote the $k$th element of $Z_i$, which\
    \ contains the value of the $k$th variate for the ith observation.\n\nFrom a computational\
    \ point of view, we can then consider a sample of $n$ observations to be represented\
    \ by the $n \times p$ matrix $Z$. The row of $Z$ contains the values for ith observation,\
    \ and the $k$th column of the ith row, $Z_{i,k}$, contains the value of the $k$th\
    \ variate for the ith observation.\n\nAlso, since the distribution has zero mean,\
    \ the sample covariance matrix is given by: $C = ZZ^T$.\n\nTo generate variates\
    \ with the covariance matrix $C$ we can use the fact that, if the matrix $C$ is\
    \ positive definite, a Cholesky factorization exists in which:\n\n```\n$C = AA^T$\n\
    ```\n\nwhere $A$ is lower triangular.\n\nWe can therefore generate $p$ variates\
    \ which have a covariance matrix $C$ as follows.\n\n+   First generate by (for\
    \ example) using the Box–Muller method described in Section 3.3.1, the independent\
    \ normal variates:\n\n```\n$X \\sim N(0, I_p)$\n```\n\nwhere the vector $X$ contains\
    \ the $p$ variates, $I_p$ is the unit matrix, and $XX^T = I_p$. Then, using the\
    \ Cholesky factorization of Eq. (3.4.4), form:\n\n```\n$Y = AX$\n```\n\nwhere\
    \ $Y$ is a $p$-element vector.\nNow, since $YY^T = (AX)(AX)^T = A(XX^T)A^T = AA^T\
    \ = C$, we have that\n\n```\n$Y \\sim N(0, C)$\n```\n\nVariates that have nonzero\
    \ means $\\mu_k, k = 1, \\dots, p$, can be obtained by simply modifying Eq. (3.4.4)\
    \ to:\n\n```\n$Y' = AX + \\mu$\n```\n\nwhere $Y'$ is a $p$ variate vector that\
    \ is distributed as $N(\\mu, C)$, and the $p$ elements of $\\mu$ contain the means\
    \ of the variates $Y'_k, k = 1, \\dots, p$.\nIf $C$ is not positive definite,\
    \ we can create a repaired matrix, $\\hat{C}$, by using the approach outlined\
    \ in Section 3.4.2."
