    # 3.4.2 Repairing correlation and covariance matrices


    There are situations when a supplied *correlation* matrix is not positive definite.
    Some of the reasons for this are:


    +   May be missing data, or asynchronous data feeds. As a consequence the elements
    in the correlation matrix may have then been computed using pairwise correlations,
    with a variety of sequence lengths. Under these circumstances the equation $C_r
    = X^T X$ is no longer true, and $C_r$ cannot be guaranteed to be positive definite

    Manual adjustment of a correlation matrix may have occurred to reflect expected
    market conditions. This es occurs when the market crashes and certain stock prices
    become highly correlated

    May be rounding error in computing $C_r = X^T X$.


