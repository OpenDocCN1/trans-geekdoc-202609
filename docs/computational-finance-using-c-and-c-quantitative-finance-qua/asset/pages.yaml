- pgno: 184
  md: "key to the accuracy achieved by dko_call is a combination of:\n\n+   - The\
    \ logarithmic transformation of the Black–Scholes equation\n- The ability to place\
    \ a grid line at the upper boundary $B_U$, and also at the lower boundary $B_L$\n\
    - The use of a weighted $\\Theta_m$ finite-difference scheme, $0 \\le \\Theta_m\
    \ \\le 1$, instead of the numerically unstable explicit finite-difference method\
    \ used by a tromial lattice in our notation (see Section 5.4.2) is equivalent\
    \ to $\\Theta_m = 1$.\n\nIt should be mentioned that the function dko_call could,\
    \ without much difficulty, be modified to deal with:\n\n+   - American double\
    \ knockout call options\n- European double knockout put options\n- American double\
    \ knockout put options\n\nand also a range of other variations which may include\
    \ lockout periods, rebates, etc. In particular, options with time-varying barrier\
    \ levels can be dealt with using grid lines to locate the barrier position at\
    \ each time instant.\n\n# 5.5 Pricing American options using a stochastic lattice\n\
    \nIn this section we consider the use of Monte Carlo simulation and stochastic\
    \ lattices to price American options. Information on the use of Monte Carlo simulation\
    \ to value both asset and multiset European options is provided in Chapter 4 and\
    \ Chapter 6. The main difficulty in using simulation to value American options\
    \ is the need to incorporate early exercise policies. The standard simulation\
    \ algorithms for valuing European contracts are forward in time. That is each\
    \ price path, which contributes to the value of the option, is generated by stepping\
    \ from current time, $t$, to option maturity, $t+\tau$, where $\tau$ is the duration\
    \ of the option. For instance if there is $n$ required time steps of size $\\\
    Delta t$, and only one underlying asset, then we use the asset values $S_i,t_i=0,\\\
    dots,n$, where $S_i$ corresponds to the asset value at the $i$th time instant,\
    \ $t_i=t_0$. $S_{i+1}$ is generated from the previous asset value $S_i$ as follows:\n\
    \n```\n$$\\frac{S_{i+1}}{S_i} = dS_i \\quad \\text{for } i=0,\\dots,n-1$$\n```\n\
    \nwhere $dS_i$ is a random variate from a given distribution. When $S_i$ follows\
    \ GBM, we have from Eq. (2.3.11):\n\n```\n$$\\frac{S_{i+1}}{S_i} = \\exp\\left(r\
    \ - \\frac{\\sigma^2}{2}\\right)\\Delta t + \\sigma_i dW_i\\), \\quad i=0,\\dots,n-1$$\n\
    ```\n\nwhere $dW_i \\sim N(0,\\Delta t)$ and the usual defaults are used for $\\\
    sigma$ and $r$. For European exotic options (such as time dependent barrier options)\
    \ the value of a particular price path will depend on the asset values $S_i,i=0,\\\
    dots,n$."
  merge: -1
