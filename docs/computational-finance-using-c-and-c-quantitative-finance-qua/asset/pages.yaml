  md: "# Generation of random variates\n\n# 3.4 Generation of multivariate distributions:\
    \ correlated variates\n\nIn this section we will show how to generate variates\
    \ from a multivariate distribution with a known mean and a given covariance or\
    \ correlation matrix. The methods described for covariance matrices are also applicable\
    \ to correlation matrices, although in this case the generated variates are normalized\
    \ to have unit variance.\n\n# 3.4.1 Estimation of correlation and covariance\n\
    \nHere we show how to obtain a valid correlation matrix $C_r$ or covariance matrix\
    \ C from historic market data.\n$\bar{X}$ be an $n$ by $p$ data matrix, with the\
    \ entries in the $i$th row corresponding to the $i$th observation, and the $j$th\
    \ column containing the values of the $j$th variable. If we create a new matrix\
    \ $X$ such that the entries of the $j$th column of $X$ are $X_{i,j}=\bar{X}_{i,j}\
    \ - \\mu_j, i=1\\dots,n$, where $\\mu_j$ is the mean of the $j$th column of $\b\
    ar{X}$, then the $p$ by $p$ matrix $C = X^T X$ is the covariance matrix of $\b\
    ar{X}$.\nFurther, if another matrix $\tilde{X}$ is defined such that $\tilde{X}_{i,j}=\\\
    frac{\bar{X}_{i,j}-\\mu_j}{\\sigma_j}, i=1,\\dots,n$, where $\\mu_j$ is the mean\
    \ of the $j$th column of $\bar{X}$, and $\\sigma_j$ is the standard deviation\
    \ of the $j$th column, then the $p$ by $p$ matrix $C_r = \tilde{X}^T \\tilde{X}$\
    \ is the correlation matrix of $\tilde{X}$.\n\n# Correlation matrix\n\nLet us\
    \ first consider the properties of a valid correlation matrix. They are:\n\n+\
    \   * The matrix is symmetric with unit diagonal\n* The matrix has to be positive\
    \ definite—that is, all the eigenvalues need to be positive.\n\nWe will now show\
    \ that the $p$ by $p$ matrix $C_r$ is a valid correlation matrix if it can be\
    \ factored as $C_r = X^T X$, where $X$ is a nonsingular (that is, full rank) $n$\
    \ by $m$ data matrix.\n\nThe proof is as follows:\n\nSince $X$ is nonsingular\
    \ we can perform the singular value decomposition:\n\n```\n$X = UK^T$$\n```\n\n\
    Where $U$ is an $n$ by $n$ unitary matrix, $K$ is an $n$ by $p$ matrix containing\
    \ the (nonzero) singular values $\\sigma_i, i=1,\\dots,p$, as the diagonal elements\
    \ and zero elsewhere, and $V$ is a $p$ by $p$ unitary matrix.\nWe thus have\n\n\
    ```\n$X^T X = (UK^T)^T UKV^T = V^T U^T I UKV^T$$\n```"
