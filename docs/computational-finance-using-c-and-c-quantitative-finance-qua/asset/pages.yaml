  md: '# Appendix A: The Greeks for vanilla European options


    Therefore:


    ```

    $\Gamma_c = \frac{n(d_1)}{S\sqrt{T-t}} \exp(-q(T-t)) \quad (A.2.1)$

    ```


    The value of gamma for a European put can be calculated similarly:


    ```

    $\Gamma_p = \frac{\partial^2 p}{\partial S^2} = \frac{\partial \Delta_p}{\partial
    S} = \frac{\partial}{\partial S}\{(N_1(d_1)-1) \exp(-q(T-t))\}$

    ```


    where we have used the value of $\Delta_p$, derived in Section A.3. Therefore:


    ```

    $\Gamma_p = \exp(-q(T-t))\frac{\partial(N_1(d_1)-1)}{\partial S} = \exp(-q(T-t))n(d_1)\frac{\partial
    d_1}{\partial S}$

    ```


    So


    ```

    $\Gamma_p = \Gamma_c = \frac{n(d_1)}{S\sqrt{T-t}} \exp(-q(T-t)) \quad (A.2.2)$

    ```


    The value of gamma for both a put and a call is the same.


    # A.3 Delta


    Delta is defined as the rate of change of option value with the underlying stock
    price.


    For a European call:


    ```

    $\Delta_c = \frac{\partial c}{\partial S} = \frac{\partial}{\partial S}\{S\exp(-q(T-t))N_1(d_1)-E
    \exp(-r(T-t))N_1(d_2)\\}$

    ```


    So


    ```

    $\Delta_c = \exp(-q(T-t))\{N_1(d_1)+Sn(d_1)\}\frac{\partial d_1}{\partial S} -
    E \exp(-r(T-t))n(d_2)\frac{\partial d_2}{\partial S} \quad (A.3.1)$

    ```


    Substituting for $n(d_2)$ and $\frac{\partial d_2}{\partial S}$ we obtain:


    ```

    $\Delta_c = \exp(-q(T-t))N_1(d_1) \quad (A.3.2)$

    ```


    In similar manner we have for a European put:


    ```

    $\Delta_p = \frac{\partial p}{\partial S} = \frac{\partial}{\partial S}\{E \exp(-r(T-t))(1-N_1(d_2))-S
    \exp(-q(T-t))(1-N_1(d_1))\}$

    ```


    So


    ```

    $\Delta_p = -E \exp(-r(T-t))n(d_2)\frac{\partial d_2}{\partial S} - \exp(-q(T-t))\{(1-N_1(d_1))+Sn(d_1)\}\frac{\partial
    d_1}{\partial S} \quad (A.3.3)$

    ```'
