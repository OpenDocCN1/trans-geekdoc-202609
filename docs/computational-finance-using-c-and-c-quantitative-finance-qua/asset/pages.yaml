    $d_1=\frac{\log(S/E) + (r + \sigma^2/2)\tau}{\sigma\sqrt{\tau}} \quad \text{and}

    nd_2=\frac{\log(S/E) + (r - \sigma^2/2)\tau}{\sigma\sqrt{\tau}}=d_1-\sigma\sqrt{\tau}
