  md: "# C.4 Conditional mean and covariance of normal distributions\n\n$X = [X_1,\
    \ X_2]^T$ be distributed as $N_p(\\mu, \\Sigma)$ with $\\mu = [\\mu_1, \\mu_2]^T$\
    \ and $\\Sigma = \begin{bmatrix} \\Sigma_{11} & \\Sigma_{12} \\ \\Sigma_{21} &\
    \ \\Sigma_{22} \\end{bmatrix}$ and $|\\Sigma_{21}| > 0$.\n\nWe will prove that\
    \ the conditional distribution of $X_1$, given that $X_2 = x_2$, is normal and\
    \ has:\n\nMean = $\\mu_e s_1 + \\Sigma_{12}\\Sigma_{22}^{-1}(x_2 - \\mu_2)$, and\
    \ covariance = $\\Sigma_{11} - \\Sigma_{12}\\Sigma_{22}^{-1}\\Sigma_{21}$.\nLet\
    \ the inverse of $\\Sigma$ be $\\Sigma^{-1}$, where\n\n```\n$$\\Sigma^{-1} = \\\
    begin{bmatrix} \\Sigma_{11} & \\Sigma_{12} \\ \\Sigma_{21} & \\Sigma_{22} \\end{bmatrix}^{-1}\
    \ \\quad (C.4.1)$\n```\n\nSo $\\Sigma^{-1} = \\begin{bmatrix} \\Sigma_{11} & \\\
    Sigma_{12} \\ \\Sigma_{21} & \\Sigma_{22} \\end{bmatrix}^{-1} = \\begin{bmatrix}\
    \ I_q & 0 \\ 0 & I_{p-q} \\end{bmatrix} \\quad (C.4.2)$\n\nMultiplying out these\
    \ identities yields the following equations:\n\n```\n$$\\Sigma_{11}\\Sigma_{11}\
    \ + \\Sigma_{21}\\Sigma_{21} = I_q \\quad (C.4.3)$\n```\n\n```\n$$\\Sigma_{21}\\\
    Sigma_{11} + \\Sigma_{22}\\Sigma_{21} = 0 \\quad (C.4.4)$\n```\n\n```\n$$\\Sigma_{11}\\\
    Sigma_{12} + \\Sigma_{21}\\Sigma_{22} = 0 \\quad (C.4.5)$\n```\n\n```\n$$\\Sigma_{21}\\\
    Sigma_{12} + \\Sigma_{22}\\Sigma_{22} = 0 \\quad (C.4.6)$\n```\n\nMultiplying\
    \ Eq. (C.4.5) on the left by $(\\Sigma_{11})^{-1}$ and on the right by $\\Sigma_{22}^{-1}$\
    \ gives:\n\n```\n$(\\Sigma_{11})^{-1}\\Sigma_{12} = -\\Sigma_{12}\\Sigma_{22}^{-1}\
    \ \\quad (C.4.7)$\n```\n\nMultiplying Eq. (C.4.3) on the left by $(\\Sigma_{11})^{-1}$\
    \ yields\n\n```\n$$\\Sigma_{11} + (\\Sigma_{11})^{-1}\\Sigma_{12}\\Sigma_{22}^{-1}\
    \ = I_q \\quad (C.4.8)$\n```\n\nand substituting for $(\\Sigma_{11})^{-1} = \\\
    Sigma_{11} - \\Sigma_{12}\\Sigma_{22}^{-1}\\Sigma_{21}$ from Eq. (C.4.7) into\
    \ Eq. (C.4.8) gives\n\n```\n$(\\Sigma_{11})^{-1} = \\Sigma_{11} - \\Sigma_{12}\\\
    Sigma_{22}^{-1}\\Sigma_{21} \\quad (C.4.9)$\n```\n\nThe probability density function\
    \ of $x$ is:\n\n```\n$f(x) = (2\\pi)^{-p/2}|\\Sigma^{-1}|^{1/2}\\exp\\left\\{\\\
    frac{1}{2}(x-\\mu)^T\\Sigma^{-1}(x-\\mu)\\right\\} $\n```\n\nwriting $x, \\mu$\
    \ and $\\Sigma^{-1}$ in their partitioned form and gives:\n\n```\n$f(x) = (2\\\
    pi)^{-p/2}|\\Sigma^{-1}|^{1/2}\\n\\exp\\left[-\\frac{1}{2}(x_1-\\\\mu_1)^T\\Sigma^{11}(x_1-\\\
    \\mu_1) + 2(x_1-\\\\mu_1)^T\\Sigma^{12}(x_2-\\\\mu_2)\\n + (x_2-\\\\mu_2)^T\\\
    Sigma^{22}(x_2-\\\\mu_2)\\right] \\quad (C.4.10)$\n```"
