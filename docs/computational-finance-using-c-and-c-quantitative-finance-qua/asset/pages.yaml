    Let


    ```

    $s_n = \sum_{i=1}^{n} u_i + n\mu$

    ```


    So


    ```

    $s_n = \sum_{i=1}^{n} x_i$

    ```


    We now introduce the normalized value $z_n$, as follows:


    ```

    $z_n = \frac{s_n - n\mu}{\sqrt{n}} = \frac{1}{\sqrt{n}} \sum_{i=1}^{n} u_i$

    ```


    The central limit theorem states as $n$ tends to the probability distribution
    of $z_n$ tends to a normal distribution with zero mean and unit variance; mathematically
    $z_n \to N(0, 1)$ as $n \to \infty$.


    PROOF. From Section C.5, Eq. (C.5.3)


    ```

    $M_{z_n} = E[exp(tz_n)] = E\left[ \exp\left[ \frac{t}{\sqrt{n}} \sum_{i=1}^{n}
    u_i \right] \right]$

    ```


    and using Eq. (C.5.5)


    ```

    $M_{z_n} = \left\ M_u\left( \frac{t}{\sqrt{n}} \right) \right\}^n$

    ```


    Equation (C.5.1) yields:


    ```

    $M_u\left( \frac{t}{\sqrt{n}} \right) \approx 1 + \frac{t}{\sqrt{n}} E[u] + \frac{1}{2}
    \left( \frac{t}{\sqrt{n}} \right)^2 E[u^2] + \dots$

    ```


    As $n \to \infty, \frac{t}{\sqrt{n}} \to 0$ and


    ```

    $M_u\left( \frac{t}{\sqrt{n}} \right) \to 1 + \frac{t}{\sqrt{n}} E[u] + \frac{1}{2}
    \left( \frac{t}{\sqrt{n}} \right)^2 E[u^2] = 1 + \frac{t^2}{2n}$

    ```


    Thus


    ```

    $\left\ M_{z_n}\left( \frac{t}{\sqrt{n}} \right) \right\}^n = \left( 1 + \frac{t^2}{2n}
    \right)^n \to 1 + \frac{t^2}{2} \text{ as } n \to \infty$

    ```


    where we used the fact that $t \ll 1$; see Grimmett and Welsh (1986). We have
    then shown that as $n \to \infty$


    ```

    $M_{z_n}(t) \to 1 + \frac{t^2}{2} \to e^{t^2/2}$

    ```


    However, from Section D.1 the moment generating function $M_z(t)$ for a standard
    normal distribution $(\mu=0, \sigma^2 = 1)$ is:


    ```

    $M_z(t) = e^{t^2/2} \text{ where } z \sim N(0, 1)$

    ```


    Thus we proved that $z_n \to N(0, 1)$ as $n \to \infty$.'
