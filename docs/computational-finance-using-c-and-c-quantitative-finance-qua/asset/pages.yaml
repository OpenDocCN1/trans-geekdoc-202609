    # 2.4 Girsanov''s theorem


    This theorem states that for any stochastic $k(t)$ such that $\int_0^t k(s)^2
    ds < \infty$ then the Radon-Nikodym derivative $\frac{dQ}{dP} = \rho(t)$ is given
    by:


    $\rho(t) = \exp\left{\int_0^t k(s) dW_s^P - \frac{1}{2} \int_0^t k(s)^2 ds\right\}
    \quad (2.4.1)$'
