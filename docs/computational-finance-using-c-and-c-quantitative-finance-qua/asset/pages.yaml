  md: "# # 4 European options\n\n# ## 4.1 Introduction\n\nA European option taken\
    \ out at current time $t$ gives the owner the right (but not the obligation) to\
    \ do something when the option *matures* at time $T$. This could, for example,\
    \ be the right to buy or sell stocks at a particular *strike* price. The option\
    \ would course be exercised if it was in the owner's interest to do so. a single\
    \ asset *vanilla put option*, strike price $E$ and *expiry* time $T$, gives the\
    \ owner the right at time $T$ to sell a particular asset for $E$. If the asset\
    \ is worth $S_T$ at maturity the value of the put option at maturity, known as\
    \ the *payoff*, is thus $max(E - S_T, 0)$. By contrast a European *call option*,\
    \ with strike price and expiry time $T$, gives the owner the right at time $T$\
    \ to buy an asset for $E$; the payoff of a call option is $max(S_T - E, 0)$.\n\
    \nThe owner of an American option has the right (but not the obligation) to exercise\
    \ the option *at any time* from current time $t$ to maturity. These options are\
    \ extra flexibility. The simple single asset American put has no analytic solution\
    \ and requires finite-difference and lattice methods to estimate its value. Many\
    \ European options, on the other hand, take the form of a *relatively easy* definite\
    \ integral from time which it is possible to close a complete form solution. The\
    \ valuation of multiset European options, depend on a large number of underlying\
    \ assets, is more complicated but can be achieved by using Monte Carlo simulation\
    \ to compute the required multidimensional integral.\n\nThe expected *current\
    \ value* of a single asset European option will depend on the current asset price\
    \ at time $t$, $S$, the duration of the option, $\tau = T - t$, the strike price,\
    \ $E$, the riskless interest rate, $r$, and the probability density function of\
    \ the underlying asset at maturity, $p(S_T)$.\n\n# ## 4.2 Pricing derivatives\
    \ using a martingale measure\n\nIn this section we will briefly summarize the\
    \ results of Harrison and Kreps (1979) and Harrison and Pliska (1981). Let us\
    \ consider an economy over the time interval $[0, T]$ which consists of $n$ assets\
    \ $S^i, i = 1, \\dots, n$, which can take"
