    \ $W^k$ under numeraire $DF(t, t_k)$ by the addition of a drift term $\\mu_k,\
    \ W_{t_0}^k = W_{t_0}^i = 0$ if we obtain:\n\n```\n$W_t^k = (t-t_0)\\left(\\frac{\\\
