- pgno: 109
  md: '# # 5 Single asset American options


    # ## 5.1 Introduction


    In Chapter 4 we discussed single asset European options and the analytic formulae
    that can be used to price them. Here we will consider the valuation of single
    asset American-style options using numeric methods and analytic formulae; in addition
    we discuss the use of numerical techniques to value certain European options.
    The coverage in this chapter is as follows:


    +   * Analytic approximation techniques for the valuation of American options

    * Binomial lattice techniques used for the valuation of American and European
    options

    * The valuation of American and European vanilla and barrier options using finite-difference
    grids

    * The valuation of American options via Monte Carlo simulation.


    It should be mentioned that although much of the discussion here concerns the
    valuation of vanilla European and American puts and calls, the techniques used
    can be modified without much difficulty to include more exotic options with customized
    payoffs and early exercise features.


    # ## 5.2 Approximations for vanilla American options


    # ### 5.2.1 American call options with cash dividends


    In this section we will consider the valuation of vanilla American call options
    with cash dividends and discuss the methods of Roll, Geske, Whaley, and Black.
    We will first consider the Roll–Geske–Whaley method.


    The Roll–Geske–Whaley approximation


    This method uses the work of Roll (1977), Geske (1979), and Whaley (1981). Let
    S be the current (t) price of an asset which pays a single cash dividend $D_1$
    at time ex-dividend date, $t_1$, there will be a decrease in the asset''s value
    from $S_{t_1}$ to $S_{t_1}-D_1$. The current asset price net of escrowed dividends
    is:


    ```

    $S_D = S - D_1 \exp(-r(t_1 - t)) \quad (5.2.1)$

    ```


