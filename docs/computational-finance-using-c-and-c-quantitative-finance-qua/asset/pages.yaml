    To gain some insight into the meaning of the above equation, we will rewrite it
    in the following form:


    ```

    $c(S, E, \tau)=\exp(-r\tau)SN_1(d_1)\exp(r\tau)-EN_1(d_2) \qquad (4.4.49)$

    ```


    The term $N_1(d_2)$ is a probability that the option will be exercised in a risk-neutral
    world, so that $EN_1(d_2)$ is the strike price multiplied by the probability that
    the strike price will be paid. The term $SN_1(d_1)\exp(r\tau)$ is the expected
    value of a variable, in a risk neutral world, equals $S_T$ if $S_T > E$ and is
    otherwise zero.


    The corresponding formula for a put can be shown using put parity (see Section
    4.3) to be:


    ```

    $p(S, E, \tau)=E\exp(-r\tau)N_1(-d_2)-SN_1(-d_1) \qquad (4.4.50)$

    ```


    or equivalently, using $N_1(-x)=1-N_1(x)$ we have


    ```

    $p(S, E, \tau)=\exp(-r\tau)\{1-N_1(d_2)\}-S\{1-N_1(d_1)\} \qquad (4.4.51)$

    ```


    # The inclusion of dividends


    The effect of dividends on the value of a European option can be dealt with assuming
    that the asset price is the sum of a riskless component involving known dividends
    that will be paid during the life of the option, and a risky (stochastic) component;
    see Hull (2003).


    As continuous $q$ are paid, the stock price is reduced by the same amount, and
    by the time the European option measures all the dividends have been paid, leaving
    only the risky component of the asset price.


    From Eq. (4.4.26) we have thus:


    ```

    $d\mu=\muSdt-Sqdt+\sigmaSdW^P

    ndB=rBdt \qquad (4.4.52)$

    ```


    where under probability measure $\mathbb{P}$ we know that $dW^P \sim N(0, dt)$.


    As before (Girsanov''s theorem), we choose probability measure $\mathbb{Q}$ so
    that


    ```

    $dW^P=dW^Q-(\frac{\mu-r}{\sigma})dt$

    ```


    and thus under this measure the process for $S$ is


    ```

    $dS=\muSdt-Sqdt-(\frac{\mu-r}{\sigma})dt+\sigmaSdW^Q, \quad \text{where } dW^Q
    \sim N(0, dt)$

    ```'
