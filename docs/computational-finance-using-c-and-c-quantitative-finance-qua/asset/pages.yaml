    \nIt is possible to achieve faster convergence than if the sample points are\n\
    chosen on a Cartesian grid. If we sample each point exactly once, then the\nMonte\
    \ Carlo effectively becomes a deterministic quadrature scheme,\nwhose fractional\
    \ error decreases at the rate of $N^{-1}$ or faster. The trouble with\nt grid\
    \ approach is that it is necessary to decide in advance how it should\nbe, and\
    \ all the grid points need to be used. It is therefore not possible to sample\\\
    until some convergence criterion has been met.\n\nQuasi-random numbers seek to\
    \ bridge the gap between the flexibil-\nity pseudo-random number generators and\
    \ the advantages of a regular grid.\nThey are designed to have a high level of\
    \ uniformity in multidimensional space,\nand unlike pseudo-random numbers they\
    \ are not statistically independent.\n\n# 3.2 Pseudo-random and quasi-random sequences\n\
    \nHere we consider the generation of multidimensional pseudo-random and quasi-\n\
    random sequences to approximate the multidimensional uniform distribution\nover\
    \ the interval $[0, 1]$, that is the distribution $U(0, 1)$.\n\nQuasi-random numbers\
    \ are a measure of their uniformity and is defined as follows:\nThe discrepancy\
    \ of a sequence is Given\nA a set of points $x^1, x^2, \\dots, x^N \\in I^S$ and\
    \ a subset $G \\subset I^S$, define\nthe counting function $S_N(G)$ as the number\
    \ of points $x^l \\in G$. For each\nx = (x_1, x_2, \\dots, x_n) \\in I^S$, with\
    \ volume $[0, x_1] \times \\dots \times [0, x_n]$. Then the dis-\ncreancy of the\
    \ points $x^1, x^2, \\dots, x^N$ is given by:\n\n```\n$D_N^*(x^1, x^2, \\dots,\
    \ x^N) = \\sup |S_N(G) - N x_1 x_2 \\dots x_n|, |$$\n```\n\nThe discrepancy is\
    \ computed by comparing the actual number of sam-\npoints in a given volume of\
    \ multidimensional space with the number of\nsample points that should be assuming\
    \ a uniform distribution.\n\nIt can be shown that the discrepancy of the first\
    \ terms of quasi-random\nquence has:\n\n```\n$D_N^*(x^1, x^2, \\dots, x^N) \\\
    leqslant C_S(\\log N)^{S-1}$|$$\n```\n\nfor all $N \\geqslant 2$.\n\nThe principal\
    \ aim in the construction of low-discrepancy sequences is thus to\nfind in which\
    \ the constant is as small as possible. Various sequences\nhave been constructed\
    \ to achieve this goal. Here we consider the following\nquasi-random sequences:\
    \ Niederre, Sobol, and Faure."
