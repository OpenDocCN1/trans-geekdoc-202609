    # The Greeks


    Now that we have derived formulae for european vanilla puts and calls it is possible
    to work out their partial derivatives (hedge statistics). We will now merely quote
    expressions for the Greeks (hedge statistics) for European options. Here the subscript
    $c$ refers to a European call, and the subscript $p$ refers to a European put.
    Complete derivations of these results can be found in Appendix A.


    # Gamma:


    ```

    $\Gamma_c = \frac{\partial^2 c}{\partial S^2} = \Gamma_p = \frac{\partial^2 p}{\partial
    S^2} = \exp(-q\tau)\frac{n(d_1)}{\sigma\sqrt{\tau}} \quad (4.4.63)$

    ```


    # Delta:


    ```

    $\Delta_c = \frac{\partial c}{\partial S} = \exp(-q\tau)N_1(d_1)$\\$\Delta_p =
    \frac{\partial p}{\partial S} = \exp(-q\tau)\{N_1(d_1) - 1\ \quad (4.4.64)$

    ```


    # Theta:


    ```

    $\Theta_c = \frac{\partial c}{\partial t} = q \exp(-q\tau)SN_1(d_1) - r E \exp(-r\tau)N_1(d_2)$\\\frac{S(d_1)\sigma\exp(-q\tau)}{2\sqrt{\tau}}$\\\$\Theta_p
    = \frac{\partial p}{\partial t} = -q \exp(-q\tau)SN_1(-d_1) + r E \exp(-r\tau)N_1(-d_2)$\\\frac{-S(d_1)\sigma\exp(-q\tau)}{2\sqrt{\tau}}$
    \\quad (4.4.65)$

    ```


    # Rho:


    ```

    $\rho_c = \frac{\partial c}{\partial r} = E\tau N_1(d_2), \quad \rho_p = \frac{\partial
    p}{\partial r} = -E\tau N_1(-d_2) \quad (4.4.66)$

    ```'
