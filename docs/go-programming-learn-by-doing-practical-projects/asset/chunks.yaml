    \ {\n    *c = Color(value)\n    return nil\n}\n\nfunc main() {\n    colorFlag\
    \ := flag.String(\"color\", \"red\", \"Color\")\n    var customColor Color\n \
    \   flag.Var(&customColor, \"color\", \"Custom color\")\n    flag.Parse()\n  \
    \  fmt.Println(\"Color:\", *colorFlag)\n    fmt.Println(\"Custom color:\", customColor)\n\
    }\n```\n\nBy understanding how to parse command-line arguments, you can create\
    \ more flexible and customizable command-line tools.\n\n## 4.2 Using os/exec\n\
    \nThe `os/exec` package provides functions for executing external commands. This\
    \ is useful for interacting with other programs or operating system utilities.\n\
    \n### 4.2.1 Executing Commands\n\nTo execute a command, you can use the `exec.Command`\
    \ function and the `Cmd.Run` or `Cmd.CombinedOutput` methods.\n\n```go\npackage\
    \ main\n\nimport (\n    \"fmt\"\n    \"os/exec\"\n)\n\nfunc main() {\n    cmd\
    \ := exec.Command(\"ls\", \"-l\")\n    output, err := cmd.CombinedOutput()\n \
    \   if err != nil {\n        fmt.Println(\"Error:\", err)\n    }\n    fmt.Println(string(output))\n\
    }\n```\n\nIn this example, we execute the `ls -l` command, which lists files and\
    \ directories in the current directory. The `CombinedOutput` method captures both\
    \ the standard output and standard error of the command.\n\n### 4.2.2 Passing\
    \ Arguments\n\nTo pass arguments to a command, provide them as additional arguments\
    \ to the `exec.Command` function.\n\n```go\ncmd := exec.Command(\"echo\", \"Hello,\
    \ world!\")\n```\n\n### 4.2.3 Setting Environment Variables\n\nYou can set environment\
