  trans: "\n\n你可以在操作系统的环境变量设置中设置这些变量。例如，在 Windows 上，你可以在系统属性对话框中设置它们。\n\n## 1.2 设置\n\
    \n在开始编写 Go 代码之前，配置 Go 开发环境是关重要的一步。\n\n### 1.2.1 下载并安装 Go\n\n- 访问 Go 官网：前往 [`go.dev/`](https://go.dev/)\n\
    - 选择合适的安装程序：选择与你的操作系统（Windows、macOS 或 Linux）匹配的安装程序。\n- 遵循安装说明：安装过程通常非常简单。只需按照屏幕提示操作即可。\n\
    \n提示：如果在安装过程中遇到任何问题，请参考 Go 文档或在网上搜索帮助。\n\n### 1.2.2 验证安装\n\n- 打开终端或命令提示符：这是一个你就可以输入文本命令的窗口。\n\
    - 输入 `go version`：此命令将检查 Go 是否安装正确并显示版本号。\n- 检查输出：如果安装了 Go，你应该看到类似 \"go version\
    \ go1.21.0\" 的内容。\n\n### 1.2.3 设置环境变量（可选）\n\n虽然不是严格必须，但设置 `GOROOT` 和 `GOPATH`\
    \ 环境变量可以让 Go 开发变得更加方便。\n\n- `GOROOT`：此变量指定 Go 安装的根目录。\n- `GOPATH`：此变量指定你存储项目的工作空间。\n\
    \n以下是在不同系统中设置这些变量的方法：\n\n**Windows：**\n1. 打开控制面板。\n2. 转到系统和安全 > 系统。\n3. 点击“高级系统设置”。\n\
    4. 进入“环境变量”选项卡。\n5. 在“[你的用户名]的用户变量”下，点击“新建”。\n6. 输入 `GOROOT` 作为变量名，并将安装目录路径（例如\
    \ `C:\\Go`）作为变量值。\n7. 点击确定。\n8. 为 `GOPATH` 重复此过程，将值设置为你想要存储项目的目录（例如 `C:\\Users\\\
    [你的用户名]\\go`）。\n\n**macOS：**\n1. 打开终端。\n2. 编辑你的 `.bash_profile` 或 `.zshrc` 文件（取决于你使用的\
    \ shell）。\n3. 添加以下行：\n```bash\nexport GOROOT=/usr/local/go\nexport GOPATH=$HOME/go\n\
    ```\n4. 保存文件并关闭终端。\n5. 重新打开终端使更改生效。\n\n**Linux：**\n1. 打开终端。\n2. 编辑你的 `.bashrc`\
    \ 或 `.zshrc` 文件。\n3. 添加以下行：\n```bash\nexport GOROOT=/usr/local/go\nexport GOPATH=$HOME/go\n\
    ```\n4. 保存文件并关闭终端。\n5. 重新打开终端使更改生效。\n\n注意：具体的路径可能会根据你安装 Go 的位置而异。你可以通过检查 Go 文档或在终端中使用\
    \ `go env` 命令来查找默认安装目录。\n\n搞好了！你现在已经配置好了 Go 开发环境。在下一节中，我们将编写第一个程序。\n\n## 1.3 第一个程序\n\
    \n现在我们已经配置好了开发环境，让我们来编写第一个 Go 程序吧。\n\n### 1.3.1 创建新文件\n\n- 打开文本编辑器：选择你喜欢的文本编辑器，例如\
    \ Visual Studio Code、Sublime Text 或 Atom。\n- 创建新文件：以 `.go` 扩展保存文件。例如，你可以将其命名为\
    \ `hello.go`。\n\n### 1.3.2 编写代码\n\n- 将以下代码粘贴到文件中：\n\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc main() {\n    fmt.Println(\"Hello, world!\")\n}\n```\n\n代码解析：\n\
    \n- `package main`：定义主包。\n- `import \"fmt\"`：导入格式化包以用于输出。\n- `func main()`：这是程序的入口函数。\n\
    - `fmt.Println(\"Hello, world!\")`：打印 \"Hello, world!\"。\n\n### 1.3.3 运行程序\n\n\
    - 打开终端或命令提示符：进入文件所在的目录。\n- 输入 `go run hello.go`：此命令将编译并运行你的程序。\n- 查看输出：你应该看到 \"\
    Hello, world!\"。\n\n恭喜你！你成功运行了第一个 Go 程序。\n"
