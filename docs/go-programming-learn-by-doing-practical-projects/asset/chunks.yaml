    ### 7.1.4 Buffered Channels


    Buffered channels have a fixed capacity, allowing the sender to send values without
    waiting for a receiver.


    Go


    ch := make(chan int, 2)


    ch <- 1


    ch <- 2


    value1 := <-ch


