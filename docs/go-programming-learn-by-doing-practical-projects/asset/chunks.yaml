    ## 4.4 Error Handling


    Error handling is crucial in command-line tools to provide informative feedback
    to users and prevent unexpected crashes.


    ### 4.4.1 Checking for Errors


    When calling functions that might return errors, it''s essential to check for
    them.


    Go


    file, err := os.Open("filename.txt")


    if err != nil {


    fmt.Println("Error opening file:", err)


    return


    }


    defer file.Close()


    ### 4.4.2 Custom Error Types


    You can create custom error types to provide more specific information.


    Go


    type FileNotFoundError struct {


    filename string


    }


    func (e \*FileNotFoundError) Error() string {


    return fmt.Sprintf("File not found: %s", e.filename)


    }


    ### 4.4.3 Using the errors Package


    The errors package provides functions for wrapping and unwrapping errors.


    Go


    err := fmt.Errorf("Custom error message")


    wrappedErr := errors.Wrap(err, "Something went wrong")


    fmt.Println(wrappedErr.Error())


    ### 4.4.4 Logging Errors


    Consider using a logging library to record errors for debugging and analysis.


    Go


    import "log"


    log.Println("Error:", err)


    ### 4.4.5 Returning Errors


    Functions can return errors as their second return value.


    Go


    func readFile(filename string) (\[\]byte, error) {


    // ...


    return data, err


    }


    ### 4.4.6 Providing Helpful Error Messages


    When returning errors, provide informative messages that help users understand
    the problem.


    Go


    if err != nil {


    fmt.Println("Error reading file:", err)


    }


    By effectively handling errors in your command-line tools, you can provide a better
    user experience and make your tools more robust.


    ## Additional Code Examples


    ### Example 1: A Simple File Copier


    Go


    package main


    import (


    "fmt"


    "io"


    "os"


    )


    func main() {


    sourceFile := flag.String("source", "", "Source file")


    destFile := flag.String("dest", "", "Destination file")


    flag.Parse()


    if \*sourceFile == "" || \*destFile == "" {


    fmt.Println("Please provide both source and destination file names")


    return


    }


    inputFile, err := os.Open(\*sourceFile)


    if err != nil {


    fmt.Println("Error opening source file:", err)


    return


    }


    defer inputFile.Close()


    outputFile, err := os.Create(\*destFile)


    if err != nil {


    fmt.Println("Error creating destination file:", err)


    return


    }


    defer outputFile.Close()


    \_, err = io.Copy(outputFile, inputFile)


    if err != nil {


    fmt.Println("Error copying file:", err)


    } else {


    fmt.Println("File copied successfully")


    }


    }


    This example creates a tool that copies a file from one location to another.


    ### Example 2: A Password Generator


    Go


    package main


    import (


    "fmt"


    "math/rand"


    "time"


    )


    func generatePassword(length int) string {


    chars := "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&\*()"


    rand.Seed(time.Now().UnixNano())


    password := make(\[\]byte, length)


    for i := range password {


    password\[i\] = chars\[rand.Intn(len(chars))\]


    }


    return string(password)


    }


    func main() {


    length := flag.Int("length", 12, "Password length")


    flag.Parse()


    password := generatePassword(\*length)


    fmt.Println("Generated password:", password)


    }


    This example creates a tool that generates a random password of a specified length.


    ### Example 3: A Simple Text Editor


    Go


    package main


    import (


    "bufio"


    "fmt"


    "os"


    )


    func main() {


    reader := bufio.NewReader(os.Stdin)


    fmt.Println("Enter your text (type ''quit'' to exit):")


    for {


    text, err := reader.ReadString(''\\n'')


    if err != nil {


    fmt.Println("Error reading input:", err)


    break


    }


    if text == "quit\\n" {


    break


    }


    fmt.Println("You entered:", text)


    }


    }


    This example creates a simple text editor that allows the user to enter text and
    quit the program.


    ## 5.1 Introduction


    Databases are essential for storing and managing large amounts of data. They provide
    a structured way to organize information and make it easily accessible.


    ### 5.1.1 Relational vs. Non-Relational Databases


    ●     Relational databases are based on the relational model, where data is organized
    into tables with rows and columns. This model is well-suited for structured data
    that can be represented as relationships between entities. Examples of relational
    databases include MySQL, PostgreSQL, and SQLite.


    ●     Non-relational databases (also known as NoSQL databases) are designed to
    handle unstructured or semi-structured data. They often use key-value pairs, document-oriented
    models, or graph databases. Examples of NoSQL databases include MongoDB, Redis,
    and Neo4j.


    ### 5.1.2 Choosing the Right Database


    The choice of database depends on several factors, including:


    ●     Data structure: If your data is highly structured and can be represented
    as tables, a relational database might be a good choice. If your data is less
    structured or has complex relationships, a NoSQL database might be more suitable.


    ●     Performance requirements: Consider the expected load on your database and
    how fast you need to query and update data. Some databases are better suited for
    high-performance workloads than others.


    ●     Scalability: If your application is expected to grow, you''ll need a database
    that can scale horizontally or vertically.


    ●     Features: Different databases offer different features, such as full-text
    search, spatial data, and graph capabilities.


    In this chapter, we''ll focus on relational databases using the database/sql package
    in Go.


    By understanding the basics of databases and choosing the right one for your application,
    you can effectively store and manage your data.


    ## 5.2 SQL Queries


    SQL (Structured Query Language) is a standard language for interacting with relational
    databases. It provides a declarative way to define the data you want to retrieve,
    insert, update, or delete.


    ### 5.2.1 Basic SQL Commands


    ●     SELECT: Retrieves data from a table.


    ●     INSERT: Inserts data into a table.


    ●     UPDATE: Updates existing data in a table.


    ●     DELETE: Deletes data from a table.


    ●     CREATE: Creates a new table.


    ●     DROP: Deletes a table.


    ### 5.2.2 SELECT Statement


    The SELECT statement is used to retrieve data from a table. It consists of the
    following clauses:


    ●     SELECT: Specifies the columns to retrieve.


    ●     FROM: Specifies the table to query.


    ●     WHERE: Filters the results based on conditions.


    ●     ORDER BY: Sorts the results.


    ●     LIMIT: Limits the number of rows returned.


    Example:


    SQL


    SELECT name, age FROM customers WHERE age \> 30 ORDER BY name DESC LIMIT 10;


    This query selects the name and age columns from the customers table, filters
    the results for customers older than 30, sorts the results in descending order
    by name, and limits the output to 10 rows.


    ### 5.2.3 INSERT Statement


    The INSERT statement is used to insert new data into a table.


    Example:


    SQL


    INSERT INTO customers (name, age) VALUES (''Alice'', 30);


    ### 5.2.4 UPDATE Statement


    The UPDATE statement is used to modify existing data in a table.


    Example:


    SQL


    UPDATE customers SET age \= 31 WHERE id \= 1;


    ### 5.2.5 DELETE Statement


    The DELETE statement is used to delete data from a table.


    Example:


    SQL


    DELETE FROM customers WHERE id \= 1;


    By understanding SQL queries, you can effectively interact with relational databases
    and retrieve, manipulate, and delete data.


    In the next section, we''ll explore how to use the database/sql package in Go
    to execute SQL queries.


    ## 5.3 CRUD Operations


    CRUD (Create, Read, Update, Delete) are the basic operations performed on data
    in a database.


    ### 5.3.1 Creating Records


    To create a new record in a database, use the INSERT statement.


    Example:


    Go


    \_, err := db.Exec("INSERT INTO customers (name, age) VALUES (?, ?)", "Alice",
    30)


    if err != nil {


    log.Fatal(err)


    }


    ### 5.3.2 Reading Records


    To retrieve data from a database, use the SELECT statement.


    Example:


    Go


    rows, err := db.Query("SELECT name, age FROM customers WHERE id = ?", 1)


    if err != nil {


    log.Fatal(err)


    }


    defer rows.Close()


    for rows.Next() {'
