    我的方法：


    我相信学习编程语言最好的方法是实践实践。这就是为什么书中充满了各种项目，它们将帮助你应用知识并获得手操经验。


    让我们开始吧！


    我非常期待与你分享我对比 Go 的热情。拿起你最喜欢的文本编辑器，打开终端，让我们开启这段冒险。


