    ### 3.3.3 Templating


    Templating engines allow you to create dynamic HTML content by combining static
    HTML with dynamic data.


    Go provides two built-in templating engines:


    ●     text/template: A simple templating engine for basic text formatting.


    ●     html/template: A more advanced templating engine for generating HTML.


    Example using html/template:


    Go


    import (


    "html/template"


    "net/http"


    )


    func handler(w http.ResponseWriter, r \*http.Request) {


    t := template.Must(template.ParseFiles("templates/index.html"))


    data := map\[string\]string{"name": "Alice"}


    t.Execute(w, data)


    }


    In this example, we''re loading an HTML template named index.html and executing
    it with a data map containing the name "Alice".


    Templating engines can significantly improve the maintainability and readability
    of your web applications.


    By understanding routing and templating, you can create more structured and dynamic
    web applications.


    ## 3.4 Handling Requests


    In this section, we''ll explore how to handle HTTP requests in Go.


    ### 3.4.1 Accessing Request Information


    The http.Request object provides information about the incoming request, such
    as the HTTP method, URL, query parameters, and headers.


    Go


    func handler(w http.ResponseWriter, r \*http.Request) {


    method := r.Method


    url := r.URL.Path


    query := r.URL.Query()


    // ...


    }


    ### 3.4.2 Reading Request Body


    To read the request body, use the http.Request.Body field.


    Go


    func handler(w http.ResponseWriter, r \*http.Request) {


    body, err := ioutil.ReadAll(r.Body)


    if err != nil {


    http.Error(w, "Error reading request body", http.StatusInternalServerError)


    return


    }


    // Process the request body


    }


    Remember to defer closing the request body to ensure proper resource management:


    Go


    defer r.Body.Close()


    ### 3.4.3 Writing Responses


    To write a response to the client, use the http.ResponseWriter object.


    Go


    func handler(w http.ResponseWriter, r \*http.Request) {


    w.WriteHeader(http.StatusOK)


    fmt.Fprintf(w, "Hello, world!")


    }


    You can also write custom headers:


    Go


    w.Header().Set("Content-Type", "text/plain")


    ### 3.4.4 Handling Different Methods


    You can use the r.Method field to determine the HTTP method of the request.


    Go


    func handler(w http.ResponseWriter, r \*http.Request) {


    switch r.Method {


    case "GET":


    // Handle GET requests


    case "POST":


    // Handle POST requests


    default:


    http.Error(w, "Method Not Allowed", http.StatusMethodNotAllowed)


    }


    }


    ### 3.4.5 Handling Errors


    It''s important to handle errors gracefully in your web applications.


    Go


    func handler(w http.ResponseWriter, r \*http.Request) {


    // ...


    if err != nil {


    http.Error(w, "An error occurred", http.StatusInternalServerError)


    return


    }


    }


    By understanding how to handle requests, you can create more robust and interactive
    web applications.


    ## 4.1 Parsing Arguments


    Command-line tools often take arguments to customize their behavior. Parsing arguments
    allows you to extract and process the information provided by the user.


    ### 4.1.1 Using the flag Package


    The flag package is a standard library in Go that provides functions for parsing
    command-line flags.


    Example:


    Go


    package main


    import (


    "flag"


    "fmt"


    )


    func main() {


    nameFlag := flag.String("name", "World", "Name to greet")


    ageFlag := flag.Int("age", 25, "Age")


    flag.Parse()


    fmt.Println("Hello,", \*nameFlag, "you are", \*ageFlag, "years old.")


    }


    In this example, we define two flags: \-name and \-age. The flag.String and flag.Int
    functions create flags of type string and int, respectively. The second argument
    is the default value for the flag, and the third argument is a description of
    the flag.


    To run this program:


    Bash


    go run main.go -name Alice -age 30


    This will output:


    Hello, Alice you are 30 years old.


    ### 4.1.2 Parsing Positional Arguments


    Positional arguments are arguments that are not preceded by a flag. You can access
    positional arguments using the flag.Args() function.


    Example:


    Go


    package main


    import (


    "flag"


    "fmt"


    )


    func main() {


    flag.Parse()


    args := flag.Args()


    fmt.Println("Arguments:", args)


    }


    ### 4.1.3 Boolean Flags


    To create a boolean flag, use the flag.Bool function.


    Go


    verboseFlag := flag.Bool("verbose", false, "Enable verbose output")


    ### 4.1.4 Custom Flag Functions


    You can create custom flag functions using the flag.Var function.


    Go


    type Color string


    func (c \*Color) String() string {


    return string(\*c)


    }


    func (c \*Color) Set(value string) error {


    \*c = Color(value)


    return nil


    }


    func main() {


    colorFlag := flag.String("color", "red", "Color")


    var customColor Color


    flag.Var(&customColor, "custom-color", "Custom color")


    flag.Parse()


    fmt.Println("Color:", \*colorFlag)


    fmt.Println("Custom color:", customColor)


    }


    By understanding how to parse command-line arguments, you can create more flexible
    and customizable command-line tools.


    ## 4.2 Using os/exec


    The os/exec package provides functions for executing external commands. This is
    useful for interacting with other programs or operating system utilities.


    ### 4.2.1 Executing Commands


    To execute a command, you can use the exec.Command function and the Cmd.Run or
    Cmd.CombinedOutput methods.


    Example:


    Go


    package main


    import (


    "fmt"


    "os/exec"


    )


    func main() {


    cmd := exec.Command("ls", "-l")


    output, err := cmd.CombinedOutput()


    if err != nil {


    fmt.Println("Error:", err)


    }


    fmt.Println(string(output))


    }


    In this example, we execute the ls -l command, which lists files and directories
    in the current directory. The CombinedOutput method captures both the standard
    output and standard error of the command.


    ### 4.2.2 Passing Arguments


    To pass arguments to a command, provide them as additional arguments to the exec.Command
    function.


    Go


    cmd := exec.Command("echo", "Hello, world!")


    ### 4.2.3 Setting Environment Variables


    You can set environment variables for the command using the Cmd.Env method.


    Go


    cmd.Env = append(os.Environ(), "MY\_VAR=value")


    ### 4.2.4 Redirecting Output


    You can redirect the standard output and standard error of a command using the
    Cmd.Stdout, Cmd.Stderr, and Cmd.Stdin fields.


    Go


    cmd.Stdout = os.Stdout


    cmd.Stderr = os.Stderr


    ### 4.2.5 Waiting for Completion


    The Cmd.Wait method waits for the command to complete and returns an error if
    the command exits with a non-zero status.


    Go


    err := cmd.Wait()


    if err != nil {


    fmt.Println("Error:", err)


    }


    By understanding how to use the os/exec package, you can interact with other programs
    and utilities from within your Go applications.


    ## 4.3 Creating a Tool


    Let''s create a simple command-line tool that greets the user.


    ### 4.3.1 Creating a New File


    ●     Create a new file named greet.go.


    ### 4.3.2 Adding the Code


    Go


    package main


    import (


    "flag"


    "fmt"


    )


    func main() {


    nameFlag := flag.String("name", "World", "Name to greet")


    flag.Parse()


    fmt.Println("Hello,", \*nameFlag)


    }


    ### 4.3.3 Building the Executable


    ●     In your terminal, navigate to the directory where you saved greet.go.


    ●     Run the following command:


    Bash


    go build greet.go


    This will create an executable file named greet in the same directory.


    ### 4.3.4 Running the Tool


    ●     To run the tool, type the following command in your terminal:


    Bash


    ./greet


    This will output:


    Hello, World


    You can also provide a custom name using the \-name flag:


    Bash


    ./greet -name Alice


    This will output:


    Hello, Alice


    You can customize the tool further by adding more features and options. For example,
    you could allow the user to specify a greeting message or choose from a list of
    predefined greetings.'
