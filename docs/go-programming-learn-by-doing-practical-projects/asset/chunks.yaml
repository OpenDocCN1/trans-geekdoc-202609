    \ capitals map[string]string\n```\n\nCreating maps:\n\n```go\ncapitals = map[string]string{\n\
    \    \"France\": \"Paris\",\n    \"Italy\": \"Rome\",\n}\n```\n\nAccessing and\
    \ modifying elements:\n\n```go\nfmt.Println(capitals[\"France\"]) // Output: Paris\n\
    capitals[\"Germany\"] = \"Berlin\"\n```\n\nChecking if a key exists:\n\n```go\n\
    if capital, ok := capitals[\"Spain\"]; ok {\n    fmt.Println(\"The capital is\"\
    , capital)\n} else {\n    fmt.Println(\"Spain is not in the map.\")\n}\n```\n\n\
    Collections are essential for storing and manipulating data in Go. By understanding\
    \ arrays, slices, and maps, you can create more efficient and flexible data structures.\
    \ In the next chapter, we'll explore more advanced topics, such as concurrency\
    \ and error handling.\n\n## 3.1 HTTP Basics\n\nHTTP (Hypertext Transfer Protocol)\
    \ is the foundation of the modern web. It's a protocol that defines how clients\
    \ (like web browsers) communicate with servers to request and receive resources.\n\
    \n### 3.1.1 Request-Response Cycle\n\n- `Client`: Sends an HTTP request to a server.\n\
    - `Server`: Processes the request, retrieves the requested resource, and sends\
    \ an HTTP response back to the client.\n- `Client`: Receives the response and\
    \ displays the content.\n\n### 3.1.2 HTTP Methods\n\nThere are several HTTP methods\
    \ used to perform actions:\n\n- `GET`: Retrieves a resource.\n- `POST`: Sends\
    \ data to the server to create or update a resource.\n- `PUT`: Updates an existing\
    \ resource.\n- `DELETE`: Deletes a resource.\n- `HEAD`: Similar to `GET`, but\
    \ only returns the headers of the response.\n- `OPTIONS`: Returns the allowed\
    \ methods.\n- `PATCH`: Applies partial updates to a resource.\n\n### 3.1.3 Status\
    \ Codes\n\nHTTP status codes are used to indicate the outcome of a request. Here\
    \ are some status codes:\n\n- `200 OK`: The request was successful.\n- `301 Moved\
    \ Permanently`: The resource has been moved to a new location.\n- `400 Bad Request`:\
    \ The server could not understand the request.\n- `401 Unauthorized`: The client\
    \ is not authorized to access the resource.\n- `404 Not Found`: The requested\
    \ resource could not be found.\n- `500 Internal Server Error`: The server encountered\
    \ an error while processing the request.\n\n### 3.1.4 HTTP Headers\n\nHTTP headers\
    \ provide additional information about the request or response. Some common headers\
    \ include:\n\n- `User-Agent`: The client's user agent (e.g., web browser).\n-\
    \ `Content-Type`: The MIME type of the content.\n- `Content-Length`: The length\
    \ of the content in bytes.\n- `Cookie`: Cookies sent with the request.\n\nUnderstanding\
    \ these basic concepts of HTTP is crucial for building web applications in Go.\
    \ In the next section, we'll dive into creating a simple server.\n\n## 3.2 Simple\
    \ Server\n\nNow that we understand the basics of HTTP, let's create a simple HTTP\
    \ server in Go.\n\n### 3.2.1 Creating a New Project\n\n- Create a new directory:\
    \ Choose a directory where you want to store your project.\n- Initialize a new\
    \ Go module: In the terminal, navigate to the directory and run `go mod init your_project_name`.\
    \ This will create a `go.mod` file that specifies the module name and dependencies.\n\
    \n### 3.2.2 Writing the Server Code\n\nCreate a new file named `main.go` and add\
    \ the following code:\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"\
    net/http\"\n)\n\nfunc handler(w http.ResponseWriter, r *http.Request) {\n    fmt.Fprintf(w,\
    \ \"Hello, world!\")\n}\n\nfunc main() {\n    http.HandleFunc(\"/\", handler)\n\
    \    http.ListenAndServe(\":8080\", nil)\n}\n```\n\nBreakdown of the code:\n\n\
    - `package main`: Declares that this is the main package of the application.\n\
    - `import \"net/http\"`: Imports the `net/http` package, which provides functions\
    \ for handling HTTP requests and responses.\n- `func handler(w http.ResponseWriter,\
    \ r *http.Request)`: Defines a handler function that takes an `http.ResponseWriter`\
    \ and an `http.Request` as arguments.\n- `fmt.Fprintf(w, \"Hello, world!\")`:\
    \ Writes the message \"Hello, world!\" to the response writer.\n- `http.HandleFunc(\"\
    /\", handler)`: Registers the handler function for the root path `/`.\n- `http.ListenAndServe(\"\
    :8080\", nil)`: Starts the HTTP server on port 8080.\n\n### 3.2.3 Running the\
    \ Server\n\n- Save the file: Save the `main.go` file.\n- Run the program: In the\
    \ terminal, run `go run main.go`.\n- Access the server: Open a web browser and\
    \ navigate to `http://localhost:8080`. You should see the message \"Hello, world!\"\
    \ displayed.\n\nCongratulations! You've successfully created a basic HTTP server\
    \ in Go. In the next section, we'll explore how to handle different routes and\
    \ render dynamic content.\n\n## 3.3 Routing and Templating\n\nRouting allows you\
    \ to handle different requests based on their URL paths. Templating enables you\
    \ to create dynamic HTML content.\n\n### 3.3.1 Routing\n\nThe `http.HandleFunc`\
    \ function can be used to register handlers for specific routes:\n\n```go\nhttp.HandleFunc(\"\
    /\", func(w http.ResponseWriter, r *http.Request) {\n    fmt.Fprintf(w, \"Home\
    \ page\")\n})\n\nhttp.HandleFunc(\"/about\", func(w http.ResponseWriter, r *http.Request)\
    \ {\n    fmt.Fprintf(w, \"About page\")\n})\n```\n\nThis code defines two handlers:\
    \ one for the root path `/` and one for the `/about` path.\n\n### 3.3.2 Using\
    \ a Router Library\n\nFor more complex routing scenarios, consider using a router\
    \ library like `gorilla/mux`.\n\n```go\nimport (\n    \"fmt\"\n    \"net/http\"\
    \n    \"github.com/gorilla/mux\"\n)\n\nfunc main() {\n    router := mux.NewRouter()\n\
    }\n```\n"
  trans: "\n在 Go 中定义函数，你使用 `func` 关键字，后面后跟函数名、参数和返回类型。\n\n```go\nfunc functionName(parameter1\
    \ type, parameter2 type) returnType {\n    // 函数体\n}\n```\n\n示例：\n\n```go\nfunc\
    \ greet(name string) {\n    fmt.Println(\"Hello, \" + name + \"!\")\n}\n```\n\n\
    在这个示例中，我们定义了一个名为 `greet` 的函数，它接收一个名为 `name` 的字符串参数，并打印一条问候消息。\n\n### 2.4.2 调用函数\n\
    \n要调用函数，你使用函数名并在后跟包含参数的括号。\n\n示例：\n\n```go\ngreet(\"Alice\")\n```\n\n### 2.4.3\
    \ 返回值\n\n函数可以使用 `return` 关键字返回结果。\n\n```go\nfunc add(x, y int) int {\n    return\
    \ x + y\n}\n```\n\n示例：\n\n```go\nresult := add(5, 3)\nfmt.Println(result) // 输出:\
    \ 8\n```\n\n### 2.4.4 包（Packages）\n\n包是 Go 文件的集合，被组织成层级结构。它们提供了一种代码模块化的方法并使其更容易管理。\n\
    \n要使用一个包，你使用 `import` 关键字导入它。\n\n示例：\n\n```go\npackage main\nimport \"fmt\"\n\n\
    func main() {\n    fmt.Println(\"Hello, world!\")\n}\n```\n\n你可以通过将 Go 文件放置在与包同名的目录中来创建自己的包。例如，要创建一个名为\
    \ `math` 的包，你会将 Go 文件置于名为 `math` 的目录中。\n\n函数和包是 Go 程序的底层构建块。通过有效使用它们，你可以编写出更有组织、可重用且易于维护的代码。\n\
    \n## 2.5 集合（Collections）\n\n集合是允许你在单个变量中存储多个值的数据结构。Go 提供了几种内置集合类型：数组（arrays）、切片（slices）和映射（maps）。\n\
    \n### 2.5.1 数组（Arrays）\n\n数组是固定大小相同类型元素的集合。数组的大小在声明时指定。\n\n```go\nvar numbers\
    \ [5]int\n```\n\n这声明了一个名为 `numbers` 的数组，它可以容纳 5 个整数值。\n\n访问元素：\n\n```go\nnumbers[0]\
    \ = 10\nnumbers[1] = 20\nfmt.Println(numbers[2]) // 输出: 0（默认值）\n```\n\n### 2.5.2\
    \ 切片（Slices）\n\n切片是动态大小的数组，提供了更大的灵活性。它们由底层数组支持，可以根据需要调整大小。\n\n```go\nvar fruits\
    \ []string\n```\n\n创建切片：\n\n```go\nfruits = []string{\"apple\", \"banana\", \"\
    orange\"}\n```\n\n访问并修改元素：\n\n```go\nfmt.Println(fruits[1]) // 输出: banana\nfruits[2]\
    \ = \"grape\"\n```\n\n追加元素：\n\n```go\nfruits = append(fruits, \"mango\")\n```\n\
    \n切片操作：\n\n```go\nslicedFruits := fruits[1:3] // 从索引 1 到 2（不包含 2）创建一个切片\n```\n\
    \n### 2.5.3 映射（Maps）\n\n映射是键值对。键必须是唯一的，而值可以是任何类型。\n\n```go\nvar capitals map[string]string\n\
    ```\n\n创建映射：\n\n```go\ncapitals = map[string]string{\n    \"France\": \"Paris\"\
    ,\n    \"Italy\": \"Rome\",\n}\n```\n\n访问并修改元素：\n\n```go\nfmt.Println(capitals[\"\
    France\"]) // 输出: Paris\ncapitals[\"Germany\"] = \"Berlin\"\n```\n\n检查键是否存在：\n\
    \n```go\nif capital, ok := capitals[\"Spain\"]; ok {\n    fmt.Println(\"The capital\
    \ is\", capital)\n} else {\n    fmt.Println(\"Spain is not in the map.\")\n}\n\
    ```\n\n集合是允许你在单个变量中存储多个值的数据结构。Go 提供了几种内置集合类型：数组、切片和映射。\n\nHTTP（超文本传输协议）是基础。它定义了浏览器与服务器如何通信。\n\
    \n### 3.1 HTTP 基础\n\nHTTP 协议。\n\n### 3.1.1 请求-响应循环\n\n`http.HandleFunc` 函数可以用于注册特定路由的处理函数。\n\
    \n### 3.1.2 请求方法\n\nHTTP 方法用于执行操作。\n\n### 3.1.3 状态码\n\nHTTP 状态码用于请求的结果。\n\n###\
    \ 3.1.4 标头\n\nHTTP 标头提供了请求的信息。\n\n## 3.2  服务器\n\n现在我们理解了 HTTP 的基础，让我们创建一个服务器。\n\
    \n### 3.2.1 创建新项目\n\n### 3.2.2 编写服务器代码\n\n### 3.2.3 运行服务器\n\n## 3.3 路由与模板\n\n\
    路由允许你根据 URL 路径处理不同的请求。模板允许你创建动态 HTML 内容。\n\n### 3.3.1 路由\n\n### 3.3.2 使用路由库\n"
