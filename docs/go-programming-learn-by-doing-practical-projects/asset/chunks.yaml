- raw: 'You can set these variables in your operating system''s environment settings.
    For example, on Windows, you can set them in the System Properties dialog.


    ### 1.3 Writing Your First Go Program


    1\. Create a New File:


    ●     Create a new text file with a .go extension. For example, you could name
    it hello.go.


    2\. Write the Code:


    ●     Paste the following code into the file:


    Go


    package main


    import "fmt"


    func main() {


    fmt.Println("Hello, world!")


    }


    3\. Run the Program:


    ●     Open a terminal or command prompt and navigate to the directory where you
    saved hello.go.


    ●     Type go run hello.go and press Enter.


    ●     You should see the message "Hello, world!" printed to the console.


    Breakdown of the Code:


    ●     package main: This line declares that the file is part of the main package,
    which is required for executable Go programs.


    ●     import "fmt": This line imports the fmt package, which provides functions
    for formatted I/O.


    ●     func main(): This line defines the main function, which is the entry point
    of your program.


    ●     fmt.Println("Hello, world!"): This line uses the Println function from the
    fmt package to print the message "Hello, world!" to the console.


    Congratulations! You''ve just written your first Go program.


    In the next chapter, we''ll delve deeper into the Go language and explore its
    core features.


    ## 1.2 Setup


    Setting up your Go development environment is a crucial step before you can start
    writing Go code.


    ### 1.2.1 Downloading and Installing Go


    ●     Visit the official Go website: Go to [](https://go.dev/) [https://go.dev/](https://go.dev/)


    ●     Choose the appropriate installer: Select the installer that matches your
    operating system (Windows, macOS, or Linux).


    ●     Follow the installation instructions: The installation process is usually
    straightforward. Just follow the on-screen prompts.


    Tip: If you encounter any issues during the installation process, refer to the
    Go documentation or search for help online.


    ### 1.2.2 Verifying Your Installation


    ●     Open a terminal or command prompt: This is a window where you can enter
    text-based commands.


    ●     Type go version: This command will check if Go is installed correctly and
    display the version number.


    ●     Check the output: If Go is installed, you should see something like "go
    version go1.21.0".


    ### 1.2.3 Setting Up Your Environment Variables (Optional)


    While not strictly necessary, setting up the GOROOT and GOPATH environment variables
    can make working with Go more convenient.


    ●     GOROOT: This variable specifies the root directory of your Go installation.


    ●     GOPATH: This variable specifies the workspace where you''ll store your Go
    projects.


    Here''s how to set these variables on different operating systems:


    Windows:


    1.    Open the Control Panel.


    2.    Go to System and Security > System.


    3.    Click on Advanced system settings.


    4.    Go to the Environment Variables tab.


    5.    Under User variables for \[your username\], click New.


    6.    Enter GOROOT as the variable name and the path to your Go installation directory
    (e.g., C:\\Go) as the variable value.


    7.    Click OK.


    8.    Repeat the process for GOPATH, setting the value to a directory where you
    want to store your Go projects (e.g., C:\\Users\\\[your username\]\\go).


    macOS:


    1.    Open the Terminal.


    2.    Edit your .bash\_profile or .zshrc file (depending on your shell).


    3.    Add the following lines:


    Bash


    export GOROOT=/usr/local/go


    export GOPATH=$HOME/go


    4.    Save the file and close the terminal.


    5.    Reopen the terminal for the changes to take effect.


    Linux:


    1.    Open a terminal.


    2.    Edit your .bashrc or .zshrc file.


    3.    Add the following lines:


    Bash


    export GOROOT=/usr/local/go


    export GOPATH=$HOME/go


    4.    Save the file and close the terminal.


    5.    Reopen the terminal for the changes to take effect.


    Note: The exact paths may vary depending on where you installed Go. You can find
    the default installation directory by checking the Go documentation or using the
    go env command in your terminal.


    That''s it! You''ve now successfully set up your Go development environment. In
    the next section, we''ll write our first Go program.


    ## 1.3 First Program


    Now that we''ve set up our development environment, let''s write our first Go
    program.


    ### 1.3.1 Creating a New File


    ●     Open a text editor: Choose your preferred text editor, such as Visual Studio
    Code, Sublime Text, or Atom.


    ●     Create a new file: Save the file with a .go extension. For example, you
    could name it hello.go.


    ### 1.3.2 Writing the Code


    ●     Paste the following code into the file:


    Go


    package main


    import "fmt"


    func main() {


    fmt.Println("Hello, world!")


    }


    Breakdown of the code:


    ●     package main: This line declares that the file is part of the main package,
    which is required for executable Go programs.


    ●     import "fmt": This line imports the fmt package, which provides functions
    for formatted I/O.


    ●     func main(): This line defines the main function, which is the entry point
    of your program.


    ●     fmt.Println("Hello, world!"): This line uses the Println function from the
    fmt package to print the message "Hello, world!" to the console.


    ### 1.3.3 Running the Program


    ●     Open a terminal or command prompt: Navigate to the directory where you saved
    hello.go.


    ●     Type go run hello.go: This command will compile and run your Go program.


    ●     View the output: You should see the message "Hello, world!" printed to the
    console.


    Congratulations! You''ve successfully created and run your first Go program.


    Let''s break down the code in more detail:


    ●     package main: This line tells Go that this file is part of the main package.
    The main package is special because it''s the entry point for executable Go programs.


    ●     import "fmt": This line imports the fmt package, which provides functions
    for formatted I/O. The fmt package is often used for printing messages to the
    console.


    ●     func main(): This line defines the main function, which is the entry point
    of your program. All Go programs must have a main function.


    ●     fmt.Println("Hello, world!"): This line calls the Println function from
    the fmt package. The Println function takes one or more arguments and prints them
    to the console, separated by a space.


    Now that you''ve written your first Go program, you''re ready to explore the language
    further. In the next chapter, we''ll delve into the basic syntax and structure
    of Go code.


    ## 1.4 Basic Syntax


    Now that you''ve written your first Go program, let''s take a closer look at the
    basic syntax and structure of Go code.


    ### 1.4.1 Comments


    ●     Single-line comments: Start with a //.


    ●     Multi-line comments: Enclosed between /\* and \*/.


    Example:


    Go


    // This is a single-line comment


    /\*


    This is a multi-line comment.


    You can write multiple lines here.


    \*/


    ### 1.4.2 Variables


    ●     Declare variables: Use the var keyword followed by the variable name and
    type.


    ●     Assign values: Use the :\= operator for short variable declarations.


    Example:


    Go


    var message string


    message = "Hello, world!"


    name := "Alice"


    ### 1.4.3 Data Types


    ●     Basic data types: int, float64, string, bool.


    ●     Other data types: byte, rune, complex64, complex128.


    Example:


    Go


    var age int = 30


    var pi float64 = 3.14159


    var isStudent bool = true


    ### 1.4.4 Operators


    ●     Arithmetic operators: +, \-, \*, /, %.


    ●     Comparison operators: \=\=, !\=, <, \>, <\=, \>\=.


    ●     Logical operators: &&, ||, !.


    Example:


    Go


    result := 5 + 3


    isEven := number % 2 == 0


    ### 1.4.5 Control Flow


    ●     if statements: Conditional execution.


    ●     else statements: Alternative execution.


    ●     switch statements: Multiple-choice selection.


    ●     for loops: Repeated execution.


    Example:


    Go


    if age >= 18 {


    fmt.Println("You are an adult.")


    } else {


    fmt.Println("You are a minor.")


    }


    switch dayOfWeek {


    case "Monday", "Tuesday", "Wednesday", "Thursday", "Friday":


    fmt.Println("It''s a weekday.")'
