    ## 5.4 Database Connections


    To connect to a database in Go, you need to use the database/sql package.


    ### 5.4.1 Database Drivers


    The database/sql package provides a generic interface for interacting with databases.
    However, you''ll need to use a specific database driver to connect to a particular
    database system.


    Common database drivers:


    ●     mysql: For MySQL databases


    ●     postgres: For PostgreSQL databases


    ●     sqlite3: For SQLite databases


    ●     mssql: For Microsoft SQL Server databases


    ### 5.4.2 Connection Strings


    A connection string specifies the details of the database connection, such as
    the driver name, database address, username, password, and database name.


    Example:


    Go


    db, err := sql.Open("mysql", "user:password@tcp(localhost:3306)/mydb")


    In this example, we''re connecting to a MySQL database on localhost using the
    username user and password password. The database name is mydb.


    ### 5.4.3 Opening and Closing Connections


    To open a database connection, use the sql.Open function. To close the connection,
    use the db.Close method.


    Example:


    Go


    db, err := sql.Open("mysql", "user:password@tcp(localhost:3306)/mydb")


    if err != nil {


    log.Fatal(err)


    }


    defer db.Close()


    ### 5.4.4 Error Handling


    Always check for errors when opening a database connection.


    Go


    db, err := sql.Open("mysql", "user:password@tcp(localhost:3306)/mydb")


    if err != nil {


    log.Fatal(err)


    }


    By understanding how to connect to databases in Go, you can effectively interact
    with your data.


    In the next chapter, we''ll explore how to build web applications with Go.


