    \ 6.1 REST 原则\n\nREST（表述状态转移）是一种设计网络服务的架构风格，强调简单性和可扩展性。\n\n### 6.1.1 无状态\n\nREST\
    \ 的核心原则之一是无状态的。这意味着每个请求都是独立的，不依赖于之前的请求。\n\n### 6.1.2 客户端-服务器分离\n\nREST 促进了客户端和服务器之间关注点的分离。这使得\
    \ API 更易于扩展。\n\n### 6.1.3 可缓存性\n\nREST API 可以利用缓存来提高性能。响应可以被客户端或中间服务器缓存，减少服务器负载。\n\
    \n### 6.1.4 层系统\n\nREST API 可以被设计为层系统，由不同的层处理特定的关注。常见的层包括：\n\n* 展示层：处理用户交互和展示。\n\
    * 应用层：处理业务逻辑和特定的任务。\n* 数据访问层：处理与数据库或其他存储的交互。\n\n### 6.1.5 统一接口\n\nREST API 应该基于\
    \ HTTP 方法和 URI 使用统一接口。这使得客户端更容易理解和交互。\n\n* `GET`: 获取资源。\n* `POST`: 创建新资源。\n* `PUT`:\
    \ 更新现有资源。\n* `PATCH`: 对资源进行部分更新。\n* `DELETE`: 删除资源。\n\n通过遵循这些 原则，你可以创建结构良好、可扩展且易于维护的\
    \ API。\n\n"
