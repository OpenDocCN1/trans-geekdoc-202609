    ### 6.2.4 Middleware


    Middleware functions are executed before and after request handlers. They can
    be used for tasks like authentication, logging, and error handling.


    Go


    router.Use(func(c \*gin.Context) {


    // Middleware logic


    c.Next()


    })


    ### 6.2.5 Additional Features


    Web frameworks often provide additional features such as:


    ●     Templating: Rendering HTML templates.


    ●     Session management: Storing user data across requests.


    ●     Database integration: Connecting to databases.


    ●     Security features: Protecting against vulnerabilities like SQL injection
    and cross-site scripting.


    By using a web framework, you can significantly simplify the development of RESTful
    APIs in Go.


    ## 6.3 Designing Endpoints


    Endpoints are the URLs that clients use to interact with your API. A well-designed
    endpoint structure can make your API easier to understand and use.


    ### 6.3.1 RESTful Conventions


    When designing endpoints, it''s important to follow RESTful conventions:


    ●     Use HTTP methods: Use appropriate HTTP methods to represent different actions:


    ○     GET: Retrieve a resource.


    ○     POST: Create a new resource.


    ○     PUT: Update an existing resource.


    ○     PATCH: Apply partial updates to a resource.


    ○     DELETE: Delete a resource.


    ●     Use nouns for resources: Use nouns in your endpoint URLs to represent the
    resources you''re exposing.


    ●     Use query parameters: Use query parameters to filter, sort, or paginate
    data.


    ●     Use HTTP status codes: Return appropriate HTTP status codes to indicate
    the success or failure of a request.


    ### 6.3.2 Example Endpoints


    Here are some examples of RESTful endpoints:


    ●     GET /users: Retrieve a list of users.


    ●     GET /users/:id: Retrieve a specific user by ID.


    ●     POST /users: Create a new user.


    ●     PUT /users/:id: Update a user.


    ●     DELETE /users/:id: Delete a user.


    ●     GET /products?category=electronics: Retrieve a list of products in the "electronics"
    category.


    ### 6.3.3 Versioning


    If you plan to make significant changes to your API, consider versioning your
    endpoints. This allows you to maintain compatibility with existing clients while
    introducing new features or breaking changes.


    Go


    router.GET("/api/v1/users", ...)


    router.GET("/api/v2/users", ...)


    ### 6.3.4 Error Handling


    Provide clear and informative error messages to help clients understand and troubleshoot
    issues. Return appropriate HTTP status codes to indicate errors.


    Go


    router.GET("/users/:id", func(c \*gin.Context) {


    id, err := strconv.Atoi(c.Param("id"))


    if err != nil {


    c.JSON(400, gin.H{"error": "Invalid ID"})


    return


    }


    // ...


    })


    By following these guidelines, you can design RESTful APIs that are easy to use,
    understand, and maintain.


    ## 6.4 JSON Handling


    JSON (JavaScript Object Notation) is a popular data format for transmitting data
    between clients and servers. Go provides built-in support for JSON encoding and
    decoding.


    ### 6.4.1 Encoding JSON


    To encode a Go object into JSON, use the json.Marshal function.


    Go


    type User struct {


    ID   int    \`json:"id"\`


    Name string \`json:"name"\`


    }


    func main() {


    user := User{ID: 1, Name: "Alice"}


    data, err := json.Marshal(user)


    if err != nil {


    // Handle error


    }


    fmt.Println(string(data))


    }


    This will output:


    JSON


    {"id":1,"name":"Alice"}


    ### 6.4.2 Decoding JSON


    To decode JSON into a Go object, use the json.Unmarshal function.


    Go


    var user User


    err := json.Unmarshal(\[\]byte(\`{"id":1,"name":"Alice"}\`), &user)


    if err != nil {


    // Handle error


    }


    fmt.Println(user.ID, user.Name)


    ### 6.4.3 Customizing JSON Encoding


    You can customize JSON encoding using the json:"omitempty" tag to omit empty fields.


    Go


    type User struct {


    ID   int    \`json:"id"\`


    Name string \`json:"name"\`


    Age  int    \`json:"age,omitempty"\`


    }


    ### 6.4.4 Handling JSON Errors


    Always check for errors when encoding or decoding JSON.


    Go


    data, err := json.Marshal(user)


    if err != nil {


    // Handle error


    }


    ### 6.4.5 Using JSON with Gin


    Gin provides helper functions for working with JSON.


    Go


    c.JSON(200, gin.H{


    "message": "Hello, world!",


    })


    By understanding JSON handling, you can effectively transmit data between your
    API and clients.


    In the next chapter, we''ll explore concurrency and parallelism in Go.


    ## Additional Code Examples


    ### Example 1: Creating a RESTful API for a To-Do List


    Go


    package main


    import (


    "encoding/json"


    "net/http"


    "github.com/gin-gonic/gin"


    )


    type Task struct {


    ID      int    \`json:"id"\`


    Title   string \`json:"title"\`


    IsDone bool    \`json:"isDone"\`


    }


    var tasks \[\]Task


    func main() {


    router := gin.Default()


    router.GET("/tasks", func(c \*gin.Context) {


    c.JSON(200, tasks)


    })


    router.POST("/tasks", func(c \*gin.Context) {


    var task Task


    if err := c.BindJSON(&task); err != nil {


    c.JSON(400, gin.H{"error": err.Error()})


    return


    }


    task.ID = len(tasks) + 1


    tasks = append(tasks, task)


    c.JSON(201, task)


    })


    router.PUT("/tasks/:id", func(c \*gin.Context) {


    id := c.Param("id")


    var task Task


    if err := c.BindJSON(&task); err != nil {


    c.JSON(400, gin.H{"error": err.Error()})


    return


    }


    for i, t := range tasks {


    if t.ID == id {


    tasks\[i\] = task


    c.JSON(200, task)


    return


    }


    }


    c.JSON(404, gin.H{"error": "Task not found"})


    })


    router.DELETE("/tasks/:id", func(c \*gin.Context) {


    id := c.Param("id")


    for i, t := range tasks {


    if t.ID == id {


    tasks = append(tasks\[:i\], tasks\[i+1:\]...)


    c.JSON(204, nil)


    return


    }


    }


    c.JSON(404, gin.H{"error": "Task not found"})


    })


    router.Run(":8080")


    }


    This example creates a simple RESTful API for managing a to-do list. It includes
    endpoints for retrieving, creating, updating, and deleting tasks.


    ### Example 2: Authenticating Users with JWT


    Go


    package main


    import (


    "fmt"


    "net/http"


    "time"


    "github.com/gin-gonic/gin"


    "github.com/golang-jwt/jwt"


    )


    func main() {


    router := gin.Default()


    router.POST("/login", func(c \*gin.Context) {


    // ... authenticate user


    token := jwt.NewWithClaims(jwt.SigningMethodHS256, jwt.MapClaims{


    "sub": "user1",


    "exp": time.Now().Add(time.Hour).Unix(),


    })


    tokenString, err := token.SignedString(\[\]byte("your-secret-key"))


    if err != nil {


    c.JSON(500, gin.H{"error": "Internal server error"})


    return


    }


    c.JSON(200, gin.H{"token": tokenString})


    })


    router.GET("/protected", func(c \*gin.Context) {


    tokenString := c.GetHeader("Authorization")


    if tokenString == "" {


    c.JSON(401, gin.H{"error": "Unauthorized"})


    return


    }


    token, \_, err := jwt.ParseEmpty(tokenString, func(token \*jwt.Token) (interface{},
    error) {


    return \[\]byte("your-secret-key"), nil


    })


    if err != nil || !token.Valid() {


    c.JSON(401, gin.H{"error": "Unauthorized"})


    return


    }


    c.JSON(200, gin.H{"message": "Authorized"})


    })


    router.Run(":8080")


    }


    This example demonstrates how to implement basic authentication using JSON Web
    Tokens (JWT) in a Gin-based API.


    ## 7.1 Goroutines and Channels


    Goroutines are lightweight threads of execution that allow you to run multiple
    functions concurrently within a single Go program. Channels are used to communicate
    between goroutines.


    ### 7.1.1 Creating Goroutines


    To create a goroutine, use the go keyword followed by a function call.


    Go


    go func() {


    fmt.Println("Hello from goroutine")


    }()


    This code will start a new goroutine that executes the anonymous function.


    ### 7.1.2 Channels


    Channels are used to send and receive values between goroutines. They are created
    using the make function.


    Go


    ch := make(chan int)


    Sending values:


    Go


    ch <- 42


    Receiving values:


    Go


    value := <-ch


