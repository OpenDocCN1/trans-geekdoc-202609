    result to the console.


    ### Example 2: Checking if a Number is Prime


    Go


    package main


    import "fmt"


    func isPrime(number int) bool {


    if number <= 1 {


    return false


    }


    for i := 2; i\*i <= number; i++ {


    if number%i == 0 {


    return false


    }


    }


    return true


    }


    func main() {


    num := 17


    if isPrime(num) {


    fmt.Printf("%d is a prime number.\\n", num)


    } else {


    fmt.Printf("%d is not a prime number.\\n", num)


    }


    }


    This code defines a function isPrime that checks if a given number is prime. It
    then uses this function to determine if the number 17 is prime.


    ### Example 3: Creating a Simple Calculator


    Go


    package main


    import "fmt"


    func main() {


    var num1, num2 float64


    var operator string


    fmt.Print("Enter the first number: ")


    fmt.Scan(&num1)


    fmt.Print("Enter the second number: ")


    fmt.Scan(&num2)


    fmt.Print("Enter the operator (+, -, \*, /): ")


    fmt.Scan(&operator)


    switch operator {


    case "+":


    result := num1 + num2


    fmt.Printf("%.2f + %.2f = %.2f\\n", num1, num2, result)


    case "-":


    result := num1 - num2


    fmt.Printf("%.2f - %.2f = %.2f\\n", num1, num2, result)


    case "\*":


    result := num1 \* num2


    fmt.Printf("%.2f \* %.2f = %.2f\\n", num1, num2, result)


    case "/":


    result := num1 / num2


    fmt.Printf("%.2f / %.2f = %.2f\\n", num1, num2, result)


    default:


    fmt.Println("Invalid operator")


    }


    }


    This code creates a simple calculator that allows the user to enter two numbers
    and an operator, and then performs the corresponding calculation.


    ## 2.1 Variables and Data Types


    Variables are essential building blocks in any programming language. They allow
    you to store and manipulate data within your code. In Go, variables are used to
    hold values of different types.


    ### 2.1.1 Declaring Variables


    To declare a variable in Go, you use the var keyword followed by the variable
    name and its type. Here''s a basic example:


    Go


    var message string


    var age int


    var pi float64


    In this example, we''ve declared three variables:


    ●     message of type string


    ●     age of type int


    ●     pi of type float64


    ### 2.1.2 Assigning Values


    Once you''ve declared a variable, you can assign a value to it using the assignment
    operator (\=). Here''s how to assign values to the variables we declared earlier:


    Go


    message = "Hello, world!"


    age = 30


    pi = 3.14159


    ### 2.1.3 Type Inference


    Go also supports type inference, which allows the compiler to automatically determine
    the type of a variable based on its initial value. You can use the :\= operator
    for short variable declarations:


    Go


    name := "Alice"


    count := 10


    ### 2.1.4 Data Types


    Go has a rich set of data types to represent different kinds of values. Here are
    some commonly used data types:


    ●     int: Integer values (e.g., 10, \-5)


    ●     float64: Floating-point numbers (e.g., 3.14159)


    ●     string: Sequences of characters (e.g., "Hello, world!")


    ●     bool: Boolean values (true or false)


    ●     byte: An alias for uint8 (unsigned 8-bit integer)


    ●     rune: An alias for int32 (32-bit integer used to represent Unicode code
    points)


    Example:


    Go


    var integer int = 42


    var floatingPoint float64 = 3.14


    var text string = "Go is awesome!"


    var isTrue bool = true


    var character byte = ''A''


    Remember: Choosing the appropriate data type for your variables is important for
    efficient memory usage and accurate calculations.


    In the next section, we''ll explore how to use operators to perform calculations
    and make comparisons with variables.


    ## 2.2 Operators and Expressions


    Operators are symbols that perform operations on values. Expressions are combinations
    of values, variables, and operators that result in a new value.


    ### 2.2.1 Arithmetic Operators


    ●     Addition: +


    ●     Subtraction: \-


    ●     Multiplication: \*


    ●     Division: /


    ●     Modulo: %


    Example:


    Go


    result := 5 + 3 \* 2


    remainder := 10 % 3


    ### 2.2.2 Comparison Operators


    ●     Equal to: \==


    ●     Not equal to: !=


    ●     Less than: <


    ●     Greater than: \>


    ●     Less than or equal to: <=


    ●     Greater than or equal to: \>=


    Example:


    Go


    isEven := number % 2 == 0


    isGreater := x > y


    ### 2.2.3 Logical Operators


    ●     Logical AND: &&


    ●     Logical OR: ||


    ●     Logical NOT: !


    Example:


    Go


    isAdult := age >= 18 && hasID


    isWeekend := dayOfWeek == "Saturday" || dayOfWeek == "Sunday"


    ### 2.2.4 Assignment Operators


    ●     Assignment: \=


    ●     Addition assignment: +=


    ●     Subtraction assignment: \-=


    ●     Multiplication assignment: \*=


    ●     Division assignment: /=


    ●     Modulo assignment: %=


    Example:


    Go


    count += 1


    total \*= 2


    ### 2.2.5 Increment and Decrement Operators


    ●     Increment: ++


    ●     Decrement: \--


    Example:


    Go


    i++


    j--


    Remember: When combining operators in expressions, be mindful of operator precedence.
    For example, multiplication and division have higher precedence than addition
    and subtraction. You can use parentheses to control the order of operations.


    In the next section, we''ll explore control flow statements, which allow you to
    make decisions and execute code conditionally.


    ## 2.3 Control Flow


    Control flow statements allow you to determine the order in which your code is
    executed. They enable you to make decisions, repeat actions, and control the flow
    of your program.


    ### 2.3.1 If Statements


    if statements are used to execute code conditionally.


    Go


    if condition {


    // Code to execute if the condition is true


    } else {


    // Code to execute if the condition is false


    }


    Example:


    Go


    age := 25


    if age >= 18 {


    fmt.Println("You are an adult.")


    } else {


    fmt.Println("You are a minor.")


    }


    ### 2.3.2 Switch Statements


    switch statements are used to choose between multiple options.


    Go


    switch expression {


    case value1:


    // Code to execute if expression equals value1


    case value2:


    // Code to execute if expression equals value2


    default:


    // Code to execute if no case matches


    }


    Example:


    Go


    dayOfWeek := "Tuesday"


    switch dayOfWeek {


    case "Monday", "Tuesday", "Wednesday", "Thursday", "Friday":


    fmt.Println("It''s a weekday.")


    case "Saturday", "Sunday":


    fmt.Println("It''s a weekend.")


    default:


    fmt.Println("Invalid day of the week.")


    }


    ### 2.3.3 For Loops


    for loops are used to repeat a block of code multiple times.


    Go


    for initialization; condition; post-statement {


    // Code to be executed


    }


    Example:


    Go


    for i := 0; i < 5; i++ {


    fmt.Println(i)


    }


    You can also use a for loop with only a condition:


    Go


    i := 0


    for i < 5 {


    fmt.Println(i)


    i++


    }


    Infinite loop:


    Go


    for {


    // Code that will be executed indefinitely


    }


    Remember to use break to exit a loop prematurely and continue to skip the current
    iteration. Control flow statements are essential for creating dynamic and flexible
    programs. By understanding how to use them effectively, you can write more complex
    and interesting code.


