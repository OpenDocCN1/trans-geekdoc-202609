    )\n    if err != nil {\n        log.Fatal(err)\n    }\n    defer db.Close()\n\n\
    \    // Prepare a statement to insert multiple users\n    stmt, err := db.Prepare(\"\
    INSERT INTO users (name, email) VALUES (?, ?)\")\n    if err != nil {\n      \
