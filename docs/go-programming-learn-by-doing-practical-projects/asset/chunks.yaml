    }


    You can create your own packages by placing Go files in a directory with the same
    name as the package. For example, to create a package named math, you would place
    the Go files in a directory named math.


    Functions and packages are fundamental building blocks of Go programs. By using
    them effectively, you can write more organized, reusable, and maintainable code.


    ## 2.5 Collections


    Collections are data structures that allow you to store multiple values in a single
    variable. Go provides several built-in collection types: arrays, slices, and maps.


    ### 2.5.1 Arrays


    Arrays are fixed-size collections of elements of the same type. The size of an
    array is specified when it''s declared.


    Go


    var numbers \[5\]int


    This declares an array named numbers that can hold 5 integer values.


    Accessing elements:


    Go


    numbers\[0\] = 10


    numbers\[1\] = 20


    fmt.Println(numbers\[2\]) // Output: 0 (default value)


    ### 2.5.2 Slices


    Slices are dynamically sized arrays that provide more flexibility. They are backed
    by underlying arrays but can be resized as needed.


    Go


    var fruits \[\]string


    Creating slices:


    Go


    fruits = \[\]string{"apple", "banana", "orange"}


    Accessing and modifying elements:


    Go


    fmt.Println(fruits\[1\]) // Output: banana


    fruits\[2\] = "grape"


    Appending elements:


    Go


    fruits = append(fruits, "mango")


    Slicing:


    Go


    slicedFruits := fruits\[1:3\] // Create a slice from index 1 to 2 (exclusive)


    ### 2.5.3 Maps


    Maps are key-value pairs. The keys must be unique, while the values can be of
    any type.


    Go


    var capitals map\[string\]string


    Creating maps:


    Go


    capitals = map\[string\]string{


    "France": "Paris",


    "Italy": "Rome",


    }


    Accessing and modifying elements:


    Go


    fmt.Println(capitals\["France"\]) // Output: Paris


    capitals\["Germany"\] = "Berlin"


    Checking if a key exists:


    Go


    if capital, ok := capitals\["Spain"\]; ok {


    fmt.Println("The capital of Spain is", capital)


    } else {


    fmt.Println("Spain is not in the map.")


    }


    Collections are essential for storing and manipulating data in Go programs. By
    understanding arrays, slices, and maps, you can create more efficient and flexible
    data structures.


