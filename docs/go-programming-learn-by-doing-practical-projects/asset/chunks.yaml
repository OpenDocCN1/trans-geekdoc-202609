    \ 2.1 变量和数据类型\n\n变量是任何语言中基础的构建块。它们允许你在代码中存储和操作数据。在 Go 中，变量用于持有不同类型的值。\n\n### 2.1.1\
    \ 声明变量\n\n在 Go 中声明变量使用 `var` 关键字后跟变量名和类型。\n\n```go\nvar message string\nvar age\
    \ int\nvar pi float64\n```\n\n在这个示例中，我们声明了三个变量：类型为 `string` 的 `message`、`int`\
    \ 的 `age` 以及 `float64`。\n\n### 2.1.2 赋值\n\n一旦声明了变量，就可以使用赋值运算符 `=` 为其赋值值：\n\n```go\n\
    message = \"Hello, world!\"\nage = 30\npi = 3.14159\n```\n\n### 2.1.3 类型推断\n\n\
    Go 还支持类型推断，允许编译器根据初始值确定变量的类型。你可以使用 `:=` 进行声明：\n\n```go\nname := \"Alice\"\ncount\
    \ := 10\n```\n\n### 2.1.4 数据类型\n\nGo 拥有丰富的数据类型来表示不同的值。常用的类型有：\n\n- `int`：整数值（例如\
    \ 10,-5）\n- `float64`：浮点数（例如 3.14159）\n- `string`：字符序列（例如\"Hello, world!\"）\n\
    - `bool`：布尔值（`true` 或 `false`）\n- `byte`：`uint8` 的别名（8 位整数）\n- `rune`：`int32`\
    \ 的别名（用于表示 Unicode 代码点的 32 位整数）\n\n示例：\n\n```go\nvar integer int = 42\nvar floatingPoint\
    \ float64 = 14\nvar text string = \"Go is awesome!\"\nvar isTrue bool = true\n\
    var character byte = 'A'\n```\n\n注意：选择合适的数据类型对于内存使用和准确计算至关重要。在下一节中，我们将探索如何使用运算符进行计算和比较。\n\
    \n## 2.2 运算符和表达式\n\n运算符是执行值操作的符号。表达式是值、变量和运算符的组合，结果为一个值。\n\n### 2.2.1 算术运算符\n\n\
    - `+`：加法\n- `-`：减法\n- `*`：乘法\n- `/`：除法\n- `%`：取模\n\n示例：\n\n```go\nresult := 5\
    \ + 3 * 2\nremainder := 10 % 3\n```\n\n### 2.2.2 比较运算符\n\n- `==`：等于\n- `!=`：不等于\n\
    - `<`：小于\n- `>`：大于\n- `<=`：小于等于\n- `>=`：大于等于\n\n示例：\n\n```go\nisEven := number\
    \ % 2 == 0\nisGreater := x > y\n```\n\n### 2.2.3 逻辑运算符\n\n- `&&`：逻辑与\n- `||`：逻辑或\n\
    - `!`：逻辑非\n\n示例：\n\n```go\nisAdult := age >= 18 && hasID\nisWeekend := dayOfWeek\
    \ == \"Saturday\" || dayOfWeek == \"Sunday\"\n```\n\n### 2.2.4 赋值运算符\n\n- `=`：赋值\n\
    - `+=`：加法赋值\n- `-=`：减法赋值\n- `*=`：乘法赋值\n- `/=`：除法赋值\n- `%=`：取模赋值\n\n示例：\n\n```go\n\
    count += 1\ntotal *= 2\n```\n\n### 2.2.5 增减运算符\n\n- `++`：增\n- `--`：减\n\n示例：\n\n\
    ```go\ni++\nj--\n```\n\n注意：在表达式中组合运算符时，注意运算符优先级。例如，乘法和除法的优先级高于加法和减法。你可以使用括号来控制操作顺序。在下一节中，我们将探索允许条件执行代码的控制流语句。\n\
    \n## 2.3 控制流\n\n控制流语句允许你确定代码执行的顺序。它们使你能够决策、重复操作并控制程序的流程。\n\n### 2.3.1 If 语句\n\n\
    `if` 语句用于根据条件执行代码。\n\n```go\nif condition {\n    // 如果条件为真则执行代码\n} else {\n  \
    \  // 如果条件为假则执行代码\n}\n```\n\n示例：\n\n```go\nage := 25\nif age >= 18 {\n    fmt.Println(\"\
    You are an adult.\")\n} else {\n    fmt.Println(\"You are a minor.\")\n}\n```\n\
    \n### 2.3.2 Switch 语句\n\n`switch` 语句用于在多个选项之间选择。\n\n```go\nswitch expression {\n\
    case value1:\n    // 如果表达式等于 value1 则执行代码\ncase value2:\n    // 如果表达式等于 value2\
    \ 则执行代码\ndefault:\n    // 如果没有 case 匹配则执行代码\n}\n```\n\n示例：\n\n```go\ndayOfWeek\
    \ := \"Tuesday\"\nswitch dayOfWeek {\ncase \"Monday\", \"Tuesday\", \"Wednesday\"\
    , \"Thursday\", \"Friday\":\n    fmt.Println(\"It's a weekday.\")\ncase \"Saturday\"\
    , \"Sunday\":\n    fmt.Println(\"It's a weekend.\")\ndefault:\n    fmt.Println(\"\
    Invalid day of the week.\")\n}\n```\n\n### 2.3.3 For 循环\n\n`for` 循环用于多次执行某块代码。\n\
    \n```go\nfor initialization; condition; post-statement {\n    // 要执行的代码\n}\n```\n\
    \n示例：\n\n```go\nfor i := 0; i < 5; i++ {\n    fmt.Println(i)\n}\n```\n\n你也可以使用只带条件的\
    \ for 循环：\n\n```go\ni := 0\nfor i < 5 {\n    fmt.Println(i)\n    i++\n}\n```\n\
    \n无限循环：\n\n```go\nfor {\n    // 将无限执行的代码\n}\n```\n\n记住使用 `break` 提前退出循环，并使用 `continue`\
    \ 跳过当前迭代。控制流语句是创建动态灵活程序的必不可少的。通过学会有效地使用它们，你可以编写更复杂、更有有趣的代码。\n\n"
