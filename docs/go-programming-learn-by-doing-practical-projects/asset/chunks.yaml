    \ we define two flags: `-name` and `-age`. The `flag.String` and `flag.Int` functions\
    \ create flags of type `string` and `int`, respectively. The second argument is\
    \ the default value, and the third argument is description. To run this program:\n\
    \n```bash\ngo run main.go -name Alice -age 30\n```\n\nThis will output:\nHello,\
    \ Alice you are 30 years old.\n\n### 4.1.2 Positional Arguments\n\nPositional\
    \ arguments are arguments that are not preceded by a flag. You can access positional\
    \ arguments using the `flag.Args()` function.\n\nExample:\n\n```go\npackage main\n\
    \nimport (\n    \"flag\"\n    \"fmt\"\n)\n\nfunc main() {\n    flag.Parse()\n\
    \    args := flag.Args()\n    fmt.Println(\"Arguments:\", args)\n}\n```\n\n###\
    \ 4.1.3 Boolean Flags\n\nTo create a boolean flag, use the `flag.Bool` function.\n\
    \n```go\nverboseFlag := flag.Bool(\"verbose\", false, \"Enable verbose output\"\
    )\n```\n\n### 4.1.4 Custom Flag Functions\n\nYou can create custom flag using\
    \ the `flag.Var` function.\n\n```go\ntype Color string\n\nfunc (c *Color) String()\
