    在本章中，我们学习了如何简洁地搜索复杂的模式。我们观察了正则表达式是由字符组合而成的，其中某些字符表示自身，另一些则表示特殊功能。在以下情况下你应该使用这些工具：


    • 你必须验证输入是否符合预期格式（例如：电话号码、日期、IP 地址、信用卡号），

    • 你不知道要查找的字符的确切序列，但你知道它们应该长什么样，

    • 你必须执行复杂的查找和替换操作。


    如果你正在处理一种通用的模式，例如 `IP address` 或电话号码，你可以在网上找到现成的正则表达式。有很多正则表达式库和食菜谱可以帮助你找到常见的模式。


    在设计你自己的表达式时，从一个简单的开始，能够宽泛地匹配你搜索的内容，然后从那里完善你的表达式，使其变得越来越具体。


    几乎所有的编程语言和工具都支持正则表达式，但要小心：不同的变体（flavors）之间有很多细微差异。某些环境会将括号解释为字面字符，因此需要你输入 `\\(•••\\)`
    而不是 `(•••)` 来创建一个分组。一些旧引擎缺乏对某些锚点的支持，例如单词边界。那么我们如何匹配日文字符呢？在本章中获得的概念理解将帮助你查阅正则表达式的参考资料和在线资源以找到答案。


    现在就你的浏览器安装一个正则表达式扩展，这样你就可以在网页上进行测试。此外，找到如何在你的源代码编辑器中使用正则表达式。在编写这本书时，我们使用了一个名为
    `Vim` 的工具，它通过正则表达式执行所有搜索。如果有办法将正则表达式设置为编辑器的默认搜索模式，请尽管这样做——这将迫使你练习它们，从长远来看这将节省时间。


    ![](img/07-03-v.jpg)


    图 7.3 “正则表达式”，感谢 [`xkcd.com`](http://xkcd.com) 提供。


    即使你没有参与匆忙的刑事案件调查（图 7.3），快速访问特定信息对于高效工作也是至关重要的。你对正则表达式越精通，检索所需数据的速度就越快，学习它们也能为你节省数小时宝贵的编码时间。


    ### 参考文献


    • *Mastering Regular Expressions*, Friedl 编写

    – 从 [`code.energy/friedl`](https://code.energy/friedl) 获取


    • *Regular Expressions Cookbook*, Goyvaerts 和 Levithan 编写

