    There is another way you can deal with missing data: filling `NULL` cells with
    a value you deem reasonable. This process is called imputation, and the three
    most common fillers are the most frequent, the average, and the new label.


    ### MOST FREQUENT

    If many values are repeated in a column, the most frequent such value is used
    in all `NULL` cells in that column. This is especially useful to resolve missing
    values in categorical data.


    ![](image/05-11-h.jpg)


    Figure 5.11 Imputations for binary and ordinal encodings such as biological sex
    and pain may be resolved directly in. However, the one-hot encoding for blood
    type cannot be resolved this way since all of its columns contain mostly zeros.


    ![](image/05-12-h.jpg)


    Figure 5.12 Nominal data must be imputed before one-hot encoding. This way, one
    of the imputed cells will be a 1.


    Notice that this operation must be performed before one-hot encoding to ensure
    that each one-hot encoded row contains a 1. This is how we avoided filling the
    question marks in fig. 5.11 entirely with zeros.


    ### AVERAGING

    Following this method, the `NULL` cells are filled with the average value of other
    cells in the column:


    ![](image/05-13-h.jpg)


    Figure 5.13 Imputing cells with the column’s mean.


    Typically, the mean or the median is used. Be careful with this strategy: it won’t
    work with categorical features. For instance, if you try it with binary data,
    the empty cells could be filled with decimal values instead of ones and zeros.


    ### NEW LABEL

    This strategy only works for categorical variables. When `NULL` cells are frequent
    in a categorical column, we can create a new label, and assign it to all cells
    with missing values.


    ### TEST TO TREAT

    ![](image/c-virus.jpg)

    Your hospital is struggling with a novel coronavirus pandemic, and you must estimate
    how likely incoming patients are of needing a respirator. You test the patients
    for the virus and create a categorical feature where each is labeled ‘negative’
    or ‘positive’. There aren’t enough tests for everyone, so priority is given to
    patients who display symptoms such as fever and coughing. In the end, only half
    the patients have been tested, 60% of whom turn out positive. How should you impute
    the `NULL` cells of untested patients?


    Dropping the rows for untested patients is not an option, as it would cut out
    half of the records and render the model useless to predict, for example, the
    total number of respirators needed in the future. Using the most frequent value
    is problematic: most tests turned out positive, but tests were not administered
    at random, so the results don’t necessarily generalize well to asymptomatic patients.
    This is a form of selection bias (sec. 4.1): patients without symptoms are less
    likely to have the virus than those with symptoms, so defaulting them to ‘positive’
    would be a mistake!


    Therefore, you have two options: ask the hospital to test a small sample of asymptomatic
    patients and generalize that result, or simply create a new label for untested
    patients. The former will allow you to keep a binary encoding for the feature,
    whereas the latter will require a one-hot encoding for the three final labels
    (‘negative’, ‘positive’, and ‘untested’).


    Dropping records, selecting the most frequent values, calculating averages, and
    creating new labels are the simplest and most common methods of dealing with missing
    values. Scientists are actively researching new and more effective ways of imputing
    large datasets. In general, imputation is effective if missing data appears at
    random. If there’s an underlying reason for some cells to be `NULL`, these strategies
    can hinder more than they help.


    ### Data Leakage

    When we’re building `X` and `y` from past events, we might accidentally include
    in `X` information that only exists once `y` is observed. This is called data
    leakage. If this happens, the model will be trained to predict the future from
    future data, which is pointless.


    As you add features into `X`, think about the information that will be available
    when you make predictions. Inspect `X` and ensure it looks exactly like the data
    your model will have to valuate `ypred`. Let’s try this in practice:


    ### BUSY BEDS

    ![](image/c-hospital.jpg)

    You are the manager of a hospital’s business intelligence system. The day following
    the admission of each patient, you are asked to predict how long they will stay
    hospitalized. You are given access to the following information about past patients:
    age, sex, BMI, blood type, vital signs, and total cost of stay. How can you choose
    which data to include as columns of your dataset?


