  trans: "\n\n# 推荐阅读\n\n* `Machine Learning for Absolute Beginners`, 作者 Theobald 编写\n\
    \  - 在 [`code.energy/theobald`](https://code.energy/theobald) 获取\n* `The Data\
    \ Science Design Manual`, 作者 Skiena 编写\n  - 在 [`code.energy/skiena`](https://code.energy/skiena)\
    \ 获取\n* `Deep Learning`, 作者 Goodfellow 编写\n  - 在 [`code.energy/goodfellow`](https://code.energy/goodfellow)\
    \ 获取\n* `The Elements of Statistical Learning`, 作者 Tibshirani 编写\n  - 在 [`code.energy/tibshirani`](https://code.energy/tibshirani)\
    \ 获取\n* Prof. Raschka 关于 Model Evaluation and Selection（模型评估与选择）的论文\n  - 在 [`code.energy/raschka`](https://code.energy/raschka)\
    \ 获取\n\n# 笔记\n\n1. 例如，我们中高达 2%的人出生时为间性征，例如拥有 `XXY` 染色体。如果预测不直接影响个体患者（例如为了内部物流目的估计住院时间），则可以使用二值编码。\n\
    2. `Bag-of-Words`（词袋模型）是从词频创建特征的最常用方法。更多信息请参见 [`code.energy/bag-of-words`](http://code.energy/bag-of-words)。\n\
    3. 从理论上讲，使用我们 365 条记录中的 10%，存在不同的可能的验证集多达数亿万亿万亿。我们的第一本书《Computer Science Distilled》解释了如何计算此类组合。\n\
    4. 有关 `PCA`（主成分分析）的交互式解释，请参阅 [`code.energy/pca`](http://code.energy/pca)。\n5.\
    \ 一个包含 `n` 个元素的集合子集数量为 `2^n`。\n6. 反向剔除和正向选择是我们在第一本书《Computer Science Distilled》中描述的贪心启发式方法的形式。\n\
    7. 当你获得了一些经验后，你会发现某些方法可以自动为给定模型搜索许多超参数设置，并自动选择最佳的一个。\n\n# 结论\n\n我们实际上已经成功地将我们的学科变成了一门科学，而且方式非常简单：仅仅通过决定称之为“计算机科学”。\n\
    \n— DONALD KNUTH\n\n本书介绍了了计算机科学如何释放力量，使程序员能够构建出我们所生活的数字世界。通过亲自使用这些概念来玩转网络和数据科学，你将为资源更丰富的社会做出贡献。\n\
    \n我们试图将探索的深度限制在入门水平。目标是向你展示每个处理代码的人都应该知道的要要知识。我们希望激发你的好奇心，让你通过每章末尾的书籍继续探索。在本结论之后，你还会发现一个关于正则表达式的额外章节：这是一种搜索模式的技术，将帮助你完成任何数据分析或机器学习任务的处理步骤。\n\
    \n我们希望在本书的下一个版本中包含更多主题。例如，在介绍机器学习时，我们跳过了让计算机在没有人类监督的情况下收集知识的算法。我们还没有谈论云计算，它能够更快速地创造新世界。如果你对这些主题感兴趣，请保持关注！如果你是直接从我们这里购买的书，你将免费获得这些内容。\n\
    \n希望这本书提升了你对计算系统的理论理解。现在，是时候去实践了！开始一个新的编码项目，并练习你所学的知识。正如一位智明的程序员所说：\n\n“如果你发现自己几乎把所有时间都花在了理论上，就开始将注意力转向实践事务；它会完善你的理论。如果你发现自己几乎把所有时间都花在了实践上，就开始将注意力转向理论事务；它会完善你的实践。”\n\
    \n最后，请随时向我们发送对这本书的反馈：通过电子邮件 `hi@code.energy` 与我们联系。我们从第一本书《Computer Science Distilled》中收到的反馈激励了我们编写这本书，并让我们注意到了写作风格中可以改进的细节。谢谢你！\n\
    \n# 额外内容\n\n## 模式\n\n正则表达式允许你掌握你的数据。控制它。让它为你工作。精通正则表达式就是掌握你的数据。\n\n— JEFFREY FRIEDL\n\
    \n程序员经常处理符合给定模式的数据。让我们考虑一个包含书写格式为“Feb 27th 2013”、“27/2/13”和“2013-02-27”日期的文档。我们如何找到此类文件中所有的日期呢？编写程序来检测模式是非常耗时且相当枯燥的。\n\
    \n![](img/07-01-h.jpg)\n图 7.1 不要向你的老板约会！\n\n幸运的是，我们可以使用正则表达式定义诸如日期格式之类的模式。这些表达式可以被现有的软件解释，因此我们不需要自己编写模式匹配代码。在本章中，我们将学习：\n\
    \n![](img/c-olhos.jpg)\n* 匹配基础模式，![](img/c1a.jpg)\n* 精确量化重复模式，![](img/c.jpg)\n\
    * 将模式锚用于位置，![](img/ancora.jpg)\n* 捕获模式中的项目，![](img/familia.jpg)\n\n也被称为 `regex`\
    \ 或 `regexp` 的正则表达式是程序员喜爱的节省器。\n\n![](img/07-02-h.jpg)\n图 7.2 “曾是一段结巴的代码。”\n\n\
    ### 匹配\n\n正则表达式就像加强版的搜索词。考虑以下内容：\n\n```\nDistrict 1, Paris\n```\n\n这是一个简单的正则表达式，它可以工作。正则表达式引擎是一个解释此表达式、在文本上运行它并在找到字符串“District\
    \ 1, Paris”时报告的程序。引擎在语法、功能和行为上存在细微差异。极客称之为“口味”（flavors）。\n\n大多数口味默认情况下是区分大小写的，因此“district\
    \ 1, paris”不会匹配。幸运的是，它们还允许通过标志来配置处理数据的方式。例如，不区分大小写的标志（通常表示为 `i`）将允许我们从大写的表达式中找到“district\
    \ 1, paris”。\n\n强烈建议你尝试本章中所有的正则表达式。打开 [`code.energy/regex`](http://code.energy/regex)，你将看到一个正则表达式字段和一个测试输入框。它将显示表达式匹配的位置。你还可以设置标志。尝试一下并观察不区分大小写的标志如何影响你的匹配！\n\
    \n### 点\n\n假设你想搜索以下短语：\n* “District 1, Paris”,\n* “District 2, Paris”,\n* “District\
    \ 3, Paris”,\n* “District 4, Paris”.\n\n与其执行四次搜索，我们可以让单个搜索的第十个字符匹配任何内容：\n\n```\n\
    District ., Paris\n```\n\n在正则表达式中，点 `.` 有特殊含义：它匹配任何单个字符。我们的表达式甚至会匹配我们感兴趣的短语，例如“District\
    \ 0, Paris”和“District !, Paris”。尽管如此，点提供了一种快速查找模糊匹配你模式的方法。考虑这个表达式：\n\n```\nc.........y\n\
    ```\n\n它匹配“calligraphy”、“consistency”和“chaotically”，而且由于点也匹配空格字符，“can be easy”和“code\
    \ energy”也被匹配了。注意，这里没有考虑单词之间的边界，所以“cisco enjoy”将在“Francisco enjoyed”中被找到。让我们看看这一切如何允许我们做比静态搜索多得多的事情：\n\
    \nDOMAIN NAME ![](img/c-mundo.jpg) 你记得一封邮件提到一个以 mil 和国家代码结尾的网站。你不记得其他其他的：它可能是\
    \ `mil.br/`、`eng.mil.ru/`、`mil.be/frite` 等。你如何找到这个域名？\n\n"
- fmt: '

    All country code top-level domains have two characters. The `.` matches any character,
    even an actual period. This expression will find all possible matches:


    ```text

    mil.../

    ```


    The `.` is mostly used for quick, dirty work and it typically finds much more
    than we’re expecting. Let’s now see how to be very specific with regular expressions.


    ## The Set


    A term written inside `\[•••\]` brackets is called a set. A set works like a `.`,
    though it will only match one of the characters contained in its brackets. Replace
    the `.` with a set and our search for Parisian districts becomes exact:


    `District [1234], Paris`


    This will only match the four cases in which we’re interested. Such ranges of
    characters are often used in sets, and so there exists a shorthand to make them
    compact and easy to read:


    - `[1-4]` is equivalent to `[1234]`,

    - `[h-p]` is equivalent to `[hijklmnop]`.


    This improves our solution to the Domain Name problem ![](image/c-mundo.jpg):


    ```text

    mil.\[a\-z\]\[a\-z\]/

    ```


    A set can contain multiple ranges. For instance, the following regular expression
    matches a character that is either in the `0-9` range or in the `A-F` range—it
    matches a hex digit:[2](#CSU-2-14.xhtml#nota7-02)


    ```text

    \[A\-F0\-9\]

    ```


    By stacking a `#` and six of these sets, we can match hex color codes[3](#CSU-2-14.xhtml#nota7-03),
    such as `#E67F31`:


    ```text

    #\[A\-F0\-9\]\[A\-F0\-9\]\[A\-F0\-9\]\[A\-F0\-9\]\[A\-F0\-9\]\[A\-F0\-9\]

    ```


    Some sets are very common in regular expressions. Lazy programmers defined shorthands
    for matching a digit and for matching an alphanumeric character:


    - `\d` is equivalent to `[0-9]`,

    - `\w` is equivalent to `[A-Za-z0-9_]`.[4](#CSU-2-14.xhtml#nota7-04)


    In order to match a ten digit phone number (e.g. `307-555-0177`), we’d have to
    repeat `[0-9]` ten times. Repeating the shorthand is more compact:


    ```text

    \d\d\d-\d\d\d-\d\d\d\d

    ```


    We will soon discover even better ways to repeat sets.


    ## The Negated Set


    We sometimes want to match almost any character. Rather than listing the many
    accepted characters in a set, we list the characters that are not accepted in
    a negated set. It’s the opposite of a set in that it matches any character that
    is not listed within its brackets. It looks like a normal set, but with a caret
    after the first bracket: `[^•••]`.


    TRADING ![](image/c-cambio.jpg) You have a list of currencies, each written as
    a three-letter code, such as JPY (¥), USD ($), and GPB (£). Some of these are
    special currencies, such as XBT (Bitcoin) and XAU (Gold). The special ones always
    start with X. List all non-special currency codes.


    Using sets, we’d have to list every letter:


    ```text

    \[A\-WY\-Z\]\[A\-Z\]\[A\-Z\]

    ```


    Matching anything that isn’t an `X` to the first character is simpler:


    ```text

    \[^X\]\[A\-Z\]\[A\-Z\]

    ```


    Note that this will also match “0AA”, “.AA”, or “ AA”, as the negated list matches
    any character that’s not in its brackets. Whether or not `[^X][A-Z][A-Z]` will
    only match actual currency codes depends on our input. Negated sets are also useful
    for catching things we didn’t expect:


    PROOFREADING ![](image/c-lupa.jpg) While reviewing this book, we had to check
    that every punctuation mark is followed by a space. How did we search for this
    kind of goof?


    If there is anything other than a space after a punctuation character, we can
    match it and review it:


    ```text

    \[.,:;?!\]\[^ \]

    ```


    Did you notice that we’re using a period character inside the set, and that it
    matches an actual period? That’s because characters inside the set lose their
    special powers. Let’s now learn to do this outside of sets.


    ## Special Characters


    To make a special character[5](#CSU-2-14.xhtml#nota7-05) lose its regex functionality,
    we use `\`, the escape character. For instance, `\.` matches an actual period
    character—it’s the same as `[.]`. The Domain Name problem ![](image/c-mundo.jpg)
    now has an even more precise solution:


    ```text

    mil\.\[a\-z\]\[a\-z\]/

    ```


    Other characters can also be expressed with an escape sequence. This comes in
    handy when matching non-printable characters:


    - `\t` matches a tab,

    - `\n` matches a new line,

    - `\r` matches a carriage return (useful in Windows),

    - `\f` matches a page break,

    - `\s` is equivalent to ` \t\r\n\f]`.


    The shorthand `\s` is called whitespace. Note that it includes the regular space
    character! We can now improve the solution to the Proofreading problem ![](image/c-lupa.jpg)
    so it doesn’t waste our time returning punctuation followed by new lines and page
    breaks:


    ```text

    \[.,:;?!\]\[^\\s\]

    ```


    ## Quantifiers


    We will soon discover even better ways to repeat sets.


    ### Braces


    We can specify exactly many times a character must match using curly braces. For
    instance, our phone numbers can be rewritten:


    ```text

    \d{3}\-\\d{3}

    ```


    This is equivalent to `\d\d\d-\d\d\d`. It reads “match three digits, then a dash,
    then three digits”. A quantifier can also be used to make the expression optional:


    ```text

    \d{3}-\d{3}

    ```


    Wait, let''s re-examine the example for the phone braces:

    ```text

    \d{3}-\d{3}

    ```

    match exactly once by default. A quantifier can also be used to match hex codes:


    ```text

    #\[A\-F0\-9\]{6}

    ```


    Moreover, besides these fixed match, we can also specify a range. It’s possible
    to state a minimum or a maximum number:


    ```text

    {n,m}

    ```


    ### Optional


    The quantifier we used to make the dash optional in our last expression is so
    common that there exists a shorthand. We can replace `{0,1}` with `?`. The phone
    expression now reads:


    ```text

    \d{2}\-\\d{4,5}\?\d{4}

    ```


    The `?` is called the optional. Whether the character that immediately precedes
    the `?` is actually there doesn’t matter, the match happens regardless. The optional
    is useful when looking for web URLs that may or not use encryption:[6](#CSU-2-14.xhtml#nota7-06)


    ```text

    https?://code\.energy

    ```


    This finds both [http://code.energy](http://code.energy) and [https://code.energy](https://code.energy).


    ### Plus


    The `(+)` is another useful shorthand. It’s the same as `{1,}`, indicating something
    must appear at least once, with no upper limit. For instance:


    ```text

    du+de

    ```


    This matches “dude”, “duude”, “duuude”, and so forth. If we want to catch links
    to any .com domain:[7](#CSU-2-14.xhtml#nota7-07)


    ```text

    https?://[a-z0-9-]+\.com

    ```


    ###


    The most powerful quantifier is the star `(\*)`. It’s equivalent to `{0,}` and
    combines the effect of the optional and the plus. It denotes an optional term
    that can occur unlimited times. For example:


    ```text

    yea\*h

    ```

    '
