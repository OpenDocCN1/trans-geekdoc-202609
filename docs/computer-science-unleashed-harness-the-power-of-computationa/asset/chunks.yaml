    \ universel coordonné`）。\n15 ... 在终端上：`http://code.energy/terminal-movie`(http://code.energy/terminal-movie)。\n\
    16 `telnet` 被认为是不安全的。现在我们使用一种类似的协议 `Secure Shell`（`SSH`）。\n17 ...等待响应。\n18 ...\
