    我们可以立即看到 NASA 并没有 `icmc.usp.br` 的 `NS` 记录。事实上，不应指指根服务器会存储这些记录：`br` 是一个由巴西政府管辖的国家代码顶级域名（TLD）。根服务器通过指示负责
    `br` 的巴西服务器的 IP 地址为我们提供帮助。让我们听从建议，向那里发送查询：


    ```

    dig @2001:12f8:6::10 icmc.usp.br. NS

    ```


    这一次，我们收到了请求的特定记录：


    ```

    icmc.usp.br.      NS   c.dns.usp.br.

    c.dns.usp.br.     AAAA  2001:12d0::8

    ```


    现在，现在可以查询与 `icmc.usp.br` 关联的 `AAAA` 记录：


    ```

    dig @2001:12d0::8 icmc.usp.br. AAAA

    ```


    最后，我们得到了想要的 IP 地址：


    ```

    icmc.usp.br.      AAAA  2001:12d0:2080::231:6

    ```


    如果我们的原始查询是 `icmc.usp.br` 的子域名，我们可能需要再次迭代查询 `NS` 记录。这被称为迭代查询（iterative querying），它允许你从任何单个根服务器的
    IP 地址开始查找任何 DNS 信息。


    ### 递归查询


    截至 2020 年，估计每秒会有数百万次 DNS 查询。如果主机只执行迭代查询，名称服务器处理所有这些请求将极其困难。幸运的是，大多数 DNS 查询是以不同的方式处理的——这种方式可以最大限地减少对名称服务器的负载。


    某些名称服务器（通常称为 DNS 服务器）允许你通过单一查询查询任何 DNS 记录。它们通常由高吞吐量的大型维护，例如互联网服务提供商（ISP）。ISP 几乎总是会告知客户路由器其
    DNS 服务器的 IP 地址。客户路由器经常使用该服务器进行所有的 DNS 查询。


    今天，大多数家用路由器都能够运行自己的 DNS 服务器。通常情况下，个人电脑被配置为使用路由器作为默认 DNS 服务器。在不带 `@` 参数的情况下调用 `dig`，你的计算机可能会查询你的路由器。然后，你的路由器可能会将查询转发到
    ISP 的 DNS 服务器。尝试一下：


    ```

    dig icmc.usp.br. AAAA

    ```


    这要快得多：你的 DNS 服务器比任何其他名称服务器都离你。此外，单次查询即可获得所需的 DNS 记录。作为客户端，你甚至不知道（或不在乎）你的 DNS 服务器是查询了另一个
    DNS 服务器，还是直接从拥有这些记录权限的名称服务器获取的。


    我们将此过程称为递归查询（recursive querying），因为客户端的单一查询会在 DNS 服务器链中向上传播，直到找到答案。它的优势在于缓存：服务器将过去的查询结果保存在本地存储或缓存中。例如，当
    DNS 服务器第一次被查询任何 `.io` 域名时，它会向根服务器询问 `io` 的 `NS` 记录；然而，当下次收到对 `.io` 域名的查询时，它将从缓存中检索记录，而不是浪费根服务器的时间。


    由于 ICANN 限制了顶级域名的数量，ISP 很容易在其 DNS 服务器上缓存所有的顶级域名，因此只需偶尔查询根服务器。这种设计确保了根服务器不会过载。


    相反，缓存会减慢网络周围更改的传播：DNS 服务器仅定期更新其缓存的 `NS` 记录。具体而言，记录的生存时间（`TTL`）值指示了记录可以在缓存中存储多久。


    在之前的示例中，为了简单起见，我们省略了 `TTL` 值，但每条记录都有一个值。它通常显示在记录之前：


    ```

    br.            14936    NS  a.dns.

    ```


    该记录的 `TTL` 值为 14936，表示它可以被缓存多久。设置低 `TTL` 值使得更改传播更快。


    ### 记录类型


    我们已经看到了两种记录类型：`AAAA` 链接 IP 地址；`NS` 授予域名权限。还有许多其他类型。当 DNS 在 1983 年发明时，使用了 `A` 记录。2012
    年，创建了 `AAAA` 记录。


    ```

    icmc.usp.br.      AAAA  2001:12d0:2080::231:6

    ```

    ```

    icmc.usp.br.      AAAA  2001:12d0::8

    ```


    如果你有一个 IPv4 地址，可以使用 `A`。对于 `A` 和 `AAAA` 记录，顶级域名拥有 `MX` 记录。


    #### 规范名称


    在 Web 早期，人们开始配置服务器处理请求。通常会将此类服务器命名为 `www`，因此 `www.example.com` 成为 `example.com`
    的预期地址。最近，许多人从地址中去掉了 `www` 部分。特殊的 `CNAME` 记录允许我们定义一个仅作为别名的子域名：


    ```

    www.code.energy.      CNAME  code.energy

    ```


    它指示任何尝试检索 `www.code.energy` 记录的人。


    #### 文本


    可以使用 `TXT` 记录将任意文本链接到域名。这通常用于证明域名所有权，但你也可以将其用于其他用途。我们在 `enigma.code.energy` 的
    `TXT` 记录中为你留了一条特殊信息。你能找到它吗？


    ### 反向 DNS


    DNS 主要用于获取与域名关联的 IP 地址。然而，反向有效：它可以找到与 IP 地址关联的域名。技巧是将 IP 地址重新表示为 ICANN 特殊顶级域名
    `arpa` 的子域名。例如，


    ```

    icmc.usp.br.      AAAA  2001:12d0:2080::231:6

    ```


    ...变为：


    ![](img/reversedns.jpg)


    由于 ICANN，每个 IP 地址都对应一个唯一的 `arpa` 子域名。可以在该子域名设置 `PTR` 记录，以便与域名关联。


    `arpa` 的权限属于 IANA。当给一个组织分配 IP 地址块时，该组织也获得了相应的 `arpa` 子域名的权限。当为计算机分配 IP 地址和域名时，良好的做法是在
    IP 地址的 `arpa` 子域名中使用 `PTR` 记录记录这一对信息。


    '
- fmt: '

    With `dig`, you can query `PTR` records corresponding to any IP address using
    the `-x` argument. Try it:


    ```bash

    dig -x 2600::

    ```


    Reverse DNS is useful for confirming where an IP packet comes from. For instance,
    suppose you receive an IP packet carrying a message from `apple.com`. If the reverse
    DNS of the sender’s IP address isn’t an Apple domain, something is fishy!


    That’s because those who have the authority to set DNS records for `arpa` subdomains
    are careful. Most ISPs don’t even allow their clients to set records on the `arpa`
    subdomains that correspond to their IP addresses.


    ## Domain Registration


    DNS doesn’t just replace big numbers with names–it gives people the autonomy to
    reconfigure their networks. Think of a computer hosting a website. If it relocates,
    it receives a new IP address. The DNS records of the website can be updated to
    the new address such that visitors of the website won’t notice the change!


    This requires DNS to be universal. It must be easy, secure and affordable for
    anyone to own a domain. There are several rules that guarantee this. ICANN is
    liberal with exclusive-use TLDs: `Google` and `IBM` use `google` and `ibm` as
    they want. Also, ICANN allows each national government to set the rules for its
    country-code TLD. However, ICANN imposes strict rules on general-use TLDs meant
    for the public, such as `com`, `org`, `rocks` and `energy`.


    ICANN calls an entity that has control of one or more TLDs a `registry`, or a
    Network Information Center (`NIC` ). As we’ve seen, the `registry` for `com` is
    `Verisign`. ICANN makes it mandatory for general-use TLD registries to accept
    domain registrations by anyone. ICANN also stipulates that a `registry` cannot
    directly receive any domain registration applications.


    In an effort to bolster competition and maximize the reach of DNS, ICANN stipulates
    that domain registration applications for general-use TLDs must be processed by
    companies called `registrars`. As of 2020, the largest registrar is `GoDaddy`:
    it has processed dozens of millions of domain registrations.


    `Registars` must be approved by ICANN. ICANN sets the maximum and minimum fees
    that registries and registrars may charge for a domain registration. Each time
    a domain is registered, part of the fee is paid to ICANN. Technically, the domain
    is still owned by ICANN and is leased for a maximum of 10 years. However, since
    the lease is renewable, we generally refer to the lessee as the owner.


    ### WHOIS


    Originally, ICANN obliged registrars to disclose the name and contact information
    of domain owners in a public directory called `WHOIS`. This directory functions
    through a different Internet protocol, independent of DNS. The directory can be
    consulted using the `whois` program on the command line:


    ```bash

    whois code.energy

    ```


    Thanks to the advance of data protection norms and regulations, ICANN now allows
    registrars to redact the identity of domain owners. In 2012, ICANN has vowed to
    “reinvent WHOIS”, but the process is still ongoing as of 2020.


    ### DNS HOSTING


    In theory, when registering a domain, you should provide the names and IP addresses
    of your name servers. This information is forwarded from your registrar to the
    registry for inclusion in the TLD name servers. However, most people don’t even
    know what a name server is. To make things easier, many registrars offer a DNS
    hosting service: they use their own name servers on your behalf, and allow you
    to manage your DNS records through a web interface.


    ### NAMES MARKET


    We live in the times of a booming online economy. Domain names are seen as virtual
    real estate and are sometimes sold for millions. For example, in 2019, `GoDaddy`
    brokered the sale of `voice.com` for $30 million. The `.com` domain names are
    so valuable that all possible four-letter combinations are taken.


    Now that you know how DNS works, we will refer to hosts using their domain names.
    Whenever you see a name used as host’s address, remember that a DNS query is necessary
    to find the IP address and send the IP packet.


    ## 2.2 Time


    Thousands of years ago, humans started figuring out how astronomy and mechanics
    could help quantify time. Ancient civilizations developed different lunar and
    solar calendars to track seasons and invented devices such as sundials and water
    clocks to track time within the day or night.


    As Roman legions professionalized in the 1st century BC, they increasingly kept
    time in order to harness their full military potential. Timekeeping allowed them
    to coordinate precise maneuvers and deliver devastating blows to their enemies.
    They also systematically recorded the time at which intelligence was collected
    by scouts and messengers so they could correlate events and gain insights into
    enemy tactics.


    Today, we rely heavily on timekeeping as trucks, trains, ships and planes must
    coordinate to carry unfathomable amounts of goods around the world. We keep logs,
    sometimes every time a postal package changes hands. If everyone agrees on what
    time it is, we can correlate events so incidents and their consequences can be
    monitored, and people can be held accountable if they do something wrong.


    In a similar way, timekeeping allows interconnected computers to form powerful
    teams. If distant computers can agree on what time it is, they can coordinate
    their actions at speeds that humans can’t achieve. For example, financial transactions
    between parties on different continents can be confirmed within seconds.


    Computers also store logs of each of their actions with a record of the exact
    time it occurred, called a `timestamp`. Agreeing on time allows interconnected
    computers to chronologically order past actions, records, and messages and therefore
    to correlate events. This mostly helps programmers find bugs but can also, for
    example, help security specialists detect and track malicious activity.


    Sharing time allows coordination and event correlation on epic scales. This begs
    the question: how do interconnected humans and computers even agree on what time
    it is?


    ### Coordinated Universal Time


    During the Age of Exploration, European sailors perfected their navigation techniques
    based on celestial observations and timekeeping. By the 18th century, they could
    precisely pinpoint their location at sea using tables published by the Royal Greenwich
    Observatory in London. This worked as long as they knew exactly what time was
    according to the observatory, so ships kept clocks synchronized with Greenwich.


    A couple of centuries later, we switched from mechanical clocks to quartz clocks
    and atomic clocks for more precision. Today, hundreds of atomic clocks track universal
    time. The Coordinated Universal Time, or `UTC`, is the average of the measurements
    from these clocks, and it’s currently our best standard for time. Thanks to advances
    in astronomy and planetary sciences, we can even account for Earth’s slowing rotation:
    we occasionally add leap seconds to UTC so it stays synchronized with solar time
    in London.


    All around the world, official time is obtained by adding an offset to `UTC`.
    The offset can change seasonally. For instance, the UK is an hour ahead of `UTC`
    half the year because of daylight saving time. Tokyo is nine hours ahead of `UTC`,
    year-round.


    ### TIMEZONES


    Regions where the official time follows the same UTC offset form a timezone. IANA
    keeps track of the ever-changing timezones and their offsets and publishes them
    in the `tz database`. For instance, a big chunk of the eastern United States,
    from Miami to New York, shares the same UTC offset. In the `tz database`, this
    timezone has the code `America/New_York`. Britain is entirely in the `Europe/London`
    timezone, and Japan is in `Asia/Tokyo`.


    ![](image/02-01-h.jpg)


    Figure 2.1 Rough outline of the world’s timezones as of 2020.

