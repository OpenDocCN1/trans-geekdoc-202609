    # 第 5 章：学习


    计算机是否能思考，就像潜艇是否会游泳一样。

    ——埃德格·迪克斯斯特（EDSGER DIJKSTRA）


    ## 预测指导决策


    几个世纪前，古代玛雅人通过观察作物和天文模式来预测产量，并决定种植玉米的最佳时机。今天，得益于先进的天气预报，北美农民可以做出更精确的决策。


    预测未来的一种方法是回顾过去，因为未来结果的最佳预测往往可以在过去的模式中找到。这很直觉：如果你发现每当有 NFL（美国橄榄球）比赛的晚上酒吧总是满的，你就会开始相信下一个
    NFL 比赛日晚上也会很忙。


    机器学习是利用计算机处理过去事件的数据，寻找模式并释放其预测能力。这项技术无处不在。当你购买车险或申请贷款时，公司会记录你的数据。随着时间的推移，银行学会了预测谁可能债务违约，而保险公司则猜测谁可能发生车祸。本章将向你展示他们是如何做的。你将学习：


    - ![](img/c-frascobalao.jpg) 将收集的数据转换为特征，

    - ![](img/c-bolacristal.jpg) 训练机器并对其进行评估，

    - ![](img/c-check.jpg) 系统地验证其预测方法，

    - ![](img/c-tune.jpg) 精细调整其齿轮以获得更好的结果。


    如果没有计算机，我们需要花费大量的时间和精力咨询顶级专家来做出预测。有了计算机，我们可以大规模地实现自动化。例如，银行可以自动批准贷款，在节省人员成本的同时更快地服务客户。在医疗领域，机器可以自动筛选高风险患者，以提供预防性护理并拯救生命。


    ## 模型


    在机器学习领域，做出预测的算法被称为模型。存在许多类型的模型，每种模型使用不同的数学技巧。其中一些技巧相当先进，但不必担心：我们不会深入探讨模型的工作原理。相反，我们将学习如何使用模型。


    想象你是 Sweetwater 小的一个房产中介，你想预测三套公寓的售价价格。你首先收集一些线索，例如它们到市中心的距离、房龄和面积。你可以将它们组织在表格
    `X` 中，每列代表一种线索，即 `feature`（特征），每行对应一笔公寓交易。然后你可以添加一列 `ypred` 来表示你的预测价格：


    ![](img/05-01-h.jpg)


    图 5.1 Sweetwater 出售的公寓。


    填充 `ypred` 列并非易事。特征表 `X` 本身并不并不提供任何参考价格点。如果这些公寓位于东京或廷布克图，价格肯定会不同！为了做出体面的预测，我们需要示例供学习。让我们在表中添加已经在
    Sweetwater 售出的公寓，并为它们标上真实销价 `y` 的标签，并将这些记录称为标记数据集。


    ![](img/05-02-h.jpg)


    图 5.2 Sweetwater 出售和已售出的公寓。


    从这张表中，你可能会开始直觉性地思考：114 m² 公寓的价格可能更接近 1,000,000 美元，而不是 100,000 美元。如果你收集了更多标记示例，就可以使用预测模型来帮助你。


    你不需要自己编写任何模型即可开始。大多数编程语言都有开源机器学习库可用。一旦安装了库，就可以将其模型导入你的代码中并立即投入使用。


    ![](img/i-05-01-h.jpg)


    ### 训练

    在可以使用模型进行预测之前，你必须让它学习。具体的语法取决于你使用的编程语言和库，但它归根结底总是调用训练函数，该函数将标记数据集的 `X` 和 `y` 表作为参数。由于它们描述的是同一组事件，这些表格必须包含相同行数的。随着模型的训练，它会调整内部齿轮，以找到一个数学公式，根据
    `X` 的行来近似 `y` 的值。通常，`X` 和 `y` 需要大量的示例，模型才能做出良好的近似。根据应用的不同，这个数字可能是几千、几百万或几十亿。


    ![](img/i-05-02.h.jpg)


    ### 预测

    一旦模型训练完成，我们就可以开始预测。如果我们现在取 `y` 未知的 `X` 行，就可以使用预测函数来做出估值 `ypred`。这个输出是模型对日后在现实生活中观察到的
    `y` 值的最佳近似。在这里，预测可能是非常不可靠的。为了做出更好的预测，我们需要远多于四个标记示例来训练模型。此外，这个模型只考虑了三个特征。让我们看看如何收集更多数据以训练更强大的模型。


    ![](img/05-03-v.jpg)


    图 5.3 “多亏于机器学习算法，机器人末日是短暂的。” 鸣谢来自 http://smbc-comics.com。


    ## 5.1 特征


    想象你在一家医院工作，出于物流考虑，你想预测每位入院患者将留多久。如果你开始寻找数据，你会发现不同格式的数百个表格。


    ![](img/05-04-v.jpg)


    图 5.4 原始医院数据。


    机器还没有智能，所以我们不能简单地把数据扔给它们并让它们自己训练开始预测。我们必须将数据处理成良好的 `X` 和 `y` 表。让我们看看是如何操作的。


    ### 数据适配


    从数据集构建 `X` 和 `y` 的第一步是检查我们拥有正确类型的数据。大多数预测算法只处理 ![](img/c-1a4.jpg) 数值数据。让我们看看如何处理其他类型的数据以便它们可以作为特征包含。


    ![](img/c-arquivo.jpg) 类别数据 我们说类别数据被编码为数值。编码方法取决于你的数据是二分类的、有序还是命名的。让我们看看这意味着：


    ![](img/i-05-03-h.jpg)


    **二分类数据编码**。有两个类别，因此一个类别表示为 0，另一个表示为 1。在这里，数据指示了患者的生理 1。


    ![](img/i-05-04-h.jpg)


    **有序数据编码**。类别是有顺序的，因此我们相应分配数字。例如，如果急诊表格让患者选择四个表情描述疼痛，可以用 1 到 4 的数字表示。


    ![](img/i-05-05-h.jpg)


    **命名数据编码**。当列的类别没有内在顺序时，我们通常将列编码为多个二分类特征：每个类别一个。这种技术被称为独热编码（one-hot encoding）。此示例展示了如何用它在四个特征中表示患者的血型。由于患者只能有一种血型，编码后的记录必须有一个单元格包含
    1，所有其他单元格包含 0。


    ![](img/05-05-h.jpg)


    图 5.5 从不同类型的类别数据获取特征。


    ![](img/c-cronometro.jpg) 时间数据 日期或时间记录最直接的方法是提取它们的数值部分：日期可以拆分为年、月、日三个特征，时间可以拆分为小时、分、秒。


    '
- fmt: '

    However, this is rarely helpful for a predictive algorithm. For instance, whether
    a patient is born in April or November should not affect their recovery time.
    On the other hand, whether they are twenty or sixty years old matters. Hence if
    you have the date of birth and the admission date, you can construct a new feature
    by calculating their age in years. If you are trying to predict how long they
    will stay in the hospital, you do the same for `y`: the length of stay is the
    number of days between admission and discharge.


    ![](image/05-06-h.jpg)


    Figure 5.6 Getting features from temporal data.


    ![](image/i-05-06-h.jpg)


    One other way to construct a feature is to convert and encode temporal data as
    categorical data. For example, if hospitalizations due to intoxication are more
    frequent at night or on weekends, this could have an impact on `y`. You can make
    this information available in `X` as binary data. A lot of hidden information
    can be brought to light this way, such as the season of the year, the occurrence
    of a holiday, or the availability of open drugstores. Create features for the
    chronological and seasonal patterns that are likely related to what you want to
    predict.


    ![](image/c-mundo.jpg) GEOGRAPHICAL DATA Geographical data is often represented
    by numbers in coordinates of latitude and longitude. On their own, these numbers
    only indicate how far north and east a place is. The numbers may be separated
    into different numerical features, but just as for temporal data, these features
    generally don’t help much.


    To construct meaningful features from geographical data, think about how the locations
    you have relate to what you want to predict. It is often useful to calculate distances:
    if you want to predict the prices of apartments, construct features for their
    distances to the city center, to the nearest beach, or to the nearest school,
    supermarket and hospital.


    ![](image/05-07-h.jpg)


    Figure 5.7 By converting patient addresses to geographical coordinates, their
    distance to the hospital may be constructed.


    Numerical coordinates can be transformed into categorical data as well, such as
    the town, neighborhood, or zip code. Some of this categorical data can even allow
    you to add more information as features, such as matching indexes for income and
    criminality levels.


    ![](image/c-macarrao.jpg) UNSTRUCTURED DATA It is estimated around 80% of the
    world’s digital data is unstructured, and thus cannot be encoded as rows and columns
    but rather as individual files. Constructing features from unstructured data is
    difficult. In order to obtain numerical data from unstructured data, we must find
    what quantifiable aspects of it are relevant to our project.


    Imagine, for example, that a set of patient records contain CT scans of their
    lungs. A useful number that physicians could obtain from the images is the area
    of the lungs of each patient.


    The most common form of unstructured data is text. What quantifiable aspect of
    a text file could we be interested in? The number of words is a simple, popular
    one. Another prevalent feature is the occurrence of specific words. For instance,
    the fact that a medical report contains the words “tumor” or “cancer” can be encoded
    as binary categorical data. Or, if we count the number of occurrences of a key
    word and divide that by the total number of words, we obtain the frequency at
    which it appears.[2](#CSU-2-12.xhtml#nota5-02)


    Guessing which useful features could be hidden in unstructured data is difficult.


    ### Combining Data


    Your raw data often comes in different shapes, and sometimes we can’t build features
    without combining.


    #### AGREGATES


    If we have some data that comes in multiple records, we use aggregations. For
    example, if you are predicting whether team will win, construct features from:


    ![](image/05-08-h.jpg)


    Figure 5.8 Constructing features by aggregating data.


    When attempting to predict future performance, aggregations are commonly used
    on past data. However, if we have many records in `X`, we can also use a score.


    #### SCORES


    We can express an attribute as a single number. A score is generated by math formula.
    For instance, body-mass index (`BMI`) is often used in health care and is calculated
    from height and weight:


    ![](image/05-09-h.jpg)


    Figure 5.9 The BMI calculated from height and weight.


    Well-designed scores encapsulate the knowledge of how multiple factors interact
    and contribute to features. For instance, if you’re trying to predict people will
    develop diabetes and you have height and weight, include the `BMI` score. In social
    sciences, the human development index (`HDI`) scores a country’s development from
    its literacy rate, mean life expectancy, and gross domestic product (`GDP`) per
    capita. In finance, the `FICO` credit score describes a person’s creditworthiness
    given their net debt and payment history.


    When there is no well-established score for a given metric, you can create your
    own. For instance, if you’re trying to predict future sales price of apartments,
    and you believe the perceived safety of the building is a good indicator, you
    can construct your own “safety score” that combines many factors: the number of
    crimes registered in the neighborhood, the building’s distance to a police station,
    whether it has a doorman, or a video-surveillance system.


    ### Missing Values


    Typically, the requirement for data to be numerical in `X` is strict: most predictive
    algorithms can’t handle NULL cells. When the value of a feature is unavailable
    for some records, we must rid the column of its empty cells.


    #### DROPPING


    The simplest method is to remove from `X` all the rows that contain one more NULL
    cells. Dropping is a good approach when few rows are affected. However, decreasing
    the amount of `X` data for training generally decreases the performance of a predictive
    model, and deleting too many rows will limit its predictive power. Moreover, dropping
    rows doesn’t only mean you have less data for training: it also means that you
    will drop the opportunity to make predictions for any important event with missing
    data.


    Sometimes, we have a column where most of the values are missing. In such cases,
    dropping that feature from `X` is often a better option as it allows you to save
    many rows.

