    \ (电子书)\n\n1. 计算机网络。2. 互联网。3. 计算机网络协议。4. 正则表达式（计算机科学）。5. 统计学。6. 数据挖掘。7. 机器学习。I.\
    \ 题名。\n\n004 – dc22\n\n2020925732\n\n第一版，2021 年 3 月。\n\n# 献献\n\n献给我们的朋友 Christophe\
    \ 和 Mateus，其中一人曾打赌我们会在年底前完成这本书。\n\n# 标题\n\n计算机科学与物理学有很多共同点。两者都是关于世界如何在基础层面上运作的。区别在于，在物理学中，你需要弄清楚世界是如何构成的；而在计算机科学中，你创造了世界。在数学和编程中一样，只要逻辑自洽，一切都是可能的。你可以有一组方程，其中三加三等于二。\n\
    \n你可以做任何你想做的事。\n\n—LINUS TORVALDS\n\n解释他对比计算机的热爱源于何处。\n\n# 目录\n\n目录\n\n- 前言\n\
    - 1 连接\n    - 1.1 链接\n    - 1.2 互联网\n    - 1.3 路由\n    - 1.4 路由\n    - 1.5 传输\n\
