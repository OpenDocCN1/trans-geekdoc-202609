    ## Data Cleaning


    Be very careful that zeros are never used instead of `NULL` when a cell lacks
    data. In the temperature records example (fig. 4.4), it would have been wrong
    to normalize “lukewarm” to a freezing `0.0` degrees Celsius! Unfortunately, this
    careless practice is all too common. For instance, a lot of software outputs the
    coordinates `(0°, 0°)` when it can’t obtain a location. No matter the type of
    data you have collected, check your zeros—are they accurate numerical records,
    or should they be `NULL`?


    ### Duplicates

    Ensure your tables have no duplicates: each row must record something unique.
    Let’s say a table stores the titles, release years, and genres of different movies.
    It should contain only one row for each movie. If two rows read “Metropolis, 1927,
    Sci-Fi”, delete one of them.


    Duplicates are harder to spot when data isn’t yet normalized. If a record has
    the genre `Sci-Fi`, and its duplicate, `Science Fiction`, a simple search won’t
    find the problem. Duplicate names with spelling mistakes or alternate spellings
    often survive undetected. Always normalize and cleanse your data, and carefully
    inspect similar rows to destroy duplicates. If you use a database management system,
    find which built-in tools and functions can help you do this.


    ### Data Anonymization

    Have the utmost respect for data that details people’s lives. Financial records,
    health care data, and private messages are only a few examples of immensely sensitive
    information that can never become public. In many organizations, everybody keeps
    a copy of the sensitive data they work with. A catastrophic data leak is just
    a hack away! Handle and store private data with extreme care.


    To mitigate risks, data should be transformed so that the amount of personally
    identifiable information is reduced. This is called data anonymization. Many countries
    already have laws that mandate anonymization of data in certain cases.


    ### Dropping

    Discard data that only serves to identify people. For example, first and last
    names, social security and tax identification numbers, phone numbers, and email
    addresses will almost never have any statistical relevance. Data without connections
    to demographics, organization goals, and behavioral patterns can be promptly dropped.


    ### Blurring

    Some personally identifiable data shouldn’t be dropped. For instance, age is important
    demographic information that often explains behavior–keep it. Exact dates of birth,
    however, can be used to find people and endanger anonymity. Store the year of
    birth alone: it preserves a sufficient indication of age, and it’s not personally
    identifiable. This process of sacrificing precision in favor of anonymity is called
    data blurring.


    Think of simple ways to decrease the precision of sensitive data. Suppose you
    work for a business that needs to keep track of customer spending. Will keeping
    records down to the penny help understand their behavior? Drop the cents to make
    records more anonymous. This also applies to their home address: the zip code
    is likely sufficient to target people in a specific area. Blur out the unnecessary
    precision.


    ### De-anonymization

    Even carefully anonymized data can often be “de-anonymized”, in a process called
    data re-identification. If you know enough about someone, you can filter the anonymized
    records and identify which one belongs to that person.


    Consider an anonymized dataset from a hospital. If you know someone’s age, sex,
    duration of stay, and type of illness, you can probably match his or her exact
    record in the anonymized dataset. Data anonymization is a deterrent, not a solution.
    Give anonymized data the same level of protection and secrecy as your raw sources.


    ## Reproducibility

    It can be tempting to get the data processing phase over with as soon as possible,
    without scripting and documenting every step. Such quick, dirty, and poorly documented
    jobs are said to have been done ad hoc. In general, ad hoc data processing is
    very bad practice.


    More often than not, new versions of the raw data will emerge. Sometimes, we simply
    receive a fresh data dump with additional records. If transformations were made
    ad hoc, it is difficult and time-consuming to repeat them on the new data. Furthermore,
    it is difficult to check if errors occurred during ad hoc data transformations:
    at any given stage, we can’t compare the state of the dataset to previous stages.
    Moreover, an identified error can be very difficult to revert.


    In order to avoid these issues, experienced data scientists ensure every transformation
    can be easily repeated. This is called reproducibility. You could achieve a basic
    level of reproducibility by documenting all the ad hoc transformations you perform
    in a log, but all the operations would still have to be carried out manually.


    Best practice is to write a program that performs all data transformation steps
    in a pipeline. This way, when data sources change, we can replay the transformations
    simply by running the program on the new raw sources. When working in a team,
    every member can inspect this program, which makes it easier to find bugs. Then,
    if a bug is found, it can be fixed in the program, and a new corrected dataset
    can be generated by running the upgraded program again.


    Crucially, never modify your raw sources directly: newly wrangled and anonymized
    data should be written to new files. Your raw sources hold the truth if ever you
    suspect there was an error and you need to roll back operations. If the raw sources
    contain sensitive information, don’t forget to ensure their access is restricted.


    ![](image/c-bussola.jpg)


    Now that your dataset is squeaky clean, you’re ready for the next stage: exploration.
    This is where the real fun begins. In the next sections, you will learn the foundations
    of Exploratory Data Analysis (EDA). You will learn to summarize and visualize
    your data. As you see the data, your intuition will develop. Intuition generates
    questions about the underlying phenomena that shaped the data. These questions
    can, in turn, guide you deeper in your analysis: it’s easier to find something
    when you know what you’re looking for.


    ### 4.3 Summarizing

    We can summarize many important characteristics of a dataset in a few numbers.
    This provides us with a quick idea of what the data says without having to inspect
    individual records. Let’s see some of the most useful numbers:


    #### Count

    Nicknamed `n`, it’s the number of individual records you have. For instance, if
    a health care table describes the hospitalization of two dozen patients, then
    `n=24`.


    #### Averages

    An average is the “central” or “typical” value of a group. There are several types
    of averages. The most ubiquitous is the mean: sum all values and divide by the
    count. Means are good averages, but they aren’t perfect. Let’s see why:


    ![](image/04-04-h.jpg)


    BITCOIN BUBBLE ![](image/c-bitcoin.jpg)

    Five friends claim to be blockchain experts and convince you to buy $100 in cryptocurrency.
    Each friend tells you how much they think the value of your wallet will change
    in dollars within a week depending on the coin you buy. You are considering Bitcoin,
    Ether, and Dogecoin. Which of those should you get?


    Which is better, `BTC`’s `(8, 6, 7)` or `ETH`’s `(2, 4, 3, 21)`? It’s hard to
    compare groups of numbers. To make it easier, we can summarize each group into
    a single number. Let’s try with the mean:


    ![](image/04-05-h.jpg)


    Ether’s higher mean hints that it has the best earning potential. However, note
    that Ether’s mean is heavily influenced by a single extremely high prediction.
    Maybe Bitcoin is a better bet, despite its lower mean.

