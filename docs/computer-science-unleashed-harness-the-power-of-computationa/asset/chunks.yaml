    With TCP, application data is split and communicated through payloads called segments.
    Similarly to UDP datagrams, TCP segments bundle the data with some extra information:


    ![](image/01-30-h.jpg)


    Figure 1.30 A simplified representation of a segment. Packets carrying segments
    have their protocol number set to `0x6`.


    Each of these fields is necessary for TCP to guarantee the integrity of the full,
    reassembled data:


    ### PORT NUMBERS

    A host typically manages multiple TCP channels for its different applications.
    Once a segment arrives, there must be a way for a host to match it with the communication
    channel to which it belongs. To this end, segments carry their source and destination
    port numbers. A TCP channel of communication can be uniquely identified by four
    numbers: the IP addresses of the hosts, and two port numbers–one chosen by each
    host.


    ### SEQUENCE NUMBER

    The sending host splits the application data in a sequence of small chunks. It
    assigns a sequence number to each chunk to indicate how they should be ordered.
    Each chunk is fit in a segment with its respective sequence number, and the segments
    are transmitted one-by-one on board individual IP packets. If segments arrive
    out of order, the receiving host reorders them using their sequence numbers. If
    a segment arrives twice, the host will notice the repeated sequence number and
    discard the duplicate data.


    ### ACKNOWLEDGMENT NUMBER

    Communication is bidirectional with TCP: remote applications simultaneously exchange
    segments. In order to keep track of which segment each host has received, they
    each include an acknowledgment number. It corresponds to the sequence number of
    the next segment the host expects to receive from its counterpart. For example,
    if Charles sends a segment with the acknowledgment number `44` to Ada, he acknowledges
    that he received all her segments until the sequence number `43`. If he has no
    data to send her, he must still send segments without data for acknowledgment
    purposes:


    ![](image/01-31-h.jpg)


    Figure 1.31 Charles receives an image from Ada. He has no data for her, so he
    sends empty acknowledgment segments. Notice that the sequence numbers of his segments
    don’t increase. While sending her data, Ada signals she is ready to receive Charles’
    segment No `20.


    After sending a non-empty segment, the sending host starts a timer for the receipt
    of its acknowledgment. If an acknowledgment takes too long to arrive, the sender
    assumes the packet was lost, retransmits the unacknowledged segment, and resets
    the timer.


    Hosts monitor the time it takes for acknowledgments to arrive. When the time increases,
    it’s a sign that the network is getting congested, so hosts reduce the rate at
    which they send out segments. When acknowledgment times decrease, it’s a sign
    that more bandwidth is available, so hosts send segments at a higher rate. This
    is called congestion control, and it ensures network bandwidth is appropriately
    utilized.


    ### WINDOW SIZE

    If a host receives too many segments at once, its computational resources can
    get overwhelmed. To ensure they are always capable of processing incoming data,
    hosts include a window size alongside the acknowledgment number. It indicates
    the number of bytes of data they are willing to receive beyond the last segment
    they acknowledged.


    Senders suspend their transmission of unacknowledged segments whenever their total
    size reaches the window size of their counterpart. This is called flow control,
    and it ensures the computational capabilities of each host isn’t exceeded. Using
    TCP, applications don’t have to worry about congestion control and flow control,
    as those are taken care of by their hosts. On the other hand, applications using
    UDP are responsible for adapting the sending rate to the network bandwidth and
    to the computational resources of their counterparts.


    ### TCP CHECKSUM

    Similarly to UDP datagrams, TCP segments include a checksum. It is added by the
    sending host and verified by the receiving host. If a corrupted segment is received,
    it is discarded without being acknowledged. This ensures all chunks of data eventually
    reach their destination free of errors.


    ## TCP Connection

    TCP communications are always conducted through a pair of segment threads called
    a TCP connection, as seen on Figure 1.31. Before two applications can start exchanging
    data through a TCP connection, their hosts must be able to recognize and sort
    the segments of that connection. They do so by remembering which port numbers
    correspond to which thread. Each host also chooses an initial sequence number
    to start its side of the connection, and it acknowledges the initial sequence
    number of its counterpart.


    For these reasons, establishing a TCP connection requires the exchange of three
    segments between the client and the server. The first two segments carry a special
    `SYN` flag that serves to synchronize the sequence and acknowledgment numbers
    of the threads. Additionally, an `ACK` flag is carried by segments whose acknowledgment
    numbers are valid and synchronized.


    ```

    (image/01-32-v1.jpg)

    ```

    ```

    (image/01-32-v2.jpg)

    ```

    ```

    (image/01-32-v3.jpg)

    ```

    Figure 1.32 ...


    ## TCP Sockets

    TCP sockets are either active or passive. Only active sockets can be bound to
    a connection. When TCP sockets are created, they’re active by default. Here’s
    how a client starts a connection:


    ```

    active_socket = Socket.new(IP, TCP)

    port_number = 80

    server_ip = [IP Address]

    active_socket.connect(server_ip, port_number)

    active_socket.send("When is Charles’ birthday?")

    ```


    The client must simply indicate the IP address of the server-host and the port
    number the server is listening to. All the procedures to start and maintain the
    TCP connection are performed by the host behind the scenes. After `connect()`
    ran successfully, `send()` and `recv()` can be called to exchange data.


    In order to expect and accept connection requests at a given port number, a passive
    socket must be used. A socket is made passive after it is bound to a port number
    and its `listen()` method is called. Here is how a server waits for a connection
    on port 80:


    ```

    server_socket = Socket.new(IP, TCP)

    server_socket.bind(80)

    server_socket.listen()

    active_socket = server_socket.accept()

    ```


    The server selects its port number. If another application already has a socket
    bound to the same port, `bind()` throws an error. When `accept()` is called, the
    server halts until a new connection request comes in, at which point a new TCP
    connection is created. The new connection is bound to a freshly created active
    socket. The original passive socket can be used to accept more connections to
    other hosts. The newly created active socket can be used to communicate with the
    client by calling `send()` and `recv()` on it.


    Often, servers will keep running `accept()` in a loop to establish many TCP connections
    with multiple clients and communicate with all of them simultaneously. That’s
    how a web server is able to serve thousands, or even millions of different client
    applications at the same time.

