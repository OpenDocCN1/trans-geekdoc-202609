    In order to address a question or intuition without drawing inaccurate conclusions,
    start by framing it properly. Express it as a hypothesis: a statement that can
    be supported or rejected by data you can collect. You will have to test the hypothesis,
    so do not assume it’s true or false yet. Make your hypothesis simple and objective,
    so that it’s easier to test.


    ## TASTE BUD TEST


    ![](image/c-sorvete.jpg) Your coffeehouse in Minneapolis was losing its vegan
    customers. Ten days ago, you decided to update the menu and offer green tea and
    coconut-milk ice-cream. You did so without any research, based on the following
    intuitions:


    ![](image/c-sopa.jpg) Vegan customers craved green tea on yoga days,


    ![](image/c-nojo.jpg) Customers didn’t like the old ice-cream selection.


    Now that the new menu is up and running, you wish to conduct a study to determine
    whether changing the menu was a good decision. Can you express each of your intuitions
    as a hypothesis? Try to formulate one that relates to your goals and that you
    can easily test.


    For ‘Intuition ![](image/c-sopa.jpg)’, it is difficult to find an objective measure
    of “craving”. However, one of the goals of your business should be to sell your
    products, so you can express the hypothesis as follows: Vegan customers buy green
    tea on yoga days. Testing this hypothesis could help you understand if your decision
    is likely to regain the loyalty of vegan customers. However, it requires some
    work: you must conduct a survey with personal questions to determine which customers
    are vegan yogis.


    ‘Intuition ![](image/c-nojo.jpg)’ is tricky to test, as surveying long-time customers
    can expose you to selection bias: you can only survey those who return, who are
    more likely to have enjoyed the old menu. However, this intuition is intimately
    related to your business goal of selling products, so a hypothesis could be:


    ![](image/c-graficoyen.jpg) Ice-cream sales are higher with the new menu.


    This hypothesis doesn’t give you much insight as to why you are achieving or not
    your ice-cream goals, but at least it is easily testable: your accounting system
    has likely been collecting sales data before and after the menu change. You already
    have all the data you need! Using an average, let’s summarize and compare the
    last 100 days of the old menu with the first 10 days of the new one:


    ![](image/04-34-h.jpg)


    Figure 4.34 Summarizing daily sales in order to test ‘Hypothesis ![](image/c-graficoyen.jpg)’.


    This data agrees with the hypothesis: sales were higher when the new menu was
    used. Is this evidence sufficient to confirm our hypothesis that the new menu
    would increase ice-cream sales?


    No. No conclusions can be drawn by comparing averages over this small dataset.
    Many other factors may have affected the data. Changes in customer behavior could
    stem from other changes made to your coffeehouse, such as the table layout. They
    could result from factors outside of your control, such as the weather:


    ![](image/04-35-h.jpg)


    Figure 4.35 Daily peak temperatures and ice-cream sales at your coffeehouse in
    Minneapolis. Temperatures are shown on top in black (left scale), ice-cream sales
    are shown under in color (right scale).


    Regardless of your menu, customers will surely eat more ice-cream on a hot day
    than during a blizzard! Maybe higher temperatures caused the increase in sales,
    not the new menu. Maybe you were lucky. And if you can’t be sure of what caused
    the change in sales, how can you know if the result of the hypothesis test reflects
    the truth? In the next sections, we’ll delve into the methods scientists developed
    to address this issue with diligence.


    ## Experiments


    Good researchers always develop procedures to reduce the uncertainties around
    their results. A scientific procedure to test a hypothesis is called an experiment.
    Hypotheses can only be properly tested via well-designed experiments.


    The first step of experiment design is to identify the variables you need to measure
    and the data you must collect. For ‘Hypothesis ![](image/c-graficoyen.jpg)’, these
    variables are sales and menu. We already have them as columns in fig. 4.34.


    There are always other variables that affect those you wish to study. We call
    them extraneous variables, and watch out: they can potentially lead you toward
    wrong conclusions. Try to collect data on extraneous variables if your records
    don’t already include them.


    If you observe fig. 4.35 closely, you will notice peaks in sales seem higher when
    the weather is warmer. The sales are fairly irregular, but we can notice a peak
    in sales every seven days. Maybe people eat more ice-cream on weekends! We already
    identified two extraneous variables: temperature and day of the week.


    When you’re exploring the data, keep searching for clues to identify different
    extraneous variables. When you find them, make sure your records are updated accordingly:


    ![](image/04-36-h.jpg)


    Figure 4.36 Collecting data on factors that may influence sales.


    In a well-designed experiment, the hypothesis is tested using records where the
    variance of extraneous variables is minimized. However, this may severely restrict
    the number of usable records. For instance, if we only consider the same day of
    the week with a similar peak temperature, only two data records remain:


    ![](image/04-37-h.jpg)


    Figure 4.37 Comparing sales in similar conditions.


    Sales were lower with the new menu in this experiment. The data does not support
    ‘Hypothesis ![](image/c-graficoyen.jpg)’, therefore we’re a bit closer to rejecting
    it. But can we reject it?


    No. Even when designing an experiment, we can never control everything. There
    are always other factors that affect the data, some of which are difficult to
    identify. Could you possibly have known that your sales were boosted both by a
    group of competitive eaters visiting the area and by unusual number of homes with
    malfunctioning freezers? Conversely, could you possibly have known that an unexpected
    surge of pollen kept people home, reducing your potential sales? The world is
    too complex for you to identify all extraneous variables, no matter how hard you
    try. At some scale, the complexity of our universe will always yield random fluctuations
    independent of any extraneous variables we can find. Such random fluctuations
    are colloquially called noise. When too few data points are available, it’s difficult
    to know which fluctuations are noise and which are not, and the truth gets blurred.
    Ultimately, the more data we have that supports a hypothesis, the closer we get
    to confirming it. Conversely, the more data we have that disagrees with the hypothesis,
    the closer we get to rejecting it. Unfortunately, in fig. 4.37 there are only
    two data points, and that’s insufficient to confirm or reject the hypothesis.
    We need more data.


    ## P-Values


    Since it decreases uncertainty, one might be tempted to keep collecting more data
    forever. Let’s try to determine how much data is enough to be confident that the
    hypothesis test result reflects the truth.


    Since it’s always possible to be unlucky and obtain data that supports a false
    hypothesis, statisticians developed methods to estimate how unlikely it is that
    this occurred. This kind of method is called a statistical hypothesis test:


    ![](image/04-38-h.jpg)


    Figure 4.38 Statistical hypothesis test in action.


    The probability that we were unlucky is called the p-value. The smaller the p-value,
    the closer we are to confirming the hypothesis. If the hypothesis is true, then
    collecting more data will tend to decrease the p-value.


    There are many different types of hypothesis tests, each best suited for a specific
    scenario. For the p-value to be meaningful, do your research and make sure you
    pick one that corresponds to your data and hypothesis. They all work in a similar
    way: you input experimental data, and they output a p-value for the hypothesis
    you’re testing.

