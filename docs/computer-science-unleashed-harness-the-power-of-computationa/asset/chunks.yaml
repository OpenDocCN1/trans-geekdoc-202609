    ### 版后记


    本书使用 `XELATEX` 创建，这是 Donald Knuth 的 `TEX` 系统的一种排版引擎。正文使用了 `Charter` 字体，这是由 Matthew
    Carter 在 1987 年设计的字体，基于 18  世纪 Pierre-Simon Fournier 的字符。其他字体包括 `Source Code Pro`、`Source
    Sans Pro` 和 `Calendas Plus`。


    表情 ![](img/c-lingua.jpg) 由 `Twemoji` 友好提供，这是一个由 Twitter 维护的开源项目。


    封面图像根据 1941 年至 1945 年间制造的第一批电子计算机原理图创作：`Zuse` 的 `Z3`、`Turing` 的 `Colossus`、`Harvard`
    的 `Mark I` 以及 `ENIAC`。


