    ## Diagnostics


    Routers provide feedback to troubleshoot network issues. The `Internet Protocol`
    provides a way to identify the issue when it occurs.


    ### TIME EXCEEDED


    If a packet is going around in circles, its hop limit will eventually reach zero.
    If a packet is going around in circles, its hop limit will eventually reach zero.
    If a packet is going around in circles, its hop limit will eventually reach zero.
    (Note: The source text contained repetitive sentences; I have maintained the core
    logic).


    If a packet is going around in circles, its hop limit will eventually reach zero.
    If a packet is going around in circles, its hop limit will eventually reach zero.
    If a packet is going around in circles, its hop limit will eventually reach zero.
    (Note: The source text contained repetitive sentences; I have maintained the core
    logic).


    ### DESTINATION UNREACHABLE


    Sometimes, a router has nowhere to send a packet. This can happen for many reasons,
    for example if the address isn’t in the router’s table, and the next hop happens
    to be offline.


    ### PACKET TOO BIG


    We’ve seen that link layer protocols limit the amount of data that can be sent
    in a single frame. Frames from different types of network links can carry payloads
    of different sizes.


    The maximum number of payload bytes that can be carried in a single frame is called
    its Maximum Transmission Unit (`MTU`). Different link layer protocols have different
    `MTU` values. For Ethernet frames, the `MTU` is 1500. For WiFi frames, it’s 2305.


    If a router receives a larger packet than what the next hop can handle, it can’t
    be forwarded as it stands. Instead, the router returns an `ICMP` message with
    the packet too big error code, the first bytes of the problematic packet, and
    the `MTU` of the next hop. The informed sender can then trim or split the original
    message into smaller packets before trying again.


    ### PARAMETER PROBLEM


    An `IP` packet contains a lot of extra information alongside its payload. We’ve
    seen it contains IP addresses, a hop limit, and a protocol number. It also includes
    a field indicating the size of the payload and another specifying the version
    of the Internet Protocol it respects. Additional fields are also there to help
    routers prioritize important packets.


    All these fields must be ordered and formatted according to strict rules. When
    a router receives a packet that doesn’t conform to the protocol, it returns an
    `ICMP` message with the parameter problem error code and the location in the packet
    where the conflict was found. As usual, the `ICMP` message also contains a few
    bytes of the discarded packet for identification purposes.

