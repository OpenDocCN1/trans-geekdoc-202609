    Each independent set of communication rules forms a protocol, and the collection
    of all such protocols constitutes the application layer. The first application
    layer protocol we’ll see works like an address book, which is directly or indirectly
    consulted by nearly every application that connects to the Internet.


    ## 2.1 Names


    We can only send an IP packet to a host if we know its IP address. Yet, we never
    even memorize IP addresses of mainstream hosts such as Google’s, Amazon’s, or
    Facebook’s.


    Engineers realized it’s impractical to refer to hosts using big numbers, so they
    created the Domain Name System, or `DNS`. It associates easy to read names with
    IP addresses. Thanks to `DNS`, we can contact hosts using names like `google.com`,
    `amazon.com`, or `facebook.com`.


    When you type `facebook.com` in a web browser, it uses `DNS` to find an IP address
    linked to that name. It can then request the website by sending IP packets to
    that address. If you had directly typed Facebook’s IP address in the browser,
    the `DNS` registry wouldn’t have been consulted; yet the same web page would still
    show.


    `DNS` depends on the cooperation of many computers across the Internet. These
    computers communicate according to the `DNS` protocol to maintain the name registry.
    Most Internet applications, such as web browsers and email clients, use `DNS`
    to find the IP addresses of the hosts they have to connect with. But before we
    can explore the rules of this protocol, let’s learn some underpinning concepts–starting
    with the hierarchical structure of the names.


    ### Domains


    Names in `DNS` are called domain names, or domains. They’re made of text labels
    separated by dots. Labels can use the 26 letters from `a` to `z`, digits from
    `0` to `9`, and the hyphen (`-`). For example, `book-2.code.energy` is a domain
    with three labels.


    Dots indicate hierarchical subdomains. Subdomains are domains overseen by a shorter
    parent domain: `book-2.code.energy` is a subdomain of `code.energy`. Likewise,
    `code.energy` is a subdomain of the single-label domain `energy`. Domains are
    case-insensitive: `code.energy` and `coDE.enERgy` are the same.


    Every domain has an owner. Owners can create subdomains of their own domains.
    Ownership of a subdomain is transferable at anytime by the parent domain owner.
    For example, Verisign is an American company that owns both `com` and `net`. In
    1997, at the request of a small team of nerds, Verisign created `google.com` and
    granted them ownership over it.


    Single-label domains, such as `com`, `net`, and `energy`, are called Top Level
    Domains, or `TLDs`. Due to the way it was designed, `DNS` is more efficient when
    there’s a limited number of `TLDs`. For this reason, creating new `TLDs` is difficult
    by design. Usually, when individuals and organizations want a domain, they request
    a subdomain from the owner of an existing `TLD`, most notably `com`.


    Nonetheless, many powerful organizations possess their own `TLDs`. In 2014, Google
    was granted the `google` `TLD`. In 2016, Motorola was granted the `moto` `TLD`.
    More critically, Amazon is trying to obtain the `amazon` `TLD`, but the governments
    of Brazil and Peru oppose the venture as they consider the name belongs foremost
    to their.


    ### ICANN


    In order for domain names to be universally understood, there must be a way for
    everyone to agree on who has ownership of each `TLD`. This requires consensual
    processes for the creation of `TLDs`. To this end, it was decided that an American
    non-profit organization, the Internet Corporation for Assigned Names and Numbers
    (`ICANN`), has authority over `TLDs`.


    When `ICANN` authorizes the creation of `TLD`, it often requires the new owner
    to allow the general public to register subdomains. That is the case for most
    of existing `TLDs`, including `com`, `net`, and `energy`. In order for Verisign
    to maintain their ownership of `com`, they are required by `ICANN` to accept requests
    for the creation of subdomains by anyone.


    Sometimes, `ICANN` allows owners of `TLDs` to use them for exclusive interests.
    For instance, `gov`, and `mil` are controlled by the US government. They only
    create domains for government bodies, such as `nasa.gov`, and `space.mil`. Likewise,
    the owner of `edu` only allows educational institutions to have `.edu` domains,
    such as `mit.edu` and `caltech.edu`. Likewise, Google uses `edu` exclusively for
    company affairs, such as `grow.google` and `blog.google`.


    In addition to general-use `TLDs` and exclusive-use `TLDs`, `ICANN` assigns two-letter
    country-code `TLDs` and cedes their control to their respective governments. Colombia
    has `co`, the United States has `us`, and the British Ocean Territory has `io`.
    Occasionally, `ICANN` creates `TLDs` for famous geographical areas. For instance,
    `rio` was given to Rio de Janeiro city.


    ### Name Servers


    `DNS` records link data to domains. A domain can have many records, each binding
    a chunk of data to the domain. All records have a code that indicates the type
    of information they carry. For example, `AAAA` records link a domain to an IP
    address:


    ```

    print.net AAAA 2600::

    ```


    All `DNS` records must be stored on name servers: special hosts that share their
    records with anyone on the Internet at any time. A domain’s owner must grant at
    least two name servers with the authority to store its `DNS` records. Domain owners
    may either provide these themselves or hire third parties to do so.


    Ownership of domains is enacted through `DNS` records. For example, recall Verisign
    owns `com`. In principle, Verisign’s name servers would contain all records for
    `.com` domains, including `google.com`. However, this is not the case, because
    Verisign keeps the following records in its name servers:


    ```

    google.com NS ns1.google.com.

    google.com NS ns2.google.com.

    ns1.google.com AAAA 2001:4860:4802:32::a

    ns2.google.com AAAA 2001:4860:4802:34::a

    ```


    An `NS` record states that the given Name Server has authority over a domain.
    With the above records, Verisign delegates the responsibility to store all records
    associated with `google.com`. Verisign effectively hands control of the domain
    to Google, who hosts the cited name servers. This gives Google the authority to
    set `DNS` records for `google.com` in their own name servers.


    ### ROOT SERVERS


    Special name servers called root servers are appointed by `ICANN` to have the
    authority to store `DNS` records of `TLDs`. New `TLDs` are created when `ICANN`
    asks `NS` records to be added to these servers. There are 13 root servers–ICANN
    makes their IP addresses well known. The University of Maryland, NASA, and the
    US Army are some of the entities that host a root server.


    ### Querying


    Name servers have two functions: store records and answer queries. Most Internet
    applications rely on them. Your web browser, for example, only works if it has
    a way to discover the IP addresses of the websites you wish to reach.


    Name servers expect queries on UDP port 53. Typically, a `DNS` query message and
    its reply fit in one datagram. To illustrate how it works, let’s query name servers
    using the `dig` program. It sends a datagram to the IP address we specify, containing
    a query that conforms to the `DNS` protocol. `dig` is invoked from the command
    line as follows:


    ```

    dig@[address] [domain] [type]

    ```


    This sends a datagram to the given address on UDP port 53, asking for records
    of a specific type, associated with the given domain. When a datagram arrives
    in response, `dig` decodes it and displays the records in plain text.


    Suppose we want to connect with `icmc.usp.br`, but we only know the IP address
    of NASA’s root server: `2001:500:a8::e`. Let’s ask NASA what’s the name server
    responsible for `icmc.usp.br`:


    ```

    dig @2001:500:a8::e icmc.usp.br. NS

    ```


    The root server replies with the following records:


    ```

    br. NS a.dns.br.

    a.dns.br. AAAA 2001:12f8:6::10

    ```

