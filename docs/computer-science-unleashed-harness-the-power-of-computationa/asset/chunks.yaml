    In fig. 1.23, only two peering links were shown for clarity’s sake. A typical
    ISP actually has scores of peering links per IXP they’re wired to. In addition,
    it’s common in big cities for Internet corporations like Netflix and Google to
    establish peering links directly with ISPs, allowing them shorter and faster connections
    to many of their customers.


    # Internet Backbone


    ISPs and other telecom companies typically expand their interconnections as much
    as possible by establishing peering links wherever they can. However, in order
    to reach networks they cannot peer with, they have to buy transit from other operators.


    There is a handful of companies in the world that don’t pay anyone for transit.
    These companies operate huge networks that all peer with each other, allowing
    regional ISPs to be interconnected globally. These huge networks are called `Tier-1`
    networks, and they form the backbone of the Internet. Some `Tier-1` networks are
    operated by `AT&T`, `Verizon`, and `Lumen`.[12](#CSU-2-8.xhtml#nota1-12)




    # Dynamic Routing


    Large telecom companies must maintain connectivity even if some of their transit
    or peering links break down. This means that they can’t rely on a single link
    for each routing prefix in their table of addresses. In fact, they have dynamic
    routers that map out how other networks are interconnected in order to choose
    which routes to prioritize in their tables.


    Dynamic routers periodically exchange information with other dynamic routers they’re
    linked to. They tell each other which network prefixes are reachable through each
    of their links. This allows them to determine how many hops away each link is
    from every routing prefix and where these hops occur. Dynamic routers can then
    determine the best route to each prefix based on metrics like distance and speed.[13](#CSU-2-8.xhtml#nota1-13)


    With this information, dynamic routers build a table that covers all routing prefixes.
    For each prefix, the table indicates which next hop is on the best route to the
    final destination. When a link is established or a link goes down, dynamic routers
    inform their peers. As the news spreads, all of them update their tables to keep
    forwarding packets towards the best routes.


    There is no central entity coordinating the exchange of this information: routers
    share link details with their peers freely and voluntarily. Consequently, routing
    problems often emerge.


    ## Routing Loop


    Misconfigured routers can provoke errors. Most notably, bugged tables of addresses
    can send a packet back a few hops, and it gets caught in an endless cycle of doom:


    ![](image/01-25-h.jpg)


    Figure 1.25 Bugged tables sending a packet round in circles.


    If the tables aren’t corrected, more packets with the same intended destination
    will be endlessly forwarded in circles. Too many packets can even saturate and
    clog the links. This is known as a routing loop problem. Fortunately, the Internet
    Protocol provides a way to identify the issue when it occurs.


    ### HOP LIMIT


    To interrupt perpetual routing loops, all `IP` packets carry a hop limit between
    0 and 255. It indicates the number of times the packet can be forwarded by routers.
    Typically, packets are created with a hop limit of 64. Whenever a router forwards
    a packet, it reduces the hop limit by one:


    ![](image/01-26-h.jpg)


    Figure 1.26 A packet’s hop limit is the only element of an `IP` packet that routers
    change while forwarding.


    If a packet is going around in circles, its hop limit will eventually reach zero.
