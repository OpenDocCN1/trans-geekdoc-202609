- fmt: '

    # FALSE ALARMS


    From a customer’s perspective, there’s one more important metric: how often will
    my honest transactions get rejected? The percentage of truly good transactions
    that were incorrectly classified as fraud is called the false alarm rate, also
    known as the false positive rate. For instance:


    ![](image/c-sono.jpg) Incorrect about 10 of 990 honest transactions, FAR ![](image/p-equivale.jpg)
    1.0%,


    ![](image/c-oculosescuros.jpg) Incorrect about 19/990 honest transactions, FAR
    ![](image/p-equivale.jpg) 1.9%,


    ![](image/c-terror.jpg) Incorrect about 87/990 honest transactions, FAR ![](image/p-equivale.jpg)
    8.8%.


    Here, the paranoid model distinguishes itself from the others by raising many
    false alarms: nearly one in ten honest transactions are classified as fraud. Depending
    on the application, the false alarm rate is used instead of the precision in order
    to quantify a model’s usefulness.


    When evaluating your model, try to formulate what you are calculating in a sentence
    rather than with math only. In our example, we could say: “the paranoid model
    blocked 8.8% of transactions by honest clients.” This can help you choose which
    metrics matter the most.


    ## Classification Trade-Off


    A classifier’s `predict` function outputs the label it believes each row is most
    likely to assume. In addition, most classifiers can provide its estimation of
    the probability that a row belongs to a label. This way, we can change a model’s
    label assignment logic to predict a label more often. This technique allows us
    to obtain two seemingly very different models from a single engine:


    ![](image/08-03-h.jpg)


    Figure 8.3 Classifying using two different thresholds.


    By setting a lower threshold, the model is more sensitive to clues for fraud,
    so sensitivity gets a boost. On the other hand, more purchases are incorrectly
    classified as fraudulent, thwarting precision.


    Since the precision, sensitivity, and F1 scores change according to the threshold,
    a single measurement of these scores isn’t sufficient to comprehensively evaluate
    a classifier. In our small sample, the higher threshold yields F1 ![](image/p-equivale.jpg)
    0.67, whereas the lower threshold yields F1 ![](image/p-equivale.jpg) 0.57. However,
    this doesn’t necessarily indicate the higher threshold is preferable.


    Choose your evaluation method and classifier threshold according to real world
    needs. If the benefit of identifying fraud is high, and the downside of incorrectly
    classifying valid purchases is low, the higher threshold may be better.


    In general, we try to assess the minimal acceptable sensitivity and precision
    scores early. If other people are going to use our classifier, they should help
    determine the bounds of the trade-off for adjusting the threshold.


    ## ROC Curves


    The early-warning radar was a brand new technology at the onset of World War II.
    Radars sometimes picked up signals which puzzled its operators. They weren’t always
    sure if faint signals came from enemy aircraft or from parasitic radio noise,
    yet they had to decide whether to raise the alarm. A false alarm wasted precious
    resources, but ignoring a real threat could have devastating consequences.


    While trying to determine which radio signals were true threats, a radar operator
    worked similarly to a classifier. The metrics used to score classifiers also work
    to gauge radar performance: the sensitivity is the percentage of incoming enemy
    aircraft that triggered an alarm, and the false alarm rate is the percentage of
    non threatening radio signals that triggered an alarm.


    Radar operators quickly realized there was a trade-off between the sensitivity
    and false alarm rate. Sensitivity could be boosted by making radio receivers register
    weaker signals, but doing so also made it trigger more false alarms. To decide
    how sensitive their radio receivers should be, they decided to collect data at
    many different settings and plot the resulting scores:


    ![](image/08-04-h.jpg)


    Figure 8.4 If this old radar was tuned to detect 95% of invading aircraft, about
    80% of non-threatening radio signals resulted in false alarms. Making the receiver
    less sensitive reduced the false alarm rate to 20%, but in doing so, only 60%
    of incoming aircraft could be detected.


    They called it a receiver operating characteristic (ROC) curve. With time, improved
    radars delivered high sensitivity for the same false-alarm rate, and ROC curves
    moved upwards on their plots. In general terms, the better the radar technology,
    the larger the shaded area under the curve (AUC score) shown in fig. 8.4.


    You can plot a ROC curve for your own classifier by calculating the sensitivity
    and false-positive rate for all possible classification thresholds. The curve
    can help you decide which threshold to use.


    Also, the AUC score is a good indicator of the classifier’s overall performance.
    This score is useful as a generic assessment of predictive power, especially if
    you haven’t yet chosen which threshold you’ll use with the classifier.


    ## Multiclass Classification


    Scores for binary classifiers can also be adapted for classifying more than two
    labels. For instance, suppose you are guessing if a person was born in the US,
    Mexico, or Canada. You train a classifier, and then try it with 100 people: 65
    Americans, 25 Mexicans, and 10 Canadians. Prediction results can be summarized
    in a 3-by-3 confusion table, so we can see how predictions were right or wrong
    for each label:


    ![](image/08-05-h.jpg)


    Figure 8.5 Confusion table of a multiclass classifier.


    The table shows where the model is confused. It had a difficult time differentiating
    ![](image/c-eua.jpg) and ![](image/c-mexico.jpg): Americans were incorrectly classified
    as Mexicans 24 times, and Mexicans were incorrectly classified as Americans 11
    times. This suggests that more features with clues to distinguish Mexicans should
    be added.


    The diagonal of black numbers contains the correct guesses. The model was correct
    39+13+9=61 times out of 100, so its accuracy is 61%. As we’ve seen, accuracy can
    be misleading, and we must use metrics such as sensitivity and precision in order
    to capture a model’s true predictive power. Since these metrics are defined for
    binary classification, we must re-express our multiclass classifier as a combination
    of binary classifiers:


    ![](image/08-06-v.jpg)


    Figure 8.6 A multiclass classifier seen as three binary classifiers. For each
    label, a confusion table is built where all other labels were grouped. For instance,
    the first confusion table shows how the model classified people as American or
    non-American.[1](#CSU-2-15.xhtml#nota8-01) With this trick, we can calculate precision,
    sensitivity, and F1 for each label.


    In order to obtain a single score for the model, we calculate the mean of the
    three individual F1 scores, which is 0.64. This is called the macro F1 score.
    However, this score can be unfair: the ![](image/c-canada.jpg) label contributes
    to the macro score as much as the ![](image/c-eua.jpg) label, even though there
    are over six times more ![](image/c-eua.jpg) labels. When averaging label scores,
    it’s best to calculate a weighted mean, where each weight is the count of a label
    in `y`. We call it the micro F1 score:


    ![](image/i-08-09-h.jpg)


    Make sure you see in fig. 8.6 where each of the numbers 65, 25, and 10 come from.
    Moreover, remember these scores only represent the performance of the model for
    the specific label thresholds you are using, as seen for binary classifiers. If
    you adjust the thresholds, the same model will yield different scores.


    [1] If the output `ypred` is one-hot encoded, each of these confusion tables corresponds
    to one of the one-hot encoded columns.

