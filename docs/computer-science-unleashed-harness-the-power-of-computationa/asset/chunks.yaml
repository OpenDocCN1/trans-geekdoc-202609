    # The future of data analysis can involve great progress. Will it? That remains
    to us, to our willingness to take up the rocky road of real problems, in preference
    to the smooth road of unreal assumptions.


    —JOHN TUKEY


    # DATA POWERS KNOWLEDGE


    Whether you’re conducting a survey to measure customer satisfaction or running
    the Large Hadron Collider to advance particle physics, you expect to learn something
    from the data you collect.


    Data can easily be misunderstood or misinterpreted. Fortunately, data analysis
    is here to help us generate reliable knowledge. Different scientists have different
    approaches to data analysis, often depending on the nature of their research and
    the amount of data they have access to. This chapter proposes a data analysis
    workflow for programmers, divided in four stages: collection, processing, exploration,
    and testing. You’ll learn to:


    *   `![](image/c-envio.jpg)` Collect data reliably and comprehensively,

    *   `![](image/c-tesoura.jpg)` Process it into a clean and robust dataset,

    *   `![](image/c-bussola.jpg)` Kick off exploration by summarizing values,

    *   `![](image/c-luneta.jpg)` Explore deeper through data visualization,

    *   `![](image/c-cerebro.jpg)` Draw conclusions by testing your intuitions.


    When dealing with data, we often overlook crucial steps in this intricate process.
    We record inaccurate measurements, ignore important information, or draw incorrect
    conclusions. What’s more, data analysis is iterative: at any stage, we may realize
    that an earlier step could be improved. It can quickly become a convoluted process.


    To avoid the mess, we must be methodical. It’s tedious, but rewarding. Rigorous
    data analysis helped Charles Darwin to discover the origin of species, and may
    enable SpaceX to make life multiplanetary. Wield it on your most ambitious projects.


    ## Intelligence


    Imagine you own a small, struggling coffeehouse. In order to develop a profitable
    strategy, you must know your business. Which drinks do your customers prefer?
    How many coffees are sold per day? How much does an average customer spend? At
    what time do most customers come and go? Do your suppliers compare favorably to
    others? Did these metrics evolve over the past few months?


    The answers to these kinds of questions are valuable. They allow you to plan effectively
    and to define key performance indicators to gauge and track progress. To compile
    such essential knowledge, well-managed organizations analyze their data and create
    periodic reports. Workers and managers can then easily review progress and identify
    areas for improvement.


    Many organizations do more than issue reports on their data–they track it in real
    time, such that the consequences of their actions can be monitored on virtual
    dashboards. Such processes support decision-making through learning and distributing
    information, and they form what people call business intelligence.


    `![](image/04-01-h.jpg)`


    Figure 4.1 Hospital emergency room dashboard, tracking in real time the number
    of patients across different units.


    Business intelligence isn’t limited to commercial business. Consider a public
    hospital’s emergency room where one can use a “business” intelligence dashboard
    to track the flow of patients (fig. 4.1). Then, for example, if there is an unusual
    spike in waiting times, hospital admission staff are quickly alerted and can address
    the situation before it escalates.


    As a result of this intelligence, the hospital is also better prepared for crises.
    If a serious accident occurs in the area, the hospital will be able to immediately
    observe a drop in the number of available patients.


    ## Collection


    Useful data only emerges from collection. It can be difficult. If your goal is
    to improve data, you can use it to identify patterns. For example, you can use
    data to predict future trends.


    ## Kinds of Data


    Try to obtain data when you need it. It can be important. If your goal is to measure
    performance, you can use it to track progress. As programmers, we like to use
    the following:


    `![](image/i-04-01-h.jpg)`


    The first four kinds of data are said to be structured: they are organized in
    a predefined manner. For instance, electric power is measured in `Watts`, every
    medal at the `1896 Olympics` was awarded for one sport, dates can be organized
    in a calendar, and international borders are defined along `coordinates`.


    Computers are good at handling structured data. On the other hand, unstructured
    data is hard for them to digest. There are special methods for extracting structured
    data from unstructured data. For example, facial recognition software can take
    an unstructured video feed and output someone’s identity as categorical data.


    ## Getting Data


    Many of our daily activities are facilitated by computers, therefore our behavior
    and actions often leave a digital footprint. Inspect computer systems to trace
    this data. Install your own sensors to collect more, or change how your company
    operates. Additionally, you can often get useful data from third parties.


    ## EXISTING DATA


    Hospital computers often monitor vital signs of patients, such as heart rate and
    body temperature. Restaurant computers record what was ordered at each table.


    ## NEW DATA


    There is always interesting data going unrecorded. For instance, most restaurants
    don’t record how happy customers feel. To remedy this, each bill can come with
    a slip for the customer to rate the service on a scale from one to ten. As long
    as you’re not transgressing ethical boundaries, always look for ways to capture
    more data.


    ## SORS


    We often think of sensors for studying natural phenomena, for example, climatologists
    need sensors for temperature, air pressure, humidity, and more. However, sensors
    can also be valuable for businesses. Shopping malls often use presence sensors
    to record a daily visitor count, and restaurants can use sound meters to track
    the ambient noise that their customers experience. Moreover, web applications
    often use virtual sensors in order to track the behavior of users, such as the
    time they spend on individual pages.

