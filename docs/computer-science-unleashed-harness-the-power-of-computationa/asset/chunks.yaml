    # 图 1.10

    `SAm-1` 系统连接了来自 11 个不同国家的 16 个城市的路由器，使用了超过 1.5 万英里的海底电缆。


    `Miami`（迈阿密）和 `Buenos Aires`（布宜诺斯艾利斯）路由器之间没有直接连接。然而，`Miami` 连接到 `Puerto Rico`（波多黎各），`Puerto
    Rico` 连接到 `Fortaleza`（福塔塔萨），后者连接到 `Rio de Janeiro`（里约热内卢），而后者连接到 `Buenos Aires`。如果沿途路由器能够往回转发消息，`Miami`
    和 `Buenos Aires` 就可以通过这些电缆交换信息。如今，有海底电缆连接着全球数百个沿海城市的路由器：


    ![](img/01-11-h.jpg)


    # 图 1.11 目前在役的光纤海底电缆。


    地球上几乎每个其他城市都直接或间接地与这些沿海城市连接，通常通过地下电缆。通信卫星也拥有路由器，用于与远程位置建立无线链路。所有路由器都可以转发消息，因此你在互联网上发送的一条消息可以路由到互联网上的任何其他计算机。前提是能够找到通往它的路径。


    ## 位置地址


    在链路层中，计算机通过物理地址进行标识。物理地址唯一地标识计算机，但它们没有提供关于计算机连接在何处以及如何访问它的任何提示。如果计算机移动到世界的另一端，它将仍然保留其物理地址！


    假设你通过邮政给 `Louis` 寄了一个包裹，随信附上了一张他的照片，而不是他的地址。这个包裹有一个定义的目的地；然而，国际邮政服务不知道应该将包裹寄往哪个方向才能送达
    `Louis`。


    邮局必须首先知道包裹应该寄往哪个国家。然后，该国家的第一邮局应该知道应该寄往哪个省份或州。下一个邮局应该知道城市，而最后一个邮局则知道街道地址。包含所有这些信息的地址被称为层级地址。就像邮局一样，路由器也需要包裹收件人位置的层级地址：


    ![](img/01-12-v.jpg)


    # 图 1.12

    `Ada` 想要给 `Louis` 寄包裹，因此她请求她的路由器 `Charles` 转发该包裹。她在包裹上写下了 `Louis` 的层级地址。`Charles`
    知道他必须将包裹寄往 `France`（法国），因此将其发送给了他连接的法国路由器：`Marie`。


    为了让这种机制在全球范围内运行，所有涉及的计算机必须遵循相同的规则来创建和处理数据转发请求。`China` 的计算机必须理解来自`Nigeria` 计算机的请求，尽管两者可能使用不同的语言、操作系统和硬件。


    ![](img/01-13-h.jpg)


    # 图 1.13 “互联网之前”，感谢来自 [`xkcd.com`](http://xkcd.com)。


    ## 互联网协议


    我们已经看到计算机必须遵循“介质访问控制”（Medium Access Control）规则来与另一台计算机建立连接。同样，它必须遵循“互联网协议”（Internet
    Protocol，简称 `IP`）来请求路由器将消息转发到你局域网或互联网上的其他计算机。


    遵循 `IP` 规则的消息转发请求被称为 `IP 数据包`。`IP 数据包` 本质是一个巨大的数字，特定位置的数字编码了关键信息。几乎所有计算机都理解 `IP
    数据包` 并能够转发它们。这使得 `IP 数据包` 容易从一台计算机移动到另一台计算机，直到到达目的地。


    ### IP 数据包结构


    `IP 数据包` 本质是一个巨大的数字，特定位置的数字编码了关键信息。几乎所有计算机都理解 `IP 数据包` 并能够转发它们。这使得 `IP 数据包` 容易从一台计算机移动到另一台计算机，直到到达目的地。


    （注：原文中此处存在大量重复段落，已根据“不要重复输出原文”的原则进行处理。）


