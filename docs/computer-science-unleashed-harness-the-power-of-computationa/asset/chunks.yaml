    given prediction ypred is from the true y is to calculate the error between the
    two:


    error \= ypred − y.


    This gives one error value per row of X and y. Typically, we summarize all those
    errors using a type of average. Here are some common ways to do it:


    MEAN ABSOLUTE ERROR (MAE) The mean is the most commonly used average. However,
    when calculating a mean, positive and negative errors cancel each other out and
    give us a false sense of precision. In order to avoid this, the MAE is the mean
    of all absolute errors, i.e. the mean of all errors ignoring their negative signs.
    For instance, let’s suppose we’re training a model to predict apartment prices
    in thousands of dollars, based on the labeled examples from fig. 5.2:


    ![](image/05-17-h.jpg)


    Figure 5.17 Calculating the MAE of four predictions.


    Following this method, the average error is of $102,000. If we had calculated
    the mean of errors instead of absolute errors, we would have obtained a misleading
    average of $4,000! Always ensure you sum positive values when calculating the
    MAE.


    ROOT MEAN SQUARE ERROR (RMSE) In some cases, a single wildly inaccurate prediction
    may result in catastrophe. If we’re sensitive to extreme errors, we can make our
    evaluation penalize them more by calculating the mean of the squared errors:


    ![](image/05-18-h.jpg)


    Figure 5.18 Calculating the RMSE of four predictions.


    This time, the predictions yield an average error of about $121,600. Here, there
    is no problem with negative numbers, since the square of a negative number is
    always positive. Furthermore, the RMSE is the square root of the mean, which brings
    the value back to the original scale of the errors.


    Let’s see how the choice between MAE and RMSE affects training. Imagine that the
    model tried to improve itself, and now yields the following predictions:


    ![](image/05-19-h.jpg)


    Figure 5.19 Evaluating new predictions using MAE and RMSE.


    The MAE increased from $102,000 to $110,000, whereas the RMSE decreased from about
    $122,000 to about $112,000. This shows that the question “Is the model improving?”
    from one training iteration to the next (fig. 5.16) can be answered differently
    depending on which evaluation method is used.


    Be careful not to compare model errors when they are predicting outputs of different
    scales. For example, if the same model were trained to predict the monthly rent
    of the same apartments, the MAE and RMSE would likely be around $500. These smaller
    scores would not indicate that the model got any better: they would simply translate
    the fact that the entire y column of labels was about 200 times smaller.


    The MAE and RMSE can give some insight into a model’s ability to predict the future.
    The better the model generalizes to new data, the closer these scores will be
    from the errors of future predictions.


    WHAT ABOUT CLASSIFIERS? If your model is a classifier, it will output labels as
    it predicts, not numbers–meaning the scoring techniques we’ve seen cannot be used
    on it. Scoring a classifier can be much more complicated than scoring a regressor.
    To avoid distracting you from the main topic of how a prediction system is built,
    we placed our comprehensive explanation of how to score classifiers into Appendix
    IV. Make sure to check it out later!


    5.3      Validation


    Sometimes, a model is trained in a way that makes it too attached to the specific
    events it learned from. When that happens, the model approximates y values for
    records in the labeled dataset far better than for records it has never seen.
    This is called overfitting.


    When we evaluate an overfitted model for the events it learned from, the resulting
    score is misleading. Since this is always a risk, we validate our models: we evaluate
    their predictions for events not used in training. This is the only way to ensure
    the model’s score isn’t deceptively good because of overfitting. This way, the
    score better reflects the model’s true performance: the one we can expect from
    it when making actual predictions out in the real world.


    In order to be able to validate a model, we must set aside some labeled examples
    before we start training. To that end, we split the rows of X and y into a ![](image/c-chapeuformatura.jpg)
    training set and a ![](image/c-check.jpg) validation set. The model is trained
    using data from the training set, and scored by how it predicts the events in
    the validation set.


    ![](image/05-20-v.jpg)


    Figure 5.20 The validation set is kept aside for a final, independent evaluation
    of the model.


    Note that rows of the labeled dataset must be split at random. Splitting the dataset
    without shuffling its rows often adds selection bias to the process.


    No strict rule dictates how large each set should be. Typically, 10% to 20% of
    the data is reserved for validation. The bigger the training set, the better the
    model can learn to perform. The bigger the validation set, the more certain we
    can be that the final score reflects the model’s true performance. Still, unless
    the validation set is extremely large with hundreds of thousands of records, data
    scientists hardly ever rely solely on the single score obtained through this simple
    dataset split.


    Unfortunately, the records we choose to include in the training or validation
    sets influence our final score. Often, different selections of the labeled dataset
    aren’t equally as difficult for the model to learn from. If you evaluate the model
    only once, there’s a risk you shuffled the rows into an atypical training or testing
    set–resulting in a score that doesn’t reflect the model’s true performance.


    Cross-validation mitigates this risk by repeating the entire process several times.
    Each time, the labeled dataset is split into different training and validation
    sets. This yields many scores, which collectively describe the model’s performance.
    Let’s learn the three most common ways to perform cross-validation.


    K-Folds


    Instead of splitting the shuffled dataset in two, as we did for creating a pair
    of training and validation sets, let’s split it into ten different groups, or
    folds, of (almost) equal size:


    ![](image/05-21-h.jpg)


    Figure 5.21 Shuffling 365 records into folds of 36 or 37 each.


    Using these folds, we can construct a training set by joining the records in the
    first nine folds, while reserving the last for validation:


    ![](image/05-22-h.jpg)


    Figure 5.22 Folds 1-9 are the training set, fold 10 is the validation set.


    By reserving a different fold for validation, we can construct ten different training
    and validation sets. This lets us evaluate our model ten different times, yielding
    ten different scores:


    ![](image/05-23-v.jpg)


    Figure 5.23 Ten different training and validation sets.


    This technique is called k\-fold, as any number of folds could have been used.
    With more folds, you evaluate your model more times, and the number of records
    in the training sets increases. However, more folds also require more computations.
    Also, the training sets become more similar to each other, which negates some
    of the advantages of evaluating the model multiple times. It’s generally best
    to stick to the default configuration most scientists use: either five or ten
    folds.


    Monte Carlo


    With k\-folds, each record gets to be in the validation set just once. This means
    that each record is used for model validation a single time. This can be a problem:
    if the model had been trained with a different selection of training data, it
    would likely predict some events differently. This is never explored using k\-folds.


    In contrast, the Monte Carlo method allows a single record to be in many validation
    sets for a more thorough validation of the model. Instead of using a fixed set
    of folds, it entirely re-shuffles the labeled dataset before each split. This
    way, it selects many random training and validation sets, then trains and scores
    the model for each random selection.'
