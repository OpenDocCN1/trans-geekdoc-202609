    \ 100 美元，那么他可以在每次想要额外获得 100 美元时都可能重放那条消息。\n\n请注意：这种漏洞还允许攻击者获取有关使用 `ECB` 模式加密的长明文的信息。例如，假设我们想要加密一个图像文件。当我们把图像文件的部分分割成明文块时，相同阴影和颜色的区域将产生相同的密文块：\n\
    \n![](img/03-08-h.jpg)\n\n图 3.8 使用 ECB 模式分组加密的图像。明文的模式（左侧）重复出现，而这些重复块在密文中的布局（右侧）揭示了内容的本质。\n\
