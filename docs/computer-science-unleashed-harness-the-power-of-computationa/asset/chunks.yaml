  trans: "\n\n可以创建可以通过 浏览器操作的复杂系统。一个典型的例子是如 `Hotmail` 和 `Gmail` 等网络邮箱系统。这些网站允许人们通过浏览器使用电子邮件。Web\
    \ 服务器负责与邮件服务器通信，使用户户无需从 Web 客户端直接建立任何 `SMTP` 连接即可发送电子邮件。\n\n为了实现这一点，HTML 页面可以包含\
    \ JavaScript 代码。我们就可以编写出具有与其他图形应用程序相同功能的网页了！网页正逐渐从纯粹的超文本文档演变为功能完善的应用程序。\n\n##\
    \ 结论\n\n我们学习了一些最著名的互联网应用及其协议，但还有许多我们尚未探索的内容。例如，我们在第 1 章中看到，路由器必须定期交换连通性信息。出于这一目的，它们运行在\
    \ `TCP` 端口 `179` 上使用边界网关协议（`BGP`）进行通信。如果你想深入学习 `BGP` 和其他有趣的协议，请查看末尾的参考文献。\n\n\
    ## 端口号\n\n我们已经看到每个协议如何关联特定的 `TCP` 或 `UDP` 端口号。使用相同协议的应用程序几乎总是期望相同的端口号上建立连接。例如，你不需要知道使用哪个端口号来从主机获取网页页面——Web\
    \ 服务器期望在 `TCP` 端口 `80` 上建立连接。`IANA` 是决定每个协议标准端口号的组织。当创建一个新协议时，其开发者会向 `IANA` 发送一个应用程序以预留端口号。23\n\
    \n与其开发新协议并申请端口号，许多互联网应用开发者会借用现有的通用协议进行通信。例如，许多应用程序通过与 Web 服务器集成在互联网上可用。在这种情况下，使用\
    \ `HTTP` 在应用程序（而不是 Web 浏览器）之间传输原始数据（而不是网页页面）。\n\n## 点对网络\n\n在本章中，我们只探索了遵循客户端-服务器架构的应用层协议。然而，还有另一种称为点对网络（`P2P`）的架构，其中每个应用程序同时充当服务器和客户端。`P2P`\
    \ 协议的显著例子包括文件共享协议 `BitTorrent`，以及两个最大的加密货币网络 `Bitcoin` 和 `Ethereum`。\n\n点对网络服务消除了用户之间的中间人，并且没有单点故障。`BitTorrent`、`Bitcoin`\
    \ 和 `Ethereum` 无法被关闭。美国军方广泛使用 `P2P` 技术，使部队能够在没有中央协调且不依赖于手机塔等中心化基础设施的情况下运行。\n\n\
    ## 安全\n\n我们还没有涉及的互联网另一个重要方面是其缺乏安全性。任何操作路由器都可以读取并修改到达它的任何数据包的数据。我们已经看到 `IP` 数据包在穿越互联网的过程中会被许多未知路由器的处理。因此，我们必须将传输在\
    \ `IP` 数据包上的所有数据视为可能的公开信息，并且不能完全信任通过互联网接收的数据在传输过程中没有被更改。为了缓解这一缺陷，应用层协议通常包含加密方案，以便数据不会被中间人读取或被无察觉地篡改。在下一章中，我们将看到它是如何工作的。\n\
    \n## 参考文献\n\n- `Computer Networking: A Top-Down Approach`, 作者 Kurose \n  – 在 `http://code.energy/kurose`\
    \ 获取\n- `Computer Networks`, 作者 Tanembaum \n  – 在 `http://code.energy/tanenbaum`\
    \ 获取\n\n1 亲自验证，访问网站 `http://[2a03:2880:f003:c07:face:b00c::2]`(http://%5B2a03:2880:f003:c07:face:b00c::2%5D)。\n\
    2 你可以在 `http://code.energy/tlds`(http://code.energy/tlds) 找到顶级域名（TLDs）列表。\n3 访问网站\
    \ `http://about.google`(http://about.google) 亲自验证。\n4 `ICANN` 控制 `IANA`，即分配 `IP`\
    \ 地址前缀的组织。\n5 TLD 遵循 `ISO 3166-1 alpha-2` 国家代码分配，除了英国在内的少数例外。它们的国家代码是 `GB`，但被赋予了\
    \ `uk` 域名。\n6 注意 `sprint.net.` 域名。在官方记录中，所有域名都以点结尾。在日常使用中，为了方便，最后的点通常省略。\n7 `dig`\
