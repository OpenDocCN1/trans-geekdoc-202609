    - 3 安全\n    - 3.1 遗留问题\n    - 3.2 对称性\n    - 3.3 非对称性\n    - 3.4 哈希算法\n    - 3.5\
    \ 协议\n    - 3.6 黑客攻击\n- 4 分析\n    - 4.1 收集\n    - 4.2 处理\n    - 4.3 总结\n    -\
    \ 4.4 可视化\n    - 4.5 测试\n- 5 学习\n    - 5.1 特性\n    - 5.2 评估\n    - 5.3 验证\n  \
    \  - 5.4 调优\n- 结\n- 附赠：模式\n    - 匹配\n    - 量化\n    - 锚点\n    - 分组\n- 附录\n    -\
    \ I 进制基础\n    - II 破解位移加密\n    - III 破解替换加密\n    - IV 评估分类器\n\n前言\n\n前言\n\n我从不喜欢“计算机科学”这个词。我不喜欢它的主要原因是根本没有这回事儿。计算机科学是一堆松散关联的领域，由于历史偶然偶然凑在一起的，就像南斯拉夫亚一样。\n\
    \n—PAUL GRAHAM\n\n我们时代大多数技术突破都发生在程序员创造的新数字世界中。计算机科学家通过结合不同领域来赋予这个新世界。本书探索了其中一些领域的基础，包括网络、加密和数据科学。\n\
    \n我们将从两台计算机如何连接并共享信息开始，一直到电子邮件和网页的兴起。我们将探索加密，并理解互联网以及处理隐私数据的系统是如何安全的。然后，我们将学习如何从原始数据中获取知识，以及机器如何学习预测未来。\n\
    \n我们希望这些故事能让你熟悉一些重要的概念，这些概念对程序员和技术爱好者都有益。\n\n"
