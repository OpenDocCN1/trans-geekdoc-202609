    In this book, we explore how computer science has radically changed the way we
    exchange information and learn from large amounts of data, but we don’t examine
    how the computers themselves work and how coders interact with them. This is because
    we already cover the core concepts of computer science in our first book, `Computer
    Science Distilled`. We strongly recommend you check it out!


    ### Computer Science Distilled


    `Computer Science Distilled` is a brief walk-through of essential computer science
    concepts you must know. Its writing style is similar to `Computer Science Unleashed`:
    academic formalities are kept to a minimum, and the language is clear and accessible.
    It was also designed for beginners.


    It starts with a light introduction to discrete math and then presents common
    algorithms and data structures. It finishes by outlining the working principles
    of computer hardware and programming languages. Understanding these topics are
    your next step to computer science mastery, as they neatly complement the content
    of this book. Get your copy of `Computer Science Distilled` at:


    [http://code.energy/computer-science-distilled](http://code.energy/computer-science-distilled)


    ![](image/i-08-11-h.jpg)


    ### Colophon


    This book was created with `XELATEX`, a typesetting engine for Donald Knuth’s
    `TEX` system. The text is set `Charter`, a typeface designed by Matthew Carter
    in 1987, based on Pierre-Simon Fournier’s characters from the XVIII Century. Other
    fonts include `Source Code Pro`, `Source Sans Pro` and `Calendas Plus`.


    The emoji ![](image/c-lingua.jpg) were kindly provided by `Twemoji`, an open-source
    project maintained by Twitter.


    The cover image was created from schematics of the first electronic computers,
    built between 1941 and 1945: `Zuse`’s `Z3`, `Turing`’s `Colossus`, `Harvard`’s
    `Mark I`, and the `ENIAC`.

