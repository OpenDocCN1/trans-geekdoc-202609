    shortly thereafter. However, height ( ![](image/c-regua.jpg) ) and weight ( ![](image/c-balanca.jpg)
    ), to obtain the BMI, typically come after a couple of days. Measurements of vital
    signs such as heart rate ( ![](image/c-coracao.jpg) ), blood pressure ( ![](image/c-balao.jpg)
    ), and body temperature ( ![](image/c-termometro.jpg) ) are made all along the
    patient’s stay. Finally, cost of stay ( ![](image/c-notasdinheiro.jpg) ) can only
    be calculated after the patient is discharged:


    ![](image/05-14-h.jpg)


    Figure 5.14 Time line of observations for a typical patient.


    The length of stay y is observed at discharge. We can already see that including
    ![](image/c-notasdinheiro.jpg) in the feature table X of labeled examples would
    be pointless, as it would amount to predicting the past! To determine precisely
    what data cannot influence X, let’s add on the time line the moment y is observed,
    and when we would want the model to estimate ypred.


    ![](image/05-15-h.jpg)


    Figure 5.15 The observations in gray should never influenceX.


    Any values measured or observed after the moment ypred is evaluated shouldn’t
    be included in X, even during the training phase. In our example, the BMI should
    not be included in the features since it depends on ![](image/c-regua.jpg), which
    is typically measured after the prediction is made. The vital signs can be included
    in X if they only aggregate the values measured on the first day.


    As long as you can ensure no data is leaking, extract as many features as you
    can. This improves the chances that your model will find good patterns to make
    reliable predictions. Let’s now see how to choose a model and evaluate how accurate
    those predictions are.


    5.2      Evaluation


    After building X and y, the next step is to choose a model to train. The first
    thing you’ll notice is that models are either regressors or classifiers. Regressors
    predict quantities, while classifiers predict labels. To predict people’s nationality,
    you’ll use a classifier. But to predict people’s age, it’s better to use a regressor.


    Pick one of your library’s models and get started. Don’t worry about which specific
    model to choose–you can pick any. At this point, simply ensure you’re picking
    a regressor if your y is numerical data—or a classifier if it’s categorical data.


    Most models use a technique called supervised learning. The trick is for the model
    to make a series of guesses on its training examples. Each time, the model will
    use its internal predict function and then evaluate how well it predicts by comparing
    the output ypred with the true y. Using this evaluation and some math tricks,
    it will try to improve itself and guess again. Once the predictions stop improving,
    the model will stop training. The following flowchart summarizes the process:


    ![](image/05-16-h.jpg)


    Figure 5.16 Supervised learning in action.


    Now we have a trained model that we can use to predict the future. Sweet. But
    how well can the model predict? How can it be evaluated? There are several different
    evaluation metrics, which either work for regressors or for classifiers. Let’s
    start with the former.


    Evaluating Regressors'
