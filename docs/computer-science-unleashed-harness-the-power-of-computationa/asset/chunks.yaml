  raw: 'Such discovery broadcasts, like all other transmissions, contain the sender’s
    MAC address. Walking around with a smartphone can therefore be like walking around
    with a loudspeaker shouting your name non-stop, only using radio waves instead
    of sound and the MAC address instead of your moniker. In 2013, Edward Snowden
    revealed that the NSA[3](#CSU-2-8.xhtml#nota1-03) monitored the movements of people
    by sniffing WiFi transmissions in big cities, storing records of where each MAC
    address was seen.


    You can also set your own network interface to promiscuous mode, and it will pick
    up all transmissions regardless of their intended recipient. Doing so allows you
    to discover hidden WiFi networks, to list which MAC addresses are in your area,
    and sometimes even to read the contents of other people’s transmissions. Browsing
    the Internet through an unsecured WiFi network can therefore be unsafe: your communication
    is broadcast for anyone in range to hear. This is why encryption[4](#CSU-2-8.xhtml#nota1-04)
    is important for WiFi’s link layer.


    Be careful: a network interface can be configured for its transmissions to start
    with any MAC address for both the recipient and the sender. Nothing stops a malicious
    agent from impersonating you by using your MAC address in their transmissions.
    This type of attack is known as MAC spoofing. When the link layer was invented,
    security wasn’t a concern. Protocols are evolving to become more secure and neutralize
    such attacks, but it’s an ongoing process.


    Frames


    Sometimes, a transmission must contain a lot of data, and sending out a single,
    big fat message is impractical. Network interfaces and computers are not all capable
    of the same transmission speeds. Moreover, what would happen if a collision occurred
    in the middle of the transmission? The entire transmission would have to be discarded,
    as it would be difficult for the sender and receiver to determine exactly which
    parts of the message were received and which were not.


    To solve these issues, long messages are always split into small parts, each sent
    as an independent transmission. The duration between transmissions can vary according
    to the capabilities of both computers: slower devices needs longer breaks. If
    an error occurs, it is only necessary to discard and resend the small transmission
    that failed.


    ![](image/01-07-h.jpg)


    Figure 1.7 An Ethernet frame. Once it is transmitted in a copper wire, it becomes
    a series of electric signals that encode a number. The Ethernet protocol instructs
    how to interpret this number. For instance, the first 12 hex digits of the number
    encode the destination MAC address.


    Each independent transmission is called a frame. Standard WiFi protocols cap the
    size of frames to 2,346 bytes. Thirty-four bytes are needed for MAC addresses
    and error-detecting codes. Therefore, a WiFi frame can ultimately carry up to
    2,312 bytes of data, called the payload.[5](#CSU-2-8.xhtml#nota1-05) In wired
    networks, the maximum frame size is usually 1,526 bytes, with room for a 1,500
    byte payload.


    On rare occasions, disturbances in the medium interfere with a transmission, and
    the receiver picks up signals that don’t encode exactly the same information that
    the sender intended to transmit. Let’s see the special field that was added to
    address this problem.


    FCS The last part of the frame is the FCS (Frame Check Sequence), and it ensures
    that information was transmitted accurately. It doesn’t add new information to
    the transmission: it is merely the result of a calculation using the contents
    of all other fields. Changing any content before the FCS should cause the FCS
    number to change as well.


    Upon receiving a frame, a computer calculates the expected FCS number from the
    information it received and compares it to the received FCS. If they don’t match,
    the frame is discarded. If they match, we know that the message wasn’t garbled
    and trust that the received payload is error-free.


    TYPE The frame shown in Figure 1.7 has one last field we haven’t talked about:
    the payload type. It tells the receiver which rules should be followed to interpret
    the data in the frame’s payload. In the next section, we’ll explore the most common
    set of such rules.


    1.2      Internet


    We’ve seen that the link layer enables directly connected computers to exchange
    messages inside frames. The internet layer, also known as the network layer, specifies
    how to transmit these messages between computers that are not directly connected.


    The trick is to equip some computers, called routers, with multiple network interfaces.
    All computers in a network are then linked to at least one router, and all routers
    are linked to at least one other router. When a router receives a message at one
    of its network interfaces, it can forward it to another router through a different
    network interface.


    LOCAL AREA NETWORKS We can ask a router we’re linked with to forward a message
    to a computer we’re not linked with. Suppose you have a wired network in your
    home connecting a router and a desktop computer. Suppose the router is also directly
    connected to a smartphone in a different, wireless network.


    Even though the desktop computer and the smartphone are not directly connected
    to the same network, they can send messages to each other using the router as
    a relay. Computers from different networks in close vicinity that can talk to
    each other through routers form a larger network, called a Local Area Network
    (LAN).


    In a home or small office, one router will be enough to link all the computer
    networks in the area. When assembling a LAN that covers a large organization such
    as a university or hospital, many routers may be required to link all the different
    computers networks into a fully connected system.


    ![](image/01-08-h.jpg)


    Figure 1.8 In this small LAN, Ada and Andrew can send messages to each other through
    their router Charles.


    WIDE AREA NETWORKS But why stop there? If your router is linked with a router
    outside your home, which in turn is linked with a router at the university, you
    can ask for your message to be forwarded to computers on the university’s LAN.
    When distant LANs are connected to each other, they form a Wide Area Network (WAN).


    ![](image/01-09-h.jpg)


    Figure 1.9 Charles is connected to a distant router, Marie, and they both forward
    messages around this WAN.


    A WAN can grow larger as more LANs are connected to it. Different WANs can also
    be connected to form an even larger WAN. The largest WAN in the world is a collection
    of thousands of interconnected networks that we call the Internet. It’s the network
    we use every day to send emails and browse the web. In 2019, this WAN contained
    over a billion computers. Let’s see how they all got connected.


    Interconnection


    The most straightforward way to connect your router to the Internet is to pay
    for it. Some organizations on the Internet will link one of their routers to yours,
    and allow messages to and from your network to pass through their network via
    this link. This paid service is called transit, as all of your messages will transit
    through their network before going to the specific router you’re aiming for.


    However, transiting through a third party network is not always necessary in order
    to connect to another router of the Internet. If, for example, two nearby universities
    communicate a lot, they can link their routers in order for messages to flow directly
    between their networks. This can save money, as these messages would otherwise
    have to transit through a paid connection. The free exchange of messages between
    the networks of different organizations is called peering.


    Routing


    Any computer linked to a router of the Internet can ask for its messages to be
    forwarded by other routers. Messages can be routed over large distances. For instance,
    there is a system of submarine cables linking routers in many coastal cities:


