  raw: 'Screens allowed for the creation of the cursor: a movable indicator that specifies
    the location of interaction between the shell and the screen. Users started to
    use non-printing characters to ask the shell to move the cursor. Crucially, cursors
    allowed previously printed text to be replaced or deleted, making interactions
    with computers more efficient. This sparked a surge in the development of computer
    programs with interactive text-based interfaces.


    Video monitors were introduced in the late 1960s, and the first commercial computer
    with a Graphical User Interface (GUI) appeared in 1979. Today, virtually all personal
    computers such as laptops and phones run a shell that operates a GUI: we interact
    with icons and windows using mice, trackpads, and touchscreens.


    ![](image/02-03-h.jpg)


    Figure 2.3 “Command Line”, courtesy of [http://commitstrip.com](http://commitstrip.com).


    Still, many IT specialists continue to interact with their computers via CLI.
    This can be by necessity, for example to operate GUI-less corporate servers, but
    also by preference. Many geeks use their GUI only to open a terminal emulator:
    an app that hooks into the CLI shell and transforms your screen and keyboard into
    a glass teletype.


    Terminal emulators are powerful interfaces.[15](#CSU-2-9.xhtml#nota2-15) Via CLI,
    one can perform nearly any text-based task, such as organizing folders, sending
    emails, writing code and compiling software. We actually wrote and edited this
    book on terminal emulators!


    ![](image/02-04-h.jpg)


    Figure 2.4 Running dig on a Linux or MacOS terminal emulator.


    Telnet


    For most of the 1950s and 1960s, a terminal had to be wired directly to a computer
    in order to communicate with its shell. However, this changed in 1969, when engineers
    devised a way to connect terminals to any computer on a network. They called it
    teletype network, or telnet.


    Terminal emulators can use telnet to access distant computer shells over the Internet.
    The CLI of a distant shell must be extremely reliable as unordered or missing
    characters could cause it to execute erroneous and potentially destructive commands.
    For this reason, the preferred transport layer protocol for telnet is TCP rather
    than UDP. Telnet servers typically expect connections on TCP port 21.


    When a TCP connection is established on port 21, the telnet server launches a
    shell and sends all incoming data from the connection into the shell. The output
    of the shell is sent to the client. On the client side, all characters typed by
    the user are transmitted to the server in real time, character by character. And
    when the client receives one or more characters, they’re displayed on their terminal
    emulator.


    Usually, after a telnet connection is established, the distant shell asks for
    a username and password for authentication. Once logged in, the telnet client
    works as a terminal hooked directly to the server. If a computer runs a telnet
    server, any computer connected to the Internet can act as a terminal for that
    server.[16](#CSU-2-9.xhtml#nota2-16) Geeks can operate a computer on another continent
    as if they were sitting right next to it with a screen and keyboard!


    Communication protocols over the Internet are not exclusively used by geeks. Let’s
    now have a look at the most popular applications of the Internet, starting with
    the best-known way of exchanging written messages.


    2.4      Mail


    In the 1960s, the few computers that existed were shared by many users. At that
    time, “mail” programs were already popular, but they only allowed a user to leave
    a message to a peer who worked on the same computer. These programs simply appended
    text to files that served as mailboxes. One mailbox file was attributed to each
    user. When users logged into their computers, alerts would appear if their mailboxes
    contained new messages.


    During the 1970s, computer networks grew and the technology to access files in
    distant computers materialized. Mail programs evolved to append text to mailboxes
    of remote computers. This allowed users of distant computers to exchange messages
    as if they were on the same machine. Over time, programmers improved the efficiency
    of these systems by gradually adopting a common message format, which looked like
    this:


    From: White at SRI-ARC


    Date: 24 JUL 1973 1527-PDT


    Subject: Multi-Site Journal Meeting Announcement


    NIC: 17996


    At 10 AM Wednesday 25-JULY there will be a meeting


    to discuss a Multi-Site Journal in the context of


    the Utility. Y’all be here.


    The message starts with headers, which carry general information about the message,
    such as its sender, recipient, and subject. Each header takes one line, and a
    colon separates the header name from its value. After the headers, an empty line
    signals the start of the message body. These messages were widely used by computer
    geeks, who began calling them email (the e stands for electronic). To this day,
    the emails we exchange still follow this format!


    In 1973, the above email could be replied to by appending a new message to the
    mailbox file White in the computer SRI-ARC. At the time, TCP/IP and DNS didn’t
    exist, and computers were referred to by such nicknames. Later, the at was deprecated
    in favor of @, so the mailbox in the example would be written white@SRI-ARC. For
    context, SRI stands for Stanford Research Institute, one of the organizations
    that helped to create and standardize this message format.


    Mail Servers


    Computers gradually became less expensive, and by the 1980s it wasn’t uncommon
    for someone to be working on multiple machines. Yet, it would be easier to reach
    people by email on large scales if each person had a primary mailbox address at
    a single location. Many groups of users decided to monitor their primary mailbox
    on the same host, as if everyone still worked on a single computer. Organizations
    facilitated this by designating one of their computers as the mail server.


    University students and tech engineers would have an account in their organization’s
    mail server, regardless of which computers they happened to be using. Everyone’s
    primary email address would point to this mail server. From their different computers,
    people would use telnet to log into the mail server and read emails stored in
    their individual mailbox files.


    In 1985, DNS was rolled out, and it vastly improved the email system. Organizations
    started to adopt domain names and to create MX records to publicly announce their
    mail servers. Domain names became the standard way of addressing mailboxes. For
    instance, the mailbox named White in SRI’s mail server would now be addressed
    as white@sri.com.


    When given this email address, anyone could use DNS to discover the mail server
    that stores its mailbox file and send IP packets to that computer. However, in
    order to store a new message in someone else’s server, one had to first be granted
    access to its mailbox files. This was cumbersome, so engineers started to invent
    ways for emails to be received without the external manipulation of any file on
    the receiving server.


    This was the rise of email protocols. Just as NTP provides the framework for programs
    to exchange time, mail protocols allow programs to exchange emails. Various protocols
    were developed and soon every mail server abided by one of them. Emails could
    now be sent to virtually any location that IP packets could reach.


    As any organization connected to the Internet could participate, email quickly
    gained prominence. What started off as simple notes left on a friend’s desk was
    gradually becoming as important as traditional written correspondence.


    In the 1990s, Internet Service Providers started bringing Internet access into
    people’s homes. As one of their main selling points, ISPs often invited customers
    to open email accounts on their servers. In those years, personal computers were
    also starting to ship with email programs pre-installed. People mostly used them
    to connect to their ISP or employer’s mail server.'
