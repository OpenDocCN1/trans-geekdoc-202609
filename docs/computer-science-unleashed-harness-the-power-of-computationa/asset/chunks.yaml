    on web pages. For instance, some websites compile reviews of bars and restaurants.
    If you need this data, write a script that visits those pages and copies the relevant
    chunks to your computer. This is called web scraping, and it’s fairly common—there’s
    even free software that automates the process.


    # PRIVACY

    Be careful not to collect personally identifying information about people without
    their explicit consent. That is simply unethical. Furthermore, do not trick people
    into accepting intrusive privacy policies, as some companies do with their lengthy
    terms and conditions that nobody ever reads.


    ## Selection Bias

    Imagine you own the restaurant collecting customer satisfaction slips. You’re
    receiving more submissions than you can process, so you decide to only survey
    10% of clients. If the staff selects who gets surveyed, they might prefer to pick
    customers in a good mood. As a result, data could indicate customers are more
    satisfied than what we would observe if everyone got surveyed.


    This problem is called selection bias. It could also occur if you only give slips
    to clients who sit at specific tables. They might feel differently because they’re
    seated in a noisy spot or have the sun in their faces. This could affect responses,
    and your data would still not reflect reality. Let’s consider another example:


    ![](image/i-04-02-v.jpg)


    # ARMORED ACE![](image/c-escudo.jpg) It’s the Second World War, and your name
    is Wald. Enemy air defenses are taking their toll on the Navy, and you have mapped
    out all the shots that returning planes sustained. The engineers tell you they
    must limit weight, thus they can only add armor to one of three locations: the
    wings, the fuselage, or the engines. Which would you pick?


    At first, it seems that adding armor to the fuselage or wings is best, as that’s
    where most shots hit. However, the data is extremely biased: you only mapped shots
    from returning planes. You didn’t map shots from planes that were lost! It turns
    out many crashes resulted from engine damage. The best way to save pilots is to
    add armor there.


    Our biases are often hard to spot because they act on our intuition in ways we
    don’t expect, and selection bias is no exception. Always ensure nothing affects
    which records are collected by selecting at random. And be aware that, like Wald,
    you sometimes simply can’t collect unbiased data.


