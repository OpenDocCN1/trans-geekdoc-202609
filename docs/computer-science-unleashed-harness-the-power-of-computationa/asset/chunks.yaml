    • \\s is equivalent to \[ \\t\\r\\n\\f\].


    The shorthand \\s is called whitespace. Note that it includes the regular space
    character! We can now improve the solution to the Proofreading problem ![](image/c-lupa.jpg)
    so it doesn’t waste our time returning punctuation followed by new lines and page
    breaks:


    \[.,:;?!\]\[^\\s\]


    With dots, sets, negated sets, special characters and shorthands, we can now flexibly
    match individual characters. But what if we don’t know exactly how many characters
    we’re looking for?


    Quantifiers


    In our previous expression matching ten digit phone numbers, the repeating \\d
    are bulky and hard to read. To simplify, we can use quantifiers that change the
    number of characters a \\d will match.


    Curly Braces


    We can specify exactly how many times a character or set must match using curly
    braces. For instance, our expression that matched ten-digit phone numbers can
    be rewritten:


    \\d{3}\-\\d{3}\-\\d{4}


    This expression is equivalent to \\d\\d\\d-\\d\\d\\d-\\d\\d\\d\\d, only cleaner.
    It reads “match three digits, then a dash, then three digits, then a dash, then
    four digits”. A quantifier can also be used to improve the expression that finds
    hexadecimal color codes:


    #\[A\-F0\-9\]{6}


    Components of the expression match exactly once by default, so {1} has no effect:
    B{1}e{2}r{1} is the same as Beer. Moreover, besides these fixed match requirements,
    we can also specify a range. It’s possible to state a minimum or a maximum number
    of matches:


    ![](image/c-chopp.jpg) exactly n times: ![](image/c-chopp.jpg) {n},


    ![](image/c-chopp.jpg) at least n times, and at most m times: ![](image/c-chopp.jpg)
    {n,m},


    ![](image/c-chopp.jpg) at least n times, with no upper limit: ![](image/c-chopp.jpg)
    {n,}.


    Note that n can be zero, effectively making the beer optional.


    MESSY NUMBERS ![](image/c-brasil.jpg) Brazilian phone numbers have variable lengths.
    The area code has two digits, and the local number can have eight or nine digits.
    Also, the dash before the last four digits is sometimes omitted. How can we find
    these numbers in a document?


    We can use one range quantifier to specify the number of acceptable digits and
    another to make the second dash optional:


    \\d{2}-\\d{4,5}\-{0,1}\\d{4}


    This expression can seem intimidating, so let’s decode it bit by bit:


    • \\d{2} matches two digits,


    • \- matches a single dash,


    • \\d{4,5} matches four or five digits,


    • \-{0,1} matches no dashes or a single dash,


    • \\d{4} matches four digits.


    The Optional


    The quantifier we used to make the dash optional in our last expression is so
    common that there exists a shorthand. We can replace {0,1} with ?. The phone expression
    now reads:


    \\d{2}\-\\d{4,5}\-?\\d{4}


    The ? is called the optional. Whether the character that immediately precedes
    the ? is actually there doesn’t matter, the match happens regardless. The optional
    is useful when looking for web URLs that may or may not use encryption:[6](#CSU-2-14.xhtml#nota7-06)


    https?://code\\.energy


    This finds both [http://code.energy](http://code.energy) and [https://code.energy](https://code.energy).


    The Plus


    The plus (+) is another useful shorthand. It’s the same as {1,}, indicating something
    must appear at least once, with no upper limit. For instance:


    du+de


    This matches “dude”, “duude”, “duuude”, and so forth. If we want to catch links
    to any .com domain:[7](#CSU-2-14.xhtml#nota7-07)


    https?://\[a\-z0\-9-\]+\\.com


    The Star


    The most powerful quantifier is the star (\*). It’s equivalent to {0,} and combines
    the effect of the optional and the plus. It denotes an optional term that can
    occur unlimited times. For example:


    yea\*h'
