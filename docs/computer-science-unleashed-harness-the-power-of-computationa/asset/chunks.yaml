    directly between their networks. This can save money, as these messages would
    otherwise have to transit through a paid connection. The free exchange of messages
    between the networks of different organizations is called `peering`.


    ### Routing

    Any computer linked to a `router` of the Internet can ask for its messages to
    be forwarded by other `routers`. Messages can be routed over large distances.
    For instance, there is a system of submarine cables linking routers in many coastal
