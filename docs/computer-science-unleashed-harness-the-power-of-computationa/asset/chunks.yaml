    \n*   我们首先通过将随机数视作一次性垫进行应用（如本节开头所示）来转换第一块明文。然后使用分组加密密钥对转换后的明文进行适当加密。\n*   对于后续每个块，我们使用上一个密文块作为一次性垫来转换明文。每个转换后的明文随后可以使用相同的分组加密密钥安全地加密。\n\
