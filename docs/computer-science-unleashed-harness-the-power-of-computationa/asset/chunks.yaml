  trans: "\n\n这一目标可以通过一种结合了简单替换和洗牌操作的乘积密码来实现。然而，要消除其在不同密文块之间所有可见的可变性并非易事：必须多次应用该乘积密码，并且必须仔细选择其替换和洗牌操作。事实上，适用于合适的乘积密码的操作，只有在明文始终具有相同固定大小的限制下才能找到。\n\
    \n基于这种原理运行的密码被称为**分组加密（block ciphers）**，因为明文必须以固定大小的块进行加密。如果明文长于块大小，则必须将其分成多个块。如果明文长度不足以填满整个块，通常会用零进行填充。目前，最常用的分组加密使用的是\
    \ 128 位或 256 位的块。\n\n![](img/03-07-h.jpg)\n\n图 3.7 分组加密的简化示意图。通常，分组加密必须对其核心乘积密码迭代大约十次。\n\
    \n分组加密是不可变的。如果密文块中的某一位发生了变化，那么整个消息在解密后都会变成乱码。由于这个原因，即使已知明文的某些位，攻击者也无法更改密文并创建伪造的消息。\n\
    \n有几种方法可以分割和加密大于块大小的明文。简单的方法是将明文分割并填充为正确大小的块，然后直接对每一个块应用分组加密。我们称生成的密文是在**电子代码账本（ECB）模式**下加密加密的。\n\
    \n遗憾的是，`ECB` 存在一个问题：攻击者可以知道同一块明文是否使用相同的密钥被加密了两次，因为这将产生完全相同的密文块。例如，如果攻击者知道某块密文告诉银行向他的账户存入\
    \ 100 美元，那么他可以在每次想要额外获得 100 美元时都可能重放那条消息。\n\n请注意：这种漏洞还允许攻击者获取有关使用 `ECB` 模式加密的长明文的信息。例如，假设我们想要加密一个图像文件。当我们把图像文件的部分分割成明文块时，相同阴影和颜色的区域将产生相同的密文块：\n\
    \n![](img/03-08-h.jpg)\n\n图 3.8 使用 `ECB` 模式分组加密加密的图像。明文的模式（左侧）重复出现，而这些重复块在密文中的布局（右侧）揭示了内容的本质。\n\
    \n为了修复这个问题，我们转换明文以确保每个明文块都有独特的值。有很多方法可以实现。一种方法是使用一个与块大小相同的随机数（nonce），称为**初始化向量（IV）**：\n\
    \n*   我们首先通过将随机数视作一次性垫进行应用（如本节开头所示）来转换第一块明文。然后使用分组加密密钥对转换后的明文进行适当加密。\n*   对于后续每个块，我们使用上一个密文块作为一次性垫来转换明文。每个转换后的明文随后可以使用相同的分组加密密钥安全地加密。\n\
    \n当这样使用分组加密时，我们称它是在**密码块链（CBC）模式**下运行。你不需要自己编写任何这些明文转换。相反，你可以配置你的加密库，让你的分组加密使用你想要的模式运行。还有其他模式可以避免\
    \ `ECB` 模式的陷阱，但除非你清楚自己在做什么，否则我们建议坚持使用 `CBC` 模式！\n\n与流式加密一样，在目前为止专家提出的许多分组加密中也发现了漏洞。在选择使用分组加密之前，请检查哪些是目前密码学家推荐的。11\n\
    \n## 分组加密 VS 流式加密\n\n分组加密需要更多的计算能力。在选择使用分组加密之前，请检查哪些是目前密码学家推荐的。11\n\n分组加密是不可变的。如果密文块中的某一位发生了变化，那么整个消息在解密后都会变成乱码。由于这个原因，即使已知明文的某些位，攻击者也无法更改密文并创建伪造的消息。\n\
    \n有几种方法可以分割和加密大于块大小的明文。简单的方法是将明文分割并填充为正确大小的块，然后直接对每一个块应用分组加密。我们称生成的密文是在电子代码账本（ECB）模式下加密的。\n\
