    Figure 1.21 Ada’s router is connected to a desktop computer and a printer via
    Ethernet, a notebook and a smartphone via WiFi, and to the ISP via DSL (or Digital
    Subscriber Line, a technology that allows digital data to flow through old telephone
    cables).


    ![](image/01-22-h.jpg)


    Figure 1.22 Table that guides Ada’s router to correctly forward IP packets to
    computers shown in Figure 1.21.


    If the router receives a packet whose destination IP address doesn’t match any
    row in the table, the packet is forwarded through to the default route. For Ada’s
    router, routing is simple: a packet is either directly delivered to a computer
    in her home or forwarded to Sky Romford, her ISP.


    Routing is more complicated for the ISP’s router. In addition to its peering and
    transit links, it receives packets from many different customers. For simplicity,
    let’s suppose Sky Romford’s router only serves two customers and has two peering
    links: one to the Sky router in Milton Keynes, and the other to Oxford University.
    Finally, let’s imagine it has a transit link with a larger telecom company:


    ![](image/01-23-v.jpg)


    Figure 1.23 Map of Sky Romford links. Ada, Charles, and Oxford University can
    talk using Sky’s local infrastructure only.


    ![](image/01-24-h.jpg)


    Figure 1.24 Table that guides Sky Romford’s router to correctly forward IP packets
    to networks shown in Figure 1.23.


    This is where the IP addressing hierarchy comes in handy. In the forwarding table
    of fig. 1.24, IP addresses are grouped according to their routing prefix. This
    works because all IP addresses starting with 2a0a:207 are from computers in Oxford
    University, and all IP addresses starting with 2a02:c7f:48 are from computers
    serviced by Sky in Milton Keynes.


    Internet Exchange Points


    In order to increase capacity and speed, network administrators often set up peering
    links with as many other organizations as possible. The cheapest way to do this
    is through places called Internet Exchange Points, or IXPs. Organizations join
    an IXP by wiring their routers to the IXP building. Every participating organization
    can then establish individual peering links with other organizations connected
    to the building.[11](#CSU-2-8.xhtml#nota1-11)'
