    # Chapter 5: Learning


    The question of whether computers can think is like the question of whether submarines
    can swim.

    —EDSGER DIJKSTRA


    ## PREDICTIONS INFORM DECISION-MAKING


    Centuries ago, ancient Mayans observed crops and astronomical patterns to predict
    yield and decide the best moment to plant their corn. Today, North American farmers
    can make more precise decisions thanks to advanced weather forecasting.


    One way to predict the future is to look at the past, as often the best predictor
    of future outcomes can be found in past patterns. It’s intuitive: if you notice
    a bar gets full most nights there’s an NFL game, you start believing it will be
    busy the next NFL night.


    Machine learning is using computers to crunch data on past events, find patterns,
    and unleash their predictive powers. This technology is everywhere. When you buy
    car insurance or get a loan, companies record your data. Over time, banks learn
    to predict who’s likely to default their debts, and insurers guess who might crash
    their cars. This chapter shows you how they go about it. You will learn to:


    - ![](image/c-frascobalao.jpg) Turn collected data into features,

    - ![](image/c-bolacristal.jpg) Train a machine and evaluate it,

    - ![](image/c-check.jpg) Validate its predictions methodically,

    - ![](image/c-tune.jpg) Fine-tune its gears for better results.


    Without computers, we would need to spend a lot of time and energy and consult
    top experts to make predictions. With computers, we can automate them at scale.
    For example, banks can approve loans automatically, saving on personnel costs
    while serving customers faster. In health care, machines can automatically screen
    high-risk patients in order to deliver preventive care and save lives.


    ## Models


    In the field of machine learning, an algorithm that makes predictions is called
    a model. Many different types of models exist, each making use of different math
    tricks. Some of these tricks are quite advanced, but don’t worry: we’re not diving
    into how models work. Instead, we’ll learn how to use models.


    Imagine you’re a real estate agent in the town of Sweetwater, and you want to
    predict the price that three apartments will sell for. You first gather some clues,
    such as their distance to the city center, their age, and their area. You can
    organize them in a table `X`, where each column is a type of clue, known as a
    `feature`, and each row corresponds to one apartment sale. You can then append
    a column `ypred` for your predicted prices:


    ![](image/05-01-h.jpg)


    Figure 5.1 Apartments for sale in Sweetwater.


    Filling in the column `ypred` is no easy task. On its own, the features table
    `X` does not provide any reference price points. If the apartments were in Tokyo
    or Timbuktu, the prices would surely be different! In order to make decent predictions,
    we need examples to learn from. Let’s add to the table apartments that were already
    sold in Sweetwater, labeled with their true sale price `y`, and call these records
    the labeled dataset.


    ![](image/05-02-h.jpg)


    Figure 5.2 Apartments for sale and sold apartments in Sweetwater.


    From this table, you might start to think intuitively. The price of the 114 m²
    apartment is probably closer to $1,000,000 than $100,000. If you collect many
    more labeled examples, you can use a predictive model to help you out.


    You don’t need to code any model yourself to get started. Open-source machine
    learning libraries are available for most programming languages. Once a library
    is installed, its models can be imported into your code and promptly put to use.


    ![](image/i-05-01-h.jpg)


    ### TRAINING

    Before you can use a model to make predictions, you must make it learn. The specific
    syntax depends on the programming language and library you’re using, but it always
    comes down to calling a training function that takes as arguments the `X` and
    `y` tables of the labeled dataset. As they describe the same list of events, these
    tables must contain the same number of rows. As the model trains, it adjusts its
    internal cogs to find a math formula that approximates the values of `y` from
    the rows of `X`. Typically, `X` and `y` require a huge number of examples for
    the model to make good approximations. Depending on the application, this number
    could be in the thousands, millions, or billions.


    ![](image/i-05-02.h.jpg)


    ### PREDICTING

    Once the model is trained, we can start predicting. If we now take the rows of
    `X` for which `y` is unknown, we can use a predicting function to make the estimations
    `ypred`. This output is the model’s best approximation of the `y` values that
    will be later observed in real life. Here, the predictions are probably very unreliable.
    In order to make better predictions, we need to train the model with way more
    than four labeled examples. Furthermore, this model only takes into account three
    features. Let’s see how more data can be collected in order to train more powerful
    models.


    ![](image/05-03-v.jpg)


    Figure 5.3 “Thanks to machine learning algorithms, the robot apocalypse was short-lived.”
    Courtesy of http://smbc-comics.com.


    ## 5.1 Features


    Imagine you work for a hospital, and for logistical purposes, you want to predict
    how long each incoming patient will stay. If you start looking around for data,
    you will find hundreds of different tables in different formats.


    ![](image/05-04-v.jpg)


    Figure 5.4 Raw hospital data.


    Machines aren’t intelligent yet, so we cannot simply throw data at them and expect
    them to train themselves and start predicting. We must digest the data into well
    structured `X` and `y` tables that models can work with. Let’s see how it’s done.


    ### Adapting Data


    The first step in building `X` and `y` from our dataset is to check we have the
    right kind of data. Most predictive algorithms work only with ![](image/c-1a4.jpg)
    NUMERICAL DATA. Let’s see how to process other kinds of data so they can be included
    as features.


    ![](image/c-arquivo.jpg) CATEGORICAL DATA We say categorical data is encoded into
    numerical form. The encoding method will depend on whether your data is binary,
    ordinal or nominal. Let’s see what this means:


    ![](image/i-05-03-h.jpg)


    **Encoding binary data.** It comes in two categories, therefore one category is
    expressed as 0 and the other as 1. Here, the data indicates the biological sex[1](#CSU-2-12.xhtml#nota5-01)
    of a patient.


    ![](image/i-05-04-h.jpg)


    **Encoding ordinal data.** The categories are ordered, so we assign them numbers
    accordingly. For instance, if an emergency room admission form asks patients to
    select one of four emoji to describe their pain, it can be expressed with a number
    from 1 to 4.


    ![](image/i-05-05-h.jpg)


    **Encoding nominal data.** When the categories of our column have no intrinsic
    order, we typically encode the column into several binary features: one for each
    category. This technique is called one-hot encoding. This example shows how it
    is used to express a patient’ blood group in four features. Since a patient can
    only have one blood group, the encoded record must have one cell containing 1,
    and all other cells containing 0s.


    ![](image/05-05-h.jpg)


    Figure 5.5 Getting features from different types of categorical data.


    ![](image/c-cronometro.jpg) TEMPORAL DATA The most straightforward way to include
    date or time records is to extract their numerical parts: a date can be split
    into three features for year, month and day, and a time can be split into hours,
    minutes and seconds.

