    \    - [IV Evaluating Classifiers](#CSU-2-15-classifiers)\n\n# Preface\n\nPREFACE\n\
    \nI never liked the term ‘computer science’. The main reason I don’t like it is\
    \ that there’s no such thing. Computer science is a grab bag of tenuously related\
    \ areas thrown together by an accident of history, like Yugoslavia.\n\n—PAUL GRAHAM\n\
    \nMost technological breakthroughs of our era are taking place in a new digital\
    \ world created by programmers. Computer scientists combine different fields of\
    \ study in order to empower this new world. This book explores the foundations\
    \ of some of these fields, including networking, cryptography, and data science.\n\
    \nWe’ll start with the story of how two computers can be linked to share information,\
    \ and take you all the way to the rise of email and the Web. We’ll explore cryptography\
    \ and understand how the Internet and other systems that deal with private data\
    \ are made secure. Then, we’ll learn how knowledge can be obtained from raw data\
    \ and how machines can be taught to forecast the future.\n\nWe hope these stories\
    \ will familiarize you with important concepts that can benefit coders and tech\
    \ enthusiasts alike. Our goal is to cover what beginners need to get up speed\
    \ in networking, security, and data science, without the heavy academic rigor\
    \ that sometimes makes topics unbearable.\n"
