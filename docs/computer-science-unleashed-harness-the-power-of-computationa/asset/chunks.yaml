- fmt: '

    A probability is always a number between 0 and 1, and the p-value is no exception.
    Obtaining `p = 0.2` means there’s a 20% chance that your data supports a wrong
    hypothesis out of bad luck. If you’re uncomfortable with that risk, collect more
    data. Run the test again, and if your hypothesis is correct, the p-value should
    decrease. Now, will this finally be enough to confirm the hypothesis with absolute
    certainty?


    Nope. A p-value is never exactly 0 or 1. In other words, never claim a 0% or 100%
    chance that a hypothesis is false. Furthermore, be very careful in interpreting
    these probabilities because the result of a hypothesis test can only be as reliable
    as the data itself. If your data suffers from selection bias, then your p-value
    is irrelevant. Hypothesis tests do not substitute controlled experiments, they
    merely complement them.


    ### Statistical Significance


    Even though the p-value can never be zero, there comes a moment when we must be
    able to draw conclusions. Usually, we define a maximum acceptable p-value that
    our hypothesis test should yield for it to be considered probably true. This threshold
    is called the significance level. When a p-value is below it, we can say there
    is statistically significant evidence supporting our hypothesis. Scientists typically
    work with significance levels between 0.05% and 5%.


    Drawing conclusions from data without statistical significance is a common mistake.
    In many cases, we cannot possibly obtain enough data to produce statistically
    significant evidence supporting our hypotheses, and therefore we have to base
    our decisions on certain assumptions. It is important to recognize the limitations
    of our knowledge, and be ready for our assumptions to be proven wrong.


    ![](image/04-39-h.jpg)


    Figure 4.39 “Boyfriend”, courtesy of [http://xkcd.com](http://xkcd.com).


    ### Confidence Intervals


    If we could try the new menu for an unlimited number of days, the mean daily sales
    would represent its true performance. Can we be confident that the mean daily
    sales of $107.3 we obtained with our experiment is equal to that truth? In other
    words, what p-value would we get by testing the following hypothesis?


    ![](image/c-new.jpg) The mean of daily ice-cream sales is $107.3.


    It is nearly impossible to obtain exactly $107.3 of mean sales as we keep on collecting
    data, therefore the chance that we do not get $107.3 is almost 100%. In other
    words, the p-value would be almost 1, which is far from the near-zero significance
    levels we want! In order to obtain a lower p-value, we must tolerate values close
    to $107.3. For example, we can test if the mean is between `A = $97.3` and `B
    = $117.3`. The hypothesis then becomes:


    ![](image/c-new.jpg) The mean of daily ice-cream sales is between $97.3 and $117.3.


    As we make the gap between A and B larger, the p-value gets smaller. When the
    gap is set such that the p-value is equal to our chosen significance level, we
    call `(A,B)` the confidence interval. Typically, we input our data and the significance
    level we are targeting into a function called a confidence interval calculator,
    which then outputs `(A,B)`. There are different confidence interval calculators
    to choose from depending on the nature of your data and of the hypothesis. However,
    they all work in a similar way:


    ![](image/04-40-h.jpg)


    Figure 4.40 Finding the confidence interval.


    Confidence interval calculators often ask for a confidence level instead of a
    significance level. It is equal to one minus the significance level. In other
    words, a confidence level of 95% is the same as a significance level of 5%, and
    a confidence level of 99% is equivalent to a significance level of 1%.


    ### Conclusion


    Data analysis is a process you must follow diligently in order to draw convincing
    conclusions. To ensure the integrity of your results, channel your data through
    every step of the pipeline:


    ![](image/i-04-18-h.jpg)


    Save yourself headaches and do not skip steps or change their order. If the exploration
    phase reveals you have insufficient data to test your assumptions, make sure all
    phases are carried out thoroughly and repeated in order: collection, processing,
    exploration, and only then testing.


    - **COLLECT**: When starting out, your only focus is to gather and stockpile data
    of every possible type and from every possible source. As you scrape existing
    data or create mechanisms to capture new data, your main worry is to steer clear
    of any selection bias.

    - **PROCESS**: Once the data is collected, make it easy for a computer to understand.
    During this phase, be a wrangling perfectionist: make sure every aspect of your
    dataset is organized and that only clean, valid, and consistent data remains.
    Moreover, you have the grave responsibility of anonymizing every last bit of sensitive
    data.

    - **EXPLORE**: Once it is clean, summarize and visualize your dataset. Compare
    different groups of values, observe how they are distributed across their ranges,
    and plot them over time. When you detect abnormal properties, investigate the
    causes. Explore how your data reflects the intricacies of the real world.

    - **TEST**: Finally, how do the insights you gained from exploration relate to
    your goals? Inspect the tables and plots that could affect decision-making. Formulate
    hypotheses and test if your data confirms them with statistical significance.


    Abiding by these principles empowers you to make decisions based on facts rather
    than intuition. Yet, the best is still to come. By transforming your data a bit
    more, you can feed it to algorithms that will provide complex information about
    the future that human intelligence alone could never guess. Are you ready?


    ### Reference


    - The Data Science Design Manual, by Skiena

    - Everything is Obvious, by Watts

    - Naked Statistics, by Wheelan

    - Google Dataset Search: [http://code.energy/google-data](http://code.energy/google-data)

    - Comma-Separated Values (CSV) is the simplest format to encode tabular data.
    It is plain text where commas and new lines delimit cells and rows.

    - SQL is a prevalent format to encode tabular data that discourages information
    repetition.

    - Scientists typically normalize data to the metric system so that their numbers
    are easier to manipulate and compare with data around the world.

    - Most humans have a resting heart rate of 40–100 beats per minute. Nonetheless,
    depending on what we’re analyzing the data for, it’s good to leave some room for
    extraordinary but authentic data. Here, a 10% margin above the record high was
    chosen arbitrarily.

    - In fact, according to many uncleaned data sources, that empty spot in the middle
    of the Atlantic ocean is one of the busiest places on Earth. Nerds even gave it
    a name: “Null Island”.

    - For an example, see Europe’s General Data Protection Regulation (GDPR).

    - There are more types of averages, such as the harmonic mean, which will be used
    in the next chapter. Some averages are ideal for rates of growth, others, for
    travel speeds. To learn more, head to [http://code.energy/average](http://code.energy/average).

    - Variance is another common measure of variability. The variance is simply the
    standard deviation squared.

    - Several methods to measure correlation exist. Each yields a slightly different
    coefficient. Here, we use the Pearson correlation coefficient, aka Pearson’s r.

