    在这里，哈希值以八个零开头！你可以假设，向你提供 `heads750` 的人必须付出了计算能力，通过计算许多哈希值来找到产生这种模式哈希值的输入。我们称之为工作量证明（proof
    of work）。找到下一个输入可能花费了更多的工作，因为它的哈希值以 12 个零开头：


    ```

    hash("heads11759") → 00000000000001110100001001001...

    ```


    工作量证明可以增加攻击的难度。例如，通过要求用户在发送请求之前提供工作量证明，你增加了攻击者用虚假请求使服务器过载的成本。攻击者必须花费大量的计算资源来创建大量服务器接受处理的请求。


    ## 区块链

    与数字签名和哈希一起，工作量证明产生了一项将改变世界的技术：区块链！在未来几年里，我们相信它通过消除中间人并为我们的社会增加透明度、隐私性和问责制，可以为数十亿提供经济主权。随着区块链的发展，带有华丽名称的全新加密工具也被开发出来，例如“零知识证明”和“同态加密”。我们只能想象一旦这些技术被广泛部署，将释放出怎样的力量！


    ## 不安全的哈希函数

    当两个不同的输入导致哈希函数产生相同的输出时，我们称之为碰撞（collision）。对于安全的哈希函数，获得碰撞的唯一方法是暴力破解：计算许多不同输入的哈希值，直到偶然出现碰撞。


    当哈希函数产出的输出超过 200 位时，通过暴力破解找到碰撞是不行的。对于目前所有被认为安全的哈希函数，尚没有已知的碰撞。每隔一段时间，哈希函数就会失去它的地位，因为密码学家发现了一种不完全依赖暴力破解的寻找碰撞的方法。一旦对某个哈希函数发现了这种方法，我们立即认为它是不安全的。


    这种情况曾发生在 `MD5` 和 `SHA1` 哈希函数上，它们在 20 世纪 90 年被认为是安全的。十年后，人们发现了减少这两种函数寻找碰撞所需操作的方法。目前，只有少数哈希函数被密码学家认为是安全的。截至
    2021 年，最广泛使用的是 `SHA2`，它已经保持了二十年的未破解状态。然而，请记住这在未来可能会发生。如果你正将哈希函数处理可能敏感的内容，请保持信息更新，以便在发现新的攻击方法时及早做出。


    ## 3.5 协议

    正如你从上一章回想的，在 IP 数据包内部传输的所有数据都是潜在的公开信息。渗透进电信公司的黑客可以更改往于目标的 IP 数据包，以破坏他们的通信。我们可以使用密码学来保护自己不受这些危险。通常，互联网上的安全通信涉及以下步骤：


    1. 获取对方真实的公钥。

    2. 使用 `Diffie–Hellman` 与对方生成共享密钥。使用第 1 步中的公钥验证你收到的消息是真实的。

    3. 使用第 2 步中的共享密钥使用对称加密对所有后续通信进行加密。


    当双方知道对方的公钥时，可以直接使用非对称加密进行安全通信，而无需助于 `Diffie–Hellman` 密钥交换。然而，这样做会产生一个漏洞：发现私钥的攻击者也可以解密受害者之前接收的所有消息，包括与其他人的通信。通过为每个通信会话生成全新的
    `Diffie–Hellman` 密钥，盗取私钥的攻击者将无法解密之前会话的密文。具有这种属性的通信方案被称为前向安全性（forward secrecy）。


    为了正确加密具有前向安全性的通信，必须遵守许多细节。例如，如果不小心重用了 `nonce` 或草率生成伪随机数，整个通信将变得易受攻击。为了避免这些问题，多种安全协议已被广泛采用。这些协议定义了人们进行通信以及在严格流程中执行必要加密步骤的程序，这降低了出错的风险。


    ### 安全访问

    在互联网早期，运行 `Telnet` 服务器的主机通常接受陌生人的连接，并仅在交付 shell 的远程访问权限之前要求密码。这几乎没有提供安全性：该密码将以明文形式在互联网上传输。


    1995 年，创建了一种名为 `Secure Shell (SSH)` 的协议来取代 `Telnet` 并解决其缺点。每个接受 `SSH` 连接的服务器必须有一对私公钥。为了保证安全，客户端计算机应该提前知道它想要连接的服务器的公钥。


    默认情况下，`SSH` 服务器期望来自 `TCP` 端口 `22` 的连接。在客户端建立连接后，服务器发送它的公钥以及它支持的加密、哈希和消息认证码 (`MAC`)
    加密工具。客户端将它从服务器收到的公钥与它预期的公钥进行比较。公钥不匹配意味着服务器已重新配置，或者有人在双方之间传输过程中篡改了 IP 数据包。客户端必须中止连接尝试并调查是哪种情况的原因。


    如果公钥正确，客户端将检查服务器指示的可用加密工具，并选择使用哪些工具。客户端向服务器发送它的选择以及第一条 `Diffie–Hellman` 消息。服务器随后向客户端发送一个签名的
    `Diffie–Hellman` 响应。如果签名有效，客户端和服务器计算出一个共享密钥，并开始使用选定的对称加密进行通信。在此时，客户端可以安全地以加密形式发送密码。一旦连接关闭，客户端和服务器就会忘记它们的共享密钥以维护前向安全性。


    ### 安全传输

    早期的互联网用户不信任他们的网络浏览器来处理需要高安全性的事务，如在线银行。他们的担心是有根据的：使用 `HTTP`，IP 包内部的信息是以明文传输的。因此，工程师们着手将加密方案集成到
    `HTTP` 中，这样人们就可以安全地发送信用卡号和私消息等敏感信息。


    他们开发了一种名为 `Transport Layer Security (TLS)` 的通用协议，它可以保护任何 `TCP` 连接。其工作机制与 `SSH`
    类似。首先，客户端提供它支持的加密工具列表和一个随机数。作为响应，服务器发送它的公钥、选用的工具以及另一个随机数。客户端检查公钥是否真实。客户端和服务器计算出一个共享密钥，并开始使用服务器选择的加密算法相互发送密文。


    与 `SSH` 相，客户端并不需要提前知道服务器的公钥。服务器发送它的公钥的同时带有一个数字证书。例如，如果服务器托管在 `example.com`，它必须发送一个公钥，以及来自
    `证书颁发机构 (CA)` 的数字证书，证明 `example.com` 使用该公钥。


