    Skilled people who can program computers to use the Internet are at the vanguard
    of the digital revolution. This chapter will teach you how the Internet works,
    so you can join this select group. You’ll learn to:


    ![](image/c-elo.jpg) Link computers to one another to make a network,


    ![](image/c-mundo.jpg) Combine networks using the Internet Protocol,


    ![](image/c-pin.jpg) Locate a recipient from its Internet address,


    ![](image/c-bussola.jpg) Find a route through the Internet to that location,


    ![](image/c-caminhao.jpg) Transport data between distant applications.


    Before the Internet, telecommunication between two parties required a direct physical
    link. In the 1950s, each telephone had a wire leading directly to a central station.
    For a call to go through, an operator had to physically connect the wires of two
    telephones. For long distance calls, wires were laid out between distant stations,
    and several operators in different places had to physically connect the chain
    of wires linking the two phones.


    The Internet did away with this. Wires aren’t physically reconfigured to create
    direct, exclusive links. Instead, the information is retransmitted step by step
    via a chain of linked devices until it reaches its destination. This eliminates
    the need for wire operators and central coordination. Also, wires are no longer
    constrained to serve a single connection–many concurrent connections can share
    the same wire. This allows global communications to be instant, cheap and accessible.


    However, modern networking technology is more intricate than early telephony.
    It has many successive layers, each building on top of the previous. Let’s explore
    how connections are made at these different levels, starting with the most basic
    layer.


    ## 1.1 Links


    A direct connection between two computers is achieved through a transmission medium:
    a physical channel where signals flow. It can be a copper wire carrying electric
    currents, a fiber-optic cable directing light, or air hosting radio waves. Each
    connected computer has a network interface to send and receive signals in the
    transmission medium. For instance, cellphones have a radio chip and antenna to
    handle radio signals traveling through the air.


    ![](image/01-01-h.jpg)


    Figure 1.1 A link is established between two network interfaces if they share
    a transmission medium and agree on the rules of communication.


    In order to communicate, network interfaces must agree on the rules to follow
    when sending and receiving signals. This set of rules is called the link layer.


    When a medium exclusively connects two computers, we say they maintain a point-to-point
    connection, and their link layer relies on the most basic set of rules: the `Point-to-Point-Protocol`
    (`PPP`). It merely ensures the two computers can identify each other and exchange
    data accurately.


    However, connected computers don’t always get to enjoy such an exclusive link.
    Often, they must share the transmission medium with several other computers.


    ### Shared Links


    One way to link computers in an office is to plug each of them into a hub with
    a wire. The hub physically connects all the wires that reach it, so a signal sent
    by one computer will be detected by all the others! This will also happen on your
    home WiFi, since the same radio frequency is used by all connected devices. Communications
    can become messy if all of them use the medium at the same time.


    ![](image/01-02-h.jpg)


    Figure 1.2 A message sent on a shared link will be detected by all.


    The link layer contains a set of rules to define how computers should share their
    communication medium, fittingly called `Medium Access Control` (`MAC`). The rules
    resolve two main challenges:


    **COLLISIONS** If two computers send a signal through the same medium at the same
    time, the resulting interference garbles both transmissions. Such events are called
    Collisions. A similar problem occurs when your group of friends or family talk
    over each other hand no single voice can be clearly heard.


    There are methods to avoid collisions. First, only start transmitting signals
    when no other computer is transmitting. Second, monitor your communications–if
    a collision occurs, wait for a brief but random amount of time before trying to
    transmit again.


    ![](image/01-03-h.jpg)


    Figure 1.3 Collision between Ada and Andrew.


    ![](image/01-04-h.jpg)


    Figure 1.4 Ada and Andrew both resend after a random duration.


    These methods have some limitations. If there are too many transmission attempts
    through a medium, collisions will occur relentlessly. We say the link is saturated
    when excessive collisions break down communications. Have you ever been frustrated
    at a large venue because your phone wouldn’t send text messages or make calls?
    This may happen if too many phones are attempting to communicate concurrently
    and the cellular link becomes saturated.


    **PHYSICAL ADDRESSING** Ada and Charles have a direct link between their computers.
    Ada wants to talk with Charles, so she transmits a signal with her message through
    the medium. However, the medium is shared, so everyone linked to the medium gets
    the message. How can the other computers know that the signal they picked up was
    not destined for them?


    ![](image/01-05-h.jpg)


    Figure 1.5 Andrew’s network interface discards the message.


    Each computer’s network interface has an identifier, known as its physical address
    or hardware address. A transmission in a shared medium must begin with two such
    addresses: that of the recipient and that of the sender. Upon receiving a transmission,
    a computer will know if it should be ignored or picked up and to which address
    it should reply.


    This can only work if physical addresses are unique: if two computers use `my_netinterface`,
    we’re back to square one. For this reason, virtually all network interfaces follow
    a naming scheme defined in the rules of `Medium Access Control`. These standard
    physical addresses are called MAC addresses.


    ### MAC Addressing


    Computers, smartphones, smart watches, and smart televisions can each have WiFi,
    Bluetooth, and Ethernet network interfaces. Each network interface has its own,
    unique MAC address marked into the hardware during production. You should not
    worry about assigning a MAC address to your computer: you can always use the one
    that came with its network interface.


    Since MAC addresses are simply large random-looking numbers, network interface
    manufacturers around the world must coordinate to avoid accidentally assigning
    the same number to different devices. To this end, they rely on the Institute
    of Electrical and Electronics Engineers (`IEEE`), that assigns each of them a
    different range of MAC addresses.


    A MAC address is expressed as six pairs of hexadecimals[1](#CSU-2-8.xhtml#nota1-01)
    separated by colons. The first half of the address is an identifier assigned by
    the `IEEE` to a unique manufacturer. This manufacturer then chooses a unique second
    half for each network interface.


    `60:8B:0E:C0:62:DE`


    Here, `608B0E` is the manufacturer number. This specific number was assigned by
    IEEE to Apple, so this MAC address should belong to an Apple device.[2](#CSU-2-8.xhtml#nota1-02)
    A device’s MAC address is often written on a label stuck to the packaging or on
    the device itself, next to the serial number.


    ![](image/01-06-h.jpg)


    Figure 1.6 Each MAC address is unique.


    There’s a special address reserved for transmissions to all computers in a medium.
    It’s called the broadcast address, and it reads `FF:FF:FF:FF:FF`. You use it when
    you try to connect to an unknown device. For instance, when your smartphone’s
    WiFi card isn’t deactivated, it persistently broadcasts to `FF:FF:FF:FF:FF` that
    it’s looking for an access point. Discoverable access points will respond with
    their own MAC address so you can establish a link.

