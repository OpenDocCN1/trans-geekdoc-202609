    \\barts?\\b


    Martial arts impart artists as art.


    In the last expression, the plural form is an accepted koala word. If we’re only
    interested in words that start with a and end with s, then:


    \\ba\[a\-z\]+s\\b


    Martial arts impart artists as art.


    \\ba\[a\-z\]\*s\\b


    Martial arts impart artists as art.


    Don’t let the koalas confuse you. Anchor your expressions.


    Groups


    As yet, we have only seen quantifiers work on a single preceding character. Groups
    allow quantifiers to work on a sequence of characters, or even on an entire expression.
    They are created using parenthesis: (•••). For example:


    (meta-)\*analysis


    Here, the meta- part of the expression can match zero to infinite times. The expression
    finds “analysis”, “meta-analysis”, “meta-meta-analysis”, and so on.


    BIG NUMBERS ![](image/c-1a4.jpg) You need to find big numbers in a long report.
    Commas separate thousands, and some numbers have fractional digits. How to retrieve
    all the numbers?


    We could be lazy and try:


    \\b\[0\-9,.\]+\\b


    However, this would also match other things, such as “10.12.1815”. To retrieve
    numbers that use dots and commas correctly, we can use groups with quantifiers:


    \\b\\d{1,3}(,\\d{3})\*(\\.\\d+)?\\b


    Let’s parse that expression from left to right:


    \\b


    The match must start at a word boundary.


    \\d{1,3}


    Maximum three leftmost digits.


    (,\\d{3})\*


    Optionally, a comma followed by three digits.[11](#CSU-2-14.xhtml#nota7-11)


    (\\.\\d+)?


    Optionally, a dot followed by at least one digit.


    \\b


    The match must end at a word boundary.


    Capturing Groups


    Groups are also called capturing groups: the regular expression engine keeps the
    text they matched as internal variables. These variables are often used to create
    elaborate find-and-replace schemes.


    QUIRKY QUOTES ![](image/c-baguete.jpg) A French translator handed you a text that
    includes quotes made with straight quotation marks, "like this". He asks you to
    replace them with French guillemets, for the quotes to look « like this ».


    You can’t directly find-and-replace the " character. It has to become either a
    « or a » character, depending on its position. If we add a group to our previous
    regular expression that finds quotation marks, the text inside the quotation mark
    is stored in an internal variable, called \\1. We can tell the regular expression
    engine to replace the matched string with a new text that makes use of this variable:


    Find:


    "(\[^"\]\*)"


    Replace:


    « \\1 »


    If the regular expression has multiple groups, more capture variables are created.
    To reformat US telephone numbers separated with spaces using parenthesis and hyphens,
    you can do this:


    Find:


    (\\d{3}) (\\d{3}) (\\d{4})


    Replace:


    (\\1) \\2-\\3


    Here, \\1 stores the text that was matched inside the first group, \\2 stores
    the text from the second group, and so on. Whenever you need to do a find-and-replace
    operation that’s not static, remember to use groups!


    The Alternation


    When we want to match one of several expressions, we use the alternation, denoted
    |. It works similarly to a logical OR. For example, to match phone numbers only
    from Puerto Rico, we need one of these two area codes:


    (787|939)-\\d{3}-\\d{4}


    Notice that we confined the alternation within a group because it has lowest precedence.
    In other words, removing the parentheses:


    787|939-\\d{3}-\\d{4}


    is equivalent to


    (787)|(939-\\d{3}-\\d{4})


    This is wrong: the machine will read “match 787, or a ten-digit phone number starting
    with 939”. Always be careful when using the alternation outside a group. Let’s
    try another example.


    MARSUPIAL MATES ![](image/c-canguru.jpg) A ranger in the Australian Outback is
    studying kangaroo breeding behavior. Her agency monitors their population and
    dates its statistics in a Mon YY format. She knows kangaroo births peak in summer
    months. How can she search the data for these summer statistics?


    The search must be restricted to Australian summer months: December, January,
    and February:


    (Dec|Jan|Feb) \\d\\d


    If our ranger is researching one specific summer, she would have to drop the parentheses
    and specify the years:


    Dec 92|Jan 93|Feb 93


    Here, using the two groups (Dec|Jan|Feb) (92|93) is too broad. It would match
    months covering three summers: Jan 92, Feb 92, Dec 92, Jan 93, Feb 93, Dec 93.


    Conclusion'
