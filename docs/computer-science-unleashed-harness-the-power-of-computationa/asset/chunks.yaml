    Invoke dig without an @ argument and your computer will probably query your router.
    In turn, your router will likely forward the query to the ISP’s DNS server. Try
    it:


    dig icmc.usp.br. AAAA


    This is much faster: your DNS server is closer to you than any other name server.
    Furthermore, a single query gets you the DNS records you want. As the client,
    you don’t even know (or care) whether your DNS server queried another DNS server
    or fetched the records directly from the name servers with authority over them.


    We call this process recursive querying, because the client’s single query propagates
