    计算机在 `UTC` 中记录时间，但通常根据其所在的时区显示时间。例如，封从纽约发送到东京的电子邮件将携带一个 `UTC` 创建时间戳。根据发送者和接收者计算机的时区配置，该时间戳的显示方式会有不同。从现在起，当我们提到时间时，指的是
    `UTC`。


    # 网络时间协议


    如果人类的手表能精确到秒，那么他们也可以追求英国式的准时。然而，计算机运行速度更快，它们的时钟需要更高的精度。例如，一组计算机每秒可以记录数百条记录。为了保持这些记录按时间顺序排列，我们必须将时钟同步到毫秒。


    将时钟调整到如此微的时间尺度并非易事。简单的方法是在 `Internet` 上发送一条消息，向知道时间的人请求时间，并根据响应的时间戳设置时钟。然而，这并不可：`IP`
    数据包的传输时间是不确定的。我们从远程计算机接收的时间不可避免地会延迟。


    但是，通过一些额外数据，我们可以估算数据包通过`Internet` 所需的时间。在使用该时间调整时钟之前，可以将此时长加到指定的时间戳上。`Network
    Time Protocol`（`NTP`）是利用这一原理同步时钟的通用标准。


    `NTP` 时间戳表示自 1900 年 1 月 1 日午夜以来的秒。例如，2000 年 1 月 1 日午夜的时间戳表示 `3,155,673,600`。该数字可以带有小数部分，因此可以非常精细的精度捕捉时间。`NTP`
    服务器在 `UDP` 端口 `123` 等消息。`NTP` 消息交换如下：


    ![](img/02-02-v.jpg)


    图 2.2 客户端使用 `NTP` 向服务器请求时间。为了简单起见，假设我们处于 1900 年，这样时间戳就是较小的数字。任何计算机运行的时间从上到下。


    交换从客户端发送时间查询开始。此消息包含了根据客户端时钟的发送时间（`time A`）。服务器根据其时钟记录消息到达的时间（`time B`）。当服务器回复时，它发送一条包含三个时间的消息：`time
    A`、`time B` 及其响应时间（`C`）。客户端接收这些时间，并确认 `time A` 与其之前发送的相同。客户端还根据自己的时钟记录回复到达的时间（`time
    D`）。


    在图 2.2 中，假设 `time D` 为 `319.42`。已知时间 `A`、`B`、`C` 和 `D`，客户端可以计算 `IP` 数据包通过`Internet`
    传输的时间：


    `travel time = 客户端往返时间 − 服务器处理时间`


    `= D − A − (C − B)`


    `= 319.42 − 315.27 − (319.32 − 316.61)`


    `= 4.15 − 2.71`


    `= 1.44.`


    消息从客户端到服务器再返回花费了 `1.44` 秒。我们可以估算数据包从服务器传输到客户端花费了该时间一半：`0.72` 秒。客户端应该在实际收到回复之前的
    `0.72` 秒就收到它。随后客户端可以根据此偏移调整其时钟。[/'
- fmt: "\nScreens allowed for the creation of the cursor: a movable indicator that\
    \ specifies the location of interaction between the shell and the screen. Users\
    \ started to use non-printing characters to ask the shell to move the cursor.\
    \ Crucially, cursors allowed previously printed text to be replaced or deleted,\
    \ making interactions with computers more efficient. This sparked a surge in the\
    \ development of computer programs with interactive text-based interfaces.\n\n\
    Video monitors were introduced in the late 1960s, and the first commercial computer\
    \ with a Graphical User Interface (GUI) appeared in 1979. Today, virtually all\
    \ personal computers such as laptops and phones run a shell that operates a GUI:\
    \ we interact with icons and windows using mice, trackpads, and touchscreens.\n\
    \n![](image/02-03-h.jpg)\n\nFigure 2.3 “Command Line”, courtesy of [http://commitstrip.com](http://commitstrip.com).\n\
    \nStill, many IT specialists continue to interact with their computers via `CLI`.\
    \ This can be by necessity, for example to operate GUI-less corporate servers,\
    \ but also by preference. Many geeks use their GUI only to open a terminal emulator:\
    \ an app that hooks into the `CLI` shell and transforms your screen and keyboard\
    \ into a glass teletype.\n\nTerminal emulators are powerful interfaces.[15](#CSU-2-9)\
    \ Via `CLI`, one can perform nearly any text-based task, such as organizing folders,\
    \ sending emails, writing code and compiling. We actually wrote and edited this\
    \ book on terminal emulators!\n\n![](image/02-04-h.jpg)\n\nFigure 2.4 Running\
    \ on Linux terminal emulator.\n\n### Telnet\n\nFor most of the 1950s and 1960s,\
    \ a terminal had to be wired directly to a computer in order to communicate with\
    \ its shell. However, this changed in 1969, when engineers devised a way to connect\
    \ terminals to any computer on a network. They called it teletype network, or\
    \ `telnet`.\n\nTerminal emulators can use `telnet` to access distant computers\
    \ over the Internet. The distant shell must be extremely reliable as unordered\
    \ characters could cause it to execute potentially destructive commands. For this\
    \ reason, the preferred transport layer protocol for `telnet` is `TCP` rather\
    \ than `UDP`.\n\nWhen a `TCP` connection is established on port `21`, the `telnet`\
    \ server launches and sends all incoming data from the connection. The output\
    \ of the shell is sent to the client. On the client side, all characters typed\
    \ by the user are transmitted to the server in real time. And when the client\
    \ receives one or more characters, they are displayed on their terminal emulator.\n\
    \nUsually, after `telnet` connection is established, the distant shell asks for\
    \ a username and password. Once logged in, the `telnet` client works directly\
    \ to the server. If a computer runs `telnet` server, any computer connected to\
    \ the Internet can act as a terminal for that server.[16](#CSU-2-9) Geeks can\
    \ operate a computer on another continent as if they were sitting right to it\
    \ with screen and keyboard!\n\n### Mail\n\nThe few computers that existed were\
    \ shared by many users. At that time, “mail” programs were already popular, but\
    \ they only allowed a user to leave a message to a peer who worked on the same\
    \ computer. These programs simply appended text to files that served as mailboxes.\
    \ One mailbox file was attributed to each user. When users logged into their computers,\
    \ alerts would appear if their mailboxes contained new messages.\n\nDuring the\
    \ 1970s, computer networks grew and the technology to access files in distant\
    \ computers materialized. Mail programs evolved to append text to mailboxes of\
    \ remote computers. This allowed users of distant computers to exchange messages\
    \ as if they were on the same machine. Over time, programmers improved the efficiency\
    \ of these systems by adopting a common message format, which looked like this:\n\
    \n```\nFrom: White at SRI-ARC\nDate: JUL 1973 15-PDT\nSubject: Multi-Site Meeting\
    \ Announcement\nNIC: 17996 at 10 AM Wednesday \n```\n\nThe message starts with\
    \ headers, which carry general information about the message, such as its sender,\
    \ recipient, and subject. Each header takes one line, and a colon separates the\
    \ header name from its value. After the headers, an empty line signals the start\
    \ of the message body. These messages were widely used by computer geeks, who\
    \ began calling them email (the `e` stands for electronic). To this day, the emails\
    \ we exchange still follow this format!\n\nIn 1973, the above email could be replied\
    \ to by appending a new message to the mailbox `White` in the computer `SRI-ARC`.\
    \ At the time, `TCP/IP` and `DNS` didn’t exist, and computers were referred to\
    \ by such nicknames. Later, the at symbol was deprecated in favor of `@`, so the\
    \ mailbox in the example would be written `white@SRI-ARC`. For context, `SRI`\
    \ stands for Stanford Research Institute, one of the organizations that helped\
    \ to create and standardize this message format.\n\n### Mail Servers\n\nComputers\
    \ gradually became less expensive, and by the 1980s it wasn’t uncommon for someone\
    \ to be working on multiple machines. Yet, it would be easier to reach people\
    \ by email on large scales if each person had a primary mailbox address at a single\
    \ location. Many groups of users decided to monitor their primary mailbox on the\
    \ same host, as if everyone still worked on a single computer. Organizations facilitated\
    \ this by designating one of their computers as the mail server.\n\nUniversity\
    \ students and tech engineers would have an account in their organization’s mail\
    \ server, regardless of which computers they happened to be using. Everyone’s\
    \ primary email address would point to this mail server. From their different\
    \ computers, people would use `telnet` to log into the mail server and read emails\
    \ stored in their individual mailbox files.\n\nIn 1985, `DNS` was rolled out,\
    \ and it vastly improved the email system. Organizations started to adopt domain\
    \ names and to create `MX` records to publicly announce their mail servers. Domain\
    \ names became the standard way of addressing mailboxes. For instance, the mailbox\
