    当计算能力充足且能够以很低的成本反复训练和评分模型时，可以使用蒙特卡洛方法。如果我们希望使用 365 条记录中的 90% 进行训练，并用剩下的 10% 进行验证，蒙特卡洛方法可以使用不同的随机训练和验证集对模型进行近乎无限次的评估。在数百万次评估后，我们可以更确信不同的评分共同反映了模型的真实性能。


    ## 留一法 (Leave-One-Out)


    有时，我们必须处理只有几十条记录的极小标记数据集。在这种情况下，让训练集保持尽可能大是有意义的。为此，我们在除一条记录以外的所有记录上训练模型，并在剩下的这一条记录上进行评估。


    这种策略被称为留一法。它可以被看作 `k-fold` 交叉验证 的一个特例：折叠的数量与记录总数相同，因此每个折仅包含一条记录。


    但这里有一个问题：所有的训练实例彼此极其相似。尽管模型会经过多次评估，但不同的评估结果将非常相似，这抵消了进行多次评估的某些优势。只有在无法增加数据集大小时，才将留一法作为最后的手段。


    ## 解释 (Interpretation)


    交叉验证留下了许多评分，这些评分共同描述了模型的性能。我们通常会对这些值进行总结以更好地解释它们，例如使用数值汇总统计。解释结果取决于你希望模型做什么。


    例如，如果你不在意模型表现不佳，只要它偶尔表现良好即可，那么请关注上四分位数和最高分。相反，如果你无法承受极少数的性能低迷情况，请采取悲观方法，关注下四分位数和最小值。


    通常情况下，平均值被视为模型运行情况最相关的总结。但平均值只是对性能的粗略表示。将其与标准差结合考虑是一个良好的做法：标准差反映了性能偏离平均值的程度。


    除了提供预期性能的衡量标准外，交叉验证评分还允许我们比较不同的模型。有许多不同机制的类型。要比较两个模型并决定哪一个最好，不要只看平均值。对两个模型的交叉验证评分进行假设检验，以检查一个模型的平均值是否高于另一个模型。


    通常，计算密集型模型的其平均值会比简单模型略高一点。然而，假设检验会告诉我们这种差异并不显著。在这种情况下，请选择更简单的模型。


    ## 5.4 微调 (Fine-Tuning)


    我们学习了如何准备数据、训练通用学习模型并衡量其性能。如果你停步于此不对系统进行调整，你将只能获得部分的预测能力。预测系统可以通过许多不同的方式进行调整。例如，调整特征可以显著提高性能。选择最合适的模型类型并根据任务调整其特定参数也有帮助。


    数据科学家从训练和交叉验证简单模型开始。然后他们对系统进行增量式更改，每次进行新的交叉验证。比较每次更改前后的评分，并保留带来显著改进的更改。这个过程一直持续，直到找不到对系统的进一步改进为止。


    让我们从对特征可以做的调整开始。当特征为模型提供清晰线索时，特征最有效有效。你的列 `X` 必须是一组与你预测的内容尽可能直接相关的线索。有时，转换 `X`
    中的值可以帮助实现这一目标。


    ![](img/05-24-v.jpg)

    图 5.24 “机器学习”，素材源自 http://xkcd.com。


    转换特征使其更好地与模型协同工作的过程被称为特征工程。在对预测系统可以做的所有调整中，这通常具有最大的改进潜力。让我们来看看一些常见的特征工程技术。


    ### 填补 (Imputation)


    在第 5.1 节中，我们提到 `X` 不能包含 `NULL` 单元格，并讨论了处理它们的策略：删除缺失数据的行、删除含有缺失数据的列、用列的平均值或默认值填充空白单元格。为了发现哪种策略最适合你的任务和数据，请尝试它们并评估它们的性能！


    例如，如果你用列的中位数填充单元格，也尝试使用平均值和常数默认值。对于任何含有超过 1% `NULL` 单元格的列，测试不同填补策略的影响通常是值得。如果没有哪种策略显著更好，就坚持简单的：用常数默认值填充所有空白单元格。


    ### 离群值 (Outliers)


    `X` 中存在离群值可能会误导某些模型。与缺失值填充一样，处理离群值也有多种方法。例如，如果某一列只有少数离群值，最好的办法是从 `X` 中删除这些行。如果离群值频繁出现（例如超过行数的
    1%），你可以尝试用不那么极端的值来替换它们。这种技术被称为剪切（clipping）。


    ![](img/05-25-h.jpg)

    图 5.25 剪切三个离群值。


    ### 归一化 (Normalization)


    某些模型会被范围差异巨大的特征所困扰。如果一个特征的值范围从零到几千，而其他列的范围是从零到几十，那么该特征可能会获得偏偏的权重。为了防止这个问题，可以对列进行重新缩放，使其显示相似的范围。这被称为归一化。简单的归一化技术称为
    `MinMax`。列中的最小值变为零，最大值变为一。所有其他值放在之间：


    ![](img/05-26-h.jpg)

    图 5.26 `MinMax` 将所有值压缩到 0–1 范围。


    你还可以根据值相对于平均值的距离以及列的标准差进行归一化：等于平均的值变为零；等于标准差的值变为一。这种归一化方法被称为 `z-score`：


    ![](img/05-27-h.jpg)

    图 5.27 使用 `z-score` 归一化时，范围不是固定的。


    使用 `MinMax` 时，所有列具有完全相同的范围。此外，离群值的存在会强制非离群值彼此挤压到 0–1 范围内更小的区域内。使用 `z-scores`，离群值的影响较小，因为它们不会导致这种压缩，且非离群值的范围在列之间更加相似。要确定使用哪种归一化方法，请尝试两者并比较交叉验证的结果。


    ### 对数变换 (Log Transformation)


    在 4.4 节中，我们绘制了过去几十年计算机存储成本下降的图，发现跨越多个数量级的数据可能需要特殊处理。将此类数据输入预测模型也是如此。具有巨大方差的特征往往会预测性能。


    如果你的 `X` 表具有此类列，尝试使用对数函数 (`log`) 转换这些值。如果列包含零到之一之间的值，在计算对数之前加一，以避免较大的负输出。


    如果该列还包含负数，转换将变得复杂，因为对数对这些数字没有定义。绕过此问题的方法是去掉负号，加一，应用对数，然后重新应用负号。


    '
- fmt: "\nIn addition, you may normalize a column right after performing a logarithmic\
    \ transformation to it. Here’s an example:\n\n![](image/05-28-h.jpg)\n\nFigure\
    \ 5.28 MinMax with and without prior log transformation.\n\nDirectly normalizing\
    \ data with extreme variance leads to a lot of values being very close to each\
    \ other. By performing a logarithmic transformation before the normalization,\
    \ numbers are better spread across the range, and differences between values are\
    \ easier for the model to perceive.\n\n## Binning\n\nMaking a feature carry less\
    \ information sometimes helps the model. Suppose your hospital is trying to predict\
    \ the duration of stay of incoming patients, and that you have a column for their\
    \ age. As you investigate, you notice that small age differences have little effect\
    \ on the duration of hospitalizations, yet there is a significant difference between\
    \ children and adults. In this case, try to help the model differentiate these\
    \ groups. For example, you can transform age into a categorical feature with the\
    \ labels “child”, “teen” and “adult”.\n\nThis technique is called binning. It\
    \ consists of organizing the original data into “bins” which are more relevant\
    \ than the original values. It can also be helpful when you have categorical features\
    \ where some labels rarely appear—study them and bin the related ones together.\n\
    \nFor instance, a categorical feature indicating a patient’s disease may have\
    \ thousands of labels. Binning them in groups of related diseases can help the\
    \ model make sense of the data. If you don’t have time to create elaborate bins,\
    \ try simply replacing all low-frequency labels with a single “others” label.\
    \ That alone can potentially help your model a lot.\n\n## Clustering\n\nIn hospitals,\
    \ incoming patients are often assigned to a group according to their symptoms\
    \ or illness. This helps doctors and nurses: they can check which group a patient\
    \ belongs to and obtain instant, valuable information about the patient.\n\nIf\
    \ you’re a restaurant’s manager, it’s also useful to divide customers into groups.\
    \ There are the junkie diners, the healthy food lovers, the penny-pinchers, etc.\
    \ Knowing these groups allows you to target different promotions to the customers\
    \ who are most likely to respond. Also, the restaurant may adapt its offerings\
    \ to its most profitable customers.\n\nBe careful: you must group elements judiciously\
    \ for it to help your model. Most datasets will contain sets of rows with similar\
    \ characteristics. If you manage to group records according to these similarities,\
    \ add a column to `X` indicating which group each record is a part of. This new\
    \ categorical feature will often enhance the performance of a predictive model.\n\
    \nThe process of finding similar characteristics and assigning each record to\
    \ a group is called clustering. There are algorithms that can automate clustering.\
    \ The most widely used clustering algorithm is called `k-means`. Install a library\
    \ that has this algorithm, and run it on your dataset. In addition to `X`, the\
    \ algorithm requires you to input `k`, the number of different groups it should\
    \ create. To get started, run it multiple times, setting `k` from 2 to 10. Each\
    \ time, you should obtain a different extra column for `X`. Cross-validate your\
    \ model for each grouping, and keep the one that helps your model the most.\n\n\
    If you are using an automatically generated grouping of rows as a new feature,\
    \ there’s an interesting data exploration exercise you can do. Look into the records\
    \ assigned to each group, and try to come up with a name that best represents\
    \ it. This often leads to interesting discoveries!\n\n## Feature Extraction\n\n\
    As we collect features, `X` may end up having columns which highly correlate to\
    \ each other. When this happens, redundant information is being passed to the\
    \ model, which in most cases is not very useful. Most models work best when columns\
    \ in `X` carry distinct information. Fortunately, special math tricks can compress\
    \ the information from a group of columns into fewer, more representative ones.\
    \ This process is called feature extraction.\n\nA well-known feature extraction\
    \ trick is the Principal Component Analysis, or `PCA`.[4](#CSU-2-12.xhtml#nota5-04)\
    \ It requires columns in `X` to be normalized via z-score first. `PCA` transforms\
    \ some columns into less correlated columns that preserve the original information.\
    \ Let’s see an example where columns store the average, minimum and maximum daily\
    \ temperatures in a city:\n\n![](image/05-29-v.jpg)\n\nFigure 5.29 Features transformed\
    \ via z-scores and PCA. At each step, the correlation coefficient between columns\
    \ is shown, as well as each column’s standard deviation.\n\n`PCA` returns a new\
    \ `X` where columns display little correlation with each other. Furthermore, `PCA`\
    \ tends to compact more information in the columns to the left and orders them\
    \ by decreasing levels of variance. We can then try to discard the columns to\
    \ the right, which display little variance, and see if the model performs better.\
    \ It often does!\n\nAnother feature extraction trick is the Non-negative Matrix\
    \ Factorization, or `NMF`. As its name suggests, it only works if `X` contains\
    \ no negative values. It allows us to compress the information of `X` into a number\
    \ of columns of our choosing. Let’s use `NMF` to transform the data from our previous\
    \ example into two columns:\n\n![](image/05-30-v.jpg)\n\nFigure 5.30 Features\
    \ transformed via MinMax and NMF. At each step, the correlation coefficient between\
    \ columns is shown, as well as each column’s standard deviation.\n\nUnlike `PCA`,\
    \ `NMF` generated unordered columns that are all equally relevant. While `PCA`\
    \ outputs a series of columns of diminishing relevance, `NMF` attempts to split\
    \ information into columns representing distinct behaviors. As usual, it’s helpful\
    \ to experiment with different numbers of output columns. Test your model with\
    \ `NMF` tables of different sizes, and pick the number that works best.\n\nBefore\
    \ `PCA` or `NMF`, columns of `X` typically represent a specific measurement or\
    \ attribute. After either transformation, columns no longer have a direct link\
    \ to an attribute from the real world, even though they collectively retain the\
    \ original information. This may help a machine, but it makes the data less transparent.\
    \ For this reason, feature extraction is usually the last step of the feature\
    \ engineering process.\n\n## Feature Selection\n\nSome features might hinder a\
    \ model’s performance rather than help it. This often happens with redundant features,\
    \ features containing bad data, or features that aren’t really related to `y`.\
    \ Removing unhelpful columns from `X` is called feature selection.\n\nModel performance\
    \ will vary when we use different subsets of features and want to select the subset\
    \ that maximizes performance. The only way to guarantee this is to evaluate all\
    \ possible selections, keeping track of the best selection found. That’s called\
    \ an exhaustive search, and it’s only doable if `X` has few columns. With many\
    \ features, the number of subsets to evaluate explodes.[5](#CSU-2-12.xhtml#nota5-05)\n\
    \nIn these cases, we select features via heuristic methods: methods that lead\
    \ to a solution without guaranteeing it is the best or optimal. The simplest such\
    \ method is called backward elimination. We keep checking if removing one of the\
    \ features improves performance. If it does, the feature is dropped. Once we’ve\
    \ tried removing all features without success, we stop and keep the features that\
    \ remained:\n\n```\nkeep_changing ← True\nwhile(keep_changing)\n  keep_changing\
    \ ← False\n  for each column in X\n    X_new ← X.remove(column)\n    if is_better(X_new,\
    \ X)\n      X ← X_new\n      keep_changing ← True\n      break\n```\n\nThe reverse\
    \ process is called forward selection: start with an empty feature set and keep\
    \ adding new features one-by-one, as long as they improve performance. When there’s\
    \ a tie between selecting a larger or a smaller group of features, opt for the\
    \ smaller option.[6](#CSU-2-12.xhtml#nota5-06)\n"
  raw: 'In addition, you may normalize a column right after performing a logarithmic
    transformation to it. Here’s an example:


    ![](image/05-28-h.jpg)


    Figure 5.28 MinMax with and without prior log transformation.


    Directly normalizing data with extreme variance leads to a lot of values being
    very close to each other. By performing a logarithmic transformation before the
    normalization, numbers are better spread across the range, and differences between
    values are easier for the model to perceive.


    Binning


    Making a feature carry less information sometimes helps the model. Suppose your
    hospital is trying to predict the duration of stay of incoming patients, and that
    you have a column for their age. As you investigate, you notice that small age
    differences have little effect on the duration of hospitalizations, yet there
    is a significant difference between children and adults. In this case, try to
    help the model differentiate these groups. For example, you can transform age
    into a categorical feature with the labels “child”, “teen” and “adult”.


    This technique is called binning. It consists of organizing the original data
    into “bins” which are more relevant than the original values. It can also be helpful
    when you have categorical features where some labels rarely appear—study them
    and bin the related ones together.


    For instance, a categorical feature indicating a patient’s disease may have thousands
    of labels. Binning them in groups of related diseases can help the model make
    sense of the data. If you don’t have time to create elaborate bins, try simply
    replacing all low-frequency labels with a single “others” label. That alone can
    potentially help your model a lot.


    Clustering


    In hospitals, incoming patients are often assigned to a group according to their
    symptoms or illness. This helps doctors and nurses: they can check which group
    a patient belongs to and obtain instant, valuable information about the patient.


    If you’re a restaurant’s manager, it’s also useful to divide customers into groups.
    There are the junkie diners, the healthy food lovers, the penny-pinchers, etc.
    Knowing these groups allows you to target different promotions to the customers
    who are most likely to respond. Also, the restaurant may adapt its offerings to
    its most profitable customers.


    Be careful: you must group elements judiciously for it to help your model. Most
    datasets will contain sets of rows with similar characteristics. If you manage
    to group records according to these similarities, add a column toX indicating
    which group each record is a part of. This new categorical feature will often
    enhance the performance of a predictive model.


    The process of finding similar characteristics and assigning each record to a
    group is called clustering. There are algorithms that can automate clustering.
    The most widely used clustering algorithm is called k-means. Install a library
    that has this algorithm, and run it on your dataset. In addition to X, the algorithm
    requires you to input k, the number of different groups it should create. To get
    started, run it multiple times, setting k from 2 to 10. Each time, you should
    obtain a different extra column for X. Cross-validate your model for each grouping,
    and keep the one that helps your model the most.


    If you are using an automatically generated grouping of rows as a new feature,
    there’s an interesting data exploration exercise you can do. Look into the records
    assigned to each group, and try to come up with a name that best represents it.
    This often leads to interesting discoveries!


    Feature Extraction


    As we collect features, X may end up having columns which highly correlate to
    each other. When this happens, redundant information is being passed to the model,
    which in most cases is not very useful. Most models work best when columns in
    X carry distinct information. Fortunately, special math tricks can compress the
    information from a group of columns into fewer, more representative ones. This
    process is called feature extraction.


    A well-known feature extraction trick is the Principal Component Analysis, or
    PCA.[4](#CSU-2-12.xhtml#nota5-04) It requires columns in X to be normalized via
    z-score first. PCA transforms some columns into less correlated columns that preserve
    the original information. Let’s see an example where columns store the average,
    minimum and maximum daily temperatures in a city:


    ![](image/05-29-v.jpg)


    Figure 5.29 Features transformed via z-scores and PCA. At each step, the correlation
    coefficient between columns is shown, as well as each column’s standard deviation.


    PCA returns a new X where columns display little correlation with each other.
    Furthermore, PCA tends to compact more information in the columns to the left
    and orders them by decreasing levels of variance. We can then try to discard the
    columns to the right, which display little variance, and see if the model performs
    better. It often does!


    Another feature extraction trick is the Non-negative Matrix Factorization, or
    NMF. As its name suggests, it only works if X contains no negative values. It
    allows us to compress the information of X into a number of columns of our choosing.
    Let’s use NMF to transform the data from our previous example into two columns:


    ![](image/05-30-v.jpg)


    Figure 5.30 Features transformed via MinMax and NMF. At each step, the correlation
    coefficient between columns is shown, as well as each column’s standard deviation.


    Unlike PCA, NMF generated unordered columns that are all equally relevant. While
    PCA outputs a series of columns of diminishing relevance, NMF attempts to split
    information into columns representing distinct behaviors. As usual, it’s helpful
    to experiment with different numbers of output columns. Test your model with NMF
    tables of different sizes, and pick the number that works best.


    Before PCA or NMF, columns of X typically represent a specific measurement or
    attribute. After either transformation, columns no longer have a direct link to
    an attribute from the real world, even though they collectively retain the original
    information. This may help a machine, but it makes the data less transparent to
    humans. For this reason, feature extraction is usually the last step of the feature
    engineering process.


    Feature Selection


    Some features might hinder a model’s performance rather than help it. This often
    happens with redundant features, features containing bad quality data, or features
    that aren’t really related to y. Removing unhelpful columns from X is called feature
    selection.


    Model performance will vary when we use different subsets of features and want
    to select the subset that maximizes performance. The only way to guarantee this
    is to evaluate all possible selections of columns, keeping track of the best selection
    found. That’s called an exhaustive search, and it’s only doable if X has few columns.
    With many features, the number of subsets to evaluate explodes.[5](#CSU-2-12.xhtml#nota5-05)


    In these cases, we select features via heuristic methods: methods that lead to
    a solution without guaranteeing it is the best or optimal one. The simplest such
    method is called backward elimination. We keep checking if removing one of the
    features improves performance. If it does, the feature is dropped. Once we’ve
    tried removing all features without success, we stop and keep the features that
    remained:


    keep\_changing ← True


    while(keep\_changing)


         keep\_changing ← False


         for each column in X


              X\_new ← X.remove(column)


              if is\_better(X\_new, X)


                   X ← X\_new


                   keep\_changing ← True


                   break


    The reverse process is called forward selection: start with an empty feature set
    and keep adding new features one-by-one, as long as they improve performance.
    When there’s a tie between selecting a larger or a smaller group of features,
    opt for the smaller option.[6](#CSU-2-12.xhtml#nota5-06)'
