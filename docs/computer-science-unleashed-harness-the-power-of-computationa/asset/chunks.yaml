- fmt: "\nThis goal can be achieved using a product cipher that combines simple substitution\
    \ and shuffling operations. However, ridding it from all observable malleability\
    \ across different chunks of the ciphertext is not straightforward: the product\
    \ cipher has to be applied multiple times, and its substitution and shuffling\
    \ operations must be carefully chosen. In fact, operations for a suitable product\
    \ cipher could only be found under the constraint that the plaintext always has\
    \ the same fixed size.\n\nCiphers that operate on this principle are called block\
    \ ciphers, because the plaintext must be encrypted in fixed-size blocks. If the\
    \ plaintext is longer than the block size, it has to be divided into multiple\
    \ chunks. If a plaintext isn’t long enough to fill an entire block, it is typically\
    \ padded with zeros. Currently, the most common block ciphers work with blocks\
    \ of 128 or 256 bits.\n\n![](image/03-07-h.jpg)\n\nFigure 3.7 Simplified schematic\
    \ of a block cipher. Typically, block ciphers must iterate their core product\
    \ cipher about a dozen times.\n\nBlock ciphers aren’t malleable. If one bit is\
    \ changed in a block of ciphertext, then the entire message gets decrypted into\
    \ garbled data. For this reason, even if bits of the plaintext are known, the\
    \ attacker is unable to alter the ciphertext and create a forged message.\n\n\
    There are several ways to split and encrypt plaintexts that are longer than the\
    \ block size. The simplest way to do it is to split and pad the plaintext into\
    \ blocks of the right size and then to directly apply the block cipher to each\
    \ one of them. We say that the resulting ciphertext was encrypted in Electronic\
    \ Codebook (ECB) mode.\n\nUnfortunately, there’s a problem with `ECB`: an attacker\
    \ can know if the same block of plaintext is encrypted twice using the same key,\
    \ as that will result in the exact same block of ciphertext. For example, if an\
    \ attacker knows that a block of ciphertext tells a bank to credit $100 dollars\
    \ to his account, he could potentially replay that message again every time he\
    \ wants an extra $100.\n\nAnd beware: this vulnerability can also allow an attacker\
    \ to obtain information about a long plaintext encrypted in `ECB` mode. For example,\
    \ suppose we wish to encrypt an image file. When we split sections of the image\
    \ file into blocks of plaintext, sections of identical shade and color will yield\
    \ identical blocks of ciphertext:\n\n![](image/03-08-h.jpg)\n\nFigure 3.8 An image\
    \ encrypted using a block cipher in `ECB` mode. Patterns of plaintext (left) are\
    \ repeated, and the disposition of those repeated blocks in the ciphertext (right)\
    \ reveal the nature of its content.\n\nTo fix this, we transform the plaintext\
    \ to ensure every plaintext block has a unique value. There are many ways to do\
    \ it. One way is to use a nonce as large as the size of a block, called the Initialization\
    \ Vector (IV):\n\n*   We start by transforming the first block of plaintext by\
    \ applying the nonce as if it were a one-time pad (as demonstrated at the beginning\
    \ of this section). This transformed plaintext is then properly encrypted with\
    \ the block cipher key.\n*   For each subsequent block, we use the previous block\
    \ of ciphertext as the one-time pad to transform the plaintext. Each transformed\
    \ plaintext can then be safely encrypted with the same block cipher key.\n\nWhen\
    \ a block cipher is used this way, we say it’s being operated in Cipher Block\
    \ Chaining (CBC) mode. You won’t need to code any of these plaintext transformations\
    \ yourself. Instead, you can configure your cryptographic library to make your\
    \ block cipher operate using the mode you want. There are other modes that avoid\
    \ the pitfalls of `ECB` mode, but unless you know what you’re doing, we recommend\
    \ you stick to `CBC` mode!\n\nAs with stream ciphers, vulnerabilities have been\
    \ found in many of the block ciphers proposed by experts so far. Before you select\
    \ a block cipher to use, check which ones are currently recommended by cryptographers.[11](#CSU-2-10.xhtml#nota3-11)\n\
    \n## BLOCK CIPHER VS STREAM CIPHER\n\nBlock ciphers require more computing power\
    \ than stream ciphers. When the extra security of the block ciphers isn’t required,\
    \ and the plaintext is being created dynamically (e.g. live encryption of a phone\
    \ call), it can be better to choose a stream cipher. They allow the plaintext\
    \ to be encrypted and transmitted one byte at a time, whereas block ciphers require\
    \ larger chunks of data to be encrypted before transmission.\n\nStream ciphers\
    \ and block ciphers are part of a larger category called symmetric ciphers, because\
    \ they require both communication parties to have a copy of the same key. In other\
    \ words, you can only secure a communication with a symmetric cipher if you have\
    \ previously agreed on a shared secret with your counterpart.\n\n## 3.3 Asymmetry\n\
    \nBefore we can communicate using a symmetric cipher, we must find a secure way\
    \ to share a secret encryption key with our correspondent. In the past, people\
    \ had to meet in person or send keys through a trusted courier. Today, there are\
    \ ways for two people who have never met to share a secret key without using a\
    \ secure communication link.\n\n### Diffie–Hellman Key Exchange\n\nSuppose Ada\
    \ wants to send a secret message to Charles, but they haven’t yet decided on a\
    \ shared secret. There’s a technique, called the Diffie–Hellman key exchange,\
    \ that allows Ada and Charles to jointly select a secret number. It only requires\
    \ them to send each other a message that doesn’t even have to be secret. From\
    \ these public messages, it’s impossible for a third party to know which secret\
    \ number Ada and Charles selected. Let’s see how it works:\n\n1.  Ada chooses\
    \ a prime number `p` and some other arbitrary number `g`. She then picks a secret\
    \ number `a` that she won’t share.\n2.  Ada sends a message to Charles containing\
    \ `p`, `g`, and a third number `A` calculated using the modulo operation:[12](#CSU-2-10.xhtml#nota3-12)\n\
    \    `A = ga mod p`\n3.  Charles picks a secret number `c`, and sends a message\
    \ to Ada containing the number `C`, computed as follows:\n    `C = gc mod p`\n\
    4.  Ada computes `Ca mod p`, and Charles computes `Ac mod p`. By some amazing\
    \ math properties, they both computed the same number! In other words, their shared\
    \ secret is:\n    `Ca mod p = Ac mod p`,\n    where Ada is the only one to know\
    \ `a` and Charles is the only one to know `c`.\n\nFor this scheme to be secure,\
    \ the numbers must be large: `a`, `c`, `g` and `p` must be chosen such that each\
    \ number is several hundred digits long. Also, the secret numbers `a` and `c`\
    \ must be chosen at random. If these requisites are met, there isn’t any viable\
    \ method for attackers to discover the shared secret key without knowledge of\
    \ either `a` or `c`.\n\nThere is still, however, a security risk that is not covered\
    \ by the Diffie–Hellman key exchange: how can Ada and Charles be sure that they’re\
    \ really interacting with each other? Maybe, Ada receives `C` not from Charles,\
    \ but from an attacker impersonating him. Fortunately, cryptographers developed\
    \ tools that can address this problem.\n\n### Public Key Ciphers\n\nCiphers we’ve\
    \ seen so far use the same key for encryption and decryption. Inspired by Diffie\
    \ and Hellman, cryptographers invented a different type of cipher, where a second\
    \ key is derived from the main key. Whoever knows the second key can perform the\
    \ encryption operation. However, decryption requires the main key. Ciphers that\
    \ use different keys for encryption and decryption are asymmetric ciphers.\n\n\
    With symmetric ciphers there’s only one key, which is known by everyone involved\
    \ in the secret conversation. The key is only useful to that group of people and\
    \ it must always be a shared secret. With asymmetric ciphers, there are two keys.\
    \ The main key is the private key, and it is only known to one person (or entity).\
    \ The second key is the public key, and it is ideally available to everyone. One\
    \ pair of private–public keys can serve many different communication contexts.\n"
  raw: 'This goal can be achieved using a product cipher that combines simple substitution
    and shuffling operations. However, ridding it from all observable malleability
    across different chunks of the ciphertext is not straightforward: the product
    cipher has to be applied multiple times, and its substitution and shuffling operations
    must be carefully chosen. In fact, operations for a suitable product cipher could
    only be found under the constraint that the plaintext always has the same fixed
    size.


    Ciphers that operate on this principle are called block ciphers, because the plaintext
    must be encrypted in fixed-size blocks. If the plaintext is longer than the block
    size, it has to be divided into multiple chunks. If a plaintext isn’t long enough
    to fill an entire block, it is typically padded with zeros. Currently, the most
    common block ciphers work with blocks of 128 or 256 bits.


    ![](image/03-07-h.jpg)


    Figure 3.7 Simplified schematic of a block cipher. Typically, block ciphers must
    iterate their core product cipher about a dozen times.


    Block ciphers aren’t malleable. If one bit is changed in a block of ciphertext,
    then the entire message gets decrypted into garbled data. For this reason, even
    if bits of the plaintext are known, the attacker is unable to alter the ciphertext
    and create a forged message.


    There are several ways to split and encrypt plaintexts that are longer than the
    block size. The simplest way to do it is to split and pad the plaintext into blocks
    of the right size and then to directly apply the block cipher to each one of them.
    We say that the resulting ciphertext was encrypted in Electronic Codebook (ECB)
    mode.


    Unfortunately, there’s a problem with ECB: an attacker can know if the same block
    of plaintext is encrypted twice using the same key, as that will result in the
    exact same block of ciphertext. For example, if an attacker knows that a block
    of ciphertext tells a bank to credit $100 dollars to his account, he could potentially
    replay that message again every time he wants an extra $100.


    And beware: this vulnerability can also allow an attacker to obtain information
    about a long plaintext encrypted in ECB mode. For example, suppose we wish to
    encrypt an image file. When we split sections of the image file into blocks of
    plaintext, sections of identical shade and color will yield identical blocks of
    ciphertext:


    ![](image/03-08-h.jpg)


    Figure 3.8 An image encrypted using a block cipher in ECB mode. Patterns of plaintext
    (left) are repeated, and the disposition of those repeated blocks in the ciphertext
    (right) reveal the nature of its content.


    To fix this, we transform the plaintext to ensure every plaintext block has a
    unique value. There are many ways to do it. One way is to use a nonce as large
    as the size of a block, called the Initialization Vector (IV):


    • We start by transforming the first block of plaintext by applying the nonce
    as if it were a one-time pad (as demonstrated at the beginning of this section).
    This transformed plaintext is then properly encrypted with the block cipher key.


    • For each subsequent block, we use the previous block of ciphertext as the one-time
    pad to transform the plaintext. Each transformed plaintext can then be safely
    encrypted with the same block cipher key.


    When a block cipher is used this way, we say it’s being operated in Cipher Block
    Chaining (CBC) mode. You won’t need to code any of these plaintext transformations
    yourself. Instead, you can configure your cryptographic library to make your block
    cipher operate using the mode you want. There are other modes that avoid the pitfalls
    of ECB mode, but unless you know what you’re doing, we recommend you stick to
    CBC mode!


    As with stream ciphers, vulnerabilities have been found in many of the block ciphers
    proposed by experts so far. Before you select a block cipher to use, check which
    ones are currently recommended by cryptographers.[11](#CSU-2-10.xhtml#nota3-11)


    BLOCK CIPHER VS STREAM CIPHER Block ciphers require more computing power than
    stream ciphers. When the extra security of the block ciphers isn’t required, and
    the plaintext is being created dynamically (e.g. live encryption of a phone call),
    it can be better to choose a stream cipher. They allow the plaintext to be encrypted
    and transmitted one byte at a time, whereas block ciphers require larger chunks
    of data to be encrypted before transmission.


    Stream ciphers and block ciphers are part of a larger category called symmetric
    ciphers, because they require both communication parties to have a copy of the
    same key. In other words, you can only secure a communication with a symmetric
    cipher if you have previously agreed on a shared secret with your counterpart.


    3.3      Asymmetry


    Before we can communicate using a symmetric cipher, we must find a secure way
    to share a secret encryption key with our correspondent. In the past, people had
    to meet in person or send keys through a trusted courier. Today, there are ways
    for two people who have never met to share a secret key without using a secure
    communication link.


    Diffie–Hellman Key Exchange


    Suppose Ada wants to send a secret message to Charles, but they haven’t yet decided
    on a shared secret. There’s a technique, called the Diffie–Hellman key exchange,
    that allows Ada and Charles to jointly select a secret number. It only requires
    them to send each other a message that doesn’t even have to be secret. From these
    public messages, it’s impossible for a third party to know which secret number
    Ada and Charles selected. Let’s see how it works:


    1. Ada chooses a prime number p and some other arbitrary number g. She then picks
    a secret number a that she won’t share.


    2. Ada sends a message to Charles containing p, g, and a third number A calculated
    using the modulo operation:[12](#CSU-2-10.xhtml#nota3-12)


    A \= ga mod p.


    3. Charles picks a secret number c, and sends a message to Ada containing the
    number C, computed as follows:


    C \= gc mod p.


    4. Ada computes Ca mod p, and Charles computes Ac mod p. By some amazing math
    properties, they both computed the same number! In other words, their shared secret
    is:


    Ca mod p \= Ac mod p,


    where Ada is the only one to know a and Charles is the only one to know c.


    For this scheme to be secure, the numbers must be large: a, c, g and p must be
    chosen such that each number is several hundred digits long. Also, the secret
    numbers a and c must be chosen at random. If these requisites are met, there isn’t
    any viable method for attackers to discover the shared secret key without knowledge
    of either a or c.


    There is still, however, a security risk that is not covered by the Diffie–Hellman
    key exchange: how can Ada and Charles be sure that they’re really interacting
    with each other? Maybe, Ada receives C not from Charles, but from an attacker
    impersonating him. Fortunately, cryptographers developed tools that can address
    this problem.


    Public Key Ciphers


    Ciphers we’ve seen so far use the same key for encryption and decryption. Inspired
    by Diffie and Hellman, cryptographers invented a different type of cipher, where
    a second key is derived from the main key. Whoever knows the second key can perform
    the encryption operation. However, decryption requires the main key. Ciphers that
    use different keys for encryption and decryption are asymmetric ciphers.


    With symmetric ciphers there’s only one key, which is known by everyone involved
    in the secret conversation. The key is only useful to that group of people and
    it must always be a shared secret. With asymmetric ciphers, there are two keys.
    The main key is the private key, and it is only known to one person (or entity).
    The second key is the public key, and it is ideally available to everyone. One
    pair of private–public keys can serve many different communication contexts.'
