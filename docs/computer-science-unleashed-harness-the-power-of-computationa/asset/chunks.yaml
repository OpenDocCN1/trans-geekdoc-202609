    sets in order to evaluate a model. Since the validation set is used to gauge the
    model’s true performance outside of its training realm, it should never affect
    the training of the model.


    This also applies to feature engineering: all transformations will affect the
    training of the model, and therefore must be calibrated only using the training
    set. Failing to do so amounts to data leakage, as described in Section 5.1. Let’s
    go through some examples to make sure you get the idea.


    Suppose you’re performing mean imputation to one of your columns. The mean values
    are calculated from the rows of the training set only. The blank cells of the
    training and validation sets will both be filled with the mean of the training
    set. This way, no information from the validation set leaks into the training
    set.


    Similarly, you must always decide which values are considered outliers based on
    the training set only. After this decision is made, apply the exact same numerical
    operations to both training and validation sets.


    When normalizing via MinMax, use the training set’s minimum and maximum values
    as your reference for transforming both the training and the validation sets.
    If you’re normalizing via z-scores, consider the training set’s mean and standard
    deviation. When developing binning strategies, consider the occurrence of labels
    in the training set only to decide how your data should be categorized.


    The same rules apply for feature extraction: the PCA or NMF algorithm should be
    calibrated using the training set. The exact same mathematical operations will
    then be performed on both training and validation sets.


    We’ve seen that the training set changes for each independent evaluation during
    cross-validation. This means your feature engineering transformations should be
    re-calibrated and applied to each new pair of training and validation sets. Watch
    out: don’t calibrate and apply feature engineering transformations only once and
    before cross-validation, but rather many times during cross-validation. It’s a
    common mistake that often leads to inaccurate predictions down the line.


    Model Selection


    Open source machine learning libraries are available for most modern programming
    languages. These libraries usually come preloaded with dozens of different models
    you can readily put to use.


    Each different model employs different mathematical tricks to train and predict.
    As you become a seasoned machine learning practitioner, you’ll eventually learn
    how models work and behave in different situations. This experience will help
    you use different models more effectively.


    If you’re getting started with machine learning, it’s OK to try all available
    models in your machine learning library, even if you have no clue how they work
    under the hood. As you try them, you’ll empirically discover which ones are best
    for the predictive tasks you’re working on.


    There’s just one thing you must research about every model you use: its configuration
    settings, also known as hyperparameters. They should be adjusted to your prediction
    task. Sticking to default settings often results in bad performance and prevents
    you from fairly evaluating a model’s potential.


    In order to properly adjust your hyperparameters, start by checking the model’s
    documentation. Once you know what your options are, start experimenting. For example,
    you could try doubling or halving the default values of each hyper-parameter and
    see how it affects performance. Keep tinkering with the hyperparameters until
    you’re confident you’ve found the right setting for each.[7](#CSU-2-12.xhtml#nota5-07)
    After you’ve adjusted the hyperparameters of each model you intend to evaluate,
    you can compare their performance and finally select the one that works best.


    Final Steps


    After you adjust your features and model, it’s time to prepare the system for
    real world deployment. Since you’ve already decided all of your adjustments, you
    don’t need a validation set anymore. Take all of your imputation, outlier handling,
    normalization, and binning rules, as well as your feature extraction transformations,
    and calibrate them using your entire labeled dataset.


    Then, take your chosen model with its ideal hyperparameters, and train it using
    your entire labeled dataset. Your feature transformation rules along with your
    trained model are your final prediction system, ready to be put to use.


    Once a new, never-before-seen event happens, feed its features to the system.
    If you did everything right, it will output a glimpse of the event’s unknown future.
    That glimpse will be as accurate as you have evaluated the model’s performance
    to be via cross-validation... Or will it?


    Unfortunately, since you’ve been using the entire dataset over and over to adjust
    your system, there’s a possibility that some overfitting has crept in during the
    fine-tuning phase. This means that your system is adjusted to your dataset better
    than it would be to any other events. In other words, it will perform better on
    records of your labeled dataset than on never-before-seen events.


    TEST SET The only way to ensure a completely unbiased evaluation of a predictive
    system is to evaluate it with data it has never been in contact with. To this
    end, we can separate a small part of our labeled dataset into a test set before
    we even start with cross-validation. The test set is never used for training,
    validation, or final preparation of the model. It is only used for a single, ultimate
    evaluation of the model that will go live. If the labeled data is unbiased, the
    model’s performance on the test set should be a true sample of its performance
    in the real world.


    Conclusion


    Building a machine learning system is an intricate process. There are many details
    you must get right to obtain usable predictive results. So take advantage of existing
    libraries: they will help you perform feature engineering, cross-validation, and
    model evaluation. Many of them can do nearly everything we saw in this chapter.


    When using such libraries, data transformations and cross-validation steps only
    take a few lines of code. It’s common for programmers to use code notebooks to
    share this type of code. Code notebooks mix text, code, and plots in the same
    file, and can easily be viewed, re-executed and experimented with.


    The reproducibility principle that was discussed at length in the previous chapter
    also applies to machine learning. Make sure all transformations of your data are
    reproducible and structured in a pipeline that’s easy to modify. The same goes
    for processes to fine-tune your model and its hyperparameters.


    Keep in mind that this chapter was an introduction to the machine learning practice.
    There are many tricks we didn’t mention. For instance, there are techniques for
    combining the prediction results of different models into a so-called ensemble,
    which often outperforms any individual model.


    Machine learning is developing at a fast pace. New techniques for feature engineering
    and model selection are published every year. Big tech companies are now offering
    cloud computing services with automated platforms for predictive model creation.
    By practicing the concepts presented in this chapter, you’ll be able to make the
    best use of these resources... and make sense of the artificial intelligence revolution
    as it unfolds.


    ![](image/05-31-h.jpg)


    Figure 5.31 Machine learning doesn’t solve everything.


    It can be scary to think that machines are influencing our decisions—or that they
    are outright making them for us. Whenever a prediction might influence someone’s
    life, think of the possible consequences. Machine learning is neither good nor
    evil: it’s your job to use it ethically and responsibly.


