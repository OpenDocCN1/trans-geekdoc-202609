- fmt: '

    In contrast, the median is an average that stays unaffected by the extreme values
    of the group. To get the median, sort the values in numerical order and pick the
    one in the middle. For Dogecoin: `(-2,−1, 7, 7, 7)`. If the number of elements
    is even, no single central value exists, like for Ether: `(2, 3, 4, 21)`. The
    median is then the mean of the two central elements. In both cases, the median
    will always indicate the center: it’s greater than half the values and less than
    the other half.


    ![](image/i-04-06-h.jpg)


    The median isn’t perfect either. Notice how Bitcoin and Dogecoin exhibit the same
    median of seven dollars, although the experts offer very different predictions:
    100% agree Bitcoin will earn around seven dollars, whereas 40% say Dogecoin will
    register losses!


    While the mean considers all the numbers of a group, it’s very sensitive to extreme
    values. The median isn’t affected by extremes, but it ignores all values other
    than the central one. Together, mean and median are complementary ways to average
    numbers.[8](#CSU-2-11.xhtml#nota4-08)


    ## Variability


    Whether we use the mean or the median, we cannot know how precisely it represents
    its group of numbers. For example, `(9, 10, 11)` and `(0, 10, 20)` both average
    to 10, even though the values of the former are much closer to 10.


    The standard deviation of a group of values indicates how far they tend to be
    from the mean. The larger the standard deviation, the more the numbers are spread
    out. Most programming languages have built-in functions that compute standard
    deviation.[9](#CSU-2-11.xhtml#nota4-09) Let’s see how it can be used:


    ![](image/i-04-07-h.jpg)


    ### INTELLIGENT INVESTMENT ![](image/c-avof.jpg) Your grandma wants to invest
    in tech! Since she plans on paying the membership fees of her bridge club with
    the returns, she needs you to determine which one of the three stocks she is considering
    can provide the most stable yearly income. Based on their five year history of
    returns (in %), how can you compare the volatilities of these three stocks?


    For each stock, you can calculate the standard deviation of its yearly returns,
    as this is a good indication of the volatility.


    ![](image/i-04-08-h.jpg)


    Among these stocks, Apple and Google displayed similar volatility, whereas Microsoft
    yielded more stable returns year-to-year.


    You can use standard deviation every time you calculate a mean: it can be a measure
    of a bowman’s precision, the temperature variations in a town, or income inequality
    in a population. Remember to use it to describe how well the mean summarizes a
    group of values.


    ## Five-Number Summary


    Suppose you are considering a few cities in which to spend the summer, and for
    each city you found a database containing the peak temperature of every single
    day of the year 2018. How can you estimate the number of days of enjoyable weather
    each city will offer? For starters, the median of daily peak temperatures is informative:
    it divides the days such that half were cooler than the median, and half were
    warmer. We can repeat this process and divide the halves into quarters:


    ![](image/04-08-h.jpg)


    Figure 4.8 Daily peak temperatures (°C) in Los Angeles (July 2018). Each point
    represents one day. Since `n \= 31`, each quarter of the data comprises eight
    points.


    After the median divides the ordered data points into halves, the upper quartile
    divides the top half into quarters and the lower quartile divides the bottom half
    into quarters. The upper and lower quartiles—along with the mean, minimum, and
    maximum—constitute the five-number summary. Many modern programming languages
    have libraries for easily outputting these numbers. Here are the summaries for
    daily peak temperatures of a few cities in the entire year of 2018 (`n \= 365`).


    Table 4.5 Five-number summaries of peak temperatures.


    ![](image/i-04-09-h.jpg)


    These summaries illustrate interesting factors to consider when you’re choosing
    where to spend the summer: even if Minneapolis is freezing a quarter of the year,
    the warmest 91 days are warmer than in Los Angeles!


    ### OUTLIERS


    We sometimes stumble upon abnormally high or low values, which don’t seem to be
    reasonable when considering the other values in the column. These values typically
    indicate extreme events that are markedly different in nature. It pays to single
    out these values and study them carefully. In order to identify these values systematically,
    scientists define normality boundaries. Values outside the boundaries, if any,
    are marked as outliers.


    There are many methods to define a normality boundary. For example, we often start
    by subtracting the lower quartile from the upper quartile. This difference is
    called the interquartile range, or `IQR`, and values further than `1.5×IQR` from
    its closest quartile are then considered outliers.


    ![](image/04-09-h.jpg)


    Figure 4.9 Identifying the outliers of fig. 4.8. We find an interquartile range
    of 3.1°, so `1.5 × IQR` ![](image/p-equivale.jpg) 4.5°. The higher boundary is
    therefore 32.3°, and the lower boundary is 20.2°.


    There are no lower outliers in the temperature measurements of July 2018 in Los
    Angeles: all the values are above the lower boundary (fig. 4.9). On the other
    hand, there’s a cluster of four days, three of which are outliers with 32.4°,
    33.3°, and 33.9°.


    Those were different in nature indeed: a record-breaking heat wave struck southern
    California from July 6 to July 9, 2018. thermometers the UCLA campus recorded
    their warmest ever.


    ## Categorical Summary


    Records of categorical data contain labels rather than numbers, so we can’t directly
    summarize them with an average, a standard deviation, or five-number summary.
    However, we can count them.


    We typically summarize categorical data by counting the number of times category
    occurs. When category counts are expressed as a percentage of the total count
    `n`, we get the frequency at which category occurs. For instance, a table with
    each medal and its winning nation at the 1896 summer games can be summarized by
    counting the most frequent countries:


    ![](image/i-04-10-h.jpg)


    ## Correlation Matrix


    When it rains, roads become more slippery and visibility decreases; therefore,
    car insurance companies expect more accidents. Imagine you are such an insurance
    company, and you collected a dataset with three columns such that each row contains
    a date, the amount of rainfall at that date, and the corresponding number of traffic
    accidents. You would expect to see the values in the two columns increase and
    decrease together: the more it rains, the more accidents happen.


    When two columns vary together, we say the columns are correlated. We can express
    the strength of the phenomenon with a number called the correlation coefficient,
    or “correlation” for short.[10](#CSU-2-11.xhtml#nota4-10) A correlation coefficient
    of 0 means the values do not vary together at all. A correlation coefficient of
    1 indicates the two columns vary together perfectly.


    In practice, the correlation coefficient is rarely equal to exactly 0 or exactly
    1. To quickly search for relationships between columns of our tables, we calculate
    the correlation values for every pair of columns in the table. The results can
    be compiled in a correlation matrix, which summarizes how much columns vary together.


    For example, suppose you work for the City of Los Angeles, and you constructed
    a table where each row is a day, and columns represent the daily peak temperature,
    the day’s average wind speed, rain volume, the number of traffic accidents, and
    the number of assaults registered by the police department. Building a correlation
    matrix reveals the relationships among these variables:


    Table 4.7 Correlations in daily events (Los Angeles, 2018, n \= 365).


    ![](image/i-04-11-h.jpg)

