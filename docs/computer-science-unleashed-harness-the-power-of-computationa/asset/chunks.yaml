    Engineers worldwide agreed that an American non-profit organization, the Internet
    Assigned Numbers Authority (`IANA`), decides who gets control over which IP routing
    prefixes. In practice, `IANA` delegates most of its power to five non-profit organizations
    called Regional Internet Registries, or `RIRs`. To do so, it allocates each `RIR`
    short hex combinations that they can use as the first digits of the routing prefixes
    they assign.


    ![](image/01-16-h.jpg)


    Figure 1.16 Examples of allocations to each RIR.


    ![](image/01-17-h.jpg)


    Figure 1.17 `IANA` delegates its IP addressing power geographically: each `RIR`
    is responsible for a different region.


    To obtain a routing prefix for your organization, you must make a request to the
    `RIR` of the region where your routers will be. That `RIR` will then assign you
    a prefix starting with one of their combinations of hex digits that `IANA` allocated
    them.


    For example, Facebook, which has headquarters in Ireland, was granted its routing
    prefix by `RIPE NCC`. Likewise, the Swiss bank Credit Suisse has a Latin American
    branch that was granted a routing prefix by `LACNIC`:


    ![](image/01-18-h.jpg)


    Figure 1.18 IP address allocation chain for two companies. This means computers
    in the Latin American Credit Suisse branches may be assigned IP addresses as follows:


    This means computers in the Latin American Credit Suisse branches may be assigned
    IP addresses as follows:


    ```

    2801:80:1380: ![](image/c-quadverde4.jpg) :_\_\_\_:\_\_\_\_:\_\_\_\_:\_\_\_\_

    ```


    Network administrators in the bank will assign a unique combination of hex digits
    to each of their subnets such that they fit in the remaining space of the network
    part ![](image/c-quadverde4.jpg). Since each hex digit can have 16 different values,
    the bank has enough space for `164 = 65,536` different subnets. Facebook, being
    a larger organization, was granted a prefix with room for over 4 billion subnets!


    We’ve seen that network administrators can choose how the sixteen blanks of the
    interface ID are to be filled for individual devices. Such devices may then send
    and receive IP packets to and from the Internet as long as their router has connectivity.


    ### Internet Service Providers


    Most individuals and small organizations don’t deal directly with `RIRs`, nor
    do they maintain peering links to other computer networks. Instead, they buy Internet
    connectivity from specialized companies, which are called Internet Service Providers
    (`ISP`). `ISPs` install routers close to their customers. That way, they can easily
    link one of their routers to a router in any customer’s premises. They also allocate
    a routing prefix for each of their customers.


    Let’s see how it works in practice. In the United Kingdom, an `ISP` called `Sky`
    was granted the routing prefix `2a02:0c7f`. `Sky` operates in many British cities,
    so the prefix is divided between their regional bases. For instance, they assign
    `2a02:c7f:48` to their Milton Keynes network and `2a02:c7f:7e` to the one in Romford.[9](#CSU-2-8.xhtml#nota1-09).


    Let’s suppose Ada lives in Romford and wants to set up a network in her home.
    She has a desktop computer and a printer which she wants to connect using an Ethernet
    wire. She also wants her own WiFi network to connect her smartphone, tablet and
    laptop.


    Ada hires `Sky`, and they link their Romford router to a router in her home. `Sky`
    assigns Ada’s router a 14-digit routing prefix based on the one of their Romford
    base. Each network in Ada’s home (wired and wireless) gets assigned a subnet,
    based on the routing prefix `Sky` allocated to Ada. Figure 1.19 on the next page
    shows the full IP address allocation path from `IANA` to each of Ada’s devices.


    Ada’s router receives IP packets from several different computers, yet it’s easy
    for her router to decide on which link to forward each packet it receives. Packets
    addressed to a computer in one of Ada’s subnets can be directly delivered. All
    other IP packets it receives are forwarded through the link to the `ISP`.


    ![](image/01-19-v.jpg)


    Figure 1.19 IP address allocations from `IANA` to Ada’s devices. Her router uses
    different subnets for her wireless and wired networks, and therefore has a different
    IP address for each.


    For routers that don’t rely on the ISP, routing is not so easy. But how can they
    decide which link to reach the final destination?


    ### 1.4 IP Routing


    Suppose Ada wants to send a message to Facebook. She starts by crafting an IP
    packet that includes her own address, Facebook’s address, and the payload. Here
    is how Ada’s router is linked:


    ![](image/01-20-h.jpg)


    Figure 1.20 IP packet transmitted over WiFi.[10](#CSU-2-8.xhtml#nota1-10)


    ### Tables of Addresses


    Routers choose the next hop of a packet based on its destination. In order to
    do so, they are equipped with a table. Rows list possible addresses the router
    is configured to recognize. For each address, the table indicates which computer
    should be the next hop. For example, here is how Ada’s router is linked:


    ![](image/01-21-h.jpg)


    Figure 1.21 Ada’s router connected to a desktop computer and a printer via Ethernet,
    a notebook via WiFi, and to the ISP via DSL (or Digital Subscriber Line, a technology
    that allows digital data to flow through old cables).


    ![](image/01-22-h.jpg)


    Figure 1.22 Table that guides Ada’s router to networks.


    If the router receives a packet whose destination IP address doesn’t match any
    row in the table, the packet is forwarded through the default route. Routing is
    more complicated for the ISP’s router. In addition to its peering and transit
    links, it receives packets from many customers. For simplicity, let’s suppose
    Sky Romford’s router only serves two customers and has two peering links: one
    to the Sky router in Milton Keynes, and the other to Oxford University. Finally,
    let’s imagine it has a transit link with a larger telecom company:


    ![](image/01-23-v.jpg)


    Figure 1.23 Map of Sky Romford links. Ada, Charles, and Oxford University can
    talk using `Sky`’s local infrastructure only.


    ![](image/01-24-h.jpg)


    Figure 1.24 Table that guides Sky Romford’s router to forward networks.


    This is where the IP addressing hierarchy comes handy. In the forwarding table
    of fig. 1.24, IP addresses are grouped according to their routing prefix. This
    works because all IP addresses starting with `2a0a:207` are from computers in
    Oxford University, and all IP addresses starting with `2a02:c7f:48` are from computers
    serviced by `Sky` in Milton Keys.


    ### Internet Exchange Points


    In order to increase capacity and speed, network administrators often set up peering
    links with as many other organizations as possible. The cheapest way to do this
    is through places called Internet Exchange Points, or `IXPs`. Organizations join
    an `IXP` by wiring their routers to the `IXP` building. Every participating organization
    can then establish individual peering links with other organizations connected
    to the building.[11](#CSU-2-8.xhtml#nota1-11).

