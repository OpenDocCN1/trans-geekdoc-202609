    \n## 3.3 非对称性\n\n在我们可以使用对称加密之前，我们必须找到一种安全的方式来共享密钥。过去，人们必须面对面或通过信使发送密钥。\n\n###\
    \ 迪菲赫尔曼密钥交换\n\n假设 Ada 想要向查尔斯发送消息，但他们还没有共同选择密钥。有一种技术被称为迪菲赫尔曼密钥交换，它允许从未谋面的人共同选择秘密密钥。让我们看看它是如何工作的：\n\
    \n1.  Ada 选择一个素数 `p` 和另一个任意数字 `g`。她选择一个不共享的秘密数字 `a`。\n2.  Ada 向查尔斯发送包含 `p`、`g`\
    \ 和通过模运算计算出的数字 `A` 的消息：`A = ga mod p`\n3.  查尔斯选择秘密数字 `c`，并向 Ada 发送包含 `C` 的消息：`C\
    \ = gc mod p`\n4.  Ada 计算 `Ca mod p`，查尔斯计算 `Ac mod p`。通过神奇的数学特性，他们计算出了同一个数字！也就是说，他们的共享秘密是：\n\
    \    `Ca mod p = Ac mod p`，\n    其中 Ada 唯一知道 `a`，查尔斯唯一知道 `c`。\n\n为了此方案安全，数字必须足够大：`a`、`c`、`g`\
    \ 和 `p` 的选择必须使得每个数字都有数百位。此外，如果满足了这些要求，攻击者在不知道 `a` 或 `c` 的情况下没有可行的方法可以发现共享密钥。\n\
    \n然而，仍然存在一个迪菲赫尔曼密钥交换无法涵盖的安全风险：Ada 和查尔斯如何确定他们确实是在相互交互？也许 Ada 收到的 `C` 不是来自查尔斯，而是来自伪装他的攻击者。幸运的是，密码学家开发了可以解决问题的工具。\n\
    \n### 公钥加密\n\n我们目前看到的密码使用相同的密钥进行加密和解密。受迪菲和赫尔曼的启发，密码学家发明了一种不同的密码，其第二个密钥由主密钥派导出。任何知道第二个密钥的人都可以执行加密。然而，解密需要主密钥。使用不同密钥进行加密和解密的密码被称为非对称加密。\n\
    \n在对称加密中，只有一个密钥，所有参与秘密对话的人都知道这个密钥。密钥仅对该小组有效，且必须是共享秘密。在非对称加密中，有两个密钥。主密钥是私钥，只有一个人知道。第二个密钥是公钥，理想情况下对所有人可用。一对私钥-公钥可以用于许多不同的通信场景。\n\
    \n"
- fmt: 'Suppose Charles wants to communicate with Ada. If Charles knows Ada’s public
    key, he can use it to encrypt his plaintext message. He then transmits the ciphertext
    to Ada, and Ada can use her private key to decrypt it. If Andrew also wants to
    communicate with Ada, he can follow the same process, effectively using the same
    pair of keys in a different context! However, if Ada wants to respond to both
    of them, she will have to use Charles’ public key to encrypt the message for Charles
    and Andrew’s public key to encrypt the message for Andrew.


    There are still pitfalls when using public key ciphers. For instance, when Ada
    receives ciphertext from Charles, how can Ada be sure that the message really
    came from Charles and not an impostor? Ada’s public key is public, so anyone can
    send her a ciphertext claiming to be Charles. Secondly, if Charles is unable to
    physically meet with Ada, how can he retrieve a copy of her key and ensure that
    the key is legitimate?


    ## Digital Signatures


    Besides encryption and decryption, two more operations based on asymmetric cryptography
    were created: signing and verifying. The signing operation takes a plaintext and
    a private key as inputs and outputs a big number called a digital signature. The
    verifying operation takes a public key, a plaintext and a digital signature as
    inputs, and outputs true or false depending on the legitimacy of the digital signature.


    The only way to produce a legitimate digital signature for a given plaintext and
    public key is to perform the signing operation with the matching private key.
    Remember, with asymmetric cryptography, private keys are associated with an individual.
    Using your private key to produce a digital signature for a given plaintext is
    the digital equivalent of scribbling your signature next to the plaintext. The
    only difference is that a traditional signature always looks the same, and a digital
    signature looks completely different for each new plaintext—even if a single letter
    is changed.


    Compute a digital signature and publish it along with the message, and anyone
    who knows your public key will be able to perform the verifying operation and
    attest that you created that signature for that message. While fraudsters routinely
    forge physical signatures, nobody has figured out how to forge a digital signature
    made with strong cryptography.


    Digital signatures enable us to securely communicate with anyone, even if attackers
    are meddling with communication links. Recall the Diffie–Hellman key exchange:
    the only issue was that participants can’t be sure the numbers they’re sending
    each other weren’t modified in transit by attackers. When the messages in the
    key exchange are accompanied by digital signatures, there’s no way an impostor
    can undermine the process. If an attacker meddles with the messages, the digital
    signatures don’t match, and people can know they’re being duped before any information
    is exchanged.


    ## RSA & ECDSA


    In 2020, the mostly widely used asymmetric cryptographic schemes are RSA and ECDSA.
    RSA is more versatile: its key pairs can be used for both encrypting/decrypting
    and signing / verifying. ECDSA is computationally less expensive, but can only
    be used for signing/verifying. The working mechanisms of both schemes are based
    on advanced mathematics. Follow the specific instructions to operate each of these
    schemes, and you’ll be secure. For instance, when signing with ECDSA, a nonce
    has to be provided. If you reuse a nonce, your security will be weak!


    ## Digital Certificates


    Imagine Charles wants to send a secret message to Ada, but he doesn’t know her
    public key. If Ada sends her key to Charles through an insecure link, attackers
    could intercept the message and change it so that Charles receives their key instead.
    If he falls for the trap, their communications will be decipherable to the attackers.


    Suppose Charles knows the public key of his trusted friend Louis, and Louis has
    a copy of Ada’s public key. Louis can help by publishing a message with Ada’s
    key followed by the statement: “I, Louis, attest that this is Ada’s public key.”
    He then digitally signs this message, and makes the message and signature public.
    Now, anyone who trusts Louis and has a copy of his public key can retrieve the
    message and verify the signature. If the signature is valid, they can trust that
    the copy of Ada’s key in Louis’ message is legitimate–without meeting Ada!


    A message stating that a given person or organization has a given public key is
    called a digital certificate. A broadly trusted entity that creates and signs
    digital certificates is called a Certificate Authority (CA). Verisign is one of
    the best accredited CAs. In fact, most computers come out of the box with Verisign’s
    public key recorded alongside the operating system. If you get Verisign to sign
    a digital certificate with your public key, you can send both (certificate and
    key) through an insecure link to virtually anyone, and they will be able to verify
    its authenticity.


    Asymmetric ciphers are thousands of times more computationally demanding than
    symmetric ciphers. For this reason, it’s mostly used for people to validate each
    other’s public keys with digital certificates and to establish symmetric encryption
    keys with signed Diffie–Hellman messages. Next, let’s see how we can make signing
    and verifying long messages less computationally demanding.


    ## 3.4 Hashing


    In the first chapter, we discovered checksums: functions that take any input and
    produce a fixed-length output number. If a single bit of the input changes, the
    checksum computes a different output. With the aid of cryptography, special checksum
    functions can be crafted such that it’s infeasible to find an input for which
    the function computes a specific output. These special methods are called cryptographic
    hash functions, and an output of such a function is commonly called a hash.


    ![](image/03-09-h.jpg)


    Figure 3.9 Hashing a sample file. This hash function produces a binary number
    with 256 bits as output, represented in hexadecimal. It’s infeasible to find a
    different input that produces the same output.


    Hash functions are computationally inexpensive, and this can facilitate the implementation
    of digital signatures. Rather than performing the computationally expensive task
    of signing a large file, we can quickly run it through a hash function and sign
    the output. The signature is secure because potential attackers won’t be able
    to create another file that has the same hash. Today, almost every signature is
    calculated over a hash of the signed data. There are several other ways hash functions
    are used. Let’s explore some of them.


    ### Malicious Change Detection


    Simple checksums are used to detect whether accidental changes were made to a
    given chunk of data. However, they don’t help to catch malicious alterations made
    by experienced attackers: with some effort, they can forge data that has the same
    checksum as the original data.


    CELESTIAL SECURITY ![](image/c-luneta.jpg) Your laboratory’s supercomputer stores
    data from celestial observations. You suspect someone is changing your data late
    at night in order to sabotage your research. The files are large: you can’t make
    a private copy of every file. How can you ensure your data isn’t maliciously altered?


    The solution is straightforward: choose a hash function, and compute the hash
    of every file. Record all hashes in a pen drive that you take home. If you suspect
    the files have changed, calculate their hashes again. If they are the same as
    the ones in your pen drive, you can be certain not a single bit has been changed.
    That is, unless your adversary has managed break the security of the hash function
    you’re using. Later we’ll see what makes a hash function secure.


    ### Message Authentication Code

