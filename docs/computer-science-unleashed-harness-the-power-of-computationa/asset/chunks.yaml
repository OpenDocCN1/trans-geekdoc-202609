  trans: "\n\n光标的出现允许了一个可移动的指示器，用于指定 shell 与屏幕之间交互的位置。用户开始使用非打印字符来请求 shell 移动光标。至关重要的是，光标允许对之前打印的文本进行替换或删除，使得与计算机的交互变得更加高效。这引发了具有交互式文本界面的程序的开发。\n\
    \n视频显示器出现在 20 世纪 60 年代后期，第一台带有图形用户界面（GUI）的商业计算机出现在 1979 年。今天，几乎所有的笔记本电脑和手机手机都运行着操作\
    \ GUI 的 shell：我们使用鼠标、触控板和触摸屏与图标及窗口进行交互。\n\n![](img/02-03-h.jpg)\n\n图 2.3 “命令行”，感谢\
    \ [`commitstrip.com`](http://commitstrip.com)。\n\n尽管如此，许多 IT 专家继续通过 `CLI` 与计算机进行交互。这可能是出于需要（例如为了操作没有\
    \ GUI 的企业服务器），但也是出于喜好。许多极客只使用 GUI 来打开一个终端模拟器：这是一个挂钩 `CLI` shell 的应用程序，将你的屏幕和键盘转换为一台玻璃电字机。\n\
    \n终端模拟器是强大的接口。15 通过 `CLI`，人们可以执行几乎任何基于文本的任务，如组织文件夹、发送电子邮件、编写代码和编译。我们实际上是在终端模拟器上编写并编辑了这本书的！\n\
    \n![](img/02-04-h.jpg)\n\n图 2.4 在 Linux 终端模拟器上运行。\n\n### Telnet\n\n在 20 世纪 50\
    \ 年代和 60 年代的大部分时间，终端必须直接连线到计算机才能与其 shell 通信。然而，这种情况在 1969 年发生了变化，工程师设计了一种将终端连接到网络上任何计算机的方法。他们将其称为电字机网络，或\
    \ `telnet`。\n\n终端模拟器可以使用 `telnet` 通过互联网访问远端计算机。远端 shell 必须极其可靠，因为无序的字符可能会导致它执行可能具有破坏性的命令。因此，`telnet`\
    \ 的首选传输层协议是 `TCP` 而不是 `UDP`。\n\n当端口 `21` 上建立 `TCP` 连接时，`telnet` 服务器启动并发送来自连接的所有入站数据。shell\
    \ 的输出被发送到客户端。在客户端侧，用户输入的所有字符都会实时传输到服务器。当客户端接收到一个或多个字符时，它们会显示在他们的终端模拟器上。\n\n通常在建立\
    \ `telnet` 连接后，远端 shell 会要求用户名和密码。一旦登录，`telnet` 客户端就会直接与服务器交互。如果一台计算机运行着 `telnet`\
    \ 服务器，任何连接到互联网的计算机都可以作为该服务器的终端。16 极客可以操作另一个大陆的计算机，就好像他们坐在它面前使用屏幕和键盘一样！\n\n###\
    \ 邮件\n\n当时存在的少数计算机由许多用户共享。在那个时代，“邮件”程序已经很流行，但它们只允许用户给在同一台计算机上工作的同事留留言。这些程序简单地将文本追加到作为邮箱箱的文件中。每个用户都有一个邮箱箱文件。当用户登录计算机时，如果他们的邮箱中包含新消息，就会出现提醒。\n\
    \n在 20 世纪 70 年代，计算机网络不断增长，访问远端计算机文件的技术变为现实。邮件程序演变为向远程计算机的邮箱箱追加文本。这允许远端计算机的用户交换消息，就像他们在同一台机器上一样。随着时间的推移，程序员通过采用通用的消息格式提高了这些系统的效率，该格式所示：\n\
    \n```\nFrom: White at SRI-ARC\nDate: JUL 1973 15-PDT\nSubject: Multi-Site Meeting\
    \ Announcement\nNIC: 17996 at 10 AM Wednesday \n```\n\n消息以头部开始，头部载有有关消息的一般信息，例如发送者、接收者和主题。每个头部占一行，用冒号分隔头部名称和其值。在头部之后，一个空行表示消息正文的开始。这些消息被计算机极客广泛使用，他们开始将其称为\
    \ email（`e` 代表电子电子）。直到今天，我们交换的电子邮件仍然遵循这种格式！\n\n在 1973 年，上述电子邮件可以通过向 `SRI-ARC`\
    \ 计算机中的 `White` 邮箱箱追加一条新消息来回复。在当时，`TCP/IP` 和 `DNS` 并不存在，计算机是以这样的昵称称用的。后来，`at`\
    \ 符号被废弃，取而代之的是 `@`，因此示例中的邮箱箱将写作 `white@SRI-ARC`。作为背景信息，`SRI` 代表斯坦福研究院，是帮助创建和标准化这种消息格式的组织之一。\n\
    \n### 邮件服务器\n\n计算机逐渐变得廉价，到 20 世纪 80 年代，一个人在多台机器上工作并不罕见。然而，如果每个人在单一位置都有主邮箱地址，那么在大范围内通过电子邮件联系人们将变得更容易。许多用户组决定在同一台主机上监控他们的主邮箱，就像每个人仍然在单台计算机上工作一样。机构通过指定其中一台计算机作为邮件服务器来实现这一点。\n\
    \n大学生和技术工程师在所属机构的邮件服务器中都有账户，无论他们恰好在使用哪种计算机。每个人的主邮箱地址都会指向这台邮件服务器。通过不同的计算机，人们使用\
    \ `telnet` 登录邮件服务器，并读取存储在个人邮箱箱文件中的电子邮件。\n\n1985 年，`DNS` 推出，它极大地改进了电子邮件系统。组织开始采用域名并创建\
    \ `MX` 记录来公开宣布他们的邮件服务器。域名成为邮箱箱地址的标准方式。例如，`SRI` 邮件服务器中名为 `White` 的邮箱箱现在地址为 `white@sri.com`。\n\
    \n当给定此电子邮件地址时，任何人都可以 `DNS` 发现存储其邮箱箱文件的邮件服务器，并向该计算机发送 `IP` 数据包。然而，为了在他人的服务器中存储新消息，必须首先获得对其邮箱箱文件的访问权限。这非常繁琐，因此工程师们开始发明接收电子邮件的方法，而无需对接收服务器上的任何文件进行外部操作。\n\
    \n这就是电子邮件协议的兴起。正如 `NTP` 为程序交换时间提供框架，邮件协议允许程序交换电子邮件。各种协议被开发出来，很快每台邮件服务器都遵守其中一种。现在，电子邮件可以发送到\
    \ `IP` 数据包可以到达的几乎任何地方。\n\n"
- fmt: '

    And email spread like wildfire. Regular individuals flocked to the Internet in
    droves, sometimes solely in order to use email. One protocol stood out as the
    main enabler of this email revolution. Let’s now learn how to transfer messages
    between hosts and email servers following that protocol.


    # Simple Mail Transfer Protocol


    The most widely used email protocol is the `Simple Email Transfer Protocol` (`SMTP`).
    It defines the conversation rules between an email server and a client computer.
    As we’ll see, `SMTP` is more elaborate than request-response protocols such as
    `DNS` and `NTP`.


    First off, emails can contain messages that don’t fit in a single IP packet. When
    an email is carried by many IP packets, it is important for their payloads to
    be pieced back together in order. For this reason, `SMTP` runs on `TCP` rather
    than `UDP`.


    Mail servers expect incoming connections on `TCP` port `25`. When a connection
    is established, the server starts the conversation. It sends a message to identify
    itself:


    ```

    220 mail-server.example.com

    ```


    All messages sent by the server start with a three-digit number, called the return
    code. `SMTP` defines many different codes, each with their own meaning. Specifically,
    `220` communicates that the server is ready to receive instructions. After the
    code, the server states its own name. In response, the client should send a `HELO`
    command to identify itself:


    ```

    HELO client.code.energy

    ```


    At this point, the server decides if it wants to continue the conversation, based
    on who the client claims to be. Some mail servers use reverse `DNS` and compare
    the client’s self-reported name to the name that’s linked to its IP address. If
    the mail server decides to continue, it will send a `250` response code, which
    means that the action requested by the client was accepted:


    ```

    250 mail-server.example.com

    ```


    With this first exchange, both the client and the server acknowledged that they
    are about to transfer an email. They also both checked that they’re communicating
    with their intended counter-part. Next, the client is expected to give the return
    address of the email to be transmitted. If the server cannot deliver the client’s
    email, it will send another email to the return address informing it of the problem:


    ```

    MAIL FROM: <ada@code.energy>

    ```


    Again, the server has the option to accept or reject this. Some mail servers are
    configured to only accept certain email addresses. If the address is accepted,
    the server returns the `250` code:


    ```

    250 Ok

    ```


    Next, the client must inform the server of the destination mailbox:


    ```

    RCPT TO: <charles@example.com>

    ```


    Again, the server confirms whether it accepts this destination mailbox. If the
    server accepts to receive the message, it will use the same `250` return code,
    informing the client that it can go ahead:


    ```

    250 Ok

    ```


    The client can now send the `DATA` command. This command asks the server to begin
    the transmission of the email message:


    ```

    DATA

    ```


    The server confirms and instructs the client to signal the end of the transmission
    with a line containing only a dot. The `354` return code informs the client that
    the server will consider the next characters it receives as part of the email
    message:


    ```

    354 End data with <CR><LF>.<CR><LF>

    ```


    The client then transmits the email:


    ```

    From: <ada@code.energy>

    Date: Wed, 27 Nov 2002 15:30:00 -0500

    To: <charles@example.com>

    Subject: This is a test message


    This is the body of the email.

    .

    ```


    # Sending Emails


    Email was initially created as an open system in which anyone could participate
    without asking central authority. Its pioneers hoped all participants would act
    in good faith. Unfortunately, as soon as email became popular, this hope was lost.
    Nevertheless, engineers kept working to make email resilient without relinquishing
    its open nature.


    At first, engineers started keeping blacklists, which were frequently updated
    with names and IP addresses of email abusers. Administrators configured their
    servers to automatically reject connections from blacklisted users. This mitigated
    the problem, but didn’t fix it: abusers learned to use fresh IP addresses and
    domain names to send junk.


    To this day, the majority of bad emails come from connections provided by ISPs.
    Most organizations carefully guard and police their networks in order to protect
    their reputation. However, ISPs often service millions of users, and individually
    screening each one isn’t viable.


    Fortunately, it’s easy to check whether an IP address belongs to a well established
    organization or a home connection: you consult its reverse DNS record. ISPs don’t
    allow residential clients to set these records, but all credible mail servers
    will have proper reverse DNS for their IP addresses. So mail servers have started
    restricting home IP addresses, which drastically reduces email abuse.


    In order to implement this policy, `SMTP` has been upgraded to an extended version
    (`ESMTP`) with support for authentication via username and password. For all home
    users, `MAIL FROM` commands are only accepted after the user is authenticated
    through an `AUTH` command.


    This is how sending an email works today: you compose an email, and your computer
    uses `SMTP` to submit it to your mail server. Your mail server then connects to
    the mail server associated with the destination mailbox and uses `SMTP` to relay
    your email. Since your mail server’s IP address has a reverse DNS record, it can
    communicate to other mail servers without authentication.


    So email traffic is divided in two: users submitting messages to their own mail
    server and mail servers relaying messages to each other. Today, `TCP` port `587`
    is reserved for email submission, and port `25` is reserved for email relay. Home
    email users have stopped using `TCP` port `25`.


    Accordingly, most ISPs even drop home IP packets containing segments to port `25`,
    effectively blocking home Internet users from performing email relay. Mail servers
    expect incoming connections on two `TCP` ports:


    •  Port `25`, to receive emails from other mail servers,


    •  Port `587`, to receive emails from authenticated users.


    # Retrieving Emails

