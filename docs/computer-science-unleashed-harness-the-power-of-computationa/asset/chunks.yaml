    group digits after the decimal point in pairs to generate a stream of pseudorandom
    numbers between 0 and 99:


    ![](image/03-05-h.jpg)


    Figure 3.5 Vernam cipher running on a pseudorandom number generator. The shared
    secret between the parties is just the seed.[8](#CSU-2-10.xhtml#nota3-08)


    Today, stream ciphers generally use PRNGs that directly generate a stream of binary
    digits. The PRNG algorithm is the foundation and the defining element of a stream
    cipher. A stream cipher is only secure if its PRNG outputs pseudorandom numbers
    with no detectable patterns. Even if they knew which PRNG to use, it should be
    impossible for parties without the shared secret to distinguish the PRNG’s output
    from a sequence of truly random coin flips.


    To this day, we don’t know if an invulnerable PRNG exists. Vulnerabilities were
    found in many PRNGs proposed by experts in the past. Before picking a stream cipher,
    check which ones are vetted by experts, for which no vulnerabilities are known.[9](#CSU-2-10.xhtml#nota3-09)
    Designing a good PRNG is extremely challenging, so unless you want to become a
    cryptographer yourself, we recommend you stick to existing ones.


    NONCE Since keystreams have the same purpose as one-time pads, they should never
    be used more than once. A PRNG will always generate the same keystream when given
    the same seed, so a seed should never be reused. If the shared secret is directly
    used as the seed, communicating parties have to be able to agree on a new one
    before each communication. This can be impractical, therefore cryptographers devised
    a trick that allows us to reuse a shared secret. The trick uses a nonce: an arbitrary,
    single-use, non-secret number that is combined with the shared secret to generate
    a seed.


    ![](image/03-06-h.jpg)


    Figure 3.6 Stream ciphers typically require a shared secret (referred to as the
    key) and a nonce. Unlike the key, the nonce doesn’t need to be secret. If nonces
    are never reused, a key can be used to encrypt multiple plaintexts.


    Before you encrypt anything with a stream cipher, you have to pick a nonce. If
    you pick a random number, make sure it’s improbable that you will pick it again
    in the future. For example, you can generate a random 64-bit number: since there
    are more than a hundred million trillion different possibilities, the chance of
    picking the same nonce twice is almost zero.


    When transmitting a message encrypted with a stream cipher, send the nonce unencrypted,
    followed by the ciphertext. The receiver will combine the incoming nonce with
    the key, recreate the artificial one-time pad, and shift back the ciphertext to
    obtain the plaintext. Even if hackers intercept many ciphertexts and know each
    of their nonces, they will not be able to detect any patterns between them since
    they each were encrypted with their own keystream!


    KEY SELECTION An attacker that intercepts your ciphertext can try to break it
    by brute-force: trying all possible keys until an intelligible plaintext is found.
    Be pessimistic: assume your attacker knows which cipher you’re using and has multiple
    times the entire computing power of the world. If you select a long and random
    encryption key, you insure yourself against any possible brute-force attack. For
    instance, a 120-bit random key leaves a powerful attacker no chance of brute-forcing
    your ciphertexts.[10](#CSU-2-10.xhtml#nota3-10)


    MALLEABILITY ATTACK Suppose Ada sends an encrypted message to her bank, requesting
    a $100 transfer to Andrew’s account. Suppose the message follows a standard format,
    where bits 5 to 9 encode the destination account number. Suppose Charles knows
    all that, and is in charge of transmitting the encrypted message from Ada to the
    bank. If Charles knows that Andrew’s bank account number is 1001, he can change
    Ada’s message so that the deposit goes to his own account number, 11100:


    ![](image/i-03-07-h.jpg)


    If an attacker can forge parts of the ciphertext only by knowing corresponding
    parts of the plaintext, we say that the cipher is malleable. We can devise ciphers
    that aren’t malleable, as we’ll see next.


    Block Ciphers


    With stream ciphers, there’s always a clear relation between plaintext and ciphertext:
    if you flip the tenth bit of the plaintext (changing it to 1 if it’s a 0 and to
    a 0 if it’s a 1), it will cause the tenth bit of the ciphertext to flip. Having
    this relationship is not ideal. In fact, the malleability of stream ciphers is
    a consequence of this. A cipher is more secure if it produces no obvious relationship
    between ciphertext and plaintext.


    Recall the legacy product cipher that combined the zigzag and simple substitution
    ciphers. It was stronger because the zigzag shuffling diffused the relationship
    between ciphertext and plaintext. But the zigzag cipher doesn’t do enough: ideally,
    the link between plaintext and ciphertext should be so diffused that changing
    a single bit of the plaintext would cause the entire ciphertext to change.


    With stream ciphers, changing a single bit of the key leads to a completely different
    ciphertext. Since the Second World War, cryptographers have been developing ciphers
    for which changing one bit of either the key or the plaintext transformed the
    ciphertext entirely.'
