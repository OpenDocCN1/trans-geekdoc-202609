    电子邮件像野火一样蔓延。普通人成群结队地涌入互联网，有时仅仅是为了使用电子邮件。有一种协议脱成为这场电子邮件革命的主要推动者。现在，让我们学习如何遵循该协议在主机和邮件服务器之间传输消息。


    # 简单邮件传输协议 (Simple Mail Transfer Protocol)


    最广泛使用的电子邮件协议是`简单邮件传输协议`（`SMTP`）。它定义了邮件服务器与客户端计算机之间的对话规则。正如我们将看到的，`SMTP` 比 `DNS`
    和 `NTP` 等请求-响应型协议更为复杂。


    首先，电子邮件可能包含无法由单个 IP 数据包容纳的消息。当一封邮件由多个 IP 数据包承载时，确保有效负载按顺序重新组合至关重要。出于这个原因，`SMTP`
    运行在 `TCP` 而不是 `UDP` 上。邮件服务器在 `TCP` 端口 `25` 上等待接入连接。当连接建立时，服务器开始对话。它发送一条消息来标识自己的身份：


    ```

    220 mail-server.example.com

    ```


    服务器发送的所有消息都以三位数字开头，称为返回码。`SMTP` 定义了许多不同的代码，每种代码都有自己的含义。具体来说，`220` 表示服务器已准备好接收指令。在代码之后，服务器声明自己的名称。作为响应，客户端应该发送
    `HELO` 命令来标识自己的身份：


    ```

    HELO client.code.energy

    ```


    此时，服务器将根据客户端声称的身份来决定是否继续对话。某些邮件服务器使用反向 `DNS`，并将客户端自报的名称与与其 IP 地址关联的名称进行比较。如果邮件服务器决定继续，它将发送
    `250` 响应码，这意味着客户端请求的操作已被接受：


    ```

    250 mail-server.example.com

    ```


    通过这次第一次交换，客户端和服务器都确认了它们正准备传输一封电子邮件。它们也检查了自己正在与预期的对方进行通信。接下来，预计客户端将提供要传输的邮件地址。如果服务器无法投递客户端的邮件，它将向退信地址发送另一封邮件以告知该问题：


    ```

    MAIL FROM: <ada@code.energy>

    ```


    同样，服务器可以选择接受或拒绝此操作。某些邮件服务器被配置为仅接受某些特定的电子邮件地址。如果地址被接受，服务器返回 `250` 代码：


    ```

    250 Ok

    ```


    接下来，客户端必须通知服务器目标邮箱箱：


    ```

    RCPT TO: <charles@example.com>

    ```


    同样，服务器会确认它是否接受此目标邮箱箱。如果服务器接受接收该消息，它将使用相同的 `250` 返回码，告知客户端可以继续：


    ```

    250 Ok

    ```


    客户端现在可以发送 `DATA` 命令。该命令请求服务器开始传输邮件消息：


    ```

    DATA

    ```


    服务器确认，并指示客户端使用一个仅包含一个点的行来标记传输的结束。`354` 返回码告知客户端，服务器将把后续收到的所有字符视为邮件消息的一部分：


    ```

    354 End data with <CR><LF>.<CR><LF>

    ```


    随后，客户端传输电子邮件：


    ```

    From: <ada@code.energy>

    Date: Wed, 27 Nov 2002 15:30:00 -0500

    To: <charles@example.com>

    Subject: This is a test message


    This is the body of the email.

    .

    ```


    # 发送电子邮件


    电子邮件最初被创建为一个开放系统，任何人都可以无需请求中央机构即可参与其中。它的先驱们希望所有参与者都能诚实守。不幸的是，一旦电子邮件流行，这种希望就破灭了。尽管如此，工程师们继续工作，在不放弃其开放性的情况下增强电子邮件的弹性。


    起初，工程师开始维护黑名单，频繁更新邮件滥用者的名称和 IP 地址。管理员配置服务器自动拒绝来自黑名单用户的连接。这缓解了问题，但并没有解决它：滥用者学会了使用新的
    IP 地址和域名来发送垃圾邮件。


    直到今天，大多数垃圾邮件仍来自 ISP 提供的连接。大多数组织仔细地维护并监管其网络以保护其声誉。然而， ISP 服务于数百万用户，对每位用户进行单独筛选是不可行的。


    幸运的是，检查 IP 地址是属于良好的机构还是家庭连接是简单的：你可以查询其反向 DNS 记录。ISP 不允许住宅客户端设置这些记录，但所有可靠的邮件服务器都会为其
    IP 地址配置正确的反向 DNS。因此，邮件服务器已开始限制家庭 IP 地址，这极大减少了邮件滥用。


    为了实施这一政策，`SMTP` 已升级为扩展版本（`ESMTP`），支持通过用户名和密码进行验证。对于所有家庭用户，只有在通过 `AUTH` 命令验证后，`MAIL
    FROM` 命令才会被接受。这就是今天发送电子邮件的工作：你编写一封邮件，你的电脑使用 `SMTP` 将提交给你的邮件服务器。然后，你的邮件服务器连接到与目标邮箱关联的邮件服务器，并使用
    `SMTP` 中继你的邮件。由于你的邮件服务器 IP 地址具有反向 DNS 记录，它可以无需验证即可与其他邮件服务器通信。

