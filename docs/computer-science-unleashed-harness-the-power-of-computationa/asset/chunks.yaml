    This matches “yeh”, “yeah”, “yeaah”, “yeaaah”, and so on. A dot and a star (`.\*`)
    will match anything: it will accept any character, any number of times. If you
    think your input contains the word “restaurant”, some random text, and then the
    word “London”, you can try to find:


    `restaurant.\*London`


    The `.\*` will take care of any text between the two words. You can also use this
    trick to match any quote:


    `".\*"`


    ### Greediness


    The last regular expression (`".\*") has a problem. Test it with the following
    input:


    `Avaritia porro "hominem" ad quod "vis maleficium" impellit.`


    Quantifiers are greedy: they try to consume as many characters as possible. The
    dot and the star will run from the first quotation mark of our input to the last,
    returning:


    `"hominem" ad quod "vis maleficium"`


    To match only "hominem", replace the dot with a negated set:


    `"[^"]*"`


    ### Anchors


    So far, our regular expressions could match characters and phrases anywhere in
    the input. Anchors control exactly where matches are allowed. Anchors don’t consume
    characters, rather they restrict the possible positions for matches.


    #### Caret


    When used outside brackets, the caret (`^`) restricts matches to the start of
    a line. Consider the following expression:


    `^Once upon time`


    It will only match the start of a line that introduces a fairy tale. Many coders
    use a sequence of dashes (`----`) to create horizontal separators in plain text.
    We can find them with this expression:


    `^\-+`


    It matches a sequence of dashes, but only if it starts a line.


    #### Dollar


    The dollar (`$`) anchors the match to the end of a line. Take the following expression:


    `happily after.$`


    It will only match a line that finishes with a happy ending. You can use both
    anchors in the same expression:


    `^Once upon time.*happily after.$`


    We can update our expression that finds separators made of dashes to match lines
    that only contain dashes:


    `^\+$`


    In most programming languages, ending a line with a space is frowned upon, as
    it serves no purpose. How can you find "trailing spaces"?


    Finding spaces is simple—we match one or more space at the end of a line:


    `+$`


    #### Multiline Flag


    In some flavors, the caret (`^`) and dollar (`$`) refer to the beginning and end
    of the entire input: they ignore line breaks. To change this behavior, the multiline
    flag, typically denoted `m`. It will force carets and dollars to recognize new
    line.


    #### Boundary


    Some words are embedded in others. For instance, searching for `fun` will match
    characters within “funeral”, and searching for `rude` will also find “prudent”.
    These are called words. Take the following search:


    `\bart`


    What if we’re just looking for the word “art”? The boundary anchor (`\b`) solves
    this by restricting matches to the start or end of a word:


    `\bbart\b`


    `\bbart\b`


    `\bbarts?\b`


    In the last expression, the plural form is also accepted an accepted word. If
    we’re only interested in words that start with `a` and end with `s`, then:


    `\ba[a-z]+s\b`


    `\ba[a-z]+s\b`


    `\ba[a-z]+s\b`


    Don’t let groups confuse you. Anchor your expressions.


    ### Groups


    As yet, we have only seen quantifiers work on a single preceding character. Groups
    allow quantifiers to work on a sequence of characters, or even on an entire expression.
    They are created using parenthesis: `(...)`. For example:


    `(meta-)*`


    The part of the expression can match zero to infinite times finds “analysis”,
    “meta-analysis”, “meta-meta-analysis”, and so on.


    #### Big Numbers


    You need to find big numbers in a long report. Commas separate thousands, and
    some numbers have fractional digits. How to retrieve all the numbers? We could
    be lazy and try:


    `\b[0-9]+\b`


    However, this would also match other things, such as “10.12.185”. To retrieve
    numbers that use dots and commas correctly, we can use groups with quantifiers:


    `\b\d{1,3}(,\d{3})*(\.\d+)?\b`


    Let’s parse that expression from left to right:


    `\b`


    The match must start at a word boundary.


    `\d{1,3}`


    Maximum three leftmost digits.


    `(,\d{3})*`


    Optionally, a comma followed by three digits.


    `(\.\d+)?`


    Optionally, a dot followed by at least one digit.


    `\b`


    The match must end at a boundary.


    #### Capturing Groups


    Groups are also called capturing groups: the regular expression engine keeps the
    text they matched as internal variables. These variables are often used to create
    elaborate find-and-replace schemes.


    #### Quirky Quotes


    A French translator handed you a text that includes quotes made with straight
    quotation marks "like this". He asks you to replace them with French guillemets,
    for the quotes to look « like ». You can’t directly find-and-replace the `"` character.
    It has to become either a `«` or a `»` character, depending on its position. If
    we add a group to our regular expression that finds quotation marks, the text
    inside the quotation mark is stored in an internal variable, called `\1`. We can
    tell the regular expression engine to replace the matched string with a new text
    that makes use of this variable:


    Find:


    `"([^"]*)"`


    Replace:


    `« \1 »`


    If the regular expression has multiple groups, more capture variables are created.
    To reformat US telephone numbers separated with spaces using parenthesis and hyphens,
    you can do this:


    Find:


    `(\d{3}) (\d{3}) (\d{4})`


    Replace:


    `(\1) \2-\3`


    Here, `\1` stores the text that was matched inside the first group, `\2` stores
    the text from the second group, and so on. Whenever you need to do a find-and-replace
    operation that’s not static, remember to use groups!

