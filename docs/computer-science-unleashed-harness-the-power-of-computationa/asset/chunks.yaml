    In this chapter, we learned how to concisely search for elaborate patterns. We’ve
    observed how regular expressions are built from a combination of characters, some
    representing themselves, some representing special functions. You should use these
    tools when:


    • You must validate that an input matches an expected format (e.g. phone number,
    date, IP address, credit card number),

    • You don’t know the exact sequence of characters you’re looking for, but you
    know how it should appear,

    • You must perform complicated find-and-replace operations.


    If you’re working on a generic pattern, such as an `IP address` or a phone number,
    you can find ready-to-use regular expressions online. There are many regular expression
    libraries and cookbooks that will help you find common patterns.


    When designing your own expression, start with something simple that broadly matches
    what you search and from there, refine your expression to be more and more specific.


    Nearly all programming languages and tools support regular expressions, but be
    careful: there are many subtle variations across flavors. Some will interpret
    parentheses as literal characters, and thus require you to type `\\(•••\\)` instead
    of `(•••)` to create a group. Some older engines lack support for certain anchors,
    such as the word boundary. And how do we go about matching Japanese characters?
    The conceptual understanding you gained from this chapter will help you navigate
    reference material and online resources on regular expressions to find answers.


    Install a regular expression extension on your browser now, so you can test it
    on web pages. Additionally, find how to use regular expressions in your source
    code editor. To write this book, we used one called `Vim`, that carries out all
    searches through regular expressions. If there is a way to make regular expressions
    the default search mode of your editor, do it—that will force you to practice
    them and you will save time in the long run.


    ![](image/07-03-v.jpg)


    Figure 7.3 “Regular Expressions”, courtesy of [http://xkcd.com](http://xkcd.com).


    Even if you’re not involved in a hasty crime investigation (fig. 7.3), having
    quick access to specific information is essential to work efficiently. The better
    you are with regular expressions, the faster you can retrieve the data you need,
    learn them and save hours of valuable coding time.


    ### Reference


    • Mastering Regular Expressions, by Friedl

    – Get it at [https://code.energy/friedl](https://code.energy/friedl)


    • Regular Expressions Cookbook, by Goyvaerts and Levithan

    – Get it at [https://code.energy/goyvaerts](https://code.energy/goyvaerts)


    [1](#CSU-2-14.xhtml#nt-7-1) The way to set flags varies across flavors. Flags
    are sometimes appended after a forward slash, for instance District 1, Paris/i.


    [2](#CSU-2-14.xhtml#nt-7-2) In hex, a single digit is a value from 0 to 15. Since
    we ran out of Hindu-Arabic numerals, the letters `a-f` are used as numerals for
    vales 10 to 15. For more about hexadecimal digits, see the Appendix I.


    [3](#CSU-2-14.xhtml#nt-7-3) The symbol `#` followed by three pairs of hex digits
    is a common way to encode colors. Each pair indicates the amount of red, green,
    or blue light it is made of. For instance, `#FF0000` indicates maximum red light,
    but no green or blue lights. Googling such a string will immediately return you
    the corresponding color!


    [4](#CSU-2-14.xhtml#nt-7-4) Notably, `\w` includes the underscore. The underscore
    is allowed in source code variable names, so programmers can have variables like
    `beer_count`. Adding the underscore to `\w` makes it easier to match variable
    names in source files.


    [5](#CSU-2-14.xhtml#nt-7-5) These guys: `. ? \* + ^ $ | \[ \] { } ( ) \\.`


    [6](#CSU-2-14.xhtml#nt-7-6) Recall from Chapter 3 that `https` is used in a URL
    instead of `http` to indicate it should be accessed using `SSL` encryption.


    [7](#CSU-2-14.xhtml#nt-7-7) This expression would match Japanese characters? The
    conceptual understanding you gained from this chapter will help you navigate reference
    material and online resources on regular expressions to find answers.


    [8](#CSU-2-14.xhtml#nt-7-8) This expression would match Japanese characters? The
    conceptual understanding you gained from this chapter will help you navigate reference
    material and online resources on regular expressions to find answers.


    [9](#CSU-2-14.xhtml#nt-7-9) This expression would match Japanese characters? The
    conceptual understanding you gained from this chapter will help you navigate reference
    material and online resources on regular expressions to find answers.


    [10](#CSU-2-14.xhtml#nt-7-10) This expression would match Japanese characters?
    The conceptual understanding you gained from this chapter will help you navigate
    reference material and online resources on regular expressions to find answers.


    [11](#CSU-2-14.xhtml#nt-7-11) This expression would match Japanese characters?
    The conceptual understanding you gained from this chapter will help you navigate
    reference material and online resources on regular expressions to find answers.


    ### Numerical Bases


    Computing can be reduced to numbers. Colors indicate the amount of red, green,
    or blue light it is made of. Each pair indicates the amount of red, green, or
    blue light it is made of. For instance, `#FF0000` indicates maximum red light,
    but no green or blue lights. Googling such a string will immediately return you
    the corresponding color!


    In hex, a single digit is a value from 0 to 15. Since we ran out of Hindu-Arabic
    numerals, the letters `a-f` are used as numerals for vales 10 to 15. For more
    about hexadecimal digits, see the Appendix I.


    ### Appendix


    Notably, `\w` includes the underscore. The underscore is allowed in source code
    variable names, so programmers can have variables like `beer_count`. Adding the
    underscore to `\w` makes it easier to match variable names in source files.


    These guys: `. ? \* + ^ $ | \[ \] { } ( ) \\.`


    Recall from Chapter 3 that `https` is used in a URL instead of `http` to indicate
    it should be accessed using `SSL` encryption.

