- fmt: "\nIt’s possible to create intricate systems that can be operated from web\
    \ browsers. A prime example are webmail systems such as `Hotmail` and `Gmail`.\
    \ These websites allow people to use email through their browser. The web server\
    \ is tasked with talking to mail servers, allowing users to send emails without\
    \ directly establishing any `SMTP` connections from a web client.\n\nTo facilitate\
    \ this, HTML pages can include JavaScript code. We can then program web pages\
    \ with the same capabilities as other graphic applications! Increasingly, web\
    \ pages are evolving from plain hypertext documents to full-fledged apps.\n\n\
    ## Conclusion\n\nWe learned about some of the most notable Internet applications\
    \ and their protocols, but there are many more we haven’t explored. For instance,\
    \ we’ve seen in Chapter 1 that routers must regularly exchange connectivity information.\
    \ To that end, they run applications that communicate using the Border Gateway\
    \ Protocol (`BGP`) on `TCP` port `179`. If you want learn about `BGP` and other\
    \ interesting protocols in depth, check the references at the end.\n\n## Port\
    \ Numbers\n\nWe’ve seen how each protocol is associated to a specific `TCP` or\
    \ `UDP` port number. Applications that utilize the same protocol almost always\
    \ expect connections on the same port number. For example, you don’t need to know\
    \ which port number to use in order to retrieve a web page from a host–web servers\
    \ expect connections on `TCP` port `80`. `IANA` is the organization that decides\
    \ which port number is standard for each protocol. When a new protocol is created,\
    \ its developers send `IANA` an application to reserve a port number.[23](#CSU-2-9.xhtml#nota2-23)\n\
    \nRather than developing a new protocol and applying for a port number, many Internet\
    \ application developers piggyback on existing generic protocols for communication.\
    \ For example, many applications are made accessible over the Internet by integration\
    \ with a web server. In such cases, `HTTP` is used to transfer raw data (rather\
    \ than web pages) to and from the applications (rather than web browsers).\n\n\
    ## Peer-to-Peer\n\nIn this chapter, we have only explored application layer protocols\
    \ that follow a client-server architecture. However, there is an alternative architecture\
    \ called Peer-to-Peer (`P2P`), where each application acts both as server and\
    \ client. Notable examples of `P2P` protocols include `BitTorrent`, the file-sharing\
    \ protocol, as well as `Bitcoin` and `Ethereum`, the two largest cryptocurrency\
    \ networks.\n\nPeer-to-Peer services eliminate intermediaries between users and\
    \ have no central point of failure. `BitTorrent`, `Bitcoin` and `Ethereum` cannot\
    \ be shut down. The United States military uses `P2P` technology extensively for\
    \ troops to operate without central coordination and without relying on centralized\
    \ infrastructure such as cellphone towers.\n\n## Security\n\nOne other important\
    \ aspect of the Internet that we haven’t addressed is its lack of security. Whoever\
    \ is operating a router can read and modify data from any packet that reaches\
    \ it. We’ve seen that `IP` packets are handled by many unknown routers as they\
    \ travel through the Internet. Therefore, we must consider all data traveling\
    \ on board `IP` packets as potentially public information, and we can’t completely\
    \ trust that data received over the Internet hasn’t been changed on the way. To\
    \ mitigate this flaw, application layer protocols often include encryption schemes\
    \ so the data can’t be read or inconspicuously tampered with by intermediaries.\
    \ In the next chapter, we’ll see how it works.\n\n## Reference\n\n- `Computer\
    \ Networking: A Top-Down Approach`, by Kurose\n  – Get it at `http://code.energy/kurose`\n\
    - `Computer Networks`, by Tanembaum\n  – Get it at `http://code.energy/tanenbaum`\n\
    \n[1](#CSU-2-9.xhtml#nt-2-1) See for yourself, visit the website `http://[2a03:2880:f003:c07:face:b00c::2]`(http://%5B2a03:2880:f003:c07:face:b00c::2%5D).\n\
    [2](#CSU-2-9.xhtml#nt-2-2) You can find the list of TLDs at `http://code.energy/tlds`(http://code.energy/tlds).\n\
    [3](#CSU-2-9.xhtml#nt-2-3) Visit the website `http://about.google`(http://about.google)\
    \ to see for yourself.\n[4](#CSU-2-9.xhtml#nt-2-4) `ICANN` controls `IANA`, the\
    \ organization that allocates `IP` address prefixes.\n[5](#CSU-2-9.xhtml#nt-2-5)\
    \ The TLDs are assigned following `ISO 3166-1 alpha-2` country codes, with a few\
    \ exceptions such as the United Kingdom. Their country code is `GB` but they were\
    \ given the `uk` domain.\n[6](#CSU-2-9.xhtml#nt-2-6) Notice the `sprint.net.`\
    \ domain. In official records, all domains end with a dot. In everyday use, the\
    \ final dot is most often omitted for convenience.\n[7](#CSU-2-9.xhtml#nt-2-7)\
    \ The `dig` program comes pre-installed on `Linux` and `MacOS` terminal emulators.\
    \ If you don’t have access to a command-line interface, use `http://code.energy/dig`(http://code.energy/dig).\
    \ If you don’t know what the command line is, don’t worry! We will learn more\
    \ about it later in this chapter.\n[8](#CSU-2-9.xhtml#nt-2-8) Do it!\n[9](#CSU-2-9.xhtml#nt-2-9)\
    \ As `2020`, `ICANN` charges `$0.18` per year.\n[10](#CSU-2-9.xhtml#nt-2-10) `WHOIS`\
    \ here: `http://code.energy/whois`(http://code.energy/whois).\n[11](#CSU-2-9.xhtml#nt-2-11)\
    \ Sundials indicate the time when they’re exposed to sunlight.\n[12](#CSU-2-9.xhtml#nt-2-12)\
    \ `<CR><LF>`\n[13](#CSU-2-9.xhtml#nt-2-13) ...atomic physics.\n[14](#CSU-2-9.xhtml#nt-2-14)\
    \ English-speaking countries originally proposed `CUT`, while French speaking\
    \ countries preferred `TUC`, for `temps universel coordonné`.\n[15](#CSU-2-9.xhtml#nt-2-15)\
    \ ... on a terminal: `http://code.energy/terminal-movie`(http://code.energy/terminal-movie).\n\
    [16](#CSU-2-9.xhtml#nt-2-16) `telnet` is considered unsafe. Nowadays, we use a\
    \ similar protocol called `Secure Shell` (`SSH`).\n[17](#CSU-2-9.xhtml#nt-2-17)\
    \ ... waits for a response.\n[18](#CSU-2-9.xhtml#nt-2-18) ... elsewhere in the\
    \ URL.\n[19](#CSU-2-9.xhtml#nt-2-19) `SMTP` was designed to be dependable.\n[20](#CSU-2-9.xhtml#nt-2-20)\
    \ `Cascading Style Sheets` (`CSS`).\n[21](#CSU-2-9.xhtml#nt-2-21) `HTTP/2`\n[22](#CSU-2-9.xhtml#nt-2-22)\
    \ `+`, `%`, `?`, `\\=` and `&`.\n"
  raw: 'It’s possible to create intricate systems that can be operated from web browsers.
    A prime example are webmail systems such as Hotmail and Gmail. These websites
    allow people to use email through their browser. The web server is tasked with
    talking to mail servers, allowing users to send emails without directly establishing
    any SMTP connections from a web client.


    To facilitate this, HTML pages can include JavaScript code. We can then program
    web pages with the same capabilities as other graphic applications! Increasingly,
    web pages are evolving from plain hypertext documents to full-fledged apps.


    Conclusion


    We learned about some of the most notable Internet applications and their protocols,
    but there are many more we haven’t explored. For instance, we’ve seen in Chapter
    1 that routers must regularly exchange connectivity information. To that end,
    they run applications that communicate using the Border Gateway Protocol (BGP)
    on TCP port 179. If you want learn about BGP and other interesting protocols in
    depth, check the references at the end.


    Port Numbers


    We’ve seen how each protocol is associated to a specific TCP or UDP port number.
    Applications that utilize the same protocol almost always expect connections on
    the same port number. For example, you don’t need to know which port number to
    use in order to retrieve a web page from a host–web servers expect connections
    on TCP port 80. IANA is the organization that decides which port number is standard
    for each protocol. When a new protocol is created, its developers send IANA an
    application to reserve a port number.[23](#CSU-2-9.xhtml#nota2-23)


    Rather than developing a new protocol and applying for a port number, many Internet
    application developers piggyback on existing generic protocols for communication.
    For example, many applications are made accessible over the Internet by integration
    with a web server. In such cases, HTTP is used to transfer raw data (rather than
    web pages) to and from the applications (rather than web browsers).


    Peer-to-Peer


    In this chapter, we have only explored application layer protocols that follow
    a client-server architecture. However, there is an alternative architecture called
    Peer-to\-Peer (P2P), where each application acts both as server and client. Notable
    examples of P2P protocols include BitTorrent, the file-sharing protocol, as well
    as Bitcoin and Ethereum, the two largest cryptocurrency networks.


    Peer-to-Peer services eliminate intermediaries between users and have no central
    point of failure. BitTorrent, Bitcoin and Ethereum cannot be shut down. The United
    States military uses P2P technology extensively for troops to operate without
    central coordination and without relying on centralized infrastructure such as
    cellphone towers.


    Security


    One other important aspect of the Internet that we haven’t addressed is its lack
    of security. Whoever is operating a router can read and modify data from any packet
    that reaches it. We’ve seen that IP packets are handled by many unknown routers
    as they travel through the Internet. Therefore, we must consider all data traveling
    on board IP packets as potentially public information, and we can’t completely
    trust that data received over the Internet hasn’t been changed on the way. To
    mitigate this flaw, application layer protocols often include encryption schemes
    so the data can’t be read or inconspicuously tampered with by intermediaries.
    In the next chapter, we’ll see how it works.


    Reference


    • Computer Networking: A Top-Down Approach, by Kurose


    – Get it at [http://code.energy/kurose](http://code.energy/kurose)


    • Computer Networks, by Tanembaum


    – Get it at [http://code.energy/tanenbaum](http://code.energy/tanenbaum)


    [1](#CSU-2-9.xhtml#nt-2-1)  See for yourself, visit the website [http://\[2a03:2880:f003:c07:face:b00c::2\]](http://%5B2a03:2880:f003:c07:face:b00c::2%5D).


    [2](#CSU-2-9.xhtml#nt-2-2)  You can find the list of TLDs at [http://code.energy/tlds](http://code.energy/tlds).


    [3](#CSU-2-9.xhtml#nt-2-3)  Visit the website [http://about.google](http://about.google)
    to see for yourself.


    [4](#CSU-2-9.xhtml#nt-2-4)  ICANN controls IANA, the organization that allocates
    IP address prefixes.


    [5](#CSU-2-9.xhtml#nt-2-5)  The TLDs are assigned following ISO 3166-1 alpha-2
    country codes, with a few exceptions such as the United Kingdom. Their country
    code is GB but they were given the uk domain.


    [6](#CSU-2-9.xhtml#nt-2-6)  Notice the sprint.net. domain. In official records,
    all domains end with a dot. In everyday use, the final dot is most often omitted
    for convenience.


    [7](#CSU-2-9.xhtml#nt-2-7)  The dig program comes pre-installed on Linux and MacOS
    terminal emulators. If you don’t have access to a command-line interface, use
    [http://code.energy/dig](http://code.energy/dig). If you don’t know what the command
    line is, don’t worry! We will learn more about it later in this chapter.


    [8](#CSU-2-9.xhtml#nt-2-8)  Do it!


    [9](#CSU-2-9.xhtml#nt-2-9)  As of 2020, ICANN charges $0.18 per year and per domain.


    [10](#CSU-2-9.xhtml#nt-2-10)  If you don’t have access to a command-line interface,
    consult WHOIS here: [http://code.energy/whois](http://code.energy/whois).


    [11](#CSU-2-9.xhtml#nt-2-11)  Sundials indicate the time when they’re exposed
    to sunlight by casting a shadow on a marked surface. Water clocks track elapsed
    time from the gradual flow of water from one container to another.


    [12](#CSU-2-9.xhtml#nt-2-12)  Mechanical clocks typically store energy with a
    weight or spring, and have a clever mechanism that lets the energy escape at constant
    time intervals.


    [13](#CSU-2-9.xhtml#nt-2-13)  Quartz clocks use clever electronics and a special
    crystal to create vibrations at a precise and predetermined frequency. Atomic
    clocks are similar to quartz clocks, but they continuously sync the vibrations
    to atomic physics phenomena.


    [14](#CSU-2-9.xhtml#nt-2-14)  English-speaking countries originally proposed the
    acronym CUT, while French speaking countries preferred TUC, for temps universel
    coordonné. The internationally recognized UTC is a compromise between the two.


    [15](#CSU-2-9.xhtml#nt-2-15)  Some passionate nerds showcased this by allowing
    you to watch Star Wars on a terminal: [http://code.energy/terminal-movie](http://code.energy/terminal-movie).


    [16](#CSU-2-9.xhtml#nt-2-16)  Broad exposition to the Internet causes security
    risks and telnet is considered unsafe. Nowadays, we use a similar protocol called
    Secure Shell (SSH). The end user experience feels almost exactly like telnet,
    but it uses cryptography to deter hacking attacks. We explain it in the next chapter,
    so hang in there!


    [17](#CSU-2-9.xhtml#nt-2-17)  Request-response protocols are exactly what they
    sound like: a client sends a request to a server and then waits for a response.


    [18](#CSU-2-9.xhtml#nt-2-18)  The non-printing characters <CR><LF> are a carriage
    return, followed by a line feed. This combination marks the end of a line.


    [19](#CSU-2-9.xhtml#nt-2-19)  SMTP was designed to be dependable, so mail servers
    won’t drop an accepted email without notice. A rejected message is called a bounce
    because its content is returned to the sender.


    [20](#CSU-2-9.xhtml#nt-2-20)  Another language, called Cascading Style Sheets
    (CSS), was later created to customize most aspects of how an HTML document and
    its structure are presented: fonts, layout, colors, etc.


    [21](#CSU-2-9.xhtml#nt-2-21)  HTTP/2 is the latest version of the protocol. It
    added several performance improvements, but it didn’t change the general structure
    of the communicated information.


    [22](#CSU-2-9.xhtml#nt-2-22)  In query strings, the space can either be encoded
    %20 or simply with a plus sign +. This does not work, however, elsewhere in the
    URL. Characters that have special functions (such as +, % ?, \= and &) must also
    be encoded for those functions to be bypassed.'
