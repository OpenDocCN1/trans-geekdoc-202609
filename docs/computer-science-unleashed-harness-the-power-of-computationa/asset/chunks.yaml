    IV      Evaluating Classifiers


    In Chapter 5, we learned about prediction models: algorithms that can make a series
    of predictions, which we call y, given data related to each prediction, which
    we call X. There are two types of models. Regressors make numerical predictions,
    while classifiers predict an outcome that’s divided into labeled groups. We already
    learned to score how well a regressor is making its predictions. Let’s now learn
    how to score classifiers as well.


    Since classifiers predict labels, let’s start simple: suppose y is made of binary
    data. Since it has only two labels, all we need is a yes or no answer for each
    row. We call this binary classification. Predicting if a patient will develop
    diabetes or if a credit card purchase is fraudulent are examples of binary classification.


    A natural, naive approach is to evaluate the percentage of correct predictions,
    called the accuracy. However, this is often a terrible way to assess how well
    a model is doing. Let’s see how it fares:


    FINDING FRAUD ![](image/c-cartaocredito.jpg) You’re the techie of a bank trying
    to prevent credit card fraud. They asked you to create a model that predicts if
    a payment is fraudulent based on transaction details. You trained two models—a
    chilled model ![](image/c-oculosescuros.jpg) and a paranoid model ![](image/c-terror.jpg)—to
    predict fraud on existing data of 1,000 transactions, of which 10 are known cases
    of fraud. You now wish to compare their performance to an untrained lazy model
    ![](image/c-sono.jpg) that randomly calls 1% of transactions fraudulent. Here
    is how each of the three models performed:


    ![](image/c-sono.jpg) Found no fraud, incorrectly called 10,


    ![](image/c-oculosescuros.jpg) Found 8 frauds, incorrectly called 19 more,


    ![](image/c-terror.jpg) Found all frauds, incorrectly called 87 more.


    Which model is most accurate?


    The paranoid model missed no frauds, therefore it made 0+87=87 mistakes and 913
    correct predictions, yielding an accuracy of 91.3%. The chilled model missed 2
    frauds, therefore it made 2+19=21 mistakes and 979 correct predictions, yielding
    an accuracy of 97.9%. On the other hand, the lazy model missed the 10 frauds,
    therefore it made 10+10=20 mistakes and 980 correct predictions, yielding an accuracy
    of 98%. The lazy model is the most accurate, even though it’s useless!


    To better evaluate classifiers, we must see how they make right and wrong predictions.
    To this end, we build a confusion table that counts correct and incorrect predictions
    for each label:


    ![](image/08-02-h.jpg)


    Figure 8.2 Confusion tables for the lazy, chilled, and paranoid classifiers. A
    unicorn ![](image/c-unicornio.jpg) classifier with 100% accuracy is shown for
    reference.


    A prediction is incorrect when the predicted label and the true label differ,
    as shown in red in fig. 8.2. Notice how the previously mentioned accuracies can
    be obtained for each table by dividing the sum of black cells by 1,000. Let’s
    now see which other metrics we can use to make sense of the confusion tables.


    SENSITIVITY The percentage of fraud that a model is able to identify is the sensitivity
    score. For example:


    ![](image/c-sono.jpg) Found 0 of 10 frauds, sensitivity \= 0%,


    ![](image/c-oculosescuros.jpg) Found 8/10 frauds, sensitivity \= 80%,


    ![](image/c-terror.jpg) Found 10/10 frauds, sensitivity \= 100%.


    Here, the best sensitivity score is obtained by the paranoid model, since it was
    able to identify the complete list of frauds. On the other hand, the chilled model
    found most frauds, but the list was incomplete. The lazy model was the least sensitive,
    since it found nothing interesting!


    PRECISION The percentage of a model’s predictions of fraud which are correct is
    the precision score. For example:


    ![](image/c-sono.jpg) Correct about 0 of 10 predicted frauds, precision \= 0%,


    ![](image/c-oculosescuros.jpg) Correct about 8/27 predicted frauds, precision
    ![](image/p-equivale.jpg) 29.6%,


    ![](image/c-terror.jpg) Correct about 10/97 predicted frauds, precision ![](image/p-equivale.jpg)
    10.3%.


    The best precision score was obtained by the chilled model, since almost a third
    of the predicted frauds were actual frauds. The paranoid model is less precise:
    only 10% of them are useful. Finally, the lazy model was the least precise, since
    all of its fraud predictions are useless!


    It is now clear that the lazy model is terrible. However, it can be difficult
    to choose which is better between the chilled and the paranoid models, since one
    has better sensitivity and the other has superior precision. Thankfully, there
