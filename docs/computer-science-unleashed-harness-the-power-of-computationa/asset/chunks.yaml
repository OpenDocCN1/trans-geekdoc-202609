    Ports 0–49151 should only be used by protocols registered with IANA. Ports 49152–65535
    are never assigned to any protocol and can be used for any purpose. You can check
    the current port number assignments at [http://code.energy/ports](http://code.energy/ports).


    # Chapter 3: Security


    Computer systems are not getting more secure. I hope that in the future, the advances
    we’re making in cryptography are going to influence the fairly bad situation in
    cybersecurity.


    — ADI SHAMIR


    PROGRAMMERS ARE ENTRUSTED with the task of securing sensitive data, such as private
    messages, medical records, banking transactions, and more. It’s your duty to protect
    this data from hackers. You must ensure that only those with valid credentials
    can access your systems and that confidential data cannot be read even if it is
    leaked.


    The practice of securing data against attacks from unauthorized parties is called
    cryptography. An algorithm that reversibly encrypts data into an unintelligible
    form is called a cipher. Most systems can be secured using cryptographic libraries
    vetted by experts. In this chapter, we’ll explore the underlying principles of
    ciphers and other tools cryptographic libraries provide. You’ll learn to:


    * Mess around with fun but insecure legacy ciphers,

    * Improve them to obtain strong symmetric ciphers,

    * Securely message strangers using asymmetric ciphers,

    * Hash any amount of data into a digital fingerprint,

    * Secure your networking protocols for a safer Internet,

    * Hack your systems to find vulnerabilities before bad guys do.


    If attackers successfully intercept encrypted data, there’s a chance they will
    figure out how to unscramble the data and reveal its secrets. If that happens,
    we say the cipher used to encrypt the data was broken. Let’s start by exploring
    ciphers that were popular in the past and which are easily broken today. This
    will help us understand why it’s difficult to break modern ciphers.


    ## 3.1 Legacy


    One of the earliest ciphers was used by Julius Cesar over two thousand years ago
    to send secret letters to his generals. His encrypted messages would look like
    this:


    ```

    GR QRW EULQJ DQB ERGB RI PHQ DFURVV WKH UKLQH

    ```


    If a secret letter from Caesar was seized, the information contained in the letter
    would remain confidential. Caesar’s enemies couldn’t make sense of the encrypted
    messages, but Caesar’s generals could easily read them. To encrypt messages, the
    Romans agreed in advance to shift every letter of the original message three positions
    forward in the alphabet, replacing the letters as follows:


    Messages were then decrypted by shifting the letters back. This is known as the
    shift cipher. Since Caesar’s enemies never discovered how it worked, it provided
    enough security. However, anyone who knows about this cipher can easily break
    it, even if letters are shifted more than three positions: there are only 25 possible
    shifts for the Latin alphabet. An attacker can break the cipher by trying them
    one by one until the message makes sense.


    Let’s have a look at a few useful terms. An encrypted message is called a ciphertext.
    To decrypt a ciphertext, we need to know which cipher was used, and which encryption
    key was used with it. For the shift cipher, the key is the number of positions
    in the alphabet that letters are shifted. Knowing cipher and key, we can undo
    the encryption and recover the original data, called the plaintext.


