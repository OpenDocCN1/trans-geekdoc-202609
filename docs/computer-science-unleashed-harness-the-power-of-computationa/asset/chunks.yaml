    \n本章是对网络安全的介绍，我们介绍了我们认为任何负责可能敏感系统的人都应该了解的基础知识。如果所有开发者都熟悉本章中的概念，过去发生的许多破坏性安全漏洞事件本是可以避免的。\n\
    \n防御计算机系统遭受复杂的攻击并非易事，有时只能由高高技能的安全专家完成。毕竟，一个成功的防御团队必须防范所有可能的攻击向量。攻击者只需要发现一个漏洞就能制造巨大的破坏。因此，防御团队通常会实施多层安全措施。这样一来，仅利用一个漏洞不足以破解系统。\n\
    \n我们已经看到，黑客可以付出巨大努力来窃取数据。在某些情况下，大规模数据泄露甚至会导致一家公司破产或严重损害政府。但是什么让大量数据如此珍贵呢？在下一章中，我们将探索如何理解和处理大量数据——即合法获得的数据。\n\
    \n## 参考\n\n* `The Code Book`,由 Singh 著\n  – 在 [`code.energy/singh`](http://code.energy/singh)\
