    Cipher machines were widely used in World War II, allowing messages to be encrypted
    and decrypted fast and using short shared secrets rather than long one-time pads.
    However, their keystreams displayed subtle patterns which were exploited by codebreakers
    on both sides. Teams of mathematicians and engineers worked around the clock to
    break intercepted ciphertexts.


    All German cipher machines were broken before the end of the war, even the one
    used by Hitler’s high command. Meanwhile, the strongest American cipher machine,
    called `SIGABA`, was never broken. In recent years, it was proven that patterns
    will always emerge from a keystream generated by rotating wheels–meaning that
    even `SIGABA` was vulnerable.


    Fortunately, computers allow us to operate even stronger ciphers. Let’s now explore
    how they can go one step further than these analog cipher machines.


    # 3.2 Symmetry


    Today, almost all of our encryption relies on computers. Since our computers operate
    on binary data, we must design our `ciphers` for an alphabet of two symbols: `0`
    and `1`. For instance, the `Vernam` cipher can work with a binary alphabet just
    as effectively as with a 26-letter alphabet:


    ![](image/03-04-h.jpg)


    Figure 3.4 Shifting binary plaintext with a binary one-time pad. When the digit
    `1` is shifted forward, it loops over and goes back to `0`.[7](#CSU-2-10.xhtml#nota3-07)


    Any information that’s stored in a computer can be encrypted with perfect secrecy
    using the `Vernam` cipher. However, the inconvenience of one-time pads remains.
    To encrypt a gigabyte of video, a gigabyte of secret random numbers is needed.
    And remember, one-time pads can’t be reused: crib-dragging also works in binary!


    Thankfully, there are secure ciphers that can encrypt large volumes of data using
    a relatively small shared secret. These ciphers are divided into two categories
    according to their underlying working mechanism. Let’s take the simplest first.


    ## Stream Ciphers


    The first approach is to avoid long one-time pads in similar fashion to the cipher
    machines with rotary wheels. This time, however, we write a computer program that
    generates an endless stream of pseudorandom numbers. For example, given a non-square
    number (e.g. `1337`), a stream of seemingly unpredictable digits emerges as we
    calculate its square root:


    ![](image/p-raiz1337.jpg) = 36.56 50 10 59 75 64 44 26 58 66 10 65 18 28...


    This is called a PseudoRandom Number Generator (`PRNG`). A `PRNG` requires a seed
    to serve as its starting point, similarly to the shared secret that described
    the initial position of a legacy cipher machine’s wheels. In our example, the
    seed is `1337`.


    Stream ciphers rely on `PRNGs` to generate keystreams. Let’s take our example
    and group digits after the decimal point in pairs to generate a stream of pseudorandom
    numbers between `0` and `99`:


    ![](image/03-05-h.jpg)


    Figure 3.5 Vernam cipher running on a pseudorandom number generator. The shared
    secret between the parties is just the seed.[8](#CSU-2-10.xhtml#nota3-07)


