    # ADVANCED SUBSTITUTIONS


    Stronger substitution ciphers may convert a plaintext letter to different symbols.
    For instance, plaintext `E` could be replaced by either `R`, `$`, or `*`. By having
    more substitution options for the most frequent English letters, frequency analysis
    becomes more difficult. However, common words and letter pairs will still leave
    subtle patterns in the ciphertext. More symbols can be devised to replace letter
    pairs and common words, further thwarting frequency analysis–yet never defeating
    it.


    ## Product Ciphers


    A combination of ciphers is called a product cipher. They are most effective when
    ciphers that shuffle the plaintext are combined with ciphers that make substitutions.
    For example, a plaintext can go through the zigzag cipher and then through the
    simple substitution cipher. The resulting product cipher is stronger than any
    of its individual components.


    Suppose `TH` is the most frequent letter pair of the plaintext, as expected for
    English texts. If `TH` is replaced for `ZN`, the most frequent letter pair of
    the ciphertext will not be `ZN`, due to the zigzag shuffling. However, the occurrence
    of a given ciphered letter always comes from the same plaintext letter, so frequency
    analysis is still possible.


    During World War I, the Germans used a product cipher to communicate via radio.
    The cipher had a substitution step followed by a shuffling step. The Germans believed
    it was unbreakable. Yet, the French managed to break it and eavesdrop on their
    foes. By knowing German plans well in advance, the Allies were able to anticipate
    attacks and better manage their resources.


    ## Vigenère Cipher


    So far, we’ve seen ciphers that perform substitutions according to one mapping
    between ciphertext and plaintext letters. Stronger substitution ciphers use multiple
    mappings. One way to do this is by iterating over a list of shift ciphers for
    each successive letter of the plaintext. For instance, using the key `2-0-1-1-0-6-4`,
    we can replace letters as follows:


    ![](image/i-03-05-h.jpg)


    This is called the Vigenère cipher. Notice that plaintext `E` letters can be encoded
    as `F`, `E`, `G`, `K` or `I`. Using longer keys, each plaintext letter has even
    more possible substitutions. As a result, the Vigenère cipher can mitigate the
    threat of frequency analysis. This cipher was invented in the 16th century, and
    remained unbroken for over 300 years. Many even believed it to be unbreakable.


    Today, the Vigenère cipher can be easily broken by a computer. By observing repeated
    sequences of letters in the ciphertext, it’s possible to guess the length of the
    encryption key. For instance, notice that in our example, the pattern `UIE` is
    repeated. The second occurrence appears seven positions after the first one:


    ![](image/i-03-06-h.jpg)


    It is likely that a pattern that appears twice in the same Vigenère ciphertext
    corresponds to a pattern that also appears twice in the original plaintext. However,
    this only happens if the distance between the two appearances is equal to a multiple
    of the length of the encryption key. Since the two `UIE` sequences appear seven
    positions apart, there is a good chance that the key has seven numbers. If, for
    example, they had been fifteen positions apart, it would have been a sign that
    the key had three, five or fifteen numbers.


    Once we have guessed the length of the key, frequency analysis can be used. If
    the key length is seven, we retrieve every seventh letter of the ciphertext. In
    this group, we find the most frequent letter, which is likely replacing `E`.


    Repeating this process with six more starting letters can be sufficient to break
    the cipher if the text is long enough. Even if the ciphertext is short like in
    our example, frequency analysis tells us the most probable keys to test, and the
    solution can be found with little computational power in today’s standards.


    ## Vernam Cipher


    The Vigenère cipher has the most security when the encryption key has as many
    numbers as there are letters in the plaintext. We call this variation the Vernam
    cipher. Mathematicians proved it is impossible to break the Vernam cipher, as
    long as the key is chosen at random and only used once. Otherwise, patterns emerge.


    Consider two ciphertexts: `VSXOCQZQCLGHQGBFHTJK` and `NHPJEXGPTDDBFCFOYKRA`. If
    they were encrypted with the same Vernam encryption key, there’s a trick we can
    apply. First, we choose a common word that is likely to be in the ciphertext.


    ![](image/03-01-h.jpg)

    Figure 3.1


    ![](image/03-02-h.jpg)

    Figure 3.2 ![](image/confete.jpg)


    If the first letter of plaintext is `T`, the first letter of ciphertext is `V`.
    If the second letter of plaintext is `O`, the second letter of ciphertext is `S`.
    If the third letter of plaintext is `M`, the third letter of ciphertext is `X`.
    If the fourth letter of plaintext is `E`, the fourth letter of ciphertext is `O`.
    If the fifth letter of plaintext is `R`, the fifth letter of ciphertext is `C`.
    If the sixth letter of plaintext is `O`, the sixth letter of ciphertext is `Q`.
    If the seventh letter of plaintext is `W`, the seventh letter of ciphertext is
    `Z`.


    If the eighth letter of plaintext is `T`, the eighth letter of ciphertext is `Q`.
    If the ninth letter of plaintext is `H`, the ninth letter of ciphertext is `C`.
    If the tenth letter of plaintext is `E`, the tenth letter of ciphertext is `L`.
    If the eleventh letter of plaintext is `E`, the eleventh letter of ciphertext
    is `G`. If the twelfth letter of plaintext is `R`, the twelfth letter of ciphertext
    is `H`. If the thirteenth letter of plaintext is `E`, the thirteenth letter of
    ciphertext is `Q`. If the fourteenth letter of plaintext is `S`, the fourteenth
    letter of ciphertext is `G`. If the fifteenth letter of plaintext is `T`, the
    fifteenth letter of ciphertext is `B`. If the sixteenth letter of plaintext is
    `O`, the sixteenth letter of ciphertext is `H`. If the seventeenth letter of plaintext
    is `R`, the seventeenth letter of ciphertext is `T`. If the eighteenth letter
    of plaintext is `N`, the eighteenth letter of ciphertext is `J`.


    This trick is called crib-dragging. In order to make the Vernam cipher immune
    to it, we should never use the same key on two different plaintexts. For this
    reason, we typically call a Vernam cipher’s encryption key a one-time pad.


    In the 1940s, the Soviet Army sometimes reused one-time pads when transmitting
    ciphertexts. American intelligence managed to intercept their radio transmissions
    and eventually broke the code by crib-dragging. They discovered, among other things,
    that Soviet spies had infiltrated their weapons program.


    To this day, the Vernam cipher is the gold standard for secret communications.
    It’s the only cipher that’s proven to be unbreakable if used properly. But it
    isn’t very practical: parties must share an identical, large sequence of secret
    random numbers before they can start exchanging encrypted messages. A secure cipher
    that works with a shorter key would be much versatile.


    ## Cipher Machines


    In the 1920s and 1930s, military powers around the world needed systems to quickly
    encrypt and decrypt messages without the hassle of directly sharing large encryption
    keys. Therefore, they designed machines that ran smaller forms of shared secrets
    among communicating parties as surrogates for the large keys. The new devices
    employed tricks that allowed short shared secrets to be continuously expanded
    into larger and larger encryption keys called keystreams.


    These early cipher machines were made of successive wheels, each with their own
    intricate internal wiring (Figure 3.3). Before encrypting or decrypting each letter,
    the wheels moved in concert to a new position. At each position, their wiring
    would form a completely different circuit, expanding the keystream with a new
    seemingly random mapping.


    Messages seemed like they were encrypted using infinitely long random encryption
    keys. In reality, the keystream was not random but pseudorandom: the same keystream
    could be reproduced at any time on another copy of the machine. All that was needed
    was the knowledge of the shared secret: the initial position of the wheels.


    ![](image/03-03-h.jpg)

    Figure 3.3 Cipher machine wheels. As they rotate, they form seemingly chaotic
    circuits in a deterministic and reproducible way.

