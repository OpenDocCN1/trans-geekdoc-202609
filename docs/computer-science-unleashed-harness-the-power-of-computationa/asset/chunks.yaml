    能够编写计算机使用互联网的优秀人才正处于数字革命的前沿。本章将教你互联网是如何工作的，以便你能加入这一精英群体。你将学习：


    ![](img/c-elo.jpg) 将计算机连接形成网络，


    ![](img/c-mundo.jpg) 使用网协议（Internet Protocol）组合网络，


    ![](img/c-pin.jpg) 根据互联网地址定位接收者，


    ![](img/c-bussola.jpg) 找到通往该位置的互联网路由，


    ![](img/c-caminhao.jpg) 在远程应用程序之间传输数据。


    在互联网出现之前，双方之间的通信需要直接的物理连接。在 20 世纪 50 年，每部电话都有一根直接通向中心站的线缆。为了拨通，接线员必须物理上连接两台电话的线路。对于长途电话，在远程站点之间铺设线路，不同地点的几名接线员必须物理上连接连接两台电话的线路链。


    互联网消除了这一点。线路不再通过物理重新配置来创建直接、独占的。相反，信息通过一系列联动设备的链逐步重传，直到到达目的地。这消除了对接线员和中央协调的需求。此外，线路不再局限于服务单一连接——许多并发连接可以共享同一根线路。这使得全球通信变得即时、廉价且易于获取。


    然而，现代网络技术比早期电话更复杂。它有许多连续的层，每一层都构建在前一层之上。让我们从最基础的层开始，探索这些不同级别是如何建立连接的。


    ## 1.1 链路


    两台计算机之间的直接连接通过传输介质实现：即信号流过的物理通道。它可以是携带电流的铜线、引导光的纤电缆，或者是承载无线波的空气。每个连接的计算机都有一个网络接口，用于在传输介质中发送和接收信号。例如，手机具有无线芯片和天线处理通过空气的无线信号。


    ![](img/01-01-h.jpg)


    图 1.1 如果两个网络接口共享传输介质并同意通信规则，则它们之间建立了链路。


    为了进行通信，网络接口必须就发送和接收信号时遵循的规则。这。规则被称为链路层（link layer）。


    当一个介质独占连接两台计算机时，我们说它们维持着点对点连接，它们的链路层依赖于最基本的规则集：点对点协议（`Point-to-Point-Protocol`,
    `PPP`）。它只需确保两台计算机可以相互识别并准确交换数据。


    然而，连接的计算机并不总是能享受到这种独占链路。通常，它们必须与其他几台计算机共享传输介质。


    ### 共享链路


    在办公室连接计算机的一种方法是将每台计算机通过线插到集线器（hub）中。集线器在物理上连接所有到达它的线路，因此一台计算机发送的信号将被所有其他计算机检测到！这也会发生在你的家庭
    WiFi 上，因为所有连接的设备都使用相同的无线频率。如果它们同时使用该介质，通信可能会变得混乱。


    ![](img/01-02-h.jpg)


    图 1.2 在共享链路上传送的消息将由所有人检测到。


    链路层包含一组定义计算机如何共享其通信介质的规则，恰当地称为介质访问控制（`Medium Access Control`, `MAC`）。这些规则解决了两个主要挑战：


    **冲突（COLLISIONS）** 如果两台计算机同时通过同一介质发送信号，产生的干扰会弄乱两次传输。此类事件被称为冲突。当你的一朋友或家人互相说话导致没有一个声音能被清楚听到时，也会发生类似的问题。


    有方法可以避免冲突。首先，只有在没有其他计算机在传输时才开始发送信号。其次，监控你的通信——如果发生冲突，等待简短但随机的时间后再再次尝试传输。


    ![](img/01-03-h.jpg)


    图 1.3 Ada 和 Andrew 之间的冲突。


    ![](img/01-04-h.jpg)


    图 1.4 Ada 和 Andrew 在随机持续后都重新发送。


    这些方法具有一些局限性。如果通过介质的传输尝试过多，冲突将不断发生。当过多的冲突破坏了通信时，我们说链路处于饱和状态。你是否曾在大型活动场所感到沮丧，因为你的手机无法发送短信或拨打电话？如果有许多手机尝试同时通信且蜂窝链路变得饱和，可能会发生这种情况。


    **物理地址（PHYSICAL ADDRESSING）** Ada 和 Charles 的计算机之间有直接链路。Ada 想和 Charles 说话，所以她通过介质发送带有消息的信号。然而，介质是共享的，所以连接到介质的每个人都会收到消息。其他计算机如何知道它们接收到的信号不是针对它们的？


    ![](img/01-05-h.jpg)


    图 1.5 Andrew 的网络接口丢弃了消息。


    每台计算机的网络接口都有一个标识符，称为物理地址或硬件地址。共享介质中的传输必须以此类地址开头：接收者的和发送者的地址。接收传输时，计算机将知道它是应该被忽略还是应该在该地址回复。


    只有当物理地址是唯一的，这种方法才能运行：如果两台计算机使用 `my_netinterface`，我们就回到了原点。由于这个原因，几乎所有网络接口都遵循介质访问控制规则定义的命名方案。这些标准物理地址被称为
    MAC 地址。


    ### MAC 地址


    计算机、智能手机、智能手表和智能电视各拥有 WiFi、蓝牙和以太网网络接口。每个网络接口都有在生产期间标记的唯一 MAC 地址。你不需要担心为计算机分配 MAC
    地址：你始终可以使用其网络接口自带的那个。


    由于 MAC 地址仅仅是巨大的随机数字，全球网络接口制造商必须协调，以避免向不同设备分配相同的数字。为此，他们依靠电气电子工程师学会（`IEEE`），该学会为每个制造商分配一个不同的
    MAC 地址范围。


    MAC 地址表示为六对冒号分隔的十六进制 1。地址的前半部分是 IEEE 分配给唯一制造商的标识符。制造商随后为每个网络接口选择唯一的后半部分。


    `60:8B:0E:C0:62:DE`


    在这里，`608B0E` 是厂家。这个特定的数字是由 IEEE 分配给 Apple 的，所以这个 MAC 地址属于 Apple 设备。2 设备的 MAC 地址通常写在包装上的标签或设备本身上，序列号旁边。


    ![](img/01-06-h.jpg)


    图 1.6 每个 MAC 地址都是唯一的。


    有一个特殊的地址留用于发送给介质中所有计算机的传输。它被称为广播地址（broadcast address），显示为 `FF:FF:FF:FF:FF`。当你尝试连接到未知设备时就会使用它。例如，当你的手机
    WiFi 卡未禁用时，它会持续向 `FF:FF:FF:FF:FF` 广播它正在寻找访问点。可发现的访问点将通过自己的 MAC 地址进行回复，以便你建立链路。


    '
- fmt: '

    Such discovery broadcasts, like all other transmissions, contain the sender’s
    `MAC` address. Walking around with a smartphone can therefore be like walking
    around with a loudspeaker shouting your name non-stop, only using radio waves
    instead of sound and the `MAC` address instead of your moniker. In 2013, Edward
    Snowden revealed that the `NSA` monitored the movements of people by sniffing
    `WiFi` transmissions in big cities, storing records of where each `MAC` address
    was seen.


    You can also set your own network interface to promiscuous mode, and it will pick
    up all transmissions regardless of their intended recipient. Doing so allows you
    to discover hidden `WiFi` networks, to list which `MAC` addresses are in your
    area, and sometimes even to read the contents of other people’s transmissions.
    Browsing the Internet through an unsecured `WiFi` network can therefore be unsafe:
    your communication is broadcast for anyone in range to hear. This is why encryption
    is important for `WiFi`’s link layer.


    Be careful: a network interface can be configured for its transmissions to start
    with any `MAC` address for both the recipient and the sender. Nothing stops a
    malicious agent from impersonating you by using your `MAC` address in their transmissions.
    This type of attack is known as `MAC` spoofing. When the link layer was invented,
    security wasn’t a concern. Protocols are evolving to become more secure and neutralize
    such attacks, but it’s an ongoing process.


    ## Frames


    Sometimes, a transmission must contain a lot of data, and sending out a single,
    big fat message is impractical. Network interfaces and computers are not all capable
    of the same transmission speeds. Moreover, what would happen if a collision occurred
    in the middle of the transmission? The entire transmission would have to be discarded,
    as it would be difficult for the sender and receiver to determine exactly which
    parts of the message were received and which were not.


    To solve these issues, long messages are always split into small parts, each sent
    as an independent transmission. The duration between transmissions can vary according
    to the capabilities of both computers: slower devices needs longer breaks. If
    an error occurs, it is only necessary to discard and resend the small transmission
    that failed.


    ![](image/01-07-h.jpg)


    Figure 1.7 An `Ethernet` frame. Once it is transmitted in a copper wire, it becomes
    a series of electric signals that encode a number. The `Ethernet` protocol instructs
    how to interpret this number. For instance, the first 12 hex digits of the number
    encode the destination `MAC` address.


    Each independent transmission is called a frame. Standard `WiFi` protocols cap
    the size of frames to 2,346 bytes. Thirty-four bytes are needed for `MAC` addresses
    and error-detecting codes. Therefore, a `WiFi` frame can ultimately carry up to
    2,312 bytes of data, called the payload. In wired networks, the maximum frame
    size is usually 1,526 bytes, with room for a 1,500 byte payload.


    On rare occasions, disturbances in the medium interfere with a transmission, and
    the receiver picks up signals that don’t encode exactly the same information that
    the sender intended to transmit. Let’s see the special field that was added to
    address this problem.


    ### FCS

    The last part of the frame is the `FCS` (`Frame Check Sequence`), and it ensures
    that information was transmitted accurately. It doesn’t add new information to
    the transmission: it is merely the result of a calculation using the contents
    of all other fields. Changing any content before the `FCS` should cause the `FCS`
    number to change as well.


    Upon receiving a frame, a computer calculates the expected `FCS` number from the
    information it received and compares it to the received `FCS`. If they don’t match,
    the frame is discarded. If they match, we know that the message wasn’t garbled
    and trust that the received payload is error-free.


    ### TYPE

    The frame shown in Figure 1.7 has one last field we haven’t talked about: the
    payload type. It tells the receiver which rules should be followed to interpret
    the data in the frame’s payload. In the next section, we’ll explore the most common
    set of such rules.


    ## 1.2 Internet


    We’ve seen that the link layer enables directly connected computers to exchange
    messages inside frames. The internet layer, also known as the network layer, specifies
    how to transmit these messages between computers that are not directly connected.


    The trick is to equip some computers, called `routers`, with multiple network
    interfaces. All computers in a network are then linked to at least one `router`,
    and all `routers` are linked to at least one other `router`. When a `router` receives
    a message at one of its network interfaces, it can forward it to another `router`
    through a different network interface.


    ### LOCAL AREA NETWORKS

    We can ask a `router` we’re linked with to forward a message to a computer we’re
    not linked with. Suppose you have a wired network in your home connecting a `router`
    and a desktop computer. Suppose the `router` is also directly connected to a smartphone
    in a different, wireless network.


    Even though the desktop computer and the smartphone are not directly connected
    to the same network, they can send messages to each other using the `router` as
    a relay. Computers from different networks in close vicinity that can talk to
    each other through `routers` form a larger network, called a Local Area Network
    (`LAN`).


    In a home or small office, one `router` will be enough to link all the computer
    networks in the area. When assembling a `LAN` that covers a large organization
    such as a university or hospital, many `routers` may be required to link all the
    different computers networks into a fully connected system.


    ![](image/01-08-h.jpg)


    Figure 1.8 In this small `LAN`, Ada and Andrew can send messages to each other
    through their `router` Charles.


    ### WIDE AREA NETWORKS

    But why stop there? If your `router` is linked with a `router` outside your home,
    which in turn is linked with a `router` at the university, you can ask for your
    message to be forwarded to computers on the university’s `LAN`. When distant `LANs`
    are connected to each other, they form a Wide Area Network (`WAN`).


    ![](image/01-09-h.jpg)


    Figure 1.9 Charles is connected to a distant `router`, Marie, and they both forward
    messages around this `WAN`.


    A `WAN` can grow larger as `LANs` are connected to it. Different `WANs` can also
    be connected to form an even larger `WAN`. The largest `WAN` in the world is a
    collection of thousands of interconnected networks that we call the Internet.
    It’s the network we use every day to send emails and browse the web. In 2019,
    this `WAN` contained over a billion computers. Let’s see how they all got connected.


    ### Interconnection

    The most straightforward way to connect your `router` to the Internet is to pay
    for it. Some organizations on the Internet will link one of their `routers` to
    yours, and allow messages to and from your network to pass through their network
    via this link. This paid service is called `transit`, as all of your messages
