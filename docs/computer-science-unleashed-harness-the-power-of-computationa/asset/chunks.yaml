    全球工程师达成共识，由一家美国非营利机构——互联网分配机构（`IANA`）决定由谁控制哪些 IP 路由前缀。在实践中，`IANA` 将其大部分权力委托给五个名为区域互联网注册（或
    `RIRs`）的非营利组织。为了实现这一点，它为每个 `RIR` 分配了短的十六进制组合，这些组合可以作为它们分配的路由前缀的前几位。


    ![](img/01-16-h.jpg)


    图 1.16 向每个 RIR 分配的示例。


    ![](img/01-17-h.jpg)


    图 1.17 `IANA` 按地理位置分配其 IP 地址权限：每个 `RIR` 负责一个不同的地区。


    要为你的组织获取路由前缀，你必须向路由器所在地区的 `RIR` 提交请求。该 `RIR` 将分配给你一个前缀，其开头是 `IANA` 分配给它们的十六进制数字组合之一。


    例如，总部位于爱尔兰的 Facebook 由 `RIPE NCC` 授予了路由前缀。同样，瑞士信贷银行（Credit Suisse）的拉丁美洲分支机构由 `LACNIC`
    授予了路由前缀：


    ![](img/01-18-h.jpg)


    图 1.18 两家公司的 IP 地址分配链。这意味着拉丁美洲信贷银行分支的计算机可能被分配如下 IP 地址：


    这意味着拉丁美洲信贷银行分支的计算机可能被分配如下 IP 地址：


    ```

    2801:80:1380: ![](img/c-quadverde4.jpg) :_\_\_\_:\_\_\_\_:\_\_\_\_:\_\_\_\_

    ```


    银行的网络管理员将为每个子网分配一个唯一的十六进制数字组合，使其能够放入网络部分的剩余空间 ![](img/c-quadverde4.jpg)。由于每个十六进制数字有
    16 个不同的值，银行有足够的空间容纳 `164 = 65,536` 个不同的子网。Facebook 作为一个较大的组织，获得的前缀留有了超过 40 亿个子网的空间！


    我们已经看到网络管理员可以决定如何填充单个设备接口 ID 中的 16 个空白。只要其路由器具有连接性，这些设备就可以向和从互联网发送接收 IP 数据包。


    ### 互联网服务提供商


    大多数个人和小型组织并不直接与 `RIRs` 交道，也不与其他计算机网络维护对等链路。相反，他们从专门的公司购买互联网连接，这些公司被称为互联网服务提供商（`ISP`）。`ISPs`
    在靠近客户的地方安装路由器。这样，他们就可以轻松地将自己的一个路由器连接到任何客户场所的路由器上。他们还为每个客户分配一个路由前缀。


    让我们看看在实践中是如何运作的。在英国，一家名为 `Sky` 的 `ISP` 被授予了路由前缀 `2a02:0c7f`。`Sky` 在于许多英国城市，因此该前缀分布在他们的区域基站之间。例如，他们将
    `2a02:c7f:48` 分配给米尔顿凯斯网络，将 `2a02:c7f:7e` 分配给罗姆福的网络。9。


    假设 Ada 住在罗姆福，想在家里建立一个网络。她有一台台式电脑和一台打印机，想用以太网线连接它们。她还想要自己的 WiFi 网络来连接她的手机、平板电脑和笔记本电脑。


    Ada 雇用了 `Sky`，他们将罗姆福路由器连接到她家中的路由器。`Sky` 根据其罗姆福基站的一个，为 Ada 的路由器分配了一个 14 位的路由前缀。Ada
    家中的每个网络（有线和无线）都会根据 `Sky` 分配给 Ada 的路由前缀获得一个子网。下一页的图 1.19 显示了从 `IANA` 分配到 Ada 设备的完整路径。


    Ada 的路由器接收来自不同计算机的 IP 数据包，根据 `Sky` 分配给 Ada 的路由前缀，Ada 家中的每个网络会被分配一个子网。指向其某个子网的数据包可以直接递送。她的路由器为无线和有线网络使用不同的子网。


    ![](img/01-19-v.jpg)


    图 1.19 从 `IANA` 分配到 Ada 设备的 IP 地址分配。


    对于不依赖 ISP 的路由器，路由并不简单。但它们如何决定通过哪个链路到达最终目的地？


    ### 1.4 IP 路由


    假设 Ada 想向 Facebook 发送消息。她通过构建一个包含自己的地址、Facebook 的地址和有效荷的 IP 数据包。这里是 Ada 路由器的连接情况：


    ![](img/01-20-h.jpg)


    图 1.20 通过 WiFi 传输的 IP 数据包。10


    ### 地址表


    路由器根据目的地选择下一跳。为了这一点，它们配备了表格。表格列出了路由器识别的可能地址。对于每个地址，表格指示了哪个应该是下一跳。例如，这里是 Ada 路由器的连接情况：


    ![](img/01-21-h.jpg)


    图 1.21 Ada 的路由器通过以太网连接到台式电脑和打印机，通过 WiFi 连接到笔记本电脑，通过 DSL（数字用户线路，一种允许数字数据通过旧电缆流传输的技术）连接到
    ISP。


    ![](img/01-22-h.jpg)


    图 1.22 引导 Ada 路由器的网络。


    如果路由器收到的数据包目的 IP 地址与表格中的任何行都不匹配，则该数据包通过默认路由转发。对于 ISP 路由器来说，路由更为复杂。除了对等和传输链路，它还接收来自许多客户的数据包。为了简单起见，假设
    Sky 罗姆福路由器仅服务两个客户并有两个对等链路：一个到米尔顿凯斯，另一个到牛津大学。最后，想象它与一家较大的电信公司有一个传输链路：


    ![](img/01-23-v.jpg)


    图 1.23 Sky 罗姆福链路图。Ada、Charles 和牛津大学仅使用 Sky 的本地基础设施进行通信。


    ![](img/01-24-h.jpg)


    图 1.24 引导 Sky 罗姆福路由器转发网络。


    这就是 IP 分层大显用场的地方。在图 1.24 的转发表中，IP 地址根据其路由前缀分组。这之所以有效，是因为所有以 `2a0a:207` 开头的 IP
    地址都来自牛津大学的计算机，而所有以 `2a02:c7f:48` 开头的 IP 地址都是由 `Sky` 在米尔顿凯斯服务的计算机。


    ### 互联网交换点


    为了增加容量和速度，网络管理员通常会尽可能与其他组织建立对等链路。这种这种最廉价的方法是通过被称为互联网交换点（或 `IXPs`）的地方。组织通过将其路由器连接到
    `IXP` 建筑来加入 `IXP`。每个参与组织就可以与连接到该建筑的其他组织建立单独的对等链路。11。


