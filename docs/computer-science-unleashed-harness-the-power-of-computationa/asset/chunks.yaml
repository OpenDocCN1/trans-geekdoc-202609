- fmt: '

    Monte Carlo is used when there is an abundance of computing power, and the model
    can be trained and scored repeatedly at little cost. If we wished to train with
    90% of our 365 records and validate with the remaining 10%, Monte Carlo could
    evaluate the model a virtually unlimited number of times with different random
    training and validation sets. After a few million evaluations, we can be more
    certain that the different scores collectively reflect the model’s true performance.


    ## Leave-One-Out


    Sometimes, we have to work with a very small labeled dataset of only a few dozen
    records. In such cases, it makes sense to keep the training set as large as possible.
    To this end, we train the model on all records but one, and evaluate on this remaining
    record.


    This strategy is called leave-one-out. It can be seen as a special case of the
    `k-fold`: there are as many folds as the total record count, so each fold contains
    only one record.


    But there’s a catch: all training instances are extremely similar to each other.
    Even though the model will be evaluated many times, the different evaluations
    are going to be very similar, nullifying some of the advantages of performing
    multiple evaluations. Only use leave-one-out as a last resort when you cannot
    increase the size of your dataset.


    ## Interpretation


    Cross-validation leaves you with many scores that collectively describe your model’s
    performance. We typically summarize these values to better interpret them, for
    example with their number summary. The interpretation can depend on what you need
    your model to do.


    If, for example, don’t mind bad performance as long as the model sometimes performs
    well, focus on the upper quartile and maximum score. If, on the other hand, you
    cannot afford rare cases of poor performance, take the pessimistic approach and
    focus on the lower quartile and minimum.


    In general, the mean is taken as the most relevant summary of how the model is
    doing. But the mean is only a rough representation of performance. It’s good practice
    to consider it along with the standard deviation: the degree to which performance
    differs from the mean.


    Besides providing a measure for expected performance, cross-validation scores
    also allow us to compare different models. There are many types with different
    mechanisms. To compare two models and decide which is best, don’t look at the
    means. Perform a hypothesis test on cross-validated scores from both models to
    check whether one model has a higher mean than the other.


    Oftentimes, a computationally heavy model will have a slightly higher mean than
    a simpler model. Yet, a hypothesis test will tell us the difference isn’t significant.
    In these cases, choose the simpler model.


    ## 5.4 Fine-Tuning


    We learned to prepare data, train a generic learning model, and measure its performance.
    If you stop there and don’t make adjustments to your system, you will only achieve
    a fraction of the predictive power. A prediction system can be tweaked in many
    different ways. For example, adjusting your features can dramatically improve
    performance. Selecting the most appropriate type of model and adjusting its specific
    parameters for your task also helps.


    Data scientists start by training and cross-validating a simple model. They then
    make incremental changes to their system, carrying out a new cross-validation
    time. Scores before and after each change are compared, and changes that bring
    significant improvements are kept. This process continues until no improvements
    to the system can be found.


    Let’s start with the adjustments that can be made to the features. Features are
    most effective when they provide clear hints to the model. Your columns `X` must
    be a collection of clues that relate to what you’re predicting as directly as
    possible. Sometimes, transforming the values in `X` can help achieve this.


    ![](image/05-24-v.jpg)

    Figure 5.24 “Machine Learning”, courtesy of http://xkcd.com.


    The process of transforming features to make them work better with a model is
    called feature engineering. Out of all adjustments that can be made to a prediction
    system, this often holds the biggest potential for improvement. Let’s see some
    of the most common feature engineering techniques.


    ### Imputation


    In Section 5.1, we said `X` can’t contain `NULL` cells, and we discussed strategies
    to handle them: dropping rows with missing data, dropping columns with missing
    data, filling blank cells with a column’s average, or with a default value. To
    discover which strategies best fit your task and data, try them out and evaluate
    their performance!


    For instance, if you’re filling cells with a column’s median, also try the mean,
    and a constant default value. For each column that has more than 1% of `NULL`
    cells, testing the effects of different imputation strategies is generally worth
    it. If no strategy is significantly better, stick with the simplest: fill all
    blank cells with a constant default value.


    ### Outliers


    The presence of outliers in `X` can confuse some models. As with the imputation
    of missing values, there are various ways to deal with outliers. For example,
    if a column only has a handful of outliers, it’s often best to drop their rows
    from `X`. If outliers are frequent (for example more than 1% of the rows), you
    can try to replace them with less extreme values. This technique is known as clipping.


    ![](image/05-25-h.jpg)

    Figure 5.25 Clipping three outliers.


    ### Normalization


    Some models are confused by features that display widely different ranges. A feature
    whose values range from zero to a few thousands might receive a biased weight
    if the other columns range from zero to a few dozens. To prevent this issue, columns
    can be rescaled such that they all display a similar range. This is called normalization.
    The simplest normalization technique is called `MinMax`. The minimum value in
    the column becomes zero, the maximum becomes one. All other values are placed
    in between:


    ![](image/05-26-h.jpg)

    Figure 5.26 `MinMax` squeezes all values to the 0–1 range.


    You can also normalize values according to their individual distance to the mean
    and the column’s standard deviation: a value equal to the mean becomes zero; a
    value equal to the standard deviation becomes one. This normalization method is
    called the `z-score`:


    ![](image/05-27-h.jpg)

    Figure 5.27 With `z-score` normalization, ranges aren’t fixed.


    When using `MinMax`, all columns have the exact same range. Moreover, the presence
    of outliers will force non-outliers to be squeezed closer to each other into smaller
    regions within the 0–1 range. Using `z-scores`, outliers have less influence since
    they don’t cause this squeezing, and the ranges of non-outliers are more similar
    between columns. To find out which normalization method to use, try both and compare
    cross-validation results.


    ### Log Transformation


    In Section 4.4, we plotted the decreasing costs of computer storage over the past
    decades and discovered that data spanning several orders of magnitude can need
    special handling. The same is true for feeding this type of data to predictive
    models. Features with huge variance often weaken predictive performance.


    If your `X` table has such columns, try transforming their values using a logarithmic
    function (`log`). If the column includes values between zero and one, add one
    before calculating the logarithm in order to avoid large negative outputs.


    If the column also includes negative numbers, the transformation gets trickier,
    as logarithms aren’t defined for such numbers. One way to get around this is to
    remove the minus sign, add one, apply the logarithm, and reapply the minus sign.

