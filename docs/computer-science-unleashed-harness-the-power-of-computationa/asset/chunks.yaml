  raw: 'A Message Authentication Code (MAC)[14](#CSU-2-10.xhtml#nota3-14) is a way
    to prove a given message originated from someone who has knowledge of a specific
    key. While a MAC can be implemented with digital signatures, it’s computationally
    faster to implement it using hash functions.


    SECURE SURVEY ![](image/c-urna.jpg) You’ll conduct a survey targeting millions
    of respondents. You plan to send a unique survey code to each respondent, saying
    something like this: “This person is eligible to answer the survey as ![](image/p-quadpreto.jpg)”,
    where ![](image/p-quadpreto.jpg) is filled according to the name or the ID of
    each respondent. How can you allow only the people who received a legitimate survey
    code to answer your survey?


    If you only send the plain message quoted above, attackers could alter the message
    and insert whatever data they want! The simplest way to curb these attacks is
    to add a large random number to each survey code and keep records of all the codes
    you send out. When a stranger presents a survey code with a large random number,
    you consult your database to determine if you indeed issued that survey code.
    This solution is cumbersome because you’d have to keep track of millions of codes.


    With asymmetric encryption, you could use digital signatures and send each respondent
    a signed survey code. This way, you don’t have to keep any records. When a code
    is presented with its signature, you verify your own signature in order to determine
    whether you created that survey code.


    There’s another way to achieve the same outcome, but using a hash function. First,
    you generate a random secret key. You store it carefully and you don’t share it
    with anyone. For each respondent, you use the secret key to calculate the following:[15](#CSU-2-10.xhtml#nota3-15)


    msg ← "Eligible to answer as " \+ respondent\_name


    mac ← hash(secret\_key + msg)


    A survey code can be created by joining msg and mac. When someone presents a code,
    you extract the msg part and use your secret key to recalculate mac. If the mac
    number you calculated is exactly the same as the one in the survey code you were
    presented, the code is authentic.[16](#CSU-2-10.xhtml#nota3-16)


    MACs are useful for people communicating through stream ciphers. Remember: messages
    encrypted with any stream cipher are vulnerable to malleability attacks. If a
    MAC is added at the end of the message using the encryption key as the secret,
    the recipient can recalculate the MAC and verify that the message hasn’t been
    tampered with.


    Password Handling


    Most computer systems authenticate users by requesting them to enter a password.
    This means they must keep records of all passwords. But keeping plaintext copies
    of passwords is terrible practice: if the system is hacked, the passwords of every
    user can potentially be known to the hackers. In addition, many people have the
    bad habit of reusing their passwords, so such a security breach in one system
    can lead to breaches in other systems.


    Storing encrypted passwords doesn’t solve the problem. With complete access to
    a system, attackers can potentially find the key and figure out how the system
    automatically encrypts or decrypts passwords when verifying login attempts. At
    this point, everyone’s encrypted password can then potentially be decrypted!


    For this reason, it’s better to store the hash of each password rather than an
    encrypted copy: contrarily to ciphers, hash functions are not reversible. However,
    you can still check the password provided at login by hashing it and comparing
    it to the hash you’re storing. If the hashes are the same, the password is correct.[17](#CSU-2-10.xhtml#nota3-17)
    Yet, even if a computer system is only storing password hashes, there’s still
    a way for attackers to know people’s passwords.


    DICTIONARY ATTACK Attackers can compute trillions of hashes of passwords, creating
    a sort of dictionary that maps hashes back to passwords. Stolen password hashes
    can then be looked up in this dictionary. This is a sort of brute force attack,
    but the work has to be done only once. It is effective because most people use
    simple passwords. In 2012, a hacker attacked LinkedIn and leaked the password
    hashes of over 6 million people. Using the dictionary attack, most passwords could
    be revealed. Storing password hashes can be almost as bad as storing plain copies
    of the passwords.


    SALTING Fortunately, there is a way to prevent dictionary attacks. Instead of
    saving hash(password) to a database, the system can generate a random number called
    a salt and store it along with hash(password + salt). Since each user has a different
    salt, this forces the attackers to try and brute force each password hash individually.
    Every time they try to find the password of a given user, they don’t even know
    if that user has a simple password that would take minutes to brute force or a
    complicated one that could take centuries.


    MULTIPLE HASHING ROUNDS There’s a way to make things even harder for attackers
    attempting to brute force password hashes. Instead of storing hash(password +
    salt), we can calculate the hash of the hash, and store hash(hash(password + salt)).
    An attacker then needs about twice the time to guess the correct password. We
    can add as many rounds of hashing as we wish. Since calculating a hash is fast,
    some systems perform thousands of hashing rounds. Remember: if you’re storing
    password hashes, make sure you’re using salts and performing multiple rounds of
    hashing.


    Proof of Existence


    Hash functions can be used to create proofs that some information exists, without
    revealing any part of the information itself.


    SECRETIVE STAR ![](image/c-guitarra.jpg) You’ve composed an amazing song that
    you believe will be the next “Hotel California”. You want to keep the music secret
    and only release it in your next album, but you’re scared someone might steal
    the song. You want the song notarized, but you’d prefer not revealing the song
    even to the notary. How can you prove you created a song without revealing it?


    The first step is to record the song to a computer file. You then calculate the
    hash of the file, and ask a notary to record that hash number. If the authorship
    of the song is contested, you can reveal your notarized hash number, along with
    the song recording. The only way you could have requested a notary to certify
    that specific hash number is by having possession of the recording file.


    Online gambling sites also utilize hashing to prove to their clients that each
    game is fair. Imagine a simple game, where you bet on the result of a coin toss.
    If you correctly call the toss, you double your stake; if you don’t, you lose
    all of it. First, the online casino asks you for a number, and randomly generates
    a coin toss. Suppose it’s heads. The casino then calculates:


    hash("HEADS" + user\_salt + house\_salt)


    house\_salt is a number chosen by the house and user\_salt is your number. The
    house presents you the hash and then waits for your guess. If you lose, the house
    can prove it didn’t cheat you by disclosing their house\_salt. You can then recalculate
    the hash, and check that it matches the hash provided by the house before you
    guessed. The house can’t cheat! To check that you understood the principle, try
    to answer the following question: why can’t the house also tell you their house\_salt
    number before you guess?[18](#CSU-2-10.xhtml#nota3-18)


    Proof of Work


    If you continuously calculate hash numbers for different inputs, eventually you’ll
    have an output that matches any specific pattern. For instance, if your looking
    for a hash that starts with four zeros in binary:


    ![](image/i-03-08-v.jpg)


    After 26 different hash calculations, we come across the hash of heads26. This
    number, written in binary, begins with four zeros! Now imagine someone presented
    you the following:


    hash("heads750") → 0000000010111000010110111011000...'
