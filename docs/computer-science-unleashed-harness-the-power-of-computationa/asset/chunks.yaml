    The answers to these kinds of questions are valuable. They allow you to plan effectively
    and to define key performance indicators to gauge and track progress. To compile
    such essential knowledge, well-managed organizations analyze their data and create
    periodic reports. Workers and managers can then easily review progress and identify
    areas for improvement.


    Many organizations do more than issue reports on their data–they track it in real
    time, such that the consequences of their actions can be monitored on virtual
    dashboards. Such processes support decision-making through learning and distributing
    information, and they form what people call business intelligence.


    ![](image/04-01-h.jpg)


    Figure 4.1 Hospital emergency room dashboard, tracking in real time the number
    of patients ![](image/c-enfaixado.jpg) across different units.


    Business intelligence isn’t limited to commercial business. Consider a public
    hospital’s emergency room where one can use a “business” intelligence dashboard
    to track the flow of patients (fig. 4.1). Then, for example, if there is an unusual
    spike in waiting times, hospital admission staff are quickly alerted and can address
    the situation before it escalates.


    As a result of this intelligence, the hospital is also better prepared for crises.
    If a serious accident occurs in the area, the hospital will be able to immediately
    observe a drop in the number of available ambulances. Knowing what resources are
    at hand, the staff can quickly decide whether to call in reinforcements before
    the dispatched ambulances even return.


    Business intelligence and other ventures in data analysis require you to collect,
    summarize, visualize, and learn from data. We will explore all of these topics.
    If your organization isn’t focused on business intelligence and knowledge-management,
    lead by example. Study relevant data and share your findings in a compelling report
    or on a simple dashboard. You will create immense value.


    4.1      Collection


    Useful knowledge only emerges from relevant data. It can be difficult, when facing
    a colossal volume of irrelevant information, to identify the data that matters.
    Refine your search by predefining your goals. What information is related to these
    goals?


    If your goal is to improve the menu of your coffeehouse, then the characteristics
    of both your successful and failed products matter. Collect opinions from your
    baristas and your customers. Likewise, data on ingredients, pricing, and sales
    all relate to your goal. What if your goal is to improve patient care at a hospital?
    Look at which factors are considered to diagnose patients and track their recovery.
    Collect data on patients, diseases, and treatments.


    Kinds of Data


    Try to obtain the full picture when approaching your study. Capture information
    from all possible angles, so you will be less likely to overlook important details.
    If you’re measuring temperatures, for example, it can be useful to know the time
    and place those measurements were made and if it was sunny, foggy, or rainy. As
    programmers, we like to use the following categorization to check that we didn’t
    neglect relevant data:


    ![](image/i-04-01-h.jpg)


    The first four kinds of data are said to be structured: they are organized in
    a predefined manner. For instance, electric power is measured in Watts, every
    medal at the 1896 Olympics was awarded for one of nine possible sports, dates
    can be organized in a calendar, and international borders are defined along coordinates.


    Computers are good at handling structured data. On the other hand, unstructured
    data is hard for them to digest. There are special methods for extracting structured
    data from unstructured data. For example, facial recognition software can take
    an unstructured video feed and output someone’s identity as categorical data.


    Getting Data


    Many of our daily activities are facilitated by computers, therefore our behavior
    and actions often leave a digital footprint. Inspect computer systems to trace
    this data. Install your own sensors to collect even more, or change how your company
    operates. Additionally, you can often get useful data from third parties.


    EXISTING DATA Hospital computers often monitor vital signs of patients, such as
    heart rate and body temperature. Restaurant computers record what was ordered
    at each table. What data do your computers manipulate? Scavenge all systems for
    copies of useful records. For example, explore the machine hosting the company’s
    website and you will most likely find a log of all web visitors.


    NEW DATA There is always interesting data going unrecorded. For instance, most
    restaurants don’t record how happy customers feel after a meal. To remedy this,
    each bill can come with a slip for the customer to rate the service on a scale
    from one to ten. As long as you’re not transgressing ethical boundaries, always
    look for ways to capture more data. If a restaurant’s billing system isn’t recording
    how long clients remain seated, change it.


    ![](image/04-02-h.jpg)


    Figure 4.2 Remember to show empathy when you’re collecting data.


    SENSORS We often think of sensors for studying natural phenomena, for example,
    climatologists need sensors for temperature, air pressure, humidity, and more.
    However, sensors can also be valuable for businesses. Shopping malls often use
    presence sensors to record a daily visitor count, and restaurants can use sound
    meters to track the ambient noise that their customers experience. Moreover, web
    applications often use virtual sensors in order to track the behavior of users,
    such as the time they spend on individual pages.'
