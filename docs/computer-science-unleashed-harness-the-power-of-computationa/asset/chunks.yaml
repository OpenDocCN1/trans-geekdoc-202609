    <h1>Golden Retriever</h1>


    <img src="/pics/golden-retriever.jpg">


    <p>As you can see in this picture...</p>


    SCHEME There’s another important piece of information we can add to our web references:
    the way the resource will be accessed, known as the scheme. One that you may recognize
    is http: the most widely used protocol to transfer web page files between computers.
    The scheme appears in the beginning of a reference, preceded by a colon:


    <a href="http://zoo.org/pets/cat.html">kitten</a>


    A complete reference to a web resource—which includes a scheme, a host, and a
    document path—is called a Uniform Resource Locator, or URL. People also call them
    web addresses. Web browsers typically display the URL of the page they are rendering
    in a bar at the top. Let’s now see how the http scheme works.


    Hypertext Transfer Protocol


    The most common action when navigating the Web is clicking a link to switch from
    the web page we’re viewing to the next one. Every time a link is clicked, the
    web browser has to contact the computer hosting the referred document and retrieve
    a copy of that document. The Hypertext Transfer Protocol (HTTP) mediates these
    document transfers.


    Since transferred documents can be larger than the MTU, HTTP relies on TCP rather
    than UDP. It has a client/server design: a web browser is the client application,
    and the web server expects connections on port 80. After a connection is established,
    the client sends a request. Once the server processes it, a response is sent back.


    In 2015, HTTP received a major upgrade,[21](#CSU-2-9.xhtml#nota2-21) but the 1990s
    version of the protocol is still used. Requests following the earlier version
    of HTTP are in plain text. The first line indicates the request type, the document
    path, and the protocol version. The next lines are used for headers, similarly
    to email messages. An empty line indicates the end of the request:


    GET /pets/cat.html HTTP/1.0


    User-Agent: Mozilla/5.0 (Macintosh)


    Accept-Language: en-us


    The above example shows the most common request type: GET. It indicates the client
    wants to retrieve a document. Headers are optional, but are almost always included.
    The example shows two of the most common headers. Accept-Language specifies that
    the English version of the document is preferred, and User-Agent says which web
    browser software and which computer operating system created the request. A typical
    response from a server to such a request looks like this:


    HTTP/1.0 200 OK


    Server: nginx/1.15.8


    Date: Wed, 19 Aug 2020 20:46:53 GMT


    Last-Modified: Sat, 20 Nov 2004 07:16:26 GMT


    Content-Length: 49


    Content-Type: text/html


    <html><body><h1>Cats are cute!</h1></body></html>


    The first line indicates the protocol version, followed by a three-digit status
    code, similar to the ones used in SMTP. Here, 200 means the request went through
    without any issue. Many more codes exist. For instance, 404 indicates that a requested
    document can’t be found. Codes are grouped by their first digit. Namely, those
    starting with 2 signal successful requests, and those starting with 4 signal errors
    caused by inappropriate requests.


    After the first line, optional headers are included. In our example, there are
    headers informing the client of the server’s software, the date the message was
    sent, when the requested document was last changed, the type of document carried,
    and its total length. Many other headers are widely used for authentication, tracking,
    caching, and more.


    HTTP has been incredibly successful, and it has grown to be used outside the World
    Wide Web. For instance, an app in your phone may send out an HTTP request to obtain
    raw weather data. The retrieved data can then be used to display weather conditions
    by a widget in the phone’s interface, rather than on a web page provided by the
    server.


    Web Apps


    An HTTP request may carry a path referencing a program. In such cases, the server
    runs the program and responds with its output. For example, requests for /random
    at code.energy refer to a program that generates a page containing a random number.
    The server returns a dynamic page, rather than a static page that looks the same
    at every request. Visit this page on a browser and refresh it a few times to see
    for yourself:


    [http://code.energy/random](http://code.energy/random)


    Dynamic pages can also receive inputs from the user as parameters. For instance,
    google.com has the dynamic page /search, which takes a parameter named q as a
    search query. The parameter is appended after the document path as follows:


    [http://google.com/search?q=energy](http://google.com/search?q=energy)


    In order to load this web page, browsers can send this request:


    GET /search?q=energy HTTP/1.0


    Upon receiving this request, the web server calls the program associated to /search.
    Any parameter in the form ?name=value after the path is passed to the program.
    Input parameters in this form are called query strings.


    Since there are characters that valid URLs cannot contain, there is a standard
    way of encoding them using the percent sign. For instance, the space[22](#CSU-2-9.xhtml#nota2-22)
    becomes %20 and ! becomes %2F. Query strings can include multiple parameters separated
    by ampersands (&). Visiting the following URL searches “code energy” and passes
    an additional num parameter for listing only five results:


    [http://google.com/search?q=code%20energy&num=5](http://google.com/search?q=code%20energy&num=5)


    Query strings are neatly integrated with HTML. Some tags, including <form> and
    <input>, can be added to web pages for a user to easily enter and submit data
    using query strings. The following HTML code creates an input box to enter keywords
    and a button to dispatch the query:


    <form action="//google.com/search">


         <input name="q">


         <button>Search Google</button>


    </form>


    Once the button is pressed, an HTTP request of the GET type is created, passing
    the text typed in the input as a query string. On the server end, a program finds
    the links that it deems most useful for the user and sends them back within a
    web page document.


    In general, programs that respond to HTTP requests of the GET type should perform
    no action other than to retrieve information. For example, a GET request shouldn’t
    allow a user to post a status message on social media, delete a photo from a cloud
    drive, or place an order on an online shop. This means users can issue GET requests
    without worrying about consequences other than what will be shown on their web
    page.


    In order to perform these other actions, there exists several other HTTP request
    types. For example, if the desired effect is to create something, the POST type
    should be used. An HTML form can be switched to send POST requests by setting
    a method parameter in the <form> tag:


    <form action="/send-message" method="POST">


         <p>Subject: <input name="subject"></p>


         <p>Message: <input name="message"></p>


         <button>Send message</button>


    </form>


    In POST requests, input data is carried in the body of the request rather than
    in the query string. However, the data is still encoded the same way. Here’s a
    POST request that could be generated by submitting the form from the above example:


    POST /send-message HTTP/1.0


    subject=Greetings&message=Hello%20World%2B'
