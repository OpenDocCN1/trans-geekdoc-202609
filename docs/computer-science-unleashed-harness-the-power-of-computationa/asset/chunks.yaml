- fmt: "\nAt first, people read their emails by directly opening mailbox files. In\
    \ most cases, people weren’t sitting in front of their mail servers, so they would\
    \ use `telnet` to open their mailbox files remotely. Engineers realized it would\
    \ be easier if people could download their emails on their own computer and read\
    \ them “locally”. This would spare them the hassle of using `telnet` every time\
    \ they needed to read an email.\n\nSince `SMTP` isn’t appropriate for a mail server\
    \ to deliver email to an end user, another protocol was needed. After all, most\
    \ email users wouldn’t have their computers online 24/7, ready to receive incoming\
    \ `SMTP` connections. Hence, more protocols were created. They allowed users to\
    \ initiate a connection to the mail server, get a list of emails in the mailbox,\
    \ and selectively download emails from the list.\n\nThe most commonly used of\
    \ such protocols is the Internet Message Access Protocol (IMAP). Its working principle\
    \ is similar to `SMTP`, the server also conducts a conversation with the client\
    \ using command codes and plain text. There are commands for clients to list the\
    \ emails in their mailboxes and to request the transmission of a specific email.\n\
    \nToday, roughly half of the world’s emails are sent and received through webmail\
    \ services such as Gmail. These services offer the most hassle-free access to\
    \ email, as they don’t require you to install or configure a client application\
    \ on your computer. Let’s now explore the Web: the beautiful set of mechanisms\
    \ that made this—and much more—possible.\n\n## 2.5 Web\n\nIf a text document contains\
    \ links referencing other documents, and these links allow you to jump back and\
    \ forth across multiple documents, the text is said to be hypertext: the links\
    \ create an extra dimension in the textual space. For example, Wikipedia is hypertext,\
    \ but a physical encyclopedia is not. Hypertext doesn’t have to be read linearly\
    \ like regular text–it can be explored by navigating through the links.\n\nAs\
    \ graphical user interfaces spread in the 1980s, knowledge workers discovered\
    \ hypertext could make their jobs easier and more efficient. While early programs\
    \ to read and write hypertext documents gained popularity, it was still impossible\
    \ to create links between hypertext documents residing in different computers.\
    \ Hypertext documents were largely isolated from each other.\n\nWith the advent\
    \ of the Internet, a new hypertext system was created to overcome this limitation.\
    \ Documents created and stored on different computers could finally be linked\
    \ into a universal web of documents. The system was named the World Wide Web,\
    \ or WWW–and its hypertext documents were named web pages. For it to work, different\
    \ computers around the world had to share three basic components:\n\n*   A language\
    \ to write web pages as files,\n*   A way to link web pages to each other,\n*\
    \   A protocol to transfer files between computers.\n\nA program that uses these\
    \ three components is a called a web browser. Virtually every web browser today\
    \ agrees on a basic set of standards. Let’s explore how they work.\n\n### Hypertext\
    \ Markup Language\n\nWeb pages should be easy to create, while also being universally\
    \ understandable by all Internet participants. To attain these goals, it was decided\
    \ that web pages would consist of plain text, enriched with special tags for specifying\
    \ structure and presentation.\n\n![](image/02-05-h.jpg)\n\nFigure 2.5 Rich documents\
    \ can be created by marking plain text.\n\nTags can be used to mark a paragraph,\
    \ to set a phrase as a header, to emphasize a word, and much more. A collection\
    \ of tags that can be mixed with text to extend it form a markup language. Many\
    \ different markup languages exist. The one created for the Web is called Hypertext\
    \ Markup Language, or HTML. In HTML, any text that’s enclosed by `<...>` characters\
    \ is a tag. For example, this is how a header followed by a paragraph is expressed:\n\
    \n```html\n<h1>The Unknown</h1>\n<p>The more you know, the more you realize you\
    \ don’t know.</p>\n```\n\nThis example includes two HTML tag pairs: `<h1>...</h1>`\
    \ and `<p>...</p>`. The `<h1>` tags indicate that “The Unknown” is a header. The\
    \ `<p>` tags demarcate a paragraph. Many other tags exist besides these, and most\
    \ are used to define the structure of the document.\n\nTypically, HTML tags come\
    \ as opening/closing pairs: each pair applies over a section of the document,\
    \ and the closing tag includes a slash. However, a few tags, called empty tags,\
    \ don’t come in pairs. For instance, `<br>` is used to insert a line break in\
    \ the text, and `<img>` is used to insert an image.\n\nComplete HTML web pages\
    \ must have two parts: the head and the body. The head contains information about\
    \ the document which web browsers shouldn’t display. The body, on the other hand,\
    \ is meant to be displayed on screen by web browsers. Here is an example of a\
    \ simple but complete HTML web page:\n\n```html\n<html>\n    <head>\n        <title>Daily\
    \ quote</title>\n    </head>\n    <body>\n        <h1>The Unknown</h1>\n     \
    \   <p>The more you know, the more you realize you don’t know.</p>\n    </body>\n\
    </html>\n```\n\nAs you can see, the head and body are each wrapped in a tag pair\
    \ with their respective name; and both are wrapped together in an `<html>` tag\
    \ pair. Try creating a text file with this content, saving it as an `.html` file,\
    \ and opening it on a web browser! Within an HTML file, spacing and line breaks\
    \ are ignored by the browser. They’re just used to make the file easier for humans\
    \ to read.\n\nMany tags can contain attributes that extend or complement it. For\
    \ instance, the `<html>` tag can contain an attribute that specifies the document’s\
    \ language: `<html lang=\"en\">`. Some tags have a mandatory attribute. For example,\
    \ the `<img>` tag must specify which image to display:\n\n```html\n<img src=\"\
    cat.gif\">\n```\n\nThe most important HTML tag is the anchor tag `<a>`. It makes\
    \ a section of the document become a link to another hypertext location. For example:\n\
    \n```html\nEverybody loves <a href=\"cats.html\">them</a>.\n```\n\nWeb browsers\
    \ will render this line on screen as follows:\n\nEverybody loves them.\n\nClicking\
    \ the underlined word instantly switches to a different location as specified\
    \ by the hypertext reference (`href`) attribute of the anchor. Let’s now learn\
    \ how to express these locations in order for web browsers to find them.\n\n###\
    \ Uniform Resource Locator\n\nThe anchor’s `href` parameter is a reference to\
    \ a document that is shown once the anchor is clicked. It follows a simple format:\
    \ two slashes, followed by the name of the host, plus the path to the document.\
    \ For example, here’s a link to the document `/pets/cat.html`, located in the\
    \ zoo.org host:\n\n```html\n<a href=\"//zoo.org/pets/cat.html\">kitten</a>\n```\n\
    \nBrowsers interpret the document path as the location of a file within the host’s\
    \ file system. For instance, the document referenced by the anchor above is assumed\
    \ to be a file named “cat.html” inside a “pets” directory.\n\n#### Relative References\n\
    \nIf a reference doesn’t start with any slashes, it is treated as a folder-relative\
    \ reference. For instance, suppose this link exists in the `//zoo.org/pets/cat.html`\
    \ document:\n\n```html\nAre <a href=\"dog.html\">they</a> our best friends?\n\
    ```\n\nHere, the `href` parameter refers to a file in the same directory as the\
    \ present file (cat.html). Hence, the browser will interpret this reference as\
    \ `//zoo.org/pets/dog.html`. There are also references with only one starting\
    \ slash, which are host-relative:\n\n```html\n<a href=\"/bugs/ant.html\">Ants</a>\
    \ are small.\n```\n\nThis reference will be interpreted as `//zoo.org/bugs/ant.html`.\n\
    \n#### Fragment Reference\n\nThere is a way to refer to a specific part, or fragment,\
    \ of an HTML document. Suppose that the `dog.html` file looks like this:\n\n```html\n\
    <h1 id=\"bulldog\">Bulldog</h1>\n<p>...</p>\n<h1 id=\"poodle\">Poodle</h1>\n<p>...</p>\n\
    <h1 id=\"golden\">Golden Retriever</h1>\n<p>...</p>\n```\n\nWe can create an anchor\
    \ that links directly to the header about the golden retrievers inside the `dog.html`\
    \ document, like this:\n\n```html\n<a href=\"dogs.html#golden\">These dogs</a>\
    \ rock!\n```\n"
