    此类发现广播与所有其他传输一样，包含发送者的 `MAC` 地址。因此，拿着手机走动就像随身带着一个喇叭不停地大喊你的名字，只不过使用了无线电波代替声音，并用
    `MAC` 地址代替你的名号。2013 年，爱德华·斯诺登（Edward Snowden）透露，`NSA` 通过嗅探大城市的 `WiFi` 传输来监控人们的活动，并存储每个
    `MAC` 地址出现过的地方记录。


    你还可以将自己的网络接口设置为混杂模式（promiscuous mode），它将接收所有传输，无论目标接收者是谁。这样做让你发现隐藏的 `WiFi` 网络，列出你所在区域的
    `MAC` 地址，有时甚至可以读取他人的传输内容。因此，通过不安全的 `WiFi` 网络浏览互联网是不安全的：你的通信会被广播给范围内的任何人听取。这就是为什么加密对
    `WiFi` 的链路层至关重要的原因。


    请小心：网络接口可以配置为使其发送和接收的传输都以任何 `MAC` 地址开始。没有什么能阻止恶意代理在他们的传输中使用你的 `MAC` 地址来冒充你。这种攻击被称为
    `MAC` 欺骗（`MAC` spoofing）。在链路层发明时，并没有考虑安全性。协议正在演进以变得更加安全并消除此类攻击，但这是一个持续的过程。


    ## 帧（Frames）


    有时，一次传输必须包含大量数据，发送单个巨大的臃肿消息是不现实的。网络接口和计算机并不都具备相同的传输速度。此外，如果传输过程中发生冲突会怎样？整个传输都必须丢弃，因为发送者和接收者很难准确判断消息的哪些部分被接收了，哪些部分没有。


    为了解决这些问题，长消息总是被分成许多小部分，每部分都作为独立的传输发送。传输之间的持续时间根据两台计算机的能力而异：较慢设备需要更长的间隔。如果发生错误，只需要丢弃并重新发送失败的小传输即可。


    ![](img/01-07-h.jpg)


    图 1.7 一个以太网（`Ethernet`）帧。一旦它在铜线中传输，它就变成了一系列编码数字电信号。`Ethernet` 协议指示了如何解释这个数字。例如，数字的前
    12 个十六进制数字编码了目标 `MAC` 地址。


    每个独立的传输被称为“帧”。标准的 `WiFi` 协议将帧的大小限制在 2346 字节。`MAC` 地址和错误检测码需要 34 个字节。因此，一个 `WiFi`
    帧最终可以携带多达 2312 字节的数据，这称为载荷（payload）。在有线网络中，最大帧大小通常为 1526 字节，为 1500 字节的载荷留有空间。


    在少数情况下，介质中的干扰会影响传输，接收器到的信号与发送者想要传输的信息不完全相同。让我们来看看解决这个问题而添加的特殊字段。


    ### FCS（帧校验序列）

    帧的最后部分是 `FCS`（`Frame Check Sequence`），它确保信息传输无误。它没有为传输添加新信息：它只是使用所有其他字段的内容进行计算的结果。在
    `FCS` 之前更改任何内容都应该导致 `FCS` 数字随之改变。


    接收到帧后，计算机根据收到的信息计算预期的 `FCS` 数字，并将其与收到的 `FCS` 进行比较。如果它们不匹配，帧会被丢弃。如果它们匹配，我们就知道消息没有乱码，并相信收到的载荷是无错误的。


    ### TYPE（类型）

    图 1.7 所示的帧还有一个我们尚未提到的最后一个字段：载荷类型（payload type）。它告诉接收者应该遵循哪些规则来解释帧载荷中的数据。在下一节中，我们将探索此类规则的最常见集合。


    ## 1.2 互联网（Internet）


    我们已经看到链路层允许直接连接的计算机在帧内部交换消息。网络层（也称为网层）规定了如何在没有直接连接的计算机之间传输这些消息。


    技巧是为某些称为 `routers`（路由器）的计算机配备多个网络接口。这样，网络中的所有计算机都连接到至少一个 `router`，而所有的 `routers`
    都连接到至少另一个 `router`。当 `router` 在其一个网络接口处接收到消息时，它可以通过不同的网络接口将其转发到另一个 `router`。


    ### 局域网（LOCAL AREA NETWORKS）

    我们可以要求我们连接的 `router` 将消息转发给我们未连接的计算机。假设你的家里有一个有线网络，连接了一个 `router` 和一台台式电脑。假设该
    `router` 也直接连接到另一个不同无线网络中的手机手机。


    尽管台式电脑和手机没有直接连接到同一个网络，但它们可以使用 `router` 作为中继互相发送消息。邻近区域的不同网络中，可以通过 `routers` 互相通信的计算机组成了一个更大的网络，称为局域网（`LAN`）。


    在家庭或小型办公室中，一个 `router` 就足够连接该区域内的所有计算机网络了。在组建覆盖如大学或医院等大型组织的 `LAN` 时，可能需要许多 `routers`
    将所有不同的计算机网络连接成一个全连接的系统。


    ![](img/01-08-h.jpg)


    图 1.8 在这个小型 `LAN` 中，Ada 和 Andrew 可以通过他们的 `router` 互相发送消息。


    ### 广域网（WIDE AREA NETWORKS）

    但何止于此？如果你的 `router` 连接到家外的一个 `router`，而该 `router` 又连接到大学的 `router`，你可以要求将消息转发到大学
    `LAN` 上的计算机。当遥远的 `LAN` 连接在一起时，它们就形成了广域网（`WAN`）。


    ![](img/01-09-h.jpg)


    图 1.9 Charles 连接到遥远的 `router` Marie，他们都通过这个 `WAN` 转发消息。


    随着 `LAN` 的连接，`WAN` 可以变得更大。不同的 `WAN` 也可以相互连接形成一个更大的 `WAN`。世界上最大的 `WAN` 是互联网络的集合，我们称之为互联网。它是我们每天用于发送电子邮件和浏览网页的网络。2019
    年，这个 `WAN` 包含了十亿台计算机。让我们看看它们是如何连接的。


    ### 互连（Interconnection）

    将你的 `router` 连接到互联网最直接的方法是付费。互联网上的某些组织会将它们的其中一个 `router` 连接到你的，并允许来自和进入你的网络的消息通过该链路通过它们的网络通过。这种付费的服务被称为
    `transit`（传输），因为你所有的消息在到达目标 `router` 之前都会通过它们的网络传输。


    然而，为了连接到互联网的另一个 `router`，并不总是需要通过第三方网络传输。例如，如果两所附近的大学频繁通信，它们可以连接它们的 `routers`，以便消息在它们的网络之间直接流动。这可以节省费用，因为这些消息本须通过付费连接进行传输。不同组织网络之间的免费交换被称为
    `peering`（对等）。


    ### 路由（Routing）

    连接到互联网 `router` 的任何计算机都可以请求其他 `routers` 转发其消息。消息可以跨越远距离进行路由。例如，有一套海底电缆系统连接着许多沿海城市的
    `routers`：


    ![](img/01-10-h.jpg)

