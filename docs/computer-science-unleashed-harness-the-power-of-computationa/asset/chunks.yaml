- fmt: "\n# BOTNETS\nSome hackers have automated the process of scanning the Internet\
    \ for vulnerable computers and running exploits to inject their rootkits. After\
    \ years of running automated exploits, some hackers end up controlling an army\
    \ of remote computers called a botnet. Experts estimate there are botnets operating\
    \ today with hundreds of thousands of computers. Hackers often rent these botnets\
    \ for others to use as a launchpad for further attacks. If you weren’t cautious\
    \ with your computer’s security, it might secretly be part of someone’s botnet!\n\
    \n# FIREWALLS\nThere’s another type of software that can help protect computers\
    \ from harmful exploits: the firewall. It blocks IP packets that aren’t expected\
    \ to be transiting in a network. For instance, if a computer isn’t expected to\
    \ be waiting for TCP connections initiated from the outside, a firewall can be\
    \ installed to block all external IP packets that attempt to initiate a TCP connection.\
    \ This makes it much more difficult for a hacker to communicate with a malicious\
    \ payload installed through an exploit. \n\n# BACKDOORS\nVulnerabilities in computer\
    \ systems aren’t always there by accident. A vulnerability that was intentionally\
    \ inserted into a system by a programmer or engineer is called a backdoor. Sometimes,\
    \ law enforcement agencies or the military will request hardware manufacturers\
    \ or software providers to include backdoors in their systems. Though the intent\
    \ can be for them to be known only by good guys, black hat hackers can also discover\
    \ and exploit them.\n\nA backdoor can even exist in something as fundamental as\
    \ an algorithm. It was uncovered on several occasions that the `NSA` pushed for\
    \ the adoption of purposefully altered cryptographic standards that they were\
    \ capable of breaking. In 2004, the `NSA` even bribed a lead software provider\
    \ $10 million dollars to use such sabotaged algorithms by default. When it comes\
    \ to selecting ciphers and other cryptographic tools for you own systems, do your\
    \ own research and find those that are recommended by independent academic experts\
    \ you trust.\n\n# Digital Warfare\nComputer systems are essential to the functioning\
    \ of a modern country. They control the communications of both the public and\
    \ private sectors. They run power plants and the electrical grid. They’re the\
    \ backbone of banks and markets. Air traffic controllers and their radar systems\
    \ rely on them. Railroad networks and their trains are also operated by computers.\n\
    \nIt would be a catastrophe if an attacker could hack into all of these systems\
    \ at once. Communication lines could be cut, bank accounts and markets wiped out,\
    \ power plants shut down, radars blacked out, trains derailed... in short, it\
    \ would be Armageddon.\n\nWe’ve already witnessed cyberattacks on high-profile\
    \ military targets. In 2010, American and Israeli hackers used zero-day vulnerabilities\
    \ to write a virus they named `Stuxnet`. It was programmed to infiltrate computers\
    \ inside Iran’s nuclear facilities. The virus spread slowly and eventually infected\
    \ computers controlling uranium-enrichment centrifuges. It instructed the centrifuges\
    \ to intermittently spin at different velocities, repeatedly straining them until\
    \ they started to break. The virus also falsified instrument readings to evade\
    \ detection.\n\nIranian intelligence eventually discovered the virus, but had\
    \ they taken a few more months, they might have missed it: `Stuxnet` was programmed\
    \ to ultimately delete itself, leaving little to no trace behind. `Stuxnet` is\
    \ the most advanced case of digital warfare we know of, but it wasn’t an isolated\
    \ act. Many more clues suggest that digital warfare operations are currently ongoing\
    \ between the hacking teams of different countries.\n\nArmed forces of powerful\
    \ nations invest heavily in Computer Network Exploitation (CNE): the training\
    \ of hackers and development of exploits for spying and reconnaissance operations.\
    \ They also invest in Computer Network Attack (CNA): the deployment of digital\
    \ weapons that can sabotage enemy systems, for example destroying data or disabling\
    \ communications.\n\nAn interesting case of CNA was carried out by the Israeli\
    \ military in 2007. Israeli Air Force fighter jets flew deep into Syrian airspace\
    \ as if it were completely undefended and destroyed suspected nuclear facilities.\
    \ It later came to light that the Israelis had hacked the computer system of the\
    \ Syrian Air Defense Force and falsified their radar readings. This allowed the\
    \ Israeli aircraft to conduct their operations meticulously and leave without\
    \ taking a single shot from their adversaries. \n\nFor technologically advanced\
    \ nations, there’s an upside to the widespread presence of security vulnerabilities.\
    \ Lives of their spies and soldiers on the ground are less at risk. Instead of\
    \ spies risking their lives and taking years to infiltrate enemy headquarters\
    \ physically, they can now directly hack into enemy computers and steal sensitive\
    \ documents remotely. Instead of sending troops or launching ballistic missiles\
    \ to destroy a nuclear facility, they can break into servers and run malicious\
    \ software to destroy the facility from within.\n\nAt a smaller scale, private\
    \ corporations also sometimes engage in digital warfare with each other by infiltrating\
    \ their competitors and hunting for strategic documents such as financial reports\
    \ or blueprints of secret new inventions. Inspired by the military, they deal\
    \ with the threat of cyberattacks by training their employees to become hackers\
    \ through so-called red team vs blue team exercises: the red team must pwn a given\
    \ computer system, while the blue team tries to repel the attack. Some companies\
    \ even hire professional hackers for the red team.\n\n# QUANTUM COMPUTING\nCryptography\
    \ and security are always evolving. Today, the military and intelligence services\
    \ of powerful nations are investing heavily in the research and development of\
    \ quantum computers. They could well become a reality this century, and the first\
    \ nation to obtain one could potentially pwn the world. In microseconds, these\
    \ computers will be able to solve problems that our current supercomputers can’t\
    \ even solve in a trillion years.\n\nOnce fully functional quantum computers are\
    \ built, almost all cryptographic algorithms we use today will become insecure.\
    \ However, brilliant minds are already working relentlessly on creating the ciphers\
    \ of the future that will remain secure when the quantum computing revolution\
    \ unfolds.\n\n# Defense Checklist\nWhen initiating an attack on your systems,\
    \ malicious hackers typically follow some of these steps:\n\n1. Build a fake version\
    \ of your service and send emails to your users asking them to type their passwords\
    \ in.\n2. Call your users claiming to be from tech support and make them reveal\
    \ credentials or sensitive information.\n3. Place covert `SQL` commands in all\
    \ inputs handled by your system that are likely to be part of a database query.\n\
    4. Attempt privileged actions such as creating a new user without the proper permissions.\n\
    5. Probe for buffer overflows by sending very large chunks of data to every possible\
    \ input that’s handled by your system.\n6. Build a script for interacting with\
    \ your authentication software and to try to crack passwords via brute force.\n\
