    \ shift of 0 positions, 27 corresponds to a shift of 1, etc.\n\n[9](#CSU-2-10.xhtml#nt-3-9)  Check\
    \ the recommended ciphers here: [http://code.energy/stream](http://code.energy/stream).\n\
    \n[10](#CSU-2-10.xhtml#nt-3-10)  To have a 0.1% chance of guessing a 120-bit random\
    \ key, an attacker would have to try 106 billion keys per second for 400 trillion\
    \ years—almost thirty thousand times the age of the universe.\n\n[11](#CSU-2-10.xhtml#nt-3-11)  Currently,\
    \ the best recommended block ciphers are AES and Twofish with block sizes of 256\
    \ bits.\n\n[12](#CSU-2-10.xhtml#nt-3-12)  a mod b is the remainder of a ÷ b. For\
    \ example, 27 mod 10 = 7, because when we divide 27 into 10, the remainder is\
    \ 7.\n\n[13](#CSU-2-10.xhtml#nt-3-13)  RSA stands for Rivest–Shamir–Adleman and\
    \ ECDSA stands for Elliptic Curve Digital Signature Algorithm.\n\n[14](#CSU-2-10.xhtml#nt-3-14)  Not\
    \ to be confused with MAC in networking, which stands for medium access control\
    \ (see sec. 1.1).\n\n[15](#CSU-2-10.xhtml#nt-3-15)  Here, + is the concatenation\
    \ operation: “code” + “energy” = “codeenergy”.\n\n[16](#CSU-2-10.xhtml#nt-3-16)  Depending\
    \ on the hash function, the MAC might have to be calculated as hash(key + hash(key\
    \ + msg)) rather than hash(key + msg). Use a cryptographic library to generate\
    \ MACs and ensure they’re calculated properly.\n\n[17](#CSU-2-10.xhtml#nt-3-17)  This\
    \ is why computer systems with proper security will never email you your password\
    \ during a password recovery process: they don’t even know what your password\
    \ is!\n\n[18](#CSU-2-10.xhtml#nt-3-18)  If you know both salts in advance, you\
    \ can easily brute-force the hash before making your guess, as there are only\
    \ two hashes you have to calculate: the one for heads and the one for tails!\n\
    \n[19](#CSU-2-10.xhtml#nt-3-19)  If a hash function outputs 200-bit numbers, that’s\
    \ 2200 different possible hash values. If you took the number of all grains of\
    \ sand on earth, and multiplied that by a trillion a few times, you wouldn’t even\
    \ be remotely close to 2200. Imagine trying to find a specific grain of sand in\
    \ such a search space.\n\n[20](#CSU-2-10.xhtml#nt-3-20)  In 2013, Edward Snowden\
    \ revealed that the NSA has already mounted such attacks even against leaders\
    \ of allied countries.\n\n[21](#CSU-2-10.xhtml#nt-3-21)  In many cases, the person\
    \ or organization operating the client computer also owns the server, so this\
    \ task is as easy as copy-pasting the server’s key on a pen drive. In other cases,\
    \ the client’s user must obtain the public key from a trusted source, and the\
    \ security risks are the same as for any public key cipher.\n\n[22](#CSU-2-10.xhtml#nt-3-22)  At\
    \ its inception in 1995, the protocol was called Secure Sockets Layer (SSL). As\
    \ the protocol was upgraded, it was renamed to Transport Layer Security (TLS),\
    \ but many still refer to it by its older name or by SSL/TLS.\n\n[23](#CSU-2-10.xhtml#nt-3-23)  Pwning\
    \ is the cyber-slang spelling of owning: utterly defeating or destroying an adversary.\
    \ It often refers to the successful hacking of a system or the leaking of sensitive\
    \ data. For reference, the website Have I Been Pwned? will check if personal data\
    \ associated with a given email address has ever been made public. Check it out\
    \ at [http://haveibeenpwned.com](http://haveibeenpwned.com).\n\n[24](#CSU-2-10.xhtml#nt-3-24)  The\
    \ Democratic National Committee is the governing body of the Democratic Party,\
    \ one of the two main political parties of the United States.\n\n[25](#CSU-2-10.xhtml#nt-3-25)  The\
    \ Central Intelligence Agency is the United States institution that spies gathers\
    \ foreign intelligence to help the president in matters of national security.\n\
    \n[26](#CSU-2-10.xhtml#nt-3-26)  SQL is a database language for consulting, inserting\
    \ and modifying data. We present it in our first book, Computer Science Distilled.\n\
    \n[27](#CSU-2-10.xhtml#nt-3-27)  Besides the SQL injection, there are other types\
    \ of injections where an input is run into a system causing unwanted consequences.\
    \ For example, when copying user inputs into an HTML page, ensure the < and \\\
    > characters are replaced, to prevent the injection of malicious tags.\n\n[28](#CSU-2-10.xhtml#nt-3-28)  Because\
    \ of this threat, the Russian Federal Guard service reportedly stopped using computers\
    \ in 2012 for certain communications, favoring mechanical typewriters instead.\n\
    \n[29](#CSU-2-10.xhtml#nt-3-29)  An amateur who knows little about security and\
    \ only cares to download and run exploits created by real hackers is called a\
    \ script kiddie, or skid.\n\n[30](#CSU-2-10.xhtml#nt-3-30)  You can search the\
    \ list at [http://code.energy/cve](http://code.energy/cve).\n\n Chapter 4  \n\n\
    CHAPTER 4\n\nAnalysis"
