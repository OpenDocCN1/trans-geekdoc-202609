    1.5      Transport


    We’ve seen that computers on the Internet can exchange messages in IP packet payloads.
    For example, they can exchange ICMP messages. However, the true power of the Internet
    is unleashed when applications, not computers, start sending each other data in
    IP packet payloads.


    Computers on a network are often called hosts because they merely host the applications
    that utilize the network. For instance, a smartphone can host applications to
    simultaneously stream music, surf the web, and receive emails.


    Generally, an application shares its host with other applications, but it doesn’t
    want to go through all incoming IP packets. To solve this issue, applications
    ask their hosts to send and receive the packets on their behalf. That way, the
    hosts direct each packet’s payload toward the right application, and each application
    only receives the data it should be reading.


    This solution requires the data sent by an application to be accompanied by some
    extra information. The transport layer specifies how to format and interpret this
    extra information within an IP packet’s payload.


    User Datagram Protocol


    The simplest transport layer protocol is the User Datagram Protocol (UDP). Applications
    that use UDP are assigned port numbers by their hosts. Exchanged messages are
    preceded by the port numbers of both sending and receiving applications.


    To communicate via UDP, an application first creates a socket. A socket is a communication
    channel between the application and its host. Suppose there’s a calendar application
    running at Facebook using UDP port number 18. An application running on Ada’s
    host can send a message to this hypothetical Facebook application as follows:


    socket ← SOCKET.new(IP, UDP)


    message ← "When is Charles’ birthday?"


    facebook\_address ← 2a03:2880:f003:c07:face:b00c::2


    app\_port ← 18


    socket.sendto(message, facebook\_address, app\_port)


    When sending this message, Ada’s host automatically assigns an unused port number
    to the newly created socket. Let’s suppose that it selects the port number 54321.
    The IP packet that’s transmitted when sendto() is called will look like this:


    ![](image/01-29-h.jpg)


    Figure 1.29 When an IP packet’s payload conforms to the UDP format, it’s called
    a datagram. Packets carrying datagrams have their protocol number set to 0x11.


    A host can manage thousands of different sockets for its applications. A single
    application can even create multiple sockets to operate many communication channels
    in parallel. Each socket gets assigned its own port number by its host.


    Consider our hypothetical calendar application on Facebook’s host. Upon receiving
    Ada’s initial contact, it returns a datagram with destination port 54,321 in a
    packet for Ada’s IP address. Ada’s app waits for this datagram by calling another
    socket method:


    received ← socket.recv()


    This halts Ada’s application until a datagram arrives at port 54,321. Once that
    happens, the incoming data is stored in received, and the application resumes.


    CLIENT & SERVER For two applications to communicate, one must be waiting for contact
    and the other must initiate it. We call the former a server, and the latter a
    client. In our example, the Facebook application is the server and Ada’s application
    is the client. However, Ada’s application could also act as a server. It must
    simply create a socket, bind it to the port at which it expects to receive datagrams,
    and wait for contact:


    socket ← Socket.new(IP, UDP)


    socket.bind(17)


    received ← socket.recv()


    You select your server’s port number. If another application in the host already
    has a socket bound to that port, bind() throws an error. When recv() is called,
    the application halts until a datagram bearing your port number arrives. Along
    with the datagram’s data, the sender’s IP address and source port number are stored
    in the received variable. This way, the application can choose to reply if it
    must:


    received ← socket.recv()


    x ← process\_data(received.data)


    socket.sendto(x, received.src\_ip, received.src\_port)


    UDP CHECKSUM We’ve seen that every computer and router on a network can check
    the integrity of Ethernet and WiFi frames it receives thanks to their FCS field.
    A datagram inside an IP packet is carried on a different frame for each link,
    therefore the FCS changes at every hop. Unfortunately, this means there is no
    way for a host receiving a datagram to know if all these FCS have been properly
    generated and verified.


    To address this issue, each datagram carries its own integrity checker called
    the UDP checksum. This checksum is only generated once and verified once, by its
    sending and receiving hosts respectively. Corrupted datagrams are automatically
    discarded by the receiving host, so its applications can trust incoming data has
    not been accidentally damaged.


    UDP LIMITATIONS A datagram must be short enough to fit inside the payload of one
    IP packet. Since the MTU for the bulk of the Internet is 1,500 bytes, most datagrams
    are designed to respect that limit. A heavy message, such as a large photo, must
    be sent through multiple IP packets.


    Recall that any IP packet may hit an overloaded router in its path and be dropped.
    Sometimes, hosts are not even notified when their packets disappear. Furthermore,
    packet handling by routers can cause them to arrive disordered or duplicated.
    This makes it difficult to recover data that is split in multiple datagrams.


    UDP is best suited for applications whose requests and replies fit in one datagram
    each. Ideally, an application should send a single request at a time, and only
    send the next datagram once it has received a reply. If the reply takes too long
    to arrive, the application should either give up or try sending the same datagram
    again.


    Datagrams are also suitable to transmit data flows in which occasional data loss
    is acceptable, such as when transmitting a live telephone call, where small audio
    glitches don’t matter much.


    Transmission Control Protocol


    The transport layer can do more than match data from IP packets with their corresponding
    application sockets. When using the Transmission Control Protocol (TCP) instead
    of UDP, hosts will add even more extra information to IP packet payloads. This
    allows TCP to offer functionalities that enhance the reliability of communications
    between applications.


    With TCP, applications exchange data as if a direct communication line with the
    other application existed–even though IP packets have a limited size and routers
    cannot be trusted to deliver them. Behind the scenes, hosts split data in shorter
    chunks and deal with lost, duplicate, and disordered packets. The application
    simply asks its host to create a connection with another application, then requests
    for its data to be sent or received.


    You can imagine UDP sockets as mailboxes that send and receive short, one-off
    messages to and from other boxes, with no guarantee of delivery. TCP sockets are
    different. Picture an active TCP socket as one end of a virtual pipe to another
    socket. All data sent through a TCP socket can be trusted to arrive intact. Let’s
    see how to build this on top of the unreliable IP packet delivery system.


