    Collecting a lot of data is like filling up a warehouse with goods. It can be
    tempting to dump everything onto random shelves and become immediately distracted
    by the cool new stuff we’re storing. However, the better organized the warehouse,
    the easier it will be to work. Organize your data as soon as it comes in.


    Data Wrangling


    The process of data collection typically yields myriad files: logs, SQL database
    dumps, spreadsheets, etc. These are called raw sources. The relevant chunks of
    information within these files have to be identified, extracted, and organized
    in a way that makes them easy to access. For example, extracting data from a web
    server access log can look like this:


    ![](image/04-03-h.jpg)


    Figure 4.3 Extracting data from a web server access log.


    Select only relevant data from the raw sources. Extract it and crunch it into
    new files using a format that computers can easily understand. We call these new
    files a dataset. Well constructed datasets can be directly analyzed without further
    organization. The process of transforming raw sources into a dataset is called
    data wrangling. Let’s explore the steps involved.


    TABULARIZATION Tables are the most common way to structure data. They’re the default
    structure for data processing: most algorithms work best on tabular data. Each
    table stores records of events or objects of the same kind. The first step of
    data wrangling is to divide all relevant data into tables.


    In tables, every record becomes a row. The different things we know about these
    records become columns. In the context of data analysis, columns are also referred
    to as variables. Figure 4.3 shows a raw text source being copied into a table
    with three variables: IP, Timestamp, and URL.


    Usually, tabular data is saved in CSV[2](#CSU-2-11.xhtml#nota4-02) format. CSV
    files can be readily imported into virtually any programming environment. If your
    raw data is made of SQL[3](#CSU-2-11.xhtml#nota4-03) tables, it’s often worth
    the effort to convert them to CSV files. Once we have one big table per data entity
    and no SQL relationships, it’s much simpler to analyze the data: there’s no need
    to resolve references across tables.


    NORMALIZATION Always check that cells in the same column are uniform. When there
    are several ways to express something, you must normalize the data. For instance,
    if a column contains temperatures, choose either Fahrenheit or Celsius[4](#CSU-2-11.xhtml#nota4-04)
    and convert other values. Three examples of normalization are illustrated on the
    next page.


    ![](image/04-04-h.jpg)


    Figure 4.4 Normalizing temperature. Be consistent in the number of decimal digits
    and the use of commas and periods. Remove extra F, C, or ° characters, and discard
    or re-express values that aren’t numbers.


    ![](image/04-05-h.jpg)


    Figure 4.5 Normalizing citizenship records. Be ready to handle unexpected cases,
    especially with old records. Should people from the Soviet Union be considered
    Russians? What about Yugoslavians?


    ![](image/04-06-h.jpg)


    Figure 4.6 Normalizing figures from different currencies and years. Because of
    inflation, one dollar in 1970 had the same purchasing power as six dollars in
    1988. On top of that, some currencies don’t even exist anymore, such as the Italian
    lira! We need historical exchange and inflation rates to normalize such numbers.


    Normalization can also involve splitting a column into two or more. Imagine that
    a museum’s database of paintings has a “dimensions” column containing text describing
    canvas sizes. It would make sense to split this into height and width columns,
    each containing well formatted numbers in a uniform measurement unit:


    ![](image/04-07-h.jpg)


    Figure 4.7 Normalizing painting dimensions.


    CLEANSING Always check that your values are of the expected type, and that they
    are reasonable. Clear cells that contain absurd data. This is called data cleansing.


    ![](image/i-04-03-h.jpg)


    DROP THE BEAT ![](image/c-coracaoalado.jpg) As the manager of a hospital’s business
    intelligence systems, you compile a report with the heart rate measurements of
    many patients. As you inspect the data, you come across some astonishing values,
    such as 819 beats per minute. What should you do about them?


    A heart rate can never be negative. A quick Internet search informs us the highest
    heart rate ever recorded was about 600 beats per minute. Records outside the range
    (0, 660) can be safely dropped.[5](#CSU-2-11.xhtml#nota4-05) The cell that reads
    819 should be set to NULL, or removed entirely.'
