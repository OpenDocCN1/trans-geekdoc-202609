    On the flip side, caching slows down the propagation of changes around the network:
    DNS servers only update their cached NS records from time to time. Specifically,
    the Time-To-Live (TTL) value of a record indicates how long it may be stored in
    cache.


    In previous examples, we’ve been omitting the TTL values for simplicity, but every
    record has one. It is typically displayed before the record type:


    br.           149836    NS   a.dns.br.


    This record has a TTL value of 149,836, indicating that it may be cached for that
    many seconds. About 41 hours after this record is retrieved by a DNS server, it
    must be dropped from its cache. Setting a low TTL value makes future changes to
    the record propagate faster. However, higher TTL values allows servers to waste
    less resources on refreshing cache.


    Types of Records


    We’ve seen two DNS record types: AAAA, that links IP addresses to domains; and
    NS, that grants name servers authority over domains. Many other record types exist.
    Let’s see the most common ones.


    ADDRESS When DNS was invented in 1983, the A record type was used for IP addresses.
    In 2012, IP was upgraded and addresses became four times longer. The AAAA record
    type was created to store the new addresses. This way, legacy IP keeps working
    unaffected as networks upgrade. Domains can have both records, for instance:


    one.one.one.one.     AAAA   2606:4700:4700::1111


    one.one.one.one.        A   1.1.1.1


    If you have an outdated connection that only supports IPv4, you can query for
    A records and send IPv4 packets to the retrieved address instead of IPv6 packets.


    TLDs can’t have A or AAAA records. This is the reason why there is no website
    at http://com/ or http://google/. Single-label names are only used for addressing
    within Local Area Networks. The most common one is localhost, and it always points
    to a computer’s own network interface.


    MAIL EXCHANGE If you want to give Code Energy feedback on this book, you can write
    an email to hi@code.energy.[8](#CSU-2-9.xhtml#nota2-08) But how would your email
    system know where to dispatch your email for it to reach our servers?


    Similarly to the Web, email depends on DNS. An MX record specifies a host responsible
    for receiving email for a domain. In order to send an email to maria@icmc.usp.br,
    the first step is to look up the MX records for icmc.usp.br. Let’s dig:


    dig icmc.usp.br. MX


    Each MX record includes a host name and a priority number:


    icmc.usp.br.           MX     1   aspmx.l.google.com.


    icmc.usp.br.           MX     5   alt1.aspmx.l.google.com.


    icmc.usp.br.           MX     5   alt2.aspmx.l.google.com.


    icmc.usp.br.           MX    10   alt3.aspmx.l.google.com.


    These records indicate that the owner of icmc.usp.br chose Google to receive email
    on their behalf. You can connect to any of those hosts to send an email to icmc.usp.br,
    but you should favor the one with the lowest priority number.


    As for A and AAAA records, TLDs cannot have MX records. That’s why there’s no
    such email address as ada@io or larry@google.


    CANONICAL NAME In the early days of the Web, people started to configure servers
    in their organizations for processing requests for web pages. It was usual to
    name such a server “www”, so http://www.example.com/ became the expected web address
    for example.com. More recently, many are dropping the “www” part from their web
    addresses. A special CNAME record allow us to define a subdomain that’s merely
    an alias:


    www.code.energy.    CNAME    code.energy.


    It instructs anyone trying to retrieve a record for www.code.energy to instead
    consider the records from code.energy.


    TEXT It’s possible to link arbitrary text to a domain using TXT records. This
    is often used for proving ownership of a domain, but you can use it for anything
    else. We left a special message for you in TXT records associated with enigma.code.energy.
    Will you be able to find the message? Remember, you can use dig to query any type
    of record that’s linked to any domain.


    Reverse DNS


    DNS is most used to get the IP address associated with a given domain. However,
    it also works in reverse: it can find which domain is associated with a given
    IP address. The trick is to re-express the IP address as a subdomain of ICANN’s
    special TLD arpa. For example,


    icmc.usp.br. AAAA             2001:12d0:2080::231:6


    ...becomes:


    ![](image/reversedns.jpg)


    Thanks to ICANN, there is a unique arpa subdomain corresponding to every IP address.
    A PTR record may be set for that subdomain in order to associate it with a domain
    name.


    Authority over arpa belongs to IANA. When an IP address block is given to an organization,
    the organization also receives authority over the corresponding arpa subdomains.
    When a computer is allocated an IP address and a domain name, it’s good practice
    to record the pair in a PTR record using the IP address’s arpa subdomain.'
