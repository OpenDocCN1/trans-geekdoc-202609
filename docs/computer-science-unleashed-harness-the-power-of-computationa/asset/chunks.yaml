    When ICANN authorizes the creation of a TLD, it often requires the new owner to
    allow the general public to register subdomains. That is the case for most of
    the existing TLDs, including com, net, and energy. In order for Verisign to maintain
    their ownership of com, they are required by ICANN to accept requests for the
    creation of com subdomains by anyone.


    Sometimes, ICANN allows owners of TLDs to use them for exclusive interests. For
    instance, gov, and mil are controlled by the US government. They only create domains
    for American government bodies, such as nasa.gov, and spaceforce.mil. Likewise,
    the owner of edu only allows American educational institutions to have .edu domains,
    such as mit.edu and caltech.edu. Likewise, Google uses their TLD exclusively for
    company affairs, such as grow.google and blog.google.


    In addition to general-use TLDs and exclusive-use TLDs, ICANN assigns two-letter
    country-code TLDs and cedes their control to their respective governments. Colombia
    has co, the United States has us, and the British Indian Ocean Territory has io.[5](#CSU-2-9.xhtml#nota2-05)
    Occasionally, ICANN creates TLDs for famous geographical areas. For instance,
    rio was given to the Rio de Janeiro city council.


    Name Servers


    DNS records link data to domains. A domain can have many records, each binding
    a chunk of data to the domain. All records have a code that indicates the type
    of information they carry. For example, AAAA records link a domain to an IP address:[6](#CSU-2-9.xhtml#nota2-06)


    sprint.net.     AAAA   2600::


    All DNS records must be stored on name servers: special hosts that will share
    their records with anyone on the Internet at any time. A domain’s owner must grant
    at least two name servers with the authority to store its DNS records. Domain
    owners may either provide these servers themselves or hire third parties to do
    so.


    Ownership of domains is enacted through DNS records. For example, recall Verisign
    owns com. In principle, Verisign’s name servers would contain all records for
    .com domains, including google.com. However, this is not the case, because Verisign
    keeps the following records in its name servers:


    google.com.      NS    ns1.google.com.


    google.com.      NS    ns2.google.com.


    ns1.google.com.  AAAA  2001:4860:4802:32::a


    ns2.google.com.  AAAA  2001:4860:4802:34::a


    An NS record states that the given Name Server has authority over a domain. With
    the above records, Verisign delegates the responsibility to store all records
    associated with google.com. Verisign effectively hands control of the domain to
    Google, who hosts the cited name servers. This gives Google the authority to set
    DNS records for google.com in their own name servers.


    ROOT SERVERS Special name servers called root servers are appointed by ICANN to
    have the authority to store DNS records of TLDs. New TLDs are created when ICANN
    asks NS records to be added to these servers. There are 13 root servers–ICANN
    makes their IP addresses well known. The University of Maryland, NASA, and the
    US Army are some of the entities that host a root server.


    Querying


    Name servers have two functions: store records and answer queries. Most Internet
    applications rely on them. Your web browser, for example, only works if it has
    a way to discover the IP addresses of the websites you wish to reach.


    Name servers expect queries on UDP port 53. Typically, a DNS query message and
    its reply fit in one datagram. To illustrate how it works, let’s query name servers
    using the dig[7](#CSU-2-9.xhtml#nota2-07) program. It sends a datagram to the
    IP address we specify, containing a query that conforms to the DNS protocol. Dig
    is invoked from the command line as follows:


    dig @\[address\] \[domain\] \[type\]


    This sends a datagram to the given address on UDP port 53, asking for records
    of a specific type, associated with the given domain. When a datagram arrives
    in response, dig decodes it and displays the records in plain text.


    Suppose we want to connect with icmc.usp.br, but we only know the IP address of
    NASA’s root server: 2001:500:a8::e. Let’s ask NASA what’s the name server responsible
    for icmc.usp.br:


    dig @2001:500:a8::e icmc.usp.br. NS


    The root server replies with the following records:


    br.            NS   a.dns.br.


    a.dns.br.    AAAA   2001:12f8:6::10'
