- fmt: "\n# Recommended Reading\n\n* `Machine Learning for Absolute Beginners`, by\
    \ Theobald\n  - Get it at [https://code.energy/theobald](https://code.energy/theobald)\n\
    * `The Data Science Design Manual`, by Skiena\n  - Get it at [https://code.energy/skiena](https://code.energy/skiena)\n\
    * `Deep Learning`, by Goodfellow\n  - Get it at [https://code.energy/goodfellow](https://code.energy/goodfellow)\n\
    * `The Elements of Statistical Learning`, by Tibshirani\n  - Get it at [https://code.energy/tibshirani](https://code.energy/tibshirani)\n\
    * `Prof. Raschka’s paper on Model Evaluation and Selection\n  - Get it at [https://code.energy/raschka](https://code.energy/raschka)\n\
    \n# Notes\n\n1. Up to 2% of us are born intersex, for instance with `XXY` chromosomes.\
    \ A binary encoding may be used if predictions don’t directly affect individual\
    \ patients, for example if hospitalization times are estimated for internal logistical\
    \ purposes.\n2. The `Bag-of-Words` is the most used method to create features\
    \ from word frequencies. See [http://code.energy/bag-of-words](http://code.energy/bag-of-words)\
    \ for more.\n3. In theory, there are trillions of trillions of trillions of trillions\
    \ of different possible validation sets that use 10% of our 365 records. Our first\
    \ book, `Computer Science Distilled` explains how to count such combinations.\n\
    4. For an interactive explanation of `PCA`, see [http://code.energy/pca](http://code.energy/pca).\n\
    5. The number of subsets from a set with `n` elements is `2^n`.\n6. Backward elimination\
    \ and forward selection are forms of greedy heuristic methods we described in\
    \ our first book, `Computer Science Distilled`.\n7. When you gain some experience,\
    \ you’ll discover methods that automatically search through many hyperparameter\
    \ settings for a given model and select the best one automatically.\n\n# Conclusion\n\
    \nWe have actually succeeded in making our discipline a science, and in a remarkably\
    \ simple way: merely by deciding to call it ‘computer science’.\n\n— DONALD KNUTH\n\
    \nThis book presented ways in which computer science unleashed powers that enabled\
    \ programmers to build the digital world we live in. By using these concepts yourself\
    \ to play with networks and data science, you will contribute to an even more\
    \ resourceful society.\n\nWe tried to limit the depth of our exploration to an\
    \ introductory level. The goal was to show you the essentials that everyone who\
    \ works with code should know. We hope to have sparked your curiosity to keep\
    \ exploring with the books referenced at the end of each chapter. You will also\
    \ find after this conclusion a bonus chapter about regular expressions: a technique\
    \ for searching patterns which will help you with the processing steps of any\
    \ data analysis or machine learning task.\n\nWe want to include more topics in\
    \ the next edition of this book. For instance, when presenting machine learning,\
    \ we skipped the algorithms that enable computers to gather knowledge without\
    \ human supervision. And we haven’t talked about cloud computing, which enables\
    \ new worlds to be created much faster. Stay tuned if you’re interested in these\
    \ topics! If you bought this book directly from us, you will get this content\
    \ for free.\n\nHopefully, this book improved your theoretical understanding of\
    \ computational systems. Now, it’s time to get out there and play! Start a new\
    \ coding project and practice what you learned. As a wise coder once said:\n\n\
    “If you find that you’re spending almost all your time on theory, start turning\
    \ some attention to practical things; it will improve your theories. If you find\
    \ that you’re spending almost all your time on practice, start turning some attention\
    \ to theoretical things; it will improve your practice.”\n\nLastly, don’t hesitate\
    \ to send us your feedback on the book: email us at `hi@code.energy`. The feedback\
    \ we received from our first book, `Computer Science Distilled`, motivated us\
    \ to write this one and brought our attention to details in our writing style\
    \ that could be improved. Thank you!\n\n# Bonus\n\n## Patterns\n\nRegular expressions\
    \ allow you to master your data. Control it. Put it to work for you. To master\
    \ regular expressions is to master your data.\n\n— JEFFREY FRIEDL\n\nCoders often\
    \ work with data that matches a given pattern. Let’s consider a document containing\
    \ dates written as “Feb 27th 2013”, “27/2/13” and “2013-02-27”. How do we find\
    \ all the dates in such a file? Writing programs to detect patterns is time-consuming\
    \ and quite tedious.\n\n![](image/07-01-h.jpg)\nFigure 7.1 Don’t ask your boss\
    \ on a date!\n\nThankfully, we can define patterns such as date formats using\
    \ regular expressions. These expressions can then be interpreted by existing software\
    \ so we don’t have to write the pattern-matching code ourselves. In this chapter,\
    \ we’ll learn to:\n\n![](image/c-olhos.jpg)\n* Match basic patterns,![](image/c1a.jpg)\n\
    * Precisely quantify repeating patterns,![](image/c.jpg)\n* Anchor patterns to\
    \ locations,![](image/ancora.jpg)\n* Capture groups of items within a pattern,![](image/familia.jpg)\n\
    \nAlso referred to as `regex` or `regexp`, regular expressions are tremendous\
    \ timesavers loved by programmers. In fact, they are already built in most languages,\
    \ source editors, command line tools.\n\n![](image/07-02-h.jpg)\nFigure 7.2 “I\
    \ used to be a stuttering piece of code.”\n\n### Matching\n\nA regular expression\
    \ is like a search term on steroids. Consider the following:\n\n```\nDistrict\
    \ 1, Paris\n```\n\nThat’s a simple regular expression, and it works as typical\
    \ search. A regular expression engine is a program that will interpret this expression,\
    \ run it against some text, and report a match if the string “District 1, Paris”\
    \ can be found. There are slight variations in syntax, features, and behaviors\
    \ across engines. Nerds call them flavors.\n\nMost flavors are case-sensitive\
    \ by default, so “district 1, paris” would not have matched. Fortunately, they\
    \ also allow you to configure the way they crunch data through flags. For example,\
    \ the case insensitive flag (typically denoted `i`) would allow us to find “district\
    \ 1, paris” from our capitalized expression.[nota-01]\n\nWe strongly encourage\
    \ you to try all the regular expressions in this chapter. Open [http://code.energy/regex](http://code.energy/regex)\
    \ and you’ll see a field for your regular expression, and a text box for test\
    \ input. It will show where the expression matches the input. You can also set\
    \ flags. Try it and observe how the case insensitive flag affects your matches!\n\
    \n### The Dot\n\nLet’s suppose you want to search for any of these phrases:\n\
    * “District 1, Paris”,\n* “District 2, Paris”,\n* “District 3, Paris”,\n* “District\
    \ 4, Paris”.\n\nInstead of carrying out four searches, we can let the tenth character\
    \ of a single search match anything:\n\n```\nDistrict ., Paris\n```\n\nIn regular\
    \ expressions, the dot `.` has a special meaning: it will match any single character.\
    \ Our expression will even match phrases we’re not interested in such as “District\
    \ 0, Paris” and “District !, Paris”. Nevertheless, the dot provides a quick way\
    \ to find text that loosely matches your pattern. Consider this expression:\n\n\
    ```\nc.........y\n```\n\nIt matches “calligraphy”, “consistency”, and “chaotically”,\
    \ and since the dot also matches the space character, “can be easy” and “code\
    \ energy” are also matched. Note that boundaries between words aren’t considered\
    \ here, so “cisco enjoy” will be found in “Francisco enjoyed”. Let’s see how all\
    \ this allows us to do far more than a static search:\n\nDOMAIN NAME ![](image/c-mundo.jpg)\
    \ You remember an email mentioning a website that ends with mil and a country\
    \ code. You don’t remember much else: it could be `mil.br/`, `eng.mil.ru/`, `mil.be/frite`,\
    \ etc. How can you find the domain?\n"
