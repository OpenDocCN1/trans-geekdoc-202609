    After these steps, encrypted HTTP messages can be exchanged between client and
    server. When TLS is used with HTTP, we call the resulting protocol HTTPS. While
    HTTP uses port 80 by default, HTTPS defaults to port 443. Web servers listening
    to TCP port 443 expect the client to send the first TLS message right after the
    connection is established.


    TLS is used in several other protocols besides HTTPS, including SMTP. There are
    programming libraries that make it easy for coders to use TCP with TLS. Instead
    of manually creating and securing a regular TCP socket, the coder uses the library’s
    functions to directly create a TLS socket. Behind the scenes, the library takes
    care of all the encryption work. Programmers can operate TLS sockets almost exactly
    as they would operate TCP sockets.


    ## Other Protocols


    Many other security protocols exist. For instance, `IPsec` is an IP extension
    that provides security to all IP-based communications. Contrarily to IP packets,
    `IPsec` packets can’t be read or be altered while they travel. `IPsec` is often
    used to create Virtual Private Networks (VPNs), where an Internet connection acts
    as a physical link so that a computer can join a distant local network as if it
    were there.


    DNS also has its own secure extension called `DNSSEC`. It extends DNS records
    with digital signatures. This enables anyone to verify that a signed DNS record
    was created by its owner. Without `DNSSEC`, a DNS server can send you forged DNS
    records in order to direct you towards a malicious host. As of 2020, `DNSSEC`
    isn’t widely used, but adoption is improving steadily.


    Protocols for securing wireless communications are widely used. For example, they
    prevent people with radio sniffers from reading the contents of your IP packets
    transmitted via secure WiFi. They also allow you to type on a wireless Bluetooth
    keyboard without the risk of your keystrokes being recorded by an unauthorized
    machine.


    Today, the lack of email security is a big concern. Emails can be transmitted
    securely using `SMTP` with TLS, but the vast majority of mail servers store emails
    in plaintext. Large email providers such as `Gmail` or `Hotmail` may read the
    emails of their users if they wish. Most security experts agree that a message
    should only be readable by its sender and recipient. Communication systems that
    adhere to this principle are said to use end-to-end encryption. Some instant messaging
    applications—such as `Signal`, `Threema` and `WhatsApp`—use end-to-end encryption.
    New protocols are actively being developed to make end-to-end encryption widely
    available for email.


    ## 3.6 Hacking


    A hacker is a person with strong computer skills who is able to achieve certain
    goals in non-standard ways. In popular culture, hackers are often portrayed as
    geeky wizards who can infiltrate military-grade computer systems with a few keystrokes.
    Although movies aren’t always realistic, there is some truth to the idea that
    hackers are an elite force. Hackers often specialize in low-level computing, understanding
    in detail each step a computer takes to execute a simple action.


    Most of the time, hackers are IT security specialists who have a deep understanding
    of network protocols and are capable of manipulating individual bits in network
    packets. They use their skills to uncover loopholes that allow them to `pwn` a
    machine[23](#CSU-2-10.xhtml#nota3-23)—to gain control over it and perform tasks
    without permission.


    This doesn’t mean that all hackers are bad guys. White hat hackers work hard to
    ensure no harm is caused by vulnerabilities they uncover. Black hat hackers, on
    the other hand, exploit vulnerabilities for personal gain or to cause damage.


    ## Social Engineering


    Hacking often takes advantage of humans rather than computers. Social engineering
    is the art of manipulating people into divulging confidential information or performing
    actions that compromise security.


    ### Social Engineering


    Most of the time, hackers are IT security specialists who have a deep understanding
    of network protocols and are capable of manipulating individual bits in network
    packets. They use their skills to uncover loopholes that allow them to `pwn` a
    machine[23](#CSU-2-10.xhtml#nota3-23)—to gain control over it and perform tasks
    without permission.


    Social engineering attacks can take many forms, including phishing and vishing.


    ![image/03-10.jpg](image/03-10.jpg)

