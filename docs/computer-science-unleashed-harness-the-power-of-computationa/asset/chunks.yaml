    can get overwhelmed. To ensure they are always capable of processing incoming
    data, hosts include a window size alongside the acknowledgment number. It indicates
    the number of bytes of data they are willing to receive beyond the last segment
    they acknowledged.


    Senders suspend their transmission of unacknowledged segments whenever their total
    size reaches the window size of their counterpart. This is called flow control,
    and it ensures the computational capabilities of each host isn’t exceeded. Using
    TCP, applications don’t have to worry about congestion control and flow control,
    as those are taken care of by their hosts. On the other hand, applications using
    UDP are responsible for adapting the sending rate to the network bandwidth and
    to the computational resources of their counterparts.


    TCP CHECKSUM Similarly to UDP datagrams, TCP segments include a checksum. It is
    added by the sending host and verified by the receiving host. If a corrupted segment
    is received, it is discarded without being acknowledged. This ensures all chunks
    of data eventually reach their destination free of errors.


    TCP Connection


    TCP communications are always conducted through a pair of segment threads called
    a TCP connection, as seen on Figure 1.31. Before two applications can start exchanging
    data through a TCP connection, their hosts must be able to recognize and sort
    the segments of that connection. They do so by remembering which port numbers
    correspond to which thread. Each host also chooses an initial sequence number
    to start its side of the connection, and it acknowledges the initial sequence
    number of its counterpart.


    For these reasons, establishing a TCP connection requires the exchange of three
    segments between the client and the server. The first two segments carry a special
    SYN flag[16](#CSU-2-8.xhtml#nota1-16) that serves to synchronize the sequence
    and acknowledgment numbers of the threads. Additionally, an ACK flag is carried
    by segments whose acknowledgment numbers are valid and synchronized. The third
    segment can already begin carrying application data:


    ![](image/01-32-v-01.jpg)


    ![](image/01-32-v-02.jpg)


    ![](image/01-32-v-03.jpg)


    Figure 1.32 Hosts initiate TCP connections with random sequence numbers. We consider
    the connection is fully established from the moment the third segment is received,
    as both hosts obtained the acknowledgment of their sequence number.


    Before the segment exchange in Figure 1.32 takes place, Charles has to ask his
    host to expect incoming TCP connection requests at port number 20. When Ada requests
    her host to start a new connection with Charles on port 20, Ada’s host picks a
    port number at random to assign the connection–here, the port 61,311 was chosen.


    As long as a connection is active, hosts keep track of sequence numbers, acknowledgment
    numbers, and window sizes. They time acknowledgments from their counterparts and
    decide when to send the next segments accordingly. The application remains blissfully
    unaware of all this work, as it simply calls TCP socket methods to connect, send,
    and receive.


