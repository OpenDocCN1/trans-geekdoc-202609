- fmt: '

    # BROKEN ACCESS CONTROL

    This occurs when a system performs a potentially dangerous action without checking
    if the user has permission to perform it, for example when developers forget to
    add permission checks to their code or when a piece of software is misconfigured.
    In 2016, a tech company working with voter data left their database online without
    a properly configured password. As a result, private data from 154 million US
    voters was exposed. Read the manuals from all software you choose to use and configure
    them properly to restrict access.


    # SQL INJECTION

    It’s the most common vulnerability. It enables a hacker to run any `SQL` code
    in a database, which often allows attackers to arbitrarily read, write and delete
    data. Imagine that you’re a school manager and a new student joined your school.
    The school clerk enters the name of the new student into a computer. The school’s
    management software uses the name typed by the clerk to send an `SQL` query like
    this to its database:


    ```sql

    INSERT INTO Students (name)

    VALUES (''image/p-quadpreto.jpg) '');

    ```


    In this example, the input `image/p-quadpreto.jpg` should be replaced by the software
    with the name the clerk typed into the system. What would happen if the clerk
    tried to register the name below?


    `Robert''); DROP TABLE Students;--`


    If the school’s software is vulnerable to SQL injections, it will blindly copy
    whatever input into the query. Here’s the query that would now be executed by
    the system:


    ```sql

    INSERT INTO Students (name)

    VALUES(''Robert''); DROP TABLE Students;\--'');

    ```


    When inserting a new student record with this maliciously crafted name, there
    is a side-effect: an entire table gets deleted from the database. To defend against
    this kind of attack, check all your inputs and replace any character that can
    cause side-effects, such as quotation marks.


    SQL injection attacks are quite common. In 2012, hackers attacked several US government
    websites, including NASA, the FBI and the Pentagon. As a result, personal data
    from over a million employees and contractors became publicly available on the
    Internet.


    Injection attacks are one of many types of vulnerabilities caused by bad handling
    of inputs. You must check not only the content, but also the sizes of external
    inputs you allow into your system.


    # BUFFER OVERFLOW

    Before programs can process any input, the input must be copied to an internal
    memory space called a `buffer`. If the input data is larger than the buffer and
    there are no checks in place, data will continue to be copied into the memory
    and past the end of the buffer. This means parts of the input end up in unintended
    locations of the memory. This is called a buffer overflow. It may cause the system
    to crash, or worse: if an attacker manages to write data in a specific location,
    the host computer might be tricked into executing parts of the input as code.


    When hackers are given the opportunity to execute malicious code in a machine
    through a buffer overflow, they will often obtain full control over it. This type
    of vulnerability is difficult for hackers to find, yet it is common in major operating
    systems and consumer software. For instance, in 2015, one was found in Adobe Reader,
    a widespread application for opening PDF files. Before Adobe released a software
    update to fix the issue, hackers could craft a PDF file containing malicious code
    that would trigger a buffer overflow. If users opened the document on their computers,
    the malicious code would be covertly executed!


    # ZERO-DAYS

    Many companies offer large bounties for hackers who responsibly report security
    vulnerabilities. However, many black hat hackers and government spying agencies
    will not disclose the vulnerabilities they find. They might use the vulnerability
    on high-profile targets or sell their discovery to other hackers. Vulnerabilities
    that aren’t publicly known to exist and are used by a select group of hackers
    are called zero-day vulnerabilities. It’s estimated that every widely used piece
    of software or operating system has several zero-days. This would mean that almost
    any computer can be hacked by government agencies and elite hacking groups.


    # Exploits

    Vulnerabilities are often discovered in mainstream software. After word about
    a new vulnerability is out, hackers are quick to code a generic attack sequence
    for susceptible systems. Such a piece of code is called an exploit. Depending
    on the vulnerability, an exploit can bring a vulnerable machine-line, expose private
    information, or worse: make the computer execute malicious code. If an exploit
    is made public, anyone can use it to hack into vulnerable systems with minimal
    effort.


    Every day, the number of known vulnerabilities grows, and there are elaborate
    tools that help hackers take advantage of them. For example, `Metasploit` is a
    program that automatically screens a system for known vulnerabilities and runs
    the relevant exploits. To do this, `Metasploit` consults a large, regularly updated
    database of vulnerabilities and their respective exploits. It can also scan computers
    over a network and probe each one for possible vulnerabilities.


    Just as hackers can use these tools to find weaknesses in your systems, so can
    you! Organizations that develop and maintain these hacking tools believe in offensive
    security: making it easy to hack into known vulnerabilities so that people can
    also easily know where their systems are insecure and require attention.


    # ROOTKITS & KEYLOGGERS

    The bad code hackers try to execute on their victim’s computer is called a `payload`.
    There are two main types of payloads. `Rootkits` allow the hacker to covertly
    access a shell in the host computer. `Keyloggers` record everything that’s typed
    on the keyboard so that it can later be retrieved by the hacker. If the hacker
    manages to make their victims execute these malicious payloads, they will typically
    remain hidden and run in the background undetected, causing harm for a large period
    of time.


    # ANTIVIRUS SOFTWARE

    So-called antivirus software inspects all the data that is stored in a computer
    and the code that it executes. It tries to detect payloads and prevent them from
    being run or propagated further. Antivirus software providers constantly monitor
    the Internet and catalog any rootkit or keylogger they can find. However, hackers
    relentlessly mutate payloads in order to evade detection. At any given time, there
    are several strains of payloads that haven’t been discovered by any antivirus
    provider. Antivirus software helps, but it doesn’t defend against sophisticated
    attacks.


    Due to the pace at which exploits propagate, developers are expected to release
    updates fixing software vulnerabilities as fast as possible. Once there is an
    update fixing a vulnerability, it is said to have been patched. People using the
    vulnerable software should apply security updates as fast possible to avoid getting
    pwned.


    Developers should always stay informed about the libraries they use to ensure
    they’re not building on third-party code that has unpatched vulnerabilities. Likewise,
    system administrators should stay informed about the newest patches to the software
    they’re running, especially for critical infrastructure such as web servers, mail
    servers and database servers.


    There’s a resource that can help us stay informed: the Common Vulnerabilities
    and Exposures (`CVE`) public list. As soon as a vulnerability becomes known, it
    is added to the `CVE` list and is assigned a number. If you check typical software
    update descriptions, you will often see patches to security vulnerabilities referenced
    by their `CVE` number. You can consult the `CVE` list to be aware of any known
    vulnerabilities in the software you’re currently using.

