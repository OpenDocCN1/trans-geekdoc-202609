    Building on that assumption, there’s a sentence that starts with `PE`, which could
    either stand for ‘be’, ‘he’ or ‘we’. We already have a mapping for `H`, so we
    try `B` → `P` and `W` → `P`. The former takes us to a dead end: the sentence would
    then start with the phrase `BE BQJH`, which could only make sense if it stood
    for “be both”, creating a conflict with our previous mapping `T` → `D`. Therefore,
    we retain `W` → `P`:


    ```

    THE KVYBVHE WVJ OEZQMESEO TW CWES WQLE KESJWFVZZC.EMESCTHQFH QJ VZZ SQHHT WQTH
    THE LVGQZC. WE WQJH CWE JEYYEJJ. HSEETQFHJ LSWG THE YWGSVOEJ.

    ```


    Let’s have a look at the words with fewest missing letters. For instance, `WQTH`
    immediately gives us `I` → `Q`. With this new mapping, `WQJH` becomes `WIJH`,
    which in turn gives us `S` → `J`:


    ```

    THE KVYBVHE WVS OEZIMESEO TW CWES WILE KESSWFVZZC. EMESCTHIFH IS VZZ SIHHT WITH
    THE LVGIZC. WE WISH CWE SEYYESS. HSEETIFHS LSWG THE YWGSVOES.

    ```


    Again, we look for the words with fewest missing letters: `WVS` gives us `A` →
    `V` and `TW` gives us `O` → `W`. In addition, the fact an unknown character appears
    twice in the same word can also be a clue: `SEYYESS` gives us `U,C` → `E,Y` and
    `HSEETIFHS` gives us `G,R,N` → `H,S,F`:


    ```

    THE KACBAGE WAS OEZIMEREO TO COUR WILE KERSWNAZZC. EMERCTHING IS AZZ RIGHT WITH
    THE LAGIZC. WE WISH COU SUCCESS. GREETINGS LROG THE COGRAOES.

    ```


    The closer we get to the solution, the faster we advance! `COUR` and `COU` give
    us `Y` → `C`, `EMERYTHING` gives us `V` → `M`, and `EVERYTHING IS AZZ RIGHT` gives
    us `L` → `Z`:


    ```

    THE KACBAGE WAS OELIVEREO TO YOUR WILE KERSWNALLY. EVERYTHING IS ALL RIGHT WITH
    THE LAGILY. WE WISH YOU SUCCESS. GREETINGS LROG THE COGRAOES.

    ```


    We’re almost there! The missing mappings can quickly be resolved to `P,K,D,F,O,M`
    → `K,B,O,L,W,G`, and the plaintext holds no more secrets:


    ```

    THE PACKAGE WAS DELIVERED TO YOUR WIFE PERSONALLY. EVERYTHING IS ALL RIGHT WITH
    THE FAMILY. WE WISH YOU SUCCESS. GREETINGS FROM THE COMRADES.

    ```


    Finally, we can write down what we know of the encryption key, in case we find
    a new ciphertext that also uses it. The missing letters are those that don’t appear
    in the message:


    ![](image/i-08-07-h.jpg)


    As you can see, this simple substitution cipher is not very secure, as we were
    able to crack it in a few straightforward steps. Although these ciphers are more
    challenging when the position of spaces is unknown, computers can make quick work
    of them regardless. To try that out, head over to [http://code.energy/substitution](http://code.energy/substitution).


    ## Evaluating Classifiers


    In Chapter 5, we learned about prediction models: algorithms that can make a series
    of predictions, which we call `y`, given data related to each prediction, which
    we call `X`. There are two types of models. Regressors make numerical predictions,
    while classifiers predict an outcome into groups. We already learned how well
    a regressor is making its predictions. Let’s now learn how to score classifiers
    as classifiers predict labels, let’s start simple: `y` is made of binary data.
    Since it has only two labels, all we need is a yes or no for each row. We call
    this binary classification. Predicting if a patient will develop or if a credit
    card purchase is fraudulent are examples of binary classification. A natural,
    naive approach is to evaluate the percentage of correct predictions, called the
    accuracy. However, this is often a terrible way to assess how well a model is
    doing. Let’s see how it fares:


    FINDING FRAUD ![](image/c-cartaocred.jpg) You’re the tech of a bank trying to
    prevent card fraud. They asked you to create a model that predicts if a payment
    is fraudulent based on transaction details. You trained two models—a chilled model
    ![](image/c-oculosescuros.jpg) and a paranoid model ![](image/c-terror.jpg)—to
    predict fraud on existing data of 1,000 transactions, of which 10 are known cases
    of fraud. You now wish to compare their performance. Here is how each of the three
    models performed:


    ![](image/c-sono.jpg) Found no fraud, incorrectly called 10


    ![](image/c-oculosescuros.jpg) Found 8 frauds, incorrectly called 19


    ![](image/c-terror.jpg) Found all frauds, incorrectly called 87.


    ### Which model is most accurate?


    The paranoid model missed no frauds, therefore it made `0+87=87` correct predictions,
    yielding an accuracy of 91.3%. The chilled model missed 2 frauds, therefore it
    made `2+19=21` correct predictions, yielding an accuracy of 97.9%. On the other
    hand, the lazy model missed 10 frauds, therefore it made `10+10=20` correct predictions,
    yielding an accuracy of 98%. The lazy model is the most accurate, even though
    it’s useless!


    To better evaluate classifiers, we must see how they make right and wrong predictions.
    To this end, we build a confusion table that counts correct and incorrect predictions
    for each label:


    ![](image/08-02-h.jpg)


    Figure 8.2 Confusion tables for the lazy, chilled, and paranoid classifiers. A
    unicorn ![](image/c-unicornio.jpg) classifier with 100% accuracy is shown for
    reference.


    A prediction is incorrect when the predicted label and the true label differ,
    as shown in red in fig. 8.2. Notice how the previously mentioned accuracies can
    be obtained for each table by dividing the sum of black cells by 1,000. Let’s
    now see which other metrics we can use to make sense of the confusion tables.


    ### SENSIVITY


    The percentage of fraud that a model is able to identify is the sensitivity score.
    For example:


    ![](image/c-sono.jpg) Found 0 of 10 frauds, sensitivity = 0%,


    ![](image/c-oculosescuros.jpg) Found 8/10 frauds, sensitivity = 80%,


    ![](image/c-terror.jpg) Found 10/10 frauds, sensitivity = 100%.


    Here, the best sensitivity score is obtained by the paranoid model, since it was
    able to identify the complete list of frauds. On the other hand, the chilled model
    found most frauds, but the list was incomplete. The lazy model was the least sensitive,
    since it found nothing!


    ### PRECISION


    The percentage of a model’s predictions of fraud which are correct is the precision
    score. For example:


    ![](image/c-sono.jpg) Correct about 0 of 10 predicted frauds, precision = 0%,


    ![](image/c-oculosescuros.jpg) Correct about 8/27 predicted frauds, precision
    ![](image/p-equivale.jpg) 29.6%,


    ![](image/c-terror.jpg) Correct about 10/97 predicted frauds, precision ![](image/p-equivale.jpg)
    10.3%.


    The best precision score was obtained by the chilled model, since almost a third
    of the predicted frauds were actual frauds. The paranoid model is less precise:
    only 10% of them are useful. Finally, the lazy model was the least precise, since
    all of its fraud predictions are useless!


    It is now clear that the lazy model is terrible. However, it can be difficult
    to choose which is better between the chilled and the paranoid models, since one
    has better sensitivity and the other has superior precision. Frankly, there is
    a commonly used metric that solves this issue.


    ### F1 SCORE


    A good evaluation of a model’s predictive performance considers both sensitivity
    and precision. If either is zero, the model has no predictive power, so its final
    score should be zero. To achieve this, scientists calculate a special kind of
    average (called the harmonic mean) on the sensitivity and precision scores. They
    call it the F1 score:


    ![](image/i-08-08-h.jpg)


    The F1 score ranges from 0 to 1 (or 100%). Plugging the precision and sensitivity
    scores in the formula for each model, we find:


    ![](image/c-sono.jpg) F1 = 0%,


    ![](image/c-oculosescuros.jpg) F1 ![](image/p-equivale.jpg) 0.43 = 43%,


    ![](image/c-terror.jpg) F1 ![](image/p-equivale.jpg) 0.19 = 19%.


    According to this metric, the chilled model has more than twice the predictive
    power than the paranoid model. This stems mainly from the paranoid model’s terrible
    precision.

