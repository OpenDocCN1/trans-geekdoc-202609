    For a call to go through, an operator had to physically connect the wires of two
    telephones. For long distance calls, wires were laid out between distant stations,
    and several operators in different places had to physically connect the chain
    of wires linking the two phones.


    The Internet did away with this. Wires aren’t physically reconfigured to create
    direct, exclusive links. Instead, the information is retransmitted step by step
    via a chain of linked devices until it reaches its destination. This eliminates
    the need for wire operators and central coordination. Also, wires are no longer
    constrained to serve a single connection–many concurrent connections can share
    the same wire. This allows global communications to be instant, cheap and accessible.


    However, modern networking technology is more intricate than early telephony.
    It has many successive layers, each building on top of the previous. Let’s explore
    how connections are made at these different levels, starting with the most basic
    layer.


    1.1      Links


    A direct connection between two computers is achieved through a transmission medium:
    a physical channel where signals flow. It can be a copper wire carrying electric
    currents, a fiber-optic cable directing light, or air hosting radio waves. Each
    connected computer has a network interface to send and receive signals in the
    transmission medium. For instance, cellphones have a radio chip and antenna to
    handle radio signals traveling through the air.


    ![](image/01-01-h.jpg)


