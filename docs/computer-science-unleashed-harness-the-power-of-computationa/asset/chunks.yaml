- fmt: "\nHistory teaches us the importance of staying up-to-date with advancements\
    \ in cryptography, as the vast majority of cryptographic tools can end up broken\
    \ one day. It also teaches us that hackers almost always attack systems by finding\
    \ ways to bypass cryptographic defenses rather than breaking them. This can be\
    \ done by exploiting software vulnerabilities or simply by manipulating humans\
    \ into opening the gates. These techniques have become an essential part of modern\
    \ warfare, where mission critical computer systems can be relentlessly attacked\
    \ by enemy state-sponsored hackers.\n\nThis chapter was an introduction to cybersecurity,\
    \ where we presented the basics we believe anyone in charge of potentially sensitive\
    \ systems should know. If all developers were familiar with the concepts from\
    \ this chapter, many of the destructive security breaches from the recent past\
    \ could have been be avoided.\n\nDefending computer systems against sophisticated\
    \ attacks isn’t easy, and it can sometimes only be done by highly skilled security\
    \ specialists. After all, a successful defense team must protect against all possible\
    \ attack vectors. An attacker only needs to discover a single vulnerability in\
    \ order to wreak havoc. Because of this, defense teams generally implement several\
    \ layers of security measure. That way, exploiting a single vulnerability is not\
    \ enough to break into a system.\n\nWe’ve seen that hackers can go to great lengths\
    \ to steal data. In some cases, a large data leak can even bankrupt a company\
    \ or severely damage a government. But what makes large amounts of data so valuable?\
    \ In the next chapter, we’ll explore how to understand and navigate large amounts\
    \ of data—legally obtained data, that is.\n\n## Reference\n\n* `The Code Book`,\
    \ by Singh\n  – Get it at [http://code.energy/singh](http://code.energy/singh)\n\
    * `Serious Cryptography`, by Aumasson\n  – Get it at [http://code.energy/aumasson](http://code.energy/aumasson)\n\
    * `Ghost in the Wires`, by Mitnick\n  – Get it at [http://code.energy/mitnick](http://code.energy/mitnick)\n\
    * `Hands on Hacking`, by Hickey and Arcuri\n  – Get it at [http://code.energy/hickey](http://code.energy/hickey)\n\
    \n[1] In, messages would look slightly different because Caesar only knew 23 letters...\
    \ and didn’t speak English.\n\n[2] The exclamation mark denotes a factorial: `26!\
    \ = 26 × 25 × · · · × 2 × 1`.\n\n[3] Vigenère keys are often expressed with letters\
    \ rather than numbers. This allows for shorter keys, as the numbers `0-25` are\
    \ written using one character each (`A-Z`). For example, the key `17-24-15-19-14-2`\
    \ can be written `RYPTOC`.\n\n[4] The Vigenère cipher was first broken in 1845\
    \ by Charles Babbage–the same man who designed the first programmable computer\
    \ back in 1837.\n\n[5] There’s a tool to break Vigenère ciphertext at [http://code.energy/vigenere](http://code.energy/vigenere).\n\
    \n[6] We often use the term `encryption key` to refer to the short shared secret\
    \ rather than the keystream it produces.\n\n[7] This process is equivalent to\
    \ sequential boolean XOR operations. You can learn more about boolean operations\
    \ in our first book, `Computer Science Distilled`.\n\n[8] Here, it was also agreed\
    \ that `26` corresponds to a shift of `0` positions, `27` corresponds to a shift\
    \ of `1`, etc.\n\n[9] Check the recommended ciphers here: [http://code.energy/stream](http://code.energy/stream).\n\
    \n[10] To have a `0.1%` chance of guessing a `120-bit` random key, an attacker\
    \ would have to try `106 billion` keys per second for `400 trillion` years—almost\
    \ thirty thousand times the age of the universe.\n\n[11] Currently, the best recommended\
    \ block ciphers are `AES` and `Twofish` with block sizes of `256 bits`.\n\n[12]\
    \ `a mod b` is the remainder of `a ÷ b`. For example, `27 mod 10 = 7`, because\
    \ when we divide `27` into `10`, the remainder is `7`.\n\n[13] `RSA` stands for\
    \ `Rivest–Shamir–Adleman` and `ECDSA` stands for `Elliptic Curve Digital Signature\
    \ Algorithm`.\n\n[14] `MAC` stands for medium access control.\n\n[15] Here, `+`\
    \ is the concatenation: `code` + `energy`.\n\n[16] `hash(key + msg)` or `hash(key\
    \ + msg))` used to calculate.\n\n[22] At its inception in 1995, the protocol was\
    \ called `Secure Sockets Layer` (`SSL`). As the protocol was upgraded, it was\
    \ renamed to `Transport Layer Security` (`TLS`), but many still refer to it by\
    \ its older name or `SSL/TLS`.\n"
