  raw: 'Computers track time in UTC, but typically display it according to their timezones.
    For example, an email sent from New York to Tokyo will carry a creation timestamp
    in UTC. This timestamp will be displayed differently for sender and receiver,
    according to the timezone configuration of their computers. Moving forward, when
    we refer to time, we mean UTC.


    Network Time Protocol


    Humans can aspire to British punctuality if their watches are correct down to
    the second. Computers however, work faster and their clocks need more precision.
    For example, a group of computers can log hundreds of records per second. In order
    to keep these records in chronological order, we must synchronize clocks down
    to the millisecond.


    It’s not trivial to adjust clocks to such minute time scales. A naive approach
    would be to send a message on the Internet asking for the time from someone who
    knows it, and setting the clock to the timestamp received in response. However,
    this doesn’t work: IP packets transit for undetermined durations. The time we
    received from a remote computer inevitably arrived late.


    However, with some extra data, we can approximate how long a packet took to travel
    through the Internet. This duration can then be added to the indicated timestamp
    before we use it to adjust our clock. The Network Time Protocol (NTP) is the widely
    used standard for synchronizing clocks using this principle.


    NTP timestamps are expressed in seconds since midnight on January 1st, 1900. For
    example, the timestamp of midnight, January 1st, 2000 is expressed 3,155,673,600.
    The number can have a fractional part, so it can capture time with very fine precision.
    NTP servers expect incoming messages at UDP port 123. An NTP message exchange
    works as follows:


    ![](image/02-02-v.jpg)


    Figure 2.2 A client asks a server for the time using NTP. For simplicity, let’s
    pretend we are in the year 1900, so that the timestamps are small numbers. The
    time kept by either computer runs from top to bottom.


    The exchange starts when the client sends its time query. This message contains
    the time it was sent, according to the client’s clock (time A). The server registers
    the time the message arrives, according to the server’s clock (time B). When the
    server replies, it sends a message containing three times: time A, time B, and
    its response time (C). The client receives these times and confirms time A is
    the same it had previously sent. The client also notes when the reply arrives
    according to its own clock (time D).


    On Figure 2.2, let’s assume time D is 319.42. Knowing times A, B, C and D, the
    client can calculate the time the IP packets took to travel through the Internet:


    travel time = client roundtrip time − server processing time


    \= D − A − (C − B)


    \= 319.42 − 315.27 − (319.32 − 316.61)


    \= 4.15 − 2.71


    \= 1.44.


    It took 1.44 seconds for the messages to go from client to server and back. We
    can approximate that it took half that time for the packet to travel from server
    to client: 0.72 seconds. The client should have received the reply 0.72 seconds
    after time C, at 319.32 + 0.72 = 320.04. However, the client received the message
    when its clock ticked only 319.42. This means the client’s clock is running late
    compared to the server by about 320.04−319.42 = 0.62 seconds.


    NTP is conservative: it mandates clients adjust their clocks by only half the
    estimated offset. So our client pushes its clock 0.31 seconds forward. Every ten
    minutes, our client sends a new query and adjusts its clock accordingly. If packet
    travel times between client and server are identical in both directions, the client’s
    clock will eventually synchronize with the server’s clock. On typical Internet
    links, NTP synchronizes clocks with errors ranging in the tens of milliseconds.


    Time Servers


    You might be wondering where NTP servers obtain their time from. Most NTP servers
    actually synchronize to other NTP servers on the Internet: there’s no problem
    running server and client NTP programs simultaneously.


    However, this can lead to problems. If Ada gets her time from Andrew, and Andrew
    gets his time from Charles, and Charles gets his time from Ada, none of the three
    will have a time source calibrated to UTC. Even if their clocks were initially
    correct, imprecisions would build up over time and cause their clocks to drift
    away from UTC.


    To prevent this problem, NTP servers are organized in a hierarchy called clock
    strata. A server that is directly linked to a reliable time source, such as an
    atomic clock or GPS receiver, is said to be stratum 1. Computers that synchronize
    with a stratum 1 server are stratum 2. If your computer gets the time from a stratum
    2 server, it becomes stratum 3, and so on. NTP rules that servers must report
    their stratum when answering time queries, and that the bottommost level of the
    hierarchy is stratum 15.


    This allows computers to avoid circular time-telling: if Charles is stratum 2,
    and tells the time to Andrew, Andrew becomes stratum 3. If Andrew tells it to
    Ada, she becomes stratum 4. If ever Ada tells Charles the time, he will know he
    must ignore it because he is stratum 2 and she is stratum 4. He must find a stratum
    1 server to synchronize with.


    There are many public NTP servers that answer queries from anyone. Apple computers
    are pre-configured to synchronize their clocks with time.apple.com, which is a
    stratum 2 server. Governments and large organizations often provide public NTP
    servers. For example, the United States government operates time.nist.gov, a stratum
    1 public server.


    NTP was created in 1985 and is one of the oldest protocols of the Internet. Since
    almost every computer runs an NTP client, people often take it for granted that
    their computers naturally know the time. You can check your clock at [http://time.gov/](http://time.gov/).
    Odds are, it will be off by less than a second. Next, let’s explore an Internet
    protocol that’s even older than NTP.


    2.3      Access


    During the 19th century, human operators had to decode the electrical signals
    of the telegraph into language and vice versa. At the turn of the century, their
    job was made easier by a new device called the teletype. These machines were hooked
    to telegraph wires and incorporated a mechanical typewriter that could print incoming
    telegraphed characters automatically.


    Teletypes also had a keyboard, so characters typed by their operator would be
    automatically telegraphed out through the wire. This allowed people to chat over
    long distances: messages typed into one machine would be printed by the second
    machine on the other side of the line.


    Terminals


    When electronic computers were first commercialized in the 1950s, they had no
    screens. In order to obtain feedback from their new machines, people had to link
    their input/output wires to teletypes. That way, they could feed data and instructions
    to the computer by typing, and their computer’s response was printed back in real
    time. These teletypes that allow us to interface with computers through text are
    called terminals.


    The computer program that processes information and instructions flowing to and
    from a terminal is called a shell. In order to communicate with humans, it operates
    a Command-Line Interface, or CLI. As a terminal user types a command into the
    CLI, the shell acknowledges each character by asking the terminal to print it.
    In doing so, the user can always see what he or she is typing in real time. The
    user can input a Non-Printing Character (NPC) called the carriage return, and
    the shell executes the entire line as a command, optionally asks the terminal
    to print some output, and stands by for the next command.


    In the 1960s, glass teletypes emerged. They worked exactly as older teletypes,
    except that they displayed characters on a screen rather than printing them on
    paper. That’s why to this day, displaying text on a terminal screen is referred
    to as printing!'
