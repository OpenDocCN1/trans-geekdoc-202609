    在书中，我们探索了计算机科学如何从根本上改变我们交换信息以及从海量数据学习的方式，但我们并没有探讨计算机本身的工作原理，以及编码人员如何与之交互。这是因为我们已经在第一本书
    `Computer Science Distilled》（计算机科学精要）中涵盖了计算机科学的核心概念。我们强烈建议你阅读一下这本书！


    ### Computer Science Distilled


    `Computer Science Distilled`是对你必须掌握的本质计算机科学概念的简要概述。它的写作风格与 `Computer Science Unleashed`
    类似：尽力减少了学术上的正式性，语言清晰易懂。它也是为初学者设计的。


    该书从对离散数学的简要介绍开始，然后介绍了常见的算法和数据结构。最后概述了计算机硬件和编程语言的工作原理。理解这些主题是你通精计算机科学的下一步，因为它们能够完美地补充了本书的内容。你可以在以下地址获取你的
    `Computer Science Distilled` 副本：


    [`code.energy/computer-science-distilled`](http://code.energy/computer-science-distilled)


