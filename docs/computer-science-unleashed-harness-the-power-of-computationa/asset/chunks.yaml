    ## 评估分类器


    在第 5 章中，我们学习了预测模型：给定与每个预测相关的数据（我们称为 `X`），做出一系列预测（我们称为 `y`）的算法。模型有两种。回归器（Regressor）进行数值预测，而分类器（Classifier）将结果预测到不同的组中。我们已经学习了回归器预测的效果如何。现在让我们学习如何为分类器评分，因为分类器预测的是标签，让我们从简单的开始：`y`
    由二分类数据组成。由于它只有两个标签，我们只需要对每行提供“是”或“否”。我们称之为二分类。预测患者是否会患病或信贷是否会违约。


