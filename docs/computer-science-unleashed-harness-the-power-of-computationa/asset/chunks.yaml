    完成这些步骤后，客户端和服务器之间就可以交换加密的 HTTP 消息。当 HTTP 使用 TLS 时，我们将生成的协议称为 HTTPS。虽然 HTTP 默认使用
    80 端口，而 HTTPS 默认使用 443 端口。监听 TCP 端口 443 的 Web 服务器期望客户端建立建立后立即发送第一条 TLS 消息。


    除了 HTTPS 外，TLS 还用于许多其他协议，包括 SMTP。有一些编程库可以让程序员轻松地将 TCP 与 TLS。程序员不需要手动创建和保护普通的 TCP
    套字，而是使用库的函数直接创建 TLS 套字。在后台，库会处理所有的加密工作。程序员操作 TLS 套字的方式几乎与操作 TCP 套字的方式完全相同。


    ## 其他协议


    还存在许多其他安全协议。例如，`IPsec` 是一种 IP 扩展，它为所有基于 IP 的通信提供安全保障。与 IP 数据包不同，`IPsec` 数据包在传输过程中无法被读取或更改。`IPsec`
    通常用于创建虚拟专用网络（VPN），在 VPN 中，互联网连接充当物理链路，使计算机能够像在现场一样加入远端局域网。


    DNS 也有自己的安全扩展，称为 `DNSSEC`。它通过数字签名扩展 DNS 记录。这使得任何人都可以验证签名 DNS 记录是否是由所有者创建的。如果没有
    `DNSSEC`，DNS 服务器可能会向你发送伪造的 DNS 记录，将你引向恶意主机。截至 2020 年，`DNSSEC` 尚未广泛使用，但采用率正在稳定提高。


    无线通信的安全协议被广泛使用。例如，它们防止使用无线嗅探器的人读取通过安全 WiFi 传输的 IP 数据包内容。它们还允许你在无线蓝牙键盘上打字，而无需担心按键被未经授权的机器记录。


    如今，电子邮件安全性的缺失是一个大问题。可以使用带有 TLS 的 `SMTP` 安全地传输电子邮件，但大多数邮件服务器以明文形式存储邮件。像 `Gmail`
    或 `Hotmail` 这样的大型邮件提供商可能会读取其用户的邮件。大多数安全专家认为，消息应该只能被发送者和接收者读取。遵循这一原则的通信系统被称为使用端到端加密。一些即时消息应用——如
    `Signal`、`Threema` 和 `WhatsApp`——使用了端到端加密。目前正在积极开发新协议，以便让电子邮件广泛支持端到端加密。


    ## 3.6 黑客攻击


    黑客是指具有强大计算机技能、能够以非标准方式实现某些目标的人。在流行文化中，黑客通常被描绘成极客化的巫师，只需几次击键就能渗透军用级的计算机系统。虽然电影并不总是真实的，但“黑客是一支精英力量”这一观点具有一定事实。黑客通常专攻低级计算，详细了解计算机执行一个简单动作所采取的每一步。


    大多数时候，黑客是 IT 安全专家，他们对网络协议有深入理解，并能够操控网络数据包中的单个比特。他们利用自己的技能发现漏洞，从而能够 `pwn` 一台机器
    23——获取其控制权并在未经许可的情况下执行任务。


    这并不意味着所有的黑客都是坏人。白帽黑客努力确保他们发现的漏洞不会造成任何伤害。相反，黑帽黑客利用漏洞获取个人利益或造成破坏。


    ## 社会工程学


    黑客攻击往往利用人而不是计算机。社会工程学是一门操纵他人泄露机密或执行损害安全行为的艺术。


    ### 社会工程学


    大多数时候，黑客是 IT 安全专家，他们对网络协议有深入理解，并能够操控网络数据包中的单个比特。他们利用自己的技能发现漏洞，从而能够 `pwn` 一台机器
    23——获取其控制权并在未经许可的情况下执行任务。


    社会工程学攻击可以采取许多形式，包括网络钓鱼和语音钓鱼。


