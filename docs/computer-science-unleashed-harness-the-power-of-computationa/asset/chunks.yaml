    通过 `dig`，你可以使用 `-x` 参数查询任何 IP 地址对应的 `PTR` 记录。尝试一下：


    ```bash

    dig -x 2600::

    ```


    反向 DNS 对于确认 IP 数据包的来源非常有用。例如，假设你收到了一个一个携有来自 `apple.com` 消息的 IP 数据包。如果发送者 IP 地址的反向
    DNS 不是 Apple 的域名，那么就有些问题了！


    这是因为那些有权设置 `arpa` 子域名 DNS 记录的人非常谨慎。大多数 ISP 甚至不允许其客户在与其 IP 地址对应的 `arpa` 子域名上设置记录。


    ## 域名注册


    DNS 不仅仅是将大数字替换为名称——它还赋予了人们重新配置自己网络的自主权。想象一台托管网站的计算机。如果它搬了位置，就会获得一个新的 IP 地址。该网站的
    DNS 记录可以更新到新地址，这样网站的访问者就不会察觉到变化！


    这要求 DNS 是通用的。对于任何人来说，拥有一个域名应该是容易、安全且负担得起的。有几条规则保证了这一点。ICANN 在专用用途顶级域名（TLD）方面非常慷慨：`Google`
    和 `IBM` 可以随心所使用 `google` 和 `ibm`。此外，ICANN 允许每个国家政府为其国家代码 TLD 设置规则。然而，ICANN 对面向公众的通用用途
    TLD 实施了严格的规则，如 `com`、`org`、`rocks` 和 `energy`。


    ICANN 将一个或多个 TLD 的实体称为 `registry`（注册局）或网络信息中心（`NIC`）。正如我们看到的，`com` 的注册局是 `Verisign`。ICANN
    强制通用用途 TLD 注册局接受任何人的域名注册。ICANN 还规定，`registry` 不能直接接收任何域名注册申请。


    为了加强竞争并最大化 DNS 的覆盖范围，ICANN 规定通用用途 TLD 的域名注册申请必须由名为 `registrars`（注册商）的公司处理。截至 2020
    年，最大的注册商是 `GoDaddy`：它已经处理了数千万个域名注册。


    `Registars` 必须经过 ICANN 批准。ICANN 了注册局和注册商在域名注册时可以收取的最高和最低费用。每当注册域名时，有一部分费用会支付给
    ICANN。从技术上讲，域名仍归 ICANN 所有，租期最长 10 年。然而，由于租约是可以续租的，我们通常将租用者称为者。


    ### WHOIS


    最初，ICANN 强制注册商在名为 `WHOIS` 的公共目录中披露域名所有者的名称和联系信息。该目录通过不同的互联网协议运行，独立于 DNS。可以使用命令行上的
    `whois` 程序查询该目录：


    ```bash

    whois code.energy

    ```


    得益于数据保护规范和法规的进步，ICANN 现在允许注册商对域名所有者的身份进行隐藏。2012 年，ICANN 承诺“重造 WHOIS”，但截至 2020
    年，该过程仍在进行中。


    ### DNS 托管


    理论上，在注册域名时，你应该提供你的名称服务器的名称和 IP 地址。这些信息会从你的注册商转发到注册局，并包含在 TLD 名称服务器中。然而，大多数人甚至不知道什么是名称服务器。为了方便起，许多注册商提供
    DNS 托管服务：他们代表你使用自己的名称服务器，并允许你通过网络界面管理你的 DNS 记录。


    ### 域名市场


    我们生活在一个在线经济蓬发展的时代。域名被视为虚拟房地产，有时甚至以数百万美元出售。例如，2019 年，`GoDaddy` 促成了 `voice.com`
    3000 万美元的交易。`.com` 域名如此珍贵，所有可能的四字母组合都被占用了。


    现在你已经知道 DNS 是如何工作的，我们将使用域名来引用主机。每当你看到一个名称用作主机地址时，记得需要 DNS 查询来查找 IP 地址并发送 IP 数据包。


    ## 2.2 时间


    数千年前，人类开始研究天文学和机械学如何帮助量时间。古代文明开发了不同的月历和太阳历来追踪季节，并发明了日晷水钟等设备来跟踪白夜的时间。


    随着罗马军团在公元前 1 世纪专业化，他们越来越多地记录时间，以充分发挥他们的军事潜力。计时让他们能够协调精确的行动，并对敌人造成致命打击。他们还系统地记录了侦察兵和信使收集情报的时间，以便他们关联事件并获得对敌方战术的洞察。


    今天，我们严重依赖计时，因为卡车、火车、船只和飞机必须协作在全球范围内运输难以大量的货物。我们记录日志，有时每当包裹交手一次记录一次。如果大家都对现在的时间达成一致，我们就可以关联事件，这样事件及其后果就可以被监控，如果人们做错了，就可以追究他们的责任。


    同样，计时让互联的计算机形成强大的团队。如果远处的计算机对现在的时间达成一致，它们就可以以人类无法实现的速度协调行动。例如，不同大陆双方之间的金融交易可以在几秒内确认。


    计算机还存储它们每个操作的日志，并记录发生的确切时间，这被称为 `timestamp`（时间戳）。统一时间允许互联的计算机按时间顺序排列过去的操作、记录和消息，从而关联事件。这主要帮助程序人员找到
    bug，但也可以例如帮助安全专家检测和跟踪恶意活动。


    共享时间允许跨大规模的协调和事件关联。这引出了问题：互联的人类和计算机是如何对现在的时间达成一致的？


    ### 协调时


    在大航海时代，欧洲海员根据天文观测和计时完善了他们的导航技术。到 18 世纪，他们已经可以根据伦敦格林威天文台发布的图表精确定位在海上的位置。只要他们知道天文台的确切时间，船只就能与其保持同步。


    几个世纪后，我们将机械钟切换到石英钟和原子钟以获得更高的精度。今天，数百台原子钟追踪世界时间。协调时，即 `UTC`，是这些时钟测量值的平均值，它是我们目前的时间标准。得益于天文学和行星科学的进步，我们甚至考虑到地球自转减慢：我们偶尔向
    UTC 添加闰秒，使其与伦敦的太阳时间保持同步。


    全球范围内官方时间是通过向 `UTC` 添加偏移得到的。偏移会随季节变化。例如，由于夏令时，英国在全年比 `UTC` 快一小时。东京全年比 `UTC` 快九小时。


    ### 时区


    官方时间遵循相同 UTC 偏移的区域形成时区。IANA 跟踪不断变化的时区及其偏移，并将其发布在 `tz database` 中。例如，美国东部的大部分地区从迈阿密到纽约共享相同的
    UTC 偏移。在 `tz database` 中，这个时区的代码为 `America/New_York`。英国完全位于 `Europe/London` 时区，而日本位于
    `Asia/Tokyo`。


    ![](img/02-01-h.jpg)


    图 2.1 截至 2020 年世界时区的粗轮廓。


    '
- fmt: '

    Computers track time in `UTC`, but typically display it according to their timezones.
    For example, an email sent from New York to Tokyo will carry a creation timestamp
    in `UTC`. This timestamp will be displayed differently for sender and receiver,
    according to the timezone configuration of their computers. Moving forward, when
    we refer to time, we mean `UTC`.


    # Network Time Protocol


    Humans can aspire to British punctuality if their watches are correct down to
    the second. Computers however, work faster and their clocks need more precision.
    For example, a group of computers can log hundreds of records per second. In order
    to keep these records in chronological order, we must synchronize clocks down
    to the millisecond.


    It’s not trivial to adjust clocks to such minute time scales. A naive approach
    would be to send a message on the `Internet` asking for the time from someone
    who knows it, and setting the clock to the timestamp received in response. However,
    this doesn’t work: `IP` packets transit for undetermined durations. The time we
    received from a remote computer inevitably arrived late.


    However, with some extra data, we can approximate how long a packet took to travel
    through the `Internet`. This duration can then be added to the indicated timestamp
    before we use it to adjust our clock. The `Network Time Protocol` (`NTP`) is the
    widely used standard for synchronizing clocks using this principle.


    `NTP` timestamps are expressed in seconds since midnight on January 1st, 1900.
    For example, the timestamp of midnight, January 1st, 2000 is expressed `3,155,673,600`.
    The number can have a fractional part, so it can capture time with very fine precision.
    `NTP` servers expect incoming messages at `UDP` port `123`. An `NTP` message exchange
    works as follows:


    ![](image/02-02-v.jpg)


    Figure 2.2 A client asks a server for the time using `NTP`. For simplicity, let’s
    pretend we are in the year 1900, so that the timestamps are small numbers. The
    time kept by either computer runs from top to bottom.


    The exchange starts when the client sends its time query. This message contains
    the time it was sent, according to the client’s clock (`time A`). The server registers
    the time the message arrives, according to the server’s clock (`time B`). When
    the server replies, it sends a message containing three times: `time A`, `time
    B`, and its response time (`C`). The client receives these times and confirms
    `time A` is the same it had previously sent. The client also notes when the reply
    arrives according to its own clock (`time D`).


    On Figure 2.2, let’s assume `time D` is `319.42`. Knowing times `A`, `B`, `C`
    and `D`, the client can calculate the time the `IP` packets took to travel through
    the `Internet`:


    `travel time = client roundtrip time − server processing time`


    `= D − A − (C − B)`


    `= 319.42 − 315.27 − (319.32 − 316.61)`


    `= 4.15 − 2.71`


    `= 1.44.`


    It took `1.44` seconds for the messages to go from client to server and back.
    We can approximate that it took half that time for the packet to travel from server
    to client: `0.72` seconds. The client should have received the reply `0.72` seconds
    before it actually did. The client can then adjust its clock by this offset.

