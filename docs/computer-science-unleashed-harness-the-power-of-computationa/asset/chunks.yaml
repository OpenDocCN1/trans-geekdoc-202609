    Simple Mail Transfer Protocol


    The most widely used email protocol is the Simple Email Transfer Protocol (SMTP).
    It defines the conversation rules between an email server and a client computer.
    As we’ll see, SMTP is more elaborate than request-response protocols[17](#CSU-2-9.xhtml#nota2-17)
    such as DNS and NTP.


    First off, emails can contain messages that don’t fit in a single IP packet. When
    an email is carried by many IP packets, it is important for their payloads to
    be pieced back together in order. For this reason, SMTP runs on TCP rather than
    UDP.


    Mail servers expect incoming connections on TCP port 25. When a connection is
    established, the server starts the conversation. It sends a message to identify
    itself:


    220 mail-server.example.com


    All messages sent by the server start with a three-digit number, called the return
    code. SMTP defines many different codes, each with their own meaning. Specifically,
    220 communicates that the server is ready to receive instructions. After the code,
    the server states its own name. In response, the client should send a HELO command
    to identify itself:


    HELO client.code.energy


    At this point, the server decides if it wants to continue the conversation, based
    on who the client claims to be. Some mail servers use reverse DNS and compare
    the client’s self-reported name to the name that’s linked to its IP address. If
    the mail server decides to continue, it will send a 250 response code, which means
    that the action requested by the client was accepted:


    250 mail-server.example.com


    With this first exchange, both the client and the server acknowledged that they
    are about to transfer an email. They also both checked that they’re communicating
    with their intended counter-part. Next, the client is expected to give the return
    address of the email to be transmitted. If the server cannot deliver the client’s
    email, it will send another email to the return address informing it of the problem:


    MAIL FROM: <ada@code.energy>


    Again, the server has the option to accept or reject this. Some mail servers are
    configured to only accept certain email addresses. If the address is accepted,
    the server returns the 250 code:


    250 Ok


    Next, the client must inform the server of the destination mailbox:


    RCPT TO: <charles@example.com>


    Again, the server confirms whether it accepts this destination mailbox. If the
    server accepts to receive the message, it will use the same 250 return code, informing
    the client that it can go ahead:


    250 Ok


    The client can now send the DATA command. This command asks the server to begin
    the transmission of the email message:


    DATA


    The server confirms and instructs the client to signal the end of the transmission
    with a line containing only a dot. The 354 return code informs the client that
    the server will consider the next characters it receives as part of the email
    message:[18](#CSU-2-9.xhtml#nota2-18)


    354 End data with <CR><LF>.<CR><LF>


    The client then transmits the email. The From, To and Date headers are mandatory
    and must be present in every email. Other headers, such as Subject, are commonly
    used, but aren’t required. The email body is also optional. Sending an email without
    a body is similar to posting an empty envelope. Here’s an example of an email
    the client could transmit:


    From: <ada@code.energy>


    Date: Wed, 27 Nov 2002 15:30:34 +0100


    To: <charles@example.com>


    That brain of mine is something more than


    merely mortal; as time will show.


    •


    After the finishing <CR><LF>.<CR><LF> is delivered, the server checks that the
    received data is valid and formally accepts the message if that is the case. Many
    servers also inform the client of the internal ID that they assign to the received
    email:


    250 Ok: queued as 1079212633C


    At this point, the client can rest assured that the server will either deliver
    the message or bounce[19](#CSU-2-9.xhtml#nota2-19) it back with an error message.
    The client may continue by sending another MAIL FROM command to send more emails.
    Otherwise, it can politely say it’s done by sending a QUIT command:


    QUIT


    Upon receiving this, the server should say goodbye and close the TCP connection:


    221 Bye


    A conversation similar to this one takes place every time you send an email–your
    email software performs it behind the scenes. Originally, there was no authentication
    in SMTP: servers blindly trusted clients were sending legitimate emails. Sadly,
    once email became popular, inconsiderate Internet actors started sending unsolicited
    junk to every email address they could find. The most malicious of them even send
    fraudulent emails with illegitimate From fields.


    Sending Emails


    Email was initially created as an open system in which anyone could participate
    without asking any central authority for permission. Its pioneers hoped all participants
    would act in good faith. Unfortunately, as soon as email was widely adopted, this
    hope was lost. Nevertheless, engineers kept working to make email resilient to
    bad actors, without relinquishing its open nature.


    At first, engineers started keeping public blacklists, which were frequently updated
    with names and IP addresses of known email abusers. Administrators configured
    their servers to automatically reject connections from blacklisted users. This
    mitigated the problem, but didn’t fix it: abusers learned to use fresh IP addresses
    and domain names to send junk.


    To this day, the majority of bad emails come from Internet connections provided
    by ISPs. Most organizations carefully guard and police the use of their networks
    in order to protect their reputation. However, ISPs often service millions of
    users, and individually screening each one isn’t viable.


    Fortunately, it’s easy to check whether an IP address belongs to a well established
    organization or to a home connection: you consult its reverse DNS record. ISPs
    don’t allow residential clients to set these records, but all credible mail servers
    will have proper reverse DNS for their IP addresses. So mail servers have started
    restricting home IP addresses, which drastically reduces email abuse.


    In order to implement this policy, SMTP has been upgraded to an extended version
    (ESMTP) with support for authentication via username and password. For all home
    users, MAIL FROM commands are only accepted after the user is authenticated through
    an AUTH command.


    This is how sending an email works today: you compose an email, and your computer
    uses SMTP to submit it to your mail server. Your mail server then connects to
    the mail server associated with the destination mailbox and uses SMTP to relay
    your email. Since your mail server’s IP address has a reverse DNS record, it can
    communicate to all other mail servers without authentication.


    So email traffic is divided in two: users submitting messages to their own mail
    server and mail servers relaying messages to each other. Today, TCP port 587 is
    reserved for email submission, and port 25 is reserved for email relay. Home email
    users have stopped using TCP port 25.


    Accordingly, most ISPs even drop home IP packets containing segments to port 25,
    effectively blocking home Internet users from performing email relay. Mail servers
    expect incoming connections on two TCP ports:


    • Port 25, to receive emails from other mail servers,


    • Port 546, to receive emails from authenticated users.


    All this still isn’t enough to curb the malicious email senders. The fight between
    engineers and senders of junk still rages on. In some cases, engineers guess which
    emails are junk using intricate sorting mechanisms. In others, they use cryptographic
    signatures to verify the sender email’s address.


    Retrieving Emails'
