    每组独立的通信规则共同形成一个协议，而所有此类协议的集合成了应用层。我们将看到的第一个应用层协议工作原理类似于地址簿，几乎每个连接到互联网的应用程序都会直接或间接地查阅它。


    ## 2.1 名称


    只有在知道主机的 IP 地址时，我们才能向其发送 IP 数据包。然而，我们甚至从未背过像 Google、Amazon 或 Facebook 等主流主机的 IP
    地址。


    工程师们意识到使用大数字来引用主机是不现实的，因此他们创建了域名系统，即 `DNS`。它将易读的名称与 IP 地址关联起来。得益于 `DNS`，我们可以使用
    `google.com`、`amazon.com` 或 `facebook.com` 等名称来访问主机。


    当你在网络浏览器中输入 `facebook.com` 时，它会使用 `DNS` 查找与该名称关联的 IP 地址。然后它可以通过向该地址发送 IP 数据包来请求该网站。如果你直接在浏览器中输入
    Facebook 的 IP 地址，则不会查询 `DNS` 注册表；但相同的网页仍然会显示。


    `DNS` 依赖于互联网上许多计算机的协作。这些计算机根据 `DNS` 协议进行通信以维护名称注册表。大多数互联网应用程序（如网络浏览器和电子邮件客户端）使用
    `DNS` 来查找它们必须连接的主机的 IP 地址。但在我们探索该协议的规则之前，让我们学习一些基础概念——从名称的层级结构开始。


    ### 域名


    `DNS` 中的名称被称为域名（domain names 或 domains）。它们由由点分隔的文本标签组成。标签可以使用 `a` 到 `z` 的 26 个字母、`0`
    到 `9` 的数字以及连字符（`-`）。例如，`book-2.code.energy` 是一个拥有三个标签的域名。


    点表示层级子域名。子域名是由较短的父级域名监管的域名：`book-2.code.energy` 是 `code.energy` 的子域名。同样，`code.energy`
    是单标签域名 `energy` 的子域名。域名是不区分大小写的：`code.energy` 和 `coDE.enERgy` 是相同的。


    每个域名都有一个所有者。所有者可以创建自己域名的子域名。子域名的所有权可以由父域名所有者随时转移。例如，Verisign 是一家同时拥有 `com` 和 `net`
    的美国公司。1997 年，在一个少数小极客团队的要求下，Verisign 创建了 `google.com` 并授予了他们其所有权。


    单标签域名如 `com`、`net` 和 `energy` 被称为顶级（Top Level Domains 或 `TLDs`）。由于其设计方式，当 `TLDs`
    数量有限时，`DNS` 效率更高。由于这个原因，创建新的 `TLDs` 是困难的。通常，当个人和组织想要域名时，他们会向现有 `TLD`（最主要是 `com`）的所有者请求子域名。


    尽管如此，许多强大的组织拥有自己的 `TLDs`。2014 年，Google 被授予了 `google` `TLD`。2016 年，Motorola 被授予了
    `moto` `TLD`。更关键的是，Amazon 试图获取 `amazon` `TLD`，但巴西和秘鲁的政府反对这项计划，因为他们认为该名称首先属于他们。


    ### ICANN


    为了让域名被通用理解，必须有一种方法让每个人同意谁拥有每个 `TLD` 的所有权。这在创建 `TLDs` 时需要共识过程。为此，决定由一家美国非营利组织互联网分配名称与数字机构（`ICANN`）拥有
    `TLDs` 的权限。


    当 `ICANN` 授权创建 `TLD` 时，它通常要求新所有者允许公众注册子域名。大多数现有的 `TLDs`（包括 `com`、`net` 和 `energy`）都是如此。为了让
    Verisign 维持其对 `com` 的所有权，他们被 `ICANN` 要求接受任何人创建子域名的请求。


    有时，`ICANN` 允许 `TLDs` 所有者将其用于专属利益。例如，`gov` 和 `mil` 由美国政府控制。它们只为政府机构创建域名，如 `nasa.gov`
    和 `space.mil`。同样，`edu` 所有者只允许教育机构拥有 `.edu` 域名，如 `mit.edu` 和 `caltech.edu`。同样，Google
    专门将 `edu` 用于公司事务，如 `grow.google` 和 `blog.google`。


    除了通用型 `TLDs` 和专用型 `TLDs` 外，`ICANN` 还分配了两个字母的国家代码 `TLDs` 并将其控制权交给各自的政府。哥伦比亚拥有 `co`，美国拥有
    `us`，英国海外领地拥有 `io`。偶尔，`ICANN` 为著名的地理区域创建 `TLDs`。例如，`rio` 被给了里约内卢。


    ### 域名服务器


    `DNS` 记录将数据链接到域名。域名可以有许多记录，每个记录绑定一段数据。所有记录指示它们携带的信息类型。例如，`AAAA` 记录链接域名到 IP 地址：


    ```

    print.net AAAA 2600::

    ```


    所有 `DNS` 记录必须存储在域名服务器上：互联网上的任何人都可以共享这些记录。`NS` 记录表示该域名具有所有权。例如，Verisign 拥有 `com`。原则上，对于
    `.com`，域名服务器将包含以下记录：


    ```

    google.com NS ns1.google.com.

    google.com NS ns2.google.com.

    ns1.google.com AAAA 2001:4860:4802:32::a

    ns2.google.com AAAA 2001:4860:4802:34::a

    ```


    `NS` 记录表明给定的域名服务器拥有该域名。通过上述记录，Verisign 将 `google.com` 的记录责任委托给了托管这些域名服务器的 Google。这使得
    Google 为 `google.com` 设置 `DNS` 记录。


    ### 根服务器


    被称为根服务器的特殊服务器由 `ICANN` 指定拥有存储 `TLDs` `DNS` 记录的权限。当 `ICANN` 请求添加 `NS` 记录时，就会创建新的
    `TLDs`。共有 13 台根服务器——ICANN 让它们的 IP 地址周知。马里兰大学、NASA 和美国陆是托管根服务器的一些实体。


    ### 查询


    域名服务器有两个功能：存储记录和回答查询。大多数互联网应用程序依赖它们。例如，你的网络浏览器只有在发现想要访问的网站 IP 地址的情况下才能工作。


    域名服务器在 UDP 53 端口接收查询。通常，一个 `DNS` 查询消息及其回复适用于一个数据包。为了说明它是如何工作的，让我们使用 `dig` 程序查询域名服务器。它向我们指定的
    IP 地址发送数据包，其中包含符合 `DNS` 协议的查询。`dig` 从命令行调用如下：


    ```

    dig@[address] [domain] [type]

    ```


    这向 UDP 53 端口的给定地址发送数据包，请求与给定类型相关的记录。当响应数据包到达时，`dig` 会对其解码并以明文显示记录。


    假设我们要连接 `icmc.usp.br`，但我们只知道 NASA 根服务器的 IP 地址：`2001:500:a8::e`。让我们问 NASA 关于 `icmc.usp.br`
    的域名服务器是什么：


    ```

    dig @2001:500:a8::e icmc.usp.br. NS

    ```


    根服务器回复以下记录：


    ```

    br. NS a.dns.br.

    a.dns.br. AAAA 2001:12f8:6::10

    ```


    '
- fmt: '

    We can immediately see that NASA doesn’t have the `NS` records for `icmc.usp.br`.
    In fact, root servers shouldn’t even be expected to store these records: `br`
    is a country-code TLD under the authority of the Brazilian government. The root
    server helps us by indicating the IP address of the Brazilian server responsible
    for `br`. Let’s take the advice and send our query there:


    ```

    dig @2001:12f8:6::10 icmc.usp.br. NS

    ```


    This time, we receive the specific records we asked for:


    ```

    icmc.usp.br.      NS   c.dns.usp.br.

    c.dns.usp.br.     AAAA  2001:12d0::8

    ```


    We can now ask for the `AAAA` record associated with `icmc.usp.br`:


    ```

    dig @2001:12d0::8 icmc.usp.br. AAAA

    ```


    And at last, we receive the IP address we wanted:


    ```

    icmc.usp.br.      AAAA  2001:12d0:2080::231:6

    ```


    If our original query was a subdomain of `icmc.usp.br`, we may have needed to
    iterate our query for an `NS` record once more. This is called iterative querying,
    and it allows you to look up any DNS information starting with any single root
    server’s IP address.


    ### Recursive Querying


    As of 2020, it’s estimated that a few million DNS queries are made every second.
    If hosts only performed iterative querying, it would be extremely difficult for
    name servers to handle all those requests. Fortunately, most DNS queries are handled
    in a different way—one that minimizes the load on the name servers.


    Some name servers, often called DNS servers, allow you to consult any DNS record
    through a single query. They are typically maintained by large organizations with
    a lot of throughput, such as Internet Service Providers. An ISP will almost always
    inform customer routers of its DNS server’s IP address. Customer routers will
    often use that server for all their DNS queries.


    Today, most home routers are capable of running their own DNS server. Typically,
    personal computers are configured to use their router as their default DNS server.
    Invoke `dig` without an `@` argument and your computer will probably query your
    router. In turn, your router will likely forward the query to the ISP’s DNS server.
    Try it:


    ```

    dig icmc.usp.br. AAAA

    ```


    This is much faster: your DNS server is closer to you than any other name server.
    Furthermore, a single query gets you the DNS records you want. As the client,
    you don’t even know (or care) whether your DNS server queried another DNS server
    or fetched the records directly from the name servers with authority over them.


    We call this process recursive querying, because the client’s single query propagates
    up a chain of DNS servers until the answer is found. Its advantage lies in caching:
    servers keeping past query results in their local storage, or cache. For instance,
    the first time a DNS server is queried about any `.io` domain, it asks a root
    server for `io`’s `NS` records; however, the next time a query for a `.io` domain
    is received, it retrieves the records from its cache instead of wasting the root
    server’s time.


    Since ICANN restricts the number of TLDs, it is easy for ISPs to cache all of
    them on their DNS servers, and therefore to only query the root servers sporadically.
    This design ensures that the root servers do not get overloaded.


    On the flip side, caching slows down the propagation of changes around the network:
    DNS servers only update their cached `NS` records from time to time. Specifically,
    the Time-To-Live (`TTL`) value of a record indicates how long it may be stored
    in cache.


    In previous examples, we’ve been omitting the `TTL` values for simplicity, but
    every record has one. It is typically displayed before the record type:


    ```

    br.            149836    NS  a.dns.br.

    ```


    This record has a `TTL` value of `149,836`, indicating that it may be cached for
    that many seconds. About 41 hours after this record is retrieved by a DNS server,
    it must be dropped from its cache. Setting a low `TTL` value makes future changes
    to the record propagate faster. However, higher `TTL` values allow less resources.


    ### Types of Records


    We’ve seen two record types: `AAAA`, that links to IP addresses; and `NS`, that
    grants authority over domains. Many other types exist. When DNS was invented in
    `1983`, the `A` record was used. In `2012`, the `AAAA` record was created.


    ```

    icmc.usp.br.      AAAA  2001:12d0:2080::231:6

    ```

    ```

    icmc.usp.br.      AAAA  2001:12d::8

    ```


    If you have an IPv4 address, you can use `A`. As for `A` and `AAAA` records, TLDs
    cannot have `MX` records.


    #### CANONICAL NAME

    In the early days of the Web, people started to configure servers for processing
    requests. It was usual to name such a server `www`, so `www.example.com` became
    the expected web address for `example.com`. More recently, many are dropping the
    `www` part from their web addresses. A special `CNAME` record allow us to define
    a subdomain that’s merely an alias:


    ```

    www.code.energy.      CNAME  code.energy

    ```


    It instructs anyone trying to retrieve a record for `www.code.energy` to instead
    consider the records from `code.energy`.


    #### TEXT

    It’s possible to link arbitrary text to a domain using `TXT` records. This is
    often used for proving ownership of a domain, but you can use it for anything
    else. We left a special message for you in `TXT` records associated with `enigma.code.energy`.
    Will you be able to find the message?


    ### Reverse DNS


    DNS is most used to get the IP address associated with a given domain. However,
    it also works in reverse: it can find which domain is associated with a given
    IP address. The trick is to re-express the IP address as a subdomain of ICANN’s
    special TLD `arpa`. For example,


    ```

    icmc.usp.br.      AAAA  2001:12d0:2080::231:6

    ```


    ...becomes:


    ![](image/reversedns.jpg)


    Thanks to ICANN, there is a unique `arpa` subdomain corresponding to every IP
    address. A `PTR` record may be set for that subdomain in order to associate it
    with a domain name.


    Authority over `arpa` belongs to IANA. When an IP address block is given to an
    organization, the organization also receives authority over the corresponding
    `arpa` subdomains. When a computer is allocated an IP address and a domain name,
    it’s good practice to record the pair in a `PTR` record using the IP address’s
    `arpa` subdomain.

    '
