    \nWhen given this email address, anyone could use `DNS` to discover the mail server\
    \ that stores its mailbox file and send `IP` packets to that computer. However,\
    \ in order to store a new message in someone else’s server, one had to first be\
    \ granted access to its mailbox files. This was cumbersome, so engineers started\
    \ to invent ways for emails to be received without the external manipulation of\
    \ any file on the receiving server.\n\nThis was the rise of email protocols. Just\
    \ as `NTP` provides the framework for programs to exchange time, mail protocols\
