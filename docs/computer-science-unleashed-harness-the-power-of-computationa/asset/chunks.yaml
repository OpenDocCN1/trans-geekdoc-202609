    \ We’ve observed how regular expressions are built from a combination of characters,\
    \ some representing themselves, some representing special functions. You should\
    \ use these tools when:\n\n• You must validate that an input matches an expected\
    \ format (e.g. phone number, date, IP address, credit card number),\n\n• You don’t\
    \ know the exact sequence of characters you’re looking for, but you know how it\
    \ should appear,\n\n• You must perform complicated find-and-replace operations.\n\
    \nIf you’re working on a generic pattern, such as an IP address or a phone number,\
    \ you can find ready-to-use regular expressions online. There are many regular\
    \ expression libraries and cookbooks that will help you find common patterns.\n\
    \nWhen designing your own expression, start with something simple that broadly\
    \ matches what you search and from there, refine your expression to be more and\
    \ more specific.\n\nNearly all programming languages and tools support regular\
    \ expressions, but be careful: there are many subtle variations across flavors.\
    \ Some will interpret parentheses as literal characters, and thus require you\
    \ to type \\\\(•••\\\\) instead of (•••) to create a group. Some older engines\
    \ lack support for certain anchors, such as the word boundary. And how do we go\
    \ about matching Japanese characters? The conceptual understanding you gained\
    \ from this chapter will help you navigate reference material and online resources\
    \ on regular expressions to find answers.\n\nInstall a regular expression extension\
    \ on your browser now, so you can test it on web pages. Additionally, find how\
    \ to use regular expressions in your source code editor. To write this book, we\
    \ used one called Vim, that carries out all searches through regular expressions.\
    \ If there is a way to make regular expressions the default search mode of your\
    \ editor, do it—that will force you to practice them and you will save time in\
    \ the long run.\n\n![](image/07-03-v.jpg)\n\nFigure 7.3 “Regular Expressions”,\
    \ courtesy of [http://xkcd.com](http://xkcd.com).\n\nEven if you’re not involved\
    \ in a hasty crime investigation (fig. 7.3), having quick access to specific information\
    \ is essential to work efficiently. The better you are with regular expressions,\
    \ the faster you can retrieve the data you need, learn them and save hours of\
    \ valuable coding time.\n\nReference\n\n• Mastering Regular Expressions, by Friedl\n\
    \n– Get it at [https://code.energy/friedl](https://code.energy/friedl)\n\n• Regular\
    \ Expressions Cookbook, by Goyvaerts and Levithan\n\n– Get it at [https://code.energy/goyvaerts](https://code.energy/goyvaerts)\n\
    \n[1](#CSU-2-14.xhtml#nt-7-1)  The way to set flags varies across flavors. Flags\
    \ are sometimes appended after a forward slash, for instance District 1, Paris/i.\n\
    \n[2](#CSU-2-14.xhtml#nt-7-2)  In hex, a single digit is a value from 0 to 15.\
    \ Since we ran out of Hindu-Arabic numerals, the letters a-f are used as numerals\
    \ for vales 10 to 15. For more about hexadecimal digits, see the Appendix I.\n\
    \n[3](#CSU-2-14.xhtml#nt-7-3)  The symbol \\# followed by three pairs of hex digits\
    \ is a common way to encode colors. Each pair indicates the amount of red, green,\
    \ or blue light it is made of. For instance, #FF0000 indicates maximum red light,\
    \ but no green or blue lights. Googling such a string will immediately return\
    \ you the corresponding color!\n\n[4](#CSU-2-14.xhtml#nt-7-4)  Notably, \\\\w\
    \ includes the underscore. The underscore is allowed in source code variable names,\
    \ so programmers can have variables like beer\\_count. Adding the underscore to\
    \ \\\\w makes it easier to match variable names in source files.\n\n[5](#CSU-2-14.xhtml#nt-7-5)  These\
    \ guys: . ? \\* + ^ $ | \\[ \\] { } ( ) \\\\.\n\n[6](#CSU-2-14.xhtml#nt-7-6)  Recall\
    \ from Chapter 3 that https is used in a URL instead of http to indicate it should\
    \ be accessed using SSL encryption.\n\n[7](#CSU-2-14.xhtml#nt-7-7)  This expression\
    \ would also match some invalid domains, because the dash isn’t allowed at the\
    \ start or end of the name. To handle that, we need an advanced regex feature\
    \ called lookarrounds, which isn’t in the scope of this book.\n\n[8](#CSU-2-14.xhtml#nt-7-8)  Many\
    \ flavors also offer lazy quantifiers as an alternative. Lazy quantifiers will\
    \ consume as few characters as possible.\n\n[9](#CSU-2-14.xhtml#nt-7-9)  In most\
    \ flavors, the dot will only match a new line character if the s flag is used.\
    \ Use that flag to find a fairy tale spanning multiple paragraphs!\n\n[10](#CSU-2-14.xhtml#nt-7-10)  We\
    \ made that up.\n\n[11](#CSU-2-14.xhtml#nt-7-11)  Can be repeated unlimited times\
    \ to match thousands, millions, billions, etc.\n\n Appendix  \n\nAPPENDIX\n\n\
    I      Numerical Bases\n\nComputing can be reduced to operating with numbers,\
    \ because information is expressible in numbers. Letters can be mapped to numbers,\
    \ so text can be written numerically. Colors are a combination of light intensities\
    \ of red, blue and green, which can be given as numbers. Images can be composed\
    \ by mosaics of colored squares, so they can be expressed as numbers.\n\nArchaic\
    \ number systems (e.g., roman numerals: I, II, III, ...) compose numbers from\
    \ sums of digits. The number system used today is also based on sums of digits,\
    \ but the value of each digit in position i is multiplied by d to the power of\
    \ i, where d is the number of distinct digits. We call d the base. We normally\
    \ use d \\= 10 because we have ten fingers, but the system works for any base\
    \ d:\n\n![](image/08-01-h.jpg)\n\nFigure 8.1 The number 4,321 in different bases.\n\
    \nII      Cracking the Shift Cipher\n\nIn the “Secret Code ![](image/c-pensativo.jpg)”\
    \ problem of sec. 3.1, we challenged you to crack the substitution cipher that\
    \ encrypted the following message:\n\nMAXI KBVX HYLX VNKB MRBL XMXK GTEO BZBE\
    \ TGVX VTKX EXLL VHFF NGBV TMBH GLVH LMEB OXL\n\nOne simple approach is to try\
    \ all possible number of shifts on the first few letters of the ciphertext:\n\n\
    ![](image/i-08-01-h.jpg)\n\nThis is a decent way to find the solution, but with\
    \ a pen and paper we can go a bit faster. First, take the first letter of the\
    \ ciphertext and write down the rest of the alphabet backwards, like so:\n\n![](image/i-08-02-h.jpg)\n\
    \nNotice that after arriving at the letter A, we continue counting from the last\
    \ letter of the alphabet: Z,Y,Z.... Let’s add more lines of the reversed alphabet,\
    \ each time starting with the next letter of the ciphertext:\n\n![](image/i-08-03-h.jpg)\n\
    \nCan you see a pattern emerge in a column? Let’s continue for a few more lines:\n\
    \n![](image/i-08-04-h.jpg)\n\nThe 19th column reads THE PRICE! Since all other\
    \ columns are gibberish, we know we found our key:\n\n![](image/i-08-05-h.jpg)\n\
    \nWe can now decrypt the entire text:\n\n![](image/i-08-06-h.jpg)\n\nFinally,\
    \ by rearranging the spaces and adding punctuation, we find:\n\nTHE PRICE OF SECURITY\
    \ IS ETERNAL VIGILANCE. CARELESS COMMUNICATIONS COST LIVES.\n\nIII      Cracking\
    \ the Substitution Cipher\n\nIn the “Hollow Coin ![](image/c-moeadacasa.jpg)”\
    \ problem of sec. 3.1, we challenged you to crack the substitution cipher that\
    \ encrypted the following message:\n\nDUA KVYBVHA PVJ OAZQMASAO DW CWES PQLA KASJWFVZZC.AMASCDUQFH\
    \ QJ VZZ SQHUD PQDU DUA LVGQZC. PA PQJU CWE JEYYAJJ. HSAADQFHJ LSWG DUA YWGSVOAJ.\n\
    \nLet’s start with the most basic frequency analysis observation: in English,\
    \ the most common letter is E and the most common pair of consecutive letters\
    \ is TH. Since the most common letter of the ciphertext is A and the most common\
    \ letter pair is DU, we can try the mappings E → A and T,H → D,U:\n\nTHE KVYBVHE\
    \ PVJ OEZQMESEO TW CWES PQLE KESJWFVZZC. EMESCTHQFH QJ VZZ SQHHT PQTH THE LVGQZC.\
    \ PE PQJH CWE JEYYEJJ. HSEETQFHJ LSWG THE YWGSVOEJ.\n\nOur work is made easier\
    \ by the fact that the ciphertext has kept the spaces and punctuation of the plaintext.\
    \ We can immediately see that our tentative mapping T,H,E → D,U,A has a good chance\
    \ of being correct, as the common word THE appears three times!"
