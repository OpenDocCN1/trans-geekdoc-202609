    ![](image/05-06-h.jpg)


    Figure 5.6 Getting features from temporal data.


    ![](image/i-05-06-h.jpg)


    One other way to construct a feature is to convert and encode temporal data as
    categorical data. For example, if hospitalizations due to intoxication are more
    frequent at night or on weekends, this could have an impact on y. You can make
    this information available in X as binary data. A lot of hidden information can
    be brought to light this way, such as the season of the year, the occurrence of
    a holiday, or the availability of open drugstores. Create features for the chronological
    and seasonal patterns that are likely related to what you want to predict.


