  raw: 'So far, we’ve seen plots that explore one variable—or column of data. The
    scatter plot explores how two variables relate to each other. In this plot, each
    data record is one dot. A dot’s position on the vertical axis represents the record’s
    value in one column. The dot’s position on the horizontal axis represents the
    record’s value in the other column. The next figure shows how to construct a scatter
    plot from the data points in fig. 4.11:


    ![](image/04-20-h.jpg)


    Figure 4.20 Los Angeles number of recorded assaults versus daily peak temperatures
    in July 2018. Temperature outliers in red.


    ![](image/04-21-v.jpg)


    Figure 4.21 Number of assaults versus daily peak temperatures, and then the average
    wind speed for the rest of 2018.


    From the correlation matrix tab 4.7, we know assaults and wind aren’t correlated,
    but that there is a correlation of 0.28 between assaults and temperatures. Can
    you see from the plot that warmer days tend to have more assaults?


    It will be easier to spot a correlation with temperature if we have data that
    covers a greater range of temperatures. Let’s try the daily recorded number of
    criminal offenses in Minneapolis:


    ![](image/04-22-h.jpg)


    Figure 4.22 Minneapolis offenses versus peak temperature and average wind speed
    in 2018.


    ![](image/04-23-h.jpg)


    Figure 4.23 Minneapolis number of recorded offenses from 2010 to 2018. Each plot
    has more than 3000 points, therefore many overlap and the visualization is difficult
    to interpret.


    ![](image/04-24-h.jpg)


    Figure 4.24 Minneapolis number of recorded offenses from 2010 to 2018 at 20% opacity.
    Darker shades of gray form in the areas with a higher concentration of points.
    The left plot has a correlation coefficient of 0.58: warmer days tend to suffer
    more crimes. There is no apparent pattern between wind and crime, and the data
    points shown on the right yield a −0.11 correlation.


    ![](image/04-25-h.jpg)


    Figure 4.25 Pay close attention to outliers: the lonely dots far from all the
    others. Find out to which rows these dots correspond. The cold day with many offenses
    is 4 February 2018, when the Super Bowl took place in Minneapolis! The warm day
    with few offenses has no obvious explanation, so it could very well be an issue
    with the police department’s data collection system.


    Time Series


    If your data points all have an associated time stamp, you can plot them in chronological
    order and trace a line connecting consecutive ones. This type of graph is called
    a time series. It can reveal interesting relationships and patterns between your
    data and time. Here’s a time series of daily peak temperatures in Los Angeles
    in July 2018, using the same data as fig. 4.11:


    ![](image/04-26-h.jpg)


    Figure 4.26 July 2018 Los Angeles peak temperatures.


    When a time series has many points packed too close together, the variations between
    consecutive points can add a lot of jitter to the plot. Observe what happens if
    the same plot is made with every single day of the year, using the same data as
    fig. 4.12:


    ![](image/04-27-h.jpg)


    Figure 4.27 Los Angeles peak temperatures over all months of 2018.


    In such cases, we can smooth the plot to make it easier to read. One common technique
    is called the moving average: each data point is replaced by the mean of itself
    and a few preceding points. The number of preceding points used is called the
    window size. Let’s see how this looks like.


    ![](image/i-04-16-h.jpg)


    (a) Window size of 7 days.


    ![](image/i-04-17-h.jpg)


    (b) Window size of 15 days.


    ![](image/04-28-h.jpg)


    (c) Window size of 30 days.


    Figure 4.28 Moving averages of daily peak temperatures over the year 2018 in Los
    Angeles at different window sizes. Increasing the window size makes the moving
    average of our time series smoother every time.


    ![](image/04-29-h.jpg)


    Figure 4.29 Comparing the 15-day moving averages of peak temperature time series
    of Minneapolis (gray) and Rio de Janeiro (colored).


    We already knew from the box plots (fig. 4.13) and the histograms (fig. 4.19)
    that peak temperatures in Rio de Janeiro and Minneapolis have very different distributions.
    Now, we can clearly see that they are almost the same from June to August, when
    it’s summer in Minneapolis and winter in Rio!


    Many other events are also influenced by the time of year. Ice-cream sales are
    higher in the summer, and occurrences of respiratory illness are higher in the
    winter. Once you plot your data in a time series, seasonal patterns become very
    easy to spot.


    In general, time plots are useful when we need to understand how a variable grows
    or shrinks over time. For example, the price of storing digital data has reduced,
    fueling the data science revolution. To fully realize how dramatic the change
    has been, let’s plot the cost of data storage over time:


    ![](image/04-30-h.jpg)


    Figure 4.30 Inflation-adjusted storage cost of 1 GB.


    In 1985, it cost over $100,000 (in 2019 dollars) to store one gigabyte of data.
    In 2018, it cost less than 3¢. As the scales of these prices are several orders
    of magnitude apart, the line in the plot flattens out after 1995 and it’s difficult
    to discern what’s happening from that point onward.


    LOGARITHMIC SCALES There is a helpful trick to view data across such orders of
    magnitude: trade the common linear scale for a logarithmic scale. A linear scale
    is defined such that each tick is equal to the previous plus some number. For
    example, each tick on the vertical axis of fig. 4.30 is equal to the previous
    plus $20k. On the other hand, a logarithmic scale is defined such that each tick
    is equal to the previous times some number. The number 10 is often chosen, as
    it makes the ticks display nice round numbers:


    ![](image/04-31-h.jpg)


    Figure 4.31 Inflation-adjusted storage cost of 1 GB (log scale).


    Observe how storage prices from 1995 to 2018 no longer resemble a flat line. It
    is now possible to precisely read the storage prices from each year. From 1985
    to 2010, the price per GB became roughly ten times cheaper every 5 years, except
    between 1995 and 2000, where prices decreased by a whopping factor of almost 100!


    In 2011, terrible floods struck Thailand, claiming the lives of 815 people and
    affecting millions more. Many factories were badly damaged, disrupting global
    supply chains for hard disk drives throughout 2012. This tragic event explains
    the very visible spike in prices on fig. 4.31.


    Maps


    When you have geographical data, show it on a map. If, for example, you know the
    daily peak temperatures for every county in the USA, you can create a heat map:


    ![](image/04-32-h.jpg)


    Figure 4.32 Mean maximum daily temperature (July 2018), revealing cool areas around
    the Rocky and Appalachian mountain ranges.


    Mapping isn’t limited to geographical data. For instance, when aerodynamics engineers
    obtain temperature values for every point in space of an airflow, they will map
    it in three dimensions:


    ![](image/04-33-h.jpg)


    Figure 4.33 Fan-generated wind cooling down an electronic circuit board. The air
    at the vent (right) is slightly warmer than at the fans (left).


    4.5      Testing


    As we explore data and identify patterns, we often devise theories to explain
    what we observe, and many of those turn out to be misguided or wrong. As the famous
    cosmologist Carl Sagan said during his last ever interview:


    “Science is more than a body of knowledge. It is a way of thinking; a way of skeptically
    interrogating the universe with a fine understanding of human fallibility.”


    It can feel deeply unnatural to question one’s own assumptions, and subsequently,
    it is challenging to explain patterns conclusively. Thankfully, scientists value
    skepticism and developed tools to help.


    Hypotheses'
