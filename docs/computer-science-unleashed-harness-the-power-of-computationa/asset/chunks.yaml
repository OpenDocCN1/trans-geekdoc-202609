    \ could be improved. Thank you!\n\n Bonus  \n\nBONUS\n\nPatterns\n\nRegular expressions\
    \ allow you to master your data. Control it. Put it to work for you. To master\
    \ regular expressions is to master your data.\n\n—JEFFREY FRIEDL\n\nCoders often\
    \ work with data that matches a given pattern. Let’s consider a document containing\
    \ dates written as “Feb 27th 2013”, “27/2/13” and “2013-02-27”. How do we find\
    \ all the dates in such a file? Writing programs to detect patterns is time-consuming\
    \ and quite tedious.\n\n![](image/07-01-h.jpg)\n\nFigure 7.1 Don’t ask your boss\
    \ on a date!\n\nThankfully, we can define patterns such as date formats using\
    \ regular expressions. These expressions can then be interpreted by existing software\
    \ so we don’t have to write the pattern-matching code ourselves. In this chapter,\
    \ we’ll learn to:\n\n![](image/c-olhos.jpg) Match basic patterns,\n\n![](image/c-1a4.jpg) Precisely\
    \ quantify repeating patterns,\n\n![](image/c-ancora.jpg) Anchor patterns to locations,\n\
    \n![](image/c-familia.jpg) Capture groups of items within a pattern.\n\nAlso referred\
    \ to as regex or regexp, regular expressions are tremendous time-savers loved\
    \ by programmers. They are easy to integrate in your code thanks to the many readily\
    \ available libraries and tools. In fact, they are already built in most programming\
    \ languages, source code editors, command line tools, etc.\n\n![](image/07-02-h.jpg)\n\
    \nFigure 7.2 “I used to be a big stuttering piece of code. Now I’m sharp and clear,\
    \ and I easily find dates!”\n\nMatching\n\nA regular expression is like a search\
    \ term on steroids. Consider the following:\n\nDistrict 1, Paris\n\nThat’s a simple\
    \ regular expression, and it works as a typical search. A regular expression engine\
    \ is a program that will interpret this expression, run it against some text,\
    \ and report a match if the string “District 1, Paris” can be found. There are\
    \ slight variations in syntax, features, and behaviors across engines. Nerds call\
    \ them flavors.\n\nMost flavors are case-sensitive by default, so “district 1,\
    \ paris” would not have been matched. Fortunately, they also allow you to configure\
    \ the way they crunch data through flags. For example, the case insensitive flag\
    \ (typically denoted i) would allow us to find “district 1, paris” from our capitalized\
    \ expression.[1](#CSU-2-14.xhtml#nota7-01)\n\nWe strongly encourage you to try\
    \ all the regular expressions in this chapter. Open [http://code.energy/regex](http://code.energy/regex)\
    \ and you’ll see a field for your regular expression, and a text box for a test\
    \ input. It will show where the expression matches the input. You can also set\
    \ flags. Try it and observe how the case insensitive flag affects your matches!\n\
    \nThe Dot\n\nLet’s suppose you want to search for any of these phrases:\n\n• “District\
    \ 1, Paris”,\n\n• “District 2, Paris”,\n\n• “District 3, Paris”,\n\n• “District\
    \ 4, Paris”.\n\nInstead of carrying out four searches, we can let the tenth character\
    \ of a single search match anything:\n\nDistrict ., Paris\n\nIn regular expressions,\
    \ the dot (.) has a special meaning: it will match any single character. Our expression\
    \ will even match phrases we’re not interested in such as “District 0, Paris”\
    \ and “District !, Paris”. Nevertheless, the dot provides a quick way to find\
    \ text that loosely matches your pattern. Consider this expression:\n\nc.........y\n\
    \nIt matches “calligraphy”, “consistency”, and “chaotically”, and since the dot\
    \ also matches the space character, “can be easy” and “code energy” are also matched.\
    \ Note that boundaries between words aren’t considered here, so “cisco enjoy”\
    \ will be found in “Francisco enjoyed”. Let’s see how all this allows us to do\
    \ far more than a static search:\n\nDOMAIN NAME ![](image/c-mundo.jpg) You remember\
    \ an email mentioning a website that ends with mil and a country code. You don’t\
    \ remember much else: it could be mil.br/, eng.mil.ru/, mil.be/frite, etc. How\
    \ can you find the domain?"
