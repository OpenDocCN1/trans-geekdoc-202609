    segments. Similarly to UDP datagrams, TCP segments bundle the data with some extra
    information:


    ![](image/01-30-h.jpg)


    Figure 1.30 A simplified representation of a segment. Packets carrying segments
    have their protocol number set to 0x6.


    Each of these fields is necessary for TCP to guarantee the integrity of the full,
    reassembled data:


    PORT NUMBERS A host typically manages multiple TCP channels for its different
    applications. Once a segment arrives, there must be a way for a host to match
    it with the communication channel to which it belongs. To this end, segments carry
    their source and destination port numbers. A TCP channel of communication can
    be uniquely identified by four numbers: the IP addresses of the hosts, and two
    port numbers–one chosen by each host.


    SEQUENCE NUMBER The sending host splits the application data in a sequence of
    small chunks. It assigns a sequence number to each chunk to indicate how they
    should be ordered. Each chunk is fit in a segment with its respective sequence
    number, and the segments are transmitted one-by-one on board individual IP packets.
    If segments arrive out of order, the receiving host reorders them using their
    sequence numbers. If a segment arrives twice, the host will notice the repeated
    sequence number and discard the duplicate data.


    ACKNOWLEDGMENT NUMBER Communication is bidirectional with TCP: remote applications
    simultaneously exchange segments. In order to keep track of which segment each
    host has received, they each include an acknowledgment number. It corresponds
    to the sequence number of the next segment the host expects to receive from its
    counterpart. For example, if Charles sends a segment with the acknowledgment number
    44 to Ada, he acknowledges that he received all her segments until the sequence
    number 43. If he has no data to send her, he must still send segments without
    data for acknowledgment purposes:


    ![](image/01-31-h.jpg)


    Figure 1.31 Charles receives an image from Ada. He has no data for her, so he
    sends empty acknowledgment segments. Notice that the sequence numbers of his segments
    don’t increase. While sending her data, Ada signals she is ready to receive Charles’
    segment No 20.


    After sending a non-empty segment, the sending host starts a timer for the receipt
    of its acknowledgment. If an acknowledgment takes too long to arrive, the sender
    assumes the packet was lost, retransmits the unacknowledged segment, and resets
    the timer.


