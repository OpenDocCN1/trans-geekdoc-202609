    \nI never liked the term ‘computer science’. The main reason I don’t like it is\
    \ that there’s no such thing. Computer science is a grab bag of tenuously related\
    \ areas thrown together by an accident of history, like Yugoslavia.\n\n—PAUL GRAHAM\n\
    \nMost technological breakthroughs of our era are taking place in a new digital\
    \ world created by programmers. Computer scientists combine different fields of\
    \ study in order to empower this new world. This book explores the foundations\
    \ of some of these fields, including networking, cryptography, and data science.\n\
    \nWe’ll start with the story of how two computers can be linked to share information,\
    \ and take you all the way to the rise of email and the Web. We’ll explore cryptography\
    \ and understand how the Internet and other systems that deal with private data\
    \ are made secure. Then, we’ll learn how knowledge can be obtained from raw data\
    \ and how machines can be taught to forecast the future.\n\nWe hope these stories\
    \ will familiarize you with important concepts that can benefit coders and tech\
    \ enthusiasts alike. Our goal is to cover what beginners need in order to get\
    \ up to speed in networking, security and data science, without the heavy academic\
    \ rigor that sometimes makes these topics unbearable.\n\n![](image/00-01-h.jpg)\n\
    \nFigure 1 “Data is the new oil”, by Amit Danglé & Ivano Nardacchione.\n\nThis\
    \ book was made possible by the supporters of our previous title, Computer Science\
    \ Distilled. We had written our first book to explain the fundamental principles\
    \ of computer science. Our enthusiastic readers asked for more, so we got back\
    \ to work! This time, we don’t explore the core of our discipline, but rather\
    \ the new worlds it has enabled us to create.\n\nIs this book for me?\n\nIf you’re\
    \ a novice programmer, this book was written for you. It doesn’t require any programming\
    \ experience, as it essentially presents ideas and mechanisms: we want you to\
    \ learn how cool stuff works. If you’re curious and want to understand how the\
    \ Internet is built, how hackers attack computer systems, or why data is the gold\
    \ of the 21st century, you’ll find this book worthwhile. And for those who already\
    \ studied computer science, this book is a great recap to consolidate your knowledge\
    \ and expertise.\n\nAcknowledgments\n\nWe are deeply grateful for everyone who\
    \ supported our multi-year effort to create this book. We’d like to especially\
    \ thank Abner Marciano, André Lambert, Caio Magno, Carlotta Fabris, Damian Hirsch,\
    \ Daniel Stori, Eduardo Barbosa, Gabriel Pictet, Guilherme Mattar, Jacqueline\
    \ Wilson, Leonardo Conegundes, Lloyd Clark, Michael Ullman, Rafael Almeida, Rafael\
    \ Viotti, and Ruhan Bidart. Finally, we’re grateful to Claire Martin, our proofreader,\
    \ and Pedro Netto, our illustrator, for making this book so much better.\n\nMay\
    \ you create many worlds,\n\nWlad & Moto\n\n Chapter 1  \n\nCHAPTER 1\n\nConnections\n\
    \nThis is an entirely distributed system, there isn’t any central control. The\
    \ only reason it works is because everybody decided to use the same set of protocols.\n\
    \n—VINT CERF\n\nHUMANS CRAVE CONNECTIONS, and the advent of the digital revolution\
    \ has empowered us to be more connected than ever before. The Internet has unleashed\
    \ upon billions of people unprecedented economic and political freedom, as well\
    \ as powerful means of control and domination. Yet, the vast majority of us are\
    \ oblivious to its inner workings."
