  raw: 'After these steps, encrypted HTTP messages can be exchanged between client
    and server. When TLS is used with HTTP, we call the resulting protocol HTTPS.
    While HTTP uses port 80 by default, HTTPS defaults to port 443. Web servers listening
    to TCP port 443 expect the client to send the first TLS message right after the
    connection is established.


    TLS is used in several other protocols besides HTTPS, including SMTP. There are
    programming libraries that make it easy for coders to use TCP with TLS. Instead
    of manually creating and securing a regular TCP socket, the coder uses the library’s
    functions to directly create a TLS socket. Behind the scenes, the library takes
    care of all the encryption work. Programmers can operate TLS sockets almost exactly
    as they would operate TCP sockets.


    Other Protocols


    Many other security protocols exist. For instance, IPsec is an IP extension that
    provides security to all IP-based communications. Contrarily to IP packets, IPsec
    packets can’t be read or be altered while they travel. IPsec is often used to
    create Virtual Private Networks (VPNs), where an Internet connection acts as a
    physical link so that a computer can join a distant local network as if it were
    there.


    DNS also has its own secure extension called DNSSEC. It extends DNS records with
    digital signatures. This enables anyone to verify that a signed DNS record was
    created by its owner. Without DNSSEC, a DNS server can send you forged DNS records
    in order to direct you towards a malicious host. As of 2020, DNSSEC isn’t widely
    used, but adoption is improving steadily.


    Protocols for securing wireless communications are widely used. For example, they
    prevent people with radio sniffers from reading the contents of your IP packets
    transmitted via secure WiFi. They also allow you to type on a wireless Bluetooth
    keyboard without the risk of your keystrokes being recorded by an unauthorized
    machine.


    Today, the lack of email security is a big concern. Emails can be transmitted
    securely using SMTP with TLS, but the vast majority of mail servers store emails
    in plaintext. Large email providers such as Gmail or Hotmail may read the emails
    of their users if they wish. Most security experts agree that a message should
    only be readable by its sender and recipient. Communication systems that adhere
    to this principle are said to use end-to-end encryption. Some instant messaging
    applications—such as Signal, Threema and WhatsApp—use end-to-end encryption. New
    protocols are actively being developed to make end-to-end encryption widely available
    for email.


    3.6      Hacking


    A hacker is a person with strong computer skills who is able to achieve certain
    goals in non-standard ways. In popular culture, hackers are often portrayed as
    geeky wizards who can infiltrate military-grade computer systems with a few keystrokes.
    Although movies aren’t always realistic, there is some truth to the idea that
    hackers are an elite force. Hackers often specialize in low-level computing, understanding
    in detail each step a computer takes to execute a simple action.


    Most of the time, hackers are IT security specialists who have a deep understanding
    of network protocols and are capable of manipulating individual bits in network
    packets. They use their skills to uncover loopholes that allow them to pwn a machine[23](#CSU-2-10.xhtml#nota3-23)—to
    gain control over it and perform tasks without permission.


    This doesn’t mean that all hackers are bad guys. White hat hackers work hard to
    ensure no harm is caused by vulnerabilities they uncover. They mostly search for
    vulnerabilities in order to fix them before any harm is done. In contrast, black
    hat hackers typically exploit vulnerabilities for personal gain regardless of
    the harm they cause in the process.


    Typically, a hacker looks for ways to bypass (rather than break) the cryptography
    that protects a computer system. Designing a computer system is like building
    a medieval castle. You must anticipate how different attackers might attempt to
    infiltrate your castle and implement countermeasures for each attack vector. Knowing
    how hackers operate will help you to develop these countermeasures. Surprisingly,
    the most widely used hacking methods involve almost no technical skills.


    Social Engineering


    Hacking attacks most often take advantage of flaws of humans rather than computers.
    Tricking someone who has access to a computer system can be much easier than bypassing
    the defenses of the system itself. Malicious hackers typically do it by impersonating
    others through emails, phone calls and text messages. Sophisticated attackers
    sometimes counterfeit entire websites. Others will even physically show up at
    a data center impersonating an employee! These are called social engineering attacks.


    ![](image/03-10-v.jpg)


    Figure 3.10 Courtesy of http://smbc-comics.com.


    Social engineers operate like con artists: they can develop elaborate schemes
    in order to gain trust and access. The most common trick is called phishing. It’s
    when the attacker forges an email that appears to come from a trusted source.
    Phishing emails typically link to a counterfeit website requesting secret information
    such as a password or credit card number. More sophisticated ones will contain
    malicious software hidden within an attachment.


    THE DNC PHISHING During the 2016 United States presidential election, hostile
    hackers crafted a phishing email directed to a member of the DNC.[24](#CSU-2-10.xhtml#nota3-24)
    The email warned of suspect Google account activity and urged the user to change
    the password. It included a link to a fake Google web page asking for the user’s
    login details. As soon as the user entered the password, the attackers got in
    and downloaded thousands of sensitive emails. Most of them were leaked to the
    public, causing considerable political damage and the resignation of several key
    politicians.


    Attacks like these keep happening time and again. It’s estimated that about 90%
    of all data leaks originate from a successful phishing attack. There’s also a
    variant of this attack vector called vishing: the hacker impersonates someone
    on the phone in order to obtain privileged information or access to computer systems.


    THE CIA VISHING In 2015, a 15-year-old British hacker called Verizon and pretended
    to be a staff employee. He managed to obtain key information about a special Verizon
    customer: the director of the CIA.[25](#CSU-2-10.xhtml#nota3-25) Using this information,
    the hacker was then able to impersonate the director himself on a call with AOL
    tech support. He correctly answered all security questions, and changed the director’s
    email password. Ultimately, the young hacker gained access to key military and
    intelligence documents about CIA operations in Iraq and Afghanistan.


    Social engineering can be mitigated first and foremost by educating the users
    of your systems on the importance of checking the authenticity of emails and web
    pages before disclosing any private information. It is also important to enforce
    strict identity verification for every user in your systems when they change their
    password or update some other security setting. But these precautions are not
    enough: in more sophisticated attacks, the victim only needs to click a web link
    or to open an attached document for the hacker to pwn the system.


    Software Vulnerabilities


    Programmers know that parts of their code doesn’t always work exactly as intended.
    As software becomes complex, the different situations it handles grows exponentially–and
    so does the risk for an unexpected situation to occur where a combination of inputs
    lead to an unwanted behavior.


    These unwanted behaviors may cause the system to crash. They may cause secret
    information to be exposed. In the worst case, an intruder might be allowed to
    execute any piece of code. We call the sequence of inputs that leads to such unwanted
    behaviors a vulnerability. Let’s now see some common types of vulnerabilities.'
