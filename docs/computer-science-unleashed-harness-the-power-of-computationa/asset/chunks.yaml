  raw: 'From top-left to bottom-right, there is a diagonal of ones: columns perfectly
    correlate with themselves. Furthermore, the top-right half of the matrix is symmetrical
    to the bottom-left half: the correlation between ![](image/c-folha.jpg) and ![](image/c-faisca.jpg)
    is equal to that between ![](image/c-faisca.jpg) and ![](image/c-folha.jpg). All
    these grayed out values offer no additional information and are generally removed
    from the correlation matrix for clarity and concision.


    Notice that some of the columns have negative correlation coefficients, such as
    ![](image/c-termometro.jpg) and ![](image/c-chuva.jpg). Negative correlation values
    indicate that columns vary together in opposite directions: as more rain is registered,
    lower peak temperatures are recorded.


    When correlation values are close to zero, we say they are virtually uncorrelated.
    For example, accidents don’t seem affected by wind speeds. Conversely, the strongest
    correlation we have is between ![](image/c-faca.jpg) and ![](image/c-termometro.jpg).
    The data seems to suggest that criminals tend to be more aggressive when the weather
    is warmer.


    Such a correlation matrix helps us explore how columns are related to each other.
    When two variables correlate, investigate the causes in the real world, you might
    make interesting discoveries.


    CAUSALITY There is a trap. When we find a correlation between two phenomena, we
    are often quick to assume that one caused the other. This is not automatically
    the case. For example, shopping malls typically register a high correlation between
    their sales of sunglasses and of ice-cream. Does this imply that wearing sunglasses
    makes you crave ice-cream? Or that eating ice-cream causes your eyes to be more
    sensitive? No. Always keep in mind that correlation does not imply causation.


    ![](image/04-10-h.jpg)


    Figure 4.10 “Correlation”, courtesy of [http://xkcd.com](http://xkcd.com).


    TRANSFORMATIONS Columns often have to be transformed for correlations to be found.
    For example, accidents due to skidding in your city might correlate poorly with
    rainfall or vehicle speeds, but correlate strongly with the amount of rainfall
    times the speed limit squared. It can become tricky to find the transformations
    that reveal such correlations. If the correlation coefficient of two columns or
    their transformations is close to zero, this does not necessarily mean that those
    two variables are not related to each other.


    Summarizing numbers simplifies and reduces the amount of information we have to
    consider. Much of the nuance, however, remains out of our reach, and it can be
    difficult to find a path forward. Capturing more of the data by using shapes and
    colors is the next step of exploration. A picture is worth a thousand numbers!


    4.4      Visualization


    The mean, standard deviation, and five-number summary provide a helpful but simplistic
    overview of a dataset’s story. To uncover more clues, we must resort to our visual
    pattern recognition instincts. Graphing and plotting allow us to see the data,
    explore its patterns and nuances, and reveal anomalies caused either by extraordinary
    events or—more commonly—by simple processing mistakes.


    Box Plots


    There is a graphic representation of the five-number summary, and it’s called
    the box plot. The upper and lower quartiles are drawn as the upper and lower sides
    of a box, and a horizontal line divides the box at the median. Whiskers protrude
    over and under the box to reach for the maximum and minimum non-outlier values,
    and outliers are often added as individual points. Let’s construct a box plot
    for the July 2018 temperatures in Los Angeles:


    ![](image/04-11-h.jpg)


    Figure 4.11 Constructing from fig. 4.8 a box plot of daily peak temperatures in
    Los Angeles in July 2018 (n \= 31 days).


    \*ignoring outliers


    Notice that increasing the amount of data to the entire year affects the box plot
    (Figure 4.12). Then, check out how box plots can be used to compare different
    cities on a single chart (Figure 4.13).


    ![](image/04-12-v.jpg)


    Figure 4.12 Box plot of daily peak temperatures in Los Angeles in all of 2018
    (n \= 365). Only two outliers remain because the entire set of 365 data points
    has a different interquartile range and normality boundaries than the set for
    July only.


    ![](image/04-13-h.jpg)


    Figure 4.13 Box plots of daily peak temperatures in 2018. Minneapolis and Rio
    de Janeiro do not display outliers.


    While a table makes it easy to read the values of a five-number summary, the box
    plot makes it much easier to compare the distributions described by different
    five-number summaries.


    Histograms


    The five-number summary describes the sub-ranges covered by groups of numbers,
    and you’ve learned to obtain it in two steps: you (a) divide data points into
    groups of equal size, and (b) observe what ranges they cover. Conversely, a histogram
    depicts precisely where within the range data points are concentrated, and it
    is prepared through the opposite process:


    (a) Split the range into intervals of equal size, called bins,


    (b) Observe how many data points each bin contains.


    Finally, we can (c) plot each bin as a bar whose height represents the number
    of data points it contains. The next figure shows the construction of a histogram
    with 10 bins, but we could have used any number. The figures thereafter demonstrate
    how varying the number of bins changes that plot and how histograms can help us
    compare temperatures in different cities.


    ![](image/i-04-12-h.jpg)


    (a) Split the temperature range in 10 bins.


    ![](image/i-04-13-h.jpg)


    (b) Place 365 daily peak temperatures into their bins.


    ![](image/04-14-h.jpg)


    (c) Stretch each bin so its height represents the number of dots it contains.


    Figure 4.14 Creating the histogram of daily peak temperatures in Rio de Janeiro,
    which ranged from 21.1°C to 39.1°C in 2018. Note that in typical histograms, all
    bins share the same color.


    ![](image/04-15-h.jpg)


    Figure 4.15 Six histograms of the same dataset. More bins give a more precise
    depiction of the distribution. However, too many bins make your histogram look
    bumpy and unclear.


    ![](image/04-16-h.jpg)


    Figure 4.16 Histograms of peak temperatures for different cities (2018). We can
    immediately see that Minneapolis is the perfect town if you dislike mild temperatures
    and enjoy extreme ones—whether they’re burning hot or freezing cold!


    CUMULATIVE HISTOGRAMS There’s a different way to do histograms. Instead of each
    bin’s height only representing the number of data points it contains, we can also
    add the number from previous bins. Therefore, bins only get taller as we move
    to the right. Here’s how to obtain such a cumulative histogram from a regular
    histogram:


    ![](image/i-04-14-h.jpg)


    (a) Scale down fig. 4.14c.


    ![](image/i-04-15-h.jpg)


    b) Stack each bin on top of the previous.


    ![](image/04-17-h.jpg)


    c) Color in the cumulated bins.


    Figure 4.17 Creating a cumulative histogram.


    Notice that the bin ending at 33.4°C has a height of 292. This tells us that 292
    days, or 80% of the year, were cooler than 33.4°C. Let’s now compare our four
    cities with 10-bin cumulative histograms:


    ![](image/04-18-h.jpg)


    Figure 4.18 Cumulative histograms of peak temperatures (2018).


    When observing any graph, always inspect its scales. The temperatures in Minneapolis
    and Rio de Janeiro might seem rather similar in fig. 4.18, but these plots have
    very different scales on the horizontal axis. If we plot one histogram over the
    other, the differences between the cities become apparent:


    ![](image/04-19-h.jpg)


    Figure 4.19 Comparing peak temperature cumulative histograms of Minneapolis (gray)
    and Rio de Janeiro (colored). The bins were carefully defined on the same temperature
    intervals for both cities. Since the ranges don’t match, Rio de Janeiro gets some
    empty bins!


    Scatter Plots'
