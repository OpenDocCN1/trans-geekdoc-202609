    # INFORMATIONAL MESSAGES


    Error reports are not the only messages ICMP defines to inspect and diagnose faulty
    computer networks. Most notably, the echo request and echo reply informational
    message pair is widely utilized. When a computer receives an ICMP echo request,
    it returns a packet containing an ICMP echo reply.


    This is useful to test if a computer is online. There’s a program called `ping`
    that sends out an ICMP echo request message and measures how long it takes for
    the reply to reach you.[14](#CSU-2-8.xhtml#nota1-14) Furthermore, by sending ICMP
    echo requests with different initial hop limits, you can trace the route packets
    follow to reach their destination.[15](#CSU-2-8.xhtml#nota1-15)


    ## 1.5 Transport


    We’ve seen that computers on the Internet can exchange messages in IP packet payloads.
    For example, they can exchange ICMP messages. However, the true power of the Internet
    is unleashed when applications, not computers, start sending each other data in
    IP packet payloads.


    Computers on a network are often called hosts because they merely host the applications
    that utilize the network. For instance, a smartphone can host applications to
    simultaneously stream music, surf the web, and receive emails.


    Generally, an application shares its host with other applications, but it doesn’t
    want to go through all incoming IP packets. To solve this issue, applications
    ask their hosts to send and receive the packets on their behalf. That way, the
    hosts direct each packet’s payload toward the right application, and each application
    only receives the data it should be reading.


    This solution requires the data sent by an application to be accompanied by some
    extra information. The transport layer specifies how to format and interpret this
    extra information within an IP packet’s payload.


    ### User Datagram Protocol


    The simplest transport layer protocol is the User Datagram Protocol (UDP). Applications
    that use UDP are assigned port numbers by their hosts. Exchanged messages are
    preceded by the port numbers of both sending and receiving applications.


    To communicate via UDP, an application first creates a socket. A socket is a communication
    channel between the application and its host. Suppose there’s a calendar application
    running at Facebook using UDP port number 18. An application running on Ada’s
    host can send a message to this hypothetical Facebook application as follows:


    ```

    socket ← SOCKET.new(IP, UDP)

    message ← "When is Charles’ birthday?"

    facebook_address ← 2a03:2880:f003:c07:face:b00c::2

    app_port ← 18

    socket.sendto(message, facebook_address, app_port)

    ```


    When sending this message, Ada’s host automatically assigns an unused port number
    to the newly created socket. Let’s suppose that it selects the port number 54321.
    The IP packet that’s transmitted when `sendto()` is called will look like this:


    ![](image/01-29-h.jpg)


    Figure 1.29 When an IP packet’s payload conforms to the UDP format, it’s called
    a datagram. Packets carrying datagrams have their protocol number set to `0x11`.


    A host can manage thousands of different sockets for its applications. A single
    application can even create multiple sockets to operate many communication channels
    in parallel. Each socket gets assigned its own port number by its host.


