    one. Another prevalent feature is the occurrence of specific words. For instance,
    the fact that a medical report contains the words “tumor” or “cancer” can be encoded
    as binary categorical data. Or, if we count the number of occurrences of a key
    word and divide that by the total number of words, we obtain the frequency at
    which it appears.[2](#CSU-2-12.xhtml#nota5-02)


    Guessing which useful features could be hidden in unstructured data is easier
    when you can consult experts who collect and analyze it routinely. If you ask
    physicians what exactly they look for when they inspect medical reports or CT
    scans, they might give you interesting ideas to build relevant features.


    Combining Data


    Your raw data will often come in different shapes and sizes, and sometimes features
    can’t be encoded without prior processing. Furthermore, some data points don’t
    have much meaning on their own, but we can combine them with others. Let’s see
    how to do this.


    AGGREGATES If we have some information that comes as a collection of numbers for
    each record in X or y, we often can’t encode every number as a feature. For example,
    if we’re monitoring patient body temperatures several times per day, our dataset
    will have many registers for each patient’s temperature. To transform this data
    into features, the summarizing tools from last chapter (sec. 4.3) can help:


    ![](image/05-08-h.jpg)


    Figure 5.8 Constructing features by aggregating data.


    When attempting to predict future performance, aggregations are commonly used
    on historical data—past performance is often a good indicator of future performance.
    For example, if you are predicting whether a team will win the NFL, construct
    features from the five-number summary of the team’s score over the past years.


    SCORES We can express an attribute of interest in a single number, even when the
    information related to the attribute comes from different variables. A score is
    a number generated by a math formula to represent a specific attribute. For example,
    the body-mass index is often used in health care, and is calculated from a patient’s
    height in meters and weight in kilograms:


    ![](image/05-09-h.jpg)


    Figure 5.9 The BMI calculated from patient height and weight.


    Well-designed scores encapsulate the knowledge of how multiple factors interact
    and contribute to a meaningful attribute. Calculating a score and adding it to
    X makes that knowledge accessible to the model. For instance, if you’re trying
    to predict if people will develop diabetes and you have people’s height and weight,
    include the BMI score as a feature. Obesity is a risk factor for diabetes, and
    its best obtainable measure is often the BMI.


    In social sciences, the human development index (HDI) scores a country’s development
    from its literacy rate, mean life expectancy, and gross domestic product (GDP)
    per capita. In finance, the FICO credit score describes a person’s creditworthiness,
    given their net debt and payment history.


    When there is no well-established score for a given metric, you can create your
    own. For instance, if you’re trying to predict the future sales price of apartments,
    and you believe the perceived safety of the building is a good indicator, you
    can construct your own “safety score” that combines many factors: the number of
    crimes registered in the neighborhood, the building’s distance to a police station,
    whether it has a doorman, or a video-surveillance system.


    After creating new features, revisit the data exploration techniques from Chapter
    4. Build summaries and plots for the new features. This helps you check if the
    features were crafted correctly. Also, a feature’s correlation coefficient with
    y can sometimes provide a preview of its predictive power.


    Missing Values


    Typically, the requirement for data to be numerical in X is strict: most predictive
    algorithms can’t even handle NULL cells. When the value of a feature is unavailable
    for some records, we must rid the column of its empty cells. There are several
    ways to do it.


    DROPPING The simplest method is to remove from X all the rows that contain one
    or more NULL cells:


    ![](image/05-10-h.jpg)


    Figure 5.10 Dropping incomplete rows from X.


    Dropping is a good approach when few rows are affected. However, decreasing the
    amount of X data for training generally decreases the performance of a predictive
    model, and deleting too many rows will limit its predictive power. Moreover, dropping
    rows doesn’t only mean you have less data for training: it also means that you
    will drop the opportunity to make predictions for any important event with missing
    data.


    Sometimes, we have a column where most of the values are missing. In such cases,
    dropping that feature from X is often a better option as it allows you to save
    many rows.'
