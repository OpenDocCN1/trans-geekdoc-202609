  raw: 'Figure 1.10 The SAm-1 system links routers in 16 cities from 11 different
    countries, using over 15 thousand miles of underwater cables.


    There is no direct link between the routers in Miami and Buenos Aires. However,
    Miami is linked with Puerto Rico, which is linked with Fortaleza, which is linked
    with Rio de Janeiro, which is linked with Buenos Aires. Miami and Buenos Aires
    can exchange messages through these cables if routers along the way forward the
    messages back and forth. Today, there are submarine cables linking hundreds of
    coastal city routers around the globe:


    ![](image/01-11-h.jpg)


    Figure 1.11 Fiber-optic submarine cables currently in service.


    Virtually every other city on Earth is directly or indirectly linked to these
    coastal cities, often through cables in the ground. Communication satellites also
    have routers to establish wireless links to remote locations. All routers can
    forward messages, so a message you send on the Internet can be routed to any other
    computer on the Internet. That is, if a path to it can be found.


    Location Addressing


    In the link layer, computers are identified by a physical address. Physical addresses
    uniquely identify computers, but they don’t give any hints on where a computer
    is connected and how it can be reached. If the computer moves to the other side
    of the world, it will retain its physical address!


    Suppose you mailed a package to Louis through the post along with a picture of
    him instead of his address. This package has a defined destination; however, an
    international postal service would have no way of knowing which direction the
    package should be sent in order to deliver it to Louis.


    Post offices must first know to which country the package should go. The first
    post office in that country should then know to which province or state it should
    go. The next post office should know the city, and the final post office, the
    street address. An address containing all this information is called a hierarchical
    address. As with post offices, routers need a hierarchical address of the package
    recipient’s location:


    ![](image/01-12-v.jpg)


    Figure 1.12 Ada wishes to send a package to Louis, so she requests her router
    Charles to forward it. She writes on the package a hierarchical address of Louis.
    Charles then knows he must send the package to France, so he sends it to the French
    router he is linked with: Marie.


    For this mechanism to work on a global scale, all computers involved must follow
    the same set of rules to create and handle package forwarding requests. A computer
    in China must understand a request from a computer in Nigeria, even though the
    two may use different languages, operating systems and hardware.


    ![](image/01-13-h.jpg)


    Figure 1.13 “Before the Internet”, courtesy of [http://xkcd.com](http://xkcd.com).


    Internet Protocol


    We’ve seen a computer must follow the rules of Medium Access Control to establish
    a link with another computer. Similarly, it must follow the Internet Protocol,
    or IP,[6](#CSU-2-8.xhtml#nota1-06) to ask routers to forward messages to other
    computers on your LAN or on the Internet.


    A message forwarding request that follows the IP rules is called an IP packet.
    The IP packet is essentially a big number, where digits in specific positions
    encode key information. Virtually all computers understand IP packets and are
    able to forward them. This makes an IP packet easily movable from one computer
    to the next, until it reaches its destination.


    An IP packet contains the location addresses of its sender and recipient, followed
    by whatever data they want. To send an IP packet, we transmit a frame where the
    payload is the IP packet, and the frame type is 86DD. When a router receives a
    frame of this type, the IP packet is re-transmitted in another frame to the next
    computer in the path of the packet’s destination.


    ![](image/01-14-h.jpg)


    Figure 1.14 Ada sends an Ethernet frame to her router Charles containing an IP
    packet for Louis. The Ethernet frame therefore contains the physical address of
    Charles and the packet contains the location address of Louis. Charles will then
    forward the packet inside a new frame of his own containing the physical address
    of someone in France.


    In order for IP packets to be forwarded around universally, everybody must agree
    on a standard for location addressing. We’ve seen how physical addresses are allocated
    by manufacturers according to the rules of Medium Access Control. Let’s now learn
    how the Internet Protocol does this for location addresses. We will then see how
    the Internet Protocol defines routing rules based on these addresses.


    1.3      IP Addressing


    The Internet Protocol sets the rules on how location addresses work–that’s why
    they’re called IP addresses. Computers can only send or receive IP packets after
    they get an IP address. Permission to use a group of IP addresses is first granted
    to an organization. These addresses are then assigned to computers which are directly
    or indirectly associated with the organization.


    In order to explain how this process works, let’s define what IP addresses are
    and how they’re written.[7](#CSU-2-8.xhtml#nota1-07) An IP address is a number
    128 bits long.[8](#CSU-2-8.xhtml#nota1-08) They’re typically written in hex, with
    colons separating eight groups of four digits. This is Facebook server’s IP address:


    2a03:2880:f003:0c07:face:b00c:0000:0002


    IP addresses can be shortened by omitting the leading zeros of any four-digit
    block:


    2a03:2880:f003:c07:face:b00c::2


    As with a postal address with country, city and street, IP addresses are hierarchical
    for routing to be possible. While the broadest part of a postal address is the
    country, the broadest part of an IP address is the routing prefix (2a03:2880).


    The prefix shows up as the first digits of an IP address. Once an organization
    is granted such a prefix, it has the right to assign any IP address that begins
    with that prefix to its computers. The prefix has a variable length: organizations
    that have more computers to manage are granted shorter prefixes. Some organizations
    are even granted multiple prefixes.


    For example, we know that all addresses that begin with 2a03:2880 are assigned
    to computers inside Facebook’s network. Those that begin with 2c0f:fb50:4002 are
    in Google’s network in Kenya. For its data center in Singapore, Google was granted
    the prefix 2404:6800.


    For routing purposes, the LANs and WANs that share the same prefix are organized
    in small networks called subnets. The digits after the routing prefix and up to
    the middle of an IP address indicate in which subnet (f003:c07) a computer can
    be found.


    2a03:2880:f003:c07:face:b00c::2


    This means there’s a network at Facebook where all computers have IP addresses
    that begin with 2a03:2880:f003:c07. Together, the routing prefix and the subnet
    form the network ID (2a03:2880:f003:c07) of an IP address. The network ID is always
    16 digits long (including omitted zeros). This means an organization with a longer
    routing prefix can have less subnets within it.


    Finally, the next 16 digits of an IP address are called the interface ID (face:b00c::2),
    as they identify a specific network interface within a subnet. Many network administrators
    simply fill in this part of the IP address with the device’s MAC address. These
    digits can be any number, as long as it’s only used once per subnet.


    For this addressing system to work universally, there must be a mechanism to ensure
    no two organizations use the same routing prefix. As was the case for MAC addresses,
    engineers solved this through some international coordination.


    ![](image/01-15-h.jpg)


    Figure 1.15 Don’t ask your boss where she lives!


    IANA'
