    From top-left to bottom-right, there is a diagonal of ones: columns perfectly
    correlate with themselves. Furthermore, the top-right half of the matrix is symmetrical
    to the bottom-left half: the correlation between `![](image/c-folha.jpg)` and
    `![](image/c-faisca.jpg)` is equal to that between `![](image/c-faisca.jpg)` and
    `![](image/c-folha.jpg)`. All these gray out values offer no additional information
    and are generally removed from the correlation matrix for clarity and concision.


    Notice that some of the columns have negative correlation coefficients, such as
    `![](image/c-termometro.jpg)` and `![](image/c-chuva.jpg)`. Negative correlation
    values indicate that columns vary together in opposite directions: as more rain
    is registered, lower peak temperatures are recorded.


    When correlation values are close to zero, we say they are virtually uncorrelated.
    For example, accidents don’t seem affected by wind speeds. Conversely, the strongest
    correlation we have is between `![](image/c-faca.jpg)` and `![](image/c-termometro.jpg)`.
    The data seems to suggest that criminals tend to be more aggressive when the weather
    is warmer.


    Such a correlation matrix helps us explore how columns are related to each other.
    When two variables correlate, investigate the causes in the real world, you might
    make interesting discoveries.


    ### CAUSALITY

    There is a trap. When we find a correlation between two phenomena, we are often
    quick to assume that one caused the other. This is not automatically the case.
    For example, shopping malls typically register a high correlation between their
    sales of sunglasses and of ice-cream. Does this imply that wearing sunglasses
    makes you crave ice-cream? Or that eating ice-cream causes your eyes to be more
    sensitive? No. Always keep in mind that correlation does not imply causation.


    ![](image/04-10-h.jpg)


    Figure 4.10 “Correlation”, courtesy of [http://xkcd.com](http://xkcd.com).


    ### TRANSFORMATIONS

    Columns often have to be transformed for correlations to be found. For example,
    accidents due to skidding in your city might correlate poorly with rainfall or
    vehicle speeds, but correlate strongly with the amount of rainfall times the speed
    limit squared. It can become tricky to find the transformations that reveal such
    correlations. If the correlation coefficient of two columns or their transformations
    is close to zero, this does not necessarily mean that those two variables are
    not related to each other.


    Summarizing numbers simplifies and reduces the amount of information we have to
    consider. Much of the nuance, however, remains out of our reach, and it can be
    difficult to find a path forward. Capturing more of the data by using shapes and
    colors is the next step of exploration. A picture is worth a thousand numbers!


    ## 4.4 Visualization


    The mean, standard deviation, and five-number summary provide a helpful but simplistic
    overview of a dataset’s story. To uncover more clues, we must resort to our visual
    pattern recognition instincts. Graphing and plotting allow us to see the data,
    explore its patterns and nuances, and reveal anomalies caused either by extraordinary
    events or—more commonly—by simple processing mistakes.


    #### Box Plots

    There is a graphic representation of the five-number summary, and it’s called
    the box plot. The upper and lower quartiles are drawn as the upper and lower sides
    of a box, and a horizontal line divides the box at the median. Whiskers protrude
    over and under the box.


    ![](image/04-11-h.jpg)


    Figure 4.11 Constructing a box plot


    Notice that increasing the number of bins affects the box plot. Let’s look at
    the outliers.


    ![](image/04-12-h.jpg)


    Figure 4.12 Box plot with outliers


    While a table makes it easy to read, the box plot makes it much easier to compare.


    ![](image/04-13-h.jpg)


    Figure 4.13 Box plots of different cities


    #### Histograms

    The histogram is a way to visualize the distribution of a numerical variable.
    The horizontal axis represents the range of the variable, and the vertical axis
    represents the frequency or density of each bin.


    ![](image/04-14-h.jpg)


    Figure 4.14 Histograms


    ![](image/04-15-h.jpg)


    Figure 4.15 Histograms of the same dataset


    ![](image/04-16-h.jpg)


    Figure 4.16 Histograms of different cities


    #### CUMULATIVE HISTOGRAMS

    There’s a different way to do histograms. Instead of each bin’s height only representing
    the number of data points it contains, we can also add the number from previous
    bins. Therefore, bins only get taller as we move to the right. Here’s how to obtain
    such a cumulative histogram from a regular histogram:


    ![](image/04-14-h.jpg)

    (a) Scale down fig. 4.14


    ![](image/04-15-h.jpg)

    (b) Stack each bin on top of the previous


    ![](image/04-16-h.jpg)

    (c) Color in the cumulated bins


    Wait, I mean:


    ![](image/04-17-h.jpg)


    Figure 4.17 Creating a cumulative histogram


    Notice that the bin ending at 33.4°C has a height of 292. This tells us that 292
    days, or 80% of the year, were cooler than 33.4°C. Let’s now compare our four
    cities with 10-bin cumulative histograms:


    ![](image/04-18-h.jpg)


    Figure 4.18 Cumulative histograms of peak temperatures


    When observing any graph, always inspect its scales. The temperatures in Minneapolis
    and Rio de Janeiro might seem rather similar in fig. 4.18, but these plots have
    very different scales on the horizontal axis. If we plot one histogram over the
