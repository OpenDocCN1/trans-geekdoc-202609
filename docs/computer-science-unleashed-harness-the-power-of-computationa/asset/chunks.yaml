    # 消息认证码 (MAC)


    消息认证码 (MAC)14 是一种证明给定消息源于已知特定密钥的方法。虽然 MAC 可以通过数字签名来实现，但使用哈希函数实现在计算上会更快。


    ## 安全调查


    安全调查 (SECURE SURVEY) ![](img/c-urna.jpg) 你将进行一项针对数百万受访者的调查。你计划向每位受访者发送一个唯一的问卷代码，并发送如下内容：“此人有权回答调查，作为
    ![](img/p-quadpreto.jpg)”，其中 ![](img/p-quadpreto.jpg) 根据每位受访者的姓名或 ID 填充。你如何确保只有收到合法问卷代码的人才能回答你的调查呢？


    如果你只发送上述引用的明文消息，攻击者可能会更改消息并插入他们想要的任何数据！抑制此类攻击最简单的方法是在每个问卷代码中添加一个大的随机数，并记录你发出的所有代码。当陌生人提交带有大随机数的问卷代码时，你查询数据库来确定你是否确实发布过该问卷代码。这种解决方案非常笨拙，因为你必须跟踪数百万个代码。


    使用非对称加密，你可以使用数字签名并向每位受访者发送经过签名的问卷代码。这样，你就不需要保留任何记录。当代码及其签名一起提交时，你通过验证自己的签名来确定是否是你创建了该问卷代码。


    另一种实现相同结果的方法是使用哈希函数。首先，你生成一个随机秘密密钥。你仔细地存储它并且不与任何人共享。对于每位受访者，你使用该密钥计算以下内容：15


    ```

    msg ← "Eligible to answer as " + respondent_name


    mac ← hash(secret_key + msg)

    ```


    通过组合 `msg` 和 `mac` 可以创建一个问卷代码。当有人提交代码时，你提取出 `msg` 部分并使用你的密钥重新计算 `mac`。如果你计算出的
    `mac` 数字与呈现给你的问卷代码中的数字完全相同，则该代码是真实的。16


    MAC 对于通过流密码进行通信的人来说非常有用。记住：使用任何流密码加密的消息都容易受到易变性攻击（malleability attacks）。如果使用加密密钥作为密钥在消息末尾添加一个
    MAC，接收者可以重新计算 MAC 并验证消息未被篡改。


    ## 密码处理


    大多数计算机系统通过要求用户输入密码来验证其身份。这意味着它们必须保留所有密码的记录。但保留密码的明文副本是极糟糕的做法：如果系统被黑入，每个用户的密码都可能被黑客获知。此外，许多人有重复使用密码的坏习惯，因此一个系统中的此类泄露可能会导致其他系统的泄露。


    存储加密后的密码并不能解决问题。在完全访问系统的情况下，攻击者可能会找到密钥，并弄出系统在验证登录尝试时是如何自动加密或解密密码的。此时，每个人的加密密码都可能被解密！


    出于这个原因，存储每个密码的哈希值比存储加密副本更好：与密码不同，哈希函数是不可逆的。然而，你仍然可以通过对登录时提供的密码进行哈希处理，并将其与存储的哈希值进行比较来检查密码是否正确。如果哈希值相同，则密码正确。17
    然而，即使计算机系统只存储密码哈希值，攻击者仍然有办法知道人们的密码。


    ### 字典攻击

    攻击者可以计算数万亿个密码的哈希值，创建一个类似于字典的列表。这种方法可以将哈希值映射回密码。由于这种方法是有效的（注：原文此处逻辑略有跳跃，意为这种方法很有效），攻击者可以利用此进行破解。（注：原文在此处表述杂乱。）
    这种方法是有效的。在 2012 年，这种攻击导致了大量密码的泄露。 即使计算机系统只存储密码哈希值，攻击者仍有办法获知人们的密码。


    ### 加盐 (Salting)

    幸运的是，有方法可以防止字典攻击。与其保存 `hash(password)`，系统可以生成一个随机数称为“盐”（salt），并与 `hash(password
    + salt)` 一起存储。由于每个用户都有不同的盐，这迫使攻击者逐个尝试。


    ### 多重哈希 (Multiple Hashing)

    有另一种方法可以让攻击者变得更加困难。与其存储 `hash(password + salt)`，我们可以计算哈希的哈希，并存储 `hash(hash(password
    + salt))`。我们可以根据意愿添加许多轮哈希。由于计算哈希很快，有些系统会执行数轮。


    ## 存在证明 (Proof of Existence)


    哈希函数可以用于证明某些信息存在，而无需公开信息本身。


    秘密之星 ![](img/c-guitar.jpg) 你创作了一首你认为将成为下一首《加州旅馆》的歌曲。你想保持歌曲秘密并仅将其发布，但你担心有人偷窃。你如何证明它是你创作的？


    第一步是将歌曲记录到文件中。然后计算该文件的哈希值，并请求公证记录该哈希值。如果对歌曲的作者身份产生争议，你可以展示你的公证哈希值以及录音。获得该特定哈希值的唯一方法就是拥有录音。


    在线赌场网站也利用哈希来向客户证明每个游戏都是公平的。想象一个简单的游戏，你对硬币投掷的结果下注。如果你猜准了，你的赌金就会翻倍；如果你没猜中，就会失去所有。首先，在线赌场要求你提供一个数字，并随机生成一次硬币投掷。假设是正面。赌场计算：


    ```

    hash("HEADS" + user_salt + house_salt)

    ```


    `house_salt` 是赌场选择的数字，`user_salt` 是你的数字。赌场向你展示哈希，然后等待你的预测。如果你输了，赌场可以通过公布其 `house_salt`
    来证明没有骗你。你可以重新计算哈希，并检查它是否与赌场之前提供的哈希匹配。赌场无法作弊！为了检查你是否理解了原理，请尝试回答以下问题：为什么赌场不能在你预测之前也告诉他们
    `house_salt` 数字？18


    ## 工作证明 (Proof of Work)


    如果你对不同的输入持续计算哈希值，最终你会获得一个匹配特定模式的输出。例如，如果你正在寻找一个二进制开头为四个零的哈希值：


    ![](img/i-03-08-v.jpg)


    在经过 26 次不同的哈希计算后，我们发现了 heads26 的哈希。这个数字的二进制表示开头是四个零！现在想象有人向你展示了以下内容：


    ```

    hash("heads750") → 0000000010111000010110111011000...

    ```


    '
- fmt: '

    Here, the hash begins with eight zeros! You can assume that whoever presented
    you with `heads750` had to put up some computational power to calculate many hashes
    in order to find an input that produced a hash with this pattern. We call this
    a proof of work. Even more work has probably been spent in order to find the following
    input, as its hash begins with 12 zeros:


    ```

    hash("heads11759") → 00000000000001110100001001001...

    ```


    Proof of work can be used to make attacks more difficult. For example, by requesting
    users to present proof of work before making a request, you make it more expensive
    for attackers to overload a server with bogus requests. The attackers would have
    to spend a lot of computational resources in order to create piles of requests
    that the server would accept to process.


    ## Blockchain

    Along with digital signatures and hashing, proof of work gave rise to a technology
    that is set to change the world: the blockchain! Over the next few years, we believe
    it can provide economic sovereignty to billions of people by eliminating middlemen
    and adding more transparency, privacy and accountability to our society. Along
    with blockchain, entirely new cryptographic tools with fancy names are being developed,
    such as “zero-knowledge proofs” and “homomorphic encryption”. We can only dream
    of the power that will be unleashed once these technologies are widely deployed!


    ## Insecure Hash Functions

    When two different inputs cause a hash function to produce the same output, we
    say there is a collision. With secure hash functions, the only way to obtain one
    is brute force: calculating the hashes of many different inputs until a collision
    appears by chance.


    When hash functions produce outputs of more than 200 bits, it’s infeasible to
    find collisions by brute force. For all hash functions currently considered secure,
    there are no known collisions. Every so often, a hash function loses its status
    because cryptographers discover a method to find collisions that doesn’t rely
    solely on brute force. As soon as such a method is discovered for a hash function,
    we immediately consider it insecure.


    This happened to the `MD5` and the `SHA1` hash functions, which were considered
    secure in the 1990s. A decade later, methods to reduce the operations required
    to find collisions were discovered for both. Currently, there are only a handful
    of hash functions deemed secure by cryptographers. As of 2021, the most widely
    used is `SHA2`, and it has remained unbroken for two decades. However, keep in
    mind that this could change in the future. If you’re using a hash function for
    something potentially sensitive, stay informed so you can react early if a new
    attack method is discovered.


    ## 3.5 Protocols

    As you will recall from the previous chapter, all data traveling inside IP packets
    is potentially public information. Hackers who infiltrate telecom companies can
    alter IP packets traveling to and from their targets in order to undermine their
    communications. We can protect ourselves against these dangers using cryptography.
    Typically, secure communication over the Internet involves these steps:


    1. Obtain the authentic public key of your counterpart.

    2. Generate a shared secret key with your counterpart using `Diffie–Hellman`.
    Verify that the messages you receive are authentic using the public key from step
    1.

    3. Encrypt all further communications with a symmetric cipher using the shared
    secret key from step 2.


    When the parties know each other’s public key, it’s possible to communicate securely
    with an asymmetric cipher directly, without resorting to a `Diffie–Hellman` key
    exchange. However, doing so creates a weakness: an attacker who discovers a private
    key can also decrypt all previous messages received by the victim, including with
    other people. By generating a fresh `Diffie–Hellman` secret for each communication
    session, an attacker who stole a private key will be unable to decrypt ciphertexts
    from previous sessions. A communication scheme with this property is said to have
    forward secrecy.


    Many details must be observed in order to properly encrypt our communications
    with forward secrecy. For example, if a `nonce` is inadvertently reused or pseudorandom
    numbers are generated carelessly, the entire communication becomes vulnerable
    to attack. To avoid these problems, several security protocols have been widely
    adopted. These protocols define processes for people to communicate and perform
    the necessary cryptographic steps in a rigid process, which mitigates the risk
    of mistakes.


    ### Secure Access

    In the early days of the Internet, hosts running a `Telnet` server typically accepted
    connections from strangers and would only ask for a password before handing over
    remote access to the shell. This provided almost no security: that password would
    travel through the Internet in plaintext.


    In 1995, a protocol called `Secure Shell (SSH)` was created to replace `Telnet`
    and address its shortcomings. Each server that accepts `SSH` connections must
    have a pair of private–public keys. In order to guarantee security, a client computer
    should know in advance the public key of the server it wants to connect to.


    By default, `SSH` servers expect connections on `TCP` port `22`. After a client
    establishes a connection, the server sends its public key and the cryptographic
    tools that it supports for encryption, hashing, and Message Authentication Code
    (`MAC`). The client compares the public key it received from the server with the
    one it was expecting. A mismatch of the public keys either means that the server
    has been reconfigured or that someone is tampering with the IP packets as they
    travel between the parties. The client must then abort the connection attempt
    and investigate which one of these is the cause.


    If the public key is correct, the client checks the available cryptographic tools
    indicated by the server and selects which ones to use. The client sends the server
    its choice along with the first `Diffie–Hellman` message. The server then sends
    the client a signed `Diffie–Hellman` response. If the signature is valid, client
    and server calculate a shared secret key, and begin communicating the chosen symmetric
    cipher. At this point, the client can securely send a password in encrypted form.
    Once the connection is closed, client and server forget their shared key in order
    to maintain forward secrecy.


    ### Secure Transport

    Early Internet users didn’t trust their Web browsers to deal with things that
    required high levels of security, such as online banking. Their concern was justified:
    with `HTTP`, information inside IP packets traveled in plaintext. Therefore, engineers
    set out to integrate encryption schemes into `HTTP` so that people could safely
    send sensitive information such as credit card numbers and private messages.


    They developed a generic protocol called `Transport Layer Security (TLS)` that
    can secure any `TCP` connection. Its working mechanism is similar to `SSH`. First,
    the client presents a list of cryptographic tools it supports and a random number.
    In response, the server sends its public key, the selection of tools to be used,
    and another random number. The client checks if the public key is authentic. Client
    and server calculate a shared secret key and start sending each other ciphertexts
    using the cipher chosen by the server.


    Contrarily to `SSH`, the client is not expected to know the public key of the
    server in advance. The server sends its public key along with a digital certificate.
    For example, if the server is hosted at `example.com`, it must send a public key,
    plus a digital certificate from a `Certificate Authority (CA)` attesting that
    `example.com` uses that public key.

