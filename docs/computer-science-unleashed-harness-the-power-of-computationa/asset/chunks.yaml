    forwarding packets towards the best routes.


    There is no central entity coordinating the exchange of this information: routers
    share link details with their peers freely and voluntarily. Consequently, routing
    problems often emerge.


    Routing Loop


    Misconfigured routers can provoke errors. Most notably, bugged tables of addresses
    can send a packet back a few hops, and it gets caught in an endless cycle of doom:


    ![](image/01-25-h.jpg)


    Figure 1.25 Bugged tables sending a packet round in circles.


    If the tables aren’t corrected, more packets with the same intended destination
    will be endlessly forwarded in circles. Too many packets can even saturate and
    clog the links. This is known as a routing loop problem. Fortunately, the Internet
    Protocol provides a way to identify the issue when it occurs.


    HOP LIMIT To interrupt perpetual routing loops, all IP packets carry a hop limit
    between 0 and 255. It indicates the number of times the packet can be forwarded
    by routers. Typically, packets are created with a hop limit of 64. Whenever a
    router forwards a packet, it reduces the hop limit by one:


    ![](image/01-26-h.jpg)


    Figure 1.26 A packet’s hop limit is the only element of an IP packet that routers
    change while forwarding.


    If a packet is going around in circles, its hop limit will eventually reach zero.
    If a router receives an IP packet with a hop limit of zero, it can be discarded.
    An IP packet containing an error message should then be transmitted back to the
    sender by the last router, stating that the packet could not be delivered because
    its hop limit was reached.


    Feedback through such error messages helps network administrators fix critical
    bugs, and routing loops are not the only ones. In fact, the Internet Protocol
    covers how a variety of routing problems should be dealt with.


    Diagnostics


    Routers discard IP packets that they are unable to handle. When this happens,
    they send an informational message about the incident to the packet’s sender.
    The Internet Protocol defines how routers must format such messages, ensuring
    they can be understood by any computer. These rules are a subset of the Internet
    Protocol called the Internet Control Message Protocol (ICMP).


    ICMP assigns error codes to the most common routing problems. To report a problem,
    a router sends an IP packet containing the error code as the message body, formatted
    according to ICMP rules. Let’s see some common problems that can be reported using
    ICMP, starting with the routing loop problem.


    TIME EXCEEDED If a router receives an IP packet with a hop limit of zero, its
    travel time is up. The packet either got stuck on a routing loop, or it was granted
    an insufficient hop limit by the sender.


    In such cases, an ICMP message with a time exceeded error code is sent back. The
    ICMP message includes the first bytes of the discarded packet to allow the original
    sender to know which packet didn’t make it to its destination.


    ![](image/01-27-h.jpg)


    Figure 1.27 Once a router receives a packet with a hop limit of zero, it is discarded
    and an ICMP error message is sent to the packet’s sender.


    Notice that the IP packet Charles sends back in fig. 1.27 includes a protocol
    field. It’s a two-digit hex number identifying how the packet’s payload should
    be interpreted. The latest version of ICMP was assigned the protocol number 0x3A.
    All IP packets must include a protocol number. In the next section, we’ll learn
    more about this. For now, let’s explore other common routing problems.


    DESTINATION UNREACHABLE Sometimes, a router has nowhere to send a packet. This
    can happen for many different reasons, for example if the IP address isn’t in
    the router’s table of addresses, and the table doesn’t propose a default next
    hop. Sometimes, the next hop happens to be offline.


    When the router doesn’t know where to forward the packet, it returns an ICMP message
    with the destination unreachable error code, along with the first bytes of the
    discarded packet’s content.


    PACKET TOO BIG We’ve seen that link layer protocols limit the amount of data that
    can be sent in a single frame. Frames from different types of network links can
    carry payloads of different sizes.


    The maximum number of payload bytes that can be carried in a single frame is called
    its Maximum Transmission Unit (MTU). Different link layer protocols have different
    MTU values. For Ethernet frames, the MTU is 1,500. For WiFi frames, it’s 2,305.


    If a router receives a larger packet than what the next hop can handle, it can’t
    be forwarded as it stands. Instead, the router returns an ICMP message with the
    packet too big error code, the first bytes of the problematic packet, and the
    MTU of the next hop. The informed sender can then trim or split the original message
    into smaller packets before trying again.


    ![](image/01-28-h.jpg)


    Figure 1.28 “MTU”, courtesy of Daniel Stori ([http://turnoff.us](http://turnoff.us)).


    PARAMETER PROBLEM An IP packet contains a lot of extra information alongside its
    payload. We’ve seen it contains IP addresses, a hop limit, and a protocol number.
    It also includes a field indicating the size of the payload and another specifying
    the version of the Internet Protocol it respects. Additional fields are also there
    to help routers prioritize important packets.


    All these fields must be ordered and formatted according to strict rules. When
    a router receives a packet that doesn’t conform to the protocol, it returns an
    ICMP message with the parameter problem error code and the location in the packet
    where the conflict was found. As usual, the ICMP message also contains a few bytes
    of the discarded packet for identification purposes.'
