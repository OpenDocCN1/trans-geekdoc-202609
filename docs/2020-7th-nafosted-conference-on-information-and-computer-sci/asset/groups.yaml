    图4. 移动机器人的状态；(a) 涉及人类、目标和社交交互的场景；(b) 避障状态；(c) 机器人的社交状态；(d) 机器人的目标状态。


    激光和 Kinect 传感器。随后，它识别机器人视野中的社交交互。人类和社交交互信息被投影到 2D 层面上。最后，将激光数据、投影的人类和社交交互以及机器人状态用于基于
    ABC 的运动控制，为机器人生成运动指令。该运动控制指令用于控制机器人视野中的其他人、社交交互和障碍物。


    ## E. 网络架构


    | 722 | [32,7,2] | [32,5,2] | [32,3,2] | 32 | 512 | 512 | 14 |

    |---|---|---|---|---|---|---|---|

    | $s^o$ | | | | | | | | |

    | $s^s$ | Conv1D | Conv1D | Conv1D | LSTM | FC | FC | |

    | $s^g$ | | | | | | | | |


    图5. 策略网络和价值网络的架构。深度卷积神经网络（Conv1D 层）[32,7] 表示，在这种情况下，卷积层的内核大小为 7。最后一层 (D) 的输出与状态拼接，然后输入到长期记忆网络
    (LSTM)。LSTM 具有 32 个隐藏状态。策略网络和价值网络有两个全连接 (FC) 输出层。策略网络的输出 ($\pi$) 是机器人的动作空间。价值网络的输出
    ($v$) 是一个具有线性函数的标量。


    ## C. 状态空间


    在本研究中，我们使用 2D 层作为机器人的状态空间。然而，为了将人类的动态特性（状态、社交交互）纳入所提出的社交避障框架中，我们将这些信息投影到 2D 层，如图
    4 所示。为了实现这一点，我们看到图 4(a) 中，机器人在每个方向上都有 240 只眼睛向 240 个方向观察，机器人在视野中观察 3 个变量：(1) 到人类的距离，(2)
    到周围障碍物的距离，(3) 到目标的距离。在图 4(b) 中，我们还包含了避障信息并命名为 $s^o$。如图 4(c) 所示。感测对象的类型包括 (2) 人类和社交交互，命名为
    $s^s$，以及 (3) 目标，命名为 $s^g$，如图 4(d) 所示。此外，机器人的状态为 $s=\{s^o, s^s, s^g\}$。因此，机器人的总状态是
    $(240 \times 3)$ 维状态空间 $N_s=720$ 的结果。该状态随后作为深度神经网络的输入。


    ## D. 动作空间


    动作空间是可能的速度集合。在本研究中，我们使用差速机器人平台，因此动作空间包含线速度角速度，$a=\{v,\omega\}$。因此，考虑到机器人运动学和现实世界应用，我们使用线速度
    $v \in [0,1,2]$ 和角速度 $\omega \in [-\pi,\pi]$ 的结果。我们将其称为机器人的动作空间 A。然后，在每一步，机器人将在动作空间
    $N_a$ 中选择最优动作。在本文中，我们选择动作空间的大小 $N_a=14$。这意味着使用激光测距仪不允许机器人后退（$v < 0$）。


    ## F. 奖励函数


    在本研究中，实现了一种基于神经网络的方法，用于从机器人的状态空间进行映射。然而，神经网络具有许多优势，例如泛化能力、存储知识的有限内存需求以及连续状态映射系统。为了处理机器人深度时空状态空间，我们使用了如图
    5 所示的网络架构。


    使用该网络，我们通过三层卷积神经网络提取状态空间的特征。然后将它们输入到具有 32 个隐藏状态的 LSTM 中，以学习状态空间的时间依赖性。LSTM 之后是两个全连接层，它们学习特征的线性组合。价值网络的输出
    ($V$) 用于学习过程。策略网络的输出 ($\pi$) 用于在训练和测试阶段选择机器人的最优动作。


    为了引导机器人帮助避开周围环境中的障碍物、人类和社交交互，并最小化到达目标的时间，我们使用如下奖励函数：


    $r_t'' = r_t^o + r_t^s + r_t^g$


