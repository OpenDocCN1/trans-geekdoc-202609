    # 基于深度强化学习的社交感知移动机器人导航框架


    Nam Thang Do¹, Trung Dung Pham¹, Nguyen Huu So¹, Trung Dung Ngo² 和 Xuan Truong
    Truong¹


    在这项研究中，我们提出了一种社交感知的导航框架，该框架使移动机器人能够利用强化学习算法在动态环境中避开人类和社交交互。所提出的框架由两个阶段组成。在第一阶段，提取涉及的人类和社交交互的时空特征，并将其投影到
    2D 层。在第二阶段，将这些动态特征输入到深度神经网络中，该网络使用优势演员-评论家（AAC）技术、安全规则和约束进行训练。训练好的深度神经网络被用于机器人的运动控制。为了评估所提框架框架，我们将其集成到传统的机器人导航系统中并验证了其有效性。仿真结果表明，社交感知机器人可以导航以避开人类和社交交互，并为机器人生成符合社交规范的行为。


    ![](img/34334a10cbd5159f67d06c615d2518e2_0_0.png)


    图 1. 动态社交环境的示例，其中有一个机器人和六个人 $p_1$ 到 $p_6$。$p_1$ 和 $p_2$ 形成一个社交群体，而两人小组 $p_3$ 和
    $p_4$ 正在向机器人移动，$p_5$ 正在与一个物体交互。机器人需要导航以避开人员 $p_6$，同时避开人员 $p_1$-$p_5$ 以及社交交互。


    ## I. 引言


    为了在动态环境中部署移动机器人，机器人应该避开周围的人类和社交交互，同时高效地向目标导航。为了实现这一目标，近年来提出了几种社交感知机器人导航系统 [1],
    [2]，以通用地生成移动机器人可接受的行为，并确保人类的安全和舒适。


    传统的社交感知机器人导航框架可以根据用于开发运动规划的技术分为两类：(i) 基于模型和 (ii) 基于学习的方法。在第一种情况下，导航系统利用势场法 [3]
    和社交代价地图 [4] 来开发运动规划。在第二类中，使用了机器学习技术，包括强化学习 [6] 和强化学习 [7]，使机器人能够在社交环境中进行安全且符合社交的导航。


    尽管基于模型的方法 [8], [9] 和 [10] 已经证明导航系统能够安全地向目标导航，但仍然存在严重阻碍机器人在拥挤和动态环境中导航能力的缺点。例如，在这些论文中，作者必须人工设计周围环境人类的所有特征，然后由模型将其整合到机器人导航系统中。此外，许多参数针对特定环境。然而，这些参数集并不是个性的，并且在不同环境之间存在显著差异。


    为了克服这些缺点，提出了许多基于机器学习的导航系统，在动态环境中进行安全且符合社交的导航 [11], [12], 和 [13] [14]。基于学习的方法可以根据用于导航系统输入的信息分为两类：(i)
    基于传感器的和 (ii) 基于代理（agent）的技术。在前者中，代理信息被用于开发机器人的导航系统。


    基于传感器的机器人导航系统 [11] 直接从原始传感器（例如 2D 激光雷达、RGB 图像）选择动作并进行端到端训练。原始传感器方法的优点是导航系统可以处理静态和动态障碍（包括墙）。此外，来自传感器的数据可以通过单一框架馈送神经网络。在现实环境中，特别是在人类环境中，从多个传感器中提取世界的代理级表示至关重要
    [15], [16]。模型的输入是由于多个传感器提取的代理级表示。由于多个传感器提取的代理级表示，由于多个传感器提取的代理级表示，表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示表示。


    ![](img/34334a10cbd5159f67d06c615d2518e2_1_0.png)


    图 2. 社交交互的区域 (a) (b) (c)。


    ## II. 所提框架


    ### A. 问题描述


    我们考虑一个机器人在社交环境中向目标 ($x_g^t$) 导航，环境中存在人类和物体，如图 1 所示。尽管，这种状态表示，社交感知的导航系统在导航目标时避开周围的人类和社交交互。为了生成符合社交接受的行为，机器人应该是社交的。


    > *Nam Thang Do¹, Trung Dung Pham¹, Nguyen Huu So¹ 和 Xuan Truong Truong¹ 来自越南河内敦科技大学工程学院。Trung
    Dung Ngo 来自加拿大爱德华岛大学更多机器人实验室。truong@gmail.com, dung@ieee.org*


    ## 2020 第7届 NAFSOFT 信息与计算机科学会议 (NICS)


