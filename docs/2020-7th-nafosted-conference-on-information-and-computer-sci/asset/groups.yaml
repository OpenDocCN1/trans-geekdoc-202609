  mdcn: "\n\n# 算法 2：A3C算法中的 Actor-critic 线程\n\n输入：状态空间 $s_t$，动作空间 $A$，最大全局共享回合 $t_{max}$，每个\
    \ epoch 最大步频率 $t_{update}$ 以及折扣因子 $\\gamma$。\n\n| 参数 | 值 | 参数 | 值 | 参数 | 值 |\n\
    |---|---|---|---|---|---|\n| $\\alpha$ | 0.001 | $\\gamma$ | 0.99 | $\\epsilon$\
    \ | 20 |\n| $t_{max}$ | 500 | $t_{update}$ | 14 | $\\rho$ | 0.9 [m] |\n| $t_{collision}$\
    \ | 0.02 | $t_{collision}$ | -0.2 | | 10 |\n\n输出：计算梯度 $\\theta$ 和 $\\theta'$\n\
    \n```\nbegin\n  初始化内存 M 以捕获 $t_{update}$\n  for i=1 to tmax\n    使用全局共享网络 $\\\
    theta$ 和 $\\theta'$ 更新本地网络\n    获取当前状态 $s_t$\n    while ((t < t_{max}) and (not\
    \ terminal))\n      根据策略 $\\pi(s_t|\\theta')$ 选择动作\n      执行动作，接收状态 $s_{t+1}$\
    \ 和奖励 $r_t$\n      将 $(s_t, a, r_t, s_{t+1})$ 存储在内存 M 中\n      if (t mod t_{update}\
    \ == 0) or (terminal)\n        // 更新梯度 $\\theta$，$\\theta'$\n        for i=1 to\
    \ length(M)\n          $R = R + r_t$\n          $A = R - V(s_t)$\n          $\\\
    theta \\leftarrow \\theta + d\\nabla\\pi(s_t|\\theta')A$\n          $\\theta'\
    \ \\leftarrow \\theta' + d\\nabla(R - V(s_t))^2 / 2'$\n      end\n  异步更新：$\\theta$，使用\
    \ $d\\theta$，\n  清除内存 M\n  if\n    $s_{t+1} \\leftarrow t; t \\leftarrow t+1\n\
    \  end\nend\n```\n\n(i) 静态阶段，(ii)-动态阶段和 (iii)动态阶段。\n在静态阶段，场景中的所有人类和目标都是静态的。在动态阶段，人类和目标的移动在场景中进行导航。\n\
    \n![](img/34334a10cbd5159f67d06c615d2518e2_4_0.png)\n\n基于 A3C 的运动控制系统的输出是机器的最佳命令\
    \ $a_t = v_t$。它用于驱动差分机器人在动态环境中安全地进行导航，为机器人提供安全、舒适度以及可接受的行为。\n\n# III. 结果\n\n为了验证所提的社交导航框架，采用了\
    \ Truang 等人 [2022] 提出的社交个体指数 (SII)。SII 用于估计移动机器人的人类安全性、舒适度以及可接受的行为。\n\n机器人要求在场景中进行导航，避开周围的人类和交互。仿真结果如图\
    \ 7 所示（蓝线所示）。SII 值小于 0.14（机器人通常与人类保持距离）。\n\n总结，仿真结果表明，所提的社交运动模型能够在以社交接受的方式避开人类和群体，同时确保动态环境中人类的安全性和舒适度。\n\
    \n# IV. 结论\n\n我们提出了一种社交感知的导航框架，使机器人能够利用深度强化学习在人类和社交动态环境中移动。所提框架由两个阶段组成。在第一阶段，提取包括人类状态和交互在内的人类时空特征，并将其投影到\
    \ 2D 层。在第二阶段，将动态特征输入深度神经网络，该网络使用异步 actor-critic (A3C) 安全规则和社交约束进行训练。训练后的深度神经网络随后被用于生成运动控制命令。我们在传统的机器人系统中评估了所提的运动模型，并在仿真环境中对其进行了验证。实验结果表明，所提的社交感知\n\
    \n# H. 训练\n\n- 1) 训练环境：为了引导机器人避开人类、社交交互、障碍和目标，我们根据机器人模拟器 [1] 创建了一个类似走廊的场景，带有墙壁、交叉的人类、社交交互和目标，如图\
    \ 6 所示。移动人类、目标和障碍使用 Hefling 等人 [4] 提出的社交力模型和 ave 软件平台控制。\n\n- 2) 训练设置：设置基于机器人操作系统\
    \ (ROS)。所提框架使用 Python 和 TensorFlow 库实现。我们使用 Adam 优化 [12] 进行训练。我们在 Intel i7-4.2\
    \ GHz CPU 桌面电脑上提出了社交感知导航框架。运行时间为 16 小时，大约 1000 个回合。训练和测试过程的性能结果见表 1。\n\n- 3) 训练过程：为了帮助机器人学习，我们将训练过程分为三个阶段\n\
