    interactions (human and human-object interactions). In order to accomplish that,
    we project the human and social interactions onto the 2D plane, and use this as
    input of neural network. In addition, the parallel training process help the robot
    learn to deal with variety of social situations in the social environment, we
    utilize the advantageous actor-critic (A3C) technique proposed by Minh [15] for
    teaching the robot. Our method of the A3C algorithm is to train a single agent
    in the environment using multiple agents in a set of environments in parallel,
    and sharing knowledge with what others have learned. This allows the algorithm
    to not only train faster as agents are in in parallel but also to increase the
    diversity of training data as workers experience increases. As a result, the proposed
    framework is capable of generating the socially capable behavior and providing
