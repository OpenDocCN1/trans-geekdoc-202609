    # Deep reinforcement learning based socially aware mobile robot navigation framework


    Nam Thang Do¹, Trung Dung Pham¹, Nguyen Huu So¹, Trung Dung Ngo² and Xuan Truong
    Truong¹


    —In this study, we propose a socially aware navigation framework, which enables
    a mobile robot to avoid humans and social interactions in dynamic environments,
    using reinforcement learning algorithm. The proposed framework is composed of
    two stages. In the first stage, the spatio-temporal characteristics of the humans
    involved and social interactions are extracted and projected onto the 2D layer.
    In the second stage, these dynamic features are then fed into a deep neural network,
    which is trained using the advantage actor-critic (AAC) technique, safety rules
    and constraints. The trained deep neural network is used for the motion control
    of the robot. To evaluate the proposed framework, we integrate it into a conventional
    robot navigation system and verify its effectiveness. Simulation results indicate
    that the socially aware robot can navigate to avoid humans and social interactions,
    and generate socially acceptable behavior for the robot.


    ![](img/34334a10cbd5159f67d06c615d2518e2_0_0.png)


    Fig. 1. An example of a dynamic social environment, in which there are a robot
    and six people $p_1$ to $p_6$. The $p_1$ and $p_2$ are forming a socially group,
    while a group of two people $p_3$ and $p_4$ are moving towards the robot, and
    $p_5$ is interacting with an object. The robot needs to navigate to avoid person
    $p_6$, while avoiding people $p_1$-$p_5$, and social interactions.


    # I. INTRODUCTION


    To deploy mobile robots in dynamic environments, the robots should avoid humans
    and social interactions in their vicinity, while efficiently navigating towards
    a goal. To achieve that, several socially aware robot navigation systems have
    been proposed in the recent years and [1], [2] to generally generate the acceptable
    behaviors for mobile robot and ensure the human safety and comfort.


    The conventional socially aware robot navigation frameworks can be classified
    into two categories according to the techniques used to develop the motion planning:
    (i) model-based and (ii) learning-based approaches. In the first case, the navigation
    system utilizes algorithms such as potential field method [3], and social costmap
    [4] to develop the motion planning. In the second category, the machine learning
    techniques, including reinforcement learning [6], and reinforcement learning [7]
    are used to enable the robot to navigate safely and socially in social environments.


    Although the model-based approaches [8], [9], and [10] have evaluated that, the
    navigation systems are able to navigate safely towards a goal, but still suffer
    weaknesses that seriously hinder the robot capabilities to navigate in crowded
    and dynamic environments. For example, in these papers, the authors have to craft
    all the features of the humans


    surrounding environments, and models then incorporate them into the robot navigation
    system. In addition, several parameters are either specific to a specific environment.
    However, this parameter set not be individual, and can vary significantly for
    different environments.


    To overcome the drawbacks, a number of machine learning-based navigation systems
    have been proposed to navigate safely and socially in dynamic environments [11],
    [12], and [13] [14]. The learning-based approaches can be divided into two categories
    according to the information used as inputs of the navigation system: (i) sensor-level-based
    and (ii) agent-based techniques. In the former, the agent information is used
    to develop the navigation system of the robot.


    The sensor-level robot navigation system [11] selects actions directly from raw
    sensors (e.g. 2D lidar, RGB image) with end-to-end training. The raw sensor approach
    has the advantage that, the navigation system can deal with both static and dynamic
    obstacles (including walls). In addition, data from sensors can be fed into the
    neural network with a single framework. In real-real environments, especially
    in human environments, it is important to extract an agent-level representation
    of the world from multiple sensors [15], [16]. The input of the model is the states
    including position and motion of nearby humans and moving obstacles. It is difficult
    to incorporate the surrounding environment


