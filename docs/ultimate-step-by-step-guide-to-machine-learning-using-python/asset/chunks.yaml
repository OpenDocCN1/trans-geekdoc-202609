- raw: '3\. Data Types In Python, there are 3 main types of data types, like most
    programming languages: 1)        Booleans 2)        Numbers 3)        Strings
    3.1 Booleans Boolean values are True or False. You can use the following Boolean
    operators to compare different values: 1)        Is equal to: == 2)        Is
    greater than: > 3)        Is less than: < 4)        Is greater than or equal to:
    >= 5)        Is less than or equal to: <= Try out this code in the Python notebook
    you created above as follows: ![](rsrcTG.jpg)3.2 Numbers In Python, numbers can
    be integers i.e. whole numbers like 1, 2, 3 or floats i.e. numbers with decimals
    like 1.1, 2.3, 4.5 etc. You can use the basic mathematical operators like: 1)
           Plus: + 2)        Minus: - 3)        Multiplication: \* 4)        Division:
    / 5)        Parenthesis: () to enforce precedence in operations Try out this code
    in the Python notebook you created above as follows: ![](rsrcTH.jpg)You can also
    check the type of a number by using the type command in Python. See below: ![](rsrcTJ.jpg)3.3
    Strings Strings are essentially a string of characters. For example, words or
    sentences. In Python, Strings are designated by single (‘ ‘) or double quotes
    (“”). Just like Booleans and Numbers above, there are certain operators and functions
    you can use in Python on Strings. You can use + sign to concatenate two strings.
    See below: ![](rsrcTK.jpg)You can also change strings to upper and lower case
    using upper() and lower() functions in Python and you can use count() function
    to determine number of characters in a string. See below: ![](rsrcTM.jpg)Another
    useful function is the replace() that lets you replace one character with another
    in a string. See below: ![](rsrcTN.jpg)


    4\. Data Structures Now that we have learned about data types in Python, let’s
    go over how Python organizes these data types into different types of data structures.
