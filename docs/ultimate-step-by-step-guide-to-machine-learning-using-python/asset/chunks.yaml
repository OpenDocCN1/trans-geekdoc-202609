    \n**出版方：** Daneyal Anis  \n**出版日期：** 2020 年 2 月  \n**语言：** 英语\n\n> 本书献给我的父母，是他们给了我追逐梦想的自信；也献给我的妻子和孩子们，是他们让这些梦想值得去追逐。\n\
    \n## 目录\n\n1. 简介\n2. 入门指南\n3. 数据类型\n   - 3.1 布尔值\n   - 3.2 数字\n   - 3.3 字符串\n\
    4. 数据结构\n   - 4.1 元组\n   - 4.2 列表\n   - 4.3 字典\n   - 4.4 集合\n   - 4.5 自定义对象\n\
    5. 数据遍历\n   - 5.1 If Then Else 语句\n   - 5.2 循环\n   - 5.3 函数\n6. 数据探索与分析\n   -\
    \ 6.1 使用 Pandas 探索和清洗数据\n   - 6.2 使用 Numpy 和 Scipy 发现异常值\n   - 6.3 使用 Matplotlib\
    \ 和 Seaborn 可视化数据\n7. 构建预测模型\n   - 7.1 线性回归模型\n   - 7.2 决策树回归模型\n8. 理解机器学习\n \
    \  - 8.1 监督机器学习模型\n   - 8.2 无监督机器学习模型\n   - 8.3 深度学习\n9. 如何利用机器学习解决问题\n   - 9.1\
    \ 确立您的用例\n   - 9.2 就项目驱动因素达成一致：时间、成本和范围\n   - 9.3 确认数据是否随时可用\n   - 9.4 确认数据质量\n\
    \   - 9.5 确认数据的可解释性\n   - 9.6 可视化您的数据\n   - 9.7 为您的用例选择合适的机器学习模型\n   - 9.8 训练您的模型\n\
    \   - 9.9 测试您的模型\n   - 9.10 将您的模型投入生产\n   - 9.11 迭代！\n   - 9.11 数据科学工作流总结\n10.\
    \ 结语\n11. 发表您的评论\n12. 网站与免费礼物！\n13. 参考文献\n\n---\n\n## 1. 简介\n\nPython 由荷兰的 Guido\
    \ Van Rossum 在 20 世纪 80 年代开发。Python 作为一种面向对象的语言进行开发，强调简洁性、可扩展性和灵活性 [[1]](#part0020.xhtml)。Python\
    \ 还拥有庞大的预构建功能库，用于数据科学、统计分析和数据可视化，这使得该语言非常容易学习和使用。\n\n在本书中，我们将专注于 Python 的数据科学应用，并通过实操示例让您在短时间内从新手成长为专家！我们将从\
    \ Python 环境搭建入手，向您介绍其数据结构和库，最后深入探讨这门优美语言的数据科学应用。\n\n您会发现本书的不同之处在于它采用了可视化和实操的教学方法。既然本书面向初学者，我们就不会啰嗦地讲解复杂概念，也不会让本书文字过于密集。相反，我们将从\
    \ Tim Peters 的《Python 之禅》[[2]](#part0020.xhtml) 中汲取灵感：\n\n> “优美胜于丑陋……简单胜于复杂……稀疏胜于密集……”\n\
    \n## 2. 入门指南\n\nPython 官网的“入门”板块提供了在您的机器上安装 Python 的详细说明——无论是 Windows、Mac OS 还是\
    \ Linux，请访问 [Python 官网的 Getting Started 部分](https://www.python.org/about/gettingstarted/)\
    \ [[3]](#part0020.xhtml)。我建议您仔细阅读，因为那里有很多很好的信息和对初学者有帮助的链接。\n\n然而，仅安装 Python 本身并不太有帮助，也不够用户友好。您最好将\
    \ Python 与 IDE（集成开发环境）一起安装——因为 IDE 自带工具和开发环境，可用于执行和调试代码。为此，我建议从 [Anaconda Distribution](https://www.anaconda.com/distribution/)\
    \ [[4]](#part0020.xhtml) 开始。它是一个开源工具，可安装行业标准的 IDE 和基础 Python 库，我们将在本书中更详细地介绍这些内容。\n\
    \n点击上述链接后，您将进入一个页面，以下载并安装适合您操作系统（如 Windows、macOS 或 Linux）的安装包。我们将在本书中使用 [Jupyter\
    \ Notebook](https://jupyter.org/) [[5]](#part0020.xhtml) 作为开发环境——Jupyter 是 Anaconda\
    \ 分发包的一部分，将随 Python 一起安装在您的机器上。\n\nJupyter 是一个功能强大的基于 Web 的开发环境，我们将在本书中用它来执行代码，我已将本书中使用的所有源代码作为\
    \ `.ipnyb` Jupyter 文件放在我的网站上。您可以通过访问我的网站 [`www.daneyalauthor.com`](https://www.daneyalauthor.com)\
    \ 来获取所有代码，并在 Jupyter Notebook 中打开。\n\n在您的机器上安装 Anaconda 后，从菜单中启动 Anaconda Navigator。\n\
    \n![](img/rsrcTC.jpg)\n\n打开后，您应该会看到以下 Anaconda Navigator 仪表板，其中包含所有可用工具：\n\n![](img/rsrcTD.jpg)\n\
    \n点击该应用程序图标下的“Launch”按钮启动 Jupyter Notebook。完成后，将打开以下网页浏览器窗口：\n\n![](img/rsrcTE.jpg)\n\
    \n点击右上角的“New”，然后选择“Python 3”。完成后，将打开一个新的浏览器窗口，其中包含您的新项目和准备好执行的 Python 环境。您可以通过点击屏幕顶部的“Untitled”（下文高亮显示供参考）将项目重命名为“My\
    \ First Python Project”。完成了吗？好的，您已准备就绪！\n\n![](img/rsrcTF.jpg)\n\n"
