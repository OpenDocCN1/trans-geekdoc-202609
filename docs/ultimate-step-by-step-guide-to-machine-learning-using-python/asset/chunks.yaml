    # 3. Data Types


    In Python, there are 3 main types of data types, like most programming languages:


    1.  Booleans

    2.  Numbers

    3.  Strings


    ## 3.1 Booleans


    Boolean values are `True` or `False`. You can use the following Boolean operators
    to compare different values:


    1.  Is equal to: `==`

    2.  Is greater than: `>`

    3.  Is less than: `<`

    4.  Is greater than or equal to: `>=`

    5.  Is less than or equal to: `<=`


    Try out this code in the Python notebook you created above as follows:


    ![](rsrcTG.jpg)


    ## 3.2 Numbers


    In Python, numbers can be integers i.e. whole numbers like `1`, `2`, `3` or floats
    i.e. numbers with decimals like `1.1`, `2.3`, `4.5` etc. You can use the basic
    mathematical operators like:


    1.  Plus: `+`

    2.  Minus: `-`

    3.  Multiplication: `*`

    4.  Division: `/`

    5.  Parenthesis: `()` to enforce precedence in operations


    Try out this code in the Python notebook you created above as follows:


    ![](rsrcTH.jpg)


    You can also check the type of a number by using the `type` command in Python.
    See below:


    ![](rsrcTJ.jpg)


    ## 3.3 Strings


    Strings are essentially a string of characters. For example, words or sentences.
    In Python, Strings are designated by single (`'' ''`) or double quotes (`" "`).
    Just like Booleans and Numbers above, there are certain operators and functions
    you can use in Python on Strings. You can use `+` sign to concatenate two strings.
    See below:


    ![](rsrcTK.jpg)


    You can also change strings to upper and lower case using `upper()` and `lower()`
    functions in Python and you can use `count()` function to determine number of
    characters in a string. See below:


    ![](rsrcTM.jpg)


    Another useful function is the `replace()` that lets you replace one character
    with another in a string. See below:


    ![](rsrcTN.jpg)


    # 4. Data Structures


    Now that we have learned about data types in Python, let’s go over how Python
    organizes these data types into different types of data structures. We will cover
    the following data structures in this book:


    1.  Tuples

    2.  Lists

    3.  Dictionaries

    4.  Sets

    5.  Custom Objects


    ## 4.1 Tuples


    Tuples are ordered sequences of data represented as data contained within parenthesis
    separated by commas. For example:


    ```

    (1, ''two'', 3.5, False)

    ```


    As you can see from the above example, Tuples can contain data of all types at
    the same time. Tuples are immutable – as in data within Tuples cannot be changed.
    For example, look at this sequence of code:


    ![](rsrcTP.jpg)


    Python throws an error when we tried to assign the value of `4` to the second
    index in the tuple, indicating that tuples objects do not support item assignment.
    Tuples can also contain other data structures like tuples – this concept is defined
    as ‘nesting’. Imagine visualizing it as a tree as follows:


    ![](rsrcTR.jpg)


    ## 4.2 Lists


    Lists are also sequenced data structures with data represented as separated by
    brackets (as opposed to parenthesis for tuples). For example:


    ```

    [1, ''two'', 3.5, False]

    ```


    Unlike tuples, lists are mutable i.e. data in lists can be changed. See the following
    sequence of code:


    ![](rsrcTS.jpg)


    Python allows us to change the list by replacing the value `3.5` with `4` in index
    `2` position and does not throw an error like in the case of tuples. Just like
    tuples, lists can hold multiple data types at the same time including other data
    structures like tuples and lists i.e. nesting as outlined above.


    ## 4.3 Dictionaries


    Dictionaries are like tuples and lists in that they help order and sequence the
    data. However, the main difference is that they are represented by data separated
    by commas in curly braces and the index for dictionaries can be string labels.
    See code example below:


    ```

    {''leader'': ''Abraham Lincoln'', ''fighter'': ''Mike Tyson'', ''city'': ''Toronto''}

    ```


    In the case of dictionaries, the index or keys are immutable i.e. cannot be changed.
    However, the values represented by the labels can be changed. See the code sample
    below:


    ![](rsrcTT.jpg)


    In the above example, Python allows us to change the leader in the dictionary
    to Winston Churchill – and we used the string `''leader''` as our index as opposed
    to `0` to access the first data element in the structure.


    ## 4.4 Sets


    Sets are another example of data structures like tuples, lists and dictionaries
    – the key difference being that sets are not ordered i.e. they do not have indexes.
    The reason behind that is that the sets only contain unique elements. They are
    represented by data elements separated by commas in curly brackets. See code example
    below:


    ![](rsrcTU.jpg)


    In the above example, even though `3.5` was duplicated in the curly brackets,
    when the set was created, the duplicates were removed. Sets can have values added
    or removed from them using `add` and `remove` functions. See code example below:


    ![](rsrcTV.jpg)


    You can also perform additional mathematical functions on sets by showing the
    common elements in two sets by using the `&` function. See code example below:


    ![](rsrcTW.jpg)


    As you would remember, set1 had data elements `1` and `3.5` that are also present
    in set2. So the `&` function found the commonality and returned the common data
    elements between the two sets. Now let’s try combining the two sets by using the
    `union` function. See code example below:


    ![](rsrcTX.jpg)


    Notice how while combining the two data sets, Python consolidated the common elements
    `1` and `3.5` and did not repeat them – as duplicates are not allowed in sets.


    ## 4.5 Custom Objects


    While tuples, lists, dictionaries and sets are built in data structures in Python,
    sometimes you may find the need to create custom objects or data structures in
    Python with their own attributes. Suppose you wanted to create a custom object
    in Python called `Human` with its own specific attributes for re-usability in
