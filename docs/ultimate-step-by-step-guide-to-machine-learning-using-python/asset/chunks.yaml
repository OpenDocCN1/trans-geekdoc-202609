- raw: "8\\. Understanding Machine Learning In the previous chapter, I described two\
    \ machine learning models: Linear Regression and Decision Tree analysis. I also\
    \ mentioned that there are many other machine learning models that can be applied\
    \ based on the nature of the problem at hand. In this chapter, we will explain\
    \ additional machine learning models and algorithms in simple terms – with a goal\
    \ for the reader to be able to understand them at a high level and know when to\
    \ apply them given the nature of the data and their data science use case. At\
    \ the highest level, machine learning models can be classified into three categories:\
    \ 1)        Supervised Machine Learning Models 2)        Unsupervised Machine\
    \ Learning Models 3)        Deep Learning Models 8.1 Supervised Machine Learning\
    \ Models In case of supervised machine learning models, the model is provided\
    \ some direction in terms of how to classify the data and it uses those instructions\
    \ to learn before making its predictions. In the house sales example that we used\
    \ in the previous chapter, that was an example of supervised learning as we told\
    \ the model what the different types of houses were and even which house features\
    \ have an impact on the sales price. We then split the data set into training\
    \ and test sets, that the model used to make its prediction. Examples of supervised\
    \ machine learning models include: 1)        Regression analysis 2)        Classification\
    \ analysis Regression analysis – in case of regression analysis, given several\
    \ factors, the model is expected to predict a number. In case of the house sales\
    \ price example, the model considered several house features to predict the house\
    \ sales price. Note that above was an example of linear regression where there\
    \ is a straight-line correlation between dependent variable (e.g. house sales\
    \ price) and independent variables (e.g. house type, number of garages etc.).\
    \ There are certainly situations where that straight-line correlation does not\
    \ exist and typically in those situations, polynomial regression analysis is used\
    \ – or a curved line instead of a straight line. In other words, all the machine\
    \ learning model is doing when performing regression analysis is it is trying\
    \ to fit a line between scattered data points to find a correlation between independent\
    \ and dependent variables. That can be illustrated visually as follows: \n\n|\
    \ Linear Regression ![](rsrcUW.jpg) || Polynomial Regression ![](rsrcUX.jpg) |\n\
    \n| --- | --- |\n\nOther real-world examples of where regression analysis is used\
    \ is in the finance industry predicting stock price based on historical and market\
    \ trends as well as in the retail industry where certain product prices are often\
    \ predictable based on seasonality and time of the year e.g. clothing, outdoor\
    \ patio and gardening products. Classification analysis – in case of classification\
    \ analysis, the machine learning model predicts the category for an object based\
    \ on its features. So the main difference between classification model and regression\
    \ model is that the classification model is categorizing the objects and regression\
    \ model is predicting a number associated with an object. Like regression analysis,\
    \ since classification analysis is a supervised model, it will need to be provided\
    \ labeled data with instructions to learn before it can make its predictions.\
    \ If house sales data example in the previous chapter was a classification problem,\
    \ the model would have been given house sales data without the house type and\
    \ model would have been asked to predict the house type (e.g. detached, semi-detached\
    \ or townhome) based on the different features included in the dataset. Other\
