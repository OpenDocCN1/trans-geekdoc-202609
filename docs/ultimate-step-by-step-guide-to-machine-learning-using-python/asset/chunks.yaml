    # 9. How to Problem Solve Using Machine Learning


    Now that we understand how to build machine learning models in Python and different
    kinds of machine and deep learning algorithms, how do we apply them to real world
    problems in our day to day lives or in our organization? In this chapter, I will
    go over a structured process on how you can go from an initial problem statement
    all the way to a machine learning model to address that problem. As part of this
    framework, we will cover the following steps:


    1.  Establish your use case

    2.  Gain agreement on your project drivers: Time, Cost and Scope

    3.  Confirm if data is readily available

    4.  Confirm quality of your data

    5.  Confirm interpretability of your data

    6.  Visualize your data

    7.  Fit the right machine learning model to your use case

    8.  If your use case allows for a supervised model, train your model

    9.  If real world data is available, test your model’s predictions against this
    data for accuracy

    10. Productionize your model

    11. Iterate!


    ## 9.1 Establish Your Use Case


    This step involves formulation of your problem statement and I recommend that
    this problem statement should be formulated as a question that needs to be addressed
    or insight that needs to be gained. More specific the question is, the better.
    This step is particularly critical when you are trying to determine which machine
    learning algorithm best fits your problem. Some examples of use cases below for
    reference:


    1.  “How many call center representatives should I have managing my life insurance
    claim queues during downtime in the summer based on historical volumes and seasonality?”

    2.  “Based on the language and tone used in the call center call, how likely is
    this client to leave our organization or escalate the issue?”

    3.  “Depending on purchase pattern of this client, what additional products is
    he / she likely to buy in the next 6 months?”


    ## 9.2 Get Agreement on Project Drivers: Time, Cost and Scope


    Once you have nailed down your problem statement, it is important to understand
    what constraints you are working with for your data science project.


    1.  If your project is time driven, it likely requires a quick resolution or incremental
    deliverables that need to provide immediate insights

    2.  If your project is cost driven, you likely will not have a lot of budget for
    data sourcing or additional resources

    3.  If your project is scope or quality driven, you have additional flexibility
    to truly perfect your model and corresponding predictions before the result is
    shared with your clients


    ## 9.3 Confirm If Data Is Readily Available


    Depending on the nature of the problem, sometimes data may or may not be readily
    available. For example, if you are trying to analyze the patterns of the flu virus
    to inform efforts to create the vaccine for upcoming flu seasons, you may not
    have the most up to date dataset based on the current flu season – due to the
    timing or data being provided by the health institutions. In those cases, you
    must work with what is available and extrapolate / make assumptions where possible.
    In a cost or time driven project, this situation will be a barrier. In the absence
    of actionable data, you will likely have to convince the stakeholders via a business
    case as to why investing in sourcing additional data to address the problem is
    the right investment to make.


    ## 9.4 Confirm Quality of Your Data


    You can be swimming in data but it is possible that the quality of your data is
    not good i.e. you have a lot of missing, incomplete or generally uninterpretable
    information. You will have to spend a lot of time in data cleaning and manipulation
    before it is ready for analysis. In a lot of data science projects, this is the
    least sexy and most time intensive exercise. Good news here is that `Python` has
    a lot of built in functions, as we illustrated earlier in this book that allow
    you to clean your data and visualize it to eliminate any outliers as well as null
    values.


    ## 9.5 Confirm Interpretability of Your Data


    You can have lots of data of great quality. However, you will have a hard time
    analyzing or training the model if no one in your organization understands it.
    In case your parachuted into an organization to work on their data science project,
    it is highly likely that the organization has a lot of old legacy systems, that
    use their own internal encoding and knowledge of the data and how to interpret
    it is often in people’s heads or is tribal knowledge i.e. its known to a select
    few old timers but is not documented or widely shared. In an organization that
    is very operationally focused and cannot make data subject matter experts (SMEs)
    available to assist on data science projects, this is often a stumbling block.
    Often, availability of these SMEs must be business cased to move the data science
    project forward.


    ## 9.6 Visualize Your Data


    Now that you have good quality data that is interpretable and you have ready access
    to SMEs, you are ready to analyze your data and the fun truly begins! As a first
    step, you visualize your data to look at patterns, anomalies and outliers. This
    is also the step where you start to decide which machine learning model and algorithm
    is most suited to your problem and the structure of your data. For example, as
    shown earlier in this book, if you are seeing straight-line correlation between
    your variables, maybe it is a simple linear regression problem. Or maybe, it is
    a bunch of undefined data points and you need to find groupings and commonalities
    – sounds like a job for a clustering algorithm! Luckily `Python` has really powerful
    visualization libraries like `seaborn` that allow you to look at your data from
    various angles before you decide on which model will be the best fit.


    ## 9.7 Fit the Right Machine Learning Model to Your Use Case


    As mentioned above, visualization of your data along with the nature of your use
    case and project drivers will determine which model you will ultimately choose
    as your best fit. It is basically like selecting the best tool in your tool belt
    for the job at hand or using the best golf club depending on whether you need
    to drive or putt. You get the idea! As mentioned earlier in this book and illustrated
    in the house sales example, often it is a trial and error process before you find
    the model that gives you the highest degree of accuracy when tested against real
    world data.


    ## 9.8 Train Your Model


    In case of a supervised machine learning model, you have an opportunity to provide
    your model with labeled data and a training data set to get it ready for real
    world problems. Even in unsupervised or deep learning models, you can refine your
    models as more data becomes available and you can adjust your algorithm. For example,
    in the house sales data we were using, we saw that house type and square footage
    played a big role in driving house sales prices. However, it was also a relatively
    small dataset. It is quite possible that as more data became available, additional
    house features like number of garages or whether the house has a pool may have
    become more important and model will have to be re-trained.


    ## 9.9 Test Your Model


    It is not enough that you built your model and trained it once. You constantly
    have to test it and keep feeding it new data as feedback loop to make sure that
    the model accuracy stays within acceptable limits. It is also a best practice
    to have monitoring mechanisms developed so that if model accuracy or error rates
    are exceeding certain thresholds it is time to take the model back to the drawing
    board for re-training.


    ## 9.10 Productionize Your Model


    If the machine learning model you built was meant for an ongoing operational setting
    in an organization as opposed to a one-off analysis, your final step is to operationalize
    and automate the model training and testing. This will likely involve additional
    investment in your infrastructure to automate the data flow into the model as
    well as automating the triggers for model re-calibration in case accuracy metrics
    are falling below acceptable limits.


    ## 9.11 Iterate!


    Once you are done building and productionizing your model, you will get new insights
    from the model predictions. These predictions and insights can be used to refine
    your use case and problem statement. As you adjust your problem statement, you
    will repeat the above steps to continue updating and enhancing your model.

    '
