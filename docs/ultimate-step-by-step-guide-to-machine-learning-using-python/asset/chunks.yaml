    \ in the Scikit-learn library. As you can see, we defined ‘y’ as the target /\
    \ dependent variable ‘SalePrice’ and ‘X’ as all the independent variables that\
    \ will be used to predict the price. We will take a moment here to describe the\
    \ purpose of the additional parameters in the train\\_test\\_split function: 1)\
    \       test\\_size – defines what percentage of your data will be treated as\
    \ test dataset. For this example, we used 50% 2)       random\\_state – is used\
    \ as an input into random number generation during the split. For our example,\
    \ we used 80 3)       shuffle – is used to determine whether data should be shuffled\
    \ before splitting. For our purpose, we set that to true Now we are ready to build,\
    \ train and test the predictive models! 7.1 Linear Regression Model A linear regression\
    \ model assumes a linear relationship between a dependent or target variable e.g.\
    \ Sale Price for the house and independent variables like square footage, number\
    \ of garages etc. It can be illustrated as an equation as follows: Y = cX + I\
    \ Where Y = dependent variable aka Sale Price of the House X = independent variable\
    \ e.g. Square footage c = coefficient – that will be calculated by the linear\
    \ regression model I = intercept – that will be calculated by the linear regression\
    \ model as well The above is a case of Simple Linear Regression, where you only\
    \ have one dependent and one independent variables. When you have multiple independent\
    \ variables, like in our case, we use the equation below and this can be defined\
    \ as Multiple Linear Regression Y = I+ (c1X1)+ (c2X2)+ (c3X3)+…… We can initialize,\
    \ train and test the Linear Regression Model as follows: ![](rsrcUT.jpg)In the\
    \ above code snapshot, we covered the following steps: 1)        We initialized\
