    algorithm! Luckily Python has really powerful visualization libraries like seaborn
    that allow you to look at your data from various angles before you decide on which
    model will be the best fit. 9.7 Fit the Right Machine Learning Model to Your Use
    Case As mentioned above, visualization of your data along with the nature of your
    use case and project drivers will determine which model you will ultimately choose
    as your best fit. It is basically like selecting the best tool in your tool belt
    for the job at hand or using the best golf club depending on whether you need
    to drive or putt. You get the idea! As mentioned earlier in this book and illustrated
    in the house sales example, often it is a trial and error process before you find
    the model that gives you the highest degree of accuracy when tested against real
    world data. 9.8 Train Your Model In case of a supervised machine learning model,
    you have an opportunity to provide your model with labeled data and a training
    data set to get it ready for real world problems. Even in unsupervised or deep
    learning models, you can refine your models as more data becomes available and
    you can adjust your algorithm. For example, in the house sales data we were using,
    we saw that house type and square footage played a big role in driving house sales
    prices. However, it was also a relatively small dataset. It is quite possible
    that as more data became available, additional house features like number of garages
    or whether the house has a pool may have become more important and model will
    have to be re-trained. 9.9 Test Your Model It is not enough that you built your
    model and trained it once. You constantly have to test it and keep feeding it
    new data as feedback loop to make sure that the model accuracy stays within acceptable
    limits. It is also a best practice to have monitoring mechanisms developed so
    that if model accuracy or error rates are exceeding certain thresholds it is time
    to take the model back to the drawing board for re-training. 9.10 Productionize
    Your Model If the machine learning model you built was meant for an ongoing operational
    setting in an organization as opposed to a one-off analysis, your final step is
    to operationalize and automate the model training and testing. This will likely
    involve additional investment in your infrastructure to automate the data flow
    into the model as well as automating the triggers for model re-calibration in
    case accuracy metrics are falling below acceptable limits. 9.11 Iterate! Once
    you are done building and productionizing your model, you will get new insights
    from the model predictions. These predictions and insights can be used to refine
    your use case and problem statement. As you adjust your problem statement, you
    will repeat the above steps to continue updating and enhancing your model. '
