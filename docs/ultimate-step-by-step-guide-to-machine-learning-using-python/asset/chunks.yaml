    # 3. 数据类型


    在 Python 中，与大多数编程语言一样，主要有 3 种数据类型：


    1.  布尔值

    2.  数字

    3.  字符串


    ## 3.1 布尔值


    布尔值为 `True` 或 `False`。你可以使用以下布尔运算符来比较不同的值：


    1.  等于：`==`

    2.  大于：`>`

    3.  小于：`<`

    4.  大于或等于：`>=`

    5.  小于或等于：`<=`


    在你上面创建的 Python 笔记本中尝试运行以下代码：


    ![](img/rsrcTG.jpg)


    ## 3.2 数字


    在 Python 中，数字可以是整数，即像 `1`、`2`、`3` 这样的整数，也可以是浮点数，即像 `1.1`、`2.3`、`4.5` 等带小数的数字。你可以使用基本的数学运算符，如：


    1.  加法：`+`

    2.  减法：`-`

    3.  乘法：`*`

    4.  除法：`/`

    5.  括号：`()` 用于强制规定运算优先级


    在你上面创建的 Python 笔记本中尝试运行以下代码：


    ![](img/rsrcTH.jpg)


    你也可以通过在 Python 中使用 `type` 命令来检查数字的类型。见下图：


    ![](img/rsrcTJ.jpg)


    ## 3.3 字符串


    字符串本质上是一串字符。例如单词或句子。在 Python 中，字符串由单引号（`'' ''`）或双引号（`" "`）标识。就像上面的布尔值和数字一样，在 Python
    中有一些特定的运算符和函数可用于字符串。你可以使用 `+` 号来连接两个字符串。见下图：


    ![](img/rsrcTK.jpg)


    你也可以使用 Python 中的 `upper()` 和 `lower()` 函数将字符串转换为大写或小写，并使用 `count()` 函数来确定字符串中的字符数量。见下图：


    ![](img/rsrcTM.jpg)


    另一个有用的函数是 `replace()`，它允许你在字符串中用另一个字符替换某个字符。见下图：


    ![](img/rsrcTN.jpg)


    # 4. 数据结构


    现在我们已经了解了 Python 中的数据类型，接下来让我们看看 Python 是如何将这些数据类型组织成不同类型的数据结构的。在本书中，我们将介绍以下数据结构：


    1.  元组

    2.  列表

    3.  字典

    4.  集合

    5.  自定义对象


    ## 4.1 元组


    元组是有序的数据序列，表示为包含在括号中并由逗号分隔的数据。例如：


    ```

    (1, ''two'', 3.5, False)

    ```


    从上面的示例可以看出，元组可以同时包含所有类型的数据。元组是不可变的——即元组内的数据不能被更改。例如，看这段代码序列：


    ![](img/rsrcTP.jpg)


    当我们尝试将值 `4` 赋给元组中的第二个索引位置时，Python 抛出了一个错误，表明元组对象不支持项目赋值。元组也可以包含其他数据结构，如元组——这一概念被称为“嵌套”。可以将其想象为如下树状结构：


    ![](img/rsrcTR.jpg)


    ## 4.2 列表


    列表也是有序的数据结构，数据表示为由方括号分隔（而不是像元组那样用括号）。例如：


    ```

    [1, ''two'', 3.5, False]

    ```


    与元组不同，列表是可变的，即列表中的数据可以被更改。请看以下代码序列：


    ![](img/rsrcTS.jpg)


    Python 允许我们通过将索引 `2` 位置的值 `3.5` 替换为 `4` 来更改列表，并且不会像元组那样抛出错误。就像元组一样，列表可以同时容纳多种数据类型，包括其他数据结构，如元组和列表，即如上所述的嵌套。


    ## 4.3 字典


    字典与元组和列表一样，有助于对数据进行排序和排列。然而，主要区别在于它们由花括号中用逗号分隔的数据表示，并且字典的索引可以是字符串标签。请看下面的代码示例：


    ```

    {''leader'': ''Abraham Lincoln'', ''fighter'': ''Mike Tyson'', ''city'': ''Toronto''}

    ```


    在字典的情况下，索引或键是不可变的，即不能被更改。然而，由标签表示的值可以被更改。请看下面的代码示例：


    ![](img/rsrcTT.jpg)


    在上面的示例中，Python 允许我们将字典中的领导者更改为温斯顿·丘吉尔——并且我们使用字符串 `''leader''` 作为索引来访问结构中的第一个数据元素，而不是使用
    `0`。


    ## 4.4 集合


    集合是另一种类似于元组、列表和字典的数据结构——关键区别在于集合是无序的，即它们没有索引。其背后的原因是集合只包含唯一元素。它们由花括号中用逗号分隔的数据元素表示。请看下面的代码示例：


    ![](img/rsrcTU.jpg)


    在上面的示例中，尽管花括号中 `3.5` 被重复了，但创建集合时，重复项被移除了。可以使用 `add` 和 `remove` 函数向集合添加或移除值。请看下面的代码示例：


    ![](img/rsrcTV.jpg)


    你还可以通过使用 `&` 函数显示两个集合中的公共元素，对集合执行额外的数学函数。请看下面的代码示例：


    ![](img/rsrcTW.jpg)


    正如你所记得的，set1 拥有数据元素 `1` 和 `3.5`，它们也存在于 set2 中。因此 `&` 函数找到了共性，并返回了这两个集合之间的公共数据元素。现在让我们尝试使用
    `union` 函数合并这两个集合。请看下面的代码示例：


    ![](img/rsrcTX.jpg)


    注意在合并两个数据集时，Python 合并了公共元素 `1` 和 `3.5` 且没有重复它们——因为集合中不允许有重复项。


    ## 4.5 自定义对象


    虽然元组、列表、字典和集合是 Python 的内置数据结构，但有时你可能需要在 Python 中创建具有自己属性的自定义对象或数据结构。假设你想在 Python
    中创建一个名为 `Human` 的自定义对象，并为其定义特定的属性，以便在代码中复用。请参考此代码示例：


    ![](img/rsrcTY.jpg)


    请注意上述代码行中的以下内容：


    -   使用 `def` 关键字和 `__init__` 初始化函数（注意 init 关键字两侧各有两个下划线）初始化了自定义类 `Human`

    -   在初始化函数中，`self` 是正在创建的对象的一个实例，连同定义该人类对象的两个属性 `height` 和 `weight`

    -   定义完自定义类后，我们用它来初始化一个新的 `Human` 对象，并传入身高（`60 inches`）和体重（`180 pounds`）的属性值

    -   当我们打印出赋值后的对象属性时，得到了期望的输出

