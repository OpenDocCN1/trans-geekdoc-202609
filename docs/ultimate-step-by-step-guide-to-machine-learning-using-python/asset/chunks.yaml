    # 6. 数据探索与分析


    既然我们已经介绍了不同的数据类型、结构以及如何使用它们，我们将更进一步，介绍如何处理数据文件和数据框。我们还将介绍两个基础的 Python 库：`Pandas`
    和 `Numpy`。


    为了本章及后续章节的目的，我们将使用一个虚构的示例数据集，该数据集基于各种房屋特征包含房屋销售价格，例如：


    1.  **建造年份** – 房屋建造的年份

    2.  **建筑面积** – 房屋大小，以平方英尺为单位

    3.  **房屋类型** – 房屋是独栋、半独栋还是联排别墅

    4.  **车库大小** – 车库可容纳的汽车数量

    5.  **壁炉** – 房屋是否有壁炉

    6.  **泳池** – 房屋是否有泳池

    7.  **销售价格** – 基于上述特征的房屋实际销售价格


    您可以通过此链接从我的网站下载此示例数据集（`.csv` 文件）：[房屋销售数据](https://daneyalauthor.com/wp-content/uploads/2020/01/House-Sales-Values.csv)


    ## 6.1 使用 Pandas 探索和清洗数据


    既然我们已经选定了要处理的数据集，让我们首先开始读取之前下载的 `train.csv` 文件。为此，我们将使用一个名为 ‘`Pandas`’ 的 Python
    内置库。大熊猫是可爱的毛茸茸的动物，但在 Python 中，它们也允许我们将数据作为有组织的数据框进行处理。该库还拥有可对这些数据框执行的内置函数。


    我们首先导入此库，如下所示：


    ![](img/rsrcU6.jpg)


    这里我们使用了 `import` 关键字创建了一个 `pandas` 实例来处理房屋销售数据，并将其命名为 ‘`pd`’。现在我们按如下方式导入 House
    Sales Values.csv 文件：


    ![](img/rsrcU7.jpg)


    在上面的代码示例中，我们通过传递 `train.csv` 文件的路径使用了 `pandas` 函数 `read_csv()`，并将其存储到名为 ‘`df`’
    的数据框中。我们现在可以使用 `pandas` 的数据探索函数了，以便更好地了解我们的数据集。


    让我们首先查看数据集的前 10 条记录。为此，我们使用 `pandas` 的 `head()` 函数。请见下面的代码示例：


    ![](img/rsrcU8.jpg)


    请注意，在上面的代码示例中，我们将 `10` 作为参数传递给了 `head()` 函数。如果我们传递 `20` 作为参数，例如 `df.head(20)`，Python
    将返回前 20 行。


    让我们也看看使用 `pandas` 的 `shape` 属性，我们的数据集有多少行和列。请见下面的代码示例：


    ![](img/rsrcU9.jpg)


    看起来我们的数据集有 1000 行和 7 列。好的，现在让我们找出数据框中每一列的数据类型。为此，我们将使用 `pandas` 的 `dtypes` 属性。请见下面的代码示例：


    ![](img/rsrcUA.jpg)


    看起来我们的数据集中混合了整数、浮点数和字符串（对象）。了解这一点很好，稍后在本书中当我们转换数据以进行进一步处理时，这将派上用场。


    让我们使用 `describe()` 函数进一步描述此数据集，以便更好地了解它。请见下面的代码示例：


    ![](img/rsrcUB.jpg)


    `describe` 函数为我们提供了关于数据集的额外重要统计信息——例如不同数值特征（如建造年份、建筑面积、车库车位数和房屋销售价格）的计数、平均值、最大值和最小值。


    好的，现在让我们在进一步处理之前清洗这些数据。让我们找出每一列有多少空值。


    ![](img/rsrcUC.jpg)


    看起来某些列有一小部分数据为空。例如，房屋类型在 10 条记录中缺失，销售价格在 5 条记录中缺失。由于这种数量的缺失数据会在我们的分析中引入差异，为简单起见，我们将删除这些列，并重塑和描述我们的数据集。请见下面的代码示例：


    ![](img/rsrcUD.jpg)


    我们现在有一个较小的数据集可供使用，包含 980 行、7 列且无空值！


    ## 6.2 使用 Numpy 和 Scipy 发现异常值


    在进一步深入之前，让我们介绍 Python 中的几个基础库。


    1.  **Numpy** 是一个用于对列表和矩阵等数据结构执行数值运算的库

    2.  **Scipy** 是一个利用 `Numpy` 数据结构进行高级代数和微积分运算的库

    3.  **Scikit-learn**（也称为 **Sklearn**）是一个用于构建预测模型的基础 Python 库


    为了利用上述库中的数值计算（`Numpy`）、统计分析（`Scipy`）和预测建模（`Scikit-learn`）函数，我们需要将数据集中的分类字符串值替换为数值。由于这是一个常见问题，`Sklearn`
    库拥有内置函数，允许您仅用极少的代码行完成此操作。请见下文：


    ![](img/rsrcUE.jpg)


    在上面的代码快照中，我们完成了以下步骤：


    1.  我们创建了一个包含非数值（布尔或字符串）值的列名数组——房屋类型、壁炉和泳池

    2.  然后我们使用 `Scikit-learn` 库中的 `LabelEncoder()` 函数将所有非数值列转换为数值——本质上是用数字代码如 `0`、`1`、`2`
    替换字符串值。请注意我们如何使用本书前面介绍的 `for` 循环来遍历此数据结构

    3.  然后我们打印出数据集的前 10 行以及数据类型。请见下文：


    ![](img/rsrcUF.jpg)


    请注意，对于壁炉和泳池，之前我们有 ‘Yes’ 和 ‘No’ 值，现在它们分别被替换为 `1` 和 `0`。此外，房屋类型的不同类型已重新编码如下：`0`、`1`、`2`。数据集中不同列的数据类型现在也是数值型的：


    ![](img/rsrcUG.jpg)


    我们将使用 `Numpy` 和 `SciPy` 库查找数据集中的异常值，以进一步清洗数据。为此，我们将使用 Z-score 方法。Z-score 基本上表示数据点距离平均值有多远。通常，Z-score
    为 `3` 或更高是异常值的良好指标。让我们在数据集中寻找这些异常值。


    ![](img/rsrcUH.jpg)


    在上面的代码中，我们遵循以下步骤来计算并移除异常值：


    1.  我们导入了 `Numpy` 和 `Scipy` 库

    2.  然后我们使用 `Scipy` 的 `stats.zscore()` 函数计算数据框中每个数值的 Z 分数

    3.  然后我们用 Z 分数小于 `3` 的数据重新构建数据框，以消除所有异常值

    4.  最后，我们打印出这个更新后数据集的形状


    ![](img/rsrcUJ.jpg)


    好消息！Z-Score 函数未发现任何异常值，我们的数据集大小保持不变——仍为 980 行和 7 列。


    ## 6.3 使用 Matplotlib 和 Seaborn 可视化数据


    既然我们已经移除了所有空值、替换了字符串值并检查了异常值，让我们找出房屋的哪些特征对房屋销售价格影响最大。查看这一点的最简单方法是可视化您的数据。为此，我们将使用两个额外的
    Python 库：


    1.  **Matplotlib** 是 Python 中创建图表和绘图的基础库

    2.  **Seaborn** 是一个更高级的数据可视化库，基于 `Matplotlib` 作为其基础


    让我们使用上述两个库来可视化我们的数据，看看哪些特征对房屋销售价格影响最大。我们将首先查看房屋销售价格的分布，如下所示：


    ![](img/rsrcUK.jpg)


    在上面的快照中，我们涵盖了以下步骤：


    1.  我们首先导入了 `matplotlib` 和 `seaborn` 库

    2.  然后我们调用了名为 `distplot()` 的分布图函数，并传递了销售价格列以生成分布图可视化


    分布图向我们显示，销售价格范围在 500,000 美元到 100 万美元之间，然后是 200 万美元。现在，让我们创建一个名为箱线图的新数据可视化——以查看不同房屋类型的房价。正如您可能记得的，我们在上一章中按如下方式重新编码了房屋类型：


    | 房屋类型 – 字符串值 | 房屋类型 – 数值编码 |

    | --- | --- |

    | 独栋 | 0 |

    | 半独栋 | 1 |

    | 联排别墅 | 2 |


