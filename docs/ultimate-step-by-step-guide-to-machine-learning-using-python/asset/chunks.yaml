    in Python, let’s see how we navigate and traverse through them. We can do so in
    the following ways: 1)        If then else statements 2)        Loops 3)       
    Functions 5.1 If Then Else Statements We will start with if then else statements.
    These conditional structures are a common presence in all object-oriented programming
    languages. They make use of Boolean operators introduced earlier in this book
    and depending on the outcome of the Boolean condition, the path forward is defined.
    Consider this sample of code: ![](rsrcTZ.jpg)In the above example, we set the
    wizard variable to String value of ‘Gandalf’. We then used the Boolean equals
    operator (==) to check if the wizard value is ‘Sauron’ instead. Clearly the result
    of that condition will be false, so Python will not print “oh no” and instead
    it picks the else path and prints “keep going”. In the syntax, notice how there
    is a colon at the end of both if and else lines of code. Also, notice how the
    dependent output is indented to show dependency on the if and else conditions.
    Now, what if you wanted to have multiple if conditions in your code? Check out
    this sample of code: ![](rsrcU0.jpg)Notice that we changed the wizard variable
    to ‘Sauron’ now and we also introduced a new elf variable ‘Frodo’. We have also
    added to the if condition by using the Boolean operator AND – basically checking
    if both the wizard == Sauron and elf == Frodo conditions are true. Since that
    is the case, Python prints “oh no” and skips the remaining conditions in the code.
    What happens if we change the elf to ‘Sam’? Let’s find out: ![](rsrcU1.jpg)Since
    our first if condition is dependent on wizard being ‘Sauron’ and elf being ‘Frodo’,
    it is no longer true. So Python skips that condition and goes to the condition
    branch elif (short for else if). We know that helpComing is set to True, so Python
    will print “keep going” as the output. 5.2 Loops Just like if then else statements,
    for loops and while loops are a common presence in object-oriented programming
    languages. For loops are used to traverse data structures based on specific conditions.
    See code example below: ![](rsrcU2.jpg)In the above example, we started with a
    list of odd numbers and we wanted to convert them to even numbers. We start out
    with using the ‘enumerate’ function in Python which essentially produces the index
    for each data element in the list. We then iterate through the list by assigning
    the index to i variable and adding 1 to each element in the list until we are
    done going through the entire list as follows: list \[0\] = 1+1 = 2 list \[1\]
    = 3+1 = 4 list \[3\] = 5+1 = 6 and so on… The outcome is a list of even numbers:
    \[2, 4, 6, 8, 10\]. Remember earlier in the book we mentioned that, lists are
    mutable and that’s why we were able to change the odd numbers to even numbers
    in the list – this function will not have worked for tuples which are immutable.
    Now let’s try traversing a set – if you recall, sets are shown in curly braces
    and do not have indices. So what do we do in that case? Not to worry, Python has
    an answer for that as well. Check out this sample code: ![](rsrcU3.jpg)Notice
    how without using an index, Python assigns the value of each data element to the
    set variable and lets you iterate through the entire length of the set? That’s
    the elegance and simplicity of Python! Now let’s look at another example of loops
    in Python – while loops. While loops are great for traversing data structures
    where the size of the data structures is not known, and you would like to traverse
    until a specific condition is met. Consider this sample code: ![](rsrcU4.jpg)In
    the above example, we were trying to find ‘gold’ but don’t know how many hops
    it will take to hit gold. So, we set our index to 0 and set the Boolean condition
    in the while loop to keep going while the metal is not equal to gold. We finally
    find gold after 3 total hops and end the loop before hitting ‘bronze’ or ‘diamond’
    which are later in the list. 5.3 Functions In Python, you have the option to define
    your own functions if there is specific set of operations you expect to repeat
    on a data structure. For example, suppose you always wanted to return multiples
    of a specific number anytime a list of numeric values is provided to you. You
    can define a function as follows: ![](rsrcU5.jpg)In the above example, we defined
    a function called ‘multiples’ using the def keyword in Python. We define the function
    as taking two parameters ‘x’ – that being the number that we will multiply the
    list with and ‘list1’ – that being the list we will convert to multiples of x.
    Once we are done defining the function, we try it out by passing it a list of
    values of 13, 15, 17 and 19 and ask the multiples function to convert the list
    by multiplying it by 4. The outcome is 52, 60, 68 and 76 – all multiples of 4
    as desired. Now you can re-use this custom defined function later in your code
    as well – as required. '
