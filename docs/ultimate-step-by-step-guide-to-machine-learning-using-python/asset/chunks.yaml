- raw: '8.2 Unsupervised Machine Learning Models Unsupervised models are basically
    like intelligent but unsupervised children – who are given a whole bunch of data
    but without a lot of direction or labelling of the data. The models then assess
    this data and draw conclusions. These conclusions continue to be refined as more
    data is provided to the model. Examples of unsupervised machine learning models
    include: 1)        Clustering 2)        Dimension Reduction 3)        Association
    Learning Clustering is, as the name suggests, like classification model above
    where it defines clusters of similar objects but the main difference being that
    the model is not given any pre-defined categories to label the data with. It comes
    up with them on its own. As an example, imagine the model being asked to classify
    different kinds of unlabeled data – some data loosely fits in the time category,
    some data fits in the geographical category and some data is not fitting either
    of these dimensions and instead is grouped in the general data cluster as illustrated
    below: ![](rsrcUY.jpg)Real-world examples of clustering include detecting anomalies
    in cancer research based on cancerous cell properties as well as fraud detection
    based on irregular insurance claims or financial investment patterns in case of
    money laundering. K-means algorithms is a popular algorithm in Python that is
    an example of clustering. Basically the algorithm finds its nearest K neighbors
    that have similar properties – with K defining the number of neighbors you are
    pre-setting the model to find. Dimension Reduction is another example of unsupervised
    machine learning model that takes a set of features of different objects and tries
    to categorize them to a higher degree of categories. Think of Netflix algorithm
    to classify incoming movies and TV shows – it typically will roll up the different
    types of content to several high-level categories automatically like action, horror
    or comedy. As new content gets added to the platform, the algorithm will further
    refine itself to cluster the movies more accurately. In certain cases, certain
    content on Netflix may fit multiple clusters. For example, a vampire movie with
    a lot of action can likely be in both the action and horror clusters. Association
    Learning is a more sophisticated form of unsupervised machine learning model that
    is learning from customer behavior and recommending new products and services
    to you based on your prior purchasing habits. These types of systems are often
    called recommender systems that associate client profile with the product clusters
    and based on that generate recommendations. To extend the Netflix example, once
    the model has built clusters of different online viewable content, it associates
    the content with your prior viewing habits and recommends new movies and tv shows
    to you that fit the categories you most often watch. The same logic applies to
    when Amazon recommends new books or products to you each time you login. 8.3 Deep
    Learning If you have ever heard the terms machine learning and deep learning interchangeably,
    I am here to tell you that they are not the same. Deep learning is an advanced
    form of machine learning where you combine several machine learning models in
    a network, often called a neural network, to arrive at a final conclusion or decision.
    The reason why it is called ‘deep learning’, is based on how deep the neural network
    goes or how many nodes are part of the network – with each node representing a
    decision point or recommendation from an interconnecting model. The neural network
    can be made more sophisticated by applying different weighting to different decision
    points or nodes and this weighting gets adjusted over time as the model becomes
    smarter by learning from more experience, trial and error and more data provided
    to it. One example of this could be when you are looking for another job, when
    you are early in your career, you may put a higher weight on salary. However,
    as you gain more experience, you may start to add more weight to other aspects
    like work-life balance, benefits and career progression opportunities. A sample
    neural network is illustrated below as an example: ![](rsrcUZ.jpg)Popular deep
    learning Python libraries include: 1)        TensorFlow 2)        Keras 3)       
    PyTorch TensorFlow is an open source framework and API for programming deep learning
    neural networks and can be imported as a library in Python. It is capable of working
    with large data sets and is very efficient in data processing – that is why it
    is gaining a lot of popularity in data science and academic communities. Keras
    can run on top of the TensorFlow framework but is more suitable for smaller datasets
    and rapid prototyping. You will see it mostly in use when you are experimenting
    with neural networks in development and traversing the nodes of the neural networks
    as part of the trial and error process in teaching the model. PyTorch is most
    commonly used for natural language processing and was developed by Facebook. What
    is Natural Language Processing (NLP) you ask? It is a way for the machine learning
    models to interpret human language and process that as input into their algorithm.
    For example, instead of providing the model if-then-else conditions and code as
    in the previous chapter, you can ask the model questions in human language like,
    “What would be my predicted house price based on the square footage?” and the
    model returns the prediction after running the question through the algorithm.
    Think of AI devices like Amazon’s Alexa and Google Home. Those are examples of
    Natural Language Processing. '
