    \ Loops\n\nJust like if then else statements, `for` loops and `while` loops are\
    \ a common presence in object-oriented programming languages. `for` loops are\
    \ used to traverse data structures based on specific conditions. See code example\
    \ below:\n\n```\nodd_numbers = [1, 3, 5, 7, 9]\nfor i, val in enumerate(odd_numbers):\n\
    \    odd_numbers[i] = val + 1\nprint(odd_numbers)\n```\n\nIn the above example,\
    \ we started with a list of odd numbers and we wanted to convert them to even\
    \ numbers. We start out by using the `enumerate()` function in Python which essentially\
    \ produces the index for each data element in the list. We then iterate through\
    \ the list by assigning the index to `i` variable and adding 1 to each element\
    \ in the list until we are done going through the entire list as follows:\n\n\
    - `list[0] = 1+1 = 2`\n- `list[1] = 3+1 = 4`\n- `list[2] = 5+1 = 6`\n- and so\
    \ on…\n\nThe outcome is a list of even numbers: `[2, 4, 6, 8, 10]`. Remember earlier\
    \ in the book we mentioned that lists are mutable and that’s why we were able\
    \ to change the odd numbers to even numbers in the list – this function will not\
    \ have worked for tuples which are immutable.\n\nNow let’s try traversing a `set`\
    \ – if you recall, sets are shown in curly braces and do not have indices. So\
    \ what do we do in that case? Not to worry, Python has an answer for that as well.\
    \ Check out this sample code:\n\n```\nmy_set = {1, 2, 3}\nfor val in my_set:\n\
    \    print(val)\n```\n\nNotice how without using an index, Python assigns the\
    \ value of each data element to the `set` variable and lets you iterate through\
    \ the entire length of the `set`? That’s the elegance and simplicity of Python!\n\
    \nNow let’s look at another example of loops in Python – `while` loops. `while`\
    \ loops are great for traversing data structures where the size of the data structures\
    \ is not known, and you would like to traverse until a specific condition is met.\
    \ Consider this sample code:\n\n```\nmetals = ['copper', 'silver', 'gold', 'bronze',\
    \ 'diamond']\nindex = 0\nwhile metals[index] != 'gold':\n    index += 1\nprint(f\"\
    Found gold at index {index}\")\n```\n\nIn the above example, we were trying to\
    \ find ‘gold’ but don’t know how many hops it will take to hit gold. So, we set\
    \ our `index` to 0 and set the Boolean condition in the `while` loop to keep going\
    \ while the `metal` is not equal to gold. We finally find gold after 3 total hops\
    \ and end the loop before hitting ‘bronze’ or ‘diamond’ which are later in the\
    \ list.\n\n## 5.3 Functions\n\nIn Python, you have the option to define your own\
    \ functions if there is specific set of operations you expect to repeat on a data\
    \ structure. For example, suppose you always wanted to return multiples of a specific\
    \ number anytime a list of numeric values is provided to you. You can define a\
    \ function as follows:\n\n```\ndef multiples(x, list1):\n    for i in range(len(list1)):\n\
    \        list1[i] = list1[i] * x\n    return list1\n\nvalues = [13, 15, 17, 19]\n\
    print(multiples(4, values))\n```\n\nIn the above example, we defined a function\
    \ called `multiples` using the `def` keyword in Python. We define the function\
    \ as taking two parameters `x` – that being the number that we will multiply the\
    \ list with and `list1` – that being the list we will convert to multiples of\
    \ `x`. Once we are done defining the function, we try it out by passing it a list\
    \ of values of 13, 15, 17 and 19 and ask the `multiples` function to convert the\
    \ list by multiplying it by 4. The outcome is 52, 60, 68 and 76 – all multiples\
    \ of 4 as desired. Now you can re-use this custom defined function later in your\
    \ code as well – as required.\n"
  trans: "\n# 5. 数据遍历\n\n既然我们已经介绍了 Python 中不同类型的数据结构，现在让我们看看如何浏览和遍历它们。我们可以通过以下方式实现：\n\
    \n1. If then else 语句（如果-那么-否则语句）\n2. 循环\n3. 函数\n\n## 5.1 If Then Else 语句\n\n我们将从\
    \ if then else 语句开始。这些条件结构在所有面向对象编程语言中都很常见。它们利用本书前面介绍的布尔运算符，并根据布尔条件的结果来确定后续的执行路径。请看这段代码示例：\n\
    \n```\nwizard = 'Gandalf'\nif wizard == 'Sauron':\n    print(\"oh no\")\nelse:\n\
    \    print(\"keep going\")\n```\n\n在上面的示例中，我们将 `wizard` 变量设置为字符串值 'Gandalf'。然后我们使用布尔等于运算符\
    \ (`==`) 来检查 `wizard` 的值是否为 'Sauron'。显然该条件的结果将为 false，因此 Python 不会打印 \"oh no\"\
    ，而是选择 `else` 路径并打印 \"keep going\"。在语法上，请注意 `if` 和 `else` 代码行末尾都有一个冒号。同时请注意，依赖的输出通过缩进来显示对\
    \ `if` 和 `else` 条件的依赖关系。\n\n现在，如果你想在代码中有多个 if 条件怎么办？请看这段代码示例：\n\n```\nwizard =\
    \ 'Sauron'\nelf = 'Frodo'\nhelpComing = True\n\nif wizard == 'Sauron' and elf\
    \ == 'Frodo':\n    print(\"oh no\")\nelif helpComing:\n    print(\"keep going\"\
    )\nelse:\n    print(\"all lost\")\n```\n\n请注意，我们现在将 `wizard` 变量改为了 'Sauron'，并引入了一个新的\
    \ `elf` 变量 'Frodo'。我们还通过使用布尔运算符 `AND` 扩展了 `if` 条件——基本上是检查 `wizard == Sauron` 和\
    \ `elf == Frodo` 这两个条件是否都为真。既然是这种情况，Python 会打印 \"oh no\" 并跳过代码中剩余的条件。\n\n如果我们把\
    \ `elf` 改为 'Sam' 会怎样？让我们来看看：\n\n```\nwizard = 'Sauron'\nelf = 'Sam'\nhelpComing\
    \ = True\n\nif wizard == 'Sauron' and elf == 'Frodo':\n    print(\"oh no\")\n\
    elif helpComing:\n    print(\"keep going\")\nelse:\n    print(\"all lost\")\n\
    ```\n\n由于我们的第一个 `if` 条件依赖于 `wizard` 为 'Sauron' 且 `elf` 为 'Frodo'，该条件不再为真。因此 Python\
    \ 跳过该条件，转到条件分支 `elif`（else if 的缩写）。我们知道 `helpComing` 被设置为 `True`，所以 Python 将打印\
    \ \"keep going\" 作为输出。\n\n## 5.2 循环\n\n就像 if then else 语句一样，`for` 循环和 `while`\
    \ 循环在面向对象编程语言中也很常见。`for` 循环用于根据特定条件遍历数据结构。请看下面的代码示例：\n\n```\nodd_numbers = [1,\
    \ 3, 5, 7, 9]\nfor i, val in enumerate(odd_numbers):\n    odd_numbers[i] = val\
    \ + 1\nprint(odd_numbers)\n```\n\n在上面的示例中，我们从一个奇数列表开始，想要将它们转换为偶数。我们首先使用 Python\
    \ 中的 `enumerate()` 函数，该函数本质上为列表中的每个数据元素生成索引。然后我们通过将索引赋值给 `i` 变量并给列表中的每个元素加 1 来遍历列表，直到遍历完整个列表，过程如下：\n\
    \n- `list[0] = 1+1 = 2`\n- `list[1] = 3+1 = 4`\n- `list[2] = 5+1 = 6`\n- 以此类推……\n\
    \n结果是一个偶数列表：`[2, 4, 6, 8, 10]`。请记住，本书前面我们提到过列表是可变的，这就是为什么我们能够将列表中的奇数改为偶数——对于不可变的元组，此函数将无法工作。\n\
    \n现在让我们尝试遍历一个 `set`（集合）——如果你记得的话，集合用花括号表示且没有索引。那该怎么办呢？别担心，Python 也有解决办法。请看这段示例代码：\n\
    \n```\nmy_set = {1, 2, 3}\nfor val in my_set:\n    print(val)\n```\n\n请注意，Python\
    \ 如何在不使用索引的情况下，将每个数据元素的值赋给 `set` 变量，并让你遍历整个 `set` 的长度？这就是 Python 的优雅与简洁！\n\n现在让我们看看\
    \ Python 中循环的另一个例子——`while` 循环。`while` 循环非常适合遍历大小未知的数据结构，并且你希望一直遍历直到满足特定条件。请看这段示例代码：\n\
    \n```\nmetals = ['copper', 'silver', 'gold', 'bronze', 'diamond']\nindex = 0\n\
    while metals[index] != 'gold':\n    index += 1\nprint(f\"Found gold at index {index}\"\
    )\n```\n\n在上面的示例中，我们试图找到 'gold'，但不知道需要跳多少步才能找到。所以，我们将 `index` 设为 0，并将 `while`\
    \ 循环中的布尔条件设为当 `metal` 不等于 gold 时继续循环。我们在总共 3 次跳转后终于找到了 gold，并在到达列表后面的 'bronze'\
    \ 或 'diamond' 之前结束了循环。\n\n## 5.3 函数\n\n在 Python 中，如果你有一组特定的操作预期要在数据结构上重复执行，你可以选择定义自己的函数。例如，假设每当提供一个数值列表时，你总想返回某个特定数字的倍数。你可以按如下方式定义函数：\n\
    \n```\ndef multiples(x, list1):\n    for i in range(len(list1)):\n        list1[i]\
    \ = list1[i] * x\n    return list1\n\nvalues = [13, 15, 17, 19]\nprint(multiples(4,\
    \ values))\n```\n\n在上面的示例中，我们使用 Python 中的 `def` 关键字定义了一个名为 `multiples` 的函数。我们定义该函数接受两个参数：`x`——即我们将用来乘以列表的数字，以及\
    \ `list1`——即我们将转换为 `x` 的倍数的列表。定义完函数后，我们通过传入值为 13、15、17 和 19 的列表来测试它，并要求 `multiples`\
    \ 函数通过乘以 4 来转换该列表。结果是 52、60、68 和 76——全都是期望的 4 的倍数。现在你可以在代码后面根据需要重复使用这个自定义函数了。\n\
    \n"
