    9.1 Establish Your Use Case This step involves formulation of your problem statement
    and I recommend that this problem statement should be formulated as a question
    that needs to be addressed or insight that needs to be gained. More specific the
    question is, the better. This step is particularly critical when you are trying
    to determine which machine learning algorithm best fits your problem. Some examples
    of use cases below for reference: 1)       “How many call center representatives
    should I have managing my life insurance claim queues during downtime in the summer
    based on historical volumes and seasonality?” 2)       “Based on the language
    and tone used in the call center call, how likely is this client to leave our
    organization or escalate the issue?” 3)       “Depending on purchase pattern of
    this client, what additional products is he / she likely to buy in the next 6
    months?” 9.2 Get Agreement on Project Drivers: Time, Cost and Scope Once you have
    nailed down your problem statement, it is important to understand what constraints
    you are working with for your data science project. 1)       If your project is
    time driven, it likely requires a quick resolution or incremental deliverables
    that need to provide immediate insights 2)       If your project is cost driven,
    you likely will not have a lot of budget for data sourcing or additional resources
    3)       If your project is scope or quality driven, you have additional flexibility
    to truly perfect your model and corresponding predictions before the result is
    shared with your clients 9.3 Confirm If Data Is Readily Available Depending on
    the nature of the problem, sometimes data may or may not be readily available.
    For example, if you are trying to analyze the patterns of the flu virus to inform
    efforts to create the vaccine for upcoming flu seasons, you may not have the most
    up to date dataset based on the current flu season – due to the timing or data
    being provided by the health institutions. In those cases, you must work with
    what is available and extrapolate / make assumptions where possible. In a cost
    or time driven project, this situation will be a barrier. In the absence of actionable
    data, you will likely have to convince the stakeholders via a business case as
    to why investing in sourcing additional data to address the problem is the right
    investment to make. 9.4 Confirm Quality of Your Data You can be swimming in data
    but it is possible that the quality of your data is not good i.e. you have a lot
    of missing, incomplete or generally uninterpretable information. You will have
    to spend a lot of time in data cleaning and manipulation before it is ready for
    analysis. In a lot of data science projects, this is the least sexy and most time
    intensive exercise. Good news here is that Python has a lot of built in functions,
    as we illustrated earlier in this book that allow you to clean your data and visualize
    it to eliminate any outliers as well as null values. 9.5 Confirm Interpretability
    of Your Data You can have lots of data of great quality. However, you will have
    a hard time analyzing or training the model if no one in your organization understands
    it. In case your parachuted into an organization to work on their data science
    project, it is highly likely that the organization has a lot of old legacy systems,
    that use their own internal encoding and knowledge of the data and how to interpret
    it is often in people’s heads or is tribal knowledge i.e. its known to a select
    few old timers but is not documented or widely shared. In an organization that
    is very operationally focused and cannot make data subject matter experts (SMEs)
    available to assist on data science projects, this is often a stumbling block.
    Often, availability of these SMEs must be business cased to move the data science
    project forward. 9.6 Visualize Your Data Now that you have good quality data that
    is interpretable and you have ready access to SMEs, you are ready to analyze your
    data and the fun truly begins! As a first step, you visualize your data to look
