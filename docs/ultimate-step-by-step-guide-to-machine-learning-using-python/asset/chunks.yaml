  trans: "\n# 构建预测模型\n\n现在我们已经选择了数据集，并针对空值和异常值对其进行了清洗，接下来我们准备构建不同的预测模型。但究竟什么是预测模型？用最简单的话来说，预测模型利用过去来预测未来。它们分析当前状态因素、相关性和数据关系，以基于这些依赖关系确定事态将如何发展。\n\
    \n在本章中，我们将使用迄今为止一直在处理的数据集构建两种不同类型的预测模型：\n\n1.  线性回归\n2.  决策树回归\n\n然后我们将测试并比较这些预测模型的准确性。\n\
    \n## 回归\n\n在深入探讨之前，我们刚提到了一个新术语——回归。为什么预测未来的预测模型会涉及回归？回归是一种统计技术，该术语最早由弗朗西斯·高尔顿（Francis\
    \ Galton）([6]) 于 1877 年使用，用于描述后代的身高倾向于向平均值回归，而不是随着每一代的繁衍而增加。随后，该术语演变为一种统计概念，用于描述因变量（如房屋销售价格）与自变量（如房屋面积和车库数量）之间的关系。存在各种各样的机器学习和预测算法，我将在下一章从较高层面介绍其中一些。不过，我将更详细地解释为什么线性回归和决策树是针对该特定问题的合适算法。\n\
    \n为了训练我们的模型，我们将首先按如下方式将数据拆分为训练集和测试集：\n\n```\n# Code for train_test_split (refer\
    \ to rsrcUS.jpg)\n```\n\n在上述代码示例中，我们使用了 Scikit-learn 库中的 `train_test_split` 函数。正如你所见，我们将\
    \ `y` 定义为目标/因变量 `SalePrice`，将 `X` 定义为用于预测价格的所有自变量。我们在此稍作停留，以说明 `train_test_split`\
    \ 函数中额外参数的用途：\n\n1.  `test_size` – 定义数据中有多少百分比将被视为测试数据集。在本例中，我们使用了 50%\n2.  `random_state`\
    \ – 在拆分过程中用作随机数生成的输入。在本例中，我们使用了 80\n3.  `shuffle` – 用于确定拆分前是否应打乱数据。就我们的目的而言，我们将其设置为\
    \ true\n\n现在我们准备好构建、训练和测试预测模型了！\n\n## 7.1 线性回归模型\n\n线性回归模型假设因变量或目标变量（例如房屋销售价格）与自变量（如面积、车库数量等）之间存在线性关系。它可以用以下方程说明：\n\
    \n`Y = cX + I`\n\n其中：\n*   `Y` = 因变量，即房屋销售价格\n*   `X` = 自变量，例如面积\n*   `c` = 系数\
    \ —— 由线性回归模型计算得出\n*   `I` = 截距 —— 同样由线性回归模型计算得出\n\n以上是简单线性回归的情况，即只有一个因变量和一个自变量。当你有多个自变量时（如在我们的案例中），我们使用下面的方程，这可以定义为多元线性回归：\n\
    \n`Y = I + (c1X1) + (c2X2) + (c3X3) + ...`\n\n我们可以按如下方式初始化、训练和测试线性回归模型：\n\n```\n\
    # Code for Linear Regression (refer to rsrcUT.jpg)\n```\n\n在上述代码快照中，我们涵盖了以下步骤：\n\
    \n1.  我们从 Scikit-Learn 库初始化了线性回归模型\n2.  然后我们使用训练数据集对模型进行拟合（或训练）\n3.  我们使用测试数据集进行预测\n\
    4.  我们使用两种方法测试模型的准确性：\n    1.  均方误差（MSE） —— 计算实际值与预测值之间的差异\n    2.  R 平方（也称为决定系数）\
    \ —— 计算数据与拟合回归线的接近程度。简单来说，就是我们的模型与数据的“拟合”程度如何。R 平方的范围是 0 到 1，负分通常表示模型拟合存在问题。在我们的案例中，测试数据的\
    \ R 平方值约为 .39。这意味着房屋销售价格约 39% 的变异是由我们之前确定的面积和房屋类型等自变量的变异所导致的\n\n## 7.2 决策树回归模型\n\
    \n现在让我们尝试另一种称为决策树的预测模型算法。为什么我们要使用这种类型的算法来预测房屋销售价格？决策树回归模型在将数据集分解为更小的子集并不断遍历不同节点以得出预测时，会形成一种树结构。就房屋销售价格而言，决策树可以可视化如下：\n\
    \n![决策树可视化](img/rsrcUU.jpg)\n\n以上是决策树如何得出销售价格预测的过度简化示意图，但它阐明了要点。下面是我们将在 Python\
    \ 中启动、训练、测试和评估决策树回归模型的方法。\n\n```\n# Code for Decision Tree Regression (refer to\
    \ rsrcUV.jpg)\n```\n\n以上是初始化决策树回归模型的一个非常基础的示例。在上述示例代码中，我们涵盖了以下步骤：\n\n1.  我们从 Scikit-Learn\
    \ 库初始化了决策树回归模型\n2.  然后我们使用训练数据集对模型进行拟合（或训练）\n3.  我们使用测试数据集进行预测\n4.  我们使用 Scikit-Learn\
    \ 库中的 `metrics.accuracy_score` 函数测试模型的准确性，获得了 67% 的准确率 —— 这比我们之前得到的线性回归模型结果有所提高\n\
    \n通常，为数据集寻找最合适的模型是一个反复试验的过程，我们会根据训练集和测试集的表现，选择准确度最高的那个模型。\n"
