    # 6. Data Exploration and Analysis


    Now that we have covered different data types, structures, and how to use them,
    we will take it one step further and cover how we work with data files and data
    frames. We will also introduce two foundational Python libraries: `Pandas` and
    `Numpy`.


    For the purposes of this and upcoming chapters, we will use a sample fictional
    dataset that contains house sales prices based on various house features such
    as:


    1.  **Year Built** – Year house was built

    2.  **Square Footage** – Size of the house in square feet

    3.  **House Type** – Whether the house is a detached, semi-detached or townhouse

    4.  **Garage Size** – Number of cars that the garage can accommodate

    5.  **Fireplaces** – Whether house has a fireplace or not

    6.  **Pool** – Whether house has a pool or not

    7.  **Sale Price** – Actual sale price of the house based on the above features


    You can download this sample dataset as a `.csv` file from my website by following
    this link: [House Sales Data](https://daneyalauthor.com/wp-content/uploads/2020/01/House-Sales-Values.csv)


    ## 6.1 Explore and Clean Data with Pandas


    Now that we have selected our dataset to work with, let’s first start with reading
    the `train.csv` file that we downloaded earlier. For that we will use a built-in
    Python library called ‘`Pandas`’. Pandas are cute furry animals but in Python
    they also allow us to work with data as organized data frames. This library also
    has built-in functions that we can perform on these data frames.


    We start with importing this library as follows:


    ![](rsrcU6.jpg)


    Here we have used the `import` keyword to create an instance of `pandas` to process
    the house sales data and named it ‘`pd`’. We now import the House Sales Values.csv
    file as follows:


    ![](rsrcU7.jpg)


    In the above code sample, we used the `pandas` function `read_csv()` by passing
    it the path to the `train.csv` file and stored it into our data frame called ‘`df`’.
    We are now ready to use `pandas`’ data exploratory functions, so we can understand
    our dataset better.


    Let’s start by looking at the first 10 records of the data set. For that we use
    the `pandas` `head()` function. See code sample below:


    ![](rsrcU8.jpg)


    Note that in the above code sample, we passed `10` as an argument to the `head()`
    function. If we had passed `20` as an argument e.g. `df.head(20)`, Python would
    have returned first 20 rows.


    Let’s also have a look at how many rows and columns our dataset has, using the
    `pandas` `shape` attribute. See code sample below:


    ![](rsrcU9.jpg)


    Looks like our dataset has 1000 rows and 7 columns. Ok great, now let’s find out
    what are data types in each column of the data frame. For that we will use the
    `pandas` `dtypes` attribute. See code sample below:


    ![](rsrcUA.jpg)


    Looks like we have a mix of integers, floats and strings (objects) in our dataset.
    Good to know and this will come in handy as we transform our data for further
    processing later in this book.


    Let’s further describe this data set using the `describe()` function to understand
    it better. See code sample below:


    ![](rsrcUB.jpg)


    The `describe` function gave us additional important statistics on our dataset
    – for example what is the count, mean, max and min values for different numeric
    features like Year Built, Square Footage, Car Garage Size and Sale Price of the
    house.


    Ok now let’s clean this data before processing it further. Let’s find out how
    many null values we have for each column.


    ![](rsrcUC.jpg)


    Looks like for certain columns, a small percentage of data is null. For example,
    House Type is missing in 10 records and Sale Price is missing in 5 records. As
    this amount of missing data will introduce discrepancies in our analysis, we will
    drop these columns for simplicity and re-shape and describe our data set. See
    code sample below:


    ![](rsrcUD.jpg)


    We now have a smaller data set to work with, consisting of 980 rows, 7 columns
    and no null values!


    ## 6.2 Find Outliers with Numpy and Scipy


    Before we go further though, let’s introduce a few more foundational libraries
    in Python.


    1.  **Numpy** is a library that is used for performing numeric operations on data
    structures like lists and matrices

    2.  **Scipy** is a library that leverages `Numpy` data structures for advanced
    algebra and calculus operations

    3.  **Scikit-learn** (also known as **Sklearn**) is a foundational Python library
    for building predictive models


    To leverage the numeric calculations (`Numpy`), statistical analysis (`Scipy`)
    and predictive modeling (`Scikit-learn`) functions in the above libraries, we
    need to replace categorical string values in our dataset with numeric values.
    Since this is a common issue, `Sklearn` library has built-in functions that allow
    you to do exactly that in very few lines of code. See below:


    ![](rsrcUE.jpg)


    In the above code snapshot, we completed the following steps:


    1.  We created an array of column names with non-numeric (Boolean or String) values
    – House Type, Fireplaces and Pool

    2.  We then used the `LabelEncoder()` function in `Scikit-learn` library to transform
    all the non-numeric columns to numeric values – essentially replacing string values
    with numeric codes like `0`, `1`, `2`. Notice how we used the `for` loop introduced
    earlier in this book to traverse this data structure

    3.  We then print out the first 10 rows of our dataset and as well as data types.
    See below:


    ![](rsrcUF.jpg)


    Notice how for Fireplaces and Pool, before we had ‘Yes’ and ‘No’ values and they
    have now been replaced with `1` and `0` respectively. Also, for House Type different
    house types have been re-coded as follows `0`, `1`, `2`. Our data types for different
    columns in the dataset are also numeric:


    ![](rsrcUG.jpg)


    We will use `Numpy` and `SciPy` libraries to find outliers in our data set to
    clean it further. For that we will use Z-score method. Z-score basically indicates
    how far from the mean a data point is. Typically, a Z-score of `3` or more is
    a good indicator of an outlier. Let’s look for these outliers in our data set.


    ![](rsrcUH.jpg)


    In the above code, we followed the following steps to calculate and remove our
    outliers:


    1.  We imported `Numpy` and `Scipy` libraries

    2.  We then calculated Z scores for each of the numeric values in our data frame
    using the `Scipy` `stats.zscore()` function

    3.  We then re-formed the data frame with data that has Z score of less than `3`
    to eliminate all the outliers

    4.  Finally, we printed out the shape of this updated data set


    ![](rsrcUJ.jpg)


    Good news! Z-Score function did not find any outliers and our dataset still has
    the same size – 980 rows and 7 columns.


    ## 6.3 Visualize Data with Matplotlib and Seaborn


    Now that we have removed all null values, replaced string values and checked for
    outliers, let’s find out which features of the house have the biggest impact on
    house sales price. Easiest way to see that is by visualizing your data. For that
    we will use two additional Python libraries:


    1.  **Matplotlib** is the foundational library for creating graphs and plots in
    Python

    2.  **Seaborn** is a more advanced data visualization library and is based on
    the `Matplotlib` as its foundation


    Let’s use the above two libraries to visualize our data and see which features
    impact the house sale prices the most. We will first look at the distribution
    of the house sale prices as follows:


    ![](rsrcUK.jpg)


    In the above snapshot, we covered the following steps:


    1.  We first imported the `matplotlib` and `seaborn` libraries

    2.  We then called the distribution plot function called `distplot()` and passed
    it the Sale Price column to generate the distribution plot visualization


    The distribution plot shows us that that the sale prices range between $500,000
    to $1 million and then $2 million. Now, let’s create a new data visualization
    called box plots – to see house prices by different house types. As you may recall,
    we re-coded the house types in the previous chapter as follows:


    | House Type – String Value | House Type – Numeric Encoding |

    | --- | --- |

    | Detached | 0 |

    | Semi-Detached | 1 |

    | Town-home | 2 |

