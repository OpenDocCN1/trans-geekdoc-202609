    \ be referencing regression? Regression is a statistical technique and the term\
    \ was first used by Francis Galton (\\[[6](#part0020.xhtml) \\]) in 1877 when\
    \ describing how the heights of descendants tended to regress towards the mean\
    \ as opposed to increasing with each new generation. This term then evolved into\
    \ the statistical concept of describing the relationship between dependent variables\
    \ like house sale price and independent variables like house square footage and\
    \ number of garages. There is a wide variety of different machine learning and\
    \ predictive algorithms and I will go over some of them at a higher level in the\
    \ next chapter. However, I will go over in more detail why Linear Regression and\
    \ Decision Tree are suitable algorithms for this specific problem. To train our\
