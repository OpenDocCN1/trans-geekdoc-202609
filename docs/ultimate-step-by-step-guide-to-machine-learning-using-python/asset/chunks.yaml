    1\\. Introduction Python was developed in 1980s by Guido Van Rossum of Netherlands.\
    \ Python was developed as an object-oriented language with an emphasis on simplicity,\
    \ extensibility and flexibility \\[[1](#part0020.xhtml) \\]. Python also comes\
    \ with a large library of pre-built functionality for data science, statistical\
    \ analysis and data visualizations which make this language very easy to learn\
    \ and use. In this book we will focus on data science applications of Python with\
    \ hands on examples that allow you to go from novice to expert in a short period\
    \ of time! We will start with getting you set up with Python, introducing you\
    \ to its data structures and libraries and then finally getting into the data\
    \ science applications of this beautiful language. What you will find different\
    \ about this book is the visual and hands on approach it takes to teaching Python.\
    \ Since this book is directed at beginners, we will not drone on and on about\
    \ complex concepts or make this book text heavy. Instead, we will take inspiration\
    \ from the Zen of Python by Tim Peters \\[[2](#part0020.xhtml) \\]: “Beautiful\
    \ is better than ugly…simple is better than complex….sparse is better than dense….”.\
    \ \n\n2\\. Getting Started There are detailed instructions available via the Python\
    \ website on how to install Python on your machine – whether it is Windows, Mac\
    \ OS or Linux under on [Python website in the Getting Started section](https://www.python.org/about/gettingstarted/)\
    \  \\[[3](#part0020.xhtml) \\]. I recommend you read through it as there is a\
    \ lot of good information and helpful links for beginners. However, installing\
    \ Python by itself is not very helpful or user friendly. You are better off installing\
    \ Python alongside an IDE (Integrated Development Environment) – as that comes\
    \ with tools and development environment to execute and debug your code. For that\
    \ I recommend starting with [Anaconda Distribution](https://www.anaconda.com/distribution/)\
    \ \\[[4](#part0020.xhtml) \\]. It is an open-source tool that installs industry\
    \ standard IDEs and foundational Python libraries that we will be describing in\
    \ this book in more detail. When you click on the above link, it will take you\
    \ to a page to download and install package for your operating system e.g. Windows,\
    \ macOS or Linux. We will be using [Jupyter Notebook](https://jupyter.org/) \\\
    [[5](#part0020.xhtml) \\] as our development environment for this book – Jupyter\
    \ is part of the Anaconda distribution package and will be installed on your machine\
    \ along with Python. Jupyter is a powerful web-based development environment that\
    \ we will be using in this book to execute our code and I have made all the source\
    \ code used in this book available on my website as a ‘.ipnyb’ Jupyter file. You\
    \ can access all the code by going to my website here: [https://www.daneyalauthor.com](https://www.daneyalauthor.com)\
    \ and open the code in Jupyter Notebook. Once Anaconda is installed on your machine,\
    \ launch Anaconda Navigator from your menu. Screenshot below for reference: ![](rsrcTC.jpg)Once\
    \ open, you should see the following Anaconda Navigator dashboard with all the\
    \ tools available to you: ![](rsrcTD.jpg)Launch Jupyter Notebook by clicking on\
    \ the ‘Launch’ button under that application icon. Once you do that, the following\
    \ web browser window will open: ![](rsrcTE.jpg)Click on ‘New’ and the ‘Python\
    \ 3’ in the top right. Once you do that, a new browser window will open with your\
    \ new project and Python environment ready to execute. You can rename your project\
    \ as ‘My First Python Project’ by clicking on ‘Untitled’ at the top of the screen\
    \ (highlighted below for reference). Done? Alright, you are ready to go! ![](rsrcTF.jpg)"
