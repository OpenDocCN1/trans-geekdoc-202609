- "# Python 机器学习终极分步指南：面向初学者的预测建模概念通俗解析\n\n\n\n\n\n\n\n> 本书献给我的父母，是他们给了我追逐梦想的自信；也献给我的妻子和孩子们，是他们让这些梦想值得去追逐。\n\
  \n---\n\n## 1. 简介\n\nPython 由荷兰的 Guido Van Rossum 在 20 世纪 80 年代开发。Python 作为一种面向对象的语言进行开发，强调简洁性、可扩展性和灵活性\
  \ [[1]](#part0020.xhtml)。Python 还拥有庞大的预构建功能库，用于数据科学、统计分析和数据可视化，这使得该语言非常容易学习和使用。\n\
  \n在本书中，我们将专注于 Python 的数据科学应用，并通过实操示例让您在短时间内从新手成长为专家！我们将从 Python 环境搭建入手，向您介绍其数据结构和库，最后深入探讨这门优美语言的数据科学应用。\n\
  \n您会发现本书的不同之处在于它采用了可视化和实操的教学方法。既然本书面向初学者，我们就不会啰嗦地讲解复杂概念，也不会让本书文字过于密集。相反，我们将从 Tim\
  \ Peters 的《Python 之禅》[[2]](#part0020.xhtml) 中汲取灵感：\n\n> “优美胜于丑陋……简单胜于复杂……稀疏胜于密集……”\n\
  \n## 2. 入门指南\n\nPython 官网的“入门”板块提供了在您的机器上安装 Python 的详细说明——无论是 Windows、Mac OS 还是\
  \ Linux，请访问 [Python 官网的 Getting Started 部分](https://www.python.org/about/gettingstarted/)\
  \ [[3]](#part0020.xhtml)。我建议您仔细阅读，因为那里有很多很好的信息和对初学者有帮助的链接。\n\n然而，仅安装 Python 本身并不太有帮助，也不够用户友好。您最好将\
  \ Python 与 IDE（集成开发环境）一起安装——因为 IDE 自带工具和开发环境，可用于执行和调试代码。为此，我建议从 [Anaconda Distribution](https://www.anaconda.com/distribution/)\
  \ [[4]](#part0020.xhtml) 开始。它是一个开源工具，可安装行业标准的 IDE 和基础 Python 库，我们将在本书中更详细地介绍这些内容。\n\
  \n点击上述链接后，您将进入一个页面，以下载并安装适合您操作系统（如 Windows、macOS 或 Linux）的安装包。我们将在本书中使用 [Jupyter\
  \ Notebook](https://jupyter.org/) [[5]](#part0020.xhtml) 作为开发环境——Jupyter 是 Anaconda\
  \ 分发包的一部分，将随 Python 一起安装在您的机器上。\n\nJupyter 是一个功能强大的基于 Web 的开发环境，我们将在本书中用它来执行代码，我已将本书中使用的所有源代码作为\
  \ `.ipnyb` Jupyter 文件放在我的网站上。您可以通过访问我的网站 [`www.daneyalauthor.com`](https://www.daneyalauthor.com)\
  \ 来获取所有代码，并在 Jupyter Notebook 中打开。\n\n在您的机器上安装 Anaconda 后，从菜单中启动 Anaconda Navigator。\n\
  \n![](img/rsrcTC.jpg)\n\n打开后，您应该会看到以下 Anaconda Navigator 仪表板，其中包含所有可用工具：\n\n![](img/rsrcTD.jpg)\n\
  \n点击该应用程序图标下的“Launch”按钮启动 Jupyter Notebook。完成后，将打开以下网页浏览器窗口：\n\n![](img/rsrcTE.jpg)\n\
  \n点击右上角的“New”，然后选择“Python 3”。完成后，将打开一个新的浏览器窗口，其中包含您的新项目和准备好执行的 Python 环境。您可以通过点击屏幕顶部的“Untitled”（下文高亮显示供参考）将项目重命名为“My\
  \ First Python Project”。完成了吗？好的，您已准备就绪！\n\n![](img/rsrcTF.jpg)\n\n\n\n\n## 3. 数据类型\n\
  \n在 Python 中，与大多数编程语言一样，主要有 3 种数据类型：\n\n1.  布尔值\n2.  数字\n3.  字符串\n\n## 3.1 布尔值\n\
  \n布尔值为 `True` 或 `False`。你可以使用以下布尔运算符来比较不同的值：\n\n1.  等于：`==`\n2.  大于：`>`\n3.  小于：`<`\n\
  4.  大于或等于：`>=`\n5.  小于或等于：`<=`\n\n在你上面创建的 Python 笔记本中尝试运行以下代码：\n\n![](img/rsrcTG.jpg)\n\
  \n## 3.2 数字\n\n在 Python 中，数字可以是整数，即像 `1`、`2`、`3` 这样的整数，也可以是浮点数，即像 `1.1`、`2.3`、`4.5`\
  \ 等带小数的数字。你可以使用基本的数学运算符，如：\n\n1.  加法：`+`\n2.  减法：`-`\n3.  乘法：`*`\n4.  除法：`/`\n5.\
  \  括号：`()` 用于强制规定运算优先级\n\n在你上面创建的 Python 笔记本中尝试运行以下代码：\n\n![](img/rsrcTH.jpg)\n\n\
  你也可以通过在 Python 中使用 `type` 命令来检查数字的类型。见下图：\n\n![](img/rsrcTJ.jpg)\n\n## 3.3 字符串\n\
  \n字符串本质上是一串字符。例如单词或句子。在 Python 中，字符串由单引号（`' '`）或双引号（`\" \"`）标识。就像上面的布尔值和数字一样，在 Python\
  \ 中有一些特定的运算符和函数可用于字符串。你可以使用 `+` 号来连接两个字符串。见下图：\n\n![](img/rsrcTK.jpg)\n\n你也可以使用\
  \ Python 中的 `upper()` 和 `lower()` 函数将字符串转换为大写或小写，并使用 `count()` 函数来确定字符串中的字符数量。见下图：\n\
  \n![](img/rsrcTM.jpg)\n\n另一个有用的函数是 `replace()`，它允许你在字符串中用另一个字符替换某个字符。见下图：\n\n![](img/rsrcTN.jpg)\n\
  \n## 4. 数据结构\n\n现在我们已经了解了 Python 中的数据类型，接下来让我们看看 Python 是如何将这些数据类型组织成不同类型的数据结构的。在本书中，我们将介绍以下数据结构：\n\
  \n1.  元组\n2.  列表\n3.  字典\n4.  集合\n5.  自定义对象\n\n## 4.1 元组\n\n元组是有序的数据序列，表示为包含在括号中并由逗号分隔的数据。例如：\n\
  \n```\n(1, 'two', 3.5, False)\n```\n\n从上面的示例可以看出，元组可以同时包含所有类型的数据。元组是不可变的——即元组内的数据不能被更改。例如，看这段代码序列：\n\
  \n![](img/rsrcTP.jpg)\n\n当我们尝试将值 `4` 赋给元组中的第二个索引位置时，Python 抛出了一个错误，表明元组对象不支持项目赋值。元组也可以包含其他数据结构，如元组——这一概念被称为“嵌套”。可以将其想象为如下树状结构：\n\
  \n![](img/rsrcTR.jpg)\n\n## 4.2 列表\n\n列表也是有序的数据结构，数据表示为由方括号分隔（而不是像元组那样用括号）。例如：\n\
  \n```\n[1, 'two', 3.5, False]\n```\n\n与元组不同，列表是可变的，即列表中的数据可以被更改。请看以下代码序列：\n\n![](img/rsrcTS.jpg)\n\
  \nPython 允许我们通过将索引 `2` 位置的值 `3.5` 替换为 `4` 来更改列表，并且不会像元组那样抛出错误。就像元组一样，列表可以同时容纳多种数据类型，包括其他数据结构，如元组和列表，即如上所述的嵌套。\n\
  \n## 4.3 字典\n\n字典与元组和列表一样，有助于对数据进行排序和排列。然而，主要区别在于它们由花括号中用逗号分隔的数据表示，并且字典的索引可以是字符串标签。请看下面的代码示例：\n\
  \n```\n{'leader': 'Abraham Lincoln', 'fighter': 'Mike Tyson', 'city': 'Toronto'}\n\
  ```\n\n在字典的情况下，索引或键是不可变的，即不能被更改。然而，由标签表示的值可以被更改。请看下面的代码示例：\n\n![](img/rsrcTT.jpg)\n\
  \n在上面的示例中，Python 允许我们将字典中的领导者更改为温斯顿·丘吉尔——并且我们使用字符串 `'leader'` 作为索引来访问结构中的第一个数据元素，而不是使用\
  \ `0`。\n\n## 4.4 集合\n\n集合是另一种类似于元组、列表和字典的数据结构——关键区别在于集合是无序的，即它们没有索引。其背后的原因是集合只包含唯一元素。它们由花括号中用逗号分隔的数据元素表示。请看下面的代码示例：\n\
  \n![](img/rsrcTU.jpg)\n\n在上面的示例中，尽管花括号中 `3.5` 被重复了，但创建集合时，重复项被移除了。可以使用 `add` 和 `remove`\
  \ 函数向集合添加或移除值。请看下面的代码示例：\n\n![](img/rsrcTV.jpg)\n\n你还可以通过使用 `&` 函数显示两个集合中的公共元素，对集合执行额外的数学函数。请看下面的代码示例：\n\
  \n![](img/rsrcTW.jpg)\n\n正如你所记得的，set1 拥有数据元素 `1` 和 `3.5`，它们也存在于 set2 中。因此 `&` 函数找到了共性，并返回了这两个集合之间的公共数据元素。现在让我们尝试使用\
  \ `union` 函数合并这两个集合。请看下面的代码示例：\n\n![](img/rsrcTX.jpg)\n\n注意在合并两个数据集时，Python 合并了公共元素\
  \ `1` 和 `3.5` 且没有重复它们——因为集合中不允许有重复项。\n\n## 4.5 自定义对象\n\n虽然元组、列表、字典和集合是 Python 的内置数据结构，但有时你可能需要在\
  \ Python 中创建具有自己属性的自定义对象或数据结构。假设你想在 Python 中创建一个名为 `Human` 的自定义对象，并为其定义特定的属性，以便在代码中复用。请参考此代码示例：\n\
  \n![](img/rsrcTY.jpg)\n\n请注意上述代码行中的以下内容：\n\n-   使用 `def` 关键字和 `__init__` 初始化函数（注意\
  \ init 关键字两侧各有两个下划线）初始化了自定义类 `Human`\n-   在初始化函数中，`self` 是正在创建的对象的一个实例，连同定义该人类对象的两个属性\
  \ `height` 和 `weight`\n-   定义完自定义类后，我们用它来初始化一个新的 `Human` 对象，并传入身高（`60 inches`）和体重（`180\
  \ pounds`）的属性值\n-   当我们打印出赋值后的对象属性时，得到了期望的输出\n\n\n\n## 5. 数据遍历\n\n既然我们已经介绍了 Python\
  \ 中不同类型的数据结构，现在让我们看看如何浏览和遍历它们。我们可以通过以下方式实现：\n\n1. If then else 语句（如果-那么-否则语句）\n\
  2. 循环\n3. 函数\n\n## 5.1 If Then Else 语句\n\n我们将从 if then else 语句开始。这些条件结构在所有面向对象编程语言中都很常见。它们利用本书前面介绍的布尔运算符，并根据布尔条件的结果来确定后续的执行路径。请看这段代码示例：\n\
  \n```\nwizard = 'Gandalf'\nif wizard == 'Sauron':\n    print(\"oh no\")\nelse:\n\
  \    print(\"keep going\")\n```\n\n在上面的示例中，我们将 `wizard` 变量设置为字符串值 'Gandalf'。然后我们使用布尔等于运算符\
  \ (`==`) 来检查 `wizard` 的值是否为 'Sauron'。显然该条件的结果将为 false，因此 Python 不会打印 \"oh no\"，而是选择\
  \ `else` 路径并打印 \"keep going\"。在语法上，请注意 `if` 和 `else` 代码行末尾都有一个冒号。同时请注意，依赖的输出通过缩进来显示对\
  \ `if` 和 `else` 条件的依赖关系。\n\n现在，如果你想在代码中有多个 if 条件怎么办？请看这段代码示例：\n\n```\nwizard = 'Sauron'\n\
  elf = 'Frodo'\nhelpComing = True\n\nif wizard == 'Sauron' and elf == 'Frodo':\n\
  \    print(\"oh no\")\nelif helpComing:\n    print(\"keep going\")\nelse:\n    print(\"\
  all lost\")\n```\n\n请注意，我们现在将 `wizard` 变量改为了 'Sauron'，并引入了一个新的 `elf` 变量 'Frodo'。我们还通过使用布尔运算符\
  \ `AND` 扩展了 `if` 条件——基本上是检查 `wizard == Sauron` 和 `elf == Frodo` 这两个条件是否都为真。既然是这种情况，Python\
  \ 会打印 \"oh no\" 并跳过代码中剩余的条件。\n\n如果我们把 `elf` 改为 'Sam' 会怎样？让我们来看看：\n\n```\nwizard\
  \ = 'Sauron'\nelf = 'Sam'\nhelpComing = True\n\nif wizard == 'Sauron' and elf ==\
  \ 'Frodo':\n    print(\"oh no\")\nelif helpComing:\n    print(\"keep going\")\n\
  else:\n    print(\"all lost\")\n```\n\n由于我们的第一个 `if` 条件依赖于 `wizard` 为 'Sauron' 且\
  \ `elf` 为 'Frodo'，该条件不再为真。因此 Python 跳过该条件，转到条件分支 `elif`（else if 的缩写）。我们知道 `helpComing`\
  \ 被设置为 `True`，所以 Python 将打印 \"keep going\" 作为输出。\n\n## 5.2 循环\n\n就像 if then else\
  \ 语句一样，`for` 循环和 `while` 循环在面向对象编程语言中也很常见。`for` 循环用于根据特定条件遍历数据结构。请看下面的代码示例：\n\n\
  ```\nodd_numbers = [1, 3, 5, 7, 9]\nfor i, val in enumerate(odd_numbers):\n    odd_numbers[i]\
  \ = val + 1\nprint(odd_numbers)\n```\n\n在上面的示例中，我们从一个奇数列表开始，想要将它们转换为偶数。我们首先使用 Python\
  \ 中的 `enumerate()` 函数，该函数本质上为列表中的每个数据元素生成索引。然后我们通过将索引赋值给 `i` 变量并给列表中的每个元素加 1 来遍历列表，直到遍历完整个列表，过程如下：\n\
  \n- `list[0] = 1+1 = 2`\n- `list[1] = 3+1 = 4`\n- `list[2] = 5+1 = 6`\n- 以此类推……\n\
  \n结果是一个偶数列表：`[2, 4, 6, 8, 10]`。请记住，本书前面我们提到过列表是可变的，这就是为什么我们能够将列表中的奇数改为偶数——对于不可变的元组，此函数将无法工作。\n\
  \n现在让我们尝试遍历一个 `set`（集合）——如果你记得的话，集合用花括号表示且没有索引。那该怎么办呢？别担心，Python 也有解决办法。请看这段示例代码：\n\
  \n```\nmy_set = {1, 2, 3}\nfor val in my_set:\n    print(val)\n```\n\n请注意，Python\
  \ 如何在不使用索引的情况下，将每个数据元素的值赋给 `set` 变量，并让你遍历整个 `set` 的长度？这就是 Python 的优雅与简洁！\n\n现在让我们看看\
  \ Python 中循环的另一个例子——`while` 循环。`while` 循环非常适合遍历大小未知的数据结构，并且你希望一直遍历直到满足特定条件。请看这段示例代码：\n\
  \n```\nmetals = ['copper', 'silver', 'gold', 'bronze', 'diamond']\nindex = 0\nwhile\
  \ metals[index] != 'gold':\n    index += 1\nprint(f\"Found gold at index {index}\"\
  )\n```\n\n在上面的示例中，我们试图找到 'gold'，但不知道需要跳多少步才能找到。所以，我们将 `index` 设为 0，并将 `while` 循环中的布尔条件设为当\
  \ `metal` 不等于 gold 时继续循环。我们在总共 3 次跳转后终于找到了 gold，并在到达列表后面的 'bronze' 或 'diamond' 之前结束了循环。\n\
  \n## 5.3 函数\n\n在 Python 中，如果你有一组特定的操作预期要在数据结构上重复执行，你可以选择定义自己的函数。例如，假设每当提供一个数值列表时，你总想返回某个特定数字的倍数。你可以按如下方式定义函数：\n\
  \n```\ndef multiples(x, list1):\n    for i in range(len(list1)):\n        list1[i]\
  \ = list1[i] * x\n    return list1\n\nvalues = [13, 15, 17, 19]\nprint(multiples(4,\
  \ values))\n```\n\n在上面的示例中，我们使用 Python 中的 `def` 关键字定义了一个名为 `multiples` 的函数。我们定义该函数接受两个参数：`x`——即我们将用来乘以列表的数字，以及\
  \ `list1`——即我们将转换为 `x` 的倍数的列表。定义完函数后，我们通过传入值为 13、15、17 和 19 的列表来测试它，并要求 `multiples`\
  \ 函数通过乘以 4 来转换该列表。结果是 52、60、68 和 76——全都是期望的 4 的倍数。现在你可以在代码后面根据需要重复使用这个自定义函数了。\n\n\
  \n\n\n\n## 6. 数据探索与分析\n\n既然我们已经介绍了不同的数据类型、结构以及如何使用它们，我们将更进一步，介绍如何处理数据文件和数据框。我们还将介绍两个基础的\
  \ Python 库：`Pandas` 和 `Numpy`。\n\n为了本章及后续章节的目的，我们将使用一个虚构的示例数据集，该数据集基于各种房屋特征包含房屋销售价格，例如：\n\
  \n1.  **建造年份** – 房屋建造的年份\n2.  **建筑面积** – 房屋大小，以平方英尺为单位\n3.  **房屋类型** – 房屋是独栋、半独栋还是联排别墅\n\
  4.  **车库大小** – 车库可容纳的汽车数量\n5.  **壁炉** – 房屋是否有壁炉\n6.  **泳池** – 房屋是否有泳池\n7.  **销售价格**\
  \ – 基于上述特征的房屋实际销售价格\n\n您可以通过此链接从我的网站下载此示例数据集（`.csv` 文件）：[房屋销售数据](https://daneyalauthor.com/wp-content/uploads/2020/01/House-Sales-Values.csv)\n\
  \n## 6.1 使用 Pandas 探索和清洗数据\n\n既然我们已经选定了要处理的数据集，让我们首先开始读取之前下载的 `train.csv` 文件。为此，我们将使用一个名为\
  \ ‘`Pandas`’ 的 Python 内置库。大熊猫是可爱的毛茸茸的动物，但在 Python 中，它们也允许我们将数据作为有组织的数据框进行处理。该库还拥有可对这些数据框执行的内置函数。\n\
  \n我们首先导入此库，如下所示：\n\n![](img/rsrcU6.jpg)\n\n这里我们使用了 `import` 关键字创建了一个 `pandas` 实例来处理房屋销售数据，并将其命名为\
  \ ‘`pd`’。现在我们按如下方式导入 House Sales Values.csv 文件：\n\n![](img/rsrcU7.jpg)\n\n在上面的代码示例中，我们通过传递\
  \ `train.csv` 文件的路径使用了 `pandas` 函数 `read_csv()`，并将其存储到名为 ‘`df`’ 的数据框中。我们现在可以使用 `pandas`\
  \ 的数据探索函数了，以便更好地了解我们的数据集。\n\n让我们首先查看数据集的前 10 条记录。为此，我们使用 `pandas` 的 `head()` 函数。请见下面的代码示例：\n\
  \n![](img/rsrcU8.jpg)\n\n请注意，在上面的代码示例中，我们将 `10` 作为参数传递给了 `head()` 函数。如果我们传递 `20`\
  \ 作为参数，例如 `df.head(20)`，Python 将返回前 20 行。\n\n让我们也看看使用 `pandas` 的 `shape` 属性，我们的数据集有多少行和列。请见下面的代码示例：\n\
