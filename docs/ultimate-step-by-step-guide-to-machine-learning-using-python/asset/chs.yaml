  \n通常，为数据集寻找最合适的模型是一个反复试验的过程，我们会根据训练集和测试集的表现，选择准确度最高的那个模型。\n\n\n\n## 8. 理解机器学习\n\n\
  在上一章中，我介绍了两种机器学习模型：`Linear Regression`（线性回归）和 `Decision Tree`（决策树）分析。我还提到，根据手头问题的性质，还有许多其他机器学习模型可供应用。在本章中，我们将用通俗易懂的语言解释更多的机器学习模型和算法——旨在让读者能够从宏观层面理解它们，并根据数据的性质及其数据科学用例，知道何时应用它们。\n\
  \n在最高层级上，机器学习模型可分为三大类：\n\n1.  **Supervised Machine Learning Models**（监督式机器学习模型）\n\
  2.  **Unsupervised Machine Learning Models**（非监督式机器学习模型）\n3.  **Deep Learning Models**（深度学习模型）\n\
  \n### 8.1 Supervised Machine Learning Models（监督式机器学习模型）\n\n对于监督式机器学习模型，模型会获得关于如何对数据进行分类的指导，并在进行预测前利用这些指令进行学习。在上一章使用的房屋销售示例中，这就是一个监督式学习的例子，因为我们告诉模型不同的房屋类型是什么，甚至哪些房屋特征会影响销售价格。然后我们将数据集拆分为训练集和测试集，供模型用于预测。\n\
  \n监督式机器学习模型的示例包括：\n\n1.  **Regression analysis**（回归分析）\n2.  **Classification analysis**（分类分析）\n\
  \n#### Regression analysis（回归分析）\n\n在回归分析中，给定若干因素，模型需要预测一个数值。以房屋销售价格示例为例，模型综合考虑多个房屋特征来预测房屋销售价格。请注意，上述是\
  \ `Linear Regression`（线性回归）的一个例子，其中因变量（如房屋销售价格）与自变量（如房屋类型、车库数量等）之间存在直线相关性。当然，也存在不存在这种直线相关性的情况，通常在这些情况下，会使用\
  \ `Polynomial Regression`（多项式回归）分析——即用曲线代替直线。换句话说，机器学习模型在执行回归分析时，所做的一切就是试图在离散的数据点之间拟合一条线，以找到自变量和因变量之间的相关性。这可以通过可视化方式直观展示：\n\
  \n| Linear Regression | Polynomial Regression |\n| :--- | :--- |\n| ![](img/rsrcUW.jpg)\
  \ | ![](img/rsrcUX.jpg) |\n\n回归分析在现实世界中的其他应用示例包括：金融行业根据历史和市场趋势预测股票价格；零售行业根据季节性和一年中的时间预测特定产品价格（如服装、户外露台及园艺产品）。\n\
  \n#### Classification analysis（分类分析）\n\n在分类分析中，机器学习模型根据对象的特征预测其所属类别。因此，分类模型与回归模型的主要区别在于：分类模型对对象进行归类，而回归模型预测与对象关联的数值。与回归分析一样，既然分类分析是一种监督式模型，它在进行预测前，也需要提供带有标签的数据和指令供其学习。如果上一章的房屋销售数据示例是一个分类问题，模型将获得不包含房屋类型的房屋销售数据，并被要求根据数据集中包含的不同特征预测房屋类型（如独立式、半独立式或联排别墅）。\n\
  \n分类算法在现实世界中的其他应用示例包括：\n\n1.  根据健康数据将保险申请人分为不同的风险类别\n2.  根据使用的语言和情感，将呼叫中心来电归类为潜在升级案例\n\
  3.  根据特定参数对收到的邮件进行分类\n\n\n\n\n\n### 8.2 无监督机器学习模型\n\n无监督模型基本上就像聪明但无人监管的孩子——他们被给予大量数据，但没有太多指导或数据标签。模型随后评估这些数据并得出结论。随着更多数据提供给模型，这些结论会不断被完善。\n\
  \n无监督机器学习模型的示例包括：\n\n1.  **聚类**\n2.  **降维**\n3.  **关联学习**\n\n#### 聚类\n\n顾名思义，聚类类似于上述的分类模型，它定义相似对象的簇（群组），但主要区别在于模型没有被给予任何预定义的类别来标记数据。它会自行生成这些类别。\n\
  \n举个例子，想象模型被要求对不同种类的未标记数据进行分类——一些数据大致符合时间类别，一些数据符合地理类别，而一些数据不符合这两个维度中的任何一个，而是被归入通用数据簇，如下图所示：\n\
  \n![](img/rsrcUY.jpg)\n\n聚类的现实案例包括：基于癌细胞特性在癌症研究中检测异常，以及基于异常保险索赔或洗钱案件中的金融投资模式进行欺诈检测。\n\
  \n`K-means algorithms` 是 Python 中一种流行的算法，属于聚类的一个例子。基本上，该算法会找到具有相似属性的最近 `K` 个邻居——其中\
  \ `K` 定义了你预先设定模型要寻找的邻居数量。\n\n#### 降维\n\n降维是无监督机器学习模型的另一个例子，它获取不同对象的一组特征，并尝试将它们归类为更高层级的类别。\n\
  \n可以想像 Netflix 对新上架电影和电视剧进行分类的算法——它通常会自动将不同类型的内容汇总为几个高层级类别，如动作、恐怖或喜剧。随着新内容添加到平台，算法会进一步完善自身，以更准确地对电影进行聚类。\n\
  \n在某些情况下，Netflix 上的某些内容可能符合多个簇。例如，一部包含大量动作场面的吸血鬼电影很可能同时属于动作和恐怖两个簇。\n\n#### 关联学习\n\
  \n关联学习是一种更复杂的无监督机器学习模型，它从客户行为中学习，并根据您以往的购买习惯向您推荐新产品和服务。\n\n这类系统通常被称为推荐系统，它们将客户画像与产品簇关联起来，并以此生成推荐。\n\
  \n延续 Netflix 的例子，一旦模型建立了不同在线可观看内容的簇，它就会将内容与您以往的观看习惯关联起来，并向您推荐符合您最常观看类别的新电影和电视剧。同样的逻辑也适用于\
  \ Amazon 每次您登录时推荐新书或产品的情况。\n\n### 8.3 深度学习\n\n如果您曾听闻“机器学习”和“深度学习”这两个术语被混用，我在此要告诉您，它们并不相同。\n\
  \n深度学习是机器学习的一种高级形式，您将多个机器学习模型组合在一个网络中，通常称为神经网络，以得出最终的结论或决策。\n\n之所以称之为“深度学习”，是基于神经网络有多“深”，或者网络中有多少节点——每个节点代表来自互联模型的一个决策点或推荐。\n\
  \n可以通过对不同的决策点或节点应用不同的权重来使神经网络更加复杂，随着模型通过更多经验、试错以及更多提供给它的数据变得更聪明，这些权重会随时间进行调整。\n\n\
  一个例子可能是您在找另一份工作时，职业生涯早期您可能会给薪资更高的权重。然而，随着您积累更多经验，您可能会开始给工作与生活的平衡、福利和职业发展机会等其他方面增加更多权重。\n\
  \n下图展示了一个示例神经网络：\n\n![](img/rsrcUZ.jpg)\n\n流行的深度学习 Python 库包括：\n\n1.  **TensorFlow**\n\
  2.  **Keras**\n3.  **PyTorch**\n\n**TensorFlow** 是一个用于编程深度学习神经网络的开源框架和 API，可以作为库导入\
  \ Python。它能够处理大型数据集，并在数据处理方面非常高效——这就是为什么它在数据科学和学术界越来越受欢迎的原因。\n\n**Keras** 可以运行在\
  \ `TensorFlow` 框架之上，但更适合较小的数据集和快速原型设计。您主要会在开发中试验神经网络，以及作为教导模型的试错过程的一部分遍历神经网络节点时看到它的使用。\n\
  \n**PyTorch** 最常用于自然语言处理，由 Facebook 开发。\n\n您可能会问什么是**自然语言处理 (NLP)**？它是机器学习模型解读人类语言并将其作为输入传入算法的一种方式。\n\
  \n例如，不像上一章那样向模型提供 `if-then-else` 条件和代码，您可以用人类语言向模型提问，如“基于面积，我房子的预测价格是多少？”，模型会在通过算法运行问题后返回预测结果。\n\
  \n可以想像 Amazon 的 Alexa 和 Google Home 等 AI 设备。那些都是自然语言处理的例子。\n\n\n\n\n\n## 9. 如何利用机器学习解决问题\n\
  \n既然我们已经了解了如何在 Python 中构建机器学习模型，以及不同种类的机器学习和深度学习算法，那么我们如何将它们应用到日常生活或组织中的实际问题中呢？在本章中，我将介绍一个结构化流程，指导你如何从最初的问题描述一步步走向解决该问题的机器学习模型。作为该框架的一部分，我们将涵盖以下步骤：\n\
  \n1.  确立你的用例\n2.  就项目驱动因素达成一致：时间、成本和范围\n3.  确认数据是否随时可用\n4.  确认数据质量\n5.  确认数据的可解释性\n\
  6.  可视化你的数据\n7.  为你的用例拟合合适的机器学习模型\n8.  如果你的用例允许使用监督模型，则训练你的模型\n9.  如果有真实世界数据可用，则用该数据测试模型预测的准确性\n\
  10. 将模型投入生产\n11. 迭代！\n\n## 9.1 确立你的用例\n\n此步骤涉及问题描述的构建，我建议将该问题描述构建为一个需要解决的问题或需要获得的洞察。问题越具体越好。当你试图确定哪种机器学习算法最适合你的问题时，这一步尤为关键。以下是一些供参考的用例示例：\n\
  \n1.  “基于历史通话量和季节性，夏季淡季期间我应该安排多少呼叫中心代表来处理人寿保险理赔队列？”\n2.  “基于呼叫中心通话中使用的语言和语气，该客户离开我们组织或升级投诉的可能性有多大？”\n\
  3.  “根据该客户的购买模式，他/她在未来 6 个月内可能会购买哪些额外产品？”\n\n## 9.2 就项目驱动因素达成一致：时间、成本和范围\n\n一旦你确定了问题描述，了解你在数据科学项目中面临的约束条件就变得很重要。\n\
  \n1.  如果你的项目是**时间驱动**的，它很可能需要快速解决或增量交付，以提供即时洞察\n2.  如果你的项目是**成本驱动**的，你很可能没有太多预算用于数据获取或额外资源\n\
  3.  如果你的项目是**范围或质量驱动**的，你在向客户共享结果之前，拥有额外的灵活性来真正完善你的模型和相应预测\n\n## 9.3 确认数据是否随时可用\n\
  \n视问题性质而定，数据有时可能随时可用，有时则不然。例如，如果你试图分析流感病毒的模式以为即将到来的流感季节的疫苗研发提供依据，你可能无法获得基于当前流感季节的最新数据集——这可能是由于时机问题，或数据由卫生机构提供。在这种情况下，你必须利用现有数据，并在可能的地方进行外推/做出假设。在成本或时间驱动的项目中，这种情况将成为障碍。在缺乏可执行数据的情况下，你很可能需要通过商业论证说服利益相关者，投资获取额外数据以解决问题是正确的投资决策。\n\
  \n## 9.4 确认数据质量\n\n你可能拥有海量数据，但数据质量可能不佳，即存在大量缺失、不完整或普遍难以解读的信息。在数据准备好进行分析之前，你将不得不花费大量时间进行数据清洗和处理。在许多数据科学项目中，这是最不讨好且最耗时的工作。好消息是\
  \ `Python` 拥有大量内置函数，正如我们在本书前面所演示的，它们允许你清洗数据并将其可视化，以消除异常值和空值。\n\n## 9.5 确认数据的可解释性\n\
  \n你可能拥有大量高质量数据。然而，如果组织中没人理解这些数据，你将难以进行分析或训练模型。如果你被空降到一个组织负责他们的数据科学项目，该组织极有可能拥有大量旧遗留系统，这些系统使用自己的内部编码，而关于数据及如何解读它的知识往往只存在于人们的脑海中，或属于部落知识——即仅为少数资深老员工所知，但未记录在案或广泛共享。在一个高度关注运营且无法抽调数据主题专家（SME）协助数据科学项目的组织中，这往往是一个绊脚石。通常，必须通过商业论证来争取这些\
  \ SME 的可用性，以推动数据科学项目前进。\n\n## 9.6 可视化你的数据\n\n现在你拥有了高质量、可解释的数据，并能随时联系到 SME，你已准备好分析数据，真正的乐趣由此开始！第一步是可视化数据，以观察模式、异常和离群值。这也是你开始决定哪种机器学习模型和算法最适合你的问题及数据结构的步骤。例如，正如本书前面所示，如果你发现变量之间存在直线相关性，那可能是一个简单的线性回归问题。又或者，可能是一堆未定义的数据点，你需要寻找分组和共性——这听起来像是聚类算法的工作！幸运的是，`Python`\
  \ 拥有功能强大的可视化库，如 `seaborn`，允许你在决定哪个模型最合适之前，从多个角度审视数据。\n\n## 9.7 为你的用例拟合合适的机器学习模型\n\
  \n如上所述，数据的可视化结合你的用例性质和项目驱动因素，将决定你最终选择哪个模型作为最佳拟合。这基本上就像从工具腰带中为手头的工作选择最合适的工具，或者根据你需要开球还是推杆来选择最合适的高尔夫球杆。你懂的！正如本书前面提到的并通过房屋销售示例演示的，在针对真实世界数据测试中找到能提供最高准确度的模型之前，这通常是一个反复试错的过程。\n\
  \n## 9.8 训练你的模型\n\n对于监督机器学习模型，你有机会提供带标签的数据和训练数据集，使其做好解决真实世界问题的准备。即使在无监督或深度学习模型中，随着更多数据变得可用，你也可以优化模型并调整算法。例如，在我们使用的房屋销售数据中，我们发现房屋类型和面积在推动房屋销售价格方面起了重要作用。然而，那也是一个相对较小的数据集。随着更多数据变得可用，车库数量或房屋是否有泳池等额外房屋特征可能变得更重要，模型将不得不重新训练。\n\
  \n## 9.9 测试你的模型\n\n仅构建并训练一次模型是不够的。你必须不断测试它，并持续输入新数据作为反馈循环，以确保模型准确度保持在可接受范围内。开发监控机制也是最佳实践，这样如果模型准确度或错误率超出特定阈值，就该将模型拉回绘图板进行重新训练。\n\
  \n## 9.10 将模型投入生产\n\n如果你构建的机器学习模型旨在用于组织的持续运营环境，而非一次性分析，你的最后一步是将模型训练和测试运营化和自动化。这可能涉及对基础设施的额外投资，以自动化数据流入模型，以及在准确度指标低于可接受限制时自动触发模型重新校准。\n\
  \n## 9.11 迭代！\n\n一旦你完成模型的构建和生产部署，你将从模型预测中获得新的洞察。这些预测和洞察可用于优化你的用例和问题描述。当你调整问题描述时，你将重复上述步骤，以持续更新和增强你的模型。\n\
  \n\n\n\n\n### 9.11 总结 数据科学工作流\n\n总而言之，你可以将你的数据科学工作流可视化如下：\n\n![](img/rsrcV0.jpg)\n\
  \n## 10. 结语\n\n总之，我们以 Python 简介开始了本书，并涵盖了基础知识，包括不同的数据类型和数据结构。随后我们进阶到使用基础 Python\
  \ 库（如 `Pandas` 和 `Numpy`）分析真实数据集。我们学会了可视化和探索数据，并确定了如何排除缺失值和异常值。我们还能够使用不同的算法（即线性回归和决策树回归）训练和测试两个预测模型。然后我们了解了其他的机器学习模型以及深度学习和神经网络。最后但同样重要的是，我们还介绍了如何使用机器学习算法解决问题，以及如何从用例一路走向成熟的机器学习模型。我们通过可视化的示例和插图完成了以上所有内容——利用\
  \ Python 的强大功能！希望本书能帮助你理解如何在 Python 中构建机器学习模型，并让你在实操 Python 时更有信心！请关注本系列未来的书籍，以继续你的数据科学之旅！\n\
