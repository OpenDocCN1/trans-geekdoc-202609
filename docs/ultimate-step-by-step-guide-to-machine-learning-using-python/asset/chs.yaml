  \ true\n\n现在我们准备好构建、训练和测试预测模型了！\n\n#### 7.1 线性回归模型\n\n线性回归模型假设因变量或目标变量（例如房屋销售价格）与自变量（如面积、车库数量等）之间存在线性关系。它可以用以下方程说明：\n\
  \n`Y = cX + I`\n\n其中：\n*   `Y` = 因变量，即房屋销售价格\n*   `X` = 自变量，例如面积\n*   `c` = 系数 ——\
  \ 由线性回归模型计算得出\n*   `I` = 截距 —— 同样由线性回归模型计算得出\n\n以上是简单线性回归的情况，即只有一个因变量和一个自变量。当你有多个自变量时（如在我们的案例中），我们使用下面的方程，这可以定义为多元线性回归：\n\
  \n`Y = I + (c1X1) + (c2X2) + (c3X3) + ...`\n\n我们可以按如下方式初始化、训练和测试线性回归模型：\n\n```\n\
  # Code for Linear Regression (refer to rsrcUT.jpg)\n```\n\n在上述代码快照中，我们涵盖了以下步骤：\n\
  \n1.  我们从 Scikit-Learn 库初始化了线性回归模型\n2.  然后我们使用训练数据集对模型进行拟合（或训练）\n3.  我们使用测试数据集进行预测\n\
  4.  我们使用两种方法测试模型的准确性：\n    1.  均方误差（MSE） —— 计算实际值与预测值之间的差异\n    2.  R 平方（也称为决定系数）\
  \ —— 计算数据与拟合回归线的接近程度。简单来说，就是我们的模型与数据的“拟合”程度如何。R 平方的范围是 0 到 1，负分通常表示模型拟合存在问题。在我们的案例中，测试数据的\
  \ R 平方值约为 .39。这意味着房屋销售价格约 39% 的变异是由我们之前确定的面积和房屋类型等自变量的变异所导致的\n\n#### 7.2 决策树回归模型\n\
