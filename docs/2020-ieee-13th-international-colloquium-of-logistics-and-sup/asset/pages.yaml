    **Abstract** - Globalization 4.0 opens new scenarios for the world economy, faced
    by advanced technologies and the movement of ideas, people and goods. With this
    situation of disruption, borders have new opportunities to adapt their policies
    and business processes for efficiency and security. Blockchain technology could
    help supply chain efficiency by providing a set of solutions that could offer
    new opportunities for the actors at the border (information exchange, inter-agency
    cooperation). In these challenges, countries can exploit the potential offered
    by blockchain technology for better management of the international trade environment.


    **Keywords** - Blockchain; coordinated border management; border agencies; developing
    countries.


