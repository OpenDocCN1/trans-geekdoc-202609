    # D. Implementation of Free Trade Agreements


    The main challenges and related to the effective implementation of free trade
    agreements are as follows:


    +   - Compliance with requirements/criteria, including value addition;

    - Preferential certificate of origin;

    - Exchange of information;

    - Validation.


    The blockchain technology could help overcome these problems since it will allow
    tracking of goods from the import and will, for example, on the case of these
    imports, certification in the harmonized of tariff classification [10], their
    origin, the cost of processing and value addition, etc.


    All actors, including customers and other public members of the blockchain platform
    will have full visibility on the data. Under conditions, even certification of
    origin for preferential treatments may not be necessary. This arrangement refers
    to the establishment of Mutual Recognition Agreements (MRAs) [11] for Authorized
    Economic Operator (AEO) programs


    # E. Implementation of Authorized Economic Operators


    The growing number of MRAs in the AEO programs, their implementation may be disrupted
    by certain difficulties.


    +   - Securing the AEO master data with MRA partner customers administrations,
    including the real time sharing of changes in AEO status;

    - Effective identification of AEOs by MRA partner customs administrations, greatly
    needed.


    The blockchain can help overcome some of these difficulties by a reliable and
    secure sharing of and an "authorized" blockchain which can contribute to an efficient
    and transparent implementation of AEO programs.


    The blockchain technology can also provide a distributed platform for the AEO
    certification process and the implementation of MRAs, then, opening up the possibility
    of recording and sharing transactions according to a protocol agreed between members
    and AEOs, with each transaction secured and protected by an unbroken audit process
    [13]


    The technology of blockchain can also facilitate the recognition of controls.


    # F. Transit


    With regard to transit, several problems arise. Each country has its own system
    for customs declarations. A reconciliation of the data entry declaration made
    at the customs of exit with the data transit exit declaration made at the customs
    of entry is necessary. This reconciliation and exchange of bilateral between national
    transit systems, as well as a manual procedure [14]


    The application of the distributed blockchain registry for national transit systems
    would allow reconciliation of sharing the register of transit data through the
    blockchain technology, the sending of messages between customs offices could be
    necessary, reducing those of the manual work of sending messages. This would save
    time and reduce the risk of errors for companies.


    # G. Identity management


    The blockchain technology could be very useful in managing the identities of various
    actors and customers in a supply chain (especially in an e-commerce environment),
    improving the quality and security of service.


    This technology will eliminate the need for intermediary to identify the companies
    of parties and consolidate multiple identities (e.g, unique identity, business
    identification number) into a single number that would be recognized by the government-business
    ecosystem, in a single window environment.


    # H. Revenue collection


    The blockchain collection could allow any intermediary in the supply chain collect
    revenue on behalf of buyers through smart contracts, offer the possibility of
    automatic transfer of duties and taxes to the respective authorities. This could
    be used when implementing new methods for revenue collection on small scale or
    by the seller or in an e-commerce environment.


    The lack of transparency in the supply chain raises concerns, including the possibility
    that the price paid may not accurately reflect the true value of goods and revenue
    implications. In this case, the undervaluation and mismanagement could be addressed
    with greater transparency in a blockchain.


    # I. Compliance management and traceability


    The blockchain could indicate the source of the data, reduce fraud and improve
    visibility in the supply chain by allowing, for example, to access commercial
    documents, starting with the initial purchase order between the two parties [15].


    It can also reduce and eliminate risks related to food safety, counterfeit goods,
    forced labor, child labor, corruption,'
