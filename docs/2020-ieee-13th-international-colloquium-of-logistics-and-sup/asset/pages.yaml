    # II. BLOCKCHAINS IN THE PROCESSES OF COORDINATED BORDER MANAGEMENT


    Harnessing the potential of blockchains for process integrity and data quality,
    and requires appropriate policy. International supply chain actors can play a
    significant role in defining policy and frameworks to address emerging challenges
    and facilitate a transparent, fair and stable regulatory environment for the development
    and use of blockchains.


    In 2018, blockchain initiatives have emerged in the shipping industry. One is
    the joint-venture TradeLens which was launched by Maersk and IBM in early 2018.
    In November, nine customs and terminal operators joined forces to create the Global
    Shipping Network [4].


    The current international trading events face various challenges.


    In addition, several initiatives and pilot projects have already been launched
    by the private sector and some customs administrations for the use of blockchain
    for end-to-end supply chain management and border controls process.


    +   - Regulatory challenges: Various traditional trade laws, including customs
    rules, need to be adapted to provide provisions that permit and regulate the use
    of blockchains. It will be necessary to determine which node can be held responsible
    for compliance and how. In other, who will ultimately be responsible for the accuracy
    and timely availability of data and documents to government?


    Blockchain technology has the potential to increase supply chain efficiency by
    reducing intermediaries and manual tasks, but also by increasing certainty and
    predictability through real-time data availability to actors in a supply chain.
    Real-time availability end-to-end transparency and visibility, enhancing supply
    chain security and compliance.


    +   - Operational challenges: Inappropriate use of blockchain strings (including
    encryption) for illicit trade, evasion of duties and taxes, intellectual property
    rights infringements, money laundering and other forms of financial crime.


    Blockchain solutions could provide new opportunities for border agencies to access
    more varied and reliable data from different supply chain actors. This shared
    data could be used to supplement the settlement of data/customs declaration as
    provided by any inhabitant of an international transaction, and could potentially
    eliminate the need for supporting documentation (Table 1).


    Technological challenges: The implementation of interfaces between various processes
    and activities based on them, is increasingly problematic. The question is how
    to ensure a seamless integration between decentralized and centralized processing.


