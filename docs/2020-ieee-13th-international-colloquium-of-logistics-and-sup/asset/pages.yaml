    participants in a network of blockchains, called validators or nodes. Indeed,
    the blockchain-based approach interactions between actors without the intervention
    of a central authority, proves to be reliable and reduces costs [2].


    Among the characteristics of the blockchain we use:


    +   * **Distributed**: The technology operates on a distributed, not centralized,
    platform where each participant (node) has access to same registries.

    * **Trust**: The blockchain technology establishes "trust" between third parties,
    allowing them to conduct business transactions and exchange information without
    intermediaries, ensuring data integrity and leaving a complete audit trail.

    * **Immutability**: Transactions are verified and approved by consensus among
    participants, making fraud impossible.

    * **Traceability**: The chronology of all transactions from the source is tracked,
    allowing everyone (with access), including regulatory authorities, to follow or
    review previous transactions.


