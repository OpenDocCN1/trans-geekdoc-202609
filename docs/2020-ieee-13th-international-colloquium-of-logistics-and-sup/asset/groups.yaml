    # 第13届国际物流与供应链管理研讨会 - LOGISTICA 2020 - 12月02-04日

    HST (EST) - 摩洛哥西迪本阿杜拉大学


    ## 区块链对发展中国家协调边境管理的潜力


    Mohamed ANOUCHE

    管理科学博士研究员

    组织管理、商业法与可持续发展研究实验室

    法律、经济和社会科学学院 - Souissi

    拉巴特穆哈默德五世大学 - 摩洛哥王国

    电子邮箱：address.anouche@um5.net


    Youssef BOUMAZ

    经济学博士生

    国际贸易监管与摩洛哥外贸研究小组

    法律、经济和社会科学学院 - Souissi

    拉巴特穆哈默德五世大学 - 摩洛哥王国

    电子邮箱：you.boumaaz@um5.net


    **摘要** - 全球化4.0 为世界经济开辟了新局面，面临着先进技术以及思想、人员和货物的流动。在这一动荡的背景下，边境拥有新的机会来调整其政策和业务流程，以提高效率和安全性。区块链技术通过提供一系列解决方案，可以为边境参与者提供新的机会（信息交换、机构间合作），帮助提高供应链效率。在这些挑战中，各国可以利用区块链技术提供的潜力，以更好地管理国际贸易环境。


    **关键词** - 区块链；协调边境管理；边境机构；发展中国家。


    区块链是一种复杂的加密分布式账本 [1]。


    ![](img/daeb56ceae0ec2933fbc567871dc1d78_0_0.png)


    | 传统中心化账本 | 分布式账本 |

    | --- | --- |

    | 中央服务器数据 | 数据 |

    | | 数据 |


    来源：E. Ganne, "区块链是否能彻底改变国际贸易", 世界贸易组织，2018年，第6页。


    目前该技术最广泛的应用是用于加密货币，这让人联想到互联网最初用于电子邮件的时期。区块链技术，凭借这种


    尽管区块链最初是为了金融目的而设计的，但分布式技术可以作为许多有用应用的基础，包括信息管理和处理。这些特征可以被应用于国际供应链管理中。


    因此，本研究将尝试回答以下问题：区块链技术如何转型一个国家的协调边境管理流程，以实现国际贸易的控制与促进目标？它对发展中国家能做出什么贡献？以及数据登记请求。


    本文由三个主要轴组成，为更全球化的思考提供材料：


    区块链技术可用于海关和其他边境监管机构的业务流程，通过区块链验证国际供应链中各种参与者的交易，在区块链中，角色、规则和激励机制将被明确定义。它可以作为一种重要工具提供复杂问题的解决方案，简化并共享独立方之间的信息，这有助于确保供应链的透明度并保持端到端。


    - 协调边境管理流程中的区块链；

    - 边境控制和管理机构使用区块链的可能性；

    - 在协调边境管理中使用区块链的前瞻性策略。


    # II. 协调边境管理流程中的区块链


    利用区块链在流程完整性和数据质量方面的潜力需要适当的政策。国际供应链参与者可以在定义政策和框架方面发挥重要作用，以应对新兴挑战，并为区块链的发展和使用营造一个透明、公平和稳定的监管环境。


    2018年，区块链倡议在航运业兴起。其中一个是马士基（Maersk）和IBM于2018年初推出的合资企业TradeLens。11月，九家海关和码头运营商联手创建了“全球航运网络”（Global
    Shipping Network）[4]。


    当前的国际贸易事件面临着各种挑战。


    此外，私营部门和一些海关当局已经启动了若干倡议和试点项目，将区块链用于端到端供应链管理和边界控制。


    - 监管挑战：各种传统的贸易法（包括海关规则）需要调整，以提供允许和规范使用区块链的规定。有必要确定哪个节点应对合规性负责以及如何负责。另一方面，最终谁对提交给政府的数据和文件的准确性和及时性负责？


    区块链技术具有通过减少中间环节和手动任务来提高供应链效率的潜力，还可以通过向供应链参与者提供实时可用数据来增加确定性和可预测性。实时可用实现了端到端的透明度和可见性，增强了供应链的安全性和合规性。


    - 运营挑战：不当利用区块链链（包括加密）进行非法贸易、逃避税收、知识产权侵权、洗钱或其他形式的金融犯罪。


    区块链解决方案可以为边境机构提供新机会，从不同的供应链参与者处获取更多化且可靠的数据。这些共享数据可用于补充任何国际交易参与者所提供的数据/海关申报结算，并可能消除对支持性文件的需求（表1）。


    - 技术挑战：基于这些各种流程和活动的接口实现变得日益棘手。问题在于如何确保去中心化与中心化处理之间的无缝整合。


    # 表 I 国际贸易中的标准文件


    | 销售和商业文件 | 商业发票 | 装箱单 |

    |---|---|---|

    | 信用证 | 保险单 | 原产地证书 |

    | 关值申报 | 出口许可证 | 提单 |

    | 交货单 | 舱单 | 货物状态 |

    | 入口港申报 | 海关申报 | 进口证书 |


    来源：参考 A. E. Ganne, "区块链正在改变贸易吗?", 世界贸易组织，2018年，第18页。


    编码账本对于涉及大量参与者的各种业务流程可能非常有前景。它允许任何类型的数据被快速加密，并由区块链网络成员（称为验证者或节点）对该更改或交易进行实时、可靠且不可否认的记录。事实上，基于区块链的在没有中央权威干预的情况下的互动被证明是可靠的并降低了成本
    [2]。


    我们使用的区块链特征包括：


    - **分布式**：该技术运行在分布式而非中心化的平台上，每个参与者（节点）都可以访问相同的账本。

    - **信任**：区块链技术在第三方之间建立了信任，允许他们在没有中介的情况下进行业务交易和信息交换，确保数据完整性并留下完整的审计追踪。

    - **不可篡改性**：交易通过参与者的共识进行验证和批准，使欺诈变得不可能。

    - **可追溯性**：从源头的所有交易时间顺序被追踪，允许所有拥有访问权限的人（包括监管机构）跟踪或审查之前的交易。

    '
