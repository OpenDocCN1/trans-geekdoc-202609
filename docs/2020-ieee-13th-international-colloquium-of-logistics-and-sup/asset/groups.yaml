    +   - **Blockchain**: A blockchain with a fingerprint has become an everyday procedure
    for many. In the future, personal data will be stored by means of blockchain.
    To some extent, this technology is already being used to control the cross-border
    movement of belongings, but its potential has yet to be de-mystified.


    +   - **Robotics**: This technology area involves the design, construction and
    operation of robots. Robots with increased capabilities, senses, dexterity and
    intelligence can take tasks that are considered too difficult for humans to perform.
    Expected to reach the next level, with a greater focus on content creation and
    other tasks that are reserved for humans. Today, some administrations such as
    the Customs Administration of China, for example, use robotics applications in
    their work [2].


    Virtual Reality: Samsung is probably the most widespread example of how virtual
    reality works. Much work remain to be done to determine the possibilities of using
    virtual reality, but one of its applications around the world is, perhaps the
    physical experience of goods from a distance.


    # V. CONCLUSION


    The blockchain technology presents opportunities for the working methods of the
    border agencies. It is essential for developing countries to make choices about
    technologies that are relevant to their environment and to prepare them accordingly.


    The potential of these technologies could be considerable, although the challenges
    for their impact are not. While developing countries expect have these technologies
    to help the global economy, there will be a significant shortfall in efficiency,
    including economic and administrative efficiencies, compared to developed countries
    that must made.


    How benefits of these technologies have not been fully identified. It is important
    to continue exploratory work and research on these technologies and gather more
    information on them, benefits, risks, and role in the supply chain.


    The exploratory path may show other things, sight of the links between various
    disruptive technologies and a more comprehensive approach to how they can support
    coordinated border management activities.


