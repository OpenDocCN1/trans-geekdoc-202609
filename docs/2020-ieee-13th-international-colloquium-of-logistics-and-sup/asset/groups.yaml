    # IV. FORWARD-LOOKING STRATEGY FOR USE OF BLOCKCHAINS IN COORDINATED BORDER MANAGEMENT


    After reviewing the possibilities for use of blockchain technology by agencies,
    it is necessary to consider a strategy for using blockchain in the environment
    of border control.


    Indeed, although created for very special purposes, there are multiple initiatives
    in areas of blockchain that are operating on different platforms and with different
    structures. The approach introducing this blockchain technology could lead to
    the creation of "islands of blockchains", which would result in fragmentation
    and disconnection of blockchain platforms at the level of border agents [40].


    # B. Data Standardization


    The questions are what kind of standardized development of blockchain technology
    should be considered by customs administrations.


    One of the major issues in the blockchain is the difficulty of data quality in
    a distributed registry environment, where each agency might initiate a transaction
    and customize the corresponding data elements.


    This issue of data quality becomes more acute when the actor in a supply chain
    can insert data, in a standardized way. Customs administrations must examine and
    work under the issues of definitions, interoperation and data quality in the blockchain
    environment [19].


    As in this example, the Open Data Alliance (OADA) is working to establish standards
    for agricultural data collection and analysis processes. It learns that blockchain
    technology can help improve networking, security, and web data. The OADA will
    help establish standards for application programming interfaces that can use for
    sharing.


    Collaboration in this domain could help initiate exploratory work on standardizing
    data elements of the supply chain.


    # A. Interoperability


    Standardized development of blockchains will contribute to interoperability between
    them and within, to ensure connectivity/integration with the information systems
    of border agencies for data access.


    In 2018, one of the largest organizations (Ethereum and Hyperledger) joined forces
    to facilitate the creation of blockchain-based business tools. The Ethereum Alliance
    (EEA) is a global standards organization promoting the adoption of distributed
    general ledger technology. Hyperledger is an open source blockchain initiative
    designed to help companies build and adopt blockchain tools [18].


    The EEA-Hyperledger partnership is expected to provide a wide range of resources
    to be used in the development of blockchain-based tools, and greater assurance
    of compatibility between all these tools.


    # C. Governance Model


    The blockchain environment will theoretically involve many actors. In order to
    meet their interests, a governance mechanism must be in place. This should clearly
    explain the functions and responsibilities, ensure effective coordination, and
    define the rules and standards of the blockchain (source code) application. Within
    this framework, each modification of the chain must be transparent to the decision-making
    processes defined in a governance framework.


    Also, the different types of blockchains implemented require an enhanced governance
    approach to include related information and communication technologies.


