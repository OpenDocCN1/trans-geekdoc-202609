    # III. THE POSSIBILITIES OF USING THE BLOCKCHAIN BY THE ORGANIZATIONS PRESENT
    AT THE BORDERS


    update It. As a border, agencies can obtain accurate data from the direct source:


    Given the global security environment and the renewed interest in trade facilitation
    brought by the implementation of the World Trade Organization Agreement [7], the
    need for more cooperation between different governments is more evident including
    customs, with new opportunities to share information and resources using a common
    and distributed technical platform, in a single window environment without borders.
    South Korea is illustrative in this context where projects have been launched
    since 2017 to identify many technical and institutional challenges and how to
    integrate the blockchain technology into customs systems [8]


    # A. Customs declaration and customs


    In the case of customs declarations, the advantages of using the blockchain can
    be seen at several levels:


    +   - Reliability: The creation of customs declarations is an extremely complex
    task that involves a variety of activities. The (often manual) collection of information
    from various stakeholders and various documents such as sales data, product information
    and manufacturing poses many challenges. Due to the outsourcing of services and
    the distribution of data sources, this process is cumbersome and carries a risk
    of inaccuracy. In many cases, it requires a third party to manage the customs
    declarations.

    - Simplicity: The use of blockchain technology could contribute to the elimination
    of supervising documents required for goods or cargo declarations, which are considered
    tedious. In a blockchain environment having a variety of supply chain data be
    brought in real-time data elements not specifically found in a traditional customs
    declaration and thus enhance the accuracy of risk analysis, risk management and
    targeted customs and other government agencies.


    The blockchain can help to collect all the necessary order, preparation and sharing
    information in a common registry. Border authorities could automatically obtain
    information from key sources for purposes, providing transparency and high quality
    data.


    In a rapidly globalizing world, this technology could also streamline border exchange
    between customs and tax authorities for a more harmonized revenue collection,
    auditing, risk management, customs valuation and tariff pricing.


    +   - Time saving: For businesses, the work required to properly consolidate the
    information as asked by customs will be reduced. For customs authorities, the
    manual checks and resources to validate declarations will also be limited. Consequently,
    this will generate faster processes of customs declarations and reduced processing
    time.


    # B. Electronic exchange of preliminary Information: Cooperation among borders


    Receiving and sharing electronic information presents several challenges. These
    challenges include data quality, submission of data out of time, and the introduction,
    whether deliberate or not, errors due to the vast users.


    Some of these difficulties can be overcome through blockchain technology. Sharing
    data reliably and securely through authorization. Blockchains can contribute to
    an end-to-end "pipeline". Such a blockchain can be managed by a supply consortium.
    All participants can participate and see


    # C. Electronic certification: Verification of regulatory requirements


    Customs must meet various requirements such as meeting criteria. Concerns about
    product quality and safety have led to a tightening of certification requirements.
    Licenses, certificates and other authorizations may now be required for border
    crossings depending on the nature of the goods and the results related to the
    exporter and the importer.


    Several parts of the data are required, relating to the certification of product
    components. In addition, various stakeholders are involved in a number of activities
    related to product information. Examples include authorities, manufacturers, regulators
    and consumers. However, this information is not shared between the parties involved,
    leading to repeated collection of information and the necessary certifications
    and validations.


    The blockchain can help solve some of these challenges through centralized management
    of product lifecycle. All authorities, laboratories, supply chain actors, regulators
    and consumers can work together in sharing data on the origins of goods, allowing
    all stakeholders to access all relevant information.


    Furthermore, the blockchain technology offers the possibility to implement more
    efficient, secure and reliable electronic certification of licenses. Certificates
    and other authorizations are based on the digital physics of the electronic certificate.
    It ensures that a certificate is issued and validated by a valid electronic signature
    from a regulatory body/issuer and, at the same time, it can prevent any alteration/manipulation
