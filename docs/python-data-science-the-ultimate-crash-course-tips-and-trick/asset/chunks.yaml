    # Chapter 8: Your Complete Course to Working with the Pandas Library


    One of the best libraries that you can depend on when it comes to handling data
    science, especially when you are relying on the `Python` language to help you
    out, is the `Pandas` library. This is going to be a fantastic library to work
    with for data science because it is able to handle each and every part. It can
    take you through all of the life cycles of data science that we talked about before,
    making it much easier for you to handle your data, get it organized and ready
    to go and to ensure that you will be able to take on the analysis and the visualizations
    as they are needed. To help us to get started, we need to take a few minutes to
    learn more about the `Pandas` library and what it all entails. `Pandas` are considered
    an open-sourced package from `Python` that is going to provide us with many of
    the tools that are needed to complete any data analysis that we would like. This
    package also comes with a few different types of data structures that we can learn
    about and then use for many of the different tasks of manipulating data as needed.
    For someone who is wanting to sort through data and get it all done in a quick
    and orderly fashion while learning the insights and the predictions that are in
    that data, this is the best library for you. In addition to many of the tasks
    that we have taken some time to learn about above, the `Pandas` library is also
    going to provide us with many methods that programmers can use when they want
    to handle their own data analysis. This is always a good thing in the process
    of data science, and `Pandas` is sure to be the library that you run to when you
    have a big project in data science, and you want to make sure that it is done
    right. While we are here and talking about the `Pandas` library, it is important
    that we stop and take a look at some of the advantages that programmers are going
    to notice when they decide to use this library over some of the others. This library
    is definitely one of the best options to consider learning and have around for
    almost any of the data science projects that you would like to focus on, so at
    least learning how it works, and some of the coding that is necessary to ensure
    that it behaves the way that it should it be going to be really helpful with your
    own projects.


    ## Advantages of Pandas


    Some of the various advantages that data scientists are going to be able to enjoy
    when working with `Pandas` includes:


    1. It is going to take the data that you have and present it in a manner that
    is suitable for analyzing the large amounts of data that you have. This data analysis
    is going to be completed in `Pandas` with the use of the `DataFrame` and the `Series`
    data structures.

    2. You will find that the `Pandas` package is going to come with many methods
    to help us filter through our data in a convenient manner while seeing some great
    results.

    3. `Pandas` also come with a variety of utilities that are going to help us when
    it is time to perform the input and output operations in a manner that is quick
    and seamless. In addition, `Pandas` is able to read data that comes in a variety
    of formats, which is very important in data science, such as `Excel`, `TSV`, and
    `CSV` to name a few.


    You will find that `Pandas` is really going to change up the game and how you
    do some coding when it comes to analyzing the data a company has with `Python`.
    In fact, it is often the most used, and the most preferred tool in data wrangling
    and munging (we will look at how to do this more in the next chapter) in the `Python`
    language and elsewhere as well. `Pandas` are going to be free to use and open
    source and were meant to be used by anyone who is looking to handle the data they
    have in a safe, fast, and effective manner. As we mentioned above, there are actually
    quite a few `Python` libraries out there that we are able to use, and some of
    them are going to be great for data science as well. But there are many data scientists,
    and the companies they work for, who like to rely on `Pandas` because of the many
    benefits, the fact that it can handle all of your projects, and all of the neat
    features.


    ## Core Concepts


    One thing that you may find as really cool about this library is that it is able
    to take some of your data, whether this data comes from a database, a `CSV` or
    `TSV` file, and then it can take the information that we are able to find in that
    file and turn it into an object in `Python`. This is going to be changed a bit
    over the different rows and columns and we are going to refer back to it as a
    `DataFrame`. But it is going to look pretty similar to what we are used to seeing
    with an `Excel` kind of table. Now, if this is not the first time that you have
    done any coding before, especially if you have worked with the `R` programming
    language before, then the objects that you create here are going to share some
    similarities to what we see with `R` as well. And these objects are going to make
    it so much easier for us to do our work, especially when we want to get it all
    done without any `list` comprehension or `dictionaries` in the process. Loops
    are an important part of the `Python` code that we are not going to have a lot
    of time to discuss and look over in this guidebook, but they help us to get the
    compiler to read through the same part of the code. These are great, but sometimes
    with our data analysis the loops are going to be a bit chunky and will take up
    more space than we would like. And sometimes they are just too much to handle.
    Working with the idea of objects in the code and how these can handle the `Python`
    parts that we would like can help us to get the same thing done in the coding
    without quite as much mess.


    ## Installation


    For the most part here though, you will find that it is often best if you take
    the time to download the `Pandas` library, and you should do this at the same
    time that you download your `Python` library especially if your main goal is to
    go through and work on a data science project in the end. If you already have
    the `Python` language ready to go on your computer though, and then later decide
    to work with data science and the `Pandas` library, then this is still a pretty
    easy process to work with for many programmers. The best way to download the `Pandas`
    library for this method is to go to the [www.pandas.org](http://www.pandas.org)
    website and then look for the version that goes with your operating system. It
    will only take a few minutes to download the `Pandas` library, and then you will
    be able to use all of the functionality that comes with it as well here. Once
    you have taken the time to get the `Pandas` library downloaded on your computer,
    it is time to learn a bit more about some of the steps and the process involved
    in getting this to work. You will find that once we get into this library and
    learn some of the basics of coding with it, it can be a fun language with all
    of the features and capabilities that come with it. Plus, when you learn how to
    use this kind of language, it is going to make it easier to complete the data
    analysis that you would like. At this point, we have the `Pandas` library downloaded
    and ready to use, and now it is time to focus on what kind of steps need to happen
    in order to load up the data that we want, and even save that data, before we
    try to use `Pandas` to run the data through those algorithms we plan to make.


    ## Loading Data with Pandas


    When it is time to work with `Pandas` to take that data that you have collected
    and learned from it, we have to remember that there are going to be three main
    methods that `Pandas` allows us to use to get all of this done. These three methods
    are pretty simple to work with, and will include:


    1. You can convert a `NumPy` array, a `Python` `list` or a `Python` `dictionary`
    over to the `DataFrame` that is available with `Pandas`.

    2. You can open up a local file that is found on your computer with the help of
    `Pandas`. This is often going to be something like a `CSV` file, but it is possible
    that it could be something else like `Excel` or a delimited text file in some
    cases.

