    ## Introduction

    Congratulations on purchasing Python Data Science and thank you for doing so.
    The following chapters will discuss everything that we need to know in order to
    get started with the process of data science and using it for our own needs as
    well. There is a lot of buzz in the business world, no matter what industry it
    is, about machine learning, the Python language, and of course, data science,
    and being able to put these terms together and learn how they work can make a
    big difference in how well your business will do now and in the future. There
    are already a ton of companies out there who have been able to gain a competitive
    edge with data science and the various models and algorithms of Python that go
    with it, and you can as well. In this guidebook, we are going to take some time
    to explore the different parts that come with Python data science. We will start
    out with some information on what data science is all about and how it can be
    so beneficial to your business and helping you to gain that competitive edge that
    you have always wanted. From there, we are going to spend some time exploring
    the Python language and how this can fit into the world of data science. We will
    look at some of the basics of the Python coding language, why we should work with
    Python to help with our data science project and the basic libraries that work
    with Python and can help us to create some of the models that we need. After we
    have an introduction to both Python and data science, it is time to move on to
    some more of the parts that we need to know in order to work on our own data science
    project. We are going to explore the basics of the data life cycle to see how
    this is going to fit into our plan. From gathering the raw data to organizing
    and cleaning it, to finally being able to analyze the data and learn some of the
    insights and hidden patterns that we want, this data life cycle is going to be
    so important to our overall goals. In addition to learning about the data life
    cycle and what this means for some of our processes, we need to move on to some
    of the basics of data mining and how this process works, as well as looking at
    how we can use the Python coding language to handle some problems of regression,
    to help us see exactly how data science is going to work for our needs. We can
    then finish up with a look at the Pandas library, one of the best libraries out
    there to help us out with machine learning, and a summary of some of the ways
    that we are able to use all of that data that we have collected, and the steps
    that we are doing in this process, in order to make some of the best business
    decisions that we can. All of this is going to come together in order to strengthen
    our business and ensure that we are getting the results that we want in every
    aspect of that business as well. When you are ready to learn more about Python
    data science and what it is able to do for you and your business, make sure to
    check out this guidebook to get started.


    There are plenty of books on this subject on the market, thanks again for choosing
