    ## 可视化分布


    ```python

    fig = plt.figure(figsize=(12, 6))

    sqft = fig.add_subplot(121)

    cost = fig.add_subplot(122)

    sqft.hist(df.sqft_living, bins=80)

    sqft.set_xlabel(''Ft²'')

    sqft.set_title("Histogram of House Square Footage")

    cost.hist(df.price, bins=80)

    cost.set_xlabel(''Price ($)'')

    cost.set_title("Histogram of Housing Prices")

    plt.show()

    ```


    在上面所做的编码中，我们使用了 `matplotlib` 来帮助我们打印出两个不同的直方图。请继续操作，看看这些直方图在你的编译器中会是什么样子。它们将向我们展示房屋价格的分布与每栋房屋的平方英尺相比。我们在这里会发现，两个变量的分布都向右偏斜，尽管一个比另一个更严重。这将使我们对正在处理的数据集有一个很好的了解，我们也更了解我们想要测量的变量的分布。有了所有这些，我们就可以继续进行回归分析，了解更多信息以及它如何帮助我们。


    ## OLS 回归分析


    首先，我们需要导入 stats models 以获取最小二乘回归估计函数。我们在这里使用的模块被称为普通最小二乘法，它将承担在 Python 回归中计算我们需要的数字的大部分工作。使这一过程发生的代码将包括以下内容：


    ```python

    In [15]: import statsmodels.api as sm

    from statsmodels.formula.API import ols

    ```


    当你用 `OLS` 编写代码来生成仅有两个变量的线性回归摘要时，你将使用以下公式：


    ```python

    Reg = ols(''Dependent variable ~ independent variable(s)'', dataframe).fit()

    print(Reg.summary())

    ```


    当我们查看金县房屋的价格和房屋的平方英尺时，我们打印出以下摘要报告：


    ```python

    In [16]: m = ols(''price ~ sqft_living'', df).fit()

    print(m.summary())

    ```


    当我们花几分钟打印出此回归所需的摘要时，与我们的问题相关的所有信息都很容易找到。这将包括相关系数、标准误差、t 统计量、R 平方等。查看从中获得的输出，很明显市场上房屋价格与房屋平方英尺之间存在巨大的关系。当你浏览时，你还会发现过程中也出现了相当大的幅度。例如，每次我们在房屋中增加额外的
    100 平方英尺时，我们会发现该房屋的价格平均会高出约 $28,000 美元。根据我们希望用这种程序做什么，很容易调整此公式以包含一个以上的独立变量。


    正如我们所见，在 Python 中处理回归问题并利用它帮助我们梳理数据并了解此过程的工作方式，对我们来说在许多方面都是有益的。在上面的示例中，我们花时间查看特定市场房屋价格与房屋中平方英尺数量之间的相关性。但无论我们的业务问题是什么，或我们希望如何处理这种数据科学流程，我们都可以使用同样的思路。


