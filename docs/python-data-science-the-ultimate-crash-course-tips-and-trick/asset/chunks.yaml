- raw: 'Chapter 5: The Basics for the Data Life Cycle One of the most important things
    that we are able to do when it is time to combine data science and Python together
    into one is learning a bit more about the data life cycle. There are a lot of
    steps that we need to take before we are able to take our data and actually learn
    something from it. Many people and companies who want to get into the process
    of using their data to make decisions assume that they can just look around for
    a bit of data, and then find the insights all at once . As we are going to explore
    in this chapter, there are actually a number of steps that need to be taken in
    order to actually gain the insights that you would like from all of that data
    you were able to collect. This is a process that takes some time, and sometimes
    it is not as simple or as quick as we would like. However, taking your time and
    going through all of the steps that we are going to talk about in this chapter
    will make a world of difference when it comes to the results that you are able
    to get. Let’s take a look at some of the main steps that companies need to follow
    in the life cycle of their data to ensure they get the best results possible :
    Gathering our Data The first thing that we need to do is go and find all of that
    data that we would like to use in the first place. This is going to be a critical
    step because we are not going to be able to create a model and learn a lot of
    the predictions and the insights that we would like if there isn’t any data for
    us to sort through in the first place. This is a very important step to take because
    it ensures that we not only have a lot of data, but we also have the data that
    we would like to use to really find the answers to our biggest questions. To start
    with, we need to be able to go through and figure out what business question we
    would like to have answered. We are not just randomly looking through some of
    the data that is there and hoping that we can figure out something. We have way
    too much data to sort through when it comes to this, and it is not going to end
    well for us if we are doing this. Instead, we need to spend some time thinking
    about what our biggest business problems are, and what we would like to gain when
    we go through this data . Each company is going to have their own ideas when it
    comes to gathering the data and getting things set up here. The biggest business
    problem for you may not be the same challenge that another company is going through.
    So, make sure that you take a look at your own business and figure out what you
    would like to improve. Do you want to reach your customers better or give them
    a better experience? Do you want to reduce waste and increase your profits? Do
    you want to find a new demographic or niche that you would like to enter? These
    are all things that you are able to consider when it is time to start looking
    at the business problem you would like to fix, and when it is time to look through
    your data for answers . In this step, we are going to get busy doing some research.
    We need to spend some time looking for some of the information that you would
    like to do. There are a lot of different places where you are able to look for
    the data, but it is going to depend on what business problem you would like to
    be able to solve. You may find that looking on social media, checking out the
    responses that you have gotten from customers in the past, looking at surveys,
    and more can be a great way to help you to see the results that you would like.
    During this time, we also need to do some assessing as well. It is important to
    know whether you already have the right kinds of resources to take on this project,
    or if there is something that you are missing and need to fill in ahead of time.
    you will need to assess whether you have the right resources in terms of people,
    time, data, and technology to help support that new project that you want to work
    with. in this phase, you may find that it is time to frame the business problem
    that you have, and then formulate the IH or initial hypotheses that you would
    like to work with . Preparing the Data The next thing that we need to spend some
    time on is preparing the data that we want to use. It is likely that you went
    through and collected the data that is going to be used in your model and some
    of your decisions, later on, are going to come from a variety of sources. And
    this is going to make things messy. The results that you get from a survey that
    you sent out are going to be different compared to the results that you get from
    your social media account. Both of these can be really useful when it is time
    to work with data science, but they are going to present a few challenges to you,
    and this does mean that we need to be able to prepare the data and get it all
    cleaned and organized ahead of time to avoid confusion and to ensure that our
    model is able to handle it . During this particular phase, we are going to need
