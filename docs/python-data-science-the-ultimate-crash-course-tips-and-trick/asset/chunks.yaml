    # Python 数据科学和机器学习库


    这种语言还具备一些功能，可以帮助我们创建标签、图例和网格，以及其他一些格式化元素来帮助我们获得想要的可视化效果。这就是该库如此精妙之处，我们能够在其中自定义我们想要的一切，以获得所需的视觉效果。


    ## Scikit-Learn

    `Scikit-Learn` 将是一个额外的包，你可以与我们之前谈到的 `SciPy` 堆栈一起获取。它旨在帮助我们完成一些特定功能，如图像处理和机器学习的实现。
    就两者中的后者而言，与所有其他库相比，最突出的将是这个库。它也是建立在 `SciPy` 之上的，并且在日常使用中会大量使用 `SciPy` 提供的数学运算。
    这个包是一个很好的工作选择，因为它可以提供简洁且一致的接口，供程序员在需要使用最常见的机器学习算法时使用。这将使将机器学习引入生产系统变得简单。该库能够将高质量的代码和良好的文档结合在一起，从而实现高性能和易用性，并且在
    `Python` 中进行任何机器学习需求时，它是行业标准之一。


    ## Theano

    `Theano` 是我们接下来可以查看的库，它将更多地关注一个被称为深度学习的过程，而不仅仅是机器学习。 `Theano` 将是一个来自 `Python`
    的包，它将定义一些多维数组，类似于我们在上面的 `NumPy` 库中看到的那样，以及一些数学运算和表达式。这个特定的库是编译的，这确保了它能够在你选择的任何架构上尽可能高效地运行。它最初是由蒙特利尔大学的机器学习小组开发的，并将帮助我们处理想要在机器学习中完成的许多应用程序。
    在使用这个库时，我们需要关注的最重要的一点是 `Theano` 能够与 `NumPy` 库在一些低级操作上紧密集成。该库还将在你工作时优化 CPU 和 GPU
    的使用，这确保了我们在数据密集型计算中看到的性能比以前更快。该库带来的稳定性和效率将使我们能够获得更精确的结果，即使在谈论较小的值时也是如此。


    ## TensorFlow

    我们不能在不查看 `TensorFlow` 库的情况下结束关于 `Python` 语言提供的不同库的讨论。这是一个特殊的库，因为它是由 Google 开发的，并且是一个开源的数据流图计算库，等等，这些都被打磨以确保它们能完成我们想要的机器学习工作。最初，这个库是为满足
    Google 环境日常需要处理的高度需求而设计的。此外，我们会发现这个库非常适合帮助我们进行神经网络的训练，而神经网络是我们处理数据和通过系统做出决策时能够使用的最佳机器学习算法类型之一。然而，我们必须记住
    `TensorFlow` 并不是严格用于 Google 内部的科学用途。它具有足够的强大功能，并且被认为足够通用，可以帮助我们处理许多现实世界的应用。我们在使用这个库时可以关注的一个关键特性是它具有多层节点系统。这是一个很好的工作特性，因为它将使我们能够快速训练人工神经网络，即使在处理非常大的数据集时也是如此。这将帮助我们创建许多优秀的算法和模型。例如，这种类型的库已经帮助我们实现了
    Google 的语音识别和从图片中识别物体等功能。


    ## Keras

    并且本指南中我们要查看的最后一个库是 `Keras` 库。这将是一个很棒的开源库，它将再次帮助我们处理该语言中想要处理的神经网络，尤其是更高层的神经网络，并且它也是用
    `Python` 编写的以便于使用。我们会发现，就 `Keras` 库而言，整个东西相当易于使用且极简主义，具有一些高级可扩展性来帮助我们。它将使用 `TensorFlow`
    或 `Theano` 库作为后端，但目前微软正在努力将其与 `CNTK` 集成作为新的后端，以给我们更多选择。许多用户会喜欢 `Keras` 带来的极简设计。事实上，这种设计旨在使我们的实验也尽可能简单和快速，因为你将使用的系统仍会保持紧凑。此外，我们会发现
    `Keras` 是一个易于入门的语言，并且可以使我们想要处理的原型设计变得更容易。我们还会发现 `Keras` 库是用纯 `Python` 编写的，并且本质上是更高层的，有助于我们自行完成更多编程和机器学习工作。它也是高度可扩展和模块化的。尽管使用这个库很容易，其带来的简单性以及高层取向，`Keras`
    仍然具有足够的强大功能来帮助我们进行大量严肃的建模。 `Keras` 的总体思路基于大量的层，然后模型所需的一切都将围绕这些层构建。数据将以张量的形式准备。随之而来的第一层负责这些张量的输入。然后，无论之后有多少层，最后一个层将负责输出。我们会发现模型的所有其他部分都将在其间构建，以帮助我们获得理想的结果。


    正如我们所见，有很多不同的库可以借助 `Python` 来处理，这些库也可以帮助我们完成数据科学和机器学习方面的工作。创建我们需要的模型以实现机器学习的成功，并确保我们能够利用随着时间收集的所有原始数据并实际使用它做出良好的商业决策，如果没有这些
    `Python` 库的帮助是不可能的。本指南中我们讨论过的所有库都将处理流程的不同部分，并且在整个过程中也可以以多种方式帮助我们。我们需要能够挑选出最适合我们的库，然后在需要使用
    `Python` 语言创建对我们需求最重要的模型时继续前进。本指南中讨论的不同库将正是我们完成工作所需的工具。

    '
