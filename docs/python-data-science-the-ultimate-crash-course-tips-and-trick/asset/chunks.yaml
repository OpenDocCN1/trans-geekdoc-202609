    # 第 8 章：使用 Pandas 库的完整课程


    当谈到处理数据科学时，尤其是当你依赖 `Python` 语言来帮助你时，你可以依赖的最佳库之一就是 `Pandas` 库。对于数据科学来说，这将是一个很棒的库，因为它能够处理每一个部分。它可以带你完成我们之前讨论过的数据科学的全部生命周期，让你更容易处理数据，将其整理好并准备就绪，并确保你能够在需要时进行分析和可视化。为了帮助我们入门，我们需要花几分钟时间了解更多关于
    `Pandas` 库及其包含的内容。`Pandas` 被视为来自 `Python` 的开源包，它将为我们提供完成任何我们想要的数据分析所需的许多工具。该包还附带几种不同的数据类型结构，我们可以学习它们，然后根据需要用于许多不同的数据操作任务。对于想要快速、有条理地梳理数据，同时学习数据中包含的洞察和预测的人来说，这就是最适合你的库。除了上面我们花时间学习过的许多任务之外，`Pandas`
    库还将为我们提供许多方法，程序员在处理自己的数据分析时可以使用。这在数据科学过程中始终是一件好事，而且当你有大型数据科学项目，并且希望确保它正确完成时，`Pandas`
    肯定是你会求助的库。在这里谈论 `Pandas` 库时，重要的是我们停下来看看程序员在决定使用该库而不是其他库时将会注意到的一些优势。该库绝对是值得考虑学习并在几乎任何你想专注的数据科学项目中使用的最佳选择之一，因此至少学习它是如何工作的，以及确保其按预期运行所需的某些编码，将对你的项目非常有帮助。


    ## Pandas 的优势


    数据科学家在使用 `Pandas` 时能够享受到的各种优势包括：


    1. 它将获取你拥有的数据，并以适合分析你拥有的大量数据的方式呈现。这种数据分析将在 `Pandas` 中使用 `DataFrame` 和 `Series`
    数据结构完成。

    2. 你会发现 `Pandas` 包附带了许多方法，可以帮助我们以便捷的方式筛选数据，同时获得很好的结果。

    3. `Pandas` 还附带了各种实用工具，可以帮助我们在进行输入和输出操作时以快速无缝的方式进行。此外，`Pandas` 能够读取各种格式的数据，这在数据科学中非常重要，例如
    `Excel`、`TSV` 和 `CSV` 等。


    你会发现 `Pandas` 真正会改变游戏规则以及你使用 `Python` 分析公司数据时的编码方式。事实上，它通常是 `Python` 语言及其他地方数据整理和清洗（我们将在下一章更详细地介绍如何操作）中最常用、最受欢迎的工具。`Pandas`
    可免费使用且为开源，旨在供任何希望以安全、快速和有效的方式处理其数据的人使用。正如我们上面提到的，实际上有相当多的 `Python` 库可以使用，其中一些也非常适合数据科学。但许多数据科学家以及他们所在的公司喜欢依赖
    `Pandas`，因为它有很多好处，可以处理你的所有项目，并且具有所有精妙的功能。


    ## 核心概念


    你可能会发现这个库的一个很酷的地方是，它能够获取你的一些数据，无论这些数据来自数据库、`CSV` 还是 `TSV` 文件，然后它可以将文件中找到的信息转换为
    `Python` 中的对象。它会根据不同的行和列略有变化，我们将称其为 `DataFrame`。但它看起来会与我们习惯看到的 `Excel` 类似表格非常相似。现在，如果这不是你第一次进行编码，尤其是如果你之前使用过
    `R` 编程语言，那么你在这里创建的对象将与我们在 `R` 中看到的内容有一些相似之处。这些对象将使我们的工作变得容易得多，尤其是在我们希望在过程中不使用任何
    `list` 推导或 `dictionaries` 的情况下完成所有工作时。循环是 `Python` 代码的重要组成部分，我们在本书中没有太多时间讨论和查看，但它们帮助编译器读取代码的同一部分。这些很棒，但有时在我们的数据分析中，循环会变得有点笨重，会占用比我们希望更多的空间。有时它们只是太难处理了。在代码中使用对象的思想以及它们如何处理我们想要的
    `Python` 部分，可以帮助我们在编码中以更少的混乱完成同样的事情。


    ## 安装


    然而，在这里你会发现，通常最好花时间下载 `Pandas` 库，并且你应该在下载 `Python` 库的同时下载它，尤其是如果你的主要目标是最终进行数据科学项目。如果你已经在电脑上准备好了
    `Python` 语言，然后后来决定使用数据科学和 `Pandas` 库，那么对于许多程序员来说，这仍然是一个相当容易处理的过程。对于这种方法，下载 `Pandas`
    库的最佳方式是访问 [www.pandas.org](http://www.pandas.org) 网站然后查找与你的操作系统相对应的版本。下载 `Pandas`
    库只需要几分钟，然后你就可以在这里使用它附带的所有功能。一旦你花时间将 `Pandas` 库下载到你的电脑上，就该学习更多关于使其正常工作所需步骤和流程的信息了。你会发现，一旦我们进入这个库并学习使用它的编码基础，它就可以成为一个有趣的语言，拥有所有附带的功能和能力。此外，当你学会如何使用这种语言时，它将使完成你想要的数据分析变得更容易。在这一点上，我们已经下载了
    `Pandas` 库并准备使用，现在是时候专注于需要采取哪些步骤来加载我们想要的数据，甚至保存这些数据，然后再尝试使用 `Pandas` 将数据通过我们计划创建的算法运行。


    ## 使用 Pandas 加载数据


