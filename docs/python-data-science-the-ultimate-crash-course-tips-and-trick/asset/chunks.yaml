    `Python` 处理一些科学任务时，你需要使用 `Python SciPy Stack`。这是一套专门设计用于帮助我们完成使用 `Python` 所需的科学计算的软件集合。请记住，这个
    `SciPy` 堆栈并不是 `SciPy` 库本身，所以请将两者区分开来。该堆栈相当庞大，因为内部包含超过 12 个库，我们希望重点关注核心包，特别是对数据科学最有帮助的基本组件。这个计算堆栈围绕构建的最基本包是
    `NumPy`，它代表 `Numerical Python`。它将为你希望使用矩阵和 n 维数组进行的操作提供大量有用的功能。该库将帮助我们完成许多不同的任务，包括对
