    # 第 6 章：什么是数据挖掘？

    在讨论与数据科学相关的不同步骤时，深入了解数据挖掘及其内容非常重要。这是数据科学流程中需要重点关注的一个特定部分，本章我们将花时间研究数据挖掘及其相关的各个部分。带着这个想法，让我们来看看数据挖掘到底是什么，为什么它对整个数据科学流程如此重要，以及我们为什么首先要使用它。我们的首要目标是更深入地了解数据挖掘以及这个流程的本质。数据挖掘基本上是指公司能够用来将原始数据转化为有用信息的步骤。它是我们在上一章讨论过的步骤中更专业的一种形式。在机器学习、Python
    和一些专业软件的帮助下，公司能够使用数据挖掘来寻找可能出现在大量数据中的模式。浏览所有这些数据的目标——而起初我们需要处理的数据往往相当多——是为了帮助企业更好地了解其客户、击败竞争对手，甚至制定更好的营销策略，从而在行业中领先。一些公司还将使用数据挖掘的步骤来增加销售额、降低成本、确定销售哪些产品等。如果我们希望数据挖掘流程按我们期望的方式运行，就需要很多因素协同配合。在进行数据挖掘流程时，我们需要关注的一些步骤包括有效的数据收集、数据仓库以及计算机或系统上的处理能力。


    ## 数据挖掘是如何工作的？

    考虑到以上信息，我们现在需要转向数据挖掘工作原理的一些基础知识。数据挖掘涉及公司探索并分析大量信息，希望从中提炼出重要且有意义的模式和趋势。正如我们所能想象的，当一家公司花费时间收集大量信息时，很可能能够在其中找到大量洞察和其他有价值的信息。这些公司能够利用这些信息的方式有很多，包括管理借款人的信用风险、数据库营销、检测欺诈、过滤垃圾邮件，甚至了解该系统上用户们的观点和情感。所有这些都可用于使你的公司受益，并帮助你获得所需的优势。当然，我们需要将庞大的数据挖掘流程分解为易于遵循的简单步骤。为此，我们将其分解为五个易于操作且有助于获得最佳结果的步骤。该流程的第一步是公司收集所需的数据，然后将其加载到数据仓库或其他用于保存这些信息的存储区域中。你想要收集的数据类型将基于你希望获取的信息以及你在开始此流程时的整体目标。第二步是确保我们以正确的方式存储和管理数据。这通常是通过云完成，或使用公司自行使用的服务器。管理团队、业务分析师和信息技术专业人员随后可以访问数据，并确定组织所有这些数据并从中获取更多信息的最佳方法。然后，公司需要确定要使用哪种应用程序软件。程序员可供选择的此类软件有很多，它们通常可以与机器学习和
    Python 编程语言配合使用以完成工作。应用程序软件将帮助我们根据用户的反馈对正在处理的所有数据进行分类整理。完成所有这些工作后，最终用户将能够收集到的所有洞察和信息，然后将数据和所有发现呈现给需要的人。通常，这需要在易于共享的格式中完成，包括表格或图表，以便那些真正需要使用信息的重要人员更容易看到其中的洞察。数据挖掘是一种复合型学科，将代表在不同类型的分析能力中使用的各种方法和技术。这很有用，因为它能够解决公司大量需求，并可以提出不同类型的问题并使用不同程度的人工规则或输入来做出决策。在进行数据挖掘流程时，会涉及几个不同的部分，包括：


    ### 描述性建模

    描述性建模是我们需要查看并应用于流程中的第一种数据挖掘类型。这种建模负责揭示历史数据中发现的共同相似性或分组。这将帮助我们确定公司成功或失败的原因。例如，它可以帮助我们根据客户对我们销售产品的偏好或整体情感对其进行分类。在讨论描述性建模时，适用的一些技术包括：

    1. 聚类：这是指我们能够将彼此相似的记录分组。

    2. 异常检测：这是指我们致力于识别一些异常值，然后确定这些异常值是否重要，是否需要更仔细地查看。

    3. 关联规则学习：这是指我们取现有的记录并检测它们之间是否存在某种关系以及这些关系是什么。

    4. 主成分分析：这是指我们查看正在处理变量之间会存在什么样关系。

    5. 亲和分组：这是指将具有共同兴趣或同时具有简单目标的人们分组。


    ### 预测建模

    我们要查看的第二件事是预测建模。这种建模将更深入地对未来事件进行分类，或帮助你估计未知的结果。一个例子是使用信用评分来帮助我们确定某人偿还贷款的可能性。预测建模的理念是帮助我们揭示有关客户流失、信用违约和活动响应等主题所需的洞察。我们能够使用且适用于此的一些技术包括：

    1. 回归：这将衡量我们看到的一个因变量与一系列自变量之间的强度。

    2. 神经网络：这是一种复杂的计算机程序，可以设置以便学习、做出自己的预测，甚至检测您自己的数据中发现的一些模式。

    '
