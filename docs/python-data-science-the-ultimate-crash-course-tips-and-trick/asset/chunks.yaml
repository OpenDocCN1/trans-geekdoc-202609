    # 结论

    感谢您坚持读到《Python 数据科学》的结尾，希望它具有启发性，并能为您提供实现目标所需的一切工具，无论这些目标是什么。下一步是开始学习如何将数据科学和
    Python 的基础知识应用到您自己的业务中。


    这些都是在商业世界中流传的大热词汇，无论企业处于哪个行业，许多公司都准备立刻投入，看看数据科学能为他们带来什么。但实际上，采取必要的步骤并学习如何处理数据生命周期以及与之相关的所有不同流程会带来差异，而迈出第一步可能很困难。


    本指南花时间研究了所有这些不同的部分，以探讨企业如何为自身需求开展数据科学。数据科学生命周期包含许多不同的部分，虽然直接创建模型然后完成似乎更有趣，但所有这些步骤对于我们期望获得的结果都非常重要。


    我们必须处理原始数据的收集、清理和整理我们所拥有的数据、了解其中有哪些洞察、确定最佳模型并对其进行训练和测试，然后完成分析。我们将在本指南中花时间讨论所有这些部分以及更多内容，并找出让这些内容为我们发挥最佳作用的方法。


    数据科学流程总体上将为您带来大量好处，您会喜欢利用这些信息来更深入了解客户、竞争对手等，从而提高您的利润底线并看到业务成果的方式。这可能需要一些时间，而且通常需要一定的编程知识才能完成。


    但您会发现，在 Python 编程语言的帮助下，以及本指南中讨论的一些机器学习内容，您将能够使其满足您的需求。数据科学是所有企业都能用来帮助自己领先并真正看到成果的工具。但这是一个需要时间的流程，并不总是像我们希望的那样容易完成。


    在指南的帮助下，以及其中讨论的一些工具，准备好将 Python 数据科学应用于您的需求吧。最后，如果您觉得这本书以任何方式有用，在 Amazon 上留下评论将非常感激！

    '
