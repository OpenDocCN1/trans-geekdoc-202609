    # 第 2 章：Python 语言基础


    当你想要开始处理自己的数据科学项目时，你可以使用 Python 语言作为最好的编程语言之一。这是一种出色的语言，能够承担你想用数据科学完成的所有工作，并且拥有创建出色的机器学习算法所需的强大能力。尽管如此，它仍然是初学者的绝佳选择，因为它专为从未编程过的人设计。虽然你也可以选择使用
    R 编程语言，但你会发现由于其易用性和强大功能的结合，Python 语言是最好的选择之一。在深入探讨 Python 如何处理你想用数据科学完成的一些事情之前，我们首先需要花时间了解一下
    Python 语言的基础知识。Python 是一种很棒的语言，你很快就能学会所需的编码。 使用 Python 语言可以进行的各种编码类型包括：


    ## 语句


    关于 Python 语言，我们首先要花点时间了解的是关键字。这将关注你希望编译器在屏幕上显示的行或句子。你需要使用我们即将讨论的一些关键字，然后可以告诉编译器要在屏幕上显示哪些语句。如果你想在屏幕上留下消息，例如我们可以用
    `Hello, World!` 程序做什么，你需要将其用作语句，并使用 `print` 关键字，以便编译器知道如何行为。


    ## Python 运算符


    我们也可以花点时间了解一下所谓的 Python 运算符。这些运算符在编写代码时经常会被忽略，因为它们似乎并不那么重要。但如果你跳过编写它们，你的代码将无法按你期望的方式工作。我们可以关注多种不同类型的
    Python 运算符，因此确保你了解每种类型的用途以及何时将其添加到代码中，会带来很大的不同。运算符是代码中相当简单的部分，但你仍应了解它们的工作原理。你会发现实际上有几种不同的类型效果很好。例如，算术函数非常适合帮助你将代码的不同部分相加、相除、相减和相乘。有赋值运算符会为你的变量分配特定值，以便编译器知道如何处理它。还有比较运算符，允许你查看几段不同的代码，然后确定它们是否相似，以及计算机应如何根据该信息做出反应。


    ## 关键字


    关键字是我们 Python 代码的另一个重要部分，需要了解一下。这些是我们需要保留的词，因为它们负责向编译器提供你希望它使用的指令或命令。这些关键字确保代码始终按你希望的方式执行。这些关键字需要保留，因此请确保不要在错误的地方使用它们。如果你没有正确使用这些关键字，或没有将其放在正确的位置，那么编译器将无法理解你希望它做什么，你将无法获得想要的结果。确保学习
    Python 语言附带的重要关键字，并学习如何将它们放在代码的正确位置以获得最佳效果。


    ## 使用注释


    在使用 Python 编码时，我们需要花时间处理称为注释的东西。这是我们能做的最好的事情之一，以确保我们可以为代码的一部分命名，或者当我们想为自己或其他程序员留下小便条时，你也需要使用注释。这些注释将是一个很好的选择。它们允许你在代码中留下很好的信息，编译器会知道它应该跳过该部分代码，根本不读取它。就是这么简单，可以为你正在进行的任何代码节省大量麻烦和工作。因此，只要你想在
    Python 代码中写出注释，只需使用 `#` 符号，然后编译器就会知道它应该跳过该部分代码而不读取它。我们可以向代码中添加任意数量的这些注释。只要记住将这些注释保持在必要的数量，而不是过度使用，因为这可以确保我们让代码保持尽可能整洁美观。


    ## Python 类


    关于使用 Python 和其他类似语言，一件极其重要的事情是语言被分离成类和对象的概念。对象旨在放入你创建的类中，使其更有组织，并确保不同部分能够按你希望的方式无问题地组合在一起。在一些较旧类型的编程语言中，没有组织，这给刚入门的人带来了很多困惑和挫败感。这些类只是一种容器，可以保存你的对象，即你编写的基于现实世界实际物品和其他代码部分的那些对象。你需要确保以正确的方式命名这些类，然后在代码的正确位置列出它们，以确保它们实际工作并调用你需要的对象。将正确类型的对象放入正确的类中也很重要。你可以在设计的类中存储任何你想要的东西，但必须确保相似的东西最终在同一个类中。这些项目不必彼此完全相同，但当有人查看你处理的类时，他们需要能够看到这些对象属于一起并且在一起是有意义的。例如，你不必只把汽车放在同一个类中，但你可以把不同的车辆放在同一个类中。你可以有被认为是食物的项目。你甚至可以有颜色相同的项目。在创建类和在这些类中存储对象时你有一定的自由，但当另一位程序员查看代码时，他们应该能够弄清楚该类中的对象是什么，并且这些对象应该有共同点。类在编写代码时非常重要。它们将保存你在代码中编写的各种对象，并确保一切得到妥善存储。它们还将使你在需要执行时更容易调用代码的不同部分。


    ## 如何命名标识符


