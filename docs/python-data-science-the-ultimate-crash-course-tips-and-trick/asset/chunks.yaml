    # Chapter 5: The Basics for the Data Life Cycle


    One of the most important things that we are able to do when it is time to combine
    data science and `Python` together into one is learning a bit more about the data
    life cycle. There are a lot of steps that we need to take before we are able to
    take our data and actually learn something from it. Many people and companies
    who want to get into the process of using their data to make decisions assume
    that they can just look around for a bit of data, and then find the insights all
    at once. As we are going to explore in this chapter, there are actually a number
    of steps that need to be taken in order to actually gain the insights that you
    would like from all of that data you were able to collect. This is a process that
    takes some time, and sometimes it is not as simple or as quick as we would like.
    However, taking your time and going through all of the steps that we are going
    to talk about in this chapter will make a world of difference when it comes to
    the results that you are able to get. Let’s take a look at some of the main steps
    that companies need to follow in the life cycle of their data to ensure they get
    the best results possible:


    ## Gathering our Data


    The first thing that we need to do is go and find all of that data that we would
    like to use in the first place. This is going to be a critical step because we
    are not going to be able to create a model and learn a lot of the predictions
