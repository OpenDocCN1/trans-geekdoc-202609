    # Chapter 9: Using Your Data to Make Smart Business Decisions


    Learning how to work with data science is going to be a very important part of
    your business plan. Putting it all together and ensuring that you understand how
    the different parts are going to work, and adequately going through all of the
    different steps that come with data science, is going to be critical to ensuring
    that you get the results that you would like. Many businesses are willing to go
    out and collect data on the industry, on their competition, and on their customers.
    But then they start to run into trouble because they are not sure what should
    happen next. They have all of this data readily available to use, but they have
    no idea how to go through and really read through that information and see what
    is there for them to use. It is not enough to just collect this data though; we
    need to be willing and able to use it for our needs as well and figuring out how
    to use the data science process is going to make this a little bit easier as well.


    Data science is meant to help businesses to actually use the data they have been
    able to collect. There is just too much raw data, and it is usually in a format
    that is unstructured and hard to read through, for someone to manually go through
    and see what kind of insights are present in it. This may sound like a better
    idea and less complicated than some of the steps that we have discussed in this
    guidebook. But when you consider that there could potentially be millions of data
    points that we need to go through in order to find our insights and predictions,
    it becomes a lot easier to understand why this is impossible to do manually. Instead
    of having an employee who has to manually go through all of the data to find those
    insights, we can choose to work with data science, and some of the algorithms
    that are present with Python, in order to get through that information faster
    and more efficiently. It still takes some time and experimenting with the different
    models and algorithms that we want to use, but it is going to make things a lot
    easier to work with overall.


    The goal of this process is to take that raw data, the data that seems to be all
    over the place and hard to read and turn it into a method that we are able to
    easily work with. You will find that with the right Python algorithm and the help
    of machine learning, that we are able to take all of that data and actually find
    some hidden information and insights that are actually able to improve your business
    and make things better for your own bottom line in the process.


    There are a lot of decisions that these algorithms and this whole process are
    able to help you out with. You may find that they can help you to figure out how
    to meet the needs of your customers a little bit better. If you use some of the
    survey responses and maybe even some of the comments that come with social media,
    you can find new ways to interact and meet the needs of your customers, maybe
    some that your competition hasn’t been able to think about yet.


    Another benefit is figuring out what products to release. With the help of data
    science, you can listen to your customers, try out a few basic versions of the
    product, and slowly design something that your customers would actually spend
    money on. This is something that used to carry a lot of risk in the past because
    it was hard to know for sure whether something was going to take off in the market
    or not. But with the help of data science and using that raw data to your advantage
    through these algorithms, you will be able to figure out the best product ahead
    of time to sell and have more certainty that it is the one your customers want.


    Through data science, you may be able to figure out a new market to enter, one
    that your competition hasn’t had time to get to yet. Sometimes, when we are working
    with our models, we will notice that most of the data points are going to follow
    one trend, and maybe that is the one that we are already in and using. But then
    we may also notice that there are a significant number of outliers on your charts
    as well. These outliers, if the group is large enough or enough of them are close
    together, will show us a new market that would be great for entering, or a new
    demographic to work with as well.


    Sometimes these methods are going to help us figure out the best ways to reduce
    the amount of waste that is going on in the company. Every company has some kind
    of waste, whether it is a process that is not as effective as it should be, too
    many or too few employees working on something, downtime where things are not
    getting done, or something else. Some companies have been able to utilize the
    data science to learn more about the processes that are used in their business,
    and how to reduce the amount of waste. The more that we are able to reduce this
    waste and keep it to a minimum, the more money can be added to our bottom line,
    without reducing the quality of the product or the service that is being offered
    to the customer.


    Learning how to beat out the competition is always one of the benefits that we
    are able to see when working with the process of data science. You will be able
    to use this to help you figure out new ways to reach your market, how to make
    different decisions that set you apart and more. You should go in with a clear
    objective of how you would like to reach your target audience and how you would
    like to beat out the competition, but the models and algorithms that we include
    with data science can make this a bit easier to accomplish.


    In some areas like manufacturing, this data science is able to help them to work
    with their system and learn when machines and other parts are likely to fail.
    When we know that something is going to need to be fixed by a certain date, it
    is easier to make plans to do it during a slow time, such as at night. This prevents
    loss of time of work with the part breaking in the middle of a workday and then
    being without any work getting done for a few days as the part is ordered and
    put back in. All of this can be done on a good schedule that allows us to take
    care of the machine or the part, get it fixed when needed, and to keep production
    going on time.


    And finally, some companies will find that using data science is a great way for
    them to market and advertise to their customers better than before. When you are
    able to learn more about your target audience and what they are looking for, it
    becomes a lot easier to go through the process of figuring out what kind of marketing
    campaigns you should work with as well. This is going to make a big difference
    in the results that you get, what kinds of campaigns you try to use, and more
    as well.


    As we can see here, there are a lot of times when working with data science is
    going to help you to make some of the best and most informed decisions possible
    for your business. In the past, these decisions had to be made on guesses and
    the little information that you were able to gather. But there was always some
    kind of risk that came with these decisions. Today, we are able to use data science,
    the Python coding language, and machine learning to help us make these decisions
    and know that they are not as risky because they are backed by data and research
    instead.

    '
