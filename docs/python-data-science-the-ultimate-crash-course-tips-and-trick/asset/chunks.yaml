    `Python` 语言具有大量面向对象的设计和大量支持库。由于所有这些资源以及程序易于使用，程序员的生产力将会提高。这甚至可以用来在使用 `C#`、`C++`、`C`、`Perl`、`VB`
    甚至 `Java` 等语言时提高程序员的生产力。当你需要处理数据科学项目的不同部分时，拥有更高的生产力总体上非常重要。你会发现，当程序员能在更短时间内完成更多工作时，他们在所从事的项目中将会看到显著差异。


    ## 集成特性


    `Python` 很棒，因为它集成了所谓的企业应用集成。这确实有助于你在 `Python` 中想要处理的许多不同事物，包括 `COBRA`、`COM` 等。它还具有强大的控制能力，因为它可以直接通过
    `Java`、`C++` 和 `C` 调用。`Python` 还能够处理 `XML` 和其他标记语言，因为它可以通过同一种字节码运行所有现代操作系统，包括
    `Windows`、`Mac OS X` 和 `Linux`。虽然我们主要关注如何使用 `Python` 语言帮助你的数据科学项目，但有些数据科学库需要与其他编程语言兼容才能完成工作并处理你的算法。这就是为什么
    `Python` 是如此令人惊叹的语言。它与许多不同语言兼容，这意味着你可以使用想要关注的所有库和扩展，同时仍能与其他必需的语言协同工作。


    ## 庞大的社区支持


    `Python` 庞大的社区将使你在编写代码过程中或遇到问题时更容易获得所需的帮助。在数据科学工作中，即使有 `Python` 编程语言的帮助，我们也需要关注大量复杂代码。如果我们卡住，有时很难弄清楚出了什么问题以及如何改进。`Python`
    的社区将有助于让这一切变得更容易处理。你会找到许多其他程序员，其中一些人使用 `Python` 已久，他们能够为你提供建议、提供有用的代码，并帮助你解决数据科学项目中遇到的问题。


    ## 标准库


    `Python` 附带的标准库拥有你完成许多编程任务所需的强大功能。只需下载 `Python` 语言，你就会获得一个出色的库，能够处理你想用 `Python`
    完成的许多工作，以及你想要处理的许多主题。虽然你需要添加一些扩展来帮助你尝试机器学习和数据科学所需的模型，但你会发现 `Python` 的标准库能够处理你想要完成的大量工作。例如，当你使用
    `Python` 语言及其附带的标准库时，你能够编写循环、继承、条件语句等等。所有这些都可以在机器学习和数据科学的更复杂部分中发挥作用。


    ## 数据科学的特殊扩展和库


    我们可以用 `Python` 实现大量专门的扩展和库，非常适合数据科学和机器学习。尽管仅使用标准库就能用 `Python` 语言完成很多工作，但也有许多库不仅与
    `Python` 协同工作，还能帮助我们同时在数据科学方面取得更多进展。我们将花一些时间查看数据科学和 `Python` 的许多不同库，你将有机会看到它们如何帮助你的数据科学项目。不过，根据你想要使用的机器学习算法，最佳选择包括
    `TensorFlow`、`Scikit-Learn`、`NumPy`、`SciPy` 和 `Pandas`。


    ## 为什么 Python 非常适合数据科学


    `Python` 是用于帮助创建机器学习算法的选项之一，这些算法可用于数据科学中创建自己的模型。没有这些模型，你将难以处理收集到的数据，并从中发现想要的洞察和预测。你可以使用其他语言，最著名的是
    `R` 编程语言，但 `Python` 是完成所有这些工作的最佳选择之一。开展自己的数据科学项目涉及多个步骤，但在分析部分，我们需要能够使用机器学习、深度学习和其他技术来帮助我们创建能够处理所用数据的模型。如果手动处理这些数据，将需要很长时间。但借助
    `Python` 语言的正确模型，我们将能够更快地梳理这些信息，并从数据中提取洞察和预测。这也是数据科学工作的重点之一。我们希望能够利用长期收集的原始数据，然后找出其中隐藏的洞察。在机器学习和
    `Python` 的帮助下创建的模型确实可以帮助我们实现这些目标，并确保我们能够领先竞争对手、满足客户需求等。数据科学家想要使用 `Python` 语言有很多原因。可能还有其他可用的编程语言，但由于我们上面讨论的所有原因以及更多原因，我们可以看到，使用
    `Python` 语言是最佳选择之一，它可以帮助你创建所需的模型、使用有助于机器学习的各种库等等。

