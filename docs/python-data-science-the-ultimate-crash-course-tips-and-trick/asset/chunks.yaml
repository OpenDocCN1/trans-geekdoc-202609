    # 第 4 章：最适合数据科学的 Python 库，以及它们如何帮助完成工作


    下一步我们需要花时间了解一下在使用 `Python` 语言和数据科学时可以使用的一些最佳库。标准 `Python` 库能够完成很多令人惊叹的事情。但当你想要使用机器学习等创建一些模型时，标准库将缺少你想要使用的一些功能。这就是为什么我们需要引入一些额外的扩展和库。你会发现
