    # 第 5 章：数据生命周期的基础


    当我们将数据科学和 `Python` 结合在一起时，我们能够做到的最重要的事情之一就是对数据生命周期多了解一些。在我们能够利用数据真正学到东西之前，有很多步骤需要完成。许多想要利用数据来做决策的人和公司都假设他们只需找一些数据，然后就能一次性找到洞察。正如我们将在本章中探讨的那样，实际上需要采取一系列步骤，才能从收集到的所有数据中获得你想要的洞察。这是一个需要花费时间的流程，有时并不像我们希望的那样简单或快速。然而，花时间并完成我们将在本章中讨论的所有步骤，对于你能获得的结果来说将大有不同。让我们来看一下公司在数据生命周期中需要遵循的一些主要步骤，以确保获得最佳结果：


    ## 数据收集


    我们需要做的第一件事就是去找到我们最初想要使用的数据。这将是一个关键步骤，因为如果一开始没有数据供我们筛选，就无法创建模型，也无法学习我们想要的许多预测和洞察。这是一个非常重要的一步，因为它确保我们不仅拥有大量数据，而且还拥有我们想要用来真正找到最大问题的答案的数据。首先，我们需要能够梳理出我们希望得到解答的业务问题。我们并不是随机浏览现有数据并希望能弄出点什么来。在这方面，我们需要筛选的数据实在太多，如果这样做，结果不会好到哪里去。相反，花一些时间查看过去从客户那里获得的信息、查看调查等，可以成为帮助你看到想要的结果的好方法。在此期间，我们也需要做一些评估。重要的是要知道你是否已经拥有开展该项目所需的合适资源，或者是否有某些缺失的东西需要在提前填补。你需要评估自己在人力、时间、数据和技术方面是否拥有支持该新项目的合适资源。在此阶段，你可能会发现是时候界定你所拥有的业务问题，然后制定
    `IH` 或初始假设，以便开展工作。


    ## 数据准备


    接下来我们需要花时间做的是准备我们想要使用的数据。你很可能已经收集了将用于模型的数据，而你后来的一些决策将来自各种来源。这会让事情变得混乱。你从发送的调查中得到的结果与从社交媒体账号得到的结果相比会有所不同。这两者在进行数据科学工作时都非常有用，但会带来一些挑战，这意味着我们需要能够提前准备数据并将其清理和整理好，以避免混淆并确保我们的模型能够处理它。在这个特定阶段，我们需要使用一种被称为分析沙箱的东西。这是一个地方，你可以在整个项目处理期间执行想要使用的不同分析。在我们能够进行稍后将重点关注的建模之前，在处理数据时需要处理很多步骤。例如，在此阶段，我们需要在处理任何建模之前探索、预处理然后对数据进行条件化。此外，我们需要使用被称为
    `ETLT` 的流程，以确保我们在途中能够收集到的原始数据能够进入该沙箱，以便我们能够按自己的意愿使用它。准备数据需要一些时间。我们需要能够对其进行处理并确保所有数据都采用相同的格式，以便模型更好地理解我们想要看到的情况。我们还需要处理任何缺失数据或重复数据，因为这很可能会导致我们在此过程中工作出现问题。在此步骤中花时间准备数据并尽可能使其井然有序，将是我们确保模型稍后能正常工作并为我们提供所需洞察的关键。现在，在准备数据时，你可以使用几种选择。`R`
    和 `Python` 编程语言在处理数据的清理、转换和可视化时将会非常出色，而这些都是我们数据科学项目的重要方面。使用这些工具将使我们更容易管理数据并提前发现一些异常值，同时在过程中建立变量之间的关系。在此期间，我们将确保数据尽可能井然有序和完美，确保我们从数据中获得尽可能高的效率和准确性。一旦我们能够清理和准备好正在使用的数据，就该是时候对该数据进行一些探索性分析了，而这就是我们进入下一步的时候。


    ## 模型规划


    一旦我们花了一些时间收集原始数据并从我们想要使用的所有不同来源收集起来，并且我们已经准备和清理数据使其可以使用，就是我们进入该流程第三阶段，即模型规划的时候了。在此阶段，我们将花一些时间找出哪些技术和方法最适合绘制变量之间的关系。这些关系很重要，我们需要花时间研究它们并更好地理解它们的工作方式。事实上，这些关系将能够为我们的算法工作奠定一些基础，这肯定会影响到下一阶段的实施。正是在此阶段，我们能够借助许多不同的可视化工具和我们想在此过程中使用的统计公式来应用
    `EDA` 或探索性数据分析。现在，你想要完成的项目好坏程度只取决于你用来完成所有这些工作的工具。以下三种工具对于帮助你规划想要用于帮助模型的代码至关重要：

    '
