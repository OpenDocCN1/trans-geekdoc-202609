    # Chapter 6: What is Data Mining?

    While we are on the topic of the different steps that need to be taken along with
    data science, it is important to take a closer look at data mining and what it
    is all about. This is a specific part of the data science process that we need
    to focus on, and we are going to spend some time in this chapter looking into
    data mining, and all of the different parts that come with it. So, with that in
    mind, let’s take a look at what data mining is all about, why it is so important
    to the process of data science overall, and why we would want to use it in the
    first place. Our first goal is to learn a bit more about data mining and what
    this process is all about. Data mining is basically the steps that a company is
    able to use in order to take their raw data and then turn it into useful information.
    It is going to be more of a specialized form of the steps that we talked about
    in the previous chapter. With the help of machine learning, Python, and some specialized
    software, the company is able to use data mining in order to look for patterns
    that may show up n large batches of data. The goal of looking through all of this
    data, and there is often quite a bit of that data that we need to go through in
    the first place, is to help a business learn more about their customers, beat
    out the competition, and even develop some better marketing strategies that will
    get them ahead in the industry. Some companies are also going to work with the
    steps of data mining in order to increase their sales, decrease costs, figure
    out which products to sell, and more. There are a lot of things that need to come
    together if we would like to make sure our data mining process is going to work
    the way that we would like. Some of the steps that we need to look for when working
    on the data mining process includes an effective amount of data collection, warehousing,
    and processing power on our computer or system.


    ## How Does Data Mining Work?

    With some of the information above in mind, we now need to move on to some of
    the basics of how data mining is going to work. Data mining is going to involve
    a company exploring and then analyzing a large amount of information, in the hopes
    of gleaning some important and meaningful patterns and trends out of the whole
    thing. As we can imagine, when a company spends their time collecting a large
    amount of information, it is likely that they are going to be able to find a ton
    of insights and other valuable information inside. There are a lot of ways that
    these companies are going to be able to use this information, including managing
    the credit risk of someone who wants to borrow money, database marketing, detecting
    fraud, filtering out spam emails, and even to figure out some of the opinions
    and sentiment of users on that system. All of these can be used in order to benefit
    your company and help you to get the advantage that you are looking for. Of course,
    we need to take the enormous process of data mining and figure out how to break
    it down into easy steps that we are able to follow. For this to work, we are going
    to break it down into five steps that are easy to work with and can help us to
    get the best results. The first step of this process is that the company is going
    to go through and collect the data that they need, and then load it up into the
    warehouse, or another storage area, that they want to use to keep ahold of that
    information. The type of data that you want to collect is going to be based on
    what information you would like, and what your overall goal is when you get started
    with this process as well. The second step is that we would like to make sure
    that we are storing and managing the data in the right manner. This is usually
    going to be done either through the cloud or with some servers that the company
    is using on their own. Management teams, business analysts, and information technology
    professionals are then able to access the data and determine the best method that
    they can use in order to organize all of that data and learn more information
    from it. Then, the company needs to go through and figure out what kind of application
    software they want to use. There are a number of these that are available for
    the programmer to choose from, and they can often work with machine learning and
    the Python coding language to help get the work done. The application software
    is going to help us to sort out all of the data that we are working on, based
    on the results form the user. When all of this is done, the end-user is going
    to be able to take all of the insights and the information that they have been
    able to gather up, and then present that data and all of their findings to those
    who need it. Usually, this needs to be done in a format that is really easy to
    share, including a table or a graph, so that it is easier for those key people,
    the ones who really need to use the information, to see what insights are there.
    Data mining is going to be a composite type of discipline and will represent a
    variety of methods and techniques that are used in different types of analytic
    capabilities. This can be useful because it is able to address a ton of the needs
    of your company and can ask different types of questions and use different levels
    of human rules or inputs in order to come to this decision. There are a few different
    parts that are going to come into play here when we are working with a data mining
    process, and these are going to include:


    ### Descriptive modeling

    Descriptive modeling is the first type of data mining that we need to take a look
    at and use on our process. This kind of modeling is going to be responsible for
    uncovering some of the shared similarities or the groupings that are found in
    historical data. This is going to help us to determine the reasons behind the
    success or failure of a company. For example, it can help us to categorize out
    our customers by their preferences that they have to the products we sell or some
    of their sentiment overall. Some of the techniques that are going to fit in when
    we talk about descriptive modeling will include:

    1. Clustering: This is when we are able to group some of the records that are
    similar to one another.

    2. Anomaly detection: This is when we are going to work to identify some of the
    outliers, and then will determine whether these are important and should be looked
    at a bit more closely or not.

    3. Association rule learning: This is when we are going to take some of the records
    that we have and detect whether there are some kinds of relationships between
    them and what those relationships are.

    4. Principal component analysis: This is where we are going to take a look to
    detect what kind of relationship is going to be present with the variables that
    we are working on.

    5. Affinity grouping: This is when we group people together who have a common
    interest or simple goals at the same time.


    ### Predictive modeling

    The second thing that we are going to take a look at is predictive modeling. This
    modeling is going to go deeper to classify events in the future, or to help you
    to estimate outcomes that are not known. An example of how this one work could
    including using credit scoring to help us determine how likely it is that someone
    is going to repay their loan or not. The idea of predictive modeling is that it
    helps us to uncover some of the insights that we need on topics like customer
    churn, credit defaults, and campaign responses. Some of the techniques that we
    are able to use that work with this one will include:

    1. Regression: This is going to be a measure of the strength that we see between
    one dependent variable and a series of variables that are independent.

    2. Neural networks: This is a complicated type of computer program that can be
    set up in order to learn, make its own predictions, and even detect some of the
    patterns that are found in your own data as well.

