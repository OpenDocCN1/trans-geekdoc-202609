    `df.info()`。这只是使用 Pandas 库可以做的一些代码的开始，以帮助确保事情得到完成。例如，你可以使用命令 `s.value_counts(dropna=False)`
    并发现它允许你查看序列中唯一的计数和值，就像你只想一次处理一列或几列时所使用的那样。另一个你可能会觉得有用的命令是函数 `df.describe()`。这个函数非常有帮助，因为它允许你输入一些汇总统计信息，即图表中数值列附带的统计信息。你也可以使用各种代码和函数来帮助你从整个序列或整个数据框中获取所需的所有统计信息。现在，这看起来可能是一次要花费我们时间的大量信息，但为了确保我们能完全理解我们在这里所做的事情以及所有部分的意思，查看
