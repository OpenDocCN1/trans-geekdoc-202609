    with one of these pilot projects, it helps us to see the work of the model in
    a clear picture and to see some of the performance, as well as real-life constraints
    on a smaller scale, before we try to deploy it throughout the whole business.


    For example, sometimes a project or an idea may sound like a great thing to work
    with, but once you start to implement it, even on a smaller scale, things are
    going to start falling apart, and you can quickly see that the project or the
    idea that was there, is really bad and will cost too much money, or just won’t
