    # Chapter 1: What is Data Science?


    The first thing that we need to take some time looking over in this guidebook
    is the basics of data science. Data science, to keep things simple, is the detailed
    study of the flow of information from the huge amounts of data that a company
    has gathered and stored. It is going to involve obtaining some meaningful insights
    out of raw, and usually unstructured, data, that can then be processed through
    analytical programming and business skills. Many companies are going to spend
    a lot of time collecting data and trying to use it to learn more about their customers,
    figure out how to release the best product, and learning how to gain a competitive
    edge over others. While these are all great goals, just gathering the data is
    not going to be enough to make it happen. Instead, we need to be able to take
    that data, and that data is usually pretty messy and needs some work and analyze
    it so that we are better able to handle all that comes with it.


    ## The Importance of Data Science


    In a world that is going more and more over to the digital space, organizations
    are going to deal with unheard of amounts of data, but structured and unstructured,
    on a daily basis. Evolving technologies are going to enable some cost savings
    for us, and smarter storage spaces to help us store some of this critical data.
    Currently, no matter what kind of industry we are looking at or what kind of work
    the company does, there is already a huge need for skilled and knowledgeable data
    scientists. They are actually some of the highest-paid IT professionals right
    now, mainly because they can provide such a good value for the companies they
    work for, and because there is such a shortage in these professionals. The gap
    of data scientists versus the current supply is about 50 percent, and it is likely
    to continue growing as more people and companies start to see what value data
    science can have for them. So, why is data becoming so important to these businesses?
    In reality, data has always been important, but today, because of the growth in
    the internet and other sources, there is an unprecedented amount of data to work
    through. In the past, companies were able to manually go through the data they
    had, and maybe use a few business intelligence tools to learn more about the customer
    and to make smart decisions. But this is nearly impossible for any company to
    do now thanks to a large amount of data they have to deal with on a regular basis.
    In the last few years, there has been a huge amount of growth in something known
    as the Internet of Things, due to which about 90 percent of the data has been
    generated in our current world. This sounds even more impressive when we find
    out that each day, 2.5 quintillion bytes of data are generated and used, and it
    is more accelerated with the growth of the IoT. This data is going to come to
    us from a lot of different sources, and where you decide to gather this data is
    going to depend on your goals and what you are hoping to accomplish in the process.
    Some of the places where we are able to gather this kind of data will include:


    1. Sensors that are used in malls and other shopping locations in order to gather
    more information about the people who shop there.

    2. Posts that are put up on various social media sites.

    3. Digital videos and pictures that are captured on our phones

    4. Purchase transactions that are made through e-commerce.


    These are just a few places where we are able to gather up some of the data that
    we need and put it to use with data science. And as the IoT grows and more data
    is created on a daily basis, it is likely that we are going to find even more
    sources that will help us to take on our biggest business problems. And this leads
    us to need data science more than ever. All of this data that we are gathering
    from the sources above and more will be known as big data. Currently, most companies
    are going to be flooded and a bit overwhelmed by all of the data that is coming
    their way. This is why it is so important for these companies to have a good idea
    of what to do with the exploding amount of data and how they are able to utilize
    it to get ahead. It is not enough to just gather up the data. This may seem like
    a great idea, but if you just gather up that data, and don’t learn what is inside
    of it, then you are leading yourself to trouble. Once you can learn what information
    is inside of that data, and what it all means, you will find that it is much easier
    to use that information to give yourself the competitive advantage that you are
    looking for.


    Data science is going to help us to get all of this done. It is designed to make
    it easier for us to really take in the big picture and use data for our needs.
    It will encompass all of the parts of the process of getting the data to work
    for us, from gathering the data to cleaning it up and organizing it, to analyzing
    it, to creating visuals to help us better understand the data, and even to the
    point of how we decide to use that data. All of this comes together and helps
    us to really see what is inside of the data, and it is all a part of the data
    science process. Data science is going to work because it is able to bring together
    a ton of different skills, like statistics, mathematics, and business domain knowledge
    and can help out a company in many ways. Some of the things that data science
    is able to do when it is used in the proper manner, for a company will include
    some of the following:


    1. Reduce costs

    2. Get the company into a new market

    3. Tap into a new demographic to increase their reach.

    4. Gauge the effectiveness of a marketing campaign.

    5. Launch a new service or a new product.

    '
