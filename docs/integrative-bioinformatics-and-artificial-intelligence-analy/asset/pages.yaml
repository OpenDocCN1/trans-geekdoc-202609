  img_proc: true
- pgno: 3
  md: '# 1. Introduction


    Major Depressive Disorder (MDD) is among the most prevalent, chronic complex psychiatric
    disorders nowadays [1,2]. Depression affects over 280 million people globally
    according to the World Health Organization (WHO, 2023), and is the second leading
    cause of disability worldwide after cancer, while predicted to be the leading
    cause by 2030 [3]. In the post-COVID-19 era, mental and behavioral disorders are
    reported to have become more severe, possibly due to the pandemic effects on healthcare
    and the economy worldwide [4,5].


    MDD is a heterogeneous disorder, resulting from a complex interaction of social,
    psychological, environmental and genetic factors [6,7]. Depression does not only
    affect the mental and psychological aspects of the individual''s health, but also
    affects physical health by disturbing the heart, kidney, nervous system, and immune
    system [8]. It is characterized by presence of depressed moods, functional impairments,
    a loss of interest in activities, fatigue, sleep disturbances, and psychomotor
    retardation or agitation [9,10]. This negatively affects the patient''s productivity,
    self-perception, and self-esteem; in an impaired quality of life which can lead
    to suicidal ideation and attempt. The WHO reported that more than 700,000 individuals
    worldwide died as a result of suicide each year, with depression being a leading
    cause (2023). Thus, MDD has grown into a major public health problem that needs
    urgent attention.


    Extensive research, the pathophysiology of MDD is still poorly understood. Around
    40% of MDD patients do not show an adequate response or remission to anti-depressant
    treatment and ultimately develop treatment resistance which further exacerbates
    the disease [1]. Additionally, the diagnosis of MDD continues to be on clinical
    assessment, which can be assisted by psychiatric questionnaire-based tools rather
    than laboratory-based tests which may be associated with several limitations and
    heterogeneity of the illness [10,11]. Indeed, self-administered questionnaire-based
    approaches are not sufficient in evaluating the differences across patients''
    sub-groups and identifying patients'' depressive states. Adding to the fact that
    the absence of precise biomarkers has resulted in complex MDD diagnosis with other
    etiologically associated disorders such as bipolar disorder [12,13].


    The use of functional neuroimaging techniques including functional magnetic resonance
    imaging (fMRI) and electroencephalogram (EEG) offer potential means for the assessment
    of the changes in brain activity associated with MDD as well as the prediction
    of'
