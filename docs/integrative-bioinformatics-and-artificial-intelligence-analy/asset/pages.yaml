  md: 'pathological response to stress [54], fluctuations in behavior, cognitive functions
    and

    endocrine responses [55]. Furthermore, animal model studies showed that the disturbing


    Nrg1 function within the cortical region resulted in decreased synaptic plasticity
    and

    augmented inhibitory connections [56]. Moreover, mice with heterozygous KO deletion
    of


    Nrg1 showed different schizophrenia-related disorders and advanced sensitivity
    to stress

    during adolescence [57]. Our findings showed up-regulation of the NRG1 in the
    MDD

    patients compared to HCs in both blood and saliva samples which per several mice
    models

    studies showed that increases in the NRG1 expression resulted in deficits in the
    response to a

    stimulus [58–61].


    Thus, we believe a further investigation of the NRG1 biomarker in a larger clinical\dataset
    of MDD patients is warranted. The evidence from our study points towards the idea

    that hybrid AI and Bioinformatics applications can greatly help in the diagnosis
    and treatment

    of mental disorders.


    # 5. Conclusion


    In conclusion, integrative analysis using bioinformatics and ML approaches to
    compare

    transcriptomics changes of MDD patients to HCs identified DEGs in MDD patients
    which are

    associated with immune response and inflammatory pathways. In addition, the

    analysis identified ten biomarkers panels that can aid in the diagnosis and monitoring
    of

    patients with MDD. Amongst those biomarkers, NRG1 exhibits higher expression in
    the

    amygdala and hippocampus brain subregions and was suggested as a non-invasive
    liquid-

    bopsy biomarker for the diagnosis of MDD patients.


