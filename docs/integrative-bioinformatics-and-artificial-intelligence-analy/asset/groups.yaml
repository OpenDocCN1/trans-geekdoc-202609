    # 摘要


    重度抑郁症（MDD）是一种常见的精神疾病，也是流行精神疾病之一。由于其表型具有异质性且病因复杂，MDD 的诊断和发病预测仍然面临挑战。因此，早期检测诊断生物标志物对于快速干预至关重要。在本研究中，结合人工智能和生物信息学，从包括
    170 名 MDD 患者和 121 名健康对照在公开数据集中挖掘转录组数据。应用了基因集富集分析（GSEA）和机器学习（ML）算法的生物信息学分析。GSEA
    显示，MDD 患者的差异基因主要富集在免疫反应、炎症反应、神经退行性和小脑萎缩通路中。特征选择方法和机器学习提供了对 MDD 改变基因的预测模型，准确率 ≥
    75%。生物信息学与机器学习方法的整合分析鉴定出了关键的 MDD 相关生物标志物，包括 NRG1, CECAM8B, CLE12B, DEFA4, HP,
    LCN2, OLFM4, SERPING1, TCN1 和 THBS1。其中，在突触可塑性和神经传质中活跃的 NRG1 在由混合人群组成的独立极端数据集中，区分
    MDD 患者和健康对照最为稳健可靠。随后使用来自独立 MDD 队列的唾液样本进行了进一步评估。


    **关键词：** 抑郁、重度抑郁症、生物信息学、机器学习、基因表达、脑区域


