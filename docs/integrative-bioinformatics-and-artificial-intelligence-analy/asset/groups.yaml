    tasks. The FS procedure is able to reduce the dimensionality of the data while
    preserving significant information. Considering that the number of features should
    be equal to or smaller than the sample size [30], the following options were chosen:
    First, the number of selected features was equal to the number of samples in the
    dataset, while the second option, the number of selected features was 80% of the
    number of samples. Several methods in the FS procedure (Figure 1.C) were chosen
    using PCA and SelectBest method with ANOVA F-value as a score function. Moreover,
    ML methods such as LR and RF were chosen to extract important features from trained
    models. The methods of important feature extraction are different for LR and RF.
    In the LR model, absolute weights for each feature were ranged in descending order
    and the top N of (N is chosen according to the options above) were selected for
    the next step. RF is a method that fits several decision tree classifiers on various
    splits of the dataset. The importance of each feature was calculated in several
    steps: First, the value of the decrease in impurity criterion for each node associated
    with the feature in each decision tree is calculated, then the sum of values of
    decrease impurity on all nodes is multiplied by the percentage of examples reaching
    these nodes. Weighted sum is a feature of importance in the RF model.


