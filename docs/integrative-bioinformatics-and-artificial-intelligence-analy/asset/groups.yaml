    ## 2. 材料与方法


    ### 2.1. MDD 转录组数据集


    检索基因表达总数据库（GEO）中公开的重度抑郁症（MDD）和健康对照（HCs）转录组数据集（https://www.ncbi.nlm.nih.gov/geo/），以选择合适的基因表达数据集。筛选标准包括：针对人类（Homo
    sapiens）的研究，以及根据精神医学国际实践指南招募的 MDD 患者研究。排除无健康对照样本或存在较大批次效应的研究。选择了符合所有纳入标准的 GSE98793
    数据集并进行处理 [27]。样本分两批进行，每批信息均从表型数据中提取。该数据集包含从 128 名 MDD 患者和 64 名健康对照（HCs）的全血样本中提取的高分辨率基因表达集。使用了
    Affymet 人类基因组 U133-Plus 2.0 基因芯片。MDD 患者的诊断标准为识别出至少两次符合 DSM-IV 或 ICD10 标准的抑郁发作，诊断使用了半结构化精神病学临床评估表（SCAN）。GSE98793
    数据集的人口统计和临床细节列于补充表 S1。


    ### 2.2. 微列归一化与自适应过滤


    Affymetrix 微列覆盖了超过 54,000 个探针。使用内部 R 脚本流水线对原始 CEL 文件进行下载和分析。通过对数转换和批次效应校正消除数据集中的实验影响。接下来，为了归一化并过滤背景噪声，应用了
    Bioconductor（https://www.bioconductor.org/）中的 MAS5 和 GCRMA 包。使用非特异性过滤提取共同变异探针，同时应用自适应过滤识别
    MAS5 值 > 50 且 GCRMA变异系数 > 10% 的探针。然后，对所有 MDD 患者和健康对照的处理后探针进行取集，以识别共同变异探针。将数据集两批所有样本中过滤出的共同探针合并成数据矩阵，并使用
    Broad 研究所软件（https://www.gsea-sigdb.org/gsea/index.jsp）映射到基因列表。对于基因符号的折叠（collapse），选择表达量最大的探针作为基因的表达值。排除映射到管家基因或未分配到任何基因的探针。生物信息学分析的工作流程如图
    1.A 所示。


