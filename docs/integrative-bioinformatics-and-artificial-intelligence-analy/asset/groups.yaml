  mdcn: "\n\n# 印刷前校稿\n\n（原文）\n\n尽管存在 459 种不同的硬件设置和实验变异，但通过迁移学习并在外部数据上重新训练分类器可以提高分类性能。这些结果与\
    \ Pang 和 Yang 的发现 [38] 一致，并进一步支持了迁移学习与其他相关机器学习技术（如领域适应和样本选择偏倚）之间的关系。\n\nMDD 患者差异表达基因（DEGs）的富集分析与免疫反应和炎症反应显著。这些发现与以往关于\
    \ MDD 的转录组研究一致，这些研究确定了关注炎症、神经塑性、神经递质和压力相关基因的重要生物标志物 [39]。此外，这与 Wang 等人的发现一致，MDD\
    \ 患者外血全转录组分析显示，炎症和代谢相关通路是参与 MDD 病理生理机制的主要富集通路 [40]。\n\n抑郁预计会损害大脑的功能。最近的证据强调，抑郁影响大脑的三个主要区域，包括海马体（位于大脑颞叶）、前额叶皮层（位于颞叶前部）和杏仁核（位于颞叶额部）[41]。重要的是，我们通过将\
    \ MDD 相关生物标志物映射到人类大脑区域，显示大脑区域产生了显著的重叠差异表达基因。此外，映射网络分析显示不同额叶脑区之间存在密切的相互连接，表明评估的基因与抑郁中可能改变的认知功能显著相关。这与之前的发现一致，即\
    \ MDD 患者的特征是额叶区域活动减少和边缘系统区域激活增加 [42]，且与其他脑叶相比，额叶被认为是 MDD 中表现出结构性异常最常见的区域 [43]。还有证据显示背外侧皮层、左下额回和吻侧前扣状回存在活动性增强\
    \ [44]。值得注意的是，在已确定的 10 个 MDD 相关生物标志物中，有 6 个生物标志物（CEAC2B, HP, LCN2, OLFM4, SERPING1\
    \ 和 THBS1）与特定的脑区域有关；然而，CEACAM8、DEFA4、NRG1、TCN1 在健康脑区域未显示出明显的差异表达。这些发现似乎得到了以往研究的证实，表明外周血样本中的枢纽基因能够高准确地将\
    \ MDD 与健康对照（HCs）区分开来，尽管这些可靠标记物的某些与大脑差异基因表达不相关 [45]。\n\n这些结果指向了一种可能性，由于大脑塑性，并非所有心理相关生物标志物都遵循通常计算分析假设。这就是为什么机器学习（ML）和计算方法对于获取隐藏的生物指标至关重要的原因。\n\
    \n为了评估不同人群中 MDD 相关生物标志物表达变化的可重复性，我们在另一个具有不同抑郁状况的队列中进行了交叉验证，包括来自独立确认转录组数据集的 MDD\
    \ 患者和健康对照。有趣的是，NRG1 基因被认为是不同抑郁相关状况下区分 MDD 患者和健康对照的最稳健的生物标志物，并可用于随访 MDD 患者的缓解。此外，我们使用\
    \ RT-qPCR 对来自哈萨克斯坦人群的特征 MDD 患者和健康对照的唾液样本中的 NRG1 进行了临床评估。正如我们在转录组数据集中首次显示的那样，MDD\
    \ 患者中 NRG1 上调（p=0.011），这种过表达在我们的 MDD 患者中得到了进一步验证，但没有统计学意义（p=0.05），可能是由于样本量较小。这些发现提示\
    \ NRG1 是 MDD 诊断和预后的液体活检生物标志物。\n\nNRG1 编码神经调节蛋白1，是表皮生长因子（EGF）细胞外配体家族的一员，通过 ErbB\
    \ 信号通路在中枢神经系统（CNS）和周围神经系统（PNS）的维持、发育和修复中发挥重要作用 [46]。若干临床和遗传关联研究报告了 NRG1 基因变异与不同精神疾病（包括抑郁症）易感之间的联系\
    \ [47–49]。此外，分裂症和单相性抑郁等精神疾病患者死后前额叶皮层 NRG1 水平的变化已有报道 [50,51]。一项针对 267 名 MDD 患者的临床研究表明，NRG1\
    \ 相关白质异常与抑郁和焦虑的临床症状有关。我们在 GSE32280 数据的分析中显示，NRG1 是抗抑郁药物治疗反应的预测生物标志物。值得注意的是，NRG1\
    \ 在心理相关疾病中起着关键作用，因为它大量分布在额叶皮层、小脑和中脑。重要的是，前额叶皮层是与应激病理反应调节的最关键脑区域之一 [54]，动物模型显示皮层区域\
    \ Nrg1 功能会导致突触塑性下降和抑制连接增强 [55]。此外，Nrg1 杂合子缺失的小鼠模型显示，青少年期对刺激的敏感性增加 [56]。我们的发现显示，在\
    \ MDD 患者与健康对照的血液和唾液样本中，NRG1 上调导致了反应缺陷 [57–61]。因此，我们认为认为对更大规模的 MDD 患者数据集中的 NRG1\
    \ 进行进一步调查。我们的研究指向，混合人工智能和生物信息学应用可以有助于精神疾病的诊断和治疗。\n\n 5. 结论\n\n总之，使用生物信息学和机器学习方法比较\
    \ MDD 患者与健康对照的转录组变化，确定了与免疫反应和炎症通路相关的 MDD 患者差异表达基因。此外，分析确定了十种有助于监测 MDD 患者的生物标志物组合。其中，NRG1\
    \ 在杏仁核和海马亚区域表达较高，并建议作为 MDD 患者的非侵入性液体活检生物标志物。\n\n 6. 致谢\n\n感谢 Aibike Bektyrsinova\
    \ 女士采集唾液样本。\n\n 7. 资助\n\n此工作由 UoS-Skoltech AI for Life [资助号 AIFoL-2201] 资助（M.S.\
    \ 和 R.H.），由俄罗斯科学基金 [资助号 21-71-1036] 部分支持（M.S.）（机器学习模型的创建、验证和解释），并由 ASPIRE Precision\
    \ Medicine Institute Abu Dubai [资助号 VRI-20-10] 资助（R.H.）。\n\n8. 数据可用性\n\n所有相关数据均可在论文和补充文件中获得。本研究使用的发现数据集\
    \ GSE9793 以及确认数据集 GSE99725、GSE76826、GSE38206 和 GSE32280 可从 Gene Expression Omnibus\
    \ (https://www.ncbi.nlm.nih.gov/) 获取。机器学习流水线代码已上传至 GitHub 公共仓库 (https://github.com/maryjisauto)。\n\
    \n9. 利益声明\n\n无。\n\n 10. 参考文献\n\n（此处保留参考文献格式）\n\n"
