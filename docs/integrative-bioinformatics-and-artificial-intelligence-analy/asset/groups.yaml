    在 FS 步骤中由模型进行。在本次实验中，我们对每组数据进行了总共 100 次交叉验证，每组数据通过 10 折交叉验证程序运行 10 次，以估计所得特征的可靠性。接下来，在选择重要特征后，进行了事后分析（scipy
    库，版本 1.9.1），以评估 MDD 患者与 HCs 之间基因表达的显著差异。为了评估 T 检验的适用性，应用了 Shapiro 检验评估正态分布，并使用
    Levene 检验测试方差齐性，但如果未满足这些假设，则采用 Mann-Whitney U 检验。对于 MDD 患者与 HCs 相比独立和合并数据集的每次比较，显著特征分别列在补充表
    4-6 中。


    ## 3.6. 从数据整合中发现 MDD 相关生物标志物


    将 ML 最终模型识别的基因列表与对第 1 和第 2 批合并数据进行 GSEA 分析获得的高频基因取交集，以识别 MDD 相关生物标志物。由于 ML 模型基于不同的原理，因此揭示了不同的生物标志物，因此从三个最佳模型中提取了重要特征，以增加两种方法重叠的生物标志物集合。ML
    模型产生的 86 个最重要特征与 GSEA 产生的 28 个顶部领先基因之间的交集显示出 10 个共同基因（图 3），包括 CEAM8、CLE12B、DEF4A、HCN、NRG1、M4、SERPING1、TCN1
    和 THBS1。


    ## 3.7. MDD 相关生物标志物的跨脑区域映射


    为了更好地理解 MDD 中大脑结构改变与基因表达变化之间的关联，我们使用来自 HBA 的全脑转录组数据集评估了识别出的 MDD 相关生物标志物的全脑基因表达变化。10
    个 MDD 相关生物标志物的映射显示，跨脑区域存在显著（p<0.05）相关的上调和下调基因，如表 6 所示。网络分析显示不同不同脑区域之间的相互连接，表明评估基因在不同的认知功能和广泛的行为范围内作为一个整体在生物学上相互连接（图
    4）。因此，识别出的 MDD 相关生物标志物能够对大脑可塑性与行为障碍之间的多变量关联进行建模。


    ## 3.8. MDD 相关生物标志物表达变化在不同人群中的重复性


    为了在另一个包含 42 名 MDD 患者和 57 名 HCs 的队列中评估识别出的 MDD 相关生物标志物，选择了具有不同种族（高加索、日本人和中国）的人群的独立外部转录组数据集。对每个数据集分别进行转录组分析，然后对
    MDD 患者与 HCs 的每次比较进行 DEGs 鉴定，并对患者的随访（例如术前后、缓解和治疗）进行分析。所有研究比较总结在**表 7** 中。在不同比较中评估了
    10 个 MDD 相关生物标志物，结果除 *OLFM4* 基因外，所有基因在至少一个 MDD 患者亚组中显示出表达变化（表 7）。重要的是，NRG1（神经调节蛋白
    1）在四个 MDD 人群中的三个中也频繁表达。


    在 GSE99725 数据集中，*NRG1* 在 HCs 中较于 MDD 患者在手术前（FC=0.07, p=0.04）和术后（FC=0.11, p=0.03）上调，但在比较
    MDD 患者术前后时未显示出显著差异（p>0.05）。


    同样，在 GSE76826 数据集中，NRG1 在移除和治疗前在 HCs 中较于 MDD 患者（FC=0.87, p=0.0007）和（FC=0.85, p=0.0005）下调，而
    MDD 患者在移除前后未检测到基因变化。此外，在与 GSE32280 数据集的文曲西平治疗比较中，NRG1 在治疗前后在 HCs 中均较于 MDD 患者分别为（FC=0.44,
    p=0.04）和（FC=1.44, p=0.001）下调，而在比较文曲西平治疗前后的 MDD 患者时为上调（FC=1.5, p=0.001）。此外，对包括发现和外部数据集在内的
    80% 完整数据集进行 ML，并在 20% 的留存数据中进行性能评估，表明在良好的发现数据集上训练的最佳分类器（其中以 LR 为特征选择方法的 LR 最佳模型）在
    5 折交叉验证中显示出0.58±0.05 的 F1 macro 分数，优于基准的 0.38 ±0.04 F1 macro 分数。


    重要的是，NRG1 基因被认为是具有不同种族的独立人群中区分 MDD 患者组和 HC 组之间表现最优的基因之一。综合这些结果，我们建议将 NRG1 作为一种潜在的稳健生物标志物，用于在不同的抑郁相关状况下区分
    MDD 患者和 HCs，并随访 MDD 患者的缓解。


    ## 3.9. NRG1 是一种液体活检和脑相关生物标志物


    为了评估 NRG1 基因作为 MDD 相关诊断生物标志物的潜力，我们首先检查了其基因表达。10 个 MDD 相关生物标志物的映射显示，跨脑区域存在显著（p<0.05）相关的上调和下调基因，如表
    6 所示。网络分析显示不同涉及的脑区域之间的相互连接，表明评估基因在不同的认知功能和广泛的行为范围内作为一个整体在生物学上相互连接（图 4）。因此，识别出的
    MDD 相关生物标志物能够对大脑可塑性与行为障碍之间的多变量关联进行建模。


