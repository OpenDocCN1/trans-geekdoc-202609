    ## 3. Results


    ### 3.1. Identification of the differentially expressed genes among MDD patients


    The differential transcriptomic profile across MDD patients and HCs were analyzed
    using a bioinformatics pipeline, and the result of data distribution before after
    quality control, normalization and filtration of the GSE9793 dataset are shown
    in Figure 1A. Comparing MDD patients to HCs, a total of 3294 and 2088 differentially
    expressed genes (DEGs) were identified, respectively, in batch 1 and batch 2.
    The total of DEGs was merged into a common expression matrix based on the gene
    names to include 1446 common genes between 106 MDD patients and 51 HCs.


