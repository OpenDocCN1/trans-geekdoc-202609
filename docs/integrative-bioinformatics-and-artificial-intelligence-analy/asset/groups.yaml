    # Integrative Bioinformatics and Artificial Intelligence Analyses of Transcriptomics
    Data Identified Genes Associated with Major Depressive Disorders including NRG1


    Amal Bouzid1*, Abdulrahman Midani1#, Maria Zubrikhina2#, Altyngul Kamzanova3,
    Burcu Yener Ilce2, Manzura Zholdassova3, Ayesha M Yusuf1, Poorna Manasa Bhamidimmarri1,
    Hamid A Alhaj1, Almira Kustubayeva3, Alexander Bernstein2, Evgeny Burnaev2, Maxim
    Sharaev2, Rifat Hamoudi1,5,*


    1 Research Institute for Medical and Health Sciences, University of Sharjah, Sharjah,
    UAE.


    2 Applied AI Center, Skolkovo Institute of Science and Technology, Moscow, Russian
    Federation.


    3 The Center for Cognitive Neuroscience, Al Farabi Kazakh National University.


    4 College of Medicine, University of Sharjah, Sharjah, United Arab Emirates.


    5 Division of Surgery and Interventional Science, University College London, London,
    United Kingdom.


    6 ASPIRE Precision Medicine Research Institute Abu Dhabi, University of Sharjah,
    Sharjah, United Arab Emirates.


    *These authors contributed equally to this work.


    *Corresponding Authors:


    Prof Rifat Hamoudi: e-mail: rhamoudi@sharjah.ac.ae


    Dr Amal Bouzid: e-mail: abouzid@sharjah.ac.ae; amalbouzid@gmail.com


    Running Title: Bioinformatics and AI for Identification of MDD-Biomarkers


    # Abstract


    Major depressive disorder (MDD) is a common mental disorder and is among the prevalent
    psychiatric disorders. MDD remains challenging to diagnose and predict its onset
    due to its heterogeneous phenotype and complex etiology. Hence, early detection
    diagnostic biomarkers is critical for rapid intervention. In this study, a mixture
    of AI and bioinformatics were used to mine transcriptomic data from publicly available
    datasets including 170 MDD patients and 121 healthy controls. Bioinformatics analysis
    using gene set enrichment analysis (GSEA) and machine learning (ML) algorithms
    were applied. The GSEA revealed that differentially expressed genes in MDD patients
    are mainly enriched in pathways related to immune response, inflammatory response,
    neurodegeneration and cerebellar atrophy pathways. Feature selection methods and
    ML provided predicted models on MDD-altered genes with ≥ 75% of accuracy. The
    integrative analysis between bioinformatics and ML approaches identified key MDD-related
    biomarkers including NRG1, CECAM8B, CLE12B, DEFA4, HP, LCN2, OLFM4, SERPING1,
    TCN1 and THBS1. Among them, NRG1, active in synaptic plasticity and neurotransmission,
    was the most robust and reliable to distinguish between MDD patients and healthy
    controls amongst independent extremal datasets consisting of a mixture of populations.
    Further evaluation using saliva samples from an independent cohort of MDD.


    **Keywords:** Depression, Major depressive disorder, Bioinformatics, Machine Learning,
    Gene Expression, Brain Regions


