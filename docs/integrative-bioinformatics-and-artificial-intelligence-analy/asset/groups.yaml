    ### 3.2. Enrichment analyses of the DEGs in MDD patients


    To explore the molecular signals and biological processes of the identified DEGs
    in MDD patients compared to HCs, GSEA was performed. It consists of a computational
    method that identifies whether an a priori set of genes shows statistically significant
    and coherent differences between groups around several thousand pre-defined datasets
    including complex molecular mechanisms, immunologic signatures, biological processes,
    molecular activities and cellular structures. The enrichment analysis showed a
    total of 3262 and 2186 significant pathways (p<0.05) were identified in batch
    1 and batch 2, respectively. The GSEA revealed that the DEGs in MDD patients are
    mainly enriched in pathways related to immune response, immune effector processes,
    signaling by cytokines, inflammatory response, proinflammatory and proinflammatory
    mediators, cellular responses to stimuli, neurodegeneration pathways, cerebellum
    pathway, and neuroactive ligand-receptor interactions. The details of all significant
    pathways are listed in Supplementary Table 2.


    ### 3.3. The most informative MDD-related genes from the activated cellular pathways


    To identify the core genes that potentially determine the significant enrichment
    of the corresponding identified genes, the leading-edge analysis was also performed
    for all identified significant genes in each subgroup of MDD and HCs. Subsequently,
    the gene frequency was calculated based on the occurrence of a gene amongst all
    enriched leading-edge core genes from the significant over-represented gene sets
    in each batch. Overall, 353 genes resulted based on the merged data of MDD patients
    compared to HCs (Supplementary Table 3). These identified genes could be the most
    informative genes that play or control biological roles among the over-enriched
    pathways in MDD compared to HCs. The functional annotation of these top leading
    genes in MDD patients further confirms that the immune response-related pathways,
    the inflammatory responses, and metabolic pathways are the main significantly
    enriched in MDD compared to HCs (Figure 2). Next, only genes with large gene expression
    FC>1.5 or <0.5 between MDD patients and HCs were considered. Hence, 28 significantly
    important genes between MDD patients and HCs were left as shown in Table 2.


    ### 3.4. Explainable Machine learning models


    To identify the most sensitive and potent predictive MDD-related genes, we further
    evaluated the above-mentioned DEGs between MDD and HCs with another computational
    method by applying different ML models. The fine-tuned parameters for the best
    models were presented in Table 3. Among all tested models, the best results were
    obtained with 3 final models on the merged batches Table 4. The best model is
    LR as the FS method (number of selected features=157). The final model''s score
    is 0.76±0.11, and ROC-AUC is 0.82±0.12. While, the best model in batch 1 is LR
    (F1=0.73±0.17, ROC-AUC=0.88±0.13) and in batch 2 is SVM (F1=0.7±0.16, ROC-AUC=0.79±0.15).
    Additionally, the performance classification of the best-class classifiers trained
    on the discovery dataset was further evaluated in four well-characterized independent
    transcriptomics datasets from different populations. To compare the performance
    of the best model with baseline F1-macro, we built a dummy classifier that predicts
    the most frequent class label. Due to batch effect and domain shift, the F1-macro
    score was similar to the baseline in the majority of the datasets (Table 5). Hence,
    to resolve this, transfer learning was additionally applied to datasets that the
    10-fold cross-validation has improved for all compared to the classifiers without
    pretraining, and in all cases, the F1-macro score was better than the baseline
    as in Table 5.


