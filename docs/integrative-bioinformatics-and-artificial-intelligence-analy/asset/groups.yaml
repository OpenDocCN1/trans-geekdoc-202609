    随后，对映射的基因表达列表进行绝对基因集富集分析（GSEA），以识别 MDD 患者与健康对照相比的激活和富集的细胞通路（图 1.B）。绝对 GSEA 搜索如前所述，在表达数据上进行
    [28]，使用了从人类分子特征数据库（MSigDB）获取的跨越 7 个注释良好的基因集得到的约 25,828 个注释的细胞通路。然后，对识别出的显著通路进行常规
    GSEA 分析，考虑 p 值 < 0.05 的显著性阈值。对显著激活的通路进行进一步处理，以识别 MDD 患者与健康对照之间的差异富集基因。我们使用的参数为：随机排列次数=1000，排列类型=样本标签，基于相关性的加权=1。对所有显著基因集应用顶部领先基因分析，以识别每个通路的核心领先基因。在下游分析中，进一步探讨了倍数（FC）>
    1.5（上调）和 FC < 0.5（下调）的基因。


