    # 2. Materials and Methods


    # 2.1. Transcriptome MDD datasets


    The Gene Expression Omnibus database (GEO) was searched for publicly available
    MDD and HCs transcriptomic datasets (https://www.ncbi.nlm.nih.gov/geo/) to choose
    the appropriate gene expression datasets. The selection criteria included studies
    for Homo sapiens and MDD patients recruited as international practice guidelines
    in psychiatry. Studies with no healthy control samples or with a large batch effect
    were excluded. The GSE98793 dataset, which met all the inclusion criteria was
    selected and processed [27]. The samples were performed in two batches, with each
    batch information was extracted from phenotypic data. This dataset consists of
    high-resolution gene expression sets retrieved from whole blood samples of 128
    MDD patients and 64 healthy controls (HCs). The Affymet Human Genome U133-Plus
    2.0 gene-chip was used. The MDD patients were diagnosed if at least two episodes
    of depression satisfying DSM-IV or ICD10 criteria were identified using the semi-structured
    Schedule for Clinical Assessment in Neuropsychiatry (SCAN). The demographic and
    clinical details of the GSE98793 dataset are listed in Supplementary Table S1.


    # 2.2. Microarray Normalization and Adaptive Filtering


    The Affymetrix microarray covers more than 54,000 probes. The raw CEL files were
    downloaded and analyzed using an in-house R script pipeline. Logarithmic transformation
    and batch effect correction were performed to eliminate the experimental effect
    on the datasets. Next, to normalize and filter out the background noise, MAS5
    and GCRMA packages from Bioconductor (https://www.bioconductor.org/) were applied.
    Non-specific filtering was used to extract the common variant probes, while adaptive
    filtering was applied to identify probes with MAS5 value > 50 and a coefficient
    of variation >10% in GCRMA. Then, processed probes were intersected across all
    MDD patients and HCs to identify common variant probes. The filtered common probes
    between all samples from the two batches of the dataset were combined into a data
    matrix and mapped to the gene list using Broad Institute software (https://www.gsea-sigdb.org/gsea/index.jsp
    ). For the collapse of gene symbols, probes with maximum expression were selected
    as the expression value for the gene. Probes mapping to housekeeping genes or
    not assigned to any gene were excluded. The workflow of the bioinformatics analysis
    is shown in Figure 1.A.


