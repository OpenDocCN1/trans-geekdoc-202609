    # 4. Discussion


    In the present study, we applied a mixture of bioinformatics and ML approaches
    to mine transcriptomics data of patients with MDD compared to HCs. The study workflow
    is summarized in Figure 7. The integrative analysis of the bioinformatics and
    ML identified 10 potent MDD-related biomarkers including CEACAM8, CLEC12B, DEFA4,
    HP, LCN2, NRG1 OLFM4, SERPING1, TCN1 and THBS1, that showed the most significant
    and strong differential expression between MDD patients and HCs. The identification
    of such biomarkers would provide a better preventive intervention, and insight
    into patients'' responses to anti-depressant therapy, further aiding in monitoring
    the effectiveness of treatment in patients [36]. Therefore, the development of
    specific depression-related biomarkers is crucial to aid in the diagnosis and
    monitoring of patients with depression which may result in earlier diagnosis,
    as well as earlier intervention, and substantially improve the patients'' outcomes
    [37].


    To identify the most sensitive and potent predictive MDD-related genes, different
    ML models were applied for the DEGs between MDD and HCs in the discovery dataset
    (GSE98793). The fine-tuned parameters for the best-built models in each subgroup
    MDD patients to HCs showed that the best model was obtained on the merged dataset
    consisting of LR with LR (number of selected features=157) with a final model''s
    score is 0.76±0.11 and ROC-AUC is 0.82±0.12. Furthermore, evaluation of the classification
    performance measures of this latter best-built classifiers was performed in four
    independent transcriptomics datasets. Overall, the confirmatory analysis showed
    that for each dataset there are differing numbers of genes with different batch
    effects and other type 1 errors inherent within the samples related to the transcriptomics
    platform and the recruited HC and MDD patients. Although this resulted in a different
    set of genes for each dataset (including the discovery and the external datasets),
    our findings showed that the best-built classifiers with retraining performed
    much better than the baseline classifier, for example the dataset GSE76828 the
    F1-score was 0.34 with baseline classifiers, 0.6 with best classifiers without
    retraining and 0.76 with best classifiers with retraining. Additionally, when
    we retrained the best-built model on each external dataset the important features
    remained the same and the values of the LR coefficients didn''t change significantly.
    Thus, by applying transfer learning only the value of coefficients changes, the
    prediction quality is improved significantly. The results would seem to demonstrate
    that the best-built classifiers are better not to be applied as to domain adaptation
    problems such as changes in distributions from'
  md: '

    by the model during the FS step. In this experiment, we performed a total of 100
    folds of cross-validation with 10 runs of a 10-fold cross-validation procedure
    for each group of data to estimate the reliability of the obtained features. Next,
    after selecting the important features, post-hoc analysis (scipy library, version
    1.9.1) was carried out to evaluate the significant differences in the gene expression
    between MDD patients and HCs. To assess the applicability of the T-test, Shapiro
    test was applied to evaluate the normality distribution and Levene''s test was
    used to test the equality of variances, but if these assumptions were not met,
    the Mann-Whitney U-test was applied. For each comparison of the separate and merged
    datasets of MDD patients compared to HCs, the significant features are presented,
    respectively, in Supplementary Tables 4-6.


    ## 3.6. MDD-related biomarkers emerged from Data Integration


    The identified gene lists from ML final models and the top frequent genes from
    the GSEA on the merged data from batch 1 and batch 2 were intersected to identify
    the MDD-related biomarkers. Since ML models are based on different principles
    and therefore reveal different biomarkers, thus, important features from the three
    best models were extracted to increase the set of overlapping biomarkers from
    the two approaches. The overlapping between the 86 most important features resulting
    from ML models and the 28 top leading genes resulting from the GSEA showed 10
    common genes (Figure 3) including CEAM8, CLE12B, DEF4A, HCN, NRG1, M4, SERPING1,
    TCN1 and THBS1.


    ## 3.7. Mapping of the MDD-related biomarkers across Human brain regions


    To get a better understanding of the association between brain structural alterations
    and gene expression changes in MDD, we assessed the brain-wide gene expression
    changes of the identified MDD-related biomarkers, using the whole-brain transcriptomic
    dataset from HBA. The mapping of the 10 MDD-related biomarkers showed significant
    (p<0.05) related up and down-regulated genes across the brain regions as listed
    in Table 6. The network analysis showed interconnections between the different
    involved brain regions suggesting that the evaluated genes are biologically interconnected
    as a group in different cognitive functions and varied range of behaviors (Figure
    4). Thus, the identified MDD-related biomarkers are capable of modeling multivariate
    associations between brain plasticity and behavior disorders.


