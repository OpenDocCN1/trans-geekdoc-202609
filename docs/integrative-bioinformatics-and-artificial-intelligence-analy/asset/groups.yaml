    459 different hardware settings and experimental variation, however, using transfer
    learning and retraining the classifiers on external data can improve the classification
    performance. These results correlate favorably with Pang and Yang''s findings
    [38] and further support the relationship between transfer learning and other
    related machine learning techniques such as domain adaptation, and sample selection
    bias.


    The enrichment analyses of the DEGs in MDD patients are significantly related
    to the immune response and inflammatory responses. These findings are consistent
    with previous transcriptomics studies in MDD which identified important biomarkers
    focusing on inflammation, neuroplasticity, neurotransmitters and stress-related
    genes [39]. Moreover, this is in line with Wang et al. findings showing a whole
    transcriptome analysis in the peripheral blood of MDD patients reported that inflammation
    and metabolism-related pathways are the main over-represented pathways involved
    in the pathophysiology of MDD [40].


    Depression is expected to distress the functional activity of the brain. More
    recent evidence highlights that depression affects three main portions of the
    brain regions including the hippocampus (resides in the temporal lobe of the brain),
    the pre-frontal cortex (located at the front of the temporal lobe) and the amygdala
    (located at the frontal portion of the temporal lobe) [41]. Importantly, we showed
    that by mapping the MDD-related biomarkers across the Human brain regions, significant
    overlapped differentially expressed genes the brain regions resulted. Furthermore,
    the mapping network analysis showed closed interconnections between the different
    frontal brain regions suggesting that the evaluated genes are significantly associated
    with cognitive functions which are probably altered in depression. This is in
    agreement with previous findings showing that patients MDD are characterized by
    decreased brain activity in frontal areas and increased activation in limbic regions
    [42], with the frontal lobe proposed to be the most common region to manifest
    anatomic abnormalities in MDD compared to the other brain lobes [43]. There is
    also evidence of hyperactivity in the dorsolateral cortex, left inferior frontal
    gyrus, and rostral anterior cingulate gyrus [44]. Notably, we ascertained out
    of the ten identified MDD-related biomarkers, six biomarkers (CEAC2B, HP, LCN2,
    OLFM4, SERPING1, and THBS1) were related to a specific subset of brain regions,
    however; CEACAM8, DEFA4, NRG1, TCN1 do not show a distinct differential expression
    on the brain areas of healthy. These findings appear to be substantiated by previous
    studies revealing that hub-genes in peripheral blood samples are capable to classify
    MDD from HCs with high accuracy, although some these reliable markers were not
    correlated with the brain differential gene expression [45].


    These results point to the probability that due to brain plasticity, necessarily
    all mental-related biomarkers follow the usual computational analysis hypothesis.
    That is why the ML and computational approaches are of the highest importance
    to retrieve hidden biological indicators.


    To evaluate the reproducibility of identified MDD-related biomarkers expression
    changes across different populations, we performed cross-validation in another
    cohort with different conditions of depression including MDD patients and HCs
    from independent confirmation transcript datasets. Interestingly, the NRG1 gene
    resulted as the most robust biomarker to differentiate between MDD patients and
    HCs under different depression-related conditions and as well to follow-up the
    MDD patients'' remission. Furthermore, we performed a clinical evaluation of the
    NRG1 in saliva samples of characterized MDD patients and HCs from the Kazakhstan
    population using RT-qPCR. As we first showed in the transcriptomic dataset, the
    up-regulation of NRG1 in MDD patients (p=0.011), the over-expression was further
    validated in our MDD patients but with no statistical significance (p=0.05), likely
    due to the small sample size. These findings suggest NRG1 as a liquid-biopsy biomarker
    for MDD diagnosis and prognosis.


    NRG1, coding for neuregulin1, is a member of the epidermal growth factor (EGF)
    family of extracellular ligands that present an important role in the maintenance,
    development and repair of the central nervous system (CNS) and peripheral nervous
    system (PNS) through the ErbB signaling pathway [46]. Several clinical and genetic
    association studies have reported the linkage between NRG1 gene variations and
    susceptibility to different psychiatric disorders including depression [47–49].
    Furthermore, changes in NRG1 expression levels in the post-mortem pre-frontal
    cortex of patients with major psychiatric disorders such as schizophrenia and
    unipolar depression have been consistently reported [50,51]. A clinical study
    with 267 MDD patients suggested NRG1-linked white matter abnormalities were associated
    with clinical symptoms of depression and anxiety [52]. NRG1 seems to be a predictive
    biomarker of the response to pharmacological antidepressant treatment as we showed
    in our analysis of the dataset (GSE32280), NRG1 changes the expression profile
    in the MDD patients compared to HCs before and after Venlafaxine treatment.


    It is worthy of noting that NRG1 plays a critical role in mental-related disorders
    as it is largely dispersed in the frontal cortex, cerebellum and midbrain. Importantly,
    the prefrontal cortex is among the most critical brain regions that are related
    to the regulation of the pathological response to stress [54], fluctuations in
    behavior, cognitive functions and endocrine responses [55]. Furthermore, animal
    model studies showed that the disturbing Nrg1 function within the cortical region
    resulted in decreased synaptic plasticity and augmented inhibitory connections
    [56]. Moreover, mice with heterozygous KO deletion of Nrg1 showed different schizophrenia-related
    disorders and advanced sensitivity to stress during adolescence [57]. Our findings
    showed up-regulation of the NRG1 in the MDD patients compared to HCs in both blood
    and saliva samples which per several mice models studies showed that increases
    in the NRG1 expression resulted in deficits in the response to a stimulus [58–61].


    Thus, we believe a further investigation of the NRG1 biomarker in a larger clinical
    dataset of MDD patients is warranted. The evidence from our study points towards
    the idea that hybrid AI and Bioinformatics applications can greatly help in the
    diagnosis and treatment of mental disorders.


    ## 5. Conclusion


    In conclusion, integrative analysis using bioinformatics and ML approaches to
    compare transcriptomics changes of MDD patients to HCs identified DEGs in MDD
    patients which are associated with immune response and inflammatory pathways.
    In addition, the analysis identified ten biomarkers panels that can aid in the
    diagnosis and monitoring of patients with MDD. Amongst those biomarkers, NRG1
    exhibits higher expression in the amygdala and hippocampus brain subregions and
    was suggested as a non-invasive liquid-biopsy biomarker for the diagnosis of MDD
    patients.


    ## 6. Acknowledgments


    We would like to acknowledge Ms. Aibike Bektyrsinovova for her contribution to
    the collection of saliva samples.


    ## 7. Funding


    This work was funded by the UoS-Skoltech Collaborative AI for Life [grant # AIFoL-2201]
    to (M.S and R.H.), partially supported by the Russian Science Foundation [grant
    number: 21-71-10136] to (M.S.). (Machine Learning models creation, validation
    and interpretation), and was funded by ASPIRE Precision Medicine Research Institute
    Abu Dubai [grant # VRI-20-10] to (R.H.).


    ## 8. Data Availability


    All the relevant data are available in the paper and the Supplementary files.
    The data used in this study from the sets GSE98793 for the discovery sets and
    the sets GSE99725, GSE76826, GSE38206 and GSE32280 for confirmation sets are available
    from Gene Expression Omnibus (https://www.ncbi.nlm.nih.gov/). The machine learning
    pipeline sourcecode is uploaded to a publicly available repository at GitHub (https://github.com/maryjisauto).


    ## 9. Declarations of interest


    None.


