    ## 4. Discussion


    In the present study, we applied a mixture of bioinformatics and ML approaches
    to mine transcriptomics data. The study workflow is summarized in Figure 7. The
    integrative analysis of bioinformatics and ML identified 10 potent biomarkers
    including CEAM8, CLE12B, DEFA4, HCN, NRG1, OLFM4, SERPING1, TCN1 and THBS1, that
    showed the most significant and strong differential expression between MDD patients
    and HCs.

