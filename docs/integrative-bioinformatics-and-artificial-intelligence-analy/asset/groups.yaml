    specific biomarkers

    85 to improve MDD diagnosis and treatment.


    86 Studies have shown that MDD affects the functional activity of the brain which
    can be

    87 identified by analyzing data on aberrations in the neuronal network [17,18].
    Moreover, the

    88 heterogeneity of depressive disorders may also be related to neuronal plasticity
    correlated with

    89 different symptomatology [19]. Besides, it is suggested that MDD results from

    90 systemic changes in the signaling and biochemical pathways involved in the
    regulation of

    91 moods, cognitive functions and position [20]. Therefore, a comprehensive understanding
    of

    92 affected or associated biological pathways in MDD is of high importance to
    reveal

    93 the molecular mechanism of MDD and to identify accurate targets for the MDD
    diagnosis.


    94 To date, machine learning (ML) as an application of AI approaches is successfully

    95 applied in medical studies, by training computer models to process and understand
    complex

    96 patterns within big-data which facilitate classifications or predictions of
    new cases [21,22].

    97 Moreover, using OMiCs strategies is amongst the most applied approaches at
    the forefront of

    98 personalized medicine in psychiatry with high efficiency [22,23], such as transcriptomics

    99 which showed increasing evidence of the potential to detect, and substantially
    improve the

    100 treatment of such complex cognitive disorders [24,25]. Furthermore, there
    is a rising interest

    101 in using integrative Omics and neuroimaging data to understand how an altered
    genetic profile

    102 in psychiatric disorders could influence brain structure and function. This
    can provide a deeper

    103 understanding of molecular mechanisms and uncover endotypes-neurobiological

    104 changes because of genes implicated in depression [26].


    105 In this study, the key aim is to compare transcriptomics data of MDD patients
    to healthy

    106 controls using bioinformatics and ML approaches and to identify key biomarkers
    that can aid

    107 in the diagnosis and prediction of the onset of patients with depression.


