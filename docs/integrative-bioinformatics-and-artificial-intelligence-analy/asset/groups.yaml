    For the discovery dataset, the performances of all models showed ≥ 75% of accuracy
    for both and separate batches, consequently, we decided to include features from
    the best models of the separate and merged data for the downstream analysis. We
    included the top 20 important features for batch 1, batch 2 and merged batches.
    The score for each feature was computed as a share of all, which particular feature
    was selected.


