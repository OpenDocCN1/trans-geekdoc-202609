    were evaluated across different comparisons to show that all these genes, except
    *OLFM4* gene, were showing expression changes in at least one subgroup of MDD
    patients (Table 7). Importantly, NRG1 neuregulin1, was also frequently expressed
    in three out of four MDD populations.


    In the GSE99725 dataset, the *NRG1* was up-regulated in HCs compared to MDD patients
    (FC=0.07, p=0.04) before and after (FC=0.11, p=0.03) surgery, however it didn''t
    show significant variation (p>0.05) when comparing MDD patients before and after
    surgery.


    Likewise, in the GSE76826 dataset, the NRG1 was down-regulated in HCs to MDD patients
    before removal and treatment (FC=0.87, p=0.0007) and (FC=0.85, p=0.0005), while,
    no gene changes were detected among MDD patients before and after removal. Furthermore,
    in the case of Venlafaxine treatment compared to the GSE32280 dataset, the NRG1
    was down-regulated in HCs compared to MDD patients before and after the treatment
    (FC=0.44, p=0.04) and (FC=1.44, p=0.001), respectively, it was up-regulated when
    comparing MDD patients before and after Venlafaxine treatment (FC=1.5, p=0.001).
    Furthermore, the ML on 80% of the entire datasets including the discovery and
    external datasets along with performance evaluation in the 20% hold showed that
    the best-classifiers trained on the merry discovery dataset which of the LR best
    model with LR as the feature selection method showed a 0.58±0.05 F1 macro score
    on 5-fold cross-validation which was better than baseline with 0.38 ±0.04 F1 macro
    score.


    Importantly, the NRG1 gene was considered among the most performing genes to distinguish
    between MDD patients and HC groups among the independent populations with diverse
    ethnicities. These results together, we suggest NRG1 as a potential robust biomarker
    to differentiate between MDD patients and HCs under different depression-related
    conditions as well as follow up the MDD patients remise.


