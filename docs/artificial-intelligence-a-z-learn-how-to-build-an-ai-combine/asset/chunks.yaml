    # TCP/IP Weaknesses


    ## Teardrop Attack


    Another attack that relies on poor TCP/IP implementation is **Teardrop**, which
    exploits defects in the way systems reassemble IP packet fragments.


    On the Internet, an IP packet may be broken up into smaller pieces. Each of these
    still has the original IP packet''s header, as well as an offset field that identifies
    which bytes of the original packet it contains. With this information, an ordinary
    broken packet is reassembled at its destination and the network continues uninterrupted.


    When a Teardrop attack hits, your server is bombarded with IP fragments that have
    overlapping offset fields. If your server or router can''t disregard these fragments
    and attempts to reassemble them, your system will crash quickly.


    If your systems are up-to-date, or if you have a firewall that blocks Teardrop
    packets, you shouldn''t have any trouble.


    ## SYN Attack


    Another old but effective DDoS attack method is the **SYN attack**.


    SYN works by taking advantage of the protocol handshake between two Internet applications.
    It starts an application session by sending a TCP `SYN` (synchronization) packet
    to another program. That application then replies with a TCP `SYN-ACK` acknowledgment
    packet; the first program then responds with an `ACK` (acknowledgment). Once the
    applications have made their handshake, they''re ready to work with each other.


    A SYN attack overwhelms its victim with a flood of TCP `SYN` packets. Every `SYN`
    packet forces the targeted server to produce a `SYN-ACK` response and then wait
    for the appropriate `ACK`. This quickly leads to a situation where outstanding
    `SYN-ACKs` pile up in a backlog queue. When the backlog queues fill up, the system
    stops acknowledging incoming `SYN` requests.


    If the SYN attack includes `SYN` packets with bad source IP addresses, the situation
    grows worse more quickly. In such a case, when the `SYN-ACKs` are sent out, the
    `ACK` never comes back. The quickly overfilling backlog queue usually puts an
    end to legitimate application `SYN` requests getting through.


    ### Land Attack


    A variation on this, the **Land attack**, employs spoofed `SYN` packets with IP
    addresses forged to look like they come from within your network. The SYN attacks
    appear to be coming from within your firewall, adding to your problems.


    Most modern operating systems and firewalls can stop SYN attacks. Another easy
    way to prevent SYN attacks is to set your firewall to block all incoming packets
    with known bad source IP addresses. This list should include external packets
    that bear spoofed IP addresses from the following IP ranges, which are reserved
    for internal use only:


    - `10.0.0.0` to `10.255.255.255`

    - `127.0.0.0` to `127.255.255.255`

    - `172.16.0.0` to `172.31.255.255`

    - `192.168.0.0` to `192.168.255.255`


    ## Smurf Attack and UDP Flood


    Why should attackers worry about sneaking in when they can simply bulldoze your
    systems? That''s the approach that the **Smurf attack** and the User Datagram
    Protocol (UDP) flood use.


    ### Smurf Attack


    When you''re Smurfed, your enemy floods your router with Internet Control Message
    Protocol (ICMP) echo request packets—a special kind of ping packet. Each packet''s
    destination IP address is also your broadcast address, which causes your router
    to broadcast the ICMP packets to all your network''s hosts. With a large network,
    this quickly leads to an electronic traffic jam of mammoth proportions.


    As with the Land attack, if the attacker combines Smurfing with spoofing, matters
    get even worse.


    The simple way to avoid Smurfing is to:


    1. Turn off broadcast addressing at your router or switch.

    2. Set your firewall to block ICMP echo requests.

    3. Set your server so it won''t respond to requests to send ICMP packets to IP
    broadcast addresses.


    These changes won''t interfere with your network''s normal operations because
    few applications need IP''s broadcast features.


    ### UDP Flood


    It''s not as easy to deal with UDP flood DDoS attacks, since some applications,
    like Domain Name System (DNS) and Simple Network Management Protocol (SNMP), use
    UDP.


    In a UDP flood, an attacker spoofs a call to connect one system''s UDP `chargen`
    (character generator) service—a test program that generates characters for received
    packets—with another system''s UDP echo service. The result? `chargen`''s semi-random
    characters are reflected back and forth between systems, starving legitimate applications''
    bandwidth needs.


    One way to prevent UDP attacks is to disable or filter all UDP service requests
    for your host. As long as you allow non-service UDP requests, normal applications
    that require UDP or use it as a backup data transport protocol will continue to
    work normally.


    # Brute Force


    With all these ways to stop DDoS attacks, you might think DDoS attacks would be
    no more difficult to handle than spam.


    Wrong. When any malcontent can co-opt hundreds to tens-of-thousands of PCs to
    launch DDoS assaults on your Web sites, there are no easy, cheap ways to defend
    against them. All they have to do is ask for Web pages, which may or may not exist,
    and have all of them do so as many times in a second as they can manage.


    Malware like **Conficker** puts hundreds of thousands of Windows PCs at the hands
    of would-be attackers. The resulting tidal waves of direct attacks won''t be stopped
    by a few dikes and storm surge walls.


    You can only change servers, which is what **WikiLeaks** tried with Amazon Web
    Services, or vastly increase your Web hosting site resources in an attempt to
    stem the flood.

    '
  trans: '


    # TCP/IP 弱点


    ## Teardrop 攻击


    另一种依赖于糟糕的 TCP/IP 实现的攻击是 **Teardrop（泪滴攻击）**，它利用了系统重组 IP 数据包片段方式中的缺陷。


    在互联网上，一个 IP 数据包可能会被分解成更小的片段。每个片段仍然包含原始 IP 数据包的头部，以及一个标识其包含原始数据包中哪些字节的偏移字段。有了这些信息，普通的破碎数据包会在目的地重组，网络继续不间断运行。


    当 Teardrop 攻击发生时，你的服务器会遭到拥有重叠偏移字段的 IP 片段的轰炸。如果你的服务器或路由器无法丢弃这些片段并尝试重组它们，你的系统将迅速崩溃。


    如果你的系统是最新的，或者你有防火墙阻挡 Teardrop 数据包，你就不应该有任何麻烦。


    ## SYN 攻击


    另一种古老但有效的 DDoS 攻击方法是 **SYN 攻击**。


    SYN 攻击通过利用两个互联网应用程序之间的协议握手来工作。它通过向另一个程序发送一个 TCP `SYN`（同步）数据包来启动一个应用程序会话。该应用程序随后用一个
    TCP `SYN-ACK` 确认数据包回复；第一个程序再用一个 `ACK`（确认）进行响应。一旦应用程序完成了握手，它们就准备好相互协作了。


    SYN 攻击用大量的 TCP `SYN` 数据包淹没受害者。每个 `SYN` 数据包都迫使目标服务器产生一个 `SYN-ACK` 响应，然后等待相应的 `ACK`。这很快会导致未完成的
    `SYN-ACK` 堆积在积压队列中。当积压队列填满时，系统将停止确认传入的 `SYN` 请求。


    如果 SYN 攻击包含带有错误源 IP 地址的 `SYN` 数据包，情况会更快恶化。在这种情况下，当发出 `SYN-ACK` 时，`ACK` 永远不会返回。迅速填满的积压队列通常会阻止合法的应用程序
    `SYN` 请求通过。


    ### Land 攻击


    对此的一种变体，**Land 攻击**，采用伪造的 `SYN` 数据包，其 IP 地址被伪造得看起来像是来自你网络内部。SYN 攻击看起来像是来自你防火墙内部，增加了你的麻烦。


    大多数现代操作系统和防火墙可以阻止 SYN 攻击。防止 SYN 攻击的另一个简单方法是将防火墙设置为阻挡所有带有已知错误源 IP 地址的传入数据包。此列表应包括带有来自以下
    IP 范围（仅保留供内部使用）的伪造 IP 地址的外部数据包：


    - `10.0.0.0` 到 `10.255.255.255`

    - `127.0.0.0` 到 `127.255.255.255`

    - `172.16.0.0` 到 `172.31.255.255`

    - `192.168.0.0` 到 `192.168.255.255`


    ## Smurf 攻击和 UDP Flood


    当攻击者可以直接推平你的系统时，为什么还要费心潜入？这就是 **Smurf 攻击** 和用户数据报协议（UDP）洪水攻击所采用的方法。


    ### Smurf 攻击


    当你遭遇 Smurf 攻击时，你的敌人用互联网控制消息协议（ICMP）回显请求数据包——一种特殊的 ping 数据包——淹没你的路由器。每个数据包的目标 IP
    地址也是你的广播地址，这导致你的路由器将 ICMP 数据包广播给你网络中的所有主机。对于大型网络，这会迅速导致规模巨大的电子拥堵。


    与 Land 攻击一样，如果攻击者将 Smurf 攻击与欺骗结合使用，情况会变得更糟。


    避免 Smurf 攻击的简单方法是：


    1.  在路由器或交换机上关闭广播寻址。

    2.  设置防火墙阻挡 ICMP 回显请求。

    3.  设置服务器使其不响应发送 ICMP 数据包到 IP 广播地址的请求。


    这些更改不会干扰你网络的正常操作，因为很少有应用程序需要 IP 的广播功能。


    ### UDP Flood


    处理 UDP 洪水 DDoS 攻击没那么容易，因为一些应用程序，如域名系统（DNS）和简单网络管理协议（SNMP），使用 UDP。


    在 UDP 洪水攻击中，攻击者伪造一个调用，将一个系统的 UDP `chargen`（字符生成器）服务——一个为接收到的数据包生成字符的测试程序——与另一个系统的
    UDP echo 服务连接起来。结果？`chargen` 的半随机字符在系统之间来回反射，挤占了合法应用程序的带宽需求。


    防止 UDP 攻击的一种方法是为你的主机禁用或过滤所有 UDP 服务请求。只要你允许非服务 UDP 请求，需要 UDP 或将其作为备用数据传输协议的正常应用程序将继续正常工作。


    # 暴力破解


    有了这么多阻止 DDoS 攻击的方法，你可能会认为 DDoS 攻击处理起来不会比垃圾邮件更难。


    错了。当任何不满分子都可以强行控制数百到数万台 PC 来对你的网站发起 DDoS 攻击时，没有简单、廉价的方法来防御它们。它们只需要请求网页，这些网页可能存在也可能不存在，并让所有僵尸网络节点每秒尽可能多地这样做。


    像 **Conficker** 这样的恶意软件将数十万台 Windows PC 置于潜在攻击者的控制之下。由此产生的直接攻击海啸不会被几座堤坝和防风墙挡住。


    你只能更换服务器，这正是 **WikiLeaks** 尝试过的，当时他们使用了 Amazon Web Services，或者极大地增加你的网站托管资源，试图遏制洪水。


    '
