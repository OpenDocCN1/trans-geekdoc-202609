  trans: "\n# 前言\n\nNileriver Publications 是世界上最优秀的图书出版商。我们为学习环境出版优质图书。我们在大众友好型图书方面取得成功的一个显著秘诀在于，我们注意到在所有活动中，为了满足一个或多个不同目标，需要采用不同的项目开发方法，并努力将所有内容融入书中。我们编写图书的主要目标是将学科知识传授给所有层次的学习者，从基础到高级。我们坚信知识共享，并开展大量活动向世界分享知识，您可以从我们的网站获取这些内容。凭借迄今出版\
    \ 20,000 本书的经验，我们变得越来越好，并越来越贴近学习者，这完全符合当时的需求。Nileriver 团队自豪地收到了数千条评价，称我们的团队在提供解决方案方面是最棒的。我们将继续努力工作，为未来的岁月提供最好的内容。\n\
    \n# 目录\n\n- 前言\n- 强化学习基础\n  - 强化学习\n  - 探索与利用\n  - 什么是强化学习\n  - 1/ 置信区间上界强化学习\n\
