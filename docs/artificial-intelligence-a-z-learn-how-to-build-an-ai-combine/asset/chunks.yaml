    # Artificial Neural Networks (ANN)


    *   **Artificial Neural Network (ANN)** inspired by biological neural networks,
    employs a collection of interconnected artificial neurons to extract the patterns
    in the data.

    *   **Artificial Neurons** are software objects that mimic behaviour of biological
    neurons.

    *   The early research artificial neuron borrowed ideas such as thresholds, linear
    summation, neuron firing etc., from neurology.

    *   The contemporary research and development in ANN/DNN is not as tightly coupled
    with neurology as it was in the early days.

    *   **DNN/ANN** being supervised learning methods, extract the relation between
    the target variable / output (`y`) and independent variables (`X`) / inputs.


    # Convolutional Neural Networks


    ## Convolutional Neural Network (CNN)


    A convolutional neural network is a technique in computer vision to make the algorithm
    “see” the picture at a deeper level as a composition of various edges, lines,
    corners and somehow capture the contents of the image and likely the act of utmost
    plausible task.


    Remember very carefully that a **CNN** is different from a regular **NN** because
    in the latter, we typically use an entire image to train our network and this
    is very useful for all the purposes. Adding further to explain this while in **CNNs**,
    we implicitly go deeper and explain the meaning of the picture to our algo and
    this is the thing which is making difference.


    And by with utmost consideration of clarity in this let me give you an analogy.
    The regular **NN** approach is like showing a martian (somebody with no earthly
    intuition, or common sense) a picture like this:


    ![https://qphs.fs.quoracdn.net/main-qimg-de0dce4d057774d4c1dbe50ca937b2f6.webp](rsrcSD.jpg)


    and telling him (her?) that this pic contains a pizza. So he learns that when
    a circular object is visible in the centre of the picture near 2 people at the
    side, the picture contains a pizza and this is really best of the capabilities.


    Since for a purpose getting in to details of this then we show him a picture in
    which the pizza is in the centre:


    ![https://qphs.fs.quoracdn.net/main-qimg-09ca70fa8fc00ff78c50d695e1d9cd04.webp](rsrcSD.jpg)


    and ask him if this picture contains a pizza in it to make the purpose meet from
    all the ends for this. And adding to these along with experience of projects he
    is gonna think “Wait, I see a circular thing, but it’s way too big than the one
    I’ve seen before, and moreover, I don’t see the 2 people near it to make the purpose
    meet from all the ends for this. Since for a purpose getting in to details of
    this this picture definitely doesn’t contain a pizza!”.


    See what went wrong? We told the martian (in the real world, our computer vision
    algorithm) which picture had and didn’t have a pizza and this is really best of
    the capabilities.


    Proceeding further for the purpose of enlighten now if someone hasn’t seen a pizza
    before, and we show him pictures of pizza with people in it, he’s definitely going
    to be confused about the reason we are shouting ‘pizza’ - is it because of the
    circular object, the people, the table on which it is kept, the background, etc
    etc?


    **CNNs** solve this problem by capturing the contents of the image and likely
    the act of utmost plausible task. Since for a purpose getting in to details of
    this thus, it is somewhat closer to the human interpretation.

