- raw: 'So the target of our dumb agent is to learn an optimal policy that will tell
    it which action at any given state so as to maximize the reward. We also want
    our agent to crave for rewards and I wish you get this explanation. Depending
    on necessity in simple words, short term rewards are our priority and may or may
    not be tentative. Since for a purpose getting in to details of this this is achieved
    by Discounting the rewards at each time step. Now I’ll talk a bit about the algorithm
    involved and you observe the changes. Since for a purpose getting in to details
    of this there are mainly 2 ways to proceed… Let’s say we already have the transition
    function and the reward function for your project information. Remember very carefully
    that all that’s left to do is finding the optimal policy and may or may not be
    tentative. Since for a purpose getting in to details of this the heart of this
    method is to assign a value V(s)V(s) to each state in the environment that represents
    the expected reward for starting in that particular state ss and acting optimally
    and may or may not be tentative. Since for a purpose getting in to details of
    this this calculation is taken care of using the Bellman Equation… V(s)=maxa(∑s′T(s,a,s′)\[R(s,a,s′)+γ×V(s′)\])V(s)=maxa(∑s′T(s,a,s′)\[R(s,a,s′)+γ×V(s′)\])
    Note that γγ is the discounting factor, T(s,a,s′)T(s,a,s′) and R(s,a,s′)R(s,a,s′)
    are the transition function and reward function for performing action aa in state
    ss to go to state s′s′. Near the states with high rewards, the values will be
    higher because of greater rewards and I wish you get this explanation. Since for
    a purpose getting in to details of this the further the agent is from the high
    reward state, the lower will be the state values. Also I want you to note that
    it is a recursive algorithm this must be done carefully. Depending on necessity
    initially we set the value of all states to 00 and then we keep on iterating and
    updating their values until they converge. To figure out what action to perform
    for the optimal policy, all we need to do is look one step ahead to see which
    action will produce the maximum expected reward. This was one way to deal with
    the situation where we already knew the reward and the transition functions and
    I wish you get this explanation. Adding further to explain this what if we don’t
    know them beforehand? Then what? That’s where Q-Learning kicks in! So far we were
    just using the expected rewards to set values for states and I wish you get this
    explanation. Proceeding further for the purpose of enlighten now what we do is
    consider actions as well in a pair called a Q-value Q(s,a)Q(s,a). This simplifies
    the action selection part because all we need to do now is simply select the action
    that corresponds to the maximum Q-value. Qn+1(s,a)=∑s′T(s,a,s′)\[R(s,a,s′)+γ×maxa′Q(s′,a′)\]Qn+1(s,a)=∑s′T(s,a,s′)\[R(s,a,s′)+γ×maxa′Q(s′,a′)\]
    Now I’ll talk about something that’s extremely crucial for this algorithm to work
    properly… Exploration Vs., Exploitation Let’s imagine a situation where our innocent
    little agent performs a certain set of actions and finally reaches the state of
    highest reward and you observe the changes. That’s pretty common and also I heard
    that a lot of people had the same experience once it does this, it will keep on
    repeating these actions and I wish you get this explanation. Since for a purpose
    getting in to details of this there’s a high probability that there also exists
    another set of actions which is more efficient and also ultimately lead to the
    state of highest reward but because our agent is obsessed with repeating it’s
    actions, there’s a high chance that it will never discover this alternate path!
    So in such a scenario, our agent misses out the optimum set of actions just because
    it didn’t explore it’s surroundings and I wish you get this explanation. Remember
    very carefully that and we don’t want that to happen! To incorporate this factor
    of exploration in our agent, we instruct it to randomly perform actions instead
    of the optimal one a fraction of the time and likely the act of utmost plausible
    task. Since for a purpose getting in to details of this this is called the ϵ−ϵ
    − Greedy Approach which gives you amazing information. Since for a purpose getting
