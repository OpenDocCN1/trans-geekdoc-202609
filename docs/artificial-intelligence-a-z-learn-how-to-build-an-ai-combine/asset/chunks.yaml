  fmt: "\n# DDPG与探索限制\n\n根据定理可知：DDPG会限制项目的探索能力。为解决此问题，需引入离策略学习算法，使学习智能体能充分探索状态-动作空间。\n\
    \n# 机器学习中的最先进算法\n\n很难定义什么是“最先进”算法，因为不存在单一算法能解决所有类型的ML问题。ML算法的选择实际上取决于项目的约束条件。结合项目经验，可列举表现良好的算法及其适用场景：\n\
    \n## 神经网络\n经过良好定制能获得最佳结果（个人观点）。\n\n## SVM + 核函数\n某种增强版神经网络，适合需要良好性能但缺乏定制经验和知识的项目。\n\
    \n## 决策树\n快速、基于规则、可解释，但高度不稳定。\n\n## 随机森林\n通过采样数据创建大量树，综合能力最强。适合有足够训练实例且需要良好学习率的项目。\n\
    \n## AdaBoost\n采用集成弱分类器的提升方法。\n\n# 强化学习中的延迟奖励\n\n正确处理延迟奖励极其困难，若能解决即实现了通用智能。以冰箱为例说明：\n\
    \n1. **生物驱动力**：饥饿是坏事。\n2. **不进食 → 后来饥饿** → 不进食是坏事。\n3. **冰箱空 → 无法进食** → 冰箱空是坏事。\n\
    4. **冰箱半空 → 后来空** → 冰箱半空是坏事。\n5. **超市买东西 → 冰箱变满** → 买东西是好事。\n6. **没钱 → 无法买东西**\
    \ → 有钱是好事。\n7. **有工作 → 有钱** → 有工作是好事。\n\n**结论**：从基本生理驱动力（饥饿）出发，构建启发式认知“工作是好事”。人类通过多层抽象实现延迟满足。\n\
    \n## 形式化解释\n\n- **监督学习**：输入情境描述及标签，核心是寻找强大方法区分情境。\n- **强化学习**：根据度量区分好坏，用于指导行动。由此创建中间表示，最终坍缩为单一维度的奖励度量。仍存在数值稳定性未解决问题，需精心调参。\n\
    - **情境预测学习**：处理延迟奖励的终极方法。\n  1. 先用强化学习识别最重要情境。\n  2. 预测情境转移（下一情境）。\n  3. 将未来情境的奖励反向传播至当前情境。这显然会引入数值稳定性问题。\n\
    \n# 人工神经网络\n\n## 神经网络概念\n\n在信息技术中，神经网络是模仿人脑神经元运作的硬件/软件系统。神经网络（亦称人工神经网络）是深度学习技术的一种。商业应用主要集中在复杂信号处理或模式识别（如支票手写识别、语音转文本、石油勘探数据分析、天气预测、人脸识别）。\n\
    \n## 结构特点\n\n- 大量处理器并行运行，分层排列。\n- **第一层**：接收原始输入（类似视神经）。\n- **后续层**：接收上一层输出（类似远离视神经的神经元接收信号）。\n\
    - **最后一层**：产生系统输出。\n\n## 自适应性\n\n神经网络具有自适应性，随初始训练及后续运行自我修改。最基本的学习模型是加权输入流，每个节点对前驱输入的重要性加权。有助于得出正确答案的输入权重更高。\n\
    \n## 描述维度\n\n- **深度**：输入输出间的层数。\n- **隐藏节点数量**。\n- **每个节点的输入输出数量**。\n\n经典设计的变体允许信息在层间进行各种形式的前向和反向传播。\n\
    \n## 通用函数逼近器\n\n可将神经网络视为**通用函数逼近器**。\n\n### 示例：旅行预算分配\n\n**场景**：有固定资金需分配至5个旅行地点，但不知如何分配；拥有往年旅行花费数据。\n\
    \n**训练**：将历史数据输入神经网络，网络学习函数 `f(总金额) → 花费明细`。\n\n**预测**：训练完成后，输入新总金额，网络输出分配方案。\n\
    \n**结论**：存在将输入映射到输出的真实函数，但初始未知。网络根据历史数据学习该函数的近似，用于预测未来未知输出。\n\n# 现代神经网络\n\n在深度学习中，人工神经网络是构建模型的核心，其工作原理基于人脑结构与功能。\n\
    \n## 生物神经网络结构\n\n人脑由神经元组成，通过树突接收输入，经轴突向其他神经元输出。\n\n![生物神经网络结构](https://qphs.fs.quoracdn.net/main-qimg-416ed019315074742a045229084bb963)\n\
    \n## 人工神经网络起源\n\n术语源自 **Warren S. McCulloch** 和 **Walter Pitts** 的工作。网络由称为**节点**的人工神经元组成，处理信息并执行运算。\n\
    \n## 网络层级\n\n神经网络包含3个层级：\n"
