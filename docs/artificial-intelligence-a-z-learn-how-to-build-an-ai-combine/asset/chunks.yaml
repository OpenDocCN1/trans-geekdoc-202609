  fmt: '

    ### Input Layers

    This layer takes large volumes of input data in the form of texts, numbers, audio
    files, image pixels, etc.


    ### Hidden Layers

    Hidden layers are responsible for performing mathematical operations, pattern
    analysis, feature extraction, etc. There can be multiple hidden layers in a neural
    network.


    ### Output Layer

    This layer is responsible for generating the desired output.

    '
  trans: '


    ### 输入层

    该层以文本、数字、音频文件、图像像素等形式接收大量输入数据。


    ### 隐藏层

    隐藏层负责执行数学运算、模式分析、特征提取等操作。神经网络中可以包含多个隐藏层。


    ### 输出层

    该层负责生成所需的输出。


    '
