    # Deep Q-Networks (DQN) and Reinforcement Learning


    ## The Moving Target Problem


    ![γ max_{a''}Q_{k}(s'',a'')](rsrcSA.jpg) is a variable term; this must be done
    carefully. Since the target for the neural network is variable—unlike other typical
    Deep Learning processes where the target is stationary—getting into the details
    of this process is essential. This problem is overcome by having two neural networks
    instead of one. One neural network is used to adjust the parameters of the network,
    and the other is used for computing the target. The target network has the same
    architecture as the first network but has frozen parameters. Remember very carefully
    that after *x* number of iterations in the primary network, the parameters are
    copied to the target network.


    ## How Deep-Q Networks (DQN) Work


    I’m going to assume that you have zero or very little familiarity with deep reinforcement
    learning and try to explain DQN.


    ### What is Reinforcement Learning?


    Consider an AI agent called "Pi". We want Pi to play a video game.


    If Pi was trained using supervised learning, we would show Pi a large number of
    games and then ask it to imitate the actions of successful ones and avoid those
    in unsuccessful ones. But this would be ridiculously naive: the agent would need
    a lot of memory to store all this data, and it would still not be effective as
    it can only learn what we show it. It doesn’t learn to think by itself.


    In Reinforcement Learning, we ask Pi to play the game by itself. Initially, it
    just makes random moves. Then, for the moves it made, it starts getting rewards.
    It has to keep in mind the correlation between the move it made and the reward
    it obtained. That’s going to be a tricky thing.


    We learn a function which we call **Q**. It takes two inputs: screen (`S`) and
    action (`A`). The output of the `Q` function should be: if `S` is the screen and
    `A` is the action we take, what would be the reward?


    Let’s say that somehow, we have obtained this function. If we have this function
    for the given game, all we need to do is: given the current screen `S`, we try
    all possible actions and compare the `Q` values for all the actions. The action
    which has the largest `Q` value would give us the highest reward. We choose that
    action.


    ### How to Get This Q Function?


    If our game was simple, we could just write down the entire function by hand.
    In real games, we can’t do this as the input to the function is an image (high-dimensional
    data). This is where deep learning is used. One way to treat a neural network
    is to think of it as a function approximator. If the function is more complicated,
    then the neural network needs more depth. When we use such networks to learn functions,
    it’s called deep learning.


    We use this deep network to represent the `Q` function and then use it to decide
    the action (DQN - Deep Q Network).


    ### Training the Neural Network


    **How do we train the neural network to represent the Q function?**

    We use an iterative procedure called **Bellman’s Updates** to train.


    **How do we know which action led to which reward?**

    We could have done something long back and it might lead to reward much later.
    This is usually called the **''Credit Assignment Problem''**. We try to solve
    this by considering discounted rewards.


    **Stability Issues**

    The algorithm was unstable even with deep networks. Progress was made only after
    incorporating insights from neuroscience, such as **experience replay**.


    ### Further Exploration


    *   **DQN** has been fine-tuned to train faster using parallel updates.

    *   **DRQN**: Deep Recurrent Q Network.

    *   **DARQN**: Deep Attention Recurrent Q Network.

    *   **DDRQN**: Deep Distributed Recurrent Q Network.

    *   **Duelling Architectures for Q learning**: Separate nets for state and action.

    *   **Double Q Learning**.

    *   **Continuous Control Policies**: Most of the Atari games on which DQN was
    tested had 2–4 actions. Real-life action spaces tend to be parametrized spaces
    and thus have huge cardinalities. To tackle this, continuous control policies
    are being developed.

    *   **Dynamic Skip Free Networks**: …


    ### Other Approaches


    DQN comes broadly under the category of **value learning**. The other interesting
    category is **policy learning**, where we directly learn the mapping between the
    screen and the action (Refs: `DDPG`).


    ## Intuition Behind Q-Learning


    The pre-requisites for understanding the answer are: a basic idea of **Markov
    Decision Process**, **Dynamic Programming Method**, and the **Fixed-Point Method**.


    Q-learning is basically a DP problem that is solved by a Fixed Point Method. Let’s
    say you are playing a game and your current state is `s(t)`. You are allowed to
    take actions `a(i)` for `i` in 1 to `n`. Then, it takes you to the state `s(t+1)`
    and gives you a reward `r(i)`.


    With every state, there is a profit value (called **Q-Value**) associated with
    it. Our task is to choose states so as to maximize the profit value. Let’s call
    the value associated with the state `s(t)` as `DP[s(t)]` in typical DP terms.


    The `DP` array can be constructed as:

    `DP[s(t)] = max over actions { r(i) + DP[s(t+1)] }`


    This is what is called the **Bellman Equation**:

    `Q(s,a) = max ( r + Q(s,a) )`


    If we have this `DP` array, we can easily solve a problem.


    ### Building the DP Array: Bellman Updates


    If our state space is small, we could just explore all states and build this like
    a regular DP. Bellman figured out a simple way to build this `DP` array, called
    **Bellman Updates**.


    If you look carefully at the Bellman equation, it looks like `X = F(X)` where
    `X` is `Q(s,a)` and `F` is a function. This `F` takes functions as input and produces
    functions as output. When it takes our `Q`-function, it outputs the same function.
    In other words, the `Q` function is a fixed point.


    Typically, fixed point methods are solved using the iteration:

    `X(i+1) = F(X(i))`


    This iteration is called **Bellman Updates**. When we perform this fixed point
    iteration (Bellman Updates) to solve the DP problem (Bellman Equation), it’s called
    **Q-learning**. When the `Q`-function is represented by a deep neural network,
    it is called **Deep Q Learning**.


    ## Deep Reinforcement Learning vs. Reinforcement Learning


    Theoretically, both are the same. In reinforcement learning, we want to maximize
    a reward function by finding an optimal action on any particular state.


    Mathematically, we are trying to find a policy `π(a|s)` which provides the probability
    of an action `a` given state `s`, i.e., `π(at|st) = P[at|st]`.


    Traditionally, in reinforcement learning, we used to store the state-action mapping
    either in a table or learn it using a function (first order, second order, etc.)
    to approximate the mapping within a reasonable error value. But in the real world,
    the state function is usually very, very large, which confines traditional RL
    methods in terms of memory or performance (by giving larger errors). Deep learning
    comes to the rescue. It is believed to be a universal function approximation method
    and can handle even a very large state space. When we approximate the RL problem
    using deep learning, we call it deep reinforcement learning. Therefore, theoretically
    both are same. In practice, the results may differ because of the kind of approximation.


    In Reinforcement Learning, you need to find a policy that gives you the best reward
    over the lifetime of the learning agent. In traditional Reinforcement Learning,
    the problem spaces were very limited and the possible states in an environment
    were only few. This was one of the major limitations of traditional approaches.
    Throughout the years, there have been a couple of relatively successful approaches
    that were able to deal with larger state spaces by approximating the state. Neural
    networks have been used for this at least since Riedmiller''s 2005 paper "Neural
    Fitted Q Iteration". Advances in algorithms for DL have brought up a new wave
    of successful applications in Reinforcement Learning, because it offers the opportunity
    to efficiently work with high-dimensional input data (like images). In this context,
    the trained deep NN can be seen as a kind of end-to-end RL approach, where the
    agent can learn a state abstraction and a policy approximation directly from its
    input data.


    ## Does AlphaGo Use Deep Q-Learning?


    It should be distinguished whether "Deep Q-Learning" here refers to:

    1.  The original paper that creates an algorithm called Deep Q-Learning, or

    2.  Just Q-Learning with Deep Neural Network.


    I will talk about the former since it is a special case of the latter. It is evident
    that AlphaGo, of any version, does not use the exact algorithm indicated in the
    *Deep Q-Learning* paper. We can look into the components of these algorithms to
    see how much they are similar to each other. (Only AlphaGo Zero is considered
    for the rest.)


    Vaguely speaking, an RL algorithm is characterised by how the policy is

