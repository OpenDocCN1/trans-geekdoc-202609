    # A3C Intuition: DQN, PPO, and A3C


    ## DQN


    DQN is a value-iteration based method. The algorithm does not directly optimize
    for reward but instead focuses on learning a function approximator to predict
    Q-values that satisfy the recursive Bellman Equation. The optimal actions are
    then derived from the action which maximizes the Q-value. This is usually an offline
    method where transitions are stored in a buffer and sampled randomly to update
    the Q-value approximator.


    ## PPO


    PPO is a policy-gradient type of method. The algorithm directly optimizes the
    expected reward by estimating the gradient of the policy from the trajectories
    taken by the agent. This is usually an on-line method, where only the most recent
    transitions taken by the agent are used to update the policy.


    ## Actor-Critic Methods


    Actor-critic methods combine both value-iteration and policy gradient methods
    where a critic network estimates the value of a state while the actor optimizes
    for the expected reward directly.


    ## A3C


    A3C is an extension of actor-critic where you have multiple agents learning in
    parallel and getting updated asynchronously.


    ## Deep Deterministic Policy Gradient


    I’ll assume that by “Actor-Critic” you mean “Stochastic Actor-Critic (SAC)”. Both
    SAC and DDPG implement a model-free policy gradient and value based method.


    Eponymously, SAC represents the policy as a parametric probability distribution
    (stochastic approach) `πθ(a|s)=Pr(a|s;θ)` whereas DDPG learns a deterministic
    policy `μθ(s)=a`. The gradient theorems that these two follow are also different.


    ### SAC: Stochastic Gradient Policy Theorem


    SAC incorporates the Stochastic Gradient Policy Theorem:


    ```

    ∇θV(πθ) = E_{s∼ρπ, a∼πθ}[∇θ log πθ(a|s) Qπ(s,a)]

    ```


    It calculates the expected gradient of the log-likelihood of the `Qπ` value if
    we start from state `s` and act according to policy `πθ` with respect to parameters
    `θ`.


    ### DDPG: Deterministic Gradient Policy Theorem


    DDPG follows a deterministic policy version called the Deterministic Gradient
    Policy Theorem:


    ```

    ∇θV(πθ) = E_{s∼ρπ}[∇θ μθ(s) ∇a Qμ(s,a) |_{a=μθ(s)}]

    ```


    Notice how this theorem only integrates over the state space and not the action
    space.


    ## Comparison: DDPG vs SAC


    Since DDPG integrates only over the state space, it has an edge over its stochastic
    counterpart:


    *   DDPG could perform more efficiently than SAC.

    *   DDPG can outperform SAC in higher dimensions.

    *   SAC could require more samples than DDPG if the action space has many dimensions.

    '
  trans: '

    # A3C 直观理解：DQN、PPO 与 A3C


    ## DQN


    DQN 是一种基于值迭代的方法。该算法不直接优化奖励，而是专注于学习一个函数逼近器，以预测满足递归贝尔曼方程的 Q 值。然后，根据使 Q 值最大化的动作来推导出最优动作。这通常是一种离线方法，其中转移样本存储在缓冲区中并随机采样以更新
    Q 值逼近器。


    ## PPO


    PPO 是一种策略梯度类方法。该算法通过根据智能体采集的轨迹估计策略的梯度，直接优化期望奖励。这通常是一种在线方法，仅使用智能体最近采集的转移样本来更新策略。


    ## Actor-Critic 方法


    Actor-Critic 方法结合了值迭代和策略梯度方法，其中 Critic 网络估计状态的价值，而 Actor 直接优化期望奖励。


    ## A3C


    A3C 是 Actor-Critic 的扩展，它让多个智能体并行学习并异步更新。


    ## 深度确定性策略梯度


    我将假设你所说的“Actor-Critic”是指“随机 Actor-Critic (SAC)”。SAC 和 DDPG 都实现了无模型的策略梯度和基于价值的方法。


    顾名思义，SAC 将策略表示为参数化概率分布（随机方法）`πθ(a|s)=Pr(a|s;θ)`，而 DDPG 学习确定性策略 `μθ(s)=a`。这两者遵循的梯度定理也不同。


    ### SAC：随机策略梯度定理


    SAC 融合了随机策略梯度定理：


    ```

    ∇θV(πθ) = E_{s∼ρπ, a∼πθ}[∇θ log πθ(a|s) Qπ(s,a)]

    ```


    它计算的是：如果我们从状态 `s` 开始，并根据策略 `πθ` 行动，关于参数 `θ` 的 `Qπ` 值的对数似然的期望梯度。


    ### DDPG：确定性策略梯度定理


    DDPG 遵循一个称为确定性策略梯度定理的确定性策略版本：


    ```

    ∇θV(πθ) = E_{s∼ρπ}[∇θ μθ(s) ∇a Qμ(s,a) |_{a=μθ(s)}]

    ```


    请注意，该定理仅对状态空间积分，而不对动作空间积分。


    ## 对比：DDPG 与 SAC


    由于 DDPG 仅对状态空间积分，因此它比其随机对应物具有优势：


    *   DDPG 的执行效率可能高于 SAC。

    *   DDPG 在高维空间中可能优于 SAC。

    *   如果动作空间维度很多，SAC 可能比 DDPG 需要更多样本。


    '
