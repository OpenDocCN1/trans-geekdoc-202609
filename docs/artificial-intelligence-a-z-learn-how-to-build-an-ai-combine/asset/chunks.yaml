    # 深度 Q 网络 (DQN) 与强化学习


    ## 移动目标问题


    ![γ max_{a''}Q_{k}(s'',a'')](img/rsrcSA.jpg) 是一个变量项；必须谨慎处理。由于神经网络的目标是变化的——这与目标固定的其他典型深度学习过程不同——深入了解该过程的细节至关重要。该问题通过使用两个神经网络而非一个来解决。一个神经网络用于调整网络参数，另一个用于计算目标。目标网络与第一个网络具有相同的架构，但参数被冻结。请务必牢记，在主网络进行
    *x* 次迭代后，参数会被复制到目标网络。


    ## 深度 Q 网络 (DQN) 的工作原理


    我将假设你对深度强化学习完全不熟悉或知之甚少，并尝试解释 DQN。


    ### 什么是强化学习？


    设想一个名为 "Pi" 的 AI 智能体。我们希望 Pi 玩一个视频游戏。


    如果 Pi 是通过监督学习训练的，我们会向 Pi 展示大量游戏录像，然后让它模仿成功游戏中的动作，避免失败游戏中的动作。但这将是极其天真的：智能体需要大量内存来存储所有这些数据，而且仍然不会有效，因为它只能学习我们展示给它的内容。它不会自己学会思考。


    在强化学习中，我们让 Pi 自己玩游戏。最初，它只是随机移动。然后，针对它做出的移动，它开始获得奖励。它必须记住自己做出的移动与获得的奖励之间的相关性。这将是一件棘手的事情。


    我们学习一个称为 **Q** 的函数。它接受两个输入：屏幕 (`S`) 和动作 (`A`)。`Q` 函数的输出应该是：如果 `S` 是当前屏幕，`A` 是我们采取的动作，奖励会是多少？


    假设我们以某种方式获得了这个函数。如果我们针对给定游戏拥有这个函数，我们所要做的就是：给定当前屏幕 `S`，我们尝试所有可能的动作并比较所有动作的 `Q`
    值。`Q` 值最大的动作将给予我们最高的奖励。我们选择该动作。


    ### 如何获得这个 Q 函数？


    如果我们的游戏很简单，我们可以手工写出整个函数。在真实游戏中，我们无法做到这一点，因为函数的输入是图像（高维数据）。这就是深度学习发挥作用的地方。对待神经网络的一种方式是将其视为一个函数拟合器。如果函数更复杂，则神经网络需要更大的深度。当我们使用此类网络来学习函数时，称为深度学习。


    我们使用这个深度网络来表示 `Q` 函数，然后用它来决定动作（DQN - 深度 Q 网络）。


    ### 训练神经网络


    **如何训练神经网络来表示 Q 函数？**

    我们使用一种称为 **贝尔曼更新** 的迭代过程进行训练。


    **我们如何知道哪个动作导致了哪个奖励？**

    我们可能很久以前做过某事，但它可能直到很久以后才带来奖励。这通常被称为 **“信用分配问题”**。我们尝试通过考虑折扣奖励来解决这个问题。


    **稳定性问题**

    即使使用深度网络，该算法也很不稳定。只有在融合了神经科学的见解（如 **经验回放**）后才取得了进展。


    ### 进一步探索


    *   **DQN** 已经过微调，可利用并行更新实现更快的训练。

    *   **DRQN**：深度循环 Q 网络。

    *   **DARQN**：深度注意力循环 Q 网络。

    *   **DDRQN**：深度分布式循环 Q 网络。

    *   **用于 Q 学习的决斗架构**：状态和动作使用独立的网络。

    *   **双重 Q 学习**。

    *   **连续控制策略**：DQN 测试的大多数 Atari 游戏只有 2-4 个动作。现实生活中的动作空间往往是参数化空间，因此具有巨大的基数。为了解决这个问题，正在开发连续控制策略。

    *   **动态无跳网络**：……


    ### 其他方法


    DQN 大体上属于 **价值学习** 类别。另一个有趣的类别是 **策略学习**，我们在其中直接学习屏幕到动作的映射（参考：`DDPG`）。


    ## Q 学习背后的直觉


    理解该答案的前提是：对 **马尔可夫决策过程**、**动态规划方法** 和 **不动点方法** 有基本了解。


    Q 学习本质上是一个由不动点方法求解的动态规划问题。假设你正在玩一个游戏，当前状态为 `s(t)`。你被允许采取动作 `a(i)`，其中 `i` 从 1 到
    `n`。然后，它将你带入状态 `s(t+1)` 并给予你奖励 `r(i)`。


    每个状态都有一个关联的利润值（称为 **Q 值**）。我们的任务是选择状态以最大化利润值。我们用典型的 DP 术语将状态 `s(t)` 关联的值称为 `DP[s(t)]`。


    `DP` 数组可以构建为：

    `DP[s(t)] = max over actions { r(i) + DP[s(t+1)] }`


    这被称为 **贝尔曼方程**：

    `Q(s,a) = max ( r + Q(s,a) )`


    如果我们有这个 `DP` 数组，就可以轻松解决问题。


    ### 构建 DP 数组：贝尔曼更新


    如果我们的状态空间很小，我们可以像常规 DP 一样探索所有状态并构建它。贝尔曼找到了一种构建此 `DP` 数组的简单方法，称为 **贝尔曼更新**。


    如果你仔细观察贝尔曼方程，它看起来像 `X = F(X)`，其中 `X` 是 `Q(s,a)`，`F` 是一个函数。这个 `F` 以函数作为输入并输出函数。当它接收我们的
    `Q` 函数时，输出的是同一个函数。换句话说，`Q` 函数是一个不动点。


    通常，不动点方法通过迭代求解：

    `X(i+1) = F(X(i))`


    这种迭代称为 **贝尔曼更新**。当我们执行这种不动点迭代（贝尔曼更新）来求解 DP 问题（贝尔曼方程）时，称为 **Q 学习**。当 `Q` 函数由深度神经网络表示时，称为
    **深度 Q 学习**。


    ## 深度强化学习与强化学习


    理论上，两者是相同的。在强化学习中，我们希望通过在任意特定状态下找到最优动作来最大化奖励函数。


    数学上，我们试图找到一个策略 `π(a|s)`，它给定状态 `s` 下动作 `a` 的概率，即 `π(at|st) = P[at|st]`。


    传统上，在强化学习中，我们将状态-动作映射存储在表中，或使用函数（一阶、二阶等）学习它，以在合理的误差范围内近似映射。但在现实世界中，状态函数通常非常非常大，这从内存或性能（给出更大的误差）方面限制了传统
    RL 方法。深度学习提供了帮助。它被认为是一种通用函数近似方法，可以处理甚至非常大的状态空间。当我们用深度学习近似 RL 问题时，称之为深度强化学习。因此，理论上两者是相同的。在实践中，结果可能因近似类型而异。


    在强化学习中，你需要找到一个策略，使学习智能体在其生命周期内获得最佳奖励。在传统强化学习中，问题空间非常有限，环境中可能的状态只有很少。这是传统方法的主要局限性之一。多年来，已经有几种相对成功的方法能够通过近似状态来处理更大的状态空间。神经网络至少自
    Riedmiller 2005 年的论文“Neural Fitted Q Iteration”以来就被用于此目的。深度学习算法的进步在强化学习中带来了一波新的成功应用，因为它提供了高效处理高维输入数据（如图像）的机会。在此背景下，训练好的深度神经网络可以被视为一种端到端的
    RL 方法，智能体可以直接从其输入数据中学习状态抽象和策略近似。


    ## AlphaGo 是否使用深度 Q 学习？


    应当区分此处的“深度 Q 学习”是指：

    1.  创建名为深度 Q 学习算法的原始论文，还是

    2.  仅指带有深度神经网络的 Q 学习。


    我将讨论前者，因为它是后者的一个特例。显然，任何版本的 AlphaGo 都不使用 *Deep Q-Learning* 论文中指示的确切算法。我们可以查看这些算法的组件，以了解它们彼此之间的相似程度。（下文仅考虑
    AlphaGo Zero。）


    模糊地说，一个 RL 算法的特征在于策略如何


