    # DDoS 攻击防范指南


    ## 现状与趋势


    我担心，不，我确信，我们将看到更多此类 DDoS 攻击。随着互联网的扩张，更多人获得宽带接入，这为攻击者提供了更多未受保护的 Windows 系统加以利用。更糟糕的是，得益于
    `Low Orbit Ion Cannon` 等工具，任何人都可以纠集志同道合的朋友，瘫痪任何令其不爽的中型网站。请注意，使用这些工具可能会被追踪，并面临刑事指控。近期就有一名大学生因使用
    DDoS 工具攻击保守派评论员的网站，被判处 30 个月监禁。


    即使面临此类威胁，我看不出这类攻击会停止。我们将在 Web 上面临艰难时刻，DDoS 攻击只会变得越来越普遍。


    ## 尽早识别 DDoS 攻击


    如果你运行自己的服务器，你需要能够识别何时遭受攻击。这是因为越早确认网站问题是由 DDoS 攻击引起的，越早可以采取行动。


    为此，熟悉你典型的入站流量概况是个好主意；你越了解正常流量的样子，就越容易发现其概况的变化。大多数 DDoS 攻击开始时表现为流量的剧烈尖峰，能够区分合法访客的突然激增和
    DDoS 攻击的开始非常有帮助。


    此外，在公司指定一名 DDoS 负责人，负责在遭受攻击时采取行动，这也是个好主意。


    ## 过度预配带宽


    通常，为 Web 服务器提供比你认为可能需要的更多带宽是合理的。这样，你可以容纳因广告活动、特别优惠或媒体提及公司而导致的突然且意外的流量激增。


    即使过度预配 100% —— 甚至 500% —— 也可能无法阻止 DDoS 攻击。但这可能会在资源耗尽前给你争取几分钟的行动时间。


    ## 在网络边界进行防御（如果你运行自己的 Web 服务器）


    可以采取一些技术措施来部分缓解攻击的影响 —— 尤其是在最初几分钟内 —— 其中一些措施相当简单。例如，你可以：


    *   对路由器进行速率限制，防止 Web 服务器不堪重负

    *   添加过滤器，让路由器丢弃来自明显攻击源的数据包

    *   更积极地超时半开连接

    *   丢弃伪造或畸形的数据包

    *   设置更低的 SYN、ICMP 和 UDP 洪水丢弃阈值


    但事实是，虽然这些步骤在过去曾有效，但现在的 DDoS 攻击通常规模太大，这些措施已无法产生显著效果。你所能指望的只是它们能在攻击升级时为你争取一点时间。


    ## 联系你的 ISP 或托管提供商


    下一步是联系你的 ISP（如果你不托管自己的 Web 服务器，则联系托管提供商），告知他们你正遭受攻击并请求帮助。请务必随时准备好 ISP 或托管提供商的紧急联系方式，以便快速行动。根据攻击强度，ISP
    或托管商可能已经检测到攻击，或者他们自己可能开始因攻击而不堪重负。


    如果你的 Web 服务器位于托管中心，而不是自行运行，你将更有机会抵御 DDoS 攻击。这是因为其数据中心可能拥有比你公司更高带宽的链路和更高容量的路由器，且其员工可能拥有更多应对攻击的经验。此外，将
    Web 服务器托管在托管商处，还能将针对你 Web 服务器的 DDoS 流量挡在公司局域网之外，因此至少你业务的那部分 —— 包括电子邮件和可能的 VoIP
    服务 —— 应能在攻击期间正常运行。

    '
