    \ attain an age of 2 years. Proceeding further, now \"Cycle to school programme\"\
    \ becomes an \"act.\"\n\nI think a Scheme aims to address the problems of a larger\
    \ section of society, while a programme is aimed to achieve a specific goal. Say\
    \ there is a money crunch in Zootopia, you made a plan to combat this issue formulating\
    \ an Economic policy. Under this policy you launched a scheme which provides job\
    \ to all the needful. Simultaneously you launched a special programme which will\
    \ encourage elephants to work more as they are physically stronger. Thus you are\
    \ able to make more money in Zootopia by launching a scheme along with a special\
    \ programme for elephants by effectively planning an efficient economic policy.\n\
    \n# Q-Learning Visualization\n\nQ-learning is basically a DP problem that is solved\
    \ by a Fixed Point Method. Let's say you are playing a game and your current state\
    \ is `s(t)`. For next understanding, you are allowed to take actions `a(i)` for\
    \ `i` in 1 to `n`. Then, it takes you to the state `s(t+1)` and gives you a reward\
    \ `r(i)`. With every state, there is a profit value (called as Q-Value) associated\
    \ with it. Our task is to choose states so as to maximize the profit value. Let's\
    \ call the value associated with the state `s(t)` as `DP[s(t)]` in typical DP\
    \ terms.\n\nThen, the DP array can be constructed as:\n\n```\nDP[s(t+1)] = max\
    \ over actions { r(i) + DP[s(t+1)] }\n```\n\nThis is what is called as the Bellman\
    \ Equation:\n\n```\nQ(s,a) = max ( r + Q(s,a) )\n```\n\nNow, if we have this DP\
    \ array we can easily solve a problem. So, how do we build our DP array? If our\
    \ state space is similar we could just explore all states and build this like\
    \ a regular DP. Bellman figured out a simple way to build this DP array which\
    \ is called as the Bellman Updates.\n\nIf you look carefully at the Bellman equation,\
    \ it looks like `X = F(X)` where `X` is `Q(s,a)` and `F` is a function. So, this\
    \ `F` takes functions as input and produces functions as output. When it takes\
    \ our Q-function, it outputs the same function. In other words, the Q function\
    \ is a fixed point. Typically, the fixed point method are solved using the iteration:\
    \ `X(i+1) = F(X(i))`. This iteration is called as Bellman Updates.\n\nWhen we\
    \ perform this fixed point iteration (Bellman Updates) to solve the DP problem\
    \ (Bellman Equation), it's called as Q-learning. When the Q-function is represented\
    \ by a deep neural network, it is called as Deep Q Learning.\n\nQ-learning is\
    \ a common technique used to solve for optimal policy in a Markov Decision Process.\
    \ Its goal is to find the best policy in terms of bringing the max expected value\
    \ over all successive steps. In its simplest form, Q-learning is done through\
    \ value iteration. The Q-function is implemented as a table with states and actions\
    \ that updates Q-values for each s-a pair as the agent takes steps in an environment.\
    \ The Bellman Equation of optimality `q*(s,a)=E[Rt+1+γmaxa'q*(s',a')]` is used\
    \ to update Q until it converges with the optimal Q.\n\n## What is \"Q\"?\n\n\
    The 'q' in q-learning stands for quality. Quality in this case represents how\
    \ useful a given action is in gaining some future reward.\n\n## Q Learning - Algorithm\n\
    \n![Q-Learning Algorithm](rsrcS5.jpg)\n\nFor an environment, we build a table\
    \ called Q-table which has the dimensions `SxA` where `S` and `A` are the number\
    \ of states and actions respectively. For every state, there are actions and the\
    \ likeliness of choosing a particular action depends on the values in Q-table\
    \ called as state-action value. Initially the values of the Q-table are 0. An\
    \ action is chosen for a state. If that action gives a good reward for the next\
    \ state then the Q-value for the state-action is increased otherwise, the Q-value\
    \ is decreased.\n\n![Q-Value Update](rsrcS6.jpg)\n\nTo learn more with Python\
    \ hands on, please click here.\n\n# Deep Q-Learning\n\nThe process of Q-Learning\
    \ creates an exact matrix for the working agent which it can \"refer to\" to maximize\
    \ its reward in the long run. Although this approach is not wrong in itself, this\
    \ is only practical for very small environments and quickly loses its feasibility\
    \ when the number of states and actions in the environment increases.\n\nThe solution\
    \ for the above problem comes from the realization that the values in the matrix\
    \ only have relative importance i.e. the values only have importance with respect\
    \ to the other values. Thus, this thinking leads us to Deep Q-Learning which uses\
    \ a deep neural network to approximate the values. This approximation of values\
    \ does not hurt as long as the relative importance is preserved.\n\nThe basic\
    \ working step for Deep Q-Learning is that the initial state is fed into the neural\
    \ network and it returns the Q-value of all possible actions as an output.\n\n\
    The difference between Q-Learning and Deep Q-Learning can be illustrated as follows:\n\
    \n![Q-Learning](rsrcS7.jpg)\n![Deep Q-Learning](rsrcS8.jpg)\n\n## Pseudo Code\n\
    \nInitialize:\n\n```\nfor all pairs (s,a)\n```\n\n```\ns = initial state\nk =\
    \ 0\nwhile(convergence is not achieved) {\n    simulate action a and reach state\
    \ s'\n    if(s' is a terminal state) {\n        target = R(s,a,s')\n    } else\
    \ {\n        target = R(s,a,s') + γ max_{a'}Q_{k}(s',a')\n    }\n    θ_{k+1} =\
    \ θ_{k} - α Δ_{θ} E_{s'~P(s'|s,a)}[(Q_{θ}(s,a) - target(s'))^2]|_{θ = θ_{k}}\n\
    \    s = s'\n}\n```\n\nObserve that in the equation `target = R(s,a,s') + γ max_{a'}Q_{k}(s',a')`,\
    \ the term\n"
  trans: "\n\n# DDoS 缓解\n\n如果攻击规模足够大，托管公司或 ISP 可能采取的第一个措施是对你的流量实施“空路由” —— 这会导致发往你的\
    \ Web 服务器的数据包在到达之前被丢弃。\n\n对于大规模攻击，你保持在线的最佳机会很可能是使用专业的 DDoS 缓解公司。这些组织拥有大规模基础设施，并使用各种技术（包括数据清洗）来帮助保持你的网站在线。\n\
    \n# 策略与计划\n\n就我的理解而言，我将尝试通过一个例子来简化这些定义。假设你是一个叫“动物城”的王国的国王。\n\n## 策略\n\n既然你是国王，你必须确保动物城所有动物的福祉。在实际项目中，为此你为王国内的每个部门制定了一些准则。\n\
    \n例如，你决定王国生产的所有食物将只分配给动物城的公民。这就是一个食物策略的例子。\n\n## 计划\n\n当上国王后，你观察到动物城的动物得不到足够的医疗设施。于是你启动了一个医疗计划，动物治疗产生的所有费用将由政府财政在“动物城全民医疗计划”下承担。这个医疗计划是你的“社会部门策略”的一部分。\n\
    \n## 项目\n\n现在当你看到健康问题日益严重时，你希望动物也能受教育。为了进一步掌控局面，你启动了一个项目，凡在动物城小学注册入学的动物，免费赠送一辆自行车。假设你将其命名为“骑车上学项目”。该项目是你在“教育策略”下的“初等教育计划”的一部分。\n\
    \n## 规划\n\n既然你有这么多事情并行进行，动物城财政的支出巨大。因此，为了最小化这笔成本并有效实施“骑车上学项目”和“动物城全民医疗计划”，你制定了一份详尽的“该做和不该做”的清单。请仔细记住，这份清单要涵盖你将面临的所有可能漏洞和挑战。这份详尽的清单就是规划，制定这份清单的过程就是计划。\n\
    \n## 法案\n\n当一切进展顺利时，你听到了关于动物城行政官员不愿实施“骑车上学项目”的投诉。于是你颁布了一项法律，规定凡未满 2 周岁的动物都有资格获得免费教育和一辆自行车。如果这项权利受到侵犯，他们可以向动物城最高法院提起诉讼。因此，这成为官员们的义务，确保每个动物在年满\
    \ 2 周岁前都能获得免费教育和一辆自行车。进一步来说，现在“骑车上学项目”变成了一项“法案”。\n\n我认为，计划旨在解决社会更大群体的问题，而项目旨在实现特定目标。假设动物城面临资金短缺，你制定了一项规划来应对这一问题，并制订了经济策略。在此策略下，你启动了一个为所有有需要者提供工作的计划。同时，你启动了一个特别项目，鼓励大象多干活，因为它们体格更强壮。因此，通过有效规划高效的经济策略，并启动一个计划连同一个针对大象的特别项目，你让动物城赚到了更多钱。\n\
    \n# Q-Learning 可视化\n\nQ-Learning 本质上是一个由不动点法求解的动态规划（DP）问题。假设你正在玩一个游戏，你当前的状态是 `s(t)`。为了后续理解，你被允许采取动作\
    \ `a(i)`，其中 `i` 从 1 到 `n`。然后，它将你带入状态 `s(t+1)` 并给予你奖励 `r(i)`。每个状态都有一个关联的利润值（称为\
    \ Q-Value）。我们的任务是选择状态以最大化利润值。用典型的 DP 术语，我们称与状态 `s(t)` 关联的值为 `DP[s(t)]`。\n\n然后，DP\
    \ 数组可以构建为：\n\n```\nDP[s(t+1)] = max over actions { r(i) + DP[s(t+1)] }\n```\n\n\
    这就是所谓的贝尔曼方程：\n\n```\nQ(s,a) = max ( r + Q(s,a) )\n```\n\n现在，如果我们有这个 DP 数组，就可以轻松解决问题。那么，我们如何构建\
    \ DP 数组？如果我们的状态空间相似，我们可以像常规 DP 一样探索所有状态并构建它。贝尔曼找出了一种构建此 DP 数组的简单方法，称为贝尔曼更新。\n\n\
    如果你仔细观察贝尔曼方程，它看起来像 `X = F(X)`，其中 `X` 是 `Q(s,a)`，`F` 是一个函数。所以这个 `F` 以函数为输入并输出函数。当它接收我们的\
    \ Q 函数时，它输出同一个函数。换句话说，Q 函数是一个不动点。通常，不动点法通过迭代求解：`X(i+1) = F(X(i))`。这种迭代称为贝尔曼更新。\n\
    \n当我们执行这种不动点迭代（贝尔曼更新）来求解 DP 问题（贝尔曼方程）时，它被称为 Q-Learning。当 Q 函数由深度神经网络表示时，称为深度 Q-Learning。\n\
    \nQ-Learning 是一种用于在马尔可夫决策过程中求解最优策略的常用技术。其目标是在所有连续步骤中找到能带来最大期望值的最佳策略。在其最简单的形式中，Q-Learning\
    \ 通过值迭代完成。Q 函数被实现为一个包含状态和动作的表格，当智能体在环境中采取步骤时，更新每个 s-a 对的 Q 值。最优性的贝尔曼方程 `q*(s,a)=E[Rt+1+γmaxa'q*(s',a')]`\
    \ 被用来更新 Q，直到其与最优 Q 收敛。\n\n## 什么是“Q”？\n\nQ-Learning 中的 'q' 代表 quality（质量）。在这种情况下，质量表示给定动作在获得未来奖励方面有多大用处。\n\
    \n## Q-Learning - 算法\n\n![Q-Learning Algorithm](img/rsrcS5.jpg)\n\n对于一个环境，我们构建一个称为\
    \ Q 表的表格，其维度为 `SxA`，其中 `S` 和 `A` 分别是状态和动作的数量。对于每个状态，都有相应的动作，选择特定动作的可能性取决于 Q 表中的值，称为状态-动作值。最初\
    \ Q 表的值为 0。为某个状态选择一个动作。如果该动作为下一个状态带来了好的奖励，则该状态-动作的 Q 值增加，否则 Q 值减少。\n\n![Q-Value\
    \ Update](img/rsrcS6.jpg)\n\n要通过 Python 实践了解更多，请点击此处。\n\n# 深度 Q-Learning\n\nQ-Learning\
    \ 过程为工作智能体创建了一个精确的矩阵，它可以“参考”该矩阵以在长期内最大化奖励。虽然这种方法本身并不错误，但它仅适用于非常小的环境，当环境中的状态和动作数量增加时，会迅速失去可行性。\n\
    \n上述问题的解决方案源于这样一个认识：矩阵中的值只有相对重要性，即这些值仅相对于其他值才有重要性。这种思维引导我们走向深度 Q-Learning，它使用深度神经网络来近似这些值。只要保留相对重要性，这种值的近似并无损害。\n\
    \n深度 Q-Learning 的基本工作步骤是将初始状态输入神经网络，它输出所有可能动作的 Q 值。\n\nQ-Learning 和深度 Q-Learning\
    \ 的区别可以如下图所示：\n\n![Q-Learning](img/rsrcS7.jpg)\n![Deep Q-Learning](img/rsrcS8.jpg)\n\
    \n## 伪代码\n\n初始化：\n\n```\nfor all pairs (s,a)\n```\n\n```\ns = initial state\n\
    k = 0\nwhile(convergence is not achieved) {\n    simulate action a and reach state\
    \ s'\n    if(s' is a terminal state) {\n        target = R(s,a,s')\n    } else\
    \ {\n        target = R(s,a,s') + γ max_{a'}Q_{k}(s',a')\n    }\n    θ_{k+1} =\
    \ θ_{k} - α Δ_{θ} E_{s'~P(s'|s,a)}[(Q_{θ}(s,a) - target(s'))²]|_{θ = θ_{k}}\n\
    \    s = s'\n}\n```\n\n观察方程 `target = R(s,a,s') + γ max_{a'}Q_{k}(s',a')` 中的项\n\
    \n"
