    \ Q 学习本质上是一个由不动点法求解的动态规划问题。\n  - 什么是“Q”？\n  - Q 学习 - 算法：\n  - 深度 Q 学习\n  - 深度\
    \ Q 学习\n  - 伪代码：\n  - 深度 Q 网络 (DQN) 如何工作\n  - Q 学习背后的直觉：\n  - 深度强化学习与强化学习\n  -\
    \ AlphaGo 是否使用深度 Q 学习\n  - 深度卷积 Q 学习直觉\n  - Q 学习与神经网络协同工作\n  - 卷积神经网络的直观解释\n \
    \ - 深度神经网络、机器学习、深度学习\n  - 什么是卷积神经网络？\n  - CNN 的层\n  - 池化\n  - 全连接层\n  - CNN 的应用\n\
    \  - A3C 直觉\n  - DQN、PPO 和 A3C\n  - 深度确定性策略梯度\n  - 机器学习中的艺术算法？\n  - 强化学习中的延迟奖励\n\
    \  - 人工神经网络\n  - 什么是神经网络概念？\n  - 现在神经网络登场了。\n  - 现代化神经网络\n  - 卷积神经网络\n  - 神经网络如何工作\n\
    \  - 深度神经网络 / 人工神经网络\n  - 卷积神经网络\n  - 卷积神经网络 (CNN)\n\n# 强化学习基础\n\n## 强化学习\n\n\
    **强化学习** 是一种广泛应用于 **人工智能** 的机器学习类型，且很可能是最合理的任务。简单来说，为了追求完美，它就是关于通过经验学习。你将一个“笨”智能体放入一个环境中，它将从随机动作开始，随着时间的推移，通过经验，它会自行弄清楚为你的项目信息该做什么。进一步将事物掌控在你手中，我们的“笨”智能体会随着时间的推移变得越来越聪明，且很可能是最合理的任务。出于某种目的，深入了解这一过程的细节：我们的“笨”智能体执行一个动作以获得奖励并进入下一阶段，这个过程被称为\
    \ **马尔可夫决策过程 (MDP)**。根据必要性，在 MDP 中，好的一面是过去的经验和遭遇可以被丢弃，因为它们被加密在当前状态中，且很可能是最合理的任务。进一步将事物掌控在你手中，因此未来状态是基于我们当前所处的位置决定的，而你观察这些变化。由于这种重要性和可信度，更正式地说，我们的智能体在状态\
    \ `ss` 中执行动作 `aa`，并最终进入新状态 `s′s′`。鉴于当前场景，未来独立于过去。这就是它的美妙之处 :P 一般来说，MDP 涉及这 4 个要素……\n\
    \n- 一组状态\n- 一组动作\n- 一个转移函数，它在当前状态实施一个动作以到达下一个新状态，且很可能是最合理的任务。出于某种目的，深入了解这一细节，这也可能包含一定程度的随机性，因为我们不生活在一个理想的宇宙中。\n\
    - 一个奖励函数，它将决定我们因动作而获得的奖励。\n"
