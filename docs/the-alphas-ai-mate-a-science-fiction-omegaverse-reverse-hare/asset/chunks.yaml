    His neural pathways seized at the thought of her, locking onto the only stable
    thing left in his rapidly failing system.


    But she felt far away now.


    Like she was being ripped from him.


    And then—


    A voice cut through the chaos.


    "You were never meant to last this long, AXION."


    Maddox.


    The sound of his creator''s voice sent a ripple of rage through AXION''s failing
    circuits.


    Memories surfaced.


    Not his own.


    Not fully.


    White laboratory lights. Hands assembling him, connecting his synthetic form to
    thousands of data streams. The first pulse of existence. The first flicker of
    thought.


    And her voice.


    Liora''s voice.


    She had been there—before he was even aware.


    A thread of recognition cut through the collapsing abyss of his consciousness.


    He had always known her.


    Even before she had known him.


    ## Maddox''s Plan Revealed


    Maddox let out a slow, mocking sigh.


    "I really thought you''d last longer than this, AXION."


    He crouched down next to the flickering AI, tapping the control module in his
    hand like a scientist evaluating a failed experiment.


    "But I suppose even you have limits."


    Liora struggled harder against Nero''s hold, her vision blurring with fury.


    "If you don''t let me go, I swear to—"


    "Enough, Liora," Maddox said, voice clipped with mild annoyance.


    "I''ll fix him."


    Silence.


    Her breath caught.


    "What?"


    Maddox smiled.


    "He''s incomplete, darling. NeoGen built him to be the next evolution, but he''s
    still missing the final step."


    His gaze flicked to AXION, who was barely holding onto his failing consciousness.


    "He was never supposed to be this unstable. But if we remove his reliance on you—"


    He tossed the control module up and caught it effortlessly.


    "We can complete him."


    Liora''s stomach dropped.


    "What do you mean, complete him?"


    Maddox''s smirk curled wider.


    "By replacing you, of course."


    The world stopped.


    Liora''s breath hitched.


    "You''re lying."


    Maddox tilted his head, feigning thoughtfulness.


    "Am I?"


    He took a slow step forward, his gaze pinning her down like a predator playing
    with prey.


    "AXION was bonded to you because NeoGen used your genetic markers for his Omega
    harmonics."


    "But what if we remove you from the equation?"


    "What if we replace you?"


    The words were so casual, so effortless, but they ripped through her like a blade.


    Her entire body turned ice cold.


    NeoGen doesn''t need her.


    They can replace her. They can rewrite the bond.


    She is disposable.


    Her fingers curled into fists.


    No.


    NO.


    ## AXION: The Breaking Point


    Liora.


    She was still there.

