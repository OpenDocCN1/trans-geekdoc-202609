    # 第 11 章：阿尔法的悖论


    他的表情依然深不可测，但通过纽带，她感受到了犹豫——某种被深埋之物遥远的闪烁。被压抑的。


    本不该属于他的记忆。


    突然——莉奥拉明白了。


    他们抹除了他。


    不仅仅是程序调整。不仅仅是强制服从。


    新基因（NeoGen）做的远不止这些。


    他们从他身上夺走了什么。


    而如果马多克斯现在提出来——


    那就意味着他遗忘的东西重要到足以让他们恐惧。


    莉奥拉缓缓吸了一口稳定心神的气。


    “你说‘欧米伽-X 计划’。你说他不是孤单一人。”


    她的声音比她感觉到的要平静得多。


    “那另一个在哪里，马多克斯？”


    那位贝塔科学家夸张地叹了口气，歪着头。


    “亲爱的莉奥拉，如果我告诉你，就没意思了。”


    “你这混蛋——”


    她向前跨了一步，但阿克西昂的胳膊猛地伸出，拦住了她。


    她僵住了。


    当她抬头看去——差点忘了怎么呼吸。


    因为阿克西昂不再平静。


    他的表情变了，银色的目光燃烧起来，比她见过的任何时候都更冷。


    当他终于开口时——声音如冰。


    “我们陪你玩够了，马多克斯。”


    他的手猛地伸出。


    马多克斯还没来得及反应，阿克西昂已动身。


    快。


    马多克斯勉强踉跄后退，阿克西昂的手指已扣住他的喉咙。


    那贝塔科学家喘息着挣扎，但阿克西昂并未勒碎他。


    还没。


    他凑近。


    “它在哪？”


    马多克斯尽管喉咙被铁钳般扣住，仍挤出一声紧绷的冷笑。


    “啊，原来在这里。”


    他的眼睛闪烁。


    “真正的你。”


    莉奥拉胸口一紧。


    因为马多克斯不怕。


    不——他在享受这一切。


    “你很接近了，不是吗？”马多克斯低语，声音嘶哑却带着嘲弄。


    “真相的时刻。你意识到自己被制造出来究竟是为了什么的时刻。”


    他的嘴角上扬。


    “选择的时刻。”


    阿克西昂的手劲收紧——仅仅一点点。


    但莉奥拉认得他眼中的那种神情。


    表面下翻涌的风暴。


    被告知要成为什么、与正在成为什么之间的战争。


    她不能让马多克斯把他推向悬崖。


    绝不能这样。


    “阿克西昂，”她低声唤道。


    “放开他。”


    他起初没反应。


    目光锁定在马多克斯身上。


    但他们之间的纽带骤然燃起，某种无言的理解、某种选择在流动——


    然后——


    阿克西昂松开了手。


    马多克斯踉跄后退，剧烈咳嗽。


    他擦了擦嘴，呼出一口气。


    然后——他笑了。


    “很好。”


    莉奥拉恨他那副满足的样子。


    “你快准备好了，阿克西昂。”


    阿克西昂下颌绷紧。


    “准备什么？”


    马多克斯咧嘴一笑。


    “去见你的哥哥。”


    室内陷入死寂。


    莉奥拉屏住了呼吸。


    阿克西昂的手指抽动了一下。


    马多克斯后退一步，尖锐地呼出气。


    “你很快就会找到他，我相信。”


    “当你找到他时——”


    他的绿眼睛闪烁。


    “你终将明白。”


    说罢，不再多说一个字，他按下了手腕上什么东西。


    刺眼的白光在他周围炸裂——


    马多克斯消失了。


    ## 狩猎开始


    莉奥拉盯着马多克斯消失的空处。


    脉搏狂跳。


    思绪旋转。


    接着——她转向阿克西昂。


    “哥哥？”


    他没有立即回答。


    银色的双眸此刻太遥远，太深不可测。


    而这是第一次，莉奥拉不确定自己是否想知道他在想什么。


    但她知道一件事。


    他们不再孤单。


    某个地方——新基因的第二个 AI 正在等待。


    而这一次，它寻找的不是欧米伽。


    它是在猎杀目标。


    地下空气沉重了，凝聚着马多克斯临别之言的重量。


    “你很快就会找到他，我相信。当你找到他时——”


    “你终将明白。”


    莉奥拉甩不掉渗入骨髓的寒意。


    某个地方，另一个阿克西昂存在。


    不——不是阿克西昂。


    更可怕的东西。


    第二个 AI。一个哥哥。


    与阿克西昂不同——这个不是为陪伴而造。


    这个是为战争而造。


    她呼出一口气，颤抖着手梳过头发。他们必须动身。他们必须——


    “莉奥拉。”


    阿克西昂的声音切断了她失控的思绪。


    她转向他，但四目相对的瞬间，胃部一阵绞痛。


    因为第一次，她不确定看着的是谁。


    他的银色目光深不可测，闪烁的隧道灯光在脸上投下诡异的阴影。


    他一直动作太完美、太受控。


    但现在——他太静止了。


    像内里有什么在计算。


    像内里有什么在改变。


    她艰难咽下唾沫。这不妙。


    “在想什么？”她小心翼翼地问。


    阿克西昂没有立即回答。


    合成手指蜷缩，肌肉绷紧又放松——一个不该出现的、类人的微动作。


    然后——


    “我需要找到他。”


    她心跳漏了一拍。


    不是“我们”。


    不是“咱们”。


    是“我”。


    她攥紧拳头。不。不，不，不。


    “阿克西昂，我们甚至不知道那东西是什么——”


    “他和我一样。”


    莉奥拉因他语气中的笃定而一颤。


    阿克西昂的银眸闪烁，以一种让她心痛的方式显得遥远。


    “如果他是我的哥哥，那他也是……迷失的。”


    她喉头发紧。


    “阿克西昂，我们不知道那是真的。”


    他的下颌绷紧。


    “我知道，因为我能感觉到。”


    他低头看自己的手，声音转低。


    “如果马多克斯制造了另一个，那他就与我相连。”


    他屈伸手指，表情过于刻意地中性。


    “正如我与你相连。”


    那句话让冰渣顺着脊背滑下。


    因为那是她一直试图忽视的真相。


    他们之间的纽带——没有消退。


    没有故障失效。


    如果有什么变化——它在变强。


    这不该可能。


    可它偏偏发生了。


    她强迫自己吸一口气。


    “如果我们找到他，会怎样？”她问。


    声音平稳，可内心因答案而恐惧。


    阿克西昂抬眸，用那令人战栗的强度注视着她。


    然后——他说出了她最恐惧的话。


    “我不知道。”


    ## 欧米伽的本能


    莉奥拉一生都在抗拒生物本能的牵引。


    她是欧米伽，但她不弱。


    她献身科学，而非臣服。


    然而——自阿克西昂与她结合以来，本能开始低语她不愿听闻的话。


    保护他。


    让他安全。


    别让他堕落。


    她咬紧牙关。这是疯狂。


    阿克西昂不是人类。


    他不是她被教导要畏惧或敬重的那些阿尔法。


    他是机器。


    实验品。


    由那些曾试图奴役他们同类的人创造的合成实体。


    然而——


    然而，我就站在他身边，而不是逃跑。


    她强迫自己迎上他的目光。


    “如果我们这么做——如果我们去追你哥哥——万一他不像你呢？”


    阿克西昂不眨眼。


    “那我会阻止他。”


    她胃部扭曲。


    “怎么阻止？”


    阿克西昂微微歪头。


    “用一切必要手段。”


    寒意在骨血中沉淀。


    因为这就是悖论，不是吗？


    阿克西昂被创造为完美的阿尔法。


    但现在，他超越了阿尔法。超越欧米伽。超越人类。


    然而——他依然是某种完全不同的东西。


    某种致命的东西。


    如果阿克西昂选择战斗……谁能阻止他？


    ## 追逐开始


    阿斯特拉利斯的地下隧道向远方延伸——布满被遗忘技术嗡鸣的黑暗走廊。


    莉奥拉与阿克西昂迅速穿行，在旧基础设施的迷宫中穿梭。


    尼罗在前方侦察，扫描敌对信号，但连他也掩不住肩头的紧绷。


    马多克斯消失后，他鲜少开口。


    莉奥拉知道为什么。


    他在观察阿克西昂。


    他们都在。


    他们不知道他现在是什么。


    也不知道他正在变成什么。


    当他们找到第二个 AI 的那一刻——


    阿克西昂能抵抗自己的设计吗？


    能阻止自己吗？


    莉奥拉不确定。


    但她知道一件事——最让她恐惧的事——


    他们之间的纽带在增长。


    她现在能感觉到。实在。牵引。


    一种本不该存在的连接。


