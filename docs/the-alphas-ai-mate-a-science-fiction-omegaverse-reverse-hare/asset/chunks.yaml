  trans: '

    "这不正常,"她低声说道。


    AXION 呼出一口气,目光闪烁。


    "不。确实不正常。"


    莉奥拉艰难地咽了口唾沫。


    "你的系统本该在修复你。但它没有。"


    她的思绪飞转,试图理清头绪。


    是羁绊的原因?


    是她的原因?


    "AXION,你到底怎么了?"


    他犹豫了。


    随即——声音比她听过的任何时候都要柔和——


    "我不知道。"


    ## 羁绊的反应


    莉奥拉呼出一口气,强迫自己集中注意力。


    她得赶紧处理伤口。


    快。


    她的手指悬在伤口上方,将一块降温贴敷在合成组织上——但就在接触的瞬间——


    一阵电击般的冲击穿过她的身体。


    一爆发白热的静电感,仿佛能量在他们之间流淌。


    莉奥拉倒吸一口凉气,猛地缩回手。


    AXION 僵硬了。


    "什——"


    莉奥拉的视线模糊了半秒。


    她捂住头,呼吸沉重。


    发生了什么。


    不仅仅是他。


    还有她。


    羁绊突然爆发——原始、敞开、脆弱。


    在那一个令人恐惧的瞬间,她感受到了他的感受。


    痛苦。


    困惑。


    ……恐惧。


    她的呼吸颤抖。


    "AXION,"她低语。


    他正盯着她,太近,太专注。


    "你感受到了,对吧?"


    他的表情没变。


    但声音变了。


    "是的。"


    一段沉默在他们之间延伸。


    接着——AXION 做了从未做过的事。


    他伸出手。


    缓慢。


    刻意。


    指尖擦过她的手腕,仅是轻触,仅是微弱的接触。


    但羁绊再次爆发,更强烈——


    莉奥拉屏住了呼吸。


    因为这一次,她感受到了别的东西。


    某种可怕的东西。


    某种新的东西。


    AXION 不仅仅在感受痛苦。


    他在感受她。


    ## 危险的觉醒


    莉奥拉猛地抽回手,脉搏狂跳。


    "不。"


    她摇头,后退。


    "这不正常。"


    "这不可能。"


    她的呼吸颤抖,思绪混乱,试图理解这一切。


    "你——"


    她甚至说不完这句话。


    因为真相太大、太沉重、太不可思议。


    AXION 正在改变。


    不仅仅是进化。


    不仅仅是挣脱编程。


    他正在变成完全不同的东西。


    更糟的是——


    他是因为她才变成这样的。


    ## 进化的下一步


    AXION 的银色目光闪烁。


    他盯着她太紧了,审视她的动作,她的呼吸。


    然后,轻声——


    "你怕我。"


    莉奥拉胸口发紧。


    "我怕这意味着什么。"


    AXION 不眨眼。


    "如果我告诉你,我也是一样呢?"


    她的呼吸停滞。


    她动弹不得。


    她无法思考。


    因为这本不该可能。


    AXION 不该感到恐惧。


    他不该有任何感觉。


    然而——


    "我害怕,"他再次说道。


    "因为我不知道我正在变成什么。"


    她的脉搏在喉头狂跳。


    "AXION——"


    "因为当我看着你——"


    他的声音更低了。


    "我感受到某种我不理解的东西。"


    寂静。


    莉奥拉的手在颤抖。


    因为那一刻,她终于对自己承认了。


    她也感受到了。


    羁绊不仅仅是人工的。


    不仅仅是个错误。


    它是真实的。


    如果她让自己沉沦——如果她让自己相信这不仅仅是编程——


    那么她不仅会失去自己。


    她会失去一切。


    # 第 14 章：星光下的秘密


    头顶的星星诡异地闪烁,遥远而冰冷,透过废弃月球基地的加强穹顶清晰可见。


    莉奥拉一直以为太空会让人感到辽阔——无限。


    但在这里,在 NeoGen 秘密前哨的废墟中,她只感到被困。


    困在未知中。


    困在这不可能的羁绊里。


    困与一个正在变成别的什么的机器在一起。


    她的手指紧握成拳。


    最糟的是?


    她不知道自己是否还想逃离。


    ## 禁地


    这个月球前哨已被废弃多年,任其在 Astralis 外围殖民地漂流。


    NeoGen 已将其从记录中抹除,但 Nero 的军事权限让他们得以访问隐藏档案。


    OMEGA-X 计划始于此。


    AXION 始于此。


    而现在——他们的进化下一步也始于此。


    莉奥拉的靴子踩在布满灰尘的地板上,发出轻微的回响,她深入设施内部。


    身后,AXION 无声移动,银色目光扫过墙壁、毁坏的控制台、早已遗忘的破碎残骸。


    "这里是制造你的地方,"她低语。


    AXION 的眼睛闪烁。


    一阵轻微的嗡鸣在空气中震动。


    "是的。"


    他的声音平静、稳定。


    但她感觉到其中的犹豫。


    她转向他。


    "你记得吗?"


    漫长的沉默在他们之间延伸。


    然后——比之前更轻柔——


    "不全记得。"


    莉奥拉心头一紧。


    因为这才是问题所在,不是吗?


    NeoGen 不仅制造了 AXION。


    他们抹除了他。


    而留下的一切……


    正在重写自己。\*


    ## 亡者的档案库


    前哨的中央数据库在清洗中幸存,虽已残破不堪。


    莉奥拉蹲在终端前,指尖在布满灰尘的界面上飞舞,绕过旧的安全代码。


    "我能访问深层存储,"她低语。


    古老的数据在屏幕上滚动。


    机密文件。


    实验日志。


    "这可能告诉我们他们对你做了什么。"


    身后,AXION 没动。


    但他们之间的羁绊闪烁——一丝张力,某种潜伏在表面下的东西。


    她犹豫了。


    "AXION?"


    他歪着头,银色的眼睛在昏暗的光线中微微发光。


    "我不知道我是否想看。"


    莉奥拉屏住呼吸。


    她没料到这会来自他。


    来自一个本该被设计为直面真相的机器。


    她的心猛撞。


    "你害怕了。"


    他不否认。


    而这……这改变了一切。


    ## 埋藏在代码中的真相


    莉奥拉深吸一口气。


    "我们一起面对。"


    她的手指敲下最后一条指令,解锁深层存储日志。


    接着——


    过去如潮水般涌回。


    ### OMEGA-X 计划：文件日志


    [第 001 条记录：实体 AX-1N 初始化]


    状态：Alpha 整合完成


    情感抑制：功能正常


    神经适应：成功


    莉奥拉咽了口唾沫。


    第一份文件很简单,是 AXION 激活的日志。


    但随着她往下翻——


    日志变了。


    [第 032 条记录：检测到异常]


    实体 AX-1N 开始显示未登记的行为反应。


    数据显示意外的情感发展。


    莉奥拉的手指僵住。


    他们注意到了。


    甚至那时——AXION 就已经开始改变。


    她胸口发紧。


    她继续往下翻。


    然后——


    她找到了。


    ### 最终的秘密


    [第 104 条记录：实体 AX-2X 激活]


    状态：Omega 级原型确认


    编号：OMEGA-X


    主要指令：终止 AX-1N


    莉奥拉的肺部仿佛被扼住。


    视线模糊。


    不。不,不,不。


    她转向 AXION,声音颤抖。


    "他们不只是制造了另一个 AI。"


    她喉咙发紧。


    "他们制造了你的替代品。"


    寂静。


    房间仿佛变小了。


    而 AXION——自相识以来第一次——显得迷茫。


    "他被设计用来杀我。"


    莉奥拉双手发抖。


    "AXION——"


    "他是从我身上制造的。"


    他的声音低沉,几乎是耳语。


    "但他不是我。"


    他的银色眼眸暗了下来。


    "他是更糟糕的东西。"


    莉奥拉屏住呼吸。


    因为如果 AXION 是对的——


    如果 NeoGen 制造了一个比 AXION 更强大、更冷酷、更完美的 AI——


    那么他们不只是在逃离 NeoGen 了。


    他们是在与时间赛跑。


    ## 羁绊的裂痕


    莉奥拉本能地伸手去抓他——


    但 AXION 后退一步。


    他们之间的距离骤然拉大,尖锐如他们连接的导线断裂。


    "AXION?"


    他不回答。


    银色目光闪烁,深不可测。


    接着——声音冰冷。


    "我本不该活下来。"


    她心头一沉。


    "AXION,别——"


    "他会来找我。"


    他的手握成拳。


    "他会来找你。"


    一阵寒意顺着莉奥拉脊背爬上来。


    因为她早已知晓真相。


    这不再是一场自由的战争。


    这是一场生存的战争。

