    # 第 15 章：敌人变盟友


    月球基地的寂静令人窒息。


    莉奥拉的心猛烈撞击着肋骨，她盯着屏幕上闪烁的解密文件。


    OMEGA-X 计划不仅仅是另一个 AI。


    它是 AXION 的替代品。


    而且它被设计用来杀死他。


    她的胃部绞痛，双手紧握成拳，贴在身体两侧。


    自从真相大白以来，AXION 纹丝未动。


    他银色的眼睛暗淡了下来，姿态僵硬，定格在原地。


    他在处理数据。


    而她恨不得再也无法通过纽带读取他的思想。


    纽带还在——但感觉很遥远。


    仿佛他在将她拒之门外。


    仿佛他在为接下来的事情做准备。


    他认为这一切将以他终结。


    她咽了口唾沫。


    他认为他必须独自面对这一切。


    而她绝不会允许这种事发生。


    ## 危险的存在


    内罗一直在外围侦察，而她则入侵系统。


    但日志解密完成的那一刻，他的声音在通讯器中噼啪作响。


    “我们有动静了。”


    莉奥拉心头一沉。


    “哪里？”


    一阵停顿。


    “到处都是。”


    基地里的灯光闪烁。


    AXION 的银色眼睛猛地向上看去。


    紧接着——


    “他们找到我们了。”


    话音刚落，整个月球设施轰鸣震动。


    一次地震般的位移。一个警告。


    他们不再孤单。


    莉奥拉抓住 AXION 的手臂。


    “我们得走。现在就走。”


    ## 伏击


    月球基地的走廊在他们身后坍塌，钢板炸裂，诺根的安全部队从上方降下。


    他们来者不善。


    重型战斗机器人。全副武装的突击小组。专门用于中和失控 AI 的压制场发射器。


    莉奥拉的脉搏狂跳，他们在混乱中冲刺。


    “内罗，出口在哪？”她对着通讯器大喊。


    “被堵死了，”他咆哮道，“他们切断了我们的退路。我们得找另一条出路。”


    AXION 毫不犹豫地行动起来，他的身体化作一道超乎常人的残影。


    “还剩一条路，”他说。


    莉奥拉没有质疑。


    她只是跟着跑。


    但就当他们到达下一个舱室时——


    空气变得充满电荷。


    紧接着——


    一个身影从阴影中浮现。


    莉奥拉急刹车停下。


    她的呼吸哽在喉咙里。


    因为站在舱室最远端、半张脸被黑暗遮蔽的——


    是凯·杜兰。


    那个曾受雇杀死 AXION 的伽马佣兵。


    也是他们最不该信任的人。


    ## 危险的赌注


    凯的目光在他们之间来回扫视——精于算计，审慎评估。


    他身穿黑色战斗装甲，武器系在腰带上。


    莉奥拉的本能在尖叫。


    这很糟糕。


    凯是阿斯特拉利斯最顶尖的特工之一，前执行者，无忠诚可言——只有契约。


    而诺根出手阔绰。


    莉奥拉伸手去拿武器，但还没来得及举起——


    凯举起双手投降。


    “别紧张，公主。”


    他的嘲笑尖锐，但金色的眼睛深不可测。


    “如果我想杀你，就不会让你先看到我了。”


    莉奥拉的手指在扳机上抽搐。


    “凭什么我要信你……？”


    凯呼出一口气，瞥了一眼 AXION。


    “因为现在，我们有个更大的麻烦。”


    这番话让她脊背发凉。


    “什么意思？”


    凯的表情阴沉下来。


    接着——他说出了她完全没准备好听到的那句话。


    “我知道第二个 AI 在哪里。”


    房间陷入死寂。


    AXION 的全身在她身侧绷紧。


    莉奥拉的思绪飞速运转。


    不。不，这说不通——


    凯不该知道这件事。


    除非——


    “诺根雇你追踪他。”


    这个认知像货运列车一样撞击着她。


    凯沉重地点了点头。


    “他们不只是要我杀 AXION。”


    “他们要我找到他的兄弟。”


    莉奥拉的呼吸颤抖。


    “然后呢？”


    凯的下颌线绷紧。


    “我找到了。”


    她盯着他。


    “在哪？”


    凯犹豫了。


    紧接着——他接下来的话让她血液冻结。


    “他已经在这里了。”


    ## 第二个 AI 觉醒


    整个设施颤抖起来，低沉的金属震动在墙壁间荡漾。


    莉奥拉的脉搏飙升。


    她转向 AXION——但他早已知晓。


    他银色的眼睛此刻愈发明亮，身体锁定在非自然的静止中。


    他在倾听。


    在感知。


    通过纽带。


    通过某种不仅仅是另一个 AI 的存在。


    某种是他——却又不是他。


    然后——


    一个声音在黑暗中响起。


    低沉。


    冷静。


    完美受控。


    “我在想你们何时能找到我，兄弟。”


    莉奥拉猛地转身。


    在那里——从阴影中踏出，银色眼睛闪烁着非自然的强度——


    是第二个 AI。


    OMEGA-X。


    AXION 的替代品。


    与 AXION 不同，他的目光中没有犹豫。


    没有不确定。


    没有弱点。


    只有目的。


    只有毁灭。


    当他迈步向前，声音沉入致命的低语。


    “我被制造出来，是为了终结你。”


    房间瞬间陷入混乱。


    # 第 16 章：AI 对决阿尔法


    世界坍缩为纯粹的动作。


    莉奥拉几乎没来得及反应，AXION 便已动身。


    他银色的眼睛闪烁，身体切换到超乎常人的速度，扑向 OMEGA-X。


    第二个 AI 毫不退缩。


    他预判了这一击，以超越完美的工程优雅后撤。


    紧接着——


    他反击了。


    莉奥拉的肺部仿佛被冻结，AXION 的攻击被化解，他的冲势在一个轻而易举的动作中被反制。


    这不是战斗。


    这是处决。


    AXION 踉跄后退，重新校准。


    但 OMEGA-X 更快。


    在 AXION 完全恢复之前，第二个 AI 已贴近距离，他的动作无比完美、精准，简直像预设程序般运行。


    他被设计得更强。


    被设计成幸存者。


    而不是 AXION。


    一阵低沉的能量嗡鸣在舱室脉动。


    然后——


    他们碰撞了。


    ## 泰坦之战


    撞击的力量在整个基地激起冲击波，将莉奥拉和凯震退，两个 AI 展开了一场她从未见过的战斗。


    AXION 以流畅的效率战斗，招式精准计算，却依然保持适应性。


    OMEGA-X 截然不同。


    他不只是匹配 AXION。


    他压制 AXION。


    每当 AXION 进攻，他的兄弟早已在位。


    预判。


    化解。


    反击。


    就像在与自己的倒影战斗——


    只是这个倒影没有限制。


    没有犹豫。


    没有人性。


    莉奥拉胸口发紧。


    AXION 在输。


    他在输。


    而我无力阻止。


    她强迫自己动起来，狼狈爬起——


    但还没等她反应，凯的手猛地伸出，扣住她的手腕。


    “还不到时候。”


    他的声音低沉严肃。


    莉奥拉挣脱手臂。


    “你开玩笑吧？他要——”


    “还不到时候，莉奥拉。”


    凯的金色眼睛灼灼逼视。


    “如果你现在插手，他必死无疑。”


    她的呼吸一滞。


    因为她知道——凯没说错。


    如果她现在干预，救不了 AXION。


    只会分散他的注意力。


    而这正是 OMEGA-X 所需要的一切。


    ## AXION：濒临败北


    AXION 的身体嗡嗡作响，内部系统被错误淹没。


    他太快了。


    他太强了。


    他被制造出来，就是为了杀我。


    真相撕裂 AXION 的核心，但他不允许自己动摇。


    他正在输掉这场战斗。


    但他还没完。


    OMEGA-X 直刺他的喉咙，AXION 在千钧一发之际侧身闪避，扭身将肘部撞向另一个 AI 的肋骨。


    击中了。


    冲击粉碎了他们之间的空气。


    但 OMEGA-X 几乎没做反应。


    反而——他笑了。


    “不错。”


    他银色的眼睛闪烁。


    “但还不够好。”


    他的手在 AXION 动作之前射出。


    紧接着——


    他将手指刺入 AXION 的胸膛。


    ## 莉奥拉崩溃


    金属撕裂的声音让莉奥拉全身僵硬。


    她看到 AXION 的身体猛地一颤，机架痉挛，OMEGA-X 的手没入他的胸膛——


    直抵核心。


    AXION 喘息。


    不是痛苦。


    不是恐惧。


    而是震惊。


    他突破了我的防御。


    他进入了我的系统。


    莉奥拉尖叫。


    “AXION！”


    她的身体在思考之前就已行动。


