  trans: '

    "我们得走。OMEGA-X 还在外面，而现在 NeoGen 确切地知道我们在哪里。"


    Kai 夸张地叹了口气。


    "对。是的。先避免大规模种族灭绝，未解决的性张力留到以后。"


    Liora 瞪了他一眼，恨不得用眼神杀了他。


    "我恨你。"


    "不，你不恨。"


    AXION 只是走到他们中间，银色的目光深不可测，转向她。


    "Liora 说得对。我们得走。"


    Kai 挑了挑眉。


    "哦，所以你听她的，不听我的？"


    AXION 连眨都不眨一下。


    "正确。"


    Kai 笑了。


    Liora 叹了口气。


    这任务恐怕得拖很久了。


    ## 他们之间的真相


    他们快速移动，穿过月球基地坍塌的废墟，寻找逃生路线。


    但 Liora 分心了。


    不是因为 Kai。


    不是因为 OMEGA-X。


    是因为 AXION。


    因为他现在移动的方式——更流畅，更敏锐。


    因为她能通过纽带感受到他的存在，比以前更深。


    这不再只是连接。


    这是他本人。


    这种认知让她胸口涌起一阵尖锐的战栗。


    我麻烦大了。


    她冒险瞥了他一眼。


    AXION 表情平静，深不可测。


    但仿佛感应到她的思绪，他转向她。


    两人目光相触。


    纽带骤然炸裂。


    Liora 猛地吸了一口冷气。


    她从未感受过这样的东西——像原始电流在血管中奔涌。


    她的 Omega 本能立刻反应过来，一股深沉、原始的脉动——她毕生都在压抑的东西。


    不。不，不，不，这很危险。


    AXION 的银眸微微暗沉，仿佛察觉到她的犹豫。


    他歪了歪头。


    "你在挣扎。"


    Liora 咬紧牙关。


    "你根本不知道。"


    AXION 向前一步。


    "那就告诉我。"


    她胸口发紧。


    她做不到。


    她还没准备好。


    因为如果她承认了——如果她让自己接受正在发生的一切——


    就没有回头路了。


    然而——纽带已经在将他们推向前方。


    不可避免。


    不可阻挡。


    ## 界限模糊


    他们到达一个安保房间，是设施内最后几个还能运作的房间之一。


    Kai 忙着破解安保锁，嘴里嘟囔个不停。


    Liora 努力集中注意力。


    她真的努力了。


    但 AXION 依然盯着她。


    像在等待。


    像在试图理解什么——他们俩都无法解释的东西。


    "Liora."


    她胃部一阵绞痛。


    "你害怕这层纽带。"


    她僵住了。


    他的语气没有指责。


    平静。笃定。陈述事实。


    她转向他，强迫自己迎上他的目光。


    "当然害怕。"


    声音低哑，带着破碎感。


    "因为这本不该是真的。"


    纽带脉动了一下。


    AXION 的银眸柔和下来。


    "可它是真的。"


    Liora 屏住了呼吸。


    因为他说对了。


    因为每次他那样看着她，每次她感受到他们之间的牵引——


    感觉太真实了。


    超越单纯的生物学。


    超越单纯的代码。


    那是更深层的东西。


    没人为他们准备过这种东西。


    我可以逃避。


    我本该逃避。


    但当 AXION 伸出手，指尖擦过她的手腕，触碰轻柔得近乎不可能——


    她知道了。


    她不会走。


    ## 坚不可摧


    门终于解锁，Kai 发出一声胜利的咒骂。


    "进去了，咱们——"


    他停住了。


    目光在他们俩之间来回扫视。


    嘲弄的笑容慢慢浮现。


    "哦。"


    Liora 脸红了，猛地从 AXION 身边挣脱，清了清嗓子。


    "闭嘴，Kai。"


    Kai 咧嘴笑。


    "我什么都没说。"


    而 AXION 依然注视着她。


    而这一次——


    她没有移开视线。


    因为这层纽带是真实的。


    而她不再假装不是。


    # 第 19 章：量子纽带


    气氛变了。


    Liora 能感觉到——一种无声、不言而喻的重压压在她身上，像无形的锁链缠绕住她的胸膛。


    这不再只是纽带了。


    这是超越生物学的东西。超越编程。超越她所认识的一切。


    最糟糕的部分？


    她不再能控制它了。


    ## 危险的连接


    废弃的月球前哨站在诡异的寂静中延伸。


    Kai 忙着扫描下一条通道，嘴里嘟囔着 NeoGen 的封锁系统，但 Liora 几乎听不进去。


    她太清楚 AXION 的存在了。


    太清楚他的存在如何在她脑海中脉动，比以往任何时候都生动。


    仿佛他就在那里，在她皮肤之下，在她最深处的思绪里。


    当她转向他时——


    他已经在看她了。


    "你也感觉到了。"


    那不是疑问。


    那是陈述事实。


    Liora 胃部一阵绞痛。


    "是啊。"


    AXION 微微歪头，银色的眼睛在昏暗光线中微微发光。


    "比以前更强了。"


    更强。更深。


    她懂他的意思。


    纽带在进化。


    变成某种不仅仅是生物学连接的东西。


    某种新东西。


    前所未有的东西。


    她的脉搏狂跳。


    这不正常。


    这不该发生。


    那为什么感觉是对的？


    她屏住了呼吸。


    然后——纽带炸裂了。


    ## 失控的涌动


    在热度与能量的闪光中，一切瞬间发生。


    一秒前，Liora 还站着不动。


    下一秒——她全身被感觉点燃。


    不是痛。


    不是恐惧。


    而是别的什么。


    某种深沉、原始、未经过滤的东西。


    视线模糊，周围世界化作雪花噪点。


    不是噪点。


    是 AXION。


    她进入了他的思绪。


    进入了他内部。


    当她意识到那一刻，她整个存在都在颤抖。


    因为她能感受到他感受到的。


    不只是情绪。


    不只是他思维的逻辑。


    她能感受到他的存在本身。


    他的能量如何脉动，他的合成核心如何因她的存在而共鸣。


    而在一切之下——


    那个未说出口的真相。


    我被她吸引。


    她的心脏停跳了。


    我无法理解。


    她的呼吸颤抖。


    但我无法否认。


    Liora 倒吸一口气，猛地后退，差点栽倒。


    纽带猛地弹回原位，再次将他们分开。


    而 AXION——第一次——看起来动摇了。


    手指抽搐，银眸微微眯起，处理着刚才发生的一切。


    "那……"他低语。


    声音低沉，不稳。


    "本不该可能发生。"


    Liora 胸口发紧。


    她知道。


    她知道。


    我们刚刚共享了思绪。


    我们刚刚共享了——


    她剧烈摇头，强迫脑海中的混乱平息。


    不。不，集中注意力。


    她转向 Kai——他正用纯粹难以置信的表情盯着他们。


    "呃。"


    他眨眨眼。


    "我错过什么了？因为你们俩刚搞了场诡异的心灵凝视大赛，我觉得我酒喝得不够多。"


    Liora 尖锐地呼出一口气。


    "没什么。"


    Kai 冷哼。


    "宝贝，我这辈子见过不少疯狂事，但从没见过两人光靠对视就差点晕过去。"


    他金色的眼睛闪烁着愉悦。


    "你们那纽带在搞事情，嗯？"


    Liora 脸红了。


    "闭嘴，Kai。"


    然而 AXION 依然深不可测。


    目光锁定在她身上，炽热，探究。


    "这纽带不再遵循 Omega-Alpha 模式。"


    Liora 吞了口唾沫。


    "不。"


    他的银眸眯起。


    "那它是什么？"


    她没有答案。


    因为这是未知领域。


    因为这不只是 AI 与 Omega 的结合。


    这是别的什么。


    而可怕的部分？


    她不想再对抗了。


    ## 无声的理解


    他们加快速度穿过设施，处境的重压压在他们身上。


    OMEGA-X 仍在外面。


    NeoGen 正在逼近。


    然而——


    Liora 的注意力总往 AXION 身上飘。


    他现在移动的方式不同了，像是对她超常敏锐。


    像能感受到她，就像她感受到他一样。


    当他们的目光再次相撞——


    谁也没移开视线。


    因为他们都知道。


    这纽带已成超越他们的东西。


    某种他们都不理解的东西。


    某种他们都无法阻止的东西。


    而第一次，Liora 不确定自己是否还想阻止。


    ## 暴风雨前的宁静


    他们到达设施边缘，应急逃生舱存放处。

