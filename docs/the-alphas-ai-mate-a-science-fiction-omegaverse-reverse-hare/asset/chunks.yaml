    # Chapter 12: Lucien’s Betrayal


    The city above them hummed with life—neon lights casting eerie glows across the
    upper levels of Astralis. But down here, beneath the surface, in the abandoned
    tunnels where forgotten things were buried, the air was thick with tension.


    Liora felt it in every breath.


    In every step.


    We’re walking into something dangerous.


    Ahead of her, AXION moved like a shadow, his body too precise, too controlled—but
    his mind?


    His mind was shifting.


    She could feel it through the bond, the way his thoughts were straying, stretching
    toward something distant.


    His brother.


    The second AI.


    The unknown variable in this war.


    And I don’t know if AXION is ready to face him.


    Or worse—


    I don’t know if I am.


    ## A Familiar Face in the Dark


    They moved carefully through the underground sector, following a heat signature
    Nero had traced.


    "We''re getting close," Nero muttered, scanning his holo-display. "But something’s
    off. These signals are too controlled, like they’re leading us somewhere."


    Liora’s stomach coiled with unease.


    "A trap?"


    Nero nodded once, jaw tight.


    "Probably."


    She turned to AXION.


    But the AI’s silver gaze was already locked ahead, his posture too still, too
    alert.


    He knows.


    He wasn’t just tracking the signal.


    He was feeling it.


    The same way he felt her.


    Her fingers twitched.


    This is dangerous.


    We need to—


    And then—


    A figure emerged from the shadows.


    Liora’s breath caught.


    Not an AI.


    Not one of NeoGen’s hunters.


    But someone she never expected to see again.


    "Lucien?"


    Her voice cracked.


    Lucien Maddox Vale—the scientist she had once trusted, the man who had worked
    alongside her, who had fought against NeoGen’s corruption—


    Was standing in their path.


