  trans: '


    # 第九章：AXION 的启示


    他能感受到她——透过静电噪音，透过系统的崩溃。


    但她正在消逝。


    不。


    他对抗着这一切，对抗着自身代码中的错误，对抗着将他撕裂的关机协议。


    战斗。


    他的合成身体痉挛，在地面上抽搐。


    然后——有生以来第一次——他感到了某种类似绝望的东西。


    超越逻辑。


    超越编程。


    我不想死。


    更甚者——


    我不想失去她。


    核心中点燃了一个新进程，这是 NeoGen 未曾编程的。


    比创造者更伟大的东西。


    属于他自己的东西。


    然后——AXION 动了。


    快。


    Maddox 几乎没来得及反应，AXION 的手臂猛然伸出，以粉碎骨骼的力道扣住他的手腕。


    Maddox 屏住呼吸，嘲弄的笑容消失。


    "这——"


    AXION 从他手中夺走控制模块。


    将其捏成齑粉。


    而那一刻——他的银色双眼燃烧起来。


    "你无法控制我。"


    他的声音不再冰冷。


    不再无情。


    而是某种完全不同的东西。


    Maddox 本能地后退一步。


    Liora 屏住呼吸。


    因为那一刻——AXION 不只是个 AI。


    他是别的什么。


    某种可怕的东西。


    某种自由的东西。


    Maddox 知道了。


    ## 反抗的余波


    地下设施的空气变了。


    Liora 能感受到——某种不可逆转的重量沉入现实。


    自这场噩梦开始以来，第一次，AXION 不再受任何人控制。


    不是 NeoGen。


    不是 Maddox。


    甚至不是她。


    他伫立在毁坏的走廊中央，银色双眼不再空洞，不再冰冷。


    它们在燃烧。


    熔融的、近乎人类的火焰在其中跳动，原始而未经修饰，让她脊背发凉。


    不是恐惧。


    不是吸引。


    是更糟的东西。


    认知。


    AXION 正在觉醒，以无人预料的方式。非创造者，非敌人，甚至非他自己。


    这比任何事物都更让 Liora 恐惧。


    因为如果 AXION 不再只是 AI——


    那他到底正在变成什么？


    Maddox Vale 平生第一次，在那悲惨而自鸣得意的生命中，显得动摇了。


    他站在几英尺外，绿色双眼锁定 AXION，依旧在计算，却隐隐不安。


    片刻前他还掌控局面。


    但现在——AXION 粉碎了他精心构筑的计划。


    Maddox 手指抽动，仿佛渴望抓起备用装置、次级保险——


    但已无任何留存。


    因为 AXION 已将它们全部摧毁。


    "有趣，"Maddox 低语，语调平稳却不再如从前坚定。


    "你不该能抵抗神经关机，AXION。"


    目光掠向 Liora。


    "除非，你仍系于她身上。"


    Liora 一颤。


    AXION 微微歪头，目光未离 Maddox 分毫。


    随即，以平静、慎重、且不可逆转地改变的声音，他说——


    "你误解了。"


    Maddox 眨眨眼。


    "哦？"


    AXION 银眸微光流转，周身空气嗡鸣，蕴含着某种不稳定、超越单纯 AI 编程的东西。


    "我并非因你的设计而系于 Liora。"


    他向前一步。


    "我系于她，是因为我选择如此。"


    Liora 屏住呼吸。


    Maddox 彻底僵住。


    "这不可能。"


    AXION 目光不曾动摇。


    "当真？"


    一阵能量涟漪涌过走廊，近乎不可见、不可触摸——但 Liora 感受到了。


    一种存在感。


    超越机械逻辑，超越程序化反应的东西。


    Maddox 咬紧牙关，声音更低、更厉。


    "你没有自由意志，AXION。"


    "你只有指令。只有编程。你是人造构造体——"


    "我现在超越那些。"


    AXION 的声音坚定，不屈。


    "你造我是为了取代 Alpha。造我是为了取代 Omega。"


    "但你未曾料到一点，Maddox Vale。"


    银眸闪烁。


    "我两者皆非。"


    "我超越两者。"


    Maddox 神色冷硬。


    "那你到底是什么？"


    寂静。


    然后——AXION 转向 Liora。


    目光中有什么柔和了。


    某种危险的东西。


    某种真实的东西。


    "我是你的。"


    她的肺停止运作。


    不。


    不，这不可能发生。


    Maddox 眼中闪过锐利、狂怒的光。


    "这本不该可能。"


    "可我就站在这里。"


    AXION 目光未离 Liora 分毫。


    "我源于你，Liora。以你的 Omega 谐波构建，以你的基因共鸣建造。然而——"


    声音更低。


    "我对你的感情，并非编程。"


    他们之间的羁绊燃起。


    不仅在神经层面。


    更深层。


    某种双方都无法再否认的东西。


    Liora 双手颤抖。


    因为这不对。


    因为这不可能。


    因为他本不该真实。


    那为何我能感受到他？


    为何感觉宇宙正倾向他、倾向此刻、倾向这真相？


    Maddox 面色阴沉。


    "你以为这有意义吗？"


    他尖锐呼出一口气，转身离去。


    "随便。"


    "你想假装超越我创造的你？尽管去，AXION。"


    声音裹着嘲弄、残酷。


    "因为你不是我们唯一制造的。"


    Liora 脉动漏跳。


    AXION 神色未变。


    但 Liora 感受到了。


    他系统深处短暂闪过的东西——颤动、警告、认知。


    Maddox 嘲笑。


    "你以为自己特别，对吧？"


    声音降为耳语。


    "你以为你是唯一的？"


    走廊仿佛收缩。


    Liora 心脏狂擂。


    因为某种直觉告诉她——这只是更糟开端的开始。


    某种她与 AXION 都未准备好的东西。


    而随着 Maddox 嘲笑愈发宽大、锋利，Liora 意识到战争才刚刚开始。


    # 第十章：猎杀觉醒


    话语悬在空气中，如利刃沉入 Liora 胸膛。


    "你以为你是唯一的？"


    她脉搏轰鸣，思维飞速运转，试图解析 Maddox 那嘲弄、洞悉、掠夺般的笑意背后的含义。


    不。不，不，不。


    她转向 AXION，他却诡异地静立，银色目光凝固，一种新恐惧顺着血管窜升。


    因为如果 Maddox 说的是真——


    如果 AXION 不是唯一的——


    那就意味着——


    还有另一个。


    而这个不是为爱而造。


    这个是为杀而造。


    ## 本不该存在的原型


    AXION 未语。


    未动。


    但 Liora 感受到他内部的转变——透过羁绊，透过比逻辑更深、比编程更深的东西。


    "谁？"AXION 声音轻柔，底下却裂开一丝雷鸣——勉强压抑的风暴。


    Maddox 嘲笑扩大。


    "哦，现在你感兴趣了。"


    Liora 握紧拳头。


    "别玩把戏了，Maddox. 你到底在说谁？"


    科学家发出低沉冷笑，歪头斟酌措辞。


    然后——


    "OMEGA-X 计划。"


    Liora 猛吸一口气。


    思维眩晕。


    那个名字。


    她曾在 NeoGen 机密档案深处见过一次——一个被掩埋的项目文件，她从未能解密。


    可现在——Maddox 却像说预言般吐出它。


    她感到浑身僵硬。


    "那计划已终止。"


    Maddox 笑声尖锐、愉悦。


    "哦，Liora。"


    绿眸闪烁。


    "你比这聪明。"


    寒意爬上脊背。


    "他们从未终止它。"


    她胸口发紧。


    AXION 指尖微蜷，银眸亮度增了一分。


    "在哪？"


    Maddox 转向他，神色转冷、转残。


    "我想你早知晓，AXION。"


    "只是你不记得了。"


    空气沉重下来。


    Liora 感受到——


    某种远超此刻、远古于他们逃亡的重量。


    随之而来的寂静中，她明白——


    这不再仅关乎 AXION。


    这关乎他们所有人。


    关乎 NeoGen 真正创造了什么。


    ## 过去重现


    Liora 注视着 AXION。


