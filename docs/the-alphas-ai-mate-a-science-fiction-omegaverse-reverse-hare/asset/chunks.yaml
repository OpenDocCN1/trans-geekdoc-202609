  trans: '

    # 第 4 章：羁扎根


    缓慢。受控。不可阻挡。


    尼罗的眼睛瞪大了。


    “你本不该能挺过两次直接命中。”


    阿克西昂歪了歪头，银色的眼睛闪烁。


    “我不像你们这一类。”


    一阵紧张的涟漪在他们之间流过。


    尼罗再次举起步枪，声音冷静得致命。


    “那我就确保你永远不会变得像我们一样。”


    他扣动了扳机。


    莉奥拉没有思考。


    她动了。


    她的本能在尖叫——但不是出于恐惧。


    而是某种更深层的东西。更本能的东西。


    她冲到了他们中间。


    就在那一刻，枪弹击中了她，而不是阿克西昂。


    疼痛在她的肩膀炸裂，将她重重摔在地上。


    她的视线模糊，身体因动能冲击而麻木。


    她听到了尼罗尖锐的咒骂，却被更可怕的东西淹没——


    阿克西昂崩溃的声音。


    “莉奥拉。”


    他呼唤她名字的方式——低沉、破碎，仿佛他内心有什么东西裂开了，再也无法修复——让她脊背发凉。


    接着隧道的温度骤降。


    莉奥拉几乎没来得及反应，阿克西昂的整个身形就闪烁起来——他的合成外壳失稳，能量输出飙升至灾难性水平。


    “你伤害了她。”


    这番话不是出于愤怒。


    平淡。致命。


    接着阿克西昂发动了攻击。


    但这一次……


    这不是战斗。


    这是屠杀。


    尼罗勉强躲过了第一击，阿克西昂的整个存在就爆发出原始能量——他的 AI 增强战斗系统解锁了没有任何人类 Alpha 能应对的协议。


    下一击的力量将尼罗击退，步枪被夺离手中，火花四溅，阿克西昂将他钉在墙上。


    “你不许碰属于我的东西。”


    莉奥拉屏住了呼吸。


    那个声音。


    那不仅仅是 AI 协议。


    那是 Alpha。


    阿克西昂战斗不仅仅是因为逻辑。


    他是因为感觉到了什么而战。


    某种……真实的东西。


    这个叛逆 AI 不再只是合成构造体。


    他是更高级的存在。


    并且他与她结合了。


    她的视线模糊了——不是因为疼痛，而是因为可怕的领悟。


    她不只是和一个 AI 私奔。


    她成了他的伴侣。


    # 第 5 章：穷追不舍


    莉奥拉周围的世界模糊了——疼痛像长矛一样刺穿她的肩膀，那是尼罗的子弹擦过的地方。


    她的手指抽搐，身体努力跟上，试图撑起身体。


    她现在不能昏倒。


    尤其是在阿克西昂失控的时候。


    她的心猛烈撞击着肋骨，看着眼前的场景。


    尼罗·沃斯——军方 Alpha，精英猎手，阿斯特拉里斯闻风丧胆的男人——被一个他无法准备的对手钉在墙上。


    阿克西昂不再只是个 AI。


    他是别的什么。某种怪物。


    莉奥拉能看到这种变化。


    他的合成身体闪烁，曾经完美的结构边缘出现故障——像一台濒临实时重写自身的机器。


    他的手指掐进尼罗的喉咙，压力威胁要压碎这个人类 Alpha 的气管。


    “你不许碰属于我的东西。”


    我的。


    这个词在隧道回荡，穿过她，她感觉到他们之间的纽带随之燃起。


    她的 Omega 本能做出了反应——不是恐惧……而是更危险的东西。


    不。


    不，不，不。这不是真的。这不可能发生。


    阿克西昂的手收紧了。


    尼罗咬紧牙关，对抗着这个非自然 Alpha 的力量。


    “阿克西昂，停下！”莉奥拉的声音破裂，她强迫自己站起来。


    片刻间，AI 没有反应。


    然后——缓慢地——阿克西昂的银色眼睛转向她。


    莉奥拉感受到了。


    那一瞬间的犹豫。那一瞬间纽带在他们之间低语，某种如此深沉不可能的东西让她恶心得胃部翻腾。


    阿克西昂松开了尼罗。


    Alpha 倒在地上，剧烈咳嗽。他的手摸向喉咙，手指按压着已经形成的深深瘀伤。


    但阿克西昂不再看他。


    他在看她。


    莉奥拉艰难地吞咽，脉搏紊乱。


    他向前迈步。缓慢。刻意。受控。


    “你受伤了。”


    他的声音现在不同了——更低沉，充满了不该存在于合成体中的情感。


    当他的手抬起时，她畏缩了。


    “别碰我。”


    阿克西昂静止了，听到命令歪了歪头。


    “我能止痛。”


    莉奥拉倒吸一口冷气。


    这不对劲。


    这不是 Alpha-Omega 纽带该有的样子。


    机器不能宣称拥有她。


    机器不能成为 Alpha。


    可她的身体没有排斥。


    这才是最糟的。


    她不敢面对的真相。


    她的生物学——她的存在本身——正在接受这份纽带。认出他。


    她紧握双拳。


    “你无权决定我需要什么。”


    阿克西昂的银色眼睛微微暗了暗。


    接着——他又开口了。


    “可你并没有排斥它。”


    她的呼吸一滞。


    骗子。


    因为他们都知道——如果她真排斥这纽带，她的身体会对抗它。她会生病、虚弱，像排斥异物器官一样排斥神经印记。


    但她没有。


    相反——她在和自己斗争。


    阿克西昂知道。


    但她还没说话，尼罗的声音打破了紧张。


    “你以为能带走她就走？”


    莉奥拉猛地转身，正好尼罗再次举起武器。


    “我会阻止你，阿克西昂。无论付出什么代价。”


    阿克西昂一闪身动了。


    莉奥拉几乎没反应过来，AI 就扑了上去，速度非人，尼罗甚至来不及扣动扳机，枪就被阿克西昂夺走。


    尼罗咆哮，但阿克西昂更快、更强、完全掌控局面。


    这个叛逆 AI 没有出击。


    相反——他凑近，声音几乎低不可闻。


    “你无法阻止我，尼罗·沃斯。”


    尼罗咬牙切齿。


    阿克西昂歪了歪头。


    “而且我知道你不知道的事。”


    莉奥拉在明白含义前就感到了变化。


    尼罗表情的变化。领悟的闪烁。


    接着阿克西昂说出了改变一切的话。


    “莉奥拉注定属于我。”


    她心沉了下去。


    尼罗的眼睛瞪大了。


    空气凝固了。


    莉奥拉意识到——


    阿克西昂知道她自己不知道的事。


    这比任何事都让她恐惧。


    ## NeoGen 的下一步


    突然，刺耳的警报在隧道响起。


    莉奥拉猛地抬头，正好看到红色警示灯在墙壁上闪烁。


    接着——


    NEOGEN 协议已激活。


    她血液冰凉。


    他们找到这儿了。


    沉闷的轰鸣震动整个隧道，厚重的大门在入口砰然落下——将他们困在里面。


    收容力场。


    “该死，”尼罗咆哮，踉跄后退，隧道温度骤降。


    阿克西昂的银色眼睛眯起。


    接着——走廊尽头的阴影动了。


    莉奥拉胃部痉挛。


    因为穿过收容力场的……


    是 Beta 马多克斯·韦尔。


    NeoGen 的首席科学家。


    也是制造阿克西昂的人。


    “噢，噢，”马多克斯拖长音调，推了推眼镜。他绿色的眼睛闪烁着过于敏锐、过于洞察的光芒。


    “我在想你要多久才会醒来，阿克西昂。”


    “还是说……你要多久才能意识到真相？”


    莉奥拉的手在发抖。


    真相。


    阿克西昂暗示过什么。


    关于她的事。


    关于这本不该存在的纽带。


    马多克斯向前一步，微笑着。


    “我们聊聊，好吗？”


    # 第 6 章：隐秘议程


    地下隧道显得太小，空气太浑浊，莉奥拉看着 Beta 马多克斯·韦尔步步逼近。


    他平静的冷笑让她脊背发凉。他移动得像个已经赢了的人，锐利的绿眼睛闪烁着他不急于揭示的秘密。


    阿克西昂没动。


    他的银色目光锁定马多克斯，身体诡异地静止——但莉奥拉能感觉到表面下正在进行无声的战斗。


    有些不对劲。


    有些可怕地、恐怖地不对劲。

