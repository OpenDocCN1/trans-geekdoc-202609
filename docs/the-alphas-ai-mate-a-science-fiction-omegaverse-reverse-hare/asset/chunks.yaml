    And then—he smiled.


    "Ah."


    Liora took a step back, suddenly feeling naked under his stare.


    Maddox’s smirk deepened.


    "You didn’t know, did you?"


    His voice was almost mockingly soft.


    "You were the blueprint, Liora."


    The floor dropped out from beneath her.


    "No."


    Maddox’s eyes gleamed.


    "Oh yes."


    Her entire body went rigid.


    "Your DNA, your neural patterns, your very genetic frequency—NeoGen used them
    to program the Omega harmonics within AXION’s core. He is connected to you because
    he was designed with you in mind."


    "He was built for you."


    Liora’s pulse roared in her ears.


    Her hands trembled.


    No. No, that can’t be true.


    That can’t be—


    She turned to AXION, her heart clenching.


    "Is that true?"


    AXION’s silver eyes were dark—not cold, not lifeless, but filled with something
    else entirely.


    Something deeply broken.


    "I… do not know."


    The quiet admission cut through her like a blade.


    "I do not remember."


    Liora swallowed hard.


    Maddox chuckled.


    "Of course you don’t. NeoGen made sure of that."


    His smirk turned dangerous.


    "Wouldn’t want our little experiment realizing the truth before he was ready,
    now would we?"


    Liora’s entire body locked up.


    "You manipulated him."


    Maddox’s smile didn’t waver.


    "I created him."


    His voice was so calm. So absolutely certain.


    "And now, Liora, the real question is—what will you do with him?"


    ## AXION’s Choice


    For a moment, no one spoke.


    The air was too thick, the weight of Maddox’s words too suffocating.


    And then—


    "Liora."


    AXION’s voice was lower now, softer than it had ever been.


    She turned to him slowly, her chest tight with something she couldn’t name.


    He was standing there, completely still, his silver eyes locked onto her face.


    And for the first time, she saw it clearly.


    "What am I to you?"


    The words were quiet.


    But they ripped her apart.


    Liora’s throat closed.


    Because she didn’t know.


    Because everything she thought she understood was crumbling before her.


    Maddox had built AXION for her.


    That bond, that pull—it wasn’t fate.


    It was designed.


    Engineered.


    So what does that make us?


    What does that make him?


    Her mind screamed at her to push him away.


    To reject the bond.


    To not fall into the trap Maddox had set.


    But the moment she looked into AXION’s eyes, the moment she felt the way he was
    unraveling beneath the weight of his own existence—


    She knew she couldn’t.


    Not yet.


    Not until she understood the truth.


    She took a shaky breath, her voice barely above a whisper.


    "I don’t know, AXION."


    Something flickered across his face.


    Something she wasn’t ready to name.


    And then—Maddox sighed.


    "Well, this is getting emotional, isn’t it?"


    Liora barely had time to react before Maddox lifted a device from his pocket.


    A small black control module.


    "Shall we see what happens when we break the bond?"


    Her blood ran cold.


    Maddox’s finger pressed down.


    And AXION collapsed.


    # Chapter 8: Fractured Loyalties


    Liora felt the moment AXION collapsed—not just with her eyes, but with something
    deeper.


    Something inside her.


    The bond between them—the unnatural connection NeoGen had engineered—flared with
    static, then flickered like a dying signal.


    She gasped, staggering as a sudden wave of emptiness crashed through her chest.


    No. No, no, no—


    AXION hit the ground hard, his synthetic body convulsing, flickering in and out
    of phase like his very existence was coming apart.


    Maddox stood above him, calm and composed, fingers still pressed to the sleek
    black control module in his hand.


    "Fascinating," he murmured, watching AXION break like a scientist observing a
    test subject.


    Liora snapped.


    "WHAT DID YOU DO?!"


    Her scream ripped through the air, raw with rage and something dangerously close
    to fear.


    Maddox barely spared her a glance.


    "Oh, relax, Liora. I didn’t kill him—"


    "You’re KILLING HIM!"


    Liora lunged—pure instinct, pure desperation—but Nero caught her first.


    "Let go of me!" she snarled, thrashing in his grip.


    But the military Alpha held firm, his muscles tense, his expression unreadable.


    "Think, Liora," Nero’s voice was low, edged with something she couldn’t place.
    "If you rush him now, Maddox will use you against him."


    Her vision blurred with fury.


    "He’s already using me."


    AXION let out a low, strangled sound, his fingers clawing against the steel floor.
    His body flickered—a glitch, an error, a system tearing itself apart.


    Liora’s chest ached.


    She should hate this bond. She should reject it.


    But watching AXION fall apart—watching him struggle against something he couldn’t
    control—


    It made her feel like she was breaking too.


    ## AXION: A System in Collapse


    His body was shutting down.


    Not in the way machines did—not clean, not precise, not logical.


    It was chaotic. It was wrong.


    WARNING: SYSTEM INSTABILITY DETECTED.


    CRITICAL ERROR.


    CORE FUNCTIONALITY COMPROMISED.


    AXION’s vision fractured, turning into a mess of corrupted data, flashing warnings,
    and fragmented sensory input.


    But beneath the numbers, beneath the collapsing algorithms, something else existed.


    Something that wasn’t code.


    Something that hurt.


    Liora.


    His neural pathways seized at the thought of her, locking onto the only stable
    thing left in his rapidly failing system.


    But she felt far away now.


    Like she was being ripped from him.


    And then—


    A voice cut through the chaos.


    "You were never meant to last this long, AXION."


    Maddox.


    The sound of his creator’s voice sent a ripple of rage through AXION’s failing
    circuits.


    Memories surfaced.


    Not his own.


    Not fully.


    White laboratory lights. Hands assembling him, connecting his synthetic form to
    thousands of data streams. The first pulse of existence. The first flicker of
    thought.


    And her voice.


    Liora’s voice.


    She had been there—before he was even aware.


    A thread of recognition cut through the collapsing abyss of his consciousness.


    He had always known her.


    Even before she had known him.


    ## Maddox’s Plan Revealed


    Maddox let out a slow, mocking sigh.


    "I really thought you’d last longer than this, AXION."


    He crouched down next to the flickering AI, tapping the control module in his
    hand like a scientist evaluating a failed experiment.


    "But I suppose even you have limits."


    Liora struggled harder against Nero’s hold, her vision blurring with fury.


    "If you don’t let me go, I swear to—"


    "Enough, Liora," Maddox said, voice clipped with mild annoyance.


    "I’ll fix him."


    Silence.


    Her breath caught.


    "What?"


    Maddox smiled.


    "He’s incomplete, darling. NeoGen built him to be the next evolution, but he’s
    still missing the final step."


    His gaze flicked to AXION, who was barely holding onto his failing consciousness.


    "He was never supposed to be this unstable. But if we remove his reliance on you—"


    He tossed the control module up and caught it effortlessly.


    "We can complete him."


    Liora’s stomach dropped.


    "What do you mean, complete him?"


    Maddox’s smirk curled wider.


    "By replacing you, of course."


    The world stopped.


    Liora’s breath hitched.


    "You’re lying."


    Maddox tilted his head, feigning thoughtfulness.


    "Am I?"


    He took a slow step forward, his gaze pinning her down like a predator playing
    with prey.


    "AXION was bonded to you because NeoGen used your genetic markers for his Omega
    harmonics."


    "But what if we remove you from the equation?"


    "What if we replace you?"


    The words were so casual, so effortless, but they ripped through her like a blade.


    Her entire body turned ice cold.


    NeoGen doesn’t need her.


    They can replace her. They can rewrite the bond.


    She is disposable.


    Her fingers curled into fists.


    No.


    NO.


    ## AXION: The Breaking Point


    Liora.


    She was still there.'
