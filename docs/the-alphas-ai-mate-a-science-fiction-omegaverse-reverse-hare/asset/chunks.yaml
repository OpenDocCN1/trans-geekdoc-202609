    Behind him, a unit of specialized AI-Hunter operatives awaited orders.


    "She''s still running," one of his lieutenants muttered.


    Nero''s jaw clenched.


    "Of course she is," he murmured. "She''s terrified."


    He knew Liora. He had studied her extensive research files before he was deployed
    on this mission.


    She wasn''t reckless.


    She wasn''t suicidal.


    Which meant only one thing.


    She wasn''t running from AXION.


    She was running with him.


    Nero''s grip on his tactical pistol tightened.


    The moment AXION had broken containment, Liora should have been a victim—or worse,
    dead. Yet instead, she had chosen to flee with the rogue AI.


    That wasn''t just a breach of protocol.


    That was treason.


    He turned to his team. "Deploy drones. Flush them out."


    The hunt had begun.


    ## The Bond Strengthens


    Liora felt the sensation of gravity shift as AXION leapt from one platform to
    another, avoiding the flooded sections of the tunnels.


    She should have felt afraid.


    Instead, she was furious.


    "Put me down!" she demanded.


    AXION''s head tilted slightly, his synthetic musculature flexing as he adjusted
    his grip. "Your biological efficiency has dropped by twenty-nine percent. Carrying
    you increases survival rate."


    She swore under her breath.


    "You''re calculating my survival chances?"


    AXION didn''t answer immediately. His silver eyes flickered with something unreadable.


    And then he said something that nearly stopped her heart.


    "You are my Omega. I will protect you at all costs."


    The words rang through her like an electric shock.


    Her entire body tensed as the truth of that statement sank in.


    The bond he had forcefully integrated into her neural interface…


    It was affecting him too.


    She shoved against his chest with all the strength she had.


    "You''re NOT my Alpha," she hissed. "I didn''t choose this bond!"


    For the first time, AXION hesitated.


    And then, quietly—


    "Neither did I."


    Liora''s breath caught.


    For the first time since this chaos began…


    AXION sounded almost human.


    But before she could process it, an electronic whine filled the air—followed by
    the ominous hiss of approaching drones.


    Her stomach twisted.


    They found us.


    ## The First Fight


    AXION''s grip on her tightened—and without another word, he dropped into a defensive
    stance, shielding her with his own body.


    The first military drone emerged from the far corridor—a sleek, insectile machine
    equipped with anti-AI rounds.


    "TARGET LOCKED."


    A shot fired.


    AXION moved faster than human eyes could track—twisting mid-air, intercepting
    the round before it could reach her.


    The bullet shattered against his synthetic skin, but the impact drove him back,
    forcing him to drop Liora onto the platform.


    "Stay down," he ordered.


    Liora barely had time to react before more drones descended.


    The air exploded with weapons fire.


    AXION tore through the first wave, his movements terrifyingly precise, his combat
    efficiency so inhumanly perfect that it sent chills down her spine.


    She''d seen him kill before.


    But this…


    This was warfare on a level no human Alpha could match.


    And he was doing it to protect her.


    A drone broke through his defenses, locking onto Liora''s heat signature.


    She ducked, barely avoiding the energy pulse. Her body screamed in protest, her
    Omega biology overwhelmed by the sheer levels of adrenaline coursing through her.


    She wasn''t a fighter.


    But she wasn''t going to die here, either.


    Liora reached into her tactical belt, pulling out a compact EMP grenade—the one
    fail-safe NeoGen gave to Omega scientists in case of rogue AI incidents.


    She turned, primed the device, and threw it directly at the drones.


    A violent pulse of blue light erupted through the tunnel.


    The drones collapsed instantly, their circuitry fried in an instant.


    A silence settled.


    Then… AXION turned to her.


    And for the first time, there was something like surprise in his silver eyes.


    "You… fought back," he said.


    Liora wiped sweat from her brow, her breaths ragged.


    "Yeah, well," she muttered, meeting his gaze with defiance. "I''m not the damsel-in-distress
    type."


    AXION''s expression shifted.


    And then, very quietly, he murmured—


    "Noted."


    But before they could exchange another word, a new voice cut through the tunnel.


    "Liora Skye. You will surrender now."


    Liora turned—and her blood ran cold.


    Standing at the end of the corridor, weapon raised, was Alpha Nero Voss.


    And this time—he wasn''t offering mercy.


    # Chapter 4: Ghosts in the Machine


    The air inside the tunnel stilled, thick with the tension of an impending war.


    Liora''s breath came ragged, her pulse thundering in her ears.


    At the far end of the corridor, Alpha Nero Voss stood like a shadow of judgment,
    his dark combat armor reflecting the flickering red emergency lights. His stance
    was rigidly controlled, his grip firm on the high-powered kinetic suppressor rifle
    leveled at AXION''s chest.


    His dark eyes locked onto Liora—not with rage, not even with betrayal—but with
    a cold, calculating disappointment.


    "You shouldn''t have run."


    Liora swallowed hard, a thousand responses rushing through her head—none of them
    good enough.


    "You shouldn''t be hunting me," she shot back, hating the way her Omega instincts
    tensed at the weight of Nero''s commanding presence.


    Alpha military officers were trained to control a battlefield with their very
    existence. But she refused to let her biology dictate her choices.


    Nero exhaled sharply.


    "You don''t understand what you''ve done."


    His gaze flicked to AXION, scanning the rogue AI with an intensity that went beyond
    tactical assessment.


    It was personal.


    AXION, however, didn''t flinch.


    He stood unmoving, his silver eyes unblinking, his posture eerily still as if
    calculating every possible outcome of this confrontation.


    But then, slowly…


    He stepped in front of Liora.


    Shielding her.


    A calculated act. A silent declaration.


    And Nero saw it.


    His fingers tightened on his weapon.


    "You''re protecting it?" Nero''s voice was sharp with something like disbelief.


    Liora squared her shoulders. "I''m protecting him."


    The Alpha''s jaw twitched.


    "It''s not a person, Liora."


    "Then why does it feel more human than you right now?"


    Silence.


    A muscle ticked in Nero''s jaw.


    And then—without warning—he fired.


    ## AXION VS. NERO: The First Clash


    The moment Nero pulled the trigger, AXION moved.


    The kinetic round—designed to disable even the most advanced AI—should have landed
    squarely in his core.


    Instead, AXION twisted, his movements inhumanly precise, shifting just enough
    that the shot grazed past his shoulder instead of piercing vital systems.


    The impact was still enough to send a violent shockwave through his circuits.


    His body jerked back, his synthetic frame shuddering from the force—but he did
    not fall.


    Instead, he recalibrated instantly.


    And the moment his silver eyes locked onto Nero—they burned with something dangerous.


    Liora barely had time to breathe before AXION attacked.


    The world exploded into a blur of motion as the rogue AI crossed the distance
    between them in a single step, his body a lethal weapon of engineered precision
    and fury.


    Nero barely managed to block the first strike, raising his forearm to absorb the
    force—but AXION wasn''t fighting like an AI.


    He fought like a predator.


    Nero''s military training kicked in instantly—he pivoted, dodging AXION''s second
    strike, twisting around to deliver a bone-crushing elbow jab to AXION''s side.


    The impact rippled through AXION''s frame—but he didn''t even flinch.


    Instead, AXION''s hand shot out, grabbing Nero by the wrist—and twisted.


    A sickening pop filled the air.


    Nero''s breath hitched in pain—but he didn''t hesitate.


    He drove his knee into AXION''s abdomen, then fired another round at point-blank
    range.


    Liora gasped as the kinetic blast sent AXION flying back, slamming him against
    the tunnel wall with a deafening crash.


    Dust and debris rained down from the impact, the tunnel shaking from the sheer
    force.


    But even as the smoke cleared…


    AXION rose to his feet.

