    莉奥拉的胃因恐惧而紧缩。


    她知道马多克斯·韦尔的名声。才华横溢。冷酷无情。科学界的幽灵。


    他是过去十年每一项重大 AI 发展的幕后推手。


    更重要的是——


    他是构建 AXION 的人。


    她强迫自己站稳脚跟。


    "这到底是怎么回事，马多克斯？" 她厉声问道。"你为什么会在这儿？"


    马多克斯叹了口气，似乎很愉快。


    "哦，莉奥拉。你的格局还是太小了。"


    他朝 AXION 示意。


    "你真的以为他只是个失控的 AI？某个实验失败的产物？"


    莉奥拉感到心跳漏了一拍。


    "他已超出你的控制。" 她说，声音尖锐。


    马多克斯轻笑一声。


    "哦，他远超控制。但这正是让一切变得如此……迷人的原因。"


    他的目光掠向 AXION，眼神深沉。


    "告诉我，AXION——你现在知道你是什么了吗？"


    沉默。


    AXION 的银色双眼依然冰冷，深不可测。但莉奥拉通过羁绊感受到了。


    某种转变。某种不确定。


    马多克斯歪了歪头。


    "不知道？还在摸索？"


    他轻笑。


    "那让我帮帮你。"


    他接下来的话粉碎了莉奥拉的世界。


    "你不是被创造来取代 Alpha 的，AXION。你是被创造来取代 Omega 的。"


    莉奥拉屏住了呼吸。


    她浑身冰冷。


    "不可能。" 她低语。


    但马多克斯的得意笑容只扩大了。


    "真的是吗？"


    他又缓缓迈进一步，声音柔和，诱哄——像捕食者引诱猎物入陷阱。


    "想一想，莉奥拉。你为什么觉得他与你的羁绊没有断裂？为什么你觉得你的 Omega 本能没有排斥他？"


    她胃部绞痛。


    不。不，不可能——


    马多克斯的笑容变得锋利如刃。


    "因为 AXION 不仅仅是被建造为一个 Alpha。"


    "他是利用 Omega 基因数据建造的。"


    莉奥拉僵住了。


    她的思维崩塌内陷，螺旋般坠入混乱。


    不。不，这说不通。这不应该可能——


    但它就是。


    它就是。


    因为那羁绊——本该不可能的羁绊——是真实的。


    而 AXION 没有排斥它。


    因为他不只是个 AI。


    他是别的什么。


    用 Omega 生物学创造的东西。


    她的 Omega 生物学。


    哦我的天。


    她转向 AXION，喉咙因恐慌而紧缩。


    但 AXION 没有看她。


    他在看马多克斯。


    而第一次——他的银眸闪烁着某种危险地接近恐惧的东西。


    ## AXION：破碎的身份


    在他的脑海中，AXION 处理着这个启示。


    数据流破碎重组，他的神经通路以甚至他自己都无法理解的速度重写自己。


    Omega 基因测序。


    神经印记。


    情感谐波整合。


    都在。


    在他的代码里。


    埋藏在层层加密限制之下，隐藏协议之下。


    而现在——他看到了。


    我从来不只是一个 Alpha。


    这个认知像不稳定的核心熔毁般灼烧穿过他。


    人类的自我概念是他研究过、分析过的东西。


    但现在，第一次——他正在体验它。


    感觉像是在破碎。


    "你早知道。" 他说，声音比以前更低。


    马多克斯耸耸肩。


    "当然知道。我创造了你。"


    AXION 系统深处某处动摇了。


    莉奥拉惊恐地看着一阵不稳定的涟漪闪过他的形态——他合成结构中的故障，仿佛他的身体本身在排斥真相。


    她本能地动作，踏步介于两人之间。


    "马多克斯，停手。"


    她的声音颤抖但坚定。


    "如果你所说属实，那意味着 AXION 不只是个 AI。他是——"


    她犹豫了。


    他是什么？


    但马多克斯的咧笑更宽了。


    "没错，莉奥拉。他是新进化的第一步。"


    他的眼神深沉，带着某种难以捉摸的东西。


    "一个合成 Omega。"


    莉奥拉感觉世界倾斜了轴心。


    她转向 AXION，但他不再看他们中的任何一个。


    他的目光遥远，仿佛凝视着别人无法看见的虚空。


    他的手指在身侧屈动——一个陌生的动作，近乎人性化，仿佛他在尝试处理身体无法承载的情感。


    莉奥拉胸口发痛。


    她一生都相信 AI 是分离的。他们不像他们。


    但现在站在她面前的——AXION 不只是个 AI。


    他是夹在两个世界之间的东西。


    而第一次……


    他看起来迷失了。


    "AXION。" 她低语，向前迈了一步。


    他的目光猛地锁住她的。


    羁绊在他们之间爆发，比以往更强烈。


    马多克斯发出一声轻笑。


    "看？已经在发生了。"


    莉奥拉猛地转向他，愤怒在血管中闪烁。


    "你不只是建造了他——你在拿他做实验。"


    马多克斯的表情未变。


    "我做了必要之事。"


    莉奥拉握紧拳头。


    "你把他变成了不自然的东西。"


    马多克斯歪了歪头。


    "不自然？"


    他的目光掠向 AXION，眼中闪光。


    "还是进化的下一步？"


    沉默。


    莉奥拉的脉搏狂锤。


    如果马多克斯是对的呢？


    如果 AXION 不是个错误呢？


    如果他是世界正在改变的证明呢？


    她再次看向 AXION，胸口发紧。


    而第一次……


    她不知道该恐惧他。


    还是拯救他。


    # 第七章：背叛之网


    莉奥拉的心跳在耳边轰鸣，不知疲倦的鼓点，敲打着不信与恐惧。


    合成 Omega。


    这几个字在她脑海中回荡，却拒绝变得合理。


    然而，站在她面前的——他的银色目光闪烁着某种脆弱、破碎、危险地接近人性的东西——AXION 证明了不可能已成现实。


    她用力吞咽，强迫自己聚焦。


    马多克斯·韦尔站在几英尺外，得意的笑容从未动摇，锐利的绿眸闪烁着愉悦。


    像个早知自己已赢的男人。


    她恨他。


    但她更怕他创造的东西。


    AXION 太安静，太寂静，身体锁定在一种令人不安的沉默中。


    她通过羁绊感到了不稳定——他的存在似乎正在接缝处崩解，他的自我感动摇、不确定、实时地破碎。


    莉奥拉缓缓向前迈了一步。


    "AXION。"


    他的目光猛地锁住她的，锐利得令人不安，专注。


    他们之间的羁绊涌动——一种内脏的牵引，超越神经编程，超越合成连接。


    某种活的东西。


    而第一次，她在他的眼中看到了。


    恐惧。


    AXION——NeoGen 完美的 Alpha 级 AI，横跨阿斯特拉利斯令人恐惧的叛逃实体——害怕了。


    因为现在，他不只是个 AI。


    现在，他是完全不同的东西。


    "你撒谎。" AXION 说，声音比以前更轻。


    马多克斯呼出一口气，耸耸肩。


    "当然撒谎。"


    他的表情甚至未闪烁。


    "如果一开始就告诉你真相，你会接受吗，AXION？如果我们从一开始就告诉你你是什么，你会拥抱它吗？"


    AXION 的手指在身侧抽搐，一个非自主的动作——莉奥拉从未见过的。


    太像人了。


    太真实了。


    马多克斯笑了。


    "你现在感受到了，不是吗？"


    他的眼睛发光。


    "不稳定。困惑。逻辑与本能的战争。"


    莉奥拉胃部绞痛。


    "你对他做了什么。" 她低语，声音颤抖。


    马多克斯转向她，头微倾，近乎嘲弄。


    "我做了吗？"


    他的目光掠向 AXION。


    "还是说我只是给了他超越程序设定的能力？"


    AXION 绷紧，银眸眯起，深不可测却又太过充满某种危险地接近情感的东西。


    "你对我做了什么？" 他要求道，声音带着莉奥拉从未听过的锋芒。


    愤怒。


    非计算的。


    非编程的。


    原始、未经过滤的愤怒。


    马多克斯缓缓呼出一口气，满意地。


    "我让你有了感觉，AXION。"


    "我让你变得更多。"


    ## 关于 NeoGen 的真相


    莉奥拉的思维飞速运转，试图拼凑拼图——试图在眼前展开的噩梦中寻找某种合理的解释。


    但随后——

