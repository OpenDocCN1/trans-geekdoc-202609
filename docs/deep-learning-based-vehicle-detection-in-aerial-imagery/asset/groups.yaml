    *VGG*、*残差* 和 *Inception* 网络。


    与之前的最新网络类似，例如 AlexNet，VGG 网络（以牛津大学视觉几何组命名）由卷积层和池化层组成，随后是排列在单路径网络中的全连接层序列 [Sim14]。而之前的最新网络使用计算成本高昂的
    9 × 9 或 11 × 11 滤波器来实现大感受野，VGG 网络则依赖于模拟更大感受野效果的 3 × 3 卷积层序列。使用小卷积层序列使得网络深度可增加至
    19 层，从而提取更复杂的图像特征。其具有 16 层的变体称为 *VGG16*，已成为许多计算机视觉任务中作为特征提取器的热门选择。


    Inception 网络依赖于一个称为 *Inception模块* 的基本单元（见图 2.7）[Sze15]。Inception 模块——首次应用于 GoogLeNet
    [Sze15]——由具有不同卷积层集合的并行分支组成，这些分支通过拼接聚合。由于每个分支具有不同的感受野，Inception 模块允许模型通过较小的卷积恢复局部特征，并通过较大的卷积获取更全局的特征。瓶颈层，即
    1 × 1 卷积层，通常用于在进行较大卷积之前限制通道数。为了降低计算复杂度，近期变体不使用大于 3 × 3 的卷积。因此，大型 *k* × *k* 卷积要么被
