    ## 2.2 Deep Learning based Object Detection


    Object detection, aiming at localizing and classifying object instances from a
    large number of predefined categories in images, is a fundamental and challenging
    task in computer vision. With the remarkable success of deep learning based image
    classification methods, deep learning has been widely adopted to


    Training of this multi-stage detector is complex and time-consuming, since the
    region proposal method, the CNN used for feature extraction, the SVM classifiers
    and the bounding box regressor need to be trained and optimized separately. However,
    the main bottleneck during deployment is the feature extraction, as CNN features
    are computed for each candidate region separately [Gir15].


    Spatial pyramid pooling network (SPPNet) [He14] overcomes this bottleneck by computing
    convolutional features for the entire input image at once. To account for the
    fixed-length feature vectors as required for the fully connected layers, the last
    pooling layer is replaced by a so-called *spatial pyramid pooling layer*. The
    spatial pyramid pooling extracts features of fixed length for each candidate region
    from the shared feature map. For this, the spatial pyramid pooling layer partitions
    the features of the corresponding region of interest into fixed number of spatial
    bins at multiple levels. Applying the convolutional layers at once for the entire
    image reduces the runtime during deployment by orders of magnitude. A drawback
    of SPPNet is that the fine-tuning algorithm is unable to update the convolutional
    layers that precede the spatial pyramid pooling and consequently limits the accuracy
    of very deep networks [Gir15].


    Fast R-CNN [Gir15] addresses the drawback of SPPNet by introducing a *Region of
    Interest (RoI) pooling layer*. Similar to SPPNet, Fast R-CNN shares the computation
    of convolutions across region proposals. However, the spatial pyramid pooling
    layer is replaced by a RoI pooling layer, which enables fine-tuning of all network
    layers and consequently facilitates the use of very deep networks. By conducting
    max pooling, the RoI pooling layer converts the features inside any valid region
    of interest into a feature map with a fixed spatial extent. The feature map with
    fixed spatial extent is fed into a sequence of fully connected layers that branch
    into two sibling output layers. The first layer outputs softmax probabilities
    for the object categories and the second layer outputs class-specific bounding
    box regression offsets for proposal refinement. Unlike R-CNN and SPPNet that employ
    stage-wise training, Fast R-CNN simplifies the training procedure as classification
    and bounding box regression are trained within the network. Although Fast R-CNN
    results in improved detection accuracy and speeds up the detection process, using
    an external region proposal method remains time-consuming [Ren15].


    Faster R-CNN [Ren15] extends Fast R-CNN by integrating a sub-network called Region
    Proposal Network (RPN) that generates region proposals directly within the network.
    The RPN and Fast R-CNN share the first set of convolutional layers, so that the
    computational overhead of the RPN is small and the time for generating region
    proposals is significantly reduced. The RPN is applied on the output of the last
    shared convolutional layer, which is referred to as feature map. The RPN comprises
    a convolutional layer followed by two sibling output layers: one for classification
    and one for bounding box regression. Anchor boxes centered at each feature map
    location are used as bounding box reference for regression. In order to account
    for various object dimensions, anchor boxes with different scales and aspect ratios
    are employed. Region proposals that are likely to contain an object are then forwarded
    to the classification stage, which is in essence the Fast R-CNN detector.


    R-FCN [Dai16] is a region-based fully convolutional network based on Faster R-CNN,
    which makes use of an alternative classification stage to avoid the application
    of RoI pooling and fully connected layers for each candidate region separately.
    For this purpose, the standard RoI pooling layer is replaced by a position sensitive
    RoI pooling layer, which is applied on top of class-specific position sensitive
    score maps that are shared across the entire image and not computed for each candidate
    region separately. The position sensitive score maps that are generated by applying
    a set of convolutional layers encode the relative position of objects, e.g., top-left
    corner. The position sensitive RoI pooling layer aggregates the responses of the
    position sensitive score maps for each candidate region forwarded from the RPN.
    R-FCN achieves comparable detection results on benchmark datasets, while the runtime
    is clearly reduced compared to Faster R-CNN.


