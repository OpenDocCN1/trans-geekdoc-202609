    ## 7 运行时优化


    Detecting relevant objects in real-time or nearly in real-time is of great importance
    across a broad range of applications. In general, deep learning based object detectors,
    such as Faster R-CNN, are employed for most applications due to their superior
    detection accuracy compared to conventional counterparts. However, applying Faster
    R-CNN as object detector is not appropriate for a multitude of applications due
    to its poor inference time, which is in the context of this thesis further impaired
    by adapting Faster R-CNN to the characteristics of aerial imagery (see Section
    5.2.4). Regarding the inference time for the feature extraction, region proposal
    generation, and classification stage separately exposes that each component notably
    contributes to the overall inference time and thus, is often not directly practicable
    within the detection pipeline. To allow the use of Faster R-CNN for different
    applications depending on vehicle detection in aerial imagery, acceleration of
    each component is required.


