    # 6.2 Semantic Context


    An alternative strategy to overcome the lack of contextual information in deep
    learning based detectors adapted for vehicle detection in aerial imagery is the
    exploitation of semantic labeling networks. Semantic labeling is essentially a
    pixel-wise classification of an input image. Integrating semantic labeling into
    the detection framework allows the introduction of semantic context information,
    i.e., local surrounding of an object to detect, and thus, seems promising to reduce
    the number of false positive detections, which are often caused by rectangular
    structures in image regions that are unlike to contain vehicles such as buildings.
    For this purpose, two differing methods to integrate the semantic labeling network
    into the detection pipeline are proposed.'
