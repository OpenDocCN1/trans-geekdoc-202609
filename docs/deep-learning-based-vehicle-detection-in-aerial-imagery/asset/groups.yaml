    NMS 后排名前 2000 的区域建议，这些建议相当于前述实验中转发到分类阶段的区域建议。使用 conv3_3 的输出作为特征图可得到与 GT 注解整体重叠最佳的区域建议。虽然
    conv2_2 情况下召回值仅略低，利用更高分辨率的特征图，即分别使用 conv4_3 和 conv5_3 的输出，会产生与 GT 注解重叠明显更差的候选区域。随着特征图分辨率的提高，召回下降变得更加明显，特别是
    IoU 阈值高于 0.4 时。由于如第 5.1.2 节所述，只有重叠高于 0.5 的区域建议才被视为分类阶段训练的正样本，因此多个 GT 物体未被区域建议充分覆盖，无法以高置信度被分类为车辆。因此，漏检的概率加剧，进而检测性能下降。


