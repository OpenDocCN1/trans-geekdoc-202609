    等人 [Rus96] 使用 MLP 分析像素邻域的强度值，用于航空影像中的车辆检测。Eikvil 等人 [Eik09] 研究了结合几何形状属性、灰度特征和
    Hu 矩的方法来检测高分辨率卫星图像中的车辆。Moranduzzo 和 Melgani [Mor12, Mor13] 提出使用尺度不变特征变换（SIFT）提取关键点，并通过
    SVM 分类器将这些关键点判别为属于车辆还是背景。在 [Mor14b] 中，作者利用方向梯度直方图（HOG）特征并结合 SVM 来检测无人机获取图像中的汽车。Tuermer
    等人 [Tue13] 采用 HOG 特征和视差图，用于在

