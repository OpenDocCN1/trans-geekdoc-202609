    ## 7.1.5 Adoption to Faster R-CNN


    In the following, ZynqNet is adopted as base network for Faster R-CNN, as it possesses
    the largest speed-up for the SSD detector. For this purpose, the output of the
    4th Fire module is chosen as feature map analogous to the SSD detector. Note that
    the stride of the initial 3 × 3 convolutional layer is set to 1 in the 3rd Fire
    module. Thus, the employed feature map is only down-sampled by a factor of four
    as required for an accurate localization of small objects in case of high GSDs
    (see Section 5.2.3). In contrast to SSD, Faster R-CNN comprises an additional
    classification stage, which has to be adapted for the new base network. As described
    in Section 5.1.2, the classification stage is composed of a RoI pooling layer,
    which converts for each region proposal the corresponding features into a feature
    map with fixed spatial extent, followed by a sequence of fully connected layers
    branching in two fully connected layers: one for classification and one for bounding
    box regression. Note that by default the sequence of fully connected layers is
    adopted from the VGG16 base network. Due to the absence of fully connected layers
    in ZynqNet, different combinations of layers are examined as so-called classification
    head. The first examined classification head, in the following termed ZynqNet-Head,
    comprises all layers from ZynqNet after the 5<sup>th</sup> Fire module through
    the 9<sup>th</sup> Fire module followed by the two sibling fully connected layers
    for classification and regression, which remain unchanged for all setups. Furthermore,
    the default classification head termed VGG-Head is employed, whereby the fully
    connected layers are randomly initialized by using the Gaussian weight filler
    method. To retain a small parameter count, two variations of the VGG-Head classification
    head comprising fewer parameters are examined. For this, the number of outputs
    of each fully connected layer is reduced by factor 2 and 4, respectively.


