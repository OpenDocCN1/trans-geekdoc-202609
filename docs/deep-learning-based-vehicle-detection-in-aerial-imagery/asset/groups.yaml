    GT（绿色框）。


    ## 8.3 对未见航空影像的泛化


    以下通过在三个近期发布的航空影像数据集，即 ITCVD、DOTA 和 xView 上的辅助实验来证明所提出检测方法的泛化能力（见第 4.1 节）。请注意，所有实验均采用在
    DLR 3K 上预训练的模型。


    ### ITCVD


    在上述三个数据集中，ITCVD 在图像质量和内容方面与 DLR 3K 最为相似。两个数据集均采集于西欧城市，因此主要包含具有可比结构和物体的城市和住宅区。图
    8.7 显示了 EMT-MFD Faster R-CNN with VGG16 和 EMT-MFD Faster R-CNN with ZynqNet 在
    ITCVD 测试集图像上的定性检测结果（红色框）及其对应的 GT（绿色框），其中倾斜角度为 45 度的斜视图图像未被考虑。在部署期间，测试图像按 1.3 的因子下采样，使得
    GSD 与 DLR 3K 相似。所提出的方法即使在车辆与背景对比度较弱的情况下也能实现良好的分类和定位精度。请注意，即使在标注过程中被遗漏的多个车辆也被正确检测到，尤其是在后院和入口区域。因此，所提出的方法可很好地迁移到与所用训练数据，即
    DLR 3K 数据集，具有相似特征的未见数据。如图 8.8 所示，与作为基线的 Faster R-CNN with VGG16 相比，EMT-MFD Faster
    R-CNN with VGG16 和 ZynqNet 分别因建筑物上类车辆结构引起的误报明显更少。尽管由于采集高度低，ITCVD 包含强烈的视差效应，所提出的方法对伴随的干扰结构引起的误报具有鲁棒性，而这些结构在训练数据中几乎不存在或不存在。然而，剩余的假阳性检测是由沥青区域上的类车辆结构引起的，而漏检主要是由于部分遮挡，例如被树木遮挡，或车辆位于阴影区域（见图
    8.9），这与 DLR 3K 上的观察结果相似。


    ![](img/99de1214c29cbc525a14b293385af5cf_208_0.png)


    图 8.9：EMT-MFD Faster R-CNN with VGG16（上行）和 ZynqNet（下行）在 ITCVD 数据集上的漏检和误报的定性示例。漏检主要是由于部分被遮挡的物体，例如被树木遮挡，或位于阴影区域的物体，而误报大多由位于沥青区域的结构引起。


    ### DOTA


    与 DLR 3K 相比，DOTA 数据集包含来自多个传感器平台的图像，因而表现出不同的图像质量、不同的场景和更丰富的物体外观。图 8.10 描绘了 EMT-MFD
    Faster R-CNN with VGG16 和 with ZynqNet 在 DOTA 验证集图像上的定性检测结果（红色框）及其对应的 GT（绿色框）。为此，仅可视化车辆类别的
    GT 注释，即小型车辆和大型车辆，而棒球场、港口、桥梁等其他类别未被考虑。所有图像在部署期间均按比例缩放，以使其 GSD 与 DLR 3K 情况相似。EMT-MFD
    Faster R-CNN with VGG16 和 ZynqNet 均表现出良好的定位和分类精度，这表明在不同场景和较差图像质量情况下具有良好的迁移性。此外，还说明了提供的
    GT 的问题，即边界框对齐不佳和注释缺失，这阻碍了定量分析的有效性。与 Faster R-CNN with VGG16 相比，应用所提出的方法可明显减少由建筑物上类车辆结构引起的误报（见图
    8.11），这证实了 ITCVD 上的观察结果。


    ![](img/99de1214c29cbc525a14b293385af5cf_209_0.png)


    图 8.10：EMT-MFD Faster R-CNN with VGG16（上行）和 with ZynqNet（下行）在 DOTA 数据集上的定性检测结果（红色框）及其对应的
