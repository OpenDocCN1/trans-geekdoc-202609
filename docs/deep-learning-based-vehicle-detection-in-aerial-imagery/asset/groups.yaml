    ### Filter Pruning


    As base networks are generally pre-trained for classification on benchmark datasets
    comprising a large number of classes, e.g., ImageNet with 1000 classes, these
    networks are often over-parameterized for detection tasks with only a few classes.
    In literature, there exist several techniques to reduce the number of parameters
    and consequently the model size such as PCA decomposition [Wen17], random pruning
    [Li16, Ani17] and one-shot pruning [Li16], whereby the latter proved to outperform
    the other mentioned techniques [Ani17].


    In this thesis, the one-shot pruning strategy proposed by Li et al. [Li16] is
    applied to remove filters with redundant information, which are dispensable for
    the task of vehicle detection in aerial imagery. In an initial stage, the one-shot
    pruning, which is applied on an already trained network, measures the relative
    importance of each filter f_i within a convolutional layer by calculating its
    ℓ1-norm ||f_i||₁. ||f_i||₁ represents the average magnitude of its kernel weights
    and thus, gives an expectation of the magnitude of the output feature map, i.e.,
    smaller kernel weights tend to produce output feature maps with weak activations.
    For each filter f_i within a convolutional layer, ||f_i||₁ is calculated as ∑_{j=0}^{n_i}
    |f_{ij}| where f_{ij} is the j^{th} kernel weight of filter f_i. For every convolutional
    layer, the filters are then sorted according to the ℓ1-norm, which proved to be
    a good criterion to judge the usefulness of a particular filter [Li16]. Next,
    a fixed percentage of filters with the lowest ℓ1-norm is removed from the particular
    convolutional layer. Finally, the condensed network is re-trained in order to
    regain any knowledge lost during the pruning process.


    ### Merged Batch Normalization


    As described in Section 2.1.3, batch normalization is used to accelerate the training
    and to make the gradient propagation in the network more stable. Therefore, the
    network activations are normalized to zero mean and unit variance and transformed
    through the learned parameters γ_i and β_i as defined in eq. (2.8) and eq. (2.9),
    respectively, which can be rewritten as:


    $$\tilde{\mathbf{h}}_i^{BN} = \gamma_i \frac{(\mathbf{W}_i \mathbf{h}_{i-1} +
    \mathbf{b}_i) - \mu_B \mathbf{e}}{\sqrt{\sigma_B^2 + \epsilon}} + \beta_i \mathbf{e}$$
    (7.1)


    As μ, σ², γ_i and β_i are constant during inference, they can be merged into the
    weights and biases of the previous convolutional layer as proposed in [Fu17].
    Note that μ and σ² are the average of the mean and variance values computed for
    each batch during training. The new convolutional layer can then be written as
    eq. (7.4), where Ŵ_i and b̂_i are the rescaled weights and biases of layer i given
    in eq. (7.2) and eq. (7.3), respectively.


    $$\hat{\mathbf{W}}_i = \gamma_i\left(\frac{\mathbf{W}_i}{\sqrt{\sigma^2 + \epsilon}}\right)$$
    (7.2)


    $$\hat{\mathbf{b}}_i = \gamma_i\left(\frac{\mathbf{b}_i - \mu \mathbf{e}}{\sqrt{\sigma^2
    + \epsilon}}\right) + \beta_i \mathbf{e}$$ (7.3)


    $$\tilde{\mathbf{h}}_i^{BN} = \hat{\mathbf{W}}_i \mathbf{h}_{i-1} + \hat{\mathbf{b}}_i$$
    (7.4)


    Merging batch normalization related variables into the weights and biases of the
    previous convolutional layers leads to improved inference time, as the additional
    computational costs of the batch normalization layers are removed.


    ### Computation-Efficient Classification Heads


    As described in Section 7.1.1, (c + 4)k convolutional filters with kernel size
    3 × 3 are applied at each feature map location to predict c confidence scores
    and four bounding box offsets relative to the anchor boxes. In the context of
    this thesis, the number of categories c is set to 2, i.e., background and category
    vehicle, and the number of anchor boxes is set to 5, yielding in total 30 convolutional
    filters. Motivated by the modifications proposed in [San18, Wan18b], the parameter
    count and computational costs can be reduced by replacing the expensive 3 × 3
    convolutions with more lightweight building blocks. In the following, three different
    building blocks are considered as classification head, i.e., DSCs, 1 × 1 convolutions
    and 1 × 1 group convolutions.


    ## 7.1.4 Experiments and Discussion


    The effect of the employed base network on the detection performance is evaluated
    on the DLR 3K dataset. Table 7.7 gives the detection accuracy by means of AP and
    the inference time benchmarked on the server and desktop setup introduced in Section
    5.2.4. The inference speed reported in frames per second (FPS) is averaged over
    500 forward passes on images with size 936 × 936 pixels. As for Faster R-CNN timings,
    all time measurements exclude preprocessing steps and 10 forward passes are performed
    to warm-up the GPU kernels. Note that the benchmarks do not include the NMS stage
    to better judge the impact of architectural changes.


    Using VGG16 as base network exhibits the best AP, which is roughly on par with
    Faster R-CNN (see Section 5.2). However, the inference time, in particular on
    the desktop setup, may not be satisfactory for real-world applications often requiring
    processing of even larger images, e.g., full HD. Replacing VGG16 with the computation-efficient
    CNN architectures leads to a vast gain in inference speed. For MobileNet, ShuffleNet
    and PeleeNet that are trained with batch normalization layers, the inference times
    are reported with and without these layers. Using the merging process described
    in Section 7.1.3 results in considerably improved inference times, while the inference
    times with batch normalization layers are only slightly better compared to VGG16.
    Note that the merging process does not affect the detection accuracy, as it is
    only an identity transformation. Hence, all further results are reported with
    merged batch normalization layers.

