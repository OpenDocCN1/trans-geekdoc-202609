    # Ablation Experiments


    In the following, the differing semantic labeling architectures are evaluated
    on the Potsdam dataset introduced in Section 4.1 to assess the potential of each
    architecture for integration into the Faster R-CNN detection framework. For training,
    the original image patches are cropped into tiles of size 256 × 256 pixels with
    an overlap of 50%. In addition, data augmentation is performed through applying
    vertical and horizontal flipping as well as rotation in steps of 90 degrees, so
    that the number of training samples is increased by a factor of 8. At test time,
    image tiles of size 512 × 512 pixels with 50% overlap between tiles are used.
    For each tile, the central 384 × 384 pixels are selected for the final semantic
    labeling mask, which exhibited slightly better performance in preliminary experiments
    compared to averaging the overlapping regions. The performed stitching strategy
    further reduces artefacts at image borders and stitching borders, respectively.
    Each model is trained for 100,000 iterations'
