    view with a tilt angle of 45 degrees are not considered. During deployment, the
    test images are down-scaled by a factor of 1.3, so that the GSD is similar to
    DLR 3K. The proposed methods achieve a good classification and localization accuracy
    even in case of a weak contrast between vehicle and background. Note that even
