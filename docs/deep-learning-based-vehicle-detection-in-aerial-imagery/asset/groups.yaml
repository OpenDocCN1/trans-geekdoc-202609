    0.5 时，FP 的数量减少了 58.8%，而 FN 的数量几乎保持不变。相应的语义标注掩膜仍显示出整体场景的良好结果，尽管训练设置是针对检测任务选择的，例如批量大小或迭代次数。良好的语义标注结果对于通过增强场景知识来提高检测性能至关重要，否则检测性能可能会因语义标注分支造成的干扰而下降。


    分析剩余的 FP 强调几乎没有建筑物上的 FP。图 6.16 中给出的剩余 FP 的定性示例说明，大多数 FP 可以归因于位于道路附近或树下、如拖车或垃圾容器之类的类车辆结构。检查语义标注掩膜显示，FP
    的相应像素主要也被标记为类别 car 或 tree。因此，语义标注结果与生成的检测结果非常一致。


    ![](img/99de1214c29cbc525a14b293385af5cf_139_0.png)


    图 6.16：EMT Faster R-CNN with FCN-D16 的剩余 FP 的定性示例。大多数 FP 可以归因于位于道路附近或树下的类车辆结构，而几乎没有建筑物上的
    FP。


    由于航空影像通常表现出更高的 GSD，因此对 IMT Faster R-CNN 和 EMT Faster R-CNN 的检测性能在各种 GSD 下进行了评估。因此，用于训练和测试的图像瓦片按因子
    2、3、4 和 5 下采样，分别得到 10 cm、15 cm、20 cm 和 25 cm 的 GSD。对于每个 GSD，模型分别训练，其中语义标注分支采用
    FCN-D16。锚框尺度针对每个 GSD 进行调整，使得相应的锚框面积等同于平均目标尺寸。如表 6.10 所示，EMT Faster R-CNN 在所有 GSD
    下均实现了最佳 AP。与基线 Faster R-CNN 相比，AP 的增益随着 GSD 的增大而增加，这表明由于所提出架构带来的额外语义上下文信息，即使在高
    GSD 情况下的小目标也能提升检测性能。IMT Faster R-CNN 在低 GSD 下优于 Faster R-CNN，而在高 GSD 下检测精度几乎相似。这表明通过添加额外的语义标注分支而隐式地适应检测分支特征的影响在高
    GSD 下会减小。影响的减小并不令人意外，因为高 GSD 下的语义标注结果也会下降，这在这种情况下可能由为检测任务设计的训练设置所强化。注意，所使用的联合检测和语义标注架构是针对低
    GSD 设计的，因为原始 GSD 为 5 cm。例如，采用第 5.2 节中展示的较粗糙特征图可以改善高 GSD 下的检测性能。


    表 6.10：基线 Faster R-CNN、IMT Faster R-CNN 和 EMT Faster R-CNN 在 Potsdam 数据集上针对不同
    GSD 的平均精度。


    | 方法 | 5 cm | 10 cm | 15 cm | 20 cm | 25 cm |

    |---|---|---|---|---|---|

    | Faster R-CNN | 95.7 | 93.0 | 90.5 | 83.2 | 67.5 |

    | IMT Faster R-CNN | 96.1 | 95.0 | 91.5 | 83.2 | 67.6 |

    | EMT Faster R-CNN | **96.8** | **95.8** | **92.4** | **85.7** | **71.2** |


    最后，所提出的 IMT Faster R-CNN 和 EMT Faster R-CNN 与第 6.2.2 节中引入的基于语义标注过滤的 Faster R-CNN
    以及另外两个基线进行了比较。对于基于语义标注的过滤，使用 FCN-D16 生成语义标注掩膜并使用 eq. (6.1) 作为过滤准则。作为进一步的基线，考虑了带硬负样本挖掘的
    Faster R-CNN 和一种称为 Multi-Feature Faster R-CNN 的 Faster R-CNN 扩展。用于硬负样本挖掘的在线硬样本挖掘
    OHEM [Shr16b]，该方法在基准数据集上可获得改进的检测结果。因此，检查了影响所用特征图学习的一种替代策略。Multi-Feature Faster
    R-CNN 是一种增加语义上下文信息的直接替代方案。为此，使用 conv5_3 的输出作为分类阶段的额外特征图。对于每个区域建议，提取相应的特征并通过逐元素相加与
    conv4_3 的特征融合，方式与 EMT Faster R-CNN 类似。注意，所有模型均在与 IMT 和 EMT Faster R-CNN 类似的增强数据上训练。对于另外两个基线，设置均采用自基线
    Faster R-CNN。


    最佳检测精度由 EMT Faster R-CNN 实现，其明显超过了基线方法和基于语义标注过滤的 Faster R-CNN 的 AP（见表 6.11）。Multi-Feature
    Faster R-CNN 实现的相对较差的 AP 显示，添加来自显式学习场景知识的语义标注分支的特征，优于简单地添加来自更深层的特征。IMT Faster
    R-CNN 略优于带 OHEM 的 Faster R-CNN，这表明通过添加辅助语义标注分支来引入语义上下文信息是影响用于检测的特征图学习的一种有效方法。尽管基于语义标注过滤的
    Faster R-CNN 将基线 Faster R-CNN 的 AP 提高了 0.3%，显示出基于语义标注过滤的好处，但与将语义标注直接纳入检测框架相比，对检测精度的<|message|>
    影响较小。


    表 6.11：在 Potsdam 数据集上，IMT Faster R-CNN 和 EMT Faster R-CNN 与基线方法相比的平均精度和推理时间。


    | 方法 | AP（%） | 时间（ms） |

    |---|---|---|

    | Faster R-CNN | 95.7 | **58** |

    | Multi-Feature Faster R-CNN | 95.8 | 65 |

    | Faster R-CNN + OHEM | 96.0 | **58** |

    | Faster R-CNN + Semantic Filtering | 96.0 | 138 |

    | IMT Faster R-CNN | 96.1 | **58** |

    | EMT Faster R-CNN | **96.8** | 65 |


    最后，通过对包含 700 个 600 × 600 像素图像瓦片的完整测试集进行平均来评估所有方法的推理时间（见表 6.11）。所有时间测量均在单块 GTX
    TITAN X GPU 上进行，使用第 5.2.4 节中介绍的服务器设置。基于语义标注过滤的 Faster R-CNN 显示出最差的推理时间，因为检测网络和语义标注网络是分开计算的。IMT
    Faster R-CNN 的推理时间与基线 Faster R-CNN 相同，因为 IMT Faster R-CNN 的额外语义标注分支在部署时可以禁用，因此不会产生计算开销。由于语义标注分支的特征用于分类阶段，EMT
    Faster R-CNN 在检测精度显著提高的同时导致了略微增加的运行时间。因此，所提出的联合语义标注和检测架构是在不明显恶化推理时间的情况下将语义标注集成到
    Faster R-CNN 中的有效方法。


    ### 6.2.4 对 DLR 3K 数据集的适应


    如第 6.2.2 节和第 6.2.3 节所示，所提出的方法在 Potsdam 数据集上实现了良好的检测结果。然而，所包含的训练数据相对较差，因为使用了语义标注程序并且使用了正射校正的
    RGB 图像，这可能会阻碍最优特征表示的学习。关于所使用语义标注程序的主要问题是，尽管车辆清晰可见，但仍将树下的车辆标记为类别 tree（见图 4.7），而所使用的
    RGB 图像包含明显的伪影（见图 6.17）。为克服这些问题，在本论文的背景下为 DLR 3K 数据集生成了语义标注掩膜。数据集的精炼和增强版本已如前所述与
    DLR 合作公开发布。如图 6.18 所示，采用了 Potsdam 数据集的六个类别。与 Potsdam 数据集不同，清晰可见的树下车辆被标记为类别 car。此外，由语义标注掩膜扩展的
    DLR 3K 数据集允许将所提出的方法与其他车辆检测方法进行比较。注意，Potsdam 数据集最初为高分辨率航空影像的语义标注任务设计，没有边界框标注，因此在文献中很少被用于车辆检测任务。

