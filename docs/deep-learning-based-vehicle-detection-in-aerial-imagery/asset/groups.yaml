    ## 2 相关工作


    ## 3 概念


    本论文旨在设计一种基于深度学习的检测流程，用于低空间分辨率航拍图像中的车辆检测。虽然低空间分辨率能够覆盖大范围区域，但出现的车辆尺寸较小，使得检测更加困难。由于
    Faster R-CNN 与其他基于深度学习的检测器相比具有更优的检测准确率，特别是在小目标实例方面，因此选择其作为基础检测框架。Faster R-CNN
    由两个模块组成：一个称为 RPN 的初始模块，用于生成一组候选区域，然后将这些候选区域传递给后续的分类阶段。RPN 和分类阶段共享一系列用作特征提取器的卷积层，而最后一个卷积层的输出（称为特征图）作为两个模块的输入。请注意，现代基于深度学习的检测框架（如
    Faster R-CNN）是为基准检测数据集设计的，这些数据集与航拍图像明显不同。因此，需要针对航拍图像的具体特征进行若干调整。尽管检测准确率有所提高，但这些必要的调整也带来了一些缺点，例如推理时间较长，以及所用特征的语义和空间内容较低。专门为解决这些缺点而设计的检测流程的整体概念如图
    3.1 所示。基本保持不变的 RPN 和分类阶段用灰色框突出显示。为减少计算量进而缩短推理时间所进行的修改，即搜索区域限制和计算高效的特征提取，用蓝色框强调。绿色框表示用于增加所用特征的语义和空间上下文信息的新组件，从而提高检测准确率。请注意，所提出的组件并不局限于
    Faster R-CNN，因此可以集成到其他基于深度学习的检测框架中。根据应用或目标数据的不同，这些组件可以独立应用，也可以与其他替代方案（例如不同的特征提取器）进行交换。


    ![](img/99de1214c29cbc525a14b293385af5cf_59_0.png)


    图 3.1：基于 Faster R-CNN 检测框架（包含 RPN 和分类阶段）的所提出检测流程的整体概念。添加了两个新组件，即语义标注（semantic
    labeling）模块和上下文增强模块（context enhancement module），以通过整合语义和空间上下文信息来提高检测准确率。引入了搜索区域缩减模块和改进的特征提取器，以降低计算成本，进而缩短推理时间。


    ### 检测框架调整


    在本论文中，Faster R-CNN 被用作基础检测框架。与其他基于深度学习的检测框架相比，Faster R-CNN 实现了更优的检测准确率，尤其是在小目标实例方面，因此似乎是车辆检测任务中最有前景的方法。

