    # 1.3 Contributions


    The aim of this thesis is the design of a deep learning based detection pipeline
    for vehicle detection in aerial imagery with low spatial resolution, thus enabling
    the coverage of large areas. The work presented in this thesis makes the following
    contributions to the field of deep learning based vehicle detection:


    +   - A thorough analysis of applying deep learning based detection frameworks
    for the task of vehicle detection in aerial imagery is conducted in detail for
    the first time. Relevant adaptations to address the characteristics of aerial
    imagery are systematically examined by means of the popular Faster R-CNN detector
    [Ren15], which comprises a good trade-off between detection accuracy and inference
    time. Furthermore, resulting issues with respect to real-world applications are
    identified, i.e., false alarms caused by objects with vehicle-like structures
    and time-consuming detection components [Som17c, Som17b, Som18b].

    +   - Two novel approaches to improve the detection accuracy by enhancing the
    contextual information of the detection framework are introduced. The first approach
    aims at increasing spatial context information by combining features of shallow
    and deep layers to account for fine and coarse structures [Som18c], while the
    latter approach leverages semantic labeling – the pixel-wise classification of
    an image – to introduce more semantic context information. Two different variants
    to integrate semantic labeling into the detection framework are realized: exploitation
    of the semantic labeling results to filter out unlikely predictions [Som17a] and
    inducing scene knowledge by explicitly merging the semantic labeling network into
    the detection framework via shared feature representations [Nie18]. The proposed
    approaches yield improved detection accuracy on publicly available aerial imagery
    benchmark datasets, as the number of false alarms is considerably reduced.'
