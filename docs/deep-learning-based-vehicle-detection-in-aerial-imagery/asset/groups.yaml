    | xView [Lam18] | 轴对齐边界框 | 1,127 | 700-4k | ~250k | 30 |


    ### DLR 3K 慕尼黑车辆航空图像数据集


    DLR 3K慕尼黑车辆航空图像数据集（以下简称DLR 3K数据集）是在德国慕尼黑地面上方1000米的高度采集的，主要包含城市和住宅区，如图4.1所示。DLR
    3K数据集包含20幅分辨率为5616×3744像素、地面采样距离约为13厘米的图像，其中以旋转边界框形式提供的不同车辆类型（如轿车、卡车和拖车）的GT标注仅适用于10幅图像。在本论文的实验中，具有可用GT标注的图像被分为8幅训练图像和2幅测试图像。每幅图像被划分为936×936像素的图块。由于本论文所采用的基于深度学习的检测框架要求每幅图像至少有一个目标，因此没有任何目标的图像从训练集中移除，得到140个用于训练的图块。由于大多数车辆类型的标注数量有限，仅考虑轿车和货车两类。按照[Liu15]，将这两个类别合并为一个车辆类别。此外，根据[Sak17,
    Som17c, Tan17]，所有旋转边界框都转换为轴对齐边界框。平均边界框尺寸为28.2±8.2×28.3±8.7像素。


    ![](img/99de1214c29cbc525a14b293385af5cf_68_0.png)


    图4.1：DLR 3K慕尼黑车辆航空图像数据集[Liu15]的示例图。


    ### 车辆检测航空图像数据集


    车辆检测航空图像（VEDAI）数据集包含犹他州AGRC¹的卫星图像，这些图像于2012年春季在美国犹他州上空采集。

    ¹ https://gis.utah.gov/

    原始图像有四个未压缩通道（RGB和近红外），本论文仅使用RGB通道。如图4.2所示，这些图像包含不同的背景，如农业区、乡村和城市区域。VEDAI数据集总共包含1268幅尺寸为1024×1024像素、地面采样距离为12.5厘米的图像。此外，还提供了地面采样距离为25厘米的图像缩小版本。这两个版本分别被称为大尺寸彩色图像（LCI）和小尺寸彩色图像（SCI）。GT标注以旋转边界框的形式提供了九种车辆类型，其中轿车、皮卡和货车被归纳为小型陆地车辆。在后续实验中，采用前半部分图像作为训练数据，后半部分用于测试。与DLR
