  - '[PAGE 11]


    Faster R-CNN wie auch die anderen Deep-Learning basierten Detektionsverfahren
    auf Benchmark Datensätzen optimiert wurden, werden in einem ersten Schritt notwendige
    Anpassungen an die Eigenschaften der Luftbilddaten, wie die geringen Abmessungen
    der zu detektierenden Fahrzeuge, systematisch untersucht und daraus resultierende
    Probleme identifiziert. Im Hinblick auf reale Anwendungen sind hier vor allem
    die hohe Anzahl fehlerhafter Detektionen durch fahrzeugähnliche Strukturen und
    die deutlich erhöhte Laufzeit problematisch. Zur Reduktion der fehlerhaften Detektionen
    werden zwei neue Ansätze vorgeschlagen. Beide Ansätze verfolgen dabei das Ziel,
    die verwendete Merkmalsrepräsentation durch zusätzliche Kontextinformationen zu
    verbessern. Der erste Ansatz verfeinert die räumlichen Kontextinformationen durch
    eine Kombination der Merkmale von frühen und tiefen Schichten der zugrundeliegenden
    CNN Architektur, so dass feine und grobe Strukturen besser repräsentiert werden.
    Der zweite Ansatz macht Gebrauch von semantischer Segmentierung um den semantischen
    Informationsgehalt zu erhöhen. Hierzu werden zwei verschiedene Varianten zur Integration
    der semantischen Segmentierung in das Detektionsverfahren realisiert: zum einen
    die Verwendung der semantischen Segmentierungsergebnisse zur Filterung von unwahrscheinlichen
    Detektionen und zum anderen explizit durch Verschmelzung der CNN Architekturen
    zur Detektion und Segmentierung. Sowohl durch die Verfeinerung der räumlichen
    Kontextinformationen als auch durch die Integration der semantischen Kontextinformationen
    wird die Anzahl der fehlerhaften Detektionen deutlich reduziert und somit die
    Detektionsgenauigkeit erhöht. Insbesondere der starke Rückgang von fehlerhaften
    Detektionen in unwahrscheinlichen Bildregionen, wie zum Beispiel auf Gebäuden,
    zeigt die erhöhte Robustheit der gelernten Merkmalsrepräsentationen. Zur Reduktion
    der Laufzeit werden im Rahmen der Arbeit zwei alternative Strategien verfolgt.
    Die erste Strategie ist das Ersetzen der zur Merkmalsextraktion standardmäßig
    verwendeten CNN Architektur mit einer laufzeitoptimierten CNN Architektur unter
    Berücksichtigung der Eigenschaften der Luftbilddaten, während die zweite Strategie
    ein neues Modul zur Reduktion des Suchraumes umfasst. Mit Hilfe der vorgeschlagenen
    Strategien wird die Gesamtlaufzeit sowie die Laufzeit für jede Komponente des
    Detektionsverfahrens deutlich reduziert.'
