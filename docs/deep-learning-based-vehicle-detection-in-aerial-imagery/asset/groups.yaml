    ## 6.2 语义上下文


    克服针对航空影像中车辆检测而适配的基于深度学习的检测器缺乏上下文信息的一种替代策略是利用语义标注网络。语义标注本质上是对输入图像进行逐像素分类。将语义标注集成到检测框架中可以引入语义上下文信息，即待检测对象的局部周围环境，因此有望减少误报检测的数量，这些误报通常由图像中不太可能包含车辆的区域（如建筑物）中的矩形结构引起。为此，提出了两种不同的将语义标注网络集成到检测管道中的方法。


    本节其余部分组织如下。首先介绍了航空影像语义标注的有前景的架构。然后详细描述了两种提出的方法，并在 ISPRS 2D 语义标注挑战 Potsdam 数据集上提供了消融实验。最后，在基于
    DLR 3K 的新语义标注数据集上进行了评估，以强调集成语义标注对检测性能的影响。


    ### 6.2.1 语义标注方法


    多个 CNN 架构已被提出用于语义标注任务。下面介绍了本论文中研究的四个有前景的架构。请注意，所有考虑的架构均基于 VGG16 架构，以便将语义标注网络与第
    6.2.3 节中提出的 Faster R-CNN 检测网络融合。


    ### FCN-32s


    ![](img/99de1214c29cbc525a14b293385af5cf_119_0.png)


    图 6.4：FCN-32s 的示意结构。VGG16 的前两个全连接层分别被转换为核大小为 7 × 7 和核大小为 1 × 1 的卷积层，而最后一个全连接层则被
    6 通道的 1 × 1 卷积层替换。为了将最后一个卷积层的输出上采样 32 倍，附加了一个核大小为 64 × 64、步长为 32 的反卷积层。


    图 6.4 中所示的 FCN-32s [Lon15] 是一种为语义标注任务设计的全卷积网络（FCN）。为此，默认架构即 VGG16（见表 5.1）的全连接层被转换为卷积层。由于全连接层可以被视为覆盖整个输入维度的卷积
    [Lon15]，输入维度为 7 × 7 × 512 的 fc6 被转换为核大小为 7 × 7 的卷积层，随后的全连接层 fc7 被转换为核大小为 1 × 1
    的卷积层。原本用作分类层的最后一个全连接层被丢弃，并在 Potsdam 数据集的情况下附加一个 6 通道的 1 × 1 卷积层，以在每个粗特征图位置预测每个类别的分数。最后，通过单个反卷积层对粗预测进行上采样来实现输入图像的逐像素预测。语义标注网络使用逐像素
    softmax 损失进行训练。


    ### FCN-16s


    ![](img/99de1214c29cbc525a14b293385af5cf_120_0.png)


    图 6.5：FCN-16s 的示意结构。与 FCN-32 相反，最后一个卷积层的输出通过核大小为 4 × 4、步长为 2 的反卷积上采样两倍，然后通过逐元素相加与第
    4 个池化层的输出组合。注意，通道数通过额外的 1 × 1 卷积层进行调整。核大小为 32 × 32、步长为 16 的反卷积层用于将组合特征上采样 16 倍。


    由于 FCN-32s 因粗预测层而输出边界模糊的语义标注结果，FCN-16s [Lon15] 通过将深层粗特征与浅层精细特征组合来扩展 FCN-32s，以克服这一缺点（见图
    6.5）。Instead of up-sampling the output of information, the use of dilated convolutions
    increases the receptive field and thus, yielding more contextual information.
    类似于 FCN-32s，附加了一个 6 通道的 1 × 1 卷积层以在每个粗特征图位置预测每个类别的分数，然后应用单个反卷积层来实现输入图像的逐像素预测。


    ### SegNet


    ![](img/99de1214c29cbc525a14b293385af5cf_122_0.png)


    图 6.7：SegNet 的示意结构，由编码器和解码器网络组成。编码器的拓扑与 VGG16 的卷积部分相同，而解码器的拓扑本质上是编码器的镜像。非线性上采样通过使用最大池化索引进行，该索引编码了将前一特征图的值映射到的位置，如图
    6.8 所示。


    Badrinarayanan 等人 [Bad17] 提出了一种用于语义标注的编码器-解码器架构 SegNet，该架构在基准数据集上显示出有希望的语义标注结果。如图
    6.7 所示，SegNet 由编码器和解码器网络组成。编码器的架构在拓扑上与 VGG16 架构的卷积部分相同，而解码器的拓扑本质上是镜像的编码器。请注意，最后一个卷积层的通道数设置为
    6，以便为每个类别提供逐像素预测。与使用反卷积层上采样低分辨率特征图不同，解码器使用最大池化索引执行非线性上采样。为此，每个最大池化步骤对应的编码器的池化索引都会存储，该索引指示池化大小定义区域内的最大值位置。然后通过将特定特征图的值映射到存储的位置来进行上采样，如图
    6.8 所示，而剩余像素填充为零。以这种方式，消除了对学习上采样的需求。语义标注网络根据 FCN-32s 及其扩展使用逐像素 softmax 损失进行训练。


    ![](img/99de1214c29cbc525a14b293385af5cf_123_0.png)


    图 6.8：SegNet 中进行的非线性上采样的说明。每个最大池化步骤中池化大小定义区域内的最大值位置存储在池化索引中，用于将前一特征图的值映射到存储的位置。剩余像素填充为零。


    ### 消融实验


    下面，对第 4.1 节中介绍的 Potsdam 数据集上的不同语义标注架构进行评估，以评估每个架构集成到 Faster R-CNN 检测框架中的潜力。训练时，将原始图像块裁剪为
    256 × 256 像素的瓦片，重叠率为 50%。此外，通过应用垂直和水平翻转以及 90 度步长的旋转进行数据增强，使训练样本数量增加 8 倍。在测试时，使用
    512 × 512 像素的图像瓦片，瓦片之间重叠 50%。对于每个瓦片，选择中央 384 × 384 像素作为最终语义标注掩码，与平均重叠区域相比，在初步实验中表现出略好的性能。所执行的拼接策略进一步减少了图像边界和拼接边界处的伪影，分别。各模型训练
    100,000 次迭代

