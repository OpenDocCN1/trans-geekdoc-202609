    ### 8.4 Summary


    Finally, it is worth discussing the strengths and weaknesses of the proposed components
    and the examined combinations with respect to real-world applications. The CEM
    introduced to enhance the spatial context information of the employed features
    is straightforward to integrate into deep learning frameworks, as essentially
    the feature extraction is altered. Its benefits to the feature representation
    are demonstrated in the performed experiments by means of clearly reduced false
    alarms caused by vehicle-like structures in unlikely areas, which yields an improved
    detection accuracy. The auxiliary computational costs on the other hand only slightly
    increase the inference time, which may be tolerable for most applications in combination
    with techniques to optimize the inference time. Implementations similar to the
    CEM are a major part of the most recent deep learning based detectors that achieve
    state-of-the-art results in various domains. This further emphasizes the importance
    of such a component.


    Inducing scene knowledge via semantic labeling improves the feature representation
    as well. The detection accuracy is clearly improved, as the number of false alarms
    caused by vehicle-like structures in unlikely areas is reduced. However, in contrast
    to the CEM, the training requires semantic labeling annotations, whose generation
    is time-consuming. Thus, semantic labeling annotations are often not available
    and the training is restricted to a few aerial imagery datasets. Consequently,
    the applicability of the semantic labeling based approach may be limited to images
    similar to these datasets. Since architectures for semantic labeling in aerial
    imagery are typically developed for low GSDs, novel architectures have to be explored
    to better account for extremely fine structures as in the case of GSDs above 20
    cm. Otherwise, the potential of the semantic content information may be not fully
    exploited.


    Using computation-efficient CNN architectures considerably reduced the time spent
    for feature extraction without large drops in detection accuracy, which is essential
    for applications that have to run in real-time or near real-time. As training
    deep learning based detection frameworks with such CNN architectures does not
    depend on specific datasets, its applicability is not restricted. However, the
    drop in detection accuracy compared to heavyweight CNN architectures increases
    with higher GSDs and thus, more false alarms are caused by vehicle-like structures
    located on regions that are unlikely to contain vehicles, e.g., buildings.


    In order to reduce the computational effort and consequently, the inference time,
    two different strategies are pursued in this thesis. The first strategy aims at
    optimizing the time spent for feature extraction by replacing the default CNN
    architecture with a lightweight CNN architecture. In combination with further
    techniques for runtime optimization, i.e., filter pruning, merged batch normalization
    and exploitation of computation-efficient classification heads, the inference
    time is considerably reduced, while the detection accuracy remains almost unaffected.
    The second strategy restricts the search area to areas of interest by identifying
    and removing areas that are unlikely to contain at least one vehicle. For this,
    a novel module to classify image areas is explicitly integrated into the detection
    framework by sharing the convolutional features. As vehicles generally cover only
    a small fraction of aerial imagery, the computational efforts for the region proposal
    stage and the classification stage and, consequently, the inference time are clearly
    reduced.


    To ensure high detection accuracies at real-time or near real-time, the proposed
    approaches and strategies are combined into a single detection pipeline. The standard
    Faster R-CNN detector taken as the baseline is significantly improved in terms
    of detection accuracy and inference time. Furthermore, the proposed method outperforms
    representative existing work from the literature on different aerial imagery datasets.
    Finally, the generalization ability of the proposed method is demonstrated by
    auxiliary experiments on unseen data with differing scenarios.


    ### 9.2 Outlook


    Although the proposed method exhibits good results regarding the detection accuracy
    of vehicles in aerial imagery, further enhancements and extensions are often necessary
    to meet the requirements of real-world applications.


    Though the components proposed to reduce the computational effort result in a
    large speed-up compared to the baseline Faster R-CNN, the inference time of the
    entire detection pipeline may not be sufficient for some applications. The main
    bottleneck is an inefficient proposal generation, which can be addressed by transferring
    the corresponding processing steps to the GPU, as implemented in novel frameworks
    like the MMDetection toolbox based on PyTorch [Che19b]. Integrating the components
    proposed in this thesis into single-stage detection frameworks offers an alternative
    to overcome issues with regard to the proposal generation. A promising way to
    decrease the overall inference time is making use of the NVIDIA TensorRT[1] library,
    which facilitates high-performance inference of different deep learning frameworks.
    By combining layers and optimizing kernel selection for improved latency, throughput,
    power efficiency and memory consumption, TensorRT optimizes the inference time
    of a given pre-trained network. Moreover, TensorRT offers out-of-the-box INT8
    quantization and FP16 precision implementations of common layers as further options
    to accelerate the inference time.


    [1] https://developer.nvidia.com/tensorrt


