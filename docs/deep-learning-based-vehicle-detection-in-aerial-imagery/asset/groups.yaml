    # 2 Related Work


    The goal of this thesis is the design of a deep learning based detection pipeline
    for vehicle detection in aerial imagery. In the following chapter, an overview
    about the existing work that covers the relevant modules of the proposed detection
    pipeline is given. First of all, fundamentals of deep learning, in particular
    of convolutional neural networks, that are essential for the remainder of this
    thesis, are introduced in Section 2.1. Section 2.2 gives a thorough review about
    deep learning based detection frameworks and recent advancements. Related work
    on vehicle detection in aerial imagery is summarized in Section 2.3. The literature
    under review focuses on aerial imagery captured from aircraft, UAVs or satellites
    equipped with visual cameras operating in top view. The considered literature
    can be distinguished into conventional approaches employing handcrafted features
    and deep learning based approaches.


    # 2.1 Deep Learning


    Neural networks have been applied in computer vision and related search areas
    for a long time. Since the first attempts in 1943, when McCulloch and Pitts [McC43]
    created a mathematical model to emulate the neural networks of the human brain,
    neural networks have progressed through several evolutionary stages. Their most
    recent form is often termed *deep learning* referring to the large number of layers,
    which have become feasible with the advancements of the required hardware [Sch15].
    The most popular variant of neural networks applied to numerous computer vision
    tasks is the *convolutional neural network* (CNN). In 2012, CNNs experienced their
    wide breakthrough in computer vision with the remarkable success of AlexNet [Kri12]
    in the ImageNet classification challenge [Den09], which requires the classification
    of images'
