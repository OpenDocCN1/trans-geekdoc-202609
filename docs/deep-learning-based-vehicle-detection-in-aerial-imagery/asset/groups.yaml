    mini-batch 进行训练。通过使用 CGBN 训练 FPN，作者在 MS COCO 2017¹ 检测挑战赛中排名第一。在 [Sin18] 中，作者提出了一种新的尺度归一化训练方案，以应对目标实例的宽尺度范围。通过忽略极端尺度目标产生的梯度，对目标实例的梯度进行选择性反向传播。为了解决类别不平衡问题，Lin
    等人 [Lin17b] 提出了一种称为 focal loss 的新型损失函数，本质上是一种动态缩放的交叉熵损失。随着正确类别置信度的增加，缩放因子衰减至零，简单样本的权重降低，而训练则聚焦于困难样本。使用
    focal loss 训练结合了 SSD 和 FPN 的 RetinaNet，在 MS COCO 数据集上取得了顶尖性能。Cascade R-CNN [Cai18]
    广泛适用于各种检测框架，由一系列检测阶段组成，这些阶段使用递增的 IoU 阈值进行训练，从而依次更严格地抑制误检。RefineDet [Zha18a] 执行两步级联回归，以优化回归和类别预测。在
    [Dai17] 中，作者引入了可变形卷积和可变形 RoI 池化模块。这两个模块通过学习网格采样位置的偏移来建模几何变换，并且可以轻松替换现有 CNN 中的普通对应模块。


    ¹ https://places-coco2017.github.io/#winners


    ## 2.3 航空影像中的车辆检测


    在过去的几十年里，针对航空影像中的车辆检测任务，人们开发了各种各样的检测方法。在接下来的综述中，文献范围仅限于单幅航空影像中的车辆检测，而利用图像序列进行运动目标检测的方法，例如帧差分
    [Kum01, Rei06, Xia10]、背景减除 [Rei10, Shi12, Lia12] 或基于光流的方法 [Yao08, Yu09, Sia12]，不予考虑，因为这些方法会漏掉静止物体（如停放的车辆）。通常，航空影像中的车辆检测要么通过基于手工特征的常规检测方法实现，要么通过基于深度学习的方法实现。


