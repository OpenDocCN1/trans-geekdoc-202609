    一般来说，卷积层由一组可学习的滤波器组成，这些滤波器也称为通道，因为单个卷积滤波器无法从上一层捕获足够的信息。这组滤波器的特征由其卷积核大小定义，卷积核大小决定了相应的局部邻域，该局部邻域通常称为*感受野*。滤波器之间不共享权重，因此每个滤波器都可以自由学习不同的卷积运算。卷积层的输出通常称为*特征图*，因其具有空间特性。它跨越空间维度，并在每个位置包含一个特征向量，该特征向量的维度等于该层中滤波器数量
