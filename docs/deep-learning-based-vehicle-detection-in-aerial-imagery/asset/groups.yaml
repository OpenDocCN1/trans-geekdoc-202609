    ## 5.2.4 出现的挑战


    尽管检测精度显著提高，尤其是在高 GSD 情况下，所进行的调整也带来了一些在实际应用中必须解决的缺陷。这些缺陷主要在于所使用特征的语义和空间上下文信息较弱，以及推理时间较长，下面将对此进行讨论。


    ### 语义与空间上下文


    一般来说，CNN 中的每个卷积层都会学习复杂度递增的滤波器，因为前一层的特征会被聚合和重组。第一层学习基本的特征表示，例如边缘和角点；中间层学习响应对象的各个部分；而最后层学习更高层的表示，以识别具有不同形状和位置甚至整个场景的完整对象
    [Zho15]。此外，影响网络中某个特定单元的输入空间区域（也称为 *感受野*）以及随之而来的空间上下文信息通常会随着网络层加深而增加 [Luo16]。因此，为了精确地定位微小物体而移除深层网络以增加特征图分辨率，会导致语义和空间上下文信息的减少。


    ![](img/99de1214c29cbc525a14b293385af5cf_107_0.png)


    图 5.20：不同 GSD 下误检的错误分析。


    对错误检测的分析表明，较弱的语义和上下文信息会导致大量误检。图 5.20 使用 conv3_3 的输出作为特征图，展示了误检在定位误差和分类误差中的分布。对于所有
    GSD，误检主要源于分类误差，因为背景对象被分类为车辆。


    为了突出相对较弱的语义和上下文信息对检测精度的影响，图 3.4 定性地可视化了 GSD 为 13 cm 时的误检。这些误检主要来自具有类似车辆形状的对象，例如建筑物上的矩形结构，如太阳能电池板或窗户。请注意，其中一些误检包含激活特定车辆部件（如挡风玻璃或车头灯）响应滤波器的小型组件。图
    5.21 示例性地展示了四个滤波器的激活情况，这些滤波器既响应车辆部件，也响应类似结构。


    ![](img/99de1214c29cbc525a14b293385af5cf_108_0.png)


    图 5.21：来自 conv3_3 的四个滤波器的激活，它们对特定车辆部件以及类似结构都有响应。


    然而，观察误检周围的区域可以发现，大多数误检位于不太可能包含车辆的区域内，例如建筑物或植被。尽管训练数据中不包含此类用于分类的正样本，但所学到的表示不足以区分相关和不相关的周围区域。因此，增加所用特征的空间或语义上下文信息，以更好地学习路面或停车场等相关周围区域的表示，可以减少误检数量。第
    6 章将介绍旨在提高检测精度、丰富所用特征图空间和语义内容的方法。


    ### 推理时间


    除了检测精度，推理时间也是大多数应用（如搜索与救援任务）中的另一个关键因素。表 5.8 从推理时间的角度考察了所进行调整的影响，尤其是特征图分辨率的增加（其在检测精度上带来了最大增益）的影响。按照第
    4.2 节引入的时间测量协议，Faster R-CNN 检测器以及每个检测器组件的推理时间以毫秒（ms）为单位报告，并在包括 240 个 936 × 936
    像素图像瓦片的完整测试集上取平均值。对于服务器和台式机两种设置，总体推理时间都会随着特征图分辨率的增加而变差。虽然分类阶段的推理时间保持不变，因为所有模型都处理相同数量的候选区域，但由于特征图分辨率更高，RPN
    的推理时间显著增加。如第 5.1.1 节所述，RPN 由一个小型网络组成，在每个特征图位置上应用，并以相应特征图位置为中心的锚框用于边界框回归。使用 conv3_3
    代替 conv4_3 或 conv5_3，需要处理的特征图位置分别增加 4 倍和 16 倍，因此需要计算边界框坐标并排序的候选区域数量也分别增加 4 倍和
    16 倍。因此，计算开销明显增加。然而，推理时间的增加并不是线性的，因为 NMS 被应用于每个模型中置信度最高的 10,000 个候选区域。


    比较不同的设备设置可以发现，在性能更强的设备（即服务器设置）上花费的推理时间明显更少。尤其体现在用于特征提取的基础网络和分类阶段的推理时间上，二者明显更差。尽管在使用
    conv3_3 时会丢弃多个卷积层，但在服务器设置下，conv5_3 的推理时间仅略有增加；而在台式机设置下，特征提取的推理时间显著上升。注意，当使用 conv3_3
    时，特征提取的推理时间包括用于满足全连接层所需输入通道数的辅助卷积层所花费的时间。为了在不同设备上加速检测器，需要对特征提取以及 RPN 和分类阶段进行优化。第
    7 章将介绍解决这些问题的策略。


    表 5.8：使用不同特征图的 Faster R-CNN 推理时间比较。由于 RPN，总体推理时间随特征图分辨率升高而变差。


    | 特征图 | 组件 | 时间（毫秒） |  |

    |---|---|---|---|

    |  | 服务器 | 台式机 |  |

    | *conv3_3* | 特征提取 | 58.9 | 177.4 |

    |  | RPN | 139.8 | 212.8 |

    |  | 分类阶段 | 87.5 | 273.3 |

    |  | 总计 | 286.2 | 663.5 |

    | *conv4_3* | 特征提取 | 59.1 | 230.2 |

    |  | RPN | 40.1 | 58.7 |

    |  | 分类阶段 | 86.9 | 275.2 |

    |  | 总计 | 186.1 | 564.1 |

    | *conv5_3* | 特征提取 | 62.0 | 255.6 |

    |  | RPN | 20.3 | 23.6 |

    |  | 分类阶段 | 86.8 | 273.7 |

    |  | 总计 | 169.1 | 552.9 |


    ## 6.1 空间上下文


    在 Faster R-CNN 中利用较浅层作为特征图，对于航空影像中的车辆检测至关重要，因为较深层的分辨率通常不足以精确定位微小物体。为了克服因缺乏语义和上下文内容而导致的误报，本论文提出了一种对原始
    Faster R-CNN 架构的扩展，称为多特征反卷积（MFD）Faster R-CNN。MFD Faster R-CNN 的示意结构如图 6.1 所示。受旨在预测精细和粗略结构的语义标注网络的启发，来自不同层（以不同蓝色调表示）提供不同语义和上下文信息的特征被组合在一起。为此，引入了一个以绿色突出显示的上下文增强模块（CEM），以允许组合这些特征，同时保持足够高的特征图分辨率以定位微小物体。下面介绍
    CEM 和实现细节，随后通过实验和对结果的讨论来突出增强的检测精度。


    ![](img/99de1214c29cbc525a14b293385af5cf_113_0.png)


    图 6.1：提出的多特征反卷积 Faster R-CNN 的示意结构。该结构通过 CEM 扩展了原始 Faster R-CNN，以结合浅层和深层特征，同时保持足够高的特征图分辨率以定位微小物体。

