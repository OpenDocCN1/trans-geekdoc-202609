    the proposed approaches with further vehicle detection methods. Note that the
    Potsdam dataset originally designed for the task of semantic labeling of high-resolution
    aerial imagery comprises no bounding box annotations and thus, is only rarely
    considered for the task of vehicle detection in literature.'
