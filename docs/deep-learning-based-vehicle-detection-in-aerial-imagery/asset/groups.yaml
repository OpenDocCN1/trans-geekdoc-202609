    a novel component denoted as context enhancement module (see Figure 3.1). To integrate
    semantic and contextual information of deep layers, while maintaining a high feature
    map resolution, the features of deep layers are up-sampled via deconvolution and
    combined with features of shallow layers, which is a similar concept as in [Lin17a,
    Woo18]. Adopting the proposed deconvolution module for other detection frameworks
    confirms the benefit of adding context information from deep layers for vehicle
    detection [Aca18].


