    ## 7.1.3 运行时优化的辅助技术


    除了利用计算高效的 CNN 架构外，下文还介绍了本论文背景下为优化推理时间而采用的进一步技术。


    ### 滤波器剪枝


    由于基础网络通常是在包含大量类别的基准数据集（例如包含 1000 个类别的 ImageNet）上为分类任务预训练的，因此这些网络对于只有少数类别的检测任务来说往往参数过多。文献中存在多种减少参数数量进而缩小模型规模的技术，例如
    PCA 分解 [Wen17]、随机剪枝 [Li16, Ani17] 和一次性剪枝 [Li16]，其中后者被证明优于上述其他技术 [Ani17]。


    在本论文中，采用 Li 等人 [Li16] 提出的一次性剪枝策略，去除那些对于航拍图像中车辆检测任务而言非必要且携带冗余信息的滤波器。在初始阶段，对已经训练好的网络应用一次性剪枝，通过计算卷积层中每个滤波器
    f_i 的 ℓ1 范数 ||f_i||₁ 来衡量其相对重要性。||f_i||₁ 表示其卷积核权重的平均幅值，因此可以预期输出特征图的幅值大小，即较小的卷积核权重往往会产生激活较弱的输出特征图。对于卷积层中的每个滤波器
    f_i，||f_i||₁ 按 ∑_{j=0}^{n_i} |f_{ij}| 计算，其中 f_{ij} 是滤波器 f_i 的第 j 个卷积核权重。随后，对每个卷积层中的滤波器按
    ℓ1 范数排序，该范数被证明是判断特定滤波器有用性的良好标准 [Li16]。接下来，从特定卷积层中移除一定比例 ℓ1 范数最低的滤波器。最后，对精简后的网络进行重新训练，以恢复剪枝过程中损失的任何知识。


    ### 合并批归一化


    如第 2.1.3 节所述，批归一化用于加速训练，并使网络中的梯度传播更加稳定。因此，网络激活值被归一化为零均值和单位方差，并通过学习参数 γ_i 和 β_i
    进行变换，分别如公式 (2.8) 和 (2.9) 所定义，可重写为：


    $$\tilde{\mathbf{h}}_i^{BN} = \gamma_i \frac{(\mathbf{W}_i \mathbf{h}_{i-1} +
    \mathbf{b}_i) - \mu_B \mathbf{e}}{\sqrt{\sigma_B^2 + \epsilon}} + \beta_i \mathbf{e}$$
    (7.1)


    由于 μ、σ²、γ_i 和 β_i 在推理期间为常数，因此可以将它们合并到前一个卷积层的权重和偏置中，如 [Fu17] 所提出的。注意，μ 和 σ² 是训练期间每批计算出的均值与方差的平均值。新的卷积层随后可写为公式
    (7.4)，其中 Ŵ_i 和 b̂_i 分别是层 i 经过重新缩放的权重和偏置，在公式 (7.2) 和 (7.3) 中给出。


    $$\hat{\mathbf{W}}_i = \gamma_i\left(\frac{\mathbf{W}_i}{\sqrt{\sigma^2 + \epsilon}}\right)$$
    (7.2)


    $$\hat{\mathbf{b}}_i = \gamma_i\left(\frac{\mathbf{b}_i - \mu \mathbf{e}}{\sqrt{\sigma^2
    + \epsilon}}\right) + \beta_i \mathbf{e}$$ (7.3)


    $$\tilde{\mathbf{h}}_i^{BN} = \hat{\mathbf{W}}_i \mathbf{h}_{i-1} + \hat{\mathbf{b}}_i$$
    (7.4)


    将批归一化的相关变量合并到前一个卷积层的权重和偏置中，可提升推理时间，因为消除了批归一化层的额外计算开销。


    ### 计算高效的分类头


    如第 7.1.1 节所述，在每个特征图位置应用 (c + 4)k 个尺寸为 3 × 3 的卷积滤波器，以预测 c 个置信度分数和相对于锚框的四个边界框偏移。在本论文背景下，类别数
    c 设为 2，即背景和车辆类别，锚框数设为 5，共产生 30 个卷积滤波器。受 [San18, Wan18b] 中提出的修改启发，可以通过用更轻量级的构建块替换昂贵的
    3 × 3 卷积来减少参数数量和计算成本。在下文中，考虑了三种不同的构建块作为分类头，即深度可分离卷积（DSCs）、1 × 1 卷积和 1 × 1 分组卷积。


    ## 7.1.4 实验与讨论


    在 DLR 3K 数据集上评估了所采用基础网络对检测性能的影响。表 7.7 给出了以 AP 表示的检测精度，以及在第 5.2.4 节介绍的服务器和桌面平台上测试的推理时间。报告的推理速度以每秒帧数（FPS）为单位，是在
    936 × 936 像素的图像上进行 500 次前向传播的平均值。对于 Faster R-CNN 的时间测量，所有时间测量均不包括预处理步骤，并执行 10
    次前向传播以预热 GPU 内核。请注意，基准测试不包括 NMS 阶段，以便更好地判断架构更改的影响。


    使用 VGG16 作为基础网络时，模型取得了最佳 AP，与 Faster R-CNN（参见第 5.2 节）大致相当。然而，推理时间，尤其是在桌面平台上，对于经常需要处理更大图像（例如全高清）的实际应用来说可能并不令人满意。用计算高效的
    CNN 架构替换 VGG16 可以大幅提高推理速度。对于使用批归一化层训练的 MobileNet、ShuffleNet 和 PeleeNet，分别报告了包含和不包含这些层的推理时间。使用第
    7.1.3 节所述的合并过程可显著改善推理时间，而带有批归一化层的推理时间相比 VGG16 仅略有改善。请注意，合并过程不会影响检测精度，因为它只是一个恒等变换。因此，所有后续结果均在合并批归一化层的情况下报告。


