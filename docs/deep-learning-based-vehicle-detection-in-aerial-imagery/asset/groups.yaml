    ## 轻量级特征提取与搜索区域缩减


    使用轻量级架构作为基础网络以及限制搜索区域可提高推理速度。为进一步加快推理时间，SAR 模块被插入到 Faster R-CNN 中，且默认基础网络被 ZynqNetα=1.00
    替换。为此，将第 5 个 Fire 模块的输出作为 RPN 和分类阶段的特征图。辅助 Fire 模块，即第 6 至第 9 个 Fire 模块，随后接最大池化、全连接层序列和
