  - '[PAGE 23]


    Besides the aforementioned challenges due to image quality as well as object and
    scene variation, real-world applications impose further requirements on the detection
    algorithms. These practical requirements comprise:


    +   - **Generality and transferability** of the detection algorithms are required
    to ensure high robustness against variations in the data. Common detection algorithms
    make usage of machine learning approaches that learn the appearance of vehicles
    and non-vehicles from given samples. As these given samples are typically restricted,
    the learned model should be able to localize and classify vehicles in new, previously
    unseen data.

    +   - **Real-time requirements** have to be met to assure online processing as
    required for many applications. As opposed to offline processing, the processing
    of one image has to be completed before the next image is captured. For instance,
    if the frame rate is 25 Hz, about 40 ms are available to extract and process the
    current image information. Note that meeting real-time requirements is generally
    more challenging with larger image sizes due to the increased computational effort.

    +   - **Hardware constraints** due to the limited payload of airborne platforms
    affect the computing power and consequently the processing time. Embedded systems
    such as NVIDIA Jetson platforms¹ that comprise a powerful GPU in addition to a
    potent processor allow low-power, onboard computing for deep learning and computer
    vision applications. However, the GPU memory that is often shared with the RAM
    and the number of parallel processing units are clearly less compared to server
    setups that may comprise multiple GPUs and thus, restrict the size and complexity
    of deep learning models.'
