    上下文增强模块的主要目的是创建适用于微小目标定位的高分辨率特征图，该特征图包含来自深层的丰富语义特征。如第 5.2.1 节所示，使用 conv3_3 的输出作为特征图与
    conv4_3 和 conv5_3 相比能获得更好的检测性能，尽管相应的特征具有较少的语义和上下文信息。其关键在于 conv4_3 和 conv5_3 的特征图分辨率较粗，即分别为输入图像尺寸的
    1/8 和 1/16，这阻碍了对微小目标的精确定位。由于较深的层通常包含比较浅的层更丰富的语义和上下文内容 [Zho15, Luo16]，所提出的 CEM
    对深层的低维特征图，即 conv4_3 和 conv5_3 进行上采样，然后将其与 conv3_3 的特征相结合。为此，引入了如图 6.2 所示的反卷积子模块。为了融合不同尺寸的特征图，使用核大小为
    4 × 4 的反卷积层将低维特征图上采样 2 倍。不是采用 [Lin17a] 中提出的最近邻上采样，反卷积层的应用促进了非线性上采样的学习，在初步实验中经验上显示出更优的结果。然后将上采样后的特征与较浅层的特征通过拼接进行融合，这等价于
    [Lin17a] 中提出的侧向连接，以确保上采样特征的更精确位置。为了有效融合拼接后的特征图信息，在拼接后应用 1 × 1 卷积层。请注意，每个特征图的通道数进一步调整为
    256，这是所用特征图中的最小通道数，以允许组合特征图具有相似的影响程度。为此，在 conv4_3 和 conv5_3 的输出上应用 1 × 1 卷积。


    如图 6.1 所示，反卷积子模块被迭代应用。首先，反卷积子模块对 conv5_3 的特征进行上采样，并将上采样后的特征与 conv4_3 的特征相结合。然后，将组合后的特征上采样并与
