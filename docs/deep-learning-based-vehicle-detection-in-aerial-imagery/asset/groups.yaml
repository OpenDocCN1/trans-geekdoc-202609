    ## Impact of Filter Pruning


    To further accelerate the inference time, the number of parameters are reduced
    by performing the filter pruning strategy described in Section 7.1.3. For this,
    two different pruning thresholds are considered, removing either 25% or 50% of
    the filters with the lowest ℓ1-norm. In case of PeleeNet, convolutional layers.
    Removing filters is achieved for MobileNet, as in contrast to PeleeNet and ZynqNet
    the number of channels is reduced for all convolutional layers. Removing filters
    in case of PeleeNet only slightly improves the inference time, while the detection
    accuracy remains almost constant. The small gain in inference time is due to the
    limited number of layers that are pruned. Note that typically the computational
    effort for these layers is already reduced by a preceding 1 × 1 convolutional
    layer minimizing the amount of input channels. The almost constant detection accuracy
    indicates that even computation-efficient CNN architectures are over-parameterized
    for the task of vehicle detection in aerial imagery and can be further condensed.
    This is confirmed by the only slightly decreasing AP for MobileNet_ξ=0.75 and
    ZynqNet_α=0.75.


    ## Impact of Computation-Efficient Classification Heads


    The effect of replacing the standard classification head comprised of 3 × 3 convolutions
    with more lightweight building blocks is evaluated in Table 7.9. For this purpose,
    PeleeNet and ZynqNet are used as base networks, exhibiting so far the best AP
    and best inference time, respectively. The number of groups is set to 2 for the
    experiments involving group convolutions, so that the number of input and output
    channels are evenly divided. Two variants employing DSCs are evaluated, as the
    convolutional filters for the classification and regression are natively split
    into two separate branches, i.e., one for classification and one for regression.
    The first variant pursues the native procedure and employs separate DSCs for each
    branch. The second variant referred to as shared DSC shares the first 3 × 3 depthwise
    convolutions for both branches, while the subsequent pointwise convolutions are
    divided for each branch.


    The results indicate that every building block could replace the standard 3 ×
    3 convolutions as classification head without loss of accuracy, which is in accordance
    with observations on detection benchmark datasets [San18, Wan18b]. In terms of
    inference time, exploiting 1 × 1 convolutions or 1 × 1 group convolutions leads
    to a slightly increased number of FPS, while models involving depthwise separable
    convolutions experience a slightly decreased number of FPS. A reason for this
    small drop in inference speed is the additional memory leads to considerably reduced
    numbers of parameters, in particular, due to the application of the lightweight
