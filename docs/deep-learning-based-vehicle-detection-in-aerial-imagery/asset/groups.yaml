  mdcn: "\n除了上述因图像质量以及物体和场景变化带来的挑战外，实际应用还对检测算法提出了进一步的要求。这些实际要求包括：\n\n- **通用性和可迁移性**：检测算法需要具备较高的鲁棒性以应对数据的变化。常见的检测算法利用机器学习方法从给定样本中学习车辆和非车辆的外观。由于这些给定样本通常有限，学习到的模型应能够在新颖的、未见过的数据中定位和分类车辆。\n\
    \n- **实时性要求**：必须满足实时性要求以确保许多应用所需的在线处理。与离线处理不同，一张图像的处理必须在下一张图像被采集之前完成。例如，如果帧率为\
    \ 25 Hz，则大约有 40 ms 的时间来提取和处理当前图像信息。请注意，由于计算量的增加，满足实时性要求通常随着图像尺寸的增大而更具挑战性。\n\n\
    - **硬件限制**：由于机载平台的载荷有限，硬件限制会影响计算能力，进而影响处理时间。诸如 NVIDIA Jetson 平台¹ 之类的嵌入式系统除了强大的处理器外还包含高性能\
    \ GPU，能够为深度学习和计算机视觉应用提供低功耗的机载计算。然而，与可能包含多个 GPU 的服务器设置相比，GPU 内存（通常与 RAM 共享）和并行处理单元的数量明显较少，因此限制了深度学习模型的大小和复杂度。\n\
    \n![](img/99de1214c29cbc525a14b293385af5cf_24_0.png)\n\n图 1.2：航空影像中典型挑战的示意图。第一行：图像噪声¹、运动模糊²和光照²。第二行：低分辨率³、高类内方差⁴和低类间方差⁴。第三行：复杂背景³、部分遮挡⁴和阴影⁴。\n\
    \n¹ 图像取自 [Xia18]  \n² 图像来自 Fraunhofer IOSB  \n³ 图像取自 [Raz16]\n\n### 1.3 贡献\n\n\
    本论文的目标是设计一种基于深度学习的检测流程，用于低空间分辨率航空影像中的车辆检测，从而能够覆盖大面积区域。本论文所展示的工作对基于深度学习的车辆检测领域做出了以下贡献：\n\
    \n- 首次针对基于深度学习的检测框架在航空影像车辆检测任务中的应用进行了详尽的分析。通过流行的 Faster R-CNN 检测器 [Ren15]，系统性地研究了应对航空影像特征的相关改编，该检测器在检测精度和推理时间之间取得了良好的平衡。此外，还识别了实际应用中产生的问题，即由具有类似车辆结构的物体引起的误报以及耗时的检测组件\
    \ [Som17c, Som17b, Som18b]。\n\n- 引入了两种通过增强检测框架上下文信息来提高检测精度的新方法。第一种方法旨在通过结合浅层和深层特征来增加空间上下文信息，以兼顾精细和粗粒度结构\
    \ [Som18c]；第二种方法利用语义标注——即图像的逐像素分类——来引入更多语义上下文信息。实现了两种将语义标注集成到检测框架中的不同变体：利用语义标注结果过滤掉不可靠的预测\
    \ [Som17a]，以及通过共享特征表示将语义标注网络显式合并到检测框架中来引入场景知识 [Nie18]。所提出的方法在公开的航空影像基准数据集上提高了检测精度，因为误报数量显著减少。\n\
    \n- 通过对 DLR 3K 数据集进行逐像素标注，生成了一个新颖的航空影像语义标注数据集，从而能够在航空影像车辆检测的背景下更好地集成和评估语义标注。与德国航空航天中心（DLR）合作，该数据集的精炼增强版本已公开提供给研究人员\
    \ [Azi19]。请注意，DLR 除其他外还提供了诸如车道标线等更细粒度的标注。\n\n- 由于实时或近实时车辆检测通常是实际应用的前提，因此提出了两种降低计算量从而缩短推理时间的策略。第一种策略是将用于特征提取的默认\
    \ CNN 架构替换为针对航空影像车辆检测优化的轻量级 CNN 架构 [Rin19]。利用车辆通常只覆盖航空影像一小部分这一情况，第二种策略包含一个新模块，用于在检测模块之前限制搜索区域\
