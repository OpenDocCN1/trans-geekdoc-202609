    used as evaluation metrics following the 2D Semantic Labeling Contest protocol¹.
    Both metrics are derived from a pixel-based confusion matrix. To this end, the
    confusion matrices for each tile are accumulated. F1-score is the harmonic mean
    of precision and recall defined as


    $F1\text{-score} = 2 \frac{P \cdot R}{P + R}$

    (4.8)


    To compute precision and recall (see eq. (4.2) and eq. (4.3)) per class, the number
    of TP pixels is derived from the main diagonal elements of the confusion matrix,
    while the number of FP pixels is the sum per column and the number of FN pixels
    is the sum per row, excluding the main diagonal element. The overall accuracy
    is computed by normalizing the trace of the confusion matrix. Note that a three-pixel
    boundary between GT regions with different labels is ignored during evaluation
    to reduce the impact of uncertain border definitions due to the annotation procedure.


    # Inference Time


    Besides the detection accuracy, the inference time is another key factor to judge
    the detection performance. In the context of this thesis, two different devices
    representing a server and a desktop setup are used in order to measure the inference
    time. The desktop setup is chosen to account that many real-world applications
    have to do without powerful server setups. The key characteristics of each device
    are given in Table 4.2. All inference time measurements are conducted through
    the pycaffe Python interface for Caffe. If not stated otherwise, the inference
    time is reported in milliseconds (ms) averaged over the complete test set of the
    respective dataset. Note that all time measurements exclude preprocessing steps,
    e.g., loading the image, as these steps can be done asynchronously, while waiting
    for the GPU to finish the current forward pass. In advance of each timing, 10
    forward passes are performed to warm-up the GPU kernels.


    ¹ http://www2.isprs.org/commissions/comm3/wg4/semantic-labeling.html'
