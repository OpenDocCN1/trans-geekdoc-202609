    2.4 所示。特征图的大小受步长和填充的影响。步长参数指定了应用卷积核的两个空间位置之间的距离，而零填充可用于在输入边缘应用卷积核。


    ![](img/99de1214c29cbc525a14b293385af5cf_32_0.png)


    **图 2.4：** 使用 $C$ 个滤波器进行卷积的示意图，每个滤波器由 $D$ 个大小为 $3 \times 3$ 的卷积核组成。对于每个滤波器，每个卷积核在相应的输入通道上滑动，所得输出通过逐元素相加汇总，为每个滤波器生成一个输出通道。


    为了逼近复杂的决策函数，对卷积层的输出逐元素应用激活函数，从而将非线性引入 CNN。在实践中，相对于 sigmoid 和双曲正切等 sigmoid 型函数，ReLU
    通常更受青睐作为激活函数 [LeC15]，它在计算复杂度和梯度计算方面具有优势，同时在多个领域的多个任务上取得了更优的结果 [Kri12, Maa13, Glo11]。ReLU
    函数定义如下：


    φ(x) = max(0,x). (2.3)


    它通过将特征图中的负值设置为零来去除这些负值，如图 2.5 所示。


    ![](img/99de1214c29cbc525a14b293385af5cf_33_0.png)


    图 2.5：ReLU 功能及其传递函数示意图。


    池化层周期性地插入在卷积层之后，以减小特征图的空间尺寸，从而减少参数数量。这提高了计算效率，同时增加了对输入小位移的不变性 [Sch10]。池化操作由滤波器大小、步长和池化函数定义。池化操作在每个输入通道上独立执行。常见的池化操作是最大池化，滤波器大小为
    2 × 2 或 3 × 3，步长为 2。最大池化返回由滤波器大小定义的感受野内的最大值，如图 2.6 所示。较少使用的池化函数是平均池化和 ℓ₂ 范数池化，因为最大池化在实践中已被证明效果更好
    [Sch10]。注意，使用大于 1 的步长进行卷积是减小特征表示空间尺寸的另一种策略 [Spr14]。


    ![](img/99de1214c29cbc525a14b293385af5cf_34_0.png)


    图 2.6：滤波器大小为 2 × 2、步长为 2 的最大池化操作示意图。


    与 MLP 中一样，将每个神经元连接到前一层所有神经元的全连接层通常用作 CNN 的最后几层。全连接层的目标是学习由最后一个卷积层输出给出的高层特征的非线性组合。最后一个全连接层的输出用于分类、回归等，具体取决于特定的计算机视觉任务。


    ### 2.1.3 CNN 训练


    CNN 的训练通常以监督方式进行，通过反向传播并借助一个称为损失函数 L 的目标函数。为特定任务设计的损失函数将网络的预测值与真值（GT）进行比较，并计算误差度量。在目标检测的背景下，经常使用两种损失函数，即分类损失和回归损失，如
    5.1 节中更详细描述的那样。分类损失函数的常用选择是 softmax 损失 [Dud12]，而 smooth L1 损失被广泛用作回归损失函数 [Gir15]。一种常见的优化方法是随机梯度下降（SGD），其中针对训练数据的一个小的随机子集（称为批次
    B）计算梯度，然后通过网络的所有层反向传播 [Mon12]。在每次迭代 t 中，使用梯度按如下方式更新网络当前权重：


    W^{t+1} = W^{t} + ΔW^{t} (2.4)


