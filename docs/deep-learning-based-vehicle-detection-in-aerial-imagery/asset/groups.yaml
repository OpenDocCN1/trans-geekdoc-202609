    ## Lightweight Feature Extraction and Search Area Reduction


    The usage of lightweight architectures as base network as well as the restriction
    of the search area exhibit an improved inference time. To further speed up the
    inference time, the SAR module is inserted into Faster R-CNN and the default base
    network is replaced by ZynqNetα=1.00. To this end, the output from the 5th Fire
    module is considered as feature map for the RPN and classification stage. The
    auxiliary Fire modules, i.e., the 6th through the 9th Fire module, followed by
    max pooling, a sequence of fully connected layers and a softmax layer are employed
    as SAR classifier. For this, the sequence of fully connected layers is adopted
    according to Section 7.2.1. VGG0.5-Head is employed as classification head, which
    exhibits the best trade-off between inference time and AP. The model is trained
    in two stages as described in Section 7.2.2. The detection part is first trained
    with the settings specified in Section 7.1.5, while the SAR classifier is trained
    as described in Section 7.2.2. The further components of the SAR module and the
    modified proposal layer are inserted for deployment as shown in Figure 7.7. Furthermore,
    the settings for deployment proposed in Section 7.2.2 are applied.


    Table 8.8 shows the overall inference time and the time spent for each component
    of Faster R-CNN with SAR and lightweight feature extraction. Inserting the SAR
    module into Faster R-CNN with ZynqNet as base network achieves overall the best
    inference time. The usage of the lightweight base network results in clearly reduced
    time spent for feature extraction. Furthermore, the time spent for classification
    decreases due to the more lightweight classification head. Inserting the SAR module
    into Faster R-CNN with ZynqNet as base network results in clearly less time spent
    for generating region proposals and classification compared to its counterpart
    without SAR, while the detection accuracy only worsens by 0.1% in AP. In comparison
    to the baseline Faster R-CNN, the overall inference time is speeded up by 53%
    and 75% on the server and the desktop setup, respectively, as the times spent
    for each component are clearly reduced, whereas the detection accuracy only drops
    by 0.2% in AP. Note that all timings are repeated for the models pre-trained on
    augmented data and thus, the reported inference times may vary slightly compared
    to their counterparts without augmented data given in previous chapters. The most
    time-consuming component of Faster R-CNN with SAR and lightweight feature extraction
    is the RPN. A reason for this is the proposal layer implemented in Python that
    computes the final coordinates and sorts all proposals by the predicted confidence
    score on the CPU.


    ## 8.2 Comparison to Related Work


    The combined EMT-MFD Faster R-CNN with SAR is in the following compared to representative
    existing work in the field of object detection in aerial imagery. As most of these
    approaches adopt deep learning based detection frameworks for the task of vehicle
    detection in aerial imagery, recently proposed deep learning based detection frameworks
    are further considered for the comparison. The detection performance for EMT-MFD
    Faster R-CNN with SAR and the detection methods from literature are given in Table
    8.10. The considered vehicle detection methods either adapt the size of the employed
    feature map [Car17, Aca18, Din18], exploit multiple feature maps [Guo18, Tay18],
    combine features from different layers [Den17, Din18, Yan18] or make use of a
    top-down architecture [Aca18, Guo18, Tay18] to account for the characteristics
    of aerial imagery. Note that the detection methods proposed for vehicle detection
    in aerial imagery are adopted unmodified. All the additionally used deep learning
    based detection frameworks have a top-down architecture and exploit multiple feature
    maps except for Faster R-CNN with OHEM. For each detection framework, the shallowest
    feature map has been selected in such a way that its dimensions are 1/4 of the
    input image in order to account for small-sized vehicles. Furthermore, the anchor
    box scales are adopted according to Table 5.6. To ensure a fair comparison, each
    model is trained on the identical training data with the same data augmentation
    settings.


    Amongst the vehicle detection methods, the best AP on DLR 3K is achieved for DYOLO
    and Adapted RetinaNet, which both comprise a top-down architecture similar to
    MFD Faster R-CNN in order to obtain feature maps enriched with more context information.
    Shallow YOLOv2, AVPN Faster R-CNN and DFL-CNN exhibit considerably worse AP compared
    to the other vehicle detection methods. Though both Shallow YOLOv2 and DFL-CNN
    specifically adapt the resolution of the employed feature map, the resulting resolution,
    i.e., 1/16 of the input image, which is the same for AVPN Faster R-CNN, is not
    sufficient to accurately detect small-sized vehicles as in case of DLR 3K. Overall,
    none of the examined vehicle detection methods accomplishes an AP that is on par
    with the AP achieved for EMT-MFD Faster R-CNN with SAR.


    One reason for this is the coarser feature map resolutions applied throughout
    the different methods, i.e., 1/8 or 1/16 of the input image, which may result
    in poorly located as well as duplicate detections (see Section 5.2.1). However,
    it is to mention that some of these approaches are designed for object detection
    in aerial imagery that comprise larger object instances such as NWPU.


