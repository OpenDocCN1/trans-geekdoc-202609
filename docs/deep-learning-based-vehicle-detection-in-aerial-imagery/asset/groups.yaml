    ## 4 实验设置


    本章介绍了为评估本论文所提出的检测方法而设计的实验设置。第4.1节概述了所使用的航空图像检测数据集及其主要统计信息。第4.2节介绍了评估协议和相应的指标。


    ### 4.1 数据集


    表4.1给出了航空图像数据集中的车辆检测及其关键特征的概述。请注意，只列出了公开可用的数据集。实例数量仅限于车辆，因为其他类别（如建筑物、桥梁、港口等）不在本论文的范围内。选择DLR
    3K慕尼黑车辆航空图像数据集[Liu15]作为基线数据集来检验所提出的检测流程及其组件。其标注车辆数量明显超过以前的数据集，这有利于基于学习的检测算法，正如本论文所探讨的。包含更多车辆的“带背景的车辆俯视图”（COWC）数据集[Mun16]被搁置，因为其标注仅以中心坐标的形式提供。为了证明所提出的检测流程的泛化能力，还在车辆检测航空图像（VEDAI）[Raz16]数据集（这是航空图像中车辆检测的常见基准数据集）以及最近发布的数据集，即DOTA
    [Xia18]、ITCVD [Yan18]和xView [Lam18]上进行了进一步实验。因此，考虑了不同的地面采样距离（GSD）、目标尺寸、目标类型、背景以及每帧目标数量的变化。请注意，对后几个数据集的实验以定性方式进行，以检验所提出的检测流程的可转移性。由于数据集可用时间较晚以及部分标注质量较差，没有进行定量实验。ISPRS
    2D语义标注挑战波茨坦数据集[ISP]——一个用于航空图像语义标注的常见基准数据集——被选为主数据集，用于评估集成语义标注对检测性能的影响。


    表4.1：按发布年份列出的航空图像数据集中的车辆检测。“中心”指仅提供实例中心坐标的标注，而“BB”是边界框的缩写，可以是轴对齐或旋转的。实例数量仅限于车辆，因为其他类别（如建筑物、桥梁、港口等）不在本论文的范围内。


    | 数据集 | 标注 | 图像数量 | 图像宽度（像素） | 实例数量 | GSD（厘米） |

    |---|---|---|---|---|---|

    | TAS [Hei08] | 轴对齐边界框 | 30 | 792 | 1,319 | - |

    | NWPU [Che14b] | 轴对齐边界框 | 800 | ~1,000 | 477 | 8-200 |

    | UCAS-AOD [Zhu15] | 旋转边界框 | 910 | ~1,000 | 2,819 | - |

    | DLR 3K [Liu15] | 旋转边界框 | 20 | 5,616 | 14,235 | ~13 |

    | VEDAI [Raz16] | 旋转边界框 | 1,268 | 1,024 | 2,950 | 12.5 |

    | COWC [Mun16] | 中心 | 53 | 2k-19k | 32,716 | 15 |

    | DOTA [Xia18] | 旋转边界框 | 2,806 | 800-13k | ~180k | 10-100 |

