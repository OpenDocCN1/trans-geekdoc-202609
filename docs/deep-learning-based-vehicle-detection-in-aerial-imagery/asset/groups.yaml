    ## 6.2.3 Joint Semantic Labeling and Detection


    ### Implicit Multi-Task Faster R-CNN


    The first variant, which is in the following referred to as Implicit Multi-Task
    (IMT) Faster R-CNN, is depicted in Figure 6.13. The proposed architecture comprises
    two branches: one for detection (top branch) and one for semantic labeling (bottom
    branch). The detection branch includes the RPN and the classification stage, while
    FCN-D16 is exemplarily employed for the semantic labeling branch. Note that the
    semantic labeling network can be replaced by the alternative architectures described
    in Section 6.2.1. Both branches are merged by sharing the first four sequences
    of convolutional layers. The prerequisite for this is that both branches are based
    on the same base architecture, i.e., VGG16. This allows the network to learn a
    shared global feature map, i.e., conv4_3, through which the semantic labeling
    branch implicitly affects the detection branch. As the semantic labeling branch
    is only required for training, it can be discarded during deployment.


    To allow end-to-end training of both tasks, a joint multi-task loss $L_{MT}$ comprised
    of five losses is proposed:


    $$L_{MT} = \lambda_1L_{SL} + \lambda_2L_{RPN,cls} + \lambda_3L_{RPN,reg} + \lambda_4L_{CLS,cls}
    + \lambda_5L_{CLS,reg}. \tag{6.2}$$


    For this purpose, the output of *conv4_3* of the semantic labeling branch is employed
    as auxiliary feature map for the classification stage. The set of generated region
    proposals is projected onto the auxiliary feature map as well and an additional
    RoI pooling layer extracts the corresponding features. The output of the additional
    RoI pooling layer has the same dimensions, i.e., 7 × 7, and number of channels,
    i.e., 512, as the output of the RoI pooling layer of the detection branch. The
    outputs of both RoI pooling layers are fused via element-wise addition. The fused
    features are then fed into the sequence of fully connected layers of the classification
    stage. Outputs of deeper convolutional layers of the semantic labeling branch
    are not considered as feature map because the number of output channels exceeds
    512 as required for the element-wise addition. The EMT Faster R-CNN is trained
    analogously to the IMT Faster R-CNN using the joint multi-task loss given in eq.
    (6.2). Thus, semantic context information is induced twofold: implicitly by shared
    convolutional layers and joint learning and explicitly by exploiting features
    of the semantic labeling branch for the classification stage.


    ### Ablation Experiments


    In the following, the impact of both variants to induce scene knowledge into the
    detection framework are evaluated. For this, each model is trained end-to-end
    for 70,000 iterations with an initial learning rate of 0.001. VGG16 pre-trained
    on ImageNet is used to initialize the weights of the shared convolutions as well
    as the weights of both branches. Note that data augmentation, which results in
    better semantic labeling results [She16], is performed through applying vertical
    and horizontal flipping as well as rotation in steps of 90 degrees. To account
    for the characteristics of the Potsdam dataset, the settings introduced in Section
    6.2.2 are adopted, i.e., exploitation of *conv4_3* as feature map, setting the
    anchor base to 4 and the anchor scales to 8, 16, and 24, and forwarding of the
    top-100 ranked region proposals after NMS to the classification stage.


