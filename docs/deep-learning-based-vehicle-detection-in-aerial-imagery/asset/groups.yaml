  mdcn: '


    在航空影像中，基于深度学习的检测框架（如 Faster R-CNN）通常是针对基准数据集开发和设计的，而这些数据集与航空影像明显不同，如图 3.2 和图 3.3
    所示。常见的基准数据集，例如 PASCAL VOC [Eve10] 和 MS COCO [Lin14]，通常每幅图像包含一个或少数几个物体，这些物体往往居中并占据图像的大部分区域。因此，即使是相对较小的物体也表现出较高的细节水平，例如对于汽车类别，包括车轮、车牌和车灯。相比之下，像
    DLR 3K [Liu15] 和 VEDAI [Raz16] 这样的航空影像数据集，通常由安装在高空飞行平台上的传感器获取，一般具有较低的空间分辨率，导致物体尺寸较小，即只有几个像素的范围。因此，场景中随机分布且朝向任意的物体往往缺乏细节，这极大地阻碍了检测任务。此外，航空影像中物体的数量差异很大，从农村地区仅有的几个物体到交通流量大或停车场密集的城市地区的数百个物体不等。由于这些差异，特别是物体尺寸方面的差异，基于深度学习的检测框架不能直接应用于航空影像中的车辆检测。为了应对这些具体特征，本论文系统性地研究了针对小物体尺寸的若干适应性改进
    [Som17c, Som18b]。特别是，提高特征图分辨率显著改善了检测性能，因为初始分辨率不足以在航空影像中精确定位小型车辆实例。所提出的适应性改进对多个物体类别和其他检测框架的可迁移性分别在
    [Som17b, Som18d] 中得到证明。尽管默认的 Faster R-CNN 和传统检测方法被明显超越，但这些适应性改进在推理时间以及所采用特征的语义和空间内容方面存在缺陷，这些问题将在下文中解决。


    ## 3 概念


    ![](img/99de1214c29cbc525a14b293385af5cf_61_0.png)


    **图 3.2：** 来自基准目标检测数据集（即 PASCAL VOC（左）[Eve10] 和 MS COCO（右）[Lin14]）的示例图像，通常包含一个或少数几个物体，这些物体往往居中并占据图像的大部分区域。即使是较小的物体也呈现出高水平的细节，例如车轮、车牌和车灯。


    ![](img/99de1214c29cbc525a14b293385af5cf_61_1.png)


    **图 3.3：** 来自航空影像数据集（即 DLR 3K（左）[Liu15] 和 VEDAI（左）[Raz16]）的示例图像，可能包含多个随机分布的物体，其大小只有几个像素。


    ### 上下文知识的整合


    为了准确定位小物体而提高特征图分辨率，可以通过利用较浅的层作为特征图来实现。然而，与深层特征相比，浅层特征缺乏语义和空间内容，导致由具有车辆形状的物体（如建筑物上的窗户或太阳能电池板）引起的误报（见图
    3.4）。为了克服语义和空间内容的缺乏，检测流程通过两个新颖的组件进行了扩展。


    ![](img/99de1214c29cbc525a14b293385af5cf_62_0.png)


    图 3.4：DLR 3K 数据集上的定性检测结果，突出了所执行适应性改进的效果。由于利用浅层作为特征图而导致的误报，主要由具有车辆形状的物体（如建筑物上的太阳能电池或窗户）引起。


    将空间上下文信息纳入基于深度学习的检测器，已在航空影像中取得了改进的检测结果。虽然已有研究提出利用填充的 GT 框来自动学习航空影像中车辆的上下文 [Sak17]，但最近也通过膨胀卷积增大感受野来添加更多上下文信息，并将其应用于航空影像中的目标检测，例如建筑物检测
    [Ham18] 和车辆检测 [Din18]。受语义标注网络的启发，该网络结合浅层和深层特征来处理精细和粗略结构，例如 FCN [Lon15]，本论文采用了一种替代方法
    [Som18c]。因此，Faster R-CNN 扩展了一个名为上下文增强模块的新组件（见图 3.1）。为了整合深层语义和上下文信息，同时保持高特征图分辨率，深层特征通过反卷积进行上采样并与浅层特征结合，这与
    [Lin17a, Woo18] 中的概念类似。将所提出的反卷积模块应用于其他检测框架，证实了从深层添加上下文信息对车辆检测的益处 [Aca18]。


    为了处理由不太可能包含车辆的图像区域（如建筑物）引起的误报，传统检测流程中经常应用语义上下文信息。为此，一种常见做法是将检测限制在道路区域，假设车辆不会出现在道路之外
    [Tue13, Mor14a]。然而，道路数据库的准确性往往有限，这会导致停放在建筑物附近的车辆被漏检 [Tue13]。为了解决这个问题，开发了一种用语义标注掩码替代道路数据库的新方法
    [Som17a]。由于所提出的语义标注网络能够准确预测道路、车道和停车场，因此只有主要位于建筑物或低矮植被上的检测会被过滤掉。为了避免额外语义标注网络带来的大量计算开销，本论文引入了一种将语义标注整合到检测框架中的替代方法
    [Nie18]。该方法不是过滤掉道路之外的检测，而是利用语义标注将场景知识引入检测框架中使用的特征图（见图 3.1）。为此，语义标注网络和检测网络通过共享一系列卷积层进行融合，这对最终的检测结果产生了隐含的影响。将语义标注分支的深层特征显式添加到检测分支，进一步提高了检测精度
    [Nie18]。与流行的 Mask R-CNN [He17] 对每个区域提议应用语义标注网络不同，所提出的方法不局限于区域提议内的场景上下文，这在航空影像中的车辆检测情况下是有益的。所提出的原理与
    StuffNet [Bra17] 最为相似，后者利用物体的局部周围环境来识别它，在 PASCAL VOC 上取得了更高的检测精度。此外，在本论文的工作中创建了一个新颖的语义标注数据集¹，以评估语义标注对航空影像中车辆检测的影响
    [Azi19]。


    ### 运行时优化


    尽管为适应航空影像特征而进行的适应性改进显著提高了检测精度，但由此产生的较差的推理时间阻碍了其在需要实时或近实时车辆检测的实际应用中的使用。为了加速检测流程，本论文采用了两种不同的策略。


    由于特征提取是现代基于深度学习的检测框架（如 Faster R-CNN）中最耗时的部分之一，用计算效率更高的网络替换默认的 CNN 架构是减少推理时间的常见做法。采用最近为资源受限的移动平台开发的架构作为特征提取器，可以在检测精度不大幅下降的情况下显著减少推理时间
    [Wan18b, Zha18b]。其共同原则是通过尽量减少使用昂贵的 3 × 3 卷积滤波器来减少参数数量和计算操作。虽然这些轻量级架构通常是为分类任务设计的，但不加谨慎地将这一原则应用于航空影像中的车辆检测可能会降低检测精度，因为特征提取仅限于浅层。在本论文中，以
    SSD [Rin19] 为例检验了不同轻量级架构的适用性，SSD 允许直接更换 CNN 架构。结合其他运行时优化技术，推理时间显著减少，而检测精度几乎没有或很少损失。


    ¹ 与 DLR 合作公开提供了该数据集的精炼增强版本，DLR 提供更细粒度的标注：https://www.dlr.de/eoc/en/desktopdefault.aspx/tabid-12760


    '
