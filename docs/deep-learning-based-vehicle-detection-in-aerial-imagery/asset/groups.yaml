    ## 基于深度学习的航空图像车辆检测


    KIT 科学出版


    Lars Wilko Sommer


    ## 基于深度学习的航空图像车辆检测


    卡尔斯鲁厄理工学院

    人类工学与机器人研究所


    ## 基于深度学习的航空图像车辆检测


    由卡尔斯鲁厄理工学院(KIT)计算机科学学院批准的工学博士学位论文


    作者 Lars Wilko Sommer, M.Sc.


    口试日期：2020年6月3日

    第一评阅人：Prof. Dr.-Ing. Jürgen Beyerer

    第二评阅人：Prof. Dr.-Ing. Stefan Hinz


    ## 摘要


    空中平台例如配备相机传感器的无人机在民用安全和保障领域的大量应用中至关重要。其中，突出的应用包括监视和侦察、交通监控、搜索救援、灾难救援和环境监测。然而，仅由人工操作员分析航空图像数据通常不可行，因为视觉数据量大导致认知过载。在实践中，基于适当计算机视觉算法的自动化处理链被用于协助人工操作员评估航空图像数据。此类处理链的关键组成部分是在场景被分析和解释之前，对摄像机视场内所有相关对象的准确检测。源于相机与地面之间大距离的低空间分辨率使得航空图像中的目标检测成为一项具有挑战性的任务，且进一步受到运动模糊、遮挡或阴影的阻碍。尽管文献中存在许多针对航空图像中目标检测的传统方法，但所使用手工制作特征的有限表征能力往往由于对象尺度、方向、颜色和形状的高方差而阻碍了可靠的检测精度。


    在本论文范围内，开发了一种新颖的基于深度学习的检测方法，其重点在于对俯视拍摄的航空图像中的车辆检测。为此，选择 Faster R-CNN 作为基础检测框架，因为其检测精度优于其他基于深度学习的检测器。对航空图像特定特征的系统性适应，尤其是小对象尺寸，已被系统地检查，并识别出与实际应用相关的由此产生的问题，即由类似车辆的结构引起的大量误检以及较差的推理时间。提出了两个新组件以通过增强所用特征表征的上下文内容来提高检测精度。第一个组件旨在通过结合浅层和深层特征来增加空间上下文信息，以兼顾精细和粗糙结构，而第二个组件利用语义标注——图像的逐像素分类——来引入更多语义上下文信息。实现了两种不同的将语义标注集成到检测框架中的变体：利用语义标注结果来过滤不太可能的预测，以及通过共享特征表征显式地将语义标注网络合并到检测框架中以引入场景知识。两个组件均明显减少了误检数量，从而显著提高了检测精度。为了减少计算量并因此缩短推理时间，本论文中开发了两种替代策略。第一种策略是用针对航空图像中车辆检测优化的轻量级
    CNN 架构替换用于特征提取的默认 CNN 架构，而第二种策略则包括一个用于将搜索区域限制为感兴趣区域的新模块。所提出的策略为检测框架的每个组件带来了明显减少的推理时间。结合所提出的方法，与作为基线的标准
    Faster R-CNN 检测器相比，检测性能显著提高。此外，与文献中引用的航空图像中车辆检测的现有方法相比，在不同的航空图像数据集上以定量和定性方式均被超越。泛化能力进一步通过对来自具有不同属性的新航空图像数据集的大量先前未见数据进行了演示。


    ## 摘要


    配备成像传感器的空中平台的使用是民用安全领域许多应用的重要组成部分。已知的应用领域包括发现非法或犯罪活动、交通监控、搜索和救援、灾难援助和环境监测。由于待处理数据的数量庞大以及由此产生的认知过载，实践中仅由人工评估员分析航空图像数据是不适用的。因此，通常使用自动图像和视频处理算法来支持人工评估员。关键任务是在对给定场景进行解释之前，对摄像机视场内相关对象的可靠检测。由于相机与地面之间的距离很大导致地面分辨率较低，航空图像数据中的目标检测是一项具有挑战性的任务，且因运动模糊、遮挡和阴影而进一步复杂化。尽管文献中存在大量用于航空图像数据中目标检测的传统方法，但检测精度受所使用手工设计特征的表征能力的限制。


    在本工作中提出了一种用于航空图像数据中目标检测的新型基于深度学习的方案。工作的重点是检测垂直自上而下拍摄的航空图像中的车辆。所开发方案的基础是 Faster
    R-CNN 检测器，与其他基于深度学习的检测方法相比具有更高的检测精度。由于 Faster R-CNN 以及其他基于深度学习的检测方法是在基准数据集上优化的，因此首先系统地研究了对航空图像特征的必要调整，例如待检测车辆的较小尺寸，并识别了由此产生的问题。就实际应用而言，这里尤其成问题的是由类似车辆的结构引起的大量错误检测以及明显增加的运行时间。为了减少错误检测，提出了两种新方法。两种方法都旨在通过额外的上下文信息改进所使用的特征表征。第一种方法通过结合底层
    CNN 架构的早期和深层特征来细化空间上下文信息，从而更好地表征精细和粗糙结构。第二种方法利用语义分割来提高语义信息含量。为此，实现了两种将语义分割集成到检测方法中的不同变体：一方面使用语义分割结果来过滤不太可能的检测，另一方面通过融合用于检测和分割的
    CNN 架构显式实现。通过细化空间上下文信息以及集成语义上下文信息，错误检测数量显著减少，从而提高了检测精度。特别是错误检测在不太可能的图像区域例如建筑物上的大幅下降，显示了所学习特征表征的提高的鲁棒性。为了减少运行时间，工作中采用了两种替代策略。第一种策略是用考虑航空图像数据特征的运行时间优化
    CNN 架构替换用于特征提取的标准 CNN 架构，而第二种策略包括一个用于减少搜索空间的新模块。借助所提出的策略，整体运行时间以及检测方法每个组件的运行时间均显著降低。

