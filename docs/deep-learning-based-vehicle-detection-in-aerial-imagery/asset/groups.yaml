    ## 8.2 与相关工作的比较


    随后将组合的 EMT-MFD Faster R-CNN with SAR 与航空图像目标检测领域具有代表性的现有工作进行比较。由于这些方法大多采用基于深度学习的检测框架用于航空图像中的车辆检测，因此在比较中还进一步考虑了最近提出的基于深度学习的检测框架。EMT-MFD
    Faster R-CNN with SAR 的检测性能以及文献中的检测方法在表 8.10 中给出。所考虑的车辆检测方法要么调整所用特征图的大小 [Car17,
