    VOC提出的设置进行训练。在推理过程中，输入图像被缩放，使较短边等于600像素，类似于[Ren15]。激活值被归一化到0到1之间，数值越高表示激活越强。由于物体尺寸较大，多个特征图像素与物体重叠。这三个滤波器分别响应不同的物体部件（如前挡风玻璃），其激活值表明特征图分辨率甚至足以勾勒出物体部件的轮廓，从而生成与物体精确对齐的边界框。


