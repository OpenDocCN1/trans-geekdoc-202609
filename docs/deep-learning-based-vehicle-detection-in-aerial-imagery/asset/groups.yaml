    ### Feature Map Resolution


    As described above, increasing the feature map resolution mainly improves the
    detection accuracy, as coarse feature map resolutions are not appropriate for
    locating small objects. In the following, the impact of the feature map resolution
    is examined with respect to the object dimensions. Exploiting higher feature map
    resolutions shows an improved AP for all GSDs as depicted in Table 5.5. Note that
    for each GSD, the employed anchor box areas are equivalent to the mean object
    dimensions (see Table 5.6). Using the output of *conv3_3* as feature map achieves
    the best AP for all GSDs. Due to smaller object dimensions and consequently fewer
    feature map pixels that overlap with object instances, the AP decreases with higher
    GSDs for all feature map resolutions. Note that the effect of decreasing AP with
    higher GSDs is further intensified by the IoU criterion used to accept GT objects
    as recalled, which becomes more severe, as even small variations in the predicted
    bounding box coordinates can lead to a clearly worse IoU to the respective GT
    box. However, the drop in AP is more pronounced in case of coarser feature map
    resolutions, which underlines the necessity of high feature map resolutions to
    detect small objects. In particular for high GSDs, most objects are covered by
    a single or only a few feature map pixels in case of exploiting *conv5_3* as feature
    map. Thus, inference on the object location from the feature map to the input
    images is hindered.


