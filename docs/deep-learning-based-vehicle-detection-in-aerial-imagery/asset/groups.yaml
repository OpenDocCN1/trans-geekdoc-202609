    ## 8 Evaluation


    In this chapter, the methods proposed within the context of this thesis are extensively
    evaluated following the evaluation protocol given in Section 4.2. First, different
    combinations of the methods proposed for improving the detection accuracy (see
    Chapter 6) and the methods proposed for runtime optimization (see Chapter 7) are
    examined in Section 8.1. Comparison of the combined methods to representative
    existing work in the literature with respect to detection accuracy and inference
    time is provided in Section 8.2. To demonstrate the generalization ability of
    the proposed methods, additional experiments are conducted in a qualitative manner
    on different aerial imagery datasets in Section 8.3. Finally, a summary is given
    in Section 8.4.


    ### 8.1 Combined Methods for Improved Detection and Inference Time


    As real-world applications generally require high detection accuracies at real-time
    or near real-time, the methods proposed for improving the detection accuracy by
    integrating contextual knowledge and the methods proposed for runtime optimization
    are combined in this section. For this, all experiments are conducted on the DLR
    3K dataset. Note that data augmentation is performed for all trainings by applying
    vertical and horizontal flipping as well as rotation in steps of 90 degrees.


    #### Combined Integration of Spatial and Semantic Context


    As demonstrated in Section 6.1 and Section 6.2, integrating spatial and semantic
    context information results in improved detection accuracy. In the following,
    the effects of combining methods that either integrate spatial or semantic information
    are examined. To this end, MFD Faster R-CNN and EMT Faster R-CNN are merged into
    a single network as depicted in Figure 8.1. Instead of employing the outputs of
    conv4_3 and conv5_3 from the semantic labeling branch as auxiliary feature maps
    for the classification stage by extracting the corresponding features for each
    candidate region via RoI pooling, the CEM introduced in Section 6.1.1 is inserted
    to create a single high-resolution feature map. At first, the features from conv5_3
    are up-sampled and combined with the features from conv4_3. Then, the combined
    features are up-sampled and merged with the output from conv3_3. Thus, the semantically
    enriched features of deeper layers from the semantic labeling branch are propagated
    to the resulting feature map. Note that the proposed combination facilitates the
    use of the resulting feature map for both the RPN and classification stage, so
    that the candidate region generation is not only implicitly but also explicitly
    affected by the semantic labeling branch. The resulting network is trained end-to-end
    using the joint multi-task loss L_MT given in eq. (6.2). Weights pre-trained on
    ImageNet are used for initialization, while all further settings are adopted from
    Section 6.2.3.


    ![](img/99de1214c29cbc525a14b293385af5cf_187_0.png)


    Figure 8.1: Schematic illustration of the merged MFD Faster R-CNN and EMT Faster
    R-CNN. Note that the outputs of conv4_3 and conv5_3 from the semantic labeling
    branch are used as inputs for the CEM to create a single high-resolution feature
    map.

