    **图 5.10：** 不同特征图分辨率的召回-IoU 曲线。利用高分辨率特征图可生成与 GT 注解重叠更高的候选区域。


    ### 5.2.2 锚框设置


    检测精度受 RPN 预测的候选区域质量的强烈影响，因为只有指定数量的候选区域会被转发到分类阶段，而其他候选区域将被丢弃。除了所使用的特征图（参见第 [5.2.1](#)
    节）之外，候选区域的质量还取决于配置的锚框设置，即用于边界框回归的锚框的尺寸和长宽比 [Ren15]。默认情况下，使用 3 种不同尺度和 3 种不同长宽比，从而在每个位置产生
    9 个锚框。虽然默认锚框尺度，产生 128²、256² 和 512² 像素的框面积，在基准检测数据集¹中的物体范围内，但这些尺度明显超过了航空图像中平均车辆尺寸，例如
    DLR 3K 情况下为 28.2 × 28.3 像素。使用默认锚框设置会导致 AP 明显低于 DLR 3K 中车辆范围内的锚框


    ¹ 例如，PASCAL VOC2007 中的物体平均尺寸为 143.2 × 148.3 像素。默认情况下，Faster R-CNN 将输入图像重缩放，使较短边等于
    600 像素，这导致有效平均物体尺寸为 241.3 × 248.7 像素。


    （见表 5.3）。请注意，由于第 5.2.1 节的发现，采用 *conv3_3* 的输出作为特征图。


    **表 5.3：** 不同锚框尺度以及由此产生的不同锚框面积的 AP。与 DLR 3K 中车辆范围内的锚框相比，使用默认设置的结果明显改善。


    | 锚框面积（像素） | AP（%） |

    |---|---|

    | 128², 256², 512² | 92.6 |

    | 14², 28², 42² | **94.3** |


    为了分析锚框尺寸对检测精度的影响，以下仅使用一个锚框尺度。锚框尺度被系统性地减小，产生的框面积范围在 256² 到 14² 像素之间。请注意，由于场景中车辆的不同方向，长宽比保持不变。如表
    5.4 所示，最佳 AP 在锚框面积为 28² 时取得，这大致相当于 DLR 3K 数据集中平均车辆尺寸。虽然接近平均车辆尺寸的锚框 AP 仅略有下降，但锚框明显超过平均车辆尺寸时
    AP 的下降明显增加。与基准数据集不同，DLR 3K 包含具有均匀 GSD 的图像，车辆尺寸仅有微小变化，因此使用多个锚框尺度以应对不同物体尺度的重要性较低。


    **表 5.4：** 不同锚框尺度以及由此产生的不同锚框面积的 AP。与 DLR 3K 中车辆范围内的锚框相比，AP 最佳。


    | 锚框面积（像素） | AP（%） |

    |---|---|

    | 256² | 88.1 |

    | 112² | 92.8 |

    | 56² | 93.8 |

    | 42² | 94.1 |

    | 28² | **94.3** |

    | 14² | 94.2 |


