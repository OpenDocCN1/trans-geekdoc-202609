    ## 5.2 Adaptation to Aerial Imagery


    Deep learning based detection frameworks, such as Faster R-CNN, are typically
    developed and designed for benchmark detection datasets that considerably differ
    from aerial imagery (see Chapter 3). Due to these differences, in particular in
    object dimensions, deep learning based detection frameworks are not directly applicable
    for vehicle detection in aerial imagery. In order to account for the characteristics
    of aerial imagery, several modifications are examined in detail for the first
    time [Som17b, Som18b]. In the following, the conducted modifications to Faster
    R-CNN, i.e., reducing the feature map resolution and adapting the anchor box settings,
    are analyzed and the accompanying effects are discussed.


    ### 5.2.1 Feature Map Resolution


    By using the original VGG16 as feature extractor for Faster R-CNN, top performing
    results are achieved on PASCAL VOC indicating the high suitability for benchmark
    datasets [Ren15]. Due to spatial pooling, the dimensions of the output of the
    last convolutional layer used as feature map are only 1/16 of the input image
    (see Table 5.1), which is sufficient for accurately localizing objects in benchmark
