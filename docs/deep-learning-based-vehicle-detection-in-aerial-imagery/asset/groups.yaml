    explored a small CNN comprised of three convolutional layers with subsequent max
    pooling layers followed by one fully connected layer for feature extraction and
    classification within a sliding window algorithm. The proposed CNN achieved superior
    results compared to conventional methods based on handcrafted features, i.e.,
    HOG+SVM and LBP+SVM, on satellite images collected from Google Earth. In [Che14a],
    the authors modified the CNN architecture proposed in [Che13] by dividing the
