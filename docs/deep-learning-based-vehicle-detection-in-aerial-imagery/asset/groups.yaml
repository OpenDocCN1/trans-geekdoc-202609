    # ### PAIR OF PARADOXES


    This section identifies two kinds of paradox which arise within the processing
    of data. In general, a paradox may be defined as a statement that is self-contradictory
    or contrary to expectation. Data-processing paradoxes are not, however, an indication
    of logical error, but rather a symptom that human intuition refuses to accept
    that certain mathematical relationships are unavoidable. Such paradoxes must be
    resolved if erroneous conclusions are to be avoided.


    # ### Simpson''s Paradox


    The first paradox is the well-known **Simpson''s paradox**, which arises when
    the amalgamated data reverse the conclusion suggested by the separate data. It
    is described in the following way.


    > > In data analysis, the phenomenon that a conclusion is reversed when data are
    amalgregated is usually referred to as Simpson''s paradox.


    This paradox is intimately connected with the issue of **confounding** and has
    important implications for the interpretation of data from observational studies.


    # ### Lord''s Paradox


    The second paradox is **Lord''s paradox**, which is less well known than the first.
    The paradox is described in the following quotation taken from a well-known article
    by Lord.


    > > Lord''s paradox is a statistical paradox that arises when two different methods
    of analysis yield conflicting conclusions about the same data.


    The resolution of this paradox has been the subject of much debate, but it serves
    to emphasise the importance of careful specification of the model and the research
    question.'
