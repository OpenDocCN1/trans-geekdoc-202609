    # Abstract


    systematically examined and resulting issues with respect to real-world applications,
    i.e., the high number of false detections caused by vehicle-like structures and
    the poor inference time, are identified. Two novel components have been proposed
    to improve the detection accuracy by enhancing the contextual content of the employed
    feature representation. The first component aims at increasing spatial context
    information by combining features of shallow and deep layers to account for fine
    and coarse structures, while the latter component leverages semantic labeling
    – the pixel-wise classification of an image – to introduce more semantic context
    information. Two different variants to integrate semantic labeling into the detection
    framework are realized: exploitation of the semantic labeling results to filter
    out unlikely predictions and inducing scene knowledge by explicitly merging the
    semantic labeling network into the detection framework via shared feature representations.
    Both components clearly reduce the number of false detections, resulting in considerably
    improved detection accuracies. To reduce the computational effort and consequently
    the inference time, two alternative strategies are developed in the context of
    this thesis. The first strategy is replacing the default CNN architecture used
    for feature extraction with a lightweight CNN architecture optimized with regard
    to vehicle detection in aerial imagery, while the latter strategy comprises a
    novel module to restrict the search area to areas of interest. The proposed strategies
    result in clearly reduced inference times for each component of the detection
    framework. Combining the proposed approaches significantly improves the detection
    performance compared to the standard Faster R-CNN detector taken as baseline.
    Furthermore, existing approaches for vehicle detection in aerial imagery, taken
    from the literature, are outperformed in quantitative and qualitative manner on
    different aerial imagery datasets. The generalization ability is further demonstrated
    on a large set of previously unseen data collected from novel aerial imagery datasets
    with differing properties.'
