    ## 2.3.2 基于深度学习的车辆检测方法


    近年来，由于手工特征的表征能力有限，用于航空图像中车辆检测的任务中，传统方法在很大程度上已被深度学习方法取代。用于航空图像中车辆检测的最初深度学习方法在滑动窗口算法中采用
    CNN 作为特征提取器，部分作为分类器。Chen 等 [Che13] 探讨了一种小型 CNN，该网络由三个卷积层、随后的最大池化层以及一个全连接层组成，用于在滑动窗口算法中进行特征提取和分类。所提出的
    CNN 在从 Google Earth 收集的卫星图像上取得了优于基于手工特征的传统方法（如 HOG+SVM 和 LBP+SVM）的结果。在 [Che14a]
    中，作者通过将最后一层卷积层的输出划分为多个具有可变感受野的块来修改 [Che13] 中提出的 CNN 架构，从而允许提取不同尺度的特征，这进一步提高了在同一组从
    Google Earth 收集的卫星图像上的检测精度。为了减少检测流程的计算量，多位作者采用了区域提议技术用于航空图像中的车辆检测，从而得到更小的待分类候选区域集。通过应用二值归一化梯度（Binary
    Normed Gradients, BING）[Che14c] 来提取区域提议，而不是在 [Che13, Che14a] 中采用的穷举滑动窗口范式，Qu 等
