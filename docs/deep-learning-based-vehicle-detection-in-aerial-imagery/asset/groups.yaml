    ## 1 引言


    ### 1.1 研究动机


    利用安装在卫星或空中平台（如直升机、无人机（UAV）等）上的传感器记录图像或视频，可以通过单个传感器覆盖大面积区域，并捕捉多个物体及其交互。因此，这克服了地面附近固定相机网络的一个核心局限性。由于成像系统和空中平台的技术日益进步以及随之而来的成本降低，使用航空图像（也称为遥感图像）的应用领域正在迅速增长[Res17]。2017年全球航空成像市场规模为15.6亿美元，预计到2026年将达到62.4亿美元[Res18]。其中，预期将出现显著市场增长的常见应用包括搜索与救援任务[Rud08,
    Goo09, Qi16]、灾害救援[Ada11, Eze14, Erd16]、交通监控[Ang03, Len08, Kan15]以及监视与侦察任务[Gir04,
    Hei10, Rei10]。图1.1给出了突出航空图像在此类应用中实用性的示例。


    由于搜索区域广阔且通常难以进入（如山区或公海），配备专用相机传感器（如热红外（IR））的直升机或无人机通常用于协助寻找失踪或受伤人员，并协助搜捕和逮捕犯罪嫌疑人或逃犯。针对空中力量与地面搜索队在成功率和定位时间方面的有效性对比研究，证实了它们在搜索与救援任务中的益处[Ham17,
    Eye18]。研究表明，自动化算法对人类操作员的支持对于高成功率至关重要，因为动态且复杂的环境会妨碍对仅在很短时间内可见的人员进行定位[Goo09]。


