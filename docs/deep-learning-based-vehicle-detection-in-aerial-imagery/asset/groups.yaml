    Classification stage. By filtering out tiles that do not contain any vehicles,
    the inference time of the actual detection module is reduced. In contrast to previous
    approaches, the SAR module is directly integrated into the detection pipeline.
    For this purpose, the SAR module and Faster R-CNN are realized within a single
    network by sharing the convolutional features. In the following, the SAR module
    and the implementation details are presented in detail. Ablation experiments are
    further conducted to demonstrate the effect of the proposed SAR module on the
    inference time.


    ![](img/99de1214c29cbc525a14b293385af5cf_176_0.png)


    Figure 7.6: Schematic illustration of Faster R-CNN extended by an integrated Search
    Area Reduction (SAR) module to adaptively reduce the search area. The SAR module
    divides the input image into tiles and predicts a confidence score of how likely
    a tile contains at least one object. As only tiles that likely contain at least
    one object are forwarded to the components of the detection module, the inference
    time of the actual detection module is reduced.


    ### 7.2.1 Search Area Reduction Module


    The main principle of the proposed approach to reduce the search area is the division
    of the input image into small tiles that are then classified into tiles containing
    at least one object or none. To realize this within a deep learning based detection
    framework, a SAR module comprised of three components is a batch by stacking the
    cropped features. The batch is then processed by the subsequent *SAR classifier*.


    The whole network employed for SAR classification is in essence the default VGG16
    classifier comprised of five sequences of convolutional layers followed by three
    fully connected layers and a final softmax layer (see Table 5.1). The last fully
    connected layer comprising 1000 outputs trained for 1000-way ImageNet classification
    is replaced by a new fully connected layer with 2 outputs for the two classes.
    The subsequent softmax layer outputs the corresponding probability distribution.
    As described above, all convolutional features are computed at once for the entire
    image and the output of the last convolutional layer is divided into tiles. To
    classify each tile into tiles containing at least one object or none, the sequence
    of fully connected layers as well as the softmax layer denoted as SAR classifier
    are applied on the corresponding features. Note that the fully connected layers
    require fixed input dimensions. Therefore, the cropped features are of size 14
    × 14 × 512 (width × height × channels), which complies to the dimensions for input
    images of size 224 × 224 pixels as in case of the VGG16 classification network.


    To restrict the search area, i.e., area processed by the detector components,
    a novel *sub-division-RPN layer* is applied on the output of *conv3_3*¹, which
    is used as feature map for the RPN. The *sub-division-RPN layer* divides the output
    of *conv3_3* into tiles of size 56 × 56 × 512. The offsets for cropping the tiles
    are set in a way so that the corresponding input image regions are equivalent
    for both the *sub-division-RPN layer* and *sub-division-SAR layer*. Besides the
    output of *conv3_3*, the *sub-division-RPN layer* takes as additional input the
    classification results of the SAR classifier. Based on the classification scores,
    tiles that are likely to contain at least one object are passed to the RPN, while
    all other tiles are filtered out. Note that the passed tiles are stacked together
    into one batch, so that the RPN can generate region proposals for all relevant
    tiles at once.


    ¹ To adapt the number of channels required for the fully connected layers, a 1
    × 1 convolutional layer is applied on the output of *conv3_3* prior to the *sub-division-RPN
    layer*.


    The original proposal layer computes the actual coordinates of each region proposal
    by adding the predicted offsets to the respective reference bounding box. As the
    reference bounding box is given in tile coordinates, the proposal layer of the
    RPN is modified in order to map the region proposals to their position in the
    input image. Therefore, a position vector generated by the sub-division-RPN layer
    is taken as an additional input. The position vector encodes the position of each
    tile that is forwarded from the sub-division-RPN with regard to its position in
    the input image. The actual coordinates of each region proposal are then computed
    by adding the offsets for the respective tile to its position given in tile coordinates.
    All mapped region proposals are then forwarded to the classification stage.


    ### 7.2.2 Implementation Details


    To train the extended Faster R-CNN, a training strategy comprised of two stages
    is performed. Note that training both Faster R-CNN and the SAR classifier at once
    is not possible, as Faster R-CNN requires at least one GT object per training
    image, whereas the SAR classifier requires images with and without GT objects.
    In the first stage, Faster R-CNN is trained end-to-end for 60,000 iterations.
    For this, the training settings described in Section 5.1.3 are adopted. Then,
    the SAR classifier is trained in the second stage. To account for the input image
    dimensions of the default VGG16 classifier used as base architecture, the images
    of the DLR 3K dataset are split into sub-images of size 224 × 224 pixels. Adjacent
    sub-images exhibit an overlap of 46 pixels. The sub-images are divided into two
    categories: the first comprises all sub-images without any GT annotation and the
    second contains all sub-images with at least one GT annotation. For each sub-image,
    only GT annotations with an overlapping area of 10 or more pixels to the current
    sub-image are considered. Furthermore, data augmentation, i.e., horizontal and
    vertical flipping, is performed for each sub-image yielding a total of 19,200
    training images, whereof 4,656 images belong to the category with at least one
    object. Example images of the training set are depicted in Figure 7.8.


    ![](img/99de1214c29cbc525a14b293385af5cf_180_0.png)


    Figure 7.8: Example images of the training set used to train the SAR classifier
    for DLR 3K. The top row shows examples for the category with at least one object,
    while the bottom row shows examples for the category without objects.


    The SAR classifier is trained for 10,000 iterations with a batch size of 8. The
    initial learning rate is set to 0.001 and decreased after 5,000 iterations by
    a factor of 10. Note that all weights of Faster R-CNN are kept fixed in the second
    training stage.


    For deployment, the sub-division-SAR layer, sub-division-RPN layer, and the modified
    proposal layer are added to the framework to perform the search area reduction
    and the detection in a single network as depicted in Figure 7.7. For each tile,
    NMS is applied on the 400 region proposals exhibiting the highest confidence score.
    The top-80 ranked proposals after NMS are then forwarded to the classification
    stage. As the input images are divided into 25 tiles, the maximum number of proposals
    before and after NMS are 10,000 and 2,000, respectively, which is equivalent to
    the numbers for Faster R-CNN without the SAR module (see Section 5.1.3). The further
    settings are analogous to the settings employed for Faster R-CNN without the SAR
    module.


    ### 7.2.3 Ablation Experiments


    The impact of the proposed SAR module on the inference time is evaluated on the
    DLR 3K dataset and the VEDAI LCI dataset in order to account for different area
    categories with varying vehicle distributions, as the speed-up in inference time
