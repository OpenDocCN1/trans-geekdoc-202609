    ## 5 基础框架


    本章介绍所用基础框架（即 Faster R-CNN）的功能原理。为此，详细描述了主要的检测器组件和实现细节。此外，针对航空影像的特点提出了相应的调整，并系统地检验了这些调整以发现伴随的问题。


    ### 5.1 Faster R-CNN


    选择 Faster R-CNN 作为本论文提出的检测流程的基础框架，是因为与其他基于深度学习的检测器相比，它具有更优的检测精度，尤其是在小目标实例方面。对于航空影像，精确检测小目标实例的能力更为关键，因为如第4.1节所述，低空间分辨率导致其中的目标通常只有几个像素大小。Faster
    R-CNN 的功能原理如图5.1所示，它主要包含两个模块。第一个模块称为 RPN，它生成一组候选区域，并将其传递给后续模块（称为分类阶段）。两个模块通过共享一组称为特征提取器的卷积层合并为单个网络。下面介绍两个模块的基本原理以及实现细节。


    ![](img/99de1214c29cbc525a14b293385af5cf_81_0.png)


    图5.1：Faster R-CNN 的功能原理，它以两个阶段进行目标检测：初始阶段生成一组候选区域（称为 RPN），以及后续的分类阶段。两个阶段共享一组卷积层，并将最后一个卷积层的输出作为特征图（以深蓝色突出显示）。


    #### 5.1.1 区域提议网络


    区域提议网络是一种基于深度学习的目标提议方法，其功能原理如图5.2所示。RPN 的目的是定位可能包含目标的候选区域。为此，RPN 包含一个小型网络，该网络以滑动窗口方式在最后一个共享卷积层的输出（用作特征图）上移动。该小型网络由一个
    3×3 卷积层和两个并列的全连接层组成：一个用于边界框回归（reg 层），一个用于分类（cls 层）。实际上，这两个全连接层是通过两个并列的 1×1 卷积层实现的。


    为了进行边界框回归，以每个滑动窗口位置（即特征图位置）为中心的锚框被用作参考框。为了适应不同的目标尺度，采用具有不同宽高比和尺寸的锚框，从而在每个滑动窗口位置产生
    k 个锚框。因此，reg 层有 4k 个输出，编码每个锚框的偏移量，用于预测对应候选区域的坐标；而 cls 层输出 2k 个关于目标是否存在置信度分数。


    边界框及关联的 GT 框。分类损失 $L_{cls}$ 是两类问题的对数损失，计算方式为：


    $$L_{cls}(p_i,p_i^*) = -p_i^* \log p_i - (1 - p_i^*) \log(1 - p_i). \tag{5.2}$$


    注意，为简单起见，分类损失实现为两类 softmax 层 [Ren15]。为确保回归损失仅对正锚框激活，将其乘以类别标签 $p_i^*$ 进行加权。回归损失为：


    $$L_{reg}(t_i,t_i^*) = \sum_{j \in \{x,y,w,h\}} L_1^{smooth}(t_{ij} - t_{ij}^*),
    \tag{5.3}$$


    其中应用了平滑 $L_1$ 损失 [Gir15]，与 $L_2$ 损失相比，它对离群值更稳健：


    $$L_1^{smooth}(x) = \begin{cases} 0.5x^2, & \text{if } |x| < 1 \\ |x| - 0.5 &
    \text{otherwise.} \end{cases} \tag{5.4}$$


    表示预测边界框和关联 GT 框的参数化坐标的向量定义如下：


    $$

    \begin{aligned}

    t_x &= (x - x_a)/w_a, \quad t_y = (y - y_a)/h_a,\\

    t_w &= \log(w/w_a), \quad t_h = \log(h/h_a),\\

    t_x^* &= (x^* - x_a)/w_a, \quad t_y^* = (y^* - y_a)/h_a,\\

    t_w^* &= \log(w^*/w_a), \quad t_h^* = \log(h^*/h_a).

    \end{aligned} \tag{5.5}

    $$


    其中，$x$、$y$、$w$ 和 $h$ 分别是预测边界框的中心坐标、宽度和高度。对应的锚框和 GT 框的坐标与尺寸分别用下标 $a$ 和上标 $*$ 表示。


    在部署期间，每个区域提议的实际边界框坐标在称为 *proposal layer*（提议层）的后续层中计算，方法是将预测的偏移量加到相应锚框的坐标上。为了生成最终的候选区域集合，根据预测的目标存在置信度分数对区域提议进行排序，并应用非极大值抑制（NMS）去除冗余的区域提议。


    #### 5.1.2 分类阶段


    分类阶段的功能原理如图5.3所示，其本质上是 Fast R-CNN 检测器 [Gir15]。分类阶段接收预定义数量的候选区域（即置信度分数最高的区域提议）作为输入。每个候选区域称为感兴趣区域（RoI），被投影到与
    RPN 使用的相同的特征图上。通过执行最大池化，RoI 池化层将对应候选区域内的相关特征转换为具有固定空间范围的特征图。该特征图随后被送入一系列全连接层，这些全连接层分出两个并列的全连接层：一个用于分类，另一个用于边界框回归，类似于
    RPN。$cls$ 层为 $c$ 个类别和背景类别输出 $c+1$ 个置信度分数，而 $reg$ 层为每个类别输出 $4c$ 个值，这些值编码了相对于相应候选区域的偏移量。所使用的子网络也称为分类头。


    ![](img/99de1214c29cbc525a14b293385af5cf_84_0.png)


    **图5.3：** 分类阶段的功能原理。每个感兴趣区域（即候选区域）被投影到特征图上。对应候选区域内的相关特征通过 RoI 池化转换为具有固定空间范围的特征图，并将其送入一系列全连接层（FC）。最后的两个并列全连接层输出置信度分数和每类回归偏移量。


    训练分类阶段时，从 RPN 转发的候选区域集合中采样一组候选区域，也称为小批量 $\mathcal{B}_{CLS}$。与某个 GT 目标的 IoU 至少为
    0.5 的候选区域被关联到相应的类别标签 $u_i>0$，否则被分配为背景 $u_i=0$。通过子采样背景区域，将与目标关联的候选区域和分配给背景的候选区域之间的比例设置为
    1:3。应用类似于等式 (5.1) 的多任务损失来联合训练分类阶段的分类和边界框回归：


    $$L_{CLS}=\sum_{i\in\mathcal{B}_{CLS}}L_{cls}(p_i,u_i)+\sum_{i\in\mathcal{B}_{CLS}}I(u_i)L_{reg}(t_i^u,v_i).
    \tag{5.6}$$


    分类损失 $L_{cls}$ 是对数损失，其中 $p_i$ 是候选区域 $i$ 的概率分布，$u_i$ 是真实类别标签。回归损失 $L_{reg}$ 是平滑
    $L_1$ 损失（见等式 (5.3)），其中 $t_i^u$ 和 $v_i$ 是表示与类别 $u_i$ 关联的预测边界框和当前 GT 框 $v_i$ 的参数化坐标的向量。注意，GT
    框仅对真实类别给出。因此，回归损失用指示函数 $I(u_i)$ 加权，当 $u_i$ 为真实类别时其值为 1，对所有其他类别和背景为 0。


    #### 5.1.3 实现细节


    如前所述，一组卷积层被用作 Faster R-CNN 的特征提取器，其中最后一个卷积层的输出作为两个阶段的特征图。为此，默认使用 VGG16 [Sim14]
    作为基础网络。表5.1 示意性地描述了 VGG16 的架构，该网络由 13 个卷积层组成，分别按 2 层和 3 层排列，后接 3 个全连接层。在每个卷积层和全连接层之后应用
    ReLU 作为激活函数，而在第 2、4、7、10 和 13 个卷积层之后通过最大池化层执行空间池化。这 13 个卷积层作为特征提取器在两个阶段之间共享，最后一个卷积层的输出（记为
    $conv5\_3$）用作特征图。全连接层为分类阶段进行了调整。为此，输出


