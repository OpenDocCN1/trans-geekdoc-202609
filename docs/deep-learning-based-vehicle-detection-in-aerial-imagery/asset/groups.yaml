    | **CGBN** | 跨GPU批归一化 |

    | **Cl** | 杂波 |

    | **CNN** | 卷积神经网络 |


    ## 符号表


    ### 花体符号


    | 符号 | 描述 |

    | --- | --- |

    | $\mathcal{A}$ | 真实标注集合 |

    | $\mathcal{B}$ | 批次 |

