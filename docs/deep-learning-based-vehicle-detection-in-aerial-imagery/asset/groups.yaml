    ## 缩写


    | 缩写 | 定义 |

    | --- | --- |

    | **ABO** | 平均最佳重叠 |

    | **AdaBoost** | 自适应提升 |

    | **AGRC** | 自动地理参考中心 |

    | **AP** | 平均精度 |

    | **AVPN** | 精确车辆提议网络 |

