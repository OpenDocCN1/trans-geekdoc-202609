    ## ISPRS 2D 语义标注挑战 Potsdam 数据集


    在文献中，存在多个航空语义标注数据集，其中大多数公开可用的数据集仅为单个类别提供标注，例如道路或建筑物轮廓 [Mni13, Mag17, Van18, Dem18]。由于缺少对出现车辆的标注，这些数据集不适用于车辆检测任务。相比之下，2018
    IEEE GRSS 数据融合挑战数据集 [GRS18]、ISPRS 2D 语义标注挑战 Vaihingen 数据集 [ISP] 以及 ISPRS 2D 语义标注挑战
    Potsdam 数据集 [ISP] 为包括车辆在内的多个类别提供了标注。由于地面采样距离较低，即 50 cm，以及使用的传感器波段分别为红外、红色和绿色，因此
    2018 IEEE GRSS 数据融合挑战数据集和 ISPRS 2D 语义标注挑战 Vaihingen 数据集未被考虑，而 ISPRS 2D 语义标注挑战
    Potsdam 数据集被选为评估集成语义标注对检测性能影响的主要数据集。


    ISPRS 2D 语义标注挑战 Potsdam 数据集，以下简称为 Potsdam 数据集，由 38 个分辨率为 6000 × 6000 像素、GSD 为
    5 cm 的 patch 组成。Potsdam 数据集分为 24 个 patch 用于训练和 14 个 patch 用于测试。根据 [She16]，the


    ![](img/99de1214c29cbc525a14b293385af5cf_74_0.png)


    图 4.7：语义标注掩膜的示例（顶行），导致分割（第 1 列）和合并（第 2 列）的 GT 标注被手动调整（底行），以及车辆位于树下被标记为树类别的语义标注掩膜示例（第
    3 和第 4 列），其标注被手动添加。


    ## 4.2 评估指标与协议


    下面将介绍用于评估所提检测流程、区域提议生成，即 RPN，以及用于集成语义上下文信息的语义标注方法的常见指标。


    ### 目标检测


    在本论文中，采用平均精度（AP）[Sal83] 作为衡量检测性能的常用指标，遵循 [Eve10] 中介绍的评估协议。计算 AP 时，将检测结果与 GT 进行比较。检测结果和
    GT 以带关联类别标签的边界框形式提供。检测结果还为每个边界框包含分配类别的概率，称为置信度分数。


    置信度分数和交并比（IoU），也称为 Jaccard 系数，被用作判断检测是否被视为正确检测，称为 *真阳性*（TP），或不的准则。IoU 定义为预测边界框与
    GT 框的交集面积除以并集面积：


    IoU = $\frac{A_{pred} \cap A_{GT}}{A_{pred} \cup A_{GT}}$ . (4.1)


    如果检测满足两个条件，则被视为 TP：置信度分数高于给定阈值 τ 且 IoU 大于或等于 0.5，这被称为 *PASCAL 准则*¹。不满足这两个条件的检测称为
    *假阳性*（FPs）。请注意，如果多个检测对应同一 GT 实例，只有置信度分数最高的那个计为 TP，其余检测被视为 FP。没有分配检测的 GT 实例称为 *假阴性*（FNs）。


    精确度 *P* - 正确检测的百分比 - 定义为 TP 数除以 TP 和 FP 之和：


    P = $\frac{|TP|}{|TP| + |FP|}$ . (4.2)


    召回率 *R* 是检测率，定义为 TP 数除以 TP 和 FN 之和：


    R = $\frac{|TP|}{|TP| + |FN|}$ . (4.3)


    两者取值范围都在 0 到 1 之间。对于固定的置信度阈值 τ，精确度和召回率对称为操作点。τ 的较高值通常导致更高的精确度和更低的召回率，反之亦然。通过改变
    τ，可以得到不同的操作点，从而得到如图 4.8 所示的精确度-召回率曲线（PRC）。


    ¹ 在多类别情况下，这在本论文中并非如此，预测类别还必须与对应 GT 的类别标签匹配。


    ## 一对悖论


    本节确定了数据处理中出现的两种悖论。一般而言，悖论可以定义为自相矛盾或与预期相反的陈述。然而，数据处理悖论并不是逻辑错误的迹象，而更像是人类直觉拒绝接受某些数学关系不可避免的症状。如果要避免错误的结论，这类悖论必须得到解决。


    ### Simpson 悖论


    第一个悖论是众所周知的 **Simpson 悖论**，当合并数据颠覆了单独数据所暗示的结论时就会出现。它描述如下。


    > > 在数据分析中，当数据被聚合时结论被逆转的现象通常被称为 Simpson 悖论。


    该悖论与 **混杂** 问题密切相关，对来自观察性研究的数据的解释具有重要意义。


    ### Lord 悖论


    第二个悖论是 **Lord 悖论**，比第一个知名度低。该悖论在 Lord 的一篇著名文章中引用如下描述。


    > > Lord''s paradox 是一种统计悖论，当两种不同的分析方法对同一数据得出冲突的结论时就会出现。


    该悖论的解决已成为大量争论的主题，但它强调了仔细指定模型和研究问题的重要性。


    用作评估指标，遵循 2D 语义标注竞赛协议¹。两个指标均源自基于像素的混淆矩阵。为此，每个瓦片的混淆矩阵被累积。F1-score 是精确度和召回率的调和平均数，定义为


    $F1\text{-score} = 2 \frac{P \cdot R}{P + R}$

    (4.8)


    为按类别计算精确度和召回率（见式 (4.2) 和式 (4.3)），TP 像素数来自混淆矩阵的主对角线元素，而 FP 像素数是每列的和，FN 像素数是每行的和，不包括主对角线元素。总体准确率通过归一化混淆矩阵的迹来计算。请注意，在评估期间，不同标签的
    GT 区域之间三像素边界将被忽略，以减少由于标注过程导致的边界定义不确定性的影响。


    ## 推理时间


    除了检测精度之外，推理时间也是判断检测性能的另一个关键因素。在本论文的背景下，使用了代表服务器和桌面设置的两种不同设备来测量推理时间。选择桌面设置是为了考虑到许多实际应用无法使用强大的服务器设置。每台设备的关键特征在表
    4.2 中给出。所有推理时间测量均通过 Caffe 的 pycaffe Python 接口进行。如果未另行说明，推理时间以毫秒（ms）为单位报告，平均值取自相应数据集的完整测试集。请注意，所有时间测量均不包括预处理步骤，例如加载图像，因为这些步骤可以在等待
    GPU 完成当前前向传递时异步进行。在每次计时之前，进行 10 次前向传递以预热 GPU 内核。


