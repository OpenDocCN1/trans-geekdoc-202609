    # 6.1 Spatial Context


    Exploiting shallower layers as feature map for Faster R-CNN is crucial for vehicle
    detection in aerial imagery, as the resolution of deeper layers is often not sufficient
    to accurately localize tiny objects. To overcome the lack of semantic and contextual
    content resulting in false alarms, an extension to the original Faster R-CNN architecture
    called Multi Feature Deconvolutional (MFD) Faster R-CNN is proposed in the context
    of this thesis. The schematic structure of the MFD Faster R-CNN is illustrated
    in Figure 6.1. Inspired by semantic labeling networks aiming at the prediction
    of fine and coarse structures, features from various layers (indicated by different
    blue tones) offering different semantic and contextual information are combined.
    For this purpose, a context enhancement module (CEM) highlighted in green is introduced
    to allow the combination of these features, while the feature map resolution is
    kept sufficiently high to localize tiny objects. In the following, the CEM and
    the implementation details are presented followed by experiments and discussion
    of the results to highlight the enhanced detection accuracy.


    ![](img/99de1214c29cbc525a14b293385af5cf_113_0.png)


    Figure 6.1: Schematic structure of the proposed Multi Feature Deconvolutional
    Faster R-CNN, which extends the original Faster R-CNN by a CEM to combine features
    of shallow and deep layers, while the resolution of the feature map is kept sufficient
    to localize tiny objects.'
