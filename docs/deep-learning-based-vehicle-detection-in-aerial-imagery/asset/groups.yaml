  - '[PAGE 178]


    a batch by stacking the cropped features. The batch is then processed by the subsequent
    *SAR classifier*.


    The whole network employed for SAR classification is in essence the default VGG16
    classifier comprised of five sequences of convolutional layers followed by three
    fully connected layers and a final softmax layer (see Table 5.1). The last fully
    connected layer comprising 1000 outputs trained for 1000-way ImageNet classification
    is replaced by a new fully connected layer with 2 outputs for the two classes.
    The subsequent softmax layer outputs the corresponding probability distribution.
    As described above, all convolutional features are computed at once for the entire
    image and the output of the last convolutional layer is divided into tiles. To
    classify each tile into tiles containing at least one object or none, the sequence
    of fully connected layers as well as the softmax layer denoted as SAR classifier
    are applied on the corresponding features. Note that the fully connected layers
    require fixed input dimensions. Therefore, the cropped features are of size 14
    × 14 × 512 (width × height × channels), which complies to the dimensions for input
    images of size 224 × 224 pixels as in case of the VGG16 classification network.


    To restrict the search area, i.e., area processed by the detector components,
    a novel *sub-division-RPN layer* is applied on the output of *conv3_3*¹, which
    is used as feature map for the RPN. The *sub-division-RPN layer* divides the output
    of *conv3_3* into tiles of size 56 × 56 × 512. The offsets for cropping the tiles
    are set in a way so that the corresponding input image regions are equivalent
    for both the *sub-division-RPN layer* and *sub-division-SAR layer*. Besides the
    output of *conv3_3*, the *sub-division-RPN layer* takes as additional input the
    classification results of the SAR classifier. Based on the classification scores,
    tiles that are likely to contain at least one object are passed to the RPN, while
    all other tiles are filtered out. Note that the passed tiles are stacked together
    into one batch, so that the RPN can generate region proposals for all relevant
    tiles at once.


    ¹ To adapt the number of channels required for the fully connected layers, a 1
    × 1 convolutional layer is applied on the output of *conv3_3* prior to the *sub-division-RPN
    layer*.'
