    ## 6.2.3 联合语义标注与检测


    ### 隐式多任务 Faster R-CNN


    第一种变体在下文中称为隐式多任务（IMT）Faster R-CNN，如图 6.13 所示。所提出的架构包含两个分支：一个用于检测（上分支），一个用于语义标注（下分支）。检测分支包括
    RPN 和分类阶段，而语义标注分支示例性地采用 FCN-D16。请注意，语义标注网络可以由第 6.2.1 节中描述的替代架构替换。两个分支通过共享前四个卷积层序列进行合并。其前提是两个分支都基于相同的基础架构，即
    VGG16。这使得网络能够学习一个共享的全局特征图，即 conv4_3，语义标注分支通过该特征图隐式地影响检测分支。由于语义标注分支仅在训练时需要，因此可以在部署期间丢弃。


    为了实现两个任务的端到端训练，提出了一个由五个损失组成的联合多任务损失 $L_{MT}$：


    $$L_{MT} = \lambda_1L_{SL} + \lambda_2L_{RPN,cls} + \lambda_3L_{RPN,reg} + \lambda_4L_{CLS,cls}
    + \lambda_5L_{CLS,reg}. \tag{6.2}$$


    为此，将语义标注分支的 *conv4_3* 输出用作分类阶段的辅助特征图。生成的区域提议集合也被投影到辅助特征图上，并通过额外的 RoI 池化层提取相应特征。该额外
    RoI 池化层的输出与检测分支的 RoI 池化层输出具有相同的维度（即 7 × 7）和通道数（即 512）。两个 RoI 池化层的输出通过逐元素相加进行融合。融合后的特征随后被输入分类阶段的全连接层序列。语义标注分支更深卷积层的输出未被考虑用作特征图，因为其输出通道数超过了上述逐元素相加所要求的
    512。EMT Faster R-CNN 使用 eq. (6.2) 中给出的联合多任务损失，以与 IMT Faster R-CNN 类似的方式进行训练。因此，语义上下文信息以两种方式引入：隐式地通过共享卷积层和联合学习，显式地通过将语义标注分支的特征用于分类阶段。


    ### 消融实验


    接下来，我们评估了将场景知识引入检测框架的两种变体的影响。为此，每个模型以 0.001 的初始学习率进行端到端训练，共迭代 70,000 次。使用在 ImageNet
    上预训练的 VGG16 来初始化共享卷积层以及两个分支的权重。请注意，通过垂直和水平翻转以及按 90 度步长旋转进行的数据增强会带来更好的语义标注结果 [She16]。为了适应
    Potsdam 数据集的特点，采用了第 6.2.2 节中介绍的设置，即利用 *conv4_3* 作为特征图，将锚点基础设置为 4，锚点尺度设置为 8、16
    和 24，并将 NMS 后排名前 100 的区域提议送入分类阶段。


