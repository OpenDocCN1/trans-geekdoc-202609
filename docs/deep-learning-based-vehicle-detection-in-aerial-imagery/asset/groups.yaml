    在部署阶段，对置信度得分最高的10,000个区域提议应用NMS。用于NMS的重叠阈值设置为0.7。经过NMS后排名前2000的区域提议随后被送入分类阶段。这样，冗余的区域提议被移除，需要分类的区域提议数量以及相应的计算成本得以减少。为了去除重复检测，对最终检测结果应用重叠阈值为0.3的NMS。NMS的设置基于[Som18b]中报告的初步实验。


    ## 5.2 对航空影像的适应性调整


    基于深度学习的检测框架（如Faster R-CNN）通常是为与航空影像差异很大的基准检测数据集而开发和设计的（见第3章）。由于这些差异，尤其是在物体尺寸方面，基于深度学习的检测框架不能直接应用于航空影像中的车辆检测。为了适应航空影像的特点，本文首次详细研究了几种修改方案[Som17b,
    Som18b]。接下来，分析了对Faster R-CNN进行的修改，即降低特征图分辨率和调整锚点框设置，并讨论随之而来的影响。


