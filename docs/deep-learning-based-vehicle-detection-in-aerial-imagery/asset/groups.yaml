    Qualitative detection examples (red boxes) and corresponding GT (green boxes)
    on DLR 3K with a GSD of 26 cm are visualized in Figure 8.5. While all detection
    methods show a good localization accuracy, applying the proposed detection method
    results in fewer false alarms caused by vehicle-like structures on buildings.
    However, for all methods, remaining false alarms are mainly due to objects located
    on asphalted areas with vehicle-like shapes.


    To demonstrate the transferability of the detection methods proposed in this thesis,
    MFD Faster R-CNN with SAR is compared to existing work from literature on VEDAI
    LCI and VEDAI SCI (see Table 8.12). Note that exploitation of semantic information
    is not conducted because of the missing semantic labeling annotations. Each model
    is trained with the same data augmentation settings, i.e., vertical and horizontal
    flipping as well as rotation in steps of 90 degrees. The proposed MFD Faster R-CNN
    with SAR and VGG16 as base network achieves the best AP on both versions of the
    dataset. Using ZynqNet as base network exhibits the same detection accuracy on
