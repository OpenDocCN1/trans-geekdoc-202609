  - '[PAGE 275]


    ![](img/99de1214c29cbc525a14b293385af5cf_275_0.png)


    Lehrstuhl für Interaktive Echtzeitsysteme

    Karlsruher Institut für Technologie


    Fraunhofer-Institut für Optronik, Systemtechnik und Bildauswertung IOSB Karlsruhe


    Object detection in aerial imagery is essential for a wide range of applications
    in the field of civil safety and security. However, low spatial resolution originating
    from the large distance between sensor and ground, capturing conditions and varying
    scenarios due to different daytimes and regions impede the detection task. This
    book proposes a novel deep learning based detection method, focusing on vehicle
    detection in aerial imagery recorded in top view. The base detection framework
    is extended by two novel components to improve the detection accuracy by enhancing
    the contextual and semantical content of the employed feature representation,
    yielding a reduced number of false detections. To reduce the computational effort
    and consequently the inference time, a lightweight CNN architecture optimized
    with regard to vehicle detection in aerial imagery is proposed as base architecture
    and a novel module restricting the search area to areas of interest is introduced.
    Extensive evaluation demonstrates state-of-the-art performance and the generalization
    ability on unseen aerial imagery data.'
