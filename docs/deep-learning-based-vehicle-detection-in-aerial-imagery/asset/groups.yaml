    The remainder of this section is organized as follows. First, auspicious architectures
    for semantic labeling of aerial imagery are presented. Then, the two proposed
    methods are described in detail and ablation experiments on the ISPRS 2D Semantic
    Labeling Challenge Potsdam dataset are provided. Finally, an evaluation on a novel
    semantic labeling dataset based on DLR 3K is performed to emphasize the effect
    of integrating semantic labeling on the detection performance.


    # 6.2.1 Semantic Labeling Approaches


    Several CNN architectures have been proposed for the task of semantic labeling.
    In the following, four promising architectures that are examined within the context
    of this thesis are introduced. Note that all considered architectures are based
    on the VGG16 architecture to facilitate the fusion of the semantic labeling network
    with the Faster R-CNN detection network proposed in Section 6.2.3.


