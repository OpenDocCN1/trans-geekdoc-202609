    # 7.2 Search Area Reduction


    Restricting the search area to areas of interest, e.g., roads for vehicle detection,
    is an often applied preprocessing step in conventional object detection pipelines.
    In particular for vehicle detection in aerial imagery, both the computational
    costs for extracting feature descriptors as well as the subsequent classification
    and the number of false positive detections are reduced. While benchmark detection
    datasets typically comprise objects that are almost image filling, only a small
    fraction of aerial imagery datasets is occupied by objects, i.e., vehicles, due
    to their small dimensions in the range of only a few pixels. For instance, images
    of PASCAL VOC 2007 are occupied by more than'
  - '[PAGE 175]


    50% with GT annotations, whereas in case of DLR 3K only about 1% of the images
    are covered by GT annotations. Therefore, the majority of the input image is no
    area of interest and is not relevant for predicting objects (see Figure 7.5).
    In case of real-world applications, this is often more distinct as the image fraction
