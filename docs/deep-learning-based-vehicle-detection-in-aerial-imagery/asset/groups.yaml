    which impedes the accurate localization of tiny objects. As deeper layers generally
    comprise features with more semantic and contextual content in comparison to shallower
    layers [Zho15, Luo16], the proposed CEM up-samples the low-dimensional feature
    maps of deep layers, i.e., conv4_3 and conv5_3, which are then combined with the
    features of conv3_3. For this purpose, a deconvolutional sub-module depicted in
    Figure 6.2 is introduced. To combine feature maps of different size, a deconvolutional
