    ### Integration of Contextual Knowledge


    Increasing the feature map resolution as required for an accurate localization
    of small objects is conducted by exploiting shallower layers as feature maps.
    However, the lack of semantic and spatial content compared to features from deep
    layers results in false alarms caused by objects with vehicle-like shapes such
    as windows or solar panels on buildings (see Figure 3.4). To overcome the lack
    of semantic and spatial content, the detection pipeline is extended by two novel
