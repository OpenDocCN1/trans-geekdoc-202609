    by the application of a CNN, i.e., VGG16, to extract highly descriptive features,
    which are classified by means of an SVM. Long et al. [Lon17] employed an ensemble
    of two CNN models, i.e., AlexNet and GoogleNet, to classify candidate regions
    extracted via Selective Search, yielding improved detection accuracy compared
    to the single models. Furthermore, the authors proposed an unsupervised bounding
    box regression algorithm to boost the localization accuracy of objects in remote
    sensing images. In [Qu17], the authors proposed the combination of BING for generating
