    其中


    $$\Delta \hat{\mathbf{W}}^t = \eta \sum_{x \in \mathcal{B}_t} \frac{\partial L_x}{\partial
    \mathbf{W}^t} \tag{2.5}$$


    为当前批次 $\mathcal{B}_t$ 上的梯度。梯度由学习率 $\eta$ 加权，该学习率指定了梯度下降中的步长。为了实现更快的收敛，通常会将前一次权重更新
    $\Delta \hat{\mathbf{W}}^{t-1}$ 的一部分 $\omega$ 添加到当前权重更新中：


    $$\mathbf{W}^{t+1} = \mathbf{W}^t + \Delta \hat{\mathbf{W}}^t + \omega \Delta
    \hat{\mathbf{W}}^{t-1}. \tag{2.6}$$


    因此，这种称为 *动量* 的方法可以克服损失函数中的平坦区域 [Dud12]。除了带动量的 SGD 外，还提出了几种动态调整学习率的替代优化方法，包括 AdaDelta
    [Zei12]、AdaGrad [Duc11]、RMSprop [Tie12] 和 Adam [Kin14]。特别是后一种优化方法，它是带动量的 SGD 与
    RMSprop 的结合，在实践中通常只需少量超参数调优即可取得良好结果。因此，避免了使用 vanilla SGD 和各种学习率调度对多个网络进行耗时训练。


    过拟合——对所用训练样本的过度适应——是训练 CNN 时的普遍问题，原因在于其参数数量庞大。解决此问题的一种常见正则化方法是 *权重衰减*，它在每次迭代中以一个很小的比例
    $\delta$ 减小权重：


    $$\mathbf{W}^{new} = (1 - \delta) \mathbf{W}^{old}. \tag{2.7}$$


    这可以防止权重变得过大，否则它们会主导网络的输出。另一种流行的防止过拟合的正则化方法是 *丢弃* [Sri14]。在训练期间，丢弃会以给定的概率停用特定层的神经元，迫使网络学习冗余的表示。因此，避免了形成专门针对训练样本的网络关键路径。


    为了避免因梯度消失或爆炸而导致的训练不稳定，网络权重的适当初始化很重要。随机初始化，例如 Xavier 初始化 [Glor10] 或 Kaiming 初始化
    [He15]，常被用于解决此问题。虽然随机初始化允许网络架构设计更灵活，但它通常会导致次优结果，尤其是在参数众多且可用训练数据有限的深层网络中。因此，实践中通常使用在大规模数据集上预训练的模型的权重进行初始化，例如包含数百万张图像的
    ImageNet 分类挑战数据集 [Deng09]。


    随着网络深度的增加，梯度信号可能变得不稳定，因此提出了 *批归一化* 以使网络中的梯度传播更稳定 [Iof15]。一般而言，批归一化在激活函数之前立即应用，通过将网络激活
    $\tilde{h}_i = W_i h_{i-1} + b_i$ 归一化为零均值和单位方差：


    $$\hat{\tilde{h}}_i = \frac{\tilde{h}_i - \mu_{\mathcal{B}}\mathbf{e}}{\sqrt{\sigma_{\mathcal{B}}^2
    + \epsilon}}$$  \tag{2.8}


    其中 $\mu_{\mathcal{B}}$ 和 $\sigma_{\mathcal{B}}^2$ 是针对当前批次 $\mathcal{B}$ 计算的均值和方差，而
    $\mathbf{e}$ 是与 $\tilde{h}_i$ 长度相同的全一向量。此外，还添加了一个很小的值 $\epsilon$ 以防止除零。为了恢复网络的表示能力，引入了一组可学习参数
    $\gamma_i$ 和 $\beta_i$，它们对归一化输入进行缩放和平移：


    $$\tilde{h}_i^{BN} = \gamma_i\hat{\tilde{h}}_i + \beta_i\mathbf{e}$$  \tag{2.9}


    由于批归一化防止激活值变得过高或过低，它允许使用更高的学习率，从而加速训练过程。


