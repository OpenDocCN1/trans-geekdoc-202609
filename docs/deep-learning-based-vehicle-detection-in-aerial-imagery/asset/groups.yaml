    ## 2.2 基于深度学习的目标检测


    目标检测旨在从图像中定位和分类大量预定义类别中的对象实例，是计算机视觉中一项基础且具有挑战性的任务。随着基于深度学习的图像分类方法的显著成功，深度学习已被广泛应用于


    该多阶段检测器的训练复杂且耗时，因为区域提议方法、用于特征提取的 CNN、SVM 分类器和边界框回归器需要分别训练和优化。然而，部署期间的主要瓶颈是特征提取，因为
    CNN 特征是针对每个候选区域单独计算的 [Gir15]。


    空间金字塔池化网络（SPPNet）[He14]通过一次性为整个输入图像计算卷积特征来克服这一瓶颈。为了满足全连接层所需的固定长度特征向量，最后一个池化层被所谓的
    *spatial pyramid pooling layer* 所取代。空间金字塔池化从共享特征图中为每个候选区域提取固定长度的特征。为此，空间金字塔池化层将对应感兴趣区域的特征划分为多级固定数量的空间
    bin。一次性对整个图像应用卷积层可在部署期间将运行时间降低数个数量级。SPPNet 的一个缺点是微调算法无法更新空间金字塔池化之前的卷积层，从而限制了非常深网络的精度
    [Gir15]。


    Fast R-CNN [Gir15]通过引入一个 *Region of Interest (RoI) pooling layer* 来解决 SPPNet 的缺点。与
    SPPNet 类似，Fast R-CNN 在区域提议之间共享卷积的计算。然而，空间金字塔池化层被 RoI 池化层取代，这使得所有网络层都可以进行微调，从而促进了非常深网络的使用。通过进行最大池化，RoI
    池化层将任何有效感兴趣区域内的特征转换为具有固定空间范围的特征图。具有固定空间范围的特征图被送入一系列全连接层，这些层分支为两个同级输出层。第一层输出对象类别的
    softmax 概率，第二层输出用于提议细化的类别特定边界框回归偏移。与采用分阶段训练的 R-CNN 和 SPPNet 不同，Fast R-CNN 简化了训练过程，因为分类和边界框回归在网络内进行训练。尽管
    Fast R-CNN 提高了检测精度并加快了检测过程，但使用外部区域提议方法仍然耗时 [Ren15]。


    Faster R-CNN [Ren15]通过集成一个名为 Region Proposal Network (RPN) 的子网络扩展了 Fast R-CNN，该网络直接在网络内生成区域提议。RPN
