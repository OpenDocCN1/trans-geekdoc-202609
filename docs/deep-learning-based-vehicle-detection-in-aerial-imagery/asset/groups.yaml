    分类阶段。通过滤除不包含任何车辆的瓦片，实际检测模块的推理时间得以减少。与以往方法不同，SAR 模块被直接集成到检测流程中。为此，SAR 模块与 Faster
    R-CNN 通过共享卷积特征在单个网络中实现。下文将详细介绍 SAR 模块及其实现细节，并进一步进行消融实验以验证所提出的 SAR 模块对推理时间的影响。


    ![](img/99de1214c29cbc525a14b293385af5cf_176_0.png)


    图 7.6：集成搜索区域缩减（SAR）模块的 Faster R-CNN 示意图，该模块用于自适应地缩减搜索区域。SAR 模块将输入图像划分为多个瓦片，并预测每个瓦片包含至少一个目标的置信度得分。由于只有可能包含至少一个目标的瓦片才会被转发到检测模块的各个组件，因此实际检测模块的推理时间得以减少。


    ### 7.2.1 搜索区域缩减模块


    所提出的搜索区域缩减方法的主要原理是将输入图像划分为小瓦片，然后将这些瓦片分类为包含至少一个目标或不包含目标的瓦片。为了在基于深度学习的检测框架中实现这一点，由三个组件组成的
    SAR 模块通过堆叠裁剪后的特征形成一个批次，然后该批次由随后的 *SAR 分类器* 处理。


    用于 SAR 分类的整个网络本质上就是默认的 VGG16 分类器，它由五组卷积层以及随后的三个全连接层和一个最终 softmax 层组成（见表 5.1）。原先为
    1000 类 ImageNet 分类训练而设置的包含 1000 个输出的最后一个全连接层，被替换为具有 2 个输出的新全连接层，用于两个类别。随后的 softmax
    层输出相应的概率分布。如上所述，所有卷积特征一次性针对整幅图像计算，并将最后一个卷积层的输出划分为多个瓦片。为了将每个瓦片分类为包含至少一个目标或不包含目标的瓦片，将全连接层序列以及称为
    SAR 分类器的 softmax 层应用于相应的特征上。需要注意的是，全连接层需要固定的输入维度。因此，裁剪后的特征尺寸为 14 × 14 × 512（宽
    × 高 × 通道），这与 VGG16 分类网络处理 224 × 224 像素输入图像时的维度一致。


    为了限制搜索区域，即由检测器组件处理的区域，在用作 RPN 特征图的 *conv3_3*¹ 的输出上应用了一个新颖的 *细分 RPN 层*。*细分 RPN
    层* 将 *conv3_3* 的输出划分为尺寸为 56 × 56 × 512 的瓦片。裁剪瓦片的偏移量设置方式使得 *细分 RPN 层* 和 *细分 SAR
    层* 所对应的输入图像区域保持一致。除了 *conv3_3* 的输出外，*细分 RPN 层* 还将 SAR 分类器的分类结果作为额外输入。基于分类得分，可能包含至少一个目标的瓦片会被传递到
    RPN，而所有其他瓦片则被滤除。需要注意的是，传递的瓦片会被堆叠成一个批次，以便 RPN 能够一次性为所有相关瓦片生成区域提议。


    ¹ 为了适配全连接层所需的通道数，在 *细分 RPN 层* 之前，对 *conv3_3* 的输出应用了一个 1 × 1 卷积层。


    原始提议层通过将预测的偏移量加到相应的参考边界框上，来计算每个区域提议的实际坐标。由于参考边界框是以瓦片坐标给出的，因此对 RPN 的提议层进行了修改，以便将区域提议映射到它们在输入图像中的位置。为此，将以细分
    RPN 层生成的位置向量作为额外输入。该位置向量对从细分 RPN 转发的每个瓦片相对于其在输入图像中的位置进行编码。然后，通过将相应瓦片的偏移量加到其在瓦片坐标中给出的位置上，来计算每个区域提议的实际坐标。所有映射后的区域提议随后被转发到分类阶段。


    ### 7.2.2 实现细节


    为了训练扩展后的 Faster R-CNN，采用了一种包含两个阶段的训练策略。需要注意的是，无法同时训练 Faster R-CNN 和 SAR 分类器，因为
    Faster R-CNN 要求每张训练图像中至少有一个 GT 目标，而 SAR 分类器则需要包含和不包含 GT 目标的图像。在第一阶段，对 Faster R-CNN
    进行 60,000 次迭代的端到端训练。为此，采用了第 5.1.3 节中描述的训练设置。然后，在第二阶段训练 SAR 分类器。为了适应作为基础架构的默认 VGG16
    分类器的输入图像尺寸，将 DLR 3K 数据集的图像分割为 224 × 224 像素的子图像。相邻子图像之间有 46 像素的重叠。这些子图像被分为两类：第一类包含所有没有任何
    GT 标注的子图像，第二类包含所有至少有一个 GT 标注的子图像。对于每个子图像，仅考虑与当前子图像重叠面积达到 10 像素或以上的 GT 标注。此外，对每个子图像执行数据增强，即水平和垂直翻转，共生成
    19,200 张训练图像，其中 4,656 张图像属于至少包含一个目标的类别。训练集的示例图像如图 7.8 所示。


    ![](img/99de1214c29cbc525a14b293385af5cf_180_0.png)


    图 7.8：用于训练 DLR 3K SAR 分类器的训练集示例图像。顶行展示的是至少包含一个目标的类别示例，底行展示的是不包含目标的类别示例。


    SAR 分类器以批次大小为 8 的设置训练 10,000 次迭代。初始学习率设置为 0.001，并在 5,000 次迭代后降低为原来的 1/10。需要注意的是，在第二个训练阶段，Faster
    R-CNN 的所有权重均保持固定。


    在部署时，将细分 SAR 层、细分 RPN 层和修改后的提议层添加到框架中，以在单个网络中执行搜索区域缩减和检测，如图 7.7 所示。对于每个瓦片，NMS
    应用于具有最高置信度得分的 400 个区域提议上。NMS 后排名前 80 的提议随后被转发到分类阶段。由于输入图像被划分为 25 个瓦片，NMS 之前和之后的最大提议数分别为
    10,000 和 2,000，这与没有 SAR 模块的 Faster R-CNN 的数量一致（见第 5.1.3 节）。其他设置与没有 SAR 模块的 Faster
    R-CNN 所使用的设置类似。


    ### 7.2.3 消融实验


    为了考虑具有不同车辆分布的区域类别，在 DLR 3K 数据集和 VEDAI LCI 数据集上评估了所提出的 SAR 模块对推理时间的影响，因为推理时间的加速取决于被滤除的图像区域数量。在
    DLR 3K 测试集中，36.4% 的图像瓦片包含至少一个目标，因为 DLR 3K 主要包含城市和居民区，交通流量较高。相比之下，VEDAI 包含更多的乡村和自然区域，交通流量较低，因此
    VEDAI 测试集中只有 8.2% 的图像瓦片包含至少一个目标。


    表 7.16：Faster R-CNN 在 DLR 3K 数据集上使用和不使用 SAR 的推理时间比较。通过应用 SAR 模块，整体推理时间，尤其是 RPN
    和分类阶段的推理时间得以减少。


    | 方法 | 组件 | 服务器时间（毫秒） | 台式机时间（毫秒） |

    |---|---|---|---|

    | Faster R-CNN | 特征提取器 | 58.9 | 177.4 |

