    ## 2.3.2 Deep Learning based Vehicle Detection Methods


    In recent years, conventional methods have been largely replaced by deep learning
    based methods for the task of vehicle detection in aerial imagery due to the limited
    representation capacity of handcrafted features. The first deep learning based
    approaches for vehicle detection in aerial imagery employed CNNs as feature extractor
    and partially as classifier within a sliding window algorithm. Chen et al. [Che13]
    explored a small CNN comprised of three convolutional layers with subsequent max
    pooling layers followed by one fully connected layer for feature extraction and
    classification within a sliding window algorithm. The proposed CNN achieved superior
    results compared to conventional methods based on handcrafted features, i.e.,
    HOG+SVM and LBP+SVM, on satellite images collected from Google Earth. In [Che14a],
    the authors modified the CNN architecture proposed in [Che13] by dividing the
    outputs of the last convolutional layer into multiple blocks of variable receptive
    fields to allow the extraction of variably scaled features, which further improved
    the detection accuracy on the same set of satellite images collected from Google
    Earth. To reduce the computational effort of the detection pipeline, several authors
    adopted region proposal techniques for vehicle detection in aerial imagery, yielding
    a smaller set of candidate regions to classify. By applying Binary Normed Gradients
    (BING) [Che14c] to extract region proposals instead of the exhaustive sliding
    window paradigm conducted in [Che13, Che14a], Qu et al. [Qu16] achieved a clearly
    reduced inference time without drop in detection accuracy. Zhu et al. [Zhu15]
    adopted the R-CNN detection pipeline for vehicle detection in aerial images. Selective
    Search [Uij13] - a hierarchical segmentation-based region proposal method - is
    applied to generate a set of candidate regions. For each candidate region, CNN
    features are computed by using AlexNet, which are then classified by means of
    an SVM. Cheng et al. [Che16b] exhibited improved detection results compared to
    [Zhu15] by introducing a new objective function to train the AlexNet model used
    for feature extraction. To achieve enhanced rotation invariance against the varying
    orientations of objects in aerial imagery recorded in top view, the new objective
    function enforces the training samples to share similar features before and after
    rotating via a regularization term. In [Jia15], the authors proposed the combination
    of an efficient graph-based superpixel segmentation method [Fel04] to generate
    candidate regions and a CNN to classify each candidate into vehicle or non-vehicle.
    Ammour et al. [Amm17] conducted car detection in UAV imagery in three stages:
