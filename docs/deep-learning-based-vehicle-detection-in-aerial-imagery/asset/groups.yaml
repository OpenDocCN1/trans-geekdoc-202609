    # Impact of Modified RPN


    So far, only the classification head, i.e., layers of the classification stage,
    has been modified to speed up the inference time without loss in detection accuracy.
    Modifying the prediction layers of the RPN further reduces the inference time
    as shown in Table 7.15. For this purpose, the initial 3 × 3 convolutional layer
    comprising 512 channels is removed, so that the RPN is only composed of two sibling
    1 × 1 convolutional layers. Thus, the structure of the RPN is equivalent to the
    prediction layers of the SSD detector, which is in essence a class-specific RPN.
    The modified RPN decreases the time spent for generating candidate regions and
    consequently, the overall inference time. The speed-up is more distinctive in
    case of the unpruned network due to the higher number of input channels for the
    RPN. The AP remains almost unchanged, which confirms the results achieved for
    SSD with different classification heads, namely, that 1 × 1 convolutions are adequate
    as prediction layers for vehicle detection in aerial imagery.'
