    led to improved detection results in aerial imagery. While making use of padded
    GT boxes has been proposed to automatically learn the context of vehicles in aerial
    imagery [Sak17], adding more context information by increasing the receptive field
    via dilated convolution has been recently applied for object detection in aerial
    imagery such as building detection [Ham18] and vehicle detection [Din18]. Inspired
