    通过使用原始VGG16作为Faster R-CNN的特征提取器，在PASCAL VOC上取得了顶级性能，表明其非常适合基准数据集[Ren15]。由于空间池化，用作特征图的最后一个卷积层输出的尺寸仅为输入图像的1/16（见表5.1），如图5.4所示，这足以在基准数据集中准确定位物体。为此，以PASCAL
