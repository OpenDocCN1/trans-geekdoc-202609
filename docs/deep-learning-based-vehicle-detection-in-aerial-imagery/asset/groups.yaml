    # 7.2.1 Search Area Reduction Module


    The main principle of the proposed approach to reduce the search area is the division
    of the input image into small tiles that are then classified into tiles containing
    at least one object or none. To realize this within a deep learning based detection
    framework, a SAR module comprised of three components is'
