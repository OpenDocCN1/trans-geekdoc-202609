    # 5.1.2 Classification Stage


    The functional principle of the classification stage, which is in essence the
    Fast R-CNN detector [Gir15], is illustrated in Figure 5.3. The classification
    stage takes a pre-defined number of candidate regions, i.e., region proposals
    with the highest confidence scores, as input. Each candidate region denoted as
    region of interest (RoI) is projected onto the same feature map as used for the
    RPN. By conducting max pooling, the RoI pooling layer converts the corresponding
    features inside the respective candidate region into a feature map with fixed
    spatial extent. The feature map is then fed into a sequence of fully connected
    layers branching into two sibling fully connected layers: one for classification
    and one for bounding box regression similar to the RPN. The $cls$ layer outputs
    $c+1$ confidence scores for the $c$ classes and the background class, while the
    $reg$ layer outputs $4c$ values for each class, which encode offsets to the respective
    candidate region. The applied sub-network is also referred to as classification
    head.


