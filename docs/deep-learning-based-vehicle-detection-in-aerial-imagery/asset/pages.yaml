  md: '# 7 Runtime Optimization


    Detecting relevant objects in real-time or nearly in real-time is of great importance
    across a broad range of applications. In general, deep learning based object detectors,
    such as Faster R-CNN, are employed for most applications due to their superior
    detection accuracy compared to conventional counterparts. However, applying Faster
    R-CNN as object detector is not appropriate for a multitude of applications due
    to its poor inference time, which is in the context of this thesis further impaired
    by adapting Faster R-CNN to the characteristics of aerial imagery (see Section
    5.2.4). Regarding the inference time for the feature extraction, region proposal
    generation, and classification stage separately exposes that each component notably
    contributes to the overall inference time and thus, is often not directly practicable
    within the detection pipeline. To allow the use of Faster R-CNN for different
    applications depending on vehicle detection in aerial imagery, acceleration of
    each component is required.


    In the remainder of this chapter, two approaches addressing the optimization of
    the inference time are presented and discussed in detail. The first approach introduced
    in Section 7.1 aims at reducing the computational costs for the feature extraction
    by replacing the default CNN architecture with a more computational efficient
    CNN architecture. To minimize the computational effort of both the region proposal
    generation and classification stage, the second approach introduced in Section
    7.2 restricts the detection area by a novel Search Area Reduction module. Hence,
    the number of feature map locations used for region proposal generation is reduced
    and fewer region proposals need to be classified. The presented approaches in
    this chapter are mainly based on two of the author’s publications [Rin19, Som18a].'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 7.1 Lightweight Feature Extraction


    In the past, most research on CNN architectures has primarily focused on improving
    the accuracy, yielding deeper and more complex network architectures often unpractical
    for real-world applications due to their model size and inference time. With the
    increasing demand for online processing on mobile platforms with limited resources,
    novel CNN architectures aiming at reducing the number of parameters and computational
    operations have recently been proposed. Replacing the default CNN architectures
    used as base network with these computation-efficient architectures bears the
    potential to reduce the inference time of deep learning based detection frameworks,
    as feature extraction is one of the most time-consuming parts of these frameworks.


    In this thesis, the applicability of such lightweight architectures is examined
    exemplarily for SSD, which allows a straightforward exchange of the CNN architecture.
    For this purpose, four promising architectures are adapted as base network for
    the task of vehicle detection in aerial imagery. In the following, the functional
    principle of SSD and the structures of the employed CNN architectures are introduced.
    Furthermore, auxiliary techniques for runtime optimization applied in this thesis
    are described followed by experiments and discussion of the results. The most
    promising architectures are then adopted for Faster R-CNN.


    # 7.1.1 Single Shot MultiBox Detector


    As described in Section 2.2, SSD is a fully convolutional network whose functional
    principle is similar to the RPN in Faster R-CNN (see Figure 7.1). In contrast
    to the class-agnostic RPN introduced in Section 5.1.1, SSD predicts a fixed number
    of bounding boxes and confidence scores for each object category. For this, (c
    + 4)k convolutional filters with kernel size 3 × 3 referred to as classification
    head are applied at each feature map location to predict four bounding box offsets
    relative to the anchor boxes termed default boxes and c confidence scores, where
    c is the number of object classes including the'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'background class and k is the number of anchor boxes. By default, the output
    of multiple convolutional layers is used as feature map to account for various
    object scales.


    ![](img/99de1214c29cbc525a14b293385af5cf_150_0.png)


    Figure 7.1: Schematic structure of SSD.


    For training, the objective loss is equivalent to the multi-task loss of the RPN
    given in eq. (5.1). The classification loss is the softmax loss over multiple
    class confidences, while smooth L1 loss is used as regression loss. Note that
    in case of vehicle detection with only one category, the classification loss is
    equivalent to the two-class softmax of the RPN. Regression to the anchor boxes
    is performed analogously to the RPN by using eq. (5.5).


    In the context of this thesis, only a single feature map is exploited as the examined
    aerial imagery datasets comprise images with a homogenous GSD and thus, the vehicle
    dimensions exhibit only small variations. As observed in [Rin19], using multiple
    layers may even yield a worse detection accuracy. Moreover, truncating all layers
    after the exploited feature map also reduces the computational costs. To further
    account for the characteristics of the aerial imagery, the anchor box scales are
    adopted according to the vehicle size distribution, i.e., the anchor box scale
    is set to 28 pixels and the aspect ratios are set to 1:1, 1:2 and 2:1.


    In the following, VGG16, which is used by default, is employed as base network
    for the SSD detector baseline. VGG16 pre-trained on ImageNet is used to initialize
    the weights. The baseline model is trained for 20,000 iterations'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'using the SGD optimizer with a batch size of 32 and an initial learning rate
    of 0.0001. All other hyper-parameters remain unchanged from the original settings¹.
    During deployment, the 2500 predictions with the highest confidence score are
    considered for NMS. The top-200 predictions after NMS are used as final detections.


    # 7.1.2 Computation-Efficient CNN Architectures


    Several computation-efficient CNN architectures have recently been proposed, achieving
    comparable accuracies compared to conventional CNN architectures, while the inference
    time is considerably reduced. In the following, the most promising of these architectures
    that are examined in this thesis are presented and adaptations for the usage as
    base network within a deep learning based vehicle detector are described.


    # MobileNet


    MobileNet [How17] is a recently proposed network architecture specially developed
    for mobile and embedded vision applications. Instead of standard 3 × 3 convolutions,
    depthwise separable convolutions (see Figure 2.11) are used as main building block.
    Due to the factorization of a standard 3 × 3 convolution into a 3 × 3 depthwise
    convolution followed by a 1 × 1 pointwise convolution, the computational costs
    and the number of parameters are considerably reduced compared to the standard
    3 × 3 convolution. Except for an initial 3 × 3 convolution and the final fully
    connected layer used for classification, MobileNet only comprises stacked DSCs
    as depicted in Table 7.1. Strided convolutions are used for down-sampling instead
    of pooling, which provides a cheap way to decrease the input size. All convolutional
    layers are followed by batch normalization and ReLU nonlinearity to stabilize
    and speed up the training.


    ¹ https://github.com/weiliu89/caffe/tree/ssd'
