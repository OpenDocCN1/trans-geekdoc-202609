    parameters can rise significantly with an increasing number of neurons in the
    network due to the pairwise connection between neurons of adjacent layers.


    # 2.1.2 Convolutional Neural Networks


    CNNs are a specialized kind of neural network designed for processing high-dimensional
    data with a known grid-like topology, e.g., images or video frames. Typical CNNs
    consist of three basic types of layers: convolutional layers, pooling layers and
    fully connected layers [LeC98]. To reduce the number of parameters and consequently
    the complexity of a neural network, convolutional layers make use of two basic
    ideas illustrated in Figure 2.3. Instead of connecting every neuron with all neurons
    of the previous layer, neurons are only connected to neurons of the previous layer
    within a fixed local neighborhood. Thus, the weight matrix becomes sparse. Furthermore,
    the weights are shared for all neurons within a layer and thus, become independent
    of the position of the neuron.


    ![](img/99de1214c29cbc525a14b293385af5cf_31_0.png)


    Figure 2.3: Transition from a fully connected layer to a 1D convolutional layer
    and the respective weight matrix.


    In general, convolutional layers consist of a set of learnable filters, also called
    channels, as single convolutional filters do not capture sufficient information'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'from the previous layer. The set of filters is characterized by its kernel
    size defining the corresponding local neighborhood, which is often referred to
    as *receptive field*. The weights are not shared between filters, so that each
    filter is free to learn a different convolutional operation. The output of a convolutional
    layer is often referred to as a *feature map* due to its spatial nature. It spans
    across the spatial dimensions and contains a feature vector at each location,
    whose dimension is equal to the number of filters $C$ in the layer. Note that
    in case of multiple input channels $D$, each filter is comprised of $D$ kernels
    with size $k \times k$. Every kernel is shifted across the respective input channel
    and the resulting outputs are summed together via element-wise addition, yielding
    a single output channel per filter as illustrated in Figure 2.4. The size of the
    feature map is affected by stride and padding. The stride parameter specifies
    the distance between two spatial locations, where filter kernels are applied,
    while zero padding can be used in order to apply filter kernels at the edges of
    the input.


    ![](img/99de1214c29cbc525a14b293385af5cf_32_0.png)


    **Figure 2.4:** Schematic illustration of a convolution with $C$ filters comprised
    of $D$ kernels with size $3 \times 3$. For each filter, every kernel is shifted
    across the respective input channel and the resulting outputs are summed together
    via element-wise addition yielding a single output channel per filter.


    To approximate complex decision functions, nonlinearities are introduced to a
    CNN by applying an activation function element-wise to the output of convolutional
    layers. In practice, ReLU is usually preferred to sigmoidal functions like sigmoid
    and hyperbolic tangent as activation function [LeC15].'
  merge: -1
