  md: '# 1 Introduction


    # 1.1 Motivation


    Recording of images or videos with sensors mounted on satellites or airborne platforms,
    e.g., helicopters, unmanned aerial vehicles (UAVs) etc., afford the coverage of
    large areas and the capturing of multiple objects and their interactions by a
    single sensor. Thus, a central limitation of stationary camera networks near ground
    is overcome. Owing to the increasing technological advancements taking place across
    imaging systems and airborne platforms and the accompanying decreasing costs,
    the fields for applications employing aerial imagery, also referred to as remote
    sensing imagery, are growing rapidly [Res17]. While the global aerial imaging
    market accounted for US $1.56 billion in 2017, it is expected to reach US $6.24
    billion by 2026 [Res18]. Amongst others, common applications expected to witness
    significant market growth include search and rescue tasks [Rud08, Goo09, Qi16],
    disaster relief [Ada11, Eze14, Erd16], traffic monitoring [Ang03, Len08, Kan15]
    and surveillance and reconnaissance tasks [Gir04, Hei10, Rei10]. Illustrative
    examples underlining the utility of aerial imagery for such applications are given
    in Figure 1.1.


    Due to large search areas with often restricted accessibility such as mountains
    or open seas, helicopters or UAVs equipped with specialized camera sensors, e.g.,
    thermal infrared (IR), are often used to assist in the recovery of missing or
    injured humans and to assist in the manhunt and apprehension of suspected criminals
    or fugitives. Studies comparing the effectiveness of airborne assets and ground
    search teams in terms of success rate and localization time substantiate their
    benefits for search and rescue tasks [Ham17, Eye18]. It has been shown that the
    support of human operators by automated algorithms is'
  merge: -1
  img_proc: true
