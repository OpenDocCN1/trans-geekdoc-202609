- pgno: 133
  md: '# 6.2.3  Joint Semantic Labeling and Detection


    Though the semantic labeling based filtering strategy demonstrates the utility
    of semantic labeling for vehicle detection in aerial imagery, the inference time
    doubles due to the application of two separate networks: one for detection and
    one for semantic labeling. To overcome this drawback, an alternative strategy
    is proposed that incorporates semantic labeling into the detection framework by
    merging both networks. Thus, semantic labeling directly induces scene knowledge
    into the feature maps used within the detection framework instead of filtering
    out region proposals or detections, respectively. In the following, two different
    variations to induce scene knowledge are introduced and the effect of the detection
    performance is discussed.


    # Implicit Multi-Task Faster R-CNN


    The first variant, which is in the following referred to as Implicit Multi-Task
    (IMT) Faster R-CNN, is depicted in Figure 6.13. The proposed architecture comprises
    two branches: one for detection (top branch) and one for semantic labeling (bottom
    branch). The detection branch includes the RPN and the classification stage, while
    FCN-D16 is exemplarily employed for the semantic labeling branch. Note that the
    semantic labeling network can be replaced by the alternative architectures described
    in Section 6.2.1. Both branches are merged by sharing the first four sequences
    of convolutional layers. The prerequisite for this is that both branches are based
    on the same base architecture, i.e., VGG16. This allows the network to learn a
    shared global feature map, i.e., conv4_3, through which the semantic labeling
    branch implicitly affects the detection branch. As the semantic labeling branch
    is only required for training, it can be discarded during deployment.


    To allow end-to-end training of both tasks, a joint multi-task loss $L_{MT}$ comprised
    of five losses is proposed:


    $$L_{MT} = \lambda_1L_{SL} + \lambda_2L_{RPN,cls} + \lambda_3L_{RPN,reg} + \lambda_4L_{CLS,cls}
    + \lambda_5L_{CLS,reg}. \tag{6.2}$$'
  merge: -1
  img_proc: true
