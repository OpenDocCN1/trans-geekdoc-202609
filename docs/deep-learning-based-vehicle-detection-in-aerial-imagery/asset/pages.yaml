  md: 'information, the use of dilated convolutions increases the receptive field
    and thus, yielding more contextual information. Analogous to FCN-32s, a 1 × 1
    convolutional layer with 6 channels is appended to predict scores for each category
    at each of the coarse feature map locations and a single deconvolutional layer
    is then applied to achieve pixel-wise predictions for the input image.


    # SegNet


    ![](img/99de1214c29cbc525a14b293385af5cf_122_0.png)


    Figure 6.7: Schematic structure of SegNet, which is comprised of an encoder and
    decoder network. The topology of the encoder is identical to the convolutional
    part of VGG16, while the topology of the decoder is in essence the mirrored encoder.
    Non-linear up-sampling is performed by using max pooling indices that encode the
    positions where to map the values of the preceding feature map as shown in Figure
    6.8.


    Badrinarayanan et al. [Bad17] proposed an encoder-decoder architecture for semantic
    labeling called SegNet, which showed promising semantic labeling results on benchmark
    datasets. As depicted in Figure 6.7, SegNet is composed of an encoder and a decoder
    network. The architecture of the encoder is topologically identical to the convolutional
    part of the VGG16 architecture, while the topology of the decoder is in essence
    the mirrored encoder. Note that the number of channels for the last convolutional
    layer is set to 6 in order to provide pixel-wise predictions for each category.
    Instead of applying deconvolutional layers to up-sample low resolution feature
    maps, the decoder uses max pooling indices to perform non-linear up-sampling.
    For this, the pooling indices, which indicate the positions with maximum values
    within the region'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'defined by the pooling size, are stored for each max pooling step of the corresponding
    encoder. Up-sampling is then performed by mapping the values of the particular
    feature map to the stored positions as shown in Figure 6.8, while the remaining
    pixels are filled with zeros. In this manner, the need for learned up-sampling
    is eliminated. Per-pixel softmax loss is used to train the semantic labeling network
    according to FCN-32s and its extensions.


    ![](img/99de1214c29cbc525a14b293385af5cf_123_0.png)


    Figure 6.8: Illustration of the non-linear up-sampling conducted in SegNet. The
    positions with maximum values within the region defined by the pooling size are
    stored for each max pooling step in pooling indices, which are used to map the
    values of the preceding feature map to the stored positions. The remaining pixels
    are filled with zeros.


    # Ablation Experiments


    In the following, the differing semantic labeling architectures are evaluated
    on the Potsdam dataset introduced in Section 4.1 to assess the potential of each
    architecture for integration into the Faster R-CNN detection framework. For training,
    the original image patches are cropped into tiles of size 256 × 256 pixels with
    an overlap of 50%. In addition, data augmentation is performed through applying
    vertical and horizontal flipping as well as rotation in steps of 90 degrees, so
    that the number of training samples is increased by a factor of 8. At test time,
    image tiles of size 512 × 512 pixels with 50% overlap between tiles are used.
    For each tile, the central 384 × 384 pixels are selected for the final semantic
    labeling mask, which exhibited slightly better performance in preliminary experiments
    compared to averaging the overlapping regions. The performed stitching strategy
    further reduces artefacts at image borders and stitching borders, respectively.
    Each model is trained for 100,000 iterations'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'with a batch size of 6 using the Adam solver with an initial learning rate
    of 1e-8. Stage-wise training as proposed in [Lon15] is conducted to train FCN-16s.
    Thus, weights of FCN-32s pre-trained on the Potsdam dataset are used for initialization.
    Otherwise, weights pre-trained on ImageNet are used for initialization.


    The semantic labeling results for the different architectures are given in Table
    6.3. For this, F1-score computed for each class and overall accuracy are used
    as evaluation metrics following the 2D Semantic Labeling Contest protocol (see
    Section 4.2). All architectures achieve an overall accuracy around 88%, which
    is clearly higher compared to the baseline results solely on RGB imagery reported
    in [She16]. In particular, the F1-score achieved for category car is considerably
    improved. SegNet, FCN-16s and FCN-D16 even outperform the baseline results, which
    additionally rely on IR and DSM information. High F1-scores are achieved for each
    category except for the category clutter. A reason for the by far lowest accuracy
    is the large variance of objects and concepts aggregated in this category, ranging
    from water areas through tennis courts to small structures such as outdoor furniture.
    Compared to the F1-scores achieved for the categories impervious surface and building,
    the categories low vegetation and tree exhibit slightly lower F1-scores. These
    lower F1-scores are mainly due to confusion between both categories, as even the
    borders between both categories are often not unambiguous. While SegNet achieves
    overall the highest accuracy slightly outperforming FCN-16s and FCN-D16, FCN-32s
    exhibits the lowest overall accuracy and F1-scores for each category especially
    for category car, whose instances possess the smallest dimensions. This indicates
    the importance of adding features of shallower layers or maintaining finer feature
    maps by applying dilated convolutions to accurately label small instances.


    Qualitative examples depicted in Figure 6.9 emphasize the good semantic labeling
    results of the examined architectures. In particular, the high accuracy for the
    categories car, impervious surface and building is notable, which is essential
    for the application within a detection framework aiming at suppressing false alarms
    often caused by vehicle-like structures on buildings. On the other hand, the comparably
    poor accuracy in case of category clutter is apparent'
