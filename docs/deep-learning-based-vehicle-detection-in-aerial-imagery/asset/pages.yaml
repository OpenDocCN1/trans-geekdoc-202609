    | EMT-MFD Faster R-CNN | 96.3 | 94.1 | 90.4 |


    Table 8.1 reports the detection accuracy of the merged MFD Faster R-CNN and EMT
    Faster R-CNN for various GSDs. Compared to its plain counterparts and Faster R-CNN,
    the detection accuracy is improved for all GSDs. Note that the AP for MFD Faster
    R-CNN is higher in comparison with the AP reported in Table 6.1 due to the performed
    data augmentation. While the gain in AP is minor for a GSD of 13 cm, the improvement
    becomes more notable with higher GSDs. For a GSD of 26 cm, MFD Faster R-CNN and
    EMT Faster R-CNN are outperformed by 1.9% and 1.5% in AP, respectively. This shows
    that inducing scene knowledge via semantic labeling yields more distinctive feature
    representations in deep layers as expected. Furthermore, it indicates that combining
    features from different layers via the CEM and the use of the resulting feature
    map for both stages are beneficial towards the simple integration of features
    from deep layers for classification via RoI pooling as carried out in EMT Faster
    R-CNN.


    # Integration of Semantic Context and Lightweight Feature Extraction


    The effect of combining the integration of semantic context and the lightweight
    feature extraction is examined by replacing the default base network of EMT Faster
    R-CNN, i.e., VGG16, with the computation-efficient ZynqNet architecture. The outputs
    of the 7th and 9th Fire module are considered as auxiliary feature maps for the
    classification stage to explicitly'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'integrate features from the semantic labeling branch. Additional RoI pooling
    layers are applied to extract the corresponding features for each candidate region,
    which are fused with the respective output of the RoI pooling layer of the detection
    branch via element-wise addition as described in Section 6.2.4. VGG0.5-Head is
    employed as classification head, as it exhibits the best trade-off between detection
    accuracy and inference time (see Table 7.11). Joint multi-task loss L_MT (see
    eq. (6.2)) and the settings specified in Section 7.1.5 are adopted for the training.


    Table 8.2: Comparison of the detection accuracy and inference time for EMT Faster
    R-CNN with different base networks.


    | Base Network | AP (in %) | Time (in ms) Server | Time (in ms) Desktop |

    |---|---|---|---|

    | VGG16 | **96.2** | 317.2 | 824.5 |

    | ZynqNet_α=1.00 | 96.0 | 172.5 | 264.2 |

    | ZynqNet_α=0.75 | 95.1 | 156.0 | 225.6 |

    | ZynqNet_α=0.50 | 94.1 | **149.8** | **187.6** |


    The AP and inference times for EMT Faster R-CNN with ZynqNet_α=1.00 as base network
    are given in Table 8.2. In comparison to EMT Faster R-CNN with VGG16, the inference
    time is reduced by 46% and 68% for the server and desktop setup, respectively,
    while the detection accuracy only marginally decreases. This demonstrates that
    even lightweight architectures are suited as base network for EMT Faster R-CNN
    and thus, allow improved detection accuracy by integration of semantic context
    with clearly decreased inference time compared to the original Faster R-CNN. Removing
    filters from the base network following the pruning strategy introduced in Section
    7.1.3 further boosts the inference speed. However, the detection accuracy clearly
    drops with fewer filters per convolutional layer. Table 8.3 illustrates the applicability
    of EMT Faster R-CNN with ZynqNet_α=1.00 for higher GSDs. Though the gap in AP
    compared to its counterpart using VGG16 as base network increases with higher
    GSD, the AP is still high for a GSD of 26 cm.'
