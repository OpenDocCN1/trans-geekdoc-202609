- pgno: 206
  md: '# 8.3 Generalization to Unseen Aerial Imagery


    In the following, the generalization ability of the proposed detection method
    is demonstrated by auxiliary experiments on three recently published aerial imagery
    datasets, i.e., ITCVD, DOTA and xView (see Section 4.1). Note that models pre-trained
    on DLR 3K are employed for all experiments.


    # ITCVD


    Amongst the three datasets mentioned above, ITCVD is most similar to DLR 3K in
    terms of image quality and content. Both datasets are acquired over Western European
    cities and thus, mainly comprise urban and residential areas with comparable structures
    and objects. Figure 8.7 shows qualitative detection results (red boxes) and corresponding
    GT (green boxes) for EMT-MFD Faster R-CNN with VGG16 and EMT-MFD Faster R-CNN
    with ZynqNet on images from the ITCVD test set, whereby images taken in oblique
    view with a tilt angle of 45 degrees are not considered. During deployment, the
    test images are down-scaled by a factor of 1.3, so that the GSD is similar to
    DLR 3K. The proposed methods achieve a good classification and localization accuracy
    even in case of a weak contrast between vehicle and background. Note that even
    multiple vehicles are correctly detected, which are missed during the annotation
    process especially in backyards and entrance areas. Hence, the proposed methods
    are well transferable to unseen data that comprise similar characteristics compared
    to the employed training data, i.e., the DLR 3K dataset. As depicted in Figure
    8.8, EMT-MFD Faster R-CNN with VGG16 and ZynqNet, respectively, exhibit considerably
    fewer false alarms caused by vehicle-like structures on buildings compared to
    Faster R-CNN with VGG16 taken as baseline. Though ITCVD comprises strong parallax
    effects due to the low acquisition altitude, the proposed methods are robust to
    false alarms caused by the accompanying disturbing structures that are hardly
    or non-existent in the training data. However, remaining false positive detections
    are caused by vehicle-like structures on asphalted areas, whereas missed detections
    are mainly due to partial occlusion, e.g., by trees, or due to vehicles located
    in shadowed areas (see Figure 8.9), which is similar to observations on DLR 3K.'
  merge: -1
