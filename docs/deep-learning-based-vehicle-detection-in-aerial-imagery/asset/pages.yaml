    while obtaining superior results for several tasks across multiple domains [Kri12,
    Maa13, Glo11]. The ReLU function is defined as


    φ(x) = max(0,x). (2.3)


    It removes negative values from a feature map by setting them to zero as illustrated
    in Figure 2.5.


    ![](img/99de1214c29cbc525a14b293385af5cf_33_0.png)


    Figure 2.5: Representation of the ReLU functionality and its transfer function.


    Pooling layers are inserted periodically after convolutional layers to reduce
    the spatial size of a feature map and consequently the amount of parameters. This
    leads to improved computational efficiency, while the invariance to small translations
    of the input is increased [Sch10]. The pooling operation is defined by its filter
    size, stride and pooling function. The pooling operation is performed independently
    on each input channel. Common pooling operations are max pooling with a filter
    size of 2 × 2 or 3 × 3 and a stride of two. Max pooling returns the maximum output
    within the receptive field defined by the filter size as illustrated in Figure
    2.6. Less commonly applied pooling functions are average pooling and ℓ₂-norm pooling
    as max pooling has been proven to work better in practice [Sch10]. Note that applying
    convolutions with stride larger than 1 is an alternative strategy to reduce the
    spatial size of the feature representation [Spr14].


    Fully connected layers that connect each neuron to all neurons of the previous
    layer like in an MLP are generally used as the last few layers in a CNN. The'
