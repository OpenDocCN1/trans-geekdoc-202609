  md: '# 5 Base Framework


    In this chapter, the functional principle of the utilized base framework, i.e.,
    Faster R-CNN, is introduced. For this, the main detector components and the implementation
    details are extensively described. Furthermore, adaptations in order to account
    for the characteristics of aerial imagery are proposed and systematically examined
    to identify concomitant issues.


    # 5.1 Faster R-CNN


    Faster R-CNN is chosen as base framework for the detection pipeline proposed in
    this thesis, because of its superior detection accuracy compared to other deep
    learning based detectors, in particular for small object instances. The capability
    of accurately detecting small object instances is even more essential in case
    of aerial imagery, which typically comprises objects in the range of a few pixels
    due to its low spatial resolution as introduced in Section 4.1. The functional
    principle of Faster R-CNN, which mainly comprises two modules, is schematically
    depicted in Figure 5.1. The first module termed RPN generates a set of candidate
    regions, which is forwarded to a subsequent module denoted as classification stage.
    The two modules are merged into a single network by sharing a sequence of convolutional
    layers termed feature extractor. Fundamental basics of both modules as well as
    implementation details are introduced in the following.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/99de1214c29cbc525a14b293385af5cf_81_0.png)


    Figure 5.1: Functional principle of the Faster R-CNN, which conducts object detection
    in two stages: an initial stage that generates a set of candidate regions termed
    RPN and a subsequent classification stage. Both stages share a sequence of convolutional
    layers and employ the output of the last convolutional layer as feature map (highlighted
    in dark blue).


    # 5.1.1 Region Proposal Network


    The Region Proposal Network is a deep learning based object proposal method whose
    functional principle is depicted in Figure 5.2. Purpose of the RPN is the localization
    of candidate regions that are likely to contain an object. To this end, the RPN
    comprises a small network, which is shifted in sliding window manner across the
    output of the last shared convolutional layer used as feature map. The small network
    is comprised of a 3 × 3 convolutional layer followed by two sibling fully connected
    layers: one for bounding box regression (reg layer) and one for classification
    (cls layer). In practice, the fully connected layers are implemented with two
    sibling 1 × 1 convolutional layers.


    To conduct bounding box regression, anchor boxes centered at each sliding window
    location, i.e., feature map location, are utilized as reference boxes. In order
    to account for various object scales, anchor boxes with different aspect ratios
    and sizes are employed, yielding k anchor boxes per sliding window location. Thus,
    the reg layer has 4k outputs encoding offsets for each anchor box used to predict
    the coordinates for the respective candidate region, while the cls layer outputs
    2k confidence scores about the presence of an object.'
  merge: -1
  img_proc: true
