    detail in Section 2.1.2.


    ![](img/99de1214c29cbc525a14b293385af5cf_30_0.png)


    Figure 2.2: Multilayer Perceptron with two input neurons, two hidden layers with
    three neurons each, and a single output neuron.


    While a single perceptron is limited in its ability to approximate decision functions,
    multiple perceptrons can be combined in a directed acyclic graph, as illustrated
    in Figure 2.2, in order to allow an accurate approximation of complex decision
    functions. Within this so-called Multilayer Perceptron (MLP), sets of perceptrons
    denoted as neurons are arranged into three types of layers: an input layer, one
    or more hidden layers and an output layer. Each neuron of a particular layer i
    is connected to the outputs of all neurons in the previous layer i − 1. Thus,
    these layers are often referred to as fully connected layers. The output of the
    i-th fully connected layer is given by


    h_i = φ(W_i h_{i-1} + b_i) (2.2)


    with h₀ = x being the input, e.g., image or feature vector, and h_n = y being
    the output of an n-layer MLP. W_i = [w_{i1},..., w_{im}]^T is the layer''s weight
    matrix composed of the weight vectors of its m neurons and b_i = [b_{i1},...,
    b_{im}]^T is the layer''s bias vector. Together, all weight matrices and bias
    vectors are'
