    is examined with respect to the object dimensions. Exploiting higher feature map
    resolutions shows an improved AP for all GSDs as depicted in Table 5.5. Note that
    for each GSD, the employed anchor box areas are equivalent to the mean object
    dimensions (see Table 5.6). Using the output of conv3_3'
  merge: -1
