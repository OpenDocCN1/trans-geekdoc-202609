- pgno: 113
  md: '# 6.1 Spatial Context


    Exploiting shallower layers as feature map for Faster R-CNN is crucial for vehicle
    detection in aerial imagery, as the resolution of deeper layers is often not sufficient
    to accurately localize tiny objects. To overcome the lack of semantic and contextual
    content resulting in false alarms, an extension to the original Faster R-CNN architecture
    called Multi Feature Deconvolutional (MFD) Faster R-CNN is proposed in the context
    of this thesis. The schematic structure of the MFD Faster R-CNN is illustrated
    in Figure 6.1. Inspired by semantic labeling networks aiming at the prediction
    of fine and coarse structures, features from various layers (indicated by different
    blue tones) offering different semantic and contextual information are combined.
    For this purpose, a context enhancement module (CEM) highlighted in green is introduced
    to allow the combination of these features, while the feature map resolution is
    kept sufficiently high to localize tiny objects. In the following, the CEM and
    the implementation details are presented followed by experiments and discussion
    of the results to highlight the enhanced detection accuracy.


    ![](img/99de1214c29cbc525a14b293385af5cf_113_0.png)


    Figure 6.1: Schematic structure of the proposed Multi Feature Deconvolutional
    Faster R-CNN, which extends the original Faster R-CNN by a CEM to combine features
    of shallow and deep layers, while the resolution of the feature map is kept sufficient
    to localize tiny objects.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 6.1.1 Context Enhancement Module


    The main purpose of the context enhancement module is to create a high-resolution
    feature map appropriate for the localization of tiny objects, which comprises
    rich sematic features from deep layers. As shown in Section 5.2.1, using the output
    of conv3_3 as feature map yields better detection performance compared to conv4_3
    and conv5_3 though the corresponding features possess less semantic and contextual
    information. Essential for this is the coarse feature map resolution in case of
    conv4_3 and conv5_3, i.e., 1/8 and 1/16 of the input image dimensions, which impedes
    the accurate localization of tiny objects. As deeper layers generally comprise
    features with more semantic and contextual content in comparison to shallower
    layers [Zho15, Luo16], the proposed CEM up-samples the low-dimensional feature
    maps of deep layers, i.e., conv4_3 and conv5_3, which are then combined with the
    features of conv3_3. For this purpose, a deconvolutional sub-module depicted in
    Figure 6.2 is introduced. To combine feature maps of different size, a deconvolutional
    layer with kernel size 4 × 4 is used to up-sample the lower-dimensional feature
    map by a factor of 2. Instead of using nearest neighbor up-sampling as proposed
    in [Lin17a], the application of deconvolutional layers facilitates the learning
    of a non-linear up-sampling, which empirically showed superior results in preliminary
    experiments. The up-sampled features are then combined with the features of the
    shallower layer via concatenation, which is equivalent to the lateral connections
    proposed in [Lin17a] to ensure more precise locations of up-sampled features.
    To effectively fuse the information from the concatenated feature maps, a 1 ×
    1 convolutional layer is applied after the concatenation. Note that the number
    of channels for each feature map is further adjusted to 256, which is the minimum
    number of channels of the employed feature maps, to allow similar level of influence
    of the combined feature maps. For this, 1 × 1 convolutions are applied on the
    output of conv4_3 and conv5_3.


    As shown in Figure 6.1, the deconvolutional sub-module is iteratively applied.
    At first, the deconvolutional sub-module up-samples the features from conv5_3
    and combines the up-sampled features with the features from conv4_3. Then, the
    combined features are up-sampled and merged with the output from conv3_3. The
    resulting features are then employed as feature'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'map for the RPN and classification stage. Thus, the contextual content of the
    deeper layers are propagated to the feature map.


    ![](img/99de1214c29cbc525a14b293385af5cf_115_0.png)


    Figure 6.2: Schematic illustration of the deconvolutional sub-module used to combine
    features from shallow and deep layers. A deconvolutional layer with kernel size
    4 × 4 and stride 2 is applied to up-sample the features from the deep layer by
    a factor of two, which are then combined via concatenation with the features from
    the shallow layer. Finally, a 1 × 1 convolutional layer is appended to effectively
    fuse the information from the concatenated feature maps.


    # 6.1.2 Stage-wise Training Scheme


    To train the proposed MFD Faster R-CNN, staged fine-tuning is performed inspired
    by [Lon15] in order to improve the weight initialization. For this purpose, Faster
    R-CNN using only conv3_3 as feature map is initially trained end-to-end for a
    total of 60,000 iterations with an initial learning rate of 0.001. Weights pre-trained
    on ImageNet are used for initialization. Next, conv4_1 through conv4_3 and a deconvolutional
    sub-module are added to the network and the combination of conv3_3 and the up-sampled
    feature of conv4_3 are used as feature map. The model is then trained end-to-end
    for 20,000 iterations with a learning rate of 0.001. For this, the added layers
    are initialized by using the Gaussian weight filler method, while all other weights
    are initialized by the initially trained Faster R-CNN. In the last stage, conv5_1
    through conv5_3 and a deconvolutional sub-module to up-sample the features of
    conv5_3 are added to the network. The combination of conv3_3 and the up-sampled
    features of conv4_3 and conv5_3 are used as feature map. The model is then trained
    end-to-end for further 20,000 iterations with a learning rate of 0.001. While
    the added layers are initialized by using the Gaussian weight'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'filler method, all other weights are initialized by the previously fine-tuned
    Faster R-CNN.


    # 6.1.3 Ablation Experiments


    The proposed MFD Faster R-CNN aims at enhancing the semantic and contextual information
    of the employed feature map by combining features from shallow and deep layers
    and thus, reducing the number of false alarms. The impact of enhancing the employed
    feature map by adding features from deeper layers on the detection accuracy is
    examined on the DLR 3K dataset. Table 6.1 shows the detection accuracy of the
    MFD Faster R-CNN for three different GSDs. For this, the original images are rescaled
    for training and testing as described in Section 5.2.3 and the used anchor box
    scales are adopted accordingly.


    Table 6.1: Comparison between the proposed MFD Faster R-CNN, which combines the
    outputs from conv3_3, conv4_3, and conv5_3 as feature map, and the baseline Faster
    R-CNN using only conv3_3 as feature map by means of AP (in %) for various GSDs.


    | Feature Map | GSD (in cm) |  |  |

    |---|---|---|---|

    |  | 13 | 19.5 | 26 |

    | conv3_3 | 94.3 | 89.4 | 83.2 |

    | conv3_3 ⊕ conv4_3 | 95.0 | 90.8 | 84.6 |

    | conv3_3 ⊕ conv4_3 ⊕ conv5_3 | 95.1 | 91.4 | 85.3 |


    Combining the features of conv3_3 with up-sampled features from conv4_3 exhibits
    superior results for all GSDs compared to the baseline Faster R-CNN merely employing
    conv3_3 as feature map. The proposed MFD Faster R-CNN that combines the features
    of conv3_3 with the up-sampled features from conv4_3 and conv5_3 achieves overall
    the best detection performance for all GSDs, which indicates that adding features
    comprising more contextual information results in better detection performance.
    A reason for the gain in detection performance is an improved classification accuracy,
    yielding fewer false positive detections. For instance, for a GSD of 26 cm, the
    number of false'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'positive detections is reduced by a factor of 27.8% compared to the baseline
    Faster R-CNN, while the number of false negative detections remains almost unaffected.
    For this, a classification threshold value of 0.5 is used. Qualitative results
    on DLR 3K for a GSD of 26 cm depicted in Figure 6.3 exhibit that the number of
    false positive detections caused by objects with shapes similar to vehicles is
    clearly reduced. This shows that integrating features of deeper layers with more
    semantic information leads to better classification accuracy and thus, results
    in better detection performance.


    ![](img/99de1214c29cbc525a14b293385af5cf_117_0.png)


    Figure 6.3: Qualitative detection (red boxes) and corresponding GT (green boxes)
    for Faster R-CNN using conv3_3 as feature map (top row) and MFD Faster R-CNN (bottom
    row) for a GSD of 26 cm. The number of FPs due to objects with shapes similar
    to vehicles are reduced by integrating spatial context information from deeper
    layers.


    The impact of the training scheme is shown in Table 6.2 exemplarily for the GSD
    of 26 cm. For comparison with the proposed training procedure comprised of three
    stages, two alternative variants are considered. The first variant is training
    the MFD Faster R-CNN in a single stage. For this, weights pre-trained on ImageNet
    are used to initialize all layers of the VGG16 backbone from conv1_1 through conv5_3.
    The additional layers are initialized by using the Gaussian weight filler method.
    The MFD Faster R-CNN is trained end-to-end for a total of 60,000 iterations with
    an initial learning rate of 0.001. The latter variant is comprised of two stages.
    In the first stage, Faster R-CNN using only conv3_3 as feature map is initially
    trained end-to-end for 60,000 iterations with an initial learning rate of 0.001
    analogously to the stage-wise'
  merge: -1
