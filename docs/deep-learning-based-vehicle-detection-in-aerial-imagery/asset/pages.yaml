- pgno: 62
  md: '# Integration of Contextual Knowledge


    Increasing the feature map resolution as required for an accurate localization
    of small objects is conducted by exploiting shallower layers as feature maps.
    However, the lack of semantic and spatial content compared to features from deep
    layers results in false alarms caused by objects with vehicle-like shapes such
    as windows or solar panels on buildings (see Figure 3.4). To overcome the lack
    of semantic and spatial content, the detection pipeline is extended by two novel
    components.


    ![](img/99de1214c29cbc525a14b293385af5cf_62_0.png)


    Figure 3.4: Qualitative detection results on the DLR 3K dataset that highlight
    the effect of the performed adaptations. False alarms due to the exploitation
    of shallow layers as feature map are mainly caused by objects with vehicle-like
    shapes such as solar cells or windows on buildings.


    Incorporating spatial context information into deep learning based detectors has
    led to improved detection results in aerial imagery. While making use of padded
    GT boxes has been proposed to automatically learn the context of vehicles in aerial
    imagery [Sak17], adding more context information by increasing the receptive filed
    via dilated convolution has been recently applied for object detection in aerial
    imagery such as building detection [Ham18] and'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'vehicle detection [Din18]. Inspired by semantic labeling networks that combine
    features of shallow and deep layers to account for fine and coarse structures,
    e.g., FCN [Lon15], an alternative approach is pursued within this thesis [Som18c].
    Therefore, Faster R-CNN is extended by a novel component denoted as context enhancement
    module (see Figure 3.1). To integrate semantic and contextual information of deep
    layers, while maintaining a high feature map resolution, the features of deep
    layers are up-sampled via deconvolution and combined with features of shallow
    layers, which is a similar concept as in [Lin17a, Woo18]. Adopting the proposed
    deconvolution module for other detection frameworks confirms the benefit of adding
    context information from deep layers for vehicle detection [Aca18].


    To address false alarms caused in image regions that are unlikely to contain vehicles
    such as buildings, semantic context information is often applied in conventional
    detection pipelines. For this, a common procedure is restricting detections to
    road areas, assuming that vehicles do not appear offside roads [Tue13, Mor14a].
    However, the accuracy of road databases is often limited, which causes missed
    detections due to vehicles parked close to buildings [Tue13]. To cope with this
    issue, a novel approach that replaces the road database by a semantic labeling
    mask is developed [Som17a]. As the proposed semantic labeling network accurately
    predicts roads as well as driveways and parking lots, only detections mainly located
    on buildings or low vegetation are filtered out. To avoid large computational
    overhead due to an additional semantic labeling network, an alternative approach
    that incorporates semantic labeling into the detection framework is introduced
    in this thesis [Nie18]. Instead of filtering out detections offside roads, semantic
    labeling is employed to induce scene knowledge into the feature maps used within
    the detection framework (see Figure 3.1). For this purpose, the semantic labeling
    and the detection network are merged by sharing a sequence of convolutional layers,
    which has an implicit effect on the resulting detections. Explicitly adding deep
    features of the semantic labeling branch to the detection branch further boosts
    the detection accuracy [Nie18]. Unlike the popular Mask R-CNN [He17] that applies
    a semantic labeling network for each region proposal, the proposed approach is
    not limited to scene context within region proposals,'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'which is beneficial in case of vehicle detection in aerial imagery. The proposed
    principle is most similar to StuffNet [Bra17], which makes use of the local surroundings
    of an object to identify it, yielding improved detection accuracy on PASCAL VOC.
    Furthermore, a novel semantic labeling dataset¹ is created within the context
    of this thesis to evaluate the effect of semantic labeling on vehicle detection
    in aerial imagery [Azi19].


    # Runtime Optimization


    Though the performed adaptations to account for the characteristics of aerial
    imagery considerably improve the detection accuracy, the resulting poor inference
    time impedes the usage for real-world applications that require vehicle detection
    in real-time or nearly in real-time. To accelerate the detection pipeline, two
    different strategies are pursued in the context of this thesis.


    As feature extraction is one of the most time-consuming parts in modern deep learning
    based detection frameworks such as Faster R-CNN, replacing the default CNN architecture
    with more computational efficient networks is common practice to reduce the inference
    time. Employing recent architectures developed for use on mobile platforms with
    limited resources as feature extractor exhibit clearly reduced inference time
    without large drops in detection accuracy [Wan18b, Zha18b]. The common principle
    is reducing the number of parameters and computational operations by minimizing
    the use of expensive 3 × 3 convolution filters. While these lightweight architectures
    are generally designed for classification tasks, adopting this principle to vehicle
    detection in aerial imagery without caution may degrade the detection accuracy,
    as feature extraction is restricted to shallow layers. In this thesis, the applicability
    of different lightweight architectures is examined exemplarily for SSD [Rin19],
    which allows a straightforward exchange of the CNN architecture. In combination
    with further techniques for runtime optimization, the inference time is considerably
    reduced, while only sacrificing little to no detection accuracy.


    ¹ A refined and enhanced version of the dataset is made publicly available in
    cooperation with DLR, whereby DLR provides more fine-grained annotations: https://www.dlr.de/eoc/en/desktopdefault.aspx/tabid-12760'
  merge: -1
  img_proc: true
