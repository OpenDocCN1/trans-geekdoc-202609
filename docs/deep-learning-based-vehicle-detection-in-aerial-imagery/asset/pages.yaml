- pgno: 58
  md: '# 3 Concept


    This thesis aims at the design of a deep learning based detection pipeline for
    vehicle detection in aerial imagery with low spatial resolution. While the low
    spatial resolution allows the coverage of large areas, the small size of occurring
    vehicles complicates their detection. Due to its superior detection accuracy compared
    to other deep learning based detectors, in particular for small object instances,
    Faster R-CNN is chosen as base detection framework. Faster R-CNN is comprised
    of two modules: an initial module referred to as RPN that generates a set of candidate
    regions, which are then forwarded to the subsequent classification stage. The
    RPN and classification stage share a sequence of convolutional layers serving
    as the feature extractor, while the output of the last convolutional layer, denoted
    as feature map, is used as input for both modules. Note that modern deep learning
    based detection frameworks, such as Faster R-CNN, are designed for benchmark detection
    datasets clearly differing from aerial imagery. Thus, several adaptations are
    required to account for the specific characteristics of aerial imagery. Despite
    the improved detection accuracy, these required adaptations introduce several
    shortcomings, e.g., poor inference time and low semantic and spatial content of
    the employed features.


    The overall concept of the proposed detection pipeline specifically designed to
    address these shortcomings is illustrated in Figure 3.1. The RPN and classification
    stage that remain basically unchanged are highlighted by gray boxes. Modifications
    to decrease the computational effort and consequently inference time, i.e., restriction
    of the search area and computation-efficient feature extraction, are emphasized
    by blue boxes. Green boxes indicate novel components to increase the semantic
    and spatial context information of the employed features and thus, improve the
    detection accuracy. Note that the'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'proposed components are not limited to Faster R-CNN and thus, can be integrated
    into other deep learning based detection frameworks. Relying on the application
    or target data, the components can be applied independently or exchanged with
    other alternatives, e.g., different feature extractors.


    ![](img/99de1214c29cbc525a14b293385af5cf_59_0.png)


    Figure 3.1: Overall concept of the proposed detection pipeline based on the Faster
    R-CNN detection framework, which comprises an RPN and a classification stage.
    Two novel components denoted as semantic labeling and context enhancement module
    are added to improve the detection accuracy by integrating semantic and spatial
    context information. A search area reduction module and a modified feature extractor
    are introduced to reduce the computational costs and consequently the inference
    time.


    # Detection Framework Adaptation


    In the context of this thesis, Faster R-CNN is applied as base detection framework.
    Compared to other deep learning based detection frameworks, Faster R-CNN achieves
    superior detection accuracy, especially for small object instances, and thus,
    seems most promising for the task of vehicle detection'
  merge: -1
  img_proc: true
- pgno: 60
  md: in aerial imagery. However, deep learning based detection frameworks such as
    Faster R-CNN are typically developed and designed for benchmark datasets that
    clearly differ from aerial imagery as shown in Figure 3.2 and Figure 3.3. Common
    benchmark datasets, e.g., PASCAL VOC [Eve10] and MS COCO [Lin14], generally contain
    one or a few objects per image that are often centered and occupy a high fraction
    of the image. Thus, even comparatively small objects exhibit a high level of detail
    such as wheels, license plate, and lights in case of category car. In contrast,
    aerial imagery datasets like DLR 3K [Liu15] and VEDAI [Raz16], which are typically
    acquired by sensors mounted on platforms flying at high altitude, generally exhibit
    low spatial resolutions resulting in small object dimensions, i.e., in the range
    of a few pixels. Thus, objects that can be randomly located and oriented within
    the scene often lack in level of detail, which considerably impedes the detection
    task. Furthermore, the number of objects present in aerial imagery can vary between
    only a few objects in rural regions and hundreds of objects in urban areas with
    high traffic volumes or parking lots. Due to these differences, in particular
    in object dimensions, deep learning based detection frameworks are not directly
    applicable for vehicle detection in aerial imagery. In order to account for the
    specific characteristics, several adaptations have been systematically examined
    with regard to small object dimensions within this thesis [Som17c, Som18b]. Particularly,
    increasing the feature map resolution considerably improved the detection performance,
    as the initial resolution is insufficient to precisely localize small vehicle
    instances in aerial imagery. The transferability of the proposed adaptations to
    multiple object categories and other detection frameworks are demonstrated in
    [Som17b, Som18d], respectively. Though the default Faster R-CNN and conventional
    detection methods are clearly outperformed, the performed adaptations pose drawbacks
    regarding inference time and semantic and spatial content of the employed features,
    which are addressed in the following.
  merge: -1
  img_proc: true
