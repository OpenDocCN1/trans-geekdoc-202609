- pgno: 87
  md: 'Joint training of the RPN and classification stage is conducted for all experiments
    within this thesis, which is 1.5 times faster than alternating optimization at
    similar detection performance. For this purpose, $L_{RPN}$ and $L_{CLS}$ are equally
    weighted:


    $L_{Faster\ R-CNN} = L_{RPN} + L_{CLS}.$


    (5.7)


    Each model is trained for 60,000 iterations using SGD and an initial learning
    rate of 0.001. The learning rate is reduced by a factor of 10 every 20,000 iterations.
    The weight decay and momentum are set to 0.0005 and 0.9, respectively. Weights
    pre-trained on ImageNet are used to initialize the convolutional layers and the
    first two fully connected layers in the classification stage. All other layers
    are randomly initialized by using the Gaussian weight filler method according
    to [Ren15]. If not stated otherwise, 3 scales and 3 aspect ratios are used for
    the anchor boxes of the RPN. The aspect ratios are fixed to 1:1, 1:2 and 2:1 to
    account for the different orientations of vehicles in overhead imagery. The minimum
    dimension to accept generated region proposals for classification is set to 4
    pixels. Note that by default, only candidate regions whose dimensions exceed 16
    pixels are considered for classification, which may lead to a high number of missed
    detections as candidate regions corresponding to small objects, partially occluded
    objects and objects at image edges are filtered out.


    During deployment, NMS is applied on the 10,000 region proposals exhibiting the
    highest confidence scores. The overlap threshold value used for NMS is set to
    0.7. The top-2000 ranked region proposals after NMS are then forwarded to the
    classification stage. Hence, redundant region proposals are removed and the number
    of region proposals to classify and consequently the computational costs are reduced.
    To remove duplicate detections, NMS with an overlap threshold of 0.3 is applied
    on the final detections. The settings for the NMS are based on preliminary experiments
    reported in [Som18b].'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 5.2 Adaptation to Aerial Imagery


    Deep learning based detection frameworks, such as Faster R-CNN, are typically
    developed and designed for benchmark detection datasets that considerably differ
    from aerial imagery (see Chapter 3). Due to these differences, in particular in
    object dimensions, deep learning based detection frameworks are not directly applicable
    for vehicle detection in aerial imagery. In order to account for the characteristics
    of aerial imagery, several modifications are examined in detail for the first
    time [Som17b, Som18b]. In the following, the conducted modifications to Faster
    R-CNN, i.e., reducing the feature map resolution and adapting the anchor box settings,
    are analyzed and the accompanying effects are discussed.


    # 5.2.1 Feature Map Resolution


    By using the original VGG16 as feature extractor for Faster R-CNN, top performing
    results are achieved on PASCAL VOC indicating the high suitability for benchmark
    datasets [Ren15]. Due to spatial pooling, the dimensions of the output of the
    last convolutional layer used as feature map are only 1/16 of the input image
    (see Table 5.1), which is sufficient for accurately localizing objects in benchmark
    datasets as shown in Figure 5.4. To this end, the activations of three filters
    from the employed feature map, i.e., conv5_3, and the corresponding detection
    results are depicted exemplarily for PASCAL VOC. Note that the applied Faster
    R-CNN model is trained with the settings proposed for PASCAL VOC. During inference,
    the input image is rescaled so that the shorter size equals 600 pixels analogous
    to [Ren15]. The activations are normalized to values between 0 and 1, whereby
    higher values correspond to stronger activations. Multiple feature map pixels
    overlap with the objects due to the large object dimensions. The activations of
    the three filters, which respond to different object parts, e.g., windshield,
    show that the feature map resolution is even sufficient to map the contours of
    the object parts and consequently yield accurately aligned bounding boxes around
    the objects.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/99de1214c29cbc525a14b293385af5cf_89_0.png)


    Figure 5.4: Activations of three filters from conv5_3 used as feature map and
