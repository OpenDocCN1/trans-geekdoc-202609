- pgno: 44
  md: 'training of this multi-stage detector is complex and time-consuming, since
    the region proposal method, the CNN used for feature extraction, the SVM classifiers
    and the bounding box regressor need to be trained and optimized separately. However,
    the main bottleneck during deployment is the feature extraction, as CNN features
    are computed for each candidate region separately [Gir15].


    Spatial pyramid pooling network (SPPNet) [He14] overcomes this bottleneck by computing
    convolutional features for the entire input image at once. To account for the
    fixed-length feature vectors as required for the fully connected layers, the last
    pooling layer is replaced by a so-called *spatial pyramid pooling layer*. The
    spatial pyramid pooling extracts features of fixed length for each candidate region
    from the shared feature map. For this, the spatial pyramid pooling layer partitions
    the features of the corresponding region of interest into fixed number of spatial
    bins at multiple levels. Applying the convolutional layers at once for the entire
    image reduces the runtime during deployment by orders of magnitude. A drawback
    of SPPNet is that the fine-tuning algorithm is unable to update the convolutional
    layers that precede the spatial pyramid pooling and consequently limits the accuracy
    of very deep networks [Gir15].


    Fast R-CNN [Gir15] addresses the drawback of SPPNet by introducing a *Region of
    Interest (RoI) pooling layer*. Similar to SPPNet, Fast R-CNN shares the computation
    of convolutions across region proposals. However, the spatial pyramid pooling
    layer is replaced by a RoI pooling layer, which enables fine-tuning of all network
    layers and consequently facilitates the use of very deep networks. By conducting
    max pooling, the RoI pooling layer converts the features inside any valid region
    of interest into a feature map with a fixed spatial extent. The feature map with
    fixed spatial extent is fed into a sequence of fully connected layers that branch
    into two sibling output layers. The first layer outputs softmax probabilities
    for the object categories and the second layer outputs class-specific bounding
    box regression offsets for proposal refinement. Unlike R-CNN and SPPNet that employ
    stage-wise training, Fast R-CNN simplifies the training procedure as classification
    and bounding box regression are trained within the network. Although Fast R-CNN
    results in'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'improved detection accuracy and speeds up the detection process, using an external
    region proposal method remains time-consuming [Ren15].


    Faster R-CNN [Ren15] extends Fast R-CNN by integrating a sub-network called Region
    Proposal Network (RPN) that generates region proposals directly within the network.
    The RPN and Fast R-CNN share the first set of convolutional layers, so that the
    computational overhead of the RPN is small and the time for generating region
    proposals is significantly reduced. The RPN is applied on the output of the last
    shared convolutional layer, which is referred to as feature map. The RPN comprises
    a convolutional layer followed by two sibling output layers: one for classification
    and one for bounding box regression. Anchor boxes centered at each feature map
    location are used as bounding box reference for regression. In order to account
    for various object dimensions, anchor boxes with different scales and aspect ratios
    are employed. Region proposals that are likely to contain an object are then forwarded
    to the classification stage, which is in essence the Fast R-CNN detector.


    R-FCN [Dai16] is a region-based fully convolutional network based on Faster R-CNN,
    which makes use of an alternative classification stage to avoid the application
    of RoI pooling and fully connected layers for each candidate region separately.
    For this purpose, the standard RoI pooling layer is replaced by a position sensitive
    RoI pooling layer, which is applied on top of class-specific position sensitive
    score maps that are shared across the entire image and not computed for each candidate
    region separately. The position sensitive score maps that are generated by applying
    a set of convolutional layers encode the relative position of objects, e.g., top-left
    corner. The position sensitive RoI pooling layer aggregates the responses of the
    position sensitive score maps for each candidate region forwarded from the RPN.
    R-FCN achieves comparable detection results on benchmark datasets, while the runtime
    is clearly reduced compared to Faster R-CNN.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 2.2.2 One-stage Approaches


    You only look once (YOLO) [Red16] models the detection as a regression problem.
    For this, YOLO divides the input image into an S × S grid and predicts l bounding
    boxes for each grid cell. Each bounding box comprises the coordinates relative
    to the cell, its dimensions and a confidence score about the presence of an object
    within the box. Unlike region proposal based approaches that employ features from
    local regions, YOLO uses features from the entire image for bounding box prediction.
    Regardless of the number of bounding boxes, one set of class probabilities is
    predicted per grid cell. During testing, the class probabilities and confidence
    scores are multiplied to generate class-specific confidence scores for each box.
    Predicting bounding boxes and class probabilities at once results in a significant
    speed-up compared to other deep learning frameworks. However, the coarse grid
    division and the constraint that only two boxes are predicted per cell make YOLO
    prone to miss nearby objects.


    Single Shot MultiBox Detector (SSD) [Liu16] is a fully convolutional network,
    whose functional principle is similar to the RPN in Faster R-CNN. In contrast
    to the original RPN, which is class-agnostic, SSD predicts a fixed number of bounding
    boxes and confidence scores for each object category. Anchor boxes centered at
    each feature map location are used as reference for bounding box regression. Besides
    employing anchor boxes with different scales and aspect ratios, multiple convolutional
    layers are employed as feature maps to account for different object dimensions.
    Shallow convolutional layers exhibiting fine spatial resolutions are employed
    as feature maps to predict small objects, whereas deep convolutional layers with
    coarse spatial resolutions are used to predict large objects. SSD achieves clearly
    improved detection accuracy compared to previous single stage approaches.


    YOLOv2 [Red17] is an advanced version of YOLO, which adopts different strategies
    from SSD and Faster R-CNN. Fully connected layers are removed to make the network
    fully convolutional, which allows multi-scale training. Similar to Faster R-CNN,
    anchor boxes are employed instead of predicting the width and height outright.
    Rather than choosing anchor boxes manually,'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'k-means clustering is employed to generate more appropriate anchor boxes. Furthermore,
    a so-called *passthrough layer* is added to the network, which forwards features
    of shallower layers to the last convolutional layer that is used as feature map.
    Adding fine-grained features to the feature map results in better localization
    of small objects. YOLOv2 exhibits good detection accuracies on benchmark datasets,
    while the inference time is considerably reduced compared to prior deep learning
    based detection approaches.


    # 2.2.3  Extensions


    The deep learning based detection frameworks discussed above are generally used
    as basis for further developments. Multiple extensions including exploitation
    of novel CNN architectures, multi-layer exploitation and adding context information
    have been proposed to boost the detection performance.


    In general, deep learning based detection frameworks employ CNN architectures
    developed for object classification as feature extractor. The employed CNN architecture
    is commonly referred to as *base* or *backbone network*. In [Hel16a], the authors
    improve the detection accuracy on benchmark datasets by replacing VGG16 with a
    residual network as base network for Faster R-CNN. Using ResNeXt networks as base
    network for Faster R-CNN shows slightly improved detection results compared to
    conventional residual networks [Xie17]. The detection performance is further improved
    by employing SENets [Hu18] – the winner of the ImageNet2017 classification challenge¹
    – as base network for Faster R-CNN. SENets comprise so-called *Squeeze and Excitation
    blocks* that adaptively recalibrate feature responses so that informative features
    can be emphasized and less useful features can be suppressed. In [Zoph18], the
    authors recently employ reinforcement learning to learn an optimized network architecture
    directly on the dataset of interest. Top performing results are achieved by using
    these so-called NASNets as base network for Faster R-CNN on the MS COCO dataset
    [Lin14].


    ¹ http://image-net.org/challenges/LSVRC/2017/results'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Various approaches have been proposed to improve detection accuracy by exploiting
    multiple layers. These approaches can be roughly divided into combination of features
    from multiple layers [Bel16, Kon16, Shr16c] and object prediction at different
    feature maps [Cai16]. Combining features from multiple layers is often performed
    to enhance the semantic and contextual information. Bell et al. [Bel16] extend
    Fast R-CNN by applying RoI pooling on multiple layers. The extracted RoI features
    are concatenated and used to classify the corresponding region proposals. HyperNet
    [Kon16] – an extension of Faster R-CNN – concatenates deep, intermediate and shallow
    feature maps to so-called *Hyper Feature maps* used for object prediction. To
    account for same feature map resolutions, max pooling is conducted to down-sample
    shallow feature maps, while deconvolution is applied for up-sampling deep layers.
    Shrivastava et al. [Shr16c] extend Faster R-CNN by introducing a top-down modulation
    network to combine features from deep and shallow layers. Deep layers are up-sampled
    via deconvolution and then concatenated with features of shallow layers. Employing
    multiple layers as feature maps introduced in [Liu16] is often adopted to account
    for various object dimensions. In [Cai16], region proposals are generated at multiple
    layers so that receptive fields match objects of different scales. The generated
    region proposals are then classified in a subsequent stage similar to Faster R-CNN.
    Several methods take advantage of both extension schemes [Fu17, Woo18, Lin17a,
