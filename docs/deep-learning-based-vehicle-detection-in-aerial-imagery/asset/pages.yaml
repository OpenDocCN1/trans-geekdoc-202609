    Residual neural networks [He16a], shortened *ResNets*, overcome the problem of
    vanishing gradients by adding identity shortcuts to the network, which help to
    smoothly back-propagate the gradient signal (see Figure 2.8a). These shortcuts
    further facilitate the learning task, as the intermediate layers only'
