    Figure 6.10: Schematic illustration of the semantic labeling based filtering.
    For this purpose, semantic labeling masks generated by a separate network are
    used to either filter out region proposals (a) or detections (b) that are mainly
    located on regions unlikely to contain vehicles.


    # Filtering Scheme


    The proposed filtering scheme is straightforward as illustrated in Figure 6.11.
    A separate CNN network is employed to generate a semantic labeling mask, which
    is then used to compute the category distribution within each region proposal
    or detection. The characteristics of the category distribution are lastly employed
    to accept or reject the corresponding region proposal or detection. Note that
    simply accepting region proposals or detections that are mainly labeled as category
    car would decrease the detection accuracy due to inaccurate labeling, e.g., high
    number of vehicles beneath a tree are labeled'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'as category tree (see Figure 4.7), which influences the training of the semantic
    labeling networks. Thus, a filter criterion is applied, which is designed to maximize
    the detection accuracy.


    ![](img/99de1214c29cbc525a14b293385af5cf_128_0.png)


    **Figure 6.11:** Schematic of the semantic labeling based filtering scheme. Class
    histograms computed for each initial region proposal or detection are used to
    filter out region proposals or detections based on a filter criterion.


