- pgno: 8
  md: '# Abstract


    The usage of airborne platforms, such as unmanned aerial vehicles (UAVs), equipped
    with camera sensors is essential for a wide range of applications in the field
    of civil safety and security. Amongst others, prominent applications include surveillance
    and reconnaissance, traffic monitoring, search and rescue, disaster relief and
    environmental monitoring. However, analyzing the aerial imagery data solely by
    human operators is often not practicable due to the large amount of visual data
    and the resulting cognitive overload. In practice, automated processing chains
    based on appropriate computer vision algorithms are employed to assist human operators
    in assessing the aerial imagery data. Key component of such processing chains
    is an accurate detection of all relevant objects inside the camera’s field of
    view, before the scene can be analyzed and interpreted. The low spatial resolution
    originating from the large distance between camera and ground makes object detection
    in aerial imagery a challenging task, which is further impeded by motion blur,
    occlusions or shadows. Although many conventional approaches for object detection
    in aerial imagery exist in the literature, the limited representation capacity
    of the utilized handcrafted features often inhibits reliable detection accuracies
    due to the occurring high variance in object scale, orientation, color, and shape.


    In the scope of this thesis, a novel deep learning based detection approach is
    developed, whereby the focus lies on vehicle detection in aerial imagery recorded
    in top view. For this purpose, Faster R-CNN is chosen as base detection framework
    because of its superior detection accuracy compared to other deep learning based
    detectors. Relevant adaptations to account for the specific characteristics of
    aerial imagery, especially the small object dimensions, are'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Abstract


    systematically examined and resulting issues with respect to real-world applications,
    i.e., the high number of false detections caused by vehicle-like structures and
    the poor inference time, are identified. Two novel components have been proposed
    to improve the detection accuracy by enhancing the contextual content of the employed
    feature representation. The first component aims at increasing spatial context
    information by combining features of shallow and deep layers to account for fine
    and coarse structures, while the latter component leverages semantic labeling
    – the pixel-wise classification of an image – to introduce more semantic context
    information. Two different variants to integrate semantic labeling into the detection
    framework are realized: exploitation of the semantic labeling results to filter
    out unlikely predictions and inducing scene knowledge by explicitly merging the
    semantic labeling network into the detection framework via shared feature representations.
    Both components clearly reduce the number of false detections, resulting in considerably
    improved detection accuracies. To reduce the computational effort and consequently
    the inference time, two alternative strategies are developed in the context of
    this thesis. The first strategy is replacing the default CNN architecture used
    for feature extraction with a lightweight CNN architecture optimized with regard
    to vehicle detection in aerial imagery, while the latter strategy comprises a
    novel module to restrict the search area to areas of interest. The proposed strategies
    result in clearly reduced inference times for each component of the detection
    framework. Combining the proposed approaches significantly improves the detection
    performance compared to the standard Faster R-CNN detector taken as baseline.
    Furthermore, existing approaches for vehicle detection in aerial imagery, taken
    from the literature, are outperformed in quantitative and qualitative manner on
    different aerial imagery datasets. The generalization ability is further demonstrated
    on a large set of previously unseen data collected from novel aerial imagery datasets
    with differing properties.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Kurzfassung


    Der Einsatz von luftgestützten Plattformen, die mit bildgebender Sensorik ausgestattet
    sind, ist ein wesentlicher Bestandteil von vielen Anwendungen im Bereich der zivilen
    Sicherheit. Bekannte Anwendungsgebiete umfassen unter anderem die Entdeckung verbotener
    oder krimineller Aktivitäten, Verkehrsüberwachung, Suche und Rettung, Katastrophenhilfe
    und Umweltüberwachung. Aufgrund der großen Menge zu verarbeitender Daten und der
    daraus resultierenden kognitiven Überbelastung ist jedoch eine Analyse der Luftbilddaten
    ausschließlich durch menschliche Auswerter in der Praxis nicht anwendbar. Zur
    Unterstützung der menschlichen Auswerter kommen daher in der Regel automatische
    Bild- und Videoverarbeitungsalgorithmen zum Einsatz. Eine zentrale Aufgabe bildet
    dabei eine zuverlässige Detektion relevanter Objekte im Sichtfeld der Kamera,
    bevor eine Interpretation der gegebenen Szene stattfinden kann. Die geringe Bodenauflösung
    aufgrund der großen Distanz zwischen Kamera und Erde macht die Objektdetektion
    in Luftbilddaten zu einer herausfordernden Aufgabe, welche durch Bewegungsunschärfe,
    Verdeckungen und Schattenwurf zusätzlich erschwert wird. Obwohl in der Literatur
    eine Vielzahl konventioneller Ansätze zur Detektion von Objekten in Luftbilddaten
    existiert, ist die Detektionsgenauigkeit durch die Repräsentationsfähigkeit der
    verwendeten manuell entworfenen Merkmale beschränkt.


    Im Rahmen dieser Arbeit wird ein neuer Deep-Learning basierter Ansatz zur Detektion
    von Objekten in Luftbilddaten präsentiert. Der Fokus der Arbeit liegt dabei auf
    der Detektion von Fahrzeugen in Luftbilddaten, die senkrecht von oben aufgenommen
    wurden. Grundlage des entwickelten Ansatzes bildet der Faster R-CNN Detektor,
    der im Vergleich zu anderen Deep-Learning basierten Detektionsverfahren eine höhere
    Detektionsgenauigkeit besitzt. Da'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Faster R-CNN wie auch die anderen Deep-Learning basierten Detektionsverfahren
    auf Benchmark Datensätzen optimiert wurden, werden in einem ersten Schritt notwendige
    Anpassungen an die Eigenschaften der Luftbilddaten, wie die geringen Abmessungen
    der zu detektierenden Fahrzeuge, systematisch untersucht und daraus resultierende
    Probleme identifiziert. Im Hinblick auf reale Anwendungen sind hier vor allem
    die hohe Anzahl fehlerhafter Detektionen durch fahrzeugähnliche Strukturen und
    die deutlich erhöhte Laufzeit problematisch. Zur Reduktion der fehlerhaften Detektionen
    werden zwei neue Ansätze vorgeschlagen. Beide Ansätze verfolgen dabei das Ziel,
    die verwendete Merkmalsrepräsentation durch zusätzliche Kontextinformationen zu
    verbessern. Der erste Ansatz verfeinert die räumlichen Kontextinformationen durch
    eine Kombination der Merkmale von frühen und tiefen Schichten der zugrundeliegenden
    CNN Architektur, so dass feine und grobe Strukturen besser repräsentiert werden.
    Der zweite Ansatz macht Gebrauch von semantischer Segmentierung um den semantischen
    Informationsgehalt zu erhöhen. Hierzu werden zwei verschiedene Varianten zur Integration
    der semantischen Segmentierung in das Detektionsverfahren realisiert: zum einen
    die Verwendung der semantischen Segmentierungsergebnisse zur Filterung von unwahrscheinlichen
    Detektionen und zum anderen explizit durch Verschmelzung der CNN Architekturen
    zur Detektion und Segmentierung. Sowohl durch die Verfeinerung der räumlichen
    Kontextinformationen als auch durch die Integration der semantischen Kontextinformationen
    wird die Anzahl der fehlerhaften Detektionen deutlich reduziert und somit die
    Detektionsgenauigkeit erhöht. Insbesondere der starke Rückgang von fehlerhaften
    Detektionen in unwahrscheinlichen Bildregionen, wie zum Beispiel auf Gebäuden,
    zeigt die erhöhte Robustheit der gelernten Merkmalsrepräsentationen. Zur Reduktion
    der Laufzeit werden im Rahmen der Arbeit zwei alternative Strategien verfolgt.
    Die erste Strategie ist das Ersetzen der zur Merkmalsextraktion standardmäßig
    verwendeten CNN Architektur mit einer laufzeitoptimierten CNN Architektur unter
    Berücksichtigung der Eigenschaften der Luftbilddaten, während die zweite Strategie
    ein neues Modul zur Reduktion des Suchraumes umfasst. Mit Hilfe der vorgeschlagenen
    Strategien wird die Gesamtlaufzeit sowie die Laufzeit für jede Komponente des
    Detektionsverfahrens deutlich reduziert.'
  merge: -1
  img_proc: true
