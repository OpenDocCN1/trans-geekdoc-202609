    losses of the RPN shows that in case of a mean anchor box area of $256^2$ pixels,
    both $L_{cls,RPN}$ and $L_{reg,RPN}$ exhibit no convergence behavior, while both
    losses converge to 0 for a mean anchor box area of $28^2$ pixels. A reason for
    this is the sampling of'
