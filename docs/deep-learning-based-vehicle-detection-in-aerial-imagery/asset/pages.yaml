    # 4.2 Evaluation Metrics and Protocol


    In the following, common metrics to evaluate the performance of the proposed detection
    pipeline, the region proposal generation, i.e., RPN, and the semantic labeling
    approaches to integrate semantic context information are introduced.


    # Object Detection


    In this thesis, average precision (AP) [Sal83], which is a common metric to measure
    the detection performance, is applied following the evaluation protocol introduced
    in [Eve10]. To compute the AP, the detection results are compared against GT.
    The detection results and GT are provided as bounding boxes with an associated
    class label. The detection results further comprise for each bounding box the
    probability for the assigned class, which is denoted as confidence score.


    The confidence score and the Intersection over Union (IoU), also referred to as
    Jaccard coefficient, are used as criteria to determine whether a detection is'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'considered as correct detection, termed *true positive* (TP), or not. The IoU
    is defined as the area of the intersection divided by the area of the union of
    a predicted bounding box and a GT box:


    IoU = $\frac{A_{pred} \cap A_{GT}}{A_{pred} \cup A_{GT}}$ . (4.1)


    A detection is considered as TP, if it satisfies two conditions: the confidence
    score is higher than a given threshold τ and the IoU is equal to or greater than
    0.5, which is referred to as *PASCAL criterion*¹. Detections that do not fulfill
    both conditions are termed *false positives* (FPs). Note that, if multiple detections
    correspond to the same GT instance, only the one with the highest confidence score
    counts as a TP, while the remaining detections are considered as FPs. GT instances
    without an assigned detection are referred to as *false negatives* (FNs).


    Precision *P* - the percentage of correct detections - is defined as the number
    of TPs divided by the sum of TPs and FPs:


    P = $\frac{|TP|}{|TP| + |FP|}$ . (4.2)


    Recall *R* is the detection rate defined as the number of TPs divided by the sum
    of TPs and FNs:


    R = $\frac{|TP|}{|TP| + |FN|}$ . (4.3)


    Both measures are in the range between 0 and 1. The precision and recall pair
    for a fixed confidence threshold τ is termed operating point. Higher values for
    τ generally result in higher precision and lower recall rates and vice versa.
    By varying τ, different operating points are received, yielding the precision-recall
    curve (PRC) as exemplarily depicted in Figure 4.8.


    ¹ In case of multiple classes, which is not the case in this thesis, the predicted
    class has to match furthermore the class label of the corresponding GT.'
