  md: '# 5.2.4 Arising Challenges


    Despite the considerably improved detection accuracy, in particular for high GSDs,
    the performed adaptations lead to several shortcomings that have to be addressed
    for real-world applications. These shortcomings are primarily the weaker semantic
    and spatial context information of the employed features and the inference time,
    which are discussed in the following.


    # Semantic and Spatial Context


    In general, each convolutional layer within a CNN learns filters of increasing
    complexity, since features from the previous layers are aggregated and recombined.
    The first layers learn basic feature representations, e.g., edges and corners,
    whereas the middle layers learn to respond to object parts and the last layers
    learn higher representations to recognize full objects with different shapes and
    positions or even entire scenes [Zho15]. Furthermore, the region of the input
    space that affects a particular unit of the network, also referred to as *receptive
    field*, and consequently the spatial context information generally increases with
    deeper layers [Luo16]. Hence, removing deep layers to increase the feature map
    resolution required for accurately locating tiny objects leads to less semantic
    and spatial context information.


    ![](img/99de1214c29cbc525a14b293385af5cf_107_0.png)


    Figure 5.20: Error analysis of false positive detections for various GSDs.'
  merge: -1
  img_proc: true
