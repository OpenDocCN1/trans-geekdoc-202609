  md: 'to a thinner network with considerably less parameters and reduced computational
    costs. By applying the resolution multiplier ρ ∈ (0,1] on the input image, the
    width W and height H of the input image and each subsequent layer are reduced
    to ρW and ρH, respectively. Though reducing the input image and the internal representation
    of every layer reduces the computational costs by ρ², it is not practicable for
    the task of vehicle detection in aerial imagery due to the already small object
    dimensions.


    For the usage of MobileNet as base network within the SSD detector, only the output
    of the 5th DSC layer is exploited as feature map, as deeper layers would result
    in coarser feature map resolutions that are unsuited to accurately localize small
    objects. Thus, all deeper layers are truncated, yielding a clearly reduced model
    size. The official MobileNet weights pre-trained on ImageNet are used for initialization¹.
    Therefore, the weights are converted from the TensorFlow format to the Caffe format,
    as no pre-trained weights are directly available for Caffe. Due to findings in
    preliminary experiments, each model is trained for 45,000 iterations using the
    Adam optimizer with a batch size of 16 and an initial learning rate of 0.001.


    # ShuffleNet


    ShuffleNet [Zha18b] designed especially for mobile devices with very limited computing
    power employs DSCs to reduce the computational costs. In contrast to MobileNet,
    1 × 1 convolutional layers are inserted before each DSC. Thus, the number of input
    channels and consequently computational operations for the 3 × 3 depthwise convolutions
    are reduced. By replacing conventional 1 × 1 convolutions with cheaper 1 × 1 group
    convolutions, the number of parameters and computational costs are further reduced.
    Depending on the group count g, a group convolution filter only considers the
    D/g channels of its respective group as input instead of the full channel depth
    D. Channel shuffling (see Figure 2.12) is applied after the auxiliary 1 × 1 group
    convolutions'
