    *Shuffled group convolutions* aim at eliminating the side effect of group convolutions
    that outputs from a certain channel are only derived from a small fraction of
    input channels [Zha18b]. Therefore, a novel operation called *channel shuffle*
    is introduced between two stacked group convolutions. The output channels of each
    group from the first group convolution are divided into'
