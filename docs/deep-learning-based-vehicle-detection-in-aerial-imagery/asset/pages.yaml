  md: 'subgroups, which are transposed as depicted in Figure 2.12. The transposed
    channels are then fed into the second group convolution and thus, allows an information
    flow across groups. Note that the channel shuffle operation is differentiable
    and thus, can be directly integrated into CNN architectures for end-to-end training.


    *Deconvolution* has been proposed to perform up-sampling within a neural network.
    Note that the deconvolution within the context of CNNs is not the same as the
    deconvolution defined in signal processing, but a transposed convolution as shown
    in Figure 2.13. Thus, it is also referred to as *convolution with fractional strides*
    or *transposed convolution*. Up-sampling with factor $f_u$ can be thought of as
    convolution with a fractional input stride of $1/f_u$. In practice, deconvolution
    works by swapping the forward and backward passes of a convolution.


    ![](img/99de1214c29cbc525a14b293385af5cf_42_0.png)


