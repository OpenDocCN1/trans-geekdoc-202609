- pgno: 21
  md: 'objects, e.g., vehicles inside the camera’s field of view, before the scene
    can be analyzed and interpreted. This thesis aims at the development of an efficient
    detection pipeline suited for the task of detecting vehicles in aerial imagery,
    which are the objects of interest for a wide variety of applications. The focus
    hereby lies on vehicle detection in images recorded in top view, also referred
    to as nadir view, as it allows the coverage of large areas at uniform detail.
    For this purpose, deep learning techniques that show promising results in most
    fields of computer vision are explored to overcome shortcomings of conventional
    vehicle detection methods based on handcrafted features.


    # 1.2 Challenges


    Vehicle detection in aerial imagery captured from sensor platforms like aircraft,
    UAVs or satellites is a challenging task. The main reasons for this are the high
    distance between sensor and ground, the capturing conditions and varying scenarios
    due to different daytimes and regions. Figure 1.2 depicts the challenges in detail,
    which can be categorized as follows:


    +   1. Challenges arising from image acquisition:

    +      - **Image noise** is the random deviation from the real pixel intensity
    values. Main causes are statistical quantum fluctuations, the physics of the camera
    sensor and intensity quantization.

    +      - **Blurring** can have different reasons such as objects being out of
    focus, object motion as well as camera motion or camera shake. Motion blur occurs
    especially in case of weak illumination leading to longer camera exposure times.
    Blurring results in weak contrast and reduced sharpness.

    +      - **Illumination** strongly affects the image quality. Low illumination
    as in case of twilight requires longer exposure times leading to motion blur or
    resulting in increased image noise. Too strong illumination can cause saturation
    of the camera sensor, which leads'
  merge: -1
  img_proc: true
