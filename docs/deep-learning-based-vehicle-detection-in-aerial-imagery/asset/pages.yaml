  md: 'Qualitative detection examples (red boxes) and corresponding GT (green boxes)
    on DLR 3K with a GSD of 26 cm are visualized in Figure 8.5. While all detection
    methods show a good localization accuracy, applying the proposed detection method
    results in fewer false alarms caused by vehicle-like structures on buildings.
    However, for all methods, remaining false alarms are mainly due to objects located
