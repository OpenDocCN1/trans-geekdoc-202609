  md: 'methodologies including damage survey vehicles or unmanned ground vehicles
    possess innate limitations regarding accessibility and timeliness, imagery acquired
    by airborne platforms facilitates situational awareness and consequently disaster
    management in real-time [Ada11]. To support human operators suffering from cognitive
    overload, automatic damage assessment systems are required [Erd16].


    The growing traffic volume provoked an increased demand for automated traffic
    monitoring and management. Besides stationary cameras mounted near ground, induction
    loops embedded in pavements and pneumatic tubes stretched across roads used to
    estimate the traffic flow of particular areas, aerial imagery acquired by airborne
    platforms has proven to be an ideal complement allowing the coverage of large
    areas [Kan15]. With the rise of autonomous driving, novel applications are the
    generation of realistic data, i.e., vehicle trajectories extracted from aerial
    imagery, required as input for simulation tools and the acquisition of aerial
    imagery as reference for onboard sensors with a rather limited view of the overall
    scenario [Kur18].


    Aerial surveillance tasks range from border patrol to monitoring of large events.
    In recent years, the fast coverage of large borderlines even in difficult terrains
    has led to an increased use of airborne systems to prevent unwanted cross-border
    activities like smuggling or human trafficking, as existing solutions on the ground
    are often tedious, error-prone, costly and time-consuming [Ber16]. Airborne systems
    further facilitate continuous monitoring of a particular area as in case of large
    events, e.g., festivals and sports events, whereby the recorded aerial imagery
    provides fast access to situational information required by organizers and security
    teams on the ground in case of emergency or traffic management [Röm16].


    All these applications share the need for an automated processing chain to assess
    the aerial imagery. Assessing huge amounts of data as in case of traffic monitoring
    or aerial surveillance by human operators is not workable in a time-efficient
    and cost-effective manner, while assistance for human operators is required in
    case of search and rescue tasks and disaster relief to counteract cognitive overload
    caused by dynamic and complex environments. Key component of such processing chains
    is an accurate detection of all relevant'
