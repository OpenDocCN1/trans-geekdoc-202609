    # 2.1.3 CNN Training


    The training of a CNN is generally performed in a supervised manner by back-propagation
    with an objective function termed loss function L. The loss function designed
    for a specific task compares the predicted values of the network to the ground
    truth (GT) and computes an error measure. In the context of object detection,
    two types of loss functions, i.e., classification loss and regression loss, are
    frequently applied as described in more detail in Section 5.1. Common choice for
    the classification loss function is the softmax loss [Dud12], while smooth L1
    loss is widely used as regression loss function [Gir15]. A common optimization
    method is stochastic gradient descent (SGD) where the gradient is calculated for
    a small, randomly chosen subset of the training data called batch B and then back-propagated
    through all layers of the network [Mon12]. In each iteration t, the gradients
    are used to update the current weights of the network as follows:


    W^{t+1} = W^{t} + ΔW^{t} (2.4)'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'with


    $$\Delta \hat{\mathbf{W}}^t = \eta \sum_{x \in \mathcal{B}_t} \frac{\partial L_x}{\partial
    \mathbf{W}^t} \tag{2.5}$$


    being the gradient over the current batch $\mathcal{B}_t$. The gradient is weighted
    by the learning rate $\eta$ that specifies the step size in the gradient descent.
    To achieve faster convergence, a fraction $\omega$ of the previous weight update
    $\Delta \hat{\mathbf{W}}^{t-1}$ is typically added to the current weight update:


    $$\mathbf{W}^{t+1} = \mathbf{W}^t + \Delta \hat{\mathbf{W}}^t + \omega \Delta
    \hat{\mathbf{W}}^{t-1}. \tag{2.6}$$


    Thus, this method called *momentum* allows to overcome plateaus in the loss function
    [Dud12]. Besides SGD with momentum, several alternative optimization methods that
    dynamically adapt the learning rate have been proposed, including AdaDelta [Zei12],
    AdaGrad [Duc11], RMSprop [Tie12], and Adam [Kin14]. Particularly, the latter optimization
    method, which is a combination of SGD with momentum and RMSprop, often leads to
    good results in practice with only little tuning of hyper-parameters. Thus, time-consuming
    training of several networks with vanilla SGD and various learning rate schedules
    is avoided.


    Overfitting – an over-adaptation to the employed training samples – is a general
    problem when training CNNs due to their large number of parameters. A common regularization
    method to address this problem is *weight decay*, which reduces the weights in
    each iteration by a small fraction $\delta$:


    $$\mathbf{W}^{new} = (1 - \delta) \mathbf{W}^{old}. \tag{2.7}$$


    This prevents the weights from growing too large, which otherwise dominate the
    output of the network. Another popular regularization method to avoid overfitting
    is *dropout* [Sri14]. During training, dropout deactivates neurons of particular
    layers with a given probability, forcing the network to learn redundant representations.
    Thus, formation of critical paths through the network specialized to the training
    samples is avoided.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'To avoid unstable training caused by vanishing or exploding gradients, a proper
    initialization of the network weights is important. Random initialization, e.g.,
    Xavier initialization [Glor10] or Kaiming initialization [He15], are often applied
    to address this issue. While random initialization allows more flexibility in
    the design of the network architecture, it often leads to less optimal results,
    especially in case of deep networks with many parameters and only a limited amount
    of available training data. Therefore, the weights of models pre-trained on very
    large datasets, e.g., the ImageNet classification challenge dataset comprising
    millions of images [Deng09], are commonly used in practice for initialization.


    As the gradient signal can become less stable with increasing depth of the network,
    *batch normalization* has been proposed to make the gradient propagation in the
    network more stable [Iof15]. In general, batch normalization is applied immediately
    before the activation function by normalizing the network activations $\tilde{h}_i
    = W_i h_{i-1} + b_i$ to zero mean and unit variance:


    $$\hat{\tilde{h}}_i = \frac{\tilde{h}_i - \mu_{\mathcal{B}}\mathbf{e}}{\sqrt{\sigma_{\mathcal{B}}^2
    + \epsilon}}$$  \tag{2.8}


    where $\mu_{\mathcal{B}}$ and $\sigma_{\mathcal{B}}^2$ are the mean and variance
    calculated for the current batch $\mathcal{B}$, while $\mathbf{e}$ is an all-ones
    vector with the same length as $\tilde{h}_i$. Furthermore, a small value $\epsilon$
    is added to prevent a division by zero. To restore the representation power of
    the network, a set of learnable parameters $\gamma_i$ and $\beta_i$ that scale
    and shift the normalized input are introduced:


    $$\tilde{h}_i^{BN} = \gamma_i\hat{\tilde{h}}_i + \beta_i\mathbf{e}$$  \tag{2.9}


    As batch normalization prevents activations to become very high or very low, it
    allows the usage of higher learning rates and thus, accelerates the training process.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 2.1.4 CNN Architectures


    Since the development of early CNN architectures like LeNet[LeC98] and AlexNet[Kri12],
    several novel CNN architectures have been proposed to increase the performance
    and allow for more efficient learning by rearranging the combinations of convolutional
    layers, pooling layers and fully connected layers. The most notable architectures
    that have been adapted for a broad range of computer vision tasks can be distinguished
    into *VGG*, *residual* and *inception* networks.


    Similar to prior state-of-the-art networks, e.g., AlexNet, VGG networks (named
    after the Visual Geometry Group from the University of Oxford) comprise convolutional
    layers and pooling layers followed by a sequence of fully connected layers arranged
    in a single path network [Sim14]. While prior state-of-the-art networks made use
    of computationally expensive 9 × 9 or 11 × 11 filters to achieve large receptive
    fields, VGG networks rely on sequences of 3 × 3 convolutional layers that emulate
    the effect of larger receptive fields. The use of sequences of small convolutional
    layers allowed to increase the network depth up to 19 layers and thus, the extraction
    of more complex image features. Its variant with 16 layers termed *VGG16* has
    become a popular choice as feature extractor in many computer vision tasks.


    Inception networks rely on a basic unit referred to as *inception module* (see
    Figure 2.7) [Sze15]. An inception module – first applied in GoogLeNet [Sze15]
    – consists of parallel branches with different sets of convolutional layers, which
    are aggregated through concatenation. As each branch possesses a different receptive
    field, the inception module allows the model to recover both local features via
    smaller convolutions and more global features through larger convolutions. Bottleneck
    layers, i.e., 1 × 1 convolutional layers, are often carried out to restrict the
    number of channels before larger convolutions. To reduce the computational complexity,
    recent variants do not use convolutions larger than 3 × 3. Therefore, large *k*
    × *k* convolutions are either replaced by sequences of 3 × 3 convolutions or factorized
    to a combination of 1 × *k* and *k* × 1 convolutions [Sze16, Sze17].'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/99de1214c29cbc525a14b293385af5cf_38_0.png)


    **Figure 2.7:** Inception module – the basic unit of inception networks consisting
