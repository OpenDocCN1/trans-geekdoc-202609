  md: '# 5.2.3 Object Dimensions


    In the following, the effect of the proposed adaptations with respect to the size
    of objects present in the aerial imagery is examined by varying the GSD. Because
    of the uniform GSD of DLR 3K and consequently small variations in vehicle dimensions,
    the original images with a GSD of 13 cm are rescaled for training and testing
    by factor 2/3 and 1/2 yielding GSDs of 19.5 and 26 cm, respectively. Hence, the
    mean object dimensions are reduced to 18.8 × 18.9 and 14.1 × 14.2 pixels. Figure
    5.16 shows the object size distributions for the different GSDs.


    ![](img/99de1214c29cbc525a14b293385af5cf_101_0.png)


    Figure 5.16: Distribution of object instance sizes for different GSDs.


