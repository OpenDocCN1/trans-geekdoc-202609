    while the pointwise convolution, i.e., a 1 × 1 convolution, is applied across
    all the D intermediate channels.


    ![](img/99de1214c29cbc525a14b293385af5cf_41_0.png)


    Figure 2.11: Schematic illustration of a depthwise separable convolution that
    factorizes the standard convolution into a depthwise convolution and a pointwise
