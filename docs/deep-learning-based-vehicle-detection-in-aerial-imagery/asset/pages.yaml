    # 2.3 Vehicle Detection in Aerial Imagery


    Over the last decades, a broad variety of detection methods has been developed
    for the task of vehicle detection in aerial imagery. In the following, the literature
    under review is restricted to vehicle detection in single aerial images, whereas
    methods aiming at moving object detection by exploiting image sequences, e.g.,
    frame differencing [Kum01, Rei06, Xia10], background subtraction [Rei10, Shi12,
    Lia12] or optical flow based methods [Yao08, Yu09, Sia12], are not considered
    as static objects such as parked vehicles are missed. In general, vehicle detection
    in aerial imagery is either performed by conventional detection methods based
    on handcrafted features or deep learning based methods.


    # 2.3.1 Conventional Vehicle Detection Methods


    Before the emergence of deep learning, vehicle detection in single aerial images
    was generally conducted by extracting handcrafted features followed by a classifier
    or cascade of classifiers. Therefore, various combinations of feature extraction
    techniques and classifiers have been explored. Ruskone et al. [Rus96] employed
    an MLP to analyze the intensity values of a pixel’s neighborhood for vehicle detection
    in aerial imagery. Eikvil et al. [Eik09] examined a combination of geometric-shape
    properties, gray level features and Hu moments to detect vehicles in high-resolution
    satellite images. Moranduzzo and Melgani [Mor12, Mor13] proposed the use of Scale-Invariant
    Feature Transform (SIFT) to extract key points, which are discriminated into points
    belonging to vehicles or background by means of an SVM classifier. In [Mor14b],
    the authors made use of Histogram of Oriented Gradients (HOG) features followed
    by SVMs to detect cars in images acquired by UAVs. Tuermer et al. [Tue13] adopted
    HOG features and disparity maps for vehicle detection in'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'dense urban areas. In [Lei10], the authors proposed adaptive boosting (AdaBoost)
    in combination with Haar-like features for vehicle detection in very high-resolution
    satellite images. Liu and Mattyus [Liu15] employed Integral Channel Features (ICF)
    and an AdaBoost classifier in a soft-cascade structure to achieve fast and robust
    vehicle detection in aerial imagery. Kembhavi et al. [Kem10] combined color probability
    maps, HOG and pairs of pixels followed by partial least squares to project the
    high-dimensional feature set onto a much lower dimensional subspace for vehicle
    detection in satellite images taken from Google Earth. In [Sha12], the authors
    explored the use of multiple visual features, i.e., Local Binary Pattern (LBP),
    HOG and opponent histogram, and intersection kernel SVM for vehicle detection
