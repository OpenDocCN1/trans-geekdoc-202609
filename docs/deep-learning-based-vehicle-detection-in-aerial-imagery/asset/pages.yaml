    and the number of tiles filtered out exemplarily for DLR 3K on the server setup.
    For this, the number of tiles considered for detection is fixed for each image
    and not based on the confidence score about the presence of at least one vehicle.
    The timings are performed accordingly to Section 5.2.4. Due to the auxiliary computational
    costs of the SAR module, the removed search area has to comprise at least 10 tiles,
    which is 40% of the image, to reduce the inference time. However, in case of images
    that comprise only a few tiles that contain at least one vehicle, the inference
    time decreases considerably, e.g., more than 125 ms if only 20% of the image regions
    are considered for detection. Note that the time spent for the auxiliary components
    and the proposal layer may be further reduced by implementing these layers in
    CUDA to allow computation on a GPU.


    ![](img/99de1214c29cbc525a14b293385af5cf_185_0.png)


    **Figure 7.11:** Speed-up in inference time between Faster R-CNN with and without
    SAR with respect to the number of tiles filtered out. Due to the additional computational
    costs of the SAR module, at least 10 tiles, which is 40% of the image, have to
    be filtered out to reduce the inference time.'
