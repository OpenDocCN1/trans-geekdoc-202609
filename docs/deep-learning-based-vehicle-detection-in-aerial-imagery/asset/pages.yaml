  md: '![](img/99de1214c29cbc525a14b293385af5cf_208_0.png)


    Figure 8.9: Qualitative examples of missed detections and false alarms for EMT-MFD
    Faster R-CNN with VGG16 (top row) and ZynqNet (bottom row) on the ITCVD dataset.
    Missed detections are mainly due to objects that are partially occluded, e.g.,
    by trees, or that are located in shadowed areas, while false alarms are mostly
    caused by structures located on asphalted areas.


    # DOTA


    In contrast to DLR 3K, the DOTA dataset comprises images from multiple sensor
    platforms and consequently, exhibits varying image qualities, differing scenarios
    and a larger variety of object appearances. Figure 8.10 depicts qualitative detection
    results (red boxes) and corresponding GT (green boxes) for EMT-MFD Faster R-CNN
    with VGG16 and with ZynqNet on images from the DOTA validation set. For this,
    only GT annotations for vehicle categories, i.e., small vehicles and large vehicles,
    are visualized, whereas further categories such as baseball diamond, harbor, bridge,
    etc. are not considered. All images are scaled during deployment to exhibit a
    similar GSD as in case of DLR 3K. Both EMT-MFD Faster R-CNN with VGG16 and ZynqNet
    exhibit a good localization and classification accuracy, which indicates the good
    transferability in case of differing scenarios and poor image quality. Furthermore,
    issues regarding the provided GT, i.e., poorly aligned bounding boxes and missing
    annotations, are illustrated, which impedes the validity of a quantitative analysis.
    Compared to Faster R-CNN with VGG16, applying the proposed methods results in
    clearly fewer false alarms caused by vehicle-like structures on buildings (see
    Figure 8.11), which confirms observations on ITCVD.'
  merge: -1
  img_proc: true
