- pgno: 199
  md: '# ## 8.2 Comparison to Related Work


    The combined EMT-MFD Faster R-CNN with SAR is in the following compared to representative
    existing work in the field of object detection in aerial imagery. As most of these
    approaches adopt deep learning based detection frameworks for the task of vehicle
    detection in aerial imagery, recently proposed deep learning based detection frameworks
    are further considered for the comparison. The detection performance for EMT-MFD
    Faster R-CNN with SAR and the detection methods from literature are given in Table
    8.10. The considered vehicle detection methods either adapt the size of the employed
    feature map [Car17, Aca18, Din18], exploit multiple feature maps [Guo18, Tay18],
    combine features from different layers [Den17, Din18, Yan18] or make use of a
    top-down architecture [Aca18, Guo18, Tay18] to account for the characteristics
    of aerial imagery. Note that the detection methods proposed for vehicle detection
    in aerial imagery are adopted unmodified. All the additionally used deep learning
    based detection frameworks have a top-down architecture and exploit multiple feature
    maps except for Faster R-CNN with OHEM. For each detection framework, the shallowest
    feature map has been selected in such a way that its dimensions are 1/4 of the
    input image in order to account for small-sized vehicles. Furthermore, the anchor
    box scales are adopted according to Table 5.6. To ensure a fair comparison, each
    model is trained on the identical training data with the same data augmentation
    settings.


    Amongst the vehicle detection methods, the best AP on DLR 3K is achieved for DYOLO
    and Adapted RetinaNet, which both comprise a top-down architecture similar to
    MFD Faster R-CNN in order to obtain feature maps enriched with more context information.
    Shallow YOLOv2, AVPN Faster R-CNN and DFL-CNN exhibit considerably worse AP compared
    to the other vehicle detection methods. Though both Shallow YOLOv2 and DFL-CNN
    specifically adapt the resolution of the employed feature map, the resulting resolution,
    i.e., 1/16 of the input image, which is the same for AVPN Faster R-CNN, is not
    sufficient to accurately detect small-sized vehicles as in case of DLR 3K. Overall,
    none of the examined vehicle detection methods accomplishes an AP that is on par
    with the AP achieved for EMT-MFD Faster R-CNN with SAR.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'One reason for this is the coarser feature map resolutions applied throughout
    the different methods, i.e., 1/8 or 1/16 of the input image, which may result
    in poorly located as well as duplicate detections (see Section 5.2.1). However,
    it is to mention that some of these approaches are designed for object detection
    in aerial imagery that comprise larger object instances such as NWPU.


