    # Integration of Spatial Context and Search Area Reduction


    ![](img/99de1214c29cbc525a14b293385af5cf_193_0.png)


    Figure 8.3: Schematic illustration of the MFD Faster R-CNN with SAR. Note that
    the combined feature map is divided into tiles and region proposals are only generated
    for tiles that are likely to contain at least one object based on the SAR classification.


    The SAR module is added to the MFD Faster R-CNN as illustrated in Figure 8.3.
    The model is trained in a stage-wise manner. MFD Faster R-CNN is initially trained
    according to Section 6.1.2. In the second stage, the SAR classifier is trained
    as specified in Section 7.2.2, whereby all convolutional layers are kept fixed.
    For deployment, the further components of the SAR module and the modified proposal
    layer are added to the framework and the settings stated in Section 7.2.2 are
    adopted.'
