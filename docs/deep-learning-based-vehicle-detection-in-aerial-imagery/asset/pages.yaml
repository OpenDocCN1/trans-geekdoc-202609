    # 7.2 Search Area Reduction


    Restricting the search area to areas of interest, e.g., roads for vehicle detection,
    is an often applied preprocessing step in conventional object detection pipelines.
    In particular for vehicle detection in aerial imagery, both the computational
    costs for extracting feature descriptors as well as the subsequent classification
    and the number of false positive detections are reduced. While benchmark detection
    datasets typically comprise objects that are almost image filling, only a small
    fraction of aerial imagery datasets is occupied by objects, i.e., vehicles, due
    to their small dimensions in the range of only a few pixels. For instance, images
    of PASCAL VOC 2007 are occupied by more than'
  merge: -1
  img_proc: true
- pgno: 175
  md: '50% with GT annotations, whereas in case of DLR 3K only about 1% of the images
    are covered by GT annotations. Therefore, the majority of the input image is no
    area of interest and is not relevant for predicting objects (see Figure 7.5).
    In case of real-world applications, this is often more distinct as the image fraction
    covered by vehicles often further decreases especially in rural areas that may
    contain no vehicle at all.


    ![](img/99de1214c29cbc525a14b293385af5cf_175_0.png)


    Figure 7.5: Examples of DLR 3K comprising large areas without vehicles.


    As conventional object detectors generally compute features for each candidate
    window separately, the restriction only to areas of interest is straightforward
    to realize, e.g., by prior filtering out of non relevant candidate windows. In
    the context of this thesis, a novel Search Area Reduction (SAR) module is proposed
    to reduce the search area within deep learning based detection frameworks such
    as Faster R-CNN. The extension of Faster R-CNN by the proposed SAR module is schematically
    illustrated in Figure 7.6. In essence, the SAR module divides the employed feature
    map into tiles that correspond to certain areas of the input image and predicts
    a confidence score of how likely a tile and consequently the respective area of
    the input image contains at least one object. Based on this confidence score,
    an adaptive set of tiles is forwarded to the components of the detection module,
    i.e., the RPN and'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'classification stage. By filtering out tiles that do not contain any vehicles,
    the inference time of the actual detection module is reduced. In contrast to previous
    approaches, the SAR module is directly integrated into the detection pipeline.
    For this purpose, the SAR module and Faster R-CNN are realized within a single
    network by sharing the convolutional features. In the following, the SAR module
    and the implementation details are presented in detail. Ablation experiments are
    further conducted to demonstrate the effect of the proposed SAR module on the
    inference time.


    ![](img/99de1214c29cbc525a14b293385af5cf_176_0.png)


    Figure 7.6: Schematic illustration of Faster R-CNN extended by an integrated Search
    Area Reduction (SAR) module to adaptively reduce the search area. The SAR module
    divides the input image into tiles and predicts a confidence score of how likely
    a tile contains at least one object. As only tiles that likely contain at least
    one object are forwarded to the components of the detection module, the inference
    time of the actual detection module is reduced.


    # 7.2.1 Search Area Reduction Module


    The main principle of the proposed approach to reduce the search area is the division
    of the input image into small tiles that are then classified into tiles containing
    at least one object or none. To realize this within a deep learning based detection
    framework, a SAR module comprised of three components is'
  merge: -1
  img_proc: true
