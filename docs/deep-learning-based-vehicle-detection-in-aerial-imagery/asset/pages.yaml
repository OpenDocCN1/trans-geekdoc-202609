  md: 'characterized by the *dilation coefficient* *d*, which defines the spacing
    between the elements of a filter. In practice, the filter elements are matched
    to distant elements of the input as illustrated in Figure 2.9 yielding a larger
    receptive field. Note that a dilated convolution with *d* = 1 is equivalent to
    the standard convolution.


    *Group convolutions*, first mentioned in [Kri12], have been proposed to reduce
    the computational costs of standard convolutions. Rather than applying filters
    with the full channel depth of the input image, i.e., *D* kernels per filter,
    the input is split channel-wise into groups and the filters are applied independently
    for each group (see Figure 2.10b). Letting *g* denote the number of groups, group
    convolution filters only consider *D/g* channels instead of the full channel depth
    *D*. Thus, the computational costs are reduced by a factor of *g* compared to
    standard convolutions.


    ![](img/99de1214c29cbc525a14b293385af5cf_40_0.png)


    Figure 2.10: Standard convolution (a) compared to group convolution with three
    groups (b).


    A *depthwise separable convolution* (DSC) performs convolutions independently
    in spatial and channel domains to reduce the number of parameters and the computational
    costs [Sif14]. It factorizes the standard convolution into a *depthwise convolution*
    and a *pointwise convolution* as visualized in Figure 2.11. The depthwise convolution
    is in essence a special case of group convolution with the same number of groups
    *g* and input channels *D*. Thus,'
