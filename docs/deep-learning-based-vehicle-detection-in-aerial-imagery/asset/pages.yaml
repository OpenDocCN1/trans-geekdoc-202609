- pgno: 92
  md: 'Visualizing the activations of three filters from *conv3_3* used as feature
    map and the corresponding detection results qualitatively show that the localization
    accuracy improves with an increasing feature map resolution (see Figure 5.6).
    Due to the increased feature map resolution, considerably more feature map pixels
    overlap with the object in the sample image compared to using *conv5_3* as illustrated
    in Figure 5.5. Thus, even fine object parts such as the windshield are covered
    by multiple feature map pixels and an accurate prediction of the object boundaries
    is facilitated.


    # Analysis of the Localization Accuracy


    In the following, a detailed analysis of the detection results is provided to
    substantiate the impact of the feature map resolution. First, the detection results
    are examined with respect to the localization accuracy by varying the IoU threshold
    value used to accept GT objects as recalled. PRCs for the different feature map
    resolutions and varying IoU thresholds are given in Figure 5.7.


    ![](img/99de1214c29cbc525a14b293385af5cf_92_0.png)


    **Figure 5.7:** Precision-recall curves for various IoU thresholds used to accept
    GT objects as recalled. Exploiting feature maps with higher resolutions results
    in better localization quality as the performance decreases clearly less with
    increasing threshold values.


    Higher feature map resolutions exhibit fewer variations in detection performance
    with varying IoU thresholds. For *conv3_3*, the detection performance is only
    slightly improved with lower IoU threshold values as most detections'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'have a high overlap to the GT annotations. In contrast, the detection performance
    for *conv3_3* is clearly improved by applying weaker IoU criteria. Hence, employing
    higher feature map resolutions yields superior localization accuracy.


    ![](img/99de1214c29cbc525a14b293385af5cf_93_0.png)


    **Figure 5.8:** Error analysis of false positive detections for *conv3_3*.


    ![](img/99de1214c29cbc525a14b293385af5cf_93_1.png)


    **Figure 5.9:** Error analysis of false positive detections for *conv5_3*.


    The error analysis of false positive detections visualized in Figures [5.8](#)
    and [5.9](#) underlines the improved localization accuracy in case of higher feature
    maps. For this, all FPs with a confidence score equal to or greater than 0.5 are
    distinguished into localization errors and classification errors, respectively.
    Following [Hoi12], localization errors are duplicate detections and detections
    with misaligned bounding boxes, i.e., detections possessing an IoU to a GT annotation
    between 0.1 and 0.5. All other FPs are categorized as classification'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'errors. In case of conv3_3 only about 10% of all FPs are due to localization
    errors, whereby most localization errors boast an IoU above 0.4. In contrast,
    more than 90% of all FPs in case of conv5_3 are caused by misaligned bounding
    boxes or duplicate detections. Overall, the number of FPs due to localization
    errors is reduced by a factor of 46 for conv3_3, which confirms the assumption
    that an increased feature map resolution is necessary to accurately localize tiny
    objects such as vehicles in aerial imagery.


    # Impact on the RPN


    As described in Section 5.1, the localization of relevant objects is initially
    done by the RPN, as region proposals that most likely contain a relevant object
    are identified. The relation between the feature map resolution and the generated
    region proposals is depicted in Figure 5.10 by means of recall-IoU curves. Therefore,
    the IoU threshold value used to accept a GT object as covered at least by one
    region proposal is varied in steps of 0.05 in the range between 0 and 1.0. To
    compute the recall, only the top-2000 ranked region proposals after NMS are considered,
    which are equivalent to the region proposals forwarded to the classification stage
    in the preceding experiments. Using the output of conv3_3 as feature map results
    in region proposals exhibiting overall the best overlap to the GT annotations.
    While the recall values are only marginally lower in case of conv2_2, exploiting
    feature maps with higher resolutions, i.e., using the output of conv4_3 and conv5_3,
    respectively, delivers candidate regions with clearly worse overlap to the GT
    annotations. The decline in recall gets more distinctive with higher feature map
    resolutions, in particular for IoU threshold values above 0.4. Since only region
    proposals with an overlap above 0.5 are considered as positive samples for the
    training of the classification stage as described in Section 5.1.2, multiple GT
    objects are not adequately covered by region proposals to be classified with high
    confidence as vehicle. Hence, the probability of missed detections intensifies
    and consequently the detection performance drops.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/99de1214c29cbc525a14b293385af5cf_95_0.png)


    **Figure 5.10:** Recall-IoU curves for different feature map resolutions. Exploiting
    feature maps with high resolutions delivers candidate regions with higher overlap
    to GT annotations.


    # ### 5.2.2 Anchor Box Settings


    The detection accuracy is strongly affected by the quality of candidate regions
    predicted by the RPN, as only a specified number of candidate regions is forwarded
    to the classification stage, while all other candidate regions are discarded.
    Besides the employed feature map (see Section [5.2.1](#)), the quality of candidate
    regions depends on the configured anchor box settings, i.e., dimensions and aspect
    ratios of anchor boxes used for bounding box regression [Ren15]. By default, 3
    different scales and 3 different aspect ratios are used, resulting in 9 anchor
    boxes at each location. While the default anchor box scales, yielding box areas
    of 128², 256², and 512² pixels, are in the range of objects within the benchmark
    detection datasets¹, these scales considerably exceed the mean vehicle dimensions
    in aerial imagery, e.g., 28.2 × 28.3 pixels in case of DLR 3K. Using the default
    anchor box settings results in clearly lower AP compared to anchor boxes in the
    range of vehicles within DLR 3K


    ¹ For instance, PASCAL VOC2007 comprises objects with an average size of 143.2
    × 148.3 pixels. By default, Faster R-CNN rescales the input images so that the
    shorter size equals 600 pixels, which results in an effective average object size
    of 241.3 × 248.7 pixels.'
  merge: -1
  img_proc: true
