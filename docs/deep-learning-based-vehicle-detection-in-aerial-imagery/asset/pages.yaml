- pgno: 218
  md: 'time of the entire detection pipeline may not be sufficient for some applications.
    The main bottleneck is an inefficient proposal generation, which can be addressed
    by transferring the corresponding processing steps to the GPU, as implemented
    in novel frameworks like the MMDetection toolbox based on PyTorch [Che19b]. Integrating
    the components proposed in this thesis into single-stage detection frameworks
    offers an alternative to overcome issues with regard to the proposal generation.
    A promising way to decrease the overall inference time is making use of the NVIDIA
    TensorRT'' library, which facilitates high-performance inference of different
    deep learning frameworks. By combining layers and optimizing kernel selection
    for improved latency, throughput, power efficiency and memory consumption, TensorRT
    optimizes the inference time of a given pre-trained network. Moreover, TensorRT
    offers out-of-the-box INT8 quantization and FP16 precision implementations of
    common layers as further options to accelerate the inference time.


    So far, the proposed detection pipeline is limited to a single vehicle class in
    aerial imagery recorded in top-down view due to the low availability of annotated
    training data. However, distinguishing between vehicle classes, e.g., car and
    truck, is highly relevant for applications such as traffic monitoring and management,
    while an accurate detection in images recorded in oblique view is often prerequisite
    for applications like disaster relief and search and rescue tasks. As deep learning
    is largely data-driven, the trend of getting bigger and more extensive datasets,
    emerging in different computer vision domains including object detection in aerial
    imagery, facilitates the learning of more complex tasks. The VisDrone dataset
    [Zhu18] for instance comprises more than 2.6 million annotations for different
    object categories, e.g., pedestrian, car, truck, etc., in images recorded by UAVs
    with different perspectives. Besides the new extension options, novel challenges
    arise that have to be addressed. Especially imbalanced data that may yield biased
    rules in favor of the majority class and the large variety of object scales ranging
    from a few to hundreds of pixels complicate the detection task. Furthermore, recent
    developments in the field of object detection in aerial imagery focus on the transition
    from axis-aligned bounding boxes to oriented bounding boxes, which


