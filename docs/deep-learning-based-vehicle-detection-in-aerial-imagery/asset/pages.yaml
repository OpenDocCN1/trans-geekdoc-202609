    For deployment, the sub-division-SAR layer, sub-division-RPN layer, and the modified
    proposal layer are added to the framework to perform the search area reduction
    and the detection in a single network as depicted in Figure 7.7. For each tile,
    NMS is applied on the 400 region proposals exhibiting the highest confidence score.
    The top-80 ranked proposals after NMS are then forwarded to the classification
    stage. As the input images are divided into 25 tiles, the maximum number of proposals
    before and after NMS are 10,000 and 2,000, respectively, which is equivalent to
    the numbers for Faster R-CNN without the SAR module (see Section 5.1.3). The further
    settings are analogous to the settings employed for Faster R-CNN without the SAR
    module.


