    # 6.2.4 Adaptation to the DLR 3K Dataset


    As shown in Section 6.2.2 and Section 6.2.3, the proposed approaches achieve good
    detection results on the Potsdam dataset. However, the comprised training data
    is comparatively poor because of the utilized semantic labeling procedure and
    the use of ortho-rectified RGB images, which may impede the learning of optimal
    feature representations. The main issue regarding the utilized semantic labeling
    procedure is the labeling of vehicles beneath trees as category tree though the
    vehicles are clearly visible (see Figure 4.7), while the employed RGB images comprise
    distinctive artifacts (see Figure 6.17). To overcome these issues, semantic labeling
    masks are generated for the DLR 3K dataset within the context of this thesis.
    A refined and enhanced version of the dataset is made publicly available as aforementioned
    in cooperation with the DLR. As depicted in Figure 6.18, the six categories of
    the Potsdam dataset are adopted. In contrast to the Potsdam dataset, vehicles
    beneath trees that are clearly visible are labeled as category car. In addition,
    the DLR 3K dataset extended by semantic labeling masks allows the comparison of
    the proposed approaches with further vehicle detection methods. Note that the
    Potsdam dataset originally designed for the task of semantic labeling of high-resolution
    aerial imagery comprises no bounding box annotations and thus, is only rarely
    considered for the task of vehicle detection in literature.'
