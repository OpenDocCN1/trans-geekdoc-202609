    The impact of the SAR module on the inference time is reported in Table 8.7. The
    time spent for the RPN and classification stage on the server setup are reduced
    by 32% and 76%, respectively, yielding an overall decrease of 21%, while the detection
    accuracy slightly drops by 0.1% in AP, which is on par with the detection accuracy
    achieved for MFD Faster R-CNN with a lightweight base network (see Table 8.5).


    # Lightweight Feature Extraction and Search Area Reduction


    The usage of lightweight architectures as base network as well as the restriction
    of the search area exhibit an improved inference time. To further speed up the
    inference time, the SAR module is inserted into Faster R-CNN and the default base
    network is replaced by ZynqNetα=1.00. To this end, the output from the 5th Fire
    module is considered as feature map for the RPN and classification stage. The
    auxiliary Fire modules, i.e., the 6th through the 9th Fire module, followed by
    max pooling, a sequence of fully connected layers'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'and a softmax layer are employed as SAR classifier. For this, the sequence
    of fully connected layers is adopted according to Section 7.2.1. VGG0.5-Head is
    employed as classification head, which exhibits the best trade-off between inference
    time and AP. The model is trained in two stages as described in Section 7.2.2.
    The detection part is first trained with the settings specified in Section 7.1.5,
    while the SAR classifier is trained as described in Section 7.2.2. The further
    components of the SAR module and the modified proposal layer are inserted for
    deployment as shown in Figure 7.7. Furthermore, the settings for deployment proposed
    in Section 7.2.2 are applied.


    Table 8.8 shows the overall inference time and the time spent for each component
    of Faster R-CNN with SAR and lightweight feature extraction. Inserting the SAR
    module into Faster R-CNN with ZynqNet as base network achieves overall the best
    inference time. The usage of the lightweight base network results in clearly reduced
    time spent for feature extraction. Furthermore, the time spent for classification
    decreases due to the more lightweight classification head. Inserting the SAR module
    into Faster R-CNN with ZynqNet as base network results in clearly less time spent
    for generating region proposals and classification compared to its counterpart
    without SAR, while the detection accuracy only worsens by 0.1% in AP. In comparison
    to the baseline Faster R-CNN, the overall inference time is speeded up by 53%
    and 75% on the server and the desktop setup, respectively, as the times spent
    for each component are clearly reduced, whereas the detection accuracy only drops
    by 0.2% in AP. Note that all timings are repeated for the models pre-trained on
    augmented data and thus, the reported inference times may vary slightly compared
    to their counterparts without augmented data given in previous chapters. The most
    time-consuming component of Faster R-CNN with SAR and lightweight feature extraction
    is the RPN. A reason for this is the proposal layer implemented in Python that
    computes the final coordinates and sorts all proposals by the predicted confidence
    score on the CPU.'
