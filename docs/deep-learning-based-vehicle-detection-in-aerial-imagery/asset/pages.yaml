- pgno: 118
  md: 'training procedure. Next, the layers to integrate features from deeper layers
    are appended to the network, which is then trained for further 20,000 iterations.
    For this, the added layers are initialized by using the Gaussian weight filler
    method, while all other weights are initialized by the previously fine-tuned Faster
    R-CNN. Both alternative training schemes exhibit improved AP compared to the baseline
    Faster R-CNN, which confirms the improved detection performance in case of employing
    more semantic and contextual information. Nevertheless, using the three-stage
    training procedure results in clearly better detection performance. As the network
    learns an accurate localization in the first stage, the enhancement of the employed
    feature map with features from deeper layers via learned up-sampling and combination
    is facilitated in the subsequent stages compared to the single stage training.


    Table 6.2: Impact of the training procedure on the detection performance. Successively
    adding features from deeper layers results in better AP.


    | Training scheme | AP (in %) |

    |---|---|

    | One-stage | 84.0 |

    | Two-stage | 84.8 |

    | Three-stage | **85.3** |


    # 6.2 Semantic Context


    An alternative strategy to overcome the lack of contextual information in deep
    learning based detectors adapted for vehicle detection in aerial imagery is the
    exploitation of semantic labeling networks. Semantic labeling is essentially a
    pixel-wise classification of an input image. Integrating semantic labeling into
    the detection framework allows the introduction of semantic context information,
    i.e., local surrounding of an object to detect, and thus, seems promising to reduce
    the number of false positive detections, which are often caused by rectangular
    structures in image regions that are unlike to contain vehicles such as buildings.
    For this purpose, two differing methods to integrate the semantic labeling network
    into the detection pipeline are proposed.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'The remainder of this section is organized as follows. First, auspicious architectures
    for semantic labeling of aerial imagery are presented. Then, the two proposed
    methods are described in detail and ablation experiments on the ISPRS 2D Semantic
    Labeling Challenge Potsdam dataset are provided. Finally, an evaluation on a novel
    semantic labeling dataset based on DLR 3K is performed to emphasize the effect
    of integrating semantic labeling on the detection performance.


    # 6.2.1 Semantic Labeling Approaches


    Several CNN architectures have been proposed for the task of semantic labeling.
    In the following, four promising architectures that are examined within the context
    of this thesis are introduced. Note that all considered architectures are based
    on the VGG16 architecture to facilitate the fusion of the semantic labeling network
    with the Faster R-CNN detection network proposed in Section 6.2.3.


    # FCN-32s


    ![](img/99de1214c29cbc525a14b293385af5cf_119_0.png)


    Figure 6.4: Schematic structure of FCN-32s. The first two fully connected layers
    of VGG16 are cast into convolutional layers with kernel size 7 × 7 and kernel
    size 1 × 1, respectively, while the last fully connected layer is replaced by
    a 1 × 1 convolutional layer with 6 channels. To up-sample the output of the last
    convolutional layer by a factor of 32, a deconvolutional layer with kernel size
    64 × 64 and stride 32 is appended.


    FCN-32s [Lon15] depicted in Figure 6.4 is a fully convolutional network (FCN)
    designed for the task of semantic labeling. For this, the fully connected layers'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'of the default architecture, i.e., VGG16 (see Table 5.1), are converted into
    convolutional layers. As fully connected layers can be viewed as convolutions
    covering the entire input dimensions [Lon15], fc6, whose input dimensions are
    7 × 7 × 512, is cast into a convolutional layer with kernel size 7 × 7 and the
    subsequent fully connected layer fc7 is transformed into a convolutional layer
    with kernel size 1 × 1. The last fully connected layer originally used as classification
    layer is discarded and a 1 × 1 convolutional layer with 6 channels is appended
    in case of the Potsdam dataset to predict scores for each category at each of
    the coarse feature map locations. Finally, pixel-wise predictions for the input
    image are achieved by up-sampling the coarse predictions via a single deconvolutional
    layer. Per-pixel softmax loss is used to train the semantic labeling network.


    # FCN-16s


    ![](img/99de1214c29cbc525a14b293385af5cf_120_0.png)


    Figure 6.5: Schematic structure of FCN-16s. As opposed to FCN-32, the output of
    the last convolutional layer is up-sampled by a factor of two via deconvolution
    with kernel size 4 × 4 and stride 2 and then combined via element-wise addition
    with the output of the 4th pooling layer. Note that the number of channels is
    adjusted by an additional 1 × 1 convolutional layer. A deconvolutional layer with
    kernel size 32 × 32 and stride 16 is used to up-sample the combined features by
    a factor of 16.


    As FCN-32s outputs semantic labeling results with fuzzy boundaries due to the
    coarse prediction layer, FCN-16s [Lon15] extends FCN-32s by combining features
    from a deep, coarse layer with features from a shallow, fine layer to overcome
    this drawback (see Figure 6.5). Instead of up-sampling the output of'
