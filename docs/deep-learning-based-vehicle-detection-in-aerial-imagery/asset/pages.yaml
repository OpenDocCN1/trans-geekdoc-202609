- pgno: 179
  md: 'The original proposal layer computes the actual coordinates of each region
    proposal by adding the predicted offsets to the respective reference bounding
    box. As the reference bounding box is given in tile coordinates, the proposal
    layer of the RPN is modified in order to map the region proposals to their position
    in the input image. Therefore, a position vector generated by the sub-division-RPN
    layer is taken as an additional input. The position vector encodes the position
    of each tile that is forwarded from the sub-division-RPN with regard to its position
    in the input image. The actual coordinates of each region proposal are then computed
    by adding the offsets for the respective tile to its position given in tile coordinates.
    All mapped region proposals are then forwarded to the classification stage.


    # 7.2.2 Implementation Details


    To train the extended Faster R-CNN, a training strategy comprised of two stages
    is performed. Note that training both Faster R-CNN and the SAR classifier at once
    is not possible, as Faster R-CNN requires at least one GT object per training
    image, whereas the SAR classifier requires images with and without GT objects.
    In the first stage, Faster R-CNN is trained end-to-end for 60,000 iterations.
    For this, the training settings described in Section 5.1.3 are adopted. Then,
    the SAR classifier is trained in the second stage. To account for the input image
    dimensions of the default VGG16 classifier used as base architecture, the images
    of the DLR 3K dataset are split into sub-images of size 224 × 224 pixels. Adjacent
    sub-images exhibit an overlap of 46 pixels. The sub-images are divided into two
    categories: the first comprises all sub-images without any GT annotation and the
    second contains all sub-images with at least one GT annotation. For each sub-image,
    only GT annotations with an overlapping area of 10 or more pixels to the current
    sub-image are considered. Furthermore, data augmentation, i.e., horizontal and
    vertical flipping, is performed for each sub-image yielding a total of 19,200
    training images, whereof 4,656 images belong to the category with at least one
    object. Example images of the training set are depicted in Figure 7.8.'
