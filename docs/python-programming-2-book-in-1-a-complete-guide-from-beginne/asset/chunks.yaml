  fmt: "\n# Chapter 5: Operator module in Python\n\nOperators are a mathematical entity\
    \ which are usually used to combine expressions and statements. In regular mathematical\
    \ expressions, operators can change the result that is going to obtain. Python\
    \ also provides an `operator` module that can explicitly impact the results that\
    \ will be obtained. In this chapter, we will in detail discuss various operators\
    \ that are available in the latest versions of Python.\n\n## Mathematical operators\n\
    \nWhenever we are learning a programming language it is essential to master mathematical\
    \ operators because a lot of programs use mathematical calculations to perform\
    \ the operations. For example, to rotate an image in a photo viewer software programmers\
    \ use transpose of mathematical matrices. As we all know that mathematics has\
    \ standard operations known as addition, subtraction, multiplication, and division.\
    \ Python also provides a modulus operator to obtain the remainder of the mathematical\
    \ operation. In the next section, we will explain these mathematical operations\
    \ with various examples.\n\n### Addition operator `+`\n\n```\nfirst = 2\nsecond\
    \ = 3\nresult = first + second\n# Result will output 5\n```\n\n### Subtraction\
    \ operator `-`\n\n```\nfirst = 3\nsecond = 2\nresult = first - second\n# Result\
    \ will output 1\n```\n\n### Multiplication operator `*`\n\n```\nfirst = 2\nsecond\
    \ = 3\nresult = first * second\n# Result will output 6\n```\n\n### Division operator\
    \ `/`\n\n```\nfirst = 6\nsecond = 2\nresult = first / second\n# Result will output\
    \ 3\n```\n\n### Modulus operator `%`\n\n```\nfirst = 7\nsecond = 6\nresult = first\
    \ % second\n# Result will output 1\n```\n\nApart from these basic mathematical\
    \ operations Python also provides an exponential operator `**`.\n\n### Exponential\
    \ operator `**`\n\n```\nfirst = 5\nsecond = 3\nresult = first ** second\n# Result\
    \ will output 125\n```\n\n> **Note:** Python follows hierarchical rules to perform\
    \ mathematical operations. Python also provides operator precedence to maintain\
    \ a structural organization for the operations. This is the sole reason why you\
    \ need to use parenthesis to categorically group the operators.\n\n## Operator\
    \ precedence\n\nOperator precedence is an essential concept in programming languages\
    \ while dealing with complex logical expressions. Python gives the exponential\
    \ operator the highest precedence following by the multiplication, division and\
    \ modulus operators. Addition and Subtraction belong to the bottom layer of the\
    \ operator precedence. In the next section, we will in-depth explain about the\
    \ comparison operators that are often used for determining a logic in an expression.\
    \ While dealing with complex machine learning data the machine needs to categorize\
    \ and determine the data using these simple comparison operators.\n\n## Comparison\
    \ Operators\n\nComparison operators are used in combining statements and to create\
    \ logical expressions. There are a lot of comparison operators that can help you\
    \ easily create logics for many mathematical functions. In the next section, we\
    \ will in detail discuss various comparison operators. We have four comparison\
    \ operators. An example program is given to help you understand how comparison\
    \ operators work.\n\n### a) Greater than `>`\n\nHere is an example to help you\
    \ understand greater than operator:\n\n```\nfirst = 5\nsecond = 3\nif (first >\
    \ second):\n    print(\"This is the greater perspective\")\nelse:\n    print(\"\
    This is the lower perspective\")\n# Result will output the first statement\n```\n\
    \n### b) Less than `<`\n\nHere is an example to help you understand less than\
    \ operator:\n\n```\nfirst = 5\nsecond = 3\nif (first < second):\n    print(\"\
    This is the lower perspective\")\nelse:\n    print(\"This is the greater perspective\"\
    )\n# Result will output the second statement\n```\n\n### c) Equal to `==`\n\n\
    Here is an example to help you understand Equal to operator:\n\n```\nfirst = 5\n\
    second = 3\nif (first == second):\n    print(\"These two are the same\")\nelse:\n\
    \    print(\"These two are not the same\")\n# Result will output the second statement\n\
    ```\n\n### d) Not Equal to `!=`\n\nHere is an example to help you understand Not\
    \ Equal to operator:\n\n```\nfirst = 5\nsecond = 3\nif (first != second):\n  \
    \  print(\"These two are not the same\")\nelse:\n    print(\"These two are same\"\
    )\n# Result will output the first statement\n```\n\nWith this, we have completed\
    \ a small introduction to comparison operators. In the next section, we will in\
    \ detail discuss Logical operators that are important for performing advanced\
    \ data science operations.\n\n## Logical Operators\n\nLogic is an important assignment\
    \ component while dealing with complex programs. A lot of python programs consist\
    \ of conditional and loop statements with logical operators. There are fundamentally\
    \ three logical operators which we will now discuss in detail.\n\n### a) `and`\n\
    \nThis is a logical operator that can be used when you are looking forward to\
    \ printing an expression when two statements are satisfied. It is represented\
    \ by `and`. Here is an example:\n\n```\nfirst = 2\nsecond = 3\nthird = 5\nif (first\
    \ == 2 and second == 5):\n    print(\"This is right\")\nelse:\n    print(\"This\
    \ is wrong\")\n```\n\nNow, the program will check whether both first and second\
    \ have the same values. As the second variable is not satisfied `This is wrong`\
    \ will be displayed as the result.\n\n### b) `or`\n\nThis is a logical operator\
    \ that can be used when you are looking forward to printing an expression when\
    \ any one of the two statements are satisfied. It is represented by `or`. Here\
    \ is an example:\n\n```\nfirst = 2\nsecond = 3\nthird = 5\nif (first == 2 or second\
    \ == 5):\n    print(\"This is right\")\nelse:\n    print(\"This is wrong\")\n\
    ```\n\nNow, the program will check whether any one of the first and second have\
    \ the same values. As the first variable satisfies the condition `This is right`\
    \ will be displayed as the result.\n\n### c) `not`\n\nThis acts as a negation\
    \ operator. That is, it will print when a condition is not satisfied. It is usually\
    \ represented by `not`.\n\nWith this, we have completed a thorough explanation\
    \ of operators in Python. In the next chapter, we will start discussing advanced\
    \ concepts related to iterations and comprehensions.\n"
  trans: "\n# 第 5 章：Python 中的 operator 模块\n\n运算符是一种数学实体，通常用于组合表达式和语句。在常规数学表达式中，运算符可以改变将要获得的结果。Python\
    \ 还提供了一个 `operator` 模块，可以显式影响将要获得的结果。在本章中，我们将详细讨论最新版本 Python 中可用的各种运算符。\n\n##\
    \ 数学运算符\n\n每当我们学习一门编程语言时，掌握数学运算符都是必不可少的，因为许多程序使用数学计算来执行操作。例如，在照片查看器软件中旋转图像时，程序员会使用数学矩阵的转置。众所周知，数学有标准运算，称为加法、减法、乘法和除法。Python\
    \ 还提供了取模运算符，用于获取数学运算的余数。在下一节中，我们将通过各种示例解释这些数学运算。\n\n### 加法运算符 `+`\n\n```\nfirst\
    \ = 2\nsecond = 3\nresult = first + second\n# 结果将输出 5\n```\n\n### 减法运算符 `-`\n\n\
    ```\nfirst = 3\nsecond = 2\nresult = first - second\n# 结果将输出 1\n```\n\n### 乘法运算符\
    \ `*`\n\n```\nfirst = 2\nsecond = 3\nresult = first * second\n# 结果将输出 6\n```\n\
    \n### 除法运算符 `/`\n\n```\nfirst = 6\nsecond = 2\nresult = first / second\n# 结果将输出\
    \ 3\n```\n\n### 取模运算符 `%`\n\n```\nfirst = 7\nsecond = 6\nresult = first % second\n\
    # 结果将输出 1\n```\n\n除了这些基本数学运算外，Python 还提供了指数运算符 `**`。\n\n### 指数运算符 `**`\n\n```\n\
    first = 5\nsecond = 3\nresult = first ** second\n# 结果将输出 125\n```\n\n> **注意：**\
    \ Python 遵循层级规则来执行数学运算。Python 还提供了运算符优先级，以维护运算的结构化组织。这就是为什么你需要使用括号来明确地对运算符进行分组的唯一原因。\n\
    \n## 运算符优先级\n\n在处理复杂逻辑表达式时，运算符优先级是编程语言中的一个基本概念。Python 赋予指数运算符最高优先级，其次是乘法、除法和取模运算符。加法和减法属于运算符优先级的最底层。在下一节中，我们将深入解释常用于确定表达式逻辑的比较运算符。在处理复杂的机器学习数据时，机器需要使用这些简单的比较运算符对数据进行分类和判断。\n\
    \n## 比较运算符\n\n比较运算符用于组合语句和创建逻辑表达式。有许多比较运算符可以帮助你轻松地为许多数学函数创建逻辑。在下一节中，我们将详细讨论各种比较运算符。我们有四个比较运算符。提供了一个示例程序来帮助你理解比较运算符的工作原理。\n\
    \n### a) 大于 `>`\n\n这是一个帮助你理解大于运算符的示例：\n\n```\nfirst = 5\nsecond = 3\nif (first\
    \ > second):\n    print(\"This is the greater perspective\")\nelse:\n    print(\"\
    This is the lower perspective\")\n# 结果将输出第一条语句\n```\n\n### b) 小于 `<`\n\n这是一个帮助你理解小于运算符的示例：\n\
    \n```\nfirst = 5\nsecond = 3\nif (first < second):\n    print(\"This is the lower\
    \ perspective\")\nelse:\n    print(\"This is the greater perspective\")\n# 结果将输出第二条语句\n\
    ```\n\n### c) 等于 `==`\n\n这是一个帮助你理解等于运算符的示例：\n\n```\nfirst = 5\nsecond = 3\nif\
    \ (first == second):\n    print(\"These two are the same\")\nelse:\n    print(\"\
    These two are not the same\")\n# 结果将输出第二条语句\n```\n\n### d) 不等于 `!=`\n\n这是一个帮助你理解不等于运算符的示例：\n\
    \n```\nfirst = 5\nsecond = 3\nif (first != second):\n    print(\"These two are\
    \ not the same\")\nelse:\n    print(\"These two are same\")\n# 结果将输出第一条语句\n```\n\
    \n至此，我们完成了比较运算符的简要介绍。在下一节中，我们将详细讨论对执行高级数据科学操作非常重要的逻辑运算符。\n\n## 逻辑运算符\n\n在处理复杂程序时，逻辑是一个重要的组成部分。许多\
    \ Python 程序由带有逻辑运算符的条件语句和循环语句组成。从根本上说，有三个逻辑运算符，我们现在将详细讨论它们。\n\n### a) `and`\n\n\
    这是一个逻辑运算符，当你希望在两个语句都满足时打印表达式时可以使用它。它由 `and` 表示。这是一个示例：\n\n```\nfirst = 2\nsecond\
    \ = 3\nthird = 5\nif (first == 2 and second == 5):\n    print(\"This is right\"\
    )\nelse:\n    print(\"This is wrong\")\n```\n\n现在，程序将检查 first 和 second 是否都具有相同的值。由于第二个变量不满足条件，`This\
    \ is wrong` 将作为结果显示。\n\n### b) `or`\n\n这是一个逻辑运算符，当你希望在两个语句中任意一个满足时打印表达式时可以使用它。它由\
    \ `or` 表示。这是一个示例：\n\n```\nfirst = 2\nsecond = 3\nthird = 5\nif (first == 2 or\
    \ second == 5):\n    print(\"This is right\")\nelse:\n    print(\"This is wrong\"\
    )\n```\n\n现在，程序将检查 first 和 second 中是否有任意一个具有相同的值。由于第一个变量满足条件，`This is right` 将作为结果显示。\n\
    \n### c) `not`\n\n这充当否定运算符。也就是说，当条件不满足时它将执行打印。它通常由 `not` 表示。\n\n至此，我们完成了对 Python\
    \ 中运算符的详细解释。在下一章中，我们将开始讨论与迭代和推导式相关的高级概念。\n"
