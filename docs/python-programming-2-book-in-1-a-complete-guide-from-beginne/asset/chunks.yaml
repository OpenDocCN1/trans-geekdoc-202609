    \nNext, the four types will be explained in detail.\n\n![Lavoro, Digitando, Computer,\
    \ Notebook, Programmazione](rsrc3CB.jpg)\n\n## Functions without Parameters and\
    \ Return Values\n\nFunctions with no parameters and no return value can neither\
    \ receive parameters nor return values. Next, the use of this type of function\
    \ is demonstrated by a function that prints prompts, as shown in the example below.\n\
    \n**Example: Functions Without Parameters and Return Values**\n\n```\ndef printresults():\n\
    \    # This is your place to choose\n    # display('Order your items here')\n\
    \    { Now enter the output required for the entities}\nprintresults()\n```\n\n\
    ## Functions with No Parameters but Returns Values\n\nThis type of function cannot\
    \ receive parameters, but it can return some data. Generally, this type of function\
    \ is used when collecting data. Next, we will demonstrate through an example.\n\
    \n**Example: Functions with No Parameters but Returns Values**\n\n```\n# This\
    \ will give temperature\ndef result():\n    # Here are some processing procedures\
    \ for obtaining temperature.\n    # For the sake of simplicity, the simulation\
    \ returns a data first.\n    return 54\n\nusage = useresults()\nprint('This is\
    \ your body result', usage)\n```\n\n## Functions with Parameters and No Return\
    \ Value\n\nIn actual development, functions with parameters and no return value\
    \ are rarely used. Because with functions as function modules and with parameters\
    \ passed in, the return value is expected to be used in most cases. Here, everyone\
    \ can know something about functions with parameters and no return value. The\
    \ example code is as follows:\n\n```\n# function\ndef send(usecase1, usecase2):\n\
    \    result = usecase1 + usecase2\n    print('calculated as: %d' % result)\n```\n\
    \n## Functions with Parameters and Return Values\n\nSuch functions can not only\
    \ receive parameters but also return certain data. In general, such functions\
    \ can be used for applications that process data and require results. Next, we\
    \ will demonstrate it through a case.\n\n**Example: Functions with Parameters\
    \ and Return Values**\n\n```\n# calculates the cumulative sum of 1 ~ num\nwhile\
    \ i <= usetheresult:\n    result = result + i\n    i += 1\n```\n\nIn the next\
    \ section, we will describe user-made functions and will further explain the concept\
    \ of user-made functions using a thorough example.\n\n### What is a user-made\
    \ function?\n\nA user-made function is a function that creates a function with\
    \ its parameters and logic. We usually have system functions such as `print()`,\
    \ `math()` to solve a lot of day-to-day problems. User-made functions are usually\
    \ used for repetitive tasks.\n\nIn the next section, we will introduce you to\
    \ a business card manager application that uses various user-made functions. Follow\
    \ along to understand the essence of functions in programming.\n\n## Function\
    \ Case: Business Card Manager\n\nBusiness card manager is a practical software\
    \ for life, which is used to help manage all business cards in mobile phones.\
    \ To help people learn how to choose four types of functions in practical application,\
    \ we develop a business card manager. This case requires the use of functions\
    \ to complete various functions, and according to the keyboard input to select\
    \ the corresponding function to complete these functions.\n\nThere are six functions\
    \ in the business card management menu, and the function selected by the user\
    \ is responded by receiving the serial number input by the keyboard. Once the\
    \ user enters \"6\", he will quit the business card management system.\n\nFirst\
    \ of all, create a project and create a Python file named \"Business Card Management\
    \ System\". The specific implementation steps are as follows.\n\n### 1. Output\
    \ the menu of the Business Card Manager\n\nConsidering that this function is only\
    \ used to output information and the output content is fixed, a function `displayMenu()`\
    \ with no parameters and no return value is defined as follows.\n\n```\ndef display():\n\
    \    print(\"-\" * 60)\n    { Enter the menu entities here}\n    print(\"-\" *\
    \ 60)\n```\n\nUse the `while` loop to output menu information without interruption.\
    \ To test the above menu function as soon as possible, the number of cycles is\
    \ limited to 1, as follows.\n\n```\nfirst = 0\nwhile first < 1:\n    # Print menu\n\
    \    display()\n```\n\nRun the program and the console outputs the above menu\
    \ information.\n\n### 2. Obtain the information input by the user\n\nAfter the\
    \ menu is displayed, the user enters the serial number to be executed according\
    \ to the prompt. The `input()` function receives the user's selection from the\
    \ keyboard and returns the selected sequence number, so a function `useinput()`\
    \ with no parameters and a return value is defined as follows.\n\n```\n# Get the\
    \ information entered by the user\ndef useinput():\n    storedvalue = input(\"\
    please enter the selected serial number:\")\n    return int(storedvalue)\n```\n\
    \nAfter the `while` loop prints the menu, call the `useinput()` function to obtain\
    \ the information entered by the user, as follows.\n\n```\n# Waiting for User\
    \ Selection\npresent = useinput()\n```\n\nRun the program and the console outputs\
    \ the information.\n\n### 3. Perform different functions by obtaining serial numbers\n\
    \nAfter obtaining the serial number, perform the corresponding operation according\
    \ to the serial number. At the end of the `while` statement, use the `if-elif`\
    \ statement to complete the corresponding functions according to the sequence\
    \ number selected by the user, as follows.\n\n```\nif present == 1:\n    pass\n\
    elif present == 2:\n    {Use the remaining conditional entities here}\nprint(\"\
    Incorrect input, please re-enter ...\" )\n```\n\nNext, the function corresponding\
    \ to the serial number will be processed under each condition. Here, only the\
    \ functions of \"Add Business Card\" and \"Query Business Card\" will be introduced.\n\
    \n### 4. Add Business Cards\n\nTo save all business card information, you need\
    \ a list. Before the `while` statement, define an empty list as follows.\n\n```\n\
    namespresent = []\n```\n\nThe user has selected serial number 1, and should be\
    \ prompted to enter his name and then add it to the above empty list. Therefore,\
    \ we define a function with no parameters and no return value, as follows.\n\n\
    ```\n# Add Business Cards\ndef enterInf():\n    enterInf = input(\"please enter\
    \ name:\")\n    enterinf.append(newName)\n```\n\nThen, when the user selects the\
    \ serial number 1, the above method is called to realize the function of adding\
    \ business cards, as follows.\n\n```\nif present == 1:\n    enterInf()\nelif present\
    \ == 2:\n```\n\nRun the program and the console will output the information.\n\
    \n### 5. Check the information about all business cards\n\nThe user has selected\
    \ serial number 5. At this time, all the name information should be obtained from\
    \ the list and printed in a fixed format. Therefore, we define a function with\
    \ parameters and no return value, as follows.\n\n```\n# View information for all\
    \ business cards\ndef getallnames(structure):\n    print(\"=\" * 60)\n    for\
    \ info in structure:\n        print(info)\n    print(\"=\" * 60)\n```\n\nThen,\
    \ when the user selects the serial number 5, the above method is called to realize\
    \ the function of viewing all business cards, as follows.\n\n```\nelif present\
    \ == 4:\n    pass\nelif present == 5:\n    getallnames(nameList)\n```\n\nRun the\
    \ program and the console will output the information.\n\nWith this, we have completed\
    \ a brief explanation about user-made functions in Python. In the next chapter,\
    \ we will start discussing conditional and loop statements in detail. Let us go!\n"
  trans: "\n# 第 10 章：如何创建自定义函数？\n\n在本章中，我们将详细讨论各种类型的函数。我们还将通过示例讨论用户自定义函数。\n\n根据是否有参数和返回值，函数大致可分为四类：\n\
    \n1.  无参数且无返回值的函数。\n2.  无参数但有返回值的函数。\n3.  有参数但无返回值的函数。\n4.  有参数且有返回值的函数。\n\n接下来将详细解释这四种类型。\n\
    \n![工作, 输入, 电脑, 笔记本, 编程](img/rsrc3CB.jpg)\n\n## 无参数且无返回值的函数\n\n无参数且无返回值的函数既不能接收参数，也不能返回值。接下来，通过一个打印提示信息的函数来演示此类函数的用法，如下例所示。\n\
    \n**示例：无参数且无返回值的函数**\n\n```\ndef printresults():\n    # This is your place to\
    \ choose\n    # display('Order your items here')\n    { Now enter the output required\
    \ for the entities}\nprintresults()\n```\n\n## 无参数但有返回值的函数\n\n此类函数不能接收参数，但可以返回某些数据。通常，在收集数据时会使用此类函数。接下来，我们将通过示例进行演示。\n\
    \n**示例：无参数但有返回值的函数**\n\n```\n# This will give temperature\ndef result():\n   \
    \ # Here are some processing procedures for obtaining temperature.\n    # For\
    \ the sake of simplicity, the simulation returns a data first.\n    return 54\n\
    \nusage = useresults()\nprint('This is your body result', usage)\n```\n\n## 有参数但无返回值的函数\n\
    \n在实际开发中，有参数但无返回值的函数很少使用。因为将函数作为功能模块并传入参数时，大多数情况下都期望使用返回值。在此，大家可以了解一下有参数但无返回值的函数。示例代码如下：\n\
    \n```\n# function\ndef send(usecase1, usecase2):\n    result = usecase1 + usecase2\n\
    \    print('calculated as: %d' % result)\n```\n\n## 有参数且有返回值的函数\n\n此类函数不仅可以接收参数，还可以返回特定数据。通常，此类函数可用于处理数据并需要结果的应用程序。接下来，我们将通过一个案例进行演示。\n\
    \n**示例：有参数且有返回值的函数**\n\n```\n# calculates the cumulative sum of 1 ~ num\nwhile\
    \ i <= usetheresult:\n    result = result + i\n    i += 1\n```\n\n在下一节中，我们将描述用户自定义函数，并将通过一个详尽的示例进一步解释用户自定义函数的概念。\n\
    \n### 什么是用户自定义函数？\n\n用户自定义函数是指创建一个带有其参数和逻辑的函数。我们通常有 `print()`、`math()` 等系统函数来解决许多日常问题。用户自定义函数通常用于重复性任务。\n\
    \n在下一节中，我们将向您介绍一个使用各种用户自定义函数的名片管理器应用程序。请跟随学习，以理解编程中函数的本质。\n\n## 函数案例：名片管理器\n\n\
    名片管理器是一款实用的生活软件，用于帮助管理手机中的所有名片。为了帮助人们学习如何在实际应用中选择这四种类型的函数，我们开发了一个名片管理器。该案例需要使用函数来完成各项功能，并根据键盘输入选择相应的函数来完成这些功能。\n\
    \n名片管理菜单中有六个功能，通过接收用户键盘输入的序号来响应用户选择的功能。一旦用户输入“6”，将退出名片管理系统。\n\n首先，创建一个项目并创建一个名为“Business\
    \ Card Management System”的 Python 文件。具体实现步骤如下。\n\n### 1. 输出名片管理器的菜单\n\n考虑到该功能仅用于输出信息且输出内容固定，因此定义了一个无参数且无返回值的函数\
    \ `displayMenu()`，如下所示。\n\n```\ndef display():\n    print(\"-\" * 60)\n    { Enter\
    \ the menu entities here}\n    print(\"-\" * 60)\n```\n\n使用 `while` 循环不间断地输出菜单信息。为了尽快测试上述菜单函数，将循环次数限制为\
    \ 1，如下所示。\n\n```\nfirst = 0\nwhile first < 1:\n    # Print menu\n    display()\n\
    ```\n\n运行程序，控制台将输出上述菜单信息。\n\n### 2. 获取用户输入的信息\n\n菜单显示后，用户根据提示输入要执行的序号。`input()`\
    \ 函数从键盘接收用户的选择并返回选定的序号，因此定义了一个无参数但有返回值的函数 `useinput()`，如下所示。\n\n```\n# Get the\
    \ information entered by the user\ndef useinput():\n    storedvalue = input(\"\
    please enter the selected serial number:\")\n    return int(storedvalue)\n```\n\
    \n`while` 循环打印菜单后，调用 `useinput()` 函数获取用户输入的信息，如下所示。\n\n```\n# Waiting for User\
    \ Selection\npresent = useinput()\n```\n\n运行程序，控制台将输出信息。\n\n### 3. 通过获取序号执行不同功能\n\
    \n获取序号后，根据序号执行相应操作。在 `while` 语句末尾，使用 `if-elif` 语句根据用户选择的序号完成相应功能，如下所示。\n\n```\n\
    if present == 1:\n    pass\nelif present == 2:\n    {Use the remaining conditional\
    \ entities here}\nprint(\"Incorrect input, please re-enter ...\" )\n```\n\n接下来，将在每个条件下处理对应序号的功能。此处仅介绍“添加名片”和“查询名片”的功能。\n\
    \n### 4. 添加名片\n\n为了保存所有名片信息，需要一个列表。在 `while` 语句之前，定义一个空列表，如下所示。\n\n```\nnamespresent\
    \ = []\n```\n\n用户选择了序号 1，应提示输入姓名，然后将其添加到上述空列表中。因此，我们定义了一个无参数且无返回值的函数，如下所示。\n\n\
    ```\n# Add Business Cards\ndef enterInf():\n    enterInf = input(\"please enter\
    \ name:\")\n    enterinf.append(newName)\n```\n\n然后，当用户选择序号 1 时，调用上述方法以实现添加名片的功能，如下所示。\n\
    \n```\nif present == 1:\n    enterInf()\nelif present == 2:\n```\n\n运行程序，控制台将输出信息。\n\
    \n### 5. 查看所有名片信息\n\n用户选择了序号 5。此时，应从列表中获取所有姓名信息并按固定格式打印。因此，我们定义了一个有参数但无返回值的函数，如下所示。\n\
    \n```\n# View information for all business cards\ndef getallnames(structure):\n\
    \    print(\"=\" * 60)\n    for info in structure:\n        print(info)\n    print(\"\
    =\" * 60)\n```\n\n然后，当用户选择序号 5 时，调用上述方法以实现查看所有名片的功能，如下所示。\n\n```\nelif present\
    \ == 4:\n    pass\nelif present == 5:\n    getallnames(nameList)\n```\n\n运行程序，控制台将输出信息。\n\
    \n至此，我们已完成关于 Python 中用户自定义函数的简要说明。在下一章中，我们将开始详细讨论条件语句和循环语句。让我们开始吧！\n"
