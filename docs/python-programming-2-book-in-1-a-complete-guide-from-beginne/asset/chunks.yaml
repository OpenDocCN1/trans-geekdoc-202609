    \ the result is `True`; otherwise, it is `False`.\n2.  `not in`: If it does not\
    \ exist, the result is `True`, otherwise it is `False`.\n\nNext, a case is used\
    \ to demonstrate how to find elements in the list.\n\n#### Example: Finding Elements\
    \ in a List\n\n```\nfindName = input('please enter the name you want to find:')\n\
