    # 第 2 章：Python 与其他编程语言有何不同？


    Python 是一种解释型、面向对象、动态数据类型的高级编程语言。自 1990 年代初 Python 语言诞生以来，它逐渐被广泛应用于处理系统管理任务和 Web
    编程。特别是随着人工智能的持续发展，Python 已成为最流行的编程语言之一。


    ## 为什么 Python 很特别？


    现在有数百种编程语言可供程序员入门。然而，根据哈佛大学计算机科学家的一项调查统计，Python 是初学者中的领先语言。我们将在本节讨论一些使 Python
    成为新程序员易懂语言的原因。


    与其他编程语言相比，Python 具有以下主要优势：


    1.  **语法简洁明了，代码可读性高。** Python 的语法强制要求缩进，这用于体现语句间的逻辑关系，并显著提高程序的可读性。

    2.  **正因为简单明了，它也是一种开发效率极高的编程语言。**

    3.  **Python 可以真正跨平台**，例如，我们开发的程序可以在 Windows、Linux、macOS 系统上运行。这是它的可移植性优势。

    4.  **拥有大量丰富的库或扩展。** Python 常被称为胶水语言。它可以轻松连接用其他语言（尤其是 C/C++）编写的各种模块。利用这些丰富的第三方库，我们可以轻松开发应用程序。

    5.  **代码量少，在一定程度上提高了软件质量。** 由于用 Python 编写的代码量远少于其他语言，出错概率也低得多，这在一定程度上提高了所编写软件的质量。


    Python 用途广泛，可应用于以下领域：


    1.  Web 页面开发；

    2.  可视化（GUI）界面开发；

    3.  网络编程（可用于网络编程）；

    4.  系统编程；

    5.  数据分析；

    6.  机器学习（Python 拥有各种支持库）；

    7.  网络爬虫（如 Google 使用的爬虫）；

    8.  科学计算（Python 用于科学计算的许多方面）。


    例如，Python 用于许多 Google 服务中。YouTube 也是用 Python 实现的。维基百科网络的基础框架最初也是用 Python 实现的。


    ## Python 是如何工作的？


    Python 程序执行原理非常简单。我们都知道，用 C/C++ 等编译型语言编写的程序，需要将源文件转换为计算机使用的机器语言，然后由链接器链接形成二进制可执行文件。运行程序时，可以从硬盘将二进制程序加载到内存中运行。


    然而，对于 Python，Python 源代码无需编译成二进制代码。它可以直接从源代码运行程序。Python 解释器将源代码转换为字节码，然后将编译后的字节码转发给
    Python 虚拟机 (PVM) 执行。


    当我们运行 Python 程序时，Python 解释器执行两个步骤。


    ### (1) 将源代码编译为字节码


    编译后的字节码是 Python 特有的表达形式。它不是二进制机器码，需要进一步编译才能由机器执行。这也是 Python 代码运行速度不如 C/C++ 快的原因。如果
    Python 进程在机器上拥有写入权限，它会将程序的字节码保存为扩展名为 `.pyc` 的文件。如果 Python 无法在机器上写入字节码，字节码将在内存中生成，并在程序结束时自动丢弃。构建程序时，最好授予
    Python 在计算机上的写入权限，这样只要源代码未变，生成的 `.pyc` 文件就可以复用，从而提高执行效率。


    ### (2) 将编译后的字节码转发给 Python 虚拟机 (PVM) 执行。


    PVM 是 Python Virtual Machine 的缩写。它是 Python 的运行引擎，也是 Python 系统的一部分。它是一个大循环，迭代运行字节码指令，依次完成操作。在此过程中，每个
    Python 程序都会被执行，并给出可进一步分析和测试的结果，以便完全部署为新应用程序。


    ## 展望未来？


    如前所述，从零开始学习一门编程语言总是很难的。Python 之所以是初学者最流行的编程语言之一，是因为它直击要点，毫不偏离。大量代码非常简单，且言出必行。对初学者来说，使用
    Python 创建预测逻辑非常容易。我们只要求你坚持使用 Python，你就能用它创造奇迹。我们建议你查看 GitHub 上的 Python 程序，以进一步增加你对
    Python 编程的兴趣。在下一章，我们将详细讨论 Python 在不同操作系统上的安装过程。让我们开始吧！

    '
