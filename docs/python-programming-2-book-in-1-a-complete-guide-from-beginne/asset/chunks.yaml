    \ according to subscript.\n2.  `pop()`: Take away the end element.\n3.  `remove()`:\
    \ Remove according to the value of the element.\n\nNext, we will demonstrate the\
    \ use of the above three deletion methods through cases as follows.\n\n#### 1.\
    \ Use `del` to delete the list\n\n`del` can be used to delete the entire list\
    \ or specific elements. Next, we will demonstrate it through a case.\n\n#### Example:\
    \ Use `del` to Delete Elements in a List\n\n```\ndel movieName[2]\n```\n\n####\
    \ 2. Use `pop()` to delete list elements\n\n`pop()` can be used to delete the\
    \ last element of the list. Next, a case will be presented.\n\n```\nmovieName.pop()\n\
    ```\n\n#### 3. Use `remove()` to remove list elements\n\nUse `remove()` to remove\
    \ a specified element of the list. Next, we will demonstrate it through a case.\n\
    \n```\nmovieName.remove('lord of the rings')\n```\n\n### Sorting Operation of\
    \ List\n\nIf you want to rearrange the elements in the list, you can use the `sort()`\
    \ or `reverse()` method. Among them, the `sort()` method rearranges the elements\
    \ in the list in a specific order. The `reverse()` method is to reverse the list.\
    \ Next, a case is used to demonstrate the use of these two methods.\n\n#### Example:\
    \ Sorting Operation of List\n\n```\nsample = [1, 4, 2, 3]\nsample.reverse()\n\
    sample.sort()\nprint(sample)\n```\n\nIn the example, the second line of code arranges\
    \ the list in reverse order, the fourth line of code arranges the list in ascending\
    \ order, and the sixth line of code prints the sorted list.\n\nWith this, we have\
    \ completed various operations that structures can perform. In the next chapter,\
    \ we will discuss functions with various examples in detail. Let us go!\n"
  trans: "\n# 第 8 章：Python 中的结构\n\nPython 是一门结构化语言，并提供各种结构来存储和操作数据以执行操作。在本章中，我们将详细讨论列表等结构。本章大部分内容为理论性质，需要理解之前解释的各种概念。让我们开始吧！\n\
    \n## 什么是列表？\n\n之前学习的字符串数据类型可用于存储单条字符串信息。但假设一个班级有 100 名学生。如果你想存储该班所有学生的姓名，你需要定义\
    \ 100 个变量，每个变量存储一名学生的姓名。然而，如果有 1,000 名学生或更多，该怎么办？你很幸运，因为列表等结构可以解决上述问题。\n\n列表是\
    \ Python 中的一种数据结构，可以存储不同类型的数据。创建列表的方法非常简单：只需使用方括号将用逗号分隔的不同数据项括起来。示例代码如下：\n\n```\n\
    A = [1, 'Tom', 'a', [2, 'b']]\n```\n\n与字符串的索引一样，列表索引从 0 开始。我们可以通过下标索引访问列表中的值。\n\
    \n### 示例：使用索引访问列表元素\n\n```\nA = ['Tom', 'Sam', 'Ram']\nprint(A[0])\nprint(A[1])\n\
    print(A[2])\n```\n\n在本示例中，使用索引来访问列表中的元素，其中第一个元素的索引为 0，第二个元素的索引为 1，依此类推。\n\n为了更高效地输出列表的每个数据，我们可以使用\
    \ `for` 和 `while` 循环来遍历输出列表。以下是一个案例研究，说明如何使用 `for` 和 `while` 循环遍历列表。\n\n### 1.\
    \ 使用 `for` 循环遍历列表\n\n使用 `for` 循环遍历列表的方法非常简单；只需在 `for` 循环表达式中将列表作为序列进行遍历。接下来，将通过一个案例来理解此场景。\n\
    \n```\ngetdetails = ['Sam', 'Tom', 'Ram']\nfor name in getdetails:\n    print(name)\n\
    ```\n\n在本示例中，当使用 `for` 循环遍历列表时，由于列表本身就是一个序列，因此可以直接将 names 列表用作 `for` 循环表达式的序列，逐个获取列表中的元素。\n\
    \n### 2. 使用 `while` 循环遍历列表\n\n要使用 `while` 循环遍历列表，首先需要获取列表的长度，并将获取的列表长度作为 `while`\
    \ 循环的条件。接下来，将展示一个案例，如下例所示。\n\n#### 示例：使用 `while` 循环遍历列表\n\n```\ngetdetails = ['Sam',\
    \ 'Tom', 'Ram']\nlength = len(getdetails)\nfirst = 0\nwhile first < length:\n\
    \    print(getdetails[first])\n    first += 1\n```\n\n在本示例中，当使用 `while` 循环遍历列表时，因为\
    \ `while` 循环需要指定遍历次数，所以有必要使用 `len()` 函数获取列表的长度，即要遍历的元素数量。\n\n## 列表常用操作\n\n###\
    \ 向列表添加元素\n\n向列表添加元素有多种方法，如下所示：\n\n1.  可以通过 `append()` 向列表添加元素。\n2.  `extend()`\
    \ 允许你将另一个列表中的元素逐个添加到列表中。\n3.  通过 `insert(index, object)` 在指定位置索引之前插入元素对象。\n\n\
    接下来，我们将通过以下案例研究演示这些方法的用法。\n\n#### 1. 通过 `append()` 向列表添加元素\n\n使用 `append()` 添加到列表的元素位于列表的末尾。接下来，我们将通过一个案例进行演示，如下例所示。\n\
    \n```\n# 提示并添加元素\ntemp = input('please enter the name of the student to be added:')\n\
    A.append(temp)\n```\n\n在该示例中，程序使用 `append()` 在列表末尾添加元素，并分别在添加元素前后使用 `for` 循环遍历列表，以验证列表中的元素是否添加成功。\n\
    \n#### 2. 通过 `extend()` 向列表添加元素\n\n使用 `extend()` 将一个列表的所有元素添加到另一个列表中。接下来，将展示一个案例。\n\
    \n#### 示例：使用 `extend()` 添加列表元素\n\n```\nfirst = [1, 2]\nsecond = [3, 4]\nfirst.append(second)\n\
    print(first)\nfirst.extend(second)\nprint(first)\n```\n\n在本示例中，`append()` 用于将列表\
    \ `second` 添加到列表 `first` 的末尾，然后 `extend()` 用于将列表 `second` 的所有元素添加到列表 `first` 中。\n\
    \n#### 3. 通过 `insert()` 向列表添加元素\n\n使用 `insert()` 在列表的指定位置添加元素。接下来，将展示一个案例，如下例所示。\n\
    \n#### 示例：使用 `insert()` 向列表插入元素\n\n```\nsample = [0, 1, 2]\nsample.insert(1, 3)\n\
    print(sample)\n```\n\n在本示例中，第二行代码使用 `insert()` 在索引 `1` 处向列表添加元素 `3`。\n\n### 在列表中查找元素\n\
    \n所谓的查找是查看指定元素是否存在。下面解释了 Python 中用于查找的常用运算符。\n\n1.  `in`（存在）：如果存在，结果为 `True`；否则为\
    \ `False`。\n2.  `not in`：如果不存在，结果为 `True`，否则为 `False`。\n\n接下来，使用一个案例演示如何在列表中查找元素。\n\
    \n#### 示例：在列表中查找元素\n\n```\nfindName = input('please enter the name you want to\
    \ find:')\n# 查找是否存在\nif findName in {Enter entity details here}:\n    # ...\n\
    ```\n\n在该示例中，通过遍历列表，查明指定元素是否存在于列表中。程序运行后，将产生两种结果。\n\n### 从列表中删除元素\n\n在现实生活中，如果学生转班，则应删除该转班学生的信息。删除功能在开发中经常使用。列表元素有三种常见的删除方法，如下所示：\n\
    \n1.  `del`：根据下标删除。\n2.  `pop()`：取出末尾元素。\n3.  `remove()`：根据元素的值删除。\n\n接下来，我们将通过以下案例演示上述三种删除方法的用法。\n\
    \n#### 1. 使用 `del` 删除列表\n\n`del` 可用于删除整个列表或特定元素。接下来，我们将通过一个案例进行演示。\n\n#### 示例：使用\
    \ `del` 删除列表中的元素\n\n```\ndel movieName[2]\n```\n\n#### 2. 使用 `pop()` 删除列表元素\n\n\
    `pop()` 可用于删除列表的最后一个元素。接下来，将展示一个案例。\n\n```\nmovieName.pop()\n```\n\n#### 3. 使用\
    \ `remove()` 移除列表元素\n\n使用 `remove()` 移除列表的指定元素。接下来，我们将通过一个案例进行演示。\n\n```\nmovieName.remove('lord\
    \ of the rings')\n```\n\n### 列表的排序操作\n\n如果你想重新排列列表中的元素，可以使用 `sort()` 或 `reverse()`\
    \ 方法。其中，`sort()` 方法按特定顺序重新排列列表中的元素。`reverse()` 方法用于反转列表。接下来，使用一个案例演示这两种方法的用法。\n\
    \n#### 示例：列表的排序操作\n\n```\nsample = [1, 4, 2, 3]\nsample.reverse()\nsample.sort()\n\
    print(sample)\n```\n\n在该示例中，第二行代码将列表按逆序排列，第四行代码将列表按升序排列，第六行代码打印排序后的列表。\n\n至此，我们已完成结构可以执行的各种操作。在下一章中，我们将结合各种示例详细讨论函数。让我们继续吧！\n"
