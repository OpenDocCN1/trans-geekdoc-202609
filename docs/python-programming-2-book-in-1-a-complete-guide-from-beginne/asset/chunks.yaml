- raw: 'Chapter 1: What is Python? This chapter is a comprehensive introduction to
    python basics and its abilities. We will start with a little history and will
    then dive into other complex topics. We advise you to use this book both as a
    reference and learning material. Python is an explanatory, object-oriented and
    high-level programming language with dynamic semantics. It can be used as a real
    cross-platform (running on Linux, macOS, and Windows) language, and its forced
    indentation syntax makes its code simple and easy to read. Applications of Python
    Python is easier to use than other programming languages. Because Python has a
    large number of third-party libraries, it is more efficient and faster to use
    Python to develop application projects. Python is widely used in system management.
    Multi-national Companies like Industrial Light & Magic use Python to produce special
    effects in high-budget movies. Yahoo! is using it (including other technologies)
    to manage discussion groups. Google uses it to implement many components in web
    crawlers and search engines. Python is also used in various fields such as computer
    games and biological information. With the rapid development of artificial intelligence,
    Python''s application has been better popularized. Python History Python was founded
    by Guido van Rossum of the Netherlands. During Thanksgiving Day in 1989, Guido
    decided to develop a new script interpreter as an inheritance of the ABC language
    to kill the boredom of Christmas. Python was chosen as the name of the language
    because he is a fan of BBC TV series "Monty Python''s Flying Circus". He wanted
    to create a mystique about the programming language. For this reason, he named
    it Python. Python was born in 1989, but the first public release was issued in
    1991, Python2.0 was officially released in October 2000, Python3.0 was officially
    released in December 2008, and the latest version is Python3.6.5 as of this book
    is written. Python is an object-oriented and literal translation computer programming
    language, as well as a powerful general programming language. It contains a set
    of perfect and easy-to-understand standard libraries and is supported by a large
    number of third-party libraries, which can easily accomplish many common tasks.
    Its syntax is very simple and clear, unlike most other computer programming languages,
    it uses a forced indentation to define statement blocks. Python''s Design Style
    Python insists on a clear and uniform design style, which makes Python an easy-to-read
    and easy-to-maintain language that is popular with a large number of users and
    has a wide range of uses. The general guiding ideology of designers in development
    is that it is best as long as there is the best way to solve a specific problem.
    Python''s design philosophy is being elegant, clear, simple and readable. Python''s
    Object-Oriented philosophy Python is a programming language that supports object-oriented
    programming paradigm process. It has a lot of technical abilities that help it
    to be a better programming language than of procedural languages that are available.
    Python developer''s philosophy is to use one method, preferably only one method,
    to do one thing. This is different from most other programming languages. When
    you are faced with many choices in writing programs in Python, Python developers
    will usually reject those fancy methods and choose clear, little or no ambiguous
    syntax. These criteria are what we usually call Python''s maxim. You can see a
    famous article written by Tim Peters on python basics. It introduces some important
    principles that need to be paid attention to when writing beautiful Python programs,
    to understand Python''s design philosophy. Also, you can refer to relevant websites
    to learn about Python''s design philosophy. In the next section, we will discuss
    installing third-party libraries in Python language. This is a basic skill that
    is necessary for python programmers to learn before dealing with hard coding skills.
    It is pretty basic and very useful for beginners. Let us learn about it in detail.
    How to install the third-party libraries? Python has a powerful standard library,
    and the Python community provides a large number of third-party libraries in a
    similar way to the standard library. If strong standard libraries have laid for
    the foundation for Python''s development, third party libraries are responsible
    for Python''s continuous development. With continuous updates of Python, some
    stable third-party libraries have been added to the standard library. When Anaconda
    was installed, Python''s standard libraries and some commonly used third-party
    libraries were installed with a Python interpreter. You can enter "pip list" at
    the Windows prompt to view the installed libraries. All the installed libraries
    will then appear on the output screen. If you want to use a third-party library
    that is not installed, you must install it using the installation method described
    below. Beginners can skip this now if it is too overwhelming to concentrate on.
    You can always come back to this section for understanding the installation of
    third-party modules. 1) Source installation Many third-party libraries are open
    source, almost all of which can be found on GitHub or PyPI. Most of the source
    codes found are available in zip, tar.zip, tar.bz2 format compression packages.
    After unpacking these compressed packages, you will usually see a setup.py file.
    Open the Windows command line window and enter the folder. Run the following command
    to install: run setup.py // This is the usually used command 2) Package Manager
    Many programming languages now have package managers, such as Ruby''s gem and
    nodejs''s npm. Python is certainly no exception. Pip and conda can be used to
    install third-party libraries. (1) pip Management of Python Library. You should
    remember that when Python installation was introduced earlier, one of the options
    that it offers was to install the pip Package Manager. Of course, if Anaconda
    is selected for installation it should be noted that the package manager has already
    installed it automatically. If the pip package manager has been installed, enter
    pip on the command line and click enter, and you can see the results. pip {Enter
    the third-party name} When installing a third-party library using the pip installation
    module, the system will automatically download the installation file. For example,
    install the flask framework with the following command: pip install flask Command
    to Uninstall Installed Third-Party Libraries pip uninstall {Enter third party
    name here} ￼ If you want to view the installed libraries, including those that
    come with the system and those that are installed manually, you only need to execute
    the command ''pip all''. More pip parameters and functions can be viewed by entering
    "pip" on the command line interface. (2) Condo''s management of Python libraries.
    Conda can be installed by installing Minconda or Anaconda, which is a simplified
    version of python and that only contains conda and its dependencies. Conda''s
    management of Python libraries is much the same as pip''s. Currently, the main
    commands that can be used are to install, uninstall and view the installed libraries.
    conda {Enter the command here} For more information about the use of conda, interested
    readers can use relevant materials from online for study. With this, we have completed
    a brief introduction to Python. In the next chapter, we will discuss some of the
    specialties of Python when compared with other programming languages. We will
    also learn about the working process of Python in detail in the next chapter.
    Follow along! '
