    \ can be modified at will. The elements in the tuple are contained in parentheses\
    \ `()`. Elements cannot be modified. Let's look at the representation of lists\
    \ and tuples.\n\n```\nA list = [1,768,' lost'] # This is a list\nA tuple = (1,2464,'\
    \ great') # This is a tuple\n```\n\n### (5) dictionary type\n\nDictionary is a\
    \ mapping data type in Python and consists of key-value pairs. Dictionaries can\
    \ store different types of elements, which are contained in braces `{}`. In general,\
    \ the keys of the dictionary will be expressed in the form of strings or numbers,\
    \ and the values can be of any type. The sample code is as follows:\n\n```\nSample\
    \ = {\"name\": \"Rob\", \"age\": 67} # this is a dictionary\n```\n\nIn the above\
    \ code, the variable `Sample` is a dictionary type, which stores two elements,\
    \ the key of the first element is a name, and the value is Rob. The key of the\
    \ second element is age with a value of 67.\n\nIn Python, as long as a variable\
    \ is defined and the variable stores data, the data type of the variable is already\
    \ determined. This is because the system will automatically identify the data\
    \ type of the variable, and there is no need for developers to explicitly specify\
    \ the data type of the variable. If you want to view the type of a variable, you\
    \ can use `type(variable_name)`. The sample code is as follows:\n\n```\n>>> dude\
    \ = 5.234\n>>> type(dude) # use the type function to view types\n<class 'float'>\n\
    ```\n\nIn the above code, the value stored in the variable `dude` is 5.234, and\
    \ the system will automatically judge the data type of `dude` variable as float\
    \ according to the value. Therefore, when viewing the data type of variable `dude`\
    \ using the `type` function, the result is float.\n\nIn the next section, we will\
    \ discuss some of the syntactical rules to be followed while writing code such\
    \ as comments and sentence wrapping.\n\n## What are comments in Python?\n\nThe\
    \ single-line comment in Python starts with `#`, and the sample code is as follows:\n\
    \n```\n# This is the start\nprint(\"Hello, This is the end!\" ) # Second comment\n\
    ```\n\nA multiline comment can use three quotation marks as the opening and closing\
    \ symbols, and the three quotation marks can be three single quotation marks or\
    \ three double quotation marks. For example, when entering the declaration file\
    \ of the `print` function, the relevant explanations of the `print` function are\
    \ all annotated with three quotation marks.\n\n```\n''' Comment here ''' # Single\
    \ quotation comment\n\"\"\" Comment here \"\"\" # Double quotation comment\n```\n\
    \n## Lines and indents\n\nPython's most important and well-discussed ability is\
    \ that it uses different forms of indentation, without using braces `{}`. The\
    \ sample code is as follows:\n\n```\nif {Enter the Boolean entity here}\n    print\
    \ (\"This is right\") # Get use of a placeholder\nelse:\n    print (\"This is\
    \ wrong\") # Get use of a placeholder\n```\n\nThe above program is indented with\
    \ an inconsistent number of spaces, which will lead to running errors.\n\n```\n\
    if {Enter the Boolean entity here}\n    print (\"get this\")\n    print (\"This\
    \ is right\")\nelse:\n    print (\"Do this\")\n    PRINT (\"This is wrong\") #\
    \ Inconsistent indentations will result in running errors\n```\n\nDue to inconsistent\
    \ indentation of the above programs, indentation error will appear after execution.\n\
    \n**Note:**\n\n1.  For a person who uses indentation as a code block for the first\
    \ time, he may be confused about the width of indentation. Here, we recommend\
    \ using 4 spaces.\n2.  Tabs represent different blank widths in different text\
    \ editors. If the code we use is to be used across platforms, it is recommended\
    \ that you do not use tabs.\n\n## Sentence Wrapping\n\nPython usually writes a\
    \ statement one line at a time, but if it is syntactically too long, it needs\
    \ line wrapping, which can be implemented by adding a pair of parentheses to the\
    \ outside of the statement.\n\nNow we are ready to give a brief explanation about\
    \ various essential programming operations in the next chapter. Let us start with\
    \ it!\n"
  trans: "\n\n# 第 5 章：Python 变量\n\n编程是一项艰巨的任务，需要付出努力才能掌握各种主题。程序员注定要了解计算机如何存储数据。这将使理解其资源并成功整合数据类型以创建理想的应用程序变得容易。对于代码行数较少的程序，这可能看起来很愚蠢，但当你使用先进的第三方库来创建复杂的应用程序时，这将变得至关重要。在上一章中，我们详细讨论了数据类型，在本章中，我们将详细讨论用于重复使用存储数据的变量。\n\
    \n## 变量\n\n在现实生活中，当我们在超市购买东西时，通常需要使用购物车来存放商品。毕竟，商品购买后，我们可以在收银台结账。让我们想象一下，如果你想在程序中对多个数据求和，你需要先存储数据，然后再将数据相加。在\
    \ Python 中，需要变量来存储数据。变量可以理解为在超市购物时使用的购物车，它们的类型和值在赋值的那一刻就被初始化了。变量的赋值用等号表示，示例代码如下。我们将在下一章详细讨论赋值操作。\n\
    \n```\nNum1 = 257 # Num1 是一个变量，就像一个购物车，存储数据 257\nNum2 = 87 # Num2 也是一个变量，存储的数据是\
    \ 87\nResult = num1+num2 # 累加两个“购物车” num1 和 num2 中的数据，然后放入 result 变量\n```\n\n\
    在上面的示例中，`num1`、`num2` 和 `result` 是变量。其中，变量 `num1` 和 `num2` 就像购物车，它们存储的数据分别是 257\
    \ 和 87。变量 `result` 中存储的数据是两个“购物车” `num1` 和 `num2` 中数据的累加和。\n\n## 变量的类型\n\n变量用于存储数据，那么你有没有想过我们应该让变量占用多少空间以及存储什么类型的数据？在解释变量类型之前，让我们看一个生活中的例子。例如，我们需要运输一台电脑。大卡车和小轿车都可以完成。但是，如果我们用大卡车运输一台电脑，就有点大材小用，浪费了大卡车的空间。同样，如果变量用于存储数据，为了充分利用内存空间，我们可以为变量指定不同的类型。\n\
    \n### (1) 数字类型\n\nPython 中的数字类型包括整数、浮点数和复数类型。示例代码如下：\n\n```\nx = 1\nx = 3.232\n\
    x = 5.65f\n```\n\n### (2) 布尔类型\n\n布尔类型是一种特殊的整数，只有两个值：`True` 和 `False`。如果布尔值被作为数值进行计算，`True`\
    \ 将被视为整数 1，`False` 视为整数 0。\n\n### (3) 字符串类型\n\nPython 中的字符串被定义为一组用引号括起来的字符，引号可以是单引号、双引号或三引号（三个连续的单引号或双引号）。字符串有索引规则，第一个字符的索引是\
    \ 0，第二个字符的索引是 1，依此类推。以下是字符串的示例代码：\n\n```\nStr1='God'\nStr2=\"This is great\"\n\
    Str3='''You are lost'''\n```\n\n### (4) 列表和元组类型\n\n我们可以把列表和元组看作普通的“数组”。它们可以容纳任意数量的任意类型的值，这些值称为元素。区别在于列表中的元素包含在方括号\
    \ `[]` 中。元素的数量和值可以随意修改。元组中的元素包含在圆括号 `()` 中。元素不能被修改。让我们看看列表和元组的表示方法。\n\n```\nA\
    \ list = [1,768,' lost'] # 这是一个列表\nA tuple = (1,2464,' great') # 这是一个元组\n```\n\
    \n### (5) 字典类型\n\n字典是 Python 中的一种映射数据类型，由键值对组成。字典可以存储不同类型的元素，这些元素包含在花括号 `{}` 中。通常，字典的键将以字符串或数字的形式表示，而值可以是任意类型。示例代码如下：\n\
    \n```\nSample = {\"name\": \"Rob\", \"age\": 67} # 这是一个字典\n```\n\n在上面的代码中，变量 `Sample`\
    \ 是字典类型，存储了两个元素，第一个元素的键是 name，值是 Rob。第二个元素的键是 age，值是 67。\n\n在 Python 中，只要定义了变量且变量存储了数据，该变量的数据类型就已经确定了。这是因为系统会根据值自动识别变量的数据类型，开发人员无需显式指定变量的数据类型。如果你想查看变量的类型，可以使用\
    \ `type(变量名)`。示例代码如下：\n\n```\n>>> dude = 5.234\n>>> type(dude) # 使用 type 函数查看类型\n\
    <class 'float'>\n```\n\n在上面的代码中，变量 `dude` 存储的值是 5.234，系统会根据该值自动判断 `dude` 变量的数据类型为\
    \ float。因此，当使用 `type` 函数查看变量 `dude` 的数据类型时，结果是 float。\n\n在下一节中，我们将讨论编写代码时需要遵循的一些语法规则，例如注释和语句换行。\n\
    \n## Python 中的注释是什么？\n\nPython 中的单行注释以 `#` 开头，示例代码如下：\n\n```\n# This is the start\n\
    print(\"Hello, This is the end!\" ) # Second comment\n```\n\n多行注释可以使用三个引号作为开始和结束符号，这三个引号可以是三个单引号或三个双引号。例如，当进入\
    \ `print` 函数的声明文件时，`print` 函数的相关说明都是用三引号注释的。\n\n```\n''' Comment here ''' # 单引号注释\n\
    \"\"\" Comment here \"\"\" # 双引号注释\n```\n\n## 行和缩进\n\nPython 最重要且讨论最多的特性是它使用不同形式的缩进，而不使用大括号\
    \ `{}`。示例代码如下：\n\n```\nif {Enter the Boolean entity here}\n    print (\"This is\
    \ right\") # Get use of a placeholder\nelse:\n    print (\"This is wrong\") #\
    \ Get use of a placeholder\n```\n\n上面的程序使用了不一致数量的空格进行缩进，这将导致运行错误。\n\n```\nif {Enter\
    \ the Boolean entity here}\n    print (\"get this\")\n    print (\"This is right\"\
    )\nelse:\n    print (\"Do this\")\n    PRINT (\"This is wrong\") # 不一致的缩进将导致运行错误\n\
    ```\n\n由于上述程序的缩进不一致，执行后将出现缩进错误。\n\n**注意：**\n\n1.  对于第一次使用缩进作为代码块的人来说，他可能会对缩进的宽度感到困惑。这里，我们建议使用\
    \ 4 个空格。\n2.  制表符在不同的文本编辑器中代表不同的空白宽度。如果我们使用的代码需要跨平台使用，建议你不要使用制表符。\n\n## 语句换行\n\
    \nPython 通常一次写一条语句一行，但如果语句在语法上太长，就需要换行，这可以通过在语句外部添加一对括号来实现。\n\n现在我们准备好在下一章简要解释各种基本的编程操作。让我们开始吧！\n\
    \n"
