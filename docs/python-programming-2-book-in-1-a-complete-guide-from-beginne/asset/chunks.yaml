- raw: 'Chapter 5: Python Variables Programming is a tough task and it requires hard
    work to master various topics. Programmers are destined to know about how computers
    store data. This will make it easy to understand their resources and successfully
    pool data types to create favorable applications. This may seem silly for programs
    with fewer lines of code but when you are using advanced third-party libraries
    to create complex applications this will become essential. In the previous chapter
    we have talked about data types in detail and in this chapter we will in detail
    discuss variables that store data for repetitive usage. ![Pensione, Scuola, Università,
    Ricerca, Insegnamento](rsrc3CC.jpg)Variables In real life, when we buy things
    in supermarkets, we often need to use shopping carts to store items. After all,
    after items are purchased, we can check out at the cash register. Let''s imagine,
    if you want to sum up multiple data in the program, you need to store the data
    first and then add up the data. In Python, variables are needed to store data.
    Variables can be understood as shopping carts used for shopping in supermarkets,
    and their types and values are initialized at the moment of assignment. The assignment
    of variables is represented by an equal sign, and the example code is shown below.
    We will also discuss in detail about Assignment operation in the next chapter.
    Num1 = 257 # Num1 is a variable, just like a shopping cart, which stores data
    257 Num2 = 87 # Num2 is also a variable, and the stored data is 87 Result = num1+num2
    # Accumulates the data in the two "shopping carts" num1 and num2 and then puts
    them into the result variable In the above example, num1, num2, and result are
    variables. Among them, variables num1 and num2 are just like a shopping cart,
    and the data they store are 257 and 87 respectively. The data stored in the variable
    result is the cumulative sum of the data in the two "shopping carts" num1 and
    num2. Types of Variables Variables are used to store data, so have you ever thought
    about how much space we should let variables take up and what kind of data to
    store? Before explaining the types of variables, let''s take a look at an example
    of life. For example, we need to transport a computer. Large trucks and cars can
    be completed. However, if we use a large truck to transport a computer, it is
    a little fussy and wastes the space of a large truck. Similarly, if variables
    are used to store data, in order to make full use of memory space, we can specify
    different types for variables. (1) Number Type Number types in Python include
    integer, floating-point, and complex types. The sample code is as follows: x =
    1 x = 3.232 x = 5.65f (2) Boolean type Boolean type is a special integer with
    only two values, True and False. If a Boolean value is evaluated numerically,
    True will be treated as integer 1 and False as integer 0. (3) String Type A string
    in Python is defined as a collection of characters that are enclosed in quotation
    marks, which can be single, double quotation marks, or triple quotation marks
    (three consecutive single quotation marks or double quotation marks). The string
    has index rules, the index of the first character is 0, the index of the second
    character is 1, and so on. The following is a sample code for a string: Str1=''God''
    Str2="This is great" Str3=''''''You are lost'''''' (4) List and tuple type We
    can think of lists and tuples as ordinary "arrays". They can hold any number of
    values of any type, which are called elements. The difference is that the elements
    in the list are contained in brackets \[\]. The number and value of elements can
    be modified at will. The elements in the tuple are contained in parentheses ().
    Elements cannot be modified. Let''s look at the representation of lists and tuples.
    A list = \[1,768,'' lost''\] # This is a list A tuple = (1,2464,'' great'') #
    This is a tuple (5) dictionary type Dictionary is a mapping data type in Python
    and consists of key-value pairs. Dictionaries can store different types of elements,
    which are contained in braces {}. In general, the keys of the dictionary will
    be expressed in the form of strings or numbers, and the values can be of any type.
    The sample code is as follows: Sample = {"name": "Rob", "age": 67} # this is a
    dictionary In the above code, the variable Sample is a dictionary type, which
    stores two elements, the key of the first element is a name, and the value is
    Rob. The key of the second element is age with a value of 67. In Python, as long
    as a variable is defined and the variable stores data, the data type of the variable
    is already determined. This is because the system will automatically identify
    the data type of the variable, and there is no need for developers to explicitly
    specify the data type of the variable. If you want to view the type of a variable,
    you can use "Type" (the name of the variable). The sample code is as follows:
    \>>> dude = 5.234 \> > > type (dude)//use the type function to view types <type
    ''float''> In the above code, the value stored in the variable num is 5.234, and
    the system will automatically judge the data type of num variable as float according
    to the value. Therefore, when viewing the data type of variable num using the
    type function, the result is float. In the next section, we will discuss some
    of the syntactical rules to be followed while writing code such as comments and
    sentence wrapping. What are comments in Python? The single-line comment in Python
    starts with #, and the sample code is as follows: \# This is the start print ("Hello,
    This is the end!" ) # Second comment A multiline comment can use three quotation
    marks as the opening and closing symbols, and the three quotation marks can be
    three single quotation marks or three double quotation marks. For example, when
    entering the declaration file of the print function, the relevant explanations
    of the print function are all annotated with three quotation marks. '''''' Comment
    here '''''' # Single quotation comment """ Comment here """ # Double quotation
    comment Lines and indents Python''s most important and well-discussed ability
    is that it uses different forms of indentation, without using braces {}. The sample
    code is as follows: if {Enter the Boolean entity here} Print ("This is right")
    # Get use of a placeholder else: Print ("This is wrong") # Get use of a placeholder
    The above program is indented with an inconsistent number of spaces, which will
    lead to running errors. if {Enter the Boolean entity here} print ("get this")
    print ("This is right") else: print ("Do this") PRINT ("This is wrong") # Inconsistent
    indentations will result in running errors Due to inconsistent indentation of
    the above programs, indentation error will appear after execution. Note: (1) For
    a person who uses indentation as a code block for the first time, he may be confused
    about the width of indentation. Here, we recommend using 4 spaces. (2) Tabs represent
    different blank widths in different text editors. If the code we use is to be
    used across platforms, it is recommended that you do not use tabs. Sentence Wrapping
    Python usually writes a statement one line at a time, but if it is syntactically
    too long, it needs line wrapping, which can be implemented by adding a pair of
    parentheses to the outside of the statement. Now we are ready to give a brief
    explanation about various essential programming operations in the next chapter.
    Let us start with it! '
