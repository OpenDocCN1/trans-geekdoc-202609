    \ Learning Algorithms\n\nCommon machine learning algorithms are as follows:\n\n\
    1.  **Linear Regression Algorithm**  \n    This is the most basic machine learning\
    \ algorithm, but although sparrows are small and have all five organs, this algorithm\
    \ can be called the \"Hello World\" program in the field of machine learning algorithms.\
    \ It uses linear methods to solve regression problems.\n\n2.  **Logistic regression\
    \ classification algorithm**  \n    This is the \"twin brother\" of the linear\
    \ regression algorithm. Its core idea is still the linear method, but a \"waistcoat\"\
    \ named Logistic function is set up, which enables it to solve classification\
    \ problems.\n\n3.  **KNN classification algorithm**  \n    This algorithm is the\
    \ only one of the classification algorithms introduced in this book that does\
    \ not rely on mathematical or statistical models but purely relies on \"life experience\"\
    . It solves the classification problem through the idea of \"finding the nearest\
    \ neighbor\". Its core idea has a far-reaching relationship with the consensus\
    \ mechanism in blockchain technology.\n\n4.  **Naive Bayesian classification algorithm**\
    \  \n    This is a set of algorithms that can refresh your world outlook. It believes\
    \ that the results are not deterministic but probabilistic. What you see in front\
    \ of your eyes is only the results with the greatest probability. Of course, the\
    \ algorithm is used to solve the problem. Naive Bayesian classification algorithm\
    \ solves the classification problem.\n\n5.  **Support Vector Machine Classification\
    \ Algorithm**  \n    If the Logistic regression classification algorithm is the\
    \ most basic linear classification algorithm, then the support vector machine\
    \ is the highest form of linear classification algorithm and is also the most\
    \ \"mathematical\" machine learning algorithm. The algorithm uses a series of\
    \ stunning mathematical techniques to map linearly indivisible data points into\
    \ linearly separable data points and then uses the simplest linear method to solve\
    \ the problem.\n\n6.  **K-means clustering algorithm**  \n    Supervised learning\
    \ is a mainstream method of machine learning at present, but sample marking needs\
    \ a lot of labor costs, which is prone to the problem of large sample accumulation\
    \ scale but insufficient marking. Unsupervised learning is a machine learning\
    \ algorithm that does not rely on labeled samples.\n\n7.  **Neural Network Classification\
    \ Algorithm**  \n    Many people think that this algorithm is bionic, and the\
    \ object of imitation is our brain. The neural network classification algorithm\
    \ is also the starting point of the popular depth learning algorithm.\n\nWith\
    \ this, we have completed a thorugh introduction to machine learning using Python.\
    \ In the next chapter, we will in detail discuss about classes and objects in\
    \ Python. Follow along!\n"
  trans: "\n\n# 第 12 章：Python 中的机器学习\n\n机器学习是计算机科学的一个分支，它从可用的海量数据块中提取有价值的信息。它利用各种计算机科学和统计学原理来创建功能完善的人工智能应用。几十年来，机器学习一直是研究领域的显著方向。然而，在\
    \ 21 世纪，随着高性能计算机的发展，机器学习应用达到了前所未有的高度。几乎所有的 Web 应用都使用机器学习算法为用户推荐建议。本章是一份详细的分步教程，将帮助你理解机器学习在日常生活中的重要性，并向你介绍如何使用\
    \ Python 作为辅助语言来开发机器学习应用。请继续跟随学习！\n\n## 机器学习在日常生活中的应用\n\n在开始技术内容之前，我们将给出一个真实世界的例子，帮助你理解机器学习算法在现实生活中的重要性。想象一下，你使用\
    \ Siri/Google Assistant 等虚拟助手询问周围最好的餐厅。当你提出这个问题时，虚拟助手会分析现有的海量数据，并根据你的需求选择一家餐厅。这就是实际搜索查询的工作原理。机器学习为此增加了一层功能。它监控你对结果的反应，并自我改进，下次产生更好的结果。所以，用一句话概括：“机器学习是一种计算机学习场景，机器会随着时间的推移而自我改进。”\n\
    \n## 机器学习的应用\n\n在初期阶段，机器学习借助当时开发的各种算法，用于实现决策自动化。机器学习的这一确切分支被称为**监督学习**。还有一个分支被称为**无监督学习**，机器根据提供的数据集自行生成新算法。例如，在\
    \ 2000 年代，机器学习算法被用于开发垃圾邮件过滤器。邮件开发者收集了所有的垃圾邮件关键词，制作了一个算法，自动将可疑邮件发送到垃圾箱。你可能会想这只是一个普通的垃圾邮件过滤应用，但这款垃圾邮件过滤软件会随新的垃圾邮件数据库自动更新自身。机器学习系统在执行任务的过程中不断学习。在下一节中，我们将详细讨论机器学习的应用。请继续跟随学习！\n\
    \n### a) 用于医学临床分析\n\n机器学习可用于开发应用程序，通过检查收集的数千张临床照片，检测患者患有的医学肿瘤或皮肤病。它们还可以同时用于对患者进行鉴别诊断。\n\
    \n### b) 安全\n\n机器学习可用于开发提高在线交易安全性的应用程序。大量欺诈性信用卡操作遵循某种模式，机器学习算法通常很容易拦截这些欺诈交易。\n\
    \n### c) 图像处理\n\n机器学习可用于开发人脸检测应用程序。机器学习的这一分支被称为**深度学习**，在业界非常著名。\n\n### d) 推荐\n\
    \n许多网站依赖云端用户数据，提供用户可能喜欢的推荐。亚马逊等电商网站分析用户数据，提供用户可能购买的商品推荐。所有这些推荐都是网站使用的不同机器学习算法生成的。\n\
    \n### 5) 分类\n\n机器学习算法还可用于对收集的数据按不同主题进行分类。这被称为**回归算法**，如果在电商和流媒体应用中正确使用，将非常有用。\n\
    \n至此，我们完成了一个简要介绍，解释了机器学习的应用。在下一节中，我们将讨论 Python 在机器学习应用中的使用。让我们开始吧！\n\n## 为什么 Python\
    \ 被认为最适合机器学习？\n\nPython 被认为是最佳选择，因为它拥有适用于各个计算机领域的库。有可显式用于数据分析的统计和可视化库。Python 也非常交互式，可以使用\
    \ `Jupyter notebook` 等软件与数据点进行交互。此外，请记住，机器学习是一个高度依赖迭代层级的计算过程。Python 是一种交互式语言，因此被认为是机器学习的最佳编程语言。以下是开发机器学习项目必不可少的一些\
    \ Python 库。\n\n### a) Scikit Learn\n\n这是一个基础机器学习库，包含各种著名的机器学习算法。Scikit learn 包含一个文档文件，其中有关于每个算法的充分信息。它在计算机科学家中特别著名，因为它在一个库中整理了大量必不可少的算法。`scipy`\
    \ 中存在的许多机器学习算法可以轻松部署到你的软件中。首先，使用以下命令在系统中安装 scikit learn：\n\n```\nroot @ tony :\
    \ pipi install { Enter the dependencies} scikit\n```\n\n需要哪些依赖项？你需要安装 `Anaconda`，一个用于使\
    \ sci-kit learn 工作的 Python 模块。`Anaconda` 包含许多运行机器学习算法必不可少的 Python 模块。\n\n### b)\
    \ Jupyter notebook\n\n这是一个 Python 工具，可帮助你在浏览器中运行程序代码。重要的是要注意 `Jupyter` 还支持不同的语言。因此，如果你有其他语言的代码，可以将其与\
    \ Python 集成以获得理想结果。\n\n### C) NumPy\n\n如前所述，机器学习是计算机科学的一个分支，是数学、统计学和计算机科学的结合体。为了编写高效的机器学习程序，必须使用\
    \ `NumPy` 提供的统计算法。`NumPy` 是一个 Python 库，包含多维数组和高阶数学函数。`NumPy` 通常用于表示或查找数据集中的数据点。\n\
    \n### d) SciPy\n\n机器学习在初期阶段是一个完整的科学领域。开发了许多算法，以寻找处理高性能计算机编程的简便方法。`SciPy` 是一个处理科学计算的\
    \ Python 库。它很重要，因为它包含可用于深度学习应用的高阶数学函数。`SciPy` 模块还可用于创建稀疏矩阵。\n\n### e) matplotlib\n\
    \n在开发机器学习应用时，可视化数据很重要。许多统计图表可用于创建可视化，如直方图和散点图。数据集可以使用 Python 中的 `matplotlib` 进行可视化。该库可以帮助你在处理海量数据块时提供交互式环境。\n\
    \n### f) pandas\n\n数据分析也是机器学习的一个分支，需要使用 `pandas` 通过数据帧来分析数据。使用 `pandas`，你可以创建查询和选择数据的程序。掌握\
    \ `pandas` 对于分析 CSV 文件很重要。\n\n这些是掌握机器学习必不可少的一些重要 Python 库。还必须记住，运行上述所有库都强制要求 **Python\
    \ 3**。因此，请确保你了解所有 Python 3 编程基础。在下一节中，我们将解释一个简单的示例，帮助你理解机器学习的过程。目前这部分内容相当理论化。不过，你随时可以通过研究来填补空白。Python\
    \ 仍在迭代且不向前兼容，这也导致当前的 Python 分裂为两个主要版本，即 Python 2.X 和 Python 3.x。虽然在语法上还不算两种语言，但两者代码不能混用，选择版本也是学习使用\
    \ Python 时首先要确定的事情。以前普遍认为 Python 2.X 发展时间更长，在各方面拥有更多更成熟的支持库，许多人推荐从这个版本入手。然而，随着\
    \ Python 团队宣布将于 2020 年停止维护 Python 2.X，所有主要社区都已开始从 2.X 向 3.X 迁移，所以现在学习 Python 更推荐选择\
    \ 3.X。Python 是一种通用编程语言，其语法满足图灵完备性，无法在此完全解释。不过，如果你熟悉 C 或 Java 语言，可以把 Python 的语法看作是它们的高度浓缩版本。除了上述不需要进行类型声明外，Python\
    \ 还没有大括号来表示作用域，也没有语句末尾的分号。同时，Python 中的缩进不仅是代码规范，也是语法层面的强制要求。如果你有语言基础并记住这些差异，应该能够熟练且快速地使用\
    \ Python。\n\n## 使用 Python 学习机器学习的策略\n\n一般来说，练习算法理论有两种方式。一种是自己用代码实现算法。另一种是充分利用工具的便利性，快速理解和掌握现有资源，然后开始解决实际问题。我认为很难决定是否要“重复造轮子”。每种方法都有其优缺点。近年来机器学习快速发展，积累了非常丰富的开放资源。通过充分利用这些资源，即使你以前不了解这个领域，也能快速掌握并解决实际问题。首先是编程语言，我们选择\
    \ Python。在过去几年里，Python 和 R 语言在机器学习领域一直保持双强局面。通常认为工业界偏爱 Python，而学术界偏爱 R。然而，随着技术发展，Python\
    \ 语言已成为机器学习领域当之无愧的“老大哥”，特别是近年来深度学习所需的支持库无一例外地都在 Python 中实现。得益于机器学习的流行，Python 甚至有实力与传统编程语言\
    \ C 和 Java 竞争，并在许多编程语言排行榜中名列前茅。下一步是支持库 `Numpy`。机器学习涉及大量矩阵运算等数学运算。幸运的是，Python 有两大特点，一是灵活性，二是拥有大量库。`Numpy`\
    \ 是专门为 Python 科学计算设计的专业支持库，在业界享有盛誉。不仅机器学习，天体物理学等涉及数学运算的其他科学领域，也要么直接使用 `NumPy`，要么基于\
    \ `NumPy` 构建更高层的功能库。最后是算法库 `Scikit-Learn`。有许多基于 Python 的机器学习算法库。然而，`Scikit-Learn`\
    \ 始终名列前茅。它不仅种类齐全，而且能找到市面上可用机器学习算法对应的 API，简直是“机器学习算法超市”。此外，它封装良好，结构清晰。你只需几行简单的代码即可完成复杂算法的调用。它是进入机器学习领域的良好入门指南，也是进阶的利器。\n\
    \n## 著名机器学习算法\n\n常见的机器学习算法如下：\n\n1.  **线性回归算法**  \n    这是最基础的机器学习算法，但“麻雀虽小，五脏俱全”，该算法可称为机器学习算法领域的“Hello\
    \ World”程序。它使用线性方法解决回归问题。\n\n2.  **逻辑回归分类算法**  \n    这是线性回归算法的“孪生兄弟”。其核心思想仍是线性方法，但披上了一件名为\
    \ Logistic 函数的“马甲”，使其能够解决分类问题。\n\n3.  **KNN 分类算法**  \n    该算法是本书介绍的分类算法中唯一不依赖数学或统计模型，而纯粹依赖“生活经验”的算法。它通过“寻找最近邻”的思想解决分类问题。其核心思想与区块链技术中的共识机制有着深远的关系。\n\
    \n4.  **朴素贝叶斯分类算法**  \n    这是一组能刷新你世界观的算法。它认为结果不是确定性的，而是概率性的。你眼前看到的只是概率最大的结果。当然，算法是用来解决问题的。朴素贝叶斯分类算法解决分类问题。\n\
    \n5.  **支持向量机分类算法**  \n    如果逻辑回归分类算法是最基础的线性分类算法，那么支持向量机就是线性分类算法的最高形式，也是最“数学化”的机器学习算法。该算法利用一系列惊艳的数学技巧，将线性不可分的数据点映射为线性可分的数据点，然后用最简单的线性方法解决问题。\n\
    \n6.  **K-means 聚类算法**  \n    监督学习是目前机器学习的主流方法，但样本标注需要大量人力成本，容易导致样本积累规模大但标注不足的问题。无监督学习是一种不依赖标注样本的机器学习算法。\n\
    \n7.  **神经网络分类算法**  \n    许多人认为该算法是仿生的，模仿对象是我们的大脑。神经网络分类算法也是流行的深度学习算法的起点。\n\n\
    至此，我们完成了关于使用 Python 进行机器学习的详尽介绍。在下一章中，我们将详细讨论 Python 中的类和对象。请继续跟随学习！\n\n"
