    # Chapter 3: Different Versions of Python?


    Python is a programming language that has been constantly developed by various
    programmers individually by collaborating with different resources. In 1984, Python''s
    first version was released and for years it has been constantly updated with various
    functionalities. In this chapter, we will discuss various Python versions and
    their abilities.


    ## Which version most programmers use?


    As of this writing, Python programmers largely rely upon Python 2.x versions for
    developing applications. Even after 10 years of their release, Python 3.x versions
    are not widely used by the community for its complex implementation of the functions.
    However, Python 3.x versions also provide a lot of new features for advanced machine
    learning applications. As this book focuses on Machine learning, we recommend
    you to try Python 3.x versions to develop applications.


    ## Why are versions important?


    When a programming language is developed there is often scope for bugs and security
    issues that can destroy the reputation. This is one reason programming languages
    are often updated to newer versions with better compatibility. Python developers
    in 2008 have started providing a 3.x version of Python with advanced functionalities,
    but with a change in syntax and implementation format. Programmers are already
    comfortable with the 2.x version functionalities and did not go along with the
    flow. However, as years passed Python 3.x has improved drastically and is now
    an efficient version of Python with advanced features. The Python downloads homepage
    provides all these versions to download at a click. All you need to do is understand
    and analyze which software version fits your needs. In the next section, we will
    provide complete features of all the major Python versions that got released.


    ## History of Python versions


    ### a) Python version 1


    The first version of Python is developed and released in 1984. At that time, C
    is a popular language and is holding a good percentage of the programming market.
    By 1995, the python developers have included higher-order functions such as `lambda`
    and `maps` in the package. The first version of Python is a huge success when
    looked at from a programming perspective. However, it is still not a programmer''s
    favorite due to different compatibility reasons.


    ### b) Python version 2


    Python version 2 has changed the impact of Python in the programming world. A
    lot of new features such as list comprehensions and functional programming are
    introduced in this version of Python. Also, version 2 has made python function
    declaration much easier. A lot of new concepts such as garbage mechanism and operator
    overloading are introduced to make this version easier to operate and maintain.
    Till 2020, Python developers will maintain the version 2 python.


    ### c) Python version 3


    Python version 3 didn''t do well in the programming arena when it is first introduced.
    A lot of programmers complained about the function declarations when it is first
    released. However, as time passed with updated versions Python has shown its impact
    in the programming world. A lot of advanced scientific applications started to
    use system functions introduced in Python 3 to implement their programs. Python
    3 also made a lot of changes to type declarations and has moved on to become one
    of the most successful versions of Python.


    ## Which Python version you should choose?


    It is a programmer choice to pick up the version he is more comfortable with.
    However, here is a suggestion that experienced programmers give to the beginners.


    > "Always chose the version of the Python according to your requirements. If you
    want to develop a simple crawler application then it makes sense to use an older
    version. If you are trying to build an advanced application that involves various
    new functionalities, we recommend you to try the newer versions"


    ## Which version is best for Data scientists?


    In this book, we mostly discuss Python version 3. This version is more supportive
    of machine learning libraries and consists of a lot of list operations. As we
    deal with a huge chunk of data manipulating list items is a mandatory task. So,
    we recommend you to try Python version 3 to develop machine learning projects.


    ## Which version is the most popular?


    As of now, a lot of web and mobile applications are being developed using Python
    version 2. However, after 2020 Python will officially stop supporting Python 2
    and evidentially after that, we will see a bounce in the number of programmers
    using Python 3. According to a recent study conducted by Harvard University, Python
    2 is one of the simplest and intuitive Python versions that ever got released.
    With this, we have completed a brief introduction to Python versions in this chapter.
    In the next chapter, we will discuss functional programming in detail. Follow
    along!

    '
