- raw: 'Chapter 11: Practical Project in python In the previous chapter, we have discussed
    ways to design a project. In this project, we will in detail explanation about
    the implementation of a practical project with a lot of background information
    followed by Python code. Follow along carefully. Maintenance and Improvement ￼It
    has been successfully implemented to control the shutdown or restart of the computer
    through Python, but it cannot meet all requirements. Therefore, it is necessary
    to solve this defect: the program can not only control the shutdown or restart
    of the local computer but also remotely control the shutdown or restart of the
    computer through the network. After discovering the defects of the old version,
    the process of developing the new version is the maintenance and improvement of
    the software. ￼ Remote Control Channel ￼If you want to remotely control the shutdown
    or restart of the computer, the local computer needs networking. After networking,
    you also need to choose a remote-control channel, such as Gmail, web page or e-mail.
    Controlling Python to Operate Computer 1 via Mail As long as it can communicate
    with remote, it can be used as a channel for remote control. Therefore, there
    are many channels for remote control. In this project, the mail is chosen as the
    channel tool for remote control. ￼ Controlling Python to Operate Computer 2 via
    Mail This project uses e-mail as a remote-control channel to realize remote control
    of computers. It can be seen that the user sends corresponding instructions to
    the e-mail, then the instructions are transmitted to Python code (the specified
    instructions can be monitored regularly by Python), and finally, the local computer
    is controlled to execute corresponding operations by Python code. Therefore, the
    following parts need to be developed in turn: (1) Log into the mailbox through
    Python (of course, other remote-control channels can also be selected). (2) Monitor
    and read the mail content of the designated mailbox through Python. (3) Realize
    the function of mail sending through Python (not required). (4) the core business
    logic processing part. First of all, you need to prepare a mailbox. Because the
    port and use of Gmail are different from other mailboxes, here you can use Rediff
    mail for operation. Here, the author has prepared a Rediff mailbox (account number
    or password may be modified later, and the modified code cannot be used, so everyone
    should register a mailbox of their own). Account number: [example@rediffmail.com](mailto:example@rediffmail.com)
    Password: sample123 Log in to your mailbox on the web page and make some settings.
    The default SMTP and POP3 are closed, but SMTP is required to send mail through
    Python code, POP3 is required to read mail through Python code, so these two items
    need to be opened first. You can select the "Settings-Client pop/imap/smtp" option
    in the mailbox personal center control panel. As you can see, the default POP3
    and SMTP are turned off, so you need to select the "on" radio button and save
    it. ￼After opening, you can log in to the mailbox using Python code. As can be
    seen, the default POP3 server and SMTP server information of Rediff mailbox are
    as follows. POP3 server: pop.rediff.com. SMTP Server: smtp.rediff.com. Next, I''ll
    show you how to log in to your mailbox using the Python code. The purpose of logging
    into the mailbox is different, and the modules used are also different.  If the
    purpose of logging into the mailbox is to send mail, you can call SMTP () under
    smtplib to establish a mail object, and then call login () method under the mail
    object to log in. If the purpose of logging into the mailbox is to check mail,
    you can call POP3 () under poplib to establish a mail object, and then call the
    user () method and pass\_ () method under the object to set the account and password
    when logging into the mailbox. After setting, you can log in. Next, you can enter
    the following code to demonstrate how to log in to the mailbox: The key parts
    have been commented: \# 1. log in to the mailbox for sending mail import { Enter
    the library} \# establish a mail object through SMTP (), the parameters in which
    are the SMTP server address of the corresponding mailbox smpt.call() Through the
    above exercises, everyone should have mastered how to log into the mailbox using
    Python code. It should be noted that the modules and methods used to log in to
    the mailbox are different depending on the purpose of use. Next, I''ll show you
    how to monitor and read the mail content of the specified mailbox through Python.
    If you want to read the mail information of the specified mailbox through Python
    code, you need to log in to the corresponding mailbox through POP3 first, then
    call stat () to obtain statistical information. You can specify to return the
    first few lines of mail information through top () and decode the returned information.
    After decoding, the decoded information can be converted into recognizable mail
    information by email.message\_from\_string (), and then the recognizable mail
    information can be processed by email.header.decode\_header (), and the required
    mail information can be read out after processing. For example, if you need to
    read the title of the latest email, it can be implemented by the following code,
    and the key parts have been given detailed comments: print (statistics) (Here
    is the values) emailmsg = mail. top (statistics \[0\], 0) ￼print(emailmsg) ￼for
    I in emailmsg \[1\]: newmsg. append (I.decode ()) \> > > # view decoded information
    > ￼title = decode \_ header (myemailmsg \["subject"\]) Through the above code,
    the mail information can be read directly. At this time, you can log into the
    mailbox of the webpage version to verify whether it is correct. After logging
    into the mailbox of the webpage version, you can see the information on the latest
    email. ￼It can be seen that the message title of the latest mail is "I am a test
    mail", which is consistent with the results read and output in the code. Therefore,
    the mail information in the mailbox has now been successfully read through the
    code. Next, let''s introduce how to realize the function of mail sending through
    Python. This part of the program is not necessary for this project. The purpose
    of this project is to realize the remote control of the computer through the remote
    channel of e-mail, which only requires Python to monitor the instruction information
    in the e-mail.  The link to sending e-mail can be realized by Python code or traditional
    e-mail, so this part is not necessary. Of course, learning the function of this
