    \ using the specified function. The sample code is as follows:\n```\nbin(20) \
    \  # converts decimal 20 to binary '0b10100'\noct(20)   # converts decimal 20\
    \ to octal '0o24'\nhex(20)   # convert decimal 20 to hexadecimal '0x14'\n```\n\
    \n#### Long Integer\n\n`Long` is a superset of integers, which can represent an\
    \ infinite integer (actually only limited by the computer's virtual memory size).\
    \ Long integer literal values are followed by the letters `l` or `L` (uppercase\
    \ `L` is recommended). Long and integer operations are the same. The sample code\
    \ is as follows:\n```\nfirst = 13798433 * 3749803498\n# <type 'long'>\n```\nIn\
    \ the long run, integer and long integer are gradually unified into an integer\
    \ type. Starting from Python 2.3, integer overflow errors will no longer be reported,\
    \ and the results will be automatically converted to long integers. Now the two\
    \ types of integers can be said to be seamlessly combined, and the long integer\
    \ suffix `L` becomes optional.\n\n#### Floating Point Type\n\n`Float` is used\
    \ to represent real numbers. For example, `3.14`, `9.19`, etc. are all floating-point\
    \ types. Floating-point literals can be expressed in decimal or scientific notation.\
    \ The scientific notation in Python is expressed as follows:\n```\n<real number>\
    \ e or E <integer>\n```\nWherein, `e` or `E` represents a base of 10, the following\
    \ integer represents an exponent, and the positive and negative of the exponent\
    \ are expressed by `+` or `-`, where `+` can be omitted. For example, `1.34E3`\
    \ means `1.34x10^3` and `1.5E-3` means `1.5x10^-3`.\n\nThe sample code is as follows:\n\
    ```\n>>> 1.2e5  # floating-point number is 1.2×10^5\n# 120000.0\n```\n\n#### Boolean\
    \ Type\n\nThe boolean type can be regarded as a special integer. Boolean data\
    \ has only two values: `True` and `False`, corresponding to `1` and `0` of integer\
    \ respectively. Every Python object is inherently boolean (`True` or `False`),\
    \ which can then be used in boolean tests (such as `if`, `while`). User-defined\
    \ class instances return `False` if methods `__nonzero__()` or `__len__()` are\
    \ defined and return `0` or `False`. Boolean values of all objects except the\
    \ above objects are `True`. This section involves a lot of knowledge explained\
    \ later. All you need to know here is that Boolean values can only be `True` and\
    \ `False`.\n\n#### Complex Type\n\nThe complex number type is used to represent\
    \ the complex number in mathematics. For example, `5+3j` and `-3.4-6.8j` are all\
    \ complex number types. The complex type in Python is a data type that is not\
    \ available in general computer languages. It has the following two characteristics:\n\
    \n1. Complex numbers consist of real numbers and imaginary numbers, which are\
    \ expressed as `real+imagj` or `real+imagJ`.\n2. The real part and imaginary part\
    \ `imag` of complex numbers are both floating-point types.\n\nIt should be noted\
    \ that a complex number must have `j` or `J` representing imaginary parts, e.g.\
    \ `1j` and `1J` are complex numbers, and `0.0` is not a complex number. The real\
    \ part representing imaginary parts cannot be omitted even if it is `1`.\n\nExample\
    \ codes for complex numbers are as follows:\n```\nsample = 6+2j\nsample\n# (6+2j)\n\
    sample.real          # real part\n# 6.0\ntype(sample.real)\n# <class 'float'>\n\
    sample.imag          # imaginary part\n# 2.0\ntype(sample.imag)\n# <class 'float'>\n\
    ```\n\n## Identifiers and Keywords\n\n### Identifier\n\nIn real life, people often\
    \ use some names to mark things. For example, each fruit has a name to mark. Similarly,\
    \ if you want to express something in a program, you need developers to customize\
    \ some symbols and names, which are called identifiers. For example, variable\
    \ names, function names, etc. are identifiers.\n\nThe identifier in Python consists\
    \ of letters, numbers and underscore `_`, and its naming method needs to follow\
    \ certain rules, as follows:\n\n1. Identifiers consist of letters, underscores,\
    \ and numbers, and cannot begin with numbers.\n   The sample code is as follows:\n\
    \   ```\n   FromNo12      # legal identifier\n   From#12       # illegal identifier.\
    \ Identifiers cannot contain # symbols.\n   2ndObj        # illegal identifier.\
    \ Identifiers cannot start with a number.\n   ```\n2. Identifiers in Python are\
    \ case sensitive. For example, `andy` and `Andy` are different identifiers.\n\
    3. Identifiers in Python cannot use keywords. For example, `if` cannot be used\
    \ as an identifier.\n\nAlso, to standardize the naming of identifiers, the following\
    \ suggestions are made on the naming of identifiers:\n\n1. **Knowing the meaning\
    \ by name**: give a meaningful name and try your best to know what the identifier\
    \ means at a glance, thus improving the readability of the code. For example,\
    \ the definition name is represented by `name`, and the definition student is\
    \ represented by `student`.\n2. When naming variables, many computer languages\
    \ suggest camelCase naming. However, camelCase naming is not recommended in Python\
    \ (snake_case is preferred).\n\n### Keywords\n\nIn Python, identifiers with special\
    \ functions are called keywords. The keyword is already used by Python itself,\
    \ and developers are not allowed to define identifiers with the same name as the\
    \ keyword. The keywords in Python each represent a different meaning. If you want\
    \ to view the keyword information, you can enter the `help()` command to enter\
    \ the help system to view.\n\nThe sample code is as follows:\n```\n>>> help()\
    \        # enter the help system\nhelp> keywords    # view all keyword lists\n\
    help> return      # view the description of the keyword return\nhelp> quit   \
    \     # to exit the help system\n```\n\nWith this we have completed a brief explanation\
    \ of data types and in the next chapter we will explain about variables in detail.\
    \ Follow along!\n"
  trans: "\n# 第 4 章：Python 数据类型\n\nPython 和其他编程语言使用数据类型在内存中逻辑地存储值。区分带有值的数据有助于操作执行得更快。我们还将在本章讨论其他重要的编程概念，如标识符和保留关键字。\n\
    \n## 数据类型\n\n对象支持的操作及其描述由数据类型决定。因此，了解数据类型对程序员非常重要。Python 语言提供了若干功能丰富的内置数据类型。在解释每种数据类型及其支持的操作之前，通常会检查对象的类型。Python\
    \ 提供了一个特定的内置函数 `type()` 来执行这些操作。它返回一种称为类型对象的特殊类型，该类型可进一步细分为其他类型。\n\n### 类型检测函数\
    \ `type()`\n\n使用 `type()` 函数可快速检查变量的类型，或确定它们能执行的操作类型。\n\n例如：\n```\ntype(example)\
    \  # 其中 example = 8\n```\n我们将通过 `type()` 函数得到输出 `int`。`type()` 函数非常简单。它可以快速帮助我们检测对象的实际类型，无论是通过变量名还是值。\n\
    \n### 空对象 (`None`)\n\nPython 中另一种特殊的类型称为空对象。它只是空的，可以容纳空值。\n\n### 简单数值类型\n\n####\
    \ 整数\n\n整数类型 (`int`) 就是整数，用于表示整数，例如 `100`、`2016` 等。整数字面量有四种表示方式：十进制、二进制（以 `0B`\
    \ 或 `0b` 开头）、八进制（以数字 `0` 开头）和十六进制（以 `0X` 或 `0x` 开头）。\n\nPython 的整数可以表示有限范围，这与系统的最大整数一致。例如，32\
    \ 位计算机上的整数是 32 位，可表示的数字范围是 `-2³¹` ~ `2³¹-1`。64 位计算机上的整数是 64 位，可表示的数字范围是 `-2⁶³`\
    \ ~ `2⁶³-1`。\n\n接下来，看一些整数代码示例，如下所示：\n```\nfirst = 231283\ntype(first)\n# <type\
    \ 'int'>\nfirst\n# 231283\n```\n在上述代码中，第 1 行变量 `first` 的值是一个十进制整数，属于 `int` 类型。这在接下来的几行中得到了验证。第\
    \ 4 到 5 行直接输出 `first` 的值，结果为 `231283`。\n\n十进制数可以使用指定函数转换为二进制、八进制或十六进制。示例代码如下：\n\
    ```\nbin(20)   # 将十进制 20 转换为二进制 '0b10100'\noct(20)   # 将十进制 20 转换为八进制 '0o24'\n\
    hex(20)   # 将十进制 20 转换为十六进制 '0x14'\n```\n\n#### 长整数\n\n`Long` 是整数的超集，可以表示无限大的整数（实际上仅受计算机虚拟内存大小限制）。长整数字面量后跟字母\
    \ `l` 或 `L`（推荐使用大写 `L`）。长整数和整数的操作相同。示例代码如下：\n```\nfirst = 13798433 * 3749803498\n\
    # <type 'long'>\n```\n从长远来看，整数和长整数逐渐统一为整数类型。从 Python 2.3 开始，将不再报告整数溢出错误，结果将自动转换为长整数。现在这两种整数类型可以说是无缝结合了，长整数后缀\
    \ `L` 变成了可选的。\n\n#### 浮点类型\n\n`Float` 用于表示实数。例如，`3.14`、`9.19` 等都是浮点类型。浮点字面量可以用十进制或科学计数法表示。Python\
    \ 中的科学计数法表示如下：\n```\n<实数> e 或 E <整数>\n```\n其中，`e` 或 `E` 代表以 10 为底，后面的整数代表指数，指数的正负用\
    \ `+` 或 `-` 表示，其中 `+` 可以省略。例如，`1.34E3` 表示 `1.34x10³`，`1.5E-3` 表示 `1.5x10^-3`。\n\
    \n示例代码如下：\n```\n>>> 1.2e5  # 浮点数为 1.2×10⁵\n# 120000.0\n```\n\n#### 布尔类型\n\n布尔类型可视为一种特殊的整数。布尔数据只有两个值：`True`\
    \ 和 `False`，分别对应整数的 `1` 和 `0`。每个 Python 对象天生就具有布尔值（`True` 或 `False`），随后可用于布尔测试（如\
    \ `if`、`while`）。如果定义了方法 `__nonzero__()` 或 `__len__()` 并返回 `0` 或 `False`，用户定义的类实例返回\
    \ `False`。除上述对象外，所有对象的布尔值均为 `True`。本节涉及大量后续讲解的知识。此处你只需知道布尔值只能是 `True` 和 `False`。\n\
    \n#### 复数类型\n\n复数类型用于表示数学中的复数。例如，`5+3j` 和 `-3.4-6.8j` 都是复数类型。Python 中的复数类型是一般计算机语言中没有的数据类型。它具有以下两个特征：\n\
    \n1. 复数由实数和虚数组成，表示为 `real+imagj` 或 `real+imagJ`。\n2. 复数的实部和虚部 `imag` 均为浮点类型。\n\
    \n应注意，复数必须包含代表虚部的 `j` 或 `J`，例如 `1j` 和 `1J` 是复数，而 `0.0` 不是复数。即使实部为 `1`，代表虚部的实部也不能省略。\n\
    \n复数的示例代码如下：\n```\nsample = 6+2j\nsample\n# (6+2j)\nsample.real          # 实部\n\
    # 6.0\ntype(sample.real)\n# <class 'float'>\nsample.imag          # 虚部\n# 2.0\n\
    type(sample.imag)\n# <class 'float'>\n```\n\n## 标识符和关键字\n\n### 标识符\n\n在现实生活中，人们经常用一些名称来标记事物。例如，每种水果都有名称来标记。同样，如果想在程序中表达某事物，需要开发者自定义一些符号和名称，称为标识符。例如，变量名、函数名等都是标识符。\n\
    \nPython 中的标识符由字母、数字和下划线 `_` 组成，其命名方法需遵循特定规则，如下所示：\n\n1. 标识符由字母、下划线和数字组成，且不能以数字开头。\n\
    \   示例代码如下：\n   ```\n   FromNo12      # 合法标识符\n   From#12       # 非法标识符。标识符不能包含\
    \ # 符号。\n   2ndObj        # 非法标识符。标识符不能以数字开头。\n   ```\n2. Python 中的标识符区分大小写。例如，`andy`\
    \ 和 `Andy` 是不同的标识符。\n3. Python 中的标识符不能使用关键字。例如，`if` 不能用作标识符。\n\n此外，为规范标识符的命名，对标识符的命名提出以下建议：\n\
    \n1. **见名知意**：给出有意义的名称，力求一眼就能看出标识符的含义，从而提高代码的可读性。例如，用 `name` 表示定义的名称，用 `student`\
    \ 表示定义的学生。\n2. 命名变量时，许多计算机语言建议使用驼峰命名法。但是，Python 中不推荐使用驼峰命名法（首选 snake_case）。\n\n\
    ### 关键字\n\n在 Python 中，具有特殊功能的标识符称为关键字。关键字已被 Python 自身使用，开发者不允许定义与关键字同名的标识符。Python\
    \ 中的关键字各代表不同的含义。如果想查看关键字信息，可以输入 `help()` 命令进入帮助系统查看。\n\n示例代码如下：\n```\n>>> help()\
    \        # 进入帮助系统\nhelp> keywords    # 查看所有关键字列表\nhelp> return      # 查看关键字 return\
    \ 的说明\nhelp> quit        # 退出帮助系统\n```\n\n至此，我们已完成对数据类型的简要解释，在下一章我们将详细讲解变量。请继续关注！\n"
