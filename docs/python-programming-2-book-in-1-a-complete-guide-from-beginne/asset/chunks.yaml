    `RB`\", \"`WB`\" and \"`AB`\" modes all operate files in binary mode. Usually,\
    \ these modes are used to process files of binary types, such as sound or image.\n\
    \n### Closing of Documents\n\nAlways use the `close` method to close open files.\
