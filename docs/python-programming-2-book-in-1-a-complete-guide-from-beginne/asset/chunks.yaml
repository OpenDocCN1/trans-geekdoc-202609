    first = [1, 2]\nsecond = [3, 4]\nfirst.append(second)\nprint(first)\nfirst.extend(second)\n\
    print(first)\n```\n\nIn this example, `append()` is used to add List `second`\
    \ to the end of List `first`, and then `extend()` is used to add all the elements\
