  fmt: "\n# Chapter 13: How to create a Class in python?\n\nObject-oriented programming\
    \ is an essential feature in the Python programming language. Even with the presence\
    \ of the functional programming paradigm in Python, a lot of developers like to\
    \ use object-oriented mechanisms for developing programs. There are a lot of reasons\
    \ that make developers choose object-oriented programming over functional. Machine\
    \ learning experts should be quite aware of object and class creation when dealing\
    \ with algorithms. This chapter is a comprehensive introduction to object-oriented\
    \ programming basics. Let us start!\n\n## How is it different from procedural\
    \ programming?\n\nProcedural programming is a paradigm where problems are solved\
    \ using reusable code segments known as functions. It is often difficult to insert\
    \ new logic or data to the already created code. In a machine learning environment,\
    \ it is often important to automatically rearrange the code segments to give the\
    \ best results. This is the reason why machine learning enthusiasts should implement\
    \ resources that will help you to extend into an object-oriented model whenever\
    \ needed.\n\n## How does object orientation work?\n\nObject-oriented programming\
    \ uses a different philosophy that separates like-minded objects into categories.\
    \ Using these categories, you can individually change functionalities that are\
    \ required. Apart from easier code maintenance, they can also be used to maintain\
    \ the unity of the functions. We will now in detail discuss classes and objects\
    \ from a data scientist perspective.\n\n## What are Classes and Objects?\n\nFrom\
    \ a programmer's perspective, classes are a blueprint that are developed to deal\
    \ with objects easily. In a class, we will usually group like-minded variables,\
    \ methods, and constructors to easily work with them. When dealing with small\
    \ projects procedural programming techniques are feasible. However, as the size\
    \ of the project expands, we need to write a lot of code that does the same thing\
    \ from a different perspective. To counter this problem Classes and Objects are\
    \ developed, by which we can easily inherit the parent classes and use them in\
    \ our projects.\n\n## What do classes consist of?\n\nClasses consist of methods\
    \ that can do a certain task. There are global and local variables in a class\
    \ that can be used according to the situation. All these methods and variables\
    \ can be used as an object instance by the programmer.\n\n## How to define a class?\n\
    \nIn Python, unlike Java, you need to store classes using a Python file. In java\
    \ programming language programmers usually save separate class files with a `.class`\
    \ extension. However, Python makes things simple by using the same `.py` format.\
    \ In the next section, we will use an example that will help you understand the\
    \ creation of a class in Python. To master object-oriented programming, we first\
    \ need to understand the basic theories and concepts of object-oriented programming.\
    \ This section will introduce the basic theories and concepts of object-oriented\
    \ programming in detail.\n\n## Object-Oriented scenarios in real life\n\nIn the\
    \ world we live in, any specific thing can be regarded as an object, and each\
    \ object can handle some things or have some static characteristics. For example,\
    \ each specific person can be regarded as an object. This object can handle some\
    \ things, such as eating, singing, writing, etc. Some functions realized by this\
    \ object can be called methods of this object. Similarly, this object has some\
    \ static features, such as hair, arms, body, etc. You can call the static features\
    \ of this object the attributes of this object. Thus, the method is dynamic and\
    \ the attribute is static.\n\nIf Tony is regarded as an object A and Christopher\
    \ as object b, Tony and Christopher can communicate and pass on some information.\
    \ In the object-oriented thinking method, messages can also be transmitted and\
    \ communicated between objects, so that each object can form a powerful and complex\
    \ network, thus realizing some complex architectures and functions.\n\nAccording\
    \ to the commonness of various objects in nature, objects can be abstracted into\
    \ classes, and any object must belong to a certain class. Objects are concrete\
    \ and classes are abstract. For example, there are now the following objects:\n\
    \n- Object A: Tony is a person.\n- Object B: Tony\n- Object C: A specific orange\n\
    - Object d: A specific apple\n\nAccording to the commonness between object a and\
    \ object b, object a and object b can be abstracted as human, which is called\
    \ human for short. According to the commonness between object c and object d,\
    \ object c and object d can be abstracted as fruit class. Thus, objects A, B,\
    \ C and D all have their own classes. Of course, the commonness among object A,\
    \ object B, object C, and object D can also be extracted and abstracted into a\
    \ class of biology.\n\nIn object-oriented programming, we can divide a complex\
    \ software into various required classes according to requirements, and then write\
    \ various methods and attributes. When it is used specifically, it can be instantiated\
    \ into specific objects directly according to the class, and then relevant functions\
    \ can be implemented. The process of instantiation is the process of transforming\
    \ abstract things into concrete things. After instantiation, the software's relatively\
    \ complex architecture and functions can be implemented using related objects.\
    \ It can be seen that programming through object-oriented thinking can make the\
    \ development of programs closer to the real world and realize complex functions\
    \ and architectures more convenient.\n\n## Advanced Concepts\n\nThrough the above\
    \ introduction, I believe everyone has a simple understanding of the basic idea\
    \ of object-oriented, and this section will specifically introduce how to apply\
    \ the object-oriented method to program design. For example, to realize a large\
    \ project, you can divide the project into different components, treat each different\
    \ component as each class, then program these components separately, and finally\
    \ assemble each component into a large project. This approach can control the\
    \ project as a whole and make the development of the project more efficient.\n\
    \nObject-oriented programming is different from process-oriented programming.\
    \ Process-oriented programming is to write programs according to the specific\
    \ process of this project. This method is suitable for writing small and medium-sized\
    \ programs, while for larger projects, it can be handled with object-oriented\
    \ thinking. If large projects are also developed according to the process-oriented\
    \ programming idea, the efficiency will be lower and the object-oriented programming\
    \ idea will be used for development. It is only necessary to divide the project\
    \ into various classes (i.e. abstract forms of various parts of large projects),\
    \ then develop various classes, and then combine various classes. When you need\
    \ to use it, you can directly create specific objects according to classes, and\
    \ then implement corresponding specific functions through each object.\n\nClass\
    \ is a relatively important concept in object-oriented, and object is also a relatively\
    \ important concept in object-oriented. The concepts of class and object are usually\
    \ mentioned together, and this section will show you how to use Python to implement\
    \ classes and objects.\n\n## How to create classes?\n\nClasses are abstractions\
    \ of commonness between certain objects. In popular terms, a class is a synthesis\
    \ of many identical things. For example, a good song, a piece of calligraphy and\
    \ a good-looking novel are all the objects. You can think about the commonness\
    \ of these things and what can be used to summarize them? They can be summarized\
    \ by a class called \"literature and art\". Literature and art do not represent\
    \ any specific thing, it is an abstract concept. In a word: class is the abstraction\
    \ of an object, and the object is the concrete expression of class, which is also\
    \ called the instance of the class. For example, as we have just introduced, the\
    \ objects of a beautiful song, calligraphy, and a beautiful novel can abstract\
    \ the category of literature and art. When we say literature and art, it must\
    \ be abstract, so the category is abstract of the object.\n\n## Use of Classes\
    \ in Python\n\nIn Python, if you want to implement object-oriented programming,\
    \ you first need to divide the corresponding classes and then write the specific\
    \ code to implement the classes. If you want to create a class in Python, you\
    \ can do this in the following format:\n\n```\nClass Name ():\n    { Enter the\
    \ implementation procedure here }\n```\n\nFor example, if you want to create a\
    \ human class, you can do this by following the code:\n\n```\nclass man:\n   \
    \ pass\n```\n\nHere, the `pass` statement has no practical significance but is\
    \ called a placeholder statement to ensure the integrity of the program. After\
    \ running the above program, we can make the following input:\n\n```\n>>> print(man)\n\
    ```\n\nAs you can see, the current corresponding output result is \"class ……\"\
    , indicating that man is a class at this time.\n\n## Application Examples of Objects\n\
    \nGenerally speaking, classes cannot be directly used to implement related functions\
    \ and operations, because classes are abstract. At this time, the corresponding\
    \ class will generally be instantiated into the corresponding object, and then\
    \ relevant functions and operations will be implemented through the corresponding\
    \ object. In Python, the format for instantiating a class as an object is as follows:\n\
    \n```\nObject {Enter the name here} = Class Name (You can enter your parameters\
    \ here)\n```\n\nAs you can see, if you want to instantiate the class, you just\
    \ need to add parentheses after the class name. For example, the class `man` defined\
    \ above can be instantiated as a vehicle's object by the following code:\n\n```\n\
    class man:\n    pass\nvehicle = man()\n```\n\nAs you can see, when instantiating,\
    \ you only need to follow the corresponding format described above. Run the above\
    \ program, and then make the following debugging input:\n\n```\n>>> print(vehicle)\n\
    # This is an object\n# \"A36FA90\"\n```\n\nIt can be found that when vehicle is\
    \ output, the result is \"…object…\", where object means vehicle is initiated,\
    \ while \"A36FA90\" in the above output result is the specific storage space of\
    \ vehicle. It is worth noting that there may be multiple objects under the same\
    \ class, that is, multiple different objects can be instantiated based on one\
    \ class. Several different objects may have some common features and functions,\
    \ but they represent different individuals. For example, under the human class,\
    \ not only the object vehicle can be instantiated, but also car and bus can be\
    \ instantiated. Although vehicle, car, and bus have some common features or methods,\
    \ such as having the function of eating and having the characteristics of hair,\
    \ body, etc. (because they are instantiated based on the same class), these objects\
    \ represent different individuals and are different. Modifying the object vehicle\
    \ will not affect other objects such as car and bus.\n\nWe might as well follow\
    \ the program running above and enter the following code for demonstration:\n\n\
    ```\n>>> vehicle = man()\n>>> car = man()\n>>> print(car)\n>>> print(vehicle)\n\
    ```\n\nTherefore, the two objects belong to different individuals, and communication\
    \ between the two objects is possible, but there is no inevitable influence. With\
    \ this, we have completed a brief introduction to classes in Python. In the next\
    \ chapter, we will in detail discuss about loops. Follow along!\n"
  trans: "\n\n# 第 13 章：如何在 Python 中创建类？\n\n面向对象编程是 Python 编程语言的一项基本特性。即使 Python 中存在函数式编程范式，许多开发人员仍倾向于使用面向对象机制来开发程序。有很多原因促使开发人员选择面向对象编程而非函数式编程。在处理算法时，机器学习专家应当非常了解对象和类的创建。本章将全面介绍面向对象编程的基础知识。让我们开始吧！\n\
    \n## 它与过程式编程有何不同？\n\n过程式编程是一种范式，它使用称为函数的可复用代码段来解决问题。向已创建的代码中插入新的逻辑或数据通常很困难。在机器学习环境中，自动重新排列代码段以获得最佳结果往往很重要。这就是为什么机器学习爱好者应当实现相关资源，以便在需要时能够扩展为面向对象模型。\n\
    \n## 面向对象是如何工作的？\n\n面向对象编程采用了一种不同的理念，将志同道合的对象分离到不同的类别中。利用这些类别，你可以单独更改所需的功能。除了更容易维护代码外，它们还可用于保持函数的统一性。我们现在将从数据科学家的角度详细讨论类和对象。\n\
    \n## 什么是类和对象？\n\n从程序员的角度来看，类是为了方便处理对象而开发的**蓝图**。在一个类中，我们通常会将志同道合的变量、方法和构造函数分组，以便于操作它们。在处理小型项目时，过程式编程技术是可行的。然而，随着项目规模的扩大，我们需要编写大量从不同角度做同一件事的代码。为了解决这个问题，开发出了类和对象，通过它们我们可以轻松继承父类并在项目中使用它们。\n\
    \n## 类由什么组成？\n\n类由能够执行特定任务的方法组成。类中有全局变量和局部变量，可根据情况使用。程序员可以将所有这些方法和变量作为对象实例来使用。\n\
    \n## 如何定义类？\n\n在 Python 中，与 Java 不同，你需要使用 Python 文件来存储类。在 Java 编程语言中，程序员通常将单独的类文件保存为\
    \ `.class` 扩展名。然而，Python 通过使用相同的 `.py` 格式使事情变得简单。在下一节中，我们将使用一个示例来帮助你理解在 Python\
    \ 中创建类的过程。要掌握面向对象编程，我们首先需要了解面向对象编程的基本理论和概念。本节将详细介绍面向对象编程的基本理论和概念。\n\n## 现实生活中的面向对象场景\n\
    \n在我们生活的世界中，任何具体的事物都可以被视为一个对象，每个对象都能处理某些事情或拥有某些静态特征。例如，每个具体的人都可以被视为一个对象。这个对象可以处理一些事情，如吃、唱、写等。该对象实现的某些功能可以称为该对象的**方法**。同样，这个对象也有一些静态特征，如头发、手臂、身体等。你可以将该对象的静态特征称为该对象的**属性**。因此，方法是动态的，属性是静态的。\n\
    \n如果将 Tony 视为对象 A，Christopher 视为对象 B，Tony 和 Christopher 可以进行通信并传递一些信息。在面向对象的思维方法中，对象之间也可以传递和通信消息，从而使每个对象形成一个强大而复杂的网络，进而实现某些复杂的架构和功能。\n\
    \n根据自然界中各种对象的共性，可以将对象抽象为类，任何对象都必须属于某个类。对象是具体的，类是抽象的。例如，现在有以下对象：\n\n- 对象 A：Tony\
    \ 是一个人。\n- 对象 B：Tony\n- 对象 C：一个具体的橙子\n- 对象 D：一个具体的苹果\n\n根据对象 A 和对象 B 之间的共性，可以将对象\
    \ A 和对象 B 抽象为人类，简称 human。根据对象 C 和对象 D 之间的共性，可以将对象 C 和对象 D 抽象为水果类。因此，对象 A、B、C、D\
    \ 都有各自的类。当然，对象 A、对象 B、对象 C 和对象 D 之间的共性也可以被提取并抽象为生物类。\n\n在面向对象编程中，我们可以根据需求将复杂的软件划分为各种所需的类，然后编写各种方法和属性。在具体使用时，可以直接根据类实例化为具体的对象，然后实现相关功能。实例化的过程是将抽象事物转化为具体事物的过程。实例化后，可以使用相关对象实现软件相对复杂的架构和功能。可见，通过面向对象思维进行编程可以使程序开发更贴近现实世界，更方便地实现复杂的功能和架构。\n\
    \n## 进阶概念\n\n通过以上介绍，相信大家对面向对象的基本思想有了简单的了解，本节将具体介绍如何将面向对象方法应用于程序设计。例如，要实现一个大型项目，可以将项目划分为不同的组件，将每个不同的组件视为每个类，然后分别对这些组件进行编程，最后将各个组件组装成一个大型项目。这种方法可以整体控制项目，使项目开发更加高效。\n\
    \n面向对象编程不同于面向过程编程。面向过程编程是根据该项目的具体过程编写程序。这种方法适合编写中小型程序，而对于较大的项目，可以用面向对象的思维来处理。如果大型项目也按照面向过程编程的思想进行开发，效率会较低，而采用面向对象编程思想进行开发，只需将项目划分为各种类（即大型项目各部分的抽象形式），然后开发各种类，再将各种类组合起来。当需要使用时，可以直接根据类创建具体对象，然后通过各个对象实现相应的具体功能。\n\
    \n类是面向对象中一个比较重要的概念，对象也是面向对象中一个比较重要的概念。类和对象的概念通常一起提及，本节将向你展示如何使用 Python 实现类和对象。\n\
    \n## 如何创建类？\n\n类是某些对象之间共性的抽象。通俗地说，类是许多相同事物的综合。例如，一首好歌、一幅书法和一本好看的小说都是对象。你可以思考这些事物的共性是什么，用什么来概括它们？它们可以用一个称为“文学艺术”的类来概括。文学艺术不代表任何具体的事物，它是一个抽象概念。简而言之：类是对象的抽象，对象是类的具体表现，也称为类的**实例**。例如，正如我们刚才介绍的，一首优美的歌曲、书法、一本优美的小说这些对象可以抽象出文学艺术这一类别。当我们说文学艺术时，它必须是抽象的，所以类别是对象的抽象。\n\
    \n## Python 中类的使用\n\n在 Python 中，如果你想实现面向对象编程，首先需要划分相应的类，然后编写具体的代码来实现这些类。如果你想在\
    \ Python 中创建一个类，可以使用以下格式：\n\n```\nClass Name ():\n    { Enter the implementation\
    \ procedure here }\n```\n\n例如，如果你想创建一个 human 类，可以按照以下代码进行：\n\n```\nclass man:\n\
    \    pass\n```\n\n这里，`pass` 语句没有实际意义，但被称为**占位符语句**，用于确保程序的完整性。运行上述程序后，我们可以进行如下输入：\n\
    \n```\n>>> print(man)\n```\n\n正如你所见，当前对应的输出结果是 \"class ……\"，表明此时 man 是一个类。\n\n\
    ## 对象的应用示例\n\n一般来说，类不能直接用于实现相关功能和操作，因为类是抽象的。此时，通常会将相应的类实例化为相应的对象，然后通过相应的对象实现相关功能和操作。在\
    \ Python 中，将类实例化为对象的格式如下：\n\n```\nObject {Enter the name here} = Class Name (You\
    \ can enter your parameters here)\n```\n\n正如你所见，如果你想实例化类，只需在类名后加上括号即可。例如，上面定义的类\
    \ `man` 可以通过以下代码实例化为 vehicle 对象：\n\n```\nclass man:\n    pass\nvehicle = man()\n\
    ```\n\n正如你所见，实例化时只需遵循上述描述的相应格式。运行上述程序，然后进行如下调试输入：\n\n```\n>>> print(vehicle)\n\
    # This is an object\n# \"A36FA90\"\n```\n\n可以发现，输出 vehicle 时，结果是 \"…object…\"\
    ，其中 object 表示 vehicle 已被初始化，而上述输出结果中的 \"A36FA90\" 是 vehicle 的具体存储空间。值得注意的是，同一个类下可能有多个对象，即可以基于一个类实例化多个不同的对象。几个不同的对象可能具有一些共同的特征和功能，但它们代表不同的个体。例如，在\
    \ human 类下，不仅可以实例化 vehicle 对象，还可以实例化 car 和 bus。虽然 vehicle、car 和 bus 具有一些共同的特征或方法，例如具有进食功能、具有头发、身体等特征（因为它们是基于同一个类实例化的），但这些对象代表不同的个体且是不同的。修改\
    \ vehicle 对象不会影响 car 和 bus 等其他对象。\n\n我们不妨跟随上述程序运行并输入以下代码进行演示：\n\n```\n>>> vehicle\
    \ = man()\n>>> car = man()\n>>> print(car)\n>>> print(vehicle)\n```\n\n因此，这两个对象属于不同的个体，两个对象之间可以通信，但没有必然的影响。至此，我们完成了\
    \ Python 中类的简要介绍。在下一章中，我们将详细讨论循环。请继续关注！\n\n"
