- raw: 'Chapter 4: Python Data types Python and other programming languages use data
    types to store values logically in memory. Distinguishing data with values can
    help operations perform faster. We will also discuss other important programming
    concepts such as identifiers and reserved keywords in this chapter. Follow along!
    Let''s start with a detailed discussion of data types. The operations supported
    by an object and its description are determined by the data type. Therefore, learning
    about datatypes is very important for programmers. The Python language provides
    several built-in data types with rich functions. Before explaining each data type
    and its supported operations, the type of the object is usually checked. Python
    provides a specific built-in function type () to perform these operations. It
    returns a special type called a type object, which can be divided into other types.
    Type detection function \[ type ()\] Use the type () function to quickly check
    the type of a variable or to determine the type of operation they can perform.
    For example: type(example) // Where example =8 We will get the output as int by
    the type () function. The Type () function is very simple. It can quickly help
    us detect the actual type of an object, whether by the name or value of a variable.
    Empty object (None) Another special type in Python is called an empty object.
    It is just empty and can hold null values. Simple numeric types Integer Integer
    type (int) is simply an integer, which is used to represent an integer, for example,
    100, 2016, etc. Integer literals are represented in four ways: decimal, binary
    (beginning with "0B" or "0b"), octal (beginning with the number "0") and hexadecimal
    (beginning with "0X" or "0x"). Python''s integer can represent a limited range,
    which is consistent with the system''s maximum integer. For example, the integer
    on a 32-bit computer is 32 bits, and the range of numbers that can be represented
    is 231 ~ 2311. Integers on 64-bit computers are 64-bit, and the range of numbers
    that can be represented is 263 ~ 2631. Next, look at some examples of integer
    code, as follows: first=231283 type(first) <type ''int''> first 231283 In the
    above code, the value of the variable first in line1 code is a binary integer,
    which belongs to int type. This has been verified in the next lines. Lines 4 to
    5 directly output the value of first, and the result is 231283. Decimal numbers
    can be converted to binary, octal or hexadecimal using the specified function.
    The sample code is as follows: bin (20) # converts decimal 20 to binary ''0b10100''
    oct (20) # converts decimal 20 to octal ''o024'' hex (20) # convert decimal 20
    to hexadecimal ''0x14'' Long Integer Long is a superset of integers, which can
    represent an infinite integer (actually only limited by the computer''s virtual
    memory size). Long integer literal values are followed by the letters "l" or "l"
    (uppercase "l" is recommended). Long and integer operations are the same. The
    sample code is as follows: first=13798433\*3749803498 <type ''long''> In the long
    run, integer and long integer are gradually unified into an integer type. Starting
    from Python 2.3, integer overflow errors will no longer be reported, and the results
    will be automatically converted to long integers. Now the two types of integers
    can be said to be seamlessly combined, and the long integer suffix "L" becomes
    optional. Floating point type Float is used to represent real numbers. For example,
    3.14, 9.19, etc. are all floating-point types. Floating-point literals can be
    expressed in decimal or scientific notation. The scientific notation in Python
    is expressed as follows: < real number > e or e < integer > Wherein, e or e represents
    a base of 10, the following integer represents an index, and the positive and
    negative of the index are expressed by+or, where+can be omitted. For example,
    1.34E3 means 1.34x103 and 1.5E−3 means 1.5x10-3. The sample code is as follows:
    \> > 1.2e5 # floating-point number is 1.2×105 One hundred and twenty thousand
    Boolean type The boolean type can be regarded as a special integer. Boolean data
    has only two values: True and False, corresponding to 1 and 0 of integer respectively.
    Every Python object is inherently boolean (True or False), which can then be used
    in boolean tests (such as if, while). User-defined class instances that return
    0 or False if methods nonzero () or len () are defined. Boolean values of all
    objects except the above objects are True. This section involves a lot of knowledge
    explained later. All you need to know here is that Boolean values can only be
    True and False. plural The complex number type is used to represent the complex
    number in mathematics. For example, 5+3j and −3.4−6.8j are all complex number
    types. The plural type in Python is a data type that is not available in general
    computer languages. It has the following two characteristics: (1) Complex numbers
    consist of real numbers and imaginary numbers, which are expressed as real+imagj
    or real+imagJ. (2) The real part and imaginary part imag of complex numbers are
    both floating-point types. It should be noted that a complex number must have
    real numbers and j representing imaginary parts, e.g. 1j and 1j are complex numbers,
    and 0.0 is not a complex number, and the real part representing imaginary parts
    cannot be omitted even if it is 1. Example codes for complex numbers are as follows:
    sample = 6+2j sample (6+2j) sample.real # real part One type(sample.real) <class
    ''float''> sample.imag # imaginary part Two type(sample.imag) <class ''float''>
    Identifiers and keywords identifier In real life, people often use some names
    to mark things. For example, each fruit has a name to mark. Similarly, if you
    want to express something in a program, you need developers to customize some
    symbols and names, which are called identifiers. For example, variable names,
    function names, etc. are identifiers. The identifier in Python consists of letters,
    numbers and underscore "\_", and its naming method needs to follow certain rules,
    as follows. (1) Identifiers consist of letters, underscores, and numbers, and
    cannot begin with numbers. The sample code is as follows: FromNo12 # legal identifier
    From#12 # is an illegal identifier. Identifiers cannot contain # symbols. 2ndObj
    # is an illegal identifier. Identifiers cannot start with a number. (2) Identifiers
    in Python are case sensitive. For example, andy and Andy are different identifiers.
    (3) Identifiers in Python cannot use keywords. For example, if cannot be used
    as an identifier. Also, to standardize the naming of identifiers, the following
    suggestions are made on the naming of identifiers. (1) Knowing the meaning by
    name: give a meaningful name and try your best to know what the identifier means
    at a glance, thus improving the readability of the code. For example, the definition
    name is represented by name, and the definition student is represented by student.
    (2) When naming variables, many computer languages suggest hump naming. However,
    hump naming is not recommended in Python. keywords In Python, identifiers with
    special functions are called keywords. The keyword is already used by Python itself,
    and developers are not allowed to define identifiers with the same name as the
    keyword. The keywords in Python each represent a different meaning. If you want
    to view the keyword information, you can enter the help () command to enter the
    help system to view. The sample code is as follows: \> > > help () # enter the
    help system Help> keywords # view all keyword lists Help> return # view the description
    of the keyword return Help > quit # to exit the help system With this we have
    completed a brief explanation to data types and in the next chapter we will explain
    about variables in detail. Follow along! '
