    \ remotely. When the local program detects the title \"shutdown\", it automatically\
    \ calls the `send()` function to send a reset mail, i.e. the mail titled \"test\"\
    \ and then controls the computer to perform the shutdown operation.\n\nSo far,\
    \ this project has been successfully written and its functions have been realized.\n\
    \n## Project Implementation and Summary\n\nSo far, this project has been fully\
    \ realized. In the process of writing this small project, everyone knew the basic\
