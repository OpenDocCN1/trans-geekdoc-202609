    # Python 编程：Python 机器学习、数据科学与工具的完整初学者指南


    ## 简介


    Python 是一门常被推荐给初学者的编程语言，让他们尝试“搞砸事情”并爱上编程。Python 广受欢迎的主要原因之一在于其简洁性，以及用更少的代码实现功能的强大能力。即使在过去十年里出现了数十种编程语言，Python
    依然魅力不减，我们非常有信心它将长盛不衰。本书以通俗易懂、简明扼要的方式，为大众提供了 Python 编程概念的经典入门介绍。所有概念均附带示例程序，以便读者领会主题的精髓。


    ![工作, 打字, 电脑, 笔记本, 编程](img/rsrc3CB.jpg)


    ## 什么是 Python？


    Python 是一门相当著名的编程语言，拥有非常慷慨的社区，定期为计算机科学的各个分支（如数据挖掘、机器学习和深度学习）产出高质量项目。它是一门古老的编程语言，却依然能完美解决现代问题。本书并非参考手册，而是一本以轻松方式引领你入门
    Python 的智能指南。我们尝试用通俗易懂的语言解释所有概念，以便读者能将编程概念内化于心，并用它们创造出一些非常有创新性的项目。


    ## 如何充分利用本书？


    只有当你能亲自实践运用编程概念时，才能真正理解它们。基于这一确切原因，我们在本书中捆绑了大量编程代码示例，旨在引导你自主编写代码。已有经验的程序员也可以将本书作为
    Python 的优秀参考资料。市面上有很多涵盖 Python 的书籍，但你选择了我们带你沉浸式体验 Python 编程的世界。我们确信，阅读本书将让你获得良好的学习体验。让我们开始吧！

    '
