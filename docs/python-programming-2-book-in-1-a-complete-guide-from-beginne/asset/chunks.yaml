    \ of strings, the list index starts from 0. We can access the values in the list\
    \ by subscript index.\n\n### Example: Accessing List Elements Using Indexes\n\n\
    ```\nA = ['Tom', 'Sam', 'Ram']\nprint(A[0])\nprint(A[1])\nprint(A[2])\n```\n\n\
