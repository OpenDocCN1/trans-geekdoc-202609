    \n## d) Datatypes\n\nDatatypes are used to categorize variables that are created.\
    \ It is important to assign a specified memory location whenever a variable is\
    \ created. However, it is not feasible to create a constant size of memory location\
    \ every time. So while creating a variable it is important to specify a data type.\
    \ There are a lot of default data types such as integer, float, double and character.\
    \ Here is an example:\n\n```\nint a=4788 // Here int is the data type\n```\n\n\
    ## e) Conditional statements\n\nProgramming is composed of logical statements.\
    \ When dealing with complex code we need to use control flow statements to get\
    \ desired results. Python offers a lot of control flow statements such as conditionals\
    \ and loops. Conditional is a control flow statement where we have an option to\
    \ choose by a logical evaluation. `if-else` is an easy way to represent a conditional\
    \ statement. Here is an example:\n\n```\nif(a>3) {\n    #print the statement\n\
    } else {\n    #pront another statement\n}\n```\n\n## f) Operators\n\nOperators\
    \ are used to combine the statements to form expressions. In the previous chapter,\
    \ we have in detail discussed the operator module. Always make sure you are aware\
    \ of operator precedence before debugging the code.\n\n## g) Strings\n\nStrings\
    \ are one of the most important data types in python. Usually, we deal with a\
    \ lot of string literals in common. Datasets are often combined in strong notions\
    \ and can be manipulated using some of the string functions that are provided\
    \ to python by default. Here is an example:\n\n```\na = \"This is a strong\"\n\
    a.tolowercase()\n```\n\nUsing this system function, you can convert string literals\
    \ into lower case. You can check the documentation to find out different available\
    \ string functions.\n\n## h) Exceptions\n\nPython also provides advanced exception\
    \ handling mechanism to deal with errors. Programs usually encounter errors while\
    \ they are running. It is important to show the errors to the end-user to help\
    \ them understand the mistake they are doing. To make this happen we use `try`,\
    \ `catch` blocks to enter the exceptions and their error output.\n\n## i) Lists\n\
    \nPython handles multiple data using the available structures. There are different\
    \ data structures such as lists, tuples, and dictionaries to handle multi-dimensional\
    \ data. It is important to master these if you are trying to develop machine learning\
    \ applications.\n\nWith this, we have explained some of the basic programmatically\
    \ concepts that are necessary to start coding in Python. In the next section,\
    \ we will in detail discuss coding using an IDE.\n\n## How to start coding in\
    \ Python?\n\nIn the previous chapter, we have explained about using a text editor\
    \ to create python programs. However, python programs can be written using an\
    \ Integrated development environment. In this section, we use PyCharm to explain\
    \ about starting to code with Python.\n\n### Step 1: Open the software and click\
    \ on the \"create new\" button to open a new python file.\n\nYou can even create\
    \ new classes and interfaces for easy maintenance of the python project.\n\n###\
    \ Step 2: After creating a new python file, you can start writing code.\n\nIn\
    \ the IDE you can easily insert conditionals and loops using different pre-installed\
    \ functions. You can also create templates and packages on a one click.\n\n###\
    \ Step 3: After creating a program, it is now time to start compiling in the IDE.\n\
    \nYou can just click on the Run button to start the Python interpreter to look\
    \ at your code. If any errors are present, they will be displayed.\n\n### Step\
    \ 4: You can interlink these individual codes to start creating packages.\n\n\
    You can use inheritance to use methods that have been used by python classes.\n\
    \n### Step 5: Click the save button to save all the code information that has\
    \ been created.\n\n## What should you remember?\n\nAlways, make sure that you\
    \ are following the Python programming conditions. Python doesn’t support case\
    \ sensitive statements and there is no use of indentation spaces. Python is also\
    \ easy to maintain and organize. However, we recommend you maintain a good coding\
    \ structure to help you look back at your code without any confusion.\n\nWith\
    \ this, we have completed a brief introduction to starting code with Python. There\
    \ are a lot of resources to further enhance your skills. You can look at our book\
    \ in this previous module to increase your Python programming knowledge. In the\
    \ next chapter, we will start discussing a sample project. Let us go!\n"
  trans: "\n# 第 9 章：如何用 Python 编程？\n\n本章将简单介绍基本的 Python 语法结构，帮助你进行 Python 编程。Python\
    \ 是一门动态类型语言，定义逻辑所需的代码块非常少。Python 由不同的程序结构组成，了解它们对于编写完美的代码非常重要。\n\n## a) 注释\n\n\
    注释是在阅读代码时向程序员提供信息的简便方法。它们通常在程序中跟在 `#` 后面。注释在运行时不会被编译。示例如下：\n\n```\n# this is a\
    \ definition\ndef add(enter parameters here)\n```\n\n注释最初是为了从结构上组织代码而开发的。然而，随着时间的推移，注释已成为编程中不可或缺的一部分。\n\
    \n## b) 字面量\n\n字面量在编程中也称为常量。这些是可以通过赋值运算符赋给变量的值。如果需要，所有字面量都可以被替换。字符串也属于字面量，通常可以使用不同的系统函数进行操作。示例如下：\n\
    \n```\na = 355\n```\n\n此处 `355` 是被赋给变量 `a` 的字面量。\n\n## c) 变量\n\n变量用作内存存储，用于存储赋值的字面量并在需要时使用。在处理函数和逻辑语句时，变量非常重要。你可以使用逻辑语句轻松更改已赋值的变量。示例如下：\n\
    \n```\nfirst = 3\n```\n\n此处 `first` 是变量名，`3` 是已赋给该变量的字面量值。请始终记住，变量只能通过赋值语句进行赋值。\n\
    \n## d) 数据类型\n\n数据类型用于对创建的变量进行分类。创建变量时，为其分配指定的内存位置很重要。然而，每次都创建固定大小的内存位置是不可行的。因此，在创建变量时指定数据类型很重要。有许多默认数据类型，如整数、浮点数、双精度浮点数和字符。示例如下：\n\
    \n```\nint a=4788 // Here int is the data type\n```\n\n## e) 条件语句\n\n编程由逻辑语句组成。处理复杂代码时，我们需要使用控制流语句以获得期望的结果。Python\
    \ 提供了许多控制流语句，如条件语句和循环。条件语句是一种控制流语句，我们可以通过逻辑判断来选择执行路径。`if-else` 是表示条件语句的简便方式。示例如下：\n\
    \n```\nif(a>3) {\n    #print the statement\n} else {\n    #pront another statement\n\
    }\n```\n\n## f) 运算符\n\n运算符用于将语句组合成表达式。在上一章中，我们已详细讨论了运算符模块。请务必确保在调试代码前了解运算符优先级。\n\
    \n## g) 字符串\n\n字符串是 Python 中最重要的数据类型之一。通常，我们会处理大量的字符串字面量。数据集通常以字符串形式组合，可以使用 Python\
    \ 默认提供的一些字符串函数进行操作。示例如下：\n\n```\na = \"This is a strong\"\na.tolowercase()\n```\n\
    \n使用此系统函数，你可以将字符串字面量转换为小写。你可以查阅文档以了解其他可用的字符串函数。\n\n## h) 异常\n\nPython 还提供了高级异常处理机制来处理错误。程序在运行时通常会遇到错误。向最终用户显示错误以帮助他们了解所犯的错误非常重要。为了实现这一点，我们使用\
    \ `try`、`catch` 块来捕获异常及其错误输出。\n\n## i) 列表\n\nPython 使用可用的结构处理多个数据。有不同的数据结构，如列表、元组和字典，用于处理多维数据。如果你正在尝试开发机器学习应用程序，掌握这些结构非常重要。\n\
    \n至此，我们已经解释了一些开始进行 Python 编程所必需的基本编程概念。在下一节中，我们将详细讨论使用 IDE 进行编码。\n\n## 如何开始用 Python\
    \ 编程？\n\n在上一章中，我们解释了使用文本编辑器创建 Python 程序。然而，Python 程序也可以使用集成开发环境 (IDE) 编写。在本节中，我们将使用\
    \ PyCharm 来解释如何开始用 Python 编程。\n\n### 步骤 1：打开软件并点击“创建新建”按钮以打开一个新的 Python 文件。\n\n\
    你甚至可以创建新的类和接口，以便于 Python 项目的维护。\n\n### 步骤 2：创建新的 Python 文件后，你可以开始编写代码。\n\n在 IDE\
    \ 中，你可以使用不同的预装函数轻松插入条件语句和循环。你也可以一键创建模板和包。\n\n### 步骤 3：创建程序后，现在是时候在 IDE 中开始编译了。\n\
    \n你只需点击运行按钮，即可启动 Python 解释器来执行你的代码。如果存在任何错误，它们将被显示出来。\n\n### 步骤 4：你可以关联这些单独的代码以开始创建包。\n\
    \n你可以使用继承来使用 Python 类中已使用的方法。\n\n### 步骤 5：点击保存按钮以保存所有已创建的代码信息。\n\n## 你应该记住什么？\n\
    \n请始终确保你遵循 Python 编程规范。Python 不支持大小写敏感语句，且不使用缩进空格。Python 也易于维护和组织。然而，我们建议你保持良好的编码结构，以便你回顾代码时不会感到困惑。\n\
    \n至此，我们完成了关于开始用 Python 编程的简要介绍。还有许多资源可以进一步提升你的技能。你可以查看本模块前面的书籍以增加你的 Python 编程知识。在下一章中，我们将开始讨论一个示例项目。让我们开始吧！\n"
