    # Chapter 1: What is Python? Why Python?


    Python is a programming language that has been declared as one of the easiest
    programming languages to learn for beginners. Apart from its simple syntax and
    intuitive functionalities, the availability of abundant resources is also a reason
    for Python''s success among the masses. Python is the most popular language in
    GitHub and comprises thousands of open source projects and third-party libraries
    that can help you create complex software. Python is also a recommended language
    to learn for enthusiastic data scientists. Machine learning, a famous computer
    science branch relies on Python libraries to analyze the data. In this book, we
    will look at Python functionalities from a machine learning perspective. In the
    next section, we will discuss Python functionalities with good, valid technical
    information.


    ## Why Python is famous?


    There are over 100 programming languages available for computer programmers and
    computer scientists nowadays. Out of all, Python has occupied a prominent position
    because of its active community which is always trying to clear off the bugs and
    update with new features. A study proposed why Python is famous among programmers.
    We will in this section discuss some of those reasons that made Python a programmer''s
    favorite. Here are the valid reasons:


    ### 1) Quality

    When you create programs with Python, they are often of high quality. The users
    encounter fewer bugs and it is easy to update the programs using different Python
    modules. Python supports various programming paradigms such as procedural and
    object-oriented programming to reuse the code effectively. It is also easily readable
    because of indentation techniques. This high quality in the programming syntax
    had made programmers fell in love with it.


    ### 2) Productivity

    Other programming languages such as Java and C are statistically typed languages
    and require a huge amount of code to even process very fewer data. Python simplifies
    the code to be written and requires only half of the programming code when compared
    to the other languages. This increases productivity and can adversely increase
    the quality of applications that are being developed.


    ### 3) Portability

    Unlike Java, which runs its applications only when a JVM is present Python can
    run software applications on any platform. All you need to do is to add a few
    lines of code that will process the software to run on other platforms. Python
    applications can also be deployed to run in web and database environments with
    a slight change in code. All these portable advantages make developers use Python
    as a primary language when developing cross-platform applications.


    ### 4) Third-party Libraries

    Python has a lot of default functions in the standard library. There are mathematical
    and statistical functions that can be used in developing data science applications.
    However, standard library functions are often not sufficient to develop complex
    software. Here comes the concept of third-party libraries which can be easily
    imported to a Python project. With the help of third-party libraries, you can
    develop complex and advanced software using Python.


    ### 5) Enjoyment

    As simple and intuitive it is, Python’s success also depends on its level of enjoyment
    to the developers. It is easy to maintain and comprises fewer hiccups than the
    other programming languages. Python has various modules that can automate tasks.
    All these advantages bind up to make Python an entertaining programming language
    for the developers.


    Because of the above technical reasons, Python has become famous among the programming
    community and has expanded its user base. In the next section, we will describe
    some Python applications in day-to-day life.


    ## Applications of Python


    Python is used by approximately 1.5 million developers according to the statistics.
    A lot of websites, APIs, software are developed using Python as a primary language.
    This success of Python is also because of its open-source nature that lets programmers
    use the language as they like. This is the reason why Python is also used as a
    scripting language by many hackers. However, it is not evident to call Python
    as a scripting language on this remark. We consider Python as a multi-use language
    that can be useful for many fields and users.


    Here are some multi-national companies that use Python for their products:


    *   **Google** extensively uses Python to build and update its search engine crawlers.

    *   **YouTube** was initially written on Python. A lot of YouTube integration
    services still use Python.

    *   **Netflix** recommendation algorithms use Python to resource them effectively.

    *   **Dropbox**, a famous storage service uses Python to encrypt the files.


    Apart from these few examples, Python is also used in **iRobot** to develop Robots.


    Here are some technical fields where Python is extensively used:


    ### a) Systems programming

    This is a branch of computer science where we can develop system management tools
    such as compilers, interpreters and shell tools that can interact with the system
    at the kernel level. Python is very adaptable to this branch of computer science
    as it has several extensible libraries that can help to create effective programs.


    ### b) Internet

    Python is an easy language to create small internet scripts. A lot of script kiddies
    use programs developed using Python to crack account passwords. A lot of brute
    forcing tools also use Python to automate dictionary attacks on an authenticated
    server. Python is also famous for developing web applications that can store sensitive
    information. A lot of WebCrawler and web analysis services use Python to curate
    the information.


    ### c) Integration systems

    A lot of hardware components such as **Arduino** works effectively only when they
    are programmed to do. Usually, embedded systems work well with traditional structural
    languages such as C and C++. Python has a lot of libraries that can help to integrate
    already written python code to embedded systems.


    ### d) Database programming

    Databases are an essential entity to store and manipulate information. There are
    a lot of database query languages to store and query data. However, Python is
    used by many database administrators to constantly monitor the intrusion detection
    system that is available. There are a lot of Python libraries that can help developers
    to automatically check for viruses and store a backup in the remote server.


    ### e) Machine Learning

    Machine learning is a booming computer science field where we can analyze the
    information and data that is present. Python has a lot of libraries such as **SciPy**
    and **Pandas** to maintain the data in a significant way. This book will list
    out various Python features to become good at machine learning.


    Apart from these fields, Python is also used by hackers, malware reverse engineers,
    and Computer scientists to do various analytic experiments. In the next section,
    we will discuss the advantage of Python over various other languages that are
    available. Let us go!


    ## What are Python’s strengths?


    Python is suggested for beginners by experienced programmers because it helps
    you to understand all the basics that every programming language use. Python is
    usually a combined mixup of all the programming paradigms that are used. We will
    give you a clear understanding of this below.


    ### a) Supports both functional and object-oriented

    Python, unlike Java and C++, uses functional programming along with the object-oriented
    paradigm. This gives a scope to learn both technologies as a beginner. A lot of
    core concepts such as polymorphism, inheritance, and functions will be covered
    while learning Python.


    ### b) Open-source

    Python is developed by enthusiast contributors from all around the world. It is
    free to create programs and distribute them. This open-source nature gives programmers
    to experiment with the code and create some innovative applications.


    ### c) Powerful

    It is powerful when compared with other popular programming languages. It supports
    dynamic typing and is unnecessary to declare the variable and list sizes before
    compiling the program. Python uses a garbage mechanism and sends all the useless
    system variables to dump. This improves the performance of the program in an exponential
    manner.


    ### d) Default tools

    Python offers a lot of very useful system tools. It can perform a lot of string
    operations easily using these default tools. It is also important to understand
    these modules to perform operations in a better way using Python.


    ### e) Easy to use

    Unlike traditional programming languages such as C and C++ Python is easy to use.
    C and C++ offer different paradigms that can confuse developers to operate. Python
    uses less indentation and it is easy to maintain the code. Python also is better
    than Java because it is not a statically typed language. In java, you need to
    introduce different useless variables to maintain the flow of the program structure.
    However, in Python, you use only what you need. This is one of the reasons Python
    is considered a better language for developing Machine Learning applications.


    ## How to learn Python?


    Python has a generous community that shares a lot of resources and sample projects
    to encourage beginners to understand the importance and beauty of Python. This
    book is also a genuine approach to help you understand all the moderate level
    topics of Python to implement in developing Artificial intelligence and data science
    applications. We suggest you to look at an open-source project and understand
    the essence of the logic by the constant implementation of the topics you have
    learned in this book.


    That’s it. In this chapter, we have got a thorough introduction to the importance
    of Python from various sections. Hope this chapter gave you a sufficient introduction
    to help you get hooked up with the topic. In the next chapter of this book, we
    will discuss different ways to install Python in the system. Let us go!

