    # Chapter 2: How to install python on your PC?


    In the previous chapter, we have discussed the importance of Python along with
    its important features. In this chapter, we will discuss installing Python in
    various operating systems. We will also discuss installing third party modules
    in Python using various package managers. Let us start!


    ## Checking Python Version


    Usually, in Linux and Mac OS operating systems, Python is installed by default.
    However, it is recommended to check the version of Python using the command prompt.
    Windows users need to download the installation package from the Python website.


    ### How to check the Python version?


    Open terminal or command prompt depending on your system to check whether Python
    is installed. Always try to open the terminal using the administrator privileges
    for accurate results. Enter the following formats:


    ```

    python

    python 2

    python 3

    ```


    If Python is installed on the system, you will get a result that displays the
    version of the Python that is installed. It will also provide various options
    that can be very useful for beginners to understand popular commands for managing
    Python programs. However, if there are no traces of the Python installation folder
    in the system then the terminal will return an error. Please check with the above
    commands in your operating system, and if your terminal sends a command error,
    then it is time to install the Python using the below guide. Follow along!


    ## How to install Python in windows?


    **Step 1:** First, it is important to choose the version you are willing to install
    in your system. We recommend you to look at the next chapter to understand about
    different available Python versions. You can also look at Python online documentation
    to choose the suitable python version according to your requirements.


    **Step 2:** After selecting the python version, visit the official website to
    download the Python version. You need to select a 32 or 64-bit option to download
    the version that will be installed with no errors. You can either download a `.msi`
    package or a `.exe` application according to your wish. After downloading the
    installation file, all you need to do is open the file with administrator privileges.


    **Step 3:** After we start the installation, you will get an interface that asks
    to enter the directory to install Python. You can either install Python with the
    default directory or can change the directory according to your requirements.


    > **Note:** Make sure that there are no spaces in the directory names as sometimes
    Python installation will give an error.


    **Step 4:** At the last step of the installation, you need to update the environment
    variable so that Python will run on the command prompt on the system. Once the
    installation is finished you can crosscheck whether the installation is successful
    using the procedure explained before.


    With this, we have learned about installing a basic Python package in the system.
    In the next section, we will discuss various Python modules necessary for developing
    complex Python programs.


    ### What are the other alternatives?


    Python users should remember that there are several replica interpreters of Python
    that can be installed on the windows system. Some are `CPython`, `Pypy` which
    are famous for their customization abilities. However, we recommend you to try
    the original Python versions for advanced usage abilities and faster processing.


    ## How to install Python in Mac OS?


    Mac operating system has a default Python 2.x version already installed on the
    Python operating system. Mac operating system uses Python to control various system
    operations. However, if you are keen on updating your Python version for developing
    programs follow the below section.


    **Step 1:** In the first step, you need to visit the Python official download
    page. The website will automatically determine your system configuration and will
    list you a `.dmg` package installer to download. Thoroughly check the version
    name before you are downloading.


    **Step 2:** After clicking on the `.dmg` package installer you will be asked to
    enter your operating system authentication detail for security reasons. The installer
    will also ask you about the default directory location.


    **Step 3:** In the next step, you need to enter the customization options. You
    can also use the automatic option to let the installer give the best results according
    to your system configuration. After it finishes the installation it is recommended
    to reboot the system and check the Python version using the terminal as mentioned
    in the previous sections.


    ### Are you not interested in the Terminal operation?


    Usually, Python programs are compiled in the command line interpreter or terminal.
    Normally, Programmers need to save a python script using a text editor and compile
    it from the terminal. However, a lot of the developers are not comfortable dealing
    with command-line operations. For programmers who are more inclined towards graphical
    user interfaces, Python provides a GUI package to install on the system. This
    package is known as the `Tkinter` application and can be downloaded from the Python
    official website. After installing can also add add-ons to customize your graphical
    interface.


    ## Installing/Upgrading Python in Linux


    Linux is an operating system that is used by most of the programmers and technical
    enthusiasts to perform tasks and to develop programs. Linux, unlike Windows and
    Mac, relies mostly on command line operations. Usually, python is pre-installed
    in a lot of Linux distros. If you are unaware, you can just check the Python version
    and proceed with the further installation process as given below.


    **Step 1:** You can download the Python `.deb` package from the Python’s official
    website. You can use `sudo` operations to install the package in your system.
    If you are not technically sound enough to install using the `sudo` operation,
    you can also use package managers such as `RPM` to install the python package.


    **Step 2:** After installing the package all you need to do is enter `python`
    on the terminal and look for the obtained results. You can also upgrade Python
    to the newer versions by changing the build script present in the Python installation
    folder. In Linux, you may face conflicts while using two different versions of
    Python in the same system. So, always make sure you have uninstalled the previous
    Python versions from the system.


    ## Using REPL


    `REPL` is the most basic Python component necessary to run arithmetic operations.
    This component is responsible to input the values and output results. It is like
    a lexical analysis tool for Python. You can use `REPL` mode to check whether or
    not python is installed. Here are some operations you can perform to confirm the
    Python installation in the system:


    **a) Do arithmetic operations**


    Run the following commands on your command line:


    ```

    >>> 4747+3737

    >>> 3424*242

    >>> 63634/27

    ```


    If you are getting results with no errors, then Python is successfully installed
    in the system.


    **b) Assigning variables**


    Variables are an entity that can store values and repeat them whenever we need
    it. Here is an example:


    ```

    >>> r = 446

    ```


    Now try to print the assigned variable


    ```

    >>> r

    ```


    If you get 446 as the result then you can confirm that Python is successfully
    installed in your system.


    ## Learning about Help command


    Python provides a `help` command that will inform you about various operations
    that the interpreter can perform. You can also check the online documentation
    to know more about the system functions and libraries. Here is the format:


    ```

    >>> help

    ```


    By using this command, you can print out all the function prompts in order. `Help()`
    function can understand details about different system functions. Every IDE also
    comprises a help folder that can be used to regulate information.


    ## Using pip


    Python is a programming language that uses modules and packages to develop an
    efficient program. A lot of modules need to be downloaded from websites such as
    GitHub into the system. To make this procedure easy, Python has developed a `PyPI`
    index that lists out all the eligible python modules. Learning how to use `pip`
    is an essential skill for programmers. `pip` can be installed using the `Sudo`
    commands. Before trying to install a module using `pip`, we suggest you look at
    the Python module index. After you enter the module name, the `pip search` module
    will start batch searching the module from different resources. If it finds the
    module, then using the downloading module it will install on your preferred directory.
    Here is the command:


    ```

    sudo pip install {enter the package name here}

    ```


    `pip` can be used in all the operating systems available. All you need to have
    is a supported Python version in the system.


    ## Using easy_install


    `easy_install` is another alternative to `pip` to install different modules directly
    into the system. With `easy_install` you can directly change the setup script
    to automatically make changes to the package being downloaded. However, unlike
    `pip`, it is not simple and needs advanced learning capabilities to master it.
    We recommend you to look at `easy_install` documentation to learn more about it.


    ## Other IDE’s to download


    In this chapter, we discussed the default Python interpreter that Python comes
    with. It is often recommended for beginners to make things look simpler instead
    of confusing them with different functionalities. However, if you are interested,
    you can check out different IDE’s that can develop Python programs. We recommend
    `Pycharm` IDE to understand the different complex functionalities of Python. `Pycharm`
    IDE also offers various debugging features to make the development of programs
    easy.


    ## How to run a Python script?


    After installing every necessary component, it is now time to know how to run
    a python script in the command line environment.


    **Step 1:** First, open a text editor of your choice and create a file with extension
    `.py`. In this text file enter the script and save it in your desired folder.


    **Step 2:** Now start the Python interpreter using `python` command in the terminal.
    After entering the Python instance, you need to enter the following command to
    run the program.


    ```

    >>> python filename.py

    ```


    If there are no errors in the program, your file will run according to your requirements.
    However, if there are any runtime errors and warning your program will be halted
    and it will display the results.


    With this, we have completed a brief introduction to installing Python in different
    operating systems. It is important to use this chapter as a reference to install
    different modules that will be introduced in the next chapters in this book. In
    the next chapter, we will discuss different Python versions. As said before, it
    is important to choose the best version according to your needs. Let us go!

    '
