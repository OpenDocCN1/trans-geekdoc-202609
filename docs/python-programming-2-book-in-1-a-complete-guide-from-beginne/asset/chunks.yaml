- raw: 'Chapter 11: Conditional and Loops in Python? In this chapter, we will learn
    in detail about conditional and loop statements. Before discussing these statements,
    we need to learn about judgment the essential concept required to master these
    concepts. What is the judgment? Judgment means that only when certain conditions
    are met one can be allowed to do something, while when the conditions are not
    met, one is not allowed to do it. For example, in real life, crossing the road
    depends on traffic lights. If it is a green light, you can cross the road, otherwise,
    you need to stop and wait. Judgment is used not only in life but also in program
    development. For example, when a user logs in, only if the user name and password
    are all correct, he can be allowed to log in. Python provides many kinds of judgment
    statements. In the next section, we will explain these judgment statements in
    detail. If statement The if statement is the simplest conditional judgment statement.
    It can control the execution process of the program. Its format is as follows:
    If criteria: Things to do when you meet the first condition. Things to do when
    you meet the second condition ... ... Things to be done when conditions are not
    met at all In the above format, the following statement can be executed only if
    the judgment condition is satisfied. ￼To help people better understand the use
    of if statements, next, we will demonstrate the function of if statements through
    two cases, as follows. Example: //if statement -1 age=30 Print ("if judgment starts")
    if age>=22: Print ("This is true") Print ("-if judgment ends") In Example, the
    output of the program is different only if the value of the age variable is different.
    From this, we can see the function of if judgment statement that is: only when
    certain conditions are met the specified code will be executed, otherwise, it
    will not be executed. Note: 1\. Use a colon (:) after each if condition to indicate
    that the following statement is to be executed after the condition is met. 2\.
    Use indents to divide statement blocks. Statements with the same number of indents
    together form a statement block. 3\. There is no switch-case statement in Python.
    if-else statement When using if, it can only do what it wants to do when it meets
    the conditions. If it does not meet the conditions and needs to do something,
    what should it do? to counter this problem We can use if-else statements. If-else
    statements are used in the following format: If condition: Things to do when you
    meet the first condition Things to do when you meet the second condition. ...
    Things to be done when nth conditions are met  else: Things to do when the first
    conditions are not met  Things to do when second conditions are not met  ... Things
    to do when nth conditions are not met To help people better understand the use
    of if-else statements, next, we will demonstrate the function of if-else statements
    through a case. Example if-else statement Ticket = 1 # with 1 for tickets, 0 for
    no tickets if ticket == 1: print ("you can get on the train if you have a ticket")
    print ("I can finally see home") else: print ("No tickets, no boarding") print
    ("Dear, I''ll see you next time") Set the value of the variable ticket to 0 and
    run the program again. You will understand about conditional statements in depth
    if you can practice it by practical coding. If nesting When we take a train or
    subway, we have to buy a ticket first. Only when we buy a ticket, we can enter
    the station for security checks. Only when we pass the security check, we can
    take the bus normally. In the process of taking a train or subway, the latter
    judgment condition is based on the previous judgment. Given this situation, if
    nesting can be used. If nesting refers to the inclusion of an if or if-else statement
    in an if or if-else statement, and its nesting format is as follows: if conditions1:
    {// What to do if condition 1 is met // things that meet condition 1 if conditions2:
    things are done to meet condition 2 } In the above format, we can choose whether
    to use if statement or if-else statement for the if of the outer layer and if
    of the inner layer according to the actual development. Loop Statements In real
    life, there are many cyclic procedures. For example, the alternation of traffic
    lights is a repetitive process. In the program, if you want to repeat some operations,
    you can use circular statements also called loops. Python provides two loop statements,
    the while loop and the for loop. We will now in detail discuss these two statements.
    While loop The basic format of the while loop is as follows: While { Enter the
    logic Output results } If the condition is satisfied, the loop statement is executed.
    When the conditional expression is True, the program executes a loop statement.
    It should be noted that in the while loop, colon and indentation should also be
    noted. Also, there is no do-while loop in Python. If we want the loop to be infinite,
    we can implement an infinite loop by setting the conditional expression to always
    be True. An infinite loop is very useful for real-time requests from clients on
    the server. Next, a case is used to demonstrate the specific code. Example: while
    loop value = 1 While value == 1 : \# expression is always True input = int(give
    ("enter a number:")) print ("The number you entered is:", input") for loop The
    for loop in Python can traverse any sequence of items, such as a list or a string.
    The basic format of the for loop is as follows: For variable in sequence: loop
    statement For example, use the for loop to traverse the list, the example code
    is as follows: for result in \[62,1,32\]: print(result) Output results: 62 1 32
    In the above example, the for loop can display the values in the list one by one.
    Considering that the range of values we use varies frequently, Python provides
    a built-in Range function that can generate a sequence of numbers. The basic format
    of the range function in the for loop is as follows: for result in range(get,set)
    { Enter logic here } Execute loop statement When the program executes the for
    loop, the loop timer variable result is set to start, and then the loop statement
    is executed. The result is sequentially set to all values between start and end.
    The loop statement is executed once for each new value set. In an integer, the
    number divisible by 2 is called an even number. Now, we will develop a program
    to calculate the sum of even numbers between 1 and 100. Example Calculate the
    Sum of Even Numbers from 1 to 100 first=0 Output=0 while i<101: if first%2==0:
    sum Output+=first first+=1 Print ("the sum of even numbers between 1 and 100 is:
    %s" %first") while nesting It just represents a nested while in a while loop.
    The while nesting format is as follows: While condition 1: When condition 1 is
    met, do 1 { while condition 2: When condition 2 is met, do 2 } Relevant explanations
    of the above formats are as follows: (1) When the loop condition 1 is satisfied,
    the things to be done when the condition 1 is satisfied are executed. At this
    time, there may be an opportunity to execute the loop nested inside. (2) When
    the cycle condition 2 is satisfied, perform the things to be done when condition
    2 is satisfied until the while cycle inside is finished. (3) When the cycle condition
    2 is not satisfied, the while cycle outside the loop is finished after the execution
    of the things to be done by the external loop. With this, we have completed a
    brief discussion about conditionals and loops in Python. We will also discuss
    remaining control flow statements in the further chapter. For now, in the next
    chapter, we will in detail discuss object-oriented programming with a lot of examples. '
