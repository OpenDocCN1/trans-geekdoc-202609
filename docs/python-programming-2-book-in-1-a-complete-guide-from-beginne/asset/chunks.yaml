  fmt: "\n# Chapter 9: Functions in Python\n\nThis chapter is a comprehensive guide\
    \ about functions. We will look at various components of functions with examples.\
    \ Let us go!\n\n## What is a Function?\n\nFunctions are organized and reusable\
    \ code segments used to implement single or associated functionalities, which\
    \ can improve the modularity of applications and the reuse rate of codes. Python\
    \ provides many built-in functions, such as `print()`. Also, we can create our\
    \ own functions, that is, custom functions.\n\nNext, look at a code:\n\n```\n\
    // display(\" * \")\n// display(\" *** \")\n// display(\" ***** \")\n```\n\nIf\
    \ you need to output the above graphics in different parts of a program, it is\
    \ not advisable to use the `print()` function to output each time. To improve\
    \ writing efficiency and code reusability, we can organize code blocks with independent\
    \ functions into a small module, which is called a function.\n\n## Defining Functions\n\
    \nWe can define a function to achieve the desired functionality. Python definition\
    \ functions begin with `def`, and the basic format for defining functions is as\
    \ follows:\n\n```\ndef function_name(parameters):\n    \"\"\"docstring\"\"\"\n\
    \    function_body\n    return expression\n```\n\nNote that if the parameter list\
    \ contains more than one parameter, by default, the parameter values and parameter\
    \ names match in the order defined in the function declaration.\n\nNext, define\
    \ a function that can complete printing information, as shown in the example below.\n\
    \n### Example: Functions of Printing Information\n\n```python\n# defines a function\
    \ that can print information\ndef Useforprint():\n    print('------------------------------------')\n\
    \    print('life is short, I use python')\n    print('------------------------------------')\n\
    ```\n\n## Call Function\n\nAfter defining a function, it is equivalent to having\
    \ a piece of code with certain methods. To make these codes executable, you need\
    \ to call it. Calling a function is very simple. You can call it by `function_name()`.\n\
    \nFor example, the code that calls the `Useforprint` function in the above section\
    \ is as follows:\n\n```python\n# After the function is defined, the function will\
    \ not be executed automatically and needs to be called\nUseforprint()\n```\n\n\
    ## Parameters of Function\n\nBefore introducing the parameters of the function,\
    \ let's first solve a problem. For example, it is required to define a function\
    \ that is used to calculate the sum of two numbers and print out the calculated\
    \ results. Convert the above requirements into codes. The sample codes are as\
    \ follows:\n\n```python\ndef thisisaddition():\n    result = 62 + 12\n    print(result)\n\
    ```\n\nThe functionality of the above function is to calculate the sum of 62 and\
    \ 12. At this time, no matter how many times this function is called, the result\
    \ will always be the same, and only the sum of two fixed numbers can be calculated,\
    \ making this function very limited.\n\nTo make the defined function more general,\
    \ that is, to calculate the sum of any two numbers, two parameters can be added\
    \ when defining the function, and the two parameters can receive the value passed\
    \ to the function. Next, a case is used to demonstrate how a function passes parameters.\n\
    \n### Example: Function Transfer Parameters\n\n```python\n# defines a function\
    \ that receives 2 parameters\ndef thisisaddition(first, second):\n    third =\
    \ first + second\n    print(third)\n```\n\nIn the example above, a function capable\
    \ of receiving two parameters is defined. Where `first` is the first parameter\
    \ for receiving the first value passed by the function; `second` is the second\
    \ parameter and receives the second value passed by the function.\n\nAt this time,\
    \ if you want to call the `thisisaddition` function, you need to pass two numeric\
    \ values to the function's parameters. The example code is as follows:\n\n```python\n\
    # When calling a function with parameters, you need to pass data in parentheses.\n\
    thisisaddition(62, 12)\n```\n\nIt should be noted that if a function defines multiple\
    \ parameters, then when calling the function, the passed data should correspond\
    \ to the defined parameters one by one.\n\n## Default Parameters\n\nWhen defining\
    \ a function, you can set a default value for its parameter, which is called the\
    \ default parameter. When calling a function, because the default parameter has\
    \ been assigned a value at the time of definition, it can be directly ignored,\
    \ while other parameters must be passed in values. If the default parameter does\
    \ not have an incoming value, the default value is directly used. If the default\
    \ parameter passes in value, the new value passed in is used instead.\n\nNext,\
    \ we use a case to demonstrate the use of the default parameter.\n\n### Example:\
    \ Default Parameters\n\n```python\ndef getdetails(input, time=35):\n    # prints\
    \ any incoming string\n    print(\"Details:\", input)\n    print(\"Time:\", time)\n\
    \n# calls printinfo function\ngetdetails(input=\"sydney\")\ngetdetails(input=\"\
    sydney\", time=2232)\n```\n\nIn the example, lines 1-4 define the `getdetails`\
    \ function with two parameters. Among them, the `input` parameter has no default\
    \ value, and `time` has already set the default value as the default parameter.\n\
    \nWhen calling the `getdetails` function, because only the value of the `input`\
    \ parameter is passed in, the program uses the default value of the `time` parameter.\
    \ When the `getdetails` function is called again, the values of the `input` and\
    \ `time` parameters are passed in at the same time, so the program will use the\
    \ new value passed to the `time` parameter.\n\nIt should be noted that parameters\
    \ with default values must be located at the back of the parameter list. Otherwise,\
    \ the program will report an error. For example, add parameter `sex` to the `getdetails`\
    \ function and place it at the back of the parameter list to look at the error\
    \ information.\n\nWith this, we have completed a thorough explanation of functions\
    \ in Python. In the next section, we will discuss different types of functions\
    \ with an example.\n"
  trans: "\n# 第 9 章：Python 中的函数\n\n本章是关于函数的综合指南。我们将通过示例探讨函数的各个组成部分。让我们开始吧！\n\n## 什么是函数？\n\
    \n函数是有组织的、可复用的代码段，用于实现单一或相关联的功能，能够提高应用的模块性和代码的复用率。Python 提供了许多内置函数，例如 `print()`。同时，我们也可以创建自己的函数，即自定义函数。\n\
    \n接下来，请看一段代码：\n\n```\n// display(\" * \")\n// display(\" *** \")\n// display(\"\
    \ ***** \")\n```\n\n如果需要在程序的不同部分输出上述图形，每次都使用 `print()` 函数输出是不可取的。为了提高编写效率和代码复用性，我们可以将具有独立功能的代码块组织成一个小模块，这被称为函数。\n\
    \n## 定义函数\n\n我们可以定义一个函数来实现所需的功能。Python 定义函数以 `def` 开头，定义函数的基本格式如下：\n\n```\ndef\
    \ function_name(parameters):\n    \"\"\"docstring\"\"\"\n    function_body\n \
    \   return expression\n```\n\n请注意，如果参数列表包含多个参数，默认情况下，参数值和参数名按照函数声明中定义的顺序进行匹配。\n\
    \n接下来，定义一个能够完成打印信息功能的函数，如下例所示。\n\n### 示例：打印信息的函数\n\n```python\n# 定义一个可以打印信息的函数\n\
    def Useforprint():\n    print('------------------------------------')\n    print('life\
    \ is short, I use python')\n    print('------------------------------------')\n\
    ```\n\n## 调用函数\n\n定义函数后，相当于拥有了一段具有特定功能的代码。要使这些代码可执行，需要调用它。调用函数非常简单，可以通过 `function_name()`\
    \ 来调用。\n\n例如，调用上一节中 `Useforprint` 函数的代码如下：\n\n```python\n# 函数定义后不会自动执行，需要调用\n\
    Useforprint()\n```\n\n## 函数的参数\n\n在介绍函数参数之前，我们先解决一个问题。例如，要求定义一个用于计算两个数之和并打印计算结果的函数。将上述需求转化为代码。示例代码如下：\n\
    \n```python\ndef thisisaddition():\n    result = 62 + 12\n    print(result)\n\
    ```\n\n上述函数的功能是计算 62 和 12 的和。此时，无论调用多少次该函数，结果始终相同，且只能计算两个固定数字的和，这使得该函数非常受限。\n\n\
    为了使定义的函数更加通用，即计算任意两个数的和，可以在定义函数时添加两个参数，这两个参数可以接收传递给函数的值。接下来，通过一个案例演示函数如何传递参数。\n\
    \n### 示例：函数传递参数\n\n```python\n# 定义一个接收 2 个参数的函数\ndef thisisaddition(first, second):\n\
    \    third = first + second\n    print(third)\n```\n\n在上面的示例中，定义了一个能够接收两个参数的函数。其中\
    \ `first` 是用于接收函数传递的第一个值的第一个参数；`second` 是第二个参数，用于接收函数传递的第二个值。\n\n此时，如果要调用 `thisisaddition`\
    \ 函数，需要向函数的参数传递两个数值。示例代码如下：\n\n```python\n# 调用带参数的函数时，需要在括号中传递数据。\nthisisaddition(62,\
    \ 12)\n```\n\n应当注意的是，如果函数定义了多个参数，则调用函数时，传递的数据应与定义的参数一一对应。\n\n## 默认参数\n\n定义函数时，可以为其参数设置默认值，这称为默认参数。调用函数时，因为默认参数在定义时已赋值，可以直接忽略，而其他参数必须传入值。如果默认参数没有传入值，则直接使用默认值。如果默认参数传入了值，则使用新传入的值替换。\n\
    \n接下来，我们通过一个案例演示默认参数的使用。\n\n### 示例：默认参数\n\n```python\ndef getdetails(input, time=35):\n\
    \    # 打印任意传入的字符串\n    print(\"Details:\", input)\n    print(\"Time:\", time)\n\
    \n# 调用 printinfo 函数\ngetdetails(input=\"sydney\")\ngetdetails(input=\"sydney\"\
    , time=2232)\n```\n\n在示例中，第 1-4 行定义了带有两个参数的 `getdetails` 函数。其中，`input` 参数没有默认值，而\
    \ `time` 已设置默认值作为默认参数。\n\n调用 `getdetails` 函数时，因为只传入了 `input` 参数的值，程序使用了 `time`\
    \ 参数的默认值。当再次调用 `getdetails` 函数时，同时传入了 `input` 和 `time` 参数的值，因此程序将使用传递给 `time`\
    \ 参数的新值。\n\n应当注意的是，带有默认值的参数必须位于参数列表的末尾。否则，程序将报错。例如，向 `getdetails` 函数添加 `sex` 参数并将其放在参数列表末尾，查看错误信息。\n\
    \n至此，我们已完成对 Python 中函数的详尽解释。在下一节中，我们将通过示例讨论不同类型的函数。\n\n"
