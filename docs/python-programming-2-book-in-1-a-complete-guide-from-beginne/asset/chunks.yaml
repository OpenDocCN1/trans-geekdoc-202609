  fmt: "\n# Chapter 8: Structures in Python\n\nPython is a structural language and\
    \ provides various structures to store and manipulate data for performing operations.\
    \ In this chapter, we will discuss structures such as lists in detail. A lot of\
    \ this chapter is theoretical and needs an understanding of various concepts explained\
    \ before. Let us start!\n\n## What is a list?\n\nThe string data type learned\
    \ earlier can be used to store a single piece string of information. But suppose\
    \ there are 100 students in a class. If you want to store the names of all the\
    \ students in this class, you need to define 100 variables, and each variable\
