    \ to make programming languages more intuitive and operative. In this chapter,\
    \ we will discuss in detail various functionalities that functional programming\
    \ offers with many examples.\n\n## Characteristics of Functional Programming\n\
    \nFunctional programming, contrary to belief, can cooperate with both imperative\
    \ and object-oriented paradigms. Here are some objectives to remember to reconsider\
    \ whether a programming language supports a complete functional paradigm or not:\n\
    \n1.  **Functions are also objects.** They can be used to perform every single\
    \ task that objects can perform. They can be used to call a function from within\
    \ a function.\n2.  **Recursion for looping.** Many functional programming paradigms\
    \ use recursion to loop structures. Some paradigms only offer recursion for looping\
    \ tasks.\n3.  **List processing.** Functional programming also works with lists.\
    \ They are often used to process and loop through lists.\n4.  **Expressions over\
    \ statements.** Functional programming is not very comfortable dealing with statements.\
    \ However, they can be used very effectively to evaluate expressions that hold\
    \ a logical entity.\n5.  **Higher-order functions.** Functional programming also\
    \ offers higher-order functions with exact precision.\n\nPython follows all the\
    \ characteristics mentioned above and is called a pure functional language. In\
    \ the next section, we will discuss using functions in Python in detail.\n\n##\
    \ What are Functions?\n\nFunctions are a reusable code segment that can be used\
    \ to repeat tasks all at once according to specified needs. For example, look\
    \ at the following pattern:\n\n```\n' {}'\n'{}{}'\n'{}{}{}'\n```\n\nFor our requirement,\
    \ we need to display 100 of these pairs in a straight line. You can use the `print`\
    \ function to display the result after a lot of hard work. However, this method\
    \ is not feasible and is not preferred by programmers. Here, functions can be\
    \ used to assign the pattern and call them as many times as needed and wherever\
    \ needed. You can use a looping statement to loop the pattern 100 times. In the\
    \ next section, we will achieve this result using functions in Python.\n\n## How\
    \ to Define a Function?\n\nThe function should be defined according to certain\
    \ regular specifications that the Python language possesses. Here is the format\
    \ that functions use in Python:\n\n```\ndef {Enter name of the function} [ Enter\
    \ the parameters here]\n```\n\nHere is an example:\n\n```\ndef sum(a,b)\n```\n\
    \nAfter defining a function, all you need to do is create a step-by-step logical\
    \ expression for the body of the function.\n\n## How to Call a Function?\n\nAfter\
    \ defining a function, you need to know the procedure to call it whenever you\
    \ need it. Function calls can be achieved in Python by using the following format:\n\
    \n```\nNameofthefunction()\n```\n\n### Exercise 1: Print 100 lines of the '{}'\
    \ pattern using a function\n\nHere is the Python code:\n\n```\ndef funpattern()\
    \ {\n    for (i=100;i++) {\n        print ( \" {}\")\n        i++;\n    }\n}\n\
    \nPrint( \" Here is the result\")\nfunpattern()\n```\n\n## Function Parameters\n\
    \nParameters are necessary for functions to define default values. Variables are\
    \ usually pointed out to parameters in the function and are necessary for logical\
    \ execution. There are usually default parameters that define the essence of the\
    \ function. Here is the format:\n\n```\n[ Function parameter 1, Function parameter\
    \ 2 ...... Function parameter n]\n```\n\nIt is important to remember that the\
    \ function parameter can be a dynamic number. You can usually use these parameters\
    \ to return values. In the next section, we will give an example that will help\
    \ you understand recursion in detail.\n\n## What is Recursion?\n\nRecursion is\
    \ a mathematical phenomenon where a function calls itself until the condition\
    \ is satisfied. Recursion can decrease the code length of the program very effectively.\
    \ Many programmers determine recursive functions as an easy way to achieve complete\
    \ performance from the program. Here is an example:\n\n```\ndef result(example):\n\
    \    if example == 0:\n        return 0\n    elif example == 1:\n        return\
    \ 1\n    else:\n        return result(example-1)+result(example-2)\n```\n\n**Explanation\
    \ of the program:**\n\nIn the above program, we use a recursive function to find\
    \ the Fibonacci numbers according to your input. Here is a list of steps that\
    \ we followed:\n\n1.  First, we created a function using the `def` reserved keyword\
    \ and the function name along with a parameter.\n2.  This function uses a single\
    \ parameter `example` that is used to represent the number of Fibonacci numbers\
    \ that need to be generated in the sequence.\n3.  In the next step, we created\
    \ a control flow conditional statement that checks whether a number satisfies\
    \ the Fibonacci sequence or not.\n4.  In the conditional statement, the result\
    \ is always returned using the function.\n5.  In the next step, we use a recursive\
    \ mechanism to repeat the function logic and print the results.\n6.  The last\
    \ step in the function informs to end the recursive function after it satisfies\
    \ the parameter.\n\nThis is how Python uses functional programming to generate\
    \ results. Python also supports higher-order functions such as `Lambda` for advanced\
    \ operations.\n\n## How Functional Programming is Essential for Machine Learning?\n\
    \nIt is mandatory to learn functional modules in Python because many third-party\
    \ machine learning supportive libraries such as `Pandas` use functions to generate\
    \ algorithms and graphs. If you are not aware of defining custom functions, it\
    \ will become troublesome to generate unsupervised and supervised algorithms for\
    \ a dataset. Also, it is easy to articulate your logical thoughts into programming\
    \ using functions. To improve your knowledge of function modules, we suggest you\
    \ read the documentation of various third-party libraries.\n\n## Higher-Order\
    \ Functions\n\nPython supports higher-order functions. Version 3 provides many\
    \ higher-order functions such as `Lambda`, `filter`, `reduce`. This section will\
    \ describe many of these in detail.\n\n### What is a Higher-Order Function?\n\n\
    This works in the same way as recursion. In higher-order functions, parameters\
    \ are also functions. You can use `n` number of functions as parameters and can\
    \ obtain a function as a result. Higher-order functions use the iterable concept\
    \ to analyze different types of functions. Python provides `map()` and `reduce()`\
    \ functions by default. However, all other higher-order functions should be manually\
    \ imported to make them work. Many data science applications use higher-order\
    \ functions to get perfect results.\n\n#### a) Map\n\nA `map` is a Python high-order\
    \ function that can be used to transform the position of the data set. In machine\
    \ learning, the transformation of data points is a common phenomenon and is essential\
    \ for developing regression algorithms. Here is the format:\n\n```\nmap (Enter\
    \ the coordinates of data set here, Iteration points)\n```\n\n#### b) Filter\n\
    \nA `filter` is a Python higher-order function that can be used to predict the\
    \ data points according to the scenarios given. This higher-order function is\
    \ largely used in prediction algorithms. Many video streaming websites such as\
    \ YouTube and Netflix use `filter` to store user information to recommend likewise\
    \ videos. Here is the format:\n\n```\nfilter (Prediction analysis, Iteration)\n\
    ```\n\n#### 3) Compose\n\n`Compose` is a Python higher-order function that can\
    \ in a significant order input functions as parameters. It can even use loops\
    \ as a control flow statement to maintain the logical flow of the program. `Compose`\
    \ is often used in advanced data analytics applications. Here is the format:\n\
    \n```\ncompose(Enter the higher-order function here) {\n    // Enter the logical\
    \ statements here\n}\n```\n\n> **Note:** Higher-order functions can use the same\
    \ operating module operations as the remaining programming components.\n\n####\
    \ 4) Decorators\n\nHigher-order functions are usually arranged syntactically as\
    \ function parameters. However, decorators are used to syntactically arrange higher-order\
    \ functions such as `lambda` functions in correct sequential order. Decorators\
    \ can take higher-order functions as arguments and output the instances. Here\
    \ is the format:\n\n```\nDecorator(Enter higher-order function 1, Enter higher-order\
    \ function 2)\n```\n\nDecorators can also be used to implement coroutines and\
    \ develop complex applications that can take coroutines as function arguments.\
    \ Decorators can also be very handy while dealing with any debugging and run-time\
    \ errors. To develop machine learning applications, it is always recommended to\
    \ learn in-depth about different higher-order functions and the parameters they\
    \ can regulate expressions with. You can look at Python documentation to know\
    \ about the different types of higher-order functions that are available.\n\n\
    With this, we have completed a brief introduction to functional programming in\
    \ Python. In the next chapter, we will discuss the operator module in detail.\n"
  trans: "\n\n# 第 4 章：函数式编程与推导式\n\n函数是一种数学概念，可用于以确定的方式重复任务。传统编程语言在编程中采用了这一概念，以实现重复性任务的自动化。然而，随着时间的推移，开发者开始部署各种系统函数，使编程语言更加直观和易用。在本章中，我们将通过大量示例详细讨论函数式编程提供的各种功能。\n\
    \n## 函数式编程的特征\n\n与普遍看法相反，函数式编程既可以与命令式范式协作，也可以与面向对象范式协作。以下是一些需要记住的目标，以便重新评估一门编程语言是否支持完整的函数式范式：\n\
    \n1.  **函数也是对象。** 它们可以执行对象能够执行的每一项任务。它们可以用于在函数内部调用另一个函数。\n2.  **使用递归进行循环。** 许多函数式编程范式使用递归来循环结构。某些范式仅提供递归来执行循环任务。\n\
    3.  **列表处理。** 函数式编程也适用于列表。它们常被用来处理和遍历列表。\n4.  **表达式优于语句。** 函数式编程不太擅长处理语句。然而，它们可以非常有效地用于求值那些包含逻辑实体的表达式。\n\
    5.  **高阶函数。** 函数式编程还提供精确的高阶函数。\n\nPython 遵循上述所有特征，被称为一门纯函数式语言。在下一节中，我们将详细讨论在 Python\
    \ 中使用函数的方法。\n\n## 什么是函数？\n\n函数是一种可复用的代码片段，可根据指定需求一次性重复执行任务。例如，观察以下模式：\n\n```\n\
    ' {}'\n'{}{}'\n'{}{}{}'\n```\n\n根据我们的需求，我们需要在一行中显示 100 组这样的配对。你可以在大量辛苦工作后使用 `print`\
    \ 函数来显示结果。然而，这种方法不可行，也不是程序员所推崇的。在这里，可以使用函数来封装该模式，并根据需要随时随地调用任意次数。你可以使用循环语句将该模式循环\
    \ 100 次。在下一节中，我们将使用 Python 中的函数来实现这一结果。\n\n## 如何定义函数？\n\n函数的定义应遵循 Python 语言所具备的特定规范。以下是\
    \ Python 中函数使用的格式：\n\n```\ndef {输入函数名称} [ 在此输入参数 ]\n```\n\n这是一个示例：\n\n```\ndef\
    \ sum(a,b)\n```\n\n定义函数后，你只需为函数体创建一个分步的逻辑表达式即可。\n\n## 如何调用函数？\n\n定义函数后，你需要知道在需要时调用它的过程。在\
    \ Python 中，可以使用以下格式实现函数调用：\n\n```\n函数名称()\n```\n\n### 练习 1：使用函数打印 100 行 '{}' 模式\n\
    \n这是 Python 代码：\n\n```\ndef funpattern() {\n    for (i=100;i++) {\n        print\
    \ ( \" {}\")\n        i++;\n    }\n}\n\nPrint( \" Here is the result\")\nfunpattern()\n\
    ```\n\n## 函数参数\n\n参数对于函数定义默认值是必需的。变量通常指向函数中的参数，且对于逻辑执行是必要的。通常存在定义函数本质的默认参数。格式如下：\n\
    \n```\n[ 函数参数 1, 函数参数 2 ...... 函数参数 n ]\n```\n\n重要的是要记住，函数参数的数量可以是动态的。你通常可以使用这些参数来返回值。在下一节中，我们将给出一个示例，帮助你详细理解递归。\n\
    \n## 什么是递归？\n\n递归是一种数学现象，即函数调用自身直到满足条件。递归可以非常有效地减少程序的代码长度。许多程序员认为递归函数是从程序中获得完整性能的简便方法。这是一个示例：\n\
    \n```\ndef result(example):\n    if example == 0:\n        return 0\n    elif\
    \ example == 1:\n        return 1\n    else:\n        return result(example-1)+result(example-2)\n\
    ```\n\n**程序解释：**\n\n在上述程序中，我们使用递归函数根据你的输入查找斐波那契数列。以下是我们遵循的步骤列表：\n\n1.  首先，我们使用\
    \ `def` 保留关键字、函数名称以及一个参数创建了一个函数。\n2.  该函数使用单个参数 `example`，用于表示需要在序列中生成的斐波那契数的数量。\n\
    3.  在下一步中，我们创建了一个控制流条件语句，用于检查某个数字是否满足斐波那契数列。\n4.  在条件语句中，结果始终通过函数返回。\n5.  在下一步中，我们使用递归机制重复函数逻辑并打印结果。\n\
    6.  函数中的最后一步是在满足参数后通知结束递归函数。\n\n这就是 Python 使用函数式编程生成结果的方式。Python 还支持用于高级操作的高阶函数，如\
    \ `Lambda`。\n\n## 函数式编程为何对机器学习至关重要？\n\n学习 Python 中的函数式模块是强制性的，因为许多第三方机器学习支持库（如\
    \ `Pandas`）使用函数来生成算法和图表。如果你不了解如何定义自定义函数，为数据集生成无监督和有监督算法将变得麻烦。此外，使用函数将你的逻辑思维转化为编程代码也很容易。为了提高你对函数模块的了解，我们建议你阅读各种第三方库的文档。\n\
    \n## 高阶函数\n\nPython 支持高阶函数。版本 3 提供了许多高阶函数，如 `Lambda`、`filter`、`reduce`。本节将详细描述其中许多函数。\n\
    \n### 什么是高阶函数？\n\n其工作方式与递归相同。在高阶函数中，参数也是函数。你可以使用 `n` 个函数作为参数，并获得一个函数作为结果。高阶函数使用可迭代概念来分析不同类型的函数。Python\
    \ 默认提供 `map()` 和 `reduce()` 函数。然而，所有其他高阶函数都应手动导入才能工作。许多数据科学应用使用高阶函数以获得完美的结果。\n\
    \n#### a) Map\n\n`map` 是一个 Python 高阶函数，可用于转换数据集的位置。在机器学习中，数据点的转换是一种常见现象，对于开发回归算法至关重要。格式如下：\n\
    \n```\nmap (在此输入数据集的坐标, 迭代点)\n```\n\n#### b) Filter\n\n`filter` 是一个 Python 高阶函数，可用于根据给定场景预测数据点。该高阶函数广泛用于预测算法。许多视频流网站（如\
    \ YouTube 和 Netflix）使用 `filter` 存储用户信息以推荐类似视频。格式如下：\n\n```\nfilter (预测分析, 迭代)\n\
    ```\n\n#### 3) Compose\n\n`Compose` 是一个 Python 高阶函数，可以按重要顺序输入函数作为参数。它甚至可以使用循环作为控制流语句来维持程序的逻辑流程。`Compose`\
    \ 常用于高级数据分析应用。格式如下：\n\n```\ncompose(在此输入高阶函数) {\n    // 在此输入逻辑语句\n}\n```\n\n>\
    \ **注意：** 高阶函数可以使用与其余编程组件相同的操作模块操作。\n\n#### 4) Decorators\n\n高阶函数通常在语法上被安排为函数参数。然而，装饰器用于在语法上正确地按顺序排列高阶函数（如\
    \ `lambda` 函数）。装饰器可以接受高阶函数作为参数并输出实例。格式如下：\n\n```\nDecorator(输入高阶函数 1, 输入高阶函数 2)\n\
    ```\n\n装饰器还可以用于实现协程，并开发可将协程作为函数参数的复杂应用。在处理任何调试和运行时错误时，装饰器也非常方便。为了开发机器学习应用，始终建议深入学习不同的高阶函数及其可以调节表达式的参数。你可以查阅\
    \ Python 文档以了解可用的不同类型的高阶函数。\n\n至此，我们完成了 Python 函数式编程的简要介绍。在下一章中，我们将详细讨论运算符模块。\n\
    \n"
