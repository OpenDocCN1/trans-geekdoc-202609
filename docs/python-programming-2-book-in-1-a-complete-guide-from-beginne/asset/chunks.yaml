    \ the use of `if-else` statements, next, we will demonstrate the function of `if-else`\
    \ statements through a case.\n\n**Example: if-else statement**\n\n```\nTicket\
    \ = 1  # with 1 for tickets, 0 for no tickets\nif ticket == 1:\n    print(\"you\
    \ can get on the train if you have a ticket\")\n    print(\"I can finally see\
    \ home\")\nelse:\n    print(\"No tickets, no boarding\")\n    print(\"Dear, I'll\
    \ see you next time\")\n```\n\nSet the value of the variable `ticket` to `0` and\
    \ run the program again. You will understand about conditional statements in depth\
    \ if you can practice it by practical coding.\n\n## If nesting\n\nWhen we take\
    \ a train or subway, we have to buy a ticket first. Only when we buy a ticket\
    \ can we enter the station for security checks. Only when we pass the security\
    \ check can we take the bus normally. In the process of taking a train or subway,\
    \ the latter judgment condition is based on the previous judgment. Given this\
    \ situation, `if` nesting can be used.\n\n`If` nesting refers to the inclusion\
    \ of an `if` or `if-else` statement in an `if` or `if-else` statement, and its\
    \ nesting format is as follows:\n\n```\nif conditions1:\n    // What to do if\
    \ condition 1 is met\n    // things that meet condition 1\n    if conditions2:\n\
    \        things are done to meet condition 2\n```\n\nIn the above format, we can\
    \ choose whether to use `if` statement or `if-else` statement for the `if` of\
    \ the outer layer and `if` of the inner layer according to the actual development.\n\
    \n## Loop Statements\n\nIn real life, there are many cyclic procedures. For example,\
    \ the alternation of traffic lights is a repetitive process. In the program, if\
    \ you want to repeat some operations, you can use circular statements, also called\
    \ loops. Python provides two loop statements: the `while` loop and the `for` loop.\
    \ We will now discuss these two statements in detail.\n\n### While loop\n\nThe\
    \ basic format of the `while` loop is as follows:\n\n```\nWhile condition:\n \
    \   Enter the logic\n    Output results\n```\n\nIf the condition is satisfied,\
    \ the loop statement is executed. When the conditional expression is `True`, the\
    \ program executes a loop statement. It should be noted that in the `while` loop,\
    \ colon and indentation should also be noted. Also, there is no `do-while` loop\
    \ in Python.\n\nIf we want the loop to be infinite, we can implement an infinite\
    \ loop by setting the conditional expression to always be `True`. An infinite\
    \ loop is very useful for real-time requests from clients on the server. Next,\
    \ a case is used to demonstrate the specific code.\n\n**Example: while loop**\n\
    \n```\nvalue = 1\nWhile value == 1:  # expression is always True\n    input =\
    \ int(give(\"enter a number:\"))\n    print(\"The number you entered is:\", input\"\
    )\n```\n\n### For loop\n\nThe `for` loop in Python can traverse any sequence of\
    \ items, such as a list or a string. The basic format of the `for` loop is as\
    \ follows:\n\n```\nFor variable in sequence:\n    loop statement\n```\n\nFor example,\
    \ use the `for` loop to traverse the list; the example code is as follows:\n\n\
    ```\nfor result in [62, 1, 32]:\n    print(result)\n```\n\n**Output results:**\n\
    \n```\n62\n1\n32\n```\n\nIn the above example, the `for` loop can display the\
    \ values in the list one by one. Considering that the range of values we use varies\
    \ frequently, Python provides a built-in `Range` function that can generate a\
    \ sequence of numbers. The basic format of the `range` function in the `for` loop\
    \ is as follows:\n\n```\nfor result in range(get, set):\n    Enter logic here\n\
    ```\n\nExecute loop statement: When the program executes the `for` loop, the loop\
    \ timer variable `result` is set to `start`, and then the loop statement is executed.\
    \ The `result` is sequentially set to all values between `start` and `end`. The\
    \ loop statement is executed once for each new value set.\n\nIn an integer, the\
    \ number divisible by 2 is called an even number. Now, we will develop a program\
    \ to calculate the sum of even numbers between 1 and 100.\n\n**Example: Calculate\
    \ the Sum of Even Numbers from 1 to 100**\n\n```\nfirst = 0\nOutput = 0\nwhile\
    \ i < 101:\n    if first % 2 == 0:\n        sum Output += first\n    first +=\
    \ 1\nPrint(\"the sum of even numbers between 1 and 100 is: %s\" % first\")\n```\n\
    \n### While nesting\n\nIt just represents a nested `while` in a `while` loop.\
    \ The `while` nesting format is as follows:\n\n```\nWhile condition 1:\n    When\
    \ condition 1 is met, do 1\n    {\n        while condition 2:\n            When\
    \ condition 2 is met, do 2\n    }\n```\n\nRelevant explanations of the above formats\
    \ are as follows:\n\n1. When the loop condition 1 is satisfied, the things to\
    \ be done when condition 1 is satisfied are executed. At this time, there may\
    \ be an opportunity to execute the loop nested inside.\n2. When the cycle condition\
    \ 2 is satisfied, perform the things to be done when condition 2 is satisfied\
    \ until the `while` cycle inside is finished.\n3. When the cycle condition 2 is\
    \ not satisfied, the `while` cycle outside the loop is finished after the execution\
    \ of the things to be done by the external loop.\n\nWith this, we have completed\
    \ a brief discussion about conditionals and loops in Python. We will also discuss\
    \ remaining control flow statements in the further chapter. For now, in the next\
    \ chapter, we will discuss object-oriented programming in detail with a lot of\
    \ examples.\n"
  trans: "\n# 第 11 章：Python 中的条件语句与循环语句\n\n在本章中，我们将详细学习条件语句和循环语句。在讨论这些语句之前，我们需要了解判断，这是掌握这些概念所必需的核心概念。\n\
    \n## 什么是判断？\n\n判断意味着只有当满足特定条件时，才允许执行某项操作；而当条件不满足时，则不允许执行。例如在现实生活中，过马路取决于红绿灯。如果是绿灯，你可以过马路；否则，你需要停下来等待。判断不仅用于生活中，也用于程序开发。例如，当用户登录时，只有用户名和密码均正确时，才允许其登录。Python\
    \ 提供了多种判断语句。在下一节中，我们将详细解释这些判断语句。\n\n## If 语句\n\n`if` 语句是最简单的条件判断语句。它可以控制程序的执行流程。其格式如下：\n\
    \n```\nIf criteria:\n    Things to do when you meet the first condition.\n   \
    \ Things to do when you meet the second condition\n    ...\n    Things to be done\
    \ when conditions are not met at all\n```\n\n在上述格式中，只有满足判断条件时，才能执行后续语句。\n\n为了帮助大家更好地理解\
    \ `if` 语句的用法，接下来我们将通过两个案例演示 `if` 语句的功能，如下所示。\n\n**示例：//if 语句 -1**\n\n```\nage\
    \ = 30\nPrint(\"if judgment starts\")\nif age >= 22:\n    Print(\"This is true\"\
    )\nPrint(\"-if judgment ends\")\n```\n\n在该示例中，程序的输出仅当 `age` 变量的值不同时才会不同。由此我们可以看到\
    \ `if` 判断语句的作用：只有满足特定条件时，才会执行指定的代码；否则不执行。\n\n**注意：**\n\n1.  每个 `if` 条件后使用冒号（`:`），表示满足条件后要执行的后续语句。\n\
    2.  使用缩进划分语句块。缩进数量相同的语句共同构成一个语句块。\n3.  Python 中没有 `switch-case` 语句。\n\n## If-else\
    \ 语句\n\n使用 `if` 时，只能在满足条件时执行想要的操作。如果不满足条件但需要执行其他操作，该怎么办？为了解决这个问题，我们可以使用 `if-else`\
    \ 语句。\n\n`if-else` 语句的使用格式如下：\n\n```\nIf condition:\n    Things to do when you\
    \ meet the first condition\n    Things to do when you meet the second condition.\n\
    \    ...\n    Things to be done when nth conditions are met\nelse:\n    Things\
    \ to do when the first conditions are not met\n    Things to do when second conditions\
    \ are not met\n    ...\n    Things to do when nth conditions are not met\n```\n\
    \n为了帮助大家更好地理解 `if-else` 语句的用法，接下来我们将通过一个案例演示 `if-else` 语句的功能。\n\n**示例：if-else\
    \ 语句**\n\n```\nTicket = 1  # with 1 for tickets, 0 for no tickets\nif ticket ==\
    \ 1:\n    print(\"you can get on the train if you have a ticket\")\n    print(\"\
    I can finally see home\")\nelse:\n    print(\"No tickets, no boarding\")\n   \
    \ print(\"Dear, I'll see you next time\")\n```\n\n将变量 `ticket` 的值设为 `0` 并再次运行程序。如果你能通过实际编码练习，将会深入理解条件语句。\n\
    \n## If 嵌套\n\n当我们乘坐火车或地铁时，必须先买票。只有买了票才能进站安检。只有通过安检才能正常乘车。在乘坐火车或地铁的过程中，后一个判断条件建立在前一个判断的基础上。针对这种情况，可以使用\
    \ `if` 嵌套。\n\n`If` 嵌套是指在一个 `if` 或 `if-else` 语句中包含另一个 `if` 或 `if-else` 语句，其嵌套格式如下：\n\
    \n```\nif conditions1:\n    // What to do if condition 1 is met\n    // things\
    \ that meet condition 1\n    if conditions2:\n        things are done to meet\
    \ condition 2\n```\n\n在上述格式中，我们可以根据实际开发需求，选择为外层 `if` 和内层 `if` 使用 `if` 语句还是 `if-else`\
    \ 语句。\n\n## 循环语句\n\n在现实生活中，存在许多循环过程。例如，红绿灯的交替变化就是一个重复的过程。在程序中，如果想要重复某些操作，可以使用循环语句，也称为循环。Python\
    \ 提供了两种循环语句：`while` 循环和 `for` 循环。我们现在将详细讨论这两种语句。\n\n### While 循环\n\n`while` 循环的基本格式如下：\n\
    \n```\nWhile condition:\n    Enter the logic\n    Output results\n```\n\n如果条件满足，则执行循环语句。当条件表达式为\
    \ `True` 时，程序执行循环语句。需要注意的是，在 `while` 循环中，也要注意冒号和缩进。此外，Python 中没有 `do-while` 循环。\n\
    \n如果我们希望循环无限进行，可以通过将条件表达式设置为始终为 `True` 来实现无限循环。无限循环对于服务器上客户端的实时请求非常有用。接下来，通过一个案例演示具体代码。\n\
    \n**示例：while 循环**\n\n```\nvalue = 1\nWhile value == 1:  # expression is always\
    \ True\n    input = int(give(\"enter a number:\"))\n    print(\"The number you\
    \ entered is:\", input\")\n```\n\n### For 循环\n\nPython 中的 `for` 循环可以遍历任何项目序列，例如列表或字符串。`for`\
    \ 循环的基本格式如下：\n\n```\nFor variable in sequence:\n    loop statement\n```\n\n例如，使用\
    \ `for` 循环遍历列表；示例代码如下：\n\n```\nfor result in [62, 1, 32]:\n    print(result)\n\
    ```\n\n**输出结果：**\n\n```\n62\n1\n32\n```\n\n在上述示例中，`for` 循环可以逐个显示列表中的值。考虑到我们使用的值范围经常变化，Python\
    \ 提供了内置的 `Range` 函数来生成数字序列。`for` 循环中 `range` 函数的基本格式如下：\n\n```\nfor result in\
    \ range(get, set):\n    Enter logic here\n```\n\n执行循环语句：当程序执行 `for` 循环时，循环计时器变量\
    \ `result` 被设置为 `start`，然后执行循环语句。`result` 依次被设置为 `start` 和 `end` 之间的所有值。每设置一个新值，循环语句就执行一次。\n\
    \n在整数中，能被 2 整除的数称为偶数。现在，我们将开发一个程序来计算 1 到 100 之间所有偶数的和。\n\n**示例：计算 1 到 100 之间偶数的和**\n\
    \n```\nfirst = 0\nOutput = 0\nwhile i < 101:\n    if first % 2 == 0:\n       \
    \ sum Output += first\n    first += 1\nPrint(\"the sum of even numbers between\
    \ 1 and 100 is: %s\" % first\")\n```\n\n### While 嵌套\n\n它仅表示在一个 `while` 循环中嵌套另一个\
    \ `while` 循环。`while` 嵌套的格式如下：\n\n```\nWhile condition 1:\n    When condition 1\
    \ is met, do 1\n    {\n        while condition 2:\n            When condition\
    \ 2 is met, do 2\n    }\n```\n\n上述格式的相关说明如下：\n\n1.  当循环条件 1 满足时，执行条件 1 满足时要做的事情。此时可能会有机会执行内部嵌套的循环。\n\
    2.  当循环条件 2 满足时，执行条件 2 满足时要做的事情，直到内部的 `while` 循环结束。\n3.  当循环条件 2 不满足时，执行完外部循环要做的事情后，外部的\
    \ `while` 循环结束。\n\n至此，我们完成了关于 Python 中条件语句和循环语句的简要讨论。我们将在后续章节中讨论剩余的控制流语句。目前，在下一章中，我们将结合大量示例详细讨论面向对象编程。\n\
    \n"
