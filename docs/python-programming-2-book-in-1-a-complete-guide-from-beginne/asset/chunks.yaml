  trans: "\n\n# 第 13 章：Python 中的控制流语句\n\n之前我们已经详细讨论了条件语句和循环语句。在本章中，我们将进一步简要继续讨论控制语句。提供了大量示例以帮助您理解主题的精髓。让我们深入了解吧。\n\
    \n## 什么是控制流语句？\n\n所有条件语句、循环以及执行逻辑结构的额外编程逻辑代码都被称为控制流语句。我们已经通过各种示例对条件语句和循环进行了广泛的介绍。现在，您应该记住，我们即将学习的控制流语句对于程序执行非常重要。如果使用得当，它们可以成功地跳过、终止或继续逻辑。现在让我们通过示例开始学习它们吧。开始！\n\
    \n## break 语句\n\n`break` 语句用于一次性结束整个循环（当前循环体）。它前面带有一个逻辑判断。例如，下面是一个普通的循环：\n\n```\n\
    for sample in range(10):\n    print(\"-------\")\n    print sample\n```\n\n执行上述循环语句后，程序将按顺序输出\
    \ 0 到 9 的整数。程序将不会停止运行，直到循环结束。此时，如果您希望程序仅输出 0 到 2 的数字，则需要在指定时间结束循环（执行完第三次循环语句后）。接下来，演示使用\
    \ `break` 结束循环的过程。\n\n**示例：break 语句**\n\n```\nend=1\nfor end in range(10):\n \
    \   end+=1\n    print(\"-------\")\n    if end==3:\n        break\n    print(end)\n\
    ```\n\n在示例中，当程序进行到第三次循环时，因为 `end` 的值为 3，程序将停止并打印截至此时的循环。\n\n## continue 语句\n\n\
    `continue` 的作用是结束本次循环，然后执行下一次循环。它将查看逻辑值并继续执行流程。接下来，通过一个案例演示 `continue` 语句的用法。\n\
    \n**示例：continue 语句**\n\n```\nsample=1\nfor sample in range(10):\n    sample+=1\n\
    \    print(\"-------\")\n    if sample==3:\n        continue\n    print(sample)\n\
    ```\n\n在示例中，当程序执行第三次循环时，因为 `sample` 的值为 3，程序将终止本次循环而不输出 `sample` 的值，并立即执行下一次循环。\n\
    \n**注意：**\n1. `break`/`continue` 只能在循环中使用，否则不能单独使用。\n2. `break`/`continue` 在嵌套循环中只作用于最近的一层循环。\n\
    \n## pass 语句\n\nPython 中的 `pass` 是一个空语句，其出现是为了保持程序结构的完整性。`pass` 不执行任何操作，通常用作占位符。`pass`\
    \ 语句的用法如下示例所示。\n\n**示例：pass 语句**\n\n```\nfor alphabet in 'University':\n    if\
    \ letter == 'v':\n        pass\n    print ('This is the statement')\n    print\
    \ ('Use this alphabet', letter)\nprint (\"You can never see me again\" )\n```\n\
    \n在上述示例中，当程序执行 `pass` 语句时，因为 `pass` 是空语句，程序将忽略该语句并按顺序执行后续语句。\n\n## else 语句\n\n\
    早些时候，在学习 `if` 语句时，`else` 语句被发现在 `if` 条件语法的作用域之外。事实上，除了判断语句外，Python 中的 `while`\
    \ 和 `for` 循环也可以使用 `else` 语句。当在循环中使用时，`else` 语句仅在循环完成后执行，即 `break` 语句也会跳过 `else`\
    \ 语句块。接下来，我们将通过一个案例演示，以便您更好地理解 `else` 代码块。\n\n**示例：else 语句**\n\n```\nresult =\
    \ 0\nwhile result < 5:\n    print(result, \" is less than 5\")\n    result = result\
    \ + 1\nelse:\n    print(result, \" is not less than 5\")\n```\n\n在示例中，`else` 语句在\
    \ `while` 循环终止后执行，即当 `result` 的值等于 5 时，程序执行 `else` 语句。\n\n至此，我们完成了 Python 编程中控制流语句的简要介绍。仅在必要时使用控制流语句始终很重要。如果在没有任何用例的情况下使用它们，它们可能会在编程过程中开始制造不必要的阻碍。在下一章中，我们将简要介绍\
    \ Python 中的决策树。让我们开始吧！\n\n# 第 14 章：Python 中的决策树\n\n在上一章中，我们讨论了控制流语句，现在我们将讨论一个与控制流语句相关的概念。决策树是一种逻辑结构，可用于根据特定标准做出决策。树是一种基本数据结构，通常用于存储和排序事物。我们现在将详细讨论\
    \ Python 中的决策树。让我们开始吧！\n\n## 什么是决策树？\n\n决策树是 Python 中的一个编程概念，可用于做出决策。它们也用于根据给定的输入做出决策。决策树主要用于机器学习中，以创建回归和监督算法。我们可以使用包含大量算法的\
    \ `pandas` 库在 Python 中实现决策树。在下一节中，我们将详细讨论决策树的实现。请继续跟随！\n\n## 决策树的实现\n\n这些决策树通常通过依赖所提出的问题来工作。如果给定的逻辑满足条件，则做出决策。如果不满足，则传递给另一个存在的节点。\n\
    \n### 如何选择？\n\n要选择一个节点，我们需要按如下方式操作。\n\n```\nif ( node logic) {\n    If it statisfies\
    \ then save()\n    else proceed.next()\n}\n```\n\n这段代码的目的是：语句块由各种复杂的逻辑实体进行检查。完成检查后，如果不满足条件，则将跳转到下一个节点执行相同的操作。如果满足条件，则将树的位置值存储在\
    \ error 中以供进一步评估。\n\n## 在 Python 中安装决策树\n\n要安装或使用决策树，您需要安装 `pandas` 和 `scikit-learn`\
    \ 并使用依赖项来使用它们。您可以使用 `pip` 来安装它们。格式如下：\n\n```\npip install {Enter the platform\
    \ name here}\n```\n\n## 决策树算法\n\n对于任何数据结构，遵循提到的算法都很重要。现在，我们将根据 Python 编程语言详细解释决策树算法。请继续跟随！\n\
    \n**步骤 1：** 首先，您需要将所有存在的数据视为根集合。\n**步骤 2：** 在下一步中，您需要了解存在的属性，并需要处理参数以显示结果。\n**步骤\
    \ 3：** 在此步骤中，您需要对用于比较的值执行递归操作。\n**步骤 4：** 在最后一步中，您需要使用不同的统计和伪方法来理解节点计算。\n\n##\
    \ 决策树的数据导入\n\n要导入用于决策树的数据，您需要使用 `pandas` 第三方库。您可以获取 URL 详细信息，也可以使用 CSV 格式发送信息。您甚至可以使用\
    \ `import` 语句来完成任务。\n\n## 决策树的数据切片\n\n一次性向决策树发送大量信息通常很难。为了解决这个问题，Python 提供了数据切片操作，可以根据您的需求划分数据。要执行出色的决策树操作，掌握基尼指数、熵等复杂的计算机科学主题非常重要，这些超出了本书的范围。如果您有兴趣构建自己的决策树算法，我们建议您深入学习信息增益机制。\n\
    \n至此，我们完成了关于 Python 中决策树的简要解释。在下一章中，我们将详细学习异常处理。让我们开始吧！\n\n"
