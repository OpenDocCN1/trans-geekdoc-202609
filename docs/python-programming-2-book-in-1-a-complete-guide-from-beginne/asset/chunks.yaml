    \ the input is a string instead of the number\nif result == \"1\":\n    # shut\
    \ down\n    os.system(\"shutdown -s -t 1\")\n    print(\"shutdown instruction\
    \ is ready\")\nelif result == \"2\":\n    # Restart\n    os.system(\"shutdown\
    \ -r -t 1\")\n    print(\"restart instruction is ready\")\nelse:\n    print(\"\
    no operation performed\")\n```\n\nAfter executing the above program, we will be\
    \ prompted to enter the desired operation, as follows:\n\n```text\nPlease enter\
    \ the operation you wish to perform: shutdown input 1, restart input 2\n```\n\n\
    If we want to shut down, we can enter `1` and press enter. If you want to restart,\
    \ you can enter `2` and press Enter. If you enter additional information and press\
    \ enter, nothing will be done. For example, entering `3` and pressing enter key\
    \ will output the following information:\n\n```text\nPlease enter what you want\
    \ to do: shut down input 1, restart input 2\n```\n\nIf you enter `2` and press\
    \ Enter, the restart command will be executed as follows:\n\n```text\nPlease enter\
    \ the operation you wish to perform: shutdown input 1 and restart input 2\n2.\
    \ The restart command was executed successfully.\n```\n\nSubsequently, the computer\
    \ will be shut down and restarted automatically within one minute. Similarly,\
    \ if after executing the above code, enter `1` and press enter key, the shutdown\
    \ operation will be executed. Here, how to control the restart and shutdown of\
    \ the local computer through Python code is realized. This is the first version\
    \ of the small target software, i.e. the simple version. The final target has\
    \ not been reached, so further development is needed.\n\n## Debugging during Development\n\
    \nSometimes, when writing software, there will be certain errors and problems.\
    \ The process of trying to solve these problems is called debugging. When we develop\
    \ this project, we will also encounter various problems. It doesn't matter. We\
    \ just need to find out where the problem is and improve the corresponding procedures.\n\
    \nDebugging is often carried out during project development, and it is difficult\
    \ to develop the program perfectly at one time. For example, when you write a\
    \ program in the mail reading phase if the waiting time for the operation is too\
    \ long, you will often encounter some errors that cannot be connected. At this\
    \ time, you can solve the problem by re-executing the login code. This process\
    \ is a debugging process.\n\nSimilarly, when you encounter other problems, you\
    \ should try your best to locate the problem first, and then compare with the\
    \ above procedures, carefully observe which place or details the problem is. If\
    \ you still can't think it out, you can put the error prompt into the search engine\
    \ to find out and see if it can be solved. In short, when you encounter problems,\
    \ thinking independently and trying to solve these problems independently can\
    \ make your programming ability stronger.\n\n## Concept of Program Packaging\n\
    \nThe process of turning the written program code into software that can be directly\
    \ executed is called program packaging. For example, scripts written now can only\
    \ be run in the Python editor. After they are packaged into software, they can\
    \ be run directly in the operating system without the support of the Python editor.\n\
    \n## Method of Packaging Python Programs\n\nReaders can use some tools to package\
    \ Python programs into executable application software. In Python, tools commonly\
    \ used for packaging include `py2exe`, `PyInstaller`, etc. These tools do not\
    \ need to be mastered completely, so everyone can choose a tool that they think\
    \ is suitable. This book will introduce how to package Python programs through\
    \ `PyInstaller`.\n\nTo use `PyInstaller`, you need to install it first. Here,\
    \ you can install `PyInstaller` directly using `pip`. First, open the `cmd` command-line\
    \ interface, and then enter the instructions. The `PyInstaller` is installed through\
    \ the `pip install pyinstaller` instruction and only needs to wait for the installation\
    \ to be completed. After the installation is completed, the installation success\
    \ prompt message will appear. In addition, readers can see the installed tool\
    \ file `pyinstaller.exe` in the `Scripts` directory under the Python installation\
    \ directory.\n\nNext, you can use the `PyInstaller` tool to package Python programs\
    \ into application software. For example, the path of the complete program of\
    \ this project is `D:/sample/project.py` and the Python installation directory\
    \ of my computer is `D:/Python`. Therefore, the Python program of this project\
    \ can be packaged through the following `cmd` instructions:\n\n```cmd\nD:\\> D:\\\
    Python\\Scripts\\pyinstaller.exe D:\\sample\\project.py\n```\n\nThe successfully\
    \ packaged executable program can be found in the `D:/dist` directory. The `sample`\
    \ folder is the software folder related to the `project.py` program that has just\
    \ been packaged and generated.\n\nThe file with the `.exe` extension is the executable\
    \ file generated after packaging. Double-click the file to run directly. At this\
    \ time, the current computer can be remotely controlled to restart or shut down\
    \ only by opening the program, so long as the \"shutdown\" or \"restart\" instruction\
    \ is sent to the designated mailbox.\n\nAs can be seen, the currently packaged\
    \ program needs to rely on many files. Because there are too many dependent files,\
    \ it is very inconvenient to migrate packaged programs to other computers to run.\
    \ In fact, it is also possible to package all the dependent files into an `.exe`\
    \ file; just add the `-F` parameter when packaging. At the same time, a `cmd`\
    \ interface will appear after the software is opened. In some cases, you don't\
    \ want the software to have this `cmd` interface, but you can also directly shield\
    \ it through the `-w` parameter when packaging, which will be much more beautiful\
    \ in some cases.\n\nNext, I will show you how to package all the dependent files\
    \ into a `.exe` file without the `cmd` interface. The packaged `cmd` instructions\
    \ are as follows:\n\n```cmd\nD:\\> D:\\Python\\Scripts\\pyinstaller.exe -F -w\
    \ D:\\sample\\project.py\n```\n\nAfter packaging, a separate `.exe` file will\
    \ be generated in the `D:/dist` directory. Readers can directly migrate the file\
    \ to other computers. Even if other computers do not have a good Python development\
    \ environment, double-click the `.exe` file to execute it (but it is better to\
    \ close the antivirus software to avoid interference from accidental killing).\n\
    \nIn addition, since the `-w` parameter is added during packaging, the `cmd` interface\
    \ will not be displayed when running the software, because the `cmd` interface\
    \ has been shielded by the `-w` parameter. If you want to display a `cmd` interface,\
    \ do not add the `-w` parameter when packing.\n\nRunning the software can realize\
    \ the function of remotely controlling the computer to shut down or restart through\
    \ e-mail. With this, we have completed a brief introduction to Python project\
    \ creation. In the next chapter, we will further discuss this practical project.\
    \ Follow along!\n"
  trans: "\n\n# 第 10 章：在 Python 中规划与设计项目\n\n在上一章中，我们学习了基本的编程结构。本章将通过一个示例帮助你理解如何开始创建一个项目。本章和下一章将通过一个样例项目进行实战演练，以提升你的\
    \ Python 技能。请跟随操作！\n\n## 明确项目目的\n\n在开发项目之前，首先要阐述项目的目的，以便大家在学习时能聚焦于此。本项目的开发目标如下：\n\
    \n1.  编写一个项目，远程控制计算机进行远程关机或重启。\n2.  复习之前学过的 Python 基础知识。\n3.  掌握项目开发的一般流程。\n\n\
    接到一个软件项目时，不应盲目立即动手，而应按照项目开发的流程循序渐进地进行。\n\n## 项目制作流程\n\n从零开发一个项目是一个复杂的过程，只有遵循特定的步骤才能完成。许多经验丰富的程序员使用以下蓝图来开发\
    \ Python 项目。该过程主要如下：\n\n1.  需求分析。\n2.  设计。\n3.  编码。\n4.  测试。\n5.  使用。\n6.  维护。\n\
    \n如果你不了解这些步骤，拿到项目就凭感觉去做。大型项目必然会陷入混乱，最终影响项目开发效率和最终效益。开发项目时，开发步骤非常重要。大家应从小项目做起，养成良好规范的习惯。\n\
    \n## 需求分析的概念\n\n需求分析是对项目所需功能的详细分析。例如，分析项目的目的、范围、定义和功能；换句话说，就是对项目的需求进行定位。\n\n###\
    \ 本项目需求分析的应用示例\n\n本项目旨在制作一个 Python 小软件，能够远程控制计算机的重启或关机功能。编程思路如下：\n\n首先，你需要知道如何通过\
    \ Python 在本地控制计算机的重启和关机，然后需要知道如何远程向 Python 程序发送消息。这里可以使用 Python 标准库来控制本地计算机的重启或关机。为了实现远程控制，可以使用电子邮件作为远程控制通道。例如，Python\
    \ 可以自动登录邮箱检测邮件。当向该邮箱发送关机指令时，如果 Python 检测到关机指令，Python 会直接发送指令控制机器关机。\n\n这里所谓的“需求分析”是指功能性需求分析，即明确项目需要实现哪些功能。其次，这不是一份完整的需求分析文档，而是实际开发过程中的草稿需求分析。这一步非常必要，建议掌握。关于完整的需求分析文档，可以在搜索引擎上搜索相应的模板进行参考和编写。如果不是商业软件开发，编写完整的需求分析文档并非必要步骤。\n\
    \n以下是对项目的简要需求分析：\n\n1.  通过 Python 代码控制本地计算机关机。\n2.  通过 Python 登录邮箱（当然，也可以选择其他远程控制通道）。\n\
    3.  通过 Python 监控并读取指定邮箱的邮件内容。\n4.  通过 Python 实现发送邮件的功能。\n5.  核心业务逻辑处理部分（例如如何监控、如何判断何时关机或重启等）。\n\
    \n理解上述功能需求后，即可逐步编写相应代码。\n\n## 简单代码的实现\n\n如前所述，要远程重启或关机，Python 首先必须能在本地控制计算机重启或关机。以下是该功能的实现。首先，仅让\
    \ Python 控制本地计算机重启或关机。此次开发也称为第一次开发，可作为小软件开发过程中第一个版本的简单程序。\n\n如果想控制本地计算机重启或关机，可以使用\
    \ `os.system()` 方法并传入相关的 Shell 指令。可以通过 Shell 命令 `shutdown` 控制计算机关机，也可以通过 Shell\
    \ 命令 `shutdown -r` 控制计算机重启。\n\n以下是 Python 代码：\n\n```python\nimport os\n\n# shutdown\
    \ the system\nos.system(\"shutdown -s -t 1\")\n```\n\n执行上述代码后，计算机将自动关机。如果想用 Python\
    \ 代码控制本地计算机重启，可以通过以下 Python 代码实现：\n\n```python\nimport os\n\n# restart the system\n\
    os.system(\"shutdown -r -t 1\")\n```\n\n执行上述代码后，计算机将自动重启。因此，简单版本的代码如下：\n\n```python\n\
    import os\n\nresult = input(\"Please enter what you want to do: shutdown input\
    \ 1, restart input 2\")\n# Note 1 enclosed in double quotation marks. Because\
    \ the input is a string instead of the number\nif result == \"1\":\n    # shut\
    \ down\n    os.system(\"shutdown -s -t 1\")\n    print(\"shutdown instruction\
    \ is ready\")\nelif result == \"2\":\n    # Restart\n    os.system(\"shutdown\
    \ -r -t 1\")\n    print(\"restart instruction is ready\")\nelse:\n    print(\"\
    no operation performed\")\n```\n\n执行上述程序后，我们将被提示输入所需操作，如下所示：\n\n```text\nPlease\
    \ enter the operation you wish to perform: shutdown input 1, restart input 2\n\
    ```\n\n如果我们想关机，可以输入 `1` 并按回车。如果想重启，可以输入 `2` 并按回车。如果输入其他信息并按回车，则不执行任何操作。例如，输入 `3`\
    \ 并按回车键将输出以下信息：\n\n```text\nPlease enter what you want to do: shut down input\
    \ 1, restart input 2\n```\n\n如果输入 `2` 并按回车，将执行重启命令，如下所示：\n\n```text\nPlease enter\
    \ the operation you wish to perform: shutdown input 1 and restart input 2\n2.\
    \ The restart command was executed successfully.\n```\n\n随后，计算机将在一分钟内自动关机并重启。同样，如果执行上述代码后，输入\
    \ `1` 并按回车键，将执行关机操作。至此，已实现如何通过 Python 代码控制本地计算机的重启和关机。这是小目标软件的第一个版本，即简单版本。尚未达到最终目标，因此需要进一步开发。\n\
    \n## 开发过程中的调试\n\n有时，编写软件时会出现某些错误和问题。尝试解决这些问题的过程称为调试。开发本项目时，我们也会遇到各种问题。这没关系。我们只需要找出问题所在，并改进相应的程序即可。\n\
    \n调试通常在项目开发过程中进行，很难一次性完美开发出程序。例如，在编写读取邮件阶段的程序时，如果操作等待时间过长，经常会遇到无法连接的错误。此时，可以通过重新执行登录代码来解决问题。这个过程就是一个调试过程。\n\
    \n同样，遇到其他问题时，应尽量先定位问题，然后对照上述流程，仔细观察问题出在哪个地方或细节。如果仍想不通，可以将错误提示放入搜索引擎查找，看能否解决。总之，遇到问题时，独立思考并尝试独立解决这些问题，能让你的编程能力更强。\n\
    \n## 程序打包的概念\n\n将编写的程序代码转变为可直接执行的软件的过程称为程序打包。例如，现在编写的脚本只能在 Python 编辑器中运行。打包成软件后，无需\
    \ Python 编辑器支持，即可直接在操作系统中运行。\n\n## Python 程序打包的方法\n\n读者可以使用一些工具将 Python 程序打包成可执行的应用软件。在\
    \ Python 中，常用的打包工具包括 `py2exe`、`PyInstaller` 等。这些工具不需要完全掌握，大家可以选择一个认为合适的工具。本书将介绍如何通过\
    \ `PyInstaller` 打包 Python 程序。\n\n要使用 `PyInstaller`，首先需要安装它。这里可以直接使用 `pip` 安装 `PyInstaller`。首先，打开\
    \ `cmd` 命令行界面，然后输入指令。通过 `pip install pyinstaller` 指令安装 `PyInstaller`，只需等待安装完成。安装完成后，会出现安装成功的提示信息。此外，读者可以在\
    \ Python 安装目录下的 `Scripts` 目录中看到安装的工具文件 `pyinstaller.exe`。\n\n接下来，可以使用 `PyInstaller`\
    \ 工具将 Python 程序打包成应用软件。例如，本项目完整程序的路径是 `D:/sample/project.py`，我电脑的 Python 安装目录是\
    \ `D:/Python`。因此，可以通过以下 `cmd` 指令打包本项目的 Python 程序：\n\n```cmd\nD:\\> D:\\Python\\\
    Scripts\\pyinstaller.exe D:\\sample\\project.py\n```\n\n成功打包的可执行程序可以在 `D:/dist`\
    \ 目录中找到。`sample` 文件夹是刚才打包生成的与 `project.py` 程序相关的软件文件夹。\n\n扩展名为 `.exe` 的文件是打包后生成的可执行文件。双击该文件即可直接运行。此时，只要向指定邮箱发送“关机”或“重启”指令，仅通过打开程序即可远程控制当前计算机重启或关机。\n\
    \n可以看到，目前打包的程序需要依赖许多文件。由于依赖文件过多，将打包后的程序迁移到其他计算机运行非常不方便。实际上，也可以将所有依赖文件打包进一个 `.exe`\
    \ 文件中；打包时只需添加 `-F` 参数即可。同时，打开软件后会出现一个 `cmd` 界面。在某些情况下，你不希望软件有这个 `cmd` 界面，打包时也可以通过\
    \ `-w` 参数直接屏蔽它，这样在某些情况下会美观得多。\n\n接下来，我将展示如何将所有依赖文件打包成一个没有 `cmd` 界面的 `.exe` 文件。打包的\
    \ `cmd` 指令如下：\n\n```cmd\nD:\\> D:\\Python\\Scripts\\pyinstaller.exe -F -w D:\\\
    sample\\project.py\n```\n\n打包后，将在 `D:/dist` 目录中生成一个单独的 `.exe` 文件。读者可直接将该文件迁移到其他计算机。即使其他计算机没有良好的\
    \ Python 开发环境，双击 `.exe` 文件也可执行（但最好关闭杀毒软件，以避免误杀干扰）。\n\n此外，由于打包时添加了 `-w` 参数，运行软件时不会显示\
    \ `cmd` 界面，因为 `cmd` 界面已被 `-w` 参数屏蔽。如果想显示 `cmd` 界面，打包时不要添加 `-w` 参数。\n\n运行软件可实现通过电子邮件远程控制计算机关机或重启的功能。至此，我们完成了\
    \ Python 项目制作的简要介绍。在下一章中，我们将进一步讨论这个实战项目。请跟随操作！\n\n"
