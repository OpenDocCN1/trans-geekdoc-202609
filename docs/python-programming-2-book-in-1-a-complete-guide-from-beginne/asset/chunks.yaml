- raw: 'Chapter 10: Planning and design a project in Python ![Binario, Uno, Cyborg,
    Cibernetica, Bordo, Tecnologia](rsrc3CR.jpg)In the previous chapter, we have learned
    about basic programming structures. This chapter will help you know how to start
    creating a project with an example. This chapter and the next chapter are practical
    experimentation with a sample project to increase your Python skills. Follow along!
    Know the purpose of your project Before developing the project, first introduce
    the purpose of the project, so that everyone will focus on it when studying. The
    development objectives of this project are as follows: (1) Write a project to
    remotely control the computer to do a remote shutdown or restart. (2) Review the
    basic knowledge of Python that you have learned before. (3) Master the general
    process of project development. When receiving a software project, one should
    not blindly do it immediately but should do it step by step according to the process
    of project development.  Project making procedure Developing a project from scratch
    is a complex procedure and is often achieved only when certain procedures are
    followed. A lot of experienced programmers use the following blueprint we are
    going to use now to develop Python projects. The process is mainly as follows.
    (1) Demand analysis. (2) Design. (3) Writing. (4) Testing. (5) Use. (6) Maintenance.
    If you don''t know these steps, get a project and do it according to your feelings.
    Large projects will inevitably be done in a chaotic way, which will eventually
    affect the efficiency of project development and the ultimate benefits. When developing
    a project, the development steps are very important. Everyone should start from
    small projects and form good and standard habits. ￼ Concept of Demand Analysis
    Requirement analysis is a detailed analysis of the functions to be required by
    a project. For example, the purpose, scope, definition, and function of a project
    are analyzed, in other words, the requirements of the project are positioned.
    Application Examples of Requirement Analysis for this Project This project is
    to make a Python small software that can remotely control restart or shutdown
    functions of a computer. The programming idea is as follows. First, you need to
    know how to control the restart and shutdown of the computer locally through Python,
    and then you need to know how to send messages to Python programs remotely. Here,
    Python''s standard library can be used to control the restart or shutdown of the
    local computer. To achieve remote control, e-mail can be used as a remote-control
    channel. For example, Python can automatically log into the mailbox to detect
    mail. When sending a shutdown command to this mailbox, if Python detects a shutdown
    command, Python directly sends a command to control the shutdown of the machine.
    The so-called "requirement analysis" here refers to functional requirement analysis,
    that is, clarifying which functions the project needs to realize. Secondly, this
    is not a complete requirement analysis document, but a draft requirement analysis
    during actual development. This step is very necessary and it is recommended to
    master it. For a complete requirement analysis document, you can search the corresponding
    template on the search engine for reference and compilation. If it is not commercial
    software development, writing a complete requirement analysis document is not
    a necessary step. The following is a brief demand analysis of the project: (1)
    Control the shutdown of the local computer through Python code. (2) Log into the
    mailbox through Python (of course, other remote-control channels can also be selected).
    (3) Monitor and read the mail content of the designated mailbox through Python.
    (4) Realize the function of mail sending through Python. (5) The core business
    logic processing part (such as how to monitor, if judge when to shut down or restart,
    etc.). After understanding the above functional requirements, the corresponding
    code can be written step by step. ￼ Implementation of Simple Code As mentioned
    above, to restart or shut down the computer remotely, Python must first control
    the computer to restart or shut down locally. The following is the realization
    of this function. For the first time, only Python can control the computer to
    restart or shut down locally. This development is also called the first development
    and can be used as the first version of the simple program in the development
    process of small software. If you want to control the local computer to restart
    or shut down, you can use the os.system () method and pass in relevant Shell instructions.
    You can control the computer to shut down through a Shell command shutdown, and
    you can also control the computer to restart through a Shell command '' -r''.
    Here is the Python code: import os ￼# shutdown the system os.system{ Enter the
    parameters here} After executing the above code, the computer will automatically
    shut down. If you want to use Python code to control the restart of your local
    computer, you can do this by following Python code: import os \# restart the system
    os.r( Enter the parameters here) After executing the above code, the computer
    will restart automatically. Therefore, the simple version of the code is as follows:
    {Use import functions here} ("Please enter what you want to do: shutdown input
    1, restart input 2") \# Note 1 enclosed in double quotation marks.  Because the
    input is a string instead of the number if (result = = "1"): \# shut down { Get
    the parameters here} print ("shutdown instruction is ready") elif (result = =
    "2"): \# Restart os.system { Get the parameters here} print ("restart instruction
    is ready") else: print ("no operation performed") After executing the above program,
    we will be prompted to enter the desired operation, as follows: Please enter the
    operation you wish to perform: shutdown input 1, restart input 2 If we want to
    shut down, we can enter 1 and press enter. If you want to restart, you can enter
    2 and press Enter. If you enter additional information and press enter, nothing
    will be done. For example, entering 3 and pressing enter key will output the following
    information: Please enter what you want to do: shut down input 1, restart input
    2 If you enter 2 and press Enter, the restart command will be executed as follows:
    Please enter the operation you wish to perform: shutdown input 1 and restart input
    22. The restart command was executed successfully. Subsequently, the computer
    will be shut down and restarted automatically within one minute. Similarly, if
    after executing the above code, enter 1 and press enter key, the shutdown operation
    will be executed. Here, how to control the restart and shutdown of the local computer
    through Python code is realized. This is the first version of the small target
    software, i.e. the simple version. The final target has not been reached, so further
    development is needed. ￼ Debugging during Development Sometimes, when writing
    software, there will be certain errors and problems. The process of trying to
    solve these problems is called debugging. When we develop this project, we will
    also encounter various problems. It doesn''t matter. We just need to find out
    where the problem is and improve the corresponding procedures. Debugging is often
    carried out during project development, and it is difficult to develop the program
    perfectly at one time. For example, when you write a program in the mail reading
    phase if the waiting time for the operation is too long, you will often encounter
    some errors that cannot be connected. At this time, you can solve the problem
    by re-executing the login code. This process is a debugging process.  Similarly,
    when you encounter other problems, you should try your best to locate the problem
    first, and then compare with the above procedures, carefully observe which place
    or details the problem is. If you still can''t think out, you can put the error
    prompt into the search engine to find out and see if it can be solved. In short,
    when you encounter problems, think independently and try to solve these problems
    independently can make your programming ability stronger. ￼ Concept of Program
    Packaging The process of turning the written program code into software that can
    be directly executed is called program packaging. For example, scripts written
    now can only be run in the Python editor. After they are packaged into software,
    they can be run directly in the operating system without the support of the Python
    editor. Method of Packaging Python Programs Readers can use some tools to package
    Python programs into executable application software. In Python, tools commonly
    used for packaging include py2exe, Pyinstaller, etc. These tools do not need to
    be mastered completely, so everyone can choose a tool that they think is suitable.
    This book will introduce how to package Python programs through Pyinstaller.To
    use Pyinstaller, you need to install it first. Here, you can install Pyinstaller
    directly using pip. First, open the cmd command-line interface, and then enter
    the instructions. The Pyinstaller is installed through the "pip install pyinstaller"
    instruction and only needs to wait for the installation to be completed. After
    the installation is completed, the installation success prompt message will appear.
    In addition, readers can see the installed tool file pyinstaller.exe in the Scripts
    directory under the Python installation directory. ￼Next, you can use the Pyinstaller
    tool to package Python programs into application software. For example, the path
    of the complete program of this project is "D:/ sample/project.py" and the Python
    installation directory of my computer is "D:/Python". Therefore, the Python program
    of this project can be packaged through the following cmd instructions: D: \\
    > d: \\ python\\ scripts \\installer d: \\sample\\ project.py ￼The successfully
    packaged executable program can be found in the D:/dist directory. The sample
    folder is the software folder related to the project.py program that has just
    been packaged and generated. ￼The file with the ".exe" extension is the executable
    file generated after packaging. Double-click the file to run directly. At this
    time, the current computer can be remotely controlled to restart or shut down
    only by opening the program, so long as the "shutdown" or "restart" instruction
    is sent to the designated mailbox. As can be seen, the currently packaged program
    needs to rely on many files. Because there are too many dependent files, it is
    very inconvenient to migrate packaged programs to other computers to run. In fact,
    it is also possible to package all the dependent files into an. exe file, just
    add the -F parameter when packaging. At the same time, a cmd interface will appear
    after the software is opened. In some cases, you don''t want the software to have
    this cmd interface, but you can also directly shield it through the -w parameter
    when packaging, which will be much more beautiful in some cases. Next, I will
    show you how to package all the dependent files into a .exe file without the cmd
    interface. The packaged cmd instructions are as follows: After packaging, a separate.
    exe file will be generated in the D:/dist directory. Readers can directly migrate
    the file to other computers. Even if other computers do not have a good Python
    development environment, double-click the. exe file to execute it (but it is better
    to close the antivirus software to avoid interference from accidental killing).
    In addition, since the -w parameter is added during packaging, the cmd interface
    will not be displayed when running the software, because the cmd interface has
    been shielded by the -w parameter. If you want to display a cmd interface, do
    not add -w parameter when packing. Running the software can realize the function
    of remotely controlling the computer to shut down or restart through e-mail. With
    this, we have completed a brief introduction to Python project creation. In the
    next chapter, we will further discuss this practical project. Follow along! '
