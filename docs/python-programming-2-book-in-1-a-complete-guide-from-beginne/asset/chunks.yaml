- raw: 'Chapter 12: Object oriented programming in Python There are various forms
    of things in the real world, and there are various connections between these things.
    In a program, objects are used to map real things and the relationships between
    objects are used to describe the relationships between things. This idea is the
    object-oriented paradigm. When we talk about object-oriented programming, we naturally
    think of process-oriented programming. Process-oriented programming is to analyze
    the steps to solve the problem, and then use functions to implement these steps
    one by one when using different methods. Object-oriented programming is to decompose
    the problem-solving entities into multiple objects, and the purpose of establishing
    objects is not to complete one by one but to describe the behavior of things in
    the process of solving the whole problem. The following is an example of gobang
    to illustrate the difference between process-oriented and object-oriented programming.
    First, use the process-oriented paradigm: 1\. Start the game 2\. Player 1 plays
    first 3\. Draw the picture 4\. Judges the result 5\. Player 2 turn 6\. Draw the
    picture 7\. Judges the result 8\. Return to Step 2 9\. Output Final Results The
    above steps are implemented by functions respectively, and the problem is solved
    using a process-oriented paradigm. Object-oriented design solves the problem from
    another way of thinking. When using object-oriented thinking to realize gobang,
    the whole gobang game can be divided into three types of objects, as follows.
    1\. Black and White Parties: This represents the two players 2\. Chessboard system:
    This is responsible for drawing pictures 3\. Rule system: This is responsible
    for judging things such as foul, winning or losing, etc. Among the above three-class
    objects, the first-class object (black and white parties) is responsible for receiving
    the user''s input and notifying the second-class object (chessboard system) to
    draw pieces on the chessboard, while the third-class object (rule system) judges
    the chessboard. Object-oriented programming ensures the unity of functions, thus
    making the code easier to maintain. For example, if we want to add the function
    of chess now in a process-oriented paradigm, then a series of steps of input,
    judgment, and display needs to be changed. Even the loops between steps need to
    be adjusted on a large scale, which is very troublesome. If object-oriented development
    is used, only the chessboard object needs to be changed. The chessboard object
    saves the chessboard scores of both black and white parties, and only needs simple
    backtracking, without changing the display and rules. At the same time, the calling
    sequence of the whole object function will not change, and its changes are only
    partial. Thus, compared with process-oriented, object-oriented programming is
    more convenient for later code maintenance and function expansion. Classes and
    objects In object-oriented programming, the two most important core concepts are
    class and object. Objects are concrete things in real life. They can be seen and
    touched. For example, the book you are holding is an object. Compared with objects,
    classes are abstract, which is a general designation for a group of things with
    the same characteristics and behaviors. For example, when I was a child, my mother
    said to me, "Son, you should take that kind of person as an example!" The type
    of people here refers to a group of people who have excellent academic results
    and who are polite. They have the same characteristics, so they are called "same
    type" people. Relationship between Class and Object As the saying goes, "people
    are grouped by category, and things are grouped by group," we collectively refer
    to the collection of things with similar characteristics and behaviors as categories,
    such as animals, airplanes, etc. For example, the toy model can be regarded as
    a class and each toy as an object, thus the relationship between the toy model
    and the toy can be regarded as the relationship between the class and the object.
    Class is used to describe the common features of multiple objects and is a template
    for objects. An object is used to describe individuals in reality. It is an instance
    of a class. As can be seen, objects are created according to classes, and one
    class can correspond to multiple objects. Definition of Class In daily life, to
    describe a kind of category, it is necessary to explain its characteristics as
    well as its uses. For example, when describing such entities as human beings,
    it is usually necessary to give a definition or name to such things. Human characteristics
    include height, weight, sex, occupation, etc. Human behaviors include running,
    speaking, etc. The combination of human characteristics and behaviors can completely
    describe human beings. The design idea of an object-oriented program is based
    on this design, which includes the features and behaviors of things in classes.
    Among them, the characteristics of things are taken as the attributes of classes,
    the behaviors of things are taken as the methods of classes, and objects are an
    instance of classes. So to create an object, you need to define a class first.
    The class is composed of 3 parts. (1) Class Name: The name of the class, whose
    initial letter must be uppercase, such as Person. (2) Attribute: used to describe
    the characteristics of things, for example, people have the characteristics of
    name, age, etc. (3) Method: Used to describe the behavior of things, for example,
    people have behaviors such as talking and smiling. In Python, you can use the
    class keyword to declare a class with the following basic syntax format: Class
    {Enter the entity here}: \# This is property of a class \# Method of class The
    following is a sample code: class Vehicle: \# attribute \# Method def drive(self):
    Print ("-drivinf Automobile--") In the above example, the class is used to define
    a class named Vehicle, in which there is a drive method. As can be seen from the
    example, the format of the method is the same as that of the function. The main
    difference is that the method must explicitly declare a self-parameter and be
    located at the beginning of the parameter list. Self represents the instance of
    the class (object) itself, which can be used to refer to the attributes and methods
    of the object. The specific usage of self will be introduced later with practical
    application. Creating Objects from Classes If a program wants to complete specific
    functions, classes alone are not enough but also instance objects need to be created
    according to classes. In Python programs, you can use the following syntax to
    create an object: Object {Enter the entity name here } = Class { Enter the name
    here} () For example, create an object Vehicle of driving class with the following
    sample code: vehicle = driving() In the above code, vehicle is a variable that
    can be used to access the properties and methods of the class. To add attributes
    to an object, you can use the following syntax. Object {Enter entity here}. New
    {Enter attribute name} = Value For example, use vehicle to add the color attribute
    to an object of driving class. The sample code is as follows: vehicle.color =
    "black" Next, a complete case is used to demonstrate how to create objects, add
    attributes and call methods. Look at it and clear all your doubts. Example Sport.py
    \# Define Class class Football: \# kick def kick(goal): print ("You scored ..."
    ) \# Foul def foul(self): print ("You cheated" ) \# creates an object and saves
    its reference with the variable BMW Barcelona = Football() \# Add Attribute Representing
    Color Barcelona.color = "blue" \# Call Method Barcelona.goal() Barcelona.foul()
    \# Access Attributes print(Barcelona.color) In Example, a Football class is defined,
    two methods kick and foul is defined in the class, then an object Barcelona of
    football class is created, color attribute is dynamically added and assigned to
    "blue", then goal () and foul () methods are called in turn, and the value of
    color attribute is printed out. Structural Methods and Destructural Methods In
    Python programs, two special methods are provided: \_\_init\_\_ () and \_\_del\_\_
    (), which are respectively used to initialize the properties of the object and
    release the resources occupied by the class. This section mainly introduces these
    two methods in detail. Construction method In the previous example defining classes,
    we dynamically added the color attribute to the objects referenced by Barcelona.
    Just imagine, if you create another Football class object, you need to add attributes
    in the form of "object name. attribute name". For each object created, you need
    to add attributes once, which is very troublesome. To solve this problem, attributes
    can be set when creating an object. Python provides a construction method with
    a fixed name of \_\_init\_\_ (two underscores begin and two underscores end).
    When creating an instance of a class, the system will automatically call the constructor
    to initialize the class. To make everyone better understand, the following is
    a case to demonstrate how to use the construction method for initialization. Example:
    uses the construction method. py \# Define Class class Football: \# construction
    method def \_\_init\_\_(kick): Color = "blue" \# Foul def foul(self): print ("%s
    Barcelona color is " (self.color)) \# creates an object and saves its reference
    with the variable car football = Football() football.foul() In the example, lines
    4-5 re-implemented the \_\_init\_\_ () method, adding the color attribute to the
    Football class and assigning it a value of "blue", and accessing the value of
    the color attribute in the foul method. No matter how many Football objects are
    created, the initial value of the color attribute is "blue" by default. If you
    want to modify the default value of the property after the object is created,
    you can set the value of the property by passing parameters in the construction
    method. The following is a case to demonstrate how to use the construction method
    with parameters. Example: uses the parametric construction method. py \# Define
    Class class Football: \# construction method def \_\_init\_\_(kick): Color = "blue"
    \# Foul def foul(self): print ("%s Barcelona color is " (self.color)) \# creates
    an object and saves its reference with the variable car football = Football()
    football.foul() \# creates an object and saves its reference with the variable
    bmw realmadrid = color ("white") realmadrid.color() In Example, lines 4 to 5 customize
    the construction method with parameters, and assign the value of the parameters
    to the color attribute, ensuring that the value of the color attribute changes
    with the value received by the parameters, and then still access the value of
    the color attribute in the toot method. Destructor Methods Earlier, we introduced
    the \_\_init\_\_ () method. When an object is created, the Python interpreter
    will call the \_\_init\_\_ () method by default. When deleting an object to release
    the resources occupied by the class, the Python interpreter calls another method
    by default, which is the \_\_del\_\_ () method. Next, a case is used to demonstrate
    how to use a destructor to release the occupied resources. example: using destructor.
    py \# Define Class class Football def \_\_init\_\_(team, color, name): team.name
    = name team.color = color def \_\_del\_\_(team): print("--------del--------")
    Realmadrid = team ("white", 1) In Example, a class named Person is defined, the
    initial values of color and team are set in the \_\_init\_\_ () method, a print
    statement is added in the \_\_del\_\_ () method, and then an object of the Person
    class is created using a custom construction method. When the program ends, the
    memory space it occupies will be released. So, can we release the space manually?
    Yes, Del statement can be used to delete an object and release the resources it
    occupies. Add the following code at the end of Example: del realmadrid print("---------1---------")
    ￼As you can observe from the results, the program outputs "del" before "1". This
    is because Python has an automatic garbage collection mechanism. When the Python
    program ends, the Python interpreter detects whether there is currently any memory
    space to be freed. If there is a del statement, it will be automatically deleted;
    if the del statement has been manually called, it will not be automatically deleted.
    With this, we have given a thorough introduction to object-oriented programming
    in python. In the next chapter, we will talk about control flow statements in
    brief. Let us go! '
  fmt: "\n# Chapter 12: Object oriented programming in Python\n\nThere are various\
    \ forms of things in the real world, and there are various connections between\
    \ these things. In a program, objects are used to map real things and the relationships\
    \ between objects are used to describe the relationships between things. This\
    \ idea is the object-oriented paradigm.\n\nWhen we talk about object-oriented\
    \ programming, we naturally think of process-oriented programming. Process-oriented\
    \ programming is to analyze the steps to solve the problem, and then use functions\
    \ to implement these steps one by one when using different methods. Object-oriented\
    \ programming is to decompose the problem-solving entities into multiple objects,\
    \ and the purpose of establishing objects is not to complete one by one but to\
    \ describe the behavior of things in the process of solving the whole problem.\n\
    \nThe following is an example of gobang to illustrate the difference between process-oriented\
    \ and object-oriented programming.\n\nFirst, use the process-oriented paradigm:\n\
    \n1. Start the game\n2. Player 1 plays first\n3. Draw the picture\n4. Judges the\
    \ result\n5. Player 2 turn\n6. Draw the picture\n7. Judges the result\n8. Return\
    \ to Step 2\n9. Output Final Results\n\nThe above steps are implemented by functions\
    \ respectively, and the problem is solved using a process-oriented paradigm.\n\
    \nObject-oriented design solves the problem from another way of thinking. When\
    \ using object-oriented thinking to realize gobang, the whole gobang game can\
    \ be divided into three types of objects, as follows.\n\n1. Black and White Parties:\
    \ This represents the two players\n2. Chessboard system: This is responsible for\
    \ drawing pictures\n3. Rule system: This is responsible for judging things such\
    \ as foul, winning or losing, etc.\n\nAmong the above three-class objects, the\
    \ first-class object (black and white parties) is responsible for receiving the\
    \ user's input and notifying the second-class object (chessboard system) to draw\
    \ pieces on the chessboard, while the third-class object (rule system) judges\
    \ the chessboard.\n\nObject-oriented programming ensures the unity of functions,\
    \ thus making the code easier to maintain. For example, if we want to add the\
    \ function of chess now in a process-oriented paradigm, then a series of steps\
    \ of input, judgment, and display needs to be changed. Even the loops between\
    \ steps need to be adjusted on a large scale, which is very troublesome. If object-oriented\
    \ development is used, only the chessboard object needs to be changed. The chessboard\
    \ object saves the chessboard scores of both black and white parties, and only\
    \ needs simple backtracking, without changing the display and rules. At the same\
    \ time, the calling sequence of the whole object function will not change, and\
    \ its changes are only partial. Thus, compared with process-oriented, object-oriented\
    \ programming is more convenient for later code maintenance and function expansion.\n\
    \n## Classes and objects\n\nIn object-oriented programming, the two most important\
    \ core concepts are class and object. Objects are concrete things in real life.\
    \ They can be seen and touched. For example, the book you are holding is an object.\
    \ Compared with objects, classes are abstract, which is a general designation\
    \ for a group of things with the same characteristics and behaviors. For example,\
    \ when I was a child, my mother said to me, \"Son, you should take that kind of\
    \ person as an example!\" The type of people here refers to a group of people\
    \ who have excellent academic results and who are polite. They have the same characteristics,\
    \ so they are called \"same type\" people.\n\n### Relationship between Class and\
    \ Object\n\nAs the saying goes, \"people are grouped by category, and things are\
    \ grouped by group,\" we collectively refer to the collection of things with similar\
    \ characteristics and behaviors as categories, such as animals, airplanes, etc.\
    \ For example, the toy model can be regarded as a class and each toy as an object,\
    \ thus the relationship between the toy model and the toy can be regarded as the\
    \ relationship between the class and the object.\n\nClass is used to describe\
    \ the common features of multiple objects and is a template for objects. An object\
    \ is used to describe individuals in reality. It is an instance of a class. As\
    \ can be seen, objects are created according to classes, and one class can correspond\
    \ to multiple objects.\n\n### Definition of Class\n\nIn daily life, to describe\
    \ a kind of category, it is necessary to explain its characteristics as well as\
    \ its uses. For example, when describing such entities as human beings, it is\
    \ usually necessary to give a definition or name to such things. Human characteristics\
    \ include height, weight, sex, occupation, etc. Human behaviors include running,\
    \ speaking, etc. The combination of human characteristics and behaviors can completely\
    \ describe human beings.\n\nThe design idea of an object-oriented program is based\
    \ on this design, which includes the features and behaviors of things in classes.\
    \ Among them, the characteristics of things are taken as the attributes of classes,\
    \ the behaviors of things are taken as the methods of classes, and objects are\
    \ an instance of classes. So to create an object, you need to define a class first.\n\
    \nThe class is composed of 3 parts.\n\n1. **Class Name**: The name of the class,\
    \ whose initial letter must be uppercase, such as `Person`.\n2. **Attribute**:\
    \ used to describe the characteristics of things, for example, people have the\
    \ characteristics of name, age, etc.\n3. **Method**: Used to describe the behavior\
    \ of things, for example, people have behaviors such as talking and smiling.\n\
    \nIn Python, you can use the `class` keyword to declare a class with the following\
    \ basic syntax format:\n\n```\nClass {Enter the entity here}:\n    # This is property\
    \ of a class\n    # Method of class\n```\n\nThe following is a sample code:\n\n\
    ```\nclass Vehicle:\n    # attribute\n    # Method\n    def drive(self):\n   \
    \     Print (\"-drivinf Automobile--\")\n```\n\nIn the above example, the `class`\
    \ is used to define a class named `Vehicle`, in which there is a `drive` method.\
    \ As can be seen from the example, the format of the method is the same as that\
    \ of the function. The main difference is that the method must explicitly declare\
    \ a `self` parameter and be located at the beginning of the parameter list. `Self`\
    \ represents the instance of the class (object) itself, which can be used to refer\
    \ to the attributes and methods of the object. The specific usage of `self` will\
    \ be introduced later with practical application.\n\n### Creating Objects from\
    \ Classes\n\nIf a program wants to complete specific functions, classes alone\
    \ are not enough but also instance objects need to be created according to classes.\
    \ In Python programs, you can use the following syntax to create an object:\n\n\
    ```\nObject {Enter the entity name here } = Class { Enter the name here} ()\n\
    ```\n\nFor example, create an object `Vehicle` of driving class with the following\
    \ sample code:\n\n```\nvehicle = driving()\n```\n\nIn the above code, `vehicle`\
    \ is a variable that can be used to access the properties and methods of the class.\
    \ To add attributes to an object, you can use the following syntax.\n\n```\nObject\
    \ {Enter entity here}. New {Enter attribute name} = Value\n```\n\nFor example,\
    \ use `vehicle` to add the color attribute to an object of driving class. The\
    \ sample code is as follows:\n\n```\nvehicle.color = \"black\"\n```\n\nNext, a\
    \ complete case is used to demonstrate how to create objects, add attributes and\
    \ call methods. Look at it and clear all your doubts.\n\n**Example Sport.py**\n\
    \n```\n# Define Class\nclass Football:\n    # kick\n    def kick(goal):\n    \
    \    print (\"You scored ...\" )\n    # Foul\n    def foul(self):\n        print\
    \ (\"You cheated\" )\n\n# creates an object and saves its reference with the variable\
    \ BMW\nBarcelona = Football()\n\n# Add Attribute Representing Color\nBarcelona.color\
    \ = \"blue\"\n\n# Call Method\nBarcelona.goal()\nBarcelona.foul()\n\n# Access\
    \ Attributes\nprint(Barcelona.color)\n```\n\nIn Example, a `Football` class is\
    \ defined, two methods `kick` and `foul` is defined in the class, then an object\
    \ `Barcelona` of football class is created, color attribute is dynamically added\
    \ and assigned to \"blue\", then `goal()` and `foul()` methods are called in turn,\
    \ and the value of color attribute is printed out.\n\n## Structural Methods and\
    \ Destructural Methods\n\nIn Python programs, two special methods are provided:\
    \ `__init__()` and `__del__()`, which are respectively used to initialize the\
    \ properties of the object and release the resources occupied by the class. This\
    \ section mainly introduces these two methods in detail.\n\n### Construction method\n\
    \nIn the previous example defining classes, we dynamically added the color attribute\
    \ to the objects referenced by `Barcelona`. Just imagine, if you create another\
    \ `Football` class object, you need to add attributes in the form of \"object\
    \ name. attribute name\". For each object created, you need to add attributes\
    \ once, which is very troublesome.\n\nTo solve this problem, attributes can be\
    \ set when creating an object. Python provides a construction method with a fixed\
    \ name of `__init__` (two underscores begin and two underscores end). When creating\
    \ an instance of a class, the system will automatically call the constructor to\
    \ initialize the class.\n\nTo make everyone better understand, the following is\
    \ a case to demonstrate how to use the construction method for initialization.\n\
    \n**Example: uses the construction method. py**\n\n```\n# Define Class\nclass\
    \ Football:\n    # construction method\n    def __init__(kick):\n        Color\
    \ = \"blue\"\n    # Foul\n    def foul(self):\n        print (\"%s Barcelona color\
    \ is \" (self.color))\n\n# creates an object and saves its reference with the\
    \ variable car\nfootball = Football()\nfootball.foul()\n```\n\nIn the example,\
    \ lines 4-5 re-implemented the `__init__()` method, adding the color attribute\
    \ to the `Football` class and assigning it a value of \"blue\", and accessing\
    \ the value of the color attribute in the `foul` method. No matter how many `Football`\
    \ objects are created, the initial value of the color attribute is \"blue\" by\
    \ default.\n\nIf you want to modify the default value of the property after the\
    \ object is created, you can set the value of the property by passing parameters\
    \ in the construction method. The following is a case to demonstrate how to use\
    \ the construction method with parameters.\n\n**Example: uses the parametric construction\
    \ method. py**\n\n```\n# Define Class\nclass Football:\n    # construction method\n\
    \    def __init__(kick):\n        Color = \"blue\"\n    # Foul\n    def foul(self):\n\
    \        print (\"%s Barcelona color is \" (self.color))\n\n# creates an object\
    \ and saves its reference with the variable car\nfootball = Football()\nfootball.foul()\n\
    \n# creates an object and saves its reference with the variable bmw\nrealmadrid\
    \ = color (\"white\")\nrealmadrid.color()\n```\n\nIn Example, lines 4 to 5 customize\
    \ the construction method with parameters, and assign the value of the parameters\
    \ to the color attribute, ensuring that the value of the color attribute changes\
    \ with the value received by the parameters, and then still access the value of\
    \ the color attribute in the toot method.\n\n### Destructor Methods\n\nEarlier,\
    \ we introduced the `__init__()` method. When an object is created, the Python\
    \ interpreter will call the `__init__()` method by default. When deleting an object\
    \ to release the resources occupied by the class, the Python interpreter calls\
    \ another method by default, which is the `__del__()` method.\n\nNext, a case\
    \ is used to demonstrate how to use a destructor to release the occupied resources.\n\
    \n**example: using destructor. py**\n\n```\n# Define Class\nclass Football\n \
    \   def __init__(team, color, name):\n        team.name = name\n        team.color\
    \ = color\n    def __del__(team):\n        print(\"--------del--------\")\n\n\
    Realmadrid = team (\"white\", 1)\n```\n\nIn Example, a class named `Person` is\
    \ defined, the initial values of color and team are set in the `__init__()` method,\
    \ a print statement is added in the `__del__()` method, and then an object of\
    \ the `Person` class is created using a custom construction method. When the program\
    \ ends, the memory space it occupies will be released.\n\nSo, can we release the\
    \ space manually? Yes, `Del` statement can be used to delete an object and release\
    \ the resources it occupies. Add the following code at the end of Example:\n\n\
    ```\ndel realmadrid\nprint(\"---------1---------\")\n```\n\nAs you can observe\
    \ from the results, the program outputs \"del\" before \"1\". This is because\
    \ Python has an automatic garbage collection mechanism. When the Python program\
    \ ends, the Python interpreter detects whether there is currently any memory space\
    \ to be freed. If there is a `del` statement, it will be automatically deleted;\
    \ if the `del` statement has been manually called, it will not be automatically\
    \ deleted.\n\nWith this, we have given a thorough introduction to object-oriented\
    \ programming in python. In the next chapter, we will talk about control flow\
    \ statements in brief. Let us go!\n"
  trans: "\n# 第 12 章：Python 面向对象编程\n\n现实世界中存在各种形式的事物，这些事物之间也存在各种联系。在程序中，使用对象来映射现实事物，利用对象之间的关系来描述事物之间的关系。这种思想就是面向对象范式。\n\
    \n当我们谈论面向对象编程时，自然会想到面向过程编程。面向过程编程是分析解决问题的步骤，然后在使用不同方法时，用函数逐一实现这些步骤。面向对象编程是将解决问题的实体分解为多个对象，建立对象的目的不是为了逐一完成，而是为了在解决整个问题的过程中描述事物的行为。\n\
    \n以下通过一个五子棋的例子来说明面向过程和面向对象编程的区别。\n\n首先，使用面向过程范式：\n\n1. 开始游戏\n2. 玩家 1 先行\n3. 绘制画面\n\
    4. 判断结果\n5. 玩家 2 回合\n6. 绘制画面\n7. 判断结果\n8. 返回步骤 2\n9. 输出最终结果\n\n上述步骤分别由函数实现，使用面向过程范式解决问题。\n\
    \n面向对象设计从另一种思维方式解决问题。当使用面向对象思维实现五子棋时，整个五子棋游戏可以分为三类对象，如下所示。\n\n1. 黑白双方：代表两名玩家\n\
    2. 棋盘系统：负责绘制画面\n3. 规则系统：负责判断犯规、胜负等事项\n\n在上述三类对象中，第一类对象（黑白双方）负责接收用户输入并通知第二类对象（棋盘系统）在棋盘上绘制棋子，而第三类对象（规则系统）对棋盘进行判断。\n\
    \n面向对象编程保证了功能的统一性，从而使代码更易于维护。例如，如果我们现在想在面向过程范式中添加悔棋功能，那么输入、判断、显示的一系列步骤都需要改动。甚至步骤之间的循环都需要大规模调整，非常麻烦。如果使用面向对象开发，只需修改棋盘对象即可。棋盘对象保存了黑白双方的棋谱，只需简单回溯，无需修改显示和规则。同时，整个对象函数的调用顺序不会改变，其变化仅是局部的。因此，与面向过程相比，面向对象编程更便于后期的代码维护和功能扩展。\n\
    \n## 类和对象\n\n在面向对象编程中，最重要的两个核心概念是类和对象。对象是现实生活中具体的事物，它们看得见、摸得着。例如，你手中的这本书就是一个对象。与对象相比，类是抽象的，它是对一群具有相同特征和行为事物的统称。例如，小时候母亲对我说：“儿子，你要以那种人为榜样！”这里的“那种人”指的是一群成绩优秀、有礼貌的人。他们具有相同的特征，所以被称为“同类”人。\n\
    \n### 类与对象的关系\n\n俗话说“物以类聚，人以群分”，我们将具有相似特征和行为的事物的集合统称为类，如动物、飞机等。例如，玩具模具可以看作是类，每个玩具看作是对象，因此玩具模具与玩具的关系可以看作是类与对象的关系。\n\
    \n类用于描述多个对象的共同特征，是对象的模板。对象用于描述现实中的个体，它是类的实例。由此可见，对象是根据类创建的，一个类可以对应多个对象。\n\n###\
    \ 类的定义\n\n在日常生活中，要描述一类事物，需要说明其特征以及用途。例如，描述人类这类实体时，通常需要给这类事物一个定义或名称。人的特征包括身高、体重、性别、职业等。人的行为包括跑步、说话等。人的特征与行为的结合可以完整地描述人类。\n\
    \n面向对象程序的设计思想基于此设计，在类中包含事物的特征和行为。其中，事物的特征作为类的属性，事物的行为作为类的方法，对象是类的实例。因此要创建对象，首先需要定义类。\n\
    \n类由 3 部分组成。\n\n1. **类名**：类的名称，首字母必须大写，例如 `Person`。\n2. **属性**：用于描述事物的特征，例如人具有姓名、年龄等特征。\n\
    3. **方法**：用于描述事物的行为，例如人具有说话、微笑等行为。\n\n在 Python 中，可以使用 `class` 关键字声明类，基本语法格式如下：\n\
    \n```\nclass {此处输入实体名称}:\n    # 这是类的属性\n    # 类的方法\n```\n\n以下是示例代码：\n\n```\nclass\
    \ Vehicle:\n    # attribute\n    # Method\n    def drive(self):\n        Print\
    \ (\"-drivinf Automobile--\")\n```\n\n在上例中，使用 `class` 定义了一个名为 `Vehicle` 的类，其中包含一个\
    \ `drive` 方法。从示例可以看出，方法的格式与函数相同。主要区别在于方法必须显式声明一个 `self` 参数，并位于参数列表的开头。`Self` 代表类的实例（对象）本身，可用于引用对象的属性和方法。`self`\
    \ 的具体用法将在后面结合实际应用介绍。\n\n### 从类创建对象\n\n如果程序要完成具体功能，光有类是不够的，还需要根据类创建实例对象。在 Python\
    \ 程序中，可以使用以下语法创建对象：\n\n```\n对象 {此处输入实体名称} = 类 {此处输入类名} ()\n```\n\n例如，创建驾驶类的对象\
    \ `Vehicle`，示例代码如下：\n\n```\nvehicle = driving()\n```\n\n在上述代码中，`vehicle` 是一个变量，可用于访问类的属性和方法。要给对象添加属性，可以使用以下语法。\n\
    \n```\n对象 {此处输入实体}. 新 {此处输入属性名} = 值\n```\n\n例如，使用 `vehicle` 为驾驶类的对象添加颜色属性。示例代码如下：\n\
    \n```\nvehicle.color = \"black\"\n```\n\n接下来，通过一个完整的案例演示如何创建对象、添加属性和调用方法。请仔细阅读，消除所有疑惑。\n\
    \n**示例 Sport.py**\n\n```\n# 定义类\nclass Football:\n    # 踢球\n    def kick(goal):\n\
    \        print (\"You scored ...\" )\n    # 犯规\n    def foul(self):\n        print\
    \ (\"You cheated\" )\n\n# 创建对象并用变量 Barcelona 保存其引用\nBarcelona = Football()\n\n\
    # 添加表示颜色的属性\nBarcelona.color = \"blue\"\n\n# 调用方法\nBarcelona.goal()\nBarcelona.foul()\n\
    \n# 访问属性\nprint(Barcelona.color)\n```\n\n在示例中，定义了一个 `Football` 类，在类中定义了两个方法 `kick`\
    \ 和 `foul`，然后创建了足球类的对象 `Barcelona`，动态添加 color 属性并赋值为 \"blue\"，然后依次调用 `goal()`\
    \ 和 `foul()` 方法，并打印出 color 属性的值。\n\n## 构造方法和析构方法\n\n在 Python 程序中，提供了两个特殊方法：`__init__()`\
    \ 和 `__del__()`，分别用于初始化对象的属性和释放类占用的资源。本节主要详细介绍这两个方法。\n\n### 构造方法\n\n在前面定义类的示例中，我们动态地为\
    \ `Barcelona` 引用的对象添加了颜色属性。试想，如果再创建一个 `Football` 类对象，需要以“对象名.属性名”的形式添加属性。每创建一个对象，就需要添加一次属性，非常麻烦。\n\
    \n为了解决这个问题，可以在创建对象时设置属性。Python 提供了一个名称固定为 `__init__`（两个下划线开头，两个下划线结尾）的构造方法。创建类的实例时，系统会自动调用构造方法来初始化类。\n\
    \n为了让大家更好地理解，以下通过案例演示如何使用构造方法进行初始化。\n\n**示例：使用构造方法.py**\n\n```\n# 定义类\nclass Football:\n\
    \    # 构造方法\n    def __init__(kick):\n        Color = \"blue\"\n    # 犯规\n   \
    \ def foul(self):\n        print (\"%s Barcelona color is \" (self.color))\n\n\
    # 创建对象并用变量 car 保存其引用\nfootball = Football()\nfootball.foul()\n```\n\n在示例中，第 4-5\
    \ 行重新实现了 `__init__()` 方法，为 `Football` 类添加了颜色属性并赋值为 \"blue\"，并在 `foul` 方法中访问颜色属性的值。无论创建多少个\
    \ `Football` 对象，颜色属性的初始值默认都是 \"blue\"。\n\n如果想在对象创建后修改属性的默认值，可以通过在构造方法中传递参数来设置属性值。以下案例演示如何使用带参数的构造方法。\n\
    \n**示例：使用带参数的构造方法.py**\n\n```\n# 定义类\nclass Football:\n    # 构造方法\n    def __init__(kick):\n\
    \        Color = \"blue\"\n    # 犯规\n    def foul(self):\n        print (\"%s\
    \ Barcelona color is \" (self.color))\n\n# 创建对象并用变量 car 保存其引用\nfootball = Football()\n\
    football.foul()\n\n# 创建对象并用变量 bmw 保存其引用\nrealmadrid = color (\"white\")\nrealmadrid.color()\n\
    ```\n\n在示例中，第 4 至 5 行自定义了带参数的构造方法，将参数的值赋给颜色属性，确保颜色属性的值随参数接收的值而变化，然后仍在 toot 方法中访问颜色属性的值。\n\
    \n### 析构方法\n\n前面介绍了 `__init__()` 方法。创建对象时，Python 解释器会默认调用 `__init__()` 方法。删除对象以释放类占用的资源时，Python\
    \ 解释器会默认调用另一个方法，即 `__del__()` 方法。\n\n接下来通过案例演示如何使用析构方法释放占用的资源。\n\n**示例：使用析构方法.py**\n\
    \n```\n# 定义类\nclass Football\n    def __init__(team, color, name):\n        team.name\
    \ = name\n        team.color = color\n    def __del__(team):\n        print(\"\
    --------del--------\")\n\nRealmadrid = team (\"white\", 1)\n```\n\n在示例中，定义了一个名为\
    \ `Person` 的类，在 `__init__()` 方法中设置颜色和队伍的初始值，在 `__del__()` 方法中添加打印语句，然后使用自定义构造方法创建\
    \ `Person` 类的对象。程序结束时，其占用的内存空间将被释放。\n\n那么，我们能手动释放空间吗？可以，使用 `Del` 语句删除对象并释放其占用的资源。在示例末尾添加以下代码：\n\
    \n```\ndel realmadrid\nprint(\"---------1---------\")\n```\n\n从结果可以观察到，程序在输出 \"\
    1\" 之前输出了 \"del\"。这是因为 Python 具有自动垃圾回收机制。当 Python 程序结束时，Python 解释器会检测当前是否有内存空间需要释放。如果有\
    \ `del` 语句，会自动删除；如果已手动调用 `del` 语句，则不会自动删除。\n\n至此，我们已对 Python 面向对象编程进行了透彻介绍。下一章，我们将简要讨论控制流语句。让我们开始吧！\n"
