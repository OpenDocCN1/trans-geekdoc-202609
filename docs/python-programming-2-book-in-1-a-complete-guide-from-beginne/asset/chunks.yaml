- raw: 'Chapter 13: How to create a Class in python? Object-oriented programming is
    an essential feature in the Python programming language. Even with the presence
    of the functional programming paradigm in Python a lot of developers like to use
    object-oriented mechanisms for developing programs. There are a lot of reasons
    that make developers choose object-oriented programming over functional. Machine
    learning experts should be quite aware of object and class creation when dealing
    with algorithms. This chapter is a comprehensive introduction to object-oriented
    programming basics. Let us start! How is it different from procedural programming?
    Procedural programming is a paradigm where problems are solved using reusable
    code segments known as functions. It is often difficult to insert new logic or
    data to the already created code. In a machine learning environment, it is often
    important to automatically rearrange the code segments to give the best results.
    This is the reason why machine learning enthusiasts should implement resources
    that will help you to extend into an object-oriented model whenever needed. How
    does object orientation work? Object-oriented programming uses a different philosophy
    that separates like-minded objects into categories. Using these categories, you
    can individually change functionalities that are required. Apart from easier code
    maintenance, they can also be used to maintain the unity of the functions. We
    will now in detail discuss classes and objects from a data scientist perspective.
    What are Classes and Objects? From a programmer''s perspective, classes are a
    blueprint that are developed to deal with objects easily. In a class, we will
    usually group like-minded variables, methods, and constructors to easily work
    with them. When dealing with small projects procedural programming techniques
    are feasible. However, as the size of the project expands, we need to write a
    lot of code that does the same thing from a different perspective. To counter
    this problem Classes and Objects are developed, by which we can easily inherit
    the parent classes and use them in our projects. What do classes consist of? Classes
    consist of methods that can do a certain task. There are global and local variables
    in a class that can be used according to the situation. All these methods and
    variables can be used as an object instance by the programmer. How to define a
    class? In Python, unlike Java, you need to store classes using a Python file.
    In java programming language programmers usually save separate class files with
    a .class extension. However, Python makes things simple by using the same .py
    format. In the next section, we will use an example that will help you understand
    the creation of a class in Python. To master object-oriented programming, we first
    need to understand the basic theories and concepts of object-oriented programming.
    This section will introduce the basic theories and concepts of object-oriented
    programming in detail. Object-Oriented scenarios in real life In the world we
    live in, any specific thing can be regarded as an object, and each object can
    handle some things or have some static characteristics. For example, each specific
    person can be regarded as an object. This object can handle some things, such
    as eating, singing, writing, etc. Some functions realized by this object can be
    called methods of this object. Similarly, this object has some static features,
    such as hair, arms, body, etc. You can call the static features of this object
    the attributes of this object. Thus, the method is dynamic and the attribute is
    static. If Tony is regarded as an object A and Christopher as object b, Tony and
    Christopher can communicate and pass on some information. In the object-oriented
    thinking method, messages can also be transmitted and communicated between objects,
    so that each object can form a powerful and complex network, thus realizing some
    complex architectures and functions. According to the commonness of various objects
    in nature, objects can be abstracted into classes, and any object must belong
    to a certain class. Objects are concrete and classes are abstract. For example,
    there are now the following objects: Object A: Tony is a person. Object B: Tony
    Object C: A specific orange Object d: A specific apple According to the commonness
    between object a and object b, object a and object b can be abstracted as human,
    which is called human for short. According to the commonness between object c
    and object d, object c and object d can be abstracted as fruit class.  Thus, objects
    A, B, C and D all have their own classes. Of course, the commonness among object
    A, object B, object C, and object D can also be extracted and abstracted into
    a class of biology. In object-oriented programming, we can divide a complex software
    into various required classes according to requirements, and then write various
    methods and attributes. When it is used specifically, it can be instantiated into
    specific objects directly according to the class, and then relevant functions
    can be implemented. The process of instantiation is the process of transforming
    abstract things into concrete things. After instantiation, the software''s relatively
    complex architecture and functions can be implemented using related objects. It
    can be seen that programming through object-oriented thinking can make the development
    of programs closer to the real world and realize complex functions and architectures
    more convenient. Advanced Concepts Through the above introduction, I believe everyone
    has a simple understanding of the basic idea of object-oriented, and this section
    will specifically introduce how to apply the object-oriented method to program
    design. For example, to realize a large project, you can divide the project into
    different components, treat each different component as each class, then program
    these components separately, and finally assemble each component into a large
    project. This approach can control the project as a whole and make the development
    of the project more efficient. Object-oriented programming is different from process-oriented
    programming. Process-oriented programming is to write programs according to the
    specific process of this project. This method is suitable for writing small and
    medium-sized programs, while for larger projects, it can be handled with object-oriented
    thinking.  If large projects are also developed according to the process-oriented
    programming idea, the efficiency will be lower and the object-oriented programming
    idea will be used for development. It is only necessary to divide the project
    into various classes (i.e. abstract forms of various parts of large projects),
    then develop various classes, and then combine various classes. When you need
    to use it, you can directly create specific objects according to classes, and
    then implement corresponding specific functions through each object. Class is
    a relatively important concept in object-oriented, and object is also a relatively
    important concept in object-oriented. The concepts of class and object are usually
    mentioned together, and this section will show you how to use Python to implement
    classes and objects. How to create classes? Classes are abstractions of commonness
    between certain objects. In popular terms, a class is a synthesis of many identical
    things. For example, a good song, a piece of calligraphy and a good-looking novel
    are all the objects. You can think about the commonness of these things and what
    can be used to summarize them? They can be summarized by a class called "literature
    and art". Literature and art do not represent any specific thing, it is an abstract
    concept. In a word: class is the abstraction of an object, and the object is the
    concrete expression of class, which is also called the instance of the class.
    For example, as we have just introduced, the objects of a beautiful song, calligraphy,
    and a beautiful novel can abstract the category of literature and art. When we
    say literature and art, it must be abstract, so the category is abstract of the
    object.  Use of Classes in Python In Python, if you want to implement object-oriented
    programming, you first need to divide the corresponding classes and then write
    the specific code to implement the classes. If you want to create a class in Python,
    you can do this in the following format: Class Name (): { Enter the implementation
    procedure here } For example, if you want to create a human class, you can do
    this by following the code: class man: ￼pass Here, the pass statement has no practical
    significance but is called a placeholder statement to ensure the integrity of
    the program.  After running the above program, we can make the following input:
    \>>> print（ man ） As you can see, the current corresponding output result is "class
    ……", indicating that man is a class at this time. Application Examples of Objects
    Generally speaking, classes cannot be directly used to implement related functions
    and operations, because classes are abstract. At this time, the corresponding
    class will generally be instantiated into the corresponding object, and then relevant
    functions and operations will be implemented through the corresponding object.
