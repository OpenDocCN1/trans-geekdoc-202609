- raw: 'Chapter 14: How to create Loops in python? ![Punto Interrogativo, Hacker,
    Attacco, Maschera](rsrc3CS.jpg)Machine learning often relies on repeating a task
    until it becomes a perfect sample for the query. To significantly achieve these
    results in Python we need to effectively use Loops. Python offers a variety of
    loop structures in their libraries. In this chapter, we will in detail discuss
    various loops using examples. Let us do it! What is a Loop? To say in simple words
    Loop is a programming structure that can repeat a task as many times you need.
    You can control the number of times a structure can loop using different logical
    evaluations. In this chapter, we will in detail discuss for and while loop with
    examples. Before discussing in detail about Loops we suggest you understand the
    concept of Judgement in control flow statements adequately. Judgment is a layman
    concept that processes the logical entity only when the conditions are met. If
    the conditions are not met then the program either stops or destroys by itself.
    In real life example, we can use traffic lights to help you understand this fundamental
    concept that is necessary to understand looping structures. You can''t cross the
    road when a red light is shown because it is the condition that needs to be followed.
    Judgment is also essentially used in conditional and case statements. However,
    in this chapter, we will only discuss looping structures. Follow along! while
    statement The while statement in Python is mainly used to control the repeated
    execution of a statement. The basic usage format of the while statement is as
    follows: While ( Enter the logical value) { Enter the statements; } Among them,
    the else clause part can be omitted if it is not needed. How to use While statement?
    The while statement is very convenient to use. For example, you want to repeatedly
    output "I like This programming language!". Such contents can be realized through
    the following procedures. instance=True ￼ while instance: ￼ print("I like This
    programming language!" ) Of course, this program is a dead-loop program. The so-called
    dead loop means that the loop will not terminate but will continue to run. This
    kind of dead loop program is generally not recommended and is only used for demonstration
    here. As can be seen, after executing the program, the following contents will
    be repeatedly shown as an output: I like This programming language! I like This
    programming language! I like This programming language! I like This programming
    language! … At this point, the reader has learned to write a simple while loop
    statement without an else clause. Here is another statement, that explains about
    while loop using an else clause: instance=False ￼while instance: ￼print("I like
    this programming language" ) else: print ("This is not a good language") In this
    program, because the condition is false, it will enter the else clause to partially
    execute the corresponding contents, and the output result of the program will
    be : This is not a good language In Python, you can use an if statement under
    a while statement or you can use a while statement under an if statement. This
    way of using the current statement or other statements under a certain statement
    is called nested use. For example, if you want a program to cycle 10 times, outputting
    "even" for the first 5 times and "odd" for the last 5 times, you can write as
    follows: first=0 ￼while first<10: if first<5: ￼print("even") ￼else: print("odd")
    first=first+1 At this time, the if statement is below the while statement. The
    if statement mainly determines whether it is the first 5 outputs or the last 5
    outputs, and the variable A is mainly used to control the number of cycles. The
    output of the current program is: even ￼even even even even ￼odd ￼odd odd odd
    odd It can be seen that the required functions have been successfully implemented.
    In the next section, we will in detail discuss for loop. Follow along! ￼ for loop
    The for statement in Python is another kind of loop statement and is used very
    much. For statements are executed in the following format: For in collection:
    execute this section It can be seen that the for statement in Python is mainly
    implemented by traversing the elements in the set in turn. The set in question
    is not a data type of set, but an object composed of multiple elements, which
    can be a list, a file object, or some other object with multiple elements. How
    to use for loop? If you need to output all the elements in a list, in turn, you
    can easily use the for loop. For example, you need to output the following elements
    of the list list =\["Python", "Java", "Internet ", " Deep learning", "Hadoop"\]
    in sequence, which can be implemented by the following code: list =\["Python","Java","Internet","Deep
    Learning","Hadoop "\] for instance list: print (instance) In this code, the list
    is defined first, and then each element in the list is iterated through the for
    statement loop in turn. The instance in the program is equivalent to a variable,
    and the element taken by the current loop in the list can be obtained every time
    the variable is iterated. The instance is just a variable name and can be replaced
    by other names, such as entity, result, etc. The results of this program are as
    follows: Python Java Internet Deep learning Hadoop ￼As you can see, each element
    in the list has been successfully removed in turn. For statements are often used
    with the range () function. the range(a,b) function can generate a series of serial
    data from the number a to the number b, so it can control the number of cycles
    and the value of i during the cycle. For example, if you want to output numbers
    1 to 20, you can do this by the following procedure: for extra in range(0,20):
    ￼print(extra+1) In this program, 0 ~ 19 is generated through range(0,20), and
    the variable extra will be added with 1 each time. Since the value of extra in
    this cycle is 0 ~ 19 and the data to be output is 1 ~ 20, it is only necessary
    to directly output extra+1 at the time of output. It can be seen that the data
    generated by the range () function are generated in sequence. if the interval
    between the data to be generated is not 1, but 3, 5, -1 and other numbers, only
    the step size of the range () needs to be set. In general, the step size is specified
    in the third parameter of range (). For example, you can enter the following program:
    for example in range(1,10,3): ￼print(example) The output at this time is: 1 ￼4
    7 It can be seen that the interval between the data is the set step size of 3.
    Next, let''s look at a for statement with nesting. For example, if it is necessary
    to sequentially determine whether each number from 1 to 10 is an even number or
    an odd number and output the determination result, it can be realized by the following
    procedure: For instance in range (1,11): if instance% 2 = = 0: print (str (instance)+"even")
    else: print (str (instance)+"odd") The program judges whether this number can
    be divisible by 2 through the remainder operation. If it can be divisible, it
    means that the number is even, otherwise, it is odd.It can be seen that relevant
    functions can already be realized by the output shown. ￼ Interrupt Mechanism In
    the process of program execution, for example, in the loop structure, when it
    is desired to satisfy a certain condition or the program is executed to a certain
    place, the loop or the program is allowed to interrupt execution, that is, the
    program behind the loop body or the program behind the corresponding program block
    is not executed, and the corresponding function can be realized by using the interrupt
    mechanism of program execution. Generally speaking, the interrupt mechanism is
    often used in the loop body to better realize the withdrawal and use of the loop.
    The interrupt mechanism in the loop body is generally divided into two structures:
    break statement structure and continue statement structure. The application situations
    of these two kinds of interrupt statements are different, which will be introduced
    separately. Break statement The break statement can force the loop execution to
    stop. A break statement is used in a loop statement. If a break occurs, the execution
    of the loop will be stopped directly. The function of a break statement, like
    its name, is to break the execution of a program. Break statements are often used
    in loop structures. When a break statement appears in the loop structure, the
    loop can be forced to stop and then exit the loop. 1\. break statement is used
    in while loop If a break statement appears in the while loop, it will exit the
    while loop and continue to execute the following. For example, if you want to
    use the while loop to output numbers 1 to 9 in sequence, you can write as follows:
    first=1 while first: ￼print(first) ￼first=first+1 ￼if first==10: ￼break It can
    be seen that if there is no if statement in the above program, the program will
    be executed forever and will not stop, i.e. a dead loop will occur. Add an if
    statement, and then use a break statement in the if statement, which means that
    if the conditions in the if statement is met, the break statement is executed,
    and after the break statement is executed, the while loop is exited. In the above
    program, A will add 1 to each cycle. When A adds 10 to the value, the output at
    the top is just 9, that is to say, there is no need to recycle next time and the
    execution of the cycle can be exited. 2\. break statement is used in for loop
    In addition to breaking in the while loop, you can also break in the for loop.
    In the for loop, you can easily output numbers 5 to 8 using the following statement.
    For i in Range (5,9): Print (i) If you want to output numbers 5 to 7 without changing
    the above program, you can add the following break statement for interrupt control:
    for first in range(5,9): ￼print(first) ￼if first>6: ￼break In the above program,
    when i in the loop is executed to 7, the execution of the loop needs to be interrupted
    after outputting 7, so whether the current I is executed to 7 is judged by if
    i>6. If this condition is met, I have already reached 7 at this time, and the
    loop can be interrupted by a break statement. The final output of the above program
    is as follows: 5 ￼6 ￼7 continue statement The continue statement is another interrupt
    structure statement, whose function is to force the execution of this time in
    the loop to stop and jump directly to the next execution, which is different from
    the function of the break statement. The continue statement is the statement placed
    in the loop statement to end the loop. First of all, we should know that the loop
    is divided into many times, and the continue statement terminates the loop, not
    the loop. In the same way, let''s give you some examples of the application of
    continue statements. Here is an example: if(i==22) print( Enter the statements)
    continue: In the above example, the statement will be executed only when the condition
    is met. If the condition is not met it will continue to proceed with the other
    statements that are present. With this, we have completed a brief introduction
    to loops in this chapter. I hope you had a good time learning different concepts
    related to Python in this book. Now it is your time to create your projects and
    improve your programming abilities. All the best! '
  fmt: "\n# Chapter 14: How to create Loops in python?\n\nMachine learning often relies\
    \ on repeating a task until it becomes a perfect sample for the query. To significantly\
    \ achieve these results in Python we need to effectively use Loops. Python offers\
    \ a variety of loop structures in their libraries. In this chapter, we will in\
    \ detail discuss various loops using examples.\n\n## What is a Loop?\n\nTo say\
    \ in simple words, a Loop is a programming structure that can repeat a task as\
    \ many times as you need. You can control the number of times a structure can\
    \ loop using different logical evaluations. In this chapter, we will discuss `for`\
    \ and `while` loops in detail with examples.\n\nBefore discussing loops in detail,\
    \ we suggest you understand the concept of Judgement in control flow statements\
    \ adequately. Judgment is a layman concept that processes the logical entity only\
    \ when the conditions are met. If the conditions are not met, then the program\
    \ either stops or destroys by itself.\n\nIn a real-life example, we can use traffic\
    \ lights to help you understand this fundamental concept necessary to understand\
    \ looping structures. You can't cross the road when a red light is shown because\
    \ it is the condition that needs to be followed. Judgment is also essentially\
    \ used in conditional and case statements. However, in this chapter, we will only\
    \ discuss looping structures.\n\n## `while` statement\n\nThe `while` statement\
    \ in Python is mainly used to control the repeated execution of a statement. The\
    \ basic usage format of the `while` statement is as follows:\n\n```\nwhile (Enter\
    \ the logical value):\n    Enter the statements;\n```\n\nAmong them, the `else`\
    \ clause part can be omitted if it is not needed.\n\n### How to use `while` statement?\n\
    \nThe `while` statement is very convenient to use. For example, you want to repeatedly\
    \ output \"I like This programming language!\". Such contents can be realized\
    \ through the following procedures:\n\n```\ninstance = True\nwhile instance:\n\
    \    print(\"I like This programming language!\")\n```\n\nOf course, this program\
    \ is a dead-loop program. The so-called dead loop means that the loop will not\
    \ terminate but will continue to run. This kind of dead loop program is generally\
    \ not recommended and is only used for demonstration here.\n\nAs can be seen,\
    \ after executing the program, the following contents will be repeatedly shown\
    \ as an output:\n\n```\nI like This programming language!\nI like This programming\
    \ language!\nI like This programming language!\nI like This programming language!\n\
    ...\n```\n\nAt this point, the reader has learned to write a simple `while` loop\
    \ statement without an `else` clause. Here is another statement that explains\
    \ the `while` loop using an `else` clause:\n\n```\ninstance = False\nwhile instance:\n\
    \    print(\"I like this programming language\")\nelse:\n    print(\"This is not\
    \ a good language\")\n```\n\nIn this program, because the condition is false,\
    \ it will enter the `else` clause to partially execute the corresponding contents,\
    \ and the output result of the program will be:\n\n```\nThis is not a good language\n\
    ```\n\nIn Python, you can use an `if` statement under a `while` statement or you\
    \ can use a `while` statement under an `if` statement. This way of using the current\
    \ statement or other statements under a certain statement is called nested use.\n\
    \nFor example, if you want a program to cycle 10 times, outputting \"even\" for\
    \ the first 5 times and \"odd\" for the last 5 times, you can write as follows:\n\
    \n```\nfirst = 0\nwhile first < 10:\n    if first < 5:\n        print(\"even\"\
    )\n    else:\n        print(\"odd\")\n    first = first + 1\n```\n\nAt this time,\
    \ the `if` statement is below the `while` statement. The `if` statement mainly\
    \ determines whether it is the first 5 outputs or the last 5 outputs, and the\
    \ variable `first` is mainly used to control the number of cycles.\n\nThe output\
    \ of the current program is:\n\n```\neven\neven\neven\neven\neven\nodd\nodd\n\
    odd\nodd\nodd\n```\n\nIt can be seen that the required functions have been successfully\
    \ implemented.\n\n## `for` loop\n\nThe `for` statement in Python is another kind\
    \ of loop statement and is used very much. `for` statements are executed in the\
    \ following format:\n\n```\nfor variable in collection:\n    execute this section\n\
    ```\n\nIt can be seen that the `for` statement in Python is mainly implemented\
    \ by traversing the elements in the collection in turn. The collection in question\
    \ is not a data type of `set`, but an object composed of multiple elements, which\
    \ can be a `list`, a file object, or some other object with multiple elements.\n\
    \n### How to use `for` loop?\n\nIf you need to output all the elements in a list\
    \ in turn, you can easily use the `for` loop. For example, you need to output\
    \ the following elements of the list `list = [\"Python\", \"Java\", \"Internet\"\
    , \"Deep learning\", \"Hadoop\"]` in sequence, which can be implemented by the\
    \ following code:\n\n```\nlist = [\"Python\", \"Java\", \"Internet\", \"Deep Learning\"\
    , \"Hadoop\"]\nfor instance in list:\n    print(instance)\n```\n\nIn this code,\
    \ the `list` is defined first, and then each element in the `list` is iterated\
    \ through the `for` statement loop in turn. The `instance` in the program is equivalent\
    \ to a variable, and the element taken by the current loop in the `list` can be\
    \ obtained every time the variable is iterated. The `instance` is just a variable\
    \ name and can be replaced by other names, such as `entity`, `result`, etc.\n\n\
    The results of this program are as follows:\n\n```\nPython\nJava\nInternet\nDeep\
    \ learning\nHadoop\n```\n\nAs you can see, each element in the list has been successfully\
    \ accessed in turn.\n\n`for` statements are often used with the `range()` function.\
    \ The `range(a, b)` function can generate a series of serial data from the number\
    \ `a` to the number `b`, so it can control the number of cycles and the value\
    \ of `i` during the cycle.\n\nFor example, if you want to output numbers 1 to\
    \ 20, you can do this by the following procedure:\n\n```\nfor extra in range(0,\
    \ 20):\n    print(extra + 1)\n```\n\nIn this program, `0 ~ 19` is generated through\
    \ `range(0, 20)`, and the variable `extra` will be added with 1 each time. Since\
    \ the value of `extra` in this cycle is `0 ~ 19` and the data to be output is\
    \ `1 ~ 20`, it is only necessary to directly output `extra + 1` at the time of\
    \ output.\n\nIt can be seen that the data generated by the `range()` function\
    \ are generated in sequence. If the interval between the data to be generated\
    \ is not 1, but 3, 5, -1 and other numbers, only the step size of the `range()`\
    \ needs to be set. In general, the step size is specified in the third parameter\
    \ of `range()`.\n\nFor example, you can enter the following program:\n\n```\n\
    for example in range(1, 10, 3):\n    print(example)\n```\n\nThe output at this\
    \ time is:\n\n```\n1\n4\n7\n```\n\nIt can be seen that the interval between the\
    \ data is the set step size of 3.\n\nNext, let's look at a `for` statement with\
    \ nesting. For example, if it is necessary to sequentially determine whether each\
    \ number from 1 to 10 is an even number or an odd number and output the determination\
    \ result, it can be realized by the following procedure:\n\n```\nfor instance\
    \ in range(1, 11):\n    if instance % 2 == 0:\n        print(str(instance) + \"\
    \ even\")\n    else:\n        print(str(instance) + \" odd\")\n```\n\nThe program\
    \ judges whether this number can be divisible by 2 through the remainder operation.\
    \ If it can be divisible, it means that the number is even; otherwise, it is odd.\
    \ It can be seen that relevant functions can already be realized by the output\
    \ shown.\n\n## Interrupt Mechanism\n\nIn the process of program execution, for\
    \ example, in the loop structure, when it is desired to satisfy a certain condition\
    \ or the program is executed to a certain place, the loop or the program is allowed\
    \ to interrupt execution. That is, the program behind the loop body or the program\
    \ behind the corresponding program block is not executed, and the corresponding\
    \ function can be realized by using the interrupt mechanism of program execution.\n\
    \nGenerally speaking, the interrupt mechanism is often used in the loop body to\
    \ better realize the withdrawal and use of the loop. The interrupt mechanism in\
    \ the loop body is generally divided into two structures: `break` statement structure\
    \ and `continue` statement structure. The application situations of these two\
    \ kinds of interrupt statements are different, which will be introduced separately.\n\
    \n### `break` statement\n\nThe `break` statement can force the loop execution\
    \ to stop. A `break` statement is used in a loop statement. If a `break` occurs,\
    \ the execution of the loop will be stopped directly. The function of a `break`\
    \ statement, like its name, is to break the execution of a program.\n\n`break`\
    \ statements are often used in loop structures. When a `break` statement appears\
    \ in the loop structure, the loop can be forced to stop and then exit the loop.\n\
    \n#### 1. `break` statement is used in `while` loop\n\nIf a `break` statement\
    \ appears in the `while` loop, it will exit the `while` loop and continue to execute\
    \ the following.\n\nFor example, if you want to use the `while` loop to output\
    \ numbers 1 to 9 in sequence, you can write as follows:\n\n```\nfirst = 1\nwhile\
    \ first:\n    print(first)\n    first = first + 1\n    if first == 10:\n     \
    \   break\n```\n\nIt can be seen that if there is no `if` statement in the above\
    \ program, the program will be executed forever and will not stop, i.e., a dead\
    \ loop will occur. Add an `if` statement, and then use a `break` statement in\
    \ the `if` statement, which means that if the condition in the `if` statement\
    \ is met, the `break` statement is executed, and after the `break` statement is\
    \ executed, the `while` loop is exited.\n\nIn the above program, `first` will\
    \ add 1 to each cycle. When `first` adds 10 to the value, the output at the top\
    \ is just 9, that is to say, there is no need to recycle next time and the execution\
    \ of the cycle can be exited.\n\n#### 2. `break` statement is used in `for` loop\n\
    \nIn addition to breaking in the `while` loop, you can also break in the `for`\
    \ loop. In the `for` loop, you can easily output numbers 5 to 8 using the following\
    \ statement:\n\n```\nfor i in range(5, 9):\n    print(i)\n```\n\nIf you want to\
    \ output numbers 5 to 7 without changing the above program, you can add the following\
    \ `break` statement for interrupt control:\n\n```\nfor first in range(5, 9):\n\
    \    print(first)\n    if first > 6:\n        break\n```\n\nIn the above program,\
    \ when `i` in the loop is executed to 7, the execution of the loop needs to be\
    \ interrupted after outputting 7, so whether the current `i` is executed to 7\
    \ is judged by `if first > 6`. If this condition is met, `first` has already reached\
    \ 7 at this time, and the loop can be interrupted by a `break` statement.\n\n\
    The final output of the above program is as follows:\n\n```\n5\n6\n7\n```\n\n\
    ### `continue` statement\n\nThe `continue` statement is another interrupt structure\
    \ statement, whose function is to force the execution of this iteration in the\
    \ loop to stop and jump directly to the next execution, which is different from\
    \ the function of the `break` statement. The `continue` statement is the statement\
    \ placed in the loop statement to end the current iteration.\n\nFirst of all,\
    \ we should know that the loop is divided into many iterations, and the `continue`\
    \ statement terminates the current iteration, not the entire loop.\n\nIn the same\
    \ way, let's give you some examples of the application of `continue` statements.\
    \ Here is an example:\n\n```\nif i == 22:\n    print(\"Enter the statements\"\
    )\n    continue\n```\n\nIn the above example, the statement will be executed only\
    \ when the condition is met. If the condition is not met, it will continue to\
    \ proceed with the other statements that are present.\n\nWith this, we have completed\
    \ a brief introduction to loops in this chapter. I hope you had a good time learning\
    \ different concepts related to Python in this book. Now it is your time to create\
    \ your projects and improve your programming abilities. All the best!\n"
  trans: "\n\n# 第 14 章：如何在 Python 中创建循环？\n\n机器学习通常依赖于重复执行任务，直到其成为查询的完美样本。要在 Python\
    \ 中显著实现这些结果，我们需要有效地使用循环。Python 在其库中提供了多种循环结构。在本章中，我们将通过示例详细讨论各种循环。\n\n## 什么是循环？\n\
    \n简单来说，循环是一种编程结构，可以根据需要重复执行任务任意次数。您可以使用不同的逻辑判断来控制结构循环的次数。在本章中，我们将结合示例详细讨论 `for`\
    \ 和 `while` 循环。\n\n在详细讨论循环之前，我们建议您充分理解控制流语句中判断的概念。判断是一个通俗的概念，仅当条件满足时才处理逻辑实体。如果条件不满足，程序将停止或自行终止。\n\
    \n在现实生活的例子中，我们可以用红绿灯来帮助您理解理解循环结构所必需的这一基本概念。当红灯亮起时，您不能过马路，因为这是必须遵守的条件。判断也本质上用于条件语句和情况语句。然而，在本章中，我们将只讨论循环结构。\n\
    \n## `while` 语句\n\nPython 中的 `while` 语句主要用于控制语句的重复执行。`while` 语句的基本用法格式如下：\n\n\
    ```\nwhile (输入逻辑值):\n    输入语句;\n```\n\n其中，如果不需要，`else` 子句部分可以省略。\n\n### 如何使用 `while`\
    \ 语句？\n\n`while` 语句非常方便。例如，您想反复输出 \"I like This programming language!\"。此类内容可以通过以下过程实现：\n\
    \n```\ninstance = True\nwhile instance:\n    print(\"I like This programming language!\"\
    )\n```\n\n当然，该程序是一个死循环程序。所谓死循环是指循环不会终止，而是会继续运行。这种死循环程序通常不推荐，此处仅用于演示。\n\n可以看出，执行程序后，将反复显示以下内容作为输出：\n\
    \n```\nI like This programming language!\nI like This programming language!\n\
    I like This programming language!\nI like This programming language!\n...\n```\n\
    \n此时，读者已经学会了编写不带 `else` 子句的简单 `while` 循环语句。下面是另一个使用 `else` 子句解释 `while` 循环的语句：\n\
    \n```\ninstance = False\nwhile instance:\n    print(\"I like this programming\
    \ language\")\nelse:\n    print(\"This is not a good language\")\n```\n\n在该程序中，因为条件为假，它将进入\
    \ `else` 子句部分执行相应内容，程序的输出结果将为：\n\n```\nThis is not a good language\n```\n\n在 Python\
    \ 中，您可以在 `while` 语句下使用 `if` 语句，也可以在 `if` 语句下使用 `while` 语句。这种在某一语句下使用当前语句或其他语句的方式称为嵌套使用。\n\
    \n例如，如果您希望程序循环 10 次，前 5 次输出 \"even\"，后 5 次输出 \"odd\"，可以按如下方式编写：\n\n```\nfirst\
    \ = 0\nwhile first < 10:\n    if first < 5:\n        print(\"even\")\n    else:\n\
    \        print(\"odd\")\n    first = first + 1\n```\n\n此时，`if` 语句位于 `while` 语句之下。`if`\
    \ 语句主要判断是前 5 次输出还是后 5 次输出，变量 `first` 主要用于控制循环次数。\n\n当前程序的输出为：\n\n```\neven\neven\n\
    even\neven\neven\nodd\nodd\nodd\nodd\nodd\n```\n\n可以看出，所需功能已成功实现。\n\n## `for`\
    \ 循环\n\nPython 中的 `for` 语句是另一种循环语句，使用非常广泛。`for` 语句按以下格式执行：\n\n```\nfor 变量 in 集合:\n\
    \    执行此部分\n```\n\n可以看出，Python 中的 `for` 语句主要通过依次遍历集合中的元素来实现。相关的集合不是 `set` 数据类型，而是由多个元素组成的对象，可以是\
    \ `list`、文件对象或其他包含多个元素的对象。\n\n### 如何使用 `for` 循环？\n\n如果您需要依次输出列表中的所有元素，可以轻松使用 `for`\
    \ 循环。例如，您需要按顺序输出列表 `list = [\"Python\", \"Java\", \"Internet\", \"Deep learning\"\
    , \"Hadoop\"]` 的以下元素，可以通过以下代码实现：\n\n```\nlist = [\"Python\", \"Java\", \"Internet\"\
    , \"Deep Learning\", \"Hadoop\"]\nfor instance in list:\n    print(instance)\n\
    ```\n\n在该代码中，首先定义了 `list`，然后通过 `for` 语句循环依次遍历 `list` 中的每个元素。程序中的 `instance` 相当于一个变量，每次迭代变量时都可以获得\
    \ `list` 中当前循环取到的元素。`instance` 只是一个变量名，可以替换为其他名称，如 `entity`、`result` 等。\n\n该程序的结果如下：\n\
    \n```\nPython\nJava\nInternet\nDeep learning\nHadoop\n```\n\n正如您所见，列表中的每个元素都已成功依次访问。\n\
    \n`for` 语句经常与 `range()` 函数一起使用。`range(a, b)` 函数可以生成从数字 `a` 到数字 `b` 的一系列序列数据，因此它可以控制循环次数和循环期间\
    \ `i` 的值。\n\n例如，如果您想输出 1 到 20 的数字，可以通过以下过程实现：\n\n```\nfor extra in range(0, 20):\n\
    \    print(extra + 1)\n```\n\n在该程序中，通过 `range(0, 20)` 生成 `0 ~ 19`，变量 `extra` 每次将加\
    \ 1。由于此循环中 `extra` 的值为 `0 ~ 19`，而要输出的数据为 `1 ~ 20`，因此只需在输出时直接输出 `extra + 1` 即可。\n\
    \n可以看出，`range()` 函数生成的数据是按顺序生成的。如果要生成的数据间隔不是 1，而是 3、5、-1 等数字，只需设置 `range()` 的步长即可。通常，步长在\
    \ `range()` 的第三个参数中指定。\n\n例如，您可以输入以下程序：\n\n```\nfor example in range(1, 10, 3):\n\
    \    print(example)\n```\n\n此时的输出为：\n\n```\n1\n4\n7\n```\n\n可以看出，数据的间隔是设定的步长 3。\n\
    \n接下来，让我们看一个带有嵌套的 `for` 语句。例如，如果需要依次判断 1 到 10 的每个数字是偶数还是奇数并输出判断结果，可以通过以下过程实现：\n\
    \n```\nfor instance in range(1, 11):\n    if instance % 2 == 0:\n        print(str(instance)\
    \ + \" even\")\n    else:\n        print(str(instance) + \" odd\")\n```\n\n程序通过取余运算判断该数字能否被\
    \ 2 整除。如果能整除，则表示该数字为偶数；否则为奇数。可以看出，通过显示的输出，相关功能已经可以实现。\n\n## 中断机制\n\n在程序执行过程中，例如在循环结构中，当希望满足某个条件或程序执行到某个位置时，允许循环或程序中断执行。即不执行循环体后面的程序或相应程序块后面的程序，可以通过程序执行的中断机制来实现相应功能。\n\
    \n一般来说，中断机制常用于循环体中，以更好地实现循环的退出和使用。循环体中的中断机制一般分为两种结构：`break` 语句结构和 `continue` 语句结构。这两种中断语句的应用场景不同，将分别介绍。\n\
    \n### `break` 语句\n\n`break` 语句可以强制停止循环执行。`break` 语句用于循环语句中。如果发生 `break`，循环的执行将直接停止。`break`\
    \ 语句的功能正如其名，是打破程序的执行。\n\n`break` 语句常用于循环结构中。当 `break` 语句出现在循环结构中时，可以强制停止循环，然后退出循环。\n\
    \n#### 1. `break` 语句用于 `while` 循环\n\n如果 `break` 语句出现在 `while` 循环中，它将退出 `while`\
    \ 循环并继续执行后续代码。\n\n例如，如果您想使用 `while` 循环按顺序输出 1 到 9 的数字，可以按如下方式编写：\n\n```\nfirst\
    \ = 1\nwhile first:\n    print(first)\n    first = first + 1\n    if first ==\
    \ 10:\n        break\n```\n\n可以看出，如果上述程序中没有 `if` 语句，程序将永远执行而不会停止，即会发生死循环。添加一个\
    \ `if` 语句，然后在 `if` 语句中使用 `break` 语句，这意味着如果 `if` 语句中的条件得到满足，则执行 `break` 语句，执行 `break`\
    \ 语句后，退出 `while` 循环。\n\n在上述程序中，`first` 每个循环将加 1。当 `first` 加到 10 时，顶部的输出刚好是 9，也就是说，不需要再次循环，可以退出循环的执行。\n\
    \n#### 2. `break` 语句用于 `for` 循环\n\n除了在 `while` 循环中中断外，也可以在 `for` 循环中中断。在 `for`\
    \ 循环中，您可以使用以下语句轻松输出 5 到 8 的数字：\n\n```\nfor i in range(5, 9):\n    print(i)\n```\n\
    \n如果您想在不更改上述程序的情况下输出 5 到 7 的数字，可以添加以下 `break` 语句进行中断控制：\n\n```\nfor first in range(5,\
    \ 9):\n    print(first)\n    if first > 6:\n        break\n```\n\n在上述程序中，当循环中的\
    \ `i` 执行到 7 时，输出 7 后需要中断循环的执行，因此通过 `if first > 6` 判断当前 `i` 是否已执行到 7。如果满足此条件，此时\
    \ `first` 已达到 7，可以通过 `break` 语句中断循环。\n\n上述程序的最终输出如下：\n\n```\n5\n6\n7\n```\n\n\
    ### `continue` 语句\n\n`continue` 语句是另一种中断结构语句，其功能是强制停止循环中当前迭代的执行，直接跳转到下一次执行，这与\
    \ `break` 语句的功能不同。`continue` 语句是放在循环语句中以结束当前迭代的语句。\n\n首先，我们应该知道循环被分为许多次迭代，`continue`\
    \ 语句终止的是当前迭代，而不是整个循环。\n\n同样，让我们给您一些 `continue` 语句应用的示例。这是一个示例：\n\n```\nif i ==\
    \ 22:\n    print(\"Enter the statements\")\n    continue\n```\n\n在上述示例中，仅当条件满足时才会执行该语句。如果条件不满足，它将继续执行其他现有语句。\n\
    \n至此，我们完成了本章关于循环的简要介绍。希望您在本书中愉快地学习了与 Python 相关的不同概念。现在轮到您创建项目并提高编程能力了。祝一切顺利！\n\
    \n"
