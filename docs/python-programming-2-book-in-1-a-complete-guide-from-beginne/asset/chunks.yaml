    \ such index\n```\n\n上述信息表明列表的索引值超出了列表的范围。\n\n### 5. KeyError\n\n当在映射中使用不存在的键时，会抛出\
    \ `KeyError` 异常。例如：\n\n```\nThisresult = {'number':'explain','port':7232}\nThisresult['interpret']\n\
    ```\n\n在上述示例中，`myDict` 字典中只有 `host` 和 `port` 两个键。当获取 `interpret` 键对应的值时，会出现以下错误信息：\n\
    \n```\nKeyError: 'interpret'\n```\n\n上述信息表明字典中存在一个不存在的键 `server`。\n\n### 6. FileNotFoundError\n\
    \n当尝试打开一个不存在的文件时，会抛出文件未找到 `IOError` 异常。例如：\n\n```\nsecond = open(\"test\")\n```\n\
    \n在上述示例中，使用 `open` 方法打开名为 `test` 的文件或目录，会出现以下错误信息：\n\n```\nFileNotFoundError:\
    \ { There is nothing that exists with this name}\n```\n\n上述信息表明未找到名为 `test` 的文件或目录。\n\
    \n### 7. AttributeError\n\n当尝试访问未知对象属性时，会抛出 `AttributeError` 异常。例如：\n\n```\nclass\
    \ Aeroplane(object):\n    fly\nflight = Aeroplane()\nAeroplane.color = \"white\"\
    \n```\n\n在上述示例中，`Aeroplane` 类未定义任何属性和方法。创建 `Aeroplane` 类的实例后，`color` 属性被动态添加到\
    \ `flight` 引用的实例上，随后访问其 `color` 和 `name` 属性时出现以下错误信息：\n\n```\nAttributeError:\
    \ 'Aeroplane' object has no attribute 'value'\n```\n\n上述信息表明 `color` 属性定义在 `Aeroplane`\
    \ 实例中，因此可通过 `flight.color` 访问。然而 `name` 属性未定义，故访问 `name` 属性时会报错。\n\n下一节将详细讨论异常处理。\n\
    \n## 异常处理\n\nPython 处理异常的能力非常强大。它能准确反馈错误信息，帮助开发者精准定位问题的位置和原因。Python 使用 `try-except`\
    \ 语句处理异常。其中 `try` 语句用于检测异常，`except` 语句用于捕获异常。\n\n### 捕获简单异常\n\n`try-except` 语句定义一段用于监控异常的代码，并提供处理异常的机制。最简单的\
    \ `try-except` 语句格式如下：\n\n```\ntry:\n    # Here is the place where logic goes\n\
    except:\n    # Here we enter the error details\n```\n\n当 `try` 块中的语句发生错误时，程序将不再继续执行\
    \ `try` 块中的后续语句，而是直接执行 `except` 中处理异常的语句。\n\n为便于读者理解，以下示例演示如何使用简单的 `try-except`\
    \ 语句捕获两数相除可能引发的异常。\n\n**示例：Simple Exceptions.py**\n\n```\ntry:\n    print(\"-\"\
    *64)\n    first = input(\"You should enter the first entity\")\n    second = input(\"\
    You should enter the second entity\")\n    print(int(first)/int(second))\n   \
    \ print(\"-\"*64)\nexcept ZeroDivisionError:\n    print(\"Number 64 cannot be\
    \ divided\")\n```\n\n在该示例中，`try` 子句中的 `input` 函数接收用户输入的两个值，其中第一个值作为被除数，第二个值作为除数。如果除数为\
    \ 0，程序将抛出 `ZeroDivisionError` 异常。此时 `except` 子句将捕获该异常并打印异常信息。\n\n运行程序并在控制台输入第一个数\
    \ 64、第二个数 5，结果将显示。通过仔细分析，你将理解异常处理的工作原理。从结果可以看出，当程序出现异常时，程序不会终止，而是会根据自定义的消息提醒用户。\n\
    \n注意：只要监控到错误，程序就会执行 `except` 语句，不再执行 `try` 中未执行的语句。\n\n### 捕获异常的描述信息\n\n一个 `except`\
    \ 子句可捕获多个异常。将示例中的两个错误合并到一个 `except` 子句如下：\n\n```\ntry:\n    first = input(\"Enter\
    \ the first entity\")\n    second = input(\"Enter the second entity\")\n    print(int(first)/int(second))\n\
    except (ZeroDivisionError, ValueError):\n    print(\"Get a value\")\n```\n\n此时，无论上述两个异常中的任意一个发生，都会打印\
    \ `except` 内的语句。但仅打印一条错误信息无助于区分不同错误。可使用 `as` 关键字获取系统反馈的错误信息。\n\n### 捕获所有异常\n\n\
    即使程序能处理多个异常，也无法穷尽所有异常，仍可能有异常未被捕获。在示例中，若编写程序时将 `num1` 误写为 `nmn1`，将获得类似以下的错误信息：\n\
    \n```\nNameError: name 'nmn1' is not defined\n```\n\n此种情况下，可在原有基础上捕获 `SyntaxError`\
    \ 异常。若程序中有数十个错误，逐个捕获非常麻烦。为解决此问题，`except` 子句可不指定异常类型，从而处理任意类型的异常。\n\n为便于读者理解，此处添加捕获所有异常的功能示例。\n\
    \n**示例：Captures All Exceptions**\n\n```\n# captures all exceptions\ntry:\n   \
    \ first = input(\"Use this as first entity\")\n    second = input(\"Use this as\
    \ second entity\")\n    print(int(first)/int(second))\nexcept:\n    print(\"You\
    \ got this error\")\n```\n\n在该示例中，`except` 语句未指定异常类型，程序所有可能的错误均在该语句中统一处理。从两次运行结果可见，所有异常的提示信息相同。\n\
    \n捕获所有异常的另一种方式是在 `except` 语句后使用 `Exception` 类。由于 `Exception` 类是所有异常类的父类，因此可捕获所有异常。\n\
    \n### 未捕获异常时的处理\n\n在 `if` 语句中，当所有条件均不满足时执行 `else` 语句。同理，若 `try` 语句未捕获任何错误信息，则不执行任何\
    \ `except` 语句，而是执行 `else` 语句。\n\n为便于读者理解，我们在上述示例基础上添加 `else` 语句。\n\n**示例：else\
    \ statement.py**\n\n```\ntry:\n    first = input(\"Use this as first entity\"\
    )\n    second = input(\"Use this as second entity\")\n    print(int(first)/int(second))\n\
    except:\n    print(\"You got this error\")\nelse:\n    print(\"The program runs\
    \ normally and no exception is caught\")\n```\n\n在该示例中，当 `try` 语句检测到错误时，将执行 `except`\
    \ 中的打印语句并输出异常描述信息。当无错误时，将执行 `else` 中的打印语句。\n\n至此，我们已完成对核心编程概念的简要解释。下一章将详细讨论文件管理。\n\
    \n"
