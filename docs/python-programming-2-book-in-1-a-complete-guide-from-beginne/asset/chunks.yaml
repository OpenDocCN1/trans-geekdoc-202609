- raw: 'Chapter 15: Essential programming in Python In python, it is essential to
    deal with errors to make programs run. Whenever a python program stops running
    for the user due to warnings and errors it is advised to show the reasons for
    the end-user. Python programmers should develop this skill by understanding the
    essence of exception handling in python. It is very essential for making things
    work smoothly. In this chapter, we will discuss this in detail with examples.
    Let us start! Brief Introduction of Anomalies In Python, errors generated during
    the execution of a program are called exceptions, such as list indexes crossing
    boundaries, opening files that do not exist, etc. For example, an error occurs
    when running the following program code. open(data.txt) FileNotFound { There is
    no such file: ''data.txt'' } Abnormal Class In Python, all Exception classes are
    subclasses of Exception. The exceptions class is defined in the Exceptions module,
    which is in Python''s built-in namespace and can be used directly without import.
    In the previous chapters, the program threw an exception every time it encountered
    an error in executing the program. If the exception object is not processed and
    captured, the program will terminate execution with a traceback, which includes
    the name of the error (such as NameError), the reason and the line number where
    the error occurred. Here are some common exceptions. 1.NameError Attempting to
    access an undeclared variable raises a NameError. For example: print(dude) The
    error message is as follows: NameError: There is no such namespace The above information
    indicates that the interpreter did not find foo in any namespace. 2.ZeroDivisionError
    When the divisor is zero, a ZeroDivisionError exception is thrown. For example:
    1/0 The error message is as follows: ZeroDivisionError: division by zero is not
    possible Any numerical value divided by zero will lead to the above exception.
    3.SyntaxError When the interpreter finds a SyntaxError, it will throw a syntax
    error exception. For example: list = \["two","four","six"\] for result in list
    print(result) In the above example, due to the lack of a colon after the for loop,
    the program has the following error message: SyntaxError: This is not the correct
    syntax The SyntaxError exception is the only exception that does not occur at
    runtime. It represents an incorrect structure in Python code that prevents the
    program from executing. These errors generally occur at compile-time, and the
    interpreter cannot convert the script into byte code. 4.IndexError An IndexError
    exception is thrown when using an index that does not exist in the sequence. For
    example: example = \[\] example\[0\] In the above example, there is no element
    in the list. When accessing the first element of the list with index 0, the following
    error message appears: IndexError: There is no such index The above information
    indicates that the index value of the list is beyond the range of the list. 5.KeyError
    When using a key that does not exist in the map, a KeyError exception is thrown.
    For example: Thisresult = {''number'':''explain'',''port'':7232} Thisresult\[''interpret''\]
    In the above example, there are only two keys host and port in myDict dictionary.
    When obtaining the corresponding value of the interpret key, the following error
    message appears: KeyError: ''interpret'' The above information indicates that
    there is a key server that does not exist in the dictionary. 6.FileNotFoundError
    When trying to open a file that does not exist, a file not found IOError exception
    is thrown. For example: second = open("test") In the above example, using the
    open method to open a file or directory named test, the following error message
    appears: FileNotFoundError: { There is nothing that exists with this name} The
    above information indicates that no file or directory named test was found. 7.AttributeError
    An AttributeError exception is thrown when attempting to access an unknown object
    attribute. For example: class Aeroplane(object): fly flight = Aeroplane() Aeroplane.color
    = "white" In the above example, the Aeroplane class does not define any attributes
    and methods. After creating an instance of the Aeroplane class, the color attribute
    is dynamically added to the instance referenced by the flight, and then the following
    error message appears when accessing it''s color and name attributes: AttributeError:
    ''Aeroplane'' object has no attribute ''value'' The above information indicates
    that the color attribute is defined in the Aeroplane instance, so it can be accessed
    by flight.color. However, the name attribute is not defined, so an error occurs
    when accessing the name attribute. In the next section, we will discuss exception
    handling in detail. Follow along! Exception handling Python''s ability to handle
    exceptions is very powerful. It can accurately feedback error information and
    help developers to accurately locate the location and cause of problems. Try-except
    statements are used in Python to handle exceptions. Among them, try statements
    are used to detect exceptions and exception statements are used to catch exceptions.
    Capture Simple Exceptions The try-except statement defines a piece of code to
    monitor exceptions and provides a mechanism to handle exceptions. The simplest
    try-except statement format is as follows: try： \# Here is the place where logic
    goes except： \# Here we enter the error details When an error occurs in a statement
    in a try block, the program will no longer continue to execute the statement in
    the try block, but will directly execute the statement that handles the exception
    in exception. To make readers better understand, the following is a case to demonstrate
    how to use a simple try-except statement to try to capture the possible exceptions
    caused by dividing two numbers, as shown in the example. Example: Simple Exceptions.
    py try: print("-"\*64) first = input ("You should enter the first entity") second
    = input ("You should enter the second entity") print(int(first)/int(second)) print("-"\*64)
    except ZeroDivisionError: print ("Number 64 cannot be divided") In Example, two
    values input by the user are received in the input function of the try clause,
    wherein the first value is taken as the dividend and the other value is taken
    as the divisor. If the divisor is 0, the program will throw a ZeroDivisionError
    exception. In this case, the exception clause will catch the exception and print
    the exception information. Run the program and enter the first number of 64 and
    the second number of 5 in the console. The result will be shown. By analyzing
    this carefully you will understand how exception handling works. From the results,
    it can be seen that when the program is abnormal, the program will not be terminated
    again, but the user will be reminded according to the message set by himself.
    Note that as long as errors are monitored, the program will execute the statements
    except and will no longer execute the unexecuted statements in a try. Capture
    the description information of the anomaly Multiple exceptions can be caught through
    an except clause. The two errors of Example are combined into an except clause
    as follows. try: first = input ("Enter the first entity") second = input ("Enter
    the second entity") print(int(first)/int(second)) except (ZeroDivisionError, Enter
    the value here): print ("Get a value") At this time, no matter anyone of the above
    two exceptions occurs, the statement inside the exception will be printed. However,
    printing only one error message is not helpful. To distinguish different error
    information, as can be used to obtain error information fed back by the system.
    Capture all abnormalities Even if the program can handle multiple exceptions,
    it is impossible to prevent them, and, likely, some exceptions are still not caught.
    In Example, if num1 is written as nmn1 when writing the program, an error message
    similar to the following will be obtained. NameError: name ''nmn1'' is not defined
    In such a case, the SyntaxError exception can be captured on the original basis.
    If there are dozens of errors in the program, it is very troublesome to catch
    these exceptions. To solve this situation, the exception clause can not specify
    the exception type, so it can handle any type of exception. To make readers understand
    better, the function of capturing all abnormalities is added as an example here.
    Example: Captures All Exceptions \# captures all exceptions try: first = input
    ("Use this as first entity") second = input ("Use this as second entity") print(int(first)/int(second))
    except : print ("You got this error") In Example, the except statement does not
    indicate the type of exception, and all possible errors of the program are uniformly
    handled in the statement. As can be seen from the results of the two runs, the
    prompt information for all exceptions is the same. Another way to catch all Exceptions
    is to use the exception class after the exception statement. Since the Exception
    class is the parent of all exception classes, all exceptions can be caught. No
    exception was caught In the if statement, when all the conditions are not met,
    the else statement is executed. Similarly, if the try statement does not capture
    any error information, it will not execute any exception statement but will execute
    the else statement. To make readers understand better, we add else statement based
    on the above example. Example else statement. py try: first = input ("Use this
    as first entity") second = input ("Use this as second entity") print(int(first)/int(second))
    except : print ("You got this error") else: print ("The program runs normally
    and no exception is caught") In Example, when an error is detected in the try
    statement, the printing statement in except will be executed and the description
    information of the exception will be output. When there is no error, the print
    statement in else will be executed. With this, we have completed a brief explanation
    of essential programming concepts. In the next chapter, we will discuss file management
    in detail. Follow along! '
  fmt: "\n# Chapter 15: Essential programming in Python\n\n在 Python 中，处理错误对于使程序正常运行至关重要。每当\
    \ Python 程序因警告和错误而停止运行时，建议向最终用户展示停止的原因。Python 程序员应通过理解 Python 中异常处理的本质来培养这项技能，这对于使程序平稳运行非常关键。本章将结合示例详细讨论此内容。\n\
    \n## 异常简介\n\n在 Python 中，程序执行期间产生的错误称为**异常**，例如列表索引越界、打开不存在的文件等。例如，运行以下程序代码时会发生错误：\n\
    \n```\nopen(data.txt)\nFileNotFound { There is no such file: 'data.txt' }\n```\n\
    \n## 异常类\n\n在 Python 中，所有异常类都是 `Exception` 的子类。异常类定义在 `Exceptions` 模块中，该模块位于 Python\
    \ 的内置命名空间中，可直接使用无需导入。\n\n在前面的章节中，程序每次在执行时遇到错误都会抛出异常。如果异常对象未被处理和捕获，程序将带着回溯信息终止执行，回溯信息包括错误名称（如\
    \ `NameError`）、原因及发生错误的行号。\n\n以下是一些常见的异常：\n\n### 1. NameError\n\n尝试访问未声明的变量会引发\
    \ `NameError`。例如：\n\n```\nprint(dude)\n```\n\n错误信息如下：\n\n```\nNameError: There\
    \ is no such namespace\n```\n\n上述信息表明解释器在任何命名空间中均未找到 `foo`。\n\n### 2. ZeroDivisionError\n\
    \n当除数为零时，会抛出 `ZeroDivisionError` 异常。例如：\n\n```\n1/0\n```\n\n错误信息如下：\n\n```\nZeroDivisionError:\
    \ division by zero is not possible\n```\n\n任何数值除以零都会导致上述异常。\n\n### 3. SyntaxError\n\
    \n当解释器发现 `SyntaxError` 时，会抛出语法错误异常。例如：\n\n```\nlist = [\"two\",\"four\",\"six\"\
    ]\nfor result in list\nprint(result)\n```\n\n在上述示例中，由于 `for` 循环后缺少冒号，程序会报以下错误信息：\n\
    \n```\nSyntaxError: This is not the correct syntax\n```\n\n`SyntaxError` 异常是唯一不在运行时发生的异常。它表示\
    \ Python 代码中不正确的结构，导致程序无法执行。这些错误通常发生在编译时，解释器无法将脚本转换为字节码。\n\n### 4. IndexError\n\
    \n当使用序列中不存在的索引时，会抛出 `IndexError` 异常。例如：\n\n```\nexample = []\nexample[0]\n```\n\
    \n在上述示例中，列表中没有元素。当使用索引 0 访问列表的第一个元素时，会出现以下错误信息：\n\n```\nIndexError: There is no\
    \ such index\n```\n\n上述信息表明列表的索引值超出了列表的范围。\n\n### 5. KeyError\n\n当在映射中使用不存在的键时，会抛出\
    \ `KeyError` 异常。例如：\n\n```\nThisresult = {'number':'explain','port':7232}\nThisresult['interpret']\n\
    ```\n\n在上述示例中，`myDict` 字典中只有 `host` 和 `port` 两个键。当获取 `interpret` 键对应的值时，会出现以下错误信息：\n\
    \n```\nKeyError: 'interpret'\n```\n\n上述信息表明字典中存在一个不存在的键 `server`。\n\n### 6. FileNotFoundError\n\
    \n当尝试打开一个不存在的文件时，会抛出文件未找到 `IOError` 异常。例如：\n\n```\nsecond = open(\"test\")\n```\n\
    \n在上述示例中，使用 `open` 方法打开名为 `test` 的文件或目录，会出现以下错误信息：\n\n```\nFileNotFoundError:\
    \ { There is nothing that exists with this name}\n```\n\n上述信息表明未找到名为 `test` 的文件或目录。\n\
    \n### 7. AttributeError\n\n当尝试访问未知对象属性时，会抛出 `AttributeError` 异常。例如：\n\n```\nclass\
    \ Aeroplane(object):\n    fly\nflight = Aeroplane()\nAeroplane.color = \"white\"\
    \n```\n\n在上述示例中，`Aeroplane` 类未定义任何属性和方法。创建 `Aeroplane` 类的实例后，`color` 属性被动态添加到\
    \ `flight` 引用的实例上，随后访问其 `color` 和 `name` 属性时出现以下错误信息：\n\n```\nAttributeError:\
    \ 'Aeroplane' object has no attribute 'value'\n```\n\n上述信息表明 `color` 属性定义在 `Aeroplane`\
    \ 实例中，因此可通过 `flight.color` 访问。然而 `name` 属性未定义，故访问 `name` 属性时会报错。\n\n下一节将详细讨论异常处理。\n\
    \n## 异常处理\n\nPython 处理异常的能力非常强大。它能准确反馈错误信息，帮助开发者精准定位问题的位置和原因。Python 使用 `try-except`\
    \ 语句处理异常。其中 `try` 语句用于检测异常，`except` 语句用于捕获异常。\n\n### 捕获简单异常\n\n`try-except` 语句定义一段用于监控异常的代码，并提供处理异常的机制。最简单的\
    \ `try-except` 语句格式如下：\n\n```\ntry:\n    # Here is the place where logic goes\n\
    except:\n    # Here we enter the error details\n```\n\n当 `try` 块中的语句发生错误时，程序将不再继续执行\
    \ `try` 块中的后续语句，而是直接执行 `except` 中处理异常的语句。\n\n为便于读者理解，以下示例演示如何使用简单的 `try-except`\
    \ 语句捕获两数相除可能引发的异常。\n\n**示例：Simple Exceptions.py**\n\n```\ntry:\n    print(\"-\"\
    *64)\n    first = input(\"You should enter the first entity\")\n    second = input(\"\
    You should enter the second entity\")\n    print(int(first)/int(second))\n   \
    \ print(\"-\"*64)\nexcept ZeroDivisionError:\n    print(\"Number 64 cannot be\
    \ divided\")\n```\n\n在该示例中，`try` 子句中的 `input` 函数接收用户输入的两个值，其中第一个值作为被除数，第二个值作为除数。如果除数为\
    \ 0，程序将抛出 `ZeroDivisionError` 异常。此时 `except` 子句将捕获该异常并打印异常信息。\n\n运行程序并在控制台输入第一个数\
    \ 64、第二个数 5，结果将显示。通过仔细分析，你将理解异常处理的工作原理。从结果可以看出，当程序出现异常时，程序不会终止，而是会根据自定义的消息提醒用户。\n\
    \n注意：只要监控到错误，程序就会执行 `except` 语句，不再执行 `try` 中未执行的语句。\n\n### 捕获异常的描述信息\n\n一个 `except`\
    \ 子句可捕获多个异常。将示例中的两个错误合并到一个 `except` 子句如下：\n\n```\ntry:\n    first = input(\"Enter\
    \ the first entity\")\n    second = input(\"Enter the second entity\")\n    print(int(first)/int(second))\n\
    except (ZeroDivisionError, ValueError):\n    print(\"Get a value\")\n```\n\n此时，无论上述两个异常中的任意一个发生，都会打印\
    \ `except` 内的语句。但仅打印一条错误信息无助于区分不同错误。可使用 `as` 关键字获取系统反馈的错误信息。\n\n### 捕获所有异常\n\n\
    即使程序能处理多个异常，也无法穷尽所有异常，仍可能有异常未被捕获。在示例中，若编写程序时将 `num1` 误写为 `nmn1`，将获得类似以下的错误信息：\n\
    \n```\nNameError: name 'nmn1' is not defined\n```\n\n此种情况下，可在原有基础上捕获 `SyntaxError`\
    \ 异常。若程序中有数十个错误，逐个捕获非常麻烦。为解决此问题，`except` 子句可不指定异常类型，从而处理任意类型的异常。\n\n为便于读者理解，此处添加捕获所有异常的功能示例。\n\
    \n**示例：Captures All Exceptions**\n\n```\n# captures all exceptions\ntry:\n   \
    \ first = input(\"Use this as first entity\")\n    second = input(\"Use this as\
    \ second entity\")\n    print(int(first)/int(second))\nexcept:\n    print(\"You\
    \ got this error\")\n```\n\n在该示例中，`except` 语句未指定异常类型，程序所有可能的错误均在该语句中统一处理。从两次运行结果可见，所有异常的提示信息相同。\n\
    \n捕获所有异常的另一种方式是在 `except` 语句后使用 `Exception` 类。由于 `Exception` 类是所有异常类的父类，因此可捕获所有异常。\n\
    \n### 未捕获异常时的处理\n\n在 `if` 语句中，当所有条件均不满足时执行 `else` 语句。同理，若 `try` 语句未捕获任何错误信息，则不执行任何\
    \ `except` 语句，而是执行 `else` 语句。\n\n为便于读者理解，我们在上述示例基础上添加 `else` 语句。\n\n**示例：else\
    \ statement.py**\n\n```\ntry:\n    first = input(\"Use this as first entity\"\
    )\n    second = input(\"Use this as second entity\")\n    print(int(first)/int(second))\n\
    except:\n    print(\"You got this error\")\nelse:\n    print(\"The program runs\
    \ normally and no exception is caught\")\n```\n\n在该示例中，当 `try` 语句检测到错误时，将执行 `except`\
    \ 中的打印语句并输出异常描述信息。当无错误时，将执行 `else` 中的打印语句。\n\n至此，我们已完成对核心编程概念的简要解释。下一章将详细讨论文件管理。\n"
