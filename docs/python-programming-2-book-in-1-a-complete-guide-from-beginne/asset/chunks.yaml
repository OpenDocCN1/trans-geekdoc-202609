  fmt: "\n# Chapter 11: Practical Project in Python\n\nIn the previous chapter, we\
    \ discussed ways to design a project. In this project, we will explain in detail\
    \ the implementation of a practical project with a lot of background information\
    \ followed by Python code. Follow along carefully.\n\n## Maintenance and Improvement\n\
    \nIt has been successfully implemented to control the shutdown or restart of the\
    \ computer through Python, but it cannot meet all requirements. Therefore, it\
    \ is necessary to solve this defect: the program can not only control the shutdown\
    \ or restart of the local computer but also remotely control the shutdown or restart\
    \ of the computer through the network. After discovering the defects of the old\
    \ version, the process of developing the new version is the maintenance and improvement\
    \ of the software.\n\n## Remote Control Channel\n\nIf you want to remotely control\
    \ the shutdown or restart of the computer, the local computer needs networking.\
    \ After networking, you also need to choose a remote-control channel, such as\
    \ Gmail, web page, or e-mail.\n\n## Controlling Python to Operate Computer 1 via\
    \ Mail\n\nAs long as it can communicate with remote, it can be used as a channel\
    \ for remote control. Therefore, there are many channels for remote control. In\
    \ this project, mail is chosen as the channel tool for remote control.\n\n## Controlling\
    \ Python to Operate Computer 2 via Mail\n\nThis project uses e-mail as a remote-control\
    \ channel to realize remote control of computers. It can be seen that the user\
