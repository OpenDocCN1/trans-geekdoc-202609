    # Chapter 3: How to install Python on your PC?


    In the previous chapters, we have discussed Python from a technical and theoretical
    perspective. From the next chapter, we will start discussing various lexical concepts
    that make Python what it is. Before discussing all those concepts, we need to
    first install Python in our system. This chapter is a tutorial that explains how
    to install Python in different operating systems. Let us start!


    ## Python Installation and Operation


    Due to Python''s cross-platform feature, Windows, Linux, and macOS systems all
    support Python''s software installation. First of all, we need to download the
    installation software.


    ### 1. Download Python


    Here we introduce the installation and operation of Python under the Windows environment.
    Since there is no built-in Python environment in the Windows operating system,
    it needs to be installed independently. The installation package can be downloaded
    from Python''s official website (`www.Python.org`). After opening the official
    website, search for the navigation bar that has a "Downloads" button. The website
    recommends a link by default because it can detect your operating system and recommend
    the latest version of Python 3.x (e.g., 3.6.5). After entering the download page
    of the corresponding version, there is a basic introduction to the environment
    you are trying to download. Several different versions are mainly aimed at different
    operating system platforms. You can choose different files to download according
    to whether your system is 32-bit or 64-bit. In the new page that opens, we can
    find other versions, including the latest test version and the required version
    3.4. If you want to install a 64-bit version of 3.6.5, click the framed link on
    the current page. At the bottom of the newly opened page, we can find several
    other links. The file that starts with the Windows entity represents the 64-bit
    version of Windows, while the file that does not include 64 represents the 32-bit
    version. The website shows a compressed installation package (`Windows x86-64
    Embedded ZipFile`), an executable installation file, and a Web-based installation
    file (`Windows x86-64`). It is most convenient to download the executable installation
    package.


    > **Note:** 64-bit version cannot be installed on a 32-bit system, but a 32-bit
    version can be installed on a 32-bit system or 64-bit system.


    ### 2. Install Python


    The Windows executable installation package is easier to install. Just like installing
    other Windows applications, we just need to select the appropriate option and
    click "Next" to complete the installation. When the options appear in the installation,
    do not rush to the next step (the system demonstrated here is 64-bit in itself).
    It must be noted that after "Add Python 3.6 to PATH" is checked and Python 3.6
    is added to the environment variable, Python''s interactive prompt or Python''s
    commands can be started directly and conveniently at the Windows command prompt
    in the future. After selecting "Add Python 3.6 to PATH", select custom installation.
    Of course, it is also possible to select the first item for installation, which
    means Python is installed in the user directory of the C disk. But at this time,
    you''d better know what the user directory is so that you can find the installed
    `Python.exe` files when necessary in the future. Proceed with the instructions
    and Python will be installed successfully in the system.


    ### 3. Start Python


    Python can be started in two ways.


    #### 1) Start Python''s Own IDLE


    If you want to run Python, you can click the "Start" button on the Windows desktop
    and enter "IDLE" in the search box that appears to launch a Python desktop application
    to quickly provide a prompt of "read-evaluate-print-loop". IDLE is Python''s own
    simple IDE (Integrated Development Environment), which is Python''s graphical
    interface editor. IDLE can be regarded as a simple version of an integrated development
    environment. Its function looks simple, but it is helpful for beginners to learn
    the Python language itself. Here, a REPL environment is provided, that is, it
    reads the user''s input ("Read"), evaluates and calculates ("Evaluate"), then
    prints the result ("Print"), and then a prompt "Loop" appears, thus circulating.


    #### 2) Start Python at Windows Prompt


    Another way to start Python is to run Python programs through the Windows command
    prompt. Enter `cmd` in the Windows search box (or press `Win+R` key to open the
    run prompt box; note the `Win` key on the keyboard), or click the Start button
    to enter `cmd` in the pop-up search box and press Enter to start the Windows command
    line window.


    > **Note:** The flashing cursor after `>` seen here is the command prompt provided
    by Windows. When installing Python, since the "Add Python 3.6 to PATH" option
    is checked and the installed Python is added to the environment variable of Windows,
    Python can be successfully started by entering `python` after the prompt `>`.
    The prompt `>>>` indicates that Python installation was successful and Python
    has been started. The prompt `>>>` is Python-specific.


    Next, `print("Hello Python!")` is executed in either the first or second startup
    mode. If you want to return to the Windows command prompt, you can reach the goal
    by pressing the shortcut key `Ctrl+Z`. The above two methods are both REPL forms,
    suitable for writing relatively short programs or commands, and have the advantages
    of simplicity and flexibility. If the program has more functions and more modules
    or packages are called, the REPL form is not very convenient to maintain.


    In this chapter, we have explained the installation of Python in detail. In the
    next chapters, we will start discussing Python syntax in detail. Follow along!

    '
