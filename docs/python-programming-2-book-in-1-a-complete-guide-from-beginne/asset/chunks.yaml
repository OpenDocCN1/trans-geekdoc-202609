    # 第 3 章：如何在您的 PC 上安装 Python？


    在前几章中，我们从技术和理论角度讨论了 Python。从下一章开始，我们将开始讨论构成 Python 特性的各种词法概念。在讨论所有这些概念之前，我们首先需要在系统中安装
    Python。本章是一个教程，解释如何在不同的操作系统中安装 Python。让我们开始吧！


    ## Python 的安装与运行


    由于 Python 的跨平台特性，Windows、Linux 和 macOS 系统均支持 Python 的软件安装。首先，我们需要下载安装软件。


    ### 1. 下载 Python


    这里我们介绍 Windows 环境下 Python 的安装与运行。由于 Windows 操作系统中没有内置 Python 环境，因此需要独立安装。安装包可以从
    Python 官方网站（`www.Python.org`）下载。打开官网后，搜索带有“Downloads”按钮的导航栏。网站会默认推荐一个链接，因为它能检测您的操作系统并推荐最新版本的
    Python 3.x（例如 3.6.5）。进入对应版本的下载页面后，会有您尝试下载环境的基本介绍。有几个不同的版本主要针对不同的操作系统平台。您可以根据您的系统是
    32 位还是 64 位选择不同的文件进行下载。在新打开的页面中，我们可以找到其他版本，包括最新的测试版和所需的 3.4 版本。如果您想安装 3.6.5 的
    64 位版本，请点击当前页面上的框选链接。在新打开页面的底部，我们可以找到其他几个链接。以 Windows 实体开头的文件代表 Windows 的 64 位版本，而不包含
    64 的文件代表 32 位版本。网站显示了一个压缩安装包（`Windows x86-64 Embedded ZipFile`）、一个可执行安装文件和一个基于
    Web 的安装文件（`Windows x86-64`）。下载可执行安装包最为方便。


    > **注意：** 64 位版本无法安装在 32 位系统上，但 32 位版本可以安装在 32 位系统或 64 位系统上。


    ### 2. 安装 Python


    Windows 可执行安装包安装起来更容易。就像安装其他 Windows 应用程序一样，我们只需选择适当的选项并点击“Next”（下一步）即可完成安装。当安装选项出现时，不要急着进入下一步（此处演示的系统本身是
    64 位的）。必须注意的是，勾选“Add Python 3.6 to PATH”将 Python 3.6 添加到环境变量后，以后可以在 Windows 命令提示符下直接方便地启动
    Python 的交互式提示符或 Python 命令。选择“Add Python 3.6 to PATH”后，选择自定义安装。当然，也可以选择第一项进行安装，这意味着
    Python 安装在 C 盘的用户目录下。但此时您最好知道用户目录是什么，以便将来在必要时能找到安装的 `Python.exe` 文件。按照说明操作，Python
    将成功安装在系统中。


    ### 3. 启动 Python


    Python 可以通过两种方式启动。


    #### 1) 启动 Python 自带的 IDLE


    如果您想运行 Python，可以点击 Windows 桌面上的“Start”（开始）按钮，在出现的搜索框中输入“IDLE”以启动一个 Python 桌面应用程序，快速提供“read-evaluate-print-loop”（读取-求值-打印循环）提示符。IDLE
    是 Python 自带的简单 IDE（集成开发环境），是 Python 的图形界面编辑器。IDLE 可被视为集成开发环境的简易版。其功能看似简单，但有助于初学者学习
    Python 语言本身。这里提供了一个 REPL 环境，即读取用户输入（“Read”）、求值计算（“Evaluate”）、然后打印结果（“Print”），接着出现提示符“Loop”，从而循环往复。


    #### 2) 在 Windows 命令提示符下启动 Python


    启动 Python 的另一种方法是通过 Windows 命令提示符运行 Python 程序。在 Windows 搜索框中输入 `cmd`（或按 `Win+R`
    键打开运行提示框；注意键盘上的 `Win` 键），或点击开始按钮在弹出的搜索框中输入 `cmd` 并按回车键启动 Windows 命令行窗口。


    > **注意：** 此处看到的 `>` 后闪烁的光标是 Windows 提供的命令提示符。安装 Python 时，由于勾选了“Add Python 3.6
    to PATH”选项并将安装的 Python 添加到了 Windows 的环境变量中，因此在提示符 `>` 后输入 `python` 即可成功启动 Python。提示符
    `>>>` 表示 Python 安装成功且已启动。提示符 `>>>` 是 Python 专用的。


    接下来，在第一种或第二种启动模式下执行 `print("Hello Python!")`。如果您想返回 Windows 命令提示符，可以通过按快捷键 `Ctrl+Z`
    实现。上述两种方法均为 REPL 形式，适合编写相对较短的程序或命令，具有简单灵活的优点。如果程序功能较多且调用更多模块或包，REPL 形式不太便于维护。


    在本章中，我们详细解释了 Python 的安装。在接下来的章节中，我们将开始详细讨论 Python 语法。请继续关注！


    '
