- raw: 'Chapter 4: Functional Programming and Comprehension ![Robot, Intelligenza
    Artificiale, Donna, In Avanti](rsrc3CH.jpg)Functions are a mathematical concept
    that can be used to repeat the tasks in a definite manner. Traditional programming
    languages adopted this in programming to automate repetitive tasks. However, with
    time developers started deploying various system functions to make programming
    languages more intuitive and operative. In this chapter, we will in detail discuss
    various functionalities that functional programming offers with a lot of examples.
    Follow along! Characteristics of Functional programming Functional programming
    contrary to the belief can cooperate with both imperative and object-oriented
    paradigms. Here are some of the objectives to remember to reconsider whether a
    programming language supports a complete functional paradigm or not. 1) Functions
    are also objects. They can be used to perform every single task that objects can
    perform. They can be used to call a function from within a function. 2) A lot
    of functional programming paradigms use recursions to loop the structures. Some
    functional programming paradigms only offer recursion for looping the tasks. 3)
    Functional programming also works with lists. They are often used to process and
    loop through the lists. 4) Functional programming is not very comfortable in dealing
    with statements. However, they can be used very effectively to evaluate the expressions
    that hold a logical entity. 5) Functional programming also offers higher-order
    functions with exact precision. Python follows all the characteristics mentioned
    above and is called a pure functional language. In the next section, we will in
    detail discuss using functions in Python. Let us go! What are functions? Functions
    are a reusable code segment that can be used to repeat the tasks all at a time
    according to the specified needs. For example, Look at the following pattern:
    '' {}'' ''{}{}'' ''{}{}{}'' For our requirement, we need to display 100 of these
    pairs in a straight line. You can use the print function to display the result
    after a lot of hard work. However, this method is not feasible and is not preferred
    by programmers. Here, functions can be used to assign the pattern and call them
    how many times we need and wherever we need. You can use a looping statement to
    loop the pattern 100 times. In the next section, we will achieve this result using
    functions in Python. Follow along! How to define a function? The function should
    be defined according to certain regular specifications that Python language possesses.
    Here is the format that functions use in Python def {Enter name of the function}
    \[ Enter the parameters here\] Here is an example: def sum(a,b) After defining
    a function all you need to do is create a step by step logical expression for
    the body of the function. How to call a function? After defining a function, you
    need to know the procedure to call it whenever you need it. Function calls can
    be achieved in Python by using the following format: Nameofthefunction () Exercise
    1: Print 100 lines of the ''{}'' pattern using a function Here is the Python code:
    def funpattern() { for (i=100;i++) { print ( " {}") i++; } } Print( " Here is
    the result") funpattern() Function parameters Parameters are necessary for functions
    to define default values. Variables are usually pointed out to parameters in the
    function and are necessary for logical execution. There are usually default parameters
    that define the essence of the function. Here is the format: \[ Function parameter
    1, Function parameter 2 ...... Function parameter n\] It is important to remember
    that the function parameter can be a dynamic number. You can usually use these
    parameters to return values. In the next section, we will give an example that
    will help you understand recursion in detail. Follow along! What is recursion?
    Recursion is a mathematical phenomenon where a function calls itself until the
    condition is satisfied. Recursion can decrease the code length of the program
    very effectively. A lot of programmers determine recursive functions as an easy
    way to achieve complete performance from the program. Here is an example: def
    result(example): if example == 0: return 0 elif example == 1: return 1 else: return
    result(example-1)+result(example-2) Explanation of the program: In the above program,
    we use a recursive function to find the Fibonacci numbers according to your input.
    Here is a list of steps that we followed: 1) First of all, we created a function
    using the def reserved keyword and the function name along with a parameter. 2)
    This function uses a single parameter ''example'' that is used to represent the
    number of Fibonacci numbers that need to be generated in the sequence. 3) In the
    next step, we created a control flow conditional statement that checks whether
    a number satisfies the Fibonacci sequence or not. 4) In the conditional statement,
    the result is always returned using the function. 5) In the next step, we use
    recursive mechanism to repeat the function logic and print the results. 6) The
    last step in the function informs to end the recursive function after it satisfies
    the parameter. This is how the python uses functional programming to generate
    results. Python also supports higher-order functions such as Lambda for advanced
    operations. How functional programming is essential for Machine Learning? It is
    mandatory to learn functional modules in Python because a lot of third-party machine
    learning supportive libraries such as Pandas use functions to generate algorithms
    and graphs. If you are not aware of defining custom functions it will become troublesome
    to generate unsupervised and supervised algorithms for a dataset. Also, it is
    easy to articulate your logical thoughts into programming using functions. To
    improve your knowledge of function modules we suggest you read the documentation
    of various third-party libraries. Higher-order functions Python supports higher-order
    functions. Version 3 provides a lot of higher-order functions such as Lambda,
    filter, reduce. This section will describe a lot of these in detail. Follow along!
    What is a higher-order function? This works in the same way as a recursion. In
    higher-order functions, parameters are also functions. You can use n number of
    functions as parameters and can obtain a function as a result. Higher-order functions
    use the iterable concept to analyze different types of functions. Python provides
    map() and reduce() functions by default. However, all other higher-order functions
    should be manually imported to make them work. A lot of data science applications
    use higher-order functions to get perfect results. a) Map A map is a Python high
    order function that can be used to transform the position of the data set. In
    machine learning, the transformation of data points is a common phenomenon and
    is essential for developing regression algorithms. Here is the format: map (Enter
    the coordinates of data set here, Iteration points) b) Filter A filter is a Python
    higher-order function that can be used to predict the data points according to
    the scenarios given. This higher-order function is largely used in prediction
    algorithms. A lot of video streaming websites such as YouTube and Netflix use
    filter to store user information to recommend the likewise videos. Here is the
    format: filter (Prediction analysis, Iteration) 3) Compose Compose is a python
    higher-order function that can in a significant order input functions as parameters.
    It can even use loops as a control flow statement to maintain the logical flow
    of the program. Compose is often used in advanced data analytics applications.
    Here is the format: compose(Enter the higher-order function here) { // Enter the
    logical statements here } Note: Higher-order functions can use the same operating
    module operations as the remaining programming components. 4) Decorators Higher-order
    functions are usually arranged syntactically as function parameters. However,
    decorators are used to syntactically used to arrange higher-order functions such
    as lambda functions in correct sequential order. Decorators can take higher-order
    functions as arguments and output the instances. Here is the format: Decorator(Enter
    higher-order function 1, Enter higher-order function 2) Decorators can also be
    used to implement coroutines and develop complex applications that can take coroutines
    as function arguments. Decorators can also be very handy while dealing with any
    debugging and run-time errors. To develop machine learning applications, it is
    always recommended to learn in-depth about different higher-order functions and
    the parameters they can regulate expressions with. You can look at Python documentation
    to know about the different types of higher-order functions that are available.
    With this, we have completed a brief introduction to functional programming in
    Python. In the next chapter, we will discuss the operator module in detail. Let
    us go! '
