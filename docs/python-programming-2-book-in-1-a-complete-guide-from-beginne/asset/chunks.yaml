    \ 'password')\n# (235, B' ok authenticated')\ncontent = MIMEText('I am the specific\
    \ content of the mail! This email is mainly used to test whether it can be sent.')\n\
    content['from'] = 'sample@rediffmail.com'\ncontent['to'] = 'example@rediffmail.com,\
    \ abcdefg'\n```\n\nAfter running the above code, the mail is sent to the specified\
    \ mailbox through Python code. At this time, the receiver's mailbox will display\
    \ the relevant email information just sent.\n\nIt can be seen that the relevant\
    \ mail has been received in the receiver's mailbox. If you can't find it in your\
    \ inbox, you can try to find it in the trash. To avoid entering the trash, you\
    \ can add the sender's email address to the white list.\n\nNow, the related functions\
    \ can be realized through Python code. Next, we will integrate the above functions\
    \ to complete the development of the whole project. At present, the core business\
    \ logic processing part of this project is written. The main idea is: firstly,\
    \ establish a function to control the shutdown of the local computer, a function\
    \ to control the restart of the local computer, a function to read the header\
    \ of the first email of the designated email, a function to send the corresponding\
    \ content to the designated email, etc. Then write a `while` loop in which you\
    \ log in to the specified email regularly and read the header of the first email.\
    \ If the title is certain specified information, the corresponding custom function\
    \ is called to perform the corresponding operation, for example, the title is\
    \ \"shutdown\", and the shutdown function can be called to control the shutdown\
    \ of the local computer. After performing the corresponding operation, call the\
    \ mail sending function to send a new mail to the specified mailbox. It should\
    \ be avoided that the title of the new mail is the same as the specified information\
    \ defined by us. In this way, when the software monitors the title of the latest\
    \ mail in the mailbox next time, it will not perform the previous operation endlessly,\
    \ because the title of the latest mail has been reset at this time.\n\nThe complete\
    \ code of this project is as follows:\n\n```python\ndef restart():\n    import\
    \ os\n    # restart\n    os.system('shutdown -r')\n    print(\"restart command\
    \ executed successfully\")\n\ndef shutdown():\n    import os\n    # shutdown\n\
    \    os.system('shutdown -s')\n    print(\"shutdown command executed successfully\"\
    )\n\ndef read_mail():\n    import poplib\n    import time\n    from email.header\
    \ import decode_header\n    from email.parser import Parser\n\n    mail = poplib.POP3('pop.rediff.com')\n\
    \    mail.user('weiweitest789@rediff.com')\n    mail.pass_('password')  # password\
    \ omitted for security\n    # detect\n    # ... logic to get latest mail subject\
    \ ...\n    return subject\n\ndef send_mail(subject, body):\n    import smtplib\n\
    \    from email.mime.text import MIMEText\n    # ... logic to send mail ...\n\
    \    pass\n\n# Main loop\nwhile True:\n    time.sleep(5)  # every 5s\n    # While\
    \ the program is running, wait for remote instructions.\n    subject = read_mail()\n\
    \    if subject == \"Restart\":\n        restart()\n        send_mail(\"test\"\
    , \"Restart executed\")\n    elif subject == \"Shut Down\":\n        shutdown()\n\
    \        send_mail(\"test\", \"Shutdown executed\")\n```\n\nAs long as the above\
    \ program is executed on the local computer, the computer will always listen to\
    \ remote instructions. For example, the computer in the home runs the above program\
    \ now, but you are in the office. At this time, you can send an email titled \"\
    Restart\" to `weiweitest789@rediff.com` (that is, the email address monitored\
    \ in the program), and the computer in the home will automatically restart. If\
    \ you send an email titled \"Shut Down\" to the email, the computer in the home\
    \ will automatically shut down. At this time, you can remotely control the computer\
    \ to restart or shut down.\n\nFor example, now send a message titled \"Shut Down\"\
    \ remotely to the email address (`weiweitest789@rediff.com`) monitored in the\
    \ program. While the program is running, wait for the remote instruction shutdown\
    \ instruction to execute successfully. Then the computer automatically performs\
