  fmt: "\n# Chapter 8: Generators in Python\n\nIn the previous chapter, we discussed\
    \ iteration principles in detail with a couple of examples. In this chapter, we\
    \ will move forward and discuss generators in Python in detail. This is a complex\
    \ topic necessary for developing machine learning applications. We suggest learning\
    \ to develop Python generators using practical projects.\n\n## What are generators?\n\
    \nGenerators are very similar to functions in Python. The only difference between\
    \ functions and generators is that the latter uses the `yield` keyword to return\
    \ values. So, as a simple rule, just remember that whenever you see a `yield`\
    \ keyword in a Python programming example, it is automatically a generator function.\n\
    \nHere is the format:\n\n```\ndef {Enter the function name here}\n    yield\n\
    ```\n\n## What are the generator objects?\n\nGenerator objects are formed when\
    \ a generator function is created from scratch. They are usually implemented by\
    \ the method structures present in the Python programming syntax. Always remember\
    \ that objects are object-oriented systematic structures and can result in mishaps\
    \ if not coordinated well.\n\nHere is the format:\n\n```\ngenerator {Enter the\
    \ statement here}\nobject = // enter the generator expressions\n```\n\n## What\
    \ are the applications of generators?\n\nGenerators are usually used to deal with\
    \ complex calculations. They can also be used to create iterable functions that\
    \ are not coordinated well. They can be used to create complex Fibonacci sequences.\
    \ Generators are extensively used to develop artificial intelligence applications.\
    \ A lot of embedded systems also use generators for faster implementation of hardware\
    \ resources.\n\nIn the next section, we will explain generator principles in detail\
    \ using a Fibonacci sequence example.\n\nHere is the code:\n\n```\ndef fibonacciexam(parameters):\n\
    \    first, second = 3, 4\n    # use generators\n    yield x.first()\n    x.second()\n\
    \    # generator expression\n    yield.fib()\n    for (to display results)\n```\n\
    \nIn this example, the following implementation occurs:\n\n1.  First of all, you\
    \ need to create a definition to initiate the procedure of creating a Fibonacci\
    \ sequence. You can enter your desired values as input to start the procedure.\n\
    2.  In the next step, you need to start using generators with the help of the\
    \ `yield` keyword to assign values to these variables. Here, variables represent\
    \ the iteration principle that we are going to look at in the next step.\n3. \
    \ Afterward, you need to create objects to represent the generator expression\
    \ mechanism. You can use these objects to iterate through the variables and create\
    \ a varied sequence that follows the Fibonacci sequence.\n4.  In the end, we again\
    \ use generators to print the results.\n\nWith this program, we understood that\
    \ generators can decrease the resources that usually need to be taken care of.\n\
    \n## How generators can be used in machine learning?\n\nGenerators are an excellent\
    \ component principle to train a scientific model. A lot of machine learning projects\
    \ use a supervised model to perform operations. A supervised learning system hugely\
    \ depends on preprocessing techniques to display varied results. To decrease overfitting\
    \ problems in machine learning models, generators can be used. You can use arrays\
    \ to implement generators in Python.\n\nIn the next section, we will give an example\
    \ that will help you understand the advantages of generators in Python.\n\nHere\
    \ is the Python code:\n\n```\n# create a list\nList-name = (Enter the values here)\n\
    \ndef machine():\n    obj1 = gen(parameters)\n    obj2 = gen.machine\n    yield\
    \ next(obj1)\n```\n\nYou can use generators to create ranges between the data\
    \ points. Here `yield` represents the generator expression. Machine learning is\
    \ an extensive subject and learning generators will help you create models without\
    \ any underfitting and overfitting errors.\n\nWith this, we have completed a small\
    \ explanation about the generator. In the next chapter, we will discuss designing\
    \ a project in detail.\n"
  trans: "\n\n# 第 8 章：Python 中的生成器\n\n在上一章中，我们结合几个示例详细讨论了迭代原则。在本章中，我们将进一步深入探讨 Python\
    \ 中的生成器。这是一个开发机器学习应用所必需的复杂主题。我们建议通过实战项目来学习开发 Python 生成器。\n\n## 什么是生成器？\n\n生成器与\
    \ Python 中的函数非常相似。函数与生成器的唯一区别在于，后者使用 `yield` 关键字来返回值。因此，作为一条简单的规则，只需记住：每当你在 Python\
    \ 编程示例中看到 `yield` 关键字时，它自动就是一个生成器函数。\n\n格式如下：\n\n```\ndef {在此输入函数名}\n    yield\n\
    ```\n\n## 什么是生成器对象？\n\n生成器对象是在从头创建生成器函数时形成的。它们通常由 Python 编程语法中存在的方法结构实现。请始终记住，对象是面向对象的系统性结构，如果协调不当可能会导致事故。\n\
    \n格式如下：\n\n```\ngenerator {在此输入语句}\nobject = // 输入生成器表达式\n```\n\n## 生成器有哪些应用？\n\
    \n生成器通常用于处理复杂计算。它们也可用于创建协调不佳的可迭代函数。它们可用于创建复杂的斐波那契数列。生成器被广泛用于开发人工智能应用。许多嵌入式系统也使用生成器以更快地实现硬件资源。\n\
    \n在下一节中，我们将使用斐波那契数列示例详细解释生成器原理。\n\n代码如下：\n\n```\ndef fibonacciexam(parameters):\n\
    \    first, second = 3, 4\n    # use generators\n    yield x.first()\n    x.second()\n\
    \    # generator expression\n    yield.fib()\n    for (to display results)\n```\n\
    \n在该示例中，会发生以下实现过程：\n\n1.  首先，你需要创建一个定义以启动创建斐波那契数列的过程。你可以输入所需的值作为输入来启动该过程。\n2.\
    \  在下一步中，你需要在 `yield` 关键字的帮助下开始使用生成器，以便为这些变量赋值。在这里，变量代表我们将在下一步中要查看的迭代原则。\n3. \
    \ 随后，你需要创建对象来表示生成器表达式机制。你可以使用这些对象来遍历变量并创建一个遵循斐波那契数列的变化序列。\n4.  最后，我们再次使用生成器来打印结果。\n\
    \n通过该程序，我们了解到生成器可以减少通常需要处理的资源。\n\n## 生成器如何用于机器学习？\n\n生成器是训练科学模型的一个优秀组件原则。许多机器学习项目使用监督模型来执行操作。监督学习系统高度依赖预处理技术来显示各种结果。为了减少机器学习模型中的过拟合问题，可以使用生成器。你可以使用数组在\
    \ Python 中实现生成器。\n\n在下一节中，我们将给出一个示例，帮助你理解生成器在 Python 中的优势。\n\nPython 代码如下：\n\n\
    ```\n# create a list\nList-name = (Enter the values here)\n\ndef machine():\n\
    \    obj1 = gen(parameters)\n    obj2 = gen.machine\n    yield next(obj1)\n```\n\
    \n你可以使用生成器在数据点之间创建范围。这里 `yield` 代表生成器表达式。机器学习是一个广泛的学科，学习生成器将帮助你创建没有任何欠拟合和过拟合错误的模型。\n\
    \n至此，我们完成了关于生成器的简要解释。在下一章中，我们将详细讨论设计项目。\n\n"
