- raw: 'Chapter 12: Machine learning in Python Machine learning is a branch of computer
    science that extracts valuable information from the huge chunks of data that is
    available. It uses various computer science and statistics principles to create
    a well versed artificial intelligent application. Machine learning has been a
    prominent field in research for decades. However, in the 21st century with the
    development of high-level computing machines, Machine learning applications rose
    into an all-time high. Almost all web applications use Machine learning algorithms
    to suggest recommendations for the user. This chapter is a detailed step-by-step
    material that will help you understand the importance of Machine learning in day-to-day
    life and will also introduce you to using Python as a supportive language to develop
    Machine learning applications. Follow along! Machine learning in Day-to-Day life
    Before starting with the technical stuff, we will give a real-world example to
    help you understand the importance of machine learning algorithms in real life.
    Imagine using a virtual assistant such as Siri/Google Assistant to ask your questions
    regarding the best restaurant in your surroundings. When you ask this question,
    the virtual assistant analyzes huge data that is present and selects a restaurant
    according to your requirements. This is how an actual search query works. Machine
    learning adds a layer of functionality to it. It monitors how you have reacted
    to the result and improves itself and produces better results the next time. So,
    to say in a single sentence: " Machine learning is a computer learning scenario
    where the machine improves itself with time" Applications of Machine Learning
    At the initial stages, Machine learning is used to automate decision making with
    the help of various algorithms that have been developed by then. This exact branch
    of machine learning is known as supervised learning. There is also another branch
    of machine learning known as unsupervised learning where the machine generates
    new algorithms by itself according to the datasets provided. For example, Machine
    learning algorithms are used to develop Spam filter mails in the 2000s. Mail developers
    used all the spam words that they have collected and made an algorithm to automatically
    send the suspected mail to the spam folder. You may wonder that this is just a
    normal spam filter application but this spam filter software automatically updates
    itself with the new spam filter database. Machine learning systems learn all the
    way while doing the work they are told to do. In the next section, we will in
    detail discuss the applications of Machine learning in detail. Follow along! a)
    They are used in Medical clinical analysis Machine learning can be used to develop
    applications that can detect the medical tumor or the skin diseases that patients
    are suffering by checking the thousands of clinical photos that are collected.
    They can also be used to conduct a differential diagnosis for the patient at the
    same time. b) Security Machine learning can be used to develop applications that
    can increase the security of online transactions. A lot of fraudulent credit card
    operations follow a pattern and it is often easy by machine learning algorithms
    to block the fraudulent transactions. c) Image processing Machine learning can
    be used to develop applications that can detect your face. This branch of machine
    learning is known as Deep learning and is quite famous among the industry. d)
    Recommendations A lot of websites rely on cloud user data to give the same recommendations
    that the users may like. E-commerce websites Like amazon analyze the user data
    and provide recommendations that the users may likely buy. All these recommendations
    are generated using different machine learning algorithms that the websites use.
    5) Categorizing Machine learning algorithms can also be used to categorize the
    data that is collected using different topics. This is known as the regression
    algorithm and can be very useful if done in the right way for e-commerce and streaming
    applications. With this, we have completed a brief introduction that explains
    the application of Machine learning. In the next section, we will discuss the
    usage of Python in Machine learning applications. Let us go! Why Python is considered
    best for Machine Learning? Python is considered best because it consists of libraries
    for every available computer stream. There are libraries for statistics and visualization
    that can be explicitly used for data analysis. Python also is very interactive
    and can interact with the data points using software such as Jupyter notebook.
    Also, remember that machine learning is a computational process that highly depends
    on the iteration levels. Python is an interactive language and is thus considered
    the best programming language for machine learning. Here are some of the Python
    libraries that are essential for developing Machine learning Projects. a) Scikit
    Learn This is a fundamental machine learning library consisting of different famous
    machine learning algorithms. Scikit learn consists of a documentation file where
    there is sufficient information about every algorithm that is present. It is particularly
    famous among computer scientists because it curates a lot of essential algorithms
    in one library. A lot of machine learning algorithms present in scipy can be easily
    deployed to your software. First of all, install the scikit learn in your system
    using the following command: root @ tony : pipi install { Enter the dependencies}
    scikit What are the dependencies that are required? You need to install Anaconda
    a Python module for making sci-kit learn work. Anaconda consists of a lot of Python
    modules that are essential to run machine learning algorithms. b) Jupyter notebook
    This is a python tool that will help you to run the program code in the browser.
    It is important to note that Jupyter also supports different languages. So, if
    you have any code of other languages you can integrate it with python to get desirable
    results. C) NumPy As said before, Machine learning is a branch of computer science
    that is a combination of mathematics, statistics and computer science. To make
    efficient machine learning programs it is essential to use statistical algorithms
    that NumPy offers. NumPy is a python library that consists of multidimensional
    arrays and higher-order mathematical functions. NumPy is usually used to represent
    or find out data points in the data set. d) SciPy Machine learning in the initial
    stages is a complete scientific field. A lot of algorithms are developed to find
    out an easy way to deal with programming high computing machines. SciPy is a python
    library that deals with scientific computing. It is important because it consists
    of higher-order mathematical functions that can be used in deep learning applications.
    SciPy modules can also be used to create sparse matrices. e) matplotlib It is
    important to visualize the data while developing machine learning applications.
    A lot of statistical graphs can be used to create visualization such as histograms
    and scatters. Data set can be visualized using the matplotlib in Python. This
    library can help you to provide an interactive environment while dealing with
    huge chunks of data. f) pandas Data analysis is also a branch of machine learning
    and requires pandas to analyze the data by using data frames. Using pandas, you
    can create programs that can query and select the data. It is important to master
    pandas to analyze CSV files. These are some of the important Python libraries
    that are essential to master machine learning. It is also important to remember
    that Python 3 is mandatory to run all of these libraries mentioned. So, make sure
    you are aware of all the Python 3 programming basics. In the next section, we
    will explain a simple example that will help you understand the process of machine
    learning. It is quite theoretical for now. However, you can always fill your gaps
    with research. Python is still iterating and is not forward compatible, which
    also causes the current Python to split into two major versions, namely Python
    2.X and Python 3.x. Although it is not yet grammatically two languages, the two
    codes cannot be mixed, and the choice of the version is also the first thing to
    be determined when learning to use Python. Previously, it was generally believed
    that Python 2.X had a longer development time and more and more mature support
    libraries in various aspects. many people recommended starting with this version. 
    However, as the Python team announced that it would stop maintaining Python 2.X
    in 2020, all major communities have already started the migration from 2.X to
    3.X, so it is more recommended to choose 3.X when learning Python now. Python
    is a general programming language, and its syntax satisfies Turing completeness,
    which cannot be fully explained here.  However, if you are familiar with the C
    or Java language, you can think of Python''s syntax as a highly condensed version
    of them. In addition to the above-mentioned need not make type declarations, Python
    also lacks curly braces to indicate scope and semicolons at the end of statements.
    At the same time, the indentation in Python is not only a code specification but
    also a mandatory requirement at the syntax level.  If you have a language foundation
    and remember these differences, you should be able to use Python skillfully and
    quickly. Strategy for learning Machine learning with Python Generally speaking,
    there are two ways to practice algorithm theory. One is to implement the algorithm
    with code by oneself. The other is to make full use of the convenience of the
    tool, quickly understand and grasp the existing resources, and then begin to solve
    practical problems.  I think it is very difficult to decide on whether to build
    wheels again. Each method has its advantages and disadvantages. After the rapid
    development of machine learning in recent years, it has accumulated very rich
    open resources. By making full use of these resources, you can quickly master
    and solve practical problems even if you did not know this field before. First
    is the programming language, we choose Python.  In the past few years, Python
    and R languages have maintained a dual situation in the field of machine learning.
    It can be generally considered that the industry prefers Python while academia
    prefers R. However, with the development of technology, Python language has become
    the undisputed "eldest brother" in the field of machine learning, especially after
    the support library required for in-depth learning in recent years has been implemented
    in Python without exception.  Due to the popularity of machine learning, Python
    even has the strength to compete with the traditional programming languages C
    and Java and tends to lag in the ranking of many programming languages.  The next
    step is to support the library Numpy.  Machine learning involves a large number
    of mathematical operations such as matrix operations. Fortunately, Python has
    two major characteristics, one is flexibility, and the other is a large number
    of libraries. Numpy is a professional support library specially designed for scientific
    computing in Python and is well-known in the industry.  Not only machine learning,
    but also other scientific fields such as mathematical operations involved in astrophysics,
    either directly use NumPy or build higher-level functional libraries based on
    NumPy. Finally, is the algorithm library Scikit-Learn.  There are many Python-based
    machine learning algorithm libraries. However, Scikit-Learn is always at the top
    of the list. It not only has a complete range of types but also can find the corresponding
    API for the machine learning algorithms available on the market. It is simply
    a "supermarket of machine learning algorithms". Besides, it is well packaged and
    has a clear structure. You can complete the call of a complex algorithm through
    a few simple lines of code. It is a good introduction to the field of machine
    learning, and it is also an advanced magic weapon. Famous Machine Learning Algorithms
    Common machine learning algorithms are as follows: (1) Linear Regression Algorithm
    This is the most basic machine learning algorithm, but although sparrows are small
    and have all five organs, this algorithm can be called the "Hello World" program
    in the field of machine learning algorithms. It uses linear methods to solve regression
    problems. (2) Logistic regression classification algorithm This is the "twin brother"
    of the linear regression algorithm. Its core idea is still the linear method,
    but a "waistcoat" named Logistic function is set up, which enables it to solve
    classification problems.  (3) KNN classification algorithm This algorithm is the
    only one of the classification algorithms introduced in this book that does not
    rely on mathematical or statistical models but purely relies on "life experience".
    It solves the classification problem through the idea of "finding the nearest
    neighbor". Its core idea has a far-reaching relationship with the consensus mechanism
    in blockchain technology. (4) Naive Bayesian classification algorithm This is
    a set of algorithms that can refresh your world outlook. It believes that the
    results are not deterministic but probabilistic. What you see in front of your
    eyes is only the results with the greatest probability.  Of course, the algorithm
    is used to solve the problem. Naive Bayesian classification algorithm solves the
    classification problem. (5) Support Vector Machine Classification Algorithm If
    the Logistic regression classification algorithm is the most basic linear classification
    algorithm, then the support vector machine is the highest form of linear classification
    algorithm and is also the most "mathematical" machine learning algorithm.  The
    algorithm uses a series of stunning mathematical techniques to map linearly indivisible
    data points into linearly separable data points and then uses the simplest linear
    method to solve the problem.  (6)K-means clustering algorithm Supervised learning
    is a mainstream method of machine learning at present, but sample marking needs
    a lot of labor costs, which is prone to the problem of large sample accumulation
    scale but insufficient marking.  Unsupervised learning is a machine learning algorithm
    that does not rely on labeled samples. (7) Neural Network Classification Algorithm
    Many people think that this algorithm is bionic, and the object of imitation is
    our brain.  The neural network classification algorithm is also the starting point
    of the popular depth learning algorithm. With this, we have completed a thorugh
    introduction to machine learning using Python. In the next chapter, we will in
    detail discuss about classes and objects in Python. Follow along! '
