    \ 网站，点击“Pin Manager”，你的文件将出现在此页面！\n\n### 取消远程固定\n\n```\n$ ipfs pin remote rm --service=pinata\
    \ -name=hello.txt your_file_hash\n```\n\n返回 Pinata 网站，点击“Pin Manager”，你的文件将不再出现在此页面，这意味着你的文件已被取消固定。\n\
    \n---\n\n# 使用 Fleek 在 IPFS 上托管你的网站\n\nFleek 允许你基于开放 Web 协议构建，并由基础设施提供支持。在专注于创建用户控制、加密、私有、P2P\
    \ 体验的无需许可、开放技术上构建和托管你的网站、应用、DApp 和其他服务。\n\n- [`fleek.co`](https://fleek.co)\n\
    - [View on YouTube](https://youtu.be/_lNZd8L7gCE)\n\n| 预计时间 | 5 分钟 |\n\n## 命令概览\n\
    \n| 命令 | 说明 |\n| --- | --- |\n| `git clone` | 将仓库克隆到新创建的目录中。 |\n| `npm install`\
    \ | 在本地 `node_modules` 文件夹中安装依赖项。 |\n| `fleek login` | 登录到你的 Fleek 账户。 |\n| `fleek\
    \ site:init` | 在本地目录中初始化 Fleek 网站。 |\n| `fleek site:deploy` | 部署发布目录中的更改。 |\n\n\
    ## 操作步骤\n\n### 登录 Fleek\n\n前往 [`fleek.co`](https://fleek.co)，使用你的账户登录。\n\n###\
    \ 克隆现有仓库\n\n在 VS Code 中，打开 Bash 终端：\n\n```\n$ git clone https://github.com/johnnymatthews/random-planet-facts\n\
    ```\n\n### 安装 Fleek 命令行工具\n\n在 VS Code - Bash 终端中：\n\n```\n$ npm install -g @fleekhq/fleek-cli\n\
    ```\n\n### 登录 Fleek\n\n（你将被提示在浏览器中完成流程）\n\n```\n$ fleek login\n```\n\n### 初始化\
    \ Fleek 网站\n\n在当前目录中初始化 Fleek 网站：\n\n```\n$ fleek site:init\n```\n\n选择你想要使用的团队（使用箭头键选择）。选择你想要使用的网站（使用箭头键选择）。选择部署的公共目录。\n\
