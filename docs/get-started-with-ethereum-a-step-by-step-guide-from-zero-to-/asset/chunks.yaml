    \n![](img/Image00029.jpg)\n\n---\n\n# ENS - Ethereum Name Service\n\n## 在你的钱包中接收任何加密货币、代币或\
    \ NFT 上注册你的 ENS\n\n以太坊域名服务（ENS）是一项服务，它使通过简单的名称而不是长而复杂的字母和数字字符串来发送和接收加密货币以及访问特殊网站变得容易。\n\
    \n- [`ens.domains`](https://ens.domains)\n- [View on YouTube](https://youtu.be/ETQiKiu2KKc)\n\
    \n| 预计时间 | 3 分钟 |\n\n## 前置要求\n\n- Install and Setup MetaMask Wallet\n\n## 搜索你的域名\n\
