- raw: "Add Files to IPFS A computer running IPFS can ask all the peers it's connected\
    \ to whether they have a file with a particular hash and, if one of them does,\
    \ they send back the whole file. Without a short, unique identifier like a cryptographic\
    \ hash, that wouldn't be possible. [https://ipfs.io](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293510000&usg=AOvVaw1baEc1cpfOituSzR6oAvPn)\
    \ [View on YouTube](https://www.google.com/url?q=https://youtu.be/UAy1llcOcJw&sa=D&source=editors&ust=1624824293510000&usg=AOvVaw0PsTfdmK2DLBhjBbxJjwcC)\
    \ \n\n| ESTIMATED TIME  || 2 minutes  |\n\n| --- | --- |\n\n| PRE REQUIREMENTS\
    \  |\n\n| --- |\n\n| [Create Your IPFS Node](#text00022.html#a2ZM)  |\n\n| COMMAND\
    \ OVERVIEW  |\n\n| --- |\n\n| ipfs daemon  |\n\n| Start IPFS local server on 127.0.0.1:5001.\
    \  |\n\n| echo \"<text>\" > <file>  |\n\n| Output a given text to a new file.\
    \  |\n\n| ipfs add <file>  |\n\n| Add file to your IPFS local node.  |\n\n| ipfs\
    \ cat <hash>  |\n\n| View IPFS file content.  |\n\nAdding the file VS CODE - BASH\
    \ TERMINAL \n\n| TERMINAL  |\n\n| --- |\n\n| $ ipfs daemon  \n\n$ echo \"test\"\
    \  hello.txt  \n\n$ ipfs add hello.txt  |\n\nThe file was added to ipfs resulting\
    \ in a hash identifier Viewing the file content on the console VS CODE - BASH\
    \ TERMINAL \n\n| TERMINAL  |\n\n| --- |\n\n| $ ipfs cat \"hash\"  |\n\nYou will\
    \ see the file content be displayed Checking the file in the web ui Got to http://127.0.0.1:5001/webui\
    \ Click on \"files\" Click on \"pins\" Copy the hash Find by this hash, you can\
    \ see that this hash exists Viewing the file content in the browser Open a new\
    \ tab ipfs://\"hash\" Now you can see your file content in the browser \n\nSetup\
    \ IPFS Browser Extension IPFS Companion allows you locally running IPFS node directly\
    \ inside your favorite browser, enabling support for ipfs:// addresses, automatic\
    \ IPFS gateway loading of websites and file paths, easy IPFS file import and sharing,\
    \ and more. [https://ipfs.io](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293523000&usg=AOvVaw11Kk0Z_w_C-9YBtpEKrntX)\
    \    [View on YouTube](https://www.google.com/url?q=https://youtu.be/eVOd6vd2fGc&sa=D&source=editors&ust=1624824293524000&usg=AOvVaw04tLx6JDH22cd5nP7ThY3t)\
    \ \n\n| ESTIMATED TIME  || 3 minutes  |\n\n| --- | --- |\n\n| PRE REQUIREMENTS\
    \  |\n\n| --- |\n\n| [Create Your IPFS Node](#text00022.html#a2ZM)  |\n\n| COMMAND\
    \ OVERVIEW  |\n\n| --- |\n\n| ipfs daemon  |\n\n| Start IPFS local server on 127.0.0.1:5001.\
    \  |\n\nInstalling the browser extension Go to [IPFS Companion Extension](https://www.google.com/url?q=https://chrome.google.com/webstore/detail/ipfs-companion/nibjojkomfdiaoajekhjakgkdhaomnch?hl%3Den&sa=D&source=editors&ust=1624824293529000&usg=AOvVaw2tEwx14yEyllZu9wRErQKf)\
    \ Click on “Add to Brave” or the name of your browser Click on “Add extension”\
    \ Click on extensions icon and pin “IPFS Companion” to extensions bar Configuring\
    \ the node type Click on “IPFS Companion” icon Click on “gear” icon On “IPFS Node\
    \ Type” select “External” Starting an external node Go to Visual Studio Code Open\
    \ a new terminal VS CODE - BASH TERMINAL \n\n| TERMINAL  |\n\n| --- |\n\n| $ ipfs\
    \ daemon  |\n\nImporting a file Click on “IPFS Companion” icon Click on “Import”\
    \ Click on “Pick a file” Select a file from your local disc The file will be stored\
    \ in your ipfs node \n\nPin and Unpin IPFS Files on Local Node To ensure that\
    \ data persists on IPFS, and is not deleted during garbage collection, data can\
    \ be pinned to one or more IPFS nodes. Pinning gives you control over disk space\
    \ and data retention. As such, you should use that control to pin any content\
    \ you wish to keep on IPFS indefinitely. The default behavior for IPFS is to pin\
    \ files to your local IPFS node. [https://ipfs.io](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293532000&usg=AOvVaw14MFFSLQLRpUz6efw6ws_v)\
    \    [View on YouTube](https://www.google.com/url?q=https://youtu.be/POdQACj-jRI&sa=D&source=editors&ust=1624824293533000&usg=AOvVaw1Wy1-R77UmY-SuEHo3pkxq)\
    \ \n\n| ESTIMATED TIME  || 3 minutes  |\n\n| --- | --- |\n\n| PRE REQUIREMENTS\
    \  |\n\n| --- |\n\n| [Create Your IPFS Node](#text00022.html#a2ZM)  |\n\n| COMMAND\
    \ OVERVIEW  |\n\n| --- |\n\n| ipfs daemon  |\n\n| Start IPFS local server on 127.0.0.1:5001.\
    \  |\n\n| echo \"<text>\" > <file>  |\n\n| Output a given text to a new file.\
    \  |\n\n| ipfs add <file>  |\n\n| Add file to your IPFS local node.  |\n\n| ipfs\
    \ cat <hash>  |\n\n| View IPFS file content.  |\n\nStarting your local node VS\
    \ CODE - BASH TERMINAL \n\n| TERMINAL  |\n\n| --- |\n\n| $ ipfs daemon  |\n\n\
    Adding file to your node VS CODE - BASH TERMINAL \n\n| TERMINAL  |\n\n| --- |\n\
    \n| $ echo \"world\"  > hello.txt  \n\n$ ipfs add hello.txt  |\n\nWhen you add\
    \ a file, this is automatically pinned to your local node. Checking the file was\
    \ added VS CODE - BASH TERMINAL \n\n| TERMINAL  |\n\n| --- |\n\n| $ ipfs cat your\\\
    _file\\_hash  |\n\nVerifying your file was pinned Go to [http://127.0.0.1:5001/webui](https://www.google.com/url?q=http://127.0.0.1:5001/webui&sa=D&source=editors&ust=1624824293544000&usg=AOvVaw3YWLkn7BQ_YxuWJvWtoHJt)\
    \ Click on “Files” Click on “Pins” Your file is there! Unpinning your file VS\
    \ CODE - BASH TERMINAL \n\n| TERMINAL  |\n\n| --- |\n\n| $ ipfs pin rm your\\\
    _file\\_hash  |\n\n![](Image00028.jpg)Pinning your file manually VS CODE - BASH\
    \ TERMINAL \n\n| TERMINAL  |\n\n| --- |\n\n| $ ipfs pin add your\\_file\\_hash\
    \  |\n\nYour file was pinned again \n\nPin and Unpin Files on Remote Node using\
    \ Pinata It's also possible to pin your files to a remote pinning service. These\
    \ third-party services give you the opportunity to pin files not to your own local\
    \ node, but to nodes that they operate. You don't need to worry about your own\
    \ node's available disk space or uptime. While you can use a remote pinning service's\
    \ own GUI, CLI, or other dev tools to manage IPFS files pinned to their service,\
    \ you can also work directly with pinning services using your local IPFS installation\
    \ — meaning that you don't need to learn a pinning service's unique API or other\
    \ tooling. [https://ipfs.io](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293548000&usg=AOvVaw0VSY8BUfCvuDgwERgg3yG5)\
    \    [https://pinata.cloud](https://www.google.com/url?q=https://pinata.cloud&sa=D&source=editors&ust=1624824293549000&usg=AOvVaw1qcUHfmnL8hVloIQhkcdOT)\
    \    [View on YouTube](https://www.google.com/url?q=https://youtu.be/0bC_YGrJAkA&sa=D&source=editors&ust=1624824293549000&usg=AOvVaw1-XdElxsKyE8Zvj1agIza6)\
    \ \n\n| ESTIMATED TIME  || 4 minutes  |\n\n| --- | --- |\n\n| PRE REQUIREMENTS\
    \  |\n\n| --- |\n\n| [Create Your IPFS Node](#text00022.html#a2ZM)  |\n\n| COMMAND\
    \ OVERVIEW  |\n\n| --- |\n\n| ipfs pin remote service add pinata <endpoint> <jwt\\\
    _key>  |\n\n| Add a new remote pinning service.  |\n\n| ipfs pin remote service\
    \ ls  |\n\n| List existing pinning services added.  |\n\n| ipfs add <file>  |\n\
    \n| Add file to your IPFS local node.  |\n\n| ipfs cat <hash>  |\n\n| View IPFS\
    \ file content.  |\n\n| ipfs pin remote add --service=pinata -name=<file> <hash>\
    \  |\n\n| Pin your file to the remote IPFS pinning service.  |\n\n| ipfs pin remote\
    \ rm --service=pinata -name=<file> <hash>  |\n\n| Unpin your file from the remote\
    \ IPFS pinning service.  |\n\nSetting up API Keys on Pinata Log in on your Pinata\
    \ account Go to “API Keys” Click on “New Key” Check “Admin” Use “admin-cli” as\
    \ your “Key Name” Click on “Create Key” A new key will be generated to you Copy\
    \ the “JWT” value from this window Setting up Pinata as a remove service on your\
    \ terminal Add Pinata as a pinning remote service VS CODE - BASH TERMINAL \n\n\
    | TERMINAL  |\n\n| --- |\n\n| $ ipfs pin remote service add pinata https: //api.pinata.cloud/psa\
    \ your\\_jwt\\_key  |\n\nList all existing remote services and check that Pinata\
    \ is there \n\n| TERMINAL  |\n\n| --- |\n\n| $ ipfs pin remote service ls  |\n\
    \nAdding a new file to your local IPFS node Add Pinata as a pinning remote service\
    \ VS CODE - BASH TERMINAL \n\n| TERMINAL  |\n\n| --- |\n\n| $ echo \"world\"  >\
    \ hello.txt  \n\n$ ipfs add hello.txt  \n\n$ ipfs cat your\\_file\\_hash  |\n\n\
    Pinning your file to the remote IPFS node \n\n| TERMINAL  |\n\n| --- |"
  fmt: "\n# Add Files to IPFS\n\nA computer running IPFS can ask all the peers it's\
    \ connected to whether they have a file with a particular hash and, if one of\
    \ them does, they send back the whole file. Without a short, unique identifier\
    \ like a cryptographic hash, that wouldn't be possible. [https://ipfs.io](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293510000&usg=AOvVaw1baEc1cpfOituSzR6oAvPn)\
    \ [View on YouTube](https://www.google.com/url?q=https://youtu.be/UAy1llcOcJw&sa=D&source=editors&ust=1624824293510000&usg=AOvVaw0PsTfdmK2DLBhjBbxJjwcC)\n\
    \n| ESTIMATED TIME || 2 minutes |\n\n| --- | --- |\n\n| PRE REQUIREMENTS |\n\n\
    | --- |\n\n| [Create Your IPFS Node](#text00022.html#a2ZM) |\n\n| COMMAND OVERVIEW\
    \ |\n\n| --- |\n\n| `ipfs daemon` |\n\n| Start IPFS local server on 127.0.0.1:5001.\
    \ |\n\n| `echo \"<text>\" > <file>` |\n\n| Output a given text to a new file.\
    \ |\n\n| `ipfs add <file>` |\n\n| Add file to your IPFS local node. |\n\n| `ipfs\
    \ cat <hash>` |\n\n| View IPFS file content. |\n\n## Adding the file VS CODE -\
    \ BASH TERMINAL\n\n| TERMINAL |\n\n| --- |\n\n```\n$ ipfs daemon  \n\n$ echo \"\
    test\"  hello.txt  \n\n$ ipfs add hello.txt  |\n```\n\nThe file was added to ipfs\
    \ resulting in a hash identifier Viewing the file content on the console VS CODE\
    \ - BASH TERMINAL\n\n| TERMINAL |\n\n| --- |\n\n```\n$ ipfs cat \"hash\"  |\n\
    ```\n\nYou will see the file content be displayed Checking the file in the web\
    \ ui Got to http://127.0.0.1:5001/webui Click on \"files\" Click on \"pins\" Copy\
    \ the hash Find by this hash, you can see that this hash exists Viewing the file\
    \ content in the browser Open a new tab ipfs://\"hash\" Now you can see your file\
    \ content in the browser\n\n## Setup IPFS Browser Extension\n\nIPFS Companion\
    \ allows you locally running IPFS node directly inside your favorite browser,\
    \ enabling support for ipfs:// addresses, automatic IPFS gateway loading of websites\
    \ and file paths, easy IPFS file import and sharing, and more. [https://ipfs.io](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293523000&usg=AOvVaw11Kk0Z_w_C-9YBtpEKrntX)\
    \ [View on YouTube](https://www.google.com/url?q=https://youtu.be/eVOd6vd2fGc&sa=D&source=editors&ust=1624824293524000&usg=AOvVaw04tLx6JDH22cd5nP7ThY3t)\n\
    \n| ESTIMATED TIME || 3 minutes |\n\n| --- | --- |\n\n| PRE REQUIREMENTS |\n\n\
    | --- |\n\n| [Create Your IPFS Node](#text00022.html#a2ZM) |\n\n| COMMAND OVERVIEW\
    \ |\n\n| --- |\n\n| `ipfs daemon` |\n\n| Start IPFS local server on 127.0.0.1:5001.\
    \ |\n\n### Installing the browser extension\n\nGo to [IPFS Companion Extension](https://www.google.com/url?q=https://chrome.google.com/webstore/detail/ipfs-companion/nibjojkomfdiaoajekhjakgkdhaomnch?hl%3Den&sa=D&source=editors&ust=1624824293529000&usg=AOvVaw2tEwx14yEyllZu9wRErQKf)\
    \ Click on “Add to Brave” or the name of your browser Click on “Add extension”\
    \ Click on extensions icon and pin “IPFS Companion” to extensions bar Configuring\
    \ the node type Click on “IPFS Companion” icon Click on “gear” icon On “IPFS Node\
    \ Type” select “External” Starting an external node Go to Visual Studio Code Open\
    \ a new terminal VS CODE - BASH TERMINAL\n\n| TERMINAL |\n\n| --- |\n\n```\n$\
    \ ipfs daemon  |\n```\n\n### Importing a file\n\nClick on “IPFS Companion” icon\
    \ Click on “Import” Click on “Pick a file” Select a file from your local disc\
    \ The file will be stored in your ipfs node\n\n# Pin and Unpin IPFS Files on Local\
    \ Node\n\nTo ensure that data persists on IPFS, and is not deleted during garbage\
    \ collection, data can be pinned to one or more IPFS nodes. Pinning gives you\
    \ control over disk space and data retention. As such, you should use that control\
    \ to pin any content you wish to keep on IPFS indefinitely. The default behavior\
    \ for IPFS is to pin files to your local IPFS node. [https://ipfs.io](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293532000&usg=AOvVaw14MFFSLQLRpUz6efw6ws_v)\
    \ [View on YouTube](https://www.google.com/url?q=https://youtu.be/POdQACj-jRI&sa=D&source=editors&ust=1624824293533000&usg=AOvVaw1Wy1-R77UmY-SuEHo3pkxq)\n\
    \n| ESTIMATED TIME || 3 minutes |\n\n| --- | --- |\n\n| PRE REQUIREMENTS |\n\n\
    | --- |\n\n| [Create Your IPFS Node](#text00022.html#a2ZM) |\n\n| COMMAND OVERVIEW\
    \ |\n\n| --- |\n\n| `ipfs daemon` |\n\n| Start IPFS local server on 127.0.0.1:5001.\
    \ |\n\n| `echo \"<text>\" > <file>` |\n\n| Output a given text to a new file.\
    \ |\n\n| `ipfs add <file>` |\n\n| Add file to your IPFS local node. |\n\n| `ipfs\
    \ cat <hash>` |\n\n| View IPFS file content. |\n\n## Starting your local node\
    \ VS CODE - BASH TERMINAL\n\n| TERMINAL |\n\n| --- |\n\n```\n$ ipfs daemon  |\n\
    ```\n\n## Adding file to your node VS CODE - BASH TERMINAL\n\n| TERMINAL |\n\n\
    | --- |\n\n```\n$ echo \"world\"  > hello.txt  \n\n$ ipfs add hello.txt  |\n```\n\
    \nWhen you add a file, this is automatically pinned to your local node. Checking\
    \ the file was added VS CODE - BASH TERMINAL\n\n| TERMINAL |\n\n| --- |\n\n```\n\
    $ ipfs cat your\\_file\\_hash  |\n```\n\nVerifying your file was pinned Go to\
    \ [http://127.0.0.1:5001/webui](https://www.google.com/url?q=http://127.0.0.1:5001/webui&sa=D&source=editors&ust=1624824293544000&usg=AOvVaw3YWLkn7BQ_YxuWJvWtoHJt)\
    \ Click on “Files” Click on “Pins” Your file is there! Unpinning your file VS\
    \ CODE - BASH TERMINAL\n\n| TERMINAL |\n\n| --- |\n\n```\n$ ipfs pin rm your\\\
    _file\\_hash  |\n```\n\n![](Image00028.jpg)Pinning your file manually VS CODE\
    \ - BASH TERMINAL\n\n| TERMINAL |\n\n| --- |\n\n```\n$ ipfs pin add your\\_file\\\
    _hash  |\n```\n\nYour file was pinned again\n\n# Pin and Unpin Files on Remote\
    \ Node using Pinata\n\nIt's also possible to pin your files to a remote pinning\
    \ service. These third-party services give you the opportunity to pin files not\
    \ to your own local node, but to nodes that they operate. You don't need to worry\
    \ about your own node's available disk space or uptime. While you can use a remote\
    \ pinning service's own GUI, CLI, or other dev tools to manage IPFS files pinned\
    \ to their service, you can also work directly with pinning services using your\
    \ local IPFS installation — meaning that you don't need to learn a pinning service's\
    \ unique API or other tooling. [https://ipfs.io](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293548000&usg=AOvVaw0VSY8BUfCvuDgwERgg3yG5)\
    \ [https://pinata.cloud](https://www.google.com/url?q=https://pinata.cloud&sa=D&source=editors&ust=1624824293549000&usg=AOvVaw1qcUHfmnL8hVloIQhkcdOT)\
    \ [View on YouTube](https://www.google.com/url?q=https://youtu.be/0bC_YGrJAkA&sa=D&source=editors&ust=1624824293549000&usg=AOvVaw1-XdElxsKyE8Zvj1agIza6)\n\
    \n| ESTIMATED TIME || 4 minutes |\n\n| --- | --- |\n\n| PRE REQUIREMENTS |\n\n\
    | --- |\n\n| [Create Your IPFS Node](#text00022.html#a2ZM) |\n\n| COMMAND OVERVIEW\
    \ |\n\n| --- |\n\n| `ipfs pin remote service add pinata <endpoint> <jwt_key>`\
    \ |\n\n| Add a new remote pinning service. |\n\n| `ipfs pin remote service ls`\
    \ |\n\n| List existing pinning services added. |\n\n| `ipfs add <file>` |\n\n\
    | Add file to your IPFS local node. |\n\n| `ipfs cat <hash>` |\n\n| View IPFS\
    \ file content. |\n\n| `ipfs pin remote add --service=pinata -name=<file> <hash>`\
    \ |\n\n| Pin your file to the remote IPFS pinning service. |\n\n| `ipfs pin remote\
    \ rm --service=pinata -name=<file> <hash>` |\n\n| Unpin your file from the remote\
    \ IPFS pinning service. |\n\n## Setting up API Keys on Pinata\n\nLog in on your\
    \ Pinata account Go to “API Keys” Click on “New Key” Check “Admin” Use “admin-cli”\
    \ as your “Key Name” Click on “Create Key” A new key will be generated to you\
    \ Copy the “JWT” value from this window Setting up Pinata as a remove service\
    \ on your terminal Add Pinata as a pinning remote service VS CODE - BASH TERMINAL\n\
    \n| TERMINAL |\n\n| --- |\n\n```\n$ ipfs pin remote service add pinata https:\
    \ //api.pinata.cloud/psa your\\_jwt\\_key  |\n```\n\nList all existing remote\
    \ services and check that Pinata is there\n\n| TERMINAL |\n\n| --- |\n\n```\n\
    $ ipfs pin remote service ls  |\n```\n\n## Adding a new file to your local IPFS\
    \ node\n\nAdd Pinata as a pinning remote service VS CODE - BASH TERMINAL\n\n|\
    \ TERMINAL |\n\n| --- |\n\n```\n$ echo \"world\"  > hello.txt  \n\n$ ipfs add\
    \ hello.txt  \n\n$ ipfs cat your\\_file\\_hash  |\n```\n\n## Pinning your file\
    \ to the remote IPFS node\n\n| TERMINAL |\n\n| --- |\n"
  trans: "\n\n# 将文件添加到 IPFS\n\n运行 IPFS 的计算机可以询问其连接的所有对等节点是否拥有特定哈希的文件，如果其中某个节点拥有，则会发送回整个文件。如果没有像加密哈希这样的短而唯一的标识符，这将是不可能的。\
    \ [`ipfs.io`](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293510000&usg=AOvVaw1baEc1cpfOituSzR6oAvPn)\
    \ [在 YouTube 上观看](https://www.google.com/url?q=https://youtu.be/UAy1llcOcJw&sa=D&source=editors&ust=1624824293510000&usg=AOvVaw0PsTfdmK2DLBhjBbxJjwcC)\n\
    \n| 预计时间 || 2 分钟 |\n\n| --- | --- |\n\n| 前置要求 |\n\n| --- |\n\n| 创建你的 IPFS 节点 |\n\
    \n| 命令概览 |\n\n| --- |\n\n| `ipfs daemon` |\n\n| 在 127.0.0.1:5001 上启动 IPFS 本地服务器。\
    \ |\n\n| `echo \"<text>\" > <file>` |\n\n| 将给定文本输出到新文件。 |\n\n| `ipfs add <file>`\
    \ |\n\n| 将文件添加到你的 IPFS 本地节点。 |\n\n| `ipfs cat <hash>` |\n\n| 查看 IPFS 文件内容。 |\n\
    \n## 添加文件 VS CODE - BASH 终端\n\n| 终端 |\n\n| --- |\n\n```\n$ ipfs daemon  \n\n$\
    \ echo \"test\"  hello.txt  \n\n$ ipfs add hello.txt  |\n```\n\n文件已添加到 ipfs，生成哈希标识符\
    \ 在控制台查看文件内容 VS CODE - BASH 终端\n\n| 终端 |\n\n| --- |\n\n```\n$ ipfs cat \"hash\"\
    \  |\n```\n\n你将看到文件内容被显示 在 Web UI 中检查文件 访问 http://127.0.0.1:5001/webui 点击“files”\
    \ 点击“pins” 复制哈希 通过此哈希查找，你可以看到该哈希存在 在浏览器中查看文件内容 打开新标签页 ipfs://\"hash\" 现在你可以在浏览器中看到文件内容\n\
    \n## 设置 IPFS 浏览器扩展\n\nIPFS Companion 允许你直接在喜欢的浏览器中本地运行 IPFS 节点，支持 ipfs:// 地址、网站和文件路径的自动\
    \ IPFS 网关加载、轻松的 IPFS 文件导入和共享等。 [`ipfs.io`](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293523000&usg=AOvVaw11Kk0Z_w_C-9YBtpEKrntX)\
    \ [在 YouTube 上观看](https://www.google.com/url?q=https://youtu.be/eVOd6vd2fGc&sa=D&source=editors&ust=1624824293524000&usg=AOvVaw04tLx6JDH22cd5nP7ThY3t)\n\
    \n| 预计时间 || 3 分钟 |\n\n| --- | --- |\n\n| 前置要求 |\n\n| --- |\n\n| 创建你的 IPFS 节点 |\n\
    \n| 命令概览 |\n\n| --- |\n\n| `ipfs daemon` |\n\n| 在 127.0.0.1:5001 上启动 IPFS 本地服务器。\
    \ |\n\n### 安装浏览器扩展\n\n访问 [IPFS Companion 扩展](https://www.google.com/url?q=https://chrome.google.com/webstore/detail/ipfs-companion/nibjojkomfdiaoajekhjakgkdhaomnch?hl%3Den&sa=D&source=editors&ust=1624824293529000&usg=AOvVaw2tEwx14yEyllZu9wRErQKf)\
    \ 点击“添加到 Brave”或你的浏览器名称 点击“添加扩展” 点击扩展图标并将“IPFS Companion”固定到扩展栏 配置节点类型 点击“IPFS\
    \ Companion”图标 点击“齿轮”图标 在“IPFS 节点类型”中选择“External” 启动外部节点 访问 Visual Studio Code\
    \ 打开新终端 VS CODE - BASH 终端\n\n| 终端 |\n\n| --- |\n\n```\n$ ipfs daemon  |\n```\n\
    \n### 导入文件\n\n点击“IPFS Companion”图标 点击“Import” 点击“Pick a file” 从本地磁盘选择文件 文件将存储在你的\
    \ ipfs 节点中\n\n# 在本地节点上固定和取消固定 IPFS 文件\n\n为确保数据在 IPFS 上持久化，且在垃圾回收期间不会被删除，可以将数据固定到一个或多个\
    \ IPFS 节点。固定使你能够控制磁盘空间和数据保留。因此，你应使用该控制权来固定任何你希望在 IPFS 上无限期保留的内容。IPFS 的默认行为是将文件固定到本地\
    \ IPFS 节点。 [`ipfs.io`](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293532000&usg=AOvVaw14MFFSLQLRpUz6efw6ws_v)\
    \ [在 YouTube 上观看](https://www.google.com/url?q=https://youtu.be/POdQACj-jRI&sa=D&source=editors&ust=1624824293533000&usg=AOvVaw1Wy1-R77UmY-SuEHo3pkxq)\n\
    \n| 预计时间 || 3 分钟 |\n\n| --- | --- |\n\n| 前置要求 |\n\n| --- |\n\n| 创建你的 IPFS 节点 |\n\
    \n| 命令概览 |\n\n| --- |\n\n| `ipfs daemon` |\n\n| 在 127.0.0.1:5001 上启动 IPFS 本地服务器。\
    \ |\n\n| `echo \"<text>\" > <file>` |\n\n| 将给定文本输出到新文件。 |\n\n| `ipfs add <file>`\
    \ |\n\n| 将文件添加到你的 IPFS 本地节点。 |\n\n| `ipfs cat <hash>` |\n\n| 查看 IPFS 文件内容。 |\n\
    \n## 启动本地节点 VS CODE - BASH 终端\n\n| 终端 |\n\n| --- |\n\n```\n$ ipfs daemon  |\n\
    ```\n\n## 将文件添加到你的节点 VS CODE - BASH 终端\n\n| 终端 |\n\n| --- |\n\n```\n$ echo \"\
    world\"  > hello.txt  \n\n$ ipfs add hello.txt  |\n```\n\n添加文件时，它会自动固定到你的本地节点。检查文件是否已添加\
    \ VS CODE - BASH 终端\n\n| 终端 |\n\n| --- |\n\n```\n$ ipfs cat your\\_file\\_hash\
    \  |\n```\n\n验证文件是否已固定 访问 [`127.0.0.1:5001/webui`](https://www.google.com/url?q=http://127.0.0.1:5001/webui&sa=D&source=editors&ust=1624824293544000&usg=AOvVaw3YWLkn7BQ_YxuWJvWtoHJt)\
    \ 点击“Files” 点击“Pins” 你的文件在那里！ 取消固定你的文件 VS CODE - BASH 终端\n\n| 终端 |\n\n| --- |\n\
    \n```\n$ ipfs pin rm your\\_file\\_hash  |\n```\n\n![](img/Image00028.jpg)手动固定你的文件\
    \ VS CODE - BASH 终端\n\n| 终端 |\n\n| --- |\n\n```\n$ ipfs pin add your\\_file\\\
    _hash  |\n```\n\n你的文件已再次固定\n\n# 使用 Pinata 在远程节点上固定和取消固定文件\n\n也可以将文件固定到远程固定服务。这些第三方服务让你有机会将文件固定到它们运营的节点，而不是你自己的本地节点。你不需要担心自己节点的可用磁盘空间或运行时间。虽然你可以使用远程固定服务自己的\
    \ GUI、CLI 或其他开发工具来管理固定到其服务的 IPFS 文件，但你也可以直接使用本地 IPFS 安装与固定服务协作——这意味着你不需要学习固定服务的独特\
    \ API 或其他工具。 [`ipfs.io`](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293548000&usg=AOvVaw0VSY8BUfCvuDgwERgg3yG5)\
    \ [`pinata.cloud`](https://www.google.com/url?q=https://pinata.cloud&sa=D&source=editors&ust=1624824293549000&usg=AOvVaw1qcUHfmnL8hVloIQhkcdOT)\
    \ [在 YouTube 上观看](https://www.google.com/url?q=https://youtu.be/0bC_YGrJAkA&sa=D&source=editors&ust=1624824293549000&usg=AOvVaw1-XdElxsKyE8Zvj1agIza6)\n\
    \n| 预计时间 || 4 分钟 |\n\n| --- | --- |\n\n| 前置要求 |\n\n| --- |\n\n| 创建你的 IPFS 节点 |\n\
    \n| 命令概览 |\n\n| --- |\n\n| `ipfs pin remote service add pinata <endpoint> <jwt_key>`\
    \ |\n\n| 添加新的远程固定服务。 |\n\n| `ipfs pin remote service ls` |\n\n| 列出已添加的现有固定服务。\
    \ |\n\n| `ipfs add <file>` |\n\n| 将文件添加到你的 IPFS 本地节点。 |\n\n| `ipfs cat <hash>`\
    \ |\n\n| 查看 IPFS 文件内容。 |\n\n| `ipfs pin remote add --service=pinata -name=<file>\
    \ <hash>` |\n\n| 将文件固定到远程 IPFS 固定服务。 |\n\n| `ipfs pin remote rm --service=pinata\
    \ -name=<file> <hash>` |\n\n| 从远程 IPFS 固定服务取消固定文件。 |\n\n## 在 Pinata 上设置 API 密钥\n\
    \n登录你的 Pinata 账户 访问“API Keys” 点击“New Key” 勾选“Admin” 使用“admin-cli”作为你的“Key Name”\
    \ 点击“Create Key” 将为你生成一个新密钥 从此窗口复制“JWT”值 在终端上设置 Pinata 作为远程服务 将 Pinata 添加为固定远程服务\
    \ VS CODE - BASH 终端\n\n| 终端 |\n\n| --- |\n\n```\n$ ipfs pin remote service add\
    \ pinata https: //api.pinata.cloud/psa your\\_jwt\\_key  |\n```\n\n列出所有现有远程服务并检查\
    \ Pinata 是否存在\n\n| 终端 |\n\n| --- |\n\n```\n$ ipfs pin remote service ls  |\n```\n\
    \n## 将新文件添加到你的本地 IPFS 节点\n\n将 Pinata 添加为固定远程服务 VS CODE - BASH 终端\n\n| 终端 |\n\n\
    | --- |\n\n```\n$ echo \"world\"  > hello.txt  \n\n$ ipfs add hello.txt  \n\n\
    $ ipfs cat your\\_file\\_hash  |\n```\n\n## 将文件固定到远程 IPFS 节点\n\n| 终端 |\n\n| ---\
    \ |\n\n"
