  fmt: "\n# IPFS 与 Fleek 部署指南\n\n## IPFS 文件固定与取消\n\n### 添加远程固定\n\n```\n$ ipfs pin\
    \ remote add --service=pinata -name=hello.txt your_file_hash\n```\n\n返回 Pinata\
    \ 网站，点击“Pin Manager”，你的文件将出现在此页面！\n\n### 取消远程固定\n\n```\n$ ipfs pin remote rm --service=pinata\
    \ -name=hello.txt your_file_hash\n```\n\n返回 Pinata 网站，点击“Pin Manager”，你的文件将不再出现在此页面，这意味着你的文件已被取消固定。\n\
    \n---\n\n# 使用 Fleek 在 IPFS 上托管你的网站\n\nFleek 允许你基于开放 Web 协议构建，并由基础设施提供支持。在专注于创建用户控制、加密、私有、P2P\
    \ 体验的无需许可、开放技术上构建和托管你的网站、应用、DApp 和其他服务。\n\n- [https://fleek.co](https://fleek.co)\n\
    - [View on YouTube](https://youtu.be/_lNZd8L7gCE)\n\n| 预计时间 | 5 分钟 |\n\n## 命令概览\n\
    \n| 命令 | 说明 |\n| --- | --- |\n| `git clone` | 将仓库克隆到新创建的目录中。 |\n| `npm install`\
    \ | 在本地 `node_modules` 文件夹中安装依赖项。 |\n| `fleek login` | 登录到你的 Fleek 账户。 |\n| `fleek\
    \ site:init` | 在本地目录中初始化 Fleek 网站。 |\n| `fleek site:deploy` | 部署发布目录中的更改。 |\n\n\
    ## 操作步骤\n\n### 登录 Fleek\n\n前往 [https://fleek.co](https://fleek.co)，使用你的账户登录。\n\
    \n### 克隆现有仓库\n\n在 VS Code 中，打开 Bash 终端：\n\n```\n$ git clone https://github.com/johnnymatthews/random-planet-facts\n\
    ```\n\n### 安装 Fleek 命令行工具\n\n在 VS Code - Bash 终端中：\n\n```\n$ npm install -g @fleekhq/fleek-cli\n\
    ```\n\n### 登录 Fleek\n\n（你将被提示在浏览器中完成流程）\n\n```\n$ fleek login\n```\n\n### 初始化\
    \ Fleek 网站\n\n在当前目录中初始化 Fleek 网站：\n\n```\n$ fleek site:init\n```\n\n选择你想要使用的团队（使用箭头键选择）。选择你想要使用的网站（使用箭头键选择）。选择部署的公共目录。\n\
    \n### 部署你的网站\n\n```\n$ fleek site:deploy\n```\n\n返回 Fleek 网站，点击“Hosting”，点击“Verify\
    \ on IPFS”。这是你在 IPFS 上托管的网站。你现在可以在线查看你的已部署网站。返回“Hosting”，点击“your-site.on.fleek.co”。这是你的网站友好地址。\n\
    \n![](Image00029.jpg)\n\n---\n\n# ENS - Ethereum Name Service\n\n## 在你的钱包中接收任何加密货币、代币或\
    \ NFT 上注册你的 ENS\n\n以太坊域名服务（ENS）是一项服务，它使通过简单的名称而不是长而复杂的字母和数字字符串来发送和接收加密货币以及访问特殊网站变得容易。\n\
    \n- [https://ens.domains](https://ens.domains)\n- [View on YouTube](https://youtu.be/ETQiKiu2KKc)\n\
    \n| 预计时间 | 3 分钟 |\n\n## 前置要求\n\n- [Install and Setup MetaMask Wallet](#text00008.html#toc20_MetaMask)\n\
    \n## 搜索你的域名\n\n前往 ens.domains，点击“Launch App”。搜索你想要注册的域名（例如：planou.eth）。检查注册期限（最低\
    \ 1 年）。检查注册价格。请求注册。点击“Request To Register”。MetaMask 通知将打开以确认交易。点击“Confirm”。等待交易在区块链上确认。点击“Register”。将再次显示新的\
    \ MetaMask 通知。点击“Confirm”。等待交易在区块链上确认。\n\n## 管理你的注册名称\n\n点击“Manage name”。向下滚动到“Addresses”。意识到\
    \ ETH 地址已设置为创建域名的钱包（你的钱包）。\n\n![](Image00030.jpg)\n\n## 检查名称解析\n\n点击你的 MetaMask\
    \ 钱包。点击“Send”。输入你的 ENS 名称（例如：planou.eth）。注意该名称已解析为钱包地址。\n\n![](Image00031.jpg)\n\
    \n现在你可以使用 ENS 名称作为收件人，而不是使用钱包哈希地址进行交易。\n\n---\n\n# Chainlink：在智能合约中获取加密货币价格\n\n\
    Chainlink 是一个去中心化的节点网络，通过预言机将离链来源的数据和信息提供给链上智能合约。在这个视频中，你将学习如何在智能合约中获取加密货币的最新价格，使用\
    \ Kovan 测试网上的 ETH/USD 价格源。\n\n- [https://chain.link](https://chain.link)\n- [View\
