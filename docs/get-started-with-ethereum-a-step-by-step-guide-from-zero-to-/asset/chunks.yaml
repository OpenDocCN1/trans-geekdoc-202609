  fmt: "\n# ERC20 固定供应量代币部署与测试指南\n\n## 1. 智能合约代码\n\n进入合约目录，创建 `ERC20FixedSupply.sol`\
    \ 文件。\n\n```solidity\n// SPDX-License-Identifier: MIT\n\npragma solidity ^0.8.0;\n\
    \nimport \"@openzeppelin/contracts/token/ERC20/ERC20.sol\";\n\ncontract ERC20FixedSupply\
    \ is ERC20 {\n    constructor() ERC20(\"Fixed\", \"FIX\") {\n        _mint(msg.sender,\
    \ 1000);\n    }\n\n    function decimals() public view virtual override returns\
    \ (uint8) {\n        return 0;\n    }\n}\n```\n\n## 2. 配置 Truffle 编译器\n\n打开 `truffle-config.js`\
    \ 文件，取消 \"solc\" 块的注释，并更新 Solidity 版本号。\n\n```javascript\ncompilers: {\n    solc:\
    \ {\n        version: \"0.8.0\",\n        docker: true,\n        settings: {\n\
    \            optimizer: {\n                enabled: false,\n                runs:\
    \ 200\n            },\n            evmVersion: \"byzantium\"\n        }\n    }\n\
    },\n```\n\n## 3. 创建部署脚本\n\n在 `migrations` 文件夹下，创建新文件，文件名设置为 `2_deploy_contract.sol`，将\
    \ `require` 方法设置为你的合约文件，并导出部署合约的函数。\n\n```javascript\nvar ERC20FixedSupply = artifacts.require(\"\
    ./ERC20FixedSupply.sol\");\n\nmodule.exports = function(deployer) {\n    deployer.deploy(ERC20FixedSupply);\n\
    };\n```\n\n## 4. 启动 Ganache 并迁移合约\n\n打开新终端（VS CODE - BASH TERMINAL），启动 Ganache\
    \ 开发区块链。\n\n```bash\n$ ganache-cli\n```\n\n分割终端视图（VS CODE - BASH TERMINAL），再次启动\
    \ Ganache。\n\n```bash\n$ ganache-cli\n```\n\n打开 `truffle-config.js` 文件，在 `networks`\
    \ 下取消 `development` 块的注释。\n\n```javascript\nnetworks: {\n    development: {\n\
    \        host: \"127.0.0.1\",\n        port: 8545,\n        network_id: \"*\"\n\
    \    },\n},\n```\n\n在终端中迁移合约（VS CODE - BASH TERMINAL）。\n\n```bash\n$ truffle migrate\n\
    ```\n\n## 5. 配置 MetaMask 并转账代币\n\n复制部署代币的账户私钥。配置 MetaMask，打开 MetaMask，点击你的账户，然后选择\
    \ \"import account\"，粘贴账户私钥，点击 \"import\"。\n\n点击网络列表，选择 \"Localhost:8545\"。\n\n\
    添加代币：点击 \"add token\"，选择 \"custom token\"，粘贴代币合约地址，点击 \"next\"，点击 \"add tokens\"\
    。\n\n返回 VS Code，复制另一个账户私钥。返回 MetaMask，重复你为第一个账户所做的步骤，包括添加代币。\n\n在账户之间转账代币。切换到第一个导入的账户（即拥有所有代币的账户），点击\
    \ \"send\"，点击 \"transfer between my accounts\"，选择第二个创建的账户，输入 115 FIX 作为转账金额，点击\
    \ \"next\"，点击 \"confirm\"。交易已发送但处于待定状态，交易确认后，总代币数将更新。选择第二个导入的账户，该账户现在拥有 115 FIX！\n\
    \n## 6. 使用 Infura 将 ERC20 代币部署到测试网\n\n你可以使用 Infura 将智能合约部署到 Ropsten、Kovan、Rinkeby、Gorli\
    \ 等测试网络，也可以部署到 Mainnet。对于测试网，你需要在 Infura 上设置一个新项目，并拥有用于部署合约的钱包私钥。该钱包需要有以太币余额以完成合约创建交易。\n\
    \n- [Infura](https://infura.io)\n- [View on YouTube](https://youtu.be/VS4iWGCHXmE)\n\
    \n| 预计时间 | 8 分钟 |\n| --- | --- |\n\n### 前置要求\n\n- [Install Truffle](#text00005.html#a2X3)\n\
    - 在 Infura.io 上创建账户\n- [Get Test Ether From Faucet on Ropsten Network](#text00019.html#a2ZC)\n\
    - [Install and Setup MetaMask Wallet](#text00008.html#toc20_MetaMask)\n\n### 命令概览\n\
    \n| 命令 | 说明 |\n| --- | --- |\n| `npm install fs` | 安装 fs 包，该包提供大量非常有用的功能来访问和与文件系统交互。\
    \ |\n| `npm install @truffle/hdwallet-provider` | 安装 HD 钱包支持的 Web3 提供程序。这用于为从\
    \ 12 或 24 个助记词派生的地址签署交易。 |\n| `truffle migrate --network ropsten` | 运行迁移以部署合约。\
    \ |\n\n### 安装前置要求\n\n打开新终端（VS CODE - BASH TERMINAL）。\n\n```bash\n$ npm install\
    \ fs\n$ npm install @truffle/hdwallet-provider\n```\n\n### 设置 Infura 项目\n\n访问\
    \ infura.io，进入控制面板，点击 \"ethereum\"，点击 \"create a project\"，定义项目名称。你可以连接到不同的测试网以及主网，复制项目\
    \ ID 并保存更改。\n\n### 设置智能合约\n\n打开 Visual Studio Code，打开 `truffle-config.js`，取消注释四个常量：`hdwalletprovider`、`infurakey`、`fs`\
    \ 和 `mnemonic`。将项目 ID 作为 `infurakey` 常量的值粘贴进去，取消注释 \"ropsten\" 块，确保在 ropsten 端点中使用正确的项目\
    \ ID。\n\n### 配置私钥\n\n在浏览器中打开连接到 Infura 网络的 MetaMask 钱包，点击你的账户，点击 \"settings\"\
    ，点击 \"security & privacy\"，点击 \"reveal seed phrase\"，输入钱包密码继续，复制私钥。返回 Visual Studio\
    \ Code，创建名为 `.secret` 的新文件，粘贴私钥。\n\n### 部署智能合约\n\n打开终端（VS CODE - BASH TERMINAL）。\n\
    \n```bash\n$ truffle migrate --network ropsten\n```\n\n### 检查钱包余额\n\n再次访问你的 MetaMask\
    \ 钱包，注意你的余额已减少。\n\n### 在 Etherscan 上验证智能合约\n\n打开新窗口，访问 [https://ropsten.etherscan.io](https://ropsten.etherscan.io)，复制为你的部署创建的合约地址，将合约地址粘贴到搜索字段，点击\
    \ \"find\" 按钮。智能合约已显示！代币已创建并转移到创建合约的钱包。点击 \"Fixed (FIX)\" 代币链接，在这里你可以看到新创建代币的概览！\n\
