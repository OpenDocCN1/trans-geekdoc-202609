    # Solidity Get Started With Solidity Project on VS Code


    智能合约最常用于以太坊。以太坊是世界上第一个可编程区块链。它允许定义智能合约，以帮助促进数字资产（如以太币）的转移。你将用来编写合约的语言是 Solidity。Solidity
    是图灵完备的，这意味着你可以以清晰定义和编码的方式编写复杂的合约。 [View on YouTube](https://www.google.com/url?q=https://www.youtube.com/watch?v%3D-MyTO031-Ww&sa=D&source=editors&ust=1624824293318000&usg=AOvVaw1mHt423DF82kvv0SsltVSi)


    | 预计时间 || 4 分钟 |


    | --- | --- |


    ## 创建新项目


    单击“视图 > 命令面板...”。单击“区块链: 新建 Solidity 项目”。单击“创建基本项目”。选择项目将被脚手架化的文件夹。等待项目创建完成。


    ## 编译项目


    右键单击 `HelloBlockchain.sol` 文件 ![](img/Image00009.jpg) 选择“构建合约”。等待合约构建完成。


    ## 部署到开发区块链


    右键单击 `HelloBlockchain.sol` 文件。选择“部署合约”。选择“development 127.0.0.1:8545”。等待合约部署到区块链开发网络。完成！


    # ERC20 - 可替代代币


    ## 使用 OpenZeppelin 编写简单的 ERC20 代币


    让我们在 Truffle 的帮助下创建一个简单的 ERC-20 以太坊智能合约，然后导入 OpenZeppelin 合约库。代币可以代表以太坊中的几乎任何东西：在线平台上的声誉点数、游戏中角色的技能、彩票、公司股份等金融资产、像美元这样的法定货币、一盎司黄金
    [`ethereum.org/en/developers/docs/standards/tokens/erc-20/`](https://www.google.com/url?q=https://ethereum.org/en/developers/docs/standards/tokens/erc-20/&sa=D&source=editors&ust=1624824293322000&usg=AOvVaw0WQC0GAMdAvUsXaMjUY9n4)
    [View on YouTube](https://www.google.com/url?q=https://www.youtube.com/watch?v%3DycTvT1R4_nc&sa=D&source=editors&ust=1624824293323000&usg=AOvVaw0gF-p4EsSm3Lw6ISLoO3iQ)


    | 预计时间 || 5 分钟 |


    | --- | --- |


    | 命令概览 |


    | --- |


    | `truffle init` |


    | 初始化新的空 Ethereum 项目 |


    | `npm init` |


    | 为你的项目创建一个 `package.json` 文件。该文件包含有关项目包和依赖项的信息。 |


    | `npm install` |


    | 此命令安装一个包及其依赖的任何包。 |


    ## 准备环境


    VS CODE - BASH 终端


    | 终端 |


    | --- |


    | `$ truffle init` |


    `$ npm init` |


    `$ npm install @openzeppelin/contracts` |


    ## 编写合约


    在 `contracts` 下创建一个名为 `ERC20MinerReward.sol` 的新文件。添加许可证指令。定义 Solidity 最低版本。导入
    OpenZeppelin ERC-20 合约库。定义合约类。定义合约构造函数。定义合约名称。定义合约符号。


    | `ERC20MinerReward.sol` |


    | --- |


    | 1 2 3 4 5 6 7 8 || `// SPDX-License-Identifier: MIT` |


    `pragma solidity ^ 0.8.0 ;` |


    `import "@openzeppelin/contracts/token/ERC20/ERC20.sol"` |


    `contract ERC20MinerReward is ERC20 {` |


    `    constructor () ERC20("MinerReward", "MRW")` |


    `}` |


    ## 设置 Solidity 编译器版本


    复制本合约中使用的 Solidity 版本。打开 `truffle-config.js`。取消注释 "solc" 块。粘贴复制的值来设置 Solidity
    版本。


    ## 编译合约


    现在是编译合约的时候了。


    VS CODE - BASH 终端


    | 终端 |


    | --- |


    | `$ truffle compile` |


    合约编译成功！


    ## 验证结果


    注意到新文件夹 `build/contract` 已创建。全新的合约就在那里！


    # 将 ERC20 代币部署到 Ganache 开发区块链


    Ethereum Ganache 是一个专为开发和测试设计的本地内存区块链。它模拟真实以太坊网络的功能，包括多个充有测试以太币的账户可用。 [View on
    YouTube](https://www.google.com/url?q=https://youtu.be/8XAwtrrQ-g8&sa=D&source=editors&ust=1624824293336000&usg=AOvVaw1BtugFh5-lr14icvF5NkTv)


    | 预计时间 || 4 分钟 |


    | --- | --- |


    | 前置要求 |


    | --- |


    | Install Truffle |


    | 命令概览 |


    | --- |


    | `ganache-cli` |


    | 在 127.0.0.1:8545 上启动 Ganache 开发区块链。 |


    | `truffle compile` |


    | 编译合约源文件。 |


    | `truffle migrate` |


    | 运行迁移以部署合约。 |


    ## 准备迁移


    创建一个新的迁移文件。添加对智能合约的引用。添加一个导出函数来部署智能合约。


    ## 启动区块链


    打开一个新终端。


    VS CODE - BASH 终端


    | 终端 |


    | --- |


    | `$ ganache-cli` |


    一个新的 Ganache 区块链正在 127.0.0.1:8545 上监听。


    ## 配置区块链网络


    打开 `truffle-config.js`。取消注释 networks 中的 development 块。确保主机和端口正确。


    ## 部署合约


    VS CODE - BASH 终端


    | 终端 |


    | --- |


    | `$ truffle compile` |


    `$ truffle migrate` |


    合约已部署到 Ganache 区块链。已创建合约地址。


    ## 将代币添加到钱包


    转到 Brave 浏览器（或任何与 MetaMask 兼容的浏览器）。选择“Localhost 8585”网络。单击“添加代币”。单击“自定义代币”。复制合约地址。粘贴到“代币合约地址”字段。“代币符号”和“精度小数位数”会自动填充。单击“下一步”。单击“添加代币”。代币已添加到
    MetaMask 钱包。代币就在那里！


    # 创建具有固定供应量的 ERC20 代币


    ERC20 固定供应量代币定义了智能合约中允许的总代币数量。在这种实现类型中，部署到区块链后无法更改它。 [`openzeppelin.com`](https://www.google.com/url?q=https://openzeppelin.com&sa=D&source=editors&ust=1624824293349000&usg=AOvVaw32HS2RkQbGxWYqjIR5hmda)
    [`www.trufflesuite.com/truffle`](https://www.google.com/url?q=https://www.trufflesuite.com/truffle&sa=D&source=editors&ust=1624824293349000&usg=AOvVaw3mUxgJCana2JUfkCZhwIyh)
    [`www.trufflesuite.com/ganache`](https://www.google.com/url?q=https://www.trufflesuite.com/ganache&sa=D&source=editors&ust=1624824293350000&usg=AOvVaw2QpGKTc6Ta-52ah-2VGD_s)
    [`metamask.io`](https://www.google.com/url?q=https://metamask.io&sa=D&source=editors&ust=1624824293350000&usg=AOvVaw18b5BD_Xz2ZKDHqV8MnNrC)


