    \ 22 23 |\n\n```solidity\n// SPDX-License-Identifier: MIT\n\npragma solidity ⁰.8.0;\n\
    \nimport \"@openzeppelin/contracts/token/ERC721/extensions/ERC721URIStorage.sol\"\
    ;\nimport \"@openzeppelin/contracts/utils/Counters.sol\";\n\ncontract UniqueAsset\
