    \ To Register”。MetaMask 通知将打开以确认交易。点击“Confirm”。等待交易在区块链上确认。点击“Register”。将再次显示新的\
    \ MetaMask 通知。点击“Confirm”。等待交易在区块链上确认。\n\n## 管理你的注册名称\n\n点击“Manage name”。向下滚动到“Addresses”。意识到\
