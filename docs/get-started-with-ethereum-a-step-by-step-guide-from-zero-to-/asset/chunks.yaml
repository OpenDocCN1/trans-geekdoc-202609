    # Solidity Get Started With Solidity Project on VS Code


    Smart contracts are most commonly used with Ethereum. Ethereum is the world''s
    first programmable blockchain. It allows smart contracts to be defined to help
    facilitate the transfer of digital assets, like ether. The language you''ll use
    to write contracts is Solidity. Solidity is Turing-complete, which means that
    you can write complicated contracts in a clearly defined and coded way. [View
    on YouTube](https://www.google.com/url?q=https://www.youtube.com/watch?v%3D-MyTO031-Ww&sa=D&source=editors&ust=1624824293318000&usg=AOvVaw1mHt423DF82kvv0SsltVSi)


    | ESTIMATED TIME || 4 minutes |


    | --- | --- |


    ## Creating a new project


    Click on “View > Command Palette...”. Click on “Blockchain: New Solidity Project”.
    Click on “Create basic project”. Select a folder where the project will be scaffolding.
    Wait for the project to be created.


    ## Compiling the project


    Right click on `HelloBlockchain.sol` file ![](Image00009.jpg) Select “Build Contracts”.
    Wait for contracts to be built.


    ## Deploying to development blockchain


    Right click on `HelloBlockchain.sol` file. Select “Deploy Contracts”. Select “development
    127.0.0.1:8545”. Wait for the contracts to be deployed to the blockchain development
    network. That’s done!


    # ERC20 - Fungible Tokens


    ## Write a Simple ERC20 Token Using OpenZeppelin


    Let’s create a simple ERC-20 ethereum smart contract, with the help of Truffle,
    and then import the OpenZeppelin contracts library. Tokens can represent virtually
    anything in Ethereum: Reputation points in an online platform Skills of a character
    in a game Lottery tickets Financial assets like a share in a company A fiat currency
    like USD An ounce of gold [https://ethereum.org/en/developers/docs/standards/tokens/erc-20/](https://www.google.com/url?q=https://ethereum.org/en/developers/docs/standards/tokens/erc-20/&sa=D&source=editors&ust=1624824293322000&usg=AOvVaw0WQC0GAMdAvUsXaMjUY9n4)
    [View on YouTube](https://www.google.com/url?q=https://www.youtube.com/watch?v%3DycTvT1R4_nc&sa=D&source=editors&ust=1624824293323000&usg=AOvVaw0gF-p4EsSm3Lw6ISLoO3iQ)


    | ESTIMATED TIME || 5 minutes |


    | --- | --- |


    | COMMAND OVERVIEW |


    | --- |


    | `truffle init` |


    | Initialize new and empty Ethereum project |


    | `npm init` |


    | Creates a `package.json` file for your project. This file contains information
    about the project’s packages and dependencies. |


    | `npm install` |


    | This command installs a package and any packages that it depends on. |


    ## Preparing the environment


    VS CODE - BASH TERMINAL


    | TERMINAL |


    | --- |


    | `$ truffle init` |


    `$ npm init` |


    `$ npm install @openzeppelin/contracts` |


    ## Writing the contract


    Create a new file under `contracts` with the name `ERC20MinerReward.sol`. Add
    the license directive. Define the solidity minimum version. Import OpenZeppelin
    ERC-20 contract library. Define the contract class. Define the contract constructor.
    Define the contract name. Define the contract symbol.


    | `ERC20MinerReward.sol` |


    | --- |


    | 1 2 3 4 5 6 7 8 || `// SPDX-License-Identifier: MIT` |


    `pragma solidity ^ 0.8.0 ;` |


    `import "@openzeppelin/contracts/token/ERC20/ERC20.sol"` |


    `contract ERC20MinerReward is ERC20 {` |


    `    constructor () ERC20("MinerReward", "MRW")` |


    `}` |


    ## Setting the Solidity compiler version


    Copy the solidity version used in this contract. Open `truffle-config.js`. Uncomment
    the "solc" block. Set the solidity version pasting the copied value.


    ## Compiling the contract


    Now is time to compile the contract.


    VS CODE - BASH TERMINAL


    | TERMINAL |


    | --- |


    | `$ truffle compile` |


    The contract was compiled successfully!


    ## Verifying the result


    Noticed that a new folder `build/contract` was created. The brand new contract
    is there!


    # Deploy ERC20 Token to Ganache Development Blockchain


    Ethereum Ganache is a local in-memory blockchain designed for development and
    testing. It simulates the features of a real Ethereum network, including the availability
    of a number of accounts funded with test Ether. [View on YouTube](https://www.google.com/url?q=https://youtu.be/8XAwtrrQ-g8&sa=D&source=editors&ust=1624824293336000&usg=AOvVaw1BtugFh5-lr14icvF5NkTv)


    | ESTIMATED TIME || 4 minutes |


    | --- | --- |


    | PRE REQUIREMENTS |


    | --- |


    | [Install Truffle](#text00005.html#a2X3) |


    | COMMAND OVERVIEW |


    | --- |


    | `ganache-cli` |


    | Start the ganache development blockchain on 127.0.0.1:8545. |


    | `truffle compile` |


    | Compile contract source file. |


    | `truffle migrate` |


    | Run migrations to deploy contracts. |


    ## Preparing migration


    Create a new migration file. Add reference to smart contract. Add a export function
    to deploy the smart contract.


    ## Starting the blockchain


    Open a new terminal.


    VS CODE - BASH TERMINAL


    | TERMINAL |


    | --- |


    | `$ ganache-cli` |


    A new ganache blockchain is listening on 127.0.0.1:8545.


    ## Configuring the blockchain network


    Open `truffle-config.js`. Uncomment development block from networks. Make sure
    host and port are corrects.


    ## Deploying the contract


    VS CODE - BASH TERMINAL


    | TERMINAL |


    | --- |


    | `$ truffle compile` |


    `$ truffle migrate` |


    The contract was deployed to ganache blockchain. A contract address was created.


    ## Adding the token to a wallet


    Go the Brave browser (or any browser compatible with MetaMask). Select the "Localhost
    8585" network. Click on "Add Token". Click on "Custom Token". Copy the contract
    address. Paste on "Token Contract Address" field. The "Token Symbol" and "Decimals
    of Precision" is filled automatically. Click on "Next". Click on "Add Token".
    The token was added to MetaMask wallet. The token is there!


    # Create an ERC20 Token With Fixed Supply


    ERC20 fixed supply tokens define the total tokens allowed in the smart contract.
    In this type of implementation, you cannot change it after being deployed on the
    blockchain. [https://openzeppelin.com](https://www.google.com/url?q=https://openzeppelin.com&sa=D&source=editors&ust=1624824293349000&usg=AOvVaw32HS2RkQbGxWYqjIR5hmda)
    [https://www.trufflesuite.com/truffle](https://www.google.com/url?q=https://www.trufflesuite.com/truffle&sa=D&source=editors&ust=1624824293349000&usg=AOvVaw3mUxgJCana2JUfkCZhwIyh)
    [https://www.trufflesuite.com/ganache](https://www.google.com/url?q=https://www.trufflesuite.com/ganache&sa=D&source=editors&ust=1624824293350000&usg=AOvVaw2QpGKTc6Ta-52ah-2VGD_s)
    [https://metamask.io](https://www.google.com/url?q=https://metamask.io&sa=D&source=editors&ust=1624824293350000&usg=AOvVaw18b5BD_Xz2ZKDHqV8MnNrC)


    | ESTIMATED TIME || 12 minutes |


    | --- | --- |


    | VIDEO || [YOUTUBE](https://www.google.com/url?q=https://youtu.be/r7_g_uHgA6g&sa=D&source=editors&ust=1624824293352000&usg=AOvVaw0Zu7p0shqqAVPJGMiaFvpT)
    |


    | --- | --- |


    | SOURCE CODE || [GITHUB](https://www.google.com/url?q=https://github.com/davibauer/blockchain/tree/master/token-erc20-fixed&sa=D&source=editors&ust=1624824293354000&usg=AOvVaw3xsHY2LahKxjrzVfUD2RWc)
    |


    | --- | --- |


    | PRE REQUIREMENTS |


    | --- |


    | [Install Truffle](#text00005.html#a2X3) |


    | COMMAND OVERVIEW |


    | --- |


    | `truffle init` |


    | Initialize new and empty Ethereum project |


    | `npm init` |


    | Creates a `package.json` file for your project. |


    | `npm install` |


    | Installs a package and any packages that it depends on. |


    | `ganache-cli` |


    | Start the ganache development blockchain on 127.0.0.1:8545. |


    | `truffle compile` |


    | Compile contract source file. |


    | `truffle migrate` |


    | Run migrations to deploy contracts. |


    ## Creating the project


    VS CODE - BASH TERMINAL


    | TERMINAL |


    | --- |


    | `$ truffle init` |


    `$ npm init` |


    `$ npm install @openzeppelin/contracts` |


    ## Writing the contract


    Create a new solidity file. Include the license declaration (it is mandatory).
    Define the solidity minimum version. Import OpenZeppelin ERC-20 contract library.
    Define the fixed supply contract class inheriting from `ERC20`. Call the constructor
    passing the name and symbol. Assign the total supply to the sender address (who
    created the contract). Override the `decimals` function. Set the number of decimals
    that this token will have.


    | `ERC20FixedSupply.sol` |

    '
