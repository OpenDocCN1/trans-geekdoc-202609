    | `truffle compile` |\n\n| 编译合约源文件 |\n\n| `truffle migrate` |\n\n| 运行迁移以部署合约 |\n\
    \n| `truffle console` |\n\n| 连接到以太坊客户端的基本交互式控制台 |\n\n### 创建项目\n\n使用 truffle 创建新项目\n\
