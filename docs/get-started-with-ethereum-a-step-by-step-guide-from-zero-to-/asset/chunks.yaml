    \ 非同质化代币\n\n### 使用 Ganache 和 OpenZeppelin 创建您的艺术 NFT\n\nNFT 是一种代表现实世界对象（如艺术品、音乐、游戏内物品和视频）的数字资产。在这个视频中，我将向您展示如何创建一个\
