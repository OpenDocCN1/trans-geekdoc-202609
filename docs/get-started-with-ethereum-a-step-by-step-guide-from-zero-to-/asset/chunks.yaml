    # How to Get Started With Ethereum


    ## About this Book


    Get Started With Ethereum This book is a step by step guide for everyone who wants
    to start as an Ethereum developer. It was designed for those who have never programmed
    anything in blockchain and want to get started. I will cover everything from installing
    basic requirements to writing, testing and deploying smart contracts. I will also
    cover topics like IPFS, ENS, Chainlink, Truffle, Ganache, OpenZeppelin, Pinata,
    Fleek, Infura, Metamask, Opensea, among others. You will receive free updates
    as new content becomes available. Enjoy!


    ## About the Author


    Davi Pedro Bauer I have 20+ years of experience in the IT market with experience
    in analysis and systems development. I''ve been working with agile methods since
    2009, where I participated in agile adoption programs in multidisciplinary teams,
    supporting the implementation of processes and practices such as Scrum and Kanban,
    as well as the launch of new digital products for web and mobile platforms. Since
    2016, I have been studying on topics related to Blockchain, such as cryptocurrencies,
    asset tokenization, smart contracts and distributed applications (DApps) and since
    2019 I’ve been working with DevSecOps from code to infrastructure. Follow me on
    [Linkedin](https://www.google.com/url?q=https://linkedin.com/in/davibauer&sa=D&source=editors&ust=1624824293293000&usg=AOvVaw1kyQQ-tE9h-0igpZrajywT)
    Follow me on [Github](https://www.google.com/url?q=https://github.com/davibauer&sa=D&source=editors&ust=1624824293293000&usg=AOvVaw2BImFRPjY1W5nY0Z1pHovP)
    [https://leanpub.com/u/davibauer](https://www.google.com/url?q=https://leanpub.com/u/davibauer&sa=D&source=editors&ust=1624824293293000&usg=AOvVaw3T7Ob8Mtlbqf-YNKMNMlKm)


    ## Pre requirements


    ### Install Blockchain Dev Kit Extension on VS Code


    The Blockchain Developer Kit was built for both new users to Ethereum, but not
    get in the way for those familiar with the process. One of the primary goals is
    to help users create a project structure for these smart contracts, help in the
    compilation and building of these assets, deployment of these assets to blockchain
    endpoints as well as debugging of these contracts. [View on YouTube](https://www.google.com/url?q=https://www.youtube.com/watch?v%3DWIUppKQhtKk&sa=D&source=editors&ust=1624824293295000&usg=AOvVaw1YBFUmb_Tpv7XsKpH7VvtV)


    | ESTIMATED TIME  || 1 minute  |


    | --- | --- |


    ### Installing the extension


    Go to Extensions. Search for “blockchain development kit for ethereum”. Click
    on the extension created by Microsoft, usually will be the first one. ![](Image00002.jpg)Click
    on “Install”. ![](Image00003.jpg)Wait for the installation complete That’s done!


    ### Install Truffle


    Truffle is a development environment, testing framework and asset pipeline for
    Ethereum, aiming to make life as an Ethereum developer easier. [View on YouTube](https://www.google.com/url?q=https://www.youtube.com/watch?v%3DmE3_3wL5-jI&sa=D&source=editors&ust=1624824293298000&usg=AOvVaw2cFLaiP5gJqszRcJiOlcWT)


    | ESTIMATED TIME  || 2 minutes  |


    | --- | --- |


    ### Installing Truffle


    Go to the terminal windows VS CODE - BASH TERMINAL


    | TERMINAL  |


    | --- |


    | `$ npm install -g truffle` |


    ### Checking Truffle installation


    Check if the installation was done successfully VS CODE - BASH TERMINAL


    | TERMINAL  |


    | --- |


    | `$ truffle` |


    ![](Image00004.jpg)


    ### Install Ganache CLI


    Ganache is a personal blockchain for rapid Ethereum and Corda distributed application
    development. You can use Ganache across the entire development cycle; enabling
    you to develop, deploy, and test your dApps in a safe and deterministic environment.
    [View on YouTube](https://www.google.com/url?q=https://www.youtube.com/watch?v%3DfbQH6pzfXig&sa=D&source=editors&ust=1624824293302000&usg=AOvVaw0QoYm6VV7ZG3XndRnEaLWT)


    | ESTIMATED TIME  || 2 minutes  |


    | --- | --- |


    | COMMAND OVERVIEW  |


    | --- |


    | `npm install` |


    | This command installs a package and any packages that it depends on.  |


    | `ganache-cli` |


    | Start the ganache development blockchain on 127.0.0.1:8545.  |


    ### Installing Ganache


    Go to the terminal windows VS CODE - BASH TERMINAL


    | TERMINAL  |


    | --- |


    | `npm install -g ganache-cli` |


    ### Starting Ganache locally


    Start Ganache CLI on 127.0.0.1:8545 VS CODE - BASH TERMINAL


    | TERMINAL  |


    | --- |


    | `ganache-cli` |


    It will also generate 10 accounts with their respectives public and private keys
    so that you can use it for test purposes. ![](Image00005.jpg)


    ## MetaMask Install and Setup MetaMask Wallet


    MetaMask is an extension for accessing Ethereum enabled distributed applications,
    or "Dapps" in your browser. The extension injects the Ethereum web3 API into every
    website''s javascript context, so that dApps can read from the blockchain. MetaMask
    also lets the user create and manage their own identities (via private keys, local
    client wallet and hardware wallets like Trezor), so when a Dapp wants to perform
    a transaction and write to the blockchain, the user gets a secure interface to
    review the transaction, before approving or rejecting it. [View on YouTube](https://www.google.com/url?q=https://youtu.be/Bj6IozLyVxw&sa=D&source=editors&ust=1624824293310000&usg=AOvVaw35Z4w76gWuYK2yAD_VK7yB)


    | ESTIMATED TIME  || 2 minutes  |


    | --- | --- |


    ### Installing the wallet


    Go to metamask.io Click on "Install MetaMask" Click on "Add to Brave" or your
    browser name Click on "Add extension" Click on "Get Started"


    ### Configuring the wallet


    Click on "Create a Wallet" Click on "No Thanks" (but if you prefer, click on "I
    Agree" instead) Define the password that you will use to open your wallet Confirm
    the password Agree to the terms of use Click on "Create" Now you can backup your
    secret backup phrase (you can also do it later) For now, click on "Remind me later"
    Your wallet is done!


    ### Accessing your wallet


    Click on extensions and pin MetaMask to your bar Click on MetaMask icon, your
    wallet will be shown


    ### Discovering your wallet address


    Click on the three dots on the upper right side and then on "Account details"
    You can see your wallet address in hash format and in a QR code format You can
    also copy your wallet address by clicking on account name That''s all!


    ## Infura Create an Account on Infura


    Infura provides the tools and infrastructure that allow developers to easily take
    their blockchain application from testing to scaled deployment - with simple,
    reliable access to Ethereum and IPFS. [View on YouTube](https://www.google.com/url?q=https://www.youtube.com/watch?v%3DNcKMBgNsBuw&sa=D&source=editors&ust=1624824293313000&usg=AOvVaw2CHIrHiVW_pwOTZNT4B1iC)


    | ESTIMATED TIME  || 2 minutes  |


    | --- | --- |


    ### Creating a new account


    Go to [infura.io](https://www.google.com/url?q=https://infura.io/&sa=D&source=editors&ust=1624824293315000&usg=AOvVaw2qnN-ZVazIFCaJz8pZcX3o)
    Click on “Get Started for Free”. Enter your email and password Click on “Sign
    Up” A verification email will be send to your address Check your email and confirm
    your account by clicking the verification link After that, you will be redirected
    to your dashboard Click on “Ethereum” tab on the left side menu ![](Image00006.jpg)Now
    your account was created and you can start setting up a new project. ![](Image00007.jpg)


    ### Setting up your infura project


    Go to infura.io Access your dashboard Click on "ethereum" Click on "create a project"
    Define the project name You can connect with different testnets and also to the
    mainnet Save changes ![](Image00008.jpg)


    '
  trans: '


    # 如何开始使用 Ethereum


    ## 关于本书


    Get Started With Ethereum 本书是一份面向所有想要开始成为以太坊开发人员的分步指南。它专为那些从未在区块链上编程过并希望入门的人设计。我将涵盖从安装基本要求到编写、测试和部署智能合约的所有内容。我还将涵盖
    IPFS、ENS、Chainlink、Truffle、Ganache、OpenZeppelin、Pinata、Fleek、Infura、Metamask、Opensea
    等主题。随着新内容的推出，您将免费获得更新。祝您阅读愉快！


    ## 关于作者


    Davi Pedro Bauer 我在 IT 市场拥有 20 多年的经验，擅长分析和系统开发。自 2009 年以来，我一直在使用敏捷方法，期间参与了跨学科团队中的敏捷采用计划，支持实施
    Scrum 和 Kanban 等流程和实践，以及为 Web 和移动平台推出新的数字产品。自 2016 年以来，我一直在研究与区块链相关的主题，例如加密货币、资产代币化、智能合约和分布式应用程序（DApps），自
    2019 年以来，我一直在从代码到基础设施进行 DevSecOps 工作。在 [Linkedin](https://www.google.com/url?q=https://linkedin.com/in/davibauer&sa=D&source=editors&ust=1624824293293000&usg=AOvVaw1kyQQ-tE9h-0igpZrajywT)
    上关注我 在 [Github](https://www.google.com/url?q=https://github.com/davibauer&sa=D&source=editors&ust=1624824293293000&usg=AOvVaw2BImFRPjY1W5nY0Z1pHovP)
    上关注我 [`leanpub.com/u/davibauer`](https://www.google.com/url?q=https://leanpub.com/u/davibauer&sa=D&source=editors&ust=1624824293293000&usg=AOvVaw3T7Ob8Mtlbqf-YNKMNMlKm)


    ## 前置要求


    ### 在 VS Code 上安装 Blockchain Dev Kit 扩展


    Blockchain Developer Kit 是为以太坊的新用户构建的，但不会妨碍熟悉该过程的人。其主要目标之一是帮助用户为这些智能合约创建项目结构，帮助编译和构建这些资产，将这些资产部署到区块链端点以及调试这些合约。[在
    YouTube 上观看](https://www.google.com/url?q=https://www.youtube.com/watch?v%3DWIUppKQhtKk&sa=D&source=editors&ust=1624824293295000&usg=AOvVaw1YBFUmb_Tpv7XsKpH7VvtV)


    | 预计时间  || 1 分钟  |


    | --- | --- |


    ### 安装扩展


    转到扩展。搜索“blockchain development kit for ethereum”。单击由 Microsoft 创建的扩展，通常是第一个。![](img/Image00002.jpg)单击“安装”。![](img/Image00003.jpg)等待安装完成
    完成！


    ### 安装 Truffle


    Truffle 是一个以太坊开发环境、测试框架和资产管道，旨在让以太坊开发人员的生活更轻松。[在 YouTube 上观看](https://www.google.com/url?q=https://www.youtube.com/watch?v%3DmE3_3wL5-jI&sa=D&source=editors&ust=1624824293298000&usg=AOvVaw2cFLaiP5gJqszRcJiOlcWT)


    | 预计时间  || 2 分钟  |


    | --- | --- |


    ### 安装 Truffle


    转到终端窗口 VS CODE - BASH TERMINAL


    | 终端  |


    | --- |


    | `$ npm install -g truffle` |


    ### 检查 Truffle 安装


    检查安装是否成功 VS CODE - BASH TERMINAL


    | 终端  |


    | --- |


    | `$ truffle` |


    ![](img/Image00004.jpg)


    ### 安装 Ganache CLI


    Ganache 是一个个人区块链，用于快速的以太坊和 Corda 分布式应用程序开发。您可以在整个开发周期中使用 Ganache；使您能够在安全且确定性的环境中开发、部署和测试您的
    dApps。[在 YouTube 上观看](https://www.google.com/url?q=https://www.youtube.com/watch?v%3DfbQH6pzfXig&sa=D&source=editors&ust=1624824293302000&usg=AOvVaw0QoYm6VV7ZG3XndRnEaLWT)


    | 预计时间  || 2 分钟  |


    | --- | --- |


    | 命令概述  |


    | --- |


    | `npm install` |


    | 此命令安装一个包及其依赖的任何包。  |


    | `ganache-cli` |


    | 在 127.0.0.1:8545 上启动 ganache 开发区块链。  |


    ### 安装 Ganache


    转到终端窗口 VS CODE - BASH TERMINAL


    | 终端  |


    | --- |


    | `npm install -g ganache-cli` |


    ### 在本地启动 Ganache


    在 127.0.0.1:8545 上启动 Ganache CLI VS CODE - BASH TERMINAL


    | 终端  |


    | --- |


    | `ganache-cli` |


    它还将生成 10 个账户及其各自的公钥和私钥，以便您可以将其用于测试目的。![](img/Image00005.jpg)


    ## MetaMask 安装和设置 MetaMask 钱包


    MetaMask 是一个用于在浏览器中访问以太坊支持的分布式应用程序（或“Dapps”）的扩展。该扩展将以太坊 web3 API 注入到每个网站的 javascript
    上下文中，以便 dApps 可以从区块链读取数据。MetaMask 还允许用户创建和管理自己的身份（通过私钥、本地客户端钱包和 Trezor 等硬件钱包），因此当
    Dapp 想要执行交易并写入区块链时，用户会获得一个安全的界面来审查交易，然后再批准或拒绝它。[在 YouTube 上观看](https://www.google.com/url?q=https://youtu.be/Bj6IozLyVxw&sa=D&source=editors&ust=1624824293310000&usg=AOvVaw35Z4w76gWuYK2yAD_VK7yB)


    | 预计时间  || 2 分钟  |


    | --- | --- |


    ### 安装钱包


    转到 metamask.io 单击“安装 MetaMask” 单击“添加到 Brave”或您的浏览器名称 单击“添加扩展” 单击“开始”


    ### 配置钱包


    单击“创建钱包” 单击“否，谢谢”（但如果您愿意，请改为单击“我同意”） 定义您将用于打开钱包的密码 确认密码 同意使用条款 单击“创建” 现在您可以备份您的秘密备份短语（您也可以稍后执行此操作）
    目前，单击“稍后提醒我” 您的钱包已完成！


    ### 访问您的钱包


    单击扩展并将 MetaMask 固定到您的栏 单击 MetaMask 图标，您的钱包将显示


    ### 发现您的钱包地址


    单击右上角的三个点，然后单击“账户详情” 您可以在哈希格式和二维码格式中查看您的钱包地址 您也可以通过单击账户名称来复制您的钱包地址 这就全部了！


    ## Infura 在 Infura 上创建帐户


    Infura 提供工具和基础设施，允许开发人员轻松地将其区块链应用程序从测试转移到规模化部署 - 以简单、可靠的方式访问以太坊和 IPFS。[在 YouTube
    上观看](https://www.google.com/url?q=https://www.youtube.com/watch?v%3DNcKMBgNsBuw&sa=D&source=editors&ust=1624824293313000&usg=AOvVaw2CHIrHiVW_pwOTZNT4B1iC)


    | 预计时间  || 2 分钟  |


    | --- | --- |


    ### 创建新帐户


