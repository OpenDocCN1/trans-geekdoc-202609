  fmt: "\n# Add Your Badge Image to IPFS\n\nAdd your badge image to IPFS.\n\n```bash\n\
    $ ipfs add badge-image.png\n```\n\nRunning this command, you will receive a hash.\
    \ This hash is your image address in IPFS. ![](Image00017.jpg)\n\n## Pinning the\
    \ Badge to a Remote IPFS Node\n\nPin your badge using a remote IPFS service.\n\
    \n```bash\nipfs pin remote add --service=pinata --name=badge-image.png QmZPxKJWqJTdudyaZUyf6uBzwwAT41QQyxhTHmMZWB9yx4\n\
    ```\n\nYou will get a response indicating the file was pinned successfully ![](Image00018.jpg)\n\
    \n## Creating the Badge Metadata\n\nCreate the badge metadata json file.\n\n```bash\n\
    touch badge-metadata.json\n```\n\nOpen the file. Set the badge name. Set the badge\
    \ description. Set the badge image address using an IPFS gateway.\n\n```json\n\
    {\n  \"name\": \"My badge\",\n  \"description\": \"My badge description\",\n \
    \ \"image\": \"https://ipfs.io/ipfs/QmZPxKJWqJTdudyaZUyf6uBzwwAT41QQyxhTHmMZWB9yx4\"\
    \n}\n```\n\n## Add Your Badge Metadata to IPFS\n\n```bash\n$ ipfs add badge-metadata.json\n\
    ```\n\nPin your badge metadata using a remote IPFS service.\n\n```bash\n$ ipfs\
    \ pin remote add --service=pinata --name=badge-metadata.json QmRzcwAtLWbeYqyaZUyf6uBzwwAT41QQyxhTHmMZWBfUTa\n\
    ```\n\n# Compiling the Smart Contract\n\nCompile the contract using `truffle`.\n\
    \n```bash\n$ truffle compile\n```\n\n# Migrating the Smart Contract\n\nMigrate\
    \ the contract to rinkeby network using `truffle`.\n\n```bash\n$ truffle migrate\
    \ --network rinkeby\n```\n\n# Instantiating the Smart Contract\n\nInstantiate\
    \ the contract using `truffle console`.\n\n```bash\n$ truffle console --network\
    \ rinkeby\ntruffle(rinkeby) let instance = await UniqueAsset.deployed()\n```\n\
    \n# Awarding Badge to a Wallet\n\nCall the method `getThePrice`. Enter your public\
    \ ethereum address as a first parameter. Enter the IPFS address corresponding\
    \ your badge metadata.\n\n```bash\ntruffle(rinkeby) let result = await instance.awardItem(\"\
    0x62761466bB3A3Da83B408B5F5fE00ac7b2a5A996\",\"https://ipfs.io/ipfs/QmRzcwAtLWBeYqUx3ba1BkYKubSDLNTHCuiUB7WAmdfUTa\"\
    )\n```\n\n# Checking Badge on Etherscan\n\nCopy the deployed contract address\
    \ ![](Image00019.jpg)\n\nGo to [rinkeby.etherscan.io](https://www.google.com/url?q=https://rinkeby.etherscan.io/&sa=D&source=editors&ust=1624824293484000&usg=AOvVaw2X6oFOKB_p-6n7749VXd0B).\
    \ Paste the contract address in the search bar ![](Image00020.jpg). Click on search\
    \ icon. Now you can see that the contract was deployed successfully ![](Image00021.jpg).\
    \ You can also realize that the last transaction made was for award a new item.\n\
    \n# Adding the NFT Token to Your Wallet\n\nOpen your MetaMask wallet on your mobile\
    \ phone (collectibles are only available on mobile version). Click on “collectibles”\
    \ ![](Image00022.jpg). Click on \"add collectible\". Paste the token contract\
    \ address here (the same that you copied in the last section). Enter the token\
    \ ID, as it is the first token you will enter 1 here. Click on \"add\". Wait for\
    \ a few seconds. Now the NFT token was added! ![](Image00023.jpg). Click on “UniqueAsset”.\
    \ Now you can see all the badges that you earn ![](Image00024.jpg). Click on “My\
    \ Badge”. You can see the badge details now! Also, you have a send button so that\
    \ you can send it to another wallet ![](Image00025.jpg). That’s it, you just created\
    \ your first NFT token!\n\n# Ether Faucets\n\n## Get Test Ether From Faucet on\
    \ Ropsten Network\n\nThis ethereum test faucet drips 1 ether every 5 seconds.\
    \ You can use it to test smart contracts on the Ropsten network with no need to\
    \ use real ether for this purpose (even because eth from the mainnet is not valid\
    \ in ropsten and vice versa). You have a request limit of 1 eth for every 24 hours\
    \ in order to avoid network spam. Ether in a test network has no real value except\
    \ for testing purposes in smart contracts development.\n\n[https://faucet.ropsten.be](https://www.google.com/url?q=https://faucet.ropsten.be&sa=D&source=editors&ust=1624824293488000&usg=AOvVaw39Zbse6NzzonrzBxkJmjX_)\n\
    \n[View on YouTube](https://www.google.com/url?q=https://youtu.be/rSL3kP13gOI&sa=D&source=editors&ust=1624824293489000&usg=AOvVaw1VYd0meZ7Ibg4mR-22rteP)\n\
    \n| ESTIMATED TIME | 2 minutes |\n| --- | --- |\n\n| PRE REQUIREMENTS | |\n| ---\
    \ | --- |\n\n| [Install and Setup MetaMask Wallet](#text00008.html#toc20_MetaMask)\
    \ | |\n\n## Accessing the Faucet\n\nGo to [https://faucet.ropsten.be](https://www.google.com/url?q=https://faucet.ropsten.be&sa=D&source=editors&ust=1624824293492000&usg=AOvVaw0g-iC5yFF7nOgZhKww_POb).\
    \ Copy your wallet address (make sure the network selected is Ropsten). Paste\
    \ your contract address in the form field. Click on \"send me test ether\". Waiting\
    \ for the transaction. Click on the \"transaction hash\" (open in a new window).\
    \ Wait for the transaction be completed. The transaction was successfully completed.\
    \ Go to your MetaMask wallet, you have now 1 ether!\n\n## Get Test Ether From\
    \ Faucet on Rinkeby Testnet\n\nThis Ether faucet is running on the Rinkeby network.\
    \ To prevent malicious actors from exhausting all available funds or accumulating\
    \ enough Ether to mount long running spam attacks, requests are tied to common\
    \ 3rd party social network accounts. Anyone having a Twitter or Facebook account\
    \ may request funds within the permitted limits.\n\n[https://faucet.rinkeby.io](https://www.google.com/url?q=https://faucet.rinkeby.io&sa=D&source=editors&ust=1624824293493000&usg=AOvVaw35VO63U2Ccimtq0olysaU4)\n\
    \n[View on YouTube](https://www.google.com/url?q=https://youtu.be/iJBpiBqEMtA&sa=D&source=editors&ust=1624824293494000&usg=AOvVaw18LCPDv2bcqiYJTsoSKFO_)\n\
    \n| ESTIMATED TIME | 2 minutes |\n| --- | --- |\n\n## Preparing for Funding\n\n\
    Open your Metamask wallet. Copy you wallet address to clipboard. Go to your twitter\
    \ account. Paste your wallet address. Click on your tweet. Copy your tweet address\
    \ (the url in the address bar).\n\n## Funding Your Wallet\n\nGo to [https://faucet.rinkeby.io](https://www.google.com/url?q=https://faucet.rinkeby.io&sa=D&source=editors&ust=1624824293496000&usg=AOvVaw1OGB41VLbzKTklNDl_FAnP).\
    \ Paste your tweet address in the text field. Click on “Give me Ether”. Select\
    \ on of the options available (for example: 3 Ethers / 8 hours). The request will\
    \ be funding in a few seconds ![](Image00026.jpg).\n\n## Checking Your Wallet\n\
    \nWait a few moments and check your Metamask wallet. You will get 3 ether in your\
    \ wallet account!\n\n# IPFS - InterPlanetary File System\n\n## Create Your IPFS\
    \ Node\n\nThe InterPlanetary File System (IPFS) is a protocol and peer-to-peer\
    \ network for storing and sharing data in a distributed file system. IPFS uses\
    \ content-addressing to uniquely identify each file in a global namespace connecting\
    \ all computing devices.\n\n[https://ipfs.io](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293497000&usg=AOvVaw3fUJS9jf6wVMTjDheE9ywi)\n\
    \n[View on YouTube](https://www.google.com/url?q=https://youtu.be/dFWpGn73BBM&sa=D&source=editors&ust=1624824293497000&usg=AOvVaw04WtS08v6b6m1gv56Z6Lqt)\n\
    \n| ESTIMATED TIME | 3 minutes |\n| --- | --- |\n\n## Command Overview\n\n| Command\
    \ | Description |\n| --- | --- |\n| `choco install go-ipfs` | Install the IPFS\
    \ implementation in go. |\n| `ipfs init` | Initialize the local IPFS repository.\
    \ |\n| `ipfs daemon` | Start IPFS local server on 127.0.0.1:5001. |\n| `ipfs cat\
    \ <hash>` | View IPFS file content. |\n| `ipfs swarm peers` | Show the peers who\
    \ are directly connected to your node. |\n\n## Installing the Node\n\nVS CODE\
    \ - BASH TERMINAL\n\n```bash\n$ choco install go-ipfs\n```\n\n## Configuring the\
    \ Node\n\nVS CODE - BASH TERMINAL\n\n```bash\n$ ipfs init\n$ ipfs daemon\n```\n\
    \n## Testing the Node\n\nVS CODE - BASH TERMINAL\n\n```bash\n$ ipfs cat \"hash\"\
    \n$ ipfs swarm peers\n```\n\n![](Image00027.jpg)\n\n## Exploring Your IPFS Node\n\
    \nCopy the WebUI link. Go to browser and paste the link. Your node is connected\
    \ to IPFS! Click on \"files\", no files here yet! Click on \"explore\". Click\
    \ on \"peers\". This are the peers that you are connected. Click on \"settings\"\
    . You can see your node settings here.\n"
  trans: "\n\n# 将徽章图片添加到 IPFS\n\n将徽章图片添加到 IPFS。\n\n```bash\n$ ipfs add badge-image.png\n\
    ```\n\n运行此命令，您将收到一个哈希值。该哈希值是您在 IPFS 中的图片地址。![](img/Image00017.jpg)\n\n## 将徽章固定到远程\
    \ IPFS 节点\n\n使用远程 IPFS 服务固定您的徽章。\n\n```bash\nipfs pin remote add --service=pinata\
    \ --name=badge-image.png QmZPxKJWqJTdudyaZUyf6uBzwwAT41QQyxhTHmMZWB9yx4\n```\n\
    \n您将收到一条响应，指示文件已成功固定 ![](img/Image00018.jpg)\n\n## 创建徽章元数据\n\n创建徽章元数据 json 文件。\n\
    \n```bash\ntouch badge-metadata.json\n```\n\n打开文件。设置徽章名称。设置徽章描述。使用 IPFS 网关设置徽章图片地址。\n\
    \n```json\n{\n  \"name\": \"My badge\",\n  \"description\": \"My badge description\"\
    ,\n  \"image\": \"https://ipfs.io/ipfs/QmZPxKJWqJTdudyaZUyf6uBzwwAT41QQyxhTHmMZWB9yx4\"\
    \n}\n```\n\n## 将徽章元数据添加到 IPFS\n\n```bash\n$ ipfs add badge-metadata.json\n```\n\
    \n使用远程 IPFS 服务固定您的徽章元数据。\n\n```bash\n$ ipfs pin remote add --service=pinata --name=badge-metadata.json\
    \ QmRzcwAtLWbeYqyaZUyf6uBzwwAT41QQyxhTHmMZWBfUTa\n```\n\n# 编译智能合约\n\n使用 `truffle`\
    \ 编译合约。\n\n```bash\n$ truffle compile\n```\n\n# 迁移智能合约\n\n使用 `truffle` 将合约迁移到\
    \ rinkeby 网络。\n\n```bash\n$ truffle migrate --network rinkeby\n```\n\n# 实例化智能合约\n\
    \n使用 `truffle console` 实例化合约。\n\n```bash\n$ truffle console --network rinkeby\n\
    truffle(rinkeby) let instance = await UniqueAsset.deployed()\n```\n\n# 向钱包授予徽章\n\
    \n调用方法 `getThePrice`。将您的公共以太坊地址作为第一个参数输入。输入与您的徽章元数据对应的 IPFS 地址。\n\n```bash\ntruffle(rinkeby)\
    \ let result = await instance.awardItem(\"0x62761466bB3A3Da83B408B5F5fE00ac7b2a5A996\"\
    ,\"https://ipfs.io/ipfs/QmRzcwAtLWBeYqUx3ba1BkYKubSDLNTHCuiUB7WAmdfUTa\")\n```\n\
    \n# 在 Etherscan 上检查徽章\n\n复制已部署的合约地址 ![](img/Image00019.jpg)\n\n访问 [rinkeby.etherscan.io](https://www.google.com/url?q=https://rinkeby.etherscan.io/&sa=D&source=editors&ust=1624824293484000&usg=AOvVaw2X6oFOKB_p-6n7749VXd0B)。在搜索栏中粘贴合约地址\
    \ ![](img/Image00020.jpg)。点击搜索图标。现在您可以看到合约已成功部署 ![](img/Image00021.jpg)。您还可以发现最后一笔交易是用于授予新项目。\n\
    \n# 将 NFT 代币添加到您的钱包\n\n在手机上打开 MetaMask 钱包（收藏品仅在移动版上可用）。点击“收藏品” ![](img/Image00022.jpg)。点击“添加收藏品”。在此处粘贴代币合约地址（与您在上一节中复制的相同）。输入代币\
    \ ID，因为这是您将输入的第一个代币，此处输入 1。点击“添加”。等待几秒钟。现在 NFT 代币已添加！![](img/Image00023.jpg)。点击“UniqueAsset”。现在您可以看到您获得的所有徽章\
    \ ![](img/Image00024.jpg)。点击“我的徽章”。现在您可以看到徽章详细信息了！此外，您有一个发送按钮，可以将其发送到另一个钱包 ![](img/Image00025.jpg)。就这样，您刚刚创建了第一个\
    \ NFT 代币！\n\n# Ether 水龙头\n\n## 从 Ropsten 网络上的水龙头获取测试以太币\n\n这个以太坊测试水龙头每 5 秒滴 1\
    \ 个以太币。您可以使用它在 Ropsten 网络上测试智能合约，无需为此使用真实以太币（即使主网上的以太币在 ropsten 上无效，反之亦然）。您每 24\
    \ 小时有 1 个以太币的请求限制，以避免网络垃圾邮件。测试网络上的以太币除了在智能合约开发中用于测试目的外，没有真实价值。\n\n[`faucet.ropsten.be`](https://www.google.com/url?q=https://faucet.ropsten.be&sa=D&source=editors&ust=1624824293488000&usg=AOvVaw39Zbse6NzzonrzBxkJmjX_)\n\
    \n[在 YouTube 上观看](https://www.google.com/url?q=https://youtu.be/rSL3kP13gOI&sa=D&source=editors&ust=1624824293489000&usg=AOvVaw1VYd0meZ7Ibg4mR-22rteP)\n\
    \n| 预计时间 | 2 分钟 |\n| --- | --- |\n\n| 前置要求 | |\n| --- | --- |\n\n| 安装和设置 MetaMask\
    \ 钱包 | |\n\n## 访问水龙头\n\n访问 [`faucet.ropsten.be`](https://www.google.com/url?q=https://faucet.ropsten.be&sa=D&source=editors&ust=1624824293492000&usg=AOvVaw0g-iC5yFF7nOgZhKww_POb)。复制您的钱包地址（确保选择的网络是\
    \ Ropsten）。将您的合约地址粘贴到表单字段中。点击“发送测试以太币给我”。等待交易。点击“交易哈希”（在新窗口中打开）。等待交易完成。交易已成功完成。访问您的\
    \ MetaMask 钱包，您现在有 1 个以太币！\n\n## 从 Rinkeby 测试网上的水龙头获取测试以太币\n\n这个以太币水龙运行在 Rinkeby\
    \ 网络上。为了防止恶意行为者耗尽所有可用资金或积累足够的以太币来发动长期运行的垃圾邮件攻击，请求与常见的第三方社交网络账户绑定。任何拥有 Twitter\
    \ 或 Facebook 账户的人都可以在允许的限制内请求资金。\n\n[`faucet.rinkeby.io`](https://www.google.com/url?q=https://faucet.rinkeby.io&sa=D&source=editors&ust=1624824293493000&usg=AOvVaw35VO63U2Ccimtq0olysaU4)\n\
    \n[在 YouTube 上观看](https://www.google.com/url?q=https://youtu.be/iJBpiBqEMtA&sa=D&source=editors&ust=1624824293494000&usg=AOvVaw18LCPDv2bcqiYJTsoSKFO_)\n\
    \n| 预计时间 | 2 分钟 |\n| --- | --- |\n\n## 为资金做准备\n\n打开您的 Metamask 钱包。将您的钱包地址复制到剪贴板。访问您的\
    \ Twitter 账户。粘贴您的钱包地址。点击您的推文。复制您的推文地址（地址栏中的 URL）。\n\n## 为您的钱包注资\n\n访问 [`faucet.rinkeby.io`](https://www.google.com/url?q=https://faucet.rinkeby.io&sa=D&source=editors&ust=1624824293496000&usg=AOvVaw1OGB41VLbzKTklNDl_FAnP)。将您的推文地址粘贴到文本字段中。点击“给我以太币”。选择一个可用的选项（例如：每\
    \ 8 小时 3 个以太币）。请求将在几秒钟内注资 ![](img/Image00026.jpg)。\n\n## 检查您的钱包\n\n等待片刻并检查您的 Metamask\
    \ 钱包。您的钱包账户中将收到 3 个以太币！\n\n# IPFS - 星际文件系统\n\n## 创建您的 IPFS 节点\n\n星际文件系统（IPFS）是一种协议和点对点网络，用于在分布式文件系统中存储和共享数据。IPFS\
    \ 使用内容寻址来在连接所有计算设备的全局命名空间中唯一标识每个文件。\n\n[`ipfs.io`](https://www.google.com/url?q=https://ipfs.io&sa=D&source=editors&ust=1624824293497000&usg=AOvVaw3fUJS9jf6wVMTjDheE9ywi)\n\
    \n[在 YouTube 上观看](https://www.google.com/url?q=https://youtu.be/dFWpGn73BBM&sa=D&source=editors&ust=1624824293497000&usg=AOvVaw04WtS08v6b6m1gv56Z6Lqt)\n\
    \n| 预计时间 | 3 分钟 |\n| --- | --- |\n\n## 命令概览\n\n| 命令 | 描述 |\n| --- | --- |\n| `choco\
    \ install go-ipfs` | 安装 Go 语言的 IPFS 实现。 |\n| `ipfs init` | 初始化本地 IPFS 仓库。 |\n\
    | `ipfs daemon` | 在 127.0.0.1:5001 上启动 IPFS 本地服务器。 |\n| `ipfs cat <hash>` | 查看\
    \ IPFS 文件内容。 |\n| `ipfs swarm peers` | 显示直接连接到您节点的对等节点。 |\n\n## 安装节点\n\nVS CODE\
    \ - BASH 终端\n\n```bash\n$ choco install go-ipfs\n```\n\n## 配置节点\n\nVS CODE - BASH\
    \ 终端\n\n```bash\n$ ipfs init\n$ ipfs daemon\n```\n\n## 测试节点\n\nVS CODE - BASH\
    \ 终端\n\n```bash\n$ ipfs cat \"hash\"\n$ ipfs swarm peers\n```\n\n![](img/Image00027.jpg)\n\
    \n## 探索您的 IPFS 节点\n\n复制 WebUI 链接。访问浏览器并粘贴链接。您的节点已连接到 IPFS！点击“文件”，这里暂时没有文件！点击“探索”。点击“对等节点”。这些是您已连接的对等节点。点击“设置”。您可以在此处查看节点设置。\n\
    \n"
