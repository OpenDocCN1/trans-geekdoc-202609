    ## 编写合约


    创建一个新的 Solidity 文件。包含许可证声明（强制性）。定义 Solidity 最低版本。导入 OpenZeppelin ERC-20 合约库。定义从
    `ERC20` 继承的固定供应量合约类。调用构造函数传递名称和符号。将总供应量分配给发送者地址（创建合约的人）。覆盖 `decimals` 函数。设置该代币将拥有的小数位数。


