    \ 钱包。点击“Send”。输入你的 ENS 名称（例如：planou.eth）。注意该名称已解析为钱包地址。\n\n![](img/Image00031.jpg)\n\
    \n现在你可以使用 ENS 名称作为收件人，而不是使用钱包哈希地址进行交易。\n\n---\n\n# Chainlink：在智能合约中获取加密货币价格\n\n\
