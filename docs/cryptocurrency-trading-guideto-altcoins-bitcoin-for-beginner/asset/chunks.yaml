    Kriptomat 拥有良好的客户支持，提供 21 种语言。买卖手续仅为 1.45%。在转账或提取加密货币时，它不收取额外费用。


    *   `Robinhood` 是一家主流投资经纪商，方便加密货币的买卖。其用户友好平台非常安全，非常适合想要投资多种强力代币的新加密用户。


    它拥有更广泛的支付方式，并允许用户从外部账户提取资金。它没有购买费用，但会收取订单流费用。


    ## 其他购买选项


    ### 比特币 ATM 机


    这些 ATM 机的工作原理与传统机器类似，但不同在于你是存入现金购买币而不是提取现金。这是拥有比特币最快的方法，但请准备好支付 5-10% 的交易费。


    要使用 `Bitcoin ATM`，请找到一台并验证你的身份。它可能需要你的手机号来发送代码。一旦收到，输入代码和你的数字钱包地址。


    然后，将现金存入机器，使其将你购买的币发送到你的加密钱包中。等待收据即可完成。


    ### 点对点 (P2P)


    另一种购买加密货币的酷方法是 P2P，因为它是直接的，不使用中间人。对于这种方法，你需要找到一个 P2P 网站并创建账户。它免费且简单。对于比特币，你可以去
    `LocalBitcoins`；如果你想要`Ether`，请寻找 `Localtherum.com`。


    下一步是检查加密货币的列表及其价格。检查卖家为他们的加密货币设置的价格。


    找到最适合你的最佳支付方式。


    在做决定之前，不要忘记查看客户对卖家的评价。一旦你选定了一个，输入要求的详细信息：


    *   金额或你的预算是多少

    *   货币或你想要支付的选项

    *   支付方式


    某些卖家或买家会要求有效的身份证明，因此请准备好发送 ID 照片、驾照或护照的扫描件，或者拿着证件的自拍。


    一旦交易者接受了你的请求，你将在网站的托管中收到相应数量的币。然后卖家会给你一个参考号码，你将用该号码进行付款。


    使用 P2P 的优势是没有费用，且你可以使用现金支付。但在选择卖家时，你需要极其小心。


    ––––––––


    ![image](img/scene_break.png)


    ## 除购买外获得加密货币的其他方式


    ### 挖矿


    对于此选项，你需要利用你的计算机技能来求解数学方程以获得币。这还需要带有应用专用集成电路（ASIC）的高端电脑型号，因为普通电脑无法用于矿。这意味着要在设备上投入数千美元。


    如果你不想花费大量资金，另一个选项是通过加入矿矿网络来与其他矿工合作。


    ### 质押 (Staking)


    质押或权益证明系统（Proof of Stake）根据人们持有的代币数量来选择参与者。你持有的并投入质押的代币越多，你被选中确认新区块创建的机会越高。


    ### 通过微任务推广项目


    找到那些提供加密货币作为奖励或奖金的公司和初创公司，以完成如以下任务：


    ### 完成任务获取奖励


    找到那些提供加密货币作为奖励或奖金的公司和初创公司，以完成如以下任务：


    *   发布新闻稿

    *   制作视频

    *   下载视频


    ### 通过空投活动获取加密


    许多公司通过空投来建立社区。你可以通过空投活动来获取代币。


    这些活动包括：


    *   发布帖子

    *   关注社交媒体

    *   下载应用

    *   关于项目的评论

    *   注册


    ––––––––


    ![image](img/scene_break.png)


    ### 去中心化金融挖矿 (DEFI FARMING)


    去中心化金融挖矿，也称为流动性挖矿，是一种类似于债券市场的系统，可以获取收益。


    为了获得收益，你需要锁定流动性。这些收益包括 `Compound (COMP)`、`Ren (REN)`、`Kyber Network (KNC)` 以及
    `Ox (ZRX)`。


    ### 接受加密货币支付


    如果你有 `WooCommerce` 或 `Shopify`，可以开始接受加密货币。


    ### 通过网络赚取加密


    通过网络赚取加密货币包括 `Cryptocurrenjobs` 或 `Ethlance`。


    ### 从水龙头获取代币


    水龙头系统通过看广告、玩游戏或完成问卷来赚取 `Satoshis`（比特币单位）或 `Wei`（以太坊单位）。


    ––––––––


    ![image](img/scene_break.png)


    ## 当你的币达到最低金额时


    你可以提取收益并将其兑现。


    ### 现金返现


    数字银行变得日益创新，为用户通过存款或使用卡片赚取加密。


    ### 你的加密货币奖励


    加密平台提供加密登录奖励。使用奖励让你的资金翻倍。


    但是，平台要求在存款后才能提取币


    ––––––––


    ![image](img/scene_break.png)


    ![image](img/image68.png)


    ## 在选择加密货币交易所或经纪商时，请考虑以下几点


    *   **安全性**：你需要检查交易所背后的背景和声誉。如果历史显示它曾被黑客，请将其视为警告信号并考虑其他。

    *   **快速验证**：创建账户并通过验证是否容易？

    *   **交易费**：交易费越低对你越有利。

    *   **支付选项**：接受更多支付选项的交易所交易更方便。

    *   **加密货币列表**：如果你喜欢不同的币，请选择提供多种加密货币的经纪交易所。

    *   **用户评价**：客户评价可以帮助你更好地交易所。


    ## 常见问题


    加密货币和数字货币的区别是什么？


    加密货币存在于计算机网络中，不受中央银行或政府发行。数字货币也存在于虚拟世界，但由中央机构发行，并具有法定或传统货币的特征。


    加密货币受到批评的原因是什么？


    这些原因包括底层基础设施的脆弱性、汇率的波动以及用于逃税或洗钱等非法活动。


    加密货币的优势有哪些？


    它们因其透明性、抗通胀性、便携性和可分性而受到赞誉。


    其匿名性对于重视隐私和安全的人和公司也有利。


    用户之间的加密货币传输有多安全？


    '
