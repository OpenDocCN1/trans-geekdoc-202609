    # 第 3 章


    ![image](img/chapter_title_below.png)


    ## 加密货币市场如何


    加密货币市场是投资者和交易者以当前价格买卖 `Bitcoin` 和 `altcoins` 的地方。它是资产交换的一种金融市场类型。


    加密市场仍然很年轻，尽管由于波动因素存在许多投机和不确定性，它仍在快速增长。


    虽然存在影响加密货币价格的独特因素，但全球和区域经济事件（如通货膨胀、政治动荡、疾病爆发等）也会影响价格![image](img/image60.png)


    ### 概述


    - 加密货币市场的分类

    - 理解加密交易所：中心化与去中心化

    - 影响加密货币价格的关键因素

    - 市场趋势

    - 牛市与熊市

    - 利用加密股市的方法

    - 在熊市盈利的方法

    - 市场心理学

    - 什么是市场情绪分析？

    - 市场情绪指标

    - 常见问题 (FAQs)


    ---


    加密货币市场分为两类：


    #### 现货市场


    加密资产在此类市场中进行“现货”买卖。交易者提交订单，等待确认和交付，并立即结算。加密货币现货市场的交付背景是“即时”。交易者为资产支付的当前价格被称为现价。


    加密货币现货市场上有类交易者。首先是挂单者或交易发起者。如果你在你选择的交易所上列出潜在交易，你就被视为挂单者（maker）。例如是在你理想的价格点开启交易，允许潜在买家执行订单。第二类是吃单者或执行订单的交易者。如果你执行了现有的硬币订单，你就是吃单者（taker）。


