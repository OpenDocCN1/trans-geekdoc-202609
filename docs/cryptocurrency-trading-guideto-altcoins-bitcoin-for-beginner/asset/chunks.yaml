    WATCHLIST: DEFI COINS and tokens that are taking markets by storm


    Decentralized finance or DeFi is an innovative method to execute various financial
    transactions with the help of apps. It is done over the blockchain, eliminating
    the traditional intermediaries (banks, exchanges, brokerages). DeFi uses smart
    contracts or code bits that process the transactions once the required conditions
    are met. Smart contracts self-execute once the expectations occurred.


    In essence, DeFi is the concept that defines any transaction or application that
    uses cryptocurrency or blockchain technology in creating an alternative financial
    product. It offers a cheaper, faster option of digital peer-to-peer transactions
    with no minimum transaction amount. In 2020, DeFi tokens outperformed BTC. As
    of April 22, 2021, it has reached its TLV (total value locked) at $59.07 billion.


    Here’s a list of the top DeFi tokens that are showing incredible growth:


    *   Uniswap (UNI)


    The governance token and native currency of Uniswap is UNI. The crypto coins were
    first distributed to the users of the decentralized finance protocol. Each user
    that has utilized it before September 1, 2020, was given 400 UNI tokens ($1,400
    worth during that time).


    Uniswap was a brainchild of the former Siemen’s mechanical engineer Hayden Adams
    on November 2, 2018. It was popular among investors and traders because the protocol
    provides automated transactions using smart contracts mostly on the Ethereum blockchain.


    In terms of daily trading volume, Uniswap was the 4^(th) overall 4^(th) largest
    crypto exchange in October 2020. It generated $2-3 million in fees every day in
    March 2021. UNI’s market cap is over $10 billion.


    *   Chainlink (LINK)


    Chainlink’s token is Ethereum (ERC-677) based. As of January 2021, 1 LINK is worth
    $21.53 and has an $8.6 billion market cap. Chainlink is the industry’s standard
    decentralized oracle network. It empowers smart contracts to access off-chain
    computation and real-world data in a secure manner. With the backing up of blockchain
    technology, Chainlink offers the utmost security and reliability.


    It was established by Sergey Nazarov in 2017 and has garnered $32 million during
    its ICO (initial coin offering).


    *   Maker


    Maker’s TLV (total value locked) is $10 billion and has a market capitalization
    of 4.5 billion. It experienced its all-time high on April 22, 2021, with a $4,943.66
    market price. It experienced its all-time low on January 30, 2017 with $21.06.


    Maker is the MakerDao’s governance token that holds the record of being the first
    blockchain-based protocol that started DeFi’s booming market as well as the automated
    crypto-lending platforms. This token allows users to vote using the borrowing
    and lending system that creates the Stablecoin DAI, which is a community-managed
    cryptocurrency.


    *   Compound (COMP)


    After using the Ethereum network for 3 years, Compound finally launched COMP as
    its native token in June 2020. Its total value locked (TLV) is $9.5 billion with
    a market cap of $2.8 billion. It reached its all-time high of $612 on April 16,
    2021.


    Its popularity in the crypto market is anchored on its borrowing and lending decentralized
    blockchain technology. Users earn interests or cTokens when they deposit their
    cryptocurrency in any of the Compound pools. The cTokens represent your C pool
    stake, so when you deposit Ether, you will be getting ETH. Moreover, for as low
    as 1% total COMP supply, you can vote for the proposals regarding the protocol
    change or submit your proposal.


    *   Ankr (ANKR)


    As of April 22, 2021, the market cap of Ankr was $1.05 billion with a limited
    supply that totals 10 billion. As of today, there are over 7 billion ANKR coins
    circulating in the market.


    This Ethereum token powers up the Web3 infrastructure of Ankr. It is a cross-chain
    staking platform that builds dApps and hosting nodes that enhance the blockchain
    ecosystem’s efficiency. ANKR is used as payment for API services and node deployment.


    *   Aave (AAVE)


    Aave’s protocol allows the users to act as a depositor or a borrower. It has interesting
    features that offer loans without collateral and flash loans. The protocol also
    stores digital funds on non-custodial smart contracts of the Ethereum blockchain.
    AAVE token comes with a voting right to improve the protocols and participate
    in governance. It reached a $668 all-time high price on May 18.


    *   Mantra Dao (OM)


    The native token of Mantra Dao is OM, which provides full voting rights for the
    users. This community-based DeFi platform focuses on governance, lending, and
    staking. The token holders govern the ecosystem and are given rewards for their
    positive contributions. This is through Karma, which is the system’s reputation
    mechanism (works the same as credit scores). Mantra Dao is utilizing the public
    blockchain Riochain, which is both secure and scalable.


    *   Coti Network (COTI)


    COTI’s reputation has been moving upward consistently since May 24, 2021, when
    it sparked a bullish engulfing candlestick. This DeFi platform helps various organizations
    build their own payment systems and digitize their own cryptocurrencies.


    Its crypto is categorized as DAG or directed acyclic graph. It does not need miners
    and blocks to use blockchain. It uses the consensus algorithm Trustchain which
    allows one-click requests for payment purposes, uses trust scores when confirming
    transactions, and utilizes smart contracts.


    Other interesting developments include the integration of margin trading in the
    platform, the release of credit card processing solution Paywize, and the long-overdue
    integration with partner Celsius.


    *   Serum (SRM)


    The native token of Serum is SRM, which has a 10 billion maximum supply. Ten percent
    of the total supply was already unlocked during its first year, while the remaining
    ninety percent will be unlocked within the 7-year period. About 50 million tokens
    are already circulating in the crypto sphere.


    The decentralized ecosystem and exchange offer a very fast and low fee in processing
    transactions. Working on the SOL or Solana network, it can make 50,000 transactions
    every second.


    ––––––––


    ![image](d2d_images/scene_break.png)


    *   Beam (BEAM)


    BEAM tokens have a total value of $21.9 million as of December 2020. Currently,
    its trading price is between $0525 and $0.96. The Beam is a private DeFi platform
    that guarantees safe, quick, and anonymous transactions.'
