    # Chapter 3


    ![image](d2d_images/chapter_title_below.png)


    What About the Crypto Market?


    The cryptocurrency market is where investors and traders buy or sell Bitcoin and
    altcoins at current prices. It is a type of financial market where the exchange
    of assets happens.


    The market of crypto is still relatively young but is growing very fast despite
    a lot of speculations and uncertainties due to the volatility factor of digital
    currency.


    And while there are unique factors that affect the crypto market prices, global
    and regional economic events like inflation, political unrest, disease outbreaks,
    and more can influence the price


    ![image](d2d_images/image060.png)


    At a glance


    ✓  Classifications of crypto markets


    ✓  Understanding crypto exchanges: Centralized and Decentralized


    ✓  Key factors that influence the crypto market prices


    ✓  Market trends


    ✓  Bull market versus bear market


    ✓  Ways to take advantage of the crypto bull market


    ✓  Ways to profit in a bear market


