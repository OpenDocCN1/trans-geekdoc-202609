- raw: 'THE LIFECYCLE OF BITCOIN transactions begins when a user creates a request
    to transfer funds to another user. To authorize the spending of funds, a valid
    electronic signature is necessary. Then, the transaction is broadcast, confirmed,
    and shared by the network nodes until it reaches the minding node for full validation
    and recording. All transactions are irreversible and added to the system’s blocks.


    It involves three elements to be successful:


    *   Transaction input - It is the bitcoin address from where the fund will come
    from. Your bitcoin address is a string of randomly generated alphanumeric characters.
    Along with this address is your private key to help you access it and restrict
    anyone to view or steal your bitcoins.


    *   Transaction output - It is the public bitcoin address or e-wallet address
    where the fund goes.


    *   Amount – It is the value (number of Satoshi) of Bitcoin that you want to send
    to another user for whatever purpose you agreed on.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ALL THESE ELEMENTS are registered in the blockchain and encrypted for security
    reasons. It allows users to trace all Bitcoin transactions since it was first
    created, without identifying the user information. People who are viewing the
    history on the blockchain can only see the public key next to every transaction.


    Reasons to trade Bitcoin


    Bitcoin is the big brother of all crypto coins that opens the great path of trading
    and investing in digital currency.


    Its popularity is influenced by the following factors:


    *   24/7 trading


    Bitcoin trading does not stop, except for regular network maintenance. Traders
    can open or exit their positions 24/7 in a year. The crypto exchanges are all
    web-based so you trade around the clock, whenever or wherever you are.


    *   Global appeal


    Bitcoin operates in more than 90% of countries in the world. This simply means
    that you can engage in trading or transfer crypto funds even if you are in another
    part of the continent. Moreover, it is gaining more recognition as a medium of
    exchange and payment options.


    *   High volatility


    Traders are fascinated with the uptrends of Bitcoin prices, which means that speculating
    the movements is exciting and can give you a sudden windfall profit. Of course,
    the risks are high and could lead to significant losses.


    *   Deregulated landscape


    The lack of regulations makes it more attractive to people who want to take their
    trading to the next level. While crypto trading is still not mature, the impressive
    performance of Bitcoin including its ups and downs gives it clout of influence
    that appeals to investors and traders.


    Risks you should be aware of


    For beginners, trading Bitcoin can be riskier. It is necessary to be aware of
    the obvious and hidden risks before you invest your money in bitcoins. This will
    help you avoid expensive mistakes that can rob your confidence in trading.


    To avoid traps and pitfalls, understand the following factors:


    *   Dangers of volatility


    Bitcoin is regarded as the most volatile asset in the financial market, much more
    than gold and stocks. It’s true that volatility brings greater profitability in
    day trading style, it is also surrounded by unpredictability and doubt elements.


    *   Margin trading


    Margin trading using derivatives multiples profit potential as well as the risk.
    In worst scenarios, traders who engage in margin trading suffer from a loss that
    exceeds their deposit.


    *   Transaction costs


    The cost of transaction fees and charges during the buying and selling of Bitcoin
    vary. If you are into day trading and doing multiple trades, this can be a significant
    risk matter. Derivatives including binary options and CFDs can help you mitigate
    the risk.


    *   Exchange risks


    Always do business with reputable and trusted exchange platforms or brokers with
    a good reputation in the financial market. It is important that the platform is
    secure and prevents glitches during transactions.


    Also, deal with people you trust to avoid kissing goodbye to your bitcoin because
    once you transfer it, the only person who can get it is the recipient.


    *   Regulation


    Many governments are looking at Bitcoin and other cryptocurrencies with so much
    interest, trying to figure out how to impose stringent regulations.


    While it is not yet happening, some countries already ban crypto.


    ![image](d2d_images/image016.png)


    Fun Trivia


    Bitcoin is a global phenomenon that is


    constantly in trading motion.


    It is believed that an average bitcoin


    transaction is 350,000 or about


    4 transactions every second.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ARE YOU READY TO START trading Bitcoin?


    To trade Bitcoin, here’s a step by step beginner’s guide:


    Step 1: Know the price


    Head over to an exchange broker or index to find out the current price of Bitcoin.
    Its price goes up and down because of the impact of supply, integration, bad press,
    or key events.


    Step 2: Select how to get exposure to Bitcoin


    There are 3 ways to get exposure:


    *   Buying through an exchange – traders who like to have direct ownership of
    their bitcoins and go for a buy-and-hold strategy.


    *   Trading bitcoin derivatives – traders speculate on the price using CFDs without
    the need to buy coins. It allows you to take a position by ‘going short’ or ‘going
    long.’


    *   Crypto 10 index- a market capitalization-weighted index (B10 index) of top
    ten performing cryptocurrencies. Market capitalization is the result of multiplying
    the current market value of the crypto against the US dollar by the number of
    units of the given coin.


    Step 3: Choose a broker


    Decide which broker or exchange to use for trading Bitcoin. Some brokers allow
    trading the Bitcoin’s underlying assets via spread bets or CFDs.


    Step 4: Set a trading capital


    Start small and trade only what you can afford to lose. Again, trading is about
    speculations so strike while the iron is hot but proceed with caution.


    Step 5: Decide on your trading strategy


    The trading strategy is your preferred style of trading. It will determine what
    kind of trader you are. Generally, you will fall into one of these types:


    *   Day traders – those who take advantage of short term price movements in the
    crypto market


    *   Scalpers – active traders who make multiple traders every single day to gain
    small profits


    *   Swing traders – those who seek to capture market trends based on the results
    of their technical analysis


    *   Passive traders – people who hold their positions to gain long term profits


    ––––––––


    ![image](d2d_images/scene_break.png)


    STEP 6: SET STOPS AND limits


    They are important tools to manage the risks in trading. A stop order allows traders
    to set the price point where your order will be executed. It works to limit your
    losses, protect profits, as well as initiate new trading positions.


    A limit order lets traders set the minimum price that will trigger execution.
    There is an advanced setting that allows you to choose Post Only or Allow Taker.
    Enabling Post Only keeps the limit order on the order book. When it is filled,
    you will be charged a Maker Fee.


    Allow Taker allows the market order’s fulfillment whenever it crosses the spread,
    regardless if it is only a portion of the total order. The Taker Fees are calculated
    based on the portion.


    Step 7:  Open and monitor your trade


    Opening a trade means buying when you believe that the price of the Bitcoin will
    rise or selling your coin when you think that the price will fall. Monitoring
    the market is necessary to ensure that the Bitcoin price is moving favorably.


    ––––––––


    ![image](d2d_images/scene_break.png)


    STEP 8:  CLOSE YOUR position


    Whenever you feel uncomfortable, cut your loss by closing your position. You can
    also close it if you like to take your profit. All losses are deducted from your
    trading account balance and the profits are trading directly to your account.


    ![image](d2d_images/image042.png)


