    *   平台界面简单，易于使用。在左侧，你可以查看交易图。在右侧，可以看到订单类型和订单簿。要监控性能，请查看下方的图表。


    *   要开启交易仓，前往导航栏左上角的 `Markets`（市场）。选择你想要交易的市场和想要交易的对。选择 `Trade`（交易）并在字段中输入必要信息。


    *   Crypto.com 交易所使用市价单和限价单。`market order`（市价单）只需指定你想要购买的加密货币数量，将在订单簿上的最佳可能价格执行。另一方面，当你使用
    `limit order`（限价单）时，交易将在达到目标价格时成交。


    *   `Crypto.com` 没有充值和提现费，只有链上交易费用。此外，你交易得越多，支付的交易费用就越少。


    ––––––––


    ![image](img/scene_break.png)


    # BITSQUARE：最好的去中心化交易所


    ![image](img/image043.png)


    `BISQ` 或 `BitSquare` 是一个去中心化交易所，这意味着交易所不持有你的资金，也没有权威机构控制网络。它使用 `Multisignature
    wallet`（多签名钱包），需要卖家、买家和独立仲裁者的签名。


    ––––––––


    ![image](img/scene_break.png)


    ## 特性与优势：


    *   允许匿名交易

    *   良好的山寨币和法货币列表，包括稀有币种

    *   拥有超过 20 种支付选项，如现金存款、`SEPA`、银行转账

    *   无充值和提现费

    *   提供点对交易，因此你只需要根据想要交易的金额支付区块链交易费

    *   买卖双方双方也需要支付仲裁费和持有费

    *   卓越的安全性

    *   易于使用的界面和带有交易信息的图表


    ![image](img/image006.png)


    ## 在 BITSQUARE 上交易


    `BISQ` 的主要特点是去中心化，因此每笔交易都是独无二的。


    *   为了防止欺诈，它要求交易者存入 `0.1 Bitcoin` 的保证金，并从仲裁处获得 `2 Bitcoins`。作为回报，仲裁者通过成功交易获得费用。

    *   将随机选择一名仲裁者作为第三签名持有者，为每笔交易交易增加安全性。

    *   系统将待售代币和持有费放在 `MultiSig wallet`（多签钱包）中并锁定，直到交易成功确认。

    *   你可以交易平台上提供的任何山寨币。


    ––––––––


    ![image](img/scene_break.png)

    ![image](img/image079.png)


    # KRAKEN：保证金和期货交易者的最佳交易所


    `Kraken` 支持超过 50 种加密货币，并面向全球约 200 个国家的交易者。它是期货、保证金交易以及 `OTC` 交易的优秀交易所之一。其基础且友好的平台界面非常适合新手。它是欧洲交易者进行山寨币交易的首选。居住在欧盟大部分地区、`U.S.`（美国）、`Canada`
    和日本的用户可以使用银行账户进行充值和提现。


    ### 特性与优势：


    *   为机构和零售投资者提供更广泛的选择

    *   支持全球交易和投资

    *   拥有保证金账户，允许用户借用高达加密余额的 `5x`

    *   允许对 `Bitcoin`、`Litecoin`、`Ripple`、`Ethereum` 和 `Bitcoin Cash` 进行期货交易

    *   提供质押奖励

    *   拥有兼容 `iOS` 和 `Android` 设备的 App

    *   提供教育资源

    *   高净值和机构客户可以访问 `Kraken` 的账户管理和咨询服务

    *   交易费用可以高 `0.26%` 或低 `0.02%`

    *   提供在线聊天支持


    ![image](img/image033.png)


    ## 在 KRAKEN 上交易


    一旦你的账户建立好，就可以转移资金并开始交易。


    *   在 `Kraken` 中卖出、购买或转换加密货币快的方法是使用 `Buy Crypto`（购买加密货币）按钮。

    *   从 `Trade` 上的报价/行情栏选择你偏好的货币对（美元的 `ETH` 或 欧元的 `BTC`）。

    *   接下来，填写 `New Order`（新订单）表单并选择使用 `Limit Order`（限价单）还是 `Market Order`（市价单）。

    *   提交订单并点击大型 `Sell/Buy`（卖/买）按钮。你可以在确认屏幕上检查订单（或通过勾选框跳过）。

    *   如果你选择 `Market Order`（市价单），交易将立即执行。`Limit Order`（限价单）需要短暂的等待。


    ![image](img/image009.png)


    # Bittrex：账户安全的最佳交易所


    在安全性方面，没有什么能超过 `Bittrex`。除了双重认证，它还使用多阶段钱包方法将资金冷存储。此外，交易费用低于其他交易所。它的交易引擎为速度和扩展性而设计，提供实时订单执行。


    ### 特性与优势：


    *   美元的提现和充值免费

    *   对加密货币提取收取小额网络费用

    *   使用 `maker/taker`（挂单者/吃单者）费用机制，取决于交易的资产

    *   拥有 `Instant Buy/Sell`（即时买卖）功能

    *   兼容 `Android` 和 `iOS`


    ![image](img/image048.png)


    ## 在 BITTREX 上交易


    一旦你的账户激活，就可以开始交易。检查 `Bittrex` 市场查找 `Bitcoin Market`、`Ethereum Market` 和 `USDT
    Market`。


    *   将购买的加密货币存入你的账户。

    *   根据想要的山寨币设置 `Buy Order`（买单）。

    *   如果你要卖出，设置 `Sell`。


    ––––––––


    ![image](img/scene_break.png)

    ![image](img/image005.png)


    # POLONIEX：拥有海量山寨币的交易所


    这家位于 `U.S.` 的加密交易所由 `Tristan D’Agosta` 于 2014 年创立，拥有高交易量流动性。`Poloniex` 的缺点不支持法货币。它要求购买加密货币来为交易账户资金。


    ### 特性与优势：


    *   充值和提现免费，仅收区块链费用

    *   交易费用取决于你的花费金额——`0.25%` 到 `0%`

    *   良好的客户服务，包括在线聊天

    *   `24/7` 支持团队解答你的疑问并解决问题

    *   各种交易工具，如图表

    *   卓越的安全性

    *   丰富的山寨币选择

    *   适合新手和经验丰富的交易者的友好平台

    *   允许用户参与空投或加密货币/代币发放

    *   App 让你连接银行和信用卡

    *   让你运行机器人交易策略和算法

    *   允许使用各种加密对进行保证金交易以获得更大利润

    *   通过软质押或 `P2P lending` 无需交易即可赚钱

    *   易于使用的界面和带有交易信息的图表


    ![image](img/image037.png)


    ## 在 POLONIEX 上交易


    `Poloniex` 拥有你交易所需的一切。


    *   使用你的银行账户、借记卡或信用卡购买或出售你的加密货币。

    *   使用约 25 种保证金交易对和 200 多种现货交易对交易你的加密资产。


    要在移动设备或桌面电脑上交易：


    *   在你的交易账户中存入资金。

    *   从市场标签页选择你偏好的币种。每个标签页提供了多种币种和代币及其当前价格。


