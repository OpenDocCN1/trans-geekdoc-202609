    公司和机构投资者的持续流入提高了人们对加密货币（尤其是山寨币）投资的意识。事实仍然是，这些硬币和代币的价格取决于公众认知和投机。


    然而，衡量基本面因素如何影响货币的未来表现仍然是最流行的方法。如果不遵循基本准则，无论你使用哪种投资方法，投资亏损的可能性都是巨大的。


    我总结了作为加密货币投资者需要避免的 `5` 个严重的投资错误：


    1.  **投机性购买加密货币**：公司和机构投资者的持续流入提高了人们对加密货币（尤其是山寨币）投资的意识。事实仍然是，这些硬币和代币的价格取决于公众认知和投机。

    2.  **价格低并不意味着便宜**：然而，衡量基本面因素如何影响货币的未来表现仍然是最流行的方法。如果不遵循基本准则，无论你使用哪种投资方法，投资亏损的可能性都是巨大的。

    3.  **根据你的风险承受能力指导**：我总结了作为加密货币投资者需要避免的 `5` 个严重的投资错误。

    4.  **在购买前始终有一个退出策略**：`2017 年 ICO` 热潮曾震撼加密世界，当时币种数量从 `29` 个增长到超过 `850` 个项目。遗憾的是，约
    `80%` 的首次代币发行都是骗局，并留下了一串死币。

    5.  **把金鸡蛋放在同一个篮子里**：尽管如此，新开发者们已准备好创建新的山寨币。`2018 年`，有超过 `1,200` 个项目上线。两年后，市场上的货币和代币总数约为
    `8,000` 个。


    # 帮助你入场的山寨币投资技巧


    `2021 年 5 月`，随着越来越多的个人、机构和公司加入其中，加密货币总价值超过了 `$2.5 万亿`。在另一项研究中，超过 `14%` 的美国人现在拥有加密货币。


    虽然有些人是为了投机而投入资金，但许多人正在考虑长期投资，因为他们认为山寨币是对通膨胀的对冲工具。


