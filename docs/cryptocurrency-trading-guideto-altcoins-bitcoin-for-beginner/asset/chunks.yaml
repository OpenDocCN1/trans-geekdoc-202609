    * 对加密货币存款提供更多奖励和利息

    * 采用 maker-taker 定价结构，奖励交易量较大的客户

    * 为想要赚数字货币/代币的用户提供多种方式

    * 拥有 `Crypto.com Visa Card`，让您可以在任何接受 `Visa` 的地方消费并赚 8% 的收益

