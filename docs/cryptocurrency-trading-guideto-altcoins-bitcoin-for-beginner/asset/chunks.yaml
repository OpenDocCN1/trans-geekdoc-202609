    *   To open a trade position, go to the `Markets` on the top left section of the
    navigation bar. Choose the market you wish to trade in and the pair you want to
    trade. Select `Trade` and input the necessary information on the fields.


    *   Crypto.com exchange uses a market order and a limit order. `market order`
    simply involves specifying the amount of crypto you wish to purchase and it will
    be executed at the order’s book best possible rate. On the other hand, when you
    use a `limit order`, the transaction will be filled once it reaches the lower
    price.


    *   There are no deposit and withdrawal fees in `Crypto.com`, only the on-chain
    transaction cost. Moreover, the more trades you do, the fewer transaction fees
    you will pay.


    ––––––––


    ![image](d2d_images/scene_break.png)


    # BITSQUARE: THE BEST decentralized exchange


    ![image](d2d_images/image043.png)


    `BISQ` or `BitSquare` is a decentralized exchange, which means that the exchange
    does not hold your funds and there is no authority controlling the network. It
    uses a `Multisignature wallet` that asks for the seller, buyer, and independent
    arbitrator signatures.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## FEATURES AND BENEFITS:


    *   allows anonymous trading

    *   good list of altcoins and fiat currencies, including the rare ones

    *   has over 20 payment options like cash deposit, `SEPA`, bank transfer

    *   no deposit and withdrawal fees

    *   offers peer-to-peer trading, so you just need to pay the blockchain transaction
    fee depending on the amount you wish to trade

    *   buyers and sellers also need to pay arbitrator and holding fees

    *   excellent security

    *   easy-to-use interface and charts with trading information


    ![image](d2d_images/image006.png)


    ## TRADING ON BITSQUARE


    The main characteristic of `BISQ` is decentralization, so each transaction is
    completely unique.


    *   To prevent cheating, it requires traders to deposit a security amount of `0.1
    Bitcoin` and `2 Bitcoins` from the arbitrator. In return, the arbitrator earns
    a fee for successful transactions.

    *   An arbitrator will be selected randomly to be the third signature holder,
    adding security to every trading transaction.

    *   The system will place the coins to be sold and holding fees in the `MultiSig
    wallet` and lock them up until the deal is successfully confirmed.

    *   You can trade any of the altcoins available on the platform.


    ––––––––


    ![image](d2d_images/scene_break.png)

    ![image](d2d_images/image079.png)


    # KRAKEN: THE BEST EXCHANGE for margin and futures traders


    `Kraken` supports more than 50 cryptocurrencies and traders in approximately 200
    countries. It is one of the great exchanges for futures and margin trading as
    well as `OTC` trading. Its basic and user-friendly platform interface is perfect
    for beginners. It is a top choice of European traders for altcoin trading. Users
    who live in most parts of the European Union, `U.S.`, `Canada`, and `Japan` can
    use their bank account for fund deposits and withdrawals.


    ### Features and benefits:


    *   offers wider options for institutional and retail investors

    *   global trading and investing support

    *   has margin accounts that allow users to borrow up to `5x` the crypto balance

    *   allows futures trading for `Bitcoin`, `Litecoin`, `Ripple`, `Ethereum`, and
    `Bitcoin Cash`

    *   offers staking rewards

    *   has a mobile app that is compatible with `iOS` and `Android` devices

    *   provides educational resources

    *   high-net-worth and institutional clients have access to `Kraken’s` account
    management and consultation services

    *   trading fees can be as high as `0.26%` or low as `0.02%`

    *   offers live chat support


    ![image](d2d_images/image033.png)


    ## TRADING ON KRAKEN


    Once your account is up, you can transfer funds and begin trading.


    *   The fastest way to sell, buy, or convert crypto in `Kraken` is using the `Buy
    Crypto` button.

    *   Choose your preferred currency pair (`ETH` for US dollar or `BTC` to Euro)
    from the quote/ticker bar on the `Trade` page.

    *   Next, fill out the `New Order` form and choose whether to use a `Limit Order`
    or a `Market Order`.

    *   Submit your order and click the large `Sell/Buy` button. You can double-check
    the order in the confirmation screen (or skip it by checking a box).

    *   If you select the `Market Order`, the trade is instantly executed. `Limit
    Order` requires a short waiting period.


    ![image](d2d_images/image009.png)


    # Bittrex: The best exchange for account security


    Nothing beats `Bittrex` in the context of security. Along with its two-factor
    authentication, it keeps funds in cold storage using a multi-stage wallet method.
    Moreover, the transaction fees are lower than other exchanges. Its trading engine
    is designed for speed and scalability, providing real-time order execution.


    ### Features and benefits:


    *   withdrawals and deposits of US dollars are free of charge

    *   imposes small network fee for crypto withdrawals

    *   uses `maker/taker` fee based on the unit of assets you trade in a month or
    trading volume

    *   has `Instant Buy/Sell` feature

    *   compatibility with `Android` or `iOS` mobile devices


    ![image](d2d_images/image048.png)


    ## TRADING ON BITTREX


    Once your trading account is activated, you can begin trading. Check the `Bittrex`
    markets to find `Bitcoin Market`, `Ethereum Market`, and `USDT Market`.


    *   Deposit the cryptocurrency you purchased into your account.

    *   Set up `Buy Order` by adding the quantity of altcoin you want.

    *   If you are off-loading altcoins, set up `Sell order`. Select the amount of
    crypto to sell and the price you want for them.

    *   Confirm your transaction.


    ––––––––


    ![image](d2d_images/scene_break.png)

    ![image](d2d_images/image005.png)


    # POLONIEX: THE EXCHANGE with a huge list of altcoins


    This `U.S.`-based crypto exchange was established by `Tristan D’Agosta` in 2014
    and has high trading volume and liquidity. One downside of `Poloniex` is not supporting
    fiat currencies. It requires you to buy cryptocurrency to fund your trading account.


    ### Features and benefits:


    *   deposits and withdrawal of funds are both free, only blockchain fee

    *   trading fees depend on the amount you spend – `0.25%` to `0%`

    *   good customer service, which includes live chat

    *   `24/7` support team to answer your concerns and resolve

    *   various trading tools like graphs and charts

    *   excellent security system

    *   big selection of altcoins

    *   user-friendly platform that works well for beginners and experienced traders

    *   allows users to access airdrops or distribution of crypto coins or tokens

    *   the app lets you connect with banks and cards

    *   lets you run bot trading strategies and smart algorithms

    *   allows you to do margin trading using a wide range of crypto pairs for bigger
    profits

    *   helps you earn without active trading through soft staking or `P2P lending`

    *   easy-to-use interface and charts with trading information


    ![image](d2d_images/image037.png)


    ## TRADING ON POLONIEX


    `Poloniex` has everything you need to begin trading.


    *   Use your bank account, debit card, or credit card to purchase or sell your
    cryptocurrency.

    *   Trade your crypto assets with about `25` margin trading pairs and more than
    `200` spot trading pairs.

    *   Trade `Poloniex Futures` and leverage your crypto assets with up to `100x`


    To trade either on a mobile device or desktop computer:


    *   Deposit funds on your trading accounts.

    *   Pick your preferred coins from the market tabs. Each tab offers a variety
    of coins and tokens with their current prices.

