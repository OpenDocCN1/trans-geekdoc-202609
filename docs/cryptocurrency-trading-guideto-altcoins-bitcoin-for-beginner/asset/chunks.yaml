  fmt: '

    The term `cryptocurrency` comes from the concept of encryption technique that
    governs its operation. It is a complex system of cryptographic techniques and
    encryption algorithms that are similar to solving mathematical problems to secure
    and authenticate every transaction.


    This highly sophisticated encryption process is also responsible for the production
    of new units of existing cryptocurrencies. Cryptocurrencies are developed by miners
    as codes. These special codes cannot be replicated by ordinary methods, making
    `Bitcoin` and `Altcoins` virtually safe against cyberattacks.


    ## How does cryptocurrency work?


    Cryptocurrency has changed people’s shop, pay, or transact business. It allows
    users to send or receive coins as a form of payment for goods and services anywhere
    in the world.


    Consumers, investors, and traders who like the convenience of cashless and hassle-free
    transactions prefer to use cryptocurrencies.


    ![image](d2d_images/image018.png)


    ## Blockchain Technology


    The key technology behind cryptocurrencies is the `blockchain`. This distributed
    ledger technology (`DLT`) works as a database for all virtual transactions. Every
    single transaction is verified through `consensus`, a digital process that requires
    multiple systems to verify the authenticity of the algorithm output and create
    ‘blocks.’ All transactions require the unique signature of users.


    Miners confirm the transactions. Their tasks involve accepting the transaction,
    stamping it as legit, and then sharing it in the network nodes. Each node will
    confirm its validity and add it to the database, becoming a permanent part of
    the `blockchain`.


    ––––––––


    ![image](d2d_images/scene_break.png)


    BLOCKCHAIN STORES ALL the data in blocks after verification and then chained them
    together in chronological order.


    The decentralized nature of this record-keeping technology makes all entries permanent,
    irreversible, and viewable by users. All the personal details are kept safe and
    immutable.


    This incorruptible database works continuously and chronologically timestamps
    and records blocks or transactions. It operates using public-private key pairs,
    hash codes, and elliptical curve encryption.


    *   `Hash codes` – All blocks in the ledger system have their own hashes. They
    are created using a math function that converts the digital information or data
    gathered into a unique string of letters and numbers.


    Hashes verify the validity of information but do not necessarily reveal the details
    of the information.


    The hash code changes when someone attempts to change the information. For example,
    the hash is `68350abcde12345wxyz` of a certain transaction and a hacker altered
    it by changing one character.


    The other nodes will find it suspicious after cross-referencing with their own
    copies and cast away the version as invalid or illegitimate.


    For hacking to be successful, the hacker needs to alter 51% of copies on the `blockchain`.


    It would also require a lot of time, resources, and money to redo the hash codes
    and timestamps.


    *   `Public-private key pair` – They are digital keys that allow the encryption
    and decryption of the user’s confidential information.


    The keys are secret strings of numbers and letters that you use to confirm your
    authority to use your bitcoin balance for any kind of crypto transaction.


    *   `Elliptic-curve cryptography (ECC)` – It is a public-key approach that secures
    the crypto account, ensuring that funds can be used only by the rightful owners.
    `Bitcoin`, `Ethereum`, and other crypto use the elliptic curve `secp256k1` (`y²
    = x³+7` equation).


    ![image](d2d_images/image004.png)


    ## Peer-to-Peer System (P2P)


    A peer-to-peer system is the core of `Bitcoin` and other cryptocurrencies. It
    uses a distributed network to make the exchange of coins or digital assets convenient,
    quick, and efficient. A `P2P` network consists of nodes or participants that perform
    similar tasks and have equal power. Every node is an individual peer that works
    by storing and sharing the files with other nodes.


    The distributed architecture of the `P2P` system works independently and is more
    resistant to cyberattacks. There is no central server or intermediaries. It makes
    transferring `Bitcoin` or any other crypto worldwide quick and secure. Each node
    in the network has its own copy of the `blockchain` that it uses to compare with
    other nodes for data accuracy. Any inaccuracy or malicious activity is quickly
    denied by the system, making the requested transaction invalid.


    ## How did cryptocurrency come into being?


    The idea of using electronic money started in the ‘80s. The two countries that
    showed early interest to break into this revolutionary concept of using virtual
    currency were the Netherlands and the United States.


    There were several attempts to introduce digital currency in the market but failed
    to gain traction.


    *   `DigiCash` was one of the noted attempts but eventually ceased from existence
    in the 1990s. It was created by `David Chaum`, a mathematician and computer scientist.


    *   `Paypal` and other competitors emerged after that used a hybrid approach by
    offering traditional currencies.


    *   Other attempts include `Bit Gold`, `Hashcash`, and `Flooz`.


    The idea of cryptocurrency was introduced in 1998 by `Wei Dai`, a computer engineer
    that developed bmoney. To honor his big contribution to cryptocurrencies and cryptography,
    the smallest sub-unit of Ether is named `Wei`.


    `Wei Dai` talked about cryptography and how it can be used to create money instead
    of relying on central authorities.


    When he published a paper about ‘b-money,’ the anonymous and distributed cash
    system, caught the interest of the public. The core concepts of b-money were later
    seen in `Bitcoin`.


    The breakthrough happened when `Bitcoin` was introduced by the mysterious `Satoshi
    Nakamoto` to the world in 2009. He referenced `Wei Dai`’s b-money paper and adopted
    most of the core concepts like:


    *   The need for a specific amount of computational work.

    *   The work done is updated and verified using a collective ledger book.

    *   The fund exchange is done by collective bookkeeping and authentication process.

    *   The efforts of workers are awarded funds.

    *   The contract is enforced through the broadcast and uses digital signatures
    for transactions.


    During the inception of `Bitcoin` in 2008, Nakamoto contacted `Dai`, He also discussed
    business with another cryptographer `Adam Back` who is behind `Hashcash`, the
    concept that is utilized by miners during Bitcoin mining.


    DAI AND BACK WERE FREE to be “Satoshi Nakamoto”. Both denied the rumors. Other
    ‘suspects’ include:


    *   `Nick Szabo` is a noted computer scientist and cryptographer famous for his
    digital currency and digital contract research papers.

    *   `Hal Finney` was the second developer of `PGP Corporation` and was one of
    the early contributors to Bitcoin.


    ## Key Point


    Cryptocurrency is an electronic currency that you can exchange for fiat currency
    like U.S. dollars or buy another cryptocurrency but is not recognize as legal
    tender.


    ## The Creation of NEW cryptocurrencies


    Blockchain plays a central role in the creation of a new type of cryptocurrency.
    No one owns or controls this powerful technology, allowing anyone to create his
    own digital currency.

