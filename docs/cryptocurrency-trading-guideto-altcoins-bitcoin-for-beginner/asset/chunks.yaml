    ## 4. KeepKey Wallet


    KeepKey is a robust hardware wallet that looks like a big phone or mini-tablet.
    It is bit bulky and weighs about 55g. It supports more than 50 cryptocurrencies
    which include the most popular coins and tokens. This hierarchical deterministic
    (`HD`) wallet comes with a passphrase and PIN code. It costs $99.


    ### Pros

