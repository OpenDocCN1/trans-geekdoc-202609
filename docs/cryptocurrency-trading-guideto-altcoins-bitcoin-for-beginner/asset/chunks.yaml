- raw: '*   Steem – a platform that rewards publishers with crypto token or coin


    *   Cryptokitties – Ethereum-based game


    DDoS Attack


    DDoS or Distributed Denial of Service attack happens when nefarious parties take
    advantage of the network by sending multiple requests. The goal is to overwhelm
    the website’s capacity limit to handle transactions and from functioning properly.


    DDoS is primarily accomplished using a network of remotely-controlled bots or
    zombie computers. Typically, the attack is focused on certain layers such as Layer
    3 (the network layer), Layer 4 (the transport layer), and Layer 7 (the application
    layer).


    Attackers target popular crypto exchanges in attempts to steal crypto or ask for
    crypto ransom.


    Cybercriminals also use DDoS as a diversionary tactic while stealing data or installing
    malicious software to the website.


    Quick facts


    ›  In 2017, Bitcoin’s system was allegedly attacked. It caused performance slowdown
    and left consequences in terms of processing volume and data storage. Since all
    blockchain transactions are irreversible and permanent, the false transaction
    during DDoS attacks would be stored on the system.


    ›  Hongkong-based Bitfinex is a victim of several DDoS attacks (source: Twitter
    feeds showing seven attempts in 2016, seven attempts in 2017, and one attempt
    in 2018)


    Initial Coin Offering (ICO)


    ICO or Initial Coin Offering is one approach to raising funds for a blockchain
    project. It works by offering digital tokens. 


    Most ICOs are for ventures that are experimental, at an early phase of development,
    or have not started yet.


    ICOs are high-risk, speculative investments that are not for faint-hearted people.
    There is a record of projects that take a number of years before becoming commercially
    viable. Some failed.


    Risks to consider:


    *   Value fluctuation


    The value of ICOs greatly depends on their popularity, perceived value, ease of
    use, and underlying blockchain technology.


    *   Fewer safeguards


    ICOs are not regulated and highly speculative which can turn out to be scams,
    especially if it represents an overseas entity. ICOs are available online, sold
    globally, and paid with cryptocurrency, so when the issuers disappear after the
    fundraising, they are actually scams. Investors have little or no chance to get
    back their invested money.


    GLOSSARY


    A


    Algo-Trading


    Algorithmic trading is a trading system that uses automation to process the crypto
    orders of buyers and sellers. It uses algorithms or computer program rules.


    Algorithm


    It is a set of rules or processes that the computer follows to calculate operations
    or solve problems.


    Arbitrage


    Arbitrage is the strategy of taking advantage of the difference in the selling
    price between two exchanges. You buy a crypto coin or token from one exchange
    and sell it to another exchange for a profit.


    Airdrop


    Airdrop is a method of distributing tokens. It works by sending the crypto to
    a wallet address. It is often utilized for marketing functions like app downloads,
    referrals, and reshares.


    Apeing


    It is an approach that a crypto trader uses to buy a token from a project launch
    without in-depth research about it.


    Ashdraked


    It is the term used to describe the complete loss of the invested capital through
    a shorting approach.


    ASIC


    Application Specific Integrated Circuit or ASIC is a silicon chip that is designed
    for a specific task. In the context of crypto mining, the ASIC performs a calculation
    by finding values that deliver the necessary solution once it is placed into the
    hashing algorithm.


    Atomic Swap


    It refers to the crypto transfer from one user to another without the intervention
    of an intermediary or an exchange.


    AMM


    AMM or automated market maker refers to the system that gives liquidity to the
    crypto exchange.


    B


    Bag


    It is cryptocurrency slang that describes a huge quantity of a certain coin or
    token.


    Bagholder


    A bagholder is a crypto owner or investor who buys and holds a large amount of
    a certain token or token.


    Baking


    It is a process that Tezos use to append new transaction blocks to its blockchain.


    Basket


    A basket is a collection of virtual currencies that are managed and considered
    as a single asset.


    Bear Trap


    It is a coordinated attempt of a group of traders to manipulate the price of a
    specific cryptocurrency.


    Bearwhale


    Any person that holds a large number of crypto and uses them to get a massive
    profit or drive their prices down.


    Block


    Block is a file with transaction data that is completed at a given time and becomes
    a part of the blockchain network.


    Block Explorer


    It is also called the blockchain browser or an application that allows users to
    check the details of the blockchain blocks.


    Block Reward


    Block rewards come in the form of coin and transaction fees that are given to
    miners after the transaction block has been successfully hashed. The reward composition
    depends on the cryptocurrency policy.


    Blockchain Trilemma


    It refers to the 3 issues that typically affect blockchains. They are security,
    scalability, and decentralization.


    Bug Bounty


    It is a reward given to someone who completed tasks research, design work, identifying
    code vulnerabilities, and more.


    Bubble


    It is a situation where the crypto is traded at a price that exceeds its intrinsic
    value.


    Burned


    Burned coins or tokens are those that are intentionally and permanently removed
    from the list of circulating crypto.


    Buy Wall


    It refers to the extremely big limit order that a trader places on an exchange.


    C


    Candlestick Chart


    It is a graphing method that displays the changes in the crypto prices over time.
    A candle chart has 4 points of information:


    *   Opening price


    *   Closing price


    *   High


    *   Low


    Capitulation


    It refers to the process of selling crypto at a lower price, causing a significant
    loss. Traders capitulate when they believe or lose hope that the price of a certain
    currency will increase.


    Central Bank Digital Currency (CBDC)


    CBDC or Central Bank Digital Currency uses token or stablecoin to represent the
    digital form of a country’s fiat currency. The idea is to create a legal tender
    that is regulated by a central bank.


    CEX


    Centralized exchange (CEX) is a type of crypto exchange that is owned and operated
    in a centralized manner.


    Chain Split


    It describes the separation of the original coin or fork into multiple independent
    projects.


    Change


    It is a concept used in cryptocurrency that utilizes the UTXO model. Change involves
    sending back coins to the crypto holder after using the unspent output to create
    a transaction.


    Consensus


    Consensus is the process that peers or nodes agree together and allow the transaction
    to take place. It is very important in the maintenance of the distributed ledger
    systems.


    Coin


    It is a cryptocurrency that operates independently. It also describes a single
    unit of the crypto.


    Coin Mixer


    It allows users to combine transactions to various addresses, making them untraceable
    and impossible to trace back the original sender or receiver of the cryptocurrency.


    Coinbase


    It is the number of coins generated from scratch in mineable cryptocurrency as
    a reward to miners for mining new blocks.


    Confirmation


    Every 10 minutes, a new block is mined. The block confirms the new transactions.
    Large transactions may require several verifications from a number of blocks.
    Once the transaction is confirmed, it cannot be double-spent or reversed.


    Contract account


    It is an account with associated code and crypto balance.


    Core Wallet


    It is a type of wallet that can hold an entire blockchain.


    Crowdfunding


    It enables companies, especially startups, to collect funds from supporters of
    the crypto.


    Crypto Debit Card


    A card that allows holders to pay for commodities and services using their crypto
    coins or tokens.


    Cryptojacking


    It involves using the computer of another user to mine crypto without permission.


