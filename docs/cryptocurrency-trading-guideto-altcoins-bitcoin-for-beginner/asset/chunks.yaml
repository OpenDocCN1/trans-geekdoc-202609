    # 第 10 章


    ![image](img/chapter_title_below.png)


    ## 你应该了解的加密货币其他关键概念和金融词汇


    ### 加密货币质押 (Crypto Staking)


    质押是一种策略，涉及通过 `Proof-of-Stake` (`PoS`) 共识算法锁定加密货币以获得被动收入。“质押”作为验证者，以确保 `PoS` 网络的持续性、安全完整性。作为回报，验证者或质押者将获得新铸的货币。


    #### 它是如何工作的？


    * 参与者通过保留或锁定一定数量的加密货币/令牌支持网络。

    * 质押的币将在区块链上生成一个活跃的验证节点。

    * 币数量越高，质押奖励或收益越高。


    许多区块链现在采用 `PoS` 协议来应对对加密货币日益增长的需求。这种创新方法产生了更高的年化收益率 (`APY`)。


    你可以通过三种方式质押加密货币——通过加密交易所、加密钱包以及质押提供商/池。


    1. **通过加密交易所质押**


    * `Binance` 提供灵活质押，质押资金不会被锁定，质押者可以根据需要随时提回。

    * `FTX` 在一定期限内锁定质押的币（固定质押），但提供付费立即解锁的选项。

    * `Bitfinex` 提供软质押（灵活质押）。


    2. **通过加密钱包质押**


    质押加密货币最简单的方法是通过山币钱包。与在池和交易所质押相比，收益高得多。只要你使用安全的钱包，质押风险微乎其微。


    一个例子是 `Ethereum`。你可以使用 `Trust Wallet` 质押你的 `BNB` (`Binance Coin`)，根据目前的计算，可以享受超过
    23% 的 `APY`。使用同一个质押钱包，你还可以质押 `TRX` (`Tron`)、`CTX` (`Tesos`)、`ATOM` (`Cosmos`)、`KAVA`
    和 `ALGO` (`Algorand`) 来获得 6% 到 12% 的 `APY`。


    其他流行的选择还有 `Ledger Wallet`、`Trezor Wallet` 和 `Exodus Wallet`。


    3. **通过专业的质押提供商或质押池质押**


    * 质押提供商提供更全面的平台，允许加密持有者租赁节点并选择他们想要质押的币。最适合大型质押者。最流行的有 `Capital`、`Staked`、`MyCointainer`、`Stake`
    和 `stakefish`。最例子是 `AllNodes`。

    * 质押池通过允许多个质押者或验证者来运作。


    ### 有哪些风险？


    * **市场风险**：指不利的变动。

    * **流动性风险**：指潜在的问题。

    * **技术风险**：涉及技术问题。

    * **验证者成本**：指成本。

    * **锁定期**：指特定的时间范围。

    * **盗窃或丢失**：指安全担忧。


