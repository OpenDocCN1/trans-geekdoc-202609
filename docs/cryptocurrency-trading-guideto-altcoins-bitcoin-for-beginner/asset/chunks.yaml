- raw: 'Tokens are usually released through ICO or initial coin offering, which is
    also called a ‘token launch’ or a ‘token sale.’


    This crowd selling technique can be used for raising proceeds to create a product
    or building a consumer base of early birds to get the offered product. Many companies
    use ICO because it bypasses the banks’ or venture capitalists’ regulated capital-raising
    process. And even if a particular ICO ended, interested people can buy the publicly
    available tokens using the underlying currency.


    ––––––––


    ![image](d2d_images/scene_break.png)


    IS CRYPTOCURRENCY SECURE and safe to use?


    Technically, the purpose of encryption is to provide ultimate safety and security
    to all digital transactions. This advanced coding transmits and stores the data
    between the users’ electronic wallets and blockchains. These public ledgers are
    hard to tamper or hack, making them more secure.


    Moreover, all transactions need users to use a 2-factor authentication process
    like entering a username and a password. You also need to enter the authentication
    code that you will receive in your mobile phone messaging system.


    But remember that just because securities are high doesn’t mean that they are
    unhackable. History shows that Bitcoin and other cryptocurrencies are subject
    to online thefts and hacking.


    In 2018, the crypto world was rocked when Coincheck and BitGrail were hacked to
    the tune of $534 million and $195 million respectively. While blockchains are
    very secure, the other aspects of the crypto ecosystem like wallets and exchange
    platforms are not immune from scammers and hackers.


    Where to store your crypto coins?


    You need a ‘digital wallet’ to buy cryptocurrencies. This kind of wallet is an
    online app that stores your coins. It acts like a digital bank account that you
    can open using your private key.


    The digital wallet you will need also depends on the kind of crypto you like to
    possess. If you want Litecoin, find one that stores this coin. If you like Bitcoin,
    choose a wallet that safely stores bitcoins. It is important to find a secure
    cryptocurrency wallet to prevent possible theft. Once your coins are stolen, there
    is no way to get them back again.


    2 general types of crypto wallets:


    Hot wallet (software)


    A hot wallet is easy to set up, but the least safe among the three options. It
    runs on phones, tablets, computers, or any internet-connected device which makes
    this type of wallet vulnerable to hackers. It generates your private keys so you
    can access your coins. So, while it is very convenient to use during transactions,
    storing the private key on the device makes it prone to hacking.


    To avoid possible security and privacy threats, it is crucial to use tighter security
    such as two-factor authentication, strong password, or safe browsing on the internet.
    Also, use this wallet for small spending or transactions only.


    Cold wallet (hardware)


    A cold wallet or hardware wallet is a portable device that you can connect to
    your laptop or computer via USB.  It is the safer option because it stores your
    cryptocurrency in offline mode. This type of wallet is like a treasure vault that
    keeps your funds secure when you are not doing transactions or trading activities.
    Some cold wallets require the internet to connect, while others do not need it.


    Under these two categories are 4 types of crypto wallets:


    *   Web or Online wallet


    This wallet allows you to access your Bitcoin fund via a web browser. While it
    is the quickest option to complete your transaction, it is vulnerable to unauthorized
    attempts and cyber threats. It is best not to store all your bitcoins in this
    kind of wallet.


    *   Desktop wallet


    A desktop wallet is an example of a cold wallet or cold storage. It allows you
    to store your bitcoins privately and securely, but make sure to use ultimate security
    especially if you need to use an internet connection to make transactions.


    *   Mobile wallet


    A mobile wallet is a downloadable app that is installed on your phone or other
    mobile devices. It is internet-based, which is risky. What is nice about this
    thing is you can easily scan your mobile wallet’s QR code to complete your purchases.


    *   Paper wallet


    It is another offline storage that requires generating private and public keys,
    then printing them on paper. The generated code or information on that piece of
    paper lets you access your digital address, so make sure to keep it safe. Paper
    wallets are best for long-term and high-security kinds of investment, not for
    traders or constant users.


    ![image](d2d_images/image019.png)Did you know that?


    Some of the cryptography used today were


    originally created for military apps.


    ––––––––


    ![image](d2d_images/scene_break.png)


    WAYS TO ACQUIRE CRYPTO coins


    Cryptocurrencies are available in exchange platforms and brokers who facilitate
    the buying and selling between investors/traders and the market. They can be bought
    using fiat currencies and cryptocurrencies (whichever is preferred by the sellers).


    To start buying cryptocurrencies, you need to download a digital wallet. A lot
    of exchange platforms have built-in wallets, but it is up to you to have a separate
    crypto wallet for your coins and tokens.


    Exchange versus brokers


    Crypto exchange is an online platform where buyers and sellers directly trade
    coins and tokens. Using an exchange is the traditional way of trading crypto.
    It allows people to trade crypto for both crypto and fiat currencies.


    It is ideal for both beginners and advanced users who like to speculate on the
    prices.


    The most popular and trusted exchanges where you can buy altcoins are Binance,
    Coinbase, CEX.io, Bitfinex, Gemini, FTX, Changelly, KuCoin, Huobi Global, Bittrex,
    Coinmama, Bitstamp, and Kraken.


    *   Binance offers the widest variety of alternative coins and supports over 500
    trading pairs. It is best for traders who want a diverse altcoin portfolio and
    trade their crypto against Bitcoin pairs. It accepts fiat currencies as payment
    for crypto coins and tokens.


    *   CEX.io is a very secure exchange that also works as a trading exchange. If
    you are planning to buy or sell Bitcoin, DASH, and Ethereum, it is the best place
    to invest in crypto. It accepts EUR, USD, RUB, and GBP currencies as well as bank
    transfer and debit/credit cards. Card fees are around 3.5% plus $0.20.


    *   Coinmama is one of the highly trusted and easiest to use crypto exchanges.
    It offers Ether and Bitcoin to investors and traders from almost all countries
    in the world. Coinmama accepts local currency and credit cards for payments. However,
    it charges a 6% fee to cards which is higher than the others.


    *   Gemini has Bitcoin, Ether, Litecoin, Zcash, and other altcoins. This U.S-based
    exchange charges $0.99 to 1.49% transaction fees and a fee of 0.5%.


    *   Bitstamp has more options to choose from, including Bitcoin, Bitcoin Cash,
    Litecoin, Ripple, and Ether. You can pay through your credit/debit cards, bank
    transfer, Euro, or U.S. dollars. It is a bit more complicated to use, so this
    is best for advanced traders.


    It is recommended to buy big amounts when you use a credit card because it charges
    exorbitant fees for small purchases. If you use a debit card, you will be charged
    $10 if your deposit is below $1,000 and 2% for more than $1,000 deposit.


    A crypto broker is either a person or a firm that provides financial services
    for people who buy or sell their cryptocurrencies. Brokers charge users the use
    of their platforms. Some platforms like Bitpanda can be both an exchange and a
    broker.


    The best crypto brokers include Coinbase, Kriptomart, eToro, Robinhood, and TradeStation,


    *   Coinbase has a variety of altcoin choices, including Ethereum, Litecoin, DAI,
    DASH, EOS, and Ripples.'
