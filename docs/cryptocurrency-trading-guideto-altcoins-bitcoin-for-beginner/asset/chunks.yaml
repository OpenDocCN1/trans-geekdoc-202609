  trans: '


    一项推动加密货币使用以及关注隐私的技术运动，旨在推进政治和社会改革。


    ## D


    ### DeFi 聚合器 (DeFi Aggregator)

    它将不同 DeFi 平台的交易汇聚在一起。


    ### 死猫反弹 (Dead Cat Bounce)

    这是一个描述价格长时间下跌后短暂回升的术语。


    ### 去中心化社交媒体 (Decentralized Social Media)

    基于区块链的社交媒体平台。


    ### 确定性钱包 (Deterministic Wallet)

    一种通过单一种子生成地址和密钥的加密钱包。


    ### 难度 (Difficulty)

    难度是一个概述挖掘过程中区块验证困难性的概念。在 `Bitcoin` 中，`Proof of Work` 挖掘难度每 2016 个区块变化一次。这是为了调整并保持标准的
    10 分钟区块验证时间。


    ### 分布式账本 (Distributed Ledger)

    它指的是在不同设备上记录分布式信息的系统。加密区块链是一种跟踪所有交易的分布式账本。


    ### 抛售 (Dumping)

    指在短时间内大量出售加密货币的集体性行为。


    ### 粉尘攻击 (Dusting Attack)

    这种攻击的目标是发现加密货币钱包所有者的真实身份，反而可以用于网络诈骗。


    ## E


    ### 加密 (Encryption)

    它是将明文或文档与 `key` 或较短的数据字符串结合以创建密文（输出）的过程。任何获得密钥的人都可以将输出还原。


    ### 发行 (Emission)

    新加密货币的生产和释放速度。


    ## F


    ### FOMO

    FOMO 代表“害怕错过”（fear of missing out），指交易者在牛市通过买卖加密货币来获利。


    ### FUD

    它是“恐惧、不确定和怀疑”的缩写。这种策略旨在通过传播虚假、误导或负面信息，来影响交易者对加密市场或特定币种的认知。


    ### 法币入金 (Fiat On-Ramp)

    通过法币获取加密货币的一种方式。


    ### 法币锚加密货币 (Fiat-Pegged Crypto)

    它是区块链上与银行发行货币挂钩的资产、币或标记。


    ### 鱼 (Fish)

    指拥有小额加密货币投资的人。


    ### 期货 (Futures)

    它们是标准的法律协议，规定在未来的特定时间和价格买入或卖特定资产。


    ## G


    ### 创世区块 (Genesis Block)

    它是区块链网络中计算出的初始数据区块。


    ### 宝石币 (Gems)

    `gem` 一词用于描述未知的、低估但具有巨大潜力低市值加密货币。


    ### 治理代币 (Governance Token)

    它是一种代表影响加密生态系统投票权的代币。


    ––––––––


    ![image](img/scene_break.png)


    ## H


    ### 哈希 (HASH)

    哈希是指接受输入并生成被称为“数字指纹”或“哈希值”的字母数字字符串输出。加密网络中的每个区块都有一个验证交易的哈希值。


    ### 哈希化 (Hashing)

    哈希是指使用密码学哈希函数解决数学问题的挖掘过程。


    ### 半半 (Halving)

    减半是指影响 `Bitcoin` 和 `Ethereum` 等挖掘加密货币供需的事件。它基本上是在达到一定数量的区块后减半挖掘奖励的过程。


    ### 混合共识模型 (Hybrid Consensus Model)

    混合共识模型同时使用`工作量证明` (`PoW`) 和`权益证明` (`PoS`) 共识。这种机制通过允许矿工和投票者（利益相关者）验证区块，带来了平衡的网络治理。


    ### 蜜罐矿工 (Honeyminer)

    这是一个用户可以在多个设备上下载的加密货币挖掘应用程序。


    ### 价内/价外 (In-the-Money/Out-of-the-Money)

    这是两种状态。


    ## I


    ### 无限铸币攻击 (Infinite Mint Attack)

    发生在黑客铸造不需要的代币时。


    ### 去中心化交易所 (Initial Dex)

    `IDX` 是一种允许在没有中心机构的情况下交易代币的去中心化交易所。（注：原文中“价内/价外”的源术语不完整，此处已根据上下文重构）。


    ––––––––


    ![image](img/scene_break.png)


    ### 首次发行 (INITIAL OFFERING)

    一种众筹方法，项目通过向公众出售数字代币来募集资金。


    ### 首次代币发行 (Initial Token Offering)

    `ITO` 类似于 `ICO` 但提供了实用性。


    ### 瞬间铸币 (Instamine)

    （注：内容不完整）


    ### 内在价值 (Intrinsic Value)

    在加密货币中，内在价值指其实际价值。


    ––––––––


    ![image](img/scene_break.png)


    ## J


    ### JOMO

    它代表“错过的喜悦”（Joy of Missing out），是 `FOMO` 的对立面。


    ## K


    ### 泡菜溢价 (Kimchi Premium)

    这是一种韩国交易所价格看起来高于全球交易所的现象。


    ## L


    ### 账本 (Ledger)

    它是区块链上的交易记录。


    ### 轻量节点 (Light Node)

    这种类型的计算机使用不同的验证过程，无法下载整个网络数据。


    ### 流动性 (Liquidity)

    它是用于表示硬币或标记易变现程度的术语。


    ## M


    ### 恶意软件 (Malware)

    恶意软件是有害软件。


    ### 保证金维持 (Margin Call)

    账户价值低于维持金额。


    ### 市值 (Market cap)

    市值是加密货币的总估值。


    ### 内存池 (Mempool)

    它是未确认交易的集合。


    ### 梅尔克树 (Merkle Tree)

    它是一种密码学树结构，其中每个叶节点都标记有数据，而非叶节点具有其子节点的哈希值。


    ### 挖掘难度 (Mining Difficulty)

    指的是寻找下一个区块的难度。


    ### 矿场 (Mining Farm)

    当一组加密货币矿工为了一个目标共同工作。


    ––––––––


    ![image](img/scene_break.png)


    ### 挖掘奖励 (MINING REWARD)

    它是矿工为挖掘新区块而获得的奖励。


    ### 矿机 (Mining rig)

    指的是矿工用于挖掘的设备。


    ### 涨月 (Moon)

    这是一个显示加密货币价格持续上涨的情况。


    ## N


    ### 网络 (Network)

    它是区块链中用于处理和验证交易的节点。


    ### 节点 (Nodes)

    节点是连接到加密网络的计算机。节点负责中继和验证交易，同时保留区块链副本。节点有两种类型：


    *   全节点 – Full node – 可以完全下载区块链完整数据并完全验证加密货币交易的计算机。

    *   轻量节点 – Lightweight node – 这种计算机使用不同的验证过程，无法下载整个网络数据。


    ## O


    ### 开源 (Open Source)

    它是一种参与者相信信息开放共享的理念。


    ### 期权 (Option)

    它是一种合同，赋予交易者买入或卖出标的或资产的权利（而非义务）。


    ### 预言机 (Oracle)

    区块链网络中，预言是将数据传输到智能合约的机器或人类。


    ## P


    ### 点对点 (P2P)

    两个双方之间的去中心化交互。


    ### 许可账本 (Permissioned Ledger)

    许可账本由一个人或一组人拥有。对网络或账本的任何访问都由所有者授予。与公共区块链相比，许可账本运行更快且更容易维护。这种类型账本的数据具有高度可验证性，所有方均可用。


    ### 庞氏骗 (Ponzi Scheme)

    这是一种欺骗性的投资策略，通过新投资者的投入资金向旧投资者提供回报。


    ### 私有区块链 (Private Blockchain)


