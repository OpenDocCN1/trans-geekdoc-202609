    # Chapter 10


    ![image](d2d_images/chapter_title_below.png)


    ## Other Key Concepts and Financial Lexicon in Crypto That You Should Know


    Crypto Staking


    Staking is a strategy that involves ‘locking up cryptocurrency through Proof-of-Stake
    (PoS) consensus algorithm to earn passive income. The ‘stake’ serves as a validator
    to ensure the continuity, security, and integrity of the PoS network. In return,
    the validators or stakers receive newly minted coins.


    How does it work?


    *   The participant supports the network by setting aside or locking up a certain
    amount of crypto coins/tokens.


    *   The staked coins will generate an active validating node on the blockchain.


    *   The higher the volume of coins, the greater the staking compensation or interest.


    Many blockchains are now adopting PoS protocols as a response to the increased
    demand for cryptocurrencies. This innovative approach yields a higher annual percentage
    yield (APY).


    You can stake crypto in 3 ways – via crypto exchanges, crypto wallets, and staking
    providers/pools.


    1\. Staking via crypto exchanges


    *   Binance offers flexible stalking or the staked funds are not locked and can
    be withdrawn by stakers anytime they want


    *   FTX locks staked coins within a certain period (fixed staking, but offers
    an option to instantly unlock them for a fee


    *   Bitfinex offers soft staking (flexible staking)


    2\. Staking from crypto wallets


    The easiest way to stake your crypto is via altcoin wallets. The yields are much
    higher compared to staking in pools and exchanges. As long as you use a secure
    wallet, the staking risks are very minimal.


    One example is Ethereum. You can stake your BNB (Binance Coin) using Trust Wallet
    and enjoy more than 23% APY based on the current computations. Using the same
    staking wallet, you can also stake TRX (Tron), CTX (Tesos), ATOM (Cosmos), KAVA,
    and ALGO (Algorand) to earn 6% to 12% APY.


    Other popular choices are Ledger Wallet, Trezor Wallet, and Exodus Wallet.


    3\. Staking with dedicated staking providers or staking pools


    *   Staking providers offer a more comprehensive platform that allows crypto holders
    to lease nodes hosting and choosing coins they want to stake.  It is best for
    large stakers. The most popular are Capital, Staked, MyCointainer, Stake, and
    stakefish. The most popular example is AllNodes.


    *   Staking pools work by allowing multiple stakers or validators to deposit their
    funds to increase the block rewards. By combining the computations resources to
    verify and validate new blocks in the network, the stakeholders get a share from
    the rewards. This option offers frequent staking income and more predictability.


    What are the risks?


    *   Market risk – It refers to the potential adverse movement of the price of
    the staked coins/tokens.


    *   Liquidity risk – It is important to make sure that your crypto has a high
    trading volume and liquidity.


    *   Validator risk – It involves technicalities that can disrupt the staking process
    or the validator nodes.


    *   Validator cost – The costs you pay for running validator nodes (electricity/hardware)
    or percentage of the rewards can reduce your staking returns


    *   Lockup period – This staking option does not allow access to your assets for
    a specific duration of time.


    *   Rewards duration – Opting for long reward duration prevent stakers to reinvest
    the rewards, so choose assets that can give you daily staking rewards


    *   Theft or loss - Using a custodial staking platform that does not guarantee
    strong security is a red flag, so make sure that you go for staking wallets/exchanges/providers
    that are trusted and well-established.


    ![image](d2d_images/image041.png)


    The hottest coins that offer big staking rewards are Ethereum 2.0, XTZ (Texos),
    ALGO  (Algorand), ICX (ICON), ADA, DOT, ATOM (Cosmos), and NEO.


    Decentralized Finance (DeFi)


    DeFi is a peer-to-peer, digital financial services technology that allows crypto
    trading, interest accounts, and loan transactions.


    ––––––––


    ![image](d2d_images/scene_break.png)


    IT OFFERS THE FOLLOWING core benefits:


    *   True decentralization that dispenses third party interventions, censorship
    resistance, and global participation


    *   A non-custodial system that allows users to store their private keys and be
    in total control of their assets


    *   With blockchain as technological infrastructure, there is contract automation
    and immutability as well as low-cost, quick transactions


    *   Improved transparency protocols in the ecosystem that results in market and
    price efficiency.


    *   Favors network effects that generate innovations and combinations of projects
    in layer 2 and 3 applications


    This blockchain-based concept of finance uses smart contracts rather than traditional
    financial instruments. Smart contracts refer to the set of special codes that
    automate the agreements between borrowers and lenders or buyers and sellers of
    digital currencies.


    DeFi makes the assets open to the public decentralized network, allowing anyone
    to use the blockchain system instead of using middlemen. It utilizes technology
    to eliminate intermediaries and allow peer-to-peer transactions. All DeFi transactions
    and activities are done without the help of banks, exchanges, brokerages, and
    other financial institutions.


    Other use cases that utilize DeFi:


    *   Lending and borrowing crypto to earn interest (via Aave, Dharma, Compound)


    *   Betting on the outcome of the events (via Augur, Synthetix, TokenSet)


    *   Buying Stablecoins that are pegged to a currency or commodity (via EOSDT,
    MakerDAO)


    *   Creating and exchanging asset derivatives like precious metals or fiat currencies
    (via Synthetix)


    *   Decentralized exchange of crypto (via Oasis, IDEX, Kyber)


    *   Insurance (via Etherisc)


    *   Taking part in a lottery (via Synthetix)


    ––––––––


    ![image](d2d_images/scene_break.png)


    Quick facts


    ›  The DeFi components are Stablecoins, a software track, and use cases


    ›  The infrastructure and use cases of the DeFi ecosystem are still under development


    ›  Oversight and regulation of decentralized finance are still lacking


    ›  In the future, many believed that DeFi would replace the current rails of modern
    finance systems


    ›  The primary exchange or network that supports decentralized finance activities
    is the Ethereum


    ›  DeFi revolves around dApps or decentralized applications.


    ›  Grayscale and other major asset management firms are starting to invest in
    DeFi technology


    ›  As of March 2021, the total locked-in value of DeFi smart contracts was over
    $41 billion


    DECENTRALIZED APPLICATIONS (DApps)


    In cryptocurrency, DApps or Decentralized Applications are digital protocols that
    run on a peer-to-peer (P2P) computing system or blockchain network.


    They are often called smart contracts that distributed ledger technologies (DLT)
    like the Ethereum blockchain have popularized.


    All DApps are executed and stored in the blockchain system.


    Examples of DApps;


    *   Uniswap – decentralized crypto exchange


    *   Freelance – smart contract platform


    *   Augur – prediction market platform


    *   Blockstack – a platform that is designed for decentralized apps development'
