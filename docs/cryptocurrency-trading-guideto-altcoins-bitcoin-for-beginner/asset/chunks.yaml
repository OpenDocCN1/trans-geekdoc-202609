    * 100% cold storage that does not require WiFi, Bluetooth, or USB connectivity

    * supports more than 10000 coins/tokens and 23 blockchains

    * offers unlimited currency storage

    * easy-to-carry and lightweight

    * holds multiple assets in a single device

    * supports firmware upgrade


    ### Cons

