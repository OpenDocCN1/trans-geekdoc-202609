    # Chapter 1


    # What’s All This Buzz About Cryptocurrency?


    ![image](d2d_images/chapter_title_below.png)


    Bitcoin started it all. This revolutionary, trendsetting cryptocurrency that was
    introduced in the digital world over a decade ago continues to dominate the scene.
    When the interest of investors and traders grew, Altcoins or alternative currencies
    were launched to satisfy the growing needs in the market.


    This group of cryptocurrencies is patterned after Bitcoin with a slight alteration
    of the basic functions and operational rules. The purpose of alternation is to
    create new cryptocurrencies that serve general or specific functions.


    But before we delve in further, let’s take a look at the rationale of cryptocurrency
    and why it is very popular today. This digital currency exists only electronically,
    so you do not possess physical coins unless you cash them out for tokens. Cryptocurrencies
    use electronic wallets for storage, eliminating intermediaries like banks.


    All transactions are made online, using your computer, mobile phone, or any electronic
    gadget that allows the exchange of crypto from your end to another user.


    ![image](d2d_images/image071.png)


    At a glance


    ✓  Why are cryptocurrencies very popular?


    ✓  What is cryptocurrency?


    ✓  How does cryptocurrency work?


    ✓  Blockchain technology


    ✓  Peer-to-Peer (P2P) System


    ✓  How did crypto come into being?


    ✓  The creation of new cryptocurrencies


    ✓  Mining: The method of creating new coins of existing cryptocurrencies


    ✓  Are crypto coins and tokens the same?


    ✓  Is cryptocurrency secure and safe to use?


    ✓  Where to store your crypto coins?


    ✓  Ways to acquire crypto coins


    ✓  Frequently Asked Questions (FAQs)


    Why are cryptocurrencies very popular?


    *   They are the currencies of the future.


    *   They are independent and free from manipulation and interference of any central
    authority or government.


    *   They are not governed by central banks, so you don’t pay bank charges for
    your transactions.


    *   They are not affected by inflation.


    *   They are useful for quick payments and sensitive transactions.


    *   They are secured by cryptography which prevents double-spend or counterfeit
    activities.


    *   They are digital gold and grow in value over time.


    *   They serve as financial instruments of investment or trading.


    What is cryptocurrency?


    Cryptocurrency is a digital asset that is distributed in a vast network of computers.
    It has a decentralized structure that exists beyond the control and influence
    of central banking authorities or governments. Unlike the traditional or ‘fiat’
    currencies like euros and dollars, cryptocurrencies only exist in the virtual
    domain. You know that you own them but you cannot see or hold them. You only have
    the numbers or the amounts in your digital account. '
