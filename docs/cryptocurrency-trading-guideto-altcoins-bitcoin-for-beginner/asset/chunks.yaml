    卡尔达（Cardano）被称为“以太坊的杀手”，因为它的区块链技术更高效。这种加密货币的背后是 Charles Hoskinson，他在看到以太坊的发展方向后，在与其他联合创始人产生分歧后离开了以太坊。他共同创立了这种基于研究方法论的乌洛洛斯（Ouroboros）权益证明数字货币。


    该项目的各项研究由加密货币专家、数学家和工程师完成。卡尔达的数字资产是`ADA`，以英国数学家、19 世纪的阿达·洛夫莱斯夫人（Ada Lovelace）命名。


