    and Gavin Wood. Wood is one of the co-founders of Ethereum. He wrote Polkadot’s
    protocol, which is designed to link the blockchains (permission-less and permissioned)
    and oracles to form a relay chain that offers interoperability of the different
    networks.


    It also allows the developers to generate their own blockchain using Polkadot’s
    security measures. This concept is referred to as shared security.


    As of January 2021, `1 DOT`’s market value was $12.54 and a market cap of $11.2
    billion.


    ![image](d2d_images/image085.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    By 2030, Coin Price Forecast predicts that the market price of Polkadot would
    hit $41.81.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## CARDANO (ADA)


    Cardano is dubbed as the ‘killer of Ethereum’ because its blockchain technology
    is more efficient. Behind this cryptocurrency is Charles Hoskinson, who left Ethereum
    after some disagreements with his other co-founders when he saw the direction
    it was taking. He co-founded this ouroboros proof-of-stake digital currency based
    on the research-based methodology.


    The various research of the project was done by crypto experts, mathematicians,
    and engineers. Cardano’s digital asset is `ADA` which is named after the English
    mathematician and 19th-century Countess Ada Lovelace.


    ––––––––


    ![image](d2d_images/scene_break.png)


    AS OF JANUARY 2021, the trading price of `1 ADA` was $0.31 with a market cap of
    $9.8 billion.


    ![image](d2d_images/image061.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    By 2030, Price Coin Forecast prediction for `ADA`’s market price is $6.03.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## RIPPLE (XRP)


    Ripple is both a digital payment system and a cryptocurrency. The founders Jed
    McCaleb and Chris Larsen made it public in 2021. Its primary process is a remittance
    and payment settlement asset exchange. Its crypto token is `XRP` whose function
    is to act as an intermediary exchange mechanism between two different networks
    or currencies.


    Rather than utilize the blockchain mining process, it adopts the consensus mechanism
    to confirm the transactions with the help of bank-owned servers. Transactions
    in Ripple are cheaper and faster. In the context of market capitalization, it
    was the 5^(th)-largest altcoin with around $60 billion market capitalization and
    a market price of $1.60.


    ![image](d2d_images/image035.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    COIN PRICE FORECAST for `XRP`’s market price by 2030 would be $5.45.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## DOGECOIN (DOGE)


    Dogeecoin is a joke but Shiba Inu face. In 2021, Dogecoin reached $85,314,523.
    It was a meme but became a legitimate investment. In 2030, Dogecoin''s market
    price would hit $17.50 according to Coin Price Forecast. (Note: Based on provided
    text context logic for Dogecoin section).


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## STELLAR (XLM)


    Stellar is a cryptocurrency that was developed by Jed McCaleb and Joyce Kim in
    2014. The platform connects banks and users. As of January 2021, the market cap
    of Stellar was $6.1 billion and `1 Lumen` was valued $0.27. According to Coin
    Price Forecast, the market value of Lumen would be $1.39 by 2030.


    ––––––––


    ## MONERO (XMR)


    Mon is a private, secure, and untraceable cryptocurrency that was introduced to
    the market in April 2014. The open-source blockchain of Monero is opaque, disguising
    the users’ addresses and the amount. As of January 2021, the market cap of Monero
    was $2.8 billion and `1 XMR` amounted to $158.37. Coin Price Forecast has predicted
    that by 2030, the market price of Monero would reach $1,006.


    ––––––––


    ## TRON (TRX)


    Founded by Tron Foundation headed by its CEO Justin Sun, Tron uses peer-to-peer
    (P2P) and blockchain components. Its cryptocurrency is Tronix (`TRX`), which is
    worth $0.05. In March 2021, `TRX` ranked 22^(nd) in the list of cryptocurrencies.
    In 2030, `TRX` market price would hit $0.3048.


    ––––––––


    ## ZCASH (ZEC)


    ZCash is a crypto coin that provides what Bitcoin cannot-the option for the transactions
    to be viewed if the users allow it.

