    # 比特币作为法定货币。


    这发生在 2021 年 6 月 9 日。


    ––––––––


    ![image](img/scene_break.png)


    # 什么是最佳的**比特币**交易策略？


    通过交易比特币来获利被认为是加密货币交易中的通用策略。比特币被接受为一种交易和支付工具。它仍然是加密货币市场中最热门的交易工具，远超黄金交易、石油交易或股票交易。


    ––––––––


    ![image](img/scene_break.png)


    ## 投资者与交易者


    他们因其革命性的区块链技术而相信比特币的能力。从本质上说，最好的 BTC 交易风格是与你的目标、资金和风险偏好相一致的风格。此外，策略应该由 85% 的价格行为分析和
    15% 的利用指标的策略组成。


    策略是必要的，因为它们可以作为你交易的指南并减少巨大的损失。如果没有清晰且稳健的策略，你会被交易领域许多令人分散的因素所击败。


    交易策略可以帮助你通过何时建仓以及何时在市场反转之前获利，从而使资本最大化。


    一个有效的比特币策略应该包括你将使用的工具和指标、要采取的设置、触发你入场和出场的因素、影响头寸大小的元素，以及你衡量和记录投资组合表现的方法。


    ––––––––


    ![image](img/scene_break.png)


    ## 针对初者的推荐策略


    为了找到适合你的策略，这里有一份针对初者的推荐策略列表：


    ### 趋势交易


    在长十年的历史中，比特币多次证明了自己是一个强大的趋势驱动者。趋势交易者不希望经历 FOMO（错失恐惧症），因此他们会持续关注任何影响比特币价格的重大事件或新闻。


    趋势交易涉及持有仓位数小时、几天甚至几个月。这是因为你相信正在进行的趋势将继续朝着当前方向移动，或创造另一个趋势。使用这种策略的交易者通过技术分析预测市场价格动能的潜在方向。


    最有效的动量和趋势指标是随机震荡、移动平均线和 `RSI`（相对强度指数）。


    ### 震荡交易


    这是另一种适合初者的交易风格，因为它包含需要较长时间才能完成的元素，允许交易者思考自己的决策和选择。它要求观察比特币价格周期的“自然波动”，并进行定位，直到获得预期的利润或坚持到价格波动停止。它可能涉及持有仓位超过
    24 小时但少于一个月。


    从本质上说，震荡交易是日内交易和趋势交易的结合。


    ### Hod 币（长期持有）


    HODLing（意为“为了活命而坚持”）是一种流行的比特币交易策略，源于 2013 年。那是比特币价格急剧下跌的一年，其中一个用户输入了 `hodling`
    而不是 `holding`，以表示他维持仓位的意图。


    这个术语最终演变成一种交易策略，涉及坚持持有多头头寸，相信价格很快就会达到顶点。然而，这种策略具有风险性。你需要为这个选择制定一个稳健的风险管理计划。


    ### 对冲


    对冲比特币涉及开**多个策略性交易，以避免或减少当前头寸的风险。这是一种用于降低风险的策略。


    ––––––––


    ![image](img/scene_break.png)


    ## 流行交易风格


    ### 日内交易


    这适用于在同一天内开仓和平仓的活跃交易者。


    ### 突破交易


    这种策略要求交易者在价格突破关键水平时进入市场。


    ### 剥皮交易（Scalping）


    这是一种专注于短期持仓以获取丰厚利润的交易风格。


    '
