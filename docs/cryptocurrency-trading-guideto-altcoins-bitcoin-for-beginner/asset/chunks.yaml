    * offers crypto-backed loans and staking rewards

    * has a mobile app for traders on-the-go

    * provides spot trading and margin trading accounts for more advanced traders

    * uses `taker/maker` schedule that is based on a 30-day trading volume

    * allows users to trade on the margin platform with over 100 times leverage without
    securing another account

    * provides downloadable reports that show transaction history and real-time account
    balances

