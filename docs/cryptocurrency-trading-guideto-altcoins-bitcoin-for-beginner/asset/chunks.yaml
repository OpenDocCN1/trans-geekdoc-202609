- raw: 'Traders who use this style of trading typically buy or sell their coins as
    soon as the volatility occurs. They make trading rules or algorithms of their
    own based on fundamental analysis or technical analysis.


    4- Position trading


    Position trading, also called trend trading, works by purchasing assets and holding
    them for extended periods like months. The goal is to sell the assets in the future
    at a higher amount. It is ideal for beginners because the long time frames provide
    ample opportunity to weigh their decisions. For novices, it is regarded as a buy-and-hold
    trading style.


    Position traders are on the lookout for trends to gain profits with the help of
    fundamental analysis. You need to take or build a short position high or long
    position low and stay with it for some time.


    It looks like investing but the objective is to create a killer trade by acting
    on trends.  By jumping or riding the ‘wave’, position traders benefit. They would
    exit quickly once the advantageous trend breaks.


    Other styles of crypto trading:


    Intraday trading


    This is a type of day trading that lets the traders hold their positions multiple
    times throughout the regular trading hours.  Take note that crypto markets do
    not really close, so the trading continues. You can use software that allows intraday
    traders to automate positions in the trading market.


    Range trading


    Range trading aims to trade the range, not to buy assets after a downtrend or
    buy during an uptrend. Range traders take advantage of the current range of predictable
    or profitable trades. They set stops to buy the range’s bottom and then scale
    it out to the top and sell.


    In this style of trading, the range provides a clear picture of support and resistance
    and works well when you use candlestick chart analysis.


    The assumption is that the support and resistance hold the edges of the trading
    range until it breaks. In a simple explanation, it means the upper edge can push
    the current price downward, while the range’s lower edge can push the crypto price
    upward.


    When the price of the cryptocurrency ranges between the levels of support and
    resistance, you buy the support level/ exit at the support level and sell the
    resistance level/short the resistance level.


    This straightforward style of trading is perfect for beginners, but you need to
    fully understand the concepts of support and resistance levels, candlestick charts,
    and momentum indicators such as Relative Strength Index Indicator (RSI) and Moving
    Average Convergence Divergence (MACD). Both are tools for Technical Analysis.


    HFT or High-Frequency trading


    High-frequency trading uses trading bots and algorithms for quick entry/exit in
    multiple positions within short time frames. HFT traders are likely to gain a
    significant advantage over competitors by taking advantage of a few milliseconds.
    This style is suitable for veteran traders.


    It is popular among the ‘quant’ (or quantitative) traders who develop algorithms
    to execute complex strategies. While it may look like a day trading method, HFT
    is more complicated because it involves backtesting, keeping track, and tweaking
    the algorithms to match the constant changes in the market conditions. So while
    the trading bots make it easy for traders, traders are strategizing. 


    Moreover, developing your own HFT bots necessitated advanced knowledge of the
    market concepts, computer science, and mathematics. The other option is to buy
    an HFT bot.


    ![image](d2d_images/image073.png)


    Key Point


    Some trading overlap so you should know what


    style works for you in terms of financial and


    emotional well-being.


    Stick to your game plan to avoid unnecessary


    stress and risks.


    ––––––––


    ![image](d2d_images/scene_break.png)


    HOW TO PICK THE RIGHT trading style?


    There is no right or wrong trading style. It all depends on the individual goals
    and preferences. Here are some general reminders that may help you during the
    selection.


    *   Find your trading style and refine it. You can calibrate your style as you
    practice your trading skills. Your goal here is to master your methodology by
    sticking to it. Do not change your style when it does not for some trading session
    or you feel that it is not delivering your targets, instead review and adjust
    your strategies.


    *   Expect failures, miscalculations, and mistakes when you are trading assets,
    especially cryptocurrency because of its volatility. The bull market does not
    stay easy or favorable to many traders, so always be prepared for some heartbreaks
    and financial loss. Learn the lessons and review your errors.


    *   Apply risk management protocols to reduce loss. This includes not switching
    from one style to another trading style. Adjust your strategy to have greater
    opportunities to gain profits.


    Do not be afraid to engage in the next trading because statistics show that the
    next trade can be your ticket to success.


    *   Take care of your crypto portfolio by avoiding buying high and selling low
    like the day trading at a low or investing at high. Understand how the market
    conditions move and learn the trading tricks. Take your time and do not attempt
    to do frenzy trading to prevent killing your portfolio.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ELEMENTS THAT AFFECT cryptocurrency trading


    As a newbie in crypto trading, you need to understand the following factors:


    *   Market cap


    Market cap or market capitalization in cryptocurrency refers to the value of all
    mined coins. The total value is determined by multiplying the number of coins
    that are circulating in the market by the present market price of the coin.


    ![image](d2d_images/image014.png)


    Circulating Supply of Coin x Current Price


    \= Market Cap


    So, if the circulating supply is 20,000,000 coins and the current price of the
    coin per unit is $10, the market cap of the particular crypto is $200,000,000.


    The market cap also serves as an indicator to measure and monitor the market value
    of Bitcoin or Altcoins. It provides insight into the level of risk of the digital
    asset you have chosen and shows its growth potential. However, you need to remember
    that the market cap does not represent the money inflow or the amount of money
    in the crypto market. It is common for the cryptocurrency to jump its price and
    command a higher amount due to liquidity and volume.


    Coins with small market caps are vulnerable to big holders’ manipulation, causing
    wild price springs. High market cap coins are less vulnerable to wild volatility
    and manipulation.


    *   Trading volume


    The trading volume shows the amount of traded individual units at a given time.
    In the cryptocurrency market, it is the quintessential factor and essential technical
    indicator. By using it when trading crypto, traders easily measure how strong
    the underlying trend is.


    Coins with higher trading volume are easier to buy or sell, while low trading
    volume indicates a lack of liquidity. Cryptocurrencies that show very low trading
    volume is a sign of a declining or ailing trading volume.


    The presence of high trading volume and high volatility are leading signs that
    there will be a massive price movement (win or loss). This means that a lot of
    investors and traders are active in the market during that price level. It is
    the best time for traders to make an entry or exit move. Volatility without a
    high volume marker is an indication of a weak trend.


    *   Stop-loss orders and stop-limit orders


    A stop-loss order is the market order or limit that is activated when the asset
    reaches a certain price point or the stop price. Its main purpose is to limit
    the trader’s loss and avoid wiping out his wealth. It works by setting your stop
    price that will invalidate your order or loss during the trading.


    The stop-limit refers to buying or selling cryptocurrency at a certain amount
    or better. This limit-buy order is triggered when your order reaches the limit
    price or lower price. The limit-sell order is executed when the limit price is
    reached or higher.'
