    ## 什么是山寨币？


    `Altcoins`模仿了`Bitcoin`的优秀特性。它们都使用`blockchain`框架、`peer-to-peer`系统和`code`功能。为了区别于`Bitcoin`，一些`Altcoins`使用不同的机制来验证交易或创建区块。虽然缓慢但稳步，`Altcoins`正在金融界获得关注。2021
    年 3 月，`CoinMarketCap`报告说，替代币占据了整个市场 40%以上的份额，尽管它们倾向于遵循`Bitcoin`的轨迹，许多分析师和专家声称，随着时间的推移，`Altcoins`将拥有自己的信号。这是因为加密投资的生态系统已经成熟，更多`Altcoins`的市场正面临变化。


