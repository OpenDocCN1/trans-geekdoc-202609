    \ Begin with the basics like `RSI`, moving averages, `Fibonacci`, and so on. Keep\
    \ learning the indicators and soon, you will be a pro when it comes to entries\
    \ and exits.\n* **Learn margin trading**:\n  Margin trading is the practice of\
    \ trading using borrowed funds from brokers. The collateral of the loan is your\
    \ financial asset. While it is risky, this type of trading amplifies your purchasing\
    \ power. It confers tremendous potential of huge profits, but also losses. It\
    \ is just an option for bold and brave traders with higher risk tolerance.\n*\
    \ **Dig hidden potentials**:\n  While you can buy assets cheaply, their inherent\
    \ and potential value remains. In the bear market, you don’t have to rush into\
    \ trading your coins because of low prices and low volumes. So, while waiting\
    \ for positive price movements, research undervalued currencies that have the\
    \ potential to grow big. A coin that has dropped more than 70% may look less valuable\
    \ when it lost its all-time high but can rebound with a bang. Sometimes, the reason\
    \ why assets fall is due to its still developing platform or loss of interest\
    \ of the crowd.\n* **Scalp and earn**\n"
  trans: "\n\n牛市和熊市都为交易者获取更多利润提供了巨大的机会。关键在于使用强有策略在不同的市场条件下产生收益。此外，你还需要保持一致性、专注、纪律，并利用贪婪和恐惧的情绪。\n\
    \n## 牛市\n\n牛市是指金融市场价格持续飙升或具有近期上涨潜力的状况。每当需求在一段时间内超过了供需规律时，牛市就会出现。牛市期间的投资者和交易者是乐观且自信的，因为价格的增长速度快于通常的平均水平。\n\
    \n牛市通常发生在经济强劲增长期间，或者当人们因为投资回报率提高对股市产生更多兴趣时。牛市也可能产生“泡沫”，即底层资产的价格高于其实际价值。\n\n![image](img/scene_break.png)\n\
    \n### 牛市的**衡量指标**包括：\n\n* 价格在较长时间内上涨了至少 80%\n* 市场指数至少上涨 15%\n* 股票价格在两次下跌 20% 后上涨了\
    \ 20%\n\n### 牛市显示四个阶段。\n\n1. 第一阶段始于低价、对价格的悲观观点和低低绪。\n2. 第二阶段显示出交易活动增加和高于平均水平的经济指标。在此期间，公司盈利和股价开始增长。同样，投资者和交易者表现出更多的乐观情绪。\n\
    3. 第三阶段显示出更多的交易活动。证券和市场指数达到交易高点，而股息收益率达到低点。\n4. 第四阶段或最后阶段是存在过度的交易活动、IPO 活动和投机行为。随着市盈率和股价达到历史高位，投资者和交易者正大赚其收，导致牛市瓦解。在此阶段，投资者也忙于应对各种负面指标。\n\
    \n![image](img/image008.png)\n\n### 你知道吗？\n\n美国历史上最大的三个牛市发生在：\n\n* 1860-72 年，铁路行业起步\n\
    * 1920-28 年，第 19 条修正案通过批准以及汽车发明的时期\n* 1982-99 年，互联网启动期间。\n\n![image](img/scene_break.png)\n\
    \n## 熊市\n\n当市场指数在两个月内下降 20% 或更多时，就会出现熊市。熊市的平均长度为 367 天。当价格持续下降时，就会发生熊市。它通常发生在有重大因素改变经济的乐观周期时。\n\
    \n当乐观情绪和信任减少时，对底层资产的需求也会减少。它创造了一个转折点，使周期在再次回升之前触触底。\n\n### 熊市的四个阶段：\n\n1. 在第一阶段，投资者情绪高涨，市场价格高企。最终，他们开始获利退出并停止交易。\n\
    2. 股价、公司利润和交易活动开始急剧下降。经济指标低于平均水平，投资者的乐观情绪转为恐慌。这通常被称为“割肉阶段”。\n3. 第三阶段是投机者再次进入市场，导致交易量和市场价格增加。\n\
    4. 在最后一个或第四个阶段，股价开始逐渐下降。乐观情绪和低价开始吸引交易者和投资者。熊市的这最后一个周期将通向牛市。\n\n## 利用加密货币牛市的方法\n\
    \n在牛市中购买加密货币的最佳时机是婴儿期或第一阶段。通过这种方式，你可以在市场价格达到峰位时将其卖出。虽然没有准确的方法可以确定何时发生，但你的损失将是最小的。\n\
    \n以下是投资者和交易者在牛市期间使用的一些策略：\n\n* **买入持有法**：\n  其原理是购买资产并持有，直到市场价格达到顶峰时卖出。虽然没有准确的方法可以确定何时发生，但你的损失将是最小的。\n\
    \  这种方法在牛市中有效。这种方法在牛市中通过购买资产并持有，直到市场有利。\n* **增加持有法**：\n  这种方法在市场有利时持续买入资产。\n*\
    \ **波段法**：\n  这种激进策略意味着利用市场波动来获取利润。\n* **回调法**：\n  这指的是在市场有利时买入资产。这种方法在牛市中很常见，通过借卖来实现。\n\
    * **回调加法**：\n  这指的是价格反转期间。这种方法在牛市中很常见，通过低价购买。\n\n## 在加密货币熊市中获利的方法\n\n尽管熊市存在低迷和悲观，你仍然可以获利。只要市场有波动，你就可以获利。\n\
    \n尽管没有人能预测熊市何时结束或触底，你总有获利的机会。\n\n不要让恐惧和怀疑的情绪影响你的理性思维。利用熊市趋势研究和分析你的交易。当加密货币看起来在下跌时，很容易被恐惧击垮，但它们的波动性会导致反弹。比特币已经多次证明了这一点，其他数字资产也显示出了快速反弹的能力。\n\
    \n* **抄底**：\n  勇敢地抄底。通过提前设置价格，你可以在加密货币恢复实力时卖出。为了确保在熊市恢复的短暂时期获得利润，你应该设置止损、止盈和其他安全措施。\n\
    \  你也可以设置好自动交易，并提前设置止盈订单，这样当市场转向好转时，你可以获得最大收益。\n* **提高技术分析技能**：\n  现在是深入理解技术分析以及它如何帮助你进行融资或期货交易的时候了。从\
    \ `RSI`、移动平均线、斐波那契等基础知识开始。继续学习指标，你很快就会在进出口方面成为专业人士。\n* **学习融资交易**：\n  融资交易是利用经纪商资金进行交易的实践。贷款的抵押品是你的金融资产。虽然有风险，但这种交易放大了你的购买力。它带来了巨大的利润潜力，但也可能导致损失。这只是高风险承受能力的胆大心交易者的选择。\n\
    * **挖掘隐藏潜力**：\n  虽然你可以廉价购买资产，但它们的内在和潜在价值依然存在。只要市场有利，你就可以在牛市中获利。\n\n"
