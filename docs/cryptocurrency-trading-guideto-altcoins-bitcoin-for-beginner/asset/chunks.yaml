- raw: 'BOTH BULL MARKET AND bear market offer huge opportunities for traders to gain
    more profits. The key is to use strong strategies to generate earnings under different
    market conditions. Moreover, you need to be consistent, focused, disciplined,
    and take advantage of greed and fear emotions.


    Bull market


    A bull market pertains to financial market conditions where the prices are soaring
    continuously or have the potential to rise soon. Whenever the demand outweighs
    the laws of demand and supply over an extended period, bull markets manifest.
    Investors and traders during bull markets are optimistic and confident as the
    prices continue to increase faster than the usual average rate.


    Most often, bull markets occur during robust economic growth or when people become
    more interested in the stock markets because of higher returns on investment.
    Bull markets can also create ‘bubbles’ or when the price of the underlying asset
    is greater than its actual value.


    ––––––––


    ![image](d2d_images/scene_break.png)


    INDICATORS OF THE BULL market include:


    *   Prices rise at least 80% over an extended period


    *   Market indexes soar at least 15%


    *   Stock prices rise by 20% after the two occurrences of declines of 20%


    Bull markets show four phases.


    1.  The first phase begins with low prices, pessimistic views about the prices,
    and low sentiment.


    1.  The second phase displays an increasing amount of trading activities and above-average
    economic indicators. During this period, corporate earnings and stock prices are
    beginning to increase. Likewise, investors and traders show more optimism.


    1.  The third phase shows more trading activities. The securities and market indexes
    reach trading highs while the dividend yields reach their lows.


    1.  The fourth or final phase is when there are excessive trading activities,
    IPO activities, and speculations. Investors and traders are raking in profits
    as the earnings ratios and stock prices reach their historic highs, resulting
    in unraveling the bull market. During this phase, investors are also busy reacting
    to various negative indicators.


    ![image](d2d_images/image008.png)


    Did you know that?


    The 3 biggest bull markets in the U.S. happened in


    1860-72 during the start of the railroad industry,


    1920-28 when the 19^(th) Amendment was ratified


    and automobiles were invented, and 1982-99


    during the launching of the Internet.


    ––––––––


    ![image](d2d_images/scene_break.png)


    BEAR MARKET


    A bear market manifests when there is a 20% or more decrease in the market index
    for two months. Bear markets’ average length is 367 days. Bear markets happen
    when there is a prolonged decrease in prices. It typically occurs when there are
    significant factors that change the optimistic cycle of the economy.


    When optimism and trust decrease, there is also a decrease in demand for the underlying
    asset. It creates a tipping point where the cycle hits the bottom before going
    up again.


    The four phases of bear markets:


    1.  During the first phase, there is a high investor sentiment and high market
    prices. Eventually, they begin to take in their profits and stop trading.


    1.  Stock prices, corporate profits, and trading activities start to decline sharply.
    The economic indicators become below average and the optimistic sentiment of investors
    turns into panic. It is often referred to as the capitulation stage.


    1.  The third phase is when speculators are beginning to enter the market again,
    causing an increase in trading volume and market prices.


    1.  In this final or fourth phase, the stock prices are beginning to drop gradually. 
    Optimism and low prices start attracting traders and investors again. This last
    cycle of the bear market leads to a bull market.


    Ways to take advantage of crypto bull markets


    The best time to buy cryptocurrency in a bull market is during the infancy or
    first phase period. In this way, you can sell it when the market prices reach
    their peak position. While there is no accurate way to determine when it will
    happen, your loss will be minimal.


    Here are some strategies that investors and traders use during bull markets:


    *   Buy and hold approach


    It works by buying an asset, holding it for a certain period, and selling it when
    the market is favorable. The buy and hold approach is fueled by the bull market’s
    optimistic condition.


    *   Increase buy and hold approach


    It is a variation of the buy and hold strategy, but involves continuous buying
    of assets or security as long as the price is rising favorably.


    *   Full swing approach


    This aggressive approach is meant to capitalize on the favorable conditions of
    the bull market like using the short-selling method to maximize profits before
    another shift happens. Short selling means selling borrowed assets and then purchasing
    them at lower prices.


    *   Retracement addition approach


    It refers to the brief period of price reversal. This is typical in the bull market,
    even if the market trend is going upward. Many investors and traders use this
    period within the bull market to buy more assets. The presumption is that the
    price of the asset will move back fast, albeit retroactively, and give them a
    discounted buying price.


    Ways to profit in crypto bear markets


    Despite the sluggishness and pessimism in bear markets, you can still make a profit.
    As long as there is a movement in the cryptocurrency market, the promise of profits
    is always possible.


    Although nobody can predict when the bear markets will end or hit the bottom,
    you can always make a position to benefit from any favorable price movement.


    Do not let your emotions of fear and doubt get into your rational thinking. Use
    the bear market trend to study and analyze your preferred trades. It’s easy to
    be crippled by fear when the cryptocurrencies seem to be dipping, but their volatility
    can cause them to bounce so much stronger. Bitcoin has proven it so many times
    and other new digital assets are also showing their capability to rebound fast.


    *   Buy a dip


    Be brave and buy the dip. By setting entries beforehand, you are making a shot
    to lock in your position and sell your cryptocurrencies when their prices regain
    their strength in the market. To ensure that the opportunity to gain profit during
    the short period of recovery of the bear market, you should set a Full trade.
    It is typical for the returns to happen overnight, so by setting your entries,
    stop-losses, take-profits, and other safety nets, you have your gains while sleeping.


    You can also automate your trades and set take-profit orders in advance so when
    the market takes a turn positively, you gain the most.


    *   Brush up your skills on Technical Analysis


    Now is the time to have an in-depth understanding of technical analysis and how
    it can help you during margin or futures trading. Begin with the basics like RSI,
    moving averages, Fibonacci, and so on. Keep learning the indicators and soon,
    you will be a pro when it comes to entries and exits.


    *   Learn margin trading


    Margin trading is the practice of trading using borrowed funds from brokers. The
    collateral of the loan is your financial asset. While it is risky, this type of
    trading amplifies your purchasing power.  It confers tremendous potential of huge
    profits, but also losses. It is just an option for bold and brave traders with
    higher risk tolerance.


    *   Dig hidden potentials


    While you can buy assets cheaply, their inherent and potential value remains.
    In the bear market, you don’t have to rush into trading your coins because of
    low prices and low volumes. So, while waiting for positive price movements, research
    undervalued currencies that have the potential to grow big when the crypto market
    gets its rebound. A coin that has dropped more than 70% may look less valuable
    when it lost its all-time high but can rebound with a bang. Sometimes, the reason
    why assets fall is due to its still developing platform or loss of interest of
    the crowd.


    *   Scalp and earn'
