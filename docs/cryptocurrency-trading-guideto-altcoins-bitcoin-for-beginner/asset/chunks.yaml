    * 为更高级的交易者提供现货交易和保证金账户

    * 使用基于 30 天交易量的 `taker/maker` 费率表

    * 允许用户在保证金平台上以超过 100 倍杠杆进行交易，无需担保另一个账户

    * 提供可下载的报告，显示交易历史和实时账户余额

    * 在世界各地不同地点注册为资金汇款业务

    * 符合 `PCI DSS`（支付卡行业数据安全标准）

    * 将用户的资金存储在锁在安全金库中的数字钱包中


    ––––––––


    ![image](img/scene_break.png)


    ![image](img/image017.png)


    在 CEX.IO 上交易


    `CEX.IO` 有 4 级交易账户。您获得的账户取决于您提交的验证要求。基础账户每月可以购买价值 2,000 美元的比特币和山寨币。


    验证过的账户需要身份证、驾驶执照、护照、居住证明以及一张拿着有效身份证件的自拍照。您有机会每月购买价值高达 100,000 美元的币。


    最后两个账户是 `Corporate`（企业）和 `Individual Business`（个人业务），允许持有者购买无限数量的代币。


    #### 使用移动应用：


    * 要购买山寨币，进入 `Trade`（交易）页面。

    * 使用 `Limit Order`（限价单）或 `Market Order`（市价单）下单。

    * 转到屏幕顶部更改货币。

    * 如果您使用 `Market Order`，您购买的币将添加到您的账户中。如果您要卖出山寨币，输入金额，点击 `Sell`（卖出）按钮并确认您的操作。

    * 要跟踪您的 `CEX.IO` 情况，打开 `Trade` 页面。


    ![image](img/image020.png)Crypto.com：DeFi 最佳交易所


