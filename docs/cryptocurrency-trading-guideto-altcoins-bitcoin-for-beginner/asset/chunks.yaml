    要识别死币，可以观察这些项目在社交媒体平台上的活跃程度。像 `Deadcoins` 和 `Coinospy` 等网站会追踪流动的僵尸加密项目。


    一些已知的死币包括：


    *   `Aeron (ARNX)` 曾是 `Binance` 交易所上的可交易币种，但在一段时间后被下架，导致价格下跌高达 90%。


    *   `BitConnect (BCC)` 在其最初几年获得过成功，但在 2017 年底英国金融监管机构质疑其合法性后，开始失去信誉。2018 年，`BitConnect`
    被德克萨斯监管机构标记为庞氏骗局，导致其最终关闭，且 `BBC` 的价格崩盘了 9%。


    *   `Storeum (STO)` 因为缺乏存储价值、流动性为以及市场萎缩而死亡。`STO` 的价格为 `$0.000012`，但其订单簿中仅记录了 `18`
    条记录。


    *   `VegasCoin (VEGCOIN)` 是一个遗弃项目的典型案例。


    *   ![image](img/image040.png)`OxBitcoin (OxBTC)` 最初在市场中表现良好。价格曾飙升至 `$5` 但随着价值跌至
    `$0.10` 遭受了损失。在该发生时，项目的核心团队离开了。


    # 什么是死币？


    被称为“死币”的加密货币是指由于多种原因导致失去关注并最终死亡的货币。死亡的常见原因包括项目关键人员的离开、资金不足或流动性低、被证明是骗局、在热门加密交易所的上市数量有限或为零、交易量低、恶作项目等。


    在加密世界中，死币列表中约 `3.6%` 的未能吸引资金来支持其开发或未能提供丰丰的利润空间。


    大约 `3%` 是恶作项目，而每 10 个流动性较差且交易量忽略不计的加密货币通常会被开发者遗弃。如果一种硬币在 `3` 个月内的交易量低于 `$1,000`，则被视为遗弃或死亡。


    `2017 年 ICO` 热潮曾震撼加密世界，当时币种数量从 `29` 个增长到超过 `850` 个项目。遗憾的是，约 `80%` 的首次代币发行都是骗局，并留下了一串死币。


    尽管如此，新开发者们已准备好创建新的山寨币。`2018 年`，有超过 `1,200` 个项目上线。两年后，市场上的货币和代币总数约为 `8,000` 个。


    随着 `2020 年` 各类币的激增，另一种被称为“抽地毯”的骗局导致了另一批死币。


    ––––––––


    ![image](img/scene_break.png)


