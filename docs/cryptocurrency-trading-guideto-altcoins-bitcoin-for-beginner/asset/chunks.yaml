    ––––––––


    ## MONERO (XMR)


    门罗（Monero）是一种隐私、安全且不可追踪的加密货币，于 2014 年 4 月推出市场。门罗的开源区块链是不透明的，隐藏了用户的地址和金额。截至 2021
