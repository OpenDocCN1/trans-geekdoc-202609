  fmt: "\nIt is a distributed ledger (blockchain) with a closed network and is controlled\
    \ by one entity. New participants require a verification process and have the\
    \ capability to limit the number of people who can participate in the validation\
    \ process.\n\n## Private Currency\nIt is a token or currency that is issued by\
    \ a private company or person. Usually, a private token or currency is used within\
    \ the private network only.\n\n## Proof of Authority\nIt is a consensus mechanism\
    \ that grants a private key to a private blockchain. It allows the blocks to validate\
    \ the cryptocurrency transactions.\n\n## Pump and Dump\nPump and dump refer to\
    \ the investment scheme that a participant or participants group does to artificially\
    \ raise the asset’s value so they can sell their coins at a higher price.\n\n\
    ––––––––\n\n![image](d2d_images/scene_break.png)\n\n## R\n\n### RECOVERY SEED\n\
    A cryptographic security code that is composed of 12 to 14 random characters.\n\
    \n### REKT\nIt is the slang for ‘wrecked’, which means that the investor has lost\
    \ substantial money.\n\n### Rug Pull\nA type of scam where crypto developers take\
    \ the investors’ money and abandon the project.\n\n## S\n\n### Seed Phrase\nIt\
    \ refers to the single starting point in getting the keys of a deterministic crypto\
    \ wallet.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\n### SERIALIZATION\n\
    It is the process that converts the structure of data into byte sequences. Ethereum,\
    \ for instance, uses `RLP` (recursive-length prefix encoding) encoding format.\n\
    \n### Sharding\nIt refers to the splitting of the network into ‘shards’ or portions.\
    \ Every shard comes with a unique set of smart contracts and account balances.\n\
    \n### Shitcoin\nA coin with no usage or potential value.\n\n### Slippage\nThe\
    \ situation where traders have to pay a different amount for their purchased crypto\
    \ because of the sudden price movement.\n\n### Smart Contracts\nSmart contracts\
    \ are self-executing coded agreements between crypto buyers and sellers. Once\
    \ the predetermined conditions on the contract are met, the contracts automatically\
    \ complete the process without intermediaries.\nIn a gist, smart contracts are\
    \ relatively straightforward and trustless.\n\n### Smart Token\nIt is a token\
    \ with value and has the key information necessary to simultaneously execute transactions.\n\
    \n### Soft Cap\nIt refers to the minimum amount that ICO aims to raise.\n\n##\
    \ T\n\n### Transaction Block\nIt refers to the set of network transactions that\
    \ can be hashed or added to the blockchain.\n\n### Ticker Symbol\nIt is a unique\
    \ letter combination assigned to crypto or stock, making them identifiable on\
    \ trading apps and exchanges.\n\n### Token Generation Event\nIt refers to the\
    \ time when a token is publicly issued.\n\n### TVL\nIt is the total value locked\
    \ (`TVL`) that represents the number of assets being staked in a certain protocol.\n\
    \n### Trade Volume\nIt is the amount of crypto that is being traded in the past\
    \ 24 hours.\n\n### Trading Bot\nIt is a program that automates the crypto trading\
    \ of assets on a trader’s behalf.\n\n## U, V, W, X, Y, Z\n\n### Unspent Transaction\
    \ Output (UTXO)\nIt refers to unspent transactions that are left after all the\
    \ transactions are completed.\n\n### Vanity Address\nA crypto public address where\
    \ letters and numbers are chosen by the owner.\n\n### Vaporware\nA crypto project\
    \ that never happens.\n\n### Volatility\nIt is the statistical measurement of\
    \ returns dispersion that uses the standard variance between returns and the market/security\
    \ index.\n\n### Wash Trade\nIt is a type of market manipulation where investors\
    \ make artificial activity by buying and selling similar crypto simultaneously.\n\
    \n### Whitelist\nIt is the list of registered participants who are interested\
    \ in ICO.\n\n### Whitepaper\nA document that provided technical information and\
    \ a growth roadmap of the crypto project.\n\n### Zero Confirmation Transaction\n\
    It means unconfirmed transactions on the exchange.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
