    ## TETHER (USDT)


    Tether 是加密货币交易领域具有主导地位的币。它被归类为稳定币，且是最受欢迎的稳定币之一。它实际上是美元的代币化版本，使其本质上非常“稳定”。许多人使用
    Tether 来对冲资产波动风险并获取流动性。Tether 币由总部位于香港的 Tether Limited 发行。


    Tether 是交易最频繁的山寨币类型，因为它更廉价、更易用，且交易手续费更低。2021 年约 75%的比特币交易使用了 Tether。


