    to access the funds. It works by raising the waiting time by a power of 2 for
    every incorrect input of the PIN code. Each wallet has a 24-word seed and passphrase
    that are `RNG` (Random Number Generator) selected offline and are displayed on
    the screen. You will be given new numbers in every transaction you do.


