  trans: '


    头皮交易（Scalping）是一种试图通过市场微小价格波动来获利的策略。头皮交易者可以在短时间内多次建仓，以最大限度地利用市场低效和价格波动的机会。这种交易策略要求进行非常快速的技术分析。


    ## 自我教育


    在熊市中，无需急于不断刷新你的资产组合，或进行狂热交易以追求利润最大化。现在是时候提升技能和知识了，例如研究下一批现象级币种、理解杠杆，或学习如何识别市场反转的关键迹象。你在熊市期间学习的所有知识，都将在牛市开始显现时增加你的机会。


    ![image](img/image087.png)


    ## 冷知识


    牛市和熊市的现象源于 18 世纪的熊皮交易市场。在那个时代，牛熊斗被视为一种运动。


    ## 市场周期心理学


    所有的金融市场都有周期性，或者说具有扩张和收缩周期。市场周期是在不同阶段的趋势或模式。它们通常在某一资产类别的表现优于其他类别时出现。在同一个市场周期内，由于市场状况的不同，某些资产类别的表现较差。


    市场周期的产生是因为市场情绪，即投资者和交易者对资产的集体态度。这适用于所有金融市场，包括加密货币市场。参与者的整体情绪、想法和感受会推动加密货币价格波动，产生心理市场周期。


    市场价格波动反映交易者情绪的观点被称为市场心理学。这是行为经济学中的一个重要课题，因为它对经济决策产生影响。积极的市场情绪会产生牛市趋势（牛市），加密货币价格持续上涨。相反的趋势则导致熊市，价格持续下跌。


    ### 上趋势


    当存在积极的市场情绪时，对资产的需求增加，供应减少。当这种情况发生时，市场氛围中普遍充满了强烈的态度、信念、乐观和贪婪。这些情绪促成了非常活跃的买入活动。


    而且并不仅止于此。在上升趋势的市场周期中，看到回溯效应是很常见的。这意味着随着加密货币价格的飙升，市场情绪变得更加积极，并推动价格推向更高。


    在此期间，盛行的贪婪感产生了金融泡沫。这促使许多交易者和投资者积累更多资产，认为这种趋势将会持续。他们往往会变得不理性，忽视资产的实际价值。在分配阶段会卖出更多资产，形成横盘市场波动。


    ### 下降趋势


    相反，下降趋势带来了负面的市场情绪，减少了资产的需求并增加了供应。


    当市场转向负面时，投资者和交易者在失去兴奋感后变得自。当加密货币价格继续下跌时，参与者的情绪变成了焦虑、否认和恐慌。


    随着价格下跌，加密货币投资者和交易者开始质疑为什么会发生这种情况。这引发了焦虑以及对下降趋势事实的不接受或否认。他们中的许多继续持有仓位，因为他们相信积极的市场趋势很快就会恢复。另人则觉得卖出资产为时已晚。


    当加密货币暴跌时，恐慌来临。此时，主导情绪是恐惧。几乎每个人都想卖掉自己的数字资产。这是市场崩溃时期，即加密货币持有者亏价卖出币的时期。


    当加密货币波动性降低时，下降趋势停止。这导致了市场最终的稳定。会出现横盘运动，有助于重新产生乐观和希望。这一时期被称为积累阶段。


    ## 什么是市场情绪分析？


    虽然市场情绪不反映加密货币的基本面，但它会影响其价格。这就是为什么交易者不断查看大多数参与者的当前情绪。市场情绪分析可用于预测价格走势。它涉及跟踪市场动态和参与者的整体态度，以充分理解他们对特定资产的恐惧或炒作情绪。除了提供有关市场需求的关键见解外，分析市场情绪还可以预测可能为你带来利润的趋势。


    就像基本面分析或技术分析一样，分析市场有助于交易者做出明智决策。将这三种方法的各种数据结合是一个极佳的主意。


    * 它帮助你对短期和中期价格走势有清晰的概念。

    * 它帮助你发现盈利的交易机会。

    * 它帮助你掌控自己的情绪状态。


    要执行`market sentiment analysis`，你需要参与者的意见、想法和观点。你可以从检查相关的加密货币频道和社交媒体平台开始。Twitter
    是加密粉丝最流行的社交渠道之一。


    加入官方加密货币论坛、Telegram 群组和 Discord 服务器也将帮助你分析市场情绪。但要注意潜伏在这些页面或社区中的诈骗者。他们随时准备捕猎易之物，所以请确保你正在进行自己的分析，不要被某些自诩为“专家”的交易者的“甜言蜜语”所左右。


    你也可以考虑以下方法：


    * 通过关注发布最新新闻和趋势的加密博客和媒体门户来保持信息更新。查看 `Binance News`、`CoinDesk`、`Binance Blogs`
    和 `Bitcoin Magazine`。

    * 利用数据收集软件工具跟踪社交提及。

    * 在 `CoinMarketCap` 上检查市场情绪的价格信号和指标。它们汇自各种可靠来源，其摘要即为当前市场情绪。

    * 设置警报或跟踪“巨鲸”或持有大量特定加密货币的个人/组织的大额交易。他们拥有足够的加密货币或代币，可以通过买卖大量币对价格产生波动。

    * 借助 `Google Trends` 衡量围绕加密货币的炒作程度。


