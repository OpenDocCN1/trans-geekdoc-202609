    ![image](img/scene_break.png)


    # NEO


    NEO 由欧亦明和大洪飞于 2014 年创立，最初名为 AntShares，后来更名为 NEO。其链上技术提供了一种中心化的方法，能够实现生成智能合约的“dapps”或去中心化应用程序。


    这与他们创建一个快速、安全且无缝交易的数字智能经济的目标相一致。


    尽管中国政府仍然对该国的加密交易实施限制，但 NEO 似乎在虚拟生态系统中发展良好。它有一个与其他基于区块链的加密货币区分开来的第三特征——数字身份。


    ![image](img/image072.png)NEO 的基础资产是 NEO 代币，它用于创建 GAS 代币。NEO 的市值超过 20 亿美元。其流通量超过
    7,000 万枚。


    ––––––––


    ![image](img/scene_break.png)


    Lite Forex 根据其算法平均值预测，NEO 在 2030 年将突破 7,000 美元。


    ––––––––


    # 观望列表：正在席卷市场的 DEFI 代币和代币


    去中心化金融（DeFi）是一种创新的方法，通过应用程序的帮助来执行各种金融交易。它在区块链上上运行，消除了传统的中间环节（银行、交易所、经纪商）。DeFi
    使用智能合约或代码段落，在满足所需条件后处理交易。智能合约在预期发生后会自动执行。


    从本质上说，DeFi 是定义任何使用加密货币或区块链技术创建替代性金融产品的交易或应用程序的概念。它提供了一种更廉价、更快速且无最小交易金额限制的数字点对点交易。2020
    年，DeFi 代币的表现优于 BTC。截至 2021 年 4 月 22 日，其锁总价值（TLV）已达到 590.7 亿美元。


    以下是显示出人增长的顶级 DeFi 代币列表：


    ## Uniswap (UNI)


    Uniswap 的治理代币和原生货币是 UNI。这些加密货币首次分发给去中心化金融协议的用户。每位在 2020 年 9 月 1 日之前使用过该协议的用户都获得了
    400 个 UNI 代币（当时价值 1,400 美元）。


    Uniswap 是前西门子机械工程师 Hayden Adams 于 2018 年 11 月 2 日的构思结晶。它在投资者和交易者中非常受欢迎，因为该协议主要在以太坊上利用智能合约提供自动交易。


    在日交易量方面，Uniswap 在 2020 年 10 月是全球第四大加密货币交易所。在 2021 年 3 月，它每天产生 200 万至 300 万美元的费用。UNI
    的市值超过 100 亿美元。


    ## Chainlink (LINK)


    Chainlink 的代币基于以太坊 (ERC-677)。截至 2021 年 1 月，1 LINK 的价值为 21.53 美元，市值为 86 亿美元。Chainlink
    是行业标准的去中心化预言机网络。它赋能智能合约以安全的方式访问链外计算和真实世界数据。在区块链技术的支持下，Chainlink 提供了极高的安全可靠性。


    它由 Sergey Nazarov 于 2017 年建立，并在 ICO（首次代币发行）期间筹集了 3200 万美元。


    ## Maker


    Maker 的 TLV（锁总价值）为 100 亿美元，市值为 45 亿美元。它在 2021 年 4 月 22 日达到历史高点，市场价格为 4,943.66
    美元。它在 2017 年 1 月 30 日达到历史低点，为 21.06 美元。


    Maker 是 MakerDao 的治理代币，拥有作为启动 DeFi 繁荣市场以及自动化加密借贷平台的首个区块链协议记录。该代币允许用户使用借贷系统进行投票，该系统创建了社区管理的加密货币
    DAI 稳定币。


    ## Compound (COMP)


    在使用以太坊网络 3 年后，Compound 最终于 2020 年 6 月推出了其原生代币 COMP。其总锁仓量（TLV）为 955，，市值为 28 亿美元。它在
    2021 年 4 月 16 日达到 612 美元的历史高点。


    它在加密市场上的受欢迎源于其去中心化的区块链借贷技术。用户在任何 Compound 池中存入其加密货币时，可以获得利息或 cTokens。cTokens 代表你的
    C 池份额，因此当你存入以太坊（Ether）时，你将获得 ETH。此外，仅需持有 COMP 总供应量的 1%，你就可以对协议更改的提案进行投票，或提交你自己的提案。


    ## Ankr (ANKR)


    截至 2021 年 4 月 22 日，其市值为 10.5 亿美元，总量上限为 100 亿。截至目前，有 70 亿枚 ANKR 在流通。


    这种代币赋能了 Web3 基础设施。ANKR 用于 API 服务和节点部署。它是一个构建 dApps 的跨链质押平台。


    ## Aave (AAVE)


    Aave 协议允许用户担任存款者或借款者。它具有无需抵押贷款的有趣功能。该协议还在以太坊区块链上存储非托管智能合约。AAVE 代币带有改进协议的投票权。


    ## Mantra Dao (OM)


    Mantra Dao 的原生代币是 OM，它为用户提供完全投票权。这个基于社区的 DeFi 平台专注于治理、贷款和质押。代币持有者治理生态系统，并因积极贡献获得奖励。这是通过系统的声誉机制实现的。


    ## Coti Network (COTI)


    COTI 的声誉自 2021 年 5 月 24 日引发看涨包线线以来一直持续上升。该 DeFi 平台帮助各种机构建立自己的支付系统并将自己的加密货币数字化。


    其加密货币分类为 DAG 即有向无环图。它的区块链不需要矿工和区块。它使用 Trustchain 共识算法，允许为了支付目的进行点击请求，在确认交易时使用评分，并利用智能合约。


    ## Serum (SRM)


    Serum 的原生代币是 SRM，其最大供应量为 100 亿。总供应量的百分之十已在第一年解锁，其余的百分之十将在七年内解锁。约 5000 万枚代币在加密领域流通。


    该去中心化生态系统和交易所为处理交易提供了非常快速且低廉的费用。在 SOL 或 Solana 网络运行，它每秒可以处理 50,000 次交易。


    ## Beam (BEAM)


    截至 2020 年 12 月，BEAM 代币的总价值为 2190 万美元。目前，其交易价格在 0525 美元至 096 美元之间。Beam 是一个私有的 DeFi
    平台，确保交易的安全、快速和匿名。


    '
