    如果你将在 `Coinbase.com` 或 `Cash App` 之外的其他交易所进行交易，你需要记住市价单与限价单的区别，以及止损概念如何为你提供优势。加密货币市场的流动性并不强劲，这就是为什么在下达巨额市价单时需要格外小心。


    ### 了解区块链


    至少基础知识，这可以帮助你根据加密货币公告和新闻推测市场价格走势。


    ### 减少滑点最小化


    滑点是指你收到的执行价格与预期价格不符的情况。这导致你支付的金额高于或低于你预知的价格。它发生在订单请求提交到执行，或订单被确认的时间之间。


    这种情况在变化快速且波动剧烈的市场中极易发生，因为由于意料之外的趋势和快速反转，市场上的订单可能无法匹配交易者的意愿价格。为了避免滑点交易，交易者应该使用
    `limit order` 而不是 `market order`。`limit order` 将以你设置的价格或优于执行你的订单。


    ### 确保你的加密货币账户安全


    在加密货币世界中，失去数字存储（`wallet`）的访问权限或你的交易所账户被黑，意味着与你的硬币永远告别。恢复账户是一个困难的过程，有时在被黑后甚至是不可能的。我建议你设置一个非常强的密码、开启双重身份验证并使用硬件钱包。始终保留备份，并写下你的
    `pin/password/seed phrase`。对它们都进行加密也是最好的。


    ### 如果你是加密货币交易新手，最好避免融资交易


    融资交易是交易者根据其现有资金贷款或利用其加密货币作为杠杆来增强交易能力的实践。像你这样的新手应该先专注于购买流动性良好的主流币种。在掌握加密货币交易技巧之前，不要受到诱惑参与市场交易。


    ### 降低风险


    加密货币市场的波动本质是其吸引投资者和交易者的因素之一。这一元素可以使交易者在瞬间获得巨富或损失惨。考虑通过应用技术分析指标来分析市场趋势和图表，从而降低风险。学习并掌握趋势交易以及支撑阻力技术。


    专业交易者的秘密之一是交易 `Bitcoin` 和 `Ethereum`（按市值计算）或 `Grayscale Bitcoin Trust` (`GBTC`）。当你使用这些任何一种数字工具时，损失的风险因素微乎其微或几乎不可能。本质上，成交量和市值较小的加密货币提供了更高的回报，但也带来了可能耗光你资金的风险。


    ### 记住衍生品具有独特的规则集


    衍生品是价值源于底层资产的金融合约。在加密货币中，它作为一种代理工具，热衷于投机币未来的成功。持有太久会让你支付大量费用，因此要学习如何通过在市场寻找最好的衍生品来实现收益最大化。


    ### 不要忘记加密货币交易是纳税的


    在美国，加密货币被视为资本资产或财产。当用于购买服务/商品以及投资/交易目的时，需要缴纳资本利得税（长期和短期）。了解加密货币交易中的税收影响，这样你就能如何充分利用你的交易活动。


    加密货币交易既兴奋充满充满。刚开始，所有的技术术语和行话可能会让你有些困惑，但最终你将学会门道。


    虽然交易原理与市场上的股票交易相似，但执行方式是不同的。


    为了享受加密货币交易并使利益最大化，你需要对资产和市场、最佳加密交易所、最安全的加密钱包以及你选择的加密货币进行深入研究。


    ![image](img/image038.png)


    #### 趣味知识


    Cryptokitties 是第一个在 `Ethereum` 技术帮助构建的游戏。


    该网络在发布后的一周内购买量就增加了 10%。


    ––––––––


    ![image](img/scene_break.png)


    #### 常见问题


    #### 加密货币交易盈利吗？

    是的，如果你操作得当。像任何类型的交易一样，加密货币交易需要计划、策略和风险管理措施。如果你遵循你的计划和策略，你将处于最有利的位置。


    #### 加密货币交易风险有多大？

    由于高波动性，风险更大。在开始你的交易之旅之前，先评估你的风险承受能力。你还需要游戏计划和风险管理策略。


    #### 有适合新手的加密货币对吗？

    没有。每种加密货币都不同，为新手和老练交易者提供了一系列优势和风险。为了更好地理解它们，请研究每种类型并与你的交易目标和策略匹配。


    #### 新手最好的加密货币交易策略是什么？

    所有策略都是好的。但你应该根据自己的目标进行选择。如果你喜欢长期收益，就选择仓位交易或 `HODL`（长期持有你的币）。对于短期结果，尝试日内交易或头皮交易。


    #### 加密货币交易中的杠杆是什么？

    杠杆是一种通过仅支付保证金或最低押金来获得底层数字资产更广泛敞口的方法。本质上，你只支付了交易总价值的一部分。


