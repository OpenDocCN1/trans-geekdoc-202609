    # 第一章


    ## 关于加密货币到底在炒什么


    ![image](img/chapter_title_below.png)


    `Bitcoin`开启了一切。这种革命性的、引领趋势的加密货币在十年前推出，并继续主导局面。当投资者和交易者的兴趣增长时，山寨币或替代货币被推出以满足需求。


    这类加密货币是以`Bitcoin`为模板的，但在功能和运行规则上有所不同。


    在我们深入之前，让我们看看加密货币的原理以及它为何如此流行。这种货币仅以电子形式存在，除非将其兑现，否则你并不拥有实体。加密货币使用电子钱包进行存储，消除了银行等中间机构。


    所有的交易都是通过你的电脑、手机或任何电子设备向另一个用户进行的。


    ![image](img/image071.png)


