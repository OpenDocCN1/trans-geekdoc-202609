    \ $0.23 |\n\n| Monero || 3,539,110,083 || 17,957,194 || $197.48 |\n\nHOW DO THEY\
    \ DIFFER from Bitcoin?\n\nEvery type of Altcoin has its own set of rules. In terms\
    \ of mining new coins, Altcoins like Litecoin can produce new coins in a matter\
    \ of 2.5 minutes. Bitcoin only mines bitcoins every 10 minutes using costly hardware.\
    \ Litecoin and other alternative cryptocurrencies use new coins using common computer\
    \ hardware.\n\nAltcoins also work to improve the perceived limitations of Bitcoin,\
    \ which makes them more interesting in the eyes of traders and investors. They\
    \ introduced smart contracts where Bitcoin has limited capacity. Instead of using\
    \ Proof-of-Work (PoW), Bitcoin’s consensus mechanism to validate transactions\
    \ and make blocks in the blockchain, they use the Proof-of-Stake (PoS).\n\nWhat\
    \ are the Pros and Cons when you invest in altcoins?\n\nPros\n\n*   The variety\
    \ of available Altcoins offers the fulfillment of Bitcoin’s promise that cryptocurrency\
    \ can be a medium of everyday transactions.\n\n*   They claim to be Bitcoin’s\
    \ ‘better versions’ because they fill the gap in the crypto market.\n\n*   Traders\
    \ and investors have a wide range of Altcoins that offer different functionalities.\n\
    \n*   Low transaction fees\n\nCons\n\n*   Compared to Bitcoin, they have a smaller\
    \ market in terms of investment\n\n*   Difficulty in distinguishing different\
    \ kinds of Altcoins and their functions, making investors confused and disinterested\n\
    \n*   The lack of defined investment criteria and regulations makes them more\
    \ volatile than Bitcoin\n\n*   History of ‘dead’ Altcoins that left investors\
    \ with huge losses\n\n*   Value volatility\n\n*   Higher potential for fraud and\
    \ scams\n\n![image](d2d_images/image015.png)\n\nTrivia\n\nThere are 4 buckets\
    \ of altcoins – native cryptocurrencies, tokens, stablecoins,\n\nand forks.\n\n\
    ––––––––\n\n![image](d2d_images/scene_break.png)\n\nWHAT ARE THE DIFFERENT kinds\
    \ of altcoins?\n\nAltcoins are classified according to their consensus mechanism\
    \ and functionality. They include the following:\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n*   Stablecoins\n\nStablecoins are Altcoins that derive their market values\
    \ from a basket of underlying assets (precious metals, fiat currencies, other\
    \ cryptocurrencies). The basket represents the security that traders can redeem\
    \ during the worst bad market day.\n\nMost Stablecoins use government-backed or\
    \ fiat security. Tether (USDT) and USDC are examples of fiat-backed crypto coins.\
    \ DAI is a crypto-backed Stablecoin. Commodity-backed (oil or precious metals)\
    \ are the Paxos Gold and Tether Gold."
