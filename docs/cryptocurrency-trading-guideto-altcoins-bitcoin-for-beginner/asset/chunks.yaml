- raw: "Compared to credit or debit card purchases, using Bitcoin to pay your purchases\
    \ is easier. You just need to enter the receiver’s address, input the amount,\
    \ and press SEND. You can also scan a QR code to complete the transaction.\n\n\
    ––––––––\n\n![image](d2d_images/scene_break.png)\n\nWHAT ARE THE ADVANTAGES I\
    \ get from Bitcoin?\n\nBitcoin offers payment freedom – no bureaucracy, no geographical\
    \ borders, or bank holidays. It has different levels of transfer fees and there\
    \ are no fees when receiving bitcoins. Transactions are secure, anonymous, and\
    \ irreversible. All transactions are neutral and transparent in the blockchain\
    \ (without revealing your identity).\n\nWhat are the disadvantages of using Bitcoin?\n\
    \nThe number of merchants who accept crypto payment is still relatively small\
    \ and many people are still unaware of cryptocurrency.  Bitcoin’s volatility is\
    \ also another factor.\n\nIs Bitcoin a fraud scheme?\n\nNo. A Ponzi scheme preys\
    \ on its investors and when there are no new participants, the network collapses\
    \ and affects the most recent investors. Bitcoin is a decentralized software project\
    \ where all transactions utilize blockchain technology and prevent fraudulent\
    \ representations about the investment.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \nIS BITCOIN A CULT?\n\nNo. Bitcoin is a virtual asset that is accepted as a payment\
    \ option as well as a trading and investment instrument. Whereas, a cult is a\
    \ group of devout followers who are invested in an idea or mission. The misconception\
    \ is borne out of the craze that bitcoin has caused, attracting a lot of believers.\n\
    \nIs Bitcoin a bubble?\n\nSome people think that Bitcoin is a bubble because of\
    \ the phenomenal 10 million % increase of its value since its conception. A bubble\
    \ is expected to burst after some time. However, Bitcoin proves that while its\
    \ price goes up and down due to the demand and supply factors, it is still attracting\
    \ more users across the globe.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
