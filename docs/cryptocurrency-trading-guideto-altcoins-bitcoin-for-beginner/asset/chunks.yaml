    代币通常通过 ICO（首次代币发行）发行，这也被称为“代币启动”或“代币销售”。


    这种众筹技术可以用于募集资金以创建产品，或者建立一个早期鸟用户群体来获取所提供的产品。许多公司使用 ICO 是因为规避了银行或风险投资机构受监管的资本募集过程。即使某次特定的
    ICO 结束，感兴趣的人也可以使用底层货币购买公发行的代币。


    ---


    ![image](img/scene_break.png)


    # 加密货币安全且可以放心使用吗？


    从技术上讲，加密的目的是为所有数字交易提供终极的安全保障。这种高级编码在用户的电子钱包和区块链之间传输并存储数据。由于这些公共账本很难被篡改或被黑客攻击，使得它们更加安全。


    此外，所有交易都需要用户使用类似双重身份验证的过程，例如输入用户名和密码。你还需要输入在你的手机短信系统中收到的验证码。


    但请记住，安全性高并不意味着它们不可被黑客攻击。历史表明，`Bitcoin` 和其他加密货币受到在线盗窃和黑客攻击的影响。


    2018 年，加密世界发生了震荡，`Coincheck` 和 `BitGrail` 分别被攻击金额高达 5.34 亿美元和 1.95 亿美元。虽然区块链非常安全，但加密生态的其他方面（如钱包和交易平台）并不能免骗子和黑客的影响。


    ## 在哪里存储你的加密货币？


    你需要一个“数字钱包”来购买加密货币。这种钱包是一种存储你硬币的在线应用程序。它像一个数字银行账户，你可以使用你的 `private key` 打开它。


    你需要的数字钱包取决于你喜欢拥有的加密货币种类。如果你想要 `Litecoin`，请找一个存储这种硬币的钱包。如果你喜欢 `Bitcoin`，请选择一个安全存储
    `bitcoins` 的钱包。找到安全的加密货币钱包以防止可能的盗窃至关重要。一旦你的硬币被盗，就无法找回了。


    ## 加密钱包的两种通用类型：


    ### 热钱包（软件）

    热钱包很容易设置，但在三个选项中安全性最低。它运行在手机、平板电脑、电脑或任何连接互联网的设备上，这使得此类钱包容易受到黑客的攻击。它生成你的私钥以便你可以访问你的硬币。因此，虽然在交易期间使用非常方便，但在设备上存储
    `private key` 会使其容易受到黑客攻击。


    为了避免可能的安全和隐私威胁，使用更严密的安全措施（如双重身份验证、强密码或安全的上网浏览）至关重要。此外，仅将此钱包用于小额支出或交易。


    ### 冷钱包（硬件）

    冷钱包或硬件钱包是一个便携设备，你可以通过 `USB` 将连接到笔记本电脑或电脑。它是更安全的选择，因为它在离线模式下存储你的加密货币。这种钱包就像金库，在你没有进行交易或交易活动时可以保持你的资金安全。某些冷钱包需要连接互联网，而另一些则不需要。


    在这两个类别下有 4 种加密钱包：


    *   **网页或在线钱包**：这种钱包允许你通过网页浏览器访问 `Bitcoin` 资金。虽然它是完成交易最快的选项，但它容易受到未经授权的尝试和网络威胁。最好不要在此类钱包中存储所有的
    `bitcoins`。

    *   **桌面钱包**：桌面钱包是冷钱包或冷存储的一个示例。它允许你私密且安全地存储 `bitcoins`，但请确保使用极的安全性，特别是当你需要使用互联网连接进行交易时。

    *   **移动钱包**：移动钱包是安装在手机或其他移动设备上的可下载应用程序。它是基于互联网的，这具有风险。这个东西很棒的地方在于你可以轻松扫描移动钱包的
    `QR code` 来完成购买。

    *   **纸钱包**：这是另一种离线存储方式，需要生成私钥公钥，然后将它们打印在纸上。在那张纸上生成的代码或信息让你能够访问你的数字地址，因此请务必妥保存。纸钱包最适合长期和高安全的投资，而不适合交易者或频繁用户。


    ![image](img/image019.png)


    ### 你知道吗？

    今天使用的某些加密技术最初是为军事应用设计的。


    ---


    ![image](img/scene_break.png)


    # 获取加密货币的方法


    加密货币可以在交易平台和经纪商处获得，他们促进了投资者/交易者与市场之间的买卖。可以使用法货币和加密货币进行购买（取决于卖家偏好哪种）。


    要开始购买加密货币，你需要下载一个数字钱包。许多交易平台内置了钱包，但取决于你自己为你的硬币和代币准备一个独立的加密钱包。


    ## 交易所与经纪商


    加密交易所是买卖双方直接交易硬币和代币的在线平台。使用交易所是交易加密货币的传统方式。它允许人们用加密货币和法货币进行交易。对于喜欢投机价格的初学者和高级用户都是理想的。


    你可以购买替代币的最受欢迎且受信任的交易所有 `Binance`、`Coinbase`、`CEX.io`、`Bitfinex`、`Gemini`、`FTX`、`Changelly`、`KuCoin`、`Huobi
    Global`、`Bittrex`、`Coinmama`、`Bitstamp` 和 `Kraken`。


    *   **Binance** 提供了种类广泛的替代币并支持多种交易对。它是想要多样化替代币组合并进行交易的交易者的理想选择。它接受法货币作为支付。

    *   **Coinbase** 是一个非常安全的交易所，也可以作为交易平台。如果你计划买卖 `Bitcoin`、`DASH` 和 `Ethereum`，它是最好的地方。它接受
    `EUR`、`USD`、`RUB` 和 `GBP` 货币以及银行转账。卡费为 3.5% 加外 0.20 美元。

    *   **CEX.io** 是一个非常安全的交易所，作为一个交易平台。如果你计划买卖 `Bitcoin`、`DASH` 和 `Ethereum`，它是最好的投资地。它接受
    `EUR`、`USD`、`RUB` 和 `GBP` 货币，以及银行转账。卡费为 3.5%。

    *   **Coinmama** 是最受信任且易于使用的加密交易所之一。它向几乎所有国家的投资者提供 `Ether` 和 `Bitcoin`。Coinmama
    接受本地货币和信用卡支付。然而，它收取的信用卡费用为 6%，高于其他。

    *   **Gemini** 拥有 `Bitcoin`、`Ether`、`Litecoin`、`Zcash` 和其他替代币。这家位于美国的交易所收取 0.99
    美元到 1.49% 不等的交易费以及 0.5% 的费用。

    *   **Bitstamp** 拥有更多选择，包括 `Bitcoin`、`Bitcoin Cash`、`Litecoin`、`Ripple` 和 `Ether`。你可以通过信用卡/借记卡、银行转账、欧元或美元支付。它使用起来稍微复杂，因此最适合高级交易者。


    建议在使用信用卡时购买大额金额，因为它对小额购买收取高昂的费用。如果你使用借记卡，当存款金额低于 1000 美元时收取 10 美元，超过 1000 美元时收取
    2%。


    加密经纪商是指为买卖其加密货币的人提供金融服务的个人或公司。经纪商会向用户收取使用其平台的费用。像 `Bitpanda` 这样的平台既是交易所也是经纪商。


    最好的加密经纪商包括 `Coinbase`、`Kriptomart`、`eToro`、`Robinhood` 和 `TradeStation`，


    *   **Coinbase** 拥有多种替代币选择，包括 `Ethereum`、`Litecoin`、`DAI`、`DASH`、`EOS` 和 `Ripples`。


