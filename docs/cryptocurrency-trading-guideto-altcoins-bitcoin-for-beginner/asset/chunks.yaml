    \ architecture of the new blockchain. The features include `Address Formats`,\
    \ `Permissions`, `Key Formats`, `Asset Issuance`, `Asset Reissuance`, `Key Management`,\
    \ `Parameters`, `Atomic Swaps`, `Native Assets`, `MultiSignatures`, `Block Signatures`,\
    \ and `Hand-shaking`.\n\nOnce done with the architecture, the developer needs\
    \ to check the `Application Programming Interface` (`API`) that is already provided\
    \ by the blockchain platform. Then, proceed in designing the `Admin` and `User\
    \ Interface`.\n\n### 2. By modifying the existing process to form a new ‘fork’\
    \ or variant\n\nMost of the Altcoins are forks or variants of the Bitcoin protocol\
    \ like `LitecoinBitcoin`, `GoldMain`, and `CashBitcoin`. `Garlicoin` is forked\
    \ from `Litecoin`.\n\nForking an existing blockchain involves taking an open-source\
    \ code, making some changes, then launching the new blockchain with a brand new\
    \ name.\n\nThis requires skills to know the sections of the codes to modify. Changing\
    \ the parameters of the blockchain or introducing new features necessitates creating\
    \ a ‘fork.’\n\nA `fork` is technically an updated software, where all full nodes\
    \ or participants are running the same software to access the blockchain. This\
    \ ensures network security and convenience to verify the transactions.\n\nThere\
    \ are two kinds of forks:\n\n*   A `hard fork` requires the developer to update\
    \ the software by 90-95% because the nodes of the non-updated version can no longer\
    \ access the system.\n*   A `soft fork` refers to the majority of nodes that need\
    \ modification to update existing software while allowing the previous version\
    \ to continue working.\n\nThere are two ways to generate a fork. One is using\
    \ a fork coin generator like `ForkGen`. It works for people who are not equipped\
    \ with programming skills.\n\nThe other option is to do it yourself by searching\
    \ in `Github`, downloading, compiling the code, reconfiguring, implementing customization,\
    \ and publishing the code back to `Github`.\n\nThe final step is to create a white\
    \ paper or documentation and share it via a dedicated website.\n\n![image](d2d_images/image077.png)\n\
    \nAs of May 2021, there are more than 10,000 kinds of cryptocurrency in existence.\
    \ Each of them has its own unique properties and functionalities that leverage\
    \ blockchain technology in the fields of finance, health, energy, supply and logistics,\
    \ data storage, privacy and security, content ownership, social networks, and\
    \ more.\n\nCryptocurrencies function as:\n\n*   **Currency**\n    `Bitcoin` and\
    \ the majority of the cryptocurrencies have store value and can be used as a retail\
    \ payment like the traditional fiats.\n*   **Platform or app**\n    Some cryptocurrencies\
    \ function as a platform or app.\n*   **Utility**\n    Some cryptocurrencies function\
    \ as utility.\n\n#### Detailed Properties\n\n*   **Currency**\n    `Bitcoin` and\
    \ the majority of the cryptocurrencies have store value and can be used as a retail\
    \ payment like the traditional fiats.\n*   **Platform or app**\n    Some cryptocurrencies\
    \ function as a platform or app.\n*   **Utility**\n    Some cryptocurrencies function\
    \ as utility.\n\n#### Transactional properties\n\n*   **Anonymity**\n    The transactions\
    \ do not reveal identities.\n*   **Global and fast**\n    The propagation is confirmed\
    \ within seconds.\n*   **No gatekeeper**\n    There is no central authority to\
    \ delegate.\n*   **Irreversible**\n    Once transactions are confirmed, they cannot\
    \ be undone.\n*   **Secure**\n    The cryptography system locks all funds.\n\n\
    #### Monetary properties\n\n*   **Controlled and limited**\n    `Bitcoin` has\
    \ a cap while alternative coins (`altcoins`) limit the available coins each year.\n\
    *   **Representation of itself**\n    Cryptocurrencies represent themselves.\n\
    \n![image](d2d_images/image077.png)Trivia\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \nSome of the celebrities who invested in crypto are `Floyd Mayweather`, `Gwyneth\
    \ Paltrow`, `Elon Musk`, `Snoop Dogg`, `Paris Hilton`, `50 Cent`.\n\n### MINING:\
    \ THE METHOD of creating new coins of existing cryptocurrencies\n\nThe only way\
    \ to produce new units or more coins is through mining. This process involves\
    \ solving cryptographic puzzles or complex mathematical problems. Mining requires\
    \ great computing power and is very competitive. In `Bitcoin`, `SHA256 Hash` algorithm\
    \ sets the basis of puzzle.\n\nThe first miner who solves the puzzle can build\
    \ and add a block to the blockchain. To ensure that no peer can break the stability\
    \ of the blockchain, the puzzles become more difficult over time and require the\
    \ miners to invest more computer power to successfully create cryptocurrencies.\
    \ Anyone with the knowledge and skills can be a crypto miner. But because there\
    \ is no central authority to delegate the task, Satoshi requires that all interested\
    \ miners find the `hash`, which is a cryptographic function product that connects\
    \ the newly mined block with the existing blocks in the network. It is referred\
    \ to as `Proof-of-Work`.\n\n![image](d2d_images/image065.png)\n\n### Are crypto\
    \ coins and tokens the same?\n\nWhile coins and tokens are both cryptocurrencies,\
    \ they are different from each other. Depending on the given crypto codes, miners\
    \ can generate not just new coins for existing cryptocurrencies but also tokens.\n\
    \n*   `coins` have independent transaction ledgers while `tokens` are dependent\
    \ on the underlying network to validate and secure the transactions or ownerships.\n\
    *   `coins` need their own blockchains while `tokens` operate on the existing\
    \ blockchains.\n*   `coins` can be used anywhere and for any purpose, while `tokens`\
    \ are limited to certain projects only.\n*   `coins` can buy `tokens` while `tokens`\
    \ cannot be used to purchase `coins`.\n*   `coins` are instruments to transfer\
    \ wealth possession, `tokens` only represent a `contract` (loyalty points, event\
    \ tickets, physical/tangible objects).\n"
  trans: "\n\n中本聪通过创建比特币开辟了道路，许多开发者也随其后利用这一创新的系统。前谷歌工程师李林（Charlie Lee）帮助了莱特币的创建。所有加密货币创造者的目标都是生产一个更好的比特币版本，模仿它的吸引力和普及。\n\
    \n创建新的加密货币有两种方法：\n\n### 1. 通过构建新的区块链\n\n此选项需要专业人士和专家的编码技能。制作新币，开发者需要选择一个区块链平台。10\
    \ 个热门平台包括`Ethereum`（市场份额占 82.70%）、`Waves`、`NMNxt`、`MultiChain`、`BitShares 2.0`、`Hyperledger\
    \ Fabric`、`Blockstarter`、`IBM blockchain`、`CoinList`和`EOS`。\n\n工作从设计节点开始。节点支持区块链并负责数据的存储、验证和交易处理。区块链需要节点来确保效率和极安全性。\n\
    \n节点完成后，开发者将致力于建立新区块链的内部架构。特性包括`Address Formats`（地址格式）、`Permissions`（权限）、`Key\
    \ Formats`（密钥格式）、`Asset Issuance`（资产发行）、`Asset Reissuance`（资产重发）、`Key Management`（密钥管理）、`Parameters`（参数）、`Atomic\
    \ Swaps`（原子交换）、`Native Assets`（原生资产）、`MultiSignatures`（多签名）、`Block Signatures`（区块签名）和`Hand-shaking`（握手）。\n\
    \n架构完成后，开发者需要检查区块链平台提供的`Application Programming Interface`（`API`）。然后继续设计`Admin`（管理员）和`User\
    \ Interface`（用户界面）。\n\n### 2. 通过修改现有流程形成新的“分叉”或变体\n\n大多数山币都是比特币协议的分叉或变体，如`LitecoinBitcoin`、`GoldMain`和`CashBitcoin`。`Garlicoin`是从`Litecoin`分叉出来的。\n\
    \n分叉现有的区块链涉及获取开源代码进行一些更改，然后以全新的名称启动新区块链。\n\n这需要了解要修改代码部分的技能。更改区块链的参数或引入新功能需要创建一个“分叉”。\n\
    \n`fork`在技术上是一个更新的软件，所有全节点或参与者都运行相同的软件以访问区块链。这确保了网络安全和验证交易的便利性。\n\n分叉有两种：\n\n\
    *   `hard fork`（硬分叉）要求开发者将软件更新 90-95%，因为未更新版本的节点无法访问系统。\n*   `soft fork`（软分叉）指的是大多数节点需要修改以更新现有软件，同时允许之前的版本继续运行。\n\
    \n生成分叉有两种方法。一种是使用像`ForkGen`这样的分叉币生成器。它适用于不具备编程技能的人。\n\n另一种是自己动手：在`Github`中搜索、下载、编译代码、重新配置、实现定制并将代码发布回`Github`。\n\
    \n最后一步是创建白皮书或文档，并通过专用网站进行分享。\n\n![image](img/image077.png)\n\n截至 2021 年 5 月，世界上存在超过\
    \ 10000 种加密货币。每种货币都有其独特的属性和功能，利用区块链技术应用于金融、健康、能源、供应链与物流、数据存储、隐私与安全、内容所有权、社交网络等领域。\n\
    \n加密货币的功能如下：\n\n*   **货币 (Currency)**\n    `Bitcoin`和大多数加密货币具有价值存储功能，可以像传统法币一样作为零售支付手段。\n\
    *   **平台或应用 (Platform or app)**\n    某些加密货币作为平台或应用运行。\n*   **实用工具 (Utility)**\n\
    \    某些加密货币作为实用工具运行。\n\n#### 详细属性\n\n*   **货币 (Currency)**\n    `Bitcoin`和大多数加密货币具有价值存储功能，可以像传统法币一样作为零售支付手段。\n\
    *   **平台或应用 (Platform or app)**\n    某些加密货币作为平台或应用运行。\n*   **实用工具 (Utility)**\n\
    \    某些加密货币作为实用工具运行。\n\n#### 交易属性\n\n*   **匿名性 (Anonymity)**\n    交易不暴露身份。\n*\
    \   **全球化且快速 (Global and fast)**\n    传播在几秒内确认。\n*   **无门卫 (No gatekeeper)**\n\
    \    没有中心机构可以授权。\n*   **不可逆转性 (Irreversible)**\n    一旦交易确认，无法撤销。\n*   **安全性 (Secure)**\n\
    \    加密系统锁定所有资金。\n\n#### 货币属性\n\n*   **受控且有限 (Controlled and limited)**\n    `Bitcoin`有上限，而替代币（`altcoins`）限制每年的可用币数量。\n\
    *   **自我代表 (Representation of itself)**\n    加密货币代表自身。\n\n![image](img/image077.png)冷知识\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n一些投资加密货币的名人包括`Floyd Mayweather`、`Gwyneth\
    \ Paltrow`、`Elon Musk`、`Snoop Dogg`、`Paris Hilton`和`50 Cent`。\n\n### 挖矿：创建现有加密货币新币的方法\n\
    \n产生新单位或更多币的唯一方法是通过挖矿。这个过程涉及解决加密难题或复杂的数学问题。挖矿需要巨大的计算力且竞争激烈。在`Bitcoin`中，`SHA256\
    \ Hash`算法设定难题的基础。\n\n第一个解决难题的矿工可以构建并添加区块。为了确保没有节点破坏区块链的稳定性，难题随着时间的推移变得越来越困难，要求矿工投入更多的计算力来成功创建加密货币。任何拥有知识和技能的人都可以成为矿工。但由于没有中心机构来分配任务，中本聪要求所有感兴趣的矿工找到`hash`，这是一种将新挖掘的区块与网络现有区块连接起来的加密函数产物。它被称为`Proof-of-Work`（工作证明）。\n\
    \n![image](img/image065.png)\n\n### 币和代是一样的吗？\n\n虽然币和代都是加密货币，但它们是不同的。根据给定的加密代码，矿工不仅可以生成新的币，还可以生成代。\n\
    \n*   `coins`拥有独立的交易账本，而`tokens`依赖底层网络来验证交易或所有权。\n*   `coins`需要自己的区块链，而`tokens`在现有区块链。\n\
    *   `coins`可以在任何地方用于任何用途，而`tokens`仅限于特定项目。\n*   `coins`可以购买`tokens`，而`tokens`不能购买`coins`。\n\
    *   `coins`是转移财富所有权的工具，`tokens`仅代表一种`contract`（积分、活动门票、实体/有形物体）。\n\n"
