  trans: "\n\n这是一种封闭网络的分布式账本（区块链），由一个实体控制。新参与者需要经过验证过程，并且并有能力限制参与验证过程的人数。\n\n## 私有货币\
    \ (Private Currency)\n它是由私人公司或个人发行的代币或货币。通常，私有代币或货币仅在私有网络内部使用。\n\n## 证明 (Proof\
    \ of Authority)\n这是一种向私有区块链授予私钥的共识机制。它允许区块验证加密货币交易。\n\n## 拉高崩盘 (Pump and Dump)\n\
    拉高崩盘是指一种投资计划，参与者或小组人为推高资产价值，以便他们以更高的价格卖出代币。\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n## R\n\n### 恢复种子 (RECOVERY SEED)\n一种由 12 到 14 个随机字符组成的加密安全代码。\n\n### REKT\n\
    这是“wrecked”（破产）的俚语，意味着投资者损失了巨额资金。\n\n### 地毯跑路 (Rug Pull)\n一种骗局，加密货币开发者拿走投资者的资金并抛弃项目。\n\
    \n## S\n\n### 助记词 (Seed Phrase)\n指的是获取确定性加密钱包密钥的单一起始点。\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n### 序列化 (SERIALIZATION)\n将数据结构转换为字节序列的过程。例如，以太坊使用 `RLP`（递归长度前缀编码）格式。\n\n###\
    \ 分片 (Sharding)\n将网络分成多个“分片”或部分。每个分片都有一组独特的智能合约和账户余额。\n\n### 垃圾币 (Shitcoin)\n\
    一种没有用途或潜在价值的币。\n\n### 滑点 (Slippage)\n由于价格突然波动，导致交易者在购买加密货币时必须支付不同金额的状况。\n\n###\
    \ 智能合约 (Smart Contracts)\n智能合约是加密货币买方和卖家之间自动执行的代码协议。一旦满足合约上的预设条件，合约将自动完成流程，无需中介。\n\
    简而言之，智能合约相对简单且去中心化。\n\n### 智能代币 (Smart Token)\n它是具有价值并包含同时执行交易所需的关键信息的代币。\n\n\
    ### 软顶 (Soft Cap)\n指的是 ICO 旨在筹集的最低金额。\n\n## T\n\n### 交易区块 (Transaction Block)\n\
    指的是一组可以哈希处理或添加到区块链的网络交易。\n\n### 交易器符号 (Ticker Symbol)\n分配给加密货币或股票的唯一字母组合，使其在交易应用和交易所中可被识别。\n\
    \n### 代币生成事件 (Token Generation Event)\n指的是代币公开发的时间。\n\n### 总锁量 (TVL)\n它是总锁定价值\
    \ (`TVL`)，代表在特定协议中质押的资产数量。\n\n### 成交量 (Trade Volume)\n它是过去 24 小时内交易的加密货币数量。\n\n\
    ### 交易机器人 (Trading Bot)\n代表交易者自动执行加密资产交易的程序。\n\n## U, V, W, X, Y, Z\n\n### 未花费交易输出\
    \ (UTXO)\n指的是所有交易完成后留下的未花费交易。\n\n### 靓性地址 (Vanity Address)\n由所有者选择字母和数字的加密货币地址。\n\
    \n### 空壳项目 (Vaporware)\n一个从未实现的加密货币项目。\n\n### 波动性 (Volatility)\n它是收益离散程度的统计量，使用收益与市场/证券指数之间的标准差。\n\
    \n### 自对性交易 (Wash Trade)\n这是一种市场操纵行为，投资者通过同时买卖相似的加密货币来制造人为活动。\n\n### 白名单 (Whitelist)\n\
    对 ICO 感兴趣的注册参与者列表。\n\n### 白皮书 (Whitepaper)\n提供加密货币项目技术信息和增长路线图的文档。\n\n### 零确认交易\
    \ (Zero Confirmation Transaction)\n意味着交易所中未确认的交易。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
