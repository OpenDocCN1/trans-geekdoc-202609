    * Go to the screen top to change the currency

    * If you are using `Market Order`, your purchased coin will be added to your account.
    If you are selling your altcoin, enter the amount, tap the `Sell` button, and
    confirm your action.

    * To track your `CEX.IO`, open the `Trade` page.


    ![image](d2d_images/image020.png)Crypto.com: The best exchange for DeFi


