  trans: '

    审查交易手续费、币种可用性、交易量、安全措施以及平台的易用性也是同样重要的。


    ![image](img/image007.png)让我们来看吧。


    ## 安币 (Binance)：交易者的最佳交易所


    安币提供了最广泛的山币选择。它支持 184 种加密货币和代币、591 种交易对以及 150 多种支付方式。


    安币还提供金融衍生品，并为希望杠杆加密货币仓的用户提供保证金交易。


    它是领先的交易所，允许多种交易选择：山币兑比特币、山币兑美元或其他法币，以及 USDT 交易对。


    ### 特性与优势：


    * 拥有多种用于高效交易的工具

    * 零手续费的点对加密货币交易

    * 24/7 客户服务

    * 兼容 Web、PC 以及 iOS 或 Android 设备

    * 平均每日交易量达到 12 亿，或每秒超过 1,400,000 笔交易

    * 提供高级或基础交易交易所界面

    * 拥有允许用户使用数字货币进行交易的支持服务

    * 提供存储虚拟资金的电子钱包

    * 为交易者提供智能投资决策程序，为矿工提供程序

    * 经常提供折扣和奖励的 VIP 计划


    安币还以提供最低交易手续费而闻名。你可以使用他们的原生代币币币 (`BNB`) 来支付手续费并获得折扣。安币对资金存款不收取费用，仅在提现余额时收取。


    ![image](img/image086.png)


    ## 在安币上交易


    ––––––––


    ![image](img/scene_break.png)


    在安币上交易山币之前，你需要注意可能影响交易成功的小细节。这包括手续费、安全措施和可能的税费。在手续费方面，交易所执行买卖加密货币时均收取 0.1% 的固定费用。在订单完成后，你才需要支付手续费。


    * 如果你使用其他钱包，你需要将你的山币转移到安币钱包。

    * 一旦获得资金，你就可以将山币出售为比特币或太坊。

    * 如果你要买入，请设置市价单（按当前价格即时买卖）或限价单（允许你在特定价格点进入/退出）。

    * 选择你的基础货币（你想要交易的主流加密货币），如 `BTC` 或 `ETH`。

    * 点击打开该币种市场页的报价代码，选择你想要出售的山币（例如 Stellar、`EOS` 或 `BNB`）。

    * 点击页面右上角的星号，将你所选的山币添加到“收藏”，以便于跟踪。

    * 如果你使用限价单，你需要点击山币市场页上的 `Order Book`。输入你想要出售加密货币的价格和数量，然后点击红色按钮 `Sell` 执行交易。

    * 如果你采用市价单策略，只需点击山币的 `Market Trades`（市成交额）并按绿色按钮 `Sell`。在输入数量后，点击红色按钮 `Sell` 执行你的交易订单。安币将自动将山币转换为
    `ETH` 或 `BTC`。


    ![image](img/image036.png)


    ## Coinbase：新手和赚取奖励的最佳交易所


    Coinbase 是一个对于想要探索加密货币潜力的新手的友好交易所。它最初是为了比特币交易而创建的，但演变为包含山币和代币以适应其去中心化的特性。现在，它有
    50 多种山币供你选择。这个在线平台可用于数字货币的传输、存储、买卖。它支持超过 100 个国家的加密交易。


    ### 特性与优势：


    * 提供用于跟踪数字货币的高级交易平台

    * 提供质押奖励

    * 提供兼容 Android 和 iOS 移动设备的 App

    * 为零售投资者和交易者提供数字钱包

    * 允许用户安排他们的交易（每日、每周、、每月）

    * 为机构提供托管账户

    * 拥有由美元支撑的自有稳定币

    * 允许将一种山币自动转换为另一种山币

    * 为机构和个人客户提供多种投资选择

    * 设有 Coinbase Earn 账户选项，在观看教育视频后接收加密资产

    * 允许使用银行账户、借记卡或信用卡进行资金存款

    * 提供电话支持和出色的客户服务

    * 允许设置双重身份验证以增强安全性

    * 将 98% 的客户资金存储在冷存储中

    * 低提现和交易手续费


    Coinbase 提供了另外两个选项：


    * `Coinbase Prime` – 为高净值人士和机构设计。个人账户应至少有 100 万美元存款。机构客户可以访问资产中心（发行方可以在此列出并增长资产）、冷离线存储以及商业服务。

    * `Coinbase Pro` – 专为高级交易者创建。它允许用户访问实时订单簿、图表工具和安全交易机器人等功能。


    ![image](img/image031.png)


    ## 在 Coinbase 上交易


    登录你的账户以检查组合余额和加密货币在不同时间范围内的表现。


    * 要购买山币，点击组合余额上方的 `Buy crypto` 按钮。为你想要购买的币种输入市价单和美元金额。

    * 检查页面右上部分查看 `Send`（发送）和 `Receive`（接收）选项。此操作允许通过从 Coinbase 钱包提取资金来传输加密货币。


    ### Coinbase 交易规则


    * 每个交易者账户都有可用订单簿列表。它以法币和数字资产交易对结算交易。

    * 用户可以下市价单、止损单或限价单。你可以在订单完成前取消。Coinbase 对取消订单不收取费用。

    * 尝试下单部分或完全超过最后一次成交价格 2% 以上订单的交易者将收到滑点警告。

    * 所有类型的订单均受最小和最大数量限制。

    * 交易者遵循价格时间优先原则或吃单订单（Taker Orders）发布的时间。

    * Coinbase Prime 和 Coinbase Pro 都收取 `Taker Fee`（吃单费）和 `Maker Fee`（挂单费）。费用根据订单数量计算并以计价资产收取。

    * 所有 Coinbase 交易均为最终且不可逆转的。

    * 交易者不允许同时担任吃单者和挂单者。任何尝试都会导致两个订单被取消。


    ![image](img/image027.png)


    ## Gemini：移动用户的最佳交易所


    Gemini 拥有对移动用户非常实用的功能。它有适用于 Android 和 iOS 的可靠移动 App，让你随时随地管理或监控加密货币。它是一个完全监管的加密货币交易所，提供比特币和其他加密货币。


    '
