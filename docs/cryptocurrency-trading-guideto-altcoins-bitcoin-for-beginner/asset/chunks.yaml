    # Chapter 4


    ![image](d2d_images/chapter_title_below.png)


    Prepping Up for Trading


    Cryptocurrency trading has elements of volatility and unpredictability, hence
    the importance of making a trading plan that will guide you in making smart decisions.
    You also need an effective trading strategy or combination of strategies to achieve
    your goals. Having a smart plan and putting your chosen trading strategies in
    action helps you when to cut losses, when to take profits, which market to trade,
    or where to find other growth opportunities.


    ![image](d2d_images/image053.png)


    At a glance


    ✓  What is a trading plan?


    ✓  Do you need a trading plan?


    ✓  How to create a solid and winning trading plan?


    ✓  Frequently Asked Questions


    ––––––––


    ![image](d2d_images/scene_break.png)


    WHAT IS A TRADING PLAN?


    A trading plan is your comprehensive trading tool. It is a personal plan that
    will guide you when, how much, and what to trade.  It is your roadmap to successful
    cryptocurrency trading or any type of trading you want to try.


    This plan is a written document that is well-researched and systematic. It can
    be customized according to your goals, expectations, strategies, and other parameters.
    It outlines the ways to find opportunities and execute trades, what securities
    to trade, how large the position you will take, how to manage the positions, and
    the rules when or when not to trade.


    A trading plan may include the following:


    *   Your motivation or reason for trading cryptocurrency


    *   Your goals and financial objectives


    *   Your time commitment


    *   Your risk tolerance or level of attitude to risks


    *   Your personal risk management rules


    *   Your available capital


    *   Your strategies


    *   Your chosen trading markets


    *   Your record-keeping method (trading journal)


    Do you need a trading plan?


    The answer is a resounding “YES!”


    Your trading plan clearly defines your trading parameters, helping you make logical
    decisions like when to trade or when to stop your losses. During heated moments
    in the trading market, like when a bullish trend is happening, your trading plan
    helps you avoid acting irrationally.


    Other benefits of having a trading plan are:


    *   It makes trading easier – You have done all the planning and researching beforehand,
    so all you need to do is to trade your crypto according to your trading parameters.


    *   It promotes better discipline – Trading is full of growth opportunities, but
    not all good prospects can give you the edge you desire and may lead to disastrous
    events like losing all your crypto in one move. A trading plan helps you stick
    to your goals and observe your pre-set limitations.


    *   It helps in making more objective choices and decisions- Because you already
    know when to cut trading losses or when you should take your profits, you do not
    let strong emotions obscure your logical reasoning.


    *   It provides room for improvement – By reviewing your trading journal, you
    learn the lessons from your previous trading mistakes. It helps you make better
    judgments and moves.


    How to create a solid and winning trading plan?


    Remember the famous cliché, ‘failing to plan is planning to fail’? It may sound
    a little glib, but it works excellently in the business sphere, especially in
    crypto trading. A winning trading plan is what separates successful traders from
    average traders. They also methodologically follow their sound and strategic plan.


    Every trading plan is unique to traders. While you can copy or use the techniques
    of other traders, you need to consider the factors that reflect your choices and
    trading styles.


    ––––––––


    ![image](d2d_images/scene_break.png)


    HERE ARE THE VITAL steps you need to do to build your perfect master plan:


    Step 1: Outline your trading motivation


    Why do you want to join the trading world? Generally, people would say it’s all
    about the lucrative profits. But it is important to write down your reasons why
    you want to trade.


    Step 2: Define your trading goals.


    Do not just write a simple statement like “I want to gain profits.” You should
    write SMART (specific, measurable, attainable, relevant, and time-bound) goals.
    A good example is “This year, I want to add value to my financial portfolio by
    up to 25%.” You can break down your big goal into mini-goals in a week, month,
    or year. Review your goals and their progress regularly.


    Step 3: Know your trading style.


    You should know your trading style based on your attitude to risk, your personality,
    and the amount of time you can commit to trading. Trading requires time if you
    want to gain a lot of profits.


    ––––––––


    ![image](d2d_images/scene_break.png)


    IT IS IMPORTANT TO set a specific period to do your trading activities. It also
    depends on the kind of trading style method you will use.


    A quick review of the 4 primary trading styles:


    *   Day trading – It involves opening and closing several trades during the same
    day. You will be spending hours in front of your computer or mobile screen if
    it is your choice.


    *   Position trading – It is about holding your positions for several weeks, months,
    or years. It does not require too much of your time, knowing it is a long-term
    trading strategy.


    *   Scalping – This entails making several trades every day, for a few minutes
    or seconds, to make small profits that eventually will add up to a huge amount
    of money.


    *   Swing trading – It is about holding your trading positions over a few days
    or weeks and taking advantage of the price movements in the medium-term market.


    Step 4: Set your risk-reward ratio.


    In trading, you may lose many times, but you can still earn consistent profits.
    The key is setting your risk-reward ratio. How much are you willing to risk in
    your every trade? Setting your risk level is important. It should vary from 1%
    to 5% of your entire portfolio.


    Knowing your limit will help you get out of the trade without losing much when
    the market does not favor your position. A 1:3 risk-reward ratio or higher is
    ideal.


    For example, you risk $100 on a trade with a $300 potential gain. This shows that
    your target profit is double the rate of your potential loss.


    Step 5: Decide the amount of your trading capital.


    Your capital should be the amount of money you are willing to lose in the worst
    trading scenarios. It is extremely important to avoid risking more than you can
    afford or your egg nest just for the thrill of trading to have more. There are
    plenty of risks in trading, so you need to do your math before you start your
    game plan.


    ![image](d2d_images/image010.png)


    Trivia


    Backtesting is a practice that allows traders to


    test an idea with the help of historical data and


    its viability.


    FAQs


    What are the crucial questions that my trading plan should answer?


    *   What are your primary reasons why you want to become a trader?


    *   What do you want to achieve from crypto trading?


    *   What are your biggest strengths and weaknesses?


    *   What are your plans to leverage your strengths and address the weaknesses?


    *   Do you have plans that will set you apart from the majority of crypto traders
    who failed in the past?


    *   What market/markets do you plan to trade your crypto in and why?


    *   What trading systems are you going to use when entering or exiting trades?'
