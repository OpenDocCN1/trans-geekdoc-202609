  trans: "\n- 根据您选择的交易对买入或卖出您的代币。输入币的数量和预期价格。你可以通过三种方式进行：手动输入、从订单簿中选择，或选择最低卖价。\n-\
    \ 点击“买入”按钮完成您的交易。\n- 一旦订单成交，它将成为交易历史记录的一部分。\n\n## 其他值得考虑的交易交易所：\n\n### Coinmama\n\
    Coinmama 拥有超过 200 万的客户群，是一个稳健的加密货币交易所。它接受所有类型的货币进行支付，并为高端投资者服务。它支持欧洲用户使用 SEPA\
    \ 转账，为全球的客户提供 SWIFT 转账，并为英国客户提供快速支付转账。\n\nCoinmama 并不适合普通投资者或爱好者。它设置了 100 美元和\
    \ 200 美元的买卖限制。它提供了丰富的加密货币选择（仅支持直接购买），以及极少数可以相互兑换的轮换代币。在交易手续费方面，Coinmama 采用忠诚度制度来决定支付金额。它不收取提取和存款费用。\n\
    \n### Bitstamp\nBitstamp 成立于于 2011 年，其功能最适合经验丰富的交易者。它拥有最高的交易量，流动性极佳。该交易所允许用户使用银行账户、加密货币以及信用卡/借记卡进行交易，并为单一欧元支付区（SEPA）提供低廉的提取费用。\n\
    \n每笔交易的交易费用为 0.25%，但如果您单月花费超过 20,000 美元，费用将会降低。虽然它拥有以太坊、莱币、瑞币和比特币现金，但 Bitstamp\
    \ 提供的代币并不多。验证过程可能需要最多 2 周，且客户服务水平较低。但它为专业交易者提供了一系列交易工具而自豪。\n\n### PrimeXBT\n该交易所允许交易者使用单一账户访问加密货币、外汇、大商品和股票指数等多个市场。PrimeXBT\
    \ App 支持 iOS 和 Android 平台。它允许用户利用杠杆提高收益并对变化的市场趋势做出快速反应。此外，它允许用户复制交易活动以获得类似的利润。\n\
    \n### Overbit\n该交易所允许加密货币和外汇交易。它允许用户在加密货币上使用高达 100 倍的杠杆，在外汇上使用高达 500 倍的杠杆。其他让\
    \ Overbit 对交易者产生吸引力的功能包括：保护您的账户免受负余额影响，并在先进风险管理的帮助限制敞口。\n\n该平台采用精简、极简的设计，并将您的资金存储在多签（MultiSig）冷钱包中。它允许轻松地开启和关闭交易仓，并选择保证金分配以防止风险。\n\
    \n![image](img/image058.png) 你知道吗？\n\n币安最初位于中国，2018 年当中国禁止外国交易平台运营时搬到了日本。最终，由于法律问题它离开了日本。币安最终定居在马尔他。\n\
    \n## 常见问题 (FAQs)\n\n### 如何选择最好的交易所？\n以下因素可以帮助您找到适合您交易风格的完美加密货币交易所：\n- 平台声誉\n-\
    \ 安全性\n- 交易量和流动性\n- 易用性和导航\n- 它向用户收取的交易费用\n- 交付时间\n- 客户支持\n- 地理位置\n- 可访问性与限制\n\
    - 透明度\n\n### 买硬币和代币最好、最简单的方法是什么？\n唯一的方法是选择一个安全、成熟且稳健并提供快速交易的交易所。\n\n### 我可以使用多个加密货币交易所吗？\n\
    绝对可以。拥有多个交易所可以帮助您资产多元化。每个交易所都有自己的优势和特点，将帮助您交易得更成功。\n\n### 我可以将加密货币从一个交易所转移到另一个交易所吗？\n\
    可以。要向发送币，只需前往您所需的加密货币交易所并找到存款地址。现在，回到源交易所并提取您想要转移到目标交易所地址的币数量。\n\n### 我的加密货币在交易所安全吗？\n\
    原则上，不要将您的加密货币资产储存在交易所。虽然交易所有安全措施，但资产总有被黑客攻击的可能性。如果您是活跃交易者，只需留下即使发生最坏情况也负担起损失的币。\n\
    \n请注意，仅在 2020 年，几家交易所遭受了约 28 次攻击。这些网络攻击中最大发生在 `KuCoin`，这家位于新加坡的交易所损失了超过 2 亿美元的加密货币。\n\
    \n### 交易所有保险吗？\n一些加密货币交易所为客户提供保险覆盖，以保护其数字资产免受欺诈或黑客攻击。例如 `Coinbase` 拥有价值 2.55 亿美元的保险单来确保其储备金。\n\
    \n### 为什么加密货币交易所有不同的费用结构？\n交易所通常对每笔加密货币交易收取费用。取决于你是买方还是卖方，费用会有不同。热门且较大的交易所由于保险覆盖和额外的安全措施，费用较高。其他交易所根据交易百分比和价格波动收取费用。此外，不同的货币收取的费用也不同。\n\
    \n### 为什么我应该选择热门交易所？\n虽然有例外，但热门加密货币交易所拥有最高的交易量。交易量等同于极佳的流动性，这是当您想交易、卖出或购买加密货币时的重要因素。当交易很多时，您可以轻松以最佳价格买卖代币。交易量低的交易所可能会让您花费更多。从全球交易量来看，根据\
    \ `CoinMarketCap`，前三大交易所是 `Binance`、`Coinbase` 和 `Huobi`。\n\n### 为什么在选择交易所时用户体验很重要？\n\
    直观的用户界面提供了极佳的用户体验。这通常会导致交易量的快速增长。交易所的价值与用户数量和交易次数紧密相关。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | ---\
    \ | --- |\n\n![image](img/chapter_title_above.png)\n\n# 第 8 章\n\n![image](img/chapter_title_below.png)\n\
    \n## 寻找最佳钱包\n\n山寨币钱包的工作方式与比特币钱包类似。这些数字钱包在加密货币和代币的功能与增长中起着至关重要的作用。它们作为持仓的存储，并方便用户之间转转资金。\n\
    \n虽然某些山寨币有自己的钱包，但长远来看，跟踪所有的加密货币资产会变得困难。这时您需要一个支持多种山寨币的单一钱包。\n\n从技术上讲，所有的钱包都可以持有超过一种加密货币。让它们彼此不同的是它们可以存储的币的数量。其中一些多币钱包可以是选择性的，而另一些钱包则作为通用钱包。\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image051.png)\n\n\
    ### 概览\n\n- 为什么选择最好的钱包很重要？\n- 最佳山寨币钱包的基础是什么？\n- 不同类型的加密货币钱包\n- 选择钱包时问问自己的几个问题\n\
    - 我推荐：5 个最佳软件钱包 \n- 我推荐：5 个最佳硬件钱包\n- 带有安全钱包的交易所\n- 特别提到：具有特殊功能的钱包 \n- 针对高净值人士和机构的托管存储\n\
    - 常见问题 (FAQs)\n\n### 为什么选择最好的钱包很重要？\n\n在选择加密货币钱包时，考虑最重要的因素是安全性。它必须具有自适应功能以确保您的资金安全并提供便利的交易服务。随着市场上出现越来越多的山寨币，山寨币钱包也随之增加。\n\
    \n"
