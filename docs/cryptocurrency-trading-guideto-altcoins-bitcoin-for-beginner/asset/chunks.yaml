    \ Bitcoin reached an all-time high of $61,683. Way back then during its creation,\
    \ 1 BTC was worth $0.008.\n\nWhat’s the difference?\n\nBitcoin (with capital B)\
    \ refers to this crypto as an entity,\n\nwhile bitcoin (small letter b) refers\
    \ to the quantity or the units.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \nTHE VALUE OF BITCOIN\n\nBitcoin is not a coin, but a file with certain values\
    \ that can be used for initiating payments to goods or services. It is a digital\
    \ software with a unique set of protocols, rules, and processes that exists in\
    \ the virtual cloud.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\nBITCOIN’S\
    \ REAL VALUE comes from its code, infrastructure, scarcity, and adoption. It has\
    \ no intrinsic value or is backed by gold and silver. Intrinsic value refers to\
    \ any kind of currency that has the backing of the government, precious metals,\
    \ or the people’s trust over the government.\n\nBitcoin and Altcoins do not have\
    \ these elements, but they have the trust of millions of people. The participants\
    \ in the crypto network are the miners and traders who trust Bitcoin decides its\
    \ price based on supply and demand.\n\nIn addition, like traditional currencies,\
    \ Bitcoin has value because it is accepted as a unit of exchange and as a store\
    \ of value. It also possesses the 6 major attributes of successful currencies:\n\
    \n*   Scarcity – Bitcoin’s finite availability greatly increases its demand in\
    \ the market. Currently, more than 18 million bitcoins are in circulation. Mining\
    \ new bitcoins will stop when it reaches the 21 million limit.\n\n*   Utility\
    \ – Bitcoin’s blockchain technology is one of its selling points. The trustless\
    \ and decentralized nature of this ledger system makes global transactions more\
    \ convenient and safe.\n\nMoreover, blockchain technology is also flexible and\
    \ can be utilized beyond the crypto world.\n\n*   Divisibility – The smallest\
    \ unit of Bitcoin is Satoshi, which is equal to 0.00000001 One Bitcoin is equivalent\
    \ to 100,000,000 Satoshis. The lowest transaction value in Bitcoin is 546 Satoshis.\n\
    \n*   Durability – Cryptocurrencies are not susceptible to deformity or other\
    \ physical harms that will render them unusable. This characteristic makes Bitcoin\
    \ tremendously valuable. It will continue its existence in the blockchain as long\
    \ as there are transactions by the owners and traders.\n\n*   Transportability\
    \ – Bitcoin can be transferred from one user to another in a matter of seconds,\
    \ regardless of the amount of the transaction via crypto wallets and exchanges.\n\
    \n*   Counterfeitability – Attempting to counterfeit bitcoin is incredibly difficult\
    \ because of the decentralized and complex structure of its blockchain ledger\
    \ system.\n\nHow do you classify Bitcoin?\n\nIs it an asset class, a store of\
    \ value, a payment system, or a kind of currency? Bitcoin can be all these, making\
    \ it a versatile virtual phenomenon that is exchanged through blockchain technology\
    \ or publicly distributed ledger. There is no human-to-human intervention during\
    \ the transactions.\n\nTechnically, Bitcoin is simply a list. For example, Person\
    \ C transferred X bitcoin to Person D, who sent bitcoin to Person E. All these\
    \ transactions are processed, tallied, and recorded permanently in the blockchain.\
    \ Bitcoin’s blockchain is open to the public, so anyone can view past and current\
    \ transactions.\n\nThis popular virtual currency is regarded by the Commodity\
    \ Futures Trading Commission (CFTC) as a commodity while the Internal Revenue\
    \ Service (IRS) sees it as a property and needs to be taxed.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n![image](d2d_images/image046.png)\n\nBitcoin transactions"
