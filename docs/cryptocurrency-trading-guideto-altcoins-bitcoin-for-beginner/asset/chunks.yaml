- raw: 'Satoshi Nakamoto has cleared the path by creating Bitcoin and many developers
    followed to exploit the innovative system. Charlie Lee, a former engineer of Google,
    helped the creators of Litecoin.  All crypto creators aim to produce a better
    version of Bitcoin to mimic its traction and popularity.


    There are 2 ways to create new cryptocurrencies:


    1\. By building a new blockchain


    This option requires the coding skills of professionals and experts. To make new
    coins, the developer needs to choose a blockchain platform. The 10 popular platforms
    are Ethereum (with 82.70% market share), Waves, NEMNxt, MultiChain, BitShares
    2.0, Hyperledger Fabric, Blockstarter, IBM blockchain, CoinList, and EOS.


    The work begins by designing the nodes. The nodes support the blockchain and are
    responsible for data storage, verification, and processing of transactions. Blockchains
    need nodes to ensure efficiency and utmost security.


    After the nodes are built, the developer will work to establish the internal architecture
    of the new blockchain. The features include Address Formats, Permissions, Key
    Formats, Asset Issuance, Asset Reissuance, Key Management, Parameters, Atomic
    Swaps, Native Assets, MultiSignatures, Block Signatures, and Hand-shaking.


    Once done with the architecture, the developer needs to check the Application
    Programming Interface (API) that is already provided by the blockchain platform.
    Then, proceed in designing the Admin and User Interface.


    2\. By modifying the existing process to form a new ‘fork’ or variant


    Most of the Altcoins are forks or variants of the Bitcoin protocol like LitecoinBitcoin,
    GoldMain, and CashBitcoin. Garlicoin is forked from Litecoin.


    Forking an existing blockchain involves taking an open-source code, making some
    changes, then launching the new blockchain with a brand new name.


    This requires skills to know the sections of the codes to modify. Changing the
    parameters of the blockchain or introducing new features necessitates creating
    a ‘fork.’


    A ‘fork’ is technically an updated software, where all full nodes or participants
    are running the same software to access the blockchain. This ensures network security
    and convenience to verify the transactions.


    There are two kinds of forks:


    *   A hard fork requires the developer to update the software by 90-95% because
    the nodes of the non-updated version can no longer access the system.


    *   A soft fork refers to the majority of nodes that need modification to update
    existing software while allowing the previous version to continue working.


    There are two ways to generate a fork. One is using a fork coin generator like
    ForkGen. It works for people who are not equipped with programming skills.


    The other option is to do it yourself by searching in Github, downloading, compiling
    the code, reconfiguring, implementing customization, and publishing the code back
    to Github.


    The final step is to create a white paper or documentation and share it via a
    dedicated website.


    ![image](d2d_images/image077.png)


    As of May 2021, there are more than 10,000 kinds of cryptocurrency in existence.
    Each of them has its own unique properties and functionalities that leverage blockchain
    technology in the fields of finance, health, energy, supply and logistics, data
    storage, privacy and security, content ownership, social networks, and more.


    Cryptocurrencies function as:


    *   Currency


    Bitcoin and the majority of the cryptocurrencies have store value and can be used
    as a retail payment like the traditional fiats.


    *   Platform or app


    Some cryptocurrencies function as platform or app crypto. Augur, for instance,
    is used to launch the Ethereum network.


    *   Utility


    The group of crypto with utility functions is developed as infrastructure, allowing
    other cryptocurrencies to be built on top of them. Ethereum has the Ethereum Virtual
    Machine that allows the creation of token coins.


    Technically, cryptocurrencies are secured by solid cryptography, not by trust
    or people.


    The consensus-keeping process enhanced their monetary and transactional properties.


    Transactional properties


    *   Anonymity – Crypto accounts and transactions do not impose a connection to
    the real-world identities of the users. The addresses are created using minimum
    personal data and the blockchain does not reveal details, only the flow transactions.


    *   Global and fast – Instant propagation and confirmation of transactions within
    seconds. The virtual network is indifferent to geographical locations and borders.


    *   No gatekeeper – As long as you have downloaded the software and a crypto wallet
    for your coins or tokens, you can start using them to pay for goods and services
    or trade with other investors.


    *   Irreversible – Once transactions are confirmed, they cannot be undone or reversed
    by anyone including the senders. Nobody can help you retrieve your coins if you
    send them to a fraudulent receiver.


    *   Secure – The solid cryptography system locks all crypto funds. All users have
    private keys to access their own assets.


    Monetary properties


    *   Controlled and limited supply – Bitcoin has a cap that is expected to happen
    around the year 2140. Most altcoins do not have a limit cap but follow the schedule
    written in their codes to create new coins and tokens.


    *   Representation of itself- Cryptocurrencies represent themselves, not numbers
    or debts like the Fiat currencies. Bitcoin and altcoins are bearers of their own
    values and follow their proprietary systems.


    ![image](d2d_images/image003.png)Trivia


    ––––––––


    ![image](d2d_images/scene_break.png)


    Some of the celebrities who invested in


    crypto are Floyd Mayweather, Gwyneth Paltrow,


    Elon Musk, Snoop Dogg, Paris Hilton, 50 Cent,


    and Rapper Logic.


    MINING: THE METHOD of creating new coins of existing cryptocurrencies


    The only way to produce new units or more crypto coins is through mining. This
    process involves solving cryptographic puzzles or complex mathematical problems. 


    Mining requires great computing power and is very competitive. In Bitcoin, the
    SHA 256 Hash algorithm sets the basis of the cryptologic puzzle.


    The first miner who solves the puzzle can build and add a block to the blockchain.
    As an incentive, he will receive a certain number of coins or tokens.


    To ensure that no peer can break the stability of the blockchain, the puzzles
    become more difficult over time and require the miners to invest more computer
    power to successfully create new cryptocurrencies.


    Bitcoin has a maximum cap of coins while alternative coins (altcoins) limit the
    available coins in circulation each year but do not have a maximum number of target
    coins.


    Anyone with the knowledge and skills can be a crypto miner. But because there
    is no central authority to delegate the task, Satoshi requires that all interested
    miners find the ‘hash’, which is a cryptographic function product that connects
    the newly mined block with the existing blocks in the network. It is referred
    to as ‘Proof-of-Work.’


    The rationale of this rule is to prevent the breakdown of the cryptocurrency network
    due to forged transactions created by abusive parties.


    ![image](d2d_images/image065.png)


    Are crypto coins and tokens the same?


    While coins and tokens are both cryptocurrencies, they are different from each
    other. Depending on the given crypto codes, miners can generate not just new coins
    for existing cryptocurrencies but also tokens.


    *   Coins have independent transaction ledgers while tokens are dependent on the
    underlying network to validate and secure the transactions or ownerships.


    *   Coins need their own blockchains while tokens operate on the existing blockchains.


    *   Coins can be used anywhere and for any purpose, while tokens are limited to
    certain projects only.


    *   Coins can buy tokens while tokens cannot be used to purchase coins.


    *   Coins are instruments to transfer wealth possession, tokens only represent
    a ‘contract’ (loyalty points, event tickets, physical/tangible objects).'
