    To trade Bitcoin, here’s a step by step beginner’s guide:


    ### Step 1: Know the price

    Head over to an exchange broker or index to find out the current price of Bitcoin.
    Its price goes up and down because of the impact of supply, integration, bad press,
    or key events.


    ### Step 2: Select how to get exposure to Bitcoin

    There are 3 ways to get exposure:

    *   Buying through an exchange – traders who like to have direct ownership of
    their bitcoins and go for a buy-and-hold strategy.

    *   Trading bitcoin derivatives – traders speculate on the price using `CFDs`
    without the need to buy coins. It allows you to take a position by ‘going short’
    or ‘going long.’

    *   Crypto 10 index- a market capitalization-weighted index (`B10 index`) of top
    ten performing cryptocurrencies. Market capitalization is the result of multiplying
    the current market value of the crypto against the US dollar by the number of
    units of the given coin.


    ### Step 3: Choose a broker

    Decide which broker or exchange to use for trading Bitcoin. Some brokers allow
    trading the Bitcoin’s underlying assets via spread bets or `CFDs`.


    ### Step 4: Set a trading capital

    Start small and trade only what you can afford to lose. Again, trading is about
    speculations so strike while the iron is hot but proceed with caution.


    ### Step 5: Decide on your trading strategy

    The trading strategy is your preferred style of trading. It will determine what
    kind of trader you are. Generally, you will fall into one of these types:

    *   Day traders – those who take advantage of short term price movements in the
    crypto market

    *   Scalpers – active traders who make multiple traders every single day to gain
    small profits

    *   Swing traders – those who seek to capture market trends based on the results
    of their technical analysis

    *   Passive traders – people who hold their positions to gain long term profits


    ––––––––


    ![image](d2d_images/scene_break.png)


    ### STEP 6: SET STOPS AND limits

    They are important tools to manage the risks in trading. A stop order allows traders
    to set the price point where your order will be executed. It works to limit your
    losses, protect profits, as well as initiate new trading positions.


    A limit order lets traders set the minimum price that will trigger execution.
    There is an advanced setting that allows you to choose `Post Only` or `Allow Taker`.
    Enabling `Post Only` keeps the limit order on the order book. When it is filled,
    you will be charged a `Maker Fee`.


    `Allow Taker` allows the market order’s fulfillment whenever it crosses the spread,
    regardless if it is only a portion of the total order. The `Taker Fees` are calculated
    based on the portion.


    ### Step 7: Open and monitor your trade

    Opening a trade means buying when you believe that the price of the Bitcoin will
    rise or selling your coin when you think that the price will fall. Monitoring
    the market is necessary to ensure that the Bitcoin price is moving favorably.


    ### STEP 8: CLOSE YOUR position

    Whenever you feel uncomfortable, cut your loss by closing your position. You can
    also close it if you like to take your profit. All losses are deducted from your
    trading account balance and the profits are trading directly to your account.


