  trans: '

    与信用卡或借记卡购买相比，使用比特币进行购买更加简单。你只需要输入接收者的地址，输入金额并点击发送。你也可以通过扫描二维码来完成交易。


    ––––––––


    ![image](img/scene_break.png)


    # 我能从比特币中获得什么优势？


    比特币提供了支付的自由——没有官僚主义，没有地理边界，也没有银行节假日。它有不同等级的转账手续费，而且接收比特币是不收取手续费的。交易是安全的、匿名的且不可逆的。所有交易在区块链上都是中立且透明的（不会泄露你的身份）。


    ## 使用比特币的哪些缺点？


    接受加密货币支付的商户数量仍然较少，而且许多人对加密货币仍然不了解。`Bitcoin`的波动性也是另一个因素。


    ## 比特币是骗局吗？


    不是。庞氏骗局利用其投资者的弱点，当没有新参与者时，网络就会崩溃并影响到最近的投资者。`Bitcoin`是一个去中心化的软件项目，所有交易都利用区块链技术，并防止关于投资的欺诈陈述。


    ––––––––


    ![image](img/scene_break.png)


    # 比特币是邪教吗？


    不是。`Bitcoin`是一种虚拟资产，既被接受支付选项，也是交易和投资工具。相比之下，邪教是一群投入某种理念或使命的虔诚追随者群体。这种误解源于`bitcoin`引起的狂热，吸引了许多信徒。


    ## 比特币是一个泡沫吗？


    有些人认为`Bitcoin`是一个泡沫，因为自其诞生以来，其价值经历了惊人的 1000 万%增长。泡沫预计会在一段时间后破裂。然而，`Bitcoin`证明了，尽管它的价格由于供需因素而波动，但它仍然吸引着全球更多的用户。


    | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](img/chapter_title_above.png)


    # 第 6 章


    ![image](img/chapter_title_below.png)


    ## 山寨币闪光的时刻


    ## ![image](img/image057.png)在`bitcoin`成功之后，市场上出现了许多数字货币。它们被统称为`Altcoins`或替代币（alternative
    coins）。`Altcoin`一词源于“alt”（替代）和“coin”（加密货币）词的组合，意味着它是除`Bitcoin`之外的某种加密货币。


    ### 概览


    ✓ 什么是山寨币？


    ✓ 它们与`Bitcoin`有什么区别？


    ✓ 投资山寨币优缺点是什么？


    ✓ 有哪些种的山寨币？


    ✓ 代币：安全性与实用性


    ✓ 认识最重要的山寨币


    ✓ 山寨币关注列表：DeFi 币和代币


    ✓ 为什么你应该交易山寨币


    ✓ 如何交易山寨币？


    ✓ 在`AltSeason`（山寨季）之前必须拥有的山寨币


