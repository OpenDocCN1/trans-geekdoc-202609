    ![image](img/scene_break.png)


    ## DOGECOIN (DOGE)


    狗狗币（Dogeecoin）是一个笑话，但形象是柴犬。2021 年，狗狗币达到了 85,314,523。它是一个梗，但已变成了合法的投资。根据硬货币价格预估，2030
