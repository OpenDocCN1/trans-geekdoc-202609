    # Chapter 2


    ![image](d2d_images/chapter_title_below.png)


    Beginners Guide in Cryptocurrency Trading


    The most obvious way to make money out of your cryptocurrency is to engage in
    trading.  If you do it right, crypto trading will give you tremendous returns
    compared to traditional investments.  In just a short period, you can be a millionaire
    or multi-millionaire, or a loser in the trading sphere.


    This high volatility and growth potential of crypto makes it very attractive to
    investors and traders who want to multiply their money. It is common for crypto
    coin prices to display exponential growth or fluctuate more than 10%. Interest
    in cryptocurrency has been increasing.


    Many traditional investors and millennials are diversifying their investment portfolio,
    adding bitcoins and altcoins as investment and trading instruments.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ![image](d2d_images/image030.png)


    AT A GLANCE


    ✓  Trading vs. Investing


    ✓  Top benefits of crypto trading


    ✓  How does crypto trading differ from other trading options?


    ✓  Different kinds of trading styles


    ✓  How to pick the right trading style?


    ✓  Elements that affect crypto trading


    ✓  Basic steps in crypto trading


    ✓  Two approaches in crypto trading


    ✓  Things to remember before trading your crypto


    ✓  Frequently Asked Questions (FAQs)


    ––––––––


    ![image](d2d_images/scene_break.png)


    TRADING VS. INVESTING


    Trading and investing are two economic concepts that involve buying assets to
    grow wealth by earning profits. In the financial markets, assets are called instruments.
    They come in the form of bonds, stocks, cryptocurrency, options, margin products,
    currency pairs (Forex market), and many others.


    Trading


    As a newbie who wants to delve into the exciting cryptocurrency sphere, your first
    step is to understand what crypto trading all is about and how to be a successful
    trader. You need to create a game plan and follow the clearly defined steps to
    achieve your trading goals. Basically, trading is the term for short-term trading
    because it involves active positioning (enter and exit) in short period frames.


    But trading is more than that as it uses different types of strategies like trend
    trading, day trading, swing trading, and more. When you trade your cryptocurrencies,
    you speculate on the price movements by buying or selling the coins via a broker
    exchange or contracts for difference (CFDs) trading account.


    Investing


    Investing refers to allocating resources or money to buy a property, asset, or
    financial instrument and selling it in the future at a higher amount. The core
    of investment is the ROI or return on investment. Unlike trading, investing involves
    waiting for a longer period like years or decades before selling the asset.


    The main objective of investing is building wealth over a certain time which usually
    takes a decade or more. It is more of a passive approach where investors are not
    concerned about the price fluctuations.


    While both seek to gain profits, the traders and investors use different methods
    to achieve their financial goals.


    *   Traders are constantly watching the market trends and taking advantage of
    its volatility. If you are into trading, you need to enter and exit positions
    to gain returns.


    *   Investors wait for a time being to get their target ROI for their investments,
    which typically are double or larger than the amount they spend to buy the asset.


    ![image](d2d_images/image045.png)


    Trivia


    The business value that is added by blockchain


    would surpass $3.1 trillion by 2030.


    Top benefits of cryptocurrency trading


    *   Volatility


    The volatility element of cryptocurrency makes it more exciting to trade and invest.
    Its rapid price movements in a single day allow traders to go short or long. These
    two jargons represent the core of trading. Both reflect the possible direction
    of the cryptocurrency- either to rise in value or fall.


    When you go “long” or buy a cryptocurrency, you are hoping that you will generate
    a profit from a certain point. In contrast, when you go “short”, you sell your
    cryptocurrency because you are expecting that its price will fall from a certain
    point.


    *   Ability to go short or long


    When you trade, your primary aim is to see your asset increase in value. So, during
    trading, you should always take advantage of the rising and falling of crypto
    prices.


    *   Availability


    Because of the decentralized nature of cryptocurrency, the market is open for
    trading 24/7. You can trade whenever you want or make direct transactions with
    other users via crypto exchanges anywhere in the world. However, there are times
    when the crypto market is unavailable due to ‘forks’ or infrastructural updates.


    *   Anonymity and privacy


    If you use decentralized crypto exchanges, you can trade without identifying yourself.
    While in a centralized trading platform, you share some of your particulars but
    remain anonymous to other traders.


    *   Quick account opening


    Before you can start trading cryptocurrency, you need to open and register your
    exchange account. For this purpose, you need to find a trusted broker exchange
    that offers a simple registration form and quick verification.'
