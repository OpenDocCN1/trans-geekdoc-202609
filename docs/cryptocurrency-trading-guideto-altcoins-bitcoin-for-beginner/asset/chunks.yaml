    NEO


    NEO was founded in 2014 by Erik Zhan and Da Hongfei as AntShares but later rebranded
    into NEO. Its Onchain technology offers a centralized approach that enables ‘dapps’
    or decentralized applications that generate smart contracts.


    This is in line with their goal of creating a digital smart economy that delivers
    fast, secure, and seamless transactions.


    And while the Chinese government still imposes restrictions on crypto transactions
    in the nation, NEO seems to be thriving well in the virtual ecosystem. It has
    a 3^(rd) key feature that separates it from other blockchain-based cryptos – the
    digital identity.


    ![image](d2d_images/image072.png)NEO’s base asset is the NEO token that creates
