    \ top DEXs are `Uniswap (V2)`, `Tokenlon`, `io`, `Blocknet`, and `AirSwap`.\n\n\
    **Pros:**\n- Anonymity – Traders are not required to provide personal information,\
    \ which keeps the transactions between the seller and buyer anonymous and private.\n\
    - No hacking risk – There is no transfer of assets via a third party, so the risk\
    \ of being hacked is zero.\n- No market manipulation – Due to the nature of transactions,\
    \ there is no market manipulation. This protects traders from wash trading and\
    \ fake trading.\n\n**Cons:**\n- No fiat payment – Decentralized exchanges require\
    \ traders to pay crypto for another crypto. This is inconvenient for beginners\
    \ who want to pay fiat currency.\n- Complexity – Traders who use this kind of\
    \ exchange should familiarize themselves with the trading process and the platform.\
    \ It is also important to memorize the password or keys to their digital wallets\
    \ and have a backup to prevent losing their coins forever.\n- Lack of liquidity\
    \ – Since most crypto transactions are done in centralized exchanges, the decentralized\
    \ exchanges experience low trading volumes that lead to a lack of liquidity. When\
    \ trading volume is low, there are not enough buyers or sellers of the cryptocurrency.\n\
    \n![image](d2d_images/image032.png)\n\n### Trivia\nThe global blockchain market\
    \ would be worth $20 billion by 2024.\n\n## Key factors that influence the crypto\
    \ market prices\n\nThere is a market when demand meets supply or vice-versa. The\
    \ market prices rely heavily on demand and supply. They are also highly sensitive\
    \ to speculations and potential moves of buyers. In essence, the assets’ prices\
    \ are decided by the sellers and buyers. They hold their value because traders\
    \ and investors say they do.\n\n- **Supply and demand**: As a unit of exchange,\
    \ the bottom line of cryptocurrency is trading. The price soars when more people\
    \ set their intention to buy a cryptocurrency and more sellers are willing to\
    \ sell. On the other hand, the price goes down when there are more sellers but\
    \ buyers are not willing to purchase.\n- **Market capitalization**: It is the\
    \ value of all circulating or existing crypto coins and how traders/investors\
    \ perceive their growth rate.\n- **Integration**: It displays the easy integration\
    \ of cryptocurrency into the e-commerce payment system and other existing infrastructure.\n\
    - **Endorsements**: When notable personalities, economic experts, or celebrities\
    \ positively endorse certain crypto, it can cause a hike in prices as investors\
    \ and traders begin to accumulate them to ride with the tide. But remember that\
    \ there is a thing called disguised advertisements. They are endorsements used\
    \ to generate a temporary demand but leave the investors with coins that only\
    \ promise immediate returns.\n- **Press/Media**: It refers to the way cryptocurrencies\
    \ are portrayed in media channels and the amount of coverage they get. News stories\
    \ or rumors about the potential ban of crypto or central bank control can cause\
    \ price movements.\n- **Key events**: It includes major events like economic setbacks,\
    \ security breaches, attacks on exchanges that reveal security flaws, and regulatory\
    \ updates.\n- **Disagreements in cryptocurrency communities**: This pertains to\
    \ issues over upgrades like when a certain cryptocurrency goes through a hard\
    \ fork.\n\n![image](d2d_images/image063.png)\n\n## Market trends\n\nMarket trends\
    \ refer to the perceived direction of movement of any kind of financial market\
    \ within a certain period. They are identified in technical analysis with the\
    \ help of trend lines, price action, or key moving averages. One peculiar characteristic\
    \ of market trends is that traders believe that they have accurately determined\
    \ or predicted the future event in hindsight. However, hindsight bias can produce\
    \ a key impact on identifying market trends as well as making trading decisions.\n\
    \nThe primary market trends are the bull and bear markets. The bull market symbolizes\
    \ the increasing trend in the financial market or sustained uptrend, while the\
    \ bear market means a declining market or sustained downtrend.\n\nEach market\
    \ trend can last from 1-3 years. It is important to remember that market trends\
    \ do not entirely mean that the price is going in the given direction. A prolonged\
    \ bear market has some smaller bear trends within the period and vice versa.\n\
    \n![image](d2d_images/scene_break.png)\n"
  trans: '

    现货市场上总有做市者（maker）和吃市者（taker）。买卖订单都有相应的做市和吃市者。交易者的所有订单都可以在交易所的账本或订单簿上查看。平台具有自动匹配功能，可以将买单与现有的卖单进行匹配。


    ### 衍生品市场


    衍生品是其基础价值基于加密货币当前价值的金融工具。它们包括差价合约 (`CFDs`)、期权合约、期货合约、代币交换和杠杆代币。


    - 期权合约赋予交易者在未来以特定价格出售或买入资产的权利，而非义务。

    - 期货合约允许加密货币交易者对资产的未来价格进行投机。这是双方约定在到期日按最后交易价格出售资产的协议。此外，合约结算是预先设定的。可以是现金结算，也可以将基础资产实物交付给交易者。

    - 杠杆代币是可交易的金融工具。它们提供杠杆敞口，无需建立杠杆头寸。偏好使用它们的交易者无需不断担心资金、清算、保证金或抵押品。这些以代币形式存在的创新产品价值源于永续期货仓。

    - 差价合约 (`CFD`) 是一种金融合约，允许交易者获得入场价格与结算价格之间的差额。因此，当退出价格高于入场价格时，加密货币卖方向买方支付差额。如果收盘价低于开盘价，卖方获利。


    ## 理解加密货币交易所


    加密市场通常被称为加密货币交易所或便利加密货币兑加密或法货币/数字资产交易的在线平台。许多加密交易所在全球范围内交易，提供数百种可选的币和代币。它们还为活跃交易的人士提供电子钱包。


    某些交易所由经纪人拥有，他们是加密货币买卖双方之间的中间人。经纪人通过交易费和佣金盈利。


    ### 加密交易所的类型


    #### 1. 中心化加密货币交易所


    它们由公司运营，更加可靠。统计数据显示，约 99% 的交易者选择通过中心化交易所进行交易。根据交易量、流量和流动性排名的交易所有 `Binance`、`Huobi
    Global`、`Coinbase`、`Kraken` 和 `Bithumb`。


    **优点：**

    - 可靠性 – 它们拥有完善且中心化的平台，便于交易和交易结算，提供了更高的安全性和可靠性。

    - 用户友好 – 它们对初学者最好用，因为平台界面易于导航，交易者每次登录时都可以检查账户和余额或进行交易。


    **缺点：**

    - 交易手续费 – 交易者需要为提供的服务和便利性支付一定费用。手续费成本取决于交易的加密货币数量。

    - 黑客风险 – 中心化交易所通常持有大量加密货币，这使其成为大规模盗窃和黑客攻击的目标。


    #### 2. 去中心化加密货币交易所 (DEX)


    这类交易所涉及点对交易。没有中间人或第三方，因此交易者不需要支付手续费。顶级 DEX 有 `Uniswap (V2)`、`Tokenlon`、`io`、`Blocknet`
    和 `AirSwap`。


    **优点：**

    - 匿名性 – 交易者不需要提供个人信息，这使买卖之间的交易保持匿名和隐私。

    - 无黑客风险 – 资产不通过第三方转移，因此被攻击的风险为零。

    - 无市场操纵 – 由于交易的性质，不存在市场操纵。这保护交易者免受自售交易和虚假交易的影响。


    **缺点：**

    - 无法币支付 – 去中心化交易所要求交易者用加密货币支付另一种。这对于想支付法币的初学者来说是不方便的。

    - 复杂性 – 使用这种交易所的交易者应该熟悉交易流程和平台。记住数字钱包的密码或密钥并备份以防止永久丢失硬币也是非常重要的。

    - 流动性缺乏 – 由于大多数加密货币交易在中心化交易所进行，去中心化交易所的交易量较低，导致流动性缺乏。当交易量低时，加密货币的买家或卖家数量不足。


    ![image](img/image032.png)


    ### 冷知识

    全球区块链市场到 2024 年价值将达到 200 亿美元。


    ## 影响加密货币价格的关键因素


    当需求遇到供给或反之时，就有了市场。市场价格高度依赖供需。它们也对投机和买家的潜在行为非常敏感。从本质上说，价格由卖方和买方决定。它们之所以保持价值，是因为交易者和投资者认为它们有价值。


    - **供需关系**：作为交换单位，加密货币的底线是交易。当更多人意图购买某种加密货币且更多卖者愿意出售时，价格就会飙升。相反，当卖者多但买家不愿购买时，价格就会下跌。

    - **市值**：它是所有流通或存在的加密货币的价值，以及交易者/投资者对其增长率的认知。

    - **整合**：它展示了加密货币轻松集成到电子商务支付系统和其他现有基础设施中。

    - **背书**：当知名人物、经济专家或名人对某些加密货币进行正面背书时，可能会导致价格上涨，因为投资者和交易者开始积累它们以追逐潮流。但请记住，存在所谓的“隐藏广告”。它们是用于产生临时需求的背书，但给投资者留下只承诺即时回报的币。

    - **新闻/媒体**：指的是加密货币在媒体渠道中的描绘方式以及获得的报道量。关于可能禁止加密货币或央行控制的新闻或传言可能会导致价格波动。

    - **关键事件**：包括重大事件，如经济挫折、安全泄露、揭示安全漏洞的交易所攻击以及监管更新。

    - **加密货币社区中的分歧**：这涉及升级问题，例如当某种加密货币进行硬分叉时。


    ![image](img/image063.png)


    ## 市场趋势


    市场趋势是指特定时期任何类型金融市场移动的感知方向。在技术分析中，通过趋势线、价格行为或关键移动平均线来识别趋势。市场趋势的一个独特特征是，交易者认为他们在事后准确地确定或预测了未来事件。然而，事后光光偏偏差会对识别市场趋势以及做出交易决策产生重大影响。


    主要的市场趋势是牛市和熊市。牛市象征着金融市场的增长趋势或持续的上升趋势，而熊市意味着市场衰退或持续的下降趋势。


    每个市场趋势可以持续 1-3 年。记住，市场趋势并不完全意味着价格会朝着给定方向运行。长熊市在期间内包含一些较小的熊市，反之亦然。


    ![image](img/scene_break.png)

