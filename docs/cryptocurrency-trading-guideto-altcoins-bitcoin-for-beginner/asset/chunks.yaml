- raw: 'A movement promoting crypto use and privacy-focused technologies in advancing
    political and social reforms.


    D


    DeFi Aggregator


    It brings trades from different DeFi platforms in a single place.


    Dead Cat Bounce


    It is the term used to describe a temporary recovery after the prolonged price
    decrease.


    Decentralized Social Media


    It is a blockchain-based social media platform.


    Deterministic Wallet


    It is a crypto wallet where addresses and keys are generated from a single seed.


    Difficulty


    The difficulty is a concept that outlines the hardness of block verification during
    the mining process. In Bitcoin, the difficulty of Proof of Work mining changes
    every 2016 block. This is to adjust and keep the standard 10-minute block verification
    time.


    Distributed Ledger


    It refers to the system of recording the distributed information in different
    devices. The crypto blockchain is a distributed ledger that tracks all transactions.


    Dumping


    It is a collective sell-off of large quantities of crypto that are sold in a short
    period of time.


    Dusting Attack


    The goal of this attack is to discover the true identity of the owner of a crypto
    wallet, which in turn can be utilized in a phishing scam.


    E


    Encryption


    It is the process that combines plaintext or document with the ‘key’ or a shorter
    string of data to create a ciphertext (output). Anyone who got the key can decrypt
    the output back.


    Emission


    The speed of the production and release of new crypto coins.


    F


    FOMO


    FOMO stands for ‘fear of missing out’ where traders buy or sell crypto to gain
    profit during a bull period.


    FUD


    It is the acronym for ‘Fear, Uncertainty, and Doubt.’ This strategy aims to influence
    the traders’ perception of a crypto market or a specific coin by spreading false,
    misleading, or negative information.


    Fiat On-Ramp


    It is one way to get crypto coins from fiat currency.


    Fiat-Pegged Crypto


    It is an asset, coin, or token on a blockchain that is connected to a bank-issued
    currency.


    Fish


    It refers to the person with a small cryptocurrency investment.


    Futures


    They are standardized legal agreements to sell or buy a certain asset at a specified
    time and price in the future.


    G


    Genesis Block


    It is the initial data block that is computed in the blockchain network.


    Gems


    The term ‘gem’ is used to describe unknown low-cap crypto coins that are undervalued
    but have great potential


    Governance Token


    It is a token that represents a voting right to influence the crypto ecosystem.


    ––––––––


    ![image](d2d_images/scene_break.png)


    H


    HASH


    Hash refers to the function that accepts input and generates an alphanumeric string
    output called ‘digital fingerprint’ or ‘hash value’. Each block in the crypto
    network has a hash value that validates the transaction.


    Hashing


    Hashing refers to the mining process that uses cryptographic hash functions to
    solve mathematical problems.


    Halving


    Halving is an event that impacts the supply and demands of mined cryptocurrencies
    like Bitcoin and Ethereum. It is basically the process of halving the mining incentives
    after a certain number of blocks is achieved.


    Hybrid Consensus Model


    The Hybrid Consensus Model uses both Proof of Work (PoW) and Proof of Stake (PoS)
    consensus. This mechanism brings balanced network governance by allowing blocks
    to be validated by miners and voters (stakeholders.)


    Honeyminer


    It is a crypto mining app that users can download on multiple devices.


    In-the-Money/Out-of-the-Money


    They are two trading mechanisms that give options to investors to use and harness
    the benefits of additional tools.


    I


    Infinite Mint Attack


    It occurs when a hacker or an unwanted person mints a great number of tokens within
    the network’s protocols.


    Initial Dex Offering (IDX)


    An IDX or initial dex offering is an option used by companies instead of an initial
    coin offering (ICO).


    ––––––––


    ![image](d2d_images/scene_break.png)


    INITIAL EXCHANGE OFFERING


    It is a form of crowdfunding that start-ups in crypto generate funds by listing
    in the exchange.


    Initial Token Offering (ITO)


    An ITO is like an ICO but offers tokens that hold intrinsic utility value (either
    through usage or software in the ecosystem).


    Instamine


    It is a term used to describe the distribution of a large portion of crypto right
    after its public launch.


    Intrinsic Value


    In cryptocurrency, the asset’s intrinsic value refers to its actual worth that
    is determined by a financial calculation instead of its present price.


    ––––––––


    ![image](d2d_images/scene_break.png)


    J


    JOMO


    It stands for ‘Joy of Missing Out,’ which is the opposite of FOMO (fear of missing
    out).


    K


    Kimchi Premium


    It is a phenomenon that makes the valuation in South Korean exchanges appear higher
    compared to other global crypto exchanges.


    L


    Ledger


    It is the record of financial transactions that can only be appended when there
    are new transactions in the blockchain network. It cannot be changed or edited.


    Light Node


    It is a downloaded wallet that is connected to full nodes. It further validates
    the stored information on the blockchain.


    Liquidity


    It is the term used to signify how easily a coin or token can be sold or purchased
    without influencing the overall prices in the market.


    M


    Malware


    Malware is malicious software or harmful computer program that can compromise
    the operations of a server, network, or computer.


    Margin Call


    The value of the investor account is less than the margin maintenance amount.


    Market cap


    Market capitalization or market cap is the total capitalization of the coin or
    token’s price. It is used to rank the crypto’s relative size.


    Mempool


    It is a collection of unconfirmed transactions in the node.


    Merkle Tree


    It is a cryptography tree structure where each leaf node is labeled with the data
    block hash while the non-leaf node has the hash of the label’s child nodes. It
    helps in the secure and efficient verification of the blockchain content by propagating
    the change upward toward the top hash.


    Mining Difficulty


    It refers to the difficulty of finding the next block’s right hash.


    Mining Farm


    When a group of crypto miners work together for a purpose or achieve a goal like
    energy use.


    ––––––––


    ![image](d2d_images/scene_break.png)


    MINING REWARD


    It is a reward that miners get for mining a new block.


    Mining rig


    It refers to the equipment that miners use for mining crypto.


    Moon


    It is a situation that displays an ongoing upward movement of the crypto price.


    N


    Network


    It is the nodes in the blockchain that work to process and validate transactions.


    Nodes


    Nodes are computers that connect the crypto network. The nodes work to relay and
    validate transactions while keeping the blockchain copy. There are two types of
    nodes:


    *   Full node – A computer that can fully download blockchain’s complete data
    and fully validate crypto transactions.


    *   Lightweight node – This type of computer uses a different process of validation
    and cannot download the entire data of the network.


    O


    Open Source


    It is a concept where participants believe in an open and free sharing of information
    for the greater common good.


    Option


    It is a contract that gives the traders the right (not an obligation) to buy or
    sell the underlying instrument or asset at a strike price.


    Oracle


    In the blockchain network, the oracle refers to the machine or human that relays
    the data to the smart contract, which in turn verifies the outcome of an event.


    P


    P2P


    Peer-to-peer or decentralized interactions of two parties in the blockchain.


    Permissioned Ledger


    A permissioned ledger is owned by one person or group of people. Any access to
    the network or ledger is given by the owners. Permissioned ledgers run faster
    and are easier to maintain compared to public blockchains. The data of this type
    of ledger is highly verifiable and accessible to all parties.


    Ponzi Scheme


    It is a fraudulent investment strategy that promises returns to investors from
    funds that new investors contribute.


    Private Blockchain'
