  trans: '


    # 金融市场中的关键参与者是谁？


    希望进行高效资本和资产配置的投资者。关注 `cryptocurrency` 等资产类别并对其未来价值进行方向性投注的投机者。


    `brokers`（经纪人）是连接资产买卖双方的中间介机构。


    `arbitrageurs`（套利者）寻找异常或定价错误，并能找到方法从中获利。


    `hedgers`（对冲者）利用衍生品市场来缓解不同类型的风险。


    | ![image](img/chapter_title_corner_decoration_left.png) || || ![image](img/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |


    ![image](img/chapter_title_above.png)


    # 第 4 章


    ![image](img/chapter_title_below.png)


    ## 交易准备


    加密货币交易具有波动性和不可预测的元素，因此制定一个能够指导你做出明智决策的交易计划至关重要。你还需要一个有效的交易策略或策略组合来实现你的目标。拥有一个智能计划并执行你选择的交易策略，有助于你判断何时止损、何时获利、在哪个市场交易，或在哪里寻找其他增长机会。


    ![image](img/image053.png)


    ### 概览


    ✓ 什么是交易计划？

    ✓ 你需要交易计划吗？

    ✓ 如何创建一个稳健且胜出的交易计划？

    ✓ 常见问题


    ––––––––


    ![image](img/scene_break.png)


    ## 什么是交易计划？


    交易计划是你全面的交易工具。它是一份指导你何时交易、交易多少以及交易什么的个人计划。它是你通往成功的加密货币交易或任何你想要尝试的交易模式的路线图。


    该计划是一份经过充分研究且系统化的书面文档。它可以根据你的目标、预期、策略和其他参数进行定制。它概述了寻找机会和执行交易的方法、交易哪些证券、你的仓位大小、如何管理仓位，以及何时交易或何时不交易的规则。


    交易计划可能包括以下内容：


    * 你交易加密货币的动机或理由

    * 你的目标和财务目标

    * 你的时间投入

    * 你的风险承受能力或对风险的态度水平

    * 你的个人风险管理规则

    * 你的可用资金

    * 你的策略

    * 你选择的交易市场

    * 记录方法（交易日志）


    ### 你需要交易计划吗？


    答案是肯定的，“需要！”


    你的交易计划清晰地定义了你的交易参数，帮助你做出逻辑决策，例如何时交易或何时止损。在交易市场的狂热时刻（例如当牛趋势发生时），你的交易计划可以帮助你避免非理性的行为。


    拥有交易计划的其他益处是：


    * 它让交易变得简单 —— 你已经完成了所有的规划和研究，因此你只需要根据你的交易参数交易加密货币即可。

    * 它促进了更好的纪律 —— 交易充满了增长机会，但并非所有良好的前景都能带给你理想的优势，并可能导致灾难性事件，如在一次操作中损失所有加密货币。交易计划能帮助你坚持目标。

    * 它提供了改进空间 —— 通过回顾你的交易日志，你可以从中学习。


    ### 如何创建一个稳健且胜出的交易计划？


    ––––––––


    ![image](img/scene_break.png)


    ## 你需要执行的关键步骤：


    #### 第 1 步：概述你的动机

    你为什么要加入交易？


    #### 第 2 步：定义你的目标

    你想实现什么？你应该制定 SMART（具体的、可衡量的、可实现的、相关的有时间的）目标。


    #### 第 3 步：了解你的交易风格

    这也取决于你将使用的交易类型。主要风格回顾：


    * `Day trading`（日内交易）：在当天内开关闭交易。

    * `Position trading`（趋势交易）：持有仓位几周、几个月或几年。

    * `Scalping`（剥线交易）：每天进行多次交易，持续几分钟或几秒钟。

    * `Swing trading`（波段交易）：持有几天几天周并利用价格波动。


    #### 第 4 步：设置你的风险收益比

    在交易中，你可能会失败多次，但仍然可以获得持续利润。关键在于设置风险收益比。你每笔交易愿意承担多少风险？设置风险水平很重要。它应该处于整个投资组合的 1%
    到 5% 之间。


    #### 第 5 步：决定你的交易资金金额

    你的资金应该是你在最坏交易情况下愿意损失的金额。切记不要冒超过你承受能力或你的养老金的风险。


