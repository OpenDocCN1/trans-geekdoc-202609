  trans: "\n\nDeFi 钱包具有可以帮助您将收益提高高达 20 倍的功能。Crypto.com 钱包存储您的私钥和加密货币。它让你对自己的资产和持仓拥有完全控制权。\n\
    \n此钱包提供 12/18/24 个单词恢复助词，帮助您导入当前的钱包。在安全性方面，这种创新的钱包使用 `Secure Enclave` 在您的手机或电脑上本地加密私钥。\n\
    \n它还使用了 `2-Factor Authentication`（双重身份验证）和生物识别认证。\n\n## 用户友好钱包：Jaxx\n\nJaxx 钱包拥有用户好的界面，文字清晰，颜色悦快，并且查看所有交易历史的方法非常方便。\n\
    \n它非常适合初学者和经验丰富的用户，他们喜欢诸如 `QR scanning`、访问私钥和种子助词、内部加密货币交易所、多币设施以及跨平台配对等方便功能。\n\
    \nJaxx 钱包免费下载，并提供三种完成交易的选项，费用不同且直接支付给区块链矿工。\n\n## 机构和高净值人士的托管存储\n\n某些交易所专门为高净值人士\
    \ (HNWI) 和机构提供托管服务。\n\n迎合行业大玩家的顶级交易所有：\n\n* ✓ `Coinbase` – `Coinbase Custody`\
    \ 通过将加密资产存储在隔离冷钱包中来进行托管。为了确保透明度，会定期进行审计。同时也提供资金转账服务，客户支持随时可用。\n* ✓ `Gemini` –\
    \ 它对虚拟资产有两种托管方式。一种是 `Deposit Custody`（存款托管），即在冷存储中存储用户资金的默认账户。另一种是针对机构对冲的 `Segregated\
    \ Custody Account`。\n* ✓ `itBit` – 它提供机构托管服务，允许客户随时获取并验证其资产报告。资产存储在冷存储中并隔离。它还提供\
    \ 24/7 支持。\n* ✓ `BitGo` – `BitGo Cryptocurrency Wallet` 是第一个专为机构投资者设计的 `multiSig`（多签名）热钱包。钱包平台将您的加密货币整合到您的投资组合中，让您可以安全方便地转移资金。\n\
    \n它具有先进的安全配置和多用户策略控制。BitGo 提供 `BitGo Custody`、`BitGo Business Wallet` 和 `BitGo\
    \ Pay As You Go` 选项以匹配您的需求。\n\n## 常见问题 (FAQs)\n\n### 哪种钱包最适合你的山币？\n\n没有所谓的最佳钱包。这完全取决于你拥有加密货币的目的。对于希望购买各种货币和代币的初学者来说，最佳选择是\
    \ `Coinbase` 和 `Gemini` 钱包。\n\n### 有必要拥有加密钱包吗？\n\n如果你已经在交易所钱包，则不是必须拥有独立的加密钱包。然而，获取一个钱包来存储大部分资产将使它们免受潜在风险。\n\
    \n### 如何获取加密钱包？\n\n获取加密钱包有多种，包括使用交易所内置的钱包。\n\n### 软件钱包相比硬件钱包最大的优势是什么？\n\n软件钱包像银行应用程序一样工作，允许你通过智能手机或桌面电脑访问账户。\n\
