- raw: 'There is always a maker or a taker on the spot market. There are takers and
    markers for buy and sell orders. All the orders of traders can be viewed on the
    ledger or order book of the exchange. The platform has an automatic feature that
    matches purchase orders with existing sell orders.


    *   Derivatives market


    The derivatives are financial instruments with an underlying value that is based
    on the cryptocurrency’s current value. They include contracts for difference (CFDs),
    options contracts, futures contracts, token swaps, and leveraged tokens.


    *   The option contracts give traders the authority, but not an obligation, to
    sell or buy assets at a certain price in the future.


    *   Future contracts allow crypto traders to speculate on the asset’s future price.
    They are agreements by two parties to sell the assets on the expiry date at the
    last trading price. Moreover, the contract settlement is predetermined. It’s either
    cash-settled or the underlying asset is physically delivered to the trader. 


    *   Leveraged tokens are tradable financial instruments. They offer leveraged
    exposure without the need to secure a leveraged position. Traders who prefer to
    use them would not be constantly worrying about funding, liquidation, margin,
    or collateral. These innovative products in the form of tokens derive values from
    perpetual futures positions.


    *   Contract for difference (CFD) is a financial contract that allows traders
    to get the difference between the entry price and closing price. So, when the
    exit price is higher than the entry price, the seller of the crypto pays the buyer
    the difference. If the closing price is lower than the opening price, the seller
    gains profits.


    Understanding cryptocurrency exchanges


    Crypto market is commonly referred to as a cryptocurrency exchange or online platform
    that facilitates the trading of crypto to crypto or crypto to fiat currency/digital
    asset. Many crypto exchanges are trading globally and offering hundreds of available
    coins and tokens. They also have electronic wallets for those who engage in active
    trading.


    Some exchanges are owned by brokers who act as an intermediary between the buyers
    and sellers of the cryptocurrency.  Brokers earn through transaction fees and
    commissions.


    Types of crypto exchange:


    1.Centralized cryptocurrency exchange


    They are operated by companies and are more reliable. Statistics reveal that about
    99% of traders choose to transact business through centralized exchanges. The
    top exchanges based on trading volumes, traffic, and liquidity are Binance, Huobi
    Global, Coinbase, Kraken, and Bithumb.


    Pros:


    *   Reliability – They have a developed and centralized platform that facilitates
    trading and transactions, offering more security and reliability.


    *   User-friendly – They work best for beginners because of their easy to navigate
    platform interface where traders check their accounts and balances or make transactions
    whenever they log in.


    Cons:


    *   Transaction fee – Traders pay a certain amount for the services rendered and
    convenience. The cost of the transaction fee depends on the amounts of crypto
    being traded.


    *   Hacking risk – Centralized exchanges usually hold a great number of cryptocurrencies,
    which makes them a lucrative target for large-scale theft and hacking.


    2\. Decentralized cryptocurrency exchanges (DEX)


    This type of exchange involves peer-to-peer transactions. There is no intermediary
    or a third party so traders do not pay transaction fees. The top DEXs are Uniswap
    (V2), Tokenlon, io, Blocknet, and AirSwap.


    Pros:


    *   Anonymity – Traders are not required to provide personal information, which
    keeps the transactions between the seller and buyer anonymous and private.


    *   No hacking risk – There is no transfer of assets via a third party, so the
    risk of being hacked is zero.


    *   No market manipulation – Due to the nature of transactions, there is no market
    manipulation. This protects traders from wash trading and fake trading.


    Cons:


    *   No fiat payment – Decentralized exchanges require traders to pay crypto for
    another crypto. This is inconvenient for beginners who want to pay fiat currency.


    *   Complexity – Traders who use this kind of exchange should familiarize themselves
    with the trading process and the platform. It is also important to memorize the
    password or keys to their digital wallets and have a backup to prevent losing
    their coins forever.


    *   Lack of liquidity – Since most crypto transactions are done in centralized
    exchanges, the decentralized exchanges experience low trading volumes that lead
    to a lack of liquidity. When trading volume is low, there are not enough buyers
    or sellers of the cryptocurrency.


    ![image](d2d_images/image032.png)


    Trivia


    The global blockchain market would be


    worth $20 billion by 2024.


    Key factors that influence the crypto market prices


    There is a market when demand meets supply or vice-versa. The market prices rely
    heavily on demand and supply. They are also highly sensitive to speculations and
    potential moves of buyers. In essence, the assets’ prices are decided by the sellers
    and buyers. They hold their value because traders and investors say they do.


    *   Supply and demand


    As a unit of exchange, the bottom line of cryptocurrency is trading. The price
    soars when more people set their intention to buy a cryptocurrency and more sellers
    are willing to sell.


    On the other hand, the price goes down when there are more sellers but buyers
    are not willing to purchase.


    *   Market capitalization


    It is the value of all circulating or existing crypto coins and how traders/investors
    perceive their growth rate.


    *   Integration


    It displays the easy integration of cryptocurrency into the e-commerce payment
    system and other existing infrastructure.


    *   Endorsements


    When notable personalities, economic experts, or celebrities positively endorse
    certain crypto, it can cause a hike in prices as investors and traders begin to
    accumulate them to ride with the tide. But remember that there is a thing called
    disguised advertisements.


    They are endorsements used to generate a temporary demand but leave the investors
    with coins that only promise immediate returns.


    *   Press/Media


    It refers to the way cryptocurrencies are portrayed in media channels and the
    amount of coverage they get. News stories or rumors about the potential ban of
    crypto or central bank control can cause price movements.


    *   Key events


    It includes major events like economic setbacks, security breaches, attacks on
    exchanges that reveal security flaws, and regulatory updates.


    *   Disagreements in cryptocurrency communities


    This pertains to issues over upgrades like when a certain cryptocurrency goes
    through a hard fork.


    ![image](d2d_images/image063.png)Market trends


    Market trends refer to the perceived direction of movement of any kind of financial
    market within a certain period.  They are identified in technical analysis with
    the help of trend lines, price action, or key moving averages. One peculiar characteristic
    of market trends is that traders believe that they have accurately determined
    or predicted the future event in hindsight. However, hindsight bias can produce
    a key impact on identifying market trends as well as making trading decisions.


    The primary market trends are the bull and bear markets. The bull market symbolizes
    the increasing trend in the financial market or sustained uptrend, while the bear
    market means a declining market or sustained downtrend.


    Each market trend can last from 1-3 years. It is important to remember that market
    trends do not entirely mean that the price is going in the given direction. A
    prolonged bear market has some smaller bear trends within the period and vice
    versa.


    ––––––––


