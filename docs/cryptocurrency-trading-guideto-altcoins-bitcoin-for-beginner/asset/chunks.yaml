    你需要理解止损可以是`止损市价单`（stop-market order）或`止损限价单`（stop-limit order）。虽然它们不同，但如果你需要，两者都可以使用。然而，你需要记住，`止损限价单`只有在达到验证点或更好时才会执行，而在市场崩盘时不会执行。


    如果你的止损价与价格下跌时的止损价相同，它将偏离设定价格并导致订单无法成交。为了确保在这些极端条件下达到限价时能够退出市场，请选择`止损市价单`。


    ### 存储


    在进行交易时，了解在何时以及如何存储加密货币是另一个重要因素，尤其是当涉及巨额时。经验法是留出一笔在情况恶化时你乐意损失的交易资金。永远不要将你的储蓄或其他投资用于交易目的，无论是涉及加密货币还是传统资产。


    寻找一个信赖的经纪交易所也关关，因为你的投资将由他们托管，这增加了风险，且更容易受到诈骗者的攻击。为了确保对数字资产的完全控制和安全，最好是将它们存储在硬件钱包中。


    另一个选择是选择一个信赖的软件钱包，你可以通过私钥从智能手机、笔记本电脑、iPad 或桌面轻松访问。然而，由于交易涉及互联网连接，你需要更严密的安全措施来防止网盗或黑客攻击。


    ![image](img/image013.png) 你知道吗？


    中本聪（Satoshi Nakamoto）是一个长期持有者（HODLer）。根据 Sergio Demian Lerner 的说法，有一个钱包拥有超过一百万个
    BTC。这些币一直未被触碰，Lerner 认为中本聪拥有它们。


    ––––––


    ![image](img/scene_break.png)


    ## 加密货币交易的基本步骤


    #### 第一步：选择加密货币经纪或交易所


    像法币交易一样，你需要一个交易加密货币的地方。每个加密交易所都有其服务条款和交易方式。热门交易所包括 `Coinbase`、`Binance`（币安）、`Bitstamp`、`Bitfinex`、`CEX.io`、`Coinmama`、`eToro`、`GeminiKriptomat`
    和 `KuCoin`。


    对于初学者，最好选择一个提供多种加密货币并具有良好界面的交易所。某些交易所不接受法币作为支付，所以你必须先购买加密货币来购买其他币。


    #### 第二步：创建账户


    要注册成为用户并开始交易，你需要创建一个账户。这将要求提供个人信息，如出生日期、电子邮件地址、家庭地址和社安号码。


    #### 第三步：选择加密钱包


    你可以选择将加密货币存储在软件钱包或硬件钱包中。两者之间，硬件更安全，因为它是一个物理设备，你可以插入电脑并离线使用。


    对于软件钱包，Android、iOS 和 Google Chrome 上有几个免费选项。大多数加密货币都带有官方钱包，如 `Bitcoin Core Wallet`、`MyEtherWallet`
    或 `Ethereum Wallet`、`Dash Core` 或 `Litecoin-QT`。交易所和经纪商也内置了钱包，如 `Coinbase` 和 `Poloniex`。


    如果你想使用不同类型的加密货币进行投资/交易，也可以找到多币种钱包。例如：


    *   `Coinomi` 允许你与 64 种加密货币进行交易

    *   `Jaxx Wallet` 支持 `Bitcoin`、`Bitcoin Cash`、`Ethereum`、`Dash`、`Litecoin`、`Ethereum
    Classic`、`Zcash` 等

    *   `Exodus` 可用于发送和存储 `Bitcoin`、`Bitcoin Cash`、`Litecoin`、`Ethereum Classic`、`Ethereum`
    等


    #### 第四步：为你的加密账户或钱包注金


    一旦你在加密交易所的账户获得批准，你就可以连接银行账户来注金。你有使用电汇转账或借记卡的选项。


    #### 第五步：选择你的加密货币


    一旦你在加密交易所的账户获得批准，你就可以通过连接银行账户来注金。你有使用电汇转账或借记卡的选项。


    #### 第六步：通过技术降低风险并增加收益


