- raw: 'Coinbase has a separate wallet service that is available in iOS, Android,
    and web browsers.  The wallet was originally named Toshi before it became Coinbase
    Wallet. It was initially developed for Ethereum use and to have an interface that
    helps users to access DApps (decentralized applications).


    Currently, the Coinbase wallet is one of the most trusted wallets in the crypto
    world. With millions of users across over 100 countries, this software wallet
    offers a higher level of security.


    ––––––––


    ![image](d2d_images/scene_break.png)


    IT HAS TWO TYPES- THE Standard Wallet which stores small numbers of cryptocurrencies
    and the Coinbase Vault which is ideal for storing a large number of coins and
    tokens. In addition, the Coinbase Vault offers two options- Group Vault and Individual
    Vault.


