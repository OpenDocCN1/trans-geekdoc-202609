    # 第五章


    ![image](img/chapter_title_below.png)


    ## 开启一切的加密货币：比特币


    `Bitcoin`（符号为“₿”）通常被称为互联网货币。它的缩写为 `XBT` 或 `BTC`。它既是一种技术也是一种虚拟货币，像数字现金一样用于商品或服务的交换。无论性别、宗教、种族或政治信仰，比特币对所有人开放。


    从价值的背景来看，由于其网络的稳定性，它是加密货币领域无可争议的王者。这种电子现金系统在金融市场的起伏中证明了它自己的价值。直到今天，它在没有任何中央机构干预的情况下，保持着其独立性。


    比特币的多功能性引起了私营公司和个人的兴趣，他们正在寻找增加财富和被动收入的盈利方法。


    作为先驱，比特币激发了随后加密货币领域新玩家的爆发式增长，创造了庞大的分支产品和用户群体。


    在人气、用户群和市值方面，比特币是加密世界的领军者。它不仅是趋势的引领者，更是加密货币的标准。它占据了加密市场的一半，并维持着其作为加密交易中最受青工具的地位。它的历史描述了一系列指数级增长和盈利能力，让许多投资者和交易员在拥有比特币短短几年内就成为了百万富翁。


    ![image](img/image049.png)


    ### 概览


    ✓ 比特币的历史回顾

    ✓ 成长阵痛

    ✓ 比特币的价值

    ✓ 比特币的分类

    ✓ 比特币交易

    ✓ 交易比特币的理由

    ✓ 你应该注意的风险

    ✓ 你准备好交易比特币了吗？

    ✓ 最佳比特币交易策略

    ✓ 高级交易者的流行交易风格

    ✓ 常见问题 (FAQs)


    ––––––––


    ![image](img/scene_break.png)


    ### 比特币的历史


    比特币是在许多尝试使用密码学创建数字货币后，第一个成功的成就，密码学是生成和破解代码的科学。它是 `Satoshi Nakamoto` 的结晶，他的真实身份直到现在仍然是一个巨大的谜。与比特币一起，他还开发了
    `blockchain` 数据库。


    1 月 3 日，“创世纪区块”或 `Block O` 被开挖。这是比特币历史上第一个被开出的区块。中本于 2009 年 1 月 8 日通过 `Cryptography
    Mailing List` 向公众公布了第一个比特币软件版本。2009 年 1 月 9 日，随着 `Block 1` 的产生，比特币的正式开挖开始。


    现实世界中的第一笔比特币交易发生在 2010 年 5 月 22 日，当时程序员 `Laszlo Hanyecz` 在佛罗里达州的杰克逊逊购买了价值 10,000
    `BTC` 的两个披萨披萨。回到今天，该金额价值已超过 6 亿美元。


    ### 成长阵痛


    对于这种革命性的货币来说，通往巅峰之路并不容易。它需要开辟自己的道路。


    正如所预期的，许多人对其寿命和成功表示怀疑。许多投资者和交易者愿意为一个行业中的新玩家赌注，特别是因为加密货币仍然很新，尚未在金融市场证明其稳定性和信誉。


    ![image](img/image067.png) 自从诞生以来，比特币经历了显著的波动、剧烈的崩溃和上升趋势的增长。它最近的高点出现在 2021 年 3
    月，当时比特币的价格达到了 61,683 美元。在它创建时，1 个 `BTC` 的价值为 0。


    它们有什么区别？


    `Bitcoin`（大写 B）指的是这个实体，而 `bitcoin`（小写 b）指的是数量。


    ––––––––


    ![image](img/scene_break.png)


    ### 比特币的真实价值


    比特币并非硬币，而是一种可以用于支付的数字资产。它是一种通过区块链技术交换的虚拟现象。


    ––––––––


    ![image](img/scene_break.png)


    ### 比特币的真实价值


    比特币的价值来自于其稀缺性和采用率。它没有政府背书，但有人们的信任。


