    它由创始人 Zooko Wilcox-O’Hearn 于 2016 年 10 月引入加密货币市场。ZCash 的货币符号为 `ZEC`。它的市值为 1,145,782,989
    美元，流通量超过 1,100 万美元。


    ![image](img/image052.png)


    ––––––––


    ![image](img/scene_break.png)


    Coin Price Forecast 预测，到 2030 年，ZCash 的市场价格将飙升至 449 美元。


