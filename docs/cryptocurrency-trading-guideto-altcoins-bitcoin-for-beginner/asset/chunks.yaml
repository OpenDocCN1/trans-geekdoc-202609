- raw: 'There is a continuing investor-driven demand for altcoins that significantly
    drive their value on the market. According to some market analysts, this investment
    trend works both ways- pushing the price up or plunging it down. It is up to the
    investors to speculate the direction of the altcoins. This short frenzy is also
    another indication to invest in altcoins, rather than trade and lose. Many altcoin
    traders are into long-term investment too, to diversify their strategies and holdings.


    As more and more investors understand the true financial potential of altcoins
    and their real-life applications, the demand for altcoin investment is now growing
    steadily. In addition, the lower market shares of altcoin and lower prices compared
    to Bitcoin makes the yielding potential more profitable.


    What are the risks of altcoin investing?


    The main stimulus of investing in altcoins is the premise of ‘room to grow’ and
    is generally cheaper than Bitcoin. In the context of being cheaper, investors
    should remember that it correlates with lower market capitalization compared to
    Bitcoin.


    In general, cryptocurrency is a volatile investment instrument. This encompasses
    all types of altcoins and tokens, including their big brother Bitcoin. There are
    many players in the market now and new types of altcoins are produced every day.
    Since there is no solid regulation about the creation of coins and tokens, the
    altcoin space is growing with alternative coins.


    Altcoins are now occupying more than 40% of the total market cap of cryptocurrency.
    This makes it nearly impossible to directly say which among the many options is
    the best altcoin.


    Another risk you have to consider is the lack of a regulatory body that governs
    altcoins. By being ‘unregulated’, there is a high possibility that you may lose
    your coins all at once and leave with nothing. You don’t know where your money
    goes when you buy altcoins.


    What you have in your digital wallet are numbers that represent the value of your
    investment and the guarantee that your invested fund is earning profits.


    These risks should not be ignored and must be taken into consideration. Studying
    the security components and other risk-mitigating measures of the crypto exchange
    is very important to ensure that your holdings will be safe.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ![image](d2d_images/image023.png)


    Guide questions that can help you decide to invest in altcoins


    *   Who are the people issuing and sponsoring it? What is their financial and
    technical background? How do they make money out of the transactions?


    *   What are your rights as an investor?


    *   When can you sell your investment? How can you sell it? What is the cost of
    selling it?


    *   Where is the invested fund going? How will they use it?


    *   What are the legal protections or safety nets that they offer in the event
    of malware, hack, or fraud attack?


    *   Who will refund your money when something happens? In case your rights are
    violated, are there adequate funds to commensurate you?


    *   Are they being audited on a regular basis? Who audits them?


    *   Do they issue financial statements?


    ––––––––


    ![image](d2d_images/scene_break.png)


    WHY ARE MORE INVESTORS choosing altcoins?


    Altcoins quashed the Bitcoin monopoly of the crypto market, becoming optional
    coins for people who want to explore other investment tools. The altcoins rapid
    growth is due to their unique features which include having full blockchain technology,
    authenticity, and practical use in the market.


    Altcoins cost less compared to Bitcoin, making them the perfect instruments for
    those who are still discovering the beauty of investment. Without paying the astronomical
    price, the promise of reaping huge rewards makes altcoins very attractive to financial-savvy
    individuals.


    Other reasons are:


    *   Altcoins grow fast


    The rapid growth of altcoins gives pioneering investors a significant ROI.


    *   Institutions and large companies start buying altcoins


    Ethereum, considered the second-largest crypto asset, is becoming the favorite
    of institutions and firms. In April, digital asset management company Coinshares
    reported that major institutions bought over $30 million worth of Ethereum. This
    brings the total holdings of institutional investors to $13.9 billion. Grayscale
    Investment Trust has also invested $1.5 billion in various altcoins including
    ETH.


    *   The price surges of altcoins are higher


    Altcoin prices can surge more than the 20% market, depending on the uptrend factors.
    Moreover, DeFi trends are beginning to influence the altcoin market directly because
    investors can see their higher economic growth rate.


    *   Altcoins are supported by reliable and popular exchanges


    Platforms with high liquidity and offers a wide range of altcoins like Binance,
    Coinbase, and Kraken prove the trustworthiness of the coins and tokens. Also,
    altcoins can be traded as Bitcoin pairs and purchased using fiat currencies.


    *   Altcoins are legitimate coins for trading, hence good for investment


    With the testimonies of people who profit in trading altcoins, the hesitancy to
    invest in them is becoming low.


    *   Retail merchants and commercial businesses are now accepting altcoin payments


    Aside from Bitcoin, the two altcoins that businesses accept as a form of payment
    are Litecoin and Ethereum.


    ![image](d2d_images/image001.png)


    Did you know that?


    Ethereum was proposed by Vitalik Buterin,


    a crypto programmer


    In 2013. During that time, he was only


    19 years old.


    Risks and Opportunities


    The altcoins’ market is not yet mature at this point in time and everyone is still
    speculating on the future of cryptocurrencies. But the growing interest of people
    in altcoins and the proliferation of crypto exchanges/brokers is a manifestation
    that those with sufficient market liquidity will stay.


    For those who are willing to take risks and discover the potentials of altcoins,
    understanding the risks and opportunities that it gives is important.


    Opportunities


    *   Altcoins are regarded as the ‘enhanced versions’ of Bitcoin because they are
    created to provide the bitcoin’s shortcomings


    *   Altcoins offer a wide selection of coins and tokens that delivers different
    functions


    *   Stablecoins, which are one type of altcoins, have the potential to fulfill
    the goal of Bitcoin as an acceptable medium for everyday transactions


    *   Several altcoins like XRP and Ether are trusted by mainstream institutions,
    gaining great traction and high valuations


    *   Higher risks can equate to higher rewards (with a big ‘IF”)


    *   Allows investors to get in early on projects that can immensely grow and gives
    100x ROIs in just a matter of months


    Risks


    *   Compared to Bitcoin, altcoins’ investment market is smaller


    *   The smaller market capitalization and lower trading volumes make altcoins
    more susceptible to pump and dumps


    *   The variety of altcoins in the market makes it difficult to make a decision
    which is the best one


    *   Altcoins are impacted by the price of Bitcoin and momentum


    *   The lack of defined investment criteria and metrics as well as the absence
    of regulation give altcoins thinner liquidity and a lesser number of investors


    *   Altcoins are easily manipulated by bag holders and whale (big) investors


    *   A long term investment is incredibly risky because some altcoins lose their
    value as time passes by


    *   The reality of ‘dead’ altcoins that sunk the investors’ money


    Is your crypto dead?


    Knowing that dead coins exist in the realm of crypto space helps investors make
    calculated and informed decisions. The tempting illusion of profitable crypto
    projects is constant and it is up to you to conduct extensive background checks
    on the projects. It is important to check their availability on major and trusted
    exchanges, their profit statements, and their trading volumes.'
  fmt: '

    There is a continuing investor-driven demand for altcoins that significantly drive
    their value on the market. According to some market analysts, this investment
    trend works both ways- pushing the price up or plunging it down. It is up to the
    investors to speculate the direction of the altcoins. This short frenzy is also
    another indication to invest in altcoins, rather than trade and lose. Many altcoin
    traders are into long-term investment too, to diversify their strategies and holdings.


    As more and more investors understand the true financial potential of altcoins
    and their real-life applications, the demand for altcoin investment is now growing
    steadily. In addition, the lower market shares of altcoin and lower prices compared
    to Bitcoin makes the yielding potential more profitable.


    ## What are the risks of altcoin investing?


    The main stimulus of investing in altcoins is the premise of ‘room to grow’ and
    is generally cheaper than Bitcoin. In the context of being cheaper, investors
    should remember that it correlates with lower market capitalization compared to
    Bitcoin.


    In general, cryptocurrency is a volatile investment instrument. This encompasses
    all types of altcoins and tokens, including their big brother Bitcoin. There are
    many players in the market now and new types of altcoins are produced every day.
    Since there is no solid regulation about the creation of coins and tokens, the
    altcoin space is growing with alternative coins.


    Altcoins are now occupying more than 40% of the total market cap of cryptocurrency.
    This makes it nearly impossible to directly say which among the many options is
    the best altcoin.


    Another risk you have to consider is the lack of a regulatory body that governs
    altcoins. By being ‘unregulated’, there is a high possibility that you may lose
    your coins all at once and leave with nothing. You don’t know where your money
    goes when you buy altcoins.


    What you have in your digital wallet are numbers that represent the value of your
    investment and the guarantee that your invested fund is earning profits.


    These risks should not be ignored and must be taken into consideration. Studying
    the security components and other risk-mitigating measures of the crypto exchange
    is very important to ensure that your holdings will be safe.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ![image](d2d_images/image023.png)


    ## Guide questions that can help you decide to invest in altcoins


    - Who are the people issuing and sponsoring it? What is their financial and technical
    background? How do they make money out of the transactions?

    - What are your rights as an investor?

    - When can you sell your investment? How can you sell it? What is the cost of
    selling it?

    - Where is the invested fund going? How will they use it?

    - What are the legal protections or safety nets that they offer in the event of
    malware, hack, or fraud attack?

    - Who will refund your money when something happens? In case your rights are violated,
    are there adequate funds to commensurate you?

    - Are they being audited on a regular basis? Who audits them?

    - Do they issue financial statements?


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## WHY ARE MORE INVESTORS choosing altcoins?


    Altcoins quashed the Bitcoin monopoly of the crypto market, becoming optional
    coins for people who want to explore other investment tools. The altcoins rapid
    growth is due to their unique features which include having full blockchain technology,
    authenticity, and practical use in the market.


    Altcoins cost less compared to Bitcoin, making them the perfect instruments for
    those who are still discovering the beauty of investment. Without paying the astronomical
    price, the promise of reaping huge rewards makes altcoins very attractive to financial-savvy
    individuals.


    Other reasons are:


    ### Altcoins grow fast

    The rapid growth of altcoins gives pioneering investors a significant `ROI`.


    ### Institutions and large companies start buying altcoins

    `Ethereum`, considered the second-largest crypto asset, is becoming the favorite
    of institutions and firms. In April, digital asset management company `Coinshares`
    reported that major institutions bought over $30 million worth of `Ethereum`.
    This brings the total holdings of institutional investors to $13.9 billion. `Grayscale
    Investment Trust` has also invested $1.5 billion in various altcoins including
    `ETH`.


    ### The price surges of altcoins are higher

    Altcoin prices can surge more than the 20% market, depending on the uptrend factors.
    Moreover, `DeFi` trends are beginning to influence the altcoin market directly
    because investors can see their higher economic growth rate.


    ### Altcoins are supported by reliable and popular exchanges

    Platforms with high liquidity and offers a wide range of altcoins like `Binance`,
    `Coinbase`, and `Kraken` prove the trustworthiness of the coins and tokens. Also,
    altcoins can be traded as `Bitcoin` pairs and purchased using fiat currencies.


    ### Altcoins are legitimate coins for trading, hence good for investment

    With the testimonies of people who profit in trading altcoins, the hesitancy to
    invest in them is becoming low.


    ### Retail merchants and commercial businesses are now accepting altcoin payments

    Aside from `Bitcoin`, the two altcoins that businesses accept as a form of payment
    are `Litecoin` and `Ethereum`.


    ![image](d2d_images/image001.png)


    ## Did you know that?


    `Ethereum` was proposed by Vitalik Buterin, a crypto programmer in 2013. During
    that time, he was only 19 years old.


    ## Risks and Opportunities


    The altcoins’ market is not yet mature at this point in time and everyone is still
    speculating on the future of cryptocurrencies. But the growing interest of people
    in altcoins and the proliferation of crypto exchanges/brokers is a manifestation
    that those with sufficient market liquidity will stay.


    For those who are willing to take risks and discover the potentials of altcoins,
    understanding the risks and opportunities that it gives is important.


    ### Opportunities

    - Altcoins are regarded as the ‘enhanced versions’ of `Bitcoin` because they are
    created to provide the bitcoin’s shortcomings

    - Altcoins offer a wide selection of coins and tokens that delivers different
    functions

    - `Stablecoins`, which are one type of altcoins, have the potential to fulfill
    the goal of `Bitcoin` as an acceptable medium for everyday transactions

    - Several altcoins like `XRP` and `Ether` are trusted by mainstream institutions,
    gaining great traction and high valuations

    - Higher risks can equate to higher rewards (with a big ‘IF”)

    - Allows investors to get in early on projects that can immensely grow and gives
    100x `ROIs` in just a matter of months


    ### Risks

    - Compared to `Bitcoin`, altcoins’ investment market is smaller

    - The smaller market capitalization and lower trading volumes make altcoins more
    susceptible to pump and dumps

    - The variety of altcoins in the market makes it difficult to make a decision
    which is the best one

    - Altcoins are impacted by the price of `Bitcoin` and momentum

    - The lack of defined investment criteria and metrics as well as the absence of
    regulation give altcoins thinner liquidity and a lesser number of investors

    - Altcoins are easily manipulated by bag holders and whale (big) investors

    - A long term investment is incredibly risky because some altcoins lose their
    value as time passes by

    - The reality of ‘dead’ altcoins that sunk the investors’ money


    ## Is your crypto dead?


    Knowing that dead coins exist in the realm of crypto space helps investors make
    calculated and informed decisions. The tempting illusion of profitable crypto
    projects is constant and it is up to you to conduct extensive background checks
    on the projects. It is important to check their availability on major and trusted
    exchanges, their profit statements, and their trading volumes.

    '
  trans: '

    对代币（altcoins）存在持续的投资者需求，这显著推动了它们在市场上的价值。根据一些市场分析师的说法，这种投资趋势是双向的——既可能推高价格，也可能使其暴跌。投机代币的走向取决于投资者。这种短暂的狂热也是投资代币的另一个信号，而不是盲目交易并亏损。许多代币交易者也热衷长期投资，以实现策略和持仓的多样化。


    随着越来越多的投资者理解代币真正的财务潜力和现实应用应用，对代币投资的需求正在稳步增长。此外，与比特币相比，代币的市场份额较低且价格较低，这使得收益潜力更具利润性。


    ## 投资代币的风险有哪些


    投资代币的主要动力源于“增长空间”这一前提，且通常比比特币便宜。在价格更便宜的背景下，投资者应该记住，这意味着与比特币相比，其市值较低。


    总来说，加密货币是一种高波动的投资工具。这包含了所有类型的代币和代币，包括其大哥比特币。现在市场上有许多参与者，每天都会产生新型代币。由于由于硬币和代币的创建没有可靠的监管，代币领域正随着替代币的不断成长。


    代币现在占据了加密货币总市值的 40% 以上。这使得几乎不可能直接判断在众多选择中哪一个是最好的代币。


    另一个你必须考虑的风险是缺乏监管代币的监管机构。由于“不受监管”，你极有可能一次性失去你所有的硬币且一无所获。当你购买代币时，你不知道你的钱流向了哪里。


    你在数字钱包中拥有的只是代表你投资价值的数字，以及你所投资资金正在获利的保证。


    这些风险不应被忽视，必须考虑在内。研究加密交易所的安全组件和其他风险缓解措施对于确保你的持仓安全非常重要。


    ––––––––


    ![image](img/scene_break.png)


    ![image](img/image023.png)


    ## 帮助你决定是否投资代币的引导性问题


    - 谁是这些发行和赞助它的人？他们的财务和技术背景是什么？他们如何通过交易获利？

    - 作为投资者，你拥有哪些权利？

    - 你可以什么时候卖出你的投资？如何卖出？卖出的成本是多少？

    - 投资资金流向了哪里？他们将如何使用？

    - 如果发生恶意软件、黑客攻击或欺诈攻击，他们提供了哪些法律保护或保障？

    - 发生事情时谁会退还你的钱？如果你的权利被侵犯，是否有足够的资金补偿你？

    - 他们是否定期接受审计？谁审计他们？

    - 他们是否发布财务报表？


    ––––––––


    ![image](img/scene_break.png)


    ## 为什么越来越多的投资者选择代币？


    代币打破了比特币对加密货币市场的垄断，成为想要探索其他投资工具的人的可选币。代币的快速增长归于它们独特的特征，包括拥有完整的区块链技术、真实性以及在市场中的实际用途。


    与比特币相比，代币成本较低，使其成为那些仍在发现投资之美的人的完美工具。无需支付天文数字的价格，获得巨额回报的承诺使代币对精通财务的人非常有吸引力。


    其他原因还有：


    ### 代币增长迅速

    代币的快速增长为先驱投资者带来了显著的 `ROI`（投资回报率）。


    ### 机构和公司开始购买代币

    `Ethereum` 被认为第二大加密资产，正成为机构和公司的青睐。4 月份，数字资产管理公司 `Coinshares` 报告，大型机构购买了价值 3000
    万美元的 `Ethereum`。这使得机构投资者的总持仓达到 139 亿美元。`Grayscale Investment` 也持有了 139 亿美元的代币。


    ### 代币增长迅速

    代币的快速增长为早期投资者提供了巨大的空间。


    ### 代币的价格可能会大幅飙升

    此外，`DeFi` 趋势开始影响代币市场。


    ### 代币受到可靠热门交易所的支持

    `Binance`、`Coinbase` 和 `Kraken` 等平台支持代币，且可以使用法币进行购买。


    ### 代币是交易的合法选择

    对于交易代币获利的人的证言，对投资它们的犹豫变得很低。


    ### 零售商和商业公司现在接受代币支付

    除了 `Bitcoin`，接受代币支付的两种代币是 `Litecoin` 和 `Ethereum`。


    ![image](img/image001.png)


    ## 你知道吗？


    `Ethereum` 是由 Vitalik Buterin 在 2013 年提出的，当时他只有 19 岁。


    ## 风险与机遇


    代币市场目前尚未成熟，所有人仍在推测加密货币的未来。但人们对代币日益增长的兴趣以及交易所的激增表明，资金将会留在。


    对于愿意承担风险并发现代币潜力的人来说，理解其提供的风险和机遇很重要。


    ### 机遇

    - 代币被视为 `Bitcoin` 的“增强版”，因为它们是为了解决比特币的缺点而创建的。

    - 代币提供了多种功能的选择。

    - `Stablecoins` 作为代币的一种类型，具有实现比特币作为日常交易接受媒介目标的潜力。

    - `XRP` 和 `Ether` 等代币得到了主流机构的信任，获得了巨大的关注和高估值。

    - 高风险等同于高回报（大“如果”）。

    - 允许投资者早期参与能够巨大增长并在几个月内提供百倍 `ROI` 回报的回项目。


    ### 风险

    - 与 `Bitcoin` 相比，代币的投资市场较小。

    - 较小的市值和较低的交易量使得代币更容易受到拉高出货（pump and dumps）。

    - 市场上代币的种类使得判断哪一个是最好的非常困难。

    - 代币受到 `Bitcoin` 价格趋势的影响。

    - 缺乏定义的投资标准和指标，以及缺乏监管，使得代币流动性较低，投资者也较少。

    - 代币很容易被持币者和大户投资者操纵。

    - 长期投资风险极大，因为某些代币会随着时间的推移而失去价值。

    - 导致投资者亏损的“死”代币的现实。


    ## 你的加密货币死了吗？


    了解加密领域存在死币有助于帮助投资者做出经过计算且明智的决策。盈利加密项目的诱人幻象一直存在，需要你对项目进行广泛的背景调查。检查它们在主要可靠交易所的可用性、财务报表和交易量是非常重要的。

    '
