  trans: '


    由于其稳定性，许多投资者倾向于购买 `Stablecoins`，以等待加密货币市场出现利好事件。它们也非常适合用于支付或在全球范围内的资金转账。


    `Stablecoins` 具有极高的可交易性和流动性。在您决定将其兑换另一种山寨币或 `Bitcoin` 之前，它们的价值不会发生变化。


    ## 基于挖矿


    基于挖矿的代币通过 `Proof-of-Work` (`PoW`) 方法创建。它们通过算法或解决复杂问题进行挖矿。`Litecoin`、`Zcash` 和
    `Monero` 都是基于挖矿的代币示例。


    此外还有预挖币，它们在加密货币市场上市之前就已经发行。`Ripple` 的 `XRP` 就是这类币的例子。


    ## 证券代币


    证券代币类似于传统的股票、债券、股权或衍生品，持有外部资产的可交易价值。这些数字代币保证了股息支付、股权或所有权。证券代币的价格随着时间的推移而增。它们通常通过
    `ICOs` 或初始币发行出售给交易者和投资者。


    从本质上说，它们是投资合同，代表了用户对特定数字或物理资产的法律所有权。


    所有权通过区块链内的网络进行验证。一旦完全验证，证券代币就可以交易成另一种类型的资产、存储在电子钱包中或作为贷款抵押品。


    证券代币的形式之一是证券化代币。它们通常由初创公司建立，并须遵守联邦法律的规定。它们通过 `Security Token Offering` (`STO`)
    向感兴趣的投资者提供。


    证券代币的示例包括 `Bcap` (`Blockchain Capital`、`Sia Funds` 和 `Science Blockchain`)。


    ## 实用型币


    实用型代币用于交换服务或兑换奖励。它们也被称为应用币或数字优惠券，拥有特殊折扣或对产品或服务的访问权限。


    它们是基于区块链的资产，由融资者或公司出售，用于购买其即将推出的产品或服务。


    实用型代币不具备内在价值也不支付股息。它们不被视为投资工具，也不受联邦法律合规限制。


    但实用型代币可以为持有者提供网络权利，帮助构建系统的内部经济，并对网络的良好运行投票。


    实用型代币的示例包括 `Filecoin`、`Civic` 和 `Siacon`。


    ![image](img/image084.png)


    ### 代币：证券 vs 实用


    `TOKENS` 并不是 `CRYPTOCURRENCY` 货币，但它们在区块链的成功起着重要作用。它们是价值、资产、投票权、访问权、权益或任何公司（特别是初创公司）发行的代表。它们通过众筹或公售提供——证券代币通过
    `STO` (`Security Token Offerings`)，实用型币通过 `ICO` (`Initial Coin Offering`)。


    ––––––––


    ![image](img/scene_break.png)


    `CRYPTO TOKENS` 通过其角色、特征和目的获得价值。


    - 角色包括代币持有者在生态系统中的权利（投票权等）、价值交换（买或卖代币）、过费（启用功能的网关）、功能（丰富用户体验）、货币（价值储藏）和收益（利润或财务收益）。


    要使代币被认为有价值，它们必须拥有多个角色。


    - 目的包括启动参与度（权利）、创建经济（价值交换）、利益相关（过费）。


    '
