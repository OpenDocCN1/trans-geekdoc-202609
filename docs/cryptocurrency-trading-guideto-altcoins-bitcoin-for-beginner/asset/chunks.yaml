- raw: 'Because of their stability, many investors tend to purchase Stablecoins while
    waiting for the crypto market to show favorable events. They are also great for
    payment purposes or money transfers anywhere in the globe.


    Stablecoins are highly tradeable and liquid. Their value does not change until
    you decide to move it into another altcoin or Bitcoin.


    *   Mining-based


    Mining-based altcoins are created through Proof-of-Work (PoW) method. They are
    mined through algorithms or solving complex problems. Litecoin, Zcash, and Monero
    are examples of mining-based altcoins.


    There are also pre-mined coins that are distributed before their listing in the
    crypto markets. XRP of Ripple is an example of this kind.


    *   Security tokens


    Security tokens are like the traditional stocks, bonds, equities, or derivatives
    that hold the tradable value of the external assets. These digital tokens guarantee
    a dividend payout, equity, or ownership. The price of security tokens appreciates
    over time. They are often sold to traders and investors through ICOs or initial
    coin offerings.


    In essence, they are investment contracts that represent the users’ legal ownership
    of a particular digital or physical asset.


    Ownership rights are verified by the network within the blockchain. Once fully
    verified, security tokens can be traded away for another type of assets, stored
    in electronic wallets, or used as loan collateral.


    One of the forms of security tokens is the securitized tokens. They are usually
    set up by startup companies and subject to compliance with the regulations of
    the Federal Laws. They are offered to the interested investors through Security
    Token Offering (STO).


    Examples of security tokens are Bcap (Blockchain Capital, Sia Funds, and Science
    Blockchain.


    *   Utility tokens


    Utility tokens are utilized in exchange for services or redeem rewards.  They
    are also called app coins or digital coupons that hold special discounts or access
    to the product or service.


    They are blockchain-based assets that are sold by fundraisers or companies to
    purchase their soon-to-be-introduced product or service.


    Utility tokens do not have intrinsic value or pay dividends. They are not considered
    an instrument of investment and are not subjected to Federal laws compliance.


    But utility tokens can provide holders with the right to use the network, help
    to build the system’s internal economy, and vote for the well-being of the network.


    Examples of utility tokens are Filecoin, Civic, and Siacon.


    ![image](d2d_images/image084.png)


    Tokens: Security Vs Utility


    TOKENS ARE NOT CRYPTOCURRENCY coins, but they play an important role in the success
    of blockchain. They are a representation of value, asset, voting rights, access
    rights, stake, or anything issued by companies, in particular startups. They are
    offered through a crowd or public sale – STO (Security Token Offerings) for security
    tokens and ICO (Initial Coin Offering) for utility coins.


    ––––––––


    ![image](d2d_images/scene_break.png)


    CRYPTO TOKENS GAIN value through their roles, features, and purpose.


    *   Roles include the rights of the token holder within the ecosystem (rights
    to vote, etcetera), value exchange (buy or sell tokens), toll (gateway to enable
    functionalities), function (enrich the experience of users), currency (store of
    value), and earnings (profits or financial benefits).


    For tokens to be considered valuable, they must possess more than one role.


    *   Purposes include bootstrapping engagement (right), economy creation (value
    exchange), skin in the game (toll), enriching the user’s experience (function),
    seamless transactions (currency), distributing benefits (earnings).


    *   Features include product usage, governance, voting, ownership, contribution,
    product access (rights), work rewards, product creation, buying, spending (value
    exchange), running smart contracts, usage fees, security deposit (toll), an incentive
    for usage, connects with users, joining networks (function), transaction unit
    or payment unity (currency), benefit-sharing, profit sharing, inflation benefits
    (earnings).


    The Howey Test


    For tokens to be recognized as security tokens, they should meet the three criteria
    of the Howey Test. This test determines if the transaction will qualify as an
    ‘investment contract’ under the Securities Exchange Act of 1934 and Securities
    Act of 1993.


    *   The token represents an investment of money


    *   The token’s investment is in a common enterprise


    *   There is an expected profit from the work of the third party or promoters


    Meet the most important altcoins


    Ether (ETH)


    Ether is an Ethereum cryptocurrency and operates on its proprietary blockchain.
    It is second to Bitcoin in terms of market cap and the largest among all Altcoins.
    This coin is designed for the Ethereum network, but it is also accepted as payment
    by several online sites that sell services and merchants.


    As a platform, Ethereum went live in July 2015 after programmer Vitalik Buterin
    talked about the idea in 2013. Together with Buterin who is serving as the public
    face and CEO is Joe Lubin of ConsenSys. It is responsible for the popularity of
    ICOs (initial coin offerings). It owns a programming language known as Solidity.
    Ethereum solidifies its position in the crypto world by introducing a programmable
    blockchain.


    ![image](d2d_images/image066.png)Its network serves as a melting pot for games,
    apps, and financial services, promising ultimate protection of accounts from theft,
    fraud, and censorship. It accepts Ether as payment for all transactions. As of
    January 2021, the market cap of ETH was $1,218.59 and a market cap of $138.3 billion.


    ––––––––


    ![image](d2d_images/scene_break.png)


    By the end of 2030, the fearless forecast


    of Coin Price Forecast


    for Ethereum market value is $5,000.


    ––––––––


    ![image](d2d_images/scene_break.png)


    LITECOIN (LTC)


    Litecoin was created by a former engineer of Google, Charlie Lee. It was launched
    in 2011 or just two years after bitcoin. It has a lot of Bitcoin’s features, which
    is why people called it “a silver to Bitcoin’s gold.” Its software is faster than
    Bitcoin but almost the same.


    It has a supply limit cap of 84 million. By 2023, it is expected to be 50% at
    its current 2 ½ minutes to mine a block.


    The Litecoin Foundation projected that the last blocks will be mined around 2142.
    As of January 2021, it ranked as the world’s 6^(th) –largest crypto with a per-token
    value that amounts to $153.88 and a market cap of $10.1 billion.


    ![image](d2d_images/image021.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    The market value of Litecoin will hit $2,250


    by 2030 according


    to the Crypto Research Report Group.


    ––––––––


    ![image](d2d_images/scene_break.png)


    BINANCE COIN (BNB)


    Binance coin is categorized as a utility cryptocurrency. It functions as a payment
    for trading and paying fees on the Binance Exchange. This altcoin was launched
    in July 2017, running with ERC-20 token in the Ethereum blockchain. Eventually,
    it is used as the proprietary currency of the Binance Chain, the decentralized
    blockchain of Binance. The man behind the creation of the Binance Exchange was
    Changpeng Zhao.


    As of January 2021, one BNB was worth $44.26 with a market cap of $6.8 billion.


    ![image](d2d_images/image028.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    Coin Price Forecast believes that


    Binance market value


    by 2030 would reach $1,191.


    ––––––––


    ![image](d2d_images/scene_break.png)


    BITCOIN CASH (BCH)


    Bitcoin Cash is Bitcoin’s spin-off during a hard fork in August 2017. This coin
    has its own unique blockchain and can process an average of 116 transactions every
    second. The original Bitcoin can only process 7 transactions per second. It was
    originally created with 8 MB blocks and eventually increased to 32 MB for better
    scalability. '
