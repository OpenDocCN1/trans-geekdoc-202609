- raw: 'To spot dead coins, observe the active activities of the projects on social
    media platforms. Websites like Deadcoins and Coinospy track down floating dead
    crypto projects.


    Some of the known dead coins are:


    *   Aeron (ARNX) was once a tradable coin on the Binance exchange but delisted
    after some time, causing the prices to drop up to 90%.


    *   BitConnect (BCC) enjoyed success during its first years but started to lose
    its credibility when UK financial regulators questioned its legitimacy at the
    end of 2017. In 2018, BitConnect was labeled a Ponzi scheme by Texas regulators,
    causing its eventual shutdown and the crash in the BBC price by 9%.


    *   Storeum (STO) died because of its lack of store value, zero liquidity, and
    dwindling market. The price of STO was $0.000012, but only 18 entries were recorded
    in its order book.


    *   VegasCoin (VEGCOIN) was a typical example of abandoned projects.


    *   ![image](d2d_images/image040.png)OxBitcoin (OxBTC) was initially performing
    well in the market. The price soared to $5 but suffered a loss as the value fell
    to $0.10. The core team of the project left when it happened.


    What are dead coins?


    Crypto coins that are called ‘dead coins’ are those that suffered disinterest
    and eventual death due to a lot of reasons. The common reasons for their death
    include abandonment of key people in the project, insufficient funding or low
    liquidity, turning out to be scams, limited to zero listings on popular crypto
    exchanges, low trading volume, joke projects, and more.


    In the crypto world, about 3.6% of the list of dead coins do not attract funding
    to support their development or offer lucrative profit margins.


    Around 3% accounts to joke projects, while 6 out of 10 crypto coins with inferior
    liquidity and negligible trading volume are usually abandoned by the developers.
    Coins are considered abandoned or dead if their trading volume within 3 months
    is below $1,000.


    The 2017 ICO craze rocked the crypto world when the number of coins gained momentum
    from 29 to more than 850 projects. Sadly, about 80% of the initial coin offerings
    were scams and left a trail of dead coins.


    Nevertheless, new developers are all set to create new altcoins. In 2018, over
    1,200 projects were launched. After two years, the total number of coins and tokens
    in the market is around 8,000.


    With the proliferation of the wide variety of coins in 2020, another scam called
    ‘rug pulls’ resulted in another batch of dead coins.


    ––––––––


    ![image](d2d_images/scene_break.png)


    CRYPTOCURRENCY INVESTING mistakes that beginners should avoid


    The continuous inflow of corporations and institutional investors raises the awareness
    of investing in cryptocurrencies, especially altcoins. The fact remains that the
    prices of these coins and tokens are dependent on public perceptions and speculations.


    However, gauging how the fundamental factors influence the future performance
    of coins remains the most popular approach. By not following the basic guidelines,
    the possibility of portfolio losses is great no matter what kind of investment
    method you are using.


    I rounded up the 5 worst investing mistakes you need to avoid as a crypto investor:


    1\. Buying crypto on speculation


    Beginners are prone to this mistake, leading them to buy high and join the crowd
    that aims to gain big profits without considering the potential prospects of the
    coin or the factors that drive their price higher. Always remember that the cryptocurrency
    market is volatile and no one can predict the movements of their prices.


    2\. Low prices do not mean that the coins are cheap


    Do not buy coins based on the promise of the creators that they will be the next
    ‘bitcoin’ and make you a millionaire in the near future. While it happens, like
    in the case of Dogecoin that experienced unexpected growth and made the investors
    instant millionaires and billionaires. But not every ‘meme’ inspired cryptocurrency
    has utility value or acceptability factor. In short, a low price typically reflects
    the actual worth and demand of the coin or token and not a discount.


    3\. Be guided by your risk tolerance


    Always remember that you should not invest more than you can afford to lose. Investing
    is a speculative approach, where you win and lose. There is no sure guarantee
    of winning all the time. To mitigate losses, allocate funds that equate to your
    level of risk tolerance. Never, ever pull out other investments for the sake of
    leveling up your crypto portfolio. The smart move is to stick to long-term investments
    and put up a small percentage of crypto assets.


    4\. Always have an exit strategy before you buy altcoins


    Purchasing an asset without exit plan is very risky. It is crucial for investors
    to have a solid framework or investment plan in advance that will stop high losses
    and achieve their financial goals. You don’t invest your money to lose but to
    earn, so during the period when the market climate is becoming tougher, your exit
    strategies help you cut losses.


    Exit strategies are also the keys to win more. Having a deeper understanding of
    market psychology and market sentiment makes smart investors decide to sell during
    the uptrends instead of holding their coins with the expectation of better price
    growth. If you want to squash losses and take advantage of gains, you should know
    when to sell.


    5\. Putting your golden eggs in a single basket


    It is one of the worst mistakes that beginners can make. The hype of entering
    the world of crypto can be exhilarating and can make you invest big on a single
    popular coin only. But this approach can ruin your future investing and wealth
    plans. The better option is to spread your investment across or diversify your
    assets portfolio. In this way, you can mitigate major losses.


    Newbies have a tendency to consider every price dip as a buying opportunity. They
    also believe that it is a good strategy to buy during the bull run or before the
    prices of altcoins become higher. Following these misconceptions would entail
    a higher risk of losing your venture capital. The key is always understanding
    why a bear or bull run is happening before investing big.


    Altcoin investing tips to help you dive in


    In May 2021, the total crypto value was over $2.5 trillion as more and more individuals,
    institutions, and companies joined the wagon. In another study, over 14% of adult
    Americans now own cryptocurrencies.


    And while there are people who invest money to speculate, many are considering
    long-term investing because they see altcoins as a hedge against inflation and
    assets with store values.


    ––––––––


    ![image](d2d_images/scene_break.png)


    HERE ARE TWO WAYS TO do it right:


    1\. Prepare for volatility and risks


    Each coin or token has unique features that influence its price direction. This
    is why you need to have in-depth knowledge about a certain altcoin before you
    invest your money.


    *   Know the rationale behind the coin or token’s creation


    *   Know the creators and major supporters of the coin including its governance
    structure


    Understanding more about alternative coins can help you better diversify your
    portfolio and add crypto to your other holdings. It is important to embrace volatility
    issues and prepare for the best or worst. Preparation is always the key to reduce
    or prevent losses.


    2\. Learn the dynamics of the risk-reward concept


    If you are all set to dive into crypto investing, remember that moderation is
    the key to success. Limiting the percentage of crypto in your overall portfolio
    would not impact its risk-reward dynamics when the worst happened. One approach
    is through dollar-cost leveraging or investing a fixed amount regularly.


    ![image](d2d_images/image075.png)


    Quote


    “Behind every crypto coin or


    token is a community.”


    FAQs


    Are altcoins good investments?'
