    ––––––––


    ![image](img/scene_break.png)


    ## RIPPLE (XRP)


    Ripple 既是一种数字支付系统，也是一种加密货币。创始人 Jed McCaleb 和 Chris Larsen 在 2021 年将其公开。它的主要流程是汇款和支付结算的资产交换。其加密代币是`XRP`，其功能是充当两个不同网络或货币之间的中间交换机制。


    它并没有利用区块链挖矿过程，而是采用共识机制在银行服务器的帮助下确认交易。Ripple 的交易更便宜、速度更快。在市值方面，它是第五大山寨币，市值约为 600
    亿美元，市场价格为 1.60 美元。


