    # Chapter 3


    ![image](d2d_images/chapter_title_below.png)


    ## What About the Crypto Market?


    The cryptocurrency market is where investors and traders buy or sell `Bitcoin`
    and `altcoins` at current prices. It is a type of financial market where the exchange
    of assets happens.


    The market of crypto is still young but is growing very fast despite a lot of
    speculations and uncertainties due to the volatility factor.


    And while there are unique factors that affect the crypto market prices, global
    and regional economic events like inflation, political unrest, disease outbreaks,
    and more can influence the price![image](d2d_images/image060.png)


    ### At a glance


    - Classifications of crypto markets

    - Understanding crypto exchanges: Centralized and Decentralized

    - Key factors that influence the crypto market prices

    - Market trends

    - Bull market versus bear market

    - Ways to take advantage of the crypto bull market

    - Ways to profit in a bear market

    - The psychology of market cycles

    - What is market sentiment analysis?

    - Indicators of market sentiment

    - Frequently Asked Questions (FAQs)


    ---


    Crypto markets can be classified into two:


    #### Spot market


    Crypto assets are bought or sold ‘on the spot’ in this type of market. Traders
    place an order, wait for the confirmation and delivery of the coins, and settle
    the payment right away. The context of delivery in the crypto spot market is ‘immediate.’
    The current market price paid by the traders for the asset is called the spot
    price.


    There are two types of traders in the crypto spot market. The first is the markers
    or trades’ initiators. You are considered as a maker if you list your potential
    trades on your chosen exchange. An example is opening trades at your desired price
    points, allowing potential buyers to fulfill the orders. The second type is the
    takers or the traders who fulfill the orders. You are a trader if you fulfill
    the existing coin orders.

