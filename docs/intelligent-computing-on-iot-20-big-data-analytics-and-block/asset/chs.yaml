  \   提供区块链应用部署的客户支持<br>*   进行性能和负载测试 | *   区块链应用服务器*<br>*   区块链模块*<br>*   智能合约模块*<br>*\
  \   集成/通信<br>*   测试模块 |\n| 商户采用 | *   提供易于与商户系统集成的标准化应用编程接口（API）<br>*   制定标准化的扣款/退款规则<br>*\
