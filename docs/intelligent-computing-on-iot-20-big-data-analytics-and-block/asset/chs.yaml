  \ door, while *t*[1] stands for people in R1 walking out of the room through the\
  \ right door. The immediate transitions model the decision to turn left or right.\
  \ They are also used to model the movement between two cells that are very close\
  \ to each other. For example, the three cells represented by *p*[12], *p*[13] and\
  \ *p*[14] are almost the same area, and thus we ignore the time for evacuees to\
  \ move among these three cells. This is also the case for cells *p*[19], *p*[20],\
  \ and *p*[21].\n\nThe exponential rate of each timed transition is calculated based\
  \ on the classroom measurements shown in Figure 17.2. We assume that the average\
  \ human moves 4.7 feet per second, so that is a key piece of data we used to calculate\
  \ our rate. The transition firing rate is calculated by dividing 4.7 by the distance.\
  \ This provides us with a realistic simulation that accurately captures human movement.\n\
  \nAn immediate transition’s weight, that is, firing probability, is given based\
  \ on what we thought the perfect evacuation route for each room would be. Table\
  \ 17.3 lists default transition firing probabilities. The way our immediate transitions\
  \ work are probabilities that add up to 1. For example, if one door has two exists,\
  \ 0.8 is assigned to the left and 0.2 is assigned to the right. This means that\
  \ 80% of tokens will go left while the remaining 20% will go right.\n\nTransitions\
  \ *t*[7] and *t*[8] form a decision set. *t*[7] models that when someone walks out\
  \ of the large room R1 from the left door, they choose to turn left and walk towards\
  \ the left exit. *t*[8] models that when someone walks out of R1 from the left door,\
  \ they choose to turn right and walk towards the right exit.\n\nWe can easily identify\
  \ other decision sets: {*t*[10], *t*[11]}, {*t*[12], *t*[13]}, {*t*[14], *t*[15]},\
  \ {*t*[23], *t*[24]}, {*t*[25], *t*[26]}, and {*t*[27], *t*[28]}. There are seven\
  \ such kinds of decision sets. We use *α*[*i*] and 1 − *α*[*i*] to represent the\
  \ probabilities of the two transitions in the *i*‑th decision set, *i* = 1, 2, …,\
  \ 7.\n\n### 17.4.3 Real-time Congestion Monitoring and Intervention\n\nWith the\
  \ IoT technology in place, we can always get the distribution of evacuees in a building\
  \ and therefore know if there is and where there is congestion. Based on some algorithms,\
  \ we can also predict if there will be congestion. If we do foresee congestion,\
  \ we take preventative action to stop it. In the Petri net model of Figure 17.6,\
  \ each token represents an evacuee somewhere. For example, the initial marking indicates\
  \ that there are 60 people in the classroom R1, 62 people in R2, 40 people in R3,\
  \ 38 people in R4, and 48 people in R5. Nobody is in other places. When the evacuation\
  \ simulation starts, the token distribution will change, representing people moving;\
  \ each real-time snapshot of the token distribution is recorded by the marking of\
  \ the Petri net. Therefore, by examining the marking of the GSPN model, we can analyse\
  \ the evacuation status and see if intervention is needed to prevent any potential\
  \ congestion from happening or worsening.\n\nNotice that such a decision-making\
  \ strategy should be made on a case‑by‑case basis. That is, the mechanism for the\
  \ marking analysis and decision for intervention is contingent on the individual\
  \ system or GSPN model. In general, we need to derive functions *f**i*, such that\
  \  \n\n*α*[*i*] = *f**i*, *i* = 1, 2, …, 7  \n\nThis way, based on the current congestion\
  \ status, we modify *α*[*i*] and inform more people to move to a less congested\
  \ exit. As far as the model in Figure 17.6, the total number of tokens in places\
  \ *p*[10] − *p*[16] is the number of people moving to the left exit, while the total\
  \ number of tokens in places *p*[17] − *p*[23] is the number of people moving to\
  \ the right exit.\n\nThere are two decisions here. One is to decide when we need\
  \ to adjust *α*[*i*]. The second decision is how to adjust *α*[*i*]. A simple way\
  \ to decide if we need to adjust *α*[*i*] is calculating the difference between\
  \ the number of people moving towards each exit and see if it exceeds a threshold.\
  \ Let  \n\n$$\\begin{array}{l} N_{L} = M(p_{10} \\cup^{} p_{11} \\cup^{} p_{12}\
  \ \\cup^{} p_{13} \\cup^{} p_{14} \\cup^{} p_{15} \\cup^{} p_{16}), \\\\ N_{R} =\
  \ M(p_{17} \\cup^{} p_{18} \\cup^{} p_{19} \\cup^{} p_{20} \\cup^{} p_{21} \\cup^{}\
  \ p_{22} \\cup^{} p_{23}). \\end{array}$$\n\nDenote the threshold of the difference\
  \ by *D*. There are three cases. The first case is  \n\n|*N*[*L*]−*N*[*R*]| < *D*,\
  \  \n\nin which no action will be taken. In the second case,  \n\n*N*[*L*] − *N*[*R*]\
  \ > *D*,  \n\nthat is, too many people move to the left exit. We should instruct\
  \ those who are still in the classrooms to move to the right exit when they walk\
  \ out of a classroom. Similarly, in the third case,  \n\n*N*[*R*] − *N*[*L*] > *D*,\
  \  \n\nthat is, too many people move to the right exit. We should instruct those\
  \ who are still in the classrooms to move to the left exit when they walk out of\
  \ the room. As far as how to adjust *α*[*i*], we can consider reducing *α*[*i*]\
  \ by a certain percentage in the second case and increasing *α*[*i*] by a certain\
  \ percentage in the third case. It is not a good idea to adjust *α*[*i*] dramatically.\
  \ We should consider all *N*[*L*], *N*[*R*], and *D*. For example, we can set the\
  \ percentage to  \n\n*D*/max {*N*[*L*],*N*[*R*]}.  \n\nA more reasonable increment\
  \ can be figured out through experiments.\n\nA second way to decide if we need to\
  \ adjust *α*[*i*] is to track the change of *N*[*L*] and *N*[*R*]. If one increases\
  \ much faster than the other, then we need to make an adjustment. The idea behind\
  \ this is when the number of people moving towards one exit increases too fast,\
  \ it is very likely a congestion will develop on the way to that exit. One can create\
  \ an algorithm for this approach.\n\n### 17.4.4 Simulation and Results\n\n\n\n我们设计了三个模拟场景，以验证所提动态疏散机制的有效性。场景\
