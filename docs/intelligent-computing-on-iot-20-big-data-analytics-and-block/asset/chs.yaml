  \n## 21.1 Introduction\n\nNetwork security is critical in today’s world of linked\
  \ networks. Despite businesses’ and organisa- tions’ best attempts to safeguard\
  \ their networks, no device is totally secure, especially if it is linked to the\
  \ Internet. This is due to the fact that hackers are continually developing new\
  \ and sophisticated types of malware, with MAcfee claiming that over 300,000 new\
  \ pieces of malware are developed every day.\n\nBusinesses and organisations invest\
  \ millions of dollars to air-gap their networks in order to resist these dangers.\
  \ To limit the danger of prospective assaults, air-gapping entails physically disconnecting\
  \ the network from the Internet. However, this strategy is not infallible, as air-gapped\
  \ networks have been infiltrated in the past.\n\nThis is when intrusion detection\
  \ steps in. Intrusion detection is a model-based strategy for detecting possible\
  \ network intrusions. The approach works by continually monitoring network traffic\
  \ for suspicious or unusual behavior. If a breach is found, the model will notify\
  \ system administrators, who may then take the required mitigation procedures.\n\
  \nBecause it gives early notice of prospective assaults, intrusion detection is\
  \ an effective technique to protect network security. This allows system administrators\
  \ to take action and repair any vulnerabilities before they cause substantial damage.\
  \ The use of an intrusion detection system(IDS) may also assist firms in meeting\
  \ numerous security rules and standards, such as the Payment Card Industry Data\
  \ Security Standard(PCI DSS).\n\nAccordingly, network security is an important concern\
  \ in today’s linked society. Despite the greatest attempts to safeguard networks,\
  \ no device, especially one linked to the Internet, is completely secure. Intrusion\
  \ detection is a model-based way to detectect possible network breaches and provide\
  \ early warning of future assaults. This allows system administrators to intervene\
  \ and patch any flaws before they do major damage, making intrusion detection a\
  \ critical tool for safeguarding network security.\n\n## 21.2 Related Work\n\nThe\
  \ NSL-KDD dataset is used in this chapter to compare several classification methods\
  \ for iden- tifying aberrant network traffic patterns. It is an enhanced version\
  \ of its predecessor, KDD’99. \\[1\\] Intrusion detection has emerged as a critical\
  \ area of concern over the past decade, with researchers focusing on different datasets\
  \ to enhance system accuracy and reduce false positives in line with the DAPRA’98\
  \ initiative. Machine learning-based anomaly-based attack detection systems can\
  \ be trained to increase their detection performance. However, because not all forms\
  \ of attacks can be accurately recognized, current anomaly detection approaches\
  \ frequently produce large false positive rates and only modest accuracy and detection\
  \ rates. The NSL-KDD dataset has already been examined in earlier works. An extensive\
  \ literature review of numerous research studies that have used either the KDD’99\
  \ or NSL-KDD security datasets to investigate IDS or implement IDS models using\
  \ machine learning techniques is included in the study “A Survey on Machine Learning\
  \ based Intrusion Detection System on NSL-KDD Dataset.” The survey covers a variety\
  \ of classification methods and classifiers that have been used for the security\
  \ dataset, such as K-Nearest Neighbor(KNN), K-means SVM, Deep Belief Network, Genetic\
  \ Algorithm, and Deep Convolution Neural Network(DCNN). The study’s conclusions\
  \ demonstrate the possibility of a hybrid strategy to improve machine learning-based\
  \ intrusion detection technologies. \\[2\\] In the year 2015, author presented performance\
  \ evaluation of NSL-KDD dataset using Artificial Neural Network (ANN). The chapter\
  \ recommends using Tansig transfer function, Levenberg-Marquardt (LM), and BFGS\
  \ quasi-Newton Backpropagation (BFG) algorithms when using ANNs on the NSL-KDD dataset.\
  \ \\[3\\]The neural network architecture is designed to modify the values of neurons\
  \ and layers during the learning process. The proposed approach outperforms other\
  \ reported techniques for binary class classification, exhibiting superior accuracy\
  \ in detecting attacks. Additionally, the study finds that the system has the ability\
  \ to effectively identify attacks for specific classes within the NSL-KDD dataset\
  \ during five-class classification. Pervez et al. \\[4, 5\\] presented NSL-KDD Cup\
  \ 99 dataset feature selection and intrusion classification using. Support Vector\
  \ Machines (SVMs), which are reliable machine learning algorithms frequently used\
  \ for image classification, pattern recognition, and biometric analysis, are suggested\
  \ to be employed in the research work. The suggested strategy uses fewer input features\
  \ from the training data while maintaining the high accuracy of the SVM classifier.\
  \ The chapter makes use of the NSL-KDD Cup 99 dataset, a multi-class classification\
  \ issue that includes both normal and attack network connections. The suggested\
  \ approach achieves classification accuracies of 91% using only three input features,\
  \ 99% using 36 input features, and 99% when all 41 input features are utilized.\
  \ These results demonstrate the effectiveness of the proposed method in accurately\
  \ classifying network connections.\n\n## 21.3 Dataset\n\nThe NSL-KDD dataset, an\
  \ improved version of the KDD’99 dataset, has been extensively utilized by researchers\
  \ to develop effective IDSs. Its superior performance over its predecessor can be\
  \ attributed to the rectification of several issues. The NSL-KDD dataset is built\
  \ upon the DARPA ’98 dataset produced by the MIT Lincoln Laboratory’s Cyber Systems\
  \ and Technological group.\n\nThe NSL-KDD dataset has been subjected to various\
  \ analyzes, using a range of methodologies and tools, with the ultimate goal of\
  \ developing an efficient IDS. In this context, The NSL-KDD dataset has been thoroughly\
  \ examined by the WEKA program using a variety of machine learning techniques. In\
  \ particular, several attacks, both known and undiscovered, have been trained and\
  \ tested using the K-means clustering technique.\n\nIn summary, the NSL-KDD dataset\
  \ has served as a significant benchmark in the field of intrusion detection, facilitating\
  \ the development of effective and efficient machine learning algorithms for detecting\
  \ attacks. The utilization of such techniques has significantly advanced the ability\
  \ to safeguard computer systems against malicious activities. \\[6\\]\n\nThe NSL-KDD\
  \ data set is an improved version of the one that came before. It includes all of\
  \ the crucial KDD data set records. The researchers have access to a variety of\
  \ files that can be downloaded.\n\n\n\n虽然 NSL-KDD 数据集的采集存在一些问题，但它仍然是一个高度有用的数据集，可以用于研究。6，7\
