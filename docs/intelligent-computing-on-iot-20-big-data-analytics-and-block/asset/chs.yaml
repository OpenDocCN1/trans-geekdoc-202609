  _{i}^{(\\\\mathbf{1})}e = y\\_{0}^{(\\\\mathbf{1})}e + y\\_{0}^{(\\\\mathbf{1})}(I\
  \ \\\\otimes \\\\beta)R{(I - R)}^{- 1}e = 1.$$ \n```  \n\nPost-multiplying the first\
  \ equation in (8.16) by (`I` ⊗ `β`) and adding to this the other two equations with\
