  \n## 5.1 Introduction\n\nModernization with groundbreaking technologies, such as\
  \ the Internet of Things (IoT), artificial intelligence (AI), and blockchain, has\
  \ uplifted the Internet. IoT technology has attracted many real-time applications,\
  \ such as smart healthcare systems, smart cities, Industry 5.0, and many more, to\
  \ strengthen the nation’s economy and people’s quality of life. Numerous IoT devices\
  \ are interconnected with physical machines to offer diverse use cases at hyper-scale.\
  \ Figure 5.1 shows the forecasting data, i.e., the number of IoT devices connected\
  \ globally from 2019 to 2035 \\[1\\]. It consists of different small-scale physical\
  \ devices that can sense their surrounding environment and collect and transmit\
  \ the data to other physical devices to accomplish a shared task. For instance,\
  \ temperature sensors are essential indicators for equipment checks in the smart\
  \ industry. Any unexpected fluctuations or instabilities in the temperature reading\
  \ indicate that the equipment is not working correctly. Such changes need to be\
  \ sent to other temperature sensors and alert the administrator for predictive maintenance.\
  \ Moreover, these sensors use IoT communication protocols, such as message queuing\
  \ telemetry transport (MQTT), constrained application protocol (CoAP), data distribution\
  \ service (DDS), and hypertext transfer protocol (HTTP), to communicate with each\
  \ other. This enables different sensors to relay critical data via these communication\
  \ protocols to offer proactive services.\n\n![Figure 5.1 Number of IoT devices connected\
  \ globally (2019–2035) \\[1\\].](images/fig5_1_B.jpg)\n\nFigure 5.1 Number of IoT\
  \ devices connected globally (2019–2035) \\[1\\].\n\n### 5.1.1 IoT Promotes Smarter\
  \ Computing\n\nAs IoT development progresses, knowledge systems and networks employed\
  \ for autonomous communication also increase. We will then be surrounded, supported,\
  \ and sustained by an increasing number of smarter systems in our classrooms, homes,\
  \ businesses, food kiosks, and other vital locations. They will easily communicate,\
  \ cooperate, corroborate, and correlate to comprehend our psychological, social,\
  \ and physical requirements and meet them discreetly, securely, and unhurriedly.\
  \ In other words, the appropriate information and services will be created, provided,\
  \ and delivered to the right person at the proper time and location. The main drivers\
  \ of this tectonic modernization and migration are primarily physical artifacts\
  \ and assets. The world of conscious, linked, and cognitive computing will incorporate\
  \ everything that is common, casual, and economical to benefit the users.\n\n###\
  \ 5.1.2 IoT Paves the Way for Smarter Environments\n\n\n\n\n一系列配备高清互联网协议（IP）电视的电子设备预计将被整合到我们的生活、休闲和工作空间中。除此之外，所有实际和具体的商品、文章、家具和包装都专门制造了能够实现计算和通信的电子设备。以人为中心、更智能的环境是物联网技术和云基础设施结构所设想要实现的\
  \ `cvar = avar + bvar`。\n\n### 5.1.3 物联网规定个人便利\n\nIT 专家预测，日常技术会无缝且冲动地结合，形成一个技术集群，能够瞬间且直观地满足我们的个人和专业需求。也就是说，有可能我们的思维会透明地与机器人融合。由于我们可以通过任何辅助电子设备随时随地访问全球信息资源和知识库，学习将成为一项\
  \ 24×7 的任务。另一方面，我们的大脑将拥有可靠的备份，存储在庞大的数字存储系统中。这些看似神秘且前沿的技术主题让我们能够以积极的方式将神经系统与计算机连接。将所有物质和有价值的事物转化为智能且有感知力的数字实体，强化了各国经济的支柱。\n\
  \n## 5.2 物联网应用\n\n### 5.2.1 智能城市\n\n从标题可知，智能城市通过运用各种技术系统、传感器、前沿通信技术等实现智能控制。智能城市被视为物联网最具前景、最具启发性的应用之一。它用于建立传感器、物理设备和网络之间的牢固联系，从而在构建和创建智能城市时发挥作用。物联网在智能城市中的集成显著减少了系统控制和监控所需的人力\
  \ `cvar = avar + bvar`。智能城市被视为应对城市人口增长和快速城市化所带来的不足的新策略。通过构建智能交通、智能住宅、智能医疗等基础设施，可以让人们的生活更加便捷。\n\
  \n人们可以借助智能城市系统找到解决难题的最有效途径。该系统大量使用无线通信渠道，如低功耗广域网（LPWANs）、射频识别（RFID）、无线传感器网络（WSNs）和光保真（Li-Fi），实现智能城市物联网数据的无缝传输到智能城市的各类应用中。图\
  \ 5.2 显示了当前已在使用的众多智能城市应用以及未来研究的潜在方向。智能城市应用本质上围绕四个 distinct building blocks（四个 distinct\
  \ 建筑块）展开，即数据收集、数据传输或接收、数据存储以及数据分析。数据收集是应用依赖的，一直是各领域传感器发展的主要驱动力。数据从采集设备传输到云端进行归档和分析是流程的第二步。随后，数据需要通过各种存储技术（如云存储）进行整理和组织，以辅助分析阶段。数据分析是从获得的数据中得出结论和模式，以用于决策。在其他情况下，简单的决策和聚合也能够有效完成。云的可用性使得能够使用统计技术（如机器学习和深度学习算法）对异构数据进行收集、处理和实时分析，实现更复杂的决策。下面讨论几个智能城市应用。\n\
  \n![Figure 5.2  Applications of smart city.](img/fig5_2_B.jpg)\n\nFigure 5.2  Applications\
  \ of smart city.\n\n*   **智能建筑**——智能城市为国家的长期发展提供充足且持久的基础设施。通过构建智能基础设施，使设计和施工更加系统、结构化且保守。物联网应用被嵌入智能基础设施，使各经济领域（如商业、工业、环境等）的系统更加智能。例如，在智能建筑（如电梯）中使用运动探测器检测人员是否在内部；若人在电梯内，则电梯运行；否则不运行，从而提升系统的能源效率\
  \ `cvar = avar + bvar`。\n\n*   **智能照明**——在构建智能照明系统时，常用光电二极管、接近传感器和环境光传感器。光节点内置的传感器会根据光强（由光传感器和运动传感器测量）以及运动情况发出灯光指令。这些智能照明系统的覆盖区域根据潜在的人口或活动进行划分，系统能够准确测量照度水平，并在选择所需的光照水平后进行计算和功率削减，以提升系统效率。\n\
  \n*   **智能道路**——通过智能道路技术，车辆可以被监控，交通灯可依据车流流动进行调节。利用物联网和传感器技术建造的智能道路让驾驶更安全、更舒适。它为驾驶员提供关于交通、停车、路况、天气、最短路线以及道路障碍的实时信息。智能道路在通过危险地形和不平整路面时，借助多种传感器提高行车安全，增加行人安全，降低事故概率，从而提升公共安全\
  \ `cvar = avar + bvar`。\n\n### 5.2.2 智能住宅\n\n智能住宅是智能城市的重要组成部分，因为它是城市居民生活的核心。由于人们大部分时间都在家中，家务自动化至关重要。各种外设和数字技术正在被改造，以便快速且便捷地创建和维护更智能的住宅。为了显著提升生活质量，未来的居住环境广泛而显著地使用无线宽带通信、环境、灵活且自适应的传感器以及与其他高级系统集成的技术\
  \ `cvar = avar + bvar`。这是一种普遍的计算技术应用，将智能融入家庭的管理和维护，以实现便利、健康、安全和节能。通过巧妙结合特定场景，可识别出众多智能住宅复合应用。以下是一些智能住宅应用的概述。\n\
  \n*   **居家安全**——无论是在家中还是工作场所，嵌入于门、窗等不同家庭组件的安全传感器可以防止犯罪活动。IP 网络安全摄像头提供坚固、不可破坏且不可渗透的安全。入侵检测与防止系统是其他重要的安全组件。家庭安全还通过能够即时向业主、邻居或警察、消防部门发出警报的建筑或家庭传感器得到增强。这些设施还能让家庭成员远程检查老人和儿童的健康状况。\n\
  \n\n\n\n*   Home networking - 所有惰性和被动物体都在实现数字化，并以无线和巧妙的方式与各种家用电子设备进行网络连接。这使得设备之间能够连接、交互（点对点或通过中间件），并创建以人为中心、互连、嵌入的电子服务。普遍的互联网也使得家庭网络能够与外部世界进行交互。这使得远程管理、监控和维护家用电器成为可能。家庭系统还与汽车电子、导航和多媒体系统、停车管理系统以及其他设备连接，实现实时通信和互动。\n\
  \n*   Energy conservation - 未来的电力需求将促使对住宅电器进行分钟级调节，以优先提供能源服务，同时为用户自动节约能源。通过依据家庭的环境条件和用电习惯，并同步灯光、家用电器以及气候和温度传感器，最小化能源消耗。建筑自动化系统（BAS）对于简化使用者需求至关重要。随着智能电网的接入，BAS\
  \ 在保护有限的电力能源方面的重要性显著提升。\n\n*   Health and wellness - 医疗提供者可以通过植入客户体内的生物传感器或其他医疗设备，或在客户家中使用这些设备，而无需住院，从而持续监测客户的健康和福祉。智能家居传感器可以持续监测包括健康和福祉在内的高级指标。这些电子健康设备可以收集当前健康状况的评估数据，以维持整体健康并预防疾病。\n\
  \n### 5.2.3 Smart Healthcare Systems\n\n医疗行业正处于应对当前诸多问题的技术进步中，这些问题因老旧设施以及过去未能及时采用适当技术而加剧。医疗行业产生的海量大数据是另一大主要问题。这些巨大的数据量需要存储基础设施和技术。患者态度和心态的转变也增加了这些问题。就他们与医疗服务提供者互动的质量而言，患者现在不愿做出任何妥协。患者已不再容忍因缺乏特定基础设施组件而导致的长时间等待。通过确保患者在正确时刻获得适当的护理，物联网（IoT）为医疗行业带来了巨大的希望。\n\
  \n#### 5.2.3.1 Clinical Monitoring and Remote Consultation\n\n患有特定慢性疾病的患者必须持续监测其关键生理指标。这些患者通常被安置在医院的重症监护单元（ICU）。物联网驱动的非侵入性监测技术使这种监测成为可能，它利用传感器收集患者多项关键生理指标的详细数据（如图\
  \ Figure 5.3 所示）。这些传感器收集的信息通过无线网络和网关实时传输给家属和护理人员，以便他们能够最佳地照顾患者。传统的由医护人员在医院进行的持续面对面监测已被\
  \ IoT 技术所取代。它为慢性病患者提供了更便捷的居家医疗，且价格合理。此外，居住在偏远地区的个人通常缺乏持续健康监测的机会。对于此类患者，通过无线技术和物联网连接的传感器使健康监测成为可能。这些无线系统利用传感器收集身体数据，使用先进算法进行评估，并将结果与医疗专家共享，以提供患者相关的健康建议。根据患者的具体需求及其是否需要针对老年人或慢性病患者的专科护理，所使用的参数、设施和流程可能会有所不同。以下是智能医疗应用的列表。\n\
  \n![Figure 5.3  Services offered by smart healthcare systems.](img/fig5_3_B.jpg)\n\
  \nFigure 5.3  Services offered by smart healthcare systems.\n\n*   Mobile health\
  \ care—Mobile health care (mHealth) 是利用便携电子设备进行通信和健康相关用途的技术。全球对该主题的兴趣日益高涨。推动移动设备在医疗行业使用的主要因素包括移动设备的普及、高速无线网络的可及性以及它们对大量人群日常生活的影响。此外，政府对世界各地许多地区持续存在的医疗专业人员严重短缺也表示关注。医疗行业的调查显示，移动健康服务在农村和资源有限的环境中更具可及性和效果。eHealth（利用信息通信技术提供与医疗相关的服务）催生了\
  \ mHealth。\n\n*   Remote Monitoring—该概念旨在提供虚拟的医疗治疗和咨询、药物递送以及治疗程序，前提是患者能够获得远程连接、视频会议及其他交互式技术。全球许多国家已常规在远程进行患者筛查。其主要目标是为那些因居住在农村地区或因工作繁忙无法亲自就医的人士提供高质量的医疗服务。远程手术（telesurgery）的发展，利用机器人和护理人员进行治疗，也是另一项令人期待的创新。\n\
  \n*   Convenience for aged people—该应用的主要目标是为老龄化人口提供持续的身体参数监测。可穿戴设备（可在不进行人工干预的情况下跟踪患者的身体参数）是实现此目标的关键设备之一。从老年人身上收集的身体测量数据会传输到普通移动设备，该设备作为网络节点，实时将数据转发给医生。如果发现异常，这些信息可用于及时为患者提供适当的医疗护理。为确保参与度和在正确时机提供正确的治疗，该程序还包括向当地医院和患者家属发送提醒消息的选项。\n\
  \n### 5.2.4 Smart Agriculture\n\n\n\n\n-   [2030 年联合国可持续发展目标](https://example.org/2030-sustainable-development-goals)的最重要元素之一是**食品安全**。全球人口的不断增长和气候变化的恶化正导致世界各地食物生产区出现不可预测的天气模式，各国正竭尽全力证明**食品生产的可持续性**，并优化像水等日益减少的自然资源的使用。数字化有助于实现农业的可持续性。**智能农业**通过在农场和作物中部署传感器来测量各种指标，从而辅助决策，预防疾病、害虫及其他问题\
  \ \\[9\\]。智能农业框架包括**精准农业**，需要在作物中嵌入传感器以提供精准测量，随后实现定制化护理机制的部署。精准农业对于可持续农业生产至关重要，因为它是未来粮食安全的必要条件。物联网（IoT）正通过提供多种工具，帮助农民解决在田间面临的各类问题，从而**彻底革新农业领域**。传感器和执行器用于调节农业作业，而无线传感器网络（WSN）用于监测农场。借助\
  \ IoT，农民可以在任何地点使用手机检查农田状况。IoT 赋能的技术可以提高土地生产力并降低种植成本。以下是 IoT 基于智能农业的一些关键好处的总结：\n\n\
  *   **移动性**——实施 IoT 的一个优势是流程适应性的提升。由于实时监测和预测工具，农民能够迅速应对天气或土壤、作物状况的重大变化。得益于新兴的 IoT\
  \ 技术，农业工人能够在极端天气变化来临时挽救作物。\n\n*   **可持续流程**——除了节约水和能源、使农业更环保外，精准农业还显著降低了农药和化肥的使用量。其结果是，与传统农业方法相比，智能农业能够提供更好的有机产品。\n\
  \n*   **自动化作业**——如播种、灌溉和收获等作业被自动化，以节约资源、减少人为错误并整体降低成本。\n\n*   **食品安全与营养**——农业部门面临确保适当产量的同时提供营养均衡食品的挑战。已有多起食品盗窃指控，包括伪造、掺假和人为篡改\
  \ \\[10\\]。此类欺诈可能对个人的健康和财务安全产生负面影响 \\[11\\]。采用 IoT 技术可识别 Manning \\[12\\]中讨论的各类食品盗窃问题，包括产品真实性、流程完整性、个人完整性和数据完整性。\n\
  \n*   **远程设备控制**——IoT 的一个所谓优势是远程控制设备 \\[13\\]。与工作人员通过车辆或步行手动巡查大片田地相比，IoT 在农业中的渗透能够大幅节省人力和费用。通过\
  \ IoT 决定何时、如何施用农药或化肥，可降低成本和浪费。\n\n*   **实时监测**——IoT 能够实时监测农场资产和机械设备，以发现欺诈、加速部件更换并确保及时维护。\n\
  \n### 5.2.5 智能供应链管理\n\n通过精确调控供应商的流动，智能供应链的概念能够管理从客户到客户的整个物流链，无论其位置如何。这种控制既满足**质量要求**，又实现**降低成本**的目标。IoT\
  \ 和区块链是两项正在发展的技术，用于实现这一性能。前者旨在将所有设备连接至网络化系统；后者则保证已完成的 IoT 操作，并通过提供安全可靠的数据通信来确保其可靠性。供应链管理（SCM）需要协调多个事件、循环和资源。因此，区块链能够提供**安全性、真实性和所有权**，同时节省时间\
  \ \\[14\\]。供应链多年来为解决方案提供了支持，如货物追踪和库存数据通信。嵌入企业内部的设备和传感器可以根据压力、温度、机器使用情况等特性，在处理工作流程数据、设备切换设置以及借助\
  \ IoT 赋能系统实现最佳性能时，发送和接收数据。为使行业保持敏捷和灵活，供应链必须是智能的。IoT 可以通过在产品内嵌 RFID 芯片并利用智能标签实时监测商品可用性，帮助零售运营和\
  \ SCM；商家可以据此优化各类应用。当消费者在商店中找不到所需商品时，这会导致销售损失。借助 IoT，这类零售损失可以被最小化。此外，将零售店的数据公开后，整个\
  \ SCM 的物流可以得到优化。制造商还能根据商店销售数据和库存情况，生产并运送正确数量的商品，从而避免过产或不足生产。\n\n### 5.3 物联网通信中的安全与隐私问题\n\
  \n云、大数据和移动技术在 IoT 基础设施中交织在一起。每一项技术元素都可能受到众多安全漏洞和攻击的威胁，导致其运行不稳定。确认 IoT 基础设施元素已得到充分的安全防护，以免受到潜在威胁至关重要。信息技术组件的安全（如完整性、隐私和可用性）是\
  \ IoT 架构安全的重要考量因素 \\[15\\]。在对 IoT 应用进行安全检查时，需要评估以下安全参数：\n\n*   **完整性**——它保证只有授权用户才能修改底层数据，且未经授权的用户无法以任何方式重新定向数据。写入、删除和更新等操作均属于数据重新定向的范畴。\n\
  \n*   **隐私**——它保证底层数据仅对授权用户可访问。换言之，隐私通过限制通过 IoT 基础设施传输和存储的数据的访问来保护数据隐私。\n\n\n\n\n\
  可用性—它确保底层数据在需要时可供授权用户访问。这涉及在物联网基础设施中确保容错能力的包含。容错通过在物联网基础设施的每个组件（尤其是服务器、存储和网络）中提供备份组件来实现。将服务器集群以创建高可用性环境，有助于确保服务器备份。此外，必须确认备份服务器是主服务器的复制品，并在主服务器故障时可接替其角色。采用高度可扩展的独立磁盘冗余阵列（RAID）架构有助于确保存储备份，因为同一数据在多个磁盘之间进行条带和镜像，即使一块磁盘故障，数据也不会丢失，因为它保存在阵列中的其他磁盘上。为了保证任何网络组件的故障不会阻碍数据在网络中的传输，应在两个连接端点之间放置多个交换机、多个端口和大量电缆。\n\
  \n此外，物联网通信使用传统的路由算法和协议，由于其简易的操作性，攻击者可以轻易目标化。例如，攻击者知道物联网通信使用公共 Internet，它正式基于传统路由算法，攻击者可以通过操纵路由表来利用这一点\
  \ \\[16\\]。攻击者可以在数据链路层进行攻击，例如地址分辨率协议（ARP），以操纵路由表。此类攻击可能危及物联网通信的性能。以下是物联网通信的安全和隐私挑战：\n\
  \n*   隐私问题——在物联网中，设备被用于生活的各个领域；例如，智能手表有能力收集、存储和分析个人数据。物联网基础设施中的大多数设备允许收集设备凭证信息。由此可以推断，设备通过多个网络传输信息，且缺乏加密功能，这带来了更多的隐私问题。当物联网对象获取信息但未得到安全保护时，隐私风险主要上升。各种用户活动被匿名跟踪，以便进行分析以获取洞察。如果这些数据与不可靠的第三方共享，可能对用户造成严重危害。必须严格遵守政策和程序，确保只有授权用户和应用程序才能访问数据。\n\
  \n*   缺乏加密——设备通常使用轻量级加密技术。由于实施了温和的加密方法，大多数设备无法加密数据。因此，必须采用强大且安全的加密方法，以构建安全架构。\n\n\
  默认凭据——在大多数设备和传感器中，默认凭据（用户名或密码）通常被使用；然而，这是不恰当的，因为一旦黑客通过任何手段获得这些信息，网络就会受到实际威胁。默认密码通常简单易记，但如果长时间未更新凭据，会对网络构成危险。\n\
  \n鉴于上述安全和隐私挑战，物联网应用成为攻击者的诱饵，他们针对关键应用，如医疗保健、银行、核电站、水处理厂和关键基础设施。由于物联网基于应用的大规模发展，它与\
  \ IP 网络集成，暴露于各种网络攻击（如图 5.4 所示）。这些网络通过远程连接可访问，攻击者有可能通过通信链接访问私人和敏感数据。已观察到大多数物联网系统中的攻击是入侵攻击，这可能导致其他攻击，如数据注入、会话劫持和破坏服务器及访问控制系统等服务。此外，物联网使用弱协议，不支持强有力的密码学，因为其计算成本高。物联网基础设施中的设备本质上嵌入了无线传感器网络（WSN）\
  \ \\[17\\]。由于采用广播传输介质，WSN 特别容易受到物联网安全威胁。以下是一些关键 WSN 威胁：\n\n![Figure 5.4 Security\
  \ issues in WSN-based IoT systems](img/fig5_4_B.jpg)\n\nFigure 5.4 Security issues\
  \ in WSN-based IoT systems\n\n*   物理篡改——最近，所有物理设备都配备了感知能力，以便正常运作并造福社会。然而，物理保护设备并防止不必要的物理可及性仍然具有挑战性。攻击者可以篡改节点或传感器的信息，从而危及传感器网络的整体性能。\n\
  \n*   节点复制——在本攻击中，现有传感器节点的标识在同一网络中被复制。复制后的新节点会导致数据包路由错误，表现为错误的传感器值，甚至可能导致网络崩溃 \\\
  [18\\]。\n\n*   选择性转发——在无线传感器网络（WSN）中，预期所有节点都将消息传送到目标。在选择性转发中，恶意节点随机转发数据包，即洪 loods\
  \ 网络。部分消息可能直接丢弃而不转发。由于攻击者通常修改少数特定节点的数据包，然后转发，因此不易察觉该节点的恶意行为。修改后的数据包扰乱物联网应用的日常活动。\n\
  \n*   蠕虫攻击——这是一种恶意攻击，攻击者在网络的某一点记录数据包后，将其隧道至新的目的地。此过程也可以选择性实施。当基于路由的消息被隧道时，正常业务运行会受到干扰\
  \ \\[19\\]。\n\n*   斯科攻击——当攻击者在点对点拓扑中拥有多个身份，并且同时存在于多个位置时，这种攻击得以实施。如果在攻击前系统被攻击者接管，则可以实现此攻击。在该网络中，单个节点显示多个身份，显著降低了故障容错机制（如差异、分散存储和多路径）的有效性\
  \ \\[20\\]。\n\n*   窃听——入侵者在两个节点之间通过公共网络界面传输信息时进行窃听。信息本身未被篡改，但隐私受到侵犯。入侵方可以利用此知识对用户进行威胁\
  \ \\[18\\]。\n\n## 5.4 Theoretical Background\n\n本节介绍关键使能技术，以降低物联网应用中的安全威胁影响。\n\n\
  ### 5.4.1 洋葱路由\n\n\n\n为维护物联网（IoT）基础设施的隐私，必须隐藏通信的接收者及其内容，即流量分析。大多数 IoT 连接采用单层加密策略，这使得拥有强大计算资源的对手相对容易破解密码并泄露消息。因此，能够保证匿名性的更强的多层加密变得必要。通用的“洋葱路由”（Onion\
  \ Routing，OR）架构允许在公共网络上进行私密通信 \\[21\\]。它提供高度抗流量分析、数据注入和窃听的匿名连接，可适用于面向双向、近实时的面向连接和无连接流量。通过专用代理，OR\
  \ 能够与商用应用软件和系统通信，使用匿名洋葱节点池加密数据的多层，实现将其集成到现有系统中的简便方式 \\[22\\]。根据源到目的的通信，从该池中随机选取若干节点（洋葱路由器）。每个节点使用\
  \ RSA 算法生成的共享密钥，去除一层加密，就像洋葱一样，然后将剩余层传递给下一个节点。重复此过程直至所有加密层均被移除，方能确保 IoT 场景的安全。\n\n\
  ### 5.4.2 人工智能\n\n具备监督或无监督能力的强大机器，在任何人类认知水平上执行任务，可称为具有智能。人工智能（AI）是一个涵盖从搜索算法到机器学习和深度学习等复杂过程的广泛领域。20\
  \ 世纪 90 年代初，人们对 AI 持怀疑态度，因为复杂的计算过程难以评估。然而，随着技术的出现，AI 已成为日常生活的组成部分。第四次工业革命（Industry 4.0）通常指\
  \ IoT 与 AI 技术的集合。IoT 范式包含大量传感器、执行器、数据存储和数据处理能力。因此，IoT 设备能够感知环境、传输数据、存储并分析数据。这些设备提供的\
  \ IoT 数据中的学习模式使 AI 模型得以学习 \\[23\\]。模型使用的算法可对恶意和非恶意传感器数据进行分类，或预测零日攻击的概率，从而让架构仅保留非恶意数据用于分析。AI\
  \ 系统收集海量数据，学习算法在数据中寻找模式，以在 IoT 范式中提供预测服务 \\[24\\]。它是高效组织和处理大量数据、辅助决策的有前途技术 \\[25\\\
  ]。随着 IoT 设备的快速增长，AI 获得了巨大的关注。此次扩张促使 IoT 网络安全应用开始利用决策树、线性回归、机器学习、深度学习、支持向量机、神经网络等\
  \ AI 技术，以识别威胁和潜在袭击。\n\n### 5.4.3 区块链技术\n\n区块链是一种不可篡改的基于账本的技术，广泛用于许多基于 IoT 的应用场景，如智能医疗、智能银行和智能工业。考虑到发展因素和已收集的数据样本，区块链通常表现为一个持续管理且受监管的数据库。参与者创建的事务以及这些事务的记录块是区块链的基础组成部分。记录块决定事务细节是否以正确顺序被保存，从而防止对已有数据的任何修改。保存的事务随后会与区块链参与者共享。每个事务通过强有力的加密方法（如\
  \ RSA、高级加密标准（AES）和哈希算法）进行加密，即事务被加密。此外，区块链网络中集成了智能合约，智能合约由各种用户定义的函数组成，适用于具体应用 \\\
  [26\\]。这些函数为用户提供权限和访问控制，并在此基础上验证 IoT 应用的数据，再将其写入不可篡改的账本中。智能合约消除了第三方中介的需求；所有第三方服务都被用户定义的函数所取代，从而增强了区块链网络的信任。时间戳数据的有序序列由与各事务集（即块）在加密上相连的算法实现。通过使用块的哈希引用将每个块链接到前一个块，链条既有序又具\
  \ integrity。参与者必须通过去中心化的多数投票程序达成一致，以保持区块链的状态一致性。区块链可分为公共链和私有链：公共链任何人都可以参与网络；而私有链是受许可的，只有拥有读写权限的参与者才能加入\
  \ \\[27\\]。IoT 使得物联网设备能够将数据传输到私有区块链网络，从而构建不可篡改的共享事务记录，这提升了 IoT 数据的安全性、适应性和信任感。\n\
  \n### 5.5 提出的架构\n\n基于对 IoT 安全与隐私问题的讨论，我们提出了一个安全且智能的框架，通过整合 AI 模型和基于区块链的 OR 来克服 IoT\
  \ 应用的各类安全漏洞。我们以智能家居系统作为 IoT 应用，下面展示了从一个传感器到另一个传感器的安全端到端通信管道。所提架构包含多个层次，如感知层、智能层和数据安全层（如图 5.5\
  \ 所示）Figure 5.5。\n\n![Figure 5.5  The proposed architecture.](img/fig5_5_B.jpg)\n\
  \nFigure 5.5  The proposed architecture.\n\n### 5.5.1 感知层\n\n本层包含智能家居系统中部署的多种传感器，如温度、恒温、天气、运动和烟雾传感器。传感器会将其读数或指令转发给其他传感器以完成共享任务。例如，在发生火灾时，需要在智能家居系统的所有房间打开烟雾传感器。传感器使用传统的路由算法和通信协议来传输读数，因此攻击者可以利用此机会扩大攻击面以谋取利益。例如，攻击者可以在进行数据注入攻击的同时，篡改传感器读数——把开启烟雾传感器的指令改为关闭烟雾传感器——从而危及通信通道的安全。因此，必须有一种智能、主动的机制来检测\
  \ IoT 通信中的恶意行为，并从智能家居通信管道中丢弃此类数据读数。\n\n\n\n\nThis layer comprises of AI models which\
  \ are incorporated in the proposed framework for classification purposes, i.e.,\
  \ classify malicious and non-malicious data readings from smart home systems. We\
  \ used AI models, such as random forest (RF), naive Bayes (NB), bilayered neural\
  \ network (BNN), support vector machine (SVM), and logistic regression (LR); they\
  \ are chosen for their indispensable characteristics, such as faster training time,\
  \ feasible with non-linear data, classify with fewer data preprocessing steps, and\
  \ many more. First, a standard dataset of the smart home system is downloaded from\
  \ the authentic website \\[28\\]. The dataset consists of different sensor readings\
  \ for the thermostat, temperature, weather, and motion, wherein each row specifies\
  \ the reading for a particular timestamp. The class label consists of categorical\
  \ data, i.e., attack and non-attack data; this also implies that it is a binary\
  \ classification problem. Then the dataset is preprocessed with different preprocessing\
  \ steps, such as normalization with min-max scalar to resolve range problems, missing\
  \ and not a number (NaN) values are replaced with central tendency, i.e., mean value,\
  \ and type cast the data types (e.g., object to int data type). After that, the\
  \ dataset is split into two, i.e., training and testing datasets. The training dataset\
  \ is forwarded to the AI models to complete the training; once the training is completed,\
  \ the testing dataset is applied to the trained models to validate the results of\
  \ the training dataset. Finally, the AI models are assessed with different assessment\
  \ parameters, such as accuracy, precision, recall, and F1 score, wherein the RF\
  \ model outperforms others in terms of accuracy, i.e., 93.78%.\n\n### 5.5.3 Data\
  \ Security Layer\n\nThis section presents the integration of a triple-layered OR\
  \ network in our proposed framework. As discussed in the previous sections, security\
  \ threats deteriorate the regular operations of the smart home system. The attackers\
  \ can intercept the sensor’s communication to silently sniff the entire transmission\
  \ or exploit it by using attacks, such as executing malware payload (e.g., trojans),\
  \ performing injection attacks, and scanning the sensor communication to find the\
  \ device vulnerabilities. Furthermore, if they find any loopholes in the smart home-based\
  \ sensor communication, they can proliferate their attack by targeting that specific\
  \ vulnerability. For example, if they found a severe vulnerability in the temperature\
  \ sensors manufactured by a particular company, the attacker tried to attack all\
  \ the temperature sensors made by that company, resulting in a devastating situation\
  \ across the globe. Therefore, there must be an encrypted tunnel via all the sensors\
  \ transmitting their data to tackle the aforementioned security and privacy concerns.\
  \ The proposed framework uses an OR network, which uses RSA-enabled cryptography\
  \ to secure the data readings from the attackers. It selects three onion routers,\
  \ i.e., entry, middle, and exit nodes, from the pool of routers to form an onion\
  \ circuit through which the data is securely relayed to its intended destination.\n\
  \nHowever, it is observed from the literature that the Internet service provider\
  \ blocks the OR network for building transparency in communication. Moreover, the\
  \ entry and exit nodes are publicly listed in the master node list, i.e., any person\
  \ can view the meta information of that onion router and analyze thenetworktraffic,resultinginananonymitybreakfortheIoTapplication.Therefore,inthissection,\
  \ we employ bridges and pluggable transport that are the secret onion routers, which\
  \ are not publicly listed on the master node list of the OR network. We used `obfs4bridge()`\
  \ to overcome the abovementioned problem of anonymity break. First, the data is\
  \ hashed using a message digest algorithm to perform an integrity check on the received\
  \ data, i.e., whether the data has been tampered with in the OR network or not.\
  \ Meanwhile, the RSA algorithm has generated public and private key pairs, by which\
  \ the data will be encrypted and decrypted at subsequent stages of the OR network.\
  \ Then, the data is triple-encapsulated, where each encapsulated layer is encrypted\
  \ using the RSA-based public key algorithm. In addition, each encapsulated layer\
  \ has a unique identifier (ID) generated by a pseudorandom number generator. Implying\
  \ that each incoming sensor data has three unique IDs that are appended with the\
  \ encapsulated layer.\n\nWe also want to mention that each onion router is associated\
  \ with blockchain technology to strengthen the security of the OR network. This\
  \ is because an attacker might manipulate the onion routers to exploit the entire\
  \ OR network; therefore, each router is integrated with blockchain to confront the\
  \ above-mentioned security concern. This is achieved by storing all the IDs inside\
  \ the blockchain’s immutable ledger , so if the attackers exploit any onion router,\
  \ the particular IDs will also be exploited. Thus, when the incoming sensor data\
  \ with its associated ID reaches the onion router, it first matches the ID with\
  \ the blockchain-stored ID; if both IDs match, the onion router can decrypt the\
  \ encrypted layer and forward it to the next onion router. So, encrypted data is\
  \ forwarded to the OR network. It is first received by the entry router, which has\
  \ the private key to decrypt the first layer of the encryption. Before that, the\
  \ IDs are matched; on a successful match, the entry node can use its private key\
  \ to decrypt the first layer of the encryption. Then it is forwarded to the middle\
  \ node, where IDs are first matched; then, on a successful match, it decrypts the\
  \ second layer encryption using its private key. Similarly, the third router decrypts\
  \ the final encrypted layer using its private key. After that, the hashed is computed\
  \ on the receiver side; if both, the sender and receiver hash match, the receiver\
  \ sensor confirms the data integrity and accepts the data readings from the source\
  \ sensor. This way, the smart home system data is securely transmitted from the\
  \ source sensor to the destination sensor.\n\n### 5.5.4 Performance Evaluation of\
  \ Proposed Framework\n\nThis section describes the performance analysis of the proposed\
  \ framework by utilizing various performance metrics, such as accuracy, precision,\
  \ recall, F1 score, preserving anonymity, and blockchain response time. Figure 5.6\
  \ displays the comparison of accuracy with different AI models (discussed in section\
  \ 5). From the graph, one can observe that the RF achieves an accuracy of 93.78%\
  \ compared to other AI models. This is because RF has an advantage over other AI\
  \ models; for instance, it operates using an ensemble technique where it first splits\
  \ the entire dataset into small subsets, and then each subset (acts as a decision\
  \ tree) is individually trained with the RF algorithm iteratively. Finally, a performance\
  \ score is computed based on the voting; the highest voting subset is selected as\
  \ the best tree for that particular iteration. Moreover, unlike other AI models,\
  \ the RF algorithm does not need preprocessed data, resulting in faster training\
  \ time than others. Table 5.1 shows the comparison of precision, recall, and F1\
  \ scores of the adopted AI models.\n\n```\n![Figure 5.6  AI models accuracy comparison.](img/fig5_6_B.jpg)\n\
