  \n## 4.1 Introduction\n\n物联网（IoT）是一个新兴的、富有创意且具有颠覆性的计算范式，它将具备存储、计算和通信能力的任何物体都连接到互联网。将设备连接到互联网，使得诸如智能家居、智能电网、智能城市、智能交通、智能物流、创新医疗和智能工业等多种应用得以实现。根据全球移动通信协会（GSMA）的预测，IoT\
  \ 将在 2025 年实现全球一万亿的规模，为供应商、企业和制造商提供巨大的投资机会 \\[1]。\n\n\n\n物联网 (IoT) 应用范围广泛。例如，患者佩戴的\
  \ IoT 设备可以通过持续传输血压和心率等信息的网络直接与医疗机构联系。这将实现远程患者监测并加快医疗响应。此外，在交通领域，IoT 扩展至“车联网”（IoV），可通过促进更安全驾驶、优化燃油使用、为车辆用户提供娱乐以及改善出行时间来提升交通效率。通过在物流集装箱上安装\
  \ IoT 传感器并使用 LTE Advanced (LTE-A) 或 5G 等先进网络技术进行连接，全球物流可以得到改善 \\[2\\]。总之，IoT 是一项新兴技术，为众多利益相关者和个人带来好处。IoT\
  \ 是一项新兴技术，惠及许多利益相关者和人群。\n\nIoT 应用承载关键信息；例如，IoV 负责汽车安全通知。电子健康（e-health）直接影响人类生活，物流可能包含关于物品耐用性和交付时间的关键信息。IoT\
  \ 网络需要安全和隐私保护 \\[3\\]。\n\n区块链（BC）最初被倡导用于加密货币，金融行业可能用于保障 IoT 网络。BC 旨在建立一个公共的“开放账本”，任何参与节点均可在无需第三方的情况下获取所需信息\
  \ \\[4\\]。BC 是一种完全去中心化的方法，这使得网络更安全、更开放，因为每个节点拥有相同的、最新的正确信息。在成功完成具有挑战性的共识过程后，矿工有权修改并追加区块链网络上的数据。该过程涉及解决复杂的算法或谜题。区块链中已有多种共识算法，如工作量证明（PoW）、权益证明（PoS）、委托工作量证明（DPoS）、Ripple、Tendermint\
  \ 等。工作量证明（PoW）算法被 Bitcoin 和 Ethereum 采用，如图 4.1 所示 \\[5\\]，其中每个矿工会创建区块链系统中的谜题。随后，节点会在\
  \ BC 中发布该谜题，所有节点均可访问。能够解决 PoW 的节点可保留、访问并修改 BC 数据 \\[5\\]。\n\n```\n![Figure 4.1 PoW\
  \ technique in BC systems.](img/fig4_1_B.jpg)\n```\n\nFigure 4.1 PoW technique in\
  \ BC systems.\n\nFigure 4.2 展示了由链接块构成的 BC。每个块包含两部分：工作量证明（PoW）哈希和交易。PoW 哈希包含 nonce、时间戳、前块以及\
  \ Merkle 树等多个元素，而交易则包含用户数据，这些数据存储在区块链上。在 IoT 网络中使用区块链的一个优势是它提供固有的信任，支持分布式内容共享，确保隐私感知的通信，以安全为设计目标，并具备高度的弹性和可靠性。\n\
  \n```\n![Figure 4.2 BC made using linked blocks.](img/fig4_2_B.jpg)\n```\n\nFigure\
  \ 4.2 BC made using linked blocks.\n\n## 4.2 概述\n\n近年来，学术界和商业专家对物联网（IoT）的进展给予了大量关注。IoT\
  \ 令人兴奋，因为它可能使新的做事方式成为可能。在个人层面，它呈现出未来社会的景象——一切都连接到互联网并相互交流以智能运作。其终极目标是通过赋予事物即时感知周围环境、相互交互且成本不高的能力，以及在不受我们指导的情况下响应我们的需求和偏好，来改善我们周围的环境。IoT\
  \ 拥有更大的商业潜力 \\[6\\]。\n\n它涉及对数百个与服务或商品相关的元素进行自动发现和快速分析，并能在问题影响客户体验或物品功能之前自动响应问题。为了通过提升服务交付和优化业务流程获得竞争优势，必须从多种内部和外部来源（包括社交媒体）获取并分析大量结构化和非结构化数据\
  \ \\[7\\]。考虑到互联网对人们、企业、科学、政府以及我们对环境控制能力的影响，若否定这一说法便显得过于保守。许多人认为物联网将是历史上最大的技术挑战。\n\
  \n1999 年，Kevin Ashton 创造了“物联网”一词。将当时 Procter & Gamble 供应链中的 RFID（射频识别）创新理念与互联网结合，这不仅是一种吸引前高管的巧妙手段。IoT\
  \ 有潜力带来与互联网影响相当的世界性变革。MIT Auto-ID Center 在 2001 年提出了对物联网的愿景，而国际电信联盟（ITU）在 2005 年的《互联网报告》中正式命名并认可了物联网。物联网的使用正在增长，尤其是在无线通信领域。\n\
  \n智能物体（如智能手机、智能手表、先进的家庭自动化系统等）在我们周围的增多，这些物体能相互交互并与其他系统协作完成特定任务，这有力证明了这一点 \\[8\\\
  ]。物联网的最大优势无疑是它已经对企业和人们日常生活带来的显著改进。IoT 目前被企业用于创造新商业模式、改进运营流程、降低成本以及降低风险等诸多方面。人们生活得到改善的例子包括学习、安全和健康监测等领域\
  \ \\[9\\]。\n\n物联网基于这样的理念：通过互联网建立物理连接，以监控和管理涉及人、动物、物体甚至树木的过程。人们可以通过连接“物”来访问并根据需要进行控制。它们不仅仅是提供信息的互联网连接\
  \ \\[10\\]。因此，连接物体并非主要目的。相反，利用相关物体获取的信息用于改进产品和服务。在给出定义之前，列出构成物联网的关键组件会更有帮助。本质上，物联网是一系列实际物理对象的网络。传感器用于获取数据。\n\
  \n\n\n\nIdentifiers: 为了研究数据，标识符是定位数据来源（如传感器或设备）的工具。总体而言，物联网（IoT）是一个由易于识别、配备软件智能和传感器、且永久连接至互联网以实现通信和消息传递的物体网络\
  \ \\[11\\]。事物可以通过 IoT 与其制造商、所有者或其他连接设备进行交互，以共享信息。这使得远程感知事物（提供精确信息）并通过网络操作现实世界物体成为可能。这使得基于计算的系统与外部世界能够更紧密地互动，提升生产力、准确性和经济效益。每个设备都与其他设备不同，并能凭借其自身的计算系统与当前的互联网基础设施协同工作。行业专家和企业预测，物联网将促进大量设备的连接。根据\
  \ Gartner 的预测 \\[12\\]，到 2020 年在使用的设备数量将达到 200 亿。Cisco 也预测，到那时，将有 268 亿个连接设备，包括笔记本电脑、移动电话、平板电脑、电视和机器对机器设备。\n\
  \nOthers 认为这一预测过于低估，因为它假设任何配备简单微控制器、易开关或甚至二维码（Quick Response）的设备未来都能连接至互联网 \\[13\\\
  ]。摩尔定律理论 \\[14\\]，该理论指出密集集成电路中晶体管的数量大约每 18 个月会翻倍，支持这一主张。IoT 也被称为“万物互联”（IoE），涵盖人、数据、过程和事物。因此，IoE\
  \ 是 IoT 的扩展。\n\n*   People: 将人们聚集在一起，可能帮助个人更深入地融合。\n\n*   Data: 通过利用数据获得理解，从而做出决策。\n\
  \n*   Process: 在适当时将正确的信息传递给正确的设备或人。\n\n*   Things: 事物是真实的物体和机器，它们通过互联网和其他技术进行通信，以达到智能结论。\n\
  \nIoT 旨在连接“事物”，使它们能够相互灵活地通信并采取适当行动。物联网随后与人联网（IoP）相结合。然而，本书和现代文献声称“IoT”指代一切（包括人）。基于此，物联网可描述为：借助物联网，设备可以识别自身、拥有内部智能，并能够感知并采取行动。它通过互联网连接人与事物。我们过去曾用“IoT”指代所有连接互联网的事物，这里同样使用该术语。这包括设备、建筑物、汽车、人、宠物、其他生物，以及树木和植物等。物联网基于“事物”可以从世界任何地方被观测和控制的理念。\n\
  \n## 4.3 Internet of Things(IoT)\n\n### 4.3.1 Background\n\nIoT 大约 20 年前被构想出来，尽管其技术在多年之前便已在研发。让我们追溯物联网及其支持和关联技术的出现\
  \ \\[15\\]。\n\n*   1969—物联网的主要技术——互联网，最初作为美国高级研究项目署网络（ARPANET）出现，用于学术和科研界分享研究成果、开发新型互连技术，并将计算机与美国国防部、公共及私营部门的众多通用计算机中心相连。\n\
  \n*   1973—射频识别（RFID）是物联网的必要技术之一。RFID 技术自二战以来已存在，但 1973 年，Mario W. Cardullo 获得了首个可重写\
  \ RFID 标签的美国专利。同年，加州商人 Charles Walton 也获得了一项被动式发射器专利，可用于远程开启门锁。\n\n*   嵌入式计算机是另一项物联网技术。这些嵌入式系统采用单板处理器和微控制器。\n\
  \n*   1984—在正式命名之前，物联网已在使用 \\[16\\] 一台可口可乐机器联网后能够报告其可用性和温度。\n\n*   1990：互联网在商业和消费领域传播。由于网络连接不足，其使用受到限制。\n\
  \n*   1991 年，Mark Weiser 提出“普适计算”概念。高级嵌入式计算使普适计算无处不在却难以察觉，随后被“普遍计算”取代。\n\n*   20\
  \ 世纪中叶——传感器节点被研发，用于检测唯一识别的嵌入式设备的数据并轻松共享信息。\n\n*   1999 年，Bill Joy 创造了设备间通信，而 Ashton\
  \ 则提出了“物联网”一词。MIT 的 Auto-ID 中心开发了一种低成本芯片，能够存储数据并将设备连接至互联网。\n\n*   2000 年，互联网连接已成为许多用途的常规，所有公司和产品被迫上线并提供信息。\n\
  \n这些物联网设备仍需通过应用和界面进行人工介入和监督。物联网的终极承诺将在技术在背后运行并实时响应我们的期望或需求时实现。\n\n### 4.3.2 Applications\
  \ of IoT\n\n物联网指的是无需人工干预即可在网络中传输数据的事物。Gartner 预测，到 2020 年，将有 204 亿个连接设备投入使用。物联网行业的市场价值预计将在\
  \ 2020 年达到 1.7 万亿美元，而 2014 年的价值为 6558 亿美元。物联网系统将产生如此多的收入。物联网平台从任何源头的项目中收集数据，利用电路和传感器进行采集，处理并通过网络传输，并利用人工智能进行存储、可视化和处理。传感器、高效通信协议、开源服务器程序、最新网页开发工具以及物联网仪表盘的最新进展，正被用于解决众多社会问题，如图\
  \ 4.3 所示 \\[Figure 4.3\\].\n\n![Figure 4.3 Applications of IoT.](img/fig4_3_B.jpg)\n\
  \nFigure 4.3 Applications of IoT.\n\n#### 4.3.2.1 Military\n\n物联网具有军事用途。ZigBee 和\
  \ GSM 网络被用于监测和追踪军人的健康状况。这些系统的缺点包括带宽受限、运营成本高以及基础设施复杂。通过将军人健康监测与跟踪系统升级至物联网架构，可解决这些不足。物联网可提升军事态势感知、风险评估和反应时间。物联网技术可帮助军队发现对手、监测士兵的身体和心理健康，并协调部队与防御系统。配备内置传感器的军事服装和头盔可追踪士兵的位置和生理指标，指挥中心可实时救援作战人员。发光的军事服装和头盔可能集成温度、心率、加速度、心电图（ECG）、运动、氧气水平等传感器。\n\
  \n#### 4.3.2.2 Healthcare\n\n物联网在治疗慢性疾病、追踪可吞服传感器、移动健康以及智能医院等方面有应用。\n\n##### 4.3.2.2.1\
  \ Remote Health Monitoring\n\n\n\n数字 IoT 架构因其多学科、多学科的特性，无法实现能够包含所有其属性的完美架构。已有多种\
  \ IoT 架构被探索。Figure 4.4 展示了我们简化的四层设计，用于捕捉主要 IoT 应用特征。Figure 4.4 的架构包含四层：设备层、边缘层、云层和跨层。请简要描述每一层。在本节中，已描述了现有的雾计算架构、负载均衡和容错方法。\n\
  \n![Figure 4.4 Architecture of IoT.](img/fig4_4_B.jpg)\n\nFigure 4.4 Architecture\
  \ of IoT.\n\n#### 4.3.3.1 Layer-1—Device-Layer\n\n\n\n这一层负责检测、检测和控制环境。这一层由大量异构物联网终端设备（如传感器、执行器、收发器和处理器单元）组成，用于完成应用任务。各类原始设备制造商（OEM）为这些设备提供不同容量的设备。由于应用、硬件和软件需求的差异，选择设备或硬件技术并不容易。这一层包含多种通信和网络协议。没有任何一种协议能满足所有物联网领域的需求，因此种类繁多。Figure\
  \ 4.4 展示了层-1 物联网终端系统网络如何与子系统的其余部分连接的示例。这一层包含最为异构的硬件、软件、通信和网络协议。\n\n#### 4.3.3.2\
  \ Layer-2—Edge-Layer\n\n在没有进行任何数据处理的情况下，这一层充当设备与云层之间的数据传输桥梁。然而，它可能承载所谓的“边缘计算”或“雾计算”的复杂云任务。将复杂的云服务在层-1\
  \ 进行移植，可降低关键应用的带宽和延迟。该层的硬件能够支持当前操作系统。对于应用开发者，该层的操作系统隐藏了硬件异构性。在应用层，传统的 Internet 协议套件协议（如\
  \ HTTP、MQTT、CoAP 等）用于数据交换，适用于有线和无线技术，涵盖 3GPP（3G、LTE、5G 等）、IEEE（802.11、802.2）等标准。通过在该层使用资源丰富的硬件设备，能够构建硬件独立、计算密集特性或服务的高级操作系统（如\
  \ Linux、Windows 等）。\n\n#### 4.3.3.3 Layer-3—Cloud-Layer\n\n云层存储层的大量数据，并提供构建基于云的应用和服务的各种工具，包括\
  \ AI、大数据、认知计算、机器学习技术、分析以及跨域数据交换。由于物联网应用开发者使用 Amazon、Google、Microsoft 等公司的 SaaS、PaaS、IaaS\
  \ 云服务，该层隐藏了较少的硬件变异性。凭借一致的 API（如 Mesos、Terraform 等）和安全访问协议（如 MQTT、AMQP、HTTP 等），应用在该层更容易迁移。\n\
  \n#### 4.3.3.4 IoT Cross-Layer Management\n\n物联网系统管理对于其可持续性至关重要，是其设计的基石。系统管理在安装和维护物联网终端系统中发挥关键作用，通过全面的物联网管理，满足商业需求。这包括服务编排、软件维护、部署故障排除和配置等方面。本部分的设计与以往工作不同，强调常见的应用域特性，以帮助理解和开发物联网功能。同时，本部分还增加了一个用于系统管理的跨层设计，以协助部署和维护物联网系统。\n\
