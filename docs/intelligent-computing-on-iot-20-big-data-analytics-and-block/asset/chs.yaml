k><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\n\
  \n\n*   *控制面板:* 控制面板允许管理拖拉机的基本功能，如开/关灯光、启动和停止发动机以及紧急停止开关。控制面板内还设有用于显示各种参数状态的警告灯，包括电池电量、汽油量、水温和油温。此外，还有一个诊断显示屏，用于查看错误信息和车辆的总工作时间等信息。这些数据通过\
  \ CANbus 进行发送和接收。\n\n*   *天线:* 天线通过相关的无线电接口将 CANbus 消息作为数据包进行发送和接收。\n\n*   *远程控制器:*\
  \ 远程控制器允许授权操作员远程驾驶拖拉机。它配有按钮、开关和可调电位器，可用于管理不同参数，如速度、方向以及转子的启动。此外，还有一个小屏幕显示无线电通信链路状态的信息，并让操作员监测拖拉机的状态。\n\
  \n#### 19.3.1.6 考虑的网络攻击\n\n##### 19.3.1.6.1 干扰攻击\n\n干扰攻击旨在阻断控制器与拖拉机之间的通信。为了测试，我们使用\
  \ SDR 卡配合 GNU Radio 软件生成适当的干扰信号实现干扰攻击。评估该攻击的影响至关重要，以判断在与远程控制器通信中断或出现自我及周围环境中的人员和物体危险行为时，车辆是否仍能安全运行。\n\
  \n系统可能因内部软件配置和攻击的复杂程度而易受干扰攻击。针对攻击模型，我们使用了三种不同的干扰方式：\n\n*   固定白噪声干扰：干扰信号为固定中心频率和带宽的白噪声信号。\n\
  \n*   反应式白噪声干扰：干扰信号为中心频率可变、带宽固定的白噪声信号。当干扰器“听到”被监测信道上的信号时，它会立即开启，并可自动调节干扰信号的中心频率以“追踪”原始信号。\n\
  \n*   伪造控制器数据包干扰：干扰信号由一系列模拟远程控制器发送数据包的数据组成，但不包含有意义的数据。干扰器通过发送可能被视为可信的假命令来“模仿”远程控制器。\n\
  \n系统会对上述各类攻击作出不同的反应。图 19.5 展示了固定干扰的效果。可以注意到，系统会通过频率跳变机制在先前使用的信道繁忙时切换信号中心频率。\n\n\
  ```\n![图 19.5 固定白噪声干扰攻击。](img/fig19_5_B.jpg)\n```\n\n图 19.5 固定白噪声干扰攻击。\n\n虽然这种特定攻击对我们的测试平台没有影响，但其他干扰方式则不然。如果反应式干扰器足够快，它甚至可以在发射端实现频率跳变机制的情况下完全中断通信。\n\
  \n此外，针对伪造数据包的攻击，接收端会立即停止接收命令。对于此攻击，我们会收集数据包、截断其中一部分并作为回放进行传输。在此情况下，接收端的行为与白噪声干扰不同：它会立即中断通信。操作杆随后可以尝试在另一条信道上重新建立通信。\n\
  \n##### 19.3.1.6.2 重放攻击\n\n重放攻击是指记录远程控制器发送的合法数据包，并使用 SDR 卡将其重新发送到车辆上。如果系统未实现任何身份验证机制，重放攻击可能让攻击者部分或完全控制车辆。即使攻击者无法单独隔离数据包，根据通信情况，对原始通信的直接重传可能足以完成攻击。\n\
  \n图 19.6 展示了重放攻击在我们测试平台上的效果。\n\n```\n![图 19.6 正在进行的重放攻击：频谱图。](img/fig19_6_B.jpg)\n\
  ```\n\n图 19.6 正在进行的重放攻击：频谱图。\n\n我们可以识别出 4 个主要阶段：\n\n1. 正常操作。\n\n2. 重放攻击开始：恶意控制器的信号与合法信号重叠。接收端开始遵循恶意控制器的指示，而不是合法用户的指示。\n\
  \n3. 重新连接：授权人工操作员仍可通过选择其他信道尝试重新连接到接收端。\n\n4. 再次恢复正常操作。\n\n图 19.7 展示了信息流经 CANbus\
  \ 网络的情况。\n\n```\n![图 19.7 正在进行的重放攻击：拖拉机接收的数据包。](img/fig19_7_B.jpg)\n```\n\n图 19.7\
  \ 正在进行的重放攻击：拖拉机接收的数据包。\n\n浅蓝色圆圈标记与拖拉机移动命令相关的字节。当值为 80 时，拖拉机处于停止状态（正常工作和重新连接阶段）。当值为\
  \ FF 时，拖拉机因重放数据包中的命令而直线行驶（重放攻击阶段）。可以看到，在重放阶段和正常工作阶段，接收端将 SDR 设备视为远程控制器，这通过红圈标记的\
  \ 0 值体现，表示控制器在线（攻击和正常工作阶段）。值为 FF 表示控制器离线。绿色圆圈标记重新连接阶段的值变化。总之，输出显示拖拉机在前进，而授权操作员将拖拉机状态设为停止。\n\
  \n\n\n3. *识别每个比特的含义*：它允许识别每个检索数据包的结构，从而识别每个单独比特或比特子集的含义。例如，可以通过比较随时间变化的数据包来实现这一点。这一步骤通常是最为手动和耗时的：需要记录多个随时间变化的数据包；数据包会以已知方式变化，例如点击单个按钮或移动单个遥控器的杠杆时；实际上，如果动作改变，数据包也会相应改变，从而允许将比特与动作关联。\n\
  \n这些测试揭示了系统在测试中存在的严重漏洞。该系统还与许多用于自主农业车辆的现成产品以及其他自动化设备具有相似之处，这表明类似的漏洞可能出现在许多其他系统中，应予以认真考虑。此分析也加强了对这类设备进行网络安全测试的必要性，考虑到可能出现的各种网络攻击的广泛范围。\n\
  \n### 19.3.2 农业领域传感器网络使用案例 2\n\n#### 19.3.2.1 物联网系统架构与层次\n\n物联网在过去几年已在诸多领域获得巨大关注。物联网一词由\
  \ Kevin Ashton 在 1999 年提出，并与随时随地连接任何事物的概念相联系，从而使物体能够相互通信以及与互联网通信 \\[29\\]。\n\n典型的物联网架构由三个主要层组成，如\
  \ Figure 19.10 所示：*感知层、网络层和应用层*。\n\n![Figure 19.10 物联网三层架构。](img/fig19_10_B.jpg)\n\
  \nFigure 19.10 物联网三层架构.\n\n第一层对应物联网设备，如传感器和执行器，它们与周围环境交互并收集数据以进行传输和处理。确保该层的安全至关重要，因为生成的数据会传送到上层网络，若设备未受监控且易受网络攻击，可能对整个网络造成损害\
  \ \\[30\\]。网络层负责通过网络传输数据。根据相关物联网应用的性能需求，设计了多种通信协议，如短距离或长距离、延迟敏感或延迟容忍、高可靠性或低可靠性等。该层能够管理和控制大量交换流量。然而，由于其功能类似于\
  \ OSI 模型中的网络层和传输层，该层易受多种网络攻击，如中间人攻击（MITM）或拒绝服务攻击（DoS） \\[31\\]。应用层代表物联网应用，根据物联网服务和制造商的不同而异。其作用是通过特定的用户界面将终端用户与物联网设备连接，并确保身份验证。由于它通常处理大量数据事务，该层易受数据或软件攻击，如数据泄露、恶意脚本注入和钓鱼攻击\
  \ \\[31, 32 and 33\\]。\n\n#### 19.3.2.2 物联网网络中的安全挑战\n\n物联网的动态特性、硬件多样性、广泛的可访问性以及全球连通性使其在安全方面极为关键且充满挑战。因此，各种安全挑战和威胁可能影响物联网，针对物联网设备和通信通道\
  \ \\[34\\]。此外，物联网概念基于大量物体与终端用户及虚拟实体的相互作用，确保安全与隐私至关重要 \\[35\\]。基于上述原因，多种攻击手段可用，安全保障是一个重要议题。任何物联网系统中最重要的挑战之一是保障传输数据和信息的机密性。不同的加密技术用于保证不同实体之间的数据秘密，如高级加密标准（AES）或三重\
  \ DES（数据加密标准）等。然而，这些技术不足以充分保障数据隐私。通过监控和窃听数据的流量分析，敏感信息仍可能被获取。此外，当恶意节点加入网络时，数据也可能被释放并受到损害。即便在保证机密性的前提下，数据完整性也可能受损。这可以通过引入恶意节点并在网络中注入伪造数据、篡改通信数据，甚至导致服务中断来实现\
  \ \\[36\\]。结果是数据包损坏和数据丢失。此外，任何物联网网络都需要确保数据真实性，因为物联网设备通常与服务器共享无线通信介质 \\[37\\]。端到端节点必须进行身份验证，以验证源节点并防止恶意节点或伪造数据包。可用性也是物联网系统另一项关键挑战。通过存在受损节点或物联网网关故障，可用性可能被破坏，导致端到端实体接收数据出现错误和中断\
  \ \\[38\\]。\n\n#### 19.3.2.3 物联网网络所执行的攻击\n\n物联网网络因其低成本安装和易于编程部署而闻名，这使得对网络及其行为的各类攻击更加容易进行，从而导致功耗、延迟和吞吐量等性能退化。物联网网络可进行两类攻击：(I)\
  \ 网络攻击和 (II) 物理攻击。网络攻击包括通常远程执行的攻击（即使在某些情况下，网络攻击可能以物理动作作为起点），而物理攻击则旨在通过更“传统”且具身体理的方式破坏或损坏物联网网络的实体。攻击还可分为被动或主动两类\
  \ \\[40\\]。\n\n每个物联网层都有其自身的安全关注点，关于威胁和攻击的概述如 Figure 19.11 所示。\n\n![Figure 19.11\
  \ 物联网各层可执行攻击的概述。](img/fig19_11_B.jpg)\n\nFigure 19.11 物联网各层可执行攻击的概述.\n\n从感知层开始，攻击针对物联网设备，企图破坏它们或改变其行为。该层的主要攻击包括：\n\
  \n*   *干扰（Jamming）*：攻击者产生强干扰信号，旨在在其覆盖范围内破坏所有合法通信。\n\n*   *节点篡改（Node Tampering）*：攻击者完全控制物联网传感器或设备，可对其进行修改或用恶意设备替换。由于设备已集成到物联网网络中，此攻击可能对整个物联网系统造成安全问题\
  \ \\[41\\]。\n\n*   *恶意代码注入（Malicious code injection）*：攻击者注入恶意代码，使物联网设备执行意外且未计划的功能。此类攻击可能在多种情形下发生，例如设备固件的定期更新/升级，通常通过空中方式进行。\n\
  \n\n\n\n*   *错误数据注入*：攻击者在获得设备控制权后，会将错误数据注入物联网设备内存中。此攻击可能导致用户行为出现异常，因为错误数据的影响。\n\n\
  *   *窃听*：攻击者监听或窃取位于其覆盖范围内的物联网设备生成或发送的数据 \\[42\\]。此攻击通常旨在获取格式、操作和流程的信息，并可能用于未来节点篡改和错误数据注入。\n\
  \n*   *睡眠剥夺*：攻击者旨在耗尽物联网设备电池，迫使其执行无用且耗电的任务。\n\n关于第二层，针对网络层的主要攻击包括：\n\n*   *Sinkhole\
  \ / Wormhole*：攻击者在网络中插入恶意监听设备和恶意物联网节点。监听设备拦截目标物联网设备的数据包并通过独立通信通道转发至恶意物联网节点，该节点再伪装成真实设备向网关发送数据包。若攻击成功，下行通信将被重定向至恶意设备\
  \ \\[43\\]。此攻击可能导致网络拥堵并影响网络性能 \\[44\\]。\n\n*   *选择转发*：攻击者在被攻击物联网设备与用户之间的网络中“过滤”通信，例如仅转发部分数据包并丢弃其他数据包\
  \ \\[45, 46\\]。\n\n*   *拒绝服务 (DoS) / 分布式拒绝服务 (DDoS)*：攻击者通过持续生成请求，使系统资源耗尽，导致无法处理合法数据包。若伪造数据包旨在触发物联网设备响应，则会导致设备电池耗尽\
  \ \\[47\\]。\n\n*   *中间人 (MITM)*：攻击者监听并拦截物联网设备与网关/服务器之间的通信，以收集数据并利用信息，如用于保护数据传输的安全交换和设备认证\
  \ \\[48\\]。\n\n*   *Sybil*：攻击者创建或使用多个假身份来获取系统信任并侵犯用户隐私 \\[49\\]。\n\n应用层直接面向终端用户。针对应用层的主要攻击包括：\n\
  \n*   *恶意脚本*：攻击者利用远程连接向被攻击物联网设备注入看似合法的脚本，该脚本会被设备软件自动执行。攻击成功后，用户可能面临数据盗取、系统故障等后果\
  \ \\[50\\]。\n\n*   *数据扭曲*：攻击者修改物联网设备生成的数据，并将其写入物联网系统服务器，服务器通常用于数据存储和用户检索 \\[48,\
  \ 50\\]。\n\n#### 19.3.2.4 LoRa 和 LoRaWAN 通信协议\n\n我们决定将安全分析聚焦于更适合本用例的无线通信协议：LoRaWAN\
  \ 通信协议。Long Range（LoRa）是一种专为物联网应用设计的调制技术。该技术提供长距离连接、低功耗节点、抗噪声和干扰的通信，但代价是数据速率较低。它采用\
  \ Chirp Spread Spectrum（CSS）调制技术，通过在宽带上扩展信号，降低信噪比（SNR）并提升覆盖范围。LoRa 通信使用非授权 ISM 频段，从而降低部署成本，不同地区可使用不同频率集合\
  \ \\[51\\]。\n\nLoRaWAN 是实现物联网设备与互联网用户之间端到端通信的应用层协议。由于其低成本、低功耗，它是目前被广泛采用的物联网通信协议之一。它被视为户外物联网应用的理想解决方案，因其具备宽覆盖范围。但该特性也使其更易受干扰和攻击。LoRaWAN\
  \ 网络采用星形星形（star-of-stars）拓扑结构，主要由以下四个组件组成：(1) 终端设备，(2) LoRa 网关，(3) 网络服务器，(4) 应用服务器。LoRa\
  \ 网关负责转发数据包，具备 LoRa 接口以与 LoRa 设备通信，同时连接位于互联网上的网络服务器。网络服务器通过标准 IP 技术将数据包转发至应用服务器，并向终端设备发送下行消息和\
  \ MAC 命令 \\[52, 53\\]。图 19.12 展示了典型 LoRaWAN 网络架构的示意图。\n\n```\n![Figure 19.12 LoRaWAN\
  \ network architecture.](img/fig19_12_B.jpg)\n```\n\nFigure 19.12 LoRaWAN network\
  \ architecture.\n\n#### 19.3.2.5 LoRaWAN 网络中的干扰攻击\n\n干扰攻击是无线传感器网络（WSN）和物联网系统中最常见的攻击类型之一。其主要有四种类型\
  \ \\[54, 55, 56 和 57\\]：\n\n\n\n\n*   *Constant jammer:* 这个干扰器发出强大的信号，干扰合法用户的信号。它始终处于激活状态，并且由于持续占用信道，阻止用户访问信道。攻击者可以在整个\
  \ LoRaWAN 通信使用的频谱上进行这种攻击，或者仅在部分信道上进行 \\[55, 57, 58\\].\n\n*   *Deceptive jammer:*\
  \ 攻击者发送与 LoRaWAN 包相对应的比特字符串，模拟合法节点 \\[57\\].\n\n*   *Reactive jammer:* 它与常规干扰器类似，但它遵循“先监听再干扰”的概念，而不是始终激活。它监听\
  \ LoRaWAN 频道，并在检测到合法包传输时才发射干扰射频信号 \\[57, 59, 60\\]。与前两种干扰技术相比，它更节能，但必须尽快响应以在检测到包传输时立即行动。\n\
  \n*   *Random jammer:* 它与反应式干扰器类似，但它在随机时间间隔内开启，而不是监听信道并相应行动，并且保持固定的激活时间。与常规干扰器相比，它被认为是更不具破坏性且更节能的干扰器。\n\
  \nVarious studies in the literature analyze the behaviors of the LoRaWAN protocol\
  \ under jamming attacks. Ref. \\[61\\] evaluates the behavior of LoRaWAN under channel-aware\
  \ jamming (a reactive jamming), and channel-oblivious jamming (a continuous jamming).\
  \ Simulation results show that the LoRaWAN protocol is vulnerable to such jamming\
  \ with degradation in both end device throughput and gateway performance. A reactive\
  \ jammer was designed in \\[62\\] by using special hardware components to provide\
  \ LoRaWAN connectivity. The jammer introduced in Ref. \\[62\\] is based on two parameters:\
  \ (1) Channel Active Detection (CAD) and (2) Received Signal Strength Indicator\
  \ (RSSI). The jammer consists of two parts: the detector and the jammer. The detector\
  \ examines the CAD for preamble checking, and, once detected, the jammer checks\
  \ the RSSI value before deciding whether to jam the signal or not. A similar reactive\
  \ jammer is presented in Ref. \\[63\\]: it uses the concept of CAD detection on\
  \ a specific channel and a spreading factor causing collisions at the gateway level\
  \ by transmitting a jamming signal with higher power. Ref. \\[64\\] presents a LoRaWAN\
  \ jammer based on low-cost commercial devices and able to transmit a signal with\
  \ a higher signal strength than the legitimate one. A selective jamming and a combination\
  \ of selective and wormhole jamming are introduced in Ref. \\[65\\]: the selective\
  \ jammer detects and receives the LoRaWAN packets and then jams the channel immediately;\
  \ the integrated selective and wormhole jammer is composed of a sniffer and jammer,\
  \ the sniffer detects, receives, and records the LoRaWAN packets and then triggers\
  \ the jammer when enough content is received. Once the signal is received by the\
  \ jammer, it launches the attack.\n\n#### 19.3.2.6 Reactive LoRa Jammer Design and\
  \ Test\n\nTo assess the robustness of a LoRaWAN IoT network against jamming attacks,\
  \ we designed a reactive jammer aimed at interrupting LoRa signals and packet transmissions\
  \ generated by a LoRa device before being received by the gateway. Figure 19.13\
  \ shows the logical structure of the LoRa jammer.\n\n![Figure 19.13 Logical structure\
  \ of the developed LoRa jammer.](img/fig19_13_B.jpg)\n\nFigure 19.13 Logical structure\
  \ of the developed LoRa jammer.\n\nThe jammer is composed of two SDR cards and a\
  \ Linux system equipped with GNU Radio software that can be used also alone depending\
  \ on the test purpose, as shown in Figure 19.14. In detail, the Linux-based PC equipped\
  \ with GNU radio and two SDR cards acts as the LoRa signal jammer (red part). The\
  \ PC runs the GNU radio software with the gr-LoRa module. ![Figure 19.14 LoRa jammer\
  \ testbed scheme.](img/fig19_14_B.jpg)\n\nFigure 19.14 LoRa jammer testbed scheme.\n\
  \nThe LoRa reactive jammer can interfere with the LoRa signal and completely disrupt\
  \ the communication between end devices and the gateway. The jamming signal is based\
  \ on continuous up-chirp and down-chirp signals sent for 1 second after a LoRa transmission\
  \ is detected.\n\nFigure 19.15 shows a successfully jammed LoRa signal which is\
  \ not received by the gateway.\n\n ![Figure 19.15 RF spectrum of a successfully\
  \ jammed LoRa packet.](img/fig19_15_B.jpg)\n\nFigure 19.15 RF spectrum of a successfully\
  \ jammed LoRa packet.\n\nThe performance of the jammer may depend on different factors,\
  \ such as the distance between the jammer and end devices and/or gateway, which\
  \ affects the jammer’s reliability. We carried out other tests by increasing the\
  \ distance between the jammer and attacked IoT device and sometimes a packet can\
  \ pass through, as shown in Figure 19.16.\n\n![Figure 19.16 RF spectrum of a successfully\
  \ received LoRa packet](img/fig19_16_B.jpg)\n\nFigure 19.16 RF spectrum of a successfully\
  \ received LoRa packet\n\n## 19.4 Conclusions\n\nThis work shows a practical use\
