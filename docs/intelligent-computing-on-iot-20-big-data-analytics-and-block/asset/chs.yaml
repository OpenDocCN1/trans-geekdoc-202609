  \ 16.6 展示了使用不同部署技术时 MobileNetV2 的推理延迟。分段部署系统能够在机器人和云端之间平衡执行效率，并考虑网络传输延迟。因此，系统的总延迟最低，满足实时系统的要求。\n\
