  \ | 任何人都不能审查/审计区块链 | 联盟成员中选定的成员可以审查/审计区块链 |\n\n### 12.5 区块链医疗应用场景\n\n区块链在 MIoT 中的一个重要特点是患者拥有数据所有权。医疗数据随时间戳和其他信息记录，以确保透明。随着区块链在金融领域已经奠定基础，患者可以通过区块链钱包进行支付。区块链基于的医疗系统能够提供患者近乎实时的数据，从而让医生根据数据精准开药\
  \ \\[39\\]. 这不仅让医疗机构受益，患者也能够出售或自愿提供数据用于科研，并积极参与实验和分析。此外，区块链可记录患者的药物记录，帮助医疗研究人员选择并跟踪新药或疫苗的临床试验，依赖区块链数据。如果某些患者对药物出现化学反应，医生可以迅速开具替代药物。\n\
  \n#### 12.5.1 患者中心 MIoT 数据\n\n\n\n-   存储和维护患者病历是一项挑战性任务，即使在基础设施完善的发达国家也如此。政府、地方政府和医疗中心面临数据不完整、不可靠且无法为患者的历史健康提供任何洞察的挑战，因此许多医疗错误发生。医疗错误是指医生依赖于历史数据，但这些数据被篡改或记录不清而导致的错误。由于这些错误，每年在美国有大量死亡。[Figure\
  \ 12.9 展示了一个避免此类医疗错误的抽象模型 \\[40\\]。\n\n![Figure 12.9 A potential model to improve\
  \ patient care and facilitate.](img/fig12_9_B.jpg)\n\nFigure 12.9 A potential model\
  \ to improve patient care and facilitate.\n\n### 12.5.2 Cost Reduction\n\n将区块链引入医疗生态系统可以通过简化底层流程来降低运营成本。研究\
  \ \\[41\\] 显示，医疗行业在几年内就能将运营成本削减至上百亿美元。这种削减之所以可能，是因为区块链可以降低数据安全成本 \\[42\\]，因为区块链不易被黑客攻击，同时还能降低管理和行政成本、保险欺诈以及其他相关运营成本。Figure\
  \ 12.10 展示了美国的年度支出，我们可以观察到图表呈现出持续上升的趋势。\n\n![Figure 12.10 US per year healthcare\
  \ expenditures.](img/fig12_10_B.jpg)\n\nFigure 12.10 US per year healthcare expenditures.\n\
  \n### 12.5.3 Identity and Credential Verification\n\n区块链可以帮助医疗系统存储和追踪医务人员数据 \\[43\\\
  ]。因此，医务人员的某些资质可以随时在线验证。在医生前往其他医疗机构的使用案例中，该机构可以验证医生的资质。这种身份和资质验证有助于医疗机构轻松招募医生。同样，如果因缺乏专科医生而医院需要求助，区块链也能验证医生的资质，因为在该场景中这非常重要。所有处方和诊断记录都将在区块链上维护，以备将来参考。\n\
  \n### 12.5.4 Smart Contract-Based Insurance for Fraud Detection\n\n保险欺诈在全球范围内普遍存在，各国仍在努力减少此类挑战\
  \ \\[44\\]。通过构建智能合约并将其与区块链连接，可以减少保险合同争议。传统上，合同分别由客户与医院、客户与保险公司签订，这导致诸多争议，例如某些疾病缺乏覆盖。维护一个单一的智能合约将对所有相关方都可用，并可在需要时进行检查。患者和医院可以查看合同的单一版本，从而减少保险欺诈。\n\
  \n### 12.5.5 IoT-Based Secure Remote Monitoring\n\n远程监测已被广泛采用，并使医疗行业能够采取主动措施。区块链可以在该使用案例中部署，因为它能确保只有合法或授权用户才能从远程传感设备中检索数据\
  \ \\[45\\]。\n\n## 12.6 Blockchain with Machine Learning\n\n机器学习（ML）是人工智能的一个子类，如图\
  \ 12.11 所示。ML 是一种过程，它教会计算机（算法）分析并从提供的数据中学习特定特征，使算法的决策过程达到无需进一步人工干预的程度。\n\nML 主要用于解决回归和分类问题。ML\
  \ 分为四种类型：\n\n*   监督学习\n\n*   无监督学习\n\n*   半监督学习\n\n*   强化学习\n\n### 12.6.1 Supervised\
  \ Learning\n\n监督学习基于模型，试图通过参数化的超调参数调整过程，建立预测输出与原始输出之间的关系。要训练监督学习模型，需要标记数据。标记数据确保模型能够提取准确的特征。\n\
  \n![Figure 12.11 Artificial Intelligence in a glance.](img/fig12_11_B.jpg)\n\nFigure\
  \ 12.11 Artificial Intelligence in a glance.\n\n如果第一个 epoch 后错误较高，算法会调整权重，尝试使预测输出与提供的标记输出匹配。回归问题常见的误差函数有均方误差和绝对误差。均方误差和绝对误差的数学表达式分别在\
  \ Eq. 12.1 和 12.2 中表示。\n\n(12.1)  \n\n$$~Mean~Squared~Error~ = \\\\frac{\\\\sum\\\
  _{i = 1}^{n}{(y\\_{i} - \\\\hat{y})}^{2}}{n}$$  \n\n(12.2)  \n\n$$\\\\text{Mean~Absolute~Error~}\
  \ = \\\\frac{\\\\sum\\_{i = 1}^{n}\\\\left| {y\\_{i} - {\\\\hat{y}}\\_{i}} \\\\\
  right|}{n}$$  \n\n### 12.6.2 Unsupervised Learning\n\n无监督学习主要处理未标记的聚类问题。与监督学习不同，监督学习需要标记数据来训练模型，而无监督学习则试图理解未标记数据中的隐藏模式，以赋予或预测数据点的准确聚类。为了构建稳健的模型，通常会尝试减小聚类中心点的欧几里得距离。Figure\
  \ 12.12 展示了在二维空间中计算欧几里得距离的公式。\n\n![Figure 12.12 Two-dimensional Euclidean distance.](img/fig12_12_B.jpg)\n\
  \nFigure 12.12 Two-dimensional Euclidean distance.\n\n### 12.6.3 Semi-Supervised\
  \ Learning\n\n半监督学习结合了监督学习和无监督学习的优势。半监督学习解决了标记数据不足以及因缺乏标记数据导致模型收敛错误的问题。半监督学习利用标记和未标记数据共同训练模型，从而节省了对大量数据集进行标记所需的时间和成本。常用的交叉熵误差函数的变体用于评估模型，如数学表达式\
  \ Eq. 12.3 所示。\n\n(12.3)  \n\n$$\\\\text{~loss~} = \\\\left\\\\{ \\\\begin{matrix}\
  \ {\\\\left. \\\\text{~crossentropy~}\\\\left( {x\\_{i},y\\_{i}} \\\\right) + \\\
  \\right\\\\| f\\_{\\\\theta}\\\\left( x\\_{i} \\\\right) - f\\_{\\\\theta}\\\\left(\
  \ {x\\_{i} \\\\| \\\\text{augumented}\\\\left( x\\_{i} \\\\right)\\\\|_{2}^{2},x\\\
  _{i} \\\\in X\\_{\\\\text{labelled~}}} \\\\right. \\\\\\\\ \\\\left\\\\| f\\_{\\\
  \\theta}\\\\left( x\\_{i} \\\\right) - f\\_{\\\\theta}\\\\left( {x\\_{i} \\\\| \\\
  \\text{augumented}\\\\left( x\\_{i} \\\\right)\\\\|_{2}^{2},x\\_{i} \\\\in X\\_{\\\
  \\text{unlabelled~}}} \\\\right. \\\\right. \\\\end{matrix} \\\\right$$  \n\n###\
  \ 12.6.4 Reinforcement Learning\n\n强化学习（RL）与人类学习过程非常相似。人类通过自身行动的反馈来学习。同样，强化学习依赖于环境的反馈来学习。人类所做的每一次行动都有后果。后果可以是正面的也可以是负面的。如果行动的结果是正面的，人类倾向于沿着这条路走；否则，他们会在未来避免产生负面结果的行为。强化学习亦是如此：对于每个良好行为或正面反馈，会给予奖励；如果行动导致负面或不良反馈，则会给予惩罚，以确保在学习后模型会避免产生负面反馈的行为。与监督学习一样，强化学习不使用标记数据，但通过反馈进行学习。Figure\
  \ 12.13 展示了强化学习的基本工作流程。强化学习中有一些特定的术语，如代理、环境、动作、状态、奖励、策略、价值和 Q 值。\n\n![Figure 12.13\
  \ Reinforcement learning workflow.](img/fig12_13_B.jpg)\n\n\n\n\n-   图 12.13 强化学习工作流程\n\
  \n总体而言，代理在不知道反馈将会是什么的情况下，被编程去作用于环境。它类似于试错法，只有当行动产生正回报时，反馈才提供信息；否则，代理将面临惩罚。在 RL 中使用的符号在\
  \ 图 12.14 中所示。\n\n图 12.14 RL 中的符号\n\n| Symbol || Meaning |\n| --- | --- |\n| *s*\
