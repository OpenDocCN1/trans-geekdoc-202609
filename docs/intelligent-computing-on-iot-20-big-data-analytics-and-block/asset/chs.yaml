  \ || **`1/5`** || **`3/5`** || **`5/5`** |\n\n**QoS**：Sigfox 与 LoRaWAN 不提供 QoS；NB‑IoT\
  \ 使用授权频段和基于 LTE 的同步协议，能够在牺牲成本的情况下实现 QoS。因 QoS 与成本的权衡，NB‑IoT 适合需要保证服务质量的应用，而 Sigfox\
  \ 或 LoRaWAN 则适用于对 QoS 无严格要求的场景。IEEE 802.11ah 提供中等 QoS。\n\n**Battery life**：Sigfox、LoRaWAN\
  \ 与 NB‑IoT 的终端设备均在应用所需的时间内保持睡眠模式，以降低能耗。NB‑IoT 设备因需同步、QoS 处理以及 OFDM/FDMA 接入而消耗更多能量，导致其端末使用寿命相对\
  \ Sigfox 和 LoRaWAN 更短。\n\n**Latency**：NB‑IoT 连接提供极低的 IoT 延迟；LoRaWAN Class C 设备也能实现低双向延迟，但功耗较高。相反，Sigfox\
  \ 与 LoRaWAN Class A 设备延迟较高，不适合对低延迟有要求的 IoT 应用。\n\n**Cost and Scalability**：相较于 NB‑IoT，Sigfox\
  \ 与 LoRaWAN 在成本上更具优势。三者均能支持数千个终端设备，具备良好可扩展性；但 NB‑IoT 的可扩展性远超 Sigfox 与 LoRaWAN，单基站可支持超过\
  \ 10 万设备。\n\n### 18.4.1 Application Examples\n\n物联网领域涵盖广泛的应用与设备，最佳技术取决于应用特性以及上述无线通信技术的差异，因而不存在单一适用于所有场景的通用标准。每种方案因其在各项网络需求上的优势与局限而适合特定\
  \ IoT 场景。例如，**智能电表** 与 **农业传感器** 具有极小的负载和间歇性传输需求，LoRa 能够满足；而 **公共安全** 或 **共享单车**\
  \ 应用需要频繁、大容量的数据发送和移动性支持，NB‑IoT 更为合适。下面依次介绍几类典型应用场景，提供各技术适配情况的概览 \\[12, 13 and 14\\\
  ]。\n\n- **高速数据需求**（如视频流）主要由 **LTE** 或 **Wi‑Fi** 支持；中等速率（智能家居）和低速率（监测传感器）则由 **ZigBee、BLE、LTE‑M**\
  \ 以及 **LPWAN** 技术覆盖。Wi‑Fi 速度约是 BLE 的 20–30 倍，适合大文件传输。\n\n- **延迟敏感** 应用（自动驾驶、医疗系统）最适合\
  \ **Wi‑Fi、BLE、Wi‑Fi HaLow、ZigBee、LTE‑M**；而 **延迟容忍** 的应用（Sigfox、NB‑IoT、LoRa）则更合适。\n\
  \n\n\n\n此外，蓝牙是个人物联网设备（如健身可穿戴设备和追踪器）的理想选择。蓝牙能够持续广播大量数据，长期以来一直受到消费电子行业的青睐。此外，BLE 是专门为低功耗物联网设备设计的。由于设备被设计为支持睡眠模式，BLE\
  \ 最适合用于在间歇性传输少量数据的设备。\n\n另一方面，网格技术适用于家庭内部应用和相邻项目，如智能照明、安防系统、暖通空调系统和遥控器。ZigBee 和\
  \ Z-Wave 能够使用网格拓扑结构，通过相互连接的节点在短距离到中距离传输小数据包。\n\n在电力计量应用领域的企业通常需要频繁通信、低延迟和大数据速率。由于电力计量仪表提供持续的电源，它们不需要低能耗或长电池寿命。此外，企业希望实时监控电网以驱动时间敏感的决策机制。因此，Sigfox\
  \ 的延迟较高，不适合用于时间敏感的应用。电力计量仪表，另一方面，可以通过 LoRaWAN Class-C 连接以确保持续观测。然而，NB-IoT 是此类应用的最佳选择，因为它提供持续且高速的数据连接。\n\
  \n传感器设备的电池寿命在农业物联网应用中至关重要。利用传感器（如温度、湿度和碱性）产生的关键信息来调节水供应，可能会影响产量。由于环境条件变化不大，设备会稀疏地更新传感器数据。因此，Sigfox\
  \ 和 LoRaWAN 是农业应用的极佳选择。此外，由于许多农场缺乏 LTE 移动网络连接，NB-IoT 云在未来也不会成为农业选项。\n\n实时机器监控会调整工业生产线的运行参数，并实现远程控制以提高效率。在工厂自动化中，选择合适的物联网技术取决于使用场景的要求。NB-IoT\
  \ 在需要频繁通信和良好服务质量的应用中表现更佳；而 Sigfox 和 LoRaWAN 则更适合成本低、能效高的应用，如资产追踪和状态监测。另一种满足多样化需求的选择是混合解决方案。\n\
  \n温度、湿度、安全、水流和电源插座传感器会向物业管理员发出警报，以便在不亲自监控建筑的情况下及时防止损坏并响应请求。建筑清洁度和利用率也可以得到改善。这些传感器需要成本低廉且电池寿命长。由于它们不要求高服务质量或频繁通信，Sigfox\
  \ 和 LoRaWAN 更适合此类应用。\n\n销售点系统需要保证服务质量，因为它们管理常规通信。由于这些设备使用持续的电力供应，电池寿命并不受限制。此外，还对低延迟有强烈需求（因为延迟时间过长会限制商店可进行的交易数量）。因此，NB-IoT\
  \ 是此类应用的最佳匹配。\n\n## 18.5 Application Layer\n\n三层架构（包含感知层、网络层和应用层）构成了物联网技术最常见的架构形式。总体而言，感知层代表负责从部署环境中获取适当信息的物理实体，网络层负责将感知层提供的数据传输至应用层，而应用层则包含提供特定服务所需的全部软件，并确定应用层消息传递的协议集合。本节讨论最常用的应用层协议。\n\
  \n### 18.5.1 Constrained Application Protocol (CoAP)\n\nConstrained Application\
  \ Protocol (CoAP) 是专为资源受限的小型设备（如内存或 CPU 能力有限、网络带宽低、数据速率受限、丢包率高的网络）设计的网页传输协议。CoAP\
  \ 是一种请求/响应协议，类似于 HTTP 的客户端/服务器模型。除轻量化（其主要优势）之外，它通过 UDP 支持单播和组播请求，并具备异步消息交换的能力 \\\
  [15\\]。此外，它在头部开销小、解析复杂度低的同时，还提供了简单的代理和缓存功能。\n\n一般来看，CoAP 请求由客户端使用方法代码（Method Code）在服务器上标识的\
  \ URI 资源上发送。随后，服务器发送响应，响应代码（Response Code）如图 18.8 所示（Figure 18.8）。CoAP 分为两层：消息层和请求/响应子层，其标准定义了四种消息类型：确认（Confirmable）、非确认（Non-confirmable）、确认报文（Acknowledgment）和复位（Reset）。确认和非确认消息携带请求或响应，而后者还可以在确认报文中携带。\n\
  \n![Figure 18.8 CoAP operation.](img/fig18_8_B.jpg)\n\nFigure 18.8 CoAP operation.\n\
  \nCoAP 的最低层负责通过 UDP 在端点之间交换消息。每条消息（无论是确认（CON）消息还是非确认（NON）消息）都包含一个唯一 ID 以防止重复。CON\
  \ 消息是可靠的消息，确保消息能够到达服务器端。此确认由初始消息的接收方通过发送确认报文（ACK）来完成。如果任何一方在处理 incoming request\
  \ 时遇到困难，可以发送复位（RST）消息而非 ACK。对于 NON 消息，接收方无需执行额外操作。CoAP 的上层负责处理 CON 和 NON 消息的请求。服务器是否接受请求取决于其可用性：如果服务器能够立即回答\
  \ CON 请求，则会在 ACK 中返回响应（响应报文携带在 ACK 内）；否则，服务器会返回一个带空响应的 ACK。当响应准备好后，服务器会再次发送一个新的\
  \ CON 消息给客户端，包含该响应。在此过程中，客户端向服务器发送 ACK 消息。如果客户端的请求使用的是 NON 消息，则服务器也会以 NON 消息形式返回响应。\n\
  \n\n\n\nMQTT 通信使用 TCP 作为传输协议，并通过 SSL/TLS 实现安全性，它基于发布/订阅系统工作，客户端可以在特定主题上发布消息，同时所有订阅该主题的客户端都能接收该消息\
  \ (`/path.to/xxx`)[16]。除了客户端，MQTT 协议还定义了一个额外的网络实体，即经纪人（或服务器）。经纪人负责协调所有订阅系统的客户端之间的通信。客户端可以是订阅者或发布者。通常，发布者在有更新或周期性消息时会将消息发送给经纪人，然后经纪人过滤接收到的消息并将其分配给正确的订阅者。MQTT\
  \ 包含 14 种消息类型，其中四种由客户端使用（CONNECT、PUBLISH、SUBSCRIBE、UNSUBSCRIBE），其余类型用于内部机制和消息流。根据可靠性要求和传输需求，MQTT\
  \ 确定了三种服务质量（QoS）等级（0、1、2）。\n\n![Figure 18.9 MQTT operation.](img/fig18_9_B.jpg)\n\
  \nFigure 18.9 MQTT operation.\n\n### 18.5.3 Advanced Message Queuing Protocol (AMQP)\n\
  \nAMQP 是一种基于可靠且高效消息队列的发布/订阅模型。OASIS 负责标准化。AMQP 如今在商业和业务系统中被广泛使用。该协议的主要优势在于其可扩展性，这得益于所采用的发布/订阅方法。AMQP\
  \ 还支持多种通信语言的设备之间的互操作性和异构性。AMQP 协议的消息可以在 AMQP 协议应用之间交换。为实现可靠性、安全性和性能，AMQP 定义了三种消息递送保证：至多一次、至少一次和恰好一次。\n\
  \n为确保可靠性，该协议还利用了 TCP 传输层。AMQP 的发布/订阅技术由两部分组成：交换机和消息队列 (`/path.to/xxx`)[16]。交换机负责将消息路由到适当的队列中。消息会在消息队列中保存，直到被传输到接收方。为了在交换组件和消息队列之间交换消息，使用了一种专用方法及一套规则。\n\
  \n![Figure 18.10 AMQP operation.](img/fig18_10_B.jpg)\n\nFigure 18.10 AMQP operation.\n\
  \n该协议极具可扩展性，并且在不同平台和环境之间可互操作；它非常适合工业环境应用。然而，它不适合受限环境或实时应用，并且缺乏自动发现机制。\n\n### 18.5.4\
  \ Extensive Messaging and Presence Protocol (XMPP)\n\nIETF 已经标准化了可扩展消息和存在协议（XMPP），它如今是物联网中最常用的通信和消息协议之一。XMPP\
  \ 是一组开放技术的集合，能够实现即时通信、存在感、多方聊天、语音和视频通话、协作、轻量中间件、内容分发以及通用 XML 数据路由。\n\n这是一个众所周知的协议，已在所有网络中被广泛使用。XMPP\
  \ 协议能够满足物联网需求，因为它支持微型消息、提供安全性以及最小延迟；这些特性使得 XMPP 成为物联网通信和消息的强选择。XMPP 的去中心化特性使其具备高度可扩展性。XMPP\
  \ 协议拥有多种增强功能，使其能够在无基础设施的环境中工作。\n\nXMPP 协议支持请求/响应和发布/订阅两种模型 (`/path.to/xxx`)[15]。拥有唯一名称的客户端通过关联服务器与另一客户端进行通信。客户端形式的协议由每个客户端实现，而服务器提供路由功能。请求/响应模型支持双向通信，而发布/订阅模型支持多向通信（推送和拉取数据）。\n\
  \n![Figure 18.11 XMPP operation.](img/fig18_11_B.jpg)\n\nFigure 18.11 XMPP operation.\n\
  \nXMPP 协议使用 XML 进行文本对话，这可能会导致网络流量开销，尽管可以通过使用 EXI 对 XML 进行压缩来避免。该协议简单易用，可在各种项目和应用中使用。它是一个可扩展且适应性强的协议，基于其构建了许多扩展。另一方面，它也存在一些缺陷：带宽和\
  \ CPU 使用量大，没有 QoS 保证，且仅限于简单数据类型。\n\n## 18.6 Conclusion\n\n近年来，物联网连接和互连的物联网设备数量呈现出巨大的增长。实现物联网愿景只能通过整合各种无线通信技术来实现，这些技术受到各类应用需求的驱动。为此，本章提供了物联网行业最适合的无线通信网络技术的概览，这些技术按传输距离分为短距离和长距离两类。对每种通信技术的关键特性进行了详细阐述，并就其在可靠性、安全性、可扩展性、覆盖范围、成本和能效方面的性能优势和劣势进行了分析。一个重要的未来挑战是设计能够支持所展示网络技术多样性的架构。在这方面，未来的物联网网络必须具备在不同网络协议之间提供互操作性的能力。\n\
