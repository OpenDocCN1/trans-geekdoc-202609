  _{1} + \\\\mu\\_{2}}$ and this immediately yields the stated result. □\n### 8.5\
  \ Performance Metrics\n\n\n\nIn 这部分，列出了关于提议 *M*^(\\[*X*\\*)/*M*^(\\[*b*\\])/1 模型的各种重要系统性能指标及其表达式。\n\
  \n1. *P*(server being idle) = `y[0]e`.\n\n2. *P*(server is idle with no transactions\
  \ waiting) = `y[0]e[1]`.\n\n3. *P*(server is busy processing transactions) $= \\\
  \\underset{i = 1}{\\\\overset{\\\\infty}{\\\\sum^{}}}y\\_{i}\\\\left( {e \\\\otimes\
  \ e\\_{1}} \\\\right) = \\\\frac{\\\\lambda}{b\\\\mu\\_{1}}.$\n\n4. *P*(system is\
  \ busy pegging a block) $= \\\\underset{i = 1}{\\\\overset{\\\\infty}{\\\\sum^{}}}y\\\
  _{i}\\\\left( {e \\\\otimes e\\_{2}} \\\\right) = \\\\frac{\\\\lambda}{b\\\\mu\\\
  _{2}}.$\n\n5. The mean, the variance, the median, and the mode of the number in\
  \ the system for the QBD approach study can be computed. While the mean and the\
  \ variance can be computed using the following expressions, the other measures need\
  \ to be obtained numerically from the steady-state vectors.\n\n    $$\\\\begin{array}{l}\
  \ {E(N) = \\\\underset{n = 1}{\\\\overset{\\\\infty}{{\\\\sum^{}}^{}}}ny\\_{n}^{(1)}\
  \ = y\\_{0}^{(1)}\\\\left( {I \\\\otimes \\\\beta} \\\\right)R\\\\left( {I - R}\
  \ \\\\right)^{- 2}e,} \\\\\\\\ {V\\\\left( N \\\\right) = E\\\\left( N^{2} \\\\\
  right) - \\\\left\\\\lbrack \\\\left( N \\\\right) \\\\right\\\\lbrack^{2} = y\\\
  _{0}^{(1)}\\\\left( {I \\\\otimes \\\\beta} \\\\right)\\\\left( {\\\\left( {I +\
  \ R} \\\\right)\\\\left( {I - R} \\\\right)^{- 1} - \\\\left( {I - R} \\\\right)^{-\
  \ 2}\\\\left( {I \\\\otimes \\\\beta} \\\\right)} \\\\right)\\\\left( {I - R} \\\
  \\right)^{- 2}e.} \\\\\\\\ \\\\end{array}$$  \n\n6. Since the model is work-conserving,\
  \ the latency (or the mean waiting time in the system, *E( W*)) can be derived using\
  \ Little’s result, *E(N) = λE(W).*\n\n7. The mean recurrence time (time between\
  \ successive visits to **0**): $\\\\mu\\_{RT}^{\\\\prime} = \\\\frac{1}{y\\_{1}Fe}.$\n\
  \n8. The mean idle time: $\\\\mu\\_{I}^{\\\\prime} = \\\\frac{1 - \\\\rho}{y\\_{1}Fe}.$\n\
  \n9. The mean busy period: $\\\\mu\\_{BP}^{\\\\prime} = \\\\frac{\\\\rho}{y\\_{1}Fe}.$\n\
  \n10.  The mean number (of groups of size *b*) served = µ[NS] = µµ'[BP].\n\n## 8.6\
  \ Numerical Analysis\n\nIn this section, we will discuss about a few numerical illustrations\
  \ that highlight the qualitative features of the model under consideration. In Example\
  \ 8.1, we consider Poisson distribution for batch sizes in the arrival process.\n\
  \n### 8.6.1 Poisson Batch Size\n\nWe assume that the arriving batch is of size *k*\
