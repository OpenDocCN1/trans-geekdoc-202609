  \ 4.5.1 Definition\n\n“区块链常与比特币关联。它是由全球数千台计算机维护的、由全球网络验证的、分布式的、受信任的交易数据库。与银行等中央机构不同，广泛的社区监督记录，且无人能够修改或删除交易历史。与集中式数据库不同，区块链的分布式结构和点对点验证防止信息被篡改。区块链在软件用户之间分布，而集中式数据库居于单一服务器上。区块链使网络中的每个人都能查看其他人的条目，使中心控制变得不可能。当某人执行交易时，计算机算法会验证其合法性。一旦交易被验证，它会与前一个交易相连，形成链——这就是区块链\
  \ \\[17\\]。区块链是一个去中心化的点对点网络。比特币是基于区块链的数字账本，广泛使用。比特币的复杂算法和去中心化网络使用户可以挖矿、存储和交换比特币。区块链可用作资产登记和库存管理。\n\
  \n### 4.5.2 Blockchain—Background\n\n“New Directions in Cryptography” 探讨了分布式账本。Stuart\
  \ Haber 和 Scott Stornetta 的 “Hot to Time-Stamp a Digital Document” 提出在数据而非介质上进行时间戳，随着加密技术的发展。基于\
  \ David Chaum 的 “electronic cash” 或 “digital currency” 模型，也为区块链的创建作出了贡献，随后出现了能够检测双重支出的协议。Adam\
  \ Back 在 1997 年创建了 “hash cash” 以应对垃圾邮件。\n\n\n\n\nWei Dai 创建了基于点对点网络的“b-money”。当他于\
  \ 2008 年发布《Bitcoin: \\[18\\] A Peer-to-Peer Electronic Cash System》时，Satoshi Nakamoto\
  \ 发明了区块链技术。该文章的摘要是关于无需第三方的直接 Internet 支付。文章描述了一种密码支付机制。Nakamoto 在文中提出了一种数字货币，该货币在写作中不能被复制或重复花费。根据报告，应使用公共账本来追踪和验证电子硬币的交易历史，从而防止重复支出。Satoshi\
  \ Nakamoto 于 2009 年初设计了第一个比特币，几个月后提供了开源软件以实现该系统。比特币继续被铸造和推广，并已解决社区支持的代码缺陷。\n\n比特币占据了狮子的市场份额，使其成为最受欢迎的加密货币\
  \ \\[19\\]。它可以让用户保持一致，但其开放性使其闻名。2013 年，投资者开始向比特币初创公司倾注资金。比特币可以与现金或商品进行交易。钱包软件让用户通过电脑、移动设备或\
  \ Web 应用转移比特币。2015 年，Ethereum 允许区块链通过贷款和合约运行。其智能合约算法确保两方的行动。其速度、安全性和效率使其闻名 \\[20\\\
  ]。\n\n### 4.5.3 区块链概述\n\n本节涵盖区块链的基础知识，包括概念、设计要素、优势和种类。本章介绍了区块链 Peer-to-Peer Electronic\
  \ Cash（即比特币）的概念，并列出了 Nakamoto 在 2008 年提出的两项突破性技术。第一个区块链是比特币，一种去中心化的数字货币。区块链是由加密复杂算法连接的单个区块组成的网络。\n\
  \n在分布式数据库上，该方法通过哈希（一种数字指纹）将数字资产存储在区块中，哈希是一种数字指纹（Cirstea et al., 2018; Woodside et\
  \ al., 2017）。区块链是“提供透明度和信任的分布式账本系统”（Linn & Koo, n.d., p. 2）。根据 Koshechkin 等人 \\\
  [21\\]，区块链是一个点对点网络和无中心服务器的开放数据库。本质上，区块链是经区块链参与方审查和验证的安全交易账本。区块链通过在任何时刻准确呈现现实，为商业信任提供保障。\n\
  \n类似于状态机，区块链在存储和修改之前的状态的同时，保持永久记录。时间不可逆（Adams et al., 2017）。区块链的优势之一是“哈希”。每个新加入链中的区块都有一个由区块创建日期决定的“哈希”代码。流行的密码安全策略是“哈希”。每个新区块的哈希包含前一个区块的哈希。因此，伪造区块很困难。未来区块的哈希由前一个区块的哈希决定，所以修改单个区块需要完全重写区块链。这些障碍作为防止篡改的阀门（Hughes\
  \ & Morrow, 2019; White, 2017）。\n\n区块链最初是为了安全地交易和存储比特币。这种基于区块链的数字货币工具支持交易、分发和发行。已添加了使用\
  \ Turing-完全编程语言的能力。智能合约得益于区块链 2.0，能够在区块链上运行。最流行的智能合约区块链平台是 Ethereum（Li et al., 2017;\
  \ Oh & Shong, 2017）。除了金融和经济事务外，Aras 和 Kulkarni（2017）。根据 Engelhardt（2017），以下企业和组织从区块链受益最大：参与方众多。参与方还需要建立信任。消除中间人可以提高效率和信任。此外，数据保留和活动监控必须可信赖。\n\
  \n### 4.5.4 区块链设计特性\n\n区块链的基本属性是其区别于其他技术的关键。Perkinson 和 Miller（2016）指出，这些设计特性在交易验证、\
  \ reconciliating（和解）以及处理争议需要大量时间和精力时尤为重要 \\[22\\]。\n\n*   区块链协议要求用户在发布交易前确认交易，以确保交易的合法性。\n\
  \n*   当双方就交易的具体细节达成一致时，区块链在交易前验证资产所有权，简化了资产转让的结算，因为交易完成后，区块生成、上传至链中、按正确顺序排列并分配时间戳，从而建立持久的顺序和时间记录。\n\
  \n*   智能合约的自动化：区块链账本可以在满足特定条件时，使智能合约自动执行。\n\n### 4.5.5 区块链技术特性\n\n文献讨论了区块链的特性。一些区块链特质促成了其他特定特性，因此列表可以简化。\n\
  \n#### 4.5.5.1 分布式\n\n分布式账本的交易可由区块链的所有用户查看，也可检查交易各方的记录。没有中央权威或独立第三方来检查或结算交易（去中心化）。所有区块链用户对数据的完整性达成一致（基于共识的数据批准）。网络中的节点不使用中央节点。节点负责存储和传输数据（点对点传输）。\n\
  \n#### 4.5.5.2 标准化规则\n\n区块链交易必须遵循相同的标准。在区块链上篡改或删除数据非常困难（持久性）（不可变性）。这归因于哈希算法和哈希标识符。不可变性并不意味着区块链数据不能被更改。修改者可以向链中添加新区块，以移除旧数据。\n\
  \n#### 4.5.5.3 隐私\n\n平台无法识别用户（节点）。每一方可以使用创建的地址在区块链上操作，而无需透露身份。用户通过区块链地址（匿名性）与区块链交互。由于内在限制，区块链上的隐私无法得到适当保护。\n\
  \n#### 4.5.5.4 可审计性\n\n交易在确认并时间戳后，使区块链数据透明且可追溯。计算技术确保所有网络用户的账本记录的持久性和按时间顺序排列（记录的不可逆性）。\n\
  \n#### 4.5.5.5 安全\n\n区块链采用高级加密技术，使用公钥和私钥让用户通过地址断言拥有资产。这些地址与用户身份不绑定，防止身份盗用。哈希关联区块，因此篡改一个区块会影响其他区块。区块链保护用户数据和交易。\n\
  \n### 4.5.6 区块链技术的益处\n\n尽管仍处于起步阶段，区块链技术已经改变了许多公司，并受到众多行业的青睐（Workie & Jain, 2017;\
  \ Beck, 2018; Herlihy, 2019; Kumar, 2019）。\n\n*   所有网络用户都能永远访问区块链的完整交易历史 \\[23\\\
  ]。所有用户都知道在数据或交易上进行的任何操作，从而促进透明度。\n\n*   业务连续性：所有公司都需要服务可用性和连续性。由于区块链技术没有单点故障，系统永不停机，从而保持业务运行\
  \ \\[24\\]。\n\n\n\n-   [去中介化：去中心化区块链基础设施促进了去中介化。该技术可以取代中介机构，提高效率并降低人们与组织之间因摩擦造成的直接和间接成本。]\n\
  \n-   [信任：区块链在不信任的各方之间创建可信的记录。良好的区块链架构确保信任，并简化了验证过程。]\n\n-   [智能合约：大多数区块链系统都具备脚本语言，以便增强账本。比特币使用基于堆栈的词汇，而以太坊使用\
  \ JavaScript，一种完全可图灵的强制性语言。所谓“智能合约”的计算机代码或软件用于数字化促进、确认和执行业务逻辑的谈判与履行。当义务得到履行时，智能合约会执行可靠的交易和活动（例如资产、金钱、股份或其他有价值物品的转让，从而消除中介或第三方的必要性。传统系统可以使用智能合约，但区块链因其高质量和数据可访问性，是它们最理想的场所。]\n\
  \n### 4.5.7 区块链系统类型\n\nNakamoto 在 2008 年创建了第一个基于区块链的系统——比特币。它是一种点对点的去中心化电子现金系统，也是一个去中心化的公共账本。目前，不同的区块链方法和选项既可供个人也可供企业使用。区块链数据访问（公共区块链和私有区块链）以及区块链系统访问（无需许可和有权限的区块链）可以分类（BitFury\
  \ Group, 2015; Peter & Panayi, 2015）。\n\n*   [未经授权的区块链：未经授权的区块链允许所有利益相关者验证交易。用户无需授权即可构建区块。]\n\
  \n*   [有权限的区块链：只有预先选定的用户才能在有权限的区块链中创建和验证交易块。]\n\n*   [公共区块链：任何人都可以访问数据并在公共区块链上提交交易。]\n\
  \n*   [私有区块链限制数据访问、查看和交易报告，仅向组织内部或特定组织的预设用户开放。该区块链平台结合了加密、共识机制和分布式账本。本节讨论三种区块链技术：]\n\
  \n*   [为了签署交易，区块链使用公钥加密。用户使用私钥对交易进行签名。区块链网络的接收方使用发送者的公钥验证交易签名。当交易创建时，来源或终端设备会签署交易。]\n\
  \n*   [分布式账本：区块链使用分布式存储来记录交易。所有网络节点都存储所有交易或其子集。在将交易记录到账本之前，所有网络节点通过共识方法达成一致。这使得区块链不可篡改。]\n\
  \n*   [集中式服务器不验证区块链交易。区块链采用点对点方式，所有网络决策均由共识决定。]\n\n### 4.5.8 区块链应用\n\n区块链的关键特性不仅适用于去中心化货币，还能够彻底改变各行业的商业交易模式和资产管理协议，如电子投票、汽车租赁和电影观看。其应用涵盖金融科技（FinTech）、医疗保健、治理、供应链、制造、保险、教育、物联网（IoT）、大数据、机器学习等领域。在金融科技领域，区块链可以基于分布式账本技术实现金融交易和资产管理，消除可信的第三方，加速交易服务。在保险领域，区块链可以帮助识别欺诈性索赔和遗弃的保单，从而构建透明、风险可控的系统。\n\
  \n区块链的加密特性赋予保险公司对被保险资产的所有权。物联网（IoT）指任何连接互联网的设备。区块链在物联网方面的应用范围极广 \\[25\\]，包括智能家居应用、云集成、智能城市等。医疗保健产生大量数据，包括每日患者监测报告、临床研究管理、保险索赔处理以及医疗信息的归档。\n\
  \n区块链在医疗保健领域实现了患者、医生和保险公司的记录去中心化。教育领域的区块链应用仍在试点阶段，可能用于身份管理、数字证书、区块链-enabled 证书等，使用户能够与希望验证的对象共享学术成就。电子投票让人们能够安全投票，由于区块链数据不可篡改，防止了假票行为。\n\
  \n供应链是另一关键行业，区块链在此领域具有巨大的潜力。它可以传输产品、追踪物品、在发现运输缺陷时进行赔偿，并实现更快、更便宜的交易。区块链可提升供应链效率。如前所述，区块链的应用不止于这些，研究人员正在尝试将区块链应用于更多领域。\n\
  \n下面详细描述其在上述领域的应用。\n\n#### 4.5.8.1 经济学\n\n*   快速、安全且低成本地处理支付，无需中介。\n\n*   实时转账和结算。\n\
  \n*   减少全球支付摩擦。\n\n*   降低国际支付的摩擦成本。\n\n*   无需清算中心即可进行财务结算。\n\n*   无需经纪即可交易数字股票。\n\
  \n*   通过自动化流程、支付和结算，增强贸易融资；降低欺诈风险；更快、更便宜的货物追踪；更快的文档传输。\n\n#### 4.5.8.2 会计\n\n* \
  \  实现全新的方式来捕获、处理、验证和存储财务信息。\n\n*   实现实时、经验证、透明的会计。\n\n*   降低成本、错误和欺诈；减少对账；\\[26\\\
  ] 提供审计追踪。\n\n#### 4.5.8.3 保险\n\n*   防止欺诈，建立保险市场的透明度。\n\n*   自动化索赔处理。\n\n*   提升销售、客户\
  \ onboard、承保、索赔处理、资产转移、支付和再保险。\n\n#### 4.5.8.4 供应链管理\n\n*   增加供应链的问责、可见性和透明度。\n\n\
  *   确保供应链合规，并在全链条上建立信任。\n\n*   在监控商品状态的同时验证商品的有效性和质量。\n\n#### 4.5.8.5 能源\n\n*  \
  \ 促进微网能源交换。\n\n*   实现微网交易，无需中央化管理方。\n\n*   提高智能电网能源交易的安全性和隐私性。\n\n*   支持数字货币电力交易。\n\
  \n#### 4.5.8.6 广告与媒体\n\n*   低成本的互联网广告。\n\n*   直接连接数字广告和媒体参与者，省去中间环节。\n\n*   减少广告和媒体欺诈。\n\
  \n*   增强媒体透明度。\n\n*   确保内容安全和版权。\n\n*   保护版权和媒体质量。\n\n*   保护版权和媒体质量。\n\n#### 4.5.8.7\
  \ 法律\n\n*   智能合约帮助创建和执行法律协议，提升在线法律服务的信任度。\n\n*   增强法律数据的完整性和公开性。\n\n#### 4.5.8.8\
  \ 房地产\n\n*   免除费用和佣金。\n\n*   保障交易安全。\n\n*   减少房产欺诈。\n\n*   当登记和转让数据记录在区块链上时，帮助投资者追踪房地产历史。\n\
  \n#### 4.5.8.9 医疗保健\n\n*   安全共享医疗信息。\n\n*   赋予个人访问其医疗记录的权利。\n\n*   提升健康数据的交换。\n\n\
  *   确保药品供应链的完整性。\n\n*   帮助构建用于健康数据和信息的标准数据库。\n\n*   通过数据交换、监控和维护，促进临床研究和分析。\n\n\
  #### 4.5.8.10 物联网（IoT）\n\n*   为物联网安全提供智能合约。 \n\n\n\n-   增加设备的安全性和隐私性。\n\n-   创建物联网身份和访问管理的框架。\n\
  \n### 4.5.9 架构结构\n\n区块链是一个由分布式共识、计算哈希和数字证书支持的去中心化网络。Figure 4.6 展示了区块链架构的六个组成部分。FIGURE\
  \ 4.6\n\n![Figure 4.6 Architecture of BC.](img/fig4_6_B.jpg)\n\nFigure 4.6 Architecture\
  \ of BC.\n\n#### 4.5.9.1 该数据层处理 Hiverse 信息\n\n该模块封装时间戳数据。区块主体包含已验证的消息，而创世块包含块描述、时间、Nonce、Merkle\
  \ 根和哈希。新块的哈希与其父块的哈希相连。创建时揭示的已标记块。该层的时间戳和 Merkle 树是区块链所必需的。时间戳用于定位和跟踪区块链数据。这可能会将时间维度的区块链数据纳入，以便于数据重复。Merkle\
  \ 树使用二进制哈希树来检查这些交易是否正确且存在。\n\n#### 4.5.9.2 网络层\n\n架构的核心是网络层，也称为点对点（P2P）。它调节节点之间的通信。它查找节点、交易、块，这些节点和块始终在接收新信息，并集成以展示区块链系统的工作方式。\n\
  \n#### 4.5.9.3 共识层\n\n这是区块链的主体。它讨论共识机制。共识方法同步通信实体，并迫使参与者建立一致的合同，也称为一致意见，关于云交易数据状态。标准智慧方法为最重要的基站生成加密密钥。共识机制安全、连贯、活跃且廉价，但对故障敏感。\n\
  \n#### 4.5.9.4 激励层\n\n激励模块鼓励模块验证区块链数据的安全。公共账本中的每个模块都会通过共识层的共识计算进行评估。即使在认证过程中，节点也会使用\
  \ CPU 和能量。区块链通过加密数字货币激励预期节点参与验证过程。组件的组装和启动过程包括两种奖励机制。\n\n#### 4.5.9.5 合约层\n\n它监控基于逻辑的交易查询。它涉及脚本、算法、逻辑合约等合约方面。共识机制是一组技术程序，用于在满足预定参数时激活以太坊区块链设备。智能合约使用高标准语法，如\
  \ EVM、Solidity 等。合约层结构清晰。合约层可能面临重入攻击、访问控制、结构僵化增加等威胁。\n\n#### 4.5.9.6 应用层\n\n它通过应用为客户提供功能。软件可以用任何计算机语言编写，并在多个平台上运行。区块链应用的安全性是一个挑战。交换服务器安全漏洞、DDoS\
  \ 转移、工人主机保护、恶意代码感染、弱密码攻击、自私矿工攻击等。\n\n### 4.6 区块链在物联网：一场关键转型\n\n物联网传感器和边缘设备正在改变企业的运营方式。企业必须在物联网生态系统的所有层面保护信息。随着连接设备数量的增长，数据安全变得更加困难。区块链有助于物联网安全。区块链和物联网实现机器对机器的交易。它使用记录、验证和分布式账本的数据库条目。物联网和区块链提供潜在优势，并使智能设备能够在没有中央化权威的情况下独立工作。\n\
  \n它监控设备通信。区块链的去中心化特性可能是物联网的顾虑。物联网系统使用集中式客户端-服务器或枢纽-辐射式架构。构建去中心化物联网平台确保其能与区块链网络协作，但设置物联网传感器以便它们能够自行处理计算和数据存储可能很困难。区块链与物联网在银行、金融、汽车和农业中应用。智能家居、供应链、物流和智能合约利用物联网。智能合约在物联网环境中使用区块链自动执行合约。这使得智能设备可以在没有中心化权威的情况下运行。\n\
  \n这种区块链应用帮助组织管理物联网边缘设备上的数据，节省维护和传输费用。没有集中式数据存储库，且账本对网络攻击具有抵抗力，减少了数据管理的担忧。它消除了物联网网关或任何其他中间人员用于交换数据，从而减少了处理时间。\n\
  \n区块链通过去中心化、分布式账本加密设备数据。分布式账本将数据处理和存储分布到数百万设备上。在传统架构中，设备、服务器或网络故障可能会中断整个物联网生态系统。在许多情况下，区块链网络足够有弹性，即使节点关闭，网络仍能继续运行。\n\
  \n许多物联网生态系统因访问控制不足和客户端/服务器设计不当而容易被劫持。DDoS 攻击通过向目标或附近基础设施淹没 Internet 流量来干扰连接设备的正常流量。Mirai\
  \ 和 Hajime 物联网僵尸网络揭示了易受 DDoS 攻击的设备。\n\n区块链的分布式安全架构保护物联网免受基于僵尸网络的 DDoS 攻击。在这种设计中，每个网络设备都使用区块链点对点网络。区块链与物联网技术仍处于早期阶段，多家\
  \ IT 企业正在探索它。\n\nIBM 区块链平台让公司能够将区块链扩展到认知物联网，将物联网与认知计算相结合。技术问题和运营问题已减缓了物联网区块链的部署。在包含大型集中式账本的区块链系统中，可扩展性和存储是重要挑战，而将账本保存在边缘节点是浪费的，因为边缘智能设备无法处理大量数据或处理能力。\n\
  \n该概念仍然很年轻，但未来可能产生重大影响。标准化的安全要求将促进物联网-区块链的采用。区块链可以通过实现数据透明性和点对点连接来提升 Internet 安全性。\n\
  \n下面是区块链的组件：\n\n-   完整节点负责存储、验证、接受和拒绝所有交易。相比之下，部分或轻量节点不存储整个区块链账本；相反，它仅保留交易哈希。该哈希值作为入口，可用于访问完整交易，非常适合存储和\
  \ CPU 资源有限的环境。\n\n-   账本是指数字数据库，特别在节点之间进行加密货币交易的上下文中相关。在这个领域，三种不同的账本共存。\n\n-   公共账本：公开的，所有用户都有访问权限。任何人都可以读取或在区块链上写入。\n\
  \n-   分布式账本：所有节点都有本地数据库的副本。节点组验证交易并贡献块到区块链。没有单个节点或节点组控制这个去中心化账本。每个节点都执行该任务。\n\n\
  -   钱包：数字钱包作为比特币的存储设施。区块链节点都有钱包。公钥和私钥对保护钱包的隐私。钱包中的资金广泛接受，无需转换。\n\n-   哈希：哈希减小数据大小。它用于密码学。在区块链网络中，一个交易的哈希值是另一个交易的输入。\n\
  \n## 4.7 实施区块链技术在物联网中的困难\n\n\n\n\n将区块链与物联网相结合赋予了巨大的可能性，并解决了众多物联网难题。然而，集成仍面临新开发的障碍，这为现代研究思路打开了道路。文献主要集中在区块链如何改进物联网的设计和应用。IoT-Blockchain\
  \ 提升了物联网的安全性、可追溯性、透明度、效率和信任度。在完全展现集成潜力之前，研究人员必须解决其缺陷。区块链最初是为强大的计算机在互联网范式中设计的，而物联网并非如此。本节讨论了许多物联网-区块链集成问题。\n\
  \n### 4.7.1 物联网资源受限\n\n资源受限的物联网设备包括传感器、RFID 标签和智能电表。这些设备的计算能力、网络能力、存储能力和电池电量均较弱。区块链有独特的需求。首先，共识机制需要大量计算资源，这对于低功耗物联网设备来说效率低下。其次，区块链数据量庞大，单个物联网设备难以存储，尤其是物联网实时生成大量数据。\n\
  \n第三，区块链假设网络连接稳定，但物联网可能因节点故障（如电池耗尽）而出现网络差或不稳定，在大多数情况下，物联网设备的状态只能在测试后才能发现；在其他情况下，设备长时间正常工作，但因断开连接、短路或软件过时等原因，情况会发生变化。\n\
  \n### 4.7.2 安全性脆弱\n\n许多行业采用无线网络，因为其可扩展且易行。无线网络易受被动窃听、干扰、拒绝服务等攻击。由于物联网设备资源受限，在分散环境中维持公钥/私钥加密技术较为困难。许多物联网系统包含处理能力参差不齐的设备，因此无法保证所有设备都能以相同速度运行加密算法。恶意节点窃取区块链通信，延迟区块广播。\n\
  \n### 4.7.3 物联网设备的移动性和命名\n\n区块链网络拓扑与物联网不同，节点无法自动发现彼此。在比特币区块链中，发送者的 IP 地址包含在交易中并用于构建网络架构。许多物联网设备是移动的，因此该架构不切实际。\n\
  \n### 4.7.4 集成系统的可扩展性\n\n区块链的可扩展性取决于物联网节点数量和并发工作负载。当前区块链的可扩展性限制了大规模物联网应用。物联网设备产生的实时数据量达\
  \ terabytes，区块链无法存储。比特币区块链可能不足以满足物联网需求。部分区块链每秒仅处理几笔交易，这成为物联网的瓶颈。联盟链或私有链通过解决此问题。联盟链系统包括\
  \ Hyperledger。\n\n### 4.7.5 网络隐私与交易保密性\n\n公共区块链很难保护物联网设备的交易历史。因为交易模式分析可能推断出公钥背后的用户或设备身份。根据隐私需求，组织应选择混合链或私有链。\n\
  \n### 4.8 区块链与物联网的应用场景\n\n智能芯片和传感器的便携性和性能提升，使其能够实时与区块链交互。区块链与物联网的集成可实现设备间的服务市场，使公司能够从收集的数据中获益。区块链协议、联盟及物联网设备供应商的繁荣表明区块链在物联网行业的潜力。下一节概述一些利益相关者以及区块链与物联网交叉点的应用案例。需要注意的是，本节中提到的合作伙伴和公司并非德勤的官方推荐。\n\
  \n1. 一群被称为“Chainof Things”(CoT)的区块链专家正在共同研究将区块链与物联网集成于工业、环境和人道主义情境的潜在收益。CoT 开发了名为\
  \ Maru 的硬件解决方案，利用区块链和物联网技术增强身份识别、安全性和互操作性。CoT 还开发了多个应用场景，包括“Chain of Security”（安全链）、“Chain\
  \ of Solar”（光伏链）和“Chain of Shipping”（运输链）。\n\n2. IOTA 的 Tangle 账本降低了昂贵矿工的需求，实现快速交易结算和数据完整性（交易验证）。IOTA\
  \ 能够处理物联网设备的海量微数据。Tangle 提供的账本具备机器间通信、无手续费的微交易以及抗量子计算的数据特性。IOTA 建立了一个购买和出售传感器数据的平台，并正在拓展数据分析洞察市场。\n\
  \n3. Riddle & Code 提供加密标签以优化物流和供应链管理。通过将物联网设备与分布式账本网络集成，Riddle & Code 实现了物联网时代安全可靠的机器间交互。其解决方案提供了物理物体和机器的“可信数字身份”，从而桥接物理与数字世界，结合区块链优势与传统纸质文档。\n\
  \n4. 区块链与物联网传感器的集成确保了涉及实物商品交易信息的可靠性。例如，Modum 传感器在运输过程中监测环境条件（如温度）。货物到达目的地后，传感器数据会与区块链智能合约比对，验证交付是否满足发送方、客户或监管机构的要求。智能合约触发多种操作，如向发送方和接收方发送通知、释放产品或启动支付。\n\
  \n### 4.9 区块链在物联网中的作用\n\n区块链与物联网技术的集成创造了降低低效、增强安全性和提升透明度的新机遇。这些技术使得能够贯穿物理资产全生命周期（从原材料开采到销售到最终用户）的监控成为可能，帕尔克（Parekh）表示。通过这些技术，可从原材料开采到最终客户销售的全过程追踪实物资产。\n\
  \n1. **安全**：区块链技术可验证并授权来自可信来源的交易，并在传输和存储时加密数据。区块链提供了交易、交互和访问的透明度。通过加密、消除单点故障以及能够立即定位网络弱点，区块链使系统更安全。\n\
  \n2. **成本削减与自动化**：区块链交易的验证与处理若能更自动化，整个生态系统可能会以更低成本主动运作。\n\n3. **交易速度**：在各供应商、制造商、分销商和客户之间，区块链使不信任的各方能够即时共享信息，省去耗时步骤，加速交易。\n\
  \n4. **透明度**：得益于云计算，物联网现在能够实时分析和处理数据，云计算推动了物联网系统的发展。然而，数据透明度仍缺失，参与者很少知晓其数据的预期用途。\n\
  \n### 4.9.1 从多方面提升物联网安全与可扩展性\n\n\n\n\n-   [区块链的不可篡改分布式账本消除了信任的需求。没有任何单一组织控制所有物联网（IoT）数据。使用区块链存储\
  \ IoT 数据将为网络安全提供另一种程度的保障。区块链更强的加密使得数据几乎无法被擦除。区块链允许任何拥有网络访问权限的用户追踪先前的交易。这可能有助于识别数据泄露的来源并及时采取行动。\n\
  \n区块链允许快速处理交易并协调设备。随着联网设备数量的增长，分布式账本技术可以处理更多交易。区块链可能帮助 IoT 企业通过消除 IoT 网关处理开销（例如传统协议、硬件或通信开销成本）来降低费用。智能合约是一种在区块链上保存的双方协议，可根据指定参数执行合同协议。智能合约可在满足服务要求时自动触发支付，无需人工干预。\n\
  \n## 4.10 Blockchain and IoT Integration\n\n通过与物联网（IoT）关联的转变和简化手动操作，区块链将它们带入数字时代，并收集大量数据，从而实现了前所未有的知识水平。毫无疑问，IoT\
  \ 和区块链各自在时代发展中发挥着重要作用。两者的结合在数字世界的发展中具有极其重要的作用。\n\n### 4.10.1 结合区块链和 IoT 的可能性\n\n\
  IoT 系统的异构性、互操作性差、IoT 设备资源受限以及安全和隐私漏洞只是 IoT 系统必须面对的几个问题。IoT 系统可以从区块链技术的更高互操作性、更强隐私保护和增强安全性中获益。此外，区块链有潜力提升\
  \ IoT 系统的可扩展性和可靠性。我们将这种区块链与 IoT 的连接简称为 BCoT。与现有 IoT 系统相比，BCoT 提供以下潜在优势。\n\n### 4.10.2\
  \ 改进 IoT 系统兼容性\n\nIoT 数据可转换并存储在区块链上，从根本上提升 IoT 设备的互操作性。在该过程中，多种 IoT 数据类型会被转换、处理、检索、压缩，然后存储在区块链中。由于区块链基于每个人都能访问互联网的\
  \ P2P 叠加网络构建，互操作性也体现在在不同碎片化网络之间轻松切换的便利性上。\n\n### 4.10.3 增强 IoT 系统安全性\n\nIoT 数据可通过区块链进行保护，具体做法是将数据作为受数字签名和椭圆曲线数字签名算法（ECDSA）等加密密钥保护的交易存储。利用区块链技术（如智能合约），IoT\
  \ 系统还可以自动更新固件以修复安全问题并提升整体安全性。\n\n### 4.10.4 IoT 数据可追溯性和可靠性\n\n区块链上的数据随时随地可定位和验证。同时，可以追踪区块链上保存的每一笔历史交易。例如，已有工作开发出一种基于区块链的产品可追溯系统，为供应商和零售商提供可追溯服务。这使得可以检查并确认商品的真实性和质量。由于区块链交易不可篡改或伪造，区块链的不可变性确保了\
  \ IoT 数据的准确性。\n\n### 4.10.5 IoT 系统具有自主交互能力\n\nIoT 组件或设备可以通过区块链技术实现自动交互。例如，建议使用分布式自主公司（DACs）在传统角色（如政府或企业）不参与支付时自动化交易。DACs\
  \ 可借助智能合约实现自主运行，无需人工干预，从而降低成本。\n\n## 4.11 Blockchain and IoT Opportunities\n\nBC-IoT\
  \ 集成带来多项优势。它同时打开了两扇门。以下是一些机会：\n\n*   建立各方信任：区块链安全的 IoT 将在联网设备之间建立信任。只有经过验证的设备才能在网络上交互，矿工必须在将区块加入区块链前验证每个交易块。\n\
  \n*   成本降低：通过消除中间方、简化流程并去除发送方和接收方之间的任何中介，实现成本降低，使交易变得直接。\n\n*   缩短时间：交易从天数缩短至秒数。\n\
  \n*   提供安全和隐私：保护设备及信息的安全和隐私。\n\n*   社会服务：此方法为联网设备提供社会和公共功能。所有联网设备均可进行通信和数据交换。\n\n\
  *   金融服务：此方法安全转移资金而无需第三方。提供快速、安全且保密的金融服务。转账时间和费用均有降低。\n\n*   风险管理：该策略在分析和降低资源及交易失败风险方面发挥了关键作用。\n\
  \n## 4.12 结论\n\n物联网（IoT）在交通、医疗、工业、物流、电网等领域具有诸多益处，因为它连接能够计算、通信并传输关键信息的物体。IoT 安全至关重要。本章讨论了区块链如何保障\
  \ IoT 网络的安全。我们倡导区块链与 IoT 的协同集成，以提升 IoT 设备的连接性和安全性。我们还讨论了区块链在 IoT 中的应用。我们还阐述了使区块链能够在\
  \ IoT 网络内运行所面临的障碍和未来研究方向。将区块链纳入 IoT 网络并不容易，需要产业界和科研界共同努力。本章提供了对区块链与 IoT 的全新视角。文中提及了机遇和挑战，并列出了平台。该技术未来可能取代当前的互联网系统，实现一种每个智能设备均通过\
  \ P2P 网络实时连接其他设备的体系。通过将实时信息传输给正确的设备，它可以节省时间和金钱。未来可能会派上用场。我们将在未来创建基于区块链的 IoT 安全解决方案。\n\
  \n## 4.13 未来工作\n\n以下点被确定为我们未来工作的考虑因素：\n\n*   未来，区块链与人工智能/机器学习的更深度融合有望催生更智能、更适应的\
  \ IoT 系统。这可能包括利用区块链安全存储和共享用于 AI 训练和推理的数据，或利用 AI 提升区块链网络的效率和可扩展性。\n\n*   边缘计算是一项新兴技术，指在网络边缘（即数据生成地点）进行数据处理。未来，区块链与边缘计算的更深入融合有望为\
  \ IoT 应用创造更高效、更可扩展的系统。\n\n*   随着 IoT 设备产生越来越多的数据，隐私和安全的需求日益重要。未来，可能会出现更先进的隐私保护技术，如零知识证明和安全多方计算，以确保敏感数据的机密性。\n\
  \n*   区块链网络的能耗是主要关注点，尤其是随着物联网设备数量不断增长。未来，可能会出现更节能的共识机制，如证明权益（PoS）或证明权限（PoA），以降低区块链网络的能耗。\n\
  \n*   智能合约是区块链技术的关键特性，能够自动化复杂流程。未来，可能会出现更高级的智能合约，能够整合机器学习等先进技术，打造更智能、更适应的系统。\n\n\
