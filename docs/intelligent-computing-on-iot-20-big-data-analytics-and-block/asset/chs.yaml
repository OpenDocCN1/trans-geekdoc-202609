  [32, 33\\] and are omitted here. It is worth pointing out that one of the structural\
  \ properties (see, Ref. \\[33\\]) of *G* indicates that *G* has all even numbered\
  \ columns to be zero due to *H*[0] possessing this property. The following result,\
  \ which is intuitively clear, can be utilized as an internal accuracy check in numerical\
  \ computation.\n\n**Lemma 8.1:** *We have*\n\n(8.5)  \n\n\n\n\n$$\\\\frac{1}{\\\\\
