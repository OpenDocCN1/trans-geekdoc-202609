  \n## 21.6 结论与未来展望\n\n在本研究中，我们对 NSL-KDD 数据集进行了深入分析，并使用三种分类器——`随机森林`、`KNN`和`逻辑回归`——评估其性能。训练结果显示出与以往使用流行数据集的研究相似的高准确率。我们的发现在结果部分得到了详细的说明。\n\
  \n\n\n\nIt was observed that although the prominent classifiers used in the well-renowned\
  \ NSL-KDD data set produced promising results for the training set, their accuracy\
  \ levels were suboptimal for the test set. This observation highlights the need\
  \ for further research in developing classifiers that can accurately detect intrusions\
  \ in the test set. The current intrusion detection model is experiencing a lag in\
  \ performance on the test dataset, despite exhibiting high accuracy in the training\
  \ dataset, with true accurate prediction almost reaching 99.8%. The reason behind\
  \ this under-performance is the presence of outliers in the test dataset. In the\
  \ forthcoming research, it is suggested to employ techniques with improved optimization\
  \ to explore the ability to develop a more precise and effective IDS. One promising\
  \ avenue of investigation involves the use of ensemble-based techniques, where multiple\
  \ algorithms are combined to generate more robust and accurate results. Moreover,\
  \ the exploration of alternative classifiers and techniques, such as deep learning\
  \ models like Artificial Neural Networks (ANNs), Convolutional Neural Networks (CNNs),\
  \ Recurrent Neural Networks (RNNs), and clustering algorithms like K-means, could\
  \ be fruitful. These models can be analyzed and evaluated to identify the most appropriate\
  \ and effective approach for developing an improved IDS. Ultimately, the success\
  \ of the IDS model will hinge on its ability to perform well on the test dataset,\
  \ indicating its reliability and practical utility in real-world settings. There\
  \ is a critical security challenge as a result of the growth of unauthorized access\
  \ to and use of network resources. Rapid identification of intrusions is crucial\
  \ to mitigate the impact on system networks as attacks continue to pose a serious\
  \ threat. Machine learning classifiers have gained prominence in IDSs due to their\
  \ flexibility, capacity for generalization, and resilience. Deploying such models\
  \ on network servers would enhance their robustness and accuracy in detecting attacks\
  \ on the system.\n"
