  \ Poisson, geometric, and discrete phase-type (DPH) distribution in Examples 8.2\
  \ and 8.3.\n\n**Example 8.1:**\n\nIn this example, we fix θ = 1, *µ*[2] = 1 and\
  \ look at the effect of the traffic intensity (ρ), the block sizes (*b*) and the\
