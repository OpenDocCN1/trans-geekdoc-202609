  _{1}(I \\\\otimes \\\\beta) + y\\_{0}^{(\\\\mathbf{1})}B\\_{0} + \\\\underset{i\
  \ = 1}{\\\\overset{\\\\infty}{\\\\sum^{}}}y\\_{i}^{(\\\\mathbf{1})}A = \\\\mathbf{0}.$$\
  \ \n```  \n\nPost-multiplying Equation (8.18) by (e ⊗*I*) and noting that \\[*B*[1]\
  \ (*I* ⊗ β) + *B*[0] (e ⊗ *I*) = **0**, wesee\\]  \n\n``` \n$$\\\\underset{i = 1}{\\\
  \\overset{\\\\infty}{\\\\sum^{}}}y\\_{i}^{(1)}A(e \\\\otimes I) = \\\\underset{i\
