  \n## 8.1 Introduction\n\n区块链在过去几年随着加密货币的出现，已成为最受激烈争论的话题之一。自 Satoshi Nakamoto 于比特币启动以来，区块链技术在理论框架和实际应用方面均取得了显著进展。它吸引了交通、医疗、银行和金融服务等众多业务和工业部门的关注，因为它不仅支持分布式和去中心化的交易，还提供了信息共享的信任与透明。关于区块链技术的全面综述，读者可参考优秀的专著\
  \ \\[2, 3 and 4\\] 以及综述文章 \\[5, 6 and 7\\]。区块链的实际应用已涌现，包括区块链银行 \\[8, 9\\], 区块链商业\
  \ \\[10, 11\\], 区块链供应链管理 \\[12, 13 and 14\\], 区块链物联网 \\[15, 16 and 17\\], 区块链共享经济\
  \ \\[18, 19\\], 以及区块链医疗 \\[20\\]。尽管区块链技术已在现实中的应用广泛，但关于区块链系统的数学研究却很少。这些数学研究生成随机模型，提供性能分析与优化，并建立重要因素或基础参数之间的有益关联。\n\
  \n因此，本文的主要贡献在于研究一种两阶段排队模型，该模型采用批量到达和批量服务，且批量大小假设为一般分布，并将其应用于区块链场景。进一步，基于简化状态空间描述，对该模型在稳态下进行了定性研究。利用\
  \ Neuts 的矩阵分析方法，推导了系统的 stationary distribution（稳态分布）、稳定性条件以及关键性能指标的公式。文中给出了一些示例说明。\n\
  \n本章余下内容结构如下。Section 8.2 展示与所提排队模型相关的已有工作。Section 8.3 详细描述两阶段区块链排队模型。Section 8.4\
  \ 构建底层过程的无穷小生成矩阵，并对系统的稳态进行分析。Section 8.5 给出用于评估系统效率的若干关键性能指标公式。Section 8.6 通过数值分析突出所提模型的定性行为。最后，在\
  \ Section 8.7 中给出几条结论性评论和进一步研究的思路。\n\n## 8.2 Related Works\n\n本文研究的两阶段区块链排队模型由区块生成（BG）和区块构建（BB）两个过程组成。区块链通过矿工程序保持更新，其中多个节点（称为矿工）竞争解决一个需要产生满足特定约束的哈希值，这些矿工会生成新块。当交易被编译进块时，关键的\
  \ nonce（一次性随机 64 位十六进制数）被提供，随后该块被链接到区块链 \\[6, 7\\]。\n\n早期关于区块链排队的研究报告于 Li 等人 \\\
  [21\\]。他们 \\[21\\] 研究了适用于区块链应用的 *M/M*^(\\[*b*\\])*/1* 队列模型。该模型假设交易按泊松过程，速率为 λ，产生；交易进入无限缓冲区，随后处理以成为块的一部分。假设每个区块最多容纳\
  \ b 个交易。一旦形成至少一个但不超过 b 个交易的区块，矿工过程即开始。在矿工期间，若当前正在服务的交易数小于 b，则允许新交易进入处理（即块内的交易数不得超过\
  \ b）。处理（或链接）区块的时间被假设为指数分布，参数为 µ[1]。需要指出，作者 \\[21\\] 认为在处理交易（形成新块）的同时，新交易仍可进入处理，前提是当前正在服务的交易数小于\
  \ b，从而保证块大小不超过 b。块的处理时间均为指数分布，速率为 µ[2]，与当前服务的交易数无关。该假设在处理时间为指数分布的情况下是合理的，但在处理时间为非指数分布时难以维持，这促使我们假设只有当块大小达到\
  \ b 时才开始处理该块。一旦块形成，矿工过程即开始，期间不处理任何交易，直到矿工完成。该假设使得系统中最多只有一个块存在，且队列中的交易数为零或正整数。若块已链入区块链且队列非空，服务器可处理下一个交易块；否则服务器保持空闲，等待新交易到达。\n\
  \n\n\n\n在 Ref. \\[22\\], 作者们通过假设交易遵循马尔可夫到达过程 (MAP) 并将交易处理时间和区块挖矿时间视为 (可能不同) 阶段性\
  \ (PH) 分布，扩展了他们的研究 \\[21\\]。一个问题在于在交易仍在处理时允许新交易进入服务。这是因为交易处理时间不再具有无记忆属性，因此在实际应用中新加入的交易不会得到完整的处理。需要指出的是，在两篇论文\
  \ \\[21, 22\\] 中，作者本可以通过对交易处理时间和区块挖矿时间的卷积来简化状态空间描述（在边界状态上进行一些微小修改），因为服务器在处理完交易后会一直保持空闲，直到区块链的铺设完成。可以把这种“空闲”时间看作是无论区块如何处理，对铺设时间的延续。就延迟和其他指标而言，这种方法不会产生任何差异。但从建模角度来看，它简化了账本管理工作，因此本工作中采用了这种方法。\n\
  \nKawase 和 Kasahara \\[23\\] 对区块链队列系统在一般服务时间下进行了严谨分析，并提供了系统性能评估的数值示例。Memen 等人 \\\
  [24\\] 通过模拟分析了区块链队列系统。此外，Jourdan 等人 \\[25\\] 提出了一种基于交易与区块图的比特币区块链概率模型。他们在区块级别提出了由比特币协议引起的特定条件依赖性。为研究私有区块链中\
  \ Raft 共识算法的性能指标，Huang 等人 \\[26\\] 建立了一个带有吸收态的马尔可夫过程。随后，Srivastava \\[27\\] 提出了一种包含共识机制的马尔可夫模型，以实现更快的区块包含和交易。Fralix\
  \ \\[28\\] 分析了比特币中无限服务器的队列系统的时变行为。Fan 等人 \\[29\\] 建立了一个带有休假和可选服务的 *M/(M*[1], *M*[2])/1\
  \ 排队模型，用于区块链系统，并通过矩阵-几何方法得到系统的 stationary distribution，同时给出了平均交易确认时间及其他性能指标的公式。Chen\
  \ 等人 \\[30\\] 旨在通过工作量证明 (PoW) 和权威证明 (PoA) 共识算法在区块链队列中理解私有物联网 (IoT) 网络的延迟。\n\n在本模型中，我们研究了区块链排队系统中的批量到达，这是实际中常见的情况。因此，提出并求解了一个\
  \ *M*^(\\[*X*\\])*/M*^(\\[*b*\\])/1 排队模型，采用矩阵解析方法 \\[31\\]。批量服务（固定大小 *b*）的两阶段服务（BG\
  \ 和 BB）均假设为指数分布，速率分别为 *µ*[1] 和 *µ*[2]。服务器在服务完成后，若当前交易数小于 *b*，则会等待直到交易数达到 *b* 或更多。该模型被视为一种\
  \ *M/G/1* 型，该类模型由 Neuts 及其同事们对其进行了全面研究。作者建议阅读 Neuts \\[31\\] 以及最新的两卷书 Chakravarthy\
  \ \\[32, 33\\] 以了解 *M/G/1* 范式的一般方法。此外，还通过获得关键性能指标的公式并结合各种系统参数的行为图示，给出了严谨的性能分析。\n\
  \n接下来，采用以下标准符号：\n\n*   **粗体字母**——根据上下文可为行向量或列向量。\n\n*   **′**——转置。\n\n*   **⊗**——Kronecker\
  \ 积 \\[34, 35\\]。\n\n*   **⊕**——Kronecker 和 \\[34, 35\\]。\n\n*   ***e***——(1,1,…\
