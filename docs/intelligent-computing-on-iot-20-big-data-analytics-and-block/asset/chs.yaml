  \n## 16.1 Introduction\n\n物联网旨在利用射频识别技术和无线通信技术构建一种全球物联网的实时信息共享互联网。当前，随着人工智能（AI）的发展，历史数据和实时数据可以被分析并用于更准确地判断用户习惯，从而实现更智能的行为，提升用户体验。基于此背景，自\
  \ 2017 年以来，“AIoT”一词频繁出现，并成为物联网的主要发展方向。AIoT 意为 “AI + IoT”，指在实际应用中将 AI 技术与 IoT 相结合，如图\
  \ 16.1 所示。例如，智能家居可以让人们根据需求自动开关电器，农民可以利用 AIoT 进行分析和自动化土地管理。根据 “Markets and Markets”\
  \ 的一项研究报告，全球 AIoT 市场预计到 2024 年将增长至 162 亿美元。\n\n![Figure 16.1 AIoT convergence technologies.](img/fig16_1_B.jpg)\n\
  \nFigure 16.1 AIoT convergence technologies.\n\nAIoT 具备一些新的特点和需求：\n\n*   大规模设备：与云计算中的数百万设备相比，AIoT\
  \ 未来可能支持的设备数量将达到数十亿。\n\n*   海量大数据：预计会产生更大规模的数据。\n\n*   低响应延迟：不同的应用场景可能对延迟有不同的低要求。\n\
  \n*   数据隐私：理想情况下应在不泄露原始数据的前提下获得分析结果。\n\n然而，由于 IoT 设备硬件有限、电池容量小且成本较高，难以在资源受限的 IoT\
  \ 设备上实现复杂 AI 算法的准确性和实时性，这阻碍了 AIoT 的发展和实际应用。虽然将计算任务直接交给云端可以减轻 IoT 设备的处理压力，但传输大量数据会带来时间延迟、通信能耗、数据丢失甚至数据泄露的问题，这对物联网系统尤其是恶劣应用场景产生显著影响。\n\
  \n以典型的人工智能技术——自然语音交互为例，该技术分为声学计算和自然语言理解（NLP）两部分。毫无疑问，NLP 部分（如设备对用户语句的理解和信息获取，如天气）必须在云端完成。然而，对于用户语音转文本的过程，如“打开空调并提高温度”，部分或甚至大部分计算可以在\
  \ IoT 设备上本地完成。此时，上传到云端的数据不再是压缩后的声音本身，而是更简洁的结果，从而实现更快的响应。\n\n本章将描述在基于云协作和边缘计算的物联网中实现实时复杂\
  \ AI 应用的基本流程，即将任务划分并分别在云端和 IoT 设备上处理，从而显著提升低成本 IoT 设备的计算能力，并保证整个系统的性能。本章还从设计和开发角度描述了在低成本\
  \ IoT 设备上实现计算机视觉（CV）和同步定位与映射（SLAM）等 AI 技术的典型案例。\n\n\n\n\n-   [从集体到个人：在计算机发展的早期，由于成本高昂，计算机主要用于进行大型科学实验，不存在个人计算机。随着集成电路的出现，计算机的体积不断缩小，成本也在降低。如今，许多人可以拥有个人计算机来计算和存储数据。]\n\
  \n-   [从本地到云端：随着计算机网络和万维网技术的持续发展，计算机不再仅仅是存储或计算的载体，而是越来越多地用于通信。用户将大量信息从本地迁移到 Web\
  \ 服务器，这一“信息网络化”过程将数据带到服务器，并逐步将部分计算过程转移到服务器上，从而逐步形成当今的云计算形态。]\n\n-   从云端到边缘：随着智能设备的普及，越来越多的设备连接到网络，这给云计算基础设施带来了压力。将计算资源同步到靠近用户的网络边缘设备已成为实现大规模实时计算的必然要求\
  \ \\[[1\\]. 因此，广域网（WAN）的数据传输延迟可以完全避免，数据隐私安全、访问效率以及服务部署和管理的灵活性均得到提升。]\n\n### 16.2.2\
  \ 边缘计算概念\n\n边缘计算是一种层级分布式计算模型，主要将计算从中心下沉到边缘 \\[2, 3\\]. 通过充分利用网络边缘设备的计算和存储能力，边缘计算在网络边缘提供通信、存储和计算资源，形成“设备‑边缘‑云”架构，以降低应用延迟和网络负载。\n\
  \n如图 16.2 所示，在校园和工业园区等场景中，配备计算和存储资源的设备可作为边缘设备；在城市街区场景中，移动蜂窝网络的通信基站可作为边缘计算设备提供服务\
  \ \\[4\\]; 在住宅场景中，家庭路由器可作为边缘计算设备。\n\n![Figure 16.2 边缘计算系统示意图。](img/fig16_2_B.jpg)\n\
  \nFigure 16.2 边缘计算系统示意图。\n\n### 16.2.3 边缘计算的变化\n\n在边缘计算中，前端设备通过不同的通信方式将计算请求和必要数据发送到边缘服务器，然后服务器检查对应的计算服务是否可用：如果可用，则执行计算任务并将结果返回前端设备；如果不可用，则请求其他边缘服务器或云服务器执行任务。\n\
  \n与云计算相比，边缘计算中前端设备与边缘服务器的距离通常是固定的，传输延迟显著缩短，能够支持各类对实时性要求较高的计算服务。\n\n具体而言，边缘计算模型具有以下特性：\n\
  \n*   **极低延迟**：边缘计算比云计算更靠近前端用户。在典型的边缘计算系统中，前端用户与边缘服务器通过单跃网络相连，延迟直接取决于所使用的无线传输技术。表\
  \ 16.1 汇总了不同通信技术的延迟和能耗。在边缘计算架构中，前端设备与边缘服务器之间的通信对边缘计算效率影响显著 \\[5\\]. 对移动设备，边缘计算结合\
  \ 5G 可实现低通信延迟；对物联网（IoT）设备，其云计算方案的延迟约为 800–2000 ms。在这些场景下，边缘计算预计能够将单跃传输延迟降低并使端到端延迟提升超过十倍，从而显著提升实时性能。\n\
  \n    Table 16.1 通信技术的延迟与能耗\n\n    | 应用场景 | 通信技术 | 通信延迟 | 能耗 |\n    | --- | ---\
  \ | --- | --- |\n    | 移动计算 | 5G | <5 ms | 高 |\n    | 移动计算 | 4G | <50 ms | 高 |\n\
  \    | 室内短距离 | Wi‑Fi | <150 ms | 中等 |\n    | 室内短距离 | 蓝牙 | <200 ms | 中等 |\n    |\
  \ 嵌入式 IoT | ZigBee | 2 s | 低 |\n    | 嵌入式 IoT | NB‑IoT | 1 s | 低 |\n    | 嵌入式 IoT\
  \ | SigFo6 | 2 s | 低 |\n\n*   **异构服务对象**：边缘计算服务器主要服务于直接连接到它的设备，所提供的服务高度依赖于服务对象设备及其请求。例如，智能家居场景下的边缘服务器主要针对各类智能家居和可穿戴设备，因此大多数在边缘服务器上运行的服务可能是数据存储、数据分析等；而支持娱乐服务的边缘服务器则可能提供图像渲染、图像分析、视频缓存等服务。\n\
  \n*   **多样化服务形态**：与云计算环境中的数据中心网络不同，边缘计算的服务器可以是各类相对资源优势且连接延迟低的设备，为资源受限的前端设备提供服务。这些形态的主要区别在于计算资源的下沉程度：当服务对象为智能家居的各类智能设备时，边缘服务器可以以家庭网关的形式运行计算服务；而当服务对象为移动设备（如智能手机）时，边缘服务器可集成到移动基站中，同时提供通信和计算服务。\n\
  \n*   **高度敏感于移动性**：边缘计算服务于通过单跃连接的用户，但单跃的通信范围通常有限，这使得边缘计算对用户移动性非常敏感。用户的移动会影响无线传输质量；相反，高速移动的用户更可能在多个边缘服务器之间切换。这种高切换频率在移动场景中对边缘计算带来诸多挑战，且在高移动性条件下的边缘计算优化技术已成为当前边缘计算研究的热点。\n\
  \n\n\n\n-   [隐私保护]：由于数据存储在靠近用户的边缘设备上，网络结构降低或甚至消除了用户数据与其他网络实体之间的连接性，使数据隐私更加安全。由于计算的下沉，更复杂的加密和隐私保护算法可以应用于更多类型的边缘服务，以更好地保护用户隐私。此外，数据传输延迟的降低催生了新的隐私保护计算模型和更复杂的加密算法，显著降低了隐私泄露的风险。\n\
  \n### 16.2.4 边缘计算发展趋势\n\n`技术发展趋势`：自 2017 年以来，边缘计算被权威咨询机构甘特纳（Gartner）列为技术领域的重点，持续列入其报告，发展逐步进入从创新驱动角度的高期待阶段。随着\
  \ 5G 技术的发展与成熟，边缘计算从最初的泛化概念衍生出多个细分领域，如图 16.3 所示。\n\nTable 16.3 边缘计算在甘特纳的变化\n\n| 年份\
  \ | 关键词 | 位置 |\n| --- | --- | --- |\n| 2017 | 边缘计算 | 创新触发点 |\n| 2018 | 边缘 AI | 创新触发点\
  \ |\n| 2019 | 边缘 AI/分析 | 高期待的膨胀期 |\n| 2020 | 边缘低成本单板计算机 | 创新触发点 |\n\n`学术研究`：近年来，随着边缘计算研究的兴起，发表的科学论文数量不断增加。根据近年来在\
  \ SCI 期刊中使用“边缘计算”作为关键词的论文统计数据，研究成果增长迅速，如图 16.4 所示。\n\nTable 16.4 与边缘计算相关的学术论文数量（IEEE）\n\
  \n| 年份 | 2015 | 2016 | 2017 | 2018 | 2019 |\n| --- | --- | --- | --- | --- | ---\
  \ |\n| 数量 | 500+ | 1,200+ | 2,000+ | 3,100+ | 5,000+ |\n\n`国家战略`：各国的电信网络行业国家战略均在不同程度上推动了边缘计算的发展。边缘计算作为设备、系统与决策之间的“润滑剂”，发挥了重要作用。\n\
  \n## 16.3 边缘计算架构原理\n\n在边缘计算中，前端设备必须将计算任务 offload 到边缘服务器，任务在本地执行或 offload 到云端，具体取决于任务类型。该过程主要涉及三个实体：前端设备、边缘设备和云中心。边缘计算架构指的是这三类实体如何通过软硬件有效组织与协调，实现协同工作。\n\
  \n### 16.3.1 整体系统架构\n\n网络边缘是一个相对概念，指距离网络中心较远的区域。根据当前对边缘计算的定义及真实网络架构的特点，我们将边缘设备分为两类：骨干网络边缘和普适边缘，如图\
  \ 16.3 所示。\n\n![图 16.3 骨干网络边缘与普适边缘。](img/fig16_3_B.jpg)\n\n图 16.3 骨干网络边缘与普适边缘。\n\
  \n骨干网络边缘的设备通常可管理、可控制，资源相对丰富，例如移动通信网络的基站。普适边缘设备则表现出资源可用性和连接稳定性较差的特点，如笔记本电脑和智能手机。由于边缘设备的特性，边缘计算难以像云计算那样建立统一且固定的网络架构。理想的边缘计算架构应能够高效利用各类边缘资源，在满足服务质量和体验要求的前提下，以最低成本完成前端计算任务。\n\
  \n在学术与产业界讨论的主流边缘计算架构包括“云-边-设备”架构、“边缘设备”架构、分布式 D2D 架构以及弹性边缘架构，它们适用于不同的参考场景并面临不同的系统挑战。下面依次介绍：\n\
  \n*   “云-边-设备”架构：该三层架构包括云中心层、边缘层和设备层，如图 16.4 所示。从前端设备发送的用户请求会先被边缘层设备接受。如果边缘层设备能够提供相应的边缘服务，计算请求将在边缘层处理，结果返回前端设备；若边缘层没有对应的计算任务，则将请求转发至相关边缘服务或云中心进行处理。通过此过程，前端设备的计算任务可从本地计算转变为请求边缘计算。同时，前端设备通过访问更多类型的边缘计算服务，显著提升其计算能力。在该架构中，云计算主要处理计算量巨大且运行周期长的任务。云中心作为边缘设备的补充，主要用于处理以下类型的计算任务：(a)\
  \ 延迟要求极低，云中心无法满足；(b) 数据量大，将任务数据传输至云端会产生高带宽压力；(c) 请求频繁、数据量大，云端处理可能导致延迟；(d) 计算任务对隐私要求高，无法将数据传输至云端。边缘与云的协作涉及边缘\
  \ IaaS 与云 IaaS 的资源协作、边缘 PaaS 与云 PaaS 的数据共享、智能协作与业务编排，以及边缘 SaaS 与云 SaaS 的服务协作。\n\n\
  \    ![图 16.4 “云-边-设备”架构。](img/fig16_4_B.jpg)\n\n    图 16.4 “云-边-设备”架构。\n\n*   “边缘设备”架构：在该架构中，仅由边缘服务器（即边缘网络）和前端设备组成。边缘网络中的每个服务器既是接入点也是计算节点，负责接收并处理前端设备的计算请求和任务\
  \ offload。对于一个计算请求，连接的边缘节点与任务处理节点不一定是同一台，因为缺乏高速云中心传输通道。当边缘服务器接收到无法处理的服务类型时，必须将请求转发给具备相应服务的其他边缘服务器，以实现整体协同运行。该架构通常用于高度定制化场景，如工业园区的设备通信与计算网络、大学实验网络等。在这些场景中，边缘网络的服务对象和计算类型高度确定，部署、资源分配和计算服务编排必须根据具体应用场景进行定制。\n\
  \n\n\n\n- **多访问边缘计算**：随着新应用的持续生成和边缘设备数量的增加，超密集网络应运而生。每个前端设备可以访问多个边缘服务器；这种架构称为多访问边缘网络。多访问边缘网络可以与上述两种架构共存。上述架构描述了云层和边缘层的实现方式，而多访问边缘网络强调前端设备与边缘设备层的连接方式。当前端设备从访问单个边缘设备切换到访问多个边缘设备时，会对上述两种架构的技术设计和实现产生不同影响。\n\
  \n- **分布式设备对设备/设备对设备架构（普遍边缘架构）**：设备对设备（D2D）或设备对设备（D4D）边缘计算意味着边缘设备之间的通信不再经过骨干网络，而是通过直接设备连接和多跳形成自组网络以完成设备间信息传输。每个设备可以将计算卸载给其他设备，也可以接受其他设备的计算请求。虽然\
  \ D2D 架构相对简单，但由于缺乏全局信息、稳定的通信链路和物理拓扑，它通常适用于基础设施缺乏或部署成本高的场景，如车联网和战场作战场景。\n\n- **AIoT\
  \ 架构**：从提升物联网能力的角度来看，边缘计算直接推动了 AIoT 架构的产生 —  — “人工智能 + 物联网”。在系统层面，AI 的能力将通过边缘计算提供。\n\
  \n### 16.3.2 边缘计算架构设计的挑战\n\n在边缘计算中，前端设备将计算任务卸载到边缘服务器，服务器在本地或进一步到云端执行这些任务。此过程涉及前端设备、边缘设备和云端。边缘计算架构的工作是有效组织和协调这三者，边缘计算架构设计的挑战如下。\n\
  \n- **场景多样化与定制化**：与云计算不同，边缘计算更贴近真实的计算场景，这使得边缘计算更受特定场景需求的影响 \\[6\\]。例如，仓储等工业场景的计算任务类型、任务负载和用户特征高度确定性。针对该场景的边缘计算部署必须关注数据安全、系统可靠性、连接稳定性等问题。对于其他场景（如购物中心、车站），由于前端用户的计算类型相对复杂，用户和服务的多样性会对边缘计算架构设计产生完全不同的影响。此类场景要求边缘服务能够灵活、快速地调整服务类型和资源分配策略，这使得边缘架构设计的各个方面成为满足场景需求的重要议题。\n\
  \n- **前端用户的流动性**：边缘计算通过在边缘服务器与前端用户之间建立直接通信，显著降低了计算服务的端到端延迟，这也使得前端用户的流动性直接影响边缘服务的质量和可用性。具体而言，由于边缘计算部署更贴近用户，其覆盖范围相对有限。例如，在车联网场景中，高速智能车必须协同多个边缘服务器，这对接入点切换、服务迁移与备份以及服务资源分配提出了新的要求。表\
  \ 16.5 展示了不同场景下用户的流动性。\n\n    Table 16.5 User Mobility in Different Scenarios\n\n\
  \    | 场景 | 移动速度 | 5G 边缘网关切换频率 |\n    | --- | --- | --- |\n    | 自动驾驶 + 5G 边缘网关\
  \ | 60 km/h | 5AP/m |\n    | 高速铁路多媒体服务 + 5G 边缘网关 | 300 km/h | 25AP/m |\n    | 移动\
  \ AR/VR 用户 + 5G 边缘网关 | 4 km/h | 0.33AP/m |\n    | 行人 + 5G 边缘网关 | 4 km/h | 1.33AP/m\
  \ |\n\n- **多种基础设施的资源限制与不确定性**：由于边缘计算的资源受限，良好的边缘协作机制应在边缘服务架构层面形成，并能够支持不同任务的快速转换。然而，边缘设备的不确定性使得耗时较长的计算任务面临挑战。需要合理分配资源，以避免任务时长过长；同时，软件架构需要支持细粒度的、拆分的任务\
  \ offloading，以降低服务时长，减轻计算和传输压力。\n\n- **多样、海量且异构的边缘服务**：边缘计算直接访问的设备种类多样，导致各类服务层出不穷\
  \ \\[7\\]。计算服务所需的资源类型多样，且用户体验质量和服务质量要求差异显著。例如，视频解析需要大量视频数据并对缓存有高要求，但对视频解析的实时结果要求相对较低；而自动驾驶场景则要求视频解析结果的实时性高，但对缓存需求低。因此，考虑到边缘服务的多样性、海量和异构性，边缘架构应具备支持边缘设备协作、资源共享以及服务灵活配置的功能。\n\
  \n### 16.3.3 边缘计算操作系统和开源框架\n\n边缘计算中的操作系统主要用于开放云、边缘和终端之间的业务流程；整合所有方的资源；并为开发者和用户提供开放接口以供使用。与云计算操作系统相比，边缘操作系统和框架主要面临三个挑战：高度异构性、边缘数据分析与处理、以及由业务模型驱动的边缘优化。\n\
  \n目前已有多种边缘操作系统和开源框架，如 Amazon 提出的 AWS IoT (Greengrass)、Microsoft 提出的 Azure IoT Hub、AT&T\
  \ 提出的 CORD（以数据中心为中心的重新架构），Huawei 提出的 KubeEdge、Arduino 提出的 Arduino IoT Cloud、Google\
  \ 提出的 K3S，以及 Baidu 提出的 OpenEdge。\n\n下面主要介绍由 Linux 基金会发起的 EdgeX Foundry 和由 Intel\
  \ 与 Wind River 共同发起的 Starlingx 项目。\n\n- **EdgeX Foundry**：EdgeX Foundry（简称 EdgeX）是由\
  \ Linux 基金会发起的开源项目，主要面向通用工业物联网的应用场景，聚焦于大规模、异构前端设备的管理。EdgeX 描述设备接入和边缘数据传输等场景，但不提供云边协作、云端服务以及应用管理的具体规范。该软件使得用户能够轻松在物联网应用场景中实现基于\
  \ EdgeX 的边缘系统，并在边缘系统上恢复服务管理和应用生态。\n\n\n`StarlingX`: The `StarlingX` project is an\
  \ edge computing framework open-sourced by Intel and WindRiver and provides a software\
  \ stack based on the OpenStack platform and VIM, automated service packaging, compilation,\
  \ and configuration tools.\n\n# 16.4 计算卸载在边缘计算中的概念\n\n计算卸载是边缘计算的核心问题 \\[8\\]，指将用户的计算任务卸载到边缘服务器，从而降低任务处理延迟和设备能耗。计算卸载流程包括三个步骤：任务上传、任务处理和结果返回。任务上传是指通过移动接入点将任务上传到边缘服务器，根据用户服务特性选择通信技术，并协调上传策略。任务处理是指合理分配资源并处理到达的任务。结果返回是指将计算结果发送回用户。\n\
  \n接下来，我们将介绍计算卸载的时间延迟模型和能耗模型。在云计算网络中，路由器的存储转发延迟占主导，而在接入端，任务的无线传输延迟占主导。用户到核心云之间的路由器“跳数”（即数据在网络中转发的次数）大于\
  \ 1。云计算通常为覆盖面广的用户提供服务，前端传输之间用户间的干扰相对较小。在边缘网络中，接入端的无线传输延迟占主导。用户与边缘服务器之间的距离通常是“一跳”（即直线相连）。边缘服务器通过\
  \ A‑Node 为同一区域的用户提供服务，信道间干扰显著。影响无线信道质量的主要因素包括多径衰减、信噪比和同频干扰。利用香农公式估计理论信道传输速率。因此，任务上传速率可以通过（16.1）公式计算：\n\
  \n(16.1)  \n\n``` \nR_j = B log_2 (1 + q_j g_j / (N + Σ_i q_i g_i))\n``` \n\n其中\
  \ *B* 为分配给用户的带宽，*N* 为环境噪声，*q* 为用户的发射功率，*g* 为信道增益。\n\n数据传输的能耗可以通过（16.2）计算，其中 *Input*\
  \ 是计算卸载时需要上传的数据量，*R* 是任务上传速率；Input / R 为完成任务上传所需时间；*q* 为用户的发射功率。提高设备的发射功率可以提高数据传输速率，但也会增加设备的能耗：\n\
  \n(16.2)  \n\n``` \nE_t = q * (Input / R)\n``` \n\n任务处理时间可分为两种情况：（1）用户仅请求单个任务；（2）用户持续请求任务。在第一种情况下，当单个任务上传到边缘服务器后，边缘服务器处理该任务所需的时间可表示为（16.3）：\n\
  \n(16.3)  \n\n``` \nT = C / S\n``` \n\n其中 *C* 是处理该任务所需的 CPU 循环数，描述任务的复杂度，*S* 是边缘服务器为用户分配的计算资源。在第二种情况下，用户持续向边缘网络请求计算（例如在\
  \ AR 应用中，终端设备采集的图像变化时，更新后的图像必须持续上传至边缘服务器进行处理）。当存在多个任务时，部分任务会出现等待时间。我们假设两个连续的任务到达间隔相互独立，且到达时间遵循泊松分布。因此，我们将任务处理延迟建模为排队理论模型，任务处理延迟可通过（16.4）计算：\n\
  \n(16.4)  \n\n``` \nT_e = 1 / (μ - λ)\n``` \n\n其中 μ 是用户请求的强度（即泊松分布的均值），λ 是服务器的平均处理时间。\n\
  \n## 16.4.2 计算卸载技术\n\n### 16.4.2.1 基于计算卸载的卷积神经网络分段部署\n\n由于 ImageNet 发布了大规模图像分类和识别数据集\
  \ \\[9\\]，深度卷积神经网络在图像分类和识别任务中的性能一直得到各种深度网络模型的验证，逐渐吸引了研究者的关注，并推动了深度学习的快速发展。现有方法通过加深网络来提升卷积神经网络的性能，计算量大、内存消耗大，不适合低成本移动设备。\n\
  \n计算卸载技术可以通过将卷积神经网络的计算密集任务卸载到云端，加速推理。具体做法是选择合适的拆分点，移动设备完成前端网络的处理，并将输出特征值上传到云端，云端根据特征值完成后续步骤，从而使低性能设备也能轻松完成图像识别任务，如图\
  \ Figure 16.5 所示。\n\n![Figure 16.5 Deployment of a segmental network on the device-cloud\
  \ system \\[12\\].](images/fig16_5_B.jpg)\n\nFigure 16.5 Deployment of a segmental\
  \ network on the device-cloud system \\[12\\].\n\n##### 16.4.2.1.1 方法论\n\n拆分点选择是必须解决的关键问题，需要在移动设备的计算开销与设备与云端之间的数据传输之间取得平衡。本文同时考虑感受野大小、计算量以及网络传输延迟。\n\
  \n感受野是衡量层能够抽象原始图像数据能力的重要参数，如图 Figure 16.6 所示。在卷积神经网络中，感受野可以通过（16.5）公式计算，其中 *s[n]*\
  \ 是当前卷积层的步长；*j[n]* 是所有层在 *n* 之前的步长乘积；*k[n]* 是卷积核大小；*r[n]* 是感受野大小。同时 *j*[1] = 1，*r*[1]\
  \ = 1：\n\n![Figure 16.6 Receptive field of feature maps.](img/fig16_6_B.jpg)\n\n\
  Figure 16.6 Receptive field of feature maps.\n\n(16.5)  \n\n``` \nj_n = j_{n-1}\
  \ * s_n\nr_n = r_{n-1} + (k_n - 1) * j_{n-1}\n``` \n\n发送到云端的数据量取决于拆分点处的网络输出，不同层的输出数据大小可以通过（16.6）公式计算：\n\
  \n(16.6)  \n\n``` \nl_n = (l_{n-1} + 2p_n - k_n) / s_n + 1\n``` \n\n\n\n-   [η[n]\
  \ 是当前层输出的特征边长 l[n]、填充 p[n] 以及卷积核尺寸 k[n] 的函数。为了评估分割点选择方案，本文定义了如在 (16.7) 所示的度量 η[n]，它表示压缩比与感受野比的和。在此研究中，l[0]\
  \ 表示输入图像的长度，c[0] 表示输入通道数。η[n] 越小，分割点方案越优。同时，前端网络应尽可能短，以便降低移动设备的计算成本。通常，前端网络占整个网络的比例在\
  \ 20% 到 30% 之间：\n\n(16.7)  \n\n```math\n\\\\eta\\_{n} = \\\\frac{l\\_{n}^{2}c\\\
  _{n}}{l\\_{0}^{2}c\\_{0}} + \\\\frac{r\\_{n}^{2}}{l\\_{0}^{2}} = \\\\frac{1}{l\\\
  _{0}^{2}}\\\\left( {\\\\frac{l\\_{n}^{2}c\\_{n}}{c\\_{0}} + r\\_{n}^{2}} \\\\right)\n\
  ```\n\n以标准 MobileNetV2 为例，结果如 Figure 16.7 所示。最小的 η[n] 位于第五层和第八层之间，因此选择第五层作为最终分割点。\n\
