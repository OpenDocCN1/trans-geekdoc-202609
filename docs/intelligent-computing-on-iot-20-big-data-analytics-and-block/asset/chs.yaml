  \ `M`^`(`\\[*\\]`^`X`*^`)`/`M`^`(`\\[*\\]`^`b`*^`)`/1，它捕捉了矿工池的挖矿过程以及新区块构建过程固有的两个不同的服务阶段。所提模型通过对交易处理时间与挖矿时间的卷积，简化了分析过程。利用矩阵分析方法，在稳态下通过多种性能指标对模型进行了定性分析。给出了具有启发性和趣味性的数值示例。本文所考虑的模型可以推广至包含\
  \ BMAP 事务到达和阶段性服务在两个阶段的情况。当前正在研究该扩展，相关结果将在别处报告。\n\n## 参考文献\n\n1.  Nakamoto S。`Bitcoin`:\
