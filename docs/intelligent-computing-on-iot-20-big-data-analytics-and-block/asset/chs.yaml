  \ DoS. Intercell Interference |\n\n在 Table 12.2 中指出的缺点是研究的主题，相关研究正在进行，旨在解决 MIoT\
  \ 中的安全问题。MIoT 还面临安全、数据完整性和完整性、基础设施建设成本、缺乏标准以及连接性等挑战。\n\n## 12.4 区块链在医疗中的作用\n\n\n\
  \n\nBlockchain 可以在转变医疗机构方面发挥重要作用。健康行业面临诸如在涉及的医疗中心之间安全共享数据、数据的完整性、可用性和可靠性等挑战 \\[35,\
  \ 36, 37 and 38\\]. 区块链技术提升了安全性、完整性、加密数据共享以及近乎实时的数据可用性。与物联网（MIoT）结合时，数据由 MIoT 设备生成。新建块用于存储接收到的医疗数据。在创建块的所需大小后，数据会广播到节点。节点是矿工，负责根据区块链公司的业务规则计算哈希值。块的大小会因不同的区块链服务提供商执行的业务规则而有所不同。计算哈希值的难度也取决于区块链服务提供商。在上述步骤之后，节点会发起共识。简单来说，共识是检查所有参与节点是否达成相同哈希值的过程。如果所有节点都同意该哈希值，则区块被验证并发送到区块链中。区块链通常是一个更广泛的概念，但在各种书籍和论文中，作者根据上下文将其指代为存储介质。用于保存已验证块的数据库也被称为账本。区块链账本或数据库保存加密数据，并将其与前一个块链接，以保持连续性。区块链的连续性使得区块链成为一串通过前一个块的哈希值相连的块。如果一个块的哈希值被修改，之后的所有块都会出错。这种现象使得很容易识别和定位数据被非法修改的位置，并采取适当的反措施。\n\
  \n`Figure 12.5` 展示了在 Google 搜索引擎中搜索 “blockchain” 这一词条的情形。虽然从这一行可以看出趋势相对稳定，但我们无法推断区块链的受欢迎程度出现了重大下降。研究人员正在探索区块链能够提供的解决方案，以增强安全性和隐私性。\n\
  \n![Figure 12.5 Blockchain search rate.](img/fig12_5_B.jpg)\n\nFigure 12.5 Blockchain\
  \ search rate.\n\n区块链生态系统本身是一个复杂的架构。创建区块链基础设施需要特定的网络设备。构建区块链基础设施的成本很高，企业仍对区块链的可行性持不确定态度。`Figure\
  \ 12.6` 展示了区块链基础设施的复杂性。区块链生态系统和基础设施可以因业务和安全需求而有所不同。区块链基础设施的基本结构可分为四个部分。用户域部分是客户端连接区块链服务的区域。客户端部分是区块链服务的消费者，矿业域包含负责执行哈希运算、区块链验证和存储的节点，所有共识算法都可以在此区域内部署。\n\
  \n![Figure 12.6 Workflow of blockchain.](img/fig12_6_B.jpg)\n\nFigure 12.6 Workflow\
  \ of blockchain.\n\n在继续前进之前，我们必须考虑 `Table 12.3` 中提到的关键问题。这些问题有助于识别需求，从而简化区块链的构建过程。在\
  \ MIoT 中，我们将追踪并记录患者数据。需要捕获的是患者当前状况的信息和知识，而区块链正好适合医疗组织和医疗中心。`Figure 12.7` 展示了区块链的基本构建块。\n\
