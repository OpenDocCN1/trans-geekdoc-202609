  \   客户关系管理模块<br>*   智能合约模块* |\n| 自私矿 | *   确保去中心化在私有区块链中得到完全实现<br>*   对参与节点进行信任评分<br>*\
  \   将不可信节点列入黑名单 | *   数据分析模块<br>*   报告模块<br>*   安全模块 |\n| 能源浪费 | *   使用无需高强度计算的轻量级共识算法，替代工作量证明（PoW）<br>*\
  \   使用数据分析检查能源消耗和计算负载 | *   区块链模块*<br>*   数据分析模块 |\n| 测试 | *   对区块链系统进行端到端测试<br>*\
  \   为区块链测试提供客户或社区支持<br>*   利用区块链进行协作测试、合规性和认证 | *   测试模块<br>*   数据分析模块<br>*   智能合约模块*<br>*\
  \   合规模块*<br>*   所有银行模块均需测试 |\n| 安全 | | |\n\n\n\n\n# 6.4 基于区块链的银行系统架构\n\n推荐的基于区块链的银行系统架构如图\
  \ Figure 6.2 所示。该系统包括物联网设备、用户界面（UIs）、银行系统、商户及点对点销售终端（POS）系统，以及政府和其他外部系统，所有这些系统都连接到区块链应用服务器。区块链服务器是区块链网络的一部分，通过数据库存储和访问数据。下面提供基于区块链的银行系统组件的描述。\n\
  \n![Figure 6.2 System architecture of recommended blockchain system.](img/fig6_2_B.jpg)\n\
  \nFigure 6.2 System architecture of recommended blockchain system.\n\n*   **IoT\
  \ Device:** Any connected device accessing the blockchain-based banking system,\
  \ including customer and employee devices such as a laptop, smartphone, smartwatch,\
  \ and tablet.\n\n*   **User Interface (UI):** The interface between a user and a\
  \ connected device used in accessing bank services, including touch screens, keyboards,\
  \ mobile banking applications, or websites. UIs should be updated to support blockchain-based\
  \ transactions, such as making a crypto payment in store or applying for a crypto-backed\
  \ loan.\n\n*   **Bank systems:** Includes all software and hardware components used\
  \ by a bank for its operation. Hardware components include servers, databases, Hardware\
  \ Security Modules (HSMs), ATMs, etc. Banking system software is used to manage,\
  \ monitor, and record banks and other financial institutions transactions. Sales\
  \ of core banking products, customer engagement, and portfolio management functionalities\
  \ are managed using the software. Additionally, back office functions such as accounting,\
  \ auditing, credit approvals, financial background checks, and system integrations\
  \ are also supported.\n\n*   **Automated Teller Machine (ATM):** Allows bank or\
  \ financial institution customers to perform financial transactions, such as withdrawing\
  \ cash, making deposits, transferring funds, and checking their balance or accounts,\
  \ at any time without having to interact directly with bank staff. Banks’ existing\
  \ ATM software could be updated to support crypto transactions. Crypto ATM machines\
  \ are similar to traditional ATM machines; in order to exchange fiat currency into\
  \ cryptocurrencies such as Bitcoin or Ether, consumers pay a fee. They can serve\
  \ as a convenient way for people to invest in cryptocurrencies.\n\n*   **Point of\
  \ Sale (POS):** Refers to a merchant device or software where a customer makes a\
  \ payment for goods or services, as well as a place where sales tax may become due.\
  \ POS transactions may take place offline or online, and receipts may be printed\
  \ or generated electronically. Existing POS software must be updated to support\
  \ crypto transactions. It is possible to integrate POS systems with blockchain-based\
  \ banking systems using the Merchant module’s support integrations, such as APIs\
  \ for merchants.\n\n*   **Governmental systems:** The governmental systems that\
  \ audit and ensure the compliance of the blockchain-based system, including customs.\n\
  \n*   **External systems:** All other external systems that connect with the blockchain-based\
  \ banking system, for example, payment gateways, payment networks, and private auditors.\n\
  \nThe blockchain server and its components are described below.\n\n*   **Blockchain\
  \ application server:** Application servers are software that interconnect operating\
  \ systems (OS) with external resources, including databases, internet services and\
  \ host communications, and user applications. Applications servers facilitate access\
  \ to and performance of business applications by providing a host or container for\
  \ the user’s business logic. There are numerous and competing traffic conditions\
  \ that must be handled by application servers, including the variable nature of\
  \ client requests, hardware and software failures, distributed nature of large-scale\
  \ applications, and heterogeneity of data and processing resources required to meet\
  \ business needs. The blockchain application server differs from standard, centralized\
  \ application servers in that blockchain-related activities are performed by a decentralized\
  \ blockchain network. Data is stored on the blockchain, and smart contracts drive\
  \ the logic of the blockchain-related activities.\n\n*   **Account management module:**\
  \ Manages bank customers’debit, credit, savings accounts, including blockchain payment\
  \ accounts. This module works together with the transaction management, blockchain,\
  \ and smart contracts modules.\n\n*   **Blockchain module:** Performs blockchain-related\
  \ activities and acts as an interface between the blockchain network and the blockchain\
  \ application server.\n\n# Integration and Standardization\n\n*   Standardized blockchain\
  \ APIs for integration with bank systems\n\n*   Standardized IoT communications\
  \ and security protocols for IoT-blockchain integration\n\n*   Standardized integration\
  \ with governmental and other external systems\n\n# Regulation\n\n*   Development\
  \ of a standardized cross-border/universal regulatory framework\n\n*   Development\
  \ of a blockchain-based distributed testing tool for automatic compliance testing\n\
  \n# Taxation\n\n*   Development of a tax treatment for digital assets and cryptocurrencies,\
  \ including in international trade and customs environments\n\n*   Reporting of\
  \ taxable assets and transactions\n\n*   Standardized APIs for easy integration\
  \ of the tax system with the blockchain\n\n# Integration and Standardization (continued)\n\
  \n*   Integration/communications\n\n*   Device Management module\\*\n\n*   All banking\
  \ components that require integration\n\n# Regulation (continued)\n\n*   Compliance\
  \ module\\*\n\n*   Rules engine\n\n*   Smart contracts module\\*\n\n*   Reporting\
  \ module\n\n*   Testing module\n\n*   Databases\n\n*   All existing banking components\
  \ that process personal data\n\n# 6.4 Blockchain-Based Banking System Architecture\
  \ (continued)\n\nThe recommended blockchain-based banking system architecture is\
  \ presented in Figure 6.2. The system comprises IoT devices, user interfaces(UIs),\
  \ bank systems, merchant and Point-of-Sale(POS) systems, and governmental and other\
  \ external systems that all connect to a blockchain application server. The blockchain\
  \ server is part of the blockchain network and stores and accesses data via databases.\
  \ A description of the blockchain-based banking system components is provided below.\n\
