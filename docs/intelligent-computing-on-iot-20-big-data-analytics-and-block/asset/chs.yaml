  \ | ![](img/stick_B.jpg) | ⊗ | ⊗ |\n### 3.2.10 相关的云计算应用\n\n云计算已被整合到电信、政府、企业、备份、大数据分析、教育和医疗等多个领域，这些领域对大量计算服务的需求很高。以下公司通过利用云服务的便利性，证明了云计算的可行性，并扩展了自身的业务。\n\
  \n*   ***The New York Times*** 基于云计算提供的可靠服务。通过收集 18 世纪以来的旧杂志，纽约时报将这些图像整理成便携文档格式，成功使用\
  \ 100 台 EC2 实例在 24 小时内以低成本完成处理。除了《纽约时报》，《华盛顿邮报》也有相同的经验，通过云服务器将数千张图像转换为数据库。\n\n*\
  \   **DISA**：国防信息系统署（DISA）提到使用 Amazon EC2 的费用为每小时 10 美分。\n\n*   **SmugMug** 是一个用于发布图片的网络应用，它使用\
  \ Amazon 的 S3 云存储服务。通过使用云服务，SmugMug 将存储成本减半，从而节省了数千美元。\n\n*   **Eli Lily** 致力于研究，从云计算服务中受益，为关键过程提供出色的性能，而执行一个过程的时间仅限于几秒钟，而传统方法则需要数周时间。\n\
  \n*   **TC3**（Total Claims Capture & Control，关注健康），也借助云计算服务，维护服务级协议（SLA）。\n\n* \
  \  **Industry 4.0** 是数字化进程，它彻底改变了与制造业相关的组织的自然基础，完全扭曲了价值和生产链。Industry 4.0 是一个新型的高科技智能框架，由云计算驱动，具有普遍性和无处不在的特点。工业革命\
  \ 4.0 的关键支柱是云技术。由 Oracle 赞助的研究发现，60% 的企业认为集成的企业云平台是 unlocking 破坏性技术（如机器人或 AI）潜力的途径，这些技术位于\
  \ Industry 4.0 的核心。这是因为云提供了规模和速度，使其成为 Industry 4.0 的连接基础。采用 Industry 4.0 的企业因此能够借助云的帮助更快地推动数字化转型过程。\n\
  \n\n\n\n-   [云无线接入网络 (C-RAN)]: C-RAN 是一种基于云计算的中央架构框架，这些网络依据如 5G/6G 等新兴标准进行构建。C-RAN\
  \ 提供实时虚拟化功能、协作无线系统支持以及大规模部署。随着移动网络架构的进步，它使得管理复杂功能（如网络资源切片、统计复用、能效和高容量）成为可能。实现 C-RAN\
  \ 的主要前沿技术是软件定义网络 (SDN) 和网络功能虚拟化 (NFV)。通过在 C-RAN 中使用相同基础设施支持不同接入技术，运营商可以更快速地部署移动网络，从而降低部署成本，有效利用网络资源，并最小化维护成本。C-RAN\
  \ 的核心思想是将基站功能拆分，将基站划分为基带单元 (BBU) 和远程射频头 (RRH)。随后，利用云计算和虚拟化技术，将多个地点的 BBU 集中到一个地理位置（如数据中心）。BBU\
  \ 负责基带信号处理，信号放大和调制由 RRH 完成。前传链路将 BBU 池与部署在小区站点的 RRH 通过天线连接。在虚拟化 BBU 池中，基带处理被集中处理，从而实现对随机流量的适应和资源的高效利用。同一\
  \ BBU 池可以被多个运营商共享，作为云服务租用。此外，由于手 _off 延迟的降低，网络性能得到了提升。\n-   [大数据分析]: 大数据指由操作系统（如企业资源规划\
  \ (ERP)、客户关系管理 (CRM)、供应链管理 (SCM) 系统）以及物联网传感器和移动流量产生的巨大数据量。结构化和非结构化数据的强大组合被称为大数据，与传统数据结构形成对比。大数据的主要特征可由容量、速度、多样性和可靠性体现。大量先进的量化技术（如人工智能、机器学习、深度学习、统计和数值方法）用于大数据的数据挖掘和模式发现。云计算提供了灵活高效的数据使用和增强的通信能力，从而显著提升可扩展分析解决方案的容量。\n\
  -   [云私有分支交换机 (PBX)]: 通过互联网使用云端或虚拟 PBX 可获得低成本、可扩展、安全可靠的办公电话系统。PBX 系统是部署在公司或组织内部的私有电话系统。新型业务电话系统已从传统电话系统转向\
  \ PBX 系统，后者利用互联网连接。通过将 IP 电话连接到 PBX 服务器，可实现显著的成本节约和电话功能增强。相比之下，云电话系统虽在云服务器上托管，但操作方式类似。鉴于大多数组织拥有高效的网络连接，云\
  \ PBX 已成为可行的选择。\n-   [处理管道]: 处理管道代表当前运行于云端的大规模数据应用。此类数据处理应用支持：\n\n    *   浏览器生成的数据集记录。\n\
  \n    *   相关数据预测与分析。\n\n    *   图像处理，包括图像转换以支持图像增强和缩略图，以及图像压缩和加密。\n\n    *   视频转码，以支持从一种视频格式转换到另一种格式。\n\
  \n    *   文档处理，包括对文档进行加密和格式转换。数据处理还支持光学字符识别 (OCR)，以允许编辑 PDF 文件。\n-   [批处理]: 批处理系统也覆盖了企业计算中大量数据密集型应用的广泛范围。此类应用通常有截止日期，未能满足这些截止日期可能导致严重的经济后果。安全性也是许多批处理应用的关键方面。批处理用途的非详尽列表包括：\n\
  \n    *   基于特定时期为各经济、健康及其他类型部门生成详细报告。\n\n    *   大型企业的库存管理。\n\n    *   处理发票声明。\n\
  \n    *   更新软件源码。\n\n    *   验证软件和硬件系统的真实性。\n-   [Web 访问]: 网站的访问通常在短暂或偶发时期进行，例如在会议、圣诞节或夏季期间。其他有限时间的网站用于促销活动，夜间“休眠”，白天自动扩展，并将数据存储在靠近计算服务器的位置。因此，存储成本（每\
  \ GB）较低，且数据处理更高效。\n-   [电子学习]: 过去需要去图书馆才能查找信息的日子已成过去。如今，数字化课堂可让学生在线创建和提交演示文稿、通过网络会议远程上课、以及参与全球分布式项目的协作与参与。电子学习云系统的示例包括\
  \ SlideRocket 和 Ratatype。\n-   [医疗]: 传统上，在海量医院记录中查找患者病史被视为一项繁琐的任务。相反，随着医疗管理系统（如医疗云）的出现，所有数据均存储在安全的云端解决方案中，只需点击即可检索。云服务使所有信息在云端共享并可供所有相关投资者访问。除了信息共享外，云保证无延迟，这对于解决关键情况至关重要。此外，云服务的集成使得远程手术成为可能，这将在医疗领域带来有前景的进步。\n\
  -   [防病毒应用]: 过去，防病毒软件安装在公司系统中。随着云的出现，公司无需在本地安装防病毒软件，因为防病毒软件已部署在云端。因此，该软件可远程监控公司系统，识别安全风险并进行修复。\n\
  -   [电子商务应用]: 基于云的电子商务能够在最短时间内快速响应市场的任何新兴机遇和挑战。用户能够迅速抓住市场机会，传统电子商务也能迅速应对挑战。云基础电子商务以最短时间提供新的商业模式。客户数据、产品数据及其他运营系统均在云端环境中管理。例如，Hepsiburada、Gittigidiyor\
  \ 和 n11 等土耳其电子商务平台使用 Google Cloud 的 Big Query 平台来利用数据和洞察，更精准地识别客户需求，从而改善数据驱动的决策环境。\n\
  -   [电子政务应用]: 云计算为政府开展多项活动提供服务。它帮助政府以扩展、可扩展和定制化的方式专业提供服务，并通过降低管理、安装和升级应用所需的不必要成本，实现成本节约。\n\
  \n\n\n-   **个人存储**：云提供了与云存储个人数据相关的无限制功能，并且可以通过在云上运行的应用程序（如 Dropbox）实现这些文件的共享。\n\n\
  -   **导航**：大多数现代车辆（如特斯拉）都配备导航程序。云计算使这些导航程序能够存储大量地图数据并定期更新，以帮助驾驶员。驾驶员每次使用这些工具时，都间接利用云端来到达目的地。此外，这些车辆公司还提供将车主信息和偏好同步到其他车辆的选项（如果他们拥有多辆车）。\n\
  \n### 3.3 云端实时天气预报系统\n\n本节详细阐述了基于云计算的实时天气预报系统。天气预报是指预测在特定时间和地点未来大气状态的情况。气象预报主要采用物理模型来模拟和预测气象动力学，即数值天气预报（NWP）。在\
  \ NWP 中，大气被建模为流体，并通过求解大气水文热力学方程的数值解来提供未来的大气状态。初始条件直接影响预测的准确性，而微分方程在扰动下的不稳定性以及初始测量的不确定性会影响\
  \ NWP 的可靠性 \\[5\\]。如今，随着物联网的发展以及神经网络、模糊逻辑、时间序列和回归分析等技术的应用，实时天气预测变得可行。主要依赖于连接云服务的本地传感器的几个短期预报系统已经出现。实时天气预报系统的数据流如图\
  \ 3.10 所示 \\[Figure 3.10\\]。\n\n``` \n![Figure 3.10 Weather-forecast system data\
  \ flow.](img/fig3_10_B.jpg)\n```\n\nFigure 3.10 Weather-forecast system data flow.\n\
  \n下面是数据流系统每个块的描述：\n\n1.  本地托管 Servlet：该 servlet 位于 Apache Tomcat 服务器上，不同于云托管的 servlet，但功能相似。连接到\
  \ servlet 需要先验证服务器 IP 地址。\n\n2.  MySQL 数据库：该数据库本地存储不同应用程序请求的数据。除了云托管的 servlet 外，它还在本地服务器上进行预测。\n\
  \n    *   **本地服务器**：本地服务器的功能包括：\n\n        *   显示实时图表，监控当前天气状况。\n\n        *   本地或通过\
  \ Cloudant 平台收集各种应用的数据。\n\n        *   本地进行预测并将结果显示给客户端。\n\n        *   将请求的数据从其数据库或\
  \ Cloudant 平台传输。\n\n        *   为移动和桌面客户端提供数据或分析结果的请求服务。\n\n3.  Cloudant 数据库：IBM\
  \ Cloud 平台提供 Cloudant 数据库作为服务，天气数据在云端收集并可全球访问。\n\n4.  云托管 Servlet：客户端访问网页时发出的请求由\
  \ servlet 处理。servlet 执行以下任务：\n\n    *   更新客户端访问的网页上实时图表。\n\n    *   根据客户端请求从 Cloudant\
  \ 数据库检索数据。\n\n    *   进行分析审查并将结果发送回客户端。\n\n5.  Web 应用：向用户提供不同的实时天气数据，图表形式多种多样，用户可以在特定日期或多个监测数据上访问并保存数据。更多关于上述块的详细信息可在\
  \ \\[5\\] 的第 7 章 \\[Chapter 7\\] 中找到。\n\n6.  天气数据采集的移动和桌面应用程序：本部分介绍了开发 Android 应用以从\
