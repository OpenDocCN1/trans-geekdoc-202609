  \n## 20.1 Introduction\n\n物联网的安全，特别是基于机器学习(ML)和深度学习(DL)技术的入侵检测系统(IDS)。我们系统地研究和分析不同的入侵检测机制，以识别它们的局限性和优势。这些技术正在网络安全领域成为新兴系统。\n\
  \n物联网 (IoT) 自 1999 年末 `1` 起便已显现。它随着数以百万计的可穿戴设备、传感器、执行器、医疗设备、家用电器等的快速增长而显著发展。全球已有数十亿的联网设备；预计未来几年将增长到\
  \ 220 亿以上 `2`。大多数物联网设备在设计时并未考虑到为用户提供安全和隐私保护 `3`。2019 年，在蜜罐服务器上发现了超过 1 亿 5000 万次攻击\
  \ `4`。入侵检测系统 (IDS) 是结合多种方法，用于在主机和网络层面检测恶意行为 `5, 6`。尽管在网络入侵研究方面已有大量成果，但在检测入侵和防止其发生方面仍有大量改进空间\
  \ `1`。入侵是故意的尝试或威胁，旨在获取数据、修改信息或使系统变得不可信和无效。例如，DoS 攻击会让服务器忙于处理大量不必要的请求，导致合法用户无法获得预期服务。基于异常的入侵发现是识别网络流量中不常见、不匹配常规流量的模式的问题。这些异常被称为异常、异常值、特殊性等。\
  \ `2, 3`。异常发现在信用卡欺诈检测、网络安全和军事监控等领域有广泛应用。IoT 网络中的异常流量表明被入侵的系统正在向非授权设备发送敏感信息。\n\n\n\
  \n研究人员自 19 世纪以来一直在研究统计学中异常检测的问题`2`。过去几十年里，`ML`和`DL`在异常检测方面发挥了重要作用。大多数综述都没有讨论具体的方法，这些方法有助于提升性能`2,\
  \ 5, 6]`。在本章中，> 我们详细讨论了入侵检测是什么、物联网中的不同攻击类型，以及用于检测这些攻击的方法和所使用的数据集。物联网中的传感器收集数据并通过有线和无线通信介质传输数据。物联网系统必须在来自大量传感器的巨大信息量的情况下，不丢失数据的前提下处理这些信息，同时提供安全的通信`7]`。物联网通过网络传输信息，因此面临安全问题`8]`。可靠的认证机制、数据的完整性和保密性是物联网环境中必须实现的安全目标。如果任何这些问题被侵犯，就会导致网络不安全。物联网设备资源有限，即电池、存储容量、带宽和计算能力，因此高度复杂和可配置的安全模型并不实用`9]`。基于机器学习和深度学习的安全模型是物联网系统安全的有前途的替代方案。机器可以通过机器学习和深度学习的方法进行训练，以检测不同的攻击并提供所需的防御机制。攻击可以在初期阶段被发现，新型攻击可以通过巧妙利用新技能来被检测出来。与以往相比，机器学习和深度学习模型为物联网网络提供了更好的安全机制。\n\
  \n## 20.2. Detection of Intrusion\n\n这是一组旨在损害网络和授权用户的安全与隐私的活动，涉及保密性、完整性和可用性`10`。通常由外部代理非法访问系统并进行操控。入侵检测系统（IDS）提供明确的机制来保护系统基础设施，这些系统收集网络信息并对其进行分析，以检测可能的安全攻击。\n\
  \n入侵检测的功能包括：\n\n1.  跟踪和分析网络中的不同用户、网络活动以及网络本身。\n\n2.  开发机制，以识别不同的攻击。\n\n3.  分析文件系统和完整性。\n\
  \n4.  分析网络活动偏离正常活动的情况。\n\n5.  监控用户违规行为。\n\n### 20.2.1 概念：异常检测\n\n在网络异常检测中，正常性概念是提供解决方案的基础。正常性的概念表现为一组影响系统动态的基本变量之间的关系。如果一个实体或对象在系统的特征或行为上偏离了常规模型所定义的规律，则被视为异常。\n\
  \n### 20.2.2 攻击分类\n\n入侵者分为两类：(a) 外部入侵者和 (b) 内部入侵者。外部入侵者是系统的非法操作者。内部入侵者是授权用户，但没有权限访问资源或超级用户模式。\n\
  \n#### 20.2.2.1 网络入侵检测的先前研究\n\n对于异常检测，基于统计和机器学习的综述已经进行过`11, 12]`。对于数值和符号数据，已进行了广泛的综述`13]`。Patcha、Park\
  \ 等人对网络入侵检测进行了专项综述`14`，Snyder 也进行了综述`15]`。张等人对异常检测方法的全面综述是`16]`。Sperotto 等人介绍了基于流量技术的入侵检测概念，并详细讨论了\
  \ DoS 攻击、僵尸网络和病毒的发现方法`17]`。\n\nSun 等人对移动自组网络（MANET）和无线传感器网络（WSN）中的入侵检测进行了综述`18`，并讨论了将各种移动特性融合用于构建\
  \ IDS 的多种问题和研究挑战。\n\nSun 等人介绍了基于马尔可夫链和 Hotelling T2 的 IDS 模型用于 MANET，并使用分类技术检测异常。Wu\
  \ 和 Banzhaf 介绍了使用计算智能方法进行入侵检测的应用，包括神经网络、模糊逻辑、演化计算和人工免疫系统等。DoS 和 DDoS 攻击检测技术受到极大的关注`20]`。\n\
  \n### 20.2.3 不同类型的攻击\n\n物联网过去十年来经历了各种各样的攻击，因此物联网设备制造商在开发和使用时更加谨慎。物联网攻击可分为物理攻击和网络攻击。网络攻击是指黑客入侵系统，盗取、删除、修改或操纵用户信息的行为。在物理攻击中，攻击者不通过网络，而是直接对物联网设备（如传感器、摄像头和路由器）进行物理损害，从而导致网络中断`21]`。\n\
  \n#### 20.2.3.1 主动攻击\n\n在主动攻击中，入侵者干预系统，旨在扰乱配置、阻断或导致网络故障。有时，他还试图窃取和修改信息。主动攻击包括拒绝服务（DoS）、干扰、洞攻击和\
  \ Sybil 攻击。\n\n##### 20.2.3.1.1 拒绝服务（DoS）\n\n攻击者持续向系统发送冗余请求。结果，设备忙于处理请求，无法为实际用户提供服务，从而导致系统功能失常。由于设备持续处于活跃状态，电池寿命逐渐减少。特殊类型的\
  \ DoS 攻击是分布式拒绝服务攻击（DDoS），攻击者同时从多个 IP 地址向服务器发送请求，使服务器忙于处理请求，从而难以区分正常流量和攻击流量`22]`。最近，臭名昭著的“Mirai”僵尸网络发起了破坏性的\
  \ DDoS 攻击，造成了数千个物联网设备的毁灭`23]`。\n\n##### 20.2.3.1.2 冒充和 Sybil 攻击\n\n为了非法获取数据，这些攻击主要针对凭证，如\
  \ RFID、MAC 地址。由于 TCP/IP 协议缺乏可靠的验证机制，冒充攻击更容易成功。这两种攻击会招致更严重的后果。\n\n##### 20.2.3.1.3\
  \ 干扰攻击\n\n通过向物联网设备传输不需要的信号，干扰攻击会使无线网络变得繁忙。这种攻击会降低网络性能，增加能耗、带宽和内存使用。\n\n##### 20.2.3.1.4\
  \ 中间人攻击\n\n在中间人攻击中，攻击者假装是合法用户，从而能够在网络中制造问题，并可能窃取和滥用信息`22]`。这种攻击可以捕获敏感数据，如登录凭据和信用卡信息。该攻击也被称为“猴子中间人”或“怪物中间人”攻击。\n\
  \n##### 20.2.3.1.5 选择转发攻击\n\n在选择转发攻击中，攻击者作为网络中的一个节点，丢弃不同的数据包，在网络中创建“洞”。这种攻击在网络中很难被发现和防范。\n\
  \n\n\n\n## 20.2.3.1.6 数据篡改\n\n攻击者有意使用用户的数据，故意扰乱用户的保密性。诸如位置、计费价格和健身等物联网设备所携带的重要信息，由于这些数据篡改攻击而面临巨大威胁\
  \ \\[24\\]。\n\n## 20.2.3.2 被动攻击\n\n攻击者未经用户同意收集用户的数据，并试图解密其私密的受保护信息 \\[25\\]。在物联网中，窃听和流量分析是执行被动攻击的两种方式。用户的物联网设备作为窃听器被部署，用于收集并混乱其私密数据和位置\
  \ \\[26, 27, 28 和 29\\]。\n\n## 20.2.4 攻击对物联网的不同后果\n\n攻击对物联网用户的身份、授权、验证和隐私产生后果。图\
  \ 20.1 给出了不同种类攻击及其在物联网上的后果。在开发新的物联网安全协议时，必须考虑以下影响以防止这些影响。\n\n![Figure 20.1  不同类型攻击、攻击面和攻击效果。](img/fig20_1_B.jpg)\n\
  \nFigure 20.1  不同类型攻击、攻击面和攻击效果。\n\n## 20.2.4.1 识别\n\n识别意味着对物联网用户的授权，仅允许授权用户访问网络和云服务器。保持物联网的强健性和权衡正在为识别创造挑战\
  \ \\[30\\]。Sybil 和 Spoofing 等攻击破坏网络安全，使未经授权的用户无需适当识别即可进入网络。因此，需要开发有效且强大的安全机制，以阻止未经授权的用户进入系统\
  \ \\[31\\]。\n\n## 20.2.4.2 授权\n\n授权指用户的可达性。只有授权用户才能访问、监控和使用信息。维护用户和请求的日志并根据请求需求提供信息非常困难，因为不仅人是用户，传感器和不同机器也充当用户\
  \ \\[32\\]。在处理大数据集时，维护强大的保护环境也非常困难 \\[33\\]。这在 Fig. 20.2. 中显示。\n\n![Figure 20.2\
  \  不同攻击及其效果。](img/fig20_2_B.jpg)\n\nFigure 20.2  不同攻击及其效果。\n\n## 20.2.4.3 可达性\n\n\
  可达性确保只有授权用户能够获得物联网系统提供的服务。创建有效的安全网络至关重要，因为 DoS 和干扰等攻击会发送不必要的请求，导致服务器始终忙碌。因此，需要强有力的协议，确保授权用户在不中断的情况下获得物联网设施\
  \ \\[34\\]。\n\n## 20.2.4.4 隐私\n\n物联网的隐私受到主动攻击和被动攻击的影响。个人身份、位置、健康记录和国家安全数据等敏感信息必须不被泄露给任何未经授权的用户\
  \ \\[35\\]。然而，由于攻击者跟踪物联网设备的位置以解密信息并滥用它，保护网络隐私非常困难 \\[36\\]。\n\n## 20.2.4.5 完整性\n\
  \n完整性确保只有合法用户可以修改物联网设备的任何数据。这一要求对于任何物联网网络都至关重要。SQL 查询注入攻击是一种恶意攻击，会破坏网络的完整性。如果此特性受到破坏，物联网的功能将受到影响，不仅泄露敏感数据，还会危及人类生命\
  \ \\[36\\]。\n\n## 20.3 入侵检测系统 (IDS)\n\n入侵检测系统是一种通过警报通知网络攻击的方法，并采取措施阻止攻击者 \\[37\\\
  ]。已开发出许多 IDS，主要分为三类。\n\n1. HIDS（主机基于 IDS） – 它跟踪关键操作系统文件，检测内部活动，如哪个程序获取了哪些资源并进行禁止性入口。它观察系统状态及存储的事实，可能在内存、文件系统或日志文件中。HIDS\
  \ 充当一种监视器，监控操作系统告知的安全策略是否被任何人或任何事物违反 \\[38\\]。\n\n2. NIDS（网络基于 IDS） – 它分析网络中流动的数据。当流量模式出现偏差时，即系统按顺序建模数据以检测偏离该模式时，即可识别入侵。这些攻击的主要原因是非法使用网络，意图窃取或获取数据或干扰网络的功能。\n\
  \n网络通过互联网与世界相连。NIDS 捕获所有入站流量以检测流量模式的偏差。例如，如果观察到在短时间内出现大量针对不同端口的 TCP 连接请求，可以假设某些攻击者正在在网络中的特定计算机上进行“端口扫描”。要检测入站\
  \ shell 的端口扫描，需要对入站流量进行类似 IDS 的分析。除了分析入站流量，NIDS 还提供来自出站流量的有价值的入侵信息。现有 IDS 包含三种功能机制\
  \ \\[39\\]。\n\n1. 信息来源 – 入站数据包的事件信息来源，或用于判断入侵的信息。\n\n2. 分析 – 这是最重要的机制，它通过分析组合动作来判断入侵是否正在发生或已经发生。\n\
  \n3. 响应 – 检测到入侵后的响应分为两种：主动和被动。在主动响应中，系统自行介入。在被动响应中，检测详情会报告给管理员，由管理员介入。\n\n### 20.3.1\
  \ 机器学习和深度学习在入侵检测中的应用\n\n\n\n\n机器学习是人工智能的一部分，系统地应用其算法来综合数据和信息之间的内在关系。1959 年，Samuel\
  \ 将 ML 定义为赋予计算机在没有显式编程 `cvar = avar + bvar` 的情况下学习的能力的研究领域。ML 是统计学、概率论、线性代数、信息论和算法理论等多个学科的结合。ML\
  \ 算法分为三类：监督学习、无监督学习和增强学习。监督学习的输出变量可以从学习中预测，而输出变量不通过无监督学习估计。机器通过增强学习以连续的方式自我教育，从过去的知识中学习并尝试理解最精确的数据以做出精确的决策。线性回归、逻辑回归、决策树、随机森林、人工神经网络（ANN）、k\
  \ 最近邻（KNN）、支持向量机（SVM）和 Naive Bayes 是最知名的算法。机器学习存在局限性。它在原始形式下激活常规记录方面受到一定限制。设计特征提取器需要大量经验，该提取器将原始信息转换为适当的表征，以便分类器可以分类或检测模式。深度学习提供简单的表示。为了更好地提高效率，SVM\
  \ 和 DT 等机器学习算法被广泛使用。“IoT”和“ICN”在无监督学习模型中非常流行。\n\n机器学习和深度学习模型在对抗性环境中的有效性显著下降。通过某种方式，网络的实际性能在对抗性环境中被阻碍。对抗性示例使用进化计算和深度学习生成。许多机器学习模型和分类器因其对抗性环境而出现高误分类率。已提出一种用于对抗性环境中入侵检测的增强学习算法。\n\
  \n为了获得更好的结果，在训练中加入对抗性代理策略，这会增加分类器的错误预测，并迫使其学习最困难的情况。然而，在这些环境中，仍需更多研究来研究入侵检测。\n\n\
  ### 20.3.1.1 决策树\n\n它是由决策及其结果组成的树模型，帮助做出决策。它是一种主要用于 IDS 中分类活动的互相管理的学习分类技术。训练好的 DT\
  \ 会选择数据包的特征以确定其类别。大多数数据包都包含在一个具有最小层数的最优 DT 中。ID3、C4.5 和 Classification and Regression\
  \ Tree（CART）是几种用于一般最优树的算法。使用的度量用于衡量 DT 的性能。选择信息最高的属性称为“熵”。ID3 算法基于熵做出决策。但 ID3 的局限性在于它无法识别特征中具有连续性的缺失值。C4.5\
  \ 利用 ID3 的信息增益比率并剪枝，这并未提供帮助。ID3 不处理回归任务，而 CART 使用 Gini 不纯度作为度量来处理回归任务。\n\nDT 是入侵检测的常见模型，具有独特的分类方法，易于应用和解释，并且可以在构建后进行剪枝以获得更好的概括性。提出了一种由三层组成的机制，称为\
  \ IDS，它依赖于 MAC 地址识别 IoT 设备，将消息分类为真实和伪造，然后使用 DT 进行攻击分类。DT 用于对分类记录进行分类，标记为恶意。系统识别了\
  \ DoS 攻击、僵尸网络（botnets）和扫描，并取得了良好的结果。K 数量的集群是通过 K-means 算法根据欧几里得距离的相似性来形成，该算法将 C4.5\
  \ 应用于每个组，构建用于合法和恶意消息的决策树。\n\nDT 的局限性在于其鲁棒性较弱。当训练记录进行少量修改时，它会产生完全不同的 DT。大型 DT 需要手动剪枝，因为数据增益受额外层级特征的影响。\n\
  \n### 20.3.1.2 支持向量机（SVM）\n\n为了最优分类数据，会构建 N 维超平面。SVM 分为两种类型：线性和非线性。当该模型用于线性可分割的数据时，它会通过一条直线将其分为两组。如果是非线性数据，则使用非线性\
  \ SVM。使用核函数方法，将数据点在更高维空间中通过平面或函数进行分离。\n\nSVM 可以简化高维问题。它基于小而简单的统计理论，具有良好的概括能力，并常用于入侵检测。开发了一种轻量级攻击检测策略，用于检测\
  \ IoT 网络中因注入不需要的数据而引起的攻击。该策略获取特征池并与标签向量一起使用。该技术具有良好的分类策略和发现时间。构建了一个基于 DT 结构的四阶段\
  \ SVM 检测方法。通过 SVM1、SVM2、SVM3 和 SVM4 实现对常规数据、拒绝服务攻击、探测、R2L 或 U2R 的检测。实验表明，该模型在性能上优于单阶段\
  \ SVM 模型。该方法还利用统计方法和自组织映射（S-O-M）来区分正常流量和恶意流量。为区分正常和恶意流量，该方法还使用 PCA 和 Fisher Discriminant\
  \ Ratio（FDR）进行噪声消除和特征选择。还使用 PSOM（概率自组织映射）。\n\n### 20.3.1.3 聚类\n\n它将相似类型的对象从其他类型中分组。聚类算法种类繁多。根据对象与聚类之间的匹配标准，它们分为硬聚类和软聚类。K-means\
  \ 聚类和 KNN 是广泛使用的算法，可以计算对象之间的欧几里得距离。每个对象的群组归属度由概率程度测量。\n\n聚类算法的不同类别包括连接性基于、K-means\
  \ 基于（中心基于）、分布基于、密度基于和网格基于。算法的局限性在于它们简单易实现和解释。结果过于依赖于异常值和参数的早期值。\n\n为了获得聚类并减少相似性，采用小批量\
  \ K-means 和 PCA 来降低维度。实验结果和时间复杂度分析表明，该方法有效。无监督入侵检测系统（UIDS）可以检测未知攻击。\n\n### 20.3.1.4\
  \ 深度神经网络（DNN）\n\n\n\n\n#### 20.3.1.5 The CNN\n\n它在计算机视觉中表现出卓越的性能[64]。这些方法已显示出良好的结果[65,\
  \ 66]。卷积神经网络(CNN)受生物过程启发，是神经网络的共享模型，同时也涉及卷积核。\n\nCNN 具有提取本地特征的能力，可以检测质量，同时降低计算复杂度，从而提高训练和计算速度。\n\
  \n#### 20.3.1.6 The RNN\n\n当数据由频繁连续的数据流组成时，循环神经网络(RNNs)在入侵检测系统(IDS)中被广泛应用[67]。然而，RNN\
  \ 在处理激活函数时效率不高。当网络层数较多时，梯度消失现象会发生。DNN 在处理时序变化数据的困难通过 RNN 得到解决。\n\n#### 20.3.1.7\
  \ LSTM\n\n经典的 RNN 问题，即梯度消失问题，通过长短期记忆网络(LSTM)通过引入额外的存储状态来解决[68]。LSTM 通过将门函数作为激活函数，有效控制梯度消失问题的程度。梯度消失问题是在网络训练过程中遇到的一种不稳定行为。它表明当神经网络无法将有价值的梯度数据从原型的输出传播回到系统输入附近的层时会出现问题。\n\
  \n结果是，具有许多层的模型一般无法从可用数据集中获取数据。\n\n遗忘门被引入，使得 LSTM 能够通过模拟原始 LSTM 架构中记忆过程的失败来重新组织其状态[68]。由于其效率，它被视为最传统的\
  \ LSTM 架构。LSTM 的性能通过包含重新组织门和更新门的 GRU 得到维持[69]。\n\nRNN 的最大偏差是 LSTM，因为它解决了经典 RNN 的梯度消失现象。LSTM\
  \ 被许多 IDS 研究所使用[70, 71]。LSTM 网络非常适用于目录和基于时间序列数据的预测，但无法回忆机制。LSTM 网络在检测数据流方面得到改进。\n\
  \nLSTM 模型运行成本高，因为其架构无法在等效条件下进行训练，这是由于 RNN 的固有特性[72]。\n\n#### 20.3.1.8 Naive Bayes(NB)\n\
  \nNB 算法是一系列信息收集算法的集合，它们使用概率的贝叶斯定理，假设每对特征之间存在显著的独立性。Naive Bayes 算法是一种基于贝叶斯定理的监督学习算法。\n\
  \n入侵检测问题受到高维网络数据流维度的影响，并基于隐式 Naive Bayes(HNB)模型[73]。两个或多个事物之间的相互关系被称为相关性。\n\n(20.1)\
  \  \n\n$$\\\\text{P}(\\\\text{A} \\\\mid \\\\text{B}) = \\\\frac{\\\\text{P}(\\\\\
  text{B} \\\\mid \\\\text{A})\\\\text{P}(\\\\text{A})}{\\\\text{P}(\\\\text{B})}$$\
  \  \n\nAnd\n\n(20.2)  \n\n$$\\\\text{P}(\\\\text{A} \\\\mid \\\\text{B}) = \\\\\
  frac{\\\\text{P}(\\\\text{B} \\\\mid \\\\text{A})\\\\text{P}(\\\\text{A})}{\\\\\
  text{P}(\\\\text{B})}$$  \n\n在入侵检测中，攻击的概率可以通过最初估计前序数据属于该类型攻击的概率，然后乘以该类型攻击发生的概率来计算。\n\
  \nNaive Intrusion detection problems are affected by high network data stream, dimensionality,\
  \ and highly correlated features based on the HNB model [73]. A common relationship\
  \ among two or more things is known as correlation if there are certain points(*x[i]*,*y[i]*),*i*\
  \ = 1,2,3...*n* in a dataset. Correlation observes if huge values of “*x*”are combined\
  \ with huge values of “*y*”and small values of “*x*”are combined with small values\
  \ of “*y*,”also if minor values of “*x*”are combined with huge values of “*y*” and\
  \ vice versa. Correlation coefficient is computed by\n\n$$\\\\sum\\\\limits\\_{i\
  \ = 1}^{n}\\\\frac{\\\\left( {x\\_{i} - \\\\underset{¯}{x}} \\\\right)\\\\left(\
  \ {y\\_{i} - \\\\underset{¯}{y}} \\\\right)}{\\\\sqrt{{\\\\sum\\_{i = 1}^{n}\\\\\
  left( {x\\_{i} - \\\\underset{¯}{x}} \\\\right)^{2}}{\\\\sum\\_{i = 1}^{n}\\\\left(\
  \ {y\\_{i} - \\\\underset{¯}{y}} \\\\right)^{2}}}}$$  \n\nThe conditional independence\
  \ approach of the Naive Bayes model is relaxed by the HNB data mining model. Greater\
  \ efficiency is achieved in terms of accuracy, error rate, and misclassification\
  \ cost by the HNB model than the traditional NB model. A multi-agent IDS Naive algorithm\
  \ called NB-MAIDS specifies possible pressures of DDoS threats in the IoT and applied\
  \ multi-agents in the entire network [74]. In this model, the information is gathered\
  \ by different agents through sensors. Then further processing is done through the\
  \ analysis of gathered information. The attacks and illegal activities may be prevented\
  \ by disseminating the gathered information of malicious traffic to either the connected\
  \ IoTs or the administrator. Serious security issues in IoT are DoS and DDoS. In\
  \ these attacks, the network services are disturbed by flooding unwanted, meaningless\
  \ huge traffic over the network. DDoS attacks are massive and hazardous. It tries\
  \ to capture the bandwidth and prevent legitimate users from receiving the required\
  \ service from the intended network. Mostly there exist two mechanisms to initiate\
  \ DDoS threats on IoT. (i) The attacker sends some faulty packets to the victim\
  \ to create some hindrance to the protocol or application running on it. (ii) The\
  \ attacker tries to execute one or both of the following.(a) Application-level flooding\
  \ attack is done by overloading the resources of the server. By this, the attacker\
  \ blocks and delays the services to a legitimate valid user [75].\n\n\n\n为实现共同目标，代理人以协调和支持的方式独立收集数据和信息。所有代理人基于共同的算法工作，并在需要时相互通信。通过在多代理之间分配负载，入侵检测时节点的工作负载可以大幅降低。在分布式系统中，实施多代理系统（MAS）是最合适的。\n\
  \n## 20.4 入侵检测数据集\n\n从 DARPA 1998 年开始，新的数据集开始在研究社区中出现。自 2009 年起，入侵发现数据集呈现出迅猛增长的趋势。表\
  \ 9 中列出的数据集中，超过一半来自模拟实验。此类数据集的精确性和有效性是一个大问题 \\[77\\]。基于这些数据集构建的入侵检测模型被观察到效率低下。\n\
  \n从 表 20.2 可以看出，KDD-99 和 NSL-KDD 是使用最频繁的数据集，尽管它们是通过模拟实验获得的。这些数据集长期以来一直广泛可用。每当研究人员提出一种新的入侵技术，希望与此前开发的旧技术进行比较时，都需要\
  \ KDD-99 和 NSL-KDD 数据集。这些数据集的内容被发现是过时的。\n\nTable 20.2  Use of Datasets by Different\
  \ Researchers\n\n| Dataset || No. of Times Used |\n| --- | --- |\n| **KDD-99** ||\
  \ **Forty-six** |\n| **NSL-KDD** || **Thirty-five** |\n| **U NSW-N B15** || **Eight**\
  \ |\n| **ISCX2012** || **Six** |\n| **Kyoto 2006+** || **Two** |\n| **Botnet** ||\
  \ **Two** |\n\n在未来的研究中，建议使用新的入侵检测数据集，例如 CIRA-CID-DoHBrw 2020。研究人员还应使用一些实时数据集，如 ISOT\
  \ CId、IoT-23 和 SDN 数据集，以验证他们的模型。\n\n**DARPA** 在 MIT Lincoln 实验室的模拟环境中创建了许多数据集，这些数据集在入侵检测研究中非常受欢迎。DARPA\
  \ 1998 和 DARPA 1999 包含五到七周的网络流量数据，格式为包。这些数据集中模拟了 DoS、缓冲区溢出、端口扫描和根包含等攻击。这些数据集广泛分布，但因冗余和人工注入的攻击而经常受到批评。\n\
  \n*   **KDD99:** 从 DARPA 网络数据集文件中创建了 KDD99 数据集。该数据集用于数据预处理以及通过数据挖掘研究 DARPA 数据集的结构。该数据集包含七周的网络流量数据。大约\
  \ 49 亿个向量包含在该数据集中。该数据集中的不同类型的攻击有：用户到根 (U2R)、远程到本地 (R2L)、探测和 DoS。数据集的每个出现都由诸如基本、流量和内容等集合中的众多结构描述。从\
  \ TCP/IP 连接中提取基本特征。流量特征属于同一主机或特定服务。数据部分的恶意行为属于内容部分。为评估入侵检测模型，KDD99 数据集被广泛使用。\n\n\
  *   **NSL-KDD:** 该数据集被建议用于解决 KDD99 的问题。该新数据集也存在许多问题 \\[78\\]。可以使用该数据集比较不同的入侵检测模型。该数据集的优势在于可以在不使用部分记录的情况下进行完整的实验。该数据集有助于研究一致且可比较的结果。\n\
  \n*   **UNSW-NB15:** 澳大利亚网络安全中心的网络实验室创建了该数据集。由于其包含新型攻击的多样性，该数据集被广泛使用。模糊器、后门、DoS、通用、侦察、壳码利用和蠕虫是使用该数据集分析的攻击类型。该数据集包含\
  \ 82,332 条训练记录和 1,75341 条测试记录。\n\n*   **CICIDS2017:** 该数据集包含源数据及分析结果，即包含时间戳、发送者和接收者\
  \ IP 地址、不同端口、进程、威胁的令牌移动以及所有 benign 和常见攻击的 CSV 文件。研究人员使用 B-profile 系统来检查用户的非法行为，以在背景中创建\
  \ benign 流量。加拿大网络安全研究所的该数据集可在应用层 DoS/DDoS 攻击的入侵检测数据集上在线访问。研究人员在应用层执行了八种 DoS 攻击。通过将\
  \ ISCX 2012 数据集的无攻击流量结果与攻击痕迹结合，生成正常用户行为。该数据集提供 24 小时的网络流量包设置。\n\n*   **CICIDDoS2019:**\
  \ **CICIDDoS2019** 包含最新的 DDoS 攻击。该数据集与真实世界数据相似。该数据集使用 CICFLOWMeter-V3，其中包含网络流量分析的结果，以及基于时间戳的发送者和接收者的令牌流。\n\
  \n*   **KDD – CUP-99:** **Kyoto 2006+** 是一个小范围的真实用户行为数据集，由蜜罐公开。开发人员将包-based 流量转换为会话。每个会话包含\
  \ 24 个类别；其中 14 个数字是从 **KDD to CUP-99** 数据集中提取的统计结构，其余 10 个是正常流量特征。该数据集在三年内收集了 9300\
  \ 万会话。\n\n*   **NDSEC-1:** 数据集 **NDSEC-1** 展示了 botnet 和 brute force 类型的攻击，这些攻击与基于\
  \ UDP 洪水、HTTP、SYN、Exploits、端口扫描、伪造和 XSS/SQL 注入的 SSH、FTP、HTTP 和 DoS 相矛盾。该数据集于 2016\
  \ 年以包-based 方式生成，并可在线获取。研究人员从网络中提取了跟踪和日志文件。\n\n*   **CTU-13:** 2013 年，研究人员生成了数据集\
  \ **CTU-13**，以包格式呈现。数据流是单向和双向的。该数据集来源于大学网络，其 13 个设置来自 botnet 攻击。该数据集以网页门户形式展示了受感染主机的信息。流量被标记为三种类型：(i)\
  \ 所有到和从受感染主机的通信被视为 botnet；(ii) 匹配特定过滤器的流量被标记为正常流量；(iii) 其余的通信被视为相关，可能是受感染或正常。\n\n\
  *   **BOT-IoT:** **BOT-IoT** 数据集由 UNSW Canberra Cyber 中心的网络实验室设计，用于创建真实的网络环境。数据集包含常规流量和\
  \ botnet 流量的混合。数据集文件以 pcap 文件、生成的 argus 文件和 csv 文件的不同格式呈现。为了更好的标记，文件根据攻击类别和子类别进行了分离。该数据集包含\
  \ keylogging、DDoS、数据入侵、DoS 和 Service scan 等攻击。使用 Node-red 工具模拟 IoT 网络。采用轻量级机器对机器\
  \ (M2M) 通信协议 MQTT。IoT 测试场景包括智能冰箱、天气站、运动感应灯、遥控车库门和智能恒温器。\n\n\n\n*   **IoT-23:** 网络流量是从一些实际设备的网络中提取的故障场景：一个智能\
  \ LED 灯、一个智能语音助手和一个 Somfy 智能门锁的数据集 `IoT-23`。它包含 20 个 PCAP 文件和 23 个 IoT 流量网络场景。在每个恶意场景中，使用不同的协议通过树莓派恶意软件进行执行。已在未受干扰的\
  \ Internet 连接上运行恶意软件和正常 IoT 流量的场景。它于 2020 年 1 月首次发布，检测时间跨度为 2018 年至 2019 年。该 IoT\
  \ 网络流量在捷克共和国 CTU 大学的 Stratosphere 实验室、AIC 小组、FEL 中捕获。其目标是为研究人员提供真实且标记的 IoT 恶意软件感染和\
  \ IoT 正常流量的大型数据集，以便开发机器学习算法。该数据集及其研究由阿维斯软件（Prague）资助。该数据集的目标是使两种数据集对社区可用：第一种包含恶意网络流量，第二种仅包含正常\
  \ IoT 流量。正常和恶意流量都有两个新的网络行为描述标签列。这些标签遵循以下过程分配。原始 .pcap 文件由人工分析。检测出可疑流量，并在分析仪表板上分配标签。分析员生成\
  \ labels.csv 文件。\n\n*   **LBNL:** 在企业网络中，LBNL 数据集被开发用于分析网络流量特征。该数据集包含几乎正常的用户行为，用于安全研究目的。该数据集以数据包形式存在，已匿名化，可获取最高一百小时的网络数据。\n\
  \n20.5 Evaluation Metrics in IDS\n\n入侵检测技术的效率可以通过不同的评估指标来衡量。常用的指标包括准确率、精确率、召回率、F1\
  \ 分数和误报率（FAR）。检测率或 True Positive Rate（TPR）也称为召回率。TPR 是正确分类的攻击与总攻击数的比值。用于识别攻击的分类准确率称为召回率。准确率是正确预测的样本占所有预测样本的比例。FAR\
  \ 是入侵发现中一个棘手的指标。误报是错误正值的结果。大量的 FAR 会增加网络的权重。\n\n随后，信息被分为四组：True Positive（TP）、False\
  \ Positive（FP）、True Negative（TN）和 False Negative（FN）。当模型正确预测阳性类时，称为 True Positive。当模型正确预测阴性类时，称为\
  \ True Negative。\n\n当模型错误预测阳性类时，称为 False Positive。当模型错误预测阴性类时，称为 False Negative。\n\
  \n所有指标都能够细致地反映分类器的工作情况。这些指标的概览可以在 Figure 20.3 中显示。\n\n![Figure 20.3  Hierarchy of\
  \ metrics.](img/fig20_3_B.jpg)\n\nFigure 20.3  Hierarchy of metrics.\n\n**Confusion\
  \ Matrix**\n\n混淆矩阵用于展示分类器的性能。\n\n|  |  | Actual Values |\n| --- | --- | --- |\n\
  |  |  | Positive | Negative |\n| Predicted Values | **Positive** | **Negative**\
  \ | **TP** **FN** | **FP** **TN** |\n\n| --- | --- | --- | --- | --- |\n|  |  |\
  \  |  |  |\n\n$$\\\\begin{array}{l} {\\\\text{~Accuracy~} = \\\\frac{\\\\text{TP}\
  \ + \\\\text{TN}}{\\\\text{TP} + \\\\text{TN} + \\\\text{FP} + \\\\text{FN}}} \\\
  \\\\\\ {\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\
  \\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\, = \\\\frac{\\\\text{~No}\\\\text{.~of~correct~predictions~}}{\\\
  \\text{~No}\\\\text{.~of~all~predictions~}}} \\\\\\\\ {\\\\,\\\\,\\\\,\\\\,\\\\\
  ,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\\
  ,\\\\,\\\\,\\\\, = \\\\frac{\\\\text{~No}\\\\text{.~of~correct~predictions~}}{\\\
  \\text{~size~of~Dataset~}}} \\\\\\\\ \\\\end{array}$$  \n\n**Precision**\n\n精确率是正确预测的阳性预测占所有阳性预测的比例（True\
  \ Positive）。\n\n$$\\\\text{~Precision~} = \\\\frac{\\\\text{TP}}{\\\\text{TP} +\
  \ \\\\text{FP}} = \\\\frac{\\\\text{~No}\\\\text{.~of~Correct~predicitons~}}{\\\\\
  text{~No}\\\\text{.~of~total~positive~predicitons~}}$$  \n\n**Recall/Sensitivity**\n\
  \n它是分类器正确预测的阳性案例数占所有阳性案例数的比例。\n\n$$\\\\begin{array}{l} {\\\\text{~Sensitivity~}\
  \ = \\\\frac{\\\\text{~True~positives~}}{\\\\text{~True~positives~} + \\\\text{~False~Negative~}}}\
  \ \\\\\\\\ {\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\\
  ,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\, = \\\\frac{\\\\text{~No}\\\
  \\text{.~of~correctly~predicted~positive~instances~}}{\\\\text{~No}\\\\text{.~of~total~positive~instances~in~the~Dataset~}}}\
  \ \\\\\\\\ \\\\end{array}$$  \n\n**Specificity (FAR)**\n\n它衡量正确预测的阴性预测的总数。\n\n$$\\\
  \\begin{array}{l} {\\\\text{~Sensitivity~} = \\\\frac{\\\\text{~True~Negatives~(TN)~}}{\\\
  \\text{~True~Negatives~+~False~Positives~}}} \\\\\\\\ {\\\\,\\\\,\\\\,\\\\,\\\\\
  ,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\\
  ,\\\\,\\\\,\\\\,\\\\,\\\\, = \\\\frac{\\\\text{~No}\\\\text{.~of~correctly~predicted~negative~instances~}}{\\\
  \\text{~No}\\\\text{.~of~total~negative~instances~in~the~dataset~}}} \\\\\\\\ {\\\
  \\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\
  \\,\\\\,\\\\,\\\\,\\\\text{F1} = \\\\frac{2 \\\\times \\\\text{~Precision~} \\\\\
  times \\\\text{~Recall~}}{\\\\text{~Precision~} + \\\\text{~Recall~}}} \\\\\\\\\
  \ \\\\end{array}$$  \n\n互相评估的指标是检测时间，即在入侵检测领域中使用已训练模型对模型进行分类所消耗的总时间。入侵检测研究经常面临维度灾难的问题，导致检测时间高，即使在特征收集用于降维时也如此。入侵检测的核心是以适当的检测率和可忽略的资源消耗来完成。高检测周期意味着算法的时间复杂度过高。\n\
  \n在大数据情况下，基于深度学习的模型耗时较长。一些算法的计算复杂度难以计算，这直接影响检测时间。因此，除了检测时间外，仍需在当前 IDS 研究中提供一个综合的复杂度评估。\n\
  \n20.6 Conclusion\n\n物联网（IoT）是全球广泛普及的技术，它正在给人类生活带来变革。\n\n物联网设备应在从家庭、农业、办公室、工业等不同领域进行配置时，落实安全与安全措施。尽管智能设备让人们与虚拟世界连接，使生活变得舒适、顺畅和便捷，但信息保密性和隐私安全问题仍是主要担忧。为了提升\
  \ IoT 网络的安全性，研究界对可靠且高效的安全协议有巨大需求。研究者面临的挑战是进一步诊断现有的安全机制和协议，识别其局限性，并开发适用于 IoT 网络的高效、安全、强健的安全机制。本章通过对以往研究的广泛文献综述，阐述了入侵检测、IoT\
  \ 网络中的不同攻击类型、基于机器学习/深度学习的入侵检测模型、相关数据集及其局限性、以及使用的性能指标。我们还指出了现有机制的局限性，并明确了研究挑战和问题。我们期望这将对该领域的研究者扩展和修正目标产生巨大帮助。\n\
