  \ 1–4 页）。IEEE。\n\n# 19 易受攻击的工业和农业控制系统在物联网框架内的脆弱性评估\n\nRoberto Caviglia, Franco Davoli,\
  \ Alessandro Fausto, Giovanni Gaggero, Mario Marchese, Aya Moheddine, Fabio Patrone\
  \ 和 Giancarlo Portomauro\n\n意大利热那亚大学，热那亚\n\nDOI: [10.1201/9781003326236-19](https://dx.doi.org/10.1201/9781003326236-19)\n\
  \n## 19.1 介绍\n\n工业控制系统（ICS）是一个涵盖多种控制系统的总称，包括监控与数据采集（SCADA）和分布式控制系统（DCS），同时也包括交通、水坝、应急服务、医疗、能源和农业等不同的网络物理环境。ICS\
  \ 由监测和控制组件组合而成，协同工作以实现工业控制目标。ICS 正在越来越多地依赖信息和通信技术（ICT）。ICS 通过将 ICT 能力纳入现有的物理系统，并常常取代或补充传统的物理控制机制而发展起来。物联网（IoT）通信技术是这一趋势的一部分。\n\
  \n从网络安全的角度来看，ICS 演进的一个重要步骤是采用不同的无线技术用于监测和控制目的。无线技术的使用意味着放弃“隐蔽安全”概念，即依赖于攻击者无法访问控制网络的假设。只要攻击者能够在覆盖范围内实现物理接近，就始终有可能对无线网络进行攻击。\n\
  \n农业领域采用的 ICT 技术包括传感器网络、自动化机器和自主车辆。随着新产品的不断涌现，开发测试这些设备的网络安全保护水平的方法和工具至关重要。为第三方实体提供符合特定要求的测试程序也是首要任务。软件定义无线电（SDR）是一项非常有用的测试无线通信的工具。SDR\
  \ 可以在不需要专用硬件或软件的情况下，对各种已知或未知的协议进行攻击的实现。从这个意义上说，SDR 可以被视为安全研究的基础技术。\n\n本章的目标是展示 SDR\
  \ 在农业领域的两种技术——传感器网络和自主可编程农业车辆——上实施攻击的应用。章节结构如下。Section 19.2 介绍 SDR 技术及其在渗透测试中的应用。Section\
  \ 19.3 描述在两个真实场景中的安全攻击实施：一种是可以自主操作或通过无线控制器远程管理的拖拉机；另一种是基于长距离宽带（LoRaWAN）物联网通信协议的传感器网络。结果展示了攻击的执行方式及其影响。结论在\
  \ Section 19.4 中给出。\n\n## 19.2 SDR 在网络安全中的应用\n\n### 19.2.1 SDR 介绍\n\nSDR 没有单一、统一、全球公认的定义。我们通常用\
  \ SDR 来指代基于通用硬件组件构建的无线设备，并使用可灵活配置的软件生成不同种类的无线信号。SDR 在军事领域可带来软件升级和可重新配置的无线电通信设备等好处，在商业领域可实现多协议多频段基站、移动多标准终端和认知无线电等应用\
  \ \\[1\\]。\n\nSDR 在网络安全中的作用可以是双重的 \\[2\\]：一方面，SDR 可用于对具有无线通信接口的潜在脆弱系统进行主动或被动攻击（恶意方面）；另一方面，SDR\
  \ 可帮助开发针对无线网络攻击的安全监测解决方案（防护方面）。\n\n### 19.2.2 SDR 用于渗透测试\n\nSDR 深刻影响了渗透测试社区的方法和工具\
  \ \\[3\\]。历史上，除了少数技术外，无线通信系统的威胁主要局限于拥有非常专业知识或专用硬件的个人。这种局限使得独立第三方在时间或资源有限的情况下，可靠地评估特定无线通信方案的安全性变得困难。\n\
  \nSDR 的使用使安全研究人员能够使用相对廉价的通用硬件和开源软件，对各种无线技术进行攻击，从而发现新的漏洞。文献中多篇论文展示了该方法在多种无线解决方案中的应用，如蜂窝技术、全球导航卫星系统、射频识别（RFID）和物联网（IoT）协议。Ref.\
  \ \\[4\\] 利用通用软件无线电外设（USRP）板和 OpenBTS 软件建立一个欺骗 GSM 基站系统，并展示了如何利用缺乏双向认证，执行国际移动用户标识（IMSI）捕获攻击并冒充移动用户发送恶意短信。Ref.\
  \ \\[5\\] 展示了使用 USRP 板对 LTE 网络进行攻击的方法，能够在 2 km 城市区域内定位 LTE 设备并阻断目标 LTE 设备的部分或全部服务。Ref.\
  \ \\[6\\] 描述了使用 GNU Radio 软件和 USRP 设备对蓝牙 2.1+ 安全简单配对（密码入口模式）进行攻击的实现，而 Ref. \\[7\\\
  ] 则展示了使用普通 SDR 平台进行 RFID 窃听的可能性。\n\n\n\n另一个基本应用领域是低功耗广域网（LPWA）协议。下面将介绍在该类网络中进行的大量攻击，详见\
  \ 第 19.3.2 节。\n\nSDR（软件定义无线电）工具和方法的一个有趣且特殊的应用是能够自动执行攻击并发现使用未知（专有）通信协议的设备的漏洞，这些协议没有公开的信息说明它们的工作原理、数据格式以及通信流程。传统上，对未知无线电协议的分析是手动完成的，需要自定义和定制的程序，通常在文献中难以找到，且缺乏明确的指导。SDR\
  \ 技术使第三方能够在没有协议规范的情况下进行安全验证，并采用更自主、更通用的程序。例如，Ref. \\[8\\] 利用 `HackRF One` SDR 卡和\
  \ `GNU Radio` 软件，研究基于未知射频（RF）协议的物联网设备的通信漏洞，包括对 RF 信号的解调与解码、干扰以及数据包重放等一系列测试。另一个例子是开源工具\
  \ `Universal Radio Hacker` \\[9\\]，该工具专为协议分析设计，能够连续执行诸如识别信号调制（ASK、FSK、PSK 等）、解调以及将信号映射到比特流等操作。虽然这已是无线协议分析自动化的重要一步，研究界仍需进一步工作，开发价格亲民、能够覆盖尽可能多协议的通用工具。\n\
  \n## 19.3 实世界应用中的安全攻击实现\n\n### 19.3.1 使用案例 1 - 自主驱动的农业机械\n\n#### 19.3.1.1 现代农业通信技术的最新状态\n\
  \n过去 20 年来，农业等行业（如建筑）的新技术迅速发展，使它们能够实现更高的效率和安全性。农业领域的最新研究，如 Ref. \\[12\\] 所示，探讨技术如何影响新型栽培技术，以实现整个食品链的高可持续性。这一过程导致所谓的“农业\
  \ 4.0”。该术语指示物联网（IoT）以及大数据、人工智能和云计算等新技术和方法在农业中的渗透，旨在提升生产链的效率。例如，Ref. \\[13\\] 展示了部署在自家作物田的物联网设备如何提升蔬菜质量，同时减少农民用水量和工作时间。Figure\
  \ 19.1 展示了农业 4.0 控制系统的一个典型架构。\n\n![Figure 19.1 An example of a control system architecture\
  \ in Agriculture 4.0.](img/fig19_1_B.jpg)\n\nFigure 19.1 An example of a control\
  \ system architecture in Agriculture 4.0.\n\n过去 20 年来的主要关注点之一是确保农业机械的高安全水平。Ref.\
  \ \\[14\\] 表明，在农业拖拉机上安装的 Rollover Protective Structure（ROPS）可将致命事故的概率降低 50%。为进一步降低此概率，目前正在研究和开发远程或自主控制农业机械的技术。虽然农业领域的安全、效率和产品质量随着创新而提升，但网络攻击的可能性也随之上升。传感器与执行器之间的互连，尤其是与互联网的连接，是这些系统易受攻击的关键因素，使恶意用户更容易探测、发现并利用新的漏洞。\n\
  \n目前，大量研究集中在自主车辆（尤其是拖拉机）上，以实现农业 4.0 的目标。Ref. \\[15\\] 对不同类型的自主拖拉机进行比较，并提出了一种基于神经网络的人工智能算法，用于提升自学习能力。Ref.\
  \ \\[16\\] 描述了一个园艺自主管理系统，使用两台自主拖拉机进行割草、果实采收和喷洒除草剂，并在 1300 公顷的园艺场通过物联网传感器（激光扫描仪、彩色摄像头）实现对农业车辆的\
  \ IoT 控制，这些传感器通过 GPS 进行登记。此外，Ref. \\[16\\] 还介绍了控制室的设计与实现，用于分析系统行为并向车辆发送指令。\n\n####\
  \ 19.3.1.2 农业领域网络攻击的最新状态\n\n如 第 19.3.1.1 节 所述，物联网设备的快速增长以及农业 4.0 控制系统的使用，使农业场景更容易受到更广泛的攻击，并增加了攻击者可利用的漏洞数量。文献中已有多项关于农业网络安全的研究。Ref.\
  \ \\[17\\] 分析了芬兰六个真实农场的通信架构，指出农民对其面临威胁缺乏认知，这是主要问题之一。Ref. \\[18\\] 定义了农业设备能够联网时产生的主要问题和网络威胁，讨论了智慧农业及整个食品供应链的安全、隐私和安全挑战。Ref.\
  \ \\[19\\] 展示了在智慧农业中使用 LoRaWAN 协议，指出可被利用的漏洞，并给出一种防范该类威胁的方法。\n\n大量文献表明，自动驾驶车辆（尤其是基于\
  \ CANbus 网络的车辆）在汽车行业中存在漏洞。Ref. \\[20\\] 通过对商用汽车进行渗透测试，证明可以控制刹车、转向、加速和显示系统。同一组作者在\
  \ Ref. \\[21\\] 中分析了大量车辆的远程攻击面，估计远程 compromising 它们的难度。汽车与农业车辆的控制网络具有许多共同元素，因此在汽车领域发现的漏洞可能也存在于自动化农业机械中。尽管相似，目前关于农业车辆网络安全的研究仍很少。Ref.\
  \ \\[22\\] 提出了一个农业车辆安全测试平台，作为识别商用现成组件中潜在漏洞的潜在解决方案。Ref. \\[23\\] 则提出了一个初步框架，用于验证自动化农业车辆的网络安全。\n\
  \n#### 19.3.1.3 农业自动化车辆的控制网络\n\n\n\n\n自动化农业机械通常配备具有多个无线接口的控制<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><un