  \ |\n\n### 7.5.1 Security Analysis\n\n智能合约一旦部署即不可更改，因此极易受到重入攻击。重入攻击发生在两个智能合约之间，攻击合约利用弱合约的代码缺陷窃取资金。攻击合约在调用\
  \ withdraw 函数前反复调用，导致弱合约未能更新余额。如 Figure 7.5 所示。\n\n![Figure 7.5 Security analysis.](img/fig7_5_B.jpg)\n\
  \nFigure 7.5 Security analysis.\n\nLendf.me 是一个允许在以太坊平台上进行借贷操作的去中心化金融协议。2020 年 4\
  \ 月 18 日，黑客利用重入攻击窃取了 2500 万美元。Lendf.me 的漏洞在于允许使用 ERC777 代币（一种支持更复杂交易交互的以太坊代币标准）作为抵押品，攻击者利用该特性执行复杂的重入攻击，耗尽平台\
  \ 99.5% 的资金，因为接收方是一个智能合约。\n\nMutex（互斥标志）被构建为 Reentrancy Guard 的函数修改，用于阻止此类攻击。该函数通过一个布尔锁标记，在调用前将其设为\
  \ true（已锁定），在函数执行完毕后将其设为 false（已解锁），从而防止重入。\n\n## 7.6 Results\n\n在交易初始化之前，需要将 MetaMask\
  \ 钱包连接到网站，并使用相关账户的登录信息。\n\n要使用 MetaMask 账户，需下载 MetaMask 扩展并将其添加到浏览器。安装后，需点击右上角图标打开\
  \ MetaMask 并创建新账户。\n\n打开网站后，右上角会弹出提示框，要求连接 MetaMask 账户。\n\n\n\n\nAfter 连接建立后，我们填写所有产品详情，包括名称、型号、描述、价格、保修期、图片。\n\
  \n然后我们点击列表产品和 NFT 按钮，Meta Mask 钱包会提示我们确认交易。它还会列出与交易相关的所有费用。\n\n产品已售出，NFT 保修已转移至交易开始时链接的账户。\n\
