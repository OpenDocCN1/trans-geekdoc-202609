  \ Total delay vs data size.\n\n### 15.4.4 Phase 4 (Scaling)\n\nTo strengthen the\
  \ capabilities of exploration and exploitation, which is one of the most important\
  \ capabilities of evolutionary algorithms, we suggest the linear scaling method.\
  \ In contrast to the advantages mentioned for the algorithm and its good capability\
  \ in searching the problem space and finding the optimal solution, there are also\
  \ disadvantages. Among them, we can mention early convergence and getting stuck\
  \ in local optima, especially in complex problems with more constraints. To solve\
  \ these disadvantages in this research, we used the idea of linear scaling. Linear\
  \ scaling is one of the scaling methods that is known for its simple implementation\
  \ and robust performance.\n\n\n\n-   [线性缩放方法](https://example.org)在实际问题中被广泛使用，尤其是在定义适应度函数的范围非常小或非常大的问题中。在这种情况下，由于适应度函数值的定义范围较大，选择压力增加，从而导致陷入局部最优和提前收敛的概率上升。然而，适应度函数定义范围较小会导致选择压力降低，进而使收敛速度极慢，算法效率下降。使用该算法中的线性缩放方法会使适应度函数的值通过缩放函数发生变化，从而缩小数值范围。在此情况下，能够增强探索和开发能力，从而完全解决上述问题。第 *i* 个种群在 *t* 迭代中的适应度函数输出值由公式 15.18 计算得出。\n\
  \n(15.18)  \n\nfit[*i*]*^s*(*t*) = *a*(*t*) × fit*i* + *b*(*t*),  \n\n在本公式中，fit*^s[i]*(*t*)\
  \ 为缩放后的适应度函数，fit*i* 为使用线性缩放前第 *i* 个种群的适应度函数输出值，而 *a*(*t*) 与 *b*(*t*) 由下面的公式计算。\n\
  \n(15.19)  \n\n$$a(t) = \\\\frac{(C\\_{m} - 1) \\\\times \\\\text{fit}^{\\\\text{avg}}(t)}{\\\
  \\text{fit}^{\\\\text{max}}(t) - \\\\text{fit}^{\\\\text{avg}}(t)}$$  \n\n(15.20)\
  \  \n\n*b*(*t*) = (1 − *a*(*t*)) × fit^(avg)(*t*),  \n\n在公式 15.19 和 15.20 中，fit^(avg)(*t*)\
  \ 表示第 *t* 次迭代时种群适应度函数输出值的平均值，fit^(max)(*t*) 表示第 *t* 次迭代时种群中适应度函数最高值，而 *C[m]* 则是通过公式 15.21 计算的期望最佳解选取率。\n\
