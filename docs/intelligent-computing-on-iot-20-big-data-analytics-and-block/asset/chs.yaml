  \n## 11.1 Introduction\n\n当代农业面临诸多困难，如因全球人口激增而增加的食品需求、气候波动、自然资源枯竭、饮食习惯变化以及健康与安全问题。天气在农业中起着关键作用，对作物生长、发育和产量的营养动态变化、害虫和疾病的发生、水资源短缺、及时的灌溉和施肥以及作物预防和文化措施的效率都有重大影响\
  \ \\[1\\]. 气候变化会对作物造成物理损害，同时也会退化土壤质量。作物产量的质量取决于种植季节，并且因地区而异。在恶劣天气条件下，不良的储存和运输会影响种子和育苗材料的活力，从而导致产量下降。为应对农业部门面临的挑战以及日益增长的需求，有必要提升农业实践的效率，同时最大限度地降低其环境影响。这促使了精准农业的发展，精准农业通过聚焦这两个关键因素来优化农业方法。在当前物联网上加速信息接收和机器人化的现实中，基本职业和社会机会（如农业）必然会取得进步。农业技术的进步有望促进可持续性、最大化产量并确保安全环境。智能农业旨在满足日益增长的需求，通常基于四大主要支柱：(a)\
  \ 高效管理自然资源，(b) 保护生态系统，(c) 适当服务发展，(d) 利用现代技术。\n\n信息与通信技术（ICT）是当代农业的必备要素，全球决策者正在推动其采用。ICT\
  \ 工具可包括农场管理信息系统、土壤和湿度传感器、加速度计、无线传感器网络、摄像头、无人机、低成本卫星、在线服务以及自动导引车辆等设备。农业的数字化转型产生大量数据，随着农场中智能机器和传感器的普及，农业过程日益数据驱动。\n\
  \n精准农业依赖于多种信息技术的使用。其中一种流行的技术是遥感，它能够高效检测作物在田间内外的生长差异。文献中强调的精准农业是具有实时监测能力的地面传感器。各种类型的无线传感器网络（WSN）用于监测农业环境和作物生长状态。虽然卫星、无人机（UAS）和传感器提供关键数据，但真正推动精准农业的是执行器和智能机械的自动化操作。物联网（IoT）的兴起在全球各行各业带来了重大变化。精准农业采用物联网\
  \ 2.0 技术有望提高产量、提升质量并促进可持续性。物联网辅助的无线传感器网络（IoWSN）用于监测农业数据是一种成本效益高且可靠的方式，能够实现可扩展的数据收集和远程访问。物联网结合前文提到的多种技术，是精准农业领域近期且受关注的研究热点\
  \ \\[2, 3, 4, 5, 6, 7, 8, 9, 10 and 11\\].\n\n我们对过去十年关于物联网及物联网 2.0 在农业方面的文献进行了综述，以帮助其实施。通过可视化分析，我们识别出研究前沿和知识基础，揭示了物联网技术在农业中的新应用及相关问题。我们通过分析合作网络的贡献数量，确定了主要的国家、机构和作者。此外，我们利用引用网络识别出具有影响力的研究和学者，从而突出了\
  \ 2010 至 2022 年农业物联网文献中的当前研究和趋势。\n\n## 11.2 Importance of Precision Agriculture\n\
  \n为满足预计 2050 年全球人口达九十亿的粮食需求，联合国粮农组织（FAO）估计粮食产量需要提升 60%。这要求提高作物产量以应对粮食短缺并提升农场盈利能力。为实现这一目标，必须深入了解作物表现并能够在多种环境、土壤、施肥和灌溉条件下进行精准预测。提高农场产量是任何应对这些挑战的策略的关键要素。印度的农业仍然以手工和传统方式进行，这与数据采集标准不匹配，且难以应对气候变化的当前情境。目前，作物推荐依赖于在田间进行的农业研究收集的数据。然而，数据收集过程往往困难，因为这些研究通常在偏远分散的地点进行，且数据主要是手动收集的。此外，数据收集过程难以扩展，因为只能从有限的农场地点获取数据，这不足以构建农场条件的数字孪生。此外，缺乏记录土壤相关参数（如土壤温度、土壤湿度和土壤盐分）的可获数据库。此外，使用现有解决方案需要大量努力将各传感器节点收集的数据（如拖拉机上的施肥喷洒器数据与土壤湿度传感器数据）进行整合和关联。\n\
  \n\n\n\nData-driven precision agriculture approaches are the modern world tool that\
  \ is enhancing the productivity of crop yield and also addresses climate change\
  \ and resource constraints issues (water, labor, and energy shortages). A taxonomy\
  \ of Precision Agriculture is shown in Figure 11.1. Precision agriculture strives\
  \ to enhance and refine agricultural processes to achieve maximum productivity.\
  \ This involves fast, dependable, and distributed measurements to provide growers\
  \ with a more comprehensive understanding of the current status of their cultivation\
  \ area. Additionally, it enables the coordination of automated machinery to optimize\
  \ energy consumption, water usage, and the application of chemicals for pest control\
  \ and plant growth. Smart algorithms can also organize well-evaluated scientific\
  \ knowledge to provide deeper insights into ongoing processes. Moreover, these algorithms\
  \ can perform current situation reasoning and predict potential threats to crops,\
  \ produce early warnings, and improve automated control signals based on plant responses.\n\
  \n![Figure 11.1 Taxonomy of precision agriculture.](img/fig11_1_B.jpg)\n\nFigure\
  \ 11.1 Taxonomy of precision agriculture.\n\nPrecision agriculture involves utilizing\
  \ Information and Communication Technologies (ICT) and big data analytics to connect\
  \ crop data with specific crop varieties’ genetic and phenotypic characteristics.\
  \ Figure 11.2 illustrates the flow of information in precision agriculture infrastructure.\
  \ Wireless technologies have recently been introduced into agriculture, with high-value\
  \ sectors such as greenhouse crops, horticulture, and vineyards taking priority.\
  \ Wireless sensors are particularly useful in short-range indoor applications for\
  \ greenhouses and small parcels of perennial crops with infrastructure for vineyards.\
  \ Soil moisture measurement is mainly used to optimize crop irrigation, and wireless\
  \ sensors are also commonly used as advanced weather stations to measure various\
  \ parameters necessary for crop management. WSN are included in control loops and\
  \ also used as actuators, such as in irrigation applications. The complexity of\
  \ the algorithms needed to handle real-time distributed data is too great for low-power\
  \ nodes in WSNs. However, with IoT, all objects are connected, making it easier\
  \ to move computational overhead to the cloud or distribute it among interconnected\
  \ devices.\n\n![Figure 11.2 Flow of information in precision agriculture infrastructure.](img/fig11_2_B.jpg)\n\
  \nFigure 11.2 Flow of information in precision agriculture infrastructure.\n\n###\
  \ 11.2.1 Crop Management and Produce Quality\n\nCropgrowthandqualitycanbetrackedusingsensordatatakenonthefarmandprocessedinPython\
  \ with OpenCV, Matplotlib, Scikit-image, and other image processing tools \\[12\\\
  ]. We can measure the crop attribute like the growing stage and quality and also\
  \ predict the yield by extracting the unique properties like elevation, density,\
  \ and leaf greenness index of vegetation from the captured data. The advancement\
  \ in state-of-the-art IoT hardware technology made it possible to deploy economical\
  \ monitoring infrastructures in large farms and collect and process big data on\
  \ remote rack servers and cloud platforms \\[13\\]. As an illustration, IoT networks\
  \ are set up in the food processing industries to gather information about each\
  \ step of the food manufacturing process. This includes the quality of the raw materials\
  \ used and the additives needed to produce the end product. The data collected can\
  \ be saved in various file formats, like CSV, and stored on the cloud \\[14\\].\
  \ The objective of estimating crop yields is to analyze the various factors that\
  \ influence and shape crop production. These factors comprise irrigation, topography,\
  \ natural composition and physical characteristics of soil, weather and climatic\
  \ conditions, crop diseases and pests, as well as crop stress \\[9\\]. Following\
  \ an initial study and evaluation of the significance of the retrieved crop attribute,\
  \ Machine learning and deep learning models can be trained with some of the abstracted\
  \ data to estimate the yield of the crop. It facilitates effective resource management;\
  \ fast and exact yield estimation can give a credible foundation for decision-makers\
  \ to assess whether there will be a shortage or surplus and respond accordingly\
  \ as per conditions \\[15\\].\n\n### 11.2.2 Sustainable Use of Resources\n\nThere\
  \ is a possibility for practical and scalable solutions for natural resource conservation\
  \ and sustainable agriculture through the use of precision agriculture techniques\
  \ \\[16, 17 and 18\\]. Innovation in the agricultural sector is being driven by\
  \ technologies like artificial intelligence(AI), drones, and the IoT, which leverage\
  \ big data to enhance sustainability \\[19, 20\\]. As arable land is limited, groundwater\
  \ levels are dropping, and soil quality is decreasing, these technologies could\
  \ help optimize the utilization of land, water, and other resources to fulfill global\
  \ demands while ensuring resources are preserved for future generations.\n\nAgribusinesses\
  \ can employ AI to manage weeds using state-of-the-art computer vision, machine\
  \ learning, and robotics techniques \\[21, 22\\]. Based on data obtained from farms\
  \ through IoT sensors, AI can help find weeds in fields through data abstraction\
  \ and spray pesticides where weeds are located. As a result, the amount of pesticide\
  \ used to spray the entire field can be reduced, and fewer chemicals are left on\
  \ the agricultural product compared to the amount of chemicals sprayed regularly\
  \ \\[23, 24 and 25\\].\n\n### 11.2.3 Plant Disease Detection\n\nPlant illnesses\
  \ pose a substantial risk to agricultural output and quality \\[26\\]. Recently,\
  \ several neural network-based models have been developed to diagnose plant diseases\
  \ \\[27, 28 and 29\\]. Nonetheless, these models are limited in that they can only\
  \ detect diseases after they have fully developed in the crop, and they do not have\
  \ a significant impact on improving product quality. Identifying and monitoring\
  \ plant diseases in the early stages in the field can be difficult, time-consuming,\
  \ and costly. However, using deep learning algorithms for early disease detection\
  \ and categorization is necessary to improve crop production and quality. To accomplish\
  \ this, datasets on plant pathology diseases must be compiled throughout the vegetation’s\
  \ growth cycle.\n\n### 11.2.4 Agriculture Management System\n\nIn recent years,\
  \ farmers have exchanged data and collaborated more effectively, thanks to emerging\
  \ information and communications technologies. Agriculture practitioner’s connectivity\
  \ enables the emergence of software-defined management systems \\[30\\]. New frameworks\
  \ for rural administration are being developed to offer accounting services, link\
  \ farmers with farm owners and managers, and enable agriculturalists to benchmark\
  \ their performance by connecting them in a network \\[31\\]. The aim of the agriculture\
  \ management system is to support farm managers and agribusinesses globally by collecting\
  \ and analyzing a vast amount of data from real-time sources to aid them in making\
  \ informed business decisions.\n\n\n\n一个农业决策支持系统(DSS)在农业制造和分销的每个阶段收集数据 \\[32, 33,\
  \ 34 and 35\\]。用于在农业中做出明智决策所需的数据来自多种来源，如土壤湿度、环境条件、作物产量、供应链需求和供应数据、食品加工行业的生产数据，以及农民使用的农药\
  \ \\[36, 37 and 38\\]。这些数据既存储在云端数据库中，也存储在本地数据库中，用于理解关键因素，如土壤养分水平、种子特性以及它们与病原体、害虫和毒性物质的相关性。农民和农业实践者结合害虫和病原体发展的概率，分析生物和非生物数据，以做出明智的决策。DSS\
  \ 用于帮助实践者根据市场需求选择作物。系统跟踪并映射预计需求的作物，使农民能够避免对需求低的作物过度收获。\n\n## 11.3 无线传感器技术和物联网在农业中的作用\n\
  \n无线传感器技术的最新进展为研究和开发提供了众多选项。这得益于传感器节点的低成本和射频技术的进步 \\[39\\]。无线区域网络（Cognitive Radio/WRAN）、无线个人区域网络（WPAN）、Mesh、点对点（P2P）以及低功耗广域网（LPN/LPWAN）是物联网领域中使用最广泛的无线技术\
  \ \\[40, 41 and 42\\]。GSM 进一步细分为 GSM EDGE 无线访问网络（GERAN）和 UMTS 地面无线访问网络（UMTS TRAIN）（UTRAN）\
  \ \\[43, 44\\]。在最近的学术文献中，出现了相当数量的嵌入式可编程设备的引用 \\[45, 46 and 47\\]。一些物联网研究中使用的设备是定制的，而其他则是商业可用的系统，这些系统已经预先编程或具有封闭源监测功能。研究人员根据其特定的研究目标或关注领域选择设备。商业系统提供多种功能，使研究人员能够专注于物联网部署的其他方面，如智能算法、云兼容性和后处理。另一方面，可编程和开放的解决方案为开发人员提供了对节点和网络行为的完全控制，并能够编程额外的外设，如新传感器或执行器模块，以使其与节点兼容。这些信息来源于多种来源\
  \ \\[48, 49, 50, 51, 52 and 53\\]。\n\n无线传感器网络（WSN）是 21 世纪最重要的技术之一 \\[51\\]。尽管 RFID（射频识别）最初是用于识别和跟踪附着在物体上的标签，但对各种其他应用的兴趣日益增长，促使\
  \ RFID 无线传感器设备的进一步演变 \\[54\\]。与 RFID 系统相比，WSN 的最显著区别在于 RFID 设备不提供协作通信。然而，WSN 支持多种网络类型和多跳通信\
  \ \\[55\\]。随着 Bluetooth、ZigBee 等标准以及用于 RFID 的多个 ISO（国际标准化组织）标准（ISO 15693、ISO/IEC\
  \ 18000、ISO 11784 等）的广泛应用，这些技术在近年来受到了显著关注 \\[56\\]。\n\n物联网和 WSN 设备具有广泛的应用范围，包括环境监测、灌溉、牲畜和温室管理以及冷链。农业基础设施（如温室）通过标量传感器网络进行监测和控制，而多媒体传感器网络则用于远程收集和处理图像，以检测昆虫和作物疾病。基于标签的网络（如\
  \ RFID 和 NFC）用于产品追踪和远程识别。通常，监测基础设施由少量的汇聚点和大量的传感器组成。无线传感器节点由三个主要组件构成：感知、处理和通信。这些节点通过网关单元进行通信，网关单元可以通过\
  \ LAN、WLAN、Internet、CAN 或 WWAN 使用 GSM 或 GPRS 等行业标准协议与其他计算机通信。这些信息来源于多种来源 \\[56,\
  \ 57\\]。\n\n在各种农业生产系统中，基于 WSN 的监测基础设施允许在尽量不损害动物和环境的前提下收集大量作物相关参数。农民可以根据实时田间数据做出作物相关的决策，这有助于提高作物产量或辅助水资源管理。精准农业通过识别作物的差异并相应调整管理技术，而不是依赖可能与实际情况不符的假想平均状态。这一理念基于文献中引用的研究\
  \ \\[58\\]。\n\n安装在越野车辆（如拖拉机或联合收割机）上的传感器节点能够与静态基础设施或其他车辆共享数据，从而实现移动无线传感器网络 \\[59,\
  \ 60\\]。在 Ref. \\[61\\], 作者在饲料收割机内部安装了电容湿度传感器，以在收割过程中监测土壤含水量（SWC）。同样，在 Ref. \\[62\\\
  ], 作者在施肥机上集成了蓝牙传感器节点，实现了现场数据采集。数据用于计算肥料的正确用量和均匀分布模式。在 Ref. \\[63\\], 部署了一个 WSN 以识别和控制马铃薯农场中的疫霉病。疫霉病是由依赖环境因素的真菌攻击引起的。使用\
  \ 868/916 MHz 节点测量了湿度和温度。系统旨在检测植被受到疫霉病侵害的情况，并在必要时推荐处理措施。植物监测（即监测植物）通过 WSN 监测基础设施更加容易。例如，借助\
  \ WSN，葡萄园主可以更高效、自动化地管理葡萄园运营。例如，在 Ref. \\[64\\], 作者提出了多种 WSN 配置和实现方案，以解决葡萄园的各种属性。在\
  \ Ref. \\[65\\], 作者利用 Zigbee 节点在葡萄园内建立 WSN，并持续一个月收集温度数据。其目的是利用收集的数据检查酿酒的两个重要因素——热量累积和潜在霜冻损害。同样，Ref.\
  \ \\[66\\] 的作者也展示了基于 Zigbee 的精准葡萄栽培的远程传感器网络的有效性。在他们的研究中，网络节点由电池供电，并通过太阳能电池板进行充电。\n\
  \n\n\n在许多作物种植系统中，高效的灌溉管理是一个重要问题。无线传感器网络（WSN）有潜力准确显示作物水分含量（SWC）在田间的变化。SWC 数据可用于创建决策支持系统，帮助农民在提高产量的同时节约用水\
  \ \\[67, 68\\]。此外，WSN 消除了在农场布设传感器节点时的布线困难，并降低了维护成本。由于 WSN 比有线方案更易部署，因此可以使用更多传感器来获取特定区域更详细的信息。与其在整个田间均匀灌溉，WSN\
  \ 可根据传感器在田间战略性放置所获取的数据，对各区域进行按需灌溉。研究 Ref. \\[69\\] 中评估了两种 WSN，分别在配备红外测温仪的中心旋转灌溉系统的六跨架上部署。研究比较了网格式和非网格式\
  \ WSN 在中心旋转平台上的性能。同样，在 \\[70\\]，作者开发了一个用于棉花灌溉调度的智能传感器阵列原型。该系统包含湿度传感器、热电偶和 RFID 标签。在\
  \ Ref. \\[71\\] 中，作者部署了基于 WSN 的地下水监测基础设施。监测数据由嵌入式单片机处理，GSM 数据模块无线传输数据。Ref.\\[72\\\
  ] 的作者展示了在直线移动灌溉系统中使用 WSN 进行现场精准灌溉控制的应用。蓝牙无线电连接使传感器和灌溉控制器能够与基站通信。在 Ref.\\[73\\]，作者介绍了一项关于地下系统的研究，该系统可监测土壤条件（如水分和矿物质含量），并提供如何正确灌溉和施肥土壤的信息。此外，该系统还可监测河流和含水层附近土壤中各种有害化合物的存在及含量，这些化合物可能因化学径流而影响饮用水来源。\n\
  \n对于在农业环境中部署 WSN，考虑节点部署的具体环境和周围条件至关重要。农田作物和其他物体的移动可能导致网络中节点连接出现严重问题。这些障碍移动不可预测，会影响链路连接质量，使其随时间和空间波动。这会影响网络的多个方面，包括部署、路由和故障诊断等，如\
  \ Ref. \\[74\\] 所指出。温度、降雨、湿度、太阳辐射、植物叶片遮阴以及建筑物（如温室）产生的噪声等环境因素也会导致时空气候波动，进一步影响节点间的链路和通信质量，如\
  \ Ref. \\[74\\] 所述。这些问题在自动化农业设施中尤为重要，因为它们依赖于节点间可靠的连接。该特性表明了对高级循环周期控制、数据采样调度、数据重构、存储与检索以及智能管理等要求。因此，选择合适的物联网平台来规划部署，可能会影响项目的整体成功。\n\
  \n对于农民在田间大规模部署土壤湿度传感器网络，选择合适的无线收发器关键取决于节点数量、通信距离和天线安装选项等关键参数。多路径、阴影和衰减等因素增加了真实世界无线电传播的复杂性\
  \ \\[75\\]。我们需要 WSNs 在各种环境下（从空旷田地和葡萄园到起伏丘陵和 rugged 山地）都能 flawlessly 运行，同时应对多样的天气条件。这些因素对无线电性能产生显著影响。农田无线电传播受作物生长期的植被高度和密度影响。在这些农业场景中，链路功率预算由作物生长、地理位置以及更传统的因素（如节点间距和天线高度）决定。其他农业应用（如谷仓、温室或仓库）的障碍包括墙壁、窗户、托盘、机械设备等，导致信号强度显著衰减\
  \ \\[76\\]。在这些环境中，接收到的信号强度比接收器灵敏度限制高出 10–20 dB 被认为是可接受的链路预算值 \\[77\\]。\n\n农业部署通常会经历高温和高湿度环境。当温度从\
  \ 25° C 升至 65° C 时，接收到的信号强度（RSS）会显著受影响。此外，农业环境中的湿度水平可能非常高，无线节点在开阔田野中暴露于雨水或灌溉系统中，温室内湿度可超过\
  \ 80%。高湿度已被证明会对无线电波传播产生显著影响 \\[78\\]。同频或邻频工作的设备之间的干扰是无线通信的潜在问题。物联网模型提供了带宽、通信距离、能耗和安全协议等多种选择。然而，由于\
  \ IoT 项目涉及多种技术、标准和独特需求，网络层的互操作性可能受到限制 \\[79\\]。\n\n尽管文献中已有大量关于 WSN 理论方面的研究，但在农业环境中实现实时\
  \ IoT/WSN 部署仍面临挑战。传感器模块必须高精度、具备适合特定环境的测量范围，并能够抵御可能导致读数错误或永久损坏传感器的外部因素。由于 WSN 基础设施分散，更换位于开阔田野或其他农业设施中电池供电节点的电源可能困难，甚至不可能。因此，在开发新传感器节点时，硬件选择受到严格的功耗限制，低功耗外设的特性被仔细考虑。此外，构建终端设备功能所需的软件组件也必须经过全面评估。为避免现场问题，最终功能代码必须在大量嵌入式软件工程专业知识的指导下开发，并经过密集测试\
  \ \\[80\\]。决定使用低功耗嵌入式设备的因素包括其在长时间运行中的稳定性、能够提供的数字和模拟输入/输出通道数量（以支持传感器和执行器等外设）、通过电源采集模块维持自身的能力，以及编程复杂度的高低。\n\
  \n## 11.4 IoT 2.0 的应用\n\n\n\n\nIoT 2.0 指的是一个新时代，其中设备和数据被用于生成可操作的洞察。它由大量相互连接的设备、传感器和执行器构成的庞大网络驱动，使其比其前身\
  \ IoT 更加重要、更具弹性和更加成熟。IoT 的下一阶段通常被称为“物物网”或 IoT 2.0。IoT 2.0 有能力从设备数据和共享中提取有价值的洞察，类似于互联网通过文档交换提供有价值的信息。IoT\
  \ 2.0 不仅包括设备技术和网关，还包括相关的 IT 技术、流程、人员、益处、结果以及真实世界的巨大潜力。专家们建议，实现这一点需要三个基本属性。为了改进 IoT，需要考虑三个因素：(a)\
  \ 使用标准协议，(b) 从集中式枢纽-辐射结构转变为更去中心化的点对点模型，以及 (c) 增强设备自主性，以提升设备和网络层面的感知、适应和预测能力。这对于管理在不同平台上运行的众多多样化对象至关重要。\n\
  \n“IoT 2.0”这一术语涵盖了各种技术应用和变革性过程，使其成为推动社会数字化转型的最重要技术之一。为了区分不同的应用场景、挑战和机遇，通常会使用更具体的术语。例如，“工业物物网”(IIoT)\
  \ 或“工业物物网”指的是在工业流程中使用 IoT，而“消费物物网”(CIoT) 指的是数十亿个利用 IoT 技术的个人物理设备。IoT 2.0 有时被称为“万物物联网”(IoE)，因为其范围广泛且设备多样化。它涵盖了技术、流程、人员、益处、结果以及真实世界应用的巨大潜力，代表了一个物物网的概念。无论使用什么具体术语来描述它，IoT\
  \ 2.0 最终关注的是这些方面。\n\n第四次工业革命，即 Industry 4.0，将物物网、大数据、机器人、人工智能和区块链等先进技术汇集在一起。这些技术使工业流程和供应链更加复杂且自给自足。通过将\
  \ Industry 4.0 与农业相结合，可以实现 Agriculture 4.0，从而实现可持续且智能的工业农业。在农业的各个环节——从食品生产和加工到分销和消费——可以收集、处理和分析高度详细、空间和时间变化的实时数据。这种工业化农业生态系统涉及高度数字化、实时农场管理以及基于数据的自主决策过程，从而提高生产率、提升农业食品供应链的效率、增强食品安全并节约自然资源。IoT\
  \ 的农业应用包括精准农业、动物监测、人工大棚、渔业管理和天气监测。Ref.\\[81\\] 的作者在宏观层面描述了这些影响，包括用于无处不在的农业监测和网络的空中-空中-地面-水下整合网络。\n\
  \n利用现有的国家和商业空间基础设施实施远程感知卫星星座，可以促进对农业数据的广泛收集，从而为作物产量预测、产量建模和害虫识别等任务带来显著好处。此外，配备高分辨率光谱传感器、多光谱相机和其他专用设备的先进无人机（UAS）能够实现快速响应，并通过高通量\
  \ 3D 监测在不同地理位置提高观测精度。地面和地下观测——这些是负责多个农业传感节点、自主农业机械和移动人群感知的关键——同样发挥着重要作用。由于通信技术的进步，现在可以选择各种无线设备来满足农业应用的多样化服务需求，例如实时远程硬件控制和高吞吐量植物表型分析，以提升覆盖范围、连接密度、带宽和端到端延迟。\n\
  \n### 11.5 IoT 2.0 挑战\n\n农业环境感知可能导致多种问题。精准农业需要在农田、作物、牲畜和农业机械上部署多个传感器，但缺乏合适的传感器是限制精细化农业监测的主要障碍，尤其是在生物传感牲畜和作物表型分析方面。为解决这一问题，必须开发并建立符合高标准、高灵敏度和高可靠性的专业农业传感器，用于评估农业生产环境以及动物和植物的生理指标。另一种研究方向是利用无线电波实现无传感器的农业感知。\n\
  \n在农业环境中，更换安装在地下、水下、树上或动物上的传感器电池十分困难，因此低功耗感知至关重要。通过电磁波进行无线电力传输有潜力消除电池更换的需求，实现电池充电。长距离无线充电是大多数农业应用的必要条件。此外，还需要研究在恶劣条件下（如地下和水下）的无线电力传输。\n\
  \n在光伏农业物物网 \\[82\\] 中，农业作业与发电共享同一片土地。散布的无线充电器为感知设备提供能量，但由于农业应用中使用的传感器种类繁多，能量传输的适应性任务调度面临挑战。另一种可持续的农业物物网替代方案是环境能量采集。试验性研究表明，传感器节点可以从河流、流动体、车辆运动以及地表收集能量。然而，为了克服当前对转换电能的限制，必须提高能量转换效率。\n\
  \n由于农业条件的多样性，不可能存在一套通用的网络解决方案来满足所有应用需求。农业传感器位于各种环境中，如温室、户外农田、地下空间甚至海域。这些环境的异质性要求基于射频、声呐、振动等信号的多样化无线通信技术用于信息共享。因此，必须在每种情境下评估不同无线通信技术的性能，以选择最合适的技术。此外，要在农业环境中成功实现智能感知，跨媒体通信（地下、水下和空中）至关重要。不同的农业应用对网络规模、节点密度、传输距离、吞吐量和延迟有不同的要求。鉴于农业环境中\
  \ IoT 应用的多样性，基于蜂窝的网络、802.15.4 网状网络、蓝牙低功耗网络和 LoRa 网络会在同一区域共存。因此，跨物理层不同技术的通信研究至关重要。\n\
  \n### 11.6 结论\n\n\n\n当前的农业供应链部分自动化和数字化，但缺乏完整的数字化转型和理解，这限制了其自动化潜力。此外，当前的农业食品分销系统监管不当。为解决这些问题，必须将新的物联网\
  \ 2.0 技术整合到农业中。物联网 2.0 平台利用人工智能和机器学习生成洞察并向客户提供可操作信息。互联网是社会和经济的驱动力，促进了物理世界与数字世界之间更高效的沟通，并创建了真实物体和交易的数字化表示，以便理解其行为。因此，本章深入分析了将这些技术应用于农业时最重要的应用和研究挑战。\n\
