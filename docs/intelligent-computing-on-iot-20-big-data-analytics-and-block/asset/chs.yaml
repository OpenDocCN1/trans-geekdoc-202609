  \\text{ft}^{\\\\max}(t)}$$  \n\n*C[m]* 是一个参数，其值在区间 [1, 2] 中定义。该参数值为 2 意味着选择最佳解的概率是选择平均适应度解概率的两倍。在此情况下，选择压力最大。参数值越接近 2，选择压力越大；若参数值更接近 1，则最佳解与平均解被选中的概率相等，选择压力最小。通过使用线性缩放方法，进化算法的探索与开发能力可以得到调控。下图展示了带有线性缩放的算法伪代码（Algorithm 2）。\n\
  \n## 15.5 Simulation and Results\n\n为进行仿真，我们采用了三层架构。用户在第一层生成 IoT 请求。请求生成遵循均匀分布并随机产生。创建用于云资源和雾资源处理的请求后，考虑\
  \ 16 台云雾服务器。由于云雾服务器的能力不同，初始模型系统中随机生成 100 条不同包数的请求。随后，产生 10 台雾服务器和 6 台云服务器，它们在处理能力上有所差异。随后，采用所提算法调度请求，以能量最优的方式解决已制定的问题。该算法通过调度请求，使处理延迟最小化，从而实现处理请求的最小能耗。最初，所有资源均可用。随着时间的推移，资源被分配给请求并忙于处理，部分请求需要等待资源空闲后才能处理。本章考虑静态调度模式，即所有请求最初均可用，请求创建的初始时间为\
  \ 0。服务器延迟取平均每个包 5 ms，并服从 1 ~ 9.7 ms 的均匀分布。请求截止时间设为 400 ms 和 50 ms，分别对应均值和方差。为进行测试，我们首先考虑请求数量足够少，平均包数足够小，以保证没有请求错过截止时间。随后，我们逐步提高平均包数，第一个测试是检查不同算法在错过截止时间的数量，同时控制每种算法产生的延迟对能耗的影响。\n\
  \n### 15.5.1 Missed Deadlines\n\n为了检查错过截止时间的数量，我们首先计算每个算法提供的调度中每个请求的总延迟，并统计延迟超过定义截止时间的请求数量。Figure 15.5\
  \ 展示了平均包数在 1,000 ~ 10,000 之间的请求总延迟。可以看出，所提 RSA 算法在优化方面优于其他对比算法。\n\n![Figure 15.5\
  \ Missed deadline requests.](img/fig15_5_B.jpg)\n\nFigure 15.5 Missed deadline requests.\n\
  \n本算法在本文中使用线性缩放，能够在约束条件下增强算法在问题空间上的探索能力，并对算法的及时收敛产生显著影响，使得在请求递增平均数的累计结果上，该算法的表现优于其他算法。基于整体延迟的结果，我们进一步比较各算法在错过截止时间的数量。Figure 15.5\
  \ 显示，所提算法在平均 7,000 条请求后开始错过截止时间，而其他算法在更低的平均值下即已出现错过截止的情况。Figures 15.3 和 15.4 表明，该算法在延迟优化方面优于其他算法，这充分体现了使用线性缩放的效果。\n\
  \n### 15.5.2 Energy Consumption\n\n\n\n\n-   为了检查能耗量，根据所制定的问题，我们以寻找最优解为依据比较算法。处理时间越长，随着响应时间增加，能耗越高。图\
  \ 15.6 展示了算法在寻找最优解方面的能耗表现。比较结果表明，随着请求平均量的增加，所提算法表现出更强的鲁棒性。这意味着当请求的平均数量（以包为单位）增加且问题更为复杂时，由于采用线性缩放方法对适应度函数的输出值进行缩放，所提算法能够比其他算法更好地寻找到最优解。线性缩放方法通过缩放评估函数的输出参数来提升算法性能。\n\
  \n![图 15.6 总体能耗。](img/fig15_6_B.jpg)\n\n图 15.6 总体能耗。\n\n为了更好地评估 RSA 算法中线性缩放的性能，并观察其对寻找最优解以及平衡算法的探索与开发能力的影响，我们对所提方法进行了多项测试，包括弗雷德曼测试。在该测试中，算法根据效率进行评估，表现更好（即获得更高评分）的算法说明其相较于其他方法表现更佳。可用数据下的弗雷德曼测试结果显示在\
  \ 表 15.1。\n\n表 15.1 弗雷德曼测试结果\n\n| 算法 || 排名 |\n| --- | --- |\n| 所提方法 || 14.56 |\n\
  | HHO || 17.78 |\n| WOA || 18.67 |\n| 蚁群算法 || 24.89 |\n| Pvalue (α = 0.05) || 0.00001\
  \ = Rejected |\n\n![图 15.7  MRSA vs RSA。](img/fig15_7_B.jpg)\n\n图 15.7  MRSA vs\
  \ RSA。\n\n获得第一名的方法相较于其他方法表现最佳。该测试的 p 值为 0.00001，表明统计显著。\n\n为了观察线性缩放对算法性能的影响，我们分别在固定模型系统上实现了不使用线性缩放和使用线性缩放的算法。我们进行了\
  \ 50 次算法运行并计算了算法的平均值。实验结果表明，使用线性缩放并控制探索与开发能力，使算法在初期能够很好地探索问题空间，而在算法结束时，通过降低标准差，收敛到最优解。\n\
  \n## 15.6 结论与未来研究\n\n总体而言，本章针对物联网请求的调度与能耗优化问题，定义了以延迟和最大响应时间为依据的目标函数，并采用了采用线性缩放的改进进化算法进行求解。实验结果表明，线性缩放在控制选择压力方面发挥了重要作用，从而增强了算法的探索与开发能力。由于调度问题本身具有复杂性，尤其是存在多重约束且评估函数的取值范围较大时，线性缩放方法可以通过缩放输出值来降低选择压力。具体而言，在算法初始迭代阶段，搜索因子的竞争力标准差较高，从而能够充分探索问题空间；而在后期迭代阶段，标准差被降低，从而实现对最优解的适当收敛。为继续深化研究，建议采用多目标函数进行优化，涵盖延迟、能耗、安全、带宽等参数。将智能方法与进化算法相结合也是一项建议。将神经网络与进化算法集成用于调度也是建议的。所提算法包含若干参数，这些参数的取值对算法性能影响显著。本章通过实验设定这些参数的值。然而，可以定义并使用模糊逻辑控制器来计算这些参数的值，以平衡算法能力并提升所提方法的性能。\n\
