  \ result on the stability condition. □\n\n### 8.4.3 The Steady-State Probability\
  \ Vector\n\nLet ***y*** be the steady-state probability vector for the generator\
  \ matrix *Q*. It is well-known that (see, Refs. \\[31, 32 and 33\\]) the computation\
  \ of the vector ***y*** requires the knowledge of key matrix, say, *G*. This matrix\
  \ is obtained as follows. Note that *Q* is positive recurrent and irreducible. The\
