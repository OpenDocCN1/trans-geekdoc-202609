  \n## 17.1 Introduction\n\n在教学大楼中，必须始终制定应急撤离方案。虽然教学大楼可能已经制定了撤离计划，但因火灾、化学泄漏等紧急事件导致的恐慌，使得撤离人员选择路线变得十分复杂。一般来看，影响决策的因素包括建筑的结构和几何形状、出口数量及位置、撤离人数以及通道上的障碍\
  \ \\[1, 2 and 3\\]。最常用的策略是基于距离的，即人们选择就近撤离。但若通道拥堵，此策略可能失效。部分人会选择熟悉的出口，或仅仅跟随他人 \\\
  [4, 5\\]。因此，开发更科学的撤离流动指引方式至关重要。\n\n\n\n\n# 1. 研究背景与模型分类\n\n许多研究者一直致力于开发用于紧急疏散的数学模型，其目标是优化疏散路径并最小化总疏散时间\
  \ \\[6, 7 and 8\\]。这些模型可分为两类：宏观模型和微观模型 \\[9\\]。宏观模型将系统视为整体，研究行人运动特征、拥堵和聚集现象 \\[10\\\
  ]。回归模型 \\[11\\]、路径选择模型 \\[12\\]、排队模型 \\[13\\] 和气体动力学模型 \\[14\\] 均属宏观模型。另一方面，微观模型更关注行人在不同环境下的具体运动细节或疏散行为。典型的微观模型包括社会力模型（粒子系统）\
  \ \\[15\\]、基于规则的模型 \\[16\\] 和胞波模型 \\[17\\]。例如，Zhang *et al*. 在 \\[18\\] 中通过改进的胞波模型模拟了隧道火灾中人员流动，并据此提出了相应的优化疏散策略。Cao\
  \ 等人 \\[19\\] 研究了无视野房间的疏散过程，结合实验与建模；基于实验观察，他们构建了一个用于无视野疏散的多网格模型进行模拟。Li 等人 \\[20\\\
  ] 通过实验和模拟讨论了办公楼的疏散动态，并开发了一种晶格气体（LG）模型用于模拟有序紧急疏散的动态过程。\n\n许多研究聚焦于实际应用。例如，Mizuta 等人在\
  \ \\[21\\] 中研究了化工厂有毒物质泄漏时的应急疏散准备情况，设计了一套考虑风速、大气条件和泄漏率的预测模型。在 \\[22\\] 中，提出了一种基于\
  \ Petri 网的方法，用于建模和评估与凝结储罐火灾场景相关的疏散计划的性能。模拟为在建筑施工前评估建筑安全提供了高效的手段。Pelechano *et al*.\
  \ 在 \\[9\\] 中综述了人群模拟模型，并为高层建筑疏散模拟选择了商业软件工具。Sheeba 等人 \\[23\\] 提出了一种利用随机 Petri 网（SPN）的火灾疏散分析模型，该模型考虑了人类行为等实际因素以及楼梯拥堵等真实情境。\n\
  \nPetri 网是一种强大的数学和图形建模与分析工具 \\[24, 25\\]。自 1962 年 Carl Petri 的博士论文发表以来，Petri 网模型一直受到全球学者和工业实践者的研究与应用。Petri\
  \ 网被用于解决各种离散事件系统的问题，如制造系统 \\[27\\]、医疗系统 \\[28\\]、安全架构 \\[29\\] 和交通控制系统 \\[30\\]。此外，Petri\
  \ 网也被一些研究者用于疏散建模与仿真，如在 \\[22, 23\\] 之前讨论的工作。例如，Danial *et al*. 在 \\[31\\] 中提出了一种基于地标的路径学习模型，利用广义\
  \ SPN 考虑路径上的地标信息及导航指令，决定是否将该信息纳入已学习的路径。Petri 网概念简单、易学、灵活可扩展，且能够严谨地验证系统的各类属性。其图形表示使得\
  \ Petri 网模型易于理解。此外，时 Petri 网模型的发展为系统性能分析提供了强大的仿真工具。Zhou *et al*. 在 \\[32\\] 中提出了一个基于随机时\
  \ Petri 网的仿真引擎，并将其用于急诊科室绩效评估。Wang 在 \\[33\\\\) 中提出了基于单时 Petri 网的紧急医疗工作流建模和时效性能分析方法。\n\
  \n# 2. 物联网（IoT）在疏散中的应用\n\n物联网（IoT）是一种基于互联网的技术，将具有“物体”的实体与传感器、软件等其他技术集成，实现网络连接和数据交换。这些连接的物体范围从普通的家用电器（如电视、灯光、机器人吸尘器）到高端的工业制造设备、自动驾驶车辆和电力设施。云计算、机器学习、对话式人工智能以及低成本低功耗传感器接入是支撑\
  \ IoT 的关键技术。\n\n本章旨在通过将信息技术嵌入疏散过程，使人员在疏散时能够选择正确的路径，从而缩短疏散总耗时。技术进步几乎影响了所有行业；在疏散过程中加入技术有助于缓解拥堵，整体降低疏散时间。在考虑的建筑中部署\
  \ IoT 能够让疏散人员选择最优路径，从而在最短时间内离开建筑。各类传感器（如视频摄像头和烟雾探测器）收集的信息能够实时呈现建筑整体状态。这些数据可由本地服务器或云端专用服务器处理，进而用于指导疏散过程。特别是，通过在关键节点指示何时改变行进方向，可以避免疏散路径中的大规模拥堵。当走廊和出口拥堵较少时，整体疏散时间得以最小化，教学楼的全面疏散时间也随之缩短。\n\
  \n我们计划利用 IoT 技术动态指引疏散人员在教学楼疏散时的行进方向。实际上，疏散过程多年未发生重大变化。将技术元素加入这一过程，既正面地提升了疏散效果，又保持了原有流程的熟悉感。新的疏散流程简洁明了，学生无需额外培训即可遵循。我们的研究表明，基于\
  \ IoT 的动态紧急疏散能够正向影响教学楼的疏散时间。每一秒在疏散中都是宝贵的，即使节省几秒钟也可能挽救生命。疏散是一项高压过程，本研究的目标是让技术协助人类在最短时间内安全、快速地选择正确的出口路径离开建筑。\
  \ \n\n\n\n本章的其余部分按以下方式组织：Section 17.2 简要介绍了 Petri 网和时制 Petri 网。Section 17.3 给出了基于\
  \ IoT 的动态疏散概述。Section 17.4 展示了动态疏散的建模与仿真案例，并分析结果。Section 17.5 简要讨论多层建筑疏散。Section\
  \ 17.6 总结本章，说明工作的未来计划。\n\n## 17.2 Petri Nets\n\n本节介绍本研究中使用的 Petri 网和时制 Petri 网的基本概念。\n\
  \n### 17.2.1 Petri Nets\n\nPetri 网是离散事件系统的形式模型，是一种数学和图形模型。Petri 网包含四类元素：地点、过渡、有向弧、令牌。它被正式定义为一个\
  \ 5 元组 *N* = (*P*, *T*, *I*, *O*, *M*[0])，其中\n\n*   *P* = {*p*[1], *p*[2],..., *p*[m]}\
  \ 是有限的 *places* 集合。地点可以包含 *tokens*，表示对象或条件。\n\n*   *T* = {*t*[1], *t*[2],..., *t*[n]}\
  \ 是有限的 *transitions* 集合。*P* ∩ *T* = ϕ 且 *P* ∪ *T* ≠ ϕ。\n\n*   *I* : *P*×*T* → *N*\
  \ 定义从地点到过渡的有向弧的重复次数。若 *I*(*p*, *t*) > 0，则 *p* 是 *t* 的 *input place*。\n\n*   *O*\
  \ : *P* × *T* → *N* 定义从过渡到地点的有向弧的重复次数。若 *O*(*p*, *t*) > 0，则 *p* 是 *t* 的 *output\
  \ place*。*I* 与 *O* 共同决定了 Petri 网中令牌的流向。\n\n*   *M*[0] : *P* → *N* 定义初始标记，即初始时在各地点上的令牌分布。\n\
  \n一个地点若包含一个或多个令牌，则该地点被 *marked*。标记是对 Petri 网中所有地点的令牌分配，它定义了 Petri 网的 *state*。过渡是一个活性元素，可以\
  \ *fire*。当过渡 firing 时，地点上的令牌分布可能改变，产生新的标记或状态。过渡只有在 *enabled* 时才能 firing。 *M*(*p*)\
  \ 表示标记 *M* 中地点 *p* 的令牌数。若每个输入地点 *p* 的令牌数至少等于连接 *p* 到 *t* 的有向弧的权重，即 *M*(*p*)ε *I*(*p*,\
  \ *t*)，则过渡 *t* 被认为是 *enabled*。 firing *t* 时，从每个输入地点 *p* 移除数量等于 *I*(*p*, *t*) 的令牌，并在每个输出地点\
  \ *p* 放入数量等于 *O*(*p*, *t*) 的令牌。在 *M* 中 firing *t* 产生新的标记 *M*′，计算方式为 *M*′(*p*) =\
  \ *M*(*p*) − *I*(*p*, *t*) + *O*(*p*, *t*)。*E*(*M*) 表示标记 *M* 中所有 enabled 的过渡集合。\n\
  \n考虑如下简单的 Petri 网（Figure 17.1(a)），它包含 4 个地点和 3 个过渡，即 *P* = {*p*[1], *p*[2], *p*[3],\
  \ *p*[4]}，*T* = {*t*[1], *t*[2], *t*[3]}。初始标记为\n\n![Figure 17.1 A simple Petri net\
  \ and transition firing. (a) Initial marking. (b) The marking after firing t1 and\
  \ t3.](img/fig17_1_B.jpg)\n\n[Figure 17.1 A simple Petri net and transition firing.\
  \ (a) Initial marking. (b) The marking after firing *t*[1] and *t*[3].](#ch17.xhtml#R_fig17_1)\n\
  \n*M*[0] = (1, 0, 0, 0)。  \n\n仅 *t*[1] 在 *M*[0] 中 enabled。 firing *t*[1] 会得到新的标记\
  \ *M*[1]：\n\n*M*[1] = (0, 1, 1, 0)。  \n\n*M*[1] 使 *t*[2] 和 *t*[3] 成为 enabled，即 *E*(*M*[1])\
  \ = {*t*[2], *t*[3]}。若选择 *t*[2] 进行 firing，则新的标记 *M*[2] 为\n\n*M*[2] = (0, 0, 1, 1)。\
  \  \n\n若在 *M*[1] 中改为 firing *t*[3]，则得到\n\n*M*[3] = (0, 1, 0, 1)。  \n\nFigure 17.1(b)\
  \ 展示了从初始标记 *t*[1] 和 *t*[3] 之后的令牌分布。在 *M*[2] 中 firing *t*[3] 或在 *M*[3] 中 firing *t*[2]\
  \ 将导致\n\n*M*[4] = (0, 0, 0, 2)。  \n\n这是该 Petri 网的最终标记，因为 *E*(*M*[4]) = ∅，即该标记下没有任何\
  \ enabled 的过渡。\n\nPetri 网能够建模顺序事件、并发事件以及决策或竞争。在 Figure 17.1(a) 中，*t*[1] − *t*[2]\
  \ 和 *t*[1] − *t*[3] 的序列分别表示两个顺序事件。在 Figure 17.2(a) 中，*t*[2] 与 *t*[3] 构成一个 *decision\
  \ set*，它们竞争 *p*[2] 中的令牌以 firing。其中一个 firing 会使另一个失能。在 Figure 17.2(b) 中，*t*[4] 是一个\
  \ *synchronization transition*，它在 *p*[4] 和 *p*[5] 同时获得令牌后才能 firing，用于同步注入 *p*[4]\
  \ 令牌和 *p*[5] 令牌的事件序列。\n\n ![Figure 17.2 (a) t2 and t3 compete for the token in p2.\
  \ (b) t4 is a synchronization transition.](img/fig17_2_B.jpg)\n\n[Figure 17.2 (a)\
  \ *t*[2] and *t*[3] compete for the token in *p*[2]. (b) *t*[4] is a synchronization\
  \ transition.](#ch17.xhtml#R_fig17_2)\n\n### 17.2.2 Stochastic Petri Nets (SPNs)\
  \ and Generalized Stochastic Petri Nets\n\n基本 Petri 网不包含时间概念。然而，由于现实世界中的事件总是需要时间完成，研究者在\
  \ Petri 网上加入事件持续时间，从而出现了多种时制 Petri 网。[24, 34]。可以为令牌、地点或过渡分配时间参数。时间参数的值可以是固定的，也可以是随机的。在后者情况下，时间可以在区间内均匀分布，或遵循任意概率分布。\n\
  \nSPN 为每个过渡分配指数分布的 firing time。由于指数分布的无记忆性，循环 SPN 在稳态下的标记过程是 *Markov chain*。因此，基于\
  \ SPN 的系统性能评估变得相对容易。\n\nSPN 是六元组 (*P*, *T*, *I*, *O*, *M*[0], Λ)，其中\n\n*   (*P*,\
  \ *T*, *I*, *O*, *M*[0]) 是普通 Petri 网，\n\n*   Λ : *T* → *R* 是一组 firing rates，其元素\
  \ λ 为对应于每个过渡的指数分布的 firing rate。\n\n已证明 SPN 的标记过程是连续时间马尔可夫链 (CTMC) [24]。CTMC 可以通过状态转换率图或过渡率矩阵（也称为\
  \ *infinitesimal generator matrix*，记作 *Q*）来描述。状态转换率图是一幅有向图，其顶点代表 CTMC 状态，弧代表状态之间的指数分布过渡的速率。过渡率矩阵是一个矩阵，其非对角线元素是与状态之间过渡相关的指数分布的速率，而对角线元素使得每行元素之和为零。\n\
  \n给定过渡率矩阵 *Q*，可以通过求解\n\n$$\\\\begin{array}{l} {\\\\prod^{}Q = 0} \\\\\\\\ {\\\\\
  sum\\\\limits\\_{i \\\\in S}\\\\pi\\_{i} = 1} \\\\\\\\ \\\\end{array}$$  \n\n得到稳态概率向量\
  \ Π。若状态空间 *S* 为有限集合，例如 *S* = {0, 1, ..., *n* − 1}，则 Π 为 1 × *n* 的向量，而 *Q* 为 *n*\
  \ × *n* 的矩阵。Π*Q* = 0 的每一项可表示为\n\n$$q\\_{ii}\\\\pi\\_{i} + \\\\sum\\\\limits\\_{j\
  \ \\\\in S,j \\\\neq i}q\\_{ij}\\\\pi\\_{i} = 0$$  \n\n其中\n\n$$\\\\sum\\\\limits\\\
  _{j \\\\in S}q\\_{ij} = 0$$  \n\n一般化随机 Petri 网 (GSPN) 是一种特殊的 SPN，它引入了 *immediate\
  \ transitions*。即时过渡在 0 时间内 firing，即一旦 enabled 并被选中，就会立即 firing，不产生延迟。其余过渡为 *timed\
  \ transitions*，它们会以指数延迟 firing。给定标记 *M*，如果 *E*(*M*) 中的所有过渡都是 timed transitions，且\
  \ *t* 的 firing rate 为 *r*，则 *t* 的 firing 概率由\n\n$$\\\\Pr(t) = \\\\frac{r}{\\\\sum\\\
  _{t\\_{j} \\\\in E(M)}r\\_{j}}$$  \n\n\n\n\n如果 `E(M)` 中的所有过渡都是即时过渡，并且为所有这些过渡定义了预定义的概率分布，则根据该概率分布选择下一个触发的过渡。如果在可启用的过渡中既有即时过渡又有有时间标记的过渡，则只考虑即时过渡\
  \ \\[34, 35\\]。请参考 \\[36\\] 了解实时应用中有时间标记的过渡和即时过渡是如何处理的。\n\n## 17.3 Proposed Approach\n\
  \n行人疏散通常通过结合楼层场景模型的细胞自动化来处理，该模型指示行人有前途的移动方向。静态楼层场景表示每个单元格到出口的最短路径（通常与行人密度或分布的动态措施结合），而动态楼层场景表示每个单元格到出口的最快路径\
  \ \\[37\\]。我们考虑动态疏散，即在过程中出现意外情况时，撤离路径可以在必要时进行调整。本章提出了一种利用物联网技术在疏散过程中动态导航行人，使其尽快离开建筑物的方法。我们希望证明，在疏散进行中根据实时情况决定撤离方向可以对总疏散时间产生积极影响。\n\
  \n本方法的关键因素是将技术融入疏散过程的所有阶段。该方法的核心思想如图 17.3 所示 \\[Figure 17.3\\]. 假设一栋教学楼内有多个课程正在进行。每个教室里都有老师和学生，当发生紧急事件（如火灾或化学泄漏）时，他们就是撤离者。假设所有学生和老师都有智能手机。教室、走廊和楼梯的每个部分都安装了传感器（如摄像头）来监测整个建筑中的物体分布和运动。传感器定期收集数据并将其发送到云端服务器。服务器识别建筑中的物体及其运动，进行情景评估，并计算最佳疏散方案，同时通过移动网络向行人智能手机发送通知。服务器会评估建筑通往出口的任何部分是否存在潜在的拥堵。如果形成或已经形成拥堵，服务器会向行人发送指令，让其选择人少的一侧前往出口。通过指示行人前往人少的出口，拥堵导致的延误疏散的可能性会大幅降低。\n\
  \n![Figure 17.3 Illustration of dynamic teaching building evacuation. Sensors collect\
  \ data (information about objects in each monitored cell) and send it to a server\
  \ in the cloud periodically. The server performs situation assessment and sends\
  \ evacuation instructions to evacuees through cellular network.](img/fig17_3_B.jpg)\n\
  \nFigure 17.3 Illustration of dynamic teaching building evacuation. Sensors collect\
  \ data (information about objects in each monitored cell) and send it to a server\
  \ in the cloud periodically. The server performs situation assessment and sends\
  \ evacuation instructions to evacuees through cellular network.\n\n我们原本的信念是，获取尽可能多的实时信息有助于在疏散期间做出明智的决策。通过将技术融入疏散过程，我们能够根据教学楼内部实际情况进行实时决策。实验结果证实，实时决策显著缩短了疏散时间。\n\
  \n能够在疏散过程中动态改变正在发生的事情是降低疏散时间的主要因素。这与传统疏散方式截然不同。传统疏散为每个教室提供固定的路线，未考虑班级规模或拥堵情况，因此每次都是静态疏散计划，与实际情况无关。\n\
  \n基于物联网的动态疏散过程使用 GSPN 对其进行建模和模拟，详细讨论将在下一节。\n\n## 17.4 Modelling and Simulation\n\
  \n我们通过案例研究展示动态疏散方法的建模与模拟。首先展示正在研究建筑的楼层平面图。我们在建模与模拟过程中使用了几种软件工具。其中，`GreatSPN` 是用于时序和\
  \ SPN（标记事件网络）的图形编辑器和分析器 \\[38\\]，也是用于基于 STPN 模型对分布式系统进行建模、验证和性能评估的软件包。该工具由意大利都灵大学开发。`GreatSPN`\
  \ GUI 是我们创建 Petri 网络模型并对其运行仿真所使用的界面。\n\n除了 `GreatGPN`，我们还使用了 `Dash` 和 `Plotly` 两种基于\
  \ Python 的框架和库。`Dash` 让我们能够创建网页应用，以多种形式（如图表）显示数据。鉴于我们的研究性质，我们积累了大量数据。`Dash` 有助于我们管理数据，并提供将发现可视化的方式。对于我们稍后解释的每个测试用例，我们将数据导入\
  \ `Dash` 并创建折线图，显示随时间推移撤离人数的变化。我们使用 `Plotly` 绘制模拟结果的数据并检查趋势。`Plotly` 是 `Dash` 工具的扩展，用于数据可视化。\n\
  \n### 17.4.1 Floor Plan of Evacuation Building\n\n为了准确呈现疏散过程，我们基于单县 Monmouth University\
  \ 的 Howard Hall 二层进行建模。这使我们能够利用精确的测量数据。我们建模的区域包括一条宽六英尺的走廊，走廊两侧有教室。走廊一侧有两间大教室，每间教室配有两扇出口；另一侧有三间小教室，每间教室配有一扇出口。走廊的两端各设有一个出口，因此形成基于选择的疏散。当从教室走出时，部分人会选择向左走，另一部分人会选择向右走。由于行人无法看到出口是否拥堵，他们会凭借事先的知识选择特定的出口。Figure\
