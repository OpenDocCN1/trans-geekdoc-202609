  \n## 6.1 Introduction\n\n虽然最初为金融服务开发，区块链技术还有许多其他有用的应用，包括信息管理。它目前在金融、医疗保健、物联网（IoT）和国际贸易等多个领域引发热情。区块链技术的一个关键特点是它能够在不知情的各方之间以及各方内部建立信任，使它们能够在不需要中间人参与的情况下进行交易和共享信息，同时确保数据完整性和完整的审计追踪。区块链技术通过在所有节点之间以秒级记录价格、资产和所有权等细节来记录、验证和结算交易。在一个账本中记录的任何已验证的变更都会同时在所有其他副本中记录。区块链交易存储在块中，块是记录的集合。交易记录存储在信息块中。块在完成后相互链接，形成链条。这使其特别适合跟踪跨国金融交易和商品的流动。它可以提供关于金融交易或商品来源的准确且快速的信息，并且能够追踪过程的每一步。国际买家、卖家和承运人可以从信息的可用性、准确性和精确性中受益，同时政府海关机构也常常面临货物来源和产地的相同问题，以及在入口港口处同时处理大量交易的问题，这些港口通常分布广泛。\n\
  \n此外，区块链系统自动执行目前由多个中介机构执行的许多功能，如监控移动、支付和其他信息。因此，国际贸易成本可能会显著降低，对交易商和政府机构都有好处。已开发出区块链平台以改进现有系统，包括物流链。一个例子是\
  \ Tradelens，这是 MAERSK 和 IBM 的联合倡议，允许所有参与国际货运的各方实时交换关于事件和运输文件的信息 \\[1, 2\\]。\n\n\
  银行和金融行业通常被视为保守、监管严格且变化缓慢的行业。然而，银行目前正经历技术和监管方面的巨大而快速的变化，这些变化预计将在未来继续。到 2025 年，90%\
  \ 的欧洲支付理事会成员预计区块链技术将根本性地转变银行业。因此，区块链技术将使金融行业发生转型。虽然一些职位（如经纪人）将被消除，但也会创造新的职位。在极端情况下，区块链技术被预测会消除银行。但金融机构更有可能从区块链技术中受益，而不是消失\
  \ \\[3\\]。\n\n\n\n\n然而，区块链在银行和金融领域的采用仍面临诸多障碍。与中心化方案相比，将数据复制到多个节点上通常会增加维护成本。此外，区块链的成本还体现在单一实体通常拥有单个节点，而非集中式数据库。由于数据在多个节点间复制，这导致了可扩展性问题，因为交易必须在每个节点上广播并记录\
  \ \\[4\\]。银行和保险是传统行业，因其具有重大的信托责任 \\[5\\]。因此，这些机构可能因难以向监管机构解释数据在区块链参与者之间如何共享而犹豫采用区块链。\n\
  \n许多区块链应用依赖金融行业参与者之间的共同标准和合作。R3 这家金融科技初创公司与约 50 家金融机构组成的国际合作旨在加速区块链技术在金融领域的采用。鉴于金融世界竞争激烈，制定其使用标准可能颇具挑战\
  \ \\[7\\]。\n\n## 6.2 区块链在银行和金融行业的应用概览\n\n本节提供区块链在银行和金融领域的应用概览，包括现有的区块链应用、其优势和挑战，并对行业内部已部署的区块链平台进行了最新状态（SoTA）分析。\n\
  \n### 6.2.1 银行和金融行业的区块链应用\n\n*   *支付、清算和结算*\n\n    区块链技术可由银行和金融机构用于自动化国内和国际支付，以及证券交易、非同质化代币（NFT）等交易。在当今银行系统中，国际支付成本高昂且可能需要数天才能到达。通过区块链技术，这类支付可以在接近实时内完成，从而降低交易成本。R3\
  \ 和 Ripple 等公司正与传统银行合作，加速在企业区块链中实现传统资产与加密资产之间的支付结算 \\[8\\]。\n\n*   *面向公共、可互操作且防篡改的合同、记录和模型*\n\
  \n    公共且防篡改的合同、记录和模型（如土地登记数据库、艺术品所有权记录、奢侈品所有权）可以借助区块链技术实现。这在记录不可靠的国家尤为有用。利用区块链技术，传统证券（如股票、债券和其他有价值资产）可以代币化并在公共区块链网络上登记。这将使资本市场更加高效和互操作性更强\
  \ \\[9\\]。\n\n    区块链可用于存储信息、防止盗窃、建立产权或验证以下项目的所有权 \\[10\\]：\n\n    1.  加密货币（比特币）\n\
  \n    2.  非同质化代币\n\n    3.  金融工具（票据、债券、股票）\n\n    4.  衍生工具（期货合约、期权、掉期、远期）\n\n  \
  \  5.  金融工具表决权\n\n    6.  商品\n\n    7.  支出和交易记录\n\n    8.  抵押/信贷记录\n\n    9.  服务记录\n\
  \n    10.  土地或房产\n\n    11.  艺术品和奢侈品\n\n    12.  众筹\n\n    13.  微型融资和微型援助\n\n* \
  \  交易、审计和认证\n\n    智能合约可用于任何类型的合同，包括证券交易、审计、认证，以及海关和贸易流程。智能合约是能够自动验证并批准符合链上预定义协议的交易的程序。比特币交易可在满足特定条件时执行，公司可创建合约在达到特定盈利水平时向股东派发股息。同样，加密钱包服务器的\
  \ PCI 数据安全标准（DSS）合规性测试可自动完成 \\[11\\]。与传统合同相比，智能合约更便宜、更可靠，并消除了中间方验证条款的需求。区块链的防篡改特性是其可靠性的关键特征。投资者可在区块链证券中嵌入信息和交易规则。当满足特定条件（如价格要求）时，交易可自动执行；若条款未实现，证券所有权仍保持不变\
  \ \\[12\\]。\n\n*   *点对点（P2P）借贷和众筹*\n\n    初始代币发行（ICO）提供了新的融资方式，使传统的资本筹集服务与企业获取资金的渠道相互分离\
  \ \\[13\\]。\n\n*   *联盟银行*\n\n    联盟银行将多家银行聚集在一起，共同融资那些单个银行难以独立处理的大型项目，并利用各自资产。联盟银行由所有成员平等拥有，没有任何成员拥有控制权。区块链可通过智能合约实现联盟的自动形成\
  \ \\[14\\]。\n\n### 6.2.2 银行和金融行业的区块链实现\n\n尽管进行了大量实验和概念验证，区块链 기반银行和金融解决方案的实施仍面临挑战。从个体系统向共享系统的转变伴随巨大的资本支出。由于需要数据共享，银行必须适应重大的文化变革。在以保密性为先的行业中，这一概念颇具新意，并引发问责问题：如果\
  \ Bank A 完成了客户身份验证（KYC）流程并在区块链上发布数据，Bank B 是否需对其自身账户上的错误或欺诈负责？此外，Bank A 是否有足够动力分享其数据，因为数据共享可能削弱其提供个性化服务的能力？\n\
  \n此外，还存在一些实际挑战。例如，在 KYC 和防欺诈流程的设置中，客户必须同意上传其数字指纹并进行额外的身份验证步骤。除了在点售处更新验证系统外，商户还需修改其在线结账流程。要在规模上实现收益，银行必须建立大规模网络，这需要标准化数据并加强协作。此外，尚不清楚是否有任何银行愿意成为首个开发不具竞争优势的公用工具的先行者，这也被称为合作与竞争的悖论\
  \ \\[15, 16 and 17\\]。\n\nTable 6.1 显示目前银行广泛使用的最常见区块链平台，包括 IBM Blockchain、R3、Komgo\
  \ 和香港金融管理局（HKMA）。\n\nIBM Blockchain Platform 是 IBM 商业化的 Hyperledger Fabric 实现，提供完整的服务级别协议（SLAs）。其包含一套完整的生产力工具，用于区块链应用的开发、管理和运行。其灵活的区块链框架使创新者能够转型全球业务。\n\
