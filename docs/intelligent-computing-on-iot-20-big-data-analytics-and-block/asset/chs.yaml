  \ 使用 NFT\n\nSwarup Yeole\n\n\n\n\n国际信息技术学院 Naya Raipur，Naya Raipur，印度  \nMohammad\
  \ S. Obaidat  \n乔丹大学，阿曼，乔丹  \nSRM 印度大学  \n印度理工大学北京，中国  \nAditya Goel 和 Sanskar Chandra\
  \  \n国际信息技术学院 Naya Raipur，Naya Raipur，印度  \nRuhul Amin  \n国家技术学院，贾姆谢德布尔，印度  \nDOI:\
  \ [10.1201/9781003326236-7](https://dx.doi.org/10.1201/9781003326236-7)  \n\n##\
  \ 7.1 介绍  \n\n非同质化代币（NFT）市场呈指数级增长。解决方案是基于 NFT 的区块链数字保修系统，它自动化保修跟踪和索赔流程，并减少处理索赔所消耗的时间。该方法是一个由多个端点组成的自动化过程，可在从智能手机到个人笔记本电脑和台式机等多种设备上使用，从而使其对客户和供应商来说易于使用。模块化区块链网络为保修管理系统创建了一个点对点网络。一个网络用于供应商，另一个用于客户。供应商将发布其产品并提供保修索赔的详细信息。当客户购买该产品时，其保修索赔（例如，保修期为一年）将在链码中触发。当保修期过期时，系统会自动将保修标记为\
  \ `expired`，客户将无法再享受该产品列出的保修期限的权益。我们的目标是使保修系统更加稳健可靠。  \n\n我们的架构在产品购买时提供数字代币作为保证，该代币作为商品购买的凭证以及随之而来的保修凭证。\
  \  \n\n## 7.2 文献综述  \n\n### 7.2.1 非同质化代币（NFT）：概述、机遇、评估与挑战  \n\n本章介绍非同质化代币（NFT）概念及其市场增长。文中指出，NFT\
  \ 概念源自以太坊代币标准，这意味着每个代币必须通过可见标记予以区分。作为可辨识的唯一证明，此类代币可以与虚拟/计算机化的属性绑定。通过 NFT，所有显著属性可以自由交换，并根据其年龄、稀有性、流动性等改变意义。本章强调\
  \ NFT 显著提升了去中心化应用（dApp）市场的成功。  \n\n本文从多个角度考察 NFT 生态系统，先总结最佳 NFT 解决方案，再提供其技术组件、流程、基准和理想特性。随后的安全发展讨论了此类设计范式的观点、可能性和困难。\
  \  \n\n根据一份报告，NFT 是区块链领域的突破。报告中研究了可能重塑数字/虚拟资产市场的最佳 NFT 方案。首先分析专用组件，并提供计划模型和属性。然后评估当前\
  \ NFT 框架的安全性，并讨论拥抱 NFT 概念的机遇和潜在应用。论文还讨论了在大规模进入市场前需要解决的现有研究挑战。报告提供了对当前提议方案和活动的适当审查和汇总，使新来者更容易跟上持续的发展。\
  \  \n\n### 7.2.2 非同质化代币：数字收藏品的未来  \n\n本章探讨 NFT 与加密货币及版权的关系，以及其工作方式和各种组件。其目标是分析影响其运营的法律风险，以及印度法律框架在加密资产方面所面临的机遇和挑战。\
  \  \n\n与其他虚拟加密货币和资产一样，NFT 是基于区块链技术的数字真伪证明证书。近年来，区块链技术和加密货币交易的兴趣有所增加。正如最近所见，NFT 市场也在增长。NFT\
  \ 的概念源自以太坊代币标准，该标准旨在分离并识别每个代币的独特签名，该签名与数字特征相连。  \n\n由于该数字行业的快速增长及其在全球市场中的显著回报，印度对该数字行业的兴趣激增。然而，印度缺乏监管框架来控制此类新兴的数字加密资产，因为\
  \ NFT 生态仍处于起步阶段。其法律地位和神圣性因围绕其的各种法律困难而模糊。新兴艺术家在没有系统描述的情况下可能会在混乱的增长中迷失。  \n\n## 7.3\
  \ 前置知识  \n\n### 7.3.1 区块链  \n\n区块链是一项快速发展的技术，由 Satoshi Nakamoto 在 2008 年通过发表《比特币：点对点电子现金系统》论文而闻名。由于其去中心化特性，区块链是一种分布式账本技术（DLT），使数字交易和记录透明且不可篡改。一个区块是一组有效的交易。有效交易是指在验证过程中已通过共识方法批准的交易。矿工是区块链网络中的节点，负责运行这些算法。区块由在特定时间段内发生的、经过时间戳和验证的有效交易组成。当前区块通过哈希\
  \ —  — 类似指纹的唯一字母数字字符串 —  — 与紧邻的前一个区块相连。每个区块都保存前一个区块的哈希以供参考。通过 SHA256 等算法，不同消息会产生不同的哈希。交易的微小改变会导致输出哈希改变并破坏链条。因此，一旦交易被包含在区块中，就无法被修改，使区块链不可变。\
  \  \n\n区块链上的记录按时间顺序组织，不可逆，且所有节点均可轻松访问。由于其节省成本、速度快、透明、隐私、可见性、风险降低、欺诈少、篡改少、生产力高、效率高、质量好和结果优异等优势，区块链技术正在迅速在金融、保险、贸易融资、数字身份、慈善和供应链等多个行业获得应用。\
  \  \n\n截至目前，有四种区块链网络：  \n\n1. `Public blockchain`  \n   公有区块链没有入口要求。任何拥有 Web 连接的用户都可以使用它发送交易并成为验证者（即参与执行协议协议）。此类组织通常采用某种\
  \ Proof of Stake 或 Evidence of Work 计算机机制，并向保障它们的参与者提供经济激励。比特币和以太坊是两个最大且最知名的公有区块链。\
  \  \n\n2. `Private blockchain`  \n   许可区块链是私有区块链。除非组织的主席给予批准，否则无法支持它。访问权限仅限于成员和验证者。公开区块链及其他共享、去中心化数据集应用程序\
  \ —  — 这些应用程序不向指定过程组提供访问权限 —  — 有时用“传递记录（DLT）”一词来区分。  \n\n3. `Hybrid blockchain`\
  \  \n   混合区块链结合去中心化和统一特性。具体的去中心化程度和集中化程度会影响链的精确活动。  \n\n4. `Sidechain`  \n\n\n\n\
  -   [侧链](https://example.org)是与基础区块链并列的区块链记录的分配。\n\n基础区块链（定期处理数字资源的区块链）上的记录可以与侧链相连和从侧链转移；这使得侧链可以独立于基础区块链运作（例如，通过使用替代记录保存方法和替代共识计算）。\n\
  \n区块链技术在多个领域有应用，以下是其中一些：\n\n1. **金融服务**\n\n根据 2016 年 9 月 IBM 的研究，这正在比预期的更快地发生。许多组织将其收益分为帮助企业创建私有区块链以及处理传输数据以用于银行用途。银行对这一想法感兴趣，因为它加快了行政结算程序。此外，随着区块链业务发展到早期阶段，机构知识显示它通常是一个全新金融行业的框架，拥有所有相关后果。\n\
  \n区块链还使通过初始硬币发行（ICOs）和安全代币（STOs）进行贡献成为可能，STOs 是数字资产的一个独立类别，有时被称为改进型资产（DSOs）。传统资产如公司股票和更非理性的资产如专利、房地产、手工艺品或特定商品可以通过\
  \ STO/DSOs 进行代币化。STO/DSOs 可以在托管股票交易所上以公开或隐蔽方式管理。许多团体参与这一领域并支持安全代币化、公开 STO 和私人 STO。\n\
  \n2. **游戏**\n\n区块链技术，如数字货币和 NFT，已被用于电脑游戏的商业化。一些即时服务游戏允许玩家通过与其他玩家交易游戏内货币（如角色皮肤或其他游戏内物品）来购买和交易游戏内物品。一些游戏也允许使用真实货币交换虚拟物品，但这在某些将电脑游戏视为类似赌博的国家可能是非法的，例如皮肤赌博。因此，发行商通常会避免让玩家从游戏中获得真实资产。区块链游戏通常允许玩家将这些游戏内物品交换为数字货币，然后可以转换为现金。\n\
  \n3. **供应链**\n\n**运输行业：** 承包商和新兴企业开始使用区块链技术，以促进基于区块链的平台环境的发展，从而提升全球运输供应链中的价值。\n\n\
  **有价物资的采矿：** 区块链技术已用于追踪宝石和其他商品的来源。2016 年，《Money Road Diary》报道称，IBM 的区块链技术正在与区块链技术公司\
  \ Everledger 合作，追踪钻石的来源，以确保它们是伦理采矿的。Precious Stone Swapping Organization（面向消费者，DTC）于\
  \ 2019 年开始开发名为 Tracr 的钻石交换零售网络产品。\n\n**食品供应：** 从 2018 年开始，沃尔玛和 IBM 运行了一项测试项目，使用基于区块链的架构对菠菜和生菜进行供应链检查。所有区块链节点均由沃尔玛控制，并托管于\
  \ IBM 云上。\n\n**设计行业：** 在时尚行业中，公司、分销商和客户之间存在模糊的关系，这将阻碍其稳定和持续的增长。区块链纠正了这一缺陷，简化了数据，解决了可控行业进步的问题。\n\
  \n4. **加密货币**\n\n加密货币是一种数字货币，可以在计算机网络中交换，无需中央管理或监督机构（如政府或银行）。\n\n个人货币所有权记录存储在先进的记录中，即一个数字数据集，包含强区域，可用于获取交易记录、管理硬币的生产以及监控硬币所有权的转移。尽管名称如此，数字货币不被视为传统货币标准。数字货币在实践中被广泛视为一种独特的资产类别，尽管它们被赋予了多种名称，包括被视为物体、保护品和货币规则。某些加密货币方案使用验证者来维护数字货币。在权益证明（proof-of-stake）范式中，所有者通过其代币建立安全性。因此，他们对代币拥有权取决于他们下注的金额。通常，这些象征性的赌注会通过网络费用、新代币或其他奖励机制在长期内获得额外的代币所有权。\n\
  \n数字货币在实际结构上不存在（如纸币），通常不由中央机构发行。加密货币通常使用去中心化控制，而不是由中央银行数字货币（CBDC）控制的法币。当一种数字货币在发行前打印或由单一担保人发行时，它通常被视为集中化。当以去中心化方式执行时，每种加密货币都使用分布式账本技术，通常是一个充当公共金融交易数据库的区块链。传统资产类别如货币、商品和股票，以及宏观经济因素，对数字货币回报有有限的机会。\n\
  \n大多数数字货币使用区块链技术来跟踪交易。例如，区块链可用于以太坊和比特币网络。2018 年 5 月 8 日，Facebook 宣布成立一个新的区块链团队，由\
  \ David Marcus（前 Courier 负责人）领导。Facebook 的期待中，其加密货币平台 Libra（现称为 Diem）于 2019 年 6\
  \ 月 18 日正式发布。\n\n各国政府对居民或银行持有数字货币的合法性采取了不同的态度。中国在 2020 年将区块链技术应用于多个行业，包括数字公共货币的发行。西方政府，包括欧洲联盟和美国，为加强其特定货币，已启动类似的项目。\n\
  \n5. **域名**\n\n多个尝试已在区块链上提供域名服务。这些域名可以通过使用私钥进行控制。因此，不可审查的网站必须被考虑在内。此外，这将绕过记录商限制包含欺诈、滥用或非法信息的网站的能力。\n\
  \nNamecoin 是一种支持高级“片”空间（TLD）的虚拟货币。2011 年，Namecoin 分叉自比特币。ICANN 不支持“.piece”TLD；它需要替代\
  \ DNS 根。在 120,000 个注册名称中，约 28 个网站于 2015 年左右开始使用它。2019 年，Open NIC 因恶意软件和潜在的法律问题停止对\
  \ Namecoin 的支持。\n\n三个明确的 TLD 通过 Ethereum Name Administration（ENS）与以太坊区块链相连，分别是“.eth”、“.luxury”和“.kred”。除了比使用常规数字货币钱包地址更方便外，.kred\
  \ TLD 还可用于转账。\n\n6. **其他用途**\n\n\n\n区块链技术可用于构建可靠、透明且简洁的记录系统，用于收集交易信息、追踪计算机使用情况以及向内容提供者（如音乐家或远程用户）进行支付。在\
  \ Gartner 2019 CIO Review 中，高等教育机构的受访者占样本的 2%，而另外 18% 的受访者计划在未来 24 个月内开展学术项目。为实施区块链技术进行音乐分发，IBM\
  \ 于 2017 年与 ASCAP 和 PRS for Music 合作。另一种基于区块链的方案是 Imogen Pile 的 Mycelia 管理系统。该系统“赋予艺术家更大对其音乐及相关信息在听众和其他艺术家之间流通的控制权”，据声明所述。\n\
  \n在区块链之后，保险行业现在可利用分布式、参数化和微保险等新的分发策略。物联网（IoT）和共享经济也从区块链中受益，因为它们促进了点对点的协作。美国画廊与图书馆服务基金会的拨款正在被探索，以在图书馆中应用区块链技术。\n\
  \nHyperledger 是由 Linux Foundation 主导的合作项目，旨在实现基于区块链的分布式记录功能，属于其他区块链项目之一。该项目包括由 Monax\
  \ 开发的 Hyperledger Texture 和 Hyperledger Tunnel（均由 IBM 牵头）。另一个是由 JPMorgan Pursue\
  \ 支持的私有区块链 Majority，专为合同应用提供私有容量。此信息在 Figure 7.1 中展示。\n\n![Figure 7.1 EVM.](img/fig7_1_B.jpg)\n\
  \nFigure 7.1 EVM.\n\n### 7.3.2 Ethereum Virtual Machine (EVM)\n\n*Ether* 是以太坊区块链所使用的代币。Ether\
  \ 代表账户之间资金的任何交换，作为分布式货币。以太坊使用的货币称为 ether，这为从加密货币交易到金融软件、数字资产和代币的存储与管理，再到传统系统、投票软件、身份管理，乃至需要可追踪资产和资源的系统，提供了广泛的应用范围。以太坊智能合约的运行环境称为\
  \ Ethereum Virtual Machine (EVM)。在 EVM 中运行的代码完全隔离，而非仅仅 sandboxed，因此既不能被其他进程访问，也不能被网络访问。即使其他智能合约也只能在特定条件下访问。\n\
  \n通过规避部分与加密货币行业相关的拒绝服务攻击（DoS）问题，EVM 确保安全。其次，EVM 通过解释和运行以太坊编程语言，使通信能够 uninterrupted\
  \ 地进行。\n\n### 7.3.3 Smart Contracts\n\n基于区块链的智能合约是满足特定条件时执行的计算机程序。它们用于自动化协议的实施，使所有相关方在无需中介或浪费时间的情况下确信结果。它们还能自动化工作流程，当条件满足时，下一步即被启动。\n\
  \n智能合约使开发者能够构建各种去中心化应用（dApp）和代币。它们应用于从金融工具到物流和游戏体验的各个领域。\n\n智能合约是以“如果/当...则...”形式编写并在区块链上发布的代码声明。当网络中的计算机确认特定条件已满足时，将执行相应的活动，包括完成财务支付、登记车辆、发送通知或发放门票。交易完成后，区块链会更新，因此交易不可篡改，只有被授权的用户方可查看结果。\n\
  \n智能合约可包含必要的任意数量的条件，以向相关方提供保障，确保行动能够成功完成。为确定条件，参与者必须达成“如果/当...则...”规则的共识，考虑可能的例外情况，并提供争议解决框架。同时，参与者还需讨论在区块链上如何存储交易及相关数据。\n\
  \n开发者可以构建智能合约，但越来越多的企业在采用区块链进行业务时，会使用模板、Web 界面和其他在线工具来简化智能合约的创建过程。\n\n**智能合约的优势**\n\
  \n*   **速度、效率与精确性**\n\n    当条件满足时，合约会迅速执行。作为数字且自动化的合约，智能合约消除了纸质文档的需求，并避免了手动填写表单时常见的错误。\n\
  \n*   **完整性与信任**\n\n    无需担心信息被某参与方操纵，因为不存在第三方；参与方交换加密的交易记录。\n\n*   **安全性**\n\n\
  \    加密的区块链交易记录极难被篡改。在分布式账本中，每条记录都与之前和之后的记录相连，因此黑客需要修改整个链条才能更改单条记录。\n\n*   **节省成本**\n\
  \n    智能合约消除了中介管理交易的需求，从而消除了相关的费用和时间延迟。\n\n*   **备份**\n\n    区块链的共享账本由每个节点维护，使该服务成为最佳选择。\n\
  \n### 7.3.4 InterPlanetary File System\n\n区块链是一种安全存储数据的方式。但由于计算和网络限制，它并不是处理大量数据的最佳方案。作为替代方案，InterPlanetary\
  \ File System (IPFS) 可用于成本效益地存储海量数据和内容。IPFS 是一种分布式、去中心化的系统和平台，用于安全存储数据和文件。它结合了早期点对点网络（如\
  \ BitTorrent、DHT、SFS 和 GIT）的成功思想。IPFS 通过将成功的方法整合到一个重要系统中，而非仅限于单独的部分，提供了全新的大规模应用创建和部署框架。\n\
  \nIPFS，即 InterPlanetary File System，是为构建点对点超媒体存储与共享的分布式网络和协议而设计的，其内容可寻址，因为它是点对点的，节点拥有特殊权限。\n\
  \nIPFS 节点使用本地存储保存 IPFS 对象。这些对象代表文件和数据结构，由节点连接并通过节点传输。IPFS 使用内容的哈希值来识别并在节点之间分发它。它采用\
  \ Merkle DAG 数据结构进行数据存储，并利用 GIT 进行版本控制。\n\n点对点网络分发内容，IPFS 旨在直接连接每台计算设备。甚至互联网本身都可以通过\
  \ IPFS 发展。IPFS 提供一种内容寻址的块存储格式，具备高吞吐量和内容寻址超链接。它结合了自认证命名空间、激励区块交换以及分布式哈希表。IPFS 中的数据传输不可篡改，因为不存在单一故障点。分布式内容交付保护了\
  \ HTTP（面临 DDoS 攻击）的弱点，并节省带宽。访问文件系统的方式多样，包括通过 HTTP 的 FUSE（“文件系统在用户空间”）或其他方式。IPFS\
  \ 文件系统将包含本地文件，使其可供全球访问。由于使用哈希值识别文件，因此具备缓存友好性。任何下载文件的用户都会使数据在网络中可用于其他用户。\n\n### 7.3.5\
  \ NFT\n\n\n\n非同质化代币（NFT）是复制有形事物的独特性、稀缺性和所有权确认等实际属性的数字货币代币。它们同时针对区块链所带来的新型、无形且必不可少的数字资产进行处理。NFT\
  \ 正在被用于实物和虚拟资源，以适应其价值。\n\nNFT 不可交易。它们通过元数据和唯一标识符（如扫描标签）与特定的链上地址关联，从而相互区分。元数据使它们成为确认责任的最佳工具。由于每个代币都极具辨识度，NFT\
  \ 与比特币或以太坊等区块链加密货币（如 Bitcoin 或 Ethereum）不同。例如，一个比特币（BTC）始终与另一个比特币价值相等；同理，一个以太币（ETH）单位也等于另一个以太币。加密货币因其可互换性，在数字经济中作为安全的交换媒介具有合理性。通过确保每个代币都是唯一的，NFT\
  \ 改变了加密领域的范式。\n\nERC-721 标准催生了 NFT。ERC-721 规定了交换和分发游戏代币所需的最小界面——所有权信息、安全性和元数据。它由与创建\
  \ ERC-20 智能合约的部分人员共同开发。通过降低 NFT 的交易和存储成本，并将多种非同质化代币类型批量合并到单一合约中，ERC-1155 标准在此基础上进一步拓展了概念。\n\
  \n需说明的是，独特标识的概念和数字化有形商品的概念本身并不新颖。但当这些概念与不可篡改的区块链（智能合约）的优势结合时，它们便成为变革的强大动力。\n\n市场效率是\
  \ NFT 最明显的优势。将实物资产转化为数字资产简化了流程并消除了中介。代表实物或数字艺术品的 NFT 免除了中介的需要，使艺术家能够直接与观众互动。此外，它们还能提升企业流程。例如，一枚酒瓶的\
  \ NFT 让供应链的不同参与方更易沟通，并帮助追踪其创作、来源和销售全过程。咨询公司埃森哲（Ernst & Young）已为其客户开发了类似解决方案。\n\n\
  **NFT 类型**\n\n1. **艺术**\n\n   艺术是 NFT 最常见的子集。这些主要是数字艺术作品，由其所在的公共账本发布公开的所有权和真实性证明证书。历史上最贵的\
  \ NFT 是艺术家 Beeple 的数字作品《The First 5000 Days》，于 2021 年 3 月在佳士得拍卖会上以惊人的 6930 万美元售出。\n\
  \n2. **音乐**\n\n   NFT 狂潮中最近的发展是音乐。艺术家在将专辑发布到常规流媒体平台之前，会先在 NFT 市场预发。消费者可以购买唱片的一部分（如份额），并在传统渠道发布后获得专辑收入的一部分。虽然这种音乐\
  \ NFT 交易模式仍属新颖，但许多交易均遵循此模式。例如，2021 年 3 月，Kings of Leon 的专辑《When You See Yourself》以多个\
  \ NFT 形式上市出售。\n\n3. **视频游戏项目**\n\n   视频游戏领域是 NFT 的广阔天地。各大公司并未以 NFT 形式出售完整游戏，而是提供皮肤、角色等游戏内内容进行购买。玩家今天大量购买可下载内容（DLC），而\
  \ NFT 资产则独占于单一玩家，且唯一。开发者先发布常规 DLC，随后在 NFT 市场上销售限量版 DLC。\n\n4. **交易卡/收藏品**\n\n  \
  \ 历史上第一个 NFT 是收藏品。这些数字收藏品与实体收藏品（如宝可梦卡片或状况良好的旧玩具）在形式上相同。第一批大规模发布的 NFT 收藏品是 Curio\
  \ Cards，此后 Bored Ape Yacht Club、Crypto Punks、Cat Colony、Meebits 等收藏品层出不穷。Bored Ape\
  \ Yacht Club 成为数字珍宝的市场领袖，深受收藏者喜爱。\n\n5. **重大体育瞬间**\n\n   体育纪念品是 NFT 最受欢迎的类别之一，NBA\
  \ Top Shot 是该领域最著名的 NFT。此类 NFT 包含价值连城的体育赛事视频片段。勒布朗·詹姆斯的灌篮（LeBron James Dunk）及其系列（Throw\
  \ downs）等视频是该类别中最知名的 NFT。其中一枚最贵的体育纪念 NFT，售价超过 38 万美元。\n\n### 7.3.6 ERC 721\n\n在以太坊区块链上，ERC-721\
  \ 是免费、开放的标准，用于创建非同质化或唯一代币。大多数代币是可互换的，即每个代币与其他代币完全相同。但 ERC-721 代币各不相同。尽管本研究聚焦于视频游戏，ERC-721\
  \ 也有文档、艺术等多领域的应用。要管理、拥有和交易唯一代币，智能合约必须实现 ERC-721 所规定的最小接口。它不强制规定代币信息的标准，也不限制添加其他功能。ERC\
  \ 721 如图 7.2 所示（链接至章节 7.2 中的图 7.2）。\n\nFigure 7.2 ERC 721 function.\n\n| FUNCTIONS\
  \ |\n| --- |\n| balanceOf(owner)ownersafeTransferFrom (from, to, tokenId, data)safeTransferFrom(from,\
  \ to, tokenId)transferFrom(from, to, tokenId)approve(to, tokenId)setApproval ForAll\
  \ (operator, approved)getApproved (tokenId)isApproved ForAll (owner, operator) |\n\
  | --- |\n\n它提供包括在账户间转移代币、查询账户当前代币余额、确定特定代币所有者以及统计网络上流通的代币总数等功能。此外，它还支持授权转移特定数量代币的功能。实现\
  \ ERC-721 非同质化代币合约的方法和事件如下列出。部署后，合约即负责管理在以太坊上产生的所有已生成代币。\n\n### 7.3.7 ERC 1155\n\
  \n以太坊区块链上的另一种代币标准是 ERC-1155。它遵循 ERC-20（可互换）和 ERC-721（不可互换）的原则，是广泛接受的非同质化标准。由于其能够在单一合约中支持多种代币，ERC-1155\
  \ 赋予了资产真实价值。该规范使交换和代币生产更加可接受。ERC-1155 还支持复用现有代币并从中创建新代币，适用于文档、细艺等多个领域。\n\n### 7.3.8\
  \ MetaMask\n\n通过 MetaMask，用户可以发送和接收基于以太坊的币和代币，广播交易，保存和管理密钥，并使用合适的浏览器或移动应用内置浏览器安全地连接去中心化应用。用户的\
  \ MetaMask 钱包（以及任何类似的区块链钱包浏览器扩展）可以通过网站或去中心化应用的 JavaScript 代码与其他智能合约功能进行连接、认证或集成。这使网站能够将\
  \ MetaMask 充当中间件，向用户发送操作提示、签名请求或交易请求。\n\n**Features**\n\n*   **Ease of Use**\n\n\
  \    MetaMask 使用简便、快速且匿名。它甚至不需要电子邮件地址。只需设置密码并记住（并保存）秘密恢复短语即可。\n\n\n\n\n# Token Swaps\n\
  \n点对点（`P2P`）代币交换可以使用您钱包中的 `MetaMask` 的交易功能进行。\n\n# Security\n\n由于信息在您的浏览器中加密，因此没有人可以访问您的信息。您拥有用于在忘记密码时恢复的\
  \ 12 词语秘密恢复短语（也称为种子短语）。值得注意的是，即使 `MetaMask` 也无法获取种子短语，因此必须妥善保管它。一旦它消失，就再也找不回来了。\n\
  \n# Built-In Crypto Store\n\n仅支持 `Ethereum` 及与 `Ethereum` 关联的代币，包括著名的 `ERC-20` 代币，与\
  \ `MetaMask` 一起使用。在 `Ethereum` 上，除以太币（Ether）之外的所有加密货币都作为 `ERC-20` 代币创建。\n\n# Backup\
  \ and restore\n\n您向 `MetaMask` 提供的数据本地存储。因此，如果您更换浏览器或计算机，可以使用您的私人恢复短语来恢复您的 `MetaMask`\
  \ 钱包。\n\n# Community support\n\n截至 2021 年 8 月，约 1000 万月活跃用户使用 `MetaMask`。由于其界面清晰易用，使用人数自\
  \ 2020 年 7 月以来增长了 1800%。\n\n`MetaMask` 钱包适合已熟悉加密货币的个人，但对初学者并非最佳选择。由于钱包易受恶意软件和社交工程攻击的威胁，不熟悉警示标志的用户可能会面临资金损失的风险。由于无法在没有\
  \ 12 词语秘密种子短语的情况下更改密码，用户可能会永久失去对其加密资产的访问权限。新用户在使用 `MetaMask` 或其他工具之前，必须先学习如何使用比特币钱包。\n\
  \n**TechStack Used**\n\n1. `MetaMask`: 它是一个钱包和浏览器扩展程序，安装方式与其他浏览器插件相同。安装后，它允许用户持有\
  \ `Ethereum` 和其他 `ERC-20` 代币，从而可以使用任何 `Ethereum` 地址进行交易。通过将 `MetaMask` 连接到基于 `Ethereum`\
  \ 的去中心化应用（dApps），用户可以在游戏中消费资金、在赌博应用中质押代币，或在去中心化交易所出售代币。\n\n2. `IPFS`: 用于存储和访问文件、网页、应用程序和数据的分布式系统。`Infura`\
  \ 的 `IPFS` API 及专用网关为所有规模的应用提供了快速且易于使用的分布式安全存储，使更强大的 Web 成为可能。\n\n3. `React.js`:\
  \ 由 Facebook 创建的前端 JavaScript 框架。我们使用 `React` 以声明式构建可组合的用户界面，以可预测且高效的方式进行开发。该框架是开源且基于组件的，负责开发应用的显示层。\n\
  \n4. `Hardhat`: `Hardhat` 是 `Ethereum` 软件的开发环境。它包含多种可用于编辑、编译、调试和部署 dApp 和智能合约的组件，形成一个完整的开发环境。\n\
  \n5. `Ether.js`: 用于连接 `Ethereum` 区块链及其生态系统的 `ethers.js` 库。最初设计用于 `ethers.io`，后发展为更通用的库。\n\
  \n## 7.4 Implementation\n\n提议的架构支持去中心化市场和代币基础设施，用于列出产品。该架构还以数字代币的形式提供购买产品的保修，该代币作为产品购买及其相关保修的凭证。它利用\
  \ `IPFS` 以低成本在去中心化存储中存储列出的产品元数据。该架构使用 `Ethereum` 区块链部署智能合约。去中心化代币基础设施采用 `ERC 721`\
  \ 协议创建唯一的代币对象，包括产品图片、产品型号和保修期限。产品从市场购买后，这些数字代币会转移到购买者的账户作为数字保修。实现该架构的步骤如下：\n\n###\
  \ 7.4.1 NFT Smart Contract\n\n该合同遵循 `ERC 721` 标准。智能合约包含铸造 NFT 的函数。该合约包含以下函数：\n\n\
  1. **mint**: 此函数用于铸造 NFT。它内部维护 NFT 列表的代币计数，以唯一标识每个列出的代币。该函数使用 `ERC721` 标准的 `safeMint()`\
  \ 函数铸造 NFT，同时内部使用另一个 `ERC721` 函数 `setTokenURI()` 设置特定 NFT 的元数据。该函数在返回语句中返回 NFT 的唯一代币\
  \ ID。\n\n### 7.4.2 Market Place and Warranty Contract\n\n该智能合约允许卖家在市场上以 NFT 形式列出产品信息，待销售后将\
  \ NFT 所有权转移给买家作为保修。该合约也遵循 `ERC721` 代币标准，并内部使用 reentrancy guard 合约来防止 reentrancy\
  \ 攻击。该合约将 `fee Account` 设置为智能合约的部署者。该合约涉及的函数如下：\n\n1. **Make Item**: `makeItem()`\
  \ 函数接受以下变量作为输入：\n\n    1. `_nft`: 要列出的 NFT 的 NFT 合约。\n\n    2. `_tokenId`: 要列出的\
  \ NFT 的唯一代币 ID。\n\n    3. `_price`: 产品价格。\n\n    4. `_warranty`: 产品保修期限。\n\n   \
  \ 5. `_modelNum`: 产品型号。\n\n        该函数会检查 `_price`、`_modelNum`、`_warranty` 的输入是否有效。智能合约内部执行\
  \ `transferFrom()` 函数，将列出的产品 NFT 的所有权从卖家转移到智能合约。列出的产品数据存储在映射结构 `items` 中，唯一链接每个\
  \ `ItemId` 与其数据。每次执行该函数时，都会发出 `Offered` 事件。\n\n\n\n2. PurchaseItem: 该函数接收唯一的 `_itemId`\
  \ 作为输入，并通过 `nonRentrant` 修饰符防止重入攻击。函数会检查 `_ItemId` 是否为有效格式，并检查商品状态。如果商品未售出，则交易允许继续；否则交易失败。内部调用\
  \ `get Total Price` 函数获取商品总价，随后调用 `transfer From()` 函数将 NFT 所有权从市场转移给买家作为保证，同时更新卖家以交付请求的产品。最后，函数将金额转移到市场账户和卖家账户。\n\
  \n3. get Total Price: 该函数返回商品总价，计算公式为：total Price = (100 * fee Percent)/100。\n\n\
  4. claim Warranty: 该函数在买家索赔保修后将 `_Warranty Claimed` 字段更新为 true。\n\n3) **Product\
  \ Listing**\n\n产品列表涉及以下步骤：\n\n1. 卖家进入软件的“列出产品”部分。\n\n2. 卖家上传以下产品详情：\n\n    1. *Image:*\
  \ 将出售的商品图片提供。\n\n    2. *Name:* 添加待售商品的名称。\n\n    3. *Model Number:* 列出商品型号。\n\n\
  \    4. *Description:* 在此字段中，卖家可添加商品描述。\n\n    5. *Price:* 在此字段中，卖家以 ETH 列出商品价格。\n\
  \n    6. *Warranty:* 在此字段中，卖家列出商品保修期限（以年为单位）。\n\n3. 卖家点击“列出产品”，所有元数据存储在去中心化存储系统\
  \ IPFS 中。市场智能合约的 `make Item()` 函数被触发。MetaMask 会弹出确认列表的对话框，确认后交易签名并更新区块链数据。`make\
  \ Item` 函数内部调用 `mint NFT` 函数，在市场上列出商品 NFT。生成的 NFT 所有权转移至市场。\n\n4) **Product Purchase**\n\
  \n产品购买涉及以下步骤：\n\n1. 客户进入软件的区块链市场部分。\n\n2. 客户从市场列表中选择要购买的商品。\n\n3. 客户购买商品后，`Purchase\
  \ Item()` 函数被触发。MetaMask 会弹出交易确认对话框。交易确认后，通知会发送给卖家以进行产品交付，产品从市场中移除，区块链状态更新，商品标记为已售出。此过程在\
  \ Figure 7.4 中显示。\n\n    ![FIGURE 7.4 Product purchase flow chart.](img/fig7_4_B.jpg)\n\
  \n    FIGURE 7.4 Product purchase flow chart.\n\n5) **Warranty Generation and Claim**\n\
  \n`Purchase Item()` 函数内部调用 `_transfer From()` 函数，将市场列出的商品 NFT 转移至买家账户。一旦所有权转移，事件\
  \ `bought` 会被发出。此时，该 NFT 作为数字保修和购买凭证。买家的“我的产品保修”部分会显示以下字段：\n\n1. Product Image\n\
  \n2. Product Name\n\n3. Warranty Period\n\n4. Warranty Claimed\n\n如果客户索赔保修，`warranty\
  \ Claimed` 字段会更新为 true，表示保修已被索赔。\n\n## 7.5 Deployment\n\n智能合约使用 Hardhat 部署。HardHat\
