  \ 16.4.2.2.2 Real-Time Instance Segmentation Method Based on Computation Offloading\n\
  \n实例分割是计算机视觉中的一项最困难的任务，它旨在通过边界框和分割面具定位图像中的对象实例，如 Figure 16.8 所示。由于实例分割能够通过视觉理解环境，其应用场景广泛，吸引了机器人领域的研究者增多。实例分割可帮助机器人获取环境的高层语义信息，并与几何感知方法结合，实现更复杂的交互，如导航和抓取。\n\
  \n![Figure 16.8 Results of instance segmentation on the COCO test set. Bounding\
  \ boxes, classes, and confidences are also displayed, along with colored masks.](img/fig16_8_B.jpg)\n\
  \nFigure 16.8 Results of instance segmentation on the COCO test set. Bounding boxes,\
  \ classes, and confidences are also displayed, along with colored masks.\n\n然而，移动机器人必须在受限空间中移动，因此其体积和重量有最小限制，导致其\
  \ onboard 资源（包括计算、内存和电池容量）在某些特殊场景（如灾害救援、森林保护和家务清洁）中受限。移动机器人在日常生活中的广泛应用受到高性能 CPU\
  \ 成本巨大的制约，这些机器人无法承担实例分割技术所需的大量计算和数据需求。\n\n将实例分割网络的部分计算卸载到云端是一种有前景的方法，如 Figure 16.9\
  \ 所示。这样，移动机器人可以利用强大的云端资源加速网络执行。移动机器人会并行处理数据，去除不必要的信息，提取关键元素，从而加快数据传输并提高数据安全性 \\\
  [16, 17\\]。\n\n![Figure 16.9 Computation offloading strategy for the instance segmentation\
  \ network \\[15\\].](images/fig16_9_B.jpg)\n\nFigure 16.9 Computation offloading\
  \ strategy for the instance segmentation network \\[15\\].\n\n##### 16.4.2.2.1 Methodology\n\
  \n可以将实例分割网络建模为有向无环图 `G` = <`M`, `D`\\>，其中节点 `M` = {`m`[1], `m`[2],..., `m`[K]} 代表若干网络模块，例如后骨网络用于提取基础特征，其他功能模块用于执行分类或分割任务。此外，后骨网络可以细分为若干卷积层，每个卷积层作为独立模块。在实例分割网络中，需要将两个并行组件合并为一个模块，且所有模块必须是顺序的。图的边\
  \ `D` = {`d[ij]` = (`m`[i], `m`[j])|`m`[i], `m`[j]∈`M`} 表示不同模块之间的数据传输，边的长度 |`d[ij]`|\
  \ 反映了从 `m`[i] 到 `m`[j] 传输的数据量。\n\n##### 16.4.2.2.2 Time Cost Model\n\n前面所述的有向无环图中的每个模块可以部署在移动机器人或云端平台上，硬件配置决定其运行速度（如\
  \ CPU、GPU 和内存）。在移动机器人上，模块的执行时间 tr 通常远大于在云端平台上 tc 的执行时间。机器人到机器人传输（R2R）和机器人到云端传输是两种数据传输方式（R2C）。在\
  \ R2C 模式下，数据传输时间 t(d, R2C, B) 取决于数据体积和通信带宽 B，其中 B 假设在 R2R 模式下的传输时间可忽略（即 t(d, R2R)\
  \ = 0）。\n\n完整实例分割网络的时间成本可表示为 (16.8)，包括模块执行时间 t[exec] 和数据传输时间 t[trans]。\n\n(16.8)\
  \  \n\n```math\nt\\_{total} = \\\\sum\\\\limits\\_{m \\\\in M\\_{R}}t\\_{r}(m) +\
  \ \\\\sum\\\\limits\\_{m \\\\in M\\_{C}}t\\_{c}(m) + t(d,R2C,B)\n```\n\n我们考虑三种场景：(1)\
  \ 部分模块在云端运行；(2) 所有模块在云端运行；(3) 所有模块在移动机器人上运行。\n\n第一种场景下，模块执行时间可由公式 (16.9) 计算，其中 M[R]\
  \ 表示在移动机器上处理的模块集合，M[C] 表示在云端执行的模块集合。数据传输时间可由公式 (16.10) 计算，其中 d 是移动机器处理模块后的中间结果。因此，(16.11)\
  \ 可用于表示整体时间成本：\n\n(16.9)  \n\n```math\nt\\_{exec} = \\\\sum\\\\limits\\_{m \\\\\
  in M\\_{R}}t\\_{r}(m) + \\\\sum\\\\limits\\_{m \\\\in M\\_{C}}t\\_{c}(m)\n```\n\n\
  (16.10)  \n\n```math\nt\\_{total} = \\\\sum\\\\limits\\_{m \\\\in M\\_{R}}t\\_{r}(m)\
  \ + \\\\sum\\\\limits\\_{m \\\\in M\\_{C}}t\\_{c}(m) + t(d,R2C,B)\n```\n\n(16.11)\
  \  \n\n```math\nt\\_{total} = \\\\sum\\\\limits\\_{m \\\\in M\\_{R}}t\\_{r}(m) +\
  \ \\\\sum\\\\limits\\_{m \\\\in M\\_{C}}t\\_{c}(m) + t(d,R2C,B)\n```\n\n\n\n\n-\
  \   [第二种场景中的模块执行时间](https://wiki.example.org/feynmans_learning_method)可以通过 (`16.12`)\
  \ 估算，其中 *M* 表示实例分割网络中的所有模块。数据传输时间也可以通过公式 (`16.10`) 估算，其中 *d* 表示传感器生成的原始图像或视频数据。因此，总时间开销可以表示为\
  \ (`16.13`):\n\n```\n(16.12)  \n\n$$t\\_{exec} = \\\\sum\\\\limits\\_{m \\\\in M}t\\\
  _{c}(m)$$\n```\n\n(16.13)  \n\n$$t\\_{total} = \\\\sum\\\\limits\\_{m \\\\in M}t\\\
  _{c}(m) + t(d,R2,CB)$$\n```\n\n在最终场景中，移动机器人执行整个实例分割网络，总时间成本为 (`16.14`):\n\n```\n\
  (16.14)  \n\n$$t\\_{total} = \\\\sum\\\\limits\\_{m \\\\in M}t\\_{r}(m)$$\n```\n\
  \n### 16.4.2.2.3 能耗模型\n\n由于移动机器人的电池容量有限，且能耗对机器人的待机时间影响显著，本文仅考虑移动机器人的能耗。相比之下，云系统拥有恒定的电源，可无论特定进程消耗多少能量都能持续运行。在实例分割网络执行期间，数据传输能耗\
  \ *E*[trans] 和模块执行能耗 *E*[exec] 如 (`16.15`) 所示，共同构成移动机器人的能耗。\n\n```\n(16.15)  \n\n\
  *E*[*r**o**b**o**t*] = *E*[*e**x**e**c*] + *E*[*t**r**a**n**s**]\n```\n\nSection\
  \ 16.4.2.2.2 中描述的三种情况也被考虑在内。第一种场景的能耗可通过 (`16.16`) 估算，其中 *C*(*m*) 表示机器人执行模块 m 时的电池消耗，*C*(*d*)\
  \ 表示机器人向云传输数据 *d* 时的电池消耗。电池使用量以 *mAh* 计量，1 mAh = 0.001A × 3600 s，即 3.6 A。第二种场景仅因数据传输产生能耗，可通过\
  \ (`16.17`) 计算。第三种场景中，所有模块均在移动机器人上运行，不使用云资源，因此 *E*[trans] = 0。于是能耗可通过 Equation (`16.18`)\
  \ 估算:\n\n```\n(16.16)  \n\n$$E\\_{robot} = \\\\sum\\\\limits\\_{m \\\\in M\\_{R}}3.6\
  \ \\\\ast (C(m) \\\\ast U + C(d) \\\\ast U)$$\n```\n\n(16.17)  \n\n*E*[*r**o**b**o**t*] = 3.6 * C*(*d*) * U\
  \  \n\n(16.18)  \n\n$$E\\_{robot} = \\\\sum\\\\limits\\_{m \\\\in M}3.6 \\\\ast\
  \ C(m) \\\\ast U$$\n```\n\n主要待解决的问题是如何将实例分割网络的计算卸载到云端，以借助云实现移动机器人上的实时实例分割。基于上述公式，卸载问题可简化为在有向无环图（DAG）中选择哪些节点在移动机器上执行、哪些节点在云平台上执行，以最小化整个实例分割的时间和能耗成本，如\
  \ (`16.19`) 所示：\n\n```\n(16.19)  \n\n$$\\\\min\\\\limits\\_{M\\_{R},M\\_{C}}\\\\\
  alpha t\\_{total} + \\\\beta E\\_{robot}.$$\n```\n\nYolact 结果如 表 16.7 所示。可以看出，我们的部分卸载策略在最短时间内（约一秒）完成一帧推理，而完全卸载则可能需要长达\
  \ 15 秒。我们还展示了每个 Yolact 模块的时间开销，其中 C1、C2、C3、C4、C5 表示构成后骨网络的五个块，FPN 为特征金字塔网络，Proto\
  \ + Pred Head 表示两个并行子任务（即创建原型掩码和预测掩码系数），Detect 为检测阶段结束后的若干后处理步骤。发现部分卸载显著降低了 C2、C3+C4+C5、FPN、Proto+Pred\
  \ head、Detect 的时间开销，这归因于这些模块已卸载至云端，其执行时间远快于在移动机器上运行。\n\nTable 16.7 The Average Time\
