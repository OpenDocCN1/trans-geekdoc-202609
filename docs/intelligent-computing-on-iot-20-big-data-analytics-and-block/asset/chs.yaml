  _{2}^{(\\\\mathbf{1})}A\\_{2} = \\\\mathbf{0}} \\\\\\\\ {y\\_{i - 0}^{(\\\\mathbf{1})}A\\\
  _{0} + y\\_{i}^{(\\\\mathbf{1})}A\\_{1} + y\\_{i + 0}^{(\\\\mathbf{1})}A\\_{2} =\
  \ \\\\mathbf{0},i \\\\geq 2,} \\\\\\\\ \\\\end{array} $$  \n\nand the normalizing\
