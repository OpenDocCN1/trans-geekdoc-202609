  \ IoT.\n\nFigure 12.3 展示了从 2004 年 1 月到 2022 年 2 月在谷歌搜索引擎中“IoT”搜索趋势。我们可以观察到大约十年内没有大幅上升，但从\
  \ 2015 年起呈上升趋势。同样，我们还尝试了“医疗 IoT”这一术语，以通过谷歌搜索趋势分析最近的 MIoT 发展情况。\n\n![Figure 12.3\
  \ Search trend of the term IoT.](img/fig12_3_B.jpg)\n\nFigure 12.3 Search trend\
  \ of the term IoT.\n\nFigure 12.4 展示了“MIoT”搜索趋势。由于初期的波动不确定，我们无法从 2004 到 2009 年得出结论或提供任何实质性推理。自\
  \ 2010 年起，数据线保持稳定，并呈现出低缓慢上升的趋势。我们可以预期 MIoT 的重要性正在逐步被认可。因此，该领域需要更多的研究和探索。MIoT 采集医疗数据，在医疗领域，及时准确的数据至关重要，这可能在生死之间起到决定性作用。MIoT\
  \ 设备可用于心脏病患者，帮助他们避免即将发生的心脏病发作。设备可以感知心率及其他相关变量，在发出警报的同时向医院发送提醒，以便在严重损伤发生前采取行动。老年人跌倒也是近年来备受研究关注的重要问题。研究人员转向\
  \ MIoT 设备，因为它们可以在检测到血糖或氧气水平后感知患者可能跌倒，并发送提前警报，使患者在时间尚未到来前坐下或躺下。MIoT 设备的几个关键需求包括低延迟、足够的带宽以满足所需场景、安全性以及隐私保护。\n\
  \n![Figure 12.4 Search trends of the term MIoT.](img/fig12_4_B.jpg)\n\nFigure 12.4\
  \ Search trends of the term MIoT.\n\nTable 12.1 列出了 MIoT 通信技术在数据速率、覆盖范围和工作频率方面的特性。根据患者的健康状况和场景，这些通信技术可供选择。MIoT\
  \ 还包括可穿戴设备，通过 Wi‑Fi、蓝牙或两者结合的通信技术监测心率并发送/接收数据。此类技术在创建患者监测环境方面发挥着重要作用，因为蓝牙的覆盖范围较短，而\
  \ Wi‑Fi 能够在更远距离传输信号，相比蓝牙。如果范围和快速传输是关键因素，则可以构建 mesh 网络环境，使患者在日常活动中进行，监测系统能够收集医疗数据。\n\
