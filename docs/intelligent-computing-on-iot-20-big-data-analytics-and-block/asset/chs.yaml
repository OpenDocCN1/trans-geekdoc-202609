  \nEdge computing technology is one of the most important computing technologies,\
  \ which aims to process and analyze industrial data at the edge of the network near\
  \ the industrial site to meet the requirements of practical applications, including\
  \ real-time performance, low device energy consumption, and data security ```18,\
  \ 19 and 20```. Edge computing technology changes the paradigm of traditional manufacturing.\
  \ In recent decades, the domestic and foreign industries have developed various\
  \ edge computing architectures and models. In 2014, the European ETSI established\
  \ the Mobile Edge Computing Standardization Working Group (MEC). In 2015, the OpenFog\
  \ computing consortium (OFC) performed research on OpenFog architecture and computing\
  \ models. The Domestic Edge Computing Industry Alliance and the Industrial Internet\
  \ Industry Alliance jointly released the white paper “Edge Computing Reference Architecture\
  \ 3.0” and more than 20 edge computing test beds. In terms of standard formulation,\
  \ in 2020, the international standard of “Edge Computing Requirements and Capability\
  \ Requirements”(ITU-TY.4208) promoted by China Unicom and other standards in ITU-T\
  \ SG20 were officially released. Concurrently, the international standard of “Edge\
  \ Computing Gateway” was steadily advancing. In October 2016, the IEEE/ACM Symposium\
  \ on Edge Computing was officially established by IEEE and ACM. The Edge Computing\
  \ Gateway formed an academic forum jointly recognized by academia, industry, and\
  \ government (National Foundation of the United States). In 2017, Shenyang Institute\
  \ of Automation, Chinese Academy of Sciences, led the establishment of the Edge\
  \ Computing Committee of the Chinese Association of Automation. At Microsoft’s 2018\
  \ Annual Developer Conference, Microsoft released “Azure IoT Edge” and other Edge\
  \ products, which shifted its business focus from the Windows operating system to\
  \ intelligent Edge computing. Concurrently, Amazon released its “AWS Greengrass”\
  \ edge-side software that seamlessly extends AWS cloud services to devices. Ali\
  \ Cloud announced that in 2018, it will strategically invest in the field of edge\
  \ computing technology and launch the Edge computing product Link Edge.\n\nThe advantages\
  \ of edge computing include the following three aspects:\n\n1.  The gateway on the\
  \ edge side offers a variety of interfaces and protocols to field devices, which\
  \ can solve the problem of network connections and communication among field devices,\
  \ and integrate and converge a lot of data from different devices and sensors.\n\
  \n2.  Business data can be uploaded to the cloud and can be processed at edge servers\
  \ in real time, which markedly reduces the data transmission delay and network bandwidth\
  \ consumption and ensures data security.\n\n3.  Edge computing is based on intelligent\
  \ distributed architectures and platforms. System operation and maintenance personnel,\
  \ decision-makers, and developers can cooperate with each other through the edge\
  \ computing system.\n\n### 16.5.1 Industrial Vision\n\n\n\n\n工业视觉用于控制和监控生产流程，包括自动检测、工件加工和装配自动化，如图\
  \ 16.10 所示。工业视觉主要取代人工检测，降低企业的人工成本，提高检测效率和精度。具体而言，生产线的 4K、8K 等高清摄像机采集大量图像信息，这些信息必须进行处理和分析以支持实时反馈控制。在工业场景中，这些图像数据通常需要\
  \ 5–150 Mbps/300 Mbps 的大带宽用于成像数据回传，以及 20–50 ms 的低延迟用于 PLC 控制反馈。因此，5G+ 边缘计算可作为工业视觉的有希望解决方案。图像信息通过\
  \ 5G 的高上行带宽传输，满足工业视觉对大带宽的需求。在边缘计算平台上部署机器视觉 AI 算法，可实现生产线的实时智能检测。此外，还需与云端合作进行大数据存储和\
  \ AI 算法训练。\n\n```\n![Figure 16.10 Industrial vision.](img/fig16_10_B.jpg) \nFigure\
  \ 16.10 Industrial vision.\n```\n\n### 16.5.2 AR 远程协助\n\nAR 远程协助可支持员工学习、培训和沟通；提供操作演示和指导；提醒生产流程注意事项和操作细节，如图\
  \ 16.11 所示。工人所感知的场景直接传输给技术人员，技术人员可通过视频、语音、标记等交互方式直接指导工人。AR 应用旨在让用户感觉身临其境。如果图像渲染速率跟不上用户移动速度，画面会出现错位，导致用户体验差。因此，AR\
  \ 远程协助也必须确保低延迟和实时处理。边缘计算结合 5G 可实现此目标，具备转码、渲染、3D 重建、目标识别和 AR 内容管理等多种能力。\n\n```\n\
  ![Figure 16.11 AR remote assistance.](img/fig16_11_B.jpg) \nFigure 16.11 AR remote\
  \ assistance.\n```\n\n### 16.5.3 远程驾驶\n\n近年来，远程驾驶在工业场景中的应用日益增多，如钢铁厂起重机远程驾驶和地下矿山卡车远程驾驶，如图\
  \ 16.12 所示。通常，监控屏幕和控制设备部署在中央控制室，执行器（即卡车或起重机）部署在工业现场。该场景要求精确控制和低服务延迟（通常小于 20 ms）。边缘计算同样可作为远程驾驶应用的有希望解决方案。\n\
  \n```\n![Figure 16.12 Remote driving.](img/fig16_12_B.jpg) \nFigure 16.12 Remote\
  \ driving.\n```\n\n### 16.5.4 AI 视频监控\n\nAI 视频监控应用范围广泛，包括园区办公监控、仓库监控、园区出入监控、异常生产线设备、操作员行为、是否佩戴安全头盔、车间人员是否按规定路线行走等，如图\
  \ 16.13 所示。除安全监控外，还需识别生产线设备和操作员在生产过程中的异常行为，提升生产线的安全性和可靠性，并确保关键操作不被遗漏。在这些场景中，实时数据分析和数据隐私至关重要。通过边缘计算，视频监控在现场部署以记录操作员的行为，数据随后传输到边缘计算平台并实时分析，以确保生产安全和质量。\n\
  \n```\n![Figure 16.13 AI video surveillance.](img/fig16_13_B.jpg) \nFigure 16.13\
  \ AI video surveillance.\n```\n\n### 16.5.5 UAV 检查\n\nUAV 检查广泛用于智能物流、智能公园、设备检查等领域，用于保障人员、财产、公共安全和防火安全，如图\
  \ 16.14 所示。UAV 将摄像机视频（可见高清、红外等）实时传输到工厂综合控制中心。通过对视频的智能分析（如目标识别和模式识别），控制中心可判断检查地点是否存在安全异常或火灾警报，并实现智能警报，以最大程度降低安全人员的日常工作强度。遗憾的是，大多数前端设备仅具备感知和简单处理能力，无法进行密集的智能分析计算。数据必须传输到数据中心进行处理。视频分析和处理服务部署在靠近感知设备的\
  \ MEC 平台上。UAV 摄像机采集的数据通过 5G 基站传输到 MEC 平台进行本地分析和预处理，这可以降低核心网络和骨干网络的带宽占用，并缩短总延迟。AI\
  \ 训练服务部署在云端数据中心，依赖云计算的强大计算能力训练数据并获得更精确的模型。5G 上行速率可达 200 Mbps，能够支持 4K、8K 甚至全景视频传输。5G\
  \ 毫秒级的低延迟和高可靠性可有效保障 UAV 的精确控制和定位。\n\n```\n![Figure 16.14 UAV inspection.](img/fig16_14_B.jpg)\
  \ \nFigure 16.14 UAV inspection.\n```\n\n### 16.5.6 AGV 仓储物流\n\n自动导引车辆（AGV）是配备电磁或光学自动导引装置的车辆，能够沿预定路径安全行驶并具备载荷搬运功能。AGV\
  \ 系统是智能工厂的重要组成部分，实现从生产到制造全过程的自动化货物和材料运输以及可追溯的生产数据采集。在 AGV 仓储物流场景中，如图 16.15 所示，AGV\
