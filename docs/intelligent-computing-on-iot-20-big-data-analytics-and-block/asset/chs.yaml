  \ 0.625 msec 时间片用于数据传输。在分配的时间片上，采用频率跳变（FH），即每次数据传输时节点使用不同的信道。最后，采用时间分双工（TTD）技术，将每个时间片的可用时间分开并在这两部分之间共享上行和下行。\n\
  \n最新蓝牙版本的改进专门针对 BLE，包括数据传输速率翻倍，最高可达 2 Mbps \\[1\\]。另一个增强是通过前向纠错（FEC）技术提升范围，理论上在户外环境中可达\
  \ 500 米。最后，还有一项重要改进是扩大广告容量，因为可以使用全部 40 条可用信道来实现此目的。\n\n### 18.2.2 IEEE 802.15.4（Zigbee）\n\
  \nZigbee 的主要目标是创建低能耗、低复杂度、低运营成本但数据传输速率较低的短距离无线网络。Zigbee 网络由三类设备组成：坐标器和路由器，它们均为全功能设备（FFD），以及终端设备，它们为受限功能设备（RFC）\\\
  （图 18.2 a）#ch18.xhtml#fig18_2〕。坐标器的主要功能是通过发送蜂窝帧来同步网络，并选择网络操作参数，如信道选择和唯一网络标识。路由器的主要功能是转发设备之间的数据以扩展网络覆盖范围。坐标器和路由器通常由交流电源供电，因为它们需要一直保持唤醒。终端设备则由电池供电，其主要功能是收集并传输传感器的各类信息。它们不能在网络中中继信息，并且可以进入睡眠状态以节省能源。\n\
  \n![Figure 18.2 (a) Zigbee network and (b) Zigbee protocol stack.\n\nFigure 18.2 (a)\
  \ Zigbee network and (b) Zigbee protocol stack.\n\nZigbee 协议栈包含四层，其中物理层和 MAC 层在\
  \ IEEE 802.15.4 标准中定义，而网络层和应用层在 Zigbee 联盟发布的规范中定义\\[（图 18.2 b）#ch18.xhtml#fig18_2〕。物理层负责辅助信道选择的多项任务，如链路质量估计、能量检测测量和信道空闲判定。可用的工作频段有三个：868 MHz（1\
  \ 条信道，20 Kbps，采用 BPSK 调制），915 MHz（10 条信道，40 Kbps，采用 BPSK 调制）以及 2.45 GHz（16 条信道，250 Kbps，采用\
  \ O‑QPSK 调制）。MAC 层作为物理层和网络层之间的接口。它使用四种帧结构：Beacon、Data、Acknowledge 和 MAC command。它支持两种中访问方式：第一种是蜂窝启动式，设备同步并可在预定时间片中通过争用传输；同时支持通过坐标器分配的保证时间片实现无争用时期。第二种是非蜂窝式，设备未同步，因而没有无争用时期和保证时隙。非蜂窝方式能够提升终端设备的能源效率，因为它们在睡眠模式下的时间更长，而蜂窝启动式方式则提高网络的可靠性。\n\
  \n网络层位于应用层和 MAC 层之间。其主要功能是形成网络并在这网络内部路由信息。使用的拓扑结构有星形、树形和网状。应用层根据 Zigbee 规范划分为三个子层。应用框架子层通过控制\
  \ Zigbee 设备硬件的软件管理其他层；ZigBee 设备对象子层负责服务发现、安全性和绑定；应用支持子层则作为网络层和应用层之间的接口。\n\n### 18.2.3\
  \ Z‑Wave\n\nZ‑Wave 于 1999 年出现，是一种专注于智能家居内部连接的无线协议。它是低功耗的 Wi‑Fi 替代方案，但其覆盖范围远大于蓝牙。Z‑Wave\
  \ 网络的覆盖距离可以通过让节点转发和中继消息、借助路由表实现。协议规定源节点和目的节点之间的最大距离为 4 跳，以在扩展范围和网络可靠性之间取得平衡。Z‑Wave\
  \ 设备的工作频段取决于使用所在国家：美国使用 908.40 MHz、908.42 MHz 和 916 MHz；英国和欧洲使用 868.40 MHz、868.42 MHz\
  \ 和 869.85 MHz。\n\nZ‑Wave 网络的节点分为三类基本类别，依据协议提供的任务和功能划分。第一类是单一的主控节点，它负责维护网络的路由表，并能与网络中每个节点通信。主控节点的其他重要任务包括将节点加入或移出网络，以及为网络节点分配角色（次级控制器、从属节点）和\
  \ ID。次级控制器节点功能与主控节点相同，只是不能加入或移出节点。从属节点不维护路由表，可以在永久供电时充当中继器；如果从属节点使用电池供电，则在形成路由表的过程中会被从中央控制器中排除。根据分配的功能，从属节点可以拥有不同的角色，如路由从属节点、频繁监听路由从属节点或增强从属节点。\n\
  \n协议栈包含物理层、MAC 层、网络层和应用层。物理层定义调制参数，提供三种可选方案：最保守的方案传输速率为 9.6 Kbps，第二种为 40 Kbps，最激进的方案为\
  \ 100 Kbps。MAC 层定义的中访问机制是基于碰撞避免和退避算法的争用方式，同时支持每网络最多 232 个节点以及低功耗模式。网络层的其他功能是通过重传、确认和认证机制确保传输可靠性，并定义四种基本帧类型：单播、确认、组播和广播。最后，应用层负责解码并向节点提供一些网络管理功能。\n\
  \n\n\n\n-   [Wi‑Fi 技术](https://wiki.example.org/feynmans_learning_method)基于 IEEE\
  \ 802.11 协议，是无线接入网络中连接最广泛的方式。该技术的普及既得益于它为终端用户和设备提供的简便连接，也得益于其在物理层和 MAC 层持续演进的技术。\n\
  \n-   这种演进使得传输速率从 Mbps 级别提升至 Gbps 级别，同时提升了可靠性、能效以及根据应用需求动态适配的安全性。\n\n-   在 IEEE\
  \ 802.11 中，一个站点可以是接入点（AP）或终端设备（客户端）。基本服务集（BSS）是一组在物理层进行通信的站点，依据工作模式可分为基础设施模式（设备通过\
  \ AP 与其他设备通信）或自组网模式（设备在对等基础上直接通信）。此外，BSS 之间还可以通过分布式系统（distribution system）实现扩展服务集（ESS），该系统连接各\
  \ BSS 的 AP。\n\n-   IEEE 802.11 包含两层：数据链路层和物理层。数据链路层由两个子层组成：链路逻辑控制（LLC），为上层提供接口并执行基本链路层功能，如错误控制和流量控制；MAC\
  \ 层定义了两种信道访问方法。第一种是分布式协调功能（DCF），采用二进制指数退避的载波监听多访问与碰撞避免（CSMA/CA）。CSMA/CA 是“先听后说”的访问机制，要求每次传输后都收到确认帧。另一种是可选协调功能（CCF），由集中式\
  \ MAC 算法通过轮询移动设备实现无争用的服务。\n\n-   802.11 的工作频段为 2.4 GHz 和 5 GHz，物理层定义的信道带宽可达 160 MHz，并规定了调制编码方案等传输细节。\n\
  \n-   该协议的最新修订是 802.11.ax，亦称高效（high efficiency），主要针对因大规模部署 Wi‑Fi 网络导致的拥塞问题，该问题因重叠\
  \ BSS 的同频干扰而降低整体性能 \\[2\\]。主要改进包括：通过引入激进的 1024 QAM 调制更好地利用可用频谱资源；采用正交频分复用（OFDMA）技术为不同子载波独立调制；以及在\
  \ MAC 层引入先进的算法和技术，提升可用频谱的空间复用能力。为提升能效，新修订还加入了延长睡眠状态的机制，以降低终端设备的功耗。\n\n### 18.2.5\
  \ Mesh Networking for IoT\n\n-   物联网（IoT）网络需要服务的场景多样，导致技术种类呈现出极大的异质性。常见的拓扑结构是树形和星形，其中设备拥有预定义的层级角色。例如，某些设备负责收集信息，其他设备则转发或处理信息，形成集中式网络模型。然而，随着\
  \ IoT 应用的演进，更复杂的网格（mesh）拓扑结构变得必要，能够根据流量条件动态调整。网络设备也不能预先固定角色，必须根据具体情况承担不同任务。网格 IoT\
  \ 网络的主要优势包括：降低安装和维护成本、动态分配网络负载、提高对故障的容错能力、以及能够随需求改变拓扑结构 \\[3\\]。\n\n-   网格 IoT 网络的关键操作是路由，分为主动（proactive）和反应（reactive）两类。主动协议的特点是每个网络节点为所有可能的路径维护、更新路由表。由于路由表大小受限，这种路由协议更适合小型网络。反应协议则不预先创建路由表，只有在收到特定请求时才建立路径，路由过程包括路径发现和维护，基于泛洪（flooding）实现。\n\
  \n-   优化链路状态路由（OLSR）是一种主动路由协议。其工作原理是所有网络节点周期性地向邻居发送链路状态信息，以维护路由表。其主要的泛洪策略是将拓扑控制报文的转发责任分配给特定的邻居节点\
  \ —  — 多点中继（MPR），从而减少不必要的泛洪传输。算法在选择 1‑hop MPR 节点时，确保覆盖所有 2‑hop 邻居节点。Figure 18.3\
  \ 展示了从节点 A 到节点 B 选择的 MPR 节点，用于转发拓扑控制报文。\n\n![Figure 18.3 Selection of multipoint\
  \ relay nodes by the optimized link state routing protocol.](img/fig18_3_B.jpg)\n\
  \nFigure 18.3 Selection of multipoint relay nodes by the optimized link state routing\
  \ protocol.\n\n-   动态源路由（DSR）是一种反应协议，按需工作。它不依赖中间节点维护路由表，而是使用源路由技术，无需周期性的路由广播。协议包含两大功能：第一是路径发现，当节点缓存中不存在目的节点的路径时触发；第二是路径维护，当缓存中的路径失效时激活。\n\
  \n### 18.3 Long-range Networks\n\n-   低功耗宽带（Low Power Wide Area Networks，LPWAN）是专为机器类型通信（MTC）设计的无线网络，旨在提供低成本、高能效、长通信距离，以牺牲更低带宽为代价。文献中大多数将\
  \ LPWAN 归类的网络在技术上已趋于统一，具备以下基本技术要求，使其区别于其他网络技术 \\[4\\]：\n\n  * *能效*：鉴于大规模 IoT 设备部署且往往缺乏持续电源，LPWAN\
  \ 设备必须支持约十年甚至更长的电池寿命。\n\n  * *覆盖范围*：LPWAN 的目标覆盖范围从城市区域的几公里到农村区域的数十公里不等。\n\n  * *可扩展性*：LPWAN\
  \ 必须能够支撑大量设备，每个基站至少支持几万台设备。\n\n  * *低成本*：为满足上述范围和可扩展性需求，LPWAN 网络及其应用的部署成本必须保持较低。单个\
  \ LPWAN 设备的目标成本控制在几美元以内，年费不超过 1 USD。\n\n\n\n\n一些网络，特别是蜂窝物联网（cellular IoT）网络，使用授权频谱，而其他网络则使用\
  \ ISM 波段进行通信，这凸显了干扰管理的必要性。为降低信道噪声和干扰的影响，采用了两种主要的调制方式：窄带和扩频。许多 LPWAN 中（但并非全部）的常见技术包括在子\
  \ GHz 频段上进行网络运行，以在牺牲数据速率的前提下增加通信距离，以及让设备在睡眠模式中长时间保持关闭，以实现设备的长寿命。\n\n长距离物联网网络的一般架构由一系列基站天线组成，这些天线连接到核心网络服务器并为物联网设备提供覆盖。因此，基站充当设备与核心网络之间的中继，设备之间无需直接通信。核心网络负责处理物联网设备之间的通信以及与各种物联网应用和用户的交互。该架构如图\
  \ 18.4 所示。\n\n![Figure 18.4 General architecture of a long-range IoT network.](img/fig18_4_B.jpg)\n\
  \nFigure 18.4 General architecture of a long-range IoT network.\n\n### 18.3.1 IEEE\
  \ 802.11ah (Wi‑Fi HaLow)\n\nIEEE 802.11ah 标准，亦称 Wi‑Fi HaLow，是面向物联网的子 GHz Wi‑Fi 规范。与传统\
  \ Wi‑Fi 相比，Wi‑Fi HaLow 的设计目标是低功耗、更高的节点密度以及更大的通信距离。Wi‑Fi HaLow 网络采用星/树状结构，中心接入点（AP）充当网关，设备与之关联。为提升覆盖范围，802.11ah\
  \ 支持使用继电节点，继电节点关联到根 AP，并可作为其他设备的 AP 使用。\n\n在物理层，IEEE 802.11ah 采用 OFDM，运行在子 GHz ISM\
  \ 波段，信道带宽可在 1 至 16 MHz 之间，理论上可覆盖约 1 km 并比传统 Wi‑Fi 更节能。标准规定了多种调制方案，提供灵活的数据速率，范围从\
  \ 0.3 Mbit/s 到约 230 Mbit/s。因此，与其他 LPWAN 相比，Wi‑Fi HaLow 实现了更高的数据速率但通信距离较短。\n\n在 MAC\
  \ 层，对基于 CSMA/CA 的 Wi‑Fi 协议进行了多项调整，以支持大量设备并实现节能运行。与其他 Wi‑Fi 标准相同，网络信息通过周期性广播的 Beacon\
  \ 向活跃和潜在设备传输。为降低开销，提出了缩短头部长度的优化措施 \\[5\\]。\n\n为在关联阶段减少碰撞，定义了两种快速认证方案：集中式认证控制（Centralized\
  \ Authentication Control），在该方案中设备在碰撞减少前会被随机排除在关联过程之外；分布式认证控制（Distributed Authentication\
  \ Control）则是一种退避（backoff）机制。为管理密集部署中的碰撞，引入了受限访问窗口（Restricted Access Window，RAW），这是一种受限的争用协议，如图\
  \ 18.5 所示。在该协议中，设备被分组，空中时间被划分为若干间隔，部分间隔可预留给特定组别。在预留间隔期间，仅对应组别的设备才能争用信道，间隔采用时隙方式并按网络\
  \ ID 以轮询（round‑robin）方式分配，但不保证无碰撞 \\[6\\]。\n\n![Figure 18.5 Example of the Restricted\
  \ Access Window (RAW) protocol. The beacon frame (BCN) carries the RAW Parameter\
  \ Set (RPS), which specifies the timing and corresponding group information for\
  \ each RAW in the following Beacon Period. In each RAW, only the group of devices\
  \ in the corresponding group can access the channel. Each RAW is slotted, and the\
  \ slots are assigned evenly and pseudorandomly to devices in the corresponding group.](img/fig18_5_B.jpg)\n\
  \nFigure 18.5 Example of the Restricted Access Window (RAW) protocol. The beacon\
  \ frame (BCN) carries the RAW Parameter Set (RPS), which specifies the timing and\
  \ corresponding group information for each RAW in the following Beacon Period. In\
  \ each RAW, only the group of devices in the corresponding group can access the\
  \ channel. Each RAW is slotted, and the slots are assigned evenly and pseudorandomly\
  \ to devices in the corresponding group.\n\n流量指示图（TIM）机制是 IEEE 802.11 中用于在 Beacon\
  \ 帧中通过比特图（bitmap）广告待发下行流量的方法。在 Wi‑Fi HaLow 中，引入了 TIM 分段（TIM segmentation），即把比特图分段传输，从而缩短\
  \ Beacon 时长，并允许设备跳过多次 Beacon 接收。另一种提升能耗的方法是 Target Wake Time（TWT），在此 AP 与设备协商延长的睡眠时间，在此期间无需接收\
  \ Beacon 帧。为管理邻近接入点之间的重叠，还引入了 BSS 着色（BSS coloring），在错误的接入点接收时提前终止接收。\n\n### 18.3.2\
  \ LTE‑M and NB‑IoT\n\n蜂窝物联网（Cellular IoT，CIoT）的目标是通过现有或新建的移动网络部署，支持物联网使用场景，有时在本文中称为大规模机器类型通信（mMTC）。mMTC\
  \ 的需求自 2015 年起已纳入 ITU 第五代移动通信愿景，相关 CIoT 技术自 3GPP Release 13（2015 年）起被提出并标准化。CIoT\
  \ 的主要挑战在于以成本效益的方式满足 IoT 要求，既能在现有网络上部署，也能在未来的第五代网络部署中使用。最重要的 CIoT 标准是 LTE‑M（也称 eMTC\
  \ – enhanced MTC）和 NB‑IoT，它们均于 3GPP Release 13 首次标准化并随后在后续版本中得到完善。该愿景是使这些标准逐步演进，最终满足\
  \ ITU 对 mMTC 的要求 \\[4\\]。\n\n两项关键的低功耗规范是电源节省模式（PSM）和增强不连续接收（eDRX），分别在 Release 12\
  \ 与 Release 13 中引入。在 PSM 中，用户设备（UE）可在不失联网络注册的情况下进入深度睡眠模式，从而降低功耗并减少重新连接网络的开销。在不连续接收（DRX）模式下，UE\
  \ 不是持续监听寻呼信令，而是按周期性、逐渐增大的间隔（最长约 10 秒）间歇性监听。eDRX 进一步将此间隔延长至数小时。\n\n\n\n\nNB-IoT 是基于修改后的\
  \ LTE 架构的长距离低功耗网络标准。它首次在 Release 13 中引入，移除了物联网不需要的若干 LTE 核心网功能，将调制方式限制为 QPSK 和 BPSK，并使用优化的信令程序，同时将上行数据速率限制在最高\
  \ 158 kbps。定义了一个新的硬件复杂度更低、成本更低的 UE 类别，Cat‑NB1。NB‑IoT 支持三种部署模式，如图 18.6 所示：在带内模式，为\
  \ Cat‑NB1 设备分配 LTE 资源块；在 guard band 模式，为 NB‑IoT 在 LTE guard band 中分配频谱；在独立模式，NB‑IoT\
  \ 频谱完全独立于 LTE 频谱，适用于回收的 2G 和 3G 运营商频段。Release 14 引入了功耗更低的发射功率类（14 dBm，取代之前的 20 dBm\
  \ 和 23 dBm 类）、增强定位、下行组播功能、传输速率提升以及新增的 UE 类别 Cat‑NB2。Release 15 的改进包括唤醒机制、支持与 5G\
  \ 新无线电（NR）和 LTE‑M 同时运行（这对长期部署可行性至关重要）以及其他多项优化。Release 16 和 17 进一步提升了吞吐量和功耗的协议优化\
  \ \\[7, 8\\]。\n\n![Figure 18.6 Illustration of NB-IoT deployment modes. In this\
  \ example, the standalone deployment is assumed to utilize reclaimed GSM spectrum.](img/fig18_6_B.jpg)\n\
  \nFigure 18.6 Illustration of NB-IoT deployment modes. In this example, the standalone\
  \ deployment is assumed to utilize reclaimed GSM spectrum.\n\nLTE‑M 面向更高性能的物联网应用，具备宽带类网络接入需求并支持较少的设备数量。因此，它为\
  \ NB‑IoT 及其他 LPWAN 提供互补而非竞争的方案，并且保持与 LTE 的向后兼容。它首次在 Release 13 中引入，并定义了 UE Cat‑M1，支持定位、语音和视频流传功能，峰值数据速率为\
  \ 1 Mbps。Release 14 进一步优化了能耗并增加了组播功能，定义了 UE Cat‑M2，上行速率可达 7 Mbps。\n\n另一项面向物联网应用的\
  \ 3GPP 规范是 EC‑GSM‑IoT。该标准利用现有的 GSM 和 GPRS 移动网络部署提供物联网连接服务。EC‑GSM‑IoT 的技术特性包括 20 dB\
  \ 的链路预算提升，以及 PSM 和 eDRX，数据速率在 GMSK 调制下可达 0.35–70 kbps，在 8PSK 调制下可达 240 kbps。\n\n\
  ### 18.3.3 LoRaWAN\n\nLoRaWAN 是由 LoRa Alliance 开发的 LPWAN 标准。它采用星状网络拓扑，包含三类设备：网络服务器（网络核心后端，连接互联网），终端设备（传感器/执行器\
  \ IoT 设备），以及网关（基站），它们负责中继终端设备与网络服务器之间的流量。尽管它在物理层使用专有的 LoRa 调制，网络架构和上层协议是开放标准。网络运行在亚\
  \ GHz ISM 频段，不同地区使用不同频率。由于 LoRaWAN 标准的开放性以及使用 ISM 频段，它既可以部署为公共网络服务，也可以部署为私有网络 \\\
  [9\\]。\n\n在物理层，LoRaWAN 采用 LoRa 调制（一种 chirp spread spectrum 方案）以及用于更高数据速率的 FSK 调制。扩频因子（spreading\
  \ factor）是一个物理层参数，控制数据速率与传输时长的权衡，使得在延长覆盖范围的同时会增加功耗。LoRaWAN 在亚 GHz ISM 频段上使用 125 kHz、250 kHz\
  \ 和 500 kHz 的信道。LoRaWAN 网关在城市区域可覆盖最高 5 km，农村地区的覆盖距离可达 45 km。传输速率范围为 0.3–37.5 kbps（LoRa）和\
  \ 50 kbps（FSK）。\n\n在 MAC 层，LoRaWAN 支持三种设备类，如图 18.7 所示。Class A 是最节能的类，设备通过随机接入在 TX\
  \ 窗口中上传数据，下行帧仅能在每次上传后打开的两个接收窗口（RX1、RX2）中接收，因此设备只能在发送上行消息后才能收到服务器的消息。Class B 的设备通过定时的信标帧（BCN\
  \ frame）与网络同步，并在信标的随机偏移处打开额外的下行接收窗口（class B RX windows），从而缓解 Class A 的下行限制。Class C\
  \ 的设备始终保持接收状态。\n\n![Figure 18.7 Illustration of LoRaWAN channel access modes for\
  \ each device class.](img/fig18_7_B.jpg)\n\nFigure 18.7 Illustration of LoRaWAN\
  \ channel access modes for each device class.\n\n### 18.3.4 SigFox\n\nSigFox 是由\
  \ SigFox Corporation 开发并运营的专有 LPWAN 标准。系统包括 IoT 设备、基站（BS）和核心网络。基站部署在覆盖范围内并通过互联网与核心网络相连。设备在通过注册管理员（Registration\
  \ Authority）关联到核心网络后，可通过基站与核心网络服务中心（Service Center）交换少量数据帧。服务中心随后向客户提供设备的数据和控制功能。\n\
  \nSigFox 通过以下设计特性实现低功耗与长距离传输：在物理层，网络运行在亚 GHz 非授权 ISM 频段，通信通过 100 Hz 或 600 Hz 的超窄带（UNB）信道进行，这既降低了白噪声的影响，也将数据速率降至\
  \ 100 bps 或 600 bps，同时延长传输时长至 2 s，并增加频段内的信道数量。使用差分相位移键控制（D‑BPSK）和高斯频移键控制（GFSK）调制，可降低硬件复杂度。\n\
  \n在 MAC 层，接入方式为随机接入，不提供同步选项。为提高网络可靠性，每帧在随机选取的信道和时间偏移上重复发送三次，并由多个基站接收，以通过时间、频率和空间多样性重构原始传输。此策略分别称为时间、频率和空间多样性。通信可单向或双向进行；双向通信仅在上行传输后、在预定延迟打开的接收窗口内进行，在此期间接收下行帧并由设备确认。由于\
  \ UNB 物理层与 MAC 层多样性策略的组合，SigFox 基站在城市区域可覆盖最高 10 km，农村区域可覆盖最高 50 km \\[10\\]。\n\n\
  ## 18.4 Comparative Analysis\n\n\n\n\n选择物联网（IoT）领域中使用的技术至关重要且充满挑战。尽管已经部署了大量基于相似原理的无线技术，能够满足\
  \ IoT 概念，但每种技术都有其自身的特点、优势和劣势。因此，并非所有无线技术都适用于所有 IoT 应用。本节以 Sections 18.2 和 18.3 中介绍和讨论的短距离和长距离网络技术为基准，对\
  \ **延迟、能耗、成本、QoS 等** 进行对比。随后，会先对无线技术进行比较，再根据特定 IoT 应用场景确定合适的无线技术。\n\n短距离和长距离网络技术的主要特性如\
  \ Table 18.1 所示。短距离技术方面，Wi‑Fi 最初是为在小范围内提供高吞吐量、面向少量设备而设计，且对能耗没有特殊要求；这类设备通常位于室内且距离较近。因此，Wi‑Fi\
  \ 及其变体并不特别适合所有 IoT 应用，尤其是需要低功耗或长距离覆盖的场景。为满足低功耗 IoT 要求，市场已引入 **BLE、ZigBee、Z‑Wave**\
  \ 等技术和标准。BLE 与 ZigBee 例如是低成本、功耗显著低于 Wi‑Fi 的技术，但覆盖距离仅约 100 米。数据速率方面，BLE、Z‑Wave、ZigBee\
  \ 均低于 1 Mbps，适合带宽需求小、流量受限的设备。因此，对于需要部署少量节点且流量较大的 **家庭自动化** 等 IoT 应用，**Wi‑Fi 802.11\
  \ 系列** 更为合适。根据 \\[11\\]，ZigBee 可支持规模较大的网络（数百个节点），而 Wi‑Fi 和 BLE 分别支持中等和少量设备。\n\n\
