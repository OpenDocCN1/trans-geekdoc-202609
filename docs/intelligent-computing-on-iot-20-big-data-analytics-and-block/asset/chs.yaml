  \ || 1 |\n|  ||  || *t*[32] || 1 |\nThe two large classrooms are modelled by *p*[1]\
  \ and *p*[2]. The three small classrooms are modelled by *p*[3], *p*[4], and *p*[5].\
  \ The model works as follows: Consider a student in the large classroom R1 (*p*[1]).\
  \ They might walk out of the room through the left door (*t*[1] fires and *p*[6]\
  \ gets a token) or the right door (*t*[2] fires and *p*[7] gets a token). Assume\
  \ they take the right door. When they move out of the door, they have the option\
  \ to turn left (*t*[10] fires and *p*[12] gets a token) or turn right (*t*[11] fires\
  \ and *p*[19] gets token). Assume they turn right. The token in *p*[19] triggers\
  \ the transition *t*[31]. Firing of *t*[31] injects a token to *p*[20] that triggers\
  \ *t*[32], and then *t*[33], *t*[34], and *t*[35], and eventually the place ExitRight\
