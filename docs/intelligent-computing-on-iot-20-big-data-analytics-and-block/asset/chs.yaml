  \ 是由 θ 参数化的策略。 |\n| *μ*(*s*) || 确定性策略；我们也可以把它标记为 *π*(*s*)，但使用不同的字母可以更好地区分随机策略和确定性策略，从而无需进一步解释即可判断策略的类型。无论是\
