  \ in the form of a Pie Chart.\n\n## 21.4 Proposed Methodology\n\n### 21.4.1 Machine\
  \ Learning Methodologies and Prediction Techniques: Model Training\n\nThe process\
  \ of training a model on a collection of data so that it can make predictions or\
  \ judgements based on fresh data is known as machine learning. Several steps are\
  \ involved in the model training process:\n\n1.  Data collection: The first stage\
  \ in model training is to collect data relevant to the situation at hand.\n\n2.\
  \  Data cleaning and preprocessing: Once the data has been acquired, it must be\
  \ cleaned and preprocessed to guarantee that it can be used by machine learning\
  \ algorithms.\n\n3.  Feature engineering is the process of identifying and developing\
  \ meaningful features from data that the machine learning model can use.\n\n4. \
  \ Model selection: To train a model, numerous machine learning techniques can be\
  \ utilized. The method you choose is determined by the problem you are attempting\
  \ to answer as well as the qualities of the data.\n\n5.  Model training: Once you’ve\
  \ decided on an algorithm, you must train it on data. This entails putting the data\
  \ into the algorithm and modifying the model’s parameters to optimize its performance.\n\
  \n6.  Model evaluation: The model must be tested against a set of test data after\
  \ it has been trained to ensure that it is reliable and accurate.\n\n7.  Model deployment:\
  \ Once the model has been trained and assessed, it may be put into production and\
  \ make predictions or judgements based on fresh data.\n\n### 21.4.2 Data Preprocessing\n\
  \nData preprocessing is an important stage in the data mining and assessment process\
  \ that includes turning raw data into an organized and standardized format that\
  \ computers and machine learning algorithms can readily comprehend and analyze.\
  \ Raw data in many forms, such as text and photos, is typically jumbled, with mistakes\
  \ and inconsistencies. Furthermore, the data is frequently inadequate and lacks\
  \ a clear and standard format. This data may be turned into a usable format for\
  \ accurate analysis and decision-making through preprocessing.\n\n### 21.4.3 Data\
  \ Visualization\n\nData visualization, or the depiction of data in graphical or\
  \ pictorial representations, is an important part of machine learning. It is an\
  \ effective tool for comprehending large datasets, recognizing patterns and trends,\
  \ and making data-driven decisions. In this chapter, we will look at the significance\
  \ of data visualization in machine learning, as well as the steps needed in developing\
  \ good visualizations.\n\nStep 1: Cleanup and Preprocessing of Data\n\nCleaning\
  \ and preparing the data is the initial stage in data visualization. This includes\
  \ deleting missing numbers, outliers, and other abnormalities that might degrade\
  \ the visualization’s quality. The data should be translated into a visually appealing\
  \ format, such as a table, matrix, or graph.\n\nStep 2: Choose the Best Visualization\
  \ Technique\n\nThe proper visualization approach must be used to deliver the intended\
  \ message to the audience. Scatter plots, line charts, bar charts, histograms, and\
  \ heatmaps are some of the visualization techniques accessible. The approach used\
  \ is determined by the type of data, the research topic, and the audience.\n\nStep\
  \ 3: Create the Visualization\n\nOnce the approach has been chosen, the visualization\
  \ should be devised to properly portray the information. This includes selecting\
  \ the appropriate colors, labels, titles, and comments to improve data comprehension.\
  \ The visualization should be simple to understand, aesthetically appealing, and\
  \ effectively convey the idea.\n\nStep 4: Visualization Interactive\n\nThe interactive\
  \ visualization allows the viewer to interact with the visualization and study the\
  \ data in real time. This may be accomplished by use tools like as zooming, panning,\
  \ filtering, and highlighting. Interactive visualization gives a more engaging experience\
  \ and can aid in the discovery of fresh insights that static visualizations may\
  \ not provide.\n\n### 21.4.4 Feature Engineering\n\nFeature engineering is an important\
  \ part of machine learning that includes developing additional variables or features\
  \ to improve the performance of a prediction model. This chapter will give an in-depth\
  \ description of feature engineering, covering the many phases required.\n\nThe\
  \ feature engineering process consists of four major steps: feature development,\
  \ transformation, extraction, and selection. The initial stage is to discover and\
  \ pick variables that will be most beneficial in the prediction model. This phase\
  \ is subjective and needs domain understanding as well as imagination. This step’s\
  \ features should capture the significant qualities of the data that might aid in\
  \ forecasting the target variable.\n\nThe next phase is transformation after the\
  \ features have been built. This stage entails modifying the predictor variables\
  \ in order to improve model performance. For example, we may use scaling or normalization\
  \ to increase the model’s performance by making the data more consistent.\n\nThe\
  \ third stage is to extract features. Feature extraction is an automated technique\
  \ that includes extracting new variables from raw data to create new variables.\
  \ The goal of this stage is to lower the dataset’s dimensionality and make it more\
  \ manageable for modeling. Principal component analysis (PCA), linear discriminant\
  \ analysis (LDA), and independent component analysis (ICA) are all methodologies\
  \ for extracting features.\n\n### 21.4.5 Experimenting Random Forest Classifier\n\
  \n\n\n-   使用各种样本创建决策树，随后对结果进行分析，并基于决策树的多数票进行预测。为了提升性能，随机森林生成大量决策树而非仅使用一个。与单个决策树算法相比，它更准确。它提供了一种处理缺失数据的实用方法，且无需调整超参数，即可生成合理的预测。它解决了决策树的过拟合问题。在每棵随机森林树的节点分割点，会随机选择一个子集特征。\n\
  \n### 21.4.6 实验 KNN 分类器\n\n基于相似性，数据点被分类。由于它不创建学习算法来预测结果，因此常被称为懒惰算法。它对如何使用提供的数据构建模型没有任何假设。这对于进行基于各种特征对事物进行分类的模式识别任务非常有益。\n\
