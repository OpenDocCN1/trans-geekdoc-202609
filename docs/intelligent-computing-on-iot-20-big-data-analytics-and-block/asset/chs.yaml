  (8.3)  \n\n$$\\\\underset{r = 0}{\\\\overset{\\\\infty}{\\\\sum^{}}}H\\_{r}G^{r}\
  \ = 0$$  \n\nNote that the (*j,k*)th entry of *G* provides the conditional probability\
  \ that the system under study will eventually visit the state (*i, k*) for the first\
