  \n# 14 传感器技术在物联网中\n\nLaura García, Sandra Sendra, Jose Miguel Jiménez and Jaime\
  \ Lloret\n\nUniversitat Politècnica de València, Spain\n\nDOI: [10.1201/9781003326236-14](https://dx.doi.org/10.1201/9781003326236-14)\n\
  \n## 14.1 介绍\n\n随着通信技术的发展，对解决部署大量人员进行监测和管理活动所带来的问题的解决方案的兴趣增加。无线传感器网络 (WSN) 使从个人电脑便捷地监测广阔区域成为可能。随后，随着通信技术的进一步发展，物联网\
  \ (IoT) 解决方案开始被实施为方便人们的系统，包括与用户的交互。IoT 的第一篇文章发表于 2002 年，应用于智能超市的概念 \\[1\\]. 从 2009\
  \ 年起，与 IoT 相关的论文呈现出快速增长的趋势，政府开始制定计划和发展方向，以提供具备智能功能的城市。2015 年出现了指数级增长，并且仍在持续增长。\n\
  \nIoT 的兴趣和便利性的增加促使 IoT 在各种领域得到广泛应用。IoT 领域涵盖广泛的环境、功能和应用。工业、农业、家庭、医疗、城市和海洋是 IoT 部署的一些环境。主要功能是获取环境信息，以获得其状态的洞察，进行预测，或通过使用执行器或通知警报来改变该环境或解决检测到的问题。这导致了无数努力创建分类，以便便于理解\
  \ IoT 及其概念。尽管对具体类别没有共识，但大多数分类包含相同类型的应用 \\[2, 3, 4, 5 和 6\\]。\n\n对于每个应用，开发人员或研究人员必须考虑环境的物理参数及其限制。IoT\
  \ 传感器设备应能够承受高温或低温（如果部署在户外），承受深压（如果部署在水下），或在部署在可携带设备（如手表或玩具）时被高度操作和抛掷。此外，IoT 网络的主要特征是传感器节点应连接到网络，以便能够将其数据共享并处理或存储在其他外部服务器上。因此，在设计设备时，需要确定最适合该设备及其监测的环境的有线或无线通信方式。\n\
  \n应用的要求通常决定了开发 IoT 解决方案所需的无线技术类型。用于开发 WSN 和 IoT 解决方案的当前无线技术列表 \\[7\\] 包括蓝牙低功耗 (BLE)、Zigbee、Z-Wave、6LowPAN、Thread、WiFi、Sigfox、Neul\
  \ 或 LoRa/LoRaWAN 等。每种技术都意味着需要考虑的一系列特性，例如使用特定的拓扑结构、有效数据传输速率、最大覆盖范围以及单个设备能提供的范围。最后，考虑到我们希望有效利用收集的数据，应用的类型将决定所需的处理技术和信息存储方式。因此，根据应用的需求，可以寻找边缘计算、雾计算或云计算等计算技术\
  \ \\[8\\]。\n\n因此，IoT 领域的多样性随时间不断增加。因此，传感器技术必须演进以满足这些应用的需求。每个领域可能有特定的需求，如传感器设备之间的通信类型、封装（防水、抗冲击）或电源选项（太阳能板、直接连接电网、电池），等因素。因此，本章旨在阐述这些领域之间的差异及其对传感器技术的影响，识别部署传感器设备的主要挑战，确定这些传感器生成的数据类型，并讨论\
  \ IoT 应用中传感器设备的当前创新。它将为读者提供 IoT 传感器技术当前状态的概览，作为进入该领域的入门介绍。\n\n## 14.2 物联网的定义\n\n\
  现在是几点钟？你是否取出手机查看时间？是否查看过你的智能手表？也许电视？我猜这些设备都起到了作用，但它们还做了什么？是否考虑到移动作为体育活动，并在你用于健康管理的应用中增加消耗的卡路里？移动是否仅仅使屏幕亮起。或者还有更多。毫无疑问，技术是我们生活的一部分。它与我们的日常行为交织得如此紧密，以至于我们甚至不去想它。但这些设备拥有传感器，收集信息并将其传输，以提供我们不曾思考的各种功能。随着新的进展不断进入市场，新的连接也成为构成物联网\
  \ (IoT) 网络的一部分。\n\n“IoT”一词于 1999 年由 RFID (Radio Frequency Identification) 开发社区的合作者创造\
  \ \\[9\\]. IoT 本质上是大量通过私有或公共网络相互连接的物体。这里的“物体”一词用于指代根据其预定用途而异的形状、尺寸和类型的设备。这些设备的目标是收集并共享信息，以监测、管理和控制其所在的环境\
  \ \\[9\\]. 这些设备相互交互并合作，以提供新的服务和应用，以实现既定的共同目标。因此，冰箱、娃娃、食品处理机、你的新车或最近医院的医疗设备，它们都可能是\
  \ IoT 设备。\n\n位于我们家中的设备、用于接送我们的设备、用于治愈我们的设备以及我们不断携带的设备——甚至我们的衣物、树木、动物以及我们最喜欢的超市货架上的食品——也可以借助\
  \ WiFi、Bluetooth 或 RFID 等无线技术成为 IoT 网络的一部分。因此，不足为奇的是，一些作者设想一个所有物体和人们都配备某种识别设备的世界\
  \ \\[10\\].\n\n\n\n\n-   架构是构成系统的元素的方案，它们在系统中的作用以及它们之间的相互关系。它通常被分为层，指示其包含的设备或软件工具的主要功能。Figure\
  \ 14.1 描绘了这种层级架构形式。它由四层组成：传感器层、通信层、服务层和应用层。\n\n![Figure 14.1 IoT generic architecture.](img/fig14_1_B.jpg)\n\
  \nFigure 14.1 IoT generic architecture.\n\n传感器层：传感器是物联网的基础。没有能够响应环境并生成数据的设备，就没有东西可以通信。因此，传感器是能够响应其所在的物理环境的设备。响应通常是需要被解释并转换为人类用户或处理数据的机器可以理解的电压。然而，传感器本身无法存储、显示或传输数据，还需要其他设备来执行所有功能才能被视为物联网设备。\n\
  \n物联网设备是具有计算能力的物体，这些计算能力不包括标准计算设备，如个人电脑、平板电脑或智能手机。通过这种方式，普通物体可以配备连接能力，成为网络的一部分，并与其他物体及互联网进行交互。我们日常使用的设备中的传感器可能不易察觉，但它们确实存在，响应环境的变化。个人电脑、平板电脑和智能手机通过设备电路中集成的不同元件，为传感器提供必要的计算和通信能力。然而，对于开发者来说，常规做法是使用嵌入式开发板通过所需模块的互连来提供这些能力。尽管如此，所有这些设备都共享常见元素（见\
  \ Table 14.1），如 Figure 14.2 所示。\n\nTable 14.1 Elements of an IoT Device\n\n| Element\
  \ || Description |\n| --- | --- |\n| Processor || The `Processor` is the part of\
  \ the device that provides computing power. This computer power is used to run the\
  \ program that dictates how the device should operate and process the information.\
  \ If the IoT device needs to perform simple operations, the selection of an 8-bit\
  \ processor may provide enough computing capabilities. However, 16-bit and 32-bit\
  \ processors are available for higher processing requirements. |\n| --- | --- |\n\
  | Memory || IoT devices are configured to perform a certain task through a software\
  \ program. It may also be necessary to store the information gathered by the sensors\
  \ until this information is transmitted. Therefore, memory is another important\
  \ part of IoT devices with computing capabilities. The memory is part of the microcontroller.\
  \ There are two types of memory for different types of information. The `RAM` (random\
  \ access memory) stores short-term data that is lost when the device is not powered.\
  \ The `ROM` (read-only memory) stores long-term data, such as the program, that\
  \ can be accessed when necessary and is not lost when the device is restarted. |\n\
  | I/O pins || Sensors and other modules in the IoT device need to be connected to\
  \ the processor to interact and perform their tasks. This connection is performed\
  \ through the input and output pins. The pins read data or perform the actions established\
  \ in the program of the device. The number of I/O pins and their specified use vary\
  \ according to the type of board and should be consulted in the datasheet provided\
  \ by the manufacturer. |\n| Communication ports and antennas || IoT devices need\
  \ a form of communication either to be configured or to exchange data with other\
  \ devices. The communication ports enable wired communications with other devices.\
  \ `USB`, `UART`, or the `Ethernet` port are examples of wired communication ports.\
  \ Wireless communications are performed through `antennas`. The antennas may be\
  \ as small as a printed circuit that is part of the embedded board, but oftentimes\
  \ it is a bigger electronic device selected to meet the communication requirements\
  \ in terms of coverage and transmission power that is connected to the embedded\
  \ board. |\n| Power supply || The `Power supply` is necessary for the device to\
  \ operate. Batteries, solar panels, or a connection to the power grid are some of\
  \ the options for providing a steady power supply to the device. Typical voltages\
  \ for powering small-sized devices comprised embedded boards are 5V and 3.3V. However,\
  \ large-sized devices with higher processing and communication requirements may\
  \ need more potent power supplies, including a connection to the power grid. |\n\
  | Circuitry || All the different elements of IoT devices are connected and integrated\
  \ into a circuit with elements such as resistors, capacitors, diodes, or transistors,\
  \ among others, to enable the correct operation of the device. |\n\n![Figure 14.2\
  \ Parts of the embedded boards.](img/fig14_2_B.jpg)\n\nFigure 14.2 Parts of the\
  \ embedded boards.\n\n市面上有许多嵌入式开发板，满足不同的处理能力、I/O 引脚数量及类型（模拟或数字）以及工作电压（见 Table 14.2）的需求。在开发用于监测不同环境的物联网设备时，需要考虑所用传感器的特性、稳定电源的可用性（或缺乏）以及天气条件和所需的封装。如果设备未得到保护，它可能会因环境因素或操作活动而损坏。因此，必须覆盖设备并根据具体条件调整封装，以确保正常工作。设备若位于户外，应具备防\
  \ weatherproof 特性；若部署于深海，则需能够承受高压。\n\nTable 14.2 Commonly Embedded Boards and Their\
  \ Characteristics\n\n| Controller || Analog Pins || Digital Pins || USB || Operating\
  \ Voltage || Processor || FLASH || RAM || EEPROM || Frequency |\n| --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- |\n| Arduino Mega \\[12\\] ||  16 ||\
  \  54 || — ||  7–12 V || `ATmega 2560` ||  256 kB ||  8 kB ||  4 kB ||  16 MHz |\n\
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| Arduino UNO \\\
  [13\\] ||  6 ||  6+14 || — ||  7–12 V || `ATmega 328P` ||  32 kB ||  2 kB ||  1\
  \ kB ||  16 MHz |\n| WEMOS MINI D1 \\[14\\] ||  1 ||  11 ||  1 ||  3.3 V || `ESP8266`\
  \ ||  4 MB || — || — ||  80/160 MHz |\n| Node MCU \\[15\\] ||  1 ||  17 || — ||\
  \  3.3 V || `ESP8266` ||  16 MB ||  32+80 kB || — || — |\n| Raspberry Pi 2 Model\
  \ B \\[16\\] ||  ||  40 ||  4 || — || `Broadcom BCM2837` ||  900 MHz || — ||  1\
  \ GB || — |\n| Raspberry Pi 3 Model B+ \\[17\\] ||  ||  40 ||  4 ||  5 V || `Broadcom\
  \ BCM2837B0` ||  1.4 GHz || — ||  1 GB || — |\n\nDepending on the purpose of the\
  \ device, they may be consumer devices, such as smart watches, cars, home appliances,\
  \ thermostats, lighting, and irrigation devices for gardens \\[11\\]; enterprise\
  \ devices, such as security, lighting, locks, thermostats, cameras, TVs, monitors,\
  \ and projectors; and industrial devices such as sensors and machinery.\n\n\n\n\
  -   IoT 设备可能会根据环境中感知到的内容或用户收到的操作来执行特定的动作。例如，灯光可能被打开，空调可能被关闭，闸门可能被打开，或者植物可能需要浇水。执行器是根据收到的信号指示而执行的设备。它们的功能与传感器相反，因为传感器响应环境，而执行器则修改环境。\n\
  \n`Communication Layer`: 传感器设备如果没有能够与其他设备通信，就不能被视为物联网 (IoT)。它们必须是网络的一部分。该网络由不同的网络设备组成，如网关、路由器、交换机、集线器或桥接器，这些设备创建连接以实现通信。通信可以是有线的或无线的，根据通信协议的不同，传感器设备需要包含特定的端口、天线或模块来进行通信。\n\
  \n可用的技术种类繁多 \\[9\\]，因此使用标准有助于设备的集成和互操作性。Table 14.3 列出了这些技术的主要特性。最佳技术的选择取决于覆盖范围、需要传输的数据量或功耗需求。\n\
  \nTable 14.3 Wired and Wireless Communication Protocols\n\n| Protocol || Distance\
  \ || Data Rate/Bandwidth || Power Consumptio |\n| --- | --- | --- | --- |\n| WiFi\
  \ \\[18, 19\\] ||  70 m (indoor)/250 m (outdoor) || Up to 40 Mbps (802.11ah) ||\
  \ High |\n| LoRa \\[19\\] ||  22 km ||  0.3 to 50 kbps || Low |\n| RFID \\[20\\\
  ] ||  27 m (passive)/100 m(active) || Up to 640 kbps || Low |\n| ZigBee \\[19\\\
  ] ||  75 m || Up to 250 kbps || Low |\n| Bluetooth \\[19\\] ||  350 m || Up to 3\
  \ Mbps || Medium-Low |\n| GPRS \\[21\\] ||  35 km ||  40 kbps || High |\n|  4G/LTE\
  \ \\[19\\] ||  100 km || Upload 150 Mbps Download 50 Mbps || High |\n| Ethernet\
  \ \\[22\\] || Up to 100 m (without intermediate devices) || Up to 100 Gbps (Gigabit\
  \ Ethernet) || Medium |\n\n`Service Layer`: 服务层包含网络提供的各种功能。其中一些功能侧重于数据处理，包括云服务、本地处理与分析以及人工智能\
  \ (AI) 技术用于进行预测 \\[9\\]。这些技术可以用于减少需要转发的信息量，并从数据中得出结论，帮助用户和系统做出决策或进行预测。其他功能侧重于设备管理和安全保障\
  \ \\[11\\]。设备可能需要进行注册并经历激活过程，以建立配置，这在被授权并经过验证后进行。此外，某些应用可能需要特殊的安全措施，例如智能医疗，因为数据极其私密。其他应用可能需要管理大量设备。因此，不同的应用可能使用不同的服务，因为将所有服务都应用于所有应用是低效的。智能农业的安全需求低于智能电网，因为农业数据可能不那么机密。但仍需考虑互操作性、可扩展性或可用性等问题，因此使用和开发标准以便于物联网系统的实现至关重要。\n\
  \n`Application Layer`: 最后一层是应用层。这一层包含每个智能环境的不同功能，如农业、环境监测、医疗、城市、太空、纳米设备、物流、教育、能源、工业或社交物联网\
  \ \\[9\\]。用户与设备之间的交互，或人与物之间、物与物之间的交互，可以导致人与人、人与事、事与事的交互。此外，用户或事物对数据的访问以及智能应用的管理可以在远程位置进行。\n\
  \n## 14.4 The Use of IoT Technology in Different Use Cases\n\nIn this section, the\
  \ use cases for the different smart applications are presented. The concept for\
  \ each smart application is described, and the architecture and sensor devices in\
  \ each case are described.\n\n### 14.4.1 IoT for Smart Environmental Monitoring\n\
  \nThe increase in population has led to the detection of increased danger to the\
  \ health of both people and ecological systems. A report of the Lancet Commission\
  \ on pollution and health \\[23\\], where a two-year study was conducted, concludes\
  \ that environmental pollution is currently the biggest culprit of disease and premature\
  \ death in the world. The study states that, in countries with serious pollution\
  \ problems, a quarter of the people who die do so from diseases directly related\
  \ to pollution. They calculated that, in 2015, 9 million people died prematurely\
  \ from diseases directly related to this serious problem. This reason is one of\
  \ the main factors for the need to monitor the environment in cities, industrial\
  \ areas, forests, rivers, lakes, seas, etc.\n\nThe combined action of sensors, IoT\
  \ devices, and remote connectivity is used to monitor properly. In addition, we\
  \ must be able to analyze, determine the accuracy, and present reports of the obtained\
  \ data.\n\nThe use of sensor networks and IoT allows for protecting and cleaning\
  \ our environment, thanks to the detection of harmful pollutants, harmful substances,\
  \ chemical spills, etc. With the sensors that are integrated into weather stations,\
  \ irrigation systems, ocean equipment, etc., we can easily and efficiently detect\
  \ data such as temperature, humidity, water level, or physical properties, and facilitate\
  \ monitoring air, soil, and water.\n\nThe data obtained from the sensors is transmitted\
  \ through devices or nodes, which are connected to the cloud or external databases\
  \ through different communication technologies. If data is processed using edge\
  \ computing, critical information can be quickly classified and delivered. At other\
  \ points, even from the very edge of the network, the information can be analyzed\
  \ and evaluated. After that, the appropriate actions must be carried out in response\
  \ to each of the anomalous situations.\n\n*   **Weather:** Temperature, humidity,\
  \ rain, atmospheric pressure, the intensity of light, direction, and speed of the\
  \ wind, solar radiation, UV radiation.\n\n*   **Air quality:** PM 2.5, PM 1, PM\
  \ 10, CO[2], O[3], NO[2], SO[2].\n\n*   **Water pollution:** Turbidity, salinity,\
  \ dissolved oxygen, temperature.\n\n*   **Forest fire detection:** smoke, flame,\
  \ CO[2].\n\nFigure 14.3 shows the network architecture of smart environmental monitoring.\
  \ To carry out environmental monitoring, we must establish an architecture in which\
  \ there will be:\n\n![Figure 14.3 The network architecture of IoT for smart environmental\
  \ monitoring. The parameters that are most commonly monitored are the following:](img/fig14_3_B.jpg)\n\
  \nFigure 14.3 The network architecture of IoT for smart environmental monitoring.\
  \ The parameters that are most commonly monitored are the following:\n\n*   **Sensor\
  \ network:** It continuously monitors the environment and generates data related\
  \ to the observed variables.\n\n*   **Nodes:** The sensors will be connected to\
  \ nodes that are capable of transmitting the data captured during monitoring.\n\n\
  \n\n-   [通信网络：](https://wiki.example.org/feynmans_learning_method) 使用不同技术，将数据从节点发送到云端或私有数据库进行处理。\n\
  \n-   [智能系统：](https://wiki.example.org/feynmans_learning_method) 它们负责处理捕获的气候数据，在发生危险情况时生成警报和通知。\n\
  \n-   [所获信息的展示：](https://wiki.example.org/feynmans_learning_method) 处理后的信息结果必须发送给相关行为人或人员，以便他们作出适当反应。\n\
  \nThere are public platforms that offer information with climatological data obtained\
  \ in different locations, for example, Microsoft’s Planetary Computer Data Catalog\
  \ \\[24\\].\n\nThere are public platforms that offer information with climatological\
  \ data obtained in different locations, for example, Microsoft’s Planetary Computer\
  \ Data Catalog \\[24\\].\n\nIt is very interesting to use low-cost sensors that\
  \ allow monitoring of the air and the exposure to pollution that people face \\\
  [25\\] since they would allow its massive use. One of the biggest problems we have\
  \ to face is the calibration of the sensors. They must be calibrated before their\
  \ deployment. It would be advisable that, initially, its calibration is conducted\
  \ in the laboratory following the manufacturer’s instructions. Once the final implementation\
  \ has been carried out, calibrations are performed again, since in this way the\
  \ quality of the obtained data can be guaranteed. Access to environmental parameters\
  \ using the web in remote areas would also be very interesting \\[26\\]. Citizens\
  \ can access information on environmental parameters through the Internet, and in\
  \ addition, alarms can be sent when the pollution parameters exceed the ranges considered\
  \ appropriate. The control of marine pollution is of great interest as well. Using\
  \ sensors and other technological means, it is possible to map and monitor aquatic\
  \ environments, even seeing their distribution and evolution \\[27, 28\\].\n\nIt\
  \ is very interesting to use low-cost sensors that allow monitoring of the air and\
  \ the exposure to pollution that people face \\[25\\] since they would allow its\
  \ massive use. One of the biggest problems we have to face is the calibration of\
  \ the sensors. They must be calibrated before their deployment. It would be advisable\
  \ that, initially, its calibration is conducted in the laboratory following the\
  \ manufacturer’s instructions. Once the final implementation has been carried out,\
  \ calibrations are performed again, since in this way the quality of the obtained\
  \ data can be guaranteed. Access to environmental parameters using the web in remote\
  \ areas would also be very interesting \\[26\\]. Citizens can access information\
  \ on environmental parameters through the Internet, and in addition, alarms can\
  \ be sent when the pollution parameters exceed the ranges considered appropriate.\
  \ The control of marine pollution is of great interest as well. Using sensors and\
  \ other technological means, it is possible to map and monitor aquatic environments,\
  \ even seeing their distribution and evolution \\[27, 28\\].\n\n### 14.4.2 Smart\
  \ Farming: Smart Agriculture, Smart Breeding\n\nAccording to the United Nations\
  \ (UN) \\[29\\], the world population in 2050 will reach 9,700 million, given this\
  \ forecast, the Food and Agriculture Organization of the United Nations (FAO) \\\
  [30\\] indicates that world agricultural production should increase by 70% in 2050,\
  \ compared to agricultural production in 2009.\n\nSmart farming can be defined as\
  \ the use of new technologies in agriculture to increase its yield efficiently,\
  \ achieve better use of resources, and cause minimal environmental impact.\n\nTo\
  \ achieve this objective, it is necessary to observe and analyze the conditions,\
  \ to subsequently create an optimal plan of the actions to be taken. The available\
  \ resources must be adjusted to the specific situations in each location. For all\
  \ the reasons stated, it is necessary to use sensor technology to obtain the most\
  \ precise information from the monitored data, which will be processed by intelligent\
  \ systems to obtain optimal results.\n\nThe terms “smart farming” and “precision\
  \ farming” are often used as similar terms, but they should be differentiated. Smart\
  \ farming focuses on tillage agriculture, while precision farming takes more concepts\
  \ into account, including smart electronics, to make the farmer’s tasks more bearable\
  \ and achieve additional cost savings.\n\nThe parameters that are usually monitored\
  \ by different types of sensors are the following:\n\n*   Soil, plant, and water\
  \ sensors: The parameters most controlled by these sensors are soil moisture, water\
  \ level, pH (soil or water), water flow, soil temperature, water conductivity, leaf\
  \ wetness, plant height, water temperature, and soil nutrients.\n\n*   Climate sensors:\
  \ The parameters most controlled by these sensors are air temperature, air humidity,\
  \ luminosity, rain, wind direction and velocity, ultraviolet radiation, CO[2], gas,\
  \ atmospheric pressure, and smoke.\n\nThe use of actuators is also of vital importance.\
  \ The data observed during monitoring is stored in the cloud or private databases\
  \ and is processed by intelligent systems. With the produced response and based\
  \ on pre-established reference values, appropriate decisions can be made in situations\
  \ that may endanger crops. The actions can be carried out directly, acting automatically\
  \ on the actuators, or the farmers themselves can make the decision they believe\
  \ to be the best based on the received information.\n\nIn many situations, drones\
  \ are being used \\[31\\] since they allow information to be collected through the\
  \ sensors and cameras that are installed on a large surface. From the cameras, using\
  \ infrared technology and multispectral images, information can be obtained on the\
  \ state of the land, crops, water needs, etc. Furthermore, fumigation tasks can\
  \ be carried out with the use of drones.\n\nAnother key point to monitor correctly\
  \ is to use the appropriate communication technologies. The information must be\
  \ sent from the field to the cloud or private databases, where it will be stored\
  \ and can be accessed by farmers, even in real time. According to the Machina research\
  \ report \\[32\\], the number of connected agricultural devices is expected to reach\
  \ 225 million by 2024. The employed technologies are very numerous since multiple\
  \ factors must be taken into consideration for their implementation. We can highlight\
  \ the following factors, which will be of vital importance in the selection of the\
  \ technology used for transmission: maximum data rate, maximum range, energy consumption,\
  \ ease of installation, etc. Thus, we can find cellular technologies implemented\
  \ (3G, 4G, 5G), wireless (WiFi, Bluetooth BLE, RFDI, Zigbee, NB-IoT, IEEE 802.15.1)\
  \ LPWAN (LTE-M, EC-GSM, Sigfox, LoRaWAN), and wired (Ethernet).\n\nDue to climate\
  \ change and its effects on precision farming, extremely efficient use of fresh\
  \ water must be taken into account. In addition, water availability for food production\
  \ and people, as well as to maintain ecosystems, must be ensured, as indicated by\
  \ the authors \\[33\\]. A fundamental task when implementing soil moisture (or any\
  \ other parameter) monitoring solutions in precision agriculture is the location\
  \ of the nodes with their connected sensors since an observation will depend on\
  \ its adequacy to the requirements. Authors such as \\[34\\] have submitted a proposal\
  \ to fix this problem. The network architecture of smart farming is presented in\
  \ Figure 14.4.\n\n![Figure 14.4 The network architecture of smart farming.](img/fig14_4_B.jpg)\n\
  \nFigure 14.4 The network architecture of smart farming.\n\n### 14.4.3 Smart Healthcare:\
  \ eHealth, Smart Medical Management, Independent Living\n\nIn smart healthcare,\
  \ the concept of IoT is applied to monitoring and managing people’s health. The\
  \ smart sensors deployed for these applications are often wearable devices (see\
  \ Figure 14.5). Materials, people, and healthcare institutions are then connected\
  \ to provide intelligent responses to medical needs \\[35\\]. It enables more interaction\
  \ between the parties (hospitals, patients, doctors, and research facilities), helps\
  \ allocate resources, improves medical research, prevents diseases, and facilitates\
  \ making more informed decisions, diagnoses, and treatments. Smart healthcare functionalities\
  \ can be classified into the categories of individual users, health institutions,\
  \ and research institutions \\[35\\].\n\n![Figure 14.5 Network of smart wearable\
  \ sensors for smart healthcare.](img/fig14_5_B.jpg)\n\nFigure 14.5 Network of smart\
  \ wearable sensors for smart healthcare.\n\n\n\n传统健康管理以医生–患者关系为中心，在慢性病管理方面可能存在不足。为解决这一问题，物联网（IoT）实现了患者自我管理。患者可以居住在配备传感器的智能住宅中，这些传感器可监测可能的健康风险，如跌倒或空气质量，从而提升生活质量并为老年人和残障人士提供帮助。他们可以佩戴可穿戴设备，如智能手表，这些设备内置高级传感器，可实时、不令人不适地监测运动、心率或呼吸模式。医院可以使用\
  \ RFID 识别并管理患者、人员和材料，以提升性能、资源分配并降低成本。医生可以通过集成系统获取信息，或借助医疗机器人进行更安全、更精准的手术。最后，研究机构可以获得更大量、更长时间的数据，以便进行分析并帮助发现新的帮助患者的方法。\n\
  \n智慧医疗利用所有物联网应用的共同技术，同时可能还包括通过在智能手机和可穿戴设备中加入生物传感器而引入的生物技术 \\[36\\]。\n\n可穿戴传感器通常是外部且无线的，因为内部传感器更不舒适，且在维修时会带来更多不便。它们测量生理指标，如呼吸频率、体温、脉搏、血压、血氧饱和度等。其他特殊用途的传感器还包括跌落检测、血糖或关节角度传感器。\n\
  \n加速度计可用于康复，以检测关节（如膝盖）的运动或监测帕金森病患者的病情演变。脉搏可从身体不同部位读取，如手腕、胸部、指尖或耳垂。许多商用设备监测脉搏，尤其用于运动。脉搏可以通过压力、超声（RF）、射频或光电血脉波（PPG）传感器测量。后者利用\
  \ LED 和光电二极管观察光的变化来确定脉搏。呼吸频率可用于检测呼吸暂停、气道阻塞、哮喘或过度换气等情况。基于热敏电阻的鼻子传感器是监测呼吸频率并检测空气温度的一种形式。超声波、麦克风、光纤、压力传感器或拉伸传感器也可用于检测呼吸。体温通过热敏电阻测量。血压传感器可用于管理高血压患者，但定期监测较为困难。可以通过脉搏读数估算脉搏传导时间，虽然后者不如理想般准确。脉搏血氧传感器用于监测血液中的氧含量，基于\
  \ LED 技术。最近的进展还包括智能药丸，当其接触患者胃酸时会触发传感器，生成药物摄入时的时间戳，以及能够从泪液中监测血糖并将信息发送至胰岛素泵的隐形眼镜 \\\
  [37\\]。视觉传感器也可用于智慧医疗解决方案，但用户可能不愿在家中安装摄像头。\n\n另一方面，人工智能（AI）正被应用于智慧医疗系统，用于分析数据以实现疾病预防、风险监测、精准诊断和个性化治疗方案。AI\
  \ 基于从所有传感器设备收集并存储在云端的数据，判断患病风险、评估疾病演进或提供健康与治疗建议。这有助于改善患者的生活方式以及可能增加疾病风险或恶化当前状况的行为。AI\
  \ 还可以用于实现虚拟助手，理解书面或语音输入并作出相应响应，充当患者、医生和机构之间的中介。它可用于心理健康、提供信息或执行行政任务（如预约）。区块链被实现以提供安全、隐私、透明、不可篡改、容错、服务质量和自动化\
  \ \\[38, 39\\]。手术机器人（如达芬奇系统）有助于提升手术效果和恢复时间。此外，混合现实技术可用于通过建模患者及其伤害来规划手术。\n\n然而，智慧医疗系统的部署仍面临一些挑战。缺乏智慧医疗的统一标准，导致概念模糊且缺乏互操作性。此外，法律法规的进步速度跟不上技术发展，可能导致阻碍这些系统测试和部署的问题。大量来自无数智能设备的数据产生，使得管理和传输所有信息变得困难。而且，部分用户在使用技术时可能遇到困难，例如老年人和残障人士。数据安全也是必须考虑的重要因素。最后，某些传感器可能需要重新校准，且因覆盖损失或电池耗尽导致的断连现象也时有发生\
  \ \\[36\\]。\n\n### 14.4.4 Smart Home: Smart Buildings, Smart Living\n\n智能住宅的根本目标是在住宅和建筑中加入传感器和执行器，以简化日常生活。智能住宅可以在新建阶段即被构建，也可以在原本没有这些设备的老房子中增添传感器、执行器和必要设备。智能住宅的一个基本特征是，居民可以在本地或远程访问互联网，从而控制家中状态信息并根据偏好和需求作出相应响应。\n\
  \n当实现家庭自动化时，可实现更高层次的家庭控制和安全、更高的能源节约与效率、更高的居住舒适度，甚至更大的可持续性。\n\n目前，通过移动设备控制家庭主要有两种方式：Home\
  \ Assistant 或 SmartThings。SmartThings \\[40\\] 是三星的专有解决方案。通过该方案，用户可以使用 App 控制三星及兼容设备。使用该选项的前提是用户必须连接至三星云服务，并通过互联网访问。如果用户选择使用\
  \ Home Assistant \\[41\\]，则使用的是开源自动化软件。其主要优势之一是可以控制不同设备和系统，这些设备和系统在用户视角下会协同工作且透明。该方案可通过多种系统实现，但最知名且使用最广泛的包括\
  \ Google Home、Amazon Echo 和 Alexa。从使用角度看，Home Assistant 选项需要更高的实现知识。\n\n要实现 Home\
  \ Assistant 或 SmartThings 方案，需要使用无线或有线通信技术与设备和控制器连接。最常用的技术有以太网（Ethernet）、Wi‑Fi、蓝牙低功耗（BLE）、Zigbee\
  \ 等。\n\n如果我们已具备智能住宅所需的资源，则在家中任何有网络连接的位置都可以控制暖通空调（HVAC）系统、家电、照明、闭路电视（CCTV）等。在可用的传感器和执行器中，我们可以突出以下几类：\n\
  \n\n\n\n# 智能家居与智能城市\n\n## 智能家居\n\n*   智能开窗和关门：我们可以在任何地方打开家庭或车库的门。它还允许我们通过窗户进行操作。这提供了更高的安全性，并便于其他人在家中访问。\n\
  \n*   智能照明：这些传感器和执行器的安装使我们能够远程控制家庭灯光。根据设备和控制器的不同，我们甚至可以调节光的亮度。除了显著的能源节约，它还能在家庭中提供额外的安全模式。\n\
  \n*   智能能耗计量器：这些传感器和执行器可以控制能耗，并能对成本大幅降低产生重要影响。\n\n*   智能插座：使用它们可以控制联网家用电器。这将帮助我们减少能耗，并在电气问题发生时避免故障。\n\
  \n*   烟雾和气体检测：烟雾的存在可以被检测。它通过启动相应的警报来防止火灾，并避免火灾可能导致的巨大物质损失。此外，有害健康的气体也可以被检测，并相应地触发警报。\n\
  \n*   智能暖通空调系统：它们允许你从任何地方控制家庭空调。其对降低能源成本的影响是毋庸置疑的。\n\n*   漏水传感器：可以安装传感器来报告管道系统中的任何漏失。它们通常用于厨房和浴室，但检测范围可以扩展到整个家庭。\n\
  \n*   运动传感器：它们的安装使我们能够发现家中任何异常的运动。它与家庭安全紧密相关。摄像头和闭路电视（CCTV）通常用于执行这些功能。\n\n*   传感器和执行器，它们将连接到所有希望控制的设备和元件。\n\
  \n*   智能插座网络，具有能源管理功能。\n\n*   家庭通信网络（有线或无线）。\n\n*   中央网关，负责协调和控制家庭中所有连接设备。\n\nFigure\
  \ 14.6 显示了智能家庭的网络架构。\n\n![Figure 14.6 The network architecture of a smart home.](img/fig14_6_B.jpg)\n\
  \nFigure 14.6 The network architecture of a smart home.\n\n### 14.4.5 智能城市：交通管理、公共安全\n\
  \n每天，从农村环境迁移到城市生活的人口不断增加。\n\n根据联合国经济及社会事务部《世界城市化展望》2014 年修订版 \\[42\\]，预计到 2050 年，66%\
  \ 的人口将居住在城市地区。为了实现适当的发展，可持续城市化的前提显得尤为重要。智能城市在城市未来中扮演着基础性的角色。\n\n智能城市利用数字解决方案实现城市的可持续性和效率。传感器和传感器网络用于监测和改善基础设施、服务、安全等。通过传感器网络、摄像头、无线设备和数据中心，数据将被获取，这有助于将传统城市转变为智能城市。\n\
  \n从环境角度来看，智能城市的目标是成为可持续城市；从居民的角度来看，它必须因其提供的服务而具有吸引力。为了实现目标，必须具备：\n\n*   决策所需的监测资源。\n\
  \n*   适当的通信技术。\n\n*   分析观测数据并作出最适当决策的能力。\n\n*   投资未来技术，以更好地适应改进，满足我们的需求。\n\n根据 \\\
  [43\\] 智能城市的六大关键特征：\n\n*   **智能经济**：智能城市的人口增长将推动经济增长，进而影响劳动力市场和创业等。对产品和服务的需求将更大。\n\
  \n*   **智能人民**：许多智能城市鼓励创业和创新。根据 \\[44\\]，城市成功的关键在于人们在知识交流中的参与。\n\n*   **智能治理**：每个智能城市的组织方式各不相同，取决于其目标。常见的智能治理形式包括透明度和决策参与。\n\
  \n*   **智能出行**：城市内的交通是智能城市的关键点。公民需要能够高效移动于不同地点之间的系统。\n\n*   **智能环境**：未来城市必须减少污染、保护环境并更高效地管理废弃物。\n\
  \n*   **智能生活**：提升公民的生活质量至关重要，这将通过改善健康状况、住房质量、教育和文化设施等实现。\n\n智能城市使用大量传感器获取数据。以下是需要监测的关键领域：\n\
  \n*   **污染管理或空气质量**：在城市中战略性安装传感器，监测空气质量，并在污染水平危险时提醒公民，同时提升公众对环境的认知。\n\n*   **结构健康管理**：对建筑物进行监控以提高安全性并降低维护成本。建筑物的结构退化可能由环境作用或建筑材料降解等多种原因引起。会监测温度、湿度、应力、加速度和材料降解等参数。\n\
  \n*   **交通和交通管理**：利用智能交通和交通监测系统提高交通网络的效率。其带来的优势包括交通管理和优化、道路设施改善、道路安全提升、环境污染减少以及公共交通管理。公民的移动将更高效，通勤更加便捷，安全性提高，污染水平降低。\n\
  \n*   **水资源管理**：监测水利基础设施是必要的。大城市因管道漏水而浪费大量水资源。\n\n*   **能源管理**：需要使用传感器对电网进行智能控制。当检测到异常或故障时，会向服务公司发出警报，进行快速修复或通过其他路径重新引导能源。此外，还向公司和客户提供信息，帮助他们改进资源的使用和管理。\n\
  \n*   **公共照明管理**：通过监测街灯和公共照明状态的传感器，行政部门可以在灯光故障发生时立即收到警报。这样可以控制能源的浪费，例如灯光白天仍然亮着的情况。同时，还能够发现照明的盗窃和操纵。\n\
  \n\n\n\n**废弃物管理**：通过在垃圾容器中安装传感器，可以监测并通知当垃圾容器已满时。此外，公民可以获取其所在区域最近的垃圾容器的填充程度信息。此外，这将使垃圾收集路线的规划得以进行，从而节省车辆和填埋场的管理成本。此外，废弃物管理还可以被控制。它们甚至可以通过监测温度水平来提供火灾警报。\n\
  \nFigure 14.7 显示了智能城市的网络架构。\n\n![Figure 14.7 The network architecture of a smart\
  \ city.](img/fig14_7_B.jpg)\n\nFigure 14.7 The network architecture of a smart city.\n\
  \n### 14.4.6 智能物流：运输、移动性、智能旅游、产品生命周期管理、智能海运、智能港口、智能船只\n\n物流被定义为公司或服务，特别是分销，所需资源和方法的集合。多年来，主要目标一直保持不变，但用于实现这一目标的手段和资源却一直在变化。Figure\
  \ 14.8 展示了物流经历的不同世代 \\[45\\]。\n\n![Figure 14.8 Generations of logistics.](img/fig14_8_B.jpg)\n\
  \nFigure 14.8 Generations of logistics.\n\n智能物流被认为是将网络物理系统的原则应用于供应链中，以更好地控制、自我组织和优化这一功能。物流管理是一个受不断变化的行业影响而发展的创新方法。技术创新、对商品和服务需求的增长、或供应链的复杂性等因素只是其中一些。\n\
  \n通过使用技术，可以生成直接的数字图像，随后可以建立实时措施，以提高公司网络的效率，以及自我控制、处理和与 IT 系统、摄像头或传感器系统等其他信息系统相连的子系统。因此，智能物流的主要目标是实现更高效、分散、灵活和敏捷的订单处理。\n\
  \n当然，物联网技术和大数据将继续被用于管理运输和产品制造。通过物联网技术和大数据，该行业将得到惠及，并提高其运营能力，物流网络效率最大化的研究活动将持续发展。\n\
  \n#### 14.4.6.1 什么是智能物流？\n\n智能物流 \\[46\\] 指的是一种在物流活动发展过程中实现所有集成流程显著效率提升的特定物流类型；也就是说，它不是一种单一的物流系统，而是指以尽可能高效、可持续和盈利的物流视角执行的物流活动。从这个角度来看，虽然没有单一的方面必须考虑来识别智能物流，但有几个共同元素是其固有的：\n\
  \n*   **可持续物流**\n\n*   **社会物流**\n\n*   **应用于可追溯性的新技术使用**\n\n*   **流程自动化**\n\n这四个元素在理解智能物流时至关重要，因为它们提高了整体物流活动的效率，同时也回应了消费者对其购买决策不仅影响其自身经济，也影响整个社会的需求。Figure\
  \ 14.9 显示了一个从制造到用户交付的异构网络的例子，用于控制货物的物流。\n\n![Figure 14.9 Example network in smart\
  \ logistics.](img/fig14_9_B.jpg)\n\nFigure 14.9 Example network in smart logistics.\n\
  \n#### 14.4.6.2 智能物流对企业和工业的益处\n\n使用智能物流的好处很多。例如，基于更准确的诊断和可靠的预测，运输的质量和速度可以显著提高。此外，这一步骤的优势在于通过交换可视化和分析，简化了与供应商、仓库人员和最终客户的利益共享\
  \ \\[47\\]。\n\n许多物流提供商已经将其数字化战略集中在将系统数据与云平台上的传感器收集的车辆数据相互连接上。这正是智能物流的一个积极后果。在与行业合作的同时，这种方法也将便于现有设施的数字连接，并提供准确信息以确保整个基础设施的稳定。基于此方法，我们不仅可以确定维护策略，还可以智能地应对异常情况。例如，当收到多个错误消息时，可以决定哪些应优先处理。结果是，得益于智能物流，客户满意度提高。\n\
  \n### 14.4.7 智能工业：工业处理、智能制造\n\n每天，许多行业加入工业革命，也称为工业 4.0。数字化转型使得物理元素与数字元素融合，从而提高生产率。这促成了智能工业和智能工厂概念\
  \ \\[48\\]。\n\n智能工厂 \\[49\\] 指的是智能工业，即在其生产流程中引入了颠覆性技术，结果是生产更加灵活和模块化，这得益于自动化技术。\n\
  \n智能工厂可以缩短生产流程的时间，并降低成本，因为它们能够适应和优化流程，同时实时存储和分析大量数据。这使得生产更加灵活、高效和自主，使人们能够专注于改进流程，而非重复性任务，从而提供巨大价值\
  \ \\[50\\]。\n\n智能工业中的云计算 \\[51\\] 允许存储在工厂（机器人、传感器等）和特定工具（MES、ERP 等）以及制造产品中产生的大量数据。智能工业的主要特点如下：\n\
  \n*   **物联网在智能工业中**。机器之间的连接使得系统协调、数据捕获、远程生产控制以及系统和产品之间的信息交换成为可能。\n\n*   **大数据**。通过机器或工厂与工具之间的连接生成的信息必须被收集和分析，以实现两个目标：第一是识别模式，第二是预防未来事件。只有大数据才能在最佳时机处理大量数据。\n\
  \n*   **智能工厂中的网络安全**是必备技术之一，因为隐私和数据保护是工业最重要的要求。\n\n*   **机器人**便于执行需要高精度或重复性的任务。在每项活动中，可能需要认知机器人、自主机器人或两者兼有。\n\
  \n*   **数字孪生** \\[52\\] 能提高操作的效率、控制和规划。\n\n\n\n\n**虚拟和增强现实**帮助组织中的操作员管理产品、生产任务以及设备的维护和修理。但我们不应混淆这两个术语；当我们谈论增强现实（AR）时，我们指的是能够实时在我们通过眼睛感知的信息上叠加数字信息的技术，我们只需要一部智能手机。而虚拟现实则需要特殊眼镜来将我们转入虚拟世界。\n\
  \n#### 14.4.7.1 投资信息和通信技术（ICT）于智能工业的好处\n\n数字化工业带来了众多影响产品规划、质量和开发以及供应链物流的好处。下面列出最重要的竞争优势\
  \ \\[53\\]：\n\n*   在不可预见事件发生时的速度和灵活性\n\n*   通过传感器和物联网设备实时连接数字和物理元素\n\n*   资源优化\n\
  \n*   存储数据的可靠性\n\n*   元素之间的双向数据流\n\n从长远来看，智能工业还将带来其他优势，如机器学习所提供的好处。我们需要时间来收集并存储足够的数据，以制定需求预测、开展预防性和预测性维护，或生成数字孪生体等众多机器学习可执行的操作\
  \ \\[54\\]。\n\n### 14.4.8 智能能源：智能电网、电力管理\n\n传统自 20 世纪以来的能源生成与处理方式是一种僵化且单向的模式，依赖有限数量的厂站从上至下向客户供电，且在中长期不可持续。根据欧洲委员会\
  \ 2015 年通信 \\[55\\]，每年需要投资 20 亿美元，到 2030 年可实现 90 亿美元的节约，这将通过提升能源效率 25%实现。向智能能源转型将带来一系列变化，包括更高的能源效率、能源处理与最终使用的改进，以及更大比例的清洁可再生能源和智能能源系统\
  \ \\[56\\]。\n\n智能能源的目标是使传统能源行业数字化，迈向日益去中心化且双向的模式，以适应实际需求的能源消耗。传统模式下的 excess production（过剩产出）将被消除，以匹配消费者的需求。\n\
  \n根据 Dincer 等人 \\[57\\]，智能能源系统的关键期望包括：能源上可持续、能源安全、环境友好、经济可行、商业可行、社会可接受、可集成和可靠。通过实施智能能源，不仅能实现成本节约，还能带来环境变化，如降低碳足迹和减少用水量。\n\
  \n此外，还需考虑以下新概念。\n\n*   **新型消费者，即 prosumer（生产者-消费者）**：既是能源消费者，也生产能源。prosumer 通过其设施生产能源，除了消费外，还会将多余能源注入电网。\n\
  \n*   **智能电网**：一种能够确保可持续且高效的能源系统，损耗极低，并能提供高质量、安全的能源供应的网络。\n\n*   **智能电表**：新型能源计量器。它们必须具备远程管理能力，并支持时间差分计费。\n\
  \n*   **能量存储**：虽然存储能源非常复杂，但已成为必需。\n\n追求最大能源效率使我们走向智能电网，这些电网将是具备智能、灵活、高效、安全、开放和可持续性的网络。它们能够快速响应，得益于在其上部署的新型监控和通信系统。\n\
  \n从一开始，能源传输网络就配备了计量设备，用于为每个连接的消费者定价。新型智能电网必须具备以下特性：\n\n*   监控系统可实时定位任何供电中断，以便派遣维修团队进行适当维修。\n\
  \n*   对能源生成设备和系统的全生命周期维护，以监控老化情况。\n\n*   预防性维护可在出现潜在故障点时进行监测，并基于人工智能对历史数据的分析，采取适当的预防措施。\n\
  \n*   通过消费监测优化费用。实时消费监测使得能源生成能够匹配实时需求，从而减少能源浪费。\n\n能源存储是未来能源面临的重大挑战之一。以下是能源存储方法的规模示例：\n\
  \n*   **大规模（约吉瓦 GW）**：可通过可逆水电或热存储来存储。\n\n*   **网络存储（约兆瓦 MW）**：可通过电池和电池单元、电容器和超导体、飞轮来存储。\n\
  \n*   **终端用户级别（约千瓦 kW）**：可通过电池、超导体和飞轮来存储。\n\n另一个重大挑战是实现智能电表，因为未来的计费方式将按小时计费，这些电表将简化网络管理和控制。它们需要替换旧电表，因为新型电表能够进行远程测量和远程管理，从而实现对电表读取和信息处理的远程操作。\n\
  \n综上所述，智能电网的运行依赖于一个能够持续监测客户用电行为的持续通信网络。该网络能够实时监测并测量所有连接客户基础设施的设备行为。为实现这一目标，必须具备一个自动化系统，能够调节生成和客户需求的变化。Figure\
  \ 14.10 展示了一个智能配电系统的示例，左侧显示不同的能源生成来源，右侧则显示一些能源消费者。\n\n![Figure 14.10 智能能源配电系统。](img/fig14_10_B.jpg)\n\
  \nFigure 14.10 智能能源配电系统。\n\n### 14.4.9 社会物联网（SIoT）\n\n社会物联网概念聚焦于将社交网络与物联网相结合，使物体之间模拟人与人之间的交互，并运用社会学概念来定义其通信方式\
  \ \\[58\\]。创建由物体组成的社交网络，以实现共同目标，如提供服务或提升效率、功能和性能 \\[59\\]。这样，设备会自主选择“友谊”或形成“朋友的朋友”连接。因此，SIoT\
  \ 的交互方式是物物之间或用户与物体之间的交互。SIoT 设备之间可能建立的关系类型如 Figure 14.11 所示。结果，SIoT 可用于协调策略、社交化游戏化以及虚拟化平台，也可在其他物联网应用中建立设备之间的新型通信方式\
  \ \\[58\\]。\n\n![Figure 14.11 SIoT 设备之间的关系类型。](img/fig14_11_B.jpg)\n\n\n\n# 图 14.11\
  \ SIoT 设备之间的关系类型。\n\n因此，SIoT 的主要任务之一是管理关系。社交化对象的好处在于，与独立工作的对象相比，它们的响应时间和准确性得到了提升。因此，随着服务和功能的复杂性增加，物联网（IoT）趋向于更加“社交”。当\
  \ SIoT 可以在其他物联网应用场景中实现时，物联网应用中的传感器设备也可以成为 SIoT 的一部分，与其他设备建立“社交”形式的通信。当对象首次被引入网络时，它需要被分配一个\
  \ ID、一个包含网络中其他对象的静态和动态信息的配置文件，以及设备所有者指定的用于控制其行为的设置或权限 \\[59\\]。此过程由设备所有者通过与服务器建立通信并创建账户来完成\
  \ \\[60\\]。\n\nSIoT 的另一个主要关注点是信任管理，以确定哪些设备是恶意的，哪些是善意的。因此，根据每个对象的可信度，识别出不同特征的信任类型\
  \ \\[59\\]。由于建立物联网设备之间社交关系的系统，也会出现针对该系统的特定信任攻击。诽谤攻击会损害某些设备的声誉，从而降低它们被选中的机会。诽谤攻击会影响信任反馈。洗白攻击会清除设备的负面声誉。歧视性攻击针对组内连接较弱的设备，以孤立该设备。机会主义服务攻击是由恶意设备执行的，这些设备通常提供低质量服务，但会提升性能以获得信任，然后参与其他类型的攻击。投票填充攻击专注于推荐恶意对象，以便它们被选中。最后，自我推广攻击会广播关于……的良好反馈……\n\
  \n\n\n# 第二层：关键技术\n\n这些技术对于教育转型至关重要。应包括教学/学习过程管理系统、支持远程访问的虚拟教室以及自主管理的监控空间。还可考虑将传感器和执行器以及通信技术纳入其中，以实现智能环境内部的通信。可考虑的技术包括环境光的亮度及其质量、以及用于控制百叶窗、窗帘和灯光的执行器系列。这些技术可用于监测环境并分析学习绩效、进行教育数据采矿、提供电子书或交互式书籍。此外，所有促进远程访问和虚拟教学的技术，如增强现实、虚拟现实和交互机器人，也可纳入此层。\n\
  \n# 第三层：环境控制与管理\n\n该层的技术能够提升智能教育的体验。当组织内存在多个环境时，建议从更高层次（集中或分布，取决于设计）进行管理任务。实时跟踪课堂内的移动量、声音水平以及正在进行的活动等事件非常重要。环境管理系统可智能判断是否需要因课堂参数（影响学生舒适度和表现的指标）出现问题而将小组调至特定教室。此类警报可通过短信或电子邮件直接发送。\n\
  \n# 第四层：云存储\n\n将智能环境中产生的数据存储于云端非常有意义。通过这些数据和相应的工具，可长期、详细地分析学习过程。在此层中，可采用最新的深度学习和人工智能（AI）技术，结合行为分析系统与环境参数或活动特性，得出结论，进而开发或完善管理系统的推理规则。\n\
  \nFigure 14.13 shows the proposed layered model for smart education:\n\n![Figure\
  \ 14.13 Layered model for smart education.](img/fig14_13_B.jpg)\n\nFigure 14.13\
  \ Layered model for smart education.\n\n## 14.4.10.2 Benefits of Smart Learning\n\
  \n根据 Alcatel-Lucent Enterprise 的研究 \\[66\\]，物联网（IoT）在教育领域的应用可带来以下益处：\n\n* 新的个性化教学方法，通过数字书籍和游戏化学习等更具活力的体验实现。\n\
  \n* 通过新型音视频设备、数字视频录像机、流媒体平台和在线测试，提升学生绩效。\n\n* 为学校行政团队简化任务，通过对基础设施的主动监控以及更高效、更具盈利性的空调、照明和学校管理流程，实现更高效的运营。\n\
  \n* 为学生和教师提供更安全的环境，借助现代监控系统、集中式门锁以及基于追踪的校车系统。\n\n* 通过 IoT 实现能源效率和成本节约。IoT 连接的灯光和其他设备可定时、自动化，例如灯光可根据时间表或\
  \ occupancy sensor 设置，在房间空置时自动关闭。\n\n## 14.4.11 Internet of Nano Things (IoNT)\n\
  \n“Internet of Nano Things”（IoNT）概念源自“纳米技术”。该术语最早于 1959 年由 R. Feynman 在《There’s\
  \ Plenty of Room at the Bottom》一文中提出 \\[67\\]。文中讨论了通过创建更小、性能更高的设备来 miniaturize 已有技术的可能性。1974\
  \ 年，Taniguchi \\[68\\] 尝试将纳米技术定义为在 1 至 100 纳米尺度上制造物体的过程。\n\nM. Roco 于美国国家纳米技术倡议定义了纳米技术发展的不同世代\
  \ \\[69\\]。第一代与材料科学及其性能提升相关，通过引入“被动纳米结构”（如涂层或碳纳米管强化塑料）实现。第二代采用“主动纳米结构”，例如通过生物活性实现药物精准递送至特定细胞或器官，可通过在纳米颗粒表面涂覆特定蛋白实现。第三代和第四代复杂度更高：第三代基于包含“特征纳米系统”的高级纳米系统，包含数千个交互组件；第四代则基于分子纳米系统，用于控制人工器官的纳米材料发展。最后，第五代可在系统中加入人工智能和认知意识\
  \ \\[70\\]。Figure 14.14 将每一代与时间对应。\n\n![Figure 14.14 Nanotechnology generations.](img/fig14_14_B.jpg)\n\
  \nFigure 14.14 Nanotechnology generations.\n\nIoNT 的核心是纳米规模设备与现有网络及互联网的相互连接，形成一种新的网络范式——“Internet\
  \ of Nano-Things”。IoNT 可定义为能够通过 Nano Communication 相互交换数据的微型物理实体网络。\n\nIoNT 基础设施可采用纳米设备结合\
  \ IoT、传感器以及多种计算技术实现。该基础设施主要受应用领域及带宽、连接数量/设备数量或能源限制的影响。IoNT 的普及与扩展取决于设备处理能力、低成本大容量存储、智能天线以及智能\
  \ RFID 标签技术的进步。\n\nIoNT 面临的主要挑战之一是确保用户及其敏感数据的隐私与安全。由于关键数据通常通过公共网络（即 Internet）在设备间通信，隐私泄露的担忧随之上升。此外，经济投入大是限制\
  \ IoNT 市场增长的另一重要因素，因为 nanotechnology 的正确发展和研究需要显著资金投入。当前，IoNT 的发展主要基于两大通信方向：\n\n\
  * **Electromagnetic Nano Communication** \\[71, 72\\] 与基于纳米材料的元件通过电磁（EM）辐射进行接收和传输相关。\n\
  \n* **Molecular Communication** \\[73, 74\\] 指通过分子编码的数据进行接收和传输。\n\n### 14.4.11.1\
  \ Network Architecture of IoNT\n\n\n\n\n为了设计和部署 IoNT，无论应用领域如何，以下设备和元素应被视为 IoNT 架构的基础部分（参见\
  \ Figure 14.15 \\[75, 76：\n\n![Figure 14.15 Network architecture of IoNT.](img/fig14_15_B.jpg)\n\
  \nFigure 14.15 Network architecture of IoNT.\n\n1. **纳米节点**：纳米节点是具有有限存储容量的小型设备，安装在日常用品（如钥匙、书籍和小工具）中。这些设备能够执行简单任务和计算。所测数据通过短距离传输。植入人体的生物传感器可视为纳米节点。\n\
  \n2. **纳米路由器**：纳米路由器是计算能力更强的设备，负责 interconnecting（互连）不同的纳米节点。纳米路由器还能在不同的纳米微接口之间路由数据，或将数据发送至具有\
  \ Internet 接入权限的网关。\n\n3. **纳米微接口设备**：这些设备负责将纳米路由器来的信息添加后，传输至网关，反之亦然。网关实现不同事物与 Internet\
  \ 的连接，以及与传统通信网络的连接。这些设备还与其他纳米微接口设备进行通信。\n\n4. **网关**：它提供对整个网络及网络中所有物体和实体的 Internet\
  \ 接入。\n\n5. **设备之间的链路**：完整连接所有纳米系统必须使用适合环境和网络需求的协议和技术。\n\n#### 14.4.11.2 用途与益处\n\
  \n如本节所示，纳米技术将在科学和工程创新的发展中发挥至关重要的作用。纳米技术广泛应用于能源、通信与信息技术、航空航天、医药、国防和交通等领域。\n\n纳米技术还承诺在电动汽车行业带来重要进展，实现能源高效电池、光伏板和燃料电池。此外，纳米技术可为清理作物土壤和水体污染提供有趣的解决方案，并提升医疗和医疗保健水平\
  \ \\[77\\]。以下是可从纳米技术中受益的应用：\n\n*   **医疗保健**：纳米技术可帮助研发用于快速疾病检测的高级工具，以及对抗疾病的新型治疗手段。\n\
  \n*   **电子设备**可受益于先进的芯片和个人电子设备。\n\n*   在 **体育器材** 中，纳米技术可提升摩托车头盔的安全性，并让棒球棒、网球拍等材料更耐用。\n\
  \n*   **基于纳米技术的织物** 能抵抗污渍和细菌生长，帮助改善空气质量。\n\n*   **家用产品**如去渍剂、抗菌清洁剂、油漆、密封剂、空气净化器和过滤器等，可通过纳米技术得到改进。\n\
  \n*   **能源创新**，如更高效的光伏板、更强、更轻的风力涡轮机、更轻的汽车部件以及更高的燃油效率，均由纳米技术驱动。\n\n*   **工业与食品包装**\
  \ 可借助纳米技术防止污染，并延长食品保鲜时间。\n\nIoNT 仍面临一些问题和挑战需解决。研究人员应考虑上下文管理、安全、隐私、服务组合以及发现等问题。\n\
  \nIoNT 设备应研发新的安全与隐私机制，确保纳米传感器收集的数据得到安全处理。面向服务的架构更适合让纳米传感器和纳米网络保持兼容，以便处理大量不同格式的数据。\n\
  \n## 14.5 结论\n\n物联网（IoT）近年来不断演进并增加了功能。预计随着智能设备数量随时间增长，其发展将持续。对能够感知环境变化并据此执行操作的智能事物的连接兴趣，源于在设备中引入能够（通常无线）通信的传感器，以及技术进步使传感器尺寸和精度显著提升。本章提供了物联网各领域的概览以及传感器设备在各领域中的作用。同时，也讨论了各\
  \ IoT 领域的创新与挑战。通过此，读者获得了当前物联网的整体认知以及使 IoT 系统能够提供服务的传感器设备的一般性知识。\n\n物联网在多个领域的应用表明，其适用范围将覆盖生活的方方面面，带来更可持续、包容且繁荣的未来\
  \ \\[78\\]、\\[79\\]。这将导致数以百万计的设备部署，对无线技术的改进以提供服务并实现大规模通信的需求也随之提升。人工智能是另一项将融入每个 IoT\
  \ 领域的技术，将改变当前关于遥测和从这些数据中获取的智能应用的范式。不可避免地，这将导致许多人的工作和生活方式发生重大变化，需要增加具备 AI 资质的人员来管理这些应用。随着物联网的普及，生产成本显著下降，使该技术在发达国家和发展中国家都能更快更广泛地被采用，以实现更高效的系统。尽管当前的地缘政治背景导致供应链延误和成本上升，整体趋势仍是\
  \ IoT 设备和系统成本降低、更易获取，成为服务提供商提供的另一项服务。因此，服务提供商应提升通信并提供新的云服务，以解决已部署的物理基础设施的当前限制。\n\
  \n5G 是目前最受欢迎的无线通信技术，用于满足未来网络需求，但升级基础设施的成本是实施下一代网络的主要障碍，导致其部署时间可能超过预期。尽管如此，5G 的普及度体现在持续发表的研究论文数量上，预计当\
  \ 5G 网络全球部署时，将包含目前 5G 设备规格之外的新功能和改进。\n\n保障这些网络及其传输的数据安全至关重要，确保下一代 IoT 系统的成功实施。随着人与机器的连接日益紧密，IoT\
  \ 系统提供的安全机制应确保完整的隐私和保密性，防止对 IoT 能力的误用和欺诈。\n\n认识到 IoT 能为社会带来的好处以及其错误使用可能带来的问题，可促使实现更具现实性的发展，并帮助政策制定者根据新技术环境调整现行立法。最后，新的\
  \ IoT 范式包含物联网纳米技术（IoNT）等应用，这些应用需要对医疗、农业等领域的应用域进行深入的伦理评估与更新。该 IoT 领域仍处于起步阶段，其首次可操作的实现将在更远的未来出现。\n\
