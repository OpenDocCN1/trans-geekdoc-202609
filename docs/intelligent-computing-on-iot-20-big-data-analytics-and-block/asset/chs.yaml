  \n## 21.5 结果与讨论\n\n本研究的目标是通过降低数据维度和使用特征选择技术来提升模型性能。采用了 NSL-KDD 数据集，并应用随机特征选择技术以降低模型复杂度和训练时间。虽然该方法在本研究中表现有效，但其效果可能取决于数据的具体特性。\n\
  \n使用能够处理数据不规则分布的`随机森林`技术，使准确率超过 98%。`随机森林`方法采用自助采样程序，提升少数类别的表示，从而减少分类错误并提高模型准确率。该方法在识别数据不平衡方面表现出色。此结果在图\
