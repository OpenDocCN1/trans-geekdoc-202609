  \ evacuation options for an individual in any classroom.\n\nNotice that in the model\
  \ we use both timed transitions and immediate transitions. Timed transitions are\
  \ used to model people moving from one cell to another cell. For example, in transitions\
  \ *t*[0] − *t*[6] all model people walking out of a classroom, in which *t*[0] stands\
