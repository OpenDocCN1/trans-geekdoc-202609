  本节概述了实时云应用可能面临的各种挑战以及云应用的未来。事实上，任何新技术最初只是一个想法，在其出现时提供 benefits，但也会遇到各种限制和挑战。云计算也是如此，其主要挑战可以列举为：\n\
  \n#### 3.4.1 主要挑战\n\n将实时应用与云相结合并非易事；相反，这涉及实时虚拟化的预测功能。因此，实时应用在云中的采用面临着根本性的挑战。关键的可预测性障碍直接与硬件资源的受限访问相关。这些挑战如下：\n\
  \n*   云计算高度依赖于底层网络基础设施。因此，网络元素面临的挑战（如服务器故障、拒绝服务攻击、恶意软件攻击、电源中断、通信延迟和安全性）也会在云端出现 \\\
  [7\\]。\n\n*   云服务提供商应保持良好的 SOA（服务导向架构）以高效提供不同服务。\n\n*   处理数据存储的带宽、容量和位置时应当谨慎考虑，因为应用性能直接受数据存储的影响。\n\
  \n*   由于各供应商拥有不同的条款和支持，云计算及其服务尚未完全成熟。\n\n\n\n\n# 3.4.2 未来方向\n\n云计算的最重要目标是提升网络，使其具备高带宽、高速以及更可靠和安全的网络——此外，还需确保数据中心在更有效的数据访问算法下保持数据保密性。实现该目标将吸引市场中的众多企业加入云计算。由于所有操作都将在云端执行，保证良好的网络性能是一项必要条件，尤其是在需要可扩展性的情况下。以太网也可以利用云端，因为其关键挑战——如何在不降低网络吞吐量的前提下防止争用——可以得到解决。视频流是实时云计算能够保障所需网络资源的应用之一。X-Gigabit\
  \ 解决方案正逐渐成为不仅能够提升网络吞吐量，而且能够轻松适应云端运行的虚拟机（VM）数量增长的有前景的解决方案。\n\n## REFERENCES\n\n1.\
