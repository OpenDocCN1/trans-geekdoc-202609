  \n42. J. Wang, J. Chen, Y. Ren, P. K. Sharma, O. Alfarraj, and A. Tolba, “基于区块链工业物联网的数据安全存储机制”，Comput.\
  \ Ind. Eng. 卷 164，第 107903 页，2022 年，doi: [10.1016/J.CIE.2021.107903](https://dx.doi.org/10.1016/J.CIE.2021.107903)。\n\
  \n43. R. Cerchione, P. Centobelli, E. Riccio, S. Abbate, and E. Oropallo, “区块链将走进医院，数字化医疗服务：设计分布式电子健康记录生态系统”，Technovation。第\
  \ 102480 页，2022 年，doi: [10.1016/J.TECHNOVATION.2022.102480](https://dx.doi.org/10.1016/J.TECHNOVATION.2022.102480)。\n\
  \n44. G. Zhang, X. Zhang, M. Bilal, W. Dou, X. Xu, and J. J. P. C. Rodrigues, “基于区块链和深度学习的医疗保险欺诈识别”，Futur.\
  \ Gener. Comput. Syst. 卷 130，第 140–154 页，2022 年，doi: [10.1016/J.FUTURE.2021.12.006](https://dx.doi.org/10.1016/J.FUTURE.2021.12.006)。\n\
  \n45. G. Zhang and N. J. Navimipour, “IoT 导向的医疗管理系统全面系统综述：应用、技术、趋势与开放问题”，Sustain.\
  \ Cities Soc. 卷 82，第 103914 页，2022 年，doi: [10.1016/J.SCS.2022.103914](https://dx.doi.org/10.1016/J.SCS.2022.103914)。\n\
  \n# 13 污染监测与治理在智慧城市中使用物联网\n\nJavier Rocher, Sandra Viciano-Tudela, Alberto Ivars-Palomares,\
  \ and Jaime Lloret\n\nUniversitat Politècnica de València, Grao de Gandia, Spain\n\
  \nDOI: [10.1201/9781003326236-13](https://dx.doi.org/10.1201/9781003326236-13)\n\
  \n## 13.1 介绍\n\n自 20 世纪末以来，农村向城市迁移（农村外流）显著增加。这一现象始于工业革命，因为城市新增了就业机会。如今，55% 的人居住在城市，预计到\
  \ 2050 年，这一比例将上升至 65% \\[1\\]。城市人口的增长导致社会冲突和环境退化。为提升生活质量并减少环境损害，实施了不同的政策，并引入新技术，这些政策和技术共同催生了所谓的智慧城市。与此同时，新型治理形式也在发展。\n\
  \n### 13.1.1 智慧城市\n\n智慧城市概念近年来迅速发展。根据欧洲委员会的说法，“\\[a\\] 智慧城市是通过数字解决方案，使传统网络和服务更高效惠及其居民和企业的地方”\
  \ \\[2\\]. 因此，智慧城市必须具备信息和通信技术（ICT）解决方案。智慧城市的历史可以追溯到 20 世纪 60 年代末的洛杉矶，当时使用了计算统计分析。随着\
  \ ICT 的改进，近年来越来越多的城市计划成为智慧城市。在这一过程中，企业发挥了重要作用。\n\n一个例子是 Cisco Systems，它与克林顿基金会合作，与旧金山、阿姆斯特丹和首尔于\
  \ 2006 年共同推出 Connected Urban Development 计划，投资 2500 万美元。智慧城市的主要目标是通过数字化提升可持续性。需要强调的是，可持续性不仅从环境角度考虑，还包括人类和经济因素。\n\
  \n智慧城市的支柱之一是物联网（IoT），它有多种定义。但大多数作者一致认为，IoT 包括智能手机、耳机、洗衣机、灯具、可穿戴设备等，这些设备连接互联网并能发送和接收信息\\\
  [3\\]。\n\n用于监测的 IoT 设备配备微控制器或处理器，负责读取传感器数据并控制其开关。处理器的 RAM、闪存和计算能力高于微控制器，但微控制器成本更低\\\
  [8\\]。选择哪种取决于所需的计算需求。IoT 项目通常使用处理器，将数据发送到互联网，由更强大的计算设备进行分析。\n\n\n\n\n-   物联网设备的一个问题在于能耗。在某些情况下，这些设备由电池供电。这意味着它们的能耗必须降低，以减少能源成本。已提出了不同的解决方案来减少这些设备的能源使用\
  \ \\[[9\\]。\n\n智慧城市是城市发展的未来。然而，需要解决的重要差距包括：(I) 智慧城市需要大量的资本投入。(II) 对技术服务和新技术的依赖增加。(III)\
  \ 部分群体对新技术持不愿意或不适应的态度。(IV) 住房价格上涨阻碍了年轻一代获得住房。\n\n### 13.1.2 污染与环境退化\n\n污染是指对生命或基础设施有害的物质、能量或辐射的存在。人们通常认为人类导致所有污染和环境退化。然而，污染可以是人为的或自然的起源。自然污染事件的例子包括火山喷发，它们会向大气中释放大量的二氧化硫（SO[3]）和二氧化碳（CO[2]），以及自然起源的森林火灾（由雷暴引起）。然而，自然环境退化会与环境保持平衡，不同物种已适应该环境。例如，地中海森林中存在耐火物种。环境可以通过人为污染来减缓污染。然而，在某些情况下，环境减缓能力需要提升以吸收人为污染。\n\
  \n人为污染是由于持续污染或环境灾难的结果产生的。环境灾难的例子包括核事故，如福岛（日本）和切尔诺贝利（乌克兰）；油污，如 Prestige（西班牙加利西亚海岸）；Deepwater\
  \ Horizon 爆炸（美国）；Sanchi 油轮碰撞（东中国海）；矿山有毒泥浆泄漏（如西班牙的 Aznalcollar）；布拉干萨水库灾难（巴西）；以及田纳西州\
  \ Kingston Fossil Plant 煤灰渣泄漏。在这些事故中，大面积区域立即受到污染，其影响可持续多年。随着时间的推移，污染物的累积会导致环境灾难。例如，过量的化肥进入土壤并随\
  \ groundwater 流入，导致硝酸盐污染；氯氟烃（CFC）产生的臭氧层空洞；全球变暖。例如，水体的富营养化（如西班牙的 Mar Menor）是污染物累积的一个区域例子。Mar\
  \ Menor 长期遭受各种污染。由于城市化，污水处理系统不足，采矿活动向湿地区域倾倒废弃物。1979 年塔洪-塞古拉水系转移的到来导致农业和畜牧业增加。Mar\
  \ Menor 的水体因未达到与农业和畜牧业相关的硝酸盐法规，以及法律制度缺乏实际应用而恶化。因此，Mar Menor 水体的富营养化是由于富含硝酸盐的排放引起的，导致水中缺氧并造成海洋生物大规模死亡\
  \ \\[10\\]。\n\n在城市地区，污染是一个严重问题。根据世界卫生组织（WHO）的数据，十人中有九人呼吸污染空气，每年有七百万人死亡 \\[11\\]。不同研究结论表明，呼吸污染空气的影响等同于吸烟。在城市地区，污染不仅存在于空气中。土壤和水体污染也影响人类健康。在土壤中，重金属、烃类和其他物质的浓度可能通过摄入土壤或吸入蒸气与人体接触。在水体中，污染通过饮用水途径到达人类。\n\
  \n一个污染问题是，产生污染的一方可能感觉不到其影响。跨境污染是一个关键问题，尤其在处于冲突中的国家之间 \\[12\\]。例如，酸雨。它造成的破坏包括欧洲森林的消失、加拿大和美国湖泊生物的灭绝，以及对中国和印度人类及作物的危害。酸雨是由硫氧化物和氮氧化物在水中反应生成硝酸、亚硫酸和硫酸，这些酸降低雨水的\
  \ pH 值，导致水体酸化，影响野生动物。此外，酸雨还威胁人类建筑、艺术纪念碑和呼吸系统健康 \\[13\\]。\n\n最后，环境退化不仅仅是污染的负面影响。生态系统的退化可以在不存在污染物的情况下发生。栖息地毁灭、水资源减少、土壤压实、野生动物灭绝或外来物种的引入是自然环境退化的例子。\n\
  \n### 13.1.3 治理\n\n治理是指公民参与决定可能影响他们的决策的过程。在传统民主制度中，人民选举他们的代表。这些政治家在决策时并不被要求考虑公众意见，因此政治精英位于社会金字塔的顶端。随着民主制度的演变，治理概念被引入。治理旨在减少政治精英与公民之间的权力金字塔。这意味着新政府应包含公民参与。欧洲委员会将治理定义为在欧盟行使权力并使公民更加接近的规则、程序和实践的集合。其原则包括：机构透明度、在决策中参与社会、实施一致的政策、以及制定有利于就业的监管框架\
  \ \\[14\\]。基于此，应用治理的公共行政包含多个互补机构，确保公民权利，如问责制、公共伦理指南和公众参与计划。\n\n信息通信技术（ICT）的使用改善了治理。如今，几乎没有哪个政府不需要一个网页。政府可以在网页上上传影响不同机构的项目，感兴趣的人可以比项目仅以纸质形式存在时更快地获取信息。ICT\
  \ 在治理中的另一个改进是电子公投的可能性。在这些公投中，公民可以在不同项目之间投票，使政府选择公民更倾向的项目。\n\nICT 带来的所有改进及其带来的好处，也可能带来必须解决的问题。\
  \ (I) 一些群体，如老年人，可能对数字环境感到不适。因此，他们更有可能不参与其中。因此，必须便利他们进入或创建物理空间，以便他们能够互动并参与项目。 (II)\
  \ 安全是一个关键因素。必须防止第三方操纵公众参与过程。 (III) 应开展广告活动，让公民了解公众参与过程的存在。\n\n### 13.2 污染与环境退化\n\
  \n在本章这一部分，我们将重点阐述城市中不同类型的污染及其产生的影响。\n\n### 13.2.1 土壤污染与退化\n\n\n\n\n土壤污染和退化影响农业和城市土壤。主要问题之一是土壤板结，由土木工程和农业机械引起\
  \ \\[15\\]。土壤板结是外部压力导致的密度增加，减少或消除空气孔隙。土壤板结不利影响土壤的蒸渗，减少地下动物、微生物和植物根系可用的氧气。另一个影响是降雨水渗透减少，土壤保持雨水的能力下降，增加洪水风险。恢复板结土壤困难，因此土木工程的合理利用至关重要。建筑和道路会导致土壤板结。在公园、人行道和裸露地面上使用农业机械会产生板结。土壤板结的一个例子是人行道。Figure\
  \ 13.1 展示了西班牙加尼亚（Gandia）绿地中因人行道造成的土壤板结和侵蚀形成的欲路示例。另一个导致环境退化的事实是城市大面积清除植被。一些城市因树木维护成本高而清除街道和大道上的树木，这导致城市热量上升、湿度下降。树木在城市中具有重要优势，因为它们吸收污染物、降低热量，并为城市野生动物提供庇护。\n\
  \n![Figure 13.1 Example of a desired path.](img/fig13_1_B.jpg)\n\nFigure 13.1 Example\
  \ of a desired path.\n\n沥青和建筑物阻碍土壤的自然更新，因为垃圾无法分解。这导致土壤分解循环和养分更新的紊乱。Figure 13.2 展示了正常条件下的土壤分解循环。氮化细菌可以在根部或土壤中固定大气氮，将其转化为铵。此外，动物以植物为食，分解者分解氮。分解者通过氨化作用将其转化为铵。随后，硝化细菌将铵转化为亚硝酸盐，再转化为硝酸盐。硝酸盐通过同化过程被植物吸收。或者，它可以通过反硝化作用返回大气，由反硝化细菌产生氮气。土壤退化干扰土壤生物，可能影响人类食物生产\
  \ \\[16\\]。\n\n![Figure 13.2 Soil decomposition cycle.](img/fig13_2_B.jpg)\n\nFigure\
  \ 13.2 Soil decomposition cycle.\n\n城市污染导致城市热岛效应 \\[17\\]。该现象表现为城市中心温度高于周边地区。原因包括建筑物、沥青、污染物以及残余热的消除。沥青因阳光加热土壤后通过红外辐射或反射光释放热量，且因颜色黑色，太阳光被吸收，导致热量积累并释放到环境中。建筑物阻碍风力循环，使热量在城市内积聚。残余热在城镇产生并释放到环境中。最终，污染物有两个影响：(I)\
  \ 污染物与大气反应产生热量。(II) 污染物如 CO₂ 吸收红外辐射，导致温度上升 1°C 至 3°C。\n\n另一个土壤问题为土壤流失。土壤流失由风和水的侵蚀与运输引起。如前所述，沥青增加雨水径流，进而增加土壤流失。此外，植被减少会导致根系固定土壤的能力下降。土壤流失会降低土壤肥力。估计创建\
  \ 1 厘米土壤需要 100 到 1,000 年。\n\n到目前为止，我们讨论了土地退化。现在，我们转向土壤污染。土壤污染物的存在方式取决于其浓度和物理特性。在低浓度下，污染物被土壤基质吸附；此外，挥发性污染物如烃类和汞会在土壤大气中达到平衡。当污染物浓度升高时，土壤基质无法再吸收它们，形成自由层，向下渗透至地下水位。因此，若从含水层中移除污染物并消除污染源，土壤可能会受到污染。土壤污染物的例子包括烃类、重金属、农药、氮肥硝酸盐和病原微生物。通常，重金属出现在工业区或去工业化区域。烃类可出现在与重金属相同的区域、加油站以及油箱附近。在工业区，污染物通过公司排放或因水流携带被带入土壤。另一个来源是雨水将大气中的污染物带入土壤。烃类通过可燃储存设施的泄漏进入土壤。其他污染物（硝酸盐、农药和化肥）来源于花园、农田或水体运输。若地下水受这些污染物污染并用于灌溉，这些污染物会返回土壤。\n\
  \n此外，塑料在所有部门的使用日益增多，导致微塑料累积增加，大多数情况下进入水体或土壤本身，加剧污染。虽然微塑料目前因对水体的显著污染而最为人知，但过度增加使其大量渗入土壤。这些微塑料被小型动物摄入或沉积在植物上，最终进入食物链并进入人体\
  \ \\[18\\]。我们将微塑料定义为任何形状规则或不规则、直径在 1 μm 至 5 mm 之间的合成固体颗粒或聚合物基质，无论是否为主要或次要制造来源，且不溶于水\
  \ \\[19\\]。这些微塑料是新兴且普遍的污染物，已成为环境挑战 \\[20\\]。\n\n### 13.2.2 Water Pollution\n\n本节将重点讨论水污染。首先，必须了解水循环。水循环自古以来被知晓，主要由太阳能驱动。太阳加热海洋、海\
  \ seas、其他水体中的水，使其蒸发。水分通过冷凝形成更重的水滴，最终回落地面（降雨）。雨水流经山谷和河流，最终回到海洋。人类利用这水源进行工业、饮用或灌溉。当前全球年水需求约为\
  \ 6,000 至 7,000km³。然而，全球地下水储量约为 7,000,000 km³。该水体通过降雨和渗透过程每年积累。近年来，由于过度开采和降雨不足，这一储量受到影响，导致地下水位下降\
  \ \\[21\\]。\n\n\n\n如上文所述，水循环对行星上生物的生命至关重要。该循环中水质的改变可能导致系统发生重大变化。城市化是导致水循环（地下水和表面水\
  \ \\[22\\]）质量发生改变的最具代表性的例子之一。这些主要的人为改变引发了各种自然灾害。在前面的段落中，我们讨论了沥青路面造成的土壤结构和质量改变的影响。\n\
  \n水中含有不同的污染物，如有机物、固体、肥料、杀虫剂、营养盐和内分泌干扰物。在有机物中，我们可以区分生化需氧量（BOD）和化学需氧量（COD）。BOD 是微生物可以分解的有机物，而\
  \ COD 是总的有机物 \\[23\\]。这些参数的单位是 mg O₂/l，因为降解有机物所需的氧量是以此测量的。测定 BOD 时，样品必须放入密闭容器中并保留微生物一段时间。通常在水分析中，进行的是\
  \ BOD₅ 测量。BOD₅ 是微生物在五天内消耗的氧量。另一个参数是 BODₗ，它是降解水中所有可生物降解有机物所需的氧量。使用 BOD₅ 的原因是五天是英国最早实施这些测量的河流中水体停留的平均时间。测定\
  \ BODₗ 时，样品通常保留 21 天。由于 BOD 的测量速度较慢，COD 常常被使用。COD 是一种测量方法，大约需要两小时，并且可以经验性地与 BODₗ\
  \ 的值相关联。此外，COD 与 BOD 之间的差异提供了关于水中不可生物降解的有机污染物的信息。还可以引入总有机碳（TOC）参数，它测定水中有机物氧化后生成的\
  \ CO₂ 的量。该参数与 BOD 和 COD 相关，但目前仍有少量研究探讨其广泛应用 \\[24\\]。\n\n固体是水中另一种存在的污染物。固体的性质多种多样。固体可以是矿物、微生物或土壤。固体可能来自其他污染物的存在，也可能来自水的拖曳作用。其他水污染物是营养盐，它们是生命生长所必需的。营养盐的存在会导致水体出现富营养化问题。主要的营养盐是氮和磷。这些元素来源于洗涤剂、人类和动物排泄物、工业等。最终，内分泌干扰物是一种新兴的污染物。这些污染物是随着分析技术的改进而被发现的。关于这些物质，需要更多的信息。这些污染物的来源是药物和复杂化合物的使用。内分泌干扰物会在生物体内引起激素变化，导致动物性别的改变，并可能阻碍繁殖。\n\
  \n水体污染可以通过雨水、废水、工业非法排放或污染事件来发生。雨水会将大气或土面上的污染物带入水体。废水是家庭、工业和公共服务使用水后的结果，因使用而失去可用性，成为废弃物。污水设施将城市区域的废水输送至污水处理厂（WWTP）。非法排放是指公司或个人未经授权排放废水的行为。这些排放会导致显著污染，恶化水质，对人类健康造成危害\
  \ \\[18\\]。\n\n\n\n另一种由空气污染引起的现象是光化学烟雾。烟雾与污染物的存在以及光照相关。它表现为工业区产生的气体在接触阳光后反应形成的铅灰色或黑色云\
  \ \\[31\\]。Figure 13.3 展示了光化学烟雾过程中的主要污染物。首先，有发起过程的主要污染物。排放物可以来自自然或人工来源。主要污染物包括悬浮颗粒、烃类（NOx）、一氧化碳（CO）和\
  \ CO[2]。这些主要污染物反应，产生次生污染物，如 peroxyacetyl nitrates（PANs）、臭氧（O[3]）、H[2]SO[4] 和 HNO[3]。Figure\
  \ 13.4 展示了烟雾光解过程中的反应。其中一个反应是 NO[2] 的臭氧形成，光照射 NO[2] 产生 NO 和 O 的自由基，氧原子与 O[2] 结合生成\
  \ O[3]。另一个反应是烃类生成自由基，烃类与 O[2] 结合生成自由基，随后与 O[2] 结合形成 RO[3]\\*，该自由基再与另一个烃类结合生成乙醛。最终，在光化学烟雾中，PAN\
  \ 形成。\n\n![Figure 13.3 Smog photochemical.](img/fig13_3_B.jpg)\n\nFigure 13.3 Smog\
  \ photochemical.\n\n![Figure 13.4 Photochemical smog reactions.](img/fig13_4_B.jpg)\n\
  \nFigure 13.4 Photochemical smog reactions.\n\n在此情况下，RO[3]\\* 分子与 NO 结合生成 RO[2]\
  \ 和 NO[2]。RO[3]\\* 分子可以与氧结合，形成 RO[2] 和臭氧。除了与 NO 和臭氧结合，该分子还可以与 NO[2] 结合，生成 PAN。烟雾的反应是一个循环，最终结果是另一个\
  \ NO[2]。因此，一旦化学反应开始，只有当大气中所有烃类被消除时，反应才会停止。这与有毒化合物的产生一起，使其成为人类健康的危险事件。其危害的一个例子发生在\
  \ 1952 年的伦敦大烟雾事件中，当时 4,000 人死亡，100,000 人出现呼吸问题。\n\n另一种有害健康的空气颗粒物是空气中的颗粒。它们可分为两类：主要颗粒和次要颗粒。主要颗粒直接从排气管、灰尘和沙粒中排放。次要颗粒是在大气中因被称为前体的气态物质的化学反应形成的。颗粒物是空气污染的标准指标，影响的人数多于其他任何污染物。其主要成分包括硝酸盐、氨、氯化钠、硫酸盐、矿物粉末、水和烟灰。了解有害微粒的危害促使科学家根据大小和来源对它们进行特征化。颗粒的危害性受其大小影响，导致不同类型的疾病。在空气站中最常监测的颗粒是\
  \ PM10 和 PM2.5。其气动直径分别为 10 微米和 2.5 微米 \\[32\\]。我们还发现 PM1 颗粒小于 1 微米。细菌、病毒和超细微颗粒属于这种微粒。\n\
  \nWHO 指出，直径小于 2.5 微米的颗粒导致最严重的疾病，因为它能到达肺部，进入血液，并影响心脏 \\[33\\]。多项研究关注 PM2.5 颗粒的重要性和侵袭性。除了因体积小而危害，这些颗粒还含有污染物。其小尺寸使其能在空气中长时间悬浮并长距离传输。\n\
  \n尽管未发现颗粒在没有影响健康的阈值，WHO 制定了一些限值，规定这些颗粒必须保持在一定水平。最小颗粒（PM2.5）年平均应为 5μg/m³，日均应为 15\
  \ μg/m³。同时，较粗颗粒（PM10）的年平均应为 15 μg/m³，日均应为 45 μg/m³ 24 小时。\n\n### 13.2.4 噪音污染\n\n\
  噪音污染是任何引起人们烦扰、风险或损害的振动，影响人们的活动、物品或环境，而不考虑产生它们的声学来源 \\[34\\]。WHO 将噪音定义为超过 65 分贝（dB）的振动。如果噪音超过\
  \ 75 dB，则被认为是有害且疼痛的，120 dB 更是如此。\n\n人口增长、公共交通使用减少、私家车增加、大型建筑的建造以及休闲区的扩张，导致大城市噪音污染增加。欧洲环境署（EEA）数据显示，噪音导致\
  \ 72,000 次住院和 16,600 例早逝 \\[35\\]。噪音对人类的影响包括绩效下降、攻击性增加、疲劳、压力、睡眠紊乱和胃肠道疾病。在动物中，噪音会影响睡眠周期、交配周期和社会关系，甚至导致某些物种灭绝。\n\
  \n### 13.2.5 光污染\n\n光污染是人工光源产生的排放物，这些光源未指向地面，且地面反射的光向天空反射。光污染由人工光的过大功率和街灯或路灯设计不良引起\
  \ \\[36\\]。街灯的连接时间也应考虑，因为控制不善的照明系统会影响光污染。总体而言，这种污染主要发生在城市中。光污染是能源的浪费，因为光的目的不是照亮天空。因此，产生了与能源生产相关的污染物。\n\
  \n光照度指数的变化会影响生物体的生物节律 \\[37\\]。植物和其他动物的昼夜节律受影响。例如，鸟类可能偏离其方向或影响其繁殖周期。对人类而言，人工光会导致睡眠紊乱，进而引发某些疾病。在交通运输领域，眩光会影响驾驶员的视力并导致事故。此外，海运和空运也受高光污染的影响。\n\
  \n欧洲是光污染最严重的大陆之一，这部分是因为其相较于其他大陆的显著发展。西班牙是光污染增加第三多的国家，后跟希腊和马耳他。从全球角度观察，欧洲是光污染率最高的大陆之一。相反，非洲等大洲光污染较少，因为其发展水平较低。\n\
  \n### 13.3 监测污染\n\n本节分析不同方法和物联网技术，用于监测城市中的主要污染物。我们区分土壤、空气和水体中的污染物。此外，还分析光和声音监测，这些环境与它们相关。例如，污染物可以通过空气沉积到土壤中，之后被雨水携带到另一个水体或渗入地下水。\n\
  \n#### 13.3.1 土壤监测\n\n\n\n\n监测土壤使用物联网仪器是复杂的。土壤污染物很难监测，因为这些污染物被吸附在土壤基质中，并且在土壤中分布不均匀。需要在实验室中使用分析技术或使用分析仪器。\n\
  \n监测土壤中碳氢化合物的技术基于利用溶剂对土壤中的碳氢化合物进行脱附，并通过重量法、色谱法、质谱法等进行分析。这些技术需要实验室设备，且在大多数情况下无法在现场使用。为了监测美国（US）的碳氢化合物浓度，环境保护署（EPA）建立了标准方法（418.1\
  \ EPA）。该传统方法被推荐用于检测受污染区域，并使用更昂贵的方法确保土壤清洁 \\[38\\]。另一种方法是利用吸附碳氢化合物并改变其内在属性的材料来检测地下水中的碳氢化合物，该属性可被测量。例如，Yavari\
  \ 等人 \\[39\\] 提出使用硅棒覆盖的光纤。硅棒与碳氢化合物接触时会吸附它们，产生弯曲，影响光的传输。然而，该技术仍可更精确，因此需要进行工作以防止泄漏。使用传感器控制储层中油的水平并正确执行立法是控制该参数的最佳工具。\n\
  \n与碳氢化合物一样，监测土壤中的重金属也很复杂，因为重金属被吸附在土壤上。已提出了多种监测方法。其中一种方法是使用分光光度法。不同研究表明，人为向土壤中添加一定数量的重金属会改变其光谱\
  \ \\[40, 41\\]。这为利用卫星影像或无人机航拍来检测可能受重金属污染的区域提供了可能性。然而，利用遥感进行分光光度测量存在关键缺陷：(I) 遥感只能检测地表上的重金属污染，无法检测地下土壤中的污染。(II)\
  \ 植被覆盖土壤，导致无法测量土壤的反射率。因此，遥感虽能初步检测土壤污染，却无法用于验证污染情况，需要进行现场研究。\n\n技术是减少绿地用水的重要工具。湿度传感器可以最小化灌溉用水的用量，因为土壤湿度保持在田间容水量（土壤能保持的最大水量）和永久凋亡点（植物无法从土壤中获取水分的最小水量）之间。最近，配备红、绿、蓝（RGB）和红外相机的无人机已被用于分析植物状态并计算归一化差动植被指数（NDVI）。\n\
  \n### 13.3.2 水监测\n\n水被称为通用溶剂，因为它能溶解大多数物质。因此，许多物质会在水中被检测。水被用来运输人们产生的污染物。水的一个问题在于非法排放的存在。公司和个人必须仅在拥有排放许可的情况下，将污染物排放到污水系统中。然而，如前所述，非法排放仍在发生。\n\
  \n要在污水系统中检测非法排放，必须全天候了解污染物浓度的变化——废水质量每日、每年都在变化 \\[42\\]。体育赛事或节假日会影响废水质量。在 Figure\
  \ 13.5 中，我们展示了废水（固体）中污染物浓度的演变以及两个饺子的情况。夜间的污染物浓度低于白天。从凌晨 5 点开始，浓度在白天逐渐上升，直到中午。中午时浓度会有轻微下降，直到下午中段。此后浓度持续下降，直到次日。在发生排放时，浓度可能更高、更低或持平。通过监测不同参数，排放浓度与废水浓度相同的可能性会降低。传感器会在其他两种情况下检测到废水浓度的变化。为了消除因日常波动导致的浓度差异，必须将数值发送到中央节点，在那里数值会与历史数据系列以及附近传感器的数值进行比较。通过这些信息和人工智能的使用，可以检测到泄漏。\n\
  \n![Figure 13.5 Evolution of solids throughout the day and the effect of two discharges.](img/fig13_5_B.jpg)\n\
  \nFigure 13.5 Evolution of solids throughout the day and the effect of two discharges.\n\
  \n整合不同传感器可以控制水的物理参数 \\[43, 44\\]。浊度是一个可以用于检测非法排放的参数 \\[45\\]。浊度定义为水的透明度，取决于水中的固体和溶解物。测量浊度的三种方法是\
  \ Secchi disk、光学法和声学法。Secchi disk 方法是在水中放入一个圆盘并测量该圆盘不可见的深度，该方法较难实现自动化，因此不适用于连续监测。但目前志愿者仍使用它作为简单的水体监测手段\
  \ \\[46\\]。声学浊度传感器基于声学多普勒流剖面仪（ADCP），其原理是发射声波脉冲并测量声波回波。光学浊度传感器原理类似，但它发射光而不是声波，光电探测器用于捕获光信号。光电探测器可位于不同角度的光源旁。在\
  \ 180° 的位置，它测量水的吸光度（吸光计）。如果角度不是 180°，光电探测器测量的是散射光（漫射计）。通常，漫射计的光电探测器位于 90° 处。 Figure\
  \ 13.6 展示了基于光学（a）和声学（b）的浊度传感器工作原理。光学和声学技术的使用并非不可能。\n\n![Figure 13.6 Operating an\
  \ acoustic sensor.](img/fig13_6_B.jpg)\n\nFigure 13.6 Operating an acoustic sensor.\n\
  \n导电率也可以用于监测非法排放。水的导电率定义为水导电的能力。纯水是电的 poor conductor（差导体），但溶解的盐会使水成为良好的导体。测量导电率的三种方法是：(I)\
  \ 密度法、(II) 导电池法、和 (III) 感应传感器。\n\n密度法基于含有样品的管子振动，振动周期与密度根据方程 13.1 成正比。仪器校准利用已知密度的样品计算\
  \ *A* 和 *B* 项 \\[47\\]。如今，该方法不再常用，因为电池法更可靠且使用更简便。\n\n(13.1)  \n\nDensity = *A* +\
  \ *B* period²  \n\n\n\n\n-   [导电池法](https://wiki.example.org/feynmans_learning_method)基于两个或多个电极，用于测量样品能够携带的电流。由于成本低廉和使用简便，该方法是当今最常用的，但其缺点是元件的稳定性差。因此，有研究正在探索使用感应导电传感器。感应传感器基于生成电磁场，感应线圈的感应效果取决于样品中盐分的浓度。\n\
  \n-   其他参数如 pH、硝酸盐、氨和有机物指示水体污染。为了监测 pH，物联网（IoT）采用的方法是定位特定的膜。pH 计类似于导电池，但有一个膜，该膜不允许除质子以外的物质通过。类似的方法也用于硝酸盐和氨的检测。使用膜意味着维护成本高，这使得在大规模\
  \ IoT 设备中使用这些传感器变得不可行。关于有机物，最广泛使用的方法是紫外光谱法。在此情况下，为大规模 IoT 导向设备生成紫外光波长具有挑战性。\n\n\
  -   水体中的另一类重要污染物是生物污染物。需要区分饮用水和水体中的生物污染。\n\n-   在饮用水中，通过培养技术在实验室中监测细菌等生物污染物。使用的技术包括\
  \ (I) 多管发酵（MTF），(II) 膜过滤（MF），(III) DNA/RNA 扩增，以及 (IV) 原位荧光原位杂交（FISH）48。MTF 基于在玻璃管中放置培养基和样品。根据要分析的细菌种类，特定的培养基会在特定温度和时间下放置。与\
  \ MTF 类似，MF 技术中，样品经过过滤，滤膜放置在培养基中以促进细菌生长。这两种技术无法检测病毒，因为病毒不能在不感染细胞的情况下复制。利用遗传技术可检测病毒和细菌。其中一种技术是\
  \ DNA 和 RNA 扩增，利用试剂和热循环仪放大 DNA 或 RNA 链。试剂中含有荧光物质，用于标记生成的 DNA 或 RNA 链的数量。最终，FISH\
  \ 技术基于荧光探针与核酸链杂交。当杂交发生时，样品被固定，过量探针被擦除。样品的荧光表明其中存在的细菌或病毒数量。由于这些技术对精度要求极高，且许多技术依赖培养，据我们所知，目前没有用于监测这些参数的传感器。\n\
  \n-   在水体中，还可以监测微藻。过度生长可能导致水体富化（藻华）。通常通过测量叶绿素 a（绿色色素）的浓度来检测富化。研究表明，遥感可以预测这些色素在水中的浓度。由于富化会导致水色变化，浊度传感器是可行的选择。不同波长的光用于区分富化导致的浊度与其他浊度来源。不同浊度来源在不同波长下的行为各异，因此可以确定浊度的来源\
  \ 49。\n\n### 13.3.3 空气监测\n\n-   空气中污染物的浓度通常很低，单位为 μg/m³ 或 mg/m³。然而，人体吸入的空气量远大于其他暴露途径。\n\
  \n-   在欧洲，指令 2008/50/EC 必须建立测站网络，以监测聚集区和背景污染的空气质量 50。其他国家也有类似法律。在美国，Clean Air Act\
  \ 确保公共健康和福祉，并规范空气污染物的排放 51。为了确保空气质量正确，环保局（EPA）与联邦政府合作开展空气监测活动，包括一系列固定站（AirData Air\
  \ Quality Monitors app）。澳大利亚 52、新加坡 53 和日本 54 也有类似的网络。通常，这些网络提供关于 O₃、NOx、CO₂、SO₂、NH₃、PM₂.₅、PM₁₀\
  \ 等空气污染物浓度以及降雨、风速和风向、阳光等气象数据。\n\n-   这些网络能够监测城市中的污染，但无法监测建筑物内部的污染。可以使用不同的传感器监测室内环境。Saini、Dutta\
  \ 和 Marques55 分析了 40 篇关于室内 IoT 的论文，发现 70% 的论文测量温度和湿度，65% 测量 CO₂，30% 测量 CO，PM₁₀ 和\
  \ PM₂.₅ 在 27.5% 的论文中被使用，最终 20% 的论文测量挥发性有机化合物（VOCs）。大多数工作使用 MQ 系列传感器监测气体。DHT11 和\
  \ DHT22 是最常用的温湿度传感器。\n\n-   DHT11 和 DHT22 是两种测量空气相对湿度和温度的传感器。温度通过热敏电阻测量，湿度通过电容传感器测量。两者的区别在于\
  \ DHT22 比 DHT11 更贵，但更精确。这些传感器用于室内控制湿度和温度，有助于营造更舒适的环境并降低空调等设备的电耗，这与电子健康（e-health）相关。\n\
  \n-   MQ 传感器是一类能够监测不同气体的传感器。它们具有一个感应元件，该元件随气体的变化而改变其特性。传感器内部有一个加热元件（calefactor），用于加热感应元件以便与气体反应。在该传感器系列中，能够检测易燃气体的传感器会在感应元件上覆盖一层网格，以防止爆炸。表\
  \ 13.1 列出了不同 MQ 传感器及其可监测的气体。\n\nTable 13.1 Elements That Can Be Monitored with MQ\
  \ Sensors\n\n| Sensor || Measure Element || Sensor || Measure Element || Sensor\
  \ || Measure Element |\n| --- | --- | --- | --- | --- | --- |\n| MQ-2 || Propane,\
  \ butane, methane, hydrogen, alcohol || MQ-7 || Carbon Monoxide || MQ-136 || Hydrogen\
  \ Sulfide |\n| MQ-3 || Alcohol || MQ-8 || Hydrogen || MQ-137 || NH3 |\n| MQ-4 ||\
  \ Methane, natural gas || MQ-9 || Carbon Monoxide || MQ-138 || Benzene alcohol,\
  \ NH3 |\n| MQ-5 || LPG, LNG, natural gas, iso-butane, propane, town gas || MQ-131\
  \ || Ozone || MQ-214 || Methane, LPG, propane, butane |\n| MQ-6 || LPG, iso-butane,\
  \ propane, LNG || MQ-135 || Nh3, Benzene, alcohol || MQ-216 || LPG, propane, butane,\
  \ methane, alcohol |\n\n\n\n\nThe use of an IoT sound sensor detects places where\
  \ excessive noise is produced. With this, the sensor can generate an alarm so that\
  \ the police can stop the noise generation. This reduces noisy neighbours, spotting\
  \ bar fights, and detecting illegal parties.\n\nThere are sound sensors such as\
  \ `LM386`, `KY-037`, and `DFR0034`. These sensors have a microphone that detects\
  \ the sound and transmits the information to a microcontroller.\n\n### 13.3.5 Light\
  \ Monitoring\n\nThere are few studies on monitoring light pollution with IoT. Usually,\
  \ this type of pollution is detected with field studies. However, some authors introduce\
  \ IoT sensors to monitor this pollution and take measures to reduce it. Pribadi\
  \ et al. \\[56\\] used a sky quality metre model SQM-LUconnected to a Raspberry\
  \ Pi to control light pollution. The significant gap in the solution to continuous\
  \ monitoring is that no solutions can be implemented to reduce light pollution quickly.\
  \ The solutions to reducing it are based on improving the design of the lamps, reducing\
  \ light intensity, eliminating the lights projected to the sky, etc. These solutions\
  \ however need to be initiated by the administrations to come into effect.\n\n##\
  \ 13.4 Governance\n\nAs we said previously, governance is the interaction of all\
  \ members of society in making decisions. In many cases, the laws require interaction\
  \ with society for decision-making. In the European Union, Directive 2011/92/EU\
  \ on assessing the effects of specific public and private projects on the environment\
  \ in article 6 section 5 requires the submission to public participation of all\
  \ projects that must undergo an environmental impact assessment\\[57\\]. In US,\
  \ projects with environmental impacts are subjected to Environmental Impact Statement.\
  \ The document includes the alternatives and the major impacts of the analysed project.\
  \ The final and draft document is shared with the federal agency and the citizens\
  \ \\[58\\].\n\nGovernance is a tool to include the different statements of the society\
  \ and control the politician elites. Governance is a fundamental pillar of modern\
  \ democracies. Citizens no longer only elect their rulers from time to time but\
  \ also participate in decision-making. Proper governance can lead to conflicts.\
  \ Aggravating these conflicts can lead to riots and even civil wars \\[59\\]. In\
  \ addition, bad governance is related to corruption \\[60\\].\n\nNew technologies\
  \ have improved governance with the introduction of e-governance. E-governance is\
  \ the introduction of ICT in the different statements of the government to facilitate\
  \ the exchange of information between the administration and citizens. The quality\
  \ of e-government increases trust in government \\[61\\].\n\nThe data obtained from\
  \ the different IoT systems present in a city help in decision-making. Hence, there\
  \ are more and more cities that bet on smart cities. In addition, to help improve\
  \ the city, financial expenses decrease with the reduction in the use of resources.\
  \ In the following section, some of the smart cities are presented in which, thanks\
  \ to good use of governance, the quality of the city and that of the citizens have\
  \ been improved.\n\n### 13.4.1 Projects in Cities Related to Governance\n\nIn this\
  \ section, some examples of smart cities that are related to governance are cited.\
  \ According to Telecommunication Standardization Sector of International Telecommunication\
  \ Union (ITU-T) \\[62\\] “A Smart Sustainable City\n\n> is an innovative city that\
