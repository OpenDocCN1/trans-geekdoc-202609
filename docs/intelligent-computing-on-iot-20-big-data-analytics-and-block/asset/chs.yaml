  \n下面是三种分类的完整结果：\n\n### 21.5.1 随机森林分类器\n\n在所有被评估的分类器中，`随机森林`分类器表现最佳，实现了 99.76%的 F1\
  \ 评分和 99.8%的 F-Beta 评分。此外，该分类器的多类别预测得分为 F1 89.14%（宏平均）和 99.77%（微平均），F-Beta 92.98%（宏平均）和\
  \ 99.77%（微平均）。这些结果表明，`随机森林`分类器是入侵检测任务的高度有效方法。\n\n### 21.5.2 KNN\n\n`KNN`算法展示出令人印象深刻的准确率，F1\
  \ 评分和 F-Beta 评分均为 99.76%和 99.8%。此外，`KNN`分类器的多类别预测得分为 F1 84.63%（宏平均）和 99.11%（微平均），F-Beta\
  \ 86.23%（宏平均）和 99.11%（微平均）。这些结果展示了`KNN`在准确预测入侵方面的有效性。\n\n### 21.5.3 逻辑回归\n\n`logistic\
  \ regression`模型在预测入侵方面表现出高精度，F1 和 F-Beta 评分分别为 86.83%和 88.389%。当使用该分类器进行多类别预测时，模型实现了微平均\
  \ F1 评分和微平均 F-Beta 评分为 84.52%。这些结果展示了`logistic regression`在识别入侵方面的有效性，并突出了其在 IDS（入侵检测系统）中的应用潜力。\n\
  \n根据实验结果，该技术仅使用三个特征即可实现 91%的分类准确率，使用全部 36 个特征加上 41 个训练特征则可达到 99%的准确率。这些发现支持该方法的有效性，表明其能够实现最高\
