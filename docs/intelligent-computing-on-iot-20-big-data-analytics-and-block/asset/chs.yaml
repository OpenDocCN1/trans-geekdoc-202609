  \n# 15 An Energy-Aware Task Scheduling Method using the Meta-Heuristic Algorithm\
  \ in IoT Environments\n\nFatemeh Bahrani-pour and Sepehr Ebrahimi Mood\n\nYazd University,\
  \ Yazd, Iran\n\nAlireza Souri\n\nHalic University: 伊斯坦布尔, 土耳其\n\nMohammad Farshi\n\
  \nYazd University, Yazd, Iran\n\nDOI: 10.1201/9781003326236-15\n\n## 15.1 Introduction\n\
  \n近年来, 随着技术的进步, 物联网的出现给网络信息技术领域带来了重大变化 \\[1\\]. 物联网设备包括传感器、智能家电、恒温器、智能设备以及所有可以连接互联网并发送数据的各种设备。这些设备在地理上分布，根据应用需求，有时需要实时处理，有时需要在数据传输中实现高安全性。例如，健康监测设备产生的数据需要实时处理，处理延迟可能导致不可逆的损害。资源限制是物联网设备的主要限制之一。大多数物联网设备在数据处理、内存和电池方面存在限制，因此需要强大的资源来将任务卸载以处理其信息。云环境和雾环境提供了强大的资源。雾环境包括一个称为雾控制器的控制器和雾网络\
  \ \\[2\\]。\n\n雾资源具有计算和存储能力，暂时存储在缓冲区的卸载任务会在雾网络中执行，该网络包括地理分布的设备，如高级服务器、个人电脑、路由器和移动电话。雾控制器管理卸载任务，需要一种任务调度方法。根据任务的重要性，有不同的方法来执行此调度。调度方法越智能、越强大，处理的任务质量越高。\n\
  \n云环境由一组虚拟机器（VM）组成，其计算能力和存储空间远大于雾环境的资源 \\[3\\]。云环境中服务器的数量越多，越需要采用智能的能源管理方法。因此，找到一种能最大限度减少资源浪费和能耗的虚拟机器放置策略是一个挑战。\n\
  \n由于物联网网络的巨大增长，能源管理和发现新颖、及时的能源消耗优化方式已成为物联网领域近年来的重要研究话题 \\[4\\]。一种能源管理方法是通过调度请求来分配资源。找到一种智能的任务调度方法可以大幅提高云端和雾端服务的服务质量（QoS）。所有调度算法的目标都是在最短的总体任务执行时间内确定必须分配给处理请求的资源，以完成任务处理\
  \ \\[3\\]。\n\n过去几年，元启发算法在优化作业调度方面展现出良好的性能，并迅速发展。然而，这种方法面临多种挑战，包括实现时间。由于在大多数应用中，调度算法必须在最短时间内完成调度操作，因此检查元启发调度算法的执行时间很重要。在大多数研究中，算法的执行时间并未被视为重要参数；研究重点仅限于优化延迟或能耗等参数\
  \ \\[5, 6\\]。因此，一个合适的方法不仅在优化方面表现良好、能够找到高质量解，还必须在执行时间上高效。\n\n机器学习（ML）和人工智能（AI）技术是另一种高效的任务调度和资源负载分配方法。已被证明，ML\
  \ 和 AI 技术有助于诸如资源优化、能源优化、工作量估计、视频游戏、任务调度等复杂问题的应用 \\[7\\]。在部署模型到云端环境用于资源管理和任务调度等应用之前，需要进行数据收集、构建\
  \ ML 模型、训练和测试模型以及验证其有效性等步骤 \\[8\\]。本章节，我们通过定义基于延迟和最大响应时间的能源计算系统模型来定义目标函数。通过定义目标函数，我们将得到一个必须使用线性规划方法求解的优化问题。本章节，在定义问题的目标函数时，我们采用一种受自然启发的元启发算法——Reptile\
  \ Search Algorithm（RSA）来解决该问题。考虑到问题的复杂性以及改进算法通过规模化方法提高解决复杂问题的效率，在本算法中我们使用线性缩放来控制选择压力。\n\
  \n本章节的其余部分组织如下：第 15.2 节 介绍该领域已有的工作历史。第 15.3 节 介绍系统模型和问题公式。第 15.4 节 描述改进的 RSA 算法。第\
  \ 15.5 节 介绍仿真和结果，第 15.6 节 介绍结论和未来工作。\n\n## 15.2 Background\n\n\n\n\n在周等人的研究 \\[9\\\
  ] 中，考虑了在多处理器系统上调度任务的问题，以优化物联网中的安全质量和能源。为此，采用了混合整数调度公式，并在实时和能源约束下将任务调度问题进行了公式化，提出了一种两阶段方案来解决该问题。在此方案中，除了最大化安全质量和减少能源外，系统的限制也已得到满足。该方案经过测试以验证其质量。仿真结果表明，所提方法在解决该问题方面表现良好。在拉贾苏德拉兰等人的研究\
  \ \\[10\\] 中，采用了强化学习方法。具体而言，首先通过一种特殊的验证方法确定一些危及系统安全的任务。随后，这些任务被从调度循环中移除，以确保安全。通过强化学习技术和猫群优化任务服务调度，调度安全任务。结果表明，所提方法在本研究的其他方法上取得了最高\
  \ 8% 的改进。\n\n在包等人的研究 \\[11\\] 中，使用了机器学习系统，并提出了一种在线算法来调度任务并就资源使用做出决策，以最大化整体效用。本文提出的在线算法在多项式时间内解决了该问题。通过仿真和实验验证了该算法的效率。结果表明，该在线算法在本文综述的多种云计算算法中取得了更好的结果。在苏古马兰等人的研究\
  \ \\[12\\] 中，旨在全面回顾云环境中的任务调度。该研究考察了各种方法的优势和劣势。特别是，研究了不同的调度方法，以找出哪些特性更为重要。总体而言，本研究的文献综述是基于方法、应用和参数进行的。\n\
  \n在研究 \\[13\\] 中，首先比较了不同工作量预测方法的性能。随后，提出了一种工作量预测方法，并据此进行调度。为提高本文的准确性，采用了聚类方法将任务分类，然后为每个调度类别使用预测模型并进行训练。结果表明，该方法达到了\
  \ 90% 的准确率。在王等人的研究 \\[14\\] 中，提出了一种在线调度算法。该算法具备模仿学习能力，并能够提供接近最优的性能。在该在线算法中，通过离线方式解决所制定的优化问题并找到最优调度策略，在线学习的性能损失在可接受范围内。本文的结果表明，所提出的算法相较于本研究的对比方法提升了\
  \ 50%。\n\n在查巴尔等人的研究 \\[15\\] 中，定义了中心-辐射网络，并设定了两个目标：降低网络成本和降低环境污染物排放。采用了基于元启发算法和机器学习技术的混合方法（ML-MOAIS）来解决该问题。MOAIS\
  \ 和 NSGA-II 算法用于评估该方法。根据本文的结果，机器学习方法能够更快速地收敛到最优解，并限制问题的目标空间。该方法的评估采用了定量和定性指标，结果表明该方法优于\
  \ MOAIS 和 NSGA-II 两种算法。本文的拟议方法在帕累托前沿上具有更大的分散性和更好的解决方案质量。在坦哈等人的研究 \\[16\\] 中，提出了一种基于遗传算法和模拟退火的混合算法，用于云环境中的任务调度。遗传算法和模拟退火的结合很好地弥补了探索和开发能力的不足。该算法的初始种群是通过一种新方法创建的。遗传算法中的交叉算子可以提升探索能力，而模拟退火算法则提升开发能力。因此，在这两种能力之间建立了平衡。\n\
  \n## 15.3 System Model\n\n本章考虑的物联网网络架构由四部分组成。第一部分是物联网设备。第二部分是网关，其他部分是雾环境和云环境。Figure\
  \ 15.1 展示了本章使用的物联网–雾–云架构 \\[2\\]。在该架构中，第一层由于设备的内存和电池限制，将由物联网设备生成的任务通过网关 offload\
  \ 到雾环境或云环境。根据任务的截止时间或处理优先级等参数 \\[17\\]，网关决定哪些任务应在雾网络中处理，哪些任务应在云服务器中处理。在雾环境中，有一套用于处理任务的资源。在该环境中对任务进行调度，可提升服务质量（QoS）的交付。\n\
  \n![Figure 15.1  IoT system architecture.](img/fig15_1_B.jpg)\n\nFigure 15.1  IoT\
  \ system architecture.\n\n### 15.3.1 Problem Formulation\n\n*   **Tasks:** 我们假设由物联网设备生成的\
  \ *n* 个任务集合，同时假设云和雾资源能够处理这些任务。我们用 *R* = {*r*[1],*r*[2],...,*r*[n]} 表示从物联网设备 offload\
  \ 到雾网络的任务集合。我们为每个任务定义了一组特征，具体为 \\[*Q*[j],*T*[j],*W*[j],*D*[j]\\]。在特征集合中，*Q*[j] 表示第\
  \ *j* 个任务的大小，通常由包的数量决定。在该集合中，*T*[j] 表示第 *j* 个任务的请求初始时间。*W*[j] 表示第 *j* 个任务的权重或优先级。我们还假设所有由物联网设备创建的任务都是独立的。每个任务在被分配到服务器后必须\
  \ uninterrupted 地连续处理。每个任务只能在单个服务器上处理，不能在多个服务器上并行处理。\n\n\n\n**雾计算**：我们假设我们在雾网络中拥有\
  \ `m` 台服务器，这些服务器具有不同的处理能力。有些服务器更强大，处理任务的时间更短，而有些服务器需要更长的时间。处理能力通常以百万指令每秒（MIPS）来表示。雾网络由若干雾节点（FNs）组成，这些节点具有特定的拓扑结构。我们用\
  \ `S = {s[1], s[2], ..., s[m]}` 表示 FNs 服务器的集合。我们用 `p[i]` 表示第 *i* 个 FNs 的处理能力，因此我们有集合\
  \ `P = {p[1], p[2], ..., p[m]}` 表示 FNs 的处理能力集合。除此之外，每个 FN 还有一个特征，即能耗。当服务器处于活动模式并处理任务时，它在空闲模式下的能耗更高。假设第\
  \ *i* 个 FN 在活动模式下的能耗为 `β[i]`，在空闲模式下的能耗为 `α[i]` \\[19\\]。因此，根据场景，由物联网设备生成的任务通过网关发送到\
  \ FNs。优化能耗需要调度算法。当任务被分配给某个 FN 时，处理时间会根据该任务的大小以及该 FN 的处理能力而不同。预期计算时间（ETC）矩阵包含了在不同\
  \ FN 上处理每个任务的预期时间。该矩阵的每个元素形式为 `^(*Q*)*[j]*/*P[i]*`，其中 `Q[j]` 是第 `j` 个包中任务的大小（1 ≤\
  \ `j` ≤ `n`），`P[i]` 是第 `i` 个 FN 的功率（单位 MIPS） （1 ≤ `i` ≤ `m`）。\n\n### 15.3.2 目标函数\n\
  \n首先，我们定义问题的决策变量，然后描述用于计算响应时间和能耗的拟议模型。该决策变量用于指定是否将任务分配给 FN。该变量为二值 `x[ij]` ∈ {0,1}，并影响值为\
  \ 1 的计算。\n\n(15.1)  \n\n`x_ij = { 1 if task j allocated to FN i 0 otherwise ∀j ∈\
  \ n, ∀i ∈ m }`\n\n因此，我们可以考虑 `X[ij]` 矩阵，称之为分配矩阵。在该矩阵中，决定哪个任务分配给哪个 FN，根据决策变量的值为 1\
  \ 的区域实现。为了描述能耗模型，我们需要计算响应时间，它取决于任务在处理过程中的延迟。IoT 设备发出的任务在开始处理直到结束之间会经历各种延迟，例如传输延迟和排队延迟。传输延迟是基于任务大小和链路传输速度计算的，因此整体延迟在方程\
  \ 15.2 中设计 \\[18\\]。\n\n(15.2)  \n\n`delay = d(tr) + d(q)`，\n\n其中 `d(tr)` 是传输延迟，`d(q)`\
  \ 是排队延迟；因此，处理第 `j` 个任务与第 `i` 个 FN 的延迟使用方程 15.3 计算。\n\n(15.3)  \n\n`LT[i j] = ST[i\
  \ j] + PT[i j] + TQT[i j]`，\n\n其中 `ST[ij]` 是任务 *i* 在 *j*th FN 上开始处理的时间，`PT[ij]`\
  \ 是矩阵 ETC 的第 `ij` 个元素，`TQT[ij]` 使用方程 15.4 计算 \\[18\\]。\n\n(15.4)  \n\n`TQT_ij =\
  \ Σ_{i=1}^{n} Σ_{j=1}^{Q_j} d_{ij}^q`，\n\n其中 *n* 是任务的数量，`Q[j]` 是第 `j` 个包中任务的大小，`d[ij]^q`\
  \ 是在第 `i` 个任务在第 `j` 个 FN 上的排队延迟。现在我们可以描述能耗模型。为此，我们首先计算每个节点的分配工作量。已知活动状态和空闲状态的能耗不同，对于每个节点，其活动时间应等于其分配任务的处理时间之和，因此我们有以下方程\
  \ \\[19\\]。\n\n(15.5)  \n\n`ET_i = Σ_{i=1}^{n} Σ_{j=1}^{m} X_ij × LT_ij`，\n\n其中\
  \ `X[ij]` 是任务分配矩阵，在该函数中计算值为 1，表示将任务分配给 FN，`LT[ij]` 是任务的总延迟。\n\n现在我们可以从以下方程 \\[19\\\
  ] 计算聚合能耗：\n\n(15.6)  \n\n`E(s_i) = [ET_i × β_i + (M − ET_i) × α_i] × p_i`，\n\n其中\
  \ *M* 是所有 FN 中的最大执行时间（`M` = max[*i*]≤[*m*] ET[i]），`ET[i]` 是第 `i` 个 FN 分配给任务的总执行时间，`β[i]`\
  \ 和 `α[i]` 是 FN 在活动和空闲状态下的能耗，`p[i]` 是处理功率（单位 MIPS）。\n\n接下来，我们定义目标函数，以最小化调度的能耗，如下\
  \ \\[19\\]。\n\n(15.7)  \n\n`F = argmin_X Σ_{i=1}^{m} E(s_i)`\n\n目标函数必须在以下约束条件下得到优化。第一个约束在方程\
  \ 15.8 中给出，任务必须在传输到 FN 之后才能处理 \\[18\\]。\n\n(15.8)  \n\n`ST[i j] ≥ IT[j] + TQT[j]\
  \ ∀j ∈ n, i ∈ m`\n\n方程 15.9 中的约束表明，每个任务只能由一个 FN 处理 \\[18\\]。\n\n(15.9)  \n\n`Σ_{i=1}^{n}\
  \ Σ_{j=1}^{m} X_ij = 1 ∀j ∈ n, i ∈ m`\n\n### 15.4 改进的爬虫搜索算法\n\n2021 年，Laith Abualigah\
  \ 等人介绍了一种受自然现象启发的元启发式算法 RSA \\[20\\]。该算法模拟鳄鱼在求偶和捕猎时的行为。在该算法中，解的位置根据鳄鱼的行为更新。更新的目的是更好地搜索并找到更高质量的解，使该算法适用于复杂问题。通过函数测试和真实工程问题，验证了该算法的效果\
  \ \\[20\\]。该算法的探索能力和开发能力受到鳄鱼在自然界中的约束、捕猎和社会行为机制的启发，这些行为机制被数学模型化，用于优化操作。RSA 与大多数进化算法一样，基于种群，可以用于解决带有特定约束的优化问题。下面，我们将全面考察该算法的工作原理。\n\
  \n### 15.4.1 第一阶段\n\n在第一阶段，优化过程从构建初始种群集合开始，该集合是随机生成的。初始种群是问题的可能解的集合。初始种群的一个例子在方程\
  \ 15.10 中显示 \\[20\\]。\n\n(15.10)  \n\n`X = [ x_11  ...  x_1n\n       ...       \
  \ ...    \n       x_n1  ...  x_nn ]`，\n\n其中 *X* 是随机生成的初始种群，依据变量在问题中可取值的下限和上限。\n\n\
  \n\n\n数学公式保持不变：\n\n$$x\\_{i,j}(t + 1) = \\\\left\\\\{ \\\\begin{matrix} {Best\\\
  _{j}(t) \\\\times \\\\eta\\_{i,j}(t) \\\\times \\\\beta - R\\_{i,j}(t) \\\\times\
  \ rand,t < T/4} \\\\\\\\ {Best\\_{j}(t) \\\\times x\\_{r\\_{1},j} \\\\times \\\\\
  text{ES}(t) \\\\times rand,t \\\\leq 2^{T}/4andt > T/4} \\\\\\\\ \\\\end{matrix}\
  \ \\\\right.$$  \n\nwhere `Bestj` is the position of the best-obtained so far solution,\
  \ `rand` is a function that generates a random number in \\[0, 1\\], `t` is the\
  \ index of the current iteration, and `T` is the maximum number of iterations. The\
  \ hunting operator is denoted by `ηi,j` for the *j*th position in the *i*th solution;\
  \ this operator is obtained from Equation 15.12. The parameter that controls the\
  \ accuracy of exploration is fixed `β = 0.1`. To decrease the search region, the\
  \ function `R[i],j` is defined as in Equation 15.13. In this equation `ε` is a small\
  \ random number. `r[2]` is a random number in \\[1*N\\] that select a solution.\
  \ The position of a selected solution, indicated by `x[r1,j]`, and *N* is the size\
  \ of the initial population. Evolutionary Sense `ES(t)` is calculated using Equation\
  \ 15.14, which is a probability ratio. During the iterations of the algorithm, `ES(t)`\
  \ takes a random value in \\[−22\\], and `r[3]` is a random number in \\[−11\\].\n\
  \n(15.12)  \n\n`ηi, j` = `Bestj` × `P[i, j]`,  \n\n(15.13)  \n\n$$R\\_{i,j}(t) =\
  \ \\\\frac{Best\\_{j}(t) \\\\times x\\_{r\\_{2},j}}{Best\\_{j}(t) + \\\\varepsilon},$$\
  \  \n\n(15.14)  \n\n$$ES(t) = 2 \\\\times r\\_{3} \\\\times (1 - \\\\frac{1}{T}).$$\
  \  \n\nIn Equation 15.12, `P[i][,j]` is the difference between the position of the\
  \ best-obtained solution and the current solution and is calculated using Equation\
  \ 15.15.\n\n(15.15)  \n\n$$P\\_{i,j} = \\\\alpha + \\\\frac{x\\_{i,j} - M(x\\_{i})}{Best\\\
  _{j}(t) \\\\times (\\\\text{UB}\\_{j} - \\\\text{LB}\\_{j}) + \\\\varepsilon},$$\
  \  \n\nwhere `M(x[i])` is the average of solution *x[i]* and is calculated in Equation\
  \ 15.16. `UB(j)` is the upper bound and `LB(j)` is the lower bound of variables\
  \ in a solution. Fixed parameter `α = 0.1` is a parameter that controls the difference\
  \ between solutions for the hunting cooperation over the iterations.\n\n(15.16)\
  \  \n\n$$M(x\\_{i}) = \\\\frac{1}{n}\\\\sum\\\\limits\\_{j = 1}^{n}x\\_{i,j}.$$\
  \  \n\n### 15.4.3 Phase 3 (Exploitation)\n\nIn this section, the efficiency of the\
  \ algorithm is described using the behavior of crocodiles in hunting. Coordination\
  \ and cooperation in hunting, which are among the hunting strategies of crocodiles,\
  \ help in the exploitation search and convergence of the algorithm and getting closer\
  \ to the optimal solution. These two strategies are modeled in Equation 15.17.\n\
  \n(15.17)  \n\n$$x\\_{j}(t + 1) = \\\\left\\\\{ {\\\\begin{matrix} {Best\\_{j}(t)\
  \ \\\\times P\\_{i,j}(t) \\\\times rand,t < 3T/4andt > 2T/4} \\\\\\\\ {Best\\_{j}(t)\
  \ - \\\\eta\\_{i,j} \\\\times \\\\epsilon - R\\_{i,j}(t) \\\\times rand,t \\\\leq\
  \ Tandt > 3T/4} \\\\\\\\ \\\\end{matrix},} \\\\right.$$  \n\nIn this equation `Bestj`\
  \ is the position of the best-obtained so far solution; the hunting operator is\
  \ denoted by `ηi,j` for the *j*th position in the *i*th solution; function `R[i],j`\
  \ is the decrease function, which is calculated using Equation 15.13; `P[i][,j]`\
  \ is difference between the position of the best-obtained solution and the current\
  \ solution, which is calculated using Equation 15.15; `ε` is a small random number;\
  \ and `rand` is a function that produces a random number between 0 and 1. Therefore,\
  \ after several iterations, the search is done near the optimal solution and the\
  \ answers converge to the optimal solution. As a result, the algorithm can find\
  \ an almost optimal solution. According to the explanations mentioned in this algorithm,\
  \ until less than half of the iterations are done, the exploration phase is done,\
  \ and when more than half of the iterations are done, the algorithm enters the exploit\
  \ phase, and the search around the optimal solution is done until the algorithm\
  \ converges.\n\nThese two phases are summarized in Figures 15.2 and 15.3. In these\
  \ figures, the prey is shown in white color, and in the initial iterations (less\
  \ than ^(*T*)/2), the reptiles, which are shown in different colors, search the\
  \ entire problem space, and in the later iterations (more than ^(*T*)/2), the search\
  \ is performed around the prey, which is the optimal solution, and then the convergence\
  \ happens. The pseudo-code of the RSA is shown in Algorithm 1.\n\n![Figure 15.2\
  \ Exploration phase before T/2 iterations.](img/fig15_2_B.jpg)\n\nFigure 15.2 Exploration\
  \ phase before T/2 iterations.\n\n![Figure 15.3 Exploitation phase after T/2 iterations.](img/fig15_3_B.jpg)\n\
  \nFigure 15.3 Exploitation phase after T/2 iterations.\n\n| **Algorithm 1** Pseudo-code\
  \ of the Reptile Search Algorithm (RSA) |\n\n| --- |\n\n| \n\n1.  Initialization\
  \ phase\n\n2.  Initialize RSA parameters.\n\n3.  Initialize the solutions’ positions\
  \ randomly. *X* : *i* = 1,...*N*.\n\n4.  *while* (*t* < *T*) *do*\n\n5.  Calculate\
  \ the fitness function for the candidate solutions (*X*).\n\n6.  Find the best solution\
  \ so far.\n\n7.  Update the ES using Equation 15.14.\n\n8.  The beginning of the\
  \ RSA\n\n9.  *for* (*i* = 1*toN*) *do*\n\n10.  *for* (*j* = 1*ton*) *do*\n\n11.\
  \  Update the `η`, `R`, `P`, and values using Equation 15.12, Equation 15.13, and\
  \ Equation 15.15 respectively.\n\n12.  *if* (*t* ≤ ^(*T*)/4) *then*\n\n13.  `x`(*i*,*j*)\
  \ = `Best[j]`(*t*) × (−`η`*i*,*j*) × `β` − `R`[*i*],*j*× `rand`. {High walking}\n\
  \n14.  *else if t* ≤ ^(2*T*)/4 *and t* > ^(*T*)/4 *then*\n\n15.  `x`(*i*,*j*) =\
  \ `Best[j]`(*t*) × `x`[*r*1,*j*] × `ES`(*t*)× `rand`. {Belly walking}\n\n16.  *else\
  \ if t* ≤ ^(3*T*)/4 *and t* > 2^(*T*)/4 *then*\n\n17.  `x`(*i*,*j*) = `Best[j]`(*t*)\
