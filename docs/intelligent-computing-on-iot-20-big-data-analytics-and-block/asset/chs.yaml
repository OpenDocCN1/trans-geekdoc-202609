  \nIn the pseudo-code of the algorithm shown in Figure 15.4, it is clear that this\
  \ algorithm, like most evolutionary algorithms, starts working with an initial population\
  \ of candidate solutions. Then, during the iterations of the algorithm, they are\
  \ guessed with the defined mechanisms to search for optimal solutions, and then\
  \ they converge to the optimal solution in the last iterations of the algorithm.\n\
