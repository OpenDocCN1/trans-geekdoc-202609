  \n上述模拟结果强烈表明，一旦建立动态导航机制，就能实时监测疏散状态，并在出现或预测拥挤时及时调整疏散流，从而节省疏散时间。\n\n## 17.5 多层楼宇疏散\n\
  \n\n\n\n我们还将基于物联网的动态疏散方法应用于多层教学楼的疏散中。例如，考虑一个两层楼的建筑。整个 GSPN 模型由第一层的模型、第二层的模型以及连接两层楼出口的楼梯模型组成。为了直观感受动态疏散对多层建筑的影响，我们假设两层楼具有完全相同的布局，因此对每一层使用\
  \ Figure 17.6 的 GSPN 模型。我们使用一个转换来连接代表两个左侧出口的两个地点，使用另一个转换来连接代表两个右侧出口的两个地点。我们测量每条楼梯的长度，并计算对应转换的\
  \ firing rate。每层楼的模型参数与 Scenario 3 中描述的相同。结果如 Figure 17.12 所示。静态疏散耗时 4771 秒，而动态疏散耗时\
  \ 3219 秒，节省了 1552 秒。\n\n![Figure 17.12 Simulation results of a two-floor building\
  \ evacuation. Static evacuation took 4771 seconds, while dynamic evacuation took\
  \ 3219 seconds. (a) Static evacuation. (b) Dynamic evacuation.](img/fig17_12_B.jpg)\n\
  \nFigure 17.12 Simulation results of a two-floor building evacuation. Static evacuation\
  \ took 4771 seconds, while dynamic evacuation took 3219 seconds. (a) Static evacuation.\
  \ (b) Dynamic evacuation.\n\n## 17.6 Conclusion\n\n在本研究中，我们利用先进的物联网技术进行紧急疏散，并提出使用动态导航帮助疏散者在疏散过程中提高效率并节省疏散时间。我们通过基于\
  \ GSPN 的建模和仿真，考察了教学楼的多种疏散场景，以确定动态变化对最终出口时间的影响。研究结果支持我们的理论：对建筑内个体的动态变更疏散路径能够在火灾或化学泄漏等紧急情况下，缩短整体疏散时间。这一点在教学楼疏散中尤为重要，因为每天各房间的学生人数差异显著。\n\
  \n我们的研究成果有望改进各类教学楼的疏散流程。将技术用于实时疏散决策，可帮助学校在更短的时间内安全疏散学生。鉴于学校的首要目标是确保学生安全，他们可能会采用此方法，以确保疏散过程的最安全结果。\n\
  \n我们的未来工作将在医院、办公楼以及其他人口密集建筑中测试我们的疏散流程。其他潜在的未来工作包括将机器学习技术用于捕捉疏散者的异常行为，如跌倒或特殊手势。对于户外疏散（如街道疏散），我们可以使用无人机监测并跟踪疏散流动，识别交通拥堵。\n\
