    **Abstract—** we consider the application of machine learning approaches for the
    prediction of forest fire occurrences in the area. We consider classical classification
    methods such as support vector machine (SVM), K-Nearest Neighbor (KNN), Logistic
    Regression (logit), DT and Naive Bayes (NB). For comparison we also consider more
    advanced algorithms, AdaBoost (DT) based. Although the number of similar studies
    is available for forest fire occurrences in Indonesia. To illustrate the method,
    we **consider the method using topographical and meteorological data** from South
    Kalimantan Province. All computations are done using opens software


