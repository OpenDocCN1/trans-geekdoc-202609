    # IV. DISCUSSION


    The summary of the empirical results is given in Table 1. We here consider training
    and testing sets for checking the performance of considered algorithms. The performance
    of each method in data training and testing results are given in the table. Here
    we can see that the AdaBoost method outperforms the other approaches considered
    in the in-sample data. However, for out-sample study, since in this case we use
    the over DT approach, it is only over the weaker learning method (dt), and it
    is outperformed by kNN classification approach. In general, this show that the
    machine learning approach, either the classical or the more advanced and recent
    approach can be used for fire detection of peatlands.


    # REFERENCES


    # V. CONCLUSION


    One of the success cases that we found here is the early warning system of fire
    detection. This study show that the machine learning learning approach, either
    the classical or the more advanced and recent approach can be used for fire detection
    of peatlands. With the connection of Internet of things, the approach will have
    their importance in future application.


