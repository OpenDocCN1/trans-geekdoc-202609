    # I. INTRODUCTION


    Forest fire is an international world problem and affected the environment, infrastructures,
    and human life. There are various techniques in literature, that use modeling
    methods which can be categorized into three main types: physics-based, statistical-based,
    method-based method, see e.g. [1]. It is also known that the variables used in
    the literature are based on satellite data, fire-related and meteorological data
    (such as weather and meteorological data, see e.g. [2]].


    Many approaches, machine and data approach may reach many researchers. For instances,
    [2] studied forest fire algorithm, namely Regression (MR), Decision trees (DT),
    Neural Networks (NN) and Support Vector Machines (SVM) to model the forest fire
    occurrence prediction using meteorological and weather water data. [3] used clustering,
    normalization to preprocess the data and application classification approach to
    the normalized data. They found that the combination of Fuzzy-Cmeans with Cosine
    distance, normalization and Back-Propagation Neural Networks (with one hidden
    layer) classification give a relatively accurate prediction to other classification
    approach (SVM, K-Nearest


    # II. METHODS


    # A. Classification Methods


