    # 5 Decision Tree


    Decision tree uses supervised learning algorithms that can be used to solve the
    classification problem. It can be applied using the following steps:


    +   1. The complete dataset is used for the starting point of the tree (as the
    root node)


    +   2. The Attribute Selection (ASM) is used to select the best attribute. This
    measure may be applied to find each node and sub-nodes. Popular measure for ASM
    are


    +   A. Information Gain


    +   DT will use the node with highest information gain (IG), and it will be split.
    IG can be calculated as:


    +   Information gain


    > $Entropy(S) = -Weighted Average \times Entropy(each feature)$


    The entropy of S can be calculated as:


    > $Entropy(S) = -\sum p_i \log p_i$


    +   B. Gini Index is often called as Gini index, which is defined as:


    > $Gini Index = 1 - \sum p_i^2$


    +   3. The root node is used in subsets of datasets based on the best attribute
    and the decision tree is generated. It is iteratively updated until the final
    leaf/node is reached where the tree cannot be classified more.


    +   4. To avoid overfitting, the tree size may be pruned. The pruning can be done
    using methods which is called Cost Complexity Pruning or Reduced Error Pruning.


    See [12] for further detail.


    # B. Ensemble Classification: Adaboost Method


    Adaptive Boosting is used in AdaBoost, a machine learning ensemble approach. Using
    AdaBoost, the performance of the ''weak learners'' can be improved by combining
    weighted sum that is called a boost classifier, which has the


    $F(x) = \sum f(x)$


    where x is a learner that takes a task as input and returns the class of x. There
    are variations of AdaBoost, the algorithm used in this study is Adaptive Staging
    using Multi-class Exponential loss function (SAMME) AdaBoost.


    # III. RESULTS AND DISCUSSION


    For the empirical study, we collect meteorological data from Kalimantan Province
    of peatlands, a few days after the occurrence of fire the variable ''area'' is
    labeled as ''1''. For classification we-also collect data at some time when there
    is no fire occurrence, and therefore the area is labeled as ''0''. The variable
    collected is (time of data collected), the district area (LAST Surface Temperature),
    Wind Speed, Humidity, and NDVI (normalized index). Data is collected only for
    year 2018 and is consisting of 202 cases.


    # B. Algorithm


    We employ the algorithms as follows


    # Preprocessing steps


    +   1. We use the split and split the data into two categories, which is case
    of data with the variable area has the value 0 as labeled ''No Burned Area'' and
    the case of data area has the value larger than 0 and labeled as ''Burned Area''.


    +   2. Normalize of all the variables in the set of categories using min-max normalization,
    which is defined as


    $v_i = \frac{v - min A}{max A - min A}(new - min A) + min A$


    where max A and min A is the minimum and the maximum values of an attribute A,
    $v_i$ denotes the value in attribute A (which will be mapped to $v_i$). Here we
    use the range [0,1] as the range of min A, max A'
