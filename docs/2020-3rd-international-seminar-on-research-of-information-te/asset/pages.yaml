    such as support vector machine (SVM), K-Nearest Neighbor (KNN), Logistic Regression
    (logit), Decision Tree (DT) and Naive Bayes (NB). Here we provide only a short
    summary of the description of the methods since all of these methods has been
    considered in various standard machine learning books. See e.g. [7] for further
    detail.


