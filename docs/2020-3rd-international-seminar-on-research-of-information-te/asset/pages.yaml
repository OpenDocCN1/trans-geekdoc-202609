  md: 'Support Vector Machine (SVM) is a supervised learning algorithm often used
    for classification. The SVM algorithms will find an optimal hyper plane in an
    N-1 dimensional space (N denotes the number of features/variables which will classify
    the data). By setting an optimization problem for obtaining the margin, i.e. the
    maximum distance between data points of classes.

    SVM can be of two types


    See e. [8] for further detail.


    +   2) K Nearest Neighbor (KNN)


    +   1. Euclidean


    ```

    d(x, y) = \sqrt{\sum_{i=1}^n(x_i - y_i)^2}

    ```


    a) Linear Separable SVM

    Hyper plane and support vector formula for linear data:


    ```

    g(x) = w^Tx + w_o

    ```


    with assumption:


    ```

    g(x) \geq -1, x \in C class 1

    ```


    and g(x) \leq 0 x class 2


    Calculate the z for each support vector


    ```

    z_1 = \frac{|g(x)|}{\|w|} x \in C class 1\nz_2 = \frac{|g(x)|}{\|w\|} x \in C
    class 2

    ```


    2. Mahattan


    ```

    d(x, y) = \sum_{i=1}^n|x_i - y_i|

    ```


    3. Minkowski


    ```

    d(x, y) = \sum_{i=1}^n|x_i - y_i|^{1/q}

    ```


    See e. [9] for further detail.


    Then The Margin z is


    ```

    z = |frac{1}{n_1}\sum z_1 - \frac{1}{n_2}\sum z_2|

    ```


    Where: w = weight

    Minimizing w is a non-linear optimization function used to maximize separation.
    This minimization of w can be done using the KKT (Karush-Kuhn-Tucker) condition
    with the Langrange multipliers $\lambda$.

    Minimize vector weight to maximize distance between classes using the formula:


    ```

    w = \sum \lambda_i y_i x_i

    ```


    KKT (Karush-Kuhn-Tucker) condition:


    ```

    \sum \lambda_i y_i = 0

    ```


    b) Non-Linear Separable SVM

    Finding non-linear SVM can be used to map data to higher dimension. The data is
    mapped to a higher dimension using the kernel trick so that it is linearly separable.

    There are 2 kernel that are used in SVM:

    1. Radial Basis Function (RBF)


    ```

    k(z, x) = \exp(-\frac{\{\|x-z\^2}{\sigma^2})

    ```


    It is used when the number of variables is less than the number of observations

    2. Polynomial Kernel


    ```

    k(z, x) = (x^Tx + c)^d

    ```


    It is used when the number of observations is less than the number of observations


    See e. [10] for further detail.


