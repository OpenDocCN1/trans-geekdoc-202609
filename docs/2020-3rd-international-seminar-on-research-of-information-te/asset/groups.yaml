    **摘要—** 我们考虑了机器学习方法在预测该地区森林火灾发生中的应用。考虑了经典的分类方法，如支持向量机 (SVM)、K-近邻 (KNN)、逻辑回归 (logit)、决策树
    (DT) 和朴素贝叶斯 (NB)。为了比较，我们还考虑了更先进的算法，基于自适应提升的 AdaBoost (DT)。尽管已有关于印度尼西亚森林火灾发生的类似研究。为了说明该方法，我们**考虑了使用南加里曼丹地形和气象数据的方法**。所有计算均使用开源软件完成。


    邻域、DT 和朴素贝叶斯在不进行聚类的情况下，[4] 通过使用所谓的自适应提升 (AdaBoost) ([5]) 对与 [2] 和 [3] 相同的数据进行建模，改进了其经验性能。有更近的研究，参见例如
    [1] 及其参考文献。在 [6] 中，他们使用了基于极端学习方法 (elm) 和反向传播 (bgpap) 的神经网络分类法来预测森林的发生。然而，除 [6]
    外，在该领域研究的方法中没有其他被研究过的。我们考虑了各种经典方法，如支持向量机 (SVM)、逻辑回归 (logit)、K-近邻 (KNN) 和朴素贝叶斯
    (NB)。为了比较，我们考虑了更先进的基于 AdaBoost (DT) 的方法。为了说明该方法，我们考虑了使用南加里曼省地形和气象数据的方法。在印度尼西亚之前的森林火灾预测中，以往研究都没有考虑过这种方法，无论是泥炭地还是非泥炭地。本文的结构如下：第
    1 节我们对本文考虑的问题进行了简要介绍。第 2 节中，我们概述了与我们方法相关的必要理论的简短描述并提供了方法。第 3 节提供了实证结果。第 4 节总结了结果。


