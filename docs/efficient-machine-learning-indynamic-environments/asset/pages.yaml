- pgno: 4
  md: '# Abstract


    Deep neural networks achieve state-of-the-art performance by scaling model capacity,
    data, and compute. Yet that same scaling magnifies the cost of deploying models
    in settings where resources are limited and workloads fluctuate. This dissertation
    argues that environmental variability—whether unpredictable or gradual—can be
    exploited as a lever for efficiency, yielding adaptive systems that preserve offline
    performance while reducing computation by an order of magnitude or more.


    Part I targets *arbitrary environments* where the ML inference budget may change
    from one query to the next. In Chapter 2 we develop B-DISTIL, a progressive ensemble-distillation
    algorithm that transforms a single, rigid teacher model into an elastic student
    with a tunable cost knob. Across diverse vision, speech, and sensor tasks, this
    student matches the teacher’s performance while sharply reducing inference cost.
    Chapter 3 introduces ABC, a training-free cascade that reuses existing models
    (without further modification) and relies on ensemble agreement to detect “easy”
    queries on the fly, cutting mean inference cost by 2-5× relative to the best single
    model.


    Part II addresses *benign environments* whose properties drift slowly over time.
    Chapter 4 presents continual optimization (CO), a stateful paradigm for sequences
    of related optimization programs aimed at amortizing computational effort across
    rounds. Looking at the GPU-cluster scheduling problem through the lens of CO,
    we define the underlying benign structure, and present COPTER, our approach to
    CO. By reusing computation across rounds, COPTER accelerates state-of-the-art
    solvers by 10–100× while producing allocations competitive with the offline optimum.
    Chapter 5 applies CO to two resource-allocation problems beyond machine learning—shard
    load balancing and WAN traffic engineering—where COPTER achieves similar 10–50×
    reductions in average solve time with negligible loss in solution quality.


    Together, these contributions demonstrate that adaptive computation enables efficient,
    accurate, and broadly deployable machine learning systems.'
