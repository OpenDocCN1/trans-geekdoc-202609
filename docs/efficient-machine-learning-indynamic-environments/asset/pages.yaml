  md: "# ## 4.6 Conclusion\n\nThis chapter introduced *continual optimization* (CO)—a\
    \ principled framework for exploiting the *gradual evolution* of large-scale resource\
    \ allocation problems. Leveraging the insight that successive rounds in many systems\
    \ differ marginally, CO amortizes solver effort across time rather than treating\
    \ each round as an isolated instance.\n\nWe formalized this intuition through\
    \ the notion of path lengths and demonstrated how schedulers follow a Follow-The-Leader\
    \ (FTL) process, which enjoys path dependent dynamic regret. Building on this\
    \ analysis, we explained how a warm-started **Proximal Point Algorithm** naturally\
    \ suits continual optimization in terms of run-time: its proximal updates are\
    \ contractive, benefit directly from good initializations, and—when paired with\
    \ a coordinate-descent inner solver—remain factorization-free. We instantiated\
    \ the framework as COPTER, which combines\n\n+   1. a *differential update interface*\
    \ that modifies the LP/MILP incrementally,\n+   \n+   2. a *factorization-free*\
    \ first-order solver that reuses work across rounds, and\n+   \n+   3. lightweight\
    \ *shim* heuristics that convert near-integral LP relaxations into high-quality\
    \ integer solutions without an exhaustive branch-and-cut search.\n\nExperiments\
    \ on realistic GPU-cluster traces confirmed the practical impact: COPTER delivers\
    \ up to **100×** faster end-to-end scheduling than environment-agnostic baselines,\
