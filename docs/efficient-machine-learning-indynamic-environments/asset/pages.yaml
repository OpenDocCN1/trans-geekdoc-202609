  md: '# Two-player games, online optimization and boosting.


    In this chapter we formulate progressive ensemble distillation as a two-player
    zero-sum game. The importance of equilibrium of two-player zero-sum games has
    been recognized since the foundational work of von Neumann and Morgenstern [1].
    Later applications by Schapire [4] and Freund [3] and Freund and Schapire [13]
    identified close connections between boosting and two-player games. On the basis
    of this result, a number of practical boosting-based learning approaches such
    as AdaBoost [6], gradient boosting [9], and XGboost [55] have been developed.
    Boosting has only recently seen success in modern deep learning applications.
    In particular, Suggala, Liu, and Ravikumar [118] propose a generalized boosting
    framework to train boosting-based ensembles of deep networks. Their key insight
    is that allowing function compositions in feature space can help boost deep neural
    networks. Although they focus on training and do not produce decompositions of
    pretrained models, we use a similar approach in our work to select intermediate
    layer connections between ensemble components (Section 2.2.3). A more general
    application of boosting that is similar to our setup is by Trevisan, Tulsiani,
    and Vadhan [27]. They prove that given a target bounded function g (e.g., the
    teacher model) and class of candidate approximating functions f ∈ F, one can iteratively
    approximate g arbitrarily well with respect to F using ideas from online learning
    and boosting. However, these results depend on the ability to find a function
    ft in iteration t that leads to at least a small constant improvement in a round-dependent
    approximation loss. A key contribution of the work discussed in this chapter is
    showing that such functions can be found for the practical application of progressive
    ensemble distillation by carefully selecting candidate models.'
