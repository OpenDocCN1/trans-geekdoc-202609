    leads to a cascade with competitive accuracy as \(h_2\). Instead of picking an
    error budget \(\xi\), a complementary (dual) approach is to consider a fixed inference
    budget and aim to attain the best accuracy within the budget. In this view, drops
    in accuracy (compared to the existing large model) are permissible, provided the
    inference budget is met. Jitkrittum et al. [171] examine this perspective, which
    we recommend to interested readers.


    # 3.3.3 Deferral using Ensemble Agreement


    Ensemble agreement is an instantiation of score-based deferral rules [171]. In
    its simplest form, we associate a score to the prediction output of an ensemble
    model and interpret this score as a measure of confidence in that particular prediction.
    We can then defer to a larger model when the confidence is below a predetermined
    threshold. For a model \(H_1^k(x)\) and a scoring function \(s(x)\), the deferral
    rule is defined as


    ```

    \(r(x) = \mathbb{I}[s(x) \leq \theta]\),

    ```


