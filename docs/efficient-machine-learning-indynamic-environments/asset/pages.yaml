    **Log-barrier regularizer.** To find a weak learner, the FIND-WL method minimizes
    the sum of two loss terms using stochastic gradient descent. The first is standard
    binary/multi-class cross-entropy distillation loss [50], with temperature smoothing.
    The second term corresponds to the weak learning condition, and is defined as:


    ```

    -\frac{1}{\beta} \sum_{i,j} I_{ij}^+ \log \left( 1 + \frac{l(x_i)_j}{2B} \right)
    + (1 - I_{ij}^+) \log \left( 1 - \frac{l(x_i)_j}{2B} \right)

    ```


    Here $I_{ij}^+ := I[K_t^+(i,j) > K_t^-(i,j)]$, $B$ is an upper bound on the magnitude
    of the logits, and $l(x_i) := f(x_i) - g(x_i)$. To see the intuition behind Equation
    (2.6), assume the following holds: $\forall(i,j)$


    ```

    $(K_t^+(i,j) - K_t^-(i,j))(f(x_i) - g(x_i))_j > 0.$

    ```


    Summing over all $x_i$, we can see that this is sufficient for $f$ to be a weak
    learner with respect to $g$. Equation (2.6) is a soft log-barrier version of the
    weak learning condition that penalizes those $(i,j)$ for which Equation (2.7)
    does not hold. The relative importance of the regularization objective can be
    tuned through $\beta$, encouraging $f_t$ to be a weak learner potentially at the
    expense of classification performance.


