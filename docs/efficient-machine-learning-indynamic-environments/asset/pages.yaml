- pgno: 16
  md: '# # Chapter 1


    # # Introduction


    Machine learning systems now operate everywhere—from battery-powered sensors at
    the edge to warehouse-scale GPU clusters in the cloud—making efficiency paramount.
    Even after deployment, hardware, data, and workload patterns continue to evolve,
    further shifting the landscape in which a system must operate. This dissertation
    argues that harnessing such environmental variability—whether sudden spikes or
    slow drift—can deliver order-of-magnitude reductions in inference cost and large-scale
    online optimization runtimes. The remainder of this chapter motivates that claim,
    states the thesis, and previews the contributions.


    # ## 1.1 Motivation: The ML Boom and Efficiency Gap


    The past half a decade of machine learning (ML) has been defined by an unprecedented
    scaling boom. Between 2019 and 2025, state-of-the-art language and vision models
    grew from billions to hundreds of billions of parameters (Figure 1.1), with single
    training runs consuming petaflop-days of compute and terabytes of curated data.
    Similar trends hold in computer vision, speech synthesis, and multimodal generation.
    As a result, deep learning can now generate high-definition images from text,
    translate paragraph-length passages in real time, simulate protein folding with
    astounding accuracy, and answer sophisticated questions requiring in-depth reasoning.


    Yet the same trajectory exposes a mounting efficiency gap. Training a modern LLM
    routinely requires clusters with tens of thousands of GPUs and months of wall-clock
    time; inference, though cheaper per query, still strains edge devices and even
    well-provisioned data centers during traffic spikes. Energy consumption grows
    superlinearly with model size, and the carbon footprint of a single training run
    can exceed that of multiple passenger flights. Access is therefore restricted
    to well-funded labs and industry, limiting both scientific reproducibility and
    downstream adoption.'
  merge: -1
  img_proc: true
