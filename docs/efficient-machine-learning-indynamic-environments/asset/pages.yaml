- pgno: 67
  md: 'the given objective (e.g., maximizing throughput, minimizing job completion
    time, or ensuring fairness). Additionally, constraints are added to ensure that
    the resulting allocations are valid, realizable, and satisfy any policy requirements
    (e.g., priority requests must be satisfied before other requests).


    **Standard form linear program** Without loss of generality, let us consider linear
    programs in their *standard form*:


    \(\min_x \ f(x) = c^T x\)


    **subject to:** \(Ax \le b, x \ge 0\) (4.1)


    where: \(x \in \mathbb{R}^n\) is a vector of decision variables, \(f(x) = c^T
    x\) is the *linear* objective function on the decision variables, \(A \in \mathbb{R}^{m
    \times n}\) is the constraint matrix, \(b \in \mathbb{R}^m\) is the right-hand
    side vector. Additionally, in *mixed-integer* LPs (MILPs), some or all variables
    are constrained to integral values. MILPs are particularly useful in resource
    allocation as the decision variables in many problems are inherently discrete.
    For example, a resource is either allocated to some job or not; likewise a job
    is allocated some resource or none.


    **Example: GPU Cluster Scheduling** Consider a simplified GPU cluster scheduling
    problem. Let the cluster have \(N\) GPUs and \(M\) jobs. Let \(g_j\) be the number
    of GPUs requested by job \(j\), and \(c_j\) be its throughput when using \(g_j\)
    GPUs. We wish to allocate resources to maximize the throughput of jobs in the
    cluster under the GPU capacity constraints. This can be stated as the following
    linear program:


    \(\min_x \ -c^T x\)


    **subject to:** \(G \cdot x \le N, x_j \in \{0, 1\} \quad \forall j\)


    where \(c = [c_1, c_2, \dots, c_M]\) is the throughput vector, \(G = [g_1, g_2,
    \dots, g_M]\) is a \(1 \times M\) matrix, and \(x = [x_1, x_2, \dots x_M]\) is
    the vector of variables. The variable \(x_j = 1\) iff \(g_j\) GPUs are allocated
    to job \(j\) (0 otherwise).


    # 4.2.1 Solving linear programs


    The LP/MILP formulations of a resource allocation (RA) problem are solved in two
    stages, with an additional third stage for MILPs.


    +   **1. Program compilation** This stage transforms the resource allocation problem
    into a form that existing solvers can consume. In the example GPU scheduling problem
    in Section 4.2, this involves (a) ordering the \(M\) active jobs and assigning
    them an index in \(\{1 \dots M\}\), (b) building the \(c\) vector and (c) building
    the \(G\) matrix.'
