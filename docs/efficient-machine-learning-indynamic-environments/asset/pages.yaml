    Let the cascade consist of an ensemble \(H_1^k\) at the lower level, and the larger
    model \(h_2\) at the higher level; \(\mathcal{M} = \{H_1^k, h_2\}\). Let \(r(x)\)
    denote a deferral rule;


    ```

    \(r(x) = \begin{cases} 1 & \text{defer to } h_2 \\ 0 & \text{use } H_1^k. \end{cases}\)

    ```


    In this work, we focus on deployment scenarios where a decrease in model performance
    is a critical concern. This is particularly relevant when cascades are intended
    to function as a drop-in replacement for an existing deployment of an expensive
    model. This notion can be formulated as maximizing the number of calls to the
    smaller model, while retaining the accuracy of the larger model. With slight abuse
    of notation, let \(\mathcal{M}_r(x)\) denote the prediction of the cascade with
    \(\mathcal{M} = \{H_1^k, h_2\}\) and deferral rule \(r\). Then we desire that
