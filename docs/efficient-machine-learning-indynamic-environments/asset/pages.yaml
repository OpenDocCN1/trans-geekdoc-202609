    # 2.3 Theoretical Analysis


    In this section we provide theoretical analysis and justification for our method.
    First, we show that the ensemble output produced by Algorithm 1 converges to $g$
    at $\mathcal{O}(1/\sqrt{T})$ rate, provided that the procedure FIND-WL succeeds
    at each time $t$.


    Theorem 2.1. *Suppose the class* $\mathcal{F}$ *satisfies, for all* $f \in \mathcal{F},
    \|f - g\|_\infty \le G_\infty$. *Let* $F = \{f_t\}_{t=1}^T$ *be the ensemble after
    T rounds of Algorithm 1, with the final output* $F_t = \frac{1}{T} \sum_{t=1}^T
    f_t$. *If* $f_t$ *satisfies Equation (2.7) for all* $t \le T$ *then for* $T \ge
    \ln 2N$ *and*


    $$\eta = \frac{1}{G_\infty} \sqrt{\frac{\ln 2N}{T}}$$


    we have for all $j$


    $$\|F_{t,j} - g_j\|_\infty \le G_\infty \sqrt{\frac{\ln 2N}{T}} - \frac{1}{T}
    \sum_{t=1}^T \gamma_t(j)$$ (2.8)


    where $F_{t,j}$ and $g_j$ are the $j^{th}$ coordinates of the functions $F_t$
    and $g$ respectively.


    The main idea behind the proof is to bound the rate of convergence of the algorithm
    towards the minimax solution. This proceeds by maintaining a potential function
    and keeping track of its progress through the algorithm. The bounds and techniques
    used here are also general, in the sense that for various objectives and loss
    functions, appropriately designed weak learners give similar rates of convergence
    to the minimax solution. Furthermore, a stronger version that shows exponential
    rates can be shown by additionally assuming a constant edge for the weak learner
    (Equation (2.9)) in the proof that follows.'
