  md: '# Appendix A


    # Progressive Distillation: Additional Details


    # A.1 Two-Player Minimax Games


    In this section, we will look at the setting of two-player minimax games more
    closely.

    Consider a class of hypotheses $\mathcal{F}$ and class of probability distributions
    $\mathcal{P}$. In addition, consider a loss function $\mathcal{L} : \mathcal{F}
    \times \mathcal{X} \rightarrow \mathbb{R}$ that is convex in its first argument.
    We consider two players whose pure strategy sets are $\mathcal{F}$ and $\mathcal{P}$
    respectively. The loss and reward of the players is given by $F(f, p) = \mathbb{E}_{x
    \sim p}[\mathcal{L}(f, x)]$ and the minimax value of the game is


    ```

    \(\max_{p \in \mathcal{P}} \min_{f \in \mathcal{F}} F(f, p).\) (A.1)

    ```


    Note that this game is convex in the hypothesis player and concave in the distribution
    player. The objective of the game for the hypothesis player is trying to find
    a hypothesis that has low loss on the worst case distribution from class $\mathcal{P}$.
    Conversely, the distribution player is trying to construct a distribution that
    is as hard as possible for the hypothesis player to learn.


    Also, note that under reasonable conditions on $\mathcal{F}$ and $\mathcal{P}$,
    we have the minimax theorem holds (see Chapter 6, Shapire and Freund [36]),


    ```

    \(\max_{p \in \mathcal{P}} \min_{f \in \mathcal{F}} \mathbb{E}_{x \sim p}[L(f,
    x)] = \min_{f \in \Delta(\mathcal{F})} \max_{p \in \mathcal{P}} \mathbb{E}_{x
    \sim p}[L(f, x)].\) (A.2)

    ```


    Here, $\Delta(\mathcal{F})$ is the set of distributions over functions $\mathcal{F}$.
    From this, we can see that as long as we are allowed to aggregate functions from
    the base class, we can do as well as we could if we had access to the distribution.


    The interesting algorithmic question would be to find a distribution over hypotheses
    that achieves the minimum above. Note that the loss function is stochastic and
    thus,'
