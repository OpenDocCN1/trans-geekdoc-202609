    # 3.4.1 When is ABC Practical?


    # When Parallelization is Cheap


    We first consider the case where the inference cost of an ensemble of models is
    the same as the cost of a single model. This idealistic scenario could happen,
    for instance, in offline batch inference [133], when GPUs are available for parallelization,
    or the models are small enough that existing resources are underutilized and an
    ensemble adds no additional cost. More importantly, this setting establishes best-case
    accuracy and inference cost values for ABC. We consider total floating-point operations
    (FLOPs) as a representative inference cost metric here, and discuss other metrics
    such as communication cost, latency, or cloud rental costs in subsequent subsections.


    The accuracy vs. FLOPs for ABC is shown in Figure 3.2. As a point of comparison,
    we also include Wisdom-of-Committees (WoC) [143], a popular and representative
    confidence-based model cascading method. In most cases, we observe that ABC is
    able to improve the Pareto frontiers, as it usually sees a 1–2 point increase
    in accuracy. We attribute this to a combination of (a) the improvement ensembles
    can have on accuracy that is widely noted in literature [152, 170] and (b) the
    improvement agreement-based rules can cause in cascading (Appendix B.1). Overall,
    in terms of accuracy, ABC either exceeds—or at least matches—the accuracy of the
    best models at a fixed FLOPs budget, and is a practical drop-in replacement for
    these models.


    # Disparity in Relative Cost is High


