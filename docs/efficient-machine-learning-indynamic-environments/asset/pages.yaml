    # ## 4.2.2 Scalability challenges in solving linear programs


    Traditional approaches to round-based resource allocation reformulate and solve
    one RA problem *from scratch* in each round. This means that, in each round, we
    recompile the current linear program from scratch, pass this to an LP solver,
    and use a procedure like branch-and-bound [23, 202] to recover integer solutions
    to the problem as needed. As problem sizes grow (e.g., clusters with tens of thousands
    of GPUs/jobs), each stage in solving an LP faces scalability challenges we discuss
    below.


    **Program recompilation discards prior computational effort** For any RA problem,
    the bulk of the compilation time is spent in constructing the constraint matrix.
    Constraint matrices are often quite sparse— each row in the matrix corresponds
    to a constraint on a resource or request, and applies to a small subset of variables
    at once. For large resource-allocation problems, even the sparse representation
    can contain tens of millions of nonzero values and can take tens of seconds to
    populate in each round. Further, since current approaches trigger full recompilation
    for small changes to the problem (e.g., add/remove resources/requests), they discard
    all prior computational effort spent in creating constraint matrices in prior
    rounds. We show in Section 4.3 that it is possible to reduce this overhead of
    recompilation every round by adopting a problem-level *differential* interface,
    significantly reducing end-to-end runtimes.


