- pgno: 132
  md: '# Appendix B


    # ABC: Additional Details


    # B.1 Agreement-Based Cascading (ABC) can Improve Accuracy


    Our construction of ABC, as explained in Section Section 3.2 and Section 3.3 is
    based on *safe deferral rules* (Definition 3.1) — rules such that when a data
    point is selected at a lower cascade tier, the inference is accurate with high
    probability. This means that if the lower tier of the cascade has a higher accuracy
    compared to the largest model, on the ‘easy’ data it predicts on, the overall
    accuracy of ABC can increase. For ‘hard’ samples ABC and the largest, SoTA model
    produces identical predictions as ABC is internally deferring to this model. We
    formalize this notion of accuracy improvement in this section.


    Consider a classification problem in the statistical learning framework, where
    $\mathcal{X}$ is our instance space and $\mathcal{Y}$ is the label space. Let
    $r$ denote any deterministic deferral rule $r : \mathcal{X} \rightarrow \{0,1\}$.
    Let $\{h_1, h_2\}$ be two classifiers $h_i : \mathcal{X} \rightarrow \mathcal{Y}$
    for $i \in \{1,2\}$. We will think of $h_2$ as being the more expensive (better
    accuracy) model. Consider a distribution $P$ over $\mathcal{X} \times \mathcal{Y}$.
    The risk of classifier $h_2$ is defined as


    $\mathcal{R}(h_2) = P(h_2(x) \neq y)$


    Let us define a cascaded classifier $\mathcal{M}_r : \mathcal{X} \rightarrow \mathcal{Y}$
    such that,


    $$\mathcal{M}_r(x) = \begin{cases} h_1(x) & r(x) = 0 \\ h_2(x) & r(x) = 1. \end{cases}
    \tag{B.1}$$


    Then the risk of the cascaded classifier using rule $r$ is,


    $\mathcal{R}(\mathcal{M}_r) = P(\mathcal{M}_r(x) \neq y)$'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'We wish to understand when we can replace an existing large, expensive classifier
    \(h_2\) with a cascade such that there is no drop in accuracy. This is useful
    when we are extremely sensitive towards accuracy drop and wish to only select
    models at the lower-level when we are certain about the classification. Let us
    define the excess risk of using a cascade in-place of the larger model \(h_2\)
    as,


    \(\mathcal{R}_{excess}(\mathcal{M}_r, h_2) = \mathcal{R}(\mathcal{M}_r) - \mathcal{R}(h_2)\).


    Expanding further, we can express the excess risk as,


    \(\mathcal{R}_{excess}(\mathcal{M}_r, h_2) = P(\mathcal{M}_r(x) \neq y) - P(h_2(x)
    \neq y)\)

    \(= P(\mathcal{M}_r(x) \neq y \mid r(x) = 0)P(r(x) = 0) + P(\mathcal{M}_r(x) \neq
    y \mid r(x) = 1)P(r(x) = 1)\)

    \(- P(h_2(x) \neq y)\)

    \(= P(h_1(x) \neq y \mid r(x) = 0)P(r(x) = 0) + P(h_2(x) \neq y \mid r(x) = 1)P(r(x)
    = 1)\)

    \(- P(h_2(x) \neq y \mid r(x) = 0)P(r(x) = 0) - P(h_2(x) \neq y \mid r(x) = 1)P(r(x)
    = 1)\)

    \(= \left( P(h_1(x) \neq y \mid r(x) = 0) - P(h_2(x) \neq y \mid r(x) = 0) \right)
    P(r(x) = 0)\)

    (B.2)


    As can be seen, the general excess risk here depends on both models. Since our
    focus is on accuracy, any rule that leads to a risk that is no worse than that
    of the classifier \(h_2\) can be used, and we term these as *admissible cascades*.


    **Definition B.1** (Admissible cascades). \(\mathcal{M}_r(x)\) defined above is
    an admissible cascade w.r.t. the population distribution \(P\) and the reference
    classifier \(h_2\) if,


    \(\mathcal{R}_{excess}(\mathcal{M}_r, h_2) \le 0\),


    or equivalently


    \(P(h_1(x) \neq y \mid r(x) = 0) \le P(h_2(x) \neq y \mid r(x) = 0)\).


    As mentioned in Section 3.3, for this work, we specialize to the case where whenever
    the smaller model is selected, it is always correct. That is, \(P(h_1(x) \neq
    y \mid r(x) = 0) = 0\). Of course, such a pair of smaller-classifier \(h_1\) and
    deferral rule \(r\) need not exist. However, whenever they do, a cascade constructed
    using *any* \(h_2\) is admissible since,


    \(\forall h_2, \mathcal{R}_{excess}(\mathcal{M}_r, h_2) = -P(h_2(x) \neq y \mid
    r(x) = 0)P(r(x) = 0) \le 0\).


    This implies a *universal nature* of such \((h_1, r)\) for such two tier cascades
    as the excess risk of the cascade does not depend on the larger classifier \(h_2\).'
  merge: -1
  img_proc: true
