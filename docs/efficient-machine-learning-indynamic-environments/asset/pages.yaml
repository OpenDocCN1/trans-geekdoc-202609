  md: '# Chapter 3


    # Dynamically Determining Elasticity


    This chapter builds on the elastic models introduced in Chapter 2. In Chapter
    2, we addressed variability in resource budget—situations where the available
    compute budget changes from query to query. Here, however, we confront variability
    in query difficulty: cases where some queries are trivially answered by a lightweight
    model, while others require a far larger model. We present ABC (Agreement-Based
    Cascading), a lightweight, training-free procedure that chooses an inference elasticity
    based on each query''s difficulty, thereby reducing the average inference cost
    in proportion to the fraction of easy queries. The material in this chapter is
    built on the work of Kolawold, Dennis, Talwalkar, and Smith [192].


    # 3.1 Query Difficulty


    In many real-world ML deployments, a considerable portion of the data seen during
    inference can be effectively evaluated using lightweight models rather than state-of-the-art
    giants [102, 171]. That is, it is possible to associate a notion of difficulty
    with each inference query. Intuitively, given a Pareto-optimal set of models for
    a given inference task, we can order the queries based on the least expensive
    model that can produce a high-quality inference output for the query. For instance,
    in language modeling tasks such as question answering, one can get away with using
    a relatively low parameter-count model to answer simple factual questions, while
    a high parameter-count reasoning based model might be required for more sophisticated
    questions requiring research and synthesis.


    From an efficiency point of view, this means that if we can identify the subset
    of inference queries that can be accurately evaluated by less expensive models,
    average inference costs can be reduced. A natural approach to this problem is
    to construct an elastic model comprising the Pareto-optimal models for a given
    task (Figure 3.1) and'
