    # Dynamic and Adaptive Networks


    Routing procedures typically train an independent routing mechanism, keeping the
    Pareto-set of models untouched. However, for many medium-scale applications, methods
    have been explored that learn a Pareto-set of models and stopping criterion together.
    For example, early exit methods of Huang et al. [74], Wang et al. [80], Liu et
    al. [111], Xin et al. [119], Zhou et al. [120], Geng et al. [130], and Schuster
    et al. [159], subnetworks extraction methods [83, 100, 109, 123, 153, 167], composition-based
    methods [117, 166, 187] are some of the more recent examples.


    Our approach diverges from these methods, as it does not involve altering model
    architectures or retraining from scratch. Instead, ABC leverages existing models
    as they are, utilizing ensemble agreement as a deferral condition, which can be
    applied directly to these models without any need for fine-tuning or specialized
