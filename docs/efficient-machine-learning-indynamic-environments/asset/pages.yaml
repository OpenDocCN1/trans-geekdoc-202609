    The remainder of this chapter develops the goals of progressive ensemble distillation
    (Section 2.2), introduces the B-DISTIL algorithm (Algorithm 1), provides convergence
    guarantees (Section 2.3), and empirically validates the method on synthetic and
    real-world benchmarks (2.4).


    # ## 2.2 Progressive Ensemble Distillation


    Progressive ensemble distillation seeks to approximate a high-capacity model with
    an ensemble of smaller, lower-latency models. At runtime, accuracy can be traded
    for latency by selecting how many ensemble members to evaluate—an _elasticity_
    knob exposed to the user. This section formalizes the problem as a two-player
    game and introduces the resulting algorithm, B-DISTIL.


    # ### 2.2.1 Problem Formulation


    Consider repeated plays of a general two-player zero-sum game with the pure strategy
    sets comprising hypothesis class $\mathcal{F}$ and a probability distribution
    $\mathcal{P}$. Given a teacher model $g$, our goal is to produce an ensemble of
    predictors from the set of hypothesis classes $\{\mathcal{F}_m\}$ to approximate
    $g$ well. Given a loss function $\mathcal{L}$ that measures the quality of a model
    $f \in \mathcal{F}$, let the loss (and reward) of the players be given by $F(f,
    p) = \mathbb{E}_{x \sim p}[\mathcal{L}(f, x)]$, and the minimax value of the game
    is


    $$ \max_{p \in \mathcal{P}} \min_{f \in \mathcal{F}} F(f, p) . $$ (2.1)


    In the context of distillation, given a training set $\{x_i\}$, the max player
    in Equation (2.1) selects a distribution over the training set, while the min
    player chooses a hypothesis that minimizes the loss under this distribution. In
    this setting, note that $\mathcal{P} = \left\{p \in \mathbb{R}^{N \times L} :
    p_{i,j} \ge 0, \forall j \sum_i p_{i,j} = 1 \right\}$ is the product of simplices
    in $N \times L$ dimensions, and


    $$ (\nabla_f F(f, p))_j = \sum_i p_{i,j} (f(x_i) - g(x_i))_j . $$ (2.2)


    Tools from the framework of stochastic minimax optimization can be used to approximately
    attain the value in Equation (2.1) (see Appendix A.1 for a more involved discussion).
    As is common in this setup, we assume our algorithm is provided access _weak gradient_
    vector $h$ such that, when queried at distribution $p \in \mathcal{P}$ and for
    $\beta > 0$,


    $$ \langle h, \nabla_f F(f, p) \rangle \ge \beta . $$ (2.3)'
