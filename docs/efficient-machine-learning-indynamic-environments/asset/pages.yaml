    _cascade_ over them, starting from the least expensive and moving to more expensive
    models based on some _deferral rule_ [8, 14, 42]. The deferral rule is usually
    inexpensive—e.g., a model’s confidence score [18, 79, 143]—and determines when
    to cascade up to a larger model (i.e., the elasticity parameter).


    Recently, cascading has seen renewed interest in the ML community with the advent
    of large language models (LLMs) and vision foundation models [e.g., 165, 190].
    Recent approaches consider a variety of techniques to construct model cascades,
    including designing novel model architectures that have built-in cascading capabilities
    [85, 167, 172], or learning routing schemes/deferral rules that require data-dependent
    training for every task considered [165, 186]. While these approaches can improve
    accuracy/efficiency trade-offs, they may also introduce significant computational
    overhead in setup and training/fine-tuning costs.


    We instead focus on a simple, _training-free_ cascade scheme that uses the agreement
    amongst an ensemble of existing models at each cascade level as its deferral rule.
    We refer to this approach as _Agreement-Based Cascading_ (ABC). Intuitively, when
    the outputs of the ensemble at a particular cascade level do not align, then ABC
    triggers cascading, and inference is attempted at the next tier of (larger) models
    (see Figure 3.1). The tier at which cascading terminates implicitly selects the
    elasticity parameter. This scheme has been explored historically for specialized
    applications'
