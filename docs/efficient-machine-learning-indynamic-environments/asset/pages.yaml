    # **Overheads of training/distillation.**


    B-DISTIL requires additional compute and memory compared to a single model''s
    training. Maintaining the two matrices $K_t^+$ and $K_t^-$ requires an additional
    $\mathcal{O}(NL)$ memory. Even for relatively large datasets with, say, $N = 10^6$
    samples and $L = 1000$ classes, this comes out to a few gigabytes. However, since
    the two matrices can be stored on disk, a batch can be loaded into memory for
    loss computation asynchronously using data loaders provided by standard ML frameworks.
    The additional GPU memory requirement therefore becomes quite small, $\mathcal{O}(bL)$
    for a mini-batch size $b$, same as the memory required to maintain one-hot classification
    labels for a mini-batch. Since gradient computation is required only for the model
    being trained in each round, which typically is smaller than the teacher model,
    the backward pass is relatively cheap. For large datasets, loading the data for
    the teacher model forward pass becomes the bottleneck. See Appendix A.4 for discussion
    on data loading, training time, and resources for an ImageNet distillation.'
