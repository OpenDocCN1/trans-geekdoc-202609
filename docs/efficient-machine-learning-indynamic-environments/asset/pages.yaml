    **Differential interface for problem updates.** COPTER uses a differential interface
    at the problem level that reflects changes to the allocation problem from the
    addition and/or removal of resources and requests between rounds. To support such
    differential updates to the problem we need to efficiently support the following
    methods:


    +   - add-request(request ID, num variables): modifies A by (a) appending num
