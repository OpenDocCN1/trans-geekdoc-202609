    # Solving Optimization Problems


    **Offline optimization.** Offline optimization deals with problems that are fully
    specified before optimization starts. State-of-the-art LP and MILP solvers (e.g.,
    CPLEX [154], Gurobi [202], GLPK [23]) often use simplex or interior-point (barrier)
    methods that rely on solving linear systems iteratively, and employ optimizations
    like matrix factorizations (LU, QR, LDL) [23, 154]. These methods scale poorly
    to large problems due to high per-iteration costs. Additionally, factorization
    often destroys sparsity patterns in the constraint matrices and must be recomputed
    if the problem changes, rendering them inefficient for continual optimization
    where problems change frequently. First-order methods, such as OSQP [116], ADMM
    [28], ALCD [54, 68], PGD [2] emerged to address these limitations, trading lower
    per-iteration costs for slower convergence. For instance, to scale solvers to
    large-scale problems in seismic reflection tomography applications, Delbos and
    Gilbert [19] eschew simplex and interior point based methods, and instead develop
    a first order method based on the Augmented Lagrangian and conjugate gradients.
    This approach was further adapted to large-scale sparse linear programs in [54]
    with further improved analysis and runtime improvements coming from [68]. Stochastic
    versions of these algorithms, such as Stochastic Gradient Descent (SGD) are also
    popular, further trading convergence (and feasibility) for simpler per-iteration
    complexity.


    **Online optimization.** The approaches discussed thus far are fundamentally offline
    approaches — they construct a linear program offline and employ a solver to solve
    it. In contrast, online optimization [57] methods instead optimize problems that
    are sequentially revealed and introduce a notion of time steps. Algorithms for
    online optimization often have some notion of uncertainty, and typically attempt
    to minimize regret against a fixed optimum [35, 57, 125]. The goal of an online
    optimization algorithm is to guarantee that the regret is sublinear in the number
    of iterations of the algorithm; so called no-regret algorithms. Although round-based
    resource allocations can be cast as an online optimization problem, the setting
    is not directly applicable, as'
