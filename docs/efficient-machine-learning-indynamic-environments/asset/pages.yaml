  md: 'such as face detection [20, 24, 31], where ensembles of binary face detectors
    focus on subregions of the face and combine their output using decision networks.
    However, the use of ensemble agreement as a deferral mechanism for more general,
    modern ML workloads has not received enough attention. A few trends in ML make
    ABC a particularly attractive approach for model cascading. While using an ensemble
    of models at each level may initially appear to increase overall inference costs,
    this simple baseline could excel in real-world applications due to: (i) the growing
    ease of obtaining pretrained models of various sizes and accuracy levels due to
    the rise of model registries [98] as well as flexible compression schemes [166,
    184]; (ii) scaling laws that predict a large increase in inference cost for every
    marginal increase in accuracy [64] (Figure 3.1); and (iii) an increased ability
    to execute ensembles of relatively small models in parallel, with minimal additional
    costs [16, 173, 178] (Figure 3.3).


    In this chapter we (i) propose ABC, a training-free, deferral-based cascade that
    leverages agreement within an ensemble to decide when to escalate, removing the
    need for dedicated routing networks or specialized architectures; (ii) theoretically
    characterize when ABC can replace an existing deployment without sacrificing accuracy,
    introduce *safe-deferral* conditions, and derive bounds on expected accuracy and
    inference cost; and (iii) empirically demonstrate that ABC improves both efficiency
    and accuracy across diverse vision and language benchmarks. In practical settings,
    ABC cuts communication cost by up to 14× in edge-to-cloud inference, reduces GPU
    rental cost by up to 3× in heterogeneous model-serving scenarios, and lowers average
    API cost per token by up to 25× when models are accessed as black-box services.


    # 3.2 Agreement-Based Cascading (ABC)


    In this section, we present a high-level overview of the Agreement-Based Cascading
    (ABC) approach, providing the essential concepts and insights needed to understand
    ABC’s effectiveness in the experiments (Section 3.4). Readers interested in the
    technical details can refer to Section 3.3 for a more comprehensive treatment.


    # 3.2.1 Overview of ABC Approach


    As outlined in Section 3.1, the goal of adaptive inference is to identify data
    samples that can be evaluated accurately by a less expensive model. This way,
    we can reduce the inference cost based on whether a sample is ‘easy’ or ‘hard’.
    A common approach to this problem is deferral-based cascading, where we cascade
    over a sequence of models, starting from the least expensive and using a ‘deferral
    rule’ to determine if a higher tier model must be used. These deferral rules are
    typically significantly cheaper to evaluate (e.g., a small neural network), and
    add very little additional cost on top'
