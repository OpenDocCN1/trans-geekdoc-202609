    # 1.2 Why Static Optimization Falls Short


    A rich literature narrows the efficiency gap by *static* means. Broadly applicable
    methods such as model compression and distillation [21, 48, 50, 166], federated
    learning [66, 126], and efficient architecture design [52, 76, 87] complement
    rapid advances in hardware and software, including mixed-precision formats [67],
    tensor cores [205], and high-bandwidth interconnects [110]. These techniques yield
    large wins, but they share a common premise: the target deployment environment
    (dataset, resource budget, available hardware, query complexity) is fixed *a priori*.
    Once the model or approach is tuned, it is frozen and deployed unchanged. In practice,
    however, operating conditions and available resources in ML systems are rarely
    fixed:


    +   • **Resource volatility.** On edge devices, battery level, thermal headroom,
    compute cycles, and wireless bandwidth can swing between successive inference
    calls. In the cloud, ephemeral GPU leases may be preempted with little warning,
    serverless functions incur cold-start delays, and backbone congestion leads to
    network delays and throttling. Any rigid deployment must therefore over-provision
    resources to accommodate these variances or risk timeouts.


    +   • **Query heterogeneity.** Interactive services—web search, recommendation,
    dialogue—receive a highly skewed mix of easy and hard requests. A keyword query
    like “weather in Pittsburgh” is correctly answered by a tiny model, whereas an
    open-ended prompt—“What color is your raindrop?”—may need a much larger LLM with
    chain-of-thought reasoning. Using a single model for both wastes compute on the
    median case or sacrifices quality on the tail.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   * **Cluster churn.** Multi-tenant GPU clusters never sit still: new training
    jobs arrive, spot instances are reclaimed, nodes fail or enter maintenance, and
    resource demand shifts. Job schedules and resource allocations computed offline
    grow stale within minutes, forcing either slack capacity or frequent re-solving,
    limiting the scale of problems they are applicable to.


    Beyond a point, static tuning hits a ceiling as we demonstrate: further pruning
    or hardware acceleration degrades accuracy faster than it saves resources. Additional
    gains, therefore, require adapting to problem-specific structure—for example,
    reducing latency in sequential tasks by predicting on shorter subsequences [70]
    or exploiting temporal similarity in streaming inputs [87]. As conditions drift
    further during deployment, tuning must be *repeated* or resources must be over-provisioned—motivating
    the approaches developed in the chapters that follow.


    # 1.3 Central Thesis: Variability as a Lever for Efficiency


    Deep learning''s remarkable progress has been fueled by steadily increasing model
    capacity, data volume, and compute availability. Yet at the point of deployment—whether
    on a battery-powered sensor or across a shared GPU cluster—resources fluctuate,
    constraints tighten, and *brute-force scaling* quickly becomes impractical. This
    raises the guiding question of this dissertation:


    > > How can learning systems convert environmental variability into efficiency
    gains without sacrificing performance?


    Our answer is to treat those fluctuations not as nuisances to be masked by worst-case
    provisioning, but as exploitable structure. By aligning computation with the temporal
    and structural variability of its environment, a learning system can deliver equivalent—or
    superior—utility at a fraction of the cost. The argument unfolds across two complementary
    regimes:


    **Arbitrary environments:** In many real-world systems external conditions—battery
    drain, network congestion, input difficulty—may swing unpredictably from one point
    in time to the next. Each inference or optimization step must therefore remain
    memoryless or **stateless**, making no assumptions about the past and no promises
    about the future. Our goal in this regime is **elasticity**: adapt the computation
    to the budget and difficulty of the *current* instance, opportunistically saving
    work while degrading gracefully to a static method when the world behaves truly
    arbitrarily.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Gradually evolving environments: Many real systems are more benign and evolve
    gradually. The job queue on a GPU cluster at minute t resembles the queue at minute
    t−1; network throughput in minute five is close to that in minute four. Such slow
    drift makes yesterday’s solution a valuable head start on today’s problem. Algorithms
    for this regime are therefore stateful: they cache intermediate results, apply
    differential updates, and amortize effort across rounds instead of recomputing
    from scratch.


    This dissertation is organized into two parts based on the type of environment
    they focus on: Part I designs elastic models for ML inference in arbitrary environments,
    and Part II discusses continual optimization for gradually evolving environments.


    # 1.4 Contributions and Roadmap


    By fusing ideas from machine learning, systems, and optimization, this work delivers
    practical contributions to support our thesis, organized across two parts:


    # Part I – Adaptive Inference in Arbitrary Environments


    +   Chapter 2 – Constructing Elastic ML Models. We introduce progressive ensemble
    distillation, a principled way to decompose a large pretrained model into an elastic
    ensemble whose inference cost can be dialed up or down at runtime. The resulting
    B-DISTIL algorithm uses a boosting-like training procedure to build the ensemble
    and delivers competitive accuracy under tight resource budgets. B-DISTIL shows
    improvements in resource utilization across tasks in vision, speech, and sensor
    benchmarks and admits a O(1/√T) convergence guarantee for the distillation procedure.


    +   Chapter 3 – Dynamically Determining Elasticity. Shifting focus from fluctuating
    budgets to fluctuating query difficulty, ABC leverages ensemble agreement as a
    difficulty signal to construct elastic models that adapt to query difficulty changes.
    Because it relies solely on forward passes for the agreement checks, ABC is completely
    training-free and can be deployed on black-box APIs. Across four language, vision,
    and multimodal tasks, ABC cuts communication cost by up to 14× in edge-to-cloud
    inference, reduces GPU rental cost by up to 3× in heterogeneous model-serving
    scenarios, and lowers average API cost per token by 25× when accessed as black-box
    services.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Part II – Continual Optimization in Gradually Evolving Environments


    +   • Chapter 4 – Continually Adapting to Gradually Evolving Environments. Formalizing
    “slow evolution” in large-scale resource allocation problems, this chapter introduces
    the continual optimization paradigm and instantiates it with the COPTER algorithm
    for GPU cluster scheduling. By reusing prior solver work and warm-starting on
    each new round, COPTER achieves up to 100× reductions in solver time while maintaining
    near-optimal job completion times.


    +   • Chapter 5 – Gradual Evolution Beyond Machine Learning. To show generality
    beyond ML training, we apply continual optimization to two further domains—shard
    load balancing and WAN traffic engineering. Using COPTER, both MILP and LP formulations
    solve 10–100× faster than state-of-the-art baselines, with negligible loss in
    allocation quality.


    # 1.5 Broader Impact and Future Outlook


    The evidence we collect across Part I and Part II shows that adapting computation
    to its deployment environment can unlock order-of-magnitude resource efficiency
    savings while remaining competitive. The gains translate into longer battery life
    on edge devices, lower carbon footprints for data center workloads, and wider
    access to high-quality machine learning in resource-constrained settings. Looking
    forward, the adaptive lens opens several research frontiers:


    +   • Edge-to-Cloud Continuum. Current elastic models end at the device boundary,
    while continual optimizers start inside the data center. An end-to-end pipeline
    that jointly tunes on-device inference and backend scheduling will minimize total
    cost for hybrid applications such as real-time video analytics.


    +   • Privacy-Aware Adaptivity. Benign workloads often arise in federated or privacy-constrained
    settings, where data cannot leave the device. Extending continual optimization
    to respect differential privacy or secure aggregation constraints would enable
    low-cost personalization without compromising data.


    +   • Theory of Continual Optimization. Chapters 4 and 5 provide empirical evidence
    and formalizations that show how continual optimization can accelerate benign
    workloads. Extending these to other notions of gradual changes, considering cases
    where even the warm-started solver gets only a few iterations, and providing tighter
    regret/runtime bounds are interesting open problems.


    By treating environmental variability—whether wild or mild—as an opportunity rather
    than a threat, this dissertation charts a path toward machine learning systems
    that are not only more efficient, but also more sustainable, privacy-preserving,
    and universally deployable.'
