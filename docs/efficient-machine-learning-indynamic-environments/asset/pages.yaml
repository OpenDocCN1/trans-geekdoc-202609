  md: '# Chapter 4


    # Continually Adapting to Gradually-Evolving Environments


    The first part of this dissertation studied efficient inference in *arbitrary*
    environments: Chapter 2 handled resource budgets that fluctuate unpredictably
    across inference requests, and Chapter 3 addressed queries whose difficulty varies
    from one request to the next. Part II turns to the complementary case of *gradually-evolving
    environments*—settings in which the relevant property of the environment evolves
    slowly and in a regular, predictable manner. Such structure lets us reuse past
    effort and anticipate future changes and to design algorithms that adapt more
    efficiently.


    This chapter focuses on *resource allocation* in large-scale deep-learning clusters.
    We formalize a notion of slow evolution for this setting and introduce COPTER
    (**C**ontinual **O**ptimizer), an algorithm that exploits gradual changes in such
    resource allocation problems to produce high-quality allocations effectively.
    The material builds on work by Jayaram Subramanya, Dennis, Smith, and Ganger [203].


    # ## 4.1 Resource Allocation in Machine Learning


    Resource allocation—the process of assigning finite resources (e.g., GPUs, CPUs,
    link capacity) to competing requests (e.g., training jobs, network flows)—is a
    cornerstone of modern computer systems. For example, in deep learning clusters,
    schedulers must allocate thousands of GPUs to jobs with diverse requirements while
    balancing throughput and fairness [137, 169]. In Wide-Area Network (WAN) traffic
    engineering, operators allocate flows to links to maximize network utilization
    and minimize latency [182]. Traditional heuristics, like First-Come-First-Served
    (FCFS) for cluster scheduling, offer simplicity but lack the expressivity to enforce
    sophisticated constraints such as quality-of-service guarantees or fairness policies.
    To address this, many systems'
