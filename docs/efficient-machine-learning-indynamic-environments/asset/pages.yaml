    and develop an algorithm to address this problem.


    **Progressive Ensemble Distillation.** With progressive ensemble distillation,
    we seek to distill a large pretrained model, _g_, onto an ordered ensemble of
    ‘cheaper’ models (for instance, low-latency models), such that evaluating the
    first model is inexpensive but only produces a coarse estimate of the prediction
    (e.g., covering common cases), and evaluating additional models improves on this
    estimate (see Figure 2.2). This means that we can trade off between accuracy and
    inference time (latency) at runtime, by choosing the number of models we evaluate
    (_elasticity_ parameter).


    Beyond elasticity, this decomposition confers additional practical benefits. On-device
    inference can combine ensemble components to meet latency constraints [94, 144];
    the ordered structure naturally supports early-exit [61, 70] and any-time inference
    [73, 141] scenarios, and the learners can execute either sequentially or in parallel.
    Concretely: (i) we can control the accuracy-cost trade-off on demand, (ii) we
    can interleave sequential and parallel execution, and (iii) we can resume and
    improve upon coarse predictions without re-evaluating earlier learners.


    Standard distillation struggles when the student’s capacity is much smaller than
    the teacher’s [112, 129], and distilling onto any weighted sum of shallow networks
    rarely outperforms distillation onto a single model [86, 149]. By composing and
    reusing intermediate activations and by introducing an additional loss term motivated
    by boosting theory [13], we perform _progressive ensemble distillation_ even when
    the capacity gap is large. As long as the compositions remain resource-efficient,
    we enlarge the hypothesis class without incurring significant extra inference
    cost. The B-DISTIL'
