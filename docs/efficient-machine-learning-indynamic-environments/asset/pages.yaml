  md: '**Cascade Models** We use the models described in Table 3.1. We consider a
    setting that is advantageous to the baselines by selecting the *best singular
    model* from each performance tier and cascading between them. In all cascading
    systems, we use all three tiers for cascade; but considering budget constraints,
    we also have setups where we delete Tier 3 and use only the first two tiers (2-level
    cascade).


    **Evaluation Setup** We evaluate these methods on a variety of (closed) generation
    datasets and tasks as shown in Table B.1. To ensure consistency in output format
    and easier evaluation setup, we use few-shot prompting—specifically, 4-shot—or
    all models across all tasks. For evaluation metrics, we use the macro F1 score
    for CoQA to capture overlaps between predictions and ground-truth answers, while
    we measure accuracy (essentially exact match) for the rest of the tasks. In terms
    of efficiency, we also measure the costs of using the model APIs. It is important
    to note that AutoMix and FrugalGPT incur additional setup costs that we do not
    reflect in our reported results. These setup costs and associated latency represent
    a significant constraint, especially for scenarios requiring frequent retraining
    or adaptation to new tasks, data distributions, and models.


    As shown in Figure 3.5, we observe that ABC is often more cost-effective than
    the baselines, even with their more sophisticated routing mechanisms and singular
    model tiers. Our analyses show that ABC’s efficient deferral strategy allows a
    more aggressive utilization of cheaper models for a significant portion of the
    input while only using expensive models when necessary. For instance, we realize—upon
    analyzing FrugalGPT’s results—that the trained scorer struggles as an efficient
    deferral mechanism as the tasks get harder; hence, it is more likely to take the
    safer option to cascade as the difficulty of the test samples increases. This
    means that ABC can be expected to be more efficient since the scaling laws ensure
    that the sum of the costs of using several cheaper models is still much less than
    the cost of using the larger model in the next tier. AutoMix, on the other hand,
    uses a few-shot self-verification system that is sampled > 1 times; hence, the
    additional API calls add significantly to its cost of usage. Considering that
    the self-verification process is an integral part of the AutoMix setup, it can
    be guaranteed that ABC will *always* be cheaper to use than AutoMix, despite using
    more models.


