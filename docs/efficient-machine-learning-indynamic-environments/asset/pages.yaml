    # 3.3 Formalization and Theoretical Details


    In this section, we formalize our problem setup by first outlining the standard
    statistical learning framework, which serves to define the concepts of models,
    ensembles, the learning performance (e.g., accuracy) and the inference cost associated
    with ensembles (Section 3.3.1). Next, we describe deferral rule-based cascades
    and formulate the specific case of *drop-in cascades*, cascades which prioritize
    accuracy over inference cost savings (Section 3.3.2). We introduce *safe deferral
    rules* as a sufficiency condition for constructing drop-in cascades and define
    our deferral rule based on agreement between'
