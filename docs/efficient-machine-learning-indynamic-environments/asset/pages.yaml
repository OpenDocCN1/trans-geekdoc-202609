  md: '# ## A.3.2 Training Recipes


    We use stochastic gradient descent (SGD) with momentum for all our experiments.
    For experiments on CIFAR100 and CIFAR10, we use a learning rate of 0.1, a momentum
    parameter of 0.9, and weight decay of \( 5 \times 10^{-4} \). We train for 200
    epochs and reduce the learning rate by a factor of 0.2 in after 30%, 60% and 90%
    of the epoch execution. We perform a 4-GPU data-parallel training for ImageNet
    with a per-gpu batch size of 256, learning rate 0.1, momentum 0.9, regularization
    \(\gamma\) of 1.0, and a weight decay of \( 1e - 4 \). We train for 90 epochs
    with and discount the learning rate by a factor of 0.1 at 30% and 60% epochs.
    For experiments with time series data, Google-13 and DSA-19, we use a fixed learning
    rate of 0.05 and a momentum of 0.9. We do not use weight decay or learning rate
    scheduling for time-series data.


    # ## A.3.3 Profiling Based Model Selection


    To estimate execution latency, we leverage a third-party library, such as the
    _Deep Speed_ framework [114], which enables us to measure the total floating-point
    operations required for inference. By randomly initializing a single sample with
    a batch size of 1, we obtain the FLOPs values for various real-world datasets.
    This profiling process serves as a reliable indicator of real-world performance,
    allowing us to rank the models based on their profiles. Notably, the profiling
    results only need to hold relative to other candidate models. Furthermore, we
    can utilize existing profiling models, such as ARM Fast Models for ARM-based mobile
    platforms, QEMU for x86 platforms, and NVIDIA NSight''s GPU emulators for GPU
    platforms, to estimate the performance on different hardware architectures. However,
    it''s important to note that these software-based solutions provide approximate
    performance estimates, and accurate evaluation of real performance requires access
    to the actual hardware. We are not restricted to latency based rankings. In fact,
    other useful metrics like throughput in sample processed per second, can also
    be used for candidate model selection.


