    # 3.5 Conclusions, Limitations & Further Directions


    This chapter introduced ABC (Agreement-Based Cascading), a training-free method
    for adaptive inference that reuses existing models to form an elastic cascade
    and sets elasticity implicitly through deferral decisions based on ensemble agreement.
    By defining and constructing *safe deferral rules*, we showed that ABC can serve
    as a drop-in replacement for a single model while often *improving* accuracy.
    While not as close to the Pareto-optimal cost-accuracy trade-off as B-DISTIL from
    Chapter 2, ABC offers a training-free way of constructing elastic models that
    are competitive with the Pareto-optimal set in certain situations; when the relative
    cost $\gamma$ is small.


    Although computing an ensemble as part of ABC incurs extra overheads compared
    to just using a single model, the large size gap between today''s lightweight
    and state-of-the-art models means that, in many settings, ABC still lowers end-to-end
    cost. Case studies confirmed this benefit: ABC cut communication cost in edge-to-cloud
    inference, reduced GPU rental fees in cloud deployments, and slashed API bills
    in black-box service scenarios. These results highlight ABC''s ability to boost
    efficiency without the routing networks and custom architectures that traditional
    cascade frameworks require, making it an attractive choice for practitioners targeting
    lower inference latency. A natural next step is to extend the approach from classification
    to *generation* tasks, where the cost-quality trade-off is even more pronounced.


    # 3.6 Related Work


    Adaptive inference schemes have been a topic of interest in machine learning for
    many years. This section discusses three main existing approaches to cascading
    and adaptive inference: score-based methods, trained routing procedures, and dynamic
    networks. We highlight how ABC''s approach relates to and differs from these existing
    methods.'
