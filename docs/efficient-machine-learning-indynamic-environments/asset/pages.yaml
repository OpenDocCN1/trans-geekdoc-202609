    set of models, sorted in order of increasing cost, we have


    ```

    f_{naive}(x, \kappa) = f_\kappa(x), \quad f_\kappa \in \mathcal{F}

    ```


    Although simple, this approach has practical downsides in terms of maintenance
    overhead of managing models, selection latency when switching between models,
    and, crucially, it assumes the budget is known a priori. In practice the budget
    is revealed only when it has already been exhausted, rendering an upfront choice
    of \(\kappa\) impossible.


    We pursue a more principled alternative. Starting from a single teacher model
    \(g(x)\), we decompose its capacity into a sequence of \(K\) weak learners \(\{f_1,
    \dots, f_K\}\). As we progressively evaluate the first \(\kappa = k < K\) learners,
    we obtain a prediction whose cost scales with \(k\). Assuming the accuracy at
    every \(\kappa\) remains competitive with the best-effort predictor, we have an
    anytime model whose accuracy improves as more budget becomes available. When inference
    is interrupted, we simply return the most recent prediction.


    The key challenge is to distill the capacity of the teacher into a set of inexpensive
    learners such that greedily evaluating successive learners strictly improves the
    prediction— without knowing the budget in advance. Since the ordinary distillation
    procedure [21,'
