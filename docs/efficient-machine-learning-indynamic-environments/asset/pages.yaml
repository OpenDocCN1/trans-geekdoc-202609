  md: comparing against any fixed static allocation is meaningless. To address this
    problem, recent approaches to online optimization have extended this notion of
    regret to *dynamic regret*; where we compare our allocations to a sequence of
    minimizers instead of a fixed minimizer—in our case, the sequence of optimal allocations.
    With the notion of dynamic regret the algorithmic goal in online learning now
    becomes providing dynamic regret guarantees that scale favourably with the variation
    in optimum allocations across time; that is, if the change in solutions across
    time is small then our algorithm should also provide solutions with small dynamic
    regret [146, 150, 163]. However, even this modification is unsuitable for round-based
    resource allocation, especially in the context of slowly evolving systems that
    is the subject of this chapter, as the run-time of the algorithms is not typically
    a concern in this setting. In contrast, in continual optimization, we aim to provide
    algorithms that have both low dynamic regret as well as run-times that depend
    on the variation in optimum across rounds.
