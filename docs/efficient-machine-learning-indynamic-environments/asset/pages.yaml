    # Theorem (Excess Risk). Suppose data \(D\) contains of \(N\) iid samples from
    distribution \(\mathcal{D}\). Suppose that the function \(g\) has large margin
    on data \(D\), that is


    \(\Pr_{x\sim D} [|g(x)| < \epsilon] < \mu\)


    Further, suppose that the class \(\mathcal{C}_T\) has VC dimension \(d\), then
    for


    \(T \ge \frac{4G_\infty^2 \ln 2N}{\epsilon^2},\)


    with probability \(1 - \delta\) over the draws of data \(D\), the generalization
    error of the ensemble \(F_T\) obtained after \(T\) round of Algorithm 1 is bounded
    by


    \(\text{err}(F_T) \le \widehat{\text{err}}(g) + O \left( \sqrt{\frac{d \ln(N/d)
    + \ln(1/\delta)}{N}} \right) + \mu\)


    Proof. Recall the following probability bound Schapire and Freund [36, theorem
    2.5] which follows Sauer''s Lemma:


    \(\text{Pr} [\exists f \in \mathcal{C}_T : \text{err}(f) \ge \widehat{\text{err}}(f)
    + \epsilon] \le 8 \left( \frac{me}{d} \right)^d e^{-m\epsilon^2/32}\)


    which holds whenever \(|D| = N \ge d\). It follows that with probability \(1 -
    \delta\) over the samples, we have for all \(f \in \mathcal{C}_T\)


    \(\text{err}(f) \le \widehat{\text{err}}(f) + O \left( \sqrt{\frac{d \ln(N/d)
    + \ln(1/\delta)}{N}} \right)\) (A.5)'
