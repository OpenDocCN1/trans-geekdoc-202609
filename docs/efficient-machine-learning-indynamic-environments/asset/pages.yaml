    # 2.5 Conclusions, Limitations & Further Directions


    This chapter introduced progressive ensemble distillation, whose goal is to distill
    a single teacher into an elastic model by creating an ordered ensemble that improves
    progressively as more components are evaluated. We showed that the ensemble''s
    components indeed form a decomposition and deliver increasingly accurate predictions
    as additional members are executed, allowing us to greedily set elasticity without
    access to the current inference budget and to resume seamlessly after interruptions.


    We develop an algorithm, B-DISTIL, for performing progressive ensemble distillation
    and demonstrate its utility for a number of applications in efficient inference.
    In particular, we experimentally demonstrate the effectiveness of B-DISTIL by
    decomposing well-established deep models onto ensembles for data from vision,
    speech, and sensor domains. Our procedure leverages a stochastic solver with log-barrier
    regularization to find weak learners, profiles candidate models during training
    and employs intermediary connections to bridge capacity gaps. The key insight
    behind B-DISTIL is that casting distillation as a two-player zero-sum game that
    abstracts architecture details into base class construction $\mathcal{F}$. This
    means that, conditioned on finding a ‘weak learner’ from the base class, we retain
    the guarantees of the classical boosting setup. Since these weak learners are
    only required to produce small improvements between rounds, we are able to reliably
    find such models.


    A caveat of abstracting away the details of weak learners is that practitioners
    must still design a base class $\mathcal{F}$. Moreover, since B-DISTIL fundamentally
    depends on the distillation procedure, all cases where distillation or re-training
    itself is practically infeasible, are also infeasible for B-DISTIL. We assume
    that retraining or distillation is feasible at the resources, data, and model
    sizes desired.


    Although this chapter focused on on-device continuous inference, the same distillation
    procedure also benefits cloud and data-center deployments. This includes tasks
    like layer-fusion, load-balancing, and improved resource utilization, which merit
    further investigation. Future work should also examine the impact of our approach
    on auxiliary metrics such as fairness and robustness [92, 108, 136]. In short,
    B-DISTIL turns a rigid expert model into an elastic ensemble with provable guarantees
    and practical impact across domains.'
