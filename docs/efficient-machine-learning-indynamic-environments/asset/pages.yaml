    # ## A.3 Dataset Information and Training Recipe


    We use six publicly available real-world datasets in our experiments. The train-test
    splits for all the dataset as well as the sources are listed here:


    # ### A.3.1 Dataset


    | Dataset | Train-samples | Test/Val-samples | Num.-labels | Source |

    |---|---|---|---|---|

    | CIFAR-10 | 50000 | 10000 | 10 | [204] |

    | CIFAR-100 | 50000 | 10000 | 100 | [204] |

    | DSA-19 | 6800 | 2280 | 19 | [62] |

    | Google-13 | 52886 | 6835 | 13 | [81] |

    | ImageNet-1k | 1281167 | 50000 | 1000 | [53] |

    | TinyImageNet-200 | 100000 | 10000 | 200 | [51] |


    We use two synthetic datasets in our experiments, *ellipsoid* and *cube*. To construct
    the ellipsoid dataset, we first sample a \( 32 \times 32 \) matrix \( B \), each
    entry sampled *iid*. We define \( A := B^T B \) as our positive semi-definite
    matrix, and \( I[x^T A x \ge 0] \) determines the label of a data point \( x \).
    We sample 10k points uniform randomly from \( [-1, 1]^{32} \) and determine their
    labels to construct our data sample. We randomly construct a 80-20 train-test
    split for our experiments.


    To construct *cube*, we first sample 16 vertices uniform randomly from \( [-1,
    1]^{32} \) and split them into 4 equal sets, say \( \{S_1, \dots, S_4\} \). As
    before, we sample 10k points uniformly from \( [-1, 1]^{32} \) and determine the
    label \( y(x) \) of each point \( x \) based on the closest vertex in \( \{S_1,
    \dots, S_4\} \).


    \[y(x) = \arg \min_i \min_{x'' \in S_i} \|x - x''\|.\)'
