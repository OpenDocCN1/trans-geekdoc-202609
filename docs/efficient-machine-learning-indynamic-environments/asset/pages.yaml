    **Traffic matrices** We generate synthetic traffic matrices following the Poisson
    and Bimodal distributions (similar to prior work [121, 137]). Figure 5.4 shows
    the probability distribution of demands used for the Kdl topology. Poisson is
    dominated by few flows requesting majority of the demand by volume, whereas Bimodal
    sees roughly even split between two low and high demand bands. In each round,
    we perturb demands from the previous round by upto 10% to simulate time-varying
    demands. We run each experiment for 20 rounds and exclude the first 5 to remove
    startup effects.


    ![](img/32fe6d02b4faa69c4646a6e93e0375fc_93_0.png)


    Figure 5.4: Distribution of demands in the two synthetic traffic matrices—in Poisson,
    few large flows dominate the demands, and in Bimodal demand is split across two
    distinct bands.


    **Metrics** We consider three metrics: (a) Total allocated flow is the the sum
    of allocated flow across all demands, averaged across rounds (higher is better),
    (b) Runtime is the average time taken to compute flow allocations across rounds
    (lower is better), and (c) Optimality Gap is the difference between the total
    allocated flow for a given approach and the optimal value found by LP-All (lower
    is better). We compute optimality gap against COPTER for the ASN topology as LP-All
    takes tens of hours to solve for each round and COPTER allocates the most flow
    among the evaluated approaches.


    Figure 5.5 and Figure 5.6 summarize our experiments for Poisson and Bimodal traffic
    matrices, respectively. For the Bimodal traffic matrices, POP-128 takes multiple
    days to solve all subproblems for a single round, so we present results only for
    the first round. The first round runtime is representative of POP-128’s average
    runtime as it does not benefit from any warm-starts because it creates new subproblems
    from random partitions in each round.'
