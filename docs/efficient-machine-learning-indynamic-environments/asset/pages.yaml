  md: '# ## A.5 Additional Results


    # ### A.5.1 Connections and parallel execution schedules.


    Our focus in this work has been sequential execution of the models. While reusing
    previously computed features is clearly beneficial for finding weak learners in
    this setup, the presence of connections across models prevent them from being
    scheduled together for execution whenever otherwise possible. To manage this trade-off
    between parallelization and expressivity, we try to restrict the number of connections
    to at most one between models, and further restrict the connection to later layers
    of the model. Connections in the later layers of networks impose fewer sequential
    blocks in inference and allows for better parallelization.


    Let $\phi_{t,l}(x)$ denote the activation produced at layer $l$ by the weak learner
    at round $t$, on data-point $x$. Then some of the connections we consider are


    +   - $\phi_{(t,l)}(x) - \phi_{(t+1,l)}(x)$, to learn the error in features at
    layer $l$.

    +   - $\phi_{(t,l)}(x) + \text{id}(x)$, standard residual connection at layer
    $l$.

    +   - $\phi_{(t+1,l)}[\phi_{(1,l)}(x), \dots, \phi_{t,l}(x)]$, dense connections
    at layer $l$ across rounds.

    +   - Simple accumulation operations.

    +   - Recurrent networks: LSTM and GRU.


    # ## A.5.2 Training ImageNet and Throughput Optimization


    Large datasets like ImageNet require additional care to ensure good resource utilization.
    Since the backward pass of our training only involve a single student model, it
    can be computed quite efficiently even for large datasets. This is particularly
    true in earlier rounds. For such cases we use simple producer consumer architecture
    where a GPU is dedicated to producing and queuing data batches and target predictions
    produced by the teacher. Training routines running on separate GPUs consume these
    batches for their training.


    As mentioned in Section 2.2, since B-DISTIL only cares that it is provided with
    an ordered list of candidates, we can modify the weak learning finding step to
    prefer weak learners that provide higher inference throughput, measured as samples
    processed per second. Throughput metric is more meaningful in the cloud inference
    deployment setting where batched inference is the norm. The ability to trade a
