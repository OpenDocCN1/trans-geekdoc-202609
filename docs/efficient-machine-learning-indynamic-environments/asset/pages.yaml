  md: '# Cascading using Score-Based Deferrals


    Traditional cascading methods often rely on simple score-based metrics for deferral
    decisions. We compare to the recent Wisdom-of-Committees method of Wang et al.
    [143] as a general, representative method in this category but note that specialized
    instantiations of this approach have been applied across various domains in prior
    work, for instance, in object detection [8, 18, 30, 44, 45, 78], image classification
    [79, 143], and text classification [135, 156, 161, 174]. In these settings, deferrals
    within cascading systems use metrics such as confidence scores, entropy, and probabilities
    [91, 128, 158]. While using confidence scores of existing models is inexpensive,
    these scores are required to be well-calibrated, which is less common for off-the-shelf
    models [63, 127]. Recent methods have thus considered a variety of techniques
    to enhance score-based deferrals, such as explicitly adding deferrals as a prediction
    [79], difficulty-aware regularization [135], temperature scaling [181], and calibration
    mechanisms [195].


    Recently, Jitkrittum et al. [171] explored the specific practical settings where
    confidence-based deferral in cascades could suffer; these settings include: scenarios
    where downstream models are specialists (the error probability of the downstream
    model is highly nonuniform across samples), when samples are subject to label
    noise, and in the presence of a distribution shift between the train and test
    set. Notably, in all these failure modes, where confidence-based cascades can
    be inadequate, our approach is likely to offer improvements, as ensembles help
    induce diversity, enable noise-robustness, and mitigate issues of distribution
    shift [5, 11, 17, 152].


    # Cascades with Routing Procedures


    Other methods avoid confidence scores entirely by training procedures independent
    of the model-set to route instances as needed. This trend has gained prominence
    with the rise of black-box model API services for LLMs, where prediction scores
    are often unavailable. Guan et al. [71] developed a selection module trained to
    determine the best-fit classifiers for data instances. Yue et al. [201] (MoT LLM
    Cascade) used sampling and consistency checking to determine when to defer to
    a high-cost model. AutoMix [177] proposed a few-shot self-verification mechanism,
    similar to Yue et al. [201], but also introduced a Markov-based meta-verifier
    for cascading in context-grounded tasks. FrugalGPT [165] leveraged a cascade strategy
    that triages incoming queries using a DistilBERT router and scoring function.
    HybridLLM [186] used a fine-tuned DeBERTa [106] to route queries to models based
    on the predicted query difficulty and the desired quality level. On the same note,
    OrchestraLLM [175]—using hand-labeled data to create expert model pools—selects
    model to query based on embedding distances between the pools’ instances and the
    test instances. Other methods also used some form of trained router, including
    RouteLLM [196], ‘Fly-swat or cannon’ [198], and Shnitzer et al. [180].'
