    and AutoMix [177]. For practical evaluation, we implemented all these baseline
    methods to work in a fully functional cascade system.


    # ### Method-Specific Details


    +   • **AutoMix**: AutoMix trains a different router for all possible cascade
    steps, i.e., \(n - 1\) routers for the n cascade tiers, and this has to be repeated
    for every new task or model replacement in the system. A threshold (AUTOMIX+T)
    or POMDP (AUTOMIX+P) is trained with a combination of \(\ge 50\) training samples
    from the same test data distribution and the initial inferences generated on the
    test data by the two models involved in each cascading step. After training the
    router, using the cascading system often involves running a few-shot'
