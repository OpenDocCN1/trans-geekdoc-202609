  md: '![](img/32fe6d02b4faa69c4646a6e93e0375fc_94_0.png)


    **Figure 5.5:** Summary of experiments with *Poisson* demands for Kdl (upper)
    and ASN (lower) topologies. Dashed red-line indicates the commonly used 5-minute
    round duration in WAN traffic engineering [72, 182].


    **Poisson demands** *Poisson* is dominated by a small set of demands, so as expected,
    *LP-Top* is two orders of magnitude quicker and allocates as much flow as *LP-All*
    for Kdl topology, but only reaches 90% of COPTER''s allocation for ASN showcasing
    the limitation of heuristics. *POP-64* for Kdl and *POP-128* for ASN allocate
    > 99% of optimal flow with runtimes well under the 5-minute round durations. COPTER
    allocates > 99.9% of optimal and the highest flows for Kdl and ASN topologies,
    respectively well under a minute.


    **Bimodal demands.** *LP-Top* fails to allocate > 90% of optimal flow, but is
    still orders of magnitude quicker than other approaches. *LP-All* exceeds the
    5-minute round duration for Kdl topology, and is omitted from comparisons for
    ASN as its runtime exceeds 24 hours for each round. *POP* compares favorably for
    the Kdl topology, but takes over 20 minutes to solve each problem for the ASN
    topology, rendering 5-minute durations impractical. COPTER''s approach using continual
    optimization runs in less than a minute and allocates the highest total flow for
    the ASN topology—a 30x speedup while allocating 1.5% more flow.'
