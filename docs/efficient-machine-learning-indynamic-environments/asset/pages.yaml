  md: 'exploiting problem-specific properties can help scale many resource-allocation
    problems to larger sizes with minimal effort, albeit at the cost of solution quality.


    All the approaches discussed thus far employ a commercial or open-source solver
    in a black-box manner. This means that the allocation problem in each round is
    treated as an independent problem instance that is to be passed on to the solver.
    However, this leads to a fundamental mismatch between the modeling of round-based
    resource-allocation problems and the dynamics of many systems to which these problems
    are applied: many large-scale systems evolve slowly across rounds, exhibiting
    certain structure across rounds. For example, in a small enough round duration
    (2–5 minutes) in GPU cluster scheduling, few GPUs fail, most jobs from the previous
    round continue executing with little change to their allocations, and few new
    jobs arrive into the cluster. By ignoring this structure and treating each round
    as an independent problem, existing methods forgo an opportunity to amortize solving
    effort over time.


    Adapting existing solvers to reuse computational effort from prior rounds is not
    straightforward. First, a small change to the input problem (e.g., the addition
    of just one new request) would require reconstructing solver-specific problem
    representations (e.g., constraint matrices), inducing significant setup cost for
    even the smallest change. Second, solvers need to reconstruct key internal transformations,
    such as matrix (Barrier methods [23, 202]) or basis (Simplex methods [10, 23,
    75, 154]) factorizations, discarding all prior computational effort. Third, for
    MILP resource-allocation problems [169, 183], since converting non-integer valued
    variables to their integer counterparts dominates solver time, this further exacerbates
    the scalability challenge for large problems.


    To address these limitations, we propose and study *continual optimization*—a
    paradigm that formulates resource allocation problems as a sequence of interconnected
    optimization programs with overhead over multiple rounds.


    We present COPTER as a system for performing continual optimization and demonstrate
    that it is possible to (a) reflect small changes in the resource-allocation problem
    to its optimization formulation using an efficient *differential* update interface;
    (b) exploit the slow evolution of the optimal solution to efficiently warm-start
    subsequent problem solves; and (c) use lightweight heuristics to recover high
    quality integer solutions for MILPs that bypass expensive combinatorial searches
    entirely.


    # 4.2 Linear Program Formation


    Many resource allocation problems can be formulated as *linear programs (LPs)*
    or *mixed-integer linear programs (MILPs)*. Given a set of resources (e.g., GPUs,
    CPUs, network bandwidth) and resource requests (e.g., jobs, flow demands), the
    goal with these programs is to find an allocation of resources to requests in
    a way that optimizes'
