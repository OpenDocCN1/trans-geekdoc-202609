    and 30 days of data. It is recommended to upload at least three months of data.


    +   The chargeback data in your files should directly correspond to the purchase
    data of your files. To obtain the best results, ensure that there are at least
    five chargebacks associated with every 100 purchases.


    Once you upload your data, select Generate reports. Report generation can take
    up to 24 hours, depending on your file size. The data diagnostic report generated
    by Diagnose experience is broken down into detailed visual key metrics and charts.
    Key metrics are comprised of the chargeback match rate that indicates purchase
