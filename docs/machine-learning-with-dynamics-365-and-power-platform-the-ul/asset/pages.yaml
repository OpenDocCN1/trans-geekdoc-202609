    # Customer Churn Prediction


    Customer churn, also known by the term customer attrition, is simply a tendency
    of customers to stop being a paying client to your business and abandon it. Businesses
    must take a proactive approach by recognizing the contributing factors responsible
    for customer attrition and enhancing customer retention by doing something about
    it. Customer attrition is not so good for businesses as it costs more to attract
    new loyal customers than preserving existing ones. Proactively predicting the
    customers who can leave your business is a critical insight that can help you
    minimize losses.


    Azure Machine Learning can enable you to build models, even with relatively little
    or no experience in this area. To predict customer attrition, you can use historical
    customer data to train and develop churn prediction models in Azure Machine Learning.
    It will help if you have datasets that incorporate a true/false column for customer
    status. Models built based on these datasets can be used to identify which customer
    attributes are most prominent for retaining your customers.'
