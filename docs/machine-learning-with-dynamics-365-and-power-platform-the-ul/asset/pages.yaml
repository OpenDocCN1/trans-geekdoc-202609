  md: '+   - **Categorical encoding.** Machine learning models are mathematical models
    that understand numeric representation, but categorical data has label values.
    Some of the ML algorithms require input and output variables to be numeric. So,
    for this reason, categorical data is converted to numerical data using either
    of these two steps:


    +   1. **Integer encoding.** Also known as label coding, it assigns an integer
    value to every unique category. Machine learning algorithms are capable of understanding
    this relationship between integer and category. For example, your qualification
    can be high school, college, or postgraduate. If we assign an integer to each
    of these categories like high school = 1, college = 2, postgraduate = 3, this
    data will become machine-readable.


    +   2. **One-hot encoding.** One-hot encoding is used when the categorical variables
    don''t have an ordinal relationship. In one-hot encoding, the binary value is
    assigned to each unique value and is separated by different columns. For example,
    Facebook has a relationship status feature—engaged, married, separated, divorced,
    or widowed. Then each status will have different columns with “engaged” status
    assigned value one in the “engaged” column and zero in the remaining four columns.


    +   - **Dealing with skewed data.** If your data is not symmetric, meaning if
    one half of your data distribution is not the mirror image of the other half,
    then the data is considered as asymmetric or skewed data. So, to discover patterns
    in skewed data, you need to apply a log transformation or reciprocals (i.e., positive
    or negative) or Box-Cox transformation over the whole set of values. This way,
    you can use it for the statistical model.


    +   - **Bias mitigation.** Bias mitigation can be done by alternating current
    values and labels to get a more unbiased model. Some algorithms that can help
    in this process are'
  merge: -1
  img_proc: true
