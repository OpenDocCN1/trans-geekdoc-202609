    # Accounts Receivable


    Many businesses sell their goods and services to customers on credit and then
    receive the payments a few weeks later. So, businesses need to keep track of the
    money their customers owe them by using an account in their books called Accounts
    Receivable.


    There are some factors that make the accounts receivable process inefficient,
    such as:


    +   - Manual processes involving sending reminders and invoices in emails. Processing
    payments manually might cause customers some inconvenience. If it is difficult
    for your customers to make the payment manually, they will obviously delay the
    payment and increase day sales outstanding.


    +   - If your payment system is not connected to the accounting system, it causes
    double-entry work because it means you have to enter all the details again in
    your accounting system. This increases the chances of typos and is also very time
    consuming.


    +   - You might be exposing your customers and their credit card data to the risk
    of fraud.


    To make their payments challenge- and risk-free, you need to automate these processes.
    Accounts Receivable empowers you to keep track of customer invoices and payments
    that you receive from customers. This system allows you to set up posting profiles,
    customer groups, interest notes, commissions, collection letters, and so on. All
    this information can directly affect transactions of accounts receivable.


    If you do not have an automated system and you manually process everything, it
    is what the process looks like. You have invoices in'
