    # **Which Features Should We Select to Train the Models?**


    While exploring your data, you will discern that your data might need preprocessing.
    It is wise to check the data for common issues (also known as data guardrails)
    to identify potential issues within the data before being used as inputs to train
    the machine learning algorithm.


    It is crucial to decide which features to use for training the models. Casting
    all features as inputs for training will not necessarily provide a good model.
    Hence, it is essential to select relevant features first.


    To do so, we need to understand the concepts of feature engineering and featurization
    first.


    > Feature engineering is the method of creating features using domain knowledge
    of the input data to help machine learning (ML) algorithms learn better and provide
    better results.


    In Azure Machine Learning, when techniques like data-scaling and normalization
    are collectively used with feature engineering to make the process easier, it
    is termed as “featurization” in Automated ML experiments.


    By default, normalization and data scaling techniques are applied to your data
    in every automated machine learning experiment. To configure featurization techniques
    in Azure Machine Learning Studio, you should open View featurization settings.
    Then enable Automatic featurization in the Additional configuration settings form.
    This way, the default featurization techniques are applied.


    Let''s investigate the techniques that are automatically applied to your data
    after enabling automatic featurization:'
  merge: -1
  img_proc: true
- pgno: 142
  md: '+   - **Drop high cardinality or no variance features.** This feature drops
    high cardinality and low variance variables from training and validation sets.
    It is applied when your data consists of missing values, or the same value across
    all rows, or with high cardinality (e.g., identification numbers, email addresses,
    or usernames).


    +   - **Impute missing values.** This feature is applied to replace missing data
    with substituted values, mostly when numeric values are missing from your data;
    it imputes those missing values with the average of values in the column. And
    for categorical values, it imputes with the most prevalently appearing value.


    +   - **Generate more features.** This feature helps you create things like year,
    month, day, day of the week, day of year, quarter, week of the year, hour, minute,
    second, and so on. For text, it helps you to create unigrams, bigrams, and trigrams
    based on term frequency.


    +   - **Transform and encode.** This feature transforms numeric values with few
    unique values into categorical values. One-hot encoding is used for low-cardinality
    categorical features; it represents categorical variables as binary vectors. One-hot-hash
    encoding is used for high-cardinality categorical features.


    +   - **Word embeddings.** This feature converts vectors of text tokens into sentence
    vectors by using a pre-trained model. Each word embedding vector in a document
    is aggregated with the rest to produce a document feature vector.


    +   - **Cluster distance.** This feature trains a k-means clustering model on
    all numeric columns. It produces new features that include the distance between
    each sample and the centroid of each cluster.


    Moving on to our next concept to help us improve our data is Data Guardrails.'
