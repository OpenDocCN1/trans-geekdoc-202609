  md: 'models identify specific patterns from the input data that you

    provide.


    There are some popular machine learning frameworks that you

    can use to create a model, such as scikit-learn, XGBoost,

    PyTorch, TensorFlow, and Chainer.


    +   **Datasets.** Datasets are the assets in your machine learning

    +   workspace that help you connect the data and your storage

    +   service to make it available for machine learning experiments.

    +   When you create a dataset, you create a reference to your

    +   storage service data that enables you to access data through

    +   datasets. This way, you can only register your data once and

    +   reuse it whenever you want, even for different experiments.

    +   Datasets can be used as a direct input for your scripts, Azure

    +   Machine Learning pipelines, and Bayesian machine learning.

    +   Due to the creation of datasets, data remains in its existing data

    +   source location, so there is no extra storage cost, and the

    +   integrity of your data sources are not at risk. There are two types

    +   of datasets that can be used in Azure Machine Learning training

    +   workflows concerning Automated ML, estimators, hyperdrive,

    +   and pipelines:


    +   1. **FileDataset** references single or multiple files in your

    +   datastores or public URLs to use in Azure Machine

    +   Learning. If the data you want to use is already cleansed

    +   and ready for training experiments, then you can use a

    +   FileDataset.


    +   2. **TabularDataset** represents data in a tabular format and

    +   can materialize the data into pandas or Spark DataFrame to

    +   enable you to work with standard data preparation and

    +   training libraries.


    +   **Datastores.** Datastores is a data management capability

    +   implemented by the Azure Machine Learning Service that acts

    +   as an interface to connect numerous Azure storage services

    +   without jeopardizing your data source''s integrity. It contains

    +   connection information in your Key Vault, including your

    +   subscription ID and token authorization, so there is no need to

    +   hard code them in your scripts. To create and register'
