- pgno: 171
  md: 'Today, many e-commerce businesses are giving product recommendations to customers
    on their websites. It has become a standard feature for e-commerce websites. All
    businesses are adopting this feature rapidly because relevant product recommendations
    drive higher sales.


    Microsoft has introduced a Microsoft Product recommendation system that does not
    cost anything more than the underlying Azure resources. You must train it first
    with some historical transaction data to get recommendations. It analyzes the
    data and discovers relationships between the products by comparing the interests
    of different users. For example, it looks for the products that have been purchased
    together by different users. Once your model is trained, you can add code to your
    website that requests recommendations by calling an application programming interface
    (API). You will be able to get two types of recommendations:


    +   1. **Item-to-Item.** In this type of recommendation, you send an item number
    with the API, which then returns with the list of possible items that a customer
    might be looking for, for example on websites where they mention customers who
    bought Product A and also bought Product B.


    +   2. **Personalized.** For this, you choose a particular user and send the recent
    transactions with the API, returning with product recommendations for that user.


    The algorithm that is mostly used for such type of recommendations is the collaborative
    filtering approach. It combines the preferences of multiple users and comes up
    with a recommendation for a given user.


    For item-to-item recommendation, the algorithm identifies the frequency of two
    items bought together by creating a matrix. Now the tricky part starts; the way
    it comes up with personalized recommendations requires matrix multiplication.
    Now let us investigate the architecture of the system:


    +   ■ The Product recommendation system deploys a web app. The same web app hosts
    the API that you call while training your model and which provides recommendations.
    It creates Azure'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Storage accounts for Blobs, Queues, and Tables and to perform training operations,
    it creates a Web Job Instance.


    +   - When you put in a request for training of your model, it gets the transaction
    data from blob storage and adds an entry for that model in the Model Registry
    Table. It also adds a message to the model queue.

    +   - When the Web Job Instance observes the new entry in the model queue, it
    trains the model. It puts the trained model in Blob storage and updates the entry
    in Model Registry to complete when it is finished.

    +   - When you send a request against recommendations, the process is much easier.
    It takes the model from Blob storage, loads it, runs the requests through it,
    and returns the recommendations. The only time-consuming task in this whole process
    is to get your transaction data into the format expected by a training job.


    Before making the recommendations, the algorithm considers the interest of the
    user on products, which is why you need to define weights for every event type.
    For example, some default events are:


    +   - If a user just clicked on a product – weight =1.

    +   - If a user clicked on a recommendation link – weight = 2.

    +   - If a user adds the product into the cart – weight = 3.

    +   - If a user removes a product from the cart – weight = -1.

    +   - If a user makes a purchase – weight = 4.


    Indeed, if users make a purchase, they are more interested in the product than
    those who just clicked the product. That is why the weight of the purchase event
    is more than the weight of the clicking event.


    This is how Microsoft''s Product Recommendation System works.'
