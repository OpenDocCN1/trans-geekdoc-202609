    # # How to Select Algorithms


    After preparing your data for training, you should focus on choosing the right
    algorithms for your model. There are many algorithms devised for machine learning
    tasks:


    +   - **Classification**. There are many classification algorithms, of which you
    need to choose which one works best for your dataset. Here are some commonly used
    classification algorithms: logistics regression, gradient boosting, LightGBM,
    k-nearest neighbors, decision trees, random forest, XGBoost, naïve Bayes, and
    many more.


    +   - **Regression**. Some standard regression algorithms are elastic net, LightGBM,
    gradient boosting, decision trees, k-nearest neighbors, LARS lasso, random forest,
    linear regression, and many more.


    +   - **Time-series forecasting**. Some of the commonly used time-series forecasting
    algorithms include auto-ARIMA, linear regression, LightGBM, dilated CNN, mean
    forecast, ARIMA, ETS, and many more.


    Choosing the right algorithm depends on the business problem and the machine learning
    task. Data scientists try many of these algorithms depending upon the task, the
    dataset size, their experience, or the ones that can easily be interpreted and
    explained.'
