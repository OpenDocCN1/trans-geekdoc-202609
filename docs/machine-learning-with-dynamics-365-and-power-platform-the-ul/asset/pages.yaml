  md: 'datastores, you can use the Azure Machine Learning Studio or the Azure Machine
    Learning Python SDK.


    +   - **Compute resources.** Compute resource is an environment you can use to
    host your service deployment or run your script. It can also be used as your local
    machine or as a cloud-based computing resource. If you use it, you don''t have
    to worry about changing the code when you later shift to a different computing
    environment. Azure Machine Learning introduces two virtual machines (VMs):


    +   1. **Compute instance.** A virtual machine primarily used in your development
    workstation, as it consists of multiple machine learning environments and tools.
    It provides the ability to start running sample notebooks with no setup required.
    It can also be used as a compute target for training and inferencing jobs.


    +   2. **Compute clusters.** Computer clusters are clusters of virtual machines
    with multi-node scaling capabilities. They are better used in compute targets
    for large jobs and production. It scales up automatically when a job is submitted.


    When you develop a model, you start by utilizing a small amount of data. So, use
    your local computer or cloud-based virtual machine as a compute target at this
    stage. But as you level up to more extensive data or if you want to perform distributed
    training on your data, you need to use Azure Machine Learning compute to create
    a single- or multi-node cluster that auto-scales each time you submit a run. Azure
    Machine Learning compute cluster can be used as a training compute target for
    most jobs in the Designer authoring experience.


    +   - **Experiments.** An experiment is a run or a group of runs of a specified
    script belonging to a workspace. It consists of some characteristics that you
    connect together to construct a predictive analysis model. Characteristics that
    a valid experiment should have are:


    +   - It should have at least one dataset and one module.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   - Datasets can only be connected to modules.

    +   - Modules are connected to either datasets or other modules.

    +   - All the module''s input ports need to have a connection to the data flow.

    +   - Parameters must be set for each module.

    +   - Run logs.


    **Pipelines.** Azure Machine Learning pipeline is an autonomously executable workflow
    of a whole machine learning task. Subtasks in the pipeline are encapsulated as
    a series of steps. These pipelines can do just about anything from making a call
    for Python script to more complex tasks. Your pipelines should majorly concentrate
    on machine learning tasks such as:


    +   - Importing, cleaning, validating data and transformation, normalization,
    and staging as done in the data preparation process.

    +   - Training configuration including logging/reporting configurations and parameterizing
    arguments and file paths.

    +   - Training and verifying the results efficiently and repeatedly. High-level
    performance can be achieved by specifying specific data subsets, distributed processing,
    different hardware compute resources, and progress monitoring.

    +   - Deployment tasks that include versioning, provisioning, scaling, and access
    control.


    To create pipelines, Designer enables you to drag-and-drop datasets and modules
    onto an interactive canvas. The inputs and outputs of every step are displayed
    visibly. The drag-and-drop feature to create data connections empowers you to
    understand and alter your pipeline''s data flow instantly. When you run the pipeline
    object, the service performs the following tasks:


    +   1. Calculate the requirements for each step:

    +      a. Hardware compute resources

    +      b. OS resources (like Docker image(s))'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   c. Software resources (like Conda/virtual env dependencies)


    +   d. Data inputs


    +   2. It determines the dependencies between various steps, which results in
    a dynamic execution graph.


    +   3. When each node in the execution graph runs, the following occurs:


    +   a. The service conceivably reuses existing resources to configure the necessary
    hardware and software environment.


    +   b. The step runs and provides logging and monitoring information to its containing
    experiment object.


    +   c. Every step''s output is treated as inputs to the next step and/or written
    to storage.


    +   d. Resources that are of no use are concluded and disconnected. The benefits
    of using pipelines in ML workflow include:


    +   It enables you to run steps, either in parallel or sequentially in a reliable
    and unattended manner.


    +   You can create multiple pipelines and reliably coordinate heterogeneous compute.
    This means you can use available compute resources by running individual pipeline
    steps on various compute targets, such as HDInsight, GPU Data Science VMs, and
    Databricks.


    +   Pipelines can be reused by creating pipeline templates for explicit scenarios,
    like retraining and batch-scoring. You can trigger published pipelines from external
    systems through simple REST calls.


    +   For tracking and versioning your data sources, inputs, and outputs, you can
    use pipelines SDK.


    +   Pipelines allow multiple data scientists to work on steps across all areas
    of the machine learning design process.'
  merge: -1
