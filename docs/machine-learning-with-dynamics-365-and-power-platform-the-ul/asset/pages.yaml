  md: '# TABLE 4.1 Data guardrails.


    | Guardrail | Status | Triggering Condition |

    |---|---|---|

    | Missing feature values imputation | Passed | Your training data is free of missing
    feature values. |

    | Missing feature values imputation | Done | Your training data contains missing
    feature values and was imputed. |

    | High cardinality feature handling | Passed | No high-cardinality features were
    detected in your inputs. |

    | High cardinality feature handling | Done | Your inputs contained high-cardinality
