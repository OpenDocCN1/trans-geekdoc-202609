    It is the area of machine learning that is concerned with behavioral psychology.
    In this learning, an agent is put into an environment, and he learns to behave
    in this environment by performing certain actions and observing the awards that
    they get from their actions. Reinforcement learning involves software agents that
    take appropriate actions in a particular situation to earn maximum rewards. There
    is no expected output in this learning. The reinforcement agent decides what actions
    to take to perform a task. In the absence of the training dataset, it is bound
    to learn from its own experience.


    The following is a list of commonly used algorithms in reinforcement learning:


    +   - Q-learning

    +   - Temporal difference (TD)

    +   - Deep adversarial networks


    Now to choose which algorithm is right for your problem, you should categorize
    your problem according to the following:


    +   - Categorize by input


    +   - Labeled data: supervised learning

    +   - Unlabeled data: unsupervised learning

    +   - Combination of labeled and unlabeled data: semi-supervised learning

    +   - No data and want to optimize an objective function by interacting with an
    environment: reinforcement learning


    +   - Categorize by output


    +   - If the output of a model is a number: regression problem'
