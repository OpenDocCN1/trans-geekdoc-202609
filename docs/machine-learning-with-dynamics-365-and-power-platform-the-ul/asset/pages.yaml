    # Azure Machine Learning Concepts


    +   - **Models.** A model is a piece of code that is trained to identify specific
    patterns from the input and produce output. To create a model, you need to select
    an algorithm, provide it with data, and tune hyperparameters. It is basically
    a representation of what was learned by the machine learning algorithm. Once your
    model is created, you can use the selected algorithm to learn from the set of
    data. For example, creating a model that can recognize users'' facial expressions
    and identify human emotions requires supervised learning. In this case, you need
    to train your model by providing example images with different facial expressions,
    each manually tagged with a specific emotion for it to learn from these images.
    This is how supervised learning'
  merge: -1
