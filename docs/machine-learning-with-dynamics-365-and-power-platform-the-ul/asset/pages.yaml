  md: 'employees and their managers. The metrics in this visualization enable the
    analyst to classify a group of under- or over-coached employees. The time with
    manager histogram shows metrics of employees'' time spent on meetings with their
    managers each week. Insights gained from this visualization can help you spot
    newly onboarded employees who are not getting sufficient guidance from their managers.
    Further, you can compare the time of manager and employee tenure, employee satisfaction,
    and the job role to gain insights regarding opportunities for improvement.


    +   ■ **Networks and collaboration.** This visualization shows network connections
    between various teams within the company. Network size and network breadth help
    you understand whether the employees of a particular team are working in an insular
    way or connected with multiple people.


    +   ■ **Microsoft Viva insights.** It is an app in Microsoft Teams that helps
    people by collaborating communications, learning, resources, knowledge, and insights
    to enhance employee experiences by integrating seamlessly into the apps you use
    every day. Types of Viva insights are:


    +   ■ **Personal insight.** Only you can see your personal insights. It is derived
    from the data gathered through your emails, calls, chats, and meetings. Based
    on these insights, you get useful recommendations on how you can utilize your
    time more effectively, such as when to take a break and when to focus on work
    and learning that can help you boost productivity on what you do.


    +   ■ **Team insights.** You can see manager insights here. It showcases patterns
    like meeting overload, minimum focus time, and after-hours meetings that can lead
    to burnout and stress. Managers can use these insights and take actions to balance
    the well-being of employees and their productivity.


    +   ■ **Organizational insights.** Organizational insights are for business leaders
    to understand the impact of work on their people and business. They can act on
    matters to prevent'
