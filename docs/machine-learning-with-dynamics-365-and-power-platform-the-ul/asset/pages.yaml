    # Authoring Experience in Azure ML Studio


    Automated machine learning (Automated ML) is the process of automating the time-consuming,
    iterative tasks of machine learning model development. More specifically, it automates
    data preparation, model selection, composition, and parameterization of machine
    learning models. Automated ML makes machine learning tasks accessible to all users,
    regardless of skill level, and often provides faster, more accurate outputs than
    hand-coded algorithms and avoids manual hyperparameter tuning. It enables you
    to build ML models with high scale, efficiency, and productivity while sustaining
    model quality using a target metric you specify.


    Certain approaches to model development sometimes make these systems hard to explain,
    meaning it is difficult to understand why AI systems make decisions. Although
    they produce results with absolute efficiency and processing power, it can be
    challenging to track how the algorithm produced that output. Consequently, it
    becomes difficult for us to determine the accurate model for a given problem because
    it then becomes difficult to predict a result if a model is a black box.


    So, in this case, what Automated ML does is, it makes machine learning more accessible,
    thus making it less of a black box. Automated ML automates parts of the machine
    learning process that apply the algorithm to real-world scenarios. It learns and
    understands the algorithm''s internal logic and makes choices according to how
    it relates to the real-world scenarios. When done using Automated ML, the task
    takes less time and resources and is performed with ultimate efficiency compared
    to humans. Automated ML is a real good approach here if you are working on Dynamics
    365/Power Platform Data without knowing what algorithm to choose: it''s often
    a good place to start.


