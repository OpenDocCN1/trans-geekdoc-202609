    | Class balancing detection | Alerted | Detected imbalanced classes in your inputs.
    Fix the balancing problem. |

    | Class balancing detection | Done | Detected imbalanced classes in your inputs
    and the sweeping logic have determined to apply balancing. |

    | Memory issues detection | Passed | The horizon, lag, rolling window were analyzed,
