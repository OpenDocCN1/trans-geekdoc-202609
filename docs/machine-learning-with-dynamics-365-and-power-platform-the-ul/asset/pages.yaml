- pgno: 143
  md: 'Data guardrails are a means to identify potential issues like class imbalance
    or missing values with your data. They also assist you in taking remedial actions
    for enhanced results.


    Data guardrails are applied for:


    +   SDK experiments. You have selected the parameters “featurization”: auto or
    validation=auto in your Automated MLConfig object.


    +   Studio experiments. You have selected enabled status for automatic featurization.


    Data guardrails display results in one of the three states:


    +   1. Passed. When there are no issues found with your data, and you require
    no action.


    +   2. Done. When Automated ML took some corrective measures to improve your data,
    and you need to review these changes to ensure that the changes align with the
    expected results.


    +   3. Alerted. When an issue is detected that cannot be resolved. In this case,
    it is advised that you revise and fix the issue.


    Data guardrails that are supported include those noted in Table 4.1.'
  merge: -1
  img_proc: true
