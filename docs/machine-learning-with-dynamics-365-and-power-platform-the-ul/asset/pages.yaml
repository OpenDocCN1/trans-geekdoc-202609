  md: 'For every open invoice in your business, the prediction model will predict
    the payments in three buckets:


    +   - **On-time** – Customers who are predicted to pay their invoices on or before
    the transaction due date.

    +   - **Late** – Customers who will likely pay their invoices after the due date
    but before the “very late” transaction period.

    +   - **Very late** – Customers who will likely pay their invoices after the start
    of the “very late” transaction period.


    Once the model is published, you get an accuracy score. Now go to the credit and
    collections workspace; you will see two new tiles:


