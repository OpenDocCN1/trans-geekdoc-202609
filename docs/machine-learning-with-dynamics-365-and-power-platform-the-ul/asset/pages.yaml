    # Which Parameters Should We Select to Tune?


    There are three categories of data that are handled by your application during
    model training:


    +   1. Input data, or training data, is a collection of individual instances that
    are important to solve your machine learning problem. This data is responsible
    for accurately making predictions during the training process to configure the
    model about new instances of similar data. However, these values can never be
    a part of your model.


    +   2. Model parameters are the variables that are used to adjust to your data
    by the machine learning technique chosen by you. For example, a deep neural network
    (DNN) is considered as a model parameter. It is composed of neurons which are
    also called processing nodes; operations are performed in each data as it travels
    through the network. Each node has a weight value after your DNN is trained. This
    shows how much impact it has on the final prediction. These weights are examples
    of your model''s parameters.


    +   3. Hyperparameters are the variables whose values must be defined outside
    the training process. They oversee the training process itself. For example, to
    set up a deep neural network, you have to first decide the number of hidden layers
    you want to use between the input layer and the output layer and the number of
    nodes used by each layer. Hyperparameters are configuration variables that are
    not directly related to the training data. Unlike other parameters, which change
    during a training job, hyperparameters remain ordinarily constant during a job.


    The process of choosing the right hyperparameters is known as hyperparameter optimization.
    Selecting the right hyperparameters is a crucial step because they directly control
    the training algorithm''s behavior and have a massive impact on the model''s performance,'
  merge: -1
  img_proc: true
- pgno: 147
  md: "which is being trained. For example, if the learning speed is too low, the\
    \ model will blow the data's essential patterns. However, if the speed is high,\
    \ it may suffer collisions.\n\nEvery hyperparameter chosen by you has the potential\
    \ to increase the number of trials needed for a thriving tuning job. Three standard\
    \ algorithms help in the selection of hyperparameters:\n\n+   1. Grid search uses\
    \ learning rate, and number layers to train the algorithm for all combinations,\
    \ and after that, it analyzes the performance using the “cross-validation” technique.\
    \ This technique validates that your trained model captured most of the patterns\
    \ from the dataset. Another technique best used to perform validation is “K-fold\
    \ cross validation,” which provides adequate data for training and validations.\
    \ Grid search is a prevalent technique for the implementation of hyperparameters.\
    \ Grid search needs to build two sets of hyperparameters:\n+   \n+   a. Learning\
    \ rate\n+   \n+   b. Number of layers\n\n+   2. Random search uses random combinations\
    \ of the hyperparameters to find the most appropriate solution for your model.\
    \ It examines random combinations from a range of values and evaluates sets from\
    \ a specified probability distribution to optimize with random search. For example,\
    \ instead of checking all the innumerable samples, we can check 1,000 random parameters.\
    \ The only drawback of using this technique is it does not use historical information\
    \ from previous experiments to choose the next set. Also, it is challenging to\
    \ predict the next set of experiments.\n\n+   3. Bayesian optimization, unlike\
    \ random or grid, keeps track of past evaluation results so that new samples improve\
    \ the primary metric. These evaluation results are also used to create a probabilistic\
    \ model by mapping hyperparameters:\n+   \n+   P (score | hyperparameters)\n\n\
    This technique can be used if you have enough budget to explore the hyperparameter\
