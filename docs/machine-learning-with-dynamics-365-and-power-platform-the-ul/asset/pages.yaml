- pgno: 216
  md: '# Afterword


    IT IS GREAT TO eventually see a book focused on machine learning (ML) and artificial
    intelligence (AI), specifically for Power Platform and Dynamics. Frankly, I am
    surprised that no one came up with it sooner. Aurélien and Vinnie, realizing the
    importance of the subject and seeing the nonexistence of any other book on this
    topic, have put together an amazing book for Microsoft Dynamics 365 and Power
    Platform developers, solution architects, and technical consultants.


    Machine learning and artificial intelligence technologies are coming out of the
    hype cycle and are now a core part of many organizations’ digital transformation
    strategies. Organizations want to leverage the technologies to reduce operational
    costs, generate customer insights, and build and improve customer experiences.
    These technologies are helping organizations to automate, simplify, and accelerate
    their processes and operations to improve both employee and external customer
    experiences. Along with improved operational efficiencies, ML and AI are enabling
    companies to create products and services that lead to changes in their business
    models with huge potential for revenue growth.


    Top software and cloud providers like Microsoft are providing ML and AI tools
    and services to their customers to democratize ML and AI, thus helping organizations
    accelerate in realizing their business use cases by utilizing these emerging technologies.


    Since Power Platform and Dynamics 365 applications are built on top of Microsoft''s
    Azure Cloud platform, it is very easy for developers and technical architects
    to utilize tools such as Azure Machine Learning designer, Azure AutoML, Azure
    Notebooks, or AI Builder. AI Builder is offered specifically for Power Platform
    and Dynamics 365. AI Builder comes with many prebuilt ML models for common business
    use cases and can be utilized with a simple point and click without any coding
    experience.


    No matter what industry you belong to, AI Builder can help you in enabling common
    or special business use cases. AI Builder is available in Power Platform (Power
    Apps, Power Automate, and'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Power Virtual Agents). It comes bundled with common ML models such as category
    classification, business card reader, receipt processing, text translation, sentiment
    analysis, and many more.


    A savvy business power user or a citizen developer can use AI Builder and any
    of the prebuilt ML models to quickly build an AI application in the Power Platform
    and Dynamics 365. However, professional developers can also utilize AI Builder
    to build, train, and deploy custom models that an organization may want to include
    in their Power Platform and Dynamics 365 AI applications. The book has done a
    good job in exploring and discussing Azure Machine Learning services and AI Builder
    and how to quickly utilize the machine learning models with Power Platform and
    Dynamics 365.


    Azure Machine Learning service and AI Builder are just the beginning of tools
    and services that are going to continue to grow in scope and help in commoditizing
    machine learning and AI with developers and technical architects for building
    and enhancing business applications.


    This book is going to be a perfect guide for Power Platform and Dynamics 365 developers
    and technical architects to quickly get started with machine learning and start
    building intelligent applications for their business use cases.


    Fawad Khan, Microsoft'
