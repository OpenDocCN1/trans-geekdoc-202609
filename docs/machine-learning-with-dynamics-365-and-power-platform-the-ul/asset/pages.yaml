- pgno: 56
  md: 'The Azure ML service is an open platform to create ML solutions using Python.
    It provides tools to scale and automate training, deployment, and monitoring of
    ML models easily and seamlessly.


    Before Azure ML Service, machine learning in a production environment required
    you to bring together a bunch of data services to support the full machine learning
    lifecycle, for example:


    +   - **Azure blob storage or Azure data lake storage:** These are storage solutions
    for data. It''s important to bring these solutions together because models cannot
    be trained without data. Azure Data Lake as well as Azure Synapse Analytics were
    often commonly used to store data/datasets before machine learning.


    +   - **Virtual machines, Azure HDInsight, and Azure Databricks:** These are brought
    together to run the code.


    +   - **Virtual network:** A virtual network functions as a security boundary,
    securing your data by isolating your Azure resources from the public internet.
    You can bring your virtual network to figure out your computing and data in the
    same virtual network or you can also use Azure virtual network to your on-premises
    network to securely train your models and access your deployed models for reasoning.


    +   - **Azure key vault:** It is a cloud-hosted service to manage and secure your
    credentials, authorize access for certificates, and many other secrets. You have
    full control of the keys to access and encrypt your data. Administrators have
    the power to grant or revoke access to the keys.


    +   - **Docker containers:** A Docker container image is a stand-alone, executable
    package of software used to run your experiment repeatedly because it has everything
    needed to run an application such as a consistent set of ML libraries, code, system
    tools, and settings. It uses the Azure Container registry, which is a private
    Docker registry service to store those Docker containers, and puts them inside
    your virtual network.


    +   - **Azure Kubernetes service:** Is an orchestration service used to deploy,
    scale, and manage Docker containers and container-'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'based applications across a cluster of container hosts, including them as well
    in a virtual network.


