- pgno: 148
  md: '# Ensemble Models


    Automated Machine Learning by default supports ensemble models. To understand
    what ensemble models do in automated machine learning, let''s first understand
    what it is.


    The ensemble is a learning technique that consolidates multiple base models to
    produce one improved and optimal predictive model. Ensemble methods are like meta-algorithms
    that decrease variance and bias and, as a result, improve predictions. Automated
    machine learning uses two methods to combine models:


    +   1. **Voting.** This method predicts results based on the weighted average
    of predicted class probabilities for classification tasks and predicted regression
    targets for regression tasks.

    +   2. **Stacking.** This method combines heterogeneous models to train a meta-model
    based on the individual model''s output. The default meta-models are LogisticRegression
    for classification tasks and ElasticNet for regression/forecasting tasks.


    Automated Machine Learning uses the Caruana ensemble selection algorithm with
    sorted ensemble initialization to decide which models to use. This algorithm starts
    the ensemble with five models with the best scores and confirms if the models
    are within a 5 percent threshold of the best score to avoid a low initial ensemble.
    Then a new model is added to the existing ensemble for each ensemble iteration,
    and the score is calculated. If a new model has improved the existing ensemble
    score, it is updated, and the new model is added.


