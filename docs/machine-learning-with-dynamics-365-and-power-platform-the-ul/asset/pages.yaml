    # Registered Model


    Models are identified by names and their versions in the workspace.

    Once you have a model, you register it on your workspace. It helps

    you to maintain a record of all the models in your Azure Machine

    Learning workspace. A registered model is like a logical container

    that contains one or more files that collectively contribute to your

    model. After the registration process is completed, you can then

    download or deploy the registered model and receive all the

    registered files. A registered model that is in use by an active

    deployment cannot be deleted.


    # Published Pipelines


    Once you have it up and running, you can publish your pipeline to

    run with different inputs. After publishing your pipeline, you can

    configure a REST endpoint, enabling you to rerun the pipeline from

    any platform or stack. A pipeline endpoint empowers you to submit

    new pipeline runs from external applications using REST calls.

    However, you cannot send or receive data in real-time using a

    pipeline endpoint.


    Published pipelines are used to train or retrain models, process new

    data, perform batch inferencing, and much more. It runs on the

    compute resources assigned by you in the pipeline draft for each

    module. The designer can create the same published pipeline object

    as the SDK.


    You can publish multiple pipelines to a single pipeline endpoint by

    designating which pipeline version to run.'
