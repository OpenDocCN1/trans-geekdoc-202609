    # Time-series Forecasting


    Time-series forecasting is a process of using historical data to predict future
    observations. Most of the companies today are using time-series forecasting to
    develop and innovate their business strategies. They mainly use it for tasks like
    financial planning, resource planning, inventory planning, and capacity planning.
    It has become a fundamental part of any business, whether it is revenue, inventory,
    sales, or customer demand.


    In general, when we create a machine learning model, we analyze different algorithms
    and hyperparameter values, but when we focus mainly on time-series forecasting,
    we also need to consider seasonality and the effects of holidays. So, it becomes
    tricky to build a model with all these complex considerations. So, instead of
    manually performing all the tasks, we can switch to Automated Machine Learning.
    Automated ML can automate tasks like algorithm selection, hyperparameter value
    search, and data featurization, including holidays. It can help you find the best
    machine learning model for your data.


    An automated time-series experiment is administered as a multivariate regression
    problem. Former time-series values are “pivoted” and become additional dimensions
    for the regressor together with other predictors. Unlike classical time series
    methods, this approach has an advantage of consolidating multiple contextual variables
    and their relationship to one another during training.


    Automated ML creates and ranks several models based on the accuracy of the results,
    which can be examined to decide which one is the best solution to your problem.
    Once you have found the perfect model, you can instantly add input and output
    stages, and deploy it as a service.


    Making machines that learn from experience should eventually eliminate the programming
    effort of data scientists. Automated'
