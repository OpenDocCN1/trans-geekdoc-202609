- pgno: 82
  md: 'Is your organization one of those whose documents end up hidden away somewhere
    on a rarely used folder or drive or archive? Are you having trouble in searching
    and analyzing the data from the documents owned and produced by your organization?
    It''s no surprise that almost 80 percent of organizations fail to explore and
    understand the content within a limited time constraint. Hundreds of thousands
    of new documents are generated every day. If every document has something valuable
    that helps you to unlock opportunities for your organization, then why not do
    it the right way?


    Here comes knowledge mining.


    Knowledge mining is all about extracting something useful, profitable, or beneficial
    from existing information. But there''s only so much a mining engineer can do
    in a significant amount of time. The challenge here is getting full value from
    the existing data.


    ![](img/62da674fd5b031cf7705f5424f5bc7c5_82_0.png)


    FIGURE 2.8 Three phases of knowledge mining.


    This is where knowledge mining using Azure Search comes into play.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Knowledge mining using the cognitive search–based technique can extract valuable
    information and facts from unstructured data that include PDFs, spreadsheets,
    images, audio files, and so on.


    Using Azure Search in knowledge mining gives you the advantage to bring in a lot
    of unstructured data with different formats that can be indexed using AI capabilities
    so that it becomes easily referenceable and searchable.


    Note: The data is unstructured if it''s not in a database table or in a spreadsheet.


    The cognitive search capability in Azure Search enables you to discover patterns
    in unstructured data and extract meaningful information from it. Knowledge mining
    using Azure Cognitive Search can be done in three phases (also see Figure 2.8):


    +   1. **Ingest.** Data ingestion process includes loading data documents from
    various sources to create or update a table in Azure Data Explorer. In Azure Cognitive
    Search, after the data is ingested, the content loaded in the search index (a
    persistent storage system of documents used for filtered and full-text search)
    becomes available to execute queries on it. There are two basic approaches used
    to populate an index: (1) data is *pushed* into the index programmatically, or
    (2) point an Azure Cognitive Search indexer (which is a crawler used to extract
    searchable data from an external Azure data source) at a supported data source.
    This process is also called a pull model.


    Either pull data from Azure Blob Storage, SQL DB, CosmosDB, MySQL, and Table Storage
    or push data using APIs to load single or multiple documents into an index. The
    service renders the unstructured raw data in Blob Storage and derives contents
    from various file formats such as PDFs and Office documents. It also detects changes
    through incremental processing, bypassing the hassle to go over the entire data
    set after initial ingestion.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'Now when we have populated our index, we are overlooked by a refined, responsive
    UI. The goal of some organizations is achieved in this step, and they stop here
    since they only want to make their documents searchable.


    2. Enrich. The data ingested in Azure Cognitive Search is composed of images and
    other unstructured data sources. Here''s where the enrichment capability of Azure
    Cognitive Search indexing comes to use. It extracts text from unstructured data
    sources, images, and blobs to make the index and knowledge store more searchable
    and organized. Built-in cognitive skills in Azure Search enable the implementation
    of enrichment and extraction processes from data. Some built-in cognitive skills
    are:


    +   - Natural language processing

    +     - Entity recognition

    +     - Language detection

    +     - Key phrase extraction

    +     - Text manipulation

    +     - Sentiment detection

    +     - PII detection


    +   - Image processing

    +     - Optical character recognition (OCR)

    +     - Facial detection

    +     - Image interpretation

    +     - Image recognition


    These cognitive skills unlock the unstructured raw content and add value in your
    search or data science apps. This enriched data can be fed to trained models to
    derive a custom metadata schema. This step, if repeated multiple times, can result
    in a very powerful and increasingly customized index.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# 3. **Explore.** Azure Data Explorer is used to query streaming data to help
    organizations discover insights, identify trends and anomalies, and diagnose problems.
    Azure Data Explorer provides the following functionality:


    +   - It helps to pull data from external sources (event hubs) or read ingestion
    requests from an Azure queue.

    +   - It makes batches of the data that circulate in the same database and the
    table to optimize ingestion throughput.

    +   - It validates data and performs necessary format conversions.

    +   - It performs all the data manipulation tasks such as organizing, indexing,
    encoding, compressing data, and matching schema.

    +   - It manages ingestion load on the engine and handles retries upon transient
    failures.


    At this point, we have a fully populated and meaningful index that is ready to
