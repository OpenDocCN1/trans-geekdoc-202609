- pgno: 88
  md: 'Let''s understand what it is with an example: Suppose you have two business
    apps that were created independently, each having its own different structure
    and entities (e.g., “consumer” and “lead” are not the same in both the apps).
    So how is it possible to integrate these two apps with each other? Here comes
    the Common Data Model, which enables you to build your data in a standardized
    format so that it becomes easy for the apps to integrate and share data with one
    another. It provides a set of standard entities attributes and relationships that
    can be used by all apps to understand, recognize, communicate, and derive insights.
    Using the Common Data Model as a connector, you can build unified customer profiles.
    Let’s understand step by step how customer insights work:


    +   • **Data unification.** Data unification is a process of creating a single
    master data set that provides a unified view of your customers. To unify data
    in Dynamics 365 Customer Insights, you need to follow three steps:


    +   1. **Map.** Mapping the data in Dynamics 365 Customer Insights is a very important
    step and consists of two phases:


    +   a. **Entity selection.** This phase deals with identifying the entities that
    are associated with customer information, which can be combined to create a dataset.


    +   b. **Attribute selection.** This phase deals with identifying the columns
    with respect to each entity that you want to consolidate and reconcile in the
    match and merge steps.


    +   2. **Match.** In this step, you combine the entity datasets created in Map
    step into a unified customer profile dataset. It should at least have two mapped
    entities.


    +   3. **Merge.** Merging is the process of resolving the conflicting data that
    appears in your datasets, for example, if the date format is different in two
    datasets such as birth date “12/26/94” versus 26/12/94. Merging is done on an
    attribute-by-attribute basis.'
  merge: -1
  img_proc: true
- pgno: 89
