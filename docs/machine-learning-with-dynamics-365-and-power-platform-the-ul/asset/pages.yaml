    The case is a concern or an incident reported by your customers that needs your
    attention to provide the best possible solution. To find the best possible solution
    for a case, you need to find the root cause of the problem by tracking the process
    from the start to assess the intake of the incident and following the remediation
    process to the final resolution. A case can be anything, for example:


    +   - **Questions.** Your customer might have questions regarding your product
    or service. For example, if a customer is willing to buy a shampoo of your brand
    and your product description on your website doesn''t have the information needed
    by the customer, naturally the customer will ask the question regarding your product
    before purchasing it. The question can be anything, such as, is the shampoo good
    for dry and frizzy hair? Is this shampoo mild? What is the return policy if it
    doesn''t suit me?


    +   - **Requests.** Customers might have a request that requires a specific action.
    For example, let''s say your product is a house-cleaning tool, a “spin mop cleaning
    system with one'
