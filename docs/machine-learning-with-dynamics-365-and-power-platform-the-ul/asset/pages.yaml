    done by altering the values of each numerical feature and setting it to a common
    scale. This can be done by using normalization (min-max scaling) or z-score standardization.


    +   4. **Feature engineering.** Feature engineering is a process of constructing
    explanatory variables and features from raw data to turn our inputs into a machine-readable
    format. These variables and features are used to train the model. To follow this
    step, one should have a clear understanding of the data. Feature engineering can
