    # # MACHINE LEARNING AT THE WORKPLACE


    How do businesses measure success? They use pointers such as revenue, customer
    satisfaction, and time to market, but is it enough to just measure success?


    You can drive success by leveraging your most powerful predictor: day-to-day actions
    performed by people, including their behavior and how they communicate, collaborate,
    and navigate processes with their team. How they build their network, innovate,
    and build a relationship with their customers. All this information directly impacts
    your business outcomes because what separates high-performance organizations from
    the rest is how people work. If you could quantify and analyze how everyday work
    impacts your business, you could predict and control your outcomes. By harnessing
    the data insights with the data you already have, you can identify the patterns
    that can lead your business to success. This is the kind of information you need
    to empower your workforce to move forward swiftly, foster innovation, feel happier,
    and create more value for your customers. Workplace intelligence insights can
    unlock new potential and predictive capabilities for breakthrough business performance.


    Workplace analytics is all about helping employees to perform their jobs more
    effectively. It is tricky to understand what can make employees more effective.
    There is very little data to understand which team is performing better than others.
    Office 365 provides the data that you need to understand problems like why one
    team delivers better results and on time while others do not.


    Office 365 comprises data like all the emails, meetings, chats, documents, and
    all the other stuff that is just lying around in it. It is known to be the largest
    dataset ever created that contains information about how people spend their time
    at work.


    What workplace analytics does is harness the data from the employees'' everyday
    work and use that data to gain insights and look'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'for inefficiencies. It enables you to take action to improve overall productivity.


    **Home.** On the home page of Workplace Analytics, you can view the population
    and the months of data gathered to obtain insights. It is like a dashboard; the
    page gives you the statistics on the employees'' work hours. Let us start with
    some of the visualizations at the bottom of the page. These visualizations provide
    a quick insight into what you need:


    +   - **Week in life.** It enables you to pick any team, group, or function and
    understand what a week in their life looks like, including what hours they spent
    between meetings and work and how many after-hours they have spent despite workday
    collaboration hours? The employees are considered active and are included in the
    data if they have sent even one email or message. Meetings and email hours help
    you quantify the collaboration volume and patterns within the company. If your
    employees'' excess time is spent on meetings and emails, it becomes stressful
    for employees. Workplace Analytics helps analytics to identify high and low collaboration
    and its causes. If a lot of time is spent on low-quality meetings, a company can
    take action against it.


    +   - **Meetings overview.** In this visualization, you can see meeting norms
    set by your organization. Here you can view metrics about specific meeting components
    to determine insights by analyzing the meeting''s quality, such as duration, number
    of attendees, redundancy, multitasking, and conflicting meeting hours. This is
    done to make meetings more efficient. It also helps to recognize if meeting attendees
    were multitasking like sending emails during the meeting, which means the attendees
    were not contributing their full potential in the meeting. This is the kind of
    information you need to improve the productivity of employees.


    +   - **Management and coaching.** This visualization contains information regarding
    collaboration between managers, teams, employees, and leaders. The analyst of
    your company can use this information to understand the relationship between'
  merge: -1
