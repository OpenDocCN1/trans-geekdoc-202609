- pgno: 203
  md: '# # DEMAND FORECASTING


    What is the top challenge faced by businesses today? It is demand volatility.
    There are too many factors to be taken into consideration that affect buyers,
    causing them to change their minds frequently. It can be anything from posts by
    social media influencers to weather inconsistencies that can change a customer''s
    willingness to buy a product. Hence, we need demand forecasting.


    Demand forecasting is a business practice performed to optimize inventory workflow.
    In this process, historical sales data is analyzed to make estimations about customer
    demands in the future. Demand forecasting helps businesses make critical business
    assumptions such as turnover, cash flow, profit margins, capital expenditure,
    and capacity planning. Typical challenges faced by businesses in planning stocks
    are:


    +   - Meeting sales demand without overstocking.

    +   - Planning promotions.

    +   - Managing abnormal demand.

    +   - Managing new and obsolete products.

    +   - Planning products with irregular demand.


    Demand forecasting can help manage stocks better, but you need a forecasting tool
    that can do more than simply calculate forecast from demand history. It needs
    to be able to forecast demand increases arising from promotions and manage overlapping
    promotions and different time periods covered by different promotions.


    Dynamics 365''s demand forecasting addresses all these issues. It uses historical
    data to generate a statistical baseline forecast. The historical transactional
    data is in the supply chain management transactional database. This data is gathered
    and fed to the machine learning service. With minimal customization, it enables
    you to plug multiple data sources, such as comma-separated value (CSV) files,
    Dynamics 365 Finance & Operations, and Microsoft Excel files into the staging
    table. Hence, it empowers you to generate demand forecasts having historical data
    spread among multiple systems.'
