- pgno: 215
  md: 'organizational resiliency and can see opportunities where a change in process
    could improve business outcomes.


    To perform a detailed analysis, you can use the Power BI Connector to combine
    Power BI and Workplace Analytics data to use drill-down and visualization capabilities
    of Power BI. Power BI automatically refreshes your data with new data from Workplace
    Analytics. The connector also strengthens privacy by limiting those who view the
    report from seeing data about a group specified by the Workplace Analytics administrator.
    This gives you the confidence to share reports without worrying about the data
    being exposed.


    # MyAnalytics Dashboard


    MyAnalytics Dashboard provides insights to employees to help them understand how
    they can better manage their time and work more efficiently. The dashboard gives
    a detailed visualization of how much time you have spent on collaboration, network,
    focused work, and well-being. It also suggests some productivity insights, educational
    tips, time spent on meetings, and how an individual can improve productivity.


    If you combine MyAnalytics and Workplace Analytics using Workplace Analytics plans,
    the insights gained can generate an improvement plan to help team members increase
    focus time and reduce meeting load while maintaining their work-life balance,
    among other goals.'
