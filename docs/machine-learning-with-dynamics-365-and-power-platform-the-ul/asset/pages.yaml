    The following is a list of commonly used algorithms in unsupervised learning:


    +   - k-means clustering


    +   - Association rules


    3. Semi-supervised learning. Semi-supervised learning is a type of machine learning
    that uses a combination of both supervised and unsupervised learning techniques.
    It is used in a scenario where our dataset is a combination of both labeled and
    unlabeled data.


    For example, let''s assume that we have access to a large number of unlabeled
    datasets that we like to train a model on. Manually labeling the whole data by
    ourselves is just not practical. So, instead of labeling the whole dataset, we
    manually label some parts of the dataset ourselves and use that portion to train
    our model. But this way, all the unlabeled data will be of no use. As we know,
    the more data we have to train our model, the better and more robust our model
    would be. So what can we do to use the unlabeled data of our dataset?


    This is why semi-supervised learning was introduced. To prevent our unlabeled
    data from getting wasted, we can implement a technique of semi-supervised learning
    called pseudo labeling.


    To understand pseudo labeling, let''s continue with the example mentioned previously.


    Our model is trained using labeled data, and it is performing pretty well. Everything
    to this point is just regular supervised learning. Now we will use unsupervised
    learning to predict the remaining unlabeled portion of data. We will serve the
    unlabeled data to our model. The trained model will then process this data, and
    as a result, it will predict individual outputs for each piece of unlabeled data.
    Thus, pseudo labeling is a process of labeling the unlabeled data with the output
    that'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'is predicted by our neural network. With pseudo labeling, we can train on an
    audaciously larger dataset.


