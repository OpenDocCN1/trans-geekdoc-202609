  md: '![](img/62da674fd5b031cf7705f5424f5bc7c5_40_0.png)


    **FIGURE 1.5** Machine learning algorithms.


    **What is labeled data?** The data for which you already know the target answer
    is called labeled data. For example, if I show you an image and tell you that
    it is a butterfly, then it''s called labeled data. However, if I show you an image
    without telling you what it is, that is referred to as unlabeled data.


    Now let''s understand with an example how labeled data makes a machine learn.


    We have images that are labeled as spoon and knife; we then feed them to the machine,
    which analyzes and learns the association of these images with their labels based
    on their features such as shape, size, and sharpness. Now, if any new image is
    fed to the machine without any label, the past data helps the machine to predict
    accurately and tell whether it''s a spoon or knife. Thus, in supervised machine
    learning, the algorithm teaches the model to learn from the labeled example that
    we provide.


    It consists of two techniques: classification and regression.


    +   a. **Classification.** For example, if the output variable is categorical
    such as red or blue, disease or no disease, male or female, will I get an increment
