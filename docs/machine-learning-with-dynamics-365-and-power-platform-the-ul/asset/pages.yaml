    Unsupervised learning consists of two techniques: clustering and association.


    a. **Clustering.** In clustering, the machine forms groups based on the behavior
    of the data. For example, which customer made similar product purchases?


    b. **Association.** It is an area of machine learning that identifies exceptional
    relationships between variables in'
