  md: '# AZURE MACHINE LEARNING SERVICE


    The Azure ML service is an open platform to create ML solutions using Python.
    It provides tools to scale and automate training, deployment, and monitoring of
    ML models easily and seamlessly.


    Before the introduction of Azure Machine learning service, in order to use machine
    learning in a production environment, you were required to bring together a bunch
    of data services to support the full machine learning lifecycle, for example,
    the following data services:


    +   - **Azure blob storage or Azure data lake storage** are storage solutions
    for data. It is important to bring these solutions together because models cannot
    be trained without data.


    +   - **Virtual machines, Azure HDInsight, and Azure Databricks** are brought
    together to run the code.


    +   - **Virtual network** functions as a security boundary, securing your data
    by isolating your Azure resources from the public internet. You can bring your
    virtual network to figure out your computing and data in the same virtual network,
    or you can also use Azure virtual network to your on-premises network to securely
    train your models and access your deployed models for reasoning.


    +   - **Azure key vault** is a cloud-hosted service to manage and secure your
    credentials, authorize access for certificates, and many other secrets. You have
    full control of the keys to access and encrypt your data. Administrators have
    the power to grant or revoke access to the keys.


    +   - **Docker containers** image is a stand-alone, executable package of software
    used to run your experiment repeatedly because it has everything needed to run
    an application such as a consistent set of ML libraries, code, system tools, and
    settings. It uses the Azure Container registry, which is a private Docker registry
    service to store those Docker containers and then put them inside your virtual
    network.


    +   - **Azure Kubernetes Service** is an orchestration service used to deploy,
    scale, and manage Docker containers and container-'
