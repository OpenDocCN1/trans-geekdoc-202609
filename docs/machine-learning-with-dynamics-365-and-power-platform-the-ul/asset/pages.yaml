    # ## AZURE CLI EXTENSION


    Azure Command Line Interface (CLI) is a set of commands that provides cross-platform
    command-line experience and is also used to create and manage resources. It is
    designed to get you working quickly with Azure, as it is available across Azure
    services.


    Azure CLI is used to automate day-to-day repetitive operations. It enables you
    to schedule these tasks and also deploy them. Especially if you are deploying
    hundreds of resources, it is the perfect way to automate the process. Some key
    features of CLI that make it convenient to use are:


    +   - **Interactive mode.** This mode guides you through available commands, places
    you in an interactive shell with command descriptions, examples, and auto-completion,
    and leads you on whether you need parameters. To use Azure CLI interactive mode,
    just type the following command: az interactive.


    +   - **Multiple output formats.** As a default output format, Azure CLI uses
    JSON, but it also offers output in other formats. The following are the output
    formats with argument values:


    +   - **JSON.** JSON string. This setting is the default.


    +   - **JSONC.** Colorized JSON.'
  merge: -1
