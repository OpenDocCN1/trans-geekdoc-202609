    # WHAT IS MACHINE LEARNING: HOW HAS IT EVOLVED?


    > “The early bird gets the first worm, but the wisest bird gets the fastest one.”

    > — Matshona Dhliwayo


    Hard work can take you wherever you want, but smart work can make you reach there
    faster. Let''s make our system smart enough to carry out repetitive/mundane tasks.
    Now, let''s understand what machine learning is all about and how it can make
    a difference.


    Machine learning is like a person learning from experience. For example, as the
    owner of a grocery store, you need to optimize your inventory. The question is,
    how can ML help you in doing so? ML can predict inventory needs based on the weekday,
    season, events in nearby locations, customers'' behavior, and so on. But for precise
    predictions, you need to feed your machine with lots of data, so that machine
    learning algorithms find patterns in the data. Using this data, the ML algorithm
    can predict sales in advance. Also, if you are using computer vision technology
    to monitor customer behavior or if you are using a robot assistant like LoweBot
    in your store, both technologies help ML to keep track of inventory and notify
    managers if any unexpected pattern of inventory data is found.


    # DEFINITION OF MACHINE LEARNING


    Machine learning unlocks the hidden insight of data by allowing machines to learn
    from examples and experiences. Instead of writing the code explicitly, what you
    do is feed the data to the generic algorithms in the machines. The machines then
    analyze this data, change the data patterns, and build the logic to serve predictions
    on previously unseen data.


