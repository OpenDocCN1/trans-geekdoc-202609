    # Azure Machine Learning Pipelines


    Azure Machine Learning pipeline is an autonomously executable workflow of a whole
    machine learning task (Figure 4.6). Subtasks in the pipeline are encapsulated
    as a series of steps. These pipelines can do just about anything from making a
    call for Python script to more complex tasks. Your pipelines should majorly concentrate
    on machine learning tasks such as:


    +   - Importing, cleaning, validating data and transformation, normalization,
    and staging as done in the data preparation process.

    +   - Training configuration including logging/reporting configurations and parameterizing
    arguments and file paths.

    +   - Training and verifying the results efficiently and repeatedly. High-level
    performance can be achieved by specifying specific data subsets, distributed processing,
    different hardware compute resources, and progress monitoring.

    +   - Deployment tasks, which include versioning, provisioning, scaling, and access
    control.'
