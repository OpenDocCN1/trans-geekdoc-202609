    \ parameters:  \n\n  Applications of the association rule learning    Association\
    \ rule learning has a large number of applications in the field of data mining\
    \ and machine learning. Some popular applications of association rule learning\
    \ are given as follows:    In Medical Association rule learning can be used to\
    \ find the probability of illness due to a particular disease. It can help doctors\
    \ to choose the right direction of treatment so that the patients can be cured\
    \ easily.    Determining Protein Association rule learning helps to identify the\
    \ protein structure from a big amount of genome data, which helps to synthesize\
    \ the artificial protein.    Market Basket Finding an association between the\
    \ different items is called marker basket analysis. Various techniques of the\
    \ association rule learning can be used for market basket analysis. It is widely\
    \ used by big retailers to improve their sales. Therefore, we can say that the\
    \ market basket analysis is an important and popular application of association\
    \ rule learning. Other than the application mentioned above, there are some more\
    \ applications of association rule learning such as catalog design, loss-leader,\
    \ and many more.  \n\n  Probabilistic clustering    In this clustering technique,\
    \ the assignment of data points to clusters is soft, i.e. the membership of a\
    \ data point in a cluster is having a probabilistic value. Therefore, the probabilistic\
    \ clustering is also known as soft clustering. Let us understand the concept with\
    \ the help of an example:    Let us consider three clusters as shown in a scatter\
    \ plot in Figure All these three clusters have been denoted through different\
    \ colors i.e. cyan, blue, and green:    ![](image-nekrlv2q.jpg)  Figure 3.28:\
