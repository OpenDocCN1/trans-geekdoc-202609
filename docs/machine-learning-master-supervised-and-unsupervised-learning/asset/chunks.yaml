    # Sentiment Analysis


    Sentiment analysis is a real-time machine learning application that determines
    the emotion or opinion of the speaker or the writer. For instance, if someone
    has written a review or email (or any form of a document), the sentiment analyzer
    will instantly find out the actual thought and tone of the text. This sentiment
    analysis application can be used to analyze a review-based website, decision-making
    applications, and so on.


    # Self-driving cars


    One of the most exciting applications of machine learning is self-driving cars.
    Machine learning plays a significant role in self-driving cars. Tesla, the most
    popular car manufacturing company is working on a self-driving car. These self-driven
    cars are autonomous cars that are safer than cars driven by humans. Things that
    make these cars safe are that they are not affected by factors like illness or
    the emotion of the driver.


    # Email Spam and Malware Filtering


    Whenever we receive a new email, it is filtered automatically as important, normal,
    and spam. We always receive an important email in our inbox with the important
    symbol and spam emails in our spam box, and the technology behind this is machine
    learning. Following are some spam filters used by:


    - Content filter

    - Header filter

    - General blacklists filter

    - Rules-based filters

    - Permission filters


    # Stock Market Trading


    Machine learning is widely used in stock market trading. In the stock market,
    there is always a risk of fluctuations in shares, so for this, machine learning
    is used to predict the market trends of stock.


    # Medical Diagnosis


    In medical science, machine learning is used for disease diagnoses. With this,
    medical technology is growing rapidly and can build 3D models that can predict
    the exact position of lesions in the brain. It helps in finding brain tumors and
    other brain-related diseases easily.


    # Online Fraud Detection


    Machine learning is making online transactions safe and secure by detecting fraud
    transactions. Whenever we perform some online transactions, there may be various
    ways that a fraudulent transaction can take place such as fake accounts, fake
    ids, and steal money in the middle of a transaction. Therefore, to detect this,
    machine learning helps us by checking whether it is a genuine transaction or a
    fraud transaction.


    # Automatic language translation


    Nowadays, if we visit a new place and are not aware of the language then it is
    not a problem, as for this machine learning helps us by converting the text into
    our known language. Google''s Google Neural Machine Translation provides us with
    this feature, which is a neural machine learning that translates the text into
    a familiar language, and it is called automatic translation. The technology behind
    the automatic translation is a sequence-to-sequence learning algorithm, which
    is used with image recognition and translates the text from one language to another.


    # Types of Machine Learning


    There are different ways in how a machine learns. In some cases, machines are
    trained and in some cases, machines learn on their own. Well, primarily, there
    are three types of machine learning – Supervised, Unsupervised Learning & Reinforcement
    Learning as shown in Figure.


    ![](image-du7woox5.jpg)

    **Figure 1.6: Types of Machine Learning**


    ## Supervised Learning


    Supervised machine learning algorithms are designed to learn by example. It is
    called supervised learning because the process of an algorithm learning from the
    training dataset can be thought of as a teacher supervising the learning process.


    In supervised learning, the data consists of an input variable and an output variable
    or the dataset is labeled. Labeled data means the input data and its associated
    output is available in the dataset.


    During the training process, the algorithm search for the patterns in the input
    data and correlate with the desired output data. After the training process, a
    supervised learning algorithm will take the unseen data as inputs and will determine
    which label the new inputs will be classified as based on prior training data.
    The objective of a supervised learning model is to predict the correct label for
    the newly presented input data.


    ![](image-nf7j9fhs.jpg)

    **Figure 1.7: Supervised Learning**


    As shown in Figure we have a dataset of images of cats and dogs. Every image in
    the dataset is labeled means we know which image represents a cat or which image
    represents a dog. We give all the images and their corresponding labels to the
    model/algorithm. Then, it should be able to make the difference on its own.


    If everything goes very well, when showing a new image to the model without having
    its label, it should be able to tell us whether it is a cat or a dog (if the model
    learned well).


    Supervised learning problems can be further classified into regression and classification
    problems.


    ### Regression


    Regression algorithms are used if there is a relationship between input variable
    and the output variable. It is used when the value of the output variable is continuous
    or real, such as house price, weather forecasting, stock price prediction, and
    so on.


    ![](image-9dc7qfkd.jpg)

    **Figure 1.8: Regression**


    Figure 1.8 shows, the dataset which serves the purpose of predicting the house
    price, based on different parameters. Here, the input variables are Size of No
    of Bedrooms & No of Bathrooms & the output variable is the Price of which is a
    continuous value. Therefore, this is a Regression Problem.


    The goal here is to predict a value as much closer to the actual output value
    as the model can and then evaluation is done by calculating the error value. The
    smaller the error the greater the accuracy of the regression model.


    ### Classification


    Classification is the process to group the output into different classes based
    on one or more input variables. Classification is used when the value of the output
    variable is discrete or categorical, such as email is spam or not spam, tumor
    is malignant or benign, "Yes" or "No" and 0 or 1 and so on.


    If the algorithm tries to classify input variables into two different classes,
    it is called binary classification such as email is spam or not spam. When the
    algorithm tries to classify input variables into more than two classes, it is
    called multiclass classification such as handwritten character recognition where
    classes go from 0 to 9.


    ## Unsupervised Learning


    Unsupervised learning deals with unlabeled data means here we have input data
    and no corresponding output variable. This is the opposite of supervised machine
    learning. In unsupervised learning, the users do not need to teach/supervise the
    model. There is no correct output and no supervisor to teach.


    The algorithm itself learns from the input data & discovers the patterns & information
    from the data to learn & group the data according to similarities.


    As shown in the Figure suppose we have an image dataset of different types of
    cats and dogs. The unsupervised learning algorithm is given that dataset. The
    algorithm is never seen/trained upon the given dataset, which means it does not
    have any idea about the features of the dataset. The task of the unsupervised
    learning algorithm is to identify the image features on their own. Unsupervised
    learning algorithms will perform this task by clustering the image dataset into
    groups according to the similarities between the images.


    ![](image-chomoooo.jpg)

    **Figure 1.9: Unsupervised Learning**


    The unsupervised learning algorithm can be further categorized into clustering
    and Association problems.

