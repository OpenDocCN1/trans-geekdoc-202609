  fmt: "\n# K-Means Clustering Algorithm\n\n## Algorithm of K-Means Clustering\n\n\
    A step-by-step process of K-means clustering is shown in the following algorithm:\n\
    \n**Input:** Raw data items (n elements)  \n**Output:** Labeled groups of data\
    \ items (k clusters)\n\n**Step 1:** Start by choosing the value of `k` (number\
    \ of clusters).\n\n**Step 2:** For initial partitioning of raw data into `k` clusters,\
    \ choose `k` elements as centroids that classify data. We can choose the initial\
    \ centroids systematically or randomly as per the following steps:\n- Take the\
    \ first `k` training samples (centroids).\n- For `n-k` elements, each element\
    \ will be added to a cluster of the nearest centroid. After each assignment, the\
    \ centroids of the clusters must be recomputed.\n\n**Step 3:** By putting every\
    \ sample in sequence, calculate the distance of elements from the centroid of\
    \ each cluster. Put the sample element into the cluster which has the closest\
    \ distance with centroids. After switching the samples into the nearest centroid's\
    \ cluster, update the centroid.\n\n**Step 4:** Repeat Step 3 until convergence,\
    \ i.e., during the iteration, not a single sample moves from one cluster to another.\n\
    - If the data count is less than the cluster count, each data point will be considered\
    \ the centroid of the cluster and each centroid will be assigned a cluster number.\n\
    - If the data count is greater than the number of clusters, then for every sample\
    \ data calculate the distance from each centroid. The data which has the minimum\
    \ distance will belong to the cluster which has the minimum distance with that\
    \ data.\n\nAs the location of the centroid is uncertain, therefore the location\
    \ of the centroid must be recalculated based on the recently updated cluster's\
    \ data. This process will be repeated until convergence.\n\n## Flowchart of K-Means\
    \ Clustering\n\nFor more illustration of the K-means algorithm, a flow chart of\
    \ this algorithm is shown in Figure 3.3:\n\n![](image-waius2tq.jpg)\n*Figure 3.3:\
    \ Flowchart of K-means clustering algorithm*\n\n## A Practical Example of K-Means\
    \ Clustering\n\nFor example, we have four objects, each object has 2 attributes.\
    \ The first attribute of each object is a weight-index, represented by label `W`\
    \ and another attribute is pH represented by label `P`. Objects, attributes, and\
    \ their values are shown in Table 3.1. Our objective is to cluster these objects\
    \ into two clusters based on the values of their attributes.\n\n*Table 3.1: Input\
    \ dataset for K-means clustering*\n\nEvery object denotes one point with two attributes\
    \ (`W`, `P`). Objects and corresponding values of their attributes have been plotted\
    \ and shown in Figure 3.4 using the graph:\n\n![](image-vl4eb25p.jpg)\n*Figure\
    \ 3.4: Scatter plot of the input dataset*\n\n### Initial Centroids Selection\n\
    \nAssume object `E` and object `F` have been chosen as initial centroids. The\
    \ coordinates of the centroid `E` and `F` are represented through symbols `Cn1`\
    \ and `Cn2`, respectively. `Cn1 = (1, 1)` and `Cn2 = (2, 1)` as shown in Figure\
    \ 3.5:\n\n![](image-nkmjy9q0.jpg)\n*Figure 3.5: Representation of centroid with\
    \ different color*\n\n### Distance Calculation (Objects-Centroids)\n\nThe Euclidean\
    \ distance between each object and cluster-centroid is calculated and represented\
    \ through the distance matrix in Figure 3.6:\n\n![](image-74w9r7jh.jpg)\n*Figure\
    \ 3.6: Representation of distance matrix*\n\nEvery element of the distance matrix\
    \ represents the Euclidean distance between the object and centroid. Elements\
    \ of row-1 of the distance matrix are the distance between centroid `Cn1` and\
    \ objects `E`, `F`, `G`, and `H` respectively, whereas elements of row-2 of the\
    \ distance matrix are the distance between centroid `Cn2` and objects `E`, `F`,\
    \ `G`, and `H` respectively.\n\n**Calculate the distance of object `G` from centroid\
    \ `Cn1` and `Cn2`, respectively:**\n\n- Distance between `G(4,3)` and centroid\
    \ `Cn1 (1, 1)`:\n  ![](image-b02f998b.jpg)\n- Distance between `G(4,3)` and centroid\
    \ `Cn2 (2, 1)`:\n  ![](image-h1yu4o1t.jpg)\n\n### Assignment to Clusters (Iteration\
    \ 1)\n\nEach object must be assigned based on the minimum distance. So, object\
    \ `E` has been assigned to group-1, object `F` to group 2, object `G` to group\
    \ 2, and object `H` to group 2. The element of the group matrix has been shown\
    \ in Figure 3.7:\n\n![](image-839lmy7h.jpg)\n*Figure 3.7: Elements of the group\
    \ matrix*\n\n### Centroid Update (Iteration 1)\n\nAfter assigning members to each\
    \ group, a new centroid must be calculated. For every group, a new centroid will\
    \ be calculated based on the values of its members. In this example, group-1 has\
    \ only one member therefore the centroid remains at `Cn1 = (1, 1)`. Whereas group-2\
    \ has three members, therefore the centroid will be calculated by averaging the\
    \ coordinates of all three members as follows:\n\n![](image-9uews4m4.jpg)\n\n\
    ### Distance Recalculation (Iteration 1)\n\nAfter calculating the new centroid,\
    \ the distance of all objects from the new centroids have been calculated, and\
    \ like Step 2 a distance matrix has been created and shown as follows:\n\n![](image-shjez3jo.jpg)\n\
    *Figure 3.8: Distance matrix and object matrix*\n\n### Re-assignment (Iteration\
    \ 1)\n\nLike Step 3, each object must be assigned to the updated group based on\
    \ the minimum distance. Based on the new distance matrix, object `F` will be moved\
    \ to group-1 and all the other objects will remain in the previously assigned\
    \ group. The updated group matrix has been shown as follows:\n\n![](image-1378a0sp.jpg)\n\
    *Figure 3.9: Group matrix*\n\n### Centroid Update (Iteration 2)\n\nWe have to\
    \ repeat Step 4 to determine the new centroid. Based on the clustering of the\
    \ previous iteration, the coordinates of the new centroid must be calculated.\
    \ As we can see group-1 and group-2 both have two members, thus the new centroids\
    \ are as follows:\n\n![](image-82bny1no.jpg)\nand\n![](image-bn2djyr7.jpg)\n\n\
    ### Distance Calculation (Iteration 2)\n\nWe have to repeat Step 2 to calculate\
    \ the distance between the objects and updated centroids. Calculated distances\
    \ are represented through the distance matrix shown as follows:\n\n![](image-pc5nkgbm.jpg)\n\
    *Figure 3.10: Distance matrix and object matrix*\n\n### Final Assignment (Iteration\
    \ 2)\n\nAs per the distance matrix created in the previous step, group-1 or group-2\
    \ is assigned to each object based on the minimum distance. The resultant group\
    \ matrix is shown as follows:\n\n![](image-pyfklup4.jpg)\n*Figure 3.11: Group\
    \ matrix*\n\nAs we can see the `groupmatrix_2` and `groupmatrix_11` (calculated\
    \ in the previous iteration) are the same i.e. no change in the group membership\
    \ of objects in the second iteration. So we can say that there is no movement\
    \ of objects in the current iteration thus computation of the K-means clustering\
    \ algorithm has reached permanency and no more iterations are needed. So final\
    \ grouping is the result calculated through the K-means clustering algorithm.\n\
    \n# Hierarchical Clustering\n\nHierarchical clustering is an unsupervised machine\
    \ learning technique of data clustering that constructs the hierarchy of clusters.\
    \ It takes an unlabeled dataset as an input and groups it into hierarchical clusters\
    \ as an output; therefore, it is also known as Hierarchical Cluster Analysis.\
    \ It starts with all the knowledge and data as an initial cluster. Two clusters\
    \ similar to each other would be in the same cluster here. When there is only\
    \ one cluster remaining, this algorithm stops. The output of the hierarchical\
    \ clustering can be seen as a tree-like structure. That tree-like structure is\
    \ called a **dendrogram**.\n\nThe effects and outcomes of hierarchical clustering\
    \ and K-means clustering may often look identical; however, the working of both\
    \ algorithms are different. Unlike a K-means cluster algorithm, there is no need\
    \ to pre-identify the number of groups or clusters.\n"
  trans: "\n\n# K-Means 聚类算法\n\n## K-Means 聚类算法\n\nK-means 聚类的分步过程如下算法所示：\n\n**输入：**\
    \ 原始数据项（n 个元素）  \n**输出：** 标记后的数据项组（k 个簇）\n\n**步骤 1：** 首先选择 `k` 的值（簇的数量）。\n\n**步骤\
    \ 2：** 为了将原始数据初始划分为 `k` 个簇，选择 `k` 个元素作为对数据进行分类的质心。我们可以按照以下步骤系统地或随机地选择初始质心：\n-\
    \ 取前 `k` 个训练样本（质心）。\n- 对于 `n-k` 个元素，每个元素将被添加到最近质心的簇中。每次分配后，必须重新计算簇的质心。\n\n**步骤\
    \ 3：** 通过按顺序放置每个样本，计算元素到每个簇质心的距离。将样本元素放入与质心距离最近的簇中。将样本切换到最近质心的簇后，更新质心。\n\n**步骤\
    \ 4：** 重复步骤 3 直到收敛，即在迭代过程中，没有任何一个样本从一个簇移动到另一个簇。\n- 如果数据计数少于簇计数，每个数据点将被视为该簇的质心，并为每个质心分配一个簇编号。\n\
    - 如果数据计数大于簇的数量，则对每个样本数据计算其到每个质心的距离。具有最小距离的数据将属于与该数据距离最小的簇。\n\n由于质心的位置是不确定的，因此必须根据最近更新的簇的数据重新计算质心的位置。此过程将重复直到收敛。\n\
    \n## K-Means 聚类流程图\n\n为了更直观地说明 K-means 算法，该算法的流程图如图 3.3 所示：\n\n![](img/image-waius2tq.jpg)\n\
    *图 3.3：K-means 聚类算法流程图*\n\n## K-Means 聚类实战示例\n\n例如，我们有四个对象，每个对象有 2 个属性。每个对象的第一个属性是重量指数，用标签\
    \ `W` 表示，另一个属性是 pH 值，用标签 `P` 表示。对象、属性及其值如表 3.1 所示。我们的目标是根据其属性值将这些对象聚类为两个簇。\n\n\
    *表 3.1：K-means 聚类的输入数据集*\n\n每个对象表示具有两个属性（`W`、`P`）的一个点。对象及其对应的属性值已绘制并如图 3.4 所示：\n\
    \n![](img/image-vl4eb25p.jpg)\n*图 3.4：输入数据集的散点图*\n\n### 初始质心选择\n\n假设对象 `E` 和对象\
    \ `F` 被选为初始质心。质心 `E` 和 `F` 的坐标分别用符号 `Cn1` 和 `Cn2` 表示。`Cn1 = (1, 1)` 和 `Cn2 = (2,\
    \ 1)`，如图 3.5 所示：\n\n![](img/image-nkmjy9q0.jpg)\n*图 3.5：用不同颜色表示的质心*\n\n### 距离计算（对象-质心）\n\
    \n每个对象与簇质心之间的欧氏距离被计算并通过图 3.6 中的距离矩阵表示：\n\n![](img/image-74w9r7jh.jpg)\n*图 3.6：距离矩阵表示*\n\
    \n距离矩阵的每个元素代表对象与质心之间的欧氏距离。距离矩阵第 1 行的元素分别是质心 `Cn1` 与对象 `E`、`F`、`G` 和 `H` 之间的距离，而第\
    \ 2 行的元素分别是质心 `Cn2` 与对象 `E`、`F`、`G` 和 `H` 之间的距离。\n\n**分别计算对象 `G` 到质心 `Cn1` 和 `Cn2`\
    \ 的距离：**\n\n- 对象 `G(4,3)` 与质心 `Cn1 (1, 1)` 之间的距离：\n  ![](img/image-b02f998b.jpg)\n\
    - 对象 `G(4,3)` 与质心 `Cn2 (2, 1)` 之间的距离：\n  ![](img/image-h1yu4o1t.jpg)\n\n### 簇分配（迭代\
    \ 1）\n\n每个对象必须根据最小距离进行分配。因此，对象 `E` 被分配给第 1 组，对象 `F` 分配给第 2 组，对象 `G` 分配给第 2 组，对象\
    \ `H` 分配给第 2 组。组矩阵的元素如图 3.7 所示：\n\n![](img/image-839lmy7h.jpg)\n*图 3.7：组矩阵元素*\n\
    \n### 质心更新（迭代 1）\n\n将成员分配给每个组后，必须计算新的质心。对于每个组，将根据其成员的值计算新的质心。在本例中，第 1 组只有一个成员，因此质心保持在\
    \ `Cn1 = (1, 1)`。而第 2 组有三个成员，因此质心将通过对所有三个成员的坐标求平均值来计算，如下所示：\n\n![](img/image-9uews4m4.jpg)\n\
    \n### 距离重新计算（迭代 1）\n\n计算新质心后，已计算所有对象到新质心的距离，并像步骤 2 一样创建了距离矩阵，如下所示：\n\n![](img/image-shjez3jo.jpg)\n\
    *图 3.8：距离矩阵和对象矩阵*\n\n### 重新分配（迭代 1）\n\n像步骤 3 一样，每个对象必须根据最小距离分配到更新后的组。根据新的距离矩阵，对象\
    \ `F` 将移动到第 1 组，所有其他对象将保持在之前分配的组中。更新后的组矩阵如下所示：\n\n![](img/image-1378a0sp.jpg)\n\
    *图 3.9：组矩阵*\n\n### 质心更新（迭代 2）\n\n我们必须重复步骤 4 以确定新的质心。根据上一次迭代的聚类结果，必须计算新质心的坐标。正如我们所见，第\
    \ 1 组和第 2 组都有两个成员，因此新的质心如下：\n\n![](img/image-82bny1no.jpg)\n和\n![](img/image-bn2djyr7.jpg)\n\
    \n### 距离计算（迭代 2）\n\n我们必须重复步骤 2 以计算对象与更新后的质心之间的距离。计算出的距离通过如下所示的距离矩阵表示：\n\n![](img/image-pc5nkgbm.jpg)\n\
    *图 3.10：距离矩阵和对象矩阵*\n\n### 最终分配（迭代 2）\n\n根据上一步创建的距离矩阵，根据最小距离将第 1 组或第 2 组分配给每个对象。结果组矩阵如下所示：\n\
    \n![](img/image-pyfklup4.jpg)\n*图 3.11：组矩阵*\n\n正如我们所见，`groupmatrix_2` 和 `groupmatrix_11`（在上一次迭代中计算）是相同的，即对象的组成员资格在第二次迭代中没有变化。因此我们可以说，在当前迭代中没有对象移动，因此\
    \ K-means 聚类算法的计算已达到稳定，不再需要更多迭代。所以最终分组是通过 K-means 聚类算法计算出的结果。\n\n# 层次聚类\n\n层次聚类是一种数据聚类的无监督机器学习技术，它构建簇的层次结构。它以未标记数据集作为输入，并将其分组为层次簇作为输出；因此，它也称为层次聚类分析。它以所有知识和数据作为初始簇开始。两个相似的簇将位于同一个簇中。当只剩下一个簇时，该算法停止。层次聚类的输出可以看作是一种树状结构。这种树状结构称为**树状图**。\n\
    \n层次聚类和 K-means 聚类的效果和结果通常看起来可能相同；然而，两种算法的工作原理不同。与 K-means 聚类算法不同，无需预先确定组或簇的数量。\n\
    \n"
