- raw: "  Q-Learning    Q-learning is an off-policy reinforcement learning algorithm.\
    \ Trying to find the best action you can take given the current state. It is considered\
    \ off-policy because the Q-learning function learns from the actions outside the\
    \ current policy, such as taking random steps, so policy is not required. Q-learning\
    \ wants to learn a policy that maximizes total rewards.    This is a value-based\
    \ learning algorithm. Value-based algorithms update/adjust the value function\
    \ based on an equation. Whereas, policy-based predict the value function with\
    \ a greedy policy obtained from the last policy improvement.    The ‘Q’ in Q-learning\
    \ stands for quality. Quality in this case represents how useful a given action\
    \ is in gaining some future reward.  \n\n  Introducing the Q-Table    Q-Table\
    \ is just a fancy name for a simple lookup table. Q-Table is the data structure\
    \ used to calculate the maximum expected future rewards for action at each state.\
    \ This table will guide us to the best action in each state. To learn each value\
    \ of the Q-table, a Q-Learning algorithm is used.    Q-table or matrix follows\
    \ the shape of \\[state, action\\] and we initialize all values to zero. We then\
    \ update and store Q-values after an episode. This Q-table becomes a reference\
    \ table for the agent to select the best action based on the Q-value.    In the\
    \ Q-Table, the columns are the actions, and the rows are the states.    To learn\
    \ each value of the Q-table, we use the Q-Learning  \n\n  The Q-Learning algorithm\
    \    The Q-function uses the Bellman equation and takes two inputs: state (s)\
    \ and action (a).    ![](image-bub1xg2i.jpg)  Figure 5.8: Q-function    Using\
    \ the above we get the values of Q for the cells in the table. In the beginning,\
    \ all the values in the Q-table are zeros. There is an iterative process of updating\
    \ the values. As we start to explore the environment, the Q-function gives us\
    \ better and better approximations by continuously updating the Q-values in the\
    \ table.    Q-learning algorithm Let us understand the Q-learning algorithm with\
    \ each step in detail as shown in figure 5.9 as follows:    ![](image-8objp1vf.jpg) \
    \ Figure 5.9: Q-learning Algorithm    Step 1: Initialize the Q-Table    Here we\
    \ first create a Q-table. There are n columns, where n \\= number of actions.\
    \ There are m rows, where m \\= number of states. We will initialize the values\
    \ at 0\\.    Steps 2 and 3: Choose and perform an action    The combination of\
    \ steps 2 and 3 is performed for an undefined amount of time. These steps run\
    \ until the time training is stopped, or when the training loop is stopped as\
    \ defined in the code.    First, an action (a) in the state (s) is chosen based\
    \ on the Q-Table. Note that, as mentioned earlier when the episode initially starts,\
    \ every Q-value should be 0\\. Then, update the Q-values for being at the start\
    \ and moving right using the Bellman equation which has been explained above.\
    \    Steps 4: Measure reward    Now we have taken an action and observed an outcome\
    \ and reward.    Steps 5: Evaluate    We need to update the function Q (s, a).\
    \ This process is repeated until the learning is stopped. In this way, the Q-Table\
    \ is updated and the value function Q is maximized. Here, the Q (state, action)\
    \ returns the expected future reward of that action at that state.    New Q(s,a)\
