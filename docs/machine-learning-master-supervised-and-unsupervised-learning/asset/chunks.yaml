  fmt: "\n# Practicals\n\n## Experiment No. 1\n\n**AIM:** Implement and demonstrate\
    \ the FIND-S algorithm for finding the most specific hypothesis based on a given\
    \ set of training data samples. Read the training data from a CSV file.\n\n###\
    \ FIND-S Algorithm\n\n1. Initialize `h` to the most specific hypothesis in `H`\n\
    2. For each positive training instance `x`\n3. For each attribute constraint in\
    \ `h`\n4. If the constraint is satisfied by `x` then do nothing\n5. Else replace\
    \ in `h` by the next more general constraint that is satisfied by `x`\n6. Output\
    \ hypothesis `h`\n\n### Training Dataset: ML1.CSV\n\n![](image-v5wsotgm.jpg)\n\
    \n### Program\n\n```python\nimport pandas as pd\nimport numpy as np\n\n# to read\
    \ the data in the csv file\ndata = pd.read_csv(\"ML1.csv\")\n\n# making an array\
    \ of all the attributes\nd = np.array(data)[:, :-1]\nprint(\"The attributes are:\"\
    , d)\n\n# segregating the target that has positive and negative examples\ntarget\
    \ = np.array(data)[:, -1]\nprint(\"The target is:\", target)\n\n# training function\
    \ to implement find-s algorithm\ndef train(c, t):\n    for i, val in enumerate(t):\n\
    \        if val == \"Yes\":\n            specific_hypothesis = c[i].copy()\n \
    \           break\n\n    for i, val in enumerate(t):\n        if t[i] == \"Yes\"\
    :\n            for x in range(len(specific_hypothesis)):\n                if val[x]\
    \ != specific_hypothesis[x]:\n                    specific_hypothesis[x] = '?'\n\
    \n    return specific_hypothesis\n\n# obtaining the final hypothesis\nprint(\"\
    The final hypothesis:\", train(d, target))\n```\n\n### Code Output\n\n![](image-jwge2ruv.jpg)\n\
    \n---\n\n## Experiment No. 2\n\n**AIM:** For a given set of training data examples\
    \ stored in a .CSV file, implement and demonstrate the Candidate-Elimination algorithm\
    \ to output a description of the set of all hypotheses consistent with the training\
    \ examples.\n\n### CANDIDATE-ELIMINATION Learning Algorithm\n\nThe CANDIDATE-ELIMINATION\
    \ algorithm computes the version space containing all hypotheses from `H` that\
    \ are consistent with an observed sequence of training examples.\n\n1. Initialize\
    \ `G` to the set of maximally general hypotheses in `H`\n2. Initialize `S` to\
    \ the set of maximally specific hypotheses in `H`\n3. For each training example\
    \ `d`, do\n   - If `d` is a positive example\n     - Remove from `G` any hypothesis\
    \ inconsistent with `d`\n     - For each hypothesis `s` in `S` that is not consistent\
    \ with `d`\n       - Remove `s` from `S`\n       - Add to `S` all minimal generalizations\
    \ `h` of `s` such that\n         - `h` is consistent with `d`, and some member\
    \ of `G` is more general than `h`\n       - Remove from `S` any hypothesis that\
    \ is more general than another hypothesis in `S`\n   - If `d` is a negative example\n\
    \     - Remove from `S` any hypothesis inconsistent with `d`\n     - For each\
    \ hypothesis `g` in `G` that is not consistent with `d`\n       - Remove `g` from\
    \ `G`\n       - Add to `G` all minimal specializations `h` of `g` such that\n\
    \         - `h` is consistent with `d`, and some member of `S` is more specific\
    \ than `h`\n       - Remove from `G` any hypothesis that is less general than\
    \ another hypothesis in `G`\n\n### CANDIDATE-ELIMINATION algorithm using version\
    \ spaces\n\n### Training ML2.CSV\n\n![](image-fh7n34ub.jpg)\n\n### Program\n\n\
    ```python\nimport numpy as np\nimport pandas as pd\n\ndata = pd.read_csv(\"ML2.csv\"\
    )\nconcepts = np.array(data)[:, :-1]\ntarget = np.array(data)[:, -1]\n\ndef learn(concepts,\
    \ target):\n    specific_h = concepts[0].copy()\n    general_h = [[\"?\" for _\
    \ in range(len(specific_h))] for _ in range(len(specific_h))]\n\n    for i, h\
    \ in enumerate(concepts):\n        if target[i] == \"Yes\":\n            for x\
    \ in range(len(specific_h)):\n                if h[x] != specific_h[x]:\n    \
    \                specific_h[x] = '?'\n                    general_h[x][x] = '?'\n\
    \n        if target[i] == \"No\":\n            for x in range(len(specific_h)):\n\
    \                if h[x] != specific_h[x]:\n                    general_h[x][x]\
    \ = specific_h[x]\n                else:\n                    general_h[x][x]\
    \ = '?'\n\n    # steps of Candidate Elimination\n    print(\"\\n\")\n    indices\
    \ = [i for i, val in enumerate(general_h) if val == ['?', '?', '?', '?', '?',\
    \ '?']]\n    for i in indices:\n        general_h.remove(['?', '?', '?', '?',\
    \ '?', '?'])\n\n    return specific_h, general_h\n\ns_final, g_final = learn(concepts,\
    \ target)\nprint(\"Final Specific_h:\", s_final)\nprint(\"Final General_h:\",\
    \ g_final)\n```\n\n### Code Output\n\n![](image-34x4ayvl.jpg)\n"
  trans: "\n\n# 实验\n\n## 实验编号 1\n\n**目的：** 实现并演示 FIND-S 算法，以根据给定的训练数据样本集找到最具体的假设。从\
    \ CSV 文件读取训练数据。\n\n### FIND-S 算法\n\n1. 将 `h` 初始化为 `H` 中最具体的假设\n2. 对于每个正训练实例 `x`\n\
    3. 对于 `h` 中的每个属性约束\n4. 如果约束被 `x` 满足，则不执行任何操作\n5. 否则用 `x` 满足的下一个更一般的约束替换 `h` 中的约束\n\
    6. 输出假设 `h`\n\n### 训练数据集：ML1.CSV\n\n![](img/image-v5wsotgm.jpg)\n\n### 程序\n\n\
    ```python\nimport pandas as pd\nimport numpy as np\n\n# 读取 csv 文件中的数据\ndata =\
    \ pd.read_csv(\"ML1.csv\")\n\n# 创建包含所有属性的数组\nd = np.array(data)[:, :-1]\nprint(\"\
    The attributes are:\", d)\n\n# 分离包含正例和反例的目标属性\ntarget = np.array(data)[:, -1]\n\
    print(\"The target is:\", target)\n\n# 实现 find-s 算法的训练函数\ndef train(c, t):\n \
    \   for i, val in enumerate(t):\n        if val == \"Yes\":\n            specific_hypothesis\
    \ = c[i].copy()\n            break\n\n    for i, val in enumerate(t):\n      \
    \  if t[i] == \"Yes\":\n            for x in range(len(specific_hypothesis)):\n\
    \                if val[x] != specific_hypothesis[x]:\n                    specific_hypothesis[x]\
    \ = '?'\n\n    return specific_hypothesis\n\n# 获取最终假设\nprint(\"The final hypothesis:\"\
    , train(d, target))\n```\n\n### 代码输出\n\n![](img/image-jwge2ruv.jpg)\n\n---\n\n\
    ## 实验编号 2\n\n**目的：** 对于存储在 .CSV 文件中的给定训练数据示例集，实现并演示候选消除算法，以输出与训练示例一致的所有假设集合的描述。\n\
    \n### 候选消除学习算法\n\n候选消除算法计算包含 `H` 中所有与观察到的训练示例序列一致的假设的版本空间。\n\n1. 将 `G` 初始化为 `H`\
    \ 中一组最一般的假设\n2. 将 `S` 初始化为 `H` 中一组最具体的假设\n3. 对于每个训练示例 `d`，执行\n   - 如果 `d` 是正例\n\
    \     - 从 `G` 中移除任何与 `d` 不一致的假设\n     - 对于 `S` 中每个与 `d` 不一致的假设 `s`\n       - 从\
    \ `S` 中移除 `s`\n       - 将 `s` 的所有最小泛化 `h` 添加到 `S`，使得\n         - `h` 与 `d` 一致，且\
    \ `G` 的某个成员比 `h` 更一般\n       - 从 `S` 中移除比 `S` 中另一个假设更一般的任何假设\n   - 如果 `d` 是反例\n\
    \     - 从 `S` 中移除任何与 `d` 不一致的假设\n     - 对于 `G` 中每个与 `d` 不一致的假设 `g`\n       - 从\
    \ `G` 中移除 `g`\n       - 将 `g` 的所有最小特化 `h` 添加到 `G`，使得\n         - `h` 与 `d` 一致，且\
    \ `S` 的某个成员比 `h` 更具体\n       - 从 `G` 中移除比 `G` 中另一个假设不那么一般的任何假设\n\n### 使用版本空间的候选消除算法\n\
    \n### 训练 ML2.CSV\n\n![](img/image-fh7n34ub.jpg)\n\n### 程序\n\n```python\nimport\
    \ numpy as np\nimport pandas as pd\n\ndata = pd.read_csv(\"ML2.csv\")\nconcepts\
    \ = np.array(data)[:, :-1]\ntarget = np.array(data)[:, -1]\n\ndef learn(concepts,\
    \ target):\n    specific_h = concepts[0].copy()\n    general_h = [[\"?\" for _\
    \ in range(len(specific_h))] for _ in range(len(specific_h))]\n\n    for i, h\
    \ in enumerate(concepts):\n        if target[i] == \"Yes\":\n            for x\
    \ in range(len(specific_h)):\n                if h[x] != specific_h[x]:\n    \
    \                specific_h[x] = '?'\n                    general_h[x][x] = '?'\n\
    \n        if target[i] == \"No\":\n            for x in range(len(specific_h)):\n\
    \                if h[x] != specific_h[x]:\n                    general_h[x][x]\
    \ = specific_h[x]\n                else:\n                    general_h[x][x]\
    \ = '?'\n\n    # 候选消除算法步骤\n    print(\"\\n\")\n    indices = [i for i, val in\
    \ enumerate(general_h) if val == ['?', '?', '?', '?', '?', '?']]\n    for i in\
    \ indices:\n        general_h.remove(['?', '?', '?', '?', '?', '?'])\n\n    return\
    \ specific_h, general_h\n\ns_final, g_final = learn(concepts, target)\nprint(\"\
    Final Specific_h:\", s_final)\nprint(\"Final General_h:\", g_final)\n```\n\n###\
    \ 代码输出\n\n![](img/image-34x4ayvl.jpg)\n\n"
