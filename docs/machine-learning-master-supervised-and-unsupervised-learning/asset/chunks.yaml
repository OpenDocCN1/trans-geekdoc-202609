    # Example of Decision Tree


    Assume we want to play badminton on a specific day, say Saturday—how will you
    decide whether or not to play? Assume you go outside to see if it is hot or cold,
    the speed of the wind and humidity, and the weather, i.e., whether it''s sunny,
    cloudy, or rainy. You consider all of these factors when deciding whether or not
    to play. Table 2.3 shows the weather observations of the last ten days.


    **Table 2.3: Weather Observations of the last ten days**


    A decision tree is a great way to represent the data because it follows a tree-like
    structure and considers all possible paths that can lead to the final decision.


    ![](image-2x6izm1k.jpg)

    **Figure 2.11: Play Badminton decision tree**


    Figure 2.11 depicts a learned decision tree. Each node represents an attribute
    or feature, and the branch from each node represents the node''s outcome. Finally,
    the final decision is made by the tree''s leaves.


    ## Advantages of Decision Tree


    Following are the advantages of decision tree:


    - Simple and easy to understand.

    - Popular technique for resolving decision-making problems.

    - It aids in considering all possible solutions to a problem.

    - Less data cleaning is required.


    ## Disadvantages of the Decision Tree


    Following are the disadvantages of decision tree:


    - Overfitting problem

    - Complexity


    # K-Nearest Neighbors (K-NN) Algorithm


    The K-Nearest Neighbors algorithm is a clear and simple supervised machine learning
    algorithm that can be used to solve regression and classification problems.


    The K-NN algorithm assumes that the new case and existing cases are similar and
    places the new case in the category that is most similar to the existing categories.
    The K-NN algorithm stores all available data and classifies a new data point based
    on its similarity to the existing data. This means that when new data appears,
    the KNN algorithm can quickly classify it into a suitable category.


    K-NN is a non-parametric algorithm, which means it makes no assumptions about
    the data it uses. It''s also known as a lazy learner algorithm because it doesn''t
    learn from the training set right away; instead, it stores the dataset and performs
    an action on it when it comes time to classify it.


    Pattern recognition, data mining, and intrusion detection are some of the demanding
    applications.


    ## Need of the K-NN Algorithm


    Assume there are two categories, Category A and Category B, and we have a new
    data point x1. Which of these categories will this data point fall into? A K-NN
    algorithm is required to solve this type of problem. We can easily identify the
    category or class of a dataset with the help of K-NN as shown in Figure


    ![](image-9rqxwax2.jpg)

    **Figure 2.12: Category or class of a dataset with the help of K-NN**


    The following algorithm can be used to explain how KNNs work:


    1. Select the no. K of the neighbors.

    2. Determine the Euclidean distance between K neighbors.

    3. Take the K closest neighbors based on the Euclidean distance calculated.

    4. Count the number of data points in each category among these K neighbors.

    5. Assign the new data points to the category with the greatest number of neighbors.

    6. Our model is complete.


    Let''s say we have a new data point that needs to be placed in the appropriate
    category. Consider the following illustration:


    ![](image-6l8w9sr1.jpg)

    **Figure 2.13: K-NN example**


    First, we''ll decide on the number of neighbors, so we''ll go with


    The Euclidean distance between the data points will then be calculated as shown
    in Figure The Euclidean distance is the distance between two points that we learned
    about in geometry class. It can be calculated using the following formula:


    ![](image-2n285fx5.jpg)

    **Figure 2.14: The Euclidean distance between the data points**


    We found the closest neighbors by calculating the Euclidean distance, which yielded
    three closest neighbors in category A and two closest neighbors in category B
    as shown in Figure Consider the following illustration:


    ![](image-3347ydiu.jpg)

    **Figure 2.15: Closest neighbors for the Category A and B**


    As can be seen, the three closest neighbors are all from category A, so this new
    data point must also be from that category.


    # Logistic Regression


    The classification algorithm logistic regression is used to assign observations
    to a discrete set of classes. Unlike linear regression, which produces a continuous
    number of values, logistic regression produces a probability value that can be
    mapped to two or more discrete classes using the logistic sigmoid function.


    A regression model with a categorical target variable is known as logistic regression.
    To model binary dependent variables, it employs a logistic function.


    The target variable in logistic regression has two possible values, such as yes/no.
    Consider how the target variable y would be represented in the value of "yes"
    is 1 and "no" is 0. The log-odds of y being 1 is a linear combination of one or
    more predictor variables, according to the logistic model. So, let''s say we have
    two predictors or independent variables, and and p is the probability of y equaling
    1. Then, using the logistic model as a guide:


    ![](image-36yc1fda.jpg)


    We can recover the odds by exponentiating the equation:


    ![](image-6sif2pyq.jpg)


    As a result, the probability of y is 1. If p is closer to 0, y equals 0, and if
    p is closer to 1, y equals 1. As a result, the logistic regression equation is:


    ![](image-k3kvvf94.jpg)


    This equation can be generalized to n number of parameters and independent variables
    as follows:


    ![](image-yvuy1dmh.jpg)


    ## Comparison between Linear and Logistic Regression


    Different things can be predicted using linear regression and logistic regression
    as shown in Figure


    - **Linear**: The predictions of linear regression are continuous (numbers in
    a range). It may be able to assist us in predicting the student''s test score
    on a scale of 0 to 100.

    - **Logistic**: The predictions of logistic regression are discrete (only specific
    values or categories are allowed). It might be able to tell us whether the student
    passed or failed. The probability scores that underpin the model''s classifications
    can also be viewed.


    ![](image-2d5d68hs.jpg)

    **Figure 2.16: Linear regression vs Logistic regression**


    While linear regression has an infinite number of possible outcomes, logistic
    regression has a set of predetermined outcomes.


    When the response variable is continuous, linear regression is used, but when
    the response variable is categorical, logistic regression is used.


    A continuous output, such as a stock market score, is an example of logistic regression
    and predicting a defaulter in a bank using transaction details from the past is
    an example of linear regression.


    The following Table 2.4 shows the difference between Linear and Logistic Regression:


    **Table 2.4: Difference between Linear and Logistic Regression**


    ## Types of Logistic Regression


    Logistic regression is mainly categorized into three types as shown in Figure


    - Binary Logistic Regression

    - Multinomial Logistic Regression

    - Ordinal Logistic Regression


    ![](image-jjtujdni.jpg)

    **Figure 2.17: Types of Logistic Regression**

