    \  \n\nForeword    Recently, machine learning has been utilized by the governments,\
    \ businesses and general public for different purposes. Machine learning has assisted\
    \ organizations by generating profit, and its popularity among developers and\
    \ technologists has skyrocketed. To best assist the readers in better understanding\
    \ of the facts, this book is well arranged in a way that teaches them what the\
    \ facts are.    — Dr. Ricardo Saavedra  Director & Chair International Programs\
    \  Universidad Azteca, Mexico    In today's digital age, mastering Machine Learning\
    \ is a must. This book will elegantly guide you through everything you need to\
    \ know about this topic.    — Dr. Govind Kumawat  Indian Institute of Management,\
    \ Udaipur, India    The authors provide an easy-to-understand and comprehensive\
    \ overview of Machine Learning concepts. The explanation is clear and concise,\
    \ with appropriate diagrams and real-world examples that help to demystify this\
    \ emerging technology.    — Dr. Deepak Khazanchi  University of Nebraska at Omaha,\
    \ USA    This book covers a wide range of learning approaches, with machine learning\
    \ techniques and algorithms with detailed examples to accompany each approach.\
    \    — Dr. Samuel Agbesi  Aalborg University, Denmark    The adoption and prevalence\
    \ of Artificial Intelligence and Machine Learning in our daily lives are the two\
    \ most significant technological shifts in the 21st century. This book explains\
    \ the concepts of Machine Learning technologies in a concise, clear and lucid\
    \ manner.    — Dr. Shiva Raj Pokhrel  Deakin University, Australia    A genuine\
    \ book for those who want to learn and apply Machine Learning concepts.    — Prof.\
    \ Dr. Dharm Singh  Namibia University of Science and Technology, Namibia    Machine\
    \ Learning is a fascinating and important research topic these days. The book\
    \ also transitions from academic to research topics. As a result, it is extremely\
    \ beneficial to any researcher or academician, from beginner to advanced level.\
    \    — Trilok Nuwal  Microsoft, India    The book is extremely comprehensive and\
    \ can be used in conjunction with any university's curriculum. The best part of\
    \ the book is that it discusses machine learning algorithms with real-world examples\
    \ and practical applications.    — Dr. Tanima Dutta  Indian Institute of Technology\
    \ (BHU), India    Machine Learning is a game changer in the age of digitization.\
    \ This book covers almost every aspect of Machine Learning, from the fundamentals\
    \ to the application level.    — Abhishek Maloo  Twitter, California, USA    Machine\
    \ Learning, like electricity, will revolutionize our lives in a variety of ways,\
    \ some of which are not even imaginable today. This book offers a comprehensive\
    \ conceptual understanding of Machine Learning techniques and algorithms.    —\
    \ Desmond Okocha, PhD  Bingham University, Nigeria    This book provides an in-depth\
    \ introduction to Machine Learning even to readers with no pre-requisite knowledge.\
    \ Many mathematical concepts are explained in an easy-to-understand manner.   \
    \ — Dr. Patrick Acheampong  Ghana Communication Technology University, Ghana \
    \   Provides a comprehensive overview of available techniques and algorithms in\
    \ conceptual terms, encompassing a variety of machine learning application domains.\
    \    — Dr. Sumarga Kumar Sah Tyagi  Zhongyuan University of Technology, China\
    \    This book covers everything fundamental to machine learning, to immerse yourself\
    \ in the theory of the topic and to use practical applications and examples to\
    \ promote knowledge.    — Dr. Albert Gyamfi  Saskatchewan Polytechnic, Canada\
    \    In addition to covering the theoretical aspects of machine learning, the\
    \ authors teach the various techniques for obtaining data as well as how to use\
    \ different inputs and outputs to evaluate results. Machine learning is dynamic,\
    \ so the methods are always evolving.    — Do Manh Thai  Govt. Executive, Vietnam\
    \    This book includes the popular learning algorithms, techniques and implementations\
    \ in the artificial intelligence field. I strongly advise this book.    — Prof.\
    \ Vinesh Jain  Govt. Engineering College, Ajmer, India  \n\n  Dedicated to   \
    \ Our lovely little daughter Miss Bhuvi Jain.  Your endless love and energy charge\
    \ every day.    – Dr. Ruchi Doshi and  Dr. Kamal Kant Hiran    "
