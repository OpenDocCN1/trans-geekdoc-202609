    \n**在以下哪种情况下，K-means 聚类将无法给出好的结果？ 1) 带有异常值的数据点 2) 具有不同密度的数据点 3) 具有非凸形状的数据点**\n\
    \n- 1 和 2\n- 2 和 3\n- 1、2 和 3\n- 1 和 3\n\n**在基于模型的学习方法中，基于各种模型参数构建的 ML 模型上会发生一个迭代过程，它们被称为？**\n\
    \n- 小批量\n- 优化参数\n- 超参数\n- 超级参数\n\n## 填空题\n\n- 无监督学习中使用的技术接受 _______________，发现先前未知或未被检测到的新信息模式。\n\
    - 在 _______________ 学习中，教师向学习者返回奖励和惩罚。\n- _______________ 用于博弈算法中的效用函数。\n- 层次聚类是一种\
    \ _______________ 机器学习数据聚类技术，它构建簇的层次结构。\n- 关联规则学习是一种 _______________ 学习技术。\n\n\
    ## 简答题\n\n- 区分训练数据和测试数据。\n- 什么是混淆矩阵？结合合适的例子解释。\n- 如何计算均方根误差？结合合适的例子解释。\n- 什么是信息增益？\n\
    - 什么是独立成分分析？\n\n## 论述题\n\n- 什么是推荐系统？机器学习在推荐系统中有何用处？\n- 解释设计学习系统所涉及的各个阶段。\n- 在哪些情况下朴素贝叶斯在分类中有用？为什么？\n\
    - 什么是吉布斯算法？它在机器学习中的适用性如何？\n- 哪类问题最适合决策树学习？结合合适的例子解释。\n- 什么是熵？我们如何利用互信息在正负类之间进行分类？\n\
    - 解释决策树学习中涉及的各种问题。\n- 什么是归纳偏置？偏置对分类有影响吗？\n- 自变量 x 和因变量 y 的值如下所示：\n  求最小二乘回归线 y=ax+b。估算\
    \ x 为 10 时 y 的值。\n- 结合例子解释 K 近邻技术。\n\n"
