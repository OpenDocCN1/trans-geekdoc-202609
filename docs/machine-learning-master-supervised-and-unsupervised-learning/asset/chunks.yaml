    \    hiddengrad = derivatives_sigmoid(hlayer_act)\n    # 隐藏层权重对误差的贡献程度\n    d_hiddenlayer\
    \ = EH \\* hiddengrad\n    wout += hlayer_act.T.dot(d_output) \\*lr\n    # 下一层误差与当前层输出的点积\n\
    \    bout += \\*lr\n    wh += X.T.dot(d_hiddenlayer) \\*lr\n    #bh += np.sum(d_hiddenlayer,\
    \ axis=0,keepdims=True) \\*lr\n    \\n\" \\+ str(X))\nOutput: \\n\" \\+ str(y))\n\
