    # Bellman Equations


    Richard Bellman was an American applied mathematician who derived the Bellman
    equation which allowed us to start solving MDPs. Bellman equation is the basic
    block of solving reinforcement learning and is omnipresent in RL. It helps us
    to solve MDP. Here, to solve means finding the optimal policy and value functions.


    Bellman functions allow us to write an equation that will represent our state-value
    function as a recursive relationship between the value of a state and the value
    of its successor states. Mathematically we can define Bellman Expectation Equation
    as:


    ```

    v(s) = E[R_{t+1} + γ v(S_{t+1})] ……………….. (1)

    ```


    ## Bellman Equation for Value Function (State-Value Function)


    From the above-mentioned equation (1), we can see that the value of a state can
    be decomposed into an immediate reward (`R[t+1]`) plus the value of a successor
    state (`v[S(t+1)]`) with a discount factor (`γ`). This still stands for Bellman
    Expectation Equation. But now what we are doing is we are finding the value of
    a particular state subjected to some policy(`π`). This is the difference between
    the Bellman Equation and the Bellman Expectation Equation.


    The above equation tells us that the value of a particular state is determined
    by the immediate reward plus the value of successor states when we are following
    a certain policy(`π`).


    Similarly, we can express our state-action value function (Q-Function) as follows:


    ```

    q(s,a) = E[R_{t+1} + γ q(S_{t+1}, A_{t+1})] ……………..(2)

    ```


    ## Bellman Expectation Equation for State-Action Value Function (Q-Function)


    Let us call this equation (2). From the above equation, we can see that the State-Action
    Value of a state can be decomposed into the immediate reward we get on performing
    a certain action in state(`s`) and moving to another state(`s''`) plus the discounted
    value of the state-action value of the state(`s''`) for some action(`a`) our agent
    will take from that state on-wards.


    ## Going Deeper into Bellman Expectation Equation


    First, let us understand the Bellman Expectation Equation for State-Value Function
    with the help of a backup diagram.


    ![Figure 5.2: Backup Diagram for State-Value Function](image-7wj5iv7w.jpg)


    Figure 5.2 describes the value of being in a particular state. From the state
    there is some probability that we take both the actions. There is a Q-value (State-action
    value function) for each of the actions. We average the Q-values which tells us
    how good it is to be in a particular state. It defines `Vπ(s)`. [Look at Equation
    1]


    Mathematically, we can define it as follows:


    ![Value of being in a state](image-dnok7zsf.jpg)


    Equation (3) also tells us the connection between the State-Value function and
    State-Action Value Function.


    Now, let us look at the backup diagram for State-Action Value Function:


    ![Figure 5.3: Backup Diagram for State-action Value Function](image-lxr4skb3.jpg)


    Figure 5.3 shows that suppose we start by taking some action(`a`). Because of
    the action(`a`) the agent might be blown to any of these states by the environment.
    Therefore, we are asking, how good it is to take an action(`a`)?


    We again average the state-values of both the states, added with an immediate
    reward which tells us how good it is to take a particular action(`a`). This defines
    our `Qπ(s,a)`.


    Mathematically, we can define this as follows:


    ![Equation (4) defines how good it is to take a particular action (a) in state(s).
    Where P is the transition probability.](image-x57fn2qy.jpg)


    Now let us stitch these backup diagrams to define the State-Value Function, `Vπ(s)`:


    ![Figure 5.4: Backup Diagram for State-Value Function](image-xsi5esd5.jpg)


    Figure 5.4 shows if our agent is in some state(`s`) and from that state suppose
    our agent can take two actions due to which the environment might take our agent
    to any of the states(`s''`). Note that the probability of the action our agent
    might take from state ''s'' is weighted by our policy and after taking that action
    the probability that we land in any of the states(`s''`) is weighted by the environment.


    Now the question is, how good it is to be in state(`s`) after taking some action
    and landing on another state(`s''`) and following our policy(`π`) after that?


    It is like what we have done before; we are going to average the value of successor
    states(`s''`) with some transition probability (`P`) weighted with our policy.


    Mathematically, we can define the State-Value function for being in state S in
    Backup Diagram as follows:


    ![State-Value function for being in state S](image-s78hi97p.jpg)


    Now, let us do the same for the State-Action Value Function, `Qπ(s,a)`:


    ![Figure 5.5: Backup Diagram for State-Action Value Function](image-txlbla43.jpg)


    It is like what we did in the State-Value Function but just it is inverse. Figure
    5.5 tells us that our agent takes some action(`a`) because of which the environment
    might land us on any of the states(`s`), then from that state we can choose to
    take any actions(`a''`) weighted with the probability of our policy(`π`). Again,
    we average them together and that gives us how good it is to take a particular
    action following a particular policy(`π`) all along.


    Mathematically, the State-Action Value Function from the backup diagram can be
    expressed as follows:


    ![State-Action Value Function from backup diagram](image-p3o8rxhr.jpg)


    So, this is how we can formulate Bellman Expectation Equation for a given MDP
    to find its State-Value Function and State-Action Value Function.


    # Monte Carlo Methods


    Any method which takes care of an issue by producing reasonable random numbers
    and seeing that fraction of numbers complying with some property or properties
    can be named a Monte Carlo technique. Monte Carlo techniques require experiences
    like the example arrangements of states, actions, and rewards from on-line or
    communication with an environment. Gaining from the online experience is striking
    since it requires no prior information on the environment''s elements yet can
    at present accomplished ideal conduct. Learning from simulated experience is likewise
    amazing.


    Monte Carlo methods are ways of solving the reinforcement learning problem based
    on averaging sample returns. To guarantee that well-defined returns are available,
    we characterize Monte Carlo strategies just for episodic tasks. That is, we accept
    that experience is separated into episodes, and that all episodes eventually terminate
    no matter what actions are chosen. It is just upon the culmination of an episode
    that the value estimates and policies are changed. Monte Carlo strategies are
    in this manner incremental in an episode-by-episode sense, yet not in a step-by-step
    sense. The term is often used more broadly for any estimation method whose activity
    includes a significant random component.

    '
