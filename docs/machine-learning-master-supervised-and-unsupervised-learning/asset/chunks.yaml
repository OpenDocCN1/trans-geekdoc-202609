    - 分类数据项\n- 聚类数据项\n\n**以下哪项是无监督学习的应用？**\n\n- 聚类\n- 异常检测\n- 神经网络\n- 以上全部\n\n**关于聚类，选择一个正确的陈述：**\n\
    \n- 聚类是一种无监督 ML 技术\n- 聚类是一种有监督 ML 技术\n- 标记数据用于聚类技术\n- 以上全部正确\n\n**在 K 均值聚类算法中，k\
