  fmt: '

    # Supervised versus Unsupervised Learning


    Most of the statistical-based learning algorithms are categorized into two categories:
    supervised learning algorithms and unsupervised learning algorithms. The example
    discussed earlier in this chapter is a suitable example of supervised learning.
    It is referred to as supervised machine learning because the algorithm''s learning
    process uses a training dataset; in other words, the process is done under the
    supervision of a supervisor. The algorithm learns the prediction in the training
    process, and corrections are made by the teacher. The learning process continues
    until it achieves acceptable performance.


    Supervised learning is further divided into two categories: regression and classification,
    which we will discuss later in this chapter. Popular machine learning algorithms
    include classification, support vector machine, and linear regression.


    Unsupervised learning algorithms are those where you have input values or input
    data but no corresponding output variables. The main aim of the unsupervised learning
    technique is to understand the structure or distribution of the data; these algorithms
    help learners understand more about the data. In unsupervised learning, there
    is no concept of teachers. Algorithms have their own choice to learn and explore
    the data. Suitable examples of unsupervised learning are clustering and association
    problems. Popular algorithms include k-means clustering, PCA, and independent
    component analysis.


    # Regression versus Classification


    Classification-related problems are used to find the function that can divide
    the available dataset into different categories according to its parameters. In
    the classification process, algorithms are trained on the training dataset and
    can categorize the data into different classes. On the other hand, regression
    is the process of finding the correlation between dependent and independent variables.
    Regression algorithms are used for the prediction of house prices, stock predictions,
    weather forecasting, and so on.


    # Feature Selection


    With the rapid development of big data, we have more access to high-dimensional
    datasets, which has also improved the performance of most machine learning algorithms.
    However, much data collected from different sensors is corrupted, noisy, and sometimes
    useless. These types of data sometimes influence the accuracy and computational
    speed of the model. Hence, the selection of useful data or features is always
    a cumbersome task for any machine learning algorithm. Useful and effective features
    always improve the accuracy of the model and increase model interpretability.
    Keeping this in mind, feature selection algorithms always play an important role
    in the statistical learning-based approach.


    Feature selection is also referred to as variable selection, attribute selection,
    or subset selection. It is a process by which the data scientist automatically
    selects relevant or useful features for use in statistical-based learning methods.
    The feature selection algorithm selects the most suitable features from the pool
    of features, which can help reduce prediction time and improve prediction accuracy.


    The feature selection approach can be explained in two steps:


    1.  Combination of different search techniques that add new feature subsets.

    2.  The evaluation process measures the score of different feature subsets.


    This could be computationally expensive because selecting the best subset of features
    from the available features is always challenging. Keeping this in mind, feature
    selection approaches are categorized into different categories. We will now explore
    the different methods and techniques that make the selection process easier, simpler,
    faster, and more reliable.


    Here are some feature selection approaches:


    *   Filter

    *   Wrapper

    *   Embedded methods


    ## Filters


    In this method, irrelevant attributes or redundant columns are filtered out. We
    can choose a single statistical measure suitable for the whole dataset. The module
    calculates the feature score for each column, and then the column returns its
    value by its feature score. Choosing the right feature may improve the accuracy
    and efficiency of the model. The selection of the best feature does not depend
    on any machine learning algorithm. Features can be selected according to their
    score in numerous statistical tests that suit the particular dataset. The various
    statistical test methods based on categorical or continuous data are:


    ### Pearson Correlation


    The Pearson correlation method measures the quantifying linear independence between
    two continuous variables `x` and `y`. The value can vary from `-1` to `+1`. It
    is shown as:


    ```

    ![](image-hquaxwhc.jpg)

    ```


    It is calculated by taking the covariance of the two variables and then dividing
    it by the product of the standard deviation. If the scale of the two variables
    changes, it does not affect the coefficient value.


    ### Chi-squared


    This is another statistical method used to measure how much the expected values
    are closer to the actual values. In this method, we assume that variables are
    random variables drawn from an adequate sample of independent variables.


    ### Linear Discriminant Analysis (LDA)


    `LDA` is used to find the linear combination of features that categorizes the
    feature into different classes. It is suitable for categorical data.


    ### Analysis of Variance (ANOVA)


    This method is similar to `LDA` but uses one dependent feature and one categorical
    independent feature. It is suitable for finding if several groups are equal or
    not.


    ## Wrappers


    In the wrapper method, the feature selection method is based on machine learning
    algorithms. This method follows a greedy search approach in which it tries to
    evaluate the performance of all possible combinations of features according to
    various evaluation criteria. Evaluation criteria are performance metrics that
    always depend on the type of problem. For example, for classification, the evaluation
    parameters are accuracy, precision, and recall. For regression, the evaluation
    parameters are p-values and r-squared. Finally, wrappers select the best combination
    of features that yields optimal results. The procedure is depicted in the figure
    below.


    ```

    ![](image-5a9io0jj.jpg)

    ```


    **Figure 4.4:** Flow chart of wrappers method


    The different types of wrapper methods are forward feature selection, backward
    feature elimination, bidirectional search, exhaustive feature selection, and so
    on.


    ## Embedded Methods


    Embedded methods complete the feature selection process within the construction
    of machine learning algorithms. In other words, the feature selection process
    is done during the training of the model, which is why it is called "embedded".
    The advantage of an embedded method is that classification and selection of features
    are done at the same time; for that reason, they are less computationally expensive.
    The different types of embedded methods are `L1 regularization`, `L2 regularization`,
    and `L1/L2 regularization`. These methods will be discussed later in this chapter.


    # Model Selection


    Model selection is a technique for selecting the best model suitable for a particular
    dataset or application. Generally, the test dataset consists of those points not
    seen by the model in the training phase. There are different types of model selection
    methods which we will discuss now.

    '
  trans: '


    # 监督学习与无监督学习


    大多数基于统计的学习算法分为两类：监督学习算法和无监督学习算法。本章前面讨论的示例是监督学习的一个合适例子。之所以称为监督机器学习，是因为算法的学习过程使用了训练数据集；换句话说，该过程是在监督者的监督下完成的。算法在训练过程中学习预测，并由教师进行纠正。学习过程持续进行，直到达到可接受的性能。


    监督学习进一步分为两类：回归和分类，我们将在本章后面讨论。流行的机器学习算法包括分类、支持向量机和线性回归。


    无监督学习算法是指你拥有输入值或输入数据，但没有相应的输出变量。无监督学习技术的主要目的是理解数据的结构或分布；这些算法帮助学习者更多地了解数据。在无监督学习中，不存在教师的概念。算法自行选择学习和探索数据。无监督学习的合适示例包括聚类和关联问题。流行的算法包括
    k-means 聚类、PCA 和独立成分分析。


    # 回归与分类


    与分类相关的问题用于寻找能够根据参数将可用数据集划分为不同类别的函数。在分类过程中，算法在训练数据集上进行训练，并能将数据归入不同的类别。另一方面，回归是寻找因变量和自变量之间相关性的过程。回归算法用于房价预测、股票预测、天气预报等。


    # 特征选择


    随着大数据的快速发展，我们能够获取更多高维数据集，这也提高了大多数机器学习算法的性能。然而，从不同传感器收集的大量数据往往是损坏的、嘈杂的，有时甚至是无用的。这些类型的数据有时会影响模型的准确性和计算速度。因此，选择有用的数据或特征对于任何机器学习算法来说始终是一项繁琐的任务。有用且有效的特征总能提高模型的准确性并增强模型的可解释性。考虑到这一点，特征选择算法在基于统计学习的方法中始终发挥着重要作用。


    特征选择也称为变量选择、属性选择或子集选择。它是数据科学家自动选择相关或有用特征以用于基于统计的学习方法的过程。特征选择算法从特征池中选择最合适的特征，这有助于减少预测时间并提高预测准确性。


    特征选择方法可以分两步解释：


    1.  添加新特征子集的不同搜索技术的组合。

    2.  评估过程测量不同特征子集的得分。


    这在计算上可能代价高昂，因为从可用特征中选择最佳特征子集始终具有挑战性。考虑到这一点，特征选择方法被分为不同的类别。我们现在将探讨使选择过程更简单、更快捷、更可靠的不同方法和技术。


    以下是一些特征选择方法：


    *   过滤法

    *   包装法

    *   嵌入法


    ## 过滤法


    在此方法中，会过滤掉不相关的属性或冗余的列。我们可以选择一个适合整个数据集的单一统计度量。模块计算每列的特征得分，然后列根据其特征得分返回其值。选择正确的特征可能会提高模型的准确性和效率。最佳特征的选择不依赖于任何机器学习算法。可以根据适合特定数据集的众多统计检验中的得分来选择特征。基于分类或连续数据的各种统计检验方法包括：


    ### 皮尔逊相关系数


    皮尔逊相关系数方法衡量两个连续变量 `x` 和 `y` 之间线性独立性的量化程度。其值范围从 `-1` 到 `+1`。公式如下：


    ```

    ![](img/image-hquaxwhc.jpg)

    ```


    它是通过计算两个变量的协方差，然后除以标准差的乘积来计算的。如果两个变量的尺度发生变化，不会影响系数值。


    ### 卡方检验


    这是另一种统计方法，用于衡量期望值与实际值的接近程度。在此方法中，我们假设变量是从充分的独立变量样本中抽取的随机变量。


    ### 线性判别分析 (LDA)


    `LDA` 用于寻找将特征分类为不同类别的特征线性组合。它适用于分类数据。


    ### 方差分析 (ANOVA)


    此方法类似于 `LDA`，但使用一个因变量和一个分类自变量。它适用于判断多个群体是否相等。


    ## 包装法


    在包装法中，特征选择方法基于机器学习算法。此方法遵循贪心搜索方法，尝试根据各种评估标准评估所有可能的特征组合的性能。评估标准是性能指标，始终取决于问题类型。例如，对于分类，评估参数是准确率、精确率和召回率。对于回归，评估参数是
    p 值和 R 平方。最后，包装法选择产生最佳结果的特征组合。该过程如下图所示。


    ```

    ![](img/image-5a9io0jj.jpg)

    ```


    **图 4.4：** 包装法流程图


    包装法的不同类型包括前向特征选择、后向特征消除、双向搜索、穷举特征选择等。


    ## 嵌入法


    嵌入法在机器学习算法的构建过程中完成特征选择过程。换句话说，特征选择过程在模型训练期间进行，这就是为什么它被称为“嵌入式”。嵌入法的优势在于分类和特征选择同时进行；因此，它们的计算开销较小。嵌入法的不同类型包括
    `L1 正则化`、`L2 正则化` 和 `L1/L2 正则化`。这些方法将在本章后面讨论。


    # 模型选择


    模型选择是选择适合特定数据集或应用的最佳模型的技术。通常，测试数据集由模型在训练阶段未见过的数据点组成。有不同类型的模型选择方法，我们现在将进行讨论。


    '
