  fmt: "\n# Experiment No. 6\n\n## AIM\n\nAssuming a set of documents that need to\
    \ be classified, use the naïve Bayesian Classifier model to perform this task.\
    \ Built-in Java classes/API can be used to write the program. Calculate the accuracy,\
    \ precision, and recall for your data set.\n\n## Naive Bayes Algorithms for Learning\
    \ and Classifying Text\n\n**Examples** is a set of text documents along with their\
    \ target values. **V** is the set of all possible target values. This function\
    \ learns the probability terms **P** describing the probability that a randomly\
    \ drawn word from a document in class will be the English word. It also learns\
    \ the class prior probabilities.\n\n1. Collect all words, punctuation, and other\
    \ tokens that occur in **Examples**.\n2. **Vocabulary** ← the set of all distinct\
    \ words and other tokens occurring in any text document from **Examples**.\n3.\
    \ Calculate the required probability terms.\n4. For each target value in **V**\
    \ do:\n   - The subset of documents from **Examples** for which the target value\
    \ is **vj**.\n   - **P(vj)** ← |**Examples**| / |**Examples**|.\n   - **Textj**\
    \ ← a single document created by concatenating all members of **Examples**.\n\
    \   - **n** ← total number of distinct word positions in **Textj**.\n   - For\
    \ each word in **Vocabulary**:\n     - **nk** ← number of times word occurs in\
    \ **Textj**.\n     - **P(wk | vj)** ← ( **nk** + 1 ) / ( **n** + |**Vocabulary**|\
    \ ).\n\n## Training Dataset\n\n**ML6.CSV**\n\n## Program\n\n```python\nimport\
    \ pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.feature_extraction.text\
    \ import CountVectorizer\nfrom sklearn.naive_bayes import MultinomialNB\nfrom\
    \ sklearn import metrics\n\n# dimensions of the dataset\nmsg = pd.read_csv('ML6.CSV',\
    \ names=['message', 'label'])\nprint(\"The dimensions of the dataset\", msg.shape)\n\
    \nX = msg.message\ny = msg.labelnum\n\n# splitting the dataset into train and\
    \ test data\nxtrain, xtest, ytrain, ytest = train_test_split(X, y)\nprint(\"The\
    \ total number of Training Data:\", xtrain.shape)\nprint(\"The total number of\
    \ Test Data:\", xtest.shape)\n\n# output of count vectoriser is a sparse matrix\n\
    cv = CountVectorizer()\nxtrain_dtm = cv.fit_transform(xtrain)\nxtest_dtm = cv.transform(xtest)\n\
    \n# The words or Tokens in the text documents\ndf = pd.DataFrame(xtrain_dtm.toarray(),\
    \ columns=cv.get_feature_names())\n# sparse matrix representation\n\n# Training\
    \ Naive Bayes (NB) classifier on training data.\nclf = MultinomialNB().fit(xtrain_dtm,\
    \ ytrain)\npredicted = clf.predict(xtest_dtm)\n\n# printing accuracy, Confusion\
    \ matrix, Precision and Recall\nprint(\"The Accuracy of classifier:\", metrics.accuracy_score(ytest,\
    \ predicted))\nprint(\"Confusion matrix:\")\nprint(metrics.confusion_matrix(ytest,\
    \ predicted))\nprint(\"The value of Precision:\", metrics.precision_score(ytest,\
    \ predicted))\nprint(\"The value of Recall:\", metrics.recall_score(ytest, predicted))\n\
    ```\n\n## Output\n\nThe dimensions of the dataset (18, 2)\nThe total number of\
