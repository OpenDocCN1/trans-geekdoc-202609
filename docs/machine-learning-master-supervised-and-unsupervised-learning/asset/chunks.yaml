    \ Hierarchical Clustering    These algorithms can build the hierarchy of clusters.\
    \ In the beginning, the data is assigned to the nearest cluster, and if two clusters\
    \ are close to each other then they will be merged. This algorithm will end if\
    \ there is only one cluster left.  "
