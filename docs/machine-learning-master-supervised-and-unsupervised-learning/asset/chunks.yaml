    # Classification


    Classification is the process to group the output into different classes based
    on one or more input variables. Classification is used when the value of the output
    variable is discrete or categorical, such as email is spam or not spam, and 0
    or 1, and so on.


    If the algorithm tries to classify input variables into two different classes,
    it is called **binary classification** such as email is spam or not spam. When
    the algorithm tries to classify input variables into more than two classes, it
    is called **multiclass classification** such as handwritten character recognition
    where classes go from 0 to 9. Figure 2.8 shows the classification example with
    a message if an email is a spam or not spam:


    ![](image-vcrppyuf.jpg)

    **Figure 2.8: Example of Classification**


    # Naïve Bayes classifier algorithm


    Naive Bayes classifiers are a group of classification algorithms that are based
    on Bayes'' Theorem. It is a family of algorithms that shares a common principle,
    namely that every pair of the characteristics being classified is independent
    of each other.


    The Naïve Bayes algorithm is a supervised learning algorithm that solves classification
    problems and is based on the Bayes theorem. It is primarily used in text classification
    with a large training dataset. The Naïve Bayes Classifier is a simple and effective
    Classification algorithm that aids in the development of fast machine learning
    models capable of making quick predictions. It is a probabilistic classifier,
    which ensures it predicts based on an object''s probability. Spam filtration,
    Sentimental analysis, and article classification are some popular applications
    of the Naïve Bayes Algorithm.


    For example, if a fruit is red, round, and about 3 inches in diameter, it is classified
    as an apple. Even if these features are dependent on each other or on the presence
    of other features, all of these properties independently contribute to the likelihood
    that this fruit is an apple, which is why it is called **Naïve**.


    The Naive Bayes model is simple to construct and is especially useful for very
    large data sets. In addition to its simplicity, Naive Bayes has been shown to
    outperform even the most sophisticated classification methods.


    ## Why is it called Naïve Bayes?


    The Naive Bayes algorithm is made up of the words Naive and Bayes, which can be
    interpreted as:


    - It is called **Naïve** because it assumes that the occurrence of one feature
    is unrelated to the occurrence of others. For example, if the fruit is identified
    based on color, shape, and taste, then a red, spherical, and sweet fruit is identified
    as an apple. As a result, each feature contributes to identifying it as an apple
    without relying on the others.

    - It is known as **Bayes** because it is based on the principle of Bayes'' Theorem.


    ## Principle of Naive Bayes Classifier


    A Naive Bayes classifier is a type of probabilistic machine learning model that
    is used to perform classification tasks. The classifier''s crux is based on the
    Bayes theorem. The Bayes theorem allows us to calculate the posterior probability
    `P(c|x)` from `P(c)`, `P(x)`, and `P(x|c)`. Consider the following equation:


    ![](image-pg613qrb.jpg)


    Where:


    - Posterior probability of class `c` (target) given predictor `x` (attributes)
    - `P(c|x)`

    - The prior probability of class - `P(c)`

    - The likelihood which is the probability of predictor given class - `P(x|c)`

    - The prior probability of predictor - `P(x)`


    ## Working of Naïve Bayes'' Classifier


    The following steps demonstrate how the Naive Bayes'' Classifier works:


    1. Convert the given dataset into frequency tables.

    2. Create a likelihood table by calculating the probabilities of the given features.

    3. Use Bayes theorem to calculate the posterior probability.


    ## Naive Bayes Example


    The weather training data set and corresponding target variable are shown in Figure
    2.9. We must now categorize whether or not players will play based on the weather.


    1. Make a frequency table out of the data set.

    2. Make a likelihood table by calculating probabilities such as overcast probability
    and probability of playing.


    ![](image-u7b6awie.jpg)

    **Figure 2.9: Weather training data set and corresponding frequency and likelihood
    table**


    3. Calculate the posterior probability for each class using the Naive Bayesian
    equation. The outcome of prediction is the class with the highest posterior probability.


    Naive Bayes employs a similar method to predict the likelihood of various classes
    based on various attributes. This algorithm is commonly used in text classification
    and multi-class problems.


    ## Types of Naïve Bayes


    The Naive Bayes Model is classified into three types, which are listed as follows:


    ### Gaussian Naïve Bayes


    The Gaussian model is based on the assumption that features have a normal distribution.
    This means that if predictors take continuous values rather than discrete values,
    the model assumes these values are drawn from the Gaussian distribution.


    ### Multinomial Naïve Bayes


    When the data is multinomially distributed, the Multinomial Naive Bayes classifier
    is used. It is primarily used to solve document classification problems, indicating
    which category a particular document belongs to, such as sports, politics, education,
    and so on. The predictors of the classifier are based on the frequency of words.


    ### Bernoulli Naïve Bayes


    The Bernoulli classifier operates similarly to the multinomial classifier, except
    that the predictor variables are independent Boolean variables. For example, whether
    or not a specific word appears in a document. This model is also well-known for
    performing document classification tasks.


    ## Advantages and disadvantages of Naïve Bayes


    Following are the advantages:


    - Easy and fast algorithm to predict a class of datasets.

    - Used for binary as well as multi-class classifications.

    - When compared to numerical variables, it performs well with categorical input
    variables.

    - It is the most widely used test for text classification problems.


    Following are the disadvantages:


    - Naive Bayes is based on the assumption that all predictors (or features) are
    independent.

    - The **Zero Frequency Problem** is confronted by this algorithm.


    ## Applications of Naïve Bayes Algorithms


    Following are the applications of Naïve Bayes Algorithms:


    - Text classification

    - Spam Filtering

    - Real-time Prediction

    - Multi-class Prediction

    - Recommendation Systems

    - Credit Scoring

    - Sentiment Analysis


    # Decision Tree


    A decision tree is a supervised learning technique that can be applied to classification
    and regression problems. Decision trees are designed to mimic human decision-making
    abilities, making them simple to understand. Because the decision tree has a tree-like
    structure, the logic behind it is easily understood.


    ## Decision-tree working


    Following steps are involved in the working of Decision-tree:


    1. Begin the tree with node `T`, which contains the entire dataset.

    2. Using the Attribute Selection Measure, find the best attribute in the dataset.

    3. Divide the `T` into subsets that contain the best possible values for the attributes.

    4. Create the decision tree node with the best attribute.

    5. Make new decision trees recursively using the subsets of the dataset created
    in step 3.

    6. Continue this process until you reach a point where you can no longer classify
    the nodes and refer to the final node as a leaf node.


    ## General


    Following is the general decision tree structure shown in Figure 2.10:


    ![](image-7vx4p39e.jpg)

    **Figure 2.10: General Decision Tree structure**


    A decision tree can contain both categorical (Yes/No) and numerical data.

    '
