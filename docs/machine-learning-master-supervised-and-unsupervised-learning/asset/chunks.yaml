- raw: "  Binary Logistic Regression    The target variable or dependent variable\
    \ in binary logistic regression is binary in nature, meaning it has only two possible\
    \ values.    There are only two possible outcomes for the categorical response.\
    \    For example, determining whether or not a message is a spam.  \n\n  Multinomial\
    \ Logistic Regression    In a multinomial logistic regression, the target variable\
    \ can have three or more values, but there is no fixed order of preference for\
    \ these values.    For instance, the most popular type of food (Indian, Italian,\
    \ Chinese, and so on.)    Predicting which food is preferred more is an example\
    \ (Veg, Non-Veg, Vegan).  \n\n  Ordinal Logistic Regression    The target variable\
    \ in ordinal logistic regression has three or more possible values, each of which\
    \ has a preference or order.    For instance, restaurant star ratings range from\
    \ 1 to 5, and movie ratings range from 1 to 5\\.  \n\n  Examples    The following\
    \ are some of the scenarios in which logistic regression can be used.     Weather\
    \ Prediction regression is used to make weather predictions. We use the information\
    \ from previous weather reports to forecast the outcome for a specific day. However,\
    \ logistic regression can only predict categorical data, such as whether it will\
    \ rain or not.    Determining Illness: We can use logistic regression with the\
    \ help of the patient's medical history to predict whether the illness is positive\
    \ or negative.  \n\n  Support Vector Machine (SVM) Algorithm    The Support Vector\
    \ Machine, or SVM, is a popular Supervised Learning algorithm that can be used\
    \ to solve both classification and regression problems. However, it is primarily\
    \ used in machine learning for classification problems as shown in Figure    Many\
    \ people prefer SVM because it produces significant accuracy while using less\
    \ computing power. The extreme points/vectors that help create the hyperplane\
    \ are chosen by SVM. Support vectors are the extreme cases hence the algorithm\
    \ is called a Support Vector    ![](image-8npnxnlx.jpg)  Figure 2\\. 18: Support\
    \ Vector Machine (SVM) concept    The support vector machine algorithm's goal\
    \ is to find a hyperplane in N-dimensional space (N \\- the number of features)\
    \ that categorizes the data points clearly.    ![](image-1vdx8ooq.jpg)  Figure\
    \ 2.19: SVM hyperplanes with Maximum margin    There are numerous hyperplanes\
    \ to choose from to separate the two classes of data points. Our goal is to find\
    \ a plane with the greatest margin, or the greatest distance between data points\
