    # The architecture of content-based filtering


    Content-based Filtering systems require appropriate techniques for representing
    items and creating the user profile, as well as some strategies for comparing
    the user profile to the item representation. Figure 6.6 depicts the architecture
    of a content-based recommended system. The recommendation process is divided into
    three steps, each of which is handled by a different component:


    ![Figure 6.6: Architecture of Content-based filtering](image-biqwx13s.jpg)


    ## Content


    The component''s primary responsibility is to represent the content of items (e.g.,
    documents, web pages, news, product descriptions, etc.) derived from information
    sources in a format suitable for subsequent processing steps. Feature extraction
    techniques are used to analyze data items. This representation serves as the input
    for the profile learner and filtering component.


    ## Profile


    To construct the user profile, this module collects data representative of the
    user''s preferences and attempts to generalize this data. Typically, the generalization
    strategy is implemented using machine learning techniques, which can infer a model
    of user interests based on items liked or disliked in the past. For example, a
    web page recommender''s profile learner can use a relevance feedback method in
    which the learning technique combines vectors of positive and negative examples
    into a prototype vector representing the user profile. Web pages that have received
    positive or negative feedback from users serve as training examples.


    ## Filtering


    This module uses the user profile to suggest relevant items by comparing the profile
    representation to the representation of the items to be recommended. The result
    is a binary or continuous relevance judgment, with the latter producing a ranked
    list of potentially interesting items.


    The content analyzer, which typically borrows techniques from information retrieval
    systems, performs the first step in the recommendation process. Item descriptions
    from the information source are processed by the content analyzer, which extracts
    features from unstructured text to create a structured item representation, which
    is then saved in the repository represented items.


    To build and update the profile of the active user (the user for whom recommendations
    must be provided), her reactions to items are collected in some way and recorded
    in the repository feedback. These reactions, known as annotations or feedback,
    along with the related item descriptions, are used to train a model that can predict
    the actual relevance of newly presented items. Users can also define their areas
    of interest explicitly as an initial profile without providing feedback.


    Typically, there are two types of relevant feedback: positive information (inferring
    features liked by the user) and negative information (i.e., inferring features
    the user is not interested in). For recording user feedback, two different techniques
    can be used. When a system requires the user to explicitly evaluate items, this
    technique is known as **explicit feedback**. The other technique, known as **implicit
    feedback**, does not require any active user involvement in the sense that feedback
    is derived from monitoring and analyzing the user''s activities.


    # Advantages of content-based filtering


    When compared to the collaborative paradigm, adopting the content-based filtering
    paradigm has several advantages.


    ## User


    Content-based recommenders rely solely on ratings provided by the active user.


    ## Interpretations


    Interpretations on how the recommended system works can be presented by explicitly
    listing the content features or descriptions that resulted in an item appearing
    in the list of recommendations. These characteristics are indicators to consider
    when deciding whether to trust a recommendation.


    ## New


    Content-based recommended systems can recommend items that have not yet been rated
    by any user. As a result, they do not suffer from the first-rate problem, which
    affects collaborative recommenders that make recommendations solely based on user
    preferences.


    # Drawbacks of content-based filtering


    Following are the disadvantages:


    ## Limited Content


    Content-based techniques have a natural limit in terms of the number and type
    of features that can be associated with the objects they recommend, whether automatically
    or manually. Domain knowledge is frequently required, for example, for movie recommendations,
    the system must know the actors and directors, and domain ontologies are sometimes
    required. No content-based recommendation system can provide appropriate suggestions
    if the analyzed content lacks sufficient information to distinguish between items
    the user likes and items the user does not like.


    ## Serendipity Problem


    There is no inherent method for finding something unexpected in content-based
    recommended systems. The system suggests items whose scores are high when compared
    to the user profile, so the user will be recommended items similar to those already
    rated. This disadvantage is also known as the serendipity problem because it highlights
    the tendency of content-based systems to produce recommendations with a limited
    degree of novelty.


    ## New User Problem


    A sufficient number of ratings must be collected before a content-based recommended
    system can truly understand user preferences and make accurate recommendations.
    As a result, when there are few ratings available, such as for a new user, the
    system will be unable to provide reliable recommendations.


    # Artificial Neural Network (ANN)


    Artificial Neural Networks are computational models based on the human brain.
    Many recent advances in the field of Artificial Intelligence have been made, including
    voice recognition, image recognition, and robotics using Artificial Neural Networks.
    Artificial Neural Networks are biologically inspired computer simulations that
    perform specific tasks such as clustering, classification, and pattern recognition.


    These biological computing methods are regarded as the next major advancement
    in the technology world. Simply, Artificial Neural Networks are software implementations
    of human brain neural structures. A neural network (ANN) is a computational system
    that is influenced by the structure, processing capability, and learning ability
    of the human brain.


    Let us look at the structure of our brain instead of delving into its complex
    biology. The human brain is made up of billions of neurons that function as organic
    switches. All of these neurons are linked together to form a massive and complex
    structure known as a **Neural Network**. A single neuron''s output is dependent
    on inputs from thousands of interconnected neurons.


    This brain behavior is critical to Artificial Neural Networks, which simply try
    to replicate the brain''s action. This can be explained as follows:


    ## Supervised ANN


    ## Unsupervised ANN


    # Supervised ANN


    A matched input and output sample of data is provided to the network for training
    in supervised ANN. The goal of this approach is to obtain the desired output for
    a given input.


    The spam filters in our e-mails are an excellent example of a supervised ANN.
    At the level of training, the Artificial Neural Network engine would be fed a
    set of words from the body of the e-mail. The output classifies the e-mail as
    spam or not spam.


    # Unsupervised ANN


    Unsupervised ANNs are more complex than supervised ANNs because they attempt to
    teach the ANN to understand the data structure provided as input on its own.


    The biological neuron''s connections are represented as weights. A positive weight
    indicates an excitatory connection, while a negative weight indicates an inhibitory
    connection. All inputs are weighted and added together. This activity is known
    as a **linear combination**. Finally, an activation function regulates the output
    amplitude. For example, an acceptable output range is usually between 0 and 1,
    but it could also be between -1 and 1.

