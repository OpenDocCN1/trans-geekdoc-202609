    # Regression metrics


    Classification models have discrete output variables whereas regression models
    provide a continuous output variable. Hence there are different ways of evaluating
    the performance of the regression model which we will discuss further.


    ## Mean Squared Error or MSE


    MSE is used to calculate the difference between the actual value and the predicted
    value, it squares the error value and finally, it provides the mean of all the
    errors. It can be represented as:


    ```

    ![](image-s78nk8de.jpg)

    ```


    ## Root Mean Squared Error or RMSE


    RMSE is the root value of MSE and it is helpful to reduce the scale of the error
    and tries to keep the value closer to the actual value.


    ## Mean Absolute Error or MAE


    MAE is the mean of the absolute error values. If we want to ignore the outlier
    values to a certain degree then MAE can be the right choice as it can reduce the
    penalty of the outliers significantly with the removal of the square terms.


    ```

    ![](image-g7jrw42w.jpg)

    ```


    ## Root Mean Squared Log Error or RMSLE


    It is the same as RMSE except for the log function along with the actual and predicted
    values.


    ```

    ![](image-qtp3954h.jpg)

    ```


    Here `x` represents the actual value and `y` represents the predicted value. These
    metrics help to scale down the effect of the outliers by downplaying the higher
    error rates with the log function.


    # Clustering metrics


    Clustering algorithms are used to predict the group of data points and for clustering-based
    algorithms, distance-based metrics are most useful and effective. Now we will
    discuss some of the clustering metrics:


    ## Dunn Index


    Dunn index metrics are used to identify the clusters which are having low variance.
    It can be calculated using the following formula:


    Here,

    `δ(Xi, Yj) = Distance between Xi and Xj`

    `∆(Xk) = Distance within the cluster Xk`


    If several clusters are more and the dimensions are high then there is the possibility
    of increasing the computation cost.


    ## Silhouette Coefficient


    Silhouette Coefficient tracks how every point in one cluster is close to every
    point in the other clusters in the range of `-1` to `+1`:


    - If silhouette values are closer to `+1` then it indicates that sample points
    of two different clusters are far away.

    - If it is zero then it indicates that the sample points are near to the decision
    boundary.

    - If the silhouette values are closer to `-1` then it indicates that sample points
    are not assigned correctly to the clusters.


    ## Elbow method


    The elbow method is used to determine the number of clusters in a dataset by plotting
    the number of clusters on the x-axis against the percentage of variance explained
    on the y-axis. The point in the x-axis where the curve suddenly bends (the elbow)
    is considered to suggest the optimal number of clusters.


    ```

    ![](image-naou2a07.jpg)

    ```


    Figure 4.6: Representation of Elbow method


    # Statistical learning algorithms


    Statistical learning is a collection of tools that are used to understand different
    data. The tools can be categorized as supervised and unsupervised tools. Supervised
    statistical learning is used to build a statistical model for predicting the output
    using the given input datasets. Supervised statistical learning is used in various
    areas such as medical, business-related applications and public policies, and
    so on. In unsupervised statistical learning, input will be given but there is
    no supervised output and this type of learning is best suitable to understand
    the structure and the relationship between data. For a better understanding of
    statistical learning will discuss various algorithms in detail which is shown
    in Figure


    ```

    ![](image-mi9rh8es.jpg)

    ```


    Figure 4.7: Various categories of machine learning algorithms


    ## Supervised learning


    Supervised machine learning algorithms are used to predict the particular kind
    of values. If we are working with the supervised machine learning algorithms then
    the dataset must be labeled properly. A traditional example of supervised learning
    is email where the data is already classified as ‘spam’ or ‘not spam’. In this
    approach, multiple independent variables are used to determine the values of other
    dependent variables. The performance of the algorithm can be measured by comparing
    the original and predicted results and this is the main advantage of supervised
    machine learning algorithms. The first step of these algorithms is to analyze
    the training dataset and then in the next step find a function that can be helpful
    to understand the new dataset but dataset must be labeled for predictive analysis.
    To understand the overall process you can refer to Figure There are different
    supervised machine learning algorithms that are available which we will discuss
    further and the output will be in one of the forms:


    ```

    ![](image-wugweixh.jpg)

    ```


    Figure 4.8: Overall process of supervised learning


    ### Regression


    Regression is a statistically based approach that establishes a relationship between
    the target and the predictor variable. In other words, regression allows us to
    understand that how the value of the dependent variable is changing when the value
    of the independent variable is fixed. For example, age, salary, house price, temperature,
    and so on. There are different types of regression techniques that we will discuss
    in the next section.


    ```

    ![](image-5za7hkqb.jpg)

    ```


    Figure 4.9: Types of regression


    #### Linear Regression


    Linear regression is a simple regression algorithm that represents the association
    between continuous variables. Continuous variables are nothing but dependent variables
    and independent variables. If there is only one independent variable to predict
    the value of dependent variables then such type of regression is called simple
    linear If a number of input variables are more than one for the prediction of
    the dependent variable values then it is referred to as multiple linear regressions.
    Basically, this method is used for predictive analysis.


    #### Logistic Regression


    This is another method of solving classification based problems. This method helps
    in finding the probability that a new instance belongs to a certain class. Because
    it is related to probability then the output will be either zero or one, true
    or false, and yes or no. When the logistic classifier is used as a binary classifier
    then classes are considered as positive or negative. If the probability value
    is on the higher side (greater than `0.5`) then we will consider class as a positive
    class and if the probability value is low then (less than `0.5`) then we will
    consider class as a negative class. Consider the example of email filtering. Let’s
    assume that benign ham emails fall under the negative class and malignant spam
    emails comes under the positive class. In the beginning, many examples of labeled
    emails are taken and trained the model appropriately so that it can predict the
    class of new email. Suppose we feed a new example to the model and the model returns
    the value between `0≤y≤1`. The value is `0.7`. With this value we can predict
    that there is 70% probability that the new email is spam.


    #### Polynomial Regression


    This is a form of regression analysis. In this model, an association between the
    independent variable `x` and the dependent variable `y` is identified using nth
    degree of the polynomial in `x`. this model helps to fit a non-linear model to
    the data and it is considered as a special case of multiple linear regression.
    Consider the following scenario: suppose we have a dataset and it consists of
    data points that are not linear in fashion. To fit such types of data points linear
    regression is not a good approach. Therefore, here we need polynomial regression.
    In this approach, the original features of the dataset are transformed into polynomial
    features of the given degree and finally modeled using the linear model.

