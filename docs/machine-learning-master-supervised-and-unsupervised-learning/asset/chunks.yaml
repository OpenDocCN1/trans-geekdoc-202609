    向后传播误差通过网络：\n\n### 程序\n\n```python\nimport numpy as np\n\nX =\ny =\nX = # X 数组纵向的最大值\n\
    y = y/100\n\n# Sigmoid 函数\ndef sigmoid\n    return \\+ np.exp(-x)))\n\n# Sigmoid\
    \ 函数的导数\ndef\n    return x \\* \\- x)\n\n# 变量初始化\n# 设置训练迭代次数\n# 设置学习率\ninputlayer_neurons\
    \ = 2 # 数据集中的特征数量\nhiddenlayer_neurons = 3 # 隐藏层神经元数量\noutput_neurons = 1 # 输出层神经元数量\n\
    \n# 权重和偏置初始化\nwh=np.random.uniform(size=(inputlayer_neurons,hiddenlayer_neurons))\n\
    wout=np.random.uniform(size=(hiddenlayer_neurons,output_neurons))\n# 均匀抽取一定范围的随机数，维度为\
    \ x*y\n\n# 前向传播\nfor i in\n    hinp1=np.dot(X,wh)\n    hinp=hinp1 \\+ bh\n   \
    \ hlayer_act = sigmoid(hinp)\n    outinp1=np.dot(hlayer_act,wout)\n    outinp=\
    \ outinp1+ bout\n    output = sigmoid(outinp)\n    EO = y-output\n    outgrad\
