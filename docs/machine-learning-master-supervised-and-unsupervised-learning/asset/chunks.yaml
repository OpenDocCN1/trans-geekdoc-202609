    # Recommended Systems


    Recommended Systems are software tools and techniques that provide recommendations
    for items that may be useful to a user. The recommendations are for various decision-making
    processes, such as what things to buy, what music to listen to, or what online
    news to read. The term refers to what the system recommends to users as a whole.
    An RS typically focuses on a specific type of thing (for example, CDs or news).
    As a result, its design, graphical user interface, and core recommendation technique
    to generate recommendations are all tailored to provide valuable and practical
    recommendations for that specific type of item. RSs are primarily aimed at people
    who lack the personal experience or competence to evaluate the potentially overwhelming
    number of alternative items available on a website. A book recommender system,
    for example, can help users choose a book to read. A popular website uses an RS
    to personalize the online store for each customer. Recommendation systems are
    usually personalized; different users or user groups receive a variety of recommendations.


    Personalized recommendations are presented in their most basic form as ranked
    lists of items. RSs attempt to predict the most appropriate products or services
    based on the user''s preferences and constraints while performing this ranking.


    RS emerged from the observation that people rely on recommendations from others
    while making routine, daily decisions. When choosing a book to read, it is common
    to rely on what one''s peers recommend.


    Recommendations are given for items liked by similar users (those with similar
    tastes). While having options is beneficial, having more options is not always
    preferable—electronic commerce websites are designed to provide recommendations
    based on filtering the entire range of available alternatives. Instead of being
    beneficial, the availability of options began to reduce users'' well-being.


    Recently, RS has proven to be a valuable tool for dealing with information overload.
    Finally, an RS addresses this phenomenon by directing a user to new, unexplored
    items relevant to the user''s current task. RS generate recommendations based
    on various types of knowledge and data about the users, available items, and previous
    transactions stored in the customized databases in response to a user''s request,
    which can be articulated by the user''s context and need, depending on the recommendation
    approach. The user can then scroll through the recommendations. These user actions
    and feedbacks can be saved in the recommender database and can be used to generate
    new recommendations in subsequent user-system interactions. As previously stated,
    research in recommender systems is relatively new when compared to research in
    other traditional information system tools and techniques (for example, databases,
    and search engines).


    ## Importance of recommended systems


    As evidenced by the following facts, interest in the recommender systems has gone
    up significantly:


    - Popular websites such as Amazon and Netflix make extensive use of RS. Many media
    organizations are now incorporating RS into their services.

    - The ACM recommender systems conference is the premier annual event for researchers
    and practitioners of recommender technology. Sessions on RS are frequently included
    in more traditional conferences on databases and information systems.

    - Undergraduate and graduate courses are now entirely dedicated to RS at institutions
    of higher learning.

    - Several special issues of academic journals have been published that cover research
    and development in the field of RS. They are AI Communications, IEEE Intelligent
    Systems, International Journal of Electronic Commerce, International Journal of
    Computer Science and Applications, ACM Transactions on Computer-Human Interaction,
    and ACM Transactions on Information Systems.


    ## Types of recommended systems


    An RS must anticipate that an item is worth recommending to carry out its core
    function of identifying useful items for the user. For example, a popular song,
    that is, something that is liked (high utility) by many users, will most likely
    be liked by a generic user as well. The utility of these popular songs is expected
    to be fairly high for an average user.


    As previously stated, some recommender systems do not fully estimate utility before
    making a recommendation, but they may use heuristics to hypothesize that an item
    is useful to a user. It is also worth noting that the user utility of an item
    has been observed to be dependent on other variables, which we refer to as context.
    For example, the utility of an item for a user can be influenced by the user''s
    domain knowledge (for example, expert vs. beginning digital camera users) or by
    the time when the recommendation is requested.


    The most basic and original implementation of this approach suggests to the active
    user items that other users with similar tastes have liked in the past. The similarity
    in taste between two users is calculated based on the users'' rating history.
    This is why collaborative filtering is referred to as "people-to-people correlation".
    Collaborative filtering is widely regarded as the most popular and widely used
    technique in RS. Key examples are as follows:


    - Amazon: Product recommendations

    - Netflix: Movie and TV show recommendations

    - News websites: Popular news and article recommendations


    There are three types of recommendation approaches as shown in Figure 6.1:


    ### Content-based


    This recommended system uses item attributes. The system learns to recommend items
    that are similar to those that the user has previously liked. The similarity of
    items is calculated using the features of the compared items. For example, if
    a user gives a positive rating to a comedy film, the system can learn to recommend
    other films in that genre.


    ### Collaborative filtering


    This recommended system uses user behaviors (interactions) in addition to the
    item attributes.


    ![Figure 6.1: Different types of recommended systems](image-x7pc6hbl.jpg)


    ### Hybrid


    Hybrid RS is based on the combination of the content-based and collaborative filtering
    recommended systems. A hybrid system that combines techniques A and B attempts
    to use the benefits of A to compensate for the shortcomings of B.


    Collaborative filtering methods, for example, suffer from new-item issues, that
    is, they cannot recommend items with no ratings. This does not limit content-based
    approaches because new item prediction is based on their description (features),
    which are typically readily available. In a temporal context, for example, vacation
    recommendations in winter should be very different from those in summer. Similarly,
    a restaurant recommendation for a Saturday evening with friends should differ
    from the one for a workday lunch with co-workers.

