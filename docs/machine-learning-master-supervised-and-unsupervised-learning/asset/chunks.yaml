    # Preface


    Machine learning is an application of Artificial Intelligence (AI). While AI is
    the umbrella term given to machines emulating human abilities, machine learning
    is a specific branch of AI where machines are trained to learn how to process
    and make use of data. The objective of machine learning is not only for effective
    data collection but also to make use of the ever-increasing amounts being gathered
    by manipulating and analyzing them without heavy human input.


    Machine learning can be defined as a method of mathematical analysis, often using
    well-known and familiar methods, with a different focus than the traditional analytical
    practice in applied subjects. The key idea is that flexible and automated methods
    are used to find patterns within data with a primary focus on making predictions
    for future data.


    There are several real-time applications of machines such as Image Recognition,
    Biometric Recognition, Speech Recognition, Handwriting Recognition, Medical Diagnosis,
    Traffic prediction, Text Retrieval, Product recommendations, Self-driving cars,
    Virtual Personal Assistants, Online Fraud Detection, Natural Language Processing
    and so on.


    Machine Learning paradigms are defined in three types namely Supervised Learning,
    Unsupervised Learning and Reinforcement Learning. Supervised learning algorithms
    are designed to learn by example. It is called supervised learning because the
    process of an algorithm learning from the training dataset can be thought of as
    a teacher supervising the learning process. Unsupervised learning deals with unlabelled
    data which means here we have input data and no corresponding output variable.
    This is further classified into Clustering and Association. In Reinforcement the
    machine or agent automatically learns using feedback without any labelled data.
    Here, the agent learns by itself from its experience.


    In this book, the reader will not only find the theoretical concepts but also
    the practical knowledge needed to quickly and efficiently apply these strategies
    to challenging problems of machine learning. The reader learns how to understand
    a problem, be able to represent data, select and correct skills, interpret results
    correctly and practice effective analysis of outcomes to make strategic decisions.


    ## Organization of the Book


    The book consists of six chapters, in which the reader will learn the following:


    **Chapter 1** introduces the fundamental concepts of machine learning, its applications,
    types and describes the setup we will be using throughout the book.


    **Chapter 2** describes supervised machine learning. Different supervised machine
    learning algorithms such as Linear Regression Model, Naive Bayes classifier Decision
    Tree, K nearest neighbor, Logistic Regression, Support Vector Machine, and Random
    forest algorithm are described in this chapter with their practical use.


    **Chapter 3** describes unsupervised machine learning. Different unsupervised
    machine learning algorithms such as K-Means Clustering, Hierarchical Clustering,
    Probabilistic Clustering, Association Rule Mining, Apriori Algorithm, f-p Growth
    Algorithm, Gaussian Mixture Model are described in this chapter with their practical
    use.


    **Chapter 4** describes the various statistical learning theories used in machine
    learning. This chapter describes statistical learning theories such as Feature
    Extraction, Principal Component Analysis, Singular Value Decomposition, Feature
    Selection \- feature ranking and subset selection, filter, wrapper and embedded
    methods, Evaluating Machine Learning Algorithms and Model Selection.


    **Chapter 5** describes Semi-Supervised Learning and Reinforcement Learning. This
    chapter describes Markov Decision Process (MDP), Bellman Equations, Policy Evaluation
    using Monte Carlo, Policy Iteration and Value Iteration, Q-Learning, State Action-Reward-State-Action
    (SARSA) and Model-Based Reinforcement Learning.


    **Chapter 6** describes the recommended system and basic introduction to neural
    networks and deep learning. This chapter includes various techniques used for
    the recommended system such as Collaborative Filtering and Content-Based Filtering.
    It also covers the basic introduction of Artificial Neural Network, Perceptron,
    Multilayer network, Backpropagation and introduction to Deep Learning.


    At the end of this book, practicals and model question papers are included for
    practice.


