- raw: "  Regression metrics    Classification models have discrete output variables\
    \ whereas regression models provide a continuous output variable. Hence there\
    \ are different ways of evaluating the performance of the regression model which\
    \ we will discuss further.  \n\n  Mean Squared Error or MSE    MSE is used to\
    \ calculate the difference between the actual value and the predicted value, it\
    \ squares the error value and finally, it provides the mean of all the errors.\
    \ It can be represented as:    ![](image-s78nk8de.jpg)\n\n  Root Mean Squared\
    \ Error or RMSE    RMSE is the root value of MSE and it is helpful to reduce the\
    \ scale of the error and tries to keep the value closer to the actual value. \
    \ \n\n  Mean Absolute Error or MAE    MAE is the mean of the absolute error values.\
    \ If we want to ignore the outlier values to a certain degree then MAE can be\
    \ the right choice as it can reduce the penalty of the outliers significantly\
    \ with the removal of the square terms.    ![](image-g7jrw42w.jpg)\n\n  Root Mean\
    \ Squared Log Error or RMSLE    It is the same as RMSE except for the log function\
    \ along with the actual and predicted values.    ![](image-qtp3954h.jpg)  Here\
    \ x represents the actual value and y represents the predicted value. These metrics\
    \ help to scale down the effect of the outliers by downplaying the higher error\
    \ rates with the log function.  \n\n  Clustering metrics    Clustering algorithms\
    \ are used to predict the group of data points and for clustering-based algorithms,\
    \ distance-based metrics are most useful and effective. Now we will discuss some\
    \ of the clustering metrics:  \n\n  Dunn Index    Dunn index metrics are used\
    \ to identify the clusters which are having low variance. It can be calculated\
    \ using the following formula:    Here,    δ(Xi, Yj) \\=Distance between Xi and\
