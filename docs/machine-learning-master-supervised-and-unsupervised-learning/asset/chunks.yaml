  fmt: '

    # Applications of Deep Learning


    Deep learning has a wide range of applications in almost every industry, including
    health care, finance, and image recognition. Some of the most popular application
    areas are as follows:


    - **Health**: Image recognition, cancer detection from MRI imaging and x-rays,
    drug discovery, clinical trial matching, and genomics.

    - **Autonomous**: Self-driving cars, recognizing a stop sign to seeing a pedestrian
    on the road.

    - **Product recommendations**.

    - **Automatic Text**: Word-by-word or character-by-character.

    - **Automatic Machine**: Certain words, sentences or phrases in one language is
    transformed into another language.

    - **Personal Devices**: Like Alexa or Google Assistant.

    - **Predicting**: Teaches a computer to perform viscoelastic computations, which
    are used in earthquake prediction.


    These are only a few of the numerous applications to which deep learning can be
    applied. Stock market forecasting and weather forecasting are two other popular
    fields where deep learning has proven useful.


    # Summary


    - **Recommended Systems** are software tools and techniques that provide recommendations
    for items that may be useful to a user.

    - There are three types of recommendation approaches: **Content-based recommended
    systems**, **Collaborative filtering**, and **Hybrid recommended systems**.

    - **Collaborative filtering** does not require anything other than the users''
    historical preferences on a set of items.

    - The **Collaborative filtering** techniques are broadly divided into two types:
    **Memory-based** and **Model-based approach**.

    - Systems that use a **content-based recommendation** approach investigate a set
    of documents and/or explanations of items previously rated by a user and create
    a model or profile of that user''s interests based on the characteristics of the
    objects rated by that user.

    - **Artificial Neural Networks (ANNs)** are biologically inspired computer simulations
    that perform specific tasks such as clustering, classification, and pattern recognition.

    - A **perceptron** is a supervised learning algorithm for binary classifiers.

    - There are two types of perceptrons: **Single layer** and **Multilayer**.

    - The **backpropagation algorithm** is used to effectively train a neural network
    using a method known as **chain rule**.

    - **Backpropagation** is particularly useful for deep neural networks working
    on error-prone projects like image or speech recognition.

    - **Deep learning** refers to **Deep Neural Networks**.

    - There are two types of backpropagation networks: **Static Backpropagation**
    and **Recurrent Backpropagation**.

    - **Deep learning** algorithms employ a technique known as a **neural network**
    to discover relationships between a set of inputs and outputs.


    # Exercise (MCQs)


    **What is the objective of the backpropagation algorithm?**

    - to develop a learning algorithm for multilayer feedforward neural network

    - to develop a learning algorithm for a single-layer feedforward neural network

    - to develop a learning algorithm for a multilayer feedforward neural network,
    so that network can be trained to capture the mapping implicitly

    - none of the above


    **What is true regarding the backpropagation rule?**

    - it is also called generalized delta rule

    - error in output is propagated backwards only to determine weight updates

    - there is no feedback of signal at any stage

    - all of the mentioned


    **Why do we need biological neural networks?**

    - to solve tasks like machine vision & natural language processing

    - to apply heuristic search methods to find solutions to a problem

    - to make smart human interactive & user-friendly system

    - all of the mentioned


    **What is plasticity in neural networks?**

    - input pattern keeps on changing

    - input pattern has become static

    - output pattern keeps on changing

    - output is static


    **The fundamental unit of a network is**

    - brain

    - nucleus

    - neuron

    - axon


    **Which of the following would have a constant input in each epoch of training
    a deep learning model?**

    - Weight between input and hidden layer

    - Weight between hidden and output layer

    - Biases of all hidden layer neurons

    - Activation function of the output layer

    - None of the above


    **Backpropagations cannot be applied when using pooling layers**

    - TRUE

    - FALSE


    **For a binary classification problem, which of the following architecture would
    you choose?**

    - 1

    - 2

    - Any one of these

    - None of these


    **Suppose there is an issue while training a neural network. The training loss/validation
    loss remains constant. What could be the possible reason?**

    - Architecture is not defined correctly

    - Data given to the model is noisy

    - Both of these


    **Which of the following is a subset of machine learning?**

    - SciPy

    - NumPy

    - Deep Learning

    - All of the above


    # Answers


    c, d, d, a, c, a, b, c, c, c


    # Short Answers Questions


    - Define recommended systems.

    - What do you mean by collaborative filtering?

    - Define Artificial Neural Networks (ANNs).

    - Describe the meaning of perceptron.

    - Explain the main characteristics of Artificial Neural Networks?

    - What is an activation function and why use them?

    - Explain the importance of the backpropagation algorithm.

    - Difference between machine learning and deep learning.

    - Write a short note on deep learning.


    # Long Answers Questions


    - Explain the types of the recommended systems with examples.

    - Explain the collaborative filtering techniques with diagrams.

    - Differentiate between the ANN and BNN.

    - Explain the single-layer and multilayer perceptrons.

    - What is the backpropagation algorithm? Explain with an example.

    - What is the role of weights and bias in a neural network?

    - Explain the importance of deep learning with an application as example.

    '
  trans: '


    # 深度学习的应用


    深度学习在几乎所有行业都有广泛的应用，包括医疗保健、金融和图像识别。一些最热门的应用领域如下：


    - **健康医疗**：图像识别、通过 MRI 成像和 X 光进行癌症检测、药物发现、临床试验匹配和基因组学。

    - **自主系统**：自动驾驶汽车，从识别停车标志到发现道路上的行人。

    - **产品推荐**。

    - **自动文本**：逐词或逐字符生成。

    - **自动机器翻译**：将一种语言中的特定单词、句子或短语转换为另一种语言。

    - **个人设备**：如 Alexa 或 Google Assistant。

    - **预测**：教会计算机执行粘弹性计算，用于地震预测。


    这些只是深度学习可应用的众多应用中的一小部分。股市预测和天气预报是深度学习已被证明有用的另外两个热门领域。


    # 总结


    - **推荐系统** 是为用户提供可能有用的项目推荐的软件工具和技术。

    - 推荐方法主要有三种：**基于内容的推荐系统**、**协同过滤** 和 **混合推荐系统**。

    - **协同过滤** 除用户对一组项目的历史偏好外，不需要任何其他信息。

    - **协同过滤** 技术大致分为两类：**基于内存的方法** 和 **基于模型的方法**。

    - 采用 **基于内容的推荐** 方法的系统会调查一组文档和/或用户之前评分过的项目的解释，并根据该用户评分对象的特征，建立该用户兴趣的模型或画像。

    - **人工神经网络 (ANN)** 是受生物学启发的计算机模拟，可执行聚类、分类和模式识别等特定任务。

    - **感知机** 是一种用于二分类器的监督学习算法。

    - 感知机有两种类型：**单层** 和 **多层**。

    - **反向传播算法** 利用一种称为 **链式法则** 的方法，用于有效地训练神经网络。

    - **反向传播** 对于在易错项目（如图像或语音识别）上工作的深度神经网络特别有用。

    - **深度学习** 指的是 **深度神经网络**。

    - 反向传播网络有两种类型：**静态反向传播** 和 **循环反向传播**。

    - **深度学习** 算法采用一种称为 **神经网络** 的技术，来发现一组输入和输出之间的关系。


    # 练习 (单选题)


    **反向传播算法的目标是什么？**

    - 开发一种用于多层前馈神经网络的学习算法

    - 开发一种用于单层前馈神经网络的学习算法

    - 开发一种用于多层前馈神经网络的学习算法，以便网络能够被训练以隐式地捕获映射关系

    - 以上都不是


    **关于反向传播规则，以下哪项是正确的？**

    - 它也被称为广义 Delta 规则

    - 输出中的误差仅向后传播以确定权重更新

    - 在任何阶段都没有信号反馈

    - 以上所有


    **为什么我们需要生物神经网络？**

    - 解决机器视觉和自然语言处理等任务

    - 应用启发式搜索方法来寻找问题的解决方案

    - 制造智能的人机交互和用户友好型系统

    - 以上所有


    **神经网络中的可塑性是什么？**

    - 输入模式不断变化

    - 输入模式已变为静态

    - 输出模式不断变化

    - 输出是静态的


    **网络的基本单元是**

    - 大脑

    - 细胞核

    - 神经元

    - 轴突


    **在训练深度学习模型的每个周期中，以下哪项将具有恒定的输入？**

    - 输入层与隐藏层之间的权重

    - 隐藏层与输出层之间的权重

    - 所有隐藏层神经元的偏置

    - 输出层的激活函数

    - 以上都不是


    **使用池化层时不能应用反向传播**

    - 正确

    - 错误


    **对于二分类问题，你会选择以下哪种架构？**

    - 1

    - 2

    - 以上任意一个

    - 以上都不是


    **假设训练神经网络时出现问题。训练损失/验证损失保持不变。可能的原因是什么？**

    - 架构定义不正确

    - 提供给模型的数据有噪声

    - 以上两者皆是


    **以下哪项是机器学习的子集？**

    - SciPy

    - NumPy

    - 深度学习

    - 以上所有


    # 答案


    c, d, d, a, c, a, b, c, c, c


    # 简答题


    - 定义推荐系统。

    - 什么是协同过滤？

    - 定义人工神经网络 (ANN)。

    - 解释感知机的含义。

    - 解释人工神经网络的主要特征？

    - 什么是激活函数？为什么要使用它们？

    - 解释反向传播算法的重要性。

    - 机器学习和深度学习的区别。

    - 简述深度学习。


    # 论述题


    - 结合示例解释推荐系统的类型。

    - 结合图解解释协同过滤技术。

    - 区分 ANN 和 BNN。

    - 解释单层和多层感知机。

    - 什么是反向传播算法？结合示例解释。

    - 权重和偏置在神经网络中的作用是什么？

    - 结合应用示例解释深度学习的重要性。


    '
