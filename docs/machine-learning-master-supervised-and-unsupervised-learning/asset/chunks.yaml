    # Q-Learning


    Q-learning 是一种离线策略强化学习算法。它试图找到在当前状态下可以采取的最佳动作。之所以称为离线策略，是因为 Q-learning 函数从当前策略之外的动作中学习，例如随机步骤，因此不需要策略。Q-learning
    旨在学习一种能够最大化总奖励的策略。


    这是一种基于价值的学习算法。基于价值的算法根据方程更新/调整价值函数。而基于策略的算法则利用从上一次策略改进中获得的贪婪策略来预测价值函数。


    Q-learning 中的 “Q” 代表质量。在这里，质量表示在获得未来奖励方面，给定动作的有用程度。


    ## Q-Table 简介


    Q-Table 只是简单查找表的一个花哨名称。Q-Table 是用于计算每个状态下采取动作的最大预期未来奖励的数据结构。该表将指导我们在每个状态下选择最佳动作。要学习
    Q-table 中的每个值，需要使用 Q-Learning 算法。


    Q-table 或矩阵遵循 `[state, action]` 的形状，我们将所有值初始化为零。然后在一个回合结束后更新并存储 Q 值。这个 Q-table
    成为智能体根据 Q 值选择最佳动作的参考表。


    在 Q-Table 中，列代表动作，行代表状态。


    要学习 Q-table 中的每个值，我们使用 Q-Learning


    ## Q-Learning 算法


    Q 函数使用贝尔曼方程，并接受两个输入：状态 (`s`) 和动作 (`a`)。


    ![](img/image-bub1xg2i.jpg)

    **图 5.8：Q 函数**


    使用上述方法，我们可以得到表中单元格的 Q 值。在开始时，Q-table 中的所有值均为零。存在一个迭代更新值的过程。当我们开始探索环境时，Q 函数通过不断更新表中的
    Q 值，给出越来越好的近似。


    ### Q-learning 算法


    让我们详细了解 Q-learning 算法的每一步，如图 5.9 所示：


    ![](img/image-8objp1vf.jpg)

    **图 5.9：Q-learning 算法**


    #### 步骤 1：初始化 Q-Table


    这里我们首先创建一个 Q-table。有 `n` 列，其中 `n = 动作数量`。有 `m` 行，其中 `m = 状态数量`。我们将值初始化为 0。


    #### 步骤 2 和 3：选择并执行动作


    步骤 2 和 3 的组合将执行不定量的时间。这些步骤将运行直到训练停止，或代码中定义的训练循环停止。


    首先，根据 Q-Table 在状态 (`s`) 下选择一个动作 (`a`)。注意，如前所述，当回合最初开始时，每个 Q 值都应为 0。然后，使用上面解释过的贝尔曼方程，更新处于起始状态并向右移动的
    Q 值。


    #### 步骤 4：测量奖励


    现在我们已经采取了一个动作并观察到了结果和奖励。


    #### 步骤 5：评估


    我们需要更新函数 `Q(s, a)`。此过程重复进行，直到学习停止。通过这种方式，Q-Table 得到更新，价值函数 Q 被最大化。在这里，`Q(state,
    action)` 返回在该状态下采取该动作的预期未来奖励。


    ```

    New Q(s,a) = Q(s,a) = [R(s,a) + maxQ’(s’,a’) – Q(s,a)] ………………………. (9)

    ```


    其中，


    *   **New Q(s,a)**：该状态和动作的新 Q 值

    *   **Q(s,a)**：当前 Q 值

    *   **α**：学习率

    *   **R(s,a)**：在该状态下采取该动作的奖励

    *   **Y**：折扣率

    *   **给定新状态 (s'') 及该新状态下所有可能动作的最大预期未来奖励。**


    # 状态-动作-奖励-状态-动作 (SARSA)


    SARSA 算法是著名的 Q-learning 算法的一个轻微变体。对于任何强化学习算法中的学习智能体，策略可以分为两类：


    *   **在线**：在此类中，学习智能体根据当前正在使用的策略所衍生出的当前动作所指示的价值函数进行学习。

    *   **离线**：在此类中，学习智能体根据源自另一策略的动作所指示的价值函数进行学习。


    ![](img/image-ad1wewus.jpg)

    **图 5.10：强化学习中的策略类型**


    Q-Learning 技术是一种离线策略方法，并使用贪婪方式来学习 Q 值。另一方面，SARSA 技术是一种在线策略方法，它使用当前策略执行的动作来学习 Q
    值，如图所示


    SARSA 是一种在线策略算法，在当前状态 `S` 下，智能体采取动作 `A`，获得奖励 `R`，并进入下一状态 `S''`，然后在 `S''` 中采取动作
    `A''`。因此，元组 `(S, A, R, S'', A'')` 代表首字母缩略词 SARSA，如图所示


    ![](img/image-bidn7siv.jpg)

    **图 5.11：SARSA**


    之所以称为在线策略算法，是因为它根据采取的动作来更新策略。


    ## SARSA 与 Q-learning


    SARSA 和 Q-learning 的显著区别在于，下一状态的最大奖励 **不用于** 更新 Q 值。相反，利用决定原始动作的同一策略来选择一个新动作，并由此获得奖励。


    在 SARSA 中，智能体从状态 1 开始，执行动作 1，并获得奖励（奖励 1）。现在，它处于状态 2 并执行另一个动作（动作 2），在返回更新状态 1 中执行的动作
    1 的估值之前，先获得该状态的奖励（奖励 2）。相比之下，在 Q-learning 中，智能体从状态 1 开始，执行动作 1 并获得奖励（奖励 1），然后查看状态
    2 中动作可能获得的最大奖励是什么，并用它来更新在状态 1 中执行动作 1 的动作价值。因此，区别在于寻找未来奖励的方式。在 Q-learning 中，它仅仅是从状态
    2 可以采取的最高可能动作；而在 SARSA 中，它是实际采取的动作的价值。


    ## SARSA 算法


    我们将使用相同的策略来选择当前动作 `At` 和下一个动作 `A(t+1)`。因此，在状态 `S(t+1)` 中，其动作将是 `A(t+1)`，该动作是在更新
    `St` 的动作-状态价值时选择的。


    ![](img/image-wkj2dcm5.jpg)


    SARSA 的算法与 Q-learning 略有不同，描述如下：


    ![](img/image-tgma8vun.jpg)


    Q 值的更新会考虑在状态 `S1` 中执行的动作 `A1`，这与 Q-learning 不同，后者使用下一状态 `S1` 中具有最高 Q 值的动作来更新 Q-table。


