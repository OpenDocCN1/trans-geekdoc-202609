    # Clustering


    Clustering is an important concept of unsupervised learning. It is used to find
    out the hidden structures or patterns in uncategorized data. The clustering algorithm
    processes the uncategorized data and divides them into different clusters (groups)
    such that objects with many similarities remain in the same group and have fewer
    or no similarities with the objects of another group. As shown in Figure it makes
    the two clusters of cats and dogs.


    ![](image-8glklhru.jpg)

    Figure 1.10: Clustering


    # Association


    An association rule is an unsupervised learning method. It is used to find out
    the relationships between the data in the large dataset. It determines the set
    of items that occurs together in the dataset. Association rule makes marketing
    strategy more effective. For example, suppose a person who buys bread also tends
    to buy butter/jam as shown in Figure A typical example of the association rule
    is Market Basket Analysis.


    ![](image-nhe4tq1z.jpg)

    Figure 1.11: Association


    # Reinforcement Learning


    Reinforcement learning is the third and last type of Machine Learning. This is
    feedback-based Machine Learning. In Reinforcement Learning, the machine or agent
    atomically learns using feedback without any labeled data. Here, the agent learns
    itself from its experience.


    In Reinforcement Learning, the agent uses the hit and trial process. If the agent
    tries a successful step, then the agent gets a reward, otherwise for each mistake
    agent gets a penalty. Its goal is to maximize the total reward.


    As shown in Figure consider the example of teaching a dog. Since the dog does
    not understand any human language, we cannot tell him exactly what to do. We create
    a situation, and the dog tries to respond in many different ways. If the dog''s
    responds in a desirable way, we will give him bread. Now, whenever the dog is
    presented in the same situation again, the dog does the same action by eagerly
    anticipating a greater reward (bread). That’s like learning that a dog gets from
    to from a good experience. At the same time, the dog is learning to do nothing
    in the face of negative experiences.


    ![](image-9j83khwd.jpg)

    Figure 1.12: Reinforcement Learning


    # Advantages of Machine Learning


    There are many advantages of machine learning. These are some of the helpful advantages:


    - **Easily identifies trends and patterns**: Machine learning takes large amounts
    of data and discovers the hidden structures, specific styles and patterns that
    are very difficult to find by humans. For example, an e-commerce website like
    Flipkart, works to understand the browsing methods and purchase records of its
    users to help target relevant products, deals, and related reminders. It uses
    results to show relevant ads or products to them.

    - **No human intervention needed (Automation)**: Machine learning has a very powerful
    tool to automate various decision-making tasks. By automating things, we allow
    the algorithm to perform difficult tasks. Automation is now practiced almost everywhere.
    The reason is that it is very reliable. In addition, it helps us to think deeply.

    - **Efficient Handling of any type of Data**: There are many factors that make
    machine learning reliable. Data handling is one of them. Machine learning plays
    a big role when it comes to data. It can handle any type and amount of data. It
    can process and analyze the data that normal systems cannot. Data is the most
    important part of a machine learning model.

    - **Continuous Improvement**: As machine learning algorithms gain experience from
    data, they keep improving their accuracy and efficiency. This lets them make better
    decisions. Suppose, we need to make a weather forecast model. As the amount of
    data we have keeps growing, our algorithms learn to make accurate predictions
    faster.


    # Disadvantages of Machine Learning


    Similar to the advantages of machine learning, we should also know the disadvantages
    of machine learning. If we don’t know the cons, we won’t know the risks of ML.
    So, let’s have a look at the disadvantages.


    - **Possibility of High Error**: In machine learning, we can choose algorithms
    based on the accurate results. Therefore, we must apply the results to all algorithms.
    A major problem arises with the training and testing of data. The data is large,
    so sometimes deleting errors becomes impossible. These errors can cause headaches
    for users. As the data is large, errors take a lot of time to resolve.

    - **Data Requirements**: Machine learning requires a large number of datasets
    for the training and testing of the model. The machine learning algorithm takes
    the good quality of data for an accurate result. In many situations, the data
    constantly keeps on updating. Therefore, we have to wait for the new data to arrive.

    - **Time and Resources**: Machine learning algorithms require enough time to learn
    and develop enough to achieve their goals with a high degree of accuracy and consistency.
    It also requires great resources to operate. This may mean additional computational
    power requirements for our computer.

    - **Algorithm Selection**: A machine learning problem can implement various algorithms
    to find a solution. It is a manual and tedious task to run models with different
    algorithms and identify the most accurate algorithm based on the results.


