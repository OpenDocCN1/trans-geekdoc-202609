- raw: "About the Authors    Dr. Ruchi Doshi has more than 14 years of academic, research\
    \ and software development experience in Asia and Africa. Currently, she is working\
    \ as a Research Supervisor at the Universidad Azteca, Mexico and Adjunct faculty\
    \ at the Jyoti Vidyapeeth Women’s University, Jaipur, Rajasthan, India. She has\
    \ worked in the BlueCrest University College, Liberia, West Africa as Registrar\
    \ and Head, Examination, BlueCrest University College, Ghana, Africa, Amity University,\
    \ Rajasthan, India and Trimax IT Infrastructure and Services, Udaipur, India.\
    \    She has been nominated by the IEEE Headquarter, USA for the Chair, Women\
    \ in Engineering and Secretary Position in Liberia country. She has worked with\
    \ the Ministry of Higher Education (MoHE) in Liberia and Ghana for the Degree\
    \ approval and accreditation processes. She is interested in the field of Machine\
    \ Learning and Cloud computing framework development. She has given many expert\
    \ talks in the area of Women in Research, Use of Machine Learning Technology in\
    \ Real-time Applications and Community Based Participatory Action Research at\
    \ the national and international level. She has published 25 scientific research\
    \ papers in SCI/Scopus/Web of Science Journals, Conferences, 2 Indian Patents\
    \ and 4 books with internationally renowned publishers. She is a reviewer, advisor,\
    \ ambassador and editorial board member of various reputed international journals\
    \ and conferences. She is an active member in organizing many international seminars,\
    \ workshops and conferences in Mexico, India, Ghana and Liberia.    LinkedIn Profile:\
    \ https://www.linkedin.com/in/dr-ruchi-doshi-96bb63b4/    Dr. Kamal Kant Hiran\
    \ is an Assistant Professor, School of Engineering at the Sir Padampat Singhania\
    \ University (SPSU), Udaipur, Rajasthan, India as well as a Research Fellow at\
    \ the Aalborg University, Copenhagen, He has more than 16 years of experience\
    \ as an academic and researcher in Asia, Africa and Europe. He has worked as an\
    \ Associate Professor and Head, Academics at the BlueCrest University College,\
    \ Liberia, West Africa, Head of Department at the Academic City College, Ghana,\
    \ West Africa, Senior Lecturer at the Amity University, Jaipur, Rajasthan, India,\
    \ Assistant Professor at the Suresh Gyan Vihar University, Jaipur, Rajasthan,\
    \ India and Visiting Lecturer at the Government Engineering College, Ajmer.   \
    \ He has several awards to his credit such as the international travel grant for\
    \ attending the 114th IEEE Region 8 Committee meeting in Warsaw, Poland, International\
    \ travel grant for Germany from ITS Europe, Passau, Germany, Best Research Paper\
    \ Award at the University of Gondar, Ethiopia and SKIT, Jaipur, India, IEEE Liberia\
    \ Subsection Founder Award, Gold Medal Award in M. Tech (Hons.), IEEE Ghana Section\
    \ Award \\- Technical and Professional Activity Chair, IEEE Senior Member Recognition,\
    \ IEEE Student Branch Award and Elsevier Reviewer Recognition Award. He has published\
    \ 35 scientific research papers in SCI/Scopus/Web of Science and IEEE Transactions\
    \ Journal, Conferences, 2 Indian Patents, 1 Australian patent grant and 9 books\
    \ with internationally renowned publishers. He is a reviewer and editorial board\
    \ member of various reputed international journals in Elsevier, Springer, IEEE\
    \ Transactions, IET, Bentham Science and IGI Global. He is an active member in\
    \ organizing many international seminars, workshops and conferences. He has made\
    \ several international visits to Denmark, Sweden, Germany, Poland, Norway, Ghana,\
    \ Liberia, Ethiopia, Russia, Dubai and Jordan for research exposures. His research\
    \ interests focus on Cloud Computing, Machine Learning and Intelligent IoT.   \
    \ LinkedIn Profile: https://www.linkedin.com/in/kamal-kant-hiran-phd-4553b643/\
    \    Mr. Ritesh Kumar Jain works as an Assistant Professor at the Geetanjali Institute\
    \ of Technical Studies, (GITS), Udaipur, Rajasthan, India. He has more than 15\
    \ years of teaching and research experience. He has completed his BE and MTech.\
    \ He has worked as an Assistant Professor and Head of Department at S.S. College\
    \ of Engineering. Udaipur, Assistant Professor at Sobhasaria Engineering College,\
    \ Sikar and Lecturer at the Institute of Technology and Management, Bhilwara.\
    \    He is a reviewer of international peer-reviewed journals. He is the author\
    \ of several research papers in peer-reviewed international journals and conferences.\
    \    LinkedIn Profile: https://www.linkedin.com/in/ritesh-jain-b8924345/    Dr.\
    \ Kamlesh Lakhwani works as an Associate Professor at the School of Computer Science\
    \ and Engineering, JECRC University, Jaipur, India. He has an excellent academic\
    \ background and a rich experience of 15 years as an academician and researcher\
    \ in Asia. As a prolific writer in the arena of Computer Sciences and Engineering,\
    \ he has penned down several learning materials on C, C++, Multimedia Systems,\
    \ Cloud Computing, IoT, Image Processing, etc. He has four published patents to\
    \ his credit and contributed for more than 50 research papers in the Conferences/Journals/Seminar\
    \ of International and National repute. His area of interest includes Cloud Computing,\
    \ Internet of Things, Computer vision, Image processing, Video Processing and\
    \ Machine Learning.    LinkedIn Profile: https://www.linkedin.com/in/dr-kamlesh-lakhwani-7119944b/\
    \  \n\nAbout the Reviewer    Dr. Ajay Kumar Vyas has more than 15 years of teaching\
    \ and research experience and is presently working as an Assistant Professor at\
    \ Adani Institute of Infrastructure Engineering, Ahmedabad (India). He has completed\
    \ his Bachelor of Engineering (2005) in Electronics and Communication from Govt.\
    \ Engineering College, Ujjain and M.Tech (2009) in Optical Communication from\
    \ Shri Govindram Sakseriya Institute of Tech and Sci., Indore with Honors and\
    \ PhD (2016) from Maharana Pratap Agri. and Tech. University, Udaipur (Raj). He\
    \ is a senior member of IEEE and IACSIT (Singapore). He has been awarded certificate\
    \ of excellence from Elsevier Research Academic and Publons Academy as a certified\
    \ peer reviewer.    He has worked as a reviewer for renowned journals of Springer,\
    \ IET, IEEE, OSA, IGI Global, Chinese Journal of Electrical Engineering and many\
    \ more.    He is the author of several research papers in peer-reviewed international\
    \ journals and conferences, three books with De-Gruyter and India Publications\
    \ and has published two Indian patents. He is also the author of many book chapters\
    \ published by Springer International Publishing, Singapore.  \n\nAcknowledgement\
    \    First and foremost, we'd like to thank the Almighty for giving us the inspiration\
    \ and zeal to write this book.    Our sincere thanks goes to our organizations,\
    \ Universidad Azteca, Mexico, Sir Padampat Singhania University, Geetanjali Institute\
    \ of Technical Studies, JECRC University, India for providing us with a healthy\
    \ academic and research environment during work.    Special thanks to the BPB\
    \ Publications team, especially to Nrip Jain and members for their support, advice\
    \ and assistance in editing and publishing this book.    The completion of this\
    \ book could not have been possible without the contribution and support we got\
    \ from our family, friends and colleagues. It is a pleasant aspect and we express\
    \ our gratitude to all of them.    — Dr. Ruchi Doshi  Universidad Azteca,  Mexico\
    \    — Dr. Kamal Kant Hiran  Sir Padampat Singhania University (SPSU),  India\
    \    — Mr. Ritesh Kumar Jain  Geetanjali Institute of Technical Studies (GITS),\
    \  India    — Dr. Kamlesh Lakhwani  JECRC University,  India  "
