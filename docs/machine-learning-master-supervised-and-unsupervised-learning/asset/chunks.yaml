    \ method\n\n**A learning agent in any reinforcement learning algorithm its policy\
    \ can be of two types:**\n\n- On-Policy and Off-Policy\n- Off-Policy and Off-Policy\n\
    - On-Policy and On-Policy\n- None of these\n\n## Fill in the blanks\n\n- Q-Learning\
    \ technique is an ________ method and uses the greedy way to learn the Q-value.\n\
    - SARSA technique is an ________ and uses the action performed by the current\
    \ policy to learn the Q-value.\n- ________ is a real-time machine learning application\
    \ that determines the emotion or opinion of the speaker or the writer.\n- Exclusive,\
    \ agglomerative, overlapping, and probabilistic are four methods of ________.\n\
    - Labeled data is used to train the model in ________, whereas in ________ unlabeled\
    \ data is used to train the model.\n\n## Short Answer Questions\n\n- Discuss the\
    \ k-nearest neighbor algorithm.\n- Discuss the locally weighted regression.\n\
    - Discuss the binomial distribution.\n- Write a short note on information gain.\n\
    - Write a short note on the confusion matrix.\n\n## Descriptive Questions\n\n\
    - Write a candidate elimination algorithm. Apply the algorithm to obtain the final\
    \ version space for the following training sample.\n  - sample\n  - sample\n \
    \ - sample\n  - sample\n  - sample\n  - sample\n- Write an algorithm for the backpropagation\
    \ algorithm which uses the stochastic gradient descent method. Comment on the\
    \ effect of adding momentum to the network.\n- Discuss the learning tasks and\
    \ Q-learning in the context of reinforcement learning.\n- Explain the Naïve Bayes\
    \ classifier with an example.\n- Explain the EM algorithm in detail.\n- Write\
    \ Bayes theorem. What is the relationship between Bayes theorem and the problem\
    \ of concept learning?\n- Write a note on Occam’s razor and minimum description\
    \ principle.\n- Define the following terms:\n  - a) Sample error\n  - b) True\
    \ error\n  - c) Expected value\n- Give decision tree representations for the following\
    \ Boolean functions:\n  - `A ˅ (B ˄ C)`\n  - `(A ˄ B) ˅ (C ˄ D)`\n- What is entropy?\
    \ How do we employ mutual information for classification between a positive and\
    \ negative class?\n"
  trans: "\n\n# 模拟试卷 – 4\n\n## 选择题\n\n**Apriori 算法用于 ________。**\n\n- 市场篮子分析\n- 反向传播\n\
    - 神经网络\n- 监督训练\n\n**FP-growth 算法是 ________ 的重要算法。**\n\n- 关联规则学习\n- 监督学习\n- 强化学习\n\
    - 神经网络\n\n**概率聚类也称为**\n\n- 软聚类\n- 硬聚类\n- Alpha 聚类\n- Beta 聚类\n\n**两个不同簇中两点之间的最远距离被视为：**\n\
    \n- 单链接\n- 全链接\n- 平均链接\n- 质心链接\n\n**假设我们要根据房屋的几何位置进行聚类，且簇可以具有不同的形状和大小。哪种方法适合这种方法？**\n\
    \n- 决策树\n- 基于密度的聚类\n- 基于模型的聚类\n- K-means 聚类\n\n**以下哪项不是监督学习？**\n\n- PCA\n- 决策树\n\
    - 线性回归\n- 朴素贝叶斯\n\n**以下哪些是分类特征？**\n\n- 一个人的身高\n- 石油价格\n- 一个人的母语\n- 一天的降雨量\n\n\
    **以下哪项是监督学习问题？**\n\n- I. 基于历史数据预测板球比赛的结果为胜或负\n- II. 向像 IMDb 这样的网站上的现有用户推荐电影，基于搜索历史（包括其他用户）\n\
    - III. 从人物图像预测性别。给定 100 万张图像及其性别数据\n- IV. 给定旧新闻文章的类别标签，根据新新闻文章的内容预测其类别。新闻文章的类别可以是体育、政治、技术等。\n\
    \n- I, II, III\n- I, III, IV\n- II, III, IV\n- I, II, III, IV\n\n**Q-learning\
    \ 技术是一种 ________ 方法。**\n\n- 离策略方法\n- 在线策略方法\n- 在线-离线策略方法\n- 离线-离线策略方法\n\n**任何强化学习算法中的学习智能体，其策略可以分为两类：**\n\
    \n- 在线策略和离策略\n- 离策略和离策略\n- 在线策略和在线策略\n- 以上都不是\n\n## 填空题\n\n- Q-Learning 技术是一种\
    \ ________ 方法，并使用贪婪方式来学习 Q 值。\n- SARSA 技术是一种 ________，并使用当前策略执行的动作来学习 Q 值。\n-\
    \ ________ 是一种实时机器学习应用，用于确定说话者或作者的情绪或观点。\n- 独占、凝聚、重叠和概率是 ________ 的四种方法。\n- 在\
    \ ________ 中使用标记数据来训练模型，而在 ________ 中使用未标记数据来训练模型。\n\n## 简答题\n\n- 讨论 K 近邻算法。\n\
    - 讨论局部加权回归。\n- 讨论二项分布。\n- 简述信息增益。\n- 简述混淆矩阵。\n\n## 论述题\n\n- 编写候选消除算法。将该算法应用于以下训练样本以获得最终版本空间。\n\
    \  - 样本\n  - 样本\n  - 样本\n  - 样本\n  - 样本\n  - 样本\n- 编写使用随机梯度下降法的反向传播算法。评述向网络添加动量的效果。\n\
    - 结合强化学习背景，讨论学习任务和 Q-learning。\n- 举例解释朴素贝叶斯分类器。\n- 详细解释 EM 算法。\n- 写出贝叶斯定理。贝叶斯定理与概念学习问题有何关系？\n\
    - 简述奥卡姆剃刀原则和最小描述长度原则。\n- 定义以下术语：\n  - a) 样本误差\n  - b) 真实误差\n  - c) 期望值\n- 给出以下布尔函数的决策树表示：\n\
    \  - `A ˅ (B ˄ C)`\n  - `(A ˄ B) ˅ (C ˄ D)`\n- 什么是熵？我们如何利用互信息在正类和负类之间进行分类？\n\n"
