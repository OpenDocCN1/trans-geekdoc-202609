    \ distance between the two closest points of two different clusters is considered\
    \ as:**\n\n- Single linkage\n- Complete linkage\n- Average linkage\n- Centroid\
    \ linkage\n\n**The farthest distance between the two points of two different clusters\
    \ is considered as:**\n\n- Single linkage\n- Complete linkage\n- Average linkage\n\
    - Centroid linkage\n\n**In a transactional database, the itemsets whose support-value\
    \ is greater than the predefined threshold or user-defined minimum support value\
    \ is called:**\n\n- Frequent itemsets\n- Average itemsets\n- Regular itemset\n\
    - Poor itemsets\n\n**Probabilistic clustering is also known as:**\n\n- Soft clustering\n\
    - Hard clustering\n- Lenient clustering\n- Overlapping clustering\n\n# Answers\n\
    \na, d, a, a, b, a, a, b, a, a\n\n# Short Answer Questions\n\n- Explain the difference\
    \ between supervised and unsupervised learning.\n- Define clustering and explain\
    \ the difference between clustering and classification.\n- What are the various\
    \ applications of association rule learning?\n- Explain the difference between\
    \ the single linkage and complete linkage methods.\n- What are the various advantages\
    \ and disadvantages of the Apriori algorithm?\n\n# Long Answer Questions\n\n-\
    \ How to measure the distance between two clusters? Explain its various methods\
