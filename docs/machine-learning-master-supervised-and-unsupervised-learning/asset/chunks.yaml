  trans: "\n# 实验编号 6\n\n## 目的\n\n假设有一组需要分类的文档，使用朴素贝叶斯分类器模型来执行此任务。可以使用内置的 Java 类/API\
    \ 来编写程序。计算数据集的准确率、精确率和召回率。\n\n## 用于学习和分类文本的朴素贝叶斯算法\n\n**Examples** 是一组文本文档及其目标值。**V**\
    \ 是所有可能目标值的集合。该函数学习概率项 **P**，描述从某类文档中随机抽取的单词是英文单词的概率。它还学习类先验概率。\n\n1. 收集 **Examples**\
    \ 中出现的所有单词、标点符号和其他标记。\n2. **Vocabulary** ← **Examples** 中任何文本文档出现的所有不同单词和其他标记的集合。\n\
    3. 计算所需的概率项。\n4. 对 **V** 中的每个目标值执行：\n   - 目标值为 **vj** 的 **Examples** 文档子集。\n \
    \  - **P(vj)** ← |**Examples**| / |**Examples**|。\n   - **Textj** ← 通过连接 **Examples**\
    \ 的所有成员创建的单个文档。\n   - **n** ← **Textj** 中不同单词位置的总数。\n   - 对 **Vocabulary** 中的每个单词：\n\
    \     - **nk** ← 单词在 **Textj** 中出现的次数。\n     - **P(wk | vj)** ← ( **nk** + 1 )\
    \ / ( **n** + |**Vocabulary**| )。\n\n## 训练数据集\n\n**ML6.CSV**\n\n## 程序\n\n```python\n\
    import pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom\
    \ sklearn.feature_extraction.text import CountVectorizer\nfrom sklearn.naive_bayes\
    \ import MultinomialNB\nfrom sklearn import metrics\n\n# 数据集的维度\nmsg = pd.read_csv('ML6.CSV',\
    \ names=['message', 'label'])\nprint(\"The dimensions of the dataset\", msg.shape)\n\
    \nX = msg.message\ny = msg.labelnum\n\n# 将数据集拆分为训练数据和测试数据\nxtrain, xtest, ytrain,\
    \ ytest = train_test_split(X, y)\nprint(\"The total number of Training Data:\"\
    , xtrain.shape)\nprint(\"The total number of Test Data:\", xtest.shape)\n\n# 计数向量化器的输出是一个稀疏矩阵\n\
    cv = CountVectorizer()\nxtrain_dtm = cv.fit_transform(xtrain)\nxtest_dtm = cv.transform(xtest)\n\
    \n# 文本文档中的单词或标记\ndf = pd.DataFrame(xtrain_dtm.toarray(), columns=cv.get_feature_names())\n\
    # 稀疏矩阵表示\n\n# 在训练数据上训练朴素贝叶斯 (NB) 分类器。\nclf = MultinomialNB().fit(xtrain_dtm, ytrain)\n\
    predicted = clf.predict(xtest_dtm)\n\n# 打印准确率、混淆矩阵、精确率和召回率\nprint(\"The Accuracy\
    \ of classifier:\", metrics.accuracy_score(ytest, predicted))\nprint(\"Confusion\
    \ matrix:\")\nprint(metrics.confusion_matrix(ytest, predicted))\nprint(\"The value\
    \ of Precision:\", metrics.precision_score(ytest, predicted))\nprint(\"The value\
    \ of Recall:\", metrics.recall_score(ytest, predicted))\n```\n\n## 输出\n\nThe dimensions\
    \ of the dataset (18, 2)\nThe total number of Training Data: (13,)\nThe total\
    \ number of Test Data: (5,)\n\nThe words or Tokens in the text documents\n['about',\
