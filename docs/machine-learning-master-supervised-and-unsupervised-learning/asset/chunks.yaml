  fmt: "\n# Experiment No. 3\n\n**AIM:** Write a program to demonstrate the working\
    \ of the decision tree-based ID3 algorithm. Use an appropriate data set for building\
    \ the decision tree and apply this knowledge to classify a new sample.\n\n## ID3\
    \ Algorithm\n\n```text\nID3 (Examples, Target attribute, Attributes)\n```\n\n\
    - **Examples** are the training examples.\n- **Target attribute** is the attribute\
    \ whose value is to be predicted by the tree.\n- **Attributes** is a list of other\
    \ attributes that may be tested by the learned decision tree.\n- Returns a decision\
    \ tree that correctly classifies the given examples.\n\n### Algorithm Steps\n\n\
    1. Create a Root node for the tree.\n2. If all examples are positive, return the\
    \ single-node tree root, with label = `+`.\n3. If all examples are negative, return\
    \ the single-node tree root, with label = `-`.\n4. If attributes are empty, return\
    \ the single-node tree root, with label = most common value of target attribute\
    \ in examples.\n5. Otherwise, begin:\n   - `A` ← the attribute from attributes\
    \ that best* classifies examples.\n   - The decision attribute for root ← `A`.\n\
    \   - For each possible value, `v`, of `A`:\n     - Add a new tree branch below\
    \ corresponding to the test `A = v`.\n     - Let `Examples_v` be the subset of\
    \ examples that have value `v` for `A`.\n     - If `Examples_v` is empty:\n  \
    \     - Then below this new branch add a leaf node with label = most common value\
    \ of target attribute in examples.\n     - Else below this new branch add the\
    \ subtree `ID3(Examples_v, Target attribute, Attributes – {A})`.\n6. Return Root.\n\
    \nThe best attribute is the one with the highest information gain.\n\n## Training\
    \ Dataset: `ML3.CSV`\n\n![Dataset](image-bd7zu3of.jpg)\n\n## Program\n\n```python\n\
    import pandas as pd\n\ndf = pd.read_csv(\"ML3.CSV\")  # Input Data Set\nt = \"\
    Answer\"  # Target Attribute is: t\nattribute_names = list(df.keys())\nattribute_names.remove(t)\
    \  # Predicting Attributes: attribute_names\n\nimport math\n\ndef entropy(probs):\n\
    \    return sum([-prob * math.log(prob, 2) for prob in probs])\n\ndef entropy_of_list(a_list,\
    \ classes):\n    from collections import Counter\n    cnt = Counter(x for x in\
    \ a_list)  # Counter calculates the proportion of class\n    total_instances =\
    \ sum(cnt.values())  # no of instances/records associated with {0} is:\n    probs\
    \ = [x / total_instances for x in cnt.values()]  # x means no of YES/NO\n    return\
    \ entropy(probs)  # Call Entropy\n\ndef information_gain(df, split_attribute,\
    \ target_attribute, default_attr):\n    df_split = df.groupby(split_attribute)\
    \  # group the data based on attribute values\n    glist = []\n    for gname,\
    \ group in df_split:\n        glist.append(gname)  # Attribute Values\n    glist.reverse()\n\
    \    nobs = len(df.index) * 1.0\n    df_agg = df_split.agg({target_attribute:\
    \ [entropy_of_list, lambda x: len(x) / nobs]})\n    df_agg.columns = ['Entropy',\
    \ 'PropObservations']\n    new_entropy = sum(df_agg['Entropy'] * df_agg['PropObservations'])\n\
    \    old_entropy = entropy_of_list(df[target_attribute], default_attr)\n    return\
    \ old_entropy - new_entropy\n\ndef id3(df, target_attribute, attribute_names,\
    \ default_class=None, parent_attr=None):\n    from collections import Counter\n\
    \    cnt = Counter(x for x in df[target_attribute])  # class of YES /NO\n\n  \
    \  ## First check: Is this split of the dataset homogeneous?\n    if len(cnt)\
    \ == 1:\n        return next(iter(cnt))  # next input data set, or raises StopIteration\
    \ when EOF is hit.\n\n    ## Second check: Is this split of the dataset empty?\
    \ if yes, return a default value\n    elif df.empty or (not attribute_names):\n\
    \        return default_class  # Return None for Empty Data Set\n\n    ## Otherwise:\
    \ This dataset is ready to be divided up!\n    # Get Default Value for next recursive\
    \ call of this function:\n    default_class = max(cnt.keys())  # No of YES and\
    \ NO Class\n\n    # Compute the Information Gain of the attributes:\n    gainz\
    \ = []\n    for attr in attribute_names:\n        ig = information_gain(df, attr,\
    \ target_attribute, default_class)\n        gainz.append(ig)\n        print(f\"\
    Gain of {attr} is : {ig}\")\n\n    index_of_max = gainz.index(max(gainz))  # Index\
    \ of Best Attribute\n    best_attr = attribute_names[index_of_max]  # Choose Best\
    \ Attribute to split on\n    print(f\"Attribute with the maximum gain is: {best_attr}\"\
    )\n\n    # Create an empty tree, to be populated in a moment\n    tree = {best_attr:\
    \ {}}  # Initiate the tree with best attribute as a node\n    remaining_attribute_names\
    \ = [i for i in attribute_names if i != best_attr]\n\n    # Split dataset-On each\
    \ split, recursively call this algorithm.Populate the empty tree with subtrees,\
    \ which\n    # are the result of the recursive call\n    for attr_val, data_subset\
    \ in df.groupby(best_attr):\n        subtree = id3(data_subset, target_attribute,\
    \ remaining_attribute_names, default_class, best_attr)\n        tree[best_attr][attr_val]\
    \ = subtree\n    return tree\n\nfrom pprint import pprint\ntree = id3(df, t, attribute_names)\n\
    print(\"Resultant Decision Tree\")\npprint(tree)\n\ndef classify(instance, tree,\
    \ default=None):\n    attribute = next(iter(tree))  # Outlook/Humidity/Wind\n\
    \    if instance[attribute] in tree[attribute].keys():  # Value of the attribute\
    \ in set of Tree keys\n        result = tree[attribute][instance[attribute]]\n\
    \        if isinstance(result, dict):  # this is a tree, delve deeper\n      \
    \      return classify(instance, result)\n        return result  # this is a label\n\
    \    return default\n```\n\n## Output\n\n**Input Data Set is:**\n\n| Outlook |\
