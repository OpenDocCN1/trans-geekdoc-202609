    # K-means Clustering


    It is an iterative clustering algorithm that helps us to find the highest value
    for every iteration. In the beginning, the desired number of the cluster has been
    selected, and then the data points will be clustered into k groups. A larger the
    k-value means a smaller size of groups with more granularities. Lower the k-value
    means the large size of groups with fewer granularities. The output of the algorithm
    is a group of labeled classes and the new data points will be assigned to one
    of the classes. Generally in the k-means clustering for every group a centroid
    will be defined. The centroid is the heart of the cluster which is used to capture
    the closest points to them and then add them to the cluster.


    # K-Nearest neighbors


    K-the nearest neighbor is the simplest algorithm and it is different from other
    machine learning algorithms because it does not produce any model. This algorithm
    is going to store all possible cases and then classify the new data points based
    on similarity measures. When the size of the training data is large, the algorithm''s
    speed improves.


    # Principal Components Analysis


    PCA is a technique of dimensionality reduction of the dataset. There is a possibility
    that the dataset consists of many variables and these variables are correlated
    to each other either less or more. The same concept is repeated and done by transforming
    and bringing the variables to a whole new set of variables, which are called the
    principal components and are even termed to be orthogonal, ordered in such a way
    that the retention of variation which is present in the original variables can
    be decreased as we try to move down in the proper order. So, by following this
    particular way, the 1st principal component retains the most and maximum variation
    that was earlier present in the original components. The principal components
    are known to be the eigenvectors of a covariance matrix, and hence they are even
    called Most importantly, the dataset is based on what the PCA techniques are to
    be used and must be scaled. The result also turns out to be sensitive based on
    the relative scaling. As a layman, it can be termed as a method of summarizing
    the data. Just imagine having some wine bottles on your dining table. Each wine
    would be described only by its attributes that are color, age, strength, and so
    on. But eventually, redundancy will arise may be because many of them would be
    measured based on the related properties.


    # Summary


    The complete chapter has been summarized in the following points:


    - Statistical learning is a combination of statistics and machine learning.

    - SupervisedStatistical statistical learning is used to build a statistical model
    for predicting the output using the given input datasets.

    - In unsupervisedStatistical statistical learning, input will be given but there
    is no supervised output and this type of learning is best suitable to understand
    the structure and the relationship between the data.

    - In the classification process, algorithms are trained on the training dataset
    and it can categorize the data into different classes.

    - Regression is the process of finding the correlation between the dependent and
    independent variables.

    - Regression algorithms are used for the prediction of house prices, stock predictions,
    weather forecasting and so on.

    - Feature selection refers to variable selection or attribute selection or subset
    selection and it is a process by which the data scientist will automatically select
    the relevant or useful features to use in the statistical-based learning methods.

    - The feature selection algorithm will select the most suitable features from
    the pool of features which can help reduce the prediction time and also improves
    the prediction accuracy.

    - Filter, wrapper an embedded methods are three approaches of to feature selection.

    - Model selection is a technique of selecting the best model which is suitable
    for the particular dataset or application.

    - Re-sampling methods, probabilistic measures and Bayesian information criterion
    are some popular methods of model selection.

    - Model evaluation is a method for checking the correctness of the model on the
    test dataset and it plays a big role in academic machine learning in research
    and industrial settings.


