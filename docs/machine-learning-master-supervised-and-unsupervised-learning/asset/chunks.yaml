    # An example of hierarchical clustering


    ## Example 2: Perform the hierarchical clustering using single linkage and complete
    linkage for the following dataset and plot the dendrogram for both the methods.


    **Dataset**: `{8, 11, 21, 29, 36}`


    ### Step-1 visualize the data set


    ![](image-1gxpmjc6.jpg)

    **Figure 3.20: data visualization**


    As we can see, it’s linear one-dimensional data.


    Let''s start to solve it first through the single-linkage method of agglomerative
    hierarchical clustering.


    ### Using linkage


    In this method, two objects with the least distance will be merged in a cluster.
    In each step, two clusters with the least distance will be merged:


    ![](image-ajp70g3a.jpg)

    **Figure 3.21: Single-linkage method of agglomerative hierarchical clustering**


    ![](image-vjyb8p7q.jpg)

    **Figure 3.22: The dendrogram of the single-linkage method of agglomerative hierarchical
    clustering.**


    By using single linkage two clusters are formed:


    *   **Cluster 1**: `(8, 11)`

    *   **Cluster 2**: `(21, 29, 36)`


    ### Using the complete linkage


    In each step, two clusters providing the smallest maximum pairwise distance will
    be merged:


    ![](image-fjxmued1.jpg)

    **Figure 3.23: The complete-linkage method of agglomerative hierarchical clustering
    draw dendrogram**


    ![](image-zzjcwcpw.jpg)

    **Figure 3.24: The dendrogram of the complete-linkage method of agglomerative
    hierarchical clustering**


    Using complete linkage two clusters are formed:


    *   **Cluster 1**: `(8, 11, 21)`

    *   **Cluster 2**: `(29, 36)`


    Hierarchical clustering is often used if a hierarchy is required by the application,
    like taxonomy design. In terms of storage and computation, such clustering techniques
    are expensive.


    # Association rule learning


    Association rule learning is another technique of unsupervised learning. This
    technique is used to find the relation, association, and/or dependencies between
    the data items. This technique uses various rules to find useful relations between
    the dataset in a database. Association rule learning is beneficial for the product-based
    business organization because mapping relations between different products can
    improve their sale and they can earn more profit. Web usage mining, market basket
    analysis, and continuous production analysis are some important applications of
    association rule mining.


    Market basket analysis is a popular application of association rule mining. Almost
    in all the supermarkets, this approach is used to improve sales. We can understand
    this by observing the product display strategy of a supermarket. All the products
    that can be purchased together are put in the same or nearby place. For example,
    if a customer purchases bread, he will possibly buy butter, eggs, or milk as well,
    so these items are thus stored inside or often near a shelf. Consider the following
    diagram:


    ![](image-gycyh0o7.jpg)

    **Figure 3.25: Market basket analysis**


    There are three types of association rule learning algorithms:


    *   **Apriori**

    *   **Eclat**

    *   **F-P Growth Algorithm**


    Before learning these algorithms, we will understand the working of association
    rule learning.


    ## Working of the association rule learning


    Working of the association rule learning is based on the if and else statements,
    like:


    ![](image-4bs0ssth.jpg)

    **Figure 3.26: Association rule learning**


    In this technique, the statement ‘If’ is referred to as **antecedent**, and the
    ‘Then’ statement is referred to as **consequent**. The relationship or association
    between two items, that can be found through the If-Then relation is called the
    single cardinality relationship. If the number of items increases. It''s all about
    establishing rules and as the number of things increases, it also increases cardinality.
    So, there are many metrics to quantify the associations between thousands of data
    objects.


    Below, these metrics are given:


    *   **Support**

    *   **Confidence**

    *   **Lift**


    Let''s grasp each of them:


    ### Support


    It can be defined as a frequency of elements `X` that appears in a dataset in
    a fraction of transaction `T`. It can be express through the following equation:


    ![](image-ev8xrdmv.jpg)


    ### Confidence


    Confidence is a property to identify the probability of trueness of the association
    rules. In another word, we can say that the confidence property tells us how often
    the elements `X` and `Y` take place together in the database when the frequency
    of element `X` is given. It can be calculated through the following equation:


    ![](image-fhhvafzd.jpg)


    ### Lift


    Lift is another property of the association rule which is used to understand the
    strength of association rule. It can be calculated by finding the ratio of the
    observed support of elements `X` and `Y` and the expected support of elements
    `X` and element `Y` when they are independent. The mathematical representation
    of the lift property is shown through the following equation:


    ![](image-jgbs0s8r.jpg)


    The value of lift property can be categorized into three ways:


    *   If `Lift > 1`, it signifies the degree of dependency up to which the element
    `X` and element `Y` is dependent.

    *   If `Lift < 1`, it means that one element is harming another one or we can
    say item `X` is the replacement of item `Y` and vice-versa.

    *   If `Lift = 1`: it means the probability of the occurrence of antecedent (If)
    and consequent (Then) is independent of each other.


    # Apriori Algorithm


    Apriori algorithm was proposed by R. Agarwal and Shrikant in the year 1994. Generally,
    this algorithm is used for market basket analysis. It helps to find the products
    that can be bought together by the consumer from the market. It also plays an
    important role in the healthcare sector to find the reaction of drugs on the patients.


    The databases which contain the transactions are used by the Apriori algorithm
    to generate the association rules by analyzing the available in the database.
    Association rules generated by the algorithm are used to find how weakly/strongly
    two items are connected. This technique uses two approaches to find the ‘frequent
    itemsets’ from databases, one is breadth-first search and another is Hash Tree
    Finding the from databases is an iterative process.


    ## Frequent Itemset


    In a transactional database, the itemsets whose support value is greater than
    the predefined threshold or user-defined minimum support value is called **Frequent
    Itemset**.


    For example, in a database, two transactions `T1` and `T2` are such that:


    `T1 = {1, 3, 4, 5, 6, 7}` and `T2 = {2, 5, 7}`;


    In these two transactions, `5` and `7` are the **Frequent Itemset**.


    In a transactional dataset, if `P1` and `P2` together is a frequent itemset then
    `P1` and `P2` individually should be frequent itemset.


