    # K-means 聚类


    这是一种迭代聚类算法，可帮助我们找到每次迭代的最高值。起初，会选择所需的聚类数量，然后将数据点聚类成 k 个组。较大的 k 值意味着组的规模较小，粒度更细。较低的
    k 值意味着组的规模较大，粒度较粗。算法的输出是一组带标签的类别，新数据点将被分配到其中一个类别中。通常在 K-means 聚类中，每个组都会定义一个质心。质心是聚类的核心，用于捕获离它们最近的点，然后将它们添加到聚类中。


    # K-近邻


    K-近邻是最简单的算法，它与其他机器学习算法不同，因为它不产生任何模型。该算法将存储所有可能的情况，然后基于相似度度量对新数据点进行分类。当训练数据的规模较大时，算法的速度会提高。


    # 主成分分析


    PCA 是一种数据集降维技术。数据集可能包含许多变量，这些变量彼此之间或多或少都存在相关性。通过转换并将变量引入一组全新的变量中，即主成分，它们被称为正交成分，并按特定顺序排列，使得原始变量中存在的变异保留量随着我们按顺序向下移动而减少。因此，通过遵循这种特定方式，第
    1 个主成分保留了先前存在于原始成分中最多、最大的变异。主成分被称为协方差矩阵的特征向量，因此它们甚至被称为……最重要的是，数据集基于所使用的 PCA 技术，且必须进行缩放。结果也会根据相对缩放而表现出敏感性。外行来讲，它可以被称为一种汇总数据的方法。想象一下你的餐桌上放着一些酒瓶。每种酒仅由其属性描述，如颜色、年份、浓度等。但最终可能会出现冗余，因为许多属性可能基于相关特性进行测量。


    # 总结


    本章完整内容总结如下：


    - 统计学习是统计学与机器学习的结合。

    - 有监督统计学习用于利用给定的输入数据集构建统计模型以预测输出。

    - 在无监督统计学习中，会给出输入，但没有受监督的输出，这种学习类型最适合理解数据之间的结构和关系。

    - 在分类过程中，算法在训练数据集上进行训练，并能将数据分类为不同的类别。

    - 回归是寻找因变量和自变量之间相关性的过程。

    - 回归算法用于房价预测、股票预测、天气预报等。

    - 特征选择指变量选择、属性选择或子集选择，是数据科学家自动选择相关或有用特征以用于基于统计的学习方法的过程。

    - 特征选择算法将从特征池中选择最合适的特征，这有助于减少预测时间并提高预测准确性。

    - 过滤法、包装法和嵌入法是特征选择的三种方法。

    - 模型选择是选择适合特定数据集或应用的最佳模型的技术。

    - 重采样方法、概率度量和贝叶斯信息准则是一些流行的模型选择方法。

    - 模型评估是一种在测试数据集上检查模型正确性的方法，它在学术机器学习研究和工业界中发挥着重要作用。


