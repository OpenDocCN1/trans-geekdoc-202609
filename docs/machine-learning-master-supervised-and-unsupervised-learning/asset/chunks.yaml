    SARSA is an on-policy algorithm where, in the current state, S an action, A is
    taken and the agent gets a reward, R and ends up in next state, S'' and takes
    action, A'' in S''. Therefore, the tuple (S, A, R, S'', A'') stands for the acronym
    SARSA.


    Model-free methods learn directly from the experience; this implies they act in
    reality.


    Model-Based method utilizes fewer interactions with the real environment during
    the learning stage.


    Learning the model comprises of executing actions in the real environment and
    gather feedback.


    A variation of the Model-Based RL is called Dyna Architecture.


