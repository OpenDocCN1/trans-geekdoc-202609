    \ we seek to identify (or estimate) a continuous variable `y` associated with\
    \ a given input vector `x`.\n\n*   `y` is called the dependent variable.\n*  \
    \ `x` is called the independent variable.\n\n![](image-9ji1yrpb.jpg)\n\n### Loess/Lowess\
    \ Regression\n\nLoess regression is a non-parametric technique that uses locally\
    \ weighted regression to fit a smooth curve through points in a scatter plot.\n\
    \n![](image-jrxmolyl.jpg)\n\n### Lowess Algorithm\n\nLocally weighted regression\
    \ is a very powerful non-parametric model used in statistical learning.\n\nGiven\
    \ a dataset `X`, `y`, we attempt to find a model parameter `β(x)` that minimizes\
    \ the residual sum of weighted squared errors.\n\nThe weights are given by a kernel\
    \ function (`k` or `w`) which can be chosen arbitrarily.\n\n#### Algorithm\n\n\
    1.  Read the given data sample to `X` and the curve (linear or non-linear) to\
    \ `Y`.\n2.  Set the value for smoothening parameter or the free parameter say\
    \ `τ`.\n3.  Set the bias / Point of interest set `x0` which is a subset of `X`.\n\
    4.  Determine the weight matrix using:\n    ![](image-8fnziujm.jpg)\n5.  Determine\
    \ the value of model term parameter `β` using:\n    ![](image-slpiqqlf.jpg)\n\
    6.  Prediction `= x0 * β`:\n\n### Program\n\n```python\nimport numpy as np\nimport\
    \ matplotlib.pyplot as plt\n\ndef local_regression(x0, X, Y, tau):\n    # add\
    \ bias term\n    x0 = np.r_[1, x0]  # Add one to avoid the loss in information\n\
    \    X = np.c_[np.ones(len(X)), X]\n\n    # fit model: normal equations with kernel\n\
    \    xw = X.T * radial_kernel(x0, X, tau)  # XTranspose * W\n    beta = np.linalg.pinv(xw\
    \ @ X) @ xw @ Y  # @ Matrix Multiplication or Dot Product\n\n    # predict value\n\
    \    return x0 @ beta  # @ Matrix Multiplication or Dot Product for prediction\n\
    \ndef radial_kernel(x0, X, tau):\n    return np.exp(np.sum((X - x0) ** 2, axis=1)\
    \ / (-2 * tau * tau))\n    # Weight or Radial Kernal Bias Function\n\nn = 1000\n\
    # generate dataset\nX = np.linspace(-3, 3, num=n)\nY = np.log(np.abs(X ** 2 -\
    \ 1) + .5)\n\n# jitter X\nX += np.random.normal(scale=.1, size=n)\n\ndomain =\
    \ np.linspace(-3, 3, num=300)\n\ndef plot_lwr():\n    # prediction through regression\
    \ for tau = 10.0\n    prediction = [local_regression(x0, X, Y, 10.0) for x0 in\
    \ domain]\n    fig, axs = plt.subplots(2, 2, figsize=(10, 8))\n\n    axs[0, 0].plot(X,\
    \ Y, 'o', alpha=0.5)\n    axs[0, 0].plot(domain, prediction, color='red')\n  \
    \  axs[0, 0].set_title(f\"tau = 10.0\")\n\n    # prediction through regression\
    \ for tau = 1.0\n    prediction = [local_regression(x0, X, Y, 1.0) for x0 in domain]\n\
    \    axs[0, 1].plot(X, Y, 'o', alpha=0.5)\n    axs[0, 1].plot(domain, prediction,\
    \ color='red')\n    axs[0, 1].set_title(f\"tau = 1.0\")\n\n    # prediction through\
    \ regression for tau = 0.1\n    prediction = [local_regression(x0, X, Y, 0.1)\
    \ for x0 in domain]\n    axs[1, 0].plot(X, Y, 'o', alpha=0.5)\n    axs[1, 0].plot(domain,\
    \ prediction, color='red')\n    axs[1, 0].set_title(f\"tau = 0.1\")\n\n    # prediction\
    \ through regression for tau = 0.01\n    prediction = [local_regression(x0, X,\
    \ Y, 0.01) for x0 in domain]\n    axs[1, 1].plot(X, Y, 'o', alpha=0.5)\n    axs[1,\
    \ 1].plot(domain, prediction, color='red')\n    axs[1, 1].set_title(f\"tau = 0.01\"\
    )\n\n    fig.tight_layout()\n    return plt\n\nplot_lwr()\n```\n\n### Output\n\
