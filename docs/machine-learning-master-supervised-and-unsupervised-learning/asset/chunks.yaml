    # Monte Carlo Policy Evaluation


    We start by considering Monte Carlo techniques for learning the state-value function
    for a given policy. Review that the estimation of a state is the expected return—expected
    combined future discounted reward—beginning from that state. A conspicuous method
    to evaluate it for a fact, at that point, is basically to average the returns
    observed after visits to that state. As more returns are seen, the average should
    converge to the expected value. This thought underlines all the Monte Carlo techniques.


    Specifically, assume that we wish to estimate `V^π(s)`, the value of a state ‘s’
    under policy `π`, given a set of episodes acquired by following `π` and passing
    through ‘s’. Each occurrence of state ‘s’ in an episode is known as a visit to
    ‘s’. The every-visit MC technique estimates `V^π(s)` as the average of the returns
    following all the visits to `s` in a set of episodes. Inside a given episode,
    the first time ‘s’ is visited as the primary visit to `s`. The first-visit MC
    method averages just the returns following first visits to `s`. These two Monte
    Carlo techniques are fundamentally the same as however have marginally extraordinary
    hypothetical properties.


    ## First Visit Monte Carlo


    Average returns just for the first time `s` is visited in an episode.


    Here is a step-by-step perspective on how the algorithm works:


    1.  Initialize the policy, state-value function.

    2.  Start by generating an episode according to the current policy.

    3.  Keep track of the states experienced through that episode.

    4.  Select a state in 2.a

    5.  Add to a list the return received after the first occurrence of this state.

    6.  Average over all returns.

    7.  Set the value of the state as that computed average.

    8.  Repeat step 3.

    9.  Repeat 2-4 until satisfied.


    ## Every Visit Monte Carlo


    Average returns for every time `s` is visited in an episode.


    For this algorithm, we just change step 3.a of First Visit to Monte Carlo algorithm
    to add to a list the return received after every occurrence of this state.


    Here is a step-by-step view of how the algorithm works:


    1.  Initialize the policy, state-value function.

    2.  Start by generating an episode according to the current policy.

    3.  Keep track of the states encountered through that episode.

    4.  Select a state in 2.a

    5.  Add to a list the return received after every occurrence of this state.

    6.  Average overall returns.

    7.  Set the value of the state as that computed average.

    8.  Repeat step 3.

    9.  Repeat 2-4 until satisfied.


    ## Example


    Let us consider a simple example to understand this concept. Suppose there is
    an environment where we have 2 states - A and B. Let us say we observed 2 sample
    episodes:


    ```

    A +3 -> A +2 -> B -4 -> A +4 -> B -3 ->

    B -2 -> A +3 -> B -3 ->

    ```


    `A+3 => A` indicates a transition from state A to state A, with a reward +3. Let
    us find out the value function using both the methods:


    **Table 5.1: Example first and every visit Monte Carlo**


    # Policy Iteration and Value Iteration


    In policy iteration, a policy is chosen at random and a value function corresponding
    to it is found, then a new (improved) policy is found based on the previous value
    function, and so on until an optimal policy is found.


    In value iteration, a value function is chosen at random, then a new (improved)
    value function is found in an iterative process until the optimal value function
    is found, and then optimal policy is derived from that optimal value function.


    Policy iteration is based on the principle of "policy evaluation → policy improvement."


    The value iteration method is based on the principle of "optimal value function
    → optimal policy."


    ## Policy Iteration


    Once a policy, `π`, has been improved using `V_π` to yield a better policy, `π''`,
    we can then compute `V_π''` and improve it again to yield an even better `π''''`.
    We can thus obtain a sequence of monotonically improving policies and value functions
    as shown in equation (7):


    ![Policy Iteration Diagram](image-qgsylpow.jpg)


    Where `→` denotes a policy evaluation and `→` denotes a policy improvement. Each
    policy is guaranteed to be a strict improvement over the previous one (unless
    it is already optimal). Because a finite MDP has only a finite number of policies,
    this process must converge to an optimal policy and optimal value function in
    a finite number of iterations.


    This way of finding an optimal policy is called policy iteration. The complete
    algorithm is given below in figure. Note that each policy evaluation, itself an
    iterative computation, is started with the value function for the previous policy.
    This typically results in a great increase in the speed of convergence of policy
    evaluation (presumably because the value function changes a little from one policy
    to the next).


    Here’s a step-by-step Policy iteration (using iterative policy evaluation) for
    `V^*`:


    ![Policy Iteration Algorithm](image-d67qz7wa.jpg)


    **Figure 5.6: Policy iteration (using iterative policy evaluation)**


    Policy iteration often converges in surprisingly few iterations. The policy improvement
    theorem assures us that these policies are better than the original random policy.
    In this case, however, these policies are not simply better, but optimal, proceeding
    to the terminal states in the minimum number of steps. In this example, policy
    iteration would find the optimal policy after one iteration.


    ## Value Iteration


    One drawback of the policy iteration is that each of its iterations involves policy
    evaluation, which may itself be a protracted iterative computation requiring multiple
    sweeps through the state set. If policy evaluation is done iteratively, then convergence
    exactly to `V_π` occurs only in the limit. Must we wait for exact convergence,
    or can we stop short of that?


    The policy evaluation step of policy iteration can be truncated in several ways
    without losing the convergence guarantees of policy iteration. One important case
    is when policy evaluation is stopped after just one sweep (one backup of each
    state). This algorithm is called value iteration. It can be written as a particularly
    simple backup operation that combines the policy improvement and truncates policy
    evaluation steps:


    ![Value Iteration Backup](image-v7i8p1to.jpg)


    For all `s ∈ S`. For arbitrary `V_0`, the sequence `V_k` can be shown to converge
    to `V^*` under the same conditions that guarantee the existence of `V^*`.


    Like policy evaluation, value iteration formally requires an infinite number of
    iterations to converge exactly to `V^*`. In practice, we stop once the value function
    changes by only a small amount in a sweep. Figure 5.7 gives the complete value
    iteration algorithm with this kind of termination condition.


    Value iteration effectively combines, in each of its sweeps, one sweep of policy
    evaluation and one sweep of policy improvement. Faster convergence is often achieved
    by interposing multiple policy evaluation sweeps between each policy improvement
    sweep. In general, the entire class of the truncated policy iteration algorithms
    can be thought of as sequences of sweeps, some of which use the policy evaluation
    backups and some of which use the value iteration backups. Since the max operation
    is the only difference between these backups, this just means that the max operation
    is added to some sweeps of policy evaluation.


    ![Value Iteration Algorithm](image-a1aszi2y.jpg)


    **Figure 5.7: Value iteration**

    '
