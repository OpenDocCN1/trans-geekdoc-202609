    # Introduction to Statistical Learning


    The term machine learning brings up images of robots, artificial intelligence,
    and flying cars, while statistics draws forth charts with bell curves and tracking
    of sports game outcomes. In reality, however, these two fields overlap significantly,
    as they both deal with the analysis of data. Statistical modeling and machine
    learning can even be applied to similar situations and work together to provide
    solutions to a variety of questions. Statistical learning is a combination of
    statistics and machine learning as shown in the Figure


    ![](image-r5gu154r.jpg)


    **Figure 4.1: Overview of statistical learning**


    The concept of t-tests, ANOVA, p-values testing, and so on, belongs to classical
    statistics which was introduced almost a hundred years ago. These methods were
    designed at a time when mathematics was purely based on pen and paper and analysis
    of the data was done for small samples only. But things have changed drastically
    and the computer has taken part everywhere in human lives. Computational speed
    and memory have become available, affordable, and accessible. Increased usage
    of the internet and information transformation became a regular practice for computer
    users but the one thing which has not changed are the classical statistical methods
    for the analysis of the data and its important tool for the researchers. Slowly
    many areas of industry migrated to an alternative statistical framework which
    is popular with the name Statistical learning is easily adopted by engineers,
    computer science users, and people related to the physics background. The statistical
    learning approach is more flexible compared to the classical statistical-based
    approach as there is more scope of learning in itself. The comparative representation
    of both approaches is represented in Figure


    ![](image-p47u6f3h.jpg)


    **Figure 4.2: Classical Statistics Vs Statistical learning**


    Statistical learning is a collection of tools that are used to understand different
    data. The tools can be categorized as supervised and unsupervised tools. Supervised
    statistical learning is used to build a statistical model for predicting the output
    using the given input datasets. Supervised statistical learning is used in various
    areas such as medical, business-related applications and public policies, and
    so on. In unsupervised statistical learning, input will be given but there is
    no supervised output and this type of learning is best suitable to understand
    the structure and the relationship between data.


    For a better understanding of statistical learning, let us take an example. Suppose
    a client hired a statistical advisor who gives new ideas to improve the sales
    of the product. To improve the sale of the product client has assigned some budget
    for the advertisement purpose and the mode of the advertisements is television,
    radio, and newspaper. Therefore, the statistical advisor has information about
    the budget and sales of the product in different cities which is displayed in
    Figure


    ![](image-ivxdq0s9.jpg)


    **Figure 4.3: Example of Advertising dataset**


    It is difficult to increase the sale of the product directly. So the statistical
    advisor has to do some analysis. If we observe, the advertising budget can be
    controlled and distributed according to the requirements. It is visible that there
    is a relationship between the advertising budget and the sales of the product.
    If the statistical advisor gives proper advice about the distribution of the advertisement
    budget, there is a possibility of an increase in the sales of the product. So
    the main goal of the statistical advisor is to develop a model that can predict
    the sales of the product according to the assigned budget for different advertising
    media.


    In the above example, the advertising budget is an input variable which is denoted
    by `X` and the sales information is an output variable which is denoted by `Y`.
    The input variable is also called features, independent variable, predictors,
    and so on. The output variables are sometimes referred to as dependent variables
    or response variables, and so on. To distinguish between the different input variables,
    subscripts could be used such as `X1` can represent the budget of TV advertisement.
    In the same way, `X2` and `X3` can be used to represent the budget of radio and
    newspaper advertisements.


    Suppose there is a relationship between `X` and `Y` then it can be represented
    as:


    `Y = f(X) + ε` (1)


    Here `f` is an unknown function that gives systematic information. `ε` represents
    the random error and it is independent of `X` with mean value zero.


    ## Estimation of Unknown Function f


    `f` is used to estimate either prediction or inference.


    ### Prediction


    In some scenarios, there is a possibility that input sets are available but still
    it is difficult to obtain the output. Therefore, to estimate the value of `Y`
    the following can be used:


    `Ŷ = f̂(X)` (2)


    Where `f̂` represents the estimation of `f` and `Ŷ` represents the resultant predicted
    value of `Y`. The accuracy of `Ŷ` for the prediction of `Y` always depends on
    two things: reducible error and irreducible error. It is always possible that
    `f̂` is not the perfect estimation of `f` and this imperfection may introduce
    error. The error can be reduced if we use appropriate statistical learning algorithms
    and the accuracy of `f̂` can be improved. Therefore it is possible that the estimated
    response could be in this form `Ŷ = f(X)`. But there could still be some error
    because `Y` is a function of `ε` and it cannot be predicted by `X`. So the variability
    which is associated with `ε` can also affect the accuracy of the predicted value
    and this type of error is known as an irreducible error and it is introduced by
    `ε`.


    ### Inference


    If the value of `X` changes, it affects the value of `Y`. In that case, if we
    want to estimate the value of `f`, we need to determine the relationship between
    `X` and `Y`. In that situation `f` will not be considered as a black box and we
    need to find the answer of following questions:


    *   Find the particular predictor which is associated with the dependent variable.

    *   Type of relationship between the predictor and the dependent variable.

    *   Can an identified relation be represented using a linear equation?


    Consider the above-discussed sales example and try to relate the possibilities
    and try to answer to the following questions:


    *   The type of media is contributing to sales.

    *   Find the name of the media which is generating the highest sales.

    *   The relationship between sales and TV advertisement.


    This type of scenario falls into the inference category. Now we will discuss another
    example:


    If a person wants to buy a new house, the prediction variables can be the availability
    of schools nearby, pollution, air quality, distance from the office, size of the
    house, gated community or an independent house, and so on. In this scenario, each
    variable affects the cost of the house and the most important thing is to find
    the value of each independent variable that affects the cost of the house. A person
    might be interested to find the extra cost of the house if it is east facing or
    river facing. This is an example of inference. If a person is simply interested
    to find that the cost of the house is undervalued or overestimated then this is
    an example of a prediction based problem.


    Therefore, according to our estimation goal (prediction or inference), there are
    different ways of estimating the value of `f`. There are two different approaches:
    linear and non-linear. The linear model is easy and simple but sometimes doesn’t
    produce accurate results. Non-linear models produce accurate predictions for `Y`
    but the inference is a challenging task. Our main aim is to find a statistical
    learning method for the training data that can estimate the unknown function `f̂`
    or mathematically we can say find a function such that `Y = f̂(X)` for any observation
    of `(X, Y)`. This task is categorized into two categories: parametric and non-parametric.

    '
