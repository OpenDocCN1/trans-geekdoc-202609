    \n**一个 4 输入神经元的权重分别为 1、2、3 和 4。传递函数是线性的，比例常数等于 2。输入分别为 4、10、5 和 20。输出将是多少？**\n\
    \n- 238\n- 76\n- 119\n- 123\n\n**层次聚类是以下哪项的示例：**\n\n- 互斥划分\n- 凝聚聚类\n- 重叠聚类\n-\
    \ 概率聚类\n\n**在语言理解中，知识层级不包括**\n\n- 语音层\n- 句法层\n- 经验层\n- 逻辑层\n\n**什么以一组属性描述的对象作为输入？**\n\
    \n- 树\n- 图\n- 决策图\n- 决策树\n\n**不同的学习方法不包括**\n\n- 记忆\n- 类比\n- 演绎\n- 引入\n\n**机器学习有多少种类型？**\n\
    \n- 1\n- 2\n- 3\n- 4\n\n**博弈算法中，哪项用于效用函数？**\n\n- 线性多项式\n- 加权多项式\n- 多项式\n- 线性加权多项式\n\
    \n## 填空题\n\n- 半监督学习可能指代归纳式或 _______________ 学习。\n- 马尔可夫选择过程是 _______________ 结果的模型。\n\
    - Q-learning 算法有 _______________ 个步骤。\n- SARSA 这个首字母缩写代表 _______________。\n- 一种建立在各种模型参数之上的基于模型的学习方法称为\
    \ _______________。\n\n## 简答题\n\n- 什么是学习系统？\n- 解释机器学习的目标。\n- 什么是 K 近邻？\n- 解释过拟合。\n\
    - 监督学习和无监督学习有什么区别？\n\n## 论述题\n\n- 线性判别分类和非线性判别分类有什么区别？\n- 简述贝尔曼方程。\n- 什么是装袋和提升？KNN\
    \ 与 K-means 聚类有何不同？\n- 解释开发学习系统的各个方面。\n- 解释生成式概率分类。\n- 什么是贝叶斯定理？它在机器学习背景下有何用处？\n\
    - 生成式模型和判别式模型有什么区别？\n- 解释 AdaBoost 提升算法。什么是支持向量机？简要解释。\n- 解释感知机。\n- 解释 EM 算法。\n\
    - 什么是 PCA？\n- 解释隐马尔可夫模型（HMM）。什么是谱聚类？简要解释分段索引。\n\n---\n\n# 模拟试卷 – 3\n\n## 选择题\n\
    \n**ML 是由学习算法组成的 AI 领域，这些算法？**\n\n- 提高其性能\n- 在执行某项任务时\n- 随着时间积累经验\n- 以上全部\n\n\
    **在执行回归或分类时，以下哪项是预处理数据的正确方式？**\n\n- 归一化数据 → PCA → 训练\n- PCA → 归一化 PCA 输出 → 训练\n\
    - 归一化数据 → PCA → 归一化 PCA 输出 → 训练\n- 以上都不是\n\n**以下哪项是一种基于装袋思想的广泛使用且有效的机器学习算法？**\n\
    \n- 决策树\n- 回归\n- 分类\n- 随机森林\n\n**以下哪项是决策树的缺点？**\n\n- 因子分析\n- 决策树对异常值具有鲁棒性\n- 决策树容易过拟合\n\
    - 以上都不是\n\n**为了求函数的最小值或最大值，我们将梯度设为零，因为：**\n\n- 函数在极值处的梯度值总是为零\n- 取决于问题类型\n- A\
    \ 和 B 皆是\n- 以上都不是\n\n**以下哪项是选择主成分数量 \"k\" 的合理方法？**\n\n- 选择最小的 k 值，使得至少保留 99% 的方差。\
    \ – 答案\n- 选择 k 为 m 的 99%（k = 0.99*m，四舍五入到最接近的整数）。\n- 选择最大的 k 值，使得保留 99% 的方差。\n\
    - 使用肘部法则\n\n**执行交叉验证的目的是什么？**\n\n- 评估模型的预测性能\n- 判断训练模型在测试数据上的样本外表现\n- A 和 B 皆是\n\
