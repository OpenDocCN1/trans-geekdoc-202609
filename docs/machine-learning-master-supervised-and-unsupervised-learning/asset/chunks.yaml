- raw: "  Summary    The complete chapter has been summarized in the following points:\
    \     Unsupervised learning is a methodology for machine learning, where the model\
    \ does not need to be supervised.    Almost all types of the patterns can be identified\
    \ through unsupervised machine learning.    Association and clustering are the\
    \ two types of unsupervised machine learning.    Exclusive, agglomerative, overlapping,\
    \ and probabilistic are the four methods of clustering.    Hierarchical clustering,\
    \ k-means clustering, and the Gaussian Mixture Model are some important types\
    \ of clustering.    For a large dataset, association rules allow us to create\
    \ associations between data objects.    Labeled data is used toQ train the model\
    \ in supervised learning, whereas in unsupervised learning unlabeled data is used\
    \ to train the model.    In a dataset that is valuable for detecting suspicious\
    \ transactions, anomaly detection may uncover essential data points.    The greatest\
    \ downside to the unsupervised learning is that the detailed knowledge about data\
    \ sorting cannot be accessed.  \n\n  Exercise (MCQs)     Technique used in unsupervised\
    \ learning accepts \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_, discovers new patterns of information that\
    \ were previously unknown or undetected.     Unlabeled data items    Labeled data\
    \ items    Classified data items    Clustered data items    Which of the following\
    \ is/are the application/s of unsupervised learning?     Clustering    Anomaly\
    \ detection    Neural networks    All of the above    Choose a correct statement\
    \ regarding clustering:     Clustering is an unsupervised ML technique    Clustering\
    \ is a supervised ML technique    Labeled data is used for the clustering technique\
    \    All of the above are correct    In the k-mean clustering algorithm k is a:\
    \     Positive integer    Negative integer    Random number    Complex number\
    \    The hierarchical clustering is an example of:     Exclusive partitioning\
    \    Agglomerative clustering    Overlapping clustering    Probabilistic clustering\
    \    The k-mean clustering is an example of:     Exclusive partitioning    Agglomerative\
    \ clustering    Overlapping clustering    Probabilistic clustering    The shortest\
    \ distance between the two closest points of two different clusters is considered\
    \ as:     Single linkage    Complete linkage    Average linkage    Centroid linkage\
    \    The farthest distance between the two points of two different clusters is\
    \ considered as:     Single linkage    Complete linkage    Average linkage   \
    \ Centroid linkage    In a transactional database, the itemsets whose support-value\
    \ is greater than the predefined threshold or user-defined minimum support value\
    \ is called:     Frequent itemsets    Average itemsets    Regular itemset    Poor\
    \ itemsets    Probabilistic clustering is also known as:     Soft clustering \
    \   Hard clustering    Lenient clustering    Overlapping clustering  \n\n  Answers\
    \     a    d    a    a    b    a    a    b    a    a  \n\n  Short Answers Questions\
    \     Explain the difference between supervised and unsupervised learning.   \
    \ Define clustering also explain the difference between clustering and classification.\
    \    What are the various applications of the association rule learning?    Explain\
    \ the difference between the single linkage and complete linkage methods.    What\
    \ are the various advantages and disadvantages of the Apriori algorithm?  \n\n\
      Long answers questions     How to measure the distance between two clusters?\
    \ Explain its various methods in detail.    Write the various steps of the FP-growth\
    \ algorithm. Explain in detail.    Explain the step-by-step working of the agglomerative\
    \ hierarchical clustering.    Define GMM. Explain the working of the Gaussian\
    \ mixture model in detail.    Consider the following transactional dataset and\
    \ find the frequent patterns and generate the association rules using the FP-growth\
    \ Algorithm.    Algorithm. Algorithm.  Algorithm. Algorithm. Algorithm.  Algorithm.\
    \ Algorithm. Algorithm.  Algorithm. Algorithm.  Algorithm. Algorithm. Algorithm.\
    \  Algorithm. Algorithm. Algorithm. Algorithm.  Algorithm. Algorithm. Algorithm.\
    \ Algorithm.    Consider: Minimum support=50%, Minimum confidence=60%.  \n\nCHAPTER\
    \ 4    Introduction to Statistical Learning Theory    Statistical learning was\
    \ introduced in the 1960s and during that time it was a purely theoretical concept\
    \ of analyzing the various problems using the available datasets. In the 1990s\
    \ a new type of learning, the algorithm was introduced using the theoretical concept\
    \ of statistical learning and it became popular with the name support vector machine.\
    \ This new technique gave a new direction to statistical learning and since then\
    \ statistical learning is not only a theoretical approach for analysis but it\
    \ is also a tool for creating an algorithm for handling and estimating multidimensional\
    \ function. Statistical learning has a major role in different area such as industry,\
    \ medical science, and other finance-related industries. Now we will discuss some\
    \ examples of statistics learning problems:     Predicting if the patient who\
    \ is hospitalized due to a heart attack will get a second heart attack or not.\
    \ This prediction is based on the patient's age, gender, past clinical history,\
    \ diet, etc. and so on.    Predicting the stock market price in six months from\
    \ now according to the past performance and economic status of the company.   \
    \ Determining the numbers in a handwritten ZIP code, from a digitized image. \
    \   Estimation of the glucose level in the blood of a patient.    Detection of\
    \ the risk of prostate cancer, brain tumor, and lung cancer according to the clinical\
    \ reports of the patient.  \n\n  Structure    In this chapter, we will discuss\
    \ the following topics:     Statistical learning concepts    Feature selection\
    \    Model selection    Model evaluation    Supervised machine learning    Unsupervised\
    \ machine learning  \n\n  Objective    Statistical learning plays an important\
    \ role in data mining, artificial intelligence, and other disciplinary areas of\
    \ science and engineering. This chapter gives a general overview of the statistical\
    \ theory and different methods of feature selection and many more.  "
