    # Collaborative Filtering


    It is based on historical data; collaborative filtering does not require anything
    other than the users'' historical preferences on a set of items. The central assumption
    here is that users who have previously agreed tend to agree again in the future.
    In terms of user preference, it is usually expressed in two categories. An explicit
    rating is a rating given to an item by a user on a sliding scale, such as 5 stars
    for Titanic. This is the most direct way for users to express how much they like
    a product. Implicit Rating indicates a user''s preference indirectly, such as
    page views, clicks, purchase records, whether or not to listen to a music track,
    and so on.


    Collaborative filtering filters information by utilizing the system''s interactions
    and data collected from other users. It is based on the assumption that people
    who agreed on certain items'' evaluations are likely to agree again in the future.
    The idea is simple: when we''re looking for a new movie to watch, we often ask
    our friends for recommendations. We naturally place more trust in recommendations
    from friends who have similar tastes to our own.


    The so-called similarity index-based technique is used by the majority of collaborative
    filtering systems. Several users are chosen in the neighborhood-based approach
    based on their similarity to the active user. A weighted average of the ratings
    of the selected users is used to infer the active user. The relationship between
    users and items is the focus of collaborative-filtering systems. The similarity
    of items is determined by the similarity of their ratings by users who rated both
    items.


    All around us, we see the use of recommendation systems. These systems personalize
    our web experience by telling us what to buy, what movies to watch, who to friend,
    what songs to listen to, and so on. These recommendation systems use our shopping/watching/listening
    habits to predict what we might like in the future based on our past behavior.
    The most fundamental models for recommendation systems are collaborative filtering
    models, which are based on the assumption that people like things that are similar
    to other things they like and things that other people with similar tastes like.


    ![](image-x6lul5vi.jpg)

    **Figure 6.2: Example of collaborative filtering**

    Source: https://towardsdatascience.com/various-implementations-of-collaborative-filtering-100385c6dfe0


    ## Collaborative Filtering Classes


    The collaborative Filtering classes is divided into two types as follows:


    *   **User-based**: This measures the similarity of target users to other users.

    *   **Item-based**: This measures the similarity of items rated or interacted
    with by target users to other items.


    ## Types of Collaborative Filtering Techniques


    The CF techniques are broadly divided into two types as shown in Figure:


    *   Memory-based approach

    *   Model-based approach


    ![](image-xaygkuui.jpg)

    **Figure 6.3: Types of collaborative filtering approaches**


    ### Memory-based


    Memory-based CF approaches are classified into two categories: user-item filtering
    and item-item filtering as shown in Figure.


    ![](image-cldlosin.jpg)

    **Figure 6.4: Memory-based collaborative filtering approaches**


    A user-item filtering algorithm takes a specific user, finds users who are similar
    to that user based on rating similarity, and recommends items that those similar
    users liked. Item-item filtering, on the other hand, will take an item and find
    users who liked it, as well as other items that those users or similar users liked.
    It takes items and generates recommendations for other items.


    *   **User-Item Collaborative**: Users who are similar to you also liked.

    *   **Item-Item Collaborative**: Users who liked this item also liked.


    The main difference between the memory-based approach and the model-based techniques
    is that we are not learning any parameters using gradient descent (or any other
    optimization algorithm). The closest user or items are determined solely through
    the use of Cosine similarity or Pearson correlation coefficients, which are based
    solely on arithmetic operations.


    ### Model-based


    In this method, CF models are created using machine learning algorithms to predict
    the ratings of unrated items by users. This approach''s algorithms are further
    classified into three sub-types: Clustering-based, Matrix factorization based
    and Deep Learning as shown in Figure.


    ![](image-ixb9sbaf.jpg)

    **Figure 6.5: Model-based collaborative filtering approaches**


    ## Content-based Filtering


    Systems that use a content-based recommendation approach investigate a set of
    documents and/or explanations of items previously rated by a user and create a
    model or profile of that user''s interests based on the characteristics of the
    objects rated by that user. The profile is a structured representation of the
    user''s interests that is used to recommend new and interesting items.


    The recommendation process entails matching the attributes of a user profile to
    the attributes of a content object. As a result, the user''s level of interest
    in that object is represented by a relevant judgment. When a profile accurately
    reflects user preferences, it greatly improves the efficiency of an information
    access process. It could, for example, be used to filter search results by determining
    whether a user is interested in a specific Web page and, if not, preventing it
    from being displayed.

    '
