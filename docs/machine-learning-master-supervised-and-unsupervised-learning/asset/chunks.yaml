    # Model-based Reinforcement Learning


    我们应该考虑一个国际象棋游戏的例子：假设我们正在下一盘棋，我们走了一步，然后被迫等待对手走棋，接着我们走另一步，对手随之走棋，随后我们发现我们的第一步棋其实并不怎么好！如果我们在正常学习，老师会让我们悔棋，以便从错误中吸取教训。然而，实际上我们早就已经输了。


    另一方面，如果我们在大脑中复盘这些走法（这是每个人都会做的），并告诉自己：“假如我走这步，对手可以用那步应对，然后我再走这步”，我们就能避免上述所有情况。我们实际上是在基于我们对国际象棋认知的模型，在大脑中展开一棵搜索树，并从这棵树中挑选最有可能导致获胜的最佳走法。现在用
    AI 智能体取代我们自己，我们就得到了**基于模型的强化学习**。


    我们可以看到这将如何节省训练时间。显然，在反应灵敏的小型环境中（例如 Grid World）这并不明显，但对于复杂情况（例如任何 Atari 游戏），使用无模型
    RL 系统学习是枯燥乏味的；而另一方面，生成一套简化的动作集来构建模型，然后利用该模型来推演场景，效率要高得多。


    ## What is a Model?


    假设上，模型是我们对现实或所处环境的表征。在 RL 中，模型是指拥有 MDP `[S, A, P, R]` 的一个表征 `M`。这意味着拥有一个真实 MDP
    的版本 `I`（应该尽可能精确）。


    如果我们假设状态空间 `S` 和转移概率 `A` 是已知的，模型 `Mi` 将变为 `[S, A, Pi, Ri]`。因此根据模型 `Mi`，在执行动作 `A`
    后从状态 `S` 转移到状态 `S''`，取决于概率 `Pi(S'' | S, A)`；等价地，在状态 `S` 执行动作 `A` 获得奖励 `R''`，取决于函数
    `Ri(R'' | S, A)`。


    ## Difference between Model-Based and Model-Free


    无模型策略直接从经验中学习；这意味着它们要么在真实环境中（如机器人），要么在计算机上（如游戏）执行动作。然后它们从环境中累积奖励（无论正负），并更新其价值函数。


    这是与基于模型策略的关键区别。无模型程序在真实环境中行动以学习。另一方面，基于模型技术在学习阶段仅使用少量与真实环境的交互。其目标是基于这些交互构建模型，随后利用该模型来模拟进一步的场景——不是在真实环境中，而是通过将它们应用于构建的模型并获取该模型返回的结果。


    如前所述，这具有加速学习的优势，因为无需等待环境响应，也无需将环境重置到某个状态以继续学习。然而，缺点是如果模型不正确，我们就冒着偏离真实情况的风险。另一个重要点是，基于模型的技术无论如何仍会使用无模型系统，要么用来构建模型，要么用于规划/模拟阶段。


    ## Learning the Model


    学习模型包含在真实环境中执行动作并收集反馈。我们称之为经验。因此，对于每个状态和动作，环境会给出一个新状态和奖励。基于这些经验集合，我们尝试推断模型。正如人们所料，这无非是监督学习，如下图所示：


    ```

    ![](image-h10q5ikb.jpg)

    ```


    我们利用可用的监督学习方法之一来解决这个问题，它可以是回归、神经网络或其他方法。取决于监督学习技术，模型将由查表法、神经网络或其他形式表示。


    ## Concrete Example


    图 5.12 中的例子展示了两个状态 A 和 B，以及从 A 到 B、从 B 到两个可能的终止状态的转移。这里我们假设没有折扣因子。


    为了构建模型，我们在真实环境中运行几个回合，收集到达的状态和结果。随后，我们按如下方式推断模型的 `[P, R]`：


    ```

    ![](image-1t5v5edd.jpg)

    ```

    **Figure 5.12: An example of the Supervised learning**


    我们可以看到，根据我们的经验（运行的实验），从 A 到 B 的概率是 100%，奖励为 0；而从 B 到上方终止状态的概率是 75%，奖励为 1，到下方终止状态的概率是
    25%，奖励为 0。


    这表明，如果我们使用这个模型（而非真实环境）进行模拟，并运行一组随机试验，每次处于 A 时，模型会告诉我们将 100% 概率移动到 B 且 `r = 0`；每次处于
    B 时，有 75% 概率向上移动且 `r = 1`，25% 概率 `r = 0`。


    ```

    ![](image-answomzz.jpg)

    ```

    **Figure 5.13: A Simulation example of the Supervised learning**


    现在，我们可以使用蒙特卡洛等技术计算价值函数，得出示例中的 `V(A) = 1` 和 `V(B) = 0.75`。作为蒙特卡洛价值计算的回顾：


    ```

    G(s) = r + 𝛄 G(s'')

    ```

    其中 `G` 是每个回合结束后状态 `s` 的回报。`V(s) = average G(s)` 对所有回合取平均。


    ```

    V(B) = (6 * G1 + 2 * G2) / 8 = (6 * 1 + 2 * 0) / 8 = 0.75

    V(A) = ([G(A) + G(B)] + [G(A) + G(B)]) / 2 = ((0 + 1) + (0 + 1)) / 2 = 1

    ```


    我们假设没有折扣，所以 `𝛄 = 1`。


    基于模型 RL 的主循环如下图所示：


    1.  在真实环境中行动，收集经验（状态和奖励）。

    2.  推断模型并用它生成样本（规划）。

    3.  从样本中更新价值函数和策略。

    4.  使用这些价值函数和策略选择动作，在真实环境中行动。

    5.  重新开始循环。


    ```

    ![](image-is9aku79.jpg)

    ```

    **Figure 5.14: The primary loop of Model-Based RL**


    ## Dyna Architecture


    这是基于模型 RL 的一种变体，称为 Dyna 架构，如图所示。它不仅利用真实经验来构建模型，还用于更新价值函数。


    ```

    ![](image-0ez44yo9.jpg)

    ```

    **Figure 5.15: Dyna Architecture**

