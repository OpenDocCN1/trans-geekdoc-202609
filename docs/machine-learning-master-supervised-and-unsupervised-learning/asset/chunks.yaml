    \    K-mean clustering    Probabilistic clustering    Apriori Algorithm    Association\
    \ rule mining    Gaussian Mixture Model (GMM)    FP-Growth Algorithm  \n\n  Objectives\
    \    After reading this chapter, you will be able to understand the concepts of\
    \ various algorithms of unsupervised learning techniques. Knowledge of these algorithms\
    \ will help you to analyze, evaluate, and group the unlabeled data items using\
    \ various clustering techniques.  \n\n  Unsupervised Learning    This is a powerful\
    \ machine learning technique. In this technique, the designed model doesn’t require\
    \ any observation or supervision to process the unlabeled data. Instead, this\
    \ technique accepts unlabeled data items and discovers new patterns of information\
    \ that were previously unknown or undetected. We can understand this technique\
    \ with the help of its working process that is shown in Figure  \n\n  Working\
    \ of unsupervised learning    It is easy to understand the working of unsupervised\
    \ learning through the following steps:     An unsupervised learning model accepts\
    \ unlabeled raw data items as input. Unlike supervised learning, it doesn’t require\
    \ any training, testing, and labeled output data.    After the interpretation\
    \ of data, it is required to choose an appropriate or desired algorithm to discover\
    \ new patterns (that were previously unknown) of information.    Identified new\
    \ patterns must be processed for assigning new labels. In Figure identified patterns\
    \ have been shown with different colors:    ![](image-4x1oii5g.jpg)  Figure 3.1:\
    \ Working of unsupervised learning  \n\n  Need for using unsupervised learning\
    \    There are several reasons for which unsupervised learning is a perfect choice:\
    \     Unsupervised ML finds all sorts of unexplained data patterns.    Unsupervised\
    \ learning techniques are used to identify properties that can help to make groups.\
    \    Everything is carried out in real-time, so in presence of learners, all the\
    \ input data is to be evaluated and labeled.    Unlabeled data is easier to read\
    \ from the computer than the labeled data, which requires manual operations. \
    \ \n\n  Algorithms    As compared to supervised learning, an algorithm used in\
    \ unsupervised learning performs a more complex task. Moreover, algorithms used\
    \ in unsupervised learning are more unpredictable than the other natural learning\
    \ algorithms. Unsupervised learning algorithms include:     Clustering,    Anomaly\
    \ detection,    Neural networks, etc.  \n\n  Clustering    Clustering is an unsupervised\
    \ ML technique. The task of clustering is to find patterns or structures from\
    \ unstructured data. The process of clustering is to divide the data points or\
    \ population into some groups, such that data points of the same groups having\
    \ similar characteristics while data points belonging to the different groups\
    \ must have dissimilar properties. These natural groups are called clusters. A\
    \ natural example of clustering is shown in Figure where the two groups or clusters\
    \ have been created from the mixed population of birds and animals. The population\
    \ belongs to the same group having similar characteristics such as one cluster\
    \ is having a population of birds and another cluster having a population of animals.\
    \ In unsupervised ML, we can adjust the required number of clusters by altering\
    \ the clustering algorithms. It helps us to change these groups' granularity.\
    \    ![](image-l2trchkp.jpg)  Figure 3.2: (a) Before Clustering (b) After Clustering\
    \    Clustering can be performed in the following four ways:     A method of clustering\
    \ to partition the raw data into some groups such as a particular data belongs\
    \ to only one group called For example: K-means clustering.    In the Agglomerative\
    \ clustering method, in the beginning, each data point will be considered as a\
    \ cluster. After that, the number of clusters decreases through iterative unions\
    \ between the two closest clusters. For example: Hierarchical clustering.    Overlapping\
    \ clustering is a method of clustering whereas each data point may belong to more\
    \ than one cluster with a separate degree of membership. Data would be connected\
    \ to a suitable membership attribute. For example: Fuzzy C-Means.    Probabilistic\
    \ clustering is another method of clustering in which the probability distribution\
    \ technique is used to form the clusters. An example of probabilistic clustering\
    \ is: Following keywords.  \n\n  K-means Clustering    K-mean clustering is an\
    \ exclusive partitioning technique to classify the raw data into a k-number of\
    \ groups, where k is a positive integer. Grouping of data is based on calculating\
    \ and minimizing the distance of data points from the selected centroids. Centroids\
    \ are the heart of this algorithm. The number of centroids depends on the number\
    \ of required groups of clusters. Centroid catches and adds the points nearest\
    \ to them to the cluster through an iterative process.  "
