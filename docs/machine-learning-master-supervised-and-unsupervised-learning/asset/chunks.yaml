    # Introduction


    Machine learning is an application of Artificial Intelligence. While AI is the
    umbrella term given to machines emulating human abilities, machine learning is
    a specific branch of AI where machines are trained to learn how to process and
    make use of data. The objective of machine learning is not only effective data
    collection but also to make use of the ever-increasing amounts of data being gathered
    by manipulating and analyzing them without heavy human input.


    This chapter takes on a proactive and practical approach to discuss the foundation,
    background concepts, characteristics as well as the pros and cons of Machine Learning.
    We will discuss from traditional programming practices to Machine Learning. This
    chapter includes the types of Machine Learning as well as their advantages & disadvantage.


    # Structure


    In this chapter, we will discuss the following topics:


    - What is Machine Learning?

    - Machine Learning Vs. Traditional Programming

    - The Seven Steps of Machine Learning

    - Types of Machine Learning

    - Advantages and disadvantages of Machine Learning

    - Popular Machine Learning Software Tools

    - Tools used for practical with some examples


    # Objectives


    By completing this chapter, you will be able to:


    - Understand the concepts of Machine Learning.

    - Understand the difference Between Traditional programming & Machine Learning.

    - Understand about the state-of-art applications of Machine Learning.

    - Understand about the types of Machine Learning.

    - Understand the significance of the Machine Learning applications

    - Understand about the tools of Machine Learning


    # What is Machine Learning?


    Machine learning is a sub-domain of artificial intelligence. The goal of machine
    learning is usually to understand the structure of the data and to match that
    data to models that can be understood and used by humans.


    While artificial intelligence and machine learning are often used together, they
    are two different concepts. AI is a broad concept – decision-making machines,
    learning new skills, and problem-solving in the same way for people – and machine
    learning is an AI set that enables intelligent systems to independently learn
    new things from the data.


    ![](image-4bm8cj7i.jpg)

    **Figure 1.1: Machine Learning subset**


    Figure 1.1 shows that machine learning is a subset of artificial intelligence.
    Machine learning is a tool for transforming information into knowledge. In the
    previous 50 years, there has been a blast of information/data. This mass of information
    is pointless except if we investigate it and discover the examples covered up
    inside. Machine learning techniques are utilized to consequently locate the significant
    fundamental examples inside complex information that we would somehow battle to
    find. Hidden patterns and information about the problem can be used to predict
    future events and to make all sorts of complex decisions.


    We have seen machine learning as a trendy expression for hardly any years, the
    meaning behind this could be the high rate of data/information creation by applications,
    the expansion of computation power over the years, and the development of better
    algorithms.


    ![](image-qpxm378r.jpg)

    **Figure 1.2: Human & Robot**


    The Figure shows that the human learns everything automatically from experience
    & the robot can also learn from previous experience data with the help of machine
    learning.


    The name machine learning was coined by Arthur Samuel in 1959, an American pioneer
    in the field of computer gaming and artificial intelligence who stated that Learning
    gives computers the ability to learn without being explicitly Arthur Samuel created
    the first self-study program for playing checkers. You realize that the more the
    system plays, the better it performs.


    And in 1997, Tom Mitchell gave a mathematical and relational definition that computer
    program is said to learn from experience E with respect to some task T and some
    performance measure P, if its performance on T, as measured by P, improves with
    experience.


    ## Example 1: Playing Chess


    - **Task**: The task of playing chess

    - **Experience**: The experience of playing many games of chess

    - **Performance Measure**: The probability of the program which will win the next
    game of chess


    ## Example 2: Spam Mail Detection


    - **Task**: To recognize and classify the emails into or

    - **Experience**: A set of emails with given labels /

    - **Performance Measure**: Total percentage of emails being correctly classified
    as ''spam'' (or ''not spam'') by the program.


    The basic premise of machine learning is to build algorithms that can obtain input
    data and use mathematical analysis to predict output while reviewing results as
    new data becomes available.


    Currently, machine learning is used for a variety of tasks such as image recognition,
    speech recognition like Amazon''s Alexa, email filtering like email is spam or
    not spam, Facebook auto-tagging, recommendation systems like Amazon and Flipkart
    recommends the product to the user and many more.


    # Machine Learning versus Traditional Programming


    Traditional programming is a process of hand-coded logic – meaning that the programmer
    makes the program. But apart from anyone programming the logic, one has to manually
    decide the rules or code. We have input data, and the programmer wrote the program/rules
    that use that data and execute on a computer to generate the output/answer as
    shown in the following Figure.


    ![](image-pzhk9bwg.jpg)

    **Figure 1.3: Traditional Programming**


    On the other hand, in case of Machine Learning, data and output/answers (or labels)
    come in as input and the learning rules (models) come out as output as shown in
    Figure. The machine learning paradigm is especially important because it allows
    the computer to learn new rules in a complex and advanced environment, a space
    difficult to understand by humans.


    ![](image-81z3cmga.jpg)

    **Figure 1.4: Machine Learning**


    For example, we could write a traditional computer program for activity recognition
    (walking, running, or cycling) based on a person''s speed (data) and an activity
    description (walk, run, and cycling) based on speed (rules). However, the problem
    with this method is that different people walk, run, and ride bikes at different
    speeds depending on age, environment, health, and so on.


    If we have to solve the same problem in the field of machine learning, we can
    find many examples of tasks and their labels (answers i.e., type of activity)
    and learn or infer the rules for predicting future work.


    # The Seven Steps of Machine Learning


    The process of machine learning can be broken down into 7 steps as shown in Figure.
    To illustrate the significance and function of each step, we would be using an
    example of a simple model. This model would be responsible for differentiating
    between an apple and an orange. Machine learning is capable of much for complex
    tasks. However, to explain the process in simplistic terms, a basic example is
    taken to explain the relevant concepts:


    ![](image-no03ogku.jpg)

    **Figure 1.5: Steps of Machine Learning**


    ## Step 1: Data Gathering / Data Collection


    This step is very important because the quality and quantity of data that we gather
    will directly determine how well or badly your model will work. To develop our
    machine learning model, our first step would be to gather relevant data that can
    be used to train the model.


    The step of gathering data is the foundation of the machine learning process.
    Mistakes such as choosing the incorrect features or focusing on limited types
    of entries for the data set may render the model completely ineffective.

    '
