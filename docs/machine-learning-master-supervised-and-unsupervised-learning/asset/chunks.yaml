    ```\n\n---\n\n# 实验 5\n\n**目的：** 编写程序实现朴素贝叶斯分类器，用于存储为 .CSV 文件的样本训练数据集。考虑少量测试数据集，计算分类器的准确率。\n\
    \n## 贝叶斯定理\n\nP(H/E) = P(E/H) P(H)/P(E)\n\nH-假设，E-事件/证据\n\n贝叶斯定理基于条件概率工作。\n\n\
    已知事件已发生或事件为真，则需计算在此事件下假设的概率。\n\n即事件 E 发生时假设 H 发生的几率。\n\nP(H) - 称为先验概率，事件 E 发生前\
