    # Applications


    Artificial Neural Networks can be applied in a variety of fields as follows:


    - Nonlinear system identification and control (vehicle control, process control)

    - Game-playing and decision making (backgammon, chess, racing)

    - Pattern recognition (radar systems, face identification, object recognition)

    - Sequence recognition (gesture, speech, handwritten text recognition)

    - Medical diagnosis

    - Financial applications

    - Data mining (or knowledge discovery)

    - Function approximation, or regression analysis

    - Time series prediction and modeling

    - Classification and clustering

    - Novelty detection

    - Data processing and filtering

    - Blind signal separation and compression


    # Comparison between Artificial Neural Networks (ANN) and Biological Neural Networks
    (BNN)


    Table 6.1: Comparison between Artificial Neural Networks (ANN) and Biological
    Neural Networks (BNN)


    # Characteristics of the ANN


    Any Artificial Neural Network, regardless of implementation style or logic, has
    a few basic characteristics. These are listed as follows:


    - An Artificial Neural Network is made up of a large number of processing elements.

    - All of these processing elements are linked by a large number of weighted connections.

    - The input signals are routed through connections and connecting weights to the
    processing elements.

    - The links between the elements form a distributed representation of data.

    - It can learn, recall, and generalize from given data by assigning and adjusting
    weights appropriately.

    - Neurons'' collective actions describe their computational power, and no single
    neuron carries specific information.


    # Perceptron


    A perceptron is a supervised learning algorithm for binary classifiers. Binary
    classifiers determine whether an input, which is typically represented by a series
    of vectors, belongs to a particular class. In a nutshell, a perceptron is a one-layer
    neural network. They are made up of four major components: input values, weights
    and bias, net sum, and an activation function.


    A single layer neural network is referred to as a perceptron, and a multi-layer
    perceptron is referred to as a neural network. A perceptron is a type of linear
    classifier (binary). It is also used in supervised learning. It aids in the classification
    of the input data. Perceptron is commonly used to divide data into two parts.
    As a result, it is also referred to as a Linear Binary Classifier.


    This algorithm enables neurons to learn and process training set elements one
    at a time.


    There are two types of perceptrons: Single layer and Multilayer.


    - Perceptrons with a single layer can only learn linearly separable patterns.

    - The processing power of multilayer perceptrons or feedforward neural networks
    with two or more layers is greater.

    - To draw a linear decision boundary, the perceptron algorithm learns the weights
    for the input signals.


    # Activation Function


    The activation function determines whether or not a neuron should be activated
    by calculating a weighted sum and then adding bias to it. The activation function''s
    purpose is to introduce non-linearity into a neuron''s output.


    ## Why do we need an Activation Function?


    In a nutshell, activation functions are used to map input between required values
    such as (0, 1) or (-1, 1).


    We understand that neurons in a neural network work by their weight, bias, and
    activation function. In a neural network, we would update the weights and biases
    of the neurons based on the output error. This is referred to as backpropagation.
    Because the gradients are supplied along with the error to update the weights
    and biases, activation functions enable back-propagation.


    ## Why do we need Non-linear activation functions?


    Without an activation function, a neural network is essentially a linear regression
    model. The activation function applies a non-linear transformation to the input,
    allowing it to learn and perform more complex tasks.


    ## How does a Perceptron work?


    The procedure begins by multiplying all of the input values by their weights.
    The weighted sum is then calculated by multiplying all of the multiplied values
    together. The weighted sum is then applied to the activation function, yielding
    the output of the perceptron. The activation function is crucial in ensuring that
    the output is mapped between required values such as (0,1) or (-1,1). It is critical
    to understand that the weight of input indicates the strength of a node. Similarly,
    the bias value of input allows you to shift the activation function curve up or
    down.


    ![](image-1x3gz9wa.jpg)

    Figure 6.7: Perceptron working


    Perceptrons are crucial in binary classification. This means that the perceptron
    is used to divide data into two parts, thus binary. The perceptron operates on
    the following simple steps:


    - Step: All the X inputs are multiplied by their weights W.


    ![](image-r41u9sby.jpg)

    Figure 6.8: Multiplying inputs with weights for 4 inputs


    - Step: Weighted Sum is the sum of all the multiplied values.


    ![](image-6xhjihlx.jpg)

    Figure 6.9: Calculation of the Weighted Sum


    - Step: Use that weighted sum to find the appropriate activation function.


    # Multilayer Network


    Hidden layers, whose neurons are not directly connected to the output, are used
    in multilayer networks to solve the classification problem for non-linear sets.
    The additional hidden layers can be interpreted geometrically as additional hyper-planes
    that increase the network''s separation capacity. Figure 6.10 depicts common multilayer
    Neural network architectures.


    This new architecture raises an important question: how to train hidden units
    when the desired output is unknown. This problem can be solved using the Backpropagation
    algorithm.


    - **Input**: This layer accepts features as input. It brings information from
    the outside world into the network; no computation is done at this layer; nodes
    simply pass the information (features) to the hidden layer.

    - **Hidden**: This layer''s nodes are not visible to the outside world; they are
    part of the abstraction provided by any neural network. The hidden layer computes
    all of the features entered through the input layer and sends the results to the
    output layer.

    - **Output**: This layer communicates the network''s learned information to the
    outside world.


    ![](image-9c5pdcpv.jpg)

    Figure 6.10: Multilayer Neural Network Architectures

