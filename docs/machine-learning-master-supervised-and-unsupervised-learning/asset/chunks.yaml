  trans: "\n\n# 模拟试卷 – 2\n\n## 选择题\n\n**关于机器学习，以下哪项是正确的？**\n\n- 机器学习（ML）是计算机科学的一个领域。\n\
    - ML 是一种人工智能，它通过使用算法或方法从原始数据中提取模式。\n- ML 的主要重点是让计算机系统能够从经验中学习，而无需显式编程或人工干预。\n\
    - 以上全部\n\n**在以下哪种学习中，教师向学习者返回奖励和惩罚？**\n\n- 主动学习\n- 强化学习\n- 监督学习\n- 无监督学习\n\n**无监督学习中使用的技术接受\
