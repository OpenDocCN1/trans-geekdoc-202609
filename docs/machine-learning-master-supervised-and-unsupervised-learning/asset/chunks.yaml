    # Two approaches to hierarchical clustering


    There are two approaches to hierarchical clustering: the first one is **Agglomerative**
    and the other is **Divisive**.


    In the case of agglomerative hierarchical clustering, a bottom-up approach is
    used to collect the data as input. In the beginning, each data point of the collected
    input is considered a single cluster. Later, each cluster is merged with a similar
    cluster; this iteration is done until one cluster is left.


    Whereas the divisive algorithm follows an inverse approach of the agglomerative
    algorithm. It uses a top-down approach. It takes the whole data as a single cluster
    and groups it into multiple clusters in a hierarchical manner.


    ## Need of hierarchical clustering


    Since we already have other algorithms for clustering, including k-means clustering,
    why do we require hierarchical clustering? The answer is that in k-means clustering
    there are some limitations in the algorithm:


    *   Need to choose a fixed number of clusters by choosing the value of parameter
    `k`.

    *   The algorithm always tries to create groups/clusters of the same size.


    Hierarchical clustering can be used to overcome the limitations of k-means clustering
    because in this clustering there is no need to fix the number of clusters in the
    beginning.


    In this chapter, we will discuss agglomerative hierarchical clustering in detail
    with an example.


    ## Agglomerative hierarchical clustering


    A common instance of HCA is the agglomerative hierarchical clustering algorithm.
    It uses the bottom-up approach to group the raw data into clusters. At the beginning
    of this algorithm, each dataset will be considered a single cluster; afterwards,
    the nearest pair of clusters will be combined to build a clubbed cluster. This
    process will be repeated until all the clusters are merged into a single cluster
    that contains datasets.


    ## Working of agglomerative hierarchical clustering


    A step-by-step working of the Agglomerative Hierarchical clustering algorithm
    is shown as follows:


    Suppose there are `N` datasets; each dataset will be considered a single cluster.
    In the beginning, the number of clusters is equal to the number of datasets. In
    Figure 3.12 each dot represents a cluster:


    ![](image-bybnf5bb.jpg)

    *Figure 3.12: Each dot represents a cluster*


    Take two clusters that are closest to each other, and merge them to make a single
    cluster. Now there are `N-1` clusters left, as shown in Figure:


    ![](image-kigpu4pv.jpg)

    *Figure 3.13: The merging of two clusters is shown through the circle*


    Similar to step 2, choose another two nearest clusters and merge them to form
    one cluster. Now there are `N-2` clusters left, as shown in Figure:


    ![](image-u0pspy6g.jpg)

    *Figure 3.14: The merging of two clusters is shown through the oval*


    Repeat step 3 until one cluster is left. So, we will get the following clusters.
    Consider the images shown in Figure:


    ![](image-d8hjoy2b.jpg)

    *Figure 3.15: Step by step merging of clusters (a),(b),(c)*


    After combining all the clusters into one big cluster, a dendrogram has to be
    created. The dendrogram is used to divide the clusters as per the requirement
    of the problem. A dendrogram of the above-mentioned problem is shown in Figure.


    ## Measuring the distance between two clusters


    As we know, for hierarchical clustering, the closest distance between the two
    clusters is important. There are different ways to measure the distance between
    two clusters and these methods establish the rules of clustering and are called
    linkage methods. Some important linkage methods are illustrated below:


    ### Single Linkage


    The shortest distance between the two closest points of two different clusters
    is considered as a single linkage. A pictorial representation of a single linkage
    is shown in the below image:


    ![](image-lcv3ko2h.jpg)

    *Figure 3.16: Single linkage*


    ### Complete Linkage


    The farthest distance between the two points of two different clusters is considered
    as a complete linkage. This method is more popular than the single linkage method
    because it makes a tighter cluster. A pictorial representation of a complete linkage
    is shown in the following image:


    ![](image-mlhtpw1d.jpg)

    *Figure 3.17: Complete linkage*


    ### Average


    In this linkage method, the average distance between two clusters has to be calculated.
    It is also a very popular method of linkage.


    ### Centroid


    In this linkage method, the centroid of each cluster has to be calculated and
    then the distance between the centroids has to be calculated. A pictorial representation
    of a centroid linkage is shown in the following image:


    ![](image-e99slx5j.jpg)

    *Figure 3.18: Centroid linkage*


    From the above-mentioned linkage methods, any method can be applied to calculate
    the distance between two clusters as per the requirement of business and type
    of problems.


    ## The dendrogram in hierarchical clustering


    In hierarchical clustering, a dendrogram represents a tree-like structure of clusters.
    The main use of the dendrogram is to store each step performed by the hierarchical
    clustering algorithm. In a dendrogram plot, the x-axis represents all datasets,
    and the y-axis represents the Euclidean distance between the data points of all
    datasets.


    The functioning of the dendrogram can be illustrated through the following diagram:


    ![](image-4zlcg2ec.jpg)

    *Figure 3.19: (a) cluster (b) dendrogram*


    The left part of the above-shown diagram shows the clusters created through the
    agglomerative clustering algorithm, and the dendrogram of corresponding clusters
    has been shown in the right (b) part of Figure.


    ## Creating Dendrogram


    A step-by-step process to create a dendrogram of the above-mentioned problem is
    discussed below:


    *   As per the above-discussed problem, initially the points having the shortest
    distance i.e. point `P2` and point `P3` have been clubbed to create a cluster,
    and simultaneously their dendrogram is created that has a rectangular shape by
    joining points `P2` and `P3`, and the height of the rectangle is equivalent to
    the Euclidean distance between `P2` and `P3`.

    *   In the further step, the points `P5` and `P6` have been clubbed into a cluster,
    and the equivalent dendrogram is created. The height of this dendrogram is higher
    than the previous dendrogram of points `P2` and `P3` because the Euclidean distance
    between the points `P5` and `P6` is a little bit more than the points `P3` and
    `P2`.

    *   The same process has been repeated to draw two new dendrograms clubbing points
    `P1`, `P2`, and `P3` in one dendrogram and points `P4`, `P5`, and `P6` in another
    dendrogram. The final dendrogram that integrates all the data points is finally
    formed (as shown in Figure). As per our requirements, we can cut the dendrogram
    tree-structure at any stage.

