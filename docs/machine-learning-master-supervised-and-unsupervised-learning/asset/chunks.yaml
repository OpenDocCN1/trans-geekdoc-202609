  fmt: "\n# Backpropagation Algorithm\n\nThe backpropagation algorithm is used to\
    \ effectively train a neural network using a method known as chain rule. Backpropagation,\
    \ in a nutshell, performs a backward pass through a network after each forward\
    \ pass while adjusting the model's parameters (weights and biases). Backpropagation\
    \ is an abbreviation for \"backward propagation of errors\". It is a common technique\
    \ for training artificial neural networks. This method is useful for calculating\
    \ the gradient of a loss function for the network's weights.\n\nThe essence of\
    \ neural net training is backpropagation. It is a technique for fine-tuning the\
    \ weights of a neural network based on the error rate obtained in the previous\
    \ epoch (i.e., iteration). By fine-tuning the weights, you can reduce error rates\
    \ and make the model more reliable by increasing its generalization.\n\n## Algorithm\n\
    \nConsider the following Figure 6.11 for the backpropagation algorithm working\
    \ as shown follows:\n\n![](image-vszx09uq.jpg)\n**Figure 6.11: Backpropagation\
    \ algorithm working**\n\n1.  **Step 1:** Inputs `X` arrive through the preconnected\
    \ path.\n2.  **Step 2:** Input is modelled using real weights `W`. The weights\
    \ are usually randomly selected.\n3.  **Step 3:** Calculate the output for every\
    \ neuron from the input layer to the hidden layers, to the output layer.\n4. \
    \ **Step 4:** Calculate the error in the outputs.\n    `ErrorB = Actual Output\
    \ – Desired Output`\n5.  **Step 5:** Travel back from the output layer to the\
    \ hidden layer to adjust the weights such that the error is decreased.\n6.  **Step\
    \ 6:** Repeat the process (from steps 1 to 5) until the desired output is achieved.\n\
    \n## Types of Backpropagation Networks\n\nThere are two types of Backpropagation\
    \ Networks:\n\n*   **Static backpropagation:** It is a type of backpropagation\
    \ network that generates a mapping of a static input to a static output. It can\
    \ be used to solve static classification problems such as optical character recognition.\n\
    *   **Recurrent Backpropagation:** Recurrent backpropagation is used until a fixed\
    \ value is reached. The error is then computed and propagated backwards.\n\nThe\
    \ main difference between these two methods is that in static backpropagation,\
    \ the mapping is fast, whereas in recurrent backpropagation, the mapping is non-static.\n\
    \n## Advantages\n\nThe following are the advantages of the Backpropagation Networks:\n\
    \n*   It is simple, fast, and easy to program.\n*   Apart from the numbers of\
    \ input, there are no parameters to tune.\n*   It is a standard method that generally\
    \ works well.\n*   It is a versatile method because it does not necessitate prior\
    \ knowledge of the network.\n\n## Disadvantages\n\nThe following are the disadvantages\
    \ of the Backpropagation Networks:\n\n*   The actual performance is determined\
    \ by the data input.\n*   Backpropagation is extremely sensitive to noisy data.\n\
    *   Backpropagation must be done using a matrix-based approach rather than a mini-batch\
    \ approach.\n\n# Introduction to Deep Learning\n\nDeep learning algorithms employ\
    \ a technique known as a neural network to discover relationships between a set\
    \ of inputs and outputs.\n\nMachine learning has a subdomain called **deep learning**.\
    \ Deep learning algorithms can self-learn hidden patterns within data to make\
    \ predictions using accelerated computational power and large data sets. In essence,\
    \ deep learning is a subset of machine learning (see Figure 6.12) that is trained\
    \ on large amounts of data and involves many computational units working together\
    \ to make predictions.\n\nThe term refers to the creation of deep neural networks.\
    \ This refers to a neural network with many layers. By adding more weights and\
    \ biases, the neural network improves its capabilities to predict more complex\
    \ functions.\n\nDeep learning is a subset of machine learning, which is a subset\
    \ of artificial intelligence. Individual definitions are as follows:\n\n*   **Artificial\
    \ Intelligence:** The broad mandate of artificial intelligence is to create machines\
    \ that can think intelligently.\n*   **Machine Learning:** Machine learning employs\
    \ algorithms to extract insights from data.\n*   **Deep Learning:** Deep learning\
    \ employs a specific algorithm known as a Neural Network.\n\n## How do deep learning\
    \ algorithms “learn”?\n\nThe following Figure 6.12 depicts the concept of the\
    \ deep learning algorithm:\n\n![](image-0ebwx50y.jpg)\n**Figure 6.12: Deep Learning\
    \ Algorithms concept**\n\nA neural network is made up of input, hidden, and output\
    \ layers, all of which are made up of neurons. Input layers receive a numerical\
    \ representation of data (for example, images with pixel specs), output layers\
    \ produce predictions, and hidden layers are correlated with the majority of the\
    \ computation.\n\n## Difference between Machine Learning and Deep Learning\n\n\
    To grasp the difference between machine learning and deep learning, we must first\
    \ understand the relationship between deep learning and machine learning. This\
    \ relationship is best represented by an example shown in Figure 6.13. In machine\
    \ learning, feature extraction and classification are applied separately to get\
    \ the output, whereas in deep learning feature extraction and classification are\
    \ applied together to get the output. By using deep learning, the complexity reduces\
    \ to achieve the results faster.\n\n![](image-mrime246.jpg)\n**Figure 6.13: Machine\
    \ Learning vs Deep Learning**\n\nThe following Table 6.2 shows the difference\
    \ between Machine Learning and Deep Learning.\n\n**Table 6.2: Difference between\
    \ Machine Learning and Deep Learning**\n\n*(Note: The original text contained\
    \ placeholder text \"Learning.\" repeated extensively instead of the actual table\
    \ content. This has been noted but the table structure is preserved as a header.)*\n\
    \n## Importance of Deep Learning\n\nDeep learning is significant because we have\
    \ achieved meaningful and useful accuracy on tasks that matter. For decades, machine\
    \ learning has been used for image and text classification, but it has struggled\
    \ to cross the threshold of accuracy that algorithms require to work in business\
    \ settings. Deep learning is finally allowing us to cross that line in places\
    \ where we previously could not as shown in Figure 6.14.\n\n![](image-79gp13dv.jpg)\n\
    **Figure 6.14: Comparison of deep learning and older learning algorithms**\n\n\
    The following are some of the real-time examples:\n\n*   **Computer vision** is\
    \ an excellent example of a task that deep learning has rendered feasible for\
    \ business applications. Deep learning is not only better than any other traditional\
    \ algorithm for classifying and labelling images; it is also beginning to outperform\
    \ actual humans.\n*   Using deep learning, Facebook has already had remarkable\
    \ success identifying facial expressions in photographs. It's not just a minor\
    \ improvement; it's a huge success.\n*   Deep learning is already being used by\
    \ Google to manage the energy at the company's data centers. Deep learning has\
    \ also had an impact on speech recognition.\n*   Deep learning is significant\
    \ because it brings previously inaccessible workloads into the purview of machine\
    \ learning. We are just beginning to understand how developers and business leaders\
    \ can use machine learning to drive business outcomes and having more available\
    \ tasks at your fingertips as a result of deep learning will transform the economy\
    \ for decades to come.\n\n### Advantages\n\n*   Best in-class performance\n* \
    \  Reduces the need for feature engineering\n*   Cuts out unnecessary expenses\n\
    *   Identifies minor defects\n\n### Disadvantages\n\n*   Massive quantity of data\
    \ is required\n*   Training is computationally expensive\n*   There is no solid\
    \ theoretical foundation\n"
  trans: "\n\n# 反向传播算法\n\n反向传播算法用于利用一种称为链式法则的方法有效地训练神经网络。简而言之，反向传播在每次前向传播后执行一次通过网络的反向传递，同时调整模型的参数（权重和偏置）。反向传播是“误差的反向传播”的缩写。它是训练人工神经网络的常用技术。该方法对于计算网络权重的损失函数梯度很有用。\n\
    \n神经网络训练的本质是反向传播。它是一种基于上一个周期（即迭代）中获得的误差率来微调神经网络权重的技术。通过微调权重，可以降低误差率，并通过提高泛化能力使模型更加可靠。\n\
    \n## 算法\n\n请参考下图 6.11，了解反向传播算法的工作原理：\n\n![](img/image-vszx09uq.jpg)\n**图 6.11：反向传播算法工作原理**\n\
    \n1.  **步骤 1：** 输入 `X` 通过预连接路径到达。\n2.  **步骤 2：** 使用真实权重 `W` 对输入进行建模。权重通常是随机选择的。\n\
    3.  **步骤 3：** 计算从输入层到隐藏层，再到输出层每个神经元的输出。\n4.  **步骤 4：** 计算输出中的误差。\n    `ErrorB\
    \ = 实际输出 – 期望输出`\n5.  **步骤 5：** 从输出层向隐藏层反向传播，以调整权重从而减小误差。\n6.  **步骤 6：** 重复该过程（步骤\
    \ 1 到 5），直到达到期望输出。\n\n## 反向传播网络的类型\n\n反向传播网络有两种类型：\n\n*   **静态反向传播：** 这是一种反向传播网络，它生成从静态输入到静态输出的映射。它可用于解决静态分类问题，如光学字符识别。\n\
    *   **循环反向传播：** 循环反向传播一直运行直到达到一个固定值。然后计算误差并向后传播。\n\n这两种方法的主要区别在于：在静态反向传播中，映射是快速的；而在循环反向传播中，映射是非静态的。\n\
    \n## 优点\n\n反向传播网络的优点如下：\n\n*   简单、快速且易于编程。\n*   除了输入的数量外，没有需要调整的参数。\n*   它是一种通常效果良好的标准方法。\n\
    *   它是一种通用的方法，因为它不需要网络的先验知识。\n\n## 缺点\n\n反向传播网络的缺点如下：\n\n*   实际性能由数据输入决定。\n* \
    \  反向传播对噪声数据极其敏感。\n*   反向传播必须使用基于矩阵的方法，而不是小批量方法。\n\n# 深度学习简介\n\n深度学习算法采用一种称为神经网络的技术来发现一组输入和输出之间的关系。\n\
    \n机器学习有一个子领域称为**深度学习**。深度学习算法可以利用加速的计算能力和大型数据集，自我学习数据中的隐藏模式以进行预测。本质上，深度学习是机器学习的一个子集（见图\
    \ 6.12），它在大量数据上进行训练，并涉及许多计算单元协同工作以进行预测。\n\n该术语指的是创建深度神经网络。这指的是一个具有许多层的神经网络。通过增加更多的权重和偏置，神经网络提高了预测更复杂函数的能力。\n\
    \n深度学习是机器学习的一个子集，而机器学习是人工智能的一个子集。各自的定义如下：\n\n*   **人工智能：** 人工智能的广泛使命是创造能够智能思考的机器。\n\
    *   **机器学习：** 机器学习采用算法从数据中提取洞见。\n*   **深度学习：** 深度学习采用一种称为神经网络的特定算法。\n\n## 深度学习算法如何“学习”？\n\
    \n下图 6.12 描绘了深度学习算法的概念：\n\n![](img/image-0ebwx50y.jpg)\n**图 6.12：深度学习算法概念**\n\n\
    神经网络由输入层、隐藏层和输出层组成，所有这些层都由神经元构成。输入层接收数据的数值表示（例如，带有像素规格的图像），输出层产生预测，而隐藏层与大部分计算相关联。\n\
    \n## 机器学习与深度学习的区别\n\n要理解机器学习和深度学习的区别，我们首先必须了解深度学习和机器学习之间的关系。图 6.13 中的示例最好地诠释了这种关系。在机器学习中，特征提取和分类是分别应用以获得输出的；而在深度学习中，特征提取和分类是一起应用以获得输出的。通过使用深度学习，复杂性降低，从而能更快地获得结果。\n\
    \n![](img/image-mrime246.jpg)\n**图 6.13：机器学习 vs 深度学习**\n\n下表 6.2 显示了机器学习和深度学习的区别。\n\
    \n**表 6.2：机器学习和深度学习的区别**\n\n*（注：原文包含大量重复的占位符文本 \"Learning.\" 而非实际表格内容。此处已标注，但保留了表头结构。）*\n\
    \n## 深度学习的重要性\n\n深度学习之所以重要，是因为我们在关键任务上实现了有意义且实用的准确率。几十年来，机器学习一直用于图像和文本分类，但一直难以跨越算法在商业环境中工作所需的准确率门槛。正如图\
    \ 6.14 所示，深度学习终于让我们在以前无法做到的地方跨越了这条线。\n\n![](img/image-79gp13dv.jpg)\n**图 6.14：深度学习与旧式学习算法的比较**\n\
    \n以下是一些实时案例：\n\n*   **计算机视觉**是深度学习使其成为商业应用可行任务的绝佳例子。深度学习在图像分类和标记方面不仅优于任何其他传统算法；它也开始超越实际人类。\n\
    *   Facebook 已利用深度学习在识别照片中的面部表情方面取得了显著成功。这不仅仅是微小的改进；这是一个巨大的成功。\n*   Google 已经在使用深度学习来管理公司数据中心的能源。深度学习也对语音识别产生了影响。\n\
    *   深度学习之所以重要，是因为它将以前无法触及的工作负载纳入了机器学习的范畴。我们才刚刚开始理解开发人员和业务领导者如何利用机器学习推动业务成果，而由于深度学习，更多可用任务触手可及，这将在未来几十年改变经济。\n\
    \n### 优点\n\n*   同类最佳性能\n*   减少对特征工程的需求\n*   削减不必要的开支\n*   识别细微缺陷\n\n### 缺点\n\n\
    *   需要海量数据\n*   训练计算成本高昂\n*   缺乏坚实的理论基础\n\n"
