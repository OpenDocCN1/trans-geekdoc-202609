    # Binary Logistic Regression


    The target variable or dependent variable in binary logistic regression is binary
    in nature, meaning it has only two possible values. There are only two possible
    outcomes for the categorical response. For example, determining whether or not
    a message is a spam.


    # Multinomial Logistic Regression


    In a multinomial logistic regression, the target variable can have three or more
    values, but there is no fixed order of preference for these values. For instance,
    the most popular type of food (Indian, Italian, Chinese, and so on). Predicting
    which food is preferred more is an example (Veg, Non-Veg, Vegan).


    # Ordinal Logistic Regression


    The target variable in ordinal logistic regression has three or more possible
    values, each of which has a preference or order. For instance, restaurant star
    ratings range from 1 to 5, and movie ratings range from 1 to 5.


    # Examples


    The following are some of the scenarios in which logistic regression can be used.


    **Weather Prediction**: Regression is used to make weather predictions. We use
    the information from previous weather reports to forecast the outcome for a specific
    day. However, logistic regression can only predict categorical data, such as whether
    it will rain or not.


    **Determining Illness**: We can use logistic regression with the help of the patient''s
    medical history to predict whether the illness is positive or negative.


    # Support Vector Machine (SVM) Algorithm


    The Support Vector Machine, or SVM, is a popular Supervised Learning algorithm
    that can be used to solve both classification and regression problems. However,
    it is primarily used in machine learning for classification problems as shown
    in Figure.


    Many people prefer SVM because it produces significant accuracy while using less
    computing power. The extreme points/vectors that help create the hyperplane are
    chosen by SVM. Support vectors are the extreme cases hence the algorithm is called
    a Support Vector.


    ![](image-8npnxnlx.jpg)

    **Figure 2.18**: Support Vector Machine (SVM) concept


    The support vector machine algorithm''s goal is to find a hyperplane in N-dimensional
    space (N \- the number of features) that categorizes the data points clearly.


    ![](image-1vdx8ooq.jpg)

    **Figure 2.19**: SVM hyperplanes with Maximum margin


    There are numerous hyperplanes to choose from to separate the two classes of data
    points. Our goal is to find a plane with the greatest margin, or the greatest
    distance between data points from both classes as shown in Figure. Maximizing
    the margin distance provides some reinforcement, making it easier to classify
    future data points.


    Hyperplanes are decision boundaries that aid in data classification. Different
    classes can be assigned to data points on either side of the hyperplane. The hyperplane''s
    dimension is also determined by the number of features. If there are only two
    input features, the hyperplane is just a line. The hyperplane becomes a two-dimensional
    plane when the number of input features reaches three. When the number of features
    exceeds three, it becomes difficult to imagine.


    ![](image-4pk67ztv.jpg)

    **Figure 2.20**: Support Vectors with small and large margin


    Support vectors are data points that are closer to the hyperplane and have an
    influence on the hyperplane''s position and orientation as shown in Figure. We
    maximize the classifier''s margin by using these support vectors. The hyperplane''s
    position will be altered if the support vectors are deleted. These are the points
    that will assist us in constructing SVM.


    The sigmoid function is used in logistic regression to squash the output of the
    linear function within the range of `[0,1]`. If the squashed value exceeds a threshold
    value (0.5), it is labeled as 1, otherwise, it is labeled as 0. In SVM, we take
    the output of a linear function and, if it is greater than 1, we assign it to
    one class, and if it is less than 1, we assign it to another. We get this reinforcement
    range of values (`[-1,1]`) which acts as a margin because the threshold values
    in SVM are changed to 1 and \-1.


    # Hyperplane, Support Vectors, and Margin


    The Hyperplane, Support Vectors, and Margin are described as follows:


    **Hyperplane**: In n-dimensional space, there can be multiple lines/decision boundaries
    to separate the classes, but we need to find the best decision boundary to help
    classify the data points. The hyperplane of SVM refers to the best boundary. The
    hyperplane''s dimensions are determined by the features in the dataset; for example,
    if there are two features, the hyperplane will be a straight line. If three features
    are present, the hyperplane will be a two-dimensional plane. We always make a
    hyperplane with a maximum margin, which refers to the distance between data points.


    **Support Vectors**: Support vectors are the data points or vectors that are closest
    to the hyperplane and have an effect on the hyperplane''s position. These vectors
    are called support vectors because they support the hyperplane.


    **Margin**: It''s the distance between two lines on the closest data point of
    different classes. The perpendicular distance between the line and the support
    vectors can be calculated. A large margin is regarded as a good margin, while
    a small margin is regarded as a bad margin.


    # Working of SVM


    In multidimensional space, an SVM model is essentially a representation of different
    classes in a hyperplane. SVM will generate the hyperplane in an iterative manner
    in order to reduce the error. SVM''s goal is to divide datasets into classes so
    that a maximum marginal hyperplane can be found.


    ![](image-zf9afboj.jpg)

    **Figure 2.21**: Working of SVM


    SVM''s main goal is to divide datasets into classes in order to find a maximum
    marginal hyperplane which can be accomplished in two steps:


    1.  First, SVM will iteratively generate hyperplanes that best separate the classes.

    2.  The hyperplane that correctly separates the classes will then be chosen.


    # Types of SVM


    Support Vector Machine (SVM) types are described below:


    **Linear**: Linear SVM is used for linearly separable data, which means that if
    a dataset can be classified into two classes using only a single straight line,
    it is called linearly separable and the classifier used is called Linear SVM.


    **Non-linear**: Non-Linear SVM is used to classify non-linearly separated which
    means that if a dataset cannot be classified using a straight line, it is classified
    as non-linear data, and the classifier used is the Non-Linear SVM classifier.


    # Applications of Support-Vector Machines


    The following are few of the applications of Support-Vector Machines:


    *   Facial expressions classifications

    *   Pattern classification and regression problems

    *   In the military datasets

    *   Speech recognition

    *   Predicting the structure of proteins

    *   In image processing \- handwriting recognition

    *   In earthquake potential damage detections


    # Advantages of SVM


    The following are the advantages of SVM:


    *   SVM classifiers are highly accurate and work well in high-dimensional environments.
    Because SVM classifiers only use a subset of training points, they require very
    little memory.

    *   Solve the data points that are not linearly separable.

    *   Effective in a higher dimension space.

    *   It works well with a clear margin of separation.

    *   It is effective in cases where the number of dimensions is greater than the
    number of samples.

    *   Better utilization of memory space.


    ![1sa](1sa.PNG)


    # Disadvantages of SVM


    The following are the disadvantages of SVM:


    *   Not suitable for the larger data sets.

    *   Less effective when the data set has more noise.

    *   It doesn’t directly provide probability estimates.

    *   Overfitting problem

    '
