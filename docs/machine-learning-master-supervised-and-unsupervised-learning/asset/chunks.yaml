    # Summary


    The Markov chain is a probabilistic model that solely depends upon the current
    status and not on the previous states.


    Markov''s choice procedure is a model for foreseeing results.


    Markov Decision Process (MDP) is characterized by:


    - State

    - Model or change work

    - Action

    - Reward

    - Policy


    Applications of Markov Decision Process: hybrid energy storage system, traffic
    signal control, generating explanations, remote experimental setups for evaluation,
    speech to the speech interaction system, a leak detection system, a learning design
    recommendation system, and so on.


    Bellman equation is the basic block of solving reinforcement learning and is omnipresent
    in RL.


    Mathematically, we can define Bellman Expectation Equation as:


    ![](image-bj6s5bm8.jpg)


    Monte Carlo methods are ways of solving the reinforcement learning problem based
    on averaging sample returns.


    The term is often used broadly for any estimation method whose activity includes
    a significant random component.


    First Visit to Monte Carlo: Average returns just for first the time s is visited
    in an episode.


    Every visit to Monte Carlo: Average returns for every time s is visited in an
    episode.


    ## Policy Iteration


    ![](image-fb6dge44.jpg)


    where denotes a policy evaluation and denotes a policy improvement.


    Each policy evaluation, itself an iterative computation, is started with the value
    function for the previous policy.


    The policy improvement theorem assures us that these policies are better than
    the original random policy.


    One drawback of the policy iteration is that each of its iterations involves policy
    evaluation, which may itself be a protracted iterative computation requiring multiple
    sweeps through the state set.


