  trans: "\n\n# 实验编号 3\n\n**目的：** 编写程序演示基于决策树的 ID3 算法的工作原理。使用合适的数据集构建决策树，并应用该知识对新样本进行分类。\n\
    \n## ID3 算法\n\n```text\nID3 (Examples, Target attribute, Attributes)\n```\n\n\
    - **Examples** 是训练示例。\n- **Target attribute** 是树预测其值的属性。\n- **Attributes** 是学习到的决策树可能测试的其他属性列表。\n\
    - 返回一棵能正确分类给定示例的决策树。\n\n### 算法步骤\n\n1. 为树创建一个根节点。\n2. 如果所有示例均为正例，返回标签为 `+` 的单节点树根。\n\
    3. 如果所有示例均为负例，返回标签为 `-` 的单节点树根。\n4. 如果属性为空，返回标签为示例中目标属性最常见值的单节点树根。\n5. 否则，开始：\n\
    \   - `A` ← 从 attributes 中 **最好地** 对示例进行分类的属性。\n   - 根的决策属性 ← `A`。\n   - 对 `A`\
    \ 的每个可能值 `v`：\n     - 在对应测试 `A = v` 的位置下添加一个新的树分支。\n     - 令 `Examples_v` 为 `A`\
    \ 取值为 `v` 的示例子集。\n     - 如果 `Examples_v` 为空：\n       - 则在此新分支下添加一个标签为示例中目标属性最常见值的叶节点。\n\
    \     - 否则在此新分支下添加子树 `ID3(Examples_v, Target attribute, Attributes – {A})`。\n\
    6. 返回根节点。\n\n最佳属性是具有最高信息增益的属性。\n\n## 训练数据集：`ML3.CSV`\n\n![数据集](img/image-bd7zu3of.jpg)\n\
    \n## 程序\n\n```python\nimport pandas as pd\n\ndf = pd.read_csv(\"ML3.CSV\")  #\
    \ 输入数据集\nt = \"Answer\"  # 目标属性为：t\nattribute_names = list(df.keys())\nattribute_names.remove(t)\
    \  # 预测属性：attribute_names\n\nimport math\n\ndef entropy(probs):\n    return sum([-prob\
    \ * math.log(prob, 2) for prob in probs])\n\ndef entropy_of_list(a_list, classes):\n\
    \    from collections import Counter\n    cnt = Counter(x for x in a_list)  #\
    \ Counter 计算类别的比例\n    total_instances = sum(cnt.values())  # 与 {0} 关联的实例/记录数为：\n\
    \    probs = [x / total_instances for x in cnt.values()]  # x 表示 YES/NO 的数量\n\
    \    return entropy(probs)  # 调用熵函数\n\ndef information_gain(df, split_attribute,\
    \ target_attribute, default_attr):\n    df_split = df.groupby(split_attribute)\
    \  # 根据属性值对数据分组\n    glist = []\n    for gname, group in df_split:\n        glist.append(gname)\
    \  # 属性值\n    glist.reverse()\n    nobs = len(df.index) * 1.0\n    df_agg = df_split.agg({target_attribute:\
    \ [entropy_of_list, lambda x: len(x) / nobs]})\n    df_agg.columns = ['Entropy',\
    \ 'PropObservations']\n    new_entropy = sum(df_agg['Entropy'] * df_agg['PropObservations'])\n\
    \    old_entropy = entropy_of_list(df[target_attribute], default_attr)\n    return\
    \ old_entropy - new_entropy\n\ndef id3(df, target_attribute, attribute_names,\
    \ default_class=None, parent_attr=None):\n    from collections import Counter\n\
    \    cnt = Counter(x for x in df[target_attribute])  # YES/NO 类别\n\n    ## 第一次检查：该数据集分割是否同质？\n\
    \    if len(cnt) == 1:\n        return next(iter(cnt))  # 下一个输入数据集，或在遇到 EOF 时引发\
    \ StopIteration。\n\n    ## 第二次检查：该数据集分割是否为空？如果是，返回默认值\n    elif df.empty or (not\
    \ attribute_names):\n        return default_class  # 对空数据集返回 None\n\n    ## 否则：该数据集已准备好进行划分！\n\
    \    # 获取此函数下一次递归调用的默认值：\n    default_class = max(cnt.keys())  # YES 和 NO 类别的数量\n\
    \n    # 计算属性的信息增益：\n    gainz = []\n    for attr in attribute_names:\n       \
    \ ig = information_gain(df, attr, target_attribute, default_class)\n        gainz.append(ig)\n\
    \        print(f\"Gain of {attr} is : {ig}\")\n\n    index_of_max = gainz.index(max(gainz))\
    \  # 最佳属性的索引\n    best_attr = attribute_names[index_of_max]  # 选择信息增益最大的属性进行划分\n\
    \    print(f\"Attribute with the maximum gain is: {best_attr}\")\n\n    # 创建一个空树，稍后填充\n\
    \    tree = {best_attr: {}}  # 以最佳属性作为节点初始化树\n    remaining_attribute_names =\
    \ [i for i in attribute_names if i != best_attr]\n\n    # 划分数据集——在每次划分时，递归调用此算法。用递归调用的结果（子树）填充空树\n\
    \    for attr_val, data_subset in df.groupby(best_attr):\n        subtree = id3(data_subset,\
    \ target_attribute, remaining_attribute_names, default_class, best_attr)\n   \
    \     tree[best_attr][attr_val] = subtree\n    return tree\n\nfrom pprint import\
    \ pprint\ntree = id3(df, t, attribute_names)\nprint(\"Resultant Decision Tree\"\
    )\npprint(tree)\n\ndef classify(instance, tree, default=None):\n    attribute\
    \ = next(iter(tree))  # Outlook/Humidity/Wind\n    if instance[attribute] in tree[attribute].keys():\
