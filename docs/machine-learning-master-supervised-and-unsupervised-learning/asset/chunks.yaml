    # Objectives


    By reading this chapter, you will be able to:


    - Learn about the concepts of semi-supervised and reinforcement learning.

    - Learn about the fundamentals of the Markov decision process and its applications.

    - Learn about the Bellman Equation for value function.

    - Learn about the Monte policy iteration and value iteration.

    - Evaluate the Q-learning reinforcement learning algorithm.

    - Identify the significance of the State-Action-Reward-State-Action (SARSA).

    - Identify the role of the model-based reinforcement learning technique.


    # Semi-supervised learning


    Semi-supervised learning falls between unsupervised learning and supervised learning.
    Unlabeled data, when used in conjunction with a small amount of labeled data,
    can produce considerable improvement in learning accuracy. The acquisition of
    the labeled data for a learning problem often requires a skilled human agent or
    a physical experiment. The cost associated with the labeling process thus may
    render large, fully labeled training sets infeasible, whereas the acquisition
    of unlabeled data is relatively inexpensive. In such situations, semi-supervised
    learning can be of great practical value. Semi-supervised learning is also of
    theoretical interest in machine learning and as a model for human learning.


    Semi-supervised learning may refer to either inductive or transductive learning.
    The goal of inductive learning is to infer the correct mapping from X to Y. The
    goal of transductive learning is to infer the correct labels from the given unlabeled
    data only.


    Reinforcement learning differs from supervised learning in not needing labeled
    input/output pairs to be presented, and in not needing sub-optimal actions to
    be explicitly corrected. Instead, the focus is on finding a balance between the
    exploration (of uncharted territory) and the exploitation (of current knowledge).


    The environment is typically stated in the form of a Markov decision process because
    many reinforcement learning algorithms for this context utilize dynamic programming
    techniques. The main difference between the classical dynamic programming methods
    and reinforcement learning algorithms is that the latter does not assume knowledge
    of an exact mathematical model of the MDP and they target large MDPs where exact
    methods become infeasible.


    Reinforcement learning, due to its generality, is studied in many other disciplines,
    such as game theory, control theory, operations research, information theory,
    simulation-based optimization, multi-agent systems, swarm intelligence, and statistics.
    In the operations research and control literature, reinforcement learning is called
    approximate dynamic programming, or neuro-dynamic programming. The problems of
    interest in reinforcement learning have also been studied in the theory of optimal
    control, which is concerned mostly with the existence and characterization of
    optimal solutions, and algorithms for their exact computation, and less with learning
    or approximation, particularly in the absence of a mathematical model of the environment.
    In economics and game theory, reinforcement learning may be used to explain how
    equilibrium may arise under bounded rationality.


