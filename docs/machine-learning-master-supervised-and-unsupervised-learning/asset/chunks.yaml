    \ cannot be held responsible for any loss or damage arising from any information\
    \ in this book.\n\nAll trademarks referred to in the book are acknowledged as\
    \ properties of their respective owners but BPB Publications cannot guarantee\
    \ the accuracy of this information.\n\nwww.bpbonline.com\n\n## Foreword\n\nRecently,\
    \ machine learning has been utilized by the governments, businesses and general\
    \ public for different purposes. Machine learning has assisted organizations by\
    \ generating profit, and its popularity among developers and technologists has\
    \ skyrocketed. To best assist the readers in better understanding of the facts,\
    \ this book is well arranged in a way that teaches them what the facts are.\n\n\
    — **Dr. Ricardo Saavedra**  \nDirector & Chair International Programs  \nUniversidad\
    \ Azteca, Mexico\n\nIn today's digital age, mastering Machine Learning is a must.\
    \ This book will elegantly guide you through everything you need to know about\
    \ this topic.\n\n— **Dr. Govind Kumawat**  \nIndian Institute of Management, Udaipur,\
    \ India\n\nThe authors provide an easy-to-understand and comprehensive overview\
    \ of Machine Learning concepts. The explanation is clear and concise, with appropriate\
    \ diagrams and real-world examples that help to demystify this emerging technology.\n\
    \n— **Dr. Deepak Khazanchi**  \nUniversity of Nebraska at Omaha, USA\n\nThis book\
    \ covers a wide range of learning approaches, with machine learning techniques\
    \ and algorithms with detailed examples to accompany each approach.\n\n— **Dr.\
    \ Samuel Agbesi**  \nAalborg University, Denmark\n\nThe adoption and prevalence\
    \ of Artificial Intelligence and Machine Learning in our daily lives are the two\
    \ most significant technological shifts in the 21st century. This book explains\
    \ the concepts of Machine Learning technologies in a concise, clear and lucid\
    \ manner.\n\n— **Dr. Shiva Raj Pokhrel**  \nDeakin University, Australia\n\nA\
    \ genuine book for those who want to learn and apply Machine Learning concepts.\n\
    \n— **Prof. Dr. Dharm Singh**  \nNamibia University of Science and Technology,\
    \ Namibia\n\nMachine Learning is a fascinating and important research topic these\
    \ days. The book also transitions from academic to research topics. As a result,\
    \ it is extremely beneficial to any researcher or academician, from beginner to\
    \ advanced level.\n\n— **Trilok Nuwal**  \nMicrosoft, India\n\nThe book is extremely\
    \ comprehensive and can be used in conjunction with any university's curriculum.\
    \ The best part of the book is that it discusses machine learning algorithms with\
    \ real-world examples and practical applications.\n\n— **Dr. Tanima Dutta**  \n\
    Indian Institute of Technology (BHU), India\n\nMachine Learning is a game changer\
    \ in the age of digitization. This book covers almost every aspect of Machine\
    \ Learning, from the fundamentals to the application level.\n\n— **Abhishek Maloo**\
    \  \nTwitter, California, USA\n\nMachine Learning, like electricity, will revolutionize\
    \ our lives in a variety of ways, some of which are not even imaginable today.\
    \ This book offers a comprehensive conceptual understanding of Machine Learning\
    \ techniques and algorithms.\n\n— **Desmond Okocha, PhD**  \nBingham University,\
    \ Nigeria\n\nThis book provides an in-depth introduction to Machine Learning even\
    \ to readers with no pre-requisite knowledge. Many mathematical concepts are explained\
    \ in an easy-to-understand manner.\n\n— **Dr. Patrick Acheampong**  \nGhana Communication\
    \ Technology University, Ghana\n\nProvides a comprehensive overview of available\
    \ techniques and algorithms in conceptual terms, encompassing a variety of machine\
    \ learning application domains.\n\n— **Dr. Sumarga Kumar Sah Tyagi**  \nZhongyuan\
    \ University of Technology, China\n\nThis book covers everything fundamental to\
    \ machine learning, to immerse yourself in the theory of the topic and to use\
    \ practical applications and examples to promote knowledge.\n\n— **Dr. Albert\
    \ Gyamfi**  \nSaskatchewan Polytechnic, Canada\n\nIn addition to covering the\
    \ theoretical aspects of machine learning, the authors teach the various techniques\
    \ for obtaining data as well as how to use different inputs and outputs to evaluate\
    \ results. Machine learning is dynamic, so the methods are always evolving.\n\n\
    — **Do Manh Thai**  \nGovt. Executive, Vietnam\n\nThis book includes the popular\
    \ learning algorithms, techniques and implementations in the artificial intelligence\
    \ field. I strongly advise this book.\n\n— **Prof. Vinesh Jain**  \nGovt. Engineering\
    \ College, Ajmer, India\n\n## Dedicated to\n\nOur lovely little daughter Miss\
    \ Bhuvi Jain. Your endless love and energy charge every day.\n\n– **Dr. Ruchi\
    \ Doshi** and **Dr. Kamal Kant Hiran**\n"
  trans: "\n\n# 机器学习\n\n**通过真实案例掌握监督与无监督学习算法**\n\n**Dr Ruchi Doshi**  \n**Dr Kamal\
    \ Kant Hiran**  \n**Ritesh Kumar Jain**  \n**Dr Kamlesh Lakhwani**\n\nwww.bpbonline.com\n\
    \n## 第一版 2022\n\n版权所有 © BPB Publications, India  \nISBN: 978-93-91392-352\n\n\
    保留所有权利。未经出版商事先书面许可，不得以任何形式或任何方式复制、分发或传播本出版物的任何部分，或将其存储于数据库或检索系统中，但程序清单除外，程序清单可录入、存储并在计算机系统中执行，但不得通过出版、复印、录制或任何电子和机械手段复制。\n\
    \n## 责任限制与免责声明\n\n本书所含信息据作者及出版商所知属实且正确。作者已竭尽全力确保出版物的准确性，但出版商不对因本书中的任何信息而导致的任何损失或损害承担责任。\n\
    \n书中提及的所有商标均被确认为其各自所有者的财产，但 BPB Publications 无法保证该信息的准确性。\n\nwww.bpbonline.com\n\
    \n## 前言\n\n近年来，政府、企业和大众出于不同目的利用机器学习。机器学习通过创造利润帮助了组织，其在开发人员和技术专家中的知名度急剧上升。为了最好地帮助读员更好地理解事实，本书安排得当，旨在教授他们事实是什么。\n\
    \n— **Dr. Ricardo Saavedra**  \n国际项目主任兼主席  \n墨西哥阿兹特克大学\n\n在当今的数字时代，掌握机器学习是必须的。本书将优雅地引导您了解关于该主题的一切所需知识。\n\
    \n— **Dr. Govind Kumawat**  \n印度乌代浦尔印度管理学院\n\n作者提供了易于理解且全面的机器学习概念概述。解释清晰简洁，配有适当的图表和真实案例，有助于揭开这项新兴技术的神秘面纱。\n\
    \n— **Dr. Deepak Khazanchi**  \n美国内布拉斯加大学奥马哈分校\n\n本书涵盖了广泛的学习方法，包含机器学习技术和算法，并附有详细示例以配合每种方法。\n\
    \n— **Dr. Samuel Agbesi**  \n丹麦奥尔堡大学\n\n人工智能和机器学习在我们日常生活中的采用与普及，是 21 世纪最重要的两大技术变革。本书以简洁、清晰、通俗易懂的方式解释了机器学习技术的概念。\n\
    \n— **Dr. Shiva Raj Pokhrel**  \n澳大利亚迪肯大学\n\n这是一本真正适合想要学习和应用机器学习概念之人的书籍。\n\n—\
    \ **Prof. Dr. Dharm Singh**  \n纳米比亚科技大学\n\n机器学习是当今一个迷人且重要的研究课题。本书还从学术主题过渡到研究主题。因此，它对从初学者到高级水平的任何研究人员或学者都极具益处。\n\
    \n— **Trilok Nuwal**  \n微软，印度\n\n本书内容极其全面，可结合任何大学的课程大纲使用。本书最好的部分在于它结合真实案例和实际应用讨论了机器学习算法。\n\
    \n— **Dr. Tanima Dutta**  \n印度理工学院（BHU），印度\n\n机器学习是数字化时代的游戏规则改变者。本书涵盖了机器学习的几乎各个方面，从基础到应用层面。\n\
    \n— **Abhishek Maloo**  \nTwitter，美国加利福尼亚州\n\n机器学习就像电力一样，将以多种方式彻底改变我们的生活，其中一些甚至在今天都是不可想象的。本书提供了对机器学习技术和算法的全面概念理解。\n\
    \n— **Desmond Okocha, PhD**  \n尼日利亚宾汉大学\n\n即使对于没有先修知识的读者，本书也提供了机器学习的深度介绍。许多数学概念都以易于理解的方式进行了解释。\n\
    \n— **Dr. Patrick Acheampong**  \n加纳通信技术大学\n\n从概念上提供了可用技术和算法的全面概述，涵盖了各种机器学习应用领域。\n\
    \n— **Dr. Sumarga Kumar Sah Tyagi**  \n中国中原工学院\n\n本书涵盖了机器学习的一切基础知识，让您沉浸于该主题的理论中，并利用实际应用和示例来促进知识掌握。\n\
    \n— **Dr. Albert Gyamfi**  \n加拿大萨斯喀彻温理工学院\n\n除了涵盖机器学习的理论方面，作者还教授获取数据的各种技术，以及如何使用不同的输入和输出来评估结果。机器学习是动态的，因此方法也在不断演变。\n\
    \n— **Do Manh Thai**  \n越南政府高管\n\n本书包含人工智能领域流行的学习算法、技术和实现。我强烈推荐此书。\n\n— **Prof.\
    \ Vinesh Jain**  \n印度阿杰梅尔政府工程学院\n\n## 献给\n\n我们可爱的小女儿 Bhuvi Jain 小姐。您无尽的爱与活力为每一天充电。\n\
    \n– **Dr. Ruchi Doshi** 和 **Dr. Kamal Kant Hiran**\n\n"
