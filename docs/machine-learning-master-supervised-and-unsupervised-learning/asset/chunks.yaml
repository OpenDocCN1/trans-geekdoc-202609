- raw: "  Clustering    Clustering is an important concept of unsupervised learning.\
    \ It is used to find out the hidden structures or patterns in uncategorized data.\
    \ The clustering algorithm process the uncategorized data and divides them into\
    \ different clusters (groups) such that objects with many similarities remain\
    \ in the same group and have fewer or no similarities with the objects of another\
    \ group. As shown in Figure it makes the two clusters of cats and dogs.    ![](image-8glklhru.jpg) \
    \ Figure 1.10: Clustering  \n\n  Association    An association rule is an unsupervised\
    \ learning method. It is used to find out the relationships between the data in\
    \ the large dataset. It determines the set of items that occurs together in the\
    \ dataset. Association rule makes marketing strategy more effective. For example,\
    \ suppose a person who buys bread also tends to buy butter/jam as shown in Figure\
    \ A typical example of the association rule is Market Basket Analysis.    ![](image-nhe4tq1z.jpg) \
    \ Figure 1.11: Association  \n\n  Reinforcement Learning    Reinforcement learning\
    \ is the third and last type of Machine Learning. This is feedback-based Machine\
    \ Learning. In Reinforcement Learning, the machine or agent atomically learns\
    \ using feedback without any labeled data. Here, the agent learns itself from\
    \ its experience.    In Reinforcement Learning, the agent uses the hit and trial\
    \ process. If the agent tries a successful step, then the agent gets a reward,\
    \ otherwise for each mistake agent gets a penalty. Its goal is to maximize the\
    \ total reward.    As shown in Figure consider the example of teaching a dog.\
    \ Since the dog does not understand any human language, we cannot tell him exactly\
    \ what to do. We create a situation, and the dog tries to respond in many different\
