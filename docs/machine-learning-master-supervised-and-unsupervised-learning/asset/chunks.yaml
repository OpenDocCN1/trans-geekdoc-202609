    # CHAPTER 2: Supervised Learning Algorithms


    ## Introduction


    Supervised machine learning turns data into real, actionable things. It is a type
    of machine learning which performs the task of implying a function from labelled
    training data. Each case is a pair of input data items and the desired output
    value. During training, the algorithm will identify the patterns in the dataset
    that correlates with the desired outputs. The aim of the supervised learning algorithm
    is to predict the correct label for the new input data.


    This chapter explores different supervised machine learning algorithms with examples.


    ## Structure


    In this chapter, we will discuss the following topics:


    - Introduction of supervised learning

    - Types of supervised learning

    - Naïve Bayes classifier

    - Decision tree

    - K-nearest

    - Logistic regression

    - Support vector machine

    - Random forest algorithm


    ## Objectives


    By reading this chapter, you will be able to:


    - Understand the concepts and types of supervised machine learning.

    - Understand the regression and classifications.

    - Understand the principle of Naive Bayes classifier algorithm.

    - Understand the decision tree concept and its structure.

    - Understand the K-Nearest Neighbours algorithm, Support Vector Machine and Random
    Forest Algorithm.


    ## Introducing Supervised Learning


    Supervised machine learning algorithms are designed to learn by experience. It
    is called supervised learning because the process of an algorithm learning from
    the training dataset can be thought of as a teacher supervising the learning process.


    In supervised learning, the data consists of an input variable and an output variable
    or the dataset is labeled. Labeled data means the input data and its associated
    output is available in the dataset. During the training process, the algorithm
    searches for the patterns in the input data and correlate them with the desired
    output data. After the training process, a supervised learning algorithm will
    take unseen data as input and will determine which label the new input will be
    classified as based on prior training data. The objective of a supervised learning
    model is to predict the correct label for the newly presented input data.


    Suppose we have a dataset of images of cats and dogs as shown in Figure. Every
    image in the dataset is labelled means we know which image represents a cat or
    which image represents a dog. We give all the images and their corresponding labels
    to the model/algorithm. Then, it will be able to make a difference on its own.


    If everything goes very well, when showing a new image to the model without having
    its label, it should be able to tell us whether it is a cat or a dog (if the model
    has learned well).


    ![](image-33yno651.jpg)


    **Figure 2.1: Supervised Learning**


    ## Types of Supervised Learning


    Supervised Machine Learning can be further classified into regression and classification
    as shown in Figure.


    ![](image-jlyog61y.jpg)


    **Figure 2.2: Types of Supervised Learning**


    ## Regression


    Regression is a mathematical method used in finance, investment, and other methods
    that attempt to determine the strength and nature of the relationship between
    a single dependent/output variable and one or more other independent/input variables.


    Regression algorithms are used if there is a relationship between one or more
    input variables and output variables. It is used when the value of the output
    variable is continuous or real, such as house price, weather forecasting, stock
    price prediction, and so on.


    The following Table 2.1 shows the dataset, which serves the purpose of predicting
    the house price, based on different parameters:


    **Table 2.1: Dataset of Regression**


    Here the input variables are Size of No. of Bedrooms and No. of Bathrooms & the
    output variable is the Price of which is a continuous value. Therefore, this is
    a Regression.


    The goal here is to predict a value as much closer to the actual output value
    and then evaluation is done by calculating the error value. The smaller the error
    the greater the accuracy of the regression model.


    Regression is used in many real-life applications, such as financial forecasting
    (house price prediction or stock price prediction), weather forecasting, time
    series forecasting, and so on.


    In regression, we plot a graph between the variables which best fits the given
    data points, using this plot, the machine learning model can make predictions
    about the data. In simple words, regression displays an entire line and curve
    in the goal predictor chart in order to minimize the vertical gap between the
    datapoints and the regression line. The distance between the data points and the
    line tells us whether a model has captured a strong relationship or not.

