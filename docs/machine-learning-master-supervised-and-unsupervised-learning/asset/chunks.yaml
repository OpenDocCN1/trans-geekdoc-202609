  trans: "\n\n# 实验 4\n\n**目的：** 通过实现反向传播算法构建人工神经网络，并使用合适的数据集进行测试。\n\n## 反向传播算法\n\n\
    ### 反向传播\n\n每个训练样本均为一对形式，其中 是网络输入值的向量， 是目标网络输出值的向量。\n\nƞ 为学习率（例如 .05）。 为网络输入数，\
    \ 为隐藏层单元数， 为输出单元数。\n\n从单元 i 输入到单元 j 的值记为 ，从单元 i 到单元 j 的权重记为 。\n\n创建一个具有 输入、 隐藏单元和\
    \ 输出单元的前馈网络。\n\n将所有网络权重初始化为小的随机数。\n\n直到满足终止条件，执行以下操作：\n\n对于训练样本中的每个 (⃗\U0001D465\
