- raw: "  Gaussian Mixture Models (GMMs)    In the Gaussian Mixture Model, it is assumed\
    \ that there are a variety of Gaussian distributions in a dataset, every Gaussian\
    \ distribution is assumed as a cluster. Moreover, a Gaussian Mixture Model aims\
    \ to group the data points associated with a single distribution.    For example,\
    \ assume there are 3 Gaussian distributions say Gd1, Gd2, and Gd3, having the\
    \ definite mean μ1, μ2, μ3, and variance σ1, σ2, σ3 respectively. So a Gaussian\
    \ Mixture Model can be used to find the probability of every data point (of a\
    \ given dataset) belonging to each of these Gaussian distributions.    A mixture\
    \ of some Gaussian distributions with a different mean (μ) and variance (σ2) is\
    \ shown below in Figure The value of variance σ represents the spread of the bell\
    \ curve:    ![](image-pw7rvo5h.jpg)  Figure 3.31: A mixture of some Gaussian distributions\
    \ with a different mean (μ) and variance (σ2)    For one-dimensional data probability,\
    \ distribution function a can be represented via a function given as follows:\
    \    ![](image-hwhhtx9r.jpg)  The above-mentioned function is true for only one-dimensional\
    \ data. For multidimensional data it can be represented by the following function:\
    \    ![](image-r2mh87ij.jpg)  Where x\\_bar is the input vector, μ\\_bar is the\
    \ 2D mean vector, and Σ is the 2×2 covariance matrix. The shape of the curve would\
    \ be defined with the help of the covariance matrix. For a d-dimensional dataset,\
    \ x\\_bar and μ\\_bar are the vectors of length d and Σ would be the d x d covariance\
    \ matrix. For a dataset with k-Gaussian distributions and d-features, each cluster\
    \ (Gaussian Distribution) will have a certain mean and variance matrix but how\
    \ can these values be assigned for each Gaussian Distribution?    These values\
    \ are estimated using a process called This technique will help to understand\
    \ the Gaussian Mixture Model.  \n\n  Expectation-Maximization    To find the proper\
    \ model parameters, Expectation-Maximization is a mathematical algorithm. When\
    \ the dataset has incomplete and/or missing values, we use EM. Such missing or\
    \ incomplete variable is referred to as latent variables.    To find the right\
    \ model of parameters, a statistical algorithm named EM is used. The EM is used\
    \ when data is has latent variables, in other words, we can say that EM will be\
    \ used when the data has missing or incomplete values. Because of these latent\
    \ variables, it's hard to decide the proper model parameter.    Expectation-Maximization\
    \ aims to determine the optimal values for these variables using the actual data\
    \ and then finds the parameters of the model. Depending on this model, parameters\
    \ of the values of latent parameters can be updated.    The process of Expectation\
    \ Minimization has two basic steps:     In this step, to approximate (guess) the\
    \ values of the missing variables, the available data is used.    The entire data\
    \ is used to update the parameters based on the approximate values produced in\
    \ the E-step.    Expectation-Maximization is a basic process that is used by many\
    \ algorithms including the Gaussian Mixture Model of clustering. Now, let us understand\
    \ how the process of EM can be applied to data for the Gaussian Mixture Model\
    \  \n\n  Expectation Maximization in GMMs    For a dataset choose a number k,\
    \ which represents the number of clusters that is, the number of Gaussian distributions.\
    \ Let’s assume μ1, μ2, .. μk and Σ1, Σ2, .. Σk are the mean and covariance of\
    \ these k Gaussian distributions respectively. Let’s say, we need to assign k\
    \ a number of clusters. We will consider another parameter Πi, that represents\
    \ the density i.e. the number of points for distribution.    To define the Gaussian\
    \ distribution, we need to find these parameters. As the value of k has already\
    \ been defined, the values of mean, covariance, and density have to be chosen\
    \ randomly. Now, we will apply the E-step and M-step.  \n\n  E-step    For each\
    \ xi: calculate the probability that xi belongs to c1, c2, c3,….ck. It can be\
    \ calculated with the help of the following formula:    ![](image-q5umwaab.jpg)\n\
    \n  M-step    After the E-step, a feedback operation is performed to update the\
    \ values of Π, μ, and Σ. It can be performed in the following ways:     The updated\
    \ density can be defined by calculating the ratio of points in the cluster and\
    \ the total number of points in the dataset.    ![](image-bu3hm25z.jpg)  The covariance\
    \ and mean can be updated with the help of the following formula:    ![](image-06oiex32.jpg)  \
    \ Based on the updated values generated from the above-mentioned step, the new\
    \ probability will be calculated for each data point and the same process is repeated\
    \ iteratively to maximize the log-likelihood function. In the k-mean algorithm,\
    \ only the mean value is used to update the centroid. Whereas, in GMM both mean\
    \ and variance is considered.  \n\n  An example of Gaussian Mixture Model    Due\
    \ to the statistical complexity, it is difficult to show the process of GMM mathematically.\
    \ Therefore, the implementation of GMM has been shown through the following Python\
    \ code:    #Loading and Plotting of dataset  \\# A Sample dataset file ‘Sample\\\
    _GMM.csv’ is used here.  import pandas as pd  data \\= pd.read\\_csv('Sample\\\
    _GMM.csv')  plt.figure(figsize=(7,7))  plt.scatter(data\\[\"Weight\"\\],data\\\
    [\"Height\"\\])  plt.xlabel('Weight')  plt.ylabel('Height')  plt.title('Data Distribution')\
    \  plt.show()    ![](image-6lrz30yx.jpg)  Figure 3.32: Data representation   \
    \ Let’s implement k-mean first to show the difference between k-mean and GMM \
    \   #training k-means model    from sklearn.cluster import KMeans  kmeans \\=\
    \ KMeans(n\\_clusters=4)      //here k=4 for k-mean.  kmeans.fit(data)    #predictions\
    \ from kmeans  pred \\= kmeans.predict(data)  frame \\= pd.DataFrame(data)  frame\\\
    ['cluster'\\] \\= pred  frame.columns \\= \\['Weight', 'Height', 'cluster'\\]\
    \    #plotting results    color=\\['blue','green','cyan', 'black'\\]  for k in\
    \ range(0,4):  data \\= frame\\[frame\\[\"cluster\"\\]==k\\]  plt.scatter(data\\\
    [\"Weight\"\\],data\\[\"Height\"\\],c=color\\[k\\])  plt.show()    ![](image-7two9crg.jpg) \
    \ Figure 3.33: Output of k-mean technique    Here, we can see that the k-mean\
    \ model struggled to classify the proper clusters. Even if the data flow is elliptical,\
    \ k-means attempted to construct a circular cluster. This is the drawback of the\
    \ k-mean algorithm.    Now, let's create a Gaussian Mixture Model on the same\
    \ data to see if the result can be improved:    \\# Training Gaussian Mixture\
    \ Model    from sklearn.mixture import GaussianMixture  gmm \\= GaussianMixture(n\\\
    _components=4)  gmm.fit(data)    #Predictions from GMM    labels \\= gmm.predict(data)\
    \  frame \\= pd.DataFrame(data)  frame\\['cluster'\\] \\= labels  frame.columns\
    \ \\= \\['Weight', 'Height', 'cluster'\\]  color=\\['blue','green','cyan', 'black'\\\
    ]  for k in range(0,4):  data \\= frame\\[frame\\[\"cluster\"\\]==k\\]  plt.scatter(data\\\
    [\"Weight\"\\],data\\[\"Height\"\\],c=color\\[k\\])  plt.show()    ![](image-2vglppe2.jpg) \
    \ Figure 3.34: Output of GMM    Brilliant! These are precisely the clusters that\
    \ we had wished for. GMM has given an improved result than the k-means algorithm.\
    \  "
  fmt: "\n# Gaussian Mixture Models (GMMs)\n\n在高斯混合模型中，假设数据集中存在多种高斯分布，每个高斯分布被视为一个簇。此外，高斯混合模型旨在将与单一分布相关联的数据点分组。\n\
    \n例如，假设存在 3 个高斯分布，分别为 `Gd1`、`Gd2` 和 `Gd3`，它们具有确定的均值 `μ1`、`μ2`、`μ3` 和方差 `σ1`、`σ2`、`σ3`。因此，可以使用高斯混合模型来计算给定数据集中每个数据点属于这些高斯分布的概率。\n\
    \n下图展示了具有不同均值（`μ`）和方差（`σ2`）的多个高斯分布的混合。方差 `σ` 的值代表钟形曲线的分布范围：\n\n![](image-pw7rvo5h.jpg)\n\
    **Figure 3.31:** A mixture of some Gaussian distributions with a different mean\
    \ (μ) and variance (σ2)\n\n对于一维数据概率，分布函数可以用以下函数表示：\n\n![](image-hwhhtx9r.jpg)\n\
    \n上述函数仅适用于一维数据。对于多维数据，可以用以下函数表示：\n\n![](image-r2mh87ij.jpg)\n\n其中 `x_bar` 是输入向量，`μ_bar`\
    \ 是二维均值向量，`Σ` 是 2×2 协方差矩阵。曲线的形状由协方差矩阵定义。对于 `d` 维数据集，`x_bar` 和 `μ_bar` 是长度为 `d`\
    \ 的向量，`Σ` 将是 `d x d` 协方差矩阵。对于具有 `k` 个高斯分布和 `d` 个特征的数据集，每个簇（高斯分布）将具有特定的均值和方差矩阵，但如何为每个高斯分布分配这些值？\n\
    \n这些值通过一个称为**期望最大化（EM）**的过程进行估计。该技术有助于理解高斯混合模型。\n\n## Expectation-Maximization\n\
    \n为了找到合适的模型参数，期望最大化是一种数学算法。当数据集具有不完整和/或缺失值时，我们使用 EM。这种缺失或不完整的变量被称为**潜在变量**。\n\n\
    为了找到正确的模型参数，使用了一种名为 EM 的统计算法。当数据具有潜在变量时使用 EM，换句话说，当数据具有缺失或不完整值时将使用 EM。由于这些潜在变量，很难确定合适的模型参数。\n\
    \n期望最大化旨在利用实际数据确定这些变量的最优值，然后找到模型的参数。根据该模型，可以更新潜在参数的值。\n\n期望最大化过程包含两个基本步骤：\n\n\
    *   **E-step (Expectation Step)：** 在此步骤中，使用可用数据来近似（猜测）缺失变量的值。\n*   **M-step (Maximization\
    \ Step)：** 使用完整数据，根据 E-step 产生的近似值来更新参数。\n\n期望最大化是许多算法（包括用于聚类的高斯混合模型）使用的基本过程。现在，让我们了解如何将\
    \ EM 过程应用于高斯混合模型的数据。\n\n## Expectation Maximization in GMMs\n\n对于一个数据集，选择一个数字\
    \ `k`，它代表簇的数量，即高斯分布的数量。假设 `μ1, μ2, .. μk` 和 `Σ1, Σ2, .. Σk` 分别代表这 `k` 个高斯分布的均值和协方差。假设我们需要分配\
    \ `k` 个簇。我们将考虑另一个参数 `Πi`，它表示密度，即分布的点数。\n\n为了定义高斯分布，我们需要找到这些参数。由于 `k` 的值已经确定，均值、协方差和密度的值必须随机选择。现在，我们将应用\
    \ E-step 和 M-step。\n\n### E-step\n\n对于每个 `xi`：计算 `xi` 属于 `c1, c2, c3,….ck` 的概率。可以通过以下公式计算：\n\
    \n![](image-q5umwaab.jpg)\n\n### M-step\n\n在 E-step 之后，执行反馈操作以更新 `Π`、`μ` 和 `Σ`\
    \ 的值。可以通过以下方式执行：\n\n*   更新后的密度可以通过计算簇中的点数与数据集中总点数的比率来定义。\n\n![](image-bu3hm25z.jpg)\n\
    \n*   协方差和均值可以通过以下公式更新：\n\n![](image-06oiex32.jpg)\n\n根据上述步骤生成的更新值，将为每个数据点计算新的概率，并迭代重复相同的过程以最大化对数似然函数。在\
    \ `k-mean` 算法中，仅使用均值来更新质心。而在 GMM 中，同时考虑均值和方差。\n\n## An example of Gaussian Mixture\
    \ Model\n\n由于统计复杂性，难以在数学上展示 GMM 的过程。因此，通过以下 Python 代码展示 GMM 的实现：\n\n### Loading\
    \ and Plotting of dataset\n此处使用示例数据集文件 `Sample_GMM.csv`。\n\n```python\nimport\
    \ pandas as pd\nimport matplotlib.pyplot as plt\n\ndata = pd.read_csv('Sample_GMM.csv')\n\
    plt.figure(figsize=(7,7))\nplt.scatter(data[\"Weight\"], data[\"Height\"])\nplt.xlabel('Weight')\n\
    plt.ylabel('Height')\nplt.title('Data Distribution')\nplt.show()\n```\n\n![](image-6lrz30yx.jpg)\n\
    **Figure 3.32:** Data representation\n\n让我们先实现 k-means 以展示 k-means 和 GMM 之间的区别。\n\
    \n### Training k-means model\n\n```python\nfrom sklearn.cluster import KMeans\n\
    \nkmeans = KMeans(n_clusters=4)  # here k=4 for k-mean.\nkmeans.fit(data)\n```\n\
    \n### Predictions from kmeans\n\n```python\npred = kmeans.predict(data)\nframe\
    \ = pd.DataFrame(data)\nframe['cluster'] = pred\nframe.columns = ['Weight', 'Height',\
    \ 'cluster']\n```\n\n### Plotting results\n\n```python\ncolor = ['blue', 'green',\
    \ 'cyan', 'black']\nfor k in range(0, 4):\n    data = frame[frame[\"cluster\"\
    ] == k]\n    plt.scatter(data[\"Weight\"], data[\"Height\"], c=color[k])\nplt.show()\n\
    ```\n\n![](image-7two9crg.jpg)\n**Figure 3.33:** Output of k-mean technique\n\n\
    这里可以看到，k-means 模型难以正确分类簇。即使数据流呈椭圆形，k-means 也试图构建圆形簇。这是 k-means 算法的缺点。\n\n现在，让我们在相同的数据上创建一个高斯混合模型，看看结果是否可以改进：\n\
    \n### Training Gaussian Mixture Model\n\n```python\nfrom sklearn.mixture import\
    \ GaussianMixture\n\ngmm = GaussianMixture(n_components=4)\ngmm.fit(data)\n```\n\
    \n### Predictions from GMM\n\n```python\nlabels = gmm.predict(data)\nframe = pd.DataFrame(data)\n\
    frame['cluster'] = labels\nframe.columns = ['Weight', 'Height', 'cluster']\ncolor\
    \ = ['blue', 'green', 'cyan', 'black']\nfor k in range(0, 4):\n    data = frame[frame[\"\
    cluster\"] == k]\n    plt.scatter(data[\"Weight\"], data[\"Height\"], c=color[k])\n\
    plt.show()\n```\n\n![](image-2vglppe2.jpg)\n**Figure 3.34:** Output of GMM\n\n\
    太棒了！这些正是我们期望的簇。与 k-means 算法相比，GMM 给出了改进的结果。\n"
