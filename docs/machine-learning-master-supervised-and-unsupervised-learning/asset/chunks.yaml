- raw: "  Recommended Systems (RS) functions    We defined RS in the previous section\
    \ as software tools and techniques that provide users with suggestions for items\
    \ they may want to use. Now we want to refine this definition by illustrating\
    \ a variety of possible roles for an RS. First and foremost, we must distinguish\
    \ between the role of the RS on behalf of the service provider and that of the\
    \ RS user. For example, a travel intermediary (for example, or a destination management\
    \ organization (for example, may introduce a travel recommender system to increase\
    \ its turnover (Expedia), i.e., sell more hotel rooms, or to increase the number\
    \ of tourists to the destination. When visiting a destination, the user's primary\
    \ motivation for accessing the two systems is to find a suitable hotel and interesting\
    \ events/attractions.    Following are the RS functions:     Increase the number\
    \ of items This is likely the most significant function for a commercial RS, the\
    \ ability to sell an additional set of items in addition to those normally sold\
    \ without any kind of recommendation. This objective is met because the recommended\
    \ items are likely to meet the user's needs and desires.    Sell more diverse\
    \ Another important function of an RS is to allow the user to select items that\
    \ may be difficult to find without a specific recommendation. For example, in\
    \ a movie rental service like Netflix, the service provider is interested in renting\
    \ all of the DVDs in the catalog, not just the most popular ones. This may be\
    \ difficult without an RS because the service provider cannot afford to risk advertising\
    \ movies that are unlikely to appeal to a specific user's tastes.    Increase\
    \ user A well-designed RS can also strengthen the user's experience with the site\
    \ or application. With a properly designed human-computer interaction, the user\
    \ will find the recommendations interesting, relevant, and useful. The combination\
    \ of effective, that is, accurate, recommendations and a user-friendly interface\
    \ will improve the system's subjective evaluation by the user.    Increase user\
    \ A user should be loyal to a website that recognizes an existing customer and\
    \ treats him as a valuable visitor when they visit. This is a common feature of\
    \ an RS because many RSs compute recommendations by leveraging information gleaned\
    \ from previous interactions with the user, such as item ratings.    Better understand\
    \ what the user Another important function of an RS that can be applied to a variety\
    \ of different applications is the description of the user's preferences, which\
    \ can be collected explicitly or predicted by the system. The service provider\
    \ may then decide to re-use this knowledge for a variety of other purposes, such\
    \ as improving stock management or production. In the travel domain, for example,\
    \ destination management organizations can decide to advertise a specific region\
    \ to new customer sectors or advertise a specific type of promotional message\
    \ derived from RS data analysis (transactions of the users).  \n\n  Applications\
    \ and Challenges of Recommended Systems    The following are some of the major\
    \ applications and challenges to the adoption of the recommended systems:  \n\n\
      Applications    RS research has been conducted with a strong focus on practice\
    \ and commercial applications, as it is generally directed at enhancing commercial\
    \ RSs in addition to its theoretical concept. The developer of an RS for a specific\
    \ application domain should understand the domain's specific facets, requirements,\
    \ application challenges, and limitations.    We define more broad categories\
    \ of fields for the most common recommended system applications based on these\
    \ specific application domains.     Entertainment Movies and music recommendations.\
    \    Content-based Personalized newspapers, documents, web pages, e-learning,\
    \ and e-mail filters recommendations.    E-commerce Products to buy such as books,\
    \ cameras, PCs, and so on. recommendations.    Services Travel services, experts\
    \ for consultation, houses to rent, and matchmaking services recommendations.\
    \    As recommended systems gain popularity, there is an increased interest in\
    \ the potential benefits of new applications, such as recommending friends or\
    \ tweets to follow, as in As a result, the preceding list cannot cover all of\
    \ the application domains that are now being addressed by RS techniques; it merely\
    \ provides an overview of the various types of application domains.  \n\n  Challenges\
    \    The following are some of the major challenges to the adoption of the recommended\
    \ systems:     The algorithms' scalability with massive and real-world datasets.\
    \ As core methodology research progresses and matures, it becomes clear that a\
    \ fundamental issue for RSs is determining how to embed core recommendation techniques\
    \ in real operating systems and how to deal with vast and dynamic sets of data\
    \ generated by user interactions with items (ratings, preferences, reviews, and\
    \ so on.).    Proactive recommender systems, or recommenders that provide recommendations\
    \ even when they are not explicitly requested. The vast majority of recommended\
    \ systems developed thus far adhere to a model, in which the user initiates the\
    \ request for a recommendation.    Systems that protect your privacy are recommended.\
    \ RSs use user data to make personalized recommendations.    The variety of items\
    \ recommended to a target user. When there is a certain degree of diversity among\
    \ the included items in a recommendation list, the user is more likely to find\
    \ a suitable item.    Systems that are distributed and operate in open networks\
    \ are recommended. The computational model of the vast majority of RSs follows\
    \ a standard client-server architecture, in which the user-client requests recommendations\
    \ from the server-recommender, who responds with the recommendations. This is\
    \ a severe limitation, and it suffers from all of the traditional problems associated\
    \ with centralized systems.    A recommender that optimizes a series of recommendations.\
    \ As previously stated, conversational RSs emerged in an attempt to improve the\
    \ effectiveness of recommendations provided by systems using a simpler approach:\
    \ a one-time request/response. Conversational RSs can be strengthened further\
    \ by incorporating learning capabilities that can optimize not only the items\
    \ that are recommended but also how the interaction between the actor and the\
    \ computer must unfold in all possible situations.    Recommenders built for mobile\
    \ devices and usage contexts. Mobile computing is quickly gaining traction as\
    \ the most natural platform for personal computing. Many recommendation requests\
    \ are likely to be made while the user is on the move, such as while shopping\
    \ or staying in a hotel in a new city. This necessitates the user interface and\
    \ designing computational solutions that can efficiently use the mobile devices'\
    \ still limited resources (computational power and screen size).  "
