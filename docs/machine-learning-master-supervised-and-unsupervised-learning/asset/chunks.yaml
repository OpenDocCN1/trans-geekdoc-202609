    # Q-Learning


    Q-learning is an off-policy reinforcement learning algorithm. Trying to find the
    best action you can take given the current state. It is considered off-policy
    because the Q-learning function learns from the actions outside the current policy,
    such as taking random steps, so policy is not required. Q-learning wants to learn
    a policy that maximizes total rewards.


    This is a value-based learning algorithm. Value-based algorithms update/adjust
    the value function based on an equation. Whereas, policy-based predict the value
    function with a greedy policy obtained from the last policy improvement.


    The ‘Q’ in Q-learning stands for quality. Quality in this case represents how
    useful a given action is in gaining some future reward.


    ## Introducing the Q-Table


    Q-Table is just a fancy name for a simple lookup table. Q-Table is the data structure
    used to calculate the maximum expected future rewards for action at each state.
    This table will guide us to the best action in each state. To learn each value
    of the Q-table, a Q-Learning algorithm is used.


    Q-table or matrix follows the shape of `[state, action]` and we initialize all
    values to zero. We then update and store Q-values after an episode. This Q-table
    becomes a reference table for the agent to select the best action based on the
    Q-value.


    In the Q-Table, the columns are the actions, and the rows are the states.


    To learn each value of the Q-table, we use the Q-Learning


    ## The Q-Learning algorithm


    The Q-function uses the Bellman equation and takes two inputs: state (`s`) and
    action (`a`).


    ![](image-bub1xg2i.jpg)

    **Figure 5.8: Q-function**


    Using the above we get the values of Q for the cells in the table. In the beginning,
    all the values in the Q-table are zeros. There is an iterative process of updating
    the values. As we start to explore the environment, the Q-function gives us better
    and better approximations by continuously updating the Q-values in the table.


    ### Q-learning algorithm


    Let us understand the Q-learning algorithm with each step in detail as shown in
    figure 5.9 as follows:


    ![](image-8objp1vf.jpg)

    **Figure 5.9: Q-learning Algorithm**


    #### Step 1: Initialize the Q-Table


    Here we first create a Q-table. There are `n` columns, where `n = number of actions`.
    There are `m` rows, where `m = number of states`. We will initialize the values
    at 0.


    #### Steps 2 and 3: Choose and perform an action


    The combination of steps 2 and 3 is performed for an undefined amount of time.
    These steps run until the time training is stopped, or when the training loop
    is stopped as defined in the code.


    First, an action (`a`) in the state (`s`) is chosen based on the Q-Table. Note
    that, as mentioned earlier when the episode initially starts, every Q-value should
    be 0. Then, update the Q-values for being at the start and moving right using
    the Bellman equation which has been explained above.


    #### Steps 4: Measure reward


    Now we have taken an action and observed an outcome and reward.


    #### Steps 5: Evaluate


    We need to update the function `Q(s, a)`. This process is repeated until the learning
    is stopped. In this way, the Q-Table is updated and the value function Q is maximized.
    Here, the `Q(state, action)` returns the expected future reward of that action
    at that state.


    ```

    New Q(s,a) = Q(s,a) = [R(s,a) + maxQ’(s’,a’) – Q(s,a)] ………………………. (9)

    ```


    Where,


    *   **New Q(s,a)**: New Q value for that state and the action

    *   **Q(s,a)**: Current Q values

    *   **α**: Learning Rate

    *   **R(s,a)**: Reward for taking thar action at that state

    *   **Y**: Discount Rate

    *   **Maximum expected future reward given the new state (s’) and all possible
    actions at that new state.**


    # State-Action-Reward-State-Action (SARSA)


    SARSA algorithm is a slight variation of the well-known Q-learning algorithm.
    For a learning agent in any reinforcement learning algorithm, the policy can be
    of two types:


    *   **On**: In this, the learning agent learns the value function as indicated
    by the current action derived from the policy currently being used.

    *   **Off**: In this, the learning agent learns the value function according to
    the action derived from another policy.


    ![](image-ad1wewus.jpg)

    **Figure 5.10: Types of policy in the Reinforcement Learning**


    Q-Learning technique is an Off-Policy method and uses the greedy way to learn
    the Q-value. SARSA technique, on the other hand, is an On-Policy method that uses
    the action performed by the current policy to learn the Q-value as shown in Figure


    SARSA is an on-policy algorithm where, in the current state, `S` an action, `A`
    is taken and the agent gets a reward, `R` and ends up in next state, `S’` and
    takes action, `A’` in `S’`. Therefore, the tuple `(S, A, R, S’, A’)` stands for
    the acronym SARSA as shown in Figure


    ![](image-bidn7siv.jpg)

    **Figure 5.11: SARSA**


    It is called an on-policy algorithm because it updates the policy based on actions
    taken.


    ## SARSA Vs Q-learning


    The significant distinction between SARSA and Q-learning is that the maximum reward
    for the following state ’is not utilized for updating the Q-values. Rather, a
    new action, and in this manner reward, is chosen utilizing the same policy that
    decided the original action.


    In SARSA, the agent begins in state 1, performs action 1, and gets a reward (reward
    1). Presently, it is in state 2 and plays out another action (action 2) and gets
    the reward from this state (reward 2) preceding it returns and updates the estimation
    of activity 1 acted in state 1. In contrast, in Q-learning, the agent begins in
    state 1, performs action 1 and gets a reward (reward 1), and then looks and sees
    what the maximum possible reward for an action is in state 2, and uses that to
    update the action value of performing action 1 in state 1. So, the difference
    is in the way the future reward is found. In Q-learning, it is simply the highest
    possible action that can be taken from state 2, and in SARSA it is the value of
    the actual action that was taken.


    ## SARSA Algorithm


    We will choose the current action `At` and the next action `A(t+1)` using the
    same policy. Thus, in the state `S(t+1)`, its action will be `A(t+1)` which is
    selected while updating the action-state value of `St`.


    ![](image-wkj2dcm5.jpg)


    The algorithm for SARSA is a little bit different from Q-learning as described
    as follows:


    ![](image-tgma8vun.jpg)


    The Q-value is updated taking into account the action, `A1` performed in the state,
    `S1` in SARSA as opposed to Q-learning where the action with the highest Q-value
    in the next state, `S1` is used to update Q-table.

