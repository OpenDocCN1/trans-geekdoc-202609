    \ link will be examined first. The frequency patterns with length-1 will be represented\
    \ by the lowest node of the tree. According to that, the path of the FP tree has\
    \ to be traversed. These paths are called conditional pattern    Build a conditional\
    \ FP-Tree: This is formed by the number of items in the path. In the conditional\
    \ FP tree, the itemsets which meets the threshold support will only be considered.\
    \    Generate frequent patterns: From the conditional FP (build in the previous\
    \ step). Frequent Patterns will be generated.  "
