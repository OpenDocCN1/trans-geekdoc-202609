  \ and FP-Tree`\nThe `FP-Tree` is designed with the database's primary objective\
  \ of space.\n\n`4.4.4 Pointer and FP-Tree`\nThe `FP-Tree` is designed with the database's\
  \ primary objective of space. The `FP-Tree` is-de-de-de-de.\n\n`4.5.1 Statistical\
  \ correlation coefficient`\nA true statistical measure is the Pearson correlation\
  \ coefficient between a pair of objects. The Pearson association coefficient between\
  \ a pair of random variables `X` and `Y` is defined as:\n`Amsterdam = E[X · Y] -\
  \ E[X] · E[Y]/gamma(X) · (Y)`\n`X` and `Y` are binary variables in market basket\
  \ data, the values of which represent the presence or absence of the objects. The\
  \ `E[X]` denotes `X`'s expectation, and `X`'s standard deviation is denoted by `gamma(X)`.\
  \ Then, if `sup(i)` and `sup(j)` are the relative supports of individual items,\
  \ and `sup(i, j)` is the relative support of itemset `j`, the overall correlation\
  \ can be calculated as follows from the data: own`Sup({i, j}) - sup(i) \\cdot (1\
  \ - sup(i)) \\cdot (1 - sup(j))`\nThe correlation coefficient is usually within\
  \ the range `[-1, 1]`, where the `+1` value indicates a perfect positive correlation,\
  \ and the `-1` value indicates a perfect negative relationship. A value close to\
  \ 0 indicates data which are weakly correlated. This measure will satisfy the symmetric\
  \ bit property. While the correlation coefficient is statistically considered the\
  \ most reliable way to quantify correlations, it is also intuitively challenging\
  \ to interpret when dealing with objects with varying but similar support values.\n\
  \n`4.5.2 \\mu_2 Measurement`\nThe `\\mu_2` measure is another bit-symmetric measure\
  \ that similarly treats the presence and absence of products. Remember that `2^k`-possible\
  \ states are reflecting the existence or absence of various objects of `X` in the\
  \ transaction for a set of `k` binary random variables (objects), denoted by `X`;\
  \ For instance, `Bread, Butter`, the `2²` states are `Bread, Butter`, `Bread, no\
  \ Butter`, `no Bread, Butter`, and neither. The anticipated fractional presence\
  \ of each of these combinations can be quantified as the product of the individual\
  \ items' state supports (presence or absence). For a given set of data, the observed\
  \ value of a state's support may vary considerably from that expected value of help.\
  \ Let `Oi` and `Ei` be the values observed and anticipated of comprehensive state.\
  \ The `\\mu_2` measure for a set of items `X` is then defined as:\n`\\mu_2(X) =\
  \ \\sum (Oi - Ei)² / \\sum Ei`\n\n`4.5.3 Ratio of interests`\nThe interest ratio\
  \ is a measure that is simple and intuitively interpretable. The ratio of interest\
  \ of a set of items `{i1, ..., ik}` is referred to as `J({i1, ..., ik})`, and is\
  \ defined as:\n`J({i1, ..., ik}) = \\frac{support(i1 \\cap ... \\cap ik)}{\\prod_{j=1}^k\
  \ support(ij)} \\times N^{k-1}`\n\n`4.5.7 Collective strength`\nAn itemset `I` is\
  \ denoted to be highly collective if there are certain objects in the contract and\
  \ others are not. The strength is defined as follows:\n`Strength(I) = 1 - support(I)`\n\
  \n\n\n\n### 第 5 章：关联模式挖掘高级概念\n\n### 5.1 引言\n关联模式挖掘算法也会发现许多模式，要利用这些海量的输出来进行特定应用的任务是非常困难的。其中一个原因是，对于特定应用，观察到的关联绝大多数是无意义或冗余的。本章将介绍一些高级方法，旨在使挖掘出的关联模式更具适用性：\n\
  \n1. **摘要**：关联模式挖掘的产出通常非常高。对于终端用户来说，一组较小的发现项集要容易理解和吸收。本章介绍了几种摘要方法，例如寻找最大项集、闭闭项集或非冗余规则。\n\
  2. **查询问答**：当存在大量项集时，用户可能希望对它们进行更小的摘要。本章将讨论几种专门的、易于查询的摘要方法。该计划是使用两阶段方法来创建一个经过数据预处理的描述，然后对该描述进行查询。\n\
  3. **约束的引入**：在许多真实场景中，人们可能希望将特定应用的约束集成到项集的生成过程中。虽然基于限制的算法并不总是能提供在线答案，但与两阶段的“一次处理，多次查询”方法相比，它允许使用更低的支持率进行挖掘。\n\
  \n表 5.1：购物篮数据集集的快照示例（复制自第 4 章的表 4.1）\n\n| tid | 项集 |\n| --- | --- |\n| 1 | {面包,\
  \ 黄油, 牛奶 } |\n| 2 | {鸡蛋, 牛奶, 酸奶 } |\n| 3 | {面包, 奶酪, 鸡蛋, 牛奶 } |\n| 4 | {鸡蛋, 牛奶, 酸奶\
  \ } |\n| 5 | {奶酪, 牛奶, 酸奶 } |\n\n\n\n\n\n这些主题都以不同的方式相互关联，旨在从项目集中提取有用的摘要信息。例如，项目集的压缩表示对于查询是有益的。一种便于查询的压缩方案与旨在确保非冗余的摘要方案显著不同。同样，与无约束的项目集相比，存在限制较少的项目集。此外，所发现的项目集规模的收缩是由于限制条件导致的，而非由于某种压缩或描述方案。此外，本章将讨论若干实用的关联模式挖掘应用。本章的结构如下：模式求和问题在第\
  \ 5.2 节中处理（见图 5.2）。第 5.3 节提供了对模式挖掘查询方法的讨论。没错，第 5.4 节探讨了正则模式挖掘的许多应用。结论部分在第 5.5 节中讨论。\n\
  \n### 5.2 趋势的摘要\n各种项目集挖掘算法也能发现大量的模式。生成的数据规模给用户吸收结果和做出准确推断带来了困难。一个重要的说明是，产生的大多数模型是冗余的。这是由于下闭性性质（downward\
  \ closure property），该性质确保了特定项目集的所有子集都是频繁的。\n\n在频繁模式挖掘中，有多种类型的紧凑表示，它们保留关于正确常量模式集及其支持值的不同层次的知识。最著名的示例是极大频繁项目集、闭频率项目集和近似表示。这些表示在所总结描述中的信息损失程度上有所不同。关于项目集支持度和成员关系的闭图像是无损的。服务方面存在损失，但在项目集成员方面是无损的。近似简化表示损失，但在应用驱动的场景下，有时具有最佳的功能替代方案。\n\
  \n### 5.2.1 全集模式\n在前章中简要探讨了极大项目集的定义。为了方便起见，这里重新描述了极大项目集：\n\n**定义 5.2.1（极大频繁项目集）**\n\
  如果一个频繁项目集是正则的，且没有任何超集是其真集，则其在给定的最小支持水平 `minsup` 下是极大的。\n\n以表 5.1 为例，它在上一章中重复了表 4.1\
  \ 的示例。鸡蛋、牛奶、酸奶项目集在最小支持水平为 2 及以上时是频繁的。由于支持单调性规则，极大项目集的真子集的支持始终等于或严格大于后者。例如，鸡蛋、牛奶是鸡蛋、牛奶、酸奶项目集的适当子集，且该子集的支持值为\
  \ 3。因此，一种概述技术是仅挖掘完整项目集。剩余的项目集被归类为全集模式子集。虽然可以通过子集方法从极大项目集推导出所有项目集，但无法获得它们的支持值。因此，极大项目集是无损的，因为它们没有保留支持值信息。\n\
  \n闭项目集挖掘的概念被用于提供支持值方面的无损表示。下一节将介绍其定义。每个正则项目集挖掘算法都是寻找所有可用项目集的一种简单方法。相反，在后处理步骤中，通过按长度检查项目集并消除真子集，仅保留最大的项目集。该过程将持续，直到所有项目集都被扫描或移除。最后未被移除的极大项目集就是目标项。\n\
  \n然而，这种方法是一种低效的解决方案。当项目集非常长时，其数量级可能远小于正则项目集的数量——在这种情况下，设计在频繁项目集发现过程中能够直接剪枝模式搜索空间部分的算法是有意义的。大多数树枚举方法都可以使用前瞻原则来剪枝模式搜索空间。在\
  \ `DepthProject` 算法上下文中，在前章中讨论了这一概念。虽然在第 4 章解释了前瞻的概念，但其完整性在这里得到了重复。\n\n令 `P` 为项目集枚举树中的一个正则模式，枚举树中的\
  \ `F (P)` 代表候选扩展 `P`。因此，如果 `F (P)` 是某个频繁序列的子集，则意味着以 `P` 为根的整个枚举树都是频繁的，因此可以排除在进一步考虑之外。如果子树未被剪枝，则需要计算\
  \ `P` 的候选扩展。在计数过程中，计算单项 `P` 候选扩展的支持度的同时会计算 `F (P)` 的支持度。如果 `F (P)` 是频繁的，则也可以运行以\
  \ `P` 为根的子树。对于采用深度优先策略的基于子集的剪枝方法，极大模式的发现比广度优先早得多。\n\n### 5.2.2 闭项目集\n**定义 5.2.2（闭项目集）**\n\
  如果没有任何超集具有相同的支持度，则项目集 `X` 是闭的。\n\n### 5.2.3 近似模式\n近似频繁模式挖掘方案几乎总是有损的，因为它们没有保留所有的项目集信息。模式的分析可以通过以下两种方式之一进行：\n\
  1. **事务摘要**：闭属性在项目集的成员关系方面提供了无损概述。该概念的推广是允许“近似”闭，即闭属性并不一定满足，而是大致定义。\n2. **基于项目集本身的描述**：在这种情况下，频繁项目集被聚类，并从每个类中提取成员以提供摘要。\n\
  \n#### 5.2.3.1 事务近似\n闭属性通过事务描述项目集，以及不同项目集与这一标准的等价性。该标准的推广是“近似闭”的概念。为了便于理解，这里引入了一种更直观的定义。\n\
  \n#### 5.2.3.2 项目集条件的近似\n近似也可以通过多种方式描述，并与聚类密切相关。令 `J = {J1 ... Jk}` 表示频繁项集。目标是确定最小值\
  \ `k`。\n\n\n\n\n\n### 第 6 章 聚类分析\n\n## 6.1 引言\n许多应用要求将数据点划分为直观上相似的组组。在多种数据挖掘应用中，将大量数据点划分为较少的类别，对于总结和解释数据有极大的帮助。一种更非正式且直观的聚类描述如下：给定一组数据点，将它们划分为包含非常相似数据点的组组。这是一个粗略且直观的定义，因为它没有详细说明该问题可以表述的各种方式，例如组的数量或目标相似性标准。尽管如此，这种简单的描述仍然是几个专门为不同应用量身定制的模型的基础。\n\
  \n此类应用的一些示例包括：\n*   **数据总结**：从最广泛的层面来看，聚类问题可以被视为数据总结的形式。聚类方法通常是许多数据挖掘算法的第一步，因为数据挖掘的核心在于从数据中提取描述性信息（或简洁的见解）。事实上，许多应用以某种或另一种形式使用了聚类分析的总结属性。\n\
  *   **客户细分**：通常需要分析相似客户群的特征行为。这通过细分客户来实现。协同过滤是客户细分方法的一个示例。特定客户群的指定或派生期望被用于社区内进行产品推荐。\n\
  *   **社交网络分析**：在网络数据的情况下，紧密连接的节点通常是相似的朋友组或社会。社区识别是社交网络研究中最常讨论的话题之一，因为对同群体动态的研究可以对人类行为提供更深入的理解。\n\
  *   **与其他数据挖掘问题的关系**：聚类问题由于其提供的简化表示对其他数据挖掘问题有用。例如，在许多分类和异常值检测模型中，聚类通常被用作预处理阶段。\n\
  \n我们开发了多种聚类分析模型。在不同的背景和数据类型下，这些不同的模型表现更好。许多聚类算法面临的挑战之一是某些特征对聚类分析可能是噪声性的或包含信息的。这些元素必须在聚类过程早期从研究中删除。这个问题被称为特征选择。此外，本章将回顾聚类特征选择算法。在本章和后续章节中，聚类分析将限制在更简单的多维数据类型，例如数值或离散数据。对于后面的章节，将讨论更特定形式的数据，例如时间数据或网络数据。\n\
  \n关键模型的主要区别在于数据组内如何定义相似性。在某些情况下，类比通过有效的距离度量显式定义。同时，在其他情况下，它通过概率混合模型或基于密度的模型隐式描述。此外，特定的聚类场景，如高维或极大规模数据集，提出了特殊的挑战。在下一章将解决这些主题。\n\
  \n本章的结构如下：第 6.2 节研究函数选择问题。第 6.3 节处理基于代表的算法。在第 6.4 节，我们分析了层次聚类算法。第 6.5 节处理概率和基于模型的数据聚类方法。第\
  \ 6.6 节讨论了基于密度的计划。第 6.7 节介绍了基于图的聚类技术。第 6.8 节介绍了用于非负矩阵分解的数据聚类方法。第 6.9 节讨论了聚类的有效性。最后在第\
  \ 6.10 节概述全章。\n\n### 6.2 函数选择集合\n选择函数的主要目标是移除聚类效果良好的噪声属性。通常，对于无监督问题的特征选择更为困难，例如聚类，因为对于特征集合无法获得标签等外部验证标准。直观上，特征选择与评估一组元素的内在聚类倾向密切相关。特征选择方法确定了能够最大化其底层聚类倾向的特征子集。\n\
  \n为了执行函数选择主要有两种类型的模型：\n1.  **过滤模型 (Filter models)**：在这种情况下，基于相似性的标准与每个函数对应一个分数。该标准本质上是一个过滤器，为移除特征提供了一个明确的条件。移除不符合必要排名的数据点。在某些情况下，这些模型可以将质量量化为特征子集的组合，而不是单个元素。这些模型更有效，因为它们隐式地考虑了添加另一个函数的累积效应。\n\
  2.  **包装模型 (Wrapper models)**：使用算法程序来评估函数子集的质量。然后用它来优化执行聚类的任务子集。这是一种自然的迭代方法，其中聚类依赖于特征的正确选择，反之亦然。通常，所选特征至少在某种程度上依赖于用于聚类的特定技术。尽管这看起来是有不利的，但事实是不同的聚类方法与不同的特征集可以工作得更好。\n\
  \n过滤模型和包装模型之间的显著区别是，前者只能作为预处理阶段执行。同时，后者直接集成到聚类过程中。\n\n### 6.2.1 模型\n过滤模型中使用一种特定标准来确定特定特征或特征子集对数据集的影响。\n\
  \n#### 6.2.1.1 持久性 (Durability)\n对于稀疏领域（如文本数据），“强度”一词是合适的。在这些语境下，考虑属性（单词）上非零值的存在或缺失比距离更重要。此外，使用相似性函数而不是距离函数是很重要的。这种方法对文档对进行采样，词强度定义为在相似文档对（大于\
  \ `β`）中，该词在两份文档中出现的比例。在某些情况下，这些模型可以将质量量化为特征子集的组合，而不是单个元素。这些模型更有效，因为它们隐式地考虑了添加另一个函数的累积效应。\n\
  \n#### 6.2.1.2 依赖预测属性 (Reliance on Predictive Attributes)\n该度量的基本目的是相关特征通常比不相关的特征导致更多的聚类。如果属性是重要的，可以使用其他属性预测其值。当质量是数值时，则使用回归算法。\n\
  1.  使用分类算法预测所有属性的值，将其视为人工变量。\n2.  任何分类算法都可以使用，但由于其与相似性计算的自然连接，优先更好。\n\n#### 6.2.1.3\
  \ 熵 (Entropy with)\n这些方法背后的基本概念是高度聚类的数据代表了底层分布。为了说明这一点，图 6.1a 和 6.1b 分别显示了两种分布。第一个显示均匀分布的数据，而第二个显示两个聚类的数据。两点距离分布如图\
  \ 6.1c 和 6.1d 所示。显然，对于均匀数据，距离分布组织成钟形。对于聚类数据，两个分离的峰对应类间和类内分布。通常基于熵的测量目标是量化给定特征子集上距离分布的“形状”。然后选择图\
  \ 6.1b 显示的更相似的行为。因此，除了量化基于距离的熵，此类算法通常需要系统方法来寻找合适的函数组合。考虑 `k` 维形式的特征集。这导致从 1 到 `m`\
  \ 的网格区域范围。通过将属性离散化为整数值 `π = m / k`，词强度也可以扩展到多维数据。\n\n#### 6.2.1.4 霍金斯数据 (Data on\
  \ Hopkins)\n霍金斯统计也用于计算数据集的聚类倾向，但也可以扩展到特定的属性子集。与上一章讨论的贪心方法一样，得到的结果可以与特征算法结合。令 `D`\
  \ 为需要评估聚类趋势的数据集。在数据空间中随机生成 `r` 个合成点样本 `S`。同时，`D` 选择 `r` 个点样本 `R`。令 `α1 ... αr` 为\
  \ `R` 中数据点与它们在 `D` 中最近邻之间的距离。同样，令 `β1 ... βr` 为合成点 `S` 与它们在 `D` 中最近邻之间的距离。霍金斯统计量\
  \ `H` 然后描述为：`H = Σαi / (Σαi + Σβi)` (i=1 到 r)。均匀分布的数据具有相同的 `α` 和 `β` 值。另一方面，对于聚类结果，`α`\
  \ 值通常低于 `β`。高 `H` 值代表强聚类数据，而低 `H` 值（接近 0.5）表示数据是随机或均匀分布的。\n\n### 6.2.2 聚类函数集合\n\
  选择函数的主要目标是移除聚类效果良好的噪声属性。注意：这指的是基于原文的特征选择。通常，对于无监督问题的特征选择更为困难，例如聚类，因为对于特征集合无法获得标签等外部验证标准。直观上，特征选择与评估一组元素的内在聚类倾向密切相关。特征选择方法确定了能够最大化其底层聚类倾向的特征子集。\n\
  \n为了执行函数选择主要有两种类型的模型：\n1.  **过滤模型 (Filter models)**：在这种情况下，基于相似性的标准与每个函数对应一个分数。该标准本质上是一个过滤器，为移除特征提供了一个明确的条件。移除不符合必要排名的数据点。在某些情况下，这些模型可以将质量量化为特征子集的组合，而不是单个元素。这些模型更有效，因为它们隐式地考虑了添加另一个函数的累积效应。\n\
  2.  **包装模型 (Wrapper models)**：使用算法程序来评估函数子集的质量。然后用它来优化执行聚类的任务子集。这是一种自然的迭代方法，其中聚类依赖于特征的正确选择，反之亦然。通常，所选特征至少在某种程度上依赖于用于聚类的特定技术。尽管这看起来是有不利的，但事实是不同的聚类方法与不同的特征集可以工作得更好。\n\
  \n过滤模型和包装模型之间的显著区别是，前者只能作为预处理阶段执行。同时，后者直接集成到聚类过程中。\n\n### 6.3 基于代表的算法 (Algorithms\
  \ based on Representatives)\n基于代表的算法是所有聚类算法中最简单的，因为它们依赖直观的距离（或相似性）概念来直接处理数据点。聚类是一次创建的，且不存在层级关系。通常通过使用一组聚类成员来实现。代表类可以从原始数据中创建。这些方法的基本原理是发现高质量的类组。一旦识别出代表，可以使用距离函数将数据点分配给其最近的代表。通常，用户通过\
  \ `k` 决定聚类的数量。`X1 ... Xn` 在 `d` 维空间中是可以的。目标是最小化目标函数 `O`：\n\n`O = min Σ_{i=1 to n}\
  \ Dist(Xi, Yj)` (6.4)\n\n句话说，重要的是最小化数据点到其最近代表的距离之和。将数据点分配到代表取决于选择代表 `Y1 ... Yk`。在代表算法的一些变体中（如\
  \ k-质心算法），假设代表 `Y1 ... Yk` 派自原始数据库，显然这不会提供最优解。除非另有说明，否则成员分配是先先未知的但它们循环依赖。这种优化问题通过使用代表的迭代方法解决。\n\
  \n### 6.4 层次聚类 (Hierarchical Clustering)\n层次聚类算法构建聚类的层次结构，通常以树状图表示。主要有两种类型：\n1.\
  \  **凝聚式 (Agglomerative, 自下而上)**：从每个数据点作为一个类开始，合并最近的对对，直到只剩一个类。\n2.  **分裂式 (Divisive,\
  \ 自上而下)**：从包含所有数据点的类开始，递归地分割它，直到每个点成为自己的类。\n\n连接的选择决定了如何衡量类之间的距离。常见的连接方法包括：\n* \
  \  **单链 (Single linkage)**：两个聚类中任意两点之间的最小距离。\n*   **全链 (Complete linkage)**：两个聚类中任意两点之间的最大距离。\n\
  *   **平均链 (Average linkage, UPGMA)**：两个聚类中所有点对之间的平均距离。\n*   **Ward 方法 (Ward's method)**：合并后最小化类内方差的增加。\n\
  \n### 6.5 概率和基于模型的数据聚类方法 (Probabilistic and model-based data clustering methods)\n\
  这些方法将数据建模为从某种概率分布生成。常见的例子是高斯混合模型 (GMM)，它假设数据提取自多个高斯分布的混合。每个高斯分布由均值向量和协方差矩阵定义。**期望极大算法\
  \ (EM)** 用于估计这些模型的参数。\n*   **E 步 (E-step)**：根据当前参数计算每个数据点属于每个类的后验概率。\n*   **M 步\
  \ (M-step)**：更新参数（均值、协方差和权重）以最大化数据的对数似然。\n\n## 6.6 基于网格并依赖密度的算法 (Algorithms based\
  \ on a grid and dependent on the density)\n这些方法根据点的密度定义聚类。在一定距离内有许多邻居的密集区域点被聚集在一起。\n\
  *   **DBSCAN (Density-Based Spatial Clustering of Applications with Noise)**：使用两个参数\
  \ `epsilon`（最大距离）和 `minPts`（最小点数）。如果一个点在 `epsilon` 内至少有 `minPts` 个点，则它是一个*核心点*。*边界点*在核心点的\
  \ `epsilon` 范围内，但本身不是核心点。所有其他点都是*噪声*。\n*   **OPTICS**：DBSCAN 的扩展，可以处理不同密度的类。\n*\
  \   **HDBSCAN**：DBSCAN 的层次版本，可以发现一系列密度的类。\n\n### 6.7 非负矩阵分解 (Non-negative matrix\
  \ factoring)\n非负矩阵分解 (NMF) 用于将矩阵 `V` 分解为两个非负矩阵 `W` 和 `H`，使得 `V ≈ WH`。这通常用于文本挖掘中的主题建模，其中\
  \ `W` 代表文档-主题分布，`H` 代表主题-词汇分布。\n\n\n\n\n\n### 第 7 章：聚类分析高级概念\n\n### 7.1 引言\n在前一节中介绍了数据的基本聚类方法。本章将研究若干高级聚类场景，例如底层数据的规模、维度或类型对聚类的影响。然而，通过使用先进的监督技术或使用基于集合的算法，可以获得有价值的见解。我们将特别介绍聚类算法的两个核心方面：\n\
  \n1.  **聚类的挑战性场景**：许多数据聚类场景具有更高的要求性。这些场景包括分类数据聚类、高维数据和大型数据聚类。由于距离度量定义的挑战，以及难以从一组特定数据点中准确定义“中心”组组的代表性，离散数据的聚类极具挑战性。在高维情况下，许多无关的维度会给聚类过程带来挑战。最后，由于可扩展性问题，海量数据集更难聚类。\n\
  2.  **高级见解**：由于聚类问题是无监督的，以有意义的方式确定底层簇的一致性也具有挑战性。在前一节讨论了聚类有效性方法的局限性。可能存在许多不同的聚类结果，且它们的相对质量可能难以评估。可以通过外部监督、人工监督或元算法（如结合多个数据簇的**集成聚类**\
  \ `ensemble clustering`）等许多方法来提高特定应用的关联性和稳健性。\n\n通常，问题性的聚类场景是由数据的特定方面引起的，这使得分析变得更加困难。具体如下：\n\
  \n*   **分类数据聚类**：对于聚类而言，完整数据集更具挑战性，因为在这些场景下相似性的定义更为困难。此外，对于分类数据与数值数据相比，聚类算法中的许多中间步骤（如确定簇的均值）并没有非常自然的定义。\n\
  *   **可扩展聚类**：大多数聚类算法允许对数据进行多次扫描。如果数据量庞大且存储在磁盘上，这将构成一种挑战。\n*   **高维聚类**：如第 3 章第\
  \ 3.2.1.2 节所述，由于许多无关属性和维度集中效应，高维数据点之间的相似性度量通常不能代表内在距离。因此，构建了若干使用投影的方法来在相关的维度子集上评估簇。\n\
  \n由于聚类是一个无监督问题，在许多许多真实场景中，簇的质量可能具有挑战性。此外，当数据存在噪声时，一致性也会很低。因此，使用了多种方法来监督聚类或从聚类过程中获得高级见解。它们如下：\n\
  \n1.  **半监督聚类**：在某些情况下，可能需要关于底层簇的局部知识。这种经验可以通过标签或其他外部输入的形式存在。这些信息可能被用于显著提高聚类的效率。\n\
  2.  **交互式和可视化聚类**：在这种情况下，可以使用用户反馈来提高聚类质量。通常，这种反馈是通过聚类过程中的视觉交互来实现的。例如，交互式方法可以在不同子空间的各种投影中探索数据，并隔离出最相关的簇。\n\
  3.  **集成聚类**：如上一节所述，不同的聚类模型可能会产生互然不同的簇。对于这个问题通常没有单一的答案。相反，可以结合多个模型的知识，从聚类过程中获得更统一的见解。`ensemble\
  \ clustering`（集成聚类）可以被视为一种用于从不同模型获取进一步信息的元算法。\n\n本节的结构如下：\n*   7.2 节讨论了分类数据聚类算法。\n\
