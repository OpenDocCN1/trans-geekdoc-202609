- "# 商业数据挖掘：关于数据挖掘与数据分析的一切知识；学习机器学习提升你的人工智能意识。\n\n\n\n![](img/Image00000.jpg)\n\n\n\
  关于数据挖掘和数据分析你需要了解的一切；学习机器学习以增强你的人工智能直觉。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 引言\n\n数据挖掘是对信息进行分组、清洗、处理、分析并从中获取有用见解的研究。在实际应用中，由于领域、应用、公式和信息表示方式的不同，存在着巨大的差异。因此，“数据挖掘”可以作为一个广义的术语，用于描述知识过程中的这些不同方面。在当今这一潮流时代，几乎所有机器控制的系统都会为了诊断或分析功能生成某些信息。这导致了知识的泛滥，规模达到了拍字节（petabytes）或艾字节（exabytes）。以下是一些专业领域的示例：\n\
  \n*   **万维网**：索引 Web 上的文档数量目前达到数十亿个，因此无形损失要大得多。用户对此类材料的访问会在服务器产生网络访问日志，并在工业场所产生用户行为画像。此外，在线的连接结构因网络图而命名，网络图本身就是一种知识形式。这些不同形式的信息在许多应用中非常有帮助。例如，可以充分挖掘在线文档和链接结构，以推导出不同主题之间的关联。另一方面，可以充分挖掘用户访问日志，以总结出频繁的访问模式或可能未经授权行为的异常模式。\n\
  *   **财务交互**：日常生活中的大多数典型交易，如消费、自动取款机（ATM）卡或万事达卡，都会以自动方式产生信息。这些交易可以被挖掘，以获得如欺诈或异常替代活动等有用见解。\n\
  *   **用户交互**：多种类型的用户交互产生了海量知识。例如，电话的使用通常会在电信公司留下记录，包含关于通话时长和目的地的详细信息。几家电信公司习惯于分析此类信息，以推导出相关的行为模式，这些模式可能用于做出有关网络能力、促销、定价或客户定位的决策。\n\
  *   **传感器技术与物联网**：最近的一项趋势是开发廉价的可穿戴传感器、智能手机以及可以进行通信的合适替代设备。据估计，在 2008 年，此类设备的数量已经超过了世界人口数量——如此巨大的信息集合对于挖掘算法具有深远影响。\n\
  \n知识的泛滥可能是技术进步和现代生活各个方面网络化的直接结果。因此，观察人们是否能够从可用信息中提取出针对特定应用目标的精辟且可能不准确的见解是自然而。这正是知识挖掘任务发挥作用的地方。数据也是绝对的、非结构化的，或者可能处于一种并不适用于机器控制过程的格式中。例如，手动收集的信息也来自不同格式的异构源，并且必须通过自动计算机程序进行处理以获得见解。\n\
  \n数据挖掘数据分析师使用处理流水线来解决这个问题，无论信息是在何时被收集、清洗并重构为统一格式的。信息还被存储在一个非常工业化的信息系统中，最后利用分析方法进行处理以获得见解。虽然数据处理通常会让人联想到分析算法，但事实上，绝大部分工作被归于该方法的信息准备部分。这一过程流水线在概念上与从矿石到精炼产物的实际采矿方法相同。“挖掘”（mining）一词就源于这种类比。\n\
  \n从分析的角度来看，由于问题和信息种类之间巨大的差异，数据处理变得非常复杂。例如，海报推荐系统对输入格式的数量极其敏感。即使在相关的的问题类别之间，差异也相当显著。例如，由于底层信息类型的不同，在三维信息中的产品推荐系统实际上是一个极佳的社交推荐系统。\n\
  \n\n\n\n\n# 第 1 章：什么是数据挖掘？\n\n数据挖掘是指适用于大型复杂数据库的方法集合，旨在消除随机性并发现隐藏的模式。数据处理方法几乎都是计算密集型的。数据处理涉及揭示信息趋势的工具、方法论和理论——这可能是数据发现过程中至关重要的一步——数据处理之所以成为如此重要的研究领域有许多驱动因素。\n\
  \n商业领域等极具活力的领域知识爆炸式增长得益于：\n* 容量无限的廉价存储设备，如云存储\n* 更快的通信和更快的关联速度\n* 更好的导航系统和软件库支持\n\
  * 快速增长的计算能力\n\n随着可以获得如此大量的各种信息，数据处理技术有助于从信息中提取信息。统计学习方法涵盖了一切，从统计回归开始，包含了最近开发的、根于工程的先进且计算密集型的模式识别方法。\n\
  \n## 1.1 数据挖掘过程\n\n如上所述，数据挖掘过程是一个包含许多阶段的流水，例如数据清洗、特征提取和算法设计。我们将在本部分回顾不同的阶段。典型数据挖掘应用的工作流包括以下步骤：\n\
  \n1.  **数据收集**：数据收集可能包括使用专用硬件（如传感器网络）、人工工作（如用户调查收集）或软件工具（如网站爬虫数据库收集引擎）。尽管这一阶段具有高度的特定特定性，有时超出了数据挖掘分析师的范畴，但它是至关重要的，因为在这一阶段，良好的选择将极大影响数据挖掘过程。数据通常存储在数据库中，或者更通用地存储在数据仓库中以便在收集阶段后处理。\n\
  \n2.  **特征提取和数据清洗**：一旦数据经过处理，其通常不是适用于处理的形式。例如，数据可能存储在结构化日志或自由格式文档中。在某些情况下，自由格式文档会随机组合各种类型的数据。将数据转换为数据挖掘算法友好的格式至关重要，例如多维、时间序列或半结构化，以便处理。最流行的格式是多维格式，其中不同的数据字段对应于各种计算属性，称为特征、属性或测量值。为挖掘阶段提取合适的特征至关重要。函数的提取过程通常与数据清洗结合进行，对数据缺失和错误的部分进行计算或校正。在许多情况下，数据可以来自不同的源，并需要合并为单一处理格式。该过程的最终产品是组织良好的数据集合，计算机程序可以有效使用。在特征提取步骤之后，数据可以再次存储在处理数据库中。\n\
  \n3.  **分析处理和算法**：从处理后的数据中设计合适的分析方法是挖掘周期的最后部分。在某些情况下，典型的数据挖掘问题（例如前面提到的四个“超级问题”）可能不会显式地用于当前应用。然而，这四个问题的涵盖范围之广，许多系统可以分解为使用这些不同构建模块的组件。本书将提供该过程的示例。图\
  \ 1.1.1 显示了数据挖掘的整体周期。注意，图中的框是分析性的。\n\n1.1 显示了几个描述给定任务解决方案概念的构建模块。算法设计的这方面取决于分析师的能力，并且经常被四个主要问题之一或多个作为构建模块使用。情况并非总是如此，但在本书中，这种频率足够让我们对这四个问题进行专门对待。我们将使用一个推荐场景的示例来来说明数据挖掘过程。\n\
  \n### 示例 1.2.1\n\n考虑一种场景：零售商拥有对应客户访问其网站网页的 Web 日志（Weblogs）。每个网页都引用一个产品，客户对网站的访问也可能对该产品感兴趣。零售商甚至存储了不同客户的人口统计特征。零售商需要根据消费者的模式和购买行为提供定制化的产品建议。\n\
  \n#### 示例流水线\n\n在这种情况下，分析师的第一步是从两个不同的源收集适当的数据。网站的第一个源是 Web 日志汇编。第二个是在客户卖家数据库中进行\
  \ Web 注册期间收集的人口细节。遗憾的是，数据集的格式有些不同，不能很容易合并在一起处理。例如，考虑如下格式的日志条目：\n\n```\n98.206.206.206\n\
  ```\n\n（注：提供的剩余文本包含重复字符串和占位符数据，已根据保留核心内容和结构的指令进行过滤。）\n\n\n\n\n\n| 姓名 | 年龄 | 性别 |\
  \ 种族 | 邮政编码 |\n| :--- | :--- | :--- | :--- | :--- |\n| John S. | 45 | 男 | 非裔 | 05139\
  \ |\n| Manyona L. | 31 | 女 | 美洲印住民 | 10598 |\n| Sayani A. | 11 | 女 | 印度人 | 10547\
  \ |\n| Jack M. | 56 | 男 | 高加索人 | 10562 |\n| Wei L. | 63 | 男 | 亚洲人 | 90210 |\n\n\n\
  \n\n\n### 1.3.1 关注相互依赖性的数据\n\n这是最纯的数据形式，通常指多维数据。通常，这些数据包含一系列文档。根据具体的应用，一条记录（record）通常被称为数据点、实体、对象或特征。该记录包含一组字段（fields），通常称为维度（dimensions）。在本书中，这些词将交替使用。这些字段中描述了该记录的各种属性。在早期阶段，关系型数据库系统传统上被设计用于处理这类数据。以表\
  \ 1.1 中概述的数据集为例。这里阐明了人口统计学属性，如年龄、性别和邮政编码。\n\n#### 定义 1.3.1 (多维数据)\n\n一组多维数据集合 `D`，`X1`...`Xn`，使得每条记录包含一个标记为\
  \ `xd` 的集合。在本书的早期章节中，我们将多维数据视为最纯粹的形式进行处理，并为处理更复杂形式的数据提供更广泛的概念基础。特定类型的数据将在后续章节中进行讨论，并直接解决依赖关系对挖掘过程的影响。\n\
  \n##### 1.3.1.1 多维定量数据\n\n表 1.1 中的属性具有不同的类型。年龄字段具有数值值，因为它具有自然顺序。这些性质被称为常数的、数学的或定量的。也称为定量数据。因此，如果\
  \ `描述 1.3.1` 中的每个值 `xj` 都是定量的，那么对应的数据集就被称为多维定量数据。这种特定的数据子类型被认为是数据文献中最流行的，本书中讨论的许多算法都是针对这种子类型工作的。这种子类型对于分析分析特别有用，因为从统计学角度来看，处理定量数据要容易得多。例如，一组定量记录的平均值可以被解释为这些数值的简单平均值，而在其他数据类型中，这些计算是复杂的。因此，在可能且高效的情况下，数据挖掘算法寻求在处理之前将不同类型的数据转换为定量值。尽管如此，数据仍假设了多维表示。在实际实现中，数据可能涉及更多细节，并可能涉及不同类型数据的组合。\n\
  \n#### 规范 1.3.1.2 混合与分类属性信息\n\n在实际实现中，多个数据集可能包含假设离散、无序值的分类属性。例如，表 1.1 中的性别、种族和邮政编码等特征具有不同的值，且它们之间没有自然顺序。如果\
  \ `规范 1.3.1` 中的 `Xj` 是分类的，那么该数据被称为离散数据或分类无序数据。在混合属性数据的情况下，存在绝对和数值属性的组合。由于它们包含数值和分类属性，表\
  \ 1.1 中的完整数据被称为多样化属性数据。性别特有因素是独特的，因为它是分类的，但只有两个可能的值。对于这些实例，可以使用专为此类数值数据设计的算法来强制执行人工排序。它被称为二元数据，可以被视为定量数据或分类数据的特例。\n\
  \n##### 1.3.1.3 二元数据与数据集\n\n二元数据既可以被视为多维分类数据的特例，也可以被视为多维定量数据。它是分类多维数据的一种特殊情况，其中每个绝对属性可以假设最多两个离散值之一。这也是多维定量结果的一个特例，因为在这两个值之间存在顺序。此外，二元数据也是集合数据的表示，其中每个属性被视为集合元素的索引。值\
  \ `1` 表示你应该将该项目包含在包中。这种数据在市场篮分析应用中是可访问的。在书中，这一主题将在第四、五章进行深入讨论。\n\n##### 1.3.1.4\
  \ 文本中的信息\n\n文本数据根据其呈现方式，可以被视为字符串或多维数据。原始形式的文本文档对应一个数字。这是一种依赖导向的数据，将在本章稍后部分定义。每个字符串都是文本相应字符（或单词）的序列。然而，文本文档很少被描绘为字符串。这是因为在大规模应用中直接有效地利用单词之间的顺序非常困难，而且在文本领域使用顺序带来的额外优势通常是微乎其微的。\n\
  \n为了实践表示，使用了向量空间，其中文本中词项的频率被用于解释。有时单词也被称为术语（terms）。在这种表示法中，时间的精确顺序丢失了。通常，这些频率与文档时长或单个术语集合中的速率等统计数据相关。对于一个包含\
  \ `n` 个文档和 `d` 个单词的文本集，对应的 `n x d` 数据矩阵被称为文档-项矩阵。当文本数据以向量空间形式表示时，可以被视为多维定量数据。属性对应单词，值对应这些属性的频率。然而，这种定量数据是不同的，因为大多数属性假设为零，而只有少数属性具有非零值。从大小为\
  \ `10⁵` 的字典中，单个文档只能包含相对较少的术语。这种现象被称为数据稀疏性，它对数据方法有重大影响。有时，直接使用定量数据在没有适当修改的情况下可能无法运行。例如，虽然使用\
  \ `定义 1.3.1` 建议的表示可能是行的，但文本数据的 `xj` 值为 `0`。因此使用了只包含单词的词袋（bag-of-words）表示法。\n\n###\
  \ 1.3.2 针对依赖定制的数据\n\n本章中上述大部分讨论都是关于多维场景的，其中假设数据记录可以被分开考虑。在实践中，不同的数据值可能在空间上相互相关，或者通过数据项之间的显式链接相关。这种依赖关系的知识会显著改变数据挖掘。\n\
  \n#### 隐性依赖关系\n\n在这种情况下，数据项之间的依赖关系不是显式定义的，但被认为是存在的。如果给定时间传感器报告的温度值显著不同，这种关系是非寻常的。\n\
  \n#### 特定依赖关系\n\n第二类图挖掘问题是包含几个小图的数据库，这些问题具有非常不同的挑战。以下是描述为图的数据示例：节点对应元素，边对应化学键。\n\
  \n#### 1.3.2.1 时间序列数据\n\n时间序列数据通常包括随时间创建的值。例如，传感器连续测量心电图（ECG）。对于长度为 `n` 的时间序列和 `d`\
  \ 个属性，对应的 `n x d` 数据矩阵被称为文档-项矩阵。每个时间戳包含部分值 `Yi = (y1...yd)`。在时间戳 `ti` 下，第 `j` 个序列是\
  \ `yj`。考虑例如，两个传感器每秒控制温度和压力的情况。这是一个 `d=2` 和 `n=60` 的多维序列。属性被分为两类：\n\n1. **上下文属性**：这些是基于上下文的属性，包含隐性依赖。例如，时间戳不是显式使用的，而是作为位置的索引。\n\
  2. **行为属性**：反映给定上下文的特质。例如，如果多个传感器在同步的时间戳上记录数据，会导致时间序列。\n\n#### 1.3.2.2 离散序列\n\n\
  离散序列可以被视为时间序列的等价形式。与时间序列的情况类似，上下文属性是有顺序的。因此，离散序列被描述为图。\n\n##### 定义 1.3.2.3 (多维离散序列)\n\
  \n长度为 `n` 维度为 `d` 的离散序列包含在每个时间戳 `t1...Tn` 的不同函数值 `Yi`。考虑例如，网页访问列表，其中请求的网页地址和源 IP\
  \ 地址被获取。这是一个长度为 `n=100`，维度为 `d=2` 的离散序列。应该注意的是，上述描述与时间序列几乎相同，区别在于序列字符串（strings）包含分类属性。\n\
  \n另一个重要的变体是序列中没有分类属性的无序值集合。例如，超市购物涉及一系列产品集合。这些集合序列不是多维序列，而是单变量序列，其中每个序列元素是一个集合。这可能是可能的。\n\
  \n### 1.3.2.3 空间中的数据\n\n在空间数据中，在空间位置计算若干非空间属性（例如，图像的像素）。气象学家还收集海面温度，以以预测发生。\n\n\
  ##### 定义 1.3.2.4 (空间数据)\n\n一个 `d`-维数据记录包含 `d` 个行为属性和另一个关于空间位置的上下文特征。一个 `d`-维数据集是\
  \ `n` 个位置 `L1...Ln` 的集合，其中记录连接到 `Li`。上述描述在 `Xi` 的记录方式提供了完全的灵活性。`Xi` 可以根据空间坐标（如经纬度）或城市或州的术语定义。\n\
  \n### 1.3.2.4 网络和信息图\n\n网络和图数据中的数据值可能对应网络中的节点，而数据值之间的关系对应网络中的边。在某些情况下，系统中的节点可以与属性相关。虽然这种情况并不常见。\n\
  \n##### 定义 1.3.2.5 (网络数据)\n\n一个 `G = (N, A)` 网络由一组节点 `N` 和一组边 `A`组成，其中 `A` 中的边代表节点关系。在某些情况下，节点\
  \ `i` 可能与属性集 `Xi` 相关，或者 `Yij` 可能与属性集相关。\n\n##### 多维时间序列到轨迹的映射\n\n根据所处理的任务，边 `ij`\
  \ 可以是有向的或无向的。例如，网页图可以包含对应于页面到页面链接方向的有边，而 Facebook 社交网络友谊是无向的。第二类图挖掘问题是一个包含几个小图的数据库，包括化学化合物。这两类问题具有非常不同的挑战。以下是描述为图的数据示例：\n\
  \n- **网页图**：节点对应网页，边对应链接。节点具有对应于页面内容的文本属性。\n- **社交网络**：在这种情况下，节点对应社交网络的参与者，边对应友谊纽带。节点具有对应于页面的属性，在不同类型的社交网络中，如电子邮件或聊天网络。\n\
  - **化合物数据库**：在这种情况下，节点对应元素，边对应化学键。此类化合物的结构对于定义药理学性质至关重要。\n\n网络数据是一种非常通用的表示，可以用于其他数据类型的数据。例如，多维数据可以通过创建数据库中每个记录的节点来映射到网络数据。这种表示方法是基于相似性的。社区检测算法可以识别网络数据中的聚类，然后将其映射回多维数据。通常，网络数据的算法开发是困难的。\n\
  \n### 1.4 主要构建块：数据挖掘的视角\n\n正如引言 1.1 所述，数据挖掘中的许多问题是聚类、关联模式挖掘和异常检测，这些在许多应用中经常遇到。是什么让这些问题变得如此特殊？为了回答这个问题，必须理解数据的典型关系复杂性。考虑一个具有\
  \ `n` 条记录和 `d` 个属性的数据库。此类数据库可以表示为 `n x d` 矩阵 `D`，其中每行对应一个文件，每列对应一个维度。数据项的关系有两种：\n\
  \n1. **列之间的关系**：计算给定行中不寻常的关系。\n2. **行之间的关系**：在这种情况下，目标是识别值相关的子集。\n\n#### 1.4.1 模式挖掘\n\
  \n关联模式挖掘问题在稀疏数据库意义上以最原始的形式定义。对于二元数据矩阵，频繁模式挖掘可以正式描述如下：\n\n定义 定义 1.4.1 (频繁模式挖掘)\n\n\
  在 `n x d` 矩阵 `D` 的情况下，评估所有列子集，使得这些列至少具有比例 `s`。模式的相对频率被称为支持度（support）。`s` 被称为最小支持度。满足最小标准的模式通常被称为频繁模式或频繁项集（frequent\
  \ itemsets）。许多设计代表大量的模型。许多其他关联模式的定义不使用绝对频率，而是使用其他量化方法。从分析角度来看，这些步骤生成了新规则。尽管如此，由于算法开发的便利，关联挖掘这一特定概念在文献中变得最常见。因此，本书将此问题称为关联挖掘而非频繁模式挖掘。例如，如果在客户数据库中，矩阵\
  \ `D` 对应面包、黄油和牛奶的列经常取值为 `1`，这意味着这些产品经常被一起购买。对于商家来说，从商店物品物理放置或促销的角度来看是有益的信息。关联模式挖掘不仅限于二元数据，通过正确的数据转换很容易扩展到定量和数值属性。关联模式挖掘是在关联规则挖掘中提出的，其中包含了一个基于置信度（confidence）度量的额外步骤。例如，考虑两个集合\
  \ `A` 和 `B`。规则 `A->B` 的置信度定义为包含 B 的交易的比例。换句话说，置信度是用 `A->B` 的支持度除以 `A` 的支持度得到的。为了描述关联规则，使用了支持度和置信度的组合。\n\
  \n定义 定义 1.4.2 (关联规则)\n\n让 `A` 和 `B` 为两个对象集合。当满足以下共同条件时，`B` 在支持水平 `s` 和置信度水平 `c`\
  \ 是有效的：\n1. 元素集 `A` 至少支持 `s`。\n2. `B` 的置信度至少为 `c`。\n\n通过将监督整合到关联规则挖掘算法中，给出分类问题的解决方案。关联挖掘中的许多差异与聚类和异常分析相关。数据矩阵始终在水平和垂直分析中连接。此外，关联模式挖掘问题的若干变体被用作子程序解决聚类、异常分析和分类问题。\n\
  \n#### 1.4.2 聚类数据\n\n聚类问题的简单非正式描述如下：\n\n定义 1.4.3 (数据聚类)\n\n将记录划分为矩阵 `D` 的集合 `i`，使得每个聚类中的记录彼此“相似”。在这里我们故意给出一个非正式描述，因为聚类允许广泛的相似概念，其中某些无法通过闭式相似函数进行描述。聚类问题通常可以描述为一个优化问题。优化问题的变量反映了数据点的聚类成员。目标函数最大化了关于这些变量的组内相似性的精确数学量化。\n\
  \n#### 1.4.3 异常检测\n\n异常是一个与其余数据有显著不同的数据点。异常由 Hawkins[259] 正式描述如下：“异常值是一个与其余数据显著不同的数据点。”在某些情况下，时间戳可能被替换为索引。因此，数据中的异常性是可能的。以下是序列数据可以出现的的一些典型场景实例：\n\
  \n1. **事件日志**：基于用户交互的各种操作系统、数据库服务器和 Web 应用。\n2. **登录**：这种特定的序列可能反映密码保护的设备。\n3. **电子邮件**：这是事件日志的一个示例。\n\
  \n\n\n\n\n| 问题 | 时间序列 | 空间 | 序列 | 网络 |\n| :--- | :--- | :--- | :--- | :--- |\n|\
  \ **模式** | 基元挖掘 周期性模式 | 共现模式 | 序列模式 周期性序列 | 结构模式 |\n| | 轨迹模式 | | | | |\n| **聚类**\
  \ | 形状聚类 | 空间聚类 | 序列聚类 | 社区检测 |\n| | 轨迹聚类 | | | | |\n| **异常值** | 位置异常值 形状异常值 | 位置异常值\
  \ 形状异常值 | 位置异常值 组合异常值 | 节点异常值 链路异常值 社区异常值 |\n| | 轨迹异常值 | | | | |\n| **分类** | 位置分类\
  \ 形状分类 | 位置分类 形状分类 | 位置分类 序列分类 | 集合分类 图形分类 |\n| | 轨迹分类 | | | | |\n\n\n\n\n#####\
  \ 1.4.5.1 使用多样化数据类型挖掘模式\n关联模式挖掘问题通常将模式定义为底层数据的集合形式的模式，但在存在依赖关系时情况并非如此。这是因为依赖关系和关联往往会强制数据对象之间存在顺序。直接使用自然模式挖掘方法无法理解不同值之间的关系。\n\
  \n例如，当提供更多数量的时间序列时，它们可以被用于评估各种不规则的频率模式，在这些模式中，序列中的对象受到临时排序。然而，由于存在代表时间的额外上下文属性，在关联规则的模式挖掘中，时间模式可以用一种比基于集合的模型更高效的方式进行描述。这些设计可能是轻微重叠的，例如时间序列中的基元（motifs），它们也可能是间歇的，例如周期性模式。在离散序列挖掘中，也会发生类似的比较，区别在于单个模式的组成部分是确定的，而不是连续的。对于空间场景，也可以定义二维基元，这种表述对于图像处理是很有用的。最后，在网络中经常识别出结构化模式，这些模式对应于频繁的数据子图。因此，节点之间的依赖关系被包含在模式规范中。\n\
  \n##### 1.4.5.2 动态数据类型聚类\n数据的底层形式极大影响了用于聚类的技术。最重要的是，`Data`形式显著影响相似性函数。例如，在时间序列、序列或图数据的情况下，很难使用`Euclidean\
  \ metric`（欧式距离）等直接指标来定义一对时间序列之间的相似性。相反，应该使用其他类型的参数，例如`edit distance`（编辑距离）或结构相似性。轨迹聚类对于识别移动数据或多元`Series\
  \ Period`的特定趋势特别有用。网络数据的聚类问题发现了密集连接的节点组，也被称为社区检测。\n\n##### 1.4.5.3 动态数据形式\n######\
  \ 异常值检测\n依赖关系可以用于定义假设的数据项值。偏离这些值的值就是离群值。例如，时间序列数量的突然变化会导致发生转换特定位置产生离群位置。这些方法中使用基于预测的技术的概念是预测该位置的值。与预测值的显著偏差被定义为离群位置。这些离群值可以在时间序列、空间和序列数据中识别，其中可以使用`autoregressive`（自回归）、`Markovian`（马尔可夫）或其他模型检测到与其邻域的显著差异。在图数据的背景下，这些离群值可能对应于节点、边或整个子图的异常属性。因此，复杂类型的数据在如何定义离群值方面显示出巨大的丰富性。\n\
  \n##### 1.4.5.4 动态数据类型分类\n分类问题在各种复杂数据类型中通常表现出大量的变异。类标记可以附加到序列中的不同位置，例如，或者附加到整个序列。假设类标签被应用于课程中的特定位置。在这种情况下，这可以用于进行有监督的事件检测。特定序列中事件相关标签（例如由底层温度和压力传感器指示的系统故障）的首次出现代表事件的发生。对于网络数据，标签可以附加到大型网络中的单个节点上，或者多重图数组中的整个图上。前者指的是社交网络中的节点分类，也被称为集体指派（collective\
  \ designation）。后者指的是化学化合物的分类，其中分类中标记被应用于它们的化学属性上。\n\n### 1.5 可扩展性问题与流式场景\n对于许多数据挖掘应用，由于应用数据规模不断增长，可扩展性是一个备关注的问题。可扩展性的例子有两个重要的：\n\
  \n1. 数据在一个或多个计算机上进行处理，但对于高效处理来说数据量太大了。例如，在所有数据都可以存储在主内存的情况下，可以轻松编写高效算法。有必要设计算法，当数据存储在驱动器上时尽可能减少对磁盘的随机访问。对于大规模数据集，需要使用如`MapReduce`这样的大数据框架。本书将重点关注这种可扩展性。\n\
  \n2. 数据随时间持续大量产生，将其存储起来完全不切实际。这种场景是数据流场景，数据必须使用在线方法进行处理。后一种情况需要一些额外的解释。由于数据收集技术的发展，可以随时间收集大量数据，流式场景变得越来越流行。例如，如使用信用卡等必要的日常活动会导致自动数据收集。在这种情况下，数据量非常大，直接存储可能是不切实际的。相反，所有算法必须在一次运行中对数据进行处理。处理数据流时发生的重大问题是：\n\
  \n- **单次通过限制（One-pass constraint）**：算法必须在一次通过中处理整个数据集。原始项在分析后被丢弃，所获得的必要见解将不再可用于处理。在给定时间内可以处理的事实数量取决于资源。\n\
  \n- **概念漂移（Concept drift）**：大多数系统中的数据分布随时间发生偏移。例如，给定小时的趋势可能与另一个小时并不相同。这也导致了算法性能的变化。由于模式随时间改变的水平不同，以及底层数据不断变化的趋势，为此类场景开发算法通常是困难的。\n\
