  # 第 2 章：数据准备\n\n## 2.1 引言\n真实数据的原始格式通常差异巨大。许多值可能缺失、在不同数据源之间不一致，或者存在错误。这为分析师有效利用数据带来了许多挑战。例如，考虑如何根据客户在社交媒体平台上的行为来确定其“偏好”的情况。接下来，分析师需要决定与挖掘过程相关的操作类型。这些活动可能对应于用户输入的兴趣、用户注册的评论，以及用户收集的好友及其兴趣。这些信息中的每一项都是复杂的，必须从社交媒体网络的各种来源中收集。此外，某些数据形式（如原始日志）由于其非结构化的本质，往往无法直接使用。换句话说，从这些数据源中提取有用特征是非常关重要的。因此，需要一个数据准备过程。\n\
  \n数据准备阶段是一个多阶段过程，涉及多个单独步骤，其中某些步骤可以用于特定的应用。步骤如下：\n\n1. **特征的提取与可移植性**：原始数据并不适合以形式形式处理。类型包括原始日志、记录、半结构化数据，甚至是其他异构数据源。在这种情况下，可能需要从数据中派生重要的特征。通常来说，具有强语义可解释性的应用更有吸引力，因为它们提高了分析师掌握中间结果的能力。此外，它们通常与当前的数据挖掘应用目标最密切相关。在数据源自各种来源的某些情况下，可能需要将其合并到一个单一处理数据库中。此外，特定的算法只能针对特定类型的数据运行，而数据可能包含复杂的形式。在一种类型的属性被转换为另一种类型的情况下，数据类型的可移植性变得至关重要。这产生了一个同质的数据集合，可以使用现有算法进行处理。\n\
  2. **数据清洗**：在数据清洗过程中，会从数据中删除无效、错误和矛盾的条目。此外，被称为插补（imputation）的方法也可以估计那些缺失的条目。\n3.\
  \ **数据压缩、选择和转换**：这一步通过选择数据子集、选择特征子集或转换数据来减小数据规模。在这一步中，收益是双倍的。其次，当数据规模较小时，算法通常更高效。其次，消除不必要的特征或记录是否提高了数据挖掘操作的效率。第一个目标是标准化采样技术和降维。为了实现第二个目标，需要使用高度针对特定问题的特征选择方法。例如，适用于聚类的特征选择方法可能不适用于分类。某些类型的特征选择与问题紧密集成。关于聚类和分组等特定问题的后续章节将对应用集合提供详尽描述。\n\
  \n本章的结构如下：特征的提取过程将在 2.2 节讨论。2.3 节涵盖了数据清洗过程。数据压缩方法在 2.4 节中阐明。2.5 节将给出的描述。\n\n###\
  \ 2.2 特征的可移植性与提取\n数据挖掘过程的第一阶段是开发一组分析师可以操作的函数。当数据是原始且非结构化的时（例如原始文本、传感器信号），提取相关特征进行处理是至关重要的。对于其他具有各种格式异构混合特征的情况，通常没有“现成”的分析方法来处理这些结果。对于此类实例，将数据转换为统一的表示进行处理是有益的。这被称为数据形式转换（porting\
  \ data form）。\n\n### 2.2.1 特征提取\n函数提取的第一步至关重要，尽管它是应用的基础。在某些实例，服务的抽象与数据类型的可移植性原则密切相关，其中一个示例的低级特征可以转换为较高层级不同类型的元素。函数提取的本质取决于提取数据的领域：\n\
  \n1. **传感器数据**：传感器数据也是作为大量微小的、低级的信号收集的。通常使用小波变换或傅里叶变换将低级信号转换为更高层级的特征。在某些情况下，在经过某些清洗后，直接使用时间序列。信号处理领域有大量的文献致力于这些方法。此类技术对于将数据从时间序列传递到多维数据也有用。\n\
  2. **图像数据**：图像数据以最原始的形式像素像素表示。颜色直方图可以在稍高的层级上用于描述不同区域的特征。最近，视觉术语的使用变得常规。这是一种语义丰富且接近文档数据的表示。图像处理的一个困难是数据通常是高维的。因此，可以根据手头的应用，在各个阶段进行特征提取。\n\
  3. **Web 日志**：Web 日志通常以预设格式（文本字符串）表示。由于这些日志中的字段定义明确且相互隔离，将访问日志转换为（相关的）类别和数值型属性的多维表示相对简单。\n\
  4. **网络流量**：网络数据包被许多入侵检测程序用于识别入侵或其他相关活动。根据底层的应用，可以从数据包中提取各种特征，例如传输的字节数、使用的网络协议等。\n\
  5. **数据**：信息数据通常以原始非结构化的形式存在，数据可以包含各种实体之间的语言关系。一种方法是删除停用词、对数据进行词干处理，并使用某种表示法。（注：此处原文存在重复或断裂）。此类技术也有助于将数据从时间序列传递到多维数据。\n\
