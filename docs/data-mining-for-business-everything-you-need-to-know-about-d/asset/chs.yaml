  \n...（后续重复内容已按要求完成逐行翻译）\n\n\n\n\n### 第 8 章：离群点分析\n\n### 8.1 引言\n离群点与其他大多数数据点非常不同的数据点。`Hawkins`\
  \ 对离群点概念的正式定义为：“离群点是指偏离其他观测值如此程度以至于人们怀疑是由不同的机制产生的陈述。”离群点可以被看作与聚类概念互补的术语。聚类试图确定相似的数据点组，而离群点是与剩余数据不同的个体数据点。在数据挖掘和统计学的文献中，离群点通常被称为偏差、`不一致`、`离群`或异常。在许多数据挖掘场景中，离群点有许多应用：\n\
  \n1. **数据清洗**：离群点通常是数据中的噪声。这些噪声可能源于数据采集过程中的错误。因此，离群点检测方法对于消除此类噪声有用。\n2. **信用卡欺诈**：异常的信用卡交易模式也可能归于欺诈。由于这些模式比标准模型稀得多，因此可以被检测为离群点。\n\
  3. **网络入侵检测**：多个网络的流量可以被看作多维信息的集合。在该流中，离群点也被描述为原始记录或底层模式的异常变化。\n\n大多数离群点检测方法都建立了一个规则模式的模型。这些模型的示例包括聚类、依赖于距离的量化或降维。当然，离群点被归类为不符合标准模型的数据点。数据点的“离群性”通过一个数值来量化，该值被称为\
  \ `outer score`（外部得分）。因此，许多离群点检测算法生成的输出可以是两种类型之一：\n\n1. **真实评估的离群评分**：此类评分量化了将数据点视为离群点的倾向。得分值越高，给定数据点是离群点的可能性就越大（在某些情况下则越小）。某些算法甚至可以产生一个概率值，用于量化给定数据点是离群点的概率。\n\
  2. **二值标签**：输出是一个二值，用于指示数据点是否为离群点。这种类型的产品比第一种包含的信息少，因为为了将它们转换为二值标签，可能对离群评分设定阈值。然而，反过来是不可能的。离群评分比二值标签通用得多。尽管如此，在大多数应用中，需要一个二值得分作为结果，因为它提供了一个清晰的决策。\n\
  \n生成离群评分涉及创建一个通常模式的模板。在某些情况下，可以配置模型基于非常有限的正常模式模型来创建特定类型的离群点。这些离群点的示例是极值，因此它们只对某些特定应用有用。\n\
  \n以下是一些领先的离群分析模型的详细介绍。后部分将更详细探讨这些模型。\n\n1. **极值**：如果数据点位于概率分布的两个端之一，则它是一个绝对值。对于多月份数据，可以使用多元概率分布而不是单变量分布来等效地指定极值。这些是非常特殊的离群点类型，但由于它们在将得分转换为标签方面的用途，通常对离群分析很有用。\n\
  2. **聚类模型**：聚类被认为是离群点分析的一个额外问题。前者寻找在组中共同出现的数据点，而后者寻找远离组的数据点。尽管如此，几种聚类模型将离群点作为算法的副产品。聚类模型的优化也可以为了显式识别离群点。\n\
  3. **基于距离的模型**：在这些情况下，对数据点进行 `k-nearest neighbor` 分布评估，以确定其是否为离群点。直观上，如果一个数据点的相邻\
  \ `k-nearest distance` 远高于其他数据点，则它是一个离群点。更细粒且以实例为中心的聚类模型变体可以被称为基于距离的模型。\n4. **基于密度的模型**：这些模型使用数据点的局部频率来确定其离群评分。基于密度的模型与距离模型密切相关，因为对于给定的数据点，当与其邻居的距离相当时，局部密度较低。\n\
  5. **概率模型**：概率聚类算法在第 6 章中讨论。由于离群分析可以被看作聚类的补充问题，使用概率模型进行离群分析是合理的。其步骤与聚类算法几乎相似，除了\
  \ `EM 算法`。\n6. **信息理论模型**：这些模型与其他模型共享新的关系。大多数其他方法固定标准模型，然后用模型量化离群点。\n\n### 8.2 极值分析\n\
  如果数据点位于概率分布的两个端之一，则它是一个绝对值。对于多月份数据，可以使用多元概率分布而不是单变量分布来等效指定极值。这些是非常特殊的离群点类型，但由于它们在将得分转换为标签方面的用途，通常对离群分析很有用。单变量极值的评估与统计尾的概念密切相关。通常，分析尾假设特定的分布描述一维数据。基于这些假设，这些方法尝试确定数据点离群的程度，即该数据点是否为绝对值。\n\
  \n### 8.2.1 多元值\n严格来说，单变量分布由尾表征。类似的概念也可以定义于多元分布；但其定义比单变量情况更复杂，并与单峰识别。\n\n### 8.2.2\
  \ 基于距离的模型\n选择标准分布来测量尾的概率。最常用的模型是正则分布。均值为 `mu` 和标准差 `sigma` 的典型分布函数 `f(x)` 定义如下：\n\
  \n```\nf(x) = 1 / (sigma * sqrt(2*pi)) * e^(-x-mu)² / (2*sigma²)\n```\n\n典型标准分布的均值为\
  \ 0，方差为 1。对于单个应用，可以通过领域的先验知识知道 `mu` 和标准差 `sigma`。或者当有大量的数据样本时，可以准确估计均值和标准差。这可以用于随机变量\
  \ `Z-value` 的估计。观测值 `xi` 的 Z 分数 `zi` 可以确定如下：\n\n```\nzi = (xi - mu) / sigma\n```\n\
  \n请注意：高正 `zi` 值对应上尾，而负值对应下尾。`Z-number` 上的正态分布可以直接表示，因为它对应于均值为 0、标准差为 1 的缩放和平随机变量。\n\
  \n正则正态分布可以用 `Z-number` 显式写入：\n\n```\nf(zi) = (1 / sqrt(2*pi)) * e^(-zi² / 2)\n```\n\
  \n### 8.2.3 深度方法\n深度方法基于一般原理：数据点的凸包代表该集的 Pareto 最优极。深度算法以迭代方式产生，在 `k` 次迭代期间移除数据集凸包的所有角。迭代\
  \ `k` 索引也包含了离群点排名，值越小意味着离群点的可能性越高。重复这些步骤直到数据集为空，将所有深度小于 `r` 的数据点记录为离群点，并将离群评分转换为二分类。\n\
  \n```\nAlgorithm FindDepthOutliers(Data Set):\n  Begin\n    K = 1;\n    找到凸包角集 S;\n\
  \    为 S 点分配深度 k;\n    D = S - D;\n    K = 1 + k;\n    当 (D 为空);\n      监控深度小于 r\
  \ 的离群点;\n    End\n  End\n```\n\n### 8.2.3 概率模型\n概率模型基于第 6 章中描述的方法的推广。\n\n### 8.4\
  \ 局部离群因子 (LOF)\n局部离群因子 (LOF) 方法是早期识别数据密度变化这一原理的方法之一。理论依据基于数据集的生成原则，但只给出了直观的解释。使用局部\
  \ `Mahalanobis` 距离来测量到类质心的距离而不是欧式距离是合理的。马哈拉纳距离与欧式距离的相同之处在于它们在不相关的方向上对数据进行标准化。例如，假设数据轴结构被旋转到主方向。在这种情况下，此类转换（轴旋转）数据集中的马哈拉纳距离在将每个转换后的坐标值除以沿其方向的标准差后，仅等于欧式距离。这种方法为马哈拉纳距离的概率分布提供了一种极佳的方法，它还提供了多元尾累积概率的精确估计。\n\
  \n### 8.5.2 离群原因 (LOF)\n局部离群因子 (LOF) 通过将局部距离与平均密度标准化来考虑局部密度差异。对于给定的数据点 `X`，令 `k(X)`\
  \ 为到邻居的距离，令 `lrd(X)` 为 `X` 邻域内的点集。从 `Y` 的到达距离定义为：\n\n```\nreachability-distance(X,\
  \ Y) = max(k-distance(Y), distance(X, Y))\n```\n\n则点 `X` 的 LOF 定义为：\n\n```\nLOF(X)\
  \ = sum(lrd(X) / lrd(neighbors)) / k(X)\n```\n\n### 8.5.2 局部距离修正方法\n章节 `3.2.1.3`\
  \ 详细讨论了局部分布对距离计算的影响。特别证明，当簇密度和形状随局部显著变化时，直线距离（如欧式距离）不能代表数据点之间的内在距离。这一原理也被应用于 `S.\
  \ 8.4`。\n\n\n\n\n\n### 第 9 章：离群分析高级概念\n\n### 9.1 引言\n前一节中描述的技术或公式无法解决离群分析中的所有情况。例如，数据形式对离群检测算法有显著影响。在分类数据上使用离群检测算法时，调整距离函数或期望-最大化（`EM`）算法中使用的分布族可能是恰当的。在许多情况下，这些更改与聚类问题——这是另一类更具挑战性的情况——中所需的更改完全相似。\n\
  \n例如，由于噪声和无关维度的掩盖行为，当数据维度很高时，应用离群分析通常具有挑战性。在这种情况下，使用一类被称为`子空间方法`（`subspace methods`）的新方法至关重要。这些方法的离群分析是在数据的低维投影中进行的。对于某些实例，这些预测很难发现，因此可以结合多个子空间的结果以获得更好的鲁棒性。更常见的是，多个模型的效应综合被称为`集成分析`（`ensemble\
  \ analysis`）。集成分析也用于数据挖掘相关的其他主题，如聚类和分类。从原则上，，分析的离群检测类似于数据聚类或分类中的离群检测。然而，在离群检测的情况下，对集成进行审查特别具有挑战性。\n\
  \n在离群研究中，本章将分析以下三组挑战性问题：\n1. **分类数据中的离群检测**：由于外部模型使用如最近邻计算和聚类等概念，这些模型需要适应可用的数据类型。本章探讨了处理分类数据样本所需的更改。\n\
  2. **高维数据**：由于“维度灾难”，这是一个极具挑战性的离群检测场景。许多属性是无关的，并且会导致模型构建错误。解决这些问题的标准解决方案是离群子空间的检测。\n\
  3. **离群集成**：在许多情况下，通过集成分析可以提高离群检测算法的鲁棒性。本节将回顾集成分析中检测的基本概念。\n\n离群分析在各个领域有许多应用，包括数据清洗、欺诈检测、金融市场、入侵检测和执法。本章还将研究一些常见的离群分析应用。\n\
  \n本章的结构如下：\n- 第 `9.2` 节描述了分类数据的外部检测模型。\n- 在 `9.3` 节中，我们讨论了高维结果的问题案例。\n- 在 `9.4`\
  \ 节中，研究了离群集成。\n- 在 `9.5` 节讨论了各种离群检测应用。\n- 第 `9.6` 节提供了总结。\n\n### 9.2 分类数据离群识别\n\
  与其他数据挖掘问题一样，底层数据类型对解决它的特定算法细节有很大影响。离群分析也不例外。然而，在离群检测的情况下，所需的更改相对较小。与聚类不同，许多离群检测算法（如基于距离的算法）使用直接的离群定义。通常，这些含义可以通过对分类数据进行微调来使其工作。对于分类数据，本节将重新回顾前一节提到的某些模型。\n\
  \n### 9.2.1 可能的模型\n易于修改概率模型以适应分类数据。概率模型将数据表示为聚类组件的混合。因此，混合的每个部分必须代表一组不同属性的集合，而不是数值属性。换句话说，必须设计一种分类数据的生成模型。不符合这种混合模型的数据点被报告为离群值。`G`\
  \ 表示混合 `... Gk` 的 `k` 个组件。生成方法将通过以下两个步骤产生 `d` 维数据集 `D` 中的每个点：\n1. 选择先验概率为 `ai` 的混合组件，其中\
  \ `{1 ... K}`。\n2. 如果在第一步中选择了混合的第 `r` 部分，则生成一个 `Gr` 数据点。一个例子是聚类 `m` 的概率 `pijm` 生成第\
  \ `j` 个属性。符号表示所有模型参数的集合。考虑包含索引 `j1 ... jd` 的数据点 `X`，其中假设值为 `r`。然后，通过以下表达式，聚类 `m`\
  \ 数据点的生成概率 `gm(X)` 给出：\n\n```\npijm = αr · gm(X) / Σ α · gm(X)\n```\n\n因此，对于所有组件，拟合之和由\
  \ `αr · gm(X)` 给出。这种拟合反映了模型产生数据点的概率。然而，为了测量这个值，需要计算参数。通过 `EM` 算法可以完成。第 `m` 个聚类的分配（或后期）似然概率\
  \ `P(m|X)` 如下：\n\n```\nP(m|X) = αm · gm(X) / Σ α · gm(X)\n```\n\n这一步为聚类提供了分配数据点的软概率，对应于\
  \ `E-step`。对于所有取第 `i` 个属性值的记录 `X`，`wijm` 的值计算：\n\n```\npijm = wijm / Σ wij\n```\n\
  \n如果数据点数量很大，某些属性值可能不在类中（或 `wijm = 0`）。通常情况下使用拉普拉斯平滑来解决这些未定义的概率。让 `mi` 为分类属性的数量。在拉普拉斯平滑中，分子处添加一个小值\
  \ `β`，分母处添加 `mi`：`(wijm + β) / (mi + β)`。这里 `β` 是控制平滑程度的参数。这种方法也用于估计。在使用基于距离或相似性的聚类算法时，应使用相同的距离或相似性函数来衡量候选到聚类中心的\
  \ `Distance(likeness)`。\n\n### 9.2.2 聚类与距离技术\n大多数聚类和基于距离的方法可以很容易从数值数据泛化到分类数据。两个重要的修改如下：\n\
  1. 分类数据需要特殊的聚类方法，这些通常与二值数据不同。在第 7 章中进行了深入讨论。你可以应用这些模型中的任何一个来创建初始类。\n2. 在分类数据的意义上，无论使用质心算法还是原始基于距离的算法，相似性函数的选择都是至关重要的。对于此函数，间隔函数非常有用。基于距离的算法裁剪技巧不依赖于距离函数的选择，可以扩展到这种情况。对于这种扩展距离定义，几种局部方法（如\
  \ `LOF`）可以扩展到这种情况。因此，通过合理的修改，聚类和基于距离的方法可以扩展到分类数据场景。\n\n### 9.2.3 二值数据数据集\n二值数据是分类数据的一种特殊形式，在许多现实场景中经常发生。这些数据被用于基于模式挖掘的章节。此外，所有分类和数值数据都可以随时转换为二值数据。该领域的一个共同特征是，虽然属性很多，但在典型交易中，属性的非零值很少。在这些情况下，模式挖掘被用作离群检测问题的程序。基本前提是离群交易中的重复趋势不太可能发生。因此，一种可能的测量是使用特定交易中频繁模式的所有支持之和。通过除以频繁模式的整数，总和被归一化。这给模式提供了一个离群评分。严格来说，最终得分中可以省略归一化，因为所有交易都是相同的。让\
  \ `D` 为包含交易 `T1 ... TN` 的交易数据库。让 `s(X, D)` 反映项目集 `X` 在 `D` 中的支持。因此，如果 `FPS(D, sm)`\
  \ 代表数据库 `D` 在最小支持 `sm` 下的频繁模式，那么交易 `T` 的频繁模式因子 `FPO(T)` 在最小支持 `sm` 下指定为：\n\n```\n\
  FPO(T) = |T ∩ FPS(D, sm)| / |FPS(D, sm)|\n```\n\n直观上，具有大量强支持的常用模式的交易应该具有很高的 `FPO(T)`\
  \ 值。这样的交易不太可能是离群值，因为它代表了数据的方差。因此，较低的分表示成为离群值的倾向更高。\n\n### 9.3 高维数据的离群检测\n由于不同属性重要性的变化，高维离群检测特别具有挑战性。理论上，通常只能在维度的子空间中解释现象。剩余的维度是无关的，并且给过程添加了噪声。因此，全维度分析往往无法暴露离群值。通过启发性例子，这种概念在图\
  \ 9.1 中得到了很好的理解。考虑包含索引 `j1 ... jd` 的数据点 `X`，其中假设值为 `r`。然后，通过以下表达式，聚类 `m` 数据点的生成概率\
  \ `gm(X)` 给出：\n\n```\npijm = αr · gm(X) / Σ αr · gm(X)\n```\n\n这反映了模型产生数据点的概率。因此被用作\
  \ `Score`。然而，为了测量这个值，需要计算参数。通过 `EM` 完成。第 `m` 个聚类的分配（或后期）似然概率 `P(m|X)` 如下：\n\n```\n\
  P(m|X) = αm · gm(X) / Σ α · gm(X)\n```\n\n这一步为聚类提供了分配数据点的软概率，对应于 `E-step`。在某些特定应用中，离群值是通过监测位置、频率和大小来跟踪的。例如，在信用卡欺诈应用中，位置、频率和大小的监测是随时间进行的。在这种情况下，离群值是通过迭代完成的。因此，从全局视角来看，所有特征都是用的，但从局部视角来看，只有一小部分维度元素是有用的。\n\
  \n### 9.3.1 集成点和子空间探索导致了离群分析的额外扩展。本章将探索两种子空间探索的方法，这些方法如下：\n1. **基于网格的稀子空间探索**：在这种情况下，在将数据离散化为网格后探索稀子空间。\n\
  2. **随机子空间采样**：对数据空间进行采样以发现离群值。\n\n所有这些方法将在子节中详细讨论。\n\n#### 9.3.1 发现特殊子空间网格\n通过识别三维空间中密度异常低的区域来计算投影离群值。由于这是一个基于密度的解决方案，选择基于网格的方法。为了这样做，定义非空网格子空间是至关重要的。这与用于子空间聚类的概念（包括\
  \ `CLIQUE`）类似。在这些情况下，频繁空间被识别出来。应该注意到，确定各种子空间比学习不同的子空间要简单得多，因为标准数据集中存在若干稀有子空间。\n\n\
  #### 9.3.1.1 窄维度建模\n一种密度异常低于平均值的低维投影。在这方面，在前一节中引入的定义是有益的。第一步是对数据进行灵活性处理。每个属性被分成范围\
  \ `p`。这些范围建立在等深度基础之上。换句话说，每个集合包含 `1/p` 的记录。当 `k` 从不同维度选择不同的区间时，它创建了一个索引为 `j1 ...\
  \ jd` 的网格单元，其中第 `r` 个属性假设该值。符号表示所有模型参数的集合。考虑包含值 `j1 ... jd` 的数据点 `X`，其中第 `r` 个属性假设该值。然后，通过以下表达式，聚类\
  \ `m` 数据点的生成概率 `gm(X)` 给出：\n\n```\npijm = αr · gm(X) / Σ αr · gm(X)\n```\n这反映了模型产生数据点的概率。因此被用作\
  \ `Score`。然而，为了测量这个值，需要计算参数。通过 `EM` 算法可以完成。第 `m` 个聚类的分配（或后期）似然概率 `P(m|X)` 如下：\n\n\
  ```\nP(m|X) = αm · gm(X) / Σ α · gm(X)\n```\n这一步为聚类提供了分配数据点的软概率，对应于 `E-step`。\n\n\
  #### 9.3.1.2 子空间离群值扫描网格\n如上述，逐级算法是不可行的。另一个问题是低维投影不提供信息。离群值的存在通常允许这些不可预测的场景。这种对维度混合的可预测性缺乏需要进化（遗传）算法来探索搜索空间。遗传算法复制生物进化过程来克服问题。毕竟，进化是自然界的第一次实验，只有适应者才能生存，并贡献出更“优化”的物种。相应地，在进化系统中，优化问题的每个解决方案都可以伪装成实体。这种“独特”的适应度衡量等于目标函数值。与个体竞争的群体是问题的另一组解决方案。社区中更适应的物种更有可能生存和繁殖。这符合选择算子。另外两个广泛使用的算子是融合和变异。每个可用的解决方案都被编码为字符串，被称为解决方案的染色表示。通常这被称为编码。因此，每个字符串都是与函数的特定目标值相关的解决方案。这个精确的值也称为适应度函数。在遗传算法中，这里的想法是通过选择算子有利于更好适应度（实际值）的字符串。这与爬山算法类似，但遗传算法运行的是群体，而不是单个。此外，进化算法通过重复选择、交叉和变异过程来提高适应度（目标）函数值。随着演化的进行，群体中的所有个体适应度都会增加并变得越来越相似。收敛时，字符串中的特定位置被定义为离群值。\n\
  \n### 9.4 离群集\n某些离群分析算法（如前一节讨论的高维方法）结合了不同离群检测执行的得分。此类算法可以用于不同类型的集成分析。例如下：\n1. **LOF\
  \ 参数调优**：`LOF` 算法中的参数调优（见第 8 章第 8.5.2.1 节）可以被解释为集成分析的形式。这是因为算法在不同的邻域大小 `k` 值上执行，并在每个数据点上选择最高的\
  \ `LOF` 分。结果是它们构建了更鲁棒的集成模型。然而，在离群分析中，参数调优算法可以认为是集成方法。\n2. **随机子空间采样**：作为原始得分的组合函数，子空间采样方法应用于数据的多个子空间以确定离群评分。这是许多数据挖掘相关的问题（如聚类和离群检测）中的简化方法。另一方面，离群分析并不完美。此外，由于离群值的稀有性，离群分析中至关重要。一个典型的离群集成包含几个组件：\n\
  - **系统组件**：这些是组合成集成的单一方法或算法。\n- **标准化**：针对比例的各种方法将产生得分。在某些情况下是升序。在其他情况下，得分可能是降序。在这种情况下，归一化组合不同组件的得分是至关重要的。\n\
  - **组合模型**：该过程指的是组合不同组件的得分。例如，在所有集合中使用最大得分或排名。\n\n### 9.4.1 按变量分类\n这种分类查看组件是否是分开形成的。\n\
  1. 一个给定的算法或一组算法在顺序集成中执行，这可以影响后续的使用。\n2. 相同的算法在顺序集成中分别执行。\n\n### 9.4.1 顺序集\n一个或多个离群检测算法应用于顺序集成中的全部或部分。由于缺乏可解释的真实值，顺序集成在离群分析中通常难以使用。在这些观察中，离群值的分布被用作某些的参考。\n\
  \n\n\n\n\n### 第 10 章：数据分类\n\n### 10.1 引言\n分类问题与第六、七章中讨论的聚类问题密切相关。分组问题的核心是识别相似的数据点，而分类问题则是研究对象数据集的结构，这些对象已经被划分为不同的组，称为类别（categories）或类（classes）。通常，这些类别的学习是在引导下进行的。该模型用于从一个或多个之前未见过的数据示例中，近似未知名称的类别标识符（或类标签）。因此，分类问题的输入之一是已经分为不同组的示例数据集。它被称为训练数据，特定的类别标识符则被称为类标签（class\
  \ labels）。\n\n在大多数情况下，在特定应用的背景下，类标签具有明确的语义解释，例如对特定产品感兴趣的客户群，或具有特定感兴趣属性的数据对象组。学习到的模型被称为训练模型。需要分类的未见数据点统称为测试数据集。此外，生成预测性训练模型的算法有时被称为学习器（learner）。因此，分类被称为监督学习。一组特定的数据用于学习分组结构，就像老师监督学生实现一个明确的目标一样。\n\
  \n虽然分类模型确定的组通常与特征变量的相似性结构有关（类似于聚类），但并不一定总是如此。示例训练数据在分类中至关重要，因为它提供了关于如何识别组的指令。基于测试示例的数据集，分类模型在测试示例上生成的组将尝试复制训练实例示例数据集中可用组的数量和结构。因此，分类问题可以直观地表述为：给定一组与每个类标签相关的训练数据点，应该能推断出一个或多个之前未知的测试实例的类标签。\n\
  \n通常，大多数分类算法有两个阶段：\n1. **训练阶段**：在此阶段，从训练实例中构建训练模型。直观地说，这可以解释为训练数据集中对命名类别的总结性数学模型。\n\
  2. **测试阶段**：在此阶段使用训练模型来决定一个或多个不可见测试实例的类标签（或组标识符）。\n\n分类问题比聚类更强大，因为它从示例数据集中捕获了用户定义的分组概念，与聚类不同。这种方法几乎可以直接应用于广泛的问题，在这些问题中，类通常是基于特定的应用标准定义的。\n\
  \n以下是一些示例：\n1. **以消费者为核心的营销**：在这种情况下，类别（或标签）指的是用户对特定产品的兴趣。例如，一组可能对应对某个产品感兴趣的客户，而其余客户可能包含在另一组。\n\
  2. **教育**：在许多情况下，对之前的购买行为提供解释。这可以用于提供可能参与或不参与特定产品的客户示例。特征变量可能对应于客户的人口统计特征。这些训练样本用于学习一个具有已知人口统计特征但购买行为未知的客户是否对特定产品感兴趣。\n\
  3. **健康疾病管理**：数据挖掘技术在医学科学中的应用近年来稳步地普及。特征可能源于患者的医学检查和程序，而类分类可以指代过程的结果。在这些情况下，我们希望基于特征构建的模型产生治疗结果。\n\
  4. **文档的分类与过滤**：大多数系统（如新闻服务）需要实时对文档进行分类。这些系统用于在 Web 门户中根据不同的主题组织文档。每个主题可能都有先前的材料示例。特征对应于报告中的单词。类标记指的是特定的问题，如政治、体育、时事等。\n\
  5. **多媒体数据分析**：识别海量的多媒体数据（包括图像、照片、音频或其他更细致的多媒体数据）也是必要的。这可能涉及与图像相关的之前的示例。可以用于评估视频是否代表了特定的操作。\n\
  \n### 分类过程\n因此，此问题可以建模为包含两个出现或不出现的特定类的二分类问题。得益于对示例的学习，分类系统参与其中。\n\n训练数据集被标记为 `D`，具有\
  \ `n` 个数据点和 `d` 个维度。然而，`D` 中的每个数据点都与标签相关。为了简单起见，某些模型假设类别 `k = 2`。在上述情况下，广泛使用的约定标签为\
  \ `1`。然而，标签来自 `0` 的事实值得注意。取决于分类器，本章将使用这些约定。\n\n构建一个训练模型，以预测未见测试实例的标签。两种形式中的一种可以是分类算法的输出：\n\
  1. **标签预测**：在这种情况下，每个测试实例都被预测持有一个标签。\n2. **数值评分**：在大多数情况下，每个实例-标签组合都由 `learner`\
  \ 分配一个评分，用于衡量实例属于某一类的倾向。\n\n这种评分可以使用不同课程中数值评分的最大值或加权最大值易地转换为标签预测。使用评分的一个优势是，可以根据各种测试实例对给定类的倾向对其进行比较和评分。这些评分在一种类型非常罕见的情况下特别有用，数值评分提供了一种评估属于该类的高分候选的方法。\n\
  \n在这些两种模型的设计过程中，存在一种细微但重要的区别……（文本继续了技术定义）。\n\n### 特征分类选择\n分类过程的第一阶段是特征选择。真实数据可能包含对类预测具有不同重要程度的元素。例如，一个人的性别在预测疾病时并不重要。无关特征通常会损害分类模型的准确性。主要有三种类型：\n\
  1. **过滤模型**：用于评估子集质量的数学准则。该方法用于过滤掉无关特征。\n2. **包装模型**：算法对于特定子集表现。然后围绕该算法进行搜索。\n3.\
  \ **嵌入模型**：分类解决方案通常包含有用特征的提示。此类特征被隔离，并由分类器训练。\n\n### Gini 指数\n该评分可以使用不同课程中数值评分的最大值或加权最大值易地转换为标签预测。使用评分的一个优势是，可以根据各种测试实例对给定类的倾向对其进行比较和评分。这些评分在一种类型非常罕见的情况下特别有用，数值评分提供了一种评估属于该类的高分候选的方法。\n\
  \n在这些两种模型的设计过程中，存在一种细微但重要的区别……\n\n"
