  \n深度学习（也称为`深度结构化学习`、`分层学习`或`深度机器学习`）是[机器学习](https://en.wikipedia.org/wiki/Machine_learning\
  \ \"机器学习\")的一个分支，基于一组[算法](https://en.wikipedia.org/wiki/Algorithm \"算法\"),试图对数据中的高层抽象进行建模。在简单的情况下，可能有两组神经元：接收输入信号的和发送输出信号的组。当输入层接收到输入时，它会将输入的修改版本传递给下一层。在深层网络中，输入层和输出层之间有许多层（这些层并非由神经元组成，但将其这样认为有助于理解），这使得算法可以使用由多个线性性和非线性变换组成的多个处理层。\n\
  \n深度学习是更广泛的基于数据表示学习的机器学习方法家族的一部分。一个观测值（例如图像）可以用多种方式表示，例如每个像素的强度值向量，或者更抽象地表示为一组边缘、特定形状的区域等。某些表示方法在简化学习任务（例如人脸识别或面部表情）方面优于其他方法。深度学习的承诺之一是用高效的算法取代手工特征，用于[无监督](https://en.wikipedia.org/wiki/Unsupervised_learning\
  \ \"无监督学习\")或半监督特征学习。该领域的研究试图创建更好的表示，并建立模型来从大规模数据中学习这些表示。某些表示方法的灵感来自神经科学的进展，并松地基于对神经系统信息处理和通信模式的解释，例如神经编码，试图定义各种刺激与大脑中相关神经元反应之间的关系。\n\
  \n各种深度学习架构，如深度神经网络、卷积神经网络、深度信念网络和循环神经网络已应用于计算机视觉、自动语音识别、自然语言处理、音频识别和生物信息学等领域，它们在各种任务中已被证明能够产生最先进的成果。深度学习被描述为一个热词，或神经网络的重新品牌。深度学习被表征为一类[机器学习](https://en.wikipedia.org/wiki/Machine_learning\
  \ \"机器学习\") [算法](https://en.wikipedia.org/wiki/Algorithm \"算法\")，其特点是：\n\n* 使用许多层非线性处理单元级联进行特征提取和变换。每一层都使用前一层的输出作为输入。算法可以是监督的或无监督的，应用包括模式分析（无监督）和分类（监督）。\n\
  * 基于对数据多个层级特征或表示的（无监督）学习。高层特征从低层特征派生出来，形成分层表示。\n* 是更广泛的基于数据表示学习的机器学习领域的一部分。\n* 学习对应于不同抽象级别的多个级表示；这些级别形成了一个概念的层级结构。\n\
  \n这些定义的的共同点是具有多层非线性处理单元，以及每层对特征表示的监督或无监督学习，这些层形成了从低层特征到高层特征的层级结构。深度学习算法中使用的非线性处理单元层的组成取决于要解决的问题。深度学习中已使用的层包括人工神经网络的隐藏层和一组命题公式。它们还可能包括在深度生成模型中按层组织的潜变量，例如深度信念网络和深度玻尔兹兹曼机中的节点。\n\
  \n深度学习算法基于分布式表示。分布式表示背后的基本假设是，观测数据是由分层组织的因素的相互作用生成的。深度学习增加了一个假设，即这些因素层对应于抽象或组合的层级。不同数量的层数和层的大小可以提供不同程度的抽象。深度学习利用了这种分层解释因素的想法，即从低层因素学习更高级别、更抽象的概念。这些架构通常使用贪心的逐层方法构建。深度学习有助于解开这些抽象，并选出哪些特征对学习是有用的。\n\
  \n对于监督学习任务，深度学习方法消除了特征工程，通过将数据转换为类似于主成分的紧凑中间表示，并推导出消除冗余的层级结构。许多深度学习应用于无监督学习，因为无标记数据通常比标记数据更丰富。以无监督方式训练的深度结构示例包括神经压缩和信念网络。深度学习应用于科学的各个领域。常见应用包括：\n\
  \n* 自动语音识别\n* 图像识别\n* 自然语言处理\n* 药物发现和毒理学\n* 客户关系管理\n* 推荐系统\n* 生物信息学\n\n\nMATLAB\
  \ 拥有`神经网络工具`，它提供了算法、函数和应用程序来创建、训练、可视化和模拟神经网络。它可以执行分类、回归、聚类、降维、时间序列预测以及动态系统建模和控制。\n\
  \n该工具包含了用于分类和特征学习任务的卷积神经网络和自动编码器深度学习算法。为了加速大型数据集的训练，可以使用`并行计算工具`将计算分布在多内核处理器、GPU\
  \ 和计算集群。\n\n重要的特性包括：\n\n* 深度学习，包括卷积神经网络和自动编码器\n* 并行计算和 GPU 支持以加速训练（配合并行计算工具）\n*\
  \ 监督学习算法，包括多层、径基、学习向量量化(`LVQ`)、延迟、非线性自回归(`NARX`)和循环神经网络(`RNN`)\n* 无监督学习算法，包括自组织映射和竞争层\n\
  * 用于数据拟合、模式识别和聚类的应用程序\n* 用于预处理、后处理和网络可视化，以提高训练效率并评估网络性能\n\n神经网络工具提供了简单的 MATLAB 命令来创建和连接深度神经网络的层。示例和预训练网络使得即使没有高级计算机视觉算法或神经网络的知识，也能轻松使用\
  \ MATLAB 进行深度学习。\n\n| 您想做什么？ | MATLAB 工具 |\n| --- | --- |\n| 使用迁移学习用您的数据微调网络 | 使用迁移学习更快地开始深度学习\
  \ |\n| 获取预训练网络进行探索并用于分类图像 | 预训练卷积神经网络 |\n\n\n\n\n\n| 创建一个新的深度神经网络以执行分类或回归 | 创建用于分类的简单深度学习网络训练用于回归的卷积神经网络\
  \ |\n| 使用无法放入内存的数据集训练网络 | 使用 ImageDatastore 中的数据训练卷积神经网络 |\n| 训练用于目标检测的网络 | 深度学习、目标检测和识别（计算机视觉系统工具箱）\
  \ |\n| 根据文件夹名称自动标记您的图像数据，或使用 App 交互标记 | 使用 ImageDatastore 中的数据训练卷积神经网络为分类模型训练标记图像（计算机视觉系统工具箱）\
  \ |\n| 可视化网络学习到的特征 | 使用 AlexNet 创建 Deep Dream 图像视化卷积神经网络的激活值 |\n| 在 CPU、GPU、多个 GPU\
  \ 上训练，并在您的桌面电脑或云集群上并行运行 | 在 GPU 上和并行进行基于大数据的深度学习 |\n\n深度学习利用神经网络直接从数据中学习有用的特征表示。神经网络结合了多个非线性处理层，使用受生物神经系统启发的、并行运行的简单元素。深度学习模型可以在目标分类中达到顶级的准确率，有时甚至超过人类水平。\n\
  \n你使用一组大型标记数据和包含许多层（通常包括一些卷积层）的神经网络架构来训练模型。训练这些模型是计算密集型的，你通常可以通过使用高性能 GPU 来加速训练。此图显示了卷积神经网络如何结合层从许多图像中自动学习特征以便对新图像进行分类。\n\
  \n![Descripción: http://es.mathworks.com/help/nnet/ug/deep\\_learning\\_arch\\_crop.png](img/00001.jpeg)\n\
  \n许多深度学习应用使用图像文件，有时是数百万个图像文件。为了高效访问访问许多图像文件，MATLAB 提供了 `imageDatastore` 函数。使用此函数可以：\n\
  \n* 自动读取批量图像，以便在机器学习和计算机视觉应用中进行快速处理\n* 从无法放入内存的图像集合导入数据\n* 根据文件夹名称自动标记您的图像数据\n\n\
  # 1.3 深度学习与 MATLAB 代码\n此示例演示了如何仅用 10 行 MATLAB 代码使用深度学习识别实时网络摄像头上的物体。尝试此示例以查看在 MATLAB\
  \ 中开始深度学习有多简单。\n\n1. 运行这些命令以根据需要获取下载内容，连接到摄像头并获取预训练的神经网络。\n2.\n```matlab\ncamera\
  \ = webcam; % 连接到摄像头\nnet = alexnet; % 加载神经网络\n```\n如果你需要安装 `webcam` 和 `alexnet`\
  \ 附加组件，每个函数都会出现带有链接的消息，帮助你使用 Add-On Explorer 下载免费附加组件。或者，参见用于 *AlexNet Network*\
  \ 的 `Neural Network Toolbox Model` 和 `MATLAB Support Package for USB Webcams`。\n\
  \n安装用于 *AlexNet Network* 的 Neural Network Toolbox Model 后，可以使用它可以分类图像。AlexNet 是一个预训练的卷积神经网络\
  \ (CNN)，在百万图像上训练过，可以将图像分类为 1000 个物体类别（例如：键盘、鼠标、咖啡杯、铅笔和许多动物）。\n\n3. 运行以下代码显示结果：\n\
  ```matlab\nwhile true\n    img = snapshot(camera);\n    label = classify(net, img);\n\
  \    imshow(img);\n    title(string(label));\nend\n```\n\n![Descripción: http://es.mathworks.com/help/nnet/ug/webcam_coffee.png](img/00002.jpeg)\n\
  \n对于后续步骤，使用 [`imageresize`](https://www.mathworks.com/help/images/imageresize.html)\
  \ 调整图像大小。\n\n\n## 2.1 迁移学习\n\n迁移学习在深度学习中常用。你获取一个预训练网络并将其用于其他任务。使用迁移学习微调网络比从头开始训练快得多也更容易。你可以将其用于较小的数据。\n\
  \n例如，如果你使用一个在数千或数百万图像上训练过的网络，你只需要几百张图像。如果你有一个非常大的数据集，迁移学习可能并不训练新网络更快。\n\n迁移学习允许你：\n\
  * 将预训练网络学习到的特征迁移到新问题\n* 迁移学习比训练新网络更快\n* 缩短训练时间并缩小数据集\n* 在不需要学习如何创建整个网络的情况下进行深度学习\n\
  \n## 2.2 使用 ALEXNET 进行迁移学习\n\n### 2.2.1 预训练卷积神经网络\n\n使用迁移学习微调预训练网络通常比从头开始训练快得多也更容易。你可以将以前训练的网络用于以下目的：\n\
  \n| **目的** | **描述** |\n| --- | --- |\n| 分类 | 直接将预训练网络应用于分类问题。 |\n| 迁移学习 | 获取在大型数据集上训练的网络的层并在新数据集上进行微调\
  \ |\n| 特征提取 | 使用层激活作为特征，将预训练网络作为特征提取器。你可以使用这些激活作为特征来训练另一个分类器，例如支持向量机 (SVM)。 |\n\n\
  你可以下载并安装预训练网络来解决你的问题。使用 `alexnet` 等函数可以从 Add-On Explorer 获取下载预训练网络的链接。\n\n\n\n\n\
  \n`Transfer learning`（迁移学习）常用于深度学习应用。你可以取一个预训练网络并将其作为起点来学习新任务。与构建和训练新网络相比，使用迁移学习对网络进行微调（Fine-tuning）更快且更容易。你可以使用少量训练图像快速将迁移学习应用到新任务。迁移学习的优势在于预训练网络已经学习了丰富的特征集。这些特征可以应用于广泛的其他相似任务。例如，你可以取一个在数百万图像上训练的网络，并仅使用几百张图像对其进行新的物体分类进行重新训练。如果你有一个非常大的数据集，那么迁移学习可能不会更快。\n\
  \n`Feature extraction`（特征提取）是一种利用预训练网络能力的简单方法，无需投入时间和精力进行训练。特征提取可以使用深度学习最快的方法。你从预训练的网络中提取学习到的特征，并使用这些特征来训练分类器，例如使用\
  \ `fitcsvm`（统计与机器学习工具箱™）训练支持向量机。例如，如果 SVM 在你的训练集和验证集上的准确率达到 >90%，那么微调可能就不值得为了提高准确率而费力了。如果你在小数据集上进行微调，还会面临对训练数据过拟的风险。如果\
  \ SVM 无法为你的应用达到足够的准确率，那么微调就值得为了追求更高的准确率。\n\n## 2.2.2 Function alexnet\n\n### Syntax\n\
  ```matlab\nnet = alexnet\n```\n\n### Description\n`net = alexnet` 返回预训练的 AlexNet\
  \ 模型。该模型在 ImageNet 数据库的子集上训练，该数据库用于 ImageNet 大规模视觉识别挑战 (ILSVRC)。该模型在超过百万张图像上进行了训练，可以将图像分类为\
  \ 1000 类物体类别。例如：键盘、鼠标、铅笔和许多动物。结果，该模型已经为各种图像学习了丰富的特征表示。\n\n此函数需要 `Neural Network\
  \ Toolbox Model for AlexNet Network` 支持包。如果未安装此支持包，该函数将提供一个下载链接。\n\n### Examples\n\
  \n#### 下载 AlexNet 支持包\n下载并安装 `Neural Network Toolbox Model for AlexNet Network`\
  \ 支持包。\n\n在命令行中输入 `alexnet`。\n\n```matlab\nalexnet\n```\n\n如果未安装 `Neural Network\
  \ Toolbox Model for AlexNet Network` 支持包，该函数将提供一个指向“附加功能资源管理器”中所需支持包的链接。要安装该支持包，点击链接，然后点击\
  \ **Install**（安装）。在命令行中输入 `alexnet` 检查安装是否成功。\n\n```matlab\nalexnet\n\nans =\n\n\
  \  SeriesNetwork with properties:\n\n    Layers: [25×1 nnet.cnn.layer.Layer]\n```\n\
  \n如果已安装了所需的支持包，该函数将返回一个 `SeriesNetwork` 对象。\n\n#### 加载预训练的 AlexNet 卷积神经网络\n加载预训练的\
  \ AlexNet 卷积神经网络并检查层和类别。\n\n使用 `alexnet` 加载预训练的 AlexNet 网络。输出 `net` 是一个 `SeriesNetwork`\
  \ 对象。\n\n```matlab\nnet = alexnet\nnet = SeriesNetwork with properties:\n   Layers:\
  \ [25×1 nnet.cnn.layer.Layer]\n```\n\n使用 `Layers` 属性查看网络架构。该网络由 25 层组成。有 8 层具有可学习权重：5\
  \ 层卷积层和 3 层全连接层。\n\n```matlab\nnet.Layers\nans =\n  5x1 array with layers:\n  1\
  \  'data'      Input      27x27x3 images with 'center' normalization\n  2  'conv1'\
  \     Convolution      96 1x1x3 convolutions with stride [4] and padding [0]\n \
  \ 3  'relu1'     ReLU\n  4  'norm1'     Channel Normalization  channel normalization\
  \ with 5 channels\n  5  'pool1'     Max Pooling      3x3 max pooling with stride\
  \ [2] and padding [0]\n  6  'conv2'     Convolution      256 5x5x48 convolutions\
  \ with stride [1] and padding [2]\n  7  'relu2'     ReLU\n  8  'norm2'     Channel\
  \ Normalization  channel normalization with 5 channels\n  9  'pool2'     Max Pooling\
  \      3x3 max pooling with stride [2] and padding [0]\n  10  'conv3'     Convolution\
  \      384 3x3x256 convolutions with stride [1] and padding [1]\n  11  'relu3' \
  \    ReLU\n  12  'conv4'     Convolution      384 3x3x192 convolutions with stride\
  \ [1] and padding [1]\n  13  'relu4'     ReLU\n  14  'conv5'     Convolution   \
  \   256 3x3x192 convolutions with stride [1] and padding [1]\n  15  'relu5'    \
  \ ReLU\n  16  'pool5'     Max Pooling      3x3 max pooling with stride [2] and padding\
  \ [0]\n  17  'fc6'      Fully Connected      4096 connected layer\n  18  'relu6'\
  \     ReLU\n  19  'drop6'     Dropout      50% dropout\n  20  'fc7'      Fully Connected\
  \      4096 connected layer\n  21  'relu7'     ReLU\n  22  'drop7'     Dropout \
  \     50% dropout\n  23  'fc8'      Fully Connected      1000 connected layer\n\
  \  24  'prob'      Softmax\n```\n（注：此处代码块内容为函数输出，展示了 AlexNet 的结构）\n\n## 2.2.3 Classify\
  \ an Image Using AlexNet\n使用 AlexNet 读取、调整大小并分类图像。首先加载预训练的 AlexNet 模型。\n\n```matlab\n\
  net = alexnet\nI = imread('peppers.png');\nfigure\nimshow(I)\n```\n\n预训练模型要求图像大小与网络输入大小相同。使用第一层的\
  \ `InputSize` 属性确定网络输入大小。\n\n```matlab\nsz = net.Layers(1).InputSize\nsz =\n  227\
  \ 227 3\n```\n\n将图像裁剪为网络输入大小。或者可以使用 `imresize`（图像处理工具箱™）调整图像。\n\n```matlab\nI =\
  \ I(1:sz(1),1:sz(2),1:sz(3));\nfigure\nimshow(I)\n```\n\n使用 `classify` 分类图像。\n\n\
  ```matlab\nlabel = classify(net,I)\nlabel =\n  categorical\n    bell pepper\n```\n\
  \n同时显示图像和分类结果。\n\n```matlab\nfigure\nimshow(I)\ntitle(char(label))\n```\n## 2.2.4\
  \ Feature Extraction Using AlexNet\n从预训练的网络中提取学习到的特征，并使用这些特征来训练分类器。特征提取是利用预训练深度网络能力最简单、快速的方法。例如，你可以使用\
  \ `fitcecoc`（统计与机器学习工具箱™）在提取的特征上训练支持向量机（SVM）。\n\n加载预训练的 AlexNet 网络。\n\n```matlab\n\
  net = alexnet\n```\n\n加载示例图像。`merchImagesTrain` 和 `merchImagesTest` 是 `ImageDatastore`\
  \ 对象。\n\n```matlab\n[merchImagesTrain,merchImagesTest] = merchData;\n```\n\n样本数据中有\
  \ 60 张训练图像和 15 张测试图像。显示 20 张示例图像。\n\n```matlab\nfigure\nfor i = 1:20\n    subplot(4,5,i)\n\
  \    I = readimage(merchImagesTrain,i);\n    imshow(I)\n    drawnow\nend\n```\n\n\
  \n\n\n\n![Descripción: http://es.mathworks.com/help/examples/nnet/win64/FeatureExtractionUsingAlexNetExample\\\
  _01.png](img/00006.jpeg)\n\n如果训练图像的大小与图像输入层的大小不同，则你必须对图像数据进行缩放或裁剪。`merchImages`\
  \ 中的图像与 AlexNet 的输入大小相同，因此你不需要对新的图像数据进行缩放或裁剪。\n\n获取训练和测试图像的特征表示。\n\n对图像数据对最后一个全连接层（`'fc7'`）使用\
  \ `activations`。\n\n```matlab\nlayer = 'fc7';\ntrainingFeatures = activations(net,merchImagesTrain,layer);\n\
  testFeatures = activations(net,merchImagesTest,layer);\n```\n\n从训练数据和测试数据中提取类别标签。\n\
  \n```matlab\ntrainingLabels = merchImagesTrain.Labels;\ntestLabels = merchImagesTest.Labels;\n\
  ```\n\n使用 `fitcecoc`（Statistics and Machine Learning Toolbox）拟合多分类支持向量机（SVM）。\n\n\
  ```matlab\nclassifier = fitcecoc(trainingFeatures,trainingLabels);\n```\n\n使用 `predict`\
  \ 对测试图像进行分类。\n\n```matlab\npredictedLabels = predict(classifier,testFeatures);\n\
  ```\n\n显示四个带有预测标签的测试测试图像。\n\n```matlab\nidx = [1 4 7 10];\nfigure\nfor i = 1:numel(idx)\n\
  \    subplot(2,2,i)\n    I = readimage(merchImagesTest,idx(i));\n    label = predictedLabels(idx(i));\n\
  \    imshow(I)\n    title(char(label))\n    drawnow\nend\n```\n\n![Descripción:\
  \ http://es.mathworks.com/help/examples/nnet/win64/FeatureExtractionUsingAlexNetExample\\\
  _02.png](img/00007.jpeg)\n\n计算分类准确率。\n\n```matlab\naccuracy = sum(predictedLabels==testLabels)/numel(predictedLabels)\n\
  accuracy =\n    0.9333\n```\n\n此示例 SVM 具有较高的准确率。如果使用特征提取的准确率不够，请尝试迁移学习。\n\n## 2.2.5\
  \ 使用 AlexNet 进行迁移学习\n\n微调预训练的卷积神经网络，以学习新图像集合的特征。\n\n迁移学习常用于深度学习应用。你可以选取一个预训练的网络，并将其作为起点来学习新任务。与从头训练相比，使用迁移学习微调网络要快得多也简单得多。你可以使用较少的训练图像快速地将学习迁移到新任务中。\n\
  \n将示例图像加载为 `ImageDatastore` 对象。\n\n```matlab\n[merchImagesTrain,merchImagesTest]\
  \ = merchData;\n```\n\n在示例数据中，有 60 张训练图像和 15 张测试图像。显示 20 张示例图像。\n\n```matlab\nfigure\n\
  for i = 1:20\n    subplot(4,5,i)\n    I = readimage(merchImagesTrain,i);\n    imshow(I)\n\
  \    drawnow\nend\n```\n\n![Descripción: http://es.mathworks.com/help/examples/nnet/win64/TransferLearningUsingAlexNetExample\\\
  _01.png](img/00008.jpeg)\n\n加载一个预训练的 AlexNet 网络。\n\n```matlab\nnet = alexnet;\n\
  ```\n\n预训练网络 `net` 的最后三层配置为 1000 个类别。这三层必须针对新的分类问题进行微调。从预训练网络 `net` 中提取除最后三层以外的所有层。\n\
  \n```matlab\nlayersTransfer = net.Layers(1:end-3);\n```\n\n通过将最后三层替换为全连接层、softmax\
  \ 层和分类输出层，将层迁移到新任务中。根据新数据指定新全连接层的选项。将全连接层的大小设置为与新数据中的类别数相同。为了加快训练，还要增加全连接层中的 `'WeightLearnRateFactor'`\
  \ 和 `'BiasLearnRateFactor'` 的值。\n\n从训练数据中确定类别数量。\n\n```matlab\nnumClasses = numel(categories(merchImagesTrain.Labels))\n\
  numClasses =\n    5\n```\n\n通过将迁移的层与新层结合创建层数组。\n\n```matlab\nlayers = [...\n   \
  \ layersTransfer\n    fullyConnectedLayer(numClasses,'WeightLearnRateFactor',20,'BiasLearnRateFactor',20)\n\
  \    softmaxLayer\n    classificationLayer];\n```\n\n如果训练图像的大小与图像输入层的大小不同，则你必须对图像数据进行缩放或裁剪。`merchImages`\
  \ 中的图像与 AlexNet 的输入大小相同，因此你不需要对新的图像数据进行缩放或裁剪。\n\n创建训练选项。对于迁移学习，你希望保留预训练网络早期层的特征（迁移的层权重）。将\
  \ `'InitialLearnRate'` 设置为低值。这个较低的初始学习率会减慢迁移层的学习速度。在上一步中，你将全连接层的学习率因子设置得更高，以加快新最终层的学习速度。这种组合使得仅在新层上进行快速学习，同时保持其他层固定。在执行迁移学习时，不需要训练许多轮（epochs）。为了加快训练，你可以减小\
  \ `trainingOptions` 调用中 `'MaxEpochs'` 名称值对的值。为了减少内存占用，减小 `'MiniBatchSize'`。\n\n\
  ```matlab\noptions = trainingOptions('sgdm',\n    'MiniBatchSize',5,...\n    'MaxEpochs',10,...\n\
  \    'InitialLearnRate',0.0001);\n```\n\n使用 `trainNetwork` 对新层微调网络。\n\n```matlab\n\
  netTransfer = trainNetwork(merchImagesTrain,layers,options);\n```\n\n在 GPU 上训练。\n\
  初始化图像归一化。\n=========================================\n|     Epoch | Iteration |\
  \ Time Elapsed | Mini-batch | Mini-batch | Base Learning|\n|         |         \
  \  |             |            |            |             \n|         |         \
  \  | (seconds)   | Loss | Accuracy | Rate         |\n=========================================\n\
  |      1 | 1 | 0.55 | 2.4120 | 20.00% | 0.0001 |\n|      5 | 50 | 18.28 | 0.0002\
  \ | 100.00% | 0.0001 |\n|      9 | 100 | 34.82 |00.0000 | 000.00% | 0.001 |\n||100\
  \ 1200 41.33 | 0.0001 |  10.000% | 0.001 |\n=========================================\n\
  \n使用 `classify` 对测试图像进行分类。\n\n```matlab\npredictedLabels = classify(netTransfer,merchImagesTest);\n\
  ```\n\n显示四个带有预测标签的测试测试图像。\n\n```matlab\nidx = [1 4 7 10];\nfigure\nfor i = 1:numel(idx)\n\
  \    subplot(2,2,i)\n    I = readimage(merchImagesTest,idx(i));\n    label = predictedLabels(idx(i));\n\
  \    imshow(I)\n    title(char(label))\n    drawnow\nend\n```\n\n![Descripción:\
  \ http://es.mathworks.com/help/examples/nnet/win64/TransferLearningUsingAlexNetExample\\\
  _02.png](img/00009.jpeg)\n\n计算分类准确率。\n\n```matlab\ntestLabels = merchImagesTest.Labels;\n\
  accuracy = sum(predictedLabels==testLabels)/numel(predictedLabels)\naccuracy =\n\
  \    0.8667\n```\n\n此示例具有较高的准确率。如果使用迁移学习的准确率不够，请尝试特征提取。\n\n# 2.3 卷积神经网络的迁移学习与微调\n\
  \n本示例演示了如何通过微调现有的预训练卷积神经网络对新的图像数据进行分类。\n\n如果训练数据很少，构建和训练新网络既耗时又无效。相反，你可以微调现有的预训练网络来解决新问题。这种技术被称为迁移学习，通常会产生快速训练。通过提取预训练网络的层并重新训练末尾的层，你可以更快地完成训练。\n\
  \n神经网络工具箱提供了多个预训练网络，包括流行的 AlexNet。本示例使用简单的预训练网络向您介绍迁移学习。它取在字母图像上训练的卷积神经网络，并对其进行微调以分类数字。\n\
  \n## 2.3.1 加载预训练网络\n\n加载预训练网络。`LettersClassificationNet.mat` 包含预训练的网络 `net`，它是在大量\
  \ 28x28 灰度字母图像上训练的。该网络将图像分为三个字母类别：'A'`、`'B'` 和 `'C'`。\n\n\n\n\n\n```matlab\nload(fullfile(matlabroot,'examples','nnet','LettersClassificationNet.mat'))\n\
  ```\n\n查看 `net` 的 `Layers` 属性中包含的网络架构详情。\n\n```matlab\nnet.Layers\n```\n\nans =\
  \ \n\n  7x1 Layer array with layers:\n\n    1  'imageinput' Image Input 28x28x1\
  \ images with 'zerocenter' normalization\n    2  'conv' Convolution 20 5x5x1 convolutions\
  \ with stride [1 1] and padding [0 0]\n\n    3  'relu' ReLU\n\n    4  'maxpool'\
  \ Max Pooling 2x2 max pooling with stride [2 2] and padding [0 0]\n\n    5  'fc'\
  \ Fully Connected 3 fully connected layer\n\n    6  'softmax' Softmax softmax\n\n\
      7  'classoutput' Classification Output crossentropyex with 'A', 'B', and 1 other\
  \ classes\n\n该网络有七层。第 2–4 层检测特征。第 5–7 层将特征分类为字母类别。卷积层的 20 个输出（通道）对应于学习到的特征。你可以使用这些特征通过迁移学习预测数字数据的类别。\n\
  \n预训练网络 `net` 的最后三层是针对字母数据调整过的。通过替换预训练网络的最后三层，你可以微调网络以改为分类数字。\n\n## 2.3.2 加载训练数据\n\
  \n将数字样本数据加载为 `ImageDatastore` 对象。`imageDatastore` 函数根据文件夹名称自动对图像进行标记，并将数据存储为 `ImageDatastore`\
  \ 对象。`ImageDatastore` 对象允许你存储大型图像数据，包括无法放入内存的数据。该对象还允许你在训练期间高效地读取分批图像。\n\n```matlab\n\
  digitDatasetPath = fullfile(matlabroot,'toolbox','nnet','nndemos', ...\n    'nndatasets','DigitDataset');\n\
  \ndigitData = imageDatastore(digitDatasetPath, ...\n    'IncludeSubfolders',true,'LabelSource','foldernames');\n\
  ```\n\n该数据存储包含 10000 张 0–9 的数字合成图像。这些图像是通过对使用不同字体创建的数字图像应用随机变换生成的每个数字图像均为 28x28\
  \ 像素。\n\n将数据集分为训练集和测试集。划分数据，使得每个数据存储器都包含每个类别 50% 的图像。`splitEachLabel` 将 `digitData`\
  \ 中的图像文件分为两个新的数据存储器：`trainDigitData` 和 `testDigitData`。\n\n```matlab\n[trainDigitData,testDigitData]\
  \ = splitEachLabel(digitData,0.5,'randomize');\n```\n\n使用 `imshow` 显示 20 个样本训练数字。\n\
  \n```matlab\nnumImages = numel(trainDigitData.Files);\nidx = randperm(numImages,20);\n\
  for i = 1:20\n    subplot(4,5,i)\n    I = readimage(trainDigitData, idx(i));\n \
  \   imshow(I)\nend\n```\n\n![Descripción: http://es.mathworks.com/help/examples/nnet/win64/TransferLearningAndTuningOfNetworks_01.png](img/0010.jpeg)\n\
  \n## 2.3.3 目标网络层\n\n通过替换并微调这些层到数字数据，迁移学习到新任务。由于数字数据在内容上与字母数据相似，你可以使用迁移学习。预训练网络 `net`\
  \ 的最后三层是针对字母数据调整过的。从预训练网络中提取除最后三层的所有层。\n\n```matlab\nlayersTransfer = net.Layers(1:end-3);\n\
  ```\n\n数字数据集有 10 个类。为 10 个类添加一个新的全连接层、一个 softmax 层和一个分类输出层。为了加快新层上的学习速度，可以增加全连接层的权重学习和偏置学习率因子。如果你想保留预训练网络早期的特征（迁移的权重），并且训练图像的尺寸与输入层不同，则必须对图像数据进行尺寸调整或裁剪。在本示例中，训练图像与预训练网络的输入大小相同（28x28）。你不需要对图像数据进行尺寸调整或裁剪。对于迁移学习，将\
  \ `InitialLearnRate` 设置为低值。这个低学习率会减慢迁移层的学习速度。在上一步中，你将全连接层的学习因子设置得更高，以加快最后层的学习。这导致仅在新层上进行快速学习，同时保持其他层固定。在进行学习时，不需要训练许多轮次（epochs）。为了加速训练，减少调用\
  \ `trainingOptions` 时 `MaxEpochs` 参数的值。\n\n```matlab\nnumClasses = numel(categories(digitData.Labels))\n\
  layers = [layersTransfer; fullyConnectedLayer(numClasses,'WeightLearnFactor',20,'BiasLearnFactor',20;\
  \ softmaxLayer; classificationLayer];\noptionsTransfer = trainingOptions('sg','MaxEpochs',5,'InitialLearnRate',0.0001);\n\
  netTransfer = trainNetwork(digitData,layers,optionsTransfer);\n```\n\n在单 CPU 上训练。正在初始化图像归一化。\n\
  \n|=========================================================|\n| Epoch | Iteration\
  \ | Time Elapsed (seconds) | Mini-batch Loss | Mini-batch Accuracy | Base Rate |\n\
  |=========================================================|\n| 1 | 1 | 0.75 | 10.459\
  \ | 6.25% | 1.00e-04 |\n| 2 | 50 | 19.63 | 3.1897 | 70.31% | 1.00e-04 |\n| 3 | 100\
  \ | 38.44 | 1.1082 | 80.47% | 1.00e-04 |\n| 4 | 150 | 58.13 | 0.1465 | 95.31% |\
  \ 1.00e-04 |\n| 5 | 195 | 75.28 | 0.1504 | 96.88% | 1.00e-04 |\n|=========================================================|\n\
  \n计算分类准确率：测试数据中正确分类的实例比例。\n\n```matlab\nYPred = classify(netTransfer,testData);\n\
  YTest = testData.Labels;\naccuracy = sum(YPred==YTest)/numel(YTest)\n```\n\naccuracy\
  \ = 0.9288\n\n带有预测标签的样本测试图像。\n\n```matlab\nidx = 501:500:5000;\nfigure\nfor i =\
  \ 1:numel(idx)\n    subplot(3,3,i)\n    I = readimage(testData, idx(i));\n    label\
  \ = char(YTest(idx(i)));\n    imshow(I)\n    title(label)\nend\n```\n\n![Descripción:\
  \ http://es.mathworks.com/help/examples/nnet/win64/TransferLearningAndTuningOfNetworks_02.png](img/0011.jpeg)\n\
  \n\n\n\n\n1. `data` | 输入 | 带有 'zerocenter' 归一化的 227x227x3 图像\n2. `conv1` | 卷积 |\
  \ 96 个 11x11x3 卷积，步长为 `[4 4]`，填充为 `[0 0]`\n3. `relu1` | ReLU | ReLU\n4. `norm1`\
  \ | 跨通道归一化 | 每个元素 5 通道的跨通道归一化\n5. `pool1` | 最大池化 | 3x3 最大池化，步长为 `[2 2]`，填充为 `[0\
  \ 0]`\n6. `conv2` | 卷积 | 256 个 5x5x48 卷积，步长为 `[1 1]`，填充为 `[2 2]`\n7. `relu2` | ReLU\
  \ | ReLU\n8. `norm2` | 跨通道归一化 | 每个元素 5 个通道的跨通道归一化\n9. `pool2` | 最大池化 | 3x3 最大池化，步长为\
  \ `[2 2]`，填充为 `[0 0]`\n10. `conv3` | 卷积 | 384 个 3x3x256 卷积，步长为 `[1 1]`，填充为 `[1 1]`\n\
  11. `relu3` | ReLU | ReLU\n12. `conv4` | 卷积 | 384 个 3x3x192 卷积，步长为 `[1 1]`，填充为 `[1\
  \ 1]`\n13. `relu4` | ReLU | ReLU\n14. `conv5` | 卷积 | 256 个 3x3x192 卷积，步长为 `[1 1]`，填充为\
  \ `[1 1]`\n15. `relu5` | ReLU | ReLU\n16. `pool5` | 最大池化 | 3x3 最大池化，步长为 `[2 2]`，填充为\
  \ `[0 0]`\n17. `fc6` | 全连接 | 4096 全连接层\n18. `relu6` | ReLU | ReLU\n19. `drop6` |\
  \ Dropout | 50% 丢弃\n20. `fc7` | 全连接 | 4096 全连接层\n21. `relu7` | ReLU | ReLU\n22.\
  \ `drop7` | Dropout | 50% 丢弃\n23. `fc8` | 全连接 | 100 全连接层\n24. `prob` | Softmax |\
  \ softmax\n25. `output` | 分类 |  'tench'、'goldfish' 和其他 98 个类别的交叉熵\n\n然后，选择最后的全连接层。最后的全连接层是\
  \ 23。`layer = 23;` 你可以通过选择多个类来一次性生成多张图像。通过设置 `channels` 为这些类名称的索引来选择想要可视化的类。`channels\
  \ = [18 23 63 85 97];` 类名存储在输出层（最后一层）的 `ClassNames` 属性中。你可以通过选择 `net.Layers(end).ClassNames`\
  \ 数组中的项来查看所选类的名称。第 1 到 4 列 'hen'、'Yorkshire terrier'、'Shetland sheep'、'fountain'\
  \ 第 5 到 6 列 'curtain'、'geyser' 使用 `deepImage` 生成图像。该命令在可用时使用兼容的 GPU。否则它将使用 CPU。在\
  \ GPU 上训练需要计算能力为 3.0 或更高的支持 CUDA 的 NVIDIA GPU。`I = deepImage(net,channels);`\n\n\
