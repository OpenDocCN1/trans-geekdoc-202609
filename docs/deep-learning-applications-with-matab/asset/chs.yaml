  \ CPU 上运行 `predict`。\n\n显示测试数据中的前 10 图像并与 `predict` 的预测结果进行比较。\n\n```matlab\nTTest(1:10,:)\n\
  ans = \n     0\n     0\n     0\n     0\n     0\n     0\n     0\n     0\nYTestPred(1:10,:)\n\
  ans =\n  10×10 single matrix\n   Columns 1 through 7\n    1.0000  0.0000  0.0000\
