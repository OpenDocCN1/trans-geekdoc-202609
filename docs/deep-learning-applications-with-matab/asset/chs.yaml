  \ = 0.9273\n\n## 输入参数\n\n### `imds` — 带有分类问题标签的图像 `ImageDatastore` 对象\n图像，指定为带有\
  \ `categorical` 标签的 `ImageDatastore` 对象。你只能针对分类问题在 `ImageDatastore` 中存储数据。ImageDatastore`\
  \ 允许使用预取批量读取 JPG 或 PNG 图像文件。如果你使用自定义函数读取图像，则不会进行预取。有关此数据类型的更多信息，请参见 [ImageDatastore](http://es.mathworks.com/help/matlab/ref/imagedatastore-object.html)。\n\
  \n### `X` — 图像 4 维数值数组\n图像，指定为 4 维数值数组。前三个维度必须是高度、宽度和通道，最后一个维度必须用于索引单个图像。如果数组中存在\
  \ `NaNs`，它们将传播到训练过程中，但在大多数情况下，训练将收敛。数据类型：`single` | `double`\n\n### `Y` — 分类或回归问题的响应，分类响应的数组\
  \ | 数值矩阵 | 4 维数值数组\n分类或回归问题的响应，指定为以下内容之一：\n- 对于分类问题，`Y` 是一个包含图像标签的分类向量。\n- 对于回归问题，`Y`\
  \ 可以是一个 `n`-by-`r` 数值矩阵，其中 `n` 是观测数量，`r` 是响应数量。\n- 一个 `h`-by-`w`-by-`c`-by-`n` 数值数组，其中\
  \ `n` 是观测数量，`h`-by-`w`-by-`c` 是单个响应的大小。响应不能包含 `NaNs`。数据类型：`categorical` | `double`\n\
  \n### `tbl` — 输入数据表\n输入数据，指定为 table。`tbl` 必须在第一列中包含预测变量，可以是绝对图像路径或图像。响应的类型和位置取决于问题：\n\
  - 对于分类问题，响应必须是包含图像的分类变量。如果在调用 `trainNetwork` 时未指定响应变量名称，则响应必须在第二列。如果响应在 `tbl` 的不同列中，则你必须使用位置参数\
  \ `responseName` 来指定响应名称。\n- 对于回归问题，响应必须是第一列之后列中的数值值。响应可以作为标量存在于多个列中，也可以作为数值向量或包含数值\
  \ 3 维数组的单元数组存在于单列中。当你不指定响应变量名称时，`trainNetwork` 接受 `tbl` 的剩余列作为响应变量。你可以使用位置参数 `responseName`\
  \ 指定响应变量名称。响应不能包含 `NaNs`。如果预测数据中存在 `NaNs`，它们将传播到训练过程中，但在大多数情况下，训练将收敛。数据类型：table\
  \ table\n\n### `responseName` — 回归和分类问题的响应变量名称，字符向量\n回归和分类问题的响应变量名称，指定为字符向量，用于显示\
  \ `tbl` 中响应的名称](http://es.mathworks.com/help/nnet/ref/trainnetwork.html#arg_tbl)。数据类型：`char`\n\
  \n### `responseNames` — 回归问题的响应变量名称，单元格数组\n回归问题的响应变量名称，指定为单元格数组，显示 `tbl` 中响应的名称](http://es.mathworks.com/help/nnet/ref/trainnetwork.html#arg_tbl)。数据类型：`cell`\n\
  \n### `layers` — 网络层数组对象\n网络层数组，指定为[Layer](http://es.mathworks.com/help/nnet/ref/layer.html)\
  \ 对象。`layers` 可以是之前保存的网络层。例如，如果网络名称为 `net`，则输入 `net.Layers`。\n\n### `options` —\
  \ 训练选项 TrainingOptionsSGDM 对象\n训练选项，指定为[trainingoptions](http://es.mathworks.com/help/nnet/ref/trainingoptions.html)\
  \ 函数的 `TrainingOptionsSGDM` 对象。SGDM 代表随机梯度下降动量。\n\n## 输出参数\n\n### `trainedNet` —\
  \ 训练好的网络 SeriesNetwork 对象\n训练好的网络，返回为 `SeriesNetwork` 对象。\n\n### `traininfo` — 训练信息结构\n\
  训练信息，返回一个结构：\n- `TrainingLoss`: 每次迭代的损失函数值\n- `TrainingAccuracy`: 分类网络每次迭代的准确率\n\
  - `TrainingRMSE`: 回归网络每次迭代的均方根误差\n- `BaseLearnRate`: 每次迭代的学习率\n\n# 4.4 为分类模型标记图像\n\
  \n## 4.4.1 描述\n`ImageLabeler` 提供了一种标记图像的便捷方法。使用此应用，你可以：\n- 为多个类别的对象交互地指定感兴趣区域 (ROI)。\n\
  - 为训练或评估目标检测器导出 ROI。\n- 使用 `trainCascadeObjectDetector` 函数训练目标检测器。\n\n## 4.4.2 打开标记标记\n\
  - MATLAB 工具栏：打开 **Apps** 选项卡，在 **Image Processing and Computer Vision** 下，点击应用图标。\n\
  - MATLAB 命令行：输入 `imageLabeler`\n\n## 4.4.3 应用控件\n你可以在 **Data Browser** 中添加无限数量的图像。你可以选择、删除和创建\
  \ ROI，并保存会话。完成后，可以将 ROI 信息导出到 XML 文件。\n\n![Descripción: http://es.mathworks.com/help/vision/ug/trainingimagabeler_addimages.png](img/00038.gif)\
  \ 添加图像**\n\n使用 **Add Images** 图标选择并将图像添加到 **Data Browser** 中。你可以在编辑期间随时添加更多图像。源图像保留在最初所在的文件夹中。应用程序不会创建原始图像的副本或移动它们。如果你在\
  \ **Data Browser** 中旋转图像，应用程序将使用修改后的方向覆盖原始位置的图像。\n\n\n\n\n该应用程序提供了会话期间加载的图像缩略图列表。在每个缩略图旁边，你可以看到文件名以及在该图像中创建的\
  \ ROI（感兴趣区域）数量。\n\n![描述: http://es.mathworks.com/help/vision/ug/trainingimagabeler\\\
  _filenamesandrois.png](img/00039.gif)\n\n![描述: http://es.mathworks.com/help/vision/ug/trainingimagelabeler\\\
  _roi.png](img/00040.gif)感兴趣区域\n\n加载图像后，你可以勾勒 ROI。你可以在图像之间切换并继续创建 ROI。该应用程序允许你为多个对象类别创建\
  \ ROI 标签。每个 ROI 标签都有一个名称和一种颜色。先创建标签，然后在图像中绘制 ROI。\n\n### 创建标签\n\n1. 为每个对象类别点击 `Add\
  \ ROI` 标签 ![描述: http://es.mathworks.com/help/vision/ug/trainingimagelabeler\\_addroilabel.png](img/00041.gif)。\n\
  2. 为每个 ROI 标签命名并选择其颜色。\n3. 从你创建的 `ROI labels` 列表中选择类别。\n4. 通过将光标拖到图像中的对象上来绘制 ROI。\n\
  \n* 要修改 ROI 的大小，请点击角或侧边的握柄。在更改大小时要保持 ROI 的宽高比，请按住 `Shift`。\n* 要复制和粘贴 ROI，请点击其边界内部以选择它。你可以选择一个或多个\
  \ ROI 进行移动或复制粘贴。\n* 要删除 ROI，请点击其右上角的红色 `x`。\n* 如果感兴趣的对象填充了整个图像，右键点击图像并从菜单中选择 `Add\
  \ full image ROI`。\n\n要显示或隐藏当前显示图像中的标签名称，请选择 `Show ROI Labels`。\n\n![描述: http://es.mathworks.com/help/vision/ug/trainingimagelabeler\\\
  _roistopsign.png](img/00042.gif)\n\n你还可以使用以下快捷键：\n\n* `Ctrl+C` 复制\n* `Ctrl+V` 粘贴\n\
  * `Ctrl+X` 剪切\n\n![描述: http://es.mathworks.com/help/vision/ug/trainingimagelabeler\\\
  _removeratesort.png](img/00043.gif)删除、旋转和排序图像\n\n你可以删除、旋转或排序图像。右键点击任何图像可访问这些选项。要选择多个图像，按\
  \ `Ctrl+click`。要选择连续图像，按 `Shift+click`。要按 ROI 数量对图像进行排序（从每个图像中 ROI 最少的开始），右键点击任何图像并选择\
  \ `Sort by number of ROIs`。\n\n![描述: http://es.mathworks.com/help/vision/ug/trainingimagelabeler\\\
  _newsession.png](img/00044.gif)新会话\n\n当启动新会话时，可以在清除之前保存当前会话。\n\n![描述: http://es.mathworks.com/help/vision/ug/trainingimagelabeler\\\
  _opensession.png](img/00045.gif)打开会话\n\n你可以打开新会话来替换或添加当前会话。应用程序加载选定的 MAT 文件。要替换当前会话，从\
  \ `Open Session`选项中选择 `Open an existing session`。要合并多个会话，选择 `Add session to the\
  \ current session`。\n\n![描述: http://es.mathworks.com/help/vision/ug/trainingimagelabeler\\\
  _savesession.png](img/00046.gif)保存会话\n\n你可以将会话命名并保存为 .MAT 文件。默认名称为 `LabelingSession`。保存的会话文件包含以你保存的状态重新加载会话所需的所有信息。它包含原始图像的路径、每个图像的\
  \ ROI 框坐标、文件名以及记录文件状态的逻辑信息。\n\n![描述描述: http://es.mathworks.com/help/vision/ug/trainingimagelabeler\\\
  _export.png](img/00047.gif)导出 ROI\n\n当你点击 `Export ROIs` 时，应用程序会将 ROI 信息导出到 MATLAB\
  \ 工作区，导出作为一个 `M` 行 `N` 列的表格，其中包含图像文件名和 ROI。图像文件名存储在表格的第一列。后续列包含每个类别的 ROI。\n\n![描述:\
  \ http://es.mathworks.com/help/vision/ug/trainingimagelabeler\\_exported.png](img/00048.gif)\n\
  \n如果你只有一个 ROI 标签，应用程序将为你提供额外的选项将 ROI 导出为 `struct` 数组。该结构包含两个字段。一个字段存储图像文件位置，另一个字段存储每个图像对应的\
  \ ROI 信息。\n\n![描述: http://es.mathworks.com/help/vision/ug/trainingimagelabeler\\\
  _importrois.png](img/00049.gif)导入 ROI\n\n你可以导入使用其他方法创建的 ROI。ROI 必须存储在与导出的 ROI 相同的表格中。该表格可以是\
  \ MATLAB 工作区中的变量，也可以保存为 MAT 文件。\n\n\n\n卷积神经网络（CNNs，或 ConvNets）是深度学习的本质工具，对于图像分类、目标检测和识别任务特别有用。CNN\
  \ 实现为一系列相互连接的层。这些层由重复的卷积层、ReLU（修正后的线性单元）层和池化层组成。卷积层将其输入与一组过滤器进行卷积运算。这些过滤器是在网络训练过程中自动学习的。ReLU\
  \ 层为网络引入了非线性，使网络能够近似图像像素与图像语义内容之间的非线性映射。池化层对输入进行下采样，有助于整合局部图像特征。\n\n| **注意：** 卷积神经网络需要\
  \ Neural Network Toolbox™。在计算能力为 3.0 或更高的 CUDA^®-能力 GPU 上支持训练和预测。建议使用 GPU，这需要 Parallel\
  \ Computing Toolbox™。 |\n| --- |\n\n你可以构建 CNN 架构、训练网络，并使用训练好的网络预测类别标签或检测目标。你还可以从预训练的网络中提取特征，并使用这些特征训练分类器。此外，你还可以进行迁移学习，即在新数据上重新训练\
  \ CNN。\n\n![](http://www.mathworks.com/help/vision/examples/image-category-classification-using-deep-learning.html)\n\
  \n## 5.1.2 深度学习与卷积神经网络\n\n深度学习通过构建和训练卷积神经网络（CNNs, ConvNets）用于分类和回归，并通过自编码器神经网络用于学习特征。\n\
  \n深度学习利用神经网络直接从数据中学习有用的特征表示。如果你有标记数据，可以使用卷积神经网络（CNNs, ConvNets）进行监督学习以实现分类、回归，并使用预训练网络进行迁移学习。如果你有无标记数据，可以使用自编码器神经网络进行无监督学习以进行特征提取。\n\
  \n卷积神经网络（ConvNets）是深度学习广泛使用的工具。它们特别适用于图像作为输入，尽管也用于文本、信号和其他连续响应等应用。它们与其他类型的神经网络有几点不同：\n\
  \n卷积神经网络的灵感来自视觉皮层的生物结构，其中包含简单和复杂细胞 [1](http://www.mathworks.com/help/nnet/ug/introduction-to-convolutional-neural-networks.html#bvnobzh)。发现这些细胞根据视觉区域的子区域激活。这些子区域被称为感受野。受这项研究结果的启发，卷积层中的神经元连接到该层之前的子区域，而不是像其他类型的神经网络那样是全连接。神经元对图像中这些子区域之外的区域没有响应。\n\
  \n这些子区域可能会重叠，因此 ConvNet 的神经元产生空间相关的结果，而在其他类型的神经网络中，神经元不共享任何连接并产生独立的结果。\n\n此外，在具有全连接神经元的神经网络中，参数（权重）的数量会随着输入尺寸的增加而迅速增加。卷积神经网络通过减少连接数量、共享权重和下采样来减少参数数量。\n\
  \n一个 ConvNet 由多个层组成，例如卷积层、最大池化层或平均池化层以及全连接层。\n\n一个 ConvNet 由多个层组成，例如卷积层、最大池化层或平均池化层以及全连接层。卷积层中的神经元连接到该层之前的子区域，而不是像其他类型的神经网络那样是全连接。神经元对图像中这些子区域之外的区域没有响应。\n\
  \n这些子区域可能会重叠，因此 ConvNet 的神经元产生空间相关的结果，而在其他类型的神经网络中，神经元不共享任何连接并产生独立的结果。\n\n此外，在具有全连接神经元的神经网络中，参数（权重）的数量会随着输入尺寸的增加而迅速增加。卷积神经网络通过减少连接数量、共享权重和下采样来减少参数数量。\n\
  \n（注：原文后续存在大量重复段落，此处已根据“不要重复输出原文”原则进行去重）\n\n```matlab\nlayers = [\nimageInputLayer([28\
  \ 28 1])\nconvolution2dLayer(5,20)\nreluLayer\nmaxPooling2dLayer(2,'Stride',2)\n\
  fullyConnectedLayer(10)\nsoftmaxLayer\nclassificationLayer];\n```\n\n在定义网络层之后，必须使用\
  \ `trainingOptions` 函数指定训练选项。例如：\n\n```matlab\noptions = trainingOptions('sgdm');\n\
  ```\n\n然后，你可以使用 `trainNetwork` 函数用训练数据训练网络。数据、层和训练选项成为输入。例如：\n\n```matlab\nconvnet\
  \ = trainNetwork(data,layers,options);\n```\n\n## 5.2 创建新网络\n\n### 5.2.1 指定卷积网络的层\n\
  \n创建和训练新卷积神经网络（ConvNet）的第一步是定义网络层。本主题将解释 ConvNet 层的细节以及它们出现的顺序。\n\n## 5.2.2 图像输入层\n\
  \n\n\n输入层（input layer）定义了卷积神经网络输入图像的大小，并包含图像的原始像素值。你可以使用 `imageInputLayer` 函数添加输入层。在\
  \ `inputSize` 参数中指定你的图像大小。图像的大小对应于图像的高度、宽度和颜色通道数。例如，对于灰度图像，通道数为 1，而对于彩色图像则为 3。\n\
  \n在此层中，你还可以指定网络执行数据增强，例如对数据进行随机翻转或裁剪，或者通过从训练集的像素值中减去图像均值来执行数据变换。增强和归一化变换目的是减少过拟合，过拟合在较大的网络中可能会发生。\n\
  \n## 5.2.3 卷积层\n\n**过滤器和步长：** 卷积层由连接到输入图像子区域或前一层层输出的神经元组成。卷积层在扫描图像时学习由这些区域局部化的特征。你可以在调用\
  \ `convolution2dLayer` 函数时使用输入参数 `filterSize` 来指定这些区域的大小。\n\n对于每个区域，`trainNetwork`\
  \ 函数计算权重与输入之间的点积，然后加上一个偏置项。应用到图像某个区域的一组权重称为 `filter`（过滤器）。过滤器沿输入图像的垂直和水平方向移动，对每个区域重复相同的计算，即对输入进行卷积。它移动的步长大小称为\
  \ `stride`（步长）。你可以通过 `Stride` 名称-值对参数来指定此步长。神经元连接的这些局部区域可能会根据 `filterSize` 和 `'Stride'`\
  \ 产生重叠。\n\n一个过滤器使用的权重数量为 `h*w*c`，其中 `h` 是过滤器的高度，`w` 是过滤器大小的宽度，`c` 是输入中的通道数（例如，如果输入是彩色图像，则颜色通道数为\
  \ 3）。过滤器的数量决定了卷积层输出的通道数。在调用 `convolution2dLayer` 时，使用 `numFilters` 参数指定过滤器的数量。\n\
  \n**特征图：** 当过滤器沿输入移动时，它使用相同的同一组权重和偏置进行卷积，从而形成一个 `feature map`（特征图）。因此，卷积层拥有的特征图数量等于过滤器的数量（通道数）。每个特征图都有一组不同的权重和一个偏置。因此，卷积层中的参数总数为\
  \ `((h*w*c + 1)*Number of Filters)`，其中 1 代表偏置。\n\n**零填充（Zero Padding）：** 你还可以使用\
  \ `'Padding'` 名称-值对参数在垂直和水平方向上对输入图像边界应用零填充。填充基本上是在输入图像的边界添加零行或零列。它可以帮助控制所添加填充层的输出大小。\n\
  \n**输出大小：** 卷积层的输出高度和宽度为 `(Input Size – Filter Size + 2*Padding)/Stride + 1`。该值必须是整数，以便完全覆盖整幅图像。如果这些参数的组合未能导致图像完全覆盖，软件默认将忽略卷积过程中图像右侧和底部的剩余部分。\n\
  \n**神经元数量：** 输出高度和宽度的乘积给出特征图中的神经元总数，称为 `Map Size`。那么，卷积层中的神经元总数（输出大小）为 `Map Size*Number\
  \ of Filters`。\n\n例如，假设输入图像是一张 28x28x3 的彩色图像。对于一个具有 16 个过滤器且过滤器大小为 8x8 的卷积层，每个过滤器的权重数量为\
  \ `8*8*3 = 192`，该层的参数总数为 `(192+1) * 16 = 3088`。假设每个方向的步长为 4 且没有零填充，则每个特征图的神经元总数为\
  \ 6x6 (`(28 – 8+0)/4 + 1 = 6`)。那么，该层的神经元总数为 `6*6*16 = 256`。\n\n**学习参数：** 你还可以在定义卷积层时，使用相关的名称-值对参数调整该层的学习率和正则化参数。如果你选择不调整它们，`trainNetwork`\
  \ 将使用 `trainingOptions` 函数定义的全局训练参数。\n\n卷积神经网络可以由一个或多个卷积层组成。卷积层的数量取决于数据的量和复杂性。\n\
  \n卷积层神经元的结果通常通过某种形式的非线性变换。Neural Network Toolbox™ 使用线性流单元（ReLU）函数为此目的。每个卷积层后面都可以跟一个\
  \ ReLU 层或池化层。\n\n## 5.2.4 ReLU 层\n\n卷积层后面通常跟着一个非线性激活函数。在 MATLAB 中，这是一个线性流单元（ReLU）函数，由\
  \ ReLU 层指定。你可以使用 `reluLayer` 函数指定 ReLU 层。它对每个元素执行阈值操作，其中任何小于零的输入值都被设置为零。ReLU 层不改变输入的大小。\n\
  \n## 5.2.5 跨通道归一化（局部响应归一化）层\n\n该层执行通道级的局部响应归一化。它通常位于 ReLU 激活层之后。你可以使用 `crossChannelNormalizationLayer`\
  \ 指定此层。该层将每个元素替换为使用特定数量相邻通道（归一化窗口内的元素）得到的归一化值。\n\n你必须在调用 `crossChannelNormalizationLayer`\
  \ 时使用 `windowChannelSize` 参数指定归一化窗口的大小。你还可以使用 `Alpha`、`Beta` 和 `K` 名称-值对参数指定超参数。\n\
  \n注意，之前的公式与之前呈现的有不同。你可以将 `alpha` 值乘以 `windowChannelSize` 来获得等效公式。\n\n## 5.2.6 最大池化和平均池化层\n\
  \n最大池化层和平均池化层在卷积层之后用于下采样，从而减少到后续层（通常是全连接层）的连接数量。它们本身不执行任何学习，但减少了后续层中需要学习的参数数量。它们也有助于减少过拟合。你可以使用\
  \ `maxPooling2dLayer` 和 `averagePooling2dLayer` 指定这些层。\n\n最大池化层返回输入矩形区域的最大值。矩形区域的大小由传递\
  \ `maxPoolingLayer` 的 `poolSize` 。例如，如果 `poolSize` 为 `[2,3]`，软件返回高度为 2 宽度为 3 的区域的最大值。\n\
  \n同样，平均池化层输出其输入矩形区域的平均值。矩形区域的大小由调用 `averagePoolingLayer` 的 `poolSize` 指定。例如，如果 `poolSize`\
  \ 为 `[2,3]`，软件返回高度为 2 宽度为 3 的区域的平均值。`maxPoolingLayer` 和 `averagepoolingLayer` 函数按照你在调用任一函数时使用\
  \ `Stride` 参数指定的步长水平和垂直扫描输入。如果 `poolSize` 小于或等于 `Stride`，则池化区域不重叠。\n\n\n\n\n对于非重叠区域（`poolSize`\
  \ 和 `Stride` 相等），如果池化层的输入为 `n`-by-`n`，且池化区域的大小为 `h`-by-`h`，则池化层将通过 `h` 对区域进行下采样\
  \ [6](http://www.mathworks.com/help/nnet/ug/layers-of-a-convolutional-neural-network.html#bu741xw)。也就是说，卷积层单通道的最大池化或平均池化层的输出尺寸为\
  \ `n/h`-by-`n/h`。对于重叠区域，池化层的输出为 (`Input Size` – `Pool Size` + 2**`Padding`)``Stride`\
  \ + 1。\n\n## 5.2.7 Dropout 层（随机丢弃层）\n\nDropout 层以给定的概率随机将层的输入元素设置为零。你可以使用 `[dropoutLayer](http://www.mathworks.com/help/nnet/ref/dropout.html)`\
  \ 函数来指定 Dropout 层。\n\n尽管 Dropout 层的输出等于其输入，但此操作对应于从网络中临时丢弃随机选择的单元及其所有的连接。因此，对于每个新输入，`trainNetwork`\
  \ 会随机选择一组神经元子集，形成不同的架构。这些架构使用公共权重，但由于学习不依赖于特定的神经元和连接，Dropout 层可能会防止过拟合 [7](http://www.mathworks.com/help/nnet/ug/layers-a-convolutional-neural-network.html#bvk862),\
  \ [2](http://www.mathworks.com/help/nnet/ug/layers-a-convolutional-neural-network.html#bvnoj7-1)。类似于最大池化或平均池化层，该层内不进行学习。\n\
  \n## 5.2.8 全连接层（Fully Connected Layer）\n\n卷积层（以及下采样层）之后是一个或多个全连接层。你可以使用 `[fullyConnectedLayer](http://www.mathworks.com/help/nnet/ref/fullyconnectedlayer.html)`\
  \ 函数来指定全连接层。\n\n顾如其名，全连接层中的所有神经元都连接到前一层的神经元。该层结合了之前层跨越图像学习的所有特征（局部信息），以识别更大的模式。对于分类问题，最后一个全连接层将它们结合以对图像进行分类。这就是为什么最后一个全连接层中的\
  \ `OutputSize` 参数等于目标数据中的类别数量。对于回归问题，输出尺寸必须等于响应变量的数量。\n\n你还可以在定义全连接层时，使用相关的名称-值对参数来调整该层的学习率和正则化参数。如果你选择不调整它们，`trainNetwork`\
  \ 将使用由 `trainingOptions` 定义的全局训练参数。\n\n## 5.2.9 Softmax 层和分类层\n\n对于分类问题，最后一个全连接层之后必须紧跟一个\
  \ softmax 层，然后是一个分类层。你可以分别使用 `[softmaxLayer](http://www.mathworks.com/help/nnet/ref/softmaxlayer.html)`\
  \ 和 `[classificationLayer](http://www.mathworks.com/help/nnet/ref/classificationlayer.html)`\
  \ 函数来指定这些层。\n\nSoftmax 函数也称为 `归一化指数`（normalized exponential），可以被认为是逻辑 sigmoid 函数的多分类推广。\n\
  \n分类输出层必须跟在 softmax 层之后。在分类输出层中，`trainNetwork` 获取 softmax 函数的值，并使用交叉熵函数结合 1-of-`k`\
  \ 编码方案将每个输入分配给 `k` 个互斥类别之一。\n\n## 5.2.10 回归层（Regression Layer）\n\n你也可以将卷积神经网络用于回归问题，其中目标（输出）变量是连续的。在这种情况下，回归输出层必须跟在最后一个全连接层之后。你可以使用\
  \ `[regressionLayer](http://www.mathworks.com/help/nnet/ref/regressionlayer.html)`\
  \ 函数指定回归层。回归层的默认激活函数是均方误差\n\n## 5.2.11 设置参数并训练卷积神经网络\n\n在定义网络层之后，下一步是为网络设置训练选项。你可以使用\
  \ `trainingOptions` 函数来设置全局训练参数。`trainNetwork` 然后使用这些选项来执行训练。`trainingOptions` 将这些选项保存为\
  \ `TrainingOptionsSGDM` 对象的实例，你必须将其作为输入参数传递给 `trainNetwork`。例如：\n\n```matlab\nopts\
  \ = trainingOptions('sgdm');\nconvnet = trainNetwork(data,layers,opt);\n```\n\n\
  层 `convolution2dLayer` 和 `fullyConnectedLayer` 也有一些选项可以调整这些层的学习参数。详见下文。\n\n## 5.2.12\
  \ 使用 trainingOptions 设置训练参数\n\n### 指定求解器和最大迭代轮数（Epochs）\n\n`trainNetwork` 使用`动量随机梯度下降`（SGDM）作为优化算法。在调用\
  \ `trainingOptions` 时，必须将 `'sgdm'` 指定为 `SolverName`。SGDM 通过沿损失函数的负梯度方向迈出微小步长来更新权重和偏置（参数），从而使损失最小化。它每次使用数据的子集来更新参数。这个子集被称为\
  \ `mini-batch`（小批量）。你可以使用 `trainingOptions` 中的 `'MiniBatchSize'` 名称-值对参数来指定该子集的大小。\n\
  \n使用 mini-batch 对梯度的每次评估称为一次 `iteration`（迭代）。对整个数据集的完整遍历称为一个 `epoch`（轮次）。训练的最大迭代轮数也是你可以指定的参数。在调用\
  \ `trainingOptions` 时使用 `'MaxEpochs'` 名称-值对参数。默认值为 30，但对于小型网络，你可能会选择较少的轮数。\n\n动量参数是防止梯度下降算法沿最陡下降路径上产生震荡的方法。作为经验法则，该参数的默认值为\
  \ 0.9。然而，你可以使用 `'Momentum'` 参数更改此值。\n\n### 指定并修改学习率\n\n你可以使用 `trainingOptions` 中的\
  \ `'InitialLearnRate'` 名称-值对参数指定全局学习率。默认值为 0.01，但如果你正在进行迁移学习，可能希望选择更小的值。默认情况下，`trainNetwork`\
  \ 在整个训练过程中使用此值，除非你选择每隔几轮更改一次。与其在整个训练中使用固定学习率，不如在训练开始时选择较大的学习率，并随着训练的进行逐渐减小，这有助于缩短训练时间。\n\
  \n如果你想逐渐减少学习率，请使用 `'LearnRateSchedule','piecewise'` 名称-值对参数。一旦选择此选项，`trainNetwork`\
  \ 默认每 10 轮将初始学习率乘以 0.1。然而，你也可以选择使用 `'LearnRateDropFactor'` 和 `'LearnRateDropPeriod'`\
  \ 名称-值对参数分别指定缩小初始学习率的因子和轮数。\n\n### 选择硬件资源\n\n如果有可用 GPU，`trainNetwork` 默认使用 GPU 进行训练。如果没有可用\
  \ GPU，则使用 CPU。或者，你可以使用 `'ExecutionEnvironment'` 名称-值对参数指定你想要的执行环境。你可以选择使用单 CPU ('cpu')、多\
  \ CPU 核心 ('parallel')、单 GPU ('gpu') 或多 GPU ('multiple-gpu')。除了 'cpu' 之外的所有选项都需要\
  \ Parallel Computing Toolbox™。在 GPU 上训练需要计算能力为 3.0 或更高的 CUDA 启用 GPU。\n\n\n\n\n\n\
  # 保存检查点网络并恢复训练\n\nNeural Network Toolbox™ 允许你在训练过程中的每个 epoch 之后定期将网络保存为 `.mat` 文件。当你有一个大型网络或大型数据集且训练时间较长时，这尤为重要。如果训练由于某些原因被中断，你可以从上次保存的检查点网络恢复训练。如果你想让\
  \ `trainNetwork` 保存检查点网络，必须在调用 `trainingOptions` 时使用 `CheckpointPath` 名称-值对参数指定路径名称。如果你指定的路径错误，`trainingOptions`\
  \ 将返回错误。\n\n`trainNetwork` 会自动为这些检查点网络文件分配唯一名称。例如，`convnet_checkpoint__351__2016_11_09__12_04_23.mat`，其中\
  \ `351` 是迭代次数，`2016_11_09` 是日期，`12_04_23` 是 `trainNetwork` 保存网络的时间。你可以通过双击这些文件或在命令行中输入命令来加载其中任何一个，例如：\n\
  \n```bash\nload convnet_checkpoint__351__2016_11_09__12_04_23.mat\n```\n\n然后你可以在调用\
  \ `trainNetwork` 时使用该网络的层来恢复训练，例如：\n\n```bash\ntrainNetwork(Xtrain,Ytrain,net.Layers,options)\n\
  ```\n\n你必须手动指定训练选项和输入数据，因为检查点网络不包含这些信息。有关可选名称-值参数的完整列表，请参阅 [trainingOptions](http://www.mathworks.com/help/nnet/ref/trainingoptions.html)\
  \ 函数参考页面。\n\n## 5.2.13 在卷积层和全连接层中设置参数\n\n你可以选择在特定的卷积和/或全连接层中设置与 `trainingOptions`\
  \ 指定的全局值不同的学习参数。你可以在调用 `convolution2dLayer` 或 `fullyConnectedLayer` 函数时指定 `BiasLearnRateFactor`\
  \ 或 `WeightLearnRateFactor` 名称-值对来调整偏置和权重的学习率。`trainNetwork` 函数会将你将在 `trainingOptions`\
  \ 函数中指定的学习率与这些因子相乘。同样，你还可以使用 `BiasL2Regularizer` 和 `WeightL2Regularizer` 名称-值对参数指定这些层中权重和偏置的\
  \ L[2] 正则化参数。`trainNetwork` 函数会将你将在 `trainingOptions` 函数中指定的 L[2] 正则化值与这些因子相乘。\n\
  \n## 5.2.14 在卷积层和全连接层中初始化权重\n\n卷积层和全连接层的初始权重默认遵循均值为 0、标准差为 0.01 的高斯分布。初始偏置默认值为 0。在指定这些层后，你可以手动更改权重和偏置的初始化。\n\
  \n## 5.2.15 训练网络\n\n在指定 ConvNet 的层和训练参数后，你可以使用训练数据来训练网络。数据、层和训练选项都是 `trainNetwork`\
  \ 函数的位置输入参数。例如：\n\n```matlab\nlayers = [imageInputLayer([28 28 1])\n           \
  \ convolution2dLayer(5,20)\n            reluLayer()\n            maxPooling2dLayer(2,'Stride',2)\n\
  \            fullyConnectedLayer(10)\n            softmaxLayer()\n            classificationLayer()];\n\
  \noptions = trainingOptions('sgdm');\n\nconvnet = trainNetwork(data,layers,options);\n\
  ```\n\n训练数据可以是矩阵、表或数据存储格式。如需更多信息，请参阅 [trainNetwork](http://www.mathworks.com/help/nnet/ref/trainnetwork.html)\
  \ 函数参考页面。\n\n# 5.3 从检查点网络恢复训练\n\n此示例演示了如何在训练卷积神经网络时保存检查点网络，并从之前保存的网络恢复训练。\n\n##\
  \ 5.3.1 加载示例数据\n\n将示例数据加载为 4D 数组。\n\n```matlab\n[XTrain,TTrain] = digitTrain4DArrayData;\n\
  ```\n\n显示 `XTrain` 的大小。\n\n```matlab\nsize(XTrain)\nans =\n             28     \
  \      28             1        5000\n```\n\n`digitTrain4DArrayData` 将数字训练集加载为 4D\
  \ 数组数据。`XTrain` 是一个 28x28x1x5000 的数组，其中 28 是图像的高度，28 是宽度。1 是通道数，5000 是手写数字图像的数量。`TTrain`\
  \ 是包含每个观测值标签的分类向量。\n\n显示 `XTrain` 中的部分图像。\n\n```matlab\nfigure;\nperm = randperm(5000,20);\n\
  for i = 1:20\n  subplot(4,5,i);\n  imshow(XTrain(:,:,:,perm(i)));\nend\n```\n\n\
  ![Descripción: http://www.mathworks.com/help/examples/nnet/win64/ResumeTrainingConvNetFromACheckpointNetworkExample_01.png](img/00052.jpeg)\n\
  \n## 5.3.2 定义网络层\n\n定义卷积神经网络的层。\n\n```matlab\nlayers = [imageInputLayer([28 28 1])\n\
  \            convolution2dLayer(5,20)\n            reluLayer()\n            maxPooling2dLayer(2,'Stride',2)\n\
  \            fullyConnectedLayer(10)\n            softmaxLayer()\n            classificationLayer()];\n\
  \n## 5.3.3 指定训练选项\n\n使用随机梯度下降动量设置训练选项，并指定 Checkpoint Path 以保存网络。\n\n```matlab\n\
  options = trainingOptions('sgdm','CheckpointPath','C:\\Temp');\n```\n\n## 5.3.4\
