  \ R2016b 中重新保存它。这会将可学习参数保存为 MATLAB 数组。你可以在运行网络时将执行环境更改为 CPU。\n\n## 9.3.2 带动量的随机梯度下降的训练选项。`TrainingOptionsSGDM`\n\
  \n### 描述\n该类包含动量随机梯度下降的训练选项，例如学习率信息、L2 正则化因子和小批量（mini-batch）大小。\n\n### 构造\n`options\
  \ = trainingOptions([solverName](http://www.mathworks.com/help/nnet/ref/trainingoptionssgdm-class.html#inputarg_solverName))`\
  \ 返回由 `solverName` 指定的求解器的训练选项。\n\n`options = trainingOptions([solverName](http://www.mathworks.com/help/nnet/ref/trainingoptionssgdm-class.html#inputarg_solverName),Name,Value)`\
  \ 返回一组训练选项，并由一个或多个 `Name,Value` 对参数指定额外的选项。\n\n### 输入参数\n- `solverName` — 用于训练网络的求解器（默认值）\
  \ | `'sgdm'`\n\n### 属性\n- `Momentum` — 上一个梯度步的贡献， 0 到 1 之间的标量值\n- `InitialLearnRate`\
  \ — 初始学习率，标量值\n- `LearnRateScheduleSettings` — 学习率调度设置，由用户结构指定\n- `L2Regularization`\
  \ — L2 正则化因子，标量值\n- `MaxEpochs` — 最大迭代轮数（epochs），整数值\n- `MiniBatchSize` — 小批量大小，整数值\n\
  - `Verbose` — 显示训练进度信息的指示器 1（默认值） | 0\n\n### 拷贝语义\n值（Value）。要了解值类如何影响拷贝操作，请参阅之前的类文档。\n\
  \n### 示例。指定训练选项\n创建一组用于带动量随机梯度下降训练的选项。学习率每隔 5 个 epoch 减少 0.2 倍。训练将持续 20 个 epoch，每次迭代将使用包含\
  \ 300 个观测值的小批量。\n\n```matlab\noptions = trainingOptions('sgdm',...\n      'LearnRateSchedule','piecewise',...\n\
  \      'LearnRateDropFactor',0.2,... \n      'LearnRateDropPeriod',5,... \n    \
  \  'MaxEpochs',20,... \n      'MiniBatchSize',300);\n```\n\n## 9.4 构建网络架构。层\nMATLAB\
  \ 拥有以下类：\n\n| [`ImageInputLayer](http://www.mathworks.com/help/nnet/ref/imageinputlayer-class.html)`\
  \ | 图像输入层 |\n| --- | --- |\n| [`Convolution2DLayer](http://www.mathworks.com/help/nnet/ref/convolution2dlayer-class.html)`\
  \ | 卷积层 |\n| [`ReLULayer](http://www.mathworks.com/help/nnet/ref/relulayer-class.html)`\
  \ | 修正线性单元 (ReLU) 层 |\n| `CrossNormalizationLayer` | 通道级局部响应层 |\n| [`AveragePooling2DLayer](http://www.mathworks.com/help/nnet/ref/averagepooling2d-class.html)`\
  \ | 平均池化层 |\n| [`MaxPooling2DLayer](http://www.mathworks.com/help/nnet/ref/maxpooling2d-class.html)`\
  \ | 最大池化层 |\n| [`FullyConnectedLayer](http://www.mathworks.com/help/nnet/ref/fullyconnectedlayer-class.html)`\
  \ | 全连接层 |\n| [`DropoutLayer](http://www.mathworks.com/help/nnet/ref/dropoutlayer-class.html)`\
  \ | 丢弃层 |\n| [`SoftmaxLayer](http://www.mathworks.com/help/nnet/ref/softmaxlayer-class.html)`\
  \ | Softmax 层 |\n| [`ClassificationOutputLayer](http://www.mathworks.com/help/nnet/ref/classificationoutputlayer-class.html)`\
  \ | 分类输出层 |\n\n## 9.4.1 ImageInputLayer 类\n\n### 描述\n包含输入尺寸、数据变换和层名的图像输入层。\n\n###\
  \ 构造\n`inputlayer = imageInputLayer([inputSize](http://www.mathworks.com/help/nnet/ref/imageinputlayer-class.html#inputarg_inputSize))`\
  \ 返回一个图像输入层。\n\n`inputlayer = imageInputLayer([inputSize](http://www.mathworks.com/help/nnet/ref/imageinputlayer-class.html#inputarg_inputSize),Name,Value)`\
  \ 返回一个图像输入层，并由一个或多个 `Name,Value` 对参数指定额外的选项。\n\n有关键值对参数的更多信息，请参阅 `imageInputLayer`。\n\
  \n### 输入参数\n- `inputSize` — 输入数据的尺寸，两个或三个数字的行向量\n\n### 属性\n- `inputSize` — 三个整数的输入数据行向量\n\
  - `DataAugmentation` — 数据增强变换 `'none'`（默认值） | `'randcrop'` | `'randplr'` | `'randcrop'`\
  \ 和 `'randplr'` 的单元格数组\n- `Normalization` — 数据变换 `'zerocenter'`（默认值） | `'none'`\n\
  - `Name` — 层名 `''`（默认值） | 字符向量\n\n### 示例：创建并显示输入层\n为 28x28 的彩色图像创建一个图像输入层。指定一个用于\
  \ 28x28 彩色图像的图像输入层。\n\n```matlab\ninputlayer = imageInputLayer([28 28 3],'DataAugmentation','randplr');\n\
  inputlayer = \n  ImageInputLayer with:\n      Name: ''\n      InputSize: 28 28 3\n\
  \    DataAugmentation: 'randplr'\n    Normalization: 'zerocenter'\n\n显示输入尺寸。\ninputlayer.InputSize\n\
  ans =\n    28  28  3\n```\n\n## 9.4.2 Convolution2D 类\n\n### 描述\n包含包含尺寸、通道数、层名、权重和偏置的卷积层。\n\
  \n### 构造\n`convlayer = convolutional2dLayer([filterSize](http://www.mathworks.com/help/nnet/ref/convolution2dlayer-class.html#inputarg_filterSize),[numFilters](http://www.mathworks.com/help/nnet/ref/convolution2dlayer-class.html#inputarg_numFilters))`\
  \ 返回一个用于 2D 卷积的层。\n\n`convlayer = convolutional2dLayer([filterSize](http://www.mathworks.com/help/nnet/ref/convolution2dlayer-class.html#inputarg_filterSize),[numFilters](http://www.mathworks.com/help/nnet/ref/convolution2dlayer-class.html#inputarg_numFilters),Name,Value)`\
  \ 返回卷积层，并由一个或多个 `Name,Value` 对指定额外的选项。\n\n有关更多详情，请参阅 `convolution2dLayer(http://www.mathworks.com/help/nnet/ref/convolution2dlayer.html)`\
  \ 函数页面。\n\n### 输入参数\n- `filterSize` — 过滤器的高度和宽度，整数 | 两个值的向量\n- `numFilters` — 过滤器数量，整数\n\
  \n### 属性\n- `Stride` — 遍历输入的步长 `[1 1]`（默认值） | 两个值的向量\n- `Padding` — 应用于边界的零填充 `[0\
  \ 0]`（默认值） | 两个值的向量\n- `NumChannels` — 过滤器的通道数 `'auto'`（默认值） | 整数\n- `Weights` —\
  \ 层的 4D 数组\n- `Bias` — 层的 3D 数组\n- `WeightLearnRate` — 权重的学习率，标量值\n- `WeightL2Factor`\
  \ — 权重的 L2 正则化因子，标量值\n- `BiasLearnRate` — 偏置的学习率，标量值\n- `BiasL2Factor` — 偏置的 L2\
  \ 正则化因子，标量值\n- `Name` — 层名 `''`（默认值） | 字符向量\n\n### 示例 创建卷积层\n创建一个具有 96 个过滤器的卷积层，高度和宽度为\
  \ 11，并在水平和垂直方向上使用步长为 4。\n\n```matlab\nconvlayer = convolutional2dLayer(11,96,'Stride',4)\n\
  convlayer = \n  Convolution2DLayer with properties:\n      Name: ''\n      FilterSize:\
  \ [11 11]\n      NumChannels: 'auto'\n      NumFilters: 96\n    Stride: [4 4]\n\
  \    Padding: [0 0]\n    Weights: []\n    Bias: []\n    WeightLearnRate: 1\n   \
  \ WeightL2Factor: 1\n    BiasLearnRate: 1\n    BiasL2Factor: 0\n```\n\n你可以通过对对象索引来单独显示任何属性。例如，显示过滤器尺寸。\n\
  \n```matlab\nconvlayer.FilterSize\nans =\n    11  11\n```\n\n\n\n\n\n# Description\n\
  整流线性单元（ReLU）层类，包含层的名称。ReLU 层执行阈值操作，其中任何小于零的输入值都被设置为零，即\n\n![](img/00126.jpeg)\n\n\
  # 构造函数\n`layer = relu()` 返回一个 ReLU 层。\n\n`layer = reluLayer(Name,Value)` 返回一个 ReLU\
  \ 层，并通过 `Name,Value` 对参数指定额外的选项。\n\n# 属性\n**Name — 层名称 ''（默认值） | 字符向量**\n层名称，存储为字符向量。如果\
  \ `Name` 设置为 `''`，则软件将在训练时自动分配一个名称。\n\n**数据类型：`char`**\n\n# 示例\n**使用指定名称创建 ReLU\
  \ 层**\n创建一个名称为 `relu1` 的整流线性单元层。\n\n```matlab\nlayer = reluLayer('Name','relu1');\n\
  ```\n\n## 9.4.4 CrossChannelNormalizationLayer 类\n\n### 描述\n通道级局部响应归一化层类，包含通道窗口的大小、归一化的化的超参数以及层的名称。\n\
  \n### 构造函数\n`localnormlayer = crossChannelNormalizationLayer([windowChannelSize])`\
  \ 返回一个局部响应归一化层，该层执行通道级归一化。\n\n`localnormlayer = crossChannelNormalizationLayer([windowChannelSize],Name,Value)`\
  \ 返回一个局部响应归一化层，通过一个或多个 `Name,Value` 对参数指定额外的选项。\n\n有关名称值对参数的更多细节，请参见 `crossChannelNormalizationLayer`。\n\
  \n### 输入参数\n**windowChannelSize — 通道窗口的大小正整数**\n\n### 属性\n**windowChannelSize —\
  \ 通道窗口的大小正整数**\n**Alpha — 归一化标量值中的 α 超参数**\n**Beta — 归一化中的 β 超参数 0.75（默认） | 标量值**\n\
  **K — 归一化中的 K 超参数 2（默认） | 标量值**\n**Name — 层名称 ''（默认） | 字符向量**\n\n### 示例\n**创建局部响应归一化层**\n\
  创建一个用于通道级归一化的局部响应归一化层，其中使用 5 个通道的窗口来归一化每个元素，归一化器的加法常数为 1。\n\n```matlab\nlocalnormlayer\
  \ = crossChannelNormalizationLayer(5,'K',1);\n\nlocalnormlayer = \n  CrossChannelNormalizationLayer\
  \ with properties:\n     WindowChannelSize: 5\n     Alpha: 1.0000e-04\n     Beta:\
  \ 0.7500\n     K: 1\n     Name: ''\n```\n\n## 9.4.5 AveragePooling2DLayer 类\n\n\
  ### 描述\n平均池化层类，包含池大小、步长、填充和层的名称。平均池化层通过将输入划分为矩形池化区域并计算每个区域的平均值执行下采样。它返回池化区域的平均值。池化区域的大小由\
  \ `averagePooling2dLayer` 函数的 `poolSize` 参数决定。\n\n### 构造函数\n`avgpoollayer = averagePooling2dLayer([poolSize])`\
  \ 创建一个执行平均池化的层。`poolSize` 指定矩形区域的维度。\n\n`avgpoollayer = averagePooling2dLayer([poolSize],\
  \ Name,Value)` 创建平均池化层，通过一个或多个 `Name,Value` 对参数指定额外的选项。\n\n有关更多细节，请参见 `averagePooling2dLayer`。\n\
  \n### 输入参数\n**poolSize — 池化区域的高度和宽度标量值 | 两个标量值的向量**\n\n### 属性\n**PoolSize — 池化区域的高度和宽度的标量\
  \ | 两个标量值的向量**\n**Stride — 遍历输入的步长 [1 1]（默认） | 两个标量值的向量**\n**Padding — 应用于输入边界的零填充大小\
  \ [0 0]（默认） | 两个标量值的向量**\n**Name — 层名称 ''（默认） | 字符向量**\n\n### 示例\n**创建不重叠的平均池化层**\n\
  创建一个具有不重叠池化区域的平均池化层。将该层下采样因子设置为 2。\n\n```matlab\navgpoollayer = averagePooling2dLayer(2,'Stride',2)\n\
  \navgpoollayer = \n  AveragePooling2Layer with properties:\n     PoolSize: [2 2]\n\
  \     Stride: [2 2]\n     Padding: [0 0]\n     Name: ''\n```\n\n**创建重叠的平均池化层**\n\
  创建一个具有重叠池化区域的平均池化层。将该层下采样因子设置为 2。\n\n```matlab\navgpoollayer = averagePooling2dLayer(3,'Stride',2,'Padding',1,'Name','avg1')\n\
  \navgpoollayer = \n  AveragePooling2Layer with properties:\n     PoolSize: [3 2]\n\
  \     Stride: [2 2]\n     Padding: [1 0]\n     Name: 'avg1'\n```\n矩形区域的高度和宽度为 3。因为步长为\
  \ 2，所以池化区域是重叠的。`Padding` 的值为 1 会在输入的顶部添加一行零。`0` 表示在输入的左右侧不添加填充。你可以通过点表示法显示任何属性。显示层的名称。\n\
  \n```matlab\navgpoollayer.Name\nans =\navg1\n```\n\n## 9.4.6 MaxPooling2DLayer 类\n\
  \n### 描述\n最大池化层类，包含池大小、步长、填充和层的名称。最大池化层通过将输入划分为矩形池化区域并计算每个区域的最大值执行下采样。池化区域的大小由 `maxPooling2dLayer`\
  \ 函数的 `poolSize` 参数决定。\n\n### 构造函数\n`maxpoollayer = maxPooling2dLayer([poolSize])`\
  \ 返回一个执行最大池化的层。`poolSize` 指定池化区域的维度。\n\n`maxpoollayer = maxPooling2dLayer([poolSize],Name,Value)`\
  \ 返回最大池化层，通过一个或多个 `Name,Value` 对参数指定额外的选项。\n\n有关名称值对参数的更多细节，请参见 `maxPooling2dLayer`。\n\
  \n### 输入参数\n**poolSize — 池化区域的高度和宽度标量值 | 两个标量值的向量**\n\n### 属性\n**PoolSize — 池化区域的高度和宽度标量\
  \ | 两个标量值的向量**\n**Stride — 遍历输入的步长 [1 1]（默认） | 两个标量值的向量**\n**Padding — 应用于输入边界的填充大小\
  \ [0,0]（默认） | 两个标量值的向量**\n**Name — 层名称 ''（默认） | 字符向量**\n\n\n\n\n\n## 示例\n\n### 非重叠池化区域的最大池层\n\
  \n创建一个具有非重叠池化区域的最大池层，采样倍率为 2。\n\n```matlab\nmaxpoollayer = maxPooling2dLayer(2,'Stride',2);\n\
  ```\n\n`maxpoollayer` = \n\n`MaxPooling2DLayer` 属性：\n    PoolSize: [2 2]\n     \
  \ Stride: [2 2]\n    Padding: [0 0]\n        Name: ''\n\n矩形区域（池化大小）的高度和宽度均为 2。该层创建大小为\
  \ `[2 2]` 的池化区域，并返回每个区域四个元素中的最大值。由于垂直和水平遍历图像的步长（stride）也是 `[2 2]`，因此池化区域不重叠。\n\n\
  ### 重叠池化区域的最大池层\n\n创建一个具有重叠池化区域的最大池层。同时对输入的顶部和底部添加填充。\n\n```matlab\nmaxpoollayer\
  \ = maxPooling2dLayer([3 2],'Stride',2,...\n  'Padding',[1 0],'Name','max1');\n\
  ```\n\n`maxpoollayer` = \n\n`MaxPooling2DLayer` 属性：\n    PoolSize: [3 2]\n     \
  \ Stride: [2 2]\n    Padding: [1 0]\n        Name: 'max1'\n\n矩形区域（池化大小）的高度和宽度分别为\
  \ 3 和 2。该层创建大小为 `[3 2]` 的池化区域，并返回每个区域六个元素中的最大值。由于垂直和水平遍历图像的步长（stride）为 `[2 2]`，池化区域存在重叠。\n\
  \n`Padding` 名称值对值中的 `1` 表示软件也会在输入数据的顶部和底部添加填充。`0` 表示不对输入数据的右侧和左侧添加填充。\n\n你可以通过对对象索引来显示任何属性。显示层的名称。\n\
  \n```matlab\nmaxpoollayer.Name \nans =\nmax1\n```\n\n## 9.4.7 FullyConnectedLayer\
  \ 类\n\n### 描述\n\n包含输入和输出大小、层名称以及权重和偏置数据的全连接层类。\n\n### 构造\n\n`fullconnectlayer` =\
  \ `fullyConnectedLayer([outputSize])` 返回一个全连接层，其中软件将输入乘以矩阵然后加上偏置向量。\n\n`fullconnectlayer`\
  \ = `fullyConnectedLayer([outputSize],Name,Value)` 返回全连接层，通过一个或多个 `Name,Value` 名称值对参数指定额外选项。\n\
  \n有关名称值对参数的更多细节，请参阅 `fullyConnectedLayer`。\n\n### 输入参数\n\n- **outputSize** — 全连接层输出的整数值\n\
  \n### 属性\n\n- **InputSize** — 层输入大小，正整数 | `'auto'`\n- **OutputSize** — 层输出大小，正整数\n\
  - **Weights** — 层权重 `OutputSize`-by-`InputSize` 矩阵\n- **Bias** — 层偏置 `OutputSize`-by-1\
  \ 矩阵\n- **WeightLearnRateFactor** — 权重的学习率因子，标量值\n- **WeightL2Factor** — 权重 L2 正则化因子，标量值\n\
  - **BiasLearnRateFactor** — 偏置的学习率因子，标量值\n- **BiasL2Factor** — 偏置的 L2 正则化因子，标量值\n\
  - **Name** — 层名称 `''`（默认） | 字符向量\n\n### 示例：创建全连接层\n\n创建一个输出大小为 10 的全连接层。\n\n```matlab\n\
  fullclayer = fullyConnectedLayer(10)\n```\n\n`fullclayer` = \n\n`FullyConnectedLayer`\
  \ 属性：\n            Weights: []\n            Bias: []\n    WeightLearnRateFactor:\
  \ 1\n    WeightL2Factor: 1\n    BiasLearnRateFactor: 1\n        BiasL2Factor: 0\n\
  \            InputSize: 'auto'\n    OutputSize: 10\n\n软件确定输入大小。\n\n## 9.4.8 DropoutLayer\n\
  \n### 描述\n\n包含丢弃概率和层名称的丢弃层。\n\n### 构造\n\n`droplayer` = `DropoutLayer()` 返回一个丢弃层，随机丢弃元素。\n\
  \n`droplayer` = `DropoutLayer([probability])` 返回丢弃层，通过 `Name,Value` 名称值对指定额外选项。\n\
  \n### 输入参数\n\n- **probability** — 丢弃概率，默认 0.5\n\n### 属性\n\n- **Probability** — 丢弃概率\n\
  - **Name** — 层名称 `''`（默认） | 字符向量\n\n### 示例：创建丢弃层\n\n创建一个丢弃 40% 元素的丢弃层。\n\n```matlab\n\
  droplayer = DropoutLayer(0.4,'Name','dropout1')\n```\n\n`droplayer` = \n\n`DropoutLayer`\
  \ 属性：\n    Probability: 0.4\n    Name: 'dropout1'\n\n## 9.4.9 SoftmaxLayer 类\n\n\
  ### 描述\n\n使用 softmax 激活函数的 softmax 层。适用于超过 2 类的分类问题。\n\n### 构造\n\n`smlayer` = `SoftmaxLayer()`\
  \ 返回用于分类问题的 softmax 层。\n\n`smlayer` = `SoftmaxLayer('Name',layername)` 返回 softmax\
  \ 层，通过 `Name,Value` 名称值对指定额外选项。\n\n### 属性\n\n- **Name** — 层名称 `''`（默认） | 字符向量\n\n\
  ### 示例：创建指定名称的 Softmax 层\n\n创建一个名为 `sml1` 的 softmax 层。\n\n```matlab\nsmlayer = SoftmaxLayer('Name','sml1')\n\
  ```\n\n## 9.4.10 ClassificationOutputLayer 类\n\n### 描述\n\n分类输出层，包含用于训练网络的损失函数名称、输出大小以及类别标签。\n\
  \n### 构造\n\n`classoutputlayer` = `ClassificationOutputLayer()` 返回神经网络的分类输出层。\n\n\
  `classoutputlayer` = `ClassificationOutputLayer(Name,Value)` 返回分类输出层，通过 `Name,Value`\
  \ 名称值对指定额外选项。\n\n### 属性\n\n- **OutputSize** — 输出大小，标量值\n- **LossFunction** — 用于训练的损失函数\
  \ `'crossentropyex'`\n- **ClassNames** — 类别名称，训练前为空单元格数组 | 训练后的类别名称单元格数组\n- **Name**\
  \ — 层名称 `''`（默认） | 字符向量\n\n### 示例：创建分类输出层\n\n创建一个名为 `'coutput'` 的分类输出层。\n\n```matlab\n\
  coutputlayer = ClassificationOutputLayer('Name','coutput')\n```\n\n`coutputlayer`\
  \ = \n\n`ClassificationOutputLayer` 属性：\n    OutputSize: 'auto'\n    LossFunction:\
  \ 'crossentropyex'\n    ClassNames: {}\n    Name: 'coutput'\n\n### 定义：针对 k 类互斥类的交叉熵函数\n\
  \n对于多分类问题，软件将每个输入分配给 *k* 个互斥类之一。这种情况下的损失（误差）函数是 1-of-*k* 编码方案的交叉熵函数：\n\n\n\n\n\n\
  ![](img/00136.jpeg)\n\n输出单元激活函数是 softmax 函数：\n\n![](img/00137.jpeg)\n\n# 第 10 章\
  \ 使用深度学习进行图像分类\n\n## 10.1 概述\n\n卷积神经网络（CNN）是深度学习领域一种强大的机器学习技术。CNN 使用大量多样化的图像集合进行训练。通过这些庞大的集合，CNN\
  \ 可以学习到各种图像的丰富特征表示。这些特征表示的性能通常优于 `HOG`、`LBP` 或 `SURF` 等手工特征。要利用 CNN 的力量而无需投入大量时间和精力进行训练，的一种简单方法是使用预训练的\
  \ CNN 作为特征提取器。\n\n在本示例中，我们将来自 Caltech 101 的图像通过使用从图像中提取的 CNN 特征训练的多分类线性 SVM 进行分类。这种图像类别分类方法遵循了标准做法，即使用从图像中提取的特征来训练现成的分类器。例如，“使用特征袋的图像类别分类”示例在特征袋框架内使用\
  \ `SURF` 特征来训练多分类 SVM。此处的不同之处在于，我们不是使用 `HOG` 或 `SURF` 等图像特征，而是使用 CNN 提取特征。而且正如本示例所示，使用\
  \ CNN 特征训练的分类器提供了接近 100% 的准确率，这高于使用特征袋和 `SURF` 的准确率。\n\n注意：此示例需要 Computer Vision\
  \ System Toolbox™、Image Processing Toolbox™、Neural Network Toolbox™、Parallel Computing\
  \ Toolbox™、Statistics and Machine Learning Toolbox 以及计算能力为 3.0 或更高的支持 CUDA 的 NVIDIA™\
  \ GPU。\n\n```matlab\nfunction DeepLearningImageClassificationExample\n```\n\n##\
  \ 10.2 检查系统要求\n\n建议使用计算能力为 3.0 或更高的支持 CUDA 的 NVIDIA™ GPU 来运行此示例。查询 GPU 设备以检查其是否可以运行此示例：\n\
  \n```matlab\n% 获取 GPU 设备信息\ndeviceInfo = gpuDevice;\n\n% 检查 GPU 计算能力\ncomputeCapability\
  \ = str2double(deviceInfo.ComputeCapability);\nassert(computeCapability > 3.0, ...\n\
  \    '此示例需要计算能力为 3.0 或更高的 GPU 设备。')\n```\n\n## 10.3 下载图像数据\n\n类别分类器将在来自 [Caltech\
  \ 101](http://www.vision.caltech.edu/Image_Datasets/Caltech101) 的图像上训练。Caltech 101\
  \ 是引用和使用最广泛的数据集之一，由 Fei-Fei Li、Marco Andreetto 和 Marc 'Aurelio Ranzato 收集。\n\n```matlab\n\
  % 从以下位置下载压缩数据集\nurl = 'http://www.vision.caltech.edu/Image\\_Datasets/Caltech101/101_ObjectCategories.tar.gz';\n\
  \n% 将输出存储在临时文件夹中\noutputFolder = fullfile(tempdir, 'caltech101'); % 定义输出文件夹\n```\n\
  \n注意：数据的下载时间取决于您的网络连接。后续命令将使用 MATLAB 下载数据并阻塞 MATLAB。或者，您可以使用网络浏览器先将数据集下载到本地磁盘。要使用您从网络下载的文件，请将上方的\
  \ `outputFolder` 变量更改下载文件的位置。\n\n```matlab\nif ~exist(outputFolder, 'dir') % 仅下载一次\n\
  \    disp('正在下载 126MB Caltech101 数据集...');\n    untar(url, outputFolder);\nend\n\
  ```\n\n## 10.4 加载图像\n\n与其对整个 Caltech 101 进行操作（这非常耗时），不如使用三个类别：飞机（airplanes）、渡轮（ferry）和笔记本电脑（laptop）。图像类别分类器将训练用于区分这三个类别。\n\
  \n```matlab\nrootFolder = fullfile(outputFolder, '101_ObjectCategories');\ncategories\
  \ = {'airplanes', 'ferry', 'laptop'};\n```\n\n创建一个 `ImageDatastore` 来帮助您管理数据。由于\
  \ `ImageDatastore` 基于图像文件位置操作，图像在读取之前不会加载到内存中，使其对于处理大型图像集非常高效。\n\n```matlab\nimds\
  \ = imageDatastore(fullfile(rootFolder, categories), 'LabelSource', 'foldernames');\n\
  ```\n\n变量 `imds` 现在包含了以及与每个图像关联的类别标签。标签根据图像文件的文件夹自动分配。使用 `countEachLabel` 总结每个类别的图像数量。\n\
  \n```matlab\ntbl = countEachLabel(imds)\n```\n\n```\ntbl =\n      Label      Count\n\
  \    ____    ____\n    airplanes     800\n    ferry          67\n    laptop    \
  \    81\n```\n\n由于上述 `imds` 中每个类别的图像数量不相等，让我们先进行调整，使训练集中的图像数量平衡。\n\n```matlab\n\
  minSetCount = min(tbl{:,2}); % 确定类别中数量最少的图像\n% 使用 splitEachLabel 方法裁剪集合。\nimds =\
  \ splitEachLabel(imds, minSetCount, 'randomize');\n```\n\n注意，每个集合现在具有相同数量的图像。\n\n\
  ```matlab\ncountEachLabel(imds)\n```\n\n```\nans\n      Label      Count\n    ____\
  \    ____\n    airplanes     800\n    ferry          67\n    laptop        81\n\
  ```\n\n下面你可以看到这些类别的图像。\n\n```matlab\n% 找到每个类的第一个实例\nairplanes = find(imds.Labels\
  \ == 'airplanes', 1);\nferry = find(imds.Labels == 'ferry', 1);\nlaptop = find(imds.Labels\
  \ == 'laptop', 1);\n\nfigure\nsubplot(1,3,1); imshow(read(imds,airplanes))\nsubplot(1,3,2);\
  \ imshow(read(imds,ferry))\nsubplot(1,3,3); imshow(read(imds,laptop))\n```\n\n##\
  \ 10.5 下载预训练卷积神经网络 (CNN)\n\n现在图像已经准备就，您需要为此示例下载一个预训练的 CNN。有一些流行的预训练网络。其中大多数是在 ImageNet\
  \ 数据集上训练的，该数据集包含 1000 个类别和 120 万张图像。“AlexNet”就是其中一个模型。\n\n```matlab\n% \"AlexNet\"\
  \ 的位置\nurl = 'http://www.vlfeat.org/matconv/models/caffe.mat';\n% 将输出存储在临时文件夹中\n\
  cnnMatFile = fullfile(tempdir, 'caffe.mat');\n```\n\n注意：数据的下载时间取决于您的网络连接。后续的命令将使用\
  \ MATLAB 下载数据并阻塞 MATLAB。或者，您可以使用网络浏览器先将数据集下载到本地磁盘。要使用您从网络下载的文件，请将上方的 `cnnMatFile`\
  \ 变量更改下载文件的位置。\n\n```matlab\nif ~exist(cnnMatFile, 'file')\n    disp('正在下载预训练 CNN...');\n\
  \    websave(cnnMatFile, url);\nend\n```\n\n## 10.5.1 加载预训练 AlexNet\n\n有一些流行的预训练网络。其中大多数是在\
  \ ImageNet 数据集上训练的，该数据集包含 1000 个类别和 120 万张图像。“AlexNet”是其中一个模型，可以使用 `alexnet` 函数加载。`alexnet`\
  \ 要求您先安装 Neural Network Toolbox。\n\n```matlab\n% 加载预训练 AlexNet\nnet = alexnet()\n\
  ```\n\n```\nnet = SeriesNetwork with properties:\n    Layers: [25×1 nnet.cnn.Layer]\n\
  ```\n\n其他在 ImageNet 上训练的流行网络包括 VGG-16 和 VGG-19，它们可以使用 Neural Network Toolbox 中的\
  \ `vgg16` 和 `vgg19` 加载。\n\n`net.Layers` 定义了 CNN 的架构。\n\n```matlab\n% 查看 CNN 架构\n\
  net.Layers\n```\n\n```\nans = 25×1 Layer array with layers:\n    1 'data' Image\
  \ Input 227x227x3 images with 'zerocenter' normalization\n    2 'conv1' Convolution\
  \ 96 11x11x3 convolutions with stride [4 4] and padding [0 0]\n    3 'relu1' ReLU\n\
  \    4 'norm1' Cross Channel Normalization cross channel normalization with 5 channels\
  \ per element\n    5 'pool1' Max Pooling 3x3 max pooling with stride [2 2] and padding\
  \ [0 0]\n```\n\n\n\n\n| 索引 | 名称 | 类型 |  |\n| :--- | :--- | :--- | :--- |\n| 6 |\
  \ `conv2` | 卷积 | 256 个 5x5x48 卷积，步长为 `[1 1]`，填充为 `[2 2]` |\n| 7 | `relu2` | ReLU\
  \ | ReLU |\n| 8 | `norm2` | 通通道归一化 | 每个元素 5 通道的跨通道归一化 |\n| 9 | `pool2` | 最大池化 |\
  \ 3x3 最大池化，步长为 `[2 2]`，填充为 `[0 0]` |\n| 10 | `conv3` | 卷积 | 384 个 3x3x256 卷积，步长为\
  \ `[1 1]`，填充为 `[1 1]` |\n| 11 | `relu3` | ReLU | ReLU |\n| 12 | `conv4` | 卷积 | 384\
  \ 个 3x3x192 卷积，步长为 `[1 1]`，填充为 `[1 1]` |\n| 13 | `relu4` | ReLU | ReLU |\n| 14 |\
  \ `conv5` | 卷积 | 256 个 3x3x192 卷积，步长为 `[1 1]`，填充为 `[1 1]` |\n| 15 | `relu5` | ReLU\
  \ | ReLU |\n| 16 | `pool5` | 最大池化 | 3x3 最大池化，步长为 `[2 2]`，填充为 `[0 0]` |\n| 17 | `fc6`\
  \ | 全连接 | 4096 全连接层 |\n| 18 | `relu6` | ReLU | ReLU |\n| 19 | `drop6` | 丢弃 | 50%\
  \ 丢失率 |\n| 20 | `fc7` | 全连接 | 4096 全连接层 |\n| 21 | `relu7` | ReLU | ReLU |\n| 22\
  \ | `drop7` | 丢弃 | 50% 丢失率 |\n| 23 | `fc8` | 全连接 | 1000 全连接层 |\n| 24 | `prob` |\
  \ Softmax | softmax |\n| 25 | `output` | 分类输出 |  'tench'、'goldfish' 和其他 998 类的交叉熵\
  \ |\n\n第一层定义了输入维度。每个 CNN 都有不同的输入尺寸要求。本示例使用的模型需要输入大小为 227x227x3 的图像。\n\n```matlab\n\
  % 检查第一层\nnet.Layers(1)\n```\n\n```matlab\nans = \n  ImageInputLayer with properties:\n\
  \                Name: 'data'\n      InputSize: [227 227 3]\n  Hyperparameters\n\
  \    DataAugmentation: 'none'\n      Normalization: 'zerocenter'\n```\n\n中间层构成了\
  \ CNN 的大部分。它们是一系列卷积层，之间穿插着线性整流单元（ReLU）和最大池化层 [2]。在这些层之后是 3 个全连接层。\n\n最后一层是分类层，其属性取决于任务。在本示例中，加载的\
  \ CNN 模型是为解决 1000 类分类而训练的。因此，分类层包含来自 ImageNet 数据集的 1000 个类。\n\n```matlab\n% 检查最后一层\n\
  net.Layers(end)\n```\n\n```matlab\n% ImageNet 任务的类名称数量\nnumel(net.Layers(end).ClassNames)\n\
  ```\n\n```matlab\nans = \n  ClassificationOutputLayer with properties:\n    Name:\
  \ 'output'\n    ClassNames: {1x100}\n    OutputSize: 100\n  Hyperparameters\n  \
  \  LossFunction: 'crossentropy'\n```\n\n注意，该 CNN 模型将不再用于原始任务。它将被重新定位，用于解决 Caltech\
  \ 101 数据集上的不同分类任务。\n\n# 加载预训练 CNN\n\nCNN 模型以 MatNet 格式保存。将 MatNet 网络数据加载到 `convnet`\
  \ 中，这是一个通过辅助函数 `helperImportConvNet` 的 `SeriesNetwork` 对象。`SeriesNetwork` 对象可用于检查架构、分类新数据以及从特定层提取激活值。\n\
  \n```matlab\n% 将 MatNet 网络加载到 SeriesNetwork\nconvnet = helperImportConvNet(cnnFile)\n\
  ```\n\n```matlab\nconvnet = \n  SeriesNetwork with properties:\n    Layers: [23x1\
  \ net.cnn.layer]\n```\n\n```matlab\n% 查看 CNN 架构\nconvnet.Layers\n```\n\n```matlab\n\
  ans = 23x1 array with layers:\n    1  'input'           Input           27x27x3\
  \ 图像，带有 'zerocenter' 归一化\n    2  'conv1'          Convolution      96 个 1x1x3 卷积，步长为\
  \ [4]，填充为 [0]\n    3  'relu1'          ReLU            ReLU\n    4  'norm1'    \
  \      Cross Normalization  每个元素 5 通道的跨通道归一化\n    5  'pool1'          Max Pooling\
  \      3x3 最大池化，步长为 [2]，填充为 [0]\n    6  'conv2'          Convolution      256 个\
  \ 5x5x48 卷积，步长为 [1 1]，填充为 [2 2]\n    7  'relu2'          ReLU            ReLU\n\
  \    8  'norm2'          Cross Normalization  每个元素 5 通道的跨通道归一化\n    9  'pool2' \
  \         Max Pooling      3x3 最大池化，步长为 [2 2]，填充为 [0 0]\n    10 'conv3'        \
  \  Convolution      384 个 3x3x256 卷积，步长为 [1 1]，填充为 [1 1]\n    11 'relu3'       \
  \   ReLU            ReLU\n    12 'conv4'          Convolution      384 个 3x3x192\
  \ 卷积，步长为 [1 1]，填充为 [1 1]\n    13 'relu4'          ReLU            ReLU\n    14 'conv5'\
  \          Convolution      256 个 3x3x192 卷积，步长为 [1 1]，填充为 [1 1]\n    15 'relu5'\
  \          ReLU            ReLU\n    16 'pool5'          Max Pooling      3x3 最大池化，步长为\
  \ [2 2]，填充为 [0 0]\n    17 'fc6'           Fully Connected  4096 全连接层\n    18 'relu6'\
  \          ReLU            ReLU\n    19 'drop6'          Dropout         50% 丢失率\n\
  \    20 'fc7'           Fully Connected  4096 全连接层\n    21 'relu7'          ReLU\
  \            ReLU\n    22 'drop7'          Dropout         50% 丢失率\n    23 'fc8'\
  \           Fully Connected  1000 全连接层\n```\n\n## 10.7 为 CNN 预处理图像\n\n如上所述，`convnet`\
  \ 只能处理 227x227 的 RGB 图像。为了避免将 Caltech 101 中的所有图像重新保存为此格式，请设置 `imds` 读取函数 `imds.ReadFcn`\
  \ 来实时预处理图像。每当从 `ImageDatastore` 读取图像时，都会调用 `imds.ReadFcn`。\n\n\n\n\n\n% 设置 ImageDatastore\
  \ ReadFcn\n\n```matlab\nimds.ReadFcn = @(filename)readAndPreprocessImage(filename);\n\
  ```\n\n请注意，其他 CNN 模型会有不同的输入大小限制，并且可能需要其他的预处理步骤。\n\n```matlab\n    function Iout\
  \ = readAndPreprocessImage(filename)\n        I = imread(filename);\n        % 某些图像可能是灰色的。将图像复制\
  \ 3 次以\n        % 创建 RGB 图像。\n        if ismatrix(I)\n            I = cat(3,I,I,I);\n\
  \        end\n        % 根据 CNN 的要求调整图像大小。\n        Iout = imresize(I, [227 227]);\n\
  \        % 注意，这里没有保持纵比例。在 Caltech 101 中，\n        % 感的对象位于图像中心并占据\n        % 图像场景的大部分。因此，保持纵比例\n\
  \        % 并不是关键。然而，对于其他数据集，在缩放时\n        % 保持原始图像的纵比例可能会有益。\n    end\n```\n\n##\
  \ 10.8 准备训练和测试图像集\n\n将集合分为训练数据和验证数据。从每个集合中选取 30% 的图像作为训练数据，剩余的 70% 作为验证数据。随机化划分以避免结果偏。。训练集和测试集将由\
  \ CNN 模型处理。\n\n```matlab\n[trainingSet, testSet] = splitEachLabel(imds, 0.3, 'randomize');\n\
  ```\n\n## 10.9 使用 CNN 提取训练特征\n\nCNN 的每一层都会对输入图像产生响应（或激活）。然而，CNN 内部只有少数几层适用于图像特征提取。网络开头的层捕捉基础图像特征，例如边缘和斑块（blobs）。为了观察这一点，可以可视化第一层卷积层的滤波器权重。这有助于建立一种直觉，即明为什么从\
  \ CNN 中提取的特征在图像识别任务中如此有效。请注意，可视化深层权重超出了本示例的范围。你可以在 Zeiler 和 Fergus 的工作 [4] 中阅读更多信息。\n\
  \n```matlab\n% 获取第二个卷积层的网络权重\nw1 = convnet.Layers(2).Weights;\n\n% 缩放并调整权重大小以便可视化\n\
  w1 = mat2gray(w1);\nw1 = imresize(w1,5);\n\n% 显示网络权重的蒙太图。第一层有 96 组独立的权重。\nfigure\n\
  montage(w1)\ntitle('First convolutional layer weights')\n```\n\n注意网络的第一层如何学习了用于捕捉斑块和边缘特征的滤波器。这些“原始”特征随后由深层网络层处理，这些层组合早期特征形成更高级的图像特征。这些高级特征更适合识别任务，因为它们将所有原始特征组合成更丰富的图像表示\
  \ [5]。\n\n你可以使用 `activations` 方法轻松地从其中一个深层层中提取特征。选择哪一个深层是一个设计选择，但通常从紧邻分类层的前的一层开始是一个很好的起点。在\
  \ `convnet` 中，该层命名为 'fc7'。让我们使用该层提取训练特征。\n\n```matlab\nfeatureLayer = 'fc7';\ntrainingFeatures\
  \ = activations(convnet, trainingSet, featureLayer, ...\n    'MiniBatchSize', 32,\
  \ 'OutputAs', 'columns');\n```\n\n注意，如果可用 GPU，`activations` 函数会自动使用 GPU 进行处理，否则使用\
  \ CPU。由于 AlexNet 层数较多，强烈建议使用 GPU。使用 CPU 运行网络将极大增加提取特征的时间。\n\n在上面的代码中，'MiniBatchSize'\
  \ 设置为 32，以确保 CNN 和图像数据适合 GPU 内存。如果你的 GPU 内存溢出，你可能需要降低 'MiniBatchSize'。此外，`activations`\
  \ 输出排列为列。这有助于加速随后的多类线性 SVM 训练。\n\n# 10.10 使用 CNN 特征训练多类 SVM 分类器\n\n接下来，使用 CNN 图像特征训练多类\
  \ SVM 分类器。通过将 `fitcecoc` 函数的 'Learners' 参数设置为 'Linear' 使用快速的随机梯度下降求解器进行训练。这有助于在处理高维\
  \ CNN 特征向量时加速训练，每个向量的长度为 4096。\n\n```matlab\n% 从 trainingSet 获取训练标签\ntrainingLabels\
  \ = trainingSet.Labels;\n\n% 使用快速线性求解器训练多类 SVM 分类器，并将\n% 'ObservationsIn' 设置为 'columns'\
  \ 以匹配训练\n% 特征的排列方式。\nclassifier = fitcecoc(trainingFeatures, trainingLabels, ...\n\
  \    'Learners', 'Linear', 'Coding', 'onevsall', 'ObservationsIn', 'columns');\n\
  ```\n\n## 10.11 评估分类器\n\n重复之前使用的步骤从 `testSet` 中提取图像特征。然后可以将测试特征传递给分类器，以衡量已训练分类器的准确性。\n\
  \n```matlab\n% 使用 CNN 提取测试特征\ntestFeatures = activations(convnet, testSet, featureLayer,\
  \ 'MiniBatchSize',32);\n\n% 将 CNN 图像特征传递给训练好的分类器\npredictedLabels = predict(classifier,\
  \ testFeatures);\n\n% 获取已知标签\ntestLabels = testSet.Labels;\n\n% 使用混淆矩阵统计结果。\nconfMat\
  \ = confusionmat(testLabels, predictedLabels);\n\n% 将混淆矩阵转换为百分比形式\nconfMat = bsxfun(@rdivide,confMat,sum(confMat,2))\n\
  confMat = [1 0 0; 0 1 0; 0 0 1]\n\n% 显示平均准确率\nmean(diag(confMat))\nans = 1\n```\n\
  \n# 10.12 在测试图像上尝试新分类器\n\n你现在可以使用新训练的分类器对图像进行分类。\n\n```matlab\nnewImage = fullfile(rootFolder,\
  \ 'airplanes', 'image_0690.jpg');\n\n% 根据 CNN 要求预处理图像\nimg = readAndPreprocessImage(newImage);\n\
  \n% 使用 CNN 提取图像特征\nimageFeatures = activations(convnet, img, featureLayer);\n\n\
  % 使用分类器进行预测\nlabel = predict(classifier, imageFeatures)\nlabel = airplanes\n```\n\
  \n## 10.13 参考文献\n\n[1] Deng, Jia, et al. \"Imagenet: A large-scale hierarchical\
  \ image database.\" Computer Vision and Pattern Recognition, 2009. CVPR 2009 IEEE\
  \ Conference on. IEEE, 2009.\n\n[2] Krizhevsky, Alex, Ilya Sutskever, and Geoffrey\
  \ E. Hinton. \"Imagenet classification with deep convolutional neural networks.\"\
  \ Advances in neural information processing systems. 2012.\n\n[3] Vedaldi, Andrea,\
  \ and Karel Lenc. \"MatConvNet-convolutional neural networks for MATLAB.\" arXiv\
  \ preprint arXiv:1412.4564 (2014).\n\n[4] Zeiler, Matthew D., and Rob Fergus. \"\
  Visualizing and understanding convolutional networks.\" Computer Vision-ECCV 2014.\
  \ Springer International Publishing, 2014. 818-833.\n\n[5] Donahue, Jeff, et al.\
  \ \"Decaf: A deep convolutional activation feature for generic visual recognition.\"\
  \ arXiv preprint arXiv:1310.1531 (2013).\n\n\n\n\n微调一个在数字图像上经过预训练的卷积神经网络，以学习字母图像的特征。迁移学习被认为是在机器学习中将知识从一个已学习的任务转移到新任务的过程\
  \ [1]。在神经网络的语境下，它是将预训练网络学习到的特征转移到新问题。当训练数据量不足时，在每个情况下从头开始训练卷积神经网络通常是有效的。深度学习中针对此类情况的常用做法是使用在大型数据集上训练过的网络来处理新问题。虽然预训练网络的初始层可以固定，但最后几层必须进行微调，以学习新数据集的特定特征。迁移学习通常比训练新的卷积神经网络具有更快的训练速度，因为你不需要估计新网络中的所有参数。\n\
  \n**注意：** 训练卷积神经网络需要 Parallel Computing Toolbox™ 和具有计算能力 3.0 或更高的 CUDA® 支持的 NVIDIA®\
  \ GPU。\n\n将样本数据加载为 `ImageDatastore`。\n\n```matlab\ndigitDatasetPath = fullfile(matlabroot,'toolbox','nnet','nndemos',...\n\
  \    'nndatasets','DigitDataset');\ndigitData = imageDatastore(digitDatasetPath,...\n\
  \    'IncludeSubfolders',true,'LabelSource','foldernames');\n```\n\n数据存储器包含 10000\
  \ 张数字 0–9 的合成图像。这些图像通过对使用不同字体创建的数字图像应用随机变换。每个数字图像均为 28x28 像素。\n\n显示数据存储器中的部分图像。\n\
  \n```matlab\nfor i = 1:20\n    subplot(4,5,i);\n    imshow(digitData.Files{i});\n\
  end\n```\n\n![描述: http://es.mathworks.com/help/examples/nnet/TransferLearningUsingConvolutionalNeuralNetworksExample_01.png](img/00140.jpeg)\n\
  \n检查每个数字类别图像的数量。\n\n```matlab\ndigitData.countEachLabel\nans = \n    Label    Count\n\
  \    ____    ____\n    0         988 \n    1        1026 \n    2        1003 \n\
  \    3         993 \n    4        991 \n    5        1017 \n    6         992 \n\
  \    7         999 \n    8        1003 \n    9         988 \n```\n\n数据中每个类别的图像数量不相等。\n\
  \n为了平衡训练集中每个数字的图像数量，首先找到类别中图像最少的数量。\n\n```matlab\nminSetCount = min(digitData.countEachLabel{:,2})\n\
  minSetCount =\n    988\n```\n\n划分数据集，使训练集中的每个类别都有 494 张图像，而测试集包含每个标签剩余的图像。\n\n```matlab\n\
  trainingNumFiles = round(minSetCount/2);\nrng(1) % 为了可复现性\n[trainDigitData,testDigitData]\
  \ = splitEachLabel(digitData,...\n                                     trainingNumFiles,'randomize');\n\
  ```\n\n`splitEachLabel` 将 `digitData` 中的图像文件拆分为两个新的数据存储器 `trainDigitData` 和 `testDigitData`。\n\
  \n为卷积神经网络创建层。\n\n```matlab\nlayers = [imageInputLayer([28 28 1])\n           convolution2dLayer(5,20)\n\
  \           reluLayer()\n           maxPooling2dLayer(2,'Stride',2)\n          \
  \ fullyConnectedLayer(10)\n           softmaxLayer()\n           classificationLayer()];\n\
  ```\n\n创建训练选项。将最大训练轮数设置为 20，并以 0.01 的初始率开始训练。\n\n```matlab\noptions = trainingOptions('sg','MaxEpochs',20,...\
  \ 'InitialRate',0.01);\n```\n\n使用训练集和上一步定义的选项训练网络。\n\n```matlab\nconvnet = trainNetwork(trainDigitData,layers,options)\n\
  =========================\nEpoch | Iteration | Time Elapsed (seconds) | Mini-batch\
  \ Loss | Accuracy | Base Rate\n=========================\n2 | 50 | 0.7 | 0.233 |\
  \ 92.97% | 0.0100\n3 | 100 | 1.37 | 0.182 | 99.2% | 0.0100\n4 | 150 | 2.02 | 0.095\
  \ | 99.22% | 0.0100\n6 | 200 | 2.70 | 0.0105 | 99.22% | 0.0100\n7 | 250 | 3.35 |\
  \ 0.0026 | 100.0% | 0.0100\n8 | 300 | 4.00 | 0.0004 | 100.0% | 0.0100\n10 | 350\
  \ | 4.67 | 0.0002 | 100.0% | 0.0100\n11 | 400 | 5.32 | 0.0001 | 100.0% | 0.0100\n\
  12 | 450 | 5.95 | 0.0001 | 100.0% | 0.0100\n14 | 500 | 6.60 | 0.0002 | 100.0% |\
  \ 0.0100\n15 | 550 | 7.23 | 0.0001 | 100.0% | 0.0100\n16 | 600 | 7.87 | 0.0001 |\
  \ 100.0% | 0.0100\n18 | 650 | 8.52 | 0.0001 | 100.0% | 0.0100\n19 | 700 | 9.15 |\
  \ 0.0001 | 100.0% | 0.0100\n20 | 750 | 9.79 | 0.0000 | 100.0% | 0.00100\n=========================================\n\
  ```\n\n使用测试集测试网络并计算准确率。\n\n```matlab\nYTest = classify(convnet,testDigitData);\n\
  TTest = testDigitData.Labels;\naccuracy = sum(YTest == TTest)/numel(YTest)\naccuracy\
  \ =\n    0.9976\n```\n\n准确率是测试数据中与 `classify` 分类正确的标签数量与测试数据图像总数的比例。在这种情况下，99.78%\
  \ 的数字估计符合测试集中的真实数字值。\n\n现在，假设你想使用训练好的网络 `net` 对新一组数据预测类别。加载字母训练数据。\n\n```matlab\n\
  load lettersTrainSet.mat\n```\n\n`XTrain` 包含 1500 张 A、B 和 C 字母的 28x28 灰度图像。`TTrain`\
  \ 包含字母标签的分类数组。\n\n显示部分字母图像。\n\n```matlab\nfigure;\nfor j = 1:20\n    subplot(4,5,j);\n\
  \    selectImage = datasample(XTrain,1,4);\n    imshow(selectImage,[]);\nend\n```\n\
  \n![描述: http://es.mathworks.com/help/examples/nnet/TransferLearningUsingConvolutionalNeuralNetworksExample_02.png](img/00141.jpeg)\n\
  \n`XTrain` 中的像素值范围在 [0 1]。训练网络 `net` 时使用的数字数据在 [255]；将字母数据缩放至 [255] 之间。\n\n```matlab\n\
  XTrain = XTrain*255;\n```\n\n训练网络 `net` 的最后三层针对数字数据集进行了调整，该数据集有 10 个类。这些层的属性取决于分类任务。显示全连接层（fullyConnectedLayer`）。\n\
  \n```matlab\nconvnet.Layers(end-2)\nans = \nFullyConnectedLayer with properties:\n\
  \    Name: 'fc'\n  Hyperparameters\n    InputSize: 2880\n    OutputSize: 10\n  Learnable\
  \ Parameters\n    Weights: [10×2880 single]\n    Bias: [10×1 single]\n```\n\n使用\
  \ `properties` 方法查看所有属性列表。显示最后一层（classificationLayer`）。\n\n```matlab\nconvnet.Layers(end)\n\
  ans = \nClassificationOutputLayer with properties:\n    Name: 'classoutput'\n  \
  \  ClassNames: {10×1 cell}\n    OutputSize: 10\n  Hyperparameters\n    LossFunction:\
  \ 'crossentropyex'\n```\n\n这三层必须针对新的分类问题进行微调。从训练好的网络 `net` 中提取最后三层以外的所有层。\n\n```matlab\n\
  layersTransfer = convnet.Layers(1:end-3);\n```\n\n字母数据集有三个类别。为三个类别添加一个新的全连接层，并增加该层的学习学习率。\n\
  \n```matlab\nlayersTransfer(end+1) = fullyConnectedLayer(3,...\n    'WeightLearnRateFactor',10,...\n\
  \    'BiasLearnRateFactor',20);\n```\n\n\n\n\n`WeightLearnRateFactor` 和 `BiasLearnRateFactor`\
  \ 是全连接层全局学习率的倍数。\n\n添加一个 softmax 层和一个分类输出层。\n\n```matlab\nlayersTransfer(end+1)\
  \ = softmaxLayer();\nlayersTransfer(end+1) = classificationLayer();\n```\n\n创建迁移学习的选项。你不需要训练很多轮次（`MaxEpochs`\
  \ 可以比之前更小）。将 `InitialLearnRate` 设置为比训练 `net` 时使用的低率，以通过取更小的步长来提高收敛。\n\n```matlab\n\
  optionsTransfer = trainingOptions('sgdm',...\n    'MaxEpochs',5,...\n    'InitialLearnRate',0.000005,...\n\
  \    'Verbose',true);\n```\n\n执行迁移学习。\n\n```matlab\nconvnetTransfer = trainNetwork(XTrain,TTrain,...\n\
  \                         layersTransfer,optionsTransfer);\n```\n\n| 轮次 (Epoch)\
  \ | 迭代 (Iteration) |  way 时间 (Time Elapsed) | 批量损失 (Mini-batch Loss) | 批量准确率 (Mini-batch\
  \ Accuracy) | 基础学习率 (Base Learning Rate) |\n| :--- | :--- | :--- | :--- | :--- |\
  \ :--- |\n| 5 | 50 | 0.43 | 0.0011 | 100.00% | 0.000005 |\n\n加载字母测试数据。与字母训练数据类似，将测试数据缩放到\
  \ `[0 255]` 之间，因为训练数据在这个范围内。\n\n```matlab\nload lettersTestSet.mat\nXTest = XTest*255;\n\
  ```\n\n测试准确率。\n\n```matlab\nYTest = classify(convnetTransfer,XTest);\naccuracy =\
  \ sum(YTest == TTest)/numel(TTest)\naccuracy = 0.9587\n```\n\n## 11.2 预训练卷积神经网络\n\
  \n训练卷积神经网络（ConvNets）可能是困难且耗费时的。在某些情况下，从一个已经在大型数据集上训练好的卷积网络开始，然后将其适应于当前的问题是有有意义的。你可以将以前训练过的网络用于两个用途：\n\
  \n- **特征提取** — 使用卷积网络从数据（图像）中提取特征，然后使用这些特征来训练不同的分类器，例如支持向量机（SVM）。\n- **迁移学习** —\
  \ 取一个在大型数据集上训练训练的网络，并在较小的数据集上重新训练最后几层。\n\nCaffe 版本的 `AlexNet`（`https://github.com/BVLC/caffe/tree/master/models/bvlc_alexnet`）可以下载并用于你的问题。该网络是在\
  \ ImageNet 数据库的图像子集上训练的，这些图像用于 ImageNet 大规模视觉识别挑战（ILSVRC）。它包含 1000 个类别，每个类别大约有 1000\
  \ 张训练图像。\n\n你可以从“附加功能（Add-Ons）”库安装训练好的网络。在 MATLAB® 桌面版的 **Add-Ons** 下拉菜单中选择 **Get\
  \ Add-Ons**。附加功能文件位于“MathWorks Features”部分。选择用于 AlexNet 网络的**神经网络工具箱模型**。\n\n在下载支持包后，你可以在命令行中输入\
  \ `alexnet` 来访问它。\n\n```matlab\nnet = alexnet\nnet = SeriesNetwork with properties:\n\
  \    Layers: [25×1 nnet.cnn.layer.Layer]\n```\n\n训练好的网络是一个 `SeriesNetwork` 对象。你可以使用点符号法查看架构的细节。\n\
  \n```matlab\nnet.Layers\nans = 25x1 Layer array with layers:\n    1  'data'    \
  \ Image Input               227x227x3 images with 'zerocenter' normalization\n \
  \   2  'conv1'  Convolution      96 11x11x3 convolutions with stride [4 4] and padding\
  \ [0 0]\n    3  'relu1'  ReLU\n    4  'norm1'  BatchNormalization\n    5  'pool1'\
  \  MaxPooling2D      Stride [2 2]\n    6  'conv2'  Convolution      256 5x5x3 convolutions\
  \ with stride [1 1] and padding [2 2]\n    7  'relu2'  ReLU\n    8  'norm2'  BatchNormalization\n\
  \    9  'pool2'  MaxPooling2D      Stride [2 2]\n    10 'conv3'  Convolution   \
  \   384 3x3x3 convolutions with stride [1 1] and padding [1 1]\n    11 'relu3' \
  \ ReLU\n    12 'norm3'  BatchNormalization\n    13 'pool3'  MaxPooling2D      Stride\
  \ [2 2]\n    14 'conv4'  Convolution      256 3x3x3 convolutions with stride [1\
  \ 1] and padding [1 1]\n    15 'relu4'  ReLU\n    16 'norm4'  BatchNormalization\n\
  \    17 'pool4'  MaxPooling2D      Stride [2 2]\n    18 'conv5'  Convolution   \
  \   256 3x3x3 convolutions with stride [1 1] and padding [1 1]\n    19 'relu5' \
  \ ReLU\n    20 'norm5'  BatchNormalization\n    21 'pool5'  MaxPooling2D      Stride\
  \ [2 2]\n    22 'fc6'   FullyConnected      4096\n    23 'relu6'  ReLU\n    24 'fc7'\
  \   FullyConnected      4096\n    25 'relu7'  ReLU\n    26 'fc8'   FullyConnected\
  \      1000\n    27 'softmax' Softmax\n```\n*(注：由于原文中 `net.Layers` 的输出部分在示例中不完整或有差异，此处根据通用逻辑保持了结构，翻译遵循了代码块格式。)*\n\
  \n\n\n\n\n| [generateSimink](http://es.mathworks.com/help/nnet/ref/autoencoder.generatesimulink.html)\
  \ | 为自动编码器生成 Simulink 模型 |\n| [network](http://es.mathworks.com/help/nnet/ref/autoencoder.network.html)\
  \ | 将自动编码器对象转换为网络对象 |\n| [plotWeights](http://es.mathworks.com/help/nnet/ref/autoencoder.plotweights.html)\
  \ | 绘制自动编码器编码器权的可可视化 |\n| [predict](http://es.mathworks.com/help/nnet/ref/autoencoder.predict.html)\
  \ | 使用训练过的自动编码器重构输入 |\n| [stack](http://es.mathworks.com/help/nnet/ref/autoencoder.stack.html)\
  \ | 将多个自动编码器的编码器堆叠在一起\n| [view](http://es.mathworks.com/help/nnet/ref/autoencoder.view.html)\
  \ | 查看自动编码器 |\n\n# 12.2 自动编码器函数\n\n## 12.2.1 函数\n\n| [`trainAutoencoder`](http://es.mathworks.com/help/nnet/ref/trainautoencoder.html)\
  \ | 训练自动编码器 |\n| --- | --- |\n| [`trainSoftmaxLayer`](http://es.mathworks.com/help/nnet/ref/trainsoftmaxlayer.html)\
  \ | 为分类训练一个 softmax 层 |\n| [`decode`](http://es.mathworks.com/help/nnet/ref/autoencoder.decode.html)\
  \ | 解码编码数据 |\n| [`encode`](http://es.mathworks.com/help/nnet/ref/autoencoder.encode.html)\
  \ | 编码输入数据 |\n| [`generateFunction`](http://es.mathworks.com/help/nnet/ref/autoencoder.generatefunction.html)\
  \ | 生成一个运行自动编码器的 MATLAB 函数 |\n| [`generateSimulink`](http://es.mathworks.com/help/nnet/ref/autoencoder.generatesimulink.html)\
  \ | 为自动编码器生成 Simulink 模型 |\n| [`network`](http://es.mathworks.com/help/nnet/ref/autoencoder.network.html)\
  \ | 将自动编码器对象转换为网络对象 |\n| [`plotWeights`](http://es.mathworks.com/help/nnet/ref/autoencoder.plotweights.html)\
  \ | 绘制自动编码器编码器权的可可视化 |\n| [`predict`](http://es.mathworks.com/help/nnet/ref/autoencoder.predict.html)\
  \ | 使用训练过的自动编码器重构输入 |\n| [`stack`](http://es.mathworks.com/help/nnet/ref/autoencoder.stack.html)\
  \ | 将多个自动编码器的编码器堆叠在一起 |\n| [`view`](http://es.mathworks.com/help/nnet/ref/autoencoder.view.html)\
  \ | 查看自动编码器 |\n\n## 12.2.2 trainAutoencoder\n\n训练自动编码器\n\n### 语法\n\n- `autoenc =\
  \ trainAutoencoder(X)`\n- `autoenc = trainAutoencoder(X,hiddenSize)`\n- `autoenc\
  \ = trainAutoencoder(___,Name,Value)`\n\n### 描述\n\n[autoenc](http://es.mathworks.com/help/nnet/ref/trainautoencoder.html#outputarg_autoenc)\
  \ = `trainAutoencoder([X](http://es.mathworks.com/help/nnet/ref/trainautoencoder.html#inputarg_X))`\
  \ 返回一个使用 `X` 中的训练数据训练的自动编码器 `autoenc`。\n\n[autoenc](http://es.mathworks.com/help/nnet/ref/trainautoencoder.html#outputarg_autoenc)\
  \ = `trainAutoencoder([X](http://es.mathworks.com/help/nnet/ref/trainautoencoder.html#inputarg_X),[hiddenSize](http://es.mathworks.com/help/nnet/ref/trainautoencoder.html#inputarg_hiddenSize))`\
  \ 返回一个隐藏表示大小为 `hiddenSize` 的自动编码器 `autoenc`。\n\n[autoenc](http://es.mathworks.com/help/nnet/ref/trainautoencoder.html#outputarg_autoenc)\
  \ = `trainAutoencoder(___,Name,Value](http://es.mathworks.com/help/nnet/ref/trainautoencoder.html#namevaluearguments))`\
  \ 返回一个通过一个或多个 `Name,Value` 参数对指定的额外选项的自动编码器 `autoenc`。例如，你可以指定稀疏比例或最大迭代次数。\n\n###\
  \ 示例。训练稀疏自动编码器\n\n加载数据。\n\n```matlab\nX = abalone_dataset;\n```\n\n`X` 是一个 8x4177\
  \ 的矩阵，定义了 8 个属性（性别、长度、直径、高度、肉质重量等）。关于数据集的更多信息，请在命令行中输入 `help abalone_dataset`。\n\
  \n使用默认设置训练稀疏自动编码器。\n\n```matlab\nautoenc = trainAutoencoder(X);\n```\n\n使用训练过的自动编码器重构鲍鱼数据。\n\
  \n```matlab\nXReconstructed = predict(autoenc,X);\n```\n\n计算均方误差。\n\n```matlab\n\
  mseError = mse(X-XReconstructed)\n```\nmseError = 0.0167\n\n### 使用指定选项训练自动编码器\n\n\
  加载数据。\n\n```matlab\nX = abalone_dataset;\n```\n\n`X` 是一个 8x4177 的矩阵，定义了 8 个属性（性别、长度、直径、高度、肉质重量等）。关于数据集的更多信息，请在命令行中输入\
  \ `help abalone_dataset`。\n\n使用隐藏层大小 4、400 次最大迭代以及解码器的线性传递函数训练稀疏自动编码器。\n\n```matlab\n\
  autoenc = trainAutoencoder(X,4,'MaxEpochs',400,...\n'DecoderTransferFunction','purelin');\n\
  ```\n\n使用训练过的自动编码器重构鲍鱼数据。\n\n```matlab\nXReconstructed = predict(autoenc,X);\n```\n\
  \n计算均方误差。\n\n```matlab\nmseError = mse(X-XReconstructed)\n```\nmseError = 0.0056\n\
  \n### 使用稀疏自动编码器重构观测值\n\n生成训练数据。\n\n```matlab\nrng('twister'); % 为了复现性\nn = 1000;\n\
  r = linspace(-10,10,n);\nx = 1 + r*5e-2 + sin(r)./r + 0.2*randn(n);\n```\n\n使用训练数据训练自动编码器。\n\
  \n```matlab\nhiddenSize = 25;\nautoenc = trainAutoencoder(x',hiddenSize,...\n'EncoderFunction','sat',\n\
  'DecoderFunction','lin,...\n'L2Regularization',0.01,...\n'SparsityRegularization',4,...\n\
  'SparsityProportion',0.1);\n```\n\n生成测试数据。\n\n```matlab\nn = 1000;\nr = linspace(-10,10,n);\n\
  xtest = 1 + r*5e-2 + sin(r)./r + 0.4*randn(n);\n```\n\n使用训练过的自动编码器预测测试数据。\n\n```matlab\n\
  xReconstructed = predict(autoenc,xtest);\n```\n\n绘制实际测试数据和预测值。\n\n```matlab\nfigure;\n\
  plot(xtest,'r');\nhold on\nplot(xReconstructed,'go');\n```\n\n### 使用稀疏自动编码器重构数字图像\n\
  \n加载训练数据。\n\n```matlab\nX = digittrain_dataset;\n```\n\n训练数据是一个 1x5000 的单元格数组，每个单元包含一个表示手写数字的\
  \ 28x28 矩阵。\n\n训练一个包含 25 个神经元的隐藏层的自动编码器。\n\n```matlab\nhiddenSize = 25;\nautoenc\
  \ = trainAutoencoder(X,hiddenSize,...\n'EncoderFunction','sat',\n'DecoderFunction','lin,...\n\
  'L2Regularization',0.004,...\n'SparsityRegularization',4,...\n'SparsityProportion',0.15);\n\
  ```\n\n加载测试数据。\n\n```matlab\nx = digittest_dataset;\n```\n\n测试数据是一个 1x5000 的单元格数组，每个单元包含一个表示手写数字的\
  \ 28x28 矩阵。\n\n使用训练过的自动编码器重构图像数据。\n\n```matlab\nxReconstructed = predict(autoenc,x);\n\
  ```\n\n查看实际测试数据。\n\n```matlab\nfigure;\nfor i = 1:20\n    subplot(4,5,i);\n    imshow(X{i});\n\
  end\n```\n\n查看重构后的测试数据。\n\n```matlab\nfigure;\nfor i = 1:20\n    subplot(4,5,i);\n\
  \    imshow(xReconstructed{i});\nend\n```\n\n## 12.2.3 decode\n\n解码编码数据\n\n### 语法\n\
  \n```matlab\nY = decode(autoenc,Z)\n```\n\n### 描述\n\n[Y](http://es.mathworks.com/help/nnet/ref/autoencoder.decode.html#outputarg_Y)\
  \ = `decode([autoenc](http://es.mathworks.com/help/nnet/ref/autoencoder.decode.html#inputarg_autoenc),[Z](http://es.mathworks.com/help/nnet/ref/autoencoder.decode.html#inputarg_Z))`\
  \ 使用自动编码器对象 `autoenc` 返回解码数据 `Y`。\n\n训练过的自动编码器，由 `trainAutoencoder` 函数返回的 `Autoencoder`\
  \ 类对象。\n\n由 `autoenc` 编码的数据，指定为矩阵。`Z` 的每一列表示一个编码样本（观测值）。\n\n解码数据，以矩阵或图像单元格数组的形式返回。如果自动编码器\
  \ `autoenc` 是在图像单元格数组上训练的，那么 `Y` 也是图像单元格数组。\n\n\n\n\n如果自编码器 `autoenc` 是在矩阵上训练的，那么\
  \ `Y`也是一个矩阵，其中 `Y` 的每一列对应一个样本或观测值。\n\n### 示例：解码新图像的编码\n\n加载训练数据。\n\n```matlab\n\
  X = digitTrainCellArrayData;\n```\n\n`X` 是一个 1-by-5003 的元胞数组，每个单元格包含一个 28-by-28\
  \ 的矩阵，表示手写数字的合成图像。\n\n使用训练数据训练一个隐藏层为 15 的自编码器。\n\n```matlab\nhiddenSize = 15;\n\
  autoenc = trainAutoencoder(X,hiddenSize);\n```\n\n使用自编码器提取新图像的编码数据。\n\n```matlab\n\
  Xnew = digitTestCellArrayData;\nfeatures = encode(autoenc,Xnew);\n```\n\n从自编码器解码编码数据。\n\
  \n```matlab\nY = decode(autoenc,features);\n```\n\n`Y` 是一个 1-by-4997 的元胞数组，每个单元格包含一个\
  \ 28-by-28 的矩阵，表示手写数字的合成图像。\n\n### 12.2.4 encode\n\n#### 输入数据\n\n**语法**\n\n```matlab\n\
  Z = encode(autoenc,Xnew)\n```\n\n**描述**\n\n`Z` = `encode([autoenc],[Xnew])` 使用自编码器\
  \ `autoenc` 返回输入数据 `Xnew` 的编码数据 `Z`。\n\n#### 示例。为新图像编码解码后的数据\n\n加载样本数据。\n\n```matlab\n\
  X = digitTrainCellArrayData;\n```\n\n`X` 是一个 1-by-5003 的元胞数组，每个单元格包含一个 28-by-28\
  \ 的矩阵，表示手写数字的合成图像。\n\n使用训练数据训练一个隐藏层为 50 的自编码器。\n\n```matlab\nautoenc = trainAutoencoder(X,50);\n\
  ```\n\n对新图像数据编码解码后的数据。\n\n```matlab\nXnew = digitTestCellArrayData;\nZ = encode(autoenc,Xnew);\n\
  ```\n\n`Xnew` 是一个 1-by-4997 的元胞数组。`Z` 是一个 50-by-4997 的矩阵，其中每一列代表新数据 `Xnew` 中一个手写数字的图像数据。\n\
  \n### 12.2.5 predict\n\n#### 使用训练的自编码器重构输入\n\n**语法**\n\n·   `Y = predict(autoenc,X)`\n\
  \n**描述**\n\n`Y = predict(autoenc,X)` 使用自编码器 `autoenc` 返回输入数据 `X` 的预测值 `Y`。结果 `Y`\
  \ 是 `X` 的重构。\n\n#### 示例：使用训练的自编码器预测连续测量\n\n加载训练数据。\n\n```matlab\nX = iris_dataset;\n\
  ```\n\n训练数据包含对鸢尾花四个属性的测量值：花萼长度、花萼宽度、花瓣长度、花瓣宽度。\n\n在训练数据上训练自编码器，在编码器中使用正饱和线性传递函数，在解码器中使用线性传递函数。\n\
  \n```matlab\nautoenc = trainAutoencoder(X,'EncoderTransferFunction',...\n'satlin','DecoderTransferFunction','purelin');\n\
  ```\n\n使用训练过的网络 `autoenc` 重构测量值。\n\n```matlab\nxReconstructed = predict(autoenc,X);\n\
  ```\n\n在训练数据集中绘制预测的测量值以及实际值。\n\n```matlab\nfor i = 1:4\nh(i) = subplot(1,4,i);\n\
  plot(X(i,:),'r.');\nhold on\nplot(xReconstructed(i,:),'go');\nhold off;\nend\ntitle(h(1),{'Sepal';'Length'});\n\
  title(h(2),{'Sepal';'Width'});\ntitle(h(3),{'Petal';'Length'});\ntitle(h(4),{'Petal';'Width'});\n\
  ```\n\n![](img/00144.jpeg)\n\n红点代表训练数据，绿色圆圈代表重构的数据。\n\n### 12.2.6 stack\n\n####\
  \ 将多个自编码器的编码器堆叠在一起\n\n**语法**\n\n·   `stackednet = stack(autoenc1,autoenc2,...)`\n\
  ·   `stackednet = stack(autoenc1,autoenc2,...,net1)`\n\n**描述**\n\n`stackednet =\
  \ stack(autoenc1,autoenc2,...)` 通过堆叠自编码器 `autoenc1`、`autoenc2` 等的编码器来创建一个网络对象。\n\
  \n`stackednet = stack(autoenc1,autoenc2,...,net1)` 通过堆叠自编码器 `autoenc1`、`autoenc2`\
  \ 和 `net1` 的编码器来创建一个网络对象。\n\n**提示**\n\n·      其中一个自编码器的尺寸必须与下一个自编码器的输入尺寸匹配。\n·     \
  \ 第一个自编码器的输出是第二个自编码器的输入。\n·      堆叠网络从 `net1` 继承其参数。\n\n#### 示例。创建一个堆叠网络\n\n加载训练数据。\n\
  \n```matlab\nX = iris_dataset;\n```\n\n训练一个隐藏层为 5 且解码器使用线性传递函数的自编码器。设置 L2 正化因子为\
  \ 0.001，稀疏化因子为 4，稀疏比例为 0.05。\n\n```matlab\nhiddenSize = 5;\nautoenc = trainAutoencoder(X,'DecoderTransferFunction','purelin',\n\
  'L2Regularization',0.001,'SparsityRegularization',4,'SparsityProportion',0.05);\n\
  ```\n\n提取隐藏层的特征。\n\n```matlab\nfeatures = encode(autoenc,X);\n```\n\n使用特征训练分类的 softmax\
  \ 层。\n\n```matlab\nsoftnet = trainSoftmaxLayer(features);\n```\n\n将编码器和 softmax\
  \ 层堆叠形成深度网络。\n\n```matlab\nstackednet = stack(autoenc,softnet);\n```\n\n查看堆叠网络。\n\
  \n```matlab\nview(stackednet);\n```\n\n![](img/00145.jpeg)\n\n### 12.2.7 generateFunction\n\
  \n#### 生成用于运行自编码器的 MATLAB 函数\n\n**语法**\n\n·      `generateFunction(autoenc)`\n·     \
  \ `generateFunction(autoenc,pathname)`\n·      `generateFunction(autoenc,pathname,Name,Value)`\n\
  \n**描述**\n\n`generateFunction(autoenc)` 在当前目录生成一个完整的独立函数，用于自编码器 `autoenc` 处理输入数据。\n\
  \n`generateFunction(autoenc,pathname)` 在 `pathname` 指定的位置生成一个完整的独立函数，用于自编码器 `autoenc`\
  \ 处理输入数据。\n\n`generateFunction(autoenc,pathname,Name,Value)` 根据 `Name,Value` 参数指定的附加选项生成一个完整的独立函数。\n\
  \n**提示**\n\n·      如果没有指定路径和文件名，`generateFunction` 默认在名为 `neural_function.m` 的 m\
  \ 文件中创建代码。你可以在 `generateFunction` 生成后更改文件名。或者可以在调用 `generateFunction` 时使用 `pathname`\
  \ 输入参数指定路径和文件名。\n\n**输入参数**\n\n`autoenc`— 训练过的自编码器 Autoencoder 对象\n`pathname`— 生成的函数的字符串位置\n\
  \n**示例：生成运行自编码器的 MATLAB 函数**\n\n加载样本数据。\n\n```matlab\nX = iris_dataset;\n```\n\n\
  训练一个隐藏层具有 4 个神经元的自编码器。\n\n```matlab\nautoenc = trainAutoencoder(X,4);\n```\n\n生成运行自编码器的代码。显示指向\
  \ MATLAB 函数的链接。\n\n```matlab\ngenerateFunction(autoenc)\n```\n\nMATLAB 生成了函数：neural_function.m\n\
  \n\n\n\n查看生成的函数代码：`edit neural_function`\n\n查看函数的用法示例：`help neural_function`\n\n\
  在特定路径下生成自动编码器的代码。\n\n```\ngenerateFunction(autoenc,'H:\\Documents\\Autoencoder')\n\
  ```\n\n生成的 MATLAB 函数：`H:\\Documents\\Autoencoder.m`\n\n查看生成的函数代码：`edit Autoencoder`\n\
  \n查看函数的用法示例：`help Autoencoder`\n\n## 12.2.8 generateSimulink\n\n为自动编码器生成 Simulink\
  \ 模型\n\n### 语法\n\n- `generateSimulink(autoenc)`\n\n### 描述\n\n`generateSimulink(autoenc)`\
  \ 为自动编码器 `autoenc` 创建一个 Simulink® 模型。\n\n### 输入参数\n\n**`autoenc` — 经过训练的自动编码器 `Autoencoder`\
  \ 对象**\n\n### 示例：为自动编码器生成 Simulink 模型\n\n加载训练数据。\n\n```matlab\nX = digitsmall_dataset;\n\
  ```\n\n训练数据是一个 1-by-500 的单元格数组，每个单元格包含一个 28-by-28 的矩阵，代表手写数字的合成图像。\n\n训练一个包含 25\
  \ 个神经元隐藏层的自动编码器。\n\n```matlab\nhiddenSize = 25;\nautoenc = trainAutoencoder(X,hiddenSize,...\
  \ 'L2WeightRegularization',0.004,... 'SparsityRegularization',4,... 'SparsityProportion',0.15);\n\
  ```\n\n为自动编码器 `autoenc` 创建一个 Simulink 模型。\n\n```matlab\ngenerateSimulink(autoenc)\n\
  ```\n\n![](img/00146.gif)\n\n## 12.2.9 plotWeights\n\n绘制自动编码器编码器权重的可视化图\n\n### 语法\n\
  \n- `plotWeights(autoenc)`\n- `h = plotWeights(autoenc)`\n\n### 描述\n\n`plotWeights(autoenc)`\
  \ 将自动编码器 `autoenc` 的权重可视化。\n\n`h = plotWeights(autoenc)` 返回一个函数句柄 `h`，用于自动编码器 `autoenc`\
  \ 编码器权重的可视化。\n\n### 提示\n\n- `plotWeights` 允许对自动编码器学习的特征进行可视化。当自动编码器在图像数据上进行训练时，可以使用它。权重可视化的维度与用于训练的图像维度相同。\n\
  \n### 输入参数\n\n**`autoenc` — 经过训练的自动编码器 `Autoencoder` 对象**\n\n### 输出参数\n\n**`h` —\
  \ 图像对象句柄**\n\n### 示例：可视化学习到的特征\n\n加载训练数据。\n\n```matlab\nX = digitTrainCellArrayData;\n\
  ```\n\n训练数据是一个 1-by-5003 的单元格数组，每个单元格包含一个 28-by-28 的矩阵，代表手写数字的合成图像。\n\n训练一个具有 25\
  \ 个神经元隐藏层的自动编码器。\n\n```matlab\nhiddenSize = 25;\nautoenc = trainAutoencoder(X,hiddenSize,\
  \ ...\n  'L2WeightRegularization',0.004, ...\n  'SparsityRegularization',4, ...\n\
  \  'SparsityProportion',0.2);\n```\n\n可视化学习到的特征。\n\n```matlab\nplotWeights(autoenc);\n\
  ```\n\n![](img/00147.jpeg)\n\n## 12.2.10 view\n\n查看自动编码器\n\n### 语法\n\n- `view(autoenc)`\n\
  \n### 描述\n\n`view(autoenc)` 返回自动编码器 `autoenc` 的结构图。\n\n### 输入参数\n\n**`autoenc` —\
  \ 经过训练的自动编码器 `Autoencoder` 对象**\n\n### 示例：查看自动编码器\n\n加载训练数据。\n\n```matlab\nX = iris_dataset;\n\
  ```\n\n训练一个具有大小 5 的隐藏层且解码器使用线性传递函数的自动编码器。将 L2 权重正则化设置为 0.001，稀疏性正则化设置为 4，稀疏性比例设置为\
  \ 0.05。\n\n```matlab\nhiddenSize = 5;\nautoenc = trainAutoencoder(X, hiddenSize,\
  \ ...\n    'L2WeightRegularization',0.001, ...\n    'SparsityRegularization',4,\
  \ ...\n    'SparsityProportion',0.05, ...\n    'DecoderTransferFunction','purelin');\n\
  ```\n\n查看自动编码器。\n\n```matlab\nview(autoenc)\n```\n\n![Descripción: http://es.mathworks.com/help/examples/nnet/ViewAutoencoderExample_01.png](img/00148.jpeg)\n\
  \n## 12.3 使用自动编码器构建深度网络\n\n加载样本数据。\n\n```matlab\n[X,T] = wine_dataset;\n```\n\n\
  训练一个具有大小为 10 的隐藏层且解码器使用线性传递函数的自动编码器。将 L2 权重正则化设置为 0.001，稀疏性正则化设置为 4，稀疏性比例设置为 0.05。\n\
  \n```matlab\nhiddenSize = 10;\nautoenc = trainAutoEncoder(X,hiddenSize,...\n  'L2WeightRegularization',0.001,...\n\
  \  'SparsityRegularization',4,...\n  'SparsityProportion',0.05,...\n  'DecoderTransferFunction','purelin');\n\
  ```\n\n提取隐藏层中的特征。\n\n```matlab\nfeatures1 = encode(autoenc)\n```\n\n使用这些特征训练第二个自动编码器。不要对数据进行缩放。\n\
  \n```matlab\nhiddenSize = 10;\nautoenc2 = trainAutoEncoder(features1,hiddenSize,...\n\
  \  'L2WeightRegularization',0.001,...\n  'SparsityRegularization',4,...\n  'SparsityProportion',0.05;\n\
  ```\n\n提取隐藏层中的特征。\n\n```matlab\nfeatures2 = encode(autoenc)\n```\n\n使用特征训练一个 softmax\
  \ 层。\n\n```matlab\nsoftnet = trainSoftmax(features2)\n```\n\n将编码器和 softmax 层堆叠形成深度网络。\n\
  \n```matlab\ndeepnet = stack(autoenc,autoenc2,softnet);\n```\n\n在葡萄酒数据上训练深度网络。\n\
  \n```matlab\ndeepnet = train(deepnet,T);\n```\n\n使用深度网络估计葡萄酒类型。\n\n```matlab\nwine_type\
  \ = deepnet(X);\n```\n\n绘制混淆矩阵。\n\n```matlab\nplotconfusion(T,wine_type);\n```\n\
  \n![](img/00149.jpeg)\n\n# 13 自动编码器\n\n## 13.1 使用叠加自动编码器分类\n\n本示例展示了如何使用神经网络自动编码器功能训练一个深度神经网络来对数字进行分类。具有多个隐藏层的神经网络可以解决复杂数据（如图像）的问题。每层可以学习不同层次的特征。然而，训练具有多个隐藏层的神经网络是困难的。\n\
  \n有效训练多层神经网络的方法是每次训练一层。可以通过训练自动编码器来实现。\n\n## 13.1.1 数据集\n\n本示例在训练和测试中始终使用合成数据。合成图像是通过对数字图像应用随机仿变换生成的。\n\
  \n每个数字图像为 28-by-28 像素，共有 5000 个训练示例。你可以加载训练数据并查看某些图像。\n\n```matlab\n% 将训练数据加载到内存\n\
  [xTrainImages,tTrain] = digitTrainCellArrayData;\n\n% 显示一些图像\nclf\nfor i = 1:20\n\
  \    subplot(4,5,i);\n    imshow(xTrainImages{i});\nend\n```\n\n![Descripción: http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample_01.png](img/00150.jpeg)\n\
  \n标签存储在 10-by-5000 的矩阵中，其中每一列中有一个元素为 1，表示该数字所属的类别，列中的所有其他元素均为 0。注意，如果第十个元素为 1，则该数字图像为零。\n\
  \n### 13.1.2 训练第一个自动编码器\n\n首先在训练数据上不使用标签，训练稀疏自动编码器。\n\n自动编码器是一种试图在输出端复制其输入的神经网络。因此，其输入的大小与输出的大小相同。当隐藏层中的神经元数量小于输入大小时，自动编码器会学习输入的压缩表示。\n\
  \n\n\n\n\n神经网络在训练之前的权重是随机初始化的。因此，每次训练的结果都是不同的。为了避免这种行为，请显式地设置随机数生成器种子。\n\n```mat\n\
  rng('default')\n```\n\n设置自动编码器隐藏层的大小。对于你将要训练的自动编码器，将此值设置得比输入大小要好的主意。\n\n```matlab\n\
  hiddenSize1 = 100;\n```\n\n你将训练的自动编码器类型是稀疏自动编码器。这种编码器使用正则化项在第一层学习稀疏表示。你可以通过设置各种参数来控制这些正则化项的影响：\n\
  \n- `L2WeightRegularization` 控制网络权重（而非偏置）的 `L2` 正则化项的影响。该值通常应该很小。\n- `SparsityRegularization`\
  \ 控制稀疏正则化项的影响，该正则化项试图对隐藏层输出的稀疏性实施约束。注意，这与对权重应用稀疏正则化项不同。\n- `SparsityProportion`\
  \ 是稀疏正则化项的参数。它控制隐藏层输出的稀疏程度。`SparsityProportion` 的低值通常会导致隐藏层中的每个神经元通过仅对少数训练示例给出高输出来实现“专门化”。例如，如果\
  \ `SparsityProportion` 设置为 `0.1`，则等于认为隐藏层中的每个神经元在训练示例上的平均输出为 `0.1`。该值必须在 `0` 和 `1`\
  \ 之间。理想值取决于问题的性质。\n\n现在训练自动编码器，并指定上述述正则化项的值。\n\n```matlab\nautoenc1 = trainAutoencoder(xTrainImages,hiddenSize1,\
  \ ...\n    'MaxEpochs',400, ...\n    'L2WeightRegularization',0.004, ...\n    'SparsityRegularization',4,\
  \ ...\n    'SparsityProportion',0.15, ...\n    'ScaleData', false);\n```\n\n你可以查看自动编码器的结构图。自动编码器由一个编码器后随一个解码器组成。编码器将输入映射到隐藏表示，而解码器试图反转这种映射以重建原始输入。\n\
  \n```matlab\nview(autoenc1)\n```\n\n![Descripción: http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample\\\
  _02.png](img/00151.jpeg)\n\n## 13.1.3 可视化第一个自动编码器的权重\n\n自动编码器编码部分学习的映射对于从数据中提取特征有用。编码器中的每个神经元都有相关的权重向量，这些向量将调整为响应特定的视觉特征。你可以查看这些特征的表示。\n\
  \n```matlab\nfigure()\nplotWeights(autoenc1);\n```\n\n![Descripción: http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample\\\
  _03.png](img/00152.jpeg)\n\n你可以看到自动编码器学习的特征代表了数字图像中的弯曲和笔画模式。\n\n隐藏层的 100 维输出是输入的压缩版本，它总结了对上述可视化特征的响应。在从训练数据中提取的一组这些向量上训练下一个自动编码器。首先，你必须使用已训练自动编码器的编码器来生成特征。\n\
  \n```matlab\nfeat1 = encode(autoenc1,xTrainImages);\n```\n\n## 13.1.4 训练第二个自动编码器\n\
  \n训练第一个自动编码器后，你以类似的方式训练第二个自动编码器。主要区别是你使用从第一个自动编码器生成的特征作为第二个自动编码器的训练数据。此外，你将隐藏表示的大小减到\
  \ `50`，以便第二个自动编码器的编码器学习输入数据的更小规模表示。\n\n```matlab\nhiddenSize2 = 50;\nautoenc2 =\
  \ trainAutoencoder(feat1,hiddenSize2, ...\n    'MaxEpochs',100, ...\n    'L2WeightRegularization',0.002,\
  \ ...\n    'SparsityRegularization',4, ...\n    'SparsityProportion',0.1, ...\n\
  \    'ScaleData', false);\n```\n\n再次，你可以使用 `view` 函数查看自动编码器的结构图。\n\n```matlab\n\
  view(autoenc2)\n```\n\n![Descripción: http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample\\\
  _04.png](img/00153.jpeg)\n\n你可以通过将上一组特征通过第二个自动编码器的编码器来提取第二组特征。\n\n```matlab\nfeat2\
  \ = encode(autoenc2,feat1);\n```\n\n训练数据中的原始向量具有 `784` 维。在通过第一个编码器后，维度减少到 `100`\
  \ 维。在使用第二个编码器后，维度再次减少到 `50` 维。你现在可以训练一个最终层来将这些 `50` 维向量分类为不同的数字类。\n\n## 13.1.5 训练最后的\
  \ softmax 层\n\n训练一个 softmax 层来分类这些 `50` 维特征向量。与自动编码器不同，你使用训练数据的标签以有监督的方式训练 softmax\
  \ 层。\n\n```matlab\nsoftnet = trainSoftmaxLayer(feat2,tTrain,'MaxEpochs',400);\n\
  ```\n\n你可以使用 `view` 函数查看 softmax 层的结构图。\n\n```matlab\nview(softnet)\n```\n\n![Descripción:\
  \ http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample\\_05.png](img/00154.jpeg)\n\
  \n## 13.1.6 构建堆叠神经网络\n\n你已经独立地训练了深度神经网络的三个单独组件。到此时，查看你所训练的三个神经网络可能是有用的。它们是 `autoenc1`、`autoenc2`\
  \ 和 `softnet`。\n\n```matlab\nview(autoenc1)\nview(autoenc2)\nview(softnet)\n```\n\
  \n![Descripción: http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample\\\
  _06.png](img/00151.jpeg)\n\n![Descripción: http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample\\\
  _07.png](img/00155.jpeg)\n\n![Descripción: http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample\\\
  _08.png](img/00154.jpeg)\n\n如所述，自动编码器的编码器已用于提取特征。你可以将自动编码器的编码器与 softmax 层堆叠形成一个深度网络。\n\
  \n```matlab\ndeepnet = stack(autoenc1,autoenc2,softnet);\n```\n\n你可以使用 `view` 函数查看堆叠网络的结构图。该网络由自动编码器的编码器和\
  \ softmax 层组成。\n\n```matlab\nview(deepnet)\n```\n\n![Descripción: http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample\\\
  _09.png](img/00156.jpeg)\n\n一旦形成了完整的深度网络，就可以在测试集上计算结果。为了配合堆叠网络使用，你必须将测试图像重塑为矩阵。你可以通过堆叠图像列形成向量，然后由这些向量形成矩阵。\n\
  \n```matlab\n% 获取图像的像素数量\nimageWidth = 28;\nimageHeight = 28;\ninputSize = imageWidth*imageHeight;\n\
  \n% 加载测试图像\n[xTestImages,tTest] = digitCellArrayData;\n\n% 将测试图像转换为向量并放入矩阵\nxTest\
  \ = zeros(inputSize,numel(xTestImages));\nfor i = 1:numel(xTestImages)\n    xTest(:,i)\
  \ = xTestImages{i}(:);\nend\n```\n\n你可以使用混淆矩阵来可视化结果。矩阵右下角的数字提供了整体准确率。\n\n```matlab\n\
  y = deepnet(xTest);\nplotconfusion(tTest,y);\n```\n\n![Descripción: http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample\\\
  _10.png](img/00157.jpeg)\n\n## 13.1.7 微调深度神经网络\n\n通过对整个多层网络进行反向传播可以改进深度神经网络的结果。这个过程通常被称为微调。\n\
  \n你通过在有监督的方式在训练数据上重新训练网络来微调。在此之前，你必须像处理测试图像一样将训练图像重塑为矩阵。\n\n```matlab\n% 执行微调\n\
  deepnet = train(deepnet,xTrain,tTrain);\n```\n\n\n\n\n然后你再次使用混淆矩阵查看结果。\n\n```matlab\n\
  y = deepnet(xTest);\nplotconfusion(tTest,y);\n```\n\n![Descripción: http://www.mathworks.com/help/examples/nnet/AutoencoderDigitsExample_11.png](img/00158.jpeg)\n\
  \n## 13.1.8 总结\n\n本示例展示了如何使用 Neural Network Toolbox™ 训练深度神经网络对图像中的数字进行分类。概述的步骤可以应用于其他类似的问题，例如对字母图像、甚至是特定类别的小图像进行分类。\n\
  \n## 13.2 使用卷积神经网络进行迁移学习\n\n对一个在数字图像上预训练的卷积网络进行微调，以学习字母图像的特征。迁移学习被认为是将知识从一个已学习的任务转移到一个新任务中。在神经网络的语境下，它是将预训练网络的特征转移到新问题上。当存在有足够的训练数据时，在每个情况下从头开始训练卷积网络通常是不有效的。深度学习中此类情况的常见做法是使用在大型数据集上训练过的网络来解决新问题。虽然可以固定预训练网络的初始层，但必须对最后几层进行微调，以学习新数据的特定特征。迁移学习通常比训练一个新的卷积网络训练得更快，因为你不需要估计新网络中的所有参数。\n\
  \n**注意：** 训练卷积网络需要 Parallel Computing Toolbox 以及具有计算能力 3.0 或更高版本的支持 CUDA 的 GPU。\n\
  \n将样本数据加载为 `ImageDatastore`。\n\n```matlab\ndigitDataset = fullfile(matlabroot,'toolbox','nnet','digitDataset');\n\
  digitData = imageastore(digitDataset,'IncludeSubfolders',true,'Label','filenames');\n\
  ```\n\n该数据包含 1000 张数字 0–9 的合成图像。这些图像是通过使用不同的字体对数字图像应用随机变换生成的。每张数字图像均为 28x28 像素。显示数据存储中的一些图像。\n\
  \n```matlab\nfor i = 1:20\n    subplot(4,5,i);\n    imshow(digitData.Files{i});\n\
  end\n```\n\n![Descripción: http://www.mathworks.com/help/examples/nnet/TransferLearningUsingConvolutionalNetworksExample_01.png](img/0159.jpeg)\n\
  \n检查每个数字类别中图像的数量。\n\n```matlab\ndigitData.countEach\nans =\n    Label      Count\n\
  \    ____      ____\n    0          988\n    1          1026\n    2          1003\n\
  \    3          993\n    4          991\n    5          1017\n    6          992\n\
  \    7          999\n    8          1003\n    9          988\n```\n\n数据中每个类别的图像数量不相等。为了平衡训练集中每个数字图像的数量，找到类别中图像的最少数量。\n\
  \n```matlab\nminSetCount = min(digitData.countEach{:,2});\nminSetCount = 988\n```\n\
  \n划分数据集，使得训练集中的每个类别都有 494 张图像，而测试集包含每个标签剩余的图像。\n\n```matlab\ntrainingNumFiles =\
  \ round(minSetCount/2);\nrng(1); % 为了可复现性\n[trainDigitData,testDigitData] = splitEachLabel(digitData,trainingNumFiles,'random');\n\
  ```\n\n`splitEachLabel` 将 `digitData` 中的图像文件划分为两个新的数据存储：`trainDigitData` 和 `testDigitData`。创建卷积神经网络的层。\n\
  \n```matlab\nlayers = [imageInputLayer([28 28 1])\n    convolution2dLayer(5,20)\n\
  \    reluLayer()\n    maxPooling2dLayer(2,'Stride',2)\n    fullyConnectedLayer(10)\n\
  \    softmaxLayer()\n    classificationLayer()];\n```\n\n创建训练选项。将最大轮数（epochs）设置为\
  \ 20，并以 0.001 的初始学习率开始训练。\n\n```matlab\noptions = trainingOptions('sgdm','MaxEpochs',20,...\n\
  \    'InitialLearnRate',0.001);\n```\n\n使用训练集和上一步中定义的选项训练网络。\n\n```matlab\nconvnet\
  \ = trainNetwork(trainDigitData,layers,options);\n```\n\n| 轮数 | 迭代 | 经过时间 (秒) |\
  \ 小批量损失 | 小批量准确率 | 基础学习率 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 2 | 5\
  \ | 0.7 | 0.233 | 92.7% | 0.0100 |\n| 3 | 10 | 1.3 | 0.182 | 99.2% | 0.0100 |\n\
  | 4 | 15 | 2.0 | 0.095 | 99.2% | 0.0100 |\n| 6 | 200 | 2.7 | 0.105 | 99.2% | 0.0100\
  \ |\n| 7 | 250 | 3.3 | 0.026 | 100.0% | 0.0100 |\n| 8 | 300 | 4.0 | 0.004 | 100.0%\
  \ | 0.0100 |\n| 10 | 350 | 4.67 | 0.000 | 100.0% | 0.0100 |\n| 11 | 400 | 5.32 |\
  \ 0.000 | 100.0% | 0.0100 |\n| 12 | 450 | 5.95 | 0.000 | 100.0% | 0.0100 |\n| 14\
  \ | 500 | 6.60 | 0.000 | 100.0% | 0.0100 |\n| 15 | 550 | 7.23 | 0.000 | 100.0% |\
  \ 0.0100 |\n| 16 | 600 | 7.87 | 0.000 | 100.0% | 0.0100 |\n| 18 | 650 | 8.5 | 0.000\
  \ | 100.0% | 0.0100 |\n| 19 | 700 | 9.1 | 0.000 | 100.0% | 0.0100 |\n| 20 | 750\
  \ | 9.7 | 0.000 | 100.0% | 0.0100 |\n\n使用测试集测试网络并计算准确率。\n\n```matlab\nYTest = classify(convnet,testDigitData);\n\
  TTest = testDigitData.Labels;\naccuracy = sum(YTest == TTest)/numel(YTest)\n```\n\
  \n准确率为 0.976。\n\n现在，假设你想使用训练好的网络在新的数据上预测类别。加载字母训练数据。\n\n```matlab\nload lettersSet.mat\n\
  ```\n\n`XTrain` 包含 1500 个 A、B、C 字母的 28x28 灰度图像。`TTrain` 包含标签数组。\n\n`XTrain` 中的像素值范围在\
  \ `[0 1]`。训练 `net` 的数字数据在 `[0 255]`；将字母数据缩放到到 `[0 255]`。\n\n```matlab\nXTrain =\
  \ XTrain*255;\n```\n\n显示一些字母图像。\n\n```matlab\nfigure;\nfor j = 1:20\n    subplot(4,5,j);\n\
  \    selectImage = datasample(XTrain,1,4);\n    imshow(selectImage);\nend\n```\n\
  \n![Descripción: http://www.mathworks.com/help/examples/nnet/TransferLearningUsingConvolutionalNetworksExample_02.png](img/0160.jpeg)\n\
  \n训练好的网络 `net` 的最后三层针对数字数据集进行了调整，该数据集有 10 个类。这些层的属性取决于分类任务。显示全连接层（`fullyConnectedLayer`）。\n\
  \n```matlab\nconvnet.Layers(end-2)\n```\n\nans = \n\nFullyConnectedLayer with properties:\n\
  \  Name: 'fc'\n  Hyperparameters\n    InputSize: 2880\n    OutputSize: 10\n  Learnable\
  \ Parameters\n    Weights: [10×2880 single]\n    Bias: [10×1 single]\n\n使用 `properties`\
  \ 方法查看所有属性列表。显示最后一层（`classificationLayer`）。\n\n```matlab\nconvnet.Layers(end)\n\
  ```\n\nans = \n\nClassificationOutputLayer with properties:\n  Name: 'classoutput'\n\
  \  ClassNames: {10×1 cell}\n  OutputSize: 10\n\n\n\n\n\n# 超参数\n\n`LossFunction:\
  \ 'crossentropyex'`\n\n这三个层必须针对新的分类问题进行微调。从已经训练过的网络 `net` 中提取最后三层以外的所有层。\n\n```matlab\n\
  layersTransfer = convnet.Layers(1:end-3);\n```\n\n字母数据集（letters data set）有三个类别。为三个类别添加一个新的全连接层，并增加该层的学习率。\n\
  \n```matlab\nlayersTransfer(end+1) = fullyConnectedLayer(3,...\n    'WeightLearnRateFactor',10,...\n\
  \    'BiasLearnRateFactor',20);\n```\n\n`WeightLearnRateFactor` 和 `BiasLearnRateFactor`\
  \ 是全连接层全局学习率的倍数。\n\n添加一个 softmax 层和一个分类输出层。\n\n```matlab\nlayersTransfer(end+1)\
  \ = softmaxLayer();\nlayersTransfer(end+1) = classificationLayer();\n```\n\n创建迁移学习的选项。你不需要训练很多轮次（`MaxEpochs`\
  \ 可以比以前小）。将 `InitialLearnRate` 设置为比训练 `net` 时更低的速率，通过采用更小的步长来改进收敛性。\n\n```matlab\n\
  optionsTransfer = trainingOptions('sgdm',...\n    'MaxEpochs',5,...\n    'InitialLearnRate',0.000005,...\n\
  \    'Verbose',true);\n```\n\n执行迁移学习。\n\n```matlab\nconvnetTransfer = trainNetwork(XTrain,TTrain,...\n\
  \    layersTransfer,optionsTransfer);\n```\n\n| 轮次 (Epoch) | 迭代 (Iteration) | 耗时\
  \ (Time Elapsed) | 小批量损失 (Mini-batch Loss) | 小批量准确率 (Mini-batch Accuracy) | 基础学习率\
  \ (Base Learning Rate) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 5 | 50\
  \ | 0.43 | 0.0011 | 100.00% | 0.000005 |\n\n加载字母测试数据。与字母训练数据类似，将测试数据缩放到 `[0 255]`\
  \ 之间，因为训练数据是在这个范围内。\n\n```matlab\nload lettersTestSet.mat\nXTest = XTest*255;\n\
  ```\n\n测试准确率。\n\n```matlab\nYTest = classify(convnetTransfer,XTest);\naccuracy =\
  \ sum(YTest == TTest)/numel(TTest)\naccuracy = 0.9587\n```\n\n"
