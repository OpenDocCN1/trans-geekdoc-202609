  \ with properties:\n    Layers: [7x1 nnet.cnn.layer.Layer]\n```\n\n# 5.4 使用深度学习进行目标检测\n\
  \n本示例展示了如何使用深度学习和 R-CNN（带卷积网络的区域）训练目标检测器。\n\n## 5.4.1 概述\n\n本示例展示了如何训练一个 R-CNN 目标检测器来检测停止标志。R-CNN\
  \ 是一种目标检测框架，它使用卷积神经网络 (CNN) 对图像中的图像区域进行分类。R-CNN 检测器不是使用滑动窗口对每个区域进行分类，而是只处理那些可能包含对象的区域。这极大地减少了运行\
  \ CNN 时的计算成本。\n\n为了说明如何训练 R-CNN 停止标志检测器，本示例遵循了深度学习应用中常用的迁移学习工作流。在迁移学习中，在大规模图像集合（如\
  \ ImageNet）上训练的网络被用作起点，以解决新的分类或检测任务。使用这种方法的优势在于，由于预训练的网络已经学习了丰富的图像特征集，这些特征适用于许多图像。通过微调网络，这种学习可以迁移到新任务。通过对权重进行微小调整来对网络进行微调，使得为原始任务学习到的特征表示被略微调整，以支持新任务。\n\
  \n迁移学习的优势在于减少了训练所需的图像数量和训练时间。为了阐明这些优势，本示例使用了迁移学习工作流来检测停止标志。注意：此示例需要 Computer Vision\
  \ Toolbox、Image Processing Toolbox、Neural Network Toolbox 和 Statistics and Machine\
  \ Learning Toolbox。\n\n## 5.4.2 下载 CIFAR-10 数据\n\n下载 CIFAR-10 数据集。该数据集包含 50,000\
  \ 张用于训练的图像。\n\n```matlab\n% 将 CIFAR-10 下载到临时目录\ncifar10Data = tempdir;\nurl = 'https://www.cs.toronto.edu/~kriz/cifar-10-matlab.tar.gz';\n\
  helperCIFAR10Data.download(url, cifar10Data);\n\n% 加载 CIFAR-10 训练和测试数据\n[trainingImages,\
  \ trainingLabels, testImages, testLabels] = helperCIFAR10Data.load(cifar10Data);\n\
  ```\n\n每个图像都是 32x32 的 RGB 图像，有 50000 个样本。\n\n```matlab\nsize(trainingImages)\nans\
  \ =\n      32          32      50000\n```\n\nCIFAR-10 有 10 个类别。列出图像类别：\n\n```matlab\n\
  numImageCategories = 10;\ncategories(trainingLabels)\nans =\n  10×1 cell array\n\
  \    'airplane'\n    'automobile'\n    'bird'\n    'cat'\n    'deer'\n    'dog'\n\
  \    'frog'\n    'horse'\n    'ship'\n    'truck'\n```\n\n```matlab\n% 显示一些训练图像，并调整大小以显示。\n\
  figure\nthumbnails = trainingImages(:,:,:,1:100);\nthumbnails = imresize(thumbnails,\
  \ [64 64]);\nmontage(thumbnails)\n```\n\n![描述: http://www.mathworks.com/help/examples/vision_product/win64/DeepLearningRCNNObjectDetectionExample_01.png](img/00053.jpeg)\n\
  \n## 5.4.3 创建卷积神经网络 (CNN)\n\nCNN 由一系列层组成，每层定义了一个特定的计算。Neural Network Toolbox 提供了逐层设计\
  \ CNN 的。在本示例中，使用以下层来创建 CNN：\n\n`imageInputLayer` - 图像输入层\n\n`convolutional2dLayer`\
  \ - 用于卷积神经网络的 2D 卷积层\n\n`reluLayer` - 修正线性单元 (ReLU) 层\n\n`maxPooling2dLayer` - 最大池化层\n\
  \n`fullyConnectedLayer` - 全连接层\n\n`softmaxLayer` - Softmax 层\n\n`classificationLayer`\
  \ - 神经网络的分类输出层\n\n\n\n\n\n此处定义的网络与 [4] 中描述的相似，并从 `imageInputLayer` 开始。输入层定义了 CNN\
  \ 可以处理的数据类型和大小。在这个示例中，CNN 被用于处理 CIFAR-10 图像，这些是 32x32 的 RGB 图像：\n\n```matlab\n%\
  \ 为 32x32x3 的 CIFAR-10 图像创建输入层\n[height, width, numChannels, ~] = size(trainingImages);\n\
  imageSize = [height width numChannels];\ninputLayer = imageInputLayer(imageSize)\n\
  inputLayer = \n  ImageInputLayer with properties:\n             Name: ''\n     \
  \ InputSize: [32 32 3]\n  Hyperparameters\n    DataAugmentation: 'none'\n      Normalization:\
  \ 'zerocenter'\n```\n\n接下来定义网络的中间层。中间层由重复的卷积层、ReLU（修正线性单元）层和池化层组成。这 3 层构成了卷积神经网络的核心构建模块。卷积层定义了滤波器权重集，这些权重在网络训练期间会更新。ReLU\
  \ 层为网络引入了非线性，允许网络能够近似将图像像素映射到图像语义内容的非线性函数。池化层在数据流经网络时对其进行下采样。在具有许多层的网络中，应慎用使用池化层，以避免在网络过早对数据进行下采样。\n\
  \n```matlab\n% 卷积层参数\nfilterSize = [5 5];\nnumFilters = 32;\nmiddleLayers = [\n\
  % 第一层卷积层有一组 32 个 5x5x3 的滤波器。\n% 添加了 2 像素的对称填充，以确保图像边缘\n% 被包含在处理中。对于避免边界信息在\n% 网络中过早被冲掉非常重要。\n\
  convolution2dLayer(filterSize, numFilters, 'Padding', 2)\n% 注意滤波器的第三维度可以省略，因为它可以根据\n\
  % 网络连接性自动推断。在这种情况下，由于该层\n% 位于图像层之后，第三维度必须为 3，以匹配输入图像的通道数。\n% 接下来添加 ReLU 层：\nreluLayer()\n\
  % 紧随其后的是最大池化层，其具有 3x3 的空间池化区域\n% 且步长为 2 像素。这将数据维度从\n% 32x32 降采样到 15x15。\nmaxPooling2dLayer(3,\
  \ 'Stride', 2)\n% 重复这 3 个核心层以完成网络中间。\nconvolution2dLayer(filterSize, numFilters,\
  \ 'Padding', 2)\nreluLayer()\nmaxPooling2dLayer(3, 'Stride',2)\nconvolution2dLayer(filterSize,\
  \ 2 * numFilters, 'Padding', 2)\nreluLayer()\nmaxPooling2dLayer(3, 'Stride',2)\n\
  ]\n```\n\n```matlab\nmiddleLayers = \n  9x1 Layer array with layers:\n      1  ''\
  \  Convolution  32 5x5 convolutions with stride [1  1] and padding [2  2]\n    \
  \  2  ''  ReLU          ReLU\n      3  ''  Max Pooling  3x3 max pooling with stride\
  \ [2  2] and padding [0  0]\n      4  ''  Convolution  32 5x5 convolutions with\
  \ stride [1  1] and padding [2  2]\n      5  ''  ReLU          ReLU\n      6  ''\
  \  Max Pooling  3x3 max pooling with stride [2  2] and padding [0  0]\n      7 \
  \ ''  Convolution  64 5x5 convolutions with stride [1  1] and padding [2  2]\n \
  \     8  ''  ReLU          ReLU\n      9  ''  Max Pooling  3x3 max pooling with\
  \ stride [2  2] and padding [0  0]\n```\n\n此处定义的网络与 [4] 中描述的相似，并从 `imageInputLayer`\
  \ 开始。输入层定义了 CNN 可以处理的数据类型和大小。在这个示例中，CNN 被用于处理 CIFAR-10 图像，这些是 32x32 的 RGB 图像：\n\n\
