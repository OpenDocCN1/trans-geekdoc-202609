  \ Toolbox, MATLAB Distributed Computing Server™ |\n\n# 第 7 章：云端深度学习。并行计算\n\n## 7.1\
  \ 深度学习与多个 GPU\n\n你可以使用 MATLAB 通过多个 GPU 进行深度学习。使用多个 GPU 训练单个模型可以提供更大的内存和并行性。这些额外资源允许你使用更大的网络和数据集；对于需要训练数小时或数日的模型，可以为你节省时间。\n\
  \n当你可以使用高性能 GPU 进行训练时，深度学习会更快。如果你没有可用的 GPU，可以使用新的 Amazon EC2 P2 实例进行实验。P2 实例是高规格的多\
  \ GPU 机器。你可以在单 GPU 机器上使用深度学习，随后扩展到每台机器 8 个 GPU 以加速训练，利用并行计算利用所有可用算力来训练大型神经网络。\n\n\
  深度学习利用神经网络直接从数据中学习特征的有用表示。神经网络受到生物神经系统的启发，结合了多个非线性处理层，使用并行的简单元素。深度学习模型在目标分类方面可以达到先进的准确率，有时甚至超过人类水平。你可以使用大型标记数据集和包含许多层（通常包括一些卷积层）的神经网络架构来训练模型。训练这些模型是计算密集型的；你通常可以通过使用高规格\
  \ GPU 来加速训练。\n\n在本章中，我们使用一个名为 AlexNet 的现有网络。AlexNet 是一种深度卷积神经网络 (CNN)，设计用于具有 1000\
  \ 个可能类别的图像分类。MATLAB 有一个内置辅助函数来加载预训练的 AlexNet 网络：\n\n```matlab\n% 加载 AlexNet 网络\n\
  network = alexnet;\n```\n\n如果不存在所需的包，系统将提示你使用 MATLAB 加载程序管理器（Add-on Explorer）安装它。使用\
  \ `Layers` 属性检查此网络的层：\n\n```matlab\nnetwork.Layers\n```\n\n目标是将图像分类到正确的类别中。在本章中，我们使用具有知识共享许可的可用图像创建了自己的图像图像数据集。该数据集包含\
  \ 55 类的 96,000 张彩色图像。这里我们展示了前五类中的五张随机图像。\n\n![](img/00122.gif)\n\n我们将每幅图像调整并裁剪为\
  \ 227x227，以匹配 AlexNet 输入层的大小。\n\n## 7.2 迁移学习\n\n训练像 AlexNet 这样的大型网络需要数百万张图像和数天的计算时间。原始\
  \ AlexNet 在 ImageNet 数据集的子集上训练了数天，该数据集包含 1000 个类别的超过一百万的标记图像。AlexNet 已经学习了针对各种图像的丰富特征表示。为了快速训练\
  \ AlexNet 网络以分类我们的新数据集，我们使用了一种名为迁移学习的技术。为了快速训练 AlexNet 网络以分类我们的新数据集，我们使用了迁移学习。迁移学习利用了在一个数据集上训练时学习的特征对于其他数据集也是用的。迁移学习通常比从头训练网络更快。\n\
  \n以下代码展示了如何使用迁移学习来分类你的数据集。\n\n1. 加载 AlexNet 网络并替换最后几层。\n\n```matlab\n% 加载 AlexNet\
  \ 网络\nnetworkOriginal = alexnet;\nlayersOriginal = networkOriginal.Layers;\n\n%\
  \ 复制除最后三层以外的所有层\nlayersTransfer = layersOriginal(1:end-3);\n\n% 替换全连接层\nlayersTransfer(end+1)\
  \ = fullyConnectedLayer(55,\n    'WeightLearnRate',10,\n    'BiasLearnRate',20);\n\
  \n% 替换 softmax 和分类层\nlayersTransfer(end+1) = softmaxLayer();\nlayersTransfer(end+1)\
  \ = classificationLayer();\n```\n\n2. 创建迁移学习的选项。与从头训练网络相比，你可以设置较低的初始学习率并训练较少的 epoch。\n\
  \n```matlab\n% 定义迁移学习选项\noptionsTransfer = trainingOptions('sgdm',...\n    'MiniBatchSize',250,...\n\
  \    'MaxEpochs',30,...\n    'InitialLearnRate',0.00125,...\n    'LearnRateDropFactor',0.1,...\n\
  \    'LearnRateDropPeriod',20);\n```\n\n3. 向标记图像集提供 `imageastore`，指定保存数据的位置。你可以使用\
  \ `imageastore` 高效访问所有图像文件。`imageastore` 设计用于读取批图像。`imageastore` 用于机器学习和计算机视觉应用中的快速处理。`imageastore`\
  \ 可以导入无法放入内存的图像集合。\n\n```matlab\n% 定义训练数据\ndsTrain = imageastore('imageDataset/train',...\n\
  \    'IncludeSubFolders',true,...\n    'LabelSource','foldern');\n```\n\n数据集图像被分为两个部分：一个用于训练，另一个用于测试。此示例中的训练集位于名为\
  \ `imageDataset/train` 的本地文件夹中。\n\n4. 使用 `trainNetwork` 函数训练网络：\n\n```matlab\nnet\
  \ = trainNetwork(dsTrain,layersTransfer,optionsTransfer);\n```\n\n结果是一个完全训练的网络，可用于分类你的新数据集。\n\
  \n\n\n\n尖端神经网络依赖于日益巨大的训练数据集和网络结构。反之，这需要更多的训练时间和内存资源。为了支持此类网络的训练，MATLAB 提供了使用多个 GPU\
  \ 并行训练单个网络的支持。根据您的网络和数据集，这可以提供以下益处。\n\n## 7.4.1 增加 GPU 内存\n\n卷积神经网络通常使用分批（batches）图像进行迭代训练。这是因为整个数据集体太大，无法放入\
  \ GPU 内存中。最佳批大小取决于具体的网络和数据集，因此您需要进行实验。批大小过大可能导致收敛缓慢，而批大小过小则可能完全无法收敛。通常，批大小由可用 GPU\
  \ 内存决定。对于较大的网络，每张图像的内存需求会增加，最大批大小随之减少。\n\n在使用多个 GPU 进行训练时，每个图像批会分布在各个 GPU 之间。这有效地增加了总可用\
  \ GPU 内存，允许更大的批大小。根据您的应用程序，较大的批大小可以提供更好的收敛性或分类准确率。\n\n## 7.4.2 缩短训练时间\n\n使用多个 GPU\
  \ 可以显著提高性能。在决定是否期望多 GPU 训练带来性能提升时，请考虑以下因素：\n\n- 每个 GPU 上的迭代持续多久？如果每个 GPU 迭代很短，GPU\
  \ 之间的通信开销可能会占据主导。尝试通过使用更大的批大小增加每次迭代的计算量。\n- 您是否使用了超过 8 个 GPU？单台机器上超过 8 个 GPU 之间的通信会引入显著的延迟。\n\
  - 所有 GPU 是否都在同一台机器上？不同机器之间的 GPU 通信会引入显著的通信延迟。\n\n默认情况下，`trainNetwork` 函数使用 GPU（可用），否则使用\
  \ CPU。如果您的本地机器上有多个 GPU，可以在训练选项中将 `'ExecutionEnvironment'` 选项设置为 `'multi-gpu'` 以启用多\
  \ GPU 训练。如上述，您可能还希望增加批大小和学习率以获得更好的收敛性和/或性能。\n\n```matlab\n% Define the multi-gpu\
  \ training options optionsTransfer = trainingOptions('sgdm',...\n    'MiniBatchSize',2000,...\n\
  \    'MaxEpochs',30,...\n    'InitialLearnRate',0.01,...\n    'LearnRateDropFactor',0.1,...\n\
  \    'LearnRateDropPeriod',20,...\n    'ExecutionEnvironment','multi-gpu');\n```\n\
  \n如果您的本地机器上没有多个 GPU，可以使用 Amazon EC2 租用多 GPU 云集群。\n\n## 7.5 扩展到云端深度学习\n\n在单台台式电脑上完成迁移学习后，您现在想要使用高规格的多\
  \ GPU 机器。Amazon 可以根据需求使用其新的 P2 实例提供合适的机器。新的 `Amazon EC2 P2` (https://aws.amazon.com/ec2/instance-types/p2/)\
  \ 实例是专为计算密集型应用设计的机器，提供强大的计算支持。\n\n要在云端使用深度学习，您需要：\n- Amazon EC2\n- Parallel Computing\
  \ Toolbox\n- MATLAB\n- MathWorks Account\n\n## 7.5.1 连接到 Amazon EC2\n\nAmazon Elastic\
  \ Compute (EC2) 是一种允许您在云端租用虚拟服务器的服务。通过使用 EC2，您可以在无需长期承诺的情况下扩展计算能力。Amazon EC2 适用于计算密集型需求。\n\
  \n设置 EC2，请遵循主要步骤：\n1. 使用您的电子邮件地址和密码登录 Cloud Center。\n2. 点击 **Create Cluster**（创建集群）\n\
  3. 命名集群\n4. 选择适当的 **Region**（区域）\n5. 选择 **Machine Type: p2.xlarge, 16 core**\n6.\
  \ 对于 **Number of Workers**（工作节点数量），选择 **8**\n7. 保留其他默认设置并点击 **Create**（创建）\n\n要从\
  \ MATLAB 访问您的集群，在 Home（首页）选项卡中选择 Parallel > Discover Clusters 来搜索您的 Amazon 集群。当您选择集群时，向导会自动将其设置为默认集群。通过创建集群并显示详情来确认您的集群已上线：\n\
  \n```matlab\ncluster = parcluster();\ndisp(cluster);\n```\n\n在您的集群上线后，查询每个工作节点的\
  \ GPU 设备：\n\n```matlab\nwait(cluster)\nspmd\n    disp(gpuDevice())\nend\n```\n\n\
  ## 7.6 使用 GPU 集群进行训练\n\n若要在计算集群上启用训练，请在训练选项中将 `'ExecutionEnvironment'` 选项设置为 `'parallel'`。\n\
  \n```matlab\n% Define the parallel training options optionsTransfer = trainingOptions('sgdm',...\n\
  \    'MiniBatchSize',2000,...\n    'MaxEpochs',30,...\n    'InitialLearnRate',0.01,...\n\
  \    'LearnRateDropFactor',0.1,...\n    'LearnRateDropPeriod',20,...\n    'ExecutionEnvironment','parallel');\n\
  ```\n\n如果没有打开的池（pool），`trainNetwork` 将自动使用默认集群配置打开一个池。如果池具有访问 GPU 的权限，则将使用它们。\n\n\
  \n\n\n在集群上进行训练时，传递给 `imageDatastore` 的位置必须同时在客户端 MATLAB 和工作节点 MATLAB 上存在。出于此原因，我们将数据存储在\
  \ Amazon S3 桶中。S3 路径通过 URL 引用，因此该路径在所有机器上都是可见的。有关在 S3 中使用数据的更多信息，请参阅“在 Amazon S3\
  \ 存储中使用数据”。\n\n# 7.7 在 Amazon S3 存储中使用数据\n\nAmazon Simple Storage Service (S3) 提供了安全且可扩展的云端存储。一旦数据上传到\
  \ Amazon S3，就可以从任何地方访问，使其非常适合将机器学习数据集分发到云集群。我们将存储在本地 `'imageDataset'` 文件夹中的训练图像和测试图像上传到了同名的\
  \ S3 桶中。关于使用 S3 上传和访问数据的***更多信息，可以查阅***Amazon S3 文档。***\n\n默认情况下，存储在 Amazon S3 中的对象是私有的，只有所有者才能访问。要访问或修改这些资源，客户端必须先拥有正确的身份验证令牌。要生成这些令牌，资源所有者可以使用\
  \ AWS 管理控制台创建一个 `Access Key ID` 和相应的 `Secret Access Key`。与其共享令牌的客户端将能够以编程方式访问存储在\
  \ Amazon S3 中的数据。关于生成访问密钥的更多详细信息，可以查阅***Amazon Access Keys 文档。***\n\n以下示例演示了你如何将\
  \ AWS 身份验证令牌配置为环境变量。在你的本地 MATLAB 中输入：\n\n```matlab\n% 在本地客户端 MATLAB 上将 AWS 凭证设置为环境变量\n\
  setenv('AWS_ACCESS_KEY_ID', 'AKIAIOSFODNN7EXAMPLE'); setenv('AWS_SECRET_ACCESS_KEY',\
  \ ... 'wJalrXUtnFEMI/K7MDENG/nPxRiCYEXAMPLEKEY');\n```\n\n现在，要访问训练数据只需创建一个指向 S3\
  \ 桶 URL 的图像数据存储器。\n\n```matlab\n% 定义 Amazon S3 训练数据 imdsTrain = imageDatastore('s3://imageDataset/train',...\n\
  \    'IncludeSubfolders', true, ...\n    'LabelSource', 'foldernames');\n```\n\n\
  要从集群访问 S3 资源，你必须在工作节点上设置相同的环境变量。以下代码在你的云集群上手动打开并行池，并将必要的环境变量复制到工作节点。\n\n```matlab\n\
  % 在所有工作节点上设置 AWS 凭证 aws_access_key_id = getenv('AWS_ACCESS_KEY_ID'); aws_secret_access_key_id\
  \ = getenv('AWS_SECRET_ACCESS_KEY'); spmd     setenv('AWS_ACCESS_KEY_ID',aws_access_key_id);\
  \     setenv('AWS_SECRET_ACCESS_KEY',aws_secret_access_key_id); end\n```\n\n在并行池运行期间，工作节点现在访问\
  \ Amazon S3 资源。\n\n## 7.8 结果\n\n在使用 Mathworks Cloud Center 和 Amazon EC2 租用多 GPU\
  \ 计算集群后，我们现在想调查这带来的性能优势。下面的图显示了网络分类准确率随训练时间的变化情况。分类准确率定义为网络在当前训练迭代的微批图像上达到的准确率。训练重复了四次，每次使用不同数量的\
  \ GPU 并行训练网络。正如***增加 GPU 内存***中所讨论的样，跨多个 GPU 训练允许更大的图像批处理大小。因此，我们根据 GPU 的数量缩放图像批处理大小，以充分利用可用内存。为了归化每个\
  \ epoch 的学习率，我们根据图像批处理大小缩放学习率，因为较大的批处理大小每个 epoch 的迭代更少。\n\n![](img/00124.jpeg)\n\
  \n*不同 GPU 数量的训练收敛情况。*\n\n这些结果表明，更多 GPU 的额外内存和并行性可以提供显著更快的训练。通过平滑数据，我们发现，GPU 数量每增加一倍，达到\
  \ 95% 分类准确率所需的时间减少约 30-40%。与使用单个 GPU 需要 40 分钟以上相比，使用 8 个 GPU 只需约 10 分钟。为了进一步量化结果，我们绘制了平均图像吞吐量以归化不同的批处理大小。这显示出\
  \ GPU 数量每增加一倍，单位时间内处理的图像数量约增加 70%。\n\n![](img/00125.jpeg)\n\n*不同 GPU 数量的图像吞吐量。*\n\
  \n使用一个独立的测试图像数据集，我们测量了网络在未见图像上的分类准确率。使用不同数量 GPU 训练的四个网络都达到了 87% 的准确率，误差在百分之五以内。\n\
  \n要查看使用多 GPU 集群用你自己的数据训练 AlexNet 的脚本，请参见***附录 – MATLAB 代码***。\n\n**注意：** 在云端创建集群和并行池可能需要长达\
  \ 10 分钟。对于本文分析的小问题，这占了总时间的很大比例。对于其他总训练时间可能需要数小时或几天的问题，这种集群启动时间就变得忽略不计了。\n\n## 7.9\
  \ 结论\n\n在本章中，我们展示了如何使用 MATLAB 训练大型深度神经网络。使用 Mathworks Cloud Center 和 Amazon EC2\
  \ 租用多 GPU 计算集群，我们通过在多个 GPU 上分配工作，显著缩短了训练时间。代码提供了一个示例；演示了如何对一组图像进行分类，并测量准确率。对于大型数据集，这种增加可以节省数小时或数几天。\n\
  \n**有用链接：**\n\n有关更多信息，请参阅以下资源：\n\n- `https://www.mathworks.com/discovery/deep-learning.html`\
  \ 深度学习\n- `https://www.mathworks.com/help/nnet/convolutional-networks.html` 神经网络工具\n\
  - `https://www.mathworks.com/products/parallel-computing/parallel-computing-on-cloud`\
  \ 云端并行计算\n- `https://aws.amazon.com/console/`\n\n# 7.10 附录 – MATLAB 代码\n\n以下 MATLAB\
  \ 代码使用迁移学习在集群上训练存储在 S3 中的新图像数据集。要运行此脚本，请使用自己的 Amazon S3 桶并为你的 Amazon 密钥设置环境变量。\n\
  \n```matlab\n% 用于训练的工作节点数量。将此数字设置为集群上的 GPU 数量。如果指定的工作节点多于 GPU，剩余的工作节点将处于空闲。numberOfWorkers\
  \ = 8;\n\n% 根据预期的 GPU 数量缩放批处理大小 miniBatchSize = 250 * numberOfWorkers;\n\n% 根据批处理大小缩放学习率\
  \ learningRate = 0.00125 * numberOfWorkers;\n\n%% 加载 AlexNet 网络 networkOriginal\
  \ = alexnet; layersOriginal = networkOriginal.Layers;\n\n% 复制最后三层以外的所有层 layersTransfer\
  \ = layersOriginal(1:end-3);\n\n% 使用更高的学习率替换全连接层\n% 输出大小应等于数据集中标签的数量。layersTransfer(end+1)\
  \ = fullyConnectedLayer(55,...\n    'WeightLearnRateFactor',10,...\n    'BiasLearnRateFactor',20);\n\
  \n% 替换 softmax 和分类层 layersTransfer(end+1) = softmaxLayer(); layersTransfer(end+1)\
  \ = classificationLayer();\n\n%% 如果尚未打开并行池则启动并行池 pool = gcp('nocreate'); if isempty(pool)\n\
  \    parpool(numberOfWorkers); elseif (pool.NumWorkers ~= numberOfWorkers)\n   \
  \ delete(pool);\n    parpool(numberOfWorkers); end\n\n%% 将本地 AWS 凭证复制到所有工作节点 aws_access_key_id\
  \ = getenv('AWS_ACCESS_KEY_ID'); aws_secret_access_key_id = getenv('AWS_SECRET_ACCESS_KEY');\
  \ spmd     setenv('AWS_ACCESS_KEY_ID',aws_access_key_id);     setenv('AWS_SECRET_ACCESS_KEY',aws_secret_access_key_id);\
  \ end\n```\n\n\n\n\n[content]\n\n```matlab\n%% 加载训练和测试数据\nimds = imageDatastore('s3://imageDataset',...\n\
  \    'IncludeSubfolders',true, ...\n    'LabelSource','foldernames');\n\n%% 打乱数据并分为训练集和测试集\n\
  [imdsTrain,imdsTest] = splitEachLabel(shuffle(imds),0.9);\n\n%% 定义迁移学习训练选项\noptionsTransfer\
  \ = trainingOptions('sgdm',...\n    'MiniBatchSize',miniBatchSize,...\n    'MaxEpochs',30,...\n\
  \    'InitialLearnRate',learningRate,...\n    'LearnRateDropFactor',0.1,...\n  \
  \  'LearnRateDropPeriod',20,...\n    'Verbose',true,...\n    'ExecutionEnvironment','parallel');\n\
  \n%% 在集群上训练网络\nnet = trainNetwork(imdsTrain,layersTransfer,optionsTransfer);\n\n\
  %% 记录该网络的准确率\n% 使用训练好的网络在本地机器上对测试图像进行分类\n% 并与其真实标签进行比较。\nYTest = classify(net,imdsTest);\
  \ \naccuracy = sum(YTest == imdsTest.Labels)/numel(imdsTest.Labels);\n```\n\n# 第\
  \ 8 章：使用 MATLAB 的卷积神经网络。函数\n\n## 8.1 使用卷积神经网络 (CNNs, ConvNets) 进行分类、特征提取和迁移学习\n\n\
  卷积神经网络（CNN 或 ConvNets）是深度学习至关重要的工具，特别适用于图像识别。你可以构建 CNN 架构、训练网络，并使用训练好的网络来预测类别标签。你还可以从预训练网络中提取特征，并使用这些特征来训练线性分类器。Neural\
  \ Network Toolbox 还允许你执行迁移学习；即在新的数据上对现有 CNN 的最后一个全连接层进行重新训练。\n\n## 8.2 构建网络架构。函数\n\
  \nMATLAB 有以下函数：\n\n| 函数 | 描述 |\n| --- | --- |\n| [imageInputLayer](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html)\
  \ | 输入层 |\n| [convolution2dLayer](http://www.mathworks.com/help/nnet/ref/convolution2dlayer.html)\
  \ | 卷积层 |\n| [reluLayer](http://www.mathworks.com/help/nnet/ref/relulayer.html)\
  \ | 线性单元单元 (ReLU) 层 |\n| [crossChannelNormalizationLayer](http://www.mathworks.com/help/nnet/ref/crosschannelnormalizationlayer.html)\
  \ | 通道局部响应归一化层 |\n| [averagePooling2dLayer](http://www.mathworks.com/help/nnet/ref/averagepooling2dlayer.html)\
  \ | 平均池化层对象 |\n| [maxPooling2dLayer](http://www.mathworks.com/help/nnet/ref/maxpooling2dlayer.html)\
  \ | 最大池化层 |\n| [fullyConnectedLayer](http://www.mathworks.com/help/nnet/ref/fullyconnectedlayer.html)\
  \ | 全连接层 |\n| [dropoutLayer](http://www.mathworks.com/help/nnet/ref/dropoutlayer.html)\
  \ | 丢弃层 |\n| [softmaxLayer](http://www.mathworks.com/help/nnet/ref/softmaxlayer.html)\
  \ | Softmax 层 |\n| [classificationLayer](http://www.mathworks.com/help/nnet/ref/classificationlayer.html)\
  \ | 创建分类输出层 |\n\n### 8.2.1 创建图像输入层：imageInputLayer\n\n**语法**\n\n- `inputlayer =\
  \ imageInputLayer(inputSize)`\n- `inputlayer = imageInputLayer(inputSize,Name,Value)`\n\
  \n**描述**\n\n[`inputlayer`](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html#outputarg_inputlayer)\
  \ = `imageInputLayer([inputSize](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html#inputarg_inputSize))`\
  \ 返回一个图像输入层。\n\n[`inputlayer`](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html#outputarg_inputlayer)\
  \ = `imageInputLayer([inputSize](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html#inputarg_inputSize),[Name,Value](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html#namevaluepairarguments))`\
  \ 返回一个图像输入层，由一个或多个 `Name,Value` 名称值对参数指定的额外选项。例如，你可以为该层指定名称。\n\n**示例：创建图像输入层**\n\
  \n为 28x28 的彩色图像创建一个图像输入层。指定软件在训练时以 0.5 的概率从左右翻转图像。\n\n```matlab\ninputlayer = imageInputLayer([28\
  \ 28 3],'DataAugmentation','randfliplr')\n```\n\n`inputlayer` = \n\n`ImageInputLayer`\
  \ 具有以下属性的：\n    `DataAugmentation`: 'randfliplr'\n    `Size`: [28 28 3]\n\n[`inputlayer`](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html#outputarg_inputlayer)\
  \ = `imageInputLayer([inputSize](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html#inputarg_inputSize))`\
  \ 返回一个图像输入层。\n\n[`inputlayer`](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html#outputarg_inputlayer)\
  \ = `imageInputLayer([inputSize](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html#inputarg_inputSize),[Name,Value](http://www.mathworks.com/help/nnet/ref/imageinputlayer.html#namevaluepairarguments))`\
  \ 返回一个图像输入层，由一个或多个 `Name,Value` 名称值对参数指定的额外选项。例如，你可以为该层指定名称。\n\n**参数**\n\n- `inputSize`\
  \ — 输入的大小。包含两个或三个整数的向量。如果 `inputSize` 是两个数字的向量，它表示 [高度,宽度]。\n- `Name,Value` — 可选名称值对。你可以为该层指定名称。\n\
  \n**DataAugmentation** — 指定数据增强技巧的名称值对。例如，`'DataAugmentation', 'randfliplr'` 在训练时以\
  \ 0.5 的概率从左右翻转图像。\n\n**Normalization** — 指定归一化方法的名称值对。例如，`'Normalization', 'zerocenter'`\
  \ 从训练集中减去均值。\n\n**Name** — 指定该层名称的名称值对。 \n\n### 8.2.2 创建 2-D 卷积层：convolution2dLayer\n\
  \n**语法**\n\n- `convlayer = convolution2dLayer(filterSize,numFilters)`\n- `convlayer\
  \ = convolution2dLayer(filterSize,numFilters,Name,Value)`\n\n**描述**\n\n`convlayer\
  \ = convolution2dLayer(filterSize,numFilters)` 返回一个 [二维卷积层](http://www.mathworks.com/help/nnet/ref/convolution2dlayer.html#bu7kxr9-4)。\n\
  \n`convlayer = convolution2dLayer(filterSize,numFilters,Name,Value)` 返回该卷积层，由一个或多个\
  \ `Name,Value` 名称值对参数指定的额外选项。\n\n\n\n\n创建一个包含 96 个滤波器的卷积层，每个滤波器的的高度和宽度均为 11。在水平和垂直方向上的步长（步大小）均为\
  \ 4。\n\n```matlab\nconvlayer = convolution2dLayer(11,96,'Stride',4);\n```\n\n###\
  \ 在卷积层中指定初始权重和偏置\n\n创建一个包含 32 个滤波器的卷积层，每个滤波器的高度和宽度均为 5。沿输入图像边缘进行 2 像素的填充。将偏置的学习率因子设置为\
  \ 2。手动从标准差为 0.0001 的高斯分布中初始化权重。\n\n```matlab\nlayer = convolution2dLayer(5,32,'Padding',2,'BiasLearnRateFactor',2);\n\
  ```\n\n假设输入为彩色图像。手动从标准差为 0.0001 的高斯分布中初始化权重。\n\n```matlab\nlayer.Weights = randn([5\
  \ 5 3 32])*0.0001;\n```\n\n该层中局部区域的大小为 5x5。每个区域的颜色通道数为 3。特征图的数量为 32（滤波器的数量）。因此，层中共有\
  \ 5\\*5\\*3\\*32 个权重。\n\n`randn([5 5 3 32])` 返回一个均值为 0、标准差为 1 的高斯分布的 5x5x3x32 数组。将这些值乘以\
  \ 0.0001 可将高斯分布的标准差设置为 0.0001。\n\n同样，从均值为 1、标准差为 0.00001 的高斯分布中初始化偏置。\n\n```matlab\n\
  layer.Bias = randn([1 1 32])*0.00001+1;\n```\n\n有 32 个特征图，因此有 32 个偏置。`randn([1 1\
  \ 32])` 返回一个均值为 0、标准差为 1 的高斯分布的 1x1x32 数组。将这些值乘以 0.00001 将值的标准差设置为 0.00001，加 1 则将高斯分布的均值设置为\
  \ 1。\n\n### 完全覆盖输入图像的卷积\n\n假设输入图像的大小为 28x28x1。创建一个包含 16 个滤波器的卷积层，高度为 6，宽度为 4，在水平和垂直方向上以步长\
  \ 4 遍历图像。确保卷积完全覆盖图像。\n\n为了使卷积完全覆盖输入图像，水平和垂直输出维度必须是整数。为了使水平输出维度为整数，需要在图像的顶部和底部各进行\
  \ 1 行零填充：(28 – 6+ 2\\*1)/4 + 1 = 7。为了使垂直输出维度为整数，则不需要零填充：(28 – 4+ 2\\*0)/4 + 1 =\
  \ 7。构建卷积层如下：\n\n```matlab\nconvlayer = convolution2dLayer([6 4],16,'Stride',4,'Padding',[1\
  \ 0]);\n```\n\n### 输入参数\n\n#### `filterSize` — 滤波器的高度和宽度整数值 | 两个整数值的向量\n\n滤波器的高度和宽度，指定为整数值或两个整数值组成的向量。`filterSize`\
  \ 定义了神经元连接到输入中局部区域的大小。\n\n* 如果 `filterSize` 是标量值，则滤波器具有相同的高度和宽度。\n* 如果 `filterSize`\
  \ 是向量，则其形式必须为 `[h w]`，其中 `h` 是高度，`w` 是宽度。\n\n**示例：** `[5,5]`\n\n**数据类型：** `single`\
  \ | `double`\n\n#### `numFilters` — 滤波器数量整数值\n\n滤波器的数量，指定为整数值。`numFilters` 代表卷积层中连接到输入中相同区域的神经元数量。此参数决定了卷积层输出中通道（特征图）的数量。\n\
  \n**数据类型：** `single` | `double`\n\n### 输出参数\n\n#### `convlayer` — 2D 卷积层 Convolution2DLayer\
  \ 对象\n\n用于卷积神经网络的 2D 卷积层，作为 `Convolution2DLayer` 对象返回。\n\n#### 卷积层\n\n卷积层由连接到输入或上一层小区域的神经元组成。这些区域被称为*过滤器*。你可以使用\
  \ `filterSize` 输入参数指定这些区域的大小。\n\n对于每个区域，软件会计算权重与输入的点积，然后加上一个偏置项。\n\n（注：关于特定层大小计算和逻辑的剩余技术文本在源中似乎是重复或混乱的；已根据指令保留了核心结构信息。）\n\
  \n\n\n\n\n`localnormlayer = crossChannelNormalizationLayer('windowChannelSize',\
  \ 'Name,Value')` 返回一个局部归一化层，可以通过一个或多个 `Name,Value` 对参数指定额外的选项。\n\n### 示例\n\n创建一个用于通道归一化的局部归一化层，其中使用五个通道的窗口来归一化每个元素，归一化器的加性常数（`K`）为\
  \ 1。\n\n```matlab\nlocalnormlayer = crossChannelNormalizationLayer(5,'K',1);\n```\n\
  \n8.2.5 创建平均池化层：averagePooling2dLayer\n\n### 语法\n\n* `avgpoollayer = averagePooling2dLayer(poolSize)`\n\
  * `avgpoollayer = averagePooling2dLayer(poolSize,Name,Value)`\n\n### 描述\n\n`avgpoollayer\
  \ = averagePooling2dLayer(poolSize)` 返回执行[平均池化](http://www.mathworks.com/help/nnet/ref/averagepooling2dlayer.html#bu7kwr9-2)的层，将输入划分为矩形区域并计算每个区域的平均值。`poolSize`\
  \ 指定矩形区域的维度。\n\n`avgpoollayer = averagePooling2dLayer(poolSize,Name,Value)` 返回平均池化层，可以通过一个或多个\
  \ `Name,Value` 对参数指定额外的选项。\n\n### 示例\n\n#### 使用非重叠池化区域的平均池化层\n\n创建一个具有非重叠池化区域的平均池化层，其下采样因子为\
  \ 2。\n\n```matlab\navgpoollayer = averagePooling2dLayer(2,'Stride',2);\n```\n\n\
  矩形区域（池化大小）的高度和宽度均为 2。该层创建大小为 `[2,2]` 的池化区域，并取每个区域中四个元素的平均值。由于步长（沿图像垂直和水平方向移动的步长）也是`[2,2]`，因此池化区域不重叠。\n\
  \n#### 使用重叠池化区域的平均池化层\n\n创建一个具有重叠池化区域的平均池化层。同时对输入的顶部和底部添加填充。\n\n```matlab\navgpoollayer\
  \ = averagePooling2dLayer([3,2],'Stride',2,'Padding',[1 0]);\n```\n\n矩形区域（池化大小）的高度和宽度分别为\
  \ 3 和 2。该层创建大小为 `[3,2]` 的池化区域，并取每个区域中六个元素的平均值。由于步长为`[2,2]`，池化区域会重叠。\n\n`Padding`\
  \ 名称-值对的值`1` 表示软件也会在输入数据的顶部和底部添加一行零。`0` 表示不向输入数据的左右侧添加填充。\n\n8.2.6 创建最大池化层：maxPooling2dLayer\n\
  \n### 语法\n\n* `maxpoollayer = maxPooling2dLayer(poolSize)`\n* `maxpoollayer = maxPooling2dLayer(poolSize,Name,Value)`\n\
  \n### 描述\n\n\n\n[maxpoollayer](http://www.mathworks.com/help/nnet/ref/maxpooling2dlayer.html#outputarg_maxpoollayer)\
  \ = `maxPooling2dLayer([poolSize](http://www.mathworks.com/help/nnet/ref/maxpooling2dlayer.html#inputarg_poolSize))`\
  \ 返回一个执行[最大池化](http://www.mathworks.com/help/nnet/ref/maxpooling2dlayer.html#bu7kv4s-2)的层，将输入划分为矩形区域并返回每个区域的最大值。`poolSize`\
  \ 指定池化区域的维度。\n\n[maxpoollayer](http://www.mathworks.com/help/nnet/ref/maxpooling2dlayer.html#outputarg_maxpoollayer)\
  \ = `maxPooling2dLayer([poolSize](http://www.mathworks.com/help/nnet/ref/maxpooling2dlayer.html#inputarg_poolSize),[Name,Value](http://www.mathworks.com/help/nnet/ref/maxpooling2dlayer.html#namevaluepairarguments))`\
  \ 返回最大池化层，可以通过一个或多个 `Name,Value` 对参数指定额外的选项。\n\n### 示例\n\n#### 使用非重叠池化区域的最大池化层\n\
  \n创建一个具有非重叠池化区域的最大池化层，其下采样因子为 2。\n\n```matlab\nmaxpoollayer = maxPooling2dLayer(2,'Stride',2);\n\
  ```\n\n矩形区域（池化大小）的高度和宽度均为 2。该层创建大小为 `[2,2]` 的池化区域，并返回每个区域中四个元素的最大值。由于步长（沿图像垂直和水平方向移动的步长）也是`[2,2]`，池化区域不重叠。\n\
  \n#### 使用重叠池化区域的最大池化层\n\n创建一个具有重叠池化区域的最大池化层。同时对输入的顶部和底部添加填充。\n\n```matlab\nmaxpoollayer\
  \ = maxPooling2dLayer([3,2],'Stride',2,'Padding',[1 0]);\n```\n\n矩形区域（池化大小）的高度和宽度分别为\
  \ 3 和 2。该层创建大小为 `[3,2]` 的池化区域，并取每个区域中六个元素的平均值。由于步长为`[2,2]`，池化区域会重叠。\n\n`Padding`\
  \ 名称-值对的值`1` 表示软件也会在输入数据的顶部和底部添加一行零。`0` 表示不向输入数据的左右侧添加填充。\n\n8.2.7 创建全连接层：fullyConnectedLayer\n\
  \n### 语法\n\n* `fullconnectlayer = fullyConnectedLayer(outputSize)`\n* `fullconnectlayer\
  \ = fullyConnectedLayer(outputSize,Name,Value)`\n\n### 描述\n\n[fullconnectlayer](http://www.mathworks.com/help/nnet/ref/fullyconnectedlayer.html#outputarg_fullconnectlayer)\
  \ = `fullyConnectedLayer([outputSize](http://www.mathworks.com/help/nnet/ref/fullyconnectedlayer.html#inputarg_outputSize))`\
  \ 返回一个全连接层，其中软件将输入乘以权重并加上偏置。\n\n[fullconnectlayer](http://www.mathworks.com/help/nnet/ref/fullyconnectedlayer.html#outputarg_fullconnectlayer)\
  \ = `fullyConnectedLayer([outputSize](http://www.mathworks.com/help/nnet/ref/fullyconnectedlayer.html#inputarg_outputSize),[Name,Value](http://www.mathworks.com/help/nnet/ref/fullyconnectedlayer.html#namevaluepairarguments))`\
  \ 返回全连接层，可以通过一个或多个 `Name,Value` 对参数指定额外的选项。\n\n### 示例\n\n#### 创建全连接层\n\n创建一个输出大小为\
  \ 10 的全连接层。\n\n```matlab\nfullconnectlayer = fullyConnectedLayer(10);\n```\n\n####\
  \ 在全连接层中指定初始权重和偏置\n\n创建一个输出大小为 10 的全连接层。设置偏置的学习速率为 2。\n\n```matlab\nlayers = [imageInputLayer([28\
  \ 28 1],'Normalization','none');\nconvolution2dLayer(5,20,'NumChannels',1);\nreluLayer();\n\
  maxPooling2dLayer(2,'Stride',2);\nfullyConnectedLayer(10);\nsoftmaxLayer();\nclassificationLayer()];\n\
  ```\n\n要初始化`fully-connected`层的权重，必须知道该层的输入大小。输入大小等于前一个最大池化层的输出大小，而该大小取决于卷积层的输出大小。\n\
  \n对于卷积层中通道（特征图）的一个方向，输出为((28 – 5 + 2*0)/1) +1 = 24。最大池化层是非重叠区域，因此在每个方向上下采样 2 倍，即\
  \ 24/2 = 12。对于卷积层的一个通道，最大池化层的输出为 12 * 12 = 144。卷积层有 20 个通道，因此最大池化层的输出为 144 * 20\
  \ = 2880。这就是全连接层的输入大小。\n\n重叠区域的公式给出了相同的结果：对于一个方向，输出为(((24 – 2 +0)/2) + 1 = 12。对于一个通道，输出为\
  \ 144，对于卷积层中的所有 20 个通道，最大池化层的输出为 2880。\n\n使用均值为 0、标准差为 0.0001 的高斯分布初始化`fully-connected`层的权重。\n\
  \n```matlab\nlayers(5).Weights = randn([10 2880])*0.0001;\n```\n\n\n\n\n\n`randn([10\
  \ 2880])` 返回一个 10x2880 的矩阵，其值来自均值为 0、标准差为 1 的高斯分布。将这些值乘以 0.0001 可以将高斯分布的标准差设置为 0.0001。\n\
  \n同样，从均值为 1、标准差为 0.0001 的高斯分布初始化偏置。\n\n```\nlayers(5).Bias = randn([10 1])*0.0001+1;\n\
  ```\n\n偏置向量的大小等于全连接层的输出大小，即 10。`randn([10 1])` 返回一个 10x1 的向量，其值来自均值为 0、标准差为 1 的高斯分布。将这些值乘以\
  \ 0.00001 将值的标准差设置为 0.00001，加 1 将高斯分布的均值设置为 1。\n\n## 8.2.8 创建丢弃层：dropoutLayer\n\n\
  ### 语法\n- `droplayer = dropoutLayer()`\n- `droplayer = dropoutLayer(probability)`\n\
  - `droplayer = dropoutLayer(_,Name,Value)`\n\n### 描述\n`droplayer = dropoutLayer()`\
  \ 返回一个丢弃层，该层以 0.5 的概率随机将输入元素设置为零。丢弃层仅在训练时起。\n\n`droplayer = dropoutLayer(probability)`\
  \ 返回一个丢弃层，该层以`probability`指定的概率随机将输入元素设置为零。\n\n`droplayer = dropoutLayer([Name,Value])`\
  \ 返回丢弃层，通过 `Name,Value` 键值对指定额外的选项。\n\n### 示例\n创建一个丢弃层，其随机将约 40% 的输入设置为零。将该层命名为\
  \ `dropout1`。\n\n```\ndroplayer = dropoutLayer(0.4,'Name','dropout1');\n```\n\n\
  ## 8.2.9 创建 softmax 层：softmaxLayer\n\n### 语法\n- `smlayer = softmaxLayer()`\n- `smlayer\
  \ = softmaxLayer(Name,Value)`\n\n### 描述\n`smlayer = softmaxLayer()` 返回一个用于分类问题的\
  \ softmax 层。该层使用 softmax 激活函数。\n\n`smlayer = softmaxLayer([Name,Value])` 返回 softmax\
  \ 层，通过 `Name,Value` 键值对指定额外的选项。\n\n### 示例\n**使用指定名称创建 Softmax 层**\n创建一个名为 `sml1`\
  \ 的 softmax 层。\n\n```\nsmlayer = softmaxLayer('Name','sml1');\n```\n\n## 8.2.10\
  \ 创建分类输出层：classificationLayer\n\n### 语法\n- `coutputlayer = classificationLayer()`\n\
  - `coutputlayer = classificationLayer(Name,Value)`\n\n### 描述\n`coutputlayer = classificationLayer()`\
  \ 返回一个用于神经网络的分类输出层。该分类输出层存储了软件用于多类分类训练的损失函数名称、输出大小以及类别标签。\n\n`coutputlayer = classificationLayer(Name,Value)`\
  \ 返回分类输出层，通过 `Name,Value` 键值对指定额外的选项。\n\n### 示例\n创建一个名为 `'coutput'` 的分类输出层。\n\n\
  ```\ncoutputlayer = classificationLayer('Name','coutput')\n```\n`coutputlayer` ClassificationOutputLayer\
  \ 的属性如下：\nOutputSize: 'auto'\nLossFunction: 'crossentropyex'\nClassNames: {}\nName:\
  \ 'coutput' \n\n软件在训练期间自动确定输出层。用于 *k* 个互斥类别的分类默认损失函数是交叉熵。\n\n## 8.3 TRAIN NETWORKS.\
  \ FUNCTIONS\n\nMATLAB 具有以下函数：\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `trainingOptions`\
  \ | 神经网络训练的选项 |\n| `trainNetwork` | 训练网络 |\n\n## 8.3.1 训练网络：trainNetwork\n\n###\
  \ 语法\n- `trainedNet = trainNetwork(imds,layers,options)`\n- `trainedNet = trainNetwork(X,Y,layers,options)`\n\
  - `[trainedNet,info] = trainNetwork(...)`\n\n### 描述\n`trainedNet = trainNetwork(imds,layers,options)`\
  \ 返回一个由输入数据 `imds` 的 `layers` 架构定义的已训练网络。\n\n`trainedNet = trainNetwork(X,Y,layers,options)`\
  \ 返回一个针对 `X` 和 `Y` 的已训练网络。\n\n**注意：** `trainNetwork` 需要 Parallel Computing Toolbox\
  \ 以及具有 3.0 或更高能力的 CUDA 启用 GPU。\n\n### 示例\n**使用数据存储器训练卷积网络**\n将示例数据加载为数据存储。\n```matlab\n\
  digitPath = fullfile(root,'nnet','Dataset');\ndigitData = datastore(digitPath,'Includefolders',true);\n\
  ```\n显示数据存储中的某些图像。\n```matlab\nfor i = 1:20\n    subplot(4,5,i)\n    imshow(digitData.Files{i})\n\
  end\n```\n检查每个类别的图像数量。\n```matlab\nans = digitData.countLabel\n```\n数据中每个类别的图像数量不相等。为了平衡训练集中每个数字的图像数量，首先找到类别中的最小图像数量。\n\
  ```matlab\nminSetCount = min(digitData.countLabel{:})\n```\n划分数据集，使得训练集中的每个类别都有\
  \ 494 张图像，而测试集包含每个标签剩余的图像。\n```matlab\ntrainingFiles = round(minSetCount/2);\nrng(1)\
  \ % 为了可复现性\n[trainData,testData] = splitEachLabel(digitData,trainingFiles,'randomize');\n\
  ``` \n`splitEachLabel` 将 `digitData` 中的图像文件划分为新的数据存储器 `trainData` 和 `testData`。\n\
  \n定义卷积网络架构。\n```matlab\nlayers = [imageInputLayer([28 28 1]);\n    convolution2dLayer(5,20);\n\
  \    reluLayer();\n    maxPooling2dLayer(2,'Stride',2);\n    fullyConnectedLayer(10);\n\
  \    softmaxLayer();\n    classificationLayer()];\n```\n将选项设置为带随机梯度下降的默认设置。设置最大迭代轮数为\
  \ 20，并以 0.001 的初始学习率开始训练。\n```matlab\noptions = trainingOptions('sgdm','MaxEpochs',20,'InitialLearnRate',0.001);\n\
  ```\n训练网络。\n\n\n\n\n\n```matlab\nconvnet = trainNetwork(trainDigitData,layers,options);\n\
  ```\n|=========================================================================================|\n\
  | 轮 (Epoch) | 迭代 (Iteration) | 已用时间 (秒) | 小批量损失 (Mini-batch Loss) | 小批量准确率 (Mini-batch\
  \ Accuracy) | 基础学习率 (Base Learning Rate) |\n|---|---|---|---|---|---|\n| 2 | 50\
  \ | 0.72 | 0.2232 | 92.97% | 0.001000 |\n| 3 | 100 | 1.37 | 0.0182 | 99.22% | 0.001000\
  \ |\n| 4 | 150 | 1.99 | 0.0141 | 100.00% | 0.001000 |\n| 6 | 200 | 2.64 | 0.0023\
  \ | 100.00% | 0.001000 |\n| 7 | 250 | 3.27 | 0.0004 | 100.00% | 0.001000 |\n| 8\
  \ | 300 | 3.91 | 0.0001 | 100.00% | 0.001000 |\n| 10 | 350 | 4.56 | 0.0002 | 100.00%\
  \ | 0.001000 |\n| 11 | 400 | 5.19 | 0.0003 | 100.00% | 0.001000 |\n| 12 | 450 |\
  \ 5.82 | 0.0001 | 100.00% | 0.001000 |\n| 14 | 500 | 6.46 | 0.0001 | 100.00% | 0.001000\
  \ |\n| 15 | 550 | 7.09 | 0.0001 | 100.00% | 0.001000 |\n| 16 | 600 | 7.72 | 0.0001\
  \ | 100.00% | 0.001000 |\n| 18 | 650 | 8.37 | 0.0001 | 100.00% | 0.001000 |\n| 19\
  \ | 700 | 9.00 | 0.0001 | 100.00% | 0.001000 |\n| 20 | 750 | 9.62 | 0.0001 | 100.00%\
  \ | 0.001000 |\n|================================================================================|\n\
  \n在未用于训练网络的测试集上运行训练好的网络，并预测图像标签（数字）。\n\n```matlab\nYTest = classify(convnet,testDigitData);\n\
  TTest = testDigitData.Labels;\n```\n\n计算准确率。\n\n```matlab\naccuracy = sum(YTest\
  \ == TTest)/numel(TTest)\n```\n`0.9984`\n\n准确率是测试数据中与 `classify` 分类结果相匹配的真实标签数量，与测试数据中图像总数之比。在本例中，99.8%\
  \ 的数字估计与真实值匹配。\n\n## 构建并训练卷积网络\n\n加载样本数据。\n\n```matlab\nload lettersSet\n```\n\n\
  `XTrain` 包含 1500 张 28x28 的灰度字母 A、B 和 C 图像，存储在 4D 数组中。数据集中每个字母的数量相等的。`TTrain` 包含字母标签的分类数组。\n\
  \n显示一些字母图像。\n\n```matlab\nfigure;\nfor j = 1:20\n    subplot(4,5,j);\n    selectImage\
  \ = datasample(XTrain,1,4);\n    imshow(selectImage,[]);\nend\n```\n![](img/00128.jpeg)\n\
  \n定义卷积神经网络架构。\n\n```matlab\nlayers = [imageInputLayer([28 28 1]);\n          convolution2dLayer(5,16);\n\
  \          reluLayer();\n          maxPooling2dLayer(2,'Stride',2);\n          fullyConnectedLayer(3);\n\
  \          softmaxLayer();\n          classificationLayer()];\n```\n\n将选项设置为带动量的随机梯度下降的默认设置。\n\
  \n```matlab\noptions = trainingOptions('sgdm');\n```\n\n训练网络。\n\n```matlab\nnet\
  \ = trainNetwork(XTrain,TTrain,layers,options);\n```\n\n\n\n\n`digitTrain4ArrayData`\
  \ 将数字训练集加载为 4-D 数组数据。`XTrain` 是一个 28x28x1x4940 的数组，其中 28 是图像的高度，28 是宽度。1 是通道数， 4940\
  \ 是手写数字合成图像的数量。`TTrain` 是一个包含每个观测值标签的分类向量。\n\n构建卷积神经网络架构。\n\n```matlab\nlayers =\
  \ [imageInputLayer([28 28 1]);\n          convolution2dLayer(5,20);\n          reluLayer();\n\
  \          maxPooling2dLayer(2,'Stride',2);\n          fullyConnectedLayer(10);\n\
  \          softmaxLayer();\n          classificationLayer()];\n```\n\n将选项设置为用于带动量的随机梯度下降的默认设置。\n\
  \n```matlab\noptions = trainingOptions('sgdm');\n```\n\n训练网络。\n\n```matlab\nrng('default')\n\
  net = trainNetwork(XTrain,TTrain,layers,options);\n```\n\n| 轮次 (Epoch) | 迭代 (Iteration)\
  \ | 经过时间 (秒) | 批量损失 (Mini-batch Loss) | 批量准确率 (Mini-batch Accuracy) | 基础学习率 (Base\
  \ Learning Rate) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 2 | 50 | 0.45\
  \ | 2.2301 | 47.66% | 0.010000 |\n| 3 | 100 | 0.88 | 0.9880 | 75.00% | 0.010000\
  \ |\n| 4 | 150 | 1.31 | 0.5558 | 82.03% | 0.010000 |\n| 6 | 200 | 1.75 | 0.4022\
  \ | 89.06% | 0.010000 |\n| 7 | 250 | 2.17 | 0.3750 | 88.28% | 0.010000 |\n| 8 |\
  \ 300 | 2.61 | 0.3368 | 91.41% | 0.010000 |\n| 10 | 350 | 3.04 | 0.2589 | 96.09%\
  \ | 0.010000 |\n| 11 | 400 | 3.47 | 0.1396 | 98.4% | 0.010000 |\n| 12 | 450 | 3.90\
  \ | 0.1802 | 96.09% | 0.010000 |\n| 14 | 500 | 4.33 | 0.0892 | 99.22% | 0.010000\
  \ |\n| 15 | 550 | 4.76 | 0.1221 | 96.88% | 0.010000 |\n| 16 | 600 | 5.19 | 0.0961\
  \ | 98.44% | 0.010000 |\n| 18 | 650 | 5.62 | 0.0856 | 99.22% | 0.010000 |\n| 19\
  \ | 700 | 6.05 | 0.0651 | 100.00% | 0.010000 |\n| 20 | 750 | 6.49 | 0.0582 | 98.4%\
  \ | 0.010000 |\n| 22 | 800 | 6.92 | 0.0808 | 98.44% | 0.010000 |\n| 23 | 850 | 7.35\
  \ | 0.0521 | 99.22% | 0.010000 |\n| 24 | 900 | 7.77 | 0.0248 | 100.00% | 0.010000\
  \ |\n| 25 | 950 | 8.20 | 0.0241 | 100.00% | 0.010000 |\n| 27 | 1000 | 8.63 | 0.0253\
  \ | 100.00% | 0.010000 |\n| 28 | 1050 | 9.07 | 0.0260 | 100.00% | 0.010000 |\n|\
  \ 29 | 1100 | 9.49 | 0.0246 | 100.00% | 0.010000 |\n\n### 提取特征\n\n进行预测，但不是获取最后一层的输出，而是指定第二个\
  \ ReLU 层作为输出层。\n\n```matlab\ntrainFeatures = activations(net,XTrain,6);\n```\n\n\
  这些来自内部层的预测被称为 `activations` 或 `features`。`activations` 方法默认使用计算能力为 3.0 的 CUDA 支持\
  \ GPU。你也可以使用 `'ExecutionEnvironment','cpu'` 名称值对在 CPU 上运行 `activations`。你可以使用返回的特征使用\
  \ Statistics and Learning Toolbox 函数 [`fitcoc`](https://www.mathworks.com/help/stats/fitcoc.html)\
  \ 训练支持机。\n\n```matlab\nsvm = fitcoc(trainFeatures,TTrain);\n```\n\n加载测试数据。\n\n```matlab\n\
  [XTest,TTest] = digitTest4DArray;\n```\n\n从用于测试数据的同一个 ReLU 层（第六层）提取特征，并使用返回的特征训练支持机。\n\
  \n```matlab\ntestFeatures = activations(net,XTest,6);\ntestPredictions = predict(svm,testFeatures);\n\
  ```\n\n绘制混淆矩阵。`plotconfusion` 接受这种格式。\n\n```matlab\nttest = double(TTest)';\npredictions\
  \ = double(testPredictions);\nplotconfusion(ttest,predictions);\n```\n\n![Descripción:\
  \ http://www.mathworks.com/help/examples/ExtractFeaturesFromTrainedNeuralNetworkExample_01.png](img/00129.jpeg)\n\
  \n使用训练网络 `net` 测试数据的总体准确率为 99.4%。\n\n手动计算总体准确率。\n\n```matlab\naccuracy = sum(TTest\
  \ == testPredictions)/numel(TTest)\naccuracy = 0.9937\n```\n\n## 8.4.2 使用训练网络预测\n\
  \n### 语法\n```matlab\nYPred = predict(net,X)\nYPred = predict(net,X,Name,Value)\n\
  ```\n\n### 描述\n`YPred = predict(net,X)` 使用训练网络 `net` 对数据 `X` 进行预测。带有额外的 `Name,Value`\
  \ 参数。\n\n### 示例：预测输出\n**注意：**训练卷积神经网络需要 Parallel Toolbox 以及计算能力为 3.0 或更高的 CUDA 支持\
  \ GPU。\n\n加载样本数据。\n\n```matlab\nXTrain,TTrain = digitTrain4ArrayData;\n```\n\n`digitTrain4ArrayData`\
  \ 将数字训练集加载为 4-D 数组。`XTrain` 是一个 28x28x1x4940 的数组，其中 28 是图像的高度，28 是宽度。1 是通道数，4940\
  \ 是手写数字合成图像的数量。`TTrain` 是一个包含每个观测值标签的分类向量。\n\n构建卷积网络架构。\n\n```matlab\nlayers = [imageInputLayer([28\
  \ 28 1]);\n          convolution2dLayer(5,20);\n          reluLayer();\n       \
  \   maxPooling2dLayer(2,'Stride',2);\n          fullyConnectedLayer(10);\n     \
  \     softmaxLayer();\n          classificationLayer()];\n```\n\n将选项设置为带动量的随机梯度下降的默认设置。\n\
  \n```matlab\noptions = trainingOptions('sgdm');\n```\n\n训练网络。\n\n```matlab\nrng(1)\n\
  net = trainNetwork(XTrain,TTrain,layers,options);\n```\n\n| 轮次 (Epoch) | 迭代 (Iteration)\
  \ | 经过时间 (秒) | 批量损失 (Mini-batch Loss) | 批量准确率 (Mini-batch Accuracy) | 基础学习率 (Base\
  \ Learning Rate) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 2 | 50 | 0.42\
  \ | 2.2315 | 51.6% | 0.010000 |\n| 3 | 100 | 0.83 | 1.0606 | 68.75% | 0.010000 |\n\
  | 4 | 150 | 1.25 | 0.6321 | 82.03% | 0.010000 |\n| 6 | 200 | 1.67 | 0.3873 | 85.16%\
  \ | 0.010000 |\n| 7 | 250 | 2.09 | 0.4310 | 89.84% | 0.010000 |\n| 8 | 300 | 2.52\
  \ | 0.3524 | 90.63% | 0.010000 |\n| 10 | 350 | 2.94 | 0.2313 | 96.88% | 0.010000\
  \ |\n| 11 | 400 | 3.36 | 0.2115 | 94.53% | 0.010000 |\n| 12 | 450 | 3.78 | 0.1681\
  \ | 96.88% | 0.010000 |\n| 14 | 500 | 4.21 | 0.1171 | 100.00% | 0.010000 |\n| 15\
  \ | 550 | 4.64 | 0.0920 | 99.22% | 0.010000 |\n\n\n\n\n\n| 16 | 600 | 5.06 | 0.1015\
  \ | 99.22% | 0.010000 |\n| 18 | 650 | 5.49 | 0.0682 | 98.44% | 0.010000 |\n| 19\
  \ | 700 | 5.92 | 0.0927 | 99.22% | 0.010000 |\n| 20 | 750 | 6.35 | 0.0685 | 98.44%\
  \ | 0.010000 |\n| 22 | 800 | 6.77 | 0.0496 | 99.22% | 0.010000 |\n| 23 | 850 | 7.20\
  \ | 0.0483 | 99.22% | 0.010000 |\n| 24 | 900 | 7.6 | 0.492 | 99.22% | 0.010000 |\n\
  | 25 | 950 | 8.06 | 0.0390 | 100.00% | 0.010000 |\n| 27 | 1000 | 8.49 | 0.0315 |\
