  ```\n\n## 4.3 使用训练过的网络分类数据\n\n### 语法\n```matlab\n[Ypred,scores] = classify(net,X)\n\
  [Ypred,scores] = classify(net,Name,Value)\n```\n\n### 描述\n`[Ypred,scores] = classify(net,X)`\
  \ 使用训练过的网络 `net` 估计 `X` 中的类别。\n\n`[Ypred,scores] = classify(net,Name,Value)` 使用额外的\
  \ `Name,Value` 参数估计类别。\n\n### 示例：使用训练过的卷积网络分类图像\n**注意：**训练卷积网络需要 Parallel Computing\
  \ Toolbox 以及计算能力为 3.0 或更高的支持 CUDA 的 NVIDIA® GPU。\n\n加载样本数据。\n```matlab\n[XTrain,TTrain]\
  \ = digitTrain4DArray;\n```\n`digitTrain4DArray` 将训练集作为 4D 数组加载。`XTrain` 是一个 28x28x1x4940\
  \ 的数组，其中 28 是高度和宽度，1 是通道数，4940 是手写数字的数量。`TTrain` 是包含每个观测标签的分类向量。\n\n构建卷积神经网络架构。\n\
  ```matlab\nlayers = [imageInputLayer([28 28 1]);\n      convolution2dLayer(5,20);\n\
  \      reluLayer();\n      maxPooling2dLayer(2,'Stride',2);\n      fullyConnectedLayer(10);\n\
  \      softmaxLayer();\n      classificationLayer()];\n```\n\n设置动量随机梯度下降的默认选项。\n\
  ```matlab\noptions = trainingOptions('sgdm');\n```\n\n训练网络。\n```matlab\nrng('default')\n\
  net = trainNetwork(XTrain,TTrain,layers,options);\n```\n\n| Epoch | Iteration |\
  \ Time Elapsed (seconds) | Mini-batch Loss | Mini-batch Accuracy | Base Learning\
  \ Rate |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 2 | 50 | 0.4 | 2.231 |\
  \ 47.6% | 0.01000 |\n| 3 | 100 | 0.8 | 0.83 | 75.0% | 0.01000 |\n| 3 | 150 | 1.2\
  \ | 0.558 | 82.3% | 0.01000 |\n| 4 | 200 | 1.6 | 0.4023 | 89.06% | 0.01000 |\n|\
  \ 7 | 250 | 2.08 | 0.375 | 88.28% | 0.01000 |\n| 8 | 300 | 2.50 | 0.3368 | 91.41%\
  \ | 0.01000 |\n| 10 | 350 | 2.93 | 0.2589 | 96.09% | 0.01000 |\n| 11 | 400 | 3.35\
  \ | 0.1396 | 98.44% | 0.01000 |\n| 12 | 450 | 3.77 | 0.1802 | 96.09% | 0.01000 |\n\
  | 14 | 500 | 4.19 | 0.0892 | 99.22% | 0.01000 |\n| 15 | 550 | 4.62 | 0.1221 | 96.8%\
  \ | 0.01000 |\n| 16 | 600 | 5.06 | 0.1015 | 99.22% | 0.010000 |\n| 18 | 650 | 5.49\
  \ | 0.0682 | 98.44% | 0.010000 |\n| 19 | 700 | 5.92 | 0.0927 | 99.22% | 0.010000\
  \ |\n| 20 | 750 | 6.35 | 0.0685 | 98.44% | 0.010000 |\n| 22 | 800 | 6.77 | 0.0496\
  \ | 99.22% | 0.010000 |\n| 23 | 850 | 7.20 | 0.0483 | 99.22% | 0.010000 |\n| 24\
  \ | 900 | 7.6 | 0.492 | 99.22% | 0.010000 |\n| 25 | 950 | 8.06 | 0.0390 | 100.00%\
  \ | 0.010000 |\n| 27 | 1000 | 8.49 | 0.0315 | 100.00% | 0.010000 |\n| 28 | 1050\
  \ | 8.92 | 0.0187 | 100.00% | 0.010000 |\n| 29 | 1100 | 9.35 | 0.0338 | 100.00%\
  \ | 0.010000 |\n\n`TTest` 包含了与 `XTest` 对应的数字。`YTestPred` 的列包含了 `predict` 对图像包含特定数字的概率估计。也就是说，第一列包含了给定图像是数字\
  \ 0 的概率估计，第二列包含了图像是数字 1 的概率估计，第三列包含了图像是数字 2 的概率估计，以此此类推。你可以看到 `predict` 对正确数字的概率估计接近\
  \ 1，而任何其他数字的概率都接近 0。`predict` 正确地估计了前 10 个观测值为数字 0。\n\n\n\n\n\n`classify` 的结果与前十张图像的真实数字匹配。\n\
  \n计算所有测试数据的准确率。\n\n```\naccuracy = sum(YTestPred == TTest)/numel(TTest)\n```\n`accuracy\
  \ = 0.9929`\n\n# 第 9 章 使用 MATLAB 的卷积神经网络。类\n\n## 9.1 简介\n卷积神经网络（`CNN` 或 `ConvNets`）是深度学习的重要工具，特别适用于图像识别。你可以构建一个\
  \ CNN 架构，训练网络，并使用训练后的网络来预测类别标签。你还可以从预训练的网络中提取特征，并使用这些特征来训练线性分类器。神经网络工具箱（Neural Network\
  \ Toolbox）还允许你进行迁移学习；即：在新的数据上重新训练现有 CNN 的最后一个全连接层。\n\n## 9.2 构建网络架构。类\nMATLAB 具有以下类：\n\
  \n| [Layer](http://www.mathworks.com/help/nnet/ref/layer-class.html) | 网络层 |\n|\
  \ --- | --- |\n\n### 9.2.1 网络层：layer\n\n### 描述\n网络层类，包含层信息。卷积神经网络架构中的每一层都是 `Layer`\
  \ 类。\n\n### 构建\n要定义卷积神经网络的架构，可以直接创建一个层向量。\n\n### 拷贝语义\n值（Value）。若要了解值类如何影响拷贝操作，请参考以下段落：\n\
  \n#### 两种拷贝行为\nMATLAB^® 对象有两种基本类型——句柄（handles）和值（values）。\n\n`Value` 对象在拷贝操作方面的表现类似于\
  \ MATLAB 基本类型。拷贝是独立的值。你在其中一个对象上执行的操作不会影响该对象的拷贝。\n\n`Handle` 对象通过其句柄变量进行引用。句柄变量的拷贝指向同一个对象。你在句柄对象上执行的操作在所有引用该对象的句柄变量中都是可见的。\n\
  \n#### 值对象的拷贝行为\nMATLAB 数值变量是值对象。例如，当将 `a` 拷贝到变量 `b` 时，两个变量是相互独立的。更改 `a` 的值不会改变\
  \ `b` 的值：\n\n```\na = 8;\nb = a;\n```\n\n现在重新赋值 `a`。`b` 保持不变：\n\n```\na = 6;\nb\
  \ = 8\n```\n\n清除 `a` 不影响 `b`：\n\n```\nclear a\nb = 8\n```\n\n`值对象属性`\n存储为值对象属性的值的拷贝行为与数值变量相同。例如，假设\
  \ `vobj1` 是一个具有属性 `a` 的值对象：\n\n```\nvobj1.a = 8;\n```\n\n如果你将 `vobj1` 拷贝到 `vobj2`，然后更改\
  \ `vobj1` 属性 `a` 的值，则拷贝对象的属性 `vobj2.a` 的值不受影响：\n\n```\nvobj2 = vobj1;\nvobj1.a =\
  \ 5;\nvobj2.a = 8\n```\n\n#### 句柄对象的拷贝行为\n这是一个名为 `HdClass` 的句柄类，它定义了一个名为 `Data`\
  \ 的属性。\n\n```class\nclassdef HdClass < handle\n  properties\n      Data\n  end\n\
  \  methods\n      function obj = HdClass(val)\n        if nargin > 0\n         \
  \ obj.Data = val;\n        end\n      end\n  end\nend\n```\n\n创建该类的对象：\n\n```\n\
  hobj1 = HdClass(8)\n```\n\n由于该语句没有以分号结束，MATLAB 会显示有关对象的信息：\n\n```\nhobj1 = HdClass\
  \ with properties\n  Data: 8\n```\n\n变量 `hobj1` 是引用该对象的句柄。将 `hobj1` 拷贝到 `hobj2`\
  \ 会导致产生另一个指向相同对象的句柄：\n\n```\nhobj2 = hobj1\nhobj2 = HdClass with properties\n  Data:\
  \ 8\n```\n\n由于句柄引用对象，拷贝句柄会将句柄拷贝到一个新名称，但句柄仍然指向同一个对象。例如，假设 `hobj1` 是一个具有属性 `Data`\
  \ 的句柄对象：\n\n```\nhobj1.Data = 8\n```\n\n更改 `hobj1` 的 `Data` 属性值，则拷贝对象的 `Data` 属性值也会随之改变：\n\
  \n```\nhobj1.Data = 5;\nhobj2.Data = 5\n```\n\n由于 `hobj2` 和 `hobj1` 是指向同一个对象的句柄，更改拷贝对象\
  \ `hobj2` 也会改变你通过 `hobj1` 访问的数据：\n\n```\nhobj2.Data = 17;\nhobj1.Data = 17\n```\n\
  \n#### 重新赋值句柄变量\n重新赋值句柄变量产生的结果与重新赋值任何变量相同。当你创建一个对象并将其赋值给 `hobj1` 时：\n\n```\nhobj1\
  \ = HdClass(34);\n```\n\n`hobj1` 引用的是新对象，而不是之前的（且被 `hobj2` 引用的）对象。\n\n#### 清除句柄变量\n\
  当从工作区清除一个句柄时，MATLAB 会移除变量，但不会移除被其他句柄引用的对象。然而，如果没有对对象的引用，MATLAB 将销毁该对象。\n\n给定 `hobj1`\
  \ 和 `hobj2`，它们都引用同一个对象，你可以清除任何一个句柄而不影响对象：\n\n```\nhobj1.Data = 8;\nclear hobj1\n\
  hobj2 = HdClass with properties\n  Data: 256\n```\n\n如果你同时清除 `hobj1` 和 `hobj2`，则对该对象没有引用了。MATLAB\
  \ 会销毁该对象并释放其使用的内存。\n\n#### 删除句柄对象\n要移除被任意数量句柄引用的对象，请使用 [`delete`](http://www.mathworks.com/help/matlab/ref/delete.html)。给定两个指向相同对象的\
  \ `hobj1` 和 `hobj2`，删除其中任一句柄。MATLAB 会删除该对象：\n\n```\nhobj1 = HdClass(8);\nhobj2 =\
  \ hobj1;\ndelete(hobj1)\nhobj2 = handle to deleted HdClass\n```\n\n使用 `clear` 从工作区移除变量。\n\
  \n#### 修改对象\n当将对象传递给函数时，MATLAB 会将对象的拷贝传递到函数工作区。如果函数修改了该对象，MATLAB 只修改函数工作区中的对象拷贝。在这些情况下，句柄类和值类之间的拷贝行为差异是重要的：\n\
  \n- `值对象` —— 函数必须返回修改后的对象拷贝。若要修改调用者工作区中的对象，请将函数的输出赋值给同名的变量\n- `句柄对象` —— 函数工作区中的拷贝指向同一个对象。因此，函数不需要返回修改后的拷贝。\n\
  \n#### 测试句柄类或值类\n要确定对象是否为句柄对象，请使用 [`isa`](http://www.mathworks.com/help/matlab/ref/isa.html)\
  \ 函数。如果 `obj` 是某个类的对象，此语句将确定 `obj` 是否为句柄：\n\n```\nisa(obj,'handle')\n```\n\n例如，`containers.Map`\
  \ 类创建一个句柄对象：\n\n```\nhobj = containers.Map({'Red Sox','Yankees'},{'Boston','New\
  \ York'});\nisa(hobj,'handle')\nans = 1\n```\n\n`hobj` 也是一个 `containers.Map` 对象：\n\
  \n```\nisa(hobj,'containers.Map')\nans = 1\n```\n\n查询 `hobj` 的类显示它是一个 `containers.Map`\
  \ 对象：\n\n```\nclass(hobj)\nans = containers.Map\n```\n\n[`class`](http://www.mathworks.com/help/matlab/class)\
  \ 函数返回对象的特定类。\n\n#### 索引\n你可以通过对层向量进行索引并使用点符号来访问网络架构中层的属性。例如，图像输入层是卷积神经网络的第一层。要访问图像输入层的\
  \ `InputSize` 属性，请使用 `layers(1).InputSize`。\n\n### 示例：\n\n#### 构建网络架构\n定义用于分类的卷积神经网络架构，只有一个卷积层、一个\
  \ ReLU 层和一个全连接层。\n\n```\ncnnarch = [\n      imageInputLayer([28 28 3])\n      convolution2dLayer([5\
  \ 5],10)\n      reluLayer()\n      fullyConnectedLayer(10)\n      softmaxLayer()\n\
  \      classificationLayer()\n];\n```\n\n或者，你可以单独创建层然后将它们连接。\n\n```\ninput = imageInputLayer([28\
  \ 28 3]);\nconv = convolution2dLayer([5 5],10);\nrelu = reluLayer();\nfcl = fullyConnectedLayer(10);\n\
  sml = softmaxLayer();\ncol = classificationLayer();\ncnnarch = [input;conv;relu;fcl;sml;col];\n\
  ```\n\n\n\n\n\n`cnnarch` 是一个包含 6 个层的向量。\n\n显示此层向量的类信息。\n\n```matlab\nclass (cnnarch)\n\
  \  nnet.cnn.layer.Layer\n```\n\n`cnnarch` 是一个 `Layer` 对象。\n\n## 在层数组中访问层和属性\n\n\
  定义一个用于分类的卷积神经网络架构，仅包含一个卷积层、一个 ReLU 层和一个全连接层。\n\n```matlab\nlayers = [imageInputLayer([28\
  \ 28 3])\n      convolution2dLayer([5 5],10)\n      reluLayer()\n      fullyConnectedLayer(10)\n\
  \      softmaxLayer()\n      classificationLayer()];\n```\n\n显示图像输入层。\n\n```matlab\n\
  layers(1)\n```\nans =\n\n  ImageInputLayer with properties:\n\n              Name:\
  \ ''\n          InputSize: [28 28 3]\n    DataAugmentation: 'none'\n      Normalization:\
  \ 'zerocenter'\n\n提取输入尺寸。\n\n```matlab\nlayers(1).InputSize\n```\nans =\n    28\
  \    28     3\n\n显示卷积层的步长。\n\n```matlab\nlayers(2).Stride\n```\nans =\n     1  \
  \   1\n\n访问全连接层的偏置学习率因子。\n\n```matlab\nlayers(4).BiasLearnRateFactor\n```\nans =\n\
  \    1\n\n## 创建典型的卷积神经网络架构\n\n创建一个用于分类的卷积神经网络，包含两个卷积层和两个全连接层。使用 2x2 不重叠池化区域的最大池化层对卷积层进行下采样。使用修正的线性单元作为卷积层和全连接层的非线性激活函数。对前两个卷积层使用局部响应归一化。第一个卷积层有\
  \ 12 个 4x3 滤波器，第二个卷积层有 16 个 5x5 滤波器。第一个全连接层有 100 个神经元。假设输入数据为 28x28 的灰度图像，有 10 个类。为每个层分配一个名称。\n\
  \n```matlab\nlayers = [imageInputLayer([28 28 1],'Normalization','none','Name','inputl')\n\
  \      convolution2dLayer([4 3],12,'NumChannels',1,'Name','conv1')\n      reluLayer('Name','relu1')\n\
  \      crossChannelNormalizationLayer(4,'Name','cross1')\n      maxPooling2dLayer(2,'Stride',2,'Name','max1')\n\
  \      convolution2dLayer(5,16,'NumChannels',12,'Name','conv2')\n      reluLayer('Name','relu2');\n\
  \      crossChannelNormalizationLayer(4,'Name','cross2')\n      maxPooling2dLayer(2,'Stride',2,'Name','max2')\n\
  \      fullyConnectedLayer(256,'Name','full1')\n      reluLayer('Name','relu4')\n\
  \      fullyConnectedLayer(10,'Name','full2')\n      softmaxLayer('Name','softm')\n\
  \      classificationLayer('Name','out')];\n```\n\n## 9.3 TRAIN NETWORKS. CLASSES\n\
  \nMATLAB 拥有以下类：\n\n| 类 |  |\n| --- | --- |\n| [SeriesNetwork](http://www.mathworks.com/help/nnet/ref/seriesnetwork-class.html)\
  \ | 串网络类 |\n| [TrainingOptionsSGDM](http://www.mathworks.com/help/nnet/ref/trainingoptionssgdm-class.html)\
  \ | 带动量的随机梯度下降的训练选项 |\n\n### 9.3.1 串网络类: SeriesNetwork\n\n**描述**\n\n一个包含训练后网络中层的串网络类。串网络是层按顺序排列的网络。它有一个单一输入和一个输出。\n\
  \n**构造**\n\n```matlab\ntrainedNet = trainNetwork(X,Y,layers,options) 返回一个训练后的网络。`trainedNet`\
  \ 是一个 `SeriesNetwork` 对象。\n```\n训练卷积神经网络的更多信息，请参阅 [trainNetwork](http://www.mathworks.com/help/nnet/ref/trainnetwork.html)。\n\
  \n**输入参数**\n\n- **X** — 图像：4 维数组\n- **Y** — 类标签：分类响应数组\n- **layers** — 网络层：`Layer`\
  \ 对象\n- **options** — 训练选项\n\n**方法**\n\n| 方法 | 描述 |\n| --- | --- |\n| [activations](http://www.mathworks.com/help/nnet/ref/seriesnetwork.activations.html)\
  \ | 计算层激活值 |\n| [classify](http://www.mathworks.com/help/nnet/ref/seriesnetwork.classify.html)\
  \ | 使用训练后的网络分类数据 |\n| [predict](http://www.mathworks.com/help/nnet/ref/seriesnetwork.predict.html)\
  \ | 使用训练后的网络预测响应 |\n\n**拷贝语义**\n\n关于值如何影响拷贝，请参阅上文。\n\n**示例：构造并训练卷积网络**\n\n加载样本数据。\n\
  \n```matlab\nXTrain,TTrain= digit4DArray;\n```\n`digit4DArray` 加载数字数据集为 4 维数组。`XTrain`\
  \ 是 28x28x1x4940 数组，28 是高度，28 是宽度，1 是通道数，4940 是数字。`TTrain` 是包含每个观测标签的分类向量。\n\n构造卷积网络。\n\
  \n```matlab\nlayers = [imageInputLayer([28 28 1]);\n      convolution2dLayer(5,20);\n\
  \      reluLayer();\n      maxPooling2dLayer(2,'Stride',2);\n      fullyConnectedLayer(10);\n\
  \      softmaxLayer();\n      classificationLayer()];\n```\n\n设置带动量的随机梯度下降默认选项。\n\
  \n```matlab\noptions = trainingOptions('sgdm');\n```\n\n训练网络。\n\n```matlab\nnet\
  \ = trainNetwork(XTrain,TTrain,layers,options);\n```\n\n| Epoch | 迭代 | 用时间 (秒) |\
