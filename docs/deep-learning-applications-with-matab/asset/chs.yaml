  ```\n\n\n\n| 30 | 1150 | 14.17 | 0.0714 | 99.22% | 0.0100 |\n| 30 | 1170 | 14.41\
  \ | 0.0497 | 100.00% | 0.0100 |\n\n`trainNetwork` 在有可用 GPU 的情况下会使用 GPU。如果没有可用的 GPU，它将使用\
  \ CPU。注意：有关可用的硬件选项，请参阅 `trainingOptions` 函数页面。\n\n假设训练在第 8 个 epoch 后中断且未完成。与其从头开始重新训练，你你可以加载最后一个检查点网络并从该点继续训练。\n\
  \n## 5.3.4 加载检查点网络并恢复训练\n\n加载检查点网络。\n\n```matlab\nload convnet_checkpoint__351__2016_11_09__12_04_23.mat\n\
  ```\n\n`trainNetwork` 会自动为检查点网络文件分配唯一的名称。例如，在本例中，`351` 是迭代次数，`2016_11_09` 是日期，`12_04_21`\
  \ 是 `trainNetwork` 保存网络的时间。\n\n如果你在工作目录中没有数据和训练选项，你必须在恢复训练之前手动加载和/或指定它们。\n\n指定训练选项以减少最大\
