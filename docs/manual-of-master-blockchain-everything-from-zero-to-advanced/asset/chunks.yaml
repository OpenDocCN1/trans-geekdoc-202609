  trans: "\n\n# 审计\n执行安全审计以识别并修复智能合约代码中的漏洞。专业公司提供智能合约审计服务。\n\n# 部署\n将智能合约部署到区块链上。在以太坊上，可以使用\
    \ `Remix` 或自定义脚本完成。在迁移到主网之前，先在测试网上进行部署测试至关重要。\n\n## 工具与框架\n区块链开发需要使用各种工具和框架，以促进编码、测试和部署过程。\n\
    \n- `Remix`: 一个基于 Web 的 IDE，用于在以太坊上开发、测试和部署智能合约。\n- `Truffle`: 一个针对以太坊的开发框架，提供了编译、测试和部署智能合约的工具。\n\
    - `Ganache`: 一个个人级区块链，允许你在安全的本地环境中测试智能合约。\n- `Today`: 一个以太坊为开发环境，有助于智能合约和去中心化应用程序的创建。\n\
    - `OpenZeppelin`: 一个可重用且经过审计的智能合约库，为开发提供安全且经过测试的标准。\n\n## 安全测试与审计\n对智能合约进行测试和审计对于确保其安全并按预期运行至关重要。\n\
    \n- `Unitary tests`: 编写单元测试以验证合约的每个部分是否正常工作。`Truffle` 和 `Hardhat` 等工具支持单元测试。\n\
    - `Integration Tests`: 检查系统的不同部分是否协同工作。这包括测试智能合约与其他应用程序组件之间的交互。\n- `Stress Tests`:\
    \ 模拟高负载场景，以确保智能合约在极端条件下仍正常运行。\n- `Security Audits`: 聘请专业公司对智能合约代码审计以识别漏洞。定期审计非常重要，特别是在部署合约到生产环境之前。\n\
    \n## 区块链应用示例\n区块链应用非常多样，跨越多个行业，每个行业都以创新的方式利用智能合约和其他区块链功能。\n\n- `去中心化金融 (DeFi)`:\
    \ DeFi 平台利用智能合约提供贷款、保险和交易等金融服务，而无需传统的中间介。\n- `供应链管理`: 智能合约确保产品在整个供应链中的透明度和可追溯性，并自动检查每一步的合规性。\n\
    - `电子投票`: 智能合约实现了安全且透明的投票，确保每一票都得到公平且不可篡改的计数。\n- `数字身份管理`: 智能合约可用于验证和管理数字身份，提高个人数据的安全性和隐私性。\n\
    - `游戏与娱乐`: 基于区块链的游戏利用非同质化代币 (NFT) 来代表独特的、可传输的游戏内物品。\n\n## 本章总结\n区块链开发是一个庞大且动态的领域，涉及多种工具、编程语言和框架。创建安全高效的智能合约是构建稳健可靠的去中心化应用程序的基础。随着区块链技术的不断演进，新的开发工具和实践将会出现，使全球开发者的流程变得更加简单和高效。在接下来的章节中，我们将探索这一性技术的流行平台和特定应用。\n\
    \n![](img/image_rsrc2PU.jpg)\n\n# 第 7 章\n## 以太坊与 EVM\n\n### 以太坊简介\n以太坊是一个开源区块链平台，支持智能合约和去中心化应用程序\
    \ (dApps) 的创建和执行。以太坊由维塔·布特林（Vitalik Buterin）及其他创始人于 2015 年推出，通过允许代码在去中心化网络上运行，扩展了原始的区块链概念。\n\
    \n- **定义**: 以太坊是一个区块链平台，通过其虚拟机——以太坊虚拟机 (`EVM`) 支持智能合约的执行。\n- **目标**: 促进去中心化生态系统的构建，让开发者能够安全、透明地创建和部署智能合约及\
    \ dApps。\n\n### 以太坊虚拟机 (EVM)\n`EVM` 是以太坊上智能合约的执行环境。它负责确定性地执行代码，确保网络中的所有节点都能相同的结果。\n\
    \n- **字节码**: 智能合约被编译成 `bytecode`，这是 `EVM` 能够理解的语言。\n- **Gas**: 为了防止无限循环和滥用，以太坊上的每次操作都会消耗一个单位的\
    \ `gas`，这是用 `Ether` 的资源。\n\n### 编程语言：Solidity\n`Solidity` 是用于在该平台上编写智能合约的主要编程语言。\n\
    \n- **语法**: `Solidity` 的语法灵感源自 JavaScript、Python 和 C++，对开发者来说非常熟悉。\n- **特性**:\
    \ 静态类型、支持继承、函数、可见性修饰符以及用于记录的事件。\n\n```solidity\npragma solidity ⁰.8.0;\n\ncontract\
    \ SimpleStorage {\n    uint256 public storedData;\n\n    function set(uint256\
    \ x) public {\n        storedData = x;\n    }\n\n    function get() public returns\
    \ (uint256) {\n        return storedData;\n    }\n}\n```\n\n### 开发与工具\n在以太坊上开发智能合约涉及几个步骤和促进该过程特定工具。\n\
    \n- `Remix`: 一个基于 Web 的 IDE，用于在以太坊上开发、测试和部署智能合约。\n- `Truffle`: 一个针对以太坊的开发框架，使编译、部署和测试智能合约变得简单。\n\
    - `Ganache`: 一个个人区块链，允许你在安全的本地环境中测试智能合约。\n- `Metamask`: 一个数字钱包，允许用户直接从浏览器与以太坊区块链交互。\n\
    \n### 智能合约的部署\n在以太坊上部署智能合约涉及将 Solidity 代码编译为字节码，并执行将该字节码写入区块链的交易。\n\n- **编译**:\
    \ 使用 `Remix` 或 Solidity 编译器 (`solc`) 等工具将 Solidity 合约编译成字节码。\n- **部署**: 将部署交易发送到以太坊网络，字节码被存储在那里，合约被注册到一个唯一的地址。\n\
    - **交互**: 部署后，智能合约可以被其他交易或合约调用，允许它们执行功能。\n\n### 智能合约的安全\n由于区块链的不可篡改性和公开性，确保智能合约的安全性至关重要。\n\
    \n- **代码审查**: 执行严格的代码审查以识别并修复漏洞。\n- **安全审计**: 聘请专门从事智能合约审计的公司来审查和测试代码安全性。\n- **广泛测试**:\
    \ 编写全面的单元测试和集成测试，以确保合约的所有部分都按预期方式工作。\n- **使用信赖库**: 使用经过良好审计且受信任的库和智能合约（例如 `OpenZeppelin`\
    \ 提供的），避免重复造轮子并减少引入新漏洞的风险。\n\n#### 以太坊应用示例\n以太坊是广泛去中心化应用程序的底层平台，这些应用超越了简单的金融交易。\n\
    \n"
