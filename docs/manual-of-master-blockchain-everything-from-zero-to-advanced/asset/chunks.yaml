  trans: "\n\n# 监管\n\n与 `ICOs` 类似，`IEOs` 也受到监管，且可能因管辖不同而异。\n\n## 证券代币发行 (STOs)\n\n\
    证券代币发行 (`STOs`) 是一种受监管的融资形式，用于发行证券代币。这些代币代表真实资产，如股票、房地产或投资基金份额，并受证券法的约束。\n\n###\
    \ STO 流程：\n\n- **监管合规**：确保代币发行符合所有适用的证券法规。\n- **代币创建**：使用 `ERC-1400` 等标准开发证券代币。\n\
    - **发行**：通过受监管的平台向合格投资者出售代币。\n\n### STOs 的优势：\n\n- **监管与安全**：监管合规增加了投资者的安全性和信心。\n\
    - **获取真实资产**：代币代表了对有形资产的持有，提供了内在价值。\n- **透明性**：区块链的使用确保了交易和资产所有权的透明度。\n\n### STOs\
    \ 面的挑战：\n\n- **监管复杂性**：应对证券法规可能非常复杂且繁琐。\n- **合规成本**：与监管合规相关的成本可能很高。\n- **流动性**：虽然代币是可以交易的，但与传统的加密货币相比，流动性可能较低。\n\
    \n## 本章总结\n\n代币和代币发行（如 `ICOs`、`IEOs` 和 `STOs`）是区块链生态系统中不可或缺的。它们为募集资源、创建新项目和投资民主化提供了机制。然而，这些机制也带来了重大的挑战和风险，包括监管合规的需求、智能合约的安全以及市场波动。随着该领域的不断演变，预计将出现新的代币发行形式和创新来应对这些挑战，为投资者和创业者营造更安全、更高效的环境。在接下来的章节中，我们将探索区块链开发、热门平台以及这一革命技术的特定应用。\n\
    \n![](img/image_rsrc2PT.jpg)\n\n# 第 6 章\n\n## 区块链开发\n\n### 开发环境\n\n在区块链上开发需要了解用于创建、测试和部署智能合约以及去中心化应用程序\
    \ (`dApps`) 的特定工具和环境。让我们探索一些最流行的开发环境。\n\n- **以太坊 (Ethereum)**：开发智能合约和 `dApps`\
    \ 最常用的平台。`Ethereum` 提供了一个名为 `Ethereum Virtual Machine` (`EVM`，以太坊虚拟机）的虚拟机，可以在安全环境中运行智能合约。\n\
    - **Solidity**：在以太坊上编写智能合约最常用的编程语言。\n- **Remix**：一个基于 Web 的 IDE，用于在以太坊上开发、测试和部署智能合约。\n\
    - **Truffle**：用于 `Ethereum` 的开发框架，提供了编译、测试和部署智能合约的工具。\n- **Ganache**：一个个人级区块链，允许你在安全的本地环境中测试智能合约。\n\
    - **Hyperledger Fabric**：一个许可链区块链平台，面向需要隐私和访问控制的企业。\n- **Chaincode（链 code）**：`Hyperledger\
    \ Fabric` 中智能合约的等效物，通常用 `Go`、`Java` 或 `Node.js` 编写。\n- **Fabric SDKs**：软件开发包，允许应用程序与\
    \ `Hyperledger Fabric` 网络集成。\n- **EOS**：专注于可扩展性和易用性，`EOS` 在开发具有高处理能力的 `dApps`\
    \ 时非常流行。\n- **EOSIO**：驱动 `EOS` 区块链的软件，支持用 `C++` 编写的智能合约。\n- **EOS Studio**：一个在\
    \ `EOS` 区块链上开发、测试和部署智能合约的 IDE。\n- **波场 (Tron)**：一个支持智能合约的区块链平台，在去中心化应用和游戏中很流行。\n\
    - **TronBox**：类似于 `Truffle` 的工具，用于在 `Tron` 网络上开发和测试智能合约。\n\n### 编程语言\n\n在区块链上开发需要熟悉几种编程语言，每种语言适用于不同的平台。\n\
    \n- **Solidity**：在以太坊上编写智能合约最常用的编程语言。\n  - *特点*：静态类型、继承。\n  - *示例*：\n    ```solidity\n\
    \    pragma solidity ⁰.8.0;\n    contract Storage {\n    ```\n- **Vyper**：一种较新的、针对以太坊的编程语言。\n\
    \  - *特点*：简单、安全。\n  - *示例*：\n    ```python\n    contract Storage:\n      storedData:\
    \ uint256\n    ```\n- **C++**：主要用于 EOS 的智能合约开发。\n  - *特点*：高性能、控制。\n  - *示例*：\n\
    \    ```cpp\n    #include <eosio/eosio.hpp>\n    using namespace eosio;\n\n  \
    \  CONTRACT Storage : public contract {\n    ```\n- **Go**：用于 Hyperledger Fabric\
    \ 的智能合约。\n  - *特点*：与现有系统灵活。\n  - *示例*：\n    ```go\n    package main\n\n    import\
    \ (\n      \"encoding/json\"\n      \"fmt\"\n      \"github.com/hyperledger/fabric-contract-api/contractapi\"\
    \n    )\n    ```\n- **Java**：用于 Hyperledger Fabric 的智能合约。\n  - *特点*：与企业系统集成。\n\
    - **Node.js**：用于 Hyperledger Fabric 的智能合约。\n  - *特点*：在 Web 开发中流行。\n\n### 智能合约开发\n\
    \n开发智能合约涉及多个步骤，从定义需求到部署到区块链。\n\n- **需求定义**：在开始编码之前，定义智能合约的需求至关重要，包括必须满足的条件、参与的方以及将采取的行动。\n\
    - **代码化**：使用适用于所选平台的语言编写智能合约。遵循编码和安全最佳实践以避免漏洞非常重要。\n- **测试**：测试智能合约对于确保它们按预期运行至关重要。Truffle、Hardhat\
    \ 和 Ganache 等工具被广泛用于在本地环境中开发和测试智能合约。\n\n"
