    \ and their specific applications.\n\n![](image_rsrc2PV.jpg)\n\n## Chapter 8\n\
    \n## Hyperledger Fabric\n\n* * *\n\n#### Introduction to Hyperledger Fabric\n\n\
    Hyperledger Fabric is a permissioned blockchain platform developed by the Linux\
    \ Foundation, focusing on companies that need privacy and access control. Unlike\
    \ public blockchains like Ethereum and Bitcoin, Hyperledger Fabric allows companies\
    \ to set up blockchain networks where participants are known and authorized.\n\
    \nDefinition : Hyperledger Fabric is a modular blockchain platform that enables\
    \ the creation of permissioned blockchain networks where participants have control\
    \ over who can participate and transact.\n\nAim : Facilitate the creation of enterprise\
    \ blockchain solutions that require high performance, privacy and scalability.\n\
    \n#### Modular Architecture\n\nOne of the main features of Hyperledger Fabric\
    \ is its modular architecture, which allows customization and flexibility in network\
    \ configuration.\n\nMain Components :\n\nPeers : Nodes that maintain a copy of\
    \ the ledger and execute smart contracts (chaincodes).\n\nOrderers : Nodes responsible\
    \ for ordering transactions into blocks, ensuring the consistency of the ledger.\n\
    \nMembership Service Provider (MSP) : System that manages participant identities\
    \ and controls access to the network.\n\nChannels : Subnets within the main network,\
    \ allowing the creation of separate ledgers for different groups of participants.\n\
    \nChaincode : The equivalent of smart contracts in Hyperledger Fabric. They are\
    \ run by peers and can be written in Go, Java or Node.js.\n\n#### Chaincode Development\n\
