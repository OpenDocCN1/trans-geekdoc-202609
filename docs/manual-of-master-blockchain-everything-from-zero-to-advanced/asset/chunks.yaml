    - **企业采用**：各行业的公司都在探索区块链如何提高运营效率、透明度和安全性。\n- **去中心化治理**：去中心化自治组织（`DAOs`）正作为治理和集体决策的新形式不断出现。\n\
    \n## 章节总结\n本章对区块链的基础知识进行了全面概述，从其历史和基本概念到实际应用和挑战。理解这些原则对于充分实现这一革命性技术的潜力至关重要。在接下来的章节中，我们将更详细地探讨技术方面、热门平台、特定应用以及未来。\n\
    \n## 第 3 章 区块链上的密码学\n***\n\n### 密码学引言\n密码学是区块链中不可或缺的组成部分，确保数据不被未经授权的篡改。\n\n###\
    \ 公对称密钥加密\n非对称加密技术是区块链的基础，它使用一对密钥：公钥和私钥来加密数据。\n\n ** **公钥**：用于加密数据，只有持有私钥的人才能解密。\n\
    - **私钥**：用于签名，以证明发送者的身份。\n\n### 密码学哈希\n哈希函数是数学函数，将任何大小的数据转换为固定长度的字符串。在区块链中，哈希确保数据的完整性。\n\
    \n- **完整性保证**：对数据的任何更改都会导致完全不同的哈希值，从而使篡改被发现。\n- **区块链**：每个区块包含前一个区块的哈希，形成链。\n\n\
    ### 数字签名\n数字签名用于在区块链上确保交易的真实性和完整性。它们使用公钥进行验证。\n\n- **签名创建**：签名者使用其私钥对交易进行签名。\n\
    - **签名验证**：网络中的任何节点都可以使用公钥来验证签名。如果生成的哈希值匹配，则签名是有效的。\n\n### Merkle 树\nMerkle 树是一种允许快速安全地验证数据完整性的结构。它们被广泛用于组织和验证区块中的交易。\n\
    \n- **Merkle 树结构**：Merkle 树由叶节点（交易）、中间节点和根节点组成。每个叶节点是交易的哈希，每个中间节点是其子节点的哈希。根节点（`Merkle\
    \ Root`）代表整个树的哈希。\n- **完整性检查**：要检查特定交易的完整性，只需检查该交易到根节点的路径。这允许在大数据集中进行高效扫描。\n\n\
    ### 工作量证明\n工作量证明（`PoW`）是一种确保区块链安全的共识机制。它要求矿工解决复杂的密码学问题来验证交易并添加新区块。\n\n ** **密码学排除**：矿工竞争寻找一个`nonce`，该值与区块数据结合并通过哈希函数后，产生符合特定标准的哈希（例如，指定数量的前零）。\n\
    - **验证与添加**：第一个找到有效哈希的矿工将区块传输到网络。其他节点检查区块的有效性，如果接受，将其加入链。\n- **奖励**：解决问题的矿工将获得新的加密货币以及区块中的交易费。\n\
    \n### 权益证明\n权益证明（`PoS`）是工作量证明的替代方案，旨在更具能源效率并减少对特殊硬件的需求。\n\n- **验证者选择**：验证者不是通过竞争解决密码学问题，而是根据他们拥有的并愿意质押的货币数量来选出的。质押越高，被选中验证下一个区块的可能性就越大。\n\
    - **区块验证**：验证者验证区块中的交易。如果有效，区块将被添加到链中。\n\n"
