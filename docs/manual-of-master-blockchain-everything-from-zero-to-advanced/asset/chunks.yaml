    ## Introduction to EOS


    `EOS` is a blockchain platform that was launched in 2018 by the company `Block.one`,
    with the aim of offering a scalable and high-performance infrastructure for the
    development of decentralized applications (`dApps`). `EOS` stands out for its
    ability to process thousands of transactions per second (`TPS`) and its low transaction
    fees.


    Definition : `EOS` is a blockchain platform designed to support large-scale decentralized
    applications, offering high performance and scalability.


    Aim : Facilitate the creation of dApps that can serve millions of users simultaneously,
    without the performance bottlenecks common in other blockchains.


    ## EOS Main Features


    `EOS` offers several features that make it an attractive choice for dApp developers.


    Scalability : `EOS` is capable of processing thousands of transactions per second
    thanks to its Delegated Proof of Stake (`DPoS`) consensus mechanism and the use
    of parallelism.


    Zero Transaction Fees : Unlike many other blockchains, `EOS` allows developers
    to create dApps without users having to pay transaction fees.


    Decentralized Governance : `EOS` uses a decentralized governance system where
    block producers are elected by the community, allowing for continuous updates
    and improvements to the network.


    Development Tools : `EOS` offers a robust set of development tools, including
    the `EOSIO SDK`, to facilitate the creation and deployment of dApps.


    ## Delegated Proof of Stake (DPoS)


    `EOS`''s consensus mechanism, Delegated Proof of Stake (`DPoS`), allows for high
    transaction processing capacity and a more flexible governance model.


    Voting Delegation : `EOS` token holders can vote to elect block producers who
    validate transactions and keep the network secure.


    Block Producers : The 21 most voted block producers are responsible for producing
    blocks on the network. They are incentivized to keep the network safe and efficient,
    as they may be replaced by other candidates if they fail to fulfill their responsibilities.


    Penalty Mechanism : To guarantee the honesty and performance of block producers,
    `EOS` implements penalties for those who do not fulfill their tasks, such as loss
    of rewards and demotion in the vote ranking.


