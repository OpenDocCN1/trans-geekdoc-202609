    ## EOS 简介


    `EOS` 是由 `Block.one` 公司于 2018 年推出的区块链平台，旨在为去中心化应用 (`dApps`) 的开发提供可扩展的高性能基础设施。`EOS`
    以其每秒处理数千次交易 (`TPS`) 的能力和低交易费用而脱。


    定义：`EOS` 是一个旨在支持大规模去中心化应用的区块链平台，提供高性能和高可扩展性。


    目标：促进能够同时为数百万用户服务的 dApps 创建，且没有其他区块链中常见的性能瓶颈。


    ## EOS 主要特性


    `EOS` 提供了许多特性，使其成为 dApp 开发者具有吸引力的选择。


    可扩展性：得益于其委托权益证明 (`DPoS`) 共识机制和并行处理的使用，`EOS` 每每秒处理数千次交易。


    零交易费用：与许多其他区块链不同，`EOS` 允许开发者创建 dApps 而无需用户支付交易费用。


    去中心化治理：`EOS` 使用去中心化治理系统，区块生成者由社区选举，允许网络进行持续更新和改进。


    开发工具：`EOS` 提供了一套健的开发工具，包括 `EOSIO SDK`，以促进 dApps 的创建和部署。


    ## 委托权益证明 (DPoS)


    `EOS` 的共识机制委托权益证明 (`DPoS`) 允许高交易处理能力和更灵活的治理模型。


    投票委托：`EOS` 代币持有者可以投票选举区块生成者，他们验证交易并保持网络安全。


    区块生成者：得票最多的 21 个区块生成者负责在网络产生区块。他们被激励保持网络的安全高效，因为如果他们未能履行职责，可能会被其他候选取代。


    惩罚机制：为了保证区块生成者的诚实和性能，`EOS` 对未履行任务的人实施了惩罚，例如失去奖励和投票排名下降。


