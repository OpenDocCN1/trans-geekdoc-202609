    ## Chapter 3


    ## Cryptography on Blockchain


    * * *


    #### Introduction to Cryptography


    Cryptography is an essential component of blockchain, ensuring the security, integrity
    and authenticity of data. Encryption technology allows information to be transformed
    so that only authorized recipients can access it, protecting it from unauthorized
    access and tampering. In the context of blockchain, cryptography is used to create
    hashes, secure transactions and generate digital signatures.


    #### Public Key Cryptography


    Public key cryptography, also known as asymmetric cryptography, is fundamental
    to blockchain security. This system uses a pair of keys: a public key, which can
    be shared with everyone, and a private key, which must be kept secret.


    Public Key : Used to encrypt data that can only be decrypted by the corresponding
    private key.


    Private Key : Used to digitally sign transactions and decrypt data encrypted by
    the corresponding public key.


    In blockchain, each user has a pair of keys. When a user wants to send a transaction,
    they use their private key to digitally sign the transaction. The digital signature
    guarantees that the transaction was actually sent by the owner of the private
    key and that the data was not altered during transmission.


    #### Cryptographic Hashes


    Hashes are mathematical functions that transform data of any size into a fixed-length
    string. In blockchain, hashes play a crucial role in ensuring data integrity.


    Integrity Guarantee : Any change to the input data results in a completely different
    hash, making it easy to detect manipulation. This ensures that data stored on
    the blockchain cannot be altered without the change being detected.


    Block Chaining : Each block in the blockchain contains the hash of the previous
    block. This creates an immutable link between the blocks, forming a chain. Any
    attempt to alter a block would invalidate all subsequent blocks, making fraud
    virtually impossible.


    One of the most used hash algorithms on the blockchain is SHA-256 (Secure Hash
    Algorithm 256-bit). This algorithm generates a 256-bit hash from the input data,
    providing robust security against brute force attacks and collisions.


    #### Digital Signatures


    Digital signatures are used in blockchain to guarantee the authenticity and integrity
    of transactions. They use public key cryptography to provide proof that a transaction
    was actually sent by the owner of the corresponding private key.


    Subscription Creation : The sender of the transaction uses their private key to
    create a digital signature. The signature is generated by applying a hash function
    to the transaction data and then encrypting the resulting hash with the private
    key.


    Signature Verification : Any node in the network can use the sender''s public
    key to verify the signature. Verification involves applying the same hash function
    to the transaction data and decrypting the signature with the sender''s public
    key. If the resulting hash matches the original hash, the signature is valid,
    confirming that the transaction was not altered and was sent by the owner of the
    private key.


    Digital signatures are a crucial component of blockchain security, ensuring that
    only legitimate transactions are recorded on the ledger.


    #### Merkle Trees


    Merkle Trees are a data structure that allows efficient and secure verification
    of data integrity on the blockchain. They are widely used to organize and verify
    large sets of data, such as transactions in a block.


    Merkle Tree Structure : The Merkle Tree is made up of leaves (transactions), intermediate
    nodes and a root. Each leaf is a hash of a transaction, and each intermediate
    node is a hash of the child nodes. The root of the Merkle Tree (Merkle Root) is
    a hash that represents the entire tree.


    Integrity Check : To check the integrity of a specific transaction, simply check
    the transaction path to the root of the tree. This allows for efficient scanning
    even on large data sets.


    Merkle Trees are essential to blockchain efficiency and scalability, enabling
    fast and secure verification of transactions.


    #### Proof of Work


    Proof of Work (PoW) is a consensus mechanism that ensures the security and integrity
    of the blockchain. It requires miners to solve complex cryptographic problems
    to validate transactions and add new blocks to the chain.


    Cryptographic Troubleshooting : Miners compete to find a nonce that, when combined
    with block data and passed through a hash function, produces a hash that meets
    certain criteria (for example, a predefined number of leading zeros).


    Validation and Addition of Blocks : The first miner to find a valid hash transmits
    the block to the network. The other nodes check the validity of the block and,
    if accepted, add it to the chain.


    Reward : The miner who solves the problem is rewarded with new units of the cryptocurrency
    and the transaction fees included in the block.


    Proof of Work ensures that adding new blocks to the chain is difficult and resource-consuming,
    making manipulation of the chain unfeasible.


    #### Proof of Stake


    Proof of Stake (PoS) is an alternative to Proof of Work, designed to be more energy
    efficient and reduce the need for specialized hardware.


    Validator Choice : Instead of competing to solve cryptographic problems, validators
    are chosen based on the amount of currency they own and are willing to "stake."
    The higher the bet, the greater the probability of being chosen to validate the
    next block.


    Block Validation : The validator verifies the transactions in the block. If they
    are valid, the block is added to the chain.'
