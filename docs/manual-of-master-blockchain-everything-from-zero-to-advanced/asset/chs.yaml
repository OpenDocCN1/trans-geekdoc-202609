  \n## 区块链在能源与公用事业中的应用示例\n\n若干用例凸显了区块链转型能源和公用事业行业的潜力。\n\n- **微网与点对点 (P2P) 能源交易**：区块链允许消费者和生产者相互交易，创建微网。\n\
