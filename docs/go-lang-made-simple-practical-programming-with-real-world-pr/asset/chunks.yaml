    \n# 项目 3：使用 WebSockets 构建实时聊天应用程序\n\n在这个项目中，我们将使用 Go 和 WebSockets 创建一个实时聊天应用程序。WebSockets\
    \ 允许客户端和服务器之间进行双向通信，非常适合需要实时更新的聊天应用程序。我们将此项目分为几个部分，引导你完成从设置 WebSocket 服务器到构建前端。\n\
    \n### 前提条件：\n\n- 已安装 Go（访问 https://golang.org/dl/ 查看说明）\n- 基础 Go 和 JavaScript\n\
    \n### 创建聊天应用程序的步骤\n\n#### 步骤 1：设置 Go 服务器\n\n首先，你需要 `gorilla/websocket` 包。你可以使用以下命令进行安装：\n\
    \n```bash\ngo get github.com/gorilla/websocket\n```\n\n创建一个 `main.go` 文件并写入以下代码：\n\
    \n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"log\"\n    \"net/http\"\n\
    \    \"github.com/gorilla/websocket\"\n)\n\n// 定义 upgrader\nvar upgrader = websocket.Upgrader{\n\
    \    CheckOrigin: func(r *http.Request) bool {\n        return true\n    },\n\
    }\n\n// 用于存储客户端的全局 map\nvar clients = make(map[*websocket.Conn]bool)\n\n// 处理连接的\n\
    func handleConnections(w http.ResponseWriter, r *http.Request) {\n    conn, err\
    \ := upgrader.Upgrade(w, r, nil)\n    if err != nil {\n        log.Println(err)\n\
    \        return\n    }\n    defer conn.Close()\n\n    // 注册新客户端\n    clients[conn]\
    \ = true\n    fmt.Println(\"New client connected\")\n\n    // 监听传入的消息\n    for\
    \ {\n        messageType, msg, err := conn.ReadMessage()\n        if err != nil\
    \ {\n            log.Println(err)\n            delete(clients, conn)\n       \
    \     break\n        }\n\n        // 广播给所有客户端\n        for client := range clients\
    \ {\n            if err := client.WriteMessage(messageType, msg); err != nil {\n\
    \                log.Println(err)\n                delete(clients, client)\n \
    \           }\n        }\n    }\n}\n\nfunc main() {\n    // 设置 WebSocket 路由\n\
    \    http.HandleFunc(\"/ws\", handleConnections)\n\n    // 服务器\n    fmt.Println(\"\
    Server started on :8080\")\n    if err := http.ListenAndServe(\":8080\", nil);\
    \ err != nil {\n        log.Fatal(err)\n    }\n}\n```\n\n解释：\n\n- `handleConnections`\
    \ 函数使用 `websocket.Upgrader` 将传入 HTTP 请求升级为 WebSocket 连接。\n- 服务器监听来自客户端的 WebSocket\
    \ 消息。当收到消息时，将其广播给所有已连接的客户端。\n\n#### 步骤 2：构建前端（HTML + JavaScript）\n\n现在我们需要一个带有\
    \ JavaScript 连接 WebSocket 服务器并发送/接收消息的简单 HTML 页面。创建一个 `index.html` 文件并添加以下代码：\n\
    \n[此处文本截断，未提供后续 HTML 内容]\n\n"
