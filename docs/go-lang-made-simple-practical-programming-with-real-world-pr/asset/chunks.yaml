- raw: 'Debugging is an essential part of writing software, especially when things
    go wrong. There are several techniques and tools you can use to debug Go programs
    effectively.


    #### 1\. Using fmt.Println for Debugging


    One of the simplest ways to debug a Go program is by using fmt.Println() to print
    out variables, intermediate results, and program states at different points during
    execution.


    For example:


    package main


    import "fmt"


    func add(a, b int) int {


    fmt.Println("Adding:", a, "+", b)


    return a + b


    }


    func main() {


    result := add(3, 5)


    fmt.Println("Result:", result)


    }


    This technique helps track the flow of the program and verify if the variables
    hold the expected values.


    #### 2\. Using the Go Debugger (delve)


    For more advanced debugging, Go provides a debugger tool called delve. It allows
    you to set breakpoints, step through code, and inspect variable values interactively.


    To install delve, run:


    go install github.com/go-delve/delve/cmd/dlv@latest


    Then, you can run your program under delve with:


    dlv debug


    This will start an interactive debugging session where you can set breakpoints,
    step through your code, and examine variable values.


    #### 3\. IDE Debugging Tools


    Most modern IDEs, like Visual Studio Code or GoLand, have built-in support for
    Go debugging. You can set breakpoints, inspect variables, and step through code
    without using the command line.


    For example, in Visual Studio Code, after installing the Go extension, you can
    start a debugging session by opening the debug panel, setting breakpoints, and
    running the program in debug mode.


    #### 4\. Stack Traces and Logs


    When debugging an application, stack traces and logs are invaluable for understanding
    the cause of errors. In case of a panic, Go prints a stack trace that helps identify
    where the error occurred.


    You can also use the log package to log detailed error messages, which can be
    helpful when debugging production systems.


    package main


    import (


    "fmt"


    "log"


    )


    func divide(a, b int) int {


    if b == 0 {


    log.Fatal("division by zero")


    }


    return a / b


    }


    func main() {


    result := divide(10, 0)


    fmt.Println("Result:", result)


    }


    In this example, log.Fatal() logs an error message and terminates the program.
    The stack trace will be printed in the console.


    ### Conclusion


    In Go, error handling and debugging are critical for writing reliable and maintainable
    programs. Understanding the error type, creating custom errors, using panic and
    recover for critical situations, and utilizing debugging tools will help you build
    more resilient applications. By mastering these techniques, you can tackle bugs
    efficiently, provide meaningful error messages to users, and ensure your programs
    run smoothly in production.


    # Chapter 13: Testing in Go


    Testing is an essential part of any software development process. In Go (Golang),
    testing is well-supported with built-in tools and libraries. This chapter will
    cover how to write unit tests, benchmark your Go code, and use the go test command
    effectively.


    ### 1\. Writing Unit Tests in Go


    Unit testing ensures that individual parts of a program (typically functions or
    methods) work as expected. In Go, the testing package provides a straightforward
    way to write unit tests.


    #### A. Structure of a Unit Test


    A unit test in Go is written in a separate file with the suffix \_test.go. The
    test functions themselves must start with the word Test and take a pointer to
    testing.T as a parameter. The testing.T type provides methods for reporting failures.


    Here’s an example of a simple unit test:


    package mathutils


    import "testing"


    // Function to be tested


    func Add(a, b int) int {


    return a + b


    }


    // Unit test for the Add function


    func TestAdd(t \*testing.T) {


    result := Add(1, 2)


    expected := 3


    if result != expected {


    t.Errorf("Add(1, 2) = %d; expected %d", result, expected)


    }


    }


    #### B. Explanation:


    ●      The Add function is a simple function that adds two integers.


    ●      The TestAdd function is a test case for the Add function. It checks whether
    the result of Add(1, 2) is equal to the expected value (3).


    ●      If the result does not match the expected value, t.Errorf is called, which
    reports the error.


    #### C. Running Tests:


    To run your tests, you can use the go test command. If your test file is named
    mathutils\_test.go, you can run:


    go test


    This will automatically find all the test functions in the current directory and
    execute them. By default, it will run any function whose name starts with Test
    (e.g., TestAdd).


    You can also specify a package to test by running:


    go test mathutils


    #### D. Table-Driven Tests


    Go’s testing paradigm commonly uses table-driven tests. This method allows you
    to define multiple test cases in a single function, improving readability and
    maintainability.


    package mathutils


    import "testing"


    func TestAdd(t \*testing.T) {


    tests := \[\]struct {


    a, b     int


    expected int


    }{


    {1, 2, 3},


    {2, 3, 5},


    {5, 7, 12},


    }


    for \_, tt := range tests {


    t.Run("", func(t \*testing.T) {


    result := Add(tt.a, tt.b)


    if result != tt.expected {


    t.Errorf("Add(%d, %d) = %d; expected %d", tt.a, tt.b, result, tt.expected)


    }


    })


    }


    }


    In this example:


    ●      We define a list of test cases in the tests slice, where each test case
    contains the values of a, b, and the expected result.


    ●      A loop is used to iterate over the test cases, and each case is tested
    independently.


    ### 2\. Benchmarking Code in Go


    Benchmarking is the process of measuring the performance of a piece of code, often
    by calculating how long it takes to execute. In Go, benchmarking is supported
    natively with the testing package, just like unit tests. You can create benchmarks
    to measure how fast a function or method runs.


    #### A. Writing a Benchmark Test


    To create a benchmark, you define a function whose name starts with Benchmark
    and takes a pointer to testing.B. The function must call the code being tested
    in a loop. The testing.B type has a Run method to benchmark iterations and report
    the results.


    Here’s an example:


    package mathutils


    import "testing"


    func Add(a, b int) int {


    return a + b


    }


    func BenchmarkAdd(b \*testing.B) {


    for i := 0; i < b.N; i++ {


    Add(1, 2)


    }


    }


    In this example:


    ●      BenchmarkAdd is a benchmark test for the Add function.


    ●      The loop runs b.N times, where b.N is set by the testing package based
    on the benchmark’s configuration. The higher the value of b.N, the more iterations
    are run to get an accurate performance measurement.


    #### B. Running Benchmarks


    To run the benchmark, you can use the go test command with the \-bench flag. For
    example:


    go test -bench .


    This will execute all benchmark functions (functions starting with Benchmark)
    in the current package and display the results, including the number of iterations
    and the time taken per iteration.


    #### C. Example Output:


    $ go test -bench .


    BenchmarkAdd-8       1000000000    0.28 ns/op


    PASS


    ok      mathutils   1.501s


    In the example output:


    ●      BenchmarkAdd-8 indicates the benchmark function name and the number of
    CPU cores (in this case, 8).


    ●      1000000000 is the number of iterations the benchmark ran.


    ●      0.28 ns/op means each operation (call to Add) took 0.28 nanoseconds on
    average.


    ### 3\. Using the go test Command


    The go test command is a powerful tool for running unit tests and benchmarks in
    Go. There are several options available to customize the behavior of tests and
    benchmarks.


    #### A. Running Specific Tests or Benchmarks


    You can run a specific test or benchmark by passing the function name to the go
    test command. For example:


    go test -run TestAdd


    This will run only the TestAdd function in the current package. Similarly, you
    can run a specific benchmark:


    go test -bench BenchmarkAdd


    #### B. Running Tests with Verbose Output


    By default, the go test command does not show detailed output unless a test fails.
    You can enable verbose output with the \-v flag, which shows the result of each
    test case:


    go test -v'
