    \  float64\n    height float64\n}\n\n// Method for Circle\nfunc (c Circle) Area()\
    \ float64 {\n    return 3.14 * c.radius\n}\n\n// Method for Rectangle\nfunc (r\
    \ Rectangle) Area() float64 {\n    return r.width * r.height\n}\n\nfunc printArea(s\
    \ Shape) {\n    fmt.Println(\"Area:\", s.Area())\n}\n\nfunc main() {\n    circle\
    \ := Circle{radius: 5}\n    rectangle := Rectangle{width: 10, height: 5}\n   \
    \ // Both Circle and Rectangle satisfy the Shape interface\n    printArea(circle)\
    \   // Output: 78.5\n    printArea(rectangle) // Output: 50\n}\n```\n\nIn this\
    \ example:\n- The `Shape` interface defines the `Area` method, which both the\
