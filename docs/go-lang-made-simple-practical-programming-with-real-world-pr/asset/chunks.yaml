    \n在 Go 中，你可以向函数传递参数并让它们返回。让我们进一步探讨这一概念。\n\n#### 传递参数：\n\n参数按值传递。这意味着传递的是参数拷贝而不是实际值。如果你在函数内部修改参数，不会影响函数外的原始值。\n\
