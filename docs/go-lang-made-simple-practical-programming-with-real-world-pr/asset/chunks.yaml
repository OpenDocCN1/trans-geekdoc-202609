    \ any type that satisfies the `Shape` interface, demonstrating polymorphism in\
    \ Go.\n\n## 3. Embedding and Polymorphism\n\nGo uses embedding as a way to achieve\
    \ composition, which can be seen as an alternative to inheritance in traditional\
    \ OOP. When a struct is embedded within another struct, it allows the outer struct\
    \ to access the methods and fields of the embedded struct, effectively extending\
    \ its behavior.\n\n### 3.1. Struct Embedding\n\nEmbedding in Go provides a way\
