    \ and then handle the case that is ready. The order in which the messages are\
    \ received depends on the timing of each Goroutine’s execution.\n\n#### Select\
    \ with Default Case\n\nYou can also include a default case in select. The default\
    \ case is executed if no other cases are ready.\n\npackage main\n\nimport (\n\n\
    ​\"fmt\"\n\n​\"time\"\n\n)\n\nfunc main() {\n\n​ch := make(chan string)\n\n​go\
    \ func() {\n\n​time.Sleep(2 \\* time.Second)\n\n​ch <- \"Data from Goroutine\"\
    \n\n​}()\n\n​select {\n\n​case msg := <-ch:\n\n​fmt.Println(\"Received:\", msg)\n\
    \n​default:\n\n​fmt.Println(\"No data received\")\n\n​}\n\n}\n\nIn this example,\
    \ if the channel ch has no data to receive (because the Goroutine hasn’t sent\
    \ it yet), the default case will be executed immediately.\n\n### Conclusion\n\n\
    Go’s concurrency model, with Goroutines, Channels, and the select statement, is\
    \ powerful and lightweight. Goroutines allow concurrent execution, Channels enable\
    \ safe communication and synchronization, and the select statement makes it easy\
    \ to handle multiple channels simultaneously. Understanding these tools is key\
    \ to writing efficient, concurrent programs in Go.\n\n# Chapter 11: Networking\
    \ and HTTP\n\nIn this chapter, we will dive into networking concepts in Go, focusing\
    \ on the creation of HTTP servers and clients, handling RESTful APIs, and working\
    \ with WebSockets. Networking is a fundamental aspect of web development, and\
    \ Go is a great language for building networked applications due to its simplicity,\
    \ concurrency model, and rich standard library. By the end of this chapter, you\
    \ will have a solid understanding of how to work with HTTP servers, RESTful APIs,\
    \ and WebSockets in Go.\n\n### 11.1. Introduction to Networking in Go\n\nBefore\
    \ diving into HTTP servers and clients, let's first take a quick look at networking\
    \ in Go. Networking in Go is powered by the net and net/http packages in the standard\
    \ library. These packages allow you to create both server-side and client-side\
    \ network applications.\n\n●      The net package offers low-level network functionality\
    \ like TCP and UDP connections, while the net/http package provides higher-level\
    \ abstractions for HTTP communications.\n\n●      Go’s concurrency model (goroutines\
    \ and channels) is especially useful when handling multiple network connections,\
    \ as it allows you to scale and manage many clients efficiently.\n\nNow, let’s\
    \ break down the key sections of the chapter.\n\n* * *\n\n### 11.2. Creating HTTP\
    \ Servers in Go\n\nAn HTTP server handles requests from clients (browsers, applications)\
    \ and sends responses. Go makes it incredibly easy to create an HTTP server using\
    \ the net/http package.\n\n#### Basic HTTP Server Example\n\nThe simplest form\
    \ of an HTTP server in Go can be created using http.ListenAndServe function, which\
    \ listens for incoming HTTP requests and serves them using a handler.\n\npackage\
    \ main\n\nimport (\n\n​\"fmt\"\n\n​\"net/http\"\n\n)\n\n// HelloHandler is a function\
    \ that handles incoming HTTP requests.\n\nfunc HelloHandler(w http.ResponseWriter,\
    \ r \\*http.Request) {\n\n​// Send a simple \"Hello, World!\" message as a response\n\
    \n​fmt.Fprintf(w, \"Hello, World!\")\n\n}\n\nfunc main() {\n\n​// Register the\
    \ HelloHandler function for the root URL path \"/\"\n\n​http.HandleFunc(\"/\"\
    , HelloHandler)\n\n​// Start the HTTP server on port 8080\n\n​fmt.Println(\"Server\
    \ is running on http://localhost:8080\")\n\n​http.ListenAndServe(\":8080\", nil)\n\
    \n}\n\n#### How It Works:\n\n1.  http.HandleFunc(\"/\", HelloHandler) tells the\
    \ Go HTTP server to call HelloHandler when a request is made to the root path\
    \ (/).\n\n2.  http.ListenAndServe(\":8080\", nil) starts the server on port 8080\
    \ and listens for incoming HTTP requests.\n\n3.  The HelloHandler function is\
    \ responsible for handling incoming requests and responding with \"Hello, World!\"\
    .\n\n#### Running the Server:\n\n1.  Save the code in a file called main.go.\n\
    \n2.  Run the command go run main.go.\n\n3.  Open a browser and visit http://localhost:8080.\
    \ You should see \"Hello, World!\" displayed.\n\n* * *\n\n### 11.3. Creating HTTP\
    \ Clients in Go\n\nAn HTTP client sends requests to a server and processes the\
    \ responses. Go provides an easy-to-use HTTP client through the net/http package.\n\
    \n#### Basic HTTP Client Example\n\nHere is an example of how to create a basic\
    \ HTTP client that makes a GET request to a server.\n\npackage main\n\nimport\
    \ (\n\n​\"fmt\"\n\n​\"io/ioutil\"\n\n​\"net/http\"\n\n)\n\nfunc main() {\n\n​//\
    \ Send a GET request to the specified URL\n\n​response, err := http.Get(\"http://localhost:8080\"\
    )\n\n​if err != nil {\n\n​fmt.Println(\"Error sending request:\", err)\n\n​return\n\
    \n​}\n\n​defer response.Body.Close()\n\n​// Read and print the response body\n\
    \n​body, err := ioutil.ReadAll(response.Body)\n\n​if err != nil {\n\n​fmt.Println(\"\
    Error reading response:\", err)\n\n​return\n\n​}\n\n​fmt.Println(\"Response from\
    \ server:\", string(body))\n\n}\n\n#### How It Works:\n\n1.  http.Get(\"http://localhost:8080\"\
    ) sends a GET request to the server running on localhost:8080.\n\n2.  ioutil.ReadAll(response.Body)\
    \ reads the body of the response from the server.\n\n3.  The response body is\
    \ printed to the console.\n\n#### Running the Client:\n\n1.  Ensure the HTTP server\
    \ (main.go from the previous section) is running on localhost:8080.\n\n2.  Save\
    \ the HTTP client code in a file called client.go.\n\n3.  Run the command go run\
    \ client.go.\n\n4.  You should see the response \"Hello, World!\" printed in the\
    \ console.\n\n* * *\n\n### 11.4. Handling RESTful APIs in Go\n\nRESTful APIs (Representational\
    \ State Transfer) are a popular architectural style for designing web services.\
    \ A RESTful API typically allows clients to interact with resources using standard\
    \ HTTP methods such as GET, POST, PUT, and DELETE.\n\nIn Go, creating a RESTful\
    \ API involves defining various routes and HTTP handlers to handle different HTTP\
    \ methods.\n\n#### Building a Simple RESTful API\n\nLet’s build a simple RESTful\
    \ API that handles basic CRUD operations (Create, Read, Update, Delete) for a\
    \ list of users.\n\npackage main\n\nimport (\n\n​\"encoding/json\"\n\n​\"fmt\"\
    \n\n​\"net/http\"\n\n​\"sync\"\n\n)\n\n// User represents a user object.\n\ntype\
    \ User struct {\n\n​ID   int    \\`json:\"id\"\\`\n\n​Name string \\`json:\"name\"\
    \\`\n\n}\n\n// Create a slice to store users and a mutex for thread safety\n\n\
    var users = \\[\\]User{\n\n​{ID: 1, Name: \"John\"},\n\n​{ID: 2, Name: \"Jane\"\
    },\n\n}\n\nvar mu sync.Mutex\n\n// GetUsers returns the list of users.\n\nfunc\
    \ GetUsers(w http.ResponseWriter, r \\*http.Request) {\n\n​mu.Lock()\n\n​defer\
    \ mu.Unlock()\n\n​w.Header().Set(\"Content-Type\", \"application/json\")\n\n​json.NewEncoder(w).Encode(users)\n\
    \n}\n\n// CreateUser adds a new user to the list.\n\nfunc CreateUser(w http.ResponseWriter,\
    \ r \\*http.Request) {\n\n​mu.Lock()\n\n​defer mu.Unlock()\n\n​var newUser User\n\
    \n​err := json.NewDecoder(r.Body).Decode(&newUser)\n\n​if err != nil {\n\n​http.Error(w,\
    \ \"Invalid input\", http.StatusBadRequest)\n\n​return\n\n​}\n\n​// Assign a new\
    \ ID to the user and append it to the list\n\n​newUser.ID = len(users) + 1\n\n\
    ​users = append(users, newUser)\n\n​w.Header().Set(\"Content-Type\", \"application/json\"\
    )\n\n​w.WriteHeader(http.StatusCreated)\n\n​json.NewEncoder(w).Encode(newUser)\n\
    \n}\n\nfunc main() {\n\n​http.HandleFunc(\"/users\", GetUsers)\n\n​http.HandleFunc(\"\
    /users/create\", CreateUser)\n\n​fmt.Println(\"Server is running on http://localhost:8080\"\
    )\n\n​http.ListenAndServe(\":8080\", nil)\n\n}\n\n#### How It Works:\n\n1.  GetUsers\
    \ handles GET requests to the /users endpoint. It returns the list of users in\
    \ JSON format.\n\n2.  CreateUser handles POST requests to the /users/create endpoint.\
    \ It accepts a JSON body containing user data and adds the new user to the list.\n\
    \n#### Testing the API:\n\n1.  Start the server by running go run main.go.\n\n\
    2.  Use curl or a tool like Postman to test the API:\n\nTo get the list of users:\
    \  \n\ncurl http://localhost:8080/users\n\n○       \n\nTo create a new user: \
    \ \n\ncurl -X POST -d '{\"name\": \"Alice\"}' -H \"Content-Type: application/json\"\
    \ http://localhost:8080/users/create\n\n○       \n\n* * *\n\n### 11.5. WebSockets\
    \ in Go"
