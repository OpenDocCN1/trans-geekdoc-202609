    \  fmt.Println(\"Quotient:\", quotient)\n    fmt.Println(\"Remainder:\", remainder)\n\
    }\n```\n\n解释：\n- `divide` 函数返回两个值：`quotient` 和 `remainder`。\n- 在 `main` 函数中，我们调用\
    \ `divide(10, 3)`并将结果赋值给 `quotient` 和 `remainder`。\n\n输出：\n\nQuotient: 3\nRemainder:\
