    \ 结尾的独立文件中。测试函数本身必须以 `Test` 单词开头，并接收一个指向 `testing.T` 的指针作为参数。`testing.T` 类型提供了报告失败的方法。\n\
    \n这里是一个简单单元测试的示例：\n\n```go\npackage mathutils\n\nimport \"testing\"\n\n// 要测试的函数\n\
