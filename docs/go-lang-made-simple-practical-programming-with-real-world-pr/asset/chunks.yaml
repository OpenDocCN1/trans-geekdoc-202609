    \n示例：\n\n```python\nfruits = [\"apple\", \"banana\", \"cherry\"]\nfor fruit in\
    \ fruits:\n    print(f\"I love {fruit}.\")\n```\n\n输出：\n\nI love apple.\nI love\
    \ banana.\nI love cherry.\n\n* *\n\n### 3.2 Range 函数\n\n`range()` 函数生成一个数字序列，通常与\
    \ `for` 循环配合使用。\n\n语法：\n\n```python\nrange(start, stop, step)\n```\n\n- `start`:\
    \ 起始数字（默认值为 0）\n- `stop`: 结束数字（不包含）\n- `step`: 增量\n\n示例：\n\n```python\nfor i in\
    \ range(1, 10, 2):\n    print(i)\n```\n\n输出：\n\n1\n3\n5\n7\n9\n\n* *\n\n## 4.\
    \ Break、Continue\n\n这些语句允许对循环进行更精细的控制。\n\n### 4.1 Break 语句\n\n`break` 语句用于提前退出循环。\n\
    \n示例：\n\n```python\nfor num in range(1, 10):\n    if num == 5:\n        print(\"\
    Stopping the loop!\")\n        break\n    print(num)\n```\n\n输出：\n\n1\n2\n3\n\
    4\nStopping the loop!\n\n* *\n\n### 4.2 Continue 语句\n\n`continue` 语句跳过当前迭代的其余代码，进入下一次迭代。\n\
    \n示例：\n\n```python\nfor num in range(1, 6):\n    if num == 3:\n        print(\"\
