    # Chapter 10: Concurrency in Go


    Go, or Golang, is well-known for its concurrency model. Concurrency is the ability
    of a system to perform multiple tasks or operations simultaneously, and it’s an
    essential feature for building scalable, high-performance applications. Go has
    a unique approach to concurrency through its Goroutines and Channels. This chapter
    will delve into the core concepts of concurrency in Go, including Goroutines,
    Channels, Synchronization, and the select statement.


    ### Goroutines: Lightweight Threads


    One of the fundamental concepts in Go''s concurrency model is Goroutines. A Goroutine
    is a lightweight thread managed by the Go runtime. Goroutines are cheaper than
    threads in other programming languages, as they use far less memory and can be
    created in large numbers with minimal overhead.


    #### Creating Goroutines


    To start a Goroutine, we simply prepend the go keyword to a function call. Here''s
    an example of how to start a Goroutine:


    package main


    import (


    ​"fmt"


    ​"time"


    )


    func sayHello() {


    ​fmt.Println("Hello from Goroutine")


    }


    func main() {


    ​go sayHello() // This runs as a Goroutine


    ​time.Sleep(1 \* time.Second) // Giving Goroutine time to execute before program
    ends


    ​fmt.Println("Hello from Main")


    }


    In this example, the sayHello() function is called as a Goroutine in the main()
    function. We use time.Sleep() to allow the Goroutine enough time to execute before
    the main program terminates. Without this, the program might exit before the Goroutine
    runs.


    #### How Goroutines Work


    Under the hood, Go''s runtime schedules Goroutines to run on available threads.
    The Go scheduler dynamically assigns Goroutines to OS threads. When a Goroutine
    is blocked (for example, waiting on I/O or synchronization), the Go runtime schedules
    other Goroutines to run, ensuring the program doesn’t block unnecessarily.


    Goroutines are multiplexed onto a smaller number of operating system threads.
    This allows for extremely lightweight concurrent operations.


    #### Example: Goroutines with Multiple Functions


    Here''s an example with multiple Goroutines to see how concurrency improves the
    efficiency of running multiple tasks simultaneously:


    package main


    import (


    ​"fmt"


    ​"time"


    )


    func task1() {


    ​fmt.Println("Task 1 Started")


    ​time.Sleep(2 \* time.Second)


    ​fmt.Println("Task 1 Finished")


    }


    func task2() {


    ​fmt.Println("Task 2 Started")


    ​time.Sleep(1 \* time.Second)


    ​fmt.Println("Task 2 Finished")


    }


    func main() {


    ​go task1() // Run task1 as a Goroutine


    ​go task2() // Run task2 as a Goroutine


    ​// Wait for tasks to finish


    ​time.Sleep(3 \* time.Second)


    ​fmt.Println("All tasks completed")


    }


    Here, task1() takes 2 seconds to complete, while task2() takes 1 second. By running
    both tasks as Goroutines, the program doesn''t need to wait for task1() to finish
    before starting task2(). Instead, they run concurrently, reducing the overall
    execution time.


    ### Channels and Synchronization


    Goroutines are great for concurrent execution, but we often need a way for them
    to communicate and synchronize. In Go, Channels are used for this purpose. A channel
    allows one Goroutine to send data to another Goroutine, and it also helps synchronize
    them.


    #### What is a Channel?


    A Channel is a conduit through which data can be sent between Goroutines. Channels
    provide a way for Goroutines to communicate with each other and synchronize their
    execution.


    You can think of channels as being similar to pipes in Unix-like operating systems,
    through which information flows from one process to another.


    #### Creating and Using Channels


    To create a channel in Go, we use the make function. Here''s an example:


    package main


    import (


    ​"fmt"


    ​"time"


    )


    func sendData(ch chan string) {


    ​time.Sleep(1 \* time.Second)


    ​ch <- "Data from Goroutine" // Sending data to channel


    }


    func main() {


    ​ch := make(chan string) // Create a channel of type string


    ​go sendData(ch) // Start a Goroutine that sends data to the channel


    ​data := <-ch // Receive data from the channel


    ​fmt.Println(data)


    }


    In this example:


    1.  We create a channel ch of type string.


    2.  The sendData() function sends data into the channel after a 1-second delay.


    3.  The main() function receives that data and prints it.


    #### Channel Blocking Behavior


    Channels are blocking by default. When a Goroutine sends data to a channel, it
    blocks until another Goroutine receives the data. Similarly, when a Goroutine
    tries to receive data from a channel and there is no data, it blocks until data
    is available.


    You can also specify a buffered channel, which allows a limited number of values
    to be sent before the channel blocks. Here''s how to create a buffered channel:


    package main


    import (


    ​"fmt"


    )


    func main() {


    ​ch := make(chan string, 2) // Buffered channel with capacity for 2 items


    ​ch <- "First"


    ​ch <- "Second" // These two values are sent without blocking


    ​fmt.Println(<-ch) // Prints: First


    ​fmt.Println(<-ch) // Prints: Second


    }


    In this example, the buffered channel allows two values to be sent without blocking,
    and the data is received in the order it was sent.


    #### Synchronization with Channels


    Channels can also be used to synchronize Goroutines. For instance, you can use
    a channel to wait for a Goroutine to finish before proceeding:


    package main


    import (


    ​"fmt"


    )


    func doWork(ch chan bool) {


    ​fmt.Println("Doing work...")


    ​ch <- true // Signal completion of work


    }


    func main() {


    ​ch := make(chan bool)


    ​go doWork(ch)


    ​<-ch // Wait for signal from Goroutine


    ​fmt.Println("Work is done!")


    }


    In this example, the main() function waits for a signal from the doWork() Goroutine
    before proceeding.


    ### The Select Statement


    The select statement provides a way to wait on multiple channel operations. It''s
    like a switch statement but for channels. With select, we can wait on multiple
    channels, and it will execute the case that is ready first.


    #### Basic Usage of Select


    Here’s a simple example of using select to wait on two channels:


    package main


    import (


    ​"fmt"


    ​"time"


    )


    func channelOne(ch chan string) {


    ​time.Sleep(2 \* time.Second)


    ​ch <- "Channel One Data"


    }


    func channelTwo(ch chan string) {


    ​time.Sleep(1 \* time.Second)


    ​ch <- "Channel Two Data"


    }


    func main() {


    ​ch1 := make(chan string)


    ​ch2 := make(chan string)


    ​go channelOne(ch1)


    ​go channelTwo(ch2)


    ​select {


    ​case msg1 := <-ch1:


    ​fmt.Println("Received:", msg1)


    ​case msg2 := <-ch2:


    ​fmt.Println("Received:", msg2)


    ​}


    }


    In this example, select listens for data from both ch1 and ch2. Since ch2 will
    send data first (after 1 second), the select statement receives the data from
    ch2 and prints it.


    #### Multiple Case Statements


    You can handle multiple channels within a select statement:


    package main


    import (


    ​"fmt"


    ​"time"


    )


    func firstChannel(ch chan string) {


    ​time.Sleep(1 \* time.Second)


    ​ch <- "Data from First Channel"


    }


    func secondChannel(ch chan string) {


    ​time.Sleep(2 \* time.Second)


    ​ch <- "Data from Second Channel"


    }


    func main() {


    ​ch1 := make(chan string)


    ​ch2 := make(chan string)


    ​go firstChannel(ch1)


    ​go secondChannel(ch2)


    ​for i := 0; i < 2; i++ {


    ​select {


    ​case msg1 := <-ch1:


    ​fmt.Println("Received from ch1:", msg1)


    ​case msg2 := <-ch2:


    ​fmt.Println("Received from ch2:", msg2)


    ​}


    ​}


    }'
