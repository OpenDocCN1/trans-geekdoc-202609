    \n***\n\n### 11.2 在 Go 中创建 HTTP 服务器\n\nHTTP 服务器处理来自客户端（浏览器、应用程序）的请求并发送响应。Go 使得使用\
    \ `net/http` 包创建 HTTP 服务器变得极其简单。\n\n#### 基础 HTTP 服务器示例\n\nGo 中最简单的 HTTP 服务器可以使用\
    \ `http.ListenAndServe` 函数创建，该函数监听传入的 HTTP 请求，并使用处理器为它们提供服务。\n\n```go\npackage\
    \ main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n)\n\n// HelloHandler 是一个处理传入 HTTP\
    \ 请求的函数。\nfunc HelloHandler(w http.ResponseWriter, r *http.Request) {\n\t// 发送简单的\
    \ \"Hello, World!\" 消息作为响应\n\tfmt.Fprintf(w, \"Hello, World!\")\n}\n\nfunc main()\
    \ {\n\t// 为根 URL 注册 HelloHandler 函数\n\thttp.HandleFunc(\"/\", HelloHandler)\n\t\
    // 在端口 8080 上启动 HTTP 服务器\n\tfmt.Println(\"Server is running on http://localhost:8080\"\
    )\n\thttp.ListenAndServe(\":8080\", nil)\n}\n```\n\n#### 工作原理：\n\n1. `http.HandleFunc(\"\
    /\", HelloHandler)` 告诉 Go 服务器在对 `/` 发起请求时调用 `HelloHandler`。\n2. `http.ListenAndServe(\"\
    :8080\", nil)` 在端口 8080 上启动服务器。\n3. `HelloHandler` 负责处理请求并响应。\n\n#### 运行服务器：\n\
    \n1. 在 `main.go` 中保存代码。\n2. 运行命令 `go run main.go`。\n3. 在浏览器访问 `http://localhost:8080`。\n\
    \n***\n\n### 11.3 在 Go 中创建 HTTP 客户端\n\n`net/http` 包提供了创建 HTTP 客户端的简单方法。\n\n####\
    \ 基础 HTTP 客户端\n\n这是一个关于如何使用 HTTP 客户端的示例。\n\n```go\npackage main\n\nimport (\n\t\
    \"fmt\"\n\t\"io/ioutil\"\n\t\"net/http\"\n)\n\nfunc main() {\n\t// 发 GET 请求\n\t\
    resp, err := http.Get(\"http://localhost:8080\")\n\tif err != nil {\n\t\tfmt.Println(\"\
    Error:\", err)\n\t\treturn\n\t}\n\tdefer resp.Body.Close()\n\n\t// 读取响应体\n\tbody,\
    \ _ := ioutil.ReadAll(resp.Body)\n\tfmt.Println(\"Response:\", string(body))\n\
    }\n```\n\n#### 工作原理：\n\n1. `http.Get` 向服务器发送 GET 请求。\n2. `ioutil.ReadAll` 读取响应内容。\n\
    3. `resp.Body.Close()` 关闭响应体。\n\n#### 运行客户端：\n\n1. 在 `client.go` 中保存代码。\n2. 运行命令\
    \ `go run client.go`。\n3. 将看到响应。\n\n***\n\n### 11.4 在 Go 中处理 RESTful API\n\nRESTful\
    \ API（表现层状态转移）是一种流行的架构风格。在 Go 中，构建 RESTful API 涉及到定义路由和处理方法。\n\n#### 构建简单的 RESTful\
    \ API\n\n这是一个处理用户列表的简单 RESTful API 示例。\n\n```go\npackage main\n\nimport (\n\t\"\
    encoding/json\"\n\t\"fmt\"\n\t\"net/http\"\n\t\"sync\"\n)\n\n// User 代表用户对象\n\
    type User struct {\n\tID   int    `json:\"id\"`\n\tName string `json:\"name\"\
    `\n}\n\nvar (\n\tusers = []User{\n\t\t{ID: 1, Name: \"John\"},\n\t\t{ID: 2, Name:\
    \ \"Jane\"},\n\t}\n\tmu sync.Mutex\n)\n\n// GetUsers 返回用户列表\nfunc GetUsers(w http.ResponseWriter,\
    \ r *http.Request) {\n\tmu.Lock()\n\tdefer mu.Unlock()\n\tw.Header().Set(\"Content-Type\"\
    , \"application/json\")\n\tjson.NewEncoder(w).Encode(users)\n}\n\n// CreateUser\
    \ 向列表添加新用户\nfunc CreateUser(w http.ResponseWriter, r *http.Request) {\n\tmu.Lock()\n\
    \tdefer mu.Unlock()\n\tvar newUser User\n\terr := json.NewDecoder(r.Body).Decode(&newUser)\n\
    \tif err != nil {\n\t\thttp.Error(w, \"Invalid input\", http.StatusBadRequest)\n\
    \t\treturn\n\t}\n\t// 为用户分配新 ID 并将其添加到列表中\n\tnewUser.ID = len(users) + 1\n\tusers\
    \ = append(users, newUser)\n\tw.Header().Set(\"Content-Type\", \"application/json\"\
    )\n\tw.WriteHeader(http.StatusCreated)\n\tjson.NewEncoder(w).Encode(newUser)\n\
    }\n\nfunc main() {\n\thttp.HandleFunc(\"/users\", GetUsers)\n\thttp.HandleFunc(\"\
    /users/create\", CreateUser)\n\tfmt.Println(\"Server is running on http://localhost:8080\"\
    )\n\thttp.ListenAndServe(\":8080\", nil)\n}\n```\n\n#### 工作原理：\n\n1. `GetUsers`\
    \ 处理对 `/users` 端的 GET 请求，以 JSON 格式返回列表。\n2. `CreateUser` 处理对 `/users/create` 端的\
    \ POST 请求。它接受包含用户数据的 JSON 体并添加新用户。\n3. `sync.Mutex` 确保线程安全。\n\n#### 测试 API：\n\n\
    1. 运行服务器 `go run main.go`。\n2. 使用 `curl` 测试 API：\n\n- 获取用户列表：\n  `curl http://localhost:8080/users`\n\
