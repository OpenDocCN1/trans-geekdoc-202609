    # Chapter 7: Maps and Structs


    In this chapter, we will explore two important concepts in the Go programming
    language: Maps and Structs. These two data structures are essential for organizing
    and managing data in your Go programs. Maps are used to store key-value pairs,
    while structs allow you to create complex data types by grouping different data
    elements. We will cover how to define, use, and manipulate these data structures,
    along with examples and practical use cases.


    * * *


    ### 1\. Understanding Maps in Go


    Maps in Go are used to store a collection of key-value pairs. The key acts as
    an identifier, and the value is the data associated with that key. Maps in Go
    are similar to dictionaries in Python or hash tables in other programming languages.


    #### Defining a Map


    To define a map in Go, you use the make function or the map literal syntax. The
    syntax for creating a map is:


    map\[keyType\]valueType


    Where keyType is the type of the keys, and valueType is the type of the values.
    Here are a few ways to define a map:


    ●      Using make function:


    m := make(map\[string\]int)


    This creates a map where the keys are of type string and the values are of type
    int.


    ●      Using map literal:


    m := map\[string\]int{


    "apple":  5,


    "banana": 10,


    }


    This creates and initializes a map with predefined key-value pairs.


    #### Adding and Accessing Elements


    You can add elements to a map by assigning a value to a key:


    m := make(map\[string\]int)


    m\["apple"\] = 5


    m\["banana"\] = 10


    To access a value, you use the key:


    fmt.Println(m\["apple"\]) // Output: 5


    fmt.Println(m\["banana"\]) // Output: 10


    #### Checking if a Key Exists


    When accessing a map, it''s important to check if the key exists. You can do this
    by using a second value in the assignment:


    value, ok := m\["apple"\]


    if ok {


    fmt.Println("Found:", value)  // Output: Found: 5


    } else {


    fmt.Println("Key not found")


    }


    The ok variable will be true if the key exists and false if it does not.


    #### Deleting an Element


    You can remove an element from a map using the delete function:


    delete(m, "banana")


    fmt.Println(m)  // Output: map\[apple:5\]


    #### Iterating Over a Map


    You can iterate over the elements of a map using a for loop:


    for key, value := range m {


    fmt.Println(key, value)


    }


    This will print each key-value pair in the map.


    * * *


    ### 2\. Defining and Using Structs


    A struct is a composite data type in Go that groups together variables (fields)
    under a single name. Each field can have a different data type. Structs are useful
    when you need to model real-world objects or concepts in your code.


    #### Defining a Struct


    You can define a struct by using the type keyword followed by the name of the
    struct and its fields. For example, let’s define a struct to represent a Person:


    type Person struct {


    Name    string


    Age     int


    Address string


    }


    This struct has three fields: Name (string), Age (int), and Address (string).
    You can then create an instance of this struct:


    p := Person{


    Name:    "John Doe",


    Age:     30,


    Address: "123 Main St",


    }


    Alternatively, you can use named fields for initialization:


    p := Person{"John Doe", 30, "123 Main St"}


    #### Accessing Struct Fields


    You can access the fields of a struct using the dot (.) operator:


    fmt.Println(p.Name)    // Output: John Doe


    fmt.Println(p.Age)     // Output: 30


    fmt.Println(p.Address) // Output: 123 Main St


    #### Modifying Struct Fields


    You can modify the fields of a struct by directly assigning values to them:


    p.Age = 31


    fmt.Println(p.Age) // Output: 31


    #### Structs with Pointers


    If you want to modify the fields of a struct within a function, you should pass
    a pointer to the struct:


    func changeName(p \*Person, newName string) {


    p.Name = newName


    }


    changeName(&p, "Jane Doe")


    fmt.Println(p.Name) // Output: Jane Doe


    * * *


    ### 3\. Nested Structs and Struct Methods


    #### Nested Structs


    A struct can contain other structs as fields, which is called a nested struct.
    This allows you to model more complex relationships between data.


    For example, let’s define a Car struct that contains a Person struct:


    type Person struct {


    Name    string


    Age     int


    }


    type Car struct {


    Make  string


    Model string


    Owner Person


    }


    Here, the Car struct has a field Owner of type Person. You can create a Car with
    a Person as its owner:


    owner := Person{Name: "John Doe", Age: 30}


    car := Car{


    Make:  "Toyota",


    Model: "Corolla",


    Owner: owner,


    }


    You can access the nested struct fields using the dot operator:


    fmt.Println(car.Owner.Name)  // Output: John Doe


    #### Struct Methods


    Go allows you to define methods for structs. A method is a function that is associated
    with a type, and it operates on instances of that type.


    You define a method by specifying the type it belongs to, followed by the function
    name and parameters. Here’s an example:


    type Circle struct {


    Radius float64


    }


    func (c Circle) Area() float64 {


    return 3.14 \* c.Radius \* c.Radius


