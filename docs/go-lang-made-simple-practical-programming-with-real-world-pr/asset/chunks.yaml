    # Chapter 8: Object-Oriented Programming in Go


    Object-Oriented Programming (OOP) is a programming paradigm based on the concept
    of objects, which contain both data (attributes) and methods (functions or procedures).
    Traditional OOP languages like Java and C++ rely heavily on classes to define
    objects, but Go approaches OOP in a unique way. While Go doesn’t have classes
    like other OOP languages, it still supports OOP principles like encapsulation,
    inheritance, and polymorphism through a combination of structs, interfaces, and
    methods.


    In this chapter, we will explore Go’s approach to OOP, focusing on how it implements
    methods and interfaces, and understanding the concepts of embedding and polymorphism.
    We will provide practical examples to make each concept clearer and show how they
    can be used in real-world applications.


    ### 1\. Understanding Go’s Approach to OOP


    In traditional OOP, a class is the central building block that defines the structure
    and behavior of objects. However, Go uses structs to define the data structure
    and methods to define behavior. Instead of relying on inheritance to extend functionality,
    Go uses composition (through struct embedding) and interfaces to enable polymorphism.


    #### 1.1. Structs in Go


    A struct is a composite data type in Go that groups together variables (fields)
    under one name. While a struct is not an object in the traditional sense, it can
    serve as the foundation for encapsulation and behavior definition, which are key
    elements of OOP.


    Here’s an example of a struct in Go:


    package main


    import "fmt"


    // Define a struct for a ''Car''


    type Car struct {


    make  string


    model string


    year  int


    }


    // Define a method for the ''Car'' struct


    func (c Car) DisplayInfo() {


    fmt.Printf("Car: %s %s, Year: %d\\n", c.make, c.model, c.year)


    }


    func main() {


    // Creating an instance of the ''Car'' struct


    myCar := Car{make: "Toyota", model: "Corolla", year: 2022}


    // Calling the method to display car info


    myCar.DisplayInfo()


    }


    In this example:


    ●      The Car struct defines the attributes (make, model, year).


    ●      The DisplayInfo method is attached to the Car struct to provide functionality
    (showing car information).


    #### 1.2. Methods in Go


    In Go, methods are functions that are associated with a particular type (usually
    a struct). They are defined by declaring a receiver, which specifies which type
    the method is associated with. A method can either be associated with a value
    receiver or a pointer receiver, depending on whether you want to modify the original
    struct or work with a copy.


    Example of a method with a value receiver:


    package main


    import "fmt"


    type Rectangle struct {


    width, height int


    }


    // Method with a value receiver


    func (r Rectangle) Area() int {


    return r.width \* r.height


    }


    func main() {


    rect := Rectangle{width: 10, height: 5}


    fmt.Println("Area of Rectangle:", rect.Area())  // Output: Area of Rectangle:
    50


    }


    In this example, the Area method calculates the area of the rectangle. The receiver
    r is a value receiver, meaning it works with a copy of the struct.


    Example of a method with a pointer receiver:


    package main


    import "fmt"


    type Counter struct {


    count int


    }


    // Method with a pointer receiver


    func (c \*Counter) Increment() {


    c.count++


    }


    func main() {


    counter := &Counter{count: 0}


    counter.Increment()  // Incrementing the counter


    fmt.Println("Counter value:", counter.count)  // Output: Counter value: 1


    }


    Here, the Increment method takes a pointer receiver \*Counter, meaning it modifies
    the original Counter struct.


    ### 2\. Methods and Interfaces in Go


    Interfaces in Go are a way to specify behavior without enforcing a particular
    implementation. Go’s interfaces are implicit, meaning that a type does not need
    to declare that it implements an interface. If a type has the methods that the
    interface requires, it automatically satisfies the interface.


    #### 2.1. Defining and Using Interfaces


    Let’s define an interface and see how Go handles polymorphism through interfaces:


    package main


    import "fmt"


    // Define an interface


    type Shape interface {


    Area() float64


    }


    // Define structs that implement the interface


    type Circle struct {


    radius float64


    }


    type Rectangle struct {


    width, height float64


    }


    // Method for Circle


    func (c Circle) Area() float64 {


    return 3.14 \* c.radius \* c.radius


    }


    // Method for Rectangle


    func (r Rectangle) Area() float64 {


    return r.width \* r.height


    }


    func printArea(s Shape) {


    fmt.Println("Area:", s.Area())


    }


    func main() {


    circle := Circle{radius: 5}


    rectangle := Rectangle{width: 10, height: 5}


    // Both Circle and Rectangle satisfy the Shape interface


    printArea(circle)      // Output: Area: 78.5


    printArea(rectangle)   // Output: Area: 50


    }


    In this example:


    ●      The Shape interface defines the Area method, which both the Circle and
    Rectangle structs implement.


    ●      The printArea function accepts any type that satisfies the Shape interface,
    demonstrating polymorphism in Go.


    ### 3\. Embedding and Polymorphism


    Go uses embedding as a way to achieve composition, which can be seen as an alternative
    to inheritance in traditional OOP languages. When a struct is embedded within
    another struct, it allows the outer struct to access the methods and fields of
    the embedded struct, effectively extending its behavior.


    #### 3.1. Struct Embedding


    Embedding in Go provides a way to "inherit" behavior without actually creating
    a hierarchy of classes.


    package main


    import "fmt"


    // Base struct


    type Animal struct {


    name string


    }


    func (a Animal) Speak() {


    fmt.Println("Animal speaks")


    }


    // Dog struct embeds Animal


    type Dog struct {


    Animal  // Embedding Animal struct


    breed string


    }


    func main() {


    dog := Dog{Animal: Animal{name: "Buddy"}, breed: "Golden Retriever"}


    // Accessing the embedded struct''s method


    fmt.Println(dog.name)  // Output: Buddy


    dog.Speak()            // Output: Animal speaks


    }


    In this example:


    ●      The Dog struct embeds the Animal struct.


    ●      The Speak method of the embedded Animal struct is directly accessible via
    the Dog struct, showing that Go allows composition instead of inheritance.


