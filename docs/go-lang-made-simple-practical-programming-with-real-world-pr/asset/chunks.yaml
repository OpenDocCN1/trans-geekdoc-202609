    \ msg := <-ch:\n\t\tfmt.Println(\"Received:\", msg)\n\tdefault:\n\t\tfmt.Println(\"\
    No data received\")\n\t}\n}\n```\n\n在这个示例中，如果通道 `ch` 没有数据可以接收（因为 `Goroutine` 尚未发送它），则将立即执行\
    \ `default` case。\n\n### 结论\n\nGo 的并发模型结合 `Goroutines`、`Channels` 和 `select` 语句，既强大又轻量级。`Goroutines`\
