    \ Animal\ntype Dog struct {\n    Animal // 嵌入 Animal 结构体\n    breed string\n}\n\
    \nfunc main() {\n    dog := Dog{Animal: Animal{name: \"Buddy\"}, breed: \"Golden\
    \ Retriever\"}\n    // 访问嵌入结构体的方法\n    fmt.Println(dog.name) // 输出: Buddy\n  \
    \  dog.Speak()           // 输出: Animal speaks\n}\n```\n\n在本示例中：\n- `Dog` 结构体嵌入了\
    \ `Animal` 结构体。\n- 嵌入 `Animal` 结构体的 `Speak` 方法可以通过 `Dog` 结构体直接访问，表明 Go 使用组合而不是继承。\n\
    \n"
