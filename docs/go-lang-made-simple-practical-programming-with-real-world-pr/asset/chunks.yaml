    # Chapter 4: Control Flow Statements


    Control flow statements are a fundamental part of programming that allows you
    to dictate the flow of your program based on conditions and iterations. In Python,
    these include if-else statements, loops, and mechanisms like break and continue
    to manage loop behavior. This chapter will cover the key control flow statements
    in Python in detail.


    * * *


    #### 1\. If-Else Statements


    The if-else statement allows you to execute specific blocks of code based on conditions.


    Syntax:


    if condition:


    \# Block of code if condition is True


    elif another\_condition:


    \# Block of code if another\_condition is True


    else:


    \# Block of code if none of the conditions are True


    Example:


    age = 18


    if age < 18:


    print("You are a minor.")


    elif age == 18:


    print("You are just 18!")


    else:


    print("You are an adult.")


    Output:


    You are just 18!


    * * *


    #### 2\. Switch Statements (Using match in Python)


    Python does not have traditional switch statements like some other languages,
    but it introduced the match statement in version 3.10. This acts as a pattern-matching
    construct.


    Syntax:


    match variable:


    case pattern1:


    \# Block of code for pattern1


    case pattern2:


    \# Block of code for pattern2


    case \_:


    \# Block of code if no patterns match (default case)


    Example:


    def day\_of\_week(day):


    match day:


    case 1:


    return "Monday"


    case 2:


    return "Tuesday"


    case 3:


    return "Wednesday"


    case 4:


    return "Thursday"


    case 5:


    return "Friday"


    case 6:


    return "Saturday"


    case 7:


    return "Sunday"


    case \_:


    return "Invalid day"


    print(day\_of\_week(5))


    print(day\_of\_week(9))


    Output:


    Friday


    Invalid day


    * * *


    #### 3\. Loops: For and Range


    Loops allow you to execute a block of code multiple times.


    * * *


    3.1 For Loop


    A for loop in Python iterates over a sequence (like a list, tuple, string, or
    range).


    Syntax:


    for variable in sequence:


    \# Block of code to repeat


    Example:


    fruits = \["apple", "banana", "cherry"\]


    for fruit in fruits:


    print(f"I love {fruit}.")


    Output:


    I love apple.


    I love banana.


    I love cherry.


    * * *


    3.2 Range Function


    The range() function generates a sequence of numbers and is commonly used with
    for loops.


    Syntax:


    range(start, stop, step)


    ●      start: Starting number (default is 0)


    ●      stop: Ending number (exclusive)


    ●      step: Increment/decrement (default is 1)


    Example:


    for i in range(1, 10, 2):


    print(i)


    Output:


    1


    3


    5


    7


    9


    * * *


    #### 4\. Break, Continue, and Labels


    These statements allow finer control over loops.


    * * *


    4.1 Break Statement


    The break statement is used to exit a loop prematurely.


    Example:


    for num in range(1, 10):


    if num == 5:


    print("Stopping the loop!")


    break


    print(num)


    Output:


    1


    2


    3


    4


    Stopping the loop!


    * * *


    4.2 Continue Statement


    The continue statement skips the rest of the code in the current iteration and
    moves to the next iteration.


    Example:


    for num in range(1, 6):


    if num == 3:


    print("Skipping 3")


    continue


    print(num)


    Output:


    1


    2


    Skipping 3


    4


    5


    * * *


    4.3 Labels (Simulated in Python)


    Python does not support labeled loops directly, but you can achieve similar behavior
    using functions or flags. Here’s an example:


    Example:


    for i in range(1, 4):


    for j in range(1, 4):


    if i == 2 and j == 2:


    print("Breaking out of both loops")


    break


    print(f"i={i}, j={j}")


    else:


    continue


    break


    Output:


    i=1, j=1


    i=1, j=2


    i=1, j=3


    i=2, j=1


    Breaking out of both loops


    * * *


    #### Practical Example: Nested Control Flow


    Combining if-else, for loops, and break/continue can handle complex logic.


    Problem: Write a program that checks for prime numbers in a range and skips even
    numbers except 2.


    Solution:


    def find\_primes(limit):


    for num in range(2, limit + 1):


    if num > 2 and num % 2 == 0:


    continue  # Skip even numbers except 2


    for divisor in range(2, int(num \*\* 0.5) + 1):


    if num % divisor == 0:


    break  # Not a prime number


    else:


    print(f"{num} is a prime number.")


    find\_primes(10)


    Output:


    2 is a prime number.


    3 is a prime number.


    5 is a prime number.


    7 is a prime number.


    * * *


    ### Summary


    ●      If-Else Statements: Control decision-making based on conditions.


    ●      Switch Statements (match): Simplifies multi-condition logic.


    ●      Loops: Perform repetitive tasks efficiently.


    ○      For Loop: Iterates over a sequence.


    ○      Range Function: Generates number sequences.


    ●      Break and Continue: Manage loop behavior.


    ●      Labels: Simulate multi-loop exit.


    By mastering these control flow tools, you can create complex, efficient, and
    logical Python programs.


    # Chapter 5: Functions in Go


    In this chapter, we''ll explore one of the most fundamental concepts in Go programming:
    functions. Functions are used to encapsulate code into reusable blocks that can
    perform specific tasks. This makes the code more modular, maintainable, and readable.


    We will break down the following key topics related to functions in Go:


    ●      Defining and Calling Functions


    ●      Passing Arguments and Returning Values


    ●      Variadic Functions


    ●      Recursion


    Let''s dive into each of these concepts in detail.


    * * *


    ### 1\. Defining and Calling Functions


    In Go, a function is defined using the func keyword, followed by the name of the
    function, a list of parameters (optional), and the return type (also optional).


    #### Syntax for Defining a Function:


    func FunctionName(parameter1 type1, parameter2 type2) returnType {


    // Function body


    }


    ●      func is the keyword that defines a function.


    ●      FunctionName is the name of the function.


    ●      parameter1, parameter2, etc., are the parameters the function takes (if
    any), and type1, type2 are their types.


    ●      returnType is the type of the value the function returns (if any).


    #### Example: Simple Function


    Here’s a simple function that adds two integers:


    package main


    import "fmt"


    // Defining the function


    func add(a int, b int) int {


    return a + b


    }


    func main() {


    // Calling the function


    result := add(5, 3)


    fmt.Println("The sum is:", result)


    }


    Explanation:


    ●      The function add takes two parameters, a and b, both of type int.


    ●      It returns an int, which is the sum of a and b.


    ●      Inside the main function, we call add(5, 3) and store the result in the
    variable result, which is then printed.


    #### Output:


    The sum is: 8


    * * *


    ### 2\. Passing Arguments and Returning Values


    In Go, you can pass arguments to functions and have them return values. Let’s
    explore the concept in more detail.


    #### Passing Arguments:


    Arguments are passed to functions by value. This means that a copy of the argument
    is passed to the function, not the actual value. If you modify the argument inside
    the function, it does not affect the original value outside the function.


    #### Returning Values:


    Functions can return one or more values. If a function returns more than one value,
    they are separated by commas.


    #### Example: Function with Multiple Return Values


    Here’s an example of a function that returns multiple values:


    package main


    import "fmt"


    // Function that returns two values


    func divide(a, b int) (int, int) {


    quotient := a / b


    remainder := a % b


    return quotient, remainder


    }


    func main() {


    quotient, remainder := divide(10, 3)


    fmt.Println("Quotient:", quotient)


    fmt.Println("Remainder:", remainder)


    }


