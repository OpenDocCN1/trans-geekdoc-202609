    \ D. 表格驱动测试\n\nGo 的测试范式通常使用表格驱动测试（table-driven tests）。这种方法允许你在单个函数中定义多个测试用例，提高代码的可读性和可维护性。\n\
    \n```go\npackage mathutils\n\nimport \"testing\"\n\nfunc TestAdd(t *testing.T)\
