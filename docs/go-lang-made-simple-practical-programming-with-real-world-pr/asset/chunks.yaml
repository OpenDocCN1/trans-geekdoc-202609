    ### Key Takeaways


    ●      Variables in Go are declared using var or short-hand syntax (:\=).


    ●      Go provides a wide range of data types, both basic and composite, to handle
    various kinds of data.


    ●      Type conversion in Go must be explicit, ensuring type safety.


    ●      Use the strconv package for converting between strings and numeric types.


    By mastering variables and data types, you build a solid foundation for creating
    robust Go programs.


    # Chapter 3: Operators and Expressions


    In Python, operators and expressions are fundamental building blocks that allow
    us to perform operations on variables and values. This chapter explores different
    types of operators and how to use them in expressions, along with practical examples.


    * * *


    ### 3.1 Arithmetic, Relational, and Logical Operators


    #### Arithmetic Operators


    Arithmetic operators are used to perform mathematical operations like addition,
    subtraction, multiplication, etc.


    | Operator || Description || Example |


    | --- | --- | --- |


    | + || Addition || 5 + 3 = 8 |


    | \- || Subtraction || 5 - 3 = 2 |


    | \* || Multiplication || 5 \* 3 = 15 |


    | / || Division || 5 / 3 = 1.6667 |


    | // || Floor Division || 5 // 3 = 1 |


    | % || Modulus (Remainder) || 5 % 3 = 2 |


    | \*\* || Exponentiation || 5 \*\* 3 = 125 |


    Example:


    \# Arithmetic operations


    a = 10


    b = 3


    print("Addition:", a + b)        # 13


    print("Subtraction:", a - b)     # 7


    print("Multiplication:", a \* b)  # 30


    print("Division:", a / b)        # 3.3333


    print("Floor Division:", a // b) # 3


    print("Modulus:", a % b)         # 1


    print("Exponentiation:", a \*\* b) # 1000


    * * *


    #### Relational Operators


    Relational operators compare values and return a Boolean (True or False).


    | Operator || Description || Example |


    | --- | --- | --- |


    | \== || Equal to || 5 == 3 -> False |


    | != || Not equal to || 5 != 3 -> True |


    | \> || Greater than || 5 > 3 -> True |


    | < || Less than || 5 < 3 -> False |


    | \>= || Greater than or equal to || 5 >= 3 -> True |


    | <= || Less than or equal to || 5 <= 3 -> False |


    Example:


    \# Relational operations


    x = 10


    y = 20


    print("Equal:", x == y)          # False


    print("Not Equal:", x != y)      # True


    print("Greater:", x > y)         # False


    print("Less:", x < y)            # True


    print("Greater or Equal:", x >= y) # False


    print("Less or Equal:", x <= y)    # True


    * * *


    #### Logical Operators


    Logical operators are used to combine conditional statements.


    | Operator || Description || Example |


    | --- | --- | --- |


    | and || Logical AND || True and False -> False |


    | or || Logical OR || True or False -> True |


    | not || Logical NOT || not True -> False |


    Example:


    \# Logical operations


    a = True


    b = False


    print("AND:", a and b)  # False


    print("OR:", a or b)    # True


    print("NOT:", not a)    # False


    * * *


    ### 3.2 Bitwise and Assignment Operators


    #### Bitwise Operators


    Bitwise operators perform operations on binary representations of integers.


    | Operator || Description || Example |


    | --- | --- | --- |


    | & || Bitwise AND || 5 & 3 = 1 |


    | \` || \` || Bitwise OR |


    | ^ || Bitwise XOR || 5 ^ 3 = 6 |


    | ~ || Bitwise NOT || ~5 = -6 |


    | << || Left Shift || 5 << 1 = 10 |


    | \>> || Right Shift || 5 >> 1 = 2 |


    Example:


    \# Bitwise operations


    x = 5  # Binary: 101


    y = 3  # Binary: 011


    print("Bitwise AND:", x & y)  # 1


    print("Bitwise OR:", x | y)   # 7


    print("Bitwise XOR:", x ^ y)  # 6


    print("Bitwise NOT:", ~x)     # -6


    print("Left Shift:", x << 1)  # 10


    print("Right Shift:", x >> 1) # 2


    * * *


    #### Assignment Operators


    Assignment operators are used to assign values to variables, often combining other
    operations.


    | Operator || Description || Example |


    | --- | --- | --- |


    | \= || Assignment || x = 5 |


    | += || Add and assign || x += 3 |


    | \-= || Subtract and assign || x -= 3 |


    | \*= || Multiply and assign || x \*= 3 |


    | /= || Divide and assign || x /= 3 |


    | //= || Floor divide and assign || x //= 3 |


    | %= || Modulus and assign || x %= 3 |


    | \*\*= || Exponentiate and assign || x \*\*= 3 |


    | &= || Bitwise AND and assign || x &= 3 |


    | \` || \=\` || Bitwise OR and assign |


    | ^= || Bitwise XOR and assign || x ^= 3 |


    | <<= || Left Shift and assign || x <<= 3 |


    | \>>= || Right Shift and assign || x >>= 3 |


    Example:


    \# Assignment operations


    x = 10


    print("Initial Value:", x) # 10


    x += 5


    print("After += 5:", x)    # 15


    x \*= 2


    print("After \*= 2:", x)    # 30


    x //= 3


    print("After //= 3:", x)   # 10


    * * *


    ### 3.3 Working with Expressions


    Expressions combine values, variables, and operators to produce a result. Python
    evaluates expressions following the precedence and associativity rules.


    #### Operator Precedence


    | Precedence || Operator |


    | --- | --- |


    | Highest || () |


    |  || \*\* |


    |  || +x, -x, ~x |


    |  || \*, /, //, % |


    |  || +, - |


    |  || <<, >> |


    |  || & |


    |  || ^ |


    |  || \` |


    |  || \==, !=, >, <, >=, <= |


    | Lowest || not, and, or |


    #### Example with Precedence:


    \# Expression with precedence


    result = 5 + 3 \* 2 \*\* 2 - 4 // 2


    \# Step-by-step:


    \# 1. 2 \*\* 2 = 4


    \# 2. 3 \* 4 = 12


    \# 3. 4 // 2 = 2


    \# 4. 5 + 12 - 2 = 15


    print("Result:", result)  # 15


    #### Complex Expressions


    \# Using logical, relational, and arithmetic operators


    x = 10


    y = 5


    z = 2


    result = (x + y > 15) and (z \* 2 == 4)


    \# Step-by-step:


    \# 1. x + y > 15 -> 10 + 5 > 15 -> False


    \# 2. z \* 2 == 4 -> 2 \* 2 == 4 -> True


    \# 3. False and True -> False'
