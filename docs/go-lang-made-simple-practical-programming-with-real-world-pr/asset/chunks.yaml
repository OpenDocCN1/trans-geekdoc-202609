    # Chapter 12: Error Handling and Debugging


    ## Introduction


    In any programming language, handling errors effectively is crucial for building
    robust and reliable applications. This chapter delves into error handling in Go,
    with a focus on understanding the different error types, custom errors, panic
    and recover mechanisms, and debugging techniques. These tools ensure that your
    Go programs can gracefully handle unexpected situations and continue functioning,
    providing a better user experience and improving the code''s reliability and maintainability.


    ### The "Error" Type and Custom Errors


    In Go, errors are treated as values, and they are implemented using the built-in
    error type. The error type is an interface that has one method:


    type error interface {


    Error() string


    }


    This means any type that implements the Error() method can be considered an error
    in Go. The Error() method returns a string that describes the error.


    #### Using the Built-in error Type


    Go’s built-in errors package allows you to create errors easily. Here is an example
    of how to use the errors.New() function to create an error:


    package main


    import (


    "errors"


    "fmt"


    )


    func divide(a, b int) (int, error) {


    if b == 0 {


    return 0, errors.New("division by zero")


    }


    return a / b, nil


    }


    func main() {


    result, err := divide(10, 0)


    if err != nil {


    fmt.Println("Error:", err)


    } else {


    fmt.Println("Result:", result)


    }


    }


    In this example, we define a divide function that returns an error if the denominator
    is zero. The errors.New() function is used to create the error message. If the
    error occurs, it is returned alongside a zero value (in this case, an integer
    0), and the caller can handle it accordingly.


    #### Creating Custom Error Types


    While the built-in error type works for many cases, you might want to create more
    specific errors that contain additional information. For this, you can define
    custom error types. Go allows you to create a custom type that implements the
    error interface.


    Here’s an example of how to define and use custom error types:


    package main


    import (


    "fmt"


    )


    type DivideError struct {


    Dividend, Divisor int


    Message           string


    }


    func (e \*DivideError) Error() string {


    return fmt.Sprintf("cannot divide %d by %d: %s", e.Dividend, e.Divisor, e.Message)


    }


    func divide(a, b int) (int, error) {


    if b == 0 {


    return 0, &DivideError{Dividend: a, Divisor: b, Message: "division by zero"}


    }


    return a / b, nil


    }


    func main() {


    result, err := divide(10, 0)


    if err != nil {


    fmt.Println("Error:", err)


    } else {


    fmt.Println("Result:", result)


    }


    }


    In this example:


    ●      We define a custom error type DivideError with fields to hold the dividend,
    divisor, and an error message.


    ●      The Error() method is implemented for DivideError, which formats a custom
    error message.


    ●      If division by zero occurs, the divide function returns an instance of
    DivideError.


    Custom error types are helpful when you need to capture more context about the
    error, making it easier to debug and handle specific error cases.


    ### Panic and Recover


    In Go, you can handle unexpected situations using panic and recover. These are
    typically used for situations where the program cannot continue safely, such as
    in the case of a serious internal error.


    #### Panic


    A panic is used to stop the normal execution of a program and initiate a stack
    unwinding process. When a function calls panic(), the normal execution is halted,
    and the program starts unwinding, executing deferred functions (if any), and eventually
    terminating.


    package main


    import "fmt"


    func divide(a, b int) int {


    if b == 0 {


    panic("division by zero")


    }


    return a / b


    }


    func main() {


    fmt.Println("Before division")


    result := divide(10, 0) // This will panic


    fmt.Println("Result:", result)


    }


    In this example, if the divisor is zero, a panic is triggered with the message
    "division by zero". When the panic occurs, the program stops executing the normal
    flow, and an error message is displayed.


    #### Recover


    recover is used to handle a panic and prevent the program from terminating abruptly.
    It is only effective when called inside a deferred function. The recover function
    retrieves the value passed to the panic() and allows the program to resume execution.


    Here is an example of using panic and recover together:


    package main


    import "fmt"


    func safeDivide(a, b int) (result int, err string) {


    defer func() {


    if r := recover(); r != nil {


    err = fmt.Sprintf("Recovered from panic: %v", r)


    }


    }()


    if b == 0 {


    panic("division by zero")


    }


    result = a / b


    return


    }


    func main() {


    result, err := safeDivide(10, 0)


    if err != "" {


    fmt.Println("Error:", err)


    } else {


    fmt.Println("Result:", result)


    }


    }


    In this example:


    ●      The safeDivide function uses a deferred function that calls recover to
    handle any panic.


    ●      If the divisor is zero, the panic is triggered, and recover captures it,
    returning a descriptive error message without crashing the program.


    ●      The program continues execution, and the error is printed instead of the
    program terminating.


