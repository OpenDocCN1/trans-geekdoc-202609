    # Chapter 9: File Handling


    In Python, file handling is an essential part of interacting with external data.
    Whether you''re reading data from a file, writing data to a file, or managing
    files and directories, file handling provides a structured way to manipulate files
    and directories on your system. This chapter will guide you through the fundamentals
    of file handling, including reading and writing files, working with directories,
    and implementing error handling in file operations.


    * * *


    ### 9.1 Reading and Writing Files


    #### 9.1.1 Opening Files


    Before you can read from or write to a file, you must first open the file using
    the built-in open() function. The open() function returns a file object, which
    you can use to perform file operations.


    The syntax of open() is:


    file\_object = open(''filename'', ''mode'')


    ●      ''filename'' is the name of the file you want to open (it can also include
    the path).


    ●      ''mode'' specifies the mode in which the file is opened. Common modes include:


    ○      ''r'': Read (default mode) – Opens the file for reading. The file must
    exist.


    ○      ''w'': Write – Opens the file for writing (creates the file if it doesn’t
    exist). If the file exists, it will be overwritten.


    ○      ''a'': Append – Opens the file for appending (creates the file if it doesn’t
    exist).


    ○      ''b'': Binary – Used with other modes to handle binary files (e.g., ''rb''
    or ''wb'').


    #### Example: Opening a File for Reading


    \# Open the file in read mode


    file = open(''example.txt'', ''r'')


    \# Read the contents of the file


    content = file.read()


    print(content)


    \# Close the file after use


    file.close()


    #### 9.1.2 Reading from Files


    Once the file is opened, you can use various methods to read its contents:


    ●      read(): Reads the entire content of the file.


    ●      readline(): Reads a single line from the file.


    ●      readlines(): Reads all lines in the file and returns them as a list.


    #### Example: Reading a File


    \# Open the file in read mode


    file = open(''example.txt'', ''r'')


    \# Read the entire file content


    content = file.read()


    print("File Content:")


    print(content)


    \# Reading the file line by line


    file.seek(0)  # Move the cursor to the beginning of the file


    line1 = file.readline()


    line2 = file.readline()


    print("First two lines:")


    print(line1, line2)


    \# Read all lines as a list


    file.seek(0)


    lines = file.readlines()


    print("All lines as a list:")


    print(lines)


    file.close()


    #### 9.1.3 Writing to Files


    When writing to a file, the write() method is used. However, be cautious when
    writing to a file that already exists in write (''w'') mode, as this will overwrite
    the existing content. To append content to a file without overwriting, use append
    mode (''a'').


    \# Open the file in write mode


    file = open(''example.txt'', ''w'')


    \# Write some content to the file


    file.write("Hello, world!\\n")


    file.write("This is a new line.")


    file.close()


    #### Example: Appending to a File


    \# Open the file in append mode


    file = open(''example.txt'', ''a'')


    \# Append some content


    file.write("\\nThis is an appended line.")


    file.close()


    #### 9.1.4 Closing Files


    It is crucial to close the file once you’re done with it using the close() method.
    This ensures that all resources are released and changes are saved.


    file.close()


    ### 9.2 Working with Directories


    In addition to files, Python provides several methods for working with directories.
    These methods help you create, remove, and list directories, making it easy to
    manage your files and folders.


    #### 9.2.1 Creating and Removing Directories


    Python’s os module provides functions like mkdir() and rmdir() to create and remove
    directories.


    import os


    \# Create a new directory


    os.mkdir(''new\_directory'')


    \# Remove a directory


    os.rmdir(''new\_directory'')


    Note that rmdir() will only remove an empty directory. To remove a directory and
    its contents, use shutil.rmtree() from the shutil module.


    import shutil


    \# Remove a directory and its contents


    shutil.rmtree(''directory\_name'')


    #### 9.2.2 Listing Files and Directories


    To list all files and directories within a directory, use os.listdir(). It returns
    a list of all the files and directories in the specified path.


    import os


    \# List all files and directories in the current directory


    items = os.listdir(''.'')


    print(items)


    #### 9.2.3 Checking If a Directory Exists


    You can use os.path.exists() to check if a directory or file exists.


    import os


    \# Check if the directory exists


    if os.path.exists(''my\_directory''):


    print("Directory exists.")


    else:


    print("Directory does not exist.")


    ### 9.3 Error Handling in File Operations


    File operations can raise various errors, such as trying to open a non-existent
    file or attempting to write to a file that’s open in read-only mode. To handle
    such errors gracefully, Python provides try, except, and finally blocks.


    #### 9.3.1 Handling File Not Found Errors


    The FileNotFoundError occurs when the file you are trying to open does not exist.
    You can handle this with a try-except block.


    try:


    file = open(''non\_existent\_file.txt'', ''r'')


    except FileNotFoundError:


    print("The file was not found.")


    finally:


    print("Attempted to open the file.")


    #### 9.3.2 Handling Permission Errors


    A PermissionError can occur when you try to read from or write to a file without
    sufficient permissions. You can catch this error as follows:


    try:


    file = open(''protected\_file.txt'', ''w'')


    except PermissionError:


    print("You do not have permission to write to this file.")


    #### 9.3.3 Using finally for Cleanup


    The finally block is used to ensure that certain code is executed, regardless
    of whether an error occurs or not. It is commonly used to close the file after
    the operation.


    try:


    file = open(''example.txt'', ''r'')


    content = file.read()


    print(content)


    except FileNotFoundError:


    print("File not found.")


    finally:


    if ''file'' in locals():


    file.close()


    print("File closed.")


    #### 9.3.4 Catching Multiple Exceptions


    You can catch multiple exceptions using multiple except blocks or a tuple of exceptions.


    try:


    file = open(''example.txt'', ''r'')


    content = file.read()


    except (FileNotFoundError, PermissionError) as e:


    print(f"Error occurred: {e}")


    finally:


    if ''file'' in locals():


    file.close()


    * * *


