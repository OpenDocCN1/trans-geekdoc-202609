    # Project 5: Go-based Microservices with gRPC


    #### Overview


    Microservices architecture involves breaking down an application into smaller,
    independently deployable services, each responsible for a specific piece of functionality.
    These services communicate with each other over a network. gRPC (Google Remote
    Procedure Call) is a high-performance, open-source framework that enables services
    to communicate with each other, making it an ideal choice for building microservices
    in Go.


    In this project, we will create a set of microservices in Go that communicate
    through gRPC. These services will implement basic functionalities such as user
    management and order processing.


    ### Objectives


    ●      Create multiple Go-based microservices.


    ●      Use gRPC for communication between the services.


    ●      Implement a simple communication protocol with Protocol Buffers (Protobuf).


    ●      Create a client to communicate with the microservices.


    ●      Deploy the microservices and show how they interact.


    ### Tools & Technologies


    ●      Go: Programming language to build the microservices.


    ●      gRPC: Framework for building remote procedure calls.


    ●      Protocol Buffers (Protobuf): Language-neutral, platform-neutral, and extensible
    mechanism for serializing structured data.


    ●      Docker: Containerization for easy deployment of services.


    ●      gRPC-gateway: To expose gRPC services via HTTP/REST.


    ●      PostgreSQL (optional): For persistent data storage.


    ### Step-by-Step Implementation


    #### 1\. Set up Go Environment


    First, ensure that Go is installed on your system. You can download it from the
    official Go website:[ ](https://golang.org/dl/)[Go Downloads](https://golang.org/dl/).


    After installation, initialize a new Go module:


    mkdir go-microservices


    cd go-microservices


    go mod init go-microservices


    #### 2\. Install gRPC and Protocol Buffers


    To use gRPC and Protocol Buffers in Go, you''ll need to install the following
    packages:


    go get google.golang.org/grpc


    go get google.golang.org/protobuf


    You will also need to install the Protocol Buffers compiler (protoc) to generate
    Go code from .proto files. Follow the installation guide for your platform here:[ ](https://grpc.io/docs/protoc-installation/)[Protocol
    Buffers Installation](https://grpc.io/docs/protoc-installation/).


    Once protoc is installed, install the Go plugins for protoc:


    go get github.com/golang/protobuf/protoc-gen-go


    go get github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway


    go get github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2


    #### 3\. Define Service with Protocol Buffers


    In this step, we will define the communication schema using Protocol Buffers.


    1.  Create a proto directory and define the .proto files for the user and order
    services:


    mkdir proto


    2.  Create a file proto/user.proto for the User Service:


    syntax = "proto3";


    package user;


    service UserService {


    rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);


    rpc GetUser (GetUserRequest) returns (GetUserResponse);


    }


    message CreateUserRequest {


    string name = 1;


    string email = 2;


    }


    message CreateUserResponse {


    string id = 1;


    string name = 2;


    string email = 3;


    }


    message GetUserRequest {


    string id = 1;


    }


    message GetUserResponse {


    string id = 1;


    string name = 2;


    string email = 3;


    }


    3.  Create a file proto/order.proto for the Order Service:


    syntax = "proto3";


    package order;


    service OrderService {


    rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);


    rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);


    }


    message CreateOrderRequest {


    string user\_id = 1;


    string product = 2;


    float price = 3;


    }


    message CreateOrderResponse {


    string order\_id = 1;


    string user\_id = 2;


    string product = 3;


    float price = 4;


    }


    message GetOrderRequest {


    string order\_id = 1;


    }


    message GetOrderResponse {


    string order\_id = 1;


    string user\_id = 2;


    string product = 3;


    float price = 4;


    }


    #### 4\. Generate Go Code from Protobuf


    Run the following commands to generate the Go code for gRPC from the .proto files:


    protoc --go\_out=. --go-grpc\_out=. proto/user.proto


    protoc --go\_out=. --go-grpc\_out=. proto/order.proto


    This will generate Go files in the proto directory, which we will use to implement
    the microservices.


    #### 5\. Implement the User Service


    1.  Create a directory user-service to implement the User Service:


    mkdir user-service


    cd user-service


    2.  Create a main.go file for the User Service:


    package main


    import (


    "context"


    "fmt"


    "google.golang.org/grpc"


    "log"


    "net"


    pb "go-microservices/proto/user"


    )


    type server struct {


    pb.UnimplementedUserServiceServer


    }


    func (s \*server) CreateUser(ctx context.Context, in \*pb.CreateUserRequest) (\*pb.CreateUserResponse,
    error) {


    // In a real application, you would save the user to a database here


    user := &pb.CreateUserResponse{


    Id:    "12345",


    Name:  in.GetName(),


    Email: in.GetEmail(),


    }


    return user, nil


    }


    func (s \*server) GetUser(ctx context.Context, in \*pb.GetUserRequest) (\*pb.GetUserResponse,
    error) {


    // In a real application, you would fetch the user from a database here


    user := &pb.GetUserResponse{


    Id:    in.GetId(),


    Name:  "John Doe",


    Email: "johndoe@example.com",


    }


    return user, nil


    }


    func main() {


    lis, err := net.Listen("tcp", ":50051")


    if err != nil {


    log.Fatalf("failed to listen: %v", err)


    }


    s := grpc.NewServer()


    pb.RegisterUserServiceServer(s, &server{})


    fmt.Println("User Service is running on port 50051")


    if err := s.Serve(lis); err != nil {


    log.Fatalf("failed to serve: %v", err)


    }


    }


    #### 6\. Implement the Order Service


    1.  Create a directory order-service to implement the Order Service:


    mkdir order-service


    cd order-service


    2.  Create a main.go file for the Order Service:


    package main


    import (


    "context"


    "fmt"


    "google.golang.org/grpc"


    "log"


    "net"


    pb "go-microservices/proto/order"


    )


    type server struct {


    pb.UnimplementedOrderServiceServer


    }


    func (s \*server) CreateOrder(ctx context.Context, in \*pb.CreateOrderRequest)
    (\*pb.CreateOrderResponse, error) {


    order := &pb.CreateOrderResponse{


    OrderId: in.GetUserId() + "\_12345",


    UserId:  in.GetUserId(),


    Product: in.GetProduct(),


    Price:   in.GetPrice(),


    }


    return order, nil


    }


    func (s \*server) GetOrder(ctx context.Context, in \*pb.GetOrderRequest) (\*pb.GetOrderResponse,
    error) {


    order := &pb.GetOrderResponse{


    OrderId: in.GetOrderId(),


    UserId:  "12345",


    Product: "Laptop",


    Price:   999.99,


    }


    return order, nil


    }


