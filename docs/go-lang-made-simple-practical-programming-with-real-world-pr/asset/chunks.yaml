    \ Basic HTTP Client\n\nHere is an example of how to create a HTTP client that\
    \ makes a GET request to a server.\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\
    \n\t\"io/ioutil\"\n\t\"net/http\"\n)\n\nfunc main() {\n\t// Send a GET request\
    \ to specified URL\n\tresponse, err := http.Get(\"http://localhost:8080\")\n\t\
    if err != nil {\n\t\tfmt.Println(\"Error sending request:\", err)\n\t\treturn\n\
    \t}\n\tdefer response.Body.Close()\n\n\t// Read and print the response body\n\t\
    body, err := ioutil.ReadAll(response.Body)\n\tif err != nil {\n\t\tfmt.Println(\"\
    Error reading response:\", err)\n\t\treturn\n\t}\n\tfmt.Println(\"Response from\
    \ server:\", string(body))\n}\n```\n\n#### How It Works:\n\n1. `http.Get(\"http://localhost:8080\"\
    )` sends a GET request to the server running on `localhost:8080`.\n2. `ioutil.ReadAll(response.Body)`\
    \ reads the body of the response from the server.\n3. The response body is printed\
    \ to the console.\n\n#### Running the Client:\n\n1. Ensure the HTTP server (`main.go`\
    \ from the previous section) is running on `localhost:8080`.\n2. Save the client\
    \ code in a file `client.go`.\n3. Run the command `go run client.go`.\n4. You\
    \ should see the response \"Hello, World!\" printed in the console.\n\n***\n\n\
    ### 11.4 Handling RESTful APIs in Go\n\nRESTful APIs (Representational State Transfer)\
    \ are a popular architectural style for designing web services. A RESTful API\
    \ typically allows clients to interact with resources using standard methods such\
    \ as `GET`, `POST`, `PUT`, and `DELETE`. In Go, creating a RESTful API involves\
    \ defining various routes and HTTP handlers to handle different methods.\n\n####\
    \ Building a Simple RESTful API\n\nLet’s build a simple RESTful API that handles\
    \ basic CRUD operations (Create, Read, Update, Delete) for a list of users.\n\n\
    ```go\npackage main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"net/http\"\
    \n\t\"sync\"\n)\n\n// User represents a user object.\ntype User struct {\n\tID\
    \   int    `json:\"id\"`\n\tName string `json:\"name\"`\n}\n\n// Create a slice\
    \ to store users and a mutex for thread safety\nvar users = []User{\n\t{ID: 1,\
    \ Name: \"John\"},\n\t{ID: 2, Name: \"Jane\"},\n}\n\nvar mu sync.Mutex\n\n// GetUsers\
    \ returns the list of users.\nfunc GetUsers(w http.ResponseWriter, r *http.Request)\
    \ {\n\tmu.Lock()\n\tdefer mu.Unlock()\n\tw.Header().Set(\"Content-Type\", \"application/json\"\
    )\n\tjson.NewEncoder(w).Encode(users)\n}\n\n// CreateUser adds a new user to the\
    \ list.\nfunc CreateUser(w http.ResponseWriter, r *http.Request) {\n\tmu.Lock()\n\
    \tdefer mu.Unlock()\n\tvar newUser User\n\terr := json.NewDecoder(r.Body).Decode(&newUser)\n\
    \tif err != nil {\n\t\thttp.Error(w, \"Invalid input\", http.StatusBadRequest)\n\
    \t\treturn\n\t}\n\t// Assign a new ID to the user and append it to the list\n\t\
    newUser.ID = len(users) + 1\n\tusers = append(users, newUser)\n\tw.Header().Set(\"\
    Content-Type\", \"application/json\")\n\tw.WriteHeader(http.StatusCreated)\n\t\
    json.NewEncoder(w).Encode(newUser)\n}\n\nfunc main() {\n\thttp.HandleFunc(\"/users\"\
    , GetUsers)\n\thttp.HandleFunc(\"/users/create\", CreateUser)\n\tfmt.Println(\"\
    Server is running on http://localhost:8080\")\n\thttp.ListenAndServe(\":8080\"\
    , nil)\n}\n```\n\n#### How It Works:\n\n1. `GetUsers` handles `GET` requests to\
    \ the `/users` endpoint. It returns the list of users in JSON format.\n2. `CreateUser`\
    \ handles `POST` requests to the `/users/create` endpoint. It accepts a JSON body\
    \ containing user data and adds the new user to the list.\n\n#### Testing the\
    \ API:\n\n1. Start the server by running `go run main.go`.\n2. Use `curl` or a\
    \ tool like Postman to test the API:\n\n- To get the list of users:\n  `curl http://localhost:8080/users`\n\
    \n- To create a new user:\n  `curl -X POST -d '{\"name\": \"Alice\"}' -H \"Content-Type:\
    \ application/json\" http://localhost:8080/users/create`\n\n***\n\n### 11.5 WebSockets\
    \ in Go\n"
