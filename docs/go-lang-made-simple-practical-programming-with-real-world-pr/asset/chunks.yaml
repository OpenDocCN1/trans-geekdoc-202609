- raw: "Variables declared within functions are typically allocated on the stack,\
    \ while objects created dynamically (e.g., with new or slices created with make)\
    \ are allocated on the heap.\n\n#### Example of Stack and Heap Allocation\n\n\
    package main\n\nimport \"fmt\"\n\nfunc main() {\n\n​// Stack Allocation\n\n​x\
    \ := 42   // 'x' is allocated on the stack\n\n​// Heap Allocation\n\n​p := new(int) \
    \ // 'p' is a pointer to a value allocated on the heap\n\n​\\*p = 10\n\n​fmt.Println(x,\
    \ \\*p)\n\n}\n\nIn this example:\n\n●      x is a local variable stored on the\
    \ stack.\n\n●      p is a pointer to an integer allocated on the heap.\n\n####\
    \ Memory Management Best Practices\n\n●      Avoid excessive memory allocation:\
    \ Use value types (structs) where possible, and avoid creating unnecessary slices\
    \ or maps.\n\n●      Use slices effectively: Slices are dynamically sized and\
    \ allow you to work with memory more efficiently. However, be careful when creating\
    \ slices to avoid retaining large objects unnecessarily.\n\n●      Profile memory\
    \ usage: Go provides the runtime package, which can be used to check the number\
    \ of allocated objects and memory usage. You can also use tools like pprof to\
    \ profile your application and identify memory issues.\n\npackage main\n\nimport\
    \ (\n\n​\"fmt\"\n\n​\"runtime\"\n\n)\n\nfunc main() {\n\n​var m runtime.MemStats\n\
    \n​runtime.ReadMemStats(&m)\n\n​fmt.Printf(\"Alloc: %v bytes\\\\n\", m.Alloc)\n\
    \n}\n\nThis example retrieves the current memory usage of the Go runtime.\n\n\
    #### Manual Memory Management in Go\n\nWhile Go's garbage collector handles most\
    \ memory management, you can still influence memory usage. For example, you can\
    \ use the runtime.GC() function to force garbage collection, but this is rarely\
    \ necessary and should be used with caution.\n\npackage main\n\nimport (\n\n​\"\
    runtime\"\n\n​\"fmt\"\n\n)\n\nfunc main() {\n\n​runtime.GC() // Manually trigger\
    \ garbage collection\n\n​fmt.Println(\"Garbage collection triggered.\")\n\n}\n\
    \n#### Conclusion\n\nUnderstanding advanced topics like reflection, generics,\
    \ and memory management is essential for becoming a Go expert. Reflection allows\
    \ you to inspect and manipulate types dynamically, while generics give you powerful\
    \ ways to write reusable, type-safe code. Memory management, while largely handled\
    \ by the Go runtime, requires an understanding of the underlying model to write\
    \ efficient programs. By mastering these concepts, you can take full advantage\
    \ of Go's strengths in building scalable and performant applications.\n\n# 5 Projects\n\
    \n# Project 1 - CRUD API with Go and MySQL\n\nIn this chapter, we will build a\
    \ RESTful API in Go for managing user data, interfacing with a MySQL database.\
    \ We will go through each step in detail, explaining how to set up the Go environment,\
    \ connect to MySQL, and create a simple API with full CRUD (Create, Read, Update,\
    \ Delete) operations. This is a fundamental project that will help you understand\
    \ how Go can be used to build web applications with a backend database.\n\n###\
    \ Project Overview\n\nThe goal of this project is to create an API that allows\
    \ us to manage user data in a MySQL database. We will build the following functionality:\n\
    \n●      Create: Add a new user to the database.\n\n●      Read: Retrieve user\
    \ details by ID and list all users.\n\n●      Update: Modify existing user data.\n\
    \n●      Delete: Remove a user from the database.\n\nWe will use Go for the backend\
    \ and MySQL for the database. The API will return responses in JSON format, which\
    \ is common for modern RESTful services.\n\n* * *\n\n### Step 1: Set Up the Development\
    \ Environment\n\nBefore starting, make sure you have the following software installed\
    \ on your system:\n\n1.  Go: To install Go, visit the[ ](https://go.dev/dl/)[Go\
    \ Downloads Page](https://go.dev/dl/).  \n\n○      Follow the instructions for\
    \ your operating system.\n\n○      Check if Go is installed by running go version\
    \ in your terminal.\n\n2.  MySQL: You will need a running instance of MySQL. You\
    \ can download and install MySQL from the[ ](https://dev.mysql.com/downloads/installer/)[official\
    \ MySQL website](https://dev.mysql.com/downloads/installer/), or use a MySQL cloud\
    \ service.  \n\n3.  Postman or any similar API testing tool: We will use this\
    \ tool to test the API requests.  \n\n* * *\n\n### Step 2: Create the MySQL Database\
    \ and Table\n\n1.  First, we need to set up a MySQL database to store the user\
    \ data.  \n\n    Open your MySQL terminal or connect to MySQL using a tool like\
    \ phpMyAdmin or MySQL Workbench, and run the following SQL commands to create\
    \ the database and the table:  \n\nCREATE DATABASE user\\_db;\n\nUSE user\\_db;\n\
    \nCREATE TABLE users (\n\nid INT AUTO\\_INCREMENT PRIMARY KEY,\n\nname VARCHAR(100),\n\
    \nemail VARCHAR(100),\n\nage INT\n\n);\n\n●      id: The unique identifier for\
    \ each user, set to auto-increment.\n\n●      name: The user's name.\n\n●      email:\
    \ The user's email address.\n\n●      age: The user's age.\n\n* * *\n\n### Step\
    \ 3: Set Up Go Project\n\n1.  Create a new Go project directory:\n\nmkdir user-api\n\
    \ncd user-api\n\n2.  Initialize the Go module:\n\ngo mod init user-api\n\n3. \
    \ Install the necessary dependencies for MySQL:\n\ngo get -u github.com/go-sql-driver/mysql\n\
    \ngo get -u github.com/gorilla/mux\n\n●      github.com/go-sql-driver/mysql: A\
    \ Go MySQL driver that allows Go to communicate with MySQL databases.\n\n●     \
    \ github.com/gorilla/mux: A powerful URL router and dispatcher for building Go\
    \ web applications.\n\n* * *\n\n### Step 4: Set Up the Go Application\n\nNow let’s\
    \ write the Go code to connect to MySQL and implement the CRUD operations.\n\n\
    1.  Create a new file main.go inside your project directory.\n\npackage main\n\
    \nimport (\n\n\"database/sql\"\n\n\"encoding/json\"\n\n\"fmt\"\n\n\"log\"\n\n\"\
    net/http\"\n\n\"github.com/gorilla/mux\"\n\n\\_ \"github.com/go-sql-driver/mysql\"\
    \n\n)\n\nvar db \\*sql.DB\n\n// User struct represents the structure of a user\n\
    \ntype User struct {\n\nID    int    \\`json:\"id\"\\`\n\nName  string \\`json:\"\
    name\"\\`\n\nEmail string \\`json:\"email\"\\`\n\nAge   int    \\`json:\"age\"\
    \\`\n\n}\n\n// Initialize the database connection\n\nfunc initializeDB() {\n\n\
    var err error\n\n// Replace with your database credentials\n\ndb, err = sql.Open(\"\
    mysql\", \"root:password@tcp(localhost:3306)/user\\_db\")\n\nif err != nil {\n\
    \nlog.Fatal(err)\n\n}\n\nfmt.Println(\"Connected to the database!\")\n\n}\n\n\
    // Handle the route for creating a user\n\nfunc createUser(w http.ResponseWriter,\
    \ r \\*http.Request) {\n\nvar user User\n\nerr := json.NewDecoder(r.Body).Decode(&user)\n\
    \nif err != nil {\n\nhttp.Error(w, err.Error(), http.StatusBadRequest)\n\nreturn\n\
    \n}\n\n// Insert user data into MySQL\n\nquery := \\`INSERT INTO users (name,\
    \ email, age) VALUES (?, ?, ?)\\`\n\nresult, err := db.Exec(query, user.Name,\
    \ user.Email, user.Age)\n\nif err != nil {\n\nhttp.Error(w, err.Error(), http.StatusInternalServerError)\n\
    \nreturn\n\n}\n\nid, err := result.LastInsertId()\n\nif err != nil {\n\nhttp.Error(w,\
    \ err.Error(), http.StatusInternalServerError)\n\nreturn\n\n}\n\nuser.ID = int(id)\n\
    \nw.Header().Set(\"Content-Type\", \"application/json\")\n\njson.NewEncoder(w).Encode(user)\n\
    \n}\n\n// Handle the route for fetching all users\n\nfunc getUsers(w http.ResponseWriter,\
    \ r \\*http.Request) {\n\nrows, err := db.Query(\"SELECT id, name, email, age\
    \ FROM users\")\n\nif err != nil {\n\nhttp.Error(w, err.Error(), http.StatusInternalServerError)\n\
    \nreturn\n\n}\n\ndefer rows.Close()\n\nvar users \\[\\]User\n\nfor rows.Next()\
    \ {\n\nvar user User\n\nerr := rows.Scan(&user.ID, &user.Name, &user.Email, &user.Age)\n\
    \nif err != nil {\n\nhttp.Error(w, err.Error(), http.StatusInternalServerError)\n\
    \nreturn\n\n}\n\nusers = append(users, user)\n\n}\n\nw.Header().Set(\"Content-Type\"\
    , \"application/json\")\n\njson.NewEncoder(w).Encode(users)\n\n}\n\n// Handle\
    \ the route for fetching a user by ID\n\nfunc getUserByID(w http.ResponseWriter,\
    \ r \\*http.Request) {\n\nvars := mux.Vars(r)\n\nid := vars\\[\"id\"\\]\n\nrow\
    \ := db.QueryRow(\"SELECT id, name, email, age FROM users WHERE id = ?\", id)\n\
    \nvar user User\n\nerr := row.Scan(&user.ID, &user.Name, &user.Email, &user.Age)\n\
    \nif err != nil {\n\nif err == sql.ErrNoRows {\n\nhttp.Error(w, \"User not found\"\
    , http.StatusNotFound)\n\n} else {\n\nhttp.Error(w, err.Error(), http.StatusInternalServerError)\n\
    \n}\n\nreturn\n\n}\n\nw.Header().Set(\"Content-Type\", \"application/json\")\n\
