- - '##'
  - 5. 你是名为 `WillPanek.com` 的 Active Directory 网络管理员。该森林包含一个域。该域包含名为 `Server1` 的 Windows
    Server 2016。一位名为 John Smith 的管理员将 `Server1` 设置为独立证书发机构 (CA)。你需要将 `Server1` 配置为独立
    CA？
- - '##'
  - 6. 你是 `WillPanek.com` 的网络管理员。你设置了一个名为 `ServerCA1` 的企业级证书发机构 (CA)。你计划根据 `User`
    模板颁发证书。你需要确保颁发的证书有效期为两年，并且支持自动注册。你首先做什么？
- - '##'
  - 7. 你设置了一个名为 `Server1` 的企业级根证书发机构 (CA)。网络上的计算机已成功注册并收到了有效期一年的证书。这些证书基于 `CA_Template1`
    的模板。你需要确保新证书有效期为三年。你应该做什么来确保它们的有效期？
- - '##'
  - 8. 你是一家大公司的网络管理员。你需要保证客户端至少每 30 分钟检查一次 `CRL` 以查看证书是否被撤销。为了实现这一目标，你应该配置以下项？
- - '##'
  - 9. 你是你公司的网络管理员。你需要查看 `CRL` 分发点 (CDP) 的所有位置。你会使用哪个 PowerShell 命令？
- - '##'
  - 10. 你是你公司的网络管理员。你需要查看设置 CA 上用于颁发证书的模板列表。你会使用哪个 PowerShell 命令？
