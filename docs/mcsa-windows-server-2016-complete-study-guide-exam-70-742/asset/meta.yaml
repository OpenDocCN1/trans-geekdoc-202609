  - 8. 你是 ABC 公司的顾问。老板抱怨桌面纸一直显示没有。当你与 IT 团队交流时，发现以前员工创建了 0 个 GPO。你需要如何解决？
- - '##'
  - 9. 你是一个大型机构的网络管理员，你有多个站点和组织单位（OU）。你配置了一个名为 `Sales` 的站点。在域中，有一个名为 `Sales` 的 OU。你设置了
    `CA_Template1` 的模板。你需要确保其新证书有效期为三年。
- - '##'
  - 10. 你是一个拥有多个地点的机构的管理员。你正在运行 Windows Server 2012 R2，你只有一个域。你为每个站点设置了 0 个 GPO。你配置了
    `Sales`。你必须确保 `Sales` 能够正确接收。你应该做什么？
