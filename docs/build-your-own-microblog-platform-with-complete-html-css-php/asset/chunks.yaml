    a database connection, and setting font code variables.  Once these are set and
    working, all of our scripts will work on the site.


    Displays the database connection status and font settings for verification.


    Use an FTP client like FileZilla to upload your files to your web hosting site,
    (i.e. Netfirms):


    Upload passwd.inc.php to the $HOME/pvt directory.


    Upload config.inc.php and fonts.inc.php to the


    public\_html/inc directory.


    Upload index.php to the public\_html directory.


    Additional Instruction for file placement: 


    You can create all directories using FTP.  When you first login to your hosting
    site (i.e. Netfirms) for example, you can create the pvt directory, enter into
    it and upload the password.inc.php file.  Then, Go Back to the $HOME directory
    and click on the public\_html directory to create the    inc    directory.    Enter    into    it    and    upload    the


    config.inc.php and fonts.inc.php files.  Then Go Back to the public\_html directory
    and upload the index.php file.


    Test the Script


    Navigate to http://yourdomain.com/index.php in your browser to check the output.
    You should see a message indicating a successful database connection and a display
    of your font settings.'
