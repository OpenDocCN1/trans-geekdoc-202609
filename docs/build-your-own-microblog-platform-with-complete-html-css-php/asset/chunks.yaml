    3\. Using PDO for Database Interactions


    a. Introduction to PDO:


    PHP Data Objects (PDO) is a database access layer providing a uniform method of
    access to multiple databases. PDO offers a secure and flexible way to interact
    with databases, making it a preferred choice for handling database operations
    in PHP applications.


    b. Creating a PDO Connection:


    To use PDO, you need to establish a connection to your MySQL database.


    Here’s a basic example of how to create a PDO connection in PHP:


    <?php


    $dsn = ''mysql:host=localhost;dbname=testdb;charset=utf8'';


    $username = ''root''; // MySQL username


    $password = ''''; // MySQL password


    try {


    $pdo = new PDO($dsn, $username, $password);


    $pdo->setAttribute(PDO::ATTR\_ERRMODE,


    PDO::ERRMODE\_EXCEPTION);


    echo "Connected successfully";


    } catch (PDOException $e) {


    echo "Connection failed: " . $e->getMessage();


    }


    ?>


    $dsn: The Data Source Name (DSN) contains the information required to connect
    to the database, including the host, database name, and character set.


    $username: Your MySQL username, typically root for local development.


    $password: Your MySQL password; leave it empty if you haven’t set one.


    c. Performing Database Operations with PDO:


    Here’s an example of how to perform basic database operations using PDO:


    Inserting Data:


    <?php


    $sql = "INSERT INTO users (username, email) VALUES


    (:username, :email)";


    $stmt = $pdo->prepare($sql);


    $username = ''john\_doe'';


    $email = ''john.doe@example.com'';


    $stmt->bindParam('':username'', $username);


    $stmt->bindParam('':email'', $email);


    $stmt->execute();


    ?>


    Retrieving Data:


    <?php


    $sql = "SELECT \* FROM users";


    $stmt = $pdo->query($sql);


    while ($row = $stmt->fetch(PDO::FETCH\_ASSOC))


    {


    echo "Username: " . $row\[''username''\] . " - Email: " . $row\[''email''\] .
    "<br>";


    }


    ?>


    Configuring PHP and MySQL on your local machine, and using PDO for database interactions,
    ensures that your development environment is robust and secure. By setting up
    and managing your local server environment effectively, you can streamline your
    development process and build applications that are ready for deployment.


    ### How to install Apache, PHP, MariaDB for local development (Linux)


    Setting up a local development environment on a Linux system involves installing
    and configuring Apache (the web server), PHP (the scripting language), and MariaDB
    (the database server). This setup will allow you to develop and test your web
    applications locally before deploying them to a production server.


    Here’s a step-by-step guide to installing and configuring these components on
    a Linux system:


    1\. Installing Apache


    a. Update Your Package List:


    Before installing Apache, update your package list to ensure you have the latest
    information about available packages.


    Open a terminal and run:


    sudo apt update


    b. Install Apache:


    To install Apache, use the following command:


    sudo apt install apache2


    c. Start and Enable Apache:


    After installation, start Apache and enable it to run at boot:


    sudo systemctl start apache2


    sudo systemctl enable apache2


    d. Verify Installation:


    To ensure Apache is running, open a web browser and navigate to [http://localhost](http://localhost).


    You should see the Apache2 Ubuntu or Debian Default Page, indicating that Apache
    is successfully installed and running.


    2\. Installing PHP


    a. Install PHP:


    To install PHP and its necessary modules, use the following command:


    sudo apt install php libapache2-mod-php php-mysql


    This command installs PHP along with the Apache PHP module and MySQL support for
    PHP.


    b. Verify PHP Installation:


    To verify that PHP is working with Apache, create a PHP info file. Run the following
    commands:


    sudo nano /var/www/html/info.php


    Add the following code to the file:


    <?php


    phpinfo();


    ?>


    Save the file and exit the editor. Open a web browser and navigate to http://localhost/info.php.
    You should see the


    PHP information page, confirming that PHP is correctly installed and configured
    with Apache.


    3\. Installing MariaDB


    a. Install MariaDB:


    To install MariaDB, use the following command:


    sudo apt install mariadb-server mariadb-client


    b. Secure MariaDB Installation:


    Run the security script to improve the security of your MariaDB installation:


    sudo mysql\_secure\_installation


    Follow the prompts to set a root password and remove insecure default settings.


    c. Start and Enable MariaDB:


    Start MariaDB and enable it to run at boot:


    sudo systemctl start mariadb


    sudo systemctl enable mariadb


    d. Verify MariaDB Installation:


    To verify that MariaDB is running, you can log in to the MariaDB shell:


    sudo mysql -u root -p


    Enter the root password you set during the secure installation process. You should
    be greeted with the MariaDB command-line prompt.


    4\. Configuring Apache, PHP, and MariaDB


    a. Configure Apache for PHP:


    Ensure that Apache is configured to handle PHP files. By default, the libapache2-mod-php
    package should set this up, but you can check the configuration in the /etc/apache2/mods-enabled/dir.conf
    file.


    The dir.conf file should have index.php listed before index.html:


    <IfModule mod\_dir.c>


    DirectoryIndex index.php index.html


    </IfModule>


    Restart Apache to apply any changes:


    sudo systemctl restart apache2


    b. Configure MariaDB:


    Create a new MariaDB database and user for your web applications. Log in to the
    MariaDB shell:


    sudo mysql -u root -p


    Then execute the following SQL commands:


    CREATE DATABASE mydatabase;


    CREATE USER ''myuser''@''localhost'' IDENTIFIED BY ''mypassword'';


    GRANT ALL PRIVILEGES ON mydatabase.\* TO ''myuser''@''localhost'';


    FLUSH PRIVILEGES;


    EXIT;


    Replace mydatabase, myuser, and mypassword with your preferred database name,
    username, and password.


    5\. Testing Your Setup


    a. Create a Test PHP Script:


    Create a test PHP script to connect to your MariaDB database.


    Save the following code as db\_test.php in the /var/www/html directory:


    <?php


    $dsn = ''mysql:host=localhost;dbname=mydatabase;charset=utf8'';


    $username = ''myuser'';


    $password = ''mypassword'';


    try {


    $pdo = new PDO($dsn, $username, $password);


    $pdo->setAttribute(PDO::ATTR\_ERRMODE,


    PDO::ERRMODE\_EXCEPTION);


    echo "Connected successfully";


    } catch (PDOException $e) {


    echo "Connection failed: " . $e->getMessage();


    }


    ?>


    Navigate to http://localhost/db\_test.php in your web browser. If everything is
    configured correctly, you should see a “Connected successfully” message.


    Installing and configuring Apache, PHP, and MariaDB on your Linux machine provides
    a robust environment for developing and testing web applications. By following
    these steps, you can set up a local server that closely resembles your production
    environment, allowing you to develop and debug your applications effectively before
    deployment.


