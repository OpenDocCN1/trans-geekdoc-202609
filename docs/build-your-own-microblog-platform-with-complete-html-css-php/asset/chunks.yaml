    (This directory is located outside the public\_html folder to keep sensitive files,
    such as database credentials, passwords, and other secure functions, protected.
    It should be placed in your $HOME directory or the directory you are in when you
    log in via FTP.)


    The Profile Pictures Directory:  public\_html/propics


    (This directory holds avatar-type profile pictures that users can choose from
    if they don’t want to upload a photo)


    The User Images Directory:  public\_html/uimg


    (This directory holds uploaded user photos)


    Creation of the Micro-Blog Platform Code


