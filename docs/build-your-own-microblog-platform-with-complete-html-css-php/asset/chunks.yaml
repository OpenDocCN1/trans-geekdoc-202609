    ## Example of a Search Function for Posts


    ```html

    // Search form in HTML

    <form method="get" action="search.php">

    <input type="text" name="query" placeholder="Search for posts...">

    <input type="submit" value="Search">

    </form>


    <?php

    // Retrieve search query from form input

    $query = isset($_GET[''query'']) ? $_GET[''query''] : '''';


    // Prepare SQL query to search posts

    $sql = "SELECT * FROM posts WHERE title LIKE :query OR content LIKE :query ORDER
    BY created_at DESC";

    $stmt = $pdo->prepare($sql);

    $stmt->execute([''query'' => "%$query%"]);

    $results = $stmt->fetchAll(PDO::FETCH_ASSOC);


    // Display search results

    foreach ($results as $post)

    {

    echo "<div class=''post''>";

    echo "<h2>" . htmlspecialchars($post[''title'']) . "</h2>";

    echo "<p>" . htmlspecialchars(substr($post[''content''], 0, 200)) . "...</p>";

    echo "<a href=''post.php?id=" . htmlspecialchars($post[''id'']) . "''>Read more</a>";

    echo "</div>";

    }

    ?>

    ```


    In this example:

    - A search form allows users to input their search query.

    - The `search.php` script processes the query by looking for matches in the post
    title or content.

    - The results are displayed with a basic HTML structure, showing post titles and
    excerpts.


    Integrating search functionality into your microblogging platform significantly
    improves user experience by making it easy to find relevant posts and users. By
    implementing a well-designed search form, efficiently processing search queries,
    and displaying results in an organized manner, you can enhance the usability and
    accessibility of your site. Proper search functionality helps users quickly locate
    the content they are interested in, encouraging greater engagement and satisfaction
    with your platform.


    ## Pagination and Sorting


    ### Adding pagination to the post listing pages


    Pagination is a crucial feature for handling large amounts of content on a microblogging
    platform, allowing users to navigate through multiple pages of posts without overwhelming
    them with too much information at once. Here''s a brief example of how to implement
    pagination in PHP for your post listing pages.


    #### Overview of Pagination

    Pagination involves splitting a long list of posts into smaller, manageable chunks
    and displaying these chunks across multiple pages. Typically, you show a limited
    number of posts per page and provide navigation links to move between pages.


    #### Step-by-Step Example


    1. **Determine Total Number of Posts**

    First, calculate the total number of posts available in the database. This will
    help determine how many pages are needed.

    ```php

    $pdo = new PDO($dsn, $user, $pass, $options);

    $stmt = $pdo->query("SELECT COUNT(*) FROM posts");

    $totalPosts = $stmt->fetchColumn();

    ```


    2. **Set Up Pagination Variables**

    Define the number of posts to display per page and determine the current page
    number from the URL parameters.

    ```php

    $postsPerPage = 10;

    $currentPage = isset($_GET[''page'']) ? (int)$_GET[''page''] : 1;

    $start = ($currentPage - 1) * $postsPerPage;

    ```


    3. **Retrieve Posts for the Current Page**

    Use SQL''s `LIMIT` and `OFFSET` to fetch only the posts needed for the current
    page.

    ```php

    $stmt = $pdo->prepare("SELECT * FROM posts LIMIT :start, :limit");

    $stmt->bindParam('':start'', $start, PDO::PARAM_INT);

    $stmt->bindParam('':limit'', $postsPerPage, PDO::PARAM_INT);

    $stmt->execute();

    $posts = $stmt->fetchAll(PDO::FETCH_ASSOC);

    ```


    4. **Calculate Total Pages**

    Based on the total number of posts and the number of posts per page, calculate
    the total number of pages required.

    ```php

    $totalPages = ceil($totalPosts / $postsPerPage);

    ```


    5. **Generate Pagination Links**

    Create links for navigating between pages. Ensure that the links correctly reflect
    the current page and provide a way to navigate to previous and next pages.

    ```php

    if ($totalPages > 1) {

    echo ''<div class="pagination">'';

    if ($currentPage > 1) {

    echo ''<a href="?page='' . ($currentPage - 1) . ''">&laquo; Previous</a>'';

    }

    for ($i = 1; $i <= $totalPages; $i++) {

    echo ''<a href="?page='' . $i . ''"'' . ($i == $currentPage ? '' class="active"''
    : '''') . ''>'' . $i . ''</a>'';

    }

    if ($currentPage < $totalPages) {

    echo ''<a href="?page='' . ($currentPage + 1) . ''">Next &raquo;</a>'';

    }

    echo ''</</div>>'';

    }

    ```


    By implementing pagination, you enhance the usability and performance of your
    microblogging platform, allowing users to browse through posts efficiently. The
    basic steps involve calculating the total number of posts, setting pagination
    parameters, retrieving a subset of posts, and generating navigation links. This
    approach ensures that users can easily navigate through multiple pages of content
    without being overwhelmed.


    ### Sorting posts by date, popularity, or other criteria


    Sorting posts by various criteria is an essential feature for any microblogging
    platform. It enhances user experience by allowing visitors to view content in
    a way that best suits their preferences, whether they’re interested in the latest
    updates, the most popular posts, or content on specific topics. Implementing sorting
    functionality involves several key considerations, including determining the criteria
    for sorting, updating your database queries, and adjusting your front-end display.


    #### Sorting by Date

    Sorting posts by date is a common feature that enables users to view recent content
    first. This can be particularly useful for users who want to stay updated with
    news. To implement sorting by date:

    - **Database Query**: Modify your SQL query to order posts by their date. For
    example, you can use `ORDER BY` to sort posts in descending order (most first)
    or ascending order (oldest first).

    - **Display Results**: Ensure that the sorted posts are displayed in the desired
    order. This typically involves adjusting the loop that renders posts.

    ```sql

    SELECT * FROM posts ORDER created_at DESC;

    ```


    #### Sorting by Popularity

    Sorting posts by popularity involves ranking posts based on metrics such as the
    number of views, likes, or comments. This allows users to see trending or highly-engaged
    content. To implement sorting by popularity:

    - **Database Structure**: Ensure your database has fields to track popularity
    metrics, such as views or likes.

    - **Database Query**: Adjust your SQL query to sort posts based on these popularity
    metrics. You can order posts by the number of likes, views, or other relevant
    criteria.

    - **Update Metrics**: Regularly update the metrics to reflect changes in post
    popularity, such as incrementing view counts or recording likes.

    ```sql

    SELECT * FROM posts ORDER BY likes DESC;

    ```


    #### Sorting by Other Criteria

    Depending on your platform’s features, you may want to sort posts based on other
    criteria, such as post length, category, or user-defined tags. To implement this:

    - **Define Criteria**: Determine what additional sorting criteria are relevant
    to your users and ensure that your database schema supports these criteria.

    - **Database Query**: Update your SQL queries to include sorting based on these
    criteria. For instance, you might sort posts by category or by a custom ranking
    system.

    - **User Interface**: Provide users with options to select their preferred sorting
    criteria via drop-down menus or buttons on the front end.

    ```sql

    SELECT * FROM posts ORDER BY category ASC, created_at DESC;

    ```


