- fmt: "\n# Directory Structure\n\n- **The Admin Directory**: `public_html/adm`\n\
    (For administrative scripts or interfaces)\n\n- **The Images Directory**: `public_html/img`\n\
    (For main website logos, images, icons)\n\n- **The Mobile Directory**: `public_html/mb`\n\
    (For a larger website like our microblog platform, we direct mobile users to an\
    \ alternate website directory through the `index.php` file. This can later easily\
    \ be converted into a mobile APP)\n\n- **The Private Directory**: `../public_html/pvt`\n\
    (This directory is located outside the `public_html` folder to keep sensitive\
    \ files, such as database credentials, passwords, and other secure functions,\
    \ protected. It should be placed in your `$HOME` directory or the directory you\
    \ are in when you log in via FTP.)\n\n- **The Profile Pictures Directory**: `public_html/propics`\n\
    (This directory holds avatar-type profile pictures that users can choose from\
    \ if they don’t want to upload a photo)\n\n- **The User Images Directory**: `public_html/uimg`\n\
    (This directory holds uploaded user photos)\n\n# Configuring Your Database Connection\n\
    \nTo configure the database connection that is set up for your microblogging platform,\
    \ follow these steps:\n\n## Create the Configuration File\nUse a text editor like\
    \ Bluefish to create the file: `inc/config.inc.php`\n\n```php\n<?php\nif (!isset($_SESSION['MB_url']))\n\
    {\n    $SESSION_NAME = \"MB_\";\n    if (session_status() == PHP_SESSION_NONE)\n\
    \    {\n        session_start();\n        $_SESSION['session_id'] = session_id();\n\
    \    }\n    $session_id = $_SESSION['session_id'];\n}\n// Set paths\n$private_path\
    \ = \"../pvt/\";\nif (strpos($_SERVER['PHP_SELF'], \"adm/\")) {\n    $password_file\
    \ = \"../\" . $private_path . \"passwd.inc.php\";\n} else {\n    $password_file\
    \ = $private_path . \"passwd.inc.php\";\n}\ninclude($password_file);\n\n// Common\
    \ PDO options\n$options = [\n    \\PDO::ATTR_ERRMODE => \\PDO::ERRMODE_EXCEPTION,\n\
    \    \\PDO::ATTR_DEFAULT_FETCH_MODE => \\PDO::FETCH_ASSOC,\n    \\PDO::ATTR_EMULATE_PREPARES\
    \   => false,\n];\n// Connect to the database\ntry {\n    $pdo = new \\PDO(\"\
    mysql:host=$host;dbname=$db;charset=$charset\", $user, $pass, $options);\n} catch\
    \ (\\PDOException $e) {\n    error_log('PDOException: ' . $e->getMessage() . '\
    \ in ' . $e->getFile() . ' on line ' . $e->getLine());\n    throw $e;\n}\ninclude(\"\
    inc/fonts.inc.php\");\n?>\n```\n\n### Explanation of `inc/config.inc.php`\n- `session_start()`\
    \ initializes session management.\n- The script includes the `passwd.inc.php`\
    \ file from the `../pvt/` or `$HOME/pvt/` directory, depending on the script’s\
    \ location.\n- Sets PDO options and attempts to create a new `PDO` instance to\
    \ connect to the database.\n- Includes `fonts.inc.php` for default font settings.\n\
    \n## Create the Password File\nCreate the file: `../pvt/passwd.inc.php`\n\n```php\n\
    <?php\n// Your MySQL hosting server name\n$host = 'yourmicroblog1005673.net.com';\n\
    // Character encoding\n$charset = 'utf8mb4';\n// Your database name\n$db = 'yourblog_main';\n\
    // Your database username\n$user = 'yourblog_main';\n// Your database password\n\
    // decryption & encryption keys – must be exactly the same\n$decryptKey = \"zZ9CZZk20bLv-mJ639Stu!\"\
    ; // change this\n$encryptKey = \"zZ9CZZk20bLv-mJ639Stu!\"; // change this\nNote:\
    \ The `pvt` directory should be outside the `public_html` directory for security\
    \ reasons, typically found in `$HOME/pvt/`.\n?>\n```\n\n## Create the Default\
    \ Font file\nCreate the file: `inc/fonts.inc.php`\n(Note: Not all of these fonts\
    \ are required. For our program, we will use the following list of font codes)\n\
    \n```php\n<?php\n// default system font codes\n$h1grey_font = \"<font face=helvetica\
    \ size=1=#808080>\";\n$h2grey_font = \"<font face=helvetica size=2=#808080>\"\
    ;\n$h3grey_font = \"<font face=helvetica size=3=#808080>\";\n$a2grey_font = \"\
    <font face=arial size=2=#808080>\";\n$a3grey_font = \"<font face=arial size=3=#808080>\"\
    ;\n$a8blue_font = \"<font face=arial size=10=#0000F8>\";\n$a10black_font = \"\
    <font face=arial size=10=#000000>\";\n$a10blue_font = \"<font face=arial size=10=#0000F8>\"\
    ;\n$a1white_font = \"<font face=arial size=1=#ffffff\";\n$a1black_font = \"<font\
    \ face=arial size=1=#000000>\";\n$a1blue_font = \"<font face=arial size=1=#0000F8>\"\
    ;\n$a1green_font = \"<font face=arial size=1=#003900>\";\n$a1yellow_font = \"\
    <font face=arial size=1=#ffff00>\";\n$a1red_font = \"<font face=arial size=1=#ff0000>\"\
    ;\n$a2white_font = \"<font face=arial size=2=#ffffff>\";\n$a2black_font = \"<font\
    \ face=arial size=2=#000000>\";\n$a2blue_font = \"<font face=arial size=2=#0000F8>\"\
    ;\n$a2green_font = \"<font face=arial size=2=#003900>\";\n$a2yellow_font = \"\
    <font face=arial size=2=#ffff00>\";\n$a2red_font = \"<font face=arial size=2=#ff0000>\"\
    ;\n$a3white_font = \"<font face=arial size=3=#ffffff>\";\n$a3black_font = \"<font\
    \ face=arial size=3=#000000>\";\n$a3blue_font = \"<font face=arial size=3=#0000F8>\"\
    ;\n$a3green_font = \"<font face=arial size=3=#003900>\";\n$a3yellow_font = \"\
    <font face=arial size=3=#ffff00>\";\n$a3red_font = \"<font face=arial size=3=#ff0000>\"\
    ;\n$a4white_font = \"<font face=arial size=4=#ffffff>\";\n$a4black_font = \"<font\
    \ face=arial size=4=#000000>\";\n$a4blue_font = \"<font face=arial size=4=#0000F8>\"\
    ;\n$a4green_font = \"<font face=arial size=4=#003900>\";\n$a4yellow_font = \"\
    <font face=arial size=4=#ffff00>\";\n$a4red_font = \"<font face=arial size=4=#ff0000>\"\
    ;\n$a5white_font = \"<font face=arial size=5=#ffffff>\";\n$a5black_font = \"<font\
    \ face=arial size=5=#000000>\";\n$a5blue_font = \"<font face=arial size=5=#0000F8>\"\
    ;\n$a5green_font = \"<font face=arial size=5=#003900>\";\n$a5yellow_font = \"\
    <font face=arial size=5=#ffff00>\";\n$a5red_font = \"<font face=arial size=5=#ff0000>\"\
    ;\n?>\n```\n\n### Explanation of `inc/fonts.php`\nThese font variables define\
    \ face, size, and color used throughout the site.\n\n## Create the Index File\
    \ - `index.php`\n(This is an `index.php` file we will use for database testing)\n\
    \n```php\n<?php\n// Include the connection and font settings\ninclude('inc/config.php');\n\
    \necho $a8blue_font . \"You are connected to the database.<br><br>\";\n\n// Display\
    \ font settings\necho \"<h2>Font Settings</h2>\";\necho \"<p>h1 Grey Font: $h1grey_font</p>\"\
    ;\necho \"<p>h2 Grey Font: $h2grey_font</p>\";\necho \"<p>h3 Grey Font: $h3grey_font</p>\"\
    ;\necho \"<p>a2 Grey Font: $a2grey_font</p>\";\necho \"<p>a3 Grey Font: $a3grey_font</p>\"\
    ;\n?>\n```\n\n### Explanation of `index.php`\nDisplays the database connection\
    \ status and font settings for verification.\n\n## Additional Instruction for\
    \ file placement\nUse an FTP client like FileZilla to upload your files to your\
    \ hosting site (i.e. Netfirms):\n- Upload `passwd.inc.php` to the `$HOME/pvt`\
    \ directory.\n- Upload `config.inc.php` and `fonts.inc.php` to the `public_html/inc`\
    \ directory.\n- Upload `index.php` to the `public_html` directory.\n"
