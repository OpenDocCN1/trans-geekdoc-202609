    在本地开发环境中，调试和故障排除会更易管理。你可以使用各种工具和调试技术，而不会影响实时网站。任何错误或问题都可以在部署之前解决，从而降低向面向用户的站点引入
    Bug 或问题的风险。


    ## 6. 离线开发


    本地开发允许你在没有互联网连接的情况下继续进行项目。这在你正在旅行或在网络访问不稳定的地区工作时尤为有用。你可以持续进展而不受干扰，并在重新上线后将更改同步到实时服务器。


    ## 7. 模拟生产环境


    通过建立一个与你的 Web 托管服务器配置高度镜像的本地环境，你可以模拟生产状况，并测试网站在真实场景中的性能。这有助于在部署之前识别潜在问题，并确保向实时服务器的平稳过渡。


    在部署到 Web 托管服务器之前本地开发具有许多优势，包括更快的开发速度、节省成本、增强安全性以及对开发环境有更好的控制。通过利用本地开发设置，你可以更有效地构建、测试和完善你的项目，从而在上线时获得一个更稳定、更完善的最终产品。


    ## 安装本地服务器环境（Windows & Linux）


    ### 如何为本地开发安装 XAMPP 或 WAMP（Windows）


    安装本地服务器环境是 Web 开发的关键步骤，因为它允许你在将网站或应用程序部署到实时服务器之前，在自己的计算机上进行构建和测试。对于 Windows 用户，两个流行的选项是
    `XAMPP` 和 `WAMP`。它们都是易于安装的软件包，包含了 `Apache`、`MySQL` 和 `PHP`——这些都是本地 Web 服务器设置的核心组件。


    #### 安装 XAMPP


    `XAMPP` 是广泛使用的开源软件包，提供了一种设置本地服务器环境的简单方法。以下是在 Windows 上安装 `XAMPP` 的方法：


    1. **下载 XAMPP**：访问 XAMPP 官方网站并下载 Windows  `XAMPP`。网站通常会提供软件最新版本。

    2. **运行安装程序**：下载完成后，找到安装文件（通常命名为 `xampp-windows-x.x.x-x-installer.exe`）并双击它开始安装过程。

    3. **遵循安装向导操作**：`XAMPP` 安装向导将引导你完成安装。点击“下一步”继续设置步骤。系统会提示你选择要安装的组件；默认选择（`Apache`、`MySQL`、`PHP`
    和 `phpMyAdmin`）通常对大多数用户足够。点击“下一步”继续。

    4. **选择安装目录**：选择你想要安装 `XAMPP` 的目录。默认位置通常是 `C:\xampp`。点击“下一步”继续。

    5. **完成安装**：点击“安装”开始安装过程。完成后，点击“完成”退出向导。你可以选择立即启动 `XAMPP` 控制面板。

    6. **启动 XAMPP**：打开 `XAMPP` 控制面板（在 `C:\xampp` 目录或通过开始菜单找到）。在控制面板中，点击每个模块旁边的“启动”按钮启动
    `Apache` 和 `MySQL` 模块。这些服务对于运行本地服务器是必要的。

    7. **访问你的本地服务器**：打开浏览器并在地址栏输入 `http://localhost`。你应该看到 `XAMPP` 欢迎页，这意味着你的本地服务器已启动运行。你现在可以将网站文件放置在
    `XAMPP` 安装目录下的 `htdocs` 文件夹（例如 `C:\xampp\htdocs`）中开始开发。


    #### 安装 WAMP


    `WAMP`（Windows, Apache, MySQL, PHP）是 Windows 上另一个流行的本地服务器环境。以下是安装 `WAMP` 的方法：


    1. **下载 WAMP**：访问 WAMP 官方网站并下载适用于 Windows 的最新 `WAMP`。

    2. **运行安装程序**：找到下载的安装文件（例如 `wampserver-x.x.x-x.exe`）并双击它开始安装过程。

    3. **遵循安装向导操作**：`WAMP` 安装向导将引导你完成安装过程。点击“下一步”继续设置步骤。

    4. **选择安装目录**：选择你想要安装 `WAMP` 的目录。默认位置通常是 `C:\wamp`。

    5. **选择组件**：系统会提示你选择要安装的组件；默认选择（`Apache`、`MySQL`、`PHP` 和 `phpMyAdmin`）通常对大多数用户足够。点击“下一步”继续。

    6. **完成安装**：点击“安装”开始安装过程。完成后，点击“完成”退出向导。

    7. **启动 WAMP**：打开 `WAMP` 控制面板（在 `C:\wamp` 目录或通过开始菜单找到）。在控制面板中，点击每个模块旁边的“启动”按钮启动
    `Apache` 和 `MySQL` 模块。

    8. **访问你的本地服务器**：打开浏览器并在地址栏输入 `http://localhost`。你应该看到 `WAMP` 欢迎页，这意味着你的本地服务器已启动运行。你现在可以将网站文件放置在
    `WAMP` 安装目录下的 `www` 文件夹（例如 `C:\wamp\www`）中开始开发。


    ### 1. 配置 PHP


    #### 访问 PHP 配置


    **打开配置文件**：PHP 设置通过 `php.ini` 配置文件进行。在 `XAMPP` 中访问此文件，打开 `XAMPP` 控制面板并点击 `Apache`
    旁边的“Config”按钮。从下拉菜单选择 `php.ini`。在 `WAMP` 中，点击系统托盘中的 `WAMP` 图标，导航到 `PHP` 并选择 `php.ini`。


    **编辑 PHP 设置**：`php.ini` 文件包含你可以根据开发需求调整的各种设置。常见设置包括：

    * `display_errors`：开发期间将其设置为 `On` 以直接在网页上显示错误信息。生产环境中将其更改为 `Off` 以向用户隐藏错误。

    * `upload_max_filesize`：调整此值以设置 PHP 允许的最大文件大小。

    * `max_execution_time`：如果你有需要更多执行时间的脚本，请增加此值。


    **保存更改**：在进行必要的更改后，保存 `php.ini` 文件并通过 `XAMPP` 或 `WAMP` 控制面板重启 `Apache` 以使更改生效。


    #### 验证 PHP 配置


    **创建 PHP 信息文件**：为了验证 PHP 配置正确，在 `htdocs` 目录（XAMPP）或 `www` 目录（WAMP）中创建一个名为 `info.php`
    的文件。


    **使用 Bluefish 等编辑器在此文件中添加以下代码**：


    ```php

    <?php

    phpinfo();

    ?>

    ```


    **查看 PHP 信息**：打开浏览器并导航到 `http://localhost/info.php`。这将显示 PHP 配置的详细报告，包括版本信息和设置。确保所有配置已正确应用。


    ### 2. 配置 MySQL


    #### 访问 MySQL 配置


    **打开 phpMyAdmin**：`XAMPP` 和 `WAMP` 都带有 `phpMyAdmin`，这是一个用于管理 MySQL 数据库的 Web 工具。在浏览器中导航到
    `http://localhost/phpmyadmin` 来打开 `phpMyAdmin`。


    **MySQL 设置**：你可以通过 `phpMyAdmin` 界面或通过编辑 `my.ini` 配置文件调整 MySQL 设置。在 `XAMPP` 中访问
    `my.ini`，点击 `XAMPP` 控制面板中 `MySQL` 旁边的“Config”按钮并选择 `my.ini`。在 `WAMP` 中，你可以在 `WAMP`
    菜单下的 `MySQL` 找到它。


