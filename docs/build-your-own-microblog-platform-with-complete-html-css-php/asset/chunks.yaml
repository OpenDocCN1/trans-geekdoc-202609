    \n## 数据库设计\n\n创建点赞表 (Likes Table)：为了跟踪点赞情况，你需要一张表来记录哪些用户点赞了哪些帖子。该表通常包含 `user_id`、`post_id`\
    \ 和 `timestamp` 等字段。\n\n用于创建表的 SQL 示例：\n\n```sql\nCREATE TABLE post_likes (\n\
    id INT AUTO_INCREMENT PRIMARY KEY,\nuser_id INT NOT NULL,\npost_id INT NOT NULL,\n\
    liked_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\nUNIQUE (user_id, post_id)\n);\n\
    ```\n\n`UNIQUE` 约束确保每个用户只能对同一个帖子进行一次点赞。\n\n更新帖子表 (Posts Table)：可选，你可能想在 `posts`\
    \ 表中添加 `likes_count` 列，以便快速显示该帖子收到的点赞数。\n\n添加列的 SQL 示例：\n\n```sql\nALTER TABLE\
    \ posts ADD COLUMN likes_count INT DEFAULT 0;\n```\n\n## 应用程序逻辑\n\n处理点赞：当用户点赞一个帖子时，向\
    \ `post_likes` 表中插入一条记录。在插入新记录之前检查是否存在现有记录，确保用户不会对同一帖子重复点赞多次。\n\nPHP 代码示例：\n\n\
    ```php\n$stmt = $pdo->prepare(\"INSERT INTO post_likes (user_id, post_id) VALUES\
    \ (?, ?)\");\n$stmt->execute([$user_id, $post_id]);\n// 更新 posts 表中的点赞数\n$stmt\
    \ = $pdo->prepare(\"UPDATE posts SET likes_count = likes_count + 1 WHERE id =\
    \ ?\");\n$stmt->execute([$post_id]);\n```\n\n取消点赞：如果你想允许用户取消点赞，则需要处理移除点赞的操作。这涉及从\
    \ `post_likes` 表中删除记录并更新 `likes_count` 列。\n\nPHP 代码示例：\n\n```php\n// 删除点赞记录\n\
    $stmt = $pdo->prepare(\"DELETE FROM post_likes WHERE user_id = ? AND post_id =\
    \ ?\");\n$stmt->execute([$user_id, $post_id]);\n// 更新 posts 表中的点赞数\n$stmt = $pdo->prepare(\"\
    UPDATE posts SET likes_count = likes_count - 1 WHERE id = ?\");\n$stmt->execute([$post_id]);\n\
    ```\n\n## 前端实现\n\n显示点赞按钮：在帖子页面或帖子列表中，添加一个点赞按钮，用户可以通过点击它来点赞或取消点赞。此按钮应显示当前点赞数，并根据用户是否已经点赞该帖子来改变其状态。\n\
    \nHTML 示例：\n\n```html\n<button id=\"like-button\" data-post-id=\"<?php echo $post_id;\
    \ ?>\">\n赞 (<span id=\"like-count\"><?php echo $likes_count; ?></span>)\n</button>\n\
    ```\n\n使用 AJAX 处理点赞：为了提供顺畅的用户体验，使用 AJAX 在不刷新页的情况下处理点赞。当用户点击点赞按钮时，向你的服务器发送 AJAX\
    \ 请求以更新点赞状态。\n\nJavaScript 示例：\n\n```javascript\ndocument.getElementById('like-button').addEventListener('click',\
    \ function() {\n    var postId = this.getAttribute('data-post-id');\n    var xhr\
    \ = new XMLHttpRequest();\n    xhr.open('POST', 'like_post.php', true);\n    xhr.setRequestHeader('Content-Type',\
    \ 'application/x-www-form-urlencoded');\n    xhr.onload = function() {\n     \
