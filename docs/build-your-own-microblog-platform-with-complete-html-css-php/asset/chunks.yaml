    Open your web browser and go to [Netfirms](https://www.netfirms.com).com. Login
    with your registered domain name and password.


    ## Navigate to MySQL Databases


    Select the icon at the top right-most corner after login that “when hovered says:
    Hosting Tools”.


    You should end up at a similar URL to the following:


    [https://www2.netfirms.com/controlpanel/foundation/yourmicroblog.com/summary](https://www2.netfirms.com/controlpanel/foundation/yourmicroblog.com/summary)


    Select the `MySQL Database` icon.


    On this screen, look for your Netfirms MysQL Server Name which should look something
    like this:


    Server Name: `yourmicroblog11111111.netfirmsmysql.com`


    Write this Server Name down as we will require it later when connecting to database
    from your web-platform.


    Select the `Add a Database` icon located at the top left-most corner of the webpage.


    You will be asked to enter a database name, username, and password.


    For our microblogging platform, enter the following information:


    Database Name: `yourmicroblog_main`


    Username: `yourmicroblog_main`


    Password: `yourpassword`


    Note: These can be changed at any time once your platform is functioning.


    ## Select the Database Name


    Once your database appears in the MySQL Management area, select your database
    named `yourmicroblog_main` until it is highlighted.


    Then, click on the `Access PhpMyAdmin` icon.


    ## Access the SQL Interface


    In phpMyAdmin, click on `yourmicroblog_main` database.


    Then click on the `SQL` tab to open the SQL command interface where you can run
    SQL queries.


    ## Importing the SQL Dump


    ### Prepare the SQL Dump for our Microblogging Platform


    Copy the SQL dump content provided below by first creating your text document
    named `dump.sql` with your text editor like Bluefish.


    Enter all of the SQL Code below exactly as you see it. Keep note that the ( ``
    ` backtick) character is not the same as the ( ‘` accent) character.


    Once you’ve finished, open the `dump.sql` text file, highlight all the text you’ve
    entered, and press `CTRL+C` (or `Command+C` on macOS) to copy it to the clipboard.


    ```sql

    -- Filename: dump.sql

    -- Database: `yourmicroblog_main`

    -- Table structure for table `categories`

    CREATE TABLE `categories` (

    `category_id` int(11) NOT NULL,

    `message_count` bigint(20) DEFAULT ''0'',

    `user_count` bigint(20) DEFAULT ''0'',

    `category_name` varchar(255) NOT NULL,

    `description` text

    ) ENGINE=InnoDB DEFAULT CHARSET=latin1;

    -- Dumping data for table `categories`

    INSERT INTO `categories` (`category_id`, `message_count`,

    `user_count`, `category_name`, `description`) VALUES

    (1, 2, 0, ''Public Square'', ''Welcome to the Public Square! This is the heart
    of our online community.''),

    (2, 0, 0, ''Politics & Activism'', ''This is the place for passionate discussions
    and debates about political issues and social causes.'');

    -- Table structure for table `inform`

    CREATE TABLE `inform` (

    `topic` varchar(125) NOT NULL DEFAULT '''',

    `infotext` varchar(4500) DEFAULT NULL

    ) ENGINE=MyISAM DEFAULT CHARSET=latin1;

    -- Dumping data for table `inform`

    INSERT INTO `inform` (`topic`, `infotext`) VALUES

    (''About yourmicroblog'', ''This is your About Us text. HTML may be used.''),

    (''Site Help & Information'', ''This is your Site Help & Information text. HTML
    may be used.''),

    (''Terms Of Service'', ''This is your Terms of Service text. HTML may be used.''),

    (''Privacy Policy'', ''This is your Privacy Policy text. HTML may be used.''),

    (''Cookie Policy'', ''This is your Cookie Policy text. HTML may be used.'');

    -- Table structure for table `private_messages`

    CREATE TABLE `private_messages` (

    `message_id` int(11) NOT NULL,

    `sender_id` int(11) NOT NULL,

    `receiver_id` int(11) NOT NULL,

    `message_text` text NOT NULL,

    `sent_at` timestamp NULL DEFAULT CURRENT_TIMESTAMP

    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    -- Table structure for table `public_messages`

    CREATE TABLE `public_messages` (

    `message_id` int(11) NOT NULL,

    `parent_id` int(11) NOT NULL DEFAULT ''0'',

    `user_id` int(11) NOT NULL,

    `message_text` varchar(350) NOT NULL,

    `media_type` enum(''image'',''video'') DEFAULT NULL,

    `media_url` varchar(255) DEFAULT NULL,

    `category_id` int(11) NOT NULL,

    `posted_at` timestamp NULL DEFAULT CURRENT_TIMESTAMP,

    `likes` int(11) NOT NULL DEFAULT ''0''

    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    -- Table structure for table `users`

    CREATE TABLE `users` (

    `user_id` int(11) NOT NULL,

    `group_id` tinyint(3) UNSIGNED DEFAULT NULL,

    `username` varchar(255) NOT NULL,

    `password` varchar(255) NOT NULL,

    `cat_list` varchar(255) DEFAULT NULL,

    `profile_picture` varchar(255) DEFAULT NULL,

    `user_status` tinyint(3) UNSIGNED DEFAULT ''0'',

    `starts` timestamp NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,

    `last_active` timestamp NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,

    `last_ip` varchar(40) NOT NULL,

    `email` varchar(60) NOT NULL

    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    -- Indexes for table `categories`

    ALTER TABLE `categories`

    ADD PRIMARY KEY (`category_id`),

    ADD KEY `category_id` (`category_id`);

    -- Indexes for table `inform`

    ALTER TABLE `inform`

    ADD PRIMARY KEY (`topic`);

    -- Indexes for table `private_messages`

    ALTER TABLE `private_messages`

    ADD PRIMARY KEY (`message_id`),

    ADD KEY `sender_id` (`sender_id`),

    ADD KEY `receiver_id` (`receiver_id`);

    -- Indexes for table `public_messages`

    ALTER TABLE `public_messages`

    ADD PRIMARY KEY (`message_id`),

    ADD KEY `user_id` (`user_id`);

    -- Indexes for table `users`

    ALTER TABLE `users`

    ADD PRIMARY KEY (`user_id`);

    ```

    [/content]## Developing the Core PHP Scripts


    ### Creating seamless configuration files for all database connections


    To create a functional microblogging platform, you need to establish a reliable
    connection between your PHP scripts and the MySQL database. This connection allows
    your scripts to interact with the database, handling tasks such as user authentication,
    posting content, and categorizing posts. Below, we’ll walk through the process
    of setting up and configuring your PHP scripts to connect to the database using
    PDO (PHP Data Objects).


    ### Directory Structure Setup


    First, ensure that you have created the necessary directories on your web server
    using FTP:


    The Includes Directory: `public_html/inc`

    (For general includes like configuration and font settings)


    The Templates Directory: `public_html/tpl`

    (For HTML template files)

