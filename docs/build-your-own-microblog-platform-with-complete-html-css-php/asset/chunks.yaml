  trans: "\n\n# 目录结构\n\n- **管理目录**: `public_html/adm`\n（用于管理脚本或界面）\n\n- **图片目录**:\
    \ `public_html/img`\n（用于主站 Logo、图片、图标）\n\n- **移动端目录**: `public_html/mb`\n（对于像我们微博客平台这样较大的网站，我们通过\
    \ `index.php` 文件将移动用户重定向到另一个网站目录。这以后可以轻松地转换为移动 APP）\n\n- **私有目录**: `../public_html/pvt`\n\
    （该目录位于 `public_html` 文件夹之外，以保护敏感文件，如数据库凭据、密码和其他安全功能。它应该被放置在你的 `$HOME` 目录或你通过 FTP\
    \ 登录时所在的目录。）\n\n- **个人头像目录**: `public_html/propics`\n（该目录存放头像类型的个人资料图片，如果用户不想上传照片，可以从中选择）\n\
    \n- **用户图片目录**: `public_html/uimg`\n（该目录存放用户上传的照片）\n\n# 配置您的数据库连接\n\n若要配置为您的微博客平台设置数据库连接，请按照以下步骤操作：\n\
    \n## 创建配置文件\n使用类似 Bluefish 的文本编辑器创建文件：`inc/config.inc.php`\n\n```php\n<?php\n\
    if (!isset($_SESSION['MB_url']))\n{\n    $SESSION_NAME = \"MB_\";\n    if (session_status()\
    \ == PHP_SESSION_NONE)\n    {\n        session_start();\n        $_SESSION['session_id']\
    \ = session_id();\n    }\n    $session_id = $_SESSION['session_id'];\n}\n// Set\
    \ paths\n$private_path = \"../pvt/\";\nif (strpos($_SERVER['PHP_SELF'], \"adm/\"\
    )) {\n    $password_file = \"../\" . $private_path . \"passwd.inc.php\";\n} else\
    \ {\n    $password_file = $private_path . \"passwd.inc.php\";\n}\ninclude($password_file);\n\
    \n// Common PDO options\n$options = [\n    \\PDO::ATTR_ERRMODE => \\PDO::ERRMODE_EXCEPTION,\n\
    \    \\PDO::ATTR_DEFAULT_FETCH_MODE => \\PDO::FETCH_ASSOC,\n    \\PDO::ATTR_EMULATE_PREPARES\
    \   => false,\n];\n// Connect to the database\ntry {\n    $pdo = new \\PDO(\"\
    mysql:host=$host;dbname=$db;charset=$charset\", $user, $pass, $options);\n} catch\
    \ (\\PDOException $e) {\n    error_log('PDOException: ' . $e->getMessage() . '\
    \ in ' . $e->getFile() . ' on line ' . $e->getLine());\n    throw $e;\n}\ninclude(\"\
    inc/fonts.inc.php\");\n?>\n```\n\n### `inc/config.inc.php` 说明\n- `session_start()`\
    \ 初始化会话管理。\n- 根据脚本位置，包含来自 `../pvt/` 或 `$HOME/pvt/` 目录的 `passwd.inc.php` 文件。\n\
    - 设置 PDO 选项并尝试创建一个新的 `PDO` 实例以连接数据库。\n- 包含 `fonts.inc.php` 用于默认字体设置。\n\n 创建密码文件\n\
    创建文件：`../pvt/passwd.inc.php`\n\n```php\n<?php\n// Your MySQL hosting server name\n\
    $host = 'yourmicroblog1005673.net.com';\n// Character encoding\n$charset = 'utf8mb4';\n\
    // Your database name\n$db = 'yourblog_main';\n// Your database username\n$user\
    \ = 'yourblog_main';\n// Your database password\n// decryption & encryption keys\
    \ – must be exactly the same\n$decryptKey = \"zZ9CZZk20bLv-mJ639Stu!\"; // change\
    \ this\n$encryptKey = \"zZ9CZZk20bLv-mJ639Stu!\"; // change this\nNote: 出安全考虑，`pvt`\
    \ 目录应位于 `public_html` 目录之外，通常位于 `$HOME/pvt/`。\n?>\n```\n\n 创建默认字体文件\n创建文件：`inc/fonts.inc.php`\n\
    （注意：并不是所有的字体都是必须的。我们的程序将使用以下字体代码列表）\n\n```php\n<?php\n// default system font codes\n\
    $h1grey_font = \"<font face=helvetica size=1=#808080>\";\n$h2grey_font = \"<font\
