    ;\necho \"<p>a3 灰色字体: $a3grey_font</p>\";\n?>\n```\n\n `index.php` 说明\n显示数据库连接状态和字体设置。\n\
    \n 额外的文件放置说明\n使用 FileZilla 等 FTP 客户端将您的文件上传到托管站点（例如 Netfirms）：\n- 将 `passwd.inc.php`\
