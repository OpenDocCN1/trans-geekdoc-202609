- fmt: "\nA session is essentially a temporary, server-side storage mechanism that\
    \ tracks user data for the duration of their interaction with the website. Upon\
    \ successful login, a unique `session ID` is generated and stored on the server.\
    \ This ID is then sent to the user's browser as a `cookie`, enabling the server\
    \ to identify and authenticate the user on subsequent requests. The `session ID`\
    \ is crucial because it acts as a key that links the user to their session data,\
    \ such as their username, preferences, and any other relevant information.\n\n\
    Secure session handling is vital to prevent unauthorized access and protect user\
    \ data. One important practice is to ensure that `session IDs` are complex and\
    \ randomly generated to reduce the risk of session hijacking, where an attacker\
    \ gains control of another user's session. Additionally, storing session data\
    \ securely on the server and using encrypted cookies (with the `Secure` and `HttpOnly`\
    \ flags) helps prevent `session IDs` from being intercepted or manipulated by\
    \ attackers.\n\nManaging session duration is another essential aspect of session\
    \ handling. Implementing session timeouts ensures that user sessions automatically\
    \ expire after a period of inactivity, reducing the risk of unauthorized access\
    \ if a user leaves their device unattended. For high-security applications, it\
    \ may also be beneficial to implement automatic session regeneration, where a\
    \ new `session ID` is issued after a user logs in or at regular intervals during\
    \ their session. This minimizes the risk of session fixation attacks, where an\
    \ attacker tries to exploit a valid `session ID` to gain unauthorized access.\n\
    \nFinally, it’s important to properly handle session termination. When a user\
    \ logs out, their session should be securely destroyed, removing any stored data\
    \ from the server and invalidating the `session ID`. This ensures that the session\
    \ cannot be reused or exploited by an attacker.\n\nIn summary, session handling\
    \ and user sessions are crucial for maintaining the security and integrity of\
    \ a microblogging platform. By carefully managing `session IDs`, securing cookies,\
    \ implementing timeouts, and properly terminating sessions, you can create a safe\
    \ and reliable user experience.\n\nCreate Filename: `signup.php`\n\n```php\n<?php\n\
    \ninclude \"./inc/config.inc.php\";\n\ninclude(\"./inc/en.messages.inc.php\");\n\
    \nif(!isset($user_id)){$user_id=\"\";}\n\n$user_ip = $_SERVER['REMOTE_ADDR'];\n\
    \n$current_day_start = strtotime('today');\n\nif(!isset($action)){$action=\"\"\
    ;}\n\nif(!isset($_POST['action'])){$_POST['action']=\"\";}\n\nif(!isset($name)){$name=\"\
    \";}\n\nif(!isset($email)){$email=\"\";}\n\nif(!isset($TPL_err)) {$TPL_err=0;}\n\
    \nif(!isset($TPL_errmsg)) {$TPL_errmsg=\"\";}\n\nif($_POST['action'] == \"signup\"\
    )\n\n{\n\n$name=$_POST['name'];\n$email=$_POST['email'];\n$password=$_POST['password'];\n\
    $repeat_password=$_POST['repeat_password'];\n\n// check that all mandatory variables\
    \ in form were retrieved and in\n// correct format\n\nif($name && $email && $password\
    \ && $repeat_password)\n{\n\nif (strlen($name) < 6 || strlen($name) > 60 ||\n\
    preg_match('/\\[^a-zA-Z0-9\\]/', $name))\n{\n\n$TPL_err = 1;\n$TPL_errmsg = \"\
    Your Username is invalid. Usernames must be\nbetween 6 and 60 characters and contain\
    \ only alphanumeric\ncharacters.\";\n\n}\nelseif (strlen($email) < 5 || !filter_var($email,\n\
    FILTER_VALIDATE_EMAIL))\n{\n\n$TPL_err = 1;\n$TPL_errmsg = \"Email address is\
    \ not valid.\";\n\n}\nelseif (strlen($password) < 7 || strlen($password) > 12\
    \ ||\n!preg_match('/\\\\d/', $password) || !preg_match('/\\[#$!\\]/', $password))\n\
    {\n\n$TPL_err = 1;\n$TPL_errmsg = \"Your chosen Password is invalid. Passwords\
    \ must be between 7 and 12 characters in length, include at least one numerical\
    \ digit, and contain at least one special character such as (#$!).\";\n\n}\nelse\
    \ if ($password!==$repeat_password)\n{\n\n$TPL_err=1;\n$TPL_errmsg=\"Passwords\
    \ don't match\";\n\n}\nelse\n{\n\n// Check if user already exists in database\n\
    \n$uname = strtolower($name);\n$email = strtolower($email);\n$stmt = $pdo->prepare('SELECT\
    \ \\* FROM users WHERE LOWER(username) = ? OR LOWER(email) = ?');\n$stmt->execute([$uname,\
    \ $email]);\nif ($row = $stmt->fetch())\n{\n\n// Check which field caused the\
    \ conflict and set the appropriate\n// error message\n\nif (strtolower($row['username'])\
    \ === $uname)\n{\n\n$TPL_err = 1;\n$TPL_errmsg = \"Username already exists. Please\
    \ choose a\ndifferent Username.<br>Or, if you've forgotten your Login\ncredentials,\
    \ please select <a href='forgotpasswd.php'>\nForgot Password</a>\";\n\n}\nelseif\
    \ (strtolower($row['email']) === $email)\n{\n\n$TPL_err = 1;\n$TPL_errmsg = \"\
    Email address already exists. Please use a\ndifferent Email.<br>Or, if you've\
    \ forgotten your Login\ncredentials, please select <a href='forgotpasswd.php'>\n\
    Forgot Password</a>\";\n\n}\n}\n\n// Check if any user with the same IP address\
    \ exists\n\n$sql = \"SELECT COUNT(\\*) AS ip\\_count FROM users WHERE last\\_ip\
    \ = ?\";\n$stmt = $pdo->prepare($sql);\n$stmt->execute([$user_ip, $current_day_start]);\n\
    \n// Fetch the result\n\n$result = $stmt->fetch(FETCH_ASSOC);\n$ip_count = $result['ip_count'];\n\
    \nif ($ip_count > 0)\n\n{\n\n$TPL_err = 1;\n$TPL_errmsg = \"Your account seems\
    \ to already been created. If you've forgotten your Login credentials, please\
    \ select <a href='forgotpasswd.php'>Forgot Password</a>\";\n}\nelse\n{\n\n// prepare\
    \ data for database\n\n$hash_pass = password_hash($password, PASSWORD_BCRYPT);\n\
    \n// Generate unique id (7 digits)\n\n$uniqueId = generateUniqueId($pdo);\n\n\
    // Write to database\n\n$sql = \"INSERT INTO users (user\\_id, group\\_id, username,\n\
    password, cat\\_list, profile\\_picture, user\\_status, starts, last\\_ip, email)\n\
    VALUES (?, ?, ?, ?, ?, ?, current\\_timestamp(),\ncurrent\\_timestamp(), ?, ?)\"\
    ;\n$stmt = $pdo->prepare($sql);\n$stmt->execute([$uniqueId, $group_id, $name,\
    \ $hash\\_pass, NULL, NULL, $suspend, $user_ip, $email]);\n\n// Send confirmation\
    \ email\n\n$replyTo = 'contact@yourmicroblog.com;\n$confirmationLink = \"https://yourmicroblog.com/confirm.php?id=\"\
    \ . urlencode($uniqueId);\n$subject = \"YourMicroblog Confirmation Email\";\n\
    $message = \"Dear $name,<br><br>\";\n$message .= \"Thank you for signing up with\
    \ YourMicroblog. Please click on the following link to confirm your account with\
    \ us: \";\n$message .= \"<a href='$confirmationLink'>$confirmationLink\n</a><br><br>\"\
    ;\n$message .= \"If you did not sign up with us, please <a href=\n'mailto:$replyTo?subject=Unauthorized\
    \ Signup'>notify us</a>\n.<br><br>\";\n$message .= \"Best regards,<br>YourMicroblog\
    \ Team\";\n$headers = \"From: contact@yourmicroblog.com\\\\r\\\\n\";\n$headers\
    \ .= \"Reply-To: $replyTo\\\\r\\\\n\";\n$headers .= \"Priority: High\\\\r\\\\\
    n\";\n$headers .= \"Content-Type: text/html; charset=UTF-8\\\\r\\\\n\";\n\nmail($email,\
    \ $subject, $message, $headers);\n\n?>\n\n<script>\n\n​document.location.href\
    \ = \"success.php?uid=<?= \n$uniqueId; ?>&em=<?=$email;?>\";\n\n</script>\n\n\
    <?php\n\nexit();\n\n}\n\n}\n```\n"
