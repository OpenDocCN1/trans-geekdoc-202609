  trans: "\n显示结果：显示一组匹配的用户个人资料列表，包含用户名和头像等基本信息。包含查看完整个人资料的链接。\n\n## 文章搜索功能示例\n\n```html\n\
    // HTML 中的搜索表单\n<form method=\"get\" action=\"search.php\">\n<input type=\"text\"\
    \ name=\"query\" placeholder=\"搜索文章...\">\n<input type=\"submit\" value=\"搜索\"\
    >\n</form>\n\n<?php\n// 从表单输入获取搜索查询\n$query = isset($_GET['query']) ? $_GET['query']\
    \ : '';\n\n// 准备 SQL 查询以搜索文章\n$sql = \"SELECT * FROM posts WHERE title LIKE :query\
    \ OR content LIKE :query ORDER BY created_at DESC\";\n$stmt = $pdo->prepare($sql);\n\
    $stmt->execute(['query' => \"%$query%\"]);\n$results = $stmt->fetchAll(PDO::FETCH_ASSOC);\n\
    \n// 显示搜索结果\nforeach ($results as $post)\n{\necho \"<div class='post'>\";\necho\
    \ \"<h2>\" . htmlspecialchars($post['title']) . \"</h2>\";\necho \"<p>\" . htmlspecialchars(substr($post['content'],\
    \ 0, 200)) . \"...</p>\";\necho \"<a href='post.php?id=\" . htmlspecialchars($post['id'])\
    \ . \"'>阅读更多</a>\";\necho \"</div>\";\n}\n?>\n```\n\n在此示例中：\n- 搜索表单允许用户输入其搜索查询。\n\
    - `search.php` 脚本通过查找文章标题或内容中的匹配项来处理查询。\n- 结果以基础 HTML 结构显示，展示文章标题和摘要。\n\n将搜索功能集成到你的微博客平台中，可以通过方便用户找到相关的文章和用户，显著提升用户体验。通过实现设计良好的搜索表单、高效地处理搜索查询并以组织化的方式显示结果，你可以增强网站可用性和可访问性。适当搜索功能有助于用户快速定位他们感兴趣的内容，从而提高他们对你平台的参与度和满意度。\n\
    \n## 分页与排序\n\n### 在文章列表页添加分页功能\n\n分页是微博客平台处理大量内容的一项关键功能，允许用户在多页文章之间导航，而不会一次性被过多的信息所淹没。以下是一个如何在\
    \ PHP 中为你的文章列表页实现分页的简要示例。\n\n#### 分页概述\n分页涉及将长文章列表拆分成更小、易于管理的块，并将这些块显示在多个页面上。通常情况下，你每页显示有限数量的文章，并提供在页面之间移动的导航链接。\n\
    \n#### 步骤示例\n\n1. **确定文章总数**\n首先，计算数据库中可用的文章总数。这将有助于确定需要多少页。\n```php\n$pdo = new\
    \ PDO($dsn, $user, $pass, $options);\n$stmt = $pdo->query(\"SELECT COUNT(*) FROM\
    \ posts\");\n$totalPosts = $stmt->fetchColumn();\n```\n\n2. **设置分页变量**\n定义每页显示的文章数量，并从\
    \ URL 参数确定当前页码。\n```php\n$postsPerPage = 10;\n$currentPage = isset($_GET['page'])\
    \ ? (int)$_GET['page'] : 1;\n$start = ($currentPage - 1) * $postsPerPage;\n```\n\
    \n3. **获取当前页的文章**\n使用 SQL 的 `LIMIT` 和 `OFFSET` 只获取当前页所需的文章。\n```php\n$stmt = $pdo->prepare(\"\
    SELECT * FROM posts LIMIT :start, :limit\");\n$stmt->bindParam(':start', $start,\
    \ PDO::PARAM_INT);\n$stmt->bindParam(':limit', $postsPerPage, PDO::PARAM_INT);\n\
    $stmt->execute();\n$posts = $stmt->fetchAll(PDO::FETCH_ASSOC);\n```\n\n4. **计算总页数**\n\
    根据文章总数和每页文章数，计算总页数。\n```php\n$totalPages = ceil($totalPosts / $postsPerPage);\n\
    ```\n\n5. **生成分页链接**\n创建在页面之间跳转的链接。确保分页链接正确反映当前页。\n```php\nfor ($i = 1; $i <=\
    \ $totalPages; $i++) {\n    echo \"<a href='?page=$i' . ($i == $currentPage ?\
    \ \"class='active'\" : \"\") . \">$i</a> \";\n}\n```\n"
- fmt: "\nA \"like\" feature is a popular addition to microblogging platforms and\
    \ social media sites, allowing users to express their appreciation for content.\
    \ Implementing a like feature involves several steps: updating your database,\
    \ modifying your application logic, and ensuring a smooth user experience on the\
    \ front end.\n\n## Database Design\n\nCreate a Likes Table: To track likes, you\
    \ need a table that records which users have liked which posts. This table typically\
    \ includes fields such as `user_id`, `post_id`, and a `timestamp`.\n\nExample\
    \ SQL for Table Creation:\n\n```sql\nCREATE TABLE post_likes (\nid INT AUTO_INCREMENT\
    \ PRIMARY KEY,\nuser_id INT NOT NULL,\npost_id INT NOT NULL,\nliked_at TIMESTAMP\
    \ DEFAULT CURRENT_TIMESTAMP,\nUNIQUE (user_id, post_id)\n);\n```\n\nThe `UNIQUE`\
    \ constraint ensures that each user can only like a post once.\n\nUpdate Posts\
    \ Table: Optionally, you might want to add a `likes_count` column to your `posts`\
    \ table to quickly display the number of likes a post has received.\n\nExample\
    \ SQL for Adding Column:\n\n```sql\nALTER TABLE posts ADD COLUMN likes_count INT\
    \ DEFAULT 0;\n```\n\n## Application Logic\n\nHandling Likes: When a user likes\
    \ a post, insert a record into the `post_likes` table. Ensure that users cannot\
    \ like the same post more than once by checking for existing records before inserting\
    \ new ones.\n\nExample PHP Code:\n\n```php\n$stmt = $pdo->prepare(\"INSERT INTO\
    \ post_likes (user_id, post_id) VALUES (?, ?)\");\n$stmt->execute([$user_id, $post_id]);\n\
    // Update the likes count in the posts table\n$stmt = $pdo->prepare(\"UPDATE posts\
    \ SET likes_count = likes_count + 1 WHERE id = ?\");\n$stmt->execute([$post_id]);\n\
    ```\n\nRemoving Likes: If you want to allow users to unlike posts, you'll need\
    \ to handle the removal of likes. This involves deleting the record from the `post_likes`\
    \ table and updating the `likes_count` column.\n\nExample PHP Code:\n\n```php\n\
    // Delete like record\n$stmt = $pdo->prepare(\"DELETE FROM post_likes WHERE user_id\
    \ = ? AND post_id = ?\");\n$stmt->execute([$user_id, $post_id]);\n// Update the\
    \ likes count in the posts table\n$stmt = $pdo->prepare(\"UPDATE posts SET likes_count\
    \ = likes_count - 1 WHERE id = ?\");\n$stmt->execute([$post_id]);\n```\n\n## Front-End\
    \ Implementation\n\nDisplay Like Button: On the post page or within the post listing,\
    \ add a like button that users can click to like or unlike a post. This button\
    \ should show the current like count and change its state based on whether the\
    \ user has already liked the post.\n\nExample HTML:\n\n```html\n<button id=\"\
    like-button\" data-post-id=\"<?php echo $post_id; ?>\">\nLike (<span id=\"like-count\"\
    ><?php echo $likes_count; ?>span>)\n</button>\n```\n\nAJAX for Likes: To provide\
    \ a smooth user experience, use AJAX to handle likes without refreshing the page.\
    \ When a user clicks the like button, send an AJAX request to your server to update\
    \ the like status.\n\nExample JavaScript:\n\n```javascript\ndocument.getElementById('like-button').addEventListener('click',\
    \ function() {\n    var postId = this.getAttribute('data-post-id');\n    var xhr\
    \ = new XMLHttpRequest();\n    xhr.open('POST', 'like_post.php', true);\n    xhr.setRequestHeader('Content-Type',\
    \ 'application/x-www-form-urlencoded');\n    xhr.onload = function() {\n     \
    \   if (xhr.status === 200) {\n            var response = JSON.parse(xhr.responseText);\n\
    \            document.getElementById('like-count').innerText = response.new_like_count;\n\
    \        }\n    };\n    xhr.send('post_id=' + postId);\n});\n```\n\nIn `like_post.php`,\
    \ handle the logic for adding or removing likes and return the updated like count.\n\
    \nImplementing a like feature involves database setup to track likes, application\
    \ logic to handle adding and removing likes, and front-end updates to provide\
    \ a seamless user experience. By integrating these components effectively, you\
    \ enhance user engagement and provide a valuable way for users to interact with\
    \ your content.\n\n## Allowing users to share posts on social media\n\nIncorporating\
    \ social media sharing functionality into your microblogging platform is a powerful\
    \ way to increase visibility and engagement. This feature allows users to share\
    \ posts directly from your site to their social media profiles, thereby extending\
    \ the reach of your content. Implementing social media sharing involves integrating\
    \ social media platforms' APIs and ensuring a seamless user experience.\n\n###\
    \ Integrating Social Media APIs\n\nTo enable users to share posts on social media,\
    \ you need to integrate with the APIs of popular social media platforms such as\
