- fmt: "\n`max_allowed_packet`: Increase this value if you need to handle large SQL\
    \ queries or data imports.\n\n`query_cache_size`: Adjust this setting to improve\
    \ the performance of repeated queries.\n\nCreate and Manage Databases: In phpMyAdmin,\
    \ you can create new databases, manage existing ones, and set up user permissions.\
    \ Use the “Databases” tab to create new databases and the “Users” tab to manage\
    \ user accounts and privileges.\n\nSecure MySQL Installation: For added security,\
    \ especially if you plan to expose your local environment to others, set a root\
    \ password for MySQL. In phpMyAdmin, you can set this under the “Users” tab by\
    \ selecting the `root` user and updating the password.\n\n## 3. Using PDO for\
    \ Database Interactions\n\n### a. Introduction to PDO:\n\nPHP Data Objects (`PDO`)\
    \ is a database access layer providing a uniform method of access to multiple\
    \ databases. `PDO` offers a secure and flexible way to interact with databases,\
    \ making it a preferred choice for handling database operations in PHP applications.\n\
    \n### b. Creating a PDO Connection:\n\nTo use `PDO`, you need to establish a connection\
    \ to your MySQL database.\n\nHere’s a basic example of how to create a `PDO` connection\
    \ in PHP:\n\n```php\n<?php\n$dsn = 'mysql:host=localhost;dbname=testdb;charset=utf8';\n\
    $username = 'root'; // MySQL username\n$password = ''; // MySQL password\n\ntry\
    \ {\n    $pdo = new PDO($dsn, $username, $password);\n    $pdo->setAttribute(PDO::ATTR_ERRMODE,\
    \ PDO::ERRMODE_EXCEPTION);\n    echo \"Connected successfully\";\n} catch (PDOException\
    \ $e) {\n    echo \"Connection failed: \" . $e->getMessage();\n}\n?>\n```\n\n\
    `$dsn`: The Data Source Name (`DSN`) contains the information required to connect\
    \ to the database, including the host, database name, and character set.\n\n`$username`:\
    \ Your MySQL username, typically `root` for local development.\n\n`$password`:\
    \ Your MySQL password; leave it empty if you haven’t set one.\n\n### c. Performing\
    \ Database Operations with PDO:\n\nHere’s an example of how to perform basic database\
    \ operations using `PDO`:\n\nInserting Data:\n\n```php\n<?php\n$sql = \"INSERT\
    \ INTO users (username, email) VALUES (:username, :email)\";\n$stmt = $pdo->prepare($sql);\n\
    $username = 'john_doe';\n$email = 'john.doe@example.com';\n$stmt->bindParam(':username',\
    \ $username);\n$stmt->bindParam(':email', $email);\n$stmt->execute();\n?>\n```\n\
    \nRetrieving Data:\n\n```php\n<?php\n$sql = \"SELECT * FROM users\";\n$stmt =\
    \ $pdo->query($sql);\nwhile ($row = $stmt->fetch(PDO::FETCH_ASSOC)) {\n    echo\
    \ \"Username: \" . $row['username'] . \" - Email: \" . $row['email'] . \"<br>\"\
    ;\n}\n?>\n```\n\nConfiguring PHP and MySQL on your local machine, and using `PDO`\
    \ for database interactions, ensures your development environment is robust and\
    \ secure. By setting up and managing your local server environment effectively,\
    \ you can streamline your development process and build applications that are\
    \ ready for deployment.\n\n## How to install Apache, PHP, MariaDB for local development\
    \ (Linux)\n\nSetting up a local development environment on a Linux system involves\
    \ installing and configuring Apache (the web server), PHP (the scripting language),\
    \ and MariaDB (the database server). This setup will allow you to develop and\
    \ test your web applications locally before deploying them to a production server.\n\
    \nHere’s a step-by-step guide to installing and configuring these components on\
    \ a Linux system:\n\n### 1. Installing Apache\n\n### a. Update Your Package List:\n\
    \nBefore installing Apache, update your package list to ensure you have the latest\
    \ information about available packages.\n\nOpen a terminal and run:\n```bash\n\
    sudo apt update\n```\n\n### b. Install Apache:\n\nTo install Apache, use the following\
    \ command:\n```bash\nsudo apt install apache2\n```\n\n### c. Start and Enable\
    \ Apache:\n\nAfter installation, start Apache and enable it to run at boot:\n\
    ```bash\nsudo systemctl start apache2\nsudo systemctl enable apache2\n```\n\n\
    ### d. Verify Installation:\n\nTo ensure Apache is running, open a web browser\
    \ and navigate to `http://localhost`.\n\nYou should see the Apache2 Ubuntu or\
    \ Debian Default Page, indicating that Apache is successfully installed and running.\n\
    \n### 2. Installing PHP\n\n### a. Install PHP:\n\nTo install PHP and its necessary\
    \ modules, use the following command:\n```bash\nsudo apt install php libapache2-mod-php\
    \ php-mysql\n```\nThis command installs PHP along with the Apache PHP module and\
    \ MySQL support for PHP.\n\n### b. Verify PHP Installation:\n\nTo verify that\
    \ PHP is working with Apache, create a PHP info file. Run the following commands:\n\
    ```bash\nsudo nano /var/www/html/info.php\n```\n\nAdd the following code to the\
    \ file:\n```php\n<?php\nphpinfo();\n?>\n```\n\nSave the file and exit the editor.\
    \ Open a web browser and navigate to `http://localhost/info.php`. You should see\
    \ the PHP information page, confirming that PHP is correctly installed and configured\
    \ with Apache.\n\n### 3. Installing MariaDB\n\n### a. Install MariaDB:\n\nTo install\
    \ MariaDB, use the following command:\n```bash\nsudo apt install mariadb-server\
    \ mariadb-client\n```\n\n### b. Secure MariaDB Installation:\n\nRun the security\
    \ script to improve the security of your MariaDB installation:\n```bash\nsudo\
    \ mysql_secure_installation\n```\n\nFollow the prompts to set a root password\
    \ and remove insecure default settings.\n\n### c. Start and Enable MariaDB:\n\n\
    Start MariaDB and enable it to run at boot:\n```bash\nsudo systemctl start mariadb\n\
    sudo systemctl enable mariadb\n```\n\n### d. Verify MariaDB Installation:\n\n\
    To verify that MariaDB is running, you can log in to the MariaDB shell:\n```bash\n\
    sudo mysql -u root -p\n```\n\nEnter the root password you set during the secure\
    \ installation process.\n\n## 4. Configuring Apache, PHP, and MariaDB\n\n### a.\
    \ Configure Apache for PHP:\n\nEnsure that Apache is configured to handle PHP\
    \ files. By default, the `libapache2-mod-php` package should set this up, but\
    \ you can check the `/etc/apache2/mods-enabled/dir.conf` file.\n\n```apache\n\
    <IfModule dir_module>\n    DirectoryIndex index.php index.html\n</IfModule>\n\
    ```\n\nRestart Apache to apply any changes:\n```bash\nsudo systemctl restart apache2\n\
    ```\n\n### b. Configure MariaDB:\n\nCreate a new MariaDB database and user for\
    \ your web applications. Log in to the MariaDB shell:\n```bash\nsudo mysql -u\
    \ root -p\n```\n\nThen execute the following SQL commands:\n```sql\nCREATE DATABASE\
    \ mydatabase;\nCREATE USER 'myuser'@'localhost' IDENTIFIED BY 'mypassword';\n\
    GRANT ALL PRIVILEGES ON mydatabase.* TO 'myuser'@'localhost';\nFLUSH PRIVILEGES;\n\
    EXIT;\n```\n\n## 5. Testing Your Setup\n\n### a. Create a Test PHP Script:\n\n\
    Create a test PHP script to connect to your MariaDB database. Save the following\
    \ code as `db_test.php` in the `/var/www/html` directory:\n\n```php\n<?php\n$dsn\
    \ = 'mysql:host=localhost;dbname=mydatabase;charset=utf8';\n$username = 'myuser';\n\
    $password = 'mypassword';\n\ntry {\n    $pdo = new PDO($dsn, $username, $password);\n\
    \    $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n    echo\
    \ \"Connected successfully\";\n} catch (PDOException $e) {\n    echo \"Connection\
    \ failed: \" . $e->getMessage();\n}\n?>\n```\n\nNavigate to `http://localhost/db_test.php`\
    \ in your web browser. If everything is configured correctly, you should see a\
    \ “Connected successfully” message.\n"
