- fmt: "\nThese steps ensure that your configuration files are correctly included,\
    \ your database connection is functional, and your font settings are properly\
    \ applied. This helps verify your setup and troubleshoot any issues early in the\
    \ development process.\n\nAfter a successful connection - For all other PHP scripts,\
    \ we will be including the following code at the start to ensure that for each\
    \ page a session is started or managed, a database connection is made, and font\
    \ code variables are made available:\n\n```php\n<?php\n\ninclude(\"inc/config.inc.php\"\
    );\n\necho $a3black\\_font . \"Hello World!\";\n\n?>\n```\n\n## Implementing User\
    \ Registration and Login\n\nImplementing a user registration and login system\
    \ is a crucial step in building a secure and interactive microblogging platform.\
    \ This system allows users to create accounts, securely log in, and access personalized\
    \ features on your site. The registration process typically involves capturing\
    \ user information such as username, email address, and password, and securely\
    \ storing this data in your `MySQL` database. Ensuring that passwords are encrypted\
    \ before storage is essential for protecting user data from unauthorized access.\n\
    \nOnce registered, users can log in using their credentials. The login system\
    \ validates the provided username and password against the stored data in the\
    \ database. Upon successful authentication, a session is initiated to keep the\
    \ user logged in as they navigate through the site. Proper session management\
    \ is important to maintain user privacy and security, especially when dealing\
    \ with sensitive information.\n\nTo build a robust user registration and login\
    \ system, it’s essential to implement input validation, error handling, and security\
    \ measures such as password hashing and secure session management. This not only\
    \ enhances the user experience but also protects your platform from common security\
    \ threats like `SQL injection` and session hijacking. As your platform grows,\
    \ this system can be expanded to include features like password recovery, email\
    \ verification, and user role management, further enhancing the security and functionality\
    \ of your microblogging site.\n\nOur microblogging program will now begin. We\
    \ will require some new directories and files created then uploaded to our website\
    \ `public_html` directory. We have already created all required databases and\
    \ have tested the database connection.\n\n### Directories that must exist for\
    \ our microblog platform:\n\n- **The Includes Directory**: `public_html/inc` (For\
    \ general includes like configuration and font settings)\n- **The Templates Directory**:\
    \ `public_html/tpl` (For HTML template files)\n- **The Admin Directory**: `public_html/adm`\
    \ (For administrative scripts or interfaces)\n- **The Images Directory**: `public_html/img`\
    \ (For main website logos, images, icons)\n- **The Mobile Directory**: `public_html/mb`\
    \ (For a larger website like our microblog platform, we direct mobile users to\
    \ an alternate website directory through the `index.php` file. This can later\
    \ easily be converted into a mobile APP)\n- **The Private Directory**: `../public_html/pvt`\
    \ (This directory is located outside the `public_html` folder to keep sensitive\
    \ files, such as database credentials, passwords, and other secure functions,\
    \ protected. It should be placed in your `$HOME` directory or the directory you\
    \ are in.)\n- **The Profile Directory**: `public_html/prop` (This directory holds\
    \ avatar-type pictures that users can choose from if they don’t want to upload\
    \ photo)\n- **The User Images Directory**: `public_html/uimg` (This directory\
    \ holds photos)\n\n## Creation of the Micro-Blog Platform\n\nFrom this point forward,\
    \ we will provide the actual scripts that are used in building our platform. The\
    \ following are PHP and HTML scripts to be created in their respective directories:\n\
    \n**Filename**: `public_html/index.php` (Note: This is the first file to be loaded\
    \ when a user visits your website. We include the mobile directory if this usage\
    \ is ideal)\n\n```php\n<?php\n// This is a routine that checks if user is using\
    \ mobile device\nfunction isMobile() {\n    $userAgent = $_SERVER['HTTP_USER_AGENT'];\n\
    \    $mobileKeywords = ['Mobile', 'Android', 'iPhone', 'Windows'];\n    foreach\
    \ ($mobileKeywords as $keyword) {\n        if (stripos($userAgent, $keyword) !==\
    \ false) {\n            return true;\n        }\n    }\n    return false;\n}\n\
    \n/* Below we call isMobile() function to determine if user is connected via mobile\
    \ phone. If it is, we then retrieve additional language files in session. */\n\
    if (isMobile()) {\n    if (isset($_GET['page']) || isset($_SESSION['MB_lang']))\
    \ {\n        $uid = isset($_GET['page']) ? $_GET['page'] : '';\n        $queryParams\
    \ = array();\n        if (!empty($uid)) {\n            $queryParams[] = \"uid=$uid\"\
    ;\n        }\n        $queryString = implode('&', $queryParams);\n        if (!empty($queryString))\
    \ {\n            $redirectUrl = \"./mb/index.php?$queryString\";\n           \
    \ header(\"Location: $redirectUrl\");\n        } else {\n            header(\"\
    Location: ./mb/index.php\");\n        }\n    }\n} else {\n    // if not mobile\
    \ – we load our config.php, en.messages.php, header.php, tpl.index.html located\
    \ in public_html directory\n    include(\"./inc/config.php\");\n    include(\"\
    ./inc/en.messages.php\");\n    include(\"./header.php\");\n    include(\"./tpl/index.html\"\
    );\n}\n?>\n```\n\n**Filename**: `public_html/tpl/index.html`\n\n```html\n<html>\n\
    <body>\n<br><br><br>\n    <table width='100%' align='center' border='0' cellpadding='5'\
    \ cellspacing='50'>\n        <tr>\n            <td width='40%' height='500' align='center'\
    \ valign='middle'>\n                <img src='img/logo.jpg'>\n               \
    \ <p align='left'></p>\n            </td>\n            <td width='60%' height='500'\
    \ valign='top'>\n                <br>\n                <b>Discover, Unlock now</b><br>\n\
    \                <b>Signup today to start your microblogging journey.</b><br>\n\
    \                <a href='signup.php'>Create account</a>\n                <br>\n\
    \                <span>By creating your account and signing up, you agree to YourMicroBlog's\
    \ <a href='info.php?topic=Terms of Service'>Terms of Service</a>, <a href='info.php?topic=Privacy\
    \ Policy'>Privacy Policy</a>, and <a href='info.php?topic=Cookie Policy'>Cookie\
    \ Policy</a></span>\n                <br><br>\n                <b>Already have\
    \ an account?</b><br>\n                <a href='login.php'>Log In</a>\n      \
    \      </td>\n        </tr>\n    </table>\n</body>\n</html>\n```\n\n**Filename**:\
    \ `inc/en.messages.php`\n\n```php\n<?php\n// Error Messages\n$ERR_001 = \"An error\
    \ occurred.\";\n\n// Navigation Messages\n$MSG_000 = \"YourMicroBlog\"; // site\
    \ title\n$MSG_001 = \"<ul><b>YourMicroBlog</b></li><li><li></li></ul>\";\n$MSG_002\
    \ = \"Microblogging Platform\";\n?>\n```\n\n**Filename**: `inc/fr.messages.php`\n\
    \n```php\n<?php\n// Error Messages\n$ERR_001 = \" Une erreur s’est produite.\"\
    ;\n\n// Navigation Messages\n$MSG_000 = \"YourMicroBlog\"; // site title\n$MSG_001\
    \ = \"<ul><b>YourMicroBlog</b></li><li><li></li></ul>\";\n$MSG_002 = \" Plateforme\
    \ de microblogging\";\n?>\n```\n\n**Filename**: `public_html/header.php`\n\n```php\n\
    <?php\n// Here we want user’s to Login so we make sure to unset any login\n//\
    \ session variables\nif(isset($_SESSION['MB_ID']))\n{\n    unset($_SESSION['MB_ID']);\n\
    \    unset($_SESSION['MB_NAME']);\n}\n?>\n```\n"
