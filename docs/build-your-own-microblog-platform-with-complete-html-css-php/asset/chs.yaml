  \ DEFAULT NULL,\n`category_id` int(11) NOT NULL,\n`posted_at` timestamp NULL DEFAULT\
  \ CURRENT_TIMESTAMP,\n`likes` int(11) NOT NULL DEFAULT '0'\n) ENGINE=InnoDB DEFAULT\
  \ CHARSET=utf8mb4;\n-- Table structure for table `users`\nCREATE TABLE `users` (\n\
  `user_id` int(11) NOT NULL,\n`group_id` tinyint(3) UNSIGNED DEFAULT NULL,\n`username`\
  \ varchar(255) NOT NULL,\n`password` varchar(255) NOT NULL,\n`cat_list` varchar(255)\
  \ DEFAULT NULL,\n`profile_picture` varchar(255) DEFAULT NULL,\n`user_status` tinyint(3)\
  \ UNSIGNED DEFAULT '0',\n`starts` timestamp NULL DEFAULT CURRENT_TIMESTAMP,\n`last_active`\
  \ timestamp NULL DEFAULT CURRENT_TIMESTAMP,\n`last_ip` varchar(40) NOT NULL,\n`email`\
  \ varchar(60) NOT NULL\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n-- Indexes for\
  \ table `categories`\nALTER TABLE `categories`\nADD PRIMARY KEY (`category_id`),\n\
  ADD KEY `category_id` (`category_id`);\n-- Indexes for table `inform`\nALTER TABLE\
  \ `inform`\nADD PRIMARY KEY (`topic`);\n-- Indexes for table `private_messages`\n\
  ALTER TABLE `private_messages`\nADD PRIMARY KEY (`message_id`),\nADD KEY `sender_id`\
  \ (`sender_id`),\nADD KEY `receiver_id` (`receiver_id`);\n-- Indexes for table `public_messages`\n\
  ALTER TABLE `public_messages`\nADD PRIMARY KEY (`message_id`),\nADD KEY `user_id`\
  \ (`user_id`);\n-- Indexes for table `users`\nALTER TABLE `users`\nADD PRIMARY KEY\
  \ (`user_id`);\n```\n[/content]## 开发核心 PHP 脚本\n\n### 为所有数据库连接创建无缝配置文件\n\n为了创建一个功能良好的微博客平台，您需要在您的\
  \ PHP 脚本与 MySQL 数据库之间建立可靠的连接。这种连接允许您的脚本与数据库交互，处理用户身份验证、发布内容和帖子分类等任务。下面，我们将介绍如何使用\
  \ PDO 配置您的 PHP 脚本以连接到数据库。\n\n### 目录结构设置\n\n首先，确保您已通过 FTP 在您的 Web 服务器上创建了必要的目录：\n\
  \n包含目录：`public_html/inc`\n（用于配置和字体设置等通用包含）\n\n模板目录：`public_html/tpl`\n（用于 HTML 模板文件）\n\
  \n\n\n\n\n# 目录结构\n\n- **管理目录**: `public_html/adm`\n（用于管理脚本或界面）\n\n- **图片目录**: `public_html/img`\n\
  （用于主站 Logo、图片、图标）\n\n- **移动端目录**: `public_html/mb`\n（对于像我们微博客平台这样较大的网站，我们通过 `index.php`\
  \ 文件将移动用户重定向到另一个网站目录。这以后可以轻松地转换为移动 APP）\n\n- **私有目录**: `../public_html/pvt`\n（该目录位于\
  \ `public_html` 文件夹之外，以保护敏感文件，如数据库凭据、密码和其他安全功能。它应该被放置在你的 `$HOME` 目录或你通过 FTP 登录时所在的目录。）\n\
  \n- **个人头像目录**: `public_html/propics`\n（该目录存放头像类型的个人资料图片，如果用户不想上传照片，可以从中选择）\n\n\
  - **用户图片目录**: `public_html/uimg`\n（该目录存放用户上传的照片）\n\n# 配置您的数据库连接\n\n若要配置为您的微博客平台设置数据库连接，请按照以下步骤操作：\n\
  \n## 创建配置文件\n使用类似 Bluefish 的文本编辑器创建文件：`inc/config.inc.php`\n\n```php\n<?php\nif\
  \ (!isset($_SESSION['MB_url']))\n{\n    $SESSION_NAME = \"MB_\";\n    if (session_status()\
  \ == PHP_SESSION_NONE)\n    {\n        session_start();\n        $_SESSION['session_id']\
  \ = session_id();\n    }\n    $session_id = $_SESSION['session_id'];\n}\n// Set\
  \ paths\n$private_path = \"../pvt/\";\nif (strpos($_SERVER['PHP_SELF'], \"adm/\"\
  )) {\n    $password_file = \"../\" . $private_path . \"passwd.inc.php\";\n} else\
  \ {\n    $password_file = $private_path . \"passwd.inc.php\";\n}\ninclude($password_file);\n\
  \n// Common PDO options\n$options = [\n    \\PDO::ATTR_ERRMODE => \\PDO::ERRMODE_EXCEPTION,\n\
  \    \\PDO::ATTR_DEFAULT_FETCH_MODE => \\PDO::FETCH_ASSOC,\n    \\PDO::ATTR_EMULATE_PREPARES\
  \   => false,\n];\n// Connect to the database\ntry {\n    $pdo = new \\PDO(\"mysql:host=$host;dbname=$db;charset=$charset\"\
  , $user, $pass, $options);\n} catch (\\PDOException $e) {\n    error_log('PDOException:\
  \ ' . $e->getMessage() . ' in ' . $e->getFile() . ' on line ' . $e->getLine());\n\
  \    throw $e;\n}\ninclude(\"inc/fonts.inc.php\");\n?>\n```\n\n### `inc/config.inc.php`\
