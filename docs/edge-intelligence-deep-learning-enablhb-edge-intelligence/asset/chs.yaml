  \n# 用于边缘计算的深度学习\n\n# 第 12 章：使用边缘 AI 的商业机会\n\n在现代世界中，数字化业务日益增加。业务运营依赖于人工智能和机器人技术等技术来提高营业额。在本章中，我们将了解数字化业务的优势，并讨论了其他一些挑战。\n\
  \n### 12.1 数字化业务\n\n数字化业务是应用数字技术改进业务模式的过程。这包括社交物联网和语义物联网。云服务的应用减少了对设备的需求。数字化业务增加了零售和教育等机构的收入。\n\
  \n将数字化业务引入农业、医疗保健等行业的传统业务运营中可以极大提高业务的可见性。例如，自动记录患者健康状况并决定解决方案可以提高患者满意度和医生服务能力。\n\
  \n数字化业务的应用可以节省服务或业务运营的时间。例如，高效的供应链管理利用物流和数字支持平台增加向各地的交付。显然，过程所需的时间减少到了最低。随后，人力和其他相关资源可以得到优化。\n\
  \n数据是卓越业务运营的关键来源。业务运营涉及的数据分为几类，如下所示：\n\n1. 营销数据：使用机器或人类群体收集的用于为产品营销活动提供信息的数据。营销数据涉及广告及其结果。根据机器执行的广告结果进行自动评估。否则，结果通过任何地理地区的个人营销人员展示。\n\
  \n2. 销售数据：这些数据对于理解销售模式和销售量是必要的。销售模式取决于节假日、活动以及社会成员的财富。该模式可以决定未来几年或几个月产生的销售数量。同样，它可以确定对购买产品感兴趣的群体。\n\
  \n\n\n\n\n### 3. 内部数据\n在组织内部收集和利用的数据被称为内部数据。这些数据提供了大量关于组织成长的信息，包括员工的成长和福祉。由于内部信息包含了许多内容和建议，这些数据可以改善业务机会。相比之下，外部数据是指与组织外部形象或视角对应的数据。例如，教育机构的外部数据可能是从组织场所之外收集的学生家庭详情或司法记录。\n\
  \n### 4. 实时/离线数据\n在大多数业务中，都使用了实时数据。在实时模式下，数据是在应用程序于计算节点上运行时期间收集的。实时数据对于做出及时的业务决策具有影响。显然，选择离线数据并不合适。但在某些应用中，预计业务数据量可能会更大。由于决策开销，这些海量数据无法进行实时处理。因此，离线业务数据在某些应用中是有用的。\n\
  \n### 5. 结构化/非结构化/半结构化数据\n在执行业务操作时利用的数据在本质上可以是结构化的、非结构化的或半结构化的。结构化数据具有预定义的参数和数据字段，可以用于预测算法，如\
  \ `Random Forests`（随机森林）、`Support Vector Machines`（支持向量机）或 `XGBoost`。在某些情况下，数据是不完整的或无法完全分类。因此，需要遵循特定的方法来处理半结构化数据以增强业务操作。然而，当数据足够大时，几乎无法从数据中开发或分类特征。在这种情况下，数据是非结构化的：即它们没有通过预定义的特征进行分类。因此，需要一些深度学习或无监督学习算法来处理此类非结构化数据以推动业务。\n\
  \n![图 12.1. 业务运营数据。](img/bk978-0-7503-5593-3ch12f1_online.jpg)\n\n**图 12.1.** 业务运营数据。\n\
  \n此外，在业务操作中，交易可以自动化并记录在数字账本上。过去，交易是以一对一的方式进行的。虽然这种业务维持了很强的信任度，但业务的可扩展性被降至最低。多年后，银行和中央控制机构等信赖方的建立增加了交易能力。例如，一个来自印度的人可以与另一个国家的人进行交易和开展业务，而无需彼此认识。在这种方法下，银行或第三方在执行业务时提供信任。然而，第三方机构与卖家或买家之间的故障引入了数字化的新颖性。特别是，研究人员引入了区块链的概念，其中受信任的网络为进行交易的人提供信任。\n\
  \n总结，随着数字化以及相关边缘启用解决方案的出现，业务市场领域已经扩大。作为下一层级的创新，边缘 AI 在业务操作中的应用可以显著增加收入或服务能力。同样，还有一些方法可以改进推进技术所涉及的成本，例如基于无服务器函数的架构（参见图\
  \ 12.2）。本章解释了通过引入数字化或通过最小化边缘 AI 平台或框架技术开发涉及的成本来丰富业务运营的可能性。\n\n![图 12.2. 成本改进：基础设施和数字化。](img/bk978-0-7503-5593-3ch12f2_online.jpg)\n\
  \n**图 12.2.** 成本改进：基础设施和数字化。\n\n### 12.2 经济影响因素\n边缘计算依赖于内存和计算需求。为边缘 AI 应用配置内存并为此类任务选择适当资源可以提高应用中涉及的成本\
  \ `[10]`。此外，在此类边缘 AI 应用中采用的部署程序会对相关成本产生影响。本节详细探讨了可以在边缘 AI 框架或平台上采用的潜在成本改进因素，以改进边缘\
  \ AI 应用的内存、计算和部署策略。\n\n#### 12.2.1 云端/边缘特定成本\n与采用边缘启用源相比，纯在云端运行应用程序的成本是昂贵的。值得注意的是，云提供了服务可用方案来提供计算节点、存储单元和网络设备。基于服务的云开发和托管功能在应用程序执行期间会产生费用。例如，费用是根据提供服务器实例作为服务的请求或每个应用程序下载的\
  \ GB 数量计算的。\n\n事实上，云端服务除了利用应用程序资源外，还会导致不必要的成本。已经存在 `IaaS` 服务未被正确停止的情况。在某些情况下，云的自动伸缩功能增加了服务资源的可用性，尽管有时并不需要数量的资源。同样，涉及\
  \ `Matlab` 或类似许可软件的服务在评估服务成本利用率方面变得复杂。\n\n此外，在云端特定的实现中包含安全相关产品或辅助软件组件会增加与云端提供方案相关的成本。在物联网（IoT）-云应用中，微型设备对防止安全危害的愿望高于云节点，因为传感器设备更容易受到安全攻击。这是由于微型设备具有内存或计算资源限制。\n\
  \n为了克服纯云端的传感器实现，现代边缘 AI 应用采用了基于无服务器函数的执行模型，以在某种程度上降低成本。特别是，任何基于物联网的应用程序在整个应用程序运行期间都不需要云服务或相关资源。相反，它根据数据标记少数更新或提供决策或建议。为此，云端启用无服务器的执行模型将是一个合适且成本效益的解决方案。该执行模型可以通过修改现有实现部署在交通、医疗保健、工业或类似的应用领域。\n\
  \n云端的无服务器执行模型涉及数据触发器以启用云硬件或相关服务。它涉及可以配置的函数，指定内存、计算和网络实例的需求。执行模型高度依赖于基础设施提供商，如 `Amazon`\
  \ 或 `Google`。整个实现或基础设施根据函数以及与函数相关的业务逻辑进行触发。\n\n基于无服务器函数的应用程序开发需要一个考虑资源可用性的平台。例如，函数寻求在特定时间内平台上可能不可用的计算资源。在这种情况下，服务器实例必须进行冷启动实例，即平台必须识别可以创建并启动虚拟实例以执行函数的正确服务器。`[17]`\
  \ 的作者在为应用程序采用无服务器平台时，研究了冷启动和热启动实例的影响。\n\n\n\n\nServerless 平台作为云提供商的执行环境，往往面临由提供商带来的挑战。例如，审计功能对用户是隐藏的；此外，资源选择被交给了\
  \ serverless 平台的第三方供应商。因此，尽管具有潜在的成本节约，但在基于 serverless 的实现中存在许多挑战。\n\n边缘辅助应用最大限度地减少了潜在的云特定成本，包括基于\
  \ serverless 的云端实现。这是因为通过多个高可用性边缘集群的集合来提供分布式智能。安全相关的组件可以由一些能力尚可的内部计算设备提供，例如 `Raspberry\
  \ Pi` 节点。这些具有计算能力的节点可以全年运行，无需云端干预。显然，与边缘赋能的 AI 应用相关的成本可以大幅降低。\n\n#### 12.2.2 内存相关成本改进\n\
  \n与边缘 AI 应用内存使用相关的成本可以根据几个因素进行精细调整。内存管理和控制功能可以增加数据的可用性。相应的，应用程序的性能随之提高。因此，内存管理及相关技术可以最小化边缘\
  \ AI 应用涉及的成本。\n\n##### 12.2.2.1 缓存\n\n通常，有一种方法是将所有请求转发并将查询处理到云端。这种情况在边缘赋能的应用中是可以避免的。所需的模型可以定期缓存在边缘集群中。此外，云端支持的计算实例可以利用缓存服务。`[9]`\
  \ 的作者在将缓存技术集成到边缘-云平台时，揭示了缓存的重要性。他们研究了视频处理应用的存储成本、远程数据评估成本以及相关成本。\n\n在边缘 AI 系统中包含缓存组件的理念是主动缓存云端计算的学习模型。同样，它可以缓存工作环境中用于训练或预训练模型的最频繁使用的数据。在\
  \ AI 应用中开发和利用的几个云特定缓存包括 `AWS ElasticCache`、`Vertex-AI`、`Google CDN`、`Firestore`\
  \ 等。\n\n##### 12.2.2.2 内存管理\n\n内存管理是系统级计算架构中的首要任务之一。传统计算架构中有多种内存管理技术。它们包括内存分配策略、内存泄漏防护、内存垃圾回收、适当的内存引用和跟踪器、内存释放等。某些技术需要程序员或用户的指导，而其他则不需要。在这些内存管理技术中讨论得最详细的点如下：\n\
  \n1. **内存分配策略**：内存分配通常由操作系统或用户定义的条件执行。此外，近年来，软件定义的内存分配策略已被研究人员广泛研究。有效利用未位于主板上的内存单元是一个更好的选择。如果能在边缘赋能设备上优雅地处理内存利用，成本可能会大幅降低。\n\
  \n   访问位于嵌入式设备或电路板之外的内存单元是一项挑战性任务。存在数据传输速度慢的可能。然而，考虑到不需要即时处理的应用，特别是各个领域的 IoT 节点应用，可以利用离板内存单元来最小化运行应用程序涉及的成本。\n\
  \n   事实上，诸如 `FreeRTOS` 等通用操作系统在设计上并不本质考虑连接到边缘赋能设备的离板内存单元。因此，敦促应用开发者使用足够的指令来扩展应用程序，以考虑连接的外部内存单元。这种开发能够有效利用非内置且安装在嵌入式设备上的内存单元的边缘\
  \ AI 应用的理念被称为“软件定义内存分配策略”。近年来，已经基于软件定义内存分配策略开发了若干工业应用或终端用户应用。\n\n2. **内存泄漏防护**：内存泄漏是任何计算平台上的严重问题。在边缘赋能的迭代应用中，由于内存故障随时间推增加，情况可能会更糟。为了防止此类内存泄漏问题，要么仔细分配动态内存，要么避免动态化。程序员必须检查程序中的潜在内存泄漏点。例如，如果程序中使用\
  \ `malloc`，程序员在执行前必须跟踪其路径。同样，如果应用程序在运行时分配动态内存，最好使用专用性能分析工具来评估内存健康状况。\n\n3. **内存垃圾回收**：与内存泄漏类似，内存垃圾回收是一种在程序关闭后自动释放内存的管理技术。垃圾回收增加了软件实践涉及的成本。例如，当尺寸增加时，跟踪内存将产生高额开销。\n\
  \n4. **内存引用和跟踪器**：空中更新（OTA）或类似技术的现代功能对嵌入式设备带来了潜在风险。如果应用程序编写不当或面临安全问题，错误引用的概率更高。\n\
  \n5. **内存释放策略**：与服务器节点相比，基于 RTOS 的嵌入式设备的分配策略不同。同样，释放策略是反向操作。在识别垃圾后必须执行释放过程。由于静态内存分配，大多数嵌入式设备的释放策略更为简单。然而，在现代应用中，由于处理器和设备的现代化，内存的分配和释放策略必须得到有效处理。\n\
  \n图 12.3 提供了阻碍边缘 AI 系统业务可能的内存特定问题的图示。\n\n![图 12.3. 边缘 AI 系统中的内存特定挑战](img/bk978-0-7503-5593-3ch12f3_online.jpg)\n\
  \n**图 12.3.** 边缘 AI 系统中的内存特定挑战。\n\n##### 12.2.2.3 内存在或高端内存技术\n\n内存在技术是一种利用芯片级内存组件或随机存取存储单元为边缘\
  \ AI 应用执行计算的技术。引入这种技术的目的是提供更快的计算步骤，从而大幅降低应用程序的运行成本。例如，参与边缘 AI 应用的云服务器比传统的内存管理技术能相对更好地服务边缘节点的请求。如\
  \ `Jetson Nano` 等边缘设备具有 4–8 GB 的 `RAM`，可以在短时间内计算大量数据操作。\n\n### 12.3 业务机会：边缘 AI 平台\n\
  \n\n\n\n\n边缘 AI 平台带来了传统应用中业务机会的增加。业务的增长体现在三个大维度：(i) 软件进步和 (ii) 硬件进步。本节探讨了由于引入边缘\
  \ AI 技术，各个领域所涉及的成本改进因素。\n\n### 12.3.1 边缘 AI 软件：业务机会\n\n研究人员或从业人员开发支持边缘 AI 设备的软件解决方案。在某些情况下，需要将现有的纯云解决方案扩展到边缘-云计算体系。这种开发或转换在多个服务型行业中催生了业务。他们通过引入边缘\
  \ AI 解决方案来支持其他业务，从而大规模创造业务。例如，预测性维护、文本转换、人类情感检测等传统的纯云解决方案已转换为边缘辅助 AI 解决方案。\n\n软件开发的进展使得能够以最低成本进行本地数据处理程序，从而提高应用程序相关的成本。企业和其他本地业务运营者可以通过增加边缘能力设备上的计算来减少对云的利用。类似地，使用边缘设备进行离线计算可以避免全年对网络的需求。因此，许多小型业务在应用基于边缘的解决方案或将现有纯云解决方案转换为异构解决方案时，可以在成本效率方面得到有效改进。\n\
  \n同样，软件可以根据业务运营的需求量身定制。例如，服装零售商可以在客户进入零售店时立即判断其偏好。这可以通过捕获可穿戴设备或服装的传感器数据来实现。此外，通过学习过去类似类型客户的历史来进行预测。在近期，`ChatGPT`\
  \ 或生成式 AI 技术的应用对业务运营产生了多倍影响。\n\n通过为边缘 AI 系统开发软件，工程师或贡献者可以与硬件开发者或行业建立联系。这种方法增加了边缘\
  \ AI 软件开发人员的人力成本。事实上，必须通过评估数据和计算实例来提升边缘 AI 工程师的能力。\n\n### 12.3.2 边缘 AI 硬件：业务机会\n\
  \n在某些解决方案中边缘 AI 系统集成了复杂的现代硬件辅助。例如，视频处理相关的应用已集成到 `Jetson Nano` 或类似的加速棒以处理输入数据。通过提高推理处理的速度，用户获得了增加业务运营的独特体验。然而，整个应用程序的成本效率将提高。\n\
  \n边缘 AI 硬件可以增加业务运营涉及的速度。由于现代 AI 应用中的大多数操作已转向边缘节点，考虑到可扩展性、安全性、能源和性能相关的业务，业务运营涉及的成本已经下降。\n\
  \n硬件的进步使得数字孪生操作或机器通信与传统的将数据传输到以云为中心的计算单元的方法相比变得更容易。一些特殊机器被设计用于在制造业领域大规模地建立建筑和设计。\n\
  \n同样，边缘 AI 系统中硬件制造的进步可以缩小产品的紧凑性或提高用途。例如，开发尺寸紧凑的硬件单元可以增加 `Google Glasses` 等计算机视觉相关产品的用途。硬件单元的重量和紧凑性会间接影响与其相关的业务。\n\
  \n### 12.4 成本模型\n\n在本节中，根据云资源和相关的执行模型对边缘 AI 应用涉及的成本进行建模。首先，它涵盖了使用云托管边缘 AI 应用时的业务运营成本。最后，它揭示了无服务器函数最小化相关部署成本的重要性。\n\
  \n### 12.4.1 基于云的成本模型\n\n图 12.4 列出了当计算资源大部分在云中利用时得出的某些成本模型。在云中，预计使用按需付费、广告、订阅和贡献等多种定价模式租用计算资源或服务器。\n\
  \n![图 12.4. 边缘 AI 系统中考虑传统云的成本模型](img/bk978-0-7503-5593-3ch12f4_online.jpg)\n\n**图\
  \ 12.4.** 边缘 AI 系统中考虑传统云的成本模型。\n\n此类成本模型的详细信息说明如下：\n\n1. **按需付费定价模型**：在这种方法中，执行边缘\
  \ AI 应用的成本是根据应用程序利用的边缘计算资源计算的。这种方法类似于基于云的定价策略，即所有资源都根据特定应用程序的利用率进行评估。\n2. **基于广告的定价模型**：在这种方法中，不向边缘\
  \ AI 应用的用户收费。相反，在应用程序或服务中集成了一些广告服务。这种促销方法可以根据显示广告获得补偿的计算来提供资源。\n3. **基于订阅的定价模型**：基于订阅的定价模型是一种循环定价组件，对使用服务或许可产品收费。通常，基于订阅的定价模型试图通过在入门阶段提供较低的订阅费用来吸引尽可能客户。然而，随着需求增加，资源将随时间推移收取大量费用。\n\
  4. **贡献定价模型**：贡献定价模型不对在应用程序中使用边缘级资源或任何云辅助资源收费。该定价模型不是对资源收费，而是允许利用贡献服务提供者提供的资源。例如，属于边缘节点的资源被云服务利用。\n\
  \nAmazon Web Services (`AWS`) 的弹性计算云 (`EC2`) 得出的成本所示：\n\n```\n${Cost}\\_{EC}2} =\
  \ \\sum\\limits\\_{i}\\tau\\_{i} \\cdot c\\_{i},\n```\n(12.1)\n\n其中 *i* 表示第 *i*\
  \ 个实例，`τ[i]` 是第 *i* 个实例运行持续，`c[i]` 是运行该实例的小时率，取决于规格。\n\n`AWS EC2` 用户通常根据运行时间和存储单位收费。存储数据和运行实例的总费用可用于确定这些\
  \ `AWS` 实例的成本。计算实例的小时率决定了与运行实例相关的成本。\n\n### 12.4.2 无服务器函数：成本\n\n函数即服务（FaaS）已成为云计算领域一个引入胜的研究领域。从财务角度来看，FaaS\
  \ 可能极具吸引力，因为消费者只需为执行时间付费 [4]。\n\n\n\n\n通常来说，FaaS 已广泛应用于利用公共云的多个领域，例如云机器人。例如，[3]和[6]的作者分别利用无服务器函数和机器人运动规划算法创建了用于机器人动作的基于采样的运动规划算法。此此，[14]的作者创建了数据流水线函数来执行机器学习算法。\n\
  \n由于这种部署策略在多个部门被广泛使用，研究人员研究了各种应用如何影响性能。特别是，根据[1]作者的说法，对于极低消耗，`AWS Lambda`的费用可能比`AWS\
  \ EC2 t2.nano`低 600 倍；然而，它的成本也可能高于`Google App Engines`。\n\n[16]的作者研究了 Web 应用程序的三种不同系统设计：(i)\
  \ 微服务架构，(ii) 单体架构，以及(iii) FaaS。他们的测试结果显示，与微服务架构相比，使用 FaaS 可以减少超过 50%的基础设施成本，与单体设计相比可以减少超过\
  \ 70%。与类似，[15]的创建者使用分布式流函数和 FaaS 来执行与边缘相关的无状态或有状态活动。该工作研究了相关费用对事件处理的影响。然而，文章没有包含评估公共云提供商提供的无服务器操作成本的分析视角。\n\
  \n一种 FaaS 的经济模型，可以粗略估计在`EC2`上部署`AWS Lambda`的总成本。为此，创建了模型并模拟了负载以评估函数的成本。这接近`EC2`和`AWS\
  \ Lambda`收支平衡的点。[11]的作者为支持 FaaS 的应用设计了若干成本优化算法。[7]的作者了解了由 5G 驱动的基于 FaaS 媒体应用的特性。\n\
  \n对于某些云部署，德勤咨询的 Tayal 等人[5]除了开发和维护成本外，还利用了更便宜的基础设施成本。总拥有成本（TCO）是这三项费用的总和。由于减少了开发和维护费用（这抵消了更高的基础设施成本），FaaS\
  \ 可以比标准的`IaaS`具有低的总拥有成本（TCO）。\n\nFaaS 的性能一直是多次检查的主题。[5]对`AWS Lambda`的请求延迟进行了评估，并发现其高于`AWS\
  \ Elastic Beanstalk`（PaaS）。McGrath 和 Brenner[13]对比了`AWS`、`Azure`和`Google`的 FaaS\
  \ 解决方案。他们发现，与其他两种方法相比，`AWS`解决方案的性能更好。`AWS Lambda`在作为 API 端点查询数据库时，处理`GET`和`POST`请求\
  \ hơn。\n\n2020 年，Mahmoud 等人引入了一种分析性能模型[12]。他们的方法能够预测许多无服务器计算指标，包括平均延迟、平均运行/空闲使用率等。这种技术忽略了无服务器函数的固有负载。此外，[8]的作者刚刚为无服务器函数创建了成本优化计划。他们的策略重点是使用启发式技术来减少与\
  \ AWS 无服务器能力相关的成本。\n\n用函数创建的边缘 AI 系统中最重要的问题之一是与无服务器函数相关的成本的建模。本节详细介绍了各种服务的相关费用，特别关注`AWS\
  \ Lambda`提供的无服务器平台。例如，我们可以使用`AWS Lambda`函数实例，也可以使用多个`EC2`实例。每个部署策略相关的成本及其理论成本由`cost\
  \ model`一词表示。\n\n使用`AWS Lambda`的成本公式如下：\n\n```\nCost_ = sum(m_i * c_λ) + r\n```\n\
  \n其中`i`表示第`i`个函数实例，`m_i`分配给该实例的内存（单位为 GB），`d_i`该实例的持续时间，`c_λ``AWS Lambda`的费率，`r`为每次请求的固定费用。\n\
  \n### 12.5 FaaS 实现的经济模拟器\n\n对于某些云部署，德勤咨询的 Tayal 等人[5]除了开发和维护成本外，还利用了更便宜的基础设施成本。总拥有成本（TCO）是这三项费用的总和。由于减少了开发和维护费用（这抵消了更高的基础设施成本），FaaS\
  \ 可以比标准的`IaaS`具有低的总拥有成本（TCO）。\n\nFaaS 的性能一直是多次检查的主题。[5]对`AWS Lambda`的请求延迟进行了评估，并发现其高于`AWS\
  \ Elastic Beanstalk`（PaaS）。McGrath 和 Brenner[13]对比了`AWS`、`Azure`和`Google`的 FaaS\
  \ 解决方案。他们发现，与其他两种方法相比，`AWS`解决方案的性能更好。`AWS Lambda`在作为 API 端点查询数据库时，处理`GET`和`POST`请求更有困难。\n\
  \n2020 年，Mahmoud 等人引入了一种分析性能模型[12]。他们的方法能够预测许多无服务器计算指标，包括平均延迟、平均运行/空闲使用率等。这种技术忽略了无服务器函数的固有负载。此外，[8]的作者刚刚为无服务器函数创建了成本优化计划。他们的策略重点是使用启发式技术来减少与\
  \ AWS 无服务器能力相关的成本。\n\n用函数创建的边缘 AI 系统中最重要的问题之一是与无服务器函数相关的成本的建模。本节详细介绍了各种服务的相关费用，特别关注`AWS\
  \ Lambda`提供的无服务器平台。例如，我们可以使用`AWS Lambda`函数实例，也可以使用多个`EC2`实例。每个部署策略相关的成本及其理论成本由`cost\
  \ model`一词表示。\n\n使用`AWS Lambda`的成本公式如下：\n\n```\nCost_ = sum(m_i * c_λ) + r\n```\n\
  \n其中`i`表示第`i`个函数实例，`m_i`分配给该实例的内存（单位为 GB），`d_i`该实例的持续时间，`c_λ``AWS Lambda`的费率，`r`为每次请求的固定费用。\n\
  \n利用`AWS Lambda`服务的边缘 AI 在计算操作成本时将包含通信延迟。推导出如下：\n\n```\nCost_λ-e = sum(m_i * d_i\
  \ * c_λ) + r + C\n```\n\n其中`C`表示处理函数任务的通信。\n\n### 12.5 FaaS 实现的经济模拟器\n\n虽然有一些独立的研究，但还没有足够的建议边缘\
  \ AI 用户关于`AWS Lambda`等公共云无服务器函数的经济状况，同时考虑内存需求等函数因素。\n\n云开发者考虑最重要的事情之一是实现无服务器功能的费用。本节详细介绍了开发边缘\
  \ AI 系统的经济成本评估框架（ECEF）的功能组件。ECEF 框架包含请求组件、队列、函数实例和监控服务器，用于计算边缘 AI 应用的潜在成本（见图 12.5）。\n\
  \n![图 12.5. 用于评估边缘 AI 成本的 ECEF 框架。](img/bk978-0-7503-5593-3ch12f5_online.jpg)\n\n\
  **图 12.5.** 用于评估边缘 AI 成本的 ECEF 框架。\n\n这些组件的详细说明将在随后的小节中描述。\n\n#### 12.5.1 请求组件\n\
  \n\n\n\nECEF 的请求生成组件创建请求或函数调用。用户可以使用概率分布或随机方式选择请求。为了在某段时间内发布多个请求，例如，ECEF 的用户可以选择参数为\
  \ `λ` 的泊松分布。此外，用户可以指定这些每个请求所需的 `RAM`。此外，用户还可以选择将许多此类生成器合并为单个请求，每个请求包含 `λ` 参数和特定的内存需求。`Queues`\
  \ 是由请求生成组件生成的请求的名称。\n\n## 12.5.2 队列 (Queues)\n\n基于 FaaS 的边缘 AI 应用可能使用多种自动伸缩技术，包括`按请求缩放`(scale-per-request)、`并发值缩放`(concurrency\
  \ value scaling) 和`基于指标的缩放`(metrics-based scaling)。在`按请求缩放`方法中，通过初始化一个具有足够内存的新函数实例来处理一个请求。在没有额外的可用函数实例的情况下，这些请求将得到相应的处理。在`并发值缩放`中，一个函数实例同时处理多个请求。最后是`基于指标的缩放`，这是一种基于规则的方法，将某些指标（如\
  \ CPU 或内存消耗）维持在预定义的范围内。大多数著名的 FaaS 供应商都采用了`按请求缩放`模式。\n\nECEF 的工作原理基于`按请求缩放`方法。基于\
  \ FaaS 的系统可以拥有无限数量的函数实例。当然，它可能随时启动一个新实例。然而，使用一个服务器来限制同时发生的实例调用次数，以控制极端情况。\n\n并发运行的队列两个部分是主队列和辅助队列。其中一个是用于所有来自请求生成组件的请求的初始队列。负载均衡器可以从最初创建并提供的函数实例中进行选择，以响应此类请求。如果它找到了一个函数实例，可能会将请求分配给它。如果没有找到且尚未达到函数实例限制，它将初始化一个具有足够内存的实例来处理请求。如果没有，请求将移动到另一个队列。\n\
  \n负载均衡器的下一个要处理的是下一个请求。如果当前队列为空，负载均衡器将切换到另一个队列并传输传入的请求。这两个队列的设计是为了确保当负载均衡器分配函数实例时，优先考虑等待中的请求。\n\
  \n## 12.5.3 函数实例 (Function instances)\n\n实际计算由 ECEF 的函数实例组件完成。这部分被用于在 AWS Lambda\
  \ 中按预期运行。常用状态 `STARTING`（启动）、`RUNNING`（运行）和 `READY`（就绪）被用于实现。\n\n函数实例在首次初始化时会进入`冷启动`(cold-start)阶段。函数实例在其生命周期内只能经历此阶段，它可以表现为\
  \ `STARTING` 状态。此时，函数实例无法处理任何负载均衡器请求。此外，函数实例会产生费用并消耗内存。\n\n此阶段包括基础设施启动新虚拟机或容器的过程以及`应用初始化`(application\
  \ initializing)。`应用初始化`过程涵盖了用户代码执行的初始任务，例如创建数据库连接、下载参考数据或加载如 `Spring Boot` 之类的重量型框架。尽管仅对应用初始化收费，但在本模拟中，这两个步骤都会计费。此阶段的持续时间从几毫秒到几秒不等，取决于语言运行时和内存大小。然而，在模拟中，这些影响被认为是均匀的。\n\
  \n可以通过调整与可用内存相关的参数来修改模拟的函数实例内存使用情况。通常，该内存区域存在内存消耗分布。例如，冷启动消耗了分配给函数实例的 256 `MB` `RAM`\
  \ 的 40%。之后，函数实例在冷启动期间的内存使用类似于中心在 `⌊0.40 × 256MB⌋ = 102MB` 的正态分布。承认了一定的标准差，并可以在 FES\
  \ 参数中进行修改。\n\n当存在未完成的请求且未达到函数实例限制时，ECEF 方法会初始化一个函数实例。函数实例的状态变为 `RUNNING`，并在初始化过程完成后，请求会立即分配给它。也可以使用选项修改此模式下使用的内存。还可以将线性回归应用于指数模型，以从经验测试中估算执行时间，因为运行时取决于实例上的可用内存。\n\
  \n假设每个源自请求生成组件的函数都是不受 IO 操作无限制的。CPU 是它的边界。在完成请求处理后，函数实例将进入冷却阶段，即 `READY` 状态。负载均衡器可以在此阶段恢复\
  \ `RUNNING` 状态，并也可以将新请求分配给该函数实例。如果函数实例长时间保持此状态而没有接收到新请求，则会被终止。与其他两个状态不同，在此状态下花费的时间是不计费的。函数实例可以闲置长达一小时后被关闭；这种行为是非确定性的。\n\
  \n## 12.5.4 监控服务器 (Monitoring server)\n\nECEF 的监控服务器执行以下活动：\n\n1. 它持有一个函数实例池，处理来自队列的传入请求；\n\
  2. 它收集一些性能指标；以及\n3. 它计算多个成本模型。\n\n当函数实例完成请求处理时，起始和结束时间戳、运行和等待时间以及函数实例本身可能由监控服务器记录。该组件对并发运行的数量有一个限制。图\
  \ 12.6 以图的形式表示了模拟边缘 AI 系统成本的整个过程。\n\n![图 12.6. 模拟成本的过程和软件组件](img/bk978-0-7503-5593-3ch12f6_online.jpg)\n\
  \n**图 12.6.** 模拟成本的过程和软件组件。\n\n## 12.6 结论 (Conclusion)\n\n有许多方法可以改进运行边缘 AI 应用涉及的成本。例如，避免使用云或使用边缘设备可以降低应用程序的成本。然而，需要列出由于边缘\
  \ AI 系统参与带来的潜在业务机会。本章展示了一些改进边缘 AI 应用业务机会和成本因素的潜在用例。它深入研究在使用基于 AWS 的云设置时应用程序的经济成本模型。学习不同的成本模型可以帮助边缘\
  \ AI 用户在考虑应用程序成本时重新思考资源的使用。\n\n### 参考文献\n\n\\[1\\] Adzic G and Chatley R 2017 Serverless\
