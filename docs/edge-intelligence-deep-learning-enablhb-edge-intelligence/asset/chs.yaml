  \n\n\n\n\n## 4. 可扩展性\n扩展性是 AI 解决方案的参数之一。框架必须能够在扩展数万个边缘设备或传感器网络的同时，能够获取学习洞察。此类框架的价值将为模型训练或推理带来许多益处。即使扩展到多台机器或算法演进，框架在预测准确性或学习率方面也必须产生相同质量的结果。\n\
  \n## 5. 负载均衡\n资源广泛分布在较大的地理区域。因此，在可用资源之间平衡工作负载或任务至关重要。通常，可以开发与负载均衡相关的算法，在分配任务之前，持续监控资源的可用性及其工作负载。\n\
  \n## 6. 可管理性\n在某些情况下，扩展框架时，学习模型或设备的可管理性是一项艰巨的任务。因此，框架在执行边缘 AI 应用时，必须考虑算法迁移或资源分配的可管理性。\n\
  \n![图 9.1. 边缘 AI 框架的特征。](img/bk978-0-7503-5593-3ch9f1_online.jpg)\n\n**图 9.1.**\
  \ 边缘 AI 框架的特征。\n\n## 9.2 框架类型\n在过去，框架的设计是为了实现第 9.1 节指定的大部分基本特征。根据执行模式、资源交付机制、学习方法等，可用的边缘\
  \ AI 框架分为四大大类，如下：\n\n1. **资源分配框架**：此类框架侧重于为边缘 AI 实现分配资源。例如，通过将任务分配到适当的计算资源，框架可以提高资源的能源效率或电池利用率。在这种情况下，设计资源分配框架的重点是提高资源效率。\n\
  2. **云特定型框架**：有由 Amazon、Google、Microsoft、Cisco、VMWare 等云提供商开发的框架。这些云提供商的主要优势在于，它们将云能力扩展到边缘节点，同时赋予其\
  \ AI 或深度学习算法。提供者的内在目标是通过高效处理资源，增加执行边缘 AI 应用所涉及的利润并适应多个用户。\n3. **应用特定型框架**：少数框架侧重于提高边缘\
  \ AI 应用的性能。值得注意的是，它们专门为农业、工业、教育、金融等各种应用领域设计。因此，这些框架将具有专门的软件或硬件组件，以增加向任务交付资源的功能性。\n\
  4. **分布式联邦学习框架**：大量研究人员致力于开发基于联邦学习的边缘 AI 应用。他们的重点是增加多个边缘节点的效用，以创建学习模型，并结合组合学习模型利用本地数据集。\n\
  \n接下来的章节将讨论上述类别中可以利用的最常用框架。此外，还将描述研究人员或从业者在这些类别中可能面临的挑战。\n\n## 9.3 资源分配框架\n边缘 AI\
  \ 中的资源分配框架是能够在执行边缘 AI 应用的同时实现资源分布式共享的解决方案。框架考虑任务的计算需求，处理 AI 模型或深度学习模型层的大规模部署。\n\n\
  在深度学习算法中，层可以被分解为多个组件，以便将层分布到多个计算设备上。许多研究人员将这种深度学习层的分解命名为 `split computing`（拆计算）。通常，所有的深度学习算法（如`卷积神经网络`、`强化学习算法`、`循环神经网络\
  \ (RNN)`、`fast-CNN` 等都有许多隐藏层来计算权重和分类图像。通过拆分层并将这些任务分配给不同的计算设备，端到端 AI 应用将有机会以更高的性能和隐私执行它们。\n\
  \n例如，研究人员开发了 `SplitDDL` 视频算法，用于将深度学习算法的隐藏层分布到支持边缘的设备上。他们研究了性能，通过拆分层并将这些任务分配给不同计算设备的概念，端到端\
  \ AI 应用将有机会以更高的性能和隐私执行它们 [22]。\n\n在执行分解的深度学习层时，可能会将工作负载分配到廉价设备（如 `ESP` 或 `Raspberry\
  \ Pi`），而不是昂贵的节点（如 `Jetson Nano`）。资源分配框架将具有库或预建 API 来共享资源或服务。\n\n通常，框架具有特定的调度器，将深度学习层分配到多个计算节点。此外，共享模型、更新模型、升级包等边缘\
  \ AI 任务需要共享资源。这些任务并非深度学习隐藏层的一部分，相反，它们可能是算法任务或模型开发相关的任务。\n\n通常，在边缘 AI 系统中，资源分布在不同的区域。考虑硬件单元的异构特征来平衡边缘资源在这些环境中是重要的。这可以显著提高边缘\
  \ AI 框架的整体性能。采用良好的负载均衡器、复制器或缓存机制等最佳实践可以提高此类边缘 AI 框架的性能。\n\n由于以下原因，边缘 AI 框架的资源分配可能成为挑战：\n\
  \n1. **异构性**：边缘 AI 系统使用的资源本质上是异构的。资源具有不同的 CPU、内存单元、体系结构、存储支持等。例如，`ESP32` 具有 `Xtensa`\
  \ 处理器；`Raspberry Pi` 具有基于 `ARM` 的处理器；`Intel Movidius` 具有 `Intel` 处理器。这些异构设备用于分布式边缘\
  \ AI 应用。显然，它们在框架分配计算资源时会产生复杂性。\n2. **不可用性**：边缘 AI 框架的异构系统具有很高的动态性。由于网络不稳定或电池供电，设备可能会关闭。因此，框架必须采用新技术来应对不可用问题。\n\
  3. **不可预测性**：对于框架而言，资源是高度不可预测的。资源的特征可能取决于多个因素。例如，资源能力根据电池可用性、计算能力或硬件限制而异。由于高度的不可预测性，边缘\
  \ AI 框架必须具有能够处理此类情况的健壮设计。\n4. **配置故障和复杂性**：由于错误配置，每个边缘节点容易出现各种故障或不可用问题。配置中的故障是由于手动设置或执行配置设置的引擎引起的。显然，防止此类故障需要边缘\
  \ AI 框架具有复杂的解决方案。\n\n\n\n\n\n## 5. 隐私与安全故障\n\n在边缘 AI 框架中，由于学习过程中涉及许多微型设备，存在数据泄露的可能性。在某些情况下，由于涉及对等网络，模型可能会面临挑战。例如，在联邦学习环境中，大多数情况下需要在云端设备上更新学习推理或权重。攻击者可以在更新数据模型的同时跟踪云服务中的开放端口。有关安全挑战的详细描述请参阅第\
  \ 8 章节。\n\n图 9.2 展示了边缘 AI 系统在为执行任务分配资源时面临的挑战。\n\n![图 9.2. 边缘 AI 中的资源分配挑战。](img/bk978-0-7503-5593-3ch9f2_online.jpg)\n\
  \n**图 9.2.** 边缘 AI 中的资源分配挑战。\n\n资源分配框架分为若干子类，例如：(i) 实时分配框架，(ii) 协作资源分配框架，(iii) 联合资源分配框架，(iv)\
  \ QoS 感知资源分配框架，(v) 优化资源分配框架和 (vi) 端到端资源分配框架。这些资源分配框架的细节将在接下来的节中讨论。\n\n### 9.3.1\
  \ 实时资源分配框架\n\n边缘 AI 系统中的资源分配必须涉及多个参数，如异构性、QoS、隐私、不可预测性等。边缘 AI 系统中关键参数之一是实时选择适当资源的能力。为了实现这一点，需要在框架中整合一些软件组件。它们的功能包括：\n\
  \n*   处理实时数据：框架必须处理来自本地系统的实时数据：即来自传感器或类似源的数据必须立即供训练模型或联邦学习引擎使用。在框架中具有此类处理元素的关键重要性在于，它们可以提供时间敏感的应用，例如天气预报或摄像头监控相关的应用。因此，可以使用此类框架处理实时数据分析。\n\
  *   处理隐私问题：资源分配框架应具有实时处理隐私相关问题的组件，以便最大限度地减少预期攻击。为此，必须在框架中加入识别、可追溯、授权/身份验证和数据篡改识别等功能。\n\
  *   减少资源中断：资源可能停止服务的情况正在增加。在实时资源分配框架中，需要开发机制来处理此类资源中断或实时识别问题的根源。\n\n典型的实时资源分配框架从传感器收集传感器数据，并在靠近源的地方处理数据。这实现了本地数据的隐私和保护。处理后的数据使用\
  \ `MQTT` 等通信协议传输到云端。服务通过发布/订阅模型进行处理。云端与多个边缘级计算节点连接。因此，它们必须提供一个具有健壮负载均衡算法或学习特征的可扩展环境。实时资源分配框架的图示见图\
  \ 9.3。\n\n![图 9.3. 实时资源分配框架。](img/bk978-0-7503-5593-3ch9f3_online.jpg)\n\n**图 9.3.**\
  \ 实时资源分配框架。\n\n为边缘 AI 系统实现此类实时资源分配框架面临的一些已知挑战是：(i) 可预测性，(ii) 维持任务的时间约束，(iii) 通过调度任务分配适当资源，(iv)\
  \ 识别可用资源以及 (v) 确保健壮的安全特征。\n\n### 9.3.2 协作资源分配框架\n\n在协作资源分配策略中，参与边缘 AI 决策的资源根据一组资源或资源提供者的集体行为进行分配。在支持边缘的系统中，有来自多个方或供应商的资源来执行任务。在传统方法中，由算法决定提供资源以完成边缘\
  \ AI 应用中的决策。但在协作资源分配方法中，多个供应商参与决定资源的效用。\n\n通常，协作资源分配框架采用博弈论机制来决定资源分配决策。特别是，合作博弈论是一个多个玩家共同决策以战胜对手的概念。尽管协作博弈论方法涉及集体智慧，但解决方案必须平等共享获胜标准。例如，在边缘\
  \ AI 框架中，应用合作博弈论的协作资源分配框架将把成功留给相关组织领域的共同努力。\n\n当框架涉及多个资源提供者时，需要资源协作来解决边缘 AI 相关问题。例如，假设一种涉及基于\
  \ `AWS` 的 Greengrass 解决方案和 Google 的元宇宙服务来预测图片中识别出的物体的情况。需要在多个提供者之间共享资源以执行应用程序。然而，如果底层应用程序将获得利益，则必须在提供者之间公平共享资源效用。\n\
  \n当涉及移动网络共享资源时，边缘 AI 应用中协作资源分配的应用非常常见。特别是，属于不同网络运营商的移动网络基础设施资源（如 `BSNL`、`Telekon`、`Vodophone`\
  \ 等）无法在全球范围内所有地理地区部署。资源必须在所有执行边缘 AI 应用的提供者之间协作分配。\n\n在某些情况下，研究人员在分配资源解决边缘 AI 应用时开发了分级协作机制。分级结构可以赋予框架每个层管理自由度。在资源分配系统的每个层中，需要交付的资源数量或利润共享程序和政策可以有所变化，以增加可扩展性。\n\
  \n实现协作资源分配框架开发所需的某些独特组件包括：(i) 能够检测协作资源数量的代理，(ii) 分配属于多个管理域协作资源的策略或程序，(iii) 参与边缘\
  \ AI 应用的资源组之间的价值共享机制。\n\n由于协作资源分配框架必须交付协作资源，将它们识别并注册到公共资源池中是一个挑战。此外，如果所有同意的方由于协作问题无法确认返回值，框架中将存在一定程度的复杂性。\n\
  \n### 9.3.3 联合资源分配框架\n\n\n\n\n协作资源分配框架侧重于开发与不同层次计算系统相关的学习模型。这些学习模型通过将框架开发的模型传输到不同节点，以协作的方式进行开发。这些计算节点可以是边缘网络、雾计算网络或云数据中心的节点。该框架的主要重点是有效分配资源，以便学习模型能够在短时间内完成\
  \ \\[21]]。\n\n### 9.3.4 感知 QoS 的资源分配框架\n\nQoS 感知的资源分配框架尝试迭代地改进框架所提供的服务。边缘 AI 应用的用户对资源交付有不同的观点。然而，用户的目标是在给定的资源量下提高应用程序的性能。\n\
  \n[4] 的作者开发了一种基于深度强化学习的资源分配方法，命名为 `DeepEdge`，旨在实现用户利益最大化。`DeepEdge` 框架的原始目标是监控不同边缘支持应用程序的可用资源并分配适当资源。在框架中，对映射组件进行测试，以有效地映射边缘支持任务的需求与各种位置资源的可用性。\n\
  \nQoS 感知框架中映射组件的利用可以根据各种性能指标进行微调，例如资源利用率、适当资源的可用性、资源能量利用率、计算机器的数据亲性等。\n\n然而，该框架存在一些潜在缺点。开发高效的映射系统是一项挑战。这是因为在映射任务或资源需求之前，必须对涉及的时间进行同步。此外，实时收集可用资源的清晰视图以及捕获各种异构边缘\
  \ AI 任务的需求也可以被视为挑战。\n\n### 9.3.5 优资源分配框架\n\n资源分配框架中的优化是指在考虑多个冲突目标的情况下分配资源 [15]。这些目标包括最小化应用程序的能量消耗、最大化资源利用、最小化执行时间等。在许多应用中，底层优化目标存在权衡。例如，最小化应用程序的能量消耗可能会增加其执行时间。此外，在某些情况下，资源的利用会增加应用程序的能量消耗。\n\
  \n因此，为边缘 AI 应用设计的优资源分配框架必须满足以下条件：\n\n1. **动态决策**：在制定新策略之前，最好先决定资源分配框架是否必须遵循动态条件还是静态条件。事实上，许多边缘\
  \ AI 应用倾向于资源共享的动态性质。因此，框架必须具备处理资源共享动态情况的方法和技术。\n2. **备选匹配资源**：资源的优分配将需要充足的备选资源来实现目标。例如，可以在不同的服务器上复制\
  \ `Docker` 容器，以增加边缘 AI 应用的匹配资源的冗余度。\n3. **透明化分配**：在高度动态的边缘 AI 环境中，选择的数量可能会剧增。因此，框架有必要突出选择适当资源的原因。\n\
  4. **终止准则**：在高度动态的边缘 AI 环境中，选择的数量可能会剧增。因此，框架有必要突出选择适当资源的原因。\n\n### 9.3.6 端到端资源分配框架\n\
  \n端到端资源分配框架旨在开发提供全面解决方案的方法。考虑不同层级所有细节的解决方案被称为端到端框架。用户、计算系统、分析引擎和通信单元是参与端到端框架的不同实体。\n\
  \n设计端到端框架的目的是评估边缘 AI 的综合价值。在端到端框架中，服务使用预构建的库或 API 进行评估。同样，所有其他性能指标，如能量、硬件缺失、执行时间和硬件组件，都可以由端到端框架进行评估。\n\
  \nGoogle 专注于开发一种端到端框架，其中模型训练和测试由复杂的 AI 工具辅助，并使用 `Kubernetes` 和 `Docker` 进行规模扩展。\n\
  \n图 9.4 提供了基于资源分配的边缘 AI 框架分类的视角。\n\n![图 9.4. 基于资源分配分类边缘 AI 框架的鸟视图](img/bk978-0-7503-5593-3ch9f4.jpg)\n\
  \n### 9.4 云特定框架\n\n在最近的时期，云开发者已经广泛实践了边缘 AI 算法。特别是，云提供商（即微软、谷歌、亚马逊等）已经扩展了它们的服务以支持边缘支持的应用程序。传统的云服务如基础设施即服务\
  \ (IaaS)、平台即服务 (PaaS) 和软件即服务 (SaaS) 已移动到边缘节点，以实现边缘解决方案。在本节中，我们将学习从云扩展的潜在开发或产品。\n\
  \n#### 9.4.1 基于 Microsoft Azure 的框架\n\n微软使用 `Azure` 产品开发了云解决方案。与基础设施相关的服务，如建立机器虚拟实例、存储实例和动态网络服务，吸引了大量研究人员和从业者从事云解决方案。所有这些传统的云服务都期望用户利用托管在\
  \ Azure 控制的第三方环境中的计算或存储资源。\n\n根据边缘支持系统的现代需求，微软已将其解决方案扩展到边缘节点：即服务托管在靠近用户计算基础设施数据的地方\
  \ [8]。更具体的边缘 AI 解决方案，微软开发了一个名为 `Azure Stack Edge` 的产品。该产品是一种专用设备，带有托管服务，用于将有限的数据传输到云端。许多数据预处理步骤由该设备处理。通过这样做，改进了网络带宽并增强了边缘推理的性能。\n\
  \n\n\nAzure Stack Edge 产品了一些托管在 Docker 容器上的服务，用于将数据模型交付到 Azure IoT Hub。该开发产品最主要的功能是对数据进行预处理并将其传输到托管在云端的\
  \ Azure IoT Hub。这些云端解决方案的优势在于将不同的云端服务（如身份服务或身份验证服务）与边缘 AI 应用结合在一起。\n\nMicrosoft\
  \ Azure 还利用 Azure Stack Edge 设备提供了其他一些扩展服务 [3]。特别，离线处理与上传、数据同步以及支持 AI 加速等服务被认为对该产品至关重要。最近，微软开发了\
  \ Stack Edge Pro 2 解决方案，它将 Stack Edge 设备与其他云相关工具结合起来。使用 Azure 相关产品对边缘 AI 的支持通过将区域划分为美国东部、西欧和东南亚地区在地理上提供服务。划分这些区域是为了在考虑系统空间、资源和管理可用性的情况下，提供高性能的服务。\n\
  \n## 9.4.2 基于 Google 的边缘 AI 框架\n\nGoogle 开发了一套边缘 AI 框架以及一些特殊的硬件设备。它开发了 Coral 平台，以便基于本地数据进行边缘级推理\
  \ [1]。开发 Coral 平台的初衷是保护支持边缘设备的隐私。该框架涉及硬件组件（如边缘加速器）、软件组件（如 AI 算法）以及学习模型。学习模型可以是预编译版本，以便能够传输或迁移到不同的设备或网络中。\n\
  \nGoogle 在促进边缘 AI 框架方面的主要贡献是开发了基于 TPU 的硬件单元。`TPU` 是张量处理单元，由 Google 自定义开发用于加速学习算法或推理的性能。`TPU`\
  \ 与 `CPU` 的主要区别在于计算指令的方法，即 `CPU` 逐一个地计算指令，而 `TPU` 可以一次性应用矩阵相关操作。由于 `TPUs` 仅能够计算矩阵相关操作，因此与\
  \ `CPUs` 或 `GPUs` 相比，它们并不适用于通用的边缘 AI 计算。\n\n由于对边缘 AI 应用的支持有限，Google 基于 Coral 的边缘平台限于特定应用，如目标检测、姿态估计、图像分割和短语检测。在\
  \ [17] 中，作者利用 `coral edge TPUs` 演示了一种高速目标跟踪系统。在 `edge TPUs` 中，指定的应用或领域问题以矩阵形式输入，并在边缘\
  \ AI 中执行大规模并行计算。\n\n在 Google 支持的边缘系统中部署边缘 AI 工作负载，侧重于评估训练阶段和测试推理。该平台必须验证训练节点之间的连接性，并制定适当的网络拓扑结构以快速识别服务。Google\
  \ 的 `edge-TPUs` 用户配备了大量的机器学习环境。例如，`TPUs`、`GPUs` 以及多种设备的组合被用于 Google 的边缘 AI 系统中。\n\
  \n使用 Coral 等 Google Edge 平台执行边缘 AI 应用遵循统一的步骤模式，如收集数据、预处理数据、训练和开发模型、将模型部署到不同的硬件组件、评估算法性能、评估兼容性问题等。一些作者考虑到\
  \ `AirFlow` 或 `MLFlow` 框架，为边缘 AI 应用开发了流水线。\n\n最近，Google 了一款名为 `Gemini` 的新产品。该产品通过提供多模态辅助以及结合用户本地数据集的动态学习过程来支持边缘\
  \ AI。使用 `Gemini` 工具有多个预期应用。特别是，如自动评分评估、启发式推理以及对文本、音频和视频等多模型输入的 360 度处理等应用已使用 `Gemini`\
  \ 开发。此外，在最近几年中开发了许多扩展。例如，[19] 的作者将 `Gemini` 扩展到了容错机制。\n\n## 9.4.3 Amazon 边缘\n\n\
  Amazon 是广为人知的云服务提供商。尽管该公司的发展始于销售书籍，但它对云技术的贡献深受研究人员和开发者的高度评价。\n\n简而言，Amazon 在计算、存储、IoT、网络等\
  \ 22 个子类别中开发了约 321 个云相关产品。广泛使用的 IaaS 云服务是 `Elastic Compute Cloud (EC2)` 服务。`AWS`\
  \ 的云服务部署在全球范围内多个地理区域，即 `AWS` 服务分为七个地理区域：亚洲、非洲、北美、南美、欧洲、中东和澳大利亚。跨区域划分资源的目的是为了在服务的整个生命周期内实现冗余和服务数据可用性。\n\
  \n为了支持 IoT 相关服务，`AWS` 开发了一系列从协议辅助到软件相关服务的产品。特别，IoT 相关服务被广泛分为以下三类，如下所示：\n\n1. **设备级服务**：如\
  \ `IoT core` 和 `FreeRTOS` 等产品旨在增加连接设备的工作方法。`IoT core` 的核心功能是使用 `MQTT` 协议建立传感器节点或网关与云服务之间的连接。在该框架中开发了发布/订阅模型，同时在节点之间共享数据。系统采用了云环境中远程传感节点的影子服务（shadow\
  \ services）。另一个特定 `AWS` 的产品是 `FreeRTOS` 产品。事实上，`FreeRTOS` 是一种广泛应用于 `ESPs` 等微器的嵌入式操作系统。作为一个开源操作系统，`AWS`\
  \ 根据 `AWS` 相关设备的要求对软件版本进行了调整。操作系统包含了内存管理和其他任务概念，用于在支持 IoT 的设备上执行并行任务。\n\n2. **控制相关服务**：`AWS`\
  \ 的控制相关服务涉及在 IoT 云环境中管理支持 IoT 的设备。这些服务包括 `AWS Greengrass`、`Device Defender`、`1-Click`\
  \ 等。`AWS Greengrass` 提供支持边缘的云服务。云节点托管在远程支持边缘的设备上，因此可以使用本地数据集进行离线开发。因此，用户应用程序的隐私受到各种云相关安全攻击的保护。\n\
  \n3. **AI 相关服务**：`AWS` 开发了五个以上的尝试预测或分类数据的服务。特别是`AWS IoT Analytics` 产品包含了数据收集、数据处理、数据存储、使用\
  \ `ML/DL` 算法进行数据分析以及通知等功能。整个服务包可以集成到传感器环境中，使用选择性的 ML 算法（如`随机森林`、`支持向量机`、`XGBoost`\
  \ 等）通知用户。\n\n\n\nAmbarella CVFlow 是一种 SoC 设备，能够在低功耗辅助下提供计算机视觉相关的解决方案。该设备可以与 AWS\
  \ 边缘服务相结合，以增加本地数据集的隐私性。例如，在 SoC 芯片中通过集成了 AWS Sagemaker 工具的神经网络加速技术来加速 AI 处理 [5]。将\
  \ Sagemaker 集成到 SoC 中的目的是方便开发模型、在需要时对模型进行压缩并将其迁移到设备上。事实上，该工具通过轻松将编译版本的学习模型移植到 SoC\
  \ 来协助开发者。\n\n## 9.5 特定于应用的框架\n\n边缘 AI 框架已直接应用，并更侧重于农业、工业、教育和医疗保健等应用。这些不同应用领域的框架具有具有独特特征和要求的专用预建库或解决方案。本节将重点探讨针对特定领域和要求的特定于应用的框架的开发。\n\
  \n## 9.5.1 农业领域中的边缘 AI\n\n部署在农业领域的边缘 AI 框架的主要关注在于改善耕作状况或知识传递机制。农业领域的一个典型框架将包含以下组件：\n\
  \n1. 用户界面：界面是执行人机交互的设备。为农业农场设计的用户界面必须适合农民和环保主义者。由于农民通常没有经过操作高端用户界面或设备的良好训练，因此用户界面必须是易于使用的，并且能够实现所有所需的功能。\n\
  2. 传感器驱动型数据自动化：框架将提供相关规定，使用分布在多个区域的传感器收集足够的传感器数据。收集到的数据必须根据应用需求实时或离线进行预处理。在此类框架中，必须在没有过多人工干预的情况下执行某些预处理技术，如去噪、滤波、数据增强等。\n\
  3. 数据分析：根据处理后的数据，必须针对来自农业农场的感应数据进行模型的开发、训练、验证和测试。在此模块中，可以整合多种学习算法以提供准确的预测或分类。\n\
  4. 通知：最后，框架必须从未来的数据中交付报告或洞察。框架必须支持多种输出格式，用于向用户通报农业发现结果。\n\n事实上，有数以万计面向农业领域改进的应用。这些应用可以分为三大类进行开发：(a)\
  \ 智能农业，(b) 可持续农业和 (c) 精准农业。\n\n### 9.5.1.1 智能农业\n\n开发使农业边缘 AI 应用实现智能化的框架的首要目标是：(i)\
  \ 将学习算法或智能应用于农业系统，(ii) 观察相关框架提供的通知服务的影响，以及 (iii) 收集之前的决策历史，以便框架能够自动确定农业收获时间。\n\n\
  例如，一家 30 MHz 的公司使用亚马逊的 `AWS IoT core` 和 `AWS Greengrass` 产品远程监控室内植园的健康状况。\n\n除了开发新型学习算法外，研究人员通过在种植作物时主动计算异常，在农业农场中建立了智能化\
  \ [11]。作物或植物叶可能会受到昆虫或动物的侵害。这种对未来收入的影响将在短时间内进行监控和管理。\n\n### 9.5.1.2 精准农业\n\n精准农业或精准耕作旨在提高农业数据集预测或分类的准确性。这意味着需要将几个健壮的学习算法整合到农业边缘\
  \ AI 框架中，以提供复杂的学习准确性。一些显著的指标，如 `accuracy`、`true positives`、`squared errors` 等，被尝试改进系统。\n\
  \n为了提高预测和分类的准确性，侧重于精准农业的框架将实现从传感器实时采集远程数据。它必须处理来自异构系统的不断演化的数据的动态特性。[16] 的作者揭了一种用于精准农业的物联网型边缘\
  \ AI 框架。\n\n### 9.5.1.3 可持续农业\n\n如果农业边缘 AI 应用中的预测准确性可以合理接受，收入将会增加。还可能及早检测到任何健康相关问题。因此，可持续农业主要关注三个宏大目标：\n\
  \n* 使用先进的 ICT 技术（包括边缘 AI 框架）增加农业生产涉及的收入。\n* 通过利用人工智能并结合边缘解决方案的辅助提供社会效益。\n* 确保健康的食品生产或耕作实践以实现社会的可持续增长。\n\
  \nGoogle 通过整合 `Google Earth engine` 平台来实践可持续农业，该平台收集不同地貌的 `GPS` 数据。Google 开发 `Google\
  \ Earth engine` 平台的主要理念是提高对粮食短缺和提高人类收入的农业参数的意识。值得注意的是，使用 `Google Earth engine` 开发的项目在澳大利亚实现了再生农业建议。例如，澳大利亚的\
  \ Regrow 公司展示了土壤固碳能力和对环境的气排放 [6]。同样，可以预测利用橡胶乳生产产生的产量以增加农业农场的可持续性。\n\n针对这些类别的各种应用细节在第\
  \ 11 章描述。\n\n## 9.6 分布式联邦学习框架\n\n边缘 AI 框架通过多种方式实现并整合了 AI 相关概念。方法之一是使用去中心化的方法和区域数据集开发学习模型。联邦学习是一种通过多个模型协助开发单一模型的方法。本节探讨了基于联邦学习的框架以及相关软件组件的细节。\n\
  \n广而言，本节的讨论集中在一些利用边缘数据源的联邦学习框架上。值得注意的是，讨论了如 (i) `federated learning`、(ii) `SplitFed`、(iii)\
  \ `FedAdapt`、(iv) `FedlesScan`、(v) `Fate`、(vi) `OpenFL`、(vii) `tensorflow federated`、(viii)\
  \ `FLAME` 和 (ix) `Clara` 等框架。\n\n## 9.6.1 联邦学习\n\n联邦学习框架的传统实现由一个主节点（master）和多个客户端组成。客户端可以是边缘设备、手机、笔记本电脑、传感器节点等。开发主节点和一组客户端节点的理念是让他们参与协作开发单一全局学习模型：即主节点共享模型权重，客户端根据区域位置提供的本地数据对模型进行处理\
  \ [14]。\n\n\n\n\n来自本地站点的训练模型被传输到主节点进行整合或聚合。在整合过程中，不同的框架采用了不同的技术。例如，将从多个客户端收集的数据模型进行平均化处理以创建一个单一模型，是传统联邦学习中的一种整合方法。事实上，客户端和主节点必须持续对本地权重进行工作，并更新全局权重，以提高学习模型的准确性。在联邦学习中，梯度和更新后的权重周期性地传输到主节点以计算全局权重，直到达到指定的准确率。\n\
  \n总而言之，朴素联邦学习框架涉及的主要步骤包括：\n\n1. 主节点是一个服务器实例，负责将全局模型提交给已指定的客户端节点。\n2. 客户端节点根据模型和本地数据集进行学习。相应的，将观察到学习参数权重的任何更新。\n\
  3. 随后，客户端节点将更新后的权重重新提交给主节点。\n4. 最后，主节点整合来自多个客户端的权重，以重复全局学习模型中观察到的评估。\n\n## 9.6.2\
  \ SplitFed\n\n将拆分学习（split learning）与联邦学习结合产生了一种名为 `SplitFed` 的新框架 [18]。合并拆分学习和联邦学习目的是利用这两种方法的优点。\n\
  \n众所周知，拆分学习是一种分布式深度学习方法，其中涉及隐藏层的计算分布在可用的计算节点上（包括边缘节点）；切层（cut layer）是跨计算节点拆分计算的层；这些层与代理关联，以便代理能够与一个主节点通信，由该主节点连接来自各个拆分计算层的结果。需要注意的是，主节点将负责协调在客户端上执行的计算。\n\
  \n研究人员过去在反向传播和前向传播范围内应用了拆分学习。此类算法的隐藏层使用客户端节点进行顺序处理。计算的梯度通过客户端代理进一步传输到主节点。反向传播或其他学习算法也会出现类似的情况。\n\
  \n仅提供拆分学习概念特征的缺点是难以处理客户端的不平衡数据。由于客户端之间数据组件的差异，客户端无法获得预期结果。此外，拆分计算的第二个主要缺点是由于按顺序处理所有层。由于是顺序计算，当考虑整个边缘\
  \ AI 应用时，资源无法得到有效利用。\n\n拆分学习与联邦学习的结合克服了拆分学习过程的缺点，特别是顺序处理和数据不平衡的情况。为了实现这一点，SplitFed\
  \ 框架在预定义的切层处对深度学习算法进行分区。这一步类似于拆分学习的过程。然而，`SplitFed` 框架并不是将整个层交给客户端，而是将一部分层交给客户端，将另一部分层交给主节点。引入主节点进行层计算的概念是通过对客户端和主节点的模型平均来避免客户端数据的不平衡。这意味着反向传播和前向传播步骤可以与客户端和主节点结合进行。\n\
  \n过去，已经开发了一些 `SplitFed` 学习的变体：即在某些实现中，模型权重的聚合是在客户端中而不是主节点中进行的。这减少了主节点可能产生的计算开销。\n\
  \n## 9.6.3 FedAdapt\n\n开发 `FedAdapt` 框架是为了自适应地决定第 4 章中讨论的拆分学习过程的切层。在拆分计算环境中，切层决定了将计算卸载到客户端的阶段\
  \ [20]。然而，没有特定的模式来解释此类神经网络环境中涉及的拆分。客户端在不知道交付此类计算原因的情况下接收了一组神经网络层。这种方法可能具有以下几个缺点：\n\
  \n1. 神经网络的层是以一种朴素的方式进行拆分的。例如，如果有 100 个隐藏层，框架可能会决定将层拆分为 10 个相等的子区域。\n2. 层根据框架中强化学习代理的决策进行分布。显然，代理可能会影响学习模型的性能。这是因为神经网络中梯度的权重必须在执行学习算法的计算节点之间进行传播。\n\
  \n`FedAdapt` 框架应用强化学习算法将任务卸载到边缘设备。为框架的卸载过程开发强化学习算法的理念是准备一系列学习决策，以便通过奖励来确定卸载点或动作。研究人员已经提出了改进\
  \ `FedAdapt` 框架的奖励方案或强化学习步骤的想法。\n\n人们一直在通过开发硬件加速器来尝试提高卸载决策时间。硬件的目的是加速卸载策略并缩短应用涉及的训练时间。在一些工作中，研究人员应用了量化技术以减少客户端和主节点之间预期通信开销。\n\
  \n## 9.6.4 FedLesScan\n\n德国慕尼黑工业大学的研究人员参与了开发使用无服务器函数（serverless functions）的联邦学习框架\
  \ [9]。`FedLesScan` 框架受益于无服务器计算概念的应用。\n\n通常，无服务器计算环境由公共云提供商提供，作为其新型基础设施支持的一部分，无需用户配置或用户管理任务。这是一种执行模型，除非有客户端的触发，否则服务器是不可用的。根据触发，通过从服务器农池中识别合适的服务器节点来执行函数。\n\
  \n根据无服务器计算概念，服务器不会分配执行应用程序。这意味着云应用程序必须动态搜索云实例（如 `VMs`）。服务器根据需求和必要性进行分配。服务器实例有时需要开启、启动并启用服务以执行所有这些任务。\n\
  \n\n\n\n在 `FedLesScan` 中，由于框架中包含了无服务器计算，主节点与客户端节点之间的计算是通过无服务器函数触发的。该框架利用 `Kubernetes`\
  \ 在主节点和客户端节点之间提供了一个可扩展的环境。它拥有一个 `OpenWhisk` 集群来提供面向函数的触发器。框架利用 `MongoDB` 数据库来收集客户端的详细信息以及在一段时间内实例的可用性。全局模型存储在数据库中，以便客户端可以使用该框架定期更新全局模型的权重。除了这些组件外，该框架还包含了一个安全组件以启用身份验证。通过这样，只有授权的客户端才能参与联邦学习框架全局模型的更新。\n\
  \n尽管可以最小化无服务器框架的整个计算需求和框架能耗，但该框架涉及的复杂性太高。框架中识别出的几个主要挑战列如下：\n\n1. **长尾节点 (Stragglers)**：名为\
  \ `FedLesScan` 的无服务器联邦学习框架的客户端节点可能会导致潜在的长尾节点。有几个因素决定了框架中的长尾节点，例如异异性、数据不兼容、网络故障、节点不兼容等。\n\
  2. **实现复杂度**：框架必须使用两种广泛使用的软件模块进行部署，即 `Kubernetes` 和 `OpenWhisk`。`OpenWhisk` 集群必须部署在\
  \ `Kubernetes` 集群之上。这是用户在使用该框架时遇到的困难之一。\n3. **策略选择**：该框架无法自动确定客户端的选择或分配策略。例如，与强化学习方法相比，该框架在选择不同的分配策略方面的灵活性有限。\n\
  \n### 9.6.5 FATE 框架\n\n联邦 AI 技术赋能器 (`FATE`) 是一种面向工业领域的联邦学习框架。`FATE` 框架由微银行的 AI 部门开发。它专注于开发一种支持边缘赋能设备的联邦学习框架，并更加强调安全性。作为银行的创新成果，安全特性默认包含在框架中。\n\
  \n该框架为用户提供了一个联邦学习环境，用于从本地机器上的数据协作开发学习模型。该框架被实现为一个模块化框架。这允许开发者根据需求和进展扩展实现规模。例如，边缘级计算单元涉及的安全可以使用新的安全特性进行更新，或者用另一种安全算法替换。\n\
  \n该工具是基于 `Python` 编程语言开发的开源解决方案。`FATE` 由微银行公司开发。它采用四层设计：(a) 计算与联邦层；(b) 安全协议层；(c)\
  \ 联邦机器学习层；以及 (d) UI 工具。\n\n计算与联邦层涉及跨设备部署计算节点的计算环境。`FATE` 工具利用 `TensorFlow` 计算框架和\
  \ `RabbitMQ` 方法 [13] 来实现分布式节点之间学习环境的联邦化。它支持各种范围的存储单元，如 `SQL`、`HIVE`、`HDFS` 等。\n\n\
  为了启用安全特性，`FATE` 了同态加密技术。在这些技术中，原始数据在跨学习-计算节点传输之前使用特定算法进行加密。\n\n联邦机器学习层是 `FATE` 架构的核心层。它涉及各种机器学习组件以支持水平或垂直的联邦学习过程。该层负责优化由系统区域数据集创建的学习模型。\n\
  \n`FATE` 工具的核心组件使用两个流行的开发框架——`Eggroll` 和 `Spark` 框架进行部署。这增加了该框架在各种应用和联邦式分布式学习任务中的利用率。\n\
  \n`FATE` 有多个联邦版本。其中一种实现是 `Federated ML`。`Federated ML` 是一个基于库的实现框架，可编写边缘 AI 应用。该库具有多种算法，如\
  \ `DataIO`、`Federated Sampling`、`Feature Scaling` 和 `Hetero Secure Boosting`。为了方便边缘\
  \ AI 应用开发人员，框架中已经实现了一系列加密工具和基于统计的模块。除了基于联邦学习进行核心应用开发外，该框架还为开发适用于边缘 AI 应用的新型算法或扩展模块提供了一个骨架。该框架的核心是关注安全相关的特性，这些特性能够让执行联邦学习过程的计算机器之间实现安全通信。\n\
  \n### 9.6.6 OpenFL 框架\n\n`OpenFL` 正如其所示，是 Linux Foundation 提供的一种联邦学习的开源实现。`OpenFL`\
  \ 的实现基于用 `Python` 编程语言编写的库风格。该框架以分布式方式支持机器学习和深度学习算法，使得计算可以被多个计算机器利用 [10]。此外，该框架可以与现有的两个\
  \ ML/DL 框架（如 `Pytorch` 和 `TensorFlow`）集成以创建联邦学习环境。\n\n`OpenFL` 框架的核心特性是：(i) 用于应用程序基于工作流的\
  \ FL 集成，(ii) 基于模块的实现以及 (iii) 易于采用。该框架为边缘 AI 应用开发者使用 `Director-Workflow` 功能设置联邦学习算法铺平了道路。该功能可以为设置长期算法提供环境。此外，`openFL`\
  \ 的 `Aggregator-Workflow` 功能为研究人员探索集成在 FL 环境中的验证模型铺平了道路。\n\n### 9.6.7 Tensorflow\
  \ Federated\n\n`Tensorflow Federated` 是一种处理分布式数据的机器学习联邦学习框架的开源实现。该框架为研究人员提供了一个仿真环境，用于探索联邦学习算法的性能或精度组件。许多研究人员在没有设置真实边缘的情况下观察了新型算法的能力。\n\
  \n该仿真环境以 API 风格构建，分为两个实现级别：核心 API 和高级 API。核心 API 允许用户研究联邦环境的内部特征。相比之下，高级 API 的编写目的是让用户在不修改用于学习过程的仿真环境的情况下，学习不同联邦学习算法的影响。\n\
  \n图 9.5 列出了研究人员广泛应用并在之前的子节中讨论过的边缘 AI 框架。\n\n![图 9.5. 最常用的边缘 AI 框架](img/bk978-0-7503-5593-3ch9f5_online.jpg)\n\
  \n**图 9.5.** 最常用的边缘 AI 框架。\n\n#### 9.6.8 FLAME 工具\n\n\n\n\n\nFLAME 工具由 Cisco Research\
  \ 开发。其目标是在考虑分布式位置隐私性的情况下创建联邦学习模型[7]。在创建模型时，训练数据集是本地化的。为此，FLAME 确保全局模型是基于从本地训练数据集模型接收到的权重创建的。\n\
  \nFLAME 是 Kubernetes 集群之上的服务。这些服务包括基于 ML 的学习任务和管理相关任务。基于 ML 的学习任务被用于从分布式学习环境中收集学习权重；管理相关任务旨在通过提供适当的调度机制来改进部署和扩展性相关的限制。该工具包含一个\
  \ SDK，用于开发新的学习模型并根据可用计算节点设计拓扑结构。引入 Kubernetes 集群的目的是在任何可扩展环境中实现于部署。目前，FLAME SDK\
  \ 是为 Python 程序员编写的，他们具备 `Keras` 和 `Tensorflow` 框架的知识。\n\n### 9.7 结论\n\n许多内置库或解决方案作为边缘\
  \ AI 框架的存在，可以鼓励应用开发者快速上手。本章列出了一些可以在各种应用领域采用的框架。书中讨论了专注于资源分配、云服务管理、利用应用代码段以及归因联邦学习特性的框架。因此，读者可以从可用框架列表中查看适用于其边缘\
  \ AI 应用的框架。\n\n### 参考文献\n\n[1] 边缘 TPU 推理概览：Coral–coral.ai 2023 ([`coral.ai/docs/edgetpu/inference/`](https://coral.ai/docs/edgetpu/inference/))\
