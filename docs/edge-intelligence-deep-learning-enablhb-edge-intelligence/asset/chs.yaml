  [19] Tim 2024 Deep Learning—[design-reuse.com](https://design-reuse.com)\n\n# 7.\
  \ 性能分析\n\n开发边缘 AI 的一个重要步骤是考虑此类系统的性能指标。通常情况下，边缘 AI 应用容易出现性能问题。本章将深入探讨应用程序的性能方面。\n\
  \n## 7.1. 性能关注\n\n边缘 AI 应用的性能取决于多种因素。事实上，这些关注点被分为四大类：\n\n*   特定模型\n*   特定架构相关的\n\
  *   特定算法\n*   特定数据相关的\n\n接下来的章节将详细介绍这些类别的细节。\n\n### 7.1.1. 特定模型关注\n\n边缘 AI 的学习模型通常分布在多个集群上。在这方面，存在性能问题的可能性：\n\
  \n1.  学习模型通常被划分为多个计算块。特别是 DNN 模型会被拆分，使得某些层在指定的节点上执行。拆分阶段可能会由于在特定时间点没有强大的计算节点可用而导致失败或配置错误。\n\
  2.  极少数学习模型被实现为触发计算单元的函数。有时，资源没有被仔细地映射到所需的配置中，这可能会导致性能瓶颈。\n3.  深度学习模型的层具有不同的计算需求。因此，在同构机器或不兼容的异构机器上训练模型可能会导致性能问题。\n\
  \n### 7.2. 特定架构关注\n\n边缘 AI 应用的性能受到不同架构的影响（见图 7.1）。通常而言，架构涉及计算机器和驱动计算的算法。边缘 AI 应用的架构取决于列出的各种因素：\n\
  \n*   **硬件相关因素**：这些涉及设计高效的缓存、启用内存访问方法以及利用适当计算资源。\n*   **软件相关因素**：这些建议使用更好的操作系统、分布式学习算法以及与底层硬件单元优化映射的计算算法。\n\
  *   **集成相关因素**：边缘 AI 应用需要架构固复杂的通信协议和集成工具。例如，在某些边缘 AI 应用中，`MQTT` 协议比应用 `S-MQTT` 协议更足够。\n\
  \n```\n图 7.1. 影响边缘 AI 架构的因素：大类。\n```\n\n\n\n\n通常情况下，计算机架构遵循均匀内存访问（UMA）、非均匀内存访问（NUMA）和仅缓存（cache-only）内存访问模式。基于均匀内存访问的微控制器或微处理器设备的设计使得内存控制器能够均匀地访问内存单元。尽管访问时间是均匀的，但在这些设备上扩展应用时性能较差，即单个内存控制器必须处理所有连接的内存单元。\n\
  \n使用基于非均匀内存访问架构的优势在于它们可以提高应用程序的性能：(a) 提高近实时应用程序的性能；(b) 通过多个内存控制器的参与来支持多种应用程序。\n\n\
  在某些应用中，我们可以使用仅缓存内存访问模式。在基于仅缓存内存访问的架构中，非均匀内存访问硬件由缓存提供支持。这意味着内存访问不仅取决于内存的位置，还取决于与内存单元相关的状态和标签（tag）。事实上，具有不同内存访问模式的优势取决于成本考虑。值得注意的是，与简单的均匀内存访问架构相比，仅缓存访问架构将昂贵且复杂得多。[14]\
  \ 的作者设计了一种协作解决方案，以改进涉及边缘应用程序的推理时间。他们关注涉及边缘的应用程序的数据和缓存模式。这种理念是在边缘计算层涉及多个计算节点，以对最频繁使用的数据进行缓存。\n\
  \n边缘 AI 应用程序通常需要跨计算机器进行移植。这是由于计算平台的分布式特性，因此硬件级实现必须涉及虚拟化技术以实现快速的可移植性。例如，`Docker`\
  \ 技术提供了一个维护文件系统的操作系统级虚拟化环境，以实现轻量级部署。显然，`Docker` 级实现为边缘应用相关的配置提供了更高的可移植性。[6] 的作者开发了轻量级虚拟化环境来桥接云与边缘级设备之间的差距。在许多情况下，`Docker`\
  \ 容器与 `Kubernetes` 等可扩展框架相结合。`Kubernetes` 框架可以创建多个工作地址下的 `PODs` 副本。`Kubernetes`\
  \ 框架具有编排执行在 `Dockers` 上的负载的功能。框架可以在多个计算节点上分发基于底层的负载。此外，在某些情况下，当应用程序发生故障时，计算实例的扩展是有要求的。\n\
  \n### 7.3.2 性能考量：软件相关\n\n没有一种软件适用于所有工作环境。近年来，几乎所有基于 AI 的应用程序都转向了边缘节点而非云端。观察到此类情况，刻画边缘\
  \ AI 应用程序以满足用户的性能需求至关重要。例如，视频分析相关应用或音频相关应用必须实时处理流数据。\n\n应用程序可能会经历多个执行阶段，例如预处理、建模、预测等。特别是，多个功能涉及原始数据的处理，例如缩放、归一化等。这些流应用程序的功能必须在带有加速器的适当硬件设备的时间范围内处理。\n\
  \n嵌入式设备或微控制器中的操作系统有助于边缘 AI 应用程序的性能。值得注意的是，这种软件部分利用计算资源而非将所有可用资源分配给应用程序。[13] 的作者比较了嵌入领域流行的两种开源操作系统的性能：`freeRTOS`\
  \ 和 `ZephyrRTOS`。\n\n通常，操作系统旨在增加资源的实用性、监控应用程序的执行，并控制在 `ESPs` 或 `Raspberry Pis` 等设备上的并行过程执行。\n\
  \n随着 30 多年的研究进展，名为 `FreeRTOS` 的开源操作系统对边缘 AI 领域（包括基于 AWS 的边缘节点）做出了贡献。`FreeRTOS` 是一种常用于\
  \ `ESPs` 等微控制器的合适操作系统。操作系统具有控制或管理资源并为边缘 AI 应用程序提供服务的规定，且不会带来不便。如果不使用操作系统，应用程序在映射可用资源时不知道何时执行它们。此外，这些代码片段可以丰富单个应用程序的实用性和审计能力。良好的操作系统可以在收集或分配数据时管理\
  \ I/O 外设传感器/执行器设备。总之，操作系统的软件组件尝试在运行边缘 AI 应用程序时优化底层系统的性能。\n\n### 7.3.3 性能考量：集成相关\n\
  \n边缘 AI 应用程序的性能取决于传感器环境中计算设备和存储单元的集成。传感器负责感知数据并引导执行器执行动作。根据传感器数据和通信协议，应用程序的性能各异。为了获得更好的性能，必须在框架或集成平台中加强通过连接设备的传感器与执行器之间的集成。\n\
  \n例如，在工业 IoT 平台上，数万个传感器和执行器通过各种通信手段联网，包括现场总线 [6]。集成环境在决定具有极高可靠性或敏感性的自动化过程中起着关键作用。此外，在边缘\
  \ AI 应用程序之间传输数据时的设备集成成本可能很大取决于现场总线，例如 `Modbus`、以太网控制自动化、过程现场网络等。\n\n任何边缘 AI 应用程序的主要集成问题之一都是使用适当通信协议。在应用栈中，设备通常通过设备级功能或布线拓扑连接到网关或服务。例如，`ESP32`\
  \ 设备可以直接连接到云服务或附近的边缘级计算节点；`LoRaWAN` 设备在向云辅助服务发送数据之前可以连接到网关。此外，带宽和功率限制了这些设备的联网能力。显然，通过不同的通信协议集成传感器和执行器会对底层应用程序的性能产生强烈影响。\n\
  \n### 7.4 特定算法的性能考量\n\n除了硬件建议外，通过调优涉及的算法可以提高边缘 AI 应用程序的性能。后续列出了若干机会。\n\n\n\n\n###\
  \ 7.4.1 针对特定编译器的优化\n\n如果针对底层硬件单元对算法进行特定编译，就可以提高应用程序的性能。引入编译器的优势在于理解底层硬件的特性，特别是应用程序的访问模式。通过这种方式，可以对应用程序进行细调以提高其性能。\n\
  \n一些比微控制器更强大的边缘设备（例如基于英特尔的无风扇设备）具有考虑到优化特性的选择编译器标志位的功能。例如，诸如 `-fO3`、`-fO2` 等标志可以根据设备的硬件特性（包括缓存）在特定应用程序代码序列中触发优化\
  \ [3]..。在分布式环境中，编译器针对不同的边缘级硬件单元进行了调优。\n\n### 7.4.2 应用程序调优\n\n应用程序可以根据电池效率、显示设备的亮度水平、切换到电源安全模式、管理睡眠模式、开启和关闭服务、开启和关闭硬件设备、服务自动化以及减少计算来\
  \ get 调优。\n\n电池效率通常通过细致控制嵌入式设备的利用率来实现。此外，电池不充电到最高水平以获得更长的电池寿命。必须考虑电压、电流利用率和设备用途等多个参数来有效管理电池。通常，电池在释放或充电电子方面具有不同的特性。\n\
  \n边缘设备显示单元的亮度水平调节着设备的能耗。亮度的增加会对设备的实用性产生直接影响。例如，在现代设备中，利用基于环境光传感器的电路自动改变显示设备的亮度。因此，当有充足自然光时，设备能够最小化显示设备的亮度水平。\n\
  \n通常情况下，节电模式可以延长电池寿命。在一些边缘设备中，电池由可再生能源支持。这些电源源通常是稀缺的。显然，在设备中使用节电模式可以提高应用程序的寿命效率。在某些边缘\
  \ AI 应用中，根据电源可用性等参数通过 API 自动执行节电模式。\n\n延长应用程序的寿命可以间接提高它们的性能。有一些技术可以提高应用程序的寿命。例如，在应用程序空闲期间启用睡眠模式可以增加设备的电池寿命。睡眠模式在分级层次上实施。例如，`ESP32`\
  \ 在高级睡眠模式下关闭 WiFi 模块，而在更深层次的睡眠模式下关闭 `CPU`。[9] 的作者提出了一种根据嵌入式设备的用途在超低功耗模式和低功模式之间切换的解决方案。\n\
  \n在某些现代设备中采用了动态电压频率调整 (DVFS) 技术来适应应用程序的性能需求。通过增加 `CPUs` 的时钟频率，与相反情况相比可以在更大规模上处理指令。显然，在较高时钟频率下执行应用程序的能耗会比其他时候更高。其他研究研究了嵌入式设备的\
  \ DVFS 管理策略，并理解该方法的底层能量效率。[8]..。\n\n此外，可以在嵌入式设备上执行电源门控（power gating）或时钟门控（clock\
  \ gating）技术以增加应用程序的寿命。在电源门控方法中，关闭一些利用率低的组件；在时钟门控方法中，不为一些利用率低的组件（通常是 `CPU` 设备）提供处理指令或信号的时钟信号。\n\
  \n有时，通过减少应用程序涉及的计算可以提高其性能。例如，如果不需要获得非常准确的预测，那么在计算学习模型时减少迭代次数即可。\n\n### 7.4.3 选择性包\n\
  \n为执行应用程序选择正确的包可以带来性能的提升。通常，执行代数计算有多种实现方式。然而，只有少数实现具有适合硬件单元的映射配置。例如，对于基于英特尔的计算机器，`MKL`\
  \ 库在 ARM 或 IBM Power 机器上使用相同的包性能可能会很差。\n\n此外，基于 `Node.js` 的实现对某些工作环境敏感。例如，如果满足了\
  \ `package.json` 文件指定的相同要求，`npm v1.3.17` 将不会安装依赖项。显然，如果不仔细处理，此类应用程序的执行可能会损害性能。同样，还需要适当的\
  \ API 参考和抽象来处理如 `WIFI`、`HTTP`、日志、网络等嵌入式服务。\n\n### 7.4.4 编程模型\n\n为边缘 AI 应用选择的编程模型将对底层底层性能产生直接影响。尽管业务逻辑可以使用任何编程语言开发，但某些特定的编程模型非常适合某些情况。\n\
  \n需要使用文件进行处理的大数据应用程序可以使用 map-reduce 编程模型（包括 `Hadoop`）。涉及音频或视频处理的流式应用程序可以使用 `Apache\
  \ Spark`。此外，使用 `MPI` 和 `OpenMP` 等混合编程模型的分布式计算可能适用于特定的用例。例如，容错应用程序在开发其业务逻辑时不应考虑基于\
  \ `MPI` 的编程模型。显然，选择合适的编程模型将对应用程序的性能产生重大影响。\n\n图 7.2 展示了由算法或无差别地编写应用程序的开发者引起的可能性能问题。\n\
  \n![图 7.2. 算法特定的性能性能问题。](img/bk978-0-7503-5593-3ch7f2_online.jpg)\n\n**图 7.2.**\
  \ 算法特定的性能性能问题。\n\n### 7.5 特定数据的性能问题\n\n数据被认为是提高边缘 AI 应用性能的关键关注之一。在边缘 AI 应用中，让数据靠近传感器或执行器是有益的。数据必须靠近用户有几个原因，即隐私和执行要求在执行应用程序时产生直接影响。\n\
  \n通过调整数据来提高边缘 AI 应用性能的一些方法列如下：\n\n1. **数据分布**：如果边缘 AI 应用可以将数据分布到多个计算节点，最好在可用节点上均匀分布。过去的研究人员研究了在考虑执行反馈的情况下动态传输负载对应用程序性能的影响。\n\
  2. **数据分组**：在执行应用程序之前根据特征对数据进行预处理是高效的。例如，视频相关应用程序可以预处理并分组，以便将其引导至快速的网络通道。相比之下，UDP\
  \ 相关数据包可以交付到高可靠性网络以提高应用程序的性能。\n\n\n\n\n\n### 3. 数据分区\n除了练习不同的数据分布模式外，对数据进行分区也是更好的，其目的是提高计算环境中的性能。考虑到资源可用性的限制性，数据分区的自适应性可以为来自多个应用程序的数据聚合铺平道路。\n\
  \n### 4. 量化\n数据量化尝试将一系列连续数据点映射到较小的数据点集上。这减少了创建训练模型所需的计算时间和计算资源。开发稳健的数据量化技术可以利用边缘\
  \ AI 应用的性能效率。\n\n图 7.3 显示了通过改进应用程序相关数据，在边缘 AI 框架中可以采用的性能改进方案。\n\n![图 7.3。边缘 AI 应用中特定数据的性能问题。](img/bk978-0-7503-5593-3ch7f3_online.jpg)\n\
  \n**图 7.3.** 边缘 AI 应用中特定数据的性能问题。\n\n### 7.6 性能监控：必要性\n必须捕获并纠正边缘 AI 应用的性能问题。过去曾努力捕获性能下降应用程序的性能问题。此外，由于其潜在的加速作用，用户对仔细监控表示认可。通常，监控边缘\
  \ AI 应用的性能具有下讨论的优势。\n\n#### 7.6.1.1 瓶颈预测\n众所周知，应用程序或学习模型在强大的计算机器上运行良好。然而，跨越带宽受限的网络网络传输数据或模型容易产生严重的瓶颈。同样，在\
  \ `ESP32` 等低功耗、计算效率低的设备上执行模型，可能会由于数据传输总线的受限而导致计算瓶颈。在某些研究工作中，为了克服此类瓶颈，芯片制造商开发了一些内存计算系统，以便计算能够在更靠近数据所在的地方进行。\n\
  \n显然，边缘 AI 应用的潜在瓶颈得到了提前预测，并且相应的应用程序经过了调优以提高其性能。\n\n#### 7.6.1.2 资源识别\n观察边缘 AI 应用的糟糕性能或行为，可以通知用户和应用程序开发者失败的原因或成功的原因。边缘级应用最具挑战性的方面之一是资源利用率低。理解应用程序的性能为未来执行轮中选择合适的资源铺平了道路。\n\
  \n#### 7.6.1.3 可视化\n由于许多资源和计算节点将涉及边缘辅助 AI 应用，因此对性能瓶颈进行可视化并确定这些瓶颈的严重程度是强制性的。事实上，用户或应用程序开发者将致力于定义逻辑或利用逻辑，而不是调试问题（如果有的话）。因此，监控应用程序性能并轻松定位这些问题至关重要。\n\
  \n#### 7.6.1.4 反馈\n应用程序开发者和产品开发者渴望理解用户体验并提供建议以改进应用程序。迫切需要捕获这些建议或意见，以便在正确的时间进行改进。监控应用程序性能根据这些建议直接或间接地为应用程序开发者提供输入。\n\
  \n除了提高未来软件发布的质量外，提供反馈还可以减少与应用程序相关的生产成本和实用成本。需要注意的是，积极反馈往往会激励开发者在短时间内创建更创新的解决方案。\n\
  \n### 7.7 性能监控：指标\n监控边缘 AI 应用的性能对于改进未来的应用开发至关重要。用于研究边缘 AI 应用性能的指标的整体分类表示如图 7.4 所示。\n\
  \n![图 7.4。监控边缘 AI 应用性能的指标。](img/bk978-0-7503-5593-3ch7f4_online.jpg)\n\n**图 7.4.**\
  \ 监控边缘 AI 应用性能的指标。\n\n这些性能指标评估边缘 AI 应用的影响详细说明如下：\n\n1. **执行时间**：执行时间是一项衡量执行边缘 AI\
  \ 应用所需时间的性能指标。应用程序可以在独立机器上执行，也可以多台计算机器的组合上执行。该指标对于根据底层硬件单元评估应用程序特性至关重要。例如，`[7]`\
  \ 的作者根据农业应用程序的执行时间，研究了 `LSTM` 算法在不同边缘加速器（如 `Jetson Nano`）上执行的效率。\n\n2. **硬件级指标**：应用程序在边缘设备上执行时，容易出现与硬件相关的问题，包括缓存缺失或指令停顿。在所有现代具有计算能力的设备中，由于存在指令计数器等硬件监控计数器，可以评估硬件指标。硬件级指标将提供关于应用程序执行行为的低级细节。\n\
  \n3. **延迟**：延迟是衡量执行应用程序时产生延迟的性能指标。延迟可能是由于边缘设备之间的网络延迟或机器计算组件之间的通信延迟引起的。延迟对于任务关键型边缘辅助应用是一个严重问题。然而，在某些情况下，延迟问题是可以接受的。一些研究人员对资源受限边缘设备实现的延迟提出了批判性观点，即作者表明由于使用了多个资源受限边缘节点，应用程序的延迟可能会增大[1]。\n\
  \n4. **吞吐量**：决定架构组件能力的指标之一称为吞吐量或作业完成率。该指标确定了规定时间内执行的应用程序或实例数量。在边缘 AI 框架中，可以通过仔细队列应用程序和增加作业数量增加吞吐量。\n\
  \n5. **可靠性**：可靠性是衡量一段时间内执行相同应用程序实例一致性的性能指标。在某些情况下，由于多种原因，应用程序无法提供相同的计算水平，包括边缘 AI\
  \ 应用在异构计算节点上的负载分布。\n\n6. **可扩展性**：虽然可以通过加速计算来提高应用程序性能，但在某些情况下，跨多个计算单元的应用程序或增加应用程序实例是一个挑战。可扩展性是评估在给定一组计算节点或框架的情况下扩展应用程序重要性的指标。\n\
  \n7. **可用性**：可用性指标确保计算节点对于计算应用程序的就绪状态。在大多数情况下，计算资源并不易用用于执行边缘 AI 应用。这最小化了应用程序的性能。\n\
  \n\n\n\n\n# 8. 性能–功率–空间优化\n\n应用程序的性能、功耗和空间需求之间存在权衡。提高应用程序的性能可以加快其执行速度。然而，组件的功率消耗和利用率可能会显著增加。显然，应用程序的性能与能量消耗之间存在权衡。此外，为了提高应用程序的性能，倾向于并行利用多个计算资源来运行应用程序。这一特性可能会增加执行应用程序的空间需求或内存容量。因此，在许多用例中，研究人员尝试在指定的计算节点上执行应用程序时，优化性能–功率–空间指标。\n\
  \n## 7.8 节效方法\n\n对于用于边缘 AI 应用的电池供电嵌入式设备来说，能量是一个严重的问题。本节探讨了边缘计算的能效方面以及该领域的研究方向。\n\
  \n通常情况下，功耗和能量消耗取决于边缘 AI 领域改进技术的应用情况。通常，功率被视为电压（`V`）与电流（`I`）的乘积。功耗与执行应用程序的涉及系统效率有关。相比之下，能量被定义为在指定间隔内完成的工作。能量指标与执行应用程序所需的时间直接相关。\n\
  \n### 7.8.1 能量测量\n\n测量边缘 AI 应用的能量消耗是提高其效率的最重要步骤之一。测量应用程序能量消耗的方法因机器而异。例如，用于执行边缘 AI\
  \ 应用的具有强大计算能力的边缘级机器可以使用稳健的建模技术来监控能量消耗。但基于微控制器的边缘节点的能量测量则需要仪器测量设备。因此，边缘节点的能量测量分类如下文所述。\n\
  \n#### 7.8.1.1 能量测量：数据中心节点\n\n安装在靠近数据中心节点的边缘设备的功耗通过智能电源分配单元进行监控。智能电源分配单元显示在指定时间段内消耗的功率。该值与边缘\
  \ AI 应用的执行相关，用以监控应用程序的能量消耗。\n\n#### 7.8.1.2 能量测量：独立节点\n\n若干独立节点（如个人电脑、笔记本电脑和靠近数据的强计算能力服务器）被用作边缘节点。这些设备具有内置传感器，用于监控应用程序的能量消耗。例如，基于\
  \ Intel 的处理器具有内置传感器，可以使用运行平均功率限制（`RAPL`）对设备的能量消耗进行建模。在执行应用程序时，可以获取以焦耳（joules）为单位的指定时间内的能量消耗值。研究人员实施了一些实现，例如\
  \ `PAPI` 库，使用 `RAPL` 收集应用程序的能量消耗。\n\n#### 7.8.1.3 能量测量：基于微控制器的节点\n\n测量在微控制器设备上执行的应用程序能量消耗与其他设备不同。原因包括缺乏类似于强计算设备的硬件计数器，以及缺乏用于测量应用程序能量消耗的并行线程。此外，任何持续的能量监控方法对此类微控制器可能成为巨大的开销。\n\
  \n为了克服这些局限性，微控制器的能量消耗通过配备电流测量传感器的外部设备（如 `INA219` 传感器）进行测量或建模 `[10]`。这意味着可能需要基于另一个微控制器设备的独立测量设备来监控在微控制器上执行的应用程序的能量消耗。这些专用能量测量单元根据监控单元的需求触发的外部时间戳来测量能量消耗。\n\
  \n### 7.8.2 能效方法\n\n边缘 AI 应用的能量消耗通过多种方式被降至最低。特别是，过去经常采用提供感知、提供内置控制步骤、利用适当能量源以及实现特定算法能效技术的方法。\n\
  \n#### 7.8.2.1 能量感知\n\n提供关于边缘 AI 应用能量消耗的感知是减少预测性能量消耗的一步。例如，如果应用程序开发者知道特定应用程序的能量消耗或电池利用率为\
  \ `x` 焦耳，则开发者可以尝试识别能量消耗的原因。因此，在未来的开发或实现中，可以将能量消耗降至最低。\n\n为了做到，需要在运行时或离线监控边缘 AI 应用的能量消耗。如果边缘\
  \ AI 应用的能量消耗在运行时报告，用户可以停止应用程序或修改运行时配置以高效地利用应用程序。\n\n#### 7.8.2.2 内置控制\n\n如果遵循几项控制措施，应用程序的能量消耗就可以得到改善。特别是，控制\
  \ CPU 时钟周期、控制编译器标志、控制组件等是提高边缘 AI 应用能效的固有方法。在边缘设备中可以采用的控制机制细节列如下所示：\n\n*   **控制 CPU\
  \ 时钟**：时钟频率根据应用程序的需求固有地进行精细调整。例如，具有计算能力的边缘设备已采用动态电压-频率缩放。随着 `DVFS` 的出现，时钟可以被修改为以不同的速度运行。因此，在考虑\
  \ CPU 周期影响的情况下，边缘 AI 应用可以进行负载均衡。`DVFS` 特性存在于许多现代边缘级处理器中，包括 `Jetson Nano` 设备。\n*\
  \   **控制编译器标志**：可以调整编译器标志以最小化应用程序的能量消耗。如 `-ffloat-store`、`-fshort-enums` 和 `-fO3`\
  \ 等标志可以显著修改支持边缘的学习算法中的代码优化。编译器标志被认为是交付能效应用程序的重要优化工具。\n*   **控制组件**：在边缘级节点中切换设备或组件开关是减少应用程序能量消耗的有效方法。`Arduino`\
  \ 具有使用嗜睡库（narcoleptic libraries）在未使用时切换模拟数字转换器设备的功能。此外，在执行端到端应用程序时，可以控制应用程序的某些软件组件。例如，监控应用程序能量消耗所需的服务如果不需要报告，则可以停止。类似地，一些面向安全的服务（如身份映射组件）在可信的工作环境中是不需要的。显然，通过控制执行执行涉及的软件和硬件组件，有多个机会减少边缘\
  \ AI 应用的能量消耗。\n\n#### 7.8.2.3 利用能量源\n\n\n\n\n如果可以为通电应用提供电源，则利用可再生能源而非电网电源是一种高效的方法。在边缘\
  \ AI 环境中，边缘设备可能分布在多个地理位置。某些设备可能由再生能源供电，而其余设备可能由普通电源供电。负责将边缘 AI 任务分配到边缘节点的框架，应该尽力将任务分配给那些使用太阳能板、风能或水电等再生能源供电设备。使用再生能源的优势在于它们可以最大限度地减少使用普通电源（如火力发电厂）可能产生的外部碳足迹。\n\
  \n### 7.8.2.4 针对算法的能效\n\n边缘 AI 应用可以通过调整来提高其能效。仔细开发适用于资源受限环境执行的算法是提高应用能效的关键步骤之一。在过去，研究人员已经在算法层面遵循了多种方法来提高其能效。以下列了一些解决方案：\n\
  \n1. **数据类型选择**：在编写边缘 AI 应用时，会根据对双精度或长整数的需求仔细地进行数据类型分配。任何应用程序开发者都倾向于初始化一个巨大的栈变量，尽管内存需求可能并非如此。这样做会在没有实际需要的情况下增加内存空间和硬件利用率。这很容易避免，以提高此类应用的能耗。事实上，这种方法在需要考虑内存限制的微控制器边缘节点中至关重要。\n\
  \n2. **线程绑定**：计算资源需要映射到数据源以及靠近它们的数据可用性。线程亲和性是一种确保在并行系统上执行应用时数据数据局部性的方法 [5]。设计算法时可以考虑底层硬件单元的数据亲性因子。这样，在执行逻辑时，数据就不跨越远程设备传输。\n\
  \n3. **处理等待时间**：通常，操作系统具有软件模块来控制指令的等待时间。这些软件模块可以与应用程序逻辑关联，从而在边缘 AI 应用中尽力减少应用的等待时间。事实上，需要不断评估任务的等待时间并交付给可用资源。有时，还需要增加并行任务的等待时间，以便修改时钟频率以提高应用的效率。例如，在较快的机器上执行的并行任务如果存在多个\
  \ I/O 调用实例，将导致巨大的等待时间。相反，可以在等待期间降低时钟频率，从而最大限度地减少整个应用的能耗。\n\n边缘 AI 系统中上述能效方法的整体概览见图\
  \ 7.5。\n\n![图 7.5. 能效方法。](img/bk978-0-7503-5593-3ch7f5_online.jpg)\n\n**图 7.5.**\
  \ 能效方法。\n\n### 7.9 碳效率方法\n\n大多数研究人员对专注于零碳排放感兴趣。事实上，由于需要对云数据中心或边缘级加速器的计算节点进行冷却，支持物联网的边缘\
  \ AI 应用很容易产生大量的碳排放。在这方面，数万名研究人员对中和碳排放表现出了兴趣 [11]。他们试图向全球市场普及碳排放足迹知识。此外，工业界正在通过制定比几十年更有有力的政策来训练防止碳排放。\n\
  \n过去，研究人员致力于从工业废物中消除碳排放。为了做到这一点，一些研究人员开发了实时工作模型，展示了全球不同来源的碳排放数量。AI 辅助模型可以在执行边缘 AI\
  \ 应用时准确定位碳排放预测量。因此，用户可以决定停止执行此类应用，或支持某些政策来覆盖碳排放。\n\n碳排放将直接影响应用的性能。为了提高应用性能，计算机器会被通电并以高速度处理。这种尝试会直接加热机器并导致冷却系统，间接影响我们环境中的碳排放。在一个大型运行边缘\
  \ AI 应用中，移除某些执行实例就足够最大限度地减少碳排放。\n\n过去曾尝试采用层次化计算架构，以便从边缘 AI 应用的计算中移除计算基础设施树。这样做，可以最大限度地减少碳排放。此外，采用负载均衡功能或数据局部性概念可以逐步减少应用的碳排放。\n\
  \n在某些国家，碳排放政策已经定稿，并对违规者制定了惩罚。为了避免数据不可篡改性，区块链账本被用于记录碳排放量，特别是在腐败的工业地区。作为碳中和的一部分，一些组织尝试植树来中和其工厂产生的碳排放。显然，负责产生碳排放的数据中心必须以重新造林的名义种植等数量的树，以补偿碳排放。过去研究人员采用的各种碳中和程序的全面综见\
  \ [4]。\n\n### 7.10 工作负载调度对性能的影响\n\n在边缘应用中调度任务并将其路由到不同的计算节点对性能有直接影响。通常，调度是在分配的计算节点之间分配资源的过程。在边缘云平台上，由于多种因素（如最大化资源利用率、最小化能耗、最小化碳排放、最小化延迟等），这一决策非常复杂。\n\
  \n\n\n\n调度决策取决于决策算法，这些算法决定了边缘 AI 任务在计算节点上的位置。调度算法可以建立一种计划，将任务部署到由可再生能源供电的计算节点上。因此，在边缘\
  \ AI 框架中，碳排放被降至最低。目前已进行了大量研究，以寻找适用于任何工作环境的最优调度算法。例如，某些算法计算极其密集，以至于无法在计算受限的设备（包括\
  \ `ESPs`）上执行。\n\n其他研究人员探索了在线调度方法。在线调度方法本质上具有高度动态性。这使得能够在考虑边缘云体系涉及的动态性的情况下，做出及时决策。\n\
  \n在现有文献中，调度算法存在一些局限性，即调度算法没有考虑执行算法时涉及的网络带宽或虚拟机（VM）实例的隐藏成本。在未来，研究人员在将调度算法集成到边缘 AI\
  \ 框架时，可以研究适应性或与通信的问题。\n\n## 7.11 性能监控工具\n\n监控应用程序的性能是提升边缘 AI 应用性能的关键步骤。理解边缘 AI 应用的性能问题并向用户报告这些问题至关重要。对于应用程序开发者来说，这是边缘\
  \ AI 应用开发的强制步骤。\n\n在现代情况下，应用程序的监控是通过性能监控工具实现的。由于以下用例，这些工具是必须的：\n\n1. 有必要以用户友好的方式展示性能问题。\n\
  2. 这些工具是随应用程序自动扩缩的软件组件。例如，如果一个边缘 AI 应用从边缘实现到云端，监控工具必须随着设备的计算规模进行扩展。\n3. 与应用程序相比，性能监控工具必须具有有限的开销。这意味着工具本身不应通过执行监控相关功能而成为用户的负担。\n\
  \n从原则上讲，边缘 AI 应用的性能监控可以分为五大类：追踪方法、沙箱方法（Sandboxing）、建模方法、仿真方法和在线方法。这些监控方法的关键特征及其见解如下。\n\
  \n### 7.11.1 追踪法 (Tracing approach)\n\n在追踪法中，在收集所有相关的性能指标（如函数的执行时间、代码段的能耗等）后，测量边缘\
  \ AI 应用的性能。在这种方法中，必须在嗅探代码部分和相关的性能监控结果之前完成应用程序。由于测量模式随应用程序运行，追踪法非常简单。在许多情况下，该方法也被称为离线监控方法。\n\
  \n使用追踪法测量应用程序性能的主要优势是能够生成可定制的性能分析报告。由于可以使用大量的性能数据，性能分析的可视化可以得到增强。此外，该方法是原始的，因为不需要实时评估应用程序的性能。\n\
  \n然而，该方法的主要缺点是需要收集大量的性能分析数据。显然，需要额外的时间来研究应用程序的性能问题。\n\n### 7.11.2 沙箱法 (Sandboxing\
  \ approach)\n\n类似于在游乐场中创建沙箱以确保儿童有安全的玩环境，计算系统中的沙箱方法提供了一个独立的环境来研究边缘 AI 应用的性能。该方法要求设备能够与真实世界的工作环境兼容。沙箱环境是一个模拟边缘\
  \ AI 工作环境的隔离环境。通常，考虑到硬件设置，该方法的实现会非常繁琐。\n\n该方法允许用户学习应用程序可能的性能影响。他们可以缩放某些参数，例如实例数量或\
  \ `CPU` 周期。然而，一旦环境搭建完成，沙箱可以提供更真实的性能检测平台。\n\n### 7.11.3 建模法 (Modeling approach)\n\
  \n建模方法要求性能分析工具创建模拟边缘 AI 框架的数学模型。建模方法基于先验历史以及根据历史数据识别变量来工作。因此，可以对方程进行建模，以便根据这些方程评估未来的实验。\n\
  \n在建模法中，在将数据分为三类（训练数据、验证数据和测试数据）之后研究应用程序的性能。训练数据由与硬件相关的边缘 AI 应用性能测量组成。基于训练数据创建数学模型。在这一阶段，对模型进行微调以获得最大的清晰度。最后，测试阶段期望可以在不进行任何进一步实现的情况下评估应用程序的性能。\n\
  \n这种性能分析方法的主要优势可以在不执行应用程序的情况下评估其性能。这是基于所创建的数学模型实现的。然而，该方法需要大量的历史数据来建立准确的性能预测模型。\n\
  \n### 7.11.4 仿真法 (Simulation approach)\n\n在仿真法中，使用仿真模式推导出边缘 AI 应用的性能分析。仿真方法模拟了真实情况，即开发者对环境有深入了解。在这种方法中，用户可以轻松地修改参数以研究边缘\
  \ AI 应用的性能行为。他们可以在不执行应用程序的情况下缩放某些参数，例如节点数量或通信协议。如所述，由于需要硬件和软件场景的完备技能，开发仿真器是一项挑战性任务。\n\
  \n### 7.11.5 在线法 (Online approach)\n\n开发一种实时监控应用程序性能的工具是一项非常有挑战性的任务。这是因为如果不考虑所有情况进行开发，性能监控工具的开销可能会增加。通常，使用特定的函数对应用程序进行注入，这些函数在运行时被调用以监控它们的性能。例如，开发了一些函数来标记应用程序中测量的开始和结束。\n\
  \n\n\n\n\n正如观察到的，基于在线的性能监控方法对于早期决策非常有优势。例如，如果一个边缘 AI 应用存在潜在的性能缺陷，由于性能值对用户是可见的，整个应用程序可以在执行的初始阶段就被停止。\n\
  \n图 7.6 展示了最常用的性能监控方法。这些方法在之前的章节中进行了详细介绍。\n\n![图 7.6. 性能监控方法。](img/bk978-0-7503-5593-3ch7f6_online.jpg)\n\
  \n**图 7.6.** 性能监控方法。\n\n### 7.12 云/雾/边缘级性能监控\n\n性能分析工具以独立设备的形式运行在云端、雾或边缘节点上。然而，研究人员正致力于开发一种适用于整个边缘\
  \ AI 应用的集成性能分析工具。\n\n在目前，研究人员利用现有的独立性能分析工具来监控应用程序的性能。例如，如 `AWS Xray`、`AWS cloud\
  \ watch`、`Google Stackdriver`、`AppDynamics`、`Wavefront`、`Epsagon`、`Thundra` 和 `Application\
  \ Insights` 等工具已经实现了对云端应用的性能监控。这些工具通常被用于计算密集型集群或雾节点。\n\n此外，`Prometheus`、`InfluxDB`\
  \ 和 `Grafana` 等工具已被若干开源发爱好者应用于基于容器的工作环境中。然而，极少有性能分析工具是专门用于边缘 AI 计算连续体的。设计此类性能分析工具的主要局限性在于，它需要随着应用程序一起将监控功能扩展到多个异构计算环境中。不仅如此，应用程序还必须在实时不产生太多开销的情况下执行监控任务。因此，开发一种用于边缘\
  \ AI 应用的端到端性能监控工具仍然是一个研究挑战。\n\n### 7.13 结论\n\n分析边缘 AI 应用的性能可以提高它们的适用性。开发者可能需要关注开发应用程序逻辑，而不是研究在边缘支持设备上执行时性能问题的影响。本章研究了性能分析在基于边缘的框架中的性。此外，它揭示了嵌入式设备的潜在能耗问题以及监控相关问题的技术。本章提供了边缘\
  \ AI 领域性能监控的分类法。\n\n### 参考文献\n\n[1] Ali-Eldin A, Wang B and Shenoy P 2021 The hidden\
