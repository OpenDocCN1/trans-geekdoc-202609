  \n\n因此，工业界或研究人员提出了几种与操作系统相关的流程管理技术。例如，`Intel` 最近开发了一种无风扇计算节点。值得注意的是，`Intel` 的产品，如\
  \ `E50` 掌上 IoT 网关/服务器、`E100` 超紧凑无风扇服务器以及 `E302` Mini-ITX 紧凑无风扇服务器，吸引了关注能源的边缘 AI\
  \ 设计师，因为风扇消耗了大量的电池电或电力。由于某些计算能力的不可用，边缘 AI 应用往往会出现学习准确率低的问题。有时，必须考虑资源的可用性对算法进行优化。\n\
  \n### 13.1.2.3 网络限制\n\n通常，云端具有足够的网络带宽来执行分布式应用程序。例如，数据中心拥有多个架式服务器，它们使用 `infiniband`\
  \ 网络交换机而非传统的千兆交换机相互连接。\n\n然而，边缘设备在形成边缘集群时，无法增加网络带宽。这种限制影响了边缘 AI 应用。因此，这些应用程序必须将数据提交到地理上远离边缘节点的强大计算集群。结果是应用程序会遇到更高的延迟和隐私担忧。\n\
  \n为了克服这些挑战，过去提出了许多解决方案。然而，这些解决方案可以通过更新颖的设备管理技术或资源优化解决方案来丰富。例如，可以在边缘层引入软件定义网络组件，以增加整个边缘\
  \ AI 应用的网络带宽。\n\n处理微型组件网络设备中演变的互操作性问题也至关重要。值得注意的是，在云中开发基于软件定义网络的自动化网络是可行的。但这可能导致支持边缘的\
  \ AI 系统中出现资源限制相关的问题。\n\n#### 13.1.3 性能效率\n\n尽管过去设计了一些性能改进建议和解决方案，但仍有许多可以被用于提高边缘\
  \ AI 应用性能的机会。\n\n#### 13.1.3.1 改进学习\n\n涉及边缘集群或计算节点子集来学习更高准确率的环境是一个优化问题。例如，由于涉及大量数据，增加计算节点的数量可能会提高学习准确率。然而，考虑到资源利用率等因素，边缘\
  \ AI 应用的最终结果可能是徒劳的。\n\n研究人员已采用许多技术来采用涉及边缘设备的学习方法。例如，联邦学习、自适应联邦学习、迁移学习、 gossip 学习、协作建模、合作建模等。关于这些学习和推理技术的详细解释已在第\
  \ 4 章和第 5 章中讨论。\n\n事实上，改进数据处理方法、预处理方法、数据处理方法、数据访问程序等带来了挑战。在这些领域进行充分研究是有。值得注意的是，如果学习过程中安全性受到阻碍，存在数据不一致的可能性。\n\
  \n此外，研究人员可以致力于开发提高学习准确率的新型学习算法。他们可以在执行学习算法时设计一些架构更改。例如，一种新的迁移学习平台或联邦学习平台是改进边缘 AI\
  \ 应用学习过程的方法之一。此外，考虑到资源利用率，可以采用新的量化程序或压缩技术。\n\n在某些情况下，边缘 AI 应用的性能可能会受到计算资源的影响。例如，边缘\
  \ AI 应用可能会受到节点处理能力的限制。因此，边缘 AI 应用可能需要将任务卸载到云端。但这可能导致边缘与云端之间的延迟和隐私问题。\n\n#### 13.1.3.2\
  \ 决策制定\n\n通过涉及实时操作，可以改进选择选项和学习环境的决策。例如，在资源受限的边缘节点上部署模型，可以根据数据亲性和隐私担忧将其限制在计算节点的子集中。创建操作的决策需要近乎实时做出。这必须处理如边缘节点之间的通信延迟等情况。\n\
  \n当资源属于不同的管理域时，做出决策是一项具有挑战性的工作。这涉及启用有利于底层应用的防火墙设置。此外，决策必须考虑异构性。值得注意的是，`Jetson Nano`\
  \ 和 `Raspberry Pi` 节点的架构于 `ESP32`。在边缘 AI 应用中引入不同的异构边缘节点对框架或编排工具做出敏捷决策提出了挑战，即决策在做出适当建议之前需要考虑多个参数。\n\
  \n需要采用一种平衡良好的计算连续体，它超越并将计算从边缘卸载到云端。支持的节点和集群将根据学习过程中涉及的负载自动扩展。显显然，在执行任何边缘 AI 应用时，采用稳健的负载均衡算法以及开发跨云计算环境存在许多挑战。\n\
  \n在某些情况下，由于特定边缘节点表现出的糟糕延迟或计算延迟，没有必要提高边缘 AI 应用的性能。因此，考虑到用于边缘 AI 应用的底层边缘计算节点和可扩展云服务器，决策可以推迟做出。\n\
  \n#### 13.1.4 安全学习\n\n隐私和身份是提供边缘 AI 的两个关键安全相关支柱。由于设备微小，现有的提供数据隐私和保护边缘设备真实性的解决方案是不够的。此外，除了第\
  \ 8 章中广泛讨论的几种安全攻击外，支持边缘的设备还容易物理攻击。物理攻击在脆弱位置安装传感器节点时更为常见。\n\n\n\n\n使用轻量化建模算法部署模型或迁移学习模型是多个应用领域面临的挑战，包括与医疗保健相关的\
  \ AI 解决方案。在多个边缘设备上设计能够处理卸载程序且不产生安全相关问题的框架，是边缘 AI 领域一个备受关注的研究问题。例如，当本地数据集包含低质量信息时，从该数据派生的模型可能会对全局模型构成安全危害。\n\
  \n#### 13.1.5 法律与标准\n\n由于法律或标准的缺失，边缘 AI 面临着若干挑战，同时也带来了机遇。值得注意的是，未经许可使用人物的图像或视频文件可能会招导致巨额罚款。已经有个人提起诉讼，以防止复制或泄露数据的行为。遗憾的是，边缘\
  \ AI 需要合适的数据来通过边缘或云端服务器实例建立学习模型并增强智能。\n\n这些法律建议在不同国家之间存在地理差异。例如，在印度和中国等国家，将人物图像应用于开发技术并不是严重的问题。然而，在美国和欧洲国家，这种情况可能会导致罚款或监禁。\n\
  \n国家或组织之间确定的法律政策未必是长期规则。因此，运行了多年的边缘 AI 应用可能会出现问题，特别是当这些应用在发生错误或故障时需要处理时。由于此类故障，如果框架采用了资源共享策略或数据共享策略，学习系统的准确性将面临挑战。有时，参与分布式计算过程的组织可能持有数据或学习模型，从而导致供应商锁定问题。\n\
  \n在协调或集成边缘 AI 或共享资源时缺乏标准，开启了新的挑战。研究人员一直在开发多种独立的解决方案来解决这些问题。如果为执行边缘 AI 应用制定了通用标准，那么考虑到不同的边缘\
  \ AI 工作负载，动态资源分配程序将得到轻松处理；此外，资源的实时安装也将比目前的方法更快。\n"
