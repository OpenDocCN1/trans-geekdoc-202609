  \n\n\n\n输出单元的关键功能是以用户偏好的格式呈现数据。这些数据是 CPU 单元处理指令的结果。输出设备包括显示器、耳机、LED/LCD 投影仪、电视、打印机、3D\
  \ 打印机、绘图仪、盲文打印机、显卡等。\n\n输出设备的要求如下：(i) 在适当的情况下对输出设备的输入进行信号转换；(ii) 计算设备与输出设备之间数据速率平滑过渡；(iii)\
  \ 数据代码验证和错误检查机制。输出设备具有不同的数据格式和处理能力。例如，模拟扬声器需要连续的模拟输入源；相比之下，数字扬声器无法处理连续数据源作为输入。`FreeRTOS`\
  \ 或类似的嵌入式操作系统仍然是闪烁 LED 或执行操作的关键软件。\n\n### 3.1.1.3 处理单元\n\nCPU 或类似的计算单元负责处理指令。通常，`CPU`\
  \ 被认为是嵌入式设备（包括边缘节点）的大脑。需要注意的是，基于微控制器的边缘节点处理单元有限。微控制器的计算元素包括控制逻辑硬件模块、内存模块和算运算模块。\n\
  \n边缘计算节点的处理单元放置在靠近数据输入端，以便实现边缘级处理。基于 `CPU` 的处理元素从内存单元获取指令，解码指令，使用 `ALU` 或类似的处理单元执行指令，并存储结果以便在所连接的输出模块上显示。\n\
  \n### 3.1.2 边缘侧操作系统的功能\n\n如前所述，操作系统是连接边缘设备与物联网功能应用程序的接口软件过程。操作系统应该是一个轻量级的实现，具有较小的代码空间，以适应嵌入式设备。它被认为是设备的核心，用于控制和高效处理边缘\
  \ AI 应用的请求。它不仅必须管理硬件资源，还要管理所有相关的软件过程，包括用户应用程序。\n\n事实上，操作系统的概念已经存在了几十年，用于运行包括强大的服务器在内的大型计算机。操作系统多年来以各种形式演变，考虑了工作系统的重要需求。通用操作系统的最重要的功能（见图\
  \ 3.1）列如下：\n\n1. **管理功能**：操作系统主要侧于管理机器的几个重要功能。例如，`I/O` 功能的管理、内存单元的管理、`CPU` 进程的管理、文件系统中的文件管理等。操作系统内存管理的一个重要方面是在考虑内存单元空间限制的情况下，通过刻意允许进程执行应用程序指令而不产生延迟。在边缘计算节点上，内存空间将受到严重限制，这迫使操作系统提供复杂的软件来处理相关的内存问题。同样，处理进程，特别是当边缘节点发生中断时，是导致创新的关键研究方向。\n\
  \n2. **安全相关功能**：为边缘系统上的数据提供安全是操作系统面临的最关键挑战之一。通常，边缘设备无法执行像在计算机或云端执行的所有种强壮的安全相关算法。这是因为它们的存储空间和计算能力较低。因此，如果处理得不恰当，边缘设备很容易受到安全攻击。在支持边缘的设备上，操作系统的目的是确保在应用程序执行期间具有轻量级且合理接受的安全水平。\n\
  \n3. **可审计性**：审计资源的效用是边缘计算环境中操作系统的另一个方面。近年来，研究人员提出了在支持边缘设备上启用虚拟化的概念，类似于传统的服务器或数据中心。虚拟化的概念是基于多个服务请求来复用硬件资源。显然，在边缘节点上启用多所有权可能会引发与利用模式和控制机制相关的问题。边缘\
  \ `OS` 必须具备所需的功能，以便在这种多租户环境中审计和控制资源的利用。\n\n4. **接口**：操作系统充当用户与硬件组件（如内存单元、`I/O` 和连接设备）之间的接口。这些接口以不同的格式设计。例如，边缘节点中的某些基于\
  \ Debian 的操作系统具有通过终端的基于文本的输入，而操作系统中还有少数其他使用鼠标或其他输入设备的即插即用方法的输入方法。通常情况下，操作系统的接口具有菜单项，用于显示运行中的进程、桌面功能和代表不同应用程序的快捷方式。接口的设计必须以用户友好的方式协助用户。\n\
  \n![图 3.1. 边缘设备中的操作系统相关功能。](img/bk978-0-7503-5593-3ch3f1_online.jpg)\n\n**图 3.1.**\
  \ 边缘设备中的操作系统相关功能。\n\n### 3.2 边缘设备中 OS 的目标 (Edge OS)\n\n边缘操作系统的目标与服务器的普通操作系统相似。设计边缘\
  \ `OS` 的核心目标之一是抽象硬件资源，以便进程能够访问硬件组件。硬件抽象在操作系统中非常重要，可以有效为队列中的进程规划资源；同样，它通过选择合适的调度算法增加了资源的利用率。\n\
  \n操作系统的下一个目标是充当硬件与软件过程之间的桥梁。在支持边缘的设备中，进程可能会被许多 `I/O` 模块中断。这些进程必须考虑到中断以敏捷的方式进行调度。边缘操作系统的调度算法必须经过调整以处理这些多个输入设备。\n\
  \n托管在支持边缘的设备上的操作系统的一个特殊要求是不断用新功能更新操作系统。应用程序开发人员根据客户需求不断更新功能。相应的，`OS` 架构师必须更新 `OS`。操作系统的新版本中存在更新和版本更改。例如，`FreeRTOS`\
  \ 具有通过空中下载 (`OTA`) 更新自动更新设备软件功能的功能。\n\n另一个目标是在本地设备上处理请求而不中断全球连接的节点。通过这种方式，可以在优化资源的同时保护应用程序的隐私级别。\n\
  \n此外，在设计操作系统（包括支持边缘的 `OS`）时，开发者尝试提高结果的效用。例如，操作系统应该具有模块化编程结构，以便该框架对未来的研究人员或开发者方便。软件解决方案对开发者和对用户而言都必须具有足够的便利性。值得注意的是，用户应该能够舒适地选择配置或启用/禁用硬件组件。在\
  \ [14] 中，作者列出了需要托管在支持边缘设备上的操作系统关键特性。\n\n### 3.3 OS 分类：迈边缘\n\n\n\n\n传统上，操作系统（OS）分为批处理操作系统、分时操作系统、分布式操作系统、实时操作系统、嵌入式操作系统和网络操作系统。批处理操作系统旨在批量处理任务。进程不会即时调度资源，相反，是从用户列表中收集特定的进程，并根据特定时刻资源的可用性进行调度。在批处理操作系统中，操作系统与资源没有直接连接。因此，完成进程所需的时间是未知或不可预测的。然而，批处理方法在处理资源有限的大量用户时是高效的。\n\
  \n在分时操作系统中，任务以分时的方式进行处理 [10]。这为计算系统中的任务提供了公平的调度，因为为所有执行操作分配了特定的时间段。与之前的批处理系统相比，它是一个交互式系统。这意味着允许用户在指定的时间段内执行任务，而不受其他用户的干扰。\n\
  \n开发分布式操作系统 [17]的关键在于确保资源的透明性，因为资源分布在不同的区域或位置。某些资源通过跨越多个管理域的广域网连接。在分布式操作系统系统中，通过提供极度透明的跨资源来处理用户的任务需求至关重要。显然，资源可用性或资源分布可能存在延迟，或者考虑到应用程序的性能因素，存在复制资源的需求。此外，过去观察到资源由不同的供应商共享。因此，资源共享必须遵循开放标准以确保容错性。\n\
  \n实时操作系统 [6] 主要关注于输入任务随时间变化的实时操作。输入任务将具有硬性截止时间（hard deadlines），使得实时操作系统的对象将根据不断变化的需求调整调度。与分时操作系统或批处理操作系统机制相比，操作系统设计用于处理来自用户的多个并发请求。原则上，实时操作系统只需要有限的存储空间，因为大多数请求会根据时间和资源的可用性立即处理。在大多数情况下，实时操作系统是为特定应用程序或过程设计的。相比之下，大多数其他操作系统是为处理通用应用程序或过程设计的。\n\
  \n嵌入式操作系统 [2] 是为特定应用程序定制的嵌入式设备设计的。正如名称所示，该操作系统加载到单个芯片中，最好是微控制器。嵌入式操作系统承担了与实时操作系统类似的实时操作或过程。然而，它在时间限制型应用中并不那么严格。嵌入式操作系统主要关注事物或对象，例如支持物联网的节点，而不是处理轻量级过程的计算机。它必须处理大量的\
  \ I/O 中断。例如，乐鑫（Espressif）的 `ESP 32` 可能需要使用其关联操作系统处理 26 个通用 I/O 单元或传感器。与大多数其他通用操作系统相比，这突出了此类操作系统配置支持和中断处理程序重要性。\n\
  \n除了这些类型的操作系统外，还有网络操作系统，专门用于交换机、路由器或网关等网络相关设备。由于这类操作系统是为特定设备设计的，因此不适用于通用计算机。网络操作系统的关键特性包括支持多种通信协议和标准。例如，支持\
  \ `TCP/IP` 标准的设备必须通过网络操作系统与基于 `Zigbee` 的通信协议设备进行高效通信。此外，与其他操作系统相比，网络操作系统支持能够轻松共享公共文件系统和数据库。\n\
  \n边缘 OS 是一种属于实时操作系统和嵌入式操作系统类的特殊操作系统。边缘计算节点的操作系统旨在实时处理中断并交付结果。操作系统必须具备默认的轻量级安全选项，以便连接的设备或事物能够保护自己免受外部安全挑战。\n\
  \n### 3.4 边缘 OS：示例\n\n边缘计算节点的操作系统根据其能力分类。基于服务器的边缘节点可以托管通用操作系统，而微型、功率受限的边缘设备必须具有嵌入式或实时操作系统。此外，根据在路由器等网络设备上托管操作系统，该操作系统被称为网络操作系统。在本节中，我们将理解边缘计算节点常用的操作系统及其原始特性。\n\
  \n图 3.2 显示了用于边缘 AI 系统的前 12 个操作系统。它们在接下来的子节中详细介绍。\n\n![Figure 3.2. Edge-OS: a1 few\
  \ examples.](img/bk978-0-7503-5593-3ch3f2_online.jpg)\n\n**图 3.2.** 边缘 OS：a1 示例。\n\
  \n#### 3.4.1 QNX neutrino OS\n\nQNX 的发音为 quenix。它是一个基于 UNIX 的操作系统。然而，它并不完全是 UNIX\
  \ 产品。它是为蓝莓（Blueberry）设备设计的微内核版本操作系统。它使用消息传递方法提供同步进程间通信 [3]。最初，该操作系统由一家加拿大公司设计，作为小型设备的实时操作系统解决方案。后来，黑莓（Blackberry）公司设计了操作系统的\
  \ `neutrino` 微内核版本，以提供微型边缘设备所需的功能。\n\nQNX Neutrino OS 最重要的特性列如下：(a) 实时：QNX Neutrino\
  \ OS 设计用于轻松支持实时操作。这使得 `QNX neutrino` 能够对连接设备的 I/O 中断迅速做出。(b) 监控：`QNX neutrino` 在操作系统中具有自监控功能。该特性的本质是自动监控进程或线程的状态，以便通过轻量级内核激活一些恢复机制。(c)\
  \ 调度：QNX Neutrino 操作系统支持多种调度选项，例如运行进程的对称或非对称调度选项。事实上，调度是如 QNX Neutrino 等操作系统的关键特性之一。例如，[5]]\
  \ 的作者已经应用自适应分区调度算法的效率，最大限度地减少自主应用的延迟。(d) 安全：该操作系统设计为内生支持安全挑战。值得注意的是，内存泄漏、进程黑客、文件系统故障等安全问题可以根据操作系统中启用的功能降至最低。在\
  \ `QNX neutrino OS` 中，安全组件以分层方法实现，包括用于缓解安全挑战的系统级内核模块。\n\n#### 3.4.2 FreeRTOS\n\n\
  FreeRTOS 是一种为嵌入式设计的实时操作系统 [1]。操作系统基于 C 语言开发，存储空间需求极小。该操作系统安装在支持物联网的多个微控制器开发板上，例如\
  \ Arduino UNO、Raspberry Pi Pico、`ESP 32`、Jetson Nano 等。\n\n\n\n目前，由于其简单性和模块化实现能力，FreeRTOS\
  \ 在物联网（IoT）市场中被广泛应用。它具有广泛的许可选项，例如商业或学术产品均基于 FreeRTOS。为了吸引广泛的研究人员或从业者，近期已经开发了一个基于\
  \ FreeRTOS 的庞大生态系统。例如，FreeRTOS 已经扩展到提供使用 `trace` 组件的进程实用程序跟踪；基于 FreeRTOS 开发了 TCP\
  \ 和 UDP 组件，以支持可靠的连续传输和不可靠的通信。同样，FreeRTOS 已经促成了数万个基于物联网的产品的开发 [18]$。\n\n### 3.4.3\
  \ Integrity OS\n\nIntegrity OS 是由 GreenHills Software, Inc. 开发的一种种操作系统 [7]。该操作系统被设计为一种实时操作系统，更强调可靠性和安全性。该操作系统旨在在不损害应用程序性能的情况下提供安全的实时运行。它支持多种文件系统，如\
  \ FAT、NFS 以及文件系统的日志功能。凭借内置的路由功能，Integrity OS 能够支持基于远程的 Web 服务，如 HTTP、sHTTP、SOAP、AJAX、JSON\
  \ 等。\n\nIntegrity OS 的重要特性是增强任务关键型应用程序的可靠运行。例如，即使在资源不可的情况下，只要操作系统提供足够的 CPU 或内存资源，军事应用程序就可以继续运行。这意味着在向运行进程交付资源时，会保留一个特殊的预留。注意的是，为了防止任务关键型应用程序中的内存栈溢出，Integrity\
  \ OS 在内核级设置了专用的内存分配单元。通过这种方式，应用程序可以继续运行而不因为资源不可而失败。\n\n#### 3.4.4 ThreadX\n\nThreadX\
  \ 是微软的产品 [15]$。它的目的是为基于云的物联网应用提供嵌入式操作系统。该操作系统旨在满足属于 RISC、CISC 或 DSP 处理器的多种嵌入架构。ThreadX\
  \ 操作系统的独特之处是微内核（picokernel）特性，它以服务的形式汇集了多个嵌入式操作系统功能。与其他几个嵌入式操作系统相比，由于其可服务的方法，这种架构在嵌入式研究人员中的实用性有所提高。例如，核心\
  \ OS 特性可以根据需要层层叠加多个其他面向服务的功能组件。\n\nThreadX OS 系统的最重要特性是：(i) 以抢占式或协作方式调度进程；(ii) 在运行时高效地处理中断；(iii)\
  \ 迭代地处理任务的基于事件的请求等。\n\n为了管理布尔操作、事件标志、互斥锁操作、线程、信号量、块操作和其他任务，ThreadX 操作系统提供了多种数据类型。为此目的创建的专用\
  \ API 处理了操作系统的预期功能。例如，要停止并释放块指针，请使用以下代码：\n\n```\n/* To create mutexes… */ tx_block_release(VOID\
  \ *block_ptr); tx_mutex_create(TX_MUTEX *mutex_ptr, CHAR *name_ptr, UINT inherit);\n\
  ```\n\n在 ThreadX 操作系统，互斥锁活动可以像创建一样通过 API 调用来停止或删除。\n\n在 ThreadX 中，创建了设备驱动程序以支持来自各种供应商的设备。由于\
  \ ThreadX 将这些设备驱动程序作为服务而非堆栈模块，初始化它们可能会很困难。在 ThreadX 中，特定的驱动组件被设计用于管理设备输入输出数据。为了这一点，在某些与\
  \ ThreadX 操作系统驱动相关的服务中开启了缓冲。\n\n#### 3.4.5 PikeOS\n\nPikeOS 是由 Sysgo Embedding Innovations\
  \ 公司设计的一种实时操作系统 [8]$。它支持 x86、POWER、ARM 和 RISC-V 等架构。PikeOS 的一个重要特性是资源的虚拟化配置。与许多其他现有实时操作系统相比，PikeOS\
  \ 专长在不同架构中通过虚拟机程序支持资源的虚拟实例。由于涉及到使用虚拟机程序的虚拟实例，PikeOS 允许跨越多个硬件单元迁移资源或服务。在编写本书时，PikeOS\
  \ 5.1.3 已开发用于辅助系统级设备。作为欧盟的产品，该方法对所有从业者开放，没有任何地理区域限制。\n\n#### 3.4.6 ChibiOS\n\nChibiOS\
  \ 是由 ChibiOS 组作为一个项目开发的实时操作系统。ChibiOS 的实现侧重于开源许可下的基于 Linux 的机器。显然，它使研究人员能够实验新的调度策略或算法，并学习嵌入式设备上的中断处理机制。此外，人们在实验嵌入式应用时，也探索了栈和栈内存大小的重要性。\n\
  \nChibiOS 的内部状态被分为七种主要状态 [4]$：初始化状态（init state）、正常状态（normal state）、挂起状态（suspended\
  \ state）、禁用状态（disabled state）、睡眠状态（sleep state）、锁定状态（locked state）、服务状态（serving\
  \ state）和停止状态（halted state）。初始化状态是操作的起始状态。它字面上指的是重置操作。正常状态是所有 API 可由资源的状态。挂起状态发生在\
  \ API 调用变得不可用时。在此状态下，不允许执行任何操作。服务状态相当于任何操作系统的运行状态。在此状态下，API 是执行的。与正常状态相比，服务状态涉及资源的利用。停止和锁定状态旨在停止运行进程。在停止状态，使用特定的\
  \ API 调用停止服务，而锁定状态则不允许任何进程覆盖当前的状况。注意的是，它涉及到需要保护文件免受外部修改的情况。\n\n### 3.4.7 Raspbian\
  \ OS\n\nRaspbian OS 是一种为树莓派设备设计的操作系统。它拥有超过 35,000 个针对许多设备预编译的包。因此，有多个基于树莓派设备的用例或应用\
  \ [13]$。Raspbian OS 的版本是为强大的计算单元或 SoC 设备设计的。在后的情况下，操作系统不包含桌面显示功能的所有特性。相比之下，大多数操作系统功能的精简版在\
  \ SoC 设备上是可。例如，树莓派 Pico 设备包含了 Raspbian OS 的精简版。\n\n#### 3.4.8 TinyOS\n\n\n\n\nTinyOS\
  \ 是由斯坦福大学设计的嵌入式操作系统，属于开源类别下的 BSD 许可证版本 [12]。TinyOS 包含系列驱动程序和调度器，用于将传感器或执行器连接到微控制器。与许多其他嵌入式操作系统相比，TinyOS\
  \ 的空间复杂度极低。然而，该操作系统包含的安全特性远少于 `Integrity OS` 等专用操作系统。该操作系统设计用于多种特定的家庭特定嵌入式应用，涉及冰箱、洗衣机、加热器、空调等。此外，它们也适用于建筑、工业或制造单元中的多类智能设备。TinyOS\
  \ 使用 `nesC` 语言编写而成，这是一种基于 C 语言的方言语言。\n\nTinyOS 最重要的特性包括设置定时器、实时调度任务、资源抽象、启用虚拟化资源、管理功率利用、处理\
  \ I/O 设备等。在网络层，该操作系统支持处理 `WIFI`、`Bluetooth`、串行通信、`IEEE 802.15.4` 协议栈等多种协议。为了支持协议标准化，已经提出了特定的建议；例如，制定了\
  \ `TEP125` 以标准化使用 TinyOS  way 系统的微控制器之间节点间通信的帧结构。\n\n#### 3.4.9 Zephyr OS\n\nZephyr\
  \ OS 基于 Apache 许可证开发，具有极小的代码空间。通常，该操作系统设计用于支持 IoT 功能的微型设备，这些设备的存储空间限制是一个特别关注的问题。该操作系统支持扩展到属于\
  \ `ARM`、`Intelx86`、`Sparc`、`Tensilica Xtensa`、`RISC-V` 等多种架构设备。该操作系统提供更广泛类别的服务。例如，它提供内核级服务以支持多线程、电源管理、内存分配、同步和中断处理服务；它提供多种调度算法服务，如协作调度、最早截止优先调度、时间分片和基于队列的调度；它通过防止栈溢出、权限违规等来实现内存保护；它扩展了对各种设备驱动的支持以驱动不同架构的设备；在部署在嵌入式节点上时，它提供了强大的隔离功能\
  \ [9] 等。\n\nZephyr OS 基于 C 编程语言和 `C-Make` 构建系统。它鼓励开发者通过扩展工具或将操作系统与新解决方案相结合不断创新。例如，Zephyr\
  \ OS 提供了如 `Trace Compass`、`I/O Taxonomy`、`Object Tracking` 等可视化工具，并具有其专用功能。此外，它对\
  \ `Bluetooth 5.0` 提供了现代化支持，以启用处理低功耗模块的支持功能。\n\n为了最小化设备的功耗利用率，Zephyr OS 内置了电源管理机制，即当由于数据不可导致资源未被使用时，内核进入空闲状态。电源管理策略或相关的控制子系统足够强大，可以在应用程序运行时决定是否关闭设备。\n\
  \n### 3.4.10 Contiki-NG OS\n\nContiki-NG OS 专为内存受限的 IoT 应用及相应的内存限制微型设备设计。它是一个开源操作系统，可以邀请多个开发者演示支持\
  \ IoT 功能的产品 [11]。它主要关注通过勤勉的节能架构来最小化设备各个组件的能量利用。它支持属于不同类别的多种节能架构，如 `ARM Cortex` 和\
  \ `Texas Instruments`。由于 Contiki-NG OS 侧重微型 IoT 设备，其代码空间限制在 100 K。\n\nContiki-NG\
  \ 通过提供低功耗 `IPv6` 寻和通信来支持网络。与 `Zigbee` 等其他不兼容协议相比，由于使用了 `IPv6`，它对基于 IP 的设备有广泛的支持。Contiki-NG\
  \ OS 的核心特性包括提供实时定时器、多任务、调度、数据缓冲、能量监控等。由于基于 `UDP` 的通信，基于 Contiki-NG OS 的设备在可靠通信方面的辅助有限。\n\
  \n为了监控 Contiki-NG 计算模块的能耗，该操作系统利用 `Energest` 工具。该工具是一个实时跟踪资源利用的软件模块。根据设备利用率的高低，`Energest`\
  \ 工具可以关闭硬件模块。与操作系统相关的多个 API 可以自动控制内存受限 IoT 节点的能量效率。\n\n#### 3.4.11 mbed OS\n\nmbed\
  \ OS 是一个为 `ARM-based cortex-M` 设备设计的操作系统。通常，`ARM` 设备被用于边缘计算应用。mbed OS 是一个用于支持 IoT\
  \ 连接系统的专用操作系统。这是因为它提供了足够的安全特性和模块化开发环境。这是一个基于 `C/C++` 的模块化架构，专为资源受限设备设计。\n\n最新版本\
  \ `v6.15` 具有在线编译源码并使用在线 `Mbed Studio` 开发代码的功能。`Mbed Studio` 是一个集成开发环境，可以检查程序的安全特性，包括内存泄漏。它具有通过虚拟机抽象资源从而在不同边缘计算节点之间迁移虚拟资源的能力。为了实现这一点，mbed\
  \ OS 提供了一套使用 `mbed-tools` 的专用迁移工具。\n\n对 `Windows` 和 `MacOS` 机器的支持加上大多数 `Linux` 安装程序，增加了\
  \ Mbed OS 在许多 IoT 应用中的普及。该开发平台还支持大多数现有集成开发工具，如 `Eclipse`、`Visual Studio` 等。\n\n\
  `BLE` 节点支持多种 `GATT` 实现，以便使用该操作系统高效处理受限的 IoT 节点。例如，体域网节点可以通过广播节点的可用性进行连接。同样，由于辅助程序的可用，该操作系统在许多通信协议中具有广泛的应用前景\
  \ [16]。\n\n#### 3.4.12 eCoS OS\n\neCoS 操作系统的设计考虑了设备的嵌入特性。它是一个可配置的软件资源，一次运行一个进程。然而，该操作系统提供了多个线程级的轻量级进程以提高实时嵌入应用的性能。\n\
  \n该操作系统使用 `C++` 编写。此外，它具有支持多种基于 `C` 的解决方案的能力。它对处理中断具有实时支持。由于其免费开源版本，eCoS OS 在开发新型操作系统及其特性方面被广泛尝试。\n\
  \n### 3.5 边缘操作系统中的进程状态\n\n进程通常是指执行中的程序。程序被加载到内存中执行并提供状态信息以便我们管理这些进程。通常，传统操作系统维护多种状态来管理进程。然而，由于计算能力有限，如\
  \ `ESP 32` 等基于嵌入式操作系统的设备进程状态有限。通常，嵌入式设备的进程状态分为四大类。列出如下：\n\n\n\n\n\n进程状态\n\n1. **就绪态（Ready\
  \ state）**：在此状态下，为进程的执行创建了资源。这些资源包括线程、内存单元和其他资源。就绪态是设备进入分配了 CPU 执行的设备中运行态的指示。该状态由操作系统的调度器管理。在某些情况下，程序的状态会在运行进程之间进行切换。\n\
  \n2. **运行态（Running state）**：正在执行的程序称为运行态。指令必须使用特定的 CPU、内存或计算单元进行执行。在进程的运行期间，除非发生任何中断或硬件故障，否则必须间断执行进程执行。\n\
  \n3. **阻塞态（Blocked state）**：如果进程等待数据处理或指令执行，则会进入阻塞态。程序员可能会由于预期的资源或输入数据不可用而故意延迟进程。在这些情况下，将进程设置为阻塞态是关重要的，这样其他进程就可以利用资源。进程阻塞态的优势是具有在一段时间后恢复操作的能力。例如，进程的\
  \ `delay(2)` 函数会阻塞进程 2 秒，并自动恢复。\n\n4. **挂起态（Suspended state）**：当指令在特定时间内不执行时，进程被认为处于挂起态。这与进程的阻塞态相似。然而，挂起的进程不能自动恢复，即没有特定的时间段来停止和启动进程。它在等待另一个进程来恢复其操作。\n\
  \n## 3.6 FreeRTOS：用于嵌入式设备的操作系统\n\nFreeRTOS 是嵌入式设备中常用的流行操作系统之一。FreeRTOS 是一个轻量级操作系统，用于管理进程、调度任务和处理中断。在本节中，我们将学习\
  \ FreeRTOS 在基于 `esp32` 的处理器上的应用。\n\n### 3.6.1 FreeRTOS: ESP 32\n\n由于 FreeRTOS 支持如\
  \ `ESP-IDF` 等集成开发环境，因此可以很容易地移植到基于 `esp32` 的微控制器上。`ESP 32` 微控制器（例如 `ESP 32-WROOM`\
  \ 开发板）具有双核心，可以同时处理多个任务。为了在在较小的嵌入式板上支持多任务处理，`ESP-IDF` 已将 FreeRTOS 原生集成到 IDE 中。这一理念是让用户（特别是程序员）在使用操作系统，而不是直接对设备进行编程。\n\
  \n在基于 `ESP 32` 的板上包含 FreeRTOS 的优势如下：(a) 设备与应用的集成，(b) 执行并行任务，(c) 高效利用定时器，(d) 组织信号量，(e)\
  \ 处理多种通信协议如 WiFi、蓝牙、`BLE`、`HART` 等，(f) 启动任务队列，(g) 使用复杂的算法调度任务等。\n\nFreeRTOS 以及创建任务或调度函数的相关函数是以\
  \ API 的形式实现的，以便用户可以在其功能逻辑中调用这些函数。最初，用户必须导入头文件中定义的适当库，例如：\n\n```\n#include <freertos/FreeRTOS.h>\
  \ // 用于 FreeRTOS\n\n#include <freertos/task.h> // 用于任务\n```\n\n### 3.6.2 并行任务\n\n\
  由于 `ESP 32-S` 开发板具有两个核心，因此多个任务在这些微控制器中是并行执行的。在本小节中，我们将探索在部分 Espressif 开发板上执行基于 FreeRTOS\
  \ 任务的益处。\n\n#### 3.6.2.1 任务创建\n\n使用下面定义的函数定义并创建任务：\n\n```\nxTaskCreate(Task1_ReadSensor,\
  \ \"Reading Sensor\", 4096, NULL, 10, &TaskHandle1);\n//arg-1 -> 任务名称\n//arg-2 ->\
  \ 任务描述\n//arg-3 -> 栈大小\n```\n（注：此处原文注释似乎不完整，已根据上下文翻译）\n\n[修正翻译]：在本小节中，我们将探索在部分 Espressif\
  \ 开发板上执行基于 FreeRTOS 任务的益处。\n\n#### 3.6.2.1 任务创建\n\n使用下面定义的函数定义并创建任务：\n\n```\nxTaskCreate(Task1_ReadSensor,\
  \ \"Reading Sensor\", 4096, NULL, 10, &TaskHandle1);\n//arg-1 -> 任务名称\n//arg-2 ->\
