- "# 边缘智能：深度学习赋能的边缘智能\n\n\n\n\n\n\n\n\n\n## 关于系列\n\n本系列的撰写初衷是开发一个关于先进计算方法、技术及其应用的受信赖的库。\n\
  \n本系列关注下一代计算的最新进展，特别是计算机科学与其他学科之间的协同作用。本系列中的书籍将探索各个领域中从计算的、与计算视角相关的新进展，包括基础理论、系统、创新应用，以及与相关领域相关的计算工具、模型和算法总体设计相关的研究贡献。它涵盖了人工智能、机器学习、区块链技术、量子密码学、量子计算、纳米科学、基于生物科学的传感器、物联网应用、仿启发算法、计算机视觉、生物信息学等领域的研究与开发，以及它们在科学、工程、商业和社会科学领域的应用。它涵盖了社区中广泛的领域，包括工业界、政府部门和学术界的应用。\n\
  \n本系列的目标是为未来的研究人员和专家提供基于下一代计算及其多样化应用的工作的机会。它还提供了一个数据共享平台，汇聚国际研究人员、专业人士和学者。本系列汇聚了不同学科的思想领袖、研究人员、行业从业者和潜在用户，以开发新的趋势和机会，交换与先进计算方法的思想和实践，并促进跨学科知识。\n\
  \n在该系列中出版的书目完整列表请参见：[https://iopscience.iop.org/bookListInfo/iop-series-in-next-generation-computing]。\n\
