  ***\n\n# IOP Publishing\n\n# 边缘智能\n\n# 深度学习的边缘计算\n\n# Shajulin Benedict\n\n***\n\
  \n# 第 6 章\n\n## 边缘资源与加速器\n\n边缘计算已成为传感器、执行器与中心化云环境之间的利基领域。它增强了底层应用的计算能力。存在几种具有独特特征的计算资源，用于辅助此类应用，特别是在\
  \ AI 领域。\n\n本章描述了边缘级资源，并重点关注边缘 AI 加速器。它邀请硬件制造商针对其应用领域严谨地规划各种边缘资源的应用。\n\n### 6.1\
  \ 边缘资源：基础\n\n微控制器和微处理器被用作边缘资源，在支持物联网的应用或计算机视觉应用中执行边缘级计算。这些设备可以收集和处理传感器信息，或者通过应用的网络执行器执行动作。例如，`Raspberry\
  \ Pi` 设备连接到某些连接的传感器节点或执行器，以在靠近传感器节点的地方处理数据；一组 `Raspberry Pi` 设备被用于建立边缘计算设备 `[11]`，而微控制器数组被用作物联网\
  \ 应用中的网关 `[5]`。\n\n#### 6.1.1 微处理器\n\n微处理器是一种数字处理设备，由单芯片上的处理器组成。通常，微处理器与其他外围单元连接。与计算机类似，它们根据指令执行操作。在执行过程中，它们有一个程序计数器，指向下一条指令。尽管边缘设备中微处理器的设计保持不变，但它们具有一些特性。特别是，这些处理器旨在提高扩展性。例如，第四代\
  \ `Intel Xeon`处理器旨在加速视频能力。\n\n#### 6.1.2 微控制器\n\n微控制器已存在数十年。计算机体系通常倾向于使用微控制器构建嵌入式应用。背后的主要原因是微控制器的优势。通常，微控制器将计算组件、I/O\
  \ 单元和内存嵌入单个芯片或集成电路中。因此，此类设备能够处理自定义程序。通常，微控制器中的处理器采用精简指令集架构（RISC）而非复杂指令集架构（CISC）。例如，Espressif\
  \ 的 `ESP32` 系列系统（如 `ESP32 C6`、`ESP32 C3` 或 `ESP32`）基于 `RISC-V` 架构。然而，`CISC`架构也可用于设计微控制器。\n\
  \n\n\n\n与微处理器相比，微控制器是为特殊用途而设计的。通常，基于微控制器的边缘节点内存是有限的。因此，这些设备的设计目标是支持专门的流程。相比之下，基于微处理器的设备拥有无限的内存，因为这些内存单元在类设备上是按分层方式组织的。\n\
  \n### 6.1.3.2 电路能力\n\n微控制器在尺寸和功能上受到限制。由于这些设备集成在单个芯片中，设计更大的电路是一项具有挑战性的任务。这种限制在基于微处理器的边缘设备上通常不会观察到。\n\
  \n### 6.1.3.3 外设支持\n\n微控制器可以根据应用程序的需求自定义外设设备。例如，一个由数字传感器组成的物联网应用程序可以避免使用某些会增加设备功耗的转换器。\n\
  \n### 6.2 微控制器级设备：算边缘吗？\n\n在了解微控制器和微处理器的基础之后，我们需要深入研究将微控制器应用于处理边缘应用的各个方面。本节探讨了引入基于微控制器的边缘节点的必要性。\n\
  \n#### 6.2.1 边缘？\n\n尽管边缘设备在多个物联网设备中被广泛使用，但在编写本书时，对边缘设备的定义还是模糊的。一些研究人员认为，基于微控制器的设备不能归类为边缘设备。然而，另一些人将边缘设备视为在靠近传感器或执行器节点处理数据的设备。\n\
  \n总的来说，如果 `Arduino UNO`、`Arduino Nano`、`Arduino Due`、`ESP32`、`Raspberry Pi Pico`\
  \ 等基于微控制器的设备能够实时处理数据并支持低功耗的多通信协议，就可以被归类为边缘节点。相反，最获得的基于微控制设备并不具备强大的计算能力，也没有多种通信协议的辅助。\n\
  \n#### 6.2.2 Arduino 的重要性\n\n在物联网市场上引入 Arduino 板板非常流行。研究人员和实践者出于以下原因使用 Arduino 板板。\n\
  \n##### 6.2.2.1.1 更广泛的实现\n\nArduino 板板在农业、医疗、金融、教育等各个领域具有更广泛的适用性。制造 Arduino 板板的行业热于通过根据用户需求开发新板子来满足用户的需求。例如，Arduino\
  \ 的 `nRF52840` 产品引入了在物联网网关处具有稳健远程控制功能的边缘控制解决方案；`Yún Rev2` 板板实现了在边缘设备上基于 Linux 的应用程序执行。\n\
  \n##### 6.2.2.1.2 更低的成本\n\nArduino 板板的成本远低于 `Jetson Nano` 或 `Corel Dev` 等其他边缘设备，例如\
  \ `Arduino UNO` 板的成本为 3.40 美元，而 `Jetson Nano` 板的成本为 300 美元。这表明与其他边缘级计算节点相比，用户有兴趣使用\
  \ Arduino 板板尝试新的实践。\n\n##### 6.2.2.1.3 低功耗\n\n在设计板子时，Arduino 板板的功耗被最低。通常，基于 `ATMEGA328`、`ATMEGA32u4`\
  \ 和 `ATMEGA2560` 的 Arduino 板板功耗为 5 伏。电流范围从 22 mA 到 160 mA，取决于微控制器板板。这些设备可以进行定制，或者可以专门开发软件组件，以提高应用程序在这些板板上执行时的能量效率。\n\
  \n##### 6.2.2.1.4 开发灵活性\n\nArduino 板板采用模块化设计，以便任何硬件开发者都可以利用最少的组件来执行他们的任务。例如，如果用户只需要两个\
  \ `GPIO` 引脚，就可以根据特定需求对板板进行定制。此外，根据所需的资源，可以尽可能减少一些模数转换或数模转换器。因此，在基于 Arduino 的硬件实现中，实施涉及的成本或应用程序引起的能量损耗可以降到最低。\n\
  \n##### 6.2.2.1.5 互连性\n\nArduino 板板提供了接口，可以连接市场上的多种传感器或执行器。例如，它可以连接如温度传感器、压力传感器、湿度传感器、开关、继电器、变阻电阻等传感器。此外，板板还支持连接支持不同通信协议（如\
  \ `WiFi`、`Bluetooth`、`LoRAWAN` 等）的其他设备。为了实现这一点，设备通过连接适当的扩展板（shields）与这些不同的通信协议进行通信。板板的设计支持各种显示单元，包括数字和模拟显示模式。此外，还允许主机使用最常用的接口即\
  \ `USB` 连接到这些 Arduino 板板。\n\n#### 6.2.3 Arduino 系列\n\n多种板板为各种用途而设计，并配备了足够的库和文档供研究人员和实践者执行。此外，这些开发在各自领域引发了数以万计的创新。\n\
  \nArduino 板板通常分为三大类，如下所示：\n\n1.  **Nano 系列**：Arduino 社区的 nano 系列设计了具有微型足迹的板板。由于电源或电流范围有限，这些板板对连接所有可用传感器或执行器的支持有限。nano\
  \ 板是为特定应用设计的，如家用自动化、农业、医疗、艺术、工业等。该板板基于 `ATmega328` 设计。`Nano ESP32` 和 `Nano 33 IoT`\
  \ 是基于 nano 系列的一些 Arduino 板板 [13]。\n\n2.  **MKR 系列**：nano 板的困难之处在于它们处理多种连接协议（如 `WiFi`、`Bluetooth`、`WAN`\
  \ 等）的能力。如前所述，nano 板适用于连接支持的特定物联网应用。然而，为了支持多种连接并建立更广泛的应用频谱，设计了 MKR Arduino 板板。\n\n\
  \    在 MKR 系列中，由于内置通信媒介的可用性，应用程序开发人员可以快速实现他们的想法。这些板板具有支持一系列协议的内置连接，如 `WiFi`、`Bluetooth`、`GSM`\
  \ 和 `WAN`。16] 的作者开发了一种基于物联网平台的供水管道评估系统，该系统利用 MKR 系列板板采集传感器数据。\n\n    然而，对于更特定领域的变体协议支持有限，即一块板不支持所有必要的通信协议。例如，窄带物联网、LoRa\
  \ 连接和 `SigFox` 相关协议由 MKR 系列的特定板板支持。\n\n    有名为扩展板的实现支持 MKR 板板中的一些更广泛的协议。例如，`Arduino\
  \ MKR ENV Shield Rev2`、`Arduino MKR GPS Shield`、`Arduino MKR CAN Shield` 等被设计为扩展板以建立连接。\n\
  \n3.  **Classic 系列**：Arduino 经典系列设计用于通过足够的通用 IO 引脚支持更广泛的应用。与其他系列相比，基于经典系列的板板非常受欢迎。这是因为最初的实践者是从经典系列板开始工作的。例如，一个初级物联网设计师更倾向于使用\
  \ `Arduino UNO` 板而不是属于 nano 或 MKR 系列的板板。\n\n\n\nArduino 板板的运行速度各异。为了评估不同 Arduino\
  \ 板板的能力，在这些板上执行了一个包含 $2⁹$ 条指令的基准测试应用程序。观察到 `Arduino UNO` 相对慢于 `Arduino Due` 板，也就是说与花费\
  \ 28 秒的 `Arduino UNO` 相比，`Arduino Due` 在 2 秒内就完成了任务。相比之下，`Arduino UNO` 与 `Leonardo`（29\
  \ 秒）、`MiniPro`（28 秒）以及 `Mega2560`（28 秒）的执行时间相似。据推断，在这些微控制器上执行任务时，其速度比普通笔记本电脑慢 400\
  \ 倍以上。\n\n## 6.2.4 Arduino UNO 板\n\n`Arduino UNO R3` 板是一种流行的基于 `ATMega328` 的 Arduino\
  \ 板板，属于经典系列。该板的工作电压为 5 伏特，工作频率为 16 MHz。该板支持模拟和数字输入，并具有足够的引脚。同样，该板通过 `USB` 接口与主机连接，用以烧录编辑后的源代码。此外，该板还支持通过内置通用异步收发传输器\
  \ (`UART`) 传输和接收信号。\n\n### 6.2.4.1 结构：Arduino Uno R3\n\n`Arduino Uno R3` 板的结构由专用硬件组件（引脚和插座）组成：(i)\
  \ 一个 `USB` 插座、一个 `RESET` 开关、一个内置 `LED`、一个 `ATMega328` 微控制器芯片、数字和模拟输入输出引脚以及电源插座。\n\
  \n图 6.1 提供了 `Arduino UNO R3` 板内部组件和连接的概览。虽然可以使用几个主要组件创建新的板板设计，但最初，用户将传感器或执行器连接到\
  \ Arduino 提供的这些现有板上。\n\n![图 6.1. Arduino UNO 板的结构。经 Arduino.cc 许可。CC BY SA 3.0。](img/bk978-0-7503-5593-3ch6f1_online.jpg)\n\
  \n**图 6.1.** Arduino UNO 板的结构。经 Arduino.cc 许可。[CC BY SA 3.0](https://creativecommons.org/licenses/by-sa/3.0/)。\n\
  \n## 6.2.5 Arduino 编程\n\nArduino 程序使用 `Arduino IDE` 使用 `C/C++` 编写。该 IDE 专门编写用以满足编程人员的需求。Arduino\
  \ 程序涉及两个广义定义的函数，即 `setup()` 和 `loop()` [18]。`setup()` 函数用于配置传感器和执行器所需的设置。例如，如果需要通过\
  \ `GPIO` 引脚向连接传感器的单元发送高电压，编程人员可以在 `setup()` 函数中表示该信息。同样，与连续测量相关的活动（如从特定引脚号监控逻辑）可以使用\
  \ `loop()` 函数执行，即 `loop()` 函数将持续且无中断地循环预定义的任务。\n\n在考虑不同的板板时，`Arduino IDE` 能够轻松地准备环境。注意的是，用户必须为设备配置所需的功率电和平传输波特率。这些配置是针对不同板板进行独特组织的。通过利用\
  \ `Arduino IDE`，用户可以通过选择板板和端口轻松地配置所需的设置。IDE 有一个选项可以通过使用 `serial monitors` 监控来查看用户程序的健康状态。此外，IDE\
  \ 具有相关的菜单按钮，如 `verify`、`upload`、`new`、`open` 和 `save` 选项，用于自动发布命令以冲刷、打开、创建和保存程序到微控制器。\n\
  \n## 6.3 微处理器级设备：通用\n\n通常，具有微处理器级架构的边缘设备被广泛应用于若干场景中。微处理器级边缘设备包括 `Raspberry Pis`、`笔记本电脑`、`手机`等。如之前，这些设备并不具备像\
  \ Arduino 板或 ESP 那样的包含处理器、I/O、内存和其他控制器的单个芯片。\n\n边缘设备根据微处理器的类型进行分类。通常，微处理器被分为 `CISC`\
  \ 或 `RISC` 类型。`CISC` 是复杂指令集计算机；`RISC` 是精简指令集计算机。`CISC` 主要用于几类通用计算机，例如 `基于 ARM 的处理器`或\
  \ `Intel 处理器`。\n\n决定设备是否为 `CISC` 架构的关键因素是：(i) 包含多个功能的复杂指令，(ii) 可变指令大小，以及(iii) 以最小内存需求支持各种任务。相比之下，基于\
  \ `RISC` 架构的微处理器旨在提高处理资源的简单性并具有固定大小的指令。\n\n根据 `CISC` 或 `RISC` 架构，边缘计算节点有所区别。`CISC`\
  \ 架构的引入可能会增加许多应用的复杂性。然而，这些架构适用于涉及虚拟化的某些应用。这使得边缘设备能够执行容器和虚拟机管理器，因为与基于 `RISC` 的架构相比，设备的内存单元可以容纳更多指令。然而，如所示，基于\
  \ `CISC` 的微处理器可能会导致每条指令产生不同的 `CPU cycles`。`RISC` 架构则并非如此，因为其指令更简单。大多数手机属于 `RISC`\
  \ 架构，而笔记本电脑和类设备则属于 `CISC` 架构边缘设备。\n\n### 6.3.1 树莓派：示例\n\n基于 `Raspberry Pi` 的设备是最常用的边缘设备。树莓派设备支持\
  \ `RISC-V` 架构 [7]。显然，其指令比传统 PC 更简单。此外，与其它 `CISC` 资源相比，其任务执行时间很容易预测。\n\n#### 6.3.1.1\
  \ 历史\n\n事实上，`Raspberry Pi` 是于 2006 年初由剑桥大学在英国推出的。该设备的最初开发是为了丰富学生对边缘计算或边缘智能的知识。当时设计\
  \ `Raspberry Pi` 的主要目的是创建一个易于学生携带的设备。\n\n#### 6.3.1.2 演进\n\n`Raspberry Pi` 是一种可以轻松放入衬衫口袋的小设备。它可以轻松地携带或移植到不同的地理位置。它具有\
  \ 64 位的 `ARM` 处理器。传统上，它用于学习 `Python`、`Java`、`C` 等编程语言。此外，它激励了学生在不移动电脑的情况下开发多个项目。逐渐，它被认为是开发\
  \ Web 服务器、游戏解决方案、高清视频等的强大设备。最近，随着边缘 AI 的演进，该设备已成为整合学习模型和从学习模型进行推理的重要组件。\n\n####\
  \ 6.3.1.3 硬件平台\n\n`Raspberry Pi` 以快速速度开发了一系列开发板，以满足不同应用的需求。特别是，有分类为 `Raspberry Pi\
  \ Model A`、`Model B`、`Zero`、`Pi 2 Model B`、`Pi 4 Model B`、`Pi 400` 等板板。详细说明如下：\n\
  \n*   `Raspberry Pi Zero`: 该硬件是 `Raspberry Pi` 的微版本。它由 40 个 `GPIO` 引脚、一个 `micro-USB`\
  \ 端口、一个 `HDMI` 输出等组成。该设备足够凑凑容纳极简版本的组件，成本为 5 美元或左右。\n\n\n\n\n- `Raspberry Pi Model\
  \ A`: 该硬件型号被认为是传统型号。它开发于 2012 年初。这些主板具有基于 ARM 的处理器，并带有少数昂贵的模拟和数字转换器。这些板在各种扩展功能（如\
  \ `A+`、`B` 和 `pi 2`）上有明显的后续改进。\n\n- `Raspberry Pi 2`: 该硬件设备集成了基于 ARM 处理器的四核架构。该设备被认为是\
  \ 2015 年最快的口袋级单板计算机。在未来几年，USB 端口的数量以及对以太网线的支持（包括 HDMI 支持）将会增加。\n\n- `Raspberry Pi\
  \ 3`: 之前的硬件设备的一个缺点是不支持 `WiFi`、`Bluetooth`、`LoRa` 等其他通信协议。在 `Raspberry Pi 3` 中，除了板上传统接受的功能外，这些限制也得到了修正。这类板具有高达\
  \ 1.4 GHz 的高速内存和处理能力。此外，该板通过网络端口支持极高速互联网。该硬件型号出现了几个带有特定扩展的变体，如 `B` 和 `B+`。\n\n-\
  \ `Raspberry Pi 4`: `Raspberry Pi 4` 型在近年来被非常广泛的应用。开发该硬件型号的主要理念是增加小型设备的计算能力。该设备拥有海量的\
  \ RAM。它的目标是约 4 GB RAM，类似于普通的笔记本电脑。然而，使用此类主板的优势在于避免了普通机器中消耗大量电能的风扇。与其他前代产品类似，该板还具有高端\
  \ WiFi 连接、对多种通信协议的支持、千兆以太网以及其他所需的硬件端口。这块特定的主板运行在 64 位四核 ARM 处理器上。最常见的树莓派型号的详细对比见\
  \ [4]。\n\n- `Raspberry Pi 400`: `Raspberry Pi 400` 是最奇特的板卡之一，它在键盘中集成了最常用的计算和网络组件。因此，这块板被称为键盘式电脑。它将\
  \ `Raspberry Pi 4` 板集成到键盘中，以提高设备跨地理区域携带的便利性。在 `Raspberry Pi 400` 之后，出现了计算能力极高且集成了其他设施的\
  \ `Raspberry Pi 5`。\n\n### 6.3.1.4 树莓派的结构\n\n通常，一块树莓派主板由一个 5 特 USB 连接器、音频/视频接口、耳机插孔、HDMI\
  \ 端口、USB 端口、GPIO 引脚、以太网母口、显示接口、LAN 控制、系统芯片、摄像头接口和 SD 卡槽组成。这些组件被认为是构建树莓派板的主要组件。\n\
  \n图 6.2 展示了树莓派 Model 3 板的结构。该设备由 SoC、BLE 芯片组、GPIO 引脚以及其他连接器（如显示、LAN、音频/视频等）组成。\n\
  \n![Figure 6.2. Anatomy of Raspberry Pi Model 3 board. Reprinted from Buy a Raspberry\
  \ Pi 3 Model B+ – Raspberry Pi © Raspberry Pi Ltd. Published under CC BY-ND 4.0\
  \ Deed | Attribution-NoDerivs 4.0 International | Creative Commons.](img/bk978-0-7503-5593-3ch6f2_online.jpg)\n\
  \n**图 6.2.** 树莓派 Model 3 板的结构。转载自 Buy a Raspberry Pi 3 Model B+ – Raspberry Pi ©\
  \ Raspberry Pi Ltd. Published under CC BY-ND 4.0 Deed | Attribution-NoDerivs 4.0\
  \ International | Creative Commons.\n\n树莓派的基础架构包括 I/O、RAM、CPU/GPU 和一个 USB 集线器。USB\
  \ 集线器连接到其他几个 USB 端口，并具有通过连接以太网线访问互联网的能力。虽然所有这些设备都包含在块板上，但负责计算的芯片并不涉及网卡、RAM 或其他外设。\n\
  \n### 6.3.1.5 软件平台\n\n树莓派主板支持的软件平台包括编程语言、IDE、游戏和终端软件。树莓派板上最常用的编程语言是原生 `Python`、`C/C++`、`Java`、`Nodejs`、`Golang`\
  \ 和 `Ruby`。这些语言通常由最初推荐使用该设备的学生学习。\n\n官方上，树莓派使用 `Noobs` 或 `Raspbian` 操作系统启动。这些软件平台是组织进程和监控其进展的本质软件组件。此外，内存管理过程也由此类系统软件处理。\n\
  \n除了传统的操作系统外，还有一些针对用户需求定制的第三方操作系统。该系列中流行的操作系统有 `Ubuntu Mate`、`Windows 10 Core`、`RISC\
  \ OS`、`Ubuntu Core` 等。\n\n可以利用树莓派主板的一些边缘启用应用包括计算机视觉相关、基于联邦学习的任务、协作学习平台等。\n\n通常，使用树莓派创建集群。树莓派集群可以使用一堆树莓派主板开发。每块树莓派主板通过网络连接。这些网络可以连接到网络交换机，例如千兆交换机或光纤通道。\n\
  \n图 6.3 说明了使用四块树莓派主板开发树莓派集群。在图中，我们可以看到计算节点通过交换机互连。\n\n![Figure 6.3. Raspberry Pi\
  \ cluster.](img/978-0-7503-5593-3chf3.jpg)\n\n**图 6.3.** 树莓派集群。\n\n在图 6.3 中，我们可以观察到四块树莓派主板。每块树莓派主板都连接了一个\
  \ SD 卡。闪存驱动容量为 64 MB。所有五块树莓派主板通过一个网络交换机互连。该网络交换机有六个端口。\n\n### 6.4 GPU、TPU 和 FPGA：专用\n\
  \nGPU、TPU 和 FPGA 是为了满足增长的边缘启用应用需求的专用设备。开发这些专用微架构的动力由一些服务导向型公司发起，例如 `Google`、`NVIDIA`\
  \ 等。\n\nGPU 是图形处理器，作为计算设备中 CPU 的协处理器。它们最初旨在用于处理输出屏幕的计算。然而，研究人员在执行单指令多数据流（SIMD）时发现了此类处理器的重要性。通常，GPU\
  \ 利用 `CUDA cores` 并行计算多个数据点的指令。它们遵循一种独特的层次化数据处理模式。例如，某些 GPU 包含多级内存缓存以执行从 CPU 卸载的指令。在某些\
  \ GPU 上，存在数据流水线和其他架构变体，以便更快地执行任何专用应用，包括视频和音频流应用。\n\n\n\n\n\nTPU 是张量处理单元（Tensor Processing\
  \ Units），由包括 Google 在内的服务型公司开发。TPU 微架构负责执行属于机器学习领域的指令。虽然 GPU 和 TPU 被视为加速器，但 TPU\
  \ 更为专门地基于 ASIC（专用集成电路）技术进行设计，以满足机器学习或深度学习爱好者的需求。由于 TPU 专为一个应用领域设计，因此它们对于许多其他应用（包括图像处理或视频处理应用）来说并不是最优设计。TPU\
  \ 通常受限于少数特定的框架，如 `Tensorflow`。然而，TPU 的核心优势在于将加速器应用于若干即将推出的基于 AI 的边缘级应用。\n\nFPGA\
  \ 更具专业性，且专为实现定制解决方案而设计。在边缘计算系统中，与其他两种类型的加速器相比，其硬件单元具有较高的成本效益。[17] 的作者们在执行深度学习算法时比较了不同边缘级加速器的性能。\n\
  \n## 6.5 SoC，SoM，板载系统\n\n片上系统（`SoC`）、模块化系统（`SoM`）和板载系统（`SoB`）是边缘级加速器的三种芯片制造方法。采用\
  \ `SoC` 方案设计的边缘级加速器包括一个带有所有相关组件的集成电路。集成所有组件以提高计算任务加速的理念是，最小地降低的功耗。通过这种方式，电池存储容量可以显著增加。此外，它还尝试在最小的芯片足迹内缩小组件尺寸。最近，[6]\
  \ 的作者开发了一种基于多核处理器的片上系统，该系统可用于执行深度学习算法或执行边缘智能。\n\n模块化系统（`SoM`）是一种设计边缘级加速器的方法。与 `SoC`\
  \ 模型相比，`SoM` 在选择 `CPU`、`GPU`、内存、`外设`、网络端口、`传感器`等组件时更具灵活性。`SoM` 降低了设计加速器涉及的成本。这一事实背后的主要原因是应用对资源的需求有限。例如，在许多应用中，加速器可能不需要传感器。在这种情况下，最好避免在设备上安装传感器或执行器。\n\
  \n采用 `SoM` 方案设计加速器最有利的用途是根据定制应用来适配设备。值得注意的是，特定用于增加安全功能的应用可以在 `SoM` 上配备与安全相关的组件。此外，由于相关组件可以无延迟地安装，未来应用的上市时间可以显著缩短。显然，制造商可以在不具备设备硬件设计全局蓝图的情况下，对组件或组件的局部进行持续创新。\n\
  \n板载系统（`SoB`）是一种制造边缘级加速器的独特方法。正如我们观察到的，`SoC` 使芯片设计师能够将所有所需的硬件组件开发到单个芯片中；而对于考虑各种应用并在现有板上安装组件的设备设计师来说，`SoM`提供了许多机会。然而，在\
  \ `SoB` 中，整组组件被固定在单个板上，这与 `SoM` 或 `SoC` 方案不同。需要注意的是，组件可以放置在芯片之外，但必须放置在单块板上。\n\n\
  `SoB` 的主要优势是设备避免了由 `SoM` 引起的兼容性问题。这是因为诸如 `WiFi`、网络端口、`CPUs`、`TPUs` 等组件与电路板制造商属于同一自有品牌。相比之下，当组件由多个供应商设计时，硬件兼容性无法保证。在某些情况下，连接各个组件时，制造组件的质量可能会引起关注。`SoB`\
  \ 的缺点是用于用途的设备交付可能会延迟。\n\n## 6.6 边缘加速器\n\n边缘加速器是旨在提高应用处理速度的边缘设备。边缘加速器的特征列为：低功耗、计算密集型、内存密集型、带宽辅助、AI\
  \ 框架辅助、实时辅助和集成性。学习边缘加速器的特征使用户或架构师能够设计新型边缘加速器，或在边缘 AI 应用中使用边缘加速器。图 6.4 表示了考虑到市场上可用设备后识别出的边缘加速器特征。\n\
  \n![图 6.4. 边缘加速器的特征。](img/bk978-0-7503-5593-3ch6f4_online.jpg)\n\n**图 6.4.** 边缘加速器的特征。\n\
  \n### 6.6.1 低功耗\n\n过去一直努力开发适用于多个应用领域的低功耗、紧凑型边缘加速器。如 `Kneron`、`Eyeris`、`NVIDIA Tegra`、德州的\
  \ `AM5729` 以及封装 USB 盘都是边缘 AI 加速器的例子。这些设备的设计具有极低的功耗。例如，与许多其他边缘 AI 加速器相比，Intel 的 `Myriad`\
  \ 功耗小于 2 瓦 [14]。\n\n### 6.6.2 计算密集型\n\n边缘加速器旨在处理尽可能并行任务。它们参与诸如处理本地数据、快速决策、执行考虑 `SIMD`\
  \ 原则的 AI 算法等任务。在这，顶级边缘加速器制造商（如 `Intel`、`Google` 和 `AMD`）专注于执行高性能的 AI 应用。它们设计硬件以支持高水平并行。\n\
  \n### 6.6.3 内存密集型\n\n边缘加速器应该具备处理更高内存需求的能力。例如，计算机视觉应用或边缘支持型应用的内存尺寸将非常大，达到 GB 级。为了满足需求，开发边缘加速器的硬件制造商在设计时配备了足够的内存。例如，Intel\
  \ 开发了 `Movidius` 用于加速计算机视觉相关任务 [12]，内存容量为 4 GB LPDDR4。通过这种方式，设备可以轻松执行深度学习推理，即使应用使用了卷积网络。这些设备的主要特征是没有配备用于冷却设备的风扇，这显著降低了应用的功耗。\n\
  \n除了加速器，还有更大内存的边缘设备。例如，Intel 制造了 `NUC11 Enterprise Edge Compute NUC11TNH50` 设备用于执行边缘级应用，其内存尺寸高于普通机器。注意的是，`NUC\
  \ 11` 拥有约 64 GB 内存，但计算能力有限。近期已有研究探索 Intel `NUC` 类设备的性能 [3]。\n\n### 6.6.4 提高带宽\n\n\
  众所周知，在边缘支持的 IoT 应用或类似的联邦环境中，带宽可以得到提高。高效处理应用的带宽需求是此类应用的关键因素之一。如果不这样做，视频流或音频流可能会由于网络冲突的剧增而导致现有网络陷入危险。通过应用边缘加速器，预计带宽将至少翻倍。\n\
  \n\n\n\n\n与大型数据中心相比，边缘集群对网络的要求较低。此类集群可用于数据存储在受限网络域内的本地的指令计算。\n\n显然，由于应用程序网络带宽的减少，当在计算设备上执行应用程序时，涉及网络基础设施的成本将降至最低。\n\
  \n## 6.6.5 可扩展 AI 框架\n\n边缘加速器为支持 AI 的框架提供了额外功能。通常，AI 框架提供一组库或 API，以便将智能集成到应用程序中。这些框架由软件模块构建，预计具有更高的处理速度。这意味着\
  \ AI 框架必须能够通过适当的专用软件或非商业产品进行扩展。边缘加速器必须具备内置能力，能够快速地启动、执行和终止此类应用程序。\n\n## 6.6.6 实时辅助\n\
  \n实时应用的增长，以及使用使用具备实时能力的边缘 AI 加速器来解决此类应用的需求，已成为选择硬件时的关键特征。AI 设计者倾向于包含这些具备实时能力的设备以提高计算速度。事实上，已经有多个能够实时处理数据的边缘\
  \ AI 应用。值得注意的是，`[9]` 的作者展示了边缘 AI 在农场中的实时应用。作者开发了 `YOLO-tiny` 算法来检测苹果并使用包括 `Intel\
  \ Movidius` 在内的边缘级加速器计算农场的潜在产量。\n\n## 6.7 商业边缘加速器\n\n边缘加速器由多个行业和研究机构制造。最流行的边缘加速器由以下公司制造：(i)\
  \ 英特 (Intel)、ii) NVIDIA 和 (iii) 三 (Samsung)。根据 `lens.org`，这些公司截至 2023 年 10 月提交的专利数量分别为\
  \ 1742、744 和 313 个 `[8]`。\n\n### 6.7.1 基于 Intel 的边缘加速器\n\n列出了若干已应用于边缘级应用以提高计算速度的\
  \ Intel 相关产品。\n\n#### 6.7.1.1.1 Intel 核心处理器\n\n通常，传统的 Intel 核心处理器可以被开发为加速器。事实上，此类设备必须具有大量的内核，即在\
  \ 12 到 24 个内核之间的处理器。与普通的基于服务器的计算设备相比，这些处理器可以有效执行并行处理任务。此类处理器的一些示例包括 `Intel i7` 系列、`i3`\
  \ 系列等。\n\n#### 6.7.1.1.2 Intel atom 处理器\n\n在某些情况下，需要根据功耗和利用率来优化计算速度。例如，与计算机视觉任务相关的\
  \ IoT 应用（如机场、商场等地的人脸识别）不需要一整天进行计算。在夜间有特定的时间段不需要处理处理。因此，可以调整加速器以平衡电能的利用率。\n\n####\
  \ 6.7.1.1.3 Intel Movidius 处理器\n\nMovidius 处理器专门为处理视觉相关任务设计。与许多其他处理器相比，它们具有以更高速度处理深度学习相关任务的能力。开发基于\
  \ Movidius 的处理器的想法是在连接到专用设备时实现增强现实。事实上，英特尔 Movidius 处理器因其较小的尺寸和兼容的结构而受到了许多研究人员和从业者的好评。\n\
  \n#### 6.7.1.1.4 Intel Xeon 处理器\n\nIntel 一直对提高另一个名为 Intel Xeon 的处理器系列的能力感兴趣。`Intel\
  \ Xeon D` 处理器已推出市场，提供比其他处理器型号更高的性能。这些处理器能够使用本地数据集处理边缘相关任务，从而获得更高的性能。\n\n### 6.7.2\
  \ 基于 NVIDIA 的边缘加速器\n\n通常，NVIDIA 是一家开发多种硬件设备的公司，这些设备在 SIMD 计算模型中支持 CPU。他们开发的目的是使用一些辅助编程语言（如\
  \ `CUDA` 或 `OpenCL`）有效利用 GPU。当指令被卸载到这些硬件上，这些硬件作为 CPU 的协处理器。事实上，有若干向量指令在这些硬件单元上执行。\n\
  \n大多数倾向于边缘级加速的 NVIDIA 产品分为三大类：(i) 核心加速器、(ii) Jetson 系列加速器和 (iii) 5G 专用加速器。此类用于执行边缘级计算的加速器的重要特征如下所示。\n\
  \n#### 6.7.2.1 核心加速器\n\n核心加速器是集成到笔记本电脑、工作站和一些计算节点等边缘基础设备中的普通 NVIDIA GPU 卡。这些加速器是通用的，用于为\
  \ CPU 计算具有更高处理速度的向量化指令。通常，这些加速器具有超过 256 个 GPU 核心，用于计算并行任务的数据。与 CPU 需要 `n` 个计算周期相比，每条向量指令在一个计算周期内即可执行。NVIDIA\
  \ 设备的一些示例包括 `NVIDIA Quadro P4000`、`NVIDIA Quadro T1000` 等。\n\n#### 6.7.2.2 Jetson\
  \ 系列加速器\n\n随着嵌入式领域的进展，NVIDIA 引入了 `Jetson Nano` 系列以提高应用程序的能效。NVIDIA Jetson Nano 系列分为以下部分：\n\
  \n*   Jetson AGX Orin 系列：Jetson AGX Orin 系列是一种片上系统（SoC）设计架构 `[15]`。为此设计的板为向量指令提供约\
  \ 275 TOPS 的计算速度。设备能够使用超过 64 GB 的内存处理大量数据。设备的功率在执行应用程序时可以在 15 W 到 60 W 之间变化。\n\n\
  *   Jetson Orin NX 系列：与其它 AGX Orin 系列相比，Jetson Orin NX 系列具有极小的设备空间。然而，其计算能力并不等同于前者。例如，名为“Jetson\
  \ Orin NX 嵌入式和边缘系统 AI 开发套件”的设备仅计算 100 TOPS。这比之前提到的系列少 2.75 倍。此外，内存容量限制为 16 GB。该机器的主要优势是功率较低，与之前的系列相比约为\
  \ 10–25 W。\n\n*   Jetson Orin Nano 系列：由于成本因素，大多数 AI 开发者倾向于使用尚未达到生产级别的设备开发应用程序。考虑到研究人员的需求，NVIDIA\
  \ 开发了价格优惠的 NVIDIA Jetson Orin Nano 设备。它可以提供超过 40 TOPS 的 AI 指令操作，并支持从原型到产品化阶段的广泛\
  \ AI 相关应用。凭借 8 GB 内存和若干个基于 ARM 的处理器，该设备在开发原型方案时可以轻松执行高能效的计算。然而，Jetson Nano 系列还有其他具有超过\
  \ 64 GB 内存和 SSD 的型号，用于可视化生产就绪的 AI 兼容边缘加速器设备。\n\n\n\n\n\n-   **Jetson AGX Xavier\
  \ 系列**：英伟达（NVIDIA）现代 Jetson AGX Xavier 系列模型在尺寸和计算能力方面表现优于工作站。它的设计尺寸更小，接近 100 x 87\
  \ 毫米。这意味着该设备可以固定在任何较小的便携设备中，并以每秒 32 万亿次运算的速度进行本地处理。Xavier 系列的主要优势在于它能够并行处理与传感器节点相对应的独立数据。\n\
  -   **Jetson TX2 系列**：在本书编写期间，Jetson TX2 系列被认为是最快的边缘加速器。它采用了一个低功耗的 7.5 W 模块，用于在边缘节点上承担\
  \ AI 相关的任务。同样，由于包含超过 256 个 CUDA 核心和 8 GB 的内存空间，该设备可以在短时间内完成许多向量运算。\n\n### 6.7.3\
  \ 基于三星的加速器\n\n三星被认为是嵌入式设备的领先贡献者。他们通过为内存技术提供创新，开发了嵌入式解决方案，以增强边缘级的计算能力 [10]。改进边缘级设备加速的主要贡献分为两类：(i)\
  \ 存内计算（PIM）类和 (ii) 存近计算（PNM）类。前者确保计算发生在内存块中更靠近数据的地方，而后者则发生在内存块之外。前者的优势是避免了数据在内存单元和处理元素之间的来回移动。然而，在后的方法中，计算设备与内存单元之间会发生大量的数据移动。\n\
  \n此外，三星与其他行业合作以实现边缘级加速器的益处。例如，三星与中国公司百度合作开发了一种边缘级 AI 加速器。名为 `KUNLUN` 的芯片具有 14 纳米处理器和专门的神经网络架构。该芯片能以每秒\
  \ 260 万亿次运算的速度处理数据，功耗为 150 W。同样，它与处理器制造商 AMD 公司（AMD Inc.）合作，将存内技术整合到 AMD 处理器中。这一合作的成果诞生了名为\
  \ `AMD Mi100` 的加速器。\n\n### 6.8 示例与用例\n\n本节解释了用于执行边缘能力应用的加速器的应用。这些加速器是为特殊目的设计的，例如：(i)\
  \ 加速深度学习任务和 (ii) 加速基于音频/视频的流。\n\n#### 6.8.1 用于 CNN 的加速器\n\n`CNNs` 是卷积神经网络，用于执行图像识别或检测相关的任务。`CNNs`\
  \ 通过识别图像中的模式来模仿人类大脑。`CNNs` 由多个层组成，如`convolutional layer`卷积层、`pooling layer`池化层和\
  \ `fully connected layer`全连接层。`convolutional layer` 负责捕捉图像特征。通常，`CNNs` 中有几层卷积层。`pooling\
  \ layer` 通过最小化参数数量来执行特征捕捉。而 `CNNs` 的 `fully connected layer` 则根据激活函数对对象进行分类。加速器在处理\
  \ `CNNs` 时起着关键作用 [2]。过去曾努力研究在加速器上执行 `CNNs` 层时的加速器性能。同样，过去也有案例研究来学习此类加速器执行类似深度学习相关应用时的特性。Google\
  \ 团队在近期对比研究了不同的边缘 AI 微架构（如 `Jetson Nano` 及其变体）的性能 [1]。根据他们的说法，加速器在执行基于 CNN 的应用时，在某些微架构中表现出极低的延迟。\n\
  \n#### 6.8.2 用于音频的加速器\n\n已经存在侧重于通过 AI 加速器提高音频感知质量的实际实现。例如，`Expera Timbre` 被作为一种音频推理引擎开发出来。该设备包含一个边缘能力的加速器，能够在低于\
  \ 300 微瓦的情况下运行所有相关的音频功能。该设备使统一的计算架构以极低的延迟提高应用程序的音频质量。此外，为了提高性能，该加速器包含了存内系统，使得数据处理速度比音频更快。这样，加速器为许多基于音频的应用铺平了道路\
  \ [19]。\n\n### 6.9 结论\n\n学习或推理利用边缘节点来执行边缘智能。然而，理解可能集成到应用程序中的潜在边缘级设备至关重要。本章揭示了一些边缘设备，重点关注如\
  \ `ESPs` 等微控制器和如 `Raspberry Pis` 等微处理器。文中讨论了利用 `Jetson Nano` 等边缘加速器的重要性；此外，描述了将商业边缘加速器应用于边缘\
  \ AI 应用的优缺点。\n\n### 参考文献\n\n[1] Seshadri K K, Yazdanbakhsh A and Akin B 2021 Accelerators\
