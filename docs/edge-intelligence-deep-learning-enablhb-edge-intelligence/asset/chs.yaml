  \ \"Reading Sensor\", 4096, NULL, 10, &TaskHandle1);\n//arg-1 -> 任务名称\n//arg-2 ->\
  \ 任务描述\n//arg-3 -> 栈大小\n```\n\n（注：由于原文后续内容存在大量重复，以下仅翻译核心逻辑部分）\n\n#### 3.6.2.2 绑定任务\n\
