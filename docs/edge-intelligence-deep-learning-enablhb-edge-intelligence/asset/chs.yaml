  \ Benedict\n\n***\n\n# 第 5 章\n\n## 推理/预测技术\n\n边缘智能包含推理或预测步骤，以对数据进行推理。上一章研究了支持边缘的学习方法。然而，从经过训练的数据集中推断数据的可能方法，对于边缘支持的应用也同样重要，因为这些方法必须处理实时数据。本章揭示了边缘\
  \ AI 应用中实践的各种推理和预测技术。它提出了在此类边缘 AI 应用中采用的各种分布式推理相关实施策略。\n\n### 5.1 学习阶段\n\n为了从学习模型中推断或预测实时数据，机器学习中需要执行若干步骤。它们列如下：\n\
  \n1. **数据预处理**：这是从各种格式的原始数据中处理成数据的过程。原始数据可以是视频、音频、文本或图像。有时，原始数据包含噪声数据，需要将其删除或告知用户，以便做出准确预测。\n\
  \n   为了进行数据预处理，在不同的机器学习相关框架中有许多现成的库。例如，Python 库如 `numpy` 就可以从原始数据中过滤噪声。通常，数据以 `CSV`\
  \ 文件格式或文本文件格式输入到学习系统中。\n\n   指定原始数据所在的文件夹或实时数据到达的位置也是重要的。一些 IDE，如 `Anaconda` 或 `Spyder`。\n\
  \n2. **加载模型**：以去中心化或中心化的方式加载学习模型。有时，加载模型时会遇到内存限制、格式兼容性问题等。\n\n3. **变量识别**：开发机器学习算法的目的是对现有情况进行描述。为了做到这一点，需要从预处理的数据中识别可能的变量。这在机器学习背景下包含因变量和自变量。例如，如果根据皮肤纹理判断人的年龄，这被称为自变量。这是对输出产生影响的。输出可以被确定为分类值或预测值。分类值具有某些预定义值或类别，而预测值可能具有任何值。此外，在创建数学模型时，推理阶段需要从预处理的数据中提取变量。\n\
  \n4. **数据后处理**：接下来，需要以用户友好的方式处理预测值，以便使用户获得更多见解。如果结果处理得当，也可以评估学习模型的能力。\n\n一旦创建了模型，就可以对数据进行推理或预测。推理用于分析数据；预测用于生成新数据。通常，使用准确率、假阳性、真阳性等指标对推理进行评估，以便相应做出建议。\n\
  \n### 5.2 推理知识水平\n\n基于测试真实数据的学习模型输出受多种知识方案的影响。广而言，学习水平分为 (i) 描述性 (ii) 诊断性 (iii)\
  \ 发现 (iv) 预测 (v) 规范性。从这些类别中获得的推理适用于多种应用程序。有关这五个类别的信息在后续小节中。\n\n#### 5.2.1.1 描述性\n\
  \n在天气报道或新闻报道等边缘 AI 应用中，需要描述由传感器评估的信息。例如，根据气象站的`温度`、`湿度`、`光强`等数据，可以描述地理区域的气候。\n\n\
  在这个水平上，从数据获取信息没有新颖性。然而，描述性推理试图根据数据描述发生了什么。\n\n\n\n\n#### 5.2.1.3 发现层 (Discovery\
  \ level)\n\n在边缘 AI 推理系统的发现层，从海量数据中识别出新的原因。这种方法对数据具有更深洞察力，数据通常是海量的。原因的生成不仅基于现有的见解，还基于新构建的知识推理。显然，它有能力指出数据中许多现有利益相关者所未知的原因。\n\
  \n#### 5.2.1.4 预测层 (Predictive level)\n\n在大多数边缘 AI 应用中，需要建议新的输出结果，而不是提及数值的根源或关于感知信息的描述性信息。这种层级的推理可以根据领域内的先前数据提供新的输出值。例如，天气预报应用可以按小时或未来每天建议即将发生的天气状况。\n\
  \n知识推理的预测层结合了历史数据和学习算法描述的规则来推导未来的结果。未来的结果通常分为两类：分类和预测。这一层引发了一个常见问题：根据特定的预测算法，近期未来可能会发生什么。\n\
  \n#### 5.2.1.5 启发层 (Prescriptive level)\n\n启发层推理比之前的述方法更具知识性。在这种类别中，该方法为预测提供了原因，而不仅仅是提供几个可能的未来预测。显然，它优于预测层推理，因为用户可以获得机器关于建议数值原因的提示。\n\
  \n此外，系统可以在此类别下进行开发，以建议多个决策选项并给出选择这些选项的适当理由。通过这样，用户有更大的自由来选择机器提供的最佳建议。[1]] 的作者在机器学习\
  \ ML 文档中应用启发式学习方法时，开发了一种与描述相比的、用于创建新系统的启发式方法。\n\n图 5.1 展示了机器学习问题推理阶段中区分的关键学习层。\n\
  \n![图 5.1. 推理层：基于知识的区分。](img/bk978-0-7503-5593-3ch5f1_online.jpg)\n\n**图 5.1.**\
  \ 推理层：基于知识的区分。\n\n### 5.3 分布式推理 (Distributed inferences)\n\n边缘 AI 应用中的推理被分布到多个计算节点上。对于某些可扩展应用，计算节点在地理上跨越多个区域和大陆。众所周知，数据无法传输到云端或云相关的服务器来执行学习任务或推理。显然，分布式推理是此类边缘\
  \ AI 应用的强制要求。\n\n在图 5.2 中，详细讨论了过去研究实践的分布式推理技术的可能类型。\n\n![图 5.2. 分布式推理的类型。](img/bk978-0-7503-5593-3ch5f2_online.jpg)\n\
  \n**图 5.2.** 分布式推理的类型。\n\n分布式推理通常在边缘 AI 应用中进行，重点是通过多种方式提高学习准确性和资源利用。下面讨论了最广泛使用的解决方案。\n\
  \n#### 5.3.1 协作推理技术 (Cooperative inference technique)\n\n协作推理技术利用边缘-雾-云计算体系来执行 `DNN`\
  \ 推理。通常，协作推理机制利用主从计算平台，使得学习任务根据不同的学习指标或性能指标非自主地分布在多个节点上。协作推理系统侧重于考虑边缘节点轻量化特征和异构性的情况下将任务划分到参与节点中。为分布式推理开发的几种划分技术在第\
  \ 5.6 节中讨论。在 [9]]，作者研究了设计协作推理机制时应用鲁棒通信技术的要素。\n\n#### 5.3.2 协同推理技术 (Collaborative\
  \ inference technique)\n\n协同推理技术是分布式学习过程中单个参与节点（包括边缘节点）的自愿决定。协同推理涉及边缘-云、边缘-雾、雾-云和边缘-边缘计算节点。在某些应用中，边缘节点与几个云节点共同促进学习过程\
  \ [5]]。由于需要防止用户之间的隐私问题，这种方法近年来已成为一种常用程序。\n\n在边缘-雾协同推理机制中，边缘集群和雾集群的设备联合执行推理。雾集群的参与加速了靠近市中心或工厂车间边缘级集群的推理决策。在边缘-雾-云计算体系中采用的一些加速技术在第\
  \ 5.7 节中讨论。在雾和云节点之间执行协同推理并不常见。然而，将雾和云纳入推理的动机是在做出决策之前需要处理大量数据。\n\n由于在许多情况下学习算法在基于边缘的异构节点上执行，边缘-边缘协作是必要的。此外，与云实例相比，并非所有边缘设备全年供电。在某些情况下，设备可能会被关闭或忙于其他用户任务。显然，这些任务必须卸载到可用节点。\n\
  \n#### 5.3.3 实时推理技术 (Real-time inference technique)\n\n某些边缘 AI 应用对执行时间敏感。此外，在医疗保健或网络安全相关的推理任务中，推理情况可能持续小于\
  \ 1 毫秒。\n\n例如，一个需要观察人类情感并防止罪犯实施犯罪的应用涉及几个阶段：\n\n1.  **视频采集**：使用摄像头从不同位置实时采集视频。由于技术的改进，采集视频的硬件单元变得廉价。摄像头将数据流到边缘节点进行处理。此外，一些摄像头单元带有用于过滤和增强视频数据的边缘处理器。\n\
  2.  **成帧**：成帧是视频流应用中的步骤，用于检测或分割对象。成帧处理视频的宽高比，例如宽屏帧、标准帧和方形帧。这些帧的典型尺寸分别为 16:9、4:3\
  \ 和 1:1。根据帧的组成，图像质量不同。这是因为帧中包含了对象。例如，犯罪检测应用期望成帧过程产生的图像必须包含罪犯信息。\n3.  **图像分析**：检测欺诈图像至关重要。此外还有犯罪原因。显然，需要深度学习辅助学习模型来评估图像和犯罪场景。观察人类情感以检测其犯罪行为的关键任务之一是人脸识别任务。分析将根据采集视频的帧实时进行。\n\
  \n#### 5.3.4 指标导向的分布式推理 (Metric-oriented distributed inferences)\n\n\n\n\n\n分布式推理技术根据监控指标将流水线任务（pipelined\
  \ tasks）分布在计算节点上。边缘 AI 应用可以以数据流水线或工作流的形式存在。此类边缘 AI 应用的子任务通常会被被卸载到分布式节点上。在任务卸载的过程中，根据实测的指标（如任务执行时间、任务能耗、模型实现的学习准确率、边缘集群的可用性等）进行卸载是更好的选择。通过这种任务分发，可以实现对推理的公平对待。\n\
  \n#### 5.3.5 资源/任务调度\n\n被引入边缘 AI 文献的极少数传统方法之一是调度算法的应用。有几种传统的调度算法，例如先来先服务 (`FCFS`)、最早截止优先\
  \ (`EDF`)、后进先出等。此外，还有一些基于自然的元启发式算法，如粒子群优化 (`PSO`)、遗传算法 (`GA`)、蚁群算法 (`ACO`)、智能水滴算法\
  \ (`IWDA`)、蜜蜂算法 (`HBA`)等。\n\n在边缘 AI 应用的推理系统或框架中引入调度算法的主要目的，是在考虑网络拥塞、硬件单元能效、资源能力等因素的情况下，以协作的方式优化资源共享。\n\
  \n### 5.4 分布式推理：实现策略\n\n分布式推理通过多种方法实现，以增强传感器、执行器和计算节点。现有的实现在软件和硬件解决方案的辅助下表现出色。在过去，研究人员已经通过三大类方法实现了分布式推理（参见图\
  \ 5.3）：轻量级实现、基于 FPGA 的硬件级实现以及客户端-服务器解决方案。\n\n![图 5.3. 边缘 AI 中的三种不同的实现策略](img/bk978-0-7503-5593-3ch5f3_online.jpg)\n\
  \n**图 5.3.** 边缘 AI 中的三种不同的实现策略。\n\n#### 5.4.1 轻量级实现\n\n在大多数情况下，考虑到受限资源的能力，边缘 AI\
  \ 应用是以轻量级的方法开发的。例如，过去考虑到更小的支持 IoT 的边缘设备，已经开发了许多轻量级加密算法。\n\n许多研究人员专注于以轻量级的方式实现边缘\
  \ AI 应用，并考虑实现中涉及的成本效益。在云端服务器上执行 DNN 算法与利用廉价的边缘级树莓派集群相比，成本将极高。显然，轻量级实现提升了边缘级节点执行边缘\
  \ AI 应用的效用。\n\n轻量级实现已经在几个方面引入：(a) 容器方法，(b) 微服务方法和 (c) 无服务器（serverless）方法。\n\n####\
  \ 5.4.1.1 容器方法\n\n服务器的容器级实现是服务器的轻量级实现。使用虚拟机管理器（hypervisors）在裸机服务器上实现虚拟化由于实现过于笨重，其扩展性较差。相比之下，轻量级容器在任何主机操作系统（如\
  \ `Ubuntu`）上对服务器组件虚拟化。这使得开发者能够使用 `cgroups` 和 `namespaces` 这两个构建块快速创建容器。\n\nLinux\
  \ 内核的 `cgroups` 限制底层资源的利用。例如，内存 cgroups 根据配置将容器的内存使用限制为 `1 GB` 或 `512 MB`。同样，`cpu-set`\
  \ cgroups 限制容器仅使用指定的 CPU，尽管主机操作系统可以查看所有可用 CPU。\n\nLinux 内核的 `namespaces` 限制了容器下注册的资源组件的视图。此功能为容器提供了新的视图，使用户可以感觉自己像是在一台新机器上操作。例如，`namespaces`为新开发的容器提供了从\
  \ `PID 1` 开始的新进程 ID。\n\n`Docker` 容器是容器的专门化实现，它们在创建时考虑了冗余容器的联合文件系统，即：如果公共 `Docker`\
  \ 引擎基上上有足够的组件，则创建容器时不会包含所有如库和内核在内的软件组件。\n\n使用宿托管在边缘级节点（包括树莓派集群或 Jetson Nano 节点）上的容器执行分布式推理，是若干边缘\
  \ AI 应用中的常见做法。许多研究人员利用本地网络将多个树莓派聚类，并在 `Kubernetes` 集群之上的这些连接容器的 Pod 上托管推理相关的 `Docker`\
  \ 容器，以实现可扩展的轻量级实现。\n\n#### 5.4.1.2 微服务方法\n\n分布式推理可以基于微服务的风格实现。在这里，可以使用可选的多种语言开发多个松耦合的轻量级服务，并在边缘\
  \ AI 应用的执行期间发现它们。在微服务架构风格中实现分布式推理的主要优势如下：\n\n1. **分布式开发**：基于微服务的分布式推理架构实现允许不同的开发者独立开发服务，而无需对功能任务有任何依赖。相比之下，单体服务可能要求团队必须密切关注同伴，以理解通过单段代码设置的更新。\n\
  2. **及时交付**：由于功能上的自由，可以根据团队成员的能力独立开发服务。例如，如果开发者精通 `Java`，则可以使用 `Java` 专家开发推理相关服务。同样，如果另一个团队精通\
  \ `Node.js`，可以使用 `Node.js` 专家并行开发任务。因此，交付推理任务的时间将比任何单体服务开发都快。\n3. **可用性**：与其他单体服务相比，微服务实现可以被多个应用程序重复利用。相同的实现可以作为单独实例访问，以标记多个应用程序的独立性。\n\
  \n#### 5.4.1.3 无服务器方法\n\n除了微服务之外，还有尝试将边缘 AI 应用的分布式推理实现为无服务器实例。通常，无服务器架构确保服务器实例在运行时被组织以执行边缘\
  \ AI 应用。这意味着服务器实例可能处于关闭状态或未分配给任务。无服务器架构通常由云提供商维护。如 `AWS Lambda`、`Google Functions`、`OpenWhisk`\
  \ 等框架在执行无服务器任务方面起了关重要的作用。\n\n由于执行环境的优势，近年来尝试在边缘集群上实现无服务器框架。通常，无服务器架构鼓励快速部署边缘 AI\
  \ 应用，而没有许多管理障碍。例如，设置容器和安装所需的软件包一直被认为是应用程序开发者的合理开销。在无服务器架构中，应用程序开发者可以专注于实现其逻辑，而不是设置开销。此外，它鼓励应用程序开发者避开传统设置中经常发生的各种网络故障情况。\n\
  \n\n\n\n无服务器架构通常与事件驱动编程框架相结合。这一特性极大地降低了运行边缘 AI 应用的成本。事件驱动编程具有触发边缘集群上服务器实例实例化，或开启边缘设备以学习感应数据的选项。它还可用于触发用于数据推理的实例。通过这种方式，事件是根据传感器数据或执行器信号触发的，而这些信号在某些边缘\
  \ AI 应用中并不频繁。\n\n#### 5.4.2 基于 FPGA 的实现\n\nFPGA 已被应用于边缘 AI ，以便以有限的功耗加速计算和推理速度。这是因为在支持\
  \ FPGA 的边缘 AI 应用中，实现了指令或功能模块的独立执行。FPGA 可以将内存、`CPU` 以及所需的 I/O 芯片组集成在单个设备上。它们通常被实现为安装所有相关组件的单一设备单元。\n\
  \n事实上，FPGA 实现分为几个阶段，包括硬件定制、软件映射和执行。硬件设置自定义是 FPGA 架构中的关键步骤之一，因为可以对硬件单元进行配置，使数据推理连接到自定义的应用领域。此外，由于提高性能的必要性，软件映射被认为是与硬件定制同样重要的特性。在边缘\
  \ AI 应用中，将学习的模型映射到 FPGA 相关的硬件单元至关重要。\n\n基于 FPGA 的边缘 AI 应用开发中最挑战性的工作是具备 FPGA 技能知识。工程师不仅需要硬件知识，还需要理解边缘\
  \ AI 软件和学习模型调优能力的强大技能。事实上，这种广泛的知识在现代工程师或学生群体中并不常见。因此，基于 FPGA 的边缘 AI 应用开发局限于少数研究人员群体。\n\
  \n## 5.4.3 客户端-服务器实现\n\n实现边缘 AI 应用分布式推理的更通用方法是遵循主从架构。基于客户端-服务器架构的实现与之前的其他方法相比若干优势。值得注意的是，它们是相对简单的实现方法。由于在这些实现中客户端和服务器的数量是预知的，节点和软件组件易于管理和交付任务。分布式推理系统中客户端和服务器的管理可以统一控制。显然，我们可以有效地处理监控系统，并集中处理可能出现的任何问题。\n\
  \n图 5.4 展示了涉及执行边缘 AI 应用的不同类型硬件的三种不同实现策略。\n\n![Figure 5.4. 边缘 AI 推理中的划分策略。](img/bk978-0-7503-5593-3ch5f4_online.jpg)\n\
  \n**图 5.4.** 边缘 AI 推理中的划分策略。\n\n## 5.5 交互式与批处理推理\n\n分布式推理或预测通常以两种不同的运行模式进行，称为交互式推理和批处理推理。这些模式代表了预测算法根据应用程序的特定输入产生的结果。\n\
  \n### 5.5.1.1 交互式推理\n\n使用实时数据一次创建一个输入的创建推理被称为交互式推理。交互式推理可以集成到在线系统中，使用户可以从浏览器功能中实时受益。推理根据用户交付的请求开发。\n\
  \n### 5.5.1.2 批处理推理\n\n批处理推理是一种实验模式，对批量输入进行预测。某些应用程序不需要立即响应。这样做可以在执行前对离线数据进行预处理。通常，批处理推理利用强大的大数据技术来处理数据。例如，可以使用\
  \ `MPI` 或 `Spark` 编程模型来深层推理。\n\n[13] 的作者开发了一种允许批处理推理的多出口学习模型。然而，批处理推理的主要缺点是存在巨大的等待时间。此外，对巨大的存储空间有需求。\n\
  \n## 5.6 分划分分布式推理\n\nDNN 工作负载中的分布式推理被划分为若干块。其目的是提高机器的效用、降低延迟并扩展计算。图 5.4 显示了在执行边缘\
  \ AI 应用时经常使用的划分策略列表。\n\n### 5.6.1 DNN 推理划分\n\nDNN 推理划分是一种简单的方法。在这里，DNN 推理模型被划分为更小的计算任务。划分（推理相关任务）的核心思想是提高计算速度\
  \ [3]。接下来，考虑到计算能力的需求，将任务分配到异构计算节点上，如 `FPGAs`、`ESPs`、加速器、基于 `CPU` 的服务器机器等。大多数属于边缘网络的设备通常被考虑用于执行划分任务。\n\
  \n#### 5.6.2 实时划分\n\nDNN 推理负载可以在启动应用程序之前进行离线划分，也可以进行实时划分。离线划分意味着需要划分的 DNN 层和任务（包括数据）将根据网络带宽、设备异构性、计算能力等因素预先决定。在启动任务执行后，划分不再修改。通过这种方式，离线划分无法适应变化的环境。划分架构师或边缘\
  \ AI 应用开发者必须预先考虑所有方面，敏锐地分配任务。\n\n\n\n相比之下，实时划分在划分任务时会考虑决策的及时性。边缘集群内部或从边缘到云端的路径的网络带宽是不断变化的；存储容量随时间推移而不同；异构网络的计算权限或策略根据节点能力而异；边缘节点上的资源可用性存在差异；而利用计算节点的成本预算则根据基础设施提供商而变化。显而易见，划分需要考虑所有这些不同的因素。\n\
  \n在过去，研究人员已经开发了各种框架和平台，能够自动对 DNN 工作负载（包括推理负载）进行实时编排。\n\n#### 5.6.3 水平划分\n\n在水平划分中，DNN\
  \ 层在水平方向上进行划分，并考虑了更深层的推理层数。发生划分的该层被称为 `cut layer`（切分层）。过去，从业者使用单一的 `cut layer` 将推理层划分为两个部分。`cut\
  \ layer` 之前的计算和后期的阶段在不同的网络化边缘节点上进行独立处理。\n\n#### 5.6.4 竖向划分\n\n在竖向划分中，整个推理层被分成若干部分。这导致了更高层次的模型并行，可以在多个计算节点（包括边缘级节点）上执行。竖向划分也称为多级划分。\n\
  \n如果划分导致 DNN 推理中出现多个 `cut layers`，则该机制被称为微拆划分（micro-split partitioning）。微拆划分为计算开销较低的小型设备提供了更小的计算单元。然而，这种方法需要\
  \ `Gbps` 级的更快速网络，以在在推理层之间传输计算结果时满足预期的传输延迟需求。\n\n#### 5.6.5 随机划分\n\n在随机推理划分方案中，考虑了层推理划分的统计特性。通常情况下，推理处理速度根据不同的工作环境或异构性考量而不同。因此，划分根据推理能力分布在多个计算机器上，并在划分层时考虑了计算能力的随机性。\n\
  \n划分的数量和层数依赖于所分配的计算节点，例如 `Jetson Nano` 或其他廉价的处理器元件。图 5.5 阐述了慢推理和快推理的概念，其中训练层的数量根据推理速度而异。\n\
  \n![图 5.5 深度学习算法中层的随机划分。](img/bk978-0-7503-5593-3ch5f5_online.jpg)\n\n**图 5.5.**\
  \ 深度学习算法中层的随机划分。\n\n### 5.7 加速分布式推理：策略\n\n边缘 AI 应用的 DNN 推理必须使用复杂的技术进行加速。采用加速的主要目标是提高推理任务的性能。在许多支持边缘的应用中，加速因素取决于缓解不同计算能力设备之间的传输延迟，即在执行推理时需要平衡快机器和慢机器。\n\
  \n研究人员在近期内开发了一系列技术，以缩短应用程序的推理时间。值得注意的是，通过实践 DNN 的早退出（early exit）、使用边缘级加速器以及自适应地最小化隐藏层之间的传输延迟是过去采用的一些技术。以下小节解释了通过执行几种加速策略来缩短应用推理时间的方法。\n\
  \n#### 5.7.1 硬件和软件层面\n\n近期制造了许多硬件设备。值得注意的是，如 `Intel`、`AMD`、`NVIDIA`、`Samsung` 等设备，以及\
  \ `Google` 的 `TPUs`、`FPGAs` 和 `GPUs`，推动了受限设备的实现。关于不同设备的更详细信息在章节 6 中讨论。\n\n除了硬件辅助外，还开发了软件解决方案来加速\
  \ DNN 推理。这些解决方案被设计为自动化工具、库和中间件。\n\n##### 5.7.1.1 自动化工具\n\n自动化工具是无需人工干预即可加速推理的软件部分。这些工具与边缘\
  \ AI 应用连接，将神经层卸载到相关设备上。\n\n##### 5.7.1.2 库\n\n这些是集成到边缘 AI 应用中的持久软件组件。`APIs` 作为这些库的接口，应用程序开发者可以使用它们将推理相关任务分配到相应的节点。这些库是协作式或独立的。\n\
  \n##### 5.7.1.3 驱动程序\n\n在某些情况下，DNN 推理的加速需要调整非标准的受限设备。这意味着需要一些软件组件来影响此类受限设备的操作系统。可以通过更改\
  \ `driver` 特性来微调加速器以提高性能。\n\n##### 5.7.1.4 中间件\n\n基于中间件的软件解决方案能够在执行 DNN 推理时识别合适的加速器。中间件通过在其操作系统之上提供加速服务来连接多个异构计算机器。事实上，加速器默认并没有中间件组件。因此，提供此类服务的解决方案被称为中间件解决方案。\n\
  \n#### 5.7.2 知识蒸馏\n\n知识蒸馏是将知识从复杂模型迁移到较小模型的过程。它是边缘设备加速学习或推理能力的适当方法。在知识蒸馏方法中，模型被蒸馏或压缩，使得小型设备比传统的推理方式更快地训练和推理。知识蒸馏也称为教师学生模型。教师已经学习了多年概念，但学生以组织的方式从教师那里收集一些细节来学习概念并产生结果。这种学生从教师处学习的方法被称为静态知识蒸馏。\n\
  \n知识蒸馏方法允许轻量级算法实现，可以在轻量级计算机器或电池供电设备执行。10 的作者提出了一种动态知识蒸馏方法，教师网络根据学生网络共享的输入不断更新知识。\n\
  \n\n\n\n提高边缘 AI 应用推理时间的一种方法是为 DNN 算法的推理部分创建并行实现。通常情况下，DNN 算法的训练模型需要对新数据进行推理以做出决策。由于需要考虑较慢的机器和电池供电的异构设备，在支持边缘的机器上从训练模型中推断新数据是复杂的。\n\
  \n并行实现通常在轻量级容器中实现。为了尽可能地减少推理时间，通过改变存储单元、学习精度和推理参数，调整 DNN 模型以提供从低速到高速的实现方案。\n\n##\
  \ 5.7.4 自适应推理方法\n\n提高边缘支持的 DNN 应用推理时间的另一种方法是提供一种自适应方法。例如，考虑到推理时间和预测准确性，可以在早期阶段停止层级的执行。这种概念在\
  \ DNN 中被称为“早退出”（early exiting）。然而，根据可用资源和预测新值所需的时间，推理任务可以随着时间的推移自适应地增加。\n\n在 `[6]`\
  \ 中，作者开发了一种自适应 RESNET 算法，该算法在资源受限的边缘集群上执行时，能够最小化推理系统的延迟和准确性。作者在处理 RESNET 算法中的自适应推理阶段应用了多目标优化步骤。\n\
  \n许多研究人员为 DNN 设计了自适应推理机制，其中隐藏层的传输延迟使用计算能力强大的加速器进行了自适应修改 `[11]`。这种方法跟踪了位于边缘节点不同计算机器的隐藏层之间的传输数据。其他研究人员以自适应的方式调整了\
  \ DNN 的早退出阶段，以便在过程中准确地处理推理 `[7]`。\n\n#### 5.7.5 模型压缩\n\n如果能将大模型有效地从计算能力强大的节点传输到任何邻近节点，边缘支持的云连续体推理就可以得到改进。通常，在强大的边缘集群中创建的模型在传输到另一个邻近边缘集群时，需要更大的存储空间和网络带宽。\n\
  \n事实上，在所有边缘集群上生成学习模型进行推理并不是一个好的选择。相反，迁移学习为传输知识以实现简单推理铺平了道路。然而，这些学习模型必须经过压缩以避免冗长的通信。在\
  \ `[4]` 中，作者提出使用基于 FPGA 的加速器应用于模型压缩技术，以减少推理所需的能量和时间。\n\n## 5.7.6 推理缓存\n\n当推理在第一次出现时被缓存，可以加速。在许多边缘支持的\
  \ IoT 应用中，推理按照特定的模式重复。例如，用户可能会在一天的特定时段（主要是早晨）频繁使用医疗应用程序。这提醒了底层资源（包括边缘 AI 推理引擎）缓存训练模型以为推理提供更新的数据。通过这种方式，缓存的推理可以为应用提供更好的性能。\n\
  \n在边缘服务器上缓存多个训练模型是一项挑战。底层资源（包括边缘 AI 推理引擎）缓存训练模型以为推理提供更新的数据。通过这种方式，缓存的推理可以为应用提供更好的性能。\n\
  \n（注：原文此处存在大量重复的段落，已根据高级文档工程师规范进行去重处理）\n\n#### 5.7.7 卸载\n\n推理的算法部分可以卸载到云端或强大的实例，以最小化计算时间。边缘卸载为缓存等铺平了道路。例如，`[2]`\
  \ 的作者开发了一种无奖励算法。\n\n在文献中，卸载通过多种方式实现：(a) 自适应卸载，(b) 基于指标的卸载以及 (c) 源感知卸载。\n\n### 5.7.7.1\
  \ 自适应卸载\n\n考虑到在规定限制内完成推理或训练的需求，推理相关的任务被卸载。由于设备能力的限制，卸载的自适应性质被许多许多应用。例如，`[12]` 的作者在开发联邦学习并使用几个资源受限的边缘节点交付推理时，设计了一个名为\
  \ `FedAdapt` 的自适应卸载框架。\n\n### 5.7.7.2 基于指标的卸载\n\n在这种方法中，在卸载到合适的计算节点时会考虑一些性能指标。在决定卸载时考虑的最常用的性能指标是能量消耗、电池使用情况、完成时间、延迟、存储需求和带宽使用。如果重点是最小化推理的能量消耗，则卸载过程应将计算受限制在较慢且无风扇的边缘设备上。\n\
  \n### 5.7.7.3 源感知卸载\n\n事实上，将推理相关的任务卸载到没有足够的加速器或不满足计算目标的网络或边缘集群是无法解决问题的。在源感知卸载方法中，卸载取决于能力的检查。例如，将任务卸载到可再生能源的边缘集群可以减少排放。\n\
  \n### 5.8 结论\n\n预测或分类数据是成功学习的成果。使用边缘支持的节点预测数据的算法和技术是专门的研究课题。因此，本章探讨了适用于边缘 AI 应用的分布式推理技术。此外，详细讨论了涉及容器或无服务器环境的一些轻量级实现技术。读者可以获得关于利用这些技术解决其潜在问题领域的见解。\n\
