  \ 安全学习\n\n#### 13.1.5 法律与标准\n\n# 前言\n\n“当爱的力量胜过权力的爱时，世界将迎来和平。”——圣雄马·甘地\n\n“沉默的核心是祈祷。祈祷的核心是信仰。信仰的核心是生活。生活的核心是服务。”——德蕾撒修母\n\
  \n利用云端对传感器数据应用智能处理在近期通过多项生产性创新得到了演进。支持边缘的计算吸引了许多研究人员、学者和从业者的关注。作为从业者之间范式转变而提出的几个关键问题列举如下：\n\
  \n- 在向应用中引入智能的同时，我们能多有效地保护数据隐私？\n- 考虑到资源受限的边缘节点，我们是否可以利用多个机器或服务来开发一个稳健的学习模型？\n-\
  \ 边缘层智能如何解决社会的基层性问题？\n\n事实上，在需求严苛的现代世界中，使用传统方法解决已知挑战并开发学习模型并不是可行的解决方案。理解边缘智能的基本原理和安全特性至关重要。\n\
  \n本书提供了关于如何利用微型边缘计算节点应用深度学习智能的启发性说明。它使研究人员和从业者能够在特定的问题领域（如医疗保健、交通、工业等）中应用边缘智能的工具和原理。它利用了读者对创新想法进行实践的兴趣，这些想法在不久的将来被开发出来。\n\
