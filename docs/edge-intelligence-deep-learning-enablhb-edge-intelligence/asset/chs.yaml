  \n\n\n\n\n## 2. 数据特定问题\n在边缘 AI（edge-AI）系统中，实现极致的数据完整性、机密性或防止数据泄露面临着挑战。在许多情况下，处理边缘\
  \ AI 应用所需的数据可用性并不是问题。\n\n## 3. 多厂商问题\n支持边缘的设备属于不同的厂商。`Jetson Nano` 设备中的指令处理方式与基于\
  \ `Raspberry Pi` 的设备的指令处理方式不同。这表明，在这些多厂商节点上执行应用程序的安全性特性，可能会对边缘 AI 应用的安全组件构成挑战。\n\
  \n## 4. 异构性问题\n在大多数情况下，设备具有不同的处理组件。例如，在支持边缘的框架中，存在基于 `GPU` 的计算设备、基于 `CPU` 的计算设备或基于\
  \ `ASICs` 的张量单元。这意味着安全需求会随着这些异构设备而发生变化。\n\n## 5. 架构问题\n在农业、医疗保健、金融、教育等多个应用领域，并没有许多在考虑安全问题或因素后能够良好通用边缘\
  \ AI 应用。通用架构的缺失，为边缘 AI 应用开发者社区中的架构设计人员或安全相关算法设计人员带来了新的挑战。\n\n## 6. 标准局限\n用于监控和设计新型安全型边缘节点的标准非常有限。因此，存在许多独立的解决方案，它们无法与现有系统或设备兼容。设备制造商无法设计出适用于多种边缘\
  \ AI 场景的通用设备。\n\n### 8.2 边缘 AI 中的安全攻击\n本节详细列出了阻碍各种应用领域实践边缘 AI 成长的安全攻击列表。边缘节点很容易受到安全攻击的挑战。因此，本节详细说明了此类攻击的特征以及解决这些问题的重要补救措施。\n\
  \n广而言，涉及不同计算能力的异构设备的边缘 AI 领域安全攻击可分为两类：\n\n1. **主动攻击**：主动攻击将对平台或设备的安全性产生直接影响。攻击者热衷于攻击或破坏活动系统。例如，通过破解支持边缘的\
  \ IoT 系统的中间代理件来修改 `MQTT` 消息，就是一种主动安全攻击。在执行边缘 AI 应用时，来自网络领域的活跃安全威胁有多种，如分布式拒绝服务 (`DDoS`)、物理攻击、侧信道攻击、恶意软件注入、身份验证/授权、干扰、木马、路由信息、伪造和流量注入。接下来的小节将提供这些主动攻击的详细视图以及在执行边缘\
  \ AI 应用时避免此类攻击的程序。\n\n2. **被动攻击**：在被动攻击中，执行边缘 AI 应用的整个系统将在一段时间内被被动监控。这可能是由于边缘 AI\
  \ 框架网络平台中的暴露端口或脆弱的跨脚本问题导致的。通常情况下，被动攻击对未来的努力是有害的，而不是对系统安全性产生即时影响。\n\n#### 8.2.1 物理攻击\n\
  在物理攻击中，设备直接被黑客入侵或访问。此外，它们还会受到安全攻击者的物理攻击。值得注意的是，攻击云服务器或边缘设备会干扰其正常功能。在基于 `Raspberry\
  \ Pi` 的设备中，攻击者可以通过物理方式移除 `SD cards` 或闪存。这些事件可能对应用程序的正常运行产生直接影响。\n\n同样，传感器也容易受到攻击。例如，基于视频处理的边缘\
  \ AI 应用会在危险位置安装多个摄像头。攻击者可能会物理性地针对这些摄像头传感器以停止未来的数据传输。此外，基于近场通信 (`NFC`) 的设备极易被盗，因为它们被用于与银行相关的应用程序。\n\
  \n为了避免潜在的物理攻击，需要使用外部支持措施不断监控传感器和执行器等较小、便携的设备。可以在计算机或服务器附近部署专门的安全人员团队。事实上，物理保护此类设备的成本可能会增加解决应用程序所需的预算。\n\
  \n#### 8.2.2 DDoS 攻击\n分布式拒绝服务 (`DDoS`) 攻击是中断应用程序正常运行服务的安全漏洞之一。在边缘 AI 应用中，涉及大型传感器、执行器、网络设备和存储元素的网络。在\
  \ `DDoS` 攻击中，攻击者试图向常规工作链投递不受欢迎的服务。\n\n可以通过评估边缘 AI 服务或相关网络的访问性来检测 `DDoS` 攻击。这些网络可能会被某些被可疑机器人或人员黑入的其他服务意外占用。\n\
  \n在支持边缘的应用中检测 `DDoS` 攻击是一项严峻的挑战。例如，根据应用程序的自动协同，IoT 服务可能会在不可预测的时间出现测量激增，特别是在医疗保健领域。服务的交付可能由多个厂商或多个组织执行。因此，由于预见到\
  \ `DDoS` 攻击而移除服务并不是更好的选择：识别此类攻击是一项极具挑战性的任务。[13] 的作者通过协作涉及多个节点并应用强化学习方法，预测了支持边缘的应用中的潜在\
  \ `DDoS` 攻击。\n\n#### 8.2.3 侧信道攻击\n侧信道攻击旨在从系统中收集有价值的信息。在边缘 AI 系统中，侧信道攻击将收集有关传感器流量或处理决策的所有细节。在嵌入式设备中，攻击者通过仔细观察系统的电池利用率或边缘设备的功耗，更容易捕获所执行的指令数量。\n\
  \n根据收集到的信息，攻击者可以及时地破坏系统。或者，攻击者可以优雅地研究密码分析密钥和分布模式。\n\n侧信道攻击可以主动或被动地进行。最常见的做法是操纵影响系统的代码序列。例如，通过评估整个系统的特征，攻击者可以通过更新空中\
  \ (`OTA`) 更新来修改代码。\n\n侧信道攻击通过几种方式完成：(i) `计时攻击`：检测时间利用的变化；(ii) `硬件监控攻击`：检测硬件利用率和特定组件利用率；(iii)\
  \ `模型嗅探攻击`：调查边缘 AI 应用的模型大小、训练时间和测试时间以攻击系统。\n\n在支持边缘的系统中，用于侧信道攻击的常用参数是与通信相关的参数、电池源相关的参数和设备监控信息。在这三个参数中，由于此类受限设备的缺陷，电池源相关参数对攻击设计者具有很的影响。攻击者可以泛洪你好消息或数据包，无意中耗尽电池源\
  \ `[9]` 实现电池耗尽，从而为此类攻击铺平道路。\n\n\n\n\n总而言之，大多数侧信道攻击者热于观察信号和信噪比（`SNR`）以获取细节。为了扭转这一局面，更好的选择是开发可重构硬件，将处理能力分摊到多个节点上。此外，还可以设计算法，让系统在不同机器之间随机跳跃，以逃避攻击者。\n\
  \n### 8.2.4 恶意软件注入攻击\n\n恶意软件注入是一种攻击类型，将恶意软件组件注入到边缘 AI 系统中。相应的，通过不提供预期的或实用的服务来干扰设备。\n\
  \n恶意软件注入对如 `ESPs` 等边缘能力设备构成了严重威胁，因为代码可以通过空中进行修改。空中传输（`OTA`）更新的概念期望从少数云端服务或边缘能力服务交付更新后的代码。攻击者可以建立恶意代码，作为监听边缘\
  \ AI 应用数据或学习模型的源。[3] 的作者列出了针对支持物联网的计算系统的 64 多种恶意软件攻击。\n\n在基于服务的分布式计算环境中，脚本是一种常见的恶意软件攻击。在这里，`Javascript`、`VBScript`\
  \ 或类似的脚本被恶意注入到活动设备中。相应的，脚本开始观察系统中执行的应用程序特征。\n\n为了避免此类恶意软件攻击，过去已经开发了基于机器学习的检测系统。`支持向量机`、`随机森林`、`贝叶斯算法`、`多层感知器`等\
  \ ML 算法通过提取特征和检测框架模型的异常从机器中检测潜在的恶意软件。在某些情况下，研究人员不再向学习模型提供结构化数据集，而是设计了基于深度学习的检测系统，可以部署在边缘能力系统上自动捕捉特征并报告异常。作为一种先进方法，许多研究人员研究提供可解释\
  \ AI 特性，以规定将服务归类为恶意软件的原因。尽管过去有一些研究工作，但考虑到现有检测方法的进步，恶意软件注入攻击者仍有深层的方法将恶意服务调整到边缘 AI\
  \ 系统中。\n\n### 8.2.5 身份验证/授权攻击\n\n在身份验证/授权攻击中，攻击者旨在获取登录凭据以访问昂贵资源。身份验证攻击特别是指称他们是系统的合法用户。这也可能是边缘\
  \ AI 应用中的机器人引擎，声称该服务有权利用资源。相比之下，授权攻击是用户获取受限资源的过程。\n\n任何身份验证系统攻击者最常见的做法是利用专门的代理代理服务。这种特定的迭代服务尝试破解用户登录详情，以便合法用户可以使用这些登录凭据。黑客继续监控用户活动并开发一种伪登录设置来收集登录凭据。在支持生物识别的系统中，黑客从生物识别传感器中解析合法用户的指纹细节，以开发类似的生物指纹（bio-fingerprint）。随后，这些指纹被用于访问整个应用程序服务。\n\
  \n在边缘能力应用中，由于较小设备缺乏访问控制策略，授权攻击导致的漏洞比其他攻击相对更高。由于授权攻击，资源容易受到包括 `VMrootkits` 在内的严重攻击。为了对抗\
  \ `VMrootkits`，[6] 的作者开发了一种轻量级虚拟防火墙方法，可以持续追踪内核以检测潜在的恶意软件。\n\n导致授权攻击最常见的原因是访问控制机制的失效。由于访问控制策略或方法的挑战，攻击者能够从合法用户附近移除资源。此外，攻击者在未来以更高的成本声称这些资源。\n\
  \n通过为用户提供低权限可以避免与授权相关的攻击。这样做，就不允许所有用户控制或修改必要的资源。另一种方法是用户在请求资源时通过多次尝试来避免此类伪造的攻击。\n\
  \n### 8.2.6 干扰攻击\n\n干扰攻击是网络能力应用程序或系统中的安全问题。在这里，通过引入干扰信号阻止设备相互通信。干扰攻击实际上是拒绝服务（`DoS`）攻击的一部分，因为用户无法访问服务。\n\
  \n干扰攻击分步骤执行。首先，攻击者审查目标网络的凭据。接下来，攻击者必须决定干扰系统的潜在方法。例如，干扰可能涉及随机信号、持续脉冲或基于评估的信号洪水。然后，攻击者必须选择合适的干扰设备。最后，必须完成干扰过程以实现服务的完全忽略。\n\
  \n过去采用了一些方法来避免干扰攻击，如下：\n\n- 信道跳频：在这种技术中，目标频率多次跳变，使得攻击者无法干扰信号。在特定传输期间识别正确信号所需的时间非常长，使得攻击者无法进行干扰。\n\
  - 干扰追踪：在这种方法中，任何潜在的干扰事件都由专用设备进行追踪。平台必须警惕引起现有服务干扰的新信号。事实上，追踪是一项困难的任务，被认为是一种逻辑复杂的算法。[7]\
  \ 的作者考虑到 `Stackelberg 博弈` 开发了一种干扰防御机制。\n\n### 8.2.7 伪造攻击\n\n伪造攻击是一种新发现的攻击，与信任用户恶意交付系统命令有关。网络服务受到攻击，相关资源受到此类攻击的破坏。作为一种主动措施，攻击者在边缘\
  \ AI 应用中引入恶意数据并修改学习模型。\n\n损害边缘资源的一种变体出现在现代网络相关应用程序中，其中向用户发布请求消息。打开此类网站时，恶意代码将注入到应用程序中，以利用资源并破坏现有系统。\n\
  \n### 8.2.8 被动安全攻击\n\n主动安全相关攻击在许多方面都是有害的。然而，如果不在攻击的初始阶段消除，被动安全攻击可能会导致更严重的后果。以下列出了主要的被动安全攻击及其对边缘\
  \ AI 平台的预期漏洞：\n\n\n\n\n\n1. **流量分析**：这是一种被动安全攻击，攻击者通过黑客手段获取学习模型的细节或资源信息。黑客监控这些信息，其行为与正常、合法的用户相似。攻击者的这种伪装在应用部署的后期阶段可能变成一种有害的武器。例如，攻击者可以学习学习模型的流量模式或预测模式；机器人可以通过分析现有的推理模式来重新调整其推理逻辑等。\n\
  \n2. **对抗攻击**：在边缘 AI 系统中，对抗样本是由诸如生成对抗网络等复杂的学习模型提供的。然而，低质量的模型或被黑掉的机器可能会向现实应用投递错误的对抗样本。这种由于攻击者导致在学习系统中提供错误对抗样本的方法被称为对抗攻击。由于在典型用例中缺乏有效的指导方向，对抗攻击通常是被动的。攻击者可能对学习模型拥有完全控制或部分控制权。取决于控制的性质，将决定对攻击的影响。\n\
  \n3. **窃听或嗅探**：窃听攻击或嗅探攻击是一种被动安全攻击，在一段时间内定期对数据进行解析。数据（包括机器学习模型在内）被系统未经授权的用户被动解析。解析或嗅探发生在设备间通信的交汇处。通过利用专门搜索此类攻击者的强大设备，可以避免窃听攻击的影响。例如，防火墙设备或带有适当入侵检测软件的设备可以作为避免此类攻击的解决方案。此外，可以防止边缘设备访问通过移动设备激活的暴露端口或开放服务。\n\
  \n图 8.1 提供了在前几个节中讨论的安全攻击的视化列表。\n\n![图 8.1. 边缘 AI 系统中的安全攻击。](img/bk978-0-7503-5593-3ch8f1_online.jpg)\n\
  \n**图 8.1.** 边缘 AI 系统中的安全攻击。\n\n### 8.3 数据特定漏洞\n\n数据特定的安全漏洞是与应用程序相关的数据相关的安全问题。在边缘\
  \ AI 应用中，接下来的小节将描述了由于数据及其重要性对系统产生风险的安全问题。\n\n#### 8.3.1 数据完整性相关问题\n\n边缘 AI 系统可能会由于数据完整性相关的安全漏洞而故障。通常，学习算法或训练轮次根据视频帧、图像、音频等输入数据生成模型。然而，并没有严格的策略来确保学习结果的一致性。由于大多数情况下的输出不确定，边缘\
  \ AI 系统的适用性并不是一个非常安全的解决方案。\n\n事实上，在执行边缘 AI 应用时，无论系统或计算节点的异构性如何，必须维护数据完整性。\n\n为了防止与数据完整性相关的安全问题，建议限制对欺诈系统或机器人访问。此外，定期评估数据并记录数据状态也是一个很好的解决方案。通过这种方式可以避免边缘\
  \ AI 系统中的潜在问题。\n\n#### 8.3.2 数据机密性相关问题\n\n数据机密性是防止边缘 AI 应用中许多潜在安全攻击的关键步骤之一。数据机密性与保护系统的文件和资源一起考虑。其目的是防止恶意用户窃听数据。为了确保数据机密性，在发送者和接收者之间采用了加密技术。加密技术的采用防止了恶意用户对数据的非法访问。\n\
  \n在支持边缘的系统中提供数据机密性的必要性是为了在利用系统时提高服务的可用性并增加用户之间的信任。\n\n为了提高边缘 AI 系统中的数据机密性，平台应该具有限制授权用户访问的机制；它们应该定期更新安全相关的软件或算法；并且它们应该支持所有可能的安全相关通信协议，以便许多供应商能够参与边缘\
  \ AI 平台。\n\n#### 8.3.3 数据可用性相关问题\n\n数据可用性相关问题是影响数据可见性的安全问题。黑客试图入侵数据以影响其可用性。在某些情况下，数据处理延迟导致数据不可见。\n\
  \n数据可用性安全问题有几个显著原因。例如，基于服务器的频繁停机、网络问题、不适用于平台的数据配置等。\n\n#### 8.3.4 配置差异\n\n边缘 AI\
  \ 应用容易由于配置错误而受到安全攻击。例如，基于微控制器的设备需要根据其内部功能进行配置。如果配置不及时，这些设备可能会出现多种安全问题。由于边缘 AI 应用结合了地理位置的计算节点，配置错误会导致针对黑客的目标风险。在\
  \ `AWS 云` 中修改 `EC2 实例`的网络策略可能会允许未经授权的用户访问。显然，这会导致边缘 AI 解决方案的安全漏洞。\n\n在某些情况下，手动配置可能会导致人为错误。参见图\
  \ 8.2 查看执行边缘 AI 应用时的数据特定安全问题。\n\n![图 8.2. 数据特定的关注。](img/bk978-0-7503-5593-3ch8f2_online.jpg)\n\
  \n**图 8.2.** 数据特定的关注。\n\n### 8.4 边缘 AI 中的安全架构\n\n架构设计用于有效处理安全问题并解决边缘级问题。在边缘 AI 系统中，考虑到应用程序的安全需求，安全型边缘\
  \ AI 架构是由计算机科学家和安全目标爱好者设计的 [4]]。此类架构对于考虑未来硬件或生态系统设计高性能、节能的解决方案至关重要。参见图 8.3 了解边缘\
  \ AI 系统安全导向架构分类的概览。\n\n![图 8.3. 安全型边缘 AI 架构：类型。](img/bk978-0-7503-5593-3ch8f3_online.jpg)\n\
  \n**图 8.3.** 安全型边缘 AI 架构：类型。\n\n通常，安全型边缘 AI 架构可以根据以下因素进行分类：\n\n* 边缘 AI 中的安全导向功能层，\n\
  * 用户视角，\n* 以设备为中心的安全方面，\n* 特定的应用程序安全策略\n\n本节将详细调查这些安全型边缘 AI 架构及其涉及的实体。\n\n#### 8.4.1\
  \ 安全架构：分层视角\n\n\n\n\n在边缘计算节点中启用安全功能可以通过对控制单元、网关、服务器等功能组件进行分层来实现。在分层架构风格中，功能模块的结构使得层级之间或服务交付之间有清晰的区分。\n\
  \n典型的与安全相关的分层架构如图 8.4.所示。\n\n![图 8.4. 边缘 AI 的分层安全启用架构。](img/bk978-0-7503-5593-3ch8f4_online.jpg)\n\
  \n**图 8.4.** 边缘 AI 的分层安全启用架构。\n\n如图 8.4 所示，与设备相关的函数（如设备级安全功能）在设备层处理。操作系统（OS）控制单元位于设备级安全功能之上。这些控制单元的目的是为更高层或设备组件提供平稳的服务性。值得注意的是，安全违规、基于硬件的随机数生成、IP\
  \ 转换、Bitlocker 等功能是在分层中处理的。这些服务与边缘服务器或云数据中心提供的其他高级别服务有所区别。边缘服务器将负责自动数据传输、数据泄露、身份验证功能等。云数据中心将提供对安全违规或预测相关信息的长期评估。用户界面级安全提供移动端和\
  \ Web 端视图。\n\n简而言之，可以观察到分层安全架构提供了独特的安全相关服务层，可以以模块化的方式进行扩展或修改。分层安全架构的一个示例在\\[8\\\
  ]中进行了讨论。\n\n## 8.4.2 安全架构：以用户为中心\n\n在边缘计算系统中设计以用户为中心的安全架构是改进安全功能的另一个关键方面。用户希望为他们的边缘-AI\
  \ 应用建立所有的安全功能。然而，当考虑到与使用边缘设备或电池供电组件的便利性相关的预算时，他们试图将安全功能降至最低。这是一个已知事实，因为增加算法能力会大幅增加设计或架构涉及的成本。\n\
  \n用户倾向于建立一个受信的环境。与安全相关的架构预计将增加系统的信任度。在传统系统中，由于系统故障或可靠性问题的日益增加，与用户共享的信任仍然是一个具有挑战性的因素。在现代以用户为中心的安全架构设计中，通过区块链或类似的不可变系统设计引入了信任机制。在支持区块链的信任系统中，整个信任机制由一组网络节点和用户实施的策略共同执行。显然，这种架构设计为用户的改进和便利体现了易用性和信誉度。\n\
  \n图 8.5 说明了使用受信区块链网络提供不可否认数据块的网络的概念。\n\n![图 8.5. 边缘 AI 的区块链受信安全架构。](img/bk978-0-7503-5593-3ch8f5_online.jpg)\n\
  \n**图 8.5.** 边缘 AI 的区块链受信安全架构。\n\n## 8.4.3 安全架构：以设备为中心\n\n在某些边缘-AI 应用中，安全架构对设备的关注多于对用户的关注。设备在本质上通常是异构的，属于多个供应商且没有统一的标准。因此，研究人员专注于为单个设备开发安全架构。\n\
  \n在这些架构中，设备被赋予了修改配置和开发硬件级保护系统的机会。设备需要在其架构设计中采用安全功能。如果不是，基础安全功能可能会变成问题。例如，安全密钥需要被保护。此外，如果我们考虑到设备的\
  \ OTA 更新，可能会阻碍系统并引入恶意软件。因此，所有设备必须在硬件层面进行安全设计。\n\n## 8.4.4 安全架构：特定应用\n\n为边缘 AI 应用提供端到端安全架构是用户的正常期望。这意味着应用程序可以在没有限制的情况下安全地执行任务。通常，边缘系统中的端到端安全架构包含了强大的信任关系。为了与系统建立联系，架构封装了身份管理、攻击防护方案、设备访问策略、可扩展的安全功能以及管理功能。此外，架构涉及至少一些安全监控设备以学习安全特征。\n\
  \n该架构的身份管理功能将参与检测机器人或系统。这是一个关键功能，因为该解决方案可以避免设备欺诈、钓鱼和其他一些安全漏洞。该架构涉及通过安全策略来选择合适的设备。Ericcson\
  \ [5] 探讨了为端到端应用设计的安全架构。\n\n## 8.4.5 特定部署的安全架构\n\n部署资源可以是集中或去中心化的。在集中式安全架构中，边缘-AI\
  \ 系统的安全相关功能在集中强大的节点上执行。它们通常在云的可扩展计算节点上运行。集中式安全架构专注于单一机构产生安全决策。即使安全功能是算法开发的，它们也在单一机构的范围内进行处理和交付。\n\
  \n由单一机构交付安全功能的优势是：(i) 决策快速；(ii) 决策收敛快；(iii) 管理计划；(iv) 服务交付统一。然而，部署安全功能的集中方法可能会带来多种安全威胁。例如，处理安全建议的单一机构发生故障或安全威胁，可能会导致整个系统的瘫痪。这将阻碍整个应用程序或设备功能。\n\
  \n去中心化安全架构通常被从业者或设备/功能提供者偏好。在去中心化安全架构中，多个组织参与安全决策。同样，安全相关函数的分布式处理是可能的。因此，在全球范围内分布以执行应用程序的边缘设备能够协作做出安全决策。\n\
  \n\n\n\n#1. **收敛性差**：由于决策中涉及多个管理领域，安全决策无法按预期实现收敛。因此，在解决安全攻击时，可能会出现决策延迟。\n\n2. **策略多变**：安全相关策略随时间和地理区域不断变化。例如，由于隐私问题，基于印度数据集开发的数据或模型无法与其他国家共享。同样，由于安全问题，来自中国的设备未被运输到许多其他国家。所有这些变化的策略都延迟了安全检查的形成以及对相关攻击的决策。\n\
  \n3. **决策重复**：由于去中心化决策是去中心化安全架构的共同，安全相关决策可能会重复。针对同一安全违规的决策在多个位置可能被区别对待。这可能导致决策处理的不公平。\n\
  \n## 8.5 防止安全泄露：策略\n\n在观察了多种安全攻击和安全相关架构类型后，了解潜在的预防步骤以及可以纳入新架构的方法将是非常有益的。本节详细介绍了在边缘\
  \ AI 系统中可以采用的可能规避策略。\n\n### 8.5.1 专用协议辅助\n\n有几种特定数据的高层协议用于在跨网络 IoT 系统传输数据或学习模型。例如，著名的协议如`受限应用协议`(`CoAP`)、`可扩展消息和存在协议`(Extensible\
  \ Messaging and Presence Protocol)、`消息队列遥传输`(`MQTT`)等已经开发，用于为边缘 AI 系统提供数据服务。同样，还有几种特定的通信协议，如`远距离广域网`(`LoRaWAN`)、`WiFi`、`蓝牙`、`LTE`、`5G/6G`、`WirelessHART`等，用于连接边缘节点。\n\
  \n在边缘 AI 系统中，通信协议可能涉及安全协议，同时增强应用程序的安全组件。例如，`安全消息队列遥传输`(`SMQTT`)协议或 `S-HTTP` 是边缘\
  \ AI 系统中安全通信协议的示例。\n\n#### 8.5.1.1 SMQTT 协议\n\n通常，`MQTT`协议不具备保护计算节点之间传输的数据通信的功能。如果应用程序需要强大的安全组件，建议在现有协议（如\
  \ `MQTT`）中包含安全功能。\n\n一些研究人员尝试通过在传感器或执行器与代理（brokers）之间、或代理与应用程序服务之间启用 `VPN`连接来解决\
  \ `MQTT`协议的安全问题。此外，其他一些研究人员通过安全套层 (`SSLs`) 传输 `MQTT` 消息，以增加应用程序的安全功能。\n\n在 `Mosquitto`\
  \ 代理中，提供了启用 `SSL/TSL` 配置以为 `MQTT` 消息提供安全的规定。`MQTT`框架中还有其他流行的代理：`MuleSoft Platform`、`IBM\
  \ MQTT`、`RabbitMQ` 和 `meshIQ`。所有这些 `MQTT` 代理都可以配置 `SSL/TSL` 配置，以提高边缘支持应用程序中基于 `MQTT`\
  \ 数据传输的安全功能。\n\n此外，近年来开发了 `S-MQTT` 作为 `MQTT`协议的扩展。在 `S-MQTT` 中，采用了轻量级实现形式的加密算法以适应边缘节点上的服务。适当加密密钥通过传统的密钥管理系统在代理、发布者和订阅者之间传输。然而，与传统网络采用的传统安全功能相比，所有的加密算法都是轻量级的实例化。\n\
  \n#### 8.5.1.2 S-HTTP\n\n类似于传统网络，`S-HTTP` 是一种在 Web 服务上提供安全超文本的协议。边缘支持的应用程序很少遵循请求-响应模型。然而，确实有一些应用程序和服务市倾向于利用请求-响应模型，因为传感器或执行器可能使用普通电网供电。例如，机场或敏感位置的安全摄像头必须有足够的电源。数据可以通过请求-响应模型通过\
  \ `WiFi` 系统进行传输。然而，为了增加此类应用程序涉及的安全组件，可以应用如 `S-HTTP` 等安全协议。\n\n### 8.5.2 可靠路由协议\n\
  \n一些研究人员开发了具有多路径的路由协议，以避免安全相关的攻击。它也被用于提高应用程序的能量效率，使攻击者无法损坏工作系统或设备。例如，干扰攻击会损害电池寿命。这是因为噪声干扰过大，任何受限设备无法处理正常信号。\n\
  \n过去的其他一些研究通过应用各种路由算法刻画了嵌入式设备的安全特征。\n\n### 8.5.3 轻量级与计算密集型实现的结合\n\n轻量级安全算法无疑是边缘支持系统的选择。然而，纯轻量级安全算法无法抵御在边缘设备上的所有现代安全相关攻击。这是由于边缘设备的计算能力有限。在大多数情况下，轻量级安全相关算法与云端重量级计算的可能是可能是恰的选择。\n\
  \n在现代系统中，已经开发了轻量级分组密码、轻量级流密码、轻量级哈希和轻量级加密端到端解决方案。轻量级算法的作用是改进算法的内存空间和计算空间。事实上，一些研究人员在减少安全边缘\
  \ AI 系统中密码密钥尺寸方面提出了新颖观点。\n\n建立轻量级哈希的主要目标是最小化存储空间和计算能力。在某些实现中，在云端执行哈希的稳健实现，而在边缘节点上进行低资源消耗计算。简而言之，在边缘到云计算汇编的帮助下，将轻量级和计算密集型算法结合起来更好。\n\
  \n### 8.5.4 固件级更新\n\n众所周知，固件是与硬件单元直接通信的软件。随着多个边缘级计算节点的演进，固件日益增加。通常，它是将操作系统的请求映射底层硬件的软件。\n\
  \n近年来，许多嵌入式设备开发者设计了自动更新固件的程序。这一功能的创建是为了将计算设备安装在无法到达的地方。例如，需要安装在人类难以触及的机器上的传感器设备就是一个例子。在这些设备中，固件需要进行修改以改进功能。\n\
  \n例如，空中下载（OTA）更新是若干嵌入式边缘设备采用的一种技术，用于更新设备的应用程序代码功能。黑客也可能在修改期间更新固件细节。\n\n因此，为了防止此类错误的固件更新。研究人员以前使用硬件级程序以及网络级防御机制来实现这一点。将\
  \ `MAC` 地址映射到特定的授权节点以激活固件更新。否则，设备将无法获得定期更新。因此，开发者在过去实践了一些预防措施。\n\n### 8.5.5 先期安全测试\n\
  \n\n\n\n安全测试是任何网络相关系统（包括边缘人工智能/edge-AI 系统）中防止安全相关攻击的常用程序。测试的主要目的是识别安全风险、防止近期发生的攻击，或从系统中剔除黑客。通常，安全相关测试通过以下几种方式进行，如文所述：\n\
  \n1.  **应用安全测试**：这种测试是检测应用程序中安全缺陷的一步。边缘 AI 应用必须利用多个计算设备。软件组件（如联邦学习实例）必须能够抵御多种安全威胁的可能性。因此，如果系统中存在安全缺陷，应用安全技术可以深入研究其安全缺陷的真实原因。\n\
  \n2.  **API 安全测试**：这种测试方法处理与应用程序编程接口（`APIs`）相关的问题。大多数边缘 AI 应用是独立应用程序，将需要若干个第三方库服务。通常，此类\
  \ API 容易受到中间人攻击等多种攻击。需要仔细评估此类 API 带来的安全挑战。\n\n3.  **配置测试**：在分布式系统中，尤其是嵌入式设备中，有许多地方可以手动或自动配置系统。例如，设置睡眠模式、管理内存空间等都是使用某些方法配置的。在错误配置此类文件时，人为错误的可能会导致无法忍受的安全漏洞。因此，配置测试试图研究配置问题。\n\
  \n边缘 AI 这些基于安全的测试组件的图示表示如图 8.6 所示。\n\n![图 8.6. 安全意识型边缘 AI 的测试方法](img/bk978-07503-55933ch8fig6)\n\
  \n**图 8.6.** 安全意识型边缘 AI 的测试方法。\n\n## 8.5.6 加密方法\n显然，传统的加密解决方案需要整合到支持边缘的设备中。然而，为了满足资源限制和电池限制，加密技术在所有方面必须是轻量且稳健的。开发加密解决方案有两种方法：硬件方法或软件方法。在硬件方法中，开发加密技术时引入了新的组件来处理加密。例如，为了开发流加密器，可以设计特定的硬件寄存器以在开发加密输出时映射输入位。同样，可以采用基于\
  \ FPGA 的硬件加速器在开发密文输出时加速逻辑映射过程。\n\n除了硬件方法外，还有几种遵循加密技术的算法方法。例如，作者开发了一种定期修改密钥的算法，以防止与密钥相关的攻击。考虑到内存和电池利用率，也有保护密钥的努力。另一种方法是考虑到设备的电池利用率，在数据块中应用传统的替换密码。在一些工作中，研究人员开发了基于椭圆曲线决策的\
  \ Diffie–Hellman 方法的加密。\n\n## 8.5.7 新技术\n有几种方法应用新技术来保护边缘智能系统中的密钥和输入数据。最广泛应用的技术是建立区块链以提高系统涉及的信任。然而，在多个边缘设备上部署区块链节点是一项挑战性问题。例如，哪个边缘节点可以执行区块链软件组件以使区块链账本不受攻击者的干扰？这类问题在安全型物联网架构中得到了研究。\n\
  \n区块链技术在跨计算节点传输模型时确保数据保护。例如，在基于 Hyperledger 的区块链中，每笔交易在经过一组批准者的验证和批准后记录在账本中。这种方法适用于边缘\
  \ AI 分布式系统，特别是当数据模型需要跨多个边缘节点传输时。如果记录区块链中交易的模型尺寸较大，可以包含星际文件系统方法，将整个块的哈希值记录在区块链账本中。哈希的真实属性将存储在远程位置或云系统中供使用。\n\
  \n## 8.6 工具与解决方案\n为了采用基于安全的系统，如果机制能够以生产级工具的形式供用户随时使用，将是非常有用的。安全工具可以开发为库、插件、独立应用程序和硬件设备。在本节中，我们将学习一些用于边缘\
  \ AI 系统的可用安全赋能工具。\n\n### 8.6.1 FireEye\nFireEye 是一种云端安全工具，被有效用于支持边缘的应用程序。FireEye\
  \ 是一家为行业提供安全解决方案的公司，侧关注工业物联网领域。它具有若干自动化功能，可以轻松与工业传感器设备结合以赋予安全特性。基于 FireEye 的安全解决方案因其在边缘级计算中结合智能的灵活性而广受认可。12\
  \ 的作者已将 `FireEye` 应用于无人机（UAE）交付系统。\n\n### 8.6.2 PaloAlto networks\nPaloAlto Networks\
  \ Inc. 1 开发了多种基于云的安全解决方案，可用于基于物联网的边缘设备。`PaloAlto` 提供的关键解决方案之一是通过其防火墙安全功能对支持物联网的边缘设备进行实时清单。他们的解决方案被开发为\
  \ `APIs`。因此，边缘应用程序可以通过调用特定的 `APIs` 将服务集成到应用程序中。`APIs` 具有在利用关联网络时交叉检查边缘设备有效性的功能。\n\
  \n\n\n\n除了针对边缘启用系统的工具外，研究人员一直在致力于为联邦系统设计安全特性。边缘 AI 系统利用联邦引擎通过利用本地数据集来提高学习模型的准确性。因此，专注于联邦系统的安全解决方案已成为现代应用中的重要组成部分。以下是针对联邦边缘学习系统最著名的安全解决方案：\n\
  \n1. **BlockFL**: 基于区块链的设备侧联邦学习是一种解决因不可信设备而演变问题的方法。该安全解决方案是一种学术方案，尝试应用区块链技术来保护数据隐私。\n\
  \n2. **FedCS**: 带有客户端选择的联邦学习（`FedCS`）是一种根据安全选择边缘设备的方法：即仅当设备符合用户预先设计的策略时才选择它们。通过这种方式，应用\
  \ `FedCS` 解决方案固有地引入了设备的身份验证和授权。\n\n3. **FedPer**: 带有个性化层的联邦学习（`FedPer`）是一种限制深度学习模型学习层不受公开访问的技术。开发此类解决方案背后的核心思想是划分深度学习层，以防止少数学习层被未经授权的访问，即这些个性化层仅使用用户批准的数据集。因此，允许个性化层在学习模型时实现数据集本地化。\n\
  \n### 8.7 结论\n\n边缘 AI 系统容易产生难以检测和修复的潜在安全问题。这是由于与云端相比，边缘设备的空间和计算能力不足。本章讨论了阻碍边缘 AI\
  \ 应用的潜在安全攻击。此外，本章提供了过去研究人员研究过的安全相关边缘架构分类。读者对边缘 AI 系统中实践的安全特性有了深入的见解。\n\n### 参考文献\n\
