  \n[4] Bartolomeo G, Yosofie M, Bäurle S, Haluszczynski O, Mohan N and Ott J 2023\
  \ Oakestra: a lightweight hierarchical orchestration framework for edge computing\
  \ *2023 USENIX Annual Technical Conference (USENIX ATC 23)* (Boston, MA: USENIX\
  \ Association) pp 215–31\n\n[5] Kale 2020 GitHub—kubeflow-kale/kale: Kubeflow’s\
  \ superfood for Data Scientists—[github.com](https://github.com) ([`github.com/kubeflow-kale/kale`](https://github.com/kubeflow-kale/kale))\n\
  \n\n\n\n\n边缘赋能 AI 应用已广泛应用于工业、医疗健康、教育、法医、机器人等多个领域。本章探讨了边缘级 AI 对于此类应用领域的重要性。\n\n##\
  \ 11.1 应用\n\n应用程序是旨在辅助用户或其他软件模块的软件组件。应用程序服务于某些用户定义的目标，模拟真实世界用例的需求。由于 `IoT` 和 `ML/DL`\
  \ 等技术，边缘智能与云系统的结合在近年来日益演进。边缘智能可以应用于多个领域：(a) 医疗健康、(b) 制造业、(c) 工业、(d) 农业、(e) 法医、(f)\
  \ 物流以及(g) 机器人。以下章节将探讨需要边缘级智能的潜在应用和可能的用例。\n\n## 11.2 用于医疗健康的边缘 AI\n\n由于人们希望生活得更长，医疗健康应用每天都在显著增加。事实上，如果遵循适当的数据分析，有许多创新可以保护我们免受潜在医疗健康风险的影响。例如，如果使用\
  \ AI 技术指出了近期可能发生的健康危害，患者可以主动采取药物。本节探讨了将边缘级智能应用于医疗领域的潜在用例。\n\n### 11.2.1 远程医疗监控与预测\n\
  \n远程医疗监控和预测在 COVID 时代具有巨大的应用价值。COVID 疫情的爆发导致许多患有哮喘、糖尿病、心脏问题等疾病的慢性病人居家数月没有看医生。这增加了使用包括\
  \ `IoT` 在内的先进技术进行远程医疗监控的应用。\n\n#### 11.2.1.1 远程监控\n\n远程医疗监控是一种医疗健康应用，涉及患者、医生、医院和组织，提供远程医疗咨询和监控\
  \ `[3`]。医疗监控系统包括手机、带传感器的设备、个人辅助设备和某些医院设备，用于为远程患者提供精密的健康相关检查、监控或预测。\n\n例如，可以使用手机从连接的医院或医生处获得适当的远程医疗咨询或饮食建议。在某些情况下，远程医疗监控对于提醒患者正确用药非常有用。慢性患者可能会忘记服药或多次服药，忘记他们已经吃过药。\n\
  \n图 `11.1` 展示了远程医疗监控应用的架构图，其中对体内传感器或体外传感器进行边缘级计算。该架构在远程连接医院的协助下分析数据。\n\n![图 11.1.\
  \ 远程医疗监控：一个示例。](img/bk978-0-7503-5593-3ch11f1_online.jpg)\n\n**图 11.1.** 远程医疗监控：一个示例。\n\
  \n#### 11.2.1.2 预测\n\n除了监控和通知远程患者的健康状况，基于监控数据预测健康状况的未来影响也是益的。例如，如果患者的血压记录持续超过 140，远程医疗系统可以预测可能出现的健康问题。它还可以建议患者对饮食进行适当调整。\n\
  \n可以使用 `支持向量机`、`随机森林`、`回归` 等预测算法来获取健康状况的预测。可以使用一些深度学习算法来研究患者的夜间睡眠问题。特别，糖尿病患者可以通过\
  \ `Deep Learning` 算法监控血糖水平并预测睡眠活动，在夜间注射正确量的葡萄糖。\n\n在医疗数据（包括图像）中引入边缘 AI 增加了检测健康问题的概率。例如，可以利用基于\
  \ `CNN` 的算法检测不同类型的皮肤癌。边缘设备可以在内部处理图像，并根据肤色、感染区域大小、皮肤扩散特性等多个参数识别皮肤癌类型。除了作为早期发现健康问题的专业工具外，它还可以成为医生对患者进行远程监控或诊断时的重要指标。\n\
  \n#### 11.2.1.3 架构\n\n远程医疗监控系统需要边缘级计算，因为个人数据应受到第三方的保护。尽管大多数服务基于云端，但必须防止数据暴露在公共仓库中。因此，处理远程医疗监控的架构必须具有高度安全性。\n\
  \n远程医疗监控系统应包含以下实体：\n\n1. `用户界面`：医疗监控系统需要一个健壮的用户界面，拥有 24/7 软件机器人以自动共享适当的初步信息，并以用户化的建议回复。用户界面支持基于虚拟现实的解决方案，这些解决方案不仅可以托管在云系统中，也可以托管在边缘赋能的患者现场。\n\
  2. `传感器或终端设备`：远程医疗监控包括多种类型的传感器和边缘计算节点。根据应用程序的性质，必须定期监控温度、`ECG`、`心率传感器`等传感器。传感器数据需要使用边缘计算节点进行预处理，以确保数据不会传输到第三方计算节点。医疗监控设备分为体内设备、体外设备、移动设备、救护设备和医院设备。体内设备的目的是自动捕获或激活某些感知数据。例如，放置在体内持续报告健康状况的传感器设备被称为体内设备。慢性患者通常需要体内传感器，例如，血糖仪可以放置在体内，以自动监测患者的血糖水平；体外设备是作为可穿戴设备、耗品、时尚展品和辅助设备的传感器设备。体外设备不仅可以帮助慢性患者，还可以帮助那些在指定时间间隔检查健康状况的用户。移动设备是不固定在地理空间的传感器化医疗设备。救护设备是固定在救护车上的\
  \ IoT 传感器/执行器设备，用于在患者就医之前对其进行特殊护理。医院设备是医院提供的设备。这些设备根据地理位置信息进行编号和定位。\n3. `AI 组件`：远程医疗监控系统中从各种传感器设备收集的数据包含了基于\
  \ AI 的算法。这些 AI 算法用于根据数据集中识别的特征对数据进行预测或分类。\n\n##### 11.2.1.4 优先级监控\n\n根据健康监控状况和资源的可用性，远程医疗系统必须对任务进行优先级排序。例如，定期的远程监控服务不应为普通用户消耗过多资源。相反，它必须将资源交付危病人。这表明远程监控任务需要对某些任务进行排队。\n\
  \n\n\n\n因此，远程监控系统中涉及的任务分类为：(i) **关键任务**，即需要立即关注的任务；(ii) **周期性任务**，随时间持续激活的远程健康监测任务；(iii)\
  \ **预防性任务**，预计使用复杂的 AI 算法早期检测癌症或潜在健康风险的任务；(iv) **联邦任务**，需要多个计算节点或组织协作处理的任务；(v) **警报任务**：必须提供警告信息或通知的医疗相关任务；以及(vi)\
  \ **教育任务**，即在未能及时遵循某些习惯时提供健康风险相关见解的任务。因此，远程医疗监控系统中基于优先级的任务监控能够根据任务的优先级或重要性以及计算资源的可用性来执行任务。\n\
  \n### 11.2.2 个性化医疗\n\n个性化医疗可以根据药物需求提供更准确的药物。个性化医疗的目标是提高治疗的准确性并改善患者的健康状况。在某些情况下，医生会针对疾病开具通用药物，这是由于经验较少的医生提供的医疗治疗导致的。由于医院中患者众多，专科医生需要为患者提供个性化药物，因此负荷过重。\n\
  \n通过远程监控解决方案，患者可以在 IoT 传感器节点的辅助下获得更具个性化的关注。血糖含量高的患者即使出现高热或其他医疗问题，也会被开具非糖基类药物。边缘\
  \ AI 解决方案在此类个性化医疗中起着至关重要的作用，因为传感器数据保留在终端用户附近。\n\n### 11.2.3 压力释放系统\n\n在现代世界中，许多人像机器一样工作，而机器已开始智能地工作。由于需要投入完成日常任务，包括学术机构在内的许多机构的工作人员压力水平仍然处于较高水平。识别此类员工的压力水平至关重要，这样雇主就不会失去这些员工，员工的家庭也不会遭受困难。\n\
  \n如果使用视频连接系统捕捉员工的行为，边缘 AI 解决方案可以解决压力相关的问题。可以根据感知数据和来自各个数据点的输入找出压力水平上升的根源。通过这种方式，智能被应用于用户所在的边缘，而无需将数据发送到云服务。\n\
  \n人类的情绪，如愤怒、悲伤、快乐、厌恶等，可以使用支持边缘的机器轻松检测到 [14]。这些设备解析视频帧并使用计算密集型深度学习算法（如 `YOLO`、`CNN`、`ResNET`\
  \ 等）捕捉情绪。检测学生的情绪可以为快速处理异常和健康问题铺平道路。\n\n### 11.3 使用边缘 AI 的工业应用\n\n边缘 AI 在工业中被广泛利用。通常情况下，工业标记了几次革命，例如工业\
  \ 1.0、工业 2.0、工业 3.0 和工业 4.0。生产环境中涉及的过程通过新的技术和方法而变得丰富，使得行业收入显著增加。见图 11.2。\n\n![图\
  \ 11.2. 边缘 AI 辅助应用。](img/bk978-0-7503-5593-3ch11fig)\n\n![图 11.2. 边缘 AI 辅助应用。](img/bk978-0-7503-5593-3ch11fig)\n\
  \n![图 11.2. 边缘 AI 辅助应用。](img/bk978-0-7503-5593-3ch11fig)\n\n![图 11.2. 边缘 AI 辅助应用。](img/bk978-0-7503-5593-3ch11fig)\n\
  \n\n\n\n数字孪生拥有多个分布式传感器，用于收集真实物体的实时数据，并利用虚拟对象对其进行处理。例如，汽车制造工厂可以利用数字孪生虚拟对象一次性批量生产并更改成百个真实制造工厂的配置。通过这种方式，制造过程通过数字孪生得到了高效的提升。\n\
  \n数字孪生的主要组件是链接数据和执行连接 [15]。数据必须从连接到现实世界的多个传感器中收集。这些数据可以在云端进行集中化处理，也可以使用支持边缘的设备以去中心化的方式进行处理。这类预测或学习推理与边缘智能有紧密的关系，而边缘智能应该在边缘节点上进行处理。\n\
  \n数字孪生在开发初期使用云服务进行部署。然而，基于边缘的计算系统的演进增加了数字孪生在各个领域的应用。例如，汽车生产的制造和控制是通过数字孪生进行远程控制的。\n\
  \n边缘设备被安装在数字孪生中，以增加物理对象操作的速度。否则，数据必须传输到云端，且决策的执行将产生延迟。支持边缘的 AI 解决方案提高了系统的安全能力。这是因为数据不需要传输到第三方云系统。同样地，物理对象或机器的过去操作可以使用边缘集群进行跟踪，同时提供智能化支持。\n\
  \n### 11.3.3 连接工厂\n\n连接工厂是云辅助的制造平台，协作共享生产产品所需的资源。其理念是提供支持物联网（IoT）的计算解决方案，这些可以通过互联网从共享的可配置资源池中快速配置资源。连接工厂将高端技术整合到传统的制造范式中。\n\
  \n在连接工厂中提供边缘 AI 的主要优势包括：\n\n1. **业务增长**：在分布式基于云的制造平台上，业务运营增加了。产品的开发得益于原材料和副产品的共享分配。由于制造和交付单元是高度分布的，对产品的感知度也高，从而为产品创造了更大的价值。\n\
  2. **快速生产**：在云辅助的连接工厂中，由于所需资源的可用性，制造过程不需要等待几小时或几天。即使资源无法立即可用，也可以将产品制造请求发送到资源充足的其它地理位置。\n\
  3. **最小化浪费**：在连接工厂中，无需将原材料运输到集中的制造工厂。由于这种方法，可以避免订购大量产品、设备或子组件。显然，连接工厂中由于产品开发产生的浪费被显著减少。\n\
  4. **降低成本**：有几个原因可以降低协作产品制造的成本。快速生产、极低浪费、提高感知、更大的创新等，都可以直接或间接地减少制造过程中涉及的成本。\n5.\
  \ **提高灵活性**：不需要将整个过程在共享工厂中集中。工厂和管理层被赋予了最大的自主权，以根据不断增加的目标来交付其副产品。在这方面，平台在开发协作产品方面提供了巨大的灵活性。\n\
  6. **优化机会**：连接工厂引发了优化目标的机会。事实上，设计一个整体解决方案存在潜在的权衡。例如，最小化选择原材料更廉工厂所投入的成本可能会导致高昂的运输成本。因此，在连接工厂中需要考虑多目标，并制定专门的优化算法。\n\
  7. **多地生产**：促进连接工厂的另一个机会是涉及不同地理位置的多个生产工厂。例如，罐可以在一个附近有充足粘土的工厂制造，而涂漆可以在有自然支持的炎热干燥地区进行。\n\
  \n图 11.3 显示了由于边缘 AI 的应用，为连接工厂带来的优势列表。\n\n![图 11.3. 连接工厂中边缘 AI 的优势。](img/bk978-0-7503-5593-3ch11f3_online.jpg)\n\
  \n**图 11.3.** 连接工厂中边缘 AI 的优势。\n\n边缘 AI 解决方案的目的是为产品提供预测性维护和制造辅助 [13]。如果开发了边缘 AI 解决方案，可以提升业务。此外，客户的反馈可以直接输入到去中心化系统中。\n\
  \n### 11.3.4 智能工具\n\n除了数字孪生和预测性维护外，制造行业还标记了若干 AI 辅助解决方案。涉及软件和硬件的工具结合了边缘级 AI 机制来提高效率。以下是制造领域生使用的\
  \ AI 辅助工具和解决方案：\n\n1. **错误检测工具**：AI 辅助边缘级解决方案已成为机器或工业过程中错误的关键解决方案之一。例如，机器上的灰尘可能会被人类忽略。然而，基于边缘\
  \ AI 的摄像头可以轻松检测到并通知用户。\n2. **自动化工具**：多个制造单元已采用机器人或软件机器人来对机器的功能进行推理。在某些情况下，机器需要进一步的指令或人工干预。这些交互可以通过机器人避免。例如，订单原材料从其他部门收集材料、主动决定生产所需的组件数量等，都可以由机器人自动处理。\n\
  3. **夜间工人**：机械工具带有边缘 AI 机制，可以在夜间交付结果。例如，清洁机器、清洁工作区、订购办公用品或耗品等由专用机器人工具在夜间完成。这样做可以避免工厂对照明的需求。此外，指定的任务（如清洁操作）可以在不干扰生产期间现有工作的情况下进行。\n\
  \n### 11.3.5 优化生产力\n\n边缘 AI 解决方案通常用于提高工业的生产力。它们被应用于两种广泛的方法：(i) 供应链优化和 (ii) 需求预测。本节详细介绍了这些提高工业生产力方法。\n\
  \n#### 11.3.5.1 供应链优化\n\n\n\n\n\n通常情况下，大型制造单元会收到来自全球各地各个地区的数万个订单。随着云制造技术的持续使用，少数潜在的优质制造商的订单量大幅增加。显然，手动向下属或连接机器发布指令并分配任务已变得困难。因此，边缘辅助\
  \ AI 解决方案在这些情况下将变得非常有用。\n\n以自动方式处理大数据系统对于任何基于 AI 的系统来说都不是困难任务。例如，一个大规模的计算机生产单元可以使用适当的时间戳和交付地图来跟踪已组装组件。通过这种方式，AI\
  \ 辅助软件可以轻松识别出购买此类计算机的客户。这种方法对于计算机出售给客户后更换其组件将非常有益。\n\n支持边缘的 AI 系统可以与区块链等技术相结合。这种结合可以提供与客户的直接销售交易或与生产者的购买交易。例如，AI\
  \ 辅助的区块链可以实现从农民那里直接购买大米，无需任何经销商或中间人。\n\n使用基于 AI 的辅助对供应链管理进行主动决策可以最大限度地减少交付时间。它可以根据预设规则完美地按时交货。这是因为与供应链操作相关的数据经过评估和主动预测，以理解操作中的潜在障碍或瓶颈。决策的主动性取决于供应链操作中执行的\
  \ AI 算法。例如，基于联邦学习的边缘智能由于区域数据的协作参与决策，可以提升供应链操作涉及的性能。\n\n### 11.3.5. 需求预测\n\n使用边缘-AI\
  \ 解决方案提高制造部门生产力的第二个因素是需求预测。许多制造工厂对产品的确切需求并不知晓。例如，由于需要学习大量数据，汽车制造商并不了解某个国家对特定型号的潜在需求。如兴趣、预算、国家通膨胀率、之前的购买数据、车主行为等细节可能会影响汽车的销售。\n\
  \n边缘-AI 系统可以让生产者了解特定产品的购买模式。这对一个国家的经济产生直接和间接的影响。例如，如果使用 AI 辅助系统预测购买模式和产品使用模式，国家的国内总值（GDP）增长将会增加，通膨胀率将会下降。注意的是，烟花或圣诞老人装等季节性产品的销售在每年的\
  \ 11 月和 12 月期间会增加。这种购买模式可以使用使用边缘-AI 算法针对区域数据集定制的基于 AI 的算法进行预测。北印度几乎不庆祝圣诞，而南印度则庆祝。\n\
  \n`[18]` 的作者通过收集工厂的实时需求细节为制造工厂设计了一种需求预测策略。\n\n### 11.3.6 交互式生产\n\n虚拟现实辅助的解决方案涉及边缘-AI\
  \ 算法，用于在制造部门创建交互式生产环境。虚拟现实技术有助于以模拟的形式开发制造原型。正如名称所示，虚拟现实形成了一个制造平台的虚拟幻象。如果制造商想对汽车仪表盘的修改进行实验，虚拟现实提供了一个查看它的平台。\n\
  \n对制造相关产品或整个产品的子产品进行原型设计提供了一个由边缘设备支持的 AI 辅助环境。制造相关产品原型设计的目的是为了在指定环境中验证并确定制造产品潜在的危害或稳定性特征。\n\
  \n工程师可以使用基于虚拟现实的解决方案对他们的新设计或原型程序进行实验。事实上，修改房屋的窗户位置可能会产生几个副作用，即光线可能不好，对环境中特定地点的视线可能会降低，声音水平可能会受到负面影响。在边缘辅助虚拟现实解决方案的帮助下，模拟环境可以改变房屋设计中窗户、门或其他照明条件的位置。\n\
  \n### 11.4 农业边缘-AI\n\n边缘-AI 在农业中是一种非常有益的支持机制。广而言之，农业相关应用分为两大类：(a) 与植物相关的农业和(b) 与动物相关的养殖。植物相关的农业是一个处理\
  \ AI 监测作物、土壤、植物及相关配件应用的类别，而动物相关的养殖确保动物更好的生活条件并对其进行监控。图 `11.4` 将农业应用分为两大类，并说明了本节将涵盖的主题。\n\
  \n![图 11.4. 边缘-AI 辅助的农业应用。](img/bk978-0-7503-5593-3ch11f4_online.jpg)\n\n**图 11.4.**\
  \ 边缘-AI 辅助的农业应用。\n\n#### 11.4.1 植物相关的农业\n\n试图增加作物保护和植物生长的农业植物植物农业。在农业中引入边缘-AI 解决方案的原因始于该领域对创新的需求。`[16]`\
  \ 的作者提出了一种基于 LoRa 技术收集信息并预测农业收益的农业管理系统：一种创新。主要农业相关应用需要创新的根本原因是对未来对可持续粮食作物的需求。\n\n\
  边缘-AI 被用于植物相关的农业以实现精准农业并增加相关的产量。有几个原因导致了拥有边缘 AI 的必要性，下文所述：\n\n1. **增加作物产量**：基于 AI\
  \ 的解决方案应用于农业以增加作物产量。为了这样做，需要收集有关生长环境、天气、作物状态等适当信息。使用这些信息，可以预测生产环境和买家。\n\n2. **成本最小化**：基于\
  \ AI 驱动的农业设置可以考虑到支出仔细选择杀农剂并优化肥料需求。例如，通过 AI 辅助无人机每天检测果实的成熟度，可以增加苹果或芒果的收入。同样，椰子使用专门的\
  \ AI 驱动的无人机进行收割而无需人工干预，稻田也组织起来报告杂草和害虫的每日状况。\n\n3. **自动灌溉**：如果天气预测预测某个地区可能会降雨，则没有必要向大公顷土地泵水。AI\
  \ 辅助系统可以自动驱动土地上的泵水系统，避免因为过量或近期的降水而浪费水。此外，AI 驱动的解决方案可以确定植物土地的地貌以检测灌溉所需的水。\n\n\n\n\
  \n\n### 4. 作物、土壤和水质监测\n大多数结合了 AI 的农业解决方案都得到了适当监测系统的支持。及时监测作物、土壤和水的健康状况至关重要。在某些情况下，水质并不适合植物生长。例如，在高\
  \ pH 值地区种植作物，其产量将无法达到预期。有多种方法可以应对水 pH 值的这种变化。AI 辅助解决方案可以防止作物受害并采取措施提高农业生产力。\n\n\
  ### 5. 病虫害检测\n用作蔬菜的嫩芽和较小植物容易生病。几乎所有的树木都需要每天或每周进行特别关注，以保护它们免受严重疾病或昆虫的侵害。事实上，所有者或农户很难追踪这些不同类的疾病。例如，印度南部的椰子树会遇到几种疾病：枯叶病、黄叶病、虫咬和毛毛虫咬。这些疾病可以被自动检测和预测，以便采取适当的治疗。\n\
  \n### 6. 可持续收割\n可持续收割是一种以自然方式处理农业的管理过程。例如，利用雨水、风能或太阳能泵站、天然肥料的利用等。在`[1]`中，作者研究了更广泛的组件（如无人机），以实现农业的可持续收割技术。\n\
  \n#### 11.4.2 农业\n改善动物、宠物和野生动物生活条件的农业被归类为动物相关农业。边缘 AI 技术可以通过多种应用于此领域。以下介绍了最常用的应用程序。\n\
  \n#### 11.4.2.1 动物保护\n边缘 AI 技术在保护动物免受危险方面仍然至关重要。可以在动物身上安装可穿戴设备，持续监测它们的活动并检测健康问题。相应的，可以将兽医部署到目标位置提供药物和维生素。同样，可以使用支持边缘的\
  \ IoT 解决方案对动物发出警告或防止遭受攻击。例如，可以通过自动产生蜂群的嗡嗡声将大象赶离攻击其他动物。\n\n#### 11.4.2.2 动物情绪检测\n\
  与人类情绪类似，动物确实以各种方式表达情绪。识别快乐、悲伤、愤怒等情绪可以维持动物福利，并保持它们在野外和家中的心理健康。由于家畜与人类生活在一起，检测它们的情绪至关重要。\n\
  \n最近，研究人员研究了大象的情绪。过去一直努力研究其他动物的情绪，如猫、狗、猪等。动物情绪检测是 AI 计算计算子领域。识别情绪的核心思想是使用 `CNNs`\
  \ 等复杂的深度学习技术研究动物的状态。事实上，心率、脑活动、面部表情和身体姿势等子参数可以提供有关动物心理状态的有价值信息。\n\n有几种深度学习算法可以检测动物情绪。例如，`CNNs`、`ResNet`、轻量级\
  \ `CNNs` 和 `YOLOs` 等算法可以根据预训练或自定义训练的模型预测动物情绪。如果向算法输入多模态信息，算法将提高预测准确性。特别，利用面部表情和鸣叫声检测大象的情绪可以轻松提高检测时的预测准确性。\n\
  \n动物表现出快乐、悲伤、愤怒、恐惧等情绪，`[7, 8]`。动物情绪检测包括心理学、生物学和兽医学。传统上，情绪是由经过训练的专业人员或动物所有者手动检测的`[11]`。通过根据情绪建议补救措施，动物可以在野外或家里过上和平幸福的生活。此外，可以在治疗动物的同时评估它们的情绪来监测药物。\n\
  \n动物情绪检测根据检测技术大致分类如下：\n\n*   **侵入式方法**：侵入式方法主要依赖于可穿戴传感器，收集实时采集的正常生物识别数据和生理指标。这种方法针对单个动物。该方法的主要缺点包括处理与情绪相关的大量传感器数据，并将其与动物特征进行实时映射。此外，检测群体动物的情绪是一项挑战性任务，因为可穿戴传感器通常安装在具有移动性的个体动物身上。\n\
  *   **非侵入式方法**：相比之下，非侵入式方法基于从面部表情、动物行为和身体姿势收集传感器数据。其中，动物的面部表情被广泛用于研究动物情绪。在非侵入式方法中，传感器安装在附近的墙壁、树木或房间架子上以捕捉动物的姿态。由于传感器是固定的，它们可以为情绪检测提供稳定数据。动物中最常用的情绪包括快乐、悲伤、恐惧、厌恶、中性等。如前所述，添加图像、文本、语音和视频帧等多模态输入数据可以提高预测的准确性。\n\
  \n#### 11.4.2.3 野生动物保护\n边缘 AI 系统有助于保护野生动物物种。通常，有几个计划和组织参与保护森林或野生动物。例如，游客中心已采取相关政策，为野生动物提供和平的环境，避免在整天打扰它们。在动物处于困境时，会有组织赞助活动。此外，组织在防止森林被人类塑料垃圾污染方面变得更加严格，这会对特定生物产生不利影响。\n\
  \n在森林中可以利用边缘 AI 解决方案来保护动物。如果进行实时监测，动物可以在新的地点或森林中进行康复。在某些情况下，由于水或食物短缺，动物必须搬迁，或者通过通知相关森林官员为其提供适当的食物。所有这些活动在边缘\
  \ AI 系统的帮助下增加了野生动物的保护。\n\n有时，特别是在洪水或火灾等自然灾害期间，必须通过评估偏远地区并确保辅助材料来保护森林中的动物。同样，森林官员也需要受到他们所保护的野生动物的伤害。因此，支持边缘的系统可以成为保护野生动物并在矛盾环境中平衡其生计的解决方案。\n\
  \n#### 11.4.2.4 人兽冲突解决\n人兽冲突不是新问题。它们已经存在几个世纪了。然而，通过杀死动物来解决此类冲突的传统方法减少了动物数量，特别是少数稀危物种。这是因为人类通过人口增长侵占了动物的生存空间。\n\
  \n\n\n\n人兽冲突在印度、肯尼亚、哥斯达黎加等热带国家非常突出。例如，大象会在晚上袭击人类。这是因为人们正在逐渐侵占森林区域以种植植物。同样，肯尼亚也发生了狮子攻击事件，因为那里经常有野生动物爱好者造访；加拿大也有若干新闻报道强调了熊袭击人类或警察守卫的事件。其中许多事件可以通过一种特殊的解决方案来防止，该方案可以自动通知人类危险。\n\
  \n传统上，人们采用提供电围栏的方法来防止大象进入村民的农场。然而，这些围栏已成为同一地区其他几种濒危物种的负担。诸如能够检测大象到达并启用电围栏的边缘 AI\
  \ 机制等可能是解决问题的方案。\n\n### 11.4.2.5 人兽交互\n\n在实践中，人类可以使用在小学或中学学习的对话进行相互交流。然而，动物并没有这种结构化的学习系统。显然，由于以下列出的原因，人与动物之间需要流畅的互动：\n\
  \n1. 工作分工：许多动物与人类一起工作。例如，狗保护人类并猎捕其他动物；大象根据象夫提供的指令搬运木材；驴被用于搬运重物等。\n2. 情感共享：动物是某些人类的压力释放源。许多人花费大量时间与猫、狗、鹦鹉等宠物互动。它们之间共享的反应和情感智能具有多种优势。\n\
  3. 治疗：动物被用于解决困扰人类的一些医学问题。例如，猫、狗、马等动物在人类面临压力时可以提供治疗。一些动物玩耍，鸟类鸣唱可以改善人类的情绪和健康。\n\n\
  边缘 AI 系统可以丰富人类与动物之间的互动关系。它还可以防止冲突。例如，如果大象饿了，它们可能会对人类造成物理伤害。这些潜在问题可以使用基于边缘 AI 的新颖解决方案进行识别、分析和通知\
  \ [6]]。\n\n### 11.4.2.6 动物品种检测\n\n动物品种检测是利用边缘 AI 系统的显著示例。对于人类来说，准确确定品种及其特征仍然很困难。随着边缘\
  \ AI 辅助技术的应用，视频可以捕捉信息并从数据集中工程化特征，从而轻松分类品种。例如，[10] 的作者设计了一种使用边缘 AI 对奶进行品种分类的方法。该方法对兽医人员或相关部门有所帮助。\n\
  \n### 11.4.3 用例：基于深度学习的大象情感检测框架\n\n最近，我们设计了一个实时预测大象情感的框架。该框架被集成到移动边缘设备（例如智能手机）中，帮助非动物专家的人接触大象。执行大象情感检测的想法是通过理解它们的心绪来增加大象的工作能力。该框架利用了标注的大象情感数据集。随后执行了目标检测和情感检测。\n\
  \n#### 11.4.3.1 传统方法\n\n传统上，目标检测任务由三个子任务组成：\n\n1. 区域选择：过去，利用解析视频帧的区域来检测大象所在的适当区域。这类似于模板匹配以及使用具有不同横比例和大小的滑动窗口来选择这些区域。事实上，这个过程需要大量的计算工作量和时间。\n\
  2. 特征提取：研究人员通常使用直方图或 Haar 分类器从图像中提取特征。过去也经常在从图像中提取特征时，避免遮挡、光照、背景噪声等潜在问题。\n3. 分类：传统上，利用\
  \ `SVM` 或类似的分类器对图像中的物体进行分类。尽管一些研究工作让市场感兴趣，但传统分类器为许多应用和研究人员保持了简单的处理步骤。\n\n#### 11.4.3.2\
  \ 深度学习方法\n\n深度学习模型在目标检测和跟踪中的应用为创新标记了独特的可扩展因素。它没有将训练限制在某些预定义的特征特征。相比之下，深度学习在自动化数据特征工程过程方面具有最稳健的表示。深度学习方法通过开发几种学习算法增加了覆盖范围，这些算法分为两阶段检测和单阶段检测阶段。`CNNs`\
  \ 对应两阶段检测，而 `YOLO` 对应单阶段检测器。\n\n与两阶段目标检测器不同，跳过区域建议过程导致推理时间缩短，这在执行实时预测时非常有价值。相对令人满意的准确性和低延迟是\
  \ `YOLO` 适合开发移动应用程序的原因。`YOLOv5` 继承了 `YOLO` 的优势，并在精度和检测多尺度物体的能力上进行了改进。不同深度学习算法的详细描述在\
  \ [2] 中进行了讨论。\n\n#### 11.4.3.3 边缘 AI 轻量化方法\n\n检测大象情感的边缘级智能是通过 IoT 和类似的高端技术实现的。IoT\
  \ 技术结合深度学习正在快速发展以实现自动化预测。它利用了将深度学习应用带给消费者的优势。这种实时预测可能通过减少边缘与云之间数据传输引起的延迟来实现。\n\n\
  在大象检测框架中，利用容器来提供轻量级解决方案。容器共享主机操作系统内核，仅包含运行应用程序所需的库和依赖项。这导致了更小的占用和更快的启动时间。作为一个 OS\
  \ 虚拟化软件平台，自包含容器解决了与相应系统的依赖问题。因此，使用 `Docker Compose` 等工具可以轻松创建、部署和运行应用程序。`Docker`\
  \ 避免了性能和成本开销，最终提供了更好的性能。它能够管理虚拟化过程，因此可以用于分发、部署和管理分配给集群的云边缘应用。\n\n#### 11.4.3.4 大象情感特征检测\n\
  \n情感检测方法由两个预训练的 `YOLOv5` 模型组成：(a) 第一个是在 COCO 数据集上训练的 `YOLOv5` 模型，用于检测大象。(b) 第二个是用带有七种情感特征标签的大象数据集训练的\
  \ `YOLOv5` 模型，标签为：`happy eye`（快乐眼睛）、`happy nose`（快乐鼻子）、`happy mouth`（快乐嘴）、`sad eye`（忧伤眼睛）、`sad\
  \ nose`（忧伤鼻子）、`angry eye`（愤怒眼睛）和 `angry ear`（愤怒耳朵）。\n\n一旦创建模型，通过遵循步骤检测大象情感：(i) 解析视频输入，(ii)\
  \ 将其切割成帧，(iii) 从帧中检测大象，(iv) 识别边界框及其位置，(v) 分类情感并评分，(vi) 列出得分并得出情感。整个框架涉及手机或边缘设备，在边缘节点上执行智能计算。\n\
  \n### 11.4.3.5 利用的指标\n\n\n\n\n为了评估大象情感检测相关的算法，我们使用了以下指标：(i) 精率（公式 (11.1)），(ii) 召回率（公式\
  \ (11.2)），以及平均均值（mAP）（公式 (11.4)）。\n\n```\n$${precision} = \\\\frac{\\\\mathit{TF}}{\\\
  \\mathit{TP} + \\\\mathit{FP}}$$\n```\n(11.1)\n\n```\n$${recall} = \\\\frac{\\\\\
  mathit{TP}}{\\\\mathit{TP} + \\\\mathit{FN}}$$\n```\n(11.2)\n\n```\n$${accuracy}\
  \ = \\\\frac{\\\\mathit{TP} + \\\\mathit{TN}}{\\\\mathit{TP} + \\\\mathit{FN} +\
  \ \\\\mathit{FP} + \\\\mathit{TN}}$$\n```\n(11.3)\n\n```\n$${mAP} = \\\\frac{\\\\\
  sum\\\\limits\\_{i = 1}^{N}\\\\mathit{AP}\\_{i}}{N}$$\n```\n(11.4)\n\n其中真阳性（`TP`）意味着预测为是且实际输出也是是的的情况；真阴性（`TN`）意味着预测为否且实际输出也是否的情况；假阳性（`FP`）意味着预测为是但实际输出为否的情况；假阴性（`FN`）意味着预测为否但实际输出为是的的情况；`AP`意味着平均精度；`N`意味着类别数量；`TP`意味着真正例数量；`FP`意味着假正例数量；`FN`意味着假负例数量。\n\
  \n### 11.4.3.6 基于 YOLO 的实现细节\n\n为了实现并捕获大象情感，利用实时摄像头。此外，由于大象在许多地理位置很少见，还考虑了 YouTube\
  \ 链接上的可用视频来预测情感。在工作中，利用 `Pytorch` 框架开发了深度学习算法。捕获的视频（无论是实时筛选视频还是离线视频）都使用 `OpenCVPython`\
  \ 包进行解析和提取。整个框架被集成到手机中，这是一种边缘设备。\n\n在工作中，利用 `YOLOv5` 作为单阶段检测器来研究大象的情感。首先，需要创建一个捕捉大象情感的数据集。数据集的准备使用了标签对情感进行标注。在上述工作中，我们利用\
  \ `labelImg` 软件来创建标签。通过该软件，我们可以创建边界框将其标记为不同的类别。在这里，为了检测大象的情感，大象的面部被标记为快乐、悲伤、恐惧和愤怒。\n\
  \n由于熟悉深度学习的基础，众所周知的是最初需要使用算法进行训练阶段来研究大象的情感。为了做到，在实现中导入了 `Python` 包。\n\n```python\n\
  import torch\nimport torch.distributed as dist\nimport torch.nn as nn\n```\n\n同样，导入了\
  \ `YOLO` 模型来训练大象的情感，如下：\n\n```python\nfrom models.yolo import Model\n```\n\n在设置了所需的配置参数和训练模型保存路径后，按照指定的轮数（epochs）对大象情感进行训练，如下：\n\
  \n```python\nfor epoch in range(start_epoch, epochs):\n    callbacks.run('on_train_epoch_start')\n\
  \    model.train()\n```\n\n实现使用 GPU 辅助的 `CUDA` 编程进行了并行化，并在任何时间通过检查点中的指定状态保存训练模型，以便可以从训练阶段的任何点重启。在基于\
  \ `Python` 的实现中，检查点和 `YOLO` 模型保存方式如下：\n\n```python\ntorch.save(checkpoint, state)\n\
  ```\n\n一旦完成训练，训练的模型将存储在文件夹中，以便用于进一步的测试或验证。训练和测试过程被脚本化，只需运行命令即可训练和测试数据集。例如，使用以下命令激活训练和测试功能：\n\
  \n训练：`python train.py --data data/elephant.yaml --cfg models/yolov5s.yaml --batch-size\
  \ 64 --name Model --epochs 2000`\n\n测试：`python detect.py --source Elephant --weights\
  \ Model.pt`\n\n可以观察到训练活动是针对标记数据集的大象图像进行的。训练阶段需要模型名称和开发模型所需的迭代次数。\n\n随后，模型被转换为轻量级的\
  \ `TFLite` 模型，以便将其迁移到小型边缘支持设备以进行进一步推理。在测试阶段，通过使用移动设备捕获大象的情感来实时推理。\n\n### 11.5 用于法医学的边缘\
  \ AI\n\n法医学是一门利用技术和机制调查犯罪情况的科学。传统上，通过法医科学家采用人工程序来检测犯罪相关的调查。然而，随着人工智能和边缘智能的出现，法医学成为了识别犯罪分子或犯罪场景的坚实表现\
  \ [12]。技术协助法医科学家轻松地检测各种情况。\n\n#### 11.5.1 法医学应用\n\n尽管法医学很重要，但最好评估人工智能可以发挥关键作用的可能情况。为此，分析了以下几类法医学应用列表：\n\
  \n1. **现场分析**：在现代物联网技术的帮助下，可以进行犯罪现场检测并调查犯罪情况的概率。人体组织、头发、血液等与生物因素相关的证据可以使用深度学习辅助的解决方案进行追踪。同样，与轮胎压力或犯罪分子足迹相关的证据，如果发生了潜在的变化，肉眼无法轻易追踪。检测犯罪分子的指纹和血迹至关重要。可以开发基于物联网的解决方案或基于虚拟现实的元宇宙解决方案，以使用边缘辅助的\
  \ AI 解决方案进行具有可解释性的准确检测。\n\n2. **数字法医学**：数字法医学是科学的一个分支，需要智能从犯罪相关数据中学习。此外，它还必须处理数据存储和保护的方法。事实上，数据可以有多种格式，如文本、语音、视频或图像。边缘级节点处传感技术的应用能够更快速地调查网络犯罪。为了在法医学中保护数据和发现，区块链辅助\
  \ AI 技术被用于数字法医学。\n\n3. **情感/谎言检测**：在应用边缘 AI 解决方案时，可以通过足够的证据跟踪并回放面部表情。通常，人类大脑有两个主要部分：左半球和右半球。左半球用于分析，右半球负责创意。表达犯罪场景真相会将眼睛向左转，以从左半球收集信息，而由于犯罪行为企图撒谎的人会经常向右方向移动眼睛。这意味着该人想要在创意情境中创建一个新故事。如果警察调查人员不够熟练，谎言可能无法被正确检测。然而，边缘\
  \ AI 解决方案可以轻松捕获此类因素并提供可解释的证据。\n\n\n\n\n## 4. 手写/笔迹分析\n\n自杀通常在受害者留下的笔记方面有特定的证据。自杀者死前提到的死亡原因的自杀遗书或笔迹被法医科学家视为至关重要的证据。然而，由于各种因素的影响，他们正确分析这些书写内容的变得极其困难；例如，处于恐惧或压力下的人可能无法正常书写。因此，需要边缘\
  \ AI 辅助的算法来正确地分析自杀遗书或遗信的手写笔迹。\n\n### 11.5.2 边缘 AI 要求\n\n尽管边缘 AI 有许多优势，但支持法医鉴定的平台在设计时应当能够保护数据或证据免受潜在违规者的侵害。处理数据的学习模型或预测引擎不应将数据传输给第三方提供者，包括云服务器。因此，边缘\
  \ AI 解决方案被广泛的研究人员和从业者信服地接受。\n\n参与分析犯罪现场证据的边缘设备必须受到良好保护，防止受到安全攻击或恶意软件的侵害。否则，可能会做出错误的决策，从而导致错误的定罪和监禁。这不仅会影响个体的心理健康，也会影响受害者的家属。\n\
  \n通常情况下，边缘 AI 解决方案可能会提供错误的推断或证据。得出此类决策的解释性可能存在缺陷或不准确。显然，结果可能导致失败。为了防止未来的影响，所有证据和推断都需要妥善记录，并保存在具有区块链等强健技术的专用数据存储单元中。区块链技术通过利用计算节点网络提供无需信任的环境，拥有一种防止数据篡改情况的方法。\n\
  \n边缘 AI 系统必须与传统的法医机制良好集成。例如，来自法医科学家的输入必须集成到现有的训练模型中。此外，模型必须符合法医科学家所用工具或设备的内存大小。为法医鉴定设计的边缘\
  \ AI 系统将需要支持尽可能多的通信协议，以提供足够数量的服务。\n\n涉及云提供者的服务必须支持向科学家或用户传递适当的信息。过去一直存在研究云特定法医信息的努力。研究人员已经开发了许多工具和库，它们可以从虚拟信息的磁盘中提供必要的信息，以分析犯罪现场或数据。同样，边缘\
  \ AI 系统还需要捕捉被删除或移动到其他存储库的云特定数据。此类数据可以是提供证据的宝贵来源。\n\n### 11.5.3 边缘 AI 法医鉴定：阶段\n\n\
  将边缘 AI 应用于法医鉴定是在多个阶段进行的，特别是当涉及处理数据和从犯罪现场收集证据时。通常，使用边缘 AI 系统执行法医鉴定的某种更具通用性的方法列举如下：\n\
  \n*   **资源识别**：使用边缘 AI 支持的平台进行法医鉴定的第一阶段是定义需要参与的资源。可能需要少量资源来评估云特定设备，其他一些资源可能用于评估边缘特定的网络设备，某些连接传感器的资源可能被用于收集分析数据等。因此，理解在检测犯罪现场可能需要的各种资源至关重要。\n\
  \n*   **数据收集**：下一步是使用更靠近犯罪现场的传感器或类似技术收集所需的数据以分析证据。传感器连接到支持边缘的设备，以便更快地处理数据并过滤无关数据。此外，与云服务或第三方提供者相关的数据需要带有足够的索引和存储表现进行收集，以备未来分析。\n\
  \n*   **数据存储**：在建立足够的证据后，相关数据和细节必须妥善记录并存储在可重复的存储单元中。大部分文档必须以法律术语和法院相关的法律事务所术语书写，以便律师和检察官能够恰当地地表达边缘\
  \ AI 支持的证据。必须特别注意数据的高安全性和复制性。此外，由于案件在法院判决后仍可能发生分歧，此类数据存储的期限必须比 15 到 30 年长。\n\n*\
  \   **证据交付**：边缘 AI 支持法医鉴定系统的最后阶段是以法律格式交付结果。证据的展示对从业者和法医科学家来说应该是用户友。如果可能，证据的交付必须在各个层面进行，标记解释性所涉及的复杂性。例如，公众不想了解犯罪证据的具体原因，而科学家则需要关于此类证据的信息以及防止未来发生的应对措施。此类证据的交付应该引发未来的创新，并作为处理犯罪体验的一部分应用于系统。\n\
  \n### 11.6 用于移动出行/物流的边缘 AI\n\nAI 辅助解决方案在繁忙城市执行移动出行或物流时已大有益。例如，交通管理、智能车辆通信、自动驾驶车辆、物流规划、共享移动出行、分布式产品发布等，已经通过智能或学习辅助得到了丰富\
  \ [9]。边缘 AI 解决方案在交通部门的重要性在于交付敏捷的推理和创新的产品化。本节详细介绍了边缘 AI 在交通部门的四个广泛应用。\n\n#### 11.6.1\
  \ 智能移动出行\n\n智能移动一直是智能城市中的一个重要因素。印度已旨在加强 100 个不同地区的智能城市。普通城市与智能城市的主要区别在于提供了协助城市居民的海量支持功能。智能城市的智能出行有不同的应用维度：\n\
  \n1.  **交通流管理**：边缘 AI 支持的应用可以自动驱动繁忙街道的交通管理。传感器需要安装在路角，支持边缘设备的智能算法可以在控制车辆流量时执行智能操作。当紧急车辆在繁忙时段需要通过时，智能也可以自动化交通流。\n\
  \n2.  **停车指示**：在许多城市中，有很多驾驶员在开车时看不见的停车区域。边缘 AI 支持的停车场识别系统可以检测空空位，并考虑到达停车目的地的时间和城市偏好。这不仅有利于驾驶员，也有利于城市，防止大量车辆在繁忙街道上转转寻找车位。\n\
  \n\n\n\n\n### 3. 噪声控制\n\n智能出行通过稳健的通信介质确保车辆之间的有效通信。近期，5G 网络利用率的提升为车辆在城市或街道盲区进行通信铺平了道路。这种车联网（V2V）通信概念在没有边缘\
  \ AI 解决方案的情况下，也能自动控制车辆速度并防止潜在事故。如果能够在城市或国家的所有地区定期提供边缘 AI 辅助解决方案，那么在整个街道上一直按喇叭的行为可以减少到可以忽略不计的水平。\n\
  \n### 11.6.2 共享出行智能\n\nCOVID-19 为交通领域带来了许多创新，因为 COVID-19 患者被与公共交通隔离开。事实上，每个国家都在推广共享出行，即来自不同社区和区域的多个乘客在同一辆车辆（如公交、出租车、火车或飞机）中旅行。通过鼓励公民使用与私家车便利性有限的公共交通，国家获得了经济上的改善。\n\
  \n传统的共享出行原则面临许多挑战：(i) 无法在共享车辆中追踪隔离患者；(ii) 由于技术不可用，不同部门（如司法部门、警察部门、社会保障部门、医院等）之间的协作未能得到内在实践；(iii)\
  \ 车辆之间的通信和设备处理能力不足以应对现实情况；(iv) 共享车辆的利用率低下等。\n\n由边缘 AI 和区块链辅助的共享出行近期在交通领域引起了关注。例如，最近提出了一种基于区块链的共享出行（BESM）架构，用以增强共享出行概念的功能\
  \ [4]`。该架构的概述是建议居民在考虑区域空气污染状况和 COVID-19 状态的情况下，乘坐共享车辆进行旅行。执行此类座椅分配的背后的思想是在考虑人类健康状况的基础上，通过更高的智能性提高共享车辆的效用。\n\
  \n为了实现这一点，边缘 AI 系统应该捕捉城市或街道特定时间内可用共享车辆的细节以及对这些车辆的需求。此外，需要启动带有创世区块的区块链账本，以便将座椅分配交易记录在区块链账本中。为了在账本中记录信息，需要收集旅行者位置的经纬度、旅行目的地位置、健康信息、旅行目的地当前的空气质量信息等，并在区块链中进行处理。显然，这些信息将在所有旅行点之间迭代共享，以区域性计算共享车辆中的可用座椅数量。因此，涉及连接参与者（包括交通管理部门和医院）的多个参数参与了旅行者共享车辆座椅分配的决策。关于该架构的更详细信息（包括边缘\
  \ AI 解决方案或用于共享车辆座椅分配的算法）请参阅 [4]`。\n\n### 11.6.3 物流规划\n\n智能城市中的自动化服务是城市当局的首要任务之一。物流规划和自动交付服务是智能城市自动化流程的一部分。边缘级智能通过监控和分析数据，在执行自动化过程中发挥了至关重要的作用。其主要目标之一是提高资源利用率并优化城市中物流相关的旅行。\n\
  \n井盖检测和物流规划是物流规划下的两个应用。事实上，井盖容易发生故障，特别是在雨季节。井盖水位上升的可能性很大，从而导致排水溢出。或者，手动监控和物流规划以清理满载的管道是一项艰巨的任务。因此，过去开展了工作，研究在规划井盖维修物流时优化和智能化的应用。\n\
  \n井盖检测和物流规划系统由监控井盖深度的传感器组成。为此，在井盖盖板下方安装了超声波传感器，用于检测障碍物之间的距离。传感器数据使用边缘设备进行收集和处理。设备自动解析数据并进行预处理，使得只有相关数据被提交到云端或分层计算节点。\n\
  \n在系统中，有三个服务受益于云端资源的辅助。这些服务列如下：\n\n*   井盖水位指示服务：该服务从连接到水位传感器的边缘节点收集井盖水位。\n*   物流规划器服务：该服务的目的是收集交通细节和可用资源，例如交通工具、人力（如有）等。\n\
  *   调度器服务：该服务拥有代码，可以根据调度算法基于智能城市信息和井盖水位调度资源。在工作中，利用了阈值接受算法来规划在城市中执行物流的计划。\n\n###\
  \ 11.6.4 产品陈列\n\n智能出行不仅针对车辆或相关服务。它在室内交通中也可以发挥关键作用。例如，城市中的购物中心日益增多，小商店正被这些购物巨头挤出。人们更倾向于从此类购物场购物，因为他们可以获得价格较低的产品，并且逛街时可以享受一整天。\n\
  \n室内环境中大型购物中心的交通和物流规划可能是一个具有挑战性的方面，因为过程中涉及多个约束。特别是，商店希望在运营期间获得业务并吸引客户。例如，在购物中心的展柜空位放置产品是吸引客户和增加业务收入的必要步骤。这一过程需要边缘\
  \ AI 与商场设备之间的强纽带。\n\n过去，一种使用 LiDAR 传感器开发了店内产品陈列方法 [5]`。该方法背后的想法是快速识别超市展柜中的空位，并根据客户偏好进行更换。事实上，这个想法非常适合大型购物中心，商店员工无法跟踪空缺产品或客户偏好。此外，当客户人数增加时（特别是圣诞节或排灯节假期），该方法可能会大有益处。\n\
  \n### 11.7 结论\n\n市场上数万计的边缘 AI 应用。它们开发于医疗保健、工业、农业、交通、数字取证等各个领域。本章描述了研究人员或从业人员正在实验的潜在边缘\
  \ AI 应用。本章展示了一种涉及基于边缘手机检测大象情绪的方法。此外，本章还展示了一系列新想法，以便读者可以使用本书之前章节中讨论的框架或编排平台来探索此类想法的应用。\n\
