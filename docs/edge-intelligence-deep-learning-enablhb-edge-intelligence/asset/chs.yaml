  \ 基于学习的 *IEEE Trans. Circuits.*\n\n\n\n\n\n例如，文字处理应用可以根据用户的习惯预测句子中的偏好词汇。为了实现这一点，用户利用边缘设备开发模型，并以加密方式将提取的特征传输到云端。云端收集来自不同终端用户的模型片段，以开发更健壮且预测更精的的学习模型。随后，边缘层模型可以使用云端更新后的学习模型进行更新。通过这种方式，预测或分类是基于结合了靠近用户的数据和来自各种位置的泛化观察而开发的联合学习模型。[7]\
  \ 的作者研究了将学习模型从传统机器学习转换为分布式系统的适用性。\n\n### ## 4.2.1 联邦学习架构\n\n通常，联邦学习（FL）架构涉及多个边缘层节点，基于区域数据源进行学习。观测到的特征被传输到云端，以汇总的方式泛化这些结果。\n\
  \n图 4.1 展示了一种通用的联邦学习架构。在这里，可以观察到全局学习模型是通过包括边缘层节点在内的多个计算节点的参与创建的。来自边缘位置的本地数据用于创建本地模型。随后，这些模型与基于云的中央云集群共享以生成联邦学习模型。该模型聚合了来自多个本地计算节点的信息。\n\
  \n![Figure 4.1. FL: a generic architecture.](img/bk978-0-7503-5593-3ch4f1_online.jpg)\n\
  \n**图 4.1.** 联邦学习：一种通用架构。\n\n### ## ## 4.2.2 联邦学习方法\n\n广义上，我们可以将联邦学习机制分为后续章节讨论的三种大类方法。\n\
  \n#### ### ### 4.2.2.1 数据/模型传输方法\n\n在大多数情况下，数据或模型在支持边缘的学习设备与中心化的云服务器之间传输。根据传输信息的不同，联邦学习的形式有所不同。例如，如果跨设备传输模型参数而不涉及及数据，则属于横向联邦学习。在这种情况下，使用区域数据集进行独立训练。因此，模型参数足够传输到去中心化的边缘设备；如果分布式边缘学习节点的训练数据集与模型参数无关且保持相同，则属于纵向联邦学习。在这种情况下，训练数据集在所有区域均保持一致。然而，根据需求，不同位置使用的预测组件可能会有所不同，如果跨边缘设备传输模型以执行学习过程，则属于模型传输型联邦学习。\n\
  \n#### ### ### 4.2.2.2 元信息传输方法\n\n在特定情况下，不需要跨边缘节点传输模型或数据集。传输这些内容可能成本太高。在元信息传输方法中，联邦学习机制仅在去中心化的边缘节点之间传输少数元数据集或模型。通过这样做，可以最大限度地减少设备之间的通信延迟。然而，这种联邦学习方法并不适用于某些应用程序或用例。\n\
  \n元信息传输方法要求底层网络在本质上是分层的，即需要分层的连接计算网络架构层来处理元信息。\n\n#### ### ### 4.2.2.3 奖励特定联邦学习方法\n\
  \n在开发学习模型的同时奖励学习智能是联邦学习的另一种特定类型。在奖励特定的联邦学习方法中，当算法在不同数据集上表现良好时会提供奖励。通常，学习算法的准确性（特别是在去中心化的联邦学习环境中）取决于联邦位置所利用的数据。这意味着奖励可能会根据输入联邦学习系统的数据而变化。\n\
  \n### ## 4.2.3 联邦学习挑战\n\n尽管联邦学习对于利用边缘节点开发去中心化学习模型非常有益，但它面临着一些挑战。图 4.2 描述了过去研究人员提出的这些挑战。\n\
  \n![Figure 4.2. Challenges of FL.](img/bk978-0-7503-5593-3ch4f2_online.jpg)\n\n\
  **图 4.2.** 联邦学习的挑战。\n\n这些已挑战的详细说明如下：\n\n1. **模型收敛**：模型的收敛是联邦学习的一个具有挑战性的方面。这是由于模型必须在去中心化的计算设备之间表达发现或共享提取的特征。模型的格式不匹配或配置问题可能会在开发联邦学习模型时导致异常行为。在个性化联邦学习框架中观察到了这一点，正如\
  \ [13] 中研究的那样。\n\n2. **模型拖节点问题**：联邦学习框架面临的问题之一是模型拖节点问题（straggler problem）。通常，我们了解到模型分布在跨越多个区域的多层级计算基础设施上。这些计算节点在处理集体智能时可能具有不同的处理速度，即从不同的边缘节点更新本地模型可能会有多个完成时间。这种情况可能会导致模型拖节点问题。该问题过去已被几位研究人员广泛研究。例如，[16]\
  \ 的作者应用了如粒子群优化（`PSO`）等优化算法来缓解联邦学习框架中的拖节点问题。\n\n3. **设备异构性**：以分布式方式实现学习模型的设备异构性可能会带来许多问题。例如，边缘层设备具有各种功率限制或通信协议，如\
  \ `WiFi`、`5G` 或蓝牙。同样，并非所有设备都完整加载了用于执行学习算法的软件包包。因此，在这些设备上执行任务时，任务完成会有大量的延迟或出现性能问题。\n\
  \n4. **模型传输延迟**：学习模型分布在各个设备上可能会可能会不同的传输延迟。传输延迟取决于通信和机器的响应时间。例如，基于 `Jetson Nano`\
  \ 的边缘设备处理模型部分的速度可能比基于 `Espressif ESP` 的处理器快。将学习模型传输到中央计算机器的延迟会阻碍联邦学习系统中开发模型的性能。\n\
  \n5. **安全挑战**：在联邦系统中，在将结果传输到中心化学习系统时，存在入侵者修改模型的高风险。除了几种常见的网络相关安全挑战外，联邦学习环境还面临影响学习模型的挑战。一些作者已经研究了可能在联邦学习框架中发生的所有安全攻击\
  \ [8]。\n\n### ## 4.3 DNN 分割\n\n边缘智能可以从拆分计算的概念考虑。在拆分计算中，深度学习算法的隐藏层被分成若干部分，以便计算分布在分布式计算节点上。与可扩展的云单元相比，这些计算节点通常非常廉价。[9]\
  \ 的作者解释了可以应用于基于深度学习算法应用程序的拆分计算方法。\n\n### ## 4.3.1 DNN 分割：架构概念\n\n\n\n\n当客户端有大量处理请求时，DNN\
  \ 分割是非常有效的。通过这种方式，深度神经网络层被分布到比联邦学习（FL）框架更多的边缘计算节点上。显然，在划分计算框架中，计算、内存和带宽的利用率高于原生\
  \ FL 框架 [1]。\n\n图 4.3 显示了划分计算的概念，即使用相关框架将 DNN 分割成若干部分。\n\n![图 4.3. 分享计算：概念图](img/bk978-0-7503-5593-3ch4f3_online.jpg)\n\
  \n**图 4.3.** 分享计算：概念图。\n\n事实上，DNN 分割的诞生是因为边缘计算系统遇到的困难。边缘节点通常是廉价且由电池供电的。许多研究人员指出，对于物联网支持的应用，需要边缘计算方法而非云端。这是因为边缘节点能够防止隐私泄露并减少网络流量。然而，在这些边缘节点上执行大量指令证明是一项艰巨的任务。因此，研究人员设计了\
  \ DNN 分割的概念，将与深度学习算法相关的计算分布在廉价的边缘节点上 [6]。\n\n## 4.3.2 划分计算的类型\n\n划分计算根据深度学习算法分布模式的识别，或根据决定划分操作的时间进行分类。我们理解为划分计算必须将深度学习算法中的计算单元分配到多个去中心化的计算节点，包括异构的边缘级节点。\n\
  \n### 4.3.2.1 基于分布模式\n\n划分计算在识别需要分布到可用边缘或云节点的计算部分后，必须分配计算单元。根据分布模式，划分计算分为两大类：\n\n\
  *   **按层分布 (Layer-wise distribution)**：在按层代码分布中，划分计算框架必须识别深度学习算法合适的切层。切层的决定取决于若干边缘节点的可用性或节点的计算能力。例如，考虑到每层的计算强度以及如\
  \ `Jetson Nano` 或可扩展云节点的可用性，一个 53 层 darknet53 CNN 算法可以被分成若干较小的计算块。\n\n    通常，切层取决于层数的负载需求以及能够执行计算的已识别边缘节点。\n\
  \n    例如，假设一个基于 CNN 的深度学习算法需要执行特定层的划分计算。一个特定的 Tensorflow 实现需要如下加载所需的模块：\n\n```python\n\
  import tensorflow as tf  \n\nfrom tensorflow import keras  \n\nfrom tensorflow.keras\
  \ import layers  \n\nfrom keras.models import Sequential  \n\nfrom keras.layers\
  \ import Dense\n```\n\n    接下来，加载数据集后，必须定义模型。有关 CNN 算法的细节请参考 [2]。\n\n```python\n\
  model_def = models.Sequential([  \n layers.Dense(256, activation='relu'),  \n layers.Dense(128,\
  \ activation='relu'),  \n …  \n …  \n layers.Dense(10, activation='softmax')  \n\
  ])\n```\n\n    为了执行划分操作，可以将层划分并分布到若干边缘级节点，如下：\n\n```python\nsplit-level1 = models.Sequential(model.layers[1:2])\
  \  \n\nsplit-level2 = models.Sequential(model.layers[2:3])  \n\nsplit-level2 = models.Sequential(model.layers[3:4])\n\
  ```\n\n*   **按模块分布 (Module-wise distribution)**：在按模块分布模式中，层不是通过识别切层来分布的，而是基于识别的模块进行分布。例如，一个学习算法经历几个阶段：(a)\
  \ 导入库，b) 加载数据集，c) 数据预处理，d) 划分训练和测试数据，(e) 训练 CNN 以及 (f) 显示结果。每个阶段可能有若干子划分。值得注意的是，CNN\
  \ 可以有多个子操作，例如：(a) 定义 CNN，b) 添加激活层，c) 最大/平均池化，d) 展平，(e) 执行全连接层操作，(f) 执行 softmax 操作，(g)\
  \ 编译 DNN 和 (h) 显示结果。通常，有若干功能模块可以由多个边缘节点或计算设备（包括云服务器）执行。如果这些计算划分是基于识别的模块进行的，那么划分计算在深度学习中被归类为按模块分布。\n\
  \n## 4.3.3 动态与静态\n\n划分计算中的切层以及确定切层的策略可以在运行时或在执行应用程序之前决定。根据决定时间，划分计算分为两种：\n\n*  \
  \ **动态划分计算 (Dynamic split computing)**：在这里，深度学习算法的切层是在执行边缘 AI 应用期间决定的。通常，研究人员根据需要执行的指令数量和底层硬件的计算能力来决定层。例如，`Jetson\
  \ Xavier` 或类似的处理板具有足够的计算能力，而 `ESP32` 板没有足够的处理能力。根据关于底层硬件的可用知识，划分计算框架决定切层并将计算单元传输到边缘级硬件单元。此外，设备在执行某些操作时可能会关机。根据计算节点的可用性，框架可以减少层数，也可以扩展必须在计算节点上执行的深度学习层数。此类决策的主要优势是：(i)\
  \ 可以根据节点的可用性决定切层的灵活性；(ii) 可以根据计算能力的可用性将计算分布到强大的边缘设备以加速计算。然而，这种方法的缺点是在执行边缘 AI 应用期间，在决定切层和计算设备时存在巨大的开销。\n\
  \n*   **静态划分计算 (Static split computing)**：在这里，划分层是预先决定的，无论关于计算节点的知识。深度学习算法的切层可能以奇特的方式或通过切割次数确定。例如，如果\
  \ 53-CNN-DenseNet 算法必须进行静态划分，则计算可能被分为两个等份，即第 1 到 26 层将在一个边缘节点上处理，其余层将在另一个计算节点上执行。可见，静态划分计算在确定可用边缘节点数量或计算节点执行应用程序的能力方面缺乏动态性。显然，这些应用程序的完成时间将更慢，与之前的划分计算方法相比，框架的资源利用效率不会那么。\n\
  \n## 4.3.4 划分计算的优势\n\n划分计算并没有取代边缘计算。然而，划分计算的本质在于从廉价计算节点（包括移动设备）上执行昂贵的深度学习算法的计算优势。实践划分计算的几个显著优势列如下（见图\
  \ 4.4）：\n\n\n\n\n\n-   **隐私**：划分计算在提高应用隐私方面与边缘计算有共同目标 [5]。例如，涉及人类的视频或图像处理应用不希望与云服务共享其图片。它们更倾向于让数据存储在本地节点上，如手机或笔记本电脑。人们不希望在互联网上共享面部图像或个人图像的主要原因之一是避免处理不当的问题。例如，互联网用户可以修改在线图片，并利用它们开发有趣的漫画，或叙述虚假新闻或关于名人数据集的词汇。显然，避免此类情况是强制性的。同样，在学习分析领域，IoT\
  \ 系统被设计用于评估学生的情绪以提高他们的学习能力。在这些应用中，如果学习算法在远程位置的单机上执行，安全性可能会面临挑战。\n\n-   **客户端计算**：大多数应用程序倾向于在边缘处理客户端请求，而不是在远程位置。在边缘处理客户端请求时，主要的关注点之一是加速客户端涉及的过程。\n\
  \n-   **数据压缩**：在划分计算环境中，传输中间层的学习结果时会遵循数据压缩。引入压缩的主要目标是最小化通信开销。它增加了分布在边缘节点或本地计算设备（包括手机）上的学习层的网络带宽。特别是当考虑到反馈辅助自然语言处理应用或计算机视觉相关问题时，在边缘-云计算节点或边缘-边缘计算节点之间需要传输大量数据。与边缘-边缘计算节点相比，边缘-云计算节点之间预计会有较大的延迟。因此，在执行深度学习分析的同时开发数据压缩技术可以提高应用的网络带宽。\n\
  \n-   **资源利用**：划分计算允许所有可用的边缘服务器执行操作。许多较小设备参与处理学习算法的部分。在某些基于划分计算的应用中，与云服务器相比，使用了许多边缘节点。例如，一个基于\
  \ IoT 的学习分析应用可能涉及五到十个云服务器和二十多个边缘服务器。这些边缘服务器在执行应用时可能被部分或完全利用。在大多数可用的划分计算工具中，仪表板设计用于执行应用时检查边缘服务器、本地服务器和云服务器的利用率。此外，Kubernetes\
  \ 或类似的编排平台仍然创建可扩展计算环境的组件组成。\n\n![图 4.4. 划分计算的优势。](img/bk978-0-7503-5593-3ch4f4_online.jpg)\n\
  \n**图 4.4.** 划分计算的优势。\n\n### 4.3.5 划分计算：工具 \n\n有几个工具实现了深度神经网络层的分划分过程。`SplitFed`\
  \ 和 `SplitLearning` 的细节将在接后的章节中讨论。尽管这些工具的总体思想相同，但在执行划分或组织资源以边缘节点上执行计算时，关键工作函数有所不同。\n\
  \n所讨论工具旨在增加训练时间并缓解长板问题。通过将层划分到计算成本低廉的边缘设备上，增加了训练时间。通过仔细选择计算资源，避免了由于设备速度不一而导致的任何长板问题。\n\
  \n#### 4.3.5.1 SplitFed\n\n`SplitFed` [15] 使用 `Python` 开发。在 `SplitFed` 中，神经网络被划分并分发到客户端节点之间。创建划分的层是\
  \ `cut` 层。在 `SplitFed` 工具中，建模结果的聚合并不是在服务器端进行的。相反，单个客户端负责对结果进行加权并进行聚合。这种方法的优点是减少了服务器端的计算负载，因为服务器正忙于其他任务。在本书编写时，该框架已使用\
  \ ResNet 进行演示 [9]。\n\n#### 4.3.5.2 SplitLearning\n\n通常，在几种划分计算实现会将神经网络层分布到分布式计算机器中。几乎所有可用的实现（如\
  \ `SplitFed`）都处理了卷积神经网络。它们尚未重点讨论涉及时间序列数据的模型。在 `split learning` 中，处理时间序列数据序列的神经网络被划分成中间层。在特定的学习层，神经网络被划分并分配给代理。代理负责执行分配的层并将结果提交给工具的服务器。循环神经网络在前向传播和反向传播步骤中涉及的学习过程是反向执行的。在每一步中，神经网络的层在被\
  \ `SplitLearning` 工具的学习代理处理之前，会被划分成中间学习层。\n\n### 4.4 迁移学习\n\n学习任务以多种形式执行。一种具有历史意义的独特方法是迁移学习。通常情况下，迁移学习是从以前学习的任务中学习对象或主题的过程。它是机器学习技术的一个分支，当存在相似任务时，它可以提高新任务的学习速度。\n\
  \n#### 4.4.1 传统观点\n\n事实上，迁移学习的概念源于人类心理学。儿童从父母和学校老师那里学习大量信息。人类从文明社会或经验丰富的人士那里学习主题。在所有这些学习过程中，知识被轻松从一个人转移到另一个人。通过这样做，学习者在某个学科或领域以比通常更快提高了学习曲线。\n\
  \n\n\n\n\n在机器学习领域，由于人类无法在不同领域学习海量数据，因此引入了迁移学习（transfer learning）。在迁移学习中，模型为一种上下文创建，并被用于另一个学习上下文。迁移学习的研究始于\
  \ 20 世纪 60 年代，当时人工智能研究刚刚起步。然而，随着后期算法和能够提升性能的解决方案的出现，这一概念得到了改进。\n\n与机器学习方法相比，迁移学习可以加速学习任务的性能，因为它不需要从零开始学习数据以构建学习模型。这意味着学习模型必须为每个问题领域独立创建。\n\
  \n## 4.4.2 迁移学习：图示表示\n\n图 4.5 以图示的形式表达了迁移学习的概念。在这里，很容易理解为：学习模型通过云等可扩展计算环境，为其他相关上下文提取学习参数。然而，边缘节点利用所学模型的特征来处理其自身的目标数据。\n\
  \n![图 4.5. 迁移学习：概念图。](img/bk978-0-7503-5593-3ch4f5_online.jpg)\n\n**图 4.5.** 迁移学习：概念图。\n\
  \n## 4.4.3 迁移学习：阶段\n\n迁移学习利用预训练模型来快速学习新的平台或数据集。该方法帮助数以万的与图像处理相关的应用快速适应新的数据环境。例如，一个为分类风扇、冰箱、洗衣机、灯泡等家庭用品而创建的学习模型，可以被用于训练物体分类或检测问题。这是因为大多数形状已经由先前的训练模型在相当长内通过成千上万条数据学习到了。\n\
  \n使用可扩展计算节点进行学习并可以应用于任何其他学习环境的模型被称为**源模型**（source model），而利用已训练模型为新环境和数据集创建的学习模型被称为**目标模型**（target\
  \ model）。\n\n迁移学习过程涉及几个步骤，以从新环境中学习数据。一些显著的步骤包括：\n\n1. **评估数据**：需要根据数据的特征和领域专家知识对数据进行评估。这取决于源模型到目标模型的转换是否具有太大困难。在使用迁移学习机制转换模型时，决策过程中会使用一些与准确性相关的指标，如\
  \ `R2`、`MSE` 等。\n2. **决定学习类型**：训练数据可以是已标记的也可以是未标记的。因此，数据评估的方式不同，迁移学习过程也不同，正如子节 4.4.4\
  \ 所示。\n3. **决定计算节点**：迁移学习需要分级计算平台来实现快速学习场景。有时，学习平台必须根据计算需求、能量可用性、内存可用性等因素仔细地决定选择计算节点。\n\
  4. **加载预训练模型**：为了将从一个环境创建的学习见解迁移到另一个环境，会创建并加载基础模型。例如，创建一个用于检测圆形、矩形和其他形状的模型可以作为基础学习模型加载。\n\
  5. **冻结顶层**：冻结基础学习模型的高层可以使基础模型与新的训练模型合并。例如，冻结 `CNN` 算法的顶层可以提供使用其他新学习层来训练基础模型的选项。\n\
  6. **编译模型**：最后一步是在将其他几个层级网络与预训练基础模型合并后编译模型。该模型可以用于从预训练模型推断新的数据集或环境。\n\n## 4.4.4\
  \ 迁移学习：类型\n\n根据需要从源模型迁移到目标模型的学习模型的哪个部分，迁移学习方法可以分为三种不同的类型，如下：\n\n* **双重标记迁移学习 (Twinned\
  \ labeled transfer learning)**：如果源模型和目标模型之间的标签是重复的，则为两个不同的数据集执行的学习被称为双标记迁移学习。在这种迁移学习中，标签必须在不同的学习平台之间通知。例如，学习不同地理位置捕获图像的性别属于双标记迁移学习。这种方法也称为归纳迁移学习（inductive\
  \ transfer learning）。\n* **源标记迁移学习 (Source labeled transfer learning)**：在这种方法中，在目标数据集没有标签的情况下进行迁移学习。模型设计时仅在源模型上带有标签。在许多未知环境中，拥有无法标记的数据集是常见的。例如，识别丛林中动物的应用在调查并进行标记之前，无法拥有类似的图像。相反，需要使用一些预先标记良好的可用数据集来学习某些野生动物的特征。通过这样做，可以在目标位置或图像没有任何标签的情况下，检测出丛林野生动物的稀有特征。这种迁移学习方法也称为“演绎迁移学习”（transducive\
  \ transfer learning）。\n* **未标记迁移学习 (Unlabeled transfer learning)**：这种迁移学习非常适用于无法生成经过验证的标记数据集的无监督学习环境。学习算法必须通过奖励最佳发现或惩罚错误检测的发现来利用可用属性创建模型。人类通常根据经验和成功案例开发新理论。例如，商业上的成功将受到其他同业成员的密切监控，以便他们遵循类似的增加业务利润的风格。显然，这在所有情况下可能不会导致成功。因此，在制定成功模型之前会对成功和失败进行推理。类似的方法，未标记迁移学习尝试在两个方向都没有相应标签的情况下，将学习模型从源模型迁移到目标模型。\n\
  \n## 4.4.5 迁移学习：TensorFlow 实现\n\n迁移学习被广泛利用实现在多个支持边缘的应用中。例如，10 的作者开发了一个轻量级 `CNN`\
  \ 模型，利用用于检测感染的模型来检测 COVID-19 患者。使用如 `TensorFlow` 等专门的框架实现类似的迁移学习的应用更为简单。这些框架具有许多内置功能，可以通过\
  \ API 14 与应用程序轻松集成。基础 `CNN` 网络已经根据过去的大量数据集和学习过程提供了许多表示。因此，在迁移学习过程中，只需将基础 `CNN` 的最后几层与新层合并即可。\n\
  \n在 TensorFlow 框架中，导入以下包以基于预训练模型对花卉或水果进行分类：\n\n```python\nimport tensorflow as tf\
  \  \n\nfrom tensorflow.keras.preprocessing import image  \n\nfrom tensorflow.keras.applications.mobilenet_v2\
  \  \n\nimport MobileNetV2, preprocess_input  \n\nfrom tensorflow.keras.models import\
  \ Model\n```\n\n\n\n\n\n`mobilenet_v2` 是一个预训练模型，可用于对花卉或水果进行分类。该预训练模型由 Google 创建，包含超过\
  \ 140 万幅图像和 1000 个类别。从零开始开发一个用于水果或花卉分类的学习模型无疑是一项具有挑战性的任务。使用 `mobilenet_v2` 得出的预训练模型被认为是基础\
  \ CNN 模型，可以迁移到计算开销的设备上。\n\n接下来，加载预训练模型以进行迁移学习过程。创建此类基础 CNN 模型的代码片段如下：\n\n```python\n\
  base_model = MobileNetV2(input_shape=SHAPE-IN-IMAGE, include_top=False, weights='imagenet')\n\
  ```\n\n下一步，我们需要冻结已训练的基础模型的层，以便将学习到的模型与更新的分类器或学习模型集成。要冻结基础模型，我们需要使用 Keras 提供的语法来禁用层的训练选项：\n\
  \n```python\nlayer.trainable = False\n```\n\n事实上，`mobilenet_v2` 有许多层可以通过设置上述禁用选项，使其在后续的训练过程中被冻结。\n\
  \n接下来，我们可以应用一些数据处理步骤、池化方法和缩放方法来构建迁移学习模型。迁移学习模型的输入包含预处理步骤和输出分类预测的基础模型。例如：\n\n```python\n\
  transfer_learning_model = Model(inputs=base_model.input, outputs=output)\n```\n\
  其中，\ninputs = tf.keras.Input() # 随后是预处理、\n# 平均化、增强 base_model\n# 以及、类似的新层\noutputs\
  \ = Dense(num_classes, activation='softmax')(x) \nmodel = tf.keras.Model(inputs,\
  \ outputs)\n```\n\n下一步是编译模型，在优化新模型的同时，指定指标、损失函数和学习率。相应地，需要训练模型以创建迁移学习模型：\n\n```python\n\
  model.compile(optimizer=Adam(learning_rate=0.001), loss='categorical_crossentropy',\
  \ metrics=['accuracy'])\nhistory = model.fit(training-data, epochs=1000, validation-data)\n\
  ```\n\n#### 4.4.6 边缘支持的迁移学习\n\n迁移学习方法受益于边缘计算的进步。在深度学习时代，研究人员已开始使用边缘支持的设备应用迁移学习的概念。例如，Abu\
  \ *et al* 等人 [12] 引入了边缘设备以提高家庭医疗应用的性能。作者使用带标记数据集设计了深度迁移学习，以帮助家庭患者。他们利用手机等边缘设备使用了一种基于\
  \ CNN 的预训练模型，以快速观察患者的健康状况。\n\n边缘计算在迁移学习中的应用不仅提高了学习准确性和降低了延迟，还涉及学习过程中的隐私保护。当数据需要传输到云端时，边缘支持的迁移学习变得至关重要，尤其是对于医疗相关的应用。\n\
  \nNVIDIA 开发了 NVIDIA Transfer Learning Kit，用于在 Jetson Nano 或类似设备上执行预训练模型 [17]。该工具包支持大量的预训练模型，这些模型可以智能交通、监控活动等领域。一些预训练模型，如\
  \ FaceDetect-IR、TrafficCamNet、VehicleMakeNet 等，使用了 `DetectNet_v2-ResNet18` 或 `ResNet4`\
  \ 等深度学习算法，在迁移学习研究工作中被广泛利用。\n\n### 4.5 闲传学习 (Gossip learning)\n\n在高度分布的数据中，保护隐私和学习数据特征是任何机器学习算法面临的挑战方面。然而，分布式网络中的多样化数据必须以优雅的方式处理。\n\
  \n闲传学习被引入机器学习领域以处理这种情况，特别是在 P2P 分布式网络环境中。预计学习模型将使用闲传原理开发，即闲传是一种 P2P 方法，期望节点在传输信息状态的同时相互通信。\n\
  \n基于深度学习概念的闲传学习算法由于对邻居状态信息的更新，通常具有良好的可扩展性。此外，模型创建过程中可能出现的失败邻居也而而知。由于数据不跨计算节点传输，本地数据免受隐私问题的影响。\n\
  \n闲传学习方法被进一步应用于许多其他场景中。例如，在 CNN 等深度学习算法中，闲传学习应用于算法的优化阶段，以比传统方法更快地收敛。通过这样做，梯度下降被快速优化，因为模型可以根据分布式数据进行并行学习。\n\
  \n然而，与几种其他分布式学习方法（如联邦学习）相比，闲传学习往往表现较差。在最近，作者探索了在特定通信拓扑结构上执行算法时闲传学习方法的性能问题 [3]。\n\
  \n### 4.6 结论\n\n在前面的章节中学习了包括操作系统在内的基础技术后，本章强调了利用边缘设备开发学习算法的重要性。它分类了不同边缘支持学习算法，例如联邦学习、拆学习、迁移学习和闲传学习。本章提供了使用\
  \ Tensorflow 工具开发学习算法的见解。本章表达的观点可能激励读者开发类似的分布式算法。\n\n### References\n\n[1] Basu\
