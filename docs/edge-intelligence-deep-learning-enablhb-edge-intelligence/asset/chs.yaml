  \n\n# 第 2 章\n\n## 边缘计算架构\n\n在学习用于深度学习驱动应用的边缘级学习技术和性能效率方法之前，理解利用边缘设备作为处理单元的可用计算架构至关重要。我们必须理解丰富边缘计算知识水平的相关技术。在构建支持边缘的物联网（`IoT`）应用中发挥作用的相关技术包括：(i)\
  \ `IoT`、(ii) 连接协议、(iii) 服务级协议以及 (iv) 学习技术（包括深度学习）。本章解释了基础技术，为读者理解边缘计算架构及相关学习方法铺平道路。\n\
  \n### 2.1 物联网\n\n广义上，物联网（`IoT`）是普通互联网的延伸。过去，互联网仅提供给笔记本电脑、服务器或计算设备（包括手机手机）。然而，近年来，`IoT`\
  \ 不仅将互联网扩展到了计算单元，还扩展到了普通物品和或对象。\n\n`IoT` 设备可以是轻量级设备（如笔、铅笔或橡皮）、重量级设备（如工业机器）、微型设备（如耳环[4]、胶囊或红外机器人），以及大型设备（如水质传感器、风向传感器或空气质量传感器）。\n\
  \n#### 2.1.1 物联网的子领域\n\n通常，`IoT` 根据功能或运行特征分为五大类（见图 2.1）。下面描述了物联网的类别及其关键亮点。\n\n![图\
  \ 2.1. 物联网技术的子领域。](img/bk978-0-7503-5593-3ch2f1_online.jpg)\n\n**图 2.1.** 物联网技术的子领域。\n\
  \n##### 2.1.1.1 工业物联网\n\n工业 `IoT` 是工业的一次革命性进步。通常，工业通过改进流程来产生运营收入。事实上，过去工业发生过多次革命。值得注意的是，18\
  \ 世纪由蒸汽机引起的革命提高了开发产品的生产率。这场革命被称为第一次革命，或工业 1.0。接着，在 19 世纪初，电力的改变了工业的生产流程。它催生了工业 2.0。这次革命增加了发动机的马力，为许多现有解决方案增加了大规模生产的机会，即生产流程的严格改进在主要行业中实施了成本效益。在这一革命时期，与之前相比，工业员工需要关注的任务有限。\n\
  \n随后，在 20 世纪 70 年代初，嵌入式微控制器的引入和计算机的应用为工业以自动化方式运行机器铺平了道路。它还以电子方式封装信息以加速决策。这场革命被称为工业\
  \ 3.0。\n\n在工业 4.0 时代，工业流程除了传统计算机外，还丰富了网络事物和对象。机器与传感器和执行器连接以收集后续机器的操作指令。在这个时代，产品的数字化已成为可能。尽管还有一些研究项目需要完成，但实现自动制造目标的路径已被多个行业高度认可。\n\
  \n##### 2.1.1.2 消费物联网\n\n在消费 `IoT` 中，连接设备旨在满足用户需求。例如，笔记本电脑、可穿戴设备、语音助手、机器人、智能手机等设备可以帮助用户保持工作效率。例如，如果有人想在亚马逊上寻找当天的最佳优惠，他们可以与最近的设备聊天。因此，这些个人设备可以根据用户的偏好和可用预算检查最佳选项并下单。\n\
  \n消费 `IoT` 旨在提高用户的舒适度。通过这种方式，用户可以在周围设备（主要是 `IoT` 设备）的支持下专注于计划好的活动。\n\n##### 2.1.1.3\
  \ 社会物联网\n\n在社交 `IoT` 中，社交关系根据传感器技术赋予了预定义的偏好。社交 `IoT` 专注于建立志同道合人士之间的关系，例如家人、朋友或与连接人员相关的物体。事实上，地球上超过\
  \ 75 亿的人都需要关系。社交 `IoT` 有潜力识别全球范围内人群中匹配的最佳性格。\n\n\n\n\n\n例如，富人可能出于各种原因希望在全球范围内寻找穷人，例如帮助这些贫困者。此外，政客可能希望向多个社区发表演讲且不引起反感。社交物联网（Social\
  \ IoT）可以提供受众的核心偏好和兴趣，以便政客能够利用这些信息来赢得许多人的心。\n\n##### 2.1.1.4 语义物联网 (Semantic IoT)\n\
  \n语义物联网是物联网的另一个子分支，与社交物联网相似。然而，社交物联网与语义物联网之间存在细微差异。社交物联网并不关注个人利益。相比之下，语义物联网是一种定制化的解决方案，它将社交物联网的收益映射到个人需求上。例如，如果老师想识别给学生提供的最佳解释，语义物联网就可以提供。它应用本体论和本体论相关的网络语言，根据个人的定制化特征来处理其文本。\n\
  \n##### 2.1.1.5 产品化物联网 (Productization IoT)\n\n在产品化物联网中，基于传感器的解决方案被以协作的方式设计和制造产品。由于许多开发者参与了设计过程，产品化物联网方法以一种高效的方式提高了产品质量，即产品化物联网方法在收集来自多个志愿者的反馈和设计考虑的同时，以协作的方式制造产品。事实上，在传统的制造方法中，设计必须由胜任的设计师进行审查，而没有足够的奖励或惩罚。在这种方法中，反馈被收集并审查，以实现高效的制造协同。\n\
  \n#### 2.1.2 服务级协议\n\n物联网设备需要标准来与其他计算元素进行高效通信。在物联网领域，存在成千上万个设备（主要是异构设备），它们必须相互通信。通常情况下，通过定义和标准化协议，来促进多供应商或多特征设备之间的高效通信。\n\
  \n在这些协议中，有少数协议用于建立信号层面的通信；另一些协议设计用于有效率处理高层通信，即服务。\n\n在支持物联网的设备中广泛应用的几种服务级协议包括：(i)\
  \ 受限应用协议 (`CoAP`)；(ii) 消息队列遥测传输协议 (`MQTT`)；(iii) 安全 MQTT (`SMQTT`)；(iv) 可扩展消息和存在性协议\
  \ (`XMPP`)；以及 (iv) 高级消息队列协议 (`AMQP`)。\n\n#### 2.1.2.1 CoAP\n\n`CoAP` [5] 旨在促进电池供电传感器节点上的\
  \ Web 传输。该协议主要关注机器对机器通信，类似于客户端-服务器通信。在标准互联网中，消息是以客户端-服务器模型进行通信或传输的。例如，客户端通过 Firefox、Chrome\
  \ 或 Opera 等浏览器请求信息。这些请求由可用服务器（包括 Google 搜索引擎）处理，以交付响应。然而，对于受限设备来说，从服务器接收响应的传统方法并不是一项易事的任务。这是因为\
  \ HTTP 协议中涉及了沉重的处理组件。\n\n`CoAP` 位于 ISO/OSI 网络标准的会话层之上。如果设备需要与具有足够电源的某些强大设备进行通信，`CoAP`\
  \ 可以轻松地与 HTTP 协议绑定。`CoAP` 协议有两个不同的子层，位于应用层和传输层之间。这些子层被命名为 `req/res` 层和消息层。\n\n1.\
  \ `req/res` 层是请求/响应层，处理不同受限节点之间的实际通信。\n2. 消息层位于传输层和 `req/res` 层之间，负责促进可靠性消息。\n\n\
  `CoAP` 协议的优势是：(i) 它根据协议特定消息提供可靠性；(ii) 它非常适合遵循 TCP/IP 标准的 HTTP 协议；(iii) 它可以轻松与基于\
  \ HTTP 的通信设备集成；以及 (iv) 它是节能的，因为协议运行在靠近会话层，即顶层的功能被降至最低。\n\n尽管有许多优点，`CoAP` 也存在一些缺点。它们是：(i)\
  \ 可靠性消息在传输层使用 UDP 协议处理。这减少了 UDP 交付到适当目的地的概率。(ii) 该设计导致了可靠性消息的无序交付。因此，与该协议相关的服务器有很高的计算需求。\n\
  \n#### 2.1.2.2 MQTT\n\n`MQTT` 协议是一种遵循发布/订阅模型 [3] 的消息协议。在发布/订阅模型中，设备可以与中间代理共享数据，而不是等待服务的响应。直接与监听服务共享消息的传统方法要求服务器和服务保持在线。然而，在功率受限的环境中，建议设备在整个预期通信期间不要开启。此外，在支持物联网的应用中，许多情况下数据请求并不频繁。显然，请求-响应模型在许多情况下并不非常适用。\n\
  \n在 `MQTT` 协议中，需要中间代理来尽可能满足传感器。这些代理负责从可用传感器捕获数据并将数据交付给请求的服务。通常，这些代理在整个通信期间必须在线。但传感器和相关服务不需要等待对方的可用。\n\
  \n基于 `MQTT` 的协议通信的主要步骤如下：\n\n1. 传感器将传感器数据发布到中间代理。这些传感器不仅包括温度、湿度、压力等硬件传感器设备，还包括来自社交物联网平台的数据。\n\
  2. 服务连接到中间代理以订阅传感器数据。这些服务包括手机上的可视化服务、云节点上的报警和通知服务等。\n\n安全的 MQTT 类似于安全的 HTTP 协议。安全的\
  \ MQTT 协议应用发布-订阅模型，即它允许传感器节点根据传感器的可用性发布传感器数据，并允许服务以安全的方式通过中间代理订阅传感器数据，即安全的 MQTT\
  \ 包含一些加密算法来加密通信设备之间的数据。这些基于安全的算法如果处理不当，将会消耗电池电量。\n\n研究人员在 [2] 中研究了 MQTT 客户端和服务器之间加密消息的性能。可以观察到某些应用程序为了实现更安全的通信必须牺牲一些\
  \ CPU 周期。\n\n#### 2.1.2.4 XMPP\n\n`XMPP` 基于 XML 语言，通过 SOAP 协议传输通信消息。该协议关注即时消息服务。传统上，`XMPP`\
  \ 是为基于服务器的应用设计的。然而，在后期考虑到物联网应用的资源受限特征，研究人员提出了它们的几种轻量级版本。注意的是，[17] 的作者开发了一种轻量级 `XMPP`\
  \ 协议，它可以通过调整算法的睡眠机制来缩小传统 `XMPP` 协议的体积。\n\n\n\n\n\nXMPP 协议的轻量级版本为提高该协议在多个物联网应用（包括边缘\
  \ AI）中的实用性铺平了道路。例如，如果传感器数据需要在连接的设备或边缘 AI 服务之间快速传输，那么 XMPP 将是服务层层面的候选协议。基本上，XMPP\
  \ 以结构化数据格式近乎实时地路由 `XML` 数据。有几种基于 XMPP 的协议：如 `Core`、`Jiggle`、`PubSub`、`BOSH` 等。XMPP\
  \ 协议的主要缺点是缺乏可用的 QoS 服务以及潜在应用场景有限。\n\n#### 2.1.2.5 AMQP\n\n在 AMQP 中，消息遵循发布-订阅模型进行路由。为了实现这一点，代理服务器（brokers）扩展了路由机制，即在代理服务器中指定特定的路由方法，以确保传感器与相关服务之间的安全性。\n\
  \n如果发布者配置不当，则有更高的概率入侵暴露的开放代理。因此，机器在执行操作时可能会损坏设备或利用控制其他机器。因此，参与了路由过程的 AMQP 协议将支持解决安全问题。AMQP\
  \ 协议应用于如 `RabbitMQ` 等现代代理服务器。可见，研究人员已利用 AMQP 协议提高了行业生产力。`[7]`。\n\n图 2.2 展示了边缘计算节点用于连接传感器和执行器的服务级通信协议分类。\n\
  \n![图 2.2. 物联网服务级通信协议的分类。](img/bk978-0-7503-5593-3ch2f2_online.jpg)\n\n图 2.2. 物联网服务级通信协议的分类。\n\
  \n### 2.1.3 通信级协议\n\n后续章节描述了传感器用于连接与其他设备的几种通信协议。学习这些通信协议使读者能够理解适当的物联网通信协议在减少数据通信或网络延迟问题方面的适用性。\n\
  \n#### 2.1.3.1 IEEE 802.15.4 标准\n\n由于电池限制，大多数传感器节点遵循 `IEEE 802.15.4` 标准。通常，`IEEE\
  \ 802.15.4` 是一种定义为低速率个人区域网的标准，旨在降低应用程序的电池消耗或能耗。在该标准下运行的设备频率为 2.4 GHz。此外，设备采用扩频调制技术而非重量级调制技术。\n\
  \n遵循 `IEEE 802.15.4` 标准的设备在数据链路层有两个子层。这两个子层分别命名为特定特定收敛子层和逻辑链路控制层。\n\n访问介质取决于信标（beacons）。考虑到载波的多路接入策略，这些设备遵循信标启用方法。这意味着定期发送信标，以了解传输信道中节点的可用性。根据从特殊数据包格式收到的设备响应，分配通信介质。\n\
  \n在类设备中，功耗从 0.5 mW 降低到 10 mW。在类设备中，功耗从 0.5 mW 降低到 10 mW。\n\n#### 2.1.3.2 蓝牙\n\n\
  后续章节描述了传感器用于连接与其他设备的几种通信协议。学习这些通信协议使读者能够理解适当的物联网通信协议在减少数据通信或网络延迟问题方面的适用性。\n\n###\
  \ 2.1.3.3 LoRaWAN \n\n后续章节描述了传感器用于连接与其他设备的几种通信协议。学习这些通信协议使读者能够理解适当的物联网通信协议在减少数据通信或网络延迟问题方面的适用性。\n\
  \n#### 2.1.3.4 WiFi \n\n后续章节描述了传感器用于连接与其他设备的几种通信协议。学习这些通信协议使读者能够理解适当的物联网通信协议在减少数据通信或网络延迟问题方面的适用性。\n\
  \n\n\n\n\n事实上，第一代移动网络涉及模拟通信。这一代采用电路交换网络而非数据包交换。第一代移动网络的速度为 `2.4 kbps`，且延迟很高，即延迟超过\
  \ `1000 milliseconds`。显然，这不是一种可靠的通信方法。\n\n在第二代系统系统中，移动网络被修改用于数字通信。在这一代中，电路交换的概念被数据包交换通信取代。得益于数字通信方法，解决方案中引入了语音压缩技术。这使得通信更加可靠，延迟更低。在\
  \ `2G` 移动网络中，延迟通常在 `1000 milliseconds` 左右。通信速度达到约 `64 kbps`。因此，多媒体信息和短信在这些系统中非常流行。\n\
  \n在第三代移动网络中，除了传统的语音信号外，引入了数据通信。在这个时代，数据速率提高到 `2 Mbps`，这提升了如视频应用、音频会议、游戏等潜在通信能力。事实上，在\
  \ `3G` 启动之前，存在过 `2.5G` 以及针对 `GSM` 演进的增强数据速率 (`EDGE`) 系统。`2.5G` 引入了通用分组数据无线业务 (`GPRS`)\
  \ 概念。对于许多 `GSM` 用户来说这是一个非常重要的功能。`EDGE` 系统的引入将延迟降低到了 `1000 milliseconds` 以下。与 `2.5G`\
  \ 和 `EDGE` 类似，第三代在进入 `4G` 之前经历了中间步骤。它们被称为 `3G` 和 `3.5G`。第三代引入了 `CDMA` 媒体接入技术，在 `3.5G`\
  \ 中数据速率增加到约 `14 Mbps`，在 `3.75G` 中为 `42 Mbps`。在大多数手机中，我们可以通过 `H+` 符号观察到 `3.75G` 的指示。\n\
  \n移动用户对速度的需求并没有停止，因为大多数用户热于追求新应用。事实上，`4G` 的诞生是满足趋势移动用户大多数需求的一步。它使他们能够在线课程、在线视频会议、视频游戏等。这一代提供了约\
  \ `1 Gbps` 的数据，以提供真实的 HD 视频相关应用。自 `2019` 年以来，这已成为现实。\n\n目前，随着 `4G` 面临更高延迟的挑战，`5G`\
  \ 市场开始渗透移动用户的脑海。值得注意的是，`4G` 经历过超过 `200 milliseconds` 的延迟，这延迟了现实应用，包括实时操作和虚拟现实。\n\
  \n在 `5G` 中，应用的延迟降到了 `1 millisecond` 以下。显然，通过这种方法，任何实时应用都是可能的。自动驾驶车辆可以根据远程提交到制动系统的指令几乎实时制动。同样，由于延迟因素的减少，医生可以真实地进行远程手术。近期已开展了一些研究工作，以理解移动网络中\
  \ `5G` 或更后世代带来的延迟改进 `[9]`。\n\n`5G` 在三个主要频段运行。它们被称为 (i) 高频段、(ii) 中频段和 (iii) 低频段。在高频频谱中，由于更高的带宽（即\
  \ `25` 到 `39 GHz`），我们体验到了真正的 `5G` 系统。该频谱也被命名为 `mmWave`（毫米波）。在该频谱上运行的设备数据速率约为 `3`\
  \ 到 `10 Gbps`。这几乎是其继任者即 `4G` 网络速度的 10 倍。然而，它的覆盖范围有限，从 `10` 到 `50` 米不等。\n\n在中频，`5G`\
  \ 频谱分为两个子类：(a) 中频-I 和 (b) 中频-II。这两个中频的设计是为了让 `5G` 远距离、短距离或远程。该频段非常适合距离为 `10` 到 `30\
  \ km` 的智能城市和城镇。在该频段中，设备工作在 `2.5` 到 `4.2 GHz`，速度为 `100 Mbps` 到 `1 Gbps`。在该频段中，用户体验到\
  \ `4G` 移动连接的速度。由于中频频段较少，与高频 `5G` 频谱相比，它可以达到更远的距离。\n\n低频 `5G` 频谱旨在增加移动设备的覆盖范围。为了实现，使用了\
  \ `600` 到 `850 MHz` 范围内的低频。显然，`5G` 设备可以覆盖数百平方英里。该频段不会提供真正的 `5G` 体验。因此，它通常被称为虚假 `5G`。\n\
  \n#### 2.1.3.6 5G 大规模 MIMO\n\nMIMO 一般类似于传输系统中的多输入多输出 (`MIMO`)。事实上，它是一种天线扩展概念，试图增加天线和接收器的数量。使用\
  \ `MIMO`，传输系统利用低能量传输捕捉多径信号。`MIMO` 的思想在 `5G` 之前就已经普及。但在 `4G` 技术中，天线和接收器的数量是有限的。通常此类技术使用两个天线。\n\
  \n在 `5G` 中，结合了 `massive MIMO`。通过这种方式，许多发射器和接收器能够直接连接。基站能够指向移动手机。\n\n由于包含了 `massive\
  \ MIMO`，`5G` 能够通过满足多个用户来提高频谱效率。天线阵列得到了改进。\n\n#### 2.1.3.7 5G 波束赋形\n\n`5G` 支持 `beam\
  \ forming` 以更高的数据速率接纳更多用户。它同时从天线阵列指向接收设备。`5G` 大规模 MIMO 的天线并不重，约为 `25 kg`。\n\n尽管\
  \ `beam forming` 将波导向移动手机，但涉及的计算要复杂得多。当接收器在天线或相邻天线附近移动时，需要评估方向。显然，某些人工智能 (`AI`)\
  \ 技术被用于预测特定设备的需求。\n\n#### 2.1.3.8 5G 网络切片\n\n网络切片以轻量化的方式实现了基础设施的虚拟化。不需要具有不同配置设置的物理基础设施，可以创建此类虚拟实例。这种方法通过软件驱动的方法简化了网络管理员的工作。\n\
  \n在 `5G` 中，开发了端到端网络切片。这意味着为终端客户提供了逻辑网络。随着切片的发展，用户可以体验到为其业务定制的网络。切片基于软件定义网络 (`SDNs`)\
  \ 和网络功能虚拟化 (`NFV`) 执行。在 `NFV` 中，成帧策略、防火墙功能、路由方法等网络功能以容器化解决方案的形式虚拟化，以满足用户的特定网络需求。\n\
  \n由于有多个参数来决定 `5G` 设备的网络切片组件，`[16]]` 的作者开发了一种强化学习算法辅助的网络切片机制。\n\n图 2.3 展示了用于边缘计算节点连接传感器和执行器的低级通信协议的分类。\n\
  \n![图 2.3. IoT 中的低级通信协议分类。](img/bk978-0-7503-5593-3ch2f3_online.jpg)\n\n**图 2.3.**\
  \ IoT 中的低级通信协议分类。\n\n\n\n\n\n### 2.2 物联网组件\n\n物联网组件包含具有各种计算能力和管理控制的设备。通常情况下，一个物联网生态系统包含传感器、边缘/雾网节点、云服务器、用户界面以及一些包括分析在内的若干软件组件。\n\
  \n#### 2.2.1 传感器\n\n在任何可扩展的物联网应用中都使用了成千上万个传感器。例如，一个采集智能城市居民健康状况的物联网应用可能包含数百万个传感器。这些传感器可能来自不同的供应商并具有不同的特性。\n\
  \n#### 2.2.1.1 传感器特性\n\n传感器根据其感知能力进行表征。大多数传感器在产生结果方面是准确的。然而，某些传感器在感知属性时不需要 100%的准确性。传感器具有测量光、温度、湿度等属性的能力，必须以最高的精度进行测量。此外，这些设备在反复实验测量属性时，应该产生相同的结果。在某些情况下，传感器的感知值产生可能会偏离准确值，但它们可能是线性偏离正常值或非线性偏离。\n\
  \n#### 2.2.1.2 传感器分类\n\n传感器可以根据尺寸、测量属性、活性、标量/向量以及模拟/数字等方式分类。\n\n1.  **传感器尺寸**：根据传感器的尺寸进行分类。例如，根据其测量属性，传感器可以是微小的，也可以是巨大的。例如，温度传感器的尺寸较小，在毫米级。然而，雨传感器的尺寸较大，在厘米级。还有在米级的巨型传感器用于测量天气状况。显然，易于观察到传感器在尺寸上存在差异。\n\
  2.  **测量属性**：传感器根据其测量属性分类，如温度、湿度、化学品、气体等。\n3.  **活性**：我们可以根据活性对传感器进行分类。例如，某些传感器不需要任何电源即可采集数据。这些类型的传感器被称为主动传感器。相比之下，需要外部电源来感知数据或可测量属性的传感器被称为被动传感器。\n\
  4.  **标量/向量**：传感器可以根据设备的标量或向量属性分类。例如，测量不指示方向的属性的传感器被称为标量传感器，测量包含标量分量和方向数值属性的传感器被称为向量。标量器的典型示例是温度传感器、心电图（ECG）传感器、水质传感器等。向量传感器的示例是摄像头传感器和单向音频传感器。\n\
  5.  **模拟/数字**：传感器能够收集数字或离散值，例如数字相机。在某些示例中，传感器测量连续的、可量的属性。最常用的模拟传感器是温度传感器。\n\n####\
  \ 2.2.2 边缘设备\n\n边缘设备是硬件设备，旨在通过分布式架构控制传感器与云之间的信息流。它们通常连接到传感器或靠近传感器以处理传感器数据。这些处理步骤涉及信息的过滤、平均等。\n\
  \n#### 2.2.2.1 边缘设备的特性\n\n边缘设备具有特殊特性，使其与其他节点区分开来。以下列出了最显著的特性及其描述：\n\n1.  **支持通信协议**：物联网设备的制造用于发射不同类型的通信，如`WiFi`、`Bluetooth`、`Zigbee`、`LoRaWAN`等。\n\
  2.  **联网**：边缘设备应具有`IP`地址。在某些情况下，这些设备拥有`域名`。\n3.  **可变速度**：边缘设备必须具有`带宽`。连接到上游设备的网络速度比`传感器节点`更快。\n\
  4.  **成本效益并行性**：边缘设备通常被认为比重量级节点便宜。近年来，研究人员尝试对一组微控制器（如`Espressif 的 ESP`节点）进行聚类，以实现大规模并行[11]。\n\
  5.  **无风扇支持**：边缘节点不需要风扇冷却。这是因为在大多数设备上，边缘节点会因风扇故障而停止运行。如果边缘设备设计时不风扇，噪声水平将降至最低，并且可以安装在维护需求最小的远程位置[15]。\n\
  6.  **安全环境**：边缘设备必须具有安全特性来保护设备和解决方案。事实上，物联网解决方案必须考虑安全辅助，如`身份验证`、`授权`、`加密`、`完整性检查`等。\n\
  \n#### 2.2.2.2 边缘节点类型\n\n在任何物联网应用中，智能都始于边缘节点。传感器无法执行智能任务。它们旨在测量物理属性，如温度、湿度、压力等。然而，它们在与边缘节点结合任务时可以实现智能。某些边缘节点比广泛应用的边缘设备更快。\n\
  \n边缘节点根据各种因素分类：(i) 处理能力和硬件组件，以及 (ii) 部署位置。\n\n1.  **处理能力和硬件组件**：边缘设备具有不同的处理能力。某些边缘设备有一个`CPU`，另一些有多个`CPUs`。在某些情况下，设备包括`GPUs`，而另一些包括`TPUs`或`FPGAs`。根据相关的计算设备，这些设备的处理能力各异。例如，多核`CPUs`具有\
  \ 4、8、16、32、64 或 128 个`CPUs`来并行执行任务。这些`CPU 核心`是硬件组件，使用它们自己的寄存器计算一组指令。\n\n    然而，`GPUs`是图形处理器，作为协处理器用以加速数据密集型指令。值得注意的是，具有多个不同输入值的指令在`基于\
  \ GPU 的设备`上进行处理。这些计算组件在没有`CPUs`支持的情况下无法执行整个过程。\n\n\n\n\n\n现场可编程门阵列（`FPGAs`）是一种独特的硬件，具有修改硬件电路以适应不同应用程序的功能。无论软件如何修改，在某些情况下，我们必须微调硬件组件的特性。通过这种方式，在不涉及中央处理器的情况下，并行执行速度更快。\n\
  \n例如，假设我们需要设计一个连接了几个执行器的微控制器设备。让这些执行器根据从传感器接收的感知信息执行。在传统情况下，微控制器必须处理来自这些传感器的输入数据，并决定执行器必须执行的特定操作。然而，在\
  \ `FPGAs` 的支持下，我们可以跳过这一过程。`FPGAs` 是硬件级解决方案，引入了为应用建立可配置逻辑块的想法。显然，此类应用的性能得到了提升。例如，[19]\
  \ 的作者已经展示了 `FPGAs` 在基于目标检测的深度学习算法中的应用。\n\n`FPGAs` 的主要缺点是：(i) 需要在硬件级进行编程；(ii) 需要熟练的技术人员或工程师来操作设备；(iii)\
  \ 它们限于特定应用；以及 (iv) 与其他软件相关的解决方案相比，它们非常昂贵。\n\n## 2. 部署位置\n\n边缘概念部署在去中心化计算系统的多个位置。根据部署位置，我们可以将边缘节点分为以下几类：(i)\
  \ 远边缘级（far-edge level），和 (ii) 近边缘级（near-edge level）。\n\n*   (a) 远边缘级处理在传感器上或其附近进行。例如，摄像头传感器和风力数据处理传感器等传感器具有流式数据。这些流在本质上是周期性或非周期的。由于需要将大量数据传输到更高计算节点，摄像头传感器或风力数据处理传感器在传感器处具有内置的计算单元。这些传感器的目标是对数据进行预处理、过滤，或执行颜色去除、图像增强、缩放等数据级操作。根据电源的可用性，该级别的边缘节点被描述为电池供电节点和电源电源节点。正如名称所示，某些摄像头传感器能够在偏远地区使用电池运行。这些传感器涉及通过电池电远边缘级处理。此类设备的优势是：(i)\
  \ 它们能够位于任何偏远地区；(ii) 它们通常是轻型、微型设备。然而，这类设备的缺点是需要频繁更换电池。显然，我们无法将它们放置在无法到达的地方。相比之下，电源电源节点通常能够处理相对较大的操作，而无需担心其电力限制。远边缘设备最类似于智能传感器或智能网关，它们具有处理传感器数据的某些计算能力。\n\
  \n*   (b) 近边缘级处理包含一个用于执行边缘级能力的强大服务器。这些服务器被放置在距离传感器远的地方。与远边缘节点相比，它们的扩展性更好，因为它们更接近云。此类设备与云之间的主要区别是，它们通常由电池驱动，并具有无风扇支持以良好地集成到扩展环境中。特别是以服务器节点形式运行的边缘节点比传感器上的边缘容量具有更多的计算能力。此外，在服务器节点上部署近边缘级功能具有整合多个通信通道的额外优势，如\
  \ `LoRaWAN`、`Zigbee`、`WiFi`、`Bluetooth` 等。\n\n将边缘节点加入物联网应用的主要目的是：(i) 提高应用的性能；(ii)\
  \ 降低应用的延迟，特别是当应用本质上是数据密集型时；(iii) 丰富用户的隐私和安全考量，即数据存储得更靠近用户；(iv) 最小化整个物联网应用的网络带宽；(v)\
  \ 高效处理应用的数据存储单元：即存储应用的数据。\n\n### 2.2.3 雾节点（Fog nodes）\n\n在物联网启用应用中包含边缘节点的主要目标是：不仅涉及边缘-云结合，某些情况下还涉及雾节点。在边缘计算中，存储空间存在限制。\n\
  \n#### 2.2.3.1 雾：去中心化集群\n\n通常情况下，雾计算涉及由高速网络连接的服务器集群。这些强大的单元通常部署在市中心。这些单元位于位于云数据中心和边缘节点之间。它们还可以通过跨网络部署多个代理来执行建模算法。\n\
  \n#### 2.2.3.2 雾：特性\n\n雾节点根据其应用具有独特的特性，如下：\n\n1.  **低延迟**：与云节点相比，雾为物联网应用提供了低延迟。例如，医疗应用将\
  \ ECG 数据流传输到云服务以学习患者的 ECG 模式。通常情况下，边缘节点无法学习患者的历史，因为它们通常与医院的记录连接。然而，在云端开发和部署学习算法会增加应用的延迟。因此，雾集群可以缓解应用的需求。\n\
  2.  **基于位置**：服务器集群位于市中心或基于雾机构的特定位置。显然，这些位置拥有处理所需的数据。例如，医院记录可以留在其网络管辖范围或管理范围内。因此，可以为雾启用医疗应用设计以数据中心的数据库。\n\
  3.  **实时性**：雾节点尝试提供实时数据分析解决方案。例如，在制造平台上设计新产品时启用增强现实需要对数据进行实时处理；医生小组的操作是实时用例之一，这需要靠近传感器数据的稳棒计算设备。\n\
  4.  **安全性**：雾节点由市政当局或工业者实施。这种基于雾的设置由终端用户的管理部门管理。例如，安装在智能城市的雾集群为其城市提供雾启用解决方案；医院在其所属的医院内部部署雾启用计算集群。\n\
  \n#### 2.2.3.3 雾的优点与缺点\n\n涉及雾集群的主要优势是：(i) 与云相比扩展了安全性：数据处理得更靠近传感器；(ii) 低延迟；(iii)\
  \ 增加带宽；(iv) 参与更多应用等。\n\n\n\n\n然而，利用雾节点（[1]存在一些缺点。它们是：\n\n(i) `信任问题`：雾节点仍被视为一种微云环境。因此，信任提供者面临着挑战。例如，多个政府部门之间无法直接信任对方。例如，腐败的警察力量可能会操纵存储在雾集群中的与调查相关的数据。这生动地证明了雾集群可能会引发信任相关的问题。(ii)\
  \ `配置问题`：与云类似，雾节点没有得到良好的维护。雾节点站点需要熟练的技术人员来解决任何配置错误或维护相关的问题。自动解决方案可能会阻碍雾节点的功能。显然，由于缺乏熟练的工人，可能会出现延迟停机。\n\
  \n#### 2.2.4 云节点\n\n理解云节点和边缘节点之间的区别至关重要。广义而言，云是由`Amazon AWS`、`Google Inc.`、`Microsoft`、`阿里巴巴`等第三方提供者托管的海量设备。\n\
  \n#### 2.2.4.1 云服务\n\n云环境提供三项重要服务：基础设施即服务（`IaaS`）、平台即服务（`PaaS`）和软件即服务（`SaaS`）。\n\
  \n1. `IaaS`：`IaaS`提供计算、存储或网络相关的组件作为服务。提供硬件服务在计算领域引发了一场革命。在此之前，资源是基于已知的连接或组织策略共享的。例如，研究人员必须编写详细的提案，规定从提供者处需要什么资源（通常是来自学术机构的超级计算机）。这种方法对于许多普通研究人员或从业者（包括学生）来说不可行的。`IaaS`根据付费提供所有硬件资源。然而，`IaaS`期望用户安装相关的平台和软件以执行它们。\n\
  \n2. `PaaS`：在`PaaS`中，平台作为服务提供，使用户可以直接安装自己的应用程序或软件。事实上，`PaaS`对初创公司或创业者非常有益，因为他们专注于开发自己的逻辑，而不是将人力花费在底层平台上。例如，基于深度学习的初创公司在专注于设计新的深度学习算法之前，需要开发并安装`TensorFlow`等执行环境。然而，`PaaS`服务对硬件或相关的实现瓶颈仅有限有限。事实上，大多数问题是由于硬件问题引起的，特别是当需要处理网络方面时。\n\
  \n3. `SaaS`：云设置中的第三项服务是软件即服务的实现。在这里，整个软件栈以及所需的平台和基础设施都作为服务提供给用户。在这种方法下，用户可能必须专注于输入数据而不是编写新算法。`SaaS`对于于执行由提供者定义的业务逻辑端用户有用。`SaaS`赋予用户更新软件或概念的活性较低。\n\
  \n### 2.2.4.2 云部署模型\n\n通常，云服务以四种方式部署。根据部署模型，云可以分类为：(a) 私有云、(b) 公有云、(c) 混合云和(d) 社区云。服务以不同的方式部署：\n\
  \n1. `私有云`：私有云是由单一组织共享资源的部署模型。例如，组织可以使用可用资源建立私有云。虽然私有云的安全性更高，但对于`IaaS`、`PaaS`或`SaaS`等服务的设施成本非常高。\n\
  \n2. `公有云`：在公有云部署模型中，资源由第三方提供者托管。最流行的第三方提供者包括`Amazon`、`Google`、`Microsoft`等。这些公司致力于数据中心。公有云最重要的优势是：(i)\
  \ 高扩展性的资源可用性；(ii) 客户零维护；(iii) 安全；(iv) 快速更新选项；(v) 更高的资源利用率。然而，公有云在许多情况下面临供应商锁定问题。在供应商锁定问题中，客户直接或间接地锁定服务。\n\
  \n3. `混合云`：混合云部署模型允许私有云和公有云基础设施相结合。这种部署模型赋予了私有云更大的活性。然而，为了满足需求的需求，可能会从公云租赁某些资源。为了增加云的安全目标，在大多数部署中，从业人员在需要处理安全敏感型负载时尝试提供私有云基础设施，并将不重要的任务提交给云。由于混合云部署模型结合了私有云和公有云的特征，它们获得了它们最重要的特征，即可扩展性、资源优化、安全成本效益。\n\
  \n4. `社区云`：这种部署模型涉及社区之间资源的专门化部署。药物发现、科学、星系研究等社区需要来自多个组织的私有基础设施。\n\n### 2.3 学习技术：机器学习\n\
  \n学习是生存的一项重要任务。人类由于母亲、学校老师、经验丰富的教职工等输入的经过训练的信息，从小就学习了大量信息。人类的学习过程在机器中以多种方式建模，以便机器能够从环境中学习和推断数据。\n\
  \n#### 2.3.1 机器学习：历史\n\n事实上，学习方法最初在 20 世纪 50 年代初以`AI`的形式为机器开始。在此期间，规则和逻辑是执行在机器上的的学习算法中最重要的成分。遗憾的是，专家必须对构建规则和逻辑更加警惕，以使学习输出对用户具有合理的吸引力。\n\
  \n\n\n在 21 世纪初，由于传统的基于人工智能（AI）的推理或学习过程存在困难性，机器学习的概念发生了演变。在机器学习中，提供的是数据和结果，而不是用于学习环境的规则或逻辑。机器学习的结果是形成一组规则和逻辑，使得在许多工作环境中，新的发现和学习更具现实性。\n\
  \n因此，基于机器学习概念开发了多种学习算法，使得算法能够根据输入数据和环境结果构建新的逻辑。例如，`random forests（随机森林）、`support\
  \ vector machines（支持向量机）、`XGBoost`、`perceptrons（感知器）等算法在各个领域的发展速度更快。\n\n## 2.3.2\
  \ 算法视角\n\n在短时间内，机器学习的增长非常显著，并被分为三类：(i) 监督学习、(ii) 无监督学习和(iii) 强化学习。这三种类型描述如下：\n\n\
  1. **监督学习**：监督学习是一种根据标记数据集（即训练数据集）对目标进行推理的学习过程。标签由专家或经验丰富的系统提供。因此，在监督学习中，训练数据的数据和推理结果是预先知的。相应的，新的推理将根据新的数据集制定。归类监督学习过程的少数算法包括`random\
  \ forests（随机森林）、`regression algorithms（回归算法）`和`support vector machines（支持向量机）`。\n\
  \n2. **无监督学习**：在无监督学习中，数据在学习过程之前没有标记。当学习算法未知数据或给定数据的特征未经过工程处理时，这种方法是有用的。虽然不需要标记，但由于特征工程的复杂性，这种学习过程在从数据中推导知识方面面临困难。此外，算法的迭代学习没有指定的反馈。因此，无监督学习比机器学习算法更适用于深度学习算法。属于无监督学习算法类的少数算法包括`先验算法、`k-means\
  \ clustering（k 均值聚类）`和`hierarchical clustering algorithms（层次聚类算法）`。\n\n3. **强化学习**：强化学习是学习的一个子集，学习取决于环境的最佳条件。当学习算法未知环境时，这种学习过程运行良好。学习算法必须通过随时间获得的奖励或惩罚研究环境。通常，这些过程涉及几个学习智能体，以从环境中获取知识并建议正向或负向的决策。\n\
  \n### 2.4 学习技术：深度学习\n\n深度学习是人工智能和机器学习的一个子领域。深度学习的想法是深入挖掘数据以理解特征和表示，使得决策比机器学习算法更准确。深度学习与机器学习相比的主要区别在于在深度学习过程中利用的数据类型。深度学习算法在学习学习时可以考虑非结构化数据。相比之下，机器学习算法期望结构化数据。\n\
  \n深度学习包括从输入数据中学习表示的多个层。输入数据可以是图像、视频、音频等。图像输入通过多个学习层，这些层将图像转换为跨层的有意义的表示。具有此类学习层的背后的想法是精细调整数据的表示，以便从深度学习算法的最后一层获得更具意义的表示。\n\
  \n通常，深度学习算法根据输入数据和学习要求分为几类。最常用的深度学习算法类型如下：\n\n1. **多层感知器**：多层感知器是一种深度学习网络，由多个输入层、输出层和隐藏层组成。这些层是全连接的并接收向量输入。感知器遵循前馈神经网络的方法，这非常适合单图像分类问题。\n\
  \n2. **卷积神经网络 (CNN)**：CNN 是最广泛使用的深度学习算法。它们由卷积层、激活层、池化层和全连接层组成，用于对复杂图像输入数据集进行分类。它们应用于许多与计算机视觉相关的任务中，因为它们可以检测数据集的空间层次特征。\n\
  \n3. **目标检测算法**：有一些深度学习算法，如`递归 CNN、`fast R-CNN`、`faster R-CNN`、`YOLO`和`单次检测 (SSD)`，用于从图像或视频帧中检测目标。这些深度学习算法有其特性。\n\
  \n4. **循环神经网络 (RNN)**：这是一种适用于序列数据的深度学习算法。该算法以时间序列的方式检测数据具有独特特征。显然，有许多应用程序可以使用 RNN\
  \ 执行深度学习功能。例如，在 RNN 中记忆旧序列可以自然语言处理或单词预测问题。\n\n5. **自动编码器**：在自动编码中，通过提取数据特征来压缩输入数据：即将高维输入数据转换为低维数据。通常，当数据和学习模型必须在资源受限的边缘设备上处理时，倾向于使用自动编码器。它是属于无监督学习类的学习算法。变分自动编码器是自动编码器的一个子类。\n\
  \n6. **生成对抗网络 (GANs)**：GANs 是一种深度学习模型，可以根据特定特征生成数据集 [6]。例如，生成涉及动物的人脸、创建有趣的卡通、制定特定领域的领域的设计等都是\
  \ GAN 的示例。GANs 在生成新数据集时由生成器和判别器组成。生成器的作用是创建新数据集，而判别器试图找出生成器生成的假图像。生成器的目标是开发出与判别器竞争且不被识别为假的图像。\n\
  \n### 2.5 边缘 AI 架构\n\n边缘计算涉及不同放置级别的边缘节点，包括移动计算节点。根据底层特征，我们可以对边缘 AI 应用的架构进行分类。这些架构提供了完成边缘\
  \ AI 任务的组件抽象视图。本节详细介绍了不同的边缘 AI 架构。\n\n#### 2.5.1 通用架构\n\n通用架构在设计架构的软件或硬件组件时关注多个应用场景。这种架构是一种简单的方法，描述了核心组件并模拟了边缘计算的关键功能。它基于分布式计算环境，专注于建立基于云、雾和边缘节点的计算连续性。\n\
  \n边缘计算通用架构的重要构建块列如下：\n\n\n\n\n\n1. `IoT 能力的传感器节点`：传感器节点通过有线或无线连接连接到具备网络功能的基础设施。这些传感器节点可以通过管理网络被发现。通常，这些传感器节点是低功耗设备，需要额外的通信模块与其他网络进行通信。\n\
  \n2. `连接性网关`：为了与其他网络顺畅通信，传感器节点通常连接到网关。IoT 网络的另一个重要挑战是 IoT 传感器床中传感器节点的数量。其数量和密度可能很高，因此处理这些单个设备可能成为一个挑战。显然，这些设备需要使用\
  \ `IPv6` 地址协议进行处理。因此，网关可以在边缘计算架构中映射网络之间的协议转换。\n\n3. `可扩展的雾或云`：传感器节点通常是廉价的节点，无法承担巨大的计算。因此，大量的复杂计算被卸载到可扩展的计算节点上，如雾节点或云集群。例如，计算机视觉应用需要强大的计算节点来处理视频文件和图像。\n\
  \n图 2.4 展示了 IoT 应用程序的通用架构，其中传感器和执行器连接到网关，通过涉及边缘、雾和云服务器的大型计算连续进行逻辑计算。\n\n![图 2.4.\
  \ 通用 IoT 架构。](img/bk978-0-7503-5593-3ch2f4_online.jpg)\n\n**图 2.4.** 通用 IoT 架构。\n\
  \n#### 2.5.2 分层架构\n\n大多数边缘计算架构采用分层设计。在某些情况下，研究人员设计了 3 层到 5 层架构以增强应用中的层功能。必须观察到，层数可能会增加应用的计算开销。\n\
  \n在分层架构中，计算节点的布局是以层的形式组织的。例如，三层层架构将传感器或执行器放在底层，将网关放在中间层，并将基于云的可扩展计算环境放在较高层。一些作者设计了以物层、网络层、中间件层和应用层形式存在的边缘\
  \ AI 框架 [[[13]]。此外，也可以根据网络层（如物理层、网络层、传输层和应用层）对边缘 AI 系统的每个组件进行分层。\n\n#### 2.5.3 服务面向架构\n\
  \n边缘计算架构由分布式计算节点组成，可以结合多个松散设计的服务来实现其业务目标。这些架构通常围绕以服务形式编写的数据和概念逻辑。编程语言如 `Golang`、`Nodejs`\
  \ 以及 `Python` 和 `C++` 的一些库围绕着新的服务可用插件或方法展开，以满足服务组合。\n\n从边缘到边缘、边缘到雾、边缘到云以及反之亦然，服务的组合象征着此类架构中服务相关开发强有力且不懈的努力。\n\
  \n主要，边缘计算中的服务面向架构设计用于实时识别适当的学习算法、安全特性和数据源以执行任务。这是边缘节点的一项重要活动，因为它们在空间和电源方面受到限制。例如，`Raspberry\
  \ Pi` 是一个常见的例子。在这种情况下，将所有数据存储在边缘节点上是不合理的。\n\n除了安全之外，可能利用边缘设备的最常用服务列如下：\n\n1. `可视化服务`：有数百种可视化模式可以应用于应用中。例如，`柱状图`、`小提琴图`、`饼图`、`直方图`等。大多数应用都需要可视化格式的数据。在边缘节点上组织所有算法或业务逻辑通常困难。因此，可视化服务可能托管在附近的节点上。\n\
  \n2. `调试服务`：由于配置不匹配，在本地环境之外远程调试服务是复杂的。相比之下，调试相关的服务可以插入边缘节点。通过这种方式，各种调试器可以多次激活而不会消耗过多内存。\n\
  \n3. `通知服务`：传感器的应用程序通常安装有许多执行器，例如电气执行器、机械执行器、声学执行器等。通常通过边缘设备通过传感器节点发送电子邮件或警告消息。然而，现代通知服务或适当的通知服务在许多应用中随时间变化。在这种情况下，在不给微设备带来太大负担的情况下托管不同的服务至关重要。\n\
  \n4. `数据处理服务`：数据收集、数据过滤、数据解释、数据存储和相关任务可以由独立的服务处理。这些服务仅在应用需要时才被调用。因此，当需要处理数据处理时，微设备必须利用托管在雾节点或云节点上的外部服务，而不是在内部存储。\n\
  \n5. `分析服务`：在任何 IoT 应用程序中，传感器感知环境以测量属性，感到的信息通过应用学习算法（分布式或集中方法）进行评估和分析。边缘计算偏于在边缘设备上执行此类分析。在这种情况下，边缘节点必须在应用需要时利用服务。\n\
  \n图 2.5 展示了使用边缘节点交付的服务列表如下：\n\n![图 2.5. 在边缘节点上执行的服务。](img/bk978-0-7503-5593-3ch2f5_online.jpg)\n\
  \n**图 2.5.** 在边缘节点上执行的服务。\n\n#### 2.5.4 互操作性架构\n\n边缘计算设备结合传感器，部署在多个供应商支持的不同平台上。这些设备面临过多的异构性因素，例如策略、通信协议、设备能力等。迫切需要高效处理这些边缘启用应用程序的各种特性，特别是在需要互操作性时。[[14]]\
  \ 的作者开发了一种软件互操作性架构，通过特定的消息模式独特地处理异构边缘设备。\n\n#### 2.5.4.1 多供应商问题\n\n\n\n\n\n使用蜂窝网络的设备在组合成单一基础设施网络方面面临着长期以来的挑战。当利用不同网络的边缘设备在执行应用程序时从一个位置移动到另一个位置时，将面临可靠性问题和切换问题。有时，可能会出现无法在操作中继续恢复的非预期中断。此外，不同的供应商遵循多种连接程序并提供不同的硬件支持。因此，程序员在编写应用程序时，必须考虑这些因素，以获得更好的性能。\n\
  \n#### 2.5.4.2 通信协议\n\n有许多与边缘能力的传感器应用相关的通信协议。协议根据支持的网络或基础设施部署模型而异。例如，涉及移动蜂窝网络的无线通信支持如\
  \ `4G`、`LTE`、`Edge`、`5G`、`6G`等协议。涉及室内通信的无线通信支持`Bluetooth`、`近场通信 (NFC)`、`WirelessHART`、`Zigbee`、`Indoor\
  \ LoRa`、`WiFi`等协议。预计处理排除蜂窝网络的室外无线通信支持 `LoRAWAN`、`WiFi`、`WiFi5`等。这些多维通信协议在边缘计算设备中的互操作性是许多从业者面临的挑战。\n\
  \n#### 2.5.4.3 设备能力\n\n众所周知，边缘节点的计算和存储能力各异。最著名的边缘设备，如 `Jetson Nano`、`Raspberry Pi`、`ESPs`等，采用不同的配置制造。例如，大多数具有边缘能力的设备（即\
  \ `Jetson Nano` 和 `Raspberry Pi` 设备）具有 `1 GB`、`2 GB` 或 `4 GB` 的 `RAM`。少数设备具有高容量闪存单元，这与节点的计算服务能力不同。除了计算能力外，这些边缘节点在内存需求和可用条件方面也存在差异。\n\
  \n### 2.5.5 指标驱动型边缘架构\n\n边缘计算架构根据用于评估边缘 AI 应用的性能指标进行说明。`吞吐量`、`延迟`、`完成率`、`执行时间`、`等待时间`、`循环时间`、`响应时间`、`能耗`、`碳排放`和`成本`等指标可以调整边缘\
  \ AI 应用的或工作行为。如果架构以应用程序的性能指标为中心，则将其归类为指标驱动型架构。\n\n以下是关于指标的简要说明：\n\n-   **吞吐量**：该指标表示在给定时间内，边缘计算能力基础设施中完成的任务数量。\n\
  -   **延迟**：该指标解释了在边缘计算基础设施中处理请求时发生的时间性延迟。\n-   **完成率**：该指标用于评估托管计算基础设施的能力。它描述了基础设施在指定时间范围内处理的请求总数。\n\
  -   **执行时间**：该指标是时间相关的指标，表示边缘计算基础设施中的服务所花费的总时间（无论是墙钟时间还是 CPU 时间框架）。\n-   **等待时间**：这是任务在被基础设施或平台分配边缘设备之前必须等待的时间。\n\
  -   **循环时间**：该指标对应于任务在基础设施中完成工作所花费的总时间。这段时间还包括在架构中不同边缘节点上处理服务的等待时间。\n-   **响应时间**：该指标代表服务分配到边缘节点的时间。通常情况下，由于可用节点有限，资源无法分配。在大多数情况下，它们正忙于预分配的任务。\n\
  -   **能耗**：该指标用于监控基础设施中边缘关联节点的电池电量。它还涉及从电源和/或可再生电源提取的能量。\n-   **碳排放**：该指标突出了由于底层边缘计算基础设施产生的碳排放。在某些架构中，使用化石燃料为设备供电，而在另一些架构中，算法被设计为尽力将任务或服务卸到使用可再生能源供电边缘设备。\n\
  -   **涉及成本**：该指标研究边缘设备的应用价值。例如，包含 `Espressif` 的低功耗 `ESP` 比应用 `NVIDIA` 的 `Jetson\
  \ Nano` 设备更好。在某些情况下，减慢边缘相关任务不会影响应用程序的性能，但可以提高为这些架构购买此类强大加速器的相关成本。\n\n通常，指标驱动型架构具有动态性，即它们在运行时考虑与框架相关的指标，调整应用程序或边缘功能。性能问题和边缘\
  \ AI 应用挑战的详细解释请见第 7 章。\n\n### 2.5.6 开放/封闭架构\n\n边缘能力架构的设计取决于开发它们的联盟，基于开源政策或封闭政策。学术组织联合建立联盟开发开源架构，这使得研究人员和学生能够在新的、修改的作品上进行贡献和创新。相比之下，闭源架构是指源代码不向第三方披露的架构类型。它成为设计架构的公司的专有版权。\n\
  \n### 2.5.7 大/微/宏观级架构\n\n边缘能力架构可以包含较少的计算节点或可扩展的计算节点来承担任务。例如，`Amazon` 提供了一个 `AWS\
  \ Greengrass` 组件，以让尽可能多的边缘设备参与应用程序。这些组件的参与由于边缘和云基础设施的结合导致了可扩展的环境。因此，包含更多可扩展计算环境以提高性能的架构被称为大型架构。\n\
  \n根据计算基础设施的规模，边缘计算基础设施可以分为微级或宏观级架构。例如，如果使用一个到三个边缘节点来构建边缘架构，则该架构被称为微级边缘架构。然而，如果边缘设备的数量从三个增加到十五个，该基础设施被称为宏观级边缘架构。\n\
  \n### 2.5.8 安全特定架构\n\n在物联网支持的应用中，研究人员和从业者致力于提高设备的隐私性或安全性。最重要的是，边缘能力应用程序的视频帧或面部图像必须经过安全保护、存储和处理。使用特定算法或安全机制保护此类数据隐私的架构被认为是面向安全的边缘能力物联网架构的示例。\n\
  \n这些架构通常具有以下设计动机：(a) 应用区块链以防止机器或入侵者破坏数据的不可篡改性 [18]。(b) 应用异常检测机制以自动检测安全漏洞并向相关进程或通知者报告。(c)\
  \ 防止传感器或连接边缘的节点受到恶意软件攻击 [8] 等。\n\n\n\n\n\n图 2.6 展示了过去由若干研究人员和实践者实施的边缘计算架构分类的整体图景。\n\
  \n![图 2.6. 边缘支持计算架构。](img/bk978-0-7503-5593-3ch2f6_online.jpg)\n\n**图 2.6.** 边缘支持计算架构。\n\
  \n### 2.6 结论\n\n本章描述了学习边缘 AI 系统所需的基础技术。特别是 `IoT`、包括 `5G` 在内的通信协议、云技术以及边缘架构等主题。读者将接触这些主题，以便更好地理解边缘\
