  \n[content]\n进程状态\n\n1. **就绪态（Ready state）**：在此状态下，为进程的执行创建了资源。这些资源包括线程、内存单元和其他资源。就绪态是设备进入分配了\
  \ CPU 执行的设备中运行态的指示。该状态由操作系统的调度器管理。在某些情况下，程序的状态会在运行进程之间进行切换。\n\n2. **运行态（Running\
  \ state）**：正在执行的程序称为运行态。指令必须使用特定的 CPU、内存或计算单元进行执行。在进程的运行期间，除非发生任何中断或硬件故障，否则必须间断执行进程。\n\
  \n3. **阻塞态（Blocked state）**：如果进程等待数据处理或指令执行，则会进入阻塞态。程序员可能会由于预期的资源或输入数据不可用而故意延迟进程。在这些情况下，将进程设置为阻塞态是关重要的，这样其他进程就可以利用资源。进程阻塞态的优势是具有在一段时间后恢复操作的能力。例如，进程的\
  \ `delay(2)` 函数会阻塞进程 2 秒，并自动恢复。\n\n4. **挂起态（Suspended state）**：当指令在特定时间内不执行时，进程被认为处于挂起态。这与进程的阻塞态相似。然而，挂起的进程不能自动恢复，即没有特定的时间段来停止和启动进程。它在等待另一个进程来恢复其操作。\n\
  \n## 3.6 FreeRTOS：用于嵌入式设备的操作系统\n\nFreeRTOS 是嵌入式设备中常用的流行操作系统之一。FreeRTOS 是一个轻量级操作系统，用于管理进程、调度任务和处理中断。在本节中，我们将学习\
  \ FreeRTOS 在基于 `esp32` 的处理器上的应用。\n\n### 3.6.1 FreeRTOS: ESP 32\n\n由于 FreeRTOS 支持如\
  \ `ESP-IDF` 等集成开发环境，因此可以很容易地移植到基于 `esp32` 的微控制器上。`ESP 32` 微控制器（例如 `ESP 32-WROOM`\
  \ 开发板）具有双核心，可以同时处理多个任务。为了在在较小的嵌入式板上支持多任务处理，`ESP-IDF` 已将 FreeRTOS 原生集成到 IDE 中。这一理念是让用户（特别是程序员）在使用操作系统，而不是直接对设备进行编程。\n\
  \n在基于 `ESP 32` 的板上包含 FreeRTOS 的优势如下：(a) 设备与应用的集成，(b) 执行并行任务，(c) 高效利用定时器，(d) 组织信号量，(e)\
  \ 处理多种通信协议如 WiFi、蓝牙、`BLE`、`HART` 等，(f) 启动任务队列，(g) 使用复杂的算法调度任务等。\n\nFreeRTOS 以及创建任务或调度函数的相关函数是以\
  \ API 的形式实现的，以便用户可以在其功能逻辑中调用这些函数。最初，用户必须导入头文件中定义的适当库，例如：\n\n```\n#include <freertos/FreeRTOS.h>\
  \ // 用于 FreeRTOS\n\n#include <freertos/task.h> // 用于任务\n```\n\n### 3.6.2 并行任务\n\n\
  由于 `ESP 32-S` 开发板具有两个核心，因此多个任务在这些微控制器中是并行执行的。在本小节中，我们将探索在部分 Espressif 开发板上执行基于 FreeRTOS\
