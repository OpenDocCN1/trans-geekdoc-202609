  \n***\n\n# 第一部分\n\n## 引言\n\n***\n\n\n\n\n***\n\n# 第一章\n\n# 边缘智能\n\n边缘计算是一种计算范式，将少量计算资源安排在靠近数据源的地方。它促进了稳健的计算架构在协作学习过程中以新颖的方式运行。边缘计算激励了医疗、农业、工业、教育、金融等多个领域的研究人员和从业者应用边缘计算的核心要素，即将服务从云级网络推向边缘级末端网络。本章解释了边缘计算的基础知识，并介绍了使用深度学习算法应用的边缘智能。\n\
  \n### 1.1 边缘计算\n\n一个现代物联网（IoT）应用由分布在不同地理位置的计算/存储单元组成，包括外围资源，即靠近传感节点的资源。这些计算/存储资源单元通常是微小的，且计算能力低于远端的云端节点。\n\
  \n发生在靠近数据源的外围设备上的计算被称为边缘计算。它是传统分布式计算范式的扩展。边缘计算允许在不包含云端或集中处理节点的情况下创建小型去中心化网络。\n\n\
  事实上，边缘计算为各个领域的研究人员创造了巨大的机会。例如，企业应用边缘计算 [10] 在处理其客户数据的同时增强业务能力；机器人设备利用边缘计算 [15] 快速处理自动汽车等自主决策。最重要的是，将数据密集型物联网应用引入智能给成千上万的研究人员带来了挑战。\n\
  \n#### 1.1.1 边缘计算的目标\n\n在物联网应用中引入边缘计算的主要原因列举如下：\n\n1. 硬件成本：近年来，通用硬件单元的成本大幅下降。开发者构思基于这些设备创建廉价的软件或智能解决方案。例如，树莓派的成本低于\
  \ 4000 卢比。显然，可以创建一个 `Pi` 集群以在应用智能的同时提高性能。\n\n2. 隐私与安全：设计者增强了边缘应用的隐私。例如，如果利用边缘计算，人类的情绪等数据就不会提交给云资源以研究人类特征的行为；同样，当学习模型传输到分布式学习平台的集中学习模型时，手机的数据得到了保护。\n\
  \n3. 网络带宽：边缘计算可以减少传感应用的网络带宽 [9]]。这是因为数据不再发送到云端或数据中心，而是在靠近数据源的地方进行处理。大多数网络用户从中受益浅，因为边缘计算系统的网络末端吞吐量有所提高。\n\
  \n\n\n\n\n## 4. 避免供应商锁定\n边缘计算可以缓解整个云端解决方案带来的严重供应商锁定威胁。尽管无服务器计算（serverless computing）等现代执行环境近期出现，但由于内部架构限制，供应商锁定问题依然存在。值得注意的是，基于边缘的实现为在多个供应商的边缘节点（包括其资源）上调度计算铺平了道路。供应商锁定问题对经济增长型初创公司造成了严重的负面影响。例如，该问题可能会给初创创始人带来成本增加、业务/服务中断以及不可预见的未来成本。\n\
  \n## 5. 能量/性能效率\n边缘计算可以为支持物联网（IoT）的应用程序提供更高的性能/能量效率。在处理并发任务或程序的情况下，这一特征尤为突出。通常情况下，边缘计算节点无法执行大规模的计算程序。处理此类任务需要一种优雅的方法来应对。\n\
  \n## 6. 大数据处理\n计算机视觉研究领域的大多数最新应用对计算节点的输入数据存在激增的可能。在集中式服务器上获取所有这些数据被认为并不是最优解决方案。边缘计算凭借其去中心化的网络，为数据处理提供了更好的解决方案。例如，数据服务器可以去中心化并更靠近边缘，这样云端数据中心仅需要有限的数据。图\
  \ 1.1 展示了将边缘计算引入特定 AI 应用中的目标。\n\n![图 1.1. 边缘计算的目标。](img/bk978-0-7503-5593-3ch1f1_online.jpg)\n\
  \n**图 1.1.** 边缘计算的目标。\n\n### 1.2 边缘计算的历史\n边缘计算是基于之前的云概念演变而来的，其被称为内容分发网络（CDN）。事实上，CDN\
  \ 的演变可以追溯到 20 世纪 90 年，当时部分带宽密集型视频和数据内容在本地区域进行处理。\n\n在靠近数据源的地方处理数据的核心概念在 2009 年作为“云微”（cloudlets）被重新引入。在云微方法中，重点不仅在于内容，还在于靠近数据源的极简版本计算单元。这些云微被称为微型云数据中心，更强调丰富移动应用程序。\n\
  \n在随后的几年中，大约 2012 年，引入了涉及集群服务器的概念，命名为用于传感应用的“雾化计算集群”（fog computing clusters）。这些集群通常托管在市中心或工厂位置。雾化计算单元是强大的设备，导致了昂贵的安装成本。\n\
  \n为了克服安装纯雾化集群的挑战，边缘计算概念演变出来，它辅助了终端设备与计算节点之间的离线和在线通信。\n\n### 1.3 边缘智能\n利用边缘计算的核心目标之一是在边缘进行学习、推理和行动。通过这种方式，应用程序可以获得关于数据的近乎实时的洞察，并根据边缘级处理的数据执行决定性行动。边缘智能主要以两种广泛的方式部署：(i)\
  \ 基于机器学习的智能；以及 (ii) 基于深度学习的智能。\n\n#### 1.3.1 基于机器学习的边缘智能\n在此类别中，机器学习算法被部署在边缘节点或设备上，以捕获、学习、评估并对关键活动做出决策。这些任务需要具有敏捷性，且不损害预期的学习质量。\n\
  \n边缘设备需要通过在边缘实现机器学习算法和模型，自动识别学习模式、检测异常并实时修改数据行为。显然，应用边缘级智能时决策速度将更快。例如，在应用边缘能力系统时，预测性维护会更快\
  \ [2]]。\n\n传统的机器学习模型（如随机森林、支持向量机、贝斯定理等）在处理数据方面存在局限性，即学习准确性会随着输入数据的增加而降低。这是因为随着输入数据的增加，学习准确率会下降。\n\
  \n#### 1.3.2 基于深度学习的边缘智能\n深度学习通常是机器学习的一个子领域，旨在模拟人类的大脑。近年来，大多数现实应用在边缘节点集成了深度学习，这涉及使用强大的计算机或设备来处理海量数据\
  \ [6][11][14]。广泛应用的深度学习算法包括卷积神经网络（CNN）、图像分割算法、生成对抗网络（GAN）、强化学习（RL）以及 Transformer。\n\
  \n#### 1.3.3 边缘智能的热度\n边缘计算和深度学习算法在边缘节点的应用让研究人员应接不。成千上万的研究人员对这些主题的发展做出了贡献。在过去，论文数量急剧上升。例如，对于“边缘智能”关键词，论文数量在\
  \ 2023 年超过了 30000 篇，而 2009 年仅为 2637 篇（见图 1.2）。\n\n![图 1.2. 边缘智能的论文。许可来自 https://www.lens.org。](img/bk978-0-7503-5593-3ch1f2_online.jpg)\n\
  \n**图 1.2.** 边缘智能的论文。许可来自 https://www.lens.org。\n\n此外，截至 2024 年，IBM、三星、戴尔、英特、AT&T\
  \ 等公司拥有“边缘智能”关键词的授权专利超过 16. 万项 [7]。\n\n### 1.4 边缘智能的优势\n围绕边缘智能的热度如此之，各种深度学习算法已集成到基于边缘的环境中。边缘智能的潜在增长因素是多方面的，如下所示。\n\
  \n#### 1.4.1 低延迟\n将边缘智能应用于应用程序可以提供更快的响应，以实现真实的智能应用。通常，边缘智能旨在提供靠近数据源的决策过程。例如，使用手机的用户可以根据应用程序的功能检查心率、温度等健康参数。用户可以以视觉形式查看实时数据和处理历史数据。所有这些应用程序通常都在边缘级计算节点上执行。\n\
  \n可见，数据不需要传输到托管在去中心化第三方服务器上的云服务中，这涉及到边缘、雾和云服务器的结合。\n\n#### 1.4.2 增强的安全性\n\n\n\n\n\
  \n边缘计算总的来说为数据和硬件组件提供了安全保障。例如，数据在靠近传感器的地方进行处理，这意味着这些数据注定位于设备所在的网络管理区域内。这一特性在专用框架中应用深度学习算法或某些分布式学习技术（如联邦学习）时，增强了安全性。\n\
  \n#### 1.4.3 带宽效率\n\n提供边缘级智能减少了云端设备与其他层级节点之间的通信。在传统的学习方法中，传感器数据被传输并存储在云端存储单元中。数据对存储单元的亲属性并不由云用户控制，而是由云提供商或基础设施提供商进行配置和部署。\n\
  \n由于提供了边缘控制单元，根据内存空间的可用性，更有可能将数据定位在无关的分布式云存储单元上。这种行为会导致携带传感器数据进行处理或将其存储在云单元上的网络带宽增加。\n\
  \n### 1.5 挑战：边缘智能\n\n尽管有许多应用边缘级智能的热门方法，但边缘智能的概念存在一些缺点或挑战。最常见的挑战列举如下：\n\n- **异构性**：边缘级设备在本质上是异构的。这种差异从架构变化到编程层的变化不一。例如，边缘计算设备由中等性能的计算服务器或电池供电微控制器设备组成。设备之间的处理能力和存储容量存在显著差异。因此，底层计算差异被认为是开发整体边缘智能系统的一项关键挑战。\n\
  - **配置设置**：支持传感器的边缘网关或设备可以使用多种参数进行配置。例如，乐鑫的基于 `ESP` 处理器的板通过开启或关闭蓝牙或 WiFi 组件进行配置。注意的是，设备的性能和能耗值各不相同。因此，迫切需要捕捉适当的配置设置以更有效地处理基于边缘智能的任务。\n\
  - **大数据处理**：在处理边缘智能时，存储来自物联网支持传感器源的海量新兴数据，或者在考虑边缘节点可用内存容量限制的情况下优雅地处理这些数据，被认为是一个挑战。\n\
  - **多样化的输入流**：在边缘节点处理的传感器数据具有多模态输入数据以处理某些应用程序。例如，需要处理语音助手应用的边缘设备必须处理音频文件；某些设备必须处理视频流以便对图像进行高效处理。\n\
  - **机器故障**：小型商品硬件组件发生故障的概率更高。这些设备会耗尽内存空间或发生组件故障，如 WiFi 或 BLE 不可用。显然，对于相关应用程序或调度器来说，高效地组织机器变成了一个艰巨的任务。\n\
  - **数据隐藏/篡改**：在边缘设备上拥有所有数据源和处理元素使得它们容易受到数据篡改或数据隐藏问题。数据篡改是终端设备或人工操作员试图修改数据源内容的过程。这样做会导致云服务器或应用服务无法处理适当的数据。隐藏数据是某些数据不暴露给层级节点或处理元素的过程。因此，预期的输出将与实际情况不符。\n\
  \n### 1.6 应用\n\n将深度学习或相关学习算法应用于边缘设备已在多个领域得到实践。近年来，边缘支持应用的出现显著增加。一些具有深度学习算法应用潜力的热门边缘支持应用被分为几类，详细如下所示。\n\
  \n#### 1.6.1 零售部门\n\n向位于国家或州不同地区的销售商品是一项艰辛的任务。数百万人产生了大量数据，需要在靠近边缘节点的地方进行处理。例如，识别客户群、研究客户的需求和需求、自动下单等，增加了智能在边缘节点中的应用，特别是使用深度学习算法的应用。\n\
  \n#### 1.6.2 农业部门\n\n过去一直尝试在没有云服务器辅助的情况下，使用边缘节点对远程农场做出决策。特别是跟踪农场 [5] 和观察作物的健康状况吸引了边缘节点的参与而非云端。有数万个用例利用物联网传感器节点来管理农业解决方案。然而，近年来，将边缘支持智能应用于农业部门现有解决方案的兴趣引起许多研究人员的极大关注。\n\
  \n#### 1.6.3 医疗保健部门\n\n由于需要在提供智能的同时保护患者隐私，将边缘智能应用于医疗保健应用是一种合适的方法 [13]。在医疗领域，许多控制连接执行器或需要即时本地响应的应用程序被认为是潜在的用例。例如，医疗部门的跌倒检测解决方案（需要监测老年人以防止因跌倒导致不必要的骨折）由安装在纺织品或可穿戴设备上的气球等执行器组成。当身体运动期间角度超过特定阈值时，必须立即激活这些气球。一些作者已经开发了一种年龄估计方法，以关联老年跌倒检测系统\
  \ [8]。\n\n#### 1.6.4 教育部门\n\n在教育领域，教师必须从多个角度解释概念。通过这样做，解释概念将变得更容易。在这种背景下，开发了基于物联网的虚拟现实解决方案。学生可以基于物联网设备，虚拟地感受和触摸人体器官、学习打网球、对机器人问题做出反应等。为了获得更好的结果和响应时间，边缘智能被应用于这些解决方案。研究人员已经证明了使用边缘计算改进向云端的数据传输\
  \ [12]。未来，有可能开发教育机器人，通过收集学科所需的的新信息来模拟老师或教授。\n\n#### 1.6.5 工业部门\n\n边缘智能在工业部门相当常见。工业有许多机器需要从人类无法到达的位置收集细微信息。此外，机器必须向其他机器通信其状态以进行自动流程。在某些情况下，机器需要通过应用机器智能生态系统（例如数字孪生）进行训练。显然，边缘智能在该领域起着至关作用，因为需要处理智能并提供及时决策。此外，研究人员和从业人员创建了一个名为“工业边缘计算”的子领域，通过创新理念加速工业流程并通过多种方式创造收入。例如，[4]\
  \ 的作者开发了一种容器放置机制，可以有效降低资源利用涉及的成本。\n\n\n\n\n\n#### 1.6.6 金融领域\n\n金融领域实施的主要维度侧重于为金融通信提供安全性。在边缘解决方案的帮助，提供实时金融洞察、在线采购国际贸易组件、开发个性化金融交易等已成为利润丰厚的模式。在金融领域，以安全为导向的解决方案是使现有金融市场发生变革的关键因素。基于信用卡自动提供支付的近场通信设备在所有交易中必须确保安全。未来的解决方案必须具备基于边缘设备的直接通信和智能功能。\n\
  \n#### 1.6.7 智能城市领域\n\n智能解决方案被整合到智能城市解决方案中，以管理免费资源、提供智能停车场 [1]、增加公民收入、提供智能照明、提升公民幸福感等。事实上，使用边缘设备评估市民的情绪比将市民图像传输到第三方云环境是更好的解决方案。智能城市领域的一些应用在纯\
  \ IoT 系统领域已经非常成熟。然而，考虑到边缘智能的应用，许多重大项目仍待启动。\n\n#### 1.6.8 交通领域\n\n在轨道、航空、道路和水路等所有运输媒介中，边缘智能起着主要作用。例如，铁路轨道上的信号、旅客控制、乘客引导、飞行计划、物流规划等。事实上，在未来，大多数机器人或设备将具备根据历史信息自动做出决策的能力。因此，研究人员对探索提高安全处理这些任务的效率的可能性感兴趣。\n\
  \n预计智能协作交通系统在未来将演进。考虑到街道空气质量或自然修复性污染水平的智能移动解决方案将在未来几年内成为一种实际规范 [3]。\n\n#### 1.6.9\
  \ 游戏领域\n\n随着现代世界人们之间社交参与的减少，视频游戏玩家的数量日益增加。游戏行业已开始根据玩家的需求进行改进。通常，涉及多个去中心化地理位置玩家的协作游戏需要游戏流媒体、虚拟现实以及传感器技术等联盟技术，以有效处理玩家的游戏规则。\n\
  \n事实上，将深度学习的变体应用于玩家的边缘设备上，除了常规流程外，还可以增加游戏体验。玩家将在音频、视频和文本描述的参与下体验近实时的游戏。\n\n####\
  \ 1.6.10 个人领域\n\n泛计算在过去出现是为了使用摄像头、智能手机、语音助手等设备来丰富个人活动。因此，大多数用户已开始利用更多的设备来确保他们在工作期间保持高效。例如，一位作家会选择让更靠近办公办公室的设备，这些设备会提醒他们最近的话题、主题语义、词汇建议、语法纠正引擎等；类似地，一位家庭主妇会选择设备自动通知他们从杂货店或商店购买商品是否有货。在这一领域做出决策之前，评估个人特征是是要求的。显然，通过整合基于边缘的智能解决方案，会出现能够自动确定最佳方案的设备。\n\
  \n图 1.3\n\n### 1.7 本书的意义\n\n编写这本书的动机是揭示深度学习在边缘节点上的重要性。许多研究人员得出结论，云对于执行应用是不够的。在这种背景下，我们必须了解基于边缘技术的内部细节。这本书将拓宽研究人员、学生、工业界和从业者的知识和思维过程。\n\
  \n对于下一代应用开发者和从业者来说，这本书是至关重要的，原因如下：\n\n1. 它提供了许多关注图像分类、图像增强、单词分析、人机接口等的技术。\n2. 它探索了涉及边缘计算的技术，例如模型压缩、迁移学习、联邦学习、分布式智能的能源效率等方面等。\n\
  3. 它提供了开发者或研究人员可以整合的平台和技术。这里讨论的平台可以通过读者通过结合其固有的想法进行扩展。\n4. 它解释了不同边缘设备（包括边缘级加速器）对于提高应用性能的重要性。\n\
  5. 它提供了基于边缘的深度学习技术，可在推理上提供准确的决策。\n6. 此外，还解释了一些应用，为未来的开发者揭示了示例用例。书中给关注大象情感分析和强调社会提升的业务组合的应用。\n\
  \n### 1.8 潜在读者\n\n我在考虑全球市场多元读者的情况下编写了这本书。这些潜在读者对这本书可能有特定的观点：\n\n* **学生**：他们可能想了解边缘节点在开发智能解决方案中的应用。事实上，元宇宙应用或公益应用需要边缘计算。学生将理解此类边缘计算在创新应用中的重要性。\n\
  * **研究人员**：他们可能需要阅读这本书来学习过去许多其他研究人员和工业界处理的现有技术。这本书将为边缘计算领域的未来类型研究提供更深层的知识和见解。\n\
  * **从业者**：在阅读这本书时，从业者将获得更多创新的想法，因为它指出了几个涉及开发边缘智能产品的新想法和解决方案的示例。\n* **政府/智能城市官员**：这里提供的技术可以为智能城市官员提供最佳实践指导。例如，他们将获得在边缘学习公民行为的同时维护隐私的见解；他们将了解如何利用特定的边缘加速器来实现他们的政府项目。\n\
  \n### 1.9 书的结构\n\n\n\n\n\n本书分为四个主要部分。\n\n## A 部分：基础知识\nA 部分包含第 1 至 3 章。在这一部分中，讨论了理解边缘智能最重要的基础知识，例如\
  \ `IoT`、架构、传统的 `ML/DL` 等。\n\nB 部分深入探讨了使用边缘辅助节点开发边缘级智能的核心概念，包括 `Jetson Nano` 等加速器。第\
  \ 4 至 8 章涉及了读者需要理解的学习方面以及相应的性能或安全特性。我尝试了尽可能涵盖边缘级智能的技术，以便读者对现有技术有更深入的见解。\n\nC 部分的第\
  \ 9 章和 10 章描述了使用深度学习或类似学习算法提供边缘级智能的工具和平台。提供这些现有工具是为了让读者通过增强或整合针对问题领域的工具来开发新的技术。\n\
  \n剩余章节出现在 D 部分，重点介绍了在各个领域广泛使用的应用，并提供了合适的示例。这部分为学生、研究人员或项目爱好者提供了职业生涯中可以开展的一些建议。\n\
