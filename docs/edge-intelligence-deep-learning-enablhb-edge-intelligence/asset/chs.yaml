  \ AI 应用的任务之一。因此，研究人员和开发人员已经在边缘 AI 框架或架构中提供了许多方法和解决方案。本章将解释侧重于为边缘 AI 应用编排资源或任务的工作。它探索了应用的编排模式以及模式的优缺点。\n\
  \n## 10.1 编排与集成\n\n有效地编排资源和任务以执行边缘 AI 任务，对于现代应用至关重要。应用开发者并不擅长了解设备的异构性；他们也无法处理参与边缘\
  \ AI 应用的设备集成。编排或集成平台负责为边缘 AI 应用映射适当资源。\n\n### 10.1.1 特性\n\n为了协助应用开发者处理边缘 AI 应用，编排平台应该具备一些重要特性。平台应提供的特性列表如下：\n\
  \n1. 编排平台应该根据环境的固有参数做出自主决策。这些平台包含了执行自动化决策的软件和硬件组件。\n2. 平台必须通过实时监控应用的执行情况来学习环境。\n\
  3. 编排平台必须为识别出的正确资源提供适当的负载。如果平台开发得不好，资源和任务将无法高效映射。这会导致性能低劣。\n\n事实上，要识别出一个包含所有编排平台所需特性的整体设计或框架是非常具有挑战性的。\n\
  \n### 10.1.2 方法\n\n边缘 AI 应用的编排平台可以根据各种因素（包括负载）重点进行开发。例如，平台可以侧重于编排负载而非聚合资源；平台可以通过开发特定算法的修改来增加任务的并行性或分布性；平台可以强调资源的交付，即在解决边缘\
  \ AI 应用时进行分层或非分层的资源分配；某些平台致力于提高负载或资源编排的适应性；某些平台侧重于以自动方式提供资源或执行任务；某些平台侧重于基于性能指标共享资源等。\n\
  \n在随后的章节中，我们将学习侧重于不同角的编排平台。图 10.1\n\n**图 10.1.** 边缘 AI 中编排方法的整体视图。\n\n## 10.2 算法/应用编排\n\
  \n算法编排是一种协调和管理应用的方法。在边缘 AI 领域，应用具有某些目标，这些目标可以拆分为更小的函数或模块。应用的编排旨在结合多个应用或同步较小任务/功能的能力以满足所需的功能逻辑。\n\
  \n在大多数情况下，应用以服务的形式存在。服务提供面向服务的实现，服务某些目的以满足用户需求。编排多个应用或服务的想法是提供多个松耦合的服务实例，而不提供目标的直接集成。通过这样做，与提供直接集成平台的传统方法相比，应用（尤其是边缘\
  \ AI 领域）可以获得更大的灵活性。\n\n算法或应用的编排是在分布式服务建立模式下进行的。提供分布式实现的主要比是为了满足地理分散的微型边缘设备的需求。\n\
  \n例如，应用采用了托管在基于 Kubernetes 的服务编排平台上的微服务。利用 `Kubernetes` 或 `Docker Swarm` 平台的理念是增加服务实例的可扩展性和可管理性。15。`Kubernetes`\
  \ 或 `Docker Swarm` 平台具有多个功能，例如监控托管微服务的容器、根据用户需求复制资源，以及在平台的多个连接的节点之间迁移容器或服务。\n\n\
  ## 10.3 负载编排\n\n负载编排是根据底层计算资源，根据指定的计算操作流编排任务的过程。与应用编排相比，负载编排考虑了资源和进程。通常，负载对应于执行应用或服务所需的计算资源数量。TinyML-Ops\
  \ [2] 为数据科学家提供了一个基于机器学习的编排框架。\n\n事实上，当与 IoT 相关的行业尝试自动化微型设备的服务并管理配置时，边缘 AI 领域对负载编排的需求变得显而易见。这些微型设备必须启动并启用以执行应用。在某些情况下，为了服务的顺利过渡，需要完成配置设置。\n\
  \n一些以有向无环图 (`DAG`) 形式表示的边缘 AI 应用由一系列可以在并行机器上执行的任务组成：即，某组任务的输出成为另一组任务的输入。有必要考虑底层资源（如容器、`VMs`、存储单元等）来协调这些任务。\n\
  \n负载编排必须处理与硬件软件解决方案相关的安全特性。例如，内存、`CPU`、`GPU` 和 `TPU` 等计算资源必须实例化并应用于应用，同时考虑身份验证功能并避免安全攻击。\n\
  \n一些研究人员开发了边缘系统中负载编排的模糊方法 [11]。通常，模糊逻辑对应于选择多个决策而非提供完全真假。模糊逻辑引发的程度提供了多个值。模糊概念开发于\
  \ 20 世纪 60 代，源于模糊集理论。\n\n在边缘 AI 平台中引入模糊逻辑目的是处理具有高度动态性的多种环境。在处理负载的决策中应用模糊性可以强化适当的变量从而增加业务。此外，在预期环境的不确定性中可以提高判断的准确性。\n\
  \n## 10.4 分层与非分层编排\n\n在边缘 AI 平台上编排资源或服务可以通过建立两种功能分类法来实现：(i) 分层和 (ii) 非分层。为服务或应用提供分层资源意味着决策的分层。如果在边缘\
  \ AI 平台上实施了分层，决策的性质就会变化，因为没有单一决策。然而，决策的管理可以根据较高层的决策进行控制。\n\n\n\n\n\n分层编排为资源交付提供了清晰的区分。这种分层结构可以根据业务领域、性能就绪状态、可解决条件等进行实施。\n\
  \n提供分层编排方法的主要优势如下：\n\n1.  **模块化决策**：资源分配和服务协调的决策被分组在一起，使用户可以在其管辖范围内体验到自主判断。此外，在每个分层实现中都可以包含按需策略。\n\
  2.  **工作负载抽象**：通过开发抽象，可以将资源或其工作条件进行抽象。同样，也可以创建服务和应用的抽象。抽象工作负载的目的是快速制定决策，并监控边缘 AI\
  \ 应用的服务级状态。\n3.  **易于调试**：工作负载或服务实例的分层分布可以最大限度地减少识别 bug 识别时涉及的瓶颈。在软件开发中，往往无法在合理的时间内追踪\
  \ bug，特别是在考虑如边缘 AI 框架之类的分布式计算系统时。通过应用分层结构，我们在细粒度层级上分配决策。这使我们能够快速调试平台中的故障或潜在瓶颈。\n\
  \n### 10.5 编排的自适应性\n\n在边缘 AI 平台中编排资源时的一个重要特性是根据实时参数进行适当调整。自适应工作负载编排是一种在少数边缘 AI 平台中的方法，根据应用程序的当前需求修改资源分配。\n\
  \n在不考虑工作负载需求自适应性的情况下，资源的持续交付可以通过静态或动态方式进行处理。静态资源交付是由平台或框架在启动应用程序之前分配的。一旦应用程序启动，资源分配将不再修改。静态资源分配的优势在于：(i)\
  \ 无复杂性；以及 (ii) 应用程序和服务的及时完成。也就是说，资源是预先定义并分配用于运行应用程序的。因此，编排资源不会因为资源不可用而失败。显然，此类应用的完成时间可以更准确地预先确定。\n\
  \n然而，以静态方式持续交付资源也可能会带来若干挑战：\n\n1.  由于过度配置，导致资源利用率不足。例如，可能只需要启动两个 `VM instances`\
  \ 或 `Docker containers`。然而，由于资源是以静态方式进行编排的，过度配置方法会在特定时间段内创建比所需数量更多的实例。显然，这增加了资源分配所涉及的成本。\n\
  2.  如果不对资源进行自适应编排，静态方式可能导致资源配置不足。如果资源配置不足，服务将无法在规定的时间范围内完成。由于相关平台和框架，特定应用程序的服务质量可能会比用户感知到的要低得多。\n\
  \n如果编排平台在框架中包含自适应性，那么考虑输入服务的动态特性的资源编排和监控就可以得到改进。为了提供自适应性，框架必须不断收集一些与性能相关的参数和特定的硬件信息。因此，由于框架涉及云端和边缘设备，执行此类边缘\
  \ AI 应用或服务的所涉及成本可以降到最低。在支持自适应的编排系统中，托管在云端的网络通信和计算资源可以被最小化或自适应地改进。\n\n当编排实时发生时，交付资源涉及的复杂性可能会大幅增加。此外，边缘\
  \ AI 中每个分层涉及的资源和服务数量之间也存在正比。\n\n### 10.6 编排的自动化\n\n编排自动化是边缘 AI 平台的主要特性之一。编排自动化减少了人机交互。在服务引入自动化的主要目的是避免冗余活动。例如，在农场中，自动化编排会定期从\
  \ IoT 传感器识别温度、湿度等信息。\n\n自动化可以缩短硬件和软件的交付时间。值得注意的是，软件服务需要根据安全需求进行更新。因此，可以激活自动化来增强应用程序的性能。同样，在涉及多个计算节点时，边缘设备可以自动化。\n\
  \n动态工作流是实现自动编排工具的特殊用例。在动态工作流中，任务以工作流方式创建，即它们遵循 `DAG` 结构，某些任务的输出成为指定任务的输入。工作流在没有人工干预边缘\
  \ AI 的情况下自动完成一系列任务。在此类工作流环境中增加动态性对于边缘 AI 至关重要。\n\n近年来，研究人员开发了若干作为工作流的 ML/DL 流线 [7,\
  \ 9]。这些工作流可以自动化，以提高真实环境中代码交付的速度。\n\nApache 的 `AirFlow` 被认为是一种强大的数据编排工具，可以集成到基于 ML/DL\
  \ 的系统中 [1]。该平台诞生了 Airbnb，随后成为 Apache 的强大工具。`AirFlow` 系统的主要突破在于为用户提供了设计自己的数据流水线或编排系统的支持。例如，DL\
  \ 工程师可以以数据流水线的形式开发多个分布式神经网络层。\n\n\n\n\n\n### 2. 数据预处理\n在预处理步骤中，可以移除或过滤所有无关数据。考虑到计算能力，可以移除冗余数据并根据所需的数据量进行清洗。\n\
  \n### 3. 训练—分层计算\n创建 ML DAG（有向无环图）以使用存储在集中位置或分布式位置的数据集来训练模型。这意味着神经网络训练过程的某些将在不同的位置执行，然后协作构建一个训练好的模型。`DAGs`\
  \ 可以设计成流水线的形式，以进行训练过程处理。\n\n### 4. 验证\n机器学习中验证的目的是确保在训练阶段创建的模型适用于未来的推理。如果验证准确率不符合预期，则可以对模型进行进一步训练和重新创建。`DAGs`\
  \ 以迭代的方式执行已训练模型的自动化交付，从而最大限度地减少人工干预。显然，通过使用预设计的 `AirFlows` 或类似工具的 `DAGs`，可以大幅减少解决任何问题在训练、测试和验证阶段所涉及的管理工作量。\n\
  \n### 5. 推理\n作为最后一步，`DAGs`可以通过在编排工具中设计流水线来执行推理和通知。在某些情况下，推理可以用多模态格式报告，其中每种格式都可以设计为\
  \ `DAGs` 中的独立任务。\n\n图 10.2 展示了基于 AirFlow 的边缘 AI 编排平台的流水线流。\n\n![图 10.2. 基于 AirFlow\
  \ 的边缘/AI 系统流水线架构。](img/bk978-0-7503-5593-3ch10f2_online.jpg)\n\n**图 10.2.** 基于 AirFlow\
  \ 的边缘/AI 系统流水线架构。\n\nApache `AirFlow` 的主要优势在于：(i) 开源实现，(ii) 高扩展性的用户为中心的设计，(iii)\
  \ 可扩展，以及 (iv) 自动化重复。然而，使用 `AirFlow` 等平台提供自动化解决方案存在一些潜在的缺点。值得注意的是，这种设计可能会导致巨大的投资，因为技能丰富的人士必须考虑到工业需求和机器，优雅地规划流水线。此外，`AirFlow`\
  \ 中 `DAG` 任务的相互依赖性意味着在修改任何一个任务时都需要一个巨大的纠正机制。\n\n## 10.7 指标导向的编排\n\n资源利用率、安全特性、容错性、延迟、网络带宽、隐私级别、准确性和硬件缓存等性能指标可以被高效用于自动编排边缘\
  \ AI 应用的负载。\n\n#### 10.7.1.1 资源感知编排\n\n在边缘 AI 系统中，应用程序必须协作利用从边缘到云的环境资源。这些资源或是具有计算能力的可扩展云服务器，或是基于边缘的电池供电设备。编排平台必须优化资源利用，并自动将任务分配到适当的资源。编排框架能够在考虑各种参数（包括资源利用率方面）的情况下跨计算节点分配任务。\n\
  \n有效利用资源的方法是引入资源调度策略或负载均衡策略。资源调度策略可以侧重于提高网络利用率或计算节点利用策略。这些策略通常嵌入编排框架中，以便在没有人工干预的情况下将任务交付给适当的资源。\n\
  \n#### 10.7.1.2 安全感知编排\n\n考虑到未来潜在的安全攻击，编排框架可以自动考虑安全特性，如资源的访问权限、带宽的受控交付等。在 `Docker`\
  \ 实例中，计算资源的访问仅根据协议中固定的特定策略配置。用户与资源提供者之间的服务水平协议（SLA）是在考虑安全意识的情况下实例化的。\n\n通常，有几种针对边缘\
  \ AI 系统的安全相关攻击。对潜在安全攻击的详细研究在第 8 章讨论。编排平台在计算资源范围内编排任务之前，应该考虑这些安全特性和潜在攻击。\n\n####\
  \ 10.7.1.3 容错编排\n\n在许多应用程序中，设备或框架很容易故障。边缘 AI 应用涉及多个连接到传感器或执行器的边缘级计算节点。根据传感器和执行器节点的可用性，某些节点被关闭的概率更高。显然，计算任务会在计算过程中停止执行指令。\n\
  \n因此，边缘 AI 领域的编排平台必须具有容错性。设计具有容错功能的编排平台的优势列如下：\n\n1. **对软件和硬件故障具有韧性**：容错编排平台可以承受潜在的软件和硬件故障。应用程序在分布式边缘支持计算节点上执行时，必须依赖编排器在任务失败后自动恢复任务。软件失败可能由于多种原因，例如网络通信故障、需求变化、代码优化失败、代理故障等。同样，硬件问题是由于磁盘故障、连接传感器的边缘故障、电路故障等而发生的。\n\
  2. **持续服务**：即使服务失败，托管在计算节点上的服务也会继续运行。托管在 `VMs` 或 `Docker` 实例上的服务可能会因为计划的重启或不可预测的启动失败而失败。此外，服务可能因为系统固有的算法问题而停止运行。编排平台应该考虑这些故障方面，并计划调度任务到不同的计算节点。\n\
  \n#### 10.7.1.4 延迟感知编排\n\n意识到边缘 AI 应用涉及延迟的编排框架被称为延迟感知编排框架。延迟是一个决定边缘 AI 应用中执行计算所需时间的指标。延迟在分布式计算应用（如包括边缘、雾和云集群的计算平台）中尤为明显。\n\
  \n在基于网络的系统中，延迟由于数据包丢失或抖动产生。数据包丢失是指由于网络故障或类似问题，数据包无法交付给 `MQTT` 代理或订阅者的现象。抖动是数据包传输的延迟，在视频处理应用中是可见的。发送端和接收端之间的恒定抖动没有严重影响，特别是在视频应用中，因为传输数据包的延迟是恒定的。然而，对于许多其他边缘\
  \ AI 应用来说，如果抖动不是恒定的或可预测的，可能会产生严重影响。除了网络带宽能力外，接收端的缓冲区还需要增大以避免边缘 AI 应用中的抖动相关问题。\n\n\
  编排平台必须考虑不同的抖动相关问题，并通过合适的通信通道重新路由数据包以避免此类延迟。如果传感器设备必须向云端系统提交数据，大多数情况下抖动是不可避免的。此外，边缘和云平台之间的传输介质在边缘\
  \ AI 应用中各异。因此，编排器在执行边缘 AI 应用时必须考虑所有这些陷阱，并选择合适的网络通道。\n\n\n\n\n在传统网络中，通常遵循流量整形和带宽分配策略以避免网络延迟。流量整形是限制计算节点之间数据传输的过程。它是一种拥塞管理策略，通常在网络中采用以避免延迟抖动。带宽分配策略是在通信设备之间预先分配网络带宽的程序，以便确保在优选时间实现公平的通信。延迟感知编排平台在高度动态的分布式计算节点上编排边缘\
  \ AI 任务时，可以考虑这些传统的容错特性。\n\n用于调优边缘 AI 系统编排框架的完整指标列表如图 10.3 所示。\n\n![图 10.3. 用于调优编排框架的指标。](img/bk978-0-7503-5593-3ch10f3_online.jpg)\n\
  \n**图 10.3.** 用于调优编排框架的指标。\n\n## 10.8 编排框架\n\n平台包含了编排边缘 AI 任务的软件和硬件组件。相比之下，框架是处理边缘\
  \ AI 解决方案中编排的纯软件方法。本节探讨了用于边缘 AI 应用的现有编排框架。本章讨论的平台包括：(i) Oakestra 框架、(ii) ORCH 框架、(iii)\
  \ Node-Red、(iv) KubeEdge 框架、(v) Tiny-MLOps 框架以及 (vi) Pipeline 框架。这些框架提供了用于编排服务或功能的骨架架构，提高了边缘\
  \ AI 应用的应用。\n\n### 10.8.1 Oakestra 框架\n\nOakestra 框架是在德国慕尼黑大学开发的一种边缘编排框架。该框架提供了边缘\
  \ AI 应用的层级编排 `[4]`。分层结构在 Oakestra 框架中配置，以便在跨区域编排资源时提供分布式决策。\n\n该框架支持应用于各种应用领域的联邦学习。基于深度学习的学习模型通过本地数据集和在分布式位置创建的本地模型进行全球化开发。由于框架支持在跨分布式计算机器时传输\
  \ BLOB，模型的大小可能会非常大。\n\n该框架可以与特定的服务水平协议（SLA）集成。用户可以优先选择高级 SLA 以保证其任务的资源分配。框架中的 SLA\
  \ 选项是为了满足用户和提供者的需求，并考虑了带宽和延迟等其他指标。\n\n框架的另一个重要特性是其轻量级实现。整个框架由带有统一文件系统的 Docker 容器支持。容器和可扩展性架构的概念是在多个设备之间迁移虚拟机实例。这种轻量级实现深受许多开发者、用户和资源提供者的赞誉。事实上，该框架也适用于使用裸金属服务器实例的重型实现。\n\
  \n框架中涉及的主要组件是集群组件，即根编排器和集群编排器。集群编排器是一个软件实体，它结合了在边缘或云端计算区域使用 Docker 容器开发的多个集群。集群编排器组件跟踪可用集群并在云数据库中记录与节点相关的细节。框架有两类数据库，即\
  \ `serviceDB` 和 `nodeDB`。`serviceDB` 的作用是跟踪服务的可用性，而 `nodeDB` 是记录节点状态的数据库。\n\n`root\
  \ orchestrator` 是一个收集集群细节的软件组件。`root orchestrator` 的目的是管理节点的功能。`root orchestrator`\
  \ 还协调服务及其相关节点的分配。Oakestra 框架已应用于延迟感知型应用。最近，研究人员将该框架应用于涉及真实现实的边缘 AI 任务。事实上，该框架可以应用于各种场景。\n\
  \n### 10.8.2 ORCH 框架\n\nORCH 框架是一种用于边缘能力应用的分布式编排框架。开发此类框架的理念是处理雾计算设备上的任务分配。为此，研究人员专注于监控计算节点上的任务分发，例如资源的选择和部署\
  \ `[13]`。\n\nORCH 框架基于 `FogFlow` 组件。`FogFlow` 包含一个用于设计流流任务的用户界面。该框架包括主节点和若干个客户端。主节点的职责是协调所有客户端。主节点决定任务的卸载部分。\n\
  \nORCH 框架的主节点包含一个数据库，用于发现托管在边缘区域的客户端或工作节点的可用性。主节点与边缘节点之间的通信通过 `RabbitMQ` 等代理进行。原则上，`RabbitMQ`\
  \ 遵循通信的发布/订阅模式。这意味着边缘级节点在数据可用时提交，而无需等待服务器接收。相反，其他订阅者模块（如服务或云节点）在需要时通过通信代理接收数据。\n\
  \n框架中的活动是通过使用无服务器函数（serverless functions）触发的。无服务器函数的目的是根据计算需求触发实例。这些函数包括函数名称、需要激活的代码库以及实例化计算节点需求的事件触发器。\n\
  \nORCH 框架中用于确定计算节点的若干指标为：(i) CPU 利用率：执行应用程序时 CPU 正在利用的时间；(ii) CPU 错误：应用程序无法确定的错误；(iii)\
  \ CPU 饱和度：CPU 过载并由于某种原因发生节流的时间；(iv) 内存利用率：执行应用程序时使用的内存（GB 或 MB）；(v) 内存饱和度：确定了应用程序所占内存的百分比；以及\
  \ (vi) 内存错误：执行应用程序时导致故障的内存量。\n\nORCH 框架的主要目标是在分布式环境中执行无服务器函数时识别合适的边缘计算节点。框架的整个过程是通过使用监控工具（包括\
  \ `Prometheus`）定期监控来全面识别节点。框架的主节点在考虑执行应用程序所需的包或工作环境可用性的情况下，对边缘节点进行集中决策。\n\n### 10.8.3\
  \ Node-RED 框架\n\n\n\n\n\n`Node-RED` 框架是 IBM 在 2016 年初开发的一种图形化工具。它可以用于图形化的方式表示任务和相关的通信。该框架提供了一个支持浏览器的图形化界面，可以通过其流程编辑器拖放不同的计算组件和通信系统。`APIs`\
  \ 会根据框架自动插入。该框架已成功部署在多个 IoT 应用中。然而，它在 IIoT（工业物联网）环境中得到了更广泛的部署。\n\n与其他几个计算节点相比，`Node-RED`\
  \ 框架的计算要求相当低。例如，框架利用轻量级容器和 `node.js` 特性来实现服务的快速部署。由于该框架基于 `node.js`，它可以根据在线支持者和\
  \ `node.js` 开发者提供的支持进行扩展。该框架可以部署在笔记本电脑等本地设备、如 `Raspberry Pi` 板板等边缘级设备以及云服务器上。\n\n\
  研究人员通过特定的流程编辑器扩展了 `Node-RED` 的功能，以编排基于边缘的服务。该研究工作的 `Node-RED` 工作流管理器合并了多个微服务，以增加边缘支持型应用的异构性、动态性和发现服务。基于\
  \ `Node-RED` 的工作流管理器工具具有两个主要组件：\n\n1. **进程管理器**：进程管理器工作流器的目的是通过为面向 IIoT 的微服务创建端点来启动、更新和停止进程。此外，管理器会识别需要适当资源执行的任务。一旦定义了所有任务，进程管理器就会利用\
  \ `task executor` 来执行任务。\n\n2. **任务执行器**：`task executor` 从管理器接收请求并执行它们。有时，`task\
  \ executor` 会编排数量相似的任务。通过这种方式，在 IIoT 环境中可以实现任务同步和交付具有更高 `QoS` 的任务。\n\n`Node-RED`\
  \ 在 IoT 云环境中变得流行，因为它由亚马逊（Amazon）和微软（Microsoft）等云巨头提供。在 `Amazon AWS` 环境中，用户提供一些配置（例如基础\
  \ `node.js` 包版本和 `Node-RED` 命令）即可启动服务。它可以与 `AWS Elastic Beanstalk` 一起执行，以增加云端服务的可用性。可以使用\
  \ `AWS Greengrass` 和 `Beanstalk` 的云单元来增强框架，从而将服务扩展到包括 IIoT 在内的任何应用领域的边缘级节点。\n\n\
  ### 10.8.4 KubeEdge 框架\n\n通常，`Kubernetes` 是一种编排平台，广泛应用于如 `Docker` 实例等操作系统级虚拟化环境。通过\
  \ `Kubernetes`，容器可以在在线模式下跨计算节点快速迁移。由于是开源的，`Kubernetes` 编排平台已经在多个云端应用中进行了商业化部署。\n\
  \n`KubeEdge` 框架尝试为容器化应用跨支持边缘的计算节点提供类似的编排服务。该框架基于 `Kubernetes` 框架，主要关注基于边缘的、计算具有挑战性的节点。提供此类框架的主要目的是增加自主性、将计算扩展到边缘、确保无缝的云边编排并提供低成本解决方案。该框架由适当的\
  \ `APIs` 支持以提供容器编排。\n\n（注：原文中关于 KubeEdge 的描述存在多次重复，根据指令“不要重复输出原文”，此处保留一份有效翻译）\n\n\
  ### 10.8.5 Tiny-MLOps 框架\n\nMLOps 是一种自动将模型部署到生产环境的机器学习操作。MLOps 的概念源于 DevOps，DevOps\
  \ 缩短了软件生命周期所使用的时间。DevOps 将开发和运维结合在一起。开发者和运维人员有机会系统地交互并产生软件，因此应用程序可以轻松地开发、版本化和部署。\n\
  \nMLOps 的概念遵循 DevOps 的原则，但更强调机器学习。在这里，机器学习模型通过开发者和运维人员的紧密集成创建并部署。MLOps 流程包括：\n\n\
  1. **数据分析**：在 MLOps 的此阶段对输入数据和数据格式进行评估。探索的输出产生可重复和可编辑的数据，供机器学习算法进一步处理。\n\n2. **数据处理**：在此阶段，ML\
  \ 工程师尝试学习处理数据中涉及的特征。数据特征工程的理念是选择和转换数据最重要的特征。这一过程可以在训练阶段之外的推理阶段得到支持。\n\n3. **模型开发**：MLOps\
  \ 的模型开发阶段被认为是 MLOps 中影响最大的一步。在这一阶段，根据提取出的数据特征创建数学模型。模型根据农业、医疗保健、交通等不同应用领域需要提出的不同业务目标而异。\n\
  \n4. **训练阶段**：在此阶段，MLOps 使用特定的工具和技术在基于测试台的生产环境中交付模型以进行微调。训练阶段需要根据模型部署的环境对特征工程进行特别关注。训练阶段需要在\
  \ MLOps 框架的自动化流水线内迭代处理。\n\n5. **评审与部署**：开发的 ML 在经过组织内工程师团队测试和验证后部署到真实的生产环境中。它是 DevOps\
  \ 架构的第二部分，即运维模块。\n\n6. **推理与监控**：推理和监控阶段类似于所创建的模型在生产环境中的相关性。在此阶段，MLOps 可以提出在后续迭代的\
  \ MLOps 中更新特征工程阶段或模型创建阶段的建议。\n\n\n\n\n\n整个 `MLOps`阶段都是使用特定的工具和技术开发的，例如 `MLFlow`、`CometML`、`MetaFlow`、`Kedro`、`Data\
  \ Version Control`、`Cortex` 等。\n\n在 Tiny-MLOps 中，研究人员扩展了 `MLOps` 的流水线阶段，将资源受限设备的\
  \ ML 任务编排 [2]。众事实上，大型模型无法放入 `Raspberry Pi` 等小型设备中。因此，Tiny-MLOps 为支持边缘的 AI 应用而生。\n\
  \nTiny-MLOps 在之前讨论的 `MLOps` 模型开发阶段和训练阶段之间包含了 `Adapt`（适配）和 `Optimize`（优化）阶段。在 `MLOps`\
  \ 的 `Adapt` 和 `Optimize` 阶段，会根据电池供或资源受限设备的内存和 CPU 能力对模型进行修改。在这方面，模型被调整以适应设备的限制。例如，与\
  \ `Jetson Nano` 相比，`Raspberry Pi` 设备可以执行 MB 级模型。\n\n### 10.8.6 流水线框架\n\n流水线（Pipelines）是按照特定操作顺序执行的恒定流的过程，一个接一个执行，无需\
  \ ML 工程师的干预。`MLOps` 在特定的流中交付了一系列操作，这些操作可以在开发者和运维人员之间进行迭代。相比之下，流水线提供端到端的编排。\n\n基于流水线的编排框架主要关注三个子主题：\n\
  \n1. **数据流水线 (Data pipeline)**：在数据流水线中，与数据获取、特征工程、格式修改、原始数据处理等相关的过程是自动化的。在某些情况下，流水线必须处理批数据，而在其他情况下，流水线必须处理流式数据。\n\
  2. **模型流水线 (Model pipeline)**：在模型流水线中，模型创建和与模型调优相关的步骤是自动化的。模型调优包括超参数调优和模型交付相关的过程。\n\
  3. **生产流水线 (Production pipeline)**：在生产流水线中，负责模型交付到生产环境的过程按操作顺序处理。此类流水线包含多个细粒度组件，用于在边缘\
  \ AI 平台上实例化 ML 相关的任务。例如，记录来自用户或开发者的反馈可以作为生产流水线中的一项主动任务。\n\n基于流水线的框架最适合边缘 AI 应用的多种编排需求。值得注意的是，生产环境中的数据收集、处理、训练、验证和测试等过程可以通过流水线架构的形式交付。预计流水线可以提高模型创建和部署的性能\
  \ [3]。\n\n有几个流水线框架用于编排 ML 操作。其中，少数框架扩展了其功能，以编排支持边缘的设备及其相关的边缘 AI 操作。在本节中，我们将探索用于\
  \ AI 应用的广泛使用的基于流水线的编排框架。\n\n#### 10.8.6.1 KALE\n\n`KALE` 是一个基于编排的流水线框架，它可以实现 ML\
  \ 过程的自动化 [5]。ML 工程师不需要深度参与模型创建和部署的各个阶段。这降低了在 ML 工作流过程中引入昂贵 ML 工程师的风险。通过这种方式，框架允许用户开发一次流水线，并使用流水线进行多次实例的迭代操作。\n\
  \n`KALE` 的核心功能是使用流水线提供可重现的环境。工作流的设计使得工作流可以使用不同的输入和输出进行重复利用。其次，`KALE` 流水线框架通过提供端到端的编排实现了自动化。因此，上市时间被缩至最短，即生产阶段和开发阶段紧密耦合。此外，由于在没有\
  \ ML 工程师干预的情况下进行迭代生产，维护成本降到了最低。这要求框架在编排流水线预先设计好预期软件组件。\n\n#### 10.8.6.2 MetaFlow\n\
  \n`MetaFlow` 是一个基于流水线的编排框架，它利用复杂的现有基于 AI 的框架处理海量数据。`MetaFlow` 编写为一个 Python 库，以便边缘\
  \ AI 开发者集成其应用程序。\n\n数据处理、建模、部署、编排和执行等流水线任务通过 `MetaFlow` 库优雅地处理。它在 ML 相关应用的开发阶段支持许多其他任务，例如创建工作流、可视化工作流、跟踪开发等。此外，在\
  \ `MetaFlow` 的流水线框架中，在不同的分布式计算节点上调度执行以及监控边缘 AI 任务的执行都是自动化的。\n\n事实上，由于该框架支持 `Amazon`\
  \ 和 `Google` 等云巨头，一些组织和 ML 爱好者已广泛使用该框架。此外，它可以轻松部署在任何 `Kubernetes` 集群上。这增加了该框架对于边缘\
  \ AI 应用性。`MetaFlow` 框架可以被设计为图形格式的 DAG 任务。\n\n\n\n\n*   `AirFlow workers`: 这些节点是计算节点，可能是基于边缘的功率受限设备。worker\
  \ 的职责是报告分配的 ML 任务的状态。此外，worker 节点必须计算 `AirFlow` 调度器从特定队列交付的任务。\n*   `AirFlow webserver`:\
  \ `AirFlow` Web 服务器包含基于调度的服务，这些服务负责调查数据库并做出决策，例如将任务交付给特定的 worker 节点或激活 `DAG` 中的特定任务。\n\
  \n### 10.8.6.4 ZenML\n\nZenML 是一种数据流水线，可以编排支持边缘的设备以为应用程序执行 AI  [14]。ZenML 是由 `ZenML\
  \ Inc.` 开发的集成辅助流水线框架。ZenML 的理念是在集成资源或数据流水线以执行 AI 相关任务的同时，为用户提供零管理投入。\n\nZenML 拥有几个基于\
  \ `GCE`、`AWS` 和 `Azure` 平台的预定义基础设施栈。这些堆栈包含了针对这些云平台唯一定义的配置和设置信息。\n\n与其他编排流水线类似，ZenML\
  \ 拥有一个 `DAG visualizer`，它能以视觉形式表示 ML 任务。点击 `DAG` 的每个节点时，开发者可以看到任务的完整代码段。开发者可以拖放之前可用的\
  \ ML 应用开发任务。此外，用户可以修改它们或扩展代码段，以便轻松地将任务与其他 `DAG` 任务集成。\n\n该工具旨在轻松地将 ML 逻辑与云环境集成。例如，可以使用\
  \ `ZenML` 的 API 将 `DAGs` 与 `AWS` 上的 `S3 buckets` 集成。这些 API 编写在 `Python` 代码库中，对许多数据科学家或\
  \ ML 工程师来说非常友好。\n\nZenML 的吸引之处在于其简单性。作为一项工业化尝试，ZenML 框架的设计使得流水线可以扩展到各种工作领域。为了实现这一点，ZenML\
  \ 以扩展模块的形式开发。该框架的另一个主要吸引力是考虑到边缘 AI 爱好爱好者的需求，提供了多个标准模板。这些模板可以轻松地移植到开发环境中进行定制，以满足用户的需求。\n\
  \n边缘 AI 市场中广泛代表的编排框架分类如图 10.4 所示。\n\n![图 10.4. 最流行的边缘 AI 编排框架分类。](img/bk978-0-7503-5593-3ch10f4_online.jpg)\n\
  \n**图 10.4.** 最流行的边缘 AI 编排框架分类。\n\n### 10.9 集成平台\n\n编排平台侧重于自动化边缘 AI 应用中各种 `DAG pipelines`\
  \ 涉及的逻辑。它们并不关注设备与自动化系统之间的连接：即编排平台处理 `DAGs` 中涉及的业务逻辑控制。\n\n相比之下，集成平台的目的是确保连接设备与流水线架构之间数据的平滑转换。例如，`APIs`、`web\
  \ services`、`message queues` 或相关服务可以提供共同的数据交付格式，以便在 `DAGs` 之间轻松集成。需要注意的是，集成平台不会修改\
  \ `DAGs` 的任何内部功能。\n\n预计平台支持各种数据格式和访问选项。此外，集成平台应该尽职尽责地处理安全相关问题，并主动避免任何安全攻击。显然，此类集成平台的成本可能会随着时间的推移而大幅增加。\n\
  \n### 10.10 结论\n\n编排是自动化服务的关键，包括边缘 AI 服务。本章提供了可以编排边缘 AI 应用的平台。它预测了编排在边缘 AI 领域被采用的方式。值得注意的是，研究涵盖了工作负载或算法的编排、服务的自动化、生态系统的适应等此外，还探索了著名的编排框架执行边缘智能的能力。\n\
