  \ Control`和 `Python Console`。你可以根据当前需求显示或隐藏这些面板。\n\n### 核心组件与面板\n理解 DataSpell 内部的核心组件和面板对于高效导航和使用至关重要。每个面板和组件都有特定的用途，有助于实现流化的工作流。\n\
