  \n```python\ndf = pd.read_csv('large_dataset.csv')\nsample_df = df.sample(frac=0.1)\n\
  ```\n\n*   **数据削减 (Data Reduction)**：使用特征选择和降维等技术最小化处理的数据量。主成分分析 (`PCA`) 等技术可以在保留重要信息的同时减少特征数量。\n\
