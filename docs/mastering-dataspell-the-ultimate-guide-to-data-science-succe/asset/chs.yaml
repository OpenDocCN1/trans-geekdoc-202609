  \ **版本控制**：DataSpell 与 `Git` 等版本控制系统无缝集成。`Version Control` 面板提供了用于管理仓库、提交更改和解决冲突的可视化界面。它还提供了强大的\
  \ diff 工具，用于比较文件不同版本之间的更改。\n\n### 自定义布局\nDataSpell 的优势之一是灵活，允许你自定义布局以适应你的工作流偏好。这种自定义通过根据你的特定需求定制环境，可以显著提高生产力。\n\
  \n1. **移动面板**：你可以通过拖放将面板移动到屏幕的不同区域。例如，如果你喜欢将 `Project Explorer` 放在右侧而不是左侧，可以轻松地重新定位它。\n\
  2. **调整面板大小**：可以通过点击并拖动边界来调整面板大小。这允许你为你活跃工作的区域分配更多空间。例如，如果你正在调试并需要更大的输出面板视图，可以将其调整大小以占据更多空间。\n\
