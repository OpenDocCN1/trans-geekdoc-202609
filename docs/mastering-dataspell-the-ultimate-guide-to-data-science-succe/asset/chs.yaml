  \ 'new_name'})\n```\n\n### 4. 数据转换\n* **过滤数据**：使用布尔索引根据条件过滤数据。\n```python\nfiltered_df\
  \ = df[df['column'] > value]\n```\n* **创建新列**：根据现有数据添加新列。\n```python\ndf['new_column']\
  \ = df['column1'] + df['column2']\n```\n\n### 5. 数据聚合\n* **分组分组**：按特定列对数据进行分组并计算聚合统计数据。\n\
  ```python\ngrouped_df = df.groupby('column').sum()\n```\n* **透视表**：创建透视表来汇总数据。\n\
