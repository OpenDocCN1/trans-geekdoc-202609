  \ DataSpell 中管理和组织数据的最佳实践。\n\n### 支持的数据格式\n\nDataSpell 的设计旨在处理处理数据科学中常用的各种数据格式。这种灵活性允许你无缝地处理不同类型的数据，促进全面的分析和模型构建。以下是一些被广泛支持的数据格式：\n\
  \n1.  **CSV（逗号分隔值）**：`CSV` 文件是数据科学中最常见的数据格式之一。它们简单、人类可读，并被许多工具和库广泛支持。DataSpell 为导入和操作\
  \ `CSV` 文件提供了强力支持，处理表格数据变得简单。\n2.  **Excel 文件 (XLSX)**：Excel 文件在业务环境中经常用于数据存储和共享。DataSpell\
  \ 支持导入 Excel 文件，允许你利用 Excel 中的现有数据进行分析。它同时支持 `.xlsx` 和 `.xls` 格式。\n3.  **JSON（JavaScript\
  \ 对象表示）**：`JSON` 文件通常用于存储和传输结构化数据，特别是在 Web 应用中。DataSpell 支持导入 `JSON` 文件，使你能够处理嵌套和分层的数据结构。\n\
  4.  **SQL 数据库**：DataSpell 可以连接到各种 SQL 数据库，如 `MySQL`、`PostgreSQL`、`SQLite` 等。这种能力允许你直接从数据库查询并导入数据到\
  \ DataSpell，简化了数据检索过程。\n5.  **Parquet 文件**：`Parquet` 是一种针对大数据处理优化的列式存储文件格式。它在存储和查询方面都非常高效。DataSpell\
  \ 支持 `Parquet` 文件，是高效处理大型数据集的理想选择。\n6.  **Avro 文件**：`Avro` 是另一种常用于大数据环境的数据序列化系统。它支持模式演进，适用于复杂的数据结构。DataSpell\
