  2. 使用集成终端创建虚拟环境并安装必要的包（例如，`pandas`）：\n\n```bash\npython -m venv venv\nsource venv/bin/activate\n\
  pip install pandas\n```\n\n### 第 2 步：编写脚本\n1. 在编辑器中打开一个新的 Python 文件并开始编写脚本。\n2.\
