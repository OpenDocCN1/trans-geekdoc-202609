  \n### 创建基础图表和图形\n\n在 DataSpell 中创建基础图表和图形非常简单，这归功于与流行数据可视化库的集成。下面，我们将介绍几种常见类型可视化的步骤：柱状图、折线图、散点图和直方图。\n\
  \n#### 1. 柱状图\n\n柱状图适用于比较分类数据。以下是如何使用 `Matplotlib` 创建柱状图：\n\n```python\nimport matplotlib.pyplot\
  \ as plt\n\n# 示例数据\ncategories = ['A', 'B', 'C', 'D']\nvalues = [10, 15, 7, 12]\n\
  \n# 创建柱状图\nplt.bar(categories, values)\n\n# 添加标题和标签\nplt.title('Sample Bar Chart')\n\
  plt.xlabel('Categories')\nplt.ylabel('Values')\n\n# 显示图表\nplt.show()\n```\n\n###\
  \ 2. 折线图\n\n折线图是可视化随时间趋势的理想选择。以下是一个使用 `Matplotlib` 的示例：\n\n```python\nimport matplotlib.pyplot\
  \ as plt\n\n# 示例数据\nmonths = ['Jan', 'Feb', 'Mar', 'Apr', 'May']\nsales = [200,\
  \ 220, 180, 260, 300]\n\n# 创建折线图\nplt.plot(months, sales, marker='o')\n\n# 添加标题和标签\n\
  plt.title('Monthly Sales')\nplt.xlabel('Month')\nplt.ylabel('Values')\n\n# 显示图表\n\
  plt.show()\n```\n\n### 3. 散点图\n\n散点图对于可视化变量之间的关系非常棒。以下是一个使用 `Seaborn` 的示例：\n\n```python\n\
  import seaborn as sns\nimport matplotlib.pyplot as plt\n\n# 示例数据\ndata = {'Height':\
  \ [150, 160, 170, 180, 190], 'Weight': [50, 60, 70, 80, 90]}\n\n# 创建散点图\nsns.scatterplot(data=data,\
  \ x='Height', y='Weight')\n\n# 添加标题和标签\nplt.title('Height vs Weight')\nplt.xlabel('Height\
  \ (cm)')\nplt.ylabel('Weight (kg)')\n\n# 显示图表\nsns.show()\n```\n\n### 4. 直方图\n\n\
  直方图用于表示数据的分布。以下是一个使用 `Matplotlib` 的示例：\n\n```python\nimport matplotlib.pyplot as\
  \ plt\n\n# 示例数据\ndata = [1, 2, 2, 3, 3, 3, 4, 4, 4, 4]\n\n# 创建直方图\nplt.hist(data,\
  \ bins=5, edgecolor='black')\n\n# 添加标题和标签\nplt.title('Data Distribution')\nplt.xlabel('Value')\n\
  plt.ylabel('Frequency')\n\n# 显示图表\nplt.show()\n```\n\n### 自定义可视化\n\n自定义可视化允许你根据需求对其进行定制并增强清晰度。DataSpell\
  \ 为自定义你的图表提供了许多选项。\n\n**1. 调整颜色和样式**\n\n自定义可视化的颜色和样式可以使其更具视觉吸引力且更易理解。\n- **更改颜色**：修改图表的颜色。例如，更改柱状图中条柱的颜色：\n\
  - **使用主题**：`Seaborn` 提供了可以应用于你的图表的主题。\n\n**2. 添加注释和标签**\n\n注释和标签提供了额外的上下文，使你的可视化包含更多信息。\n\
  - **添加标签**：为你的图表的轴和标题添加标签。\n- **添加注释**：对图表的特定点或区域进行注释以突出显示信息。\n\n**3. 自定义轴和刻度**\n\
  \n自定义轴和刻度可以提高图表的可读性。\n- **设置坐标轴限制**：定义轴的限制以关注特定的数据范围。\n- **自定义刻度**：调整轴上刻度的外观观和位置。\n\
  \n**4. 添加图例**\n\n图例用于识别图中的不同元素，特别是在多系列图表中。\n- **添加图例**：为图表添加图例以标记不同的系列。\n\n**5.\
  \ 创建子图**\n\n子图允许你在单个图中显示多个图表，便于比较和全面的的可视化。\n- **创建子图**：使用 `subplots` 函数在网格布局中创建多个图表。\n\
