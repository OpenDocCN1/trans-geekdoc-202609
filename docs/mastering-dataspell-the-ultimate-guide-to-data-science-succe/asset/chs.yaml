  df.head()\n```\n* **统计摘要**：使用 `df.describe()` 获取 `DataFrame` 的摘要统计。\n```python\n\
  df.describe()\n```\n* **数据类型**：使用 `df.dtypes` 检查列的数据类型。\n```python\ndf.dtypes()\n\
