  \  MANA\n\n### 平台\n`Decentraland` 由以太坊区块链驱动。它是一个领先的虚拟现实平台，每月有超过 30 万用户免费访问该 3D 世界。拥有超过\
  \ 9 万个由 `NFTs` 表示的区块，`Decentraland` 是一个允许用户创建、体验和变现其内容的领先元宇宙项目。\n\n其去中心化的特性支持了不断增长的用户群的社交方面。该平台的活跃生态系统由喜欢创建社区、建筑、太空冒险和场景的企业和个人组成。\n\
  \n*   最著名的是巴巴多政府在平台上开设了元宇宙大使馆，成为第一个投资虚拟世界的国家。\n*   随其后的是 `Tokens.com` 的子公司 Metaverse\
  \ Group 以 240 万美元购买了 `Decentraland` 最昂贵的空间，用于其电子商务业务和数字时装秀。\n*   `Decentraland`\
  \ 内部的其他大品牌还有 `Samsung` 和 `JPMorgan Chase`。`Decentraland` 最便宜的地块大约是 2.88 以太币（8500\
  \ 美元）。\n\n### 3. SAND\n\n代币\n\n\n\n\n\nThe Sandbox 的原生代币是 `ERC-20` `SAND`，用于参与边玩赚（`P2E`）游戏、购买数字物品以及创建自己的非同质化标记（`NFTs`）。你可以在市场上出售这些\
  \ `NFTs`，或者在 `Game Maker` 的帮助下将其集成到游戏中。\n\n`SAND` 用于支付 `ASSETS`（或 `NFTs`）、增强游戏体验的设备、化身或游戏访问权限。玩家还可以通过玩游戏获得\
