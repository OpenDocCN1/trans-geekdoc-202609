  \ | --- |\n\n![image](img/chapter_title_above.png)\n\n## 策略 1-投资 NFT\n![image](img/chapter_title_below.png)\n\
  \n“在一个甚至没有通用公认软件平台的市场中，任何投资都是一种‘受过教育的赌博’。”—— Mike Rhodes，ConsultMyApp 首席执行官\n\n\
  元宇宙投资为缺乏资本或没有股票市场的人提供了极佳的获利机会。预计会有更多的消费品被“NFT 化”，以便它们在元宇宙中可以获取。\n\n投资具有巨大增值潜力的 `NFTs`\
  \ 是元宇宙收益最大化的关键。\n\n人们购买 `NFTs` 的首要原因是他们希望自己的收藏中开始或增加不可思议的艺术品和其他物品。这种代表数字内容、物理对象或无形概念所有权的新兴技术，正被人们探索其多种用途以及未来的利润。\n\
  \n![image](img/image009.png)\n\n## 章节总结\n* 为什么你应该投资 `NFTs`\n* 投资 `NFTs` 时需要考虑的事项\n\
  * `NFTs` 的当前和未来用途\n* 购买 `NFTs` 指南\n* 在何处购买 `NFTs`\n* 要点\n\n### 为什么你应该投资 NFT\n`NFT`\
  \ 是一种令人兴奋的探索的新媒介。这些数字资产让你拥有记录的体育时刻、文物、收藏品或艺术品的独家所有权。对于那些能因拥有昂贵资产而感到满足的人物来说，`NFT`\
  \ 投资正适合你。\n\n但到目前，`NFTs` 作为一种获利投资的价值尚未得到证实。它们在未来的价值极不可预测，并可能让你遭受一些损失。然而，那些在出售自己的\
  \ `NFTs` 时获得巨额利润的明星和影响者已经证明了它们变得更具价值的潜力。\n\n虽然某些 `NFTs` 价值数百万美元，但有些资产在独性和稀缺性方面并不如它们有价值。有一点是可以肯定的，将会有更多公司进入数字化业务并推广其潜在应用。预计\
  \ `NFTs` 将成为经济和生活方式格局的固定组成部分。\n\n### 投资 NFT 时需要的事的事\n如果你想加入不断增长的 `NFT` 爱好者行列，请将自己定位为收藏家而非投资者。投资\
  \ `NFTs` 是一个个人选择，因为有些物品具有重大意义。\n\n记住，`NFTs` 的价值取决于买家的支付意愿，而不是影响传统股票的经济、技术或基本因素。\n\
  \n“NFTs 具有风险，因为它们的未来是不确定的，我们还没有足够的历史来判断它们的表现，”Yellow Umbrella 董事 Arry Yu 说。\n\n\
  购买 `NFTs` 时，选择那些让你感到快乐并自豪于拥有的物品。探索资产的潜力，并眼光关注有一天可能带来财富的真正价值的 `NFTs`。对每项购买进行研究。最后，享受寻找你想要的\
  \ `NFTs`，但始终要谨慎以避免以后损失资金。\n\n注意 `NFTs` 是纳税的，因为它们被归类为收藏品。它们缴纳资本利得税。用于购买 `NFTs` 的\
  \ `cryptocurrency` 如果购买后价值增加，也可能纳税。如果你计划向投资组合中添加非同质化标记，请咨询税务专业人士。\n\n### NFT 的当前和未来用途\n\
  * 作为数字内容\n在社交媒体平台上发布作品的内容创作者推动了创意经济。作为内容所有者，当他们将杰作转换为 `NFTs` 时，利润增加了。\n* 作为时尚和可穿戴数字伙伴\n\
  Dolce & Gabbana 的“Genesis Collection”于 2021 年 9 月 30 日以 560 万美元售出。这是该品牌首个非同质化标记（NFTs）系列，是实体物品和区块链中数字伙伴的混合。\n\
  \n另一个重大事件发生在伦敦时尚周，Auroboros 在增强现实（AR）的帮助下展示了可穿戴数字服装。这个新品牌以成为首个将现实高级装与科学技术相结合的时尚公司而自豪。\n\
  * 作为游戏世界的跨平台\n\n\n\n\nNFT 与在线游戏完美契合。NFT 为游戏开发者提供了新的收入来源和扩展品牌的方式。它让游戏内物品或角色的交易变得更加容易。\n\
  \n通过区块链进行的交易快速且方便，消除了会抽取你利润的中间人。它还开启了许多可能性，例如获取已经过他人测试的设备或武器。\n\n`Axie Infinity`\
  \ 的出现改变了游戏格局。如今，游戏玩家不仅玩传统的流媒体游戏，还乐于花时间玩区块链游戏。`Axie` 允许参与者在退出游戏时变现他们的加密货币收益。\n\n\
  这类游戏为元宇宙在未来几年或几十年内的蓬勃发展提供了更多可能性。\n\n最大的 NFT 平台 `OpenSea` 首席执行官 Devin Finzer 表示：“游戏真的非常令人兴奋……有数十亿的人在游戏内购买数字商品。”然而，他也提到，与收藏品和艺术项目相比，游戏内容的开发周期要慢得多、长得多。这限制了更广泛采用的目标。但他相信这个问题很快就会得到解决。\n\
  \n### 作为投资和押品\n\nNFT 的基础设施与 `DeFi`（去中心化金融）类似。`DeFi` 允许人们通过抵押品进行贷款。NFT 可以作为抵押品来借钱。例如，你可以贷款并使用\
  \ `CryptoPunk` 作为你的抵押品。\n\n当你偿还债务时，你会收回代币。智能合约将直接将 NFT 转移给贷款人，消除了债务催收员或赏金猎人的介入。\n\
  \nNFT 正在逐渐变成准证券，并被碎片化以提高其流动性。\n\n播客主持人、NFT 投资公司 Managing Partner 的合伙人 Andrew Steinwold\
  \ 说：“NFT 实现了资产的一些新行为。”`Sfermion` 是一家 NFT 投资公司。\n\n### 作为永久网页域名\n\nNFT 可以让你的域名更有价值且更易记忆。它通过根据你选择的名称的相关性和长度，使\
  \ IP 地址更容易被回想起。一个简单易记的 URL 对网站的营销目标有巨大影响。这就是为什么某些域名非常昂贵。\n\n还有人会等待热门域名的过期，并进行“域名抢注”或立即购买。\n\
  \n为了避免类似情况发生，选择 NFT 域名是最佳解决方案。由 Matthew Gould 领导的 `Unstoppable Domains` 表示，他们提供基于区块链的域名。你可以购买一个可用的域名并将其注册为非同质化代币存储在加密钱包中。用户只需对域名支付一次性费用，而不是传统域名注册商要求的定期费用。\n\
  \n有了 NFT 域名，所有权是永久的，不会被机会主义者抢夺。\n\n### 作为真实性指标\n\nNFT 确保了产品或投资资产真实性和稀有性。它们可以存储包括制造过程在内的所有信息，以证明公平交易和透明度。\n\
  \n从远来看，NFT 被认为是解决假产品、药品和补充剂泛滥的答案，因为关键信息可以从制造到运输的过程被轻松追踪。\n\n### 作为快速且无忧房地产交易的推动者\n\
  \n房地产与 NFT 是绝配。NFT 可用于启用智能合约，允许自动支付方案、跟踪物业价值的更新、提供所有权证明、创建去中心化租赁服务、转移地契并保护客户信用卡信息等敏感数据。\n\
  \n在现实世界中，土地是有限的，这是没有人可以创造更多的。但 `The Sandbox`、`Decentraland` 和 `Cryptovoxels` 等虚拟世界正在利用这一元素使他们的平台更受欢迎。这是元宇宙世界可以提供的。\n\
  \n拥有数字房地产允许我们创建虚拟社区并建造建筑物。我们可以为零售商、初创公司或想要举办虚拟活动的组织提供空间。可能性是无限的。\n\n### 作为专利和知识产权的保护者\n\
  \nNFT 赋予用户证明其对任何内容所有权的权限，这与版权、商标和其他传统的 IP 工具不同。时间戳提供了整个知识产权历史和可区分元素的透明性和可访问性。\n\n\
  出于专利目的，NFT 可以通过提供必要的验证数据认证并保护发明或创新的所有权。所有专利相关的事项都记录在公共账本或区块链上。\n\n### 作为医疗记录的验证器\n\
  \n非同质化代币账本可以存储患者的医疗记录并保护它们，因为所有交易都由多个节点进行验证。这防止了篡改和损害信息机密的风险。每条记录在永久添加到区块链之前都会经过验证是真实准确的。\n\
  \n对于授权的医疗提供人员来说，检索存储的敏感数据变得更容易，有助于医院和健康保险公司访问数据。\n\nNFT 应用还专门为医疗专业人员设计，用于发行 NFT\
  \ 出生证明。新生身份存储在区块链上，并与经过验证的出生证明关联。\n\n### 作为数字身份证明\n\n区块链中最有趣的应用之一是 `SSID`（自主主权身份）。这是该技术的去中心化特征，允许用户完全拥有他们在数字社区中的名称。`SSID`\
  \ 具有重新民主化未来互联网的力量，在那里每个帖子、文章、视频、图片或推文都有加密签名，用于验证作者的身份。\n\n通过创建身份 NFT，将更容易链接所有的社交媒体账户和在线平台。它将作为我们数字身份的证明存在。拥有我们的身份就像拥有证明我们存在的数字护照。\n\
  \nNFT 标识符不受政府等任何机构或 Facebook 或 YouTube 等第三方的控制。我们是自己数据的唯一保管者，并控制我们选择分享的内容。我们甚至可以或出售我们拥有的宝贵数据。\n\
  \n### 作为学术资历的代表\n\nNFT 可以提供重要的学术信息，包括获得的学位、入学证明、成就记录以及其他相关数据。\n\n记录在 NFT 链上的所有信息都可以传输给请求方，而不需要传统的纸质证书。发行的\
  \ NFT 可以通过智能合约的验证系统进行验证。\n\n### 作为供应链的追踪伙伴\n\nNFT 为制造和分销公司提供了追踪其产品的能力。食品行业将受益匪浅，因为\
  \ NFT 有助于验证成分、来源以及其他因素。\n\n有了附带的 NFT 标识符，客户更容易知道他们是否花钱买了优质产品。此外，它维持了公司供应链内部的透明度。\n\
  \n### 作为丢失艺术品的追踪器\n\nNFT 让实体艺术变成数字化，实体艺术可以被创建成数字代币。对于原创作品，将其转换为 NFT 有助于追踪伪品或被盗画品。这有助于根除或减少伪品数量，并追踪人们从拍卖行购买的作品的原创性。\n\
  \n### 作为票务选项\n\n\n\n\n未来，NFT 有很大可能取代传统的票务或通行证，通过一个唯一的 ID 允许进入限制区域。这减少了纸张的使用和欺诈问题，因为\
  \ `NFTs` 所有者对于与目的相关的一切事务都需要单个代币。\n\n例如，如果你参加一场音乐会，你购买的 NFT 通行证将为你提供以下福利：\n\n* 进入活动或地点的权限\n\
  * 数字礼品的专属通行证\n* 活动纪念品\n* 获取免费零食的途径\n* 如果 NFT 作为活动股权提供，则让你成为该活动的股东（你可以获得利润分成）\n\n\
  NFT 铸造平台 `Mintbase` 的创始人 `Carolin Wend` 表示：“让我们感到兴奋的是 NFT 被应用于现实世界。”\n\n其中一个例子是\
  \ 2021 年 10 月 26 日在利斯本举办的 `Mintbase` `NEARCon Festival`，该活动使用了智能合约系统 `NEARProtocol`。活动组织者决定实行百分之百的\
  \ NFT 取票，允许参与者质押门务或获得特定利润。\n\n### 作为投票文件\n\n选民在投票前需要出示身份证或证明居住地的文件。`NFTs` 可以用于整合人们的身份并存储如投票投给谁之类的敏感数据。此外，`NFTs`\
  \ 对于防止选民欺诈和作弊问题有很大帮助。\n\n### 购买 NFT 指南\n\n在获取这些特殊代币之前，这里是你购买它们需要准备的事：\n\n1. `Digital\
  \ Wallet` – 它存储你的加密货币和获取的 `NFTs`。\n2. `Cryptocurrency` – 你需要购买 `NFT` 提供者接受作为数字资产支付的加密货币。`Ether`\
  \ 大多数被卖家接受。\n3. `Crypto exchange` – 找到销售加密货币的安全平台，如 `Coinbase`、`PayPal`、`Kraken`\
  \ 和 `OpenSea`。\n\n### 在哪里购买 NFT\n\n自从 `NFTs` 在虚拟市场突破以来，出现了许多市场。它们根据主题性质、格式、风格和收藏进行分类。通常分为以下四种类型：\n\
  \n* **开放市场**。它拥有来自各种来源和创作者的广泛数字资产和艺术品。\n* **收藏品市场**。它专注于电影、体育或艺术收藏品。\n* **精选市场**。其\
  \ NFT 选择来自专业或特定的来源。\n* **游戏市场**。它提供与游戏相关的 `NFTs`。\n\n#### 关注的顶级 NFT 市场：\n\n####\
  \ OpenSea\n`OpenSea` 是最大的非同质化代币市场。它被认为是数字资产的“eBay”，拥有大量的艺术、照片、体育纪念品、音乐等。该平台支持所有类型的创作者并接受超过\
  \ 150 种支付代币。它也是铸造新代币的最佳网站之一。\n\n你需要在网站上创建账户才能浏览并购买可用非同质化代币收藏。`OpenSea` 以提供稀有的收藏品和数字物品而闻名。\n\
  \n#### Rarible\n`Rarible` 是社区驱动的市场，具有创作者 `NFTs` 和作品集的铸造功能。它允许艺术家和创作者提供他们的数字资产和收藏品。它还为创作者未来出售铸造资产提供版税。你可以在这个市场中找到\
  \ `Adobe` 和 `Taco Bell` 等主要品牌。它需要 `Rarible` 代币作为支付。\n\n##### Foundation\n`Foundation`\
  \ 于 2021 年推出。数字艺术的高端市场之一。这是一个专属社区，艺术家在发布艺术品之前需要来自共同艺术家和创作者的邀请。这个由艺术家策划的平台已售出价值 1\
  \ 亿美元的 `NFTs`。要购买，用户需要拥有 `Ethereum` 代币的 `crypto wallet`。\n\n#### Mintable\n`Mintable`\
  \ 是一个开放市场，支持各种创作者和艺术家的 NFT 铸造需求。它被视为数字资产市场的“Etsy”。亿万富 `Mark Cuban` 支持这个平台。\n\n––––––––\n\
  \n![image](img/scene_break.png)\n\n##### Known Origin\n`Known Origin` 就像现实世界的艺术画廊，因为它于摄影师和艺术家的\
  \ `NFTs`。它提供最昂贵的收藏。\n\n#### SuperRare\n`SuperRare` 是另一个高端 NFT 市场。它具有画廊氛围且更具选择性。它提供\
  \ 3D 图像、视频和艺术。它最近推出了了自己的买卖代币。\n\n#### Nifty Gateway\n`Nifty Gateway` 是另一个艺术家的精选平台。它由\
  \ `Gemini` 加密交易所支持。它的 `NFTs` 创建在 `Ethereum` 上，被称为“Nifties”。该网站还为倾向于让第三方为他们存储物品的买家托管非同质化代币。你可以在这里查看并购买许多名人\
  \ NFT。它促进了 `Beeple` 和其他数字创作者的热销。\n\n##### DraftKings Marketplace\n`DraftKings Marketplace`\
  \ 是一个体育主题的网站，提供赛车手、足球明星和冰球明星等知名人物的收藏品。它建立在该品牌现有的体育博彩平台基础上。\n\n##### NBA Top Shot\n\
  `NBA Top Shot` 是篮球粉丝的 NFT 市场。它拥有最好的比赛亮点和捕捉历史比赛的视频片段。它是 `NBA` 授权的，不为创作者提供铸造选项。在这个平台上，你看到的即得到的。\n\
  \n收藏品的价格从几美元到几千美元不等。在取得巨大成功后，它现在是一个价值数十亿美元的 `NFTs` 市场。\n\n#### Axie Infinity Market\n\
  `Axie Infinity Market` 是一个游戏 NFT 网站可以在出售、购买和铸造热门游戏的资产。它是 `Axie` 在游戏生态系统中成功的关键，市值超过十亿美元。其特有代币\
  \ `Axie Shards` 可以从加密货币交易所和其他 NFT 市场购买。\n\n其他购买 NFT 的地方还有 `Binance NFT`、`Decentraland`、`Arkane\
  \ Market`。\n\n\n\n\n\n“成功的元宇宙代币的关键在于它的实用性。”—— John Dough，Currency.com 货币分析师。\n\n\
  得益于比特币的持久力，加密货币已成为主流。以太坊和其他替代代币在 2021 年也表现优异。由于人们对虚拟货币的兴趣日益增长，许多投资者正在寻找新机会来增加他们的投资组合。\n\
  \n当虚拟游戏中的 NFT 或非同质化代币变得流行时，在线市场开始提供数字化艺术品和收藏品。这项创业被证明是获利丰厚的，并创造了另一种收入来源。\n\n随后元宇宙代币登场了。它们是加密货币的演变。它们使用区块链技术创建，使得它们通常像第一代加密货币一样安全。\n\
  \n![image](img/image003.png)\n\n## 章节总结\n\n*   最佳元宇宙代币深度览\n*   元宇宙代币的类型\n*   为什么考虑元宇宙代币的市值很重要？\n\
  *   按市值（十亿计）排名的顶级元宇宙币\n*   要点总结\n\n## 最佳元宇宙代币深度览\n\n每个元宇宙平台都有自己的加密货币，无论是游戏、社交、房地产还是电子商务平台。从本质上说，元宇宙代币是\
  \ 3D 平台中的货币。它们是用于支付元宇宙中的资产或用于创建数字产品或服务的资金。\n\n有了数字货币，任何用户都可以购买游戏内配件、物品和升级，买卖虚拟土地以及其他\
  \ NFT。 某些代币仅在各自的元宇宙中可用，而大多数代币可以在加密交易所和 NFT 市场上购买。\n\n## 元宇宙代币的类型\n\n*   **边玩边赚 (P2E)\
  \ 代币**\n    P2E 代币是具有现实世界价值的游戏内货币，可以兑换为法币。当玩家参与并在游戏中赢得挑战并获胜时，他们将以元宇宙代币的形式获得奖励。\n\
  \n*   **元宇宙平台代币。**\n    它们是元宇宙平台的实用型代币，或具有独特元数据和标识代码的区块链加密资产。\n\n*   **3D 数字元宇宙代币**\n\
  \    这些它们通常被称为非同质化代币（`NFTs`），用于元宇宙中的商业交易。3D 平台提供虚拟体验，包括电子商务和 P2E 游戏。要访问它们，用户需要专用代币。\n\
  \n## 为什么考虑元宇宙代币的市值很重要？\n\n市值衡量了加密货币的价值。它提供了加密货币或代币的详细概述，允许投资者将其价值与其他加密货币进行比较。它还有助于确定代币的波动性和增长潜力。要查找市值，只需将挖出的代币总数乘以单币在市场上的当前价格即可。\n\
  \n演示如下：\n\n*   `Crypto X` 有 500,000 个流通币。每个代币价值为 1 美元。`Crypto X` 的市值为 500,000 美元。\n\
  *   `Crypto Z` 有 200,000 个流通币。每个币价值为 2 美元。`Crypto Z` 的市值为 400,000 美元。\n\n就像传统投资一样，考虑市值或挖掘代币的总美元价值很重要。\n\
  \n代币的市值越大，为投资者提供的稳定性就越高。市值较小的加密货币容易受到市场不断变化的影响，产生巨大的收益或亏损。\n\n通常，市值有三种类型——大市值（市值在\
  \ 100 亿美元或以上的公司）、中市值（市值在 20 亿到 100 亿美元之间）和小市值（市值在 3 亿到 20 亿美元之间）。\n\n*   大市值公司是行业中的主要参与者，且存在时间较长。虽然它们不一定能在短期投资期内保证巨额回报，但长期投资会回报其投资者。\n\
  *   中市值公司是那些在行业中显示快速增长的公司。它们的潜力巨大，可以提供良好的投资回报。\n*   小市值公司在行业中较年轻，或者服务于小众市场。通常，它们的资源较少，且容易受到经济放缓的影响。\n\
  \n![image](img/image001.png)\n\n## 需要记住的术语\n\n*   **流通供应量**：已挖出的代币数量\n*   **完全稀释供应量**：预计将挖出的代币数量\n\
  \n### 1. ApeCoin\n\n### 代币\n`ApeCoin` 是 `APE` 生态系统的治理和实用型代币。这种 `ERC-20` 代币赋予了去中心化元宇宙中\
  \ `Web3` 构建者的权力并激励了他们。它是由 `Ethereum` 区块链的工作证明（`POW`）共识机制保护的 `ERC-20` 代币。\n\n该代币的总供应量固定为\
