  \ 年值得考虑的最佳平台\n\n## 1. WAX\n\n### 平台\n`WAX` 是一个基于区块链工具的去中心化应用程序（DApp），于 2017 年上市。该工具包允许创建非同质化代币（`NFTs`）和\
