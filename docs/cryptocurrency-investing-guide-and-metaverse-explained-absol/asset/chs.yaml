  \ |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n# 元宇宙是未来世界吗？\n\
  \n“今天，我认为我们看的是互联网，但认为在未来你将置身于体验之中。” 马克·扎克伯格\n\n`元宇宙`是互联网的下一个边界和迭代版本吗？`元宇宙`是“meta”和“universe”的结合，它允许从物理领域到虚拟世界的跨越。\n\
  \n我们都知道，互联网的到来改变了传统的商业、业务、技术、通信和生活方式格局。它的发展推动了现代技术和设备，使其人类最伟发明之一。\n\n当 Facebook\
  \ 在 2021 年 10 月将其公司更名为`Meta`时，科技界和社交媒体界关于`元宇宙`议论纷纷。一夜之间，对这一未来想法的兴趣席卷了整个行业，许多人变成了`元宇宙`专家。\n\
  \n各行业的大公司开始计划重新调整投资，并支持想要构建元宇宙未来的主要玩家。\n\n![image](img/image023.png)\n\n## 章节总结\n\
  \n* 一切始于何？\n* 什么是元宇宙？\n* 元宇宙是如何运作的？\n* 元宇宙的关键阶段\n* 构建元宇宙需要什么？\n* 挑战与风险\n* 元宇宙是 Web\
  \ 3.0 吗？\n* 元宇宙已经发生了吗？\n* 核心收获\n\n`元宇宙`的热潮并非始于 Facebook 的更名。几十年来，一直存在具有现有虚拟现实世界的平台，可以通过\
  \ VR 头戴设备等科技设备访问。\n\n随后的“原型元宇宙”平台包括热门游戏《堡垒之夜》、`Roblox`、《动物森森会：新新程》、《我的世界》和《魔兽世界》。它们一直在使用化身、举办在线活动并参与世界经济。\n\
  \n然而，这些平台提供的功能有限，仅展示了它们各自独立的`元宇宙`。\n\n真正的`元宇宙`是下一个层次。\n\n## 一切始于何？\n\n`元宇宙`曾是一个遥不可及的概念，我们可能从未想象它会很快实现。这个虚构的虚拟世界是由美国作家尼尔·斯蒂芬森在他\
  \ 1992 年的小说《雪崩》中引入的。\n\n故事中的`元宇宙`看起来像是一个位于 100 米道路上的城市环境，斯蒂芬森将其称为“街道”（Street）。这是一条未开发的道路，允许参与者创建自己的\
  \ 3D 建筑、结构、小街、特殊社区，甚至是战斗区。这个三维空间可以通过个人终端和 VR 目镜访问。\n\n故事中未来感的类人形象和其他数字现实特征激发了游戏产品开发者、建筑、时尚、设计和其他相关行业的兴趣。不久后，Oculus\
  \ Quest 和 VR 头戴设备进入市场并广受欢迎。\n\n斯蒂芬森写道：\n\n“具有魔力的语言。如今，人们不相信这些东西。除非在元宇宙，那里魔法是可能的。元宇宙是由代码构成的虚构结构。而代码只是语言的一种形式——计算机理解的形式。整个元宇宙可以被视为运行在鲍·赖夫光纤网络上的单一巨大命名书。”\n\
  \n## 所以，元宇宙到底是什么？\n\n`元宇宙`是一个运行在数字空间中的集成网络或社交领域。它是多个沉浸式虚拟体验的延续。所有的同步体验都增强了互动感。这远比目前基于反馈的社交媒体视频通话好。\n\
  \n解释元宇宙体验最好的的方法是通过视频游戏。这些游戏利用 3D 虚拟现实特征为用户提供沉浸式体验。\n\n大多数这些元素已经跨越到我们生活的各个方面。例如，`Roblox`一直在为用户举办虚拟聚会、演唱会和活动。\n\
  \n\n\n\n\n- 无论彼此位于何处，都能保持活跃的互动和强连接\n- 像互联网一样将不同平台相互互联——允许用户通过单个浏览器访问多个网站\n- 提供我们想要与他人共同体验的活动——聚会、玩游戏、参加活动、看演唱会、约会、购物、工作、获取教育机会、访问远程地区以及更多内容\n\
  - 使用虚拟现实（VR）、增强现实（AR）、全息化身、空间视频和音频以及其他通信形式背后的技术\n- 提供使群体协作以提高生产力，或举办活动以开展业务的功能\n\
  \n例如，房地产公司可以为潜在客户和投资者提供虚拟房产导览。远程团队无论个人位于何处，都能无缝地计划和讨论重要事项。用户和消费者可以使用智能手机或数字眼镜轻松访问沉浸式数字内容。\n\
  \n元宇宙还提供了一个沉浸式环境，其中计算世界嵌入到物理领域中，反之亦然。这种融合创造了一个新的平台层，允许人类之间实现超越和交互连接。\n\n这个模拟数字空间模仿了现实世界，并允许用户选择如何体验这种模拟现实。随着它的不断增长，元宇宙提供了一个替代性的虚拟空间，我们和他人在此共存，就像现实世界一样。\n\
  \n## 元宇宙是如何工作的？\n\n元宇宙是一个全天候的共享虚拟环境，具有游戏、在线购物或社交互动等沉浸式特征。在婴儿阶段，元宇宙内容使用游戏风格的图形和化身。但其巨大的潜力正在逐渐释放。\n\
  \n范式的根本性将利用并融合所有可用技术。它承诺消除访问限制，并带来更丰富的体验。\n\n区块链和加密货币将塑造下一代 Web 3.0，作为一个允许组合性和互操作性的开放网络。我们需要理解，组合性概念对于元宇宙的指数级增长至关重要，因为该概念旨在实现开源并让世界上任何地方开发者开发者。\n\
  \n## 元宇宙的阶段\n\n### 第一阶段\n\n这是初始阶段，也是我们目前正在经历的阶段。对虚拟世界的沉浸程度约为 50%。可以使用双手机控制器和头戴设备进行体验。目前的\
  \ VR 影响了听觉和视觉，但触感有限。\n\n在此阶段，`Counter-Strike`、`Fortnite` 和 `GTA` 等元宇宙游戏中的区块链协议对\
  \ Web 3.0 基础设施层的发展具有影响。这些包括 `Ethereum`、`Tron`、`Polygon`、`BSC` 和 `Cardano`。\n\n非同质化代币（NFTs）也利用了人们获得数字资产、房地产、游戏货币、艺术品、皮肤、衣服、武器和飞船所有权的机会。\n\
  \n这些类元宇宙平台的去中心化本质也允许参与者获得收益分成，或对费用、资助或拍卖等某些事项进行投票。用户在元宇宙中通过买卖、广告、为虚拟活动提供门票、房地产交易和创建\
  \ NFT 来花费和赚钱。所有这些活动对元宇宙平台的增长都起着巨大的作用。\n\n### 热门示例\n\n- `Sandbox` 元宇宙平台与说唱歌手 Snoop\
  \ Dogg 合作创建了 `Snoopverse`。他们的项目展示了他的豪宅的虚拟版本，他在那里举办演唱会和派对。该项目的成功导致了 `Sandbox` 的流行，吸引了\
  \ 359 万美元。\n\n### 第二阶段\n\n这一阶段对虚拟现实的沉浸程度约为 80%。我们将更方便地获得工具、服装、连体衣、全向跑步机，帮助我们体验身处其中。遗憾的是，味觉和嗅觉仍然无法实现。\n\
  \n在此期间，去中心化组织（DAOs）将在资金、决策、升级和实施方面主导局面。\n\n任何人都可以参与，而开发者如果他们愿意，可以做兼职工作。随着元宇宙中的工作变得越来越普遍，结果将是完全的互操作性。\n\
  \n这意味着我们可以从一个元宇宙到另一个元宇宙，并购买、出售或交换资产。这就像在物理世界中，当我们寻找想要的物品时，可以从一家商店去另一家商店。\n\n###\
  \ 第三阶段\n\n这是高级虚拟现实阶段，科技公司将推出向大脑发送直接信号以实现主动沉浸的产品。我们无需访问用户界面即可享受体验。\n\n神经 VR 在阶段阶段成为常态，将人类意识传输到任何提供与真实相同感觉的元宇宙中。\n\
  \n第三阶段提供了完全沉浸，我们将很难区分自己是在元宇宙中还是现实世界。它成为了我们日常生活的一部分，人们可以在那里聚会、见面并共同进行活动。虚拟政府也可能存在，使人们成为元宇宙公民。\n\
  \n在元宇宙中结婚和享受关系也是可能的。人工智能（AI）将有巨大的发展，创造出具有人类情感和意识的模型。\n\n如果所有这些变为现实，随着旅行的减少，二氧化碳排放将减少。它可能影响全球范围内犯罪率的下降趋势。\n\
  \n### 第四阶段\n\n第四阶段是现实世界和元宇宙完全无法区分的阶段。使用先进的神经技术，我们可以轻松绘制大脑地图或将大脑上传到元宇宙以访问数据或信息。这打破了人类身体的限制，将我们从法律和边界中解放出来。\n\
  \n\n\n\n\n随着元宇宙的蓬勃发展并融入物理领域，我们的身心所能及将不再有边界。通过使用 AI 技术增强体验并提升我们的心理能力，我们可以轻松地在平行世界之间穿梭。\n\
  \n## 构建元宇宙需要什么？\n\n与其他体现在应用程序中的虚拟现实想法不同，开发元宇宙要复杂得多。它不是使用今天常用的敏捷开发模型创建的。\n\n要创建一个复杂的虚拟空间，构建互联的层至关重要，例如基础设施、人机界面、空间计算、去中心化工具、用户体验、创作者经济和内容引擎驱动。\n\
  \n- 基础设施涉及`GPUs` 以及如`Wi-Fi`、`5G` 和`cloud` 等连接技术。\n- 人机界面是帮助用户利用元宇宙优势的设备和技术，例如`headsets`、`haptics`、`AR\
  \ glasses` 等。\n- 空间计算指的是框架和`3D visualization`。\n- 去中心化元素包括`blockchain`、`edge computing`、`AI`\
  \ 以及其他民主化工具。\n- 用户体验涉及工作、游戏、购物或活动等数字应用技能。\n- 创作者经济是数字资产的选择、设计工具以及`e-commerce shops`。\n\
  - 内容引擎驱动有助于促进参与，如`social media`、`reviews`、`ads` 和`ratings`。\n\n## 挑战与风险\n\n### 挑战\n\
  \n理想的元宇宙是去中心化的、开放的，并且没有单一实体可以控制用户的资产和数据。它正在逐渐形成，但其完全发展可能需要更长时间。此外，其发展阶段由巨型服务供应商和科技公司主导的事实可能会损害这一目标。\n\
  \n`Facebook`（最近更名为`Meta`）公司的中心化性质一直将用户的内容和数字身份存储在他们的服务器上。这代表了他们对数据的所有权和决策能力。遗憾的是，许多科技公司是这些数据的糟糕保管者，因此需要等待`Web\
  \ 3.0`的一套新规则和准则。\n\n目前，观察支持`Web 3.0` 和元宇宙的技术如何演变并改变平台，是我们能做的最好的事情。看到元宇宙的创作者经济如何补充`Web\
  \ 3.0`通过去中心化解决方案开发新金融世界的愿景，是令人着迷的。\n\n随着元宇宙的进一步发展，开源公链和`Web 3.0`的互操作性对于物理世界与虚拟世界的融合与联动至关重要。它们不仅应该相互支持，而且应该以流畅、无缝的方式重叠。\n\
  \n科技行业的另一个挑战是迫切需要创建超级计算机来支持元宇宙。\n\n例如，`Intel`表示他们现在正在开发比今天型号强大 1000 倍的处理器。他们的专家团队还在致力于硬件改进、软件架构和新算法，以实现更具沉浸感的计算，这些计算将利用下一代互联网和元宇宙。\n\
  \n### 风险\n\n在处理元宇宙时，我们考虑考虑以下几个风险。\n\n- 平台价值 – 元宇宙的价值在很大程度上取决于它们的流行程度、专有的`cryptocurrency`和服务。如果它们无法持续维持用户的兴趣，相关资产的价值就会大幅下降。\n\
  - 去中心化治理 – 虽然这一元素被视为元宇宙的积极因素，但它可能成为阻碍某些用户决策的漏洞。安全泄露和黑客攻击可能使投资和数据面临巨大危险。选择具有安全且严密措施的元宇宙以保护用户隐私至关重要。\n\
  - 学习曲线 —— 像任何其他项目一样，元宇宙也有波峰和曲线。理解周期并利用它们取得优势至关重要，同时平台正在不断开发功能以维持其增长。\n\n## 元宇宙是\
  \ Web 3.0 吗？\n\n`Web 1.0`是昨天的互联网。它存在于 1991 年至 2004 年之间，当时消费内容的人多于内容创作者。\n\n`Web\
  \ 2.0`是今天的互联网，创作者主导了平台，人们通过`Facebook`等社交媒体和`YouTube`等在线平台进行互动。我们发布、评论并分享图像和视频。\n\
  \n在我们现在利用的`Web 2.0`中，我们无法对共享内容变现和控制。我们享受的平台是高度中心化的，并由科技和商业行业的大巨头控制。这些公司还以中心化的方式开发和销售产品或服务。他们拥有我们在平台上的内容，并控制我们的创作。\n\
  \n为了使用他们的平台和服务，我们需要注册、提供私有数据并接受他们的条款和条件。当他们想要阻止或禁止我们使用他们的平台时，他们可以在未经我们同意的情况下这样做。\n\
  \n即使是全球估计超过 25 亿的玩家，尽管他们用真钱购买了游戏资产，也不拥有这些游戏资产。\n\n但随着技术的进步和开发者变得更有创造力，`Web 2.0`正在快速演变为下一代互联网概念或`Web\
  \ 3.0`。这种演变被认为允许用户拥有和控制在线内容、创作、在线身份和数字资产。我们可以制作内容、控制内容并对其进行变现以为自己获利。\n\n`Web 3.0`将对所有想要利用数字服务的人开放。在访问任何平台的服务之前不需要注册。作为我们私有数据和内容的唯一保管者，保护它们将是我们的责任。\n\
  \n`Web 3.0`的骨干将是`blockchain`技术。`blockchain`的金融交易将使用`cryptocurrency`。\n\n- `blockchain`实现了点点网络。`blockchain`的去中心化本质允许用户拥有数据并与其他用户进行独立业务。如何和何时共享数据的完全权限归还给了用户。分配的`private\
  \ keys`帮助用户访问账户。\n- `cryptocurrency`是用于在线和现实世界的虚拟货币或令牌。它存储在电子或数字钱包中。\n\n这是`Web 2.0`向`Web\
  \ 3.0`演变的一个示例：\n\n- 从中心化系统到去中心化的`blockchain`\n- 从`Chrome`到`Brave`（一个为用户提供更多隐私的浏览器）\n\
  - 从`Facebook`到`Steemit`（一个根据用户的创作和策划内容付费的社交平台）\n- 从`bank`到`Metamask`（一个由`Ethereum`区块链驱动加密钱包）\n\
  - 从有限责任公司`LLC`到去中心化自治组织`DAO`（一种没有人拥有决策控制权的`LLC`）\n- 从`Amazon Web Services`或`AWS`到`InterPlanetary\
  \ File System`或`IPFS`（一种驱动分布式网络的点对点多媒体协议）\n- `Twitter`推出了 NFT 头像\n\n## 元宇宙与 Web\
  \ 3.0\n\n元宇宙和`Web 3.0`并不是互联网的竞争版本。然而，当这两个概念充分发挥潜力时，它们的功能可能会重叠。支持`Web 3.0`和元宇宙的技术是相似的。\n\
  \n但认为元宇宙是互联网的下一个阶段或`Web 3.0`（具身互联网）是不正确的。\n\n以下是原因：\n\n- 元宇宙侧重于提供用户将如何体验未来互联网。`Web\
  \ 3.0`关于互联网的去中心化。\n- 元宇宙是一个虚拟现实空间。`Web 3.0`是 Web 的去中心化版本。然而，它们的功能将相互补充。\n\n\n\n\n\
  \n*   元宇宙是关于虚拟与物理世界的融合。`Web 3.0` 提供了一套全新的准则和规则，允许去中心化以及数据或内容的所有化。\n*   元宇宙的创造者补充了增强型\
  \ `Web 3.0` 的愿景，创建一个提供去中心化解决方案的新金融世界。\n\n### 元宇宙\n\n元宇宙由云基础设施、应用程序、软件工具、硬件、平台和用户生成内容等多种技术驱动。其核心是元宇宙将利用移动设备、计算机和其他传统设备，同时使用沉浸式虚拟现实\
  \ (`VR`) 和增强现实 (`AR`) 可穿戴设备。\n\n它是对人们未来如何使用互联网的一种呈现。元宇宙将用户的体验从 `2D` 转变为 `3D`，提供三维网络内容，而不是在设备的\
  \ `2D` 屏幕上点击或翻页内容。\n\n新兴的维度将工作、娱乐、社交媒体、教育、游戏和其他现实世界的活动整合到一个全平台中。例如，在线游戏 `2D` 网页变成了一个\
  \ `3D` 球体，玩家在其中使用游戏内虚拟形象 (`avatars`) 行走、与其他用户互动和竞争。\n\n元宇宙将展现以下特征：\n\n*   大规模可扩展性\n\
  *   实时渲染\n*   无限数量的用户\n*   `3D` 虚拟环境\n*   可操作性\n*   同步性\n*   数据连续性\n*   个人存在\n*\
  \   持久性\n\n### Web 3.0\n\n互联网正在不断演进，我们大多数人都在期待未来将带给我们什么。由于 `DAOs`、`NFTs` 和 `P2E`（边玩边赚）游戏带来的指数级增长，`Web\
  \ 3.0` 正良好地形成。\n\n`Web 3.0` 的早期迹象是去中心化浏览器以及非同质令牌 (`NFTs`) 的出现。`NFTs` 是独特的数字资产，代表艺术、音乐、视频片段等内容的所有权。\n\
  \n`Web 3.0` 的巨大潜力及其作为新一代互联网的应用为用户提供了巨大的优势。\n\n与其使用像 `Google` 或 `Facebook` 这样拥有并变化我们数据和内容的中心化网站，`Web\
  \ 3.0` 允许我们使用基于区块链的搜索引擎、社交网络和应用，在这些应用中我们控制自己的数据。\n\n## 元宇宙已经发生了吗？\n\n没有人能预测宏大的元宇宙何时会实现。由于基础元素的出现，它可能在这个新十年的末发生，或者更早发生。但可以说，数字化转型的未来正在缓慢展开并影响着生活的各个方面。\n\
  \n这就像 1989 年 `Tim Berners-Lee` 发明万维网 (`www`) 时发生的情况一样。人们对它将带来的可能性感到兴奋。快进到今天，我们正享受着互联网带来的便利。这正是元宇宙现在正在做的事情。\n\
  \n随着每个人的期待，越来越多的行业对元宇宙如何改变世界感到好奇。未来主义者、投资者、高管和创始人正在声明自己的主张，并探索其巨大的潜力，以带来更多的利润、更好的社交连接、海量的娱乐等。\n\
  \n元宇宙正在巩固其在物理领域的存在。它正跨越技术、游戏世界、房地产和商业行业、社交媒体平台以及虚拟货币。这些因素已成为其实现的构建元素，而互联网使元宇宙成为了一个流行的概念。\n\
  \n✓ 游戏玩家已经在享受元宇宙了。\n\n\n\n\n\n*   社交网络的用户。他们就是我们，即为了不同目的利用社交媒体平台的人。注册这些网络需要我们提供个人信息，而由于缺乏安全措施，这些信息有时会面临泄露。\n\
  \n在元宇宙中，头戴设备可能会收集用户的空间数据。这可能会引发新的隐私问题，这是守门人应该高度关注的因素之一。\n\n*   广告商。当今的消费互联网从订阅收入和广告中产生收益。某些模型在未来的元宇宙本质上可能仍然有效。\n\
  \n然而，一些专家认为，像 `DeFi-powered` 这样的传统业务模式将会回归。\n\n但有一点是肯定的，商业模式将影响感兴趣的公司参与未来虚拟现实领域的决策。\n\
  \n# 早期元宇宙开发者\n\n2022 年随着行业巨头们的声明开启的，他们计划探索 `Metaverses`（元宇宙）、`NFTs` 和 `crypto spheres`（加密领域）的潜力。这促使投资者和用户开始研究那些已经提供类元宇宙体验的公司的表现。\n\
  \n我们也应该关注那些受 `FOMO`（错失恐惧症）驱动的公司。虽然许多公司认真地想要启动自己的元宇宙，但其他公司并没有能力将其网络扩展到这一新领域的全部潜力。\n\
  \n技术的快速创新也改变着金融和投资行业的格局。`Bitcoin` 的区块链技术在 2009 年上市时引发了这场改革。不久后，各种加密货币凭借各自的区块链出现并与\
  \ `Bitcoin` 竞争。\n\n正是这种区块链技术实现了元宇宙的数据连续性和功能性。\n\n## Meta（原 Facebook Inc.）\n\n`Facebook`\
  \ 将公司名称改为 `Meta` 的决定引发了人们对元宇宙概念的极大好奇。每个人都在等待马克·扎伯格执掌的这个热门社交媒体平台将如何演变为元宇宙。早在 2014\
  \ 年，`Facebook` 就已经投资了虚拟现实技术。它收购了 `Oculus`，并致力于创建数字头像和 VR 头戴设备，允许用户在工作、旅行或享受娱乐活动的同时与其他联系。\n\
  \n“我们希望尽可能多的人能够体验虚拟现实，能够跳入元宇宙并在其中获得这些社交体验，”扎伯格在接受 `CNET` 采访时这样说。\n\n`Facebook` 概述了在其合作伙伴的帮助下，在未来十年或二十年内将元宇宙整合到其平台中的计划。它与英国的\
  \ `Colorintech` 合作举办了其元宇宙内容创作大赛。它目前正与德国的 `Alte Nationalgalerie` 合作开发包容性的 XR 体验。\n\
  \n`Facebook` 还于以色列宣布了其 AR/VR 初创企业增长项目，作为公司利用元宇宙潜力使命的一部分。它还在开发 `Facebook Horizon`，这是一个类似于\
  \ `OASIS` 版本的虚拟世界，在其中一切皆有可能，用户拥有独特的身份。通过 `Oculus Quest 2` 或 `Oculus Rift` 头戴设备，用户可以无缝地进入广阔的数字空间。\n\
  \n2021 年，这家社交媒体巨头已经在技术方面花费了 100 亿美元来构建元宇宙。凭借其基础设施元素、繁荣的创作者经济体、社交媒体广告引擎以及一系列 `Oculus`\
  \ 头戴设备，`Meta` 可以在未来 2 到 5 年内轻松开发出元宇宙原型。\n\n## 微软\n\n软件巨头 `Microsoft` 一直在开发混合和扩展现实（XR）的应用。扩展现实（XR）将把现实世界与虚拟现实（VR）以及增强现实（AR）融合。\n\
  \n迄为止，`Microsoft` 正在将 Fortnite 作为一种互动式游戏和元宇宙进行营销。根据营销副副总裁 Matthew Weissinger 的说法，“这不仅仅是一个游戏。我们正在构建一个被称为元宇宙的东西——一个社交场所。”\n\
  \n软件巨头 `Microsoft` 一直在开发混合和扩展现实（XR）的应用。扩展现实（XR）将把现实世界与虚拟现实（VR）以及增强现实（AR）融合。\n\n\
  元宇宙的元素之一是让用户存在于数字空间并像现实世界一样生活的能力。\n\n但有一点是肯定的，商业模式将影响感兴趣的公司参与未来虚拟现实领域的决策。\n\n软件巨头\
  \ `Microsoft` 一直在开发混合和扩展现实（XR）的应用。扩展现实（XR）将把现实世界与虚拟现实（VR）以及增强现实（AR）融合。\n\n元宇宙的元素之一是让用户存在于数字空间并像现实世界一样生活的能力。\n\
  \n## 我的世界\n\n``` been by apps with with and and reality ( (). 扩展现实（XR）将把现实世界与虚拟现实（VR）以及增强现实（AR）融合。\n\
  \n元宇宙的元素之一是让用户存在于数字空间并像现实世界一样生活的能力。\n\n## Roblox\n\n`Roblox` 提供沉浸式的虚拟体验，让玩家一窥未来世界的模样。这个由独立开发者创建的热门游戏平台被认为是元宇宙最广阔、最接近愿景。用户还会花费美元购买\
  \ `Robux`，该网站的虚拟货币，用于购买数字物品（等等，\"the-site's-virtual-currency-to-purchase-digital-items\"\
  \ -> `the-site's-virtual-currency-to-purchase-digital-items` -> `the-site's-virtual-currency-to-purchase-digital-items`）。\n\
  \n实际上是：`Robux`，该网站用于购买数字物品的虚拟货币。\n\n## Epic Games\n\n回看 `Epic Games` 在 2017 年开发\
  \ `Fornite` 时，这款具有塔防防御风格的游戏已计划构建一个元宇宙领域。但这个玩家对抗丧尸的游戏变得如此受欢迎，自己变成了一个全球性现象。公司急于在 `Fortnite\
  \ Battle Royale` 大逃杀模式中加入舞蹈派对、语音聊天和其他社交功能，以提供更刺激的游戏体验。\n\n迄为止，`Epic Games` 正在将 `Fornite`\
  \ 作为一种互动式游戏和元宇宙进行营销。根据营销副副总裁 Matthew Weissinger 的说法（注：此处原文似乎与前文重复，已翻译）。\n\n首席执行官\
  \ `Tim Sweeney` 已批准公司对构建元宇宙的投资。`Epic Games` 分配了 10 亿美元的基金以促进增长机会。\n\n\n\n\n\n2018\
  \ 年和 2019 年，Epic Games 旗下的 Fortnite 产生了超过 90 亿美元的营收。虚幻引擎（Unreal Engine 对于用户的 VR\
  \ 和 AR 体验至关重要。Epic Games 的成功案例包括特拉维斯·斯科和阿莉娜·格兰大的演唱会、马丁·路德·金爵对“我有一个梦想”演讲的沉浸式重塑、音乐首秀以及热门电影的预告片。Fortnite\
  \ 还与巴黎世（Balenciaga）、空乔（Air Jordan）和美国橄榄联盟（NFL）建立了合作。\n\n# Furioos of Unity\n\nFurioos\
  \ 借助其 GPU 服务器基础设施流传输实时完全交互的 3D 环境。Furioos 基于云的流媒体技术使得共享复杂的交互式应用程序变得简单。得益于其多平台能力以及对智能手机和其他设备的访问，发送和接收视频流变得非常方便。\n\
  \n用户可以通过复制和粘贴 Furioos 的`iFrame`将应用程序嵌入任何网站，以生成可共享的 URL。这使得与合作者和客户共享任何类型的 3D 项目变得极其快速且无缝。接收者只需拖放带有应用程序的`ZIP`文件。Furioos\
  \ 会立即定位`.exe`文件并立即上传。\n\nUnity 秉持开发强大应用程序的使命，发布了混合与增强现实工作室（`MARS`）。它让参与者能够使用虚拟空间中的额外数字应用来创建混合现实体验。\n\
  \n根据 AI 高级副总裁 Danny Lange 博士和工具副总裁 Timoni West 的说法，公司支持开始在现实世界中显现的革命性元宇宙（Metaverses）。因此，他们正在投资数字孪生或物理世界的数字表示。\n\
  \nLange 和 West 相信，数字孪生将成为巨型元宇宙概念的基础，在那个概念中，用户可以轻松地跨越不同的虚拟球体而没有任何故障。\n\n“它必须易于使用。它必须易于创建内容和体验。它还必须让人们以此为生……持续下去并将其带入元宇宙是我们的基因，是我们血液里的东西。”\n\
  \n## The Sandbox\n\nSandbox 允许玩家构建虚拟世界，并使用 NFT 进行游戏、买卖 NFT 资产或房地产产。这些非同质化代币是独特的、不可互换且不可分割的数字代币。在这个领域，我们将拥有游戏内资产的真实所有权，并以我们想要的方式使用数字货币。\n\
  \n## Decentraland\n\nDecentraland 是另一个早期行动者，标志着将元宇宙作为核心产品的意图。这个完全去中心化的虚拟世界通过`DAO`控制并在`Ethereum`区块链上运行。自\
  \ 2017 年以来，该平台一直在稳步增长。截至目前，其记录的最高价房产为 240 万美元。\n\n它的加密货币被称为`MANA`。它可以用于购买土地、建造和设计结构、创建艺术展或演唱会等场景和挑战、购买`Avatar`可穿戴设备及市场上的其他物品，甚至在赌场中赌博。\n\
  \n2021 年，数字房地产公司 Republic Realm 以 NFT 形式购买了 259 块土地。它价值 120 万`MANA`，等同于 90 万美元。\n\
  \n## Niantic\n\nNiantic 的 Pokemon Go 是提供跨越现实与虚拟世界界限沉浸式体验的关键平台之一。它已筹集约 3 亿美元来启动其元宇宙项目。Niantic\
  \ 旨在创造一种对元宇宙“反乌托邦噩梦”构想的替代方案。\n\n## Apple\n\n由于其在大市场的普及能力，苹果在元宇宙竞赛中可能是一匹黑马。它可以轻松地实现它在平板电脑和智能手机市场上所做的事情。\n\
  \n它目前正在生产一种先进的 VR 设备，认为这将彻底改变用户体验元宇宙的方式。它还在投资 AR 硬件，这表明其`App Store`希望在数字革命释放其全部潜力时赶上潮流。\n\
  \n## JPMorgan Chase & Co.\n\n摩根大通银行在创建`Onyx Lounge`时采取了探索元宇宙的初步步骤。\n\n摩根大通在 Decentraland\
  \ 建立了一个 3D 虚拟平台。在一份声明中，这家金融巨头表示，“元宇宙在未来几年可能会渗透到每个行业，市场机会预计超过 1 万亿美元。”\n\n##ewaterhouse\
  \ Coopers\n\n普华永道（Pricewaterhouse Coopers）建立了去中心化的虚拟平台。去年 12 月，普华永道香港办公室将对探索元宇宙潜力的人士提供建议。\n\
  \n## Walmart\n\n2021 年 12 月，沃尔玛申请了新的商标，以制造虚拟玩具、个人护理用品、电子产品和家居装饰。该公司还发布声明，称将提供 NFT\
  \ 和加密货币。\n\n## McDonald's\n\n麦当劳公司（McDonald's Corporation）申请了与元宇宙相关的专利，以运营在线虚拟餐厅。\n\
  \n## Nvidia\n\n英伟达并非直接参与者，但被视为元宇宙的关键推动者。它在 2021 年宣布 Omniverse Enterprise 将 3D 图形与人工智能（AI）相结合，为元宇宙奠定基础。\n\
  \n# 元宇宙成为热门话题的主要原因\n\n使用化身的第一代服务被称为被称为元宇宙是因为这些平台使用单一应用程序。要被归类为元宇宙，平台应该具有多种交互。\n\n\
  元宇宙的概念与新兴的`Web 3.0`或开源去中心化版本相关。它将使用实时 3D（RT3D）对象并与数据进行交互。\n\n公司建立的大型网络服务是互连的，展示了从一个地方到另一个地方的专用路径。以下是元宇宙的一些特点和优势：\n\
  \n### 1. 民主化架构\n\n在民主化的架构下，元宇宙平台不受单一实体、团体或机构控制。\n\n平台加密货币的持有者有权参与网络决策。这意味着在没有用户同意的情况下，已无法更改算法。\n\
  \n### 2. 开源\n\n由于开源是元宇宙的关键元素之一，构建者需要向所有人开放其源代码。\n\n全球科技巨头被要求将其技术、`AI`和图像合成开放给想要开发自己平台的开发者、初创公司和其他相关方。\n\
  \n### 3. 推进科学研究\n\n凭借更高级的模拟能力，元宇宙可以轻松推进航空航空、医疗保健和制造等领域的科学研究。\n\n医疗专业人员可以在虚拟环境中与利益相关见面，展示新药或疫苗的模拟分子结构。\n\
  \n此外，元宇宙特征可以提高项目的成功率、错误检测和审批。\n\n### 4. 变革通信和交互\n\n目前，我们在访问在线信息使用的是二维格式。它涉及视觉效果和文本、二维屏幕以及允许我们进行有限交互的其他输入设备。\n\
  \n元宇宙的实现被视为一场主要的输入输出革命。我们可以轻松与可视化数据进行交互。\n\n\n\n\n\n在元宇宙平台中，残障人士可以体验其他用户通常的经历。例如，下肢活动障碍的人士可以在元宇宙中移动并做出手势。\n\
  \n在自动翻译和基于 AI 的字幕辅助下，面临语言障碍和听力障碍的用户可以轻松地进行互动。为了实现这些目标，VR 硬件方面还需要有更多创新。\n\n## 6.\
  \ 有望成为一个通用的虚拟目的地\n\n与当今流行的社交媒体平台类似，元宇宙将成为一个我们进行“聚会和见面”的数字目的地。它可能是决定人际动态、人关系和友谊的关键因素。\n\
  \n人们无需从一个地方旅行到另一个地方就能面对面。对于营销人员和品牌而言，他们可以利用元宇宙的优势获得高流量广告。\n\n## 7. 改变人们的生活方式\n\n\
  互联网的出现在过去的几十年里改变了人们的生活方式。与互联网一样，元宇宙具有改变我们生活和职业领域的潜力。\n\n它的功能可以用于社交、工作、游戏、研究、开发等任何领域。其与过程无关（process-agnostic）的特性是元宇宙在未来数字化进程中重要的原因之一。\n\
  \n### 元宇宙将改变未来的生活方式吗？\n\n通过创新，元宇宙可以改变我们在现实世界中互动、购物、工作和创造价值的方式。\n\n### 它允许任何人在线拥有数字财产\n\
  \n未来将会有你可以虚拟拥有的庞大庄园和建筑。这些数字资产作为 `NFT` 运行，可以通过提供房地产的元宇宙平台进行购买。\n\n`The Sandbox`、`Decentraland`\
  \ 和 `Cryptovoxels` 正向那些想要早期投资元宇宙的人提供地块。\n\n### 它将让“边玩边赚”（P2E）概念更流行\n\nP2E 通过提供赚钱机会改变了游戏格局。这种机制增强了构建和设计虚拟世界的趣味性。用户在游戏领域花费时间创建自己的世界，并享受与其他玩家互动的深度沉浸式体验。\n\
  \n元宇宙将增强这些体验，并在游戏过程中提供更多定制和赚钱的机会。由区块链驱动的 `Decentraland` 和 `The Sandbox` 都被视为先进的元宇宙项目。\n\
  \n它们已经允许用户创建自己的 `NFTs` 并出售它们以赚取加密货币，这些货币可以兑换为法币。\n\n### 它将创建一个数字工作基础设施\n\n元宇宙将防止员工在远程办公环境中意外捕捉到没穿裤的样子。它将提供可以自定义的全着服装化身。\n\
  \n`Facebook` 的 `Horizon Workrooms` 是基于 VR 的会议空间的早期示例，允许同事通过个人化身进行互动并讨论工作相关话题。\n\n\
  随着数字基础设施到位，公司可以减少租金支出并获得更好的利润。\n\n### 它将让在线购物更加便利\n\n各大品牌和初创企业将通过自己的元宇宙竞争消费者的注意力。`Amazon`\
  \ 和其他主要零售业务已经提供了广泛的产品和快速交付服务，但它们仍然缺乏获取准确尺寸或像现实生活中一样预览物品等元素。\n\n一家位于印度的电子商务公司 `Lenskart`\
  \ 已经通过允许客户通过摄像头查看每个镜框在脸上的效果来扩大了其服务规模。随着元宇宙的发展，将出现更多新兴的虚拟概念，为全球消费者提供更多便利。\n\n###\
  \ 它为“家庭教育”赋予了新意义\n\n当新冠病毒的威胁令人恐惧时，学校暂时关闭大门以防止致命病毒的传播。这迫使学校管理人员实施了“家庭教育”或“距离学习”。\n\
  \n为了让虚拟环境更有利且更高效，实施了新的沟通和协作方法。一些学校甚至将学习过程游戏化，使其对学习者更有趣。\n\n新兴的数字基础设施和具备技术技能的人力资源是元宇宙中的重要元素，最终可以影响在家中学习的概念。\n\
  \n### 它将改变派对的概念\n\n新冠肺炎肺炎让许多公司能够发挥创意。有了新的应用程序让派对者能够轻松地享受在线活动。\n\n`Instagram`、`Netflix\
  \ Party` 和 `Houseparty` 的新功能也改变了在线派对的想法，尽管它们仍然缺乏现实生活的感和外观。元宇宙旨在通过提供真实的设置来弥补这一差距。\n\
  \n### 它可以通过 VR 导览推动旅游和旅行\n\n当疫情冲击旅游业时，一些公司转回虚拟旅游。例如流行的`希腊`和`埃及` VR 旅游允许游客访问这些国家美丽的旅游胜地。\n\
  \n元宇宙的开发者计划制作旅游应用，将把人们聚集在一起，提供有关景点的信息，并引导游客获得最佳的沉浸式体验。此外，计划重演历史上的重大事件，允许我们可以在不离开家的情况下跨越边界。\n\
  \n### 它将带来更多刺激的冒险\n\n对于寻求肾上腺素飙活动的人来说，元宇宙可以增强平台，允许来自不同地点的朋友一起一起跳伞、赛车或划皮舟。\n\n如果你想去太空旅行但你不像\
  \ `Elon Musk` 那样的亿万富翁，元宇宙将使你的梦想成真。你甚至可以通过访问不同的平台一天进行多次惊险活动。\n\n### 它将变革技术\n\n元宇宙可以改变我们进入和在数字世界中生存所需的技术。由于这个领域是多样化的，因此需要使用各种应用程序来实现无缝的操作和功能。元宇宙将改变我们与计算机的交互，使得在未来在空气中移动手指访问我们的账户成为常态。\n\
  \n在最低层面，元宇宙将像手机和笔记本电脑一样使用内置摄像头。摄像头能够混合现实模式，或通过类似于 `Pokemon Go` 界面的应用程序显示捕捉到的图像。随着元宇宙变得更加完善和先进，需要使用高端手机或笔记本电脑的\
  \ VR 头设备。\n\n## 元宇宙的潜在优点和缺点\n\n元宇宙复杂的机制允许在虚拟宇宙进行协作、沟通、工作创新和社交互动。它看起来是另一个以技术为核心的概念，让我们重新想象和重构未来的世界。\n\
  \n### 优点\n\n1. 它为未来的“元工作”（Metawork）或共享工作场所打开了大门，团队可以在那里设计、实验、更改材料或开发蓝图。\n2. 它允许方便地访问内容和信息。\n\
  3. 它通过允许在视频会议中使用全虚拟化身将远程办公推向新的高度。化身可以像真人一样通过不同的面部表情和肢体语言与同事互动。\n4. 它通过允许用户可视化化并创建解决方案，释放了新的创造力。它使得向客户展示想法或制作产品模型变得简单。\n\
  5. 它是一个无限的空间，鼓励用户开发新想法并与许多人分享。\n6. 它对环境有益，因为它显著减少了研发项目中的材料浪费。\n\n### 缺点\n\n\n\n\n\
  \n1. 它需要卓越的技术和最大的带宽来提供高效、快速的体验。除了北欧和北美地区，全球其他地区的互联网渗透率仍然相对较低。\n\n2. 它需要元宇宙开发者和利益相关者的大投入。VR\
  \ 设备（如头戴设备、全向跑步机和其他配件）的高成本增加了消费者的负担。\n\n设备还应该是符合人体工程学且轻量化的，以实现现实世界的体验。\n\n1. 它需要远程协作的大规模采用。当公司和组织转向远程工作模式时，数字面对面已成为主流，但有些公司尚未准备好采用。\n\
  \n2. 它最可能引起对共享数据和隐私保护的担忧。\n\n## 核心启示\n\n* 元宇宙具有巨大的潜力和收益，无论投资者和用户身在哪里，都带来了新的机会。\n\
  * 元宇宙的去中心化本质和创新功能解决了诸如登录网络和在使用平台前等待授权许可等典型问题。\n* 随着更多大型公司和初创公司加入行列创建元宇宙，竞争仍在继续。\n\
  * 平行世界可以改变我们未来的生活方式，因为现实世界和虚拟世界相互超越并提供功能。\n* 最好考虑元宇宙的优缺点。这将让我们准备好适应元宇宙可能带来的变革性创新。\n\
  \n在元宇宙中，非同质化代币（NFT）或数字资产在让虚拟领域更像物理世界方面起着重要作用。在下一章中了解更多关于 NFT 的知识。\n\n![image](img/chapter_title_corner_decoration_left.png)\
