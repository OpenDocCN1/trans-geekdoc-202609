  \ Games\n\n### 平台\nNakamoto Games 是一个提供加密游戏的 P2E 平台。它拥有多种为玩家和代币投资者带来收益的游戏。其生态系统正在进化以提供一个顶级平台。它很快将推出一系列游戏，开发者可以在那里部署他们的作品，玩家有机会竞争以获得奖励和每周奖池。其引入\
  \ `NAKAverse` 的计划使 Nakamoto Games 进入了进入元宇宙的公司名单。投资者和玩家可以利用其实游戏内经济力量购买土地、建造建筑等。\n\
  \n### 代币\n`NAKA` 是平台的原生代币。对于 Nakamoto Games 的 P2E 生态系统至关重要，因为它提供了进入生态系统的访问权限。该代币是该游戏平台的核心。还可以从每周奖池中获得，排名最高的玩家共享奖励。此外，`NAKA`\
  \ 的持有者还可以参与平台的重大决策。\n\n![image](img/image012.png)NAKA 价值统计（可能会变动）\n\n1 `NAKA`– $0.3042\n\
