  \ |\n| --- | --- | --- |\n![image](img/chapter_title_above.png)\n\n# 元宇宙中区块链、加密货币与\
  \ NFT 的交互相互作用\n\n![image](img/chapter_title_below.png)\n\n“在元宇宙中投资加密货币的最佳方式就是购买\
  \ NFT。”—— 毛世星（又名 讨论鱼），COBO 创始人兼首席执行官\n\n如前文所述，元宇宙是一个由区块链技术驱动的虚拟世界，那里发生着无限的可能。我们可以在那里建立业务并获取收入流、创建虚拟资产、将艺术技能变现、玩游戏、参加或举办社交活动，以及更多可能。\n\
  \n它是一个增强的维度或现实，我们可以在其中过上自主的生活。为了购买虚拟世界中的一切，需要加密货币。加密货币的类型取决于特定的元宇宙。\n\n––––––––\n\
  \n![image](img/scene_break.png)\n![image](img/image008.png)\n\n## 章节总结\n\n*   区块链、加密货币和\
  \ NFT 如何融入元宇宙？\n*   元宇宙 NFT 交互的结果\n*   NFT 与元宇宙的未来\n*   核心要点总结\n\n## 区块链、加密货币和 NFT\
  \ 如何融入元宇宙？\n\n### A. 加密货币\n\n加密货币将在元宇宙中发挥着至关重要的作用。它是元宇宙的货币。每个元宇宙都将拥有自己的加密币或代币，我们可以用它们支付数字和实体物品。\n\
  \n加密货币的独特性是连接物理世界和虚拟世界的关键纽带。加密货币帮助我们以法货币计算数字资产的价值，以及随时间推移的利润和投资回报率（ROI）。\n\n它具有涵盖各个方面的关键特征：数字所有权证明、可访问性、价值转移和治理。\n\
  \n*   一种安全的方式展示我们在元宇宙中购买的虚拟物品的所有权\n*   安全地从一个用户转移到另一个用户\n*   在元宇宙平台决策中的投票权\n*  \
  \ 交易所的流动性，允许投资者和交易员向全球买家出售加密币和 NFT\n\n### B. 区块链\n\n区块链具有去中心化的特性，提供了交易透明度。它的核心元素符合元宇宙的概念。\n\
  \n*   它提供了数字所有权证明。通过购买加密钱包和加密货币，你成为了存储在区块链上的资产的所有者。\n*   它允许实体物品的数字化收藏性。\n*   它通过投票权代表治理。用户有机会控制平台的治理规则和其他主要活动。\n\
  *   它提供了在全球范围内进行价值的安全转移。\n*   它更具访问性，且不需要银行要求的身份证明。\n*   它具有互操作性，允许多个平台之间针对特定项目或活动进行无缝交互和兼容。\n\
  \n`Ethereum` 区块链被作者用作开发平台来创建自己的元宇宙。`SAND` (Sandbox) 和 `MANA` (Decentraland) 等 `ERC20`\
  \ 代币由 `Ethereum` 支持以扩展其业务或确认交易。\n\n此外，大多数 NFT 都可以用 `ETH` 币购买。从本质上讲，`Ethereum` 是\
  \ NFT、加密货币代币和元宇宙相互连接的驱动力。\n\n### C. 非同质化代币 (NFT)\n\n元宇宙中的每个元素都是基于 NFT 的，从最小的物品到最大的资产。非同质化代币将所有实体和价值之数字化的能力，是元宇宙开发的一个重大事项。NFT\
  \ 在元宇宙诞生中的这种独特能力，解释了投资者对将数字资产添加到财务组合中的兴趣日益增长。\n\nNFT 曾是一个在艺术和收藏领域具有巨大游戏规则改变潜力的模糊概念，当它进入主流时，其惊人的速度令人着迷。人们认为它们只是数字形式的文物或艺术品的常见误解已被其在元宇宙中潜力的信念所取代。\n\
  \n但在它们流行之前，加密领域之外的大多数人并没有重视 NFT。现在，名人、收藏家和不同行业的知名人物已经接受了非同质化代币。\n\nNFT 的未来将为许多投资者、爱好者和企业家开启机会之门。行业专家正关注\
  \ NFT 进入元宇宙并定义其存在的能力。\n\n元宇宙 NFT 的交互被认为是区块链领域的一个显著亮点。它是新数字生态系统中的关键组件。通过使用 NFT 可以访问元宇宙中的项目。元宇宙的互操作性、多功能性和扩展性允许包括\
  \ NFT 在内的创新技术的融合。\n\nNFT 在区块链游戏中的成功显而易见，具有互操作的游戏可以加速元宇宙的发展。NFT 有助于通过使用数字头像关联现实世界的身份并访问元宇宙。\n\
  \n随着互操作的 NFT 资产和以区块链为骨干，元宇宙空间的实现在我们物理世界中指日可待。\n\n然而，NFT 还需要克服几个障碍以确保成功的大普及。此外，区块链基础设施的开发者应该继续扩大这些数字代币的使用，同时不损害环境的安全。\n\
  \n在元宇宙开发过程中还有一些需要考虑的事情。\n\n*   金融监管机构可能会对如何处理数字代币或 NFT 制定明确规则。\n*   如果未来发生此类问题，法院可能会就\
  \ NFT 版权纠纷做出判例法。\n\n\n\n\n\n## 它将开启通往透明公平经济的道路。\n\n元宇宙带来了去中心化的环境，这使得互操作的区块链游戏与现实世界资产同步成为可能。例如，边玩边赚（`P2E`）游戏为用户提供了资产的完全控制权和所有权，确保了公平的游戏体验。在游戏中使用\
  \ `NFTs` 可以增加获利机会并提升对元宇宙的参与度。\n\n`Aavegotchhi` 和 `Axie Infinity` 采用边玩边赚（`P2E`）模式，创造了一个全新的虚拟经济，玩家将获得游戏内加密货币和\
  \ `NFTs` 等资产。\n\n`Battle Racer` 发布 `NFT` 汽车零件，用户可以购买这些零件来制造或升级车辆，或在二级市场上进行出售。\n\n\
  此外，边玩边赚公会会推动元宇宙 `NFT` 相互作用的快速增长，因为它们充当了购买游戏土地、资产和其他资源的中间人。这些游戏公会通过贷款物业和资产，为资金不足的玩家提供了先发优势。\n\
  \n这让玩家能够在不同的元宇宙中赚收益。游戏公会获得玩家收益的一小部分。这种方法在利用 `NFTs` 力量的同时，建立了一个开放公平的元宇宙经济，因为每个人都可以参与并盈利。\n\
  \n- `reNFT` 允许用户出借或租赁 `NFTs`。出借者设置最长期和每日利率，该利率在 `0.002` 到 `2` `WETH`（封装以太坊）之间平均。\n\
  \n- 若干卡牌交易游戏提供 `NFT` 卡片供玩家增加胜率。包括租赁价格和优选期限的租赁协议由智能合约管理。\n\n这种公平经济的概念通过区块链的不可篡改性和透明性得到了优化。元宇宙的用户还可以在支持\
  \ `NFTs` 的市场上出售他们的房地产或游戏收藏品等 `NFT` 资产，而没有任何任何问题。\n\n人为价值通胀的可能性也不存在。然而，供需法则仍然会影响\
  \ `NFT` 的稀缺性和链上价值。\n\n## 它将带来新的房地产趋势。\n\n元宇宙承诺提供具有房地产属性虚拟空间。在区块链技术和 `NFTs` 的帮助下，用户可以获得资产的所有权，并通过构建虚拟结构来开发社区。\n\
  \n出售元宇宙土地是利润丰厚的 `NFT` 元宇宙项目之一。未来，`NFT` 持有者可能在元宇宙中拥有一个物业，用于展示自己的收藏品或将其租赁以获利。\n\n\
  - 出借和租赁 `NFTs` 以获得被动收入。可以通过元宇宙中的 `DeFi`（去中心化金融）平台或 `PARSIQ` 的 `IQ Protocol` 实现。`IQ\
  \ Protocol` 允许虚拟房地产所有者从用户那里产生租金和收益费用。\n\n- `NFT` 创作者在资产出售或转售时可以获得一定比例的销售费用以及剩余分红。当代表资产的\
  \ `NFT` 用于比赛、活动和需要门票费或质押的活动时，这种机制就会发挥作用。\n\n## 它将提升元宇宙中的 NFT 投资水平。\n\n2021 年，非同质化代币的总支出超过\
  \ 126 亿美元。那些购买了产生收益的 `NFTs` 的人利用了其投资的最佳潜力。\n\n在元宇宙中，持有者可以通过以下方式做更多事情并享受更多收益：\n\n\
  - **产生收益的 NFTs**：投资者将通过支持元宇宙项目享受被动回报。代币持有者将获得产生剩余收入的治理代币。\n\n目前，已经有一些系列提供激励措施。`Genesis\
  \ Cyber Kongz` 计划在未来十年内每天发行十个 `$Banana` 代币。其他例子包括带有 `$FISH` 的 `Mutant Cats` 和带有\
  \ `$VOLT` 的 `SupDucks`。\n\n- **NFT 版税**：每当创作者的作品在二级市场发生所有权变更时，他们都能获得销售价格的定比例。驱动代币的底层技术允许艺术家设置版税。一旦预定，智能合约将自动执行协议，包括版税的分配。\n\
  \n- **NFT 驱动的收益率耕矿**：这意味着利用 `DeFi` 协议使用 `NFT` 驱动的资产进行收益挖矿。一个例子是使用流动性提供者的 `ERC-721`\
  \ (`LP-NFT`) 代币作为另一个收益生成协议的抵押品或质押。这使得 `NFT` 所有者能够获得额外的收益。\n\n- **嵌套 NFT (Nested\
  \ NFTs)**：这种数字资产为收藏品提供了更多内在价值。它通过将投机性投资转化为产生收益的资产来运作。嵌套 `NFTs` 是分层代币，充当数字篮子持有多个基于\
  \ `ERC` 的代币。在元宇宙中，它们为数字物品增加了新功能和定制特性。\n\n- **质押**：另一种从 `NFT` 系列中创建被动收入的方法是通过质押。这意味着将资产锁定在去中心化金融或\
  \ `DeFi` 协议智能合约中，以特定代币、投票权或治理的形式换奖励。促进非同质化代币质押的平台有 `Spliterlands`、`Kira Network`、`Only1`\
  \ 和 `NFTX`。\n\n## 它将解锁真正的资产所有权。\n\n`NFT` 和区块链驱动的元宇宙提供了土地、房地产、数字服装、头像和其他项目的真实所有权。它允许所有者在不同平台之间迁移和使用他们的代币。\n\
  \n它强调了数字资产的互操作性，而目前的趋势是用户只能在一个平台或游戏网站上使用购买的虚拟物品。统一因素可以是单一登录功能或允许用户访问 `NFTs` 的特定加密钱包。\n\
  \n非同质化代币是元宇宙未来经济的枢纽。它们实现了财产、身份和认证。每个 `NFT` 的加密密钥确保了所有权的安全性。这两个因素对于元宇宙社会至关重要。\n\n\
  “NFTs 起初是从数字艺术领域开始的。但它将变得强大得多……所以应用前景是巨大的，”Crypto.com 首席官 Eric Anziani 说道。\n\n元宇宙的经济和社会体验由两个元素驱动：内容的发行和土地所有权。`NFTs`\
  \ 实现了元宇宙中的房地产交易。\n\n“由于智能合约的定义方式和 NFT 的编程方式，元宇宙物业权无法伪造，”Anziani 补充道。\n\n# NFT 与元宇宙的未来\n\
  \n随着非同质化代币的使用场景不断扩大，它们预示着虚拟世界新纪元的到来——元宇宙。Facebook 改名并更名为 Meta 标志着向基于 `NFT` 的增强现实转型。\n\
  \n游戏和技术平台现有的元宇宙原型已经让我们窥见了未来。\n\n## 1. 从带来乐趣变为投资工具\n\n`NFT` 游戏广受欢迎，玩家通过购买加密货币或代币来升级他们的游戏。\n\
  \n\n\n\n\n根据个人理财大师 Humphrey Yang 的说法，“这本质上是赌博，但人们并真的不知道其中的区别，他们购买是因为这很有趣。”他认为，购买非同质化代币（NFT）相比购买加密货币风险更大，因为这就像是在对虚拟货币下注。\n\
  \n作者兼加密货币播客主持人 Laura Shin 表示，她出于情感而购买了一个与音乐相关的 NFT，而不是出于投资目的。“当里昂王乐队（Kings of Leon）的\
  \ NFT 发布时我买下了，因为我热爱加密货币，也热爱里昂王乐队。”\n\n## 2. 让你成为专属所有者群体的有价值资产\n\n谁不想与那些为了抢购 NFT\
  \ 收藏品而疯狂购买的富豪名流联系在一起呢？\n\n2021 年是 `Bitcoin` 和 `Ethereum` 的牛市年。新投资者购买了这些热门加密货币的份额，并开始探索与加密相关的替代投资，例如基于\
  \ `Ethereum` 的 NFT。突然之间，这种数字资产自 2014 年诞生以来一直不怎么为人知的概念，已变成原创作品和独特纪念品变现的新媒介。\n\n一个经典的例子是`无聊猿游俱乐部`（Bored\
  \ Ape Yacht Club），其发行数量有限，约为 10,000 个。`Stephen Curry`（史蒂芬·库里）买了一个，`Jimmy Fallon`\
  \ 有了一个，`Paris Hilton`（帕丽·希尔顿）也买了一个。如果你买了一个，你就属于同一个群体，这从社会角度来看让这些 NFT 更加珍贵。\n\nYang\
  \ 补充道：“这就像一张入场券，所以价值实际上来自于他人对它的估值。”\n\n## 3. NFT 在元宇宙中的无限制演变\n\n虽然一些专家认为 NFT 是“泡沫”或“仅仅是时尚潮流”，但许多人声称它们将持久存在。Laura\
  \ Shin 认为，2022 年及以后会有更多 NFT 主流应用，而 `Metaverse` 正在缓慢构建基础技术结构。“它们绝对会留在这里。”\n\n赋予 NFT\
  \ 力量的并非 NFT 本，而是背后的技术。NFT 的真实价值由`blockchain`上的`smart contracts` 定义，这正是赋能并保护加密货币的同样创新技术。\n\
  \n### 要点总结\n\n- NFT 完美契合 `Metaverse` 的生态系统。\n- 人们对非同质化代币（NFTs）进入 `Metaverse` 日益增长的兴趣将导致这一未来平台的快速发展和扩张。\n\
  - 在 `Metaverse` 中创建业务、交易业务和变现技能的机会通过 NFT 实现。\n- `Metaverse` 中的 NFT 代表了所获得的原始资产和收藏品的所有权。它们营销了\
  \ `Metaverse` 中的属性。\n- `Metaverse` 将推动 NFT 的普及。另一方面，NFT 将桥接数字与物理世界之间的差距。\n- `Blockchain`\
  \ 的`smart contracts` 为 NFT 提供了优势。\n\n当 `Blockchain` 和 `Crypto` 在转折点相遇时，`Metaverse`\
  \ 将消除所有关于 NFT 仅仅是投机性加密噱头的怀疑。非同质化代币将成为虚拟和现实生活的一部分。可能性将是无限的，NFT 周期的下一个阶段将开始。\n\n![image](img/chapter_title_corner_decoration_left.png)\
