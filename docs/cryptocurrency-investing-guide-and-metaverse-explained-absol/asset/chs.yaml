  \ | --- |\n\n![image](img/chapter_title_above.png)\n\n# 第 5 章\n\n![image](img/chapter_title_below.png)\n\
  \n![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n# 元宇宙投资指南：你会是下一个百万富翁吗？\n\
  \n![image](img/chapter_title_below.png)\n\n“这种现象可能在十年后出现，但它有潜力颠覆人类生活中几乎的一切。”- Jefferies，投资银行公司\n\
  \n当前争夺市场主的竞争是亿万富翁为了主导未来 `Metaverse` 战斗的一部分。当 `Mark Zuckerberg` 更改其社交媒体帝国母公司的名称时，一些人指责他转移了对\
  \ `Facebook` 政治风波的注意力。一些批评家认为他是一个追逐童年幻想的科技亿万富翁，就像 `Tesla` 的 `Elon Musk` 和迷恋太空火箭的\
  \ `Amazon` 的 `Jeff Bezos` 一样。\n\n然而，他参与 `Metaverse` 开发的前所未有的举吸引了投资者的兴趣。这使得该平台的股价上涨了超过\
  \ 9%，是 `Nasdaq` 涨幅的两倍。人们积极搜索 `Google` 以理解这些术语及其潜在收益。\n\n即使著名的经纪商 `Bernstein` 也预测，当平行宇宙变为现实时，`Metaverse`\
  \ 可以颠覆主要市场，年收入潜力达 2 万亿美元。大型科技公司正在缓慢追随 `Zucker` 的足迹。没有人不想错过这种乐趣和利润。即使 `Disney` 也正根据\
  \ 2021 年 11 月 13 日 `EPIK` 的推文通过 `Disney Metaverse` 加入。\n\n![image](img/image015.png)\n\
  \n## 章节总结\n\n- 传统工作会发生什么？\n- 元宇宙中的可用工作\n- 从元宇宙赚钱的创意方式\n- 为什么元宇宙被认为是一项丰丰的投资？\n- 如何投资元宇宙？\n\
  - 开始投资元宇宙的通用步骤\n- 注意事项\n- 要点总结\n\nArtWallet 顾问 `Dmitry Budorin` 说，“任何构建 `VR/AR`\
  \ 技术的公司（如 Magic Leap、HTC Vive、Varjo）都是元宇宙公司。”\n\n他补充道，通过 NFT 等数字资产融合物理和虚拟世界的公司可以归类为元宇宙开发者。其中包括创造促智产品、进行生物黑客行为以及研究改变大脑化学领域的人。\n\
  \n## 传统工作会发生什么？\n\n`Metaverse` 旨在将生活的各个方面融合在一个领域内。居家办公的人可以在 3D 办公室中互动。提供传统工作的公司可以利用\
  \ `Metaverse` 平台进行会议、演示和其他任务。\n\n还会有提供稳定收入的元宇宙相关工作。虽然 P2E 游戏模式和各种在线工作已经为全球各地的人提供了稳定收入，但\
  \ `Metaverse` 可以提供更多。\n\n## 元宇宙中的可用工作\n\n- 数字时尚设计师：他们可以在不需要实际购买或使用材料的情况下进行设计。\n\
  - 医疗专业人员：他们可以检查数字孪生以克服受伤或疾病。\n- 智能合约律师：处理涉及 `blockchain` 技术和新方法确保合法性的元宇宙交易。\n- 元宇宙建筑师：负责构建元宇宙中的元素，如物体、场所或体验。这需要专家开发人员、设计师和创意人员。\n\
  - 导游：负责引导新用户或游客参观元宇宙中发现的奇妙场所。\n\n`Metaverse` 中 `Metawork` 的未来仍然未知。然而，当前的疫情让我们在办公室办公、远程办公或混合办公模式之间选择，让我们窥见了未来的一角。\n\
  \n## 从元宇宙赚钱的创意方式\n\n### 1. 创建非同质化代币（NFT）\n\n`Metaverse` 为所有想要变现才华和技能的创作者开启了大门。你可以将你的作品转化为数字资产并在多个市场上提供。由于\
  \ `Metaverse` 将高度依赖化身、收藏卡、设备、结构等数字物品，因此有很多机会出售你的原创作品。\n\n\n\n\n\n其他人可以通过销售创作者制作的物品来获取抽成，或者成为经纪人、开设\
  \ NFT 画廊或为他人提供关于元宇宙的建议。\n\n### 2. 运营电子商务业务\n\n元宇宙对于想要在数字世界中开设商店的创业者来说是完美的选择。在虚拟世界启动创业比在物理世界更容易，因为物理世界的经常性开支可能非常高昂。为你的数字产品创建一个商店并将其出售给潜在客户。利用社交媒体的力量在虚拟领域为你的业务做广告。\n\
  \n### 3. 从事虚拟工作\n\n市场对虚拟工作者的需求很大，例如虚拟现实架构师、3D 艺术家、时尚设计师、App 开发者、编码员、图形艺术家、社区经理和内容创作者。你可以以自由职业者的身份工作，也可以为运营元宇宙平台的公司工作。\n\
  \n### 4. 加入广告行业 \n\n元宇宙将成为下一代社交媒体平台，创业者和数字创作者将在那里推销他们的服务和商品。这些人将寻找方法建立品牌意识并与目标受众建立联系。\n\
  \n品牌和和服务公司将涌向元宇宙，让自己的虚拟形象深入人心。随着越来越多的创业者开设虚拟商店和购物中心，将产生巨大的广告需求。这将使元宇宙变成一个卓越的广告和营销场所。\n\
  \n### 5. 设计时尚服装\n\n预计 Gucci 和 Louis Vuitton 等高端时尚公司将参与到元宇宙中提供虚拟服装 NFT 中。你不需要为时装公司工作来销售自己的作品。你可以构思原创、富有创意的设计并在网上出售它们。\n\
  \n### 6. 提供教程或导师服务\n\n你可以在元宇宙中提供虚拟教程或技能提升。如果你是一名专业艺术家或导师，开一所在线学校是一个好主意。\n\n### 7.\
  \ 成为旅行社代理\n\n元宇宙将拥有热门物理目的地的虚拟对应物，从而产生旅游部门的职业，如旅行社代理和导游。\n\n### 8. 成为元宇宙产品测试员\n\n\
  随着虚拟产品的流行，将会会有职位留给能够测试并对其提供反馈的人。\n\n### 9. 举办活动和促销活动 \n\n元宇宙将拥有热门物理目的地的虚拟对应物，从而产生旅游部门的职业，如旅行社代理和导游。\n\
  \n### 10. 推广你的社交媒体\n\n元宇宙将成为下一代社交媒体平台，创业者和数字创作者将在那里推销他们的服务和商品。这些人将寻找方法建立品牌意识并与目标受众建立联系。\n\
  \n## 为什么考虑元宇宙？\n\n品牌和服务公司将涌向元宇宙，让自己的虚拟形象深入人心。随着越来越多的创业者开设虚拟商店和购物中心，将产生巨大的广告需求。这将使元宇宙变成一个卓越的广告和营销场所。\n\
  \n虚拟产品的流行意味着将会会有职位留给能够测试并对其提供反馈的人。\n\n元宇宙将拥有热门物理目的地的虚拟对应物，从而产生旅游部门的职业，如旅行社代理和导游。\n\
  \n## 如何投资元宇宙\n\n### 直接投资\n\n#### 投资 NFT\n预计 Gucci 和 Louis Vuitton 等高端时尚公司将参与到元宇宙中提供虚拟服装\
  \ NFT 中。你不需要为时装公司工作来销售自己的作品。你可以构思原创、富有创意的设计并在网上出售它们。\n\n#### 投资加密货币项目\n随着虚拟产品的流行，将会会有职位留给能够测试并对其提供反馈的人。\n\
  \n#### 投资平台\n元宇宙将拥有热门物理目的地的虚拟对应物，从而产生旅游部门的职业，如旅行社代理和导游。\n\n### 间接投资\n\n#### 投资元宇宙相关股票\n\
  品牌和服务公司将涌向元宇宙，让自己的虚拟形象深入人心。随着越来越多的创业者开设虚拟商店和购物中心，将产生巨大的广告需求。\n\n#### 投资 MVI（元宇宙指数）\n\
  元宇宙将成为下一代社交媒体平台，创业者和数字创作者将在那里推销他们的服务和商品。\n\n#### 投资长期趋势\n元宇宙对于想要在数字世界中开设商店的创业者来说是完美的选择。在虚拟世界启动创业比在物理世界更容易，因为物理世界的经常性开支可能非常高昂。\n\
  \n### 投资元宇宙的基础步骤\n\n步骤 1：在你偏好的平台上开设账户。\n步骤 2：创建数字钱包。\n步骤 3：进行购买并支付。\n\n\n\n\n\n\
  虽然投资元宇宙的收益具有无限的可能，但如果公司未能实现其目标和预期，也存在导致损失的巨大风险。作为投资者，你需要选择那些能够履行承诺的稳健公司。\n\n对于小型玩家、初创公司和品牌创作者来说，寻找能够帮助他们进行导航、利用和转型业务的供应商至关重要。\n\
  \n以下是一些考虑的提示：\n\n### 研究\n投资元宇宙远不止尝试佩戴新 VR 头显进入像游戏那样的虚拟空间的体验。它需要对优缺点进行仔细的研究和学习。研究可以让你洞察如何利用元宇宙及其特性。\n\
  \n你可以通过区块链和去中心化来解锁新的投资方法，或改进数字身份管理。利用其虚拟现实等特性，将帮助你设计和构建沉浸式体验或社交社区。\n\n### 检查供应商的专业知识\n\
  与正确的供应商合作将帮助你将业务提升到层次。它应该帮助你利用所需的技术解决你所在领域中的特定问题。软件或硬件提供的隐私和安全问题同样重要。\n\n### 谨慎且明智\n\
  在元宇宙项目中，代币价格在开发早期相对较低。它可能只有 1 美分或不到 1 美元，因此是个人投资者开始投资的好机会。但请记住，并非所有项目都能给你带来投资回报，所以请务必保持谨慎。\n\
  \n不要把所有的鸡蛋放在同一个投资篮子里。平台的原生代币表现良好或有其他投资者的强力支持也是重要的。\n\n### 要点\n* 了解元宇宙投资就像任何其他类型的投资一样，涉及输赢。学习基础知识并研究提供投资机会的公司至关重要。\n\
  * 投资元宇宙有多种方法——直接或间接。在决定之前更加熟悉这些选项。\n* 警惕元宇宙投资中的红旗和风险。始终遵循投资规则——研究、检查公司背景，永远不要将所有的鸡蛋放在同一个投资篮子里。\n\
  * 了解元宇宙投资的逐步指南以及如何选择最佳的元宇宙项目。\n\n你是否有足够的勇气将辛苦赚的钱投资到元宇宙？由于其民主化的本质，投资这个技术项目既简单又方便。任何人都可以购买\
  \ `NFTs`、`tokens` 或 `crypto assets`，因为没有最低准入门槛或地理障碍。\n\n![image](img/chapter_title_corner_decoration_left.png)\
