  \n# 14. Metahero\n\n### 平台\n\n`Metahero` 设计为一种软件，允许用户扫描身体并将其转换为非同质化代币或 `NFT`。以这种形式，它可以作为个人化身在元宇宙平台中使用。它是行业内的首创，因为它促进了元扫描（met-scanning）或通过扫描实现对象的真实转换。\n\
  \n该元宇宙平台于 2021 年 6 月上市，初始资金为 1000 万美元。`Metahero` 利用 3D 技术创建虚拟产品和化身，旨在通过缩小物理与虚拟生态系统之间的差距来促进平行世界的演变。其长期计划之一是在全球范围内安装\
  \ 12 个 3D 扫描室。\n\n这将每天允许超过 100,000 个物体或人物通过扫描生成真实的化身。\n\n该公司由 `Robert Gryn` ，他是一位初创经理和连续科技创业者，曾在欧洲建立过几家快速发展的公司。他的合伙人是\
  \ `Piotr Harwas`，他是 `Wolf Studios` 的 CEO，曾是科技初创公司成功的背后。该公司是全球最大的 3D 扫描仪供应商之一。\n\n\
  `Metahero` 的另一个项目是 `Everdome`，它允许 `HERO` 代币持有者在购买 `Everdone Metaverse` 的土地时获得折扣。它与\
  \ `HEROSwap`（提供代币交易的去中心化加密交易所）以及帮助用户控制加密资金的 `HERO App` 相关。\n\n### 代币\n\n`HERO` 是生态系统的原生货币。用户使用这种元宇宙代币支付平台上所有的体验，如\
  \ `NFT` 销售、授权和扫描。通过 `HERO`，游戏、艺术家和企业家之间将产生更多联系，因为代币的业务应用横跨了艺术和社交媒体。总体而言，该代币的最大供应量为\
  \ 100 亿。\n\n其中 20%（20 亿）锁定在流动性池中，10%（10 亿）将在公售出售，10%（10 亿）私募出售，10%（10 亿）作为公司储备，30%（30\
  \ 亿）将用于营销、战略规划和交易所上市。剩余 20%（20 亿）预留给 `Metahero` 团队和顾问。\n\n全球全球超过 27 亿名玩家，`HERO`\
  \ 的价值在上市五个月后增长到 $0.2518。购买 `META` 的顶级加密交易所有 `CoinTiger`、`Gate.io`、`BingX`、`Bybit`\
  \ 和 `KuCoin`。\n\n#### HERO 价值统计数据（*可能会变化*）\n\n1 `HERO`– $ 0.03329\n\n1 `HERO`– 0.0000008226\
