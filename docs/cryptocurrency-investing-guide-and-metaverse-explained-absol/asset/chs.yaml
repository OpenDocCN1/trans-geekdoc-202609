  \ ETH\n市值 - $ 2560 万美元\n完全稀释市值 - $ 5160 万美元\n流通量 – 4.96 亿 `MOOV`\n––––––––\n\n##\
  \ Polychain Monsters\n\n### 平台\nPolychain Monsters 是一款元宇宙加密游戏，其特点是受宝可梦启发的 Polymons。它们是动画艺术的非同质化代币（NFT）生物。对于宝可梦粉丝来说，这个游戏为你准备的。它于\
  \ 2021 年第一季度 NFT 热潮期间推出。\n\n凭借现代技术与 90 年代流行卡片怀旧感的完美结合，Polymon Monsters 成功地在加密领域占据了一席。它还获得了包括\
  \ `Morningstar Ventures` 和 `Moonrock Capital` 在内的 6 大主要投资者的支持和 74 万美元资金。\n\n该项目的开发者将揭示其他有趣的功能以提升用户的游戏体验，包括对\
  \ `Polkadot` 的跨链支持。\n\n### 代币\n用户可以使用平台原生代币 `PMON` 购买 Polychain Monster 的 NFT 包。如果你足够幸运，就能获得包中包含的稀有\
  \ Polymon。`PMON` 是该平台的原生货币，你可以在 `Gate.io`、`MEXC`、`LBank`、`PancakeSwap`、`SushiSwap`\
  \ 等处购买此代币。\n\n![image](img/image007.png)PMON 价值统计（可能会变动）\n\n1 `PMON`– $3.77\n1 `PMON`–\
  \ 0.00009302 Bitcoin\n1 `PMON` – 0.001255 ETH\n市值 - $ 1260 万美元\n完全稀释市值 - $ 3450\
  \ 万美元\n流通量 – 340 万 `PMON`\n––––––––\n\n## Mogul Productions\n\n### 平台\nMogul Productions\
  \ 于 2021 年 4 月推出，并成为 NFT 的 DeFi（去中心化金融）平台。这个元宇宙项目为电影制作人和娱乐专业人士提供启动器，他们通过连接创作者和电影粉丝来获取资金。\n\
  \n平台用户可以提交电影脚本并有机会将其制作成电影。它还通过 `STARS` 奖励对各种体验的参与和互动。有一个不断发展的 Mogul 社区由电影爱好者组成。\n\
  \nMogul 社区不断壮大，其成员包括电影导演、编剧、演员和制片人。该项目的卖点是与 `Chainlink`、`ApeSwap`、`Polygon`、`CEEK`\
  \ 等大牌建立合作伙伴关系。\n\n### 代币\n其实用性货币被称为 `STARS`，它对 Mogul 的 P2E 生态系统至关重要，因为它允许用户购买 NFT\
  \ 并参与活动。它在 `PancakeSwap`、`Uniswap (V2)`、`MEXC`、`LATOKEN`、`Decoin` 等处可用。\n\n––––––\n\
