  \n### 平台\n\n`Highstreet` 是一个允许玩家在元宇宙中探索、战斗怪兽并完成任务的平台。使用其原生代币 `HIGH`，你可以在平台市场以及集成到游戏中的\
  \ `Shopify` 商店购买数字物品。用户还可以获取游戏内数字物品并将其兑换为商品。\n\n除了 `HIGH`，它还有另一种名为 `STREET` 的代币，可以在完成游戏任务后获得。是一种实用代币，可以支付旅行票和酒店住宿、购买武器和盔甲，或促进游戏交易。平台上所有的\
  \ NFT 都分为部分。\n\n它由 `Jenny Gou` 和 `Travis Wu` 创立。`Gou` 是一位获奖的虚拟现实电影制作人、企业家和艺术收藏家。`Wu`\
