  \n## 2. Ontology\n\n### 平台\n`Ontology` 是一个于 2017 年推出的中国本土元宇宙项目。它由李俊创立，目标是创建一个提供安全访问\
  \ Web 3.0 的基础设施。这种低成本、高速的公链每秒可以处理高达 4,000 笔交易，在某些测试环境中可以达到 12,000 笔交易。\n\n在托管能力方面，行业专家认为它可能是最好的区块链网络之一。它为企业创建自己的区块链提供了灵活性，允许他们对其进行定制，以匹配其目标和需求。它是完全去中心化的，并且高度抵御黑客攻击。\n\
