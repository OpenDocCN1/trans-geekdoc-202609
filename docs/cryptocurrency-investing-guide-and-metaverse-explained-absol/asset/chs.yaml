  \ | --- |\n\n# 策略 5-利用房地产机会\n\n“存在巨大的风险，但也有巨大的回报。”—— Jannie Yorio，Republic 首席\n\n\
  虚拟房地产将迎来爆发，土地将以数百万美元出售。元宇宙土地是一项丰丰的长期投资，将为你带来稳定的被动收入流。此外，物业价值还会增长，你可以高于投资价卖出。\n\n\
  ## 章节总结\n\n* 在元宇宙房地产中赚钱的方法\n* 如何在元宇宙购买土地？\n* 核心总结\n\n2021 年，“四大”Decentraland、Sandbox、Somnium\
  \ 和 Cryptovoxels 的房地产销售额达到 5.02 亿美元。预计 2022 年及以后数字将会更大。\n\n## 在元宇宙房地产中赚钱的方法\n\n\
  对于对房地产工作感兴趣的人，以下是很好的机会。\n\n### 经纪\n房地产公司需要更多经纪人来处理出售或租赁的物业。通过连接买卖双方，你可以赚取丰厚的佣金。另一种方法是作为专业的房地产经纪提供咨询或建议。\n\
  \n### 炒卖\n你可以购买土地和数字物业，然后将其出售给想要拥有元宇宙数字土地的人。成为房东可以让你定期的被动收入。\n\n#### 物业管理\n如果你有管理他人物业的经验，可以通过成为虚拟物业经理来变现你的知识。你也可以申请成为土地、建筑或娱乐场所的管理员。\n\
  \n### 出租物业\n就像在物理世界一样，出租你的房屋或土地块可以带来收入。如果你的虚拟物业位于高流量区域，可以将其用于广告目的。你可以创建虚拟购物中心、赌场、精品店、酒店和其他娱乐中心。\n\
  \n通过向人们收费或出售数字商品或服务获利。你也可以出售或租赁建筑的一部分、广告位或收取门票。\n\n\n\n\n\n元宇宙中最利润丰厚的职业之一是 3D 设计。数字世界需要创意的人才，他们通过创建结构来构思并赋予土地生命力。\n\
  \n如果你是一名专业设计师或平面艺术家，加入公司或提供自由职业服务都是一个不错的选择。\n\n## 投资房地产\nMREIT 或元宇宙房地产投资信托（MetaSpace\
  \ Real Estate Investment Trust）为人们提供了投资元宇宙中盈利房地产的机会。就像传统的信托一样，你可以购买他们项目的股份。\n\n\
  ––––––––\n\n![image](img/scene_break.png)\n\n## 如何在元宇宙中购买土地\n* **步骤 1**：设置一个数字钱包来存放你的加密货币。\n\
  * **步骤 2**：选择你想要购买房产的平台。\n* **步骤 3**：出出价并完成交易。\n\n## 核心要点\n* 元宇宙中的房地产有望带来良好的投资回报。\n\
  * 虚拟土地提供了大量的收益的机会。\n\n| ![image](img/chapter_title_corner_decoration_left.png) ||\
