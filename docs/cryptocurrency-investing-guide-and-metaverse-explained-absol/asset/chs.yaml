  \n### 代币\n`WAXP` 是 `WAX` 的代币，可以转换为该平台的 `WAXE`（ERC-20 实用代币）。代币经济的参与者必须销毁其 `WAXP`\
  \ 来获得 `WAXE`。\n\n`WAXE` 代币用于质押。通过这些代币，用户可以获得 `WAG`（网络治理代币）并享有对提案进行投票的权利。`WAXP` 在\
  \ Binance、Bithumb、Bitfines、Crypto.com、HitBTC 和 Huobi Global 可用。\n\n**WAXP 价值统计**（*可能会变动）\n\
