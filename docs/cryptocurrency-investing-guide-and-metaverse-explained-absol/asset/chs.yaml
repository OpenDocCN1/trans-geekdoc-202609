  \ 驱动，允许用户体验实时且电影级的环境。游戏拥有丰富的星系供开发和探索。它是一个角色扮演游戏，参与者可以在其中创建收入流并挖掘数字资源。在游戏内获得的资产代币（此处应为资产）可以兑换为法币。`Star\
  \ Atlas` 的独特之处在于它能够提供多种类型，为元宇宙带来了更具沉浸感的体验。\n\n它同时提供了探索和与其他玩家建立联盟的选项，与其他玩家战斗以获得数字资产，或通过质押代币获利。`Star\
  \ Atlas` 另一种代币- `POLIS`，作为平台的治理代币。\n\n### 代币\n\n`ATLAS` 是 `Star Atlas` 的元宇宙代币。它的最大供应量为\
