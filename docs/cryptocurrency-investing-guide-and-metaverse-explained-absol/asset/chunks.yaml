  trans: '

    `MyNeighborAlice` 是一个元宇宙游戏和社交平台。该项目以岛屿为主题，用户可以在这里收集 `NFTs`、购买虚拟岛并结识朋友。为了体验这些内容，你需要使用该平台的代币
    `ALICE` 购买土地块。在改善土地、添加结构和植被或购买游戏内资产时，也需要这种加密货币。


    ### 代币


    其元宇宙代币 `ALICE` 可用于质押，是牛市期间表现最佳的加密货币之一。其目前的市值超过 4 亿美元。


    #### ALICE 价值率统计数据（*可能会变化*）


    1 `ALICE`– $ 6.21


    1 `ALICE`– 0.0001531 `Bitcoin`


    1 `ALICE` – 0.002065 `ETH`


    市值 - $ 1.898 亿美元


    完全稀释市值 - $ 6.205 亿美元


    流通量 – 3060 万 `ALICE`


    # 14. Metahero


    ### 平台


    `Metahero` 设计为一种软件，允许用户扫描身体并将其转换为非同质化代币或 `NFT`。以这种形式，它可以作为个人化身在元宇宙平台中使用。它是行业内的首创，因为它促进了元扫描（met-scanning）或通过扫描实现对象的真实转换。


    该元宇宙平台于 2021 年 6 月上市，初始资金为 1000 万美元。`Metahero` 利用 3D 技术创建虚拟产品和化身，旨在通过缩小物理与虚拟生态系统之间的差距来促进平行世界的演变。其长期计划之一是在全球范围内安装
    12 个 3D 扫描室。


    这将每天允许超过 100,000 个物体或人物通过扫描生成真实的化身。


    该公司由 `Robert Gryn` ，他是一位初创经理和连续科技创业者，曾在欧洲建立过几家快速发展的公司。他的合伙人是 `Piotr Harwas`，他是
    `Wolf Studios` 的 CEO，曾是科技初创公司成功的背后。该公司是全球最大的 3D 扫描仪供应商之一。


    `Metahero` 的另一个项目是 `Everdome`，它允许 `HERO` 代币持有者在购买 `Everdone Metaverse` 的土地时获得折扣。它与
    `HEROSwap`（提供代币交易的去中心化加密交易所）以及帮助用户控制加密资金的 `HERO App` 相关。


    ### 代币


    `HERO` 是生态系统的原生货币。用户使用这种元宇宙代币支付平台上所有的体验，如 `NFT` 销售、授权和扫描。通过 `HERO`，游戏、艺术家和企业家之间将产生更多联系，因为代币的业务应用横跨了艺术和社交媒体。总体而言，该代币的最大供应量为
    100 亿。


    其中 20%（20 亿）锁定在流动性池中，10%（10 亿）将在公售出售，10%（10 亿）私募出售，10%（10 亿）作为公司储备，30%（30 亿）将用于营销、战略规划和交易所上市。剩余
    20%（20 亿）预留给 `Metahero` 团队和顾问。


    全球全球超过 27 亿名玩家，`HERO` 的价值在上市五个月后增长到 $0.2518。购买 `META` 的顶级加密交易所有 `CoinTiger`、`Gate.io`、`BingX`、`Bybit`
    和 `KuCoin`。


    #### HERO 价值统计数据（*可能会变化*）


    1 `HERO`– $ 0.03329


    1 `HERO`– 0.0000008226 `Bitcoin`


    1 `HERO` – 0.00001105 `ETH`


    市值 - $ 1.696 亿美元


    完全稀释市值 - $ 3.328 亿美元


    流通量 – 51 亿 `HERO`


    ––––––––


    ![image](img/scene_break.png)


    # 15. Bloktopia


    ### 平台


    元宇宙空间中的 `Bloktopia` 项目仍处于婴儿阶段，但它已经吸引了知名投资者的支持。例如 `Animoca Brands`、`Magnus Capital`、`Avalanche`
    和 `AU21 Capital`。它也是 `Polygon` 网络支持的选之一。

