  trans: '


    ## 它将开启通往透明公平经济的道路。


    元宇宙带来了去中心化的环境，这使得互操作的区块链游戏与现实世界资产同步成为可能。例如，边玩边赚（`P2E`）游戏为用户提供了资产的完全控制权和所有权，确保了公平的游戏体验。在游戏中使用
    `NFTs` 可以增加获利机会并提升对元宇宙的参与度。


    `Aavegotchhi` 和 `Axie Infinity` 采用边玩边赚（`P2E`）模式，创造了一个全新的虚拟经济，玩家将获得游戏内加密货币和 `NFTs`
    等资产。


    `Battle Racer` 发布 `NFT` 汽车零件，用户可以购买这些零件来制造或升级车辆，或在二级市场上进行出售。


    此外，边玩边赚公会会推动元宇宙 `NFT` 相互作用的快速增长，因为它们充当了购买游戏土地、资产和其他资源的中间人。这些游戏公会通过贷款物业和资产，为资金不足的玩家提供了先发优势。


    这让玩家能够在不同的元宇宙中赚收益。游戏公会获得玩家收益的一小部分。这种方法在利用 `NFTs` 力量的同时，建立了一个开放公平的元宇宙经济，因为每个人都可以参与并盈利。


    - `reNFT` 允许用户出借或租赁 `NFTs`。出借者设置最长期和每日利率，该利率在 `0.002` 到 `2` `WETH`（封装以太坊）之间平均。


    - 若干卡牌交易游戏提供 `NFT` 卡片供玩家增加胜率。包括租赁价格和优选期限的租赁协议由智能合约管理。


    这种公平经济的概念通过区块链的不可篡改性和透明性得到了优化。元宇宙的用户还可以在支持 `NFTs` 的市场上出售他们的房地产或游戏收藏品等 `NFT` 资产，而没有任何任何问题。


    人为价值通胀的可能性也不存在。然而，供需法则仍然会影响 `NFT` 的稀缺性和链上价值。


    ## 它将带来新的房地产趋势。


    元宇宙承诺提供具有房地产属性虚拟空间。在区块链技术和 `NFTs` 的帮助下，用户可以获得资产的所有权，并通过构建虚拟结构来开发社区。


    出售元宇宙土地是利润丰厚的 `NFT` 元宇宙项目之一。未来，`NFT` 持有者可能在元宇宙中拥有一个物业，用于展示自己的收藏品或将其租赁以获利。


    - 出借和租赁 `NFTs` 以获得被动收入。可以通过元宇宙中的 `DeFi`（去中心化金融）平台或 `PARSIQ` 的 `IQ Protocol` 实现。`IQ
    Protocol` 允许虚拟房地产所有者从用户那里产生租金和收益费用。


    - `NFT` 创作者在资产出售或转售时可以获得一定比例的销售费用以及剩余分红。当代表资产的 `NFT` 用于比赛、活动和需要门票费或质押的活动时，这种机制就会发挥作用。


    ## 它将提升元宇宙中的 NFT 投资水平。


    2021 年，非同质化代币的总支出超过 126 亿美元。那些购买了产生收益的 `NFTs` 的人利用了其投资的最佳潜力。


    在元宇宙中，持有者可以通过以下方式做更多事情并享受更多收益：


    - **产生收益的 NFTs**：投资者将通过支持元宇宙项目享受被动回报。代币持有者将获得产生剩余收入的治理代币。


    目前，已经有一些系列提供激励措施。`Genesis Cyber Kongz` 计划在未来十年内每天发行十个 `$Banana` 代币。其他例子包括带有 `$FISH`
    的 `Mutant Cats` 和带有 `$VOLT` 的 `SupDucks`。


    - **NFT 版税**：每当创作者的作品在二级市场发生所有权变更时，他们都能获得销售价格的定比例。驱动代币的底层技术允许艺术家设置版税。一旦预定，智能合约将自动执行协议，包括版税的分配。


    - **NFT 驱动的收益率耕矿**：这意味着利用 `DeFi` 协议使用 `NFT` 驱动的资产进行收益挖矿。一个例子是使用流动性提供者的 `ERC-721`
    (`LP-NFT`) 代币作为另一个收益生成协议的抵押品或质押。这使得 `NFT` 所有者能够获得额外的收益。


    - **嵌套 NFT (Nested NFTs)**：这种数字资产为收藏品提供了更多内在价值。它通过将投机性投资转化为产生收益的资产来运作。嵌套 `NFTs`
    是分层代币，充当数字篮子持有多个基于 `ERC` 的代币。在元宇宙中，它们为数字物品增加了新功能和定制特性。


    - **质押**：另一种从 `NFT` 系列中创建被动收入的方法是通过质押。这意味着将资产锁定在去中心化金融或 `DeFi` 协议智能合约中，以特定代币、投票权或治理的形式换奖励。促进非同质化代币质押的平台有
    `Spliterlands`、`Kira Network`、`Only1` 和 `NFTX`。


    ## 它将解锁真正的资产所有权。


    `NFT` 和区块链驱动的元宇宙提供了土地、房地产、数字服装、头像和其他项目的真实所有权。它允许所有者在不同平台之间迁移和使用他们的代币。


    它强调了数字资产的互操作性，而目前的趋势是用户只能在一个平台或游戏网站上使用购买的虚拟物品。统一因素可以是单一登录功能或允许用户访问 `NFTs` 的特定加密钱包。


    非同质化代币是元宇宙未来经济的枢纽。它们实现了财产、身份和认证。每个 `NFT` 的加密密钥确保了所有权的安全性。这两个因素对于元宇宙社会至关重要。


    “NFTs 起初是从数字艺术领域开始的。但它将变得强大得多……所以应用前景是巨大的，”Crypto.com 首席官 Eric Anziani 说道。


    元宇宙的经济和社会体验由两个元素驱动：内容的发行和土地所有权。`NFTs` 实现了元宇宙中的房地产交易。


    “由于智能合约的定义方式和 NFT 的编程方式，元宇宙物业权无法伪造，”Anziani 补充道。


    # NFT 与元宇宙的未来


    随着非同质化代币的使用场景不断扩大，它们预示着虚拟世界新纪元的到来——元宇宙。Facebook 改名并更名为 Meta 标志着向基于 `NFT` 的增强现实转型。


    游戏和技术平台现有的元宇宙原型已经让我们窥见了未来。


    ## 1. 从带来乐趣变为投资工具


    `NFT` 游戏广受欢迎，玩家通过购买加密货币或代币来升级他们的游戏。


    '
- fmt: "\nAccording to personal finance guru Humphrey Yang, “It’s essentially gambling\
    \ but people don’t really know the difference and they buy them because they’re\
    \ fun.” He believed that buying a non-fungible token is riskier compared to a\
    \ crypto purchase because it’s like betting on virtual currency.\n\nLaura Shin,\
    \ author and crypto podcast host said that she purchased a music-related NFT out\
    \ of emotions, not because of investment purposes. “I bought the Kings of Leon\
    \ NFT when it came out because I love crypto and I love Kings of Leon.”\n\n##\
    \ 2. Valuable assets that make you part of the exclusive group of owners\n\nWho\
    \ wouldn’t want to be associated with the rich and famous who are in a buying\
    \ frenzy to get hold of the NFT collectibles?\n\n2021 was a bull run year for\
    \ `Bitcoin` and `Ethereum`. New investors bought shares of this popular crypto\
    \ and started exploring alternative investments that are crypto-related like `Ethereum`-based\
    \ NFTs. All of a sudden, from being a not-so-popular concept since its 2014 inception,\
    \ this digital asset has become a new medium to monetize original creations and\
    \ unique memorabilia.\n\nA classic example is the `Bored Ape Yacht Club` which\
    \ was offered in a finite number of around 10,000. `Stephen Curry` purchased one,\
    \ `Jimmy Fallon` got one, and `Paris Hilton` bought one. If you bought one, you\
    \ are a part of the same group which in a way makes the NFTs more precious from\
    \ the societal view.\n\nYang added, “It’s like a membership pass, so the value\
    \ really comes from other people assigning value to it.”\n\n## 3. NFTs unbridled\
