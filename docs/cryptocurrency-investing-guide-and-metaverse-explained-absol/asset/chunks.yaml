- fmt: "\nThe game concept of Cryptovoxels simulates the experiences in the real world.\
    \ It integrates real-world events and products. In this Metaverse, players can\
    \ build their stores, create NFT art galleries, purchase virtual land, make avatars,\
    \ play games on the platform, and interact with other users.\n\n### The token\n\
    Tokens of this platform are `CVPA` (Cryptovoxels Parcel), an `NFT` that represents\
    \ the Origin City land. It is not listed on crypto trading platform, but can be\
    \ purchased on `OpenSea` which is the official secondary marketplace of the game.\
    \ Also, users of the platform can get hold of `CVPA` during the weekly auction\
    \ on `Cryptovoxels`.\n\n## Silks\n\n### The platform\nThe Silks ecosystem went\
    \ public in June, 2021. Its upcoming Metaverse project “Games of Silks” is highly-anticipated\
    \ as it will be taking the P2E games to another level by offering a feature-packed,\
    \ thoroughbred horse-racing-inspired platform.\n\nWithin this virtual world, users\
    \ can buy and own their own Silks horses that are represented as `NFTs`. With\
    \ a self-sustaining marketplace, the participants can smoothly trade their horses.\
    \ \n\nWhat makes it more exciting is that the virtual Silks horses are linked\
    \ to the horses in the real world. This allows players to access the database\
    \ that offers information on the bloodline of the thoroughbred, growth history\
    \ and results of previous racing experiences. Verification of the data is done\
    \ through the `PoS` (Proof-of-Stake) consensus mechanism. \n\n### The token\n\
    `STT` is Silks’ native token. It can be used by users as in-game currency to purchase\
    \ Silks horses, avatars, stables, and plots of land. It can also be earned as\
    \ a staking reward when the real-world horses win their races. Another way to\
    \ earn `STT` is to breed horses when the physical counterpart of their virtual\
    \ horse retired, becoming a stallion or a broodmare. Professional Silks player\
    \ can also monetize their skills via “pinhooking” or profiting from buying and\
    \ selling horses before their first real-world competition. \n\nThe governance\
    \ token of Silks metaverse is `SLK`. Holders of this currency automatically become\
    \ a member of the Silks `DAO` and have the right to cast their vote on the platform’s\
    \ major decisions. Moreover, users can convert the `STT` tokens to `SLK`.\n\n\
    ––––––––\n\n![image](d2d_images/scene_break.png)\n\n## Memoverse\n\n### The platform\n\
    Memoverse is a platform that offers unique Learn-2-Earn and Memorize-2-Earn systems.\
    \ It is the Web 3.0 virtual vaults or Memory Palaces that store human memory.\
    \ This memorization gamified platform comes with its proprietary decentralized\
    \ finance (`DeFi`) instruments and non-fungible tokens (`NFT`) marketplace.\n\n\
    The premise of Memoverse is turning memorization into a game so the process becomes\
    \ more fun and effective. The game is inspired by Sherlock Holmes’ technique of\
    \ creating a ‘mind palace’ to keep and retrieve virtually all information he needs.\
    \ It is also a popular approach of memory champions who are advocates of memorization.\n\
    \nThe main launching of this Memoverse Play-to-Earn platform will be on the 3^(rd)\
    \ or 4^(th) quarter of 2022.\n\n### The token\nThe native token of Memoverse is\
    \ `MEMO`. It can be earned by competing in memorization contests or creating/owning\
    \ memory palaces. The token can be used to buy in-game assets and `NFTs` that\
    \ can be sold or traded on the platform’s marketplace.\n\n## Bit.Country\n\n###\
    \ The platform\nBit.Country is a portal that allows businesses and non-technical\
    \ users to create their own metaverse according to their needs. Developers can\
    \ use the network’s `API`, allowing the smart contract users to customize and\
    \ personalize their virtual world by minting digital art and digital real estate.\
    \ Its framework is designed for more immersive 3D experiences, combining a polygon\
    \ system with a voxel world. It takes pride in being the mother of user-generated\
    \ Metaverses.\n\n### The token\nThe metaverse token of Bit.Country is `NUUM`.\
    \ Its launching is widely-anticipated as it is the means to buy a parcel of land\
    \ on the platform. There will be 100,000 parcels that can be used for content\
    \ creation, events, advertising, or branding purposes.\n\n## Pegaxy\n\n### The\
    \ platform\nPegaxy is an `NFT`-based, free P2E horse racing game platform. This\
    \ metaverse allows users to enter their `Pega` (inspired by the mythical creature\
    \ Pegasus) into `PvP` or player-versus-player races and win `VIS` rewards. The\
    \ horses are available to those who want to buy, breed, sell, or rent them.\n\n\
    It is now available on desktops and the official launch on Android and iOS is\
    \ set for the second quarter of 2022. What makes Pegaxy unique is that it lets\
    \ users join the metaverse without shelling an initial investment. Its rental\
    \ system is automated with a profit-sharing model agreement that includes predetermined\
    \ conditions. The Grand Dash Tournament is the most anticipated annual competition\
    \ in this metaverse. To qualify, players should win monthly qualification rounds.\
    \ \n\n### The token\nThe utility token of Pegaxy is `VIS` (Vigorus) while its\
    \ governance token is `PGX` (Pegaxy Stone). `VIS` serves as the primary money\
    \ to facilitate commerce transactions within the game. It can also be earned as\
    \ reward money. `PGX` holders can participate in stacking for-profit and voting\
    \ for the major proposals of the network’s owners.\n\n## Takeaways\n\n* Study\
    \ the background and potential of every new Metaverse project in the market.\n\
    * Make sure that the companies behind these new projects are stable and have a\
    \ good reputation.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n| ---\
    \ | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Chapter 10\n\
    \n![image](d2d_images/chapter_title_below.png)\n\n## Creating Wealth in Metaverse:\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n| --- | --- | --- |\n\n# Strategy 5-Leverage the Opportunities of Real Estate\n\
    \n“There are big risks, but potentially big rewards.\" - Jannie Yorio, Republic\
    \ CEO\n\nThere will be a boom in the virtual estate, where lands sell for millions\
    \ of dollars. Land in the Metaverse is a lucrative, long-term investment that\
    \ will give you a steady flow of passive income. Moreover, the property will also\
    \ grow in value and you can sell higher than your investment. \n\n### Chapter\
    \ summary\n\n* Ways to earn in Metaverse real estate\n* How to buy land in the\
    \ Metaverse?\n* Takeaways\n\nIn 2021, real estate sales of “Big Four”- Decentraland,\
    \ Sandbox, Somnium, and Cryptovoxels was $502 million. It is expected that the\
    \ numbers will be larger this 2022 and beyond.\n\n### Ways to earn in metaverse\
    \ real estate\n\nFor those who are interested in real estate jobs, the following\
    \ are good opportunities.\n\n#### Brok\nReal estate companies will need more brokers\
    \ to handle the properties for sale or lease. You can enjoy generous commissions\
    \ by connecting sellers and buyers. Another way is to offer your consultancy or\
    \ advice as a professional real estate broker.\n\n#### Flipping\nYou can buy lands\
    \ and digital properties and then resell them to interested people who want to\
    \ own a digital land in the metaverse. Becoming a landlord gives you regular passive\
    \ income.\n\n#### Property Management\nIf you have previous experience in managing\
    \ other people’s property, monetize your expertise by becoming a virtual property\
    \ manager. You can also apply as an administrator of virtual lands, buildings,\
    \ or entertainment venues in the metaverse.\n\n#### Renting out property\nLike\
    \ in the physical world, renting out your house or plot of land brings income.\
    \ If your virtual property is located in a high traffic area, use it for advertising\
    \ purposes. You can create virtual shopping malls, casinos, boutiques, hotels,\
    \ and other entertainment centers.\n\nMake a profit by charging people or selling\
    \ digital goods or services. You can also sell or rent part of the building, sell\
    \ ads space, or charge admission fees. \n"
  raw: 'The game concept of Cryptovoxels simulates the experiences in the real world.
    It integrates real-world events and products. In this Metaverse, players can build
    their stores, create NFT art galleries, purchase virtual land, make avatars, play
    games on the platform, and interact with other users.


    The token


    Tokens of this platform are CVPA (Cryptovoxels Parcel), an NFT that represents
    the Origin City land. It is not listed on crypto trading platform, but can be
    purchased on OpenSea which is the official secondary marketplace of the game.
    Also, users of the platform can get hold of CVPA during the weekly auction on
    Cryptovoxels.


    Silks


    The platform


    The Silks ecosystem went public in June, 2021. Its upcoming Metaverse project
    “Games of Silks” is highly-anticipated as it will be taking the P2E games to another
    level by offering a feature-packed, thoroughbred horse-racing-inspired platform.


    Within this virtual world, users can buy and own their own Silks horses that are
    represented as NFTs. With a self-sustaining marketplace, the participants can
    smoothly trade their horses. 


    What makes it more exciting is that the virtual Silks horses are linked to the
    horses in the real world. This allows players to access the database that offers
    information on the bloodline of the thoroughbred, growth history and results of
    previous racing experiences. Verification of the data is done through the PoS
    (Proof-of-Stake) consensus mechanism. 


    The token


    STT is Silks’ native token. It can be used by users as in-game currency to purchase
    Silks horses, avatars, stables, and plots of land. It can also be earned as a
    staking reward when the real-world horses win their races. Another way to earn
    STT is to breed horses when the physical counterpart of their virtual horse retired,
    becoming a stallion or a broodmare. Professional Silks player can also monetize
    their skills via “pinhooking” or profiting from buying and selling horses before
    their first real-world competition. 


    The governance token of Silks metaverse is SLK. Holders of this currency automatically
    become a member of the Silks DAO and have the right to cast their vote on the
    platform’s major decisions. Moreover, users can convert the STT tokens to SLK.


    ––––––––


    ![image](d2d_images/scene_break.png)


    Memoverse


    The platform


    Memoverse is a platform that offers unique Learn-2-Earn and Memorize-2-Earn systems.
    It is the Web 3.0 virtual vaults or Memory Palaces that store human memory. This
    memorization gamified platform comes with its proprietary decentralized finance
    (DeFi) instruments and non-fungible tokens (NFT) marketplace.


    The premise of Memoverse is turning memorization into a game so the process becomes
    more fun and effective. The game is inspired by Sherlock Holmes’ technique of
    creating a ‘mind palace’ to keep and retrieve virtually all information he needs.
    It is also a popular approach of memory champions who are advocates of memorization.


    The main launching of this Memoverse Play-to-Earn platform will be on the 3^(rd)
    or 4^(th) quarter of 2022.


    The token


    The native token of Memoverse is MEMO. It can be earned by competing in memorization
    contests or creating/owning memory palaces. The token can be used to buy in-game
    assets and NFTs that can be sold or traded on the platform’s marketplace.


    Bit.Country


    The platform


    Bit.Country is a portal that allows businesses and non-technical users to create
    their own metaverse according to their needs. Developers can use the network’s
    API, allowing the smart contract users to customize and personalize their virtual
    world by minting digital art and digital real estate. Its framework is designed
    for more immersive 3D experiences, combining a polygon system with a voxel world.
    It takes pride in being the mother of user-generated Metaverses.


    The token


    The metaverse token of Bit.Country is NUUM. Its launching is widely-anticipated
    as it is the means to buy a parcel of land on the platform. There will be 100,000
    parcels that can be used for content creation, events, advertising, or branding
    purposes.


    Pegaxy


    The platform


    Pegaxy is an NFT-based, free P2E horse racing game platform. This metaverse allows
    users to enter their Pega (inspired by the mythical creature Pegasus) into PvP
    or player-versus-player races and win VIS rewards. The horses are available to
    those who want to buy, breed, sell, or rent them.


    It is now available on desktops and the official launch on Android and iOS is
    set for the second quarter of 2022. What makes Pegaxy unique is that it lets users
    join the metaverse without shelling an initial investment. Its rental system is
    automated with a profit-sharing model agreement that includes predetermined conditions.
    The Grand Dash Tournament is the most anticipated annual competition in this metaverse.
    To qualify, players should win monthly qualification rounds. 


    The token


    The utility token of Pegaxy is VIS (Vigorus) while its governance token is PGX
    (Pegaxy Stone).  VIS serves as the primary money to facilitate commerce transactions
    within the game. It can also be earned as reward money. PGX holders can use participate
    in stacking for-profit and voting for the major proposals of the network’s owners.


    Takeaways


    *   Study the background and potential of every new Metaverse project in the market.


    *   Make sure that the companies behind these new projects are stable and have
    a good reputation.


