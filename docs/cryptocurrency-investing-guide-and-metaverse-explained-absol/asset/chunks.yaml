    # Strategy 5-Leverage the Opportunities of Real Estate


    ![image](d2d_images/chapter_title_below.png)


    “There are big risks, but potentially big rewards." - Jannie Yorio, Republic Realm
    CEO


    There will be a boom in the virtual estate, where lands sell for millions of dollars.
    Land in the Metaverse is a lucrative, long-term investment that will give you
    a steady flow of passive income. Moreover, the property will also grow in value
    and you can sell higher than your investment. 


    Chapter summary 


    *   Ways to earn in Metaverse real estate


    *   How to buy land in the Metaverse?


    *   Takeaways


    In 2021, real estate sales of “Big Four”- Decentraland, Sandbox, Somnium, and
    Cryptovoxels was $502 million. It is expected that the numbers will be larger
    this 2022 and beyond.


    Ways to earn in metaverse real estate


    For those who are interested in real estate jobs, the following are good opportunities.


    Brokering


    Real estate companies will need more brokers to handle the properties for sale
    or lease. You can enjoy generous commissions by connecting sellers and buyers.
    Another way is to offer your consultancy or advice as a professional real estate
    broker.


    Flipping


    You can buy lands and digital properties and then resell them to interested people
    who want to own a digital land in the metaverse. Becoming a landlord gives you
    regular passive income.


    Property Management


    If you have previous experience in managing other people’s property, monetize
    your expertise by becoming a virtual property manager. You can also apply as an
    administrator of virtual lands, buildings, or entertainment venues in the metaverse.


    Renting out property


    Like in the physical world, renting out your house or plot of land brings income.
    If your virtual property is located in a high traffic area, use it for advertising
    purposes. You can create virtual shopping malls, casinos, boutiques, hotels, and
    other entertainment centers.


    Make a profit by charging people or selling digital goods or services. You can
    also sell or rent part of the building, sell ads space, or charge admission fees. 


