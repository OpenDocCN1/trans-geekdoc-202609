    元宇宙项目分类


    重申，元宇宙项目是一个计算机生成的空间。这个高度沉浸的、3D 平行宇宙专注于提供类似于现实世界的互动和活动。用户有自己的化身来代表他们的虚拟身份，与其他玩家或参与者互动。


    元宇宙主要有两种分类：


    1. 基于区块链的元宇宙 - 它通过非同质化代币（NFT）、区块链和去中心化金融（DeFi）技术为虚拟空间交付现实价值。例如 Axies Infinity、Decentraland
    和 The Sandbox。


