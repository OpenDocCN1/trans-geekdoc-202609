    根据个人理财大师 Humphrey Yang 的说法，“这本质上是赌博，但人们并真的不知道其中的区别，他们购买是因为这很有趣。”他认为，购买非同质化代币（NFT）相比购买加密货币风险更大，因为这就像是在对虚拟货币下注。


    作者兼加密货币播客主持人 Laura Shin 表示，她出于情感而购买了一个与音乐相关的 NFT，而不是出于投资目的。“当里昂王乐队（Kings of Leon）的
    NFT 发布时我买下了，因为我热爱加密货币，也热爱里昂王乐队。”


    ## 2. 让你成为专属所有者群体的有价值资产


    谁不想与那些为了抢购 NFT 收藏品而疯狂购买的富豪名流联系在一起呢？


    2021 年是 `Bitcoin` 和 `Ethereum` 的牛市年。新投资者购买了这些热门加密货币的份额，并开始探索与加密相关的替代投资，例如基于 `Ethereum`
    的 NFT。突然之间，这种数字资产自 2014 年诞生以来一直不怎么为人知的概念，已变成原创作品和独特纪念品变现的新媒介。


    一个经典的例子是`无聊猿游俱乐部`（Bored Ape Yacht Club），其发行数量有限，约为 10,000 个。`Stephen Curry`（史蒂芬·库里）买了一个，`Jimmy
    Fallon` 有了一个，`Paris Hilton`（帕丽·希尔顿）也买了一个。如果你买了一个，你就属于同一个群体，这从社会角度来看让这些 NFT 更加珍贵。


    Yang 补充道：“这就像一张入场券，所以价值实际上来自于他人对它的估值。”


    ## 3. NFT 在元宇宙中的无限制演变


    虽然一些专家认为 NFT 是“泡沫”或“仅仅是时尚潮流”，但许多人声称它们将持久存在。Laura Shin 认为，2022 年及以后会有更多 NFT 主流应用，而
    `Metaverse` 正在缓慢构建基础技术结构。“它们绝对会留在这里。”


    赋予 NFT 力量的并非 NFT 本，而是背后的技术。NFT 的真实价值由`blockchain`上的`smart contracts` 定义，这正是赋能并保护加密货币的同样创新技术。


    ### 要点总结


    - NFT 完美契合 `Metaverse` 的生态系统。

    - 人们对非同质化代币（NFTs）进入 `Metaverse` 日益增长的兴趣将导致这一未来平台的快速发展和扩张。

    - 在 `Metaverse` 中创建业务、交易业务和变现技能的机会通过 NFT 实现。

    - `Metaverse` 中的 NFT 代表了所获得的原始资产和收藏品的所有权。它们营销了 `Metaverse` 中的属性。

    - `Metaverse` 将推动 NFT 的普及。另一方面，NFT 将桥接数字与物理世界之间的差距。

    - `Blockchain` 的`smart contracts` 为 NFT 提供了优势。


    当 `Blockchain` 和 `Crypto` 在转折点相遇时，`Metaverse` 将消除所有关于 NFT 仅仅是投机性加密噱头的怀疑。非同质化代币将成为虚拟和现实生活的一部分。可能性将是无限的，NFT
    周期的下一个阶段将开始。


