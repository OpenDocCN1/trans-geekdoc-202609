    # 元宇宙投资指南：你会是下一个百万富翁吗？


    ![image](img/chapter_title_below.png)


    “这种现象可能在十年后出现，但它有潜力颠覆人类生活中几乎的一切。”- Jefferies，投资银行公司


    当前争夺市场主的竞争是亿万富翁为了主导未来 `Metaverse` 战斗的一部分。当 `Mark Zuckerberg` 更改其社交媒体帝国母公司的名称时，一些人指责他转移了对
    `Facebook` 政治风波的注意力。一些批评家认为他是一个追逐童年幻想的科技亿万富翁，就像 `Tesla` 的 `Elon Musk` 和迷恋太空火箭的
    `Amazon` 的 `Jeff Bezos` 一样。


    然而，他参与 `Metaverse` 开发的前所未有的举吸引了投资者的兴趣。这使得该平台的股价上涨了超过 9%，是 `Nasdaq` 涨幅的两倍。人们积极搜索
    `Google` 以理解这些术语及其潜在收益。


    即使著名的经纪商 `Bernstein` 也预测，当平行宇宙变为现实时，`Metaverse` 可以颠覆主要市场，年收入潜力达 2 万亿美元。大型科技公司正在缓慢追随
    `Zucker` 的足迹。没有人不想错过这种乐趣和利润。即使 `Disney` 也正根据 2021 年 11 月 13 日 `EPIK` 的推文通过 `Disney
    Metaverse` 加入。


    ![image](img/image015.png)


    ### 章节总结


    - 传统工作会发生什么？

    - 元宇宙中的可用工作

    - 从元宇宙赚钱的创意方式

    - 为什么元宇宙被认为是一项丰丰的投资？

    - 如何投资元宇宙？

    - 开始投资元宇宙的通用步骤

    - 注意事项

    - 要点总结


    ArtWallet 顾问 `Dmitry Budorin` 说，“任何构建 `VR/AR` 技术的公司（如 Magic Leap、HTC Vive、Varjo）都是元宇宙公司。”


    他补充道，通过 NFT 等数字资产融合物理和虚拟世界的公司可以归类为元宇宙开发者。其中包括创造促智产品、进行生物黑客行为以及研究改变大脑化学领域的人。


    ## 传统工作会发生什么？


    `Metaverse` 旨在将生活的各个方面融合在一个领域内。居家办公的人可以在 3D 办公室中互动。提供传统工作的公司可以利用 `Metaverse` 平台进行会议、演示和其他任务。


    还会有提供稳定收入的元宇宙相关工作。虽然 P2E 游戏模式和各种在线工作已经为全球各地的人提供了稳定收入，但 `Metaverse` 可以提供更多。


    ## 元宇宙中的可用工作


    - 数字时尚设计师：他们可以在不需要实际购买或使用材料的情况下进行设计。

    - 医疗专业人员：他们可以检查数字孪生以克服受伤或疾病。

    - 智能合约律师：处理涉及 `blockchain` 技术和新方法确保合法性的元宇宙交易。

    - 元宇宙建筑师：负责构建元宇宙中的元素，如物体、场所或体验。这需要专家开发人员、设计师和创意人员。

    - 导游：负责引导新用户或游客参观元宇宙中发现的奇妙场所。


    `Metaverse` 中 `Metawork` 的未来仍然未知。然而，当前的疫情让我们在办公室办公、远程办公或混合办公模式之间选择，让我们窥见了未来的一角。


    ## 从元宇宙赚钱的创意方式


    ### 1. 创建非同质化代币（NFT）


    `Metaverse` 为所有想要变现才华和技能的创作者开启了大门。你可以将你的作品转化为数字资产并在多个市场上提供。由于 `Metaverse` 将高度依赖化身、收藏卡、设备、结构等数字物品，因此有很多机会出售你的原创作品。


