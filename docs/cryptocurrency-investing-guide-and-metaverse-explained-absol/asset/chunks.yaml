    # Exploring the Potential of Metaverse


    ![image](d2d_images/chapter_title_below.png)


    “Every brand you see in the real world will be in the Metaverse to give you the
    experience of buying virtual goods in the virtual world.”- Anuj Jasani


    In the mid-90s when the Internet is just beginning, people were skeptical because
    of several obstacles like technology limitations, slow dial-up access, and other
    factors that affect the performance. But as the provider vigorously resolved the
    issues and the users embraced the technology, Internet has become one of the greatest
    tech innovations in the world.


    Due to the advancement of technology, people are always looking forward to the
    latest concepts, apps, products, and services to make life more convenient and
    exciting.


    The current buzz is the Metaverse. Its potential growth is expected to be exponential
    and life-changing. It is considered a whole new horizon that can bring new opportunities
    and possibilities to the daily lives via augmented reality technology.


    ![image](d2d_images/image000.png)


    Chapter Summary


    *   What makes Metaverse unique and attractive?


    *   To whom does the Metaverse matter?


    *   Who are the early Metaverse industry players?


    *   Top reasons why Metaverse has become a global hype


    *   Will Metaverse change the way of living in the future?


    *   Potential benefits and drawbacks of Metaverse


    *   Takeaways


