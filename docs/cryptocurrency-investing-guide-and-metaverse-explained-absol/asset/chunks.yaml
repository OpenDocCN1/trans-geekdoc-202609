- fmt: '

    In the future, there is a big chance that NFTs will replace the traditional tickets
    or passes with a unique ID that allows access to restricted areas. It reduces
    paper usage and fraud issues because the `NFTs` owners need a single token for
    everything that is related to the purpose.


    For instance, if you are attending a musical concert, the NFT pass that you purchased
    would give you the following benefits:


    * access to the event or location

    * exclusive pass to digital goodies

    * memorabilia of the event

    * means to get free snacks

    * makes you a shareholder of the event if the NFT is offered as event equity (you
    get a cut of the profit)


    NFT-minting platform `Mintbase`’s co-founder `Carolin Wend` said “What excites
    us is NFTs being used in the real world.”


    An example of this was the `Mintbase`’s `NEARCon Festival` in Lisbon on October
    26, 2021, which used the smart contracts system `NEARProtocol`. The organizers
    of the festival decided to do a hundred percent NFT ticketing, allowing attendees
    to stake the tickets or earn a certain profit.


    ### As a voting document


    Voters are required to show an ID or a document that shows proof of residence
    before casting their votes. `NFTs` can be used to integrate people’s identities
    and store sensitive data like who they voted for. Moreover, `NFTs` may help a
    lot to prevent voter fraud and cheating issues.


    ### Guide when buying NFTs


    Before you get hold of these specialized tokens, here are the things you need
    to prepare to buy them:


    1. `Digital Wallet` – It stores your cryptocurrencies and acquired `NFTs`.

    2. `Cryptocurrency` – You need to buy the crypto that the `NFT` providers accept
    as payment for the digital asset. `Ether` is mostly accepted by sellers.

    3. `Crypto exchange`- Find secure platforms that sell cryptocurrencies like `Coinbase`,
    `PayPal`, `Kraken`, and `OpenSea`.


    ### Where to buy NFTs


    Since the breakthrough of the `NFTs` in the virtual market, there are many marketplaces
    that emerge. There are categorized in terms of subject nature, format, style,
    and collection. Generally, the four types are the following:


    * **Open marketplace**. It has a wide array of digital assets and art from various
    sources and creators.

    * **Collectible marketplace**. It is focused on movies, sports, or art collectibles.

    * **Curated marketplace**. Its NFT selection comes from specialized or specific
    sources.

    * **Games marketplace**. It offers game-related `NFTs`.


    #### Top NFT marketplaces to check out:


    ##### OpenSea

    `OpenSea` is the largest non-fungible token marketplace. It is considered the
    ‘eBay” of digitalized assets with a wide array of art, photos, sports memorabilia,
    music, and more. This platform supports creators of all types and accepts over
    150 payment tokens. It is also one of the best sites for minting new tokens.


    You need to create your account on the website before you can browse and buy the
    available collection of non-fungible tokens. `OpenSea` is known for offering rare
    pieces of collectibles and digital items.


    ##### Rarible

    `Rarible` is a community-driven marketplace with minting capabilities of creators’
    `NFTs` and portfolios. It allows artists and creators to offer their digital assets
    and collectibles. It also provides royalties to the creators for the future sales
    of their minted assets. You can find major brands in this marketplace like `Adobe`
    and `Taco Bell`. It requires `Rarible` tokens as payment.


    ##### Foundation

    `Foundation` is launched in 2021. It is one of the high-end marketplaces for digital
    art. It is an exclusive community where artists need an invitation from their
    co-artists and creators before they can post their art. This artist-curated platform
    has sold over $100 million worth of `NFTs`. To purchase, users need a `crypto
    wallet` with `Ethereum` coins.


    ##### Mintable

    `Mintable` is an open marketplace that supports the NFT minting needs of all kinds
    of creators and artists. It is viewed as the “Etsy” of the digital asset marketplace.
    Billionaire `Mark Cuban` backs up this platform.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ##### Known Origin

    `Known Origin` is like a real-world art gallery as it caters to the `NFTs` of
    the photographers and artists. It offers the most expensive collections.


    ##### SuperRare

    `SuperRare` is another higher-end NFT marketplace. It has an art gallery vibe
    and is more selective. It offers 3D images, videos, and art. It recently launched
    its own token for buying and selling purposes.


    ##### Nifty Gateway

    `Nifty Gateway` is another curated platform for artists. It is powered by the
    `Gemini` crypto exchange. Its `NFTs` are created on `Ethereum` and are called
    “Nifties”. This site also hosts non-fungible tokens for buyers who prefer a third
    party to store the items for them. You can view and buy many celebrity NFTs here.
    It facilitated the bestselling sale of `Beeple` and other digital creators.


    ##### DraftKings Marketplace

    `DraftKings Marketplace` is a sports-themed site that offers collectible artifacts
    of popular names like race car drivers, football stars, and hockey stars. It is
    built on the brand’s existing franchise of sports betting platforms.


    ##### NBA Top Shot

    `NBA Top Shot` is the NFTs marketplace for basketball fans. It has the best selection
    of play highlights and video clips that captured historic games. It is `NBA`-authorized
    and does not offer a minting option for creators. What you see is what you get
    on this platform.


    The price of collectibles varies from a few dollars to thousands. It is now a
    billion-dollar marketplace of `NFTs` after its substantial success.


    ##### Axie Infinity Market

    `Axie Infinity Market` is a gaming NFT site where assets of the popular game can
    be sold, bought, and minted. It is instrumental to the success of `Axie` in the
    gaming ecosystem and has over a billion dollars in market cap. Its proprietary
    tokens, `Axie Shards` can be purchased from crypto exchanges and other NFT marketplaces.


    Other places to buy NFTs are `Binance NFT`, `Decentraland`, `Arkane Market`.

    '
