    # The Role of NFTs in Metaverse


    ![image](d2d_images/chapter_title_below.png)


    “NFTs are artifacts of networks. So you have your own community and the things,
    and the NFTs you’re creating will be artifacts for that community.”- Chris Dixon-
    American Internet Entrepreneur and Investor


    The Metaverse economy greatly depends on non-fungible tokens (NFTs). For the next
    generation of society, there is a need for digital property authentication to
    show ownership. The things we purchase in the Metaverse like home, land, clothing,
    furniture, or vehicle also need to be traded freely between the multiple virtual
    realms. Another factor that makes NFT important is its capability to be transferred
    to another owner easily.


    NFTs are the digital ownership records that are stored in the blockchain. They
    enable the robust and decentralized authentication of identities, properties,
    and possessions. Every single NFT has a corresponding cryptographic key that no
    one can destroy, copy, or delete.


    Currently, it is linked with digital artworks but NFTs'' big role in social contracts
    and independent ownership is enabling the success of the future Metaverse.


    Experts in the industry see NFTs as a major value driver of the Metaverse and
    a transformative economic force of the future. To better understand NFTs’ role
    in the emerging Metaverse, we need to understand this class of digital assets.


    ![image](d2d_images/image022.png)


    Chapter summary


    *   Non-fungible token (NFT) explained


    *   How are NFTs created?


    *   Why NFTs have become very popular


    *   How do NFTs work?


    *   Takeaways


    Non-fungible token (NFT) explained


    The non-fungible token or NFT came around in 2014 but only gained notoriety recently.
    During the early days, there were already securitized digital art versions and
    iconic NBA games video clips on Instagram.


    These digital assets were sold online using cryptocurrency and other modes of
    payment. Since 2017, sold NFTs were valued at $174 million and counting.


    Compared to other digital creations with infinite supply available, NFTs have
    a very limited run. Another thing that sets NFTs different from other digital
    commodities is their built-in authentication that gives buyers assurance that
    they are buying original items. Collectors call this proof of ownership the “digital
    bragging rights.”


    The most expensive NTF was artist Pak’s “Merge”. It was sold at a record-breaking
    $91.8 million. Next was Mike “Beeple” Winklemann''s daily drawings called EVERYDAYS:
    The First 5000 days. The collection was sold at $69.3 million during the auction
    at Christie’s


    “Essentially, NFTs create digital scarcity,” Yellow Umbrella Ventures managing
    director Arry Yu said.


    NFTs have unique identifying codes similar to cryptocurrencies since they are
    created using the same underlying software.


    However, the likeness ends there. Every NTF comes with a digital signature, making
    it non-fungible or cannot be exchanged for another. Crypto and physical money
    are fungible, which means they can be exchanged or traded.


    How are NFTs created?


    The first-ever NFT was “Quantum.” It was created in May 2014 by Kevin McCoy and
    Anil Dash. The token was a video clip of Jennifer, McCoy’s wife. He registered
    it on the Namecoin blockchain. Dash bought it for $4. The pioneering duo called
    the NFT technology the “monetized graphics.”


    The attempt to make a big NFT project occurred in October 2015. The project Etheria
    was composed of 457 hexagonal tiles which went unsold. In 2017, the awareness
    about tradable NFTs heightened when the online game CryptoKitties began monetizing
    their cat NFTs. The market gained traction. After 5 years, the remaining tiles
    of the Etheria project which were valued at 1 ETH or $0.43 during the launching
    day were sold out for a whopping $1.4 million.


    Another notable example of a non-fungible token is the CryptoPunks, a collection
    of 10,000 characters that are stored on Ethereum. This project has inspired the
    CryptoArt movement.


    It also shaped the development of the open standard interface or the ERC-721 that
    powers the majority of the digital collectibles and art. This standard has given
    the NFT a currency value.


    When people believe that Bitcoin and other cryptocurrencies are the digital answer
    to fiat currency, NFTs become the digital answer to owning rare, valuable collectibles.
    The unique data of every NFT is easy to verify and validate as the authentic certificate
    is generated by blockchain technology.


    Most NFTs reside on the Ethereum blockchain and exchanges take place in crypto
    specialist sites. Their value is influenced by the demand for the item and set
    by the market.


    A non-fungible token (NFT) is minted or created from digital objects to represent
    the intangible and tangible items of real-world items which include:


    *   Videos and sports highlights


    *   Digital art


    *   Music


    *   Game and related items


    *   Collectibles


    *   Video game skins and virtual avatars


    *   Designer sneakers


    *   GIFs


    *   Tweets


    *   Domain names


    *   Essays and digital content


    Why NFTs have become popular


    The resurgence of NFTs around 2017 was due to several factors.


    Popularity of cryptocurrency


    The exciting things about crypto lie in the framework that combines the laws of
    scarcity and the economics of royalties. Investors, traders, and consumers want
    to get hold of the digital currency to leverage its potential. As for the NFT,
    this digital asset represents ownership of unique digital art or content.


    Use of blockchain technology'
