    ## Polychain Monsters


    ### 平台

    Polychain Monsters 是一款元宇宙加密游戏，其特点是受宝可梦启发的 Polymons。它们是动画艺术的非同质化代币（NFT）生物。对于宝可梦粉丝来说，这个游戏为你准备的。它于
    2021 年第一季度 NFT 热潮期间推出。


    凭借现代技术与 90 年代流行卡片怀旧感的完美结合，Polymon Monsters 成功地在加密领域占据了一席。它还获得了包括 `Morningstar
    Ventures` 和 `Moonrock Capital` 在内的 6 大主要投资者的支持和 74 万美元资金。


    该项目的开发者将揭示其他有趣的功能以提升用户的游戏体验，包括对 `Polkadot` 的跨链支持。


    ### 代币

    用户可以使用平台原生代币 `PMON` 购买 Polychain Monster 的 NFT 包。如果你足够幸运，就能获得包中包含的稀有 Polymon。`PMON`
    是该平台的原生货币，你可以在 `Gate.io`、`MEXC`、`LBank`、`PancakeSwap`、`SushiSwap` 等处购买此代币。


