- fmt: '

    `Ethereum` blockchain powers the NFTs in terms of trading, validating, and recording
    transactions. It eliminates peer-to-peer transactions that reduce the profits
    of an NFT creator or owner. All products that use `Ethereum` blockchain share
    a similar “backend” which makes NFTs portable and easy to sell to other users.


    After confirmation of the transaction confirmation, no one can forge or manipulate
    the ownership data. Finally, `Ethereum` is stable and secure which means that
    your NFTs are always up for grabs.


    ## Increased value due to online presence


    The more the NFT is seen on social media and other online platforms, the higher
    value it gains. When it is sold, the current owner of the asset gets 90% of the
    revenue and the original creator enjoys a 10% share. There is a strong potential
    for ongoing revenue and increasing value as the assets are traded in the NFT markets.


    ## Unique and distinct value


    NFTs are original works, hence authenticity is 100% guaranteed. These digital
    collectibles have verifiable distinguishing information that is recorded in the
    blockchain. The record ensures that there will be no fake collectibles to circulate
    as every `NTF` can be traced to the issuer or the creator. Moreover, because there
    are no two NTFs alike, they cannot be exchanged directly.


    ## How do NFTs work?


    Technically, NFTs are digital collector’s items. They are blockchain-based assets
    with recorded information in smart contracts. Those who purchase them get a digital
    file rather than physical forms like actual paintings or CDs. Upon purchase, the
    buyer gets the exclusive rights to own the file. The unique data of the NFTs makes
    it convenient to transfer tokens between the rightful owners, validate the ownership,
    and store certain information. Creators and artists can include their signatures
    in the metadata of the NFTs.


    With NFTs, content creators and artists have found a unique venue to monetize
    their works. Rather than the traditional way of relying on auction houses or putting
    their items up in galleries, they can sell them directly to consumers worldwide
    as NFTs. This means enjoying more profits compared to allowing a third party to
    sell their creations.


    Artists like painters, musicians, composers, and the likes can also program in
    royalties so whenever their creation is purchased by another owner, they will
    receive a corresponding sales percentage.


    Celebrities are also joining the NFT bandwagon by releasing their unique moments,
    memories, and artwork.


    *   Rapper `Snoop Dogg` has an NFT collection “A Journey with the Dogg.” It features
    memories his from early years, `Snoop Dogge Coins`, an original track entitled
    `NFT`, and an NFT-inspired artwork. He launched the collection in a limited 48-hour
    window and earned more than $100,000.

    *   Musician `Grimes` released her unique digital artworks and has sold pieces
    in the amount of $6 million. She is one of the most popular NFT creators., thanks
    to her bestselling 10-piece `WarNymph` collection.

    *   American rapper, record producer, and songwriter `Eminem` raised about $1.8
    million in `Nifty Gateway` when he introduced his collection of NFTs. It included
    the characters from his videos, digital action figures, and original instrumental
    tracks.

    *   `Shawn Mendes` launched his “Wonder” with Genies album in the NFT marketplace
    `OpenSea`. According to the Genies CEO `Akash Nigam`, Mendes earned about $1 million
    within 10 minutes when the musician offered digital wearables like vests, guitars,
    earrings, necklaces, and others.

    *   Socialite, entrepreneur, and Queen of pop culture `Paris Hilton` earned $1.1
    million for her `Iconic Crypto Queen` NFT. She launched her first non-fungible
    token (NFT) with the vinyl toy and digital collectibles company `Super Plastic`.
    Hilton has a collection of about 141 pieces.

    *   American actress `Lindsay Lohan` introduced her token in `Rarible` in 2021,
    which was sold for $50,000. She also released her “Lullaby” single as a non-fungible
    token on `Fansforever`, a decentralized social marketplace. It was also reported
    that she sold for $15,000 the NFT of the defunct EDM duo `Daft Punk`.

    *   Supermodel and author `Emily Ratajkowski` purchased back her controversial
    photograph from `Prince` to regain control over it. She paid $81,000 to get it
    back and then photographed herself with the canvas. She created a digital file,
    launching it as NFT called “Buying Myself Back: A Model for Redistribution.” She
    earned $140,000.

    *   Artist `Chris Torres`, the man behind the iconic 2011-era `Nyan Cat` marked
    the meme’s one-decade anniversary by offering a GIF `NTF` that fetched approximately
    $600,000. He remastered `Nyan Cat` by making the original GIF larger and enhancing
    the minor flaws.


    But art is just one way to leverage your income with NFTs. Business brands and
    sports companies are also navigating this option.


    *   `Charmin` auctioned off its `NFTP` or non-fungible toilet paper. The toilet
    paper-themed NFTs has generated a lot of interest, where bid ranged from $500
    up to $2,100. The brand sold five designs, one NFT of each kind. They also came
    along with a “physical display” if the owners want to hang the `NFTP` on their
    bathrooms. The company gives .01% of the sale to `Direct Relief`, a non-profit
    humanitarian aid.

    *   `Taco Bell` NFT art sold out in just a matter of minutes. When the favorite
    brand tweeted that it would be selling taco-themed images and NFTs on `Rarible`,
    the 25 tokens sold out in about 30 minutes. The proceed went to the `Live Mas
    Scholarship`, a program supported by the `Taco Bell Foundation`.


    What makes the NFT cool was the inclusion of a real-world perk of a $500 electronic
    gift card for the original owner of the non-fungible token.


    *   `Playboy` launched its `Liquid Summer` collection of NFTs and sold everything
    in less than 3 minutes. Its next NFT project `Rabbitars` garnered so much attention.
    Each piece sold at approximately $730.

    *   `NBA Top Shot` profited from selling NFT memorabilia. It is a collaboration
    between the `National Basketball Association (NBA)` and `Dapper Labs`, the creators
    of `CryptoKitties` game. The collaborative venture has received over $300 million
    in funding and made more than $230 million in sales. NBA licenses the content
    including video reel highlights to `Dapper Labs`, which in turn works to digitize
    the footage. The moments are minted and offered to the marketplace via pack drops.
    Common packs cost around $9 dollars but the exclusive packs are worth more.


    Some of the remarkable video reels that commanded high prices included:


    *   `Lebron James` NFTs “Cosmic” Dunk ($208,000), “Throwdowns” Dunk ($100,000),
    “From the Top” Block ($100,000), “Holo MMXX” Dunk ($99,999), and “From the Top”
    Dunk ($80,000)

    *   `Zion Williamson` “Holo MMXX” Dunk - $100,000

    *   `Steph Curry` “Deck the Hoops” Handles -$85,000

    *   `Giannis Antetokounmpo` “Holoe MMXX” Dunk - $80,000


    Crypto art has also grown exponentially with the advent of NFT marketplaces. Collectors
    look for rare and unique items from the digital markets like `Nifty Gateway`,
    `SuperRare`, and `Zora`. Musician `Deadmau5` auctioned and sold thousands of collectibles
    including stickers and digital pins.


    Buyers get the privilege of possessing a digital art masterpiece. Each file comes
    with a license that lets the rightful owner showcase it in his social media pages,
    personal spaces, virtual museum, or in a digital marketplace (if he plans to resell
    it).


    ## Takeaways


    *   NFTs are original, unique assets that are entirely managed through blockchain
    technology.

    *   The uniqueness of NFTs’ ownership and identity features give them a real value
    in the world of Metaverse.


    With a potential value of Metaverse at $800 billion by 2024, and $10 to $30 billion
    annual gain in the next 10-15 years, harnessing the power of NFT Metaverse interplay
    is the key to financial success.

