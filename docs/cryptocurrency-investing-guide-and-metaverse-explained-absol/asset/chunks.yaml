    ## Mogul Productions


    ### 平台

    Mogul Productions 于 2021 年 4 月推出，并成为 NFT 的 DeFi（去中心化金融）平台。这个元宇宙项目为电影制作人和娱乐专业人士提供启动器，他们通过连接创作者和电影粉丝来获取资金。


    平台用户可以提交电影脚本并有机会将其制作成电影。它还通过 `STARS` 奖励对各种体验的参与和互动。有一个不断发展的 Mogul 社区由电影爱好者组成。


    Mogul 社区不断壮大，其成员包括电影导演、编剧、演员和制片人。该项目的卖点是与 `Chainlink`、`ApeSwap`、`Polygon`、`CEEK`
    等大牌建立合作伙伴关系。


    ### 代币

    其实用性货币被称为 `STARS`，它对 Mogul 的 P2E 生态系统至关重要，因为它允许用户购买 NFT 并参与活动。它在 `PancakeSwap`、`Uniswap
    (V2)`、`MEXC`、`LATOKEN`、`Decoin` 等处可用。


