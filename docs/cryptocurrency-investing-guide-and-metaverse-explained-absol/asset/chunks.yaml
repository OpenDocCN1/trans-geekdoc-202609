    # Chapter 1: What Is Cryptocurrency and How Does It Work?


    You may have heard someone refer to cryptocurrency as “digital money” before.
    This term is technically true since you can use cryptocurrency to purchase goods
    and services online. Online transactions made by cryptocurrencies are secure because
    they use online ledgers that are protected by strong cryptography. However, the
    term “digital currency” doesn’t do cryptocurrency justice as it doesn’t capture
    the reason why it’s so appealing to investors all over the world.


    You can think of cryptocurrencies as a value system. People, or investors, purchase
    them because they believe that their value will increase in the future. This is
    similar to how investors buy company stocks because they believe that the company
    will perform better in the future, increasing share prices.


    The difference is that cryptocurrencies are decentralized. This means that there
    is no central company or controlling structure. Their values can’t be manipulated
    and are not affected by government interference. The value of cryptocurrency is
    determined by only two factors: the cryptocurrency’s blockchain utility and the
    investors’ demand level. While this makes their exchange rate highly volatile,
    it also makes them resistant to inflation.


    ## How Do They Work?


    You may be wondering what a blockchain is. Blockchains are a vital aspect of several
    cryptocurrencies. A blockchain is an organizational means of guaranteeing transactional
    data’s integrity. In other words, it is a digital ledger of transactions and is
    dispersed across a network of various computer systems. This means that the ledger
    is not controlled by just one system. The decentralized network allows the blockchain
    to keep working while authenticating all the transactions that go through.


    Transparency, heightened trust, and reinforced shared data security are all characteristics
    of blockchain technology. Some say, however, that blockchains can also be unmanageable,
    inefficient, and energy, and financially consuming.


    Investors buy a cryptocurrency when they are confident in the strength and unity
    of the underlying blockchain. As we said, the majority of cryptocurrencies use
    blockchain. This means that when people invest in a cryptocurrency, they are betting
    on how attractive, functional, and resilient that blockchain is.


    Cryptocurrency transactions are continuously recorded on the fundamental blockchain.
    Transactions are then grouped in “blocks” and added to the “chain.” This is what
    authenticates the reliability of the transactions and allows the network to resume
    running. A shared public ledger is then used to record all transactions. This
    ledger is accessible to everyone, which means that anyone can view the transactions
    made on Bitcoin, Ethereum, and other major blockchains.


    But why are blockchain transactions validated using computing power? Simply because
    they are reimbursed with the principal cryptocurrency. This incentive-based system
    is known as the PoW or proof-of-work mechanism. You may have heard of the term
    “crypto mining.” In the case of PoW, computers that are used to prove a cryptocurrency
    transaction’s validation or authenticity are known as miners. Cryptocurrency can
    be earned by using high-power computers to solve cryptographic equations to authenticate
    data blocks and add transaction records to the ledger.


    Crypto assets aren’t held in regular bank accounts since they’re not exactly tangible.
    Each asset has its own digital address that comes with both private keys, which
    allow users to unlock and send cryptocurrency, and public ones, which are available
    publicly to allow anyone to send cryptocurrency to users. These keys are long
    strings made up of letters and numbers. Digital addresses allow users to deliver
    funds and receive them.


    ## Pros and Cons of Cryptocurrency


    Cryptocurrencies are essentially created to make the transfer of funds a lot easier
    between two parties. They eliminate the need for third-party establishments, such
    as credit card providers and banks. These transactions, as you know, are highly
    secure as they use private and public keys, as well as different consensus methods,
    such as proof-of-work and proof-of-stake mechanisms. User account addresses or
    wallets are provided with a public key, which enables the collection of funds.
    They are also secured by private keys, which are only known by the holder, and
    can be used to send transactions. The best thing about cryptocurrencies is that
    minimal transaction fees are required to complete the transaction, unlike wire
    transfers and other expensive methods.


    Unfortunately, since cryptocurrency transactions are somewhat anonymous and untraceable,
    they are ideal for a wide array of illegal activities, such as tax evasion and
    money laundering. The privacy level depends on the cryptocurrency you’re using.
    For example, Bitcoin is not as private as Zcash, Monero, and dash, which are extremely
    hard to trace since its blockchain holds forensic analysis. It has actually made
    it possible for the authorities to arrest criminals. The following chapters will
    discuss how you can protect yourself from the risks of investing in cryptocurrency.


    ## Different Types of Cryptocurrencies


    Bitcoin, as you probably know, was the first cryptocurrency. To this day, it remains
    the leading cryptocurrency in both value and popularity. You may be surprised
    to learn that there are now thousands of cryptocurrencies that come with different
    stipulations and functions. Some altcoins are technically copies or clones of
    Bitcoin, while others are created from square one. The term “altcoin” refers to
    any cryptocurrency that isn’t Bitcoin. It is basically an alternative (alt) to
    the leading cryptocurrency.'
