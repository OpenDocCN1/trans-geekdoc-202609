    # 策略 1-投资 NFT

    ![image](img/chapter_title_below.png)


    “在一个甚至没有通用公认软件平台的市场中，任何投资都是一种‘受过教育的赌博’。”—— Mike Rhodes，ConsultMyApp 首席执行官


    元宇宙投资为缺乏资本或没有股票市场的人提供了极佳的获利机会。预计会有更多的消费品被“NFT 化”，以便它们在元宇宙中可以获取。


    投资具有巨大增值潜力的 `NFTs` 是元宇宙收益最大化的关键。


    人们购买 `NFTs` 的首要原因是他们希望自己的收藏中开始或增加不可思议的艺术品和其他物品。这种代表数字内容、物理对象或无形概念所有权的新兴技术，正被人们探索其多种用途以及未来的利润。


    ![image](img/image009.png)


    ### 章节总结

    * 为什么你应该投资 `NFTs`

    * 投资 `NFTs` 时需要考虑的事项

    * `NFTs` 的当前和未来用途

    * 购买 `NFTs` 指南

    * 在何处购买 `NFTs`

    * 要点


    ### 为什么你应该投资 NFT

    `NFT` 是一种令人兴奋的探索的新媒介。这些数字资产让你拥有记录的体育时刻、文物、收藏品或艺术品的独家所有权。对于那些能因拥有昂贵资产而感到满足的人物来说，`NFT`
    投资正适合你。


    但到目前，`NFTs` 作为一种获利投资的价值尚未得到证实。它们在未来的价值极不可预测，并可能让你遭受一些损失。然而，那些在出售自己的 `NFTs` 时获得巨额利润的明星和影响者已经证明了它们变得更具价值的潜力。


    虽然某些 `NFTs` 价值数百万美元，但有些资产在独性和稀缺性方面并不如它们有价值。有一点是可以肯定的，将会有更多公司进入数字化业务并推广其潜在应用。预计
    `NFTs` 将成为经济和生活方式格局的固定组成部分。


    ### 投资 NFT 时需要的事的事

    如果你想加入不断增长的 `NFT` 爱好者行列，请将自己定位为收藏家而非投资者。投资 `NFTs` 是一个个人选择，因为有些物品具有重大意义。


    记住，`NFTs` 的价值取决于买家的支付意愿，而不是影响传统股票的经济、技术或基本因素。


    “NFTs 具有风险，因为它们的未来是不确定的，我们还没有足够的历史来判断它们的表现，”Yellow Umbrella 董事 Arry Yu 说。


    购买 `NFTs` 时，选择那些让你感到快乐并自豪于拥有的物品。探索资产的潜力，并眼光关注有一天可能带来财富的真正价值的 `NFTs`。对每项购买进行研究。最后，享受寻找你想要的
    `NFTs`，但始终要谨慎以避免以后损失资金。


    注意 `NFTs` 是纳税的，因为它们被归类为收藏品。它们缴纳资本利得税。用于购买 `NFTs` 的 `cryptocurrency` 如果购买后价值增加，也可能纳税。如果你计划向投资组合中添加非同质化标记，请咨询税务专业人士。


    ### NFT 的当前和未来用途

    * 作为数字内容

    在社交媒体平台上发布作品的内容创作者推动了创意经济。作为内容所有者，当他们将杰作转换为 `NFTs` 时，利润增加了。

    * 作为时尚和可穿戴数字伙伴

    Dolce & Gabbana 的“Genesis Collection”于 2021 年 9 月 30 日以 560 万美元售出。这是该品牌首个非同质化标记（NFTs）系列，是实体物品和区块链中数字伙伴的混合。


    另一个重大事件发生在伦敦时尚周，Auroboros 在增强现实（AR）的帮助下展示了可穿戴数字服装。这个新品牌以成为首个将现实高级装与科学技术相结合的时尚公司而自豪。

    * 作为游戏世界的跨平台


