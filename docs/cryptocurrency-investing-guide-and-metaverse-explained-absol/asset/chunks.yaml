  trans: "\n\n“成功的元宇宙代币的关键在于它的实用性。”—— John Dough，Currency.com 货币分析师。\n\n得益于比特币的持久力，加密货币已成为主流。以太坊和其他替代代币在\
    \ 2021 年也表现优异。由于人们对虚拟货币的兴趣日益增长，许多投资者正在寻找新机会来增加他们的投资组合。\n\n当虚拟游戏中的 NFT 或非同质化代币变得流行时，在线市场开始提供数字化艺术品和收藏品。这项创业被证明是获利丰厚的，并创造了另一种收入来源。\n\
    \n随后元宇宙代币登场了。它们是加密货币的演变。它们使用区块链技术创建，使得它们通常像第一代加密货币一样安全。\n\n![image](img/image003.png)\n\
    \n## 章节总结\n\n*   最佳元宇宙代币深度览\n*   元宇宙代币的类型\n*   为什么考虑元宇宙代币的市值很重要？\n*   按市值（十亿计）排名的顶级元宇宙币\n\
    *   要点总结\n\n## 最佳元宇宙代币深度览\n\n每个元宇宙平台都有自己的加密货币，无论是游戏、社交、房地产还是电子商务平台。从本质上说，元宇宙代币是\
    \ 3D 平台中的货币。它们是用于支付元宇宙中的资产或用于创建数字产品或服务的资金。\n\n有了数字货币，任何用户都可以购买游戏内配件、物品和升级，买卖虚拟土地以及其他\
    \ NFT。 某些代币仅在各自的元宇宙中可用，而大多数代币可以在加密交易所和 NFT 市场上购买。\n\n## 元宇宙代币的类型\n\n*   **边玩边赚\
    \ (P2E) 代币**\n    P2E 代币是具有现实世界价值的游戏内货币，可以兑换为法币。当玩家参与并在游戏中赢得挑战并获胜时，他们将以元宇宙代币的形式获得奖励。\n\
    \n*   **元宇宙平台代币。**\n    它们是元宇宙平台的实用型代币，或具有独特元数据和标识代码的区块链加密资产。\n\n*   **3D 数字元宇宙代币**\n\
    \    这些它们通常被称为非同质化代币（`NFTs`），用于元宇宙中的商业交易。3D 平台提供虚拟体验，包括电子商务和 P2E 游戏。要访问它们，用户需要专用代币。\n\
    \n## 为什么考虑元宇宙代币的市值很重要？\n\n市值衡量了加密货币的价值。它提供了加密货币或代币的详细概述，允许投资者将其价值与其他加密货币进行比较。它还有助于确定代币的波动性和增长潜力。要查找市值，只需将挖出的代币总数乘以单币在市场上的当前价格即可。\n\
    \n演示如下：\n\n*   `Crypto X` 有 500,000 个流通币。每个代币价值为 1 美元。`Crypto X` 的市值为 500,000\
    \ 美元。\n*   `Crypto Z` 有 200,000 个流通币。每个币价值为 2 美元。`Crypto Z` 的市值为 400,000 美元。\n\
    \n就像传统投资一样，考虑市值或挖掘代币的总美元价值很重要。\n\n代币的市值越大，为投资者提供的稳定性就越高。市值较小的加密货币容易受到市场不断变化的影响，产生巨大的收益或亏损。\n\
    \n通常，市值有三种类型——大市值（市值在 100 亿美元或以上的公司）、中市值（市值在 20 亿到 100 亿美元之间）和小市值（市值在 3 亿到 20\
    \ 亿美元之间）。\n\n*   大市值公司是行业中的主要参与者，且存在时间较长。虽然它们不一定能在短期投资期内保证巨额回报，但长期投资会回报其投资者。\n\
    *   中市值公司是那些在行业中显示快速增长的公司。它们的潜力巨大，可以提供良好的投资回报。\n*   小市值公司在行业中较年轻，或者服务于小众市场。通常，它们的资源较少，且容易受到经济放缓的影响。\n\
    \n![image](img/image001.png)\n\n## 需要记住的术语\n\n*   **流通供应量**：已挖出的代币数量\n*   **完全稀释供应量**：预计将挖出的代币数量\n\
    \n## 1. ApeCoin\n\n### 代币\n`ApeCoin` 是 `APE` 生态系统的治理和实用型代币。这种 `ERC-20` 代币赋予了去中心化元宇宙中\
    \ `Web3` 构建者的权力并激励了他们。它是由 `Ethereum` 区块链的工作证明（`POW`）共识机制保护的 `ERC-20` 代币。\n\n该代币的总供应量固定为\
    \ 10 亿个且已全部铸造。2022 年 3 月 17 日发布期间，其中约 30.25% 流通。每 48 个月，这个百分比将增加，允许投资者购买和交易它们。\n\
    \n––––––––\n\n![image](img/scene_break.png)\n![image](img/image014.png) ApeCoin\
    \ 价值统计（可能会变）\n\n*   1 `ApeCoin` – 17.40 美元\n*   1 `ApeCoin` – 0.0004529 比特\n*\
    \   1 `ApeCoin` – 0.006201 ETH\n*   市值 - 49 亿美元\n*   完全稀释市值 - 174 亿美元\n*   流通供应量\
    \ - 28480 万 ApeCoin\n\n––––––––\n\n![image](img/scene_break.png)\n\n### 平台\n`APE`\
    \ 是受 `Bored Ape Club` 启发的。这个去中心化元宇宙由 `APE` 基金支持。\n\n## 2. MANA\n\n### 代币\n`MANA`\
    \ 是基于以太坊的 `Decentraland` 的原生代币。它是成功吸引知名投资者的记录。该代币的持有者可以购买地块和游戏内物品。\n\n当它在 2018\
    \ 年发布时，`MANA` 的价格为 0.025 美元。它在 10 月份从不足 1 美元飙升至 5.90 美元，增长了 4000%。根据 `CoinMarketCap`\
    \ 的，在 2017 年购买代币的投资者可以获得高达 12000% 的回报，如果他们选择出售 `MANA`。它是值得投资的元宇宙代币之一。\n\n![image](img/image021.png)\
    \ MANA 价值统计（可能会变）\n\n*   1 `MANA` – 1.86 美元\n*   1 `MANA` – 0.0004852 比特\n*  \
    \ 1 `MANA` – 0.006644 ETH\n*   市值 - 34 亿美元\n*   完全稀释市值 - 40 亿美元\n*   流通供应量 - 18.4\
    \  MANA\n\n### 平台\n`Decentraland` 由以太坊区块链驱动。它是一个领先的虚拟现实平台，每月有超过 30 万用户免费访问该 3D\
    \ 世界。拥有超过 9 万个由 `NFTs` 表示的区块，`Decentraland` 是一个允许用户创建、体验和变现其内容的领先元宇宙项目。\n\n其去中心化的特性支持了不断增长的用户群的社交方面。该平台的活跃生态系统由喜欢创建社区、建筑、太空冒险和场景的企业和个人组成。\n\
    \n*   最著名的是巴巴多政府在平台上开设了元宇宙大使馆，成为第一个投资虚拟世界的国家。\n*   随其后的是 `Tokens.com` 的子公司 Metaverse\
    \ Group 以 240 万美元购买了 `Decentraland` 最昂贵的空间，用于其电子商务业务和数字时装秀。\n*   `Decentraland`\
    \ 内部的其他大品牌还有 `Samsung` 和 `JPMorgan Chase`。`Decentraland` 最便宜的地块大约是 2.88 以太币（8500\
    \ 美元）。\n\n## 3. SAND\n\n代币\n\n"
