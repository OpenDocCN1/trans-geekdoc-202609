    # Strategy 1-Invest in NFTs


    ![image](d2d_images/chapter_title_below.png)


    “Any investment is an ‘educated gamble’ in a market that doesn’t even have a universally
    accepted software platform.”- Mike Rhodes, CEO of ConsultMyApp


    Metaverse investing offers a great earning opportunity for people in locations
    that lack capital or do not have stock markets. Expect that more consumer items
    will be “NFTied” to make them accessible in the Metaverse.


    Investing in NFTs that show great potential to increase their value is the key
    to maximizing the benefits of Metaverse.


    The primary reason why people buy NFTs is that they want to start or add incredible
    pieces of art and other items to their collection. This emerging technology that
    represents digital content, physical objects, or intangible concepts property
    is being explored by people for its many uses as well as future profits.


    ![image](d2d_images/image009.png)


    Chapter summary 


    *   Why you should invest in NFTs


    *   Things to consider when investing


    in NFTs


    *   Current and future uses of NFTs


    *   Guide when buying NFTs


    *   Where to buy NFTs


    *   Takeaways


    Why you should invest in NFTs


    NFT is a new medium that is exciting to explore. These digital assets let you
    own the sole rights for a recorded sports moment, an artifact, a collectible,
    or a piece of art. For people who feel the satisfaction of owning a valuable asset,
    then NFT investing is for you.


    But at this point, the merit of the NFTs as a lucrative investment is not yet
    proven. Their value in the future is highly unpredictable and may cost you some
    loss. However, their potential to become more valuable has been proven by the
    celebrities and influencers who enjoyed huge profits when they sold their NFTs.


    While some NFTs are worth millions of dollars, there are assets that are not as
    valuable as them in terms of uniqueness and rarity. One thing is sure, there will
    be more companies that will enter the business of assets’ digitalization and promote
    their potential applications. Expect that NFTs will become a fixed part of the
    economy and lifestyle landscapes.


    Things to consider when investing in NFTs


    If you want to join the growing number of NFTs enthusiasts, consider yourself
    a collector rather than an investor at this juncture. Investing in NFTs is a matter
    of personal choice because there are things that hold significant meaning for
    people.


    Bear in mind that the value of NFTs is dependent on the willingness of prospective
    buyers to pay for them. The demand for the items influences its price and not
    the economic, technical, or fundamental factors that influence the traditional
    stocks.


    “NFTs are risky because their future is uncertain, and we don’t yet have a lot
    of history to judge their performance,” Managing Director Arry Yu of Yellow Umbrella
    Ventures said.


    When buying NFTs, go for the items that make you feel happy and proud to be an
    owner. Explore the potentials of the assets and have an eye for truly valuable
    NFTs that may give you a windfall someday. Do your research and consider the risks
    of every purchase you make. Finally, enjoy hunting down the NFTs you want to acquire
    but always proceed with caution to avoid losing money down the road.


    Take note that NFTs are taxable since they are categorized as collectibles. They
    are subject to capital gains taxes because they are sold at a profit. The cryptocurrency
    you use to buy NFTs can also be taxed if it increased in value after the purchase.
    Talk with a tax professional if you are planning to add non-fungible tokens to
    your investment portfolio.


    Current and future uses of NFTs


    *   As digital content


    Content creators who publicize their works on social media platforms power up
    the creator economy.  As owners of the content, their profit increased when they
    convert their masterpieces into NFTs.


    ✓  As fashion and wearables digital companions


    “Collezione Genesis” of Dolce & Gabbana was sold for $5.6 million on September
    30, 2021, It was the brand’s inaugural 9-piece collection of non-fungible tokens
    (NFTs) that is a mix of physical items and digital companions in the blockchain.


    Another remarkable event happened at the London Fashion Week when Auroboros unveiled
    wearable digital apparel with the help of augmented reality (AR). This new brand
    takes pride in being the first-ever fashion house that merges real-world couture
    with science and technology.


    *   As a cross-platform in the gaming world'
