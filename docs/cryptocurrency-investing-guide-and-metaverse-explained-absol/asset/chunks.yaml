    # List of most promising Metaverse projects


    ## RedFox


    ### The platform

    RedFox is a startup technology company that is developing a standalone Metaverse
    ecosystem that is focused on retail, gaming, media, finance, NFTS, and rewards.
    It aims to create a lavish virtual shopping mall that anyone can access via phone
    or computer.


    Its focal point is `RFOX VALT`, a fully- immersive VR experience that is designed
    to bring solutions to the essential industries in the Metaverse.


