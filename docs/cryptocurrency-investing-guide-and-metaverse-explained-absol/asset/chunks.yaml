  trans: '


    `Ethereum` 区块链在交易、验证和记录交易方面为 NFT 提供支持。它消除了会减少 NFT 创作者或所有者利润的点对交易。所有使用 `Ethereum`
    区块链的产品共享一个类似的“后端”，这使得 NFT 具有可移植性并易于卖给其他用户。


    在交易确认后，没有人可以伪造或操纵所有权数据。最后，`Ethereum` 是稳定且安全的，这意味着你的 NFT 随时可以供交易。


    ## 在线呈现带来的价值提升


    NFT 在社交媒体和其他在线平台上出现的次数越多，它获得的价值就越高。当它出售时，资产的当前所有者获得收入的 90%，而原始创作者则享受 10% 的分成。随着资产在
    NFT 市场上进行交易，持续收入和价值增长具有巨大的潜力。


    ## 独特且特殊的价值


    NFT 是原创作品，因此真实性得到了 100% 的保证。这些数字收藏品具有可验证的区分信息，这些信息记录在区块链中。该记录确保了没有虚假收藏品流通，因为每个
    `NTF` 都可以追溯到发行者或创作者。此外，由于没有两个 NTF 是相同的，它们无法被直接交换。


    ## NFT 是如何工作的？


    从技术上说，NFT 是数字收藏品。它们是基于区块链的资产，在智能合约中记录了信息。购买它们的人获得的是数字文件，而不是实际绘画或 CD 等物理形式。购买后，买家获得了该文件的独占所有权。NFT
    的独特数据方便在合法所有者之间传输代币、验证所有权并存储某些信息。创作者和艺术家可以在 NFT 的元数据中包含他们的签名。


    通过 NFT，内容创作者和艺术家找到了一个将其作品变现独特平台。他们不再依赖于拍卖行或将物品列在画廊的传统方式，而是将其作为 NFT 直接卖给全球消费者。这意味着与允许第三方出售他们的创作相比，可以获得更多的利润。


    画家、音乐家、作曲家等艺术家还可以在版税中进行程序化，这样每当他们的作品被其他所有者购买时，他们将收到相应的销售百分比。


    名人也通过发布他们独特的时刻、记忆和艺术品加入了 NFT 的浪潮。


    *   说歌手 `Snoop Dogg` 拥有 NFT 收藏“与 Dogg 的旅程”。它包含了他早年的记忆、`Snoop Dogge Coins`、一首名为
    `NFT` 的原创单曲以及一件受 NFT 启发的艺术品。他在限时 48 小时内发布了该收藏，赚了超过 10 万美元。

    *   音乐家 `Grimes` 发布了她独特的数字艺术品，并售出了价值 600 万的作品。她是最受欢迎的 NFT 创作者之一，得益于她畅销的 10 件 `WarNymph`
    收藏。

    *   美国说歌手、唱片制作人和词作家 `Eminem` 在推出他的 NFT 收藏时在 `Nifty Gateway` 上筹到了约 180 万美元。它包括他视频中的角色、数字动作人偶原始器乐曲。

    *   `Shawn Mendes` 在 NFT 市场 `OpenSea` 上推出了“Wonder” with Genies 专辑。根据 Genies 首席执行官
    `Akash Nigam` 的说法，当这位音乐家提供背心、吉他、耳环、项链等数字可穿戴设备时，Mendes 在 10 分钟内赚了约 100 万美元。

    *   社交名媛、企业家和流行文化女王 `Paris Hilton` 为她的 `Iconic Crypto Queen` NFT 赚取了 110 万美元。她与乙胶玩具和数字收藏品公司
    `Super Plastic` 合作推出了她的第一个非同质化代币（NFT）。Hilton 拥有约 141 件收藏。

    *   美国女演员 `Lindsay Lohan` 于 2021 年在 `Rarible` 上她的代币，以 50,000 美元出售。她还在去中心化社交市场
    `Fansforever` 上以非同质化代币的形式发布了单曲“Lullaby”。据报道，她还将 15,000 美元卖掉了已 EDM 双人组 `Daft Punk`
    的 NFT。

    *   超级模特兼作家 `Emily Ratajkowski` 从 `Prince` 手中买回了她有争议的照片以重新获得控制。她支付了 81,000 美元买回，然后对着画布自拍。她创建了一个数字文件，并作为名为“买回我自己：重新分配模型”的
    NFT 发布。她赚了 14 万美元。

    *   艺术家 `Chris Torres` 是标志性的 2011 年时代 `Nyan Cat` 的幕后推手，他通过提供一个 GIF `NTF` 标记了这个迷因的十周年，该
    NFT 拍得了约 60 万美元。他通过放大原始 GIF 并改进细小瑕疵对 `Nyan Cat` 进行了重制。


    但艺术仅仅是利用 NFT 增加收入的一种方式。商业品牌和体育公司也在尝试这一选择。


    *   `Charmin` 拍卖了它的 `NFTP` 或非同质化卫生纸。卫生纸为主题的 NFT 引起了极大兴趣，出价从 500 美元到 2,100 美元不等。该品牌卖了五种设计，每种一个
    NFT。它们还附带了“物理展示”，如果所有者想在他们的浴室里挂上 `NFTP`。公司将销售额的 0.01% 捐给了非营利人道主义援助 `Direct Relief`。

    *   `Taco Bell` 的 NFT 艺术在几分钟内就售罄了。当这个喜爱的品牌推特说将在 `Rarible` 上出售塔可为主题的图像和 NFT 时，25
    个代币在约 30 分钟内售完。收益将用于 `Taco Bell Foundation` 支持的计划 `Live Mas Scholarship`。


    让 NFT 变得酷炫的是非同质化代币所有者的 500 美元现实礼品卡。


    *   `Playboy` 发布了它的 `Liquid Summer` NFT 收藏并在 3 分钟内售完。它的下一个 NFT 项目 `Rabbitars`
    引起了极大关注。每件售价约为 730 美元。

    *   `NBA Top Shot` 通过销售纪念品获利。它是美国篮球协会 (NBA) 与 `CryptoKies` 游戏创作者 `Dapper Labs`
    之间的合作。该合资项目已获得超过 3 亿美元资金，销售额超过 2.3 亿美元。NBA 内容许可给 `Dapper Labs`，后者负责将这些片段数字化。这些时刻通过卡包投放到市场。普通包价格约为
    9 美元，但独家包价值更高。


    一些获得高价的视频集锦包括：


    *   `Lebron James` NFT “Cosmic” Dunk (208,000 美元),“Throwdowns” Dunk (100,000 美元),“From
    the Top” Block (100,000 美元),“Holo MMXX” Dunk (99,999 美元) 以及“From the Top” Dunk
    (80,000 美元)

    *   `Zion Williamson` “Holo MMXX” Dunk - 100,000 美元

    *   `Steph Curry` “Deck the Hoops” Handles - 85,000 美元

    *   `Giannis Antetokounmpo` “Holoe MMXX” Dunk - 80,000 美元


    随着 NFT 市场的出现，加密艺术呈指数级增长。收藏家从 `Nifty Gateway`、`SuperRare` 和 `Zora` 等数字市场寻找稀有物品。音乐家
    `Deadmau5` 拍卖并出售了数千个包括贴纸和数字章。


    买家获得了拥有数字艺术杰品的特权。每个文件都带有一份许可，允许合法所有者在其社交媒体页面、个人空间、虚拟博物馆或数字市场（如果他计划转售）中展示。


    ## 总结


    *   NFT 是完全通过区块链技术管理的原创的、独特的资产。

    *   NFT 所有权和身份特征的独特性使其在元宇宙世界具有真实价值。


    考虑到元宇宙的价值预计到 2024 年达到 8000 亿美元，并且在未来 10-15 年每年增长 100 亿到 300 亿美元，利用 NFT 元宇宙交互的力量是财务成功的关键。


