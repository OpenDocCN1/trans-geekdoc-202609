  trans: '


    Cryptovoxels 的游戏概念模拟了现实世界的体验。它整合了现实世界的事件和产品。在这个元宇宙中，玩家可以建立自己的商店、创建 NFT 艺术廊、购买虚拟土地、制作化身、在平台上玩游戏并与其他用户进行互动。


    ### 代币

    该平台的代币是 `CVPA` (Cryptovoxels Parcel)，是一种代表 Origin City 土地的 `NFT`。它没有在加密货币平台上市，但可以在游戏的官方二级市场
    `OpenSea` 上购买。此外，平台的用户可以在 `Cryptovoxels` 的每周拍卖中获得 `CVPA`。


    ## Silks


    ### 平台

    Silks 生态系统已于 2021 年 6 月上市。其即将推出的元宇宙项目“Games of Silks”备受期待，因为它将通过提供一个功能完备、受纯血马赛赛启发的平台，将
    P2E（边玩边赚）游戏推向另一个高度。


    在这个虚拟世界中，用户可以购买并拥有自己的以 `NFTs` 形式表示的 Silks 马。通过一个自给自足的市场，参与者可以顺畅地交易他们的马。


    更令它兴奋的是，虚拟的 Silks 马与现实世界的马相连。这允许玩家访问数据库，该数据库提供纯血马的血统信息、生长历史以及之前赛赛的结果。数据的验证通过 `PoS`（权益证明）共识机制完成。


    ### 代币

    `STT` 是 Silks 的原生代币。用户可以将其作为游戏内货币购买 Silks 马、化身、马厩和地块。当现实世界中的马赢得比赛时，它还可以作为质押奖励获得。获得
    `STT` 的另一种方式是，当虚拟马匹对应的物理实体退休并成为公马或种母时，进行马匹育种。专业的 Silks 玩家还可以通过“低买高卖”（pinhooking）或在马匹参加第一次现实世界比赛之前买卖马匹来实现其技能变现。


    Silks 元宇宙的治理代币是 `SLK`。这种货币的持有者自动成为 Silks `DAO` 的成员，并有权对平台的重大决策进行投票。此外，用户可以将 `STT`
    代币转换为 `SLK`。


    ––––––––


    ![image](img/scene_break.png)


    ## Memoverse


    ### 平台

    Memoverse 是一个提供独特的学习获赚（Learn-2-Earn）和记忆获赚（Memorize-2-Earn）系统的平台。它是存储人类记忆的 Web
    3.0 虚拟库或记忆宫。这个记忆游戏化平台配备了专有的去中心化金融 (`DeFi`) 工具和非同质化标记 (`NFT`) 市场。


    Memoverse 的前提是将记忆变成游戏，让这个过程变得更有趣且高效。游戏的灵感来自夏尔洛·福尔摩创建“记忆宫”的技术，用于保存和检索他需要的几乎所有的信息。这也是记忆冠军等倡导者采用的一种流行方法。


    该 Memoverse Play-to-Earn 平台的主推将于 2022 年第 3 或第 4 季度。


    ### 代币

    Memoverse 的原生代币是 `MEMO`。可以通过参加记忆比赛或创建/拥有记忆宫来获得该代币。该代币可用于购买游戏资产和 `NFTs`，这些可以在平台的市场上进行出售或交易。


    ## Bit.Country


    ### 平台

    Bit.Country 是一个门户，允许企业和非技术用户根据其需求创建自己的元宇宙。开发者可以使用网络的 `API`，允许智能合约用户通过铸造数字艺术和数字房地产来定制和个性化他们的虚拟世界。其框架为更具沉浸感的
    3D 体验而设计，将多边形系统与体素世界相结合。它以作为用户生成元宇宙的母体为傲。


    ### 代币

    Bit.Country 的元宇宙代币是 `NUUM`。它的发布备受期待，因为它是在平台上购买土地块的手段。将有 100,000 个地块，可用于内容创作、活动、广告或品牌建设。


    ## Pegaxy


    ### 平台

    Pegaxy 是一个基于 `NFT` 的免费 P2E 赛马游戏平台。这个元宇宙允许用户让他们的 `Pega`（灵感来自神话生物天马）进入 `PvP` 或玩家对玩家的赛中，并赢得
    `VIS` 奖励。想要购买、育种、出售或租赁马的人都可以获得这些马。


    它现在可以在桌面可用，Android 和 iOS 的正式发布定于 2022 年第二季度。让 Pegaxy 独特之处在于，它让用户无需投入资金即可加入元宇宙。其租赁系统是自动化的，并带有包含预定条件的利润共享模型协议。大冲刺锦赛是该元宇宙中最受期待的年度赛事。要获得资格，玩家应该赢得每月资格赛。


    ### 代币

    Pegaxy 的实用性代币是 `VIS` (Vigorus)，而其治理代币是 `PGX` (Pegaxy Stone)。`VIS` 作为游戏内商业交易的主要货币。它也可以作为奖励金。`PGX`
    持有者可以参与获利质押，并对网络所有者的主要提案进行投票。


    ## 核心总结


    * 研究市场上每个新元宇宙项目的背景和潜力。

    * 确保这些新项目背后的公司稳定且声誉良好。


