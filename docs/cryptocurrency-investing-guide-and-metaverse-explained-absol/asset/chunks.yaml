    元宇宙的元素之一是让用户存在于数字空间并像现实世界一样生活的能力。


    ## Roblox


    `Roblox` 提供沉浸式的虚拟体验，让玩家一窥未来世界的模样。这个由独立开发者创建的热门游戏平台被认为是元宇宙最广阔、最接近愿景。用户还会花费美元购买
    `Robux`，该网站的虚拟货币，用于购买数字物品（等等，"the-site''s-virtual-currency-to-purchase-digital-items"
    -> `the-site''s-virtual-currency-to-purchase-digital-items` -> `the-site''s-virtual-currency-to-purchase-digital-items`）。


    实际上是：`Robux`，该网站用于购买数字物品的虚拟货币。


    ## Epic Games


    回看 `Epic Games` 在 2017 年开发 `Fornite` 时，这款具有塔防防御风格的游戏已计划构建一个元宇宙领域。但这个玩家对抗丧尸的游戏变得如此受欢迎，自己变成了一个全球性现象。公司急于在
    `Fortnite Battle Royale` 大逃杀模式中加入舞蹈派对、语音聊天和其他社交功能，以提供更刺激的游戏体验。


    迄为止，`Epic Games` 正在将 `Fornite` 作为一种互动式游戏和元宇宙进行营销。根据营销副副总裁 Matthew Weissinger 的说法（注：此处原文似乎与前文重复，已翻译）。


    首席执行官 `Tim Sweeney` 已批准公司对构建元宇宙的投资。`Epic Games` 分配了 10 亿美元的基金以促进增长机会。


