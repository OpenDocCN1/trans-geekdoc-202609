    drag and drop the ZIP file with the application. Furioos will immediately locate
    the .exe file and then upload it at once.


    True to its mission to develop powerful applications, Unity has launched the Mixed
    and Augmented Reality Studio (MARS). It lets the participants use the additional
    digital apps in the virtual space to create a mixed reality experience.


    According to senior VP for AI Dr. Danny Lange and VP of tools Timoni West, the
    company supports the revolutionary Metaverses that are beginning to manifest in
    the real world. Hence, they are investing in the digital twin or the physical
    world’s digital representations.


    Lange and West believed that the digital twin would become the foundation of a
    giant Metaverse concept, where users easily move across different virtual spheres
    without glitches.


    “It has to be easy to use. It has to be easy to create content and experiences.
    It also has to be easy for people to make a living from.... it’s in our DNA, in
    our blood to continue this and bring it into the Metaverse as well.”


    ### The Sandbox


    The Sandbox allows players to build a virtual world and play, buy & sell NFT assets
    or real estate properties with NFTs. These non-fungible tokens are digital tokens
    that are unique, non-interchangeable, and indivisible. In this realm, we will
    have true ownership of in-game assets and use digital currencies any way we want.


    Decentraland


    Decentraland is another early mover that signifies an intention to make Metaverse
    the core product. This fully decentralized virtual world is controlled via the
    DAO and operates in the Ethereum blockchain. Since 2017, this platform is steadily
    growing. To date, its highest-paid piece of property is recorded at $2.4 million.


    Its cryptocurrency is called MANA. It can be used to buy lands, build and design
    structures, create scenes and challenges like art exhibits or concerts, purchase
    items like Avatar wearables and other items in the marketplace, and even gamble
    in the casinos.


    In 2021, the digital real estate firm Republic Realm purchased 259-parcel of land
    in NFT form. It was worth 1.2 million MANA or equivalent to $900,000. 


    Niantic


    Pokemon Go of Niantic is one of the key platforms that deliver immersive experiences
    that cross the lines of real and virtual worlds. It has raised about $300 million
    to initiate its Metaverse project. Niantic aims to create an alternative to the
    “dystopian nightmare” notion of the Metaverse.


    Apple


    Apple could be a dark horse in the Metaverse race due to its mass-market adoption
    capability. It can easily do what it has done to tablet and smartphone markets.


    It is currently in the process of producing an advanced VR gear that is believed
    to revolutionize how users experience the Metaverse. It is also investing in AR
    hardware which is a sign that its App Store wants to be on the bandwagon when
    the digital revolution manifests its full potential.


    JPMorgan Chase & Co.


    JPMorgan Chase has taken the initial steps to explore Metaverse when it created
    the Onyx Lounge, the 3D browser-based virtual platform in Decentraland.


    In a statement, this financial giant said “The metaverse will likely infiltrate
    every sector in some way in the coming years, with the market opportunity estimated
    at over $1 trillion in yearly revenues.”


    ### Pricewaterhouse Coopers


    Metaverse platform Sandbox released a statement last December that the Hong Kong
    office of Pricewaterhouse Coopers has set up a virtual site to provide advice
    to those interested in exploring the potential of the Metaverse.


    Walmart


    Last December 2021, Walmart has filed new trademarks to manufacture and sell virtual
    items like toys, personal care products, electronics, sporting goods, and home
    decors. The company also released a statement that it would be offering NFTs and
    cryptocurrencies to users.


    McDonald''s


    MacDonald’s Corporation filed also files Metaverse-related patent applications
    to operate an online virtual restaurant with a home delivery service. 


    Nvidia 


    Nvidia is not a direct player but is seen as a key enabler of the Metaverse. It
    announced in 2021 that Ominiverse Enterprise would be combining 3D graphics with
    supercomputing and artificial intelligence (AI) to lay down the foundation of
    the Metaverse.


    Top reasons why Metaverse has become a global hype


    The first generation of services that use avatars is not considered Metaverse.
    It is because these platforms use a single app. To be categorized as Metaverse,
    the platforms should have a multitude of loosely-tied services that provide a
    variety of real-time interactions.


    The concept of the Metaverse is linked with the emerging Web 3.0 or the open-source
    and decentralized version of the internet. It would be using real-time 3D (RT3D)
    objects and engaging with available data.


    The large collection of network services is interconnected, showcasing the dedicated
    roads that are built by the companies for their services. It is where we beat
    the paths to go from one place to another.


    Here’s a quick look at the features and advantages of Metaverse:


    1\. Democratized architecture and operations


    With a democratized architecture, the Metaverse platforms are not owned by a single
    entity, group, or institution.


    Holders of the platform’s cryptocurrency have a right to engage in the network’s
    decision-making. This means that it is no longer possible to make algorithm changes
    without the consent of the users.


    2\. Open-source


    Since open-source is one of the key elements of the Metaverse, builders need to
    make their source codes available to everyone.


    Global tech players are required to make their technologies, AI, and image synthesis
    accessible to help developers, startup companies, and other interested parties
    who want to develop their own platforms.


    3\. Advance scientific research


    With more upscale simulation capacity, Metaverse can easily advance scientific
    research in different fields including aerospace, healthcare, and manufacturing. 


    Medical professionals can meet with the stakeholders virtually to present a simulated
    molecular structure of a new drug or vaccine.


    Moreover, the Metaverse features can easily boost the success rate, error detection,
    and approvals of projects.


    4\. Revolutionize communication and interaction


    At present, we are using the two-dimensional format when accessing online information.
    It involves visuals and texts, a 2D screen, and other input peripherals that allow
    us limited interactivity.


    The realization of the Metaverse is regarded as a major input-out exchange revolution.
    With the help of hand controllers, voice commands, and eye-tracking features,
    we can easily interact with the visualized data.


    ––––––––


