    \ they are categorized as collectibles. They are subject to capital gains taxes\
    \ because they are sold at a profit. The `cryptocurrency` you use to buy `NFTs`\
    \ can also be taxed if it increased in value after the purchase. Talk with a tax\
    \ professional if you are planning to add non-fungible tokens to your investment\
    \ portfolio.\n\n### Current and future uses of NFTs\n* As digital content\nContent\
