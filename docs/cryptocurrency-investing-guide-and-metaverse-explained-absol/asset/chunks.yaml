    `NAKA` 是平台的原生代币。对于 Nakamoto Games 的 P2E 生态系统至关重要，因为它提供了进入生态系统的访问权限。该代币是该游戏平台的核心。还可以从每周奖池中获得，排名最高的玩家共享奖励。此外，`NAKA`
