    *   The users of social networks. They are us, people who utilize social media
    platforms for different purposes. Signing up for these networks requires us to
    provide personal information that is sometimes compromised due to the lack of
    security measures.


    In the Metaverse, the headsets are likely to gather the users’ spatial data. It
    may raise new privacy issues, which is one of the factors that should be given
    utmost attention by the gatekeepers.


    *   The advertisers. The consumer internet of today generates income from subscription
    revenues and advertising. Some models may still work in the nature of future Metaverse.


    However, some experts believe that traditional business models like `DeFi-powered`
    will be returning.


    But one thing is sure, the business models will influence the decision of the
    interested companies to participate in the future virtual reality realm.


    # The early Metaverse developers


    The year 2022 ushered in with the pronouncements of big players in the industry
    that they are planning to navigate the potential of `Metaverses`, `NFTs`, and
    the `crypto spheres`. This prompted investors and users to study the performance
    of companies that are already offering Metaverse-like experiences.


    We should also be aware of those firms that are only motivated by `FOMO` or fear
    of missing out. While many are serious about launching their own Metaverse, others
    do not have the capability to scale up their networks to the full potential of
    the new realm.


    The rapid technology innovations are also modifying the landscape of the financial
    and investment industries. `Bitcoin`’s blockchain technology initiated this reform
    when it went public in 2009. Soon after, various cryptocurrencies emerged with
    their own blockchain to compete with `Bitcoin`.


    This same blockchain technology is responsible for enabling Metavese’s data continuity
    and functionality.


    ## Meta (former Facebook Inc.)


    The decision of `Facebook` to change its company name to `Meta` triggered enormous
    curiosity about the concept of the Metaverse. Everyone is waiting for how this
    popular social media platform of Mark Zuckerberg will evolve into a Metaverse.
    As early as 2014, `Facebook` has already invested in virtual reality technology.
    It has acquired `Oculus` and is working to create digital avatars and VR headsets,
    allowing users to connect with others while working, traveling, or enjoying entertainment
    activities.


    “We want to get as many people as possible to be able to experience virtual reality
    and be able to jump into the metaverse and to have these social experiences within
    that” Zuckerberg stated during his interview with `CNET`.


