    未来，NFT 有很大可能取代传统的票务或通行证，通过一个唯一的 ID 允许进入限制区域。这减少了纸张的使用和欺诈问题，因为 `NFTs` 所有者对于与目的相关的一切事务都需要单个代币。


    例如，如果你参加一场音乐会，你购买的 NFT 通行证将为你提供以下福利：


    * 进入活动或地点的权限

    * 数字礼品的专属通行证

    * 活动纪念品

    * 获取免费零食的途径

    * 如果 NFT 作为活动股权提供，则让你成为该活动的股东（你可以获得利润分成）


    NFT 铸造平台 `Mintbase` 的创始人 `Carolin Wend` 表示：“让我们感到兴奋的是 NFT 被应用于现实世界。”


    其中一个例子是 2021 年 10 月 26 日在利斯本举办的 `Mintbase` `NEARCon Festival`，该活动使用了智能合约系统 `NEARProtocol`。活动组织者决定实行百分之百的
    NFT 取票，允许参与者质押门务或获得特定利润。


    ### 作为投票文件


    选民在投票前需要出示身份证或证明居住地的文件。`NFTs` 可以用于整合人们的身份并存储如投票投给谁之类的敏感数据。此外，`NFTs` 对于防止选民欺诈和作弊问题有很大帮助。


    ### 购买 NFT 指南


    在获取这些特殊代币之前，这里是你购买它们需要准备的事：


    1. `Digital Wallet` – 它存储你的加密货币和获取的 `NFTs`。

    2. `Cryptocurrency` – 你需要购买 `NFT` 提供者接受作为数字资产支付的加密货币。`Ether` 大多数被卖家接受。

    3. `Crypto exchange` – 找到销售加密货币的安全平台，如 `Coinbase`、`PayPal`、`Kraken` 和 `OpenSea`。


    ### 在哪里购买 NFT


    自从 `NFTs` 在虚拟市场突破以来，出现了许多市场。它们根据主题性质、格式、风格和收藏进行分类。通常分为以下四种类型：


    * **开放市场**。它拥有来自各种来源和创作者的广泛数字资产和艺术品。

    * **收藏品市场**。它专注于电影、体育或艺术收藏品。

    * **精选市场**。其 NFT 选择来自专业或特定的来源。

    * **游戏市场**。它提供与游戏相关的 `NFTs`。


    #### 关注的顶级 NFT 市场：


    ##### OpenSea

    `OpenSea` 是最大的非同质化代币市场。它被认为是数字资产的“eBay”，拥有大量的艺术、照片、体育纪念品、音乐等。该平台支持所有类型的创作者并接受超过
    150 种支付代币。它也是铸造新代币的最佳网站之一。


    你需要在网站上创建账户才能浏览并购买可用非同质化代币收藏。`OpenSea` 以提供稀有的收藏品和数字物品而闻名。


    ##### Rarible

    `Rarible` 是社区驱动的市场，具有创作者 `NFTs` 和作品集的铸造功能。它允许艺术家和创作者提供他们的数字资产和收藏品。它还为创作者未来出售铸造资产提供版税。你可以在这个市场中找到
    `Adobe` 和 `Taco Bell` 等主要品牌。它需要 `Rarible` 代币作为支付。


    ##### Foundation

    `Foundation` 于 2021 年推出。数字艺术的高端市场之一。这是一个专属社区，艺术家在发布艺术品之前需要来自共同艺术家和创作者的邀请。这个由艺术家策划的平台已售出价值
    1 亿美元的 `NFTs`。要购买，用户需要拥有 `Ethereum` 代币的 `crypto wallet`。


    ##### Mintable

    `Mintable` 是一个开放市场，支持各种创作者和艺术家的 NFT 铸造需求。它被视为数字资产市场的“Etsy”。亿万富 `Mark Cuban` 支持这个平台。


    ––––––––


    ![image](img/scene_break.png)


    ##### Known Origin

    `Known Origin` 就像现实世界的艺术画廊，因为它于摄影师和艺术家的 `NFTs`。它提供最昂贵的收藏。


    ##### SuperRare

    `SuperRare` 是另一个高端 NFT 市场。它具有画廊氛围且更具选择性。它提供 3D 图像、视频和艺术。它最近推出了了自己的买卖代币。


    ##### Nifty Gateway

    `Nifty Gateway` 是另一个艺术家的精选平台。它由 `Gemini` 加密交易所支持。它的 `NFTs` 创建在 `Ethereum` 上，被称为“Nifties”。该网站还为倾向于让第三方为他们存储物品的买家托管非同质化代币。你可以在这里查看并购买许多名人
    NFT。它促进了 `Beeple` 和其他数字创作者的热销。


    ##### DraftKings Marketplace

    `DraftKings Marketplace` 是一个体育主题的网站，提供赛车手、足球明星和冰球明星等知名人物的收藏品。它建立在该品牌现有的体育博彩平台基础上。


    ##### NBA Top Shot

    `NBA Top Shot` 是篮球粉丝的 NFT 市场。它拥有最好的比赛亮点和捕捉历史比赛的视频片段。它是 `NBA` 授权的，不为创作者提供铸造选项。在这个平台上，你看到的即得到的。


    收藏品的价格从几美元到几千美元不等。在取得巨大成功后，它现在是一个价值数十亿美元的 `NFTs` 市场。


    ##### Axie Infinity Market

    `Axie Infinity Market` 是一个游戏 NFT 网站可以在出售、购买和铸造热门游戏的资产。它是 `Axie` 在游戏生态系统中成功的关键，市值超过十亿美元。其特有代币
    `Axie Shards` 可以从加密货币交易所和其他 NFT 市场购买。


    其他购买 NFT 的地方还有 `Binance NFT`、`Decentraland`、`Arkane Market`。


