    ![image](d2d_images/scene_break.png)


    What makes Metaverse unique and attractive?


    The Metaverse has the element of decentralization where there is no particular
    ruler. Various companies will develop their own Metaverses but allow the users
    to create and follow their own policies through the Decentralized Autonomous Organization
    (DAO). 


    While there will be companies that will set their own rules, what is certain is
    the rapid advancement of hardware to ensure truly immersive Metaverse experiences.


    To whom does the Metaverse matter?


    *   The gatekeepers. They are the companies that will financially benefit from
    the creation of Metaverses and the development of future VR and AR headsets. The
    fastest ones to materialize their objectives will definitely enjoy the massive
    advantages that this new concept promises. '
