  trans: "\n\nThe Sandbox 的原生代币是 `ERC-20` `SAND`，用于参与边玩赚（`P2E`）游戏、购买数字物品以及创建自己的非同质化标记（`NFTs`）。你可以在市场上出售这些\
    \ `NFTs`，或者在 `Game Maker` 的帮助下将其集成到游戏中。\n\n`SAND` 用于支付 `ASSETS`（或 `NFTs`）、增强游戏体验的设备、化身或游戏访问权限。玩家还可以通过玩游戏获得\
    \ `SAND` 奖励。平台上的所有交易都使用这种代币，包括质押赚利息。\n\n这种原生虚拟货币首次于 2020 年年中在公开交易所上市，价格为 0.051\
    \ 美元。2021 年 11 月，`SAND` 的价值达到了 8.44 美元的另一个新高。在 2021 年，其价值增长了 16,000%。在此期间，The\
    \ Sandbox 还卖了价值超过 1.44 亿美元的商品。在发布期间购买 `SAND` 的投资者，如果他们今天出售，可以获得高达 4,000% 的回报。\n\
