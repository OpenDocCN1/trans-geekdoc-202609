  raw: '“The key to a successful metaverse token is its utility.”- John Dough, Crypto
    Analyst of Currency.com


    Cryptocurrency has become mainstream, thanks to the staying power of Bitcoin.
    Ethereum and other altcoins showed positive performance too in 2021. And because
    of this growing interest in virtual currency, many investors are on the lookout
    for new opportunities to grow their financial portfolios.


    When NFTs or non-fungible tokens within virtual games become popular, the online
    marketplaces began offering digitalized artworks and collectibles. The venture
    proved to be lucrative and created another avenue of income.


    Then comes the metaverse tokens. They are the evolution of cryptocurrencies. They
    are created using blockchain technology, making them generally secure like the
    first generation of crypto coins.


    ![image](d2d_images/image003.png)


    Chapter summary


    *   A walkthrough of the best Metaverse tokens


    *   Types of Metaverse tokens


    *   Why is it important to consider the market cap of the Metaverse tokens?


    *   Top-performing Metaverse coins by market cap (in billions)


    *   Takeaways


    A walkthrough of the best Metaverse tokens


    Every Metaverse platform has its own cryptocurrency, whether it is a gaming, social,
    real-estate, or e-commerce platform. In essence, the metaverse tokens are the
    currency in the 3D platforms. They are the money that is used to pay for assets
    in the Metaverse or to create digital products or services.


    With digital currencies, any user can buy in-game accessories, items, and upgrades,
    buy or sell virtual lands, and other NFTs. Some tokens are only available in the
    respective Metaverses, while most of them can be purchased on crypto exchanges
    and NFT marketplaces.


    Types of Metaverse tokens


    *   Play-to-earn (P2E) coins


    P2E coins are in-game currencies with a real-world value that can be exchanged
    for fiat currencies. When players engage and win the challenges in the game, they
    receive rewards in the form of metaverse tokens.


    *   Metaverse platforms coins.


    They are the utility tokens of the Metaverse platforms or the blockchain’s cryptographic
    assets with unique metadata and identification codes.


    *   3D digital metaverse coins


    They are generally referred to as non-fungible tokens (NFTs) used for commercial
    transactions in the Metaverse.  The 3D platforms provide virtual experiences which
    include e-commerce and P2E gaming. To access them, users need the proprietary
    tokens. 


    Why is it important to consider the market cap of the Metaverse tokens?


    The market cap measures the value of the cryptocurrency. It provides the crypto
    coin or token’s detailed overview, allowing investors to compare its value against
    other cryptocurrencies. It also helps in determining the coin’s volatility and
    potential growth. To find out the market cap, simply multiply the total number
    of mined coins by the single coin’s current price in the market.


    To demonstrate:


    *   Crypto X has 500,000 coins in circulation. Each token is valued at $1. The
    market cap of Crypto X is $500,000.


    *   Crypto Z has 200,000 coins in circulation. Each coin is valued at $2. The
    market cap of Crypto Z is $400,000.


    Like the conventional investment, it is important to consider the market cap or
    the total dollar value of mined coins.


    The larger the coin’s market cap, the greater the stability that it offers to
    investors. Crypto coins with smaller market cap are susceptible to the constant
    changes in the market, creating dramatic gains or losses.


    Generally, there are three types of market capitalization – large-cap (companies
    with $10 billion or more), middle or mid-cap (with $2 to $10 billion), and small-cap
    (with $300 million to $2 billion).


    *   The large-cap companies are the major players in the industry and have been
    around for a longer time.


    While they do not necessarily guarantee huge returns within a short-term investment
    period, the longer-term investment rewards their investors.


    *   The mid-cap companies are those showing a rapid growth in the industry. Their
    potentials are great and can give a good return on investment.


    *   The small-cap companies are younger in the industries or serving a niche market.
    Typically, they have fewer resources and are vulnerable to economic slowdowns.


    ![image](d2d_images/image001.png)


    Some terms to remember 


    Circulating supply–to the number of tokens that have been mined


    Fully-diluted supply – the expected number of tokens that will be mined


    1\. ApeCoin


    The token


    ApeCoin is a governance and utility token of the APE Ecosystem. This ERC-20 token
    empowers and incentivizes the builders of Web3 in the decentralized metaverse. 
    It is an ERC-20 token that is secured by the proof-of-work (POW) consensus mechanism
    of the Ethereum blockchain. 


    The total supply of this token is fixed at 1 billion and is all minted. During
    the launching on March 17, 2022, about 30.25% of them were circulated. Every 48
    months, this percentage will increase to allow investors to buy and trade them.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ![image](d2d_images/image014.png)ApeCoin Value Statistics (\*subject to change)


    1 ApeCoin– $17.40


    1 ApeCoin– 0.0004529 Bitcoin


    1 ApeCoin – 0.006201 ETH


    Market Capitalization - $4.9 billion


    Fully diluted market cap - $ 17.4 billion


    Circulating Supply – 284.8 million ApeCoin


    ––––––––


    ![image](d2d_images/scene_break.png)


    The platform


    APE was inspired by the Bored Ape Yacht Club Project of the Yuga Lab. This decentralized
    project is supported by the APE Foundation to maintain an inclusive, fair ecosystem
    that allows open, permission-less collaboration in governance. The proposals of
    the APE Foundation are approved by the members of the community. Holders of APE
    can vote on how the ApeCoin DAO Ecosystem Fund is utilized.


    2\. MANA


    The token


    Ethereum-based MANA is the native token of Decentraland. It held the record of
    being the first metaverse crypto, giving it the time to establish authority in
    the market. Holders of this token can buy parcels of lands and in-game items in
    the form of NFTs. The token also provides the right to participate in the governance
    of the platform and influence the changes in the game itself.


    When it was launched in 2018, one MANA was at $0.025. It jumped from less than
    $1 in October to $5.90 in November, gaining an overall 4,000% growth at the end
    of 2021 after successfully attracting high-profile investors. According to CoinMarketCap,
    investors who purchase tokens in 2017 would enjoy up to 12,000% ROI if they choose
    to sell their MANA. It is one of the best metaverse tokens to invest in.


    ![image](d2d_images/image021.png)


    MANA Value Statistics (\*subject to change)


    1 MANA – $1.86


    1 MANA – 0.00004852 Bitcoin


    1 MANA – 0.0006644 ETH


    Market Capitalization - $3.4 billion


    Fully diluted market cap - $ 4.0 billion


    Circulating Supply – 1.84 billion MANA


    The platform


    Decentraland is powered by the Ethereum blockchain. It is a leading virtual reality
    platform with over 300,000 users monthly who can freely access the 3D world by
    browsing. With over 90,000 plots that are represented by NFTs, Decentraland is
    a leading metaverse project that allows users to create, experience, and monetize
    their content.


    Its decentralized nature supports the social aspect of the growing user base.
    The active ecosystem of this platform is composed of businesses and individuals
    who enjoy creating communities, structures, space adventures, and scenes.


    *   The most notable was when the Government of Barbados opened its metaverse
    embassy on the platform, becoming the first country to invest in the virtual world.


    *   It was followed by The Metaverse Group, a subsidiary of Tokens.com purchased
    Decentraland’s most expensive space for $2.4 million for their e-commerce businesses
    and digital fashion shows.


    *   Other big names inside the Decentraland are Samsung and JPMorgan Chase. The
    cheapest plot of land in Decentraland is around 2.88 Ether ($8,500).


    3\. SAND


    The token'
