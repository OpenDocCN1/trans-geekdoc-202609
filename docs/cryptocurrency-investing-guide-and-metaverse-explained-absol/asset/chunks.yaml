    # NFT 在元宇宙中的角色


    ![image](img/chapter_title_below.png)


    “NFT 是网络的产物。因此你拥有自己的社区和所属物品，你正在创建的 NFT 将成为该社区的产物。”—— Chris Dixon - 美国互联网企业家和投资者


    元宇宙经济很大程度上依赖于非同质化代币（NFT）。对于下一代社会，需要数字属性认证来显示所有权。我们在元宇宙中购买的物品，如房屋、土地、服装、家具或车辆，也需要在多个虚拟领域之间自由交易。另一个让
    NFT 变得重要的因素是它能够很容易地转移给另一个所有者。


    NFT 是存储在区块链上的数字所有权记录。它们实现了对身份、财产和物品的稳健且去中心化的认证。每一个 NFT 都有一个相应的加密密钥，没有人可以破坏、复制或删除。


    目前，它与数字艺术品相关联，但 NFT 在社会合约和独立所有权方面的巨大作用正推动着未来元宇宙的成功。


    行业专家将 NFT 视为元宇宙的主要价值驱动力以及未来的变革性经济力量。为了更好地理解 NFT 在新兴元宇宙中的作用，我们需要了解这一类数字资产。


    ![image](img/image022.png)


    ## 本章总结


    * 什么是非同质化代币（NFT）

    * NFT 是如何创建的？

    * 为什么 NFT 变得如此流行

    * NFT 是如何工作的？

    * 核心启示


    ## 非同质化代币（NFT）详解


    非同质化代币或 NFT 出现于 2014 年，但直到最近才声名大噪。在早期，Instagram 上已经有了证券化的数字艺术版本和标志性的 NBA 比赛视频片段。


    这些数字资产使用加密货币和其他支付模式在线出售。自 2017 年以来，售出的 NFT 价值已达 1.74 亿美元并持续增长。


    与其他具有无限供应量的数字创作相比，NFT 的发行量非常有限。另一个让 NFT 与其他数字商品不同的是它们内置的认证功能，这让买家确保他们购买的是正品。收藏家将这种所有权证明称为“数字炫耀权”。


    最贵的 NFT 是艺术家 Pak 的《Merge》。它以创纪录的 9180 万美元的价格售出。接下来是 Mike “Beeple” Winklemann 的每日绘画，名为《EVERYDAYS:
    The First 5000 days》。该收藏在佳士拍卖期间以 6930 万美元售出。


    “本质上，NFT 创造了数字稀缺性，”Yellow Umbrella Ventures 董事 Arry Yu 说。


    NFT 具有与加密货币类似的唯一标识，因为它们是使用相同的底层软件创建的。


    然而，相似之处仅此此。每个 NFT 都带有数字签名，使其具有非同质性，或无法与其他交换。加密货币和实体货币是同质的，这意味着它们可以交换或交易。


    ## NFT 是如何创建的？


    第一个 NFT 是“Quantum”。它是 Kevin McCoy 和 Anil Dash 于 2014 年 5 月创建的。该令牌是 McCoy 妻子 Jennifer
    的视频片段。他在 Namecoin 区块链上注册了它。Dash 以 4 元买了它。这对先驱将 NFT 技术称为“变现图形”。


    尝试创建一个大型 NFT 项目的情况发生在 2015 年 10 月。Etheria 项目由 457 个六边形砖组成，但未售出。2017 年，当在线游戏 CryptoKies
    开始将其猫货币化时，人们对可交易 NFT 的意识提高。市场开始获得关注。5 年后，Etheria 项目剩余的砖块（发布当天价值 1 ETH（即 0.43 美元）以惊人的
    140 万美元售罄。


    另一个著名的非同质化代币例子是 CryptoPunks，这是一个存储在以太坊上的 10,000 个角色集合。这个项目启发了加密艺术运动。


    它还塑造了开放标准接口 `ERC721` 的开发，该接口驱动着大多数数字收藏品和艺术。这一标准赋予了 NFT 货币价值。


