    # ## 3.2 A Simple 2-out-of-2 Scheme


    Believe it or not, we have already seen a simple secret-sharing scheme! In fact,
    it might even be best to think of one-time pad as the simplest secret-sharing
    scheme.


    | | $\mathcal{M} = \{0, 1\}^\ell$ | Share(m): |

    |---|---|---|

    | Construction 3.5 (2-out-of-2 TSSS) | $t = 2$ | $s_1 \leftarrow \{0, 1\}^\ell$
    |

    | | $n = 2$ | $s_2 := s_1 \oplus m$ |

    | | | return $(s_1, s_2)$ |

    | | | Reconstruct($s_1, s_2$): return $s_1 \oplus s_2$ |


    Since it''s a 2-out-of-2 scheme, the only authorized set of users is $\{1, 2\}$,
    so Reconstruct is written to expect both shares $s_1$ and $s_2$ as its inputs.
    Correctness follows easily from what we''ve already learned about the properties
    of xor.


    Example If we want to share the string $m = 1101010001$ then the Share algorithm
    might choose


    ```

    s_1 := 0110000011

    s_2 := s_1 \oplus m

    = 0110000011 \oplus 1101010001 = 1011010010.

    ```


    Then the secret can be reconstructed by xoring the two shares together, via:


    ```

    s_1 \oplus s_2 = 0110000011 \oplus 1011010010 = 1101010001 = m.

    ```


    Remember that this example shows just one possible execution of Share(1101010001),
    but Share is a randomized algorithm and many other values of $(s_1, s_2)$ are
    possible.


    # **Theorem 3.6** *Construction 3.5 is a secure 2-out-of-2 threshold secret-sharing
    scheme.*


    # **Proof** Let $\Sigma$ denote Construction 3.5. We will show that $\mathcal{L}^\Sigma_{\text{tsss-L}}
    \equiv \mathcal{L}^\Sigma_{\text{tsss-R}}$ using a hybrid proof.


    ```

    $\mathcal{L}^\Sigma_{\text{tsss-L}} :$

    SHARE($m_L, m_R, U$):

    if $|U| \ge 2$: return err

    $s_1 \leftarrow \{0, 1\}^\ell$

    $s_2 := s_1 \oplus m_L$

    return $\{s_i \mid i \in U\}$

    ```


    As usual, the starting point is $\mathcal{L}^\Sigma_{\text{tsss-L}}$. shown here
    with the details of the secret-sharing scheme filled in (and the types of the
    subroutine arguments omitted to reduce clutter).'
