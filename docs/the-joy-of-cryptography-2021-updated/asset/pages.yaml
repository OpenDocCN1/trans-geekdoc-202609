    \nWe showed that L_hyb-(i-1) ≈ L_hyb-i, and therefore:\n\n$\\mathcal{L}^G_{\\\
    text{prg-real}} \\equiv \\mathcal{L}_{\\text{hyb-0}} \\approx \\mathcal{L}_{\\\
    text{hyb-1}} \\approx \\cdots \\approx \\mathcal{L}_{\\text{hyb-q}} \\equiv \\\
    mathcal{L}^G_{\\text{prg-rand}}$\n\nThis shows that $\\mathcal{L}^G_{\\text{prg-real}}\
    \ \\approx \\mathcal{L}^G_{\\text{prg-rand}}$, so G is a secure PRG.\n\n# A Theoretical\
    \ Construction of a PRF from a PRG\n\nWe have already seen that it is possible\
    \ to feed the output of a PRG back into the PRG again, to extend its stretch (Claim\
    \ 5.7). This is done by making a long chain (like a linked list) of PRGs. The\
    \ trick to constructing a PRF from a PRG is to chain PRGs together in a binary\
    \ tree (similar to Exercise 5.8(a)). The leaves of the tree correspond to final\
    \ outputs of the PRF. If we want a PRF with an exponentially large domain (e.g.,\
    \ in = λ), the binary tree itself is exponentially large! However, it is still\
    \ possible to compute any individual leaf efficiently by simply traversing the\
    \ tree from root to leaf. This tree traversal itself is the PRF algorithm. This\
    \ construction of a PRF is due to Goldreich, Goldwasser, and Micali, in the paper\
    \ that defined the concept of a PRF."
