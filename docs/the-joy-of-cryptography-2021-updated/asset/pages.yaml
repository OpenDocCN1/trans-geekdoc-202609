  md: "To extend ECBC-MAC to messages of *any* length (not necessarily a multiple\
    \ of the block length), one can use a padding scheme as in the case of encryption.1\n\
    \n# ## 10.4 Encrypt-Then-MAC\n\nOur motivation for studying MACs is that they\
    \ seem useful in constructing a CCA-secure encryption scheme. The idea is to add\
    \ a MAC to a CPA-secure encryption scheme. The decryption algorithm can raise\
    \ an error if the MAC is invalid, thereby ensuring that adversarially-generated\
    \ (or adversarially-modified) ciphertexts are not accepted. There are several\
    \ natural ways to combine a MAC and encryption scheme, but *not all are secure!*\
    \ (See the exercises.) The safest way is known as encrypt-then-MAC:\n\nConstruction\
    \ 10.9 (Enc-then-MAC) Let E denote an encryption scheme, and M denote a MAC scheme\
    \ where E.C ⊆ M.M (i.e., the MAC scheme is capable of generating MACs of ciphertexts\
    \ in the E scheme). Then let EtM denote the **encrypt-then-MAC** construction\
    \ given below:\n\n```\n```\nK = E.K x M.K                         Enc((ke, km),\
    \ m):\nM = E.M                                c := E.Enc(ke, m)\nC = E.C x M.T\
    \                          t := M.MAC(km, c)\n                               \
    \        return (c, t)\nKeyGen:\nke <- E.KeyGen                         Dec((ke,\
    \ km), (c, t)):\nkm <- M.KeyGen                         if t != M.MAC(km, c):\n\
    return (ke, km)                          return err\n                        \
    \               return E.Dec(ke, c)\n```\n```\n\nImportantly, the scheme computes\
    \ a MAC of the CPA ciphertext, and not of the plaintext! The result is a CCA-secure\
    \ encryption scheme:\n\n**Claim 10.10** If E has CPA security and M is a secure\
    \ MAC, then EtM (Construction 10.9) has CCA security.\n\n*Proof* As usual, we\
    \ prove the claim with a sequence of hybrid libraries:"
