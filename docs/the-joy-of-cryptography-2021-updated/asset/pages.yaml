- pgno: 229
  md: "These constraints are equivalent to choosing the salt after x and x' are chosen,\
    \ and a collision should be negligibly likely under such circumstances.\n\nThe\
    \ definition can be stated more formally:\n\n# Definition 12.6 (UHF) A hash function\
    \ H with set of salts S is called a **universal hash function (UHF)** if L_uhf-real^H\
    \ ≅ L_uhf-fake^H, where:\n\n```\nL_uhf-real^H\nTEST(x, x' ∈ {0, 1}*):\n  s ← S\n\
    \  b := [ H(s, x) =? H(s, x') ]\n  return (s, b)\n```\n\n```\nL_uhf-fake^H\nTEST(x,\
    \ x' ∈ {0, 1}*):\n  s ← S\n  return (s, false)\n```\n\nThis definition is similar\
    \ in spirit to the formal definition of collision resistance (Definition 11.1).\
    \ Just like that definition, this one is cumbersome to use in a security proof.\
    \ When using a hash function, one typically does not explicitly check for collisions,\
    \ but instead just proceeds as if there was no collision.\n\nIn the case of UHFs,\
    \ there is a different and helpful way of thinking about security. Consider a\
    \ **\"blind collision-resistance\"** game, where you try to find a collision under\
    \ H without access to the salt, and even _without seeing the outputs of H_! It\
    \ turns out that if H is a UHF, then it is hard to find collisions in such a game:\n\
    \n# Claim 12.7 If H is a UHF, then the following libraries are indistinguishable:\n\
    \n```\nL_bcr-real^H\ns ← S\nH_inv := empty assoc. array\nTEST(x ∈ {0, 1}*):\n\
    \  y := H(s, x)\n  if H_inv[y] defined and H_inv[y] ≠ x:\n    return H_inv[y]\n\
    \  H_inv[y] := x\n  return false\n```\n\n```\nL_bcr-fake^H\nTEST(x ∈ {0, 1}*):\n\
    \  return false\n```\n\nIn these libraries, the calling program chooses inputs\
    \ x to the UHF. The L_bcr-real library maintains a private record of all of the\
    \ x values and their hashes, in the form of a reverse lookup table. H_inv[y] will\
    \ hold the value x that was hashed to result in y.\n\nIf the calling program calls\
    \ TEST(x) on a value that collides with a previous x', then L_bcr-real will respond\
    \ with this x' value (the purpose of this is just to be helpful to security proofs\
    \ that use these libraries); otherwise it will respond with false, giving no information\
    \ about s or H(s, x). The other library always responds with false. Hence, the\
    \ two are indistinguishable only if finding collisions is hard.\n\nto-do Proof\
    \ to come. It's not hard but tedious."
