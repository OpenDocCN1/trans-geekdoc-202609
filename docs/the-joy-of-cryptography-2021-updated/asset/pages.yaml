  md: "```\na \\leftarrow \\mathbb{Z}_n\nA := g^a\ncount = 0\n\nGETPK():\n    return\
    \ A\n\nQUERY(M \\in \\mathbb{G}):\n    count : count + 1\n    if count > 1: return\
    \ null\n    b, c \\leftarrow \\mathbb{Z}_n\n    B := g^b ; C := g^c\n    X :=\
    \ M \\cdot C\n    return (B, X)\n```\n\nAs before, since the main body of QUERY\
    \ is only reachable once, we can move the choice of B and C into that subroutine\
    \ instead of at initialization time.\n\n```\n\\mathcal{L}_{\\text{pk-ots}\\$-rand}\n\
    a \\leftarrow \\mathbb{Z}_n\nA := g^a\ncount = 0\n\nGETPK():\n    return A\n\n\
    QUERY(M \\in \\mathbb{G}):\n    count : count + 1\n    if count > 1: return null\n\
    \    b, x \\leftarrow \\mathbb{Z}_n\n    B := g^b ; X := g^x\n    return (B, X)\n\
    ```\n\nWhen b is sampled uniformly from \\mathbb{Z}_n, the expression B = g^b\
    \ is a uniformly distributed element of \\mathbb{G}. Also recall that when C is\
    \ a uniformly distributed element of \\mathbb{G}, then M \\cdot C is uniformly\
    \ distributed – this is analogous to the one-time pad property (see Exercise 2.5).\
    \ Applying this change gives the library to the left.\n\nIn the final hybrid,\
    \ the response to QUERY is a pair of uniformly distributed group elements (B,\
    \ X). Hence that library is exactly \\mathcal{L}_{\\text{pk-ots}\\$-rand}, as\
    \ desired.\n\n# 15.4 Hybrid Encryption\n\nAs a rule, public-key encryption schemes\
    \ are much more computationally expensive than symmetric-key schemes. Taking ElGamal\
    \ as a representative example, computing g^b in a cryptographically secure cyclic\
    \ group is considerably more expensive than one evaluation of AES. As the plaintext\
    \ data increases in length, the difference in cost between public-key and symmetric-key\
    \ techniques only gets worse.\n\nA clever way to minimize the cost of public-key\
    \ cryptography is to use a method called hybrid encryption. The idea is to use\
    \ the expensive public-key scheme to encrypt a temporary key for a symmetric-key\
    \ scheme. Then use the temporary key to (cheaply) encrypt the large plaintext\
    \ data."
