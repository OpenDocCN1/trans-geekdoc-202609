- pgno: 27
  md: '# Discussion


    +   Isn’t there a paradox? Claim 1.2 says that c can always be decrypted to get
    m, but Claim 1.3 says that c contains no information about m! The answer to this
    riddle is that Claim 1.2 talks about what can be done with knowledge of the key
    k (Alice & Bob’s perspective). Claim 1.3 talks about the output distribution of
    the EAvesdrop algorithm, which doesn’t include k (Eve’s perspective). In short,
    if you know k, then you can decrypt c to obtain m; if you don’t know k, then c
    carries no information about m (in fact, it looks uniformly distributed). This
    is because m, c, k are all correlated in a delicate way.3


    +   Isn’t there another paradox? Claim 1.3 says that the output of EAvesdrop(m)
    doesn’t depend on m, but we can see the EAvesdrop algorithm literally using its
    argument m right there in the last line! The answer to this riddle is perhaps
    best illustrated by the previous illustrations of the EAvesdrop(010) and EAvesdrop(111)
    distributions. The two tables of values are indeed different (so the choice of
    m ∈ {010, 111} clearly has some effect), but they represent the same probability
    distribution (since order doesn’t matter). Claim 1.3 considers only the resulting
    probability distribution.


    +   You probably think about security in terms of a concrete “goal” for the attacker:
    recover the key, recover the plaintext, etc. Claim 1.3 doesn’t really refer to
    attackers in that way, and it certainly doesn’t specify a goal. Rather, we are
    thinking about security by comparing to some hypothetical “ideal” world. I would
    be satisfied if the attacker sees only a source of uniform bits, because in this
    hypothetical world there are no keys and no plaintexts to recover! Claim 1.3 says
    that when we actually use OTP, it looks just like this hypothetical world, from
    the attacker’s point of view. If we imagine any “goal” at all for the attacker
    in this kind of reasoning, it’s to detect that ciphertexts don’t follow a uniform
    distribution. By showing that the attacker can’t even achieve this modest goal,
    it shows that the attacker couldn’t possibly achieve other, more natural, goals
    like key recovery and plaintext recovery.


    # Limitations


    One-time pad is incredibly limited in practice. Most notably:


    +   Its keys are as long as the plaintexts they encrypt. This is basically unavoidable
    (see Exercise 2.11) and leads to a kind of chicken-and-egg dilemma in practice:
    If two users want to privately convey a λ-bit message, they first need to privately
    agree on a λ-bit string.


    +   A key can be used to encrypt only one plaintext (hence, “one-time” pad); see
    Exercise 1.6. Indeed, we can see that the EAvesdrop subroutine in Claim 1.3 provides
    no way for a caller to guarantee that two plaintexts are encrypted with the same
    key, so it is not clear how to use Claim 1.3 to argue about what happens in one-time
    pad when keys are intentionally reused in this way.


    3This correlation is explored further in Chapter 3.'
