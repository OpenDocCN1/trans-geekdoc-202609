    # Discussion


    One way to “authenticate a message to some context \(d\)” is to encrypt \(m||d\)
    instead of just \(m\) (in an AE scheme). This would indeed work! Including \(d\)
    as part of the plaintext would indeed authenticate it, but it would also _hide_
    it. The point of differentiating between plaintext and associated data is that
    we assume the associated data is _shared context_ between both participants. In
    other words, we assume that the sender and receiver both already know the context
    \(d\). Therefore, _hiding \(d\) is overkill — only authentication is needed. By
    making a distinction between plaintext and associated data separately in AEAD,
    the **ciphertext length can depend only on the length of the plaintext**, and
    not depend on the length of the associated data.


    The fact that associated data \(d\) is public is reflected in the fact that the
    calling program chooses it in the security definition.


    “Standard” AE corresponds to the case where \(d\) is always empty: all ciphertexts
    are authenticated to the same context.


    # 12.2 Achieving AE/AEAD


    The Encrypt-then-MAC construction (Construction 10.9) has the property that the
    attacker cannot generate ciphertexts that decrypt correctly. Even though we introduced
    encrypt-then-MAC to achieve CCA security, it also achieves the stronger requirement
    of AE.


    **Claim 12.3** _If E has CPA security and M is a secure MAC, then EtM (Construction
    10.9) has AE security._


