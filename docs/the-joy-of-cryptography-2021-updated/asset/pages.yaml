    algorithms into the template of the CTXT subroutine above, the two implementations
    of CTXT induce identical behavior in every calling program."


    In a few pages, we introduce formal notation and definitions for the concepts
    introduced here. In particular, both the calling program and subroutine can be
    randomized algorithms, so we should be careful about what we mean by "identical
    behavior."


    **Example** _One-time pad is defined with KeyGen sampling k uniformly from_ {0,
    1}^λ _and_ Enc(_k_, _m_) = _k_ ⊕ _m_. It satisfies our new security property since,
    when we plug in this algorithms into the above template, we get the following
    two subroutine implementations:


    ```

    CTXT(m):

    _k_ ← {0, 1}^λ // KeyGen of OTP

    _c_ := _k_ ⊕ _m_ // Enc of OTP

    return _c_

    ```


    ```

    CTXT(m):

    _c_ ← {0, 1}^λ // C of OTP

    return _c_

    ```


    and these two implementations have the same effect on all calling programs.


    # "Left-vs-Right" Style of Security Definition


    Here’s a different intuitive idea of security:


    > "an encryption scheme is a good one if encryptions of _m_L look like encryptions
    of _m_R to an attacker (for all possible _m_L, _m_R)"


    As above, we are considering a scenario where the attacker sees some ciphertext(s).
    These ciphertexts are generated with some key; where does that key come from?
    These ciphertexts encrypt either some _m_L or some _m_R; where do _m_L and _m_R
    come from? We can answer these questions in a similar way as the previous example.
    Plaintexts _m_L and _m_R can be chosen by the attacker. The key is chosen according
    to KeyGen so that it remains secret from the attacker (and is used to generate
    only one ciphertext).


    > "an encryption scheme is a good one if encryptions of _m_L look like encryptions
    of _m_R to an attacker, when each key is secret and used to encrypt only one plaintext,
    even when the attacker chooses _m_L and _m_R."


    As before, we formalize this idea by imagining the attacker as a program that
    calls a particular interface. This time, the attacker will choose **two** plaintexts
    _m_L and _m_R, and get a ciphertext in return.2 Depending on whether _m_L or _m_R
    is actually encrypted, those interfaces are implemented as follows:


    ```

    EAVESDROP(_m_L, _m_R ∈ Σ.M):

    _k_ ← Σ.KeyGen

    _c_ := Σ.Enc(_k_, _m_L)

    return _c_

    ```


    ```

    EAVESDROP(_m_L, _m_R ∈ Σ.M):

    _k_ ← Σ.KeyGen

    _c_ := Σ.Enc(_k_, _m_R)

    return _c_

    ```


    2There may be other reasonable ways to formalize this intuitive idea of security.
    For example, we might choose to give the attacker _two_ ciphertexts instead of
    one, and demand that the attacker can’t determine which of them encrypts _m_L
    and which encrypts _m_R. See Exercise 2.15.'
