- pgno: 25
  md: "# # Security\n\nSuppose Alice and Bob are using one-time pad but are concerned\
    \ that an attacker sees their ciphertext. They can't presume what an attacker\
    \ will do after seeing the ciphertext. But they would like to say something like,\
    \ “because of the specific way the ciphertext was generated, it doesn’t reveal\
    \ any information about the plaintext to the attacker, no matter what the attacker\
    \ does with the ciphertext.”\n\nWe must first precisely specify how the ciphertext\
    \ is generated. The Enc algorithm already describes the process, but it is written\
    \ from the point of view of Alice and Bob. When talking about security, we have\
    \ to think about what Alice and Bob do, but from the eavesdropper’s point of view!\
    \ From Eve’s point of view, Alice uses a key that was chosen in a specific way\
    \ (uniformly at random), she encrypts a plaintext with that key using OTP, and\
    \ finally reveals only the resulting ciphertext (and not the key) to Eve.\n\n\
    More formally, from Eve’s perspective, seeing a ciphertext corresponds to receiving\
    \ an output from the following algorithm:\n\n```\nEAVESDROP(m ∈ {0, 1}^λ):\n \
    \ k ← {0, 1}^λ\n  c := k ⊕ m\n  return c\n```\n\nIt’s crucial that you appreciate\
    \ what this EAVESDROP algorithm represents. It is meant to describe **not what\
    \ the attacker does**, but rather the process (carried out by Alice and Bob!)\
    \ that produces **what the attacker sees**. We always treat the attacker as some\
    \ (unspecified) process that receives output from this EAVESDROP algorithm. Our\
    \ goal is to say something like “the output of EAVESDROP doesn’t reveal the input\
    \ m.”\n\nEAVESDROP is a *randomized algorithm* — remember that “k ← {0, 1}^λ”\
    \ means to sample k from the uniform distribution on λ-bit strings. If you call\
    \ EAVESDROP several times, even on the same input, you are likely to get different\
    \ outputs. Instead of thinking of “EAVESDROP(m)” as a single string, you should\
    \ think of it as a *probability distribution* over strings. Each time you call\
    \ EAVESDROP(m), you see a **sample** from that distribution.\n\n**Example** Let’s\
    \ take λ = 3 and work out by hand the distributions EAVESDROP(010) and EAVESDROP(111).\
    \ In each case EAVESDROP chooses a value of k uniformly in {0, 1}^3 — each of\
    \ the possible values with probability 1/8. For each possible choice of k, we\
    \ can compute what the output of EAVESDROP(c) will be:\n\n| Pr | k | output c\
    \ = k ⊕ 010 || Pr | k | output c = k ⊕ 111 |\n|---|---|---|---|---|---|\n| % |\
    \ 000 | 010 || % | 000 | 111 |\n| % | 001 | 011 || % | 001 | 110 |\n| % | 010\
    \ | 000 || % | 010 | 101 |\n| % | 011 | 001 || % | 011 | 100 |\n| % | 100 | 110\
    \ || % | 100 | 011 |\n| % | 101 | 111 || % | 101 | 010 |\n| % | 110 | 100 || %\
    \ | 110 | 001 |\n| % | 111 | 101 || % | 111 | 000 |"
  merge: -1
  img_proc: true
- pgno: 26
  md: 'So the distribution eavesdrop(010) assigns probability 1/8 to 010, probability
    1/8 to 011, and so on.


    In this example, notice how every string in {0, 1}^3 appears *exactly once* in
    the c column of eavesdrop(010). This means that eavesdrop assigns probability
    1/8 to every string in {0, 1}^3, which is just another way of saying that the
    distribution is the *uniform distribution* on {0, 1}^3. The same can be said about
    the distribution eavesdrop(111), too. Both distributions are just the uniform
    distribution in disguise!


    There is nothing special about 010 or 111 in these examples. For any \(\lambda\)
    and any \(m \in \{0, 1\}^\lambda\), the distribution eavesdrop(m) is the uniform
    distribution over \(\{0, 1\}^\lambda\).


    # **Claim 1.3** For every \(m \in \{0, 1\}^\lambda\), the distribution eavesdrop(m)
    is the **uniform distribution** on \(\{0, 1\}^\lambda\). Hence, for all \(m, m''
    \in \{0, 1\}^\lambda\), the distributions eavesdrop(m) and eavesdrop(m'') are
    identical.


    **Proof** Arbitrarily fix \(m, c \in \{0, 1\}^\lambda\). We will calculate the
    probability that eavesdrop(m) produces output c. That event happens only when


    ```

    c = k \oplus m \Longleftrightarrow k = m \oplus c.

    ```


    The equivalence follows from the properties of xor given in Section 0.3. That
    is,


    ```

    Pr[eavesdrop(m) = c] = Pr[k = m \oplus c],

    ```


    where the probability is over uniform choice of \(k \leftarrow \{0, 1\}^\lambda\).


    We are considering a specific choice for m and c, so there is **only one** value
    of k that makes \(k = m \oplus c\) true (causes m to encrypt to c), and that value
    is exactly \(m \oplus c\). Since k is chosen uniformly from \(\{0, 1\}^\lambda\),
    the probability of choosing the particular value \(k = m \oplus c\) is \(1/2^\lambda\).


    In summary, for every m and c, the probability that eavesdrop(m) outputs c is
    exactly \(1/2^\lambda\). This means that the output of eavesdrop(m), for any m,
    follows the uniform distribution.


    One way to interpret this statement of security in more down-to-earth terms:


    > If an attacker sees a *single* ciphertext, encrypted with one-time pad, where
    the key is chosen uniformly and kept secret from the attacker, then the ciphertext
    appears uniformly distributed.


    Why is this significant? Taking the eavesdropper''s point of view, suppose someone
    chooses a plaintext m and you get to see the resulting ciphertext — a sample from
    the distribution eavesdrop(m). But this is a distribution that you can sample
    from yourself, even if you don''t know m! You could have chosen a totally different
    \(m''\) and run eavesdrop(\(m''\)) in your imagination, and this would have produced
    the same distribution as eavesdrop(m). The “real” ciphertext that you see *doesn’t
    carry any information about m* if it is possible to sample from the same distribution
    without even knowing m!'
