  md: 'Previously in Claim 1.3 we argued that one-time-pad ciphertexts follow the
    uniform distribution. This actually shows that OTP satisfies the uniform ciphertexts
    definition:


    # Claim 2.7 (OTP rule)


    One-time pad satisfies the one-time uniform ciphertexts property. In other words:


    ```

    L_otp-real

    EAVESDROP(m ∈ {0, 1}^λ):

    k ← {0, 1}^λ // OTP.KeyGen

    return k ⊕ m // OTP.Enc(k, m)


    =


    L_otp-rand

    EAVESDROP(m ∈ {0, 1}^λ):

    c ← {0, 1}^λ // OTP.C

    return c

    ```


    Because this property of OTP is quite useful throughout the course, I’ve given
    these two libraries special names (apart from $\mathcal{L}_{\text{ots\$-real}}^{\text{OTP}}$
    and $\mathcal{L}_{\text{ots\$-rand}}^{\text{OTP}}$).


    # Discussion, Pitfalls


    It is a common pitfall to imagine the calling program $\mathcal{A}$ being *simultaneously*
    linked to both libraries, but this is not what the definition says. The definition
    of $\mathcal{L}_1 \equiv \mathcal{L}_2$ refers to two different executions: one
    where $\mathcal{A}$ is linked only to $\mathcal{L}_1$ for its entire lifetime,
    and one where $\mathcal{A}$ is linked only to $\mathcal{L}_2$ for its entire lifetime.
    There is never a time where some of $\mathcal{A}$’s subroutine calls are answered
    by $\mathcal{L}_1$ and others by $\mathcal{L}_2$. This is an especially important
    distinction when $\mathcal{A}$ makes several subroutine calls in a single execution.


    Another common pitfall is confusion about the difference between the algorithms
    of an encryption scheme (e.g., what is shown in Construction 1.1) and the libraries
    used in a security definition (e.g., what is shown in Definition 2.6). The big
    difference is:


    +   ▶ The algorithms of the scheme show a regular user’s view of things. For example,
    the Enc algorithm takes two inputs: a key and a plaintext. Is there any way of
    describing an algorithm that takes two arguments other than writing something
    like Construction 1.1?


    +   ▶ The libraries capture the attacker’s view of of a particular scenario, where
    the users *use the cryptographic algorithms in a very specific way*. For example,
    when we talk about security of encryption, we don’t guarantee security when Alice
    lets the attacker choose her encryption key! But letting the attacker choose the
    plaintext is fine; we can guarantee security in that scenario. That’s why Definition
    2.5 describes a subroutine that calls Enc on a plaintext that is chosen by the
    calling program, but on a key $k$ chosen by the library.


    A security definition says that some task (e.g., distinguishing ciphertexts from
    random junk) is impossible, when the attacker is allowed certain influence over
    the inputs to the algorithms (e.g., full choice of plaintexts, but no influence
    over the key), and is allowed to see certain outputs from those algorithms (e.g.,
    ciphertexts).


    It’s **wrong** to summarize one-time secrecy as: “I’m not allowed to choose what
    to encrypt, I have to ask the attacker to choose for me.” The correct interpretation
    is: “If I encrypt only one plaintext per key, then I am safe to encrypt things
    even if the attacker sees the resulting ciphertext and even if she has some influence
    or partial information on what I’m encrypting, because this is the situation captured
    in the one-time secrecy library.”'
