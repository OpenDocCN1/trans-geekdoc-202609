  md: '# # Pseudorandom Ciphertexts


    We can also modify the pseudorandom-ciphertexts security definition (CPA$ security)
    in a similar way:


    **Definition 9.2 (CCA$ security)** Let \(\Sigma\) be an encryption scheme. We
    say that \(\Sigma\) has **pseudorandom ciphertexts in the presence of chosen-ciphertext
    attacks (CCA$ security)** if \(\mathcal{L}^\Sigma_{\text{cca\$-real}} \approx
    \mathcal{L}^\Sigma_{\text{cca\$-rand}}\), where:


    | \(\mathcal{L}^\Sigma_{\text{cca\$-real}}\) | \(\mathcal{L}^\Sigma_{\text{cca\$-rand}}\)
    |

    | :--- | :--- |

    | \(k \leftarrow \Sigma.\)KeyGen<br>\(S := \emptyset\)<br>\(\text{CTXT}(m \in
    \Sigma.\mathcal{M})\):<br>\(c := \Sigma.\text{Enc}(k, m)\)<br>\(S := S \cup \{c\}\)<br>return
    \(c\)<br>\(\text{DECRYPT}(c \in \Sigma.C)\):<br>if \(c \in S\) return err<br>return
    \(\Sigma.\text{Dec}(k, c)\) | \(k \leftarrow \Sigma.\)KeyGen<br>\(S := \emptyset\)<br>\(\text{CTXT}(m
    \in \Sigma.\mathcal{M})\):<br>\(c \leftarrow \Sigma.C(|m|)\)<br>\(S := S \cup
    \{c\}\)<br>return \(c\)<br>\(\text{DECRYPT}(c \in \Sigma.C)\):<br>if \(c \in S\)
    return err<br>return \(\Sigma.\text{Dec}(k, c)\) |


    Just like for CPA security, if a scheme has CCA$ security, then it also has CCA
    security, but not vice-versa. See the exercises.


    # ## ★ 9.4 A Simple CCA-Secure Scheme


    Recall the definition of a **strong** pseudorandom permutation (PRP) (Definition
    6.13). A strong PRP is one that is indistinguishable from a randomly chosen permutation,
    even to an adversary that can make both *forward* (i.e., to *F*) and *reverse*
    (i.e., to *F*⁻¹) queries.


    This concept has some similarity to the definition of CCA security, in which the
    adversary can make queries to both Enc and its inverse Dec. Indeed, a strong PRP
    can be used to construct a CCA-secure encryption scheme in a natural way:


    **Construction 9.3** Let *F* be a pseudorandom permutation with block length *blen
    = n + λ*. Define the following encryption scheme with message space \(\mathcal{M}
    = \{0, 1\}^n\):


    | KeyGen: | Enc(*k*, *m*): | Dec(*k*, *c*): |

    | :--- | :--- | :--- |

    | \(k \leftarrow \{0, 1\}^\lambda\)<br>return *k* | \(r \leftarrow \{0, 1\}^\lambda\)<br>return
    *F*(*k*, *m*||*r*) | \(v := F^{-1}(k, c)\)<br>return first *n* bits of *v* |


    In this scheme, *m* is encrypted by appending a random value *r* to it, then applying
    a PRP. While this scheme is conceptually quite simple, it is generally not used
    in practice since it requires a block cipher with a fairly large block size, and
    these are rarely encountered.


    We can informally reason about the security of this scheme as follows:'
