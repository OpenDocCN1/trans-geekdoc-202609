  md: "# Discrete Logarithms\n\nIt is typically easy to compute the value of \\( g^x\
    \ \\) in a cyclic group, given \\( g \\) and \\( x \\). For example, when using\
    \ a cyclic group of the form \\( \\mathbb{Z}_n^* \\), we can easily compute the\
    \ modular exponentiation \\( g^x \\, \\% \\, n \\) using repeated squaring.\n\n\
    The inverse operation in a cyclic group is called the discrete logarithm problem:\n\
    \n**Definition 14.2** (Discrete Log) _The **discrete logarithm problem** is: given\
    \ \\( X \\in \\langle g \\rangle \\), determine a number \\( x \\) such that \\\
    ( g^x = X \\). Here the exponentiation is with respect to the multiplication operation\
    \ in \\( \\mathbb{G} = \\langle g \\rangle \\)._\n\nThe discrete logarithm problem\
    \ is conjectured to be hard (that is, no polynomial-time algorithm exists for\
    \ the problem) in certain kinds of cyclic groups.\n\n# 14.2 Diffie-Hellman Key\
    \ Agreement\n\nKey agreement refers to the problem of establishing a private channel\
    \ using public communication. Suppose Alice & Bob have never spoken before and\
    \ have no shared secrets. By exchanging *public messages* (i.e., that can be seen\
    \ by any external observer), they would like to establish a secret that is known\
    \ only to the two of them.\n\nThe **Diffie-Hellman** protocol is such a key-agreement\
    \ protocol, and it was the first published instance of public-key cryptography:\n\
    \n**Construction 14.3** (Diffie-Hellman) _Both parties agree (publicly) on a cyclic\
    \ group \\( \\mathbb{G} \\) with generator \\( g \\). Let \\( n = |\\mathbb{G}|\
    \ \\). All exponentiations are with respect to the group operation in \\( \\mathbb{G}\
    \ \\)._\n\n+   1. Alice chooses \\( a \\leftarrow \\mathbb{Z}_n \\). She sends\
    \ \\( A = g^a \\) to Bob.\n+   \n+   2. Bob chooses \\( b \\leftarrow \\mathbb{Z}_n\
    \ \\). He sends \\( B = g^b \\) to Alice.\n+   \n+   3. Bob locally outputs \\\
    ( K := A^b \\). Alice locally outputs \\( K := B^a \\).\n\n![](img/da79fa21b263fe549aecaabd2a0a41c8_265_0.png)\n\
    \nBy substituting and applying standard rules of exponents, we see that both parties\
    \ output a common value, namely \\( K = g^{ab} \\in \\mathbb{G} \\).\n\n# Defining\
    \ Security for Key Agreement\n\nExecuting a key agreement protocol leaves two\
    \ artifacts behind. First, we have the collection of messages that are exchanged\
    \ between the two parties. We call this collection a **transcript**. We envision\
    \ two parties executing a key agreement protocol in the presence of an *eavesdropper*,\
    \ and hence we imagine that the transcript is public. Second, we have the **key**\
    \ that is output by the parties, which is private."
