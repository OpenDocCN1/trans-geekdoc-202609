  md: "# Security\n\nTo show the security of Shamir secret sharing, we first show\
    \ a convenient lemma about the distribution of shares in an unauthorized set:\n\
    \n# **Lemma 3.12** Let p be a prime and define the following two libraries:\n\n\
    ```\n\\mathcal{L}_{\\text{shamir-real}}\nPOLY(m, t, U \\subseteq \\{1, \\dots,\
    \ p\\}):\n if |U| \\ge t: return err\n f_1, \\dots, f_{t-1} \\leftarrow \\mathbb{Z}_p\n\
    \ f(\\boldsymbol{x}) := m + \\sum_{j=1}^{t-1} f_j x^j\n for i \\in U:\n s_i :=\
    \ (i, f(i) \\% p)\n return \\{s_i \\mid i \\in U\\}\n```\n\n```\n\\mathcal{L}_{\\\
    text{shamir-rand}}\nPOLY(m, t, U \\subseteq \\{1, \\dots, p\\}):\n if |U| \\ge\
    \ t: return err\n for i \\in U:\n y_i \\leftarrow \\mathbb{Z}_p\n s_i := (i, y_i)\n\
    \ return \\{s_i \\mid i \\in U\\}\n```\n\n\\mathcal{L}_{\\text{shamir-real}} chooses\
    \ a random degree-(t − 1) polynomial that passes through the point (0, m), then\
    \ evaluates it at the given x-coordinates (specified by U). \\mathcal{L}_{\\text{shamir-rand}}\
    \ simply gives uniformly chosen points, unrelated to any polynomial.\n\nThe claim\
    \ is that these libraries are interchangeable: \\mathcal{L}_{\\text{shamir-real}}\
    \ \\equiv \\mathcal{L}_{\\text{shamir-rand}}.\n\n# Proof\n\nFix a message m \\\
    in \\mathbb{Z}_p, fix set U of users with |U| < t, and for each i \\in U fix a\
    \ value y_i \\in \\mathbb{Z}_p. We wish to consider the probability that a call\
    \ to POLY(m, t, U) outputs \\{(i, y_i) \\mid i \\in U\\}, in each of the two libraries.<sup>2</sup>\n\
    \nIn library \\mathcal{L}_{\\text{shamir-real}}, the subroutine chooses a random\
    \ degree-(t − 1) polynomial f such that f(0) \\equiv_p m. From Corollary 3.10,\
    \ we know there are p^{t-1} such polynomials.\n\nIn order for POLY to output points\
    \ consistent with our chosen y_i’s, the library must have chosen one of the polynomials\
    \ that passes through (0, m) and all of the \\{(i, y_i) \\mid i \\in U\\} points.\
    \ The library must have chosen one of the polynomials that passes through a specific\
    \ choice of |U| + 1 points, and Corollary 3.10 tells us that there are p^{t-(|U|+1)}\
    \ such polynomials.\n\nThe only way for POLY to give our desired output is for\
    \ it to choose one of the p^{t-(|U|+1)} “good” polynomials, out of the p^{t-1}\
    \ possibilities. This happens with probability exactly\n\n```\n\\frac{p^{t-|U|-1}}{p^{t-1}}\
    \ = p^{-|U|}\n```\n\nNow, in library \\mathcal{L}_{\\text{shamir-rand}}, POLY\
    \ chooses its |U| output values uniformly in \\mathbb{Z}_p. There are p^{|U|}\
    \ ways to choose them. But only one of those ways causes POLY(m, t, U) to output\
    \ our specific choice of \\{(i, y_i) \\mid i \\in U\\}. Hence, the probability\
    \ of receiving this output is p^{-|U|}.\n\nFor all possible inputs to POLY, both\
    \ libraries assign the same probability to every possible output. Hence, the libraries\
    \ are interchangeable.\n\n# **Theorem 3.13** Shamir’s secret-sharing scheme (Construction\
    \ 3.11) is secure according to Definition 3.3.\n\n<sup>2</sup>This is similar\
    \ to how, in Claim 2.7, we fixed a particular m and c and computed the probability\
    \ that EAVESDROP(m) = c."
