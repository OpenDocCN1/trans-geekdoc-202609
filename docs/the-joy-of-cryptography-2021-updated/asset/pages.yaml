    \equiv_n 1$.


    13.3. Prove that gcd(2^a - 1, 2^b - 1) = 2^gcd(a,b) - 1.


    13.4. Prove that x^a % n = x^(a % phi(n)) % n for any x in Z*_n. In other words,
    when working modulo n, you can reduce exponents modulo phi(n).


    13.5. How many fractions a/b in lowest terms are there, where 0 < a/b < 1 and
    b <= n? For n = 5 the answer is 9 since the relevant fractions are:


    1/5, 1/4, 1/3, 2/5, 1/2, 3/5, 2/3, 3/4, 4/5


    Write a formula in terms of n. What is the answer for n = 100?


    Hint:


    13.6. In this problem we determine the efficiency of Euclid''s GCD algorithm.
    Since its input is a pair of numbers (x, y), let''s call x + y the size of the
    input. Let F_k denote the kth Fibonacci number, using the indexing convention
    F_0 = 1; F_1 = 2. Prove that (F_k, F_{k-1}) is the smallest-size input on which
    Euclid''s algorithm makes k recursive calls.


    Hint:


    Note that the size of input (F_k, F_{k-1}) is F_{k+1}, and recall that F_{k+1}
    \approx \phi^{k+1}, where \phi \approx 1.618 ... is the golden ratio. Thus, for
    any inputs of size N \in [F_k, F_{k+1}), Euclid''s algorithm will make less than
    k \le \log_\phi N recursive calls. In other words, the worst-case number of recursive
    calls made by Euclid''s algorithm on an input of size N is O(log N), which is
    linear in the number of bits needed to write such an input.


