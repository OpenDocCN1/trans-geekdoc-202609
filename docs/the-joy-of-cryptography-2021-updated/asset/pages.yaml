  md: 'Example Using `LEARNPREVBYTE` to learn the 4th-to-last byte when the last 3
    bytes of the block are already known.


    ```

    ```

    ... ?? a0 42 3c   m = partially unknown plaintext block

    ⊕ ... 00 00 00 04   p = string ending in 04

    ⊕ ... 00 a0 42 3c   s = known bytes of m

    ⊕ ... b 00 00 00   y = candidate byte b shifted into place

    = ... 00 00 00 04   valid padding <=> ?? = b

    ```

    ```


    Since we know the last 3 bytes of $m$, we can calculate a string $x$ such that
    $m \oplus x$ ends in `00 00 04`. Now we can try xor''ing the 4th-to-last byte
    of $m \oplus x$ with different candidate bytes $b$, and asking the padding oracle
    whether the result has valid padding. Valid padding only occurs when the result
    has `00` in its 4th-to-last byte, and this happens exactly when the 4th-to-last
    byte of $m$ exactly matches our candidate byte $b$.


    The process is summarized in the `LEARNPREVBYTE` subroutine in Figure 9.1. In
    the worst case, this subroutine makes 256 queries to the padding oracle.


    **Putting it all together.** We now have all the tools required to decrypt *any
    ciphertext* using only the padding oracle. The process is summarized below in
    the `LEARNALL` subroutine.


    In the worst case, 256 queries to the padding oracle are required to learn each
    byte of the plaintext. However, in practice the number can be much lower. The
    example in this section was inspired by a real-life padding oracle attack which
    includes optimizations that allow an attacker to recover each plaintext byte with
    only 14 oracle queries on average.


    # ## 9.2 What Went Wrong?


    CBC encryption provides CPA security, so why didn’t it save us from padding oracle
    attacks? How was an attacker able to completely obliterate the privacy of encryption?


    +   1. First, CBC encryption (in fact, every encryption scheme we’ve seen so far)
    has a property called **malleability**. Given an encryption $c$ of an *unknown*
    plaintext $m$, it is possible to generate another ciphertext $c''$ whose contents
    are *related* to $m$ in a *predictable way*. In the case of CBC encryption, if
    ciphertext $c_0 || \cdots || c_\ell$ encrypts a plaintext $m_1 || \cdots || m_\ell$,
    then ciphertext $(c_{i-1} \oplus x, c_i)$ encrypts the *related* plaintext $m_i
    \oplus x$.


    In short, if an encryption scheme is malleable, then it allows information contained
    in one ciphertext to be “transferred” to another ciphertext.


    2 It might take more than 256 queries to learn the last byte. But whenever `LEARNLASTBYTE`
    uses more than 256 queries, the side effect is that you’ve also learned that some
    other bytes of the block are zero. This saves you from querying the padding oracle
    altogether to learn those bytes.

    3 *How to Break XML Encryption*, Tibor Jager and Juraj Somorovsky. ACM CCS 2011.'
