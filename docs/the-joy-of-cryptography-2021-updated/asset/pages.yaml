- pgno: 230
  md: "# Constructing UHFs using Polynomials\n\nUHFs have much weaker security than\
    \ other kinds of hashing, and they can in fact be constructed unconditionally.\
    \ One of the mathematically simplest constructions has to do with polynomials.\n\
    \n**Claim 12.8** Let \\(p\\) be a prime and \\(g\\) be a nonzero polynomial with\
    \ coefficients in \\(\\mathbb{Z}_p\\) and degree at most \\(d\\). Then \\(g\\\
    ) has at most \\(d\\) zeroes from \\(\\mathbb{Z}_p\\).\n\nThis observation leads\
    \ to a simple UHF construction, whose idea is to interpret the string \\(x\\)\
    \ as the coefficients of a polynomial, and evaluate that polynomial at point \\\
    (s\\) (the salt of the UHF). In more detail, let \\(p\\) be a prime with \\(p\
    \ > 2^\\lambda\\), and let the salt \\(s\\) be a uniformly chosen element of \\\
    (\\mathbb{Z}_p\\). To compute the hash of \\(x\\), first split \\(x\\) into \\\
    (\\lambda\\)-bit blocks, which will be convenient to index as \\(x_{d-1} || x_{d-2}\
    \ \\cdots || x_0\\). Interpret each \\(x_i\\) as a number mod \\(p\\). Then, the\
    \ value of the hash \\(H(s, x)\\) is:\n\n\\( s^d + x_{d-1}s^{d-1} + x_{d-2}s^{d-2}\
    \ + \\cdots + x_0 \\pmod p \\)\n\nThis is the result of evaluating a polynomial\
    \ with coefficients \\((1, x_{d-1}, x_{d-2}, \\ldots, x_0)\\) at the point \\\
    (s\\). A convenient way to evaluate this polynomial is by using **Horner’s rule:**\n\
    \n\\( \\cdots \\cdot s \\cdot (s \\cdot (s + x_{d-1}) + x_{d-2}) + x_{d-3} \\\
    cdots \\)\n\nHorner’s rule can be expressed visually as follows:\n\n![](img/da79fa21b263fe549aecaabd2a0a41c8_230_0.png)\n\
    \nThe UHF construction is described formally below.\n\n```\nConstruction 12.9\
    \ (Poly-UHF)\n\n\\(\\underline{H(s, x):}\\)\nwrite \\(x = x_{d-1} || x_{d-2} ||\
    \ \\cdots || x_0\\),\nwhere each \\(|x_i| = \\lambda\\)\n\n\\(p = \\) a prime\
    \ \\(> 2^\\lambda\\)\n\\(\\mathcal{S} = \\mathbb{Z}_p\\)\n\n\\(y := 1\\)\nfor\
    \ \\(i = d - 1\\) downto 0:\n  \\(y := s \\cdot y + x_i \\% p\\)\nreturn \\(y\\\
    )\n```\n\n**Claim 12.10** The Poly-UHF construction is a secure UHF.\n\n**Proof**\
    \ It suffices to show that, for any \\(x \\neq x'\\), the probability that \\\
    (H(s, x) = H(s, x')\\) (taken over random choice of \\(s\\)) is negligible. Note\
    \ that \\(H(s, x) = g(s)\\), where \\(g\\) is a polynomial whose coefficients\
    \ are \\((1, x_{d-1}, \\ldots, x_0)\\), and \\(H(s, x') = g'(s)\\), where \\(g'\\\
    ) is a similar polynomial derived from \\(x'\\). Note that \\(x\\) and \\(x'\\\
    ) may be split into a different number of blocks, leading to different degrees\
    \ (\\(d\\) and \\(d'\\)) for the two polynomials."
  merge: -1
