- pgno: 231
  md: "In order to have a collision $H(s, x) = H(s, x')$, we must have\n\n$g(s) \\\
    equiv_p g'(s)$\n$\\Longleftrightarrow g(s) - g'(s) \\equiv_p 0$\n\nNote that the\
    \ left-hand side in this equation is a polynomial of degree at most $d^* = \\\
    max\\{d, d'\\}$. Furthermore, that polynomial $g - g'$ is not the zero polynomial\
    \ because $g$ and $g'$ are different polynomials. Even if the original strings\
    \ $x$ and $x'$ differ only in blocks of 0s, the resulting $g$ and $g'$ will be\
    \ different polynomials because they include an extra leading coefficient of 1.\n\
    \nA collision happens if and only if $s$ is chosen to be one of the roots of $g\
    \ - g'$. From Claim 12.8, the polynomial has at most $d^*$ roots, so the probability\
    \ of choosing one of them is at most:\n\n$d^*/p \\le d^*/2^\\lambda.$\n\nThis\
    \ probability is negligible since $d^*$ is polynomial in $\\lambda$ (it is the\
    \ number of blocks in a string that was written down by the attacker, who runs\
    \ in polynomial time in $\\lambda$).\n\n> to-do\n> \n> Fine print: this works\
    \ but modular multiplication is not fast. If you want this to be fast, you would\
    \ use a binary finite field. It is not so bad to describe what finite fields are,\
    \ but doing so involves more polynomials. Then when you make polynomials whose\
    \ coefficients are finite field elements, it runs the risk of feeling like polynomials\
    \ over polynomials (because at some level it is). Not sure how I will eventually\
    \ deal with this.\n\n# Carter-Wegman UHF-based MAC\n\nA UHF by itself is not a\
    \ good MAC, even when its salt $s$ is kept secret. This is because the security\
    \ of a MAC must hold even when the attacker sees the function’s outputs, but a\
    \ UHF provides security (blind collision-resistance) only when the attacker does\
    \ not see the UHF outputs.\n\nThe Carter-Wegman MAC technique augments a UHF by\
    \ sending its output through a PRF, so the MAC of $m$ is $F(k, H(s, m))$ where\
    \ $H$ is a UHF and $F$ is a PRF.\n\n> **Construction 12.11 (Carter-Wegman)**\n\
    > \n> Let $H$ be a UHF with $n$ bits of output, and let $F$ be a secure PRF with\
    \ in $= n$. The Carter-Wegman construction combines them as follows:\n> \n> KeyGen:\n\
    > $k \\leftarrow \\{0, 1\\}^\\lambda$\n> $s \\leftarrow \\mathcal{S}$\n> return\
    \ $(k, s)$\n> \n> MAC$((k, s), x)$:\n> $y := H(s, x)$\n> return $F(k, y)$\n\n\
    We will show that the Carter-Wegman construction is a secure PRF. Recall that\
    \ this implies that the construction is also a secure MAC (Claim 10.4). Note that\
    \ the Carter-Wegman construction also uses a PRF as a building block. However,\
    \ it uses a PRF for short messages, to construct a PRF for arbitrary-length messages.\
    \ Furthermore, it only calls the underlying PRF once, and all other computations\
    \ involving the UHF are comparatively “cheap.”"
