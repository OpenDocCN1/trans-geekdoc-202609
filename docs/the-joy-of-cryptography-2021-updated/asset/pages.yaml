- pgno: 120
  md: 'When A is linked to L^F_{prf-rand}, the responses of the two calls to LOOKUP
    will be chosen uniformly and independently because LOOKUP is being called on distinct
    inputs. Consider the moment in time when the second call to LOOKUP is about to
    happen. At that point, x_1, x_2, and z_1 have all been determined, while z_2 is
    about to be chosen uniformly by the library. Using the properties of XOR, we see
    that A will output 1 if and only if z_2 is chosen to be exactly the value x_1
    ⊕ x_2 ⊕ z_1. This happens only with probability 1/2^(2λ). That is,


    Pr[A ◦ L^F_{prf-rand} ⇒ 1] = 1/2^(2λ).


    The advantage of A is therefore 1 − 1/2^(2λ) which is certainly non-negligible
    since it doesn''t even approach 0. This shows that F is not a secure PRF.


    At a more philosophical level, we wanted to identify exactly how G is being used
    in an inappropriate way. The PRG security libraries guarantee security when G''s
    seed is chosen freshly for each call to G. This construction of F violates that
    rule and allows the same seed to be used twice in different calls to G, where
    the results are supposed to look independent.


    This example shows the challenge of building a PRF. Even though we know how to
    make any individual output pseudorandom, it is difficult to make all outputs collectively
    appear independent, when in reality they are derived from a single short seed.


    # ## 6.2 PRFs vs PRGs; Variable-Hybrid Proofs


    In this section we show that a PRG can be used to construct a PRF, **and vice-versa**.
    The construction of a PRG from PRF is practical, and is one of the more common
    ways to obtain a PRG in practice. The construction of a PRF from PRG is more of
    theoretical interest and does not reflect how PRFs are designed in practice.


    # ### Constructing a PRG from a PRF


    As promised, a PRF can be used to construct a PRG. The construction is quite natural.
    For simplicity, suppose we have a PRF F : {0, 1}^λ × {0, 1}^λ → {0, 1}^λ (_i.e.,
    in = out = λ_). We can build a length-doubling PRG in the following way:


    | Construction 6.2 (Counter PRG) |

    | --- |

    | G(s): |

    | x := F(s, 0...00) |

    | y := F(s, 0...01) |

    | return x||y |


    There is nothing particularly special about the inputs 0...00 and 0...01 to F.
    All that matters is that they are distinct. The construction can be extended to
    easily give more than 2 blocks of output, by treating the input to F as a simple
    counter (hence the name of this construction).


    The guarantee of a PRF is that when its seed is chosen uniformly and it is invoked
    on distinct inputs, its outputs look independently uniform. In particular, its
    output on inputs 0...00 and 0...01 are indistinguishable from uniform. Hence,
    concatenating them gives a string which is indistinguishable from a uniform 2λ-bit
    string.'
