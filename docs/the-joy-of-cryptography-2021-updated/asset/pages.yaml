- pgno: 97
  md: "Consider: there are about $2^{75}$ molecules in a teaspoon of water, and about\
    \ $2^{2\\cdot 75}$ molecules of water in Earth's oceans. Suppose you dump a teaspoon\
    \ of water into the ocean and let things mix for a few thousand years. Even though\
    \ the teaspoon accounts for only $1/2^{75}$ of the ocean's contents, that doesn't\
    \ make it easy to keep track of all $2^{75}$ water molecules that originated in\
    \ the teaspoon! If you are small enough to see individual water molecules, then\
    \ a teaspoon of water looks as big as the ocean.\n\n# Discussion & Pitfalls\n\n\
    +   - Do not confuse the interface of a PRG (it takes in a seed as input) with\
    \ the interface of the security libraries $\\mathcal{L}_{\\text{prg}\\star}$ (their\
    \ QUERY subroutine doesn't take any input)! A PRG is indeed an algorithm into\
    \ which you can feed any string you like. However, **security is only guaranteed**\
    \ when the PRG is being used exactly as described in the security libraries —\
    \ in particular, when the seed is chosen uniformly/secretly and not used for anything\
    \ else.\n+   \n+   Nothing prevents a user from putting an adversarially-chosen\
    \ $s$ into a PRG, or revealing a PRG seed to an adversary, etc. You just get no\
    \ security guarantee from doing it, since it's not the situation reflected in\
    \ the PRG security libraries.\n\n+   - It doesn't really make sense to say that\
    \ ``0010110110`` is a random string” or ``0000000001 is a pseudorandom string.”\
    \ **properties of the *process* used to generate a string**, not properties of\
    \ the individual strings themselves. When we have a value $z = G(s)$ where $G$\
    \ is a PRG and $s$ is chosen uniformly, you could say that $z$ was “chosen pseudorandomly.”\
    \ You could say that the output of some process is a “pseudorandom distribution.”\
    \ But it is slightly sloppy (although common) to say that a string $z$ “is pseudorandom”.\n\
    \n+   - There are common statistical tests you can run, which check whether some\
    \ data has various properties that you would expect from a uniform distribution.$^1$\
    \ For example, are there roughly an equal number of 0s and 1s? Does the substring\
    \ 01010 occur with roughly the frequency I would expect? If I interpret the string\
    \ as a series of points in the unit square $[0, 1)^2$, is it true that roughly\
    \ $\\pi/4$ of them are within Euclidean distance 1 of the origin?\n+   \n+   The\
    \ definition of pseudorandomness is kind of a “master” definition that encompasses\
    \ all of these statistical tests and more. After all, what is a statistical test,\
    \ but a polynomial-time procedure that obtains samples from a distribution and\
    \ outputs a yes/no decision? Pseudorandomness means that *every* statistical test\
    \ that “passes” uniform data will also “pass” pseudorandomly generated data.\n\
    \n# 5.2 Pseudorandom Generators in Practice\n\nYou are probably expecting to now\
    \ see at least one example of a secure PRG. Unfortunately, things are not so simple.\
    \ We have no examples of secure PRGs! If it were possible to prove\n\n$^1$For\
    \ one list of such tests, see http://csrc.nist.gov/publications/nistpubs/800-22-rev1a/SP800-22rev1a.pdf."
