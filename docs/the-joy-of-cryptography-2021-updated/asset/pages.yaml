  md: 'We overload the “←” notation slightly, writing “x ← X” when X is a finite set
    to mean that x is sampled from the uniform distribution over X.


    := We write x := y for assignments to variables: “take the value of expression
    y and assign it to variable x.”


    ? We write comparisons as =? (analogous to “==” in your favorite programming language).
    So x =? y doesn’t modify x (or y), but rather it is an expression which returns
    true if x and y are equal.


    You will often see this notation in the conditional part of an if-statement, but
    also in return statements as well. The following two snippets are equivalent:


    ```

    return x =? y ⇔ if x =? y: return true else: return false

    ```


    In a similar way, we write x ∈? S as an expression that evaluates to true if x
    is in the set S.


    # Subroutine conventions


    We’ll use mathematical notation to define the types of subroutine arguments:


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_18_0.png)


    # 0.7 Asymptotics (Big-O)


    Let f : N → N be a function. We characterize the asymptotic growth of f in the
    following ways:


    f(n) is O(g(n)) ⇔ def lim n→∞ f(n)/g(n) < ∞ ⇔ ∃c > 0 : for all but finitely many
    n : f(n) < c · g(n) f(n) is Ω(g(n)) ⇔ def lim n→∞ f(n)/g(n) > 0 ⇔ ∃c > 0 : for
    all but finitely many n : f(n) > c · g(n) f(n) is Θ(g(n)) ⇔ def f(n) is O(g(n))
    and f(n) is Ω(g(n)) ⇔ 0 < lim n→∞ f(n)/g(n) < ∞ ⇔ ∃c1, c2 > 0 : for all but finitely
    many n : c1 · g(n) < f(n) < c2 · g(n)'
