- pgno: 12
  md: '**Definition 0.2 (% operator)** Let n be a positive integer, and let a be any
    integer. The expression a % n (usually read as “a mod n”) represents the remainder
    after dividing a by n. More formally, a % n is the **unique** r ∈ {0, ..., n −
    1} such that n | (a − r).1


    Pay special attention to the fact that a % n is always a nonnegative number, even
    if a is negative. A good way to remember how this works is:


    > > a is (a % n) more than a multiple of n.


    **Example**

    21 % 7 = 0 because 21 = 3 · 7 + 0.

    20 % 7 = 6 because 20 = 2 · 7 + 6.

    −20 % 7 = 1 because −20 = (−3) · 7 + 1. (−20 is one more than a multiple of 7.)

    −1 % 7 = 6 because −1 = (−1) · 7 + 6.


    Unfortunately, some programming languages define % for negative numbers as (−a)
    % n = −(a % n), so they would define −20 % 7 to be −(20 % 7) = −6. This is madness,
    and it’s about time we stood up to these programming language designers and smashed
    them over the head with some mathematical truth! For now, if you are using some
    programming environment to play around with the concepts in the class, be sure
    to check whether it defines % in the correct way.


    **Definition 0.3 (Z_n)** For positive n, we write Z_n =^{def} {0, ..., n − 1}
    to denote the set of **integers modulo n**. These are the possible remainders
    one obtains by dividing by n.2


    **Definition 0.4 (≡_n)** For positive n, we say that integers a and b are **congruent
    modulo n**, and write a ≡_n b, if n | (a − b). An alternative definition is that
    a ≡_n b if and only if a % n = b % n.


    You’ll be in a better position to succeed in this class if you can understand
    the (subtle) distinction between a ≡_n b and a = b % n:


    a ≡_n b: In this expression, a and b can be integers of any size, and any sign.
    The left and right side have a certain relationship modulo n.


    a = b % n: This expression says that two integers are equal. The “=” rather than
    “≡” is your clue that the expression refers to equality over the integers. “b
    % n” on the right-hand side is an operation performed on two integers that returns
    an integer result. The result of b % n is an integer in the range {0, ..., n −
    1}.


    **Example**

    “99 ≡_10 19” is true. Applying the definition, you can see that 10 divides 99
    − 19.

    On the other hand, “99 = 19 % 10” is false. The right-hand side evaluates to the
    integer 9, but 99 and 9 are different integers.'
