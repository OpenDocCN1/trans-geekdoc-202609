- pgno: 193
  md: '```

    L_left

    r ← {0, 1}^λ

    GUESS(g):

    return g ?= r

    ```


    ```

    L_right

    GUESS(g):

    return false

    ```


    The left library allows the calling program to attempt to guess a uniformly chosen
    “target” string. The right library doesn’t even bother to verify the calling program’s
    guess — in fact it doesn’t even bother to sample a random target string!


    The GUESS subroutines of these libraries give the same output on nearly all inputs.
    There is only one input _r_ on which they disagree. If a calling program can manage
    to find the value _r_, then it can easily distinguish the libraries. Therefore,
    by saying that these libraries are indistinguishable, we are really saying that
    it’s **hard for an adversary to find/generate this special value**! That’s the
    kind of property we want to express.


    Indeed, in this case, an adversary who makes _q_ queries to the guess subroutine
    achieves an advantage of at most _q_/2^λ. For polynomial-time adversaries, this
    is a negligible advantage (since _q_ is a polynomial function of λ).


    More generally, suppose we have two libraries, and a subroutine in one library
    checks some condition (and could return either true or false), while in the other
    library this subroutine always returns false. If the two libraries are indistinguishable,
    the calling program can’t tell whether the library is actually checking the condition
    or always saying false. This means it must be very hard to find an input for which
    the “correct” answer is true.


    # The MAC Security Definition


    We want to say that only someone who knows the secret key can come up with valid
    MAC tags. In other words, the adversary cannot come up with valid MAC tags.


    Actually, that property is not quite enough to be useful. A more useful property
    is: _even if the adversary knows valid MAC tags corresponding to various messages,
    she cannot produce a valid MAC tag for a different message_. We call it a **forgery**
    if the adversary can produce a “new” valid MAC tag.


    To translate this security property to a formal definition, we define two libraries
    that allow the adversary to request MAC tags on chosen messages. The libraries
    also provide a mechanism to let the adversary _check_ whether it has successfully
    found a forgery (since there is no way of checking this property without the secret
    key). One library will actually perform the check, and the other library will
    simply assume that forgeries are impossible. The two libraries are different only
    in how they behave when the adversary calls this verification subroutine on a
    forgery. By demanding that the two libraries be indistinguishable, we are actually
    demanding that it is difficult for the calling program to generate a forgery.


    **Definition 10.2** (MAC security) Let Σ be a MAC scheme. We say that Σ is a **secure
    MAC** if L^Σ_mac-real ≈ L^Σ_mac-fake, where:'
