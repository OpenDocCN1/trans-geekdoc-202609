    # One Security Definition Doesn’t Imply Another


    Another way we might compare security definitions is to identify any schemes that
    satisfy one definition without satisfying the other. This helps us understand
    the boundaries and “edge cases” of the definition.


    A word of warning: If we have two security definitions that both capture our intuitions
    rather well, then any scheme which satisfies one definition and not the other
    is bound to appear unnatural and contrived. The point is to gain more understanding
    of the security definitions themselves, and unnatural/contrived schemes are just
    a means to do that.


