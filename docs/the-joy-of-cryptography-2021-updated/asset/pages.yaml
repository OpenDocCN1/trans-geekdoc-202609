  md: '# Avoiding Deterministic Encryption


    Is CPA security even possible? How exactly can we make a non-deterministic encryption
    scheme? This sounds challenging! We must design an Enc algorithm such that calling
    it twice with the same plaintext and key results in different ciphertexts (otherwise
    the attack \(\mathcal{A}\) above violates CPA security). What’s more, it must
    be possible to decrypt all of those different encryptions of the same plaintext
    to the correct value!


    There are 3 general ways to design an encryption scheme that is not deterministic:


    +   Encryption/decryption can be **stateful**, meaning that every call to Enc
    or Dec will actually modify the value of \(k\). The symmetric ratchet construction
    described in Section 5.5 could be thought of as such a stateful construction.
    The key is updated via the ratchet mechanism for every encryption. A significant
    drawback with stateful encryption is that synchronization between sender and receiver
    is fragile and can be broken if a ciphertext is lost in transit.


    +   Encryption can be **randomized**. Each time a plaintext is encrypted, the
    Enc algorithm chooses fresh, independent randomness specific to that encryption.
    The main challenge in designing a randomized encryption method is to incorporate
    randomness into each ciphertext in such a way that decryption is still possible.
    Although this sounds quite challenging, we have already seen such a method, and
    we will prove its CPA security in the next sections. In this book we will focus
    almost entirely on randomized encryption.


    +   Encryption can be **nonce-based**. A “nonce” stands for “number used only
    once,” and it refers to an extra argument that is passed to the Enc and Dec algorithms.
    A nonce does not need to be chosen randomly; it does need to be secret; it only
    needs to be **distinct** among all calls made to Enc. By guaranteeing that some
    input to Enc will be different every time (even when the key and plaintext are
    repeated), the Enc algorithm can be deterministic and still provide CPA security.


    Nonce-based encryption requires a change to the interface of encryption, and therefore
    a change to the correctness & security definitions as well. The encryption/decryption
    algorithms syntax is updated to Enc(\(k, v, m\)) and Dec(\(k, v, c\)), where \(v\)
    is a nonce. The correctness property is that Dec(\(k, v\), Enc(\(k, v, m\))) =
    \(m\) for all \(k, v, m\), so both encryption & decryption algorithms should use
    the same nonce. The security definition allows the adversary to choose the nonce,
    but gives an error if the adversary tries to encrypt multiple ciphertexts with
    the same nonce. In this way, the definition enforces that the nonces are distinct.


    | \(k \leftarrow \Sigma.\)KeyGen<br>\\ \\ \(V := \emptyset\)<br>\\ \\ EAVESDROP(\(v,
    m_L, m_R \in \Sigma.\mathcal{M}\)):<br>\\ \\ if \(v \in V\): return err<br>\\
    \\ \(V := V \cup \{v\}\)<br>\\ \\ \(c := \Sigma.\)Enc(\(k, v, m_L\))<br>\\ \\
    return \(c\) | \(k \leftarrow \Sigma.\)KeyGen<br>\\ \\ \(V := \emptyset\)<br>\\
    \\ EAVESDROP(\(v, m_L, m_R \in \Sigma.\mathcal{M}\)):<br>\\ \\ if \(v \in V\):
    return err<br>\\ \\ \(V := V \cup \{v\}\)<br>\\ \\ \(c := \Sigma.\)Enc(\(k, v,
    m_R\))<br>\\ \\ return \(c\) |'
