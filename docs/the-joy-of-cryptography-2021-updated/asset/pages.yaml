    understanding of the PRG security definition.


    # A Security Proof


    I think it’s helpful to illustrate the “stragey” of security proofs by starting
    from the desired conclusion and working backwards. What better way to do this
    than as a Socratic dialogue in the style of Galileo?²


    SALVIATI: I’m sure that \(H_1\) is the secure PRG.


    SIMPLICIO: If I understand the security definition for PRGs correctly, you mean
    that the output of \(H_1\) looks indistinguishable from uniform, when the input
    to \(H_1\) is uniform. Why do you say that?


    SALVIATI: Simple! \(H_1\)’s output consists of segments called \(x\), \(u\), and
    \(v\). Each of these are outputs of \(G\), and since \(G\) itself is a PRG its
    outputs look uniform.


    SIMPLICIO: I wish I had your boldness, Salviati. I myself am more cautious. If
    \(G\) is a secure PRG, then its outputs are indeed indistinguishable from uniform,
    but surely only when its input is uniform! Are you so sure that’s the case here?


    SALVIATI: You raise a good point, Simplicio. In these endeavors it is always preferable
    to err on the side of caution. When we want to claim that \(H_1\) is a secure
    PRG, we consider the nature of its outputs when its seed \(s\) is uniform. Since
    \(H_1\) sends that seed \(s\) directly into \(G\), your concern is addressed.


    SIMPLICIO: Yes, I can see how in the expression \(x||y := G(s)\) the input to
    \(G\) is uniform, and so its outputs \(x\) and \(y\) are indistinguishable from
    random. Since \(x\) is part of \(H_1\)’s output, we are making progress towards
    showing that the entire output of \(H_1\) is indistinguishable from random! However,
    the output of \(H_1\) also contains terms \(u\) and \(v\). When I examine how
    they are generated, as \(u||v := G(y)\), I become concerned again. Surely \(y\)
    is not uniform, so I see no way to apply the security if \(G\)!'
