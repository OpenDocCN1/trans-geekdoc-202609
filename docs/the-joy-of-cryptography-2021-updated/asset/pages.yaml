  md: 'This silly MAC construction treats both \(m_1\) and \(m_2\) identically, and
    an obvious way to try to fix the problem is to treat the different blocks differently
    somehow:


    **Example** Let \(F\) be a PRF with \(in = \lambda + 1\) and \(out = \lambda\).
    Below is another MAC approach for messages of length \(2\lambda\):


    ```

    ECB++MAC(\(k, m_1||m_2\)):

    \(t_1 := F(k, 0||m_1)\)

    \(t_2 := F(k, 1||m_2)\)

    return \(t_1||t_2\)

    ```


    This MAC construction does better, as it treats the two message blocks \(m_1\)
    and \(m_2\) differently. Certainly the previous attack of swapping the order of
    \(m_1\) and \(m_2\) doesn’t work anymore. (Can you see why?)


    The construction authenticates (in some sense) the fact that \(m_1\) is the first
    message block, and \(m_2\) is the second block. However, this construction doesn’t
    authenticate **the fact that this particular** \(m_1\) **and** \(m_2\) **belong
    together**. More concretely, we can “mix and match” blocks of the tag corresponding
    to different messages:


    ```

    A:

    \(t_1||t_2 := \text{GETTAG}(0^{2\lambda})\)

    \(t''_1||t''_2 := \text{GETTAG}(1^{2\lambda})\)

    return CHECKTAG(\(0^\lambda || 1^\lambda, t_1||t''_2\))

    ```


    In this attack, we combine the \(t_1\) block from the first tag and the \(t_2\)
    block from the second tag.


    We are starting to see the challenges involved in constructing a MAC scheme for
    long messages. A secure MAC should authenticate each message block, the order
    of the message blocks, and the fact that *these particular message blocks are
    appearing in a single message*. In short, it must authenticate the *entirety*
    of the message.


    Think about how authentication is significantly different than privacy/hiding
    in this respect. At least for CPA security, we can hide an entire plaintext by
    hiding each individual piece of the plaintext separately (encrypting it with a
    CPA-secure encryption). Authentication is fundamentally different.


    # How to do it: CBC-MAC


    We have seen some insecure ways to construct a MAC for longer messages. Now let’s
    see a secure way. A common approach to constructing a MAC for long messages involves
    the CBC block cipher mode.


    **Construction 10.5 (CBC-MAC)** Let \(F\) be a PRF with \(in = out = \lambda\).
    CBC-MAC refers to the following MAC scheme:'
