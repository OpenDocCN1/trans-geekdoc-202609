- pgno: 3
  md: 'step-by-step when you run a cryptographic algorithm on a particular input.
    This might help you understand what the algorithm does, but it can never illustrate
    why the algorithm is secure. This question of “why” is the primary focus of this
    book.


    +   Security is a global property about the behavior of a system across all possible
    inputs. You can’t demonstrate security by example, and there’s nothing to see
    in a particular execution of an algorithm. Security is about a higher level of
    abstraction.


    +   Most security definitions in this book are essentially: “the thing is secure
    if its outputs look like random junk.” If I give an example that is concrete enough
    to show actual inputs and outputs, and if things are working as they should, then
    all the outputs will just look like meaningless garbage. Unfortunately, no one
    ever learned very much by staring at meaningless garbage.


    Systems are insecure when they fail to adequately look like random junk. Occasionally
    they fail so spectacularly that you can actually see it by looking at concrete
    input and output values (as in the case of the ECB penguin). But more often, the
    reason for insecurity is far from obvious. For example, suppose an encryption
    scheme was insecure because the xor of the first two output blocks is the same
    as the xor of the third and fourth output blocks. I’m not convinced that it would
    be helpful to show concrete example values with this property. What’s more, sometimes
    the reason for insecurity only “jumps off the page” on specific, non-obvious,
    choices of inputs.


    If you want to be equipped to answer questions like “why is this thing secure
    but this other very similar thing is not?”, then you must develop an understanding
    at this higher level of abstraction. You’ll have to directly come to terms with
    abstract ideas like “this algorithm’s outputs look like random junk, under these
    circumstances,” and the consequences of these kinds of ideas. It’s hard to arrive
    at understanding without the usual scaffolding of concrete examples (seeing algorithms
    executed on specific inputs), but this book is my best effort at making the path
    as smooth as I know how.


    # Known Shortcomings


    +   I’ve used this book as a primary course reference for several years now, but
    I still consider it to be a draft. Of course I try my best to ensure the accuracy
    of the content, but there are sure to be plenty of bugs, ranging in their severity.
    Caveat emptor! I welcome feedback of all kinds — not just on errors and typos
    but also on the selection, organization, and presentation of the material.


    +   I usually cover essentially this entire book during our 10-week quarters.
    There is probably not enough material to sustain an entire 16-week semester, though.
    I always find it easier to polish existing material than to add completely new
    material. Someday I hope to add more chapters (see the roadmap below), but for
    now you’ll have to get by without some important and interesting topics.


    +   There is no solutions manual, and I currently have no plans to make one.'
