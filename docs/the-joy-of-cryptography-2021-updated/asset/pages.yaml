  md: "**Key:** It's hard to imagine any kind of useful security if the attacker knows\
    \ the key. Hence, we consider that the key is kept secret from the attacker. Of\
    \ course, the key is generated according to the KeyGen algorithm of the scheme.\n\
    \nAt this point in the course, we consider encryption schemes where the key is\
    \ used to encrypt only one plaintext. Somehow this restriction must be captured\
    \ in our security definition. Later, we will consider security definitions that\
    \ consider a key that is used to encrypt many things.\n\n**Plaintext:** It turns\
    \ out to be useful to consider that the attacker actually *chooses* the plaintexts.\
    \ This a “pessimistic” choice, since it gives much power to the attacker. However,\
    \ if the encryption scheme is indeed secure when the attacker chooses the plaintexts,\
    \ then it’s also secure in more realistic scenarios where the attacker has some\
    \ uncertainty about to the plaintexts.\n\nThese clarifications allow us to fill\
    \ in more specifics about our informal idea of security:\n\n> \"an encryption\
    \ scheme is a good one if its ciphertexts look like random junk to an attacker\
    \ ... when each key is secret and used to encrypt only one plaintext, even when\
    \ the attacker chooses the plaintexts.\"\n\nA concise way to express all of these\
    \ details is to consider **the attacker as a calling program** to the following\
    \ subroutine:\n\n```\nCTXT(m \\in \\Sigma.\\mathcal{M}):\n  k \\leftarrow \\Sigma.KeyGen\n\
    \  c := \\Sigma.Enc(k, m)\n  return c\n```\n\nA calling program can choose the\
    \ argument to the subroutine (in this case, a plaintext), and see *only* the resulting\
    \ return value (in this case, a ciphertext). The calling program *can’t* see values\
    \ of privately-scoped variables (like *k* in this case). If the calling program\
    \ makes many calls to the subroutine, a fresh key *k* is chosen each time.\n\n\
    The interaction between an attacker (calling program) and this `CTXT` subroutine\
    \ appears to capture the relevant scenario. We would like to say that the outputs\
    \ from the `CTXT` subroutine are uniformly distributed. A convenient way of expressing\
    \ this property is to say that this `CTXT` subroutine should have the same effect\
    \ on *every* calling program as a `CTXT` subroutine that (explicitly) samples\
    \ its output uniformly.\n\n```\nCTXT(m \\in \\Sigma.\\mathcal{M}):\n  k \\leftarrow\
    \ \\Sigma.KeyGen\n  c := \\Sigma.Enc(k, m)\n  return c\n\nvs.\n\nCTXT(m \\in \\\
    Sigma.\\mathcal{M}):\n  c \\leftarrow \\Sigma.C\n  return c\n```\n\nIntuitively,\
    \ no calling program should have any way of determining which of these two implementations\
    \ is answering subroutine calls. As an analogy, one way of saying that “foo is\
    \ a correct sorting algorithm” is to say that “no calling program would behave\
    \ differently if foo were replaced by an implementation of mergesort.”\n\nIn summary,\
    \ we can define security for encryption in the following way:"
