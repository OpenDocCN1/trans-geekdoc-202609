    \    x' := Hinv[y]\n    return cache[x']\n  if Hinv[y] undefined:\n    cache[x]\
    \ <- {0, 1}out\n    Hinv[y] := x\n  return cache[x]\n```\n\nNote that if Hinv[y]\
