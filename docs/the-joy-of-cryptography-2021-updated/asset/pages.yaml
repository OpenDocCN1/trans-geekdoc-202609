- pgno: 107
  md: '# A Concrete Attack on $H_2$


    So far, we’ve only demonstrated that we get stuck when trying to prove the security
    of $H_2$. But that doesn’t necessarily mean that $H_2$ is insecure – it could
    mean that we’re just not clever enough to see a different security proof. To show
    that $H_2$ is actually insecure, we must demonstrate a successful distinguishing
    attack.


    Attacking a PRG amounts to finding “patterns” in their outputs. Does $H_2$ have
    a pattern in its outputs? Yes, in this case the pattern is that if you write the
    output in the form $x\|y\|u\|v$, then $u\|v$ is always equal to $G(y)$. The calling
    program can check for this condition, which is unlikely to happen for truly uniform
    values.


    You may wonder, is it legal for the calling program to compute $G(y)$? Well, $G$
    is a publicly known algorithm (Kerckhoffs’ principle!), and $y$ is right there
    as part of the input. Nothing prevents the calling program from running $G$ “in
    its head.”$^4$


    Claim 5.6 Construction $H_2$ is **not** a secure PRG, even if $G$ is.


    Proof Consider the following distinguisher $\mathcal{A}$:


    ```

    x||y||u||v := QUERY()

    return G(y) =? u||v

    ```


    When $\mathcal{A}$ is linked to $\mathcal{L}^{\ H_2}_{\text{prg-real}}$, the outputs
    indeed satisfy the condition $G(y) = u\|v$, so $\mathcal{A}$ outputs true with
    probability 1.


    When $\mathcal{A}$ is linked to $\mathcal{L}^{\ H_2}_{\text{prg-rand}}$, the outputs
    are truly uniform. It is helpful to imagine $x$ and $y$ being chosen before $u$
    and $v$. As soon as $y$ is chosen, the value $G(y)$ is uniquely determined, since
    $G$ is a deterministic algorithm. Then $\mathcal{A}$ will output true if $u\|v$
    is chosen exactly to equal this $G(y)$. Since $u$ and $v$ are chosen uniformly,
    and are a total of $2\kappa$ bits long, this event happens with probability $1/2^{2\kappa}$.


    $\mathcal{A}$’s advantage is the difference in these probabilities: $1 - 1/2^{2\kappa}$,
    which is non-negligible.


    # Discussion


    In the attack on $H_2$, we never tried to distinguish the output of $G$ from uniform.
    $H_2$ is insecure even if $G$ is the best PRG in the world! It’s insecure because
    of the incorrect way it *uses* $G$.


    From now on in this book, we’ll be studying higher-level constructions that are
    assembled from various building blocks — in this chapter, fancy PRGs constructed
    from simpler PRGs. “Security” means: if the building blocks are secure then the
    construction is secure. “Insecurity” means: *even if the building blocks are secure*,
    the construction can be insecure. So when you’re showing insecurity, you shouldn’t
    directly attack the building blocks! You should assume the building blocks are
    secure and attack *the way that the building blocks are being used*.


    $^4$Compare to the case of distinguishing $G(s)$ from uniform, for a secure $G$.
    The calling program knows the algorithm $G$ but doesn’t have the seed $s$ – it
    only knows the *output* $G(s)$. In the case of $H_2$, the calling program learns
    both $y$ and $G(y)$!'
