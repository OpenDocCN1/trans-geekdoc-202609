  md: '# Code-Based Games Philosophy


    The security definitions and proofs in these notes are presented in a style that
    is known to the research community as code-based games. I''ve chosen this style
    because I think it offers significant pedagogical benefits:


    +   - Every security definition can be expressed in the same style, as the indistinguishability
    of two games. In my terminology, the games are libraries with a common interface/API
    but different internal implementations. An adversary is any calling program on
    that interface. These libraries use a concrete pseudocode that reduces ambiguity
    about an adversary''s capabilities. For instance, the adversary controls arguments
    to subroutines that it calls and sees only the return value. The adversary cannot
    see any variables that are privately scoped to the library.


    +   - A consistent framework for definitions leads to a consistent process for
    proving and breaking security — the two fundamental activities in cryptography.
    In these notes, breaking a construction always corresponds to writing a program
    that expects a particular interface and behaves as differently as possible in
    the presence of two particular implementations of the interface. Proving security
    nearly always refers to showing a sequence of libraries (called hybrids), each
    of which is indistinguishable from the previous one. Each of these hybrids is
    written in concrete pseudocode. By identifying what security property we wish
    to prove, we identify what the endpoints of this sequence must be. The steps that
    connect adjacent hybrids are stated in terms of syntactic rewriting rules for
    pseudocode, including down-to-earth steps like factoring out and inlining subroutines,
    changing the value of unused variables, and so on.


    +   - Cryptography is full of conditional statements of security: “If A is a secure
    thingamajig, then B is a secure doohickey.” A conventional proof of such a statement
    would address the contrapositive: “given an adversary that attacks the doohickey-security
    of B, I can construct an attack on the thingamajig-security of A.” In my experience,
    students struggle to find the right way to transform an abstract, hypothetical
    B-attacking adversary into a successful A-attacking adversary. By defining security
    in terms of games/libraries, we can avoid this abstract challenge, and indeed
    avoid the context switch into the contrapositive altogether. In these notes, the
    thingamajig-security of A gives the student a new constructive rewriting rule
    that can be placed in his/her toolbox and used to bridge hybrids when proving
    the doohickey-security of B.


    Code-based games were first proposed by Shoup and later expanded by Bellare &
    Rogaway. These notes adopt a simplified and unified style of games, since the
    goal is not to encompass every possible security definition but only the fundamental
    ones. The most significant difference in style is that the games in these notes
    have no explicit INITIALIZE


    2 Victor Shoup: Sequences of Games: A Tool for Taming Complexity in Security Proofs.
    ia.cr/2004/332


    3 Mihir Bellare & Philip Rogaway: Code-Based Game-Playing Proofs and the Security
    of Triple Encryption. ia.cr/2004/331'
