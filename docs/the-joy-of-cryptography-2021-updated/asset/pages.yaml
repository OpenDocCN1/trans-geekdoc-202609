- pgno: 195
  md: '+   1. Alice sends a special SYN packet containing her initial sequence number
    A. In TCP, all packets from Alice to Bob include a sequence number, which helps
    the parties detect when packets are missing or out of order. It is important that
    the initial sequence number be random, to prevent other parties from injecting
    false packets.


    +   2. Bob sends a special SYN+ACK packet containing A+1 (to acknowledge Alice’s
    A value) and the initial sequence number B for his packets.


    +   3. Alice sends a special ACK packet containing B + 1, and then the connection
    is established.


    When Bob is waiting for step 3, the connection is considered “half-open.” While
    waiting, Bob must remember B so that he can compare to the B + 1 that Alice is
    supposed to send in her final ACK. Typically the operating system allocates only
    a very limited amount of resources for these half-open connections.


    In the past, it was possible to perform a denial of service attack by starting
    a huge number of TCP connections with a server, but never sending the final ACK
    packet. The server’s queue for half-open connections fills up, which prevents
    other legitimate connections from starting.


    A clever backwards-compatible solution to this problem is called SYN cookies.
    The idea is to let Bob choose his initial sequence number B to be a MAC of the
    client’s IP address, port number, and some other values. Now there is nothing
    to store for half-open connections. When Alice sends the final ACK of the handshake,
    Bob can recompute the initial sequence number from his MAC key.


    These are all cases where the person who generates the MAC is the same person
    who later verifies the MAC. You can think of this person as choosing not to store
    some information, but rather leaving the information with someone else as a “note
    to self.”


    There are other useful settings where one party generates a MAC while the other
    verifies.


    +   ▶ In two-factor authentication, a user logs into a service using something
    they know (e.g., a password) and something they have (e.g., a mobile phone). The
    most common two-factor authentication mechanism is called timed one-time passwords
    (TOTP). When you (as a user) enable two-factor authentication, you generate a
    secret key k and store it both on your phone and with the service provider. When
    you wish to log in, you open a simple app on your phone which computes p = MAC(k,
    T), where T is the current date + time (usually rounded to the nearest 30 seconds).
    The value p is the “timed one-time password.” You then log into the service using
    your usual (long-term) password and the one-time password p. The service provider
    has k and also knows the current time, so can verify the MAC p.


    From the service provider’s point of view, the only other place k exists is in
    the phone of this particular user. Intuitively, the only way to generate a valid
    one-time password at time T is to be in posession of this phone at time T. Even
    if an attacker sees both your long-term and one-time password over your shoulder,
    this does not help him gain access to your account in the future (well, not after
    30 seconds in the future).'
