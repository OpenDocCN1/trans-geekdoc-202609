  md: "The way this kind of situation is avoided in other security definitions is\
    \ that the libraries have some secret randomness. While the attacker is allowed\
    \ to depend arbitrarily on the source code of the libraries, it is not allowed\
    \ to depend on the choice of outcomes for random events in the libraries, like\
    \ sampling a secret key. Since the calling program can’t “prepare” for the random\
    \ choice that it will be faced with, we don’t have such trivial attacks. On the\
    \ other hand, these two libraries for collision resistance are totally deterministic.\
    \ There are no “surprises” about which function H the calling program will be\
    \ asked to compute a collision for, so there is nothing to prevent a calling program\
    \ from being “prepared” with a pre-computed collision in H.\n\n# Hash Function\
    \ Security In Theory\n\nThe way around this technical issue is to introduce some\
    \ randomness into the libraries and into the inputs of H. We define hash functions\
    \ to take two arguments: a randomly chosen, public value s called a salt, and\
    \ an adversarially chosen input x.\n\n# Definition 11.1 A hash function H is collision-resistant\
