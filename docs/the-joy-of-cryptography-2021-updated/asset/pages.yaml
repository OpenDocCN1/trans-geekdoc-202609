- pgno: 266
  md: 'To define security of key agreement, we would like to require that the transcript
    leaks no (useful) information to the eavesdropper about the key. There are a few
    ways to approach the definition:


    +   ▶ We could require that it is hard to compute the key given the transcript.
    However, this turns out to be a rather weak definition. For example, it does not
    rule out the possibility that an eavesdropper could guess the first half of the
    bits of the key.


    +   ▶ We could require that the key is pseudorandom given the transcript. This
    is a better definition, and the one we use. To formalize this idea, we define
    two libraries. In both libraries the adversary / calling program can obtain the
    transcript of an execution of the key agreement protocol. In one library the adversary
    obtains the key that resulted from the protocol execution, while in the other
    library the adversary obtains a totally unrelated key (chosen uniformly from the
    set $\Sigma.\mathcal{K}$ of possible keys).


    **Definition 14.4 (KA security)** Let $\Sigma$ be a key-agreement protocol. We
    write $\Sigma.\mathcal{K}$ for the keyspace of the protocol (i.e., the set of
    possible keys it produces). We write $(t, K) \leftarrow \text{EXECPROT}(\Sigma)$
    to denote the process of executing the protocol between two honest parties, where
    $t$ denotes the resulting transcript, and $K$ is resulting key. Note that this
    process is randomized, and that $K$ is presumably correlated to $t$.


    We say that $\Sigma$ is **secure** if $\mathcal{L}^{\Sigma}_{\text{ka-real}} \approx
