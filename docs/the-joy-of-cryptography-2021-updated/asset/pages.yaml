- pgno: 155
  md: '# CBC: Cipher Block Chaining


    CBC (which stands for cipher block chaining) is the most common mode in practice.
    The CBC encryption of an $\ell$-block plaintext is $\ell + 1$ blocks long. The
    first ciphertext block is called an **initialization vector (IV)**. Here we have
    described CBC mode as a randomized encryption, with the IV of each ciphertext
    being chosen uniformly. As you know, randomization is necessary (but not sufficient)
    for achieving CPA security, and indeed CBC mode provides CPA security.


    **Construction 8.2 (CBC Mode)**


    \(\underline{\text{Enc}(k, m_1 || \cdots || m_\ell):}\)

    \(c_0 \leftarrow \{0, 1\}^{blen};\)

    for \(i = 1\) to \(\ell\):

    \(c_i := F(k, m_i \oplus c_{i-1})\)

    return \(c_0 || c_1 || \cdots || c_\ell\)


    [Encryption Diagram]


    \(\underline{\text{Dec}(k, c_0 || \cdots || c_\ell):}\)

    for \(i = 1\) to \(\ell\):

    \(m_i := F^{-1}(k, c_i) \oplus c_{i-1}\)

    return \(m_1 || \cdots || m_\ell\)


    [Decryption Diagram]


    # CTR: Counter


    The next most common mode in practice is counter mode (usually abbreviated as
    CTR mode). Just like CBC mode, it involves an additional IV block \(r\) that is
    chosen uniformly. The idea is to then use the sequence


    ```

    \(F(k, r); \quad F(k, r + 1); \quad F(k, r + 2); \quad \cdots\)

    ```


    as a long one-time pad to mask the plaintext. Since \(r\) is a block of bits,
    the addition expressions like \(r + 1\) refer to addition modulo \(2^{blen}\)
    (this is the typical behavior of unsigned addition in a processor).'
