- pgno: 79
  md: '# Asymptotic Running Time


    It is instructive to think about the monetary cost of an enormous computation,
    but it doesn''t necessarily help us draw the line between “feasible” attacks (which
    we want to protect against) and “infeasible” ones (which we agreed we don''t need
    to care about). We need to be able to draw such a line in order to make security
    definitions that say “only feasible attacks are ruled out.”


    Once again, John Nash thought about this question. He suggested to consider the
    **asymptotic cost of an attack** — how does the cost of a computation scale as
    the security parameter \(\lambda\) goes to infinity?


    > _So a logical way to classify enciphering processes is by **the way in which
    the computation length for the computation of the key increases with increasing
    length of the key. This is at best exponential and at worst probably a relatively
    small power of**_ \(\lambda\)_, a_ \(\cdot\lambda^2\) _or_ \(a\cdot\lambda^3\)_,
    as in substitution ciphers._


    Nash highlights the importance of attacks that run in polynomial time:


    **Definition 4.1** _A program runs in **polynomial time** if there exists a constant_
    \(c>0\) _such that for all sufficiently long input strings x, the program stops
    after no more than_ \(O(|x|^c)\) _steps._


    Polynomial-time algorithms scale reasonably well (especially when the exponent
    is small), but exponential-time algorithms don''t. It is probably no surprise
    to modern readers to see “polynomial-time” as a synonym for “efficient.” However,
    it''s worth pointing out that, again, Nash is years ahead of his time relative
    to the field of computer science.


    In the context of cryptography, our goal will be to ensure that no polynomial-time
    attack can successfully break security. We will not worry about attacks like brute-force
    that require exponential time.


    Polynomial time is not a perfect match to what we mean when we informally talk
    about “efficient” algorithms. Algorithms with running time \(\Theta(n^{1000})\)
    are technically polynomial-time, while those with running time \(\Theta(n^{log
    log log n})\) aren''t. Despite that, polynomial-time is extremely useful because
    of the following **closure property**: repeating a polynomial-time process a polynomial
    number of times results in a polynomial-time process overall.


    # Potential Pitfall: Numerical Algorithms


    When we study public-key cryptography, we will discuss algorithms that operate
    on very large numbers (e.g., thousands of bits long). You must remember that representing
    the number _N_ on a computer requires only ~ \(log_2 N\) bits. This means that
    \(log_2 N\), rather than _N_, is our security parameter! We will therefore be
    interested in whether certain operations on the number _N_ run in polynomial-time
    as a function of \(log_2 N\), rather than in _N_. Keep in mind that the difference
    between running time _O_(log _N_) and _O_(_N_) is the difference between writing
    down a number and counting to the number.


    For reference, here are some numerical operations that we will be using later
    in the class, and their known efficiencies:'
