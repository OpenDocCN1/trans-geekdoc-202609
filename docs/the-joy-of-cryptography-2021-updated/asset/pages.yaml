- pgno: 23
  md: '... are useful for incorporating arbitrary binary data into a structured file
    format that supports limited kinds of characters. But since base64 encoding/decoding
    involves no secret information, it adds nothing in terms of security.


    +   ► Sometimes the simplest way to describe an encryption scheme is with operations
    on binary strings (i.e., 0s and 1s) data. As we will see, one-time pad is defined
    in terms of plaintexts represented as strings of bits. (Future schemes will require
    inputs to be represented as a bitstring of a specific length, or as an element
    of $\mathbb{Z}_n$, etc.)


    In order to make sense of some algorithms in this course, it may be necessary
    to think about data being converted into binary representation. Just like with
    base64, representing things in binary has no effect on security since it does
    not involve any secret information. **Writing something in binary is not a security
    measure!**


    # 1.2 Specifics of One-Time Pad


    People have been trying to send secret messages for roughly 2000 years, but there
    are really only 2 useful ideas from before 1900 that have any relevance to modern
    cryptography. The first idea is Kerckhoffs’ principle, which you have already
    seen. The other idea is **one-time pad (OTP)**, which illustrates several important
    concepts, and can even still be found hiding deep inside many modern encryption
    schemes.


    One-time pad is sometimes called “Vernam’s cipher” after Gilbert Vernam, a telegraph
    engineer who patented the scheme in 1919. However, an earlier description of one-time
    pad was rather recently discovered in an 1882 text by Frank Miller on telegraph
    encryption.2


    In most of this book, secret keys will be strings of bits. We generally use the
    variable $\lambda$ to refer to the length (# of bits) of the secret key in a scheme,
    so that keys are elements of the set $\{0, 1\}^\lambda$. In the case of one-time
    pad, the choice of $\lambda$ doesn’t affect security ($\lambda = 10$ is “just
    as secure” as $\lambda = 1000$); however, the length of the keys and plaintexts
    must be compatible. In future chapters, increasing $\lambda$ has the effect of
    making the scheme harder to break. For that reason, $\lambda$ is often called
    the **security parameter** of the scheme.


    In one-time pad, not only are the keys $\lambda$-bit strings, but plaintexts and
    ciphertexts are too. You should consider this to be just a simple coincidence,
    because we will soon encounter schemes in which keys, plaintexts, and ciphertexts
    are strings of different sizes.


    The specific KeyGen, Enc, and Dec algorithms for one-time pad are given below:


    | Construction 1.1 (One-time pad) | KeyGen: $k \leftarrow \{0, 1\}^\lambda$ return
    $k$ | Enc($k, m \in \{0, 1\}^\lambda$): return $k \oplus m$ | Dec($k, c \in \{0,
    1\}^\lambda$): return $k \oplus c$ |


    Recall that “\( k \leftarrow \{0, 1\}^\lambda \)” means to sample \( k \) uniformly
    from the set of \(\lambda\)-bit strings. This uniform choice of key is the only
    randomness in all of the one-time pad algorithms. As we will see, all of its security
    stems from this choice of using the uniform distribution; keys that are chosen
    differently do not provide equivalent security.


    2See the article Steven M. Bellovin: “Frank Miller: Inventor of the One-Time Pad.”
    *Cryptologia* 35 (3), 2011.'
