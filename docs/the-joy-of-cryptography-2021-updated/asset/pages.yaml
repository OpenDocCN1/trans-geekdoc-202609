    \ the *only way*) to distinguish these two libraries, therefore, would be to call\
    \ SAMP many times. If you ever see a repeated output, then you must certainly\
    \ be linked to $\\mathcal{L}_{\\text{samp-L}}$. After some number of calls to\
    \ SAMP, if you still don’t see any repeated outputs, you might eventually stop\
    \ and guess that you are linked to $\\mathcal{L}_{\\text{samp-R}}$.\n\nLet $\\\
    mathcal{A}_q$ denote this “obvious” calling program that makes $q$ calls to SAMP\
    \ and returns 1 if it sees a repeated value. Clearly, the program can never return\
    \ 1 when it is linked to $\\mathcal{L}_{\\text{samp-R}}$. On the other hand, when\
    \ it is linked to $\\mathcal{L}_{\\text{samp-L}}$, it returns 1 with probability\
    \ exactly BirthdayProb$(q, 2^\\lambda)$. Therefore, the *advantage* of $\\mathcal{A}_q$\
    \ is exactly BirthdayProb$(q, 2^\\lambda)$. \n\nThis program behaves differently\
    \ in the presence of these two libraries, therefore they are not *interchangeable*.\
    \ But are the libraries *indistinguishable*? We have demonstrated a calling program\
    \ with advantage BirthdayProb$(q, 2^\\lambda)$. We have not specified $q$ exactly,\
    \ but if $\\mathcal{A}_q$ is meant to run in polynomial time (as a function of\
    \ $\\lambda$), then $q$ must be a polynomial function of $\\lambda$. Then the\
    \ advantage of $\\mathcal{A}_q$ is BirthdayProb$(q, 2^\\lambda) = \\Theta(q^2/2^\\\
    lambda)$, which is *negligible*!\n\nTo show that the libraires are indistinguishable,\
    \ we have to show that *all* calling programs have negligible advantage. It is\
    \ not enough just to show that this *particular* calling program has negligible\
    \ advantage. Perhaps surprisingly, the “obvious” calling program that we considered\
    \ is the *best possible* distinguisher!\n\n# **Lemma 4.11 (Repl. Sampling)**\n\
    \nLet $\\mathcal{L}_{\\text{samp-L}}$ and $\\mathcal{L}_{\\text{samp-R}}$ be defined\
