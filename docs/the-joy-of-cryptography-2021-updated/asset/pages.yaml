- pgno: 78
  md: 'We call $\lambda$ the **security parameter** of the scheme. It is like a knob
    that allows the user to tune the security to any desired level. Increasing $\lambda$
    makes the difficulty of a brute-force attack grow exponentially fast. Ideally,
    when using $\lambda$-bit keys, every attack (not just a brute-force attack) will
    have difficulty roughly $2^\lambda$. However, sometimes faster attacks are inevitable.
    Later in this chapter, we will see why many schemes with $\lambda$-bit keys have
    attacks that cost only $2^{\lambda/2}$. It is common to see a scheme described
    as having **$n$-bit security** if the best known attack requires $2^n$ steps.


    Just how impractical is a brute-force computation on a 64-bit key? A 128-bit key?
    Huge numbers like $2^{64}$ and $2^{128}$ are hard to grasp at an intuitive level.


    **Example** It can be helpful to think of the cost of a computation in terms of
    monetary value, and a convenient way to assign such monetary costs is to use the
    pricing model of a cloud computing provider. Below, I have calculated roughly
    how much a computation involving $2^\lambda$ CPU cycles would cost on Amazon EC2,
    for various choices of $\lambda$.


    | clock cycles | approx cost | reference |

    |---|---|---|

    | $2^{50}$ | $3.50 | cup of coffee |

    | $2^{55}$ | $100 | decent tickets to a Portland Trailblazers game |

    | $2^{65}$ | $130,000 | median home price in Oshkosh, WI |

    | $2^{75}$ | $130 million | budget of one of the Harry Potter movies |

    | $2^{85}$ | $140 billion | GDP of Hungary |

    | $2^{92}$ | $20 trillion | GDP of the United States |

    | $2^{99}$ | $2 quadrillion | all of human economic activity since 300,000 BC$^4$
    |

    | $2^{128}$ | really a lot | a billion human civilizations'' worth of effort |


    Remember, this table only shows the cost to perform $2^\lambda$ clock cycles.
    A brute-force attack checking $2^\lambda$ keys would take many more cycles than
    that! But, as a disclaimer, these numbers reflect only the retail cost of performing
    a computation, on fairly standard general-purpose hardware. A government organization
    would be capable of manufacturing special-purpose hardware that would significantly
    reduce the computation''s cost. The exercises explore some of these issues, as
    well as non-financial ways of conceptualizing the cost of huge computations.


    **Example** In 2017, the first collision in the SHA-1 hash function was found
    (we will discuss hash functions later in the course). The attack involved evaluating
    the SHA-1 function $2^{63}$ times on a cluster of GPUs. An article in Ars Technica$^5$
    estimates the monetary cost of the attack as follows:


    > Had the researchers performed their attack on Amazon''s Web Services platform,
    it would have cost $560,000 at normal pricing. Had the researchers been patient
    and waited to run their attack during off-peak hours, the same collision would
    have cost $110,000.


    $^3$As of October 2018, the cheapest class of CPU that is suitable for an intensive
    computation is the m5.large, which is a 2.5 GHz CPU. Such a CPU performs $2^{43}$
    clock cycles per hour. The cheapest rate on EC2 for this CPU is 0.044 USD per
    hour (3-year reserved instances, all costs paid upfront). All in all, the cost
    for a single clock cycle (rounding down) is $2^{-48}$ USD.


    $^4$I found some estimates (https://en.wikipedia.org/wiki/Gross_world_product)
    of the gross world product (like the GDP but for the entire world) throughout
    human history, and summed them up for every year.


    $^5$https://arstechnica.com/information-technology/2017/02/at-deaths-door-for-years-widely-used-sha1-function-is-now-de'
