    \n$$\\mathcal{L}^G_{\\text{prg-real}} \\approx \\mathcal{L}_{\\text{hyb-1}} \\\
    approx \\dots \\approx \\mathcal{L}_{\\text{hyb-}q} \\approx \\mathcal{L}^G_{\\\
