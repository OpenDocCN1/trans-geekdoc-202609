    \ the adversary must call CHECKTAG on input $(m, t)$ such that $m$ was never used\
    \ as an argument to GETTAG (so that $\\mathcal{L}_{\\text{mac-fake}}$ responds\
    \ false) but where the tag is actually correct (so that $\\mathcal{L}_{\\text{mac-real}}$\
    \ responds true).\n\n+   The adversary can successfully distinguish if it finds\
    \ *any* forgery – a valid MAC tag of *any* “fresh” message. The definition doesn’t\
    \ care whether it’s the tag of any particular *meaningful* message.\n\n# MAC Applications\n\
    \nAlthough MACs are less embedded in public awareness than encryption, they are\
    \ extremely useful. A frequent application of MACs is to store some information\
    \ in an untrusted place, where we don’t intend to *hide* the data, only ensure\
    \ that the data is not changed.\n\n+   A **browser cookie** is a small piece of\
    \ data that a webserver stores in a user’s web browser. The browser presents the\
    \ cookie data to the server upon each request.\n\nImagine a webserver that stores\
    \ a cookie when a user logs in, containing that user’s account name. What stops\
    \ an attacker from modifying their cookie to contain a different user’s account\
    \ name? Adding a MAC tag of the cookie data (using a key known only to the server)\
    \ ensures that such an attack will not succeed. The server can trust any cookie\
    \ data whose MAC tag is correct.\n\n+   When Alice initiates a network connection\
    \ to Bob, they must perform a TCP hand-shake:"
