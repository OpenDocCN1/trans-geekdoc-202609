- pgno: 82
  md: 'We use the terminology of negligible functions exclusively when discussing
    probabilities, so the following are common:


    ```

    Pr[X] ≈ 0 ⇔ “event X almost never happens”

    Pr[Y] ≈ 1 ⇔ “event Y almost always happens”

    Pr[A] ≈ Pr[B] ⇔ “events A and B happen with

    essentially the same probability”⁶

    ```


    Additionally, the ≈ symbol is _transitive_.<sup>7</sup> if Pr[X] ≈ Pr[Y] and Pr[Y]
    ≈ Pr[Z], then Pr[X] ≈ Pr[Z] (perhaps with a slightly larger, but still negligible,
    difference).


    # 4.3 Indistinguishability


    So far we have been writing formal security definitions in terms of interchangeable
    libraries, which requires that two libraries have _exactly the same effect_ on
    _every_ calling program. Going forward, our security definitions will not be quite
    as demanding. First, we only consider polynomial-time calling programs; second,
    we don’t require the libraries to have exactly the same effect on the calling
    program, only that the difference in effects is negligible.


    Definition 4.5 (Indistinguishable) _Let_ L<sub>left</sub> _and_ L<sub>right</sub>
    _be two libraries with a common interface. We say that_ L<sub>left</sub> _and_
    L<sub>right</sub> _are_ **indistinguishable**, _and write_ L<sub>left</sub> ≈
    L<sub>right</sub>_, if for all polynomial-time programs_ A _that output a single
    bit,_ Pr[A ◊ L<sub>left</sub> ⇒ 1] ≈ Pr[A ◊ L<sub>right</sub> ⇒ 1]_._

    _We call the quantity_ |Pr[A ◊ L<sub>left</sub> ⇒ 1] - Pr[A ◊ L<sub>right</sub>
    ⇒ 1]| _the_ **_advantage_** _or_ **_bias_** _of_ A _in distinguishing_ L<sub>left</sub>
    _from_ L<sub>right</sub>_. Two libraries are therefore indistinguishable if all
    polynomial-time calling programs have negligible advantage in distinguishing them._


    From the properties of the “≈” symbol, we can see that indistinguishability of
    libraries is also transitive, which allows us to carry out hybrid proofs of security
    in the same way as before.


    Example _Here is a very simple example of two indistinguishable libraries:_


    | L<sub>left</sub> | L<sub>right</sub> |

    |---|---|

    | PREDICT(x):

    s ← {0,1}^λ

    return x = s | PREDICT(x):

    return false |'
