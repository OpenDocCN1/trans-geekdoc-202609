    star}$ libraries are interchangeable.\n\n```\n$\\mathcal{L}^\\Sigma_{\\text{ots\\\
    $-rand}}$\nCTXT(m):\n  \\( c \\leftarrow \\Sigma.C \\)\n  return c\n```\n\nThe\
    \ argument to CTXT has been changed from \\( m_L \\) to \\( m_R \\). This has\
    \ no effect on the library’s behavior since CTXT does not actually use its argument\
    \ in these hybrids!\n\nThe previous transition is the most important one in the\
    \ proof, as it gives insight into how we came up with this particular sequence\
    \ of hybrids. Looking at the desired endpoints of our sequence of hybrids – $\\\
    mathcal{L}^\\Sigma_{\\text{ots-L}}$ and $\\mathcal{L}^\\Sigma_{\\text{ots-R}}$\
