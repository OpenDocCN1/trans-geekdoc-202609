    To prove the theorem, we will show:


    +   - if there is an efficient algorithm for (1), then we can use it as a subroutine
    to construct an efficient algorithm for (2). This is straight-forward: if you
    have a subroutine factoring $N$ into $p$ and $q$, then you can call the subroutine
