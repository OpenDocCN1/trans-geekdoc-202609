- pgno: 126
  md: "![](img/da79fa21b263fe549aecaabd2a0a41c8_126_0.png)\n\nImagine a complete binary\
    \ tree of height $in$ ($in$ will be the input length of the PRF). Every node in\
    \ this tree has a *position* which can be written as a binary string. Think of\
    \ a node's position as the directions to get there starting at the root, where\
    \ a 0 means “go left” and 1 means “go right.” For example, the root has position\
    \ $\\epsilon$ (the empty string), the right child of the root has position 1,\
    \ etc.\n\nThe PRF construction works by assigning a *label* to every node in the\
    \ tree, using the a length-doubling PRG $G : \\{0, 1\\}^\\lambda \\rightarrow\
    \ \\{0, 1\\}^{2\\lambda}$. For convenience, we will write $G_L(k)$ and $G_R(k)$\
    \ to denote the first $\\lambda$ bits and last $\\lambda$ bits of $G(k)$, respectively.\
    \ Labels in the tree are $\\lambda$-bit strings, computed according to the following\
    \ two rules:\n\n+   1. The root node's label is the PRF seed.\n+   \n+   2. If\
    \ the node at position $p$ has label $v$, then its left child (at position $p||0$)\
    \ gets label $G_L(v)$, and its right child (at position $p||1$) gets label $G_R(v)$.\n\
    \nIn the picture above, a node's label is the string being sent on its incoming\
    \ edge. The tree has $2^{in}$ leaves, whose positions are the strings $\\{0, 1\\\
    }^{in}$. We define $F(k, x)$ to be the label of node/leaf $x$. To compute this\
    \ label, we can traverse the tree from root to leaf, taking left and right turns\
    \ at each node according to the bits of $x$ and computing the labels along that\
    \ path according to the labeling rule. In the picture above, the highlighted path\
    \ corresponds to the computation of $F(k, 1001 \\cdots)$. \n\nIt is important\
    \ to remember that the binary tree is a useful conceptual tool, but it is exponentially\
    \ large in general. Running the PRF on some input does not involve computing labels\
    \ for the entire tree, only along a single path from root to leaf."
