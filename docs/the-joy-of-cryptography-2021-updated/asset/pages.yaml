- pgno: 80
  md: '| Efficient algorithm known: | No known efficient algorithm: |

    |---|---|

    | Computing GCDs | Factoring integers |

    | Arithmetic mod N | Computing \(\phi(N)\) given \(N\) |

    | Inverses mod N | Discrete logarithm |

    | Exponentiation mod N | Square roots mod composite \(N\) |


    Again, “efficient” means polynomial-time. Furthermore, we only consider polynomial-time
    algorithms that run on standard, *classical* computers. In fact, all of the problems
    in the right-hand column *do* have known polynomial-time algorithms on *quantum*
    computers.


    # ## 4.2 What Qualifies as a “Negligible” Success Probability?


    It is not enough to consider only the running time of an attack. For example,
    consider an attacker who just tries to guess a victim’s secret key, making a single
    guess. This attack is extremely cheap, but it still has a nonzero chance of breaking
    security!


    In addition to an attack’s running time, we also need to consider its success
    probability. We don’t want to worry about attacks that are as expensive as a brute-force
    attack, and we don’t want to worry about attacks whose success probability is
    as low as a blind-guess attack.


    An attack with success probability \(2^{-128}\) should not really count as an
    attack, but an attack with success probability 1/2 should. Somewhere in between
    \(2^{-128}\) and \(2^{-1}\) we need to find a reasonable place to draw a line.


    Example


    Now we are dealing with extremely tiny probabilities that can be hard to visualize.
    Again, it can be helpful to conceptualize these probabilities with a more familiar
    reference:


    | probability | equivalent |

    |---|---|

    | \(2^{-10}\) | full house in 5-card poker |

    | \(2^{-20}\) | royal flush in 5-card poker |

    | \(2^{-28}\) | you win this week’s Powerball jackpot |

    | \(2^{-40}\) | royal flush in 2 consecutive poker games |

    | \(2^{-60}\) | the next meteorite that hits Earth lands in this square → | ![square](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiNjZmQ0ZGIiLz48L3N2Zz4=)
    |


    As before, it is not clear exactly where to draw the line between “reasonable”
    and “unreasonable” success probability for an attack. Just like we did with polynomial
    running time, we can also use an **asymptotic** approach to define when a probability
    is negligibly small. Just as “polynomial time” considers how fast an algorithm’s
    running time approaches infinity as its input grows, we can also consider how
    fast a success probability approaches zero as the security parameter grows.


    In a scheme with \(\lambda\)-bit keys, a blind-guessing attack succeeds with probability
    \(1/2^\lambda\). Now what about an attacker who makes 2 blind guesses, or \(\lambda\)
    guesses, or \(\lambda^{42}\) guesses? Such an attacker would still run in polynomial
    time, and has success probability \(2/2^\lambda\), \(\lambda/2^\lambda\), or \(\lambda^{42}/2^\lambda\).
    However, no matter what polynomial you put in the numerator, the probability still
    goes to zero. Indeed, \(1/2^\lambda\) **approaches zero so fast that no polynomial
    can “rescue” it**; or, in other words, it approaches zero faster than 1 over any
    polynomial. This idea leads to our formal definition:'
