    \ to Lemma 4.11.\n\n```\nCTXT(m):\n  r <- {0, 1}$^\\lambda$\n  z <- {0, 1}$^{\\\
    text{out}}$\n  x := z $\\oplus$ m\n  return (r, x)\n```\n\nAll of the subroutine\
    \ calls have been inlined; no effect on the library’s output behavior.\n\n```\n\
    $\\mathcal{L}^\\Sigma_{\\text{cpa\\$-rand}}$:\nCTXT(m):\n  r <- {0, 1}$^\\lambda$\n\
    \  x <- {0, 1}$^{\\text{out}}$\n  return (r, x)\n```\n\nWe have applied the one-time\
