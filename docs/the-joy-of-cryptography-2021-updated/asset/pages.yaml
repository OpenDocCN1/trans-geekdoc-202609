    If this A is linked to a different library, its output probability may be different.
    If a different calling program is linked to this L, the output probability may
    be different.


    **Example** A library can contain several subroutines and private variables that
    are kept static between subroutine calls. For example, here is a simple library
    that picks a string s uniformly and allows the calling program to guess s.


    ```

    L

    s ← {0, 1}^λ

    RESET():

    s ← {0, 1}^λ

    GUESS(x ∈ {0, 1}^λ):

    return x = s

    ```


    Our convention is that code outside of a subroutine (like the first line here)
    is run once at initialization time. Variables defined at initialization time (like
    s here) are available in all subroutine scopes (but not to the calling program).


    # Interchangeability


    The idea that “no calling program behaves differently in the presence of these
    two libraries” still makes sense even for libraries with several subroutines.
    Since this is such a common concept, we devote new notation to it:


    **Definition 2.4**

    **(Interchangeable)** Let L_left and L_right be two libraries that have the same
    interface. We say that L_left and L_right are **interchangeable**, and write L_left
    ≡ L_right , if for all programs A that output a boolean value,


    Pr[A ∘ L_left ⇒ true] = Pr[A ∘ L_right ⇒ true].


    This definition considers calling programs that give boolean output. Imagine a
    calling program / attacker whose only goal is to distinguish two particular libraries
    (indeed, we often refer to the calling program as a **distinguisher**). A boolean
    output is enough for that task. You can think of the output bit as the calling
    program’s “guess” for which library the calling program thinks it is linked to.'
