    \ reaching $\\mathcal{L}_{\\text{ots-R}}$. Along the way, we can use the fact\
    \ that $\\mathcal{L}_{\\text{ots\\$-real}} \\equiv \\mathcal{L}_{\\text{ots\\\
    $-rand}}$. This suggests some “strategy” for the proof: if we can somehow get\
    \ $\\mathcal{L}_{\\text{ots\\$-real}}$ to appear as a component in one of the\
    \ hybrid libraries, then we can replace it with $\\mathcal{L}_{\\text{ots\\$-rand}}$\
    \ (or vice-versa), in a way that hopefully makes progress towards our goal of\
    \ transforming $\\mathcal{L}_{\\text{ots-L}}$ to $\\mathcal{L}_{\\text{ots-R}}$.\n\
    \nBelow we list the sequence of hybrid libraries, and justify why each one is\
    \ interchangeable with the previous library.\n\n```\n$\\mathcal{L}^\\Sigma_{\\\
    text{ots-L}}$\nEAVESDROP($m_L, m_R$):\n  \\( k \\leftarrow \\Sigma.\\text{KeyGen}\
    \ \\)\n  \\( c \\leftarrow \\Sigma.\\text{Enc}(k, m_L) \\)\n  return c\n```\n\n\
    The starting point of our hybrid sequence is $\\mathcal{L}^\\Sigma_{\\text{ots-L}}$.\n\
    \n```\n$\\mathcal{L}^\\Sigma_{\\text{ots\\$-real}}$\nCTXT(m):\n  \\( k \\leftarrow\
    \ \\Sigma.\\text{KeyGen} \\)\n  \\( c \\leftarrow \\Sigma.\\text{Enc}(k, m) \\\
    )\n  return c\n```\n\nFactoring out a block of statements into a subroutine makes\
    \ it possible to write the library as a _compound_ one, but does not affect its\
    \ external behavior. Note that the new subroutine is exactly the $\\mathcal{L}^\\\
    Sigma_{\\text{ots\\$-real}}$ library from Definition 2.5. This was a strategic\
    \ choice, because of what happens next.\n\n```\n$\\mathcal{L}^\\Sigma_{\\text{ots\\\
    $-rand}}$\nCTXT(m):\n  \\( c \\leftarrow \\Sigma.C \\)\n  return c\n```\n\n$\\\
    mathcal{L}^\\Sigma_{\\text{ots\\$-real}}$ has been replaced with $\\mathcal{L}^\\\
    Sigma_{\\text{ots\\$-rand}}$. The chaining lemma Lemma 2.11 says that this change\
