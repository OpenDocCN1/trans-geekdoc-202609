  md: '# # Secret Sharing


    DNS is the system that maps human-memorable Internet domains like `irs.gov` to
    machine-readable IP addresses like `166.123.218.220`. If an attacker can masquerade
    as the DNS system and convince your computer that `irs.gov` actually resides at
    some other IP address, it might result in a bad day for you.


    To protect against these kinds of attacks, a replacement called DNSSEC has been
    proposed. DNSSEC uses cryptography to make it impossible to falsify a domain-name
    mapping. The cryptography required to authenticate DNS mappings is certainly interesting,
    but an even more fundamental question remains: *Who can be trusted with the master
    cryptographic keys to the system?* The non-profit organization in charge of these
    kinds of things (ICANN) has chosen the following system. The master key is split
    into 7 pieces and distributed on smart cards to 7 geographically diverse people,
    who keep them in safe-deposit boxes.


    > > At least five key-holding members of this fellowship would have to meet at
    a secure data center in the United States to reboot [DNSSEC] in case of a very
    unlikely system collapse.


    > > "If you round up five of these guys, they can decrypt [the root key] should
    the West Coast fall in the water and the East Coast get hit by a nuclear bomb,"
    [said] Richard Lamb, program manager for DNSSEC at ICANN.1


    How is it possible that *any* 5 out of the 7 key-holders can reconstruct the master
    key, but (presumably) 4 out of the 7 cannot? The solution lies in a cryptographic
    tool called a **secret-sharing scheme**, the topic of this chapter.


    # ## 3.1 Definitions


    We begin by introducing the syntax of a secret-sharing scheme:


    **Definition 3.1** (Secret-sharing) *A t-out-of-n threshold secret-sharing scheme
    (TSSS) consists of the following algorithms:*


    +   - Share: *a randomized algorithm that takes a **message** $m \in \mathcal{M}$
    as input, and outputs a sequence $s = (s_1, \dots, s_n)$ of **shares**.*

    +   - Reconstruct: *a deterministic algorithm that takes a collection of $t$ or
    more shares as input, and outputs a message.*


    We call $\mathcal{M}$ the **message space** of the scheme, and $t$ its **threshold**.
    As usual, we refer to the parameters/components of a scheme $\Sigma$ as $\Sigma.t$,
    $\Sigma.n$, $\Sigma.\mathcal{M}$, $\Sigma$.Share, $\Sigma$.Reconstruct.


    1 http://www.livescience.com/6791-internet-key-holders-insurance-cyber-attack.html'
