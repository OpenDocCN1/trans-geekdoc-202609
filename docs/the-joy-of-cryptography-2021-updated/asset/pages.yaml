    # # Hash Function Security In Practice


    We will focus on developing a formal definition for collision resistance. We can
    take some inspiration from the security definition for MACs. Security for a MAC
    means that it should be hard to produce a forgery. The MAC security definition
    formalized that idea with one library that checks for a forgery and another library
    that assumes a forgery is impossible. If the two libraries are indistinguishable,
    then it must be hard to find a forgery.


    We can take a similar approach to say that it should be hard to produce a collision.
    Here is an attempt:


    ```

    TEST(x, x''):

    if x ≠ x'' and H(x) = H(x''): return true

    else: return false

    ≈

    TEST(x, x''):

    return false

    ```


    This corresponds to what I would call the “folk definition” of collision resistance.
    It makes intuitive sense (as long as you’re comfortable with our style of security
    definition), but unfortunately the definition suffers from a very subtle technical
    problem.


    Because of Kerckhoffs’ principle, we allow calling programs to depend arbitrarily
    on the source code of the two libraries. This is a way of formalizing the idea
    that “the attacker knows everything about the algorithms.” Our security definitions
    restrict calling programs to be polynomial-time algorithms, but they never consider
    the effort that goes into finding the source code of the calling program!


    This strange loophole leads to the following valid attack. When we consider the
    security of some function H, we know that there exists many collisions (x, x’)
    in H. These collisions may be hard to find, but they certainly exist. With exponential
    time, we could find such an (x, x’) pair and write down the code of an attacker:


    ```

    A:

    return TEST(x, x'')

    ```


    Here, the values x and x’ are hard-coded into A. The algorithm A is clearly polynomial-time
    (in fact, constant time). The “loophole” is that the definition considers only
    the cost of running the algorithm A, and not the cost of finding the source code
    of A.'
