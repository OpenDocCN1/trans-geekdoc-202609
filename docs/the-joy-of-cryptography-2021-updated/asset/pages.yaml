- pgno: 17
  md: "Imagine I roll the dice one after another, and I pause the universe (set a\
    \ breakpoint) after rolling the first die but before rolling the second one. The\
    \ universe has already decided the result of the first die, so let’s call that\
    \ value d. The dice will match only if the second roll comes up d. Rolling d on\
    \ the second die (indeed, rolling any particular value) happens with probability\
    \ 1/6.\n\nThis technique of setting breakpoints is simple but powerful and frequently\
    \ useful. Some other closely related tricks are: (1) postponing a random choice\
    \ until the last possible moment, just before its result is used for the first\
    \ time, and (2) switching the relative order of independent random choices.\n\n\
    # Precise Terminology\n\nIt is tempting in this course to say things like “x is\
    \ a random string.” But a statement like this is sloppy on several accounts.\n\
    \nFirst, is 42 a random number? Is “heads” a random coin? What is even being asked\
    \ by these questions? Being “random” is not a property of an outcome (like a number\
    \ or a side of a coin) but a property of the process that generates an outcome.3\
    \ Instead of saying “x is a random string,” it’s much more precise to say “x was\
    \ chosen randomly.”\n\nSecond, usually when we use the word “random,” we don’t\
    \ mean any old probability distribution. We usually mean to refer to the uniform\
    \ distribution. Instead of saying “x was chosen randomly,” it’s much more precise\
    \ to say “x was chosen uniformly” (assuming that really is what you mean).\n\n\
    Every cryptographer I know (yes, even your dear author) says things like “x is\
    \ a random string” all the time to mean “x was chosen uniformly [from some set\
    \ of strings].” Usually the meaning is clear from context, at least to the other\
    \ cryptographers in the room. But all of us could benefit by having better habits\
    \ about this sloppy language. Students especially will benefit by internalizing\
    \ the fact that randomness is a property of the process, not of the individual\
    \ outcome.\n\n# 0.6 Notation in Pseudocode\n\nWe’ll often describe algorithms/processes\
    \ using pseudocode. In doing so, we will use several different operators whose\
    \ meanings might be easily confused:\n\n+   ← When D is a probability distribution,\
    \ we write “x ← D” to mean “sample x according to the distribution D.”\n+   \n\
    +   If A is an algorithm that takes input and also makes some internal random\
    \ choices, then it is natural to think of its output A(y) as a distribution —\
    \ possibly a different distribution for each input y. Then we write “x ← A(y)”\
    \ to mean the natural thing: “run A on input y and assign the output to x.”\n\n\
    3 There is something called Kolmogorov complexity that can actually give coherent\
    \ meaning to statements like “x is a random string.” But Kolmogorov complexity\
    \ has no relevance to this book. The statement “x is a random string” remains\
    \ meaningless with respect to the usual probability-distribution sense of the\
    \ word “random.”"
