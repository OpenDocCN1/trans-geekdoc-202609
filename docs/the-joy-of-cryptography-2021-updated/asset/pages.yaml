  md: '# # 7 Security Against Chosen Plaintext Attacks


    Our previous security definitions for encryption capture the case where a key
    is used to encrypt only one plaintext. Clearly it would be more useful to have
    an encryption scheme that allows many plaintexts to be encrypted under the same
    key.


    Fortunately we have arranged things so that we get the “correct” security definition
    when we modify the earlier definition in a natural way. We simply let the libraries
    choose a secret key once and for all, which is used to encrypt all plaintexts.
    More formally:


    Definition 7.1 (CPA security) Let \(\Sigma\) be an encryption scheme. We say that
    \(\Sigma\) has security against chosen-plaintext attacks (CPA security) if \(\mathcal{L}^\Sigma_{\text{cpa-L}}
    \approx \mathcal{L}^\Sigma_{\text{cpa-R}}\), where:


    ```

    \(\mathcal{L}^\Sigma_{\text{cpa-L}}\)

    \(k \leftarrow \Sigma.KeyGen\)

    \(\underline{\text{EAVESDROP}(m_L, m_R \in \Sigma.\mathcal{M})}\):

    \(c := \Sigma.\text{Enc}(k, m_L)\)

    return \(c\)

    ```


    ```

    \(\mathcal{L}^\Sigma_{\text{cpa-R}}\)

    \(k \leftarrow \Sigma.KeyGen\)

    \(\underline{\text{EAVESDROP}(m_L, m_R \in \Sigma.\mathcal{M})}\):

    \(c := \Sigma.\text{Enc}(k, m_R)\)

    return \(c\)

    ```


    Notice how the key \(k\) is chosen at initialization time and is static for all
    calls to Enc. CPA security is often called “IND-CPA” security, meaning “indistinguishability
    of ciphertexts under chosen-plaintext attack.”


    # ## 7.1 Limits of Deterministic Encryption


    We have already seen block ciphers / PRPs, which seem to satisfy everything needed
    for a secure encryption scheme. For a block cipher, \(F\) corresponds to encryption,
    \(F^{-1}\) corresponds to decryption, and all outputs of \(F\) look pseudorandom.
    What more could you ask for in a good encryption scheme?


    Example We will see that a block cipher, when used “as-is,” is **not** a CPA-secure
    encryption scheme. Let \(F\) denote the block cipher and suppose its block length
    is \(blen\). Consider the following adversary \(\mathcal{A}\), that tries to distinguish
    the \(\mathcal{L}_{\text{cpa-}*}\) libraries:


    ```

    \(\mathcal{A}\)

    \(c_1 := \text{EAVESDROP}(0^{blen}, 0^{blen})\)

    \(c_2 := \text{EAVESDROP}(0^{blen}, 1^{blen})\)

    return \(c_1 \stackrel{?}{=} c_2\)

    ```'
