- pgno: 81
  md: '# **Definition 4.2** (Negligible) A function $f$ is **negligible** if, for
    every polynomial $p$, we have $\lim_{\lambda \to \infty} p(\lambda)f(\lambda)
    = 0$.


    In other words, a negligible function approaches zero so fast that you can never
    catch up when multiplying by a polynomial. This is exactly the property we want
    from a security guarantee that is supposed to hold against all polynomial-time
    adversaries. If a polynomial-time attacker succeeds with probability $f$, then
    repeating the same attack $p$ independent times would still be an overall polynomial-time
    attack (if $p$ is a polynomial), and its success probability would be \(p \cdot
    f\). When you want to check whether a function is negligible, you only have to
    consider polynomials \(p\) of the form \(p(\lambda) = \lambda^c\) for some constant
    \(c\):


    # **Claim 4.3** If for every integer \(c\), \(\lim_{\lambda \to \infty} \lambda^c
    f(\lambda) = 0\), then \(f\) is negligible.


    **Proof** Suppose \(f\) has this property, and take an arbitrary polynomial \(p\).
    We want to show that \(\lim_{\lambda \to \infty} p(\lambda)f(\lambda) = 0\). If
    \(d\) is the degree of \(p\), then \(\lim_{\lambda \to \infty} \frac{p(\lambda)}{\lambda^{d+1}}
    = 0\). Therefore, \(\lim_{\lambda \to \infty} p(\lambda)f(\lambda) = \lim_{\lambda
    \to \infty} \left[ \frac{p(\lambda)}{\lambda^{d+1}} \left( \lambda^{d+1} \cdot
    f(\lambda) \right) \right] = \left( \lim_{\lambda \to \infty} \frac{p(\lambda)}{\lambda^{d+1}}
    \right) \left( \lim_{\lambda \to \infty} \lambda^{d+1} \cdot f(\lambda) \right)
    = 0 \cdot 0\). The second equality is a valid law for limits since the two limits
    on the right exist and are not an indeterminate expression like \(0 \cdot \infty\).
    The final equality follows from the hypothesis on \(f\).


    **Example** The function \(f(\lambda) = 1/2^\lambda\) is negligible, since for
    any integer \(c\), we have: \(\lim_{\lambda \to \infty} \lambda^c / 2^\lambda
    = \lim_{\lambda \to \infty} 2^{c \log(\lambda)} / 2^\lambda = \lim_{\lambda \to
    \infty} 2^{c \log(\lambda) - \lambda} = 0\),


    since \(c \log(\lambda) - \lambda\) approaches \(-\infty\) in the limit, for any
    constant \(c\). Using similar reasoning, one can show that the following functions
    are also negligible:


    \(\frac{1}{2^{\lambda/2}}, \quad \frac{1}{2^{\sqrt{\lambda}}}, \quad \frac{1}{2^{\log^2
    \lambda}}, \quad \frac{1}{\lambda^{\log \lambda}}.\)


    Functions like \(1/\lambda^5\) approach zero but not fast enough to be negligible.
    To see why, we can take polynomial \(p(\lambda) = \lambda^6\) and see that the
    resulting limit does not satisfy the requirement from Definition 4.2: \(\lim_{\lambda
    \to \infty} p(\lambda) \frac{1}{\lambda^5} = \lim_{\lambda \to \infty} \lambda
    = \infty \neq 0\)


    In this class, when we see a negligible function, it will typically always be
    one that is easy to recognize as negligible (just as in an undergraduate algorithms
    course, you won''t really encounter algorithms where it''s hard to tell whether
    the running time is polynomial).


    # **Definition 4.4** (\(f \approx g\)) If \(f, g : \mathbb{N} \to \mathbb{R}\)
    are two functions, we write \(f \approx g\) to mean that \(\left| f(\lambda) -
    g(\lambda) \right|\) is a negligible function.'
