- pgno: 119
  md: 'Attacking F means designing distinguisher that behaves as differently as possible
    in the presence of the two $\mathcal{L}^F_{\text{prf-}\star}$ libraries. We want
    to show that $F$ is insecure even if $G$ is an excellent PRG. We should not try
    to base our attack on distinguishing outputs of $G$ from random. Instead, we must
    try to **break the inappropriate way that $G$ is used** to construct a PRF.


    The distinguisher must use the interface of the $\mathcal{L}_{\text{prf-}\star}$
    libraries — i.e., make some calls to the LOOKUP subroutine and output 0 or 1 based
    on the answers it gets. The LOOKUP subroutine takes an argument, so the distinguisher
    has to choose which arguments to use.


    One observation we can make is that if a calling program sees only one value of
    the form $G(k) \oplus x$, it will look pseudorandom. This is essentially what
    we showed in Section 5.3. So we should be looking for a calling program that makes
    more than one call to LOOKUP.


    If we make two calls to LOOKUP — say, on inputs $x_1$ and $x_2$ — the responses
    from $\mathcal{L}^F_{\text{prf-real}}$ will be $G(k) \oplus x_1$ and $G(k) \oplus
    x_2$. To be a secure PRF, these responses must look independent and uniform. Do
    why? They actually have a pattern that the calling program can notice: their XOR
    is always $x_1 \oplus x_2$, a value that is already known to the calling program.


    We can condense all of our observations into the following distinguisher:


    ```

    $\mathcal{A}$

    pick $x_1, x_2 \in \{0, 1\}^{2\lambda}$ arbitrarily so that $x_1 \neq x_2$

    $z_1 := \text{LOOKUP}(x_1)$

    $z_2 := \text{LOOKUP}(x_2)$

    return $z_1 \oplus z_2 \stackrel{?}{=} x_1 \oplus x_2$

    ```


    Let''s compute its advantage in distinguishing $\mathcal{L}^F_{\text{prf-real}}$
    from $\mathcal{L}^F_{\text{prf-rand}}$ by considering $\mathcal{A}$''s behavior
    when linked to these two libraries:


    | $\mathcal{A}$ | $\mathcal{L}^F_{\text{prf-real}}$ |

    | :--- | :--- |

    | pick $x_1 \neq x_2 \in \{0, 1\}^{2\lambda}$<br>$z_1 := \text{LOOKUP}(x_1)$<br>$z_2
    := \text{LOOKUP}(x_2)$<br>return $z_1 \oplus z_2 \stackrel{?}{=} x_1 \oplus x_2$
    | $k \leftarrow \{0, 1\}^\lambda$<br>LOOKUP(x):<br>return $G(k) \oplus x$ // $F(k,
    x)$ |


    When $\mathcal{A}$ is linked to $\mathcal{L}^F_{\text{prf-real}}$, the library
    will choose a key $k$. Then $z_1$ is set to $G(k) \oplus x_1$ and $z_2$ is set
    to $G(k) \oplus x_2$. So $z_1 \oplus z_2$ is always equal to $x_1 \oplus x_2$,
    and $\mathcal{A}$ always outputs 1. That is,


    $\Pr[\mathcal{A} \diamond \mathcal{L}^F_{\text{prf-real}} \Rightarrow 1] = 1$.


    | $\mathcal{A}$ | $\mathcal{L}^F_{\text{prf-rand}}$ |

    | :--- | :--- |

    | pick $x_1 \neq x_2 \in \{0, 1\}^{2\lambda}$<br>$z_1 := \text{LOOKUP}(x_1)$<br>$z_2
    := \text{LOOKUP}(x_2)$<br>return $z_1 \oplus z_2 = x_1 \oplus x_2$ | $T :=$ empty
    assoc. array<br>LOOKUP(x):<br>if $T[x]$ undefined:<br>$T[x] \leftarrow \{0, 1\}^{2\lambda}$<br>return
    $T[x]$ |'
