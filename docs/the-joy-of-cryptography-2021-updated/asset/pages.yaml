    # 3.4 Shamir Secret Sharing


    Part of the challenge in designing a secret-sharing scheme is making sure that
    *any* authorized set of users can reconstruct the secret. We have just seen that
    *any* d + 1 points on a degree-d polynomial are enough to uniquely reconstruct
    the polynomial. So a natural approach for secret sharing is to let each user’s
    share be a point on a polynomial.


    That’s exactly what **Shamir secret sharing** does. To share a secret m ∈ Z_p
    with threshold t, first choose a degree-(t - 1) polynomial f that satisfies f(0)
    ≡_p m, with all'
