- pgno: 177
  md: 'If we want security even under the padding-oracle scenario, we need a better
    security definition and encryption schemes that achieve it. That’s what the rest
    of this chapter is about.


    # Discussion


    +   Is this a realistic concern? You may wonder whether this whole situation is
    somewhat contrived just to give cryptographers harder problems to solve. That
    was probably a common attitude towards the security definitions introduced in
    this chapter. However, in 1998, Daniel Bleichenbacher demonstrated a devastating
    attack against early versions of the SSL protocol. By presenting millions of carefully
    crafted ciphertexts to a webserver, an attacker could eventually recover arbitrary
    SSL session keys.


    In practice, it is hard to make the external behavior of a server *not* depend
    on the result of decryption. This makes CPA security rather fragile in the real
    world. In the case of padding oracle attacks, mistakes in implementation can lead
    to different error messages for invalid padding. In other cases, even an otherwise
    careful implementation can provide a padding oracle through a timing side-channel
    (if the server’s response time is different for valid/invalid padded plaintexts).


    As we will see, it *is* in fact possible to provide security in these kinds of
    settings, and with low additional overhead. These days there is rarely a good
    excuse for using encryption which is only CPA-secure.


    +   Padding is in the name of the attack. But padding is not the culprit. The
    culprit is using a (merely) CPA-secure encryption scheme while allowing some information
    to leak about the result of decryption. The exercises expand on this idea further.


    +   If padding is added to only the *last block* of the plaintext, how can this
    attack recover the *entire* plaintext? This common confusion is another reason
    to not place so much blame on the padding scheme. A padding oracle has the following
    behavior: “give me an encryption of $m_1 || \cdots || m_\ell$ and I’ll tell you
    some information about $m_\ell$ (whether it ends with a certain suffix).” Indeed,
    the padding oracle checks only the last block. However, CBC mode has the property
    that if you have an encryption of $m_1 || \cdots || m_\ell$, then you can easily
    construct a different ciphertext that encrypts $m_1 || \cdots || m_{\ell-1}$.
    If you send *this* ciphertext to the padding oracle, you will get information
    about $m_{\ell-1}$. By modifying the ciphertext (via the malleability of CBC),
    you give different plaintext blocks the chance to be the “last block” that the
    padding oracle looks at.


    +   The attack seems superficially like brute force, but it is not: The attack
    makes 256 queries per byte of plaintext, so it costs about $256\ell$ queries for
    a plaintext of $\ell$ bytes. Brute-forcing the entire plaintext would cost $256^\ell$
    since that’s how many $\ell$-byte plaintexts there are. So the attack is exponentially
    better than brute force. The lesson is: brute-forcing small pieces at a time is
    much better then brute-forcing the entire thing.'
