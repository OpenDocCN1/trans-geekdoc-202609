- pgno: 11
  md: '# # Review of Concepts & Notation


    The material in this section is meant as a review. Despite that, **many students
    report that they find this review useful** for the rest of the book.


    # ## 0.1 Logs & Exponents


    You probably learned (and then forgot) these identities in middle school or high
    school:


    ```

    (x^a)(x^b) = x^{a+b}

    (x^a)^b = x^{ab}

    log_x(ab) = log_x a + log_x b

    a log_x b = log_x (b^a)

    ```


    Well, it’s time to get reacquainted with them again. In particular, **never ever**
    write \((x^a)(x^b) = x^{ab}\). If you write this, your cryptography instructor
    will realize that life is too short, immediately resign from teaching, and join
    a traveling circus. But not before changing your grade in the course to a zero.


    # ## 0.2 Modular Arithmetic


    We write the set of integers as:


    ```

    \mathbb{Z} \stackrel{\text{def}}{=} \{..., -2, -1, 0, 1, 2, ...\},

    ```


    and the set of natural numbers (nonnegative integers) as:


    ```

    \mathbb{N} \stackrel{\text{def}}{=} \{0, 1, 2, ...\}.

    ```


    Note that 0 is considered a natural number.


    **Definition 0.1** _For_ \(x, n \in \mathbb{Z}\)_, we say that n **divides** x
    (or x **is a multiple of** n), and write_ \(n \mid x\)_, if there exists an integer
    k such that x = kn._


    Remember that the definitions apply to both positive and negative numbers (and
    to zero). We generally only care about this definition in the case where n is
    positive, but it is common to consider both positive and negative values of x.


    **Example** 7 divides 84 because we can write \(84 = 12 \cdot 7\).

    7 divides 0 because we can write \(0 = 0 \cdot 7\).

    7 divides \(-77\) because we can write \(-77 = (-11) \cdot 7\).

    \(-7\) divides 42 because we can write \(42 = (-6) \cdot (-7)\).

    1 divides every integer (so does \(-1\)). The only integer that 0 divides is itself.'
