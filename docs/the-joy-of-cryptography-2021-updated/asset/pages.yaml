    \ proves that \\(\\mathcal{L}_{\\text{left}} \\approx \\mathcal{L}_{\\text{right}}\\\
    ).\n\n# 4.4 Birthday Probabilities & Sampling With/out Replacement\n\nIn many\
    \ cryptographic schemes, the users repeatedly choose random strings (e.g., each\
    \ time they encrypt a message), and security breaks down if the same string is\
    \ ever chosen twice. Hence, it is important that the probability of a repeated\
    \ sample is negligible. In this section we compute the probability of such events\
    \ and express our findings in a modular way, as a statement about the indistinguishability\
    \ of two libraries.\n\n# Birthday Probabilities\n\nIf \\(q\\) people are in a\
    \ room, what is the probability that two of them have the same birthday (if we\
    \ assume that each person's birthday is uniformly chosen from among the possible\
    \ days in a year)? This question is known as the **birthday problem**, and it\
    \ is famous because the answer is highly unintuitive to most people.\\(^9\\)\n\
    \nLet's make the question more general. Imagine taking \\(q\\) independent, uniform\
    \ samples from a set of \\(N\\) items. What is the probability that the same value\
    \ gets chosen more than once? In other words, what is the probability that the\
    \ following program outputs 1?\n\n```\nB(q, N)\nfor i := 1 to q:\n    s_i <- {1,\
    \ ..., N}\n    for j := 1 to i - 1:\n        if s_i = s_j then return 1\nreturn\
    \ 0\n```\n\nLet's give a name to this probability:\n\nBirthdayProb(q, N) \\stackrel{\\\
    text{def}}{=} \\Pr[\\mathcal{B}(q, N) \\text{ outputs } 1].\n\nIt is possible\
    \ to write an exact formula for this probability:\n\nLemma 4.9 BirthdayProb(q,\
    \ N) = 1 - \\prod_{i=1}^{q-1} \\left( 1 - \\frac{i}{N} \\right).\n\n\\(^9\\)It\
    \ is sometimes called the \"birthday paradox,\" even though it is not really a\
    \ paradox. The actual birthday paradox is that the \"birthday paradox\" is not\
    \ a paradox."
