    \ shares correspond to the highlighted points in the mod-11 picture above.\n\n\
    | user (i) | f(i) | share (i, f(i) % 11) |\n|---|---|---|\n| 1 | f(1) = 12 | (1,\
    \ 1) |\n| 2 | f(2) = 19 | (2, 8) |\n| 3 | f(3) = 28 | (3, 6) |\n| 4 | f(4) = 39\
