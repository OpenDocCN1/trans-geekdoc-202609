    you have a subroutine computing $\phi(N)$ given $N$, then you can compute $d$
    exactly how it is computed in the key generation algorithm.

    +   - if there is an efficient algorithm for (3), then we can use it as a subroutine
    to construct an efficient algorithm for (4).

    +   - if there is an efficient algorithm for (4), then we can use it as a subroutine
    to construct an efficient algorithm for (1).


    Below we focus on the final two implications.


    # Using square roots of unity to factor N


    Problem (4) of Theorem 13.12 concerns a new concept known as square roots of unity:


    Definition 13.13 (Sqrt of unity) $x$ is a **square root of unity modulo** $N$
    if $x^2 \equiv_N 1$. If $x \not\equiv_N 1$ and $x \not\equiv_N -1$, then we say
    that $x$ is a **non-trivial** square root of unity.


    Since $(\pm 1)^2 = 1$ over the integers, it is also true that $(\pm 1)^2 \equiv_N
    1$. In other words, $\pm 1$ are always square roots of unity modulo $N$, for any
    $N$. But some values of $N$ have even more square roots of unity. If $N$ is the
    product of distinct odd primes, then $N$ has 4 square roots of unity: two trivial
    and two non-trivial ones (and you are asked to prove this fact in an exercise).


    Claim 13.14 Suppose there is an efficient algorithm for computing nontrivial square
    roots of unity modulo $N$. Then there is an efficient algorithm for factoring
    $N$. (This is the $(4) \implies (1)$ step in Theorem 13.12.)


    Proof The reduction is rather simple. Suppose NTSRU is an algorithm that on input
    $N$ returns a non-trivial square root of unity modulo $N$. Then we can factor
    $N$ with the following algorithm:


    ```

    FACTOR(N):

    x := NTSRU(N)

    return gcd(N, x + 1) and gcd(N, x - 1)

    ```'
