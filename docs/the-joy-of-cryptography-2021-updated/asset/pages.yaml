  md: '# Asymptotic Bounds on the Birthday Probability


    It will be helpful to have an *asymptotic* formula for how BirthdayProb(q, N)
    grows as a function of q and N. We are most interested in the case where q is
    relatively small compared to N (e.g., when q is a polynomial function of λ but
    N is exponential).


    **Lemma 4.10** (Birthday Bound) If \( q \le \sqrt{2N} \), then


    \( 0.632 \frac{q(q-1)}{2N} \le \text{BirthdayProb}(q, N) \le \frac{q(q-1)}{2N}
    \).


    Since the upper and lower bounds differ by only a constant factor, it makes sense
    to write \(\text{BirthdayProb}(q, N) = \Theta(q^2/N)\).


    # Proof


    We split the proof into two parts.


    +   ▶ To prove the upper bound, we use the fact that when x and y are positive,


    \( (1-x)(1-y) = 1 - (x+y) + xy \ge 1 - (x+y) \).


    More generally, when all terms \(x_i\) are positive, \(\prod_i(1-x_i) \ge 1 -
    \sum_i x_i\). Hence, \( 1 - \prod_i(1-x_i) \le 1 - (1 - \sum_i x_i) = \sum_i x_i
    \).


    Applying that fact,


    \(\text{BirthdayProb}(q, N) \stackrel{\text{def}}{=} 1 - \prod_{i=1}^{q-1} \left(1
    - \frac{i}{N}\right) \le \sum_{i=1}^{q-1} \frac{i}{N} = \frac{\sum_{i=1}^{q-1}
    i}{N} = \frac{q(q-1)}{2N}.\)


    +   ▶ To prove the lower bound, we use the fact that when \( 0 \le x \le 1 \),


    \( 1 - x \le e^{-x} \le 1 - 0.632x \).


    This fact is illustrated below. The significance of 0.632 is that \( 1 - \frac{1}{e}
    = 0.63212 \dots \).


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_88_0.png)


    We can use both of these upper and lower bounds on \( e^{-x} \) to show the following:


    \( \prod_{i=1}^{q-1} \left(1 - \frac{i}{N}\right) \le \prod_{i=1}^{q-1} e^{-\frac{i}{N}}
    = e^{-\sum_{i=1}^{q-1} \frac{i}{N}} = e^{-\frac{q(q-1)}{2N}} \le 1 - 0.632 \frac{q(q-1)}{2N}
    \).'
