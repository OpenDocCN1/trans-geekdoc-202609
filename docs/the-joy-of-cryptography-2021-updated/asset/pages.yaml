  md: 'Proof Let us instead compute the probability that \(\mathcal{B}\) outputs 0,
    which will allow us to then solve for the probability that it outputs 1. In order
    for \(\mathcal{B}\) to output 0, it must avoid the early termination conditions
    in each iteration of the main loop. Therefore:


    ```

    \(\text{Pr}[\mathcal{B}(q, N) \text{ outputs } 0] = \text{Pr}[\mathcal{B}(q, N)
    \text{ doesn''t terminate early in iteration } i = 1]\)

    \(\cdot \text{Pr}[\mathcal{B}(q, N) \text{ doesn''t terminate early in iteration
    } i = 2]\)

    \(\vdots\)

    \(\cdot \text{Pr}[\mathcal{B}(q, N) \text{ doesn''t terminate early in iteration
    } i = q]\)

    ```


    In iteration \(i\) of the main loop, there are \(i - 1\) previously chosen values
    \(s_1, ..., s_{i-1}\). The program terminates early if any of these are chosen
    again as \(s_i\), otherwise it continues to the next iteration. Put differently,
    there are \(i - 1\) (out of \(N\)) ways to choose \(s_i\) that lead to early termination
    — all other choices of \(s_i\) avoid early termination. Since the \(N\) possibilities
    for \(s_i\) happen with equal probability:


    ```

    \(\text{Pr}[\mathcal{B}(q, N) \text{ doesn''t terminate early in iteration } i]
    = 1 - \frac{i - 1}{N}.\)

    ```


    Putting everything together:


    ```

    \(\text{BirthdayProb}(q, N) = \text{Pr}[\mathcal{B}(q, N) \text{ outputs } 1]\)

    \(= 1 - \text{Pr}[\mathcal{B}(q, N) \text{ outputs } 0]\)

    \(= 1 - \left(1 - \frac{1}{N}\right) \left(1 - \frac{2}{N}\right) \cdots \left(1
    - \frac{q - 1}{N}\right)\)

    \(= 1 - \prod_{i=1}^{q-1} \left(1 - \frac{i}{N}\right)\)

    ```


    This completes the proof.


    # Example


    This formula for \(\text{BirthdayProb}(q, N)\) is not easy to understand at a
    glance. We can get a better sense of its behavior as a function of \(q\) by plotting
    it. Below is a plot with \(N = 365\), corresponding to the classic birthday problem:


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_87_0.png)


    With only \(q = 23\) people the probability of a shared birthday already exceeds
    50%. The graph could be extended to the right (all the way to \(q = 365\)), but
    even at \(q = 70\) the probability exceeds 99.9%.'
