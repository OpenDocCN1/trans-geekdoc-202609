    \ of Mod(3, 15) does not exist\n```\n\nSage supports huge integers, with no problem:\n\
    \n```\nsage: n = 3141592653589793238462643383279502884197169399375105820974944\n\
    sage: x = 1234567890123456789012345678901234567890123456789012345678901\nsage:\
    \ 1/Mod(x,n)\n2234412539909122491686747985730075304931040310346724620855837\n\
    ```\n\nThe relationship between multiplicative inverses and GCD goes even farther\
    \ than Theorem 13.3. Recall that we can compute gcd(x, n) efficiently using Euclid’s\
    \ algorithm. There is a relatively simple modification to Euclid’s algorithm that\
    \ also computes the corresponding Bezout coefficients with little extra work.\
    \ In other words, given x and n, it is possible to efficiently compute integers\
    \ a, b, and d such that\n\nax + bn = d = gcd(x, n)\n\nIn the case where gcd(x,\
    \ n) = d = 1, the integer a is a multiplicative inverse of x mod n. The “extended\
    \ Euclidean algorithm” for GCD is given below:\n\n```\nEXTGCD(x, y):\n// returns\
    \ (d, a, b) such that gcd(x, y) = d = ax + by\nif y = 0:\n    return (x, 1, 0)\n\
    else:\n    (d, a, b) := EXTGCD(y, x % y)\n    return (d, b, a - b|x/y|)\n```"
