  md: 'In secret-sharing, we number the users as {1, ..., n}, with user i receiving
    share si. Let U ⊆ {1, ..., n} be a subset of users. Then {si | i ∈ U} refers to
    the set of shares belonging to users U. If |U| ≥ t, we say that U is authorized;
    otherwise it is unauthorized. The goal of secret sharing is for all authorized
    sets of users/shares to be able to reconstruct the secret, while all unauthorized
    sets learn nothing.


    **Definition 3.2** (TSSS correctness) A t-out-of-n TSSS satisfies **correctness**
    if, for all authorized sets U ⊆ {1, ..., n} (i.e., |U| ≥ t) and for all s ← Share(m),
    we have Reconstruct({si | i ∈ U}) = m.


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_58_0.png)


    # Security Definition


    We''d like a security guarantee that says something like:


    > if you know only an unauthorized set of shares, then you learn no information
    about the choice of secret message.


    To translate this informal statement into a formal security definition, we define
    two libraries that allow the calling program to learn a set of shares (for an
    unauthorized set), and that differ only in which secret is shared. If the two
    libraries are interchangeable, then we conclude that seeing an unauthorized set
    of shares leaks no information about the choice of secret message. The definition
    looks like this:


    **Definition 3.3** (TSSS security) Let $\Sigma$ be a threshold secret-sharing
    scheme. We say that $\Sigma$ is **secure** if $\mathcal{L}_{\text{tsss-L}}^\Sigma
    \equiv \mathcal{L}_{\text{tsss-R}}^\Sigma$, where:


    | $\mathcal{L}_{\text{tsss-L}}^\Sigma$ | $\mathcal{L}_{\text{tsss-R}}^\Sigma$
    |

    |---|---|

    | SHARE($m_L, m_R \in \Sigma.\mathcal{M}, U$): | SHARE($m_L, m_R \in \Sigma.\mathcal{M},
    U$): |

    | if $|U| \ge \Sigma.t$: return err | if $|U| \ge \Sigma.t$: return err |

    | $\boldsymbol{s} \leftarrow \Sigma.\text{Share}(m_L)$ | $\boldsymbol{s} \leftarrow
    \Sigma.\text{Share}(m_R)$ |

    | return $\{s_i \mid i \in U\}$ | return $\{s_i \mid i \in U\}$ |


    In an attempt to keep the notation uncluttered, we have not written the type of
    the argument U, which is U ⊆ {1, ..., $\Sigma.n$}.'
