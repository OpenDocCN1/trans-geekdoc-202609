- pgno: 84
  md: '# Other Properties


    Lemma 4.6 (\approx facts) If \(\mathcal{L}_1 \equiv \mathcal{L}_2\) then \(\mathcal{L}_1
    \approx \mathcal{L}_2\). Also, if \(\mathcal{L}_1 \approx \mathcal{L}_2 \approx
    \mathcal{L}_3\) then \(\mathcal{L}_1 \approx \mathcal{L}_3\).


    Analogous to Lemma 2.11, we also have the following library chaining lemma, which
    you are asked to prove as an exercise:


    Lemma 4.7 (Chaining) If \(\mathcal{L}_{left} \approx \mathcal{L}_{right}\) then
    \(\mathcal{L}^* \diamond \mathcal{L}_{left} \approx \mathcal{L}^* \diamond \mathcal{L}_{right}\)
    for any polynomial-time library \(\mathcal{L}^*\).


    # Bad-Event Lemma


    A common situation is when two libraries are expected to execute exactly the same
    statements, until some rare & exceptional condition happens. In that case, we
    can bound an attacker’s distinguishing advantage by the probability of the exceptional
    condition. More formally,


    Lemma 4.8 (Bad events) Let \(\mathcal{L}_{left}\) and \(\mathcal{L}_{right}\)
    be libraries that each define a variable named ‘bad’ that is initialized to 0.
    If \(\mathcal{L}_{left}\) and \(\mathcal{L}_{right}\) have identical code, except
    for code blocks reachable only when bad = 1 (e.g., guarded by an “if bad = 1”
    statement), then

    \(\left| \Pr[\mathcal{A} \diamond \mathcal{L}_{left} \Rightarrow 1] - \Pr[\mathcal{A}
    \diamond \mathcal{L}_{right} \Rightarrow 1] \right| \leqslant \Pr[\mathcal{A}
    \diamond \mathcal{L}_{left} \text{ sets } bad = 1].\)


    ★ Proof Fix an arbitrary calling program \(\mathcal{A}\). In this proof, we use
    conditional probabilites\(^8\) to isolate the cases where bad is changed to 1.
    We define the following events:


    +   - ▶ \(\mathcal{B}_{left}\): the event that \(\mathcal{A} \diamond \mathcal{L}_{left}\)
    sets bad to 1 at some point.

    +   - ▶ \(\mathcal{B}_{right}\): the event that \(\mathcal{A} \diamond \mathcal{L}_{right}\)
    sets bad to 1 at some point.


    We also write \(\overline{\mathcal{B}_{left}}\) and \(\overline{\mathcal{B}_{right}}\)
    to denote the corresponding complement events. From conditional probability, we
    can write:


    \(\Pr[\mathcal{A} \diamond \mathcal{L}_{left} \Rightarrow 1] = \Pr[\mathcal{A}
    \diamond \mathcal{L}_{left} \Rightarrow 1 \mid \mathcal{B}_{left}] \Pr[\mathcal{B}_{left}]

    + \Pr[\mathcal{A} \diamond \mathcal{L}_{left} \Rightarrow 1 \mid \overline{\mathcal{B}_{left}}]
    \Pr[\overline{\mathcal{B}_{left}}]\)

    \(\Pr[\mathcal{A} \diamond \mathcal{L}_{right} \Rightarrow 1] = \Pr[\mathcal{A}
    \diamond \mathcal{L}_{right} \Rightarrow 1 \mid \mathcal{B}_{right}] \Pr[\mathcal{B}_{right}]

    + \Pr[\mathcal{A} \diamond \mathcal{L}_{right} \Rightarrow 1 \mid \overline{\mathcal{B}_{right}}]
    \Pr[\overline{\mathcal{B}_{right}}]\)


    Our first observation is that \(\Pr[\mathcal{B}_{left}] = \Pr[\mathcal{B}_{right}]\).
    This is because at the time bad is changed to 1 for the first time, the library
    has only been executing instructions that are the same in \(\mathcal{L}_{left}\)
    and \(\mathcal{L}_{right}\). In other words, the choice to set bad to 1 is determined
    by the same sequence of instructions in both libraries, so it occurs with the
    same probability in both libraries.


    As a shorthand notation, we define \(p \stackrel{\text{def}}{=} \Pr[\mathcal{B}_{left}]
    = \Pr[\mathcal{B}_{right}]\). Then we can write the advantage of \(\mathcal{A}\)
    as:

    \(\text{advantage}_\mathcal{A} = \left| \Pr[\mathcal{A} \diamond \mathcal{L}_{left}
    \Rightarrow 1] - \Pr[\mathcal{A} \diamond \mathcal{L}_{right} \Rightarrow 1] \right|\)


    \(^8\)The use of conditional probabilites here is delicate and prone to subtle
    mistakes. For a discussion of the pitfalls, consult the paper where this lemma
    first appeared: Mihir Bellare & Phillip Rogaway: “Code-Based Game-Playing Proofs
    and the Security of Triple Encryption,” in Eurocrypt 2006. ia.cr/2004/331'
