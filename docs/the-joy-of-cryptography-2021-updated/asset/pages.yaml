  md: 'In this definition, the set S keeps track of the ciphertexts that have been
    generated by the EAVESDROP subroutine. The DECRYPT subroutine refuses to decrypt
    these ciphertexts, but will gladly decrypt any other ciphertext of the adversary’s
    choice.


    # An Example


    The padding oracle attack already demonstrates that CBC mode does not provide
    security in the presence of chosen ciphertext attacks. But that attack was quite
    complicated since the adversary was restricted to learn just 1 bit of information
    at a time about a decrypted ciphertext. An attack against full CCA security can
    be much more direct, since the adversary has full access to decrypted ciphertexts.


    Example Consider the adversary below attacking the CCA security of CBC mode (with
    block length blen)


    ```

    ```

    A

    c = c0||c1||c2 := EAVESDROP(0^{2blen}, 1^{blen})

    m := DECRYPT(c0||c1)

    return m ?= 0^{blen}

    ```

    ```


    It can easily be verified that this adversary achieves advantage 1 distinguishing
    L_{cca-l} from L_{cca-r}. The attack uses the fact (also used in the padding oracle
    attack) that if c0||c1||c2 encrypts m1||m2, then c0||c1 encrypts m1. To us, it
    is obvious that ciphertext c0||c1 is related to c0||c1||c2. Unfortunately for
    CBC mode, the security definition is not very clever — since c0||c1 is simply
    different than c0||c1||c2, the DECRYPT subroutine happily decrypts it.


    Example Perhaps unsurprisingly, there are many very simple ways to catastrophically
    attack the CCA security of CBC-mode encryption. Here are some more (where x̄ denotes
    the result of flipping every bit in x):


    ```

    ```

    A''

    c0||c1||c2 := EAVESDROP(0^{2blen}, 1^{blen})

    m := DECRYPT(c0||c1||c̄2)

    if m begins with 0^{blen} return 1 else return 0

    ```

    ```


    ```

    ```

    A''''

    c0||c1||c2 := EAVESDROP(0^{2blen}, 1^{blen})

    m := DECRYPT(c̄0||c1||c2)

    return m ?= 1^{blen}||0^{blen}

    ```

    ```


    The first attack uses the fact that modifying c2 has no effect on the first plaintext
    block. The second attack uses the fact that flipping every bit in the IV flips
    every bit in m1. Again, in all of these cases, the DECRYPT subroutine is being
    called on a different (but related) ciphertext than the one returned by EAVESDROP.'
