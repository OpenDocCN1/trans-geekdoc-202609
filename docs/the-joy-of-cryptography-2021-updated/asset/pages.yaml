    \ adversary sees just one ciphertext, then it is also secure for many ciphertexts!\
    \ In short, there is no public-key one-time pad that is weaker than full-fledged\
    \ public-key encryption — there is public-key encryption or nothing.\n\nTo show\
    \ this property formally, we first adapt the definition of one-time secrecy (Definition\
    \ 2.6) to the public-key setting. There is one small but important technical subtlety:\
    \ in Definition 2.6 the encryption key is chosen at the last possible moment in\
    \ the body of CHALLENGE. This ensures that the key is local to this scope, and\
    \ therefore each value of the key is only used to encrypt one plaintext.\n\nIn\
    \ the public-key setting, however, it turns out to be important to allow the adversary\
    \ to see the public key before deciding which plaintexts to encrypt. (This concern\
    \ is not present in the symmetric-key setting precisely because there is nothing\
    \ public upon which the adversary’s choice of plaintexts can depend.) For that\
    \ reason, in the public-key setting we must sample the keys at initialization\
    \ time so that the adversary can obtain the public key via GETPK. To ensure that\
