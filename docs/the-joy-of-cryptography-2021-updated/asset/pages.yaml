- pgno: 14
  md: '**Example** I can compute $7^{500} \% 8$ in my head, by noticing that $7 \equiv_8
    -1$ and simplifying thusly:


    $7^{500} \equiv_8 (-1)^{500} = 1$.


    Similarly, I can compute $89^2 \% 99$ in my head, although I have not memorized
    the integer $89^2$. All I need to do is notice that $89 \equiv_{99} -10$ and compute
    this way:


    $89^2 \equiv_{99} (-10)^2 = 100 \equiv_{99} 1$


    You can compute either of these examples the “hard way” to verify that these shortcuts
    lead to the correct answer.


    Since addition, subtraction, and multiplication are defined over the integers
    (i.e., adding/subtracting/multiplying integers always results in an integer),
    these kinds of tricks can be helpful.


    On the other hand, dividing integers doesn’t always result in an integer. Does
    it make sense to use division when working mod $n$, where the result always has
    to lie in $\mathbb{Z}_n$? We will answer this question later in the book.


    # 0.3 Strings


    We write $\{0, 1\}^n$ to denote the set of $n$-bit binary strings, and $\{0, 1\}^*$
    to denote the set of all (finite-length) binary strings. When $x$ is a string
    of bits, we write $|x|$ to denote the length (in bits) of that string, and we
    write $\overline{x}$ to denote the result of flipping every bit in $x$. When it’s
    clear from context that we’re talking about strings instead of numbers, we write
    $0^n$ and $1^n$ to denote strings of $n$ zeroes and $n$ ones, respectively (rather
    than the result of raising the integers $0$ or $1$ to the $n$ power). As you might
    have noticed, I also try to use a different font and color for characters (including
    bits, anything that could be used to build a string through concatenation) vs.
    integers.


    **Definition 0.5** (+, XOR) When $x$ and $y$ are strings of the same length, we
    write $x \oplus y$ to denote the bitwise exclusive-or (xor) of the two strings.
    The expression $x \oplus y$ is generally not defined when the strings are different
    lengths, but in rare occasions it is useful to consider the shorter string being
    padded with $0$s. When that’s the case, we must have an explicit convention about
    whether the shorter string is padded with leading $0$s or trailing $0$s.


    For example, $0011 \oplus 0101 = 0110$. The following facts about the xor operation
    are frequently useful:


    +   - $x \oplus x = 000\cdots$ xor''ing a string with itself results in zeroes.

    +   - $x \oplus 000\cdots = x$ xor''ing with zeroes has no effect.

    +   - $x \oplus 111\cdots = \overline{x}$ xor''ing with ones flips every bit.

    +   - $x \oplus y = y \oplus x$ xor is symmetric.

    +   - $(x \oplus y) \oplus z = x \oplus (y \oplus z)$ xor is associative.


    See if you can use these properties to derive the very useful fact below:


    $a = b \oplus c \iff b = a \oplus c \iff c = a \oplus b.$


    There are a few ways to think about xor that may help you in this class:'
