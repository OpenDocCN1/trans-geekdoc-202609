- pgno: 232
  md: 'To understand the security of Carter-Wegman, we work backwards. The output
    \( F(k, H(s, x)) \) comes directly from a PRF. These outputs will look random
    as long as the inputs to the PRF are \( distinct \). In this construction, the
    only way for PRF inputs to repeat is for there to be a collision in the UHF \(
    H \). However, we have to be careful. We can only reason about the collision-resistance
    of \( H \) when its salt is secret and its outputs are hidden from the attacker.
    The salt is indeed hidden in this case (kept as part of the Carter-Wegman key),
    but its outputs are being used as PRF inputs. Fortunately, the guarantee of a
    PRF is that its outputs appear \( unrelated \) to its inputs. In other words,
    the PRF outputs leak no information about the PRF inputs (\( H \)-outputs). Indeed,
    this appears to be a situation where the UHF outputs are hidden from the attacker,
    so we can argue that collisions in \( H \) are negligibly likely.


    # Claim 12.12

    If \( H \) is a secure UHF and \( F \) is a secure PRF, then the Carter-Wegman
    construction (*Construction 12.11*) is a secure PRF, and hence a secure MAC as
    well.


    **Proof** We will show that \( \mathcal{L}_{\text{prf-real}}^{\text{CW}} \approx
    \mathcal{L}_{\text{prf-rand}}^{\text{CW}} \) using a standard hybrid technique.


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_232_0.png)


    The starting point is \( \mathcal{L}_{\text{prf-real}}^{\text{CW}} \).


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_232_1.png)


    We have applied the security of \( F \), by factoring out in terms of \( \mathcal{L}_{\text{prf-real}}^F
    \), replacing it with \( \mathcal{L}_{\text{prf-rand}}^F \), and inlining the
    result.'
