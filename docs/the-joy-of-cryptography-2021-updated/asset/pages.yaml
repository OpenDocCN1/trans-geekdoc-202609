    **Definition 14.5 (DDH)** The **decisional Diffie-Hellman (DDH) assumption** in
    a cyclic group $\mathbb{G}$ is that $\mathcal{L}_{\text{dh-real}}^{\mathbb{G}}
    \approx \mathcal{L}_{\text{dh-rand}}^{\mathbb{G}}$ (libraries defined above).


    Since we have defined the DDH assumption by simply renaming the security definition
    for DHKA, we immediately have:


    **Claim 14.6** The DHKA protocol is a secure KA protocol **if and only if** the
    DDH assumption is true for the choice of $\mathbb{G}$ used in the protocol.


    # **For Which Groups does the DDH Assumption Hold?**


    So far our only example of a cyclic group is $\mathbb{Z}_p^*$, where $p$ is a
    prime. Although *many* textbooks describe DHKA in terms of this cyclic group,
    it is not a good choice because the DDH assumption is *demonstrably false* in
    $\mathbb{Z}_p^*$. To see why, we introduce a new concept:


    **Claim 14.7 (Euler criterion)** If $p$ is a prime and $X = g^x \in \mathbb{Z}_p^*$,
    then $X^{\frac{p-1}{2}} \equiv_p (-1)^x$.


    Note that $(-1)^x$ is $1$ if $x$ is even and $-1$ if $x$ is odd. So, while in
    general it is hard to determine $x$ given $g^x$, Euler''s criterion says that
    it is possible to determine the *parity* of $x$ (i.e., whether $x$ is even or
    odd) given $g^x$.


    To see how these observations lead to an attack against the Diffie-Hellman protocol,
    consider the following attack:


    ```

    \mathcal{A}:

    (A, B, C) \leftarrow \text{QUERY()}

    ?

    \text{return } 1 \equiv_p C^{\frac{p-1}{2}}

    ```


    Roughly speaking, the adversary returns true whenever $C$ can be written as $g$
    raised to an *even* exponent. When linked to $\mathcal{L}_{\text{dh-real}}$, $C
    = g^{ab}$ where $a$ and $b$ are chosen uniformly. Hence $ab$ will be even with
    probability 3/4. When linked to $\mathcal{L}_{\text{dh-rand}}$, $C = g^c$ for
    an independent random $c$. So $c$ is even only with probability 1/2. Hence the
    adversary distinguishes the libraries with advantage 1/4.


    Concretely, with this choice of group, the key $g^{ab}$ will never be uniformly
    distributed. See the exercises for a slightly better attack which correlates the
    key to the transcript.


    **Quadratic Residues.** Several better choices of cyclic groups have been proposed
    in the literature. Arguably the simplest one is based on the following definition:


    **Definition 14.8** A number $X \in \mathbb{Z}_n^*$ is a *quadratic residue modulo
    n* if there exists some integer $Y$ such that $Y^2 \equiv_n X$. That is, if $X$
    can be obtained by squaring a number mod $n$. Let $\mathbb{QR}_n^* \subseteq \mathbb{Z}_n^*$
    denote the set of quadratic residues mod $n$.


    For our purposes it is enough to know that, when $p$ is prime, $\mathbb{QR}_p^*$
    is a cyclic group with $(p - 1)/2$ elements (see the exercises). When both $p$
    and $(p - 1)/2$ are prime, we call $p$ a **safe prime** (and call $(p - 1)/2$
    a *Sophie Germain prime*). To the best of our knowledge the DDH assumption is
    true in $\mathbb{QR}_p^*$ when $p$ is a safe prime.'
