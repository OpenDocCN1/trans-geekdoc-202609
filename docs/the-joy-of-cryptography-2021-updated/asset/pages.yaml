- pgno: 16
  md: 'We also extend the notation Pr to **events**, which are collections of outcomes.
    If you want to be formal, an event A is any subset of the possible outcomes, and
    its probability is defined to be $\Pr[A] = \sum_{x \in A} \Pr[x]$. We always simplify
    the notation slightly, so instead of writing $\Pr[\{x \mid x \text{ satisfies
    some condition}\}]$, we write $\Pr[\text{condition}]$.


    **Example** A 6-sided die has faces numbered $\{1, 2, \dots, 6\}$. Tossing the
    die (at least for a mathematician) induces a uniform distribution over the choice
    of face. Then $\Pr[\text{3 is rolled}] = 1/6$, and $\Pr[\text{an odd number is
    rolled}] = 1/2$ and $\Pr[\text{a prime is rolled}] = 1/2$.


    # Tips & Tricks


    Knowing one of the probabilities $\Pr[A]$ and $\Pr[\neg A]$ (which is “the probability
    that A doesn’t happen”) tells you exactly what the other probability is, via the
    relationship


    $\Pr[A] = 1 - \Pr[\neg A]$.


    This is one of the most basic facts about probability, but it can be surprisingly
    useful since one of $\Pr[A]$ and $\Pr[\neg A]$ is often much easier to calculate
    than the other. If you get stuck trying to come up with an expression for $\Pr[A]$,
    try working out an expression for $\Pr[\neg A]$ instead.


    **Example** I roll a six-sided die, six times. What is the probability that there
    is some repeated value? Let’s think about all the ways of getting a repeated value.
    Well, two of the rolls could be 1, or three of rolls could be 1, or all of them
    could be 1, two of them could be 1 and the rest could be 2, etc. Oh no, am I double-counting
    repeated 2s and repeated 1s? Uhuh... An easier way to attack the problem is to
    realize that the probability we care about is actually $1 - \Pr[\text{all 6 rolls
    are distinct}]$. This complementary event (all 6 rolls distinct) happens exactly
    when the sequence of dice rolls spell out a permutation of $\{1, \dots, 6\}$.
    There are $6! = 720$ such permutations, out of $6^6 = 46656$ total possible outcomes.
    Hence, the answer to the question is


    $1 - \frac{6!}{6^6} = 1 - \frac{720}{46656} = \frac{45936}{46656} \approx 0.9846$


    Another trick is one I like to call **setting breakpoints** on the universe. Imagine
    stopping the universe at a point where some random choices have happened, and
    others have not yet happened. This is best illustrated by example:


    **Example** A classic question asks: when rolling two 6-sided dice what is the
    probability that the dice match? Here is a standard (and totally correct way)
    to answer the question: When rolling two 6-sided dice, there are $6^2 = 36$ total
    outcomes (a pair of numbers), so each has probability $1/36$ under a uniform distribution.
    There are 6 outcomes that make the dice match: both dice 1, both dice 2, both
    dice 3, and so on. Therefore, the probability of rolling matching dice is $6/36
    = 1/6$. A different way to arrive at the answer goes like this:'
