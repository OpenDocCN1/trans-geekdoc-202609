  md: "# **Definition 6.13** (SPRP security) Let $F : \\{0, 1\\}^\\lambda \times \\\
    {0, 1\\}^{blen} \to \\{0, 1\\}^{blen}$ be a deterministic function. We say that\
    \ $F$ is a **secure strong pseudorandom permutation (SPRP)** if $\\mathcal{L}_{sprp-real}^F\
    \ \\approx \\mathcal{L}_{sprp-rand}^F$\n\n```\n$\\mathcal{L}_{sprp-real}^F$\n\
    $k \\leftarrow \\{0, 1\\}^\\lambda$\n\\underline{\text{LOOKUP}(x \\in \\{0, 1\\\
    }^{blen}):}\nreturn $F(k, x)$\n\\underline{\text{INVLOOKUP}(y \\in \\{0, 1\\}^{blen}):}\n\
    return $F^{-1}(k, y)$\n```\n\n```\n$\\mathcal{L}_{sprp-rand}^F$\n$T, T_{inv} :=\
    \ \text{empty assoc. arrays}$\n\\underline{\text{LOOKUP}(x \\in \\{0, 1\\}^{blen}):}\n\
    if $T[x]$ undefined:\n$y \\leftarrow \\{0, 1\\}^{blen} \\setminus T.values$\n\
    $T[x] := y; T_{inv}[y] := x$\nreturn $T[x]$\n\\underline{\text{INVLOOKUP}(y \\\
    in \\{0, 1\\}^{blen}):}\nif $T_{inv}[y]$ undefined:\n$x \\leftarrow \\{0, 1\\\
    }^{blen} \\setminus T_{inv}.values$\n$T_{inv}[y] := x; T[x] := y$\nreturn $T_{inv}[y]$\n\
    ```\n\nEarlier we showed that using a PRF as the round function in a 3-round Feistel\
    \ cipher results in a secure PRP. However, that PRP is **not** a strong PRP. Even\
