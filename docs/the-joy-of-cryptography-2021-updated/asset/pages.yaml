    # Discussion


    +   ▶ Stating the birthday problem in terms of indistinguishable libraries makes
    it a useful tool in future security proofs. For example, when proving the security
    of a construction we can replace a uniform sampling step with a sampling-without-replacement
    step. This change has only a negligible effect, but now the rest of the proof
    can take advantage of the fact that samples are never repeated.


    Another way to say this is that, when you are thinking about a cryptographic construction,
    it is “safe to assume” that randomly sampled long strings do not repeat, and behave
    accordingly.


    +   ▶ However, if a security proof does use the indistinguishability of the birthday
    libraries, it means that the scheme can likely be broken when a user happens to
    repeat a uniformly sampled value. Since this becomes inevitable as the number
    of samples approaches $\sqrt{2^{\lambda+1}} \sim 2^{\lambda/2}$, it means the
    scheme only offers $\lambda/2$ bits of security. When a scheme has this property,
    we say that it has **birthday bound security**. It is important to understand
    when a scheme has this property, since it informs the size of keys that should
    be chosen in practice.


    # A Generalization


    A calling program can distinguish between the previous libraries if samp ever
    returns the same value twice. In any given call to samp, the variable $\mathcal{R}$
    denotes the set of “problematic” values that cause the libraries to be distinguished.
    At any point, $\mathcal{R}$ has only polynomially many values, so the probability
    of chosing such a problematic one is negligible.


    Suppose we considered a different set of values to be problematic. As long as
    there are only polynomially many problematic values in each call to samp, the
    reasoning behind the proof wouldn’t change much. This idea leads to the following
    generalization, in which the calling program explicitly writes down all of the
    problematic values:


    10The two approaches for sampling from $\{0, 1\}^\lambda \backslash R$ may have
    different running times, but our model considers only the input-output behavior
    of the library.'
