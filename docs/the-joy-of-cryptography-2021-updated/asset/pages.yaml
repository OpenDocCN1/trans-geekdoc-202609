  md: "```\ncache := empty assoc. array\nT := empty assoc. array\ns \\leftarrow \\\
    mathcal{S}\nLOOKUP(x):\nif cache[x] undefined:\n  y := H(s, x)\n  if T[y] undefined:\n\
    \    T[y] \\leftarrow \\{0, 1\\}^{out}\n  cache[x] := T[y]\n  return cache[x]\n\
    ```\n\nThe lookup subroutine has the property that if it is called on the same\
    \ x twice, it will return the same result. It therefore does no harm to cache\
    \ the answer every time. The second time LOOKUP is called on the same value x,\
    \ the previous value is loaded from cache rather than re-computed. This change\
    \ has no effect on the calling program.\n\n```\ncache := empty assoc. array\n\
    H_{inv} := empty assoc. array\nT := empty assoc. array\ns \\leftarrow \\mathcal{S}\n\
    LOOKUP(x):\nif cache[x] undefined:\n  y := H(s, x)\n  if H_{inv}[y] defined:\n\
    \    x' := H_{inv}[y]\n    return cache[x']\n  if T[y] undefined:\n    T[y] \\\
    leftarrow \\{0, 1\\}^{out}\n  H_{inv}[y] := x\n  cache[x] := T[y]\n  return cache[x]\n\
    ```\n\nNote that if lookup is first called on x' and then later on x, where H(s,\
    \ x) = H(s, x'), lookup will return the same result. We therefore modify the library\
    \ to keep track of H-outputs and inputs. Whenever the library computes y = H(s,\
    \ x), it stores H_{inv}[y] = x. However, if H_{inv}[y] already exists, it means\
    \ that this x and x' = H_{inv}[y] are a collision under H. In that case, the library\
    \ directly returns whatever it previously returned on input x'. This change has\
    \ no effect on the calling program."
