  md: '# The Basics of Provable Security


    Edgar Allan Poe was not only an author, but also a cryptography enthusiast. He
    once wrote, in a discussion on the state of the art in cryptography:¹


    > "Human ingenuity cannot concoct a cipher which human ingenuity cannot resolve."


    This was an accurate assessment of the cryptography that existed in 1841. Whenever
    someone would come up with an encryption method, someone else would inevitably
    find a way to break it, and the cat-and-mouse game would repeat again and again.


    Modern 21st-century cryptography, however, is different. This book will introduce
    you to many schemes whose security we can **prove** in a very specific sense.
    The code-makers **can** win against the code-breakers.


    It’s only possible to _prove_ things about security by having _formal definitions_
    of what it means to be “secure.” This chapter is about the fundamental skills
    that revolve around security definitions: how to write them, how to understand
    & interpret them, how to prove security using the _hybrid technique_, and how
    to demonstrate insecurity using attacks against the security definition.


    # 2.1 How to Write a Security Definition


    So far the only form of cryptography we’ve seen is one-time pad, so our discussion
    of security has been rather specific to one-time pad. It would be preferable to
    have a vocabulary to talk about security in a more general sense, so that we can
    ask whether _any_ encryption scheme is secure.


    In this section, we’ll develop two security definitions for encryption.


    # What Doesn’t Go Into a Security Definition


    A security definition should give guarantees about what can happen to a system
    in the presence of an attacker. But not all important properties of a system refer
    to an attacker. For encryption specifically:


    +   - We don’t reference any attacker when we say that the Enc algorithm takes
    two arguments (a key and a plaintext), or that the KeyGen algorithm takes no arguments.
    Specifying the types of inputs/outputs (_i.e._, the “function signature”) of the
    various algorithms is therefore not a statement about security. We call these
    properties the **syntax** of the scheme.


    ¹Edgar Allan Poe, “A Few Words on Secret Writing,” _Graham’s Magazine_, July 1841,
    v19.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Even if there is no attacker, it’s still important that decryption is an inverse
    of encryption. This is not a security property of the encryption scheme. Instead,
    we call it a **correctness** property.


    Below are the generic definitions for syntax and correctness of symmetric-key
    encryption:


    **Definition 2.1 (Encryption syntax)** A **symmetric-key encryption (SKE) scheme**
    consists of the following algorithms:


    +   - KeyGen: a randomized algorithm that outputs a **key** \( k \in \mathcal{K}
    \).

    +   - Enc: a (possibly randomized) algorithm that takes a key \( k \in \mathcal{K}
    \) and **plaintext** \( m \in \mathcal{M} \) as input, and outputs a **ciphertext**
    \( c \in \mathcal{C} \).

    +   - Dec: a deterministic algorithm that takes a key \( k \in \mathcal{K} \)
    and **ciphertext** \( c \in \mathcal{C} \) as input, and outputs a **plaintext**
    \( m \in \mathcal{M} \).


    We call \( \mathcal{K} \) the **key space**, \( \mathcal{M} \) the **message space**,
    and \( \mathcal{C} \) the **ciphertext space** of the scheme. Sometimes we refer
    to the entire scheme (the collection of all three algorithms) by a single variable
    \( \Sigma \). When we do so, we write \( \Sigma.\text{KeyGen} \), \( \Sigma.\text{Enc}
    \), \( \Sigma.\text{Dec} \), \( \Sigma.\mathcal{K} \), \( \Sigma.\mathcal{M} \),
    and \( \Sigma.\mathcal{C} \) to refer to its components.


    **Definition 2.2 (SKE correctness)** An encryption scheme \( \Sigma \) satisfies
    **correctness** if for all \( k \in \Sigma.\mathcal{K} \) and all \( m \in \Sigma.\mathcal{M}
    \),


    ```

    \(\text{Pr}[\Sigma.\text{Dec}(k, \Sigma.\text{Enc}(k, m)) = m] = 1.\)

    ```


    The definition is written in terms of a probability because Enc is allowed to
    be a randomized algorithm. In other words, decrypting a ciphertext with the same
    key that was used for encryption must **always** result in the original plaintext.


    **Example** An encryption scheme can have the appropriate syntax but still have
    degenerate behavior like \(\text{Enc}(k, m) = 0^\lambda\) (i.e., every plaintext
    is “encrypted” to \( 0^\lambda \)). Such a scheme would not satisfy the correctness
    property.


    A different scheme defined by \(\text{Enc}(k, m) = m\) (i.e., the “ciphertext”
    is always equal to the plaintext itself) and \(\text{Dec}(k, c) = c\) does satisfy
    the correctness property, but would not satisfy any reasonable security property.


    # “Real-vs-Random” Style of Security Definition


    Let’s try to make a security definition that formalizes the following intuitive
    idea:


    > “an encryption scheme is a good one if its ciphertexts look like random junk
    to an attacker.”


    Security definitions always consider **the attacker’s view** of the system. What
    is the “interface” that Alice & Bob expose to the attacker by their use of the
    cryptography, and does that particular interface benefit the attacker?


    In this example, we’re considering a scenario where the attacker gets to observe
    ciphertexts. How **exactly** are these ciphertexts generated? What are the inputs
    to Enc (key and plaintext), and how are they chosen?'
