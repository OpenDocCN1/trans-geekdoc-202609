  md: '2019-01-07 Extensive revisions; only the major ones listed here. Lots of homework
    problems added/updated throughout. I tried to revise the entire book in time for
    my Winter 2019 offering, but ran out of time.


    +   Added a changelog!


    +   Chapter 1: Kerckhoffs'' Principle now discussed here (previously only mentioned
    for the first time in Ch 2).


    +   Chapter 2: Now the concepts are introduced in context of specific one-time
    security definition, not in the abstract. More examples of interchangeable libraries.


    +   Chapter 3: Polynomial interpolation now shown explicitly with LaGrange polynomials
    (rather than Vandermonde matrices). Full interpolation example worked out.


    +   Chapter 4: Better organization. Real-world contextual examples of extreme
    (large & small) 2^n values. Full proof of bad-event lemma. Generalized avoidance-sampling
    libraries.


    +   Chapter 5: Motivate PRGs via pseudo-OTP idea. Better illustration of PRG function,
    and conceptual pitfalls. How NOT to build a PRG. New section on stream cipher
    & symmetric ratchet.


    +   Chapter 6: Combined PRF & PRP chapters. Motivate PRFs via m ↦ (r, F(k,r) ⊕
    m) construction. Better discussion of eager vs. lazy sampling of exponentially
    large table. How NOT to build a PRF. New section on constructing PRG from PRF,
    and more clarity on security proofs with variable number of hybrids. Better illustrations
    & formal pseudocode for Feistel constructions.


    +   Chapter 7: Other ways to avoid insecurity of deterministic encryption (stateful
    & nonce-based). Ridiculous Socratic dialog on the security of the PRF-based encryption
    scheme.


    +   Chapter 8: Compare & contrast CTR & CBC modes.


    # Road Map


    The following topics are shamefully missing from the book, but are planned or
    being considered:


    +   1. authenticated key agreement, secure messaging / ratcheting (high priority)


    +   2. random oracle & ideal cipher models (medium priority)


    +   3. elliptic curves, post-quantum crypto (but I would need to learn them first)


    +   4. DH-based socialist millionaires, PSI, PAKE, simple PIR, basic MPC concepts
    (low priority)'
