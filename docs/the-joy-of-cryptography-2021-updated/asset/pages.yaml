  md: "![](img/da79fa21b263fe549aecaabd2a0a41c8_133_0.png)\n\nNote how both the forward\
    \ and inverse Feistel rounds use F in the forward direction!\n\n**Example** Let’s\
    \ see what happens in the Feistel construction with a trivial round function.\
    \ Consider the constant function F(y) = 0ⁿ, which is the “least invertible” function\
    \ imaginable. The Feistel construction gives:\n\n```\nF*(x||y) = y||(F(y) ⊕ x)\n\
    \           = y||(0ⁿ ⊕ x)\n           = y||x\n```\n\nThe result is a function\
    \ that simply switches the order of its halves – clearly invertible.\n\n**Example**\
    \ Let’s try another simple round function, this time the identity function F(y)\
    \ = y. The Feistel construction gives:\n\n```\nF*(x||y) = y||(F(y) ⊕ x)\n    \
    \       = y||(y ⊕ x)\n```\n\nThis function is invertible because given y and y\
    \ ⊕ x we can solve for x as y ⊕ (y ⊕ x). You can verify that this is what happens\
    \ when you plug F into the inverse Feistel construction.\n\nWe can also consider\
    \ using a round function F that has a key/seed. The result will be an F* that\
    \ also takes a seed. For every seed k, F*(k, ·) will have an inverse (which looks\
    \ like its mirror image).\n\n```\nConstruction 6.10\n(Keyed Feistel)\nF*(k, x||y):\n\
    return y||(F(k, y) ⊕ x)\n```\n\nNow suppose F is a secure PRF and we use it as\
    \ a Feistel round function, to obtain a keyed function F*. Since F*(k, ·) is invertible\
    \ for every k, and since F* uses a secure PRF in some way, you might be tempted\
    \ to claim that F* is a secure PRP. Unfortunately, it is not! The output of F*\
    \ contains half of its input, making it quite trivial to break the PRP-security\
    \ of F*.\n\nWe can avoid this trivial attack by performing several Feistel rounds\
    \ in succession, resulting in a construction called a Feistel cipher. At each\
    \ round, we can even use a different key to the round function. If we use k1 in\
    \ the first round, k2 in the second round, and so on, then k1, k2, ... is called\
    \ the key schedule of the Feistel cipher. The formal definition of an r-round\
    \ Feistel cipher is given below:"
