- pgno: 99
  md: 'Of course, this is exactly what is wrong with this simplistic PRG G defined
    above. Every output of G has equal first/second halves. But it is rare for uniformly
    sampled strings to have this property. We can formalize this observation as an
    attack against the PRG-security of G:


    ```

    x||y := QUERY()

    return x ?= y

    ```


    The first line means to obtain the result of QUERY and set its first half to be
    the string x and its second half to be y. This calling program simply checks whether
    the output of QUERY has equal halves.


    To complete the attack, we must show that this calling program has non-negligible
    bias distinguishing the L<sub>prg-⋆</sub> libraries.


    +   - When linked to L<sub>prg-real</sub>, the calling program receives outputs
    of G, which always have matching first/second halves. So Pr[A ⋄ L<sup>G</sup><sub>prg-real</sub>
    ⇒ 1] = 1. Below we have filled in L<sub>prg-real</sub> with the details of our
    G algorithm:


    | A | L<sup>G</sup><sub>prg-real</sub> |

    |---|---|

    | x||y := QUERY() | QUERY(): |

    | return x ?= y | s ← {0, 1}<sup>λ</sup> |

    | | return s||s |


    +   - When linked to L<sub>prg-rand</sub>, the calling program receives uniform
    samples from {0, 1}<sup>2λ</sup>.


    | A | L<sup>G</sup><sub>prg-rand</sub> |

    |---|---|

    | x||y := QUERY() | QUERY(): |

    | return x ?= y | r ← {0, 1}<sup>2λ</sup> |

    | | return r |


    A outputs 1 whenever we sample a string from {0, 1}<sup>2λ</sup> with equal first/second
    halves. What exactly is the probability of this happening? There are several ways
    to see that the probability is 1/2<sup>λ</sup> (this is like asking the probability
    of rolling doubles with two dice, but each die has 2<sup>λ</sup> sides instead
    of 6). Therefore, Pr[A ⋄ L<sup>G</sup><sub>prg-rand</sub> ⇒ 1] = 1/2<sup>λ</sup>.


    The advantage of this adversary is 1 − 1/2<sup>λ</sup> which is certainly non-negligible
    — it does not even approach 0 as λ grows. This shows that G is not a secure PRG.


    This example illustrates how randomness/pseudorandomness is a property of the
    *entire process*, not of individual strings. If you take a string of 1s and concatenate
    it with another string of 1s, you get a long string of 1s. “Containing only 1s”
    is a property of individual strings. If you take a “random string” and concatenate
    it with another “random string,” you might not get a “random long string.” Being
    random is not a property of an individual string, but of the entire process that
    generates it.


    Outputs from this G have equal first/second halves, which is an obvious pattern.
    The challenge of desiging a secure PRG is that its outputs must have *no discernible
    pattern*! Any pattern will lead to an attack similar to the one shown above.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# # Related Concept: Random Number Generation


    The security of a PRG requires the seed to be chosen uniformly. In practice, the
    seed has to come from somewhere. Generally a source of “randomness” is provided
    by the hardware or operating system, and the process that generates these random
    bits is (confusingly) called a random number generator (RNG).


    In this course we won’t cover low-level random number generation, but merely point
    out what makes it different than the PRGs that we study:


    +   - The job of a PRG is to take a small amount of “ideal” (in other words, uniform)
    randomness and extend it.


    +   - By contrast, an RNG usually takes many inputs over time and maintains an
    internal state. These inputs are often from physical/hardware sources. While these
    inputs are “noisy” in some sense, it is hard to imagine that they would be statistically
    uniform. So the job of the RNG is to “refine” (sometimes many) sources of noisy
    data into uniform outputs.


    # # 5.3 Application: Shorter Keys in One-Time-Secret Encryption


    We revisit the motivating example from the beginning of this chapter. Alice &
    Bob share only a \(\lambda\)-bit key but want to encrypt a message of length \(\lambda
    + \ell\). The main idea is to expand the key \(k\) into a longer string using
    a PRG \(G\), and use the result as a one-time pad on the (longer) plaintext. More
    precisely, let \(G : \{0, 1\}^\lambda \rightarrow \{0, 1\}^{\lambda+\ell}\) be
    a PRG, and define the following encryption scheme:


    | | | |

    |---|---|---|

    | \(\mathcal{K} = \{0, 1\}^\lambda\) | KeyGen: \(k \leftarrow \mathcal{K}\) |
    Enc(k, m): return \(G(k) \oplus m\) |

    | \(\mathcal{M} = \{0, 1\}^{\lambda+\ell}\) | return k | Dec(k, c): return \(G(k)
    \oplus c\) |

    | \(\mathcal{C} = \{0, 1\}^{\lambda+\ell}\) | | |


    The resulting scheme will not have (perfect) one-time secrecy. That is, encryptions
    of \(m_L\) and \(m_R\) will not be identically distributed in general. However,
    the distributions will be indistinguishable if \(G\) is a secure PRG. The precise
    flavor of security obtained by this construction is the following.


    # # Definition 5.3


    Let \(\Sigma\) be an encryption scheme, and let \(\mathcal{L}^\Sigma_{\text{ots-L}}\)
    and \(\mathcal{L}^\Sigma_{\text{ots-R}}\) be defined as in Definition 2.6 (and
    repeated below for convenience). Then \(\Sigma\) has **(computational) one-time
    secrecy** if \(\mathcal{L}^\Sigma_{\text{ots-L}} \approx \mathcal{L}^\Sigma_{\text{ots-R}}\).
    That is, if for all polynomial-time distinguishers \(\mathcal{A}\), we have \(\text{Pr}[\mathcal{A}
    \diamond \mathcal{L}^\Sigma_{\text{ots-L}} \Rightarrow 1] \approx \text{Pr}[\mathcal{A}
    \diamond \mathcal{L}^\Sigma_{\text{ots-R}} \Rightarrow 1]\).


    | \(\mathcal{L}^\Sigma_{\text{ots-L}}\) | \(\mathcal{L}^\Sigma_{\text{ots-R}}\)
    |

    |---|---|

    | eavesdrop(\(m_L, m_R \in \Sigma.\mathcal{M}\)): | eavesdrop(\(m_L, m_R \in \Sigma.\mathcal{M}\)):
    |

    | \(k \leftarrow \Sigma.KeyGen\) | \(k \leftarrow \Sigma.KeyGen\) |

    | \(c \leftarrow \Sigma.Enc(k, m_L)\) | \(c \leftarrow \Sigma.Enc(k, m_R)\) |

    | return \(c\) | return \(c\) |'
