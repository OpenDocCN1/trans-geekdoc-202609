- pgno: 13
  md: 'In short, expressions like $a =_n b$ make sense for any $a, b$ (including negative!),
    but expressions like $a = b \% n$ make sense only if $a \in \mathbb{Z}_n$.


    Most other textbooks will use notation “$a \equiv b \pmod n$” instead of “$a =_n
    b$.” I dislike this notation because “(mod n)” is easily mistaken for an operation
    or action that only affects the right-hand side, when in reality it is like an
    adverb that modifies the entire expression $a \equiv b$. Even though $\equiv_n$
    is a bit weird, I think the weirdness is worth it.


    If $d \mid x$ and $d \mid y$, then $d$ is a **common divisor** of $x$ and $y$.
    The largest possible such $d$ is called the **greatest common divisor (GCD)**,
    denoted $\gcd(x, y)$. If $\gcd(x, y) = 1$, then we say that $x$ and $y$ are **relatively
    prime**. The oldest “algorithm” is the recursive process that Euclid described
    for computing GCDs (ca. 300 BCE):


    ```

    gcd(x, y): // Euclid’s algorithm

    if y = 0 then return x

    else return gcd(y, x % y)

    ```


    # Tips & Tricks


    You may often be faced with some complicated expression and asked to find the
    value of that expression mod $n$. This usually means: find the unique value in
    $\mathbb{Z}_n$ that is congruent to the result. The straightforward way to do
    this is to first compute the result *over the integers*, and then reduce the answer
    mod $n$ (i.e., with the % $n$ operator).


    While this approach gives the correct answer (and is a good anchor for your understanding),
    it’s usually advisable to **simplify intermediate values mod $n$**. Doing so will
    result in the same answer, but will usually be easier or faster to compute:


    **Example** We can evaluate the expression $6 \cdot 7 \cdot 8 \cdot 9 \cdot 10
    \% 11$ without ever calculating that product over the integers, by using the following
    reasoning:


    $6 \cdot 7 \cdot 8 \cdot 9 \cdot 10 = (42) \cdot 8 \cdot 9 \cdot 10$

    $\equiv_{11} 9 \cdot 8 \cdot 9 \cdot 10$

    $= (72) \cdot 9 \cdot 10$

    $\equiv_{11} 6 \cdot 9 \cdot 10$

    $= (54) \cdot 10$

    $\equiv_{11} 10 \cdot 10$

    $= 100$

    $\equiv_{11} 1$


    In the steps that only work mod 11, we write “$\equiv_{11}$”. We can write “$=$”
    when the step holds over the integers, although it wouldn’t be wrong to write
    “$\equiv_{11}$” in those cases too. If two expressions represent the same integer,
    then they surely represent values that are congruent mod 11.


    My advice is to simplify intermediate values mod $n$, but “simplify” doesn’t always
    mean “reduce mod $n$ with the % $n$ operation.” Sometimes an expression can by
    “simplified” by substituting a value with something congruent, but *not* in the
    range $\{0, \dots, n - 1\}$:'
