  md: '# 13.3 Digital Signatures


    MACs are a cryptographic primitive that provide authenticity. A valid MAC tag
    on $m$ is “proof” that someone who knows the key has vouched for $m$. MACs are
    a symmetric-key primitive, in the sense that generating a MAC tag and verifying
    a MAC tag both require the same key (in fact, a tag is verified by re-computing
    it).


    **Digital signatures** are similar to MACs, but with separate keys for signing
    and verification. A digital signature scheme consists of the following algorithms:


    +   - **KeyGen**: outputs a **pair** of keys $(sk, vk)$, where $sk$ is the **signing
    key** and $vk$ is the **verification key**.


    +   - **Sign**: takes the signing key $sk$ and a message $m$ as input, and outputs
    a **signature** $\sigma$.


    +   - **Ver**: takes the verification key $vk$, message $m$, and a potential signature
    $\sigma$ as input; outputs a boolean.


    If indeed $\sigma$ is an output of $\text{Sign}(sk, m)$, then $\text{Ver}(vk,
    m, \sigma)$ should output true. Intuitively, it should be hard for an attacker
    to find any other $(m, \sigma)$ pairs that cause $\text{Ver}$ to output true.


    The idea behind digital signatures is to make $vk$ public. In other words, anyone
    (even the attacker) should be able to verify signatures. But only the holder of
    $sk$ (the person who generated $vk$ and $sk$) should be able to generate valid
    signatures. Furthermore, this guarantee should hold even against an attacker who
    sees many examples of valid signatures. The attacker should not be able to generate
    _new_ valid signatures.


    We formalize this security property in a similar way that we formalized the security
    of MACs: “only the secret-key holder can generate valid tags, even after seeing
    chosen examples of valid tags.”


    **Definition 13.6** _Let_ $\Sigma$ _be a signature scheme. We say that_ $\Sigma$
    _is a_ **secure signature** _if_ $\mathcal{L}^{\Sigma}_{\text{sig-real}} \approx
    \mathcal{L}^{\Sigma}_{\text{sig-fake}}$, _where:_


    ```

    $\mathcal{L}^{\Sigma}_{\text{sig-real}}$

    $(vk, sk) \leftarrow \Sigma.\text{KeyGen}$

    GETVK():

    return $vk$

    GETSIG($m$):

    return $\Sigma.\text{Sign}(sk, m)$

    VERSIG($m, \sigma$):

    return $\Sigma.\text{Ver}(vk, m, \sigma)$

    ```


    ```

    $\mathcal{L}^{\Sigma}_{\text{sig-fake}}$

    $(vk, sk) \leftarrow \Sigma.\text{KeyGen}$

    $\mathcal{S} := \emptyset$

    GETVK():

    return $vk$

    GETSIG($m$):

    $\sigma := \Sigma.\text{Sign}(sk, m)$

    $\mathcal{S} := \mathcal{S} \cup \{(m, \sigma)\}$

    return $\sigma$

    VERSIG($m, \sigma$):

    return $(m, \sigma) \stackrel{?}{\in} \mathcal{S}$

    ```'
