    # 15.3 ElGamal Encryption


    ElGamal encryption is a public-key encryption scheme that is based on DHKA.


    Construction 15.6 (ElGamal)


    The public parameters are a choice of cyclic group G with n elements and generator
    g.


    | | KeyGen: | Enc(A, M ∈ G): | Dec(a, (B, X)): |

    |---|---|---|---|

    | M = G | sk := a ← Z_n | b ← Z_n | return X(B^a)^−1 |

    | C = G² | pk := A := g^a | B := g^b | |

    | | return (pk, sk) | return (B, M · A^b) | |


    The scheme satisfies correctness, since for all M:


    Dec(sk, Enc(pk, M)) = Dec(sk, (g^b, M · A^b))

    = (M · A^b)((g^b)^a)^−1

    = M · (g^{ab})(g^{ab})^−1 = M.


    # Security


    Imagine an adversary who is interested in attacking an ElGamal scheme. This adversary
    sees the public key A = g^a and a ciphertext (g^b, M g^{ab}) go by. Intuitively,
    the Decisional Diffie-Hellman assumption says that the value g^{ab} looks random,
    even to someone who has seen g^a and g^b. Thus, the message M is masked with a
    pseudorandom group element — as we''ve seen before, this is a lot like masking
    the message with a random pad as in one-time pad. The only change here is that
    instead of the xor operation, we are using the group operation in G.


    More formally, we can prove the security of ElGamal under the DDH assumption:


    Claim 15.7 If the DDH assumption in group G is true, then ElGamal in group G is
    CPA$-secure.'
