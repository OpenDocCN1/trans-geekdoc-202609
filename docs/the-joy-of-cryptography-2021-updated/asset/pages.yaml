    1798996

    sage: y^d % N

    31415926

    ```


    As you can see, raising to the e power and then d power (mod N) seems to bring
    us back to where we started (x).


    We can argue that raising-to-the-e-power and raising-to-the-d-power are inverses
    in general: Since ed ≡φ(N) 1, we can write ed = tφ(N) + 1 for some integer t.
    Then:


    $(x^e)^d = x^{ed} = x^{t\phi(N)+1} = (x^{\phi(N)})^t x \equiv_N 1^t x = x$


    Note that we have used the fact that $x^{\phi(N)} \equiv_N 1$ from Euler''s theorem.


    # How [Not] to Exponentiate Huge Numbers


    When you see an expression like “x^e % N”, you might be tempted to implement it
    with the following algorithm:


    | NaiveExponentiate(x, e, N): |

    | --- |

    | result = 1 |

    | for i = 1 to e: // compute x^e |

    |   result = result × x |

    | return result % N |


    While this algorithm would indeed give the correct answer, it is a really bad
    way of doing it. In practice, we use RSA with numbers that are thousands of bits
    long. Suppose we run the NaiveExponentiate algorithm with arguments x, e, and
    N which are around a thousand bits each (so the magnitude of these numbers is
    close to 2^1000):'
