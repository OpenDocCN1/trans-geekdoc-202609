    # Discussion


    +   In our example, the attacker sees the MAC tag for $m$ (computed as $H(k||m)$)
    and then forges the tag for $m'' = m||p$, where $p$ is the padding you must add
    when hashing $k||m$. Note that the padding depends only on the *length* of $k$,
    which we assume is public.


    +   The same attack works to forge the tag of any $m''$ that *begins with* $m||p$.
    The attacker would simply have to to compute the last several rounds (not just
    one round) of Merkle-Damgård herself.


    +   **This is not an attack on collision resistance!** Length-extension does not
    result in collisions! We are not saying that $k||m$ and $k||m||p$ have the *same*
    hash under $H$, only that knowing the hash of $k||m$ allows you to also compute
    the hash of $k||m||p$.


    Knowing how $H(k||m)$ fails to be a MAC helps us understand better ways to build
    a secure MAC from a hash function:


    +   The Merkle-Damgård approach suffers from length-extension attacks because
    it outputs its **entire internal state**. In the example picture above, the value
    $t$ is both the output of $H(k||m)$ as well as the only information about $k||m$
    needed to compute the last call to $h$ in the computation $H(k||m||p)$.


    One way to avoid this problem is to only output part of the internal state. In
    Merkle-Damgård, we compute $y_i := h(y_{i-1}||x_i)$ until reaching the final output
    $y_{k+1}$. Suppose instead that we only output half of $y_{k+1}$ (the $y_i$ values
    may need to be made longer in order for this to make sense). Then just knowing
    half of $y_{k+1}$ is not enough to predict what the hash output will be in a length-extension
    scenario.


    The hash function **SHA-3** was designed in this way (often called a "wide pipe"
    construction). One of the explicit design criteria of SHA-3 was that $H(k||m)$
    would be a secure MAC.


    +   Length extension with Merkle-Damgård is possible because the computation of
    $H(k||m)$ exactly appears during the computation of $H(k||m||p)$. Similar problems'
