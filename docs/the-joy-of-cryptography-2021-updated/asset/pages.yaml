    # Salts in Practice


    When we define hash functions in theory, we require that the hash function accept
    two inputs, the first of which is interpreted as a salt. The hash functions that
    you see in practice have only one input, a string of arbitrary length. You can
    simulate the effect of a salt for such a hash function by simply concatenating
    the two inputs – e.g., H(s||x) instead of H(s, x).


    The concept of a salted hash is not just useful to make a coherent security definition,
    it is also just good practice. Hash functions are commonly used to store passwords.
    A server may store user records of the form (username, h = H(password)). When
    a user attempts to login with password p'', the server computes H(p'') and compares
    it to h. Storing hashed passwords means that, in the event that the password file
    is stolen, an attacker would need to find a preimage of h in order to impersonate
    the user.


    Best practice is to use a separate salt for each user. Instead of storing (username,
    H(password)), choose a random salt s for each user and store (username, s, H(s,
    password)). The security properties of a hash function do not require s to be
    secret, although there is also no good reason to broadcast a user''s salt publicly.
    The salt is only needed by the server, when it verifies a password during a login
    attempt.


    A user-specific salt means that each user gets their own “personalized” hash function
    to store their password. Salts offer the following benefits:


    +   Without salts, it would be evident when two users have the same password –
    they would have the same password hashes. The same password hashed with different
    salts will result in unrelated hash outputs.


    +   An attacker can compute a dictionary of (p, H(p)) for common passwords. Without
    salts, this dictionary makes it easy to attack all users at once, since all users
    are using the same hash function. With salts, each user has a personalized hash
    function, each of which would require its own dictionary. Salt makes an attacker’s
    effort scale with the number of victims.


