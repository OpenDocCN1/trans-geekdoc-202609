  md: "```\nCBCMAC^F(k, m_1 \\cdots m_\\ell):\n  t := 0^\\lambda\n  for i = 1 to \\\
    ell:\n    t := F(k, m_i \\oplus t)\n  return t\n```\n\nUnlike CBC encryption,\
    \ CBC-MAC uses no initialization vector (or, you can think of it as using the\
    \ all-zeroes IV), and it outputs only the last block.\n\nTheorem 10.6 If F is\
    \ a secure PRF with in = out = \\(\\lambda\\), then for any fixed \\(\\ell\\),\
    \ CBC-MAC is a secure MAC when used with message space \\(\\mathcal{M} = \\{0,\
    \ 1\\}^{\\lambda \\ell}\\).\n\nPay close attention to the security statement.\
    \ It says that if you only ever authenticate 4-block messages, CBC-MAC is secure.\
    \ If you only ever authenticate 24-block messages, CBC-MAC is secure. However,\
    \ if you want to authenticate both 4-block and 24-block messages (i.e., under\
    \ the same key), then CBC-MAC is not secure. In particular, seeing the CBC-MAC\
    \ of several 4-block messages allows an attacker to generate a forgery of a 24-block\
    \ message. The exercises explore this property.\n\n# More Robust CBC-MAC\n\nIf\
    \ CBC-MAC is so fragile, is there a way to extend it to work for messages of mixed\
    \ lengths? One approach is called ECBC-MAC, and is shown below. It works by treating\
    \ the last block differently — specifically, it uses an independent PRF key for\
    \ the last block in the CBC chain.\n\n# Construction 10.7 (ECBC-MAC)\n\nLet F\
    \ be a PRF with in = out = \\(\\lambda\\). ECBC-MAC refers to the following scheme:\n\
    \n```\nECBCMAC^F((k_1, k_2), m_1 \\cdots m_\\ell):\n  t := 0^\\lambda\n  for i\
    \ = 1 to \\ell - 1:\n    t := F(k_1, m_i \\oplus t)\n  return F(k_2, m_\\ell \\\
    oplus t)\n```\n\nTheorem 10.8 If F is a secure PRF with in = out = \\(\\lambda\\\
    ), then ECBC-MAC is a secure MAC for message space \\(\\mathcal{M} = (\\{0, 1\\\
    }^\\lambda)^*\\).\n\nIn other words, ECBC-MAC is safe to use with messages of\
    \ any length (that is a multiple of the block length)."
