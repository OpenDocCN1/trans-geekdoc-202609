  md: 'of this kind are called LaGrange polynomials. They are each degree-d polynomials,
    and they satisfy the property:


    ```

    \ell_j(\boldsymbol{x}_i) = \begin{cases} 1 & \text{if } i = j \\ 0 & \text{if
    } i \neq j \end{cases}

    ```


    Now consider the following polynomial:


    ```

    f(\boldsymbol{x}) = y_1\ell_1(\boldsymbol{x}) + y_2\ell_2(\boldsymbol{x}) + \cdots
    + y_{d+1}\ell_{d+1}(\boldsymbol{x}).

    ```


    Note that f is a degree-d polynomial since it is the sum of degree-d polynomials
    (again, the $y_i$ values are just scalars).


    What happens when we evaluate f on one of the special $x_i$ values? Since $\ell_i(\boldsymbol{x}_i)
    = 1$ and $\ell_j(\boldsymbol{x}_i) = 0$ for $j \neq i$, we get:


    ```

    f(\boldsymbol{x}_i) = y_1\ell_1(\boldsymbol{x}_i) + \cdots + y_i\ell_i(\boldsymbol{x}_i)
    + \cdots + y_{d+1}\ell_{d+1}(\boldsymbol{x}_i)\\= y_1 \cdot 0 + \cdots + y_i \cdot
    1 + \cdots + y_{d+1} \cdot 0\\= y_i

    ```


    So $f(\boldsymbol{x}_i) = y_i$ for every $x_i$, which is what we wanted. This
    shows that there is *some* degree-d polynomial with this property.


    Now let''s argue that this $f$ is unique. Suppose there are two degree-d polynomials
    $f$ and $f''$ such that $f(\boldsymbol{x}_i) = f''(\boldsymbol{x}_i) = y_i$ for
    $i \in \{1, \dots, d+1\}$. Then the polynomial $g(\boldsymbol{x}) = f(\boldsymbol{x})
    - f''(\boldsymbol{x})$ also is degree-d, and it satisfies $g(\boldsymbol{x}_i)
    = 0$ for all $i$. In other words, each $\boldsymbol{x}_i$ is a root of $g$, so
    $g$ has at least $d+1$ roots. But the only degree-d polynomial with $d+1$ roots
    is the identically-zero polynomial $g(\boldsymbol{x}) = 0$. If $g(\boldsymbol{x})
    = 0$ then $f = f''$. In other words, any degree-d polynomial $f''$ that satisfies
    $f''(\boldsymbol{x}_i) = y_i$ must be equal to $f$. So $f$ is the unique polynomial
    with this property.


    **Example** Let''s figure out the degree-3 polynomial that passes through the
    points (3, 1), (4, 1), (5, 9), (2, 6):


    | i | 1 | 2 | 3 | 4 |

    |---|---|---|---|---|

    | $\boldsymbol{x}_i$ | 3 | 4 | 5 | 2 |

    | $y_i$ | 1 | 1 | 9 | 6 |


    First, let''s construct the appropriate LaGrange polynomials:


    ```

    \ell_1(\boldsymbol{x}) = \frac{(\boldsymbol{x} - \boldsymbol{x}_2)(\boldsymbol{x}
    - \boldsymbol{x}_3)(\boldsymbol{x} - \boldsymbol{x}_4)}{(\boldsymbol{x}_1 - \boldsymbol{x}_2)(\boldsymbol{x}_1
    - \boldsymbol{x}_3)(\boldsymbol{x}_1 - \boldsymbol{x}_4)} = \frac{(\boldsymbol{x}
    - 4)(\boldsymbol{x} - 5)(\boldsymbol{x} - 2)}{(3 - 4)(3 - 5)(3 - 2)} = \frac{\boldsymbol{x}^3
    - 11\boldsymbol{x}^2 + 38\boldsymbol{x} - 40}{2}\\ \ell_2(\boldsymbol{x}) = \frac{(\boldsymbol{x}
    - \boldsymbol{x}_1)(\boldsymbol{x} - \boldsymbol{x}_3)(\boldsymbol{x} - \boldsymbol{x}_4)}{(\boldsymbol{x}_2
    - \boldsymbol{x}_1)(\boldsymbol{x}_2 - \boldsymbol{x}_3)(\boldsymbol{x}_2 - \boldsymbol{x}_4)}
    = \frac{(\boldsymbol{x} - 3)(\boldsymbol{x} - 5)(\boldsymbol{x} - 2)}{(4 - 3)(4
    - 5)(4 - 2)} = \frac{\boldsymbol{x}^3 - 10\boldsymbol{x}^2 + 31\boldsymbol{x}
    - 30}{-2}\\ \ell_3(\boldsymbol{x}) = \frac{(\boldsymbol{x} - \boldsymbol{x}_1)(\boldsymbol{x}
    - \boldsymbol{x}_2)(\boldsymbol{x} - \boldsymbol{x}_4)}{(\boldsymbol{x}_3 - \boldsymbol{x}_1)(\boldsymbol{x}_3
    - \boldsymbol{x}_2)(\boldsymbol{x}_3 - \boldsymbol{x}_4)} = \frac{(\boldsymbol{x}
    - 3)(\boldsymbol{x} - 4)(\boldsymbol{x} - 2)}{(5 - 3)(5 - 4)(5 - 2)} = \frac{\boldsymbol{x}^3
    - 9\boldsymbol{x}^2 + 26\boldsymbol{x} - 24}{6}\\ \ell_4(\boldsymbol{x}) = \frac{(\boldsymbol{x}
    - \boldsymbol{x}_1)(\boldsymbol{x} - \boldsymbol{x}_2)(\boldsymbol{x} - \boldsymbol{x}_3)}{(\boldsymbol{x}_4
    - \boldsymbol{x}_1)(\boldsymbol{x}_4 - \boldsymbol{x}_2)(\boldsymbol{x}_4 - \boldsymbol{x}_3)}
    = \frac{(\boldsymbol{x} - 3)(\boldsymbol{x} - 4)(\boldsymbol{x} - 5)}{(2 - 3)(2
    - 4)(2 - 5)} = \frac{\boldsymbol{x}^3 - 12\boldsymbol{x}^2 + 47\boldsymbol{x}
    - 60}{-6}

    ```'
