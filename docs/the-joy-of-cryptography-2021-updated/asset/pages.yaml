  md: '# # Pseudorandom Generators


    One-time pad requires a key that’s as long as the plaintext. Let’s forget that
    we know about this limitation. Suppose Alice & Bob share only a short \(\lambda\)-bit
    secret \(k\), but they want to encrypt a \(2\lambda\)-bit plaintext \(m\). They
    don’t know that (perfect) one-time secrecy is impossible in this setting (Exercise
    2.11), so they try to get it to work anyway using the following reasoning:


    +   - The only encryption scheme they know about is one-time pad, so they decide
    that the ciphertext will have the form \(c = m \oplus \text{??}\). This means
    that the unknown value ?? must be \(2\lambda\) bits long.

    +   - In order for the security of one-time pad to apply, the unknown value ??
    should be uniformly distributed.

    +   - The process of obtaining the unknown value ?? from the shared key \(k\)
    should be *deterministic*, so that the sender and receiver compute the same value
    and decryption works correctly.


    Let \(G\) denote the process that transforms the key \(k\) into this mystery value.
    Then \(G : \{0, 1\}^\lambda \rightarrow \{0, 1\}^{2\lambda}\), and the encryption
    scheme is \(\text{Enc}(k, m) = m \oplus G(k)\).


    It is not hard to see that if \(G\) is a deterministic function, then there are
    only \(2^\lambda\) possible outputs of \(G\), so the distribution of \(G(k)\)
    cannot be uniform in \(\{0, 1\}^{2\lambda}\). We therefore cannot argue that the
    scheme is secure in the same way as one-time pad.


    However, what if the distribution of \(G(k)\) values is not perfectly uniform
    but only “close enough” to uniform? Suppose no polynomial-time algorithm can distinguish
    the distribution of \(G(k)\) values from the uniform distribution. Then surely
    this ought to be “close enough” to uniform for practical purposes. This is exactly
    the idea of **pseudorandomness**. It turns out that if \(G\) has a pseudorandomness
    property, then the encryption scheme described above is actually secure (against
    polynomial-time adversaries, in the sense discussed in the previous chapter).


    # ## 5.1 Definitions


    A **pseudorandom generator (PRG)** is a deterministic function \(G\) whose outputs
    are longer than its inputs. When the input to \(G\) is chosen uniformly at random,
    it induces a certain distribution over the possible output. As discussed above,
    this output distribution cannot be uniform. However, the distribution is *pseudorandom*
    if it is **indistinguishable from the uniform distribution**. More formally:'
