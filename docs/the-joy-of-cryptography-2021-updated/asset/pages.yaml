- pgno: 156
  md: '# Construction 8.3 (CTR Mode)


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_156_0.png)


    # OFB: Output Feedback


    OFB (output feedback) mode is rarely used in practice. We''ll include it in our
    discussion because it has the easiest security proof. As with CBC and CTR modes,
    OFB starts with a random IV r, and then uses the sequence:


    $F(k, r);\quad F(k, F(k, r));\quad F(k, F(k, F(k, r)));\quad \dots$


    as a one-time pad to mask the plaintext.


    # Construction 8.4 (OFB Mode)


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_156_1.png)


    # Compare & Contrast


    CBC and CTR modes are essentially the only two modes that are ever considered
    in practice for CPA security. Both provide the same security guarantees, and so
    any comparison between the two must be based on factors outside of the CPA security
    definition. Here are a few properties that are often considered when choosing
    between these modes:


    +   ▶ Although we have not shown the decryption algorithm for CTR mode, it does
    not even use the block cipher''s inverse F^{-1}. This is similar to our PRF-based
    encryption scheme from the previous chapter (in fact, CTR mode collapses to that
    construction when restricted to 1-block plaintexts). Strictly speaking, this means
    CTR mode can be instantiated from a PRF; it doesn''t need a PRP. However, in practice
    it is rare to encounter an efficient PRF that is not a PRP.


    +   ▶ CTR mode encryption can be parallelized. Once the IV has been chosen, the
    ith block of ciphertext can be computed without first computing the previous i
    - 1'
