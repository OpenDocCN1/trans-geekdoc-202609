    \ $rs$. One wild idea is to first directly compute the CRT encoding of this answer,\
    \ and then convert that encoding to the normal integer representation in $\\mathbb{Z}_{rs}$.\n\
    \nIn this case, we know that the answer $x + x'$ has the CRT encoding $(u + u'\
    \ \\% r, v + v' \\% s)$. But this is the same as $(x + x' \\% r, x + x' \\% s)$\
    \ – do you see why? So, to add $x + x'$ mod $rs$, we just need to add $x + x'$\
    \ mod $r$, and then add $x + x'$ mod $s$. This gives us the CRT encoding of the\
    \ answer we want, and we can convert that CRT encoding back into a normal $\\\
    mathbb{Z}_{rs}$-integer.\n\nThe same idea works for multiplication as well, giving\
    \ us the following:\n\n+   **CRT method for doing some operation[s] mod rs**\n\
    +   \n+   1. Do the operation[s] you want, but mod $r$ instead of mod $rs$.\n\
    +   2. Do the operation[s] you want, but mod $s$ instead of mod $rs$.\n+   3.\
    \ Those two results are the CRT encoding of the final answer, so convert them\
    \ back to the normal representation."
