  md: "```\n\\mathcal{L}^\\Sigma_{\\text{cpa-R}}:\nk \\leftarrow \\Sigma.\\text{KeyGen}\n\
    EAVESDROP(m_L, m_R):\n  c := \\Sigma.\\text{Enc}(k, m_R)\n  return c\n```\n\n\
    The $\\mathcal{L}_{\\text{cpa\\$-real}}$ library has been inlined, and the result\
    \ is $\\mathcal{L}^\\Sigma_{\\text{cpa-R}}$.\n\nThe sequence of hybrids shows\
    \ that $\\mathcal{L}^\\Sigma_{\\text{cpa-L}} \\approx \\mathcal{L}^\\Sigma_{\\\
    text{cpa-R}}$, as desired.\n\n# 7.3 CPA-Secure Encryption Based On PRFs\n\nCPA\
    \ security presents a significant challenge; its goals seem difficult to reconcile.\
    \ On the one hand, we need an encryption method that is randomized, so that each\
    \ plaintext \\(m\\) is mapped to a large number of potential ciphertexts. On the\
    \ other hand, the decryption method must be able to recognize all of these various\
    \ ciphertexts as being encryptions of \\(m\\).\n\nHowever, we have already seen\
    \ a way to do this! In Chapter 6 we motivated the concept of a PRF with the following\
    \ encryption technique. If Alice and Bob share a huge table \\(T\\) initialized\
    \ with uniform data, then Alice can encrypt a plaintext \\(m\\) to Bob by saying\
    \ something like \"this is encrypted with one-time pad, using key #674696273\"\
    \ and sending \\(T[674696273] \\oplus m\\). Seeing the number 674696273 doesn't\
    \ help the eavesdropper know what \\(T[674696273]\\) is. A PRF allows Alice &\
    \ Bob to do the same encryption while sharing only a short key \\(k\\). Instead\
    \ of a the huge table \\(T\\), they can instead use a PRF \\(F(k, \\cdot)\\) to\
    \ derive a common pseudorandom value. Knowing a value \\(r\\) doesn't help the\
    \ adversary predict \\(F(k, r)\\), when \\(k\\) is secret.\n\nSo, translated into\
    \ more precise PRF notation, an encryption of \\(m\\) will look like \\((r, F(k,\
    \ r) \\oplus m)\\). Since Bob also has \\(k\\), he can decrypt *any* ciphertext\
    \ of this form by computing \\(F(k, r)\\) and xor'ing the second ciphertext component\
    \ to recover \\(m\\).\n\nIt remains to decide how exactly Alice will choose \\\
    (r\\) values. We argued, informally, that as long as these \\(r\\) values don't\
    \ repeat, security is preserved. This is indeed true, and the distinctness of\
    \ the \\(r\\) values is critical. Recall that there are 3 ways to avoid deterministic\
    \ encryption, and all 3 of them would work here:\n\n+   - In a **stateful** encryption,\
    \ \\(r\\) could be used as a counter. Use \\(r = i\\) to encrypt/decrypt the \\\
    (i\\)th ciphertext.\n+   - In a **randomized** encryption, choose \\(r\\) uniformly\
    \ at random for each encryption. If the \\(r\\) values are long enough strings,\
    \ then repeating an \\(r\\) value should be negligibly likely.\n+   - In a **nonce-based**\
    \ encryption, we can simply let \\(r\\) be the nonce. In the nonce-based setting,\
    \ it is guaranteed that these values won't repeat.\n\nIn this section we will\
    \ show the security proof for the case of randomized encryption, since it is the\
    \ most traditional setting and also somewhat more robust than the others."
