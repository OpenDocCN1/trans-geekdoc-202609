  md: '# 10 Message Authentication Codes


    The challenge of CCA-secure encryption is dealing with ciphertexts that were generated
    by an adversary. Imagine there was a way to “certify” that a ciphertext was not
    adversarially generated — i.e., it was generated by someone who knows the secret
    key. We could include such a certification in the ciphertext, and the Dec algorithm
    could raise an error if it asked to decrypt something with invalid certification.


    What we are asking for is not to **hide** the ciphertext but to **authenticate**
    it: to ensure that it was generated by someone who knows the secret key. The tool
    for the job is called a **message authentication code**. One of the most important
    applications of a message authentication code is to transform a CPA-secure encryption
    scheme into a CCA-secure one.


    As you read this chapter, keep in mind that privacy and authentication are indeed
    different properties. It is possible to have one or the other or indeed both simultaneously.
    But one does not imply the other, and it is crucial to think about them separately.


    # 10.1 Definition


    A MAC is like a signature that can be added to a piece of data, which certifies
    that someone who knows the secret key attests to this particular data. In cryptography,
    the term “signature” means something specific, and slightly different than a MAC.
    Instead of calling the output of a MAC algorithm a signature, we call it a “tag”
    (or, confusingly, just “a MAC”).


    Our security requirement for a MAC scheme is that only someone with the secret
    key can generate a valid tag. To check whether a tag is valid, you just recompute
    the tag for a given message and see whether it matches the claimed tag. This implies
    that both generating and verifying a MAC tag requires the secret key.


    **Definition 10.1 (MAC scheme)** _A **message authentication code (MAC) scheme**
    for message space_ $\mathcal{M}$ _consists of the following algorithms:_


    +   - **KeyGen**: samples a key.

    +   - **MAC**: takes a key $k$ and message $m \in \mathcal{M}$ as input, and outputs
    a **tag** $t$. The MAC algorithm is deterministic.


    # How to Think About Authenticity Properties


    Every security definition we’ve seen so far is about hiding information, so how
    do we make a formal definition about authenticity?


    Before we see the security definition for MACs, let’s start with a much simpler
    (potentially obvious?) statement: “an adversary should not be able to guess a
    uniformly chosen $\lambda$-bit value.” We can formalize this idea with the following
    two libraries:'
