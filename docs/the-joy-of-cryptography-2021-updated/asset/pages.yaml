  md: "# # Brute Force Attacks on Hash Functions\n\nThere is an important difference\
    \ between collision resistance and second-preimage resistance, which is reflected\
    \ in the difficulty of their respective brute force attacks. Suppose \\(H\\) is\
    \ a hash function whose outputs are \\(n\\) bits long. Let's make a simplifying\
    \ assumption that for any \\(m > n\\), the following distribution is roughly uniform\
    \ over \\(\\{0, 1\\}^n\\):\n\n```\nx \\leftarrow \\{0, 1\\}^m\nreturn H(x)\n```\n\
    \nThis is quite a realistic assumption for practical hash functions. If this were\
    \ not true, then \\(H\\) would introduce some bias towards some outputs and away\
    \ from other outputs, which would be perceived as suspicious. Also, as the output\
    \ of \\(H\\) deviates farther from a uniform distribution, it only makes finding\
    \ collisions easier.\n\nBelow are straight-forward brute-force attacks for collision\
    \ resistance (left) and second-preimage resistance (right):\n\n```\nCollision\
    \ brute force:\n\\(\\mathcal{A}_{cr}():\\)\nfor i = 1, ...:\n  \\(x_i \\leftarrow\
    \ \\{0, 1\\}^m\\)\n  \\(y_i := H(x_i)\\)\n  if there is some j < i with \\(x_i\
    \ \\neq x_j\\) but \\(y_i = y_j\\):\n    return \\((x_i, x_j)\\)\n```\n\n```\n\
    Second preimage brute force:\n\\(\\mathcal{A}_{2pi}(x):\\)\nwhile true:\n  \\\
    (x' \\leftarrow \\{0, 1\\}^m\\)\n  \\(y' := H(x')\\)\n  if \\(y' = H(x)\\): return\
    \ \\(x'\\)\n```\n\nUnder the simplifying assumption on \\(H\\), the collision-resistance\
    \ brute force attack \\(\\mathcal{A}_{cr}\\) is essentially choosing each \\(y_i\\\
    ) uniformly at random. Since each \\(y_i \\in \\{0, 1\\}^n\\), the probability\
    \ of finding a repeated value after \\(q\\) times through the main loop is roughly\
    \ \\(\\Theta(q^2/2^n)\\) by the birthday bound. While in the **worst case** it\
    \ could take \\(2^n\\) steps to find a collision in \\(H\\), the birthday bound\
    \ implies that it takes only \\(2^{n/2}\\) attempts to find a collision with 99%\
    \ probability (or any constant probability).\n\nOn the other hand, the second-preimage\
    \ brute force attack \\(\\mathcal{A}_{2pi}\\) is given \\(y\\) as input and (under\
    \ our simplifying assumption on \\(H\\)) essentially samples \\(y'\\) uniformly\
    \ at random until \\(y\\) is the result. It will therefore take \\(\\Theta(2^n)\\\
    ) attempts in expectation to terminate successfully.\\(^1\\)\n\nThere is a fundamental\
    \ difference in how hard it is to break collision resistance and second-preimage\
    \ resistance. Breaking collision-resistance is like inviting more people into\
    \ the room until the room contains 2 people with the same birthday. Breaking second-preimage\
    \ resistance is like inviting more people into the room until the room contains\
    \ another person with *your* birthday. One of these fundamentally takes longer\
    \ than the other.\n\n\\(^1\\) A well-known and useful fact from probability theory\
    \ is that if an event happens with probability \\(p\\), then the expected number\
    \ of times to repeat before seeing the event is \\(1/p\\). For example, the probability\
    \ of rolling a 1 on a D6 die is 1/6, so it takes 6 rolls in expectation before\
    \ seeing a 1. The probability of sampling a particular \\(y\\) from \\(\\{0, 1\\\
    }^n\\) in one try is \\(1/2^n\\), so the expected number of trials before seeing\
    \ \\(y\\) is \\(2^n\\)."
