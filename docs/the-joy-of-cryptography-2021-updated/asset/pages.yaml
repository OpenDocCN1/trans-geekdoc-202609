    # ## 2.5 How to Compare/Contrast Security Definitions


    In math, a definition can’t really be “wrong,” but it can be “not as useful as
    you hoped” or it can “fail to adequately capture your intuition” about the concept.


    Security definitions are no different. In this chapter we introduced two security
    definitions: one in the “real-vs-random” style and one in the “left-vs-right”
    style. In this section we treat the *security definitions themselves* as objects
    worth studying. Are both of these security definitions “the same,” in some sense?
    Do they both capture all of our intuitions about security?


