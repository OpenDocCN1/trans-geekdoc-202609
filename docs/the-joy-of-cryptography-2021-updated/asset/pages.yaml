  md: '# # 13.4 Chinese Remainder Theorem


    When doing arithmetic mod N, we can sometimes use knowledge of the factors N =
    pq to speed things up. This section discusses the math behind these speedups.


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_250_0.png)


    **History.** In the Sunzi Suanjing, written some time around the 4th century CE,
    Chinese mathematician Sunzi posed an interesting puzzle involving remainders:


    > > “We have a number of things, but we do not know exactly how many. If we count
    them by threes we have two left over. If we count them by fives we have three
    left over. If we count them by sevens we have two left over. How many things are
    there?”⁶


    Sunzi’s puzzle is the first known instance of a system of simultaneous equations
    involving modular arithmetic: In our notation, he is asking us to solve for x
    in the following system of congruences:


    ```

    x ≡₃ 2

    x ≡₅ 3

    x ≡₇ 2

    ```


    We can solve such systems of equations using what is called (in the West) the
    **Chinese Remainder Theorem** (CRT). Below is one of the simpler formations of
    the Chinese Remainder Theorem, involving only two equations/moduli (unlike the
    example above, which has three moduli 3, 5, and 7):


    **Theorem 13.9 (CRT)** Suppose gcd(r, s) = 1. Then for all integers u, v, there
    is a solution for x in the following system of equations:


    ```

    x ≡ᵣ u

    x ≡ₛ v

    ```


    Furthermore, this solution is unique modulo rs.


    **Proof** Since gcd(r, s) = 1, we have by Bezout’s theorem that 1 = ar + bs for
    some integers a and b. Furthermore, b and s are multiplicative inverses modulo
    r. Now choose x = var + ubs. Then,


    ```

    x = var + ubs ≡ᵣ (va)0 + u(s⁻¹s) = u

    ```


    So x ≡ᵣ u, as desired. Using similar reasoning mod s, we can see that x ≡ₛ v,
    so x is a solution to both equations.


    Now we argue that this solution is unique modulo rs. Suppose x and x’ are two
    solutions to the system of equations, so we have:


    ```

    x ≡ᵣ x’ ≡ᵣ u

    ```


    ⁶Chinese text is from an old manuscript of Sunzi Suanjing, but my inability to
    speak the language prevents me from identifying the manuscript more precisely.
    English translation is from Joseph Needham, Science and Civilisation in China,
    vol. 3: Mathematics and Sciences of the Heavens and Earth, 1959.'
