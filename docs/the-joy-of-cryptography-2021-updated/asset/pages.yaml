- pgno: 117
  md: '# 6.1 Definition


    Continuing our example, imagine a huge table of shared data stored as an array
    \( T \), so the \( i \)th item is referenced as \( T[i] \). Instead of thinking
    of \( i \) as an integer, we can also think of \( i \) as a binary string. If
    the array has \( 2^{in} \) items, then \( i \) will be an \( in \)-bit string.
    If the array contains strings of length “out”, then the notation \( T[i] \) is
    like a function that takes an input from \( \{0, 1\}^{in} \) and gives an output
    from \( \{0, 1\}^{out} \).


    A pseudorandom function emulates the functionality of a huge array. It is a function
    \( F \) that takes an input from \( \{0, 1\}^{in} \) and gives an output from
    \( \{0, 1\}^{out} \). However, \( F \) also takes an additional argument called
    the **seed**, which acts as a kind of secret key.


    The goal of a pseudorandom function is to “look like” a uniformly chosen array
    / lookup table. Such an array can be accessed through the lookup subroutine of
    the following library:


    ```

    for \( x \in \{0, 1\}^{in} \):

    \( T[x] \leftarrow \{0, 1\}^{out} \)

    LOOKUP(\( x \in \{0, 1\}^{in} \)):

    return \( T[x] \)

    ```


    As you can see, this library initially fills up the array \( T \) with uniformly
    random data, and then allows the calling program to access any position in the
    array.


    A pseudorandom function should produce indistinguishable behavior, when it is
    used with a uniformly chosen seed. More formally, the following library should
    be indistinguishable from the one above:


    ```

    \( k \leftarrow \{0, 1\}^\lambda \)

    LOOKUP(\( x \in \{0, 1\}^{in} \)):

    return \( F(k, x) \)

    ```


    Note that the first library samples \( out \cdot 2^{in} \) bits uniformly at random
    (\( out \) bits for each of \( 2^{in} \) entries in the table), while the second
    library samples only \( \lambda \) bits (the same \( k \) is used for all invocations
    of \( F \)). Still, we are asking for the two libraries to be indistinguishable.


    This is basically the definition of a PRF, with one technical caveat. We want
    to allow situations like \( in \geqslant \lambda \), but in those cases the first
    library runs in exponential time. It is generally convenient to build our security
    definitions with libraries that run in polynomial time.\(^1\) We fix this by taking
    advantage of the fact that, no matter how big the table \( T \) is meant to be,
    a polynomial-time calling program will only access a polynomial amount of it.
    In some sense it is “overkill” to actually populate the entire table \( T \) upfront.
    Instead, we can populate \( T \) in a lazy / on-demand way. \( T \) initially
    starts uninitialized, and its values are only assigned as the calling program
    requests them. This changes *when* each \( T[x] \) is sampled (if at all), but
    does not change *how* it is sampled (i.e., uniformly & independently). This also
    changes \( T \) from being a typical array to being an *associative array* (“hash
    table” or “dictionary” data structure), since it only maps a subset of \( \{0,
    1\}^{in} \) to values in \( \{0, 1\}^{out} \).


    \(^1\)When we use a pseudorandom function as a component in other constructions,
    the libraries for PRF security will show up as *calling programs* of other libraries.
    The definition of indistinguishability requires all calling programs to run in
    polynomial time.'
