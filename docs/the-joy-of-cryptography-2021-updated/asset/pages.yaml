    When A is linked to L_cpa-L, the EAVESDROP algorithm will encrypt its first argument.
    So, c1 and c2 will both be computed as F(k, 0^blen). Since F is a deterministic
    function, this results in identical outputs from EAVESDROP. In other words c1
    = c2, and A <|unk|> L_cpa-L always outputs 1.


    ```

    A

    c1 := EAVESDROP(0^blen, 0^blen)

    c2 := EAVESDROP(0^blen, 1^blen)

    return c1 =? c2

    ```


    ```

    L^Sigma_cpa-R

    k <- {0, 1}^lambda

    EAVESDROP(mL, mR):

    c := F(k, mR)

    return c

    ```


    When A is linked to L_cpa-R, the EAVESDROP algorithm will encrypt its second argument.
    So, c1 and c2 are computed as c1 = F(k, 0^blen) and c2 = F(k, 1^blen). Since F
    is a permutation, c1 != c2, so A <|unk|> L_cpa-R never outputs 1.


    This adversary has advantage 1 in distinguishing the libraries, so the bare block
    cipher F is not a CPA-secure encryption scheme.


    # Impossibility of Deterministic Encryption


    The reason a bare block cipher does not provide CPA security is that it is deterministic.
    Calling Enc(k, m) twice — with the same key and same plaintext — leads to the
    same ciphertext. Even one-time pad is deterministic.1 One of the first and most
    important aspects of CPA security is that it is incompatible with deterministic
    encryption. Deterministic encryption can never be CPA-secure! In other words,
    we can attack the CPA-security of any scheme Sigma, knowing only that it has deterministic
    encryption. The attack is a simple generalization of our attack against a bare
    PRP:


    ```

    A

    arbitrarily choose distinct plaintexts x, y in M

    c1 := EAVESDROP(x, x)

    c2 := EAVESDROP(x, y)

    return c1 =? c2

    ```


    A good way to think about what goes wrong with deterministic encryption is that
    it leaks whether two ciphertexts encode the same plaintext, and this is not allowed
    by CPA security. Think of sealed envelopes as an analogy for encryption. I shouldn''t
    be able to tell whether two sealed envelopes contain the same text! We are only
    now seeing this issue because this is the first time our security definition allows
    an adversary to see multiple ciphertexts encrypted under the same key.


    1Remember, we can always consider what will happen when running one-time pad encryption
    twice with the same key + plaintext. The one-time secrecy definition doesn''t
    give us any security guarantees about using one-time pad in this way, but we can
    still consider it as a thought experiment.'
