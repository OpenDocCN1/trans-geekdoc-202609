    \Rightarrow 1 \mid \mathcal{B}_{left}] \cdot p^* + \Pr[\mathcal{A} \diamond \mathcal{L}_{left}
    \Rightarrow 1 \mid \overline{\mathcal{B}_{left}}](1 - p^*) \right) \\ -\left(
    \Pr[\mathcal{A} \diamond \mathcal{L}_{right} \Rightarrow 1 \mid \mathcal{B}_{right}]
