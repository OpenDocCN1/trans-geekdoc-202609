  md: 'classes of attacks, and proofs that justify certain choices in building the
    block cipher from simpler components.


    The Rijndael cipher, designed by Vincent Rijmen and Joan Daemen, was selected
    as the winner and became the AES standard in 2001. There may not be another cryptographic
    algorithm that has been the focus of more scrutiny and attempts at attack. So
    far no significant weaknesses in AES are known.³


    The AES block cipher has a blocklength of 128 bits, and offers 3 different variants
    with 128-bit, 192-bit, and 256-bit keys. As a result of its standardization, AES
    is available in cryptographic libraries for any programming language. It is even
    implemented as hardware instructions in most modern processors, allowing millions
    of AES evaluations per second. As we have seen, once you have access to a good
    block cipher, it can be used directly also as a secure PRF (Corollary 6.8), and
    it can be used to construct a simple PRG (Construction 6.2). Even though AES itself
    is not a provably secure PRP, these constructions of PRFs and PRGs based on AES
    are secure. Or, more precisely, the PRF-security and PRG-security of these constructions
    is guaranteed to be as good as the PRP-security of AES.


    # ⋆ 6.6 Strong Pseudorandom Permutations


    Since a block cipher F has a corresponding inverse F⁻¹, it is natural to think
    of F and F⁻¹ as interchangeable in some sense. However, the PRP security definition
    only guarantees a security property for F and not its inverse. In the exercises,
    you will see that it is possible to construct F which is a secure PRP, whose inverse
    F⁻¹ is not a secure PRP!


    It would be very natural to ask for a PRP whose F and F⁻¹ are both secure. We
    will later see applications where this property would be convenient. An even stronger
    requirement would allow the distinguisher to query both F and F⁻¹ in a single
    interaction (rather than one security definition where the distinguisher queries
    only F, and another definition where the distinguisher queries only F⁻¹). If a
    PRP is indistinguishable from a random permutation under that setting, then we
    say it is a strong PRP (SPRP).


    In the formal security definition, we provide the calling program two subroutines:
    one for forward queries and one for reverse queries. In L_sprp-real, these subroutines
    are implemented by calling the PRP or its inverse accordingly. In L_sprp-rand,
    we emulate the behavior of a randomly chosen permutation that can be queried in
    both directions. We maintain two associative arrays T and T_inv to hold the truth
    tables of these permutations, and sample their values on-demand. The only restriction
    is that T and T_inv maintain consistency (T[x] = y if and only if T_inv[y] = x).
    This also ensures that they always represent an invertible function. We use the
    same technique as before to ensure invertibility.


    ³In all fairness, there is a possibility that government agencies like NSA know
    of weaknesses in many cryptographic algorithms, but keep them secret. I know of
    a rather famous cryptographer (whom I will not name here) who believes this is
    likely, based on the fact that NSA has hired more math & cryptography PhDs than
    have gone on to do public research.'
