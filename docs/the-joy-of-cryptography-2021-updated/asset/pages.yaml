- pgno: 158
  md: 'So, technically speaking, these block cipher modes do not provide CPA security,
    since ciphertexts leak the length (measured in blocks) of the plaintext. But suppose
    we don’t really care about hiding the length of plaintexts.\(^1\) Is there a way
    to make a security definition that says: **ciphertexts hide everything about the
    plaintext, except their length**?


    It is clear from the previous example that a distinguisher can successfully distinguish
    the CPA libraries if it makes a query \(\text{EAVESDROP}(m_L, m_R)\) with \(|m_L|
    \neq |m_R|\). A simple way to change the CPA security definition is to just disallow
    this kind of query. The libraries will give an error message if \(|m_L| \neq |m_R|\).
    This would allow the adversary to make the challenge plaintexts differ in any
    way of his/her choice, *except in their length*. It doesn’t really matter whether
    \(|m|\) refers to the length of the plaintext in bits or in blocks — whichever
    makes the most sense for a particular scheme.


    From now on, when discussing encryption schemes that support *variable-length*
    plaintexts, CPA security will refer to the following updated libraries:


    | $\mathcal{L}^\Sigma_{\text{cpa-L}}$ |

    |---|

    | $k \leftarrow \Sigma.\text{KeyGen}$ |

    | $\text{CTXT}(m_L, m_R \in \Sigma.\mathcal{M})$: |

    | if $|m_L| \neq |m_R|$ return err |

    | $c := \Sigma.\text{Enc}(k, m_L)$ |

    | return $c$ |


    | $\mathcal{L}^\Sigma_{\text{cpa-R}}$ |

    |---|

    | $k \leftarrow \Sigma.\text{KeyGen}$ |

    | $\text{CTXT}(m_L, m_R \in \Sigma.\mathcal{M})$: |

    | if $|m_L| \neq |m_R|$ return err |

    | $c := \Sigma.\text{Enc}(k, m_R)$ |

    | return $c$ |


    In the definition of CPA$ security (pseudorandom ciphertexts), the $\mathcal{L}_{\text{cpa\$-rand}}$
    library responds to queries with uniform responses. Since these responses must
    look like ciphertexts, they must have the appropriate length. For example, for
    the modes discussed in this chapter, an $\ell$-block plaintext is expected to
    be encrypted to an $(\ell + 1)$-block ciphertext. So, based on the length of the
    plaintext that is provided, the library must choose the appropriate ciphertext
    length. We are already using $\Sigma.\mathcal{C}$ to denote the set of possible
    ciphertexts of an encryption scheme $\Sigma$. So let’s extend the notation slightly
    and write $\Sigma.\mathcal{C}(\ell)$ to denote the set of possible ciphertexts
    for plaintexts of length $\ell$. Then when discussing encryption schemes supporting
    variable-length plaintexts, CPA$ security will refer to the following libraries:


    | $\mathcal{L}^\Sigma_{\text{cpa\$-real}}$ |

    |---|

    | $k \leftarrow \Sigma.\text{KeyGen}$ |

    | $\text{CHALLENGE}(m \in \Sigma.\mathcal{M})$: |

    | $c := \Sigma.\text{Enc}(k, m)$ |

    | return $c$ |


    | $\mathcal{L}^\Sigma_{\text{cpa\$-rand}}$ |

    |---|

    | $\text{CHALLENGE}(m \in \Sigma.\mathcal{M})$: |

    | $c \leftarrow \Sigma.\mathcal{C}(|m|)$ |

    | return $c$ |


    Note that the $\mathcal{L}_{\text{cpa\$-rand}}$ library does not use any information
    about $m$ other than its length. This again reflects the idea that ciphertexts
    leak nothing about plaintexts other than their length.


    \(^1\)Indeed, hiding the length of communication (in the extreme, hiding the *existence*
    of communication) is a very hard problem.'
