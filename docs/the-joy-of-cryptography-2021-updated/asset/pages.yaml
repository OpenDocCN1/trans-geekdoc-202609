  md: '# 12 Authenticated Encryption & AEAD


    Disclaimer: This chapter is in rough draft stage.


    It can be helpful to think of encryption as providing a secure *logical channel*
    between two users who only have access to an insecure *physical channel*. Below
    are a few things that an attacker might do to the insecure physical channel:


    +   - An attacker may **passively eavesdrop**; *i.e.*, simply observe the channel.
    A CPA-secure encryption scheme provides **confidentiality** and prevents the attacker
    from learning anything by eavesdropping.

    +   - An attacker may **drop** messages sent along the channel, resulting in a
    denial of service. If the attacker can do this on the underlying physical channel,
    then it cannot be overcome through cryptography.

    +   - An attacker may try to **modify** messages that are sent along the channel,
    by tampering with their ciphertexts. This sounds like what CCA-secure encryption
    protects against, right?

    +   - An attacker may try to **inject** new messages into the channel. If successful,
    Bob might receive a message and mistake it for something that Alice meant to send.
    Does CCA security protect against this? If it is indeed possible to inject new
    messages into the channel, then an attacker can delete Alice''s ciphertexts and
    replace them with their own. This would seem to fall under the category of “modifying”
    messages on the channel, so message-injection and message-modification are somewhat
    connected.

    +   - An attacker may try to **replay** messages that were sent. For example,
    if Bob was convinced that a ciphertext c came from Alice, then an attacker can
    re-send the same c many times, and Bob may interpret this as Alice wanting to
    re-send the same plaintext many times. Does CCA security protect against this?


    Although it might seem that CCA-secure encryption guarantees protection against
    many of these kinds of attacks, it does not!


    To see why, consider the SRP-based encryption scheme of Construction 9.3. We proved
    that this scheme has CCA security. However, it never raises any errors during
    decryption. Every ciphertext is interpreted as a valid encryption of *some* plaintext.
    An attacker can choose an arbitrary ciphertext, and when Bob decrypts it he might
    think Alice was trying to send some (presumably garbled) message. The only thing
    that CCA security guarantees is that **if** an attacker is able to make a ciphertext
    that decrypts without error, then it must decrypt to something that is unrelated
    to the contents of other ciphertexts.'
