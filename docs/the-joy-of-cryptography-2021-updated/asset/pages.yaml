  md: '# Block Cipher Modes of Operation


    One of the drawbacks of the previous CPA-secure encryption scheme is that its
    ciphertexts are \(\lambda\) bits longer than its plaintexts. In the common case
    that we are using a block cipher with blocklength \(blen = \lambda\), this means
    that ciphertexts are **twice as long** as plaintexts. Is there any way to encrypt
    data (especially lots of it) without requiring such a significant overhead?


    A **block cipher mode** refers to a way to use a block cipher to efficiently encrypt
    a large amount of data (more than a single block). In this chapter, we will see
    the most common modes for CPA-secure encryption of long plaintexts.


    # 8.1 A Tour of Common Modes


    As usual, \(blen\) will denote the blocklength of a block cipher \(F\). In our
    diagrams, we''ll write \(F_k\) as shorthand for \(F(k, \cdot)\). When \(m\) is
    the plaintext, we will write \(m = m_1||m_2||\cdots||m_\ell\), where each \(m_i\)
    is a single block (so \(\ell\) is the length of the plaintext measured in blocks).
    For now, we will assume that \(m\) is an exact multiple of the block length.


    # ECB: Electronic Codebook (**NEVER NEVER USE THIS! NEVER!!**)


    The most obvious way to use a block cipher to encrypt a long message is to just
    apply the block cipher independently to each block. The only reason to know about
    this mode is to know never to use it (and to publicly shame anyone who does).
    It can''t be said enough times: **never use ECB mode!** It does not provide security
    of encryption; can you see why?


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_154_0.png)'
