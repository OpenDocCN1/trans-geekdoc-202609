- pgno: 159
  md: 'In the exercises, you are asked to prove that, with respect to these updated
    security definitions, CPA$ security implies CPA security as before.


    # Don’t Take Length-Leaking for Granted!


    We have just gone from requiring encryption to leak *no partial information* to
    casually allowing some specific information to leak. Let us not be too hasty about
    this!


    If we want to truly support plaintexts of *arbitrary* length, then leaking the
    length is in fact unavoidable. But “unavoidable” doesn’t mean “free of consequences.”
    By observing only the length of encrypted network traffic, many serious attacks
    are possible. Here are several examples:


    +   - When accessing Google maps, your browser receives many image tiles that
    comprise the map that you see. Each image tile has the same pixel dimensions.
    However, they are compressed to save resources, and not all images compress as
    significantly as others. Every region of the world has its own rather unique “fingerprint”
    of image-tile lengths. So even though traffic to and from Google maps is encrypted,
    the sizes of the image tiles are leaked. This can indeed be used to determine
    the region for which a user is requesting a map.² The same idea applies to auto-complete
    suggestions in a search form.


    +   - Variable-bit-rate (VBR) encoding is a common technique in audio/video encoding.
    When the data stream is carrying less information (*e.g*., a scene with a fixed
    camera position, or a quiet section of audio), it is encoded at a lower bit rate,
    meaning that each unit of time is encoded in fewer bits. In an encrypted video
    stream, the changes in bit rate are reflected as changes in packet length. When
    a user is watching a movie on Netflix or a Youtube video (as opposed to a live
    event stream), the bit-rate changes are consistent and predictable. It is therefore
    rather straight-forward to determine which video is being watched, even on an
    encrypted connection, just by observing the packet lengths.


    +   - VBR is also used in many encrypted voice chat programs. Attacks on these
    tools have been increasing in sophistication. The first attacks on encrypted voice
    programs showed how to identify who was speaking (from a set of candidates), just
    by observing the stream of ciphertext sizes. Later attacks could determine the
    language being spoken. Eventually, when combined with sophisticated linguistic
    models, it was shown possible to even identify individual words to some extent!


    It’s worth emphasizing again that none of these attacks involve any attempt to
    break the encryption. The attacks rely solely on the fact that encryption leaks
    the length of the plaintexts.


