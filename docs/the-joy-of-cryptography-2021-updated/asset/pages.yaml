  md: "Example Using LEARNLASTBYTE to learn the last byte of a plaintext block:\n\n\
    ```\n... a0 42 ??        m = unknown plaintext block\n... 00 00 b         b =\
    \ byte that causes oracle to return true\n= ... a0 42 01      valid padding <=>\
    \ b ⊕ ?? = 01\n                    <=> ?? = 01 ⊕ b\n```\n\nFor the other case,\
    \ suppose the second-to-last byte of m is zero. Then m ⊕ b will have valid padding\
    \ for several candidate values of b:\n\nExample Using LEARNLASTBYTE to learn the\
    \ last byte of a plaintext block:\n\n```\n... a0 00 ??        ... a0 00 ??   \
    \    m = unknown plaintext\n... 00 00 b1        ... 00 00 b2       bi = candidate\
    \ bytes\n= ... a0 00 01      = ... a0 00 02     two candidates cause oracle to\
    \ return true\n  |                   |\n  v                   v\n... a0 00 ??\
    \        ... a0 00 ??\n... 00 01 b1        ... 00 01 b2       same b1, b2, but\
    \ change next-to-last byte\n= ... a0 01 01      = ... a0 01 02     only one causes\
    \ oracle to return true\n                    => ?? = b1 ⊕ 01\n```\n\nWhenever\
    \ more than one candidate b value yields valid padding, we know that the second-to-last\
    \ byte of m is zero (in fact, by counting the number of successful candidates,\
    \ we can know exactly how many zeroes precede the last byte of m).\n\nIf the second-to-last\
    \ byte of m is zero, then the second-to-last byte of m ⊕ 01 b is nonzero. The\
    \ only way for both strings m ⊕ 01 b and m ⊕ b to have valid padding is when m\
    \ ⊕ b ends in byte 01. We can re-try all of the successful candidate b values\
    \ again, this time with an extra nonzero byte in front. There will be a unique\
    \ candidate b that is successful in both rounds, and this will tell us that the\
    \ last byte of m is b ⊕ 01.\n\nThe overall approach for learning the last byte\
    \ of a plaintext block is summarized in the LEARNLASTBYTE subroutine in Figure\
    \ 9.1. The set B contains the successful candidate bytes from the first round.\
    \ There are at most 16 elements in B after the first round, since there are only\
    \ 16 valid possibilities for the last byte of a properly padded block. In the\
    \ worst case, LEARNLASTBYTE makes 256 + 16 = 272 calls to the padding oracle (via\
    \ checkxor).\n\n# Learning Other Bytes of a Block\n\nOnce we have learned one\
    \ of the trailing bytes of a plaintext block, it is slightly easier to learn additional\
    \ ones. Suppose we know the last 3 bytes of a plaintext block, as in the example\
    \ below. We would like to use the padding oracle to discover the 4th-to-last byte."
