- pgno: 67
  md: '**Theorem 3.9** (Interp mod p) Let $p$ be a prime, and let $\{(x_1, y_1), \dots,
    (x_{d+1}, y_{d+1})\} \subseteq (\mathbb{Z}_p)^2$ be a set of points whose $x_i$
    values are all distinct. Then there is a **unique** degree-$d$ polynomial $f$
    with coefficients from $\mathbb{Z}_p$ that satisfies $y_i \equiv_p f(x_i)$ for
    all $i$.


    The proof is the same as the one for Theorem 3.8, if you interpret all arithmetic
    modulo $p$. Addition, subtraction, and multiplication mod $p$ are straight forward;
    the only non-trivial question is how to interpret “division mod $p$,” which is
    necessary in the definition of the $\ell_j$ polynomials. For now, just accept
    that you can always “divide” mod $p$ (except by zero) when $p$ is a prime. If
    you are interested in how division mod $p$ works, look ahead to Chapter 13.


    We can also generalize the observation that $d + 1$ points uniquely determine
    a degree-$d$ polynomial. It turns out that:


    For any $k$ points, there are exactly $p^{d+1-k}$ polynomials of degree-$d$ that
    hit those points, mod $p$.


    Note how when $k = d + 1$, the statement says that there is just a single polynomial
    hitting the points.


    **Corollary 3.10** (# of polys) Let $\mathcal{P} = \{(x_1, y_1), \dots, (x_k,
    y_k)\} \subseteq (\mathbb{Z}_p)^2$ be a set of points whose $x_i$ values are distinct.
    Let $d$ satisfy $k \le d + 1$ and $p > d$. Then the number of degree-$d$ polynomials
    $f$ with coefficients in $\mathbb{Z}_p$ that satisfy the condition $y_i \equiv_p
    f(x_i)$ for all $i$ is exactly $p^{d+1-k}$.


    **Proof** The proof is by induction on the value $d + 1 - k$. The base case is
    when $d + 1 - k = 0$. Then we have $k = d + 1$ distinct points, and Theorem 3.9
    says that there is a unique polynomial satisfying the condition. Since $p^{d+1-k}
    = p^0 = 1$, the base case is true.


    For the inductive case, we have $k \le d$ points in $\mathcal{P}$. Let $x^* \in
    \mathbb{Z}_p$ be a value that does not appear as one of the $x_i$’s. Every polynomial
    must give some value when evaluated at $x^*$. So,


    [# of degree-$d$ polynomials passing through points in $\mathcal{P}$]

    = $\sum_{y^* \in \mathbb{Z}_p}$ [# of degree-$d$ polynomials passing through points
    in $\mathcal{P} \cup \{(x^*, y^*)\}$]

    $(\star)$ $\sum_{y^* \in \mathbb{Z}_p} p^{d+1-(k+1)}$

    = $p \cdot (p^{d+1-k-1}) = p^{d+1-k}$


    The equality marked ($\star$) follows from the inductive hypothesis, since each
    of the terms involves a polynomial passing through a specified set of $k + 1$
    points with distinct $x$-coordinates.'
