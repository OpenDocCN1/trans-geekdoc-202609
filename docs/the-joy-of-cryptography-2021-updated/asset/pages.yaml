- pgno: 1
  md: '# Preface


    *The Joy of Cryptography* is an undergraduate textbook in cryptography. This book
    evolved from lecture notes I developed for the cs427 course at Oregon State University
    (and before that, cs473 at the University of Montana).


    Yes, I know that the title is ridiculous. All of the serious titles were already
    taken. I hope you understand that **actual joy is not guaranteed.**


    # What Is This Book About?


    This book is about the **fundamentals of provable security**.


    +   * **Security**: Cryptography is about controlling access to information. We
    break apart the nebulous concept of “security” into more specific goals: confidentiality,
    authenticity, integrity.


    +   * **Provable**: We can formally define what it means to be secure, and then
    mathematically *prove* claims about security. One prominent theme in the book
    is the logic of composing building blocks together in secure ways.


    +   * **Fundamentals**: This is an introductory book on the subject that covers
    the basics. After completing this course, you will have a solid theoretical foundation
    that you can apply to most real-world situations. You will also be equipped to
    study more advanced topics in cryptography.


    This book is not a handbook telling you which cryptographic algorithm to use in
    every situation, nor a guide for securely implementing production-ready cryptographic
    libraries. We do not discuss specific cryptographic software (e.g., PGP, Tor,
    Signal, TrueCrypt) or cryptocurrencies like Bitcoin. You won’t learn how to become
    a hacker by reading this book.


    # Who Is This Book For?


    This book is for anyone who might need to secure information with cryptography,
    and who is curious about what makes some things “secure” (and what makes other
    things insecure). I don’t imagine that most readers of this book will develop
    their own novel cryptography (e.g., designing new block ciphers), but they will
    be far more likely to use and combine cryptographic building blocks — thus our
    focus on the logic of composition.'
