    they verify signatures provided by the attacker (versig). If the attacker can
    generate a message-signature pair $(m, \sigma)$ that (1) verifies correctly, but
    (2) was not generated previously by the library itself, then versig from the $\mathcal{L}_{\text{sig-real}}$
    library will return true, while the $\mathcal{L}_{\text{sig-fake}}$ library would
    return false. By asking for the libraries to be indistinguishable, we are really
    asking that the attacker cannot find any such message-signature pair (forgery).


    The main difference to the MAC definition is that, unlike for the MAC setting,
    we intend to make a verification key public. The library can run $(vk, sk) \leftarrow
    \text{KeyGen}$, but these values remain private by default. To make $vk$ public,
    we explicitly provide an accessor $\text{getvk}$ to the attacker.


    # “Textbook” RSA Signatures


    Signatures have an asymmetry: everyone should be able to verify a signature, but
    only the holder of the signing key should be able to generate a valid signature.
    The RSA function has a similar asymmetry: if $N$ and $e$ are public, then anyone
    can raise things to the $e$ power, but only someone with $d$ can raise things
    to the $d$ power.


    This similarity suggests that we can use RSA for signatures in the following way:


    +   - The verification key is $(N, e)$ and the signing key is $(N, d)$, where
    these values have the appropriate RSA relationship.

    +   - A signature of message $m$ (here $m$ is an element of $\mathbb{Z}_N$) is
    the value $\sigma = m^d \% N$. Intuitively, only someone with the signing key
    can generate this value for a given $m$.

    +   - To verify a signature $\sigma$ on a message $m$, our goal is to check whether
    $\sigma \equiv_N m^d$. However, we are given only $N$ and $e$, not $d$. Consider
    raising both sides of this equation to the $e$ power:

    +     $$

    +     \sigma^e \equiv_N (m^d)^e \equiv_N m

    +     $$


    The second equality is from the standard RSA property. Now this check can be done
    given only the public information $N$ and $e$.


    A formal description of this scheme is given below:


    ```

    Construction 13.7 (Textbook RSA)

    The key generation algorithm is not listed here, but $N, e, d$ are generated in
    the usual way for RSA. The signing key is $sk = (N, d)$ and the verification key
    is $vk = (N, e)$.


    $$

    \begin{aligned}

    \text{Sign}(sk = (N, d), m): \\

    \quad \text{return } m^d \% N \\

    \[10pt]

    \text{Ver}(vk = (N, e), m, \sigma): \\

    \quad m'' := \sigma^e \% N \\

    \quad \text{return } m \stackrel{?}{=} m''

    \end{aligned}

    $$

    ```


    Unfortunately, textbook RSA signatures are useful only as a first intuition. They
    are **not secure!** A simple attack is the following:


    Suppose an attacker knows the verification key $(N, e)$ and sees a valid signature
    $\sigma \equiv_N m^d$ for some message $m$. Then $\sigma^2$ is also a valid signature
    for the message $m^2$, since:

    $$

    \sigma^2 \equiv_n (m^d)^2 = (m^2)^d

    $$'
