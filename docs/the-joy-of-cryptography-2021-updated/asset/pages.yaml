  md: '# 13 RSA & Digital Signatures


    RSA was among the first public-key cryptography developed. It was first described
    in 1978, and is named after its creators, Ron Rivest, Adi Shamir, and Len Adleman.¹
    RSA can be used as a building block for public-key encryption and digital signatures.
    In this chapter we discuss only the application of RSA for digital signatures.


    # 13.1 “Dividing” Mod n


