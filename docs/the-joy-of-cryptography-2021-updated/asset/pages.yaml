    # About the cover


    The cover design consists of assorted shell illustrations from *Bibliothèque conchyliologique*,
    published in 1846. The images are no longer under copyright, and were obtained
    from the Biodiversity Heritage Library (http://biodiversitylibrary.org/bibliography/11590).


    Why shells? Just like a properly deployed cryptographic primitive, a properly
    deployed shell is the most robust line of defense for a mollusk. To an uninformed
    observer, a shell is just a shell. However, there are many kinds of shells, each
    of which provides protection against a different kind of attack. The same is true
    of the cryptographic building blocks we study in this course.'
