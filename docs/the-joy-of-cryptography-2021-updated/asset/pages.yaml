- pgno: 109
  md: 'Alice & Bob can protect against such a key compromise by using the PRG-feedback
    stream cipher to constantly “update” their shared key. Suppose they do the following,
    starting with their shared key k:


    +   - They use k to seed a chain of length-doubling PRGs, and both obtain the
    same stream of pseudorandom keys t1, t2, ...


    +   - They use ti as a key to send/receive the ith message. The details of the
    encryption are not relevant to this example.


    +   - After making a call to the PRG, they erase the PRG input from memory, and
    only remember the PRG’s output. After using ti to send/receive a message, they
    also erase it from memory.


    This way of using and forgetting a sequence of keys is called a **symmetric ratchet**.


    Construction 5.9 (Symm Ratchet)


    ```

    s0 = k

    for i = 1 to ∞:

    si || ti := G(si-1)

    erase si-1 from memory

    use ti to encrypt/decrypt the ith message

    erase ti from memory

    ```


    [Diagram illustrating the ratchet structure with G blocks and arrows]


    Suppose that an attacker compromises Bob’s device after n ciphertexts have been
    sent. The only value residing in memory is sn, which the attacker learns. Since
    G is deterministic, the attacker can now compute tn+1, tn+2, ... in the usual
    way and decrypt all future ciphertexts that are sent.


    However, we can show that the attacker learns no information about t1, ..., tn
    from sn, which implies that the previous ciphertexts remain safe. By compromising
    the key sn, the adversary only compromises the security of future messages, but
    not past messages. Sometimes this property is called **forward secrecy**, meaning
    that messages in the present are protected against a key-compromise that happens
    in the future.


    This construction is called a **ratchet**, since it is easy to advance the key
    sequence in the forward direction (from sn to sn+1) but hard to reverse it (from
    sn+1 to sn). The exercises explore the problem of explicitly reversing the ratchet,
    but the more relevant property for us is whether the attacker learns anything
    about the ciphertexts that were generated before the compromise.


    Claim 5.10 If the symmetric ratchet (Construction 5.9) is used with a secure PRG
    G and an encryption scheme Σ that has uniform ciphertexts (and Σ.K = {0, 1}λ),
    then the first n ciphertexts are pseudorandom, even to an eavesdropper who compromises
    the key sn.


    Proof We are considering an attack scenario in which n plaintexts are encrypted,
    and the adversary sees their ciphertexts as well as the ratchet-key sn. This situation
    is captured by the following library:'
