  md: 'the input from the output. We call it a compression function because it “compresses”
    its input by $t$ bits (analogous to how a pseudorandom generator “stretches” its
    input by some amount).


    The following construction is one way to build a full-fledged hash function (supporting
    inputs of arbitrary length) out of such a compression function:


    **Construction 11.2 (Merkle-Damgård)**

    Let $h : \{0, 1\}^{n+t} \to \{0, 1\}^n$ be a compression function. Then the **Merkle-Damgård
    transformation** of $h$ is $\text{MD}_h : \{0, 1\}^* \to \{0, 1\}^n$, where:


    \(\underline{\text{MDPAD}_t(x)}\)

    \(\ell := |x|\), as length-$t$ binary number

    while $|x|$ not a multiple of $t$:

    $x := x \parallel 0$

    return $x \parallel \ell$


    \(\underline{\text{MD}_h(x):}\)

    $x_1 \parallel \cdots \parallel x_{k+1} := \text{MDPAD}_t(x)$

    // each $x_i$ is $t$ bits

    $y_0 := 0^n$

    for $i = 1$ to $k + 1$:

    $y_i := h(y_{i-1} \parallel x_i)$

    output $y_{k+1}$


    [Diagram illustrating the iterative hashing of blocks $x_1, \dots, x_k, |x|$ using
    compression function $h$ to produce $\text{MD}_h(x)$]


    The idea of the Merkle-Damgård construction is to split the input $x$ into blocks
    of size $t$. The end of the string is filled out with 0s if necessary. A final
    block called the “padding block” is added, which encodes the (original) length
    of $x$ in binary.


    # Example


    Suppose we have a compression function $h : \{0, 1\}^{48} \to \{0, 1\}^{32}$,
    so that $t = 16$. We build a Merkle-Damgård hash function out of this compression
    function and wish to compute the hash of the following 5-byte (40-bit) string:


    ```

    $x = 01100011 \ 11001101 \ 01000011 \ 10010111 \ 01010000$

    ```


    We must first pad $x$ appropriately ($\text{MDPAD}(x)$):


    +   ▶ Since $x$ is not a multiple of $t = 16$ bits, we need to add 8 bits to make
    it so.


    +   ▶ Since $|x| = 40$, we need to add an extra 16-bit block that encodes the
    number 40 in binary (101000).


    After this padding, and splitting the result into blocks of length 16, we have
    the following:


    ```

    $01100011 \ 11001101 \quad 01000011 \ 10010111 \quad 01010000 \ 00000000 \quad
    00000000 \ 00101000$

    \(\underbrace{\qquad}_{x_1} \quad \underbrace{\qquad}_{x_2} \quad \underbrace{\qquad}_{x_3}
    \quad \underbrace{\qquad}_{x_4}\)

    ```


