- pgno: 172
  md: '# 9 Chosen Ciphertext Attacks


    In this chapter we discuss the limitations of the CPA security definition. In
    short, the CPA security definition considers only the information leaked to the
    adversary by honestly-generated ciphertexts. It does not, however, consider what
    happens when an adversary is allowed to inject its own maliciously crafted ciphertexts
    into an honest system. If that happens, then even a CPA-secure encryption scheme
    can fail in spectacular ways. We begin by seeing such an example of spectacular
    and surprising failure, called a padding oracle attack:


    # 9.1 Padding Oracle Attacks


    Imagine a webserver that receives CBC-encrypted ciphertexts for processing. When
    receiving a ciphertext, the webserver decrypts it under the appropriate key and
    then checks whether the plaintext has valid X.923 padding (Section 8.4).


    Importantly, suppose that the observable behavior of the webserver changes depending
    on whether the padding is valid. You can imagine that the webserver gives a special
    error message in the case of invalid padding. Or, even more cleverly (but still
    realistic), the difference in response time when processing a ciphertext with
    invalid padding is enough to allow the attack to work.1 The mechanism for learning
    padding validity is not important — what is important is simply the fact that
    an attacker has some way to determine whether a ciphertext encodes a plaintext
    with valid padding. No matter how the attacker comes by this information, we say
    that the attacker has access to a padding oracle, which gives the same information
    as the following subroutine:


    ```

    PADDINGORACLE(c):

    m := Dec(k, c)

    return VALIDPAD(m)

    ```


    We call this a padding oracle because it answers only one specific kind of question
    about the input. In this case, the answer that it gives is always a single boolean
    value.


    It does not seem like a padding oracle is leaking useful information, and that
    there is no cause for concern. Surprisingly, we can show that an attacker who
    doesn''t know the encryption key k can use a padding oracle alone to decrypt any
    ciphertext of its choice! This is true no matter what else the webserver does.
    As long as it leaks this one bit of information on ciphertexts that the attacker
    can choose, it might as well be leaking everything.


    1 For this reason, it is necessary to write the unpadding algorithm so that every
    execution path through the subroutine takes the same number of CPU cycles.'
