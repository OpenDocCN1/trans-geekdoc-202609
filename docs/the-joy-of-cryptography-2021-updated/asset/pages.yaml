  md: '# ★ 10.2 A PRF is a MAC


    The definition of a PRF says (more or less) that even if you''ve seen the output
    of the PRF on several chosen inputs, all other outputs look independently & uniformly
    random. Furthermore, uniformly chosen values are hard to guess, as long as they
    are sufficiently long (e.g., $\lambda$ bits).


    In other words, after seeing some outputs of a PRF, any other PRF output will
    be hard to guess. This is exactly the intuitive property we require from a MAC.
    And indeed, we will prove in this section that a PRF is a secure MAC. While the
    claim makes intuitive sense, proving it formally is a little tedious. This is
    due to the fact that that in the MAC security game, the adversary can make many
    verification queries $\text{CHECKTAG}(m, t)$ before asking to see the correct
    MAC of \(m\). Dealing with this event is the source of all the technical difficulty
    in the proof.


    We start with a technical claim that captures the idea that "if you can blindly
    guess at uniformly chosen values and can also ask to see the values, then it is
    hard to guess a random value before you have seen it."


    Claim 10.3 _The following two libraries are indistinguishable:_


    | $\mathcal{L}_{\text{guess-L}}$ | $\mathcal{L}_{\text{guess-R}}$ |

    | :--- | :--- |

    | `T := empty assoc. array`<br>`GUESS(m ∈ {0, 1}^in, g ∈ {0, 1}^λ):`<br>`  if
    T[m] undefined:`<br>`    T[m] ← {0, 1}^λ`<br>`    return g ?= T[m]`<br>`REVEAL(m
    ∈ {0, 1}^in):`<br>`  if T[m] undefined:`<br>`    T[m] ← {0, 1}^λ`<br>`  return
    T[m]` | `T := empty assoc. array`<br>`GUESS(m ∈ {0, 1}^in, g ∈ {0, 1}^λ):`<br>`  //
    returns false if T[m] undefined`<br>`  return g ?= T[m]`<br>`REVEAL(m ∈ {0, 1}^in):`<br>`  if
    T[m] undefined:`<br>`    T[m] ← {0, 1}^λ`<br>`  return T[m]` |


    Both libraries maintain an associative array \(T\) whose values are sampled uniformly
    the first time they are needed. Calling programs can try to guess these values
    via the GUESS subroutine, or simply learn them via REVEAL. Note that the calling
    program can call GUESS\((m, \cdot)\) both before and after calling REVEAL\((m)\).


    Intuitively, since the values in \(T\) are \(\lambda\) bits long, it should be
    hard to guess \(T[m]\) before calling REVEAL\((m)\). That is exactly what we formalize
    in \(\mathcal{L}_{\text{guess-R}}\). In fact, this library doesn''t bother to
    even choose \(T[m]\) until REVEAL\((m)\) is called. All calls to GUESS\((m, \cdot)\)
    made before the first call to REVEAL\((m)\) will return false.


    Proof Let \(q\) be the number of queries that the calling program makes to GUESS.
    We will show that the libraries are indistinguishable with a hybrid sequence of
    the form:


    $\mathcal{L}_{\text{guess-L}} \equiv \mathcal{L}_{\text{hyb-0}} \approx \mathcal{L}_{\text{hyb-1}}
    \approx \cdots \approx \mathcal{L}_{\text{hyb-q}} \equiv \mathcal{L}_{\text{guess-R}}$'
