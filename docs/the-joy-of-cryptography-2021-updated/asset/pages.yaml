  md: "# ## 5.5 Applications: Stream Cipher & Symmetric Ratchet\n\nThe PRG-feedback\
    \ construction can be generalized in a natural way, by continuing to feed part\
    \ of G’s output into G again. The proof works in the same way as for the previous\
    \ construction — the security of G is applied one at a time to each application\
    \ of G.\n\n**Claim 5.7** If G is a secure length-doubling PRG, then for any n\
    \ (polynomial function of \\(\\lambda\\)) the following construction H_n is a\
    \ secure PRG with stretch n\\(\\lambda\\) :\n\n```\nH_n(s):\ns_0 := s\nfor i =\
    \ 1 to n:\n  s_i || t_i := G(s_{i-1})\nreturn t_1 || ... || t_n || s_n\n```\n\n\
    The fact that this chain of PRGs can be extended indefinitely gives another useful\
    \ functionality:\n\n**Definition 5.8** (Stream cipher) A **stream cipher** is\
    \ an algorithm G that takes a seed s and length \\(\\ell\\) as input, and outputs\
    \ a string. It should satisfy the following requirements:\n\n+   1. \\(G(s, \\\
    ell)\\) is a string of length \\(\\ell\\).\n+   2. If \\(i < j\\), then G(s, i)\
    \ is a prefix of G(s, j).\n+   3. For each n, the function \\(G(\\cdot, n)\\)\
    \ is a secure PRG.\n\nBecause of the 2nd rule, you might want to think about a\
    \ single infinitely long string that is the limit of G(s, n) as n goes to infinity.\
    \ The finite-length strings G(s, n) are all the prefixes of this infinitely long\
    \ string.\n\nThe PRG-feedback construction can be used to construct a secure stream\
    \ cipher in the natural way: given seed s and length \\(\\ell\\), keep iterating\
    \ the PRG-feedback main loop until \\(\\ell\\) bits have been generated.\n\n![](img/da79fa21b263fe549aecaabd2a0a41c8_108_0.png)\n\
    \n# ### Symmetric Ratchet\n\nSuppose Alice & Bob share a symmetric key k and are\
    \ using a secure messaging app to exchange messages over a long period of time.\
    \ Later in the course we will see techniques that Alice & Bob could use to securely\
    \ encrypt many messages using a single key. However, suppose Bob’s device is compromised\
    \ and an attacker learns k. Then the attacker can decrypt all past, present, and\
    \ future ciphertexts that it saw!"
