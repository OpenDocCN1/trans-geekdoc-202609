    # ## 2.4 How to Prove Security with The Hybrid Technique


    We proved that one-time pad satisfies the uniform ciphertexts property (Claim
    1.3) by carefully calculating certain probabilities. This will not be a sustainable
    strategy as things get more complicated later in the course. In this section we
    will introduce a technique for proving security properties, which usually avoids
    tedious probability calculations.


    # ### Chaining Several Components


    Before getting to a security proof, we introduce a convenient lemma. Consider
    a compound program like \(\mathcal{A} \diamond \mathcal{L}_1 \diamond \mathcal{L}_2\).
    Our convention is that subroutine calls only happen from left to right across
    the \(\diamond\) symbol, so in this example, \(\mathcal{L}_1\) can make calls
    to subroutines in \(\mathcal{L}_2\), but not vice-versa. Depending on the context,
    it can sometimes be convenient to interpret \(\mathcal{A} \diamond \mathcal{L}_1
    \diamond \mathcal{L}_2\) as:


    +   - (\(\mathcal{A} \diamond \mathcal{L}_1) \diamond \mathcal{L}_2\): a **compound
    calling program** linked to \(\mathcal{L}_2\). After all, \(\mathcal{A} \diamond
    \mathcal{L}_1\) is a program that makes calls to the interface of \(\mathcal{L}_2\).

    +   - or: \(\mathcal{A} \diamond (\mathcal{L}_1 \diamond \mathcal{L}_2)\): \(\mathcal{A}\)
    linked to a **compound library**. After all, \(\mathcal{A}\) is a program that
    makes calls to the interface of (\(\mathcal{L}_1 \diamond \mathcal{L}_2\)).


    The placement of the parentheses does not affect the functionality of the overall
    program, just like how splitting up a real program into different source files
    doesn''t affect its functionality.'
