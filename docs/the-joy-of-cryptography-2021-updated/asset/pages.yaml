    =\left|\begin{aligned} &p^* \left( \Pr[\mathcal{A} \diamond \mathcal{L}_{left}
    \Rightarrow 1 \mid \mathcal{B}_{left}] - \Pr[\mathcal{A} \diamond \mathcal{L}_{right}
    \Rightarrow 1 \mid \mathcal{B}_{right}] \right) \\ &(1 - p^*) \left( \Pr[\mathcal{A}
    \diamond \mathcal{L}_{left} \Rightarrow 1 \mid \overline{\mathcal{B}_{left}}]
    - \Pr[\mathcal{A} \diamond \mathcal{L}_{right} \Rightarrow 1 \mid \overline{\mathcal{B}_{right}}]
    \right) \end{aligned}\right|


    In both of the expressions \(\Pr[\mathcal{A} \diamond \mathcal{L}_{left} \Rightarrow
    1 \mid \overline{\mathcal{B}_{left}}]\) and \(\Pr[\mathcal{A} \diamond \mathcal{L}_{right}
    \Rightarrow 1 \mid \overline{\mathcal{B}_{right}}]\), we are conditioning on bad
    never being set to 0. In this case, both libraries are executing the same sequence
    of instructions, so the probabilities are equal (and the difference of the probabilities
    is zero). Substituting in, we get:


    advantage_\mathcal{A} = p^* \left| \Pr[\mathcal{A} \diamond \mathcal{L}_{left}
    \Rightarrow 1 \mid \mathcal{B}_{left}] - \Pr[\mathcal{A} \diamond \mathcal{L}_{right}
    \Rightarrow 1 \mid \mathcal{B}_{right}] \right|


    Intuitively, the proof is confirming the idea that differences can only be noticed
    between \(\mathcal{L}_{left}\) and \(\mathcal{L}_{right}\) when bad is set to
    1 (corresponding to our conditioning on \(\mathcal{B}_{left}\) and \(\mathcal{B}_{right}\)).


    The quantity within the absolute value is the difference of two probabilities,
    so the largest it can be is 1. Therefore,


    advantage_\mathcal{A} \leq^* p^* \stackrel{\text{def}}{=} \Pr[\mathcal{B}_{left}]
    = \Pr[\mathcal{A} \diamond \mathcal{L}_{left} \text{ sets bad } = 1].


    This completes the proof.


