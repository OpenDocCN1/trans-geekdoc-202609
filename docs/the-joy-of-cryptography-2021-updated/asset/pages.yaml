    # The Birthday Problem in Terms of Indistinguishable Libraries


    Below are two libraries which will also be useful for future topics.


    ```

    \(\mathcal{L}_{\text{samp-L}}\) \\ $\text{SAMP}():$ \\ $r \leftarrow \{0, 1\}^\lambda$
    \\ return $r$

    ```


    ```

    \(\mathcal{L}_{\text{samp-R}}\) \\ $R := \emptyset$ \\ $\text{SAMP}():$ \\ $r
    \leftarrow \{0, 1\}^\lambda \setminus R$ \\ $R := R \cup \{r\}$ \\ return $r$

    ```


    Both libraries provide a SAMP subroutine that samples a random element of $\{0,
    1\}^\lambda$. The implementation in $\mathcal{L}_{\text{samp-L}}$ samples uniformly
    and independently from $\{0, 1\}^\lambda$ each time. It samples **with replacement**,
    so it is possible (although maybe unlikely) for multiple calls to SAMP to return
    the same value in $\mathcal{L}_{\text{samp-L}}$.


    On the other hand, $\mathcal{L}_{\text{samp-R}}$ samples $\lambda$-bit strings
    **without replacement**. It keeps track of a set $R$, containing all the values
    it has previously sampled, and avoids choosing them again ("$\{0, 1\}^\lambda
    \setminus R$" is the set of $\lambda$-bit strings excluding the ones in $R$).
    In this library, SAMP will never output the same value twice.'
