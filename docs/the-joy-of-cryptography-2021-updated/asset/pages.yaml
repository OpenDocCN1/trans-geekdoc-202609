    the same thing as “dividing by 2” mod 15.


    The previous examples all used x · 8 (x ÷ 2) where x was an even number. What
    happens when x is an odd number?


    ```

    3 · 8 ≡₁₅ 9 ⇐⇒ “3 ÷ 2 ≡₁₅ 9” ??

    ```


    This might seem non-sensical, but if we make the substitutions 3 ≡₁₅ -12 and 9
    ≡₁₅ -6, then we do indeed get something that makes sense:


    ```

    -12 · 8 ≡₁₅ -6 ⇐⇒ -12 ÷ 2 ≡₁₅ -6

    ```


    This example shows that there is surely some interesting relationship among the
    numbers 2, 8, and 15. It seems reasonable to interpret “multiplication by 8” as
    “division by 2” when working mod 15.


    Is there a way we can do something similar for “division by 3” mod 15? Can we
    find some y where “multiplication by y mod 15” has the same behavior as “division
    by 3 mod 15”? In particular, we would seek a value y that satisfies 3 · y ≡₁₅
    1, but you can check for yourself that no such value of y exists.


    Why can we “divide by 2” mod 15 but we apparently cannot “divide by 3” mod 15?
    We will explore this question in the remainder of this section.


    # Multiplicative Inverses


    We usually don’t directly use the terminology of “division” with modular arithmetic.
    Instead of saying “division by 2”, we say “multiplication by 2⁻¹”, where 2⁻¹ is
    just another name for 8.


    Definition 13.1 (x⁻¹ mod n) The multiplicative inverse of x mod n is the integer
    y that satisfies x · y ≡ₙ 1 (if such a number exists). We usually refer to the
    multiplicative inverse of x as “x⁻¹.”


    Example Continuing to work mod 15, we have:


    +   ► 4⁻¹ ≡₁₅ 4 since 4 · 4 = 16 ≡₁₅ 1. Hence 4 is its own multiplicative inverse!
    You can also understand this as:


    ```

    4⁻¹ = (2²)⁻¹ = (2⁻¹)² ≡₁₅ 8² = 64 ≡₁₅ 4

    ```


    +   ► 7⁻¹ ≡₁₅ 13 since 7 · 13 = 91 ≡₁₅ 1.


    We are interested in which numbers have a multiplicative inverse mod n.


    Definition 13.2 (Z*_n) The multiplicative group modulo n is defined as:


    ```

    Z*_n = {x ∈ Z_n | x has a multiplicative inverse mod n}

    ```


    2 "Group" is a technical term from abstract algebra.'
