  md: '# Padding


    Padding just refers to any approach to encode arbitrary-length data into data
    that is a multiple of the blocklength. The only requirement is that this encoding
    is reversible. More formally, a **padding scheme** should consist of two algorithms:


    +   - pad: takes as input a string of any length, and outputs a string whose length
    is a multiple of the blocklength

    +   - unpad: the inverse of pad. We require that unpad(pad(x)) = x for all strings
    x.


    The idea is that the sender can encrypt pad(x), which is guaranteed to be a multiple
    of the blocklength; the receiver can decrypt and run unpad on the result to obtain
    x.


    In the real world, data almost always comes in **bytes** and not bits, so that
    will be our assumption here. In this section we will write bytes in hex, for example
    `8f`. Typical blocklengths are 128 bits (16 bytes) or 256 bits (32 bytes).


    Here are a few common approaches for padding:


    **Null padding:** The simplest padding approach is to just fill the final block
    with null bytes (`00`). The problem with this approach is that it is not always
    reversible. For example, `pad(31 41 59)` and `pad(31 41 59 00)` will give the
    same result. It is not possible to distinguish between a null byte that was added
    for padding and one that was intentionally the last byte of the data.


    **ANSI X.923 standard:** Data is padded with null bytes, except for the last byte
    of padding which indicates how many padding bytes there are. In essence, the last
    byte of the padded message tells the receiver how many bytes to remove to recover
    the original message.


    Note that in this padding scheme (and indeed in all of them), if the original
    unpadded data is _already_ a multiple of the block length, then **an entire extra
    block of padding** must be added. This is necessary because it is possible for
    the original data to end with some bytes that look like valid padding (e.g., `00
    00 03`), and we do not want these bytes to be removed erroneously.


    Example Below are some examples of valid and invalid X.923 padding (using 16-byte
    blocks):


    +   `01 34 11 d9 81 88 05 57 1d 73 c3 00 00 00 00 00 05 => valid`

    +   `95 51 05 4a d6 5a a3 44 af b3 85 00 00 00 00 03 => valid`

    +   `71 da 77 5a 5e 77 eb a8 73 c5 50 b5 81 d5 96 01 => valid`

    +   `5b 1c 01 41 5d 53 86 4e e4 94 13 e8 7a 89 c4 71 => invalid`

    +   `d4 0d d8 7b 53 24 c6 d1 af 5f d6 f6 00 c0 00 04 => invalid`


    **PKCS#7 standard:** If _b_ bytes of padding are needed, then the data is padded
    not with null bytes but with _b_ bytes. Again, the last byte of the padded message
    tells the receiver how many bytes to remove.'
