  md: '# What Background Is Needed To Understand This Book?


    You will get the most out of this book if you have a solid foundation in standard
    undergraduate computer science material:


    +   ► Discrete mathematics (of the kind you typically find in year 2 or 3 of an
    undergraduate CS program) is **required background**. The book assumes that you
    are familiar with basic modular arithmetic, discrete probabilities, simple combinatorics,
    and especially proof techniques. Chapter 0 contains a brief review of some of
    these topics.


    +   ► Algorithms & data structures background is **highly recommended**, and theory
    of computation (automata, formal languages & computability) is also **recommended**.
    We deal with computations and algorithms at a high level of abstraction, and with
    mathematical rigor. Prior exposure to this style of thinking will be helpful.


    # Why Is Cryptography A Difficult Subject?


    **It''s all the math, right?** Cryptography has a reputation of being a difficult
    subject because of the amount of difficult math, but I think this assessment misses
    the mark. A former victim, I mean student, summed it up bluntly when he shared
    in class (paraphrased):


    > > Some other students were thinking of taking your course but were worried that
    it is really math-heavy. I wouldn''t say that this course is a lot of math exactly.
    It''s somehow even worse!


    Thanks, I think.


    Anyway, many corners of cryptography use math that most CS undergrads would find
    quite advanced (advanced factoring algorithms, elliptic curves, isogenies, even
    algebraic geometry), but these aren''t the focus of this book. Our focus is instead
    on the logic of composing different building blocks together in provably secure
    ways. Yes, you will probably learn some new math in this book — enough to understand
    RSA, for example. And yes, there are plenty of “proofs.” But I honestly believe
    you''ll be fine if you did well in a standard discrete math course. I always tell
    my cs427 students that I''m not expecting them to love math, proofs, and theory
    — I only ask them to choose **not to be scared** of it.


    **If not math, then what?** In an algorithms course, I could introduce and explain
    concepts with concrete examples — here''s what happens step-by-step when I run
    mergesort on this particular array, here''s what happens when I run Dijkstra''s
    algorithm on this particular graph, here are 42 examples of a spanning tree. You
    could study these concrete examples, or even make your own, to develop your understanding
    of the general case.


    Cryptography is different because our main concerns are **higher up the ladder
    of abstraction** than most students are comfortable with.<sup>1</sup> Yes, I can
    illustrate what happens


    <sup>1</sup>Of course, abstraction is the heart of math. I may be making a false
    distinction by saying “it’s not the math, it’s the *abstraction*.” But I think
    there’s something to the distinction between a CS major''s typical math-aversion
    and what is really challenging about cryptography.'
