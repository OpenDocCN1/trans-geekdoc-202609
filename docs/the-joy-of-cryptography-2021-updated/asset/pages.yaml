    \(\begin{aligned} f(\mathbf{x}) &= y_1 \cdot \ell_1(\mathbf{x}) + y_2 \cdot \ell_2(\mathbf{x})
    + y_3 \cdot \ell_3(\mathbf{x}) + y_4 \cdot \ell_4(\mathbf{x}) \\ &= 1 \cdot \ell_1(\mathbf{x})
    + 1 \cdot \ell_2(\mathbf{x}) + 9 \cdot \ell_3(\mathbf{x}) + 6 \cdot \ell_4(\mathbf{x})
    \\ &= \frac{1}{6} \left( \begin{matrix} 1 \cdot ( 3\mathbf{x}^3 - 33\mathbf{x}^2
    + 114\mathbf{x} - 120) \\ + 1 \cdot ( -3\mathbf{x}^3 + 30\mathbf{x}^2 - 93\mathbf{x}
    + 90) \\ + 9 \cdot ( - \mathbf{x}^3 - 9\mathbf{x}^2 + 26\mathbf{x} - 24) \\ +
    6 \cdot ( - \mathbf{x}^3 + 12\mathbf{x}^2 - 47\mathbf{x} + 60) \end{matrix} \right)
    \\ &= \frac{1}{6} \left( 3\mathbf{x}^3 - 12\mathbf{x}^2 - 27\mathbf{x} + 114 \right)
    \\ &= \frac{\mathbf{x}^3}{2} - 2\mathbf{x}^2 - \frac{9\mathbf{x}}{2} + 19 \end{aligned}\)

    ```


    And indeed, \(f\) gives the correct values:


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_66_0.png)


    ```

    \(\begin{aligned} f(x_1) = f(3) &= \frac{3^3}{2} - 2 \cdot 3^2 - \frac{9 \cdot
    3}{2} + 19 = 1 = y_1 \\ f(x_2) = f(4) &= \frac{4^3}{2} - 2 \cdot 4^2 - \frac{9
    \cdot 4}{2} + 19 = 1 = y_2 \\ f(x_3) = f(5) &= \frac{5^3}{2} - 2 \cdot 5^2 - \frac{9
    \cdot 5}{2} + 19 = 9 = y_3 \\ f(x_4) = f(2) &= \frac{2^3}{2} - 2 \cdot 2^2 - \frac{9
    \cdot 2}{2} + 19 = 6 = y_4 \end{aligned}\)

    ```


    # Polynomials mod \(p\)


    We will see a secret-sharing scheme based on polynomials, whose Share algorithm
    must choose a polynomial with uniformly random coefficients. Since we cannot have
    a uniform distribution over the real numbers, we must instead consider polynomials
    with coefficients in \(\mathbb{Z}_p\).


    It is still true that \(d + 1\) points determine a unique degree-\(d\) polynomial
    when working modulo \(p\), if \(p\) is a prime!'
