  md: 'Construction 6.11 (Feistel cipher)

    \[\mathbb{F}_r((k_1, \dots, k_r), v_0||v_1):\]

    for \( i = 1 \) to \( r \):

    \( v_{i+1} := F(k_i, v_i) \oplus v_{i-1} \)

    return \( v_r||v_{r+1} \)


    ...


    \[\mathbb{F}_r^{-1}((k_1, \dots, k_r), v_r||v_{r+1}):\]

    for \( i = r \) downto \( 1 \):

    \( v_{i-1} := F(k_i, v_i) \oplus v_{i+1} \)

    return \( v_0||v_1 \)


    Because each round is invertible (given the appropriate round key), the overall
    Feistel cipher is also invertible. Note that the inverse of the Feistel cipher
    uses inverse Feistel rounds and reverses the order of the key schedule.


    Surprisingly, a 3-round Feistel cipher can actually be secure, although a 2-round
    Feistel cipher is never secure (see the exercises). More precisely: when \( F
    \) is a secure PRF with \( in = out = \lambda \), then using \( F \) as the round
    function of a 3-round Feistel cipher results in a secure PRP. The Feistel cipher
    has blocklength \( 2\lambda \), and it has a key of length \( 3\lambda \) (3 times
    longer than the key for \( F \)). Implicitly, this means that the three round
    keys are chosen independently.


    **Theorem 6.12 (Luby-Rackoff)** If \( F : \{0, 1\}^\lambda \times \{0, 1\}^\lambda
    \to \{0, 1\}^\lambda \) is a secure PRF, then the 3-round Feistel cipher \(\mathbb{F}_3\)
    (Construction 6.11) is a secure PRP.


    Unfortunately, the proof of this theorem is beyond the scope of this book.


    # 6.5 PRFs and Block Ciphers in Practice


    Block ciphers are one of the cornerstones of cryptography in practice today. We
    have shown how (at least in principle) block ciphers can be constructed out of
    simpler primitives: PRGs and PRFs. However, in practice we use block ciphers that
    are designed “from scratch,” and then use these block ciphers to construct simpler
    PRGs and PRFs when we need them.


    We currently have **no proof** that any secure PRP exists. As we discussed in
    Section 5.2, such a proof would resolve the famous P vs NP problem. Without such
    proofs, what is our basis for confidence in the security of block ciphers being
    used today? The process that led to the Advanced Encryption Standard (AES) block
    cipher demonstrates the cryptographic community’s best efforts at instilling such
    confidence.


    The National Institute of Standards & Technology (NIST) sponsored a competition
    to design a block cipher to replace the DES standard from the 1970s. Many teams
    of cryptographers submitted their block cipher designs, all of which were then
    subject to years of intense public scrutiny by the cryptographic research community.
    The designs were evaluated on the basis of their performance and resistance to
    attacks against the PRP security definition (and other attacks). Some designs
    did offer proofs that they resist certain'
