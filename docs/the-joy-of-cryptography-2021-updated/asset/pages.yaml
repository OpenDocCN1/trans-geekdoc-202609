- pgno: 5
  md: 'or FINALIZE step. As a result, all security definitions are expressed as *indistinguishability*
    of two games/libraries, even security definitions that are fundamentally about
    unforgeability. Yet, we can still reason about unforgeability properties within
    this framework. For instance, to say that no adversary can forge a MAC, it suffices
    to say that no adversary can distinguish a MAC-verification subroutine from a
    subroutine that always returns FALSE. An index of security definitions has been
    provided at the end of the book.


    One instance where the approach falls short, however, is in defining collision
    resistance. I have not been able to define it in this framework in a way that
    is both easy to use and easy to interpret (and perhaps I achieved neither in the
    end). See Chapter 11 for my best attempt.


