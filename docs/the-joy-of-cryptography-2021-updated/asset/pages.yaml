  md: "Still, most of our high-level discussion of security properties will be based\
    \ on CPA security. It is the “minimal” (i.e., least restrictive) definition that\
    \ appears to capture our security intuitions.\n\n# Claim 7.3 If an encryption\
    \ scheme has CPA$ security, then it also has CPA security.\n\nProof We want to\
    \ prove that L^Σ_cpa-L ≈ L^Σ_cpa-R using the assumption that L^Σ_cpa$-real ≈ L^Σ_cpa$-rand.\
    \ The sequence of hybrids follows:\n\n```\nL^Σ_cpa-L\nk ← Σ.KeyGen\nEAVESDROP(mL,\
    \ mR):\n  c := Σ.Enc(k, mL)\n  return c\n```\n\nThe starting point is L^Σ_cpa-L,\
    \ as expected.\n\n```\nEAVESDROP(mL, mR):\n  c := CTXT(mL)\n  return c\n◇\nL^Σ_cpa$-real\n\
    k ← Σ.KeyGen\nCTXT(m):\n  c := Σ.Enc(k, m)\n  return c\n```\n\nIt may look strange,\
    \ but we have further factored out the call to Enc into a subroutine. It looks\
    \ like everything from L_cpa-L has been factored out, but actually the original\
    \ library still “makes the choice” of which of mL, mR to encrypt.\n\n```\nEAVESDROP(mL,\
    \ mR):\n  c := CTXT(mL)\n  return c\n◇\nL^Σ_cpa$-rand\nCTXT(m):\n  c ← .C\n  return\
    \ c\n```\n\nWe have replaced L^Σ_cpa$-real with L^Σ_cpa$-rand. By our assumption,\
    \ the change is indistinguishable.\n\n```\nEAVESDROP(mL, mR):\n  c := CTXT(mR)\n\
    \  return c\n◇\nL^Σ_cpa$-rand\nCTXT(m):\n  c ← Σ.C\n  return c\n```\n\nWe have\
    \ changed the argument being passed to CTXT. This has no effect on the library’s\
    \ behavior since CTXT completely ignores its argument in these hybrids.\n\n```\n\
    EAVESDROP(mL, mR):\n  c := CTXT(mR)\n  return c\n◇\nL^Σ_cpa$-real\nk ← Σ.KeyGen\n\
    CTXT(m):\n  c := Σ.Enc(k, m)\n  return c\n```\n\nThe mirror image of a previous\
    \ step; we replace L^Σ_cpa$-rand with L^Σ_cpa$-real."
