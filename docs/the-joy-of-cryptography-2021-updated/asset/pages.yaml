    \ example:\n\n```\nsage: Mod(427, 100)^314159265358979\n63\n```\n\nThis expression\
    \ performs repeated squaring on the object Mod(427, 100). Since a Mod-object's\
    \ operations are all overloaded (to give the answer only mod n), this has the\
    \ result of doing a modular reduction after every squaring and multiplication.\
    \ This expression runs instantaneously, even with very large numbers.\n\n# Security\
    \ Properties & Discussion\n\nRSA is what is called a **trapdoor function**.\n\n\
    +   One user generates the RSA parameters (primarily $N$, $e$, and $d$) and makes\
    \ $N$ and $e$ public, while keeping $d$ private.\n\n+   Functionality properties:\
    \ Given only the public information $N$ and $e$, it is easy to compute the RSA\
    \ function ($x \\mapsto x^e \\% N$). Given the private information ($d$) it clearly\
    \ easy to compute the RSA inverse ($y \\mapsto y^d \\% N$).\n\n+   **Security\
    \ property:** Given only the public information, it should be hard to compute\
    \ the RSA inverse ($y \\mapsto y^d \\% N$) on randomly chosen values. In other\
    \ words, the only person who is able to compute the RSA inverse function is the\
    \ person who generated the RSA parameters."
