  md: 'Note that the calling program provides a single value \( v \) (not a \( v_L
    \) and \( v_R \)). Both libraries use the nonce \( v \) that is given, and this
    implies that the encryption scheme does not need to *hide* \( v \). If something
    is the same between both libraries, then it is not necessary to hide it in order
    to make the libraries indistinguishable.


    If an encryption scheme does not fall into one of these three categories, it cannot
    satisfy our definition of CPA-security. You can and should use deterministic encryption
    as a sanity check against any proposed encryption algorithm.


    # 7.2 Pseudorandom Ciphertexts


    When we introduced one-time security of encryption (in Section 2.2), we had two
    variants of the definition. The more general variant said, roughly, that encryptions
    of \( m_L \) should look like encryptions of \( m_R \). The more specific variant
    said that encryptions of every \( m \) should look uniform.


    We can do something similar for CPA security, by defining a security definition
    that says “encryptions of \( m \) look uniform.” Note that it is not sufficient
    to use the same security libraries from the one-time security definition. It is
    important for the library to allow multiple encryptions under the same key. Just
    because a single encryption is pseudorandom, it doesn’t mean that multiple encryptions
    appear *jointly* pseudorandom. In particular, they may not look *independent*
    (this was an issue we saw when discussing the difficulty of constructing a PRF
    from a PRG).


    Definition 7.2 (CPA$ security) Let \( \Sigma \) be an encryption scheme. We say
    that \( \Sigma \) has **pseudorandom ciphertexts in the presence of chosen-plaintext
    attacks (CPA$ security)** if \( \mathcal{L}^\Sigma_{\text{cpa\$-real}} \approx
    \mathcal{L}^\Sigma_{\text{cpa\$-rand}}\), *where*:


    ```

    ```

    \mathcal{L}^\Sigma_{\text{cpa\$-real}}


    k \leftarrow \Sigma.\text{KeyGen}


    \text{CTXT}(m \in \Sigma.\mathcal{M}):

    c := \Sigma.\text{Enc}(k, m)

    return c

    ```

    ```


    ```

    ```

    \mathcal{L}^\Sigma_{\text{cpa\$-rand}}


    \text{CTXT}(m \in \Sigma.\mathcal{M}):

    c \leftarrow \Sigma.\mathcal{C}

    return c

    ```

    ```


    This definition is also called “IND$ -CPA”, meaning “indistinguishable from random
    under chosen plaintext attacks.” This definition will be useful to use since:


    +   - It is easier to prove CPA$ security than to prove CPA security. Proofs for
    CPA security tend to be about twice as long and twice as repetitive, since they
    involve getting to a “half-way hybrid” and then performing the same sequence of
    hybrids steps in reverse. Taking the proof only to the same half-way point is
    generally enough to prove CPA$ security


    +   - CPA$ security implies CPA security. We show this below, but the main idea
    is the same as in the case of one-time security. If encryptions of all plaintexts
    look uniform, then encryptions of \( m_L \) look like encryptions of \( m_R \).


    +   - Most of the schemes we will consider achieve CPA$ anyway.'
