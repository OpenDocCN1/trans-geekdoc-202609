    # Pseudorandom Ciphertexts


    We can modify/adapt the definition of pseudorandom ciphertexts to public-key encryption
    in a similar way:


    **Definition 15.2** *Let* $\Sigma$ *be a public-key encryption scheme. Then* $\Sigma$
    *has **pseudorandom ciphertexts in the presence of chosen-plaintext attacks (CPA$
    security)** if* $\mathcal{L}^\Sigma_{\text{pk-cpa\$-real}} \approx \mathcal{L}^\Sigma_{\text{pk-cpa\$-rand}}$*,
    where:*


    | $\mathcal{L}^\Sigma_{\text{pk-cpa\$-real}}$ | $\mathcal{L}^\Sigma_{\text{pk-cpa\$-rand}}$
    |

    |---|---|

    | $(pk, sk) \leftarrow \Sigma.\text{KeyGen}$

    \(\frac{\text{GETPK}():}{\text{return } pk}\)

    \(\frac{\text{CHALLENGE}(m \in \Sigma.\mathcal{M}):}{\text{return } \Sigma.\text{Enc}(pk,
    m)}\) | $(pk, sk) \leftarrow \Sigma.\text{KeyGen}$

    \(\frac{\text{GETPK}():}{\text{return } pk}\)

    \(\frac{\text{CHALLENGE}(m \in \Sigma.\mathcal{M}):}{c \leftarrow \Sigma.\mathcal{C}

    \text{return } c}\) |


    As in the symmetric-key setting, CPA$ security (for public-key encryption) implies
    CPA security:


    **Claim 15.3** *Let* $\Sigma$ *be a public-key encryption scheme. If* $\Sigma$
    *has CPA$ security, then* $\Sigma$ *has CPA security.*


    The proof is extremely similar to the proof of the analogous statement for symmetric-key
    encryption (Theorem 7.3), and is left as an exercise.


