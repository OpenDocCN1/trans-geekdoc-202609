  md: "Don't be overwhelmed by all these hybrids. They all follow a simple pattern.\
    \ In fact, the $i$th hybrid looks like this:\n\n```\n$\\mathcal{L}^{\\text{hyb-}i}:$:\n\
    \ncount := 0\nQUERY():\n  count := count + 1\n  if count \\(\\leqslant i\\):\n\
    \    \\(r \\leftarrow \\{0, 1\\}^{2\\lambda}\\)\n    return \\(r\\)\n  else:\n\
    \    \\(s \\leftarrow \\{0, 1\\}^\\lambda\\)\n    \\(x := F(s, 00 \\cdots 00)\\\
