    # 14.3 Decisional Diffie-Hellman Problem


    The Diffie Hellman protocol is parameterized by the choice of cyclic group $\mathbb{G}$
    (and generator $g$). Transcripts in the protocol consist of $(g^a, g^b)$, where
    $a$ and $b$ are chosen uniformly. The key corresponding to such a transcript is
    $g^{ab}$. The set of possible keys is the cyclic group $\mathbb{G}$.


    Let us substitute the details of the Diffie-Hellman protocol into the KA security
    libraries. After simplifying, we see that the security of the Diffie Hellman protocol
    is equivalent to the following statement:


    ```

    L^G_dh-real

    QUERY():

    a, b ← Z_n

    return (g^a, g^b, g^ab)


    ≈


    L^G_dh-rand

    QUERY():

    a, b, c ← Z_n

    return (g^a, g^b, g^c)

    ```


    We have renamed the libraries to $\mathcal{L}_{\text{dh-real}}$ and $\mathcal{L}_{\text{dh-rand}}$.
    In $\mathcal{L}_{\text{dh-real}}$ the response to QUERY corresponds to a DHKA
    transcript $(g^a, g^b)$ along with the corresponding “correct” key'
