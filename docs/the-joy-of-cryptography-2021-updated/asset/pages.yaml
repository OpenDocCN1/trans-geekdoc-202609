- pgno: 182
  md: '▶ Imagine an adversary linked to one of the CCA libraries. As long as the random
    value \( r \) does not repeat, all inputs to the PRF are distinct. The guarantee
    of a pseudorandom function/permutation is that its outputs (which are the *ciphertexts*
    in this scheme) will therefore all look independently uniform.


    ▶ The CCA library prevents the adversary from asking for \( c \) to be decrypted,
    if \( c \) was itself generated by the library. For any other value \( c'' \)
    that the adversary asks to be decrypted, the guarantee of a *strong* PRP is that
    the result will look independently random. In particular, the result will not
    depend on the choice of plaintexts used to generate challenge ciphertexts. Since
    this choice of plaintexts is the only difference between the two CCA libraries,
    these decryption queries (intuitively) do not help the adversary.


    We now prove the CCA security of Construction 9.3 formally:


    **Claim 9.4** If \( F \) is a *strong PRP* (*Definition 6.13*) then *Construction
    9.3* has CCA$ security (and therefore *CCA security*).


    **Proof** As usual, we prove the claim in a sequence of hybrids.


    | \(\mathcal{L}^\Sigma_{\text{cca\$-real}}\) |

    | :- |

    | \( k \leftarrow \{0, 1\}^\lambda \) |

    | \( \mathcal{S} := \emptyset \) |

    | CTXT(\( m \)): |

    | \( r \leftarrow \{0, 1\}^\lambda \) |

    | \( c := F(k, m||r) \) |

    | \( \mathcal{S} := \mathcal{S} \cup \{c\} \) |

    | return \( c \) |

    | DECRYPT(\( c \in \Sigma.\mathcal{C} \)): |

    | if \( c \in \mathcal{S} \) return err |

    | return first \( n \) bits of \( F^{-1}(k, c) \) |


    The starting point is \(\mathcal{L}^\Sigma_{\text{cca\$-real}}\), as expected,
    where \(\Sigma\) refers to Construction 9.3.'
