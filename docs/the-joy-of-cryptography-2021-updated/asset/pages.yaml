- pgno: 96
  md: '**Definition 5.1 (PRG security)** Let \( G : \{0, 1\}^\lambda \rightarrow \{0,
    1\}^{\lambda+\ell} \) be a deterministic function with \( \ell > 0 \). We say
    that \( G \) is a **secure pseudorandom generator (PRG)** if \( \mathcal{L}^G_{\text{prg-real}}
    \approx \mathcal{L}^G_{\text{prg-rand}} \), where:


    ```

    \(\mathcal{L}^G_{\text{prg-real}}\)

    QUERY():

    \( s \leftarrow \{0, 1\}^\lambda \)

    return \( G(s) \)

    ```


    ```

    \(\mathcal{L}^G_{\text{prg-rand}}\)

    QUERY():

    \( r \leftarrow \{0, 1\}^{\lambda+\ell} \)

    return \( r \)

    ```


    The value \( \ell \) is called the **stretch** of the PRG. The input to the PRG
    is typically called a **seed**.


    Below is an illustration of the distributions sampled by these libraries, for
    a **length-doubling** (\( \ell = \lambda \)) PRG (not drawn to scale) :


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_96_0.png)


    \(\mathcal{L}_{\text{prg-real}}\) samples from distribution of red dots, by first
    sampling a uniform element of \(\{0, 1\}^\lambda\) and performing the action of
    \( G \) on that value to get a red result in \(\{0, 1\}^{2\lambda}\). The other
    library \(\mathcal{L}_{\text{prg-rand}}\) directly samples the uniform distribution
    on \(\{0, 1\}^{2\lambda}\) (in green above).


    To understand PRGs, you must simultaneously appreciate two ways to compare the
    PRG''s output distribution with the uniform distribution:


    +   ► From a *relative perspective*, the PRG''s output distribution is tiny. Out
    of the \( 2^{2\lambda} \) strings in \(\{0, 1\}^{2\lambda}\), only \( 2^\lambda
    \) are possible outputs of \( G \). These strings make up a \( 2^\lambda / 2^{2\lambda}
    = 1/2^\lambda \) fraction of \(\{0, 1\}^{2\lambda}\) — a **negligible fraction**!


    +   ► From an *absolute perspective*, the PRG''s output distribution is huge.
    There are \( 2^\lambda \) possible outputs of \( G \), which is an **exponential
    amount**!


    The illustration above only captures the *relative perspective* (comparing the
    red dots to the entire extent of \(\{0, 1\}^{2\lambda}\)), so it can lead to some
    misunderstanding. Just looking at this picture, it is hard to imagine how the
    two distributions could be indistinguishable. How could a calling program *not*
    notice whether it''s seeing the whole set or just a negligible fraction of the
    whole set? Well, if you run in polynomial-time in \( \lambda \), then \( 2^\lambda
    \) and \( 2^{2\lambda} \) are both so enormous that it doesn''t really matter
    that one is vastly bigger than the other. The relative sizes of the distribution
    don''t really help distinguish, since it is not a viable strategy for the distinguisher
    to “measure” the size of the distribution it''s sampling.'
