  md: '# 11 Hash Functions


    Suppose you share a huge file with a friend, but you are not sure whether you
    both have the same version of the file. You could send your version of the file
    to your friend and they could compare to their version. Is there any way to check
    that involves less communication than this?


    Let''s call your version of the file x (a string) and your friend''s version y.
    The goal is to determine whether x = y. A natural approach is to agree on some
    deterministic function H, compute H(x), and send it to your friend. Your friend
    can compute H(y) and, since H is deterministic, compare the result to your H(x).
    In order for this method to be fool-proof, we need H to have the property that
    different inputs always map to different outputs — in other words, H must be injective
    (1-to-1). Unfortunately, if H is injective and H : {0, 1}in → {0, 1}out is injective,
    then out ≥ in. This means that sending H(x) is no better/shorter than sending
    x itself!


    Let us call a pair (x, y) a collision in H if x ≠ y and H(x) = H(y). An injective
    function has no collisions. One common theme in cryptography is that you don’t
    always need something to be impossible; it’s often enough for that thing to be
    just highly unlikely. Instead of saying that H should have no collisions, what
    if we just say that collisions should be hard (for polynomial-time algorithms)
    to find? An H with this property will probably be good enough for anything we
    care about. It might also be possible to construct such an H with outputs that
    are shorter than its inputs!


    What we have been describing is exactly a cryptographic hash function. A hash
    function has long inputs and short outputs — typically H : {0, 1}* → {0, 1}n.
    Such an H must necessarily have many collisions. The security property of a hash
    function is that it is hard to find any such collision. Another good name for
    a hash function (which I just made up, and no one else uses) would be a “pseudo-injective”
    function. Although it is not injective, it behaves like one for our purposes.


    # 11.1 Security Properties for Hash Functions


    There are two common security properties of hash functions:


    +   **Collision resistance.** It should be hard to compute any collision x ≠ x′
    such that H(x) = H(x′).


    +   **Second-preimage resistance.** Given x, it should be hard to compute any
    collision involving x. In other words, it should be hard to compute x′ ≠ x such
    that H(x) = H(x′).'
