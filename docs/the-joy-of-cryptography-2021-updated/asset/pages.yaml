  md: "other coefficients chosen uniformly in Z_p. The ith user receives the point\
    \ (i, f(i) % p) on the polynomial. The interpolation theorem says that *any* t\
    \ of the shares can uniquely determine the polynomial f, and hence recover the\
    \ secret f(0).\n\n```\nConstruction 3.11 (Shamir SSS)\nM = Z_p\np : prime\nn <\
    \ p\nt <= n\n\nShare(m):\n  f_1, ..., f_{t-1} <- Z_p\n  f(x) := m + \\sum_{j=1}^{t-1}\
    \ f_j x^j\n  for i = 1 to n:\n    s_i := (i, f(i) % p)\n  return s = (s_1, ...,\
    \ s_n)\n\nReconstruct({s_i | i \\in U}):\n  f(x) := unique degree-(t - 1) polynomial\
    \ mod p passing\n  through points {s_i | i \\in U}\n  return f(0)\n```\n\nCorrectness\
    \ follows from the interpolation theorem.\n\n# Example\n\nHere is an example of\
    \ 3-out-of-5 secret sharing over Z_11 (so p = 11). Suppose the secret being shared\
    \ is m = 7 \\in Z_11. The Share algorithm chooses a random degree-2 polynomial\
    \ with constant coefficient 7.\n\nLet's say that the remaining two coefficients\
    \ are chosen as f_2 = 1 and f_1 = 4, resulting in the following polynomial:\n\n\
    ```\nf(x) = 1x^2 + 4x + 7\n```\n\nThis is the same polynomial illustrated in the\
    \ previous example:\n\n![](img/da79fa21b263fe549aecaabd2a0a41c8_69_0.png)\n\n\
