  md: "For example, we have seen that $\\mathbb{Z}_n^*$ contains the numbers 2, 4,\
    \ and 7 (and perhaps others), but it doesn’t contain the number 3 since 3 does\
    \ not have a multiplicative inverse. So which numbers have a multiplicative inverse\
    \ mod $n$, in general? (Which numbers belong to $\\mathbb{Z}_n^*$?) The answer\
    \ is quite simple:\n\n# **Theorem 13.3** $x$ has a multiplicative inverse mod\
    \ $n$ **if and only if** $\\gcd(x, n) = 1$. In other words, $\\mathbb{Z}_n^* =\
    \ \\{x \\in \\mathbb{Z}_n \\mid \\gcd(x, n) = 1\\}.$\n\nWe prove the theorem using\
    \ another fact from abstract algebra which is often useful:\n\n# **Theorem 13.4**\
    \ (Bezout’s Theorem) *For all integers $x$ and $y$, there exist integers $a$ and\
    \ $b$ such that $ax + by = \\gcd(x, y)$. In fact, $\\gcd(x, y)$ is the smallest\
    \ positive integer that can be written as an integral linear combination of $x$\
    \ and $y$.*\n\nWe won’t prove Bezout’s theorem, but we will show how it is used\
    \ to prove Theorem 13.3:\n\n# **Proof** (of Theorem 13.3) ($\\Leftarrow$) Suppose\
    \ $\\gcd(x, n) = 1$. We will show that $x$ has a multiplicative inverse mod $n$.\
    \ From Bezout’s theorem, there exist integers $a, b$ satisfying $ax + bn = 1$.\
    \ By reducing both sides of this equation modulo $n$, we have\n\n$1 = ax + bn\
    \ \\equiv_n ax + b \\cdot 0 = ax.$\n\nThus the integer $a$ that falls out of Bezout’s\
    \ theorem is the multiplicative inverse of $x$ modulo $n$.\n\n($\\Rightarrow$)\
    \ Suppose $x$ has a multiplicative inverse mod $n$, so $xx^{-1} \\equiv_n 1$.\
    \ We need to show that $\\gcd(x, n) = 1$. From the definition of $\\equiv_n$,\
    \ we know that $n$ divides $xx^{-1} - 1$, so we can write $xx^{-1} - 1 = kn$ (as\
    \ an expression over the integers) for some integer $k$. Rearranging, we have\
    \ $xx^{-1} - kn = 1$. Since we can write 1 as an integral linear combination of\
    \ $x$ and $n$, Bezout’s theorem says that we must have $\\gcd(x, n) = 1$.\n\n\
    # **Example** $\\mathbb{Z}_{15} = \\{0, 1, \\dots, 14\\}$, and to obtain $\\mathbb{Z}_{15}^*$\
    \ we exclude any of the numbers that share a common factor with $15$. In other\
    \ words, we exclude the multiples of $3$ and multiples of $5$. The remaining numbers\
    \ are $\\mathbb{Z}_{15}^* = \\{1, 2, 4, 7, 8, 11, 13, 14\\}$. Since $11$ is a\
    \ prime, $0$ is the only number in $\\mathbb{Z}_{11}$ that shares a common factor\
    \ with $11$. All the rest satisfy $\\gcd(x, 11) = 1$. Hence, $\\mathbb{Z}_{11}^*\
    \ = \\{1, 2, \\dots, 10\\}$. \n\n# **Example** We can use Sage$^3$ to play around\
    \ with these concepts. Sage supports the $\\%$ operator for modulus:\n\n```\n\
    sage: 2*8 % 15\n1\n```\n\nIt also supports a convenient way to generate “$\\mathbb{Z}_n$-objects,”\
    \ or Mod-objects as they are called. An object like Mod$(2, 15)$ represents the\
    \ value $2 \\in \\mathbb{Z}_{15}$, and all of its operations are overloaded to\
    \ be the mod-15 operations:\n\n$^3$https://www.sagemath.org"
