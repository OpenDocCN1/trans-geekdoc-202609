  md: "# Kerckhoffs’ Principle, Revisited\n\nKerckhoffs’ Principle says to assume\
    \ that the attacker has complete knowledge of the algorithms being used. Assume\
    \ that the choice of keys is the *only thing unknown to the attacker*. Let’s see\
    \ how Kerckhoffs’ Principle is reflected in our formal security definitions.\n\
    \nSuppose I write down the source code of two libraries, and your goal is to write\
    \ an effective distinguisher. So you study the source code of the two libraries\
    \ and write the best distinguisher that exists. It would be fair to say that your\
    \ distinguisher “knows” what algorithms are used in the libraries, because it\
    \ was designed based on the source code of these libraries. The definition of\
    \ interchangeability considers *literally every* calling program, so it must also\
    \ consider calling programs like yours that “know” what algorithms are being used.\n\
    \nHowever, there is an important distinction to make. If you know you might be\
    \ linked to a library that executes the statement “k ← {0, 1}^λ”, that doesn’t\
    \ mean you know the actual *value* of k that was chosen at runtime. Our convention\
    \ is that all variables within the library are privately scoped, and the calling\
    \ program can learn about them only indirectly through subroutine outputs. In\
    \ the library-distinguishing game, you are not allowed to pick a different calling\
    \ program based on random choices that the library makes! After we settle on a\
    \ calling program, we measure its effectiveness in terms of probabilities that\
    \ take into account all possible outcomes of the random choices in the system.\n\
    \nIn summary, the calling program “knows” what algorithms are being used (and\
    \ how they are being used!) because the choice of the calling program is allowed\
    \ to depend on the 2 specific libraries that we consider. The calling program\
    \ “doesn’t know” things like secret keys because the choice of calling program\
    \ isn’t allowed to depend on the outcome of random sampling done at runtime.\n\
    \n> **Kerckhoffs’ Principle, applied to our formal terminology:**\n> \n> Assume\
    \ that the attacker knows every fact in the universe, except for:\n> \n> 1. which\
    \ of the two possible libraries it is linked to in any particular execution, and\n\
    > \n> 2. the random choices that the library will make during any particular execution\
    \ (which are usually assigned to privately scoped variables within the library).\n\
    \n# 2.3 How to Demonstrate Insecurity with Attacks\n\nWe always define security\
    \ with respect to two libraries – or, if you like, two library *templates* that\
    \ describe how to insert the algorithms of a cryptographic scheme into two libraries.\
    \ If the two libraries that you get (after filling in the specifics of a particular\
    \ scheme) are interchangeable, then we say that the scheme satisfies the security\
    \ property. If we want to show that some scheme is *insecure*, we have to demonstrate\
    \ **just one calling program** that behaves differently in the presence of those\
    \ two libraries.\n\nLet’s demonstrate this process with the following encryption\
    \ scheme, which is like one-time pad but uses bitwise-AND instead of xor:"
