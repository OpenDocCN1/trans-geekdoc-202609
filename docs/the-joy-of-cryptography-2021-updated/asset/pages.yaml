  md: '# # 4 Basing Cryptography on Intractable Computations


    John Nash was a mathematician who earned the 1994 Nobel Prize in Economics for
    his work in game theory. His life story was made into a successful movie, *A Beautiful
    Mind*.


    In 1955, Nash was in correspondence with the United States National Security Agency
    (NSA),<sup>1</sup> discussing new methods of encryption that he had devised. In
    these letters, he also proposes some general principles of cryptography (bold
    highlighting not in the original):


    > ... in principle the enemy needs very little information to begin to break down
    the process. Essentially, as soon as \(\lambda\) bits<sup>2</sup> of enciphered
    message have been transmitted the key is about determined. This is no security,
    for a practical key should not be too long. But this does not consider how easy
    or difficult it is for the enemy to make the computation determining the key.
    If this computation, although possible in principle, were sufficiently long at
    best then the process could still be secure in a practical sense.


    Nash is saying something quite profound: it doesn’t really matter whether attacks
    are impossible, only whether attacks are computationally infeasible. If his letters
    hadn’t been kept classified until 2012, they might have accelerated the development
    of “modern” cryptography, in which security is based on intractable computations.
    As it stands, he was decades ahead of his time in identifying one of the most
    important concepts in modern cryptography.


    # ## 4.1 What Qualifies as a “Computationally Infeasible” Attack?


    Schemes like one-time pad cannot be broken, even by an attacker that performs
    a brute-force attack, trying all possible keys (see Exercise 1.5). However, all
    future schemes that we will see can indeed be broken by such an attack. Nash is
    quick to point out that, for a scheme with \(\lambda\)-bit keys:


    > The most direct computation procedure would be for the enemy to try all \(2^\lambda\)
    possible keys, one by one. Obviously this is easily made impractical for the enemy
    by simply choosing \(\lambda\) large enough.


    <sup>1</sup>The original letters, handwritten by Nash, are available at: https://www.nsa.gov/Portals/70/documents/news-features/declassified-documents/nash-letters/nash_letters1.pdf.

    <sup>2</sup>Nash originally used *r* to denote the length of the key, in bits.
    In all of the excerpts quoted in this chapter, I have translated his mathematical
    expressions into our notation (\(\lambda\)).'
