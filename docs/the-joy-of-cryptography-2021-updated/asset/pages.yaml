    )” clause, resulting in the following:\n\n```\n\\mathcal{L}^{CW}_{\\text{prf-rand}}\n\
    cache := empty assoc. array\nLOOKUP(x):\nif cache[x] undefined:\n  cache[x] ←\
    \ {0, 1}^out\n  return cache[x]\n```\n\nSince this is exactly \\(\\mathcal{L}^{CW}_{\\\
    text{prf-rand}}\\), we are done. We have shown that \\(\\mathcal{L}^{CW}_{\\text{prf-rand}}\
    \ \\approx \\mathcal{L}^{CW}_{\\text{prf-rand}'}\\). \\(\\blacksquare\\)\n\n#\
    \ 12.4 Galois Counter Mode for AEAD\n\nThe most common block cipher mode for AEAD\
    \ is called **Galois Counter Mode (GCM)**. GCM is essentially an instance of encrypt-then-MAC,\
    \ combining CTR mode for encryption and the polynomial-based Carter-Wegman MAC\
    \ for authentication. GCM is relatively inexpensive since it requires only one\
    \ call to the block cipher per plaintext block, plus one multiplication for each\
    \ block of ciphertext + associated data.\n\nRather than using polynomials over\
    \ \\(\\mathbb{Z}_p\\), GCM mode uses polynomials defined over a finite field with\
    \ \\(2^\\lambda\\) elements. Such fields are often called “Galois fields,” which\
    \ leads to the name Galois counter mode.\n\n![](img/da79fa21b263fe549aecaabd2a0a41c8_235_0.png)"
