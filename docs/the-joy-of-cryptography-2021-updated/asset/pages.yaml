    # 13.2 The RSA Function


    The RSA function is defined as follows:


    +   - Let $p$ and $q$ be distinct primes (later we will say more about how they
    are chosen), and let $N = pq$. $N$ is called the **RSA modulus**.


    +   - Let $e$ and $d$ be integers such that $ed \equiv_{\phi(N)} 1$. That is,
    $e$ and $d$ are multiplicative inverses mod $\phi(N)$ — not mod $N$!


    +   - The RSA function is: $x \mapsto x^e \% \, N$, where $x \in \mathbb{Z}_N$.


    +   - The inverse RSA function is: $y \mapsto y^d \% \, N$, where $x \in \mathbb{Z}_N$.


    Essentially, the RSA function (and its inverse) is a simple modular exponentiation.
    The most confusing thing to remember about RSA is that $e$ and $d$ “live” in $\mathbb{Z}^*_{\phi(N)}$,
    while $x$ and $y$ “live” in $\mathbb{Z}_N$.


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_242_0.png)


    Let’s make sure the function we called the “inverse RSA function” is actually
    an inverse of the RSA function. Let’s start with an example:


    **Example** In Sage, we can sample a random prime between 1 and $k$ by using `random_prime(k)`.
    We use it to sample the prime factors $p$ and $q$:


    ```

    sage: p = random_prime(10^5)

    sage: q = random_prime(10^5)

    sage: N = p*q

    sage: N

    36486589

    ```'
