    # Associated Data


    AE provides a secure channel between Alice and Bob that is safe from message-modification
    and message-injection by the attacker (in addition to providing confidentiality).
    However, AE still does not protect from replay of messages. If Alice sends a ciphertext
    c to Bob, we know that Bob will decrypt c without error. The guarantee of AE security
    is that Bob can be sure that the message originated from Alice in this case. If
    an attacker re-sends the same c at a later time, Bob will likely interpret that
    as a sign that Alice wanted to say the same thing again, even though this was
    not Alice’s intent. It is still true that Alice was the originator of the message,
    but just not at this time.


    You may wonder how it is possible to prevent this sort of attack. If a ciphertext
    c is a valid ciphertext when Alice sends it, then it will always be a valid ciphertext,
    right? A clever way around this problem is for Alice to not only authenticate
    the ciphertext as coming from her, but to authenticate it also to a specific context.
    For example, suppose that Alice & Bob are exchanging encrypted messages, and the
    5th ciphertext is c, sent by Alice. The main idea is to let Alice authenticate
    the fact that “I meant to send c as the 5th ciphertext in the conversation.” If
    an attacker re-sends c later (e.g., as the 11th ciphertext, a different context),
    Bob will attempt to authenticate the fact that “Alice meant to send c as the 11th
    ciphertext,” and this authentication will fail.


    What I have called “context” is called associated data in an encryption scheme.
    In order to support associated data, we modify the syntax of the encryption and
    decryption algorithms to take an additional argument d. The ciphertext c = Enc(k,
    d, m) is an encryption of m with associated data d. In an application, d could
    be a sequence number of a conversation, a hash of the entire conversation up to
    this point, an IP address + port number, etc. — basically, as much information
    as you can think of regarding this ciphertext’s intended context. Decrypting c
    with the “correct” associated data d via Dec(k, d, c) should result in the correct
    plaintext m. Decrypting c with any other associated data should result in an error,
    since that reflects a mismatch between the sender’s and receiver’s contexts.


    The intuitive security requirement for authenticated encryption with associated
    data (AEAD) is that an attacker who sees many encryptions ci of chosen plaintexts,
    each authenticated to a particular associated data di, cannot generate a different
    (c*, d*) that decrypts successfully. The security definition rules out attempts
    to modify some ci under the same di, or modify some di for the same ci, or produce
    a completely new (c*, d*).


