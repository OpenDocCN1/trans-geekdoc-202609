    # Hashed RSA Signatures


    The problem with textbook RSA signatures is that the signatures and plaintexts
    had a very strong algebraic relationship. Squaring the signature had the effect
    of squaring the underlying message. One way to fix the problem is to “break” this
    algebraic relationship. Hashed RSA signatures break the algebraic structure by
    applying the RSA function not to m directly, but to H(m), where H is a suitable
    hash function (with outputs interpreted as elements of Z_N).


    | Construction 13.8 (Textbook RSA) |

    | :--- |

    | Sign(sk = (N, d), m): return H(m)^d % N | Ver(vk = (N, e), m, σ): y := σ^e %
    N return H(m) =? y |


    Let’s see how this change thwarts the attack on textbook signatures. If σ is a
    valid signature of m, we have σ ≡_N H(m)^d. Squaring both sides leads to σ^2 ≡_N
    (H(m)^2)^d. Is this the valid signature of any m''? An attacker would have to
    identify some m'' that has H(m'') = H(m)^2. If the hash function is a good one,
    then this should be hard.


    Of course, this is not a formal proof. It is possible to formally prove the security
    of hashed RSA signatures. The precise statement of security is: “if RSA is a secure
    trapdoor function and H is modeled as a random oracle, then hashed RSA signatures
    are a secure signature scheme.” Since we have not given formal definitions for
    either trapdoor functions or random oracles, we won’t see the proof in this book.


    +   to-do Write a chapter on random oracle and other idealized models.'
