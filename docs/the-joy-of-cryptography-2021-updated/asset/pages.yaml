    space M = {0, 1}^l. To encrypt a message m, we "pad" m into a prime number by
    appending a zero and then random non-zero bytes. We then multiply by the secret
    key. To decrypt, we divide off the key and then strip away the "padding."


    The idea is that decrypting a ciphertext without knowledge of the secret key requires
    factoring the product of two large primes, which is a hard problem.


    ^8 A more involved calculation that incorporates the cost of each division (modulus)
    operation shows the worst-case overall efficiency of the algorithm to be O(log^2
    N) - quadratic in the number of bits needed to write the input.'
