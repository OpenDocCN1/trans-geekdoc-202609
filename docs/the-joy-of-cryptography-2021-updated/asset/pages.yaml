    \ F(s, 00...00)\ny := F(s, 00...01)\nreturn x||y   // G(s)\n```\n\n```\nL^G_prg-rand\n\
    QUERY():\nr <- {0, 1}^{2lambda}\nreturn r\n```\n\nDuring the proof, we are allowed\
    \ to use the fact that $F$ is a secure PRF. That is, we can use the fact that\
    \ the following two libraries are indistinguishable:\n\n```\nL^F_prf-real\nk <-\
    \ {0, 1}^lambda\nLOOKUP(x in {0, 1}^in):\nreturn F(k, x)\n```\n\n```\nL^F_prf-rand\n\
    T := empty assoc. array\nLOOKUP(x in {0, 1}^in):\nif T[x] undefined:\n  T[x] <-\
    \ {0, 1}^out\nreturn T[x]\n```\n\nThe inconvenience in the proof stems from a\
    \ mismatch of the $s$ variable in $\\mathcal{L}^G_{\\text{prg-real}}$ and the\
    \ $k$ variable in $\\mathcal{L}^F_{\\text{prf-real}}$. In $\\mathcal{L}^G_{\\\
    text{prg-real}}$, $s$ is local to the QUERY subroutine. Over the course of an\
    \ execution, $s$ will take on many values. Since $s$ is used as the PRF seed,\
    \ we must write the calls to $F$ in terms of the LOOKUP subroutine of $\\mathcal{L}^F_{\\\
    text{prf-real}}$. But in $\\mathcal{L}^F_{\\text{prf-real}}$ the PRF seed is fixed\
