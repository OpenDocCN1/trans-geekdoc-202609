    The rest of the proof is essentially a “mirror image” of the previous steps, in
    which we perform the same steps but in reverse (and with \(m_R\) being used instead
    of \(m_L\)).


    ```

    EAVESDROP($m_L, m_R$):

    $z \leftarrow$ QUERY()

    $c := z \oplus m_R$

    return $c$

    ```


    ```

    $\mathcal{L}^G_{\text{prg-rand}}$

    QUERY():

    $r \leftarrow \{0, 1\}^{\lambda + \ell}$

    return $r$

    ```


    A statement has been factored out into a subroutine, which happens to exactly
    match $\mathcal{L}^G_{\text{prg-rand}}$.


    ```

    EAVESDROP($m_L, m_R$):

    $z \leftarrow$ QUERY()

    $c := z \oplus m_R$

    return $c$

    ```


    ```

    $\mathcal{L}^G_{\text{prg-real}}$

    QUERY():

    $s \leftarrow \{0, 1\}^\lambda$

    return $G(s)$

    ```


    From the PRG security of $G$, we can replace $\mathcal{L}^G_{\text{prg-rand}}$
    with $\mathcal{L}^G_{\text{prg-real}}$. The resulting library is indistinguishable
    from the previous one.


    ```

    $\mathcal{L}^{\text{pOTP}}_{\text{ots-R}}$

    EAVESDROP($m_L, m_R$):

    \(k \leftarrow \{0, 1\}^\lambda\)

    \(c := G(k) \oplus m_R\)

    return \(c\)

    ```


    A subroutine has been inlined. The result is $\mathcal{L}^{\text{pOTP}}_{\text{ots-R}}$.


    Summarizing, we showed a sequence of hybrid libraries satisfying the following:


    \(\mathcal{L}^{\text{pOTP}}_{\text{ots-L}} \equiv \mathcal{L}_{\text{hyb-1}} \approx
    \mathcal{L}_{\text{hyb-2}} \equiv \mathcal{L}_{\text{hyb-3}} \equiv \mathcal{L}_{\text{hyb-4}}
    \equiv \mathcal{L}_{\text{hyb-5}} \approx \mathcal{L}_{\text{hyb-6}} \equiv \mathcal{L}^{\text{pOTP}}_{\text{ots-R}}.\)


    Hence, $\mathcal{L}^{\text{pOTP}}_{\text{ots-L}} \approx \mathcal{L}^{\text{pOTP}}_{\text{ots-R}}$,
    and pOTP has (computational) one-time secrecy.


