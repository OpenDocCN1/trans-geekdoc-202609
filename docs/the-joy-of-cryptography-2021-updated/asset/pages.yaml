  md: '# Discussion & Pitfalls


    +   Similar to the definition of one-time secrecy of encryption, we let the calling
    program choose the two secret messages that will be shared. As before, this models
    an attack scenario in which the adversary has partial knowledge or influence on
    the secret m being shared.


    +   The calling program also chooses the set U of users’ shares to obtain. The
    libraries make it impossible for the calling program to obtain the shares of an
    authorized set (returning err in that case). This does not mean that a user is
    never allowed to distribute an authorized number of shares (this would be strange
    indeed, since it would make any future reconstruction impossible). It just means
    that we want a security definition that says something about an attacker who sees
    only an unauthorized set of shares, so we formalize security in terms of libraries
    with this restriction.


    +   Consider a 6-out-of-10 threshold secret-sharing scheme. With the libraries
    above, the calling program can receive the shares of users {1, ..., 5} (an unauthorized
    set) in one call to SHARE, and then receive the shares of users {6, ..., 10} in
    another call. It might seem like the calling program can then combine these shares
    to reconstruct the secret (if the same message was shared in both calls). However,
    this is not the case because these two sets of shares came from two independent
    executions of the Share algorithm. Shares generated by one call to Share should
    not be expected to function with shares generated by another call, even if both
    calls to Share used the same secret message.


    +   Recall that in our style of defining security using libraries, it is only
    the internal differences between the libraries that must be hidden. Anything that
    is the same between the two libraries need not be hidden. One thing that is the
    same for the two libraries here is the fact that they output the shares belonging
    to the same set of users U. This security definition does not require shares to
    hide which user they belong to. Indeed, you can modify a secret-sharing scheme
    so that each user’s identity is appended to his/her corresponding share, and the
    result would still satisfy the security definition above.


    +   Just like the encryption definition does not address the problem of key distribution,
    the secret-sharing definition does not address the problem of who should run the
    Share algorithm (if its input m is so secret that it cannot be entrusted to any
    single person), or how the shares should be delivered to the n different users.
    Those concerns are considered out of scope by the problem of secret-sharing (although
    we later discuss clever approaches to the first problem). Rather, the focus is
    simply on whether it is even possible to encode data in such a way that an unauthorized
    set of shares gives no information about the secret, while any authorized set
    completely reveals the secret.


    # An Insecure Approach


    One way to understand the security of secret sharing is to see an example of an
    “obvious” but insecure approach for secret sharing, and study why it is insecure.'
