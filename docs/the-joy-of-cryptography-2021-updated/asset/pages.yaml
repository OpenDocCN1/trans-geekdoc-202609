  md: "'T.values' refers to the set {v | ∃x : T[x] = v}.\n\nThe changes from the PRF\
    \ definition are highlighted in yellow. In particular, the L<sub>prp-real</sub>\
    \ and L<sub>prf-real</sub> libraries are identical.\n\n# ## Discussion, Pitfalls\n\
    \nIn the definition, both the functions F and F<sup>-1</sup> take the seed k as\
    \ input. Therefore, only someone with k can invert the block cipher. Think back\
    \ to the definition of a PRF — without the seed k, it is hard to compute F(k,\
    \ x). A block cipher has a forward and reverse direction, and computing either\
    \ of them is hard without k!\n\n# ## 6.4 Relating PRFs and Block Ciphers\n\nIn\
    \ this section we discuss how to obtain PRFs from PRPs/block ciphers, and vice-versa.\n\
    \n# ### Switching Lemma (PRPs are PRFs, Too!)\n\nImagine you can query a PRP on\
    \ chosen inputs (as in the L<sub>prp-real</sub> library), and suppose the blocklength\
    \ of the PRP is blen = λ. You would only be able to query that PRP on a negligible\
    \ fraction of its exponentially large input domain. It seems unlikely that you\
    \ would even be able to tell that it was a PRP (i.e., an invertible function)\
    \ rather than a PRF (an unrestricted function).\n\nThis idea can be formalized\
    \ as follows.\n\n> > **Lemma 6.7 (PRP switching)** Let L<sub>prf-rand</sub> and\
    \ L<sub>prp-rand</sub> be defined as in Definitions 6.1 & 6.6, with parameters\
    \ in = out = blen = λ (so that the interfaces match up). Then L<sub>prf-rand</sub>\
    \ ≈ L<sub>prp-rand</sub>.\n\n**Proof** Recall the replacement-sampling lemma,\
    \ Lemma 4.11, which showed that the following libraries are indistinguishable:\n\
    \n```\nL<sub>samp-L</sub> | L<sub>samp-R</sub>\n---|---\nSAMP(): | R := ∅\nr ←\
    \ {0, 1}^λ | SAMP():\nreturn r | r ← {0, 1}^λ \\ R\n| R := R ∪ {r}\n| return r\n\
    ```\n\nL<sub>samp-L</sub> samples values with replacement, and L<sub>samp-R</sub>\
    \ samples values without replacement. Now consider the following library L*:\n\
    \n```\nL*\n---\nT := empty assoc. array\nLOOKUP(x ∈ {0, 1}^λ):\n  if T[x] undefined:\n\
    \    T[x] ← SAMP()\n  return T[x]\n```"
