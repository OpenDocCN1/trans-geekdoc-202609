  md: "# Encrypt-then-MAC with Associated Data\n\nRecall that the encrypt-then-MAC\
    \ construction computes a MAC of the ciphertext. To incorporate associated data,\
    \ we simply need to compute a MAC of the ciphertext along with the associated\
    \ data.\n\nRecall that most MACs in practice support variable-length inputs, but\
    \ the length of the MAC tag does not depend on the length of the message. Hence,\
    \ this new variant of encrypt-then-MAC has ciphertexts whose length does not depend\
    \ on the length of the associated data.\n\n```\nConstruction 12.4\n(Enc+MAC+AD)\n\
    \nEnc((k_e, k_m), d, m):\n  c <- E.Enc(k_e, m)\n  t := M.MAC(k_m, d || c)\n  return\
    \ (c, t)\n\nDec((k_e, k_m), d, (c, t)):\n  if t != M.MAC(k_m, d || c):\n    return\
    \ err\n  return E.Dec(k_e, c)\n```\n\nClaim 12.5\nIf E has CPA security and M\
    \ is a secure MAC, then Construction 12.4 has AEAD security, when the associated\
    \ data has fixed length (i.e., D = {0, 1}^n for some fixed n).\n\n> to-do\n> This\
    \ construction is insecure for variable-length associated data. It is not terribly\
    \ hard to fix this; see exercises.\n\n# 12.3 Carter-Wegman MACs\n\nSuppose we\
    \ construct an AE[AD] scheme using the encrypt-then-MAC paradigm. A good choice\
    \ for the CPA-secure encryption scheme would be CBC mode; a good choice for the\
    \ MAC scheme would be ECBC-MAC. Combining these two building blocks would result\
    \ in an AE[AD] scheme that invokes the block cipher twice for each plaintext block\
    \ — once for the CBC encryption (applied to the plaintext) and once more for the\
    \ ECBC-MAC (applied to that ciphertext block).\n\nIs it possible to achieve AE[AD]\
    \ with less cost? In this section we will explore a more efficient technique for\
    \ variable-length MACs, which requires only one multiplication operation per message\
    \ block along with a single invocation of a block cipher.\n\n# Universal Hash\
    \ Functions\n\nThe main building block in Carter-Wegman-style MACs is a kind of\
    \ hash function called a universal hash function (UHF). While the name \"universal\
    \ hash function\" sounds like it must be an incredibly strong primitive, a UHF\
    \ actually gives a much weaker security guarantee than a collision-resistant or\
    \ second-preimage-resistant hash function.\n\nRecall that (x, x') is a collision\
    \ under salt s if x != x' and H(s, x) = H(s, x'). A universal hash function has\
    \ the property that it is hard to find such a collision ...\n\n... when x and\
    \ x' are chosen without knowledge of the salt,\n\n... and when the attacker has\
    \ only one attempt at finding a collision for a particular salt value."
