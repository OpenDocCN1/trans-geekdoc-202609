    \ T[p] \\leftarrow \\{0, 1\\}^\\lambda\n  v := T[p]\n  for i = 1 to in:\n    if\
    \ x_i = 0 then v := G_L(v)\n    if x_i = 1 then v := G_R(v)\n  return v\n\nk :=\
    \ undefined // k is alias for T[\\epsilon]\np = \\epsilon\nif k undefined: k \\\
    leftarrow \\{0, 1\\}^\\lambda\nv := F(k, x)\nreturn F(k, x)\n```\n\nIn \\mathcal{L}_{\\\
    text{hyb-0}}, we always have p = \\epsilon, so the only entry of T that is accessed\
