    \ steps (factor out, replace library, inline) that we have seen several times\
    \ before. The resulting library is precisely $\\mathcal{L}^\\Sigma_{\\text{cpa\\\
    $-rand}}$ since it samples uniformly from $\\Sigma.\\mathcal{C} = \\{0, 1\\}^\\\
    lambda \\times \\{0, 1\\}^{\\text{out}}$.\n\nThe sequence of hybrids shows that\
