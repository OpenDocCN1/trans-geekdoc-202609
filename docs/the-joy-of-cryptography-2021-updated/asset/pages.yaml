    | 2 ÷ 2 ≡15 1 | 10 ÷ 2 ≡15 5 |

    | --- | --- |

    | 4 ÷ 2 ≡15 2 | 12 ÷ 2 ≡15 6 |

    | 6 ÷ 2 ≡15 3 | 14 ÷ 2 ≡15 7 |

    | 8 ÷ 2 ≡15 4 | |


