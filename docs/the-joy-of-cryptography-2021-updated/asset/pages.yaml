  md: 'As an example, let’s see ciphertext stealing as applied to CBC mode. Suppose
    the blocklength is $blen$ and the last plaintext block \(m_\ell\) is $j$ bits
    short of being a full block. We start by extending \(m_\ell\) with $j$ zeroes
    (i.e., null-padding the plaintext) and performing CBC encryption as usual.


    Now our goal is to identify $j$ bits of the CBC ciphertext that can be thrown
    away while still making decryption possible. In this case, the appropriate bits
    to throw away are **the last $j$ bits of** \(c_{\ell-1}\) (the next-to-last block
    of the CBC ciphertext). The reason is illustrated in the figure below:


    ![](img/da79fa21b263fe549aecaabd2a0a41c8_165_0.png)


    Suppose the receiver obtains this CBC ciphertext but the last $j$ bits of \(c_{\ell-1}\)
    have been deleted. How can he/she decrypt? The important idea is that $j$ bits
    missing those missing $j$ bits were redundant, because there is another way to
    compute them.


    In CBC encryption, the last value given as input into the block cipher is \(c_{\ell-1}
    \oplus m_\ell\). Let us give this value a name \(x^* := c_{\ell-1} \oplus m_\ell\).
    Since the last $j$ bits of \(m_\ell\) are 0’s, the last $j$ bits of \(x^*\) are
    the last $j$ bits of \(c_{\ell-1}\) — the missing bits. Even though these bits
    are missing from \(c_{\ell-1}\), the receiver has a different way of computing
    them as \(x^* := F^{-1}(k, c_\ell)\).


    Putting it all together, the receiver does the following: First, it observes that
    the ciphertext is $j$ bits short of a full block. It computes \(F^{-1}(k, c_\ell)\)
    and takes the last $j$ bits of this value to be the missing bits from \(c_{\ell-1}\).
    With the missing bits recovered, the receiver does CBC decryption as usual. The
    result is a plaintext consisting of \(\ell\) full blocks, but we know that the
    last $j$ bits of that plaintext are \(\emptyset\) padding that the receiver can
    remove.


    It is convenient in an implementation for the boundaries between blocks to be
    in predictable places. For that reason, it is slightly awkward to remove $j$ bits
    from the middle of the ciphertext during encryption (or add them during decryption),
    as we have done here. So in practice, the last two blocks of the ciphertext are
    often interchanged. In the example above, the resulting ciphertext (after ciphertext
    stealing) would be:


    ```

    \(c_0 \| c_1 \| c_2 \cdots c_{\ell-3} \| c_{\ell-2} \| c_\ell \| c''_{\ell-1}\),
    where \(c''_{\ell-1}\) is the first \(blen - j\) bits of \(c_{\ell-1}\).

    ```


    3 The receiver knows this fact, because the ciphertext is $j$ bits short of a
    full block. The length of the (shortened) ciphertext is a signal about how many
    0-bits of padding were used during encryption.'
