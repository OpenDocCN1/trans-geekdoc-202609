    \ x' \\in {0, 1}*):  \n  if x != x' and H(s, x) = H(s, x'): return true  \n  return\
    \ false  \n```\n\n$\\mathcal{L}^{\\mathcal{H}}_{\\text{cr-fake}}$  \n```\ns <-\
    \ {0, 1}^\\lambda  \nGETSALT():  \n  return s  \nTEST(x, x' \\in {0, 1}*):  \n\
    \  return false  \n```\n```\n\nThe library initially samples the salt s. Unlike\
    \ in other libraries, this value s is meant to be provided to the calling program,\
