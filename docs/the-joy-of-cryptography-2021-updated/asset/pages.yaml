  md: '# # 14 Diffie-Hellman Key Agreement


    # ## 14.1 Cyclic Groups


    **Definition 14.1** Let \( g \in \mathbb{Z}_n^* \). Define \( \langle g \rangle_n
    = \{g^i \pmod n \mid i \in \mathbb{Z} \} \), the set of all powers of \( g \)
    reduced mod \( n \). Then \( g \) is called a **generator** of \( \langle g \rangle_n
    \), and \( \langle g \rangle_n \) is called the **cyclic group generated by**
    \( g \) **mod** \( n \). If \( \langle g \rangle_n = \mathbb{Z}_n^* \), then we
    say that \( g \) is a **primitive root mod** \( n \).


    The definition allows the generator \( g \) to be raised to a negative integer.
    Since \( g \in \mathbb{Z}_n^* \), it is guaranteed that \( g \) has a multiplicative
    inverse mod \( n \), which we can call \( g^{-1} \). Then \( g^{-i} \) can be
    defined as \( g^{-i} \stackrel{\text{def}}{=} (g^{-1})^i \). All of the usual
    laws of exponents hold with respect to this definition of negative exponents.


    **Example** Taking \( n = 13 \), we have:


    \(\langle 1 \rangle_{13} = \{1\}\)

    \(\langle 2 \rangle_{13} = \{1, 2, 4, 8, 3, 6, 12, 11, 9, 5, 10, 7\} = \mathbb{Z}_{13}^*\)

    \(\langle 3 \rangle_{13} = \{1, 3, 9\}\)


    Thus 2 is a primitive root modulo 13. Each of the groups \(\{1\}\), \(\mathbb{Z}_{13}^*\),
    \(\{1, 3, 9\}\) is a cyclic group under multiplication mod 13.


    A cyclic group may have more than one generator; for example:


    \(\langle 3 \rangle_{13} = \langle 9 \rangle_{13} = \{1, 3, 9\}\)


    Similarly, there are four primitive roots modulo 13 (equivalently, \(\mathbb{Z}_{13}^*\)
    has four different generators); they are 2, 6, 7, and 11.


    Not every integer has a primitive root. For example, there is no primitive root
    modulo 15. However, when \( p \) is a prime, there is always a primitive root
    modulo \( p \) (and so \(\mathbb{Z}_p^*\) is a cyclic group).


    Let us write \(\mathbb{G} = \langle g \rangle = \{g^i \mid i \in \mathbb{Z} \}\)
    to denote an unspecified cyclic group generated by \( g \). The defining property
    of \(\mathbb{G}\) is that each of its elements can be written as a power of \(
    g \). From this we can conclude that:


    +   - Any cyclic group is closed under multiplication. That is, take any \( X,
    Y \in \mathbb{G} \); then it must be possible to write \( X = g^x \) and \( Y
    = g^y \) for some integers \( x, y \). Using the multiplication operation of \(\mathbb{G}\),
    the product is \( XY = g^{x+y} \), which is also in \(\mathbb{G}\).

    +   - Any cyclic group is closed under inverses. Take any \( X \in \mathbb{G}
    \); then it must be possible to write \( X = g^x \) for some integer \( x \).
    We can then see that \( g^{-x} \in \mathbb{G} \) by definition, and \( g^{-x}X
    = g^{-x+x} = g^0 \) is the identity element. So \( X \) has a multiplicative inverse
    (\( g^{-x} \)) in \(\mathbb{G}\).


    These facts demonstrate that \(\mathbb{G}\) is indeed a *group* in the terminology
    of abstract algebra.'
