    and it was effective for dealing with irregularities in the dataset.

    Amit Kumar al used four collaborative approach on deep learning models, and used
    ResNet50, DenseNet201, and Inception V3 as the we layers. Dataset was classified
    into two classes Covid Positive and Negative, with 538 and 468 images, respectively.
    The proposed method achieved an accuracy of 95%.

    Jain et al. [21] used Inception V3, Xception. Xception is not the modification
