    [14]。在 COVID-19 CT 图像上观察到混合 GGO、X 射线可分类为支气管扩张、网状、亚膜下带和弥漫性实变 [5]。COVID 的影响使患者肺部在两周后开始好转并恢复正常状态。[15]
