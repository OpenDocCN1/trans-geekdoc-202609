    dataset contained 254 Covid chest patient images, which were further filtered,
    and only 184 anterior-posterior images, which have clear annotations on the X-ray
    images, were collected, the largest dataset of chest x-ray containing 24,136 x-ray
    images for normal and 14 different diseases. The model was trained using 84 cases
    and 2000 non-covid images and tested on 100 and 3000 non-covid patients.


