    COVID-19 放射数据库包含 1341 张正常、1345 张肺炎和 1200 张 Covid 图像 [12]。在所提的方法中仅使用了 Covid 患者和正常患者样本。两个数据集的进一步图像被合并以增加数据集规模。


    ### H. 在新数据集上训练 ResNet18


    Covid-ray 数据集拥有 184 张 Covid 患者图像，所有模型在该数据集上训练的准确率很高。由于 Covid 19 样本量很小，我们无法依赖模型的结果。将“COVID-19
    放射数据库”和“Covid-ray”数据集合并以合并数据集。ResNet18 在此增强数据集上进行了训练，为我们提供了理想的结果，敏感性提高到 0.884，特异性提高到
