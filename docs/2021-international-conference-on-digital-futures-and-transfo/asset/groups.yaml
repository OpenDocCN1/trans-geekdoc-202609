    摘要——新冠病毒 COVID-19 可以通过 X 射线图像观察。历史上最大的流行病。全球已确认约 310 万例死亡和超过 1.5 亿。由于由于许多地区的封锁，该问题的经济成本是巨大的。检测
    COVID-19 的方法是 PCR，但获得结果需要 4-6 小时。在某些情况下，PCR 测试的假阴性率较高。作为替代方法，CT 和 X 射线等放射学图像可用于
    COVID-19 诊断。深度学习已成为此类肿瘤检测的强大工具。模拟结果显示了深度学习模型在 COVID-19 检测中的有效性。


    COVID-19 可以通过 X 射线图像观察。由于这些独特特征，可以通过深度学习模型检测 COVID-19。


    Ghosh 等人 [8] 使用 DenseNet201、ResNet50v2 和 Inception3 结合 COVID-19 和非 COVID-19 模型：患者接受
