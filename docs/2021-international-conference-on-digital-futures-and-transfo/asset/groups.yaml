    等人 [11] 使用了 5184 张 X 射线图像数据集，其中约 500 张图像用于 19 名患者，187 名患者对预训练的 ResNet50、SqueezeNet
    和深度卷积网络模型的最后一层进行了新冠病例微调。


    关键词——冠状病毒，深度学习，alexnet，v16，


    ## I. 引言


    COVID-19 影响了整个世界，被认为是 21 世纪最大的流行病。由于 COVID-19，世界正在与疟疾作斗，同时由于全球许多地区的封锁也受到了困扰。发热、头痛、呼吸困难、咳嗽、疲劳和不适是
    COVID-19 的常见症状。在许多人身上没有观察到症状。它通过 PCR 检测，患者需要等待四到六小时。PCR 测试的灵敏度和特异性率在 60% 到 70%；放射学可以作为
    COVID-19 的替代诊断方法。X 射线和 CT 扫描比 PCR 测试快得多。在某些情况下，胸部 X 射线值被用于判断是否患有 COVID-19。然而，某些值对于其他疾病并不正常。尽管如此，胸部
    X 射线显示了异常特征，如磨玻璃影、牵引性支气管扩张、网状亚膜下带、混合实变 GGO、血管增大和支气管增厚。在这种情况下，深度学习在图像分类、计算机视觉 [6]
    和医学图像分析 [7] 方面取得了巨大进展。COVID-19 影响肺部及其异常。


    本文中，数据集上使用了四种深度学习模型 VGG6、ResNet18、V3 和 AlexNet 深度卷积模型。由于数据有限，所有模型都经过了预训练，并使用 COVID-19
    患者的胸部 X 射线图像对最后一层进行了微调。另一项实验是对 ResNet18 进行的，其中该模型在 COVID-Xray-S 数据集 [12] 上进行了训练。模型使用的选项大小为
    24，训练迭代次数（epochs）增加到 30 并训练了 ResNet18。整个工作的整体结果如下；文献综述部分将讨论。讨论部分将展示方法论，第四部分将定义工作结果。


    ## II. 相关工作


    COVID-19 病毒是一项全球健康挑战，因为它通过接触或互动传播。病毒通过 PCR 测试进行诊断，但非常耗时且需要多次结果。此外，测试质量是达到检测 100%
    准确率的考虑因素之一。


    在某些情况下，PCR 的灵敏度和特异性率低至仅 60% 到 70% [4]。COVID-19 影响肺部异常，可以通过 CT 扫描和胸部 X 射线等放射学图像看到。在一次实验中，CT
