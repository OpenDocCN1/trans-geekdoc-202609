    在 covid-19 中发现了异常。使用了深度学习模型 VGG16、Inception V3 和 ResNet18。模型的准确性将会提高。最佳 AUC 由
    AlexNet 实现。inception v3 达到了敏感性 0.940，vgg-16 达到了最低特异性 0.630。其中 vgg-16 达到了最高敏感性
    1，AlexNet 达到了最高特异性 0.99。所有模型的特异性范围在 0.6 到 0.9 之间。我们可以利用此检测 covid-19。


