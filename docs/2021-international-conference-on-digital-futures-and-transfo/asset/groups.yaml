    还是 non-covid 类。计算了敏感性和特异性。预测阈值值设置为 0.52。表 1 显示 inception v3 达到了敏感性 0.940，vgg-16
    达到了最低特异性 0.630。其中 vgg-16 达到了最高敏感性 1，AlexNet 达到了最高特异性 0.99。混淆矩阵见图 4。


