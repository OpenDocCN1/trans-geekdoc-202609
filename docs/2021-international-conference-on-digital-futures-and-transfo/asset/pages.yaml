    # V. CONCLUSION


    The abnormalities have been found on Covid 19 patient''s Chest X-ray. Deep learning
    models VGG 16, Inception V3, and ResNet118 were pre-trained on Covid and non-covid
    patient dataset using x-ray. Two different datasets COVID-Xk-5D and COVID-19 Radiology
    Database were used during the experiment. Experiments performed on the models
    were evaluated by classification probability, specificity, and AUC-ROC. Of all,
    the best AUC was 0.965 achieved by AlexNet. The best sensitivity was 0.940 achieved
    by Inception V3 and the best specificity was 1 by VGG 16. It was also observed
    that if the model is trained on more epochs the accuracy of the model will improve.
    The reliability, the model was trained on a larger dataset and the accuracy of
    the model was improved. We can detect Covid 19 using this automatic model for
    the detection of Covid 19 infection, especially where or Covid testing kits are
    not available.


