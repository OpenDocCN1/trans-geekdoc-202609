    # E. Sensitivity and Specificity


    We performed binary classification on the classes, dataset was classified into
    two classes covid and non-covid. In deep learning, the model gives the score value
    which is compared with a threshold value to predict if it belongs to a covid or
    non-covid class. The calculation of sensitivity and specificity are calculated.
    The threshold value of 0.52 was set for the prediction. Table 1 sensitivity 0.940
    was achieved by inception v3 and the lowest specificity 0.630 was achieved by
    vgg-16. Where the highest sensitivity 1 was achieved by vgg-16 and the lowest
    specificity 0.99 was achieved by AlexNet, Overall specificity was achieved by
    all the models where specificity rate varies between 0.6 to 0.9. Confusion matrix
    can be seen on figure 4.


