    # G. Testing of ResNet18 With COVID-19 Radiography Dataset


    Experiment was performed on two datasets: COVID-19 Radiography datasets were combined
    with COVID-Xray images, so the dataset became larger with 1387 Patient images
    and 6341 normal patient images. ResNet18 was trained on the combined dataset,
    as we found a decrease in the performance of, 0.752 sensitivity and 0.711 specificity.
    Model AUC was 0.808 observed. Overall performance can not be considered as very
    good by comparison of experiments compared to it.


    # H. ResNet18 Trained on The New Dataset


    COVID-X-ray images have 184 images of COVID-19 patients and all the models trained
    on this dataset very good accuracy. Due to the very small size of the COVID 19
    samples, we cannot rely on the result of the model. Both the datasets "COVID-19
    Radiography Database" and "COVID-X-ray" were combined to merge the dataset. ResNet18
    was trained on this enhanced dataset, and it gave us promising results, sensitivity
    improved to 0.8843 and specificity improved to 0.997. AUC value was improved by
    0.989. Detail comparison can be seen in table 2.'
