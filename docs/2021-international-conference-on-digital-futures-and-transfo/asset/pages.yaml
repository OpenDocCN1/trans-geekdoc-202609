    # I. INTRODUCTION


    COVID-19 has affected the whole world and it is considered the largest pandemic
    of the 21st century. Due to COVID-19, the world is fighting with malaria, at the
    same time it is also disturbed due to lockdown in many parts of the world. Symptoms
    such as fever, headache, dyspnea, cough, fatigue, and malaise are common symptoms
    of COVID-19. In many, no symptoms are observed. It is detected with PCR, and the
    patient need to wait for four to six hours. PCR test have high sensitivity and
    specificity rate 60% to 70%; Radiology can be used as an alternative diagnostic
    method for COVID-19. X-ray and CT scan can be much faster than PCR tests. In some
    circumstances, chest X-ray values were used to give a diagnosis about COVID-19
    or not. However, several values were not normal for other diseases. However that
    the chest X-ray showed the abnormal features such as Ground glass opacities, traction
    bronchiectasis, reticulation sub pleural band, mixed consolidation GGO, vascular
    enlargement, and bronchial thickening were observed on patient. In this case,
    deep learning has made so much progress in image classification, computer vision
    [6] and medical image analysis [7]. COVID-19 affects the lungs and its abnormalities


    In this paper, four deep learning models VGG6, ResNet18, V3, and AlexNet deep
    convolution model are used on datasets. The limited data, all of the models were
    pre-trained, and the last layer was tuned with COVID-19 patient chest X-ray images.
    Another experiment was performed with ResNet18 in which the model was trained
    on the COVID-Xray-S dataset [12]. Models used on the option size of 24 the number
    of epochs was increased to 30 and ResNet18 was trained. The overall results performed
    with the full work are as follows; In the section literature review will be discussed.
    Discussion section will show the methodology, and in section four define the result
    of the work.


