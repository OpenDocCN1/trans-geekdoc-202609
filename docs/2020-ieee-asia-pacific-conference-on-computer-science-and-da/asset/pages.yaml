    contain sensitive personal information. In the UK, only daily 95 people used to
    take the help of telemedicine during the pandemic. Now the number of patients
    has been increased by 4330%, and on average, 4209 people suffered from ransomware
    attacks. Increasing numbers have caused ransomware attacks [9].


    +   2. Financial Sectors. Financial sectors have suffered many challenges during
    the COVID-19 situation. It has forced the financial sectors to provide online
    support to their clients. Again many employees did their work from home using
    the unsecured network. When the employees do in home, they are forced to adopt
    digital policies, which was noted as the ‘New Normal’. The unsecured network made
    the employees more vulnerable to cyber threats [10]. Nowadays, clients are also
    dependent on internet banking, which makes them vulnerable to hacker attacks such
    as phishing and malware. Malware are common attacks made by hackers on the financial
    sectors.


