    \ COVID-19 疫情下全球面临的网络安全威胁。为了阻止冠状病毒的传播，全球几乎所有国家都宣布了封锁。人们远程在办公室、学校和公司工作。因此，计算机和互联网的使用量大幅增加，使网络犯罪分子变得更加活跃。近期，攻击数量有所增加，每个人都成了网络犯罪分子的目标。在访问互联网时缺乏个人预防措施，对每个人都造成了重大威胁。COVID-19\
    \ 让网络犯罪分子能够入侵银行部门，政府非政府组织在此期间面临了多次网络攻击。本文重点关注某些安全防护措施，以保护个人和组织数据免受网络攻击。\n\n**索引术—**\
    \ COVID-19、网络攻击、网络钓鱼、恶意软件、DDoS 攻击、勒索软件。\n\n### I. 引言\n\nCOVID-19 的传播实际上定义了 2020\
    \ 年，世界正遭受其扩散之苦。几乎所有国家都处于封锁状态，政府要求国民在家里继续日常工作。为了阻止传播，大多数机场和边境已经关闭。这场 COVID-19 大流行迫使人们包括业务在内的所有部门实施“新常态”，以便在家办公并远程参加办公室课程。在这种情况下，信息和通信技术在满足需求\
    \ [1] 方发挥着至关重要的作用。这种在线业务模式交付和他们所需的日常物品互联网和移动应用程序成为每个人的首选，使他们容易受到网络攻击者的侵害。近期几乎所有国家都面临着网络威胁。图\
    \ 1 显示了 2020 年因大疫情引起的网络攻击研究。\n\n![](img/c20ab6723558c019dfa0ca18f0a6c48b_0_0.png)\n\
    \n图 1 各大洲面临的网络攻击\n\n网络犯罪分子正利用这一局面来利用其恶意动机，网络威胁日益增加。如此，网络安全正在发展，并成为全球社区关注的重要关注点\
    \ [2]，而世界各地的人们受到了各种网络威胁。图 2 显示了大流行期间可能的网络威胁。\n\n![](img/c20ab6723558c019dfa0ca18f0a6c48b_0_1.png)\n\
    \n图 2 COVID-19 大流行期间可能的网络威胁\n\n本研究论文的其余部分结构安排如下：第二 节描述了过去的相关工作，其中概述了过去对疫情部门可能面临的网络攻击的研究；第三节简要解释了可能面临网络攻击的疫情网络威胁，以及在大流行期间可能遇到的可信网络威胁。第四\
    \ 节展示了克服网络安全威胁的全面方法。作者得出的结论可在第五节中发现。\n\n暗网上的账户正受黑客控制。同样，Google Duo、Microsoft Team\
    \ 在流行期间也容易受到网络攻击。在这次 COVID-19 大流行期间，安全部门受网络攻击/网络威胁的影响最为严重。\n\n### II. 相关工作\n\n\
    Khan 等人提出通过加密和钓鱼来拒绝网络威胁，并发现了隐私关注问题 [1]。它还识别出少数在流行期间似乎受到网络攻击影响的部门。Krály 等人发现，信息和通信技术（ICT）有助于减轻大流行期间的心理压力。该论文侧重于使用\
    \ ICT 与家人交流，并将 ICT 称为“救救星”。另一方面，除 ICT 之外，游戏也帮助人员利用网络威胁以用户为目标。Lillie 等人通过案例研究展示了\
