    - Advanced optimizers like Adam, RMSProp, and AdaGrad adapt learning rates and
    momentum during training.


    ### Learning Rate and Hyperparameter Tuning:


    - The learning rate determines the step size of weight updates during optimization.

    - Hyperparameter tuning involves selecting optimal values for learning rate, regularization
