    # # 13.3 GRADIENT BOOSTING


    Gradient Boosting is another ensemble learning method that builds an additive
    model in a forward stepwise manner, combining the predictions of multiple weak
    learners (typically decision trees) to create a strong predictive model. Unlike
    Random Forests, which focus on reducing variance through bagging and feature randomization,
    Gradient Boosting focuses on reducing bias and improving predictive accuracy through
    iterative optimization. Here''s how Gradient Boosting works:


    **Initialization:** The process starts with an initial model, often a simple one
    like the mean value for regression tasks or a uniform class distribution for classification
    tasks.


    **Residual Calculation:** For each data point in the training set, the difference
    between the actual target value and the predicted value from the current model
    is calculated. These differences are called residuals.


    **Building Weak Learners:** A weak learner, typically a decision tree with a shallow
    depth (a "weak" tree), is trained to


    [263]


    predict these residuals. The weak learner focuses on capturing the patterns in
    the residuals that the current model couldn''t explain.


    **Step Size (Learning Rate):** A small fraction of the predictions from the weak
    learner (residual predictions) is added to the current model''s predictions. The
    magnitude of this fraction is determined by a hyperparameter called the learning
    rate. A lower learning rate can make the learning process more robust but slower.


    **Iterative Process:** Steps 2 to 4 are repeated iteratively. In each iteration,
    a new weak learner is trained to predict the residuals of the previous model.
    The predictions from all the weak learners are combined, and the residuals are
    updated. The process continues until a predefined number of iterations is reached
    or until a certain level of performance is achieved.


    **Combining Weak Learners:** The final prediction from the Gradient Boosting model
    is the sum of the predictions from all the weak learners, each scaled by the learning
    rate. This additive nature of the model allows it to gradually correct errors
    made by previous models.


    [264]


    **Regularization (Optional):** Gradient Boosting models can also include regularization
    techniques to prevent overfitting. One common approach is to add a penalty term
    to the loss'
