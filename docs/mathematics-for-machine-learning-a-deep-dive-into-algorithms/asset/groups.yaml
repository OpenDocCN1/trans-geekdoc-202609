    # 13.1 DECISION TREE CONSTRUCTION


    Decision Trees are a popular machine learning algorithm used for both classification
    and regression tasks. They work by recursively partitioning the input feature
    space into subsets that are as homogeneous as possible with respect to the target
    variable. The construction of a decision tree involves selecting features to split
    on and determining the splitting criteria at each node. Here''s an overview of
    the decision tree construction process:


    **Root Node:** The initial step is to select the best feature to split the dataset.
    The chosen feature is the one that best separates the data based on some criterion,
    often aiming to minimize impurity or maximize information gain.


    **Splitting Criteria:** The chosen splitting criterion depends on the type of
    task. For classification, common criteria include Gini impurity and entropy, which
    measure the level of disorder or randomness in a set of labels. For regression,
    mean squared error (MSE) is a common criterion that quantifies the variance of
    target values within subsets.


    [257]


    **Splitting Process:** Once the initial feature is selected, the dataset is split
    into subsets based on the possible values of that feature. Each subset corresponds
    to a branch stemming from the root node. The process then repeats recursively
    for each subset.


    **Stopping Criteria:** The recursion continues until a stopping criterion is met.
    Stopping criteria could include reaching a maximum depth of the tree, having a
    minimum number of samples in a node, or reaching a threshold in impurity reduction.


    **Leaf Nodes:** When the stopping criteria are met, terminal nodes, known as leaf
    nodes, are created. These nodes represent the final predictions for classification
    or regression tasks. For classification, the majority class in the leaf node is
    often chosen as the predicted class. For regression, the average or median target
    value of the samples in the leaf node is used as the prediction.


    **Pruning (Optional):** After constructing the full tree, pruning can be applied
    to prevent overfitting. Pruning involves removing branches that do not contribute
    significantly to [258]

    improving model performance on validation data. This leads to a simpler and more
    generalizable tree.'
