    function that measures the complexity of the model.


    **Hyperparameter Tuning**: Gradient Boosting has hyperparameters such as the number
    of weak learners, the learning rate, and the maximum depth of the weak learners.
    These parameters need to be tuned using techniques like grid search or random
    search.


    Gradient Boosting is a powerful technique that often outperforms other machine
    learning algorithms due to its ability to capture complex relationships in the
    data. It''s widely used in both regression and classification tasks, and popular
