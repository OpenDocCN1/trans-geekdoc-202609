    that divides data points into groups based on the spectral properties of a matrix
    derived from the data. By utilizing the eigenvectors of this matrix, spectral
    clustering can uncover hidden structures and clusters in data.


    *Kernel PCA:* Kernel Principal Component Analysis (Kernel PCA) uses the notion
    of eigenvectors in a feature space, even if the transformation to that space is
    nonlinear. This is achieved through kernel functions, which allow linear operations
