    # 11.2 HIERARCHICAL CLUSTERING


    Hierarchical Clustering is another powerful unsupervised machine learning technique
    used for grouping data points into clusters. Unlike K-Means, Hierarchical Clustering
    doesn''t require specifying the number of clusters beforehand. Instead, it creates
    a hierarchical structure of clusters that can be visualized as a tree-like diagram
    (dendrogram). This technique is particularly useful when data exhibits nested
    or hierarchical relationships. Let''s explore the intricacies of Hierarchical
    Clustering:


    # Algorithm Overview:


    +   • Initialization: Each data point starts as its own cluster.

    +   • Merge or Agglomerate: Similar clusters are merged iteratively based on a
    chosen linkage criterion (e.g., single linkage, complete linkage, average linkage)
    that defines how to measure similarity between clusters.

    +   • Dendrogram: As clusters are merged, a dendrogram is constructed, showing
    the hierarchy of cluster formations.


    > [226]


    # Linkage Criteria:


    +   • Single Linkage: Measures the distance between the closest points of two
    clusters. Prone to "chaining" small clusters together.

    +   • Complete Linkage: Measures the distance between the farthest points of two
    clusters. More robust to outliers and "chaining."

    +   • Average Linkage: Measures the average distance between all pairs of points
    in two clusters.


    # Advantages:


    +   • Hierarchy Visualization: Hierarchical Clustering produces a dendrogram,
    allowing practitioners to explore the data''s hierarchy and nested relationships.

    +   • No Fixed Number of Clusters: Unlike K-Means, Hierarchical Clustering doesn''t
    require specifying the number of clusters in advance.

    +   • Robustness: Hierarchical Clustering''s ability to consider all data points
    in the hierarchy can mitigate the effects of noise and outliers.


