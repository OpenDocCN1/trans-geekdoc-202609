- pgno: 253
  md: '+   • Exercise: Define the vanishing gradient problem in recurrent neural networks.


    +   • Solution: The vanishing gradient problem occurs when gradients in backpropagation
    become extremely small in deep RNNs, leading to slow convergence and difficulty
    in learning long-range dependencies.


    # Chapter 11: Unsupervised Learning: Clustering and Dimensionality Reduction


    +   • Exercise: Describe the K-Means clustering algorithm and its steps.


    +   • Solution: K-Means is an iterative algorithm that partitions data into ''k''
    clusters. It starts with initial centroids, assigns points to the nearest centroid,
    recalculates centroids, and repeats until convergence.


    # Chapter 12: Regularization and Regularized Regression


    +   • Exercise: Compare Ridge and Lasso regularization techniques.


    [312]


    +   • Solution: Ridge adds L2 regularization by penalizing large coefficient values,
    while Lasso adds L1 regularization and can lead to sparse coefficients, effectively
    performing feature selection.


    # Chapter 13: Decision Trees and Ensemble Learning


    +   • Exercise: Explain the concept of bagging in ensemble methods.


    +   • Solution: Bagging (Bootstrap Aggregating) involves training multiple models
    on random subsets of the training data with replacement and averaging their predictions
    to reduce overfitting.


    # Chapter 14: Neural Network Architectures


    +   • Exercise: Describe the purpose of autoencoders in neural network architectures.


    +   • Solution: Autoencoders are used for unsupervised learning and dimensionality
    reduction by learning efficient data representations in an encoder-decoder structure.


    [313]


