    **Use Cases:** Simple Linear Regression is used for tasks like predicting sales
    based on advertising spending, estimating the impact of study time on exam scores,
    and analyzing how temperature affects energy consumption.


    **Extensions:** Simple Linear Regression serves as the foundation for more complex
    regression techniques, such as Multiple Linear Regression, Polynomial Regression,
