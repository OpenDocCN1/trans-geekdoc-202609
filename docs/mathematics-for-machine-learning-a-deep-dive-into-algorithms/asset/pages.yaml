    # Use Cases:


    +   - In linear regression, regularization techniques like Lasso and Ridge are
    applied to prevent overfitting and improve model stability.

    +   - In feature selection, L1 regularization (Lasso) can be used to identify
    and retain the most important features while discarding irrelevant ones.

    +   - In machine learning algorithms like logistic regression and support vector
