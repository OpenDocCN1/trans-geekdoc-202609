- pgno: 168
  md: '# 10.2 RNN ARCHITECTURE


    Recurrent Neural Networks (RNNs) are a class of neural networks designed to handle
    sequential data by capturing and utilizing temporal dependencies. Unlike traditional
    feedforward neural networks, RNNs have connections that loop back on themselves,
    allowing them to maintain memory of past inputs and process sequences effectively.


    # Basic Structure:


    +   • At each time step, an RNN takes an input (usually a vector representing
    an element in the sequence) and combines it with the previous hidden state to
    produce an output and update the current hidden state.

    +   • The hidden state serves as a form of memory that encodes information from
    previous steps.


    # Mathematical Formulation:


    +   • Mathematically, an RNN''s hidden state update at time step t can be represented
    as:


    ```

    [205]

    ht = f(Whx Xt + Whh Xt-1 + bh)

    where:

    ```


    +   • xt is the input at time step t.

    +   • ht is the hidden state at time t.

    +   • Whx is the weight matrix for the input.

    +   • Whh is the weight matrix for the hidden state.

    +   • bhis the bias term,

    +   • f is the activation function (commonly tanh or ReLU).


    # Unrolling Over Time:


    +   • RNNs are often visualized as unrolled sequences, where the network unfolds
    in time steps.

    +   • Each unrolled time step represents the same set of weights and biases being
    reused.


    # Vanishing Gradient Problem:


    +   • A major challenge with RNNs is the vanishing gradient problem, where gradients
    become too small to effectively update the weights during backpropagation through
    time.'
  merge: -1
  img_proc: true
