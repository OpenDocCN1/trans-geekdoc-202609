- pgno: 164
  md: '# 10.1 SEQUENTIAL DATA


    Sequential data refers to data where the order of elements matters, and each element
    is influenced by the preceding elements in the sequence. Examples of sequential
    data include time series, natural language sentences, DNA sequences, and more.
    Recurrent Neural Networks (RNNs) are designed to effectively handle such data
    by capturing and utilizing the temporal dependencies present in the sequence.


    # Challenges of Sequential Data:


    +   • Sequential data often exhibits complex patterns and relationships that evolve
    over time.

    +   • Traditional machine learning models struggle to capture these temporal dependencies
    and patterns.


    # Temporal Dependency and RNNs:


    +   • RNNs are uniquely suited for handling sequential data due to their inherent
    ability to maintain memory of previous inputs in the sequence.


    [200]


    +   • They process each element in the sequence while maintaining an internal
    hidden state that encodes past information.


    # Recurrent Neurons:


    +   • The key to RNNs is the recurrent neuron, which processes the current input
    along with the previous hidden state to produce an output and update the hidden
    state.

    +   • This hidden state acts as a form of memory, allowing the network to remember
    past information.


    # Vanishing and Exploding Gradients:


    +   • RNNs can suffer from vanishing and exploding gradient problems during training.

    +   • Long sequences can lead to gradients that either become too small (vanishing)
    or too large (exploding), making learning difficult.'
  merge: -1
  img_proc: true
