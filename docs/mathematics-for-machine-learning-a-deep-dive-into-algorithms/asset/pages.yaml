  md: '# # 8.1 PERCEPTRONS AND ACTIVATION FUNCTIONS


    Perceptrons and activation functions are fundamental components of neural networks,
    forming the building blocks of complex architectures that underpin the field of
    deep learning. They play a vital role in transforming input data, introducing
    non-linearity, and enabling neural networks to model intricate relationships in
    data.


    # ## Perceptrons: Neurons of Neural Networks


    +   - A perceptron is a simplified model of a biological neuron. It takes multiple
    input signals, applies weights to them, and produces an output signal.

    +   - The weighted sum of inputs, along with a bias term, is passed through an
    activation function to produce the output.

    +   - Mathematically, the output of a perceptron can be expressed as: Output =
    Activation(Weighted Sum + Bias)


    [158]


    # ## Activation Functions: Introducing Non-linearity


    +   - Activation functions introduce non-linearity to neural networks, enabling
    them to approximate complex functions.

    +   - Without non-linearity, neural networks would behave like linear models,
    severely limiting their capacity to capture intricate patterns.

    +   - Common activation functions include:

    +   - Sigmoid: Maps input to a range between 0 and 1, useful for binary classification.

    +   - ReLU (Rectified Linear Unit): Outputs input for positive values and zero
    for negative values, avoiding vanishing gradients.

    +   - Tanh (Hyperbolic Tangent): Maps input to a range between -1 and 1, similar
    to sigmoid but centered at zero.

    +   - Softmax: Used in the output layer for multi-class classification, converts
    raw scores into probability distributions.


    # ## Feedforward Neural Networks: Stacking Perceptrons


    +   - A feedforward neural network is constructed by stacking layers of perceptrons.
    Each layer'
