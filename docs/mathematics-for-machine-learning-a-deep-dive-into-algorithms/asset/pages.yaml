  md: '# 13.4 XGBOOST AND LIGHTGBM


    XGBoost is an optimized and highly efficient implementation of the Gradient Boosting
    algorithm. It was designed to improve upon the limitations of traditional Gradient
    Boosting and has become one of the most popular and powerful machine learning
    libraries. XGBoost is known for its robustness, scalability, and high performance.
    Here are some key features and characteristics of XGBoost:


    +   **Regularization:** XGBoost incorporates both L1 (Lasso) and L2 (Ridge) regularization
    terms into its cost function. This helps prevent overfitting and contributes to
    better generalization.


    +   **Handling Missing Values:** XGBoost can handle missing values during the
    training and prediction processes. It learns the optimal direction to handle missing
    data points.


    +   **Built-in Cross-Validation:** XGBoost supports built-in cross-validation,
    which simplifies the process of finding the optimal number of boosting rounds.


    [266]


    +   **Tree Pruning:** It applies a depth-first approach during tree construction
    and prunes trees using "max_depth" parameter to control their complexity.


    +   **Parallel Processing:** XGBoost supports parallel processing, making it faster
    and more efficient, especially for large datasets.


    +   **Flexible Objective Functions:** It allows users to define their own custom
    objective functions, which is useful for specific problem domains.


    +   **Weighted Instances:** XGBoost can assign different weights to different
    instances, which is helpful when dealing with imbalanced datasets.


    # **LightGBM (Light Gradient Boosting Machine):**


    LightGBM is another popular gradient boosting framework that is specifically designed
    for speed and efficiency. It''s developed by Microsoft and is known for its ability
    to handle large datasets and outperform other gradient boosting implementations
    in terms of training time.


    [267]


    **Here are some key features and characteristics of LightGBM:**


    +   **Histogram-Based Approach:** LightGBM uses a histogram-based approach to
    bin continuous features, which significantly reduces memory usage and speeds up
    the training process.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '**Gradient-Based One-Side Sampling:** LightGBM uses a gradient-based approach
    for selecting data samples for tree construction, leading to faster convergence
    and reduced overfitting.


    **Leaf-Wise Tree Growth:** Unlike traditional depth-first tree growth, LightGBM
    uses a leaf-wise tree growth strategy, which can lead to deeper trees and better
    model performance.


    **Categorical Feature Support:** LightGBM can handle categorical features directly,
    without the need for one-hot encoding.


    [268]


    **Parallel and GPU Learning:** LightGBM supports parallel processing and GPU acceleration,
    further enhancing its speed and scalability.


    **Monotonic Constraints:** It allows users to define monotonic constraints for
    features, which enforces a desired relationship between features and the target
    variable.


    Both XGBoost and LightGBM are highly efficient, and the choice between them often
    depends on the specific dataset, problem complexity, and available resources.
    They have a wide range of hyperparameters that can be tuned to achieve the best
    performance on a given task.'
