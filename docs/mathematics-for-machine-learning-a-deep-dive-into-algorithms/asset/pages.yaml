  md: '# 14.3 TRANSFORMERS


    Transformers are a groundbreaking neural network architecture introduced by Vaswani
    et al. in the paper "Attention Is All You Need" in 2017. They were initially designed
    for natural language processing tasks, such as machine translation, but have since
    become the foundation for many state-of-the-art models in various domains, including
    language, vision, and even protein folding. Transformers are particularly effective
    for tasks that involve sequences of data, making them versatile and powerful.


    The key innovation in Transformers is the self-attention mechanism, which enables
    the model to weigh the importance of different words or elements in a sequence
    when making predictions. This mechanism allows Transformers to capture long-range
    dependencies and relationships in data more effectively than traditional recurrent
    or convolutional networks.


    Here''s an overview of the components and functioning of Transformers:


    [279]


    **Self-Attention:** The self-attention mechanism computes a weighted sum of the
    input sequence elements, where the weights are determined by the relationships
    between elements. It assigns higher weights to elements that are more relevant
    for each prediction.


    **Multi-Head Attention:** To capture different aspects of relationships, Transformers
    use multiple attention mechanisms in parallel, each referred to as a "head." This
    multi-head attention mechanism enhances the model''s ability to focus on various
    patterns and relationships.


    **Positional Encoding:** Unlike recurrent networks that inherently capture sequence
    order, Transformers lack this property. To overcome this, positional encodings
    are added to the input embeddings to provide information about the position of
    each element in the sequence.


    **Encoder and Decoder Stacks:** Transformers consist of an encoder and a decoder
    stack. The encoder processes the input sequence and generates a representation,
    while the decoder generates the output sequence. Both encoder and decoder contain
    multiple layers of self-attention and feed-forward neural networks.


    [280]


    **Attention Masks:** For tasks that involve sequence-to-sequence mapping, such
    as machine translation, attention masks are used to ensure that predictions are
    made based only on the available information at each step.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Positional-wise Feed-Forward Networks: After the self-attention mechanism,
    each position in the sequence undergoes a feed-forward neural network transformation
    that captures complex interactions between elements.


    Layer Normalization and Residual Connections: Similar to other deep neural networks,
    Transformers use layer normalization and residual connections to stabilize and
    speed up training.


    Transformers have paved the way for various models, including BERT, GPT, T5, and
    more, each designed to excel in specific tasks. They''ve revolutionized natural
    language processing tasks, enabling models to understand context, contextually
    generate text, perform document classification, and much more. Additionally, their
    architecture has been adapted to computer vision tasks, such as image captioning
    and object detection, further highlighting their versatility and effectiveness
    across different domains.


    [281]'
