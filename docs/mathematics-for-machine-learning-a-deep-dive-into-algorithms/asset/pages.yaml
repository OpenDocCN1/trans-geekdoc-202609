  md: '# 8.4 TRAINING NEURAL NETWORKS


    Training neural networks involves iteratively adjusting the model''s parameters,
    such as weights and biases, to minimize the difference between predicted and actual
    outcomes. This process, driven by optimization algorithms, allows neural networks
    to learn and generalize from data, enabling them to make accurate predictions
    on new, unseen examples.


    # *Data Preparation:*


    +   - Before training, data needs to be preprocessed, including normalization,
    scaling, and splitting into training, validation, and test sets.

    +   - Data augmentation techniques can also be employed to increase the diversity
    of training data, especially for image-related tasks.


    # *Initialization:*


    +   - Proper initialization of weights and biases is crucial to prevent training
    issues like vanishing or exploding gradients.

    +   - [172]

    +   - Common methods include using random initialization or techniques like Xavier/Glorot
    initialization.


    # *Loss Function:*


    +   - The loss function (also known as the cost function) quantifies the difference
    between predicted and actual outcomes.

    +   - Common loss functions include mean squared error for regression and categorical
    cross-entropy for classification.


    # *Optimization Algorithms:*


    +   - Optimization algorithms update weights and biases to minimize the loss function.

    +   - Stochastic Gradient Descent (SGD) is a common optimization algorithm, with
    variants like Mini-batch SGD and Batch Gradient Descent.

    +   - Advanced optimizers like Adam, RMSProp, and AdaGrad adapt learning rates
    and momentum during training.'
