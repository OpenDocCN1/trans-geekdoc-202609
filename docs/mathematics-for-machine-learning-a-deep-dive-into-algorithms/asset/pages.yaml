    +   • Convolutional layers apply filters (kernels) to local receptive fields of
    the input image.

    +   • Filters detect specific features such as edges, textures, and corners.

    +   • Convolution involves element-wise multiplication and summation of the filter
    and receptive field values.


    # Stride and Padding:


    +   • The stride determines the step size of the filter''s movement across the
    input.


    [183]


    +   • Padding involves adding extra pixels around the input, which maintains spatial
    dimensions after convolution.


    # Shared Weights:


    +   • One of the key features of convolutional layers is weight sharing.

    +   • Filters are reused across the entire input image, allowing the network to
    detect the same features in different spatial locations.


    # Feature Maps:


    +   • Each filter produces a feature map that highlights the presence of a specific
    feature in the input.

    +   • Multiple filters in a convolutional layer create a set of feature maps,
    each capturing a different aspect of the input.


