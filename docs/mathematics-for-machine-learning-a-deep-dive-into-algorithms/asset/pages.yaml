  md: '# 3.2 RANDOM VARIABLES AND PROBABILITY DISTRIBUTIONS


    Random variables and probability distributions are fundamental concepts in machine
    learning that enable us to model and analyze uncertain data. They provide a formal
    framework for understanding the likelihood of different outcomes and play a crucial
    role in tasks ranging from data generation to statistical inference. Here''s a
    closer look at how random variables and probability distributions contribute to
    the machine learning landscape:


    **Random Variables:** A random variable is a variable that can take on different
    values, each associated with a certain probability. In machine learning, random
    variables are used to represent uncertain or variable quantities, such as the
    outcome of a dice roll or the price of a stock at a certain time.


    **Discrete Random Variables:** Discrete random variables have a countable set
    of possible values. Examples include the outcome of a coin flip (heads or tails)
    or the number of cars passing through an intersection in a given time interval.


    [75]


    **Continuous Random Variables:** Continuous random variables can take on any value
    within a certain range. Examples include the height of a person or the temperature
    in a specific location.


    **Probability Mass Function (PMF):** For a discrete random variable, the probability
    mass function assigns probabilities to each possible value. It describes the distribution
    of the random variable''s outcomes.


    **Probability Density Function (PDF):** For a continuous random variable, the
    probability density function specifies the relative likelihood of the variable
    taking on different values within a range. The area under the PDF over a certain
    interval corresponds to the probability of the variable falling within that interval.


    **Cumulative Distribution Function (CDF):** The cumulative distribution function
    gives the probability that a random variable takes on a value less than or equal
    to a given value. It provides a complete description of the distribution of a
    random variable.


    [76]'
  merge: -1
  img_proc: true
