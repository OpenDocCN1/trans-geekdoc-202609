- pgno: 252
  md: '# Chapter 6: Classification


    +   * Exercise: Given a binary classification problem with true positive (TP)
    = 30, false positive (FP) = 10, true negative (TN) = 50, and false negative (FN)
    = 20, calculate the accuracy and F1-score.


    +   * Solution: Accuracy = $\frac{\{TP + TN\}}{\{TP + TN + FP + FN\}} = \frac{\{30
    + 50\}}{\{30 + 50 + 10 + 20\}} = 0.8$. F1-score = $\frac{2 \cdot \text{Precision}
    \cdot \text{Recall}}{\text{Precision} + \text{Recall}}$.


    # Chapter 7: Support Vector Machines


    +   * Exercise: Given a linearly separable dataset, explain the concept of the
    margin in a support vector machine.


    [310]


    +   * Solution: The margin is the distance between the decision boundary and the
    nearest data point from either class. A larger margin indicates better generalization
    to unseen data.


    # Chapter 8: Neural Networks and Deep Learning Basics


    +   * Exercise: Describe the purpose of activation functions in neural networks.


    +   * Solution: Activation functions introduce non-linearity, allowing neural
    networks to learn complex relationships between features and improve their capacity
    to model a wide range of functions.


    # Chapter 9: Convolutional Neural Networks (CNNs)


    +   * Exercise: Explain the concept of pooling layers in CNNs and their role in
    reducing spatial dimensions.


    +   * Solution: Pooling layers downsample the spatial dimensions of the input
    while retaining important features. Common pooling types include max pooling and
    average pooling.


    [311]


    # Chapter 10: Recurrent Neural Networks (RNNs)'
