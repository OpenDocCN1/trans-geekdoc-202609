    **Variance and Standard Deviation:** Variance quantifies the spread or variability
    of a random variable''s values around its mean. Standard deviation is the square
    root of the variance. They provide insights into the variability of outcomes.


    **Probability Distributions:** Probability distributions describe how probabilities
    are distributed over the possible values of a random variable. Common distributions
    include the Bernoulli distribution, the Normal distribution, the Exponential distribution,
    and the Poisson distribution.


    **Multivariate Distributions:** Multivariate distributions describe the joint
    behavior of multiple random variables. They are used to model relationships and
