  md: '# # 6.3 BINARY VS. MULTICLASS CLASSIFICATION


    Binary Classification and Multiclass Classification are two fundamental types
    of classification problems in machine learning. While both involve assigning instances
    to predefined classes, they differ in terms of the number of classes and the techniques
    used to address them. Let''s examine the key differences and characteristics of
    these two scenarios:


    # ### Binary Classification:


    +   1. **Number of Classes:** In binary classification, there are exactly two
    classes or categories. Examples include spam detection (spam or not spam), medical
    diagnosis (disease present or absent), and sentiment analysis (positive or negative
    sentiment).


    +   1. **Output:** The output of a binary classification model is typically a
    single probability score or a binary label (0 or 1) indicating the predicted class
    for each instance.


    +   1. **Algorithms:** Algorithms commonly used for binary classification include
    Logistic Regression, Support Vector Machines (SVMs), Decision Trees, Random Forests,
    and Neural Networks.


    +   1. **Evaluation Metrics:** Common evaluation metrics for binary classification
    include Accuracy, Precision, Recall (Sensitivity), F1-Score, ROC Curve, and AUC.


    +   1. **One-vs-Rest (OvR):** Some algorithms, like SVMs and Softmax Regression,
    can be adapted to handle multiclass problems by using the One-vs-Rest (OvR) approach.
    This involves training multiple binary classifiers, each for one class versus
    the rest.


    # ### Multiclass Classification:


    +   1. **Number of Classes:** In multiclass classification, there are three or
    more classes or categories. Examples include image recognition (identifying objects
    in images), language identification (detecting the language of a text), and music
    genre classification.


    +   1. **Output:** The output of a multiclass classification model is typically
    a probability distribution over all classes, indicating the likelihood of each
    class for a given instance.


    [130]'
  merge: -1
  img_proc: true
- pgno: 110
  md: '+   1. **Algorithms:** Algorithms used for multiclass classification include
    Softmax Regression, Decision Trees, Random Forests, k-Nearest Neighbors (k-NN),
    Naive Bayes, and Neural Networks.


    +   1. **Evaluation Metrics:** Evaluation metrics for multiclass classification
    include Accuracy, Precision, Recall, F1-Score (which can be extended to the multiclass
    case), Confusion Matrix, and multiclass versions of ROC Curve and AUC.


    +   1. **Softmax Regression:** Softmax Regression is a specific algorithm designed
    for multiclass classification. It extends the concept of Logistic Regression to
    handle multiple classes and predicts the probabilities of each class.


    +   1. **One-vs-One (OvO):** Another approach to handling multiclass problems
    is One-vs-One (OvO), where a binary classifier is trained for every pair of classes.
    The class that wins the most binary comparisons is selected as the final prediction.


    [131]


    # **Decision Boundary:**


    +   • In binary classification, the decision boundary is a line or surface that
    separates the two classes.


    +   • In multiclass classification, the decision boundary can be more complex,
    involving multiple regions for each class. It depends on the specific algorithm
    used.


    # **Use Cases:**


    +   • Binary classification is suitable for scenarios where the problem involves
    two distinct outcomes.


    +   • Multiclass classification is used when there are multiple distinct categories
    or classes that instances need to be assigned to.


    In summary, the distinction between binary and multiclass classification lies
    in the number of classes and the techniques used to address them. Binary classification
    deals with two classes, while multiclass classification handles three or more.
    The choice between the two depends on the nature of the problem and the available
    data.'
