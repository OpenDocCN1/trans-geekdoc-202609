    # V. CONCLUSION


    This study proposed an SVM-IDS approach based on deep learning to suggest an efficient
    system of IDs. To test anomaly detection accuracy, we used the synthetic-based
    intrusion dataset - NSL-KDD. We plan to implement IDS into the cloud environment
    in the future using the deep learning technique. We also analyze and compare various
    methods of deep learning, namely. To detect intrusions in the network, NB ANN,
    RF, and SVM on the NSL-KDD dataset; The program essentially acts as artificial
    intelligence and conditioning algorithm to determine the unknown instances during
    the data check. The efficient rule structure makes for improved classification
    and high-class detection. Various experiments used experimental analysis to assess
    the algorithm''s efficiency using several tests and conclude that we are achieving
    satisfactory results.


