    Abstract- Computer network and virtual machine security is very essential in today''s
    era. Various architectures have been proposed for network security or prevent
    malicious access of internal or external users. Various existing systems have
    already developed to detect malicious activity on victim machines; sometimes any
    external user creates some malicious behavior and gets unauthorized access of
    victim machines to such a behavior system considered as malicious activities or
    Intruder. Numerous machine learning and soft computing techniques design to detect
    the activities in real-time network log audit data. KKDDCUP99 and NLSKDD most
    utilized data set to detect the Intruder on benchmark data set. In this paper,
    we proposed the identification of intruders using machine learning algorithms.
    Two different techniques have been proposed like a signature with detection and
    anomaly-based detection. In the experimental analysis, demonstrates SVM, Naive
    Bayes and ANN algorithm with various data sets and demonstrate system performance
    on the real-time network environment.


    Keywords- Intrusion Detection System, Network security, Naïve Bayes, SVM, Artificial
    Neural Network, KDDCUP99.


    # ## I. INTRODUCTION


    The IDS is exclusively for detecting one type of attack, e.g. Sample or known
    attack, DoS attack or U2R attack or R2L attack. It then sequentially deploys a
    number of such subsystems, one by one. This serves a two-fold purpose: first,
    only a limited number of features that detect a particular type of attack can
    be trained in each sub-phase. Second, the sub-size device remains tiny and therefore
    functional. Similar to our scheme, a common downside is that it raises overhead
    communication between modules. However by having every sub-phase completely independent
    of each other layer, this can be easily avoided in our method. As a consequence,
    in more than one sub-phase, such characteristics may happen. Any sub-phase will
    simply block an attack if detected without a central decision maker, depending
    on the security policy of the network. As long as they are established during
    a certain layer, various sub phases primarily serve as filters blocking abnormal
    association, thus providing rapid reaction to the intrusion as well as reducing
    the analysis in subsequent stages.


    The method defines the system for creating SVM rules in this research work, based
    on its role selection procedure, which works on both HIDS and NIDS. A genetic
    algorithm is an optimization algorithm used to find the best solution. For all
    types of master class sub-attacks, the ensemble approach with different classification
    algorithms may provide the best detection of NIDS. Our aim of the proposed


    study is to create clear rules and increase the detection rates of DOS, PROBE,
    U2R and R2L for NIDS and HIDS.


