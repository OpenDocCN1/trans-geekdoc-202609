    # MLIDS: 用于实时网络数据集入侵检测的机器学习方法


    Monika D. Rokade

    研究员，计算机科学与工程系

    施里·J.J.T.大学，

    拉贾斯坦邦，印度

    monikarokade4@gmail.com


    Yogesh Kumar Sharma

    副教授（系主任/研究协调员），

    计算机科学与工程系，

    印度

    dr.sharmayogeshkumar@gmail.com


    摘要: 计算机网络和虚拟机安全在当今时代至关重要。已提出各种用于网络安全或防止内部或外部用户恶意访问的架构。各种现有系统已开发用于检测受害机器上的恶意活动；有时，任何外部用户都会创造某种恶意行为，并未经授权访问受害机器，此类行为被系统视为恶意活动或入侵者。众多机器学习和软计算技术旨在检测实时网络日志审计数据中的活动。KDDCUP99
    和 NSL-KDD 是用于在基准数据集上检测入侵者最常用的数据集。在本文中，我们提出了使用机器学习算法识别入侵者的方法。已提出两种不同的技术，即基于签名的检测和基于异常的检测。在实验分析中，展示了
    SVM、朴素贝叶斯和 ANN 算法，并结合各种数据集，证明了系统在实时网络环境中的性能。


    关键词: 入侵检测系统、网络安全、朴素贝叶斯、SVM、人工神经网络、KDDCUP99。


    ### I. 引言


    IDS 专用于检测一种攻击，例如样本或已知攻击、DoS 攻击、U2R 攻击或 R2L 攻击。然后它依次部署多个此类子系统，逐个部署。这起到了双重作用：首先，在每个子阶段中，只能训练有限数量的用于检测特定类型攻击的特征。其次，子尺寸设备保持微小，因此功能正常。与我们的方案类似，常见的缺点是它增加了模块之间的通信开销。然而，通过让每个子阶段与其他各层完全独立，在我们的方法中可以轻松避免这一问题。因此，在多个子阶段中，可能会出现此类特征。任何子阶段都会在检测到攻击时直接拦截，无需中央决策者，具体取决于网络的安全策略。只要它们在特定层中建立，各种子阶段主要充当过滤器，阻止异常关联，从而对入侵提供快速响应，并减少后续阶段的分析量。


    本研究工作中的方法定义了用于创建 SVM 规则的系统，该系统基于角色选择过程，并同时适用于 HIDS 和 NIDS。遗传算法是一种用于寻找最优解的优化算法。对于所有类型的主类子攻击，采用不同分类算法的集成方法可能为
    NIDS 提供最佳检测效果。本拟议研究的目标是制定清晰规则，并提高 NIDS 和 HIDS 对 DOS、PROBE、U2R 和 R2L 的检测率。


    ### II. 文献综述


    Bhosale, Karuna S. et al. [1] 研究了深度神经网络 (DNN)，将创建可扩展且高效的 IDS 以识别意外和非预期网络攻击作为一种深度学习系统。网络操作的不断变化和攻击的快速创建涉及通过动态和静态技术，审查多年来生成的频繁发生的情况。此类研究有助于识别能够有效预测未来网络攻击的正确算法。对
    DNN 实验和其他强大的机器学习分类器的全面评估显示在众多公共信息测试恶意软件数据库中。DNN 的优化网络参数和调制方案是使用 KDDCup 99 数据集选择的，系统使用的隐藏层数量大约由系统决定。


    Chamou et al. [2]。正是由于这一原因，科学界已习惯于入侵检测系统的复杂性和效率提升，全球大量公司正在不断面临新出现和新兴威胁的针对性攻击和威胁。这是一种使用深度学习模型评估
    DDoS 和恶意软件网络威胁中可疑活动的突破性工具。根据大多数互联网用户的观点，由于 Web 应用程序及其使用的快速增长，网络安全效率、数据保护和安全通信被视为重要。同时，在学术界和工业界的数字世界中，尤其是中小型企业
    (SMEs)，计算机和互联网网络面临更复杂安全威胁的暴露程度有所增加，产生了经济影响。


    根据 [3]，已经开发出一种系统，通过使用各种无决策、随机森林和 KNN 来准确检测潜在攻击。建议采用一种新技术来解决先前方法无法检测 IPV6 攻击的不足。在检测基于
    IPV4 的攻击时，既定框架在可能的范围内产生了令人印象深刻且高效的结果，已测量了不同算法的效率。测量了检测一致性、准确率和召回率百分比。


    根据 [4]，可以有效地使用一种称为 NEC 的新现象、聚类和 KDD。使用无监督异常来产生高检测率和更低的假阴性率。这是解决该问题并发现不涉及收集标记数据的异常的有效方法。使用
    2009 年 NSL-KDD 数据集来测试系统。预处理模型将所有特征转换为实际数值，标准化后的数据集将在评估部分末尾将预测结果与准确结果进行比较。


    为确保针对 CSID 数据挖掘和机器学习调查 [5] 的网络安全，开展了一项关于网络安全入侵检测的数据挖掘和机器学习调查。访问数据包头和净流数据包头用于网络和内核级数据的入侵检测过程，潜在问题是，如果没有实际数据库，就无法实现数据挖掘和人工智能，因此非常耗时。讨论了各种统计和机器学习算法的存在。该研究论文包含一组用于机器学习数据挖掘方法异常的比较标准——依赖式入侵检测有助于发现、评估和识别信息系统的未授权使用、复制、篡改和破坏。


    根据 [6]，使用机器学习、排名和 Voronoi 对入侵者进行检测和监控，安全性得到了提高。即给定数据集的大小和检测的高精度。在考虑处理延迟的情况下，使用了一系列称为
    ISOT 的数据。该论文还使用网络流特性来预测僵尸网络渗透，前提是具备数据包合规性特征，这有助于数据包加密。


    根据 ADS-B IDS [7]，提出了使用 ADS-B 技术的基于自动相关监视广播的 IDS 技术。为了增强航空交通管制性能，使用了 HMAC 数据集。这些方法的开销最小。未来范围规定，其与相应一次位置的距离在安全区域内，以便
    ADS-B 位置有效。GPS 使用经过攻击检测验证的网络物理环境，以确定飞机信号的雷达规格，实现卓越的位置精度，因为 ADS-B 已成为当前无线电的替代方案。建议了一种安全交换
    HMAC 算法使用的密钥的协议。ATC 中心与监测航线另一区域的 ATC 进行牢固握手，通过公钥基础设施 (PKI) 网络传输私钥。


    根据 [8]，报告指出，对于支持数据日志的电源设备，使用安全进程挖掘创建了结合数据挖掘的组合 IDS。该方法是设计 IDS 原型的一种集成方法。检测精度高达
    73%，是其关键优势之一。但是，该方法不足以收集数据日志等主要问题，尽管这很棘手。该框架利用特征和基于规范的 IDS 功能。数据分析方法整合审计日志，以了解不同机器设备的典型路径。在自动化系统中，无需手动分析和编码序列。


    根据 Al, Dr. Yogesh Kumar Sharma et al. [10]，定义了一种基于软件定义网络的 6G 网络接入系统和边缘辅助拥塞规则机制。为了避免流量流缓冲，该框架必须处理大频率数据。该拟议方法的评估结果表明，它可能最大限度地提高网络效率。另一个问题是网络安全，因为集中式安全框架对于在整个网络中保持数据可靠性至关重要。用户在传输和连接时需要保护，因为数据恶意或盗版的可能性更大。另一种网络虚拟化切片形式是网络优化，用于避免缓慢的无线宽带，且宽带速度不得阻碍个人。该软件建议使用系统切片边缘接入系统模型。


