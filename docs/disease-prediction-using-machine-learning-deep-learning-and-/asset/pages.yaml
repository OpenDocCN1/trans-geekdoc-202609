    there is a possibility to extend the applications of DL networks for severity
    detection of more number of diseases.


    # CONCLUSION


    In this chapter, the authors studied the research works available in the literature
    to recognize the role of machine learning and deep learning techniques in the
    prediction of disease severity. They also presented the comparative analysis of
    various ML and DL techniques proposed in the literature. Based on the study, it
    is concluded that ML techniques are employed on the primary data such as age,
    gender; clinical data obtained by blood tests, urine tests, ECG, etc. Further
    as it is concluded that the parameters recorded by blood tests are more significant
    than urine tests in identifying the disease severity. It is also concluded that
    the males are more prone to severe infection of COVID-19.


    Based on the comparative analysis of ML techniques, it is concluded that K-NN
    and SVM dominate the other ML techniques employed for severity detection. KNN
    reported the accuracy of approximately 100% for the detection of the'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'severity of heart failure. But, there is a need to improve the reliability,
    and robustness of the approach by implementing it on a large dataset size collected
    from various sources. Similarly, SVM reported the highest accuracy of 98.1% for
    the detection of the severity of heart failure using ECG signals.


    Now, based on the comparative analysis of DL techniques, it is concluded that
    deep neural networks employed for disease severity prediction reported the highest
    accuracy of 97.3% for the prediction of Diabetic Retinopathy. DL techniques are
    easy to implement and useful for developing an intelligent tool for assisting
    health experts in reading medical images. But, there is a need to design a neural
    network that is self-sufficient to generate the labelled dataset using a small
    dataset. Moreover, there is a scope to integrate the ML and DL techniques that
    can analyse both the clinical and physiological parameters as well as medical
    images for reliable and more accurate prediction of disease severity.


