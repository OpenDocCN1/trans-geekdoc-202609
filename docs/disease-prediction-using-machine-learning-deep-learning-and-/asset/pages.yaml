    # DATA ANALYSIS AND VISUALIZATION


    Data analysis [11] is a means to obtain valuable information through processing
    data by traditional ideas, technologies, and techniques in statistics, mathematics,
    or logic, while these theories, processes, and tools that allow for a thorough
    comprehension of data and the discovery of useful insight within it are known
    as Data analytics [11]. Data analytics is further divided into various types like
    descriptive analytics, predictive analytics, prescriptive analytics, explicit
    analytics, implicit analytics, and deep analytics.


    +   1. Descriptive Analytics: Data analytics uses statistics for explaining the
    data that is used for generating information or for other several benefitial objectives.


    +   2. Predictive Analytics: Data analytics that, generally using advanced analytics,
    predicts unknowable future events and reveals the causes behind them.'
