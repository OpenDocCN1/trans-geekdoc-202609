  md: '# CHAPTER 9


    # Mining Standardized EHR Data: Exploration, Issues, and Solution


    Shivani Batra1*, Vinay Kumar1, Neha Kohli2 and Vaishali Arya2


    1 KIET Group of Institutions, Delhi-NCR, Ghaziabad, Uttar Pradesh, India

    2 GD Goenka University, Gurugram, India


    Abstract: Medical database is among the most crucial databases in terms of their
    applicability to human life. Many researchers are in search of knowledge that
    is abstracted within the data. Data mining is popular in today’s world as it gives
    access to knowledge that is otherwise unavailable. The concealed knowledge which
    is offered as a result of it can help the individual to make better decisions.
    Data mining tools in health have great potential. These solutions may be divided
    into four categories: therapeutic efficacy assessment, patient care, customer
    service, and embzzlement monitoring. The authors discovered that giving decision
    assistance in the medical sector with an emphasis on electronic health records
    (EHRs) can save lives. Though offering decision assistance in EHRs using data
    mining is valuable, it needs consistency. As a result, the authors intend to use
    data mining methods on standardized EHRs to create a decision support system.
    This paper presents the state-of-the-art data mining approaches and their application
    in the healthcare sector. It provides an integrated summary and a comparison detail
    of the existing literature. This chapter surveys several issues that need to be
    handled before employing data mining on EHRs and further proposes a solution for
    dealing with these problems. The problems such as multiple origins, multiple formats,
    missing data, distinguished users, data granularity, flexibility, and sparseness
    need immediate attention from researchers. Resolving these problems is important
    to build an efficient standardized EHRs database.


    Keywords: Data Mining, EAV Model, Health Data, Standardized EHRs, Sparseness.


    # INTRODUCTION


    Data mining (DM) is the method of choosing, examining, and modelling massive datasets
    in order to uncover interesting patterns or correlations that offer the expert
    a valid and meaningful conclusion [ 1 - 3].'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'DM is the process of extracting useful information from massive datasets maintained
    in a variety of places, including data stores, spreadsheets, and cloud platforms.
    This information is useful in a variety of fields, including corporate strategy,
    biomedical investigation, and policy decisions. DM is a crucial aspect of information
    extraction since it examines massive amounts of facts and provides us with previously
    unrecognized, concealed, and usable information. DM has been successfully employed
    in a variety of industries, including weather forecasting, healthcare, transit,
    education, finance, and governance. When employed in a given business, DM offers
    several benefits such as prediction, clinical diagnosis, and categorization. Aside
    from such benefits, DM has its own drawbacks, such as the potential for confidentiality
    breaches. For example, if the miner has access to all of the data’s details, he
    may exploit some of the data’s secret information.


    Although DM may be used in a variety of fields, its application in the health
    industry has the potential to assist humanity. Data includes a lot of information
    that might be concealed. Many academics are working to uncover these previously
    unknown sections of medical information [4 - 6]. Any platform’s most precious
    asset is data. In the health sector, a lack of vital information can be dangerous
    to health. The discipline of DM is rapidly expanding, but applying it to medical
    records is much more difficult than applying it to other data due to the existence
    of several unique traits.


    The remainder of the paper is laid out as follows. Section 2 delves into the complexities
    of the medical industry, with a focus on EHRs. Section 3 focuses on how DM can
    be used in EHRs. Section 4 looks at the issues of applying DM to EHRs, and Section
    5 offers a remedy. Sections 6 and 7 respectively show related work and the conclusion.


    # COMPLEXITY IN EHRS


    Paper-based patient data have a number of drawbacks, including restoration, productivity,
    and integrity. EHRs address all of the drawbacks of paper-based health data and
    make them available to users at a single click.


    An Integrated Care EHR [7] is defined as: “a repository of information regarding
    the health of a subject of care in computer processable form, stored and transmitted
    securely, and accessible by multiple authorized users. It has a commonly agreed
    logical information model which is independent of EHR systems. Its primary purpose
    is the support of continuing, efficient and quality integrated healthcare and
    it contains information which is retrospective, concurrent and prospective”.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'The importance of standardisation for health clients cannot be overstated.

    Examining the available standards in the health industry is a crucial. Various

    standard bodies are attempting to make interoperable EHRs a reality. Prominent

    organizations include Health Level 7 (HL7) [8], European Committee of

    Standardization Technical Committee 251 (CEN TC251) [9], International

    Standard Organization (ISO) [10, 11], and openEHR [12].


    Medical advances are a data-intensive discipline that accumulates massive

    amounts of complicated and varied information. The health domain is very vast.

    Considering the complexity of the EHR domain, we identified that it consists of

    EHR_patients, EHR_concepts, EHR_relationships, terminology concepts and

