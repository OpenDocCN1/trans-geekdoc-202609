  md: 'COVID-19 Chest X-ray Dataset Initiative [25] includes 55 CXR images of the
    COVID-19 class. Next, the actualmed COVID-19 Chest X-ray Dataset Initiative [26]
    including 238 CXR images corresponding to binary classification, i.e., COVID-19
    and Normal, is used. These three datasets mainly focused on the binary classification
    of CXR images into COVID-19 and normal. The fourth dataset, COVID-19 Radiography
    Database [27], consists of 1200 images under the ‘COVID-19 positive’ label, 1341
