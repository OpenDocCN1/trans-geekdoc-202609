  md: '# CHAPTER 6


    # A Clinical Decision Support System for Effective Identification of the Onset
    of Asthma Disease


    M.R. Pooja1,*


    '' Vidyavardhaka College of Engineering, Mysuru, Karnataka, India


    Abstract: We present a clinical decision support system for the identification
    of asthmatics in two different cohorts representing rural and urban populations
    in India. The input data representing the two populations are cross-sectional
    in nature and are necessarily categorical in nature, with information on clinical
    history emphasizing clinical symptoms and patterns characterizing the disease.
    The system is described as hybrid as it combines the unsupervised and supervised
    learning techniques in a unique way as discussed in the work presented in the
    paper. The clustering information emphasizing the phenotypic characterization
    of asthma is an input to the classifier and a significant improvement is observed
    in the performance of the classifier. The results of the developed hybrid decision
    support system are quite promising for suitable deployment in a real-time scenario,
    as it explores the benefits of both supervised and unsupervised learning techniques.
    Further, the use of clustering information in the form of cluster evaluation scores
    as an input parameter to the classifiers can efficiently predict disease outcomes,
    especially with diseases such as asthma, as the disease is heterogeneous and exhibits
    several disease subtypes and heterogeneous phenotypes.


    Keywords: Correlation, Hybrid, ISAAC, MFCM, Subject clustering.


    # INTRODUCTION


    Asthma, being one of the most chronic respiratory diseases of the lungs is known
    to be affected by various factors including, genetic and environmental features
    that play a vital role in the persistence and progress of the disease [1]. Clinical
    symptoms and their patterns along with their frequency have a great impact on
    the disease outcome and impact when assessed using electronic health record data
    [2]. ISAAC is a well-recognized body that has formulated core questionnaires with
    respect to asthma and its comorbidities that have been received well in most of
    the pilot studies conducted across several regions. A hybrid decision support
    system that operates in two stages has been proposed, wherein the results generated
    dur-'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'ing the first stage are effectively used as a significant input in the subsequent
    age [3]. A significant fact contributing to the improvement in the prediction
    of class outcomes is the use of clustering information during the process of classification
    [4]. This is seen as a requisite to the system as asthma is seen to exhibit polymorphic
    phenotypes that have their own characterization [5].


    Identification of patient populations at high risk is an important intervention
    in the early detection and clinical assessment of chronic diseases like asthma
    and bronchitis, as it can lead to targeted and personalized therapies. Our research
    has a credible potential to be an important intervention through facilitating
    early risk assessment and effective prognosis of the disease via risk stratification.
    In case of failure to recognize the disease at an early stage, the disease could
    be progressive and finally become irreversible, though reversible in nature. This
    necessitates us to propose approaches that help us in the prediction of the disease
    using severity indicators that can be possibly identified at an early stage, enabling
    early medical interventions that alleviate the disease severity, subsequently
    lowering the mortality rate. The disease is further heterogeneous, in that it
    presents itself with variable overlapping syndromes of other obstructive diseases,
    which makes it difficult to delineate the symptoms characterizing asthma.


    # RELATED WORK


    Clinical Decision Support systems incorporating machine learning techniques to
    mine the useful data may be adopted to explore asthma data, and to identify latent
    patterns that add value, while providing a supplementary source of better understanding
    for decision-making with respect to risk factor identification along with the
    assessment of the severity of the disease and the extent to which it relates to
    other diseases of the lungs such as COPD (Chronic Obstructive Pulmonary Diseases)
    [6 - 8].


    Bayesian classification approaches implementing supervised learning techniques
    have resulted in classes that are principally identified as correct and have a
    good amount of face validity along with substantial relationships to asthma, variations
    in airway reactivity and lung function, which illustrate content validity with
    a good amount of gratification [9, 10]. Predictive analytics have been suitably
    deployed to estimate risk factors by exploring a blend of independent variables
    from variable sources [11]. Rule-based systems integrating expert-driven feature
    selection and rough sets techniques have been identified to describe asthmatic
    populations visiting emergency departments [12]. A good amount of precision was
    obtained with the task associated with the differentiation of asthma against other
    respiratory disorders depending on the nature of the underlying data and the ensemble
    learning techniques used [13].'
