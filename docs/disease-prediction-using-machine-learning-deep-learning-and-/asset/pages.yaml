- pgno: 139
  md: 'Normal-tension glaucoma (NTG), also known as low-tension glaucoma, occurs when
    the optic nerve is damaged despite the eye pressure remaining within the normal
    range of 12-22 mm Hg. In this type of glaucoma, extreme sensitivity or insufficient
    blood supply to the optic nerve can contribute to the condition.


    Closed-angle glaucoma, also referred to as angle closure, narrow-angle, or acute
    glaucoma, occurs when the iris is positioned very close to the drainage angle
    of the eye, potentially obstructing it. This condition may present symptoms such
    as severe eye pain, blurred vision, and nausea [39].


    Congenital glaucoma results from poor eye development, leading to an increase
    in intraocular pressure. It is caused by a genetic abnormality in the eye''s angle
    growth. Primary congenital glaucoma (PCG) is a critical condition that requires
    immediate treatment. It typically affects infants, with parents often noticing
    symptoms like photophobia (sensitivity to light), watery eyes (epiphora), and
    eye closure (blepharospasm). This condition occurs in about one out of every 10,000
    babies, and untreated cases can lead to childhood blindness.


    Secondary glaucoma is often a consequence of other eye problems, negligence, or
    the use of certain medications like corticosteroids. It can also be a rare side
    effect of eye surgery.


    Glaucoma is often referred to as “The Silent Thief of Sight” due to its characteristic
    of causing no pain or symptoms, making it challenging to detect without proper
    screening. Glaucoma computer-aided diagnosis is an emerging area of medical imaging
    research [43].


    # Cataract


    A cataract is a condition characterized by the development of a cloudy and thick
    region in the eye''s lens. This occurs when proteins in the eye clump together,
    leading to the lens being unable to transmit clear images to the retina. The retina
    plays a crucial role in converting the incoming light through the lens into signals,
    which are then sent to the optic nerve and further transmitted to the brain. In
    a clear lens, a cataract appears as an opaque or cloudy patch [44]. Depending
    on its size and location, a cataract can obstruct normal vision.


    The majority of cataracts are age-related, resulting from natural changes in the
    eyes as a person ages [45]. The treatment for cataracts, regardless of their type,
    involves surgery. Fig. (9) classifies retinal images as non-cataract, mild, moderate,
    and severe cataract, respectively, providing a visual representation of the condition''s
    progression.'
