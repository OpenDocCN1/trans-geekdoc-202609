  md: 'Due to the sheer peculiarity of health data, Cios and Moore [14] offer a full
    overview of all difficulties (heterogeneity, regulatory and political issues,
    analytical bounds, and protected privilege) that a DM researcher must be aware
    of before beginning his investigation. These are described in detail below:


    +   1. Heterogeneity: Medical data might include scans, unstructured and semi-structured
    data, visual information, audible data, infographics, and figures. Due to this
    nature of data, high-capacity storage is required. Moreover new mining tools are
    also required to analyze this type of data so that it can be interpreted easily
    by the user.


    +   2. Regulatory and Political Issues: Dealing with people to gather medical
    data necessitates dealing with a variety of difficulties, including information
    privacy, the threat of litigation, safety and confidentiality of data, anticipated
    benefits, and administration.


    +   3. Analytical Boundaries: Statistics deal with different types of numbers
    whereas data mining deals with different types of data. Applying statistics operation
    requires the medical data to be numeric.


    +   4. Protected Privilege: Medicine is an important part of everyone''s life.
    Special attention has to be given while dealing with mining medical data since
    the result of carelessness can be very hazardous. All ethics should be maintained
    by the person who is accessing the data for any legal purpose and no access rights
    should be given for illegal purposes.


    # CHALLENGES IN MINING STANDARDIZED EHRS


    Based on a thorough examination of DM in the health sector, the present study
    looked into the following issues when implementing DM on EHR data.


    +   1. Multiple Origins: Every organization holds information on an individual
    basis. When implemented in the associative data of all organizations, DM techniques
    would be beneficial. As a result, data ought to be present in a single location,
    however, data protection would be a major concern in such a situation.


    +   2. Multiple Formats: Each institution has its own data structures for storing
    patient information. As a result, data must be collected using a single standard
    format so that DM tools may be used to uncover information. Also, there is a need
    to develop automatic tools for converting this heterogeneous medical data to a
    uniform format.


    +   3. Missing Data: There are times when data has missing values or is contaminated
    by noise. When DM technologies are used on inaccurate data, the'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'outcomes will be wrong as well. For example, a particular hospital is capturing
    information by blood tests, X-rays, as well as CT scans. But, another hospital
    does not provide a facility for CT scan. This leads to a null value in place of
    a CT scan for some of the patients. Such null values must be handled before decision-making.


    +   4. Distinguished Users: Users are divided into three categories: professional,
    semi-skilled, and beginner. A professional user such as a physician frequently
    requests all the information and reasoning to interpret things. A semi-skilled
    operator such as a nurse is primarily interested in the service''s entire information.
    The average beginner such as a sufferer is simply interested in the outcomes.
    In this way, the desired outcome is different for different groups of people.


    +   5. Data Granularity: The amount of granularity is determined by the user''s
    requirements. Varying levels of granularity may be required by professional, semi-skilled,
    or beginner-level clients. Whenever a client checks his vital sign record, he
    may need to determine if his heartbeat is regular, excessive, or lower, but if
    a professional checks his heart rate records, he needs to examine the details
    rate at which his heart is beating.


    +   6. Flexibility: The healthcare era is rapidly approaching. As a result, modern
    treatment ideas or diagnosis terminology are established, or established health
    conceptions are coupled with novel diagnostic terminology. To address this issue,
    we need flexible data structures that can support these changes without disrupting
    the entire system.


    +   7. Sparseness: Several times, health data is gathered using surveys that ask
    for personal details that the individual may not wish to share. In this case,
    the feature containing the specific value has a null value. Thus, this leads to
    storage wastage.


    Several agencies, including HL7, openEHR, and ISO13606, are constantly working
    to fix these challenges, but we discovered that DM on standardized EHRs has received
    very little investigation.


    # SOLUTION FOR MINING STANDARDIZED EHRS DATABASE


    Traditionally databases are stored under a relational model which maintains one
    column per attribute but the relational model is not able to handle the problems
    defined in the previous section; hence a new data model is required for storing
    EHR such that a space is utilized in a very efficient way. The EAV model is capable
    enough to store EHR data in a very space-efficient way. The EAV model [17] facilitates
    data storage in a column-oriented storage with triplets in every tuple corresponding
    to Entity, Attribute, and Value. The ''Entity'' component'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'depicts the dataset''s several entities, the ''Attribute'' section includes
    the numerous attributes related to each entity, and the ''Value'' section provides
    the attribute''s value. EAV model offers great flexibility for adding, deleting
    or modifying the attributes in the database because its logical schema is different
    from the physical schema. The different EAV schemas available are as follows [18]:


    1. **Basic EAV Schema**: The physical schema consists of at least three columns
    namely entity, attribute and value. The entity column contains the distinct identifier
    of the entity. The label or identification of the attribute for whom the value
    is to be saved is contained in the ''Attribute'' field. Value contains the value
    of the attribute. A logical schema is defined using a separate table called a
    Metadata table. To store the data which is not sparse, a separate relational table
    is used and for other data, an EAV table is used. The transformation of the EAV
    table to a relational table is facilitated through the use of a metadata table.


    2. **Multi Data Types EAV Schema:** As the EAV table contains a single column
    for storing the value of each attribute, the data type assumed value column is
    a string. There are many issues that arise due to the usage of string data type
    like when “12” and “2” are compared “12” will have a lower value than “2” in case
    of string but numerically “12” is greater than “2”. To deal with such a problem,
    one EAV table is made per data type.


    3. **Hybrid EAV Schema**: By establishing numerous data forms under a single table,
    it combines the greatest features of the preceding simple and multi-data type
    schemas.


    Any of the above-defined three EAV schemas can be used depending upon the requirement.
    When the EAV model is used, multiple origins and multiple formats problem can
    be resolved as EAV is quite flexible to store any kind of physical schema. This
    is accomplished _via_ metadata, which contains information on the logical structure
    of the data being saved as an EAV model. The summary of identified challenges
    is shown in Table 2.


    # Table 2. Summary of challenges identified and proposed solution.


    | S. No. | Challenge Identified | The Proposed Solution for Overcoming |

    |---|---|---|

    | 1. | Multiple origins | EAV model |

    | 2. | Multiple formats | EAV model |

    | 3. | Missing data | 1. Replacing missing values with some constants.<br>2. Identifying
    patterns of occurrence of missing values and replacing missing values accordingly.<br>3.
    Removal of noise through appropriate methods. |

    | 4. | Distinguished users | EAV model |'
  merge: -1
  img_proc: true
- pgno: 171
  md: '| S. No. | Challenge Identified | The Proposed Solution for Overcoming |

    | :--- | :--- | :--- |

    | 5. | Data granularity | EAV model |

    | 6. | Flexibility | EAV model |

    | 7. | Sparseness | EAV model |


    Issues related to various types of users and different granularity levels can
    also be resolved through the EAV model as the attribute list is not fixed and
    new attributes can be added easily hence resolving the problem of volatility also.


    The entries which contain null values need not be stored when data is stored as
    the EAV model because the EAV model does not define the logical schema. So, by
    using the EAV model, sparseness can easily be removed.


    The EAV model is efficient for storing EHR data but many applications such as
    graphing and statistical analysis require data to be present in the legacy relational
    row-oriented format. So EAV modelled data needs to be transformed into row-oriented
    data so that DM can be implemented easily on the dataset and this transformation
    process is called pivoting [19]. Dinu _et al._ tested several pivoting strategies
    [19]. This comparison helps us to find the best pivoting technique.


    Next, to address privacy concerns, EAV includes the implementation of role-based
    access control (RBAC), data encryption, anonymization, and auditing. Such appropriate
    access controls and security measures at the database level help to maintain data
    privacy. This protected privilege refers to limiting access to sensitive or confidential
    information only to authorized individuals or roles. This can be achieved through
    careful design of access controls, defining appropriate roles and permissions,
    and implementing encryption or other security measures.


    Thus, it is evident that the EAV model is a useful tool for managing flexible
    attributes, addressing privacy concerns, and protecting privileges to provide
    additional security measures and access controls in the database system.


