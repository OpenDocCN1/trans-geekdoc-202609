  md: 'EHRs, as well as potential solutions to these gaps. Our main focus is standardization
    because if it is achieved, the benefits of the standardized EHRs will be provided
    worldwide. DM can be used to predict the future or to find the interrelationship
    among observed or unobserved variables. As a result, DM algorithms are divided
    into three groups based on the roles:


    +   1. **Classification**: The technique of anticipating the category of a new
    item from a collection of preset classes is known as classification [15]. The
    data is separated into a testing set, and a training set. The entire framework
    is designed by using a training set, and its correctness is determined by verifying
    the categories to which the test set of data samples are classified.


    +   2. **Clustering**: Clustering [15] is a strategy for unlabeled data in which
    the categories are undefined. It operates by estimating the distance and similarities
    between the two items. Items will correspond to the same category if the resemblance
    metric is in the predefined threshold; alternatively, they would not. Clustering
    is a term used to describe a procedure in which items belonging to the same category
    are grouped with each other to establish a cluster.


    +   3. **Association**: The goal of association [15] is to figure out how distinct
    data properties are associated with one another. One of the most well-known association
    techniques is the Apriori method [15]. Finding fascinating trends necessitates
    two parameters: support and confidence. The effectiveness of association methods
    is the criterion for assessment, not correctness since they locate each conceivable
    relationship among the characteristics of the data.


    The type of DM work to be undertaken is determined by the result desired. During
    the present investigation of implementing DM on EHRs databases, the author examined
