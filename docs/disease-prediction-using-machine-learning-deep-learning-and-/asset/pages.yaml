    Furthermore, the existing techniques can be categorised into three classes namely
    manual, simulated and automatic based on the methodology used for the contour
    detection. The analysis of these techniques as given in Table 3, clearly shows
    that the automatic techniques report the minimum value of Root Mean Square (RMS)
    P2S Error and Mean Square (MS) P2S error. The automatic techniques also take less
    time for contour detection. Thus, these techniques are adopted for a 3-D reconstruction.


    However, the automation of 3-D reconstruction has been observed in the literature,
    but the systems are not intelligent. These systems do not learn from the error
    generated. So, there is a low scope of reducing the error. Moreover, the existing
    techniques solely rely on the input dataset available or data generated by simulation.
    The techniques are incapable to generate the dataset if a small dataset is given
    as input.


    # CONCLUSION


    In this chapter, we present a review of the techniques used for 3-D reconstruction
    from 2-D medical imaging. The researchers worked for the conversion of 2-D femur
    bones into its corresponding 3-D structure. These techniques adopt three modes
    for the reconstruction viz. manual, simulated, or automatic. The automatic techniques
    outperform the manual and simulated techniques in terms of MS P2S error, RMS P2S
    error, and computation time, as shown in Table 3. But the'
  merge: -1
  img_proc: true
- pgno: 44
  md: "automatic techniques lack in self -generation of the dataset in case a small\
    \ dataset size is available. Also, these techniques lack in learning from the\
    \ generated error. This reduces the scope of improvement in the techniques.\n\n\
    Based on the above discussion, we conclude that the automatic techniques can be\
    \ adopted for the 3-D reconstruction of the femur from its 2-D images. But, there\
    \ is a huge scope of developing the automatic and intelligent techniques for reconstruction\
    \ of 3-D structure from the 2-D medical images. The use of optimized neural network\
    \ architectures such as Generative Adversarial Networks (GAN) can resolve the\
    \ challenges of manual, simulated as well as automatic techniques used for 3-D\
    \ reconstruction. We observed from the review of existing techniques that there\
    \ is a scope in developing the organ-specific, patient-specific, automatic, and\
    \ intelligent models for 3-D reconstruction. The use of machine learning and deep\
    \ learning can be game changers in this application. Also, there is a huge scope\
    \ in applying optimization algorithms for improving the efficiency and accuracy\
