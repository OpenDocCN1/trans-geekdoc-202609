    images are preprocessed for removing the noises and artifacts. The system extracted
    various features such as coverage, density, color histogram, area, length, and
    texture feature in the segmentation phase. After feature extraction, the system
    reduced the size of the feature vector using Principal Component Analysis (PCA).
    The authors applied AFC-SVNN using the image-level features such as bacilli count,
    bacilli area, scattering coefficients, and skeleton features to determine the
