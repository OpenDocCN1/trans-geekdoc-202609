  md: 'Moritz Ehlke et al. introduced a GPU-based method to deal with render virtual
    X- ray projections of deformable tetrahedral networks for 3-D geometry reconstruction
    from X-ray [31].


    Guoyan Zheng et al. introduced a 2-D to 3-D correspondence building technique
    by point matching procedure in the non-rigid 2-D structures [17]. They employed
    the adapted iterative closest point (ICP) algorithm [32] at the first stage and
    statistical instantiation at the second phase. The authors applied the regularized
    shape deformation at the third stage [33].


    The above discussion shows that many researchers proposed the techniques for the
    reconstruction of 3-D medical images [1 - 9]. These techniques focus on the reconstruction
    of the femur bone. The above-stated techniques are based on numerical morphology
    strategy for boundary detection [1], DLT [8], 3-D stereo radiographic reconstruction
    [9], B spline FFD [10], SSM [7], contour detection [8], and edge detection [9]
    for the reconstruction of 3-D view of femur bone from the 2-D images. These techniques
    report low accuracy due to the ineffectiveness in detecting the edges or boundaries.
    The performance comparison of the most effective techniques is given in Table
    3.


