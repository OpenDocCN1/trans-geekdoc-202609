  md: 'We obtained a 3-dimensional feature matrix as a consequence of W<sub>T</sub>
    (time, frequency and amplitude). Layer 1 of a CNN model will include all data
    sets with different labels once all datasets have been gathered. A convolution
    layer and a pooling layer are the first layers in the time domain, and the dynamic
    function is added to all the data as input.


    The convolution filter size is 5*5 with the padding, and each move is equal to
    1. The max-pooling layer is used with a filter size of 2*5. The system uses the
    max-pooling with a size of the filter 2*5 shown in Fig. (8). As a result, after
    processing Layer1, the matrix will be reduced to 4*700/2*700 = 2, 800 or 1, 400
    neurons. The completely linked layer, which is made up of 280 or 140 neurons,
    is the third secret layer [21]. The ten neurons that reflect the ten commands
    make the fourth secret layer, which is also the completely connected layer. The
    dataset is further divided into single features (SSVEP/MI) and hybrid features
    (SSVEP/MI+SSVEP) to prove the benefit of the simultaneous hybrid MI + SSVEP method.
    The CNN model is trained with different signals and their results are compared
    [22]. Based on the results that showed a loss, the hybrid system performed better
    than the single system. Accuracy increased to varying degrees as well. The hybrid
    system was therefore the best option for a multi-command system that could be
    operated simultaneously. Simultaneous hybrid signals could be applied for more
    orders in order to overcome the constraint of mental tasks and time frame issues.
    A sequential hybrid system requires 2-time windows to execute one instruction,
    while the simultaneous hybrid mode reduces the time window by 1/2. In addition,
    unlike the conventional hybrid system [23]. In addition, the device could be used
    to perform synchronized recognition of MI mental tasks, hybrid MI-SSVEP tasks,
    and SSVEP mental tasks.


