    # CONCLUSION


    Data analysis in medicine particularly for EHRs is a requirement of the present
    scenario. The healthcare professional can benefit from the hidden knowledge collected
    by data mining techniques. As a result, the present investigation integrates prior
    studies on analyzing EHR databases. It establishes that obtaining meaningful insights
    from health data may be extremely beneficial to humanity. Mined information can
    be analyzed to deliver better treatment and prompt illness diagnosis, lowering
    healthcare expenditures. DM has a plethora of advantages like medical insurance.
    DM may be used to anticipate future expenditures based on historical financial
    information, allowing insurance companies to make more effective decisions. It
    further explores how DM can be applied to the EHRs domain, simultaneously identifying
    the challenges and proposing solutions for identified issues.


    The foremost challenges in implementing DM techniques in healthcare records are
    dealing with sparseness, volatility, privacy, and heterogeneity. All these issues
    can be handled by storing the data using the EAV model. Although the use of the
    EAV model solves the problem of sparseness, volatility and heterogeneity data
    need to be in a relational format so that DM methods can be implemented on it.
    So, pivoting techniques are used to convert EAV-modelled data into relationally
    modelled data. Once the data is in a uniform format, EAV supports efficient storage,
    processing, and controlled access.


