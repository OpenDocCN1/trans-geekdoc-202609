- pgno: 29
  md: 'AlexNet includes 8 layers; out of which five are convolutional layers and three
    are fully connected layers. The first convolution layer consists of 96 filters
    of size 11x11 and stride 4. This is followed by the first max-pooling layer of
    size 3X3 and stride 2. The next convolution layer has 256 filters of size 5x5
    with stride 1 and padding 2. Next is a similar max-pooling layer that we already
    used before. Further, the third convolution layer has 384 filters. These filters
    are of size 3X3 stride 1 and padding is 1. Then we have a fourth convolution layer
    with 384 filters of size 3X3 and the same stride and padding as the third one.
    The final convolution layer is of size 3X3 with 256 such filters with stride 1
    and padding 1. And finally, the third max-pooling layer of size 3X3 and stride
    2 is applied. When AlexNet was proposed, tanh was a standard activation function
    used. AlexNet on the other hand used Rectified Linear Units (ReLU) instead, which
    significantly reduced the model training time. AlexNet also uses overlap pooling
    which in turn reduces the size of the network.


    # ResNet101 [32]


    ResNet refers to the residual network. This is because instead of the layers cramming
    the underlying mapping of the layers, ResNet fits the residual mapping of the
    layer. And ResNet-101 is a deep convolutional network that is 101 layers deep.
    The network has a default image input size of 224x224 and hence the tensor input
    will be of (224,224,3). Each block in ResNet101 is 3 layers deep. The architecture
    involves the issue of vanishing gradient and hence provides an approach to reduce
    the number of parameters to ensure faster computation. This is done with a max-pooling
    layer of size 3X3 and stride 2. And finally, a fully connected average pooling
    layer is applied with softmax activation.


    # DenseNet121 [33]


    DenseNet stands for Dense Convolutional Network. In this network, the layers connect
    deeper to other layers for efficient training and maximum data transfer between
    layers. Due to this type of connection, we observe that DenseNet architecture
    requires a lesser number of parameters as compared to standard convolution neural
    networks. The DenseNet 121 includes 5 primary kinds of layers out of which one
    is a 7x7 size convolutional layer along with a max-pooling layer of the size of
    3X3 with stride 2. Then there are the 3 transitional layers with an average pooling
    layer of size 2x2 with stride 2. And finally, a fully connected classification
    layer with a global average pooling layer of size 7x7. This final layer uses softmax
    activation.'
