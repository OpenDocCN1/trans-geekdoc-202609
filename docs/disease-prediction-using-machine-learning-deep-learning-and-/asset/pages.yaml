    It is evident from the above discussion that there is a strong need to automate
    disease severity detection for providing a quick, convenient, round-the-clock
    available, and low-cost solution to health experts and the populace. This motivated
    us to review the techniques proposed in the literature and present a comparative
    analysis. In this chapter, we study the research works proposed from 2018 to 2022
    to show the role of ML and DL techniques in severity detection. The review encompasses
    the comparative analysis of ML and DL techniques employed. It enlists the datasets
    used for severity detection. The paper also highlights the drawbacks and limitations
    of the proposed works.


    # LITERATURE REVIEW


    # Severity Detection using Machine Learning


    Yao et al. employed various machine learning algorithms such as predictive Logistic
    Regression (PLR), Support Vector Machine (SVM), Random Forest (RF), K-Nearest
    Neighbour (KNN), and AdaBoost to determine COVID-19 severity detection [9]. This
    study is performed on 75 severely infected COVID-19'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'patients and 62 patients with mild symptoms. The data of patients were collected
    from the Tongji hospital affiliated to Huazhong University of Science and Technology.
    Each sample was analyzed to obtain 100 features comprising 8 clinical features
    such as sex, age, heart rate, respiratory rate, body temperature, blood pressure
    etc., 76 parameters reported by blood tests, and 16 parameters reported by urine
    tests. The missing entries of the dataset were filled either with zero or the
    median of the normal range. Now, the dataset is divided into training and testing
    sets in the ratio of 80% and 20% respectively. In the next step, the authors perform
    T-test and identified 32 features that are statistically significant for the disease
    severity. Further, the model applies Conservative Recursive Feature Elimination
    (CRFE) strategy and eliminates 4 more redundant features. These four features
    have strong inter-feature correlations while maintaining the model performance.
    The authors reported the best prediction accuracy of 99.17% by applying the Support
    Vector Machine (SVM) technique on the training dataset. It achieved an accuracy
    of 81.48% when applied to the testing dataset. Further, the authors claimed that
    the severely infected patients had a higher serum level of neutrophil percentage
    and lower serum level of monocyte percentage and calcium as compared to the patients
    with mild infection of COVID-19. Furthermore, the parameters recorded by blood
    tests were found to be more significant in identifying the severity than parameters
    recorded by urine tests. The authors also claimed that males are at higher risk
    of severity if get infected by COVID-19. However, the conclusions made by this
    study are important to predict the severity of COVID-19, but there is a need to
    improve the reliability and robustness of the model by using larger datasets from
    different regions. The study based on the dataset of merely 75 patients from one
    geographical region of China cannot be considered for making the generalized predictions.


    In another research, Li Yan et al. proposed a three indices-based prognostic prediction
    model that helps in differentiating critical cases from severe cases of COVID-19.
    They also predicted the mortality risk of patients [10]. The authors performed
    the experiments on a dataset comprising 375 patients from Tongji Hospital in Wuhan,
    China. In the first step, they applied pre-processing techniques and labelled
    the dataset with two classes’ viz. survival and death. While pre-processing, the
    authors used padding of ‘-1’ to fill the missing values in the dataset where clinical
    measures were incomplete. Now, the authors divided the dataset into training and
    testing datasets in the ratio of 70% and 30% respectively. They employed Multi-tree
    XGBoost model on the dataset. While training the pre-set, the parameters were
    set as max depth value being 4, learning rate as 0.2, the value of tress number
    of estimators as 150, and the regularization parameter as 1. They pre-set the
    value of both ‘subsample’ and ‘colsample_bytree’ as 0.9 to avoid the problem of
    over-fitting. In the process of feature selection, the algorithm selected three
    key features, i.e. lactic'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'dehydrogenase (LDH), lymphocyte, and high-sensitivity C-reaction protein (hs-CRP)
    from the pool of more than 300 features. This study precisely predicted survival
    with more than 90% accuracy. The work proposed in this research quantified the
    risk of death and may prove useful for patients. It is also a helpful tool for
    doctors and predicted the severity and fatal development trend of the disease.
    But, there is also a need to improve its reliability by training and testing it
    with a vast dataset.


    Tadesse et al. proposed the SVM-based ML model to detect Autonomic Nervous System
    Dysfunction (ANSD) level that occurs due to Hand Foot and Mouth Disease (HFMD)
    and tetanus [11]. The ANSD is the main cause of death for HFMD and tetanus patients.
    The system was applied to physiological data of patients collected using low-cost
    wearable sensors. It uses high pass filters followed by a Gaussian filter to remove
    noises and movement artefacts from the input data such as electrocardiogram waveform.
    Now, it computes gradients by applying first-order derivatives to extract the
    relevant features. These features can capture more dynamic information in the
    time domain. The authors tested the model on 60,373 samples that are extracted
    from the ECG signal of 74 HFMD patients and ECG, PPG, and IP waveforms of 10 patients
    suffering from tetanus. The dataset was collected from a hospital in Vietnam.
    The system employs the SVM with the one-versus-all strategy to classify multiple
    classes from the HFMD dataset. The obtained results are better for tetanus patients
    because mostly patients of HFMD were children who are more likely to move. The
    movements of patients while capturing the dataset lead to degradation in the data
    quality. This decreases the classification performance of the system. However,
    the system reports high accuracy but it requires manual encoding of features and
    needs automation to improve the quality of the system.


    Tripoliti et al. presented a review of ML-based models applied to predict the
    presence of Heart Failure (HF), estimating its subtypes, determining the severity
    of the disease, and predicting the presence of adverse results such as destabilizations,
    re-hospitalizations, and mortality [12]. Based on the review of literature, the
    authors concluded that K-NN and SVM techniques report high accuracy for HF detection.
    Isler et al. proposed K-NN based technique and tested it on the Physiobank database
    comprising ECG recordings of 54 normal and 29 heart patients [13]. They reported
    an accuracy of 96.39% with the value of K as 5 and 7 in the K-NN algorithm. Similarly,
    Liu et al. presented the SVM-based model and tested it on PhysioNet dataset collected
    from 30 normal and 17 heart patients. They used the short-(Heart Rate variability)
    HRV measures as predictor feature, and reported an accuracy of 100%.'
