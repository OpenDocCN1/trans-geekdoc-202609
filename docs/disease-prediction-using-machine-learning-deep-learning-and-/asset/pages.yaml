  md: '# FUTURE WORK


    Around 25 years ago [12] database usability started receiving attention and it
    has gained more momentum lately [13]. Researchers need to focus on database usability
    by providing effective and innovative query interface designs which include a
    keyword, visual, natural language interfaces, and spreadsheet interfaces where
    the non-technical users (skilled/semi-skilled like nurses, doctors etc.) can query
    the database using an easy-to-use query language interface. Whether a search engine
    could simply sit on top of the database systems and is allowed to manage the interface
    with users by the database systems is one of the obvious questions to raise. We
    contend that the response is “No”. Although the interface of a search engine is
    effective for the Web, it does not completely solve the issues related to usability
    that database systems are facing. This is because of a number of characteristics
    that result from the expectations of the users for database interaction, which
    are fundamentally varied from the anticipations for using the Web. For example,
    users expect to be able to query the database in a more sophisticated manner and
    want to express the query semantics which are more complex during the interaction
    with databases because they are aware that databases are not only just the collections
    of documents but also they contain structures within them which are available
    for answering their queries. Additionally, more accurate and thorough results
    are anticipated from the database searches by the users. To overcome all these
    challenges, we believe that there is a need to provide interactive browsing and
    navigation query interface [14] which can be on top of the NoSQL databases.


