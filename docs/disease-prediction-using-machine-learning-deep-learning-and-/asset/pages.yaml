    Another group of researchers, Ines Feki, et al. [21], experimented with a federated
    learning framework for the screening of COVID-19 from Chest X-ray images by multiple
    medical institutions. In this paper, the researchers have discussed well about
    the non-independent and identically distributed (Non-IID) data and unbalanced
