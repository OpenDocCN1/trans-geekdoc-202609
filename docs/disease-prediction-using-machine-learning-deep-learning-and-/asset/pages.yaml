- pgno: 159
  md: '# CHALLENGES


    Usability challenges: BCI is described as having difficulties gaining user acceptance.
    Class discrimination preparation is an issue that concerns them [24]. System efficiency
    and acceptance are measured by information transfer rate (ITR) [25].


    # Training Process


    In terms of training a user, one has to direct the user through the processor
    or record multiple sessions. It occurs either during the introduction process
    or during the calibration phase of the classifier. In the preliminary phase, the
    individual is taught how to use the device and manipulate brain input signals,
    while in the calibration phase, the signal of a trained subject is used to learn
    the used classifier. One of the most widely studied solutions to this time-consuming
    problem is to use single-trial analysis instead of multi-trial analysis, which
    is used to improve signal-to-noise ratio and to place the burden of small training
    size on subsequent BCI device components to manage. As alternatives, a zero-training
    classifier and a variety of adaptive have been investigated.


    # Information Transfer Rate


    Command-based BCI systems are evaluated using Information transfer rate. Based
    on the number of options available, target detection accuracy, and the average
    amount of time necessary to make a decision, this statistic is determined. Because
    there are so many options available, selective attention techniques have a higher
    ITR than imagery-based BCI.


    # Technical Challenges


    There are problems with the electrophysiological data collected. Nonlinearity,
    for example, is a property of brain signals.


    # Non-Linearity


    Dynamic nonlinear behavior of groups of neurons is observed in the brain, which
    is a highly dynamic system. Nonlinear dynamic methods can, therefore, better describe
    EEG signals than linear methods.


    # Non-Stationary and Noise


    A BCI system faces the problem of non-stationary electrophysiological brain signals.
    The results in a continuous shift in the signals used over time, either between
    or inside recording sessions. EEG signal variability may be influenced by'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'the mental and emotional state throughout sessions. Internal non-stationary
    causes include fatigue and concentration levels as well. Noise and non-stationary
    causes are major challenges for BCI technology. They involve unnecessary signals
    triggered by changes in electrode placement as well as noise from the environment.
    The acquired signals represent a combination of moving objects, such as electrical
    activity generated by signals created by eye movements and skeletal muscles electromyogram
    (EMG) and blinking Electrooculogram (EOG), making it difficult to discern the
    underlying pattern.


    # Small Training Sets


    The training procedure is dominated by usability problems and limited training
    sets. Although the subjects find the training sessions to be time-consuming and
    exhausting, they provide the user with the requisite experience to cope with the
    device and learn to monitor his or her neurophysiologic signals. As a result,
    developing a BCI requires a significant balance between the technical difficulty
    of understanding the brain''s signals and training requirements for effective
    usage.


    # CONCLUSION


    Brain-computer interface is a cutting-edge technology that uses brain impulses
    to control an external device, bypassing the regular neuromuscular system, to
    complete a task. BCI technology is a relatively new innovation in neuroscience
    that has drawn researchers from a variety of fields, including entertainment and
    gaming, security, and marketing. Invasive and non-invasive recording equipment
    are classified into two groups. Invasive surgery is frequently required for essential
    paralyzed conditions due to its higher accuracy rates obtained either geographically
    or temporarily. Besides its advantages over the invasive category, which we have
    previously discussed, the non-invasive category has also been widely adopted in
    a variety of applications. Other concerns and obstacles that arise as a result
    of using brain signals have also been examined as the result of the answers provided
    by algorithms at BCI system processing. The interaction possibilities of new technologies
    are fully appreciated by HCI researchers today. We also look at the different
    challenges that must be overcome in order for BCI to be a successful and widely
    adopted technology. The paper''s primary goal is to bring this new emergent technology
    to the forefront. The BCI research community hopes to work more closely together
    in the future and accepts that other research areas and society in general will
    value and direct BCI research, than other medical applications.


