    # Diabetic Retinopathy


    Diabetic Retinopathy (DR) is a prevalent retinal disease and a leading cause of
    vision loss among the global working-age population [28]. It is a condition that
    affects the eyes due to untreated diabetes over an extended period. DR impacts
    over 290 million individuals worldwide, including 69.2 million in India, and this
    number is expected to rise significantly in the coming years. The condition arises
    when blood vessels in the retina become swollen, leaky, or close off completely
    [29]. Clinical features of DR include hemorrhages, microaneurysms (MA), and exudates.
    Microaneurysms are seen in the inner nuclear and outer plexiform layers and serve
    as an initial sign of DR, appearing as microscopic red dots. Intraretinal haemorrhage
    occurs when these microaneurysms or capillaries become weakened or ruptured [30].
    Haemorrhages may take the form of dot and blot haemorrhages, where dots are bright
    red and blots represent larger lesions. Another sign of DR is the presence of
    exudates, which are classified as hard or soft exudates. Hard exudates appear
    as yellow lipid deposits filled within the outer plexiform and inner nuclear layers.
    Cotton wool spots or soft exudates are fluffy lesions in the nerve fibre layer
    caused by capillary occlusion at the nerve fiber layer due to infarction [31].


    Diabetic retinopathy is categorized into two types: non-proliferative DR (NPDR)
    and proliferative DR (PDR). NPDR is the initial stage characterized by swelling
    of tiny blood vessels in the retina. NPDR is further classified into different
    levels of severity, including mild (hard exudates), moderate (mild NPDR and cotton'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'wool spots), severe (moderate NPDR with specific criteria), and very severe
    (a combination of all features). On the other hand, PDR is a more advanced stage
    of DR caused by neovascularization, where new blood vessels grow on the retina.
    PDR is more serious and can cause significant damage to central and peripheral
    vision, especially when new blood vessels form on the disc or elsewhere. Various
    techniques are employed for the detection of diabetic retinopathy, and the distinction
    between normal and diabetic retinopathy can be observed in Fig. (5).


    ![](img/0616422b380b1bd62613a261ed51be87_136_0.png)


    Fig. (5). Comparison of normal retina with diabetic retinopathy retina [44].


    # Age-Related Macular Degeneration


    Age-Related Macular Degeneration (AMD) is a condition that weakens the retina
    and causes a blur in the central vision, significantly impacting daily activities
    such as driving and reading. AMD primarily affects individuals aged 50 years or
    older, and it specifically targets the macula, a crucial part of the eye [5].
    AMD can be classified into two types: dry AMD and wet AMD. Dry AMD occurs when
    areas of the macula thin out with age, and small clumps of a protein called drusen
    accumulate (this form is not curable). In contrast, wet AMD involves the growth
    of abnormal blood vessels under the macula, which leads to fluid leakage through
    the retina [32]. Fig. (6) depicts images of normal retinas, dry AMD, and wet AMD,
    respectively.'
