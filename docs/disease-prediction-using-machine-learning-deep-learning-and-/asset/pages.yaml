- pgno: 155
  md: '# Functional Near-Infrared Spectroscopy (fNIRS)


    The fNIRS is a non-invasive method for detecting neuronal activity by measuring
    the flow of blood in the brain. It determines the flow of blood using light in
    the near-infrared range. It has the advantage of high spatial resolution for a
    signal. The fNIRS recording is expected to be less accurate in terms of temporal
    resolution than recording based on electromagnetic signals. It has the advantage
    of delivering signals with a high spatial resolution. Its benefits make it a viable
    option for practical use and clinical trials.


    # Electroencephalogram (EEG)


    Electroencephalography (EEG) monitors voltage changes that follow neurotransmission
    activity within the brain to record electrical activity in the scalp. Commercial
    use is possible because of its distinct advantages in usability over other methods
    of recording brain signals. It is easy to use, compact, and affordable. High temporal
    resolution is also provided by EEG recording [16]. The signal-to-noise ratio of
    this approach is lower than that of other approaches, and its spatial resolution
    is also lower. To improve EEG signal localization and spatial resolution many
    solutions have been proposed [17]. It has been proposed that the number of electrodes
    is increased to 256. It has been announced that there is a global electrode positioning
    scheme. According to the assignment, the distance between adjacent pairs of electrodes
    should be ten percent or twenty percent of the scalp diameter. There are a variety
    of EEG systems that use sensors like NeuroSky that are less obtrusive and have
    a high portability choice for widespread consumer use. It has been proven feasible
    when measured against on scalp EEG. The benefit of this method is that it fixes
    electrode location, provides comfort to the user, and is resistant to electromagnetic
    interference. Research into BCI-based applications has focused on reducing the
    number of electrodes used while maintaining the signal-to-noise ratio.


    BCIs convert direct measurements of brain activity into commands and controls.
    The most modern BCI uses electroencephalogram (EEG) to record one of three types
    of signals: P300, event-related desynchronization/synchronization (ERD/ERS), Steady-State
    Visual Evoked Potential (SSVEP).


    # P300-Based BCI


    The assessment of brain responses to particular sensory, cognitive, or motor events
    is known as event-dependent potentials (ERPs). The P300 is a significant peak
    and one of the most commonly used event-related potential elements. An optimistic
    peak in the EEG can be seen 300 milliseconds after the stimulus is'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'presented in an oddball paradigm. Visual, auditory and sensory stimulation
    may be used. The P300 part of ERP refers to the evoked response in the EEG.


    # Properties of P300


    The occipital area of the brain has the highest spatial amplitude distribution,
    which is symmetric around the central location. The 10-20 international method
    was used to record Cz. P300 is normally reported as electrodes and the amplitude
    allocation of 10-20 international systems.P300 wave amplitude is usually 2 to
    5 V with a period of 150 to 200 msec in terms of temporal pattern. From Fig. (7),
    given the low amplitude of P300 in comparison to brain background activities (50
    V), it is obvious that P300 finding necessitates unusual signal processing. Various
    applications have utilized the P300-based BCI from wheelchair navigation to spelling
    words on the virtual keyboard and communicating with machines. BCI systems like
    this kind have the ability to change people''s lives.


    ![](img/0616422b380b1bd62613a261ed51be87_156_0.png)


    Fig. (7). P300.


    The study of electrophysiology and neurophysiology has shown that neurons respond
    to stimuli by increasing activity. Sudden visual stimuli elicit visually evoked
    potential, and repeated visual stimuli result in a stable voltage oscillations
    pattern in the EEG recognized as Steady-State Visually Evoked Potentials (SSVEP).
    SSVEP occurs directly in the primary visual cortex, according to Ragan. According
    to Silberstein, the SSVEP can contain indirect cortical responses from the peripheral
    retina during cognitive tasks. Continuous visual areas of the cortex are stimulated
    by a stimulus pattern that repeats continuously on the central retina in an SSVEP.
    It is a sinusoidal oscillating waveform, and its fundamental frequency is similar
    to the stimulus. In response to a visual stimulus offered at a rate between 3.5
    Hz and 75 Hz, the brain induces electrical activity at the different and same
    frequencies. Using this type of stimulation can help'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'diagnose visual imperceptions, neurological anomalies in schizophrenia patients,
    multifocal sensitivity loss in multiple sclerosis patients, and other psychiatric
    diagnoses.


    # # Electroencephalogram (EEG) using Convolutional Classifier


    A consistent EEG signal and an effective classifier are more essential in a simplified
    BCI system than in a multiple-channel system. Independent component analysis (ICA)
    outperforms the conventional band-pass filter in terms of separating fusion signals
    into their additive independent components [18]. With the recent development of
    the classification methods (_e.g.,_ machine learning and deep learning) in the
    BCI area, conventional classification methods (_i.e.,_ linear discrimination analysis
    and support vector machine) explore the good output. In BCI fields, researchers
    are attempting to replace conventional classifiers (_e.g._ support vector machines)
    with deep learning methods [19]. We extracted function and time-domain features
    _via_ the wavelet transform (WT) algorithm. The CNN algorithm was used to classify
    the various mental signals. Researchers used optimized algorithms (_e.g.,_ FastICA,
    WT, and CNN) to detect hybrid MI and SSVEP signals from the same source. This
    system is capable of detecting three different EEG forms with a single CNN model,
    in comparison to simple hybrid simultaneous BCI systems, using a simpler BCI structure
    (_e.g.,_ two channels) for multiple commands (_e.g.,_ ten comments). An easier
    headset structure could serve as an everyday control device for people with disabilities
    using BCI wireless commands to accomplish everyday tasks. In order to avoid complicated
    direct pre-treatment and input of photos, CNN commonly includes many paired convolution
    max-pooling layers and a fully connected layer as the output.


    There are as many neurons as input data in a general neural network; too much
    data would prevent efficient training [20]. The number of linked neurons in a
    general neural network is equal to the input data. For CNN to reduce dimensions,
    it performs local field and parameter sharing, and two-dimensional filters are
    applied to input images in the convolution layer, after which they are re-sampled
    to produce a smaller size. In equation (1), consider matrix (x<sub>i,j</sub>)
    with i<sup>th</sup> row and j<sup>th</sup> column is paired with the W<sub>r</sub>
    algorithm. W<sub>m,n</sub> represents the weight of the m<sup>th</sup> row and
    the n<sup>th</sup> column, and W<sub>b</sub> represents the weight of the m<sup>th</sup>
    row and the n<sup>th</sup> column in the filter. The activation function (_i.e.,_
    f) is the function ReLU). The input is the time-frequency-based function. The
    network has four layers, each of which contains one or more neurons.


    ```

    (i, j) = (\(\sum_{m=0}\sum_{n=0} Wm, n Xi + m, j + n\)) + wb (1)

    ```'
