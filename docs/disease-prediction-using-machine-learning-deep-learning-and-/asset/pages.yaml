    data into non-cataract, mild, moderate, and severe cataract levels. The method
    extracted more appropriate features, improving accuracy. To simplify classification,
    they transformed the four-class problem into a two-class one using a hierarchical
    approach. The final framework merged three sets of 2-class neural networks. The
    study achieved accuracies of 85.98% for four-class and 94.83% for two-class classification
    [9].


    Abhishek Samanta et al. (2020) conducted research using the DenseNet model with
    transfer learning on a small dataset of 3050 images from Kaggle for classifying
    DR disease in four ways. Despite the limited number of images, their CNN model
    exhibited excellent performance, particularly for real-time images.


    The proposed model achieved high Cohens Kappa scores of 0.8836 and 0.9809 on the
    validation and training sets, respectively [10].


    In another research paper by Sambit S Mondal et al. (2020), the authors employed
    the Generalized Improved Fuzzy Kohonen Clustering Network (GIFKCN) algorithm to
    detect blood vessels in retinal images. They applied various pre-processing techniques
    such as Gaussian Filter and Morphological operations before using the algorithm.
    The study, conducted on the DRIVE database, found that the introduced model outperformed
    other models with better accuracy, sensitivity, and low false-positive rates (0.979,
    0.989, and 0.039, respectively) [11].


    Mary Dayana et al. (2020) worked on identifying anomalies in retinal fundus images
    using deep learning algorithms. They developed a CNN-based model that effectively
    segmented small lesions by analyzing image patches created by a sliding window
    approach. The model used these patches to generate a probability map, forecasting
    the various types of lesions. Compared to similar studies, the proposed method
    demonstrated significantly higher accuracy and sensitivity [12].


    Krishna Prasad et al. (2019) used a DNN model to detect glaucoma and DR in retinal
    images, utilizing a pre-defined dataset (DR-Kaggle, Glaucoma Medimrg). The research
    involved two phases: a training phase for evaluating the CNN model and an implementation
    phase with a user-friendly GUI. The proposed model, while not very complex, achieved
    an accuracy of 80% and provided a means to recognize healthy or unhealthy input
    images through the GUI [13].


