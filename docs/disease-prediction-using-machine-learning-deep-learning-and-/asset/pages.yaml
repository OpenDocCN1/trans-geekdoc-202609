- pgno: 79
  md: '# Edge Detection for Segmentation


    Edge detection methods such as grey histograms and gradient-based methods identify
    the pixels between various regions with increased productivity transitions and
    form closed object boundaries [40]. Also, edge detection algorithms have the potential
    to divide an image into normal and contoured segments.


    # Thresholding Method for Segmentation


    Pixel-level segmentation is a simple and effective method for image segmentation
    with the internal and external environment on a dark background. Grey histograms
    and gradient-based methods. Thresholding methods select a suitable threshold T
    to separate picture pixels into various areas and different objects from the background.
    The adaptive thresholding technique turns a multilevel image into a binary image.
    If the intensity of an image (x, y) is greater than or equal to a preset threshold,
    i.e., f (x, y) ≥ T, the pixel is included as an image entity otherwise, the pixel
    is part of the background [41]. There are two methods [42] for selecting a thresholding
    value: global and local. The strategy is called global thresholding when T is
    constant; otherwise, it is called local thresholding. Global thresholding may
    fail when the back drop illumination is uneven. To compensate for uneven light,
    multiple thresholds are used in local thresholding [43]. These techniques help
    in locating edge pixels while reducing noise. The three types of image segmentation
    are edge-based, region-based, and blended thresholding. Detection systems like
    the Canny edge detector and the Laplacian edge detector can accept this type of
    region (Fig. 10). The Canny edge detector identifies possible edge pixels using
    the gradient magnitude threshold and suppresses those using non-maximal suppression
    and hysterics thresholding techniques. The recognized edges consist of distinct
    pixels and may be incomplete or discontinuous since these algorithms use pixel-based
    operations. As a result, post-processing techniques, including morphological operations,
    are used to fill in the gaps and join the breaks.


    ![](img/0616422b380b1bd62613a261ed51be87_79_0.png)


    Fig. (10). Brain tumor segmented output.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# # Region-Based Methods for Segmentation


    Region-based approaches divide an image into similar regions based on a set of
    predetermined parameters. These approaches include region growing (RGA) and region
    splitting and merging (RSMA) as described below.


    **Region Growing Algorithm (RGA):** Based on a predetermined criterion, the image
    is segmented by dividing its pixels into smaller or larger sections [44]. This
    is achieved by first selecting a seed-pixel cluster within the original image
    and then defining a set of criteria, such as the strength of the grey-level color,
    to establish a cutoff threshold. The segmentation process then expands the regions
    by including surrounding pixels that meet the criteria like the seed pixels. This
    expansion continues until no more pixels qualify to be added to that region, at
    which point the process comes to a halt.


    **Region Splitting and Merging Algorithm (RSMA):** The programmer applies a method
    of dividing an image into a set of arbitrarily disconnected sections and then
    recombines them into achieve proper image segmentation. This approach is implemented
    using quad-tree data. The technique involves dividing the picture into quadrants
    when Q(R) = FALSE. If Q is false for any quadrant, such as Q(Ri) = FALSE, the
    procedure further subdivides the quadrants into sub-quadrants, and so on, until
    no further splitting is possible. Here, R represents the complete image region,
    and a predicate Q is selected.


    One potential flaw in this approach is that after only splitting, the final divisions
    could have nearby sections with the same attributes. To address this, the method
    allows for both merging and splitting, meaning that it can integrate several contiguous
    regions, Rj and Rk, for which Q (Rj U Rk) = TRUE. Once no further merging is possible,
    the process comes to a halt. This ensures a more accurate and efficient image
    segmentation.


    # # Clustering Based Methods for Segmentation


    It is an unsupervised learning method used for pixel classification, involving
    the establishment of a finite collection of categories known as clusters [45].
    Clustering is employed without the need for training steps; instead, the clusters
    are formed spontaneously using existing data. The method uses a matching criterion
    to group pixels together into final clusters, guided by maximizing intra-class
    similarity and interclass similarity. The quality of the output is influenced
    by both the similarity measure and the execution of the method. Various clustering
    algorithms, such as hard clustering, k-means clustering, and fuzzy clustering,
    are utilized for classification. These algorithms contribute to the effective
    grouping and classification of pixels within the image.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# # Hybrid Image Segmentation using Watershed and Fast Region Merging


    Combining two segmentation algorithms enhances the effectiveness of the segmentation
    process, resulting in a heterogeneity section with high-precision output. A histogram-based
    image partitioning method represents the basic probability distribution function
    of pixel intensities. Whereas an edge-based technique utilizes a differential
    filter in Laplace to generate contour lines and represent the surface. In region-based
    segmentation, the picture is divided into a series of homogeneous areas, which
    are subsequently blended using decision rules [46]. For Markov''s random field
    segmentation technology, an image underpinning is produced with a randomized sector
    based on a probability density function.


    In composite image classification, both edge-based and region-based methods are
    combined. The picture is divided into parts and then fused using division and
    fusion techniques. Moreover, the technique can identify patterns that should be
    focused on the edge [47]. For a comprehensive comparison of various segmentation
    algorithms, refer to Table 1.


    Table 1. The advantages and the demerits of various segmentation algorithms applied
    in medical Image processing.


    | Technique Used | Advantage(s) | Drawbacks | Refs. |

    | :--- | :--- | :--- | :--- |

    | (i) Graph slice method, (ii) K-nearest neighbour, (iii) Region-based process
    (iv) K-means scheme | CT images with noise can be reduced to get accurate results
    | Time-consuming | [48] |

    | Quad-tree separation method | RoI properties can be represented in the most
    convenient and easy way. | Shift-invariant towards different quad-trees. | [48]
    |

    | Otsu Thresholding | Requires less storage, easy to access, very little in-silico
    cost, and executed at a .very high speed. | Least accuracy when grayscale values
    overlap. Also, it is very sensitive to noisy images. | [49] |

    | Edge recognition segmentation | High contrast boundaries can be obtained. |
    Lack of identifying noise images. | [50] |

    | Watershed segmentation | Simple and efficient in recognising all types of images.
    | Need reference for operation while working with noisy images. | [51] |

    | Artificial Neural Network (CNN, RBFNN, ANN etc.) | Ultra-fast technique for
    segmentation. | High training time. | [52, 53] |'
