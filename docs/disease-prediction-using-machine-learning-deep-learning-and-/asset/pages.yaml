    neural network was used for feature extraction and classification. The study showed
    that at high iterations, all models gave similar results. Though, after 150 rounds,
    FL - ResNet50 with augmented data showed the best performance with an accuracy
    of 97.0; a sensitivity score of 98.11; and a specificity of 95.89. Since the study
