    # VGG-16 [30]


    The VGG model stands for the Visual Geometry Group as proposed by Oxford and hence
    it is also called OxfordNet. Here, 16 refers to the fact that the model has 16
    layers with weights. VGG16 is a convolutional neural network model. The model
    includes 3 fully connected layers that follow a stack of convolutional networks.
    VGG16 is known for having multiple 3×3 kernel-sized filters instead of a large
    number of hyper-parameters. The model uses convolution layers of 3X3 filter with
    a convolutional stride of 1 and padding and max pool layer of a 2x2 filter of
    stride 2. Here, stride refers to the number of pixels shifted over the input matrix
    where stride 1 means that the filters will be moved one pixel at a time and stride
    2 shows that the filters will be moved to two pixels at a time. The first two
    layers of VGG16 have 64 channels of a 3X3 filter size and the same padding. This
    is followed by a maxpool layer of 2x2 pool size and stride 2x2 and then 2 convolution
    layers of 128 channels of 3X3 kernel and the same padding. Then again comes a
    max-pooling layer similar to the previous one. This is then followed by 2 convolution
    layers of filter sizes 3X3 and 256 filters. After that, there are 2 sets of 3
    convolution layers and a similar max-pooling layer. Each convolution layer has
    512 filters of 3X3 size with the same padding. The image then obtained at the
    end of this architecture is then passed on to the stack of two convolution layers.
    The final convolution layer of the model is the soft-max layer. All the hidden
    layers of the VGG16 have rectification (ReLU) non-linearity as their activation
    function as the ReLu is found to be more efficient computationally due to its
    faster learning rate.


    # AlexNet [31]


    AlexNet is a convolutional neural network with deep layers with a higher number
    of filters than the previously proposed models like LeNet, etc. The architecture
    of'
