- pgno: 48
  md: '# Role of Machine Learning and Deep Learning Techniques in Detection of Disease
    Severity: A Survey


    Geeta Rani¹, Vijaypal Singh Dhaka¹* and Sushma Hans²


    ¹ Department of Computer and Communication Engineering, Manipal University Jaipur,
    Jaipur, India


    ² Amity University, Dubai Campus, Dubai, United Arab Emirates


    Abstract: The increasing number of health issues is a cause of concern for public
    as well as health services across the globe. However, a boom in the use of imaging
    techniques such as CT scans and chest radiographs has been observed for correct
    diagnosis. But, manual scanning of these modalities requires expertise in modality
    reading. It is also a time-consuming task. Artificial intelligence-based techniques
    have proven their potential in pattern recognition, object identification, and
    data analysis. Therefore, these techniques can be used to provide assisting tools
    for the primary screening of diseases from these modalities. It has been observed
    from the literature that a lot of research works are available on disease diagnosis
    and classification using machine learning, and deep learning. But, the disease
    severity detection is underexplored. Moreover, the techniques employed for the
    detection of the severity of diseases have lacunae that need immediate attention.
    These challenges motivated us to review the machine learning and deep learning-based
    technological solutions proposed in the literature for the detection of disease
    severity. The objective of this research is to present a comprehensive survey
    of research works available about disease severity detection. This research also
    presents a comparative analysis of the machine learning techniques and deep learning
    techniques employed, datasets used, and performance achieved. It also highlights
    the drawbacks of the technological solution proposed. Further, it provides the
    directions for future scope in the domain of disease severity detection.


    Keywords: Artificial intelligence, Disease, Deep learning, Machine learning, Severity.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# INTRODUCTION


    The onset of COVID-19 in the year 2020 enforced us to rethink about the importance
    of individual as well as community’s health. Also, it worked as a driving force
    to investigate the quick and effective means of disease diagnosis. Thus, a huge
    change in the health infrastructure, disease diagnosis techniques, and human resource
    management is observed. The technological solutions have been proposed as an alternative
    to traditional laboratory tests to minimize the cost of disease diagnosis and
    delay in report generation.


    The study of the literature reveals the potential of Machine Learning (ML) and
    Deep Learning (DL) techniques in image quality enhancement [1, 2], pattern recognition,
    and image reconstruction [3, 4]. Thus, these techniques have been widely used
    for disease screening in human beings [5 - 7] as well as plants [8].


    In recent years, the detection of the severity of diseases has gained significant
    attention from the research community. Detection of the severity of a disease
    at an early stage is essential to reduce its impact on the patients and mortality
    risks in patients. Many patients may miss the correct time of treatment as only
    a few symptoms appear at an early stage of disease. Therefore, there is a need
    to utilize the potential of computer-aided automatic diagnostic methods for detecting
    disease severity.


    The degree of accuracy of severity prediction using traditional laboratory tests
    is highly dependent on the methods of sample collection, sample storage, transportation,
    and equipment used. Also, these techniques are inconvenient to patients, incur
    high costs, and lead to delays in severity detection. Thus, it may increase the
    mortality rate. These challenges motivated us to explore the technological solutions
    available for the detection of disease severity.


    The comprehensive study of available research works shows a significant contribution
    from the research community in the arena of machine learning and deep learning
    for disease severity detection. Indeed, various ML techniques have been employed
    for severity detection when parametric data is available in the form of reports,
    ECG signals, clinical features, etc. [10 - 16]. The researchers employed the techniques
    such as K-Nearest Neighbour (KNN), Support Vector Machine (SVM), Random Forest
    (RF), Multi-tree XGBoost model and AdaBoost. The comparative analysis of these
    techniques is shown in the subsequent section in Table 1. These techniques have
    their own significance based on the type of dataset available and the result required.
    However, ML techniques reported the highest accuracy of severity detection approximately
    100% but there is a need to improve the reliability and robustness of these techniques.
    Moreover, these techniques require clinical data or data collected in terms of
    reports. The data'
