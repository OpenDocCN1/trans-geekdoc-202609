  md: '# MATERIAL AND METHODS


    # Dataset Description


    The response data for the ISAAC core questionnaires gathered under the first phase,
    a study that has been used across several pilot studies, was used to validate
    the system performance [14]. The questions used in the collection of data typically
    signify sensitive and specific indicators of the disease. The data are cross-sectional
    in that it involves the analysis of data concerning a specific population which
    is widely a significant subset that is utmost representative at a specific point
    in time. The data was gathered across two age groups, 13 to 14 years and 6 to
    7 years. While in the older group of children, the response was completed by the
    children themselves, and the same was completed by the parents in the other group.


    # Combatting Class Imbalance


    The New Delhi dataset contained the details of 2961 subjects explained with respect
    to 47 variables indicative of asthma comorbidities and symptoms. The disease outcome
    was reported as unknown for 112 samples. Hence, we excluded all 112 samples yielding
    a dataset containing 2849 samples. However, only 110 subjects out of the total
    population were asthmatics and hence we sought to combat the imbalance by performing
    stratified sampling that was able to draw 110 samples from the other category
    too (non-asthmatics), thus ending up with a balanced dataset that was fed as the
    input data. Along similar lines, we worked to draw 2% amounting to 64 subjects
    from the non-asthmatics from the total population to combat the class imbalance
    that would have resulted in 78 asthmatics in the population, resulting in an input
    dataset containing 142 subjects.


    # Feature Clustering


    Initially, the predominant features that can be identified as significant comorbidities
    of asthma disease are chosen by applying feature clustering. Feature clustering
    is performed by employing Modified Fuzzy C means clustering (MFCM), which uses
    an objective function based on correlation, unlike the traditional Fuzzy C Means
    clustering which uses an objective function based on distances [10, 11]. We chose
    to organize the input feature set into four clusters as per the evaluation results
    of subtractive clustering. The features that coexist with asthma attributes are
    extracted from the cluster containing asthma. This leads to a reduced feature
    set in the process.


    A correlation-based objective function is used in the fuzzy c means clustering.
    The distance metric here incorporates a Pearson’s correlation coefficient that
    is'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'indicative of the difference between two given features or between a feature
    and a cluster. Features may correlate directly or inversely indicating a positive
    or negative correlation. Correlated features will be clustered into a common group
    irrespective of their expression values. The distance metrics are defined as dij
    = 1 – p2 Xi, Cj, where pXi, Cj, the correlation (Pearson measure) between feature
    xi and a cluster cj. The correlation would be 0 in case of a high correlation,
    either positive or negative.


    # Subject Clustering


    For a disease such as asthma, which is heterogeneous in nature, subject clustering
    has been a preferred approach to disambiguate the clinical differences between
    subjects [17]. We opted to use K means clustering and the choice of the number
    of clusters indicating the parameter “K” was varied from 2 to 8, for which silhouette
    scores were obtained. Silhouette score was high for two clusters, with the naive
    data was high for eight clusters with New Delhi data. The distribution patterns
    of asthmatics and non-asthmatics in the different clusters are well illustrated
    in Fig. (1a and b). The subjects in the two datasets were organized into two and
    eight clusters with the reduced feature set as shown in Fig. (2a and b) respectively.
    Following this, the prediction of subjects with and without asthma was done by
    applying classification and regression trees with the addition of a feature that
    indicated cluster evaluation score. The distribution patterns of asthmatics and
    non-asthmatics in the different clusters are well illustrated in Fig. (2).


