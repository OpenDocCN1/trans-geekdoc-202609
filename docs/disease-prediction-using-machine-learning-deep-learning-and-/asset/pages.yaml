    label. Moreover, the RSNA Pneumonia Detection Challenge dataset [28], which consists
    of raw data from 29684 DICOM images was used that included normal patient cases
    and non-COVID-19 pneumonia patient cases. And lastly, 1096 CXR images of the RSNA
    International COVID-19 Open Radiology Database (RICORD) [29] were also compiled
    into the COVIDx Dataset.


    Now, since all these datasets had different formats and diverse distributions,
    the data needed to be pre-processed and cleaned for final use for our federated
    learning models. For example, the top 8% of the CXR images were cropped prior
    to training in an attempt to remove the embedded text from the images. Further,
    data augmentation was also applied for the data where orientation verification,
    LUT transforms, intensity shift, etc. needed to be checked. The RICORD dataset
    required some preprocessing before merging it with the other datasets as it had
    some images that contained padding and some images were unusable. Also, it was
    necessary to classify lung abnormalities into three specific classes, viz. COVID-19,
    pneumonia, and normal. For this purpose, labels such as SARS, MERS, Streptococcus,
    Klebsiella, Chlamydophila, Legionella, E.Coli, and Lung Opacity were all mapped
    under the class ‘pneumonia’ while the labels COVID-19 and normal were mapped as
    the classes themselves. Now finally all the datasets are merged into the COVIDx
    dataset and then unevenly re-distributed into three silos that have data from
    all three classes.


    Here the silos are referred to as clients and the training dataset distribution
    can be seen in Table 1. As shown in Table 2, Client 1 is assigned 3000 CXR images,
    Client 2 is trained on 2950 CXR images and Client 3 holds 3048 CXR images for
    training. The 3000 CXR images on which Client 1 was trained consist of a combination
    of 500 ‘COVID-19’, 1100 ‘Pneumonia’, and 1400 ‘Normal’ images. Client 2 was trained
    on 2950 CXR images, out of which 700 images belonged to the class ‘COVID-19’,
    900 images to ‘Pneumonia’, and the rest 1350 were ‘Normal’ images. Client 3 trained
    its local model on 798 ‘COVID-19’ images, 1000 ‘Pneumonia’ images, and 1250 images
    of class ‘Normal’. From Table 3, it can be observed that the number of CXR images
    assigned to a particular class is varied. This was done while keeping in mind
    the federated learning models’ real-life application. For healthcare institutions
    where lung abnormalities detection is'
