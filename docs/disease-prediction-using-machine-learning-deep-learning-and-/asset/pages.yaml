- pgno: 23
  md: 'Weishan Zhang, et al., [19] experimented with a dynamic fusion-based Federated
    Learning for COVID-19 detection. Here, two important points are discussed in order
    to improve the efficiency of communication. The first being ''client participation''
    and then ''client selection''. For every round of aggregation, the client is given
    the freedom to choose whether to join in or skip the round with reference to the
    efficiency of the latest model trained. This is ''client participation''. Then
    as a part of ''client selection'', waiting time is considered by the central aggregation
    model as a criterion to select which client will be participating. The dataset
    comprises 746 CT scans and 2960 X-ray images. Here, the X-Ray dataset is combined
    from two sources. The total dataset is divided into training and testing as 2800
    images and 526 images respectively. The experiments were performed using three
    deep learning models namely GhostNet, ResNet101 and ResNet50. The proposed dynamic
    fusion-based federated learning showed superior performance when compared to the
    classic federated learning environment. The results showed that the proposed framework
    does not shorten the time taken for training GhostNet but it does reduce the same
    for ResNet50 (by 8-10 minutes) and ResNet101 (by 25-30 minutes). Also, the paper
    shows that in situations where the network quality is subnormal and the model
    needs to train on a huge amount of parameters, the proposed approach exhibits
    a considerable reduction of time for training. Though the study only shows COVID-19
    identification despite having an availability of viral pneumonia data.


    One more group of researchers, Longling Zhang, et al. [20], proposed a novel framework
    for the detection of COVID-19 pneumonia. The researchers named the framework as
    FedDPGAN: ‘Federated Differentially Private Generative Adversarial Networks’.
    A common issue for the training sample for COVID-19 detection is the lack of high-quality
    data for training and the DPGAN model used in this research solves this issue
    by generating it artificially. After the DPGAN model, the ResNet model is applied
    in a federated learning setting. The study focuses on data availability and data
    privacy in the diagnosis of Covid19. Both IID and non-IID settings are evaluated
    in this study, on three types of CXR images dataset namely COVID-19, normal, and
    normal pneumonia. The dataset comprises images divided as 2000 under the label
    ''normal'', 1,250 of ''normal pneumonia'' and 350 images of COVID-19 pneumonia.
    The dataset has a class imbalance so the researchers have used DPGAN to generate
    diverse data. To solve the non-IID data distribution problem, they have distributed
    the data into two segments. Most clients were assigned normal chest images and
    general pneumonia images while only a few clients received COVID-19 images. The
    proposed FedDPGAN-based ResNet model is compared with FedResNet, DPGAN-based ResNet,
    ResNet, Convolution Neural Network, Multi-layer Perceptron, K-Nearest Neighbour,
    and Support Vector Machine. Out of these, DPGAN-based FedResNet and FedResNet
    are federated models and the other'
  merge: -1
  img_proc: true
- pgno: 24
