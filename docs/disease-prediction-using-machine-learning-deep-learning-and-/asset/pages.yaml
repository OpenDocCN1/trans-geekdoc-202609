    # METHODOLOGY


    Dataset: Multiple publicly open datasets are available pertaining to COVID-19
    imaging, including CT Scans as well as Chest X-Ray (CXR) images. For the research
    presented in this particular paper, the authors have worked with Chest X-Ray images
    from the COVIDx Dataset [23] which comprises 17,369 CXR images of with patients
    from diverse nationalities. This COVIDx dataset used in this research is constructed
    by the compilation and modification of six open-source chest radiography datasets
    [24 - 29]. The COVID-19 Image Data Collection dataset [24] consists of 930 images
    of patients who are COVID-19 positive or suspected of COVID-19 or bacterial and
    viral pneumonia. The second dataset is given in Fig. (1).


    ![](img/0616422b380b1bd62613a261ed51be87_25_0.png)


    Fig. (1). Overview of the federated learning based approach.'
