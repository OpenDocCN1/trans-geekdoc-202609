- pgno: 18
  md: '# CHAPTER 1


    # Role of Federated Learning in Healthcare: A Review


    Geeta Rani³, Meet Oza¹, Heta Patel¹, Vijaypal Singh Dhaka³,* and Sushma Hans²


    ¹ Manipal University Jaipur, Jaipur, India ² Amity University, Dubai Campus, Dubai,
    United Arab Emirates ³ Department of Computer and Communication Engineering, Manipal
    University Jaipur, Jaipur, India


    **Abstract:** In the modern era, there is a boom in automating medical diagnosis
    by adopting emerging technologies and advanced applications of artificial intelligence.
    These technologies require a huge amount of data for training the models and precisely
    predicting the disease or disorder. Multiple organizations can contribute data
    for such systems but maintaining data privacy while sharing the data is a major
    challenge. Also, provisioning a large data corpus for the performance improvement
    of machine learning and deep learning models in the healthcare domain while keeping
    the patient’s medical confidentiality intact is a point of concern. Thus, there
    is a strong need to preserve the privacy of medical data. This calls for the use
    of up-to-the-minute technologies where the necessity of sharing raw data is completely
    eradicated, while each organization receives a catered infrastructure for processing
    data. A cross-silo federated learning model is based on the concept of decentralized
    data weights collection from multiple clients which are then processed on the
    central server for modeling and aggregation, thus maintaining data privacy in
    its true sense. The authors in this manuscript provide a detailed comparative
    study of the different deep learning-based models in federated learning and how
    efficiently they can classify lung X-Ray images into three classes: Covid-19,
    Pneumonia, and Normal. This study can provide a benchmark for the researchers
    looking forward to deep learning-based model applications of cross-silo federated
    learning in healthcare.


    **Keywords:** Covid-19, Diagnosis, Deep learning, Federated, Medical, Machine
    learning, Segmentation, X-Ray.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# INTRODUCTION


    When Covid-19 pandemic hit the world, it became very important to figure out various
    ways to detect the existence of the novel virus, apart from the usual RT-PCR tests.
    Scientists and researchers around the globe have studied, developed, and presented
    numerous ways to detect the novel Covid-19 virus. Many researchers have also provided
    multiple ways to detect Covid-19 and pneumonia through CT-Scans and X-rays of
    lungs with the use of machine learning techniques. But the accurate prediction
    via these machine learning and deep learning models for detection requires a large
    amount of dataset for training the models. In real scenarios, such large datasets
    are either not feasible due to system constraints or the patient’s medical confidentiality
    gets impaired. The feasibility issues persist even though we have access to many
    image annotation tools available in the market. This is because such tools and
    services are very expensive, and they also require expert supervision and proficiency
    especially if they are utilized for disease diagnosis. Along with monetary hindrances,
    the feasibility issue also refers to the communication overhead that would occur
    due to a large dataset being transmitted for centralization [1]. Such an issue
    exists in the healthcare domain and across all domains where the models are required
    to learn and train with the help of multiple clients’ data without invading the
    users’ privacy.


    The application of traditional machine learning and deep learning in the field
    of healthcare has already been studied by various researchers for tumor prediction
    [2], covid-19 screening [3, 4], disease prediction [5], cardiovascular diseases
    prediction [6], coronary artery disease prediction [7], diabetes prediction [8],
    glaucoma detection [9], etc. A similar case pertaining to users’ privacy was encountered
    by Google in 2016 when the team coined the term ‘Federated Learning’ while advocating
    an advanced and novel approach that utilizes distributed data from mobile devices
    for training. Further, this approach presents how a central model is updated by
    only using the aggregate of the parameters of the local mobile devices [10]. Federated
    learning inherently trains the central model based only on the parameters passed
    on by local machine learning models. In addition to only sharing the parameters,
    the parameters are also encrypted before being passed on which increases data
    privacy. Federated learning can be differentiated from distributed learning because
    of the fact that the main objective of federated learning is training on a large
    dataset from different clients without the transfer of raw data. Whereas distributed
    learning focuses on distributing the computing resources across clients [11].
    Incorporation of this Federated Learning along with cross-silo transferred learning
    opens new doors to endless possibilities of more accurate innovations due to the
    availability of a huge data corpus for training without actually having to exchange
    or transfer the data. In cross-silo'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'federated learning, data is segregated as silos, i.e., multiple confined data
    sources which in turn centrally aggregate and train a model by passing out only
    the trained weights and parameters from each client. For collaboration between
    institutions of healthcare, finance, etc. user data is extremely sensitive, and
    open alliances might expose such sensitive data to various vulnerabilities. Cross-silo
    federated learning only sanctions weights and parameter transfer and hence the
    data fenced within the silos itself. And therefore, cross-silo federated learning
    serves as a superior alternative to the traditional centralized machine learning
    approaches. Federated learning has been so far applied to various healthcare applications.
    For example [12], distributed learning has been used to solve a problem related
    to hospitalizations due to cardiac cases; and [13] leveraged machine learning
    in a federated setting to predict fatality and duration of stay at the hospital
    using electronic medical records.


    Federated learning systems seem promising but due to their nature of a dispersed
    framework, it faces certain challenges too such as, communication cost, resource
    cost, security of communication, etc. High communication costs refer to the overhead
    incurred due to ample transmissions of parameters for the training process. Frequent
    transfer of parameters is required between silos in order to present potent results
    and hence this communication overhead acts as a hindrance to federated learning
    especially when the connection is slow, and a considerable number of devices or
    organizations are involved. Also, since FL works on distributed systems, each
    system involved might have different computational power, different storage capabilities,
    and different bandwidths. A single slightly less efficient system can be a weak
    link to the entire process and on the other hand, providing all the concerned
    organizations with full-fledged resources might increase the system cost. Apart
    from these overhead challenges, privacy concerns also prevail in federated learning.
    Although federated learning is known as a mechanism to preserve user data privacy,
    it is not general wisdom that FL by itself doesn''t protect data privacy. Recent
    studies [14] have revealed that as models communicate constantly for the transfer
    of parameters, the process is seen to be leaking some information in the course.
    For example, [15] a study showed even a small section of original gradients may
    be enough to let a local data slip from the system. Moreover, since the parameters
    are obtained via model training at the local level, vulnerabilities such as model
    inversion or attacks on model parameters can corrupt aggregate inference.


    Even after weighing the opportunities and hindrances presented by the federated
    learning approach in healthcare, we can conclude that federated learning still
    races way ahead of traditional machine learning practices. The user data confidentiality
    issues that come along with the traditional approaches directly make the patients'''
  merge: -1
  img_proc: true
