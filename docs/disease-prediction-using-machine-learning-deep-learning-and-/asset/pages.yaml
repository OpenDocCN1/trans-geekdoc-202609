    Chang et al. proposed a convolutional Siamese network to identify knee pain using
    MRI scans [23]. The system predicts pain by comparing information from multiple
    2-Dimensional (2-D) MRI slices from the knee with pain and the contralateral knee
    of the same individual without pain. The system performed Euclidean transformation
    to align the slices and cropped and resized the images to 224 x 224 pixels. The
    authors pre-processed the data manually for missing data or abnormal misalignment
    within a slice. The dataset is divided in the ratio of 70:15:15 for training,
    validation, and testing datasets, respectively. The system learned on a pair of
    MRI slices from the two knees that are extracted from a relatively similar location
    within each knee. The system utilized class activation maps because of its ability
    to localize the discriminative image regions from the CNN model for classification
    without any prior locational information. They performed a 10-fold cross-validation
    for the evaluation of the proposed system. The system achieved an AUC of 0.808
    and showed an improvement of 5.6% when subjects with similar Western Ontario and
    McMaster Universities Osteoarthritis (WOMUC) Index pain scores between two knees
    were excluded with an AUC as 0.853. The proposed system still needs to be validated
    on different imaging datasets for the full spectrum of OA.'
