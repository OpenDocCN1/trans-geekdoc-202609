    The classification performance was evaluated by two testing schemes, namely stratified
    random sampling and 10-fold cross-validation which are briefly discussed below.


    Cross-validation is a method adopted for the evaluation of prediction models by
    separating the original sample into a training set in order to train the model,
    and a test set, to evaluate its performance. In 10-fold cross-validation, the
    given input sample is comprehensively partitioned into 10 equal-size subsamples.
    Of the “k” subsamples, a single sample is reserved as part of the validation set
    for testing the'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'model, and the residual 9 samples are used for training the model. The process
    is iterated ten times. The results from these 10 folds can then be averaged thereby
    producing a single estimation. Random sampling with stratification is thus a sampling
    option following a probabilistic approach.


    The technique chosen is used in place of simple random sampling in scenarios where,
    the groupings of the strata are assumed to be too dissimilar and too imperative
    to the problem under study, and/or when investigators desire to oversample a principally
    minor group of interest. Here, the entire dataset is separated into a training
    set and a test set. 80% of the samples are introduced into the training set while
    the rest 20% is organized into a test set and the process is repeated 100 times
    to validate the results.


    # CONCLUSION


    The hybrid decision support system was quite effective in making accurate predictions
    concerning the asthma disease outcome, by achieving sensitivity as high as 85.1%
    and 95.3% for the two datasets under consideration in our study. Further, precision
    was also satisfactory with 85.4% and


    95.4% for the two datasets. It is quite evident from the performance evaluation
    that the results of the developed hybrid decision support system are always promising
    for suitable deployment in real-time scenario, as it explores the benefits of
    both supervised and unsupervised learning techniques. Further, using clustering
    information in the form of cluster evaluation scores as an input parameter to
    the classifiers can efficiently predict disease outcomes, especially with diseases
    such as asthma, as the disease is heterogeneous and exhibits several disease subtypes.


