    huge consolidated datasets). Web analytics is an example of application that instruments
    pages to track the activities of their visitors. | Facebook’s Inbox Search |

    | Document-Oriented | MongoDB, CouchDB | Applications like blogging platforms
    and Content Management Systems (CMS) whose data could be effortlessly expressed
