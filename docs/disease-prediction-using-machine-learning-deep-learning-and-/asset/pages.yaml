  md: '![](img/0616422b380b1bd62613a261ed51be87_195_0.png)


    # # Geeta Rani


    Prof. Geeta Rani received Ph.D. in computer engineering from the University of
    Delhi, Delhi, India in 2017. She has teaching experience of more than 15 years.
    She is the chief editor of one book, has published more than 30 research articles,
    and more than 6 patents. She has acquired more than 17 copyrights on the software
    applications and inventions. Her research interests include machine learning,
    artificial intelligence, image processing and data analytics. Prof. Geeta has
    been a recipient of the ‘Women Scientist-IPR Fellowship’ in 2018 from the Department
    of Science and Technology, India.


    ![](img/0616422b380b1bd62613a261ed51be87_195_1.png)


    # # Vijaypal Singh Dhaka


    Prof. Vijaypal Singh Dhaka received Ph.D. in computer engineering from the Bhimrao
    Ambedkar University, Agra, India, in 2010. He has more than 18 years of industry
    and academic experience at various organizations of repute. He has more than 80
    publications in journals of great repute and guided 11 research scholars to earn
    PhD. He has published more than 6 patents and acquired more than 15 copyrights
    on the software applications and inventions. He received “World Eminence Awards
    2017” for leading research contribution in ICT for the Year 2016, at WS-4 in London
    on 15th Feb 2017.


    ![](img/0616422b380b1bd62613a261ed51be87_195_2.png)


    # # Pradeep Kumar Tiwari


    Prof. Pradeep Kumar Tiwari is an associate professor at Dr. Vishwanath Karad MIT
    World Peace University Pune. He has teaching experience of more than 10 years.
    He worked as controller of examination for an online education program at Manipal
    University Jaipur. He has published more than 60 articles in journals and conferences
    of repute. His research area is artificial intelligence and cloud computing.'
