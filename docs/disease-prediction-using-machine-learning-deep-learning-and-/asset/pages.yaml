- pgno: 57
  md: 'Another team of researchers, Isler et al. proposed a multi-layer perceptron
    classifier that utilizes short-term HRV measures as input and classifies HF into
    systolic and diastolic CHF with an accuracy of 96.43%. Similarly, Shahbazi et
    al. performed feature extraction with Generalized Discriminant Analysis (GDA)
    on long term HRV measures feature to determine HF severity estimation using K-NN
    with an accuracy of 100%. But, they evaluated the performance of their technique
    on a very small and unbalanced dataset. Therefore, generalization of the results
    is not possible. Candelieri et al. implemented the SVM hyper-solution framework
    that employs genetic algorithm based meta-heuristic search for the most reliable
    hyper-classifier for destabilization and gave an accuracy of 87.35%. Similarly,
    Zolfaghar et al. predicted the risk of readmission for Chronic Heart Failure (CHF)
    within a period of 30-days using the Random Forest algorithm. They reported an
    accuracy of 87.12% on the dataset comprising features such as socio-demographic,
    lab tests, discharge disposition, and medical comorbidity.


    Next, Taslimitehrani et al. employed the CPXR (log) classification algorithm that
    uses a pattern as logical characterization of a subgroup of data and a regression
    model to characterize the relationship between predictor and response for data
    of that group. They performed experiments on electronic health records of the
    Mayo clinic with the dataset comprising 5044 patients. The technique proposed
    in this research outperformed the decision trees, Random Forest, SVM, AdaBoost,
    and logistic regression with an accuracy of 93.7% for prediction of mortality
    rate in the age of 1 year, 83% for the age of 2 years, and 78.6% for the age of
    5 years.


    Leeza et al. proposed a dictionary based automated system for severity detection
    of Diabetic Retinopathy (DR) using a Bag of Feature (BoF) technique [14]. This
    approach did not use any pre-processing and post-processing steps. BoF allows
    image collection and also helps in identifying visual patterns of the whole image
    collection. The authors applied speed up robust features algorithm and histogram
    of oriented gradients to compute the descriptive features of retinal images. The
    algorithm uses SURF descriptor for feature extraction. The SURF descriptor is
    invariant to image rotation, illumination changes and scale. BoF uses coding and
    pooling to preserve valuable information that can be lost during quantisation
    of visual words and loss of spatial information. The system classified the severity
    level of DR into five classes using radial basis kernel SVM and Artificial Neural
    Networks (ANN) to classify input images. The four-layered ANN with scaled conjugate
    back propagation technique employs gradient descent to reduce the mean squared
    error. SVM achieves 98.3% accuracy, 95.92% sensitivity and 98.9% specificity whereas
    ANN achieves an accuracy of 92.92%, specificity of 95.97%, sensitivity of 83.83%
    and PPV of 83.82% on the test dataset. The dataset containing 35126 images is
    released by Kaggle. It is apparent from the results that the proposed system achieved
    better results using'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'visual features with SVM. This proposed system with SVM algorithm improved
    the accuracy by 1% over the previous DNN based approach.


    This is apparent from the above discussion that ML techniques such as KNN, RF,
    SVM, AdaBoost, logistic regression, and ANN have been employed on the dataset
    collected from hospitals and publicly available datasets. These techniques reported
    the accuracy in the range of 78% to 100% on various datasets for the detection
    of severity of diseases such as heart failure, tetnus, hands and mouth disease,
    COVID-19, and diabetes. The comparative analysis of these techniques has been
    presented in Table 1. It is evident from the analysis presented in Table 1 that
    mostly techniques have been applied on a small dataset collected from a specific
    geographical location. Moreover, blood tests and urine tests are initial requirements
    for employing these techniques for disease severity detection. Thus, these techniques
    are not the alternative for laboratory tests, but used as a tool for reporting
    and data analysis for predicting disease severity. The comparative analysis of
    the existing techniques is discussed in Table 1.


    Inference deduced: From the analysis of machine learning techniques employed so
    far, we conclude that there is a huge scope to implement these techniques on dataset
    collected from various geographical locations, and at various stages of a disease
    for improving the reliability of robustness of these techniques. Also, the severity
    detection is applied for a very less number of diseases. This raises the demand
    for extending the applications of ML techniques for severity prediction of more
    diseases. Further, we conclude that there is a scope to integrate the ML techniques
    with IoT for data collection, and communication. Also, the integrated model of
    IoT, and ML can be available at a cloud storage for hassle free data sharing,
    processing, round the clock availability, and location independent accessing of
    prediction results. The sensor based data collection may reduce the number of
    laboratory tests required for prediction of severity of a disease.


    # Severity Detection using Deep Learning


    Bodapati et al. proposed a composite Deep Neural Network (DNN) architecture with
    gated-attention mechanism to automatically diagnose the Diabetic Retinopathy (DR)
    disease [14]. The gated-attention mechanism allowed the system to emphasize on
    the input descriptors that represent images of retinal lesion portions. The system
    used two pre-trained models such as VGG16 and Xception to extract important features
    of color fundus images. The authors used the Asia Pacific Tele-Ophthalmology Society
    (APTOS) dataset from Kaggle. The high dimensional features obtained from the above
    models may cause overfitting when used as input. Therefore, these features are
    reduced using the proposed spatial pooling method. The authors worked upon the
    idea that the use of multiple'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'image representations as input will complement each other and improve the system''s
    performance. They implemented the composite DNN model with two channels that accept
    two different representations of the retinal representations, process them and
    learn the information about lesion present in those images. The authors compared
    the proposed composite DNN with other ML methods such as linear regression, KNN,
    Decision Tree (DT), SVM and Multi-Layer Perceptron (MLP) and showed that DNN outperforms
    all these methods with an accuracy of 97.32%. The major limitation of this work
    is that it has poor performance in higher severity level prediction due to inadequate
    samples.


    Grover et al. proposed a deep learning-based methodology to determine disease
    severity [15]. They worked on UCI''s Parkinson''s Tele-monitoring Voice Data set
    of patients. The dataset contains 5875 biomedical voice measurements of 42 patients.
    The authors employed the classifier containing 16 units in the input layer, 10,
    20, and 10 neurons in each of the hidden layers respectively. The technique utilized
    the Total Unique Parkinson''s Disease Rating Scale (UPDRS), Motor UPDRS, and 16
    biomedical voice measures the features for prediction. Based on the values of
    UPDRS and motor UPDRS, the system classifies the dataset into severe and non-severe
    classes. The system attained an accuracy of 62.733% with a total UPDRS score and
    an accuracy of 81.667% with the motor UPDRS score. The authors concluded that
    motor UPDRS is a better feature for classifying Parkinson''s disease as compared
    to total UPDRS. Based on the comparative analysis of Deep Neural Network (DNN)
    and adaptive neuro-fuzzy inference system with Support vector regression, the
    authors claimed the supremacy of the DNN approach.


    Next, Kermany et al. developed a deep learning-based diagnostic tool for screening
    of patients with common treatable blinding retinal diseases [16]. The authors
    proposed a transfer learning-based algorithm to meet the challenge of a small
    dataset. They tested their algorithm for Optical Coherence Tomography (OCT) images
    of the retina and the pediatric chest radiograph to verify its generalizability.
    They used the dataset comprising 108,312 OCT images for training and 1000 images
    for testing the AI system. The system attained its maximum accuracy, sensitivity,
    and specificity of 96.6%, 97.8%, and 97.4% respectively after 100 epochs. Further,
    training the pre-trained system using the dataset comprising 1000 images reported
    an accuracy of 93.4%. This shows the importance of utilizing transfer learning.


    Chithra et al. proposed a self-Adaptive Fractional Crow Search-based Deep Convolutional
    Neural Network (AFC-SVNN) model for the severity detection and identification
    of infection level of Tuberculosis (TB) disease [17]. They followed a five-step
    process that includes preprocessing, segmentation, feature extraction,'
