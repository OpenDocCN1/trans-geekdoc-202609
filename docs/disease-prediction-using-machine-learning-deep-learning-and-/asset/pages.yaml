    with an accuracy of 0.934. The drawback of this approach is that it is implemented
    on a small dataset. Thus, it is less reliable for practical use.


    Emrah Irmak proposed a fully automatic Convolutional Neural Network (CNN) model
    for COVID-19 disease severity assessment. The model is trained and tested using
    chest X-ray images labelled with four classes viz. mild, moderate, severe, and
    critical [18]. In this study, COVID-19 severity score is determined based on opacity
    degree and lung involvement. The author utilized nine datasets from different
    publicly available sources to carry out this research. All images are resized
    to 227 x 227 x 3 and are in color format. The images are randomly separated as
    training, validation, and test sets in the ratio of 60:20:20. Initially, the authors
    employed Grid Search Optimization (GSO) technique to decide the hyper and architectural
    parameters of the CNN model. At the first step, GSO determined 16 weighted layers
    i.e. one input, three convolutions, three ReLU, one normalization, three max-pooling,
    two fully connected, one dropout, one softmax, and one classification layer. Later
    on, these hyper-parameters are tuned in the second step. The classification is
    done using the CNN architecture and tuned hyper-parameters in the third step.
    The performance of this model is evaluated using the five-fold cross-validation
    procedure. The model achieved 95.52% average classification accuracy after 240
    iterations. The average AUC value of the ROC curve is 0.9873. The proposed system
    differs from other techniques as it performed disease detection as well as assessment.
    The proposed fully automatic CNN method is more objective, faster, non-invasive,
    and does not require much expertise and experience. The drawback of this approach
    is that it focuses mainly on COVID-19. It lacks to assess other categories of
    pneumonia such as bacterial, and non-COVID viral pneumonia.


