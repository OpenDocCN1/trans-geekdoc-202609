  md: '# Role of Artificial Intelligence in 3-D Bone Image Reconstruction: A Review


    Abstract: Three-dimensional geometry of a bone is important in the correct diagnosis
    of a disease, arthritis, or other bone deformities. The modalities such as Computer
    Tomography Scans and Magnetic Resonance Imaging are used for a three-dimensional
    view of a bone. Both the above- stated modalities have high costs and expose the
    patient to strong carcinogenic radiations. Computer Tomography captures an extensive
    number of images to collect the required information from a bone. Another modality
    Magnetic Resonance Imaging is more suitable for retrieving information from soft
    tissues rather than bones. Therefore, it becomes less effective to read the pathology
    from bones. This has motivated the authors to identify imaging techniques useful
    in detecting the pathology or deformity in bones. Also, this is the need of the
    hour to provide a low cost and safer technique of bone imaging. To address this
    need, we present a review of the bone imaging techniques and techniques applied
    for the conversion of two dimensional images into three-dimensional form. We also
    give the directions for developing the patient-specific and organ-specific optimized
    techniques for 3-D reconstruction.


    Keywords: Dual-energy, Deep learning, Deformation, Femur, Machine learning, Three
    dimensional, X-ray.


    # INTRODUCTION


    Three Dimensional (3-D) structure of an organ is important for the diagnosis of
    a disease. The 3-D structure provides an exact configuration and orientation of
    the organ. So, it is useful in the detection of disease in tissues or fractures
    in bones.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'This structure also gives information about chronic bone loss such as a glenoid
    defect in recurrent shoulder dislocation and the extent of osteophytes in the
    arthritic joint. Computer Tomography (CT) scan and Magnetic Resonance Imaging
    (MRI) provide a 3-D configuration of a bone. But these techniques are less preferred
    than 2-Dimensional (2-D) techniques due to their high cost and heavy exposure
    to carcinogenic radiations [1].


    The Dual-Energy X-ray Absorptiometry (DXA) images are used to diagnose osteoporosis
    in patients. In the DXA image, the value of the T-score is presented. The value
    of the T-score between +1 to -1 indicates healthy bone. Its value between -1 to
    -2.5 shows that the bone has become prone to osteoporosis [2]. This state is named
    osteopenia. A value below 2.5 is an indication of the poor quality of a bone and
    a sign of osteoporosis. In this disease, there is a decrease in Bone Mineral Density
    (BMD). Thus, it increases the risk of bone fracture. As per details given in [3],
    in Europe, 30% of women of the age of 50 years suffer from osteoporosis. As per
    the report published in the year 2000, 3.1 to 3.7 million cases of osteoporosis
    were recorded. The direct cost paid for the treatment of this disease was reported
    32 billion [4]. As per the trend reported in a study [4], the cost may rise to
    76.8 billion per year in 2050.


    X-ray imaging is a medical imaging technique used to capture bone deformities.
    This technique shows a clear demarcation between the bones and soft tissues. So,
    it becomes easy to read the information about bone deformity if any. X-ray imaging
    is preferred over a CT scan in case of weight-bearing imaging and dynamic imaging
    of joint motion (fluoroscopy). People prefer X-ray imaging due to its high availability
    and low cost. Therefore, there is a requirement of proposing a technique that
    can provide a 3-D view of a bone using 2-D imaging techniques such as DXA and
    X-rays. The differences among the above-stated medical imaging techniques are
    given in Table 1. The techniques for showing 3-D images of bones or ways to reconstruct
    3-D images from 2-D images are shown in Fig. (1).


    # Table 1. Difference between CT scan, X-ray and DXA techniques.


    | Parameters | CT Scan | X-ray | DXA |

    |---|---|---|---|

    | Radiation Vulnerability | The effective radiation dose from CT ranges from 2
    to 10 millisievert (mSv) [5]. | Exposure to ionizing radiation is about 0.1mSv
    [5]. | Exposure to ionizing radiation lies in the range of 0.1µSv to 5µSv [6].
    |

    | Cost | Cost of CT Scan lies in the range from $1,200 to $3,200 [7]. | The cost
    is from $1200 to $4000 [7]. | This is three times more costly than the X-ray technique
    [7]. |'
