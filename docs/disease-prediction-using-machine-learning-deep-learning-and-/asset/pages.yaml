- pgno: 87
  md: '# CLASSIFICATION


    The spatial arrangement characteristics of feature selection are suitable for
    object recognition and classification. Image attributes can be utilized for region
    segmentation in diagnostic imaging analysis. It identifies significant structures,
    which can be interpreted by employing experience and understanding model and classification
    algorithms [55]. Around each region, very positive (VP), false approval (FA),
    fake negative (FN) and apparent negative (AN) values are measured separately.


    # Statistical Classification Methods


    These methods can be supervised or unsupervised. For example, k-means and fuzzy
    clustering are unsupervised approaches. These approaches are useful to categorize
    unlabelled data. These are useful for the mass screening of diseased and healthy
    people based on their medical images [55].


    # Rule-Based Systems Classification


    The system evaluates the characteristics of using multiple rules to assess specific
    conditions and trigger an action. The rules consist of two parts: assumptions
    on conditions and activities based on quality expertise. A rules-based system
    contains three systems of governance: supervisory or managerial standards, norms
    of care, and guidelines of communications. Supervisory or managerial standards
    are associated with prolonging the research process by integrating control measures,
    such as beginning and ending the operation. The strategic rules select which rules
    are to be tested even during the evaluation stage. They concentrate solely on
    rules that give unique characteristics within data analytics. The regulations
    then convey the data from the input to the activity center, where the fulfillment
    of cognitive standards is planned. Furthermore, before taking action that amends
    the output database, the study rules analyze the facts related to necessary circumstances
    [56].


    # Neural Network Classifiers


    These classifiers are based on back-propagation. The networks learn by changing
    their weights and error propagated. Thus, these are useful to simulate cognitive
    control, and auto-organization mappings as demonstrated in Fig. (14). These are
    also used for feature categorization, object detection, and picture interpretation
    [58 - 64].


    # SUPPORT VECTOR MACHINE (SVM) FOR CLASSIFICATION


    SVM classifier as shown in Fig. (15) is used in mammography for mass classification.
    If a structure meets a specific threshold, the radiologist marks it'
