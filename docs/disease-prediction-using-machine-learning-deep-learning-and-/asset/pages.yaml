- pgno: 148
  md: '# CHAPTER 8


    # The Fusion of Human-Computer Interaction and Artificial Intelligence Leads to
    the Emergence of Brain Computer Interaction


    M. Kiruthiga Devi*


    Department of Computer Science and Engineering, Sri Sai Ram Engineering College,
    Chennai, India


    Abstract: A personal computer may be used, with input devices such as a keyboard,
    mouse, and joystick serving as an interface between the computers and the human.
    The euphestic, physically challenged are unable to use these computer systems,
    therefore, BCI technology has advanced external applications to be managed without
    physical movements in order to assist these physically disabled people and address
    the limitations of HCI. The technological advancement in the field of cognitive
    neuroscience and brain imaging has enabled it to communicate directly with the
    human brain instead of using an interface. Rather than generating signals from
    muscle movements, these systems use brain activity to monitor computers or communication
    devices. Researchers in the field of Human-Computer Interaction (HCI) look at
    ways for machines to utilize as many sensory sources as possible. Further, researchers
    have begun to consider implicit types of data, input that is not specifically
    performed to instruct a machine to perform a task. Systems can evolve dynamically
    based on this data in order to assist the user with the task at hand. Here we
    discussed components of Brain-Computer Interface, its characteristics and challenges.
    The researchers are attempting to replace conventional classifiers with Convolutional
    neural networks (CNNs) that would provide a promising advantage in classification.
    The EEG signals from the brain can be linked seamlessly to mechanical systems
    via BCI applications, making it a rapidly growing technology that has applications
    in fields such as Artificial Intelligence and Computational Intelligence.


    Keywords: Actions, Atmosphere, Artificial intelligence, Brain computer interface,
    Convolutional neural networks, Classifiers, Communication, Computational, Deep
    Learning, Electroencephalographic, EEG, Human-computer interaction, Input devices,
    Movements, Machines, Machine learning, Mechanical system, Neuroscience, Physiology,
    Signals, Sensory, Support vector.


    * Corresponding author M. Kiruthiga Devi: Department of Computer Science and Engineering,
    Sri Sai Ram Engineering College, Chennai, India; E-mail: kiruthigaprofessor89@gmail.com'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# INTRODUCTION


    Sensors are used to track some of the physical processes in the brain associated
    with specific types of thought [1]. As a result of these developments, brain-computer
    interfaces (BCIs) have been developed, allowing communication among systems that
    do not depend on the brain''s usual peripheral nerve and muscle systems. Many
    factors have aided this advancement, including improved understanding of neurobiological
    processes, machine learning algorithms, and deep learning. A personal computer
    may be used as an interface between computers and humans with input devices such
    as a keyboard, mouse, etc. [2]. The disabled persons are unable to use these systems,
    but in order to assist these euphemistic physically challenged people and address
    the limitations of HCI, BCI technology has advanced, allowing external applications
    to be managed without the use of physical muscle movements. BCI calibration is
    difficult with two stages: the low signal-to-noise ratio (SNR) and high subject-to-subject
    variability. The amount of time needed for calibration varies depending on the
    type of paradigm used. It can still be reduced by half. If brain signals have
    a low Signal-to-Noise Ratio (SNR), BCI is most challenging when it comes to accurately
    determine human intentions [3]. The reality is that BCI''s real-world implementation
    is limited by poor generalization potential and low classification accuracy.


    Deep learning approaches have been used to work with brain knowledge in recent
    years to address the aforementioned challenges. While normally machine learning
    algorithms need to select features manually, deep learning can learn complex high-level
    features directly from brain signals, and its accuracy scales well with the size
    of the training data set [4]. It is possible to monitor the activity of the brain
    using different techniques, which can be categorized into two types: invasive
    and non-invasive. The non-invasive BCI system majorly uses Electroencephalogram
    (EEG) signals to capture brain signals from electrodes mounted on the scalp. EEG
    data is extremely noisy, therefore, it can be difficult to extract a coherent
    signal when your brains communicate through your scalp into the EEG sensor. As
    a result, it''s critical to extract useful information from distorted brain signals
    and to develop a strong BCI system. When data from electroencephalographic (EEG)
    sensors is processed through brain-computer interfaces (BCIs), the number of channels,
    the amount of training data, and the signal-to-noise ratio affect the accuracy
    of classification [5]. In real-world applications, the SNR is the most difficult
    to modify of all these variables. The development of several preprocessing and
    feature engineering methods for reducing noise has been time-consuming and may
    result in information loss in the extracted features. Feature engineering is heavily
    reliant on human domain knowledge. Human experience can aid in capturing characteristics
    of some'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'specific aspects, but it is inadequate in more general situations. An algorithm
    automatically extracts representative features as the result. Because most machine
    learning research focuses on static data, it is unable to reliably classify constantly
    evolving brain signals [6, 7]. BCI systems need to use novel learning methods
    to deal with dynamic data streams [8]. The benefit of deep learning is backpropagating.
    By back-propagating, it learns distinguishable information by utilizing the raw
    brain signals without the need to pre-process and engineer features. Furthermore,
    deep neural networks may use deep structures to capture latent dependencies and
    representative high-level features [9].


    # COMPONENTS OF BRAIN COMPUTER INTERFACE


    The primary objective of a Brain-Computer Interface is to detect and analyze the
    signals in the user''s brain that indicate user intention and then transmit these
    signals to an external computer that executes the user instruction. A BCI-based
    system has four components that work together to achieve this objective as shown
    in Fig. (1).


    ![](img/0616422b380b1bd62613a261ed51be87_150_0.png)


    Fig. (1). Components of BCI.


    # Signal Acquisition


    It is the first component that detects and analyses brain signals. The purpose
    of this component is to receive and register signals produced by neuronal action.
    It also transfers the resulting signals to the next part of the BCI component
    for signal enhancement and to reduce the noise [10].'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Feature Extraction


    It is the first step in the signal processing of the Brain Computer Interface.
    Digital signals (such as signals corresponding to user intentions) are processed
    by analyzing different characteristics of the signals and translating them into
    acceptable commands for user output.


    # Translation


    In this stage of signal processing, the extracted characters of the signal are
    passed to a translation algorithm. It converts the characters into valid instructions
    that are sent to an external system in order to fulfil the purpose (e.g. the user’s
    intention is converted into complete instructions).


    # Application/Device Output


    A translation algorithm provides instructions for driving and controlling an output
    device. It helps users achieve their objectives such as selecting alphabets, controlling
    a mouse, moving a robotic arm, using a wheelchair, moving a paralyzed limb, etc.
    [11].


    ![](img/0616422b380b1bd62613a261ed51be87_151_0.png)


    Fig. (2). Number of BCI related paper publication over the year.


    # BCI CHARACTERISTICS


    # BCI Systems are Classified according to how they use the Brain: Active BCI


    This mechanism derives its effects from the brain’s voluntary programmed movements
    which are independent of external stimuli. In order to manage an application such
    as BCI, it is activated by a person’s deliberate motor imagery [12].'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Reactive BCI: It is a device that uses brain signals which are formed as a
    result of response to a stimulus. It is used to monitor an application by the
    consumer by P300.


    Passive BCI: Detecting drowsiness in drivers and thus preventing road traffic
    accidents is possible through methods that utilize unintended emotional/cognitive
    brain functioning.


    Signal Acquisition Modalities have been used to Classify Structures as Invasive
    or Noninvasive BCI


    The most important component of a BCI-based device is the ability to measure brain-generated
    oscillations. It represents the user''s current voluntary neural behavior and
    various signal acquisition techniques have been investigated. By using the BCI
    application, you can determine which acquisition method and calculations are appropriate
    for your signals [13].


    # Invasive Techniques


    Electrocorticography (ECoG) analyzes the neuronal activity of the brain either
    intra-cortical from within the nervous system or on the surface of the cortex.
    The main benefit is that they have a spatial resolution and high temporal, by
    which the signal-to-noise ratio and efficiency of the signal are improved. These
    methods have a number of flaws. Aside from concerns regarding the usability of
    surgical procedures, an issue with output has also been raised. One of them is
    the limited size of the tracked brain regions by such implants. They can''t be
    moved to test brain activity in another part of the brain once they''ve been implanted.
    During a surgical procedure, electrode strips or grids are implanted over the
    surface of the cortex as shown in Fig. (3). ECoG recording falls somewhere in
    the middle between non-invasive security and invasiveness. It has a higher spatial
    resolution and signal amplitude than non-invasive techniques like EEG because
    of its proximity to the signal source. ECoG brain signals were used to discern
    right vs left hand and finger vs tongue imagery movement for both non-paralyzed
    and paralyzed epileptic patients and were also used to calculate kinematic parameters
    for five-finger flexion.


    The most invasive approach is the Intracortical acquisition technique. It is implanted
    under the brain''s cortex surface. It can be done with an array of electrodes
    or a single electrode that monitors individual neuron action of the signal. Since
    the electrode tips are located close to the signal source, the arrays must be
    stable in excess of time. Its use in source localization problems is highly recommended
    due to its high spatial resolution. Intracortical acquisition, on the other hand,
    can experience signal variability over time. Rats and monkeys have'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'been heavily involved in BCI research that uses intracranial invasive acquisition
    as shown in Fig. (4). Animals with implanted electrodes were used to study movement.
    In a study aimed at reducing the number of electrodes used, monkeys first learned
    to transfer a cursor into 8 targets positioned at the imaginary cube corners.
    Adaptive movement prediction algorithms were trained from the extracted data to
    assess movement intentions. In virtual reality, monkeys were used to manoeuvre
    a brain-controlled robot arm [14]. Researchers have even succeeded in using a
    real robot arm to assist them in eating. Amyotrophic lateral sclerosis (ALS) is
    a neurodegenerative condition connected to nerve cells in the brain and spinal
    cord. Motor neurons run throughout the body, from the brain to the spinal cord
    and from the spinal cord to the muscles [15]. After implanting a single electrode
    in the motor cortex, a patient with ALS was able to shift a cursor on a computer
    screen to pick presented objects.


    ![](img/0616422b380b1bd62613a261ed51be87_153_0.png)


    Fig. (3). Electrocorticography.


    ![](img/0616422b380b1bd62613a261ed51be87_153_1.png)


    Fig. (4). Intracortical.


    # Non-Invasive Techniques


    These methods of recording are based on a process that does not involve the implantation
    of foreign items into the subject''s brain. As a result, it eliminates the need
    for invasive acquisition procedures or permanent implant attachment. Magnetoencephalography
    (MEG) is used for detecting magnetic fields generated'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'by the electrical current in the brain. The superconducting quantum interference
    system is currently used to collect the outside head magnetic signals. A shield
    and specialized equipment are necessary for the laboratory to prevent MEG signals
    from interfering with other magnetic signals, such as the earth’s magnetic field
    as shown in Fig. (5). The skull layer is less skewed by MEG signals than electric
    fields, despite their portability and cost concerns. As compared to non-invasive
    electronic acquiring strategies, this advantage does not result in significant
    improvements in efficiency or training times.


    ![](img/0616422b380b1bd62613a261ed51be87_154_0.png)


    Fig. (5). Magnetoencephalography.


    # Functional Magnetic Resonance Imaging (fMRI)


    The fMRI senses changes in the flow of blood that are connected to the neuronal
    activities in the brain. So, it aids in mapping behaviors to the corresponding
    regions of the brain, a process known as source localization. Any activity involving
    the brain causes an increase in blood flow to the area (Fig. 6). The BOLD contrast
    method is sensitive to hemodynamic responses. Differences in deoxyhemoglobin concentration
    in brain tissue can be seen as BOLD contrast intensities [16]. It has a low temporal
    resolution, but it has a high spatial resolution and can collect data from the
    deep parts of the brain that magnetic or electrical methods cannot.


    ![](img/0616422b380b1bd62613a261ed51be87_154_1.png)


    Fig. (6). Functional magnetic resonance imaging (fMRI).'
