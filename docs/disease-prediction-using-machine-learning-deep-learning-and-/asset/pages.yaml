  md: '**Keywords:** Biomedical image processing, CAD, Combined algorithm, Cancer
    diagnosis, Covid-19, Classification, Feature extraction, Pre-processing, Segmentation.


    # INTRODUCTION


    Computer-based medical image analysis is a crucial task for physicians in diagnosing
    new diseases. In biomedical research, computer-assisted detection (CAD) has become
    widespread, even generating its own field of study. However, it cannot replace
    a physician, it serves as an assisting device in making accurate and quick decisions.
    It may prove an asset especially during medical emergencies. CAD can be broadly
    categorized into CA detection and CA-Diagnosis. CA detection involves marking
    visible parts in images, while CA-Diagnosis is used to analyze the identified
    structures.


    Deep Learning (DL) exhibits the ability to perform pattern recognition, image
    processing, pattern learning, object detection, and pattern matching. Thus, it
    is a valuable tool for early detection of tissue damage and human genome disorders
    [1]. CAD is not a single platform; rather, it is a combination of intelligent
    techniques like machine learning, machine vision, and medical imaging, forming
    a hybrid model. It encompasses various techniques, including PET, MRI, Dermoscopy,
    Biopsy, X-rays, mammography, ultrasound, and CT Imaging. Till now, nearly one
    million images have been captured and analyzed.


    CAD gained popularity in the analysis of stroke caused by brain injury and abnormalities
    in abdominal images. It has the potential to translate blurry or unclear medical
    images into high-contrast ones. Additionally, it can reconstruct and enhance images
    or the region of interest (ROI). Moreover, CAD enables the generation and tracking
    of medical reports for patients. These applications have facilitated the detection
    of normal and chemically altered COVID-19 infections in patients. Primarily, these
    procedures are utilized for the early detection of tumors with the potential to
    develop cancerous tissues.


    The remarkable output accuracy from AI, DL, and ML methods helps doctors and patients
    by reducing the risk of exposure to hazardous ionizing radiation from two-dimensional
    (2-D) and three-dimensional (3-D) imaging instruments [2].


    # APPLICATIONS OF CAD IN MEDICAL ANALYSIS


    CAD approaches are helpful in recognising various diseases ranging from fever
    to life-threatening diseases such as AIDS, cancer, Covid-19 (Fig. 1) outbreaks,
