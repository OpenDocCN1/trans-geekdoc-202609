    # IMAGING MODALITIES


    In this section, we explore the utilization of imaging equipment to capture images
    of the eye''s interior, specifically focusing on the retina. Various computer
    vision-based imaging techniques are discussed, which empower specialists to assess
    retinal health and diagnose a wide range of eye diseases. Eye imaging constitutes
    a crucial branch of medical imaging, involving specialized equipment for photographing,
    scanning, or capturing images of the eye. The chapter delves into diverse eye
    imaging methods, presenting their respective advantages and disadvantages.


    # Ultrasound Imaging


    Ultrasound imaging employs sound waves to create visual representations of the
    interior of the human body. In the context of eye and orbit examination, high-frequency
    sound waves are utilized to produce high-resolution images of the eye and its
    surrounding structures, even in the presence of opaque media [17]. Ophthalmic
    ultrasound typically operates at a frequency of 8-10 MHz, providing much clearer
    images of the internal parts of the eye compared to a regular eye'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'checkup. This examination employs three modes of display: A-mode, B-mode, and
    M-mode.


    A-scan, also known as amplitude scan, is an ultrasound technique used for ocular
    evaluation [18]. In this method, the tear film acts as an effective acoustic transmission
    agent, eliminating the need for ultrasound coupling jelly. A single sound beam
    is emitted from the transducer in A-scan, offering a more detailed, level-by-level
    perspective of the eye compared to a standard eye exam. The frequency of ultrasound
    used in A-scan is 8MHz. This type of ultrasound examination is straightforward
    and simple.


    On the other hand, B-mode, or brightness modulation, provides cross-sectional
    or two-dimensional images of the eye and focuses on real-time evaluation of ocular
    pathology. It operates at a frequency rate of 10MHz. Ultrasound imaging is widely
    used to examine various medical conditions such as lungs, bone defects, breast
    cancer, pulse rate, blood circulation in blood vessels, maternity visualization,
    and ophthalmic evaluation [19].


    # Advantages


    +   - Ultrasound imaging is a valuable tool for rapidly assessing traumatic eye
    injuries.

    +   - By utilizing 3D reconstruction, ultrasound imaging allows for accurate determination
    of the size and location of objects.

    +   - It is particularly effective for evaluating the posterior segment in cases
    of hazy media.

    +   - Ultrasound imaging can detect and distinguish between intraocular and orbital
    lesions.


    # Disadvantages


    +   - Mastering the development of a three-dimensional image from two-dimensional
    B-scan images is considered the most challenging step [20].

    +   - To achieve optimal imaging, increasing the depth requires the use of lower
    frequency.


    # Optical Coherence Tomography (OCT)


    OCT, a non-invasive imaging technique, captures cross-sectional retinal images
    by combining low-coherence interferometry and near-infrared light with specific
    coherence width [21]. By measuring the intensity of reflected light and echo time
    delay, OCT enables ophthalmologists to differentiate between different layers
    of the retina and determine the retinal nerve fiber layer''s thickness, facilitating
    early detection and diagnosis of retinal diseases. Even for healthy eyes, OCT
    can be'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'utilized to establish a baseline image.


    Similar to ultrasonography, OCT operates on the principle of using light instead
    of sound waves. The current OCT imaging systems offer resolutions ranging from
    1 to 15 μm. OCT can be categorized into two types: spectral domain and time-domain
    OCT. In time-domain OCT, image resolution and acquisition speed are inversely
    proportional. Spectral domain OCT overcomes this limitation, enabling simultaneous
    improvements in imaging speed and resolution [22]. Table 1 provides a comparison
    between time-domain and spectral domain OCT, highlighting the advantages of spectral
    domain OCT.


    # Table 1. Types of OCT specification.


    | - | Spectral Domain OCT | Time Domain OCT | Advantages of Spectral Domain |

    |---|---|---|---|

    | Detector | Spectrometer | Single Detector | Faster acquisition Less Motion |

    | Light Source | 840 nm | 820 nm | High definition |

    | Transverse Resolution | 10 microns | 20 microns | - |

    | Axial Resolution | 6-7 microns | 10 microns | Visualization of retinal layers
    are good |

    | Scanning Speed | About 2800 A-scans per second | 400 A-scans per second | Better
    registration |

    | Maximum A-Scans | 8000 | 512 | High number of scans with better visualization
    |

    | Scan Depth | 2mm | 2mm | Slightly better penetration of light |


    For a typical OCT machine, its working principle and complete specifications can
    be seen in Figs. (2) and (3), respectively.


    ![](img/0616422b380b1bd62613a261ed51be87_128_0.png)


    # Fig. (2). Principle SD-OCT [48].'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Advantages


    +   • OCT takes short scanning time and also scans various ocular structures and
    contactless.

    +   • Resolution up to 10 μm which is helpful for quantitative information.


    # Disadvantages


    +   • Scan quality depends on the operator''s skills. Each scan must be taken
    in the range.

    +   • Measurement is not accurate if the scan is not taken at the centre of the
    fovea [23].

    +   • Penetration Depth is limited. It required a greater pupil diameter.


    # Color Fundus Photography


    Color Fundus Retinal Photography is a technique used to capture photographs of
    the inner surface of the eye using a fundus camera. This imaging method allows
    for the observation and monitoring of diseases and their progression over time.
    Fundus photography involves imaging the posterior part of the eye to examine abnormalities
    associated with eye diseases and to monitor their development [24]. The specialized
    camera used for this purpose is commonly referred to as a fundus camera or retinal
    camera, as illustrated in Fig. (4). It consists of a low-power microscope and
    a camera to capture images of the interior portion of the eye, including the optic
    nerve, macula, central, and peripheral retina.


    ![](img/0616422b380b1bd62613a261ed51be87_129_0.png)


    Fig. (3). Specification of OCT.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '![](img/0616422b380b1bd62613a261ed51be87_130_0.png)


    Fig. (4). Retinal fundus camera.


    Fundus photography can include additional techniques such as fluorescein and indocyanine
    green angiography, provided that appropriate filters are used. The image-forming
    optics of the fundus camera direct the necessary light to illuminate the fundus
    in an axial manner. The optical device of the camera projects a ring of light
    from the internal strobe through the dilated pupil, effectively separating incoming
    and outgoing illumination. The outer pupil is illuminated by the ring of light,
    which reflects off the eye, and the central part of the ring allows light to pass
    through the pupil. This light then passes through the lenses of the fundus camera,
    creating a film plane view of the fundus [25].


    # Advantages


    +   - Images can be captured and stored which can be used at later times.

    +   - Different filters and dyes are allowed for different types of test.

    +   - Dilation is not required therefore less invasive.


    # Disadvantages


    +   - Problem in observing anomalies as it lacks depth appreciation on images.

    +   - Unable to produce better three-dimensional images and images are not very
    clear.


    # Fundus Fluorescein Angiography (FFA)


    FFA, which stands for Fundus Fluorescein Angiography, is a diagnostic technique
    used to study the vasculature of the retina. The name “FFA” can be broken down
    as follows: “Fundus” corresponds to the retina, “Fluorescein” corresponds to the
    dye (fluorescein solution) used, and “Angiography” refers to the study of blood
    vessels. The FFA procedure relies on the principle of injecting a fluorescein'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'solution and then photographing the retina to study the contrast report of
    the blood vessels [26].


    During the FFA procedure, ophthalmologists start by putting eye drops in the patient''s
    eye to dilate the pupil. Then, a yellow-colored fluorescein dye is injected into
    a vein, typically in the arm. After a few seconds, the dye reaches the blood vessels
    in the eye, causing them to shine brightly. A digital imaging system is then used
    to capture digital pictures of the eye, providing ophthalmologists with valuable
    information to manage and monitor eye disorders over time [27]. FFA is particularly
    useful in tracking changes in eye diseases and identifying specific treatment
    areas.


    # Advantages


    +   - The treatments have an almost 100 percent success rate, with only a few
    patients out of hundreds of thousands experiencing critical or life-threatening
    effects.


    Fluorescein dye treatment is considered very safe, with a low risk of side effects
    such as nausea.


    # Disadvantages


    +   - The visualization of choroidal vasculature is challenging due to a limited
    view, and the method is invasive as it involves the requirement of an injection.


    # Heidelberg Retinal Tomography (HRT)


    Heidelberg Retinal Tomography (HRT) is a valuable diagnostic technique used for
    thorough examination and documentation of the optic nerve head, which plays a
    crucial role in diagnosing and treating glaucoma. Essentially, HRT is a commercial
    term for confocal scanning laser ophthalmoscopy. By employing a special laser,
    HRT captures three-dimensional images of the optic nerve and surrounding retina.
    This technology allows for precise measurements of topography on a pixel-by-pixel
    basis and the evaluation of various optic disc parameters in a fast and reproducible
    manner.


    During the HRT procedure, the system captures a series of deeper images until
    reaching the desired depth. It acquires three images for each eye, all without
    the need for dilating the pupils. A diode laser with a wavelength of 670 nm is
    utilized for illumination, and a set of 32 confocal photos with 256 × 256 pixels
    is obtained for analysis.


    An updated version of HRT, known as HRT II, uses digital transformation to generate
    frames of 384 × 384 pixels, further enhancing image resolution and'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'diagnostic capabilities. This sophisticated imaging technology continues to
    be a valuable tool in the diagnosis and management of glaucoma and other related
    eye conditions.


    # Advantages


    +   * Pupil dilation is not necessary, as there is an extensive amount of normative
    data available.

    +   * HRT acquires a three-dimensional images of the optic nerve head.


    # Disadvantages


    +   * HRT relies on the operator for contour marking and is specifically designed
    for the optic nerve head.

    +   * It should be noted that the appearance of a blood vessel can be misleading
    in the process.


    # Slit-Lamp Photography


    Slit-lamp photography involves a specifically designed horizontally mounted microscope
    to capture images of the eye’s structures. The microscope’s illumination can be
    adjusted, ranging from a wide pattern to a narrow slit of light, which gives the
    technique its name. A specific application of slit lamp photography is Specular
    Micrograph, used to image the cells comprising the corneal endothelium on the
    backside of the cornea. These images assist physicians in evaluation the condition
    of the cornea. The technique relies on two types of illumination systems: The
    Zeiss slit lamp bio microscope with a bottom-mounted light source and the Haag
    Streit slit lamp bio microscope with a top-mounted light source.


    # Advantages


    +   * Slit lamps are gaining popularity in the field of optometry. These systems
    provide ophthalmologists with a close and detailed view of the eyeball, enabling
    them to identify subtle changes in corneal conditions, such as infections or edema.

    +   * With the help of a slit lamp camera, eye care professionals can capture
    specific photographs and videos using a high-resolution digital camera, allowing
    them to closely monitor the eye’s condition. This capability encourages clinicians
    to document parts or the entirety of the examination, as well as preserve still
    photographs as visual records of their findings.'
