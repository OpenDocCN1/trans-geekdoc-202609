    # LITERATURE REVIEW


    In this section, let us take a look at the previous works by researchers in this
    domain of federated learning to detect the abnormalities of lungs. Many researchers
    have experimented with federated learning to provide prominent techniques to detect
    the covid-19 virus in human lungs. Most of which accommodate CT-Scans as input
    data. For example, a group of researchers [16] Qi Dou, et al., presented a deep
    convolutional neural network-based artificial intelligence model using CT scans
    that incorporated federated learning to detect COVID-19 lung abnormalities. Here
    the main dataset was compiled from 3 hospitals in Hong Kong with 75 confirmed
    covid-19 patients. For external validation, the researchers used 4 other datasets
    which included 22 patients from China and 35 patients from Germany in total. The
    effectiveness of federated learning here was checked on full CT slices, i.e. without
    previously knowing if tissue damage is present or not. For every client in this
    experiment, the central aggregating server was given the dataset size that was
    given as input to every local device. Along with this, the central server was
    also provided with the weighted average of the local models for the updation of
    the global model on the central server. The model trained on an internal dataset
    showed the highest AUC score of 95.40% mostly because it had the single largest
    dataset. However, the joint model that was trained with all the internal datasets
    derived an AUC score of 92.97%. Along with the federated learning model, the researchers
    here applied ensemble learning over three models corresponding to the three datasets.
    The comparison clearly showed that the performance of federated learning across
    all metrics was superior to that of the model ensemble method. The finding from
    this research was that in order to curtail the false-positive predictions, transfer
    learning from an extensive dataset will be more suitable. For evaluation, although
    multiple sources of data were considered, it still included data of 132 patients
    only, which might induce model bias.


    Similarly, another group of researchers [17], Dong Yang, et al., experimented
    by consolidating federated learning and semi-supervised learning. Here, the dataset
    consisted of COVID-19 data that included 736 CT scans of 700 patients from China;
    496 scans of 244 patients from Japan; 472 scans of 147 patients from Italy. Other
    data included 38 CT scans of 38 patients from the National Institutes of Health.
    The CT scans of these patients were examined for known non-COVID-19 types of pneumonia
    from bacteria, and fungi, and non-COVID viruses were included as “other pneumonia”.
    The dataset also included 101 CT scan images of 101 patients, who were men diagnosed
    with prostate cancer, and 474 CT scans'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'from the LIDC public dataset belonging to 474 patients. The study shows that
    the framework is efficient to extract valuable information only if unlabelled
    data is input by the clients and also demonstrates that a lower learning rate
    on unsupervised clients generally benefits all clients involved in the federated
    learning process. The researchers have shown that for the identification of COVID-19-infected
    regions, the data of patients with a completely COVID-19-free background also
    turned out to be contributive. This was achieved via ''false alarm rejection''.
    Although the model fails to classify other types of lung abnormalities like pneumonia
    or cancer, the dataset has high variation in demographics and so the accuracy
    metrics range approximately between 50-60%.


    Further, Rajesh Kumar, et al. [18], have proposed their research on the detection
    of COVID-19 based on CT scan images using an amalgamation of federated learning
    and blockchain along with deep learning models. The researchers have presented
    a Capsule Network-based segmentation and classification for the detection of covid19
    patterns from lung CT scans. This paper proposed a method that uses blockchain
    in order to only fetch the trained model parameters while preserving the client''s
    privacy as the raw dataset is primarily stored by the organization itself and
    is not transmitted further. Basically, a blockchain network is incorporated here
    to receive the locally and individually trained parameters of each client. This
    local model is then fed into federated learning in order to merge it with the
    central model. The new dataset introduced is assembled from hospitals and CT scanner
    machines and hence a data normalization technique is applied here. The data collected
    from 3 hospitals consists of 34,006 CT scans of 89 patients, out of which, 68
    patients were identified as COVID-19 positive. Data normalization applied here
    has two parts: spatial normalization and signal normalization. Segmentation is
    done to get CT scan 2D slices and for classification of covid19, the capsule network
    is used that is very much like Hinton''s Capsule Network. The Capsule Network
    is made up of four layers namely the convolutional layer, hidden layer, PrimaryCaps
    layer, and DigitCaps layer. The study demonstrated that the Capsule Network is
    superior to the standard Artificial Neural Network as in the case of Capsule Network,
    capsules do what neurons do otherwise and the output is a vector representation
    of each component instead of a scalar value like in the ANN. Also to validate
    the federated model, third-party datasets were used. The deep learning models
    used for comparative experiments are VGG16, AlexNet, Inception V3, ResNet 50-152
    layers, MobileNet and DenseNet. The accuracy of 98.68% for the covid19 images
    is the highest using their proposed Capsule Network. Also, the Capsule Network
    has the highest sensitivity/recall and ResNet has the best specificity. The study
    also shows how an increment in the number of clients in turn improves the performance
    of the central model notably.'
