  img_proc: true
- pgno: 89
  md: 'Clinical decision support (CDS) can leverage CAD to aid in patient diagnoses
    provides therapy recommendations, and conducts population Framingham risk analytics
    [70]. The significant changes brought about by CAD have sparked research into
    the technology’s costs, effects, and potential benefits. To achieve this goal,
    a comprehensive understanding of the factors influencing potential users'' engagement
    in the CAD-based sector across various manufacturing and service industries is
    necessary. CAD enables improved patient care, diagnosis, and medical data interpretation.
    According to our specialty-specific situational analysis, CAD algorithms offer
    a high and medically tolerable prediction value in diagnosing illnesses. Despite
    differing workflows, pathologies, and imaging modalities, similar CAD techniques
    show high prediction accuracy across all disciplines, indicating the applicability
    of CAD strategies in radiology and beyond. It is important to note that estimations
    of predictive performance in this meta-analysis are subject to uncertainty due
    to increased heterogeneity and variation between trials. This can be illustrated
    by following research works.


    # Table 3. Comparison of image classifiers for medical image processing.


    | Technique Used | Advantage(s) | Drawbacks | Refs. |

    |---|---|---|---|

    | Support vector machines | The concept of kernels is flexible and user-friendly.
    It works well even in noisy images. | Lack of result transparency. computationally
    expensive. | [65 - 69] |

    | K-nearest neighbor algorithm | Easy to implement. Works well on a noisy dataset.
    | Requires more memory and time intensive. | |

    | Naïve Bayes classifier | Low computation cost. Works well on numeric data. |
    Need a large dataset for good results. | |

    | Neural networks | High accuracy. Efficient in recognizing a complex relationship
    between input and output. | Computationally expensive. Long training time. Ineffective
    to deal with large input features. | |

    | Bayesian networks | Supports missing data | High computation complexity. Requires
    expertise in probabilities. | |


    Chilamkurthy et al. [71] developed a system to detect various critical findings
    on CT head scans using a large dataset. Further investigations demonstrated that
    conventional CAD’s performance in many “human” categories is unmatched, providing
    a high level of confidence. While CAD technologies for breast cancer screening
    reduce human detection errors, still there are ethical and social trust considerations
    and concerns about CAD dependency that need to be addressed. Our research on breast
    cancer screening revealed that CAD exhibits excellent clinical reliability for
    detecting breast cancer on mammograms, ultrasounds, and DBT. The effectiveness
    of these modalities is highly comparable.'
