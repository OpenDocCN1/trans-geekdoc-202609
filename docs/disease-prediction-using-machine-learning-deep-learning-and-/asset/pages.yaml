  md: 'Haithem Boussaid et al. [22] proposed a model for the 3-D reconstruction of
    the proximal femur using low-dose biplanar X-ray images.


    S. Laporte et al. worked on the 3-D reconstruction model by detecting the contours
    from bi-planar radiographs [23]. They employed Direct Linear Transformation (DLT)
    and Non-Stereoradiography Corresponding Points algorithm (NSCP) for the reproduction
    of the structure. NSCP fails in the structures such as the knee joint. Therefore,
    the authors applied Non-Stereo Corresponding Contours (NSCC) algorithm for recreating
    the 3-D shape of the bone.


    Ryo Kurazume et al. proposed a technique for the 3-D reconstruction of a femoral
    shape using a parametric approach [24]. They performed the statistical analysis
    of 3-D femoral shape obtained from CT scan images of 56 patients. They employed
    the manual segmentation and marching cubes algorithm, Principal Component Analysis
    (PCA) [25].


    S. Kolta et al. [26] proposed the model for the 3-D reconstruction of the proximal
    femur bone from the DXA image. The model works by detecting the contours in the
    images.


    V.H. Kim et al. used the Simulated Implantation System (SIS) [27] for 3-D perception
    and numeric investigations between the artificial hip joint and the femur [28,
    29]. The Architecture of 3-D Reconstruction Simulation Systems is shown in Fig.
