- pgno: 31
  md: 'In VGG-16, client 1, client 2, and client 3 reported accuracies of 89.3%, 84.7%
    and 90%, respectively. The final server model reported an accuracy of 95%, since
    the models are averaged, an increase in accuracy can be seen. AlexNet’s server
    model gave an average of 87% while the client’s performed an average of 80%, thus
    VGG-16 outperformed Alexnet. ResNet-101 and DenseNet-121 are both very deep neural
    networks having 100+ layers and their reported accuracies are very similar. The
    server model reported an accuracy of 97% and 98% for resnet101 and densenet121
    respectively. The clients when trained on resnet101 reported an accuracy of 92%,
    83%, and 83% respectively. Here, client 1 trained very effectively thus increasing
    the server accuracies after aggregation. A similar situation is seen for DenseNet121,
    where the clients gave an accuracy of 92%, 85%, and 86%, respectively while the
    server accuracy increased substantially after aggregation reporting an accuracy
    of 98%. The overall experiment highlights that deeper neural networks performed
    quite well and DenseNet121 reported the highest overall performance.


    # CONCLUSION


    Federated learning is a technique in which the models train locally on the device
    and the trained model parameters are communicated with the central server where
    aggregation takes place. Federated learning tackles the problem of data privacy
    by just sending the trained model parameters. In this research, we applied Federated
    learning to train deep learning models to classify chest X-rays into Covid, Pneumonia
    and Normal. The research assumes 3 data centers/hospitals that train the models
    locally. Four deep learning models – AlexNet, VGG-16, DenseNet121 and ResNet101
    are used to provide a comparative analysis.


    Each client in the experiment was provided with a local training dataset. The
    experiments showed that DenseNet121 recorded the highest accuracy of 98% on the
    server model followed by ResNet101 which reported an accuracy of 97%. VGG-16 and
    AlexNet reported global model accuracies of 95% and 88% respectively. The clients
    keep on training their respective local models as new data is generated. Thus
    federated learning models evolve and improve with time.


    Federated learning has a lot of potential applications especially in the field
    of Healthcare. In healthcare, it is very important that the privacy of the patient
    is preserved and healthcare has de-centralized sources of data i.e. multiple hospitals
    isolated from one another. This research provides a comparative study of deep
    learning models in a federated setting. Further, this research can be applied
    to different image classification problems in healthcare, and also the comparative
    study presented gives insight into which deep learning models are best suited
    for the task.'
