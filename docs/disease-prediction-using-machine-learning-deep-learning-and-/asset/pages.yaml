  md: '# CHAPTER 5


    # Prognosis of Dementia using Machine Learning


    Anu Saini^1, Sunita Kumari^1*, Ritik ^1, Rajni ^1 and Sushma Hans^2


    ^1 GB Pant DSEU, Okhla-1 Campus, Delhi, India

    ^2 Amity University, Dubai Campus, Dubai, United Arab Emirates


    **Abstract:** The brain is one of the most sensitive parts of the human body which
    transmits millions of signals every moment. Dementia is the most emerging brain
    health issue which involves memory loss, difficulty in problem-solving, handling
    complex tasks, _etc._ Dementia is a syndrome that causes a loss of mental ability.
    It affects memory, thinking, shape, comprehension, counting, reading ability,
    language, and judgment. Dementia affects millions of people and can be the leading
    cause of death. It is now the seventh leading cause of death worldwide, as well
    as one of the major causes of impairment and reliance on elderly people. There
    is no treatment for dementia at present. The importance of early detection and
    diagnosis in improving early and effective management is crucial. Predicting dementia
    in advance can lead us to a better life. To predict dementia, various Machine
    Learning models have been used. In this paper, Dementia is predicted on the basis
    of MRI Images, for this, three different datasets of MRI Images have been collected.
    Furthermore, for better prediction, various Machine learning models are used to
    predict dementia and validate the performance with statistical analysis like K-Nearest
    Neighbours, XG Boost, Support Vector Machine, Random Forest Algorithm (RFA), and
    Convolutional Neural Network (CNN). Out of all algorithms, Random Forest Algorithm
    and Convolutional Neural Network gave the best result with the accuracy of 93.2
    and 99.9 respectively.


    **Keywords:** Alzheimer''s disease, CNN (Convolutional Neural Network), Dementia,
    Random forest algorithm.


    # INTRODUCTION


    Dementia is a neuropsychological disorder that causes memory loss leading to paralysis
    and reliance on others for survival. It is most frequent in those over 60 years,
    with an estimated 900 million people in their 60s suffering from it. It affects
    more than 46 million individuals globally, more than the whole populace of Spain.
    By 2050, this number is predicted to surge to 131.5 million [1]. Due to their
    severe mental incapacity, Alzheimer''s disease and other major dementias


    * Corresponding author Sunita Kumari: GB Pant DSEU, Okhla-1 Campus, Delhi, India;
    E-mail: sunita2009@gmail.com'
