    # 3D Reconstruction of Bone in Biomedical Field


    Fig. (1). Imaging in biomedical field images.


    In this chapter, the authors present a review of 3-D and 2-D techniques used in
    medical imaging as discussed in Table 1. This chapter also gives a comparative
    analysis of techniques used for the 3-D reconstruction of bones from 2-D imaging
    techniques.


    # ANALYSIS OF RELATED WORK


    A review of related works shows that the 3-D reconstruction of medical images
    from 2-D images attracted researchers to propose different models. The contributions
    from the researchers are discussed below.


    WEI et al. [1] identified that X-ray imaging is preferred over the CT scan image
    due to the low intensity of exposure and low cost. Therefore, they proposed the
    3-D recreation system for the femoral shaft shape. They used an orthographical
    heading for recreating a 3-D femur. They used a numerical morphology strategy'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'for boundary detection. Further, they determined the central point of the femur
    shaft edge as a pole datum line. Then they computed three coordinates of the pole
    datum line by stamp point. Finally, their system displayed an enrolment of the
    3- D layout model and state of the femur shaft by creating the boundary. This
    technique is useful to eliminate noise to enhance qualities of shapes but the
    computational time is high for the complex structure of the bone shape.


    Zhang et al. proposed an effective strategy for the 3-D recreation of femur bone
    using Direct Linear Transformation (DLT) [8]. Their strategy uses two orthogonal
    X-ray images anterior-posterior and lateral views to reconstruct the 3-D structure.
    DLT does not require multiple images to calculate the distortion boundaries. Therefore,
    it has a low computational expense and discovers its way into various fields of
    use. The steps for 3-D reconstruction are shown in Fig. (2).


    ![](img/0616422b380b1bd62613a261ed51be87_37_0.png)


    Fig. (2). Step by step process for reconstruction.


    A.Le Bras et al. performed a comparison based examination of the 3-D reconstruction
    of the proximal femur [9]. They used the 3-D CT scan remaking method and a 3-D
    stereo radiographic reconstruction method [3]. In the 3-D CT scan reconstruction,
    they considered the parameters viz. a scout view, volume, image procurement, and
    recreation. They input these parameters to the ‘Slice'
  merge: -1
