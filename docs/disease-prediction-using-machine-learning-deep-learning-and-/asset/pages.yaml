    # JOURNEY OF DATABASES


    One of the biggest problems that humanity has ever had to deal with is data storage,
    and it still remains. A solution to the file system''s shortcomings, including
    redundancy, inconsistency, concurrent access by numerous users, and many others,
    has been found in databases. The first generation [1] of databases emerged around
    the middle of the 1960s and the beginning of the 1970s in order to provide a practical
    and effective method of storing and accessing permanent data through the creation
    of general-purpose database management systems. Based on the relationship between
    the data being that is stored, databases can be categorized into 3 groups: Relational
    Databases [2], NewSQL Databases [3], and NoSQL Databases [4]. In-depth information
    about the ongoing advancement of important database technologies and several related
    database systems is provided in this paper [4], which is summarised in Table 1.


