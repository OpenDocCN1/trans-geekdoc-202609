  md: 'untreated. Employing proper detection techniques is essential for timely diagnosis
    and appropriate treatment, which can help preserve the patient’s vision. Various
    techniques for glaucoma detection are illustrated in Fig. (7), while Fig. (8)
    displays images of normal and glaucomatous retinas from the DRISHTI eye dataset,
    with the region of interest (ROI) encircled. The outer dashed lines indicate the
    optic disc and the inner dashed lines represent the optic cup.


    ![](img/0616422b380b1bd62613a261ed51be87_138_0.png)


    Fig. (7). Different ways to diagnose.


    ![](img/0616422b380b1bd62613a261ed51be87_138_1.png)


    Fig. (8). Images of Normal and Glaucomatous Retina respectively.


    Glaucoma can be classified into several types, including primary open-angle glaucoma,
    normal-tension glaucoma, closed-angle glaucoma, congenital glaucoma, and secondary
    glaucoma [39]. A brief overview of these glaucoma types is provided to enhance
    understanding.


    According to the National Eye Institute (NEI) [40], open-angle glaucoma [41] is
    the most prevalent type of glaucoma. It is a slow process in which the eye fails
    to drain fluid properly, leading to an increase in eye pressure and subsequent
    damage to the optic nerve. At its initial stages, open-angle glaucoma is painless
    and does not cause noticeable changes in vision [42].'
