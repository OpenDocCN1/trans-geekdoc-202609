    for patients. The CT scan and MRI scans are expensive and unaffordable to economically
    weaker sections of society. Also, these techniques expose the patient to carcinogenic
    radiations. Thus, patients become prone to cancer. Moreover, the availability
    of machinery used for CT scans and MRI is low in remote and underdeveloped regions.
    Radiographs are low-cost, convenient, and portable solutions for medical imaging.
    Also, X-ray machines are easily available than CT scan and MRI machines.'
