- pgno: 38
  md: 'Omatic’ software to obtain the 3-D reconstruction of the femur. In the 3-D
    stereo radiographic reconstruction method, the low-measurement computerized X-ray
    gadget performs a linear scanning of the femur in the posterior-anterior and lateral
    views. This method employs the ‘NSCC algorithm’ to develop the 3-D reconstruction.
    The authors [9], claimed that applying both the methods on 25 proximal femora
    gives a low value of mean P2S error. The error reported is less than 2.0 mm. This
    proves the reliability of the 3-D stereo radiographic method of reconstruction.
    The advantage of this strategy is, it very well may be utilized for hard structures
    with a constant shape but this technique is tedious in terms of computational
    cost.


    Kyung Koh et al. [10], built the 3-D format model of the femur from a healthy
    subject with ordinary stature and weight. They considered two X-ray images and
    three CT scan images of five patients. They used a B Spline Free From Deformation
    (FFD) to procure the patient-specific femur as shown in Fig. (3). To control the
    deformation precision, FFD gives the facility to place the control points at variable
    distance. Also the control points are easily manipulated by FFD at a lower cost.
    On the other side, it is difficult to apply FFD technique on the complex structures.


    ![](img/0616422b380b1bd62613a261ed51be87_38_0.png)


    Fig. (3). Spine FFD.


    Sonia Akkoul et al. [11], proposed a model for 3-D proximal femur surface recreation.
    The model uses pseudo-stereo matching and 3-D points from the highest quality
    level to decrease the non-availability of data. They used three cadaveric proximal
    femora scanned with CT scans and X-ray images. They followed a set of seven stages
    for the 3-D reconstruction of the proximal femur. In'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'the first stage, they used the projection display to discover an angle between
    two X-ray images of a femur. At the next stage, the system marks the boundary
    of the femur using active contours. In the third stage, the system finds the coordinating
    point between 2-D shapes using the Euclidian distance. In the next stage, the
    system produces a 3-D point cloud. Now, it applies the Iterative Closed Point
    (ICP) algorithm for 3-D rigid registration. In the last stage, the system applies
    a meshing technique to find the 3-D shape of the proximal femur. The ICP algorithm
    is straightforward and simple to implement but it calculates the starting value
    of the iteration in the first step which should be correctly initialized otherwise
    this algorithm suffers from the local optimum problem.


    Sami P. Vaananen et al. [12] proposed a programmed technique for the reconstruction
    of the 3-D shape. They applied Structured Auxiliary Mesh (SAM) algorithm for this
    purpose as shown in Fig. (4). The authors used three sets of bone images. The
    two sets of bone images were used for training the model and the remaining third
    set of bone images was used as a testing dataset of the model.


    ![](img/0616422b380b1bd62613a261ed51be87_39_0.png)


    Fig. (4). Development of SAM model.


    N. Baka et al. [13] proposed the Statistical Shape Model (SSM) based technique
    for the posture estimation and shape reconstruction of a 3-D bone surface using
    two X-ray images. The SSM technique capture the global shape of the surface without
    reducing the size of the object therefore SSM technique acquire high space.


    P.E. Garibarov et al. purposed the patients'' specific proximal femur surface
    reconstruction model [14]. They applied their model to the planer radiographs.
    The model completes the reconstruction in three steps. In the first step, they'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'extract the contours of the femur from the planer radiograph. In the second
    step, they perform the coordinating process on the extracted contours. In the
    last step, they reconstruct the 3-D geometry.


    P. Gamage et al. proposed a technique for the 3-D remaking of the patient-specific
    bone model from 2-D radiographs [15]. They extracted the edge points from 2-D
    X-ray images to determine the boundary of the femur. Now, they applied for a non-rigid
    registration between the edges recognized in the radiograph. They projected the
    contour point of the genetic model. Now, the translational field distinguishes
    the deformation required by the 3-D anatomical model in the anterior and lateral
    viewpoint. In the last step, an entire 3-D translational field is developed through
    a thin plate spline (TSP) based on insertion and the 3-D generic anatomical data.
    The TSP technique does not include surface patches in their calculation which
    gives robust results. On the other hand, if the data size is too large then it
    leads to the issue of edge points.


    Tristan Whitmarsh et al. [16], purposed the reconstruction model for the 3-D shape
    of the proximal femur from a single DXA. This technique uses a statistical model
    applied to a large data set of Quantitative Computerized Tomography (QCT) scans.


    # Table 2. Performance comparison of 3-D reconstruction models on different image
    types.


    | Image Used | Average Error | Root Mean Square Error (RMS) | Number of Projections
    |

    | :--- | :--- | :--- | :--- |

    | Single DXA image [10] | 1.1mm | 2.6mm | 1 |

    | X-ray image [17] | 1.2mm | 2.8mm | 2 |

    | Two DXA image [28] | 0.8mm | 2.1mm | 2 |


    Guoyan Zheng et al. proposed the Partial Least Square Regression (PLSR) model
    for the 3-D reconstruction of volumetric intensity from 2-D X-ray images [20].
    In this technique, the authors used Independent Statistical Shape and Displacement
    and Appearance (DA) approach. The PLSR technique can easily handle the multi-collinearity
    between the independent points at the time of 3-D reconstruction. On the other
    side, PLSR needs a large number of data for training.


    Moon Kyu Lee et al. created a 3-D model for a finished femoral bone [21]. The
    authors used a regular X-ray image and combined the anatomical parameters such
    as neck length, femoral length, head offset length, the anatomical axis, and sagittal
    radius into a referential 3-D shape. They calculated the internal position and
    range of the femoral head by nonliearing regression. They determined the center
    point of the anatomical axis by applying the elliptical regression.'
