    ## 第 7 章


    ### 超参数调优


    在本章中，我们将深入探索超参数调优的世界。这是开发机器学习模型的关键步骤，旨在寻找超参数的最优组合以最大化模型性能。让我们探索什么是超参数、不同的超参数优化方法以及它们各自是如何运作的。


    #### 什么是超参数？


    超参数是可调的设置，机器学习算法在训练过程中不会学习它们，但会影响模型的行为和性能。它们在训练过程开始之前定义，可以包括神经网络中的学习率、`Random
    Forest` 模型中的树的数量以及 `SVM` 中的核大小等。


    选择正确的超参数对模型性能至关重要，它可能决定一个平庸模型与高准确有效模型之间的差异。


    #### 超参数优化方法


    有多种优化超参数的方法，每种都有自己的优缺点：


    -   网格搜索 (Grid Search)：`Grid Search` 是一种穷举搜索技术，用于探索所有指定的超参数组合。尽管实现简单，但在超参数数量较多时，计算开销可能很大。

    -   随机搜索 (Random Search)：`Random Search` 是一种更高效的方法，它从空间中随机采样超参数。与其探索所有组合，`Random
    Search` 关注于多样化的点。

    -   贝叶斯优化 (Bayesian Optimization)：`Bayesian Optimization` 是一种更先进的方法，将模型性能建模为超参数的概率函数。它利用从之前的评估积累的信息引导搜索进入最有前景的区域。`Bayesian
    Optimization` 在高维空间中特别有效，并可以用较少的评估找到良好的解决方案。


    超参数调优是开发机器学习模型的关键步骤，对模型性能有显著影响。在本章中，我们探索什么是超参数以及不同的方法，包括网格搜索、随机搜索和贝叶斯优化。通过深入理解这些方法，你将准备好调优和优化你的机器学习模型。


    ## 第 8 章


    ### 机器学习模型中的正则化


    在这里，我们将探索机器学习训练中的一个基本方面：正则化。理解如何处理过拟合和欠拟合对于构建稳健且可泛化的模型至关重要。我们将研究诸如 `L1 正则化`、`L2
    正则化`、`Elastic Net` 和 `Dropout` 等技术，这些技术在缓解这些问题和提高模型性能方面起着重要作用。


    #### 过拟合与欠拟合：泛化困境


    过拟合和欠拟合是训练机器学习模型时常见的问题。过拟合是指模型过度拟合训练数据甚至捕捉了数据中的噪声，无法泛化到新数据。另一方面，欠拟合是指模型太简单，无法捕捉数据的复杂度，导致在训练和测试数据上的性能都很差。在这些极端之间找到正确的平衡对于开发能够良好泛化到未见数据的模型至关重要。


    #### L1 和 L2 正则化：通过惩罚减少过拟合


    正则化是一种常用的技术，通过在训练过程中引入模型权重惩罚来对抗过拟合。流行的方法是 `L1 正则化`和 `L2 正则化`。`L1 正则化`也称为 `Lasso`，惩罚与权重的绝对值成正比，有利于权重稀疏化，使某些权重变为零。`L2
    正则化`也称为 `Ridge`，惩罚与权值的平方成正比，这会导致整体权重较小。


    #### Elastic Net：两者的结合


