    The pooling layer is a hidden layer used to abstract information in a deep neural
    network. Pooling is also a method to reduce the amount of computation of the model,
    which can increase the receptive field and reduce the difficulty and parameters
    of optimization. Fig. 2.7 shows two common pooling operations [10]. For each feature
    map channel, a window sliding operation is performed to realize max pooling (take
    the maximum value) or average pooling (take the average value) of data in the
    window to reduce the amount of data, prevent overfitting, and improve the generalization
    ability of the model. Generally, the pooling stride is greater than 1, which is
    used to reduce the scale of feature map. As shown in Fig. 2.7, the 4 × 4 feature
    map passes through a 2 × 2 pooling layer, whose stride is 2, and the output size
    is 2 × 2.


    A convolutional neural network, as an important supporting technology of deep
    learning, promotes the development of artificial intelligence. Convolution operators
    can effectively extract spatial information and are widely used in the field of
    visual images, including image recognition [11], image segmentation [12], target
    detection [13], etc. In the model inference stage, the image data is input into
    the network, multilevel feature extraction is carried out through computation
    of multiple macromodules, and the prediction results of categories are output
    using a fully connected layer. In the model training stage, for a given input
