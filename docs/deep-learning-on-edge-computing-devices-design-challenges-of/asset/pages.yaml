  md: '# CHAPTER 1


    # Introduction


    # 1.1 Background


    At present, the human society is rapidly entering the era of Internet of Everything.
    The application of the Internet of Things based on the smart embedded device is
    exploding. The report “The mobile economy 2020” released by Global System for
    Mobile Communications Assembly (GSMA) has shown that the total number of connected
    devices in the global Internet of Things reached 12 billion in 2019 [1]. It is
    estimated that by 2025 the total scale of the connected devices in the global
    Internet of Things will reach 24.6 billion. Applications such as smart terminals,
    smart voice assistants, and smart driving will dramatically improve the organizational
    efficiency of the human society and change people’s lives. With the rapid development
    of artificial intelligence technology toward pervasive intelligence, the smart
    terminal devices will further deeply penetrate the human society.


    Looking back at the development process of artificial intelligence, at a key time
    point in 1936, British mathematician Alan Turing proposed an ideal computer model,
    the general Turing machine, which provided a theoretical basis for the ENIAC (Electronic
    Numerical Integrator And Computer) born ten years later. During the same period,
    inspired by the behavior of the human brain, American scientist John von Neumann
    wrote the monograph “The Computer and the Brain” [2] and proposed an improved
    stored program computer for ENIAC, i.e., Von Neumann Architecture, which became
    a prototype for computers and even artificial intelligence systems.


    The earliest description of artificial intelligence can be traced back to the
    Turing test [3] in 1950. Turing pointed out that “if a machine talks with a person
    through a specific device without communication with the outside, and the person
    cannot reliably tell that the talk object is a machine or a person, this machine
    has humanoid intelligence”. The word “artificial intelligence” actually appeared
    at the Dartmouth symposium held by John McCarthy in 1956 [4]. The “father of artificial
    intelligence” defined it as “the science and engineering of manufacturing smart
    machines”. The proposal of artificial intelligence has opened up a new field.
    Since then, the'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/5fa4874adaccc5ede04575a2e9e5662a_14_0.png)


    Figure 1.1 Relationship diagram of deep learning related research fields.


    academia has also successively presented research results of artificial intelligence.
    After several historical cycles of development, at present, artificial intelligence
    has entered a new era of machine learning.


    As shown in Fig. 1.1, machine learning is a subfield of theoretical research on
    artificial intelligence, which has developed rapidly in recent years. Arthur Samuel
    proposed the concept of machine learning in 1959 and conceived the establishment
    of a theoretical method “to allow the computer to learn and work autonomously
    without relying on certain coded instructions” [5]. A representative method in
    the field of machine learning is the support vector machine [6] proposed by Russian
    statistician Vladimir Vapnik in 1995. As a data-driven method, the statistics-based
    SVM has perfect theoretical support and excellent model generalization ability,
    and is widely used in scenarios such as face recognition.


    Artificial neural network (ANN) is one of the methods to realize machine learning.
    The artificial neural network uses the structural and functional features of the
    biological neural network to build mathematical models for estimating or approximating
    functions. ANNs are computing systems inspired by the biological neural networks
    that constitute animal brains. An ANN is based on a collection of connected units
    or nodes called artificial neurons, which loosely model the neurons in a biological
    brain. The concept of the artificial neural network can be traced back to the
    neuron model (MP model) [7] proposed by Warren McCulloch and Walter Pitts in 1943.
    In this model the input multidimensional data are multiplied by the corresponding
    weight parameters and accumulated,'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'and the accumulated value is calculated by a specific threshold function to
    output the prediction result. Later, Frank Rosenblatt built a perceptron system
    [8] with two layers of neurons in 1958, but the perceptron model and its subsequent
    improvement methods had limitations in solving high-dimensional nonlinear problems.
    Until 1986, Geoffrey Hinton, a professor in the Department of Computer Science
    at the University of Toronto, invented the back propagation algorithm [9] for
    parameter estimation of the artificial neural network and realized the training
    of the multilayer neural networks.


    As a branch of the neural network technology, the deep learning technology has
    been a great success in recent years. The algorithmic milestone appeared in 2006.
    Hinton invented the Boltzmann machine and successfully solved the problem [10]
    of vanishing gradients in training the multilayer neural networks. So far, the
    artificial neural network has officially entered the “deep” era. In 2012, the
    convolutional neural network [11] and its variants invented by Professor Yann
    LeCun from New York University greatly improved the classification accuracy of
    the machine learning methods on large-scale image databases and reached and surpassed
    people’s image recognition level in the following years, which laid the technical
    foundation for the large-scale industrial application of the deep learning technology.
    At present, the deep learning technology is ever developing rapidly and achieved
    great success in subdivision fields of machine vision [12] and voice processing
    [13]. Especially in 2016, Demis Hassabis’s Alpha Go artificial intelligence built
    based on the deep learning technology defeated Shishi Li, the international Go
    champion by 4:1, which marked that artificial intelligence has entered a new era
    of rapid development.


    # 1.2 Applications and trends


    The Internet of Things technology is considered to be one of the important forces
    that lead to the next wave of industrial change. The concept of the Internet of
    Things was first proposed by Kevin Ashton of MIT in 2009. He pointed out that
    “the computer can observe and understand the world by RF transmission and sensor
    technology, i.e., empower computers with their own means of gathering information”
    [14]. After the massive data collected by various sensors are connected to the
    network, the connection between human beings and everything is enhanced, thereby
    expanding the boundaries of the Internet and greatly increasing industrial production
    efficiency. In the new “wave of industrial technological change”, the smart'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'terminal devices will undoubtedly play an important role. As a carrier for
    connection of Internet of Things, the smart perception terminal device not only
    realizes data collection, but also has front-end and local data processing capabilities,
    which can realize the protection of data privacy and the extraction and analysis
    of perceived semantic information.


    With the proposal of the smart terminal technology, the fields of Artificial Intelligence
    (AI) and Internet of Things (IoT) have gradually merged into the artificial intelligence
    Internet of Things (AI&IoT or AIoT). On one hand, the application scale of artificial
    intelligence has been gradually expanded and penetrated into more fields relying
    on the Internet of Things; on the other hand, the devices of Internet of Things
    require the embedded smart algorithms to extract valuable information in the front-end
    collection of sensor data. The concept of intelligence Internet of Things (AIoT)
    was proposed by the industrial community around 2018 [15], which aimed at realizing
    the digitization and intelligence of all things based on the edge computing of
    the Internet of Things terminal. AIoT-oriented smart terminal applications have
    a period of rapid development. According to a third-party report from iResearch,
    the total amount of AIoT financing in the Chinese market from 2015 to 2019 was
    approximately $29 billion, with an increase of 73%.


    The first characteristic of AIoT smart terminal applications is the high data
    volume because the edge has a large number of devices and large size of data.
    Gartner’s report has shown that there are approximately 340,000 autonomous vehicles
    in the world in 2019, and it is expected that in 2023, there will be more than
    740,000 autonomous vehicles with data collection capabilities running in various
    application scenarios. Taking Tesla as an example, with eight external cameras
    and one powerful system on chip (SOC) [16], the autonomous vehicles can support
    end-to-end machine vision image processing to perceive road conditions, surrounding
    vehicles and the environment. It is reported that a front camera with a resolution
    of 1280 × 960 in Tesla Model 3 can generate about 473 GB of image data in one
    minute. According to the statistics, at present, Tesla has collected more than
    1 million video data and labeled the information about distance, acceleration,
    and speed of 6 billion objects in the video. The data amount is as high as 1.5
    PB, which provides a good data basis for improvement of the performance of the
    autonomous driving artificial intelligence model.


    The second characteristic of AIoT smart terminal applications is high latency
    sensitivity. For example, the vehicle-mounted ADAS of autonomous'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'vehicles has strict requirements on response time from image acquisition and
    processing to decision making. For example, the average response time of Tesla
    autopilot emergency brake system is 0.3s (300 ms), and a skilled driver also needs
    approximately 0.5 s to 1.5 s. With the data-driven machine learning algorithms,
    the vehicle–mounted system HW3 proposed by Tesla in 2019 processes 2300 frames
    per second (fps), which is 21 times higher than the 110 fps image processing capacity
    of HW2.5.


    The third characteristic of AIoT smart terminal applications is high energy efficiency.
    Because wearable smart devices and smart speakers in embedded artificial intelligence
    application fields [17] are mainly battery-driven, the power consumption and endurance
    are particularly critical. Most of the smart speakers use a voice awakening mechanism,
    which can realize conversion from the standby state to the working state according
    to the recognition of human voice keywords. Based on the embedded voice recognition
    artificial intelligence chip with high power efficiency, a novel smart speaker
    can achieve wake-on-voice at standby power consumption of 0.05 W. In typical offline
    human–machine voice interaction application scenarios, the power consumption of
    the chip can also be controlled within 0.7 W, which provides conditions for battery-driven
    systems to work for a long time. For example, Amazon smart speakers can achieve
    8 hours of battery endurance in the always listening mode, and the optimized smart
    speakers can achieve up to 3 months of endurance.


    From the perspective of future development trends, the development goal of the
    artificial intelligence Internet of Things is achieving ubiquitous pervasive intelligence
    [18]. The pervasive intelligence technology aims to solve the core technical challenges
    of high volume, high time sensitivity, and high power efficiency of the embedded
    smart devices and finally to realize the digitization and intelligence of all
    things [19]. The basis of development is to understand the legal and ethical relationship
    between the efficiency improvement brought by the development of the artificial
    intelligence technology and the protection of personal privacy, so as to improve
    the efficiency of social production and the convenience of people''s lives under
    the premise of guaranteeing the personal privacy. We believe that pervasive intelligence
    calculation for the artificial intelligence Internet of Things will become a key
    technology to promote a new wave of industrial technological revolution.'
  merge: -1
  img_proc: true
