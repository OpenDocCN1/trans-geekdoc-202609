- pgno: 20
  md: '![](img/5fa4874adaccc5ede04575a2e9e5662a_20_0.png)


    Figure 1.4 Comparison of computing power demands and algorithms for deep learning
    model.


    OpenAI, an open artificial intelligence research organization, has pointed out
    that “the computing resource required by advanced artificial intelligence doubles
    approximately every three and a half months”. The computing resource of training
    a large AI model has increased by 300,000 times since 2012, with an average annual
    increase of 11.5 times. The growth rate of hardware computing performance has
    only reached an average annual increase of 1.4 times. On the other hand, the improvement
    of the efficiency of high-efficiency deep learning algorithms reaches annual average
    saving of about 1.7 times of the computing resource. This means that as we continue
    to pursue the continuous improvement of algorithm performance, the increase of
    computing resource demands potentially exceeds the development speed of hardware
    computing performance, as shown in Fig. 1.4. A practical example is the deep learning
    model GPT-3 [24] for natural language processing issued in 2020. Only the cost
    of model training and computing resource deployment has reached about 13 million
    dollars. If the computing resource cost increases exponentially, then it is difficult
    to achieve sustainable development. How to solve this problem is one of the key
    problems in the development of artificial intelligence toward the pervasive intelligence.


    # 1.3.2 Two stages of deep learning: training and inference


    Deep learning is generally classified into two stages, training and inference.
    First, the process of estimating the parameters of the neural network model based
    on known data is called training. Training is sometimes also known as the process
    of parameter learning. In this book, to avoid ambiguity, we use'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'the word “training” to describe the parameter estimation process. The data
    required in the training process is called a training dataset. The training algorithm
    is usually described as an optimization task. The model parameters with the smallest
    prediction error of the data labels on the training sample set are estimated through
    gradient descent [25], and the neural network model with better generalization
    is acquired through regularization [26].


    In the second stage, the trained neural network model is deployed in the system
    to predict the labels of the unknown data obtained by the sensor in real time.
    This process is called the inference process. Training and inference of models
    are like two sides of the same coin, which belong to different stages and are
    closely related. The training quality of the model determines the inference accuracy
    of the model.


    For the convenience of understanding the subsequent content of this book, we summarize
    the main concepts of machine learning involved in the training and inference process
    as follows.


    **Dataset.** The dataset is a collection of known data with similar attributes
    or features and their labels. In deep learning, signals such as voices and images
    acquired by the sensor are usually converted into data expression forms of vectors,
    matrices, or tensors. The dataset is usually classified into a training dataset
    and a test dataset, which are used for the estimation of the parameters of the
    neural network model and the evaluation of neural network inference performance
    respectively.


    **Deep learning model.** In this book, we will name a function f(x; θ) from the
    known data x to the label y to be estimated as the model, where θ is a collection
    of internal parameters of the neural network. It is worth mentioning that in deep
    learning, the parameters and function forms of the model are diverse and large
    in scale. It is usually difficult to write the analytical form of the function.
    Only a formal definition is provided here.


    **Objective function.** The process of deep learning model training is defined
    as an optimization problem. The objective function of the optimization problem
    generally includes two parts, a loss function and a regularization term. The loss
    function is used to describe the average error of the label prediction of the
    neural network model on the training samples. The loss function is minimized to
    enhance the accuracy of the model on the training sample set. The regularization
    term is usually used to control the complexity of the model to improve the accuracy
    of the model for unknown data labels and the generalization performance of the
    model.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/5fa4874adaccc5ede04575a2e9e5662a_22_0.png)


    Figure 1.5 Application scenarios of cloud and edge.


    # 1.3.3 Cloud and edge devices


    Edge computing [27] refers to a concept in which a distributed architecture decomposes
    and cuts the large-scale computing of the central node into smaller and easier-to-manage
    parts and disperses them to the edge nodes for processing. The edge nodes are
    closer to the terminal devices and have higher transmission speed and lower time
    delay. As shown in Fig. 1.5, the cloud refers to the central servers far away
    from users. The users can access these servers anytime and anywhere through the
    Internet to realize information query and sharing. The edge refers to the base
    station or server close to the user side. We can see from the figure that the
    terminal devices [28] such as monitoring cameras, mobile phones, and smart watches
    are closer to the edge. For deep learning applications, if the inference stage
    can be completed at the edge, then the problem of transmission time delay may
    be solved, and the edge computing provides services near data sources or users,
    which will not cause the problem of privacy disclosure. Data show that cloud computing
    power will grow linearly in future years, with a compound annual growth rate of
    4.6%, whereas demand at the edge is exponential, with a compound annual growth
    rate of 32.5%.


    The edge computing terminal refers to the smart devices that focus on real-time,
    secure, and efficient specific scenario data analysis on user terminals. The edge
    computing terminal has huge development prospects in the field of artificial intelligence
    Internet of Things (AIoT). A large number'
