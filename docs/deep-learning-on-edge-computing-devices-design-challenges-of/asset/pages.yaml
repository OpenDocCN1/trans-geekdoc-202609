- pgno: 49
  md: '# CHAPTER 3


    # Model design and compression


    # 3.1 Background and challenges


    Although convolutional neural networks have achieved good results in such fields
    as computer vision and natural language processing, they are daunting to many
    embedded device-based applications due to their massive parameters. At present,
    deep learning models require large amounts of computing resource and memory, often
    accompanied by huge energy consumption. Large models become the biggest bottleneck
    when we need to deploy models on terminal devices with limited computing resources
    for real-time inference. The training and reasoning of deep neural networks usually
    heavily rely on GPU with high computing ability. The huge scale of features and
    the deluge of model parameters also greatly increase the time. Take as an example
    AlexNet [1], a network containing 60 million parameters. It takes two to three
    days to train the entire model on the ImageNet data set using NVIDA K40. In fact,
    Denil et al. [9] have shown that deep neural networks are facing severe overparameterization,
    and a small subset of the parameters can completely reconstruct the remaining
    parameters. For example, ResNet-50 [10], which has 50 convolutional layers, requires
    more than 95 MB of storage memory and more than 3.8 billion floating-point multiplication
    operations to process images. After some redundant weights are discarded, the
    network still works as usual, but more than 75% of the parameters and 50% of the
    computation time can be saved. This indicates that there is huge redundancy in
    the parameters of the model, which reveals the feasibility of model compression.


    In the field of deep neural network study, model compression and acceleration
    have received great attention from researchers, and great progress has been made
    in the past few years. Significant advances in intelligent wearable devices and
    AIoT in recent years have created unprecedented opportunities for researchers
    to address the fundamental challenges of deploying deep learning systems to portable
    devices with limited resources, such as memory, CPU, energy, and bandwidth. A
    highly efficient deep learning method can have a significant impact on distributed
    systems, embedded devices, and FPGAs for artificial intelligence. For the design
    and compression of highly efficient deep neural network models, in this chapter,
    we will first analyze'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'several categories of typical lightweight neural network models in recent years
    and then discuss model compression technology for neural networks, including model
    pruning and knowledge distillation.


    # ## 3.2 Design of lightweight neural networks


    The lightweight model aims to reduce model parameters and computational complexity
    from the aspect of network structure design while maintaining model performance,
    which is a hotspot of deep learning study. With the same accuracy, a smaller CNN
    architecture will consume fewer resources and be more suitable for deployment
    on embedded edge terminal devices with limited memory and computing resources.
    In this section, we mainly focus on the design of network structure and give a
    brief description of lightweight networks, including the following types of lightweight
    models.


    # ### 3.2.1 SqueezeNet


    Researchers at UC Berkeley and Stanford first proposed a small CNN architecture
    called SqueezeNet in 2016 [11], which was one of the early studies focusing on
    lightweight networks. They reduced the number of network parameters to less than
    0.5 MB, 510 times smaller than that of AlexNet, but with the same accuracy as
    AlexNet. To do this, they used three strategies to reduce the number of parameters
    and maintain accuracy.


    +   - Strategy 1: Replace the 3 × 3 convolution with the 1 × 1 convolution, so
    that the number of parameters for a convolutional kernel can be reduced by 9 times.

    +   - Strategy 2: Reduce the number of input channels for the 3 × 3 filter via
    squeeze layer.

    +   - Strategy 3: Delay downsampling. The higher the number of the layer, the
    larger the feature map, which is conducive to improving the accuracy of the model.


    The basic unit in SqueezeNet is called Fire Module. A Fire Module consists of
    a Squeeze layer and an Expand layer, as shown in Fig. 3.1. Squeeze layer only
    uses a 1 x 1 convolutional kernel to realize strategy 1, whereas Expand Layer
    uses the convolutional combination of 1 x 1 and 3 x 3. There are three adjustable
    parameters in the Module, namely, the number of 1 x 1 convolutional kernels in
    Squeeze layer s1, the number of 1 x 1 convolutional kernels in Expand layer e1
    and the number of 3 x 3'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/5fa4874adaccc5ede04575a2e9e5662a_51_0.png)


    # Figure 3.1 The structure of Fire Module [11].


    convolutional kernels in Expand layer \(e_3\). Let \(s_1 < e_1 + e_3\) to limit
    the number of input channels for \(3 \times 3\) convolution to realize strategy
    2. Use the ReLU function between Squeeze layer and Expand layer for activation.


    SqueezeNet is composed of several Fire Modules combined with a pooling layer.
    A complete SqueezeNet network has 10 layers, of which the first layer is a convolutional
    layer, and the second to ninth layers are Fire Modules, where the number of filters
    in Fire Module increases layer by layer. The convolutional layer at the tenth
    layer is followed by a global AvgPool layer. Finally, the classification results
