    # 1.3 Concepts and taxonomy


    # 1.3.1 Preliminary concepts


    Data, computing power, and algorithms are regarded as three elements that promote
    the development of artificial intelligence, and the development of these three
    elements has become a booster for the explosion of the deep learning technology.
    First of all, the ability to acquire data, especially large-scale data with labels,
    is a prerequisite for the development of the deep learning technology. According
    to the statistics, the size of the global Internet data in 2020 has exceeded 30
    ZB [20]. Without data optimization and compression, the estimated storage cost
    alone will exceed RMB 6 trillion, which is equivalent to the sum of GDP of Norway
    and Austria in 2020. With the further development of the Internet of Things and
    5G technology, more data sources and capacity enhancements at the transmission
    level will be brought. It is foreseeable that the total amount of data will continue
    to develop rapidly at higher speed. It is estimated that the total amount of data
    will be 175 ZB by 2025, as shown in Fig. 1.2. The increase in data size provides
    a good foundation for the performance improvement of deep learning models. On
    the other hand, the rapidly growing data size also puts forward higher computing
    performance requirements for model training.


    Secondly, the second element of the development of artificial intelligence is
    the computing system. The computing system refers to the hardware computing devices
    required to achieve an artificial intelligence system. The computing system is
    sometimes described as the “engine” that supports the application of artificial
    intelligence. In the deep learning era of artificial intelligence, the computing
    system has become an infrastructure resource. When Google’s artificial intelligence
    Alpha Go [21] defeated Korean chess player Shishi Li in 2016, people lamented
    the powerful artificial intelligence, and the huge “payment” behind it was little
    known: 1202'
  merge: -1
