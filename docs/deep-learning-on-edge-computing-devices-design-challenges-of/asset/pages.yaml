    compressive features. The features can be quickly calculated via integral image
    [13]. The integral image IP(x, y) of the image P(x, y) is defined and computed
    via an iteration as


    IP(x, y) = \sum_{b=0}^{y} \sum_{a=0}^{x} P(a, b) \quad (8.2) \n= IP(x, y - 1)
    + IP(x - 1, y) - IP(x - 1, y - 1) + P(x, y),


    where IP = 0 if x < 0 or y < 0. Thus one feature component v from two patches
    (x_l^(g), x_r^(g), y_u^(d), y_d^(g)) (g = 1, 2, the subscripts l/r and u/d denote
    the leftmost/rightmost column and the uppermost/downmost row of the patch, respectively)
    on the image P(x, y) can be simply obtained by merely eight add/sub operations:


    v = \sum_{b=y_u^(1)}^{y_d^(1)} \sum_{a=x_l^(1)}^{x_r^(1)} P(x, y) - \sum_{b=y_u^(2)}^{y_d^(2)}
    \sum_{a=x_l^(2)}^{x_r^(2)} P(x, y) \quad (8.3) \n= (IP(x_r^(1), y_d^(1)) - IP(x_l^(1)
    - 1, y_d^(1)) - IP(x_r^(1), y_u^(1) - 1) \n+ IP(x_l^(1) - 1, y_u^(1) - 1)) + (-IP(x_r^(2),
    y_d^(2)) + IP(x_l^(2) - 1, y_d^(2)) \n+ IP(x_r^(2), y_u^(2) - 1) - IP(x_l^(2)
    - 1, y_u^(2) - 1)).'
