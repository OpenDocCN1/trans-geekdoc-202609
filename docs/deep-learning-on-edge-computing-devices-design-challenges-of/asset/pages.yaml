    The second chapter (The Basic of Deep Learning) explains the relevant basis of
    deep learning, including architectures of feedforward neural networks, convolutional
    neural networks, and recurrent neural networks, as well as the training process
    of the network models and performance and challenges of the deep neural networks
    on AIoT devices.


    Chapter 3 (Model Design and Compression) discusses the current lightweight model
    design and compression methods, including efficient lightweight network designs
    by presenting some classical lightweight models and the model compression methods
    by detailedly introducing two typical methods, model pruning and knowledge distillation.


    Chapter 4 (Mix-Precision Model Encoding and Quantization) proposes a mixed precision
    quantization and encoding bitwise bottleneck method from the perspective of quantization
    and encoding of neural network activation based on the signal compression theory
    in wireless communication, and can quantify the neural network activation from
    a floating point type to a low-precision fixed point type. Experiments on ImageNet
    and other datasets show that by minimizing the quantization distortion of each
    layer the bitwise bottleneck encoding method realizes state-of-the-art performance
    with low-precision activation.


    Chapter 5 (Model Encoding of Binary Neural Networks) focuses on the binary neural
    network model and proposes a hardware-friendly method to improve the performance
    of efficient deep neural networks with binary weights and activation. The cellular
    binary neural network includes multiple parallel binary neural networks, which
    optimize the lateral connections through group sparse regularization and knowledge
    distillation. Experiments on CIFAR-10 and ImageNet datasets show that by introducing
    optimized group sparse lateral paths the cellular binary neural network can obtain
    better performance than other binary deep neural networks.


    Chapter 6 (Binary Neural Networks Computing Architecture) proposes a fully pipelined
    BNN accelerator from the perspective of hardware acceleration design, which has
    a bagging integrated unit for aggregating multiple BNN pipelines to achieve better
    model precision. Compared with other methods, this design greatly improves memory
    footprint and power efficiency on the MNIST dataset.


