  md: '# Algorithm and hardware codesign of sparse binary network on-chip


    # 7.1 Background and challenges


    This chapter is based on our related publication [1]. The deep neural networks
    have demonstrated their remarkable performance for feature extraction and pattern
    recognition in the last few years [2–5]. However, due to the contradiction between
    limited hardware resources and the requirement of high computational performance,
    it is still a challenge to implement large-scale deep neural networks for embedded
    real-time applications [6]. For example, research indicates that the unsupervised
    Deep Belief Network (DBN) shows the state-of-the-art accuracy for classifying
    hyperspectral remote sensing images [4]. However, it is technically impractical
    to deploy the DBN to process remote sensing images in real time, because the embedded
    systems carried by satellites or unmanned aerial vehicles are generally limited
    in memory space, computational resources, and power budget.


    The fundamental computations of a feedforward DBN involve a large number of high-precision
    multiplications between the connection weights and the input data, which can be
    implemented using clusters of Central Processing Units (CPUs) or general-purpose
    Graphics Processing Units (GPUs) in powerful computers [7]. However, when memory
    and computational resources are limited in hardware, a more efficient algorithm
    would be ideal, designed for efficient hardware computing and only requiring simple
    fix-point computation and much fewer parameters, allowing larger networks to be
    implemented using System on Chips (SoCs) for real-time pattern recognition.


    In this chapter, we present an algorithm-and-hardware codesign of the widely applied
    Deep Belief Network for embedded real-time image classification. For efficient
    hardware implementation, one important algorithmic consideration is the number
    of neural connections. The classic Deep Belief Network has fully connected neurons
    between adjacent layers (Fig. 7.1), resulting in high memory and computational
    complexity [8]. The second algorithmic consideration is data representation, which
    is an essential trade-off between accuracy and cost. Researches indicate that
    the Deep Belief'
