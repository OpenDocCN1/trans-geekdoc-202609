    important deep neural network structures.


    # ## 2.2.2 Recurrent neural networks


    Both the deep feedforward and convolutional neural networks mentioned above have
    a characteristic that their network structures are arranged in order, neurons
    in the $l$th layer receive only signals from neurons in the $(l-1)$th layer, and
    there is no feedback structure. However, in a particular task, to better capture
    the time-sequential features of the input vector, it is sometimes necessary to
    combine the sequential inputs. For example, in speech signal processing, if an
    exact translation of a sentence is required, then it is obviously impossible to
    translate each word separately. Instead, the words need to be connected together
    to form a sequence, and then the entire time-sequential sequence is processed.
    The recurrent neural network (RNN) [14] described in this section is a neural
    network structure that processes time-sequential data and has feedback.


    RNN, originated in the 1980s and 1990s [15], is a recursive neural network that
    takes sequence data as input, adds feedback in the evolution direction of the
    sequence, and links all nodes in a chain. It is difficult for a traditional feedforward
    neural network to establish a time-dependent model, whereas RNN can integrate
    information from input unit and previous time node, allowing information to continue
    to function across the time node. This means that the network has a memory function,
    which is very useful in natural language processing, translation, speech recognition,
    and video processing.


    Fig. 2.8 shows the basic structure of a standard RNN. On the left, there is a
    folded diagram, and on the right, there is the structure diagram expanded in chronological
    order. We can see that the loop body structure of RNN is located in the hidden
    layer. This network structure reveals the essence of RNN: the network information
    of the previous moment will act on that of the next moment, that is, the historical
    information of the previous moment will be connected to the neuron of the next
    moment through weights. As shown in the figure, in an RNN network, **x** represents
    an input, **h** represents a hidden layer unit, **o** represents an output, **y**
    represents a training label, **t** represents time, **U** is a parameter from
    the input layer to hidden layer, **V** is a parameter from the hidden layer to
    output layer, and **W** is a recurrent layer parameter. As we can see from the
    previous description, the performance of **h** at the moment of $t$ is not only
    determined by the'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/5fa4874adaccc5ede04575a2e9e5662a_38_0.png)


    Figure 2.8 The schematic diagram of RNN, and its corresponding unfolded form.


    input at that moment, but also influenced by the previous moment:


    ```

    $\mathbf{h}^{(t)} = \tanh(\mathbf{U}\mathbf{x}^{(t)} + \mathbf{W}\mathbf{h}^{(t-1)}
    + \mathbf{b})$.

    ```


    The output at the moment of $t$ is


    ```

    $\mathbf{o}^{(t)} = \mathbf{V}\mathbf{h}^{(t)} + \mathbf{c}$.

    ```


    The final output predicted by the model is


    ```

    $\mathbf{y} = \sigma(\mathbf{o}^{(t)})$.

    ```


    It is worth noting that for excessively long speech sequences, RNN only has short-term
    memory due to the problem of gradient vanishing during the training of back propagation
    model. Long short-term memory (LSTM) [16] and gate recurrent unit (GRU) [17] are
    two solutions to short-term memory of RNN, which introduce a gating mechanism
    to regulate information flow. Take the LSTM structure as an example. It contains
    a forget gate, an input gate, and an output gate, which are used to reserve or
    delete the incoming information and to record key information. LSTM performs well
    in long-term memory tasks, but the structure also leads to more parameters, making
    the training more difficult. Compared with LSTM, GRU with similar structure uses
    a single gate to complete the forget and selection information stages, reducing
    parameters while achieving the same performance as LSTM, which is widely used
    under the condition of limited computing resource and time cost.'
