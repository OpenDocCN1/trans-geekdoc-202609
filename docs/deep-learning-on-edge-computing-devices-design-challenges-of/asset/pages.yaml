  md: 'of sensor devices in the Internet of Things industry need to collect various
    types of data at high frequency. Edge computing devices can integrate data collection,
    calculation, and execution to effectively avoid the cost and time delay of uploading
    the data to cloud computing and improve the security and privacy protection of
    user data. According to an IDC survey, 45% of the data generated by the Internet
    of Things industry in 2020 will be processed at the edge of the network, and this
    proportion will expand in the future years. “2021 Edge Computing Technology White
    Paper” has pointed out that the typical application scenarios of edge computing
    smart terminals include smart car networking/autonomous driving, industrial Internet,
    and smart logistics. The values of ultralow time delay, massive data, edge intelligence,
    data security, and cloud collaboration will prompt more enterprises to choose
    edge computing.


    # 1.4 Challenges and objectives


    In recent years, deep learning has made breakthroughs in the fields of machine
    vision and voice recognition. However, because the training and inference of standard
    deep neural networks involve a large number of parameters and floating-point computing,
    they usually need to be run on resource-intensive cloud servers and devices. However,
    this solution has the following two challenges.


    +   (1) Privacy problem. Sending user data (such as photos and voice) to the cloud
    will cause a serious privacy disclosure problem. The European Union, the United
    States, etc. have set up strict legal management and monitoring systems for sending
    the user data to the cloud.


    +   (2) High delay. Many smart terminal applications have extremely high requirements
    for the end-to-end delay from data collection to completion of processing. However,
    the end-cloud collaborative architecture has the problem that data transmission
    delay is uncertain and is difficult to meet the needs of high time sensitivity
    smart applications such as autonomous driving.


    Edge computing effectively solves the above problem and has gradually become a
    research hotspot. Recently, edge computing has made some breakthroughs in technology.
    On one hand, algorithm design companies have begun to seek more efficient and
    lightweight deep learning models (such as MobileNet and ShuffleNet). On the other
    hand, hardware technology companies, especially chip technology companies, have
    invested heavily in the development of special neural network computing accel-'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'eration chips (such as NPU). How to minimize resource consumption by optimizing
    algorithms and hardware architecture on edge devices with limited resources is
    of great significance to the development and the application of AIoT in the 5G
    and even 6G era.


    The deep learning edge computing technology based on smart terminals will effectively
    solve the above technical challenges of deep learning cloud computing. This book
    focuses on the deep learning edge computing technology and introduces how to design,
    optimize, and deploy efficient neural network models on embedded smart terminals
    from the three levels of algorithms, hardware, and applications. In the algorithm
    technology, neural network algorithms for edge deep learning is introduced, including
    lightweight neural network structure design, pruning, and compression technology.
    The hardware technology details the hardware design and optimization methods of
    edge deep learning, including algorithm and hardware collaborative design, near
    memory computing, and hardware implementation of integrated learning. For the
    application program, each part briefly introduces the application program. In
    addition, as a comprehensive example, the application of smart monitoring cameras
    will be introduced as a separate part at the end of this book, which integrates
    algorithm innovation and hardware architecture innovation.


    # 1.5 Outline of the book


    This book aims to comprehensively cover the latest progress in edge-based neural
    computing, including algorithm models and hardware design. To reflect the needs
    of the market, in this book, we attempt to systematically summarize the related
    technologies of edge deep learning, including algorithm models, hardware architectures,
    and applications. The performance of deep learning models can be maximized on
    the edge computing devices through collaborative algorithm-hardware-code design.


    The structure of this book is as follows. According to the content, it includes
    three parts and nine chapters. Part 1 is Introduction, including two chapters
    (Chapters 1–2); Part 2 is Model and Algorithm, including three chapters (Chapters
    3–5); and Part 3 is Architecture Optimization, including four chapters (Chapters
    6–9).


    The first chapter (Introduction) mainly describes the development process, related
    applications, and development prospects of artificial intelligence, provides some
    basic concepts and terms in the field of deep learn-'
