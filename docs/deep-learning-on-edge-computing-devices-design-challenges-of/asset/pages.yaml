  md: 'Table 9.5 Comparing the proposed CNN with other CNN-based methods for object
    detection. Both accuracy measurement of mean average precision (mAP (%)) on VOC
    and COCO (IOU=0.5) and efficiency measurement of frames per second (FPS) are listed.


    | Training Set | Method | mAP | FPS |

    |---|---|---|---|

    | VOC 2007+2012 | Fast R-CNN | 70.0 | 0.5 |

    | | Faster R-CNN ResNet | 76.4 | 5 |

    | | SSD | 74.3 | 46 |

    | | YOLOv1 | 63.4 | 45 |

    | | YOLOv2 | 78.6 | 40 |

    | | **CCN-YOLO** | **78.1** | **40** |

    | | **CCN-SSD** | **74.0** | **46** |

    | COCO trainval | Fast R-CNN | 35.9 | 0.5 |

    | | Faster R-CNN ResNet | 45.3 | 5 |

    | | SSD | 41.2 | 46 |

    | | YOLOv2 | 44.0 | 40 |

    | | **CCN-YOLO** | **43.8** | **40** |

    | | **CCN-SSD** | **41.1** | **46** |


    ically, the CCN-YOLO model achieved a mean average precision (mAP) of 78.1% over
    the VOC data set, almost the same as the original YOLOv2 model. Over the top five
    classes of the VOC data set, CCN-YOLO also achieved a competitively high 92.8%
    average accuracy and a comparable 86.6% recall rate. Considering that the average
    accuracy of the top five classes and the recall rate of the YOLOv2 model over
    the VOC data set were 93.3% and 86.8%, respectively, the CCN suffered almost no
    loss of performance compared to the original YOLO model. Similar results were
    found for the CCN-SSD model, which suffered almost no loss of accuracy and inference
    speed compared to the original SSD model over the VOC and COCO data sets.


    # 9.4.4 Performance of the SensCamera system


    The proposed CCN is a compressive-sensing-enabled convolutional neural network.
    The experiment showed that as a unified approach, the CCN was three times more
    efficient than the conventional implementations that used different components
    for compressive sensing and object detection. Table 9.6 compares the combined
    latency of image compression and object detection of the compared approaches.
    The proposed method is compared with the conventional strategies that a YOLO model
    or a SSD model is'
