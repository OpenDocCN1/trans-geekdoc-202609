    Model compression refers to the transformation of a large and complex model into
    a small streamlined model that can achieve performance similar to that of the
    large model. At present, technology related to model compression mainly includes,
    but not limited to, the following methods.


    +   • Low-rank decomposition [22,23]: The convolutional kernel of a convolutional
    neural network is a 4D tensor, and this weight matrix is often dense and low-rank,
    with great redundancy information. By means of low-rank decomposition the dense
    matrix can be broken down into several small-scale matrices to achieve model compression.
    However, the cost of matrix decomposition is high, the layer-by-layer decomposition
    of convolutional kernel matrix is not conducive to the compression of global parameters,
    and the 1 × 1 small convolutional kernel is more often used in the network now,
    which is not conducive to the low-rank decomposition method, and it is difficult
    to achieve the compression of the model.


    +   • Model Pruning [2–8,24–26]: On the basis of pretrained large model, design
    evaluation criteria for the importance of network parameters to measure their
    importance and remove some unimportant parameters to speed up the network and
    improve the generalization ability.


    +   • Knowledge distillation [27–29]: In general, large models tend to be a single
    complex network or a collection of several networks, with good performance and
    generalization ability, whereas small models have limited expressive ability because
    of the small scale of the network. Therefore the knowledge learned by large models
    can be used to guide the training of small models, so that the small models have
    the same performance as the large models, but the number of parameters is greatly
    reduced, so as to achieve model compression, that is, the knowledge of pretrained
    large teacher models is refined into lightweight student models.


    +   • Parameter quantification [30,31]: Reduce the space and computational overhead
    of network parameters by sacrificing some accuracy. For example, a typical 32-bit
    floating-point network parameter is represented by a lower bit width (1 bit, 2
    bits, 8 bits, 16 bits), including weight, activation value, gradient, and error.
    Parameter quantification will lead to loss of some information, resulting in performance
    degradation of the final model, but it also has obvious advantages: (1) parameter
    storage'
