  md: '# CHAPTER 4


    # Mix-precision model encoding and quantization


    # 4.1 Background and challenges


    This chapter is based on our related publication [1]. Research on mix-

    precision activation compression for efficient neural computing is an

    emerging popular topic, which reveals great potential for a variety of

    edge-computing and computer vision applications [2–5]. Both stochastic

    and deterministic approaches were proposed for neural network activation

    quantization [6–9], which adopted various quantization functions to reduce

    the precision of activation representation while training the neural network.

    Though the loss of activation precision causes notable loss of classification

    accuracy, by reducing the number of bits required the deep neural networks

    with quantized activation could improve both memory and time efficiency

    by orders of magnitude compared with the standard floating-point imple-

    mentation [7,10–12].


    One challenge of the researches on activation quantization is the lack of

    theoretical ground [13]. The performance of existing approaches relies on

    their choices of quantization strategy, and no minimal loss of representation

    precision can be determined given the average code rate. Recently, the

    concept of information theory has attracted attention for its potential for

    bringing a better understanding of the deep learning optimization process

    [14,15]. The key idea of these approaches is maintaining the most valuable

    information of a signal X using a short code X̂. In the context of deep

    neural network, X̂ is the signal of quantized activation, and we formalize

    this problem as that of finding a short code X̂ that preserves the maximum

    information about X, that is, how to minimize the loss of the information

    caused by signal quantization through a “bottleneck” in the deep neural

    network.


    Emerging research on neural encoding based on the information the-

    ory is an interesting topic, which attempts to answer the basic questions

    about the design principle of deep networks such as the optimal architec-

    ture and the optimal quantization scheme. Recently proposed deep neural

    networks with information bottlenecks usually have an encoder–decoder'
  merge: -1
