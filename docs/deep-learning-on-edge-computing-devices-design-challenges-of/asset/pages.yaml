- pgno: 199
  md: '# DEEP LEARNING ON EDGE COMPUTING DEVICES


    Xichuan Zhou, Haijun Liu, Cong Shi and Ji Liu


    Maximize the performance of deep learning on edge computing devices


    # Key Features


    +   - Focuses on hardware architecture and embedded deep learning, including neural
    networks

    +   - Brings together neural network algorithm and hardware design optimization
    approaches to deep learning, alongside real-world applications

    +   - Considers how edge computing solves privacy, latency, and power consumption
    concerns related to the use of the cloud

    +   - Describes how to maximize the performance of deep learning on edge computing
    devices

    +   - Presents the latest research on neural network compression coding, deep
    learning algorithms, chip codesign, and intelligent monitoring


    Deep Learning on Edge Computing Devices focuses on hardware architecture and embedded
    deep learning, including neural networks. This book helps researchers maximize
    the performance of edge-deep learning models for mobile computing and other applications,
    by presenting neural network algorithms and hardware design optimization approaches
    for edge deep learning. Structured into three parts, the first introduces core
    concepts; the second presents theories and algorithms; and part three details
    architecture optimization. This book provides a solution for researchers looking
    to maximizing the performance of deep learning models on edge computing devices
    through algorithm-hardware codesign. Applications are introduced in each section,
    and smart surveillance cameras as a comprehensive example are presented at the
    end of the book, integrating innovation in both algorithm and hardware architecture.
    For computer scientists, researchers, and engineers working in this area, this
    book presents an essential resource summarizing the technology around edge deep
    learning.


    # About the Authors


    Xichuan Zhou is Professor and Vice Dean in the School of Microelectronics and
    Communication Engineering at Chongqing University, and the founding professor
    of the Institute of Science on Brain Inspired Intelligence, Chongqing University,
    China. He has made original contributions in intelligent edge computing, and has
    authored over 60 papers in prestigious international journals and conferences.
    He was awarded the Outstanding Researcher of the Chinese Institute of Electronics.


    Haijun Liu is a Research Assistant in the School of Microelectronics and Communication
    Engineering at Chongqing University, China. His main research interests include,
    metric learning, deep learning and sparse representation in computer vision and
    machine learning. He has published over 30 papers.


    Cong Shi is a Research Professor in the School of Microelectronics and Communication
    Engineering at Chongqing University, China. His research focuses on AI-based visual
    processing system-on-chips and algorithm hardware codesign techniques. He has
    published over 30 papers.


    Ji Liu is the Head of the AI platform department and the director of the Seattle
    AI lab for Kwai Inc. He has previously been a faculty member in computer science
    at the University of Rochester, USA. His research includes machine learning, optimization,
    computer vision, reinforcement learning, and other areas. He has published over
    100 papers.'
  merge: -1
  img_proc: true
