- pgno: 107
  md: '# Binary neural network computing architecture


    # 6.1 Background and challenges


    This chapter is based on our related publication [1]. The past several years have
    witnessed a sharp increase in the applications of convolutional neural networks
    (CNNs), which are very suitable for various deep learning tasks, especially for
    computer vision [2–4]. However, it cannot be deployed on mobile platforms conveniently
    due to the limit of high computation complexity and huge network model size. To
    overcome these problems, by leveraging neural network compression techniques,
    we can reduce the size of neural networks and improve the computation speed. As
    an extreme solution of compressed neural network, binary neural networks (BNNs)
    were first proposed by Courbariaux and Bengio [5] in 2016.


    BNN constrains both weights and activations to +1 and –1, which can tremendously
    reduce the model size of traditional full precision CNN by 32×. It brings great
    convenience to the implementation of hardware on low power dissipation and memory
    requirement. Based on these advantages, several hardware accelerators of BNN have
    been proposed. A BNN accelerator in [6] opens up the study of FPGA acceleration
    for BNNs and explores an HLS heterogeneous methodology to maximize the system
    throughput. FINN is proposed in [7], which is a framework for using a flexible
    heterogeneous architecture to build fast and flexible FPGA accelerators. A framework
    in [8] is proposed as the first fully binarized neural network accelerator architecture,
    in which all layers are binarized. These works show very promising performance
    and energy efficiency.


    However, in their works, model performance can only be guaranteed by complex network
    models, which results in large memory footprint and power consumption, and more
    promising optimization on reducing hardware memory costs of BNN is absent. In
    this chapter the ensemble technique for BNN is introduced to hardware implementation.
    Based on bagging ensemble method, the bagged binary neural network accelerator
    (BBNA) is introduced, which is a fully pipelined BNN accelerator with bagging
    unit for aggregating several BNNs to achieve better model accuracy, i.e., a smaller
    network can make it more accurate than a network much'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'larger than itself. This means that we can deploy a smaller network model on
    memory-limited embedded devices with similar accuracy as a bigger one for dramatically
    saving memory. BBNA designs a bagging PE to support different aggregation methods
    of BNNs. The highly parallel processing element has flexible data-stream architecture
    for different feature map sizes. BBNA uses pipelines to improve data throughput
    and processing speed of overall system. The BBNA was implemented based FPGA prototypes
    on a Stratix-V GXA7 FPGA platform. It can achieve high performance with ultralow
    memory cost and power consumption. Finally, a BBNA-based prototype system demonstration
    was designed on DE5-net board to demonstrate its practicability and usability.


    # 6.2 Ensemble binary neural computing model


    # 6.2.1 Convolutional neural network


    The model structure of a typical convolutional neural network (CNN) [9] is given
    in Fig. 6.1. CNN is a multilevel structure with trainable parameters, in which
    the input and output of each level are composed of a set of two-dimensional vectors,
    which are called feature maps (fmaps). In a CNN, each output feature map (ofmap)
    represents some feature information extracted from the input feature map (ifmap).
    Commonly, each level structure of typical CNN is orderly composed of a CONV or
    fully connection (FC) layer, a batch normalization (BN) layer, an activation layer,
    and a pooling layer if necessary.


    The input and output of the CONV layer are a set of feature maps, each containing
    different feature information, which use a set of trained filters to convolve
    the ifmaps through multiplication and accumulation (MAC) operations between filters
    and the pixels at the corresponding position of ifmap in a sliding-window way
    with a stride. The pooling layer can be


    ![](img/5fa4874adaccc5ede04575a2e9e5662a_108_0.png)


    Figure 6.1 Model Structure of a typical CNN, always including input, multiple
    convolutional (CONV) and pooling layers, fully connection (FC) layers, and output.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'viewed as a down-sampling process that reduces the data dimension. The FC layer
    performs a liner transformation between the weights and 1-D vectors formed from
    the final CONV layer by a flatten way. A network with only FC layers commonly
    can be called a multilayer perceptron (MLP).


    CONV operation is generally followed by BN operation, which can normalize the
    distribution of input of each layer to reduce the training time and improve the
    generalization ability of the network. Then the activation function comes closely
    after BN, which introduces the ability to fit nonlinearity to network through
    some special functions such as ReLU, sigmoid, etc.


    # ## 6.2.2 Binary neural network


    Complex CNN can extract complex feature information for difficult machine learning
    tasks. Nevertheless, the more complex the network model, the more difficult the
    deploying it on an embedded mobile device due to the huge memory and power consumption.
    The binary neural network (BNN) is the most extreme scheme that constrains both
    weights and activations to ±1, and its quantification method is implemented as
    either probabilistic or deterministic sign function [5].


    To store weights within only 1 bit on hardware, we convert −1 to 0 and 1 to 1
    by affine transformation, respectively, which can transform MAC operations to
    XNOR and popcount operations, i.e., performing bitwise XNOR between weights and
    inputs, and counting the number of 1s in the intermediate result after XNOR operation.
    The convolution of BNN is formulated as


    \(\mathbf{Y} = \mathbf{B}_x \otimes \mathbf{B}_w + \mathbf{b},\quad (6.1)\)


    where \(\otimes\) indicates XNOR-POPCOUNT operation, \(\mathbf{B}_x\) is the binary
    input, \(\mathbf{B}_w\) is a binary weight associated with that input, and \(\mathbf{b}\)
    is the neuron bias.


    The BN operation and binarized activation function come closely after CONV layer.
    The sign activation function of BNN [5] is defined as


    \(\mathbf{B}_y = sign(\mathbf{Y}) = \begin{cases} +1, & \mathbf{Y} \ge 0, \\ -1,
    & \mathbf{Y} < 0. \end{cases}\quad (6.2)\)


    This implies that we only need to take out the sign bit of the intermediate result
    to implement the nonlinear activation. Further, we combine'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'BN and activation for facilitating hardware implementation, which can be expressed
    as


    ```

    \mathbf{B}_y = \text{sign}(\mathbf{Y}_{bn}) = \text{sign} \left( \gamma \left(
    \frac{\mathbf{Y} - \mu}{\sigma} \right) + \beta \right), \quad (6.3)

    ```


    where the \(\mathbf{Y}_{bn}\) denotes the output of BN layer according to [10].
    Equation (6.3) is equivalent to the following expression:


    ```

    \mathbf{B}_y = \text{sign} \left( \frac{\gamma}{\sigma} \left( \mathbf{Y} + \left(
    - \mu + \frac{\sigma}{\gamma} \beta \right) \right) \right), \quad (6.4)

    ```


    where \(\mu\) and \(\sigma\) are the mean value and standard deviation of each
    minibatch (i.e., output of CONV layer), and \(\gamma\) and \(\beta\) are the scaling
    and shifting factors that can be trained. Interestingly, \(\gamma\) and \(\sigma\)
    are positive constants in the inference phase, so we just need to calculate the
    integer bias \((-\mu + (\sigma/\gamma)\beta)\) after training, so that we only
    adopt an adder to complete the BN and activation operations.


    # 6.2.3 Ensembel binary neural network


    Since the ultralow algorithm complexity and memory requirement, BNNs open a new
    window for allowing more mobile devices to share the benefits of the rise of deep
    learning. However, BNNs with 1-bit weights and activations suffer from grievous
    drop in accuracy due to their weak representation ability. To improve the model
    performance, Zhu et al. [11] presented a binary ensemble neural network (BENN),
    which aggregates multiple single-bit BNNs to obtain a better performance than
    a multibit quantization network in ensemble learning ways, including bagging and
    boosting. The BENN has also significantly enhanced the intrinsic stability and
    robustness of original weak BNN, which are primarily reflected in the large fluctuation
    of training accuracy and model overfitting problem, respectively.


    The bagging method is introduced into our hardware architecture; the schematic
    diagram of BNN with bagging is illustrated in Fig. 6.2. To follow the bootstrapping
    principle of bagging [12], \(M\) training samples of each BNN classifier are randomly
    sampled with replacement from the total training set \(D\), which are assumed
    to be independent identically distributed samples. Then we can get \(K\) weak
    BNN classifiers after \(K\) independent trainings. In the inference phase, we
    use two different voting mechanisms'
  merge: -1
  img_proc: true
- pgno: 111
  md: '![](img/5fa4874adaccc5ede04575a2e9e5662a_111_0.png)


    Figure 6.2 Schematic diagram of bagged BNN. K independent BNN classifiers are
    trained based on different training samples to obtain K weak classifiers, which
    are then combined to form the final classifier.


    ![](img/5fa4874adaccc5ede04575a2e9e5662a_111_1.png)


    Figure 6.3 The accuracy of 64-128-128 BMLP model on MNIST when we change the number
    of extra-aggregated BNNs based on one BNN.


    to combine the opinions of $K$ BNN classifiers for obtaining the final classification
    label. One is the hard voting, which selects the majority agreed label as the
    final label, and the other is selecting the best label after averaging the softmax
    probability of all classifiers, which be called soft voting.


    We evaluated the bagging method on 64-128-128 bagged MLP (BMLP), which is a three-layer
    fully connected neural network for MNIST handwriting dataset, and each layer has
    128 neurons except the first layer, which has 64. We compared two voting methods
    with different number of aggregated BNNs in terms of model accuracy. As shown
    in Fig. 6.3, the model with soft voting is always more accurate than that with
    hard voting, and the accuracy increases from 95.5% to 97.7% when we aggregate
    extra BNNs from 0 to 7. Interestingly, the situation was quite opposite when we
    applied the bagging method to some other model, so our hardware architecture supports
    both hard and soft voting to meet various task requirements with different networks.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/5fa4874adaccc5ede04575a2e9e5662a_112_0.png)


    Figure 6.4 The overall system architecture.


    # 6.3 Architecture design and optimization


    # 6.3.1 Overall architecture


    As illustrated in Fig. 6.4, a data-stream-based architecture was adopted in BBNA,
    which mainly consists of K independent BNN pipelines (BNNPs) and bagging PE. Each
    BNNP performs the operation of one ensemble BNN. Bagging PE is responsible for
    aggregating the outputs of K BNNPs in the inference phase. Considering resource
    utilization efficiency and power consumption, we implemented bagging by the aggregate
    of multiple parallel BNNPs instead of the reuse of one BNNP, which loads the parameters
    of different ensemble BNNs at once from the on-chip memory in every inference
    time and combines all outputs after all the inferences are completed.


    Each BNNP has several computing arrays (CAs) with multiple processing elements
    (PEs). Each CA is dedicated to the corresponding macrolayer of BNN, which cascaded
    through high-speed Avalon Streaming (Avalon-ST) bus. NIOS II processor is used
    to flexibly configure the architecture of all CAs and control them via the Avalon
    Memory Mapping (Avalon-MM) interface. The parameters and intermediate results
    of all BNNs are stored in the on-chip memory, which can eliminate off-chip memory
    accesses to extremely save power consumption and improve throughput.


    On the other hand, the I/O peripherals (e.g., universal asynchronous receiver/transmitter
    (UART)) mounted on the Avalon Bus can help us build a BBNA-based prototype system.
    Additionally, we can utilize the Scatter-gather DMA (SGDMA) IP core to complete
    high-speed input data handling, convert the data format of the input data into
    that required high-speed I/O devices, and also improve the work efficiency of
    CPU.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/5fa4874adaccc5ede04575a2e9e5662a_113_0.png)


    Figure 6.5 Block diagram of CA and PE.


    # 6.3.2 Architecture of computing array


    The internal block diagram of CA is shown in Fig. 6.5. A fully pipelined data
    path organization between all submodules is adopted to reduce the path delay and
    enhance the processing throughput. At the same time, our accelerator has many
    designs for achieving universality and configurability. The calculation of each
    layer is controlled by the controller which is connected to the Avalon Bus via
    an Avalon interface. Different PEs load the same ifmaps from the output register
    buffer of last layer in a ping-pong way and calculate the ofmap for each independent
    channel, and then write the intermediate results to the register buffer for the
    next computation.


    The core component of CA is multiple highly paralleled P PE units, which are responsible
    for the computation of C/F layer of BNN. The PE has several parts: Calculated
    Data Generator (CDG) unit, Convolution (Conv) Unit, and Batch Normalization, Activation,
