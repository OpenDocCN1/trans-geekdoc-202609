    # 6.4 Application of binary computing architecture


    # 6.4.1 Experiment setting


    To better evaluate BBNA architecture, in addition to the 64-128-128 BMLP network
    we mentioned earlier, we also used one BNNP to implement a small binary CNN (BCNN)
    without bagging, which has two CONV layers with 32 and 64 convolution filters
    and an FC layer with 128 neurons. All CONV layers apply a structure in an order
    of C-B-A-P (CONV, BN, Activation, Pooling) and have 5 × 5 filters. The benchmarks
    for both models are MNIST handwriting datasets consisting of 60 K 28 × 28 gray
    images for training and 10 K images for testing [2]. The BBNA-BMLP we deployed
    on hardware aggregates eight BNNPs and uses hard voting, which has only 0.61 Mbit
    parameters and 1.22 M operations and achieves 97.7% accuracy. The BBNA-BCNN has
    more complex network with 21.74 M operations and 0.45 Mbit parameters, and it
    achieves over 99.2% accuracy.


    We implemented FPGA-based prototypes of both models on the DE5-net board with
    an Intel Stratix-V GXA7 FPGA. Both models are implemented with Verilog HDL and
    synthesized, placed, and routed by Intel Quartus Prime 17.1, and used TimeQuest
    Timing Analyzer tool to constrain the system clock to 200 MHz. We used a power
    meter to measure the power consumption of boards.'
