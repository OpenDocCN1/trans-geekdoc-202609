    the traffic signs and the road. Each pipeline uses two Sparse Neural Cores to
    implement a stacked DAN and one core to implement the neural network classifier.
    Eight video clips recoded with different light conditions and camera angles are
    used to train and test the DAN algorithm offline. An experiment shows that the
