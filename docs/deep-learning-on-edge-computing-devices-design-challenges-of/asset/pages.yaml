    # 5.4.4 Complexity analysis


    We evaluated the computational complexity of the proposed CBN-Net on the ImageNet
    dataset and compared it with other binary neural networks. Table 5.4 lists the
    state-of-the-art BNNs with over 60% Top-1 accuracy on the ImageNet dataset, including
    ABC-Net, BENN, Group-Net, and the Circulant BNN [16]. These methods generally
    made a trade-off between efficiency and accuracy, and used multiple subnets or
    bases of binary matrices to reduce the drop of classification accuracy.


    The computational complexity was measured by the total operations (OPs), which
    consisted of floating-point operations and binary operations, and we used the
    same OPs estimation procedure as [37]. In summary, the CBN-Net achieved the 1.8%
    to 5.7% higher Top-1 classification accuracy compared to these methods. Moreover,
    the CBN-Net was the most efficient method in terms of inference OPs compared to
    the state-of-the-art binary neural networks. It was worth noting that even containing
    two subnets, the CBN-Net was still 5.58× to 8.62× more efficient than the full-precision
    network due to its binary representation and binary operation.'
