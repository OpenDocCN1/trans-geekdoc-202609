    # 3.3.1 Model pruning


    Model pruning is a classic technique in the field of model compression, as shown
    in Fig. 3.7. As mentioned above, in deep neural networks, many parameters are
    redundant and have little effect on error reduction and model generalization during
    training, so removing these parameters will not have a significant impact on network
    performance. Google conducted experiments on the Inception V3 model to explore
    the relationship between parameter sparsity and performance [32]. Experiments
    showed that the performance of the model was almost unchanged when the sparsity
    was 50%, and the classification accuracy on ImageNet only decreased by 2% when
    the sparsity was 87.5%. Similarly, they found that, on the small model MobileNet,
    the sparse wide MobileNet model performed significantly better than the nonsparse
    narrow MobileNet model with the same number of parameters. These experiments undoubtedly
    show the necessity and feasibility of model pruning. Pruning can not only reduce
    the model complexity, but also effectively prevent overfitting and improve the
    generalization ability of the model.


    The model pruning can be performed either during training or after training. For
    convolutional neural networks, model pruning can be roughly divided into two categories,
    weight pruning [26] and filter pruning [25]. Weight pruning means that all weight
    connections below a certain threshold will be removed. Filter pruning means that
    the importance of filters is'
