    and feed it into the Conv unit.


    BNN maps the original MAC operations of convolution to XNOR and Popcount operation.
    The Popcount operation depends on the 6-input 3-output look-up table (LUT), which
    suitably fits the FPGA resources. The results of XNOR and Popcount module are
    used as the input of the following shifter and accumulator. Accumulator is needed
    because the PE cannot always finish computing once for arbitrary network model.
    Besides, PE with shifter and accumulator can meet the case of multibit calculation
    such as the first layer of network, which is usually a multibit RGB image, because
    the shifter is able to realize \(n\) shifts according to the bit weight of a binary.
    It is also suitable for other neural networks adopting various bit-width quantization
    strategies. Subsequently, the BN and binarized activation are accomplished by
    integer addition and taking out the sign bit. Finally, the activation outputs
    flow into pooling unit, which transforms the max pooling operation into Boolean
    OR operations because the activation values are 0 or 1 only.


    # 6.3.3 Bagging processing element


    The architecture of bagging PE is illustrated in Fig. 6.6, which consists of hard
    voting (HV) and soft voting (SV) units. HV unit is used to count the respective
    votes of C labels. The softmax classifier orderly classifies BNN outputs, denoted
    01, ..., 0c, to get the best label, and then the controller activates the accumulator
    corresponding to the label. Specifically, to avoid labels that have the same votes,
    the input of the accumulator is the weight we assign to each classifier based
    on its performance rather than 1. Finally, the comparator chooses the label that
    has the most votes as the final label, whereas SV unit operates directly on the
    original outputs of BNNs and calculates the mean value of each label after \(K\)
    accumulations.'
