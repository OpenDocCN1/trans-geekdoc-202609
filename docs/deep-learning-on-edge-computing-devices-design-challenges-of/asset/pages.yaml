    # 5.3.2 Group sparse regularization


    It is worth noting that in Fig. 5.3 the brain-inspired lateral connections are
    assumed to be *sparse*. Furthermore, since different layers in deep neural networks
    may play different roles for the task of image classification, the lateral connections
    of the CBN-Net are assumed to be *grouped* with respect to different source layers.
    The characteristic of group sparsity can significantly reduce computational complexity
    caused by the extra lateral connections.


    To improve the classification accuracy of the binary neural network, the CBN-Net
    adopts learnable lateral connection weights \(\overline{\mathbf{W}}\) and attempts
    to explore the optimal routing paths described by the lateral connection weights.
    Technically, the L21 norm-based group sparse regularization term'
