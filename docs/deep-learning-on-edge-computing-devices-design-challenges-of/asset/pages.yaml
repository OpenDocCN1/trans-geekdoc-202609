    computed. Then the error gradient with respect to each parameter is computed by
    the back propagation algorithm. Finally, the parameters are updated by using the
    gradient descent algorithm. The above iterative steps are repeated for many times
    to gradually reduce the neural network prediction error until it converges. Compared
    with traditional feedforward neural networks, the convolutional'
