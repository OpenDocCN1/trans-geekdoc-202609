    # 5.3 The cellular binary neural network with lateral connections


    In this section, we detailedly introduce the cellular binary neural network with
    lateral connections, including cellular binary neural network, group sparse regularization,
    loss function, and the training process.


    # 5.3.1 Cellular binary neural network


    As shown in Fig. 5.3, the structure of binary neural networks evolves from using
    a single pipeline [7] to adopting parallel ensemble pipelines [13] for more accurate
    classification. As the third step of evolution, the proposed CBN-Net attempts
    to explore the optimal lateral structure connecting different cells of subnets,
    so as to further improve the classification accuracy of the binary neural networks.


    Formally, the CBN-Net consists of multiple binary subnets, and the superscript
    $i$ represents the $i$th binary subnet, the superscript $j$ represents the $j$th
    binary subnet, and superscript $k$ represents the $k$th binary layer. For the
    $i$th subnet, we denote by $\mathbf{X}^{(i,k)}$ the input of the $k$th layer and
    by $\mathbf{Y}^{(i,k)}$ the output. The lateral connections from the $i$th subnet
    to the $j$th subnet at the $k$th layer contain channelwise weights $\overline{W}^{(i,j,k)}
    = [\overline{W}_1^{(i,j,k)}, \overline{W}_2^{(i,j,k)}, \dots, \overline{W}_{c_{out}}^{(i,j,k)}]$,
    where $c_{out}$ is the number of channels.


    The CBN-Net takes advantage of brain-inspired global lateral connections, which
    transmit the features horizontally to different subnets. The $i$th'
