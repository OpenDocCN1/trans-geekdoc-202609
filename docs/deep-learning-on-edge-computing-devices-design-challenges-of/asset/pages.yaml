  md: '![](img/5fa4874adaccc5ede04575a2e9e5662a_34_0.png)


    **Figure 2.5** The illustration of a typical convolutional neural network structure.


    The receptive field can be understood as the size of the area seen by a neuron
    [8]. The deeper the neuron, the larger the input area that the neuron can see.
    As shown in Fig. 2.4, the receptive field of each neuron in the first hidden layer
    is 3, the receptive field of each neuron in the second hidden layer is 5, and
    the receptive field of each neuron in the third hidden layer is 7. The further
    away the hidden layer is from the input layer, the more features can be obtained,
    realizing the control from local features to the whole perception.


    The convolutional kernel is equivalent to a mapping rule in which the value of
    an original image pixel point is multiplied by the value of the convolutional
    kernel at the corresponding location, and then the resulting values are added
    according to the weights. This process is similar to the search for a class of
    patterns in an image to extract the features of the image. Obviously, such a filter
    is not able to extract all features, and a set of different filters is required.


    Convolutional neural network is a kind of feedforward neural networks with convolution
    operation and deep structure [9]. Its structure, as shown in Fig. 2.5, includes
    multiple convolutional layers for feature extraction, pooling layers for reducing
    the amount of computation, and a fully connected neural network layer for classification.
    We will elaborate on the principles of each layer below.


    A convolutional layer is a hidden layer that contains several convolution units
    in a convolutional neural network, which is used for feature extraction. As mentioned
    above, the convolution is characterized by sparse connection and parameter sharing.
    The structure of the convolutional layer is shown in Fig. 2.6. The square window
    on the left is the previously men-'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/5fa4874adaccc5ede04575a2e9e5662a_35_0.png)


    Figure 2.6 The diagram of convolution operation, where c is the number of input
    feature map channels, n is the number of convolutional kernels, and k × k is the
    size of a convolutional kernel.


    tioned convolutional kernel, also known as a filter or weight. The weight window
    slides on the input feature map and computes the convolution with the feature
    map to obtain the output feature map. The filter can be shared, and only the feature
    map data in the filter window participate in the operation during each convolution
    computation. This is based on two considerations of image vision: first, only
    local neurons are important, and connections between neurons that are further
    apart can be ignored; second, patterns of the same picture may show any position
    of the image, and the same weight needs to be used for computation by sliding
    on the input data. The sparse connection and parameter sharing mechanism reduces
    the number of parameters of the model and improves the trainability of deep neural
    network.


    In a convolutional layer, the size of the output feature map is determined by
    the convolutional kernel size, stride, and zero-padding. The stride is the value
    of the pixel that the convolutional kernel moves each time it slides. Zero-padding
    means that the edge of the input feature map is filled with 0, which controls
    the spatial size of the output data volume. It is worth noting that these three
    variables are all hyperparameters of a deep neural network model. Different from
    parameters that can be obtained through training (such as the weight and bias),
    hyperparameters are variables determined by experience, such as the convolutional
    kernel size and convolutional kernel depth mentioned here, as well as the model
    training learning rate and iteration hyperparameters to be mentioned later.'
