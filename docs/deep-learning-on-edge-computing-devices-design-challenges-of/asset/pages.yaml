  md: '# Preface


    We first started working in the field of edge computing-based machine learning
    in 2010. With project funding, we tried to accelerate support vector machine algorithms
    on integrated circuit chips to support embedded applications such as fingerprint
    recognition. In recent years, with the development of deep learning and integrated
    circuit technology, artificial intelligence applications based on edge computing
    devices, such as intelligent terminals, autonomous driving, and AIOT, are emerging
    one after another. However, the realization of an embedded artificial intelligence
    application involves multidisciplinary knowledge of mathematics, computing science,
    computer architecture, and circuit and system design. Therefore we arrived at
    the idea of writing a monograph focusing on the research progress of relevant
    technologies, so as to facilitate the understanding and learning of graduate students
    and engineers in related fields.


    Deep learning application development based on embedded devices is facing the
    theoretical bottleneck of high complexity of deep neural network algorithms. Realizing
    the lightweight of various fast developing deep learning models is one of the
    keys to realize AIOT pervasive artificial intelligence in the future. In recent
    years, we have been focusing on the development of automated deep learning tools
    for embedded devices. This book covers some of the cutting-edge technologies,
    currently developing in embedded deep learning, and introduces some core algorithms,
    including lightweight neural network design, model compression, model quantization,
    etc., aiming to provide reference for the readers to design embedded deep learning
    algorithm.


    Deep learning application development based on embedded devices is facing the
    technical challenge of limited development of integrated circuit technology in
    the post-Moore era. To address this challenge, in this book, we propose and elaborate
    a new paradigm of algorithm-hardware codesign to realize the optimization of energy
    efficiency and performance of neural network computing in embedded devices. The
    DANoC sparse coding neural network chip developed by us is taken as an example
    to introduce the new technology of memory computing, hoping to give inspiration
    to embedded design experts. We believe that, in the post-Moore era, the system
    collaborative design method across multiple levels of algorithms, software, and
    hardware will gradually become the mainstream of embedded intelli-'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'gent design to meet the design requirements of high real-time performance

    and low power consumption under the condition of limited hardware re-

    sources.


    Due to time constraints and the authors’ limited knowledge, there may

    be some omissions in the content, and we apologize to the readers for this.


    Xichuan Zhou'
