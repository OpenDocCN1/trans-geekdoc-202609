    than to train a small model from scratch.


    The classical knowledge distillation algorithm is a kind of “Teacher– Student”
    models [35], wherein “Teacher” is a knowledge exporter, that is, the aforementioned
    complex model or a model set composed of several separately trained models, which
    is called “NET-T” hereinafter; and “Student” is a knowledge receiver, corresponding
    to a kind of small models, which is called “Net-S” hereinafter. The knowledge
    distillation process is mainly divided into three stages: firstly, using a complete
    data set to train Net-T on a GPU with high computing performance; secondly, establishing
    a corresponding relation between Net-S and Net-T; and finally, deploying Net-S
    that has gained generalization ability into the applications. Knowledge distillation
    can be divided into three categories according to the types of transferred knowledge
    [36]: response-based transfer [27,37–39], feature-based transfer [25,40–42], and
    relation-based transfer [29].


    The most classical algorithm in response-based transfer was proposed by Hinton
    et al. [27], who regarded the probability output of the softmax function as a
    kind of valuable knowledge and hoped to use it as the matching target to make
    output distributions of Net-S and Net-T sufficiently close. However, the hard
    target adopted by traditional machine learning algorithms directly takes the maximum
    value of the Softmax classification probability as the model prediction label
    and ignores labels of the other probabilities, which may reduce the generalization
    ability of distillation models. Therefore, Hinton et al. proposed a concept of
    soft target, which improved the original function by introducing a hyperparameter
    T to control the entropy distribution of the prediction probability. The higher
    the T, the smoother the prediction probability distribution, and the'
