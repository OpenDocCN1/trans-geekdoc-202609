    # 7.2.4 Properties of the deep adaptive network


    The Deep Adaptive Network learns an efficient hardware-oriented network architecture
    featuring two properties.


    +   The neural connections of the DAN are sparse. The DAN adaptively reduces the
    connection weights associated with negligible visible units to zero, which can
    be removed for efficient hardware implementation.


    +   The activations of the DAN hidden units are sparse. Specifically, during the
    training phase, the AdaRBM uses \(p(h_j = 1|\mathbf{v})\) as the \(j\)th output
    activation to the next layer. Since the short columns of the weight matrix are
    reduced to zero vectors, the output activations associated with zero columns become
    close to a constant \(\delta(b_j)\) independent from the visible units. This property
    potentially makes the connection weights of the next-layer AdaRBM to be sparser.'
