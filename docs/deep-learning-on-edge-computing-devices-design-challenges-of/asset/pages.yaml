  md: '# CHAPTER 5


    # Model encoding of binary neural networks


    # 5.1 Background and challenges


    Deep Neural Networks (DNNs) have achieved great success in many different kinds
    of vision tasks. However, due to the increased computation workload and memory
    occupation, the deployment of these powerful networks is of great challenge, especially
    in resource-limited devices.


    To address this challenge, many model compression and acceleration methods have
    been proposed to reduce the memory and computation requirements, such as network
    pruning [1], weight decomposition [2], lightweight network design [3,4], knowledge
    distillation [5], and network quantization [6–8]. With the help of these efficient
    methods, it is possible to deploy powerful DNNs on the embedded devices for different
    applications such as computer vision and automated driving [9].


    As an extreme version of the compressed models, Binary Neural Networks (BNNs)
    constrain the full-precision weights and activations of DNNs to discrete binary
    values of {-1, +1} [7]. Therefore the memory required by DNN inference is able
    to be reduced by up to 32× times in theory. By applying BNN methods, energy-hungry
    operations like floating-point multiplications can be replaced with efficient
    bitwise operations. However, the BNNs generally suffer a significant loss of classification
    accuracy. For example, the binary AlexNet using the XNOR-Net method had 12.4%
    less Top-1 accuracy compared with its full-precision baseline model [10].


    One strategy to boost the accuracy was incorporating a larger volume of binary
    parameters in the BNNs. ABC-Net [11] approximated full-precision counterparts
    by using the linear combination of multiple binary bases. Following a similar
    way, Group-Net [12] proposed to combine the multiple homogeneous binary branches
    to reconstruct the full-precision group. On the other hand, BENN [13] suggested
    using ensemble methods like bagging on multiple parallel BNNs.


    The research on hardware-friendly lightweight neural networks with binary weights
    and activations is recently attracting more attention. BinaryNet [7] quantized
    both weights and activations to 1-bit values and started'
