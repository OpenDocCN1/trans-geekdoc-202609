  md: '# CHAPTER 8


    # Hardware architecture optimization for object tracking


    # 8.1 Background and challenges


    This chapter is based on our related publication [1]. Object tracking is a very
    active field in computer vision. It is widely used in various applications, such
    as intelligent video monitoring, industrial automation, vehicle navigation, and
    robot control [2–4]. Many of those applications require real-time performance,
    which emerges as a challenge for edge computing or embedded platforms with limited
    computing and storage resources. Therefore it is urgent to customize a low-cost
    VLSI system for high-speed object tracking.


    In recent years, many object tracking VLSI systems have been proposed [5–12].
    However, most of them represent the object target only based on spatial textural
    features [5–9] and fail to make full use of the inherent motion information to
    ease the tracking procedure or improve the robustness against environmental variations.
    Some researchers have proposed an object tracking chip based on motion energy
    features [11] to boost tracking robustness. Extracting such motion features is
    computationally intensive via a stack of 3D spatiotemporal Gabor filters, requiring
    a huge amount of computing and memory resources, which are not plausible for edge
    or embedded applications. To realize flexible and robust tracking, some VLSI chips
    adopt hardware-algorithm codesign paradigm with an on-chip microprocessor unit
    (MPU) [5,11]. A significant part of the tracking workload is carried out by the
    MPU software in serial processing, causing performance bottleneck. To overcome
    this problem, some works massively employ parallel array coprocessors to improve
    processing speed to >1000 frame/s [9,10]. However, such fine-grained parallel
    processors consume a huge amount of computing resources and occupy high memory
    bandwidth. They do not fit low-cost edge computing or embedded systems.


    In this chapter, we introduce a low-cost high-speed object tracking VLSI system
    with unified textural and dynamic compressive features to represent the target
    for robust tracking via fast elliptic template matching. Dynamic motion features
    are extracted via simple spatiotemporal filtering:'
  merge: -1
  img_proc: true
- pgno: 150
  md: '2D spatial DoG filtering followed by parameterized pixelwise temporal high-pass
    filtering, which is simple and configurable to adapt to different motion scenes.
    We evaluate the order of filters to optimize memory requirement, improve the VLSI
    system performance, and save hardware resources as much as possible.


    +   - We use a memory-centric VLSI architecture with moderate memory consumption
    and only a few computational units, since computational units are much more expensive
    than memories for modern nanometer semiconductor technology.

    +   - We introduce multiple-level pipelines and parallel processing circuits throughout
    feature extraction, target template matching, and template updating to improve
    system throughput.

    +   - Careful designs and optimizations are carried out to further reduce the
    resource consumption of computational circuits.


    # 8.2 Algorithm


    # 8.2.1 Object tracking algorithm


    Fig. 8.1 illustrates the proposed object tracking algorithm for high-speed low-cost
    VLSI implementation. Assume that the size and the position of the target in the
    first frame are known. For each new frame, a pixelwise temporal high-pass filter
    is applied to obtain the motion information [12],


    \(\mathbf{H}[t] = c\mathbf{H}[t - 1] + (1 + c)(\mathbf{P}[t] - \mathbf{P}[t -
    1])/2, \quad (8.1)\)


    where **P** and **H** represent the input and high-pass filtered images, respectively,
    \(0 < c < 1\) is the filter coefficient configurable for various motion scenes,
    and \(t\) denotes the discrete frame time. A spatial 2D Difference of Gaussian
    (DoG) filter is a precedent for suppressing high-frequency noises and the spatial
    DC component, which may interfere the motion features under a changing illumination.


    Then we extract the textural and dynamic compressive features of samples (i.e.,
    image regions with the same size of the target) from the original and filtered
    images, respectively. Each compressive feature component is the difference of
    the pixel intensity summations across a pair of rectangular patches within the
    sample region. The offset and scale of each patch are randomly selected before
    tracking and kept unchanged throughout. The same set of these patch parameters
    applies to all samples. Our unified compressive feature vector is the concatenation
    of the textural and dynamic'
