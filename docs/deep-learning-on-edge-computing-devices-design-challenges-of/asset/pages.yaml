    # ## 9.4 Applications of SensCamera


    A group of experiments were performed to evaluate the proposed method for both
    object detection and image compression. The hardware performance of the proposed
    algorithm running on the prototyping SensCamera system was also evaluated. Experiments
    showed that the proposed method shows better image compression performance than
    the conventional approaches while achieving competitively high accuracy and efficiency
    for object detection.


    # ### 9.4.1 Experiment setting


    To evaluate the effectiveness of the proposed method, our numerical experiments
    examined the proposed incoherent convolution approach with two popular CNN-based
    object detection frameworks, YOLO [10] and SSD [9]. The YOLO model has 23 layers,
    and the first layer has 32 convolution kernels. The SSD model has 22 layers, and
    the first layer has 64 convolution kernels. For each framework, the pretrained
    convolutional neural network parameters were used as the initial setting. We further
    trained the network on the VOC (2007+2012) training set (16551 images) and COCO
    training set (118287 images) by adopting our proposed coherence regularization
    for 200000 iterations. We adopt the stochastic gradient descent (SGD) optimizer
    for optimization with a starting learning rate of 0.0001 and the momentum 0.9.
    The trade-off parameter β for coherence regularization was set to 0.0005. The
    features of the uniform pooling layer were quantized to one to five bits to compare
    different compression ratios.


    We evaluated the proposed object detection and image compression method over four
    data sets: VOC (2007+2012), COCO, BSD100, and Set11 [51]. Both VOC and COCO are
    data sets widely used for evaluating object detection methods. The VOC data set
    contains 21530 images, including 27450 annotated objects and 6929 segmentations.
    The COCO data set contains 200000 images with a total of 80 categories. The BSD100
    is a small data set containing 100 images, which is often used to evaluate the
    computationally expensive data-driven compressive sensing methods. The Set11 is
    a standard data set containing eleven images, which is widely'
