    by minimizing the difference between $\mathbf{W}_H$ and $\mathbf{W}_G$. At this
    stage the parameters of the first $g$ layers of FitNet are trained by the guidance
    of the parameters of the first $h$ layers of Net-T. The second stage is the same
    as the above output transfer, and the parameters $\mathbf{W}_S$ and $\mathbf{W}_G$
    of all the layers of Net-S are obtained by training.


    Experimental results show that the feature transfer method can provide more knowledge
    of the teacher model and improve the generalization ability of the student model
    better than the output transfer method. Moreover, FitNets, as a model compression
    algorithm, can strike an excellent balance between speed and accuracy, and the
    model performance decreases by only 1.3% under the condition of reducing parameters
    by 36 times. However, it is worth noting that the hint-based hidden layer feature
    mapping is actually a class of regularization representation, so the deeper the
    number of the $\mathbf{W}_G$ layer is set, the more likely FitNets is to be affected
    by excessive regularization. Other studies on feature transfer also start from
    the hidden layer, for example, the feature maps output by hidden layers of convolutional
    neural networks are transferred to Net-S, and the difference between the feature
    maps in Net-T and Net-S is calculated and reduced [40].


