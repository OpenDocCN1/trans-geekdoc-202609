  md: 'embedding operation as


    ```

    vec(W * X) \doteq \Phi x = y, (9.3)

    ```


    where * is the convolution operation, vec(·) is the vectorization operation, \(\Phi
    \in \mathbb{R}^{N \times N}\) is the associated square embedding matrix determined
    by the kernel matrix **W**, and **y** is the vectorized output of the convolution
    operation.


    Since the kernel matrices in the convolutional neural network model are learned
    from training samples, the sensing matrix \(\Phi\) is determined by iterative
    training. Define the column vector \(\mathbf{w} \in \mathbb{R}^{2Q+3}\) based
    on the kernel matrix **W** as \(\mathbf{w}^T = [w_1, w_2, w_3, \mathbf{0}, w_4,
    w_5, w_6, \mathbf{0}, w_7, w_8, w_9]\), where \(w_1, \dots, w_9\) are the nine
    elements of the kernel matrix **W**. The embedding matrix associated with the
    kernel can be written as


    ```

    \(\Phi = \left( \begin{array}{ccccc} \mathbf{w}^T & \mathbf{0} & \cdots & \mathbf{0}
    & \mathbf{0} \\ 0 & \mathbf{w}^T & \cdots & \mathbf{0} & \mathbf{0} \\ \vdots
    & \vdots & \ddots & \vdots & \vdots \\ \mathbf{0} & \mathbf{0} & \cdots & \mathbf{w}^T
    & 0 \\ \mathbf{0} & \mathbf{0} & \cdots & \mathbf{0} & \mathbf{w}^T \end{array}
    \right)_{N \times N}, (9.4)\)

    ```


    where **0** and 0 are the row vector of zeros and the scalar zero. The embedding
    matrix \(\Phi\) is a sparse matrix with 3 × 3 nonzero elements in each row.


    It is worth noting that Eqs. (9.3) and (9.1) have the same linear form, but different
    from the standard compressive sensing, the convolution operation of the convolutional
    neural network does not reduce the dimension of the data. To compress the image
    to dimension \(M (M \ll N)\), a *uniform-pooling layer* is inserted after the
    compressive convolutional layer for dimension reduction. In practice, a single
    feature map is selected for subsampling, and \(M \times N\) elements are uniformly
    extracted in a row-by-row fashion with equal probability.


    # ## 9.2.4 Coherence regularization


    In this subsection, we focus on addressing the incoherence condition. As a data-driven
    approach, Eq. (9.3) uses deterministic sensing matrix \(\Phi\) learned from samples.
    According to the theorem of compressive sensing, \(\Phi\) should satisfy the incoherence
    condition that the sensing matrix \(\Phi\) and the basis matrix \(\Psi\) are incoherent.
    Let \(\varphi_i^T\) be the *i_th row of \(\Phi\), and let \(\psi_j\) be the *j_th'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'column of $\Psi$. The mutual coherence between $\Phi$ and $\Psi$ is defined
    as


    \(\mu(\Phi, \Psi) = \max | < \varphi_i, \psi_j > | = \max | \varphi_i^T \psi_j
    |.\) (9.5)


    Within the compressive sensing framework, low coherence between $\Phi$ and $\Psi$
    translates to fewer samples required for recovering the signal. For data-driven
    approaches, it is intuitive to minimize the mutual coherence during the training
    process. However, since the mutual coherence in Eq. (9.5) is not differentiable,
    we relax it as the following form:


    \(\mathcal{R}_{\mathbf{W}}(\Phi) = \sum_{ij} < \varphi_i, \psi_j > = \sum_{ij}
    | \varphi_i^T \psi_j |.\) (9.6)


    Since the basis matrix $\Psi$ is usually a predefined constant matrix, e.g., a
    discrete wavelet transform (DWT) matrix, the *coherence measurement* defined in
    Eq. (9.6) is a weighted L1 norm of the matrix variable $\Phi$. Given that $\Phi$
    is determined by the kernel matrix $\mathbf{W}$ as in Eq. (9.4), the function
    $\mathcal{R}_{\mathbf{W}}$ is differentiable with respect to $\mathbf{W}$; therefore
    we can use Eq. (9.6) as regularization and estimate the sensing matrix $\Phi$
    by minimizing $\mathcal{R}_{\mathbf{W}}$.


    In practice the coherence regularization term $\mathcal{R}_{\mathbf{W}}$ is used
    for estimating the kernels of the compressive convolutional layer. The values
    of $\mathbf{W}$ and $\Phi$ are calculated via a gradient descent training process.
    By reducing the coherence between $\Phi$ and $\Psi$ the iterative training process
    can calculate the near-isometric sensing matrix $\Phi$ for effective compressive
    sensing.


    In our framework the coherence regularization only optimizes the first layer weights.
    Supposing $\mathbf{W}^{(k)}$ is the $k$th convolution kernel in the first layer,
    the total loss for training the whole detection network can be defined as follows:


    \(\mathcal{L}_{\text{total}} = \mathcal{L}_{\text{detection}} + \beta \cdot \sum_k
    \mathcal{R}_{\mathbf{W}^{(k)}}(\Phi)\)

    \(= \mathcal{L}_{\text{detection}} + \beta \cdot \sum_k \sum_{ij} | \varphi_i^{(k)\text{T}}
    \psi_j |,\) (9.7)


    where $\mathcal{L}_{\text{detection}}$ is the loss function of detection terms,
    and $\beta$ is a trade-off parameter. The coherence measurement term is added
    to improve the performance of compressive sensing of the first layer. For different
    networks, $\mathcal{L}_{\text{detection}}$ has different forms originated from
    the proposed literature, but our proposed coherence regularization term is the
    same. In our experiment, we test on the YOLOv2 [10] and SSD [9] frameworks.'
