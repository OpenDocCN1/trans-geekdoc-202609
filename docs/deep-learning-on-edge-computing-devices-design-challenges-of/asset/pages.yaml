    # 7.2 Algorithm design and optimization


    In this section, we present the proposed hardware-oriented unsupervised deep learning
    algorithm. As the background knowledge, we first introduce the training algorithm
    of the famous Deep Belief Network.


    # 7.2.1 Deep belief network and restricted Boltzmann machine


    A Deep Belief Network (DBN) is constructed by stacking multiple layers of Restricted
    Boltzmann Machines (RBMs) and using the output of the previous-layer RBM as the
    input of the next-layer RBM (Fig. 7.1). It is found that the higher-layer RBM
    tends to encode informative abstraction for classification. A standard RBM consists
    of two layers of units. First, a matrix \(\mathbf{W} \in \mathbb{R}^{n \times
    d}\) is defined as the connection weights, where \(w_{ij}\) represents the connection
    between the visible unit \(v_i\) and the hidden unit \(h_j\). Second, the parameters
    \(b_j\) and \(c_i\) are the biases for the hidden and visible units, respectively.
    Given the vector forms of the hidden units \(\mathbf{h}\), the visible units \(\mathbf{v}\),
    and the biases \(\mathbf{b}\) and \(\mathbf{c}\), the energy of a configuration
    \((\mathbf{v}, \mathbf{h})\) can be written as


    ```

    E(\mathbf{v}, \mathbf{h}) = -\mathbf{b}^{\mathbf{T}}\mathbf{h} - \mathbf{c}^{\mathbf{T}}\mathbf{v}
    - \mathbf{v}^{\mathbf{T}}\mathbf{Wh}.

    ```


    As in general Boltzmann machines, the probability distributions over the hidden
    and visible vectors are defined as


    ```

    p(\mathbf{v}, \mathbf{h}) = \frac{1}{Z} e^{-E(\mathbf{v}, \mathbf{h})}, Z = \sum_{\mathbf{v},
    \mathbf{h}} e^{-E(\mathbf{v}, \mathbf{h})}.

    ```'
