  md: '# 6.4.2 Performance evaluation and comparison


    As shown in Table 6.1, we compared the BBNA architecture with two common platforms
    and two FPGA based BNN accelerators. Two common platforms are Intel 8700K CPU
    and NVIDIA GTX2080Ti GPU, and both run the same Lenet network as our BBNA on MNIST.
    Then we compared our architecture with the LFC-max of FINN [7], which is a 1024-1024-1024
    binarized MLP, and the MLP MNIST of FP-BNN [13], which has same number of layers,
    but each layer has 2048 neurons.


    Although with an order of magnitude lower power and slower clock, BBNA-BCNN still
    results in about 89× and 1.4× better performance over CPU and GPU, respectively.
    Besides, it achieves 620× and 26× better in power efficiency over CPU and GPU,
    respectively.


    Compared with the LFC-max of FINN [7], our BBNA-BMLP save 79% memory footprint
    with a negligible reduction in accuracy in the case where we all use the MLP model,
    thanks to the improvement of model performance brought by ensemble method, which
    is a boon for memory-limited devices. Besides, our models outperform FINN in energy
    efficiency.


    The MLP MNIST design of FP-BNN [13] is implemented with a high-cost Stratix-V
    FPGA platform, which is similar to ours. With a similar accuracy on MNIST, our
    BBNA-BMLP achieves better performance and has a significant save of memory cost
    more than 94%. Due to better model performance of CNN, BBNA-BCNN has a higher
    accuracy. Moreover, our models achieve about 1.9× better energy efficiency due
    to lower memory footprint.


    # 6.4.3 Prototype system demonstration


    Fig. 6.7 shows our prototype system demonstration, which is composed of PC host
    computer and FPGA slave computer, and two computers communicate and transmit data
    through an RS-232 serial port. We can send any number of MNIST images to the FPGA
    through the graphical user interface (GUI) implemented by the PyQt5 frame. Then
    NIOS II CPU converts these pictures into data streams that conform to the protocol
    of Avalon-ST and send them to the BBNA for accelerating the computation. After
    the calculation is complete, CPU can take out the results by interrupt and return
    them to PC. This demo shows the practicability and usability of our design.'
