    recent researches showed that by learning deterministic sensing matrix from data
    the compressed images can be reconstructed with higher quality [13].


    Our proposed method attempts to find the optimal sensing matrix $\Phi$ to satisfy
    the incoherent condition with given basis matrix $\Psi$, e.g., a discrete wavelet
    transform (DWT) matrix. We calculate the near-isometric sensing matrix by data-driven
    deep learning approach.


    # 9.2.2 The framework of compressive convolutional network


    The goal of object detection is recognizing multiple objects in a single image.
    The class confidence and the bounding box for each object are returned. So far,
    many convolutional neural network-based frameworks have been proposed for object
    detection [8–10]. Different frameworks usually have different types of layers
    and different parameters, yet a typical convolutional neural network framework
    uses a pipeline of modules for image classification and object detection.


    Fig. 9.2 shows the framework of our proposed CCN model mainly including two branches,
    image compression and object detection. The object detection branch is with the
    standard convolutional neural network, such as YOLOv2 [10], including twenty-three
    conventional convolutional layers, one reorganizing layer, five max-pooling layers,
    and one soft-max layer. The image compression branch includes one *compressive
    convolutional layer* and one uniform pooling layer with quantization operation.
    Based on the object detection results, the compressed image data, along with the
    class confidence and bounding box of each object, can be transmitted to the back-end
    server for the subsequent tasks.


    We innovatively reuse *the first layer* of the object detection convolutional
    neural network model as the *compressive convolutional layer* to perform image
    compression. Note that our proposed image compression branch can be incorporated
    into any convolution neural networks designed for all kinds of applications, e.g.,
    detection, classification, segmentation, etc.


    From a functional point of view, the proposed CCN performs image compression and
    object detection simultaneously at the inference stage.'
