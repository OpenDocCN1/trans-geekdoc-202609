- pgno: 39
  md: '# 2.3 Learning objectives and training process


    # 2.3.1 Loss function


    Deep learning model training and parameter estimation are generally based on the
    optimization of specific loss functions (or objective functions, collectively
    referred to as loss functions in this book). In model optimization theory, loss
    functions are a kind of functions that map the values of one or more variables
    to the real number field. For the training of neural network model, we use the
    loss function to measure the degree of inconsistency between the predicted value
    and the ground-truth label, which is a non-negative real-valued function, so the
    loss function for all samples of the training set is usually expressed as


    ```

    \( J(\theta) = \mathbb{E}_{(x,y)\sim P_{data}} \mathcal{L}(x, y; \theta) \)

    \( = \mathbb{E}_{(x,y)\sim P_{data}} \mathcal{L}(f(x; \theta), y), \) (2.6)

    ```


    where L is the loss function of each sample, \( f(x; \theta) \) is the output
    predicted by the model when x is the input, P_data is the empirical distribution,
    E represents expectation, y is the vector of all data labels, and \( \theta \)
    represents all parameters of the neural networks. The smaller the output of the
    loss function, the smaller the gap between the predicted value and the data label,
    and the better the performance of the model. Most importantly, the loss function
    is differentiable and can be used to solve optimization problems.


    In the model training stage the predicted value is obtained through forward propagation
    after data is fed into the model, and then the loss function computes the difference
    between the predicted value and the data label, i.e., the loss value. The model
    updates the parameters by back propagation to reduce the loss value, so that the
    predicted value generated by the model is close to the ground-truth label of the
    data, so as to achieve the purpose of learning. In the following sections, we
    mainly introduce two loss functions in two classical prediction tasks, classification
    and regression.


    The cross entropy loss function [18] is one of the most commonly used classification
    objective functions in current deep neural networks, which is a kind of loss functions
    based on probability distribution measurements. In information theory, entropy
    is used to describe the measurement of uncertainty. Cross entropy is originally
    used to estimate the average coding length, and in machine learning, it is used
    to evaluate the difference between the probability distribution obtained by current
    training and the real distribution. For a single sample, the cross entropy loss
    function takes the'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'form


    $$\mathcal{L} = - \sum_{k=1}^{C} y_k \log \hat{y}_k,$$ (2.7)


    where $C$ represents the number of output categories, $\hat{y}_k$ represents the
    $k$th output element ($k \in 1, 2, \dots, C$) of the neural network, and the corresponding
    data label is $y_k$. If it is the corresponding category, then $y_k$ is 1; otherwise,
    $y_k$ is 0.


    Different from the duality of data labels in a classification task (discrete type),
    each dimension of data labels in a regression task is a real number (successive
    type). In regression tasks the prediction error is frequently used to measure
    how close the predicted value of a model is to the data label. Assuming that the
    real label corresponding to the $i$th input feature $\mathbf{x}_i$ in a regression
    question is $\mathbf{y}_i = [y_{1i}, \dots, y_{ik}, \dots, y_{iM}]^T$, and $M$
    is the total dimension of label vector, the prediction error of the network regression
    predicted value $\hat{y}_{ik}$ and its real label $y_{ik}$ in the $k$th dimension
    is


    $$\mathcal{L}_{ik} = y_{ik} - \hat{y}_{ik}.$$ (2.8)


    Loss functions frequently used in regression tasks are L1 [19] and L2 [20]. The
    L1 loss function for $N$ samples is defined as


    $$\mathcal{L} = \frac{1}{N} \sum_{i=1}^{N} \sum_{k=1}^{M} |\mathcal{L}_{ik}|.$$
    (2.9)


    There are many kinds of loss functions, including loss functions based on specific
    tasks, such as classification and regression tasks mentioned above, and loss functions
    based on distance measurement and probability distribution, for example, the mean
    square error loss function [21] and the L1 and L2 loss functions are based on
    distance measurement, whereas the cross entropy loss function and Softmax loss
    function [22] are based on probability distribution. The selection of a loss function
    needs to consider data features, and, in some cases, some regular terms should
    be added to improve the performance of the model.


    # ## 2.3.2 Regularization


    In model training, the loss value on the training sample can be continuously decreased
    by increasing the number of training iterations or adjusting hyperparameter settings.
    However, the prediction accuracy of the label of'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'the training sample may keep improving, but the prediction accuracy of the
    label of the testing sample decreases instead of rising, which is called overfitting.
    Therefore the regularization method should be used to improve the generalization
    ability of the model and avoid overfitting.


    Regularization is a method designed to reduce generalization errors, i.e., the
    errors of the model on testing samples, to correct models. In traditional machine
    learning algorithms, the generalization ability is mainly improved by limiting
    the complexity of the model. Generally speaking, the model complexity is linearly
    related to the data amount of weight parameters **W**: the larger the data volume
    of **W**, the greater the complexity, and the more complex the model. Therefore,
    to limit the complexity of the model, it is quite natural to reduce the number
    of weight parameters **W**, that is, to make some elements in **W** be zero or
    limit the number of nonzero elements. Make the parameter \(\theta\) of the neural
    network contain the weight coefficients of all neural network levels. The complexity
    of model parameters can be limited by adding a parameter penalty \(\Omega(\theta)\)
    to the loss function. The regularized loss function is denoted as


    \(\tilde{\mathcal{L}}(\mathbf{x}, \mathbf{y}; \theta) = \mathcal{L}(\mathbf{x},
    \mathbf{y}; \theta) + \alpha \Omega(\theta),\)


    where \(\alpha \in [0, \infty)\) is the hyperparameter weighing the relative contribution
    of regularization term \(\Omega\) and standard objective function \(\mathcal{L}(\mathbf{x},
    \mathbf{y}; \theta)\). Setting \(\alpha\) to 0 indicates that there is no regularization,
    and the larger the \(\alpha\), the greater the corresponding regularization contribution.


    By introducing regularization terms we hope to limit the number of nonzero elements
    in vector **W**, so that the weight parameters are as small as possible and close
    to 0. The most frequently used regularization penalty is the L2 norm, which suppresses
    the weights of large values by applying an element-by-element squared penalty
    to all parameters. The L2 parameter norm penalty is also known as the weight decay
    [23], which is a regularization strategy that makes the weight closer to the origin
    by adding a regularization term \(\Omega = \frac{1}{2}\|\mathbf{W}\|_2^2\) to
    the objective function.


    # 2.3.3 Gradient-based optimization method


    As mentioned earlier, model training is achieved by minimizing loss functions
    in machine learning. Under normal circumstances, the loss function is very complicated,
    and it is difficult to solve the analytic expression of minimum value. The gradient
    descent [24] is designed to solve this kind of problem. For ease of understanding,
    let us take an example and regard'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'the process of solving the minimum value of a loss function as “standing somewhere
    on a slope to look for the lowest point”. We do not know the exact location of
    the lowest point, the gradient descent strategy is to take a small step in the
    direction of downward slope, and after a long downward walk, there is a high probability
    that you will end up near the lowest point. We select the direction of downward
    slope to be the negative direction of the gradient, because the negative direction
    of the gradient at each point is the steepest downward direction of the function
    at that point. Deep neural networks usually use the gradient descent to update
    parameters, and by introduction of random, adjustment of learning rate, and other
    methods it is hoped that the networks can avoid falling into poor local minimum
    points and converge to better points. This is the traditional idea of gradient
    descent.


    Stochastic gradient descent (SGD) is one of the most frequently used methods for
    updating parameters. In that method, the gradient of loss function with respect
    to parameters is computed by using a mini-batch of random sample data of the whole
    data set. SGD typically divides the whole data set into several small batches
    of sample data, then iterates the input and computes losses and gradients, and
    finally updates the parameters. Set the neural network parameter \(\theta\) and
    collect a small batch of {\(\mathbf{x}_1, \mathbf{x}_2, \dots, \mathbf{x}_N\)}
    containing \(N\) samples from the training set, where \(\mathbf{x}_i\) corresponds
    to the label \(\mathbf{y}_i\). The following equations show the computation principle
    of gradient descent [25].


    # Gradient computation


    ```

    \(\hat{\mathbf{g}} \leftarrow \frac{1}{m} \nabla_{\boldsymbol{\theta}} \sum_i
    \mathcal{L}(f(\mathbf{x}_i; \boldsymbol{\theta}), \mathbf{y}_i).\quad (2.11)\)

    ```


    # Application update


    ```

    \(\boldsymbol{\theta} \leftarrow \boldsymbol{\theta} - \varepsilon \hat{\mathbf{g}}.\quad
    (2.12)\)

    ```


    where \(\hat{\mathbf{g}}\) represents the gradient of the loss function with respect
    to parameter \(\theta\), and \(\varepsilon\) is called the learning rate, which
    is a hyperparameter to control the update stride of parameters. A too large learning
    rate will fluctuate near the minimum value but fail to converge, and a too little
    learning rate leads to spending more time for convergence, so the convergence
    speed is slow. The learning rate can be adjusted by experience or algorithms.
    For example, the learning process may be slower when a flat or high-curvature
    area is encountered. A momentum algorithm can be added to SGD to improve'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'the convergence speed. At present, there are also adaptive algorithms such
    as Adaptive Moment Estimation (Adam) algorithm [26] and RMSProp algorithm [27],
    which can make an optimization from both the gradient and the learning rate to
    achieve good results.


    In deep learning, gradient computation is complicated because of the large number
    of network layers and parameters. Back propagation algorithm [28] is widely used
    in gradient computation of neural network parameters. The principle of the back
    propagation algorithm is to compute the gradient of the loss function with respect
    to each weight parameter layer by layer through the chain rule. Then based on
    the chain rule, the reverse iteration is performed from the last layer, and the
    weight parameters of the model are updated at the end of each iteration. In the
    process of model training, weight parameters are constantly updated by inputting
    different batches of data until the loss function values converge to get a better
    parameter solution.


    # ## 2.4 Computational complexity


    From the perspective of complexity, two considerations should be taken into account
    when designing a CNN network. One is the amount of computation required by the
    network, and the other is the scale of the parameters of the model and the input
    and output features of each layer. The former determines the speed of network
    training or inferring, usually measured by time complexity, and the latter determines
    how much memory a computing device needs, usually measured by space complexity.


    The time complexity of an algorithm is a function that describes the running time
    of an input algorithm of a given size. It can describe the trend of change in
    code execution time with the increase in data size. Generally speaking, the time
    complexity of the algorithm can be understood as the total time spent completing
    a set of specific algorithms. On a specific device the time is determined by the
    total amount of computation required by the execution of the algorithm. The frequently
    used units for the measurement of amount of computation of deep learning algorithms
    are required floating-point operations and FLOPS. Floating point operations per
    second (FLOPS) is a measure of computer performance, useful in fields of scientific
    computations that require floating-point calculations. For such cases, it is a
    more accurate measure than measuring instructions per second. At present, the
    total amount of computation of most convolutional neural networks can reach dozens
    or even hundreds of GigaFLOPs, such'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'as the common convolutional neural network models MobileNet-V2 [29] and ResNet-50
    [30], with a total amount of computation of 33.6 GFLOPs to 109.8 GFLOPs, which
    makes it difficult for neural networks deployed at the edge to complete real-time
    reasoning.


    The space complexity refers to the amount of memory space required to solve an
    instance of the computational problem as a function of characteristics of the
    input, which is usually measured in units of computer memory. Inside a computer,
    information is stored, computed, and transmitted in binary form. The most basic
    units of storage are bits and bytes.


    In convolutional neural networks the space complexity is mainly determined by
    the size of parameters at all layers. The parameters of the convolutional layer
    are mainly determined by the size and number of convolutional kernels, whereas
    the parameters of the fully connected layer are determined by the number of input
    neurons and output neurons. Take AlexNet [31], the champion model of 2012 ImageNet
    Image Classification Challenge, for example, which contains five convolutional
    layers with parameter sizes of 35 KB, 307 KB, 884 KB, 1.3 MB, and 442 KB, respectively,
    and three fully connected layers with parameter sizes of 37 MB, 16 MB, and 4 MB.
    The total size of parameters in AlexNet is about 60 MB, among which the fully
    connected structure undoubtedly increases the size of parameters, contributing
    57 MB of parameters. Some CNN models that emerged after AlexNet performed better,
    but they were difficult to deploy on edge computing terminals due to their high
    space complexity.


