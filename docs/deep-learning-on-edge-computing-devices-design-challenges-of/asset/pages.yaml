- pgno: 152
  md: 'To predict the target position in the current frame, we compute the unified
    compressive features of the samples surrounding the target position of the previous
    frame and employ an elliptic feature template matching procedure. The matching
    degree between one sample and the target object is measured as the ratio of the
    elliptic distances between the sample and the positive/negative templates (to
    be explained soon) as


    $$S = \frac{\sum_{m=1}^M (v_m - \mu_m^p)^2 / (\sigma_m^p)^2}{\sum_{m=1}^M (v_m
    - \mu_m^n)^2 / (\sigma_m^n)^2}, \quad (8.4)$$


    where M is the unified feature vector dimension, $v_m$ is the mth component of
    the sample feature vector, $(\mu_m, \sigma_m)$ is the mth component of the template,
    and the superscript $p/n$ denotes the positive/negative template. The low computational
    overhead of the elliptic matching is essential to ensuring real-time low-cost
    hardware implementation. The combination of both object and background contexts
    improves tracking stability and accuracy.


    To update the templates online, we draw positive samples uniformly centered at
    a circle of radius R1 near current target position and negative samples (backgrounds)
    uniformly centered in a ring area of inner radius R2 and outer radius R3 that
    are sufficiently far away from the target position. The number of both positive
    and negative samples is set to $K = 2^5 = 32$, allowing us to replace expensive
    hardware dividers by much simpler right-shifters. The positive/negative templates
    follow the same update strategy by using extracted unified compressive features
    from respective positive/negative samples as


    $$\mu_m[t] = \gamma \mu_m[t-1] + \frac{1 - \gamma}{K} \sum_{k=1}^K v_m[k][t],
    \quad (8.5)$$


    $$

