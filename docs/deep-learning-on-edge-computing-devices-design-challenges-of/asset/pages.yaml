    # ## 4.3 Bitwise bottleneck quantization methods


    In this section, we introduce the neural network with bitwise bottleneck and the
    training algorithm for the sparse bitwise bottleneck.


    # ### 4.3.1 Neural network with bitwise bottlenecks


    As shown in Eq. (4.6), the bitwise bottleneck operation calculates the optimal
    coefficients associated with different bits of the compressed activation representation
    so that a minimal distortion can be achieved given the maximum code rate. This
    section shows how the bitwise bottlenecks work in the deep neural network.


    Fig. 4.3 shows an example of efficient neural computing with bitwise bottlenecks.
    The whole network is built based on the classic ResNet, although the bitwise bottleneck
    operation can be easily integrated into different networks. In practice the bitwise
    bottleneck operation can be inserted in the macrobock of the deep neural network.
    A typical macrobock contains a bitwise bottleneck layer, a convolution layer,
    a pooling layer (optional), a batch normalization layer, and an activation layer.
    Thanks to the bitwise bottleneck layer, which transforms the normalized floating-point
    activation to compressed fixed-point activation, the convolution layer can substitute
    the efficient fixed-point bitwise multiplications for the computationally expensive
    floating-point multiplications.


    The benefits of inserting the bitwise bottlenecks in deep neural networks are
    twofold. From the perspective of memory efficiency, compared with the standard
    deep neural networks using 32-bit single-precision activation representation,
    the bitwise bottlenecks can compress the activation'
