  md: 'Given Eq. (7.2), the marginal probability of the visible vector is


    $p(\mathbf{v}) = \frac{1}{Z} \sum_{\mathbf{h}} e^{-E(\mathbf{v}, \mathbf{h})}.$
    (7.3)


    Since there are no direct connections between two hidden units at the same layer,
    the hidden units conditioned on **v** are independent of each other. Similarly,
    the visible units conditioned on **h** are also independent of each other. The
    units of a binary hidden layer, conditioned on the visible layer, are independent
    Bernoulli random variables. The binary state $h_j$ of the $j$th hidden unit is
    set to 1 with probability


    $p(h_j = 1 | \mathbf{v}) = \delta(\sum_i w_{ij}v_i + b_j),$ (7.4)


    where $\delta(x) = 1/(1 + \exp(-x))$ is the sigmoid activation function. Similarly,
    if the visible units are binary, then the visible units, conditioned on the hidden
    layer, are also independent Bernoulli random variables. In this case, the binary
    state $v_i$ of the $i$th visible unit is set to 1 with probability


    $p(v_i = 1 | \mathbf{h}) = \delta(\sum_j w_{ij}h_j + c_i).$ (7.5)


    On the other hand, if the visible units have real values, then the visible units,
    conditioned on the hidden layer, are independent Gaussian random variables defined
    as


    $p(v_i | \mathbf{h}) = \mathcal{G}(\sum_j w_{ij}h_j + c_i, 1),$ (7.6)


    where $\mathcal{G}$ represents the Gaussian distribution. Suppose $\boldsymbol{\theta}
    = \{\mathbf{W}, \mathbf{b}, \mathbf{c}\}$ is the parameter set of the RBM. Since
    the RBM is a generative model, the parameters can be calculated by performing
    stochastic gradient descent on the log-likelihood of the training samples [30].
    The probability that the network assigns to a sample $\mathbf{v}^{(k)}$ ($k =
    1, ..., K$) is given by summing over all possible hidden vectors as


    $\arg \min_{\boldsymbol{\theta}} - \sum_k \log( \sum_{\mathbf{h}} e^{-E(\mathbf{v}^{(k)},
    \mathbf{h}^{(k)})} ).$ (7.7)


    By solving Eq. (7.7) we can calculate the parameters offline and use them to configure
    the RBM. After training the RBM, the DBN can be built by stacking multiple layers
    of RBMs trained in a layer-by-layer manner.'
