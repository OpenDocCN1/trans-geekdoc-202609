  md: '# CHAPTER 2


    # The basics of deep learning


    # 2.1 Feedforward neural networks


    A feedforward neural network (or fully connected neural network) is one of the
    earliest neural network models invented in the field of artificial intelligence
    [1]. It is able to learn autonomously via the input data to complete specific
    tasks. Here we take image classification [2], one of the core problems in the
    field of computer vision, as an example to illustrate the principle of a feedforward
    neural network. The so-called classification problem is allocating a label to
    each input data on the premise of a fixed set of classification labels. The task
    of a feedforward neural network is predicting the classification label of a given
    image. The prediction is made by giving scores (prediction probabilities) of the
    image under each classification label in the form of a vector, which are also
    the output of the feedforward neural network. Apparently, the label with the highest
    score is the category to which the network predicts that the image belongs. As
    shown in Fig. 2.1(b), the process of prediction is a simple linear mapping combined
    with an activation function \(\sigma\),


    ```

    f(\mathbf{x}; \mathbf{W}, \mathbf{b}) = \sigma(\mathbf{Wx} + \mathbf{b}), \quad
    (2.1)

    ```


    where the image data \(\mathbf{x} \in \mathbb{R}^d\), \(d\) is the number of pixel
    elements of the images. The parameters of this linear function are the matrix
    \(\mathbf{W} \in \mathbb{R}^{c \times d}\) and column vector \(\mathbf{b} \in
    \mathbb{R}^c\), and \(c\) represents the number of categories. The parameter \(\mathbf{W}\)
    is called the weight, and \(\mathbf{b}\) is called the bias vector. Obviously,
    the weight and bias affect the performance of the feedforward neural network,
    and the correct prediction is closely related to the values of these two matrix
    vectors. According to the operational rule of matrices, the output will be a column
    vector of size \(c \times 1\), i.e., the scores of the \(c\) categories mentioned
    earlier.


    The structure of the feedforward neural network is inspired by the neuronal system
    of human brain [3]. The basic unit of computation of the brain is neuron. There
    are 80 billion neurons in a human neuronal system, which are connected by approximately
    \(10^{14}\) to \(10^{15}\) synapses. Fig. 2.1(a) shows a biological neuron. As
    shown in the figure, each neuron receives input signals from its dendrites and
    then generates output signals along its'
