  md: '# 7.2.2 Adaptive restricted Boltzmann machine


    For efficient hardware implementation, a sparsely weighted variant of the RBM
    was proposed, named the Adaptive RBM (AdaRBM), which adds an extra regularization
    term in Eq. (7.7) to shrink the weights adaptively. The regularization term is
    based on a mixed matrix norm defined as


    ```

    \(\|\mathbf{W}\|_M = \sum_i (\sum_j |w_{ij}|^2)^{1/2}, \quad (7.8)\)

    ```


    where the indices \(i\) and \(j\) are treated differently. It is easy to prove
    that the mixed norm is a legitimate matrix norm, and it is different from the
    standard L1 and L2 matrix norms, i.e., \(\|\mathbf{W}\|_{L_1} = \sum_i \sum_j
    |w_{ij}|\) and \(\|\mathbf{W}\|_{L_2} = (\sum_i \sum_j w_{ij}^2)^{1/2}.\)


    The mixed matrix norm defined in Eq. (7.8) adds the vector norms of all rows in
    a matrix; therefore minimizing the mixed norm reduces the lengths of the matrix
    rows. It is worth noting that the shrinking process does not apply evenly to all
    rows. Shorter rows shrink faster than the rows with larger weights in the stochastic
    gradient descent process. As a result, the weights in short rows tend to shrink
    to zero after a finite number of iterations. Similarly, minimizing the mixed norm
    of a transposed matrix \(\mathbf{W}^T\) can reduce the weights in shorter columns
    to zero. To achieve the maximum compression rate, the AdaRBM attempts to shrink
    the weight parameters in shorter rows and columns simultaneously by minimizing


    ```

    \(\mathcal{R}_s(\mathbf{W}) = \lambda (\gamma \|\mathbf{W}\|_M + (1-\gamma)\|\mathbf{W}^T\|_M),
    \quad (7.9)\)

    ```


    where \(\lambda\) controls the sparsity of the weight parameters, and \(\gamma\)
    controls the balance between row sparsity and column sparsity. Formally, the AdaRBM
    training algorithm attempts to shrink the regularization term by incorporating
    it in the standard RBM of Eq. (7.7) as


    ```

    \(\underset{\theta}{\text{arg min}} - \sum_k \log (\sum_{\mathbf{h}} e^{-E(\mathbf{v}^{(k)},
    \mathbf{h}^{(k)})}) + \lambda (\gamma \|\mathbf{W}\|_M + (1-\gamma)\|\mathbf{W}^T\|_M).
    \quad (7.10)\)

    ```


    # 7.2.3 Training algorithm


    The objective function of Eq. (7.10) is the sum of a log-likelihood term and a
    regularization term. The derivatives of the log probability and the'
