  md: '# CHAPTER 9


    # SensCamera: A learning-based smart camera prototype


    # 9.1 Challenges beyond pattern recognition


    With the advances in the technology of integrated circuits and embedded computing,
    wireless smart cameras with powerful object detection function have been widely
    employed for different applications [1,2]. As one of the state-of-the-art methods,
    the convolutional neural network (CNN) has been proven to be a great success for
    object detection, arousing a growth of interest to implement the convolutional
    neural network-based smart cameras for different applications such as intrusion
    detection [3–5].


    Early object detection approaches based on the convolutional neural network consist
    of a region extraction stage to select thousands of regions from the target image
    for object detection, which would lead to high computational overhead, such as
    the famous Regional CNN (R-CNN) [6]. Recently, a set of efficient object detection
    convolutional neural network architectures were proposed, including the Fast R-CNN
    [7], the Faster R-CNN [8], the Single Shot Detection (SSD) [9], and the YOLO models
    [10]. Inspired by these works, the computational complexity of the CNN-based object
    detection has been greatly reduced, which makes it feasible to implement CNN-based
    computer vision applications using wireless embedded devices.


    Research [11] pioneered the use of convolution operations for compressive sensing,
    but it still used random sensing matrices to ensure the incoherence condition.
    Recently, a set of learning-based methods used a group of training samples to
    estimate the deterministic sensing matrices. As an early attempt, the NuMax method
    can estimate the linear near-isometric sensing matrix by solving the semidefinite
    program (SDP) problem [12]. Baldassarre et al. [13] proposed a learning-based
    subsampling method that can estimate the sensing matrix by solving combinatorial
    optimization problems. Blasiok et al. [14] relaxed the NuMax SDP problem as an
    eigenvalue problem and proposed ADAGIO method for a larger data set containing
    thousands of samples.


    Recently, some researchers attempted to use convolutional neural networks to solve
    different problems of compressive sensing. Mousavi et'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'al. [15] proposed to use a convolutional neural network to recover the original
    signal from random under-sampled measurements. Later, Mousavi et al. [16] improved
    their method by using a convolutional neural network to compress and recover the
    signal. Lu et al. [17] proposed a similar idea for image compression. Iliadis
    et al. [18] proposed to use a deep fully connected network for video image recovery.
    Ren et al. [19] proposed a progressive reconstruction method following the concept
    of the Laplacian pyramid. Wu et al. [20] improved the performance and speed of
    reconstruction via metalearning. Chen et al. [21] adopted multilayer residual
    coding scheme to improve rate-distortion performance of compressive sensing-based
    image coding. Zhou et al. [22] developed a multichannel deep network for block-based
    image compressive sensing by exploiting interblock correlation. The main difference
    between our proposed method and these researches is that the Compressive Convolutional
    Network (CCN) is not a network built for image compression or recovery, but a
    network enhancement method that enables the object detection network to gain the
    capability of image compression without degrading performance.


    Object detection-based smart cameras have been applied to many internet of things
    (IoT) scenarios, such as home [23], traffic [24], factories [25], and parking
    lots [4,26], where big data are commonly encountered. Therefore only those interesting
    frames should be transmitted. In this case, detection is needed to find those
    interesting frames, whereas image compression is needed for data transmission.
    For example, in the home monitoring, most of the time the camera should not transmit
    the normal images to houseowner unless certain events are detected, such as an
    intrusion, people falling, etc. Moreover, in the factory quality inspection line,
    the cameras are deployed for quality inspection. They also only transmit the image
    information when the unqualified products are detected.


    From a system point of view, the wireless smart camera is usually implemented
    using reconfigurable Field Programmable Gate Arrays (FPGAs) and System on Chips
    (SoCs). Several hardware-accelerated embedded systems have been introduced for
    CNN-based image classification applications during the last few years [27–31].
    However, unlike the image classification task, object detection is much more computation-intensive
    and energy-consuming since a large number of possible object proposals need to
    be evaluated. Only until very recently could researchers manage to implement light-weight
    CNN-based object detection algorithms using embedded systems [32,33].'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'A traditional approach to achieve image compression is using additional logic
    devices, like image/video coding approaches [34–37], which potentially increase
    the cost and computation complexity at the system level. To address the challenge,
    in this paper, we propose an efficient method for unified object detection and
    image compression. The basic idea is optimizing and reusing the convolution operation
    of the convolutional neural network to perform feature extraction and image compression
    simultaneously; therefore there is no requirement for extra computational overhead,
    saving the cost and computation occupation of wireless computer vision applications.


    The proposed approach is based on the modern compressive sensing technique. By
    solving undetermined linear systems it has been proved that the sparsity of the
    image signal makes it possible to be recovered from fewer samples [38]. To recover
    a compressed image, the theory of compressive sensing requires a sufficient incoherence
    condition, which is applied through the isometric property [39,40]. At the front
    end, traditional compressive sensing methods use random matrices for data embedding,
    which can meet incoherence conditions with high probability [41–44].


    It is not trivial to incorporate the compressive sensing in the deep learning
    framework. The proposed incoherent convolution operation is deterministic and
    can be learned from samples, which is different from the work of random convolution
    operation [11]. To accurately recover the image, the incoherent condition must
    be satisfied, so the proposed method defines a relaxed measurement of the mutual
    coherence between the sensing and basis matrices. By minimizing the coherence
    measurement in the regularized training process the original image can be compressed
    with higher quality. Compared to our conference version [45], this paper is much
    more comprehensive, which features the hardware and system-level innovation, and
    covers the design work of the wireless smart camera prototype for video surveillance
    application. Fig. 9.1 illustrates the typical object detection application implemented
    using the prototyping wireless smart camera we built. The prototype is named as
    SensCamera.


    From an algorithmic point of view, there are several advantages for adopting the
    incoherent convolution approach. First, through learning nearing-isometric sensing
    matrix from a large-scale training set, the reconstructed peak signal-to-noise
    ratio (PSNR) of the compressed images is 2.7–5.2 dB higher than that of the standard
    JPEG and traditional compressive sensing methods [14,46]. Secondly, since the
    neural network inference stage has no computational overhead and no additional
    latency, the proposed method'
  merge: -1
  img_proc: true
