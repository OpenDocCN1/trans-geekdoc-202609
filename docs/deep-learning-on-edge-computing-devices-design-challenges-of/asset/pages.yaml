- pgno: 70
  md: 'architecture for *featurewise* compression, which treat the neural network
    as a trade-off between compression and prediction [14,16]. As far as we know,
    this work is the first attempt at bitwise compression addressing the challenge
    of minimizing the code rate while optimally preserving activation integrity.


    Despite information theory has motivated researches, the research on deterministic
    or stochastic model-based activation quantization is also attracting more attention
    lately. Lee et al. [17] quantized neural networks according to the channel-level
    distribution. Zhao et al. [18] used outlier channel splitting to eliminate the
    effect of outliers caused by quantization. Minimum mean squared error [19] and
    complementary approach [20] were both used for reducing quantization error. Meanwhile,
    the research on data-driven activation quantization was also booming. Qiu et al.
    [21] presented a Fisher vector method to encode activation with a fixed-point
    number using a deep generative model. Jacob et al. [22] quantized both the activations
    and weights as 8-bit integers using an iterative approach. Li et al. [23] proposed
    an entropy-based method for interpretable quantization. Compared with information
    theory-based methods, these approaches were generally based on different assumptions
    on the quantization function, and many researchers used nonderivative quantization
    operation [21–23], which may lead to uninterpretable and suboptimal results.


    Technically, in this chapter, we introduce the Bitwise Bottleneck approach, which
    is based on the *rate-distortion theory* [24]. As a lossy data compression operation,
    the Bitwise Bottleneck method attempts to determine the most significant bits
    in the activation by minimizing the quantization distortion. To achieve this,
    the Bitwise Bottleneck approach directly minimizes the distortion of quantization
    given the constraint of the maximum code rate of the compressed activation. Specifically,
    the bitwise bottleneck optimization is formulated as a sparse convex optimization
    problem, which attempts to minimize the distortion given the constrained code
    rate. Since the nonsignificant bits generally have near-zero coefficients, the
    activation can be optimally compressed in a bitwise way.


    The contributions of this chapter are threefold. First, it presents an information
    theory-based method, Bitwise Bottleneck, for *bitwise activation quantization*
    and compression, which is the first attempt to optimize *bitwise bottleneck* for
    DNN activation quantization. Second, the code rates of different bottlenecks can
    be tuned adaptably by a single hyperparameter of the threshold of peak-signal-to-noise
    ratio (PSNR) loss, allowing the proposed method to flexibly make a trade-off between
    efficiency and accuracy for different applications. Finally, the bitwise bottleneck
