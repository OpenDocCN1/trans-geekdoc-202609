  md: 'of activation representation is easier to detect. Therefore we might be able
    to estimate the optimal and sparse coefficients \(\boldsymbol{\alpha}^{(l)}\)
    associated with the most significant bits.


    According to the rate-distortion theory (Eq. (4.2)), the Bitwise Bottleneck attempts
    to find the optimal quantization scheme by minimizing the standard squared distortion
    rate over \(N\) training samples given that less than \(\eta\) bitwise coefficients
    are nonzero,


    ```

    \(\begin{aligned} \arg \min_{\boldsymbol{\alpha}^{(l)}} \sum_{i=1}^N \|\mathbf{X}_i^{(l)}
    - \sum_{j=1}^D \alpha_j^{(l)} \hat{\mathbf{X}}_{ij}^{(l)}\|_2^2 \quad \text{s.t.}
    \quad \|\boldsymbol{\alpha}^{(l)}\|_0 \le \eta, \end{aligned} \quad (4.5)\)

    ```


    where \(\hat{\mathbf{X}}_{ij}^{(l)}\) calculated by initial quantization operation
    is usually known as the quantization *codebook*. In practice, different initial
    quantization operations can be applied, and Eq. (4.3) is a simple example of the
    rounding quantization approach. It is worth noting that since the number of nonzero
    coefficients in \(\boldsymbol{\alpha}^{(l)}\) equals the number of bits in the
    fixed-point representation, the constraint function of Eq. (4.5) actually limits
    the maximum number of bits in the quantized representation as required by the
    rate-distortion theory. Recent research shows that Eq. (4.5) is equivalent to
    the following L1-norm-based problem when fulfilling the sparsity requirement,
    which leads to a sparse solution [26]:


    ```

    \(\begin{aligned} \arg \min_{\boldsymbol{\alpha}^{(l)}} \sum_{i=1}^N \|\mathbf{X}_i^{(l)}
    - \sum_{j=1}^D \alpha_j^{(l)} \hat{\mathbf{X}}_{ij}^{(l)}\|_2^2 \quad \text{s.t.}
    \quad \|\boldsymbol{\alpha}^{(l)}\|_1 \le \eta. \end{aligned} \quad (4.6)\)

    ```


    The bitwise bottleneck operation solves Eq. (4.6) to determine the sparse significant
    bits and leads to the minimal distortion. In practice, Eq. (4.6) is usually calculated
    by solving its Lagrangian form as


    ```

    \(\begin{aligned} \arg \min_{\boldsymbol{\alpha}^{(l)}} \sum_{i=1}^N \|\mathbf{X}_i^{(l)}
    - \sum_{j=1}^D \alpha_j^{(l)} \hat{\mathbf{X}}_{ij}^{(l)}\|_2^2 + \lambda \|\boldsymbol{\alpha}^{(l)}\|_1,
    \end{aligned} \quad (4.7)\)

    ```


    where \(\lambda\) is the hyperparameter for controlling the trade-off between
    the optimized error rate and the code rate. Eq. (4.6) generally leads to a sparse
    solution of the coefficients \(\boldsymbol{\alpha}^{(l)}\), so the activation
    bits associated with zero coefficients are removed during the inference stage.
    To avoid expensive computations caused by floating-point, we quantize the coefficient
    vector \(\boldsymbol{\alpha}^{(l)}\) during the retraining process; therefore,
    the computational efficiency can be significantly improved.'
