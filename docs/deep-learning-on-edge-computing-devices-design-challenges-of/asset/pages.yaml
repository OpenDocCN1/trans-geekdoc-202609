    # ## 5.2 The basic of binary neural network


    For most binary neural networks, the weights and inputs in convolutional layers
    were binarized using sign function. We denote the convolutional filters as \(\mathbf{W}
    \in \mathbb{R}^{c_{out} \times c_{in} \times r \times r}\), where \(c_{out}\)
    is the number of filters, \(c_{in}\) is the number of input channels, and \(r\)
    is the filter size. The process of weight binarization is \(\mathbf{B}_w = \text{sign}(\mathbf{W})\),
    where \(\mathbf{B}_w \in \{+1, -1\}^{c_{out} \times c_{in} \times r \times r}\)
    denotes the binary weights, \(\text{sign}(\cdot)\) generates \(+1\) for positive
    inputs and \(-1\) for negative inputs. To constrain a convolutional neural network
    to have binary weights, we estimate the real-valued weight filter \(\mathbf{W}\)
    using a binary filter \(\mathbf{B}_w\) and a scaling factor \(\alpha \in \mathbb{R}\)
    such that \(\mathbf{W} \approx \alpha \mathbf{B}_w\). A convolutional operation
    (*) for \(\mathbf{X}\) and \(\mathbf{W}\) can be approximated by


    ```

    \(\mathbf{X} * \mathbf{W} \approx (\mathbf{X} \oplus \mathbf{B}_w)\alpha, \tag{5.1}\)

    ```


    where \(\oplus\) indicates a convolution without any multiplication. Since the
    weight values are binary, we can implement the convolution with additions and
    subtractions. The binary weight filters reduce memory usage by a factor of \(32\times\)
    compared to single precision filters. To estimate binary weights \(\mathbf{B}_w\),
