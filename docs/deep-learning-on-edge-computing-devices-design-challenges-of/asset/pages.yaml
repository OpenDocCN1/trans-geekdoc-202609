    # ### 7.4.4 Real-time analysis of video images


    Besides the remote sensing applications, which are our primary motivation, we
    also evaluate the DANoC hardware for real-time video processing. In this experiment
    a DANoC hardware prototype is mounted on a toy robot car for automatic driving
    (Fig. 7.12). The robot car has two 640–480 video cameras connected with the hardware
    board via respective USB ports. One camera is used to track the road, and the
    other is used to recognize 12 traffic signs. The video streams are captured and
    thresholded as binary frames using software running on the ARM host processors.
    Then the image frames are split as 16-16 (road) and 32-32 (traffic sign) windows
    with 8-pixel step size, and the images are arranged as binary streams and routed
    to the DANoC coprocessor for feature extraction and classification. The classification
    results are then sent back to the host processor to automatically control the
    toy robot car.


