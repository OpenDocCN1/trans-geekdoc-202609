    The host ARM processors are responsible for parsing a deep network and controlling
    the transfer of input and configuration data to the coprocessor. The coprocessor
    is implemented on programmable logic and interfaces with the host processors via
    the AXI bus. Input data are encoded as address events and streamed into the coprocessor,
    one data word per clock cycle. Data words are organized as an array, with data
    words streamed in one row at a time. These data words can be pixels in case of
    images or videos. The DDR memory controller interfaces the pipelines with external
    memory. Its purpose is to route independent data streams and feed data to the
    DANoC pipelines. The router is implemented as a crossbar switch, allowing the
    coprocessor to access multiple memory buffers at once with full-duplex data transactions.


