    divergence rule as

    +   \(w_{ij} \Leftarrow w_{ij} + \epsilon (\langle v_i h_j \rangle_{\text{data}}
    - \langle v_i h_j \rangle_{\text{model}})\)

    +   \(b_j \Leftarrow b_j + \epsilon (\langle h_j \rangle_{\text{data}} - \langle
    h_j \rangle_{\text{model}})\)

    +   \(c_i \Leftarrow c_i + \epsilon (\langle v_i \rangle_{\text{data}} - \langle
    v_i \rangle_{\text{model}}),\)

    +   where \(\epsilon\) is a learning rate, and \(\langle \cdot \rangle_{\text{model}}\)
    is the expectation over the reconstruction data;

    +   2: Update \(w_{ij}\) using the gradient of \(\mathcal{R}_s(\mathbf{W})\) as

    +   \(w_{ij} \Leftarrow w_{ij} - \lambda (\gamma \frac{w_{ij}}{\alpha + \sqrt{\sum_i
