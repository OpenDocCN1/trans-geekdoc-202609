  md: 'can fetch the data to the Conv unit per clock once F rows of ifmaps arrive.
    Otherwise, if the architecture is not streaming, then we can also load F rows
    of ifmaps from the intermediate cache per clock. In this case, we can further
    increase \(R_i\) to improve the system bandwidth. For example, in the first cycle,
    we can set \(R_i\) to 56 when \(F\) is 3 and the size of ifmap is \(28 \times
