    # 9.2.3 Data embedding via convolution operation


    In this subsection, we focus on estimating the deterministic sensing matrix. As
    shown in [11], the convolution operation can be seen as a linear embedding operation.
    Let W ∈ R^3×3 be a kernel matrix of the compressive convolutional layer, and let
    X ∈ R^P×Q be any channel of the input image data. Given N = P × Q, X can be vectorized
    and represented as x ∈ R^N. Since the convolution operation ⊗ in the convolutional
    neural network only consists of first-order multiplications, it can be reformulated
    as a linear'
