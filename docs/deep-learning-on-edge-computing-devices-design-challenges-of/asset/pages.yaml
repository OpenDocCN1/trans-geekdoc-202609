    where both the number of connected layers and the number of channels transmitted
    can be significantly reduced. Technically, Eq. (5.10) is adopted as a regularization
    term and incorporated in the loss function. By minimizing the loss function during
    the training process the redundant lateral connections that have weights of near-zero
    values can be pruned off, which improves both computation and memory efficiency.


    # 5.3.3 Loss function


    One challenge of binarizing full-precision deep neural networks is the shift of
    output distribution caused by low-precision quantization. To address this challenge,
    we propose to take advantage of Knowledge Distillation (KD) [5], which uses the
    full-precision baseline *teacher* model to help to train the *student* binary
    neural network. More specifically, to optimize the lateral connections of the
    CBN-Net, the difference of the output distributions between the teacher model
    and student model is formulated as the following loss function:


    \(\mathcal{L}_{\text{KD}} = \rho \mathcal{L}_{\text{KL}}(\widehat{\mathbf{Y}}^{s_\theta},
    \widehat{\mathbf{Y}}^{t_\theta}) + (1 - \rho) \mathcal{L}_{\text{CE}}(\widehat{\mathbf{Y}}^{s_\theta},
    \mathbf{Y}^g),\)


    where \(\widehat{\mathbf{Y}}^{s_\theta}\) and \(\widehat{\mathbf{Y}}^{t_\theta}\)
    are the soft labels generated by the student model \(s_\theta\) and teacher model
    \(t_\theta\), respectively, \(Y^g\) is the ground truth label, and \(\rho\) is
    the soft ratio, which controls the weight between these two losses. Technically,
    the Kullback–Leibler (KL) divergence is used in our research to define the first
    loss of \(\mathcal{L}_{\text{KL}}\), and the Cross-Entropy (CE) is used to define
    the second loss of \(\mathcal{L}_{\text{CE}}\). Before writing the \(\mathcal{L}_{\text{KD}}\)
    in detail, we first define the softmax output of a deep neural network as


    \(\hat{p}_d = \frac{e^{\hat{y}_d/T}}{\sum_{d=1}^D e^{\hat{y}_d/T}},\)'
