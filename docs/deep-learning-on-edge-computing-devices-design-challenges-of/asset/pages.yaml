    # 4.4.4 Efficiency improvement


    From the perspective of reducing computational complexity, when the neural network
    was implemented in a bitwise way, a lower code rate led to linearly fewer bitwise
    operations. Taking the 8-bit fixed-point representation as an example, each fixed-point
    operation could be implemented by 8 bitwise operations, and if we cut off 1 bit,
    then the number of operations could be reduced by 12.5%. In addition, by reducing
    a single bit the hardware source requirement was also reduced by 12.5% when it
    was implemented using dedicated hardware. Generally, compared with the 32-bit
    activations representation, the bitwise bottlenecks could improve the computational
    efficiency by more than 6.4 times without hurting the performance of the deep
    neural network. Besides, considering the weights were quantized to 8-bit, the
    computational efficiency improvement could reach 25.6 times.


    From the perspective of reducing memory occupation, reducing the activation code
    rate linearly reduced the memory requirement. The activation of a standard neural
    network was usually represented by 32-bit floating-point, which occupied 4 bytes
    of memory. However, the bitwise bottlenecks could compress them to fewer than
