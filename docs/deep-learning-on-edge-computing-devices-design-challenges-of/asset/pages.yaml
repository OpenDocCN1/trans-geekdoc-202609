    # ## 4.2 Rate-distortion theory and sparse encoding


    Recently, there has been growing interest in applying information theory to deep
    neural network activation compression. By interpreting the deep neural network
    as a lossy data compression approach, the black box of the deep neural network
    may be opened, and its performance can be optimized by the tool of the rate-distortion
    theory, which is widely applied in the area of telecommunications [15].


    # ### 4.2.1 Rate-distortion theory


    Let the random variable \(\mathbf{X}^{(l)} \in \mathbb{R}^{P \times Q \times K}\)
    be the floating-point neural network activation tensor associated with the \(l\)th
    layer, where \(P\), \(Q\), \(K\) are respectively the height, width, and number
    of feature maps at the \(l\)th layer. The common quantization function \(\mathcal{Q}\)
    can be written as


    ```

    \(\hat{\mathbf{X}}^{(l)} = \mathcal{Q}(\mathbf{X}^{(l)}),\) \tag{4.1}

    ```


    where \(\hat{\mathbf{X}}^{(l)}\) is the fixed-point representation of the floating-point
    activation. The goal of lossy data compression is to achieve minimal distortion
    given the constraint of the maximum code rate. Let \(g\) be the function that
    indicates the number of bits of the given data. According to the rate-distortion
    theory, the typical lossy data compression approach attempts to minimize the distortion
    function \(d\) given the maximum number of bits \(\eta\) as


    ```

    \(\min_{\mathcal{Q}(\cdot)} \mathbb{E}(d(\mathbf{X}^{(l)}, \mathcal{Q}(\mathbf{X}^{(l)})))
    \quad \text{s.t. } \mathbb{E}(g(\hat{\mathbf{X}}^{(l)})) \le \eta.\) \tag{4.2}

    ```


    In practice, the quantization function \(\mathcal{Q}\) is nondifferentiable and
    non-convex due to its integer output, which makes Eq. (4.2) difficult to solve.
    Different from typical rounding-based quantization approaches that settle for
    suboptimal solutions, this chapter attempts to find the optimal solution by reformulating
    Eq. (4.2) as a sparse coding problem.


    # ### 4.2.2 Activation quantization via bitwise bottleneck encoding


    In practice, we could approximate the solution of Eq. (4.2) using a training sample
    set. Assume \(\mathbf{X}_i^{(l)} \in \mathbb{R}^{P \times Q \times K}\) is the
    floating-point activation tensor'
