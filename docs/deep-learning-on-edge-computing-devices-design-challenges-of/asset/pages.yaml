    Figure 2.4 Schematic diagram of convolutional operation receptive field.


    problems. Such a kind of network structure has obvious defects when facing large-size
    image input. The fully connected structure between hidden layers leads to a sharp
    increase in network parameter numbers, which not only greatly reduces the training
    speed, but also may lead to overfitting of the network and greatly damage the
    model performance. The fitting accuracy can be improved by increasing the number
    of network layers, but with the increase in the number of layers, problems such
    as gradient vanishing are easy to appear, making it difficult for the network
    to train convergence.


    Patterns of image recognition by human brain have been found to be instructive
    for the improvement of the structure of artificial neural networks. The human
    brain first perceives each local feature in the picture and then performs a higher
    level of integration to obtain global information. This is to make use of the
    sparse connectivity of the observed objects in the image, that is, local pixels
    in the image are closely related, whereas the correlation between pixels that
    are further apart is weak. Like the human brain, we only need to perceive local
    features of an image at the hidden layers and then integrate the local information
    at a higher layer to recognize a complete image.


    In recent years, it has been found that the convolution operator, which is widely
    used in the field of signal processing, can complete such a process. For one-dimensional
    time series signals, convolution is a special integral operation. When extended
    to a two-dimensional image, a matrix called convolutional kernel will be used
    to replace a signal participating in convolution in the one-dimensional case [7].
    We have each convolutional kernel in the hidden layer connected to only one local
    area of the input data, and the spatial size of the connection is called the receptive
    field of the neuron.'
