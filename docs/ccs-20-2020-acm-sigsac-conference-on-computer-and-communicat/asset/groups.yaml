    \( Accuracy = \frac{TP+TN}{TN+TP+FN+FP} \)


    TP 表示真阳性，TN 表示真阴性。表 3 的第 4~6 列显示检测准确性数据。第 4 列的数据表明，VAHunt 在所有情况下对应用虚拟化引擎检测的结果都是完美的：没有误报，也没有漏报。在此步骤中，VAHunt
    提取对 Intents 的所有操作以生成 Intent 状态机，因此 VAHunt 在这里的性能取决于可用 Intents 的数量。应用虚拟化引擎检测带来的运行时间平均约为
