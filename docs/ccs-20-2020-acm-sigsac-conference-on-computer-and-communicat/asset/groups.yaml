    ![](img/e3eb3c6e62eebb62c8dd83ec4ab9835d_3_0.png)


    Figure 3: Starting the plugin’s Activity by wrapping/unwrapping “TargetActivity”
    with “StubActivity”.


    **Shared UID.** Typically, each app installed on the Android system is assigned
    a unique UID according to its package name. Users cannot install two copies of
    the same APK file on a single device because of the UID restriction. As shown
    in Figure 2’s app-virtualization environment, although the host app and plugin
    apps are running in different processes (pid 100~300), they share the same UID
    (uid 100). As a result, different plugins also have the same list of permissions
    with the host app.


    **Excessive Permissions.** Host apps have to apply for a plethora of permissions
    to satisfy the plugin’s permission demand as much as possible. For example, VirtualApp
    allows for up to 186 permissions by default, and the average number is 129 in
    app-virtualization-based apps [17], while a benign app applies for 5 permissions
    on average [36]. Apparently, excessive permissions violate the principle of least
    privilege. A plugin is free to use all permissions that the host app applies,
    even if it declares zero permission.


    **Predefined Stub Components.** The plugin app’s components are not registered
    in the host app’s manifest file beforehand, because the host app cannot predicate
    the specific component names of plugin apps. The host app solves this problem
    by predefining a set of stub components in its manifest file. For example, VirtualApp
    creates 100 stubs for each of the four components by default.


    **Component Lifecycle Management.** The host app must interact with the Android
    system to maintain the lifecycle of plugin app components. Taking Activity component
    as an example, we show how the host app manages the component lifecycle by using
    predefined stub components and hooking Android system service APIs in Figure 3.
    For example, app-virtualization hooks ActivityManagerProxy by reflection to rewrite
    other functions like “handleLaunchActivity”. Intent is a runtime binding mechanism
    that can connect two different components and transmit data in IPC processes.
    When a plugin starts an Activity (1) in Figure 3, the host app first intercepts
    “startActivity” method to encapsulate the plugin app’s “TargetActivity” intent
    into the intent of “StubActivity” (2). “StubActivity” has been predefined in the
    host app’s manifest file. In this way, the host app can deceive Activity Manager
    Service (AMS) server into creating a new activity for “StubActivity” (3). Then,
    the host app recovers the real Intent of “TargetActivity” by hooking “handleLaunchActivity”
    API of ApplicationThread class and callbacks of ActivityThread class (4). At last,
    the plugin app’s Activity component will be launched successfully (5). The processes


    of handling Service, Content Provider, and Broadcast Receiver for plugin apps
    are similar. In VAHunt’s detection method, we represent the proxy layer’s intent
    encapsulation behavior (as shown in Figure 3) as a finite state machine model.


    # 2.2 Security Threat Study of App-Virtualization


    Despite the popularity of app-virtualization-based apps in Android market, researchers
    have realized the security problems caused by this new technical progress. Recent
    works have thoroughly studied its security threats [14–18]. Shi et al. [17] shows
    that the current app-virtualization design introduces serious “shared-everything”
    threats to users, which makes severe attacks such as permission escalation and
    privacy leak become tremendously easier. The concurrent work by Zhang et al. [16]
    conducts a systematic study with 32 popular app-virtualization frameworks. The
    authors find that the new app-virtualization technique introduces seven common
    security risks. Moreover, they highlight that malware has abused the app-virtualization
    as an “alternative and easy-to-use repackaging mechanism”.


    To inform users that an app is running in an untrusted app-virtualization environment,
    Plugin-Killer [14] and DiPrint [17] independently develop an Android SDK, which
    contains a set of dynamic detection features. App developers that wish to avoid
    having their services hosted into an app-virtualization environment can embed
    Plugin-Killer or DiPrint in their own code. However, app-virtualization-based
    apps are not necessarily malware; these dynamic detection heuristics cannot distinguish
    malicious apps from benign ones, and their usages are strictly limited when detecting
    malware that does not load any third-party plugins.


    Zhang et al. [16] propose a simple heuristic to detect repackaged malware armored
    by app-virtualization. They suppose that the host app loads malicious plugins
    and at least one benign plugin at run time; they observe that the certificate
    of the host app is different from that of the benign plugin. However, this certificate
    comparison method is biased by a very small number of malware samples that Zhang
    et al. analyzed. In our large-scale evaluation, only 0.3% of malware samples comply
    with Zhang et al.’s observation. Therefore, a comprehensive study on app-virtualization
    repackaged malware is necessary and of great practical significance.


