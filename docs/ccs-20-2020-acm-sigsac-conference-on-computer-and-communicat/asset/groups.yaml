    ## VAHunt：身披应用虚拟化外衣，防御新型重新打包的Android恶意软件


    Luman Shi†

    武汉大学

    snowmanlu@whu.edu.cn


    Jiang Ming*

    阿灵顿德克萨斯大学

    jiang.ming@uta.edu


    Jianming Fu*†

    武汉大学

    jmfu@whu.edu.cn


    Guojun Peng†

    武汉大学

    guojpeng@whu.edu.cn


    Dongpeng Xu

    新罕布什尔大学

    dongpeng.xu@unh.edu


    Kun Gao

    武汉安恒信息技术

    gaokun@antiy.cn


    Xuanchen Pan

    武汉安恒信息技术

    tompan@antiy.cn


    ## 摘要


    将流行良性应用与恶意载荷重新打包，曾经是传播Android恶意软件最常见的方式。然而，自2016年以来，我们观察到Android生态系统中出现了一种令人担忧的新趋势：越来越多的Android恶意软件样本利用最新的应用虚拟化创新作为一种新的分发渠道。应用虚拟化使用户能够在单个设备上运行同一应用的多个副本，数千万用户正在享受这一便利。然而，网络犯罪分子将各种恶意APK文件重新打包为插件，嵌入应用虚拟化平台，该平台能够灵活地启动任意插件，无需安装的麻烦。这种新的重新打包风格通过将植入的恶意载荷隐藏在插件中，获得了绕过反恶意软件扫描器的能力，它也违背了现有重新打包应用检测解决方案所体现的基本前提。


    由于基于应用虚拟化的应用不一定都是恶意软件，本文旨在在运行前对它们做出判定。我们的深入研究得出两个关键观察：1）插件应用与Android框架之间的代理层是应用虚拟化机制的核心，它揭示了有限状态转换的特征；2）恶意软件通常会隐蔽地加载插件并隐藏恶意行为。这些洞察促使我们开发一种名为VAHunt的两层检测方法。首先，我们设计一种有状态检测模型，以识别APK文件中应用虚拟化引擎的存在。其次，我们执行数据流分析以提取指纹特征，以区分恶意和良性加载策略。自2019年10月以来，我们在安恒AVL移动安全（一家领先的移动安全公司）中测试了VAHunt，用于检测超过139K个基于应用虚拟化的样本。与真实情况相比，VAHunt实现了0.7%的假阴性率和零假阳性率。我们的自动化检测使安全分析人员免于逆向工程的负担。


    ## CCS 概念


    - 安全与隐私 → 软件逆向工程。


    ACM 参考格式：

    Luman Shi, Jiang Ming, Jianming Fu, Guojun Peng, Dongpeng Xu, Kun Gao, 和 Xuanchen
    Pan. 2020. VAHunt: Warding Off New Repackaged Android Malware in App-Virtualization’s
    Clothing. 在《2020年ACM计算机与通信安全会议论文集》（CCS ’20）中，2020年11月9–13日，虚拟举办，美国。ACM，纽约，纽约，美国，15页。https://doi.org/10.1145/3372297.3423341


    ## 1 引言


    为了诱骗移动用户在其设备上下载恶意应用，恶意软件开发者始终在寻求规避安全措施并潜入移动应用市场的方法。分发Android恶意软件的常见方式曾经是重新打包合法应用
    [1–3]。通常，攻击者通过反编译原始APK并在分发前添加恶意载荷来劫持良性应用的逻辑；用户被欺骗安装重新打包的恶意软件，因为他们相信自己正在运行原始应用。然而，自2016年以来，我们观察到一种令人不安的新趋势，即恶意软件利用最新的应用虚拟化进展作为一种新的重新打包实践，这使得恶意软件分发比其他传统方法更容易、更隐蔽。


    在应用虚拟化解决方案中，宿主应用通过创建系统服务代理，在Android框架之上提供一个虚拟环境。因此，宿主应用可以直接启动其他


    ![](img/e3eb3c6e62eebb62c8dd83ec4ab9835d_1_0.png)


    图 1：流行的应用虚拟化应用和引擎。


    APK 文件，称为客户应用或插件，无需安装即可启动。类似于重新打包，应用虚拟化也以插件的形式添加额外代码，这会影响宿主应用的执行逻辑。这种新技术已应用于各种应用，并获得了数千万用户
    [4]。图 1 列出了一些基于应用虚拟化的流行应用以及两个开源虚拟化引擎（VirtualApp [5] 和 DroidPlugin [6]）。应用虚拟化的一个突出优势是允许单个设备同时运行同一应用的多个实例
    [7]，例如在一部手机上运行两个WhatsApp账户。凭借这一创新，所谓的“双实例”应用 [8] 在各个应用市场中非常流行；下载量最大的一个，Parallel
    Space [4]，在 Google Play 上拥有超过1亿次下载。此外，使用应用虚拟化的开发者还可以偏爱模块化编程 [9]，减小APK文件大小 [10]，并绕过单个DEX字节码文件的65,535
    方法限制 [11]。例如，图 1 中的360安全应用包含多个功能模块（例如，内存清理器、智能性能增强器和防病毒扫描器），它们都以插件形式存在以供加载和使用，降低了各模块之间的耦合。


    然而，正如预期的那样，网络犯罪分子从未花费太长时间就跟上最新技术趋势；他们已利用应用虚拟化来悄悄地重新打包和加载恶意插件。例如，安全专家发现，木马 PluginPhantom
    的新版本已从使用传统重新打包风格演变为使用应用虚拟化 [12]：它将每个恶意功能实现为一个插件（例如，拦截来电和上传被盗数据），并利用应用虚拟化平台来调度和控制其插件。这样一来，PluginPhantom
    实现了在不重新安装应用的情况下更新其模块的更大灵活性。此外，其所有恶意载荷插件都进一步加密，以阻碍静态分析。结果，只有虚拟化框架的可执行代码是静态可见的，这给行业当前的反病毒引擎带来了巨大挑战。另一个例子是恶意软件
    HummingBad，它曾在2016年全球感染了超过1000万台Android设备。HummingBad 的新变体已卷土重来，使用 DroidPlugin
    [6] 进行比其前身更高效的广告欺诈。在 Google 安全团队将其从 Play Store 中移除之前，已有20个被 HummingBad 感染的 Android
    应用被下载超过1200万次 [13]。我们的恶意软件追踪研究还证实，自2017年第二季度以来，基于应用虚拟化的恶意软件的增量已超过重新打包的恶意软件，且差距持续扩大（见图
    4(b)）。这种新重新打包风格的快速传播表明，应用虚拟化将成为下一代Android恶意软件分发渠道。


    不幸的是，在面对新的基于应用虚拟化的重新打包恶意软件时，现有防御技术不足以应对。要理解并击败这一新兴威胁，仍需付出巨大努力。近期工作专注于应用虚拟化造成的安全威胁
    [14–18]。它们揭示了应用虚拟化的底层机制，并强调应用虚拟化环境并不安全。由于共享UID，攻击者可以轻松注入恶意代码并悄悄地实施各种攻击，例如特权升级、隐私泄露和钓鱼。PluginKiller
    [14] 和 DiPrint [17] 均提出了在运行时检测应用虚拟化环境的可行方案。然而，这些动态检测启发式方法主要用于保护当良性应用被宿主应用作为插件加载时的安全。基于应用虚拟化的重新打包恶意软件，如
    PluginPhantom 或 HummingBad，是一个自包含的系统，不会加载任何第三方插件。此外，所有恶意载荷插件要么被加密（例如，PluginPhantom），要么在程序开始运行后从互联网下载（例如，HummingBad）。因此，试图检查恶意载荷插件的静态分析也变得徒劳。Zhang
    等人的研究 [16] 表明，基于应用虚拟化的重新打包恶意软件可以有效地逃避反病毒扫描器以及依赖于测量代码/接口布局相似性的现有重新打包应用检测 [19–23]。


    为了帮助安全分析人员和应用市场维护人员击败披着应用虚拟化外衣的恶意软件威胁，本文探讨了其内部机制，以便在运行前对基于应用虚拟化的应用做出判定。我们的深入研究得出两个关键观察。首先，插件应用与Android框架之间的代理层（即虚拟化引擎）是应用虚拟化机制的核心；它创建系统服务代理，并使用预定义的桩组件包装插件组件以维护插件生命周期。尽管实现各异，代理层通过插件与系统服务之间的进程间通信（IPC）中的
    Intent 包装/解包传输数据，这种常见行为揭示了有限状态转换的特征。其次，为了隐藏恶意活动，恶意应用通常会在没有任何用户交互的情况下隐蔽地加载和执行插件，这被称为“自我隐藏行为”
    [24]。


    这些洞察促使我们开发一种两层检测方法。首先，我们设计一种有状态检测模型，以识别APK文件中应用虚拟化引擎的存在。具体来说，我们将使用预定义桩组件包装插件应用Intent的行为抽象为有限状态机（FSM）模型。然后，我们提取所有可达的Intent相关FSM及其关联的桩组件，以检查它们是否与参考模式匹配。其次，我们执行数据流分析以提取隐蔽加载和应用隐藏策略，以区分恶意软件和良性软件。基于FlowDroid
    [25]，我们分析与路径API和文件对象相关的数据流和调用图。我们总结了四个加载策略特征，以区分恶意基于应用虚拟化的应用和良性应用。如果一个应用既揭示了应用虚拟化引擎，又揭示了隐蔽加载特征，我们将其视为基于应用虚拟化的恶意软件样本。


