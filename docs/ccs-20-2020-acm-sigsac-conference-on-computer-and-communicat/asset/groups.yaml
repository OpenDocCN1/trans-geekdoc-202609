    The novelty of our design is to detect malicious app-virtualization-based apps
    from a new standpoint: the way that the virtualization engine loads plugins is
    a prominent malware feature, even if the plugin''s APK file is encrypted or will
    be downloaded from Internet at run time. We developed our two-layer detection
    model as an open-source tool, named VAHunt. Since October 2019, VAHunt has been
    deployed into Antiy AVL Mobile Security [26] to evaluate its accuracy of malware
    detection. We have tested VAHunt with 139K app-virtualization apps, and VAHunt
    shows a very high accuracy with 0.7% false negatives and zero false positive.
    The small false negatives come from several game fraud apps, which have an interface
    to allow game fraudsters to modify game properties. In a nutshell, we make the
    following three major contributions:


    +   - Although repackaged Android malware via app-virtualization has been on the
    rise for a while now, limited research work studies the specific countermeasures.
    We hope our in-depth study paints a cautionary tale for the security community
    on this imminent threat.

    +   - We zoom in on the inner mechanisms of this new threat and unveil a two-layer
    detection model, which detects the presence of app-virtualization engine and the
    self-hiding loading strategies of malware. Our work offers a viable solution to
    avoid app-virtualization repackaged malware sneaking into Android app stores.

    +   - We have evaluated the efficacy of our prototype, VAHunt, in an anti-malware
    production environment. To inspire other researchers to explore more comprehensive
    defensive strategies, we release VAHunt''s source code at https://github.com/whucs303/VAHunt.


    # 2 BACKGROUND & RELATED WORK


    In this section, we first present the background information needed to understand
    the Android app-virtualization technique. Then, we summarize the existing work
    on the security threat study of app-virtualization and their limitations. At last,
    we introduce the work most germane to our detection methodology.


    # 2.1 Technical Basics of App-Virtualization


    In computing, virtualization generally refers to techniques that run virtual machines
    on versatile platforms [27]. Besides the common hypervisor-based virtualization
    like VMWare [28] and QEMU [29], app-virtualization is used to isolate individual
    apps from the underlying Android OS and other apps [30–33]. Since 2015, app-virtualization
    emerges as a new technique that can load arbitrary third party APKs without installation
    and modification. The host app creates a virtual environment for plugin apps by
    dynamic proxy, and it relies on API hooking and binder proxy to bypass system
    service restrictions. The host app hooks API invocations of plugin apps so that
    the Android system thinks that all API requests and components are from the host
    app. Meanwhile, the host app predefines stub components and permissions for plugin
    apps, and it encapsulates plugin components in stub components at run time. In
    this way, multiple instances of the same app are able to bypass the UID restriction
    and run simultaneously.


    Please note that the dynamic code loading (DCL) [34, 35] sounds similar to the
    app-virtualization technique because both of them


    ![](img/e3eb3c6e62eebb62c8dd83ec4ab9835d_2_0.png)


    # Figure 2: App-virtualization architecture. The host app and plugin apps run
    in different processes but share with the same unique user id (UID).


    can load extra code. However, the DCL mostly invokes the methods in an APK file
    and cannot support the component lifecycle, while app-virtualization represents
    a more advanced technique to load a whole APK file. This paper focuses on the
    app-virtualization techniques represented by VirtualApp [5] and DroidPlugin [6].
    Two related research tools, Boxify [30] and NJAS [31], have been obsolete in Android
    6.0 and later versions. Shi et al. [17] have compared them with VirtualApp/DroidPlugin
    and summarized the limitations of Boxify and NJAS, such as lacking compatibility
    and robustness. We attribute the rise of app-virtualization-based malware to the
    power and availability of the new techniques represented by VirtualApp/DroidPlugin.


    VirtualApp and DroidPlugin are the two most popular app-virtualization engines.
    They both support running multiple copies of the same app on a single device.
    Although the implementation details are of little difference^1, their key design
    ideas are quite similar. Figure 2 outlines a typical app-virtualization architecture.
    The host app provides an independent execution space for each plugin app; it loads
    multiple plugins with different process IDs, but they share the same UID with
    the host app. The core of app-virtualization is a proxy layer (a.k.a. virtualization
    engine), which locates between plugin apps and the Android framework. The proxy
    layer heavily relies on hooking mechanisms to deceive both Android system services
    and plugins. For example, it hooks ClassLoader to load plugin’s DEX file, and
    it hooks IPC to maintain the lifecycle of the plugin app’s components. In particular,
    an app-virtualization framework reveals the following common mechanisms.


    1 DroidPlugin uses Service to realize IPC between the host app and plugins, while
    VirtualApp adopts ContentProvider, which is more suitable and concise for synchronous
    IPC.'
