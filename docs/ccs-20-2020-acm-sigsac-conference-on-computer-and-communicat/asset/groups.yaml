    # 6.2 Decision Rules


    We take stealthy plugin loading and app hiding actions as malicious behaviors
    because they violate the Google Developer Content Policy [43]. As shown in Figure
    7, the malware host app could load plugins from a customized path (1) or load
    a benign app to attack it from a system path (2). Considering an app may contain
    an app-virtualization engine but never uses it, features (1) and (2) are used
    to confirm that the host does indeed load plugins using the app-virtualization
    engine. Based on that, most malware host apps install their malicious plugins
    silently without users’ consent (3), leaving no visible footprints in the user
    interface. We define a decision rule, silentinstall, to detect the malicious loading
    strategy. silentinstall’s formula is: (1) OR (2) AND (3). As long as an app reveals
    an app-virtualization engine and silentinstall, VAHunt labels it as the app-virtualization-based
    malware. In addition, we also interested in malware that takes more stealthy actions
    by hiding icons or Activities after installation (4) in Figure 7, which we represent
    as silentinstall+, and its formula is: silentinstall AND (4). In our evaluation,
    we also measure malware exhibiting silentinstall+ behavior. If an app hides application
    but does not install plugins stealthily, we report it as a suspicious case.


