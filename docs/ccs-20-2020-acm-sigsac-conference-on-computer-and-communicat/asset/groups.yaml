    | VirtualApp | Benign | 93.5% | 6.5% | 0 | 0 |

    | VirtualApp | Malware | 99.6% | 0.4% | 99.3% | 7.6% |

    | DroidPlugin | Benign | 90.2% | 9.8% | 0 | 0 |

    | DroidPlugin | Malware | 99.9% | 0.1% | 98.7% | 11.7% |

