    onCreate()），我们就停止追踪 API 调用链。当用户同意加载插件时，他们通常会点击屏幕上的按钮或项目。因此，我们收集从插件安装开始的调用链，并查看其是否包含
    onClick() 或 onItemClick()。如果调用链到达应用入口但未显示任何用户交互，这意味着宿主应用正在静默加载插件。我们还在附录 §B 中处理了调用链分析中的线程中断问题。


    ### 6.1.4 隐藏应用


    安装后，良性应用会将其图标添加到主屏幕，以便用户下次使用。然而，恶意软件实例倾向于隐藏自身并在后台运行，不显示任何图标或 Activity。因此，用户在屏幕上看不到任何
    GUI。恶意软件要么修改清单文件以将应用从默认启动器中移除，要么调用


    ### 6.2 决策规则


    我们将隐蔽的插件加载和应用隐藏行为视为恶意行为，因为它们违反了 Google 开发者内容政策 [43]。如图 7 所示，恶意软件宿主应用可以从自定义路径加载插件
    (1)，或从系统路径加载良性应用来攻击它 (2)。考虑到一个应用可能包含应用虚拟化引擎但从不使用它，特征 (1) 和 (2) 用于确认宿主确实使用应用虚拟化引擎加载插件。在此基础上，大多数恶意软件宿主应用会在未经用户同意的情况下静默安装其恶意插件
    (3)，在用户界面中不留任何可见痕迹。我们定义一个决策规则 silentinstall 来检测恶意加载策略。silentinstall 的公式为：(1) OR
    (2) AND (3)。只要一个应用揭示了应用虚拟化引擎和 silentinstall，VAHunt 就会将其标记为基于应用虚拟化的恶意软件。此外，我们还关注图
    7 中在安装后通过隐藏图标或 Activity 采取更隐蔽行为的恶意软件 (4)，我们将其表示为 silentinstall+，其公式为：silentinstall
    AND (4)。在评估中，我们还测量表现出 silentinstall+ 行为的恶意软件。如果一个应用隐藏了应用但没有静默安装插件，我们将其报告为可疑案例。


    ## 7 评估


    我们在 §5.1 中介绍了对 APK 文件的预处理。我们使用 AAPT [40] 和 dexdump [41] 来提取 VAHunt 所需的必要信息。VAHunt
    的原型包括两个组件：应用虚拟化引擎检测器和恶意加载策略检测器。VAHunt 的整条链路共有 7,052 行 Python 代码。我们的所有实验都在一台配备
    Intel Core i9-8950HK 处理器和 32GB 内存、运行 Windows 10 Pro 的笔记本电脑上进行。我们的评估旨在回答三个研究问题：


    - **RQ1**: VAHunt 对基于各种虚拟化引擎（例如 VirtualApp、DroidPlugin 和自定义引擎）构建的基于应用虚拟化的应用检测准确率如何？

    - **RQ2**: VAHunt 进一步区分恶意和良性基于应用虚拟化的应用的准确率如何？

    - **RQ3**: VAHunt 与现有动态和静态解决方案相比表现如何？


    ### 7.1 数据集


    我们的测试用例包括三个数据集来评估 VAHunt 的检测准确率。就我们所知，我们的评估是迄今为止测试基于应用虚拟化应用的最大规模评估。


    ### 官方标记的基于应用虚拟化的样本。


    自 2019 年 10 月以来，我们已将 VAHunt 部署到安恒 AVL 移动安全 [26]（一家领先的移动安全公司）以评估其检测准确率。截至撰写本文时，我们已测试了
    139,358 个基于应用虚拟化的样本，这些样本由安恒 AVL 在三年内通过动态/静态方法和手动逆向工程收集。基准真实数据集中大多数良性应用来自主要应用市场，例如
    Google Play、1Mobile Market、腾讯应用宝和 360 手机助手。许多基于应用虚拟化的恶意软件样本已被从 Google Play 下架
    [44–46]。起初，基于应用虚拟化的恶意软件样本是受害者报告的，因为它们绕过了恶意软件检测引擎。安全分析人员手动逆向工程这些样本以提取动态和静态检测特征。给定一个可疑样本，AVL
    的威胁检测引擎首先使用机器学习模型来匹配相似的语法特征向量。如果它没有相似的静态特征，AVL 引擎将运行每个样本 5 到 10 分钟以检测恶意或可疑行为，例如插件进程活动和网络流量。然而，44.4%
    的基于应用虚拟化的应用没有本地插件，51.8% 的插件具有触发条件。对于在运行时未显示可疑行为的未知恶意软件，安全分析人员必须手动逆向工程样本。通常，经验丰富的安全分析人员需要
    25 到 50 分钟来剖析一个基于应用虚拟化的应用。AVL 数据集准确但成本高昂。


    将这 139,358 个标记样本作为基准真实数据集，VAHunt 关注应用虚拟化的内部机制，并在运行前提供一个可行的检测引擎。根据底层虚拟化引擎，我们将这些样本分为三类：VirtualApp
    [5]、DroidPlugin [6] 和自定义引擎。我们在每个类别中检测良性和恶意应用，具体数量显示在表 3 的第 2~4 行。由于 VirtualApp
    和 DroidPlugin 在 GitHub 上开源，开发者和攻击者可以以低成本重用其源代码；其中一些人甚至修改源代码来生成自定义引擎。请注意，在总共 81,225
    个基于 VirtualApp 的应用中，多达 77.2% 是恶意软件样本，这表明 VirtualApp 受到恶意软件作者的更好接受。另一个有趣的观察是，总共有
    4,320 个样本被加壳，但其中 4,276 个来自良性应用。我们将恶意软件的低加壳比率归因于应用虚拟化机制已经提供了一层


