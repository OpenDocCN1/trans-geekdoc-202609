    Table 5: Most app-virtualization-based apps either do not store plugins locally
    or encrypt plugins.


    | Category | No Plugin | Encrypted Plugin | Plain-text Plugin¹ |

    | :--- | :--- | :--- | :--- |

    | benign | 76.8% | 3.7% | 19.5% |

    | malicious | 10.5% | 89.2% | 0.3% |


    ¹Plain-text plugins are APK files that are not encrypted.


    the installed plugins, but all of them show user interactions. However, for app-virtualization-based
    malware, VAHunt introduces about 0.7% false negatives. Upon further investigation,
    all of these false negatives come from game fraud apps. Game fraud apps load both
    game modifiers and game apps in an app-virtualization environment, and they have
    an interface to allow game fraudsters to customize and modify different game properties
    for quick upgrades. Therefore, game fraud apps exhibit user interactions and violate
    the stealthy loading strategy. As the customers of game fraud apps are quite limited,
    we argue that missing the detection of game fraud apps is not a hard limit for
    VAHunt.


    Next, we zoom in on the loading strategy characteristics and decision rules to
    distinguish malicious apps from benign ones. Table 4 shows the percentage of different
    loading behaviors in our test cases. Most host apps load plugins from customized
    paths, but benign app-virtualization apps use more system paths than malware.
    Especially for the popular dual-instance apps, all of them load third-party apps
    (e.g., social media apps and game apps) that have been installed on the system.
    The “silentInstall” column demonstrates that no any benign apps would install
    their plugins silently. Please note that the “silentInstall+” column indicates
    that about 10% of malware variants take more aggressive actions to conceal plugins
    and themselves: in addition to the plugin silent installation, they also hide
    app icons and Activities, posing a huge challenge for users to perceive abnormals.
    Table 5 shows the plugin status in app-virtualization-based apps. Apparently,
    how to store plugins stands in stark contrast between app-virtualization-based
    malware and benign apps. Most benign apps choose to download plugins dynamically
    to reduce the APK file size. On the contrary, the majority of malware apps store
    encrypted plugins in Assets directory for the convenience of distribution.


    ### 7.4 Comparison with Existing Solutions


    We compare VAHunt with SafetyNet Attestation API [49], Plugin-Killer [14], DiPrint
    [17], and Zhang et al.’s work [16]. The first three tools are used to detect the
    app-virtualization environment dynamically; as they require developers to add
    their detection methods in the app code, we use 147 dual-instance apps to load
    three home-made plugins that embed these three tools, respectively.


    **SafetyNet Attestation API [49].** Google SafetyNet is an advanced anti-abuse
    API. They allow developers to determine whether their apps are running on a genuine
    Android device. SafetyNet’s “basicintegrity” testing can identify the signs of
    a rooted device, emulator, and API hooking. Our result shows that SafetyNet’s
    “basicintegrity” can detect all of the 147 dual-instance apps’ environments dynamically,
    but it is not fit for detecting app-virtualization-based malware that does not
    load any third-party plugins.


    **Plugin-Killer [14] & DiPrint [17].** Plugin-Killer and DiPrint are specifically
    developed to detect the app-virtualization environment with a set of heuristics,
    such as undeclared permissions and multiple processes with the same UID. These
    two tools also successfully recognize all of the 147 dual-instance apps’ environments,
    but they are much faster than SafetyNet—SafetyNet takes a few more seconds to
    download detection code from the server. Plugin-Killer and DiPrint have the same
    limitation with Google SafetyNet: they cannot distinguish malicious app-virtualization-based
    apps from benign ones. By contrast, VAHunt bridges this gap.


    **App in the Middle [16].** At the time of writing, the only related research
    work to detecting app-virtualization-based malware is Zhang et al.’s work [16].
    They detect the different certificates between the host app and the benign plugin.
    We also test the accuracy of Zhang et al.’s work in our large-scale evaluation.
    Although their simple detection heuristic is fast (0.6s on average), the last
    column of Table 3 shows that their detection accuracy is not acceptable. Only
    0.3% of malware samples comply with Zhang et al.’s observation: the host app loads
    malicious plugins and at least one benign plugin, and the certificate of the host
    app is different from that of the benign plugin. The encrypted plugins in the
    host app’s subsidiary prevent the extraction of the certificate. Furthermore,
    this certificate comparison method mislabels all tested dual-instance apps as
    malware. Dual-instance apps load third-party applications (e.g., WhatsApp) to
    enrich user experience, and the certificate of the host app is of-course different
    from the plugin’s certificate.


    **Overhead.** The running time imposed by VAHunt’s two-layer detection is about
    6.9s and 12.1s on average. Including the pre-processing time, VAHunt completes
    the analysis for each APK file within 30 seconds in our evaluation. The performance
    bottleneck lies in the multi-round data flow analyses to detect the stealthy loading
    strategy. Considering VAHunt is an automated detection to free security professionals
    from the burden of reverse engineering efforts, VAHunt’s overhead is acceptable.


    ## 8 DISCUSSION & FUTURE WORK


    Our work tackles the challenge of detecting app-virtualization repackaged malware
    prior to run time, but we argue that our results show the challenge is not insurmountable.
    Our large-scale evaluation in the production environment demonstrates that VAHunt
    is an appealing technique to complement existing malware defenses. However, VAHunt
    shares the same limitations with the Android static analysis methods [50–52].
    Attackers can encrypt strings in the code (e.g., logs and common strings) to complicate
    static analyses. In VAHunt’s design, we need to match the component names extracted
    from the Intent state machine with that of pre-defined stub components. We argue
    that component names in the manifest are hard to be encrypted because the Android
    system needs to correctly recognize them to manage the component’s lifecycle;
    otherwise, it may lead to an app crash. But if the stub component string in code
    is encrypted, we cannot match it with that in the manifest. If the malware’s installation
    is concealed beneath an onClick() callback, semantic analysis is required to analyze
    the context of the button [53]. Using reflection or implementing function in native
    code could also interrupt call graph generation of VAHunt. A packed app is another
    long-standing challenge to any static detection methods. If the host app is packed,
    it will impede VAHunt’s analysis from the very beginning. Like what we did in
    our evaluation, the best practice is to use VAHunt and a generic unpacking tool
    together.


    Detecting malware features at run time has a better resistance against code obfuscation.
    We also explore the direction of detecting app-virtualization repackaged malware
    dynamically using similar features with VAHunt. First, we can capture the plugin
    intent wrapping behavior by API hooking. We use Xposed [54] to hook related APIs
    that are used to wrap the plugin’s intent (e.g., loadDex), setClassName(), getComponent(),
    and setType(), and we search the values of live program variables to find the
    reference Intent state machine pattern like Figure 6(a). Second, to detect the
    stealthy loading strategy at run time, we run the samples in the experiment environment
    and observe whether it has the silentInstall behavior. However, dynamic detection
    also suffers from the limited path coverage and dynamic analysis environment evasions.
    The Triada variant shown in Figure 9 is such a counterexample against dynamic
    detection, because it is a remote C&C server to control Triada’s activities. Without
    meeting the trigger condition, we cannot observe Triada’s loading plugin behavior
    dynamically.


    ## 9 CONCLUSION


    Recently, cybercriminals abuse app-virtualization as a new repackaging way, and
    malware distribution turns out to be much easier and stealthier than ever before.
    In this paper, we focus on the inner mechanism of this new threat and study the
    unique features caused by app-virtualization-based malware. We develop VAHunt,
    a two-layer detection method: 1) we first detect app-virtualization engines in
    APK files with a stateful model; 2) we conduct data flow analysis to further determine
    stealthy plugin loading strategies. We have deployed VAHunt into a top anti-virus
    company to test more than 139K app-virtualization-based samples. Our large-scale
    evaluation shows that VAHunt reveals very small false negatives and zero false
    positive. VAHunt significantly reduces the workload of security analysts. We hope
    the open-source VAHunt inspires more countermeasures against this new generation
    of repackaged Android malware.


    ## ACKNOWLEDGMENTS


    We sincerely thank CCS 2020 anonymous reviewers for their insightful and helpful
    comments. This research was supported in part by the National Natural Science
    Foundation of China (61972297, U1636107) and the National Science Foundation (NSF)
    under grant CNS-1850434.

