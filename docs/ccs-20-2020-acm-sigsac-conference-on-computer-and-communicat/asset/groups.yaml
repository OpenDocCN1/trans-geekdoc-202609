    ### 双实例应用。


    由于双实例应用允许用户加载任意 APK，它们是评估应用虚拟化环境检测工具（例如 Plugin-Killer [14] 和 DiPrint [17]）的理想案例。这些工具仅在嵌入到插件代码时才生效。我们从
