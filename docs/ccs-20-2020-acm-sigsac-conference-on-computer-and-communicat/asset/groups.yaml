    # 6.1.3 User Consent.


    Typically, benign app-virtualization apps require users to click installation
    buttons or pop up dialogs to acquire users'' consent at the plugin installation
    time. However, most app-virtualization-based malware samples load their malicious
    plugins without any user interaction from the very beginning. To detect the non-existence
    of user clicks, we first locate the plugin installation interface and then trace
    backward from the interface to the startup of an app. The app startup is usually
    the component with "android.intent.category.LAUNCHER" label in the manifest file.
    If we find that the beginning of plugin installation is in the component lifecycles
    (e.g., onCreate() of Activity), we stop chasing the API call chain. When users
    agree to load plugins, they often click buttons or items on the screen. So we
    collect the call chain from the plugin installation and see whether it includes
    onClick() or onItemClick(). If the call chain reaches the application entrance
    but showing no user interaction, that means the host app loads the plugin silently.
    We also deal with thread interruption problem in the call chain analysis in Appendix
    §B.


    # 6.1.4 Hide Application.


    After installation, benign apps add their icons to the home screen for users''
    convenience of the next use. However, malware instances tend to hide themselves
    and run in the background without showing any icon or Activity. As a result, users
    cannot see any GUI on the screen. Malware either modifies manifest file to remove
