    已安装的插件，但它们都会显示用户交互。然而，对于基于应用虚拟化的恶意软件，VAHunt 会引入大约 0.7% 的假阴性。经过进一步调查，所有这些假阴性都来自游戏欺诈应用。游戏欺诈应用在应用虚拟化环境中加载游戏修改器和游戏应用，并提供一个界面，允许游戏欺诈者自定义和修改不同的游戏属性以实现快速升级。因此，游戏欺诈应用表现出用户交互，违反了隐蔽加载策略。由于游戏欺诈应用的客户群非常有限，我们认为遗漏对游戏欺诈应用的检测并非
    VAHunt 的硬性限制。


    接下来，我们深入探讨加载策略特征和决策规则，以区分恶意应用和良性应用。表 4 显示了测试用例中不同加载行为的百分比。大多数宿主应用从自定义路径加载插件，但良性应用虚拟化应用使用的系统路径比恶意软件更多。特别是对于流行的双实例应用，它们都加载了系统上已安装的第三方应用（例如，社交媒体应用和游戏应用）。“silentInstall”列表明，没有任何良性应用会静默安装其插件。请注意，“silentInstall+”列表明，大约
    10% 的恶意软件变体采取更激进的措施来隐藏插件和自身：除了插件静默安装之外，它们还隐藏应用图标和 Activities，给用户感知异常带来巨大挑战。表 5
    显示了基于应用虚拟化的应用中的插件状态。显然，基于应用虚拟化的恶意软件和良性应用在插件存储方式上形成鲜明对比。大多数良性应用选择动态下载插件以减小 APK
    文件大小。相反，大多数恶意软件应用将加密插件存储在 Assets 目录中，以便于分发。


    ### 7.4 与现有解决方案的比较


    我们将 VAHunt 与 SafetyNet Attestation API [49]、Plugin-Killer [14]、DiPrint [17] 以及
    Zhang 等人的研究 [16] 进行了比较。前三种工具用于动态检测应用虚拟化环境；由于它们要求开发者在应用代码中添加检测方法，我们使用 147 个双实例应用分别加载三个嵌入了这三种工具的自制插件。


    **SafetyNet Attestation API [49]。** Google SafetyNet 是一个高级反滥用 API。它允许开发者确定其应用是否在真实的
    Android 设备上运行。SafetyNet 的“basicintegrity”测试可以识别已 root 设备、模拟器和 API 钩子的迹象。我们的结果表明，SafetyNet
    的“basicintegrity”可以动态检测所有 147 个双实例应用的环境，但它不适用于检测不加载任何第三方插件的基于应用虚拟化的恶意软件。


    **Plugin-Killer [14] & DiPrint [17]。** Plugin-Killer 和 DiPrint 专门开发用于通过一组启发式方法（例如，未声明的权限和具有相同
    UID 的多个进程）来检测应用虚拟化环境。这两种工具也成功识别了所有 147 个双实例应用的环境，但它们比 SafetyNet 快得多——SafetyNet
    从服务器下载检测代码需要多几秒钟。Plugin-Killer 和 DiPrint 与 Google SafetyNet 有相同的局限性：它们无法区分基于应用虚拟化的恶意应用和良性应用。相比之下，VAHunt
    弥补了这一差距。


    **App in the Middle [16]。** 撰写本文时，检测基于应用虚拟化的恶意软件的唯一相关研究工作是 Zhang 等人的研究 [16]。他们检测宿主应用和良性插件之间的不同证书。我们还在大规模评估中测试了
    Zhang 等人研究的准确性。尽管其简单的检测启发式方法很快（平均 0.6 秒），但表 3 的最后一列显示，其检测准确率不可接受。只有 0.3% 的恶意软件样本符合
    Zhang 等人的观察：宿主应用加载恶意插件和至少一个良性插件，且宿主应用的证书与良性插件的证书不同。宿主应用附属组件中的加密插件阻止了证书的提取。此外，这种证书比较方法将所有测试的双实例应用都标记为恶意软件。双实例应用加载第三方应用程序（例如，WhatsApp）以丰富用户体验，且宿主应用的证书当然与插件的证书不同。


    **开销。** VAHunt 两层检测所产生的运行时间平均约为 6.9 秒和 12.1 秒。包括预处理时间，VAHunt 在我们的评估中在 30 秒内完成每个
    APK 文件的分析。性能瓶颈在于用于检测隐蔽加载策略的多轮数据流分析。考虑到 VAHunt 是一种自动化检测，旨在让安全专业人员摆脱逆向工程工作的负担，VAHunt
    的开销是可以接受的。


    ## 8 讨论与未来工作


    我们的工作解决了在运行时之前检测基于应用虚拟化的重新打包恶意软件的挑战，但我们认为我们的结果表明这一挑战并非不可逾越。在生产环境中的大规模评估表明，VAHunt
    是一种吸引人的技术，可用于补充现有的恶意软件防御。然而，VAHunt 与 Android 静态分析方法 [50–52] 有相同的局限性。攻击者可以加密代码中的字符串（例如，日志和常用字符串）来复杂化静态分析。在
    VAHunt 的设计中，我们需要将从 Intent 状态机提取的组件名称与预定义的存根组件匹配。我们认为，清单文件中的组件名称难以被加密，因为 Android
    系统需要正确识别它们来管理组件的生命周期；否则，可能导致应用崩溃。但是，如果代码中的存根组件字符串被加密，我们就无法将其与清单文件中的匹配。如果恶意软件的安装隐藏在
    onClick() 回调下方，则需要语义分析来分析按钮的上下文 [53]。使用反射或在本地代码中实现函数也可能中断 VAHunt 的调用图生成。加壳应用是任何静态检测方法面临的另一个长期挑战。如果宿主应用被加壳，它将从一开始就阻碍
    VAHunt 的分析。就像我们在评估中所做的那样，最佳实践是将 VAHunt 与通用脱壳工具一起使用。


    在运行时检测恶意软件特征对代码混淆具有更好的抵抗力。我们还探索了使用与 VAHunt 类似的特征动态检测基于应用虚拟化的重新打包恶意软件的方向。首先，我们可以通过
    API 钩子捕获插件 Intent 包装行为。我们使用 Xposed [54] 钩取用于包装插件 Intent 的相关 API（例如，loadDex），setClassName()、getComponent()
    和 setType()，并搜索实时程序变量的值，以查找类似于图 6(a) 的参考 Intent 状态机模式。其次，为了在运行时检测隐蔽加载策略，我们在实验环境中运行样本并观察其是否具有
    silentInstall 行为。然而，动态检测也面临路径覆盖有限和动态分析环境逃避的问题。图 9 所示的 Triada 变体就是针对动态检测的一个反例，因为它是一个用于控制
    Triada 活动的远程 C&C 服务器。如果不满足触发条件，我们就无法动态观察 Triada 加载插件的行为。


    ## 9 结论


    最近，网络犯罪分子将应用虚拟化滥用为一种新的重新打包方式，恶意软件分发变得比以往任何时候都更容易且更隐蔽。在本文中，我们关注这种新威胁的内部机制，并研究基于应用虚拟化的恶意软件引起的独特特征。我们开发了
    VAHunt，一种两层检测方法：1）我们首先使用有状态模型检测 APK 文件中的应用虚拟化引擎；2）我们进行数据流分析以进一步确定隐蔽的插件加载策略。我们已将
    VAHunt 部署到一家顶尖的反病毒公司，测试了超过 139K 个基于应用虚拟化的样本。我们的大规模评估表明，VAHunt 的假阴性非常低，且假阳性为零。VAHunt
    大大减轻了安全分析人员的工作量。我们希望开源的 VAHunt 能激发更多针对这一新一代重新打包的 Android 恶意软件的对策。


    ## 致谢


    我们谨感谢 CCS 2020 匿名评审人提出的富有洞察力和有帮助的意见。这项研究部分得到中国国家自然科学基金（61972297, U1636107）和美国国家科学基金会（NSF）在
    CNS-1850434 资助下的支持。


