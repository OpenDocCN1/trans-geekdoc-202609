    # ## 1 INTRODUCTION


    To lure mobile users into downloading malicious apps on their devices, malware
    developers are always seeking to evade security measures and sneak into mobile
    app marketplaces. A common way to distribute Android malware used to be repackaging
    legitimate apps [1–3]. Generally, attackers hijack a benign app’s logic by de-compiling
    the original APK and adding malicious payloads before distribution; users are
    fooled into installing the repackaged malware because they believe that they are
    running the original app. However, since 2016, we have observed a disturbing new
    trend that malware capitalizes on the latest app-virtualization progress as a
    new repackaging practice, which causes malware distribution to become easier and
    stealthier than other traditional approaches.


    In an app-virtualization solution, the host app provides a virtual environment
    on top of the Android framework by creating system service proxies. As a result,
    the host app can directly launch other'
