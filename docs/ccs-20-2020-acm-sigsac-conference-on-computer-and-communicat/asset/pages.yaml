    Figure 1: Popular app-virtualization apps and engines.


    APK files, called guest apps or plugins, without the trouble of installation.
    Similar to repackaging, app-virtualization also adds extra code in the form of
    a plugin, which affects the execution logic of the host app. This new technique
    has been applied to a variety of applications and gains tens of millions of users
    [4]. Figure 1 lists some popular app-virtualization-based apps and two open-source
    virtualization engines (VirtualApp [5] and DroidPlugin [6]). An outstanding advantage
    of app-virtualization is to allow a single device to run multiple instances of
    the same app simultaneously [7], such as running two WhatsApp accounts on one
    phone. Powered by this innovation, the so-called “dual-instance” apps [8] are
    all the rage in various app markets; the most-downloaded one, Parallel Space [4],
    has more than 100 million downloads on Google Play. Besides, developers using
    app-virtualization can also favor modular programming [9], reduce the APK file
    size [10], and bypass the 65,535 methods limitation of a single DEX bytecode file
    [11]. For example, the 360 Security app in Figure 1 includes multiple function
    modules (e.g., memory cleaner, smart performance booster, and anti-virus scanner),
    and they all exist as plugins to load and use, reducing the coupling of each module.


    However, as would be expected, it never takes cybercriminals long to catch on
    to the latest technique trend; they have utilized app-virtualization to repackage
    and load malicious plugins silently. For example, security experts find that the
    new version of Trojan Plug-inPhantom has evolved from using traditional repackaging
    style to app-virtualization [12]: it implements each malicious function as a plugin
    (e.g., intercept incoming phone calls and upload stolen data) and utilizes an
    app-virtualization platform to schedule and control its plugins. In this way,
    PluginPhantom achieves more flexibility to update its modules without reinstalling
    apps. Besides, all of its malicious payload plugins are further encrypted to frustrate
    static analysis. As a result, only the executable code of the virtualization framework
    is statically visible, posing a huge challenge for the current anti-virus engines
    in the industry. Another example is malware HummingBad, which once infected over
    10 million Android devices worldwide in 2016. HummingBad’s new variant has resurfaced
    with using DroidPlugin [6] to perform the advertising fraud even more efficiently
    than its predecessor. 20 Android apps infected by HummingBad were already downloaded
    by over 12 million times before the Google Security team removed them from the
    Play Store [13]. Our malware tracing study also confirmed that the increment of
    app-virtualization-based malware has exceeded repackaged malware since the second
    quarter of 2017, and the gap


    keeps growing (see Figure 4(b)). The rapid propagation of this new repackaging
    style indicates that app-virtualization will become the next generation of Android
    malware distribution channel.


    Unfortunately, existing defense techniques are insufficient in the face of new
    app-virtualization-repackaged malware. Significant efforts remain to be done to
    understand and defeat this emerging threat. Recent work focuses on the security
    threats caused by app-virtualization [14–18]. They demystify the underlying mechanism
    of app-virtualization and highlight the app-virtualization environment is not
    secure. Due to the share of UID, adversaries can inject malicious code easily
    and conduct various attacks stealthily, such as privilege escalation, privacy
    leak, and phishing. Both PluginKiller [14] and DiPrint [17] have presented viable
    solutions to detect app-virtualization environment at run time. However, these
    dynamic detection heuristics are mainly used to protect benign apps when they
    are loaded by host app as plugins. The app-virtualization-repackaged malware,
    like PluginPhantom or HummingBad, is a self-contained system that does not load
    any third-party plugins. Moreover, all of malicious payload plugins are either
    encrypted (e.g., PluginPhantom) or downloaded from Internet after the program
    starts running (e.g., HummingBad). Therefore, static analyses that attempt to
    inspect malicious payload plugins become futile as well. Zhang et al.’s study
    [16] demonstrates that app-virtualization-repackaged malware can effectively evade
    both anti-virus scanners and existing repackaged app detections that rely on measuring
    code/interface-layout similarities [19–23].


    To help security analysts and app market maintainers to defeat malware threats
    armored by app-virtualization, in this paper, we explore the inner mechanism to
    make a verdict on app-virtualization-based apps prior to run time. Our in-depth
    study results in two key observations. First, the proxy layer (i.e., the virtualization
    engine) between plugin apps and the Android framework is the core of app-virtualization
    mechanism; it creates system service proxies and wraps the plugin components with
    pre-defined stub components to maintain the plugin lifecycle. Despite the various
    implementations, the proxy layer transmits data via Intent wrapping/unwrapping
    in the IPC (Inter-Process Communication) between plugins and system services,
    and this common behavior reveals the feature of finite state transitions. Second,
    to conceal malicious activities, malware apps typically load and execute plugins
    stealthily without any user interactions, which is the so-called “self-hiding
    behavior” [24].


    These insights motivate us to develop a two-layer detection approach. First, we
    design a stateful detection model to identify the existence of an app-virtualization
    engine in APK files. In particular, we abstract the behavior of wrapping the plugin
    app’s Intent with the predefined stub component as a finite state machine (FSM)
    model. Then, we extract all reachable Intent-related FSMs with their associated
    stub components to check whether they match with the reference pattern. Second,
    we perform data flow analyses to extract stealthy loading and app hiding strategies
    to differentiate between malware and benign ones. Based on FlowDroid [25], we
    analyze the data flow and call graph that are related to path APIs and file objects.
    We summarize four loading strategy features to distinguish malicious app-virtualization
    apps from benign ones. If an app reveals both an app-virtualization engine and
    stealthy loading features, we take it as a sample of app-virtualization malware.'
