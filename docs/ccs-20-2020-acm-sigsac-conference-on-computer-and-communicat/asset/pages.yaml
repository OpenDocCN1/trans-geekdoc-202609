    # 6.1.1 Load Plugin from Customized Path.


    The premise of loading plugins in the virtual environment is to know where plugin
    APKs locate. Most app-virtualization-based malware samples, such as self-contained
    systems, knows their plugins in advance and loads them directly from a customized
    location, which includes the public storage that all app can access (e.g., SDCard)
    and the private data area of the host app, such as Assets subdirectory. Even if
    plugins are downloaded from the Internet at run time, they are still stored in
    these locations. The host app gets plugin APK paths either by invoking common
    Android path APIs or from hard-coded APK paths. The recent work has summarized
    22 Android path APIs [42], and we classify them into five categories by different
    storage locations in Table 2. We analyze call graphs related to these path APIs
    to search corresponding file objects. After getting the file objects, we further
    determine whether they are installed by app-virtualization. Generally, app-virtualization
    provides an installation interface for the host app to install plugins. Developers
