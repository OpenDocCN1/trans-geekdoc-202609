    # 6 LOADING STRATEGY DETECTION


    Given the identification of app-virtualization-based apps, another problem rears
    its head. We need to further differentiate between malware and benign apps. Unlike
    the traditional repackaged malware that can be detected by measuring code/interface-layout
    similarities [19–23], most app-virtualization-based malware samples encrypt their
    malicious plugins to deter static analyses. To overcome this challenge, we study
    how malware host apps load plugins silently and hide them after installation.
