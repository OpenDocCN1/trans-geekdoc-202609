  md: '# TABLE 8.9

    Error Handling Methods


    | Methods | Description |

    |---|---|

    | assert (bool condition) | If the condition is not satisfied, an invalid operation
    code is caused by the method call and any changes to the state get reverted. |

    | require (bool condition) | If the condition is not satisfied, this method call
    is reverted back to the original state. |

    | require (bool condition, string memory message) | For errors in inputs or external
    components, this method is used. If the condition is not satisfied, this method
    is reverted back to the original state. |

    | revert () | This method reverts the changes done to the state and aborts the
    execution. |

    | revert (string memory reason) | This method reverts the changes done to the
    state, aborts the execution, and provides an option for custom message. |


    executes on an EVM. Solidity has its similarities with other advanced programming
    languages like C, Python, and JavaScript. Most of its values and operator types
    are similar to C, with a few additional. Its control statements and functions
    are written like JavaScript. It supports data structures such as enum, array,
    struct, string, and mapping. OOP concepts like inheritance are present, which
    are useful for code reusability. Lastly, it also supports various libraries, complex
    user-defined data types, and several other features. In solidity, a contract plays
