  md: '# 5.8 APPLICATIONS OF BLOCKCHAIN TECHNOLOGY


    Applications of the blockchain technology are as diverse as it can get. Blockchain
    can revolutionize almost every sector of an economy as it is a very generic technology
    that can be adapted to suit the needs of a given sector/company. Few of the applications
    of this technology in different sectors are mentioned below. This is definitely
    not an exhaustive list, and many more uses, both major and minor, of this technology
    can also be explored.


    # 5.8.1 Product Authentication


    This is one area in retailing where end customer can get full life history of
    the product that he intends to purchase. This history includes details right from
    the manufacturing process to where the product got quality clearance, to packaging
    and shipping so that the customers can be sure about the authenticity of the product.
    In this day and age when fake and counterfeit products resemble the original ones,
    it can be very hard to differentiate between the two. Customers can make informed
    decision based on their choice and need. It will also help customers know the
    age of the product⁶ as all the information is available on the network.


    # 5.8.2 Creative Industry and Academics


    In the fields of creativity (such as art, music, and allied areas), intellectual
    expression (such as books), and intellectual property, the blockchain technology
    can serve as a big boon. The conventional system works in such a way that a major
    portion of the proceeds from the sale of music, books, etc. goes to other parties
    than the creator. The creator gets their royalty proceeds which is a small portion
    of the actual proceeds. Putting your product directly on the blockchain network
    would enable to create a direct link between creators and customers. The product
    can then be linked with smart contracts where it would automatically credit the
    proceeds from the sale of the product from the blockchain. The smart contracts
    can be designed in a way that would not only make the product secure but also
    more readily accessible to anyone who wants it with instant payment to the creator.
    Imogen Heap put her song “Tiny Human” on blockchain and has been a vocal advocate
    for this technology.


    # 5.8.3 Voting and Governance


    One of the best uses of the blockchain technology given that it runs on the principle
    of consensus is to strengthen democracy per se by putting the electoral process
    on blockchain. The world over, there are allegations of influential political
    entities of tampering with the electoral process and rigging the election in favor
    of their candidate. In a democracy, the process of election is crucial because
    that is when'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'people elect their representatives to voice their issues on larger platforms.
    A compromised election means that the people’s representation also gets compromised.
    If the electoral process is put on blockchain, then the details of the event would
    be running on multiple nodes simultaneously. Everything ranging from the contestant’s
    profile, to address of booth, to the number of voters in that constituency, to
    number of votes garnered by each candidate would be reflected on multiple nodes
    simultaneously. This digression from the centralized system would lead to more
    democracy in the democratic process. More centralized control over elections would
    lead to more vulnerability to the whole electoral exercise. However, it wouldn’t
    be wise to shift to blockchain overnight in matters as important as elections
    because the pitfalls of such a transition are still unknown. Few pilot projects
    should be run first to assess the efficiency of the technology, readiness of voters,
    digital infrastructural issues, etc. before expanding it in a phase-wise manner.


    # ### 5.8.4 Storage and Movement of Assets


    All asset classes ownerships, i.e., real and financial assets such as land entitlements,
    stocks/debentures of companies, and patents, can be put on the blockchain. One
    issue that cryptocurrencies faced earlier was the problem of double spending.
    Double spending would lead the currency to become unusable because it makes no
    sense if one pays someone Rs 10 and he still has it with him. Once a party spends
    a certain amount, he should lose the hold of that and the counterparty should
    receive the same. Bitcoin overcame this double spending problem through time-stamping
    each transaction and passing the information of all the transactions on every
    node. Similar to Bitcoin, any asset of value can be put on a blockchain. It would
    help rightful owners escape from the scourge of document counterfeiters. Not only
    would it be helpful to rightful owners to obtain loans against their asset but
    also save scarce resources unproductively wasted in years of litigation. The advantage
    of this information being on blockchain is that not only it holds the name of
    its current owner/custodian but one can go back and trace the previous owners
    as well. All change of hands of any asset can be well preserved in the blockchain.


    # ### 5.8.5 Link Service Provider Directly with Customers


    The cab aggregator service, policy aggregator service, hotel aggregator services,
    etc. charge a portion of the total amount paid by the customer as service fee,
    which provides for the maintenance of their infrastructure digital and otherwise,
    labor charges, etc. However, if all the information is available on the blockchain
    network, then the need of these aggregator intermediaries would go away. Blockchain
    can facilitate a direct link between service providers and customers benefitting
    both of them.


    # ### 5.8.6 Blood Group and/or Organ Donor List


    A publically available ledger of people with their blood groups on the blockchain
    network itself would be a lifesaver. Patients need blood all the time for various
    reasons mostly those with severe blood loss in an accident. Some blood groups
    are'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'hard to find because of its rarity; hence, such a list would help locate donors
    nearby. A similar list of organ donors and receivers can be put on the blockchain
    to help execute a match.


    # 5.8.7  Arresting Distribution Leakages


    Many governments run welfare schemes for noble causes such as poverty alleviation,
    food security, and help in times of natural disasters, but a lot of their benefits
    never reach the intended beneficiaries. The blockchain technology can be a great
    way to improve public distribution system and arrest leakages in it. A lot of
    such schemes don’t achieve the intended result just because of a broken distribution
    system, and at the same time, it leaves affected people with a sense of dissatisfaction
    and anger with their political dispensation.


    Blockchain as a technology is here to stay and its application, while might not
    be used on a mass scale today but with improvement in the product and more awareness,
    would eventually appeal to users. It would certainly fail in some pilot projects
    and might achieve modest success in others, but with the passage of time and improvement
    in technology, and increase in computation power, it will ultimately make lives
    easier.


    # CONCLUSION


    The rise of Bitcoin has been phenomenal within a short span of time where the
    value of one Bitcoin reached close to a million and a half U.S. dollar at its
    peak. After witnessing the success of a crypto-based digital currency, other alternative
    crypto coins entered the fray too. All this currency does is removing the need
    to trust other parties/intermediaries involved in the transaction. It is a digital
    architecture with peer-to-peer cash transfer system embedded in it. Everyone on
    the network is a witness to the transaction; hence, it is available in the public
    domain with almost no likelihood of alteration. The technology behind this system
    of financial transaction *sans* intermediaries is called blockchain. The blockchain
    technology with its advantages promises to touch almost every sector ranging from
    retail to medical. It is gaining a firm footing in many sectors, while other sectors
    have adopted a wait-and-watch policy for some time. Only time will tell how big
    a disruption would be caused by the blockchain technology, it is interesting to
    note that it has already come a long way in a span of a decade.


