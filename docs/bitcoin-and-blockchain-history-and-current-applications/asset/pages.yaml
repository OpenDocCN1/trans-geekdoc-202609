  md: '# 8.5.1 LOOP


    Loops are used where the repetition of some codes is required; it is programmed
    using for, while, or do while. For example,


    ```

    while (condition)

    {

    /*

    These statements within these curly braces will execute

    repeatedly until the condition fails

    */

    }

    ```


    Likewise, for and do while loops are used.


    # 8.5.2 DECISION-MAKING


    Decision-making tools are required to determine distinct paths based on particular
    conditions. In Solidity, if, else, or else if are used for decision-making. For
    example,


    ```

    if (condition_1)

    {

    //Execute statements of this block

    //Ignore all other else if or else belonging to this if

    }

    else if (condition_2)

    {

    //Execute statements of this block

    //Ignore all other else if or else belonging to this if

    }

    ...

    //Multiple else if are possible

    else //Works only if all the above if or else if condition fails

    {

    //Execute statements of this block

    }

    ```


    # 8.6 DATA STRUCTURES


    # 8.6.1 ARRAY


    Often, we have discussed arrays as a data type, but categorically it is a data
    type that stores a collection of data [8]. Hence, an array is a collection of
    variables applying to the same data type. In an array, a search operation is usually
    linear time associated, as for each additional record the search time increases
    slightly. Generally, array in solidity is of two types: fixed array and dynamic
    array.'
