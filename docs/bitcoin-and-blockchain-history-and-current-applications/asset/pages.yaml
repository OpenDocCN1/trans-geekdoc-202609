    minds of investors as a “necessary evil,” i.e., they don’t trust them fully, but
    there are no other alternatives to their services. Not only did Nakamoto propose
    an alternative to these financial intermediaries through his peer-to-peer network
    of electronic cash system, but he also asserted that it would not incur any additional
    service fee or commission for investors for its services (Figure 5.1).


