    # 12.3.2.7 Peer Gossip


    Peers use gossip to transmit ledger and channel information. Gossip communication
    is continuous and every peer on a channel receives from multiple peers constantly
    current and reliable ledger information. A message or transaction, which is being
    communicated in the network, is signed to prevent unwanted targets from transmitting
    the messages. Peers affected by delays, network partitions, or other triggers
    that lead to missed blocks must finally be synchronized to the present ledger
    state by communicating with its neighboring peers.


    The three functions performed during this communication process are:


    +   - Step 1: Managing peer discovery and channel membership by continuous recognition
    of active member peers and gradually detection of off-line peers.

    +   - Step 2: Disseminates leader information on a network across all peers. With
    the rest of the channel, each peer with data out of sync detects and synchronizes
    the missing blocks by copying the correct data.

    +   - Step 3: By allowing peer-to-peer transmission of ledger information to be
