    # 3.3.1  Structure of a Block


    A typical blockchain has six key layers. They are (i) data layer, (ii) network
    layer, (iii) consensus layer, (iv) incentive layer, (v) contract layer, and (vi)
    application layer. The bottom most layer in the architecture is data layer. It
    consists of blocks that hold a list of all transaction records like conventional
    public ledger. The transaction data can be a token exchange or any kind of information
    exchange over the network. Each block is split into two sections: the header and
    the body. Figure 3.2 displays a block’s basic framework. All transactions are
    kept in the block body, while the block header retains the previous (parent) block
    hash. A block has only one parent. The first block of a blockchain is called a
    “genesis block,” which has no parent block. By using a cryptographic hash, a block
    is recognized and linked to every other block so that the contents of it cannot
    be modified. If an attacker attempts to change the content of a block, their resulting
    hash value will also change the hash values of subsequent blocks. Therefore, if
    any hacker wants to alter a block, he has to change the hash values of all blocks
    in the series, which is practically not possible.


    +   i. Block version: defines what set of rules to follow for block validation.

    +   ii. Merkle root hash tree: hash values of all transactions of the block [2].


