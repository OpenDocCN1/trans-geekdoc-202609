    # 7.6 BYZANTINE FAULT TOLERANCE (BFT)


    The Byzantine Fault Tolerance (BFT) is designed to estimate the reliableness of
    uniformly segregated computing systems. In this process it resolves on components
    breakdown mechanism and result of crashing information is being mitigated by this
    algorithm. Conquering BFT is one of the most pivotal challenges directed by blockchain
    technology. BFT inscribes a mechanism in which two nodes would exchange information
    safely across a digital infrastructure, making sure that they are showcasing the
    same data.


    The vital effect of “Byzantine failure”, it is focussing a component that is a
    server can incoherently give breakdown information by delivering numerous symptoms
    in each period of time. It is the scenario in which active users agree on a strategy
    to avoid complete system failure. BFT [20–22] is also projected as source congruency,
    error avalanche, Byzantine Generals Problem, and Byzantine agreement problem.


    # Byzantine fault tolerance


    +   - Nodes fail arbitrarily

    +     - they lie

    +     - they collude

    +   - Causes

    +     - Malicious attacks

    +     - Software errors

    +   - Seminal work is PBFT

    +     - Practical Byzantine Fault Tolerance, M. Castro and B. Liskov, SOSP 1999


    BFT is conceptualized as a logical conundrum that depicts communication problem
    when they are dwelling upon a common set of problems. The beauty of BFT is, it
    can continue its operation even if certain nodes behave in an abrupt way.'
