  md: '# FIGURE 11.4 Blockchain structure.


    ![](img/115a7d47166d21dfa1d1dc5986da244b_205_0.png)


    Blockchain participants and their roles [9]:


    +   1. Regulating Authority – Blockchain user who is having special permission
    to regulate blockchain transactions. These users will deal with the blockchain
    regulations as per the decided policy. These users are restricted from carrying
    out blockchain transactions.

    +   2. Blockchain Developer – These are the individuals who will develop various
    applications and protocols to carry out blockchain transactions. They are the
    hardcore programmers, and with their programming skills, they provide a suitable
    platform to blockchain users to operate. These are the users who will take care
    of the data sources and blockchain platforms with added skill sets.

    +   3. Blockchain Network Administrators – These are the individuals with network
    administration skills. They are the one who will manage blockchain network administration
    by providing user accessibility to the blockchain resources as per defined policy.

    +   4. Blockchain Users – They are the one who carries blockchain transactions.
    These individuals avail facilities offered by the blockchain architecture to carryout
    blockchain transactions. These users are unaware of the technicalities on offer
    to carry blockchain transactions.

    +   5. Certificate Authorities – As per policy, these individuals will pervade
    the transaction certificates to the users.'
  merge: -1
