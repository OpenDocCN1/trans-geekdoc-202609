    over the network.


    In addition to the solutions discussed above, the use of Anti-Money Laundering
    (AML) regulations and Know Your Customer (KYC) policies with network traffic can
    also improve the quality of the mining process.


    # CONCLUSION


    Data sharing can be achieved across all parts of the network simply by using an
    unstructured P2P network in Bitcoin. Security of Bitcoin networks is dependent
    on the efficiency of PoW-based consensus protocols which allow blockchain to maintain
    a consistent state. Blockchain inconsistencies could lead to effective double
    spending if properly exploited. Therefore, it is important that the Bitcoin network
    stays scalable in terms of size, storage, and bandwidth as it strengthens the
    consensus protocol. Full nodes are active in the P2P network and help to distribute
    data. Conversely, thin clients use an SPV to perform transactions. But as a fact,
    the network still has the general scalability problems of unstructured interfaces
    combined with the issues caused by the Bitcoin protocol itself.


