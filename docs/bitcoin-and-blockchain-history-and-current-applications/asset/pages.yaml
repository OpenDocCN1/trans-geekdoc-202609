    spending as long as one genuine peer is connected to him.


    Another approach is to signal the double spending attack by sending *alert messages*
    on a large number. The idea is that even if the opponent could trick the seller,
    some honest miners will immediately identify the crashing transactions and send
    warning messages over the network.


    # 2.8 DEANONYMIZATION


    Tracking message flows in a network helps to find the user information apart from
    understanding the network. Ref. [6] states that if the transaction is not facilitated
    by an online wallet, the IP address of a transaction can be determined by tracking
    the hub linked to all peers. This, however, disrupts the pseudonymous nature of
    the transactions. The relay patterns observed in Ref. [7] approve the expected
    behavior of the nodes. Based on the results from Ref. [6], the heuristics to match
    the transactions to IP address were developed even if the hub is not fully connected.


    The Onion Router (TOR) [8], an Internet anonymity service, addresses this issue
    of trust by hiding the source node’s IP. The Onion routing protocol is applied
    to a relay of network and thereby separates the sender and receiver information.
    Therefore, the source node’s IP address is hidden, and the destination node can
    only display the address of the last TOR node. Bitcoin can handle the traffic
    through TOR using SOCKS interface. But there is a possibility of banning TOR connection
    in the Bitcoin network, which will lead to exploitation of DoS protection. Other
    than DoS attacks, it can also make the Bitcoin network susceptible to eclipse
    attack and man-in-the-middle attack.


    Even in case of anonymized connections, it is possible to find the transaction’s
    originator by observing the peer’s neighbors serving fingerprints. As shown earlier,
    a client can make a minimum of eight connections and can broadcast the same to
    the neighbors in the network. These eight peers are called “entry nodes.” Associations
    to these input nodes shall be maintained as long as they can be reached. This
    proves that the fingerprints are stable. An intruder can take advantage of this
    fact by generating a fingerprint for an IP address. This can be achieved by incorporating
    the fingerprint on all Bitcoin servers and recording the pairs forwarding the
    IP address. Thus, these peers are the entry nodes for the corresponding IP. Furthermore,
    only a fraction of entry nodes will be seen by an adversary due to the “trickling”
    of *addr* messages. This and the effects of timing can lead to false positives.
    Next, the intruder would be able to map the entry node transactions and thereby
    find the originator of the transaction. A solution proposed to mitigate this issue
    is to turn around the outbound connections. For example, the fingerprint can be
    blurred after'
