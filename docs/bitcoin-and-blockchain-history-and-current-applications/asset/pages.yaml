  md: "# d. Import\n\nSolidity like other languages supports import statements. Importing\
    \ a file here is similar to that of JavaScript. However, the default export is\
    \ not supported.\n\n```\nImport \"filename\";\n```\n\nThis command will import\
    \ all the global variables from the file, filename.\n\n# 8.4  VALUE AND OPERATOR\
    \ TYPES\n\n# 8.4.1  VALUE TYPES\n\nSolidity, like any other language, supports\
    \ many built-in data types. Many value types in solidity are similar to those\
    \ of C++. Let us take a glance at some listed in Table 8.2.\n\n# 8.4.2  VARIABLE\
    \ TYPES\n\n# 8.4.2.1  State Variables\n\nVariables that are declared inside contract\
    \ scope and outside of function scope are called “State variables.” The values\
    \ of state variables are stored permanently in contract storage. An example is\
    \ shown in Figure 8.2.\n\n| Name | Description | Examples |\n|---|---|---|\n|\
    \ string | Sequence of characters | “Hi there!”, “Chocolate” |\n| bool | Boolean\
    \ value | True, False |\n| int | Integer, positive or negative; has no decimal\
    \ | 0, −3000, 59248 |\n| uint | “Unsigned” integer, positive number. Has no decimal\
    \ | 0, 3000, 9857 |\n| fixed/ufixed | “Fixed” point number. Number with a decimal\
    \ after it | 20.001, −42.4242, 3.14 |\n| address | Has methods tied to it for\
    \ sending money | 0x18bae199c8dbae384d |\n\n```\n```solidity\npragma solidity\
    \ ^0.4.17;\ncontract SolTest {\n    uint Data;     // State variable\n    constructor()\
    \ public {\n        Data = 15; // Using State variable\n    }\n}\n```\n```\n\n\
