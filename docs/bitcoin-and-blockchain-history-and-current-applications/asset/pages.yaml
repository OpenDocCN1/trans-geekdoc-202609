- pgno: 9
  md: '# Preface


    Globally, the industries provide employment to about 500 million people from the
    main business sectors which include service, retail, manufacturing, business,
    health care, local and central government, finance sector, etc. All of these sectors
    are made either automatic or semiautomatic by sophisticated business processes
    forming an integral part of the digital economy. In this revolution, the Internet
    plays a vital role in core business, and financial aspects of the digital economy
    are still centralized, with the help of centralized agencies such as banks and
    tax agencies, to authenticate and settle payments and transactions. These centralized
    services often are manual, difficult to automate, and represent a bottleneck to
    facilitating a frictionless digital economy. The blockchain technology, a distributed,
    decentralized, and public ledger, addresses these issues by maintaining records
    of all transactions on a blockchain network that promises a smart world of automation
    of complex services and manufacturing processes.


    A blockchain network is a peer-to-peer network and does not require a central
    authority or trusted intermediaries to authenticate or settle the transactions.
    The first generation of blockchain network was coined by Satoshi Nakamoto in his
    2008 white paper where the primary application of the blockchain network was the
    use of electronic cash or cryptocurrency called Bitcoin. The second-generation
    blockchain network called Ethereum was introduced in 2013. Ethereum allows a single
    programmable blockchain network to be used for developing different types of applications
    where each application takes the form of a smart contract which is implemented
    in a high-level language and deployed on the blockchain network.


    There are very few books that can serve as a foundational text book for colleges
    and universities looking to create new educational programs in the areas of blockchain,
    smart contracts, and decentralized applications. The existing books are focused
    on the business side of blockchain and case study–based evaluation of applications.


    We have edited this book to meet the need at colleges and universities. This book
    can serve as a textbook for senior- and graduate-level courses on the domains
    such as business analytics, finance, Internet of Things, computer science, mathematics,
    and business schools. This book is also dedicated to novice programmers and solution
    architects who want to build powerful, robust, optimized smart contracts using
    solidity, and hyperledger fabrics from scratch.


    This book is organized into 13 chapters.


    Chapter 1, *Bitcoin: A P2P Digital Currency*, presents an overview of digital
    currencies, discusses the Bitcoin transactions and proof of work, reviews the
    Bitcoin security attacks, and illustrates the Bitcoin development environment.


    Chapter 2, *Exploring the Bitcoin Network*, describes the overall process of Bitcoin
    networks like transactions, digital signatures, relay networks, and Bitcoin script.


    Chapter 3, *Blockchain Technology: The Trust-Free Systems*, discusses blockchain
    technology in detail and highlights some of the applications in which it can be
    used. It also specifies some challenges and benefits of this technology that is
    all set to transform the digital world.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Chapter 4, *Consensus and Mining in a Nutshell*, provides an overview of the
    consensus models, narrates the transaction process using consensus, and examines
    the different consensus attacks.


    Chapter 5, *Blockchain: Introduction to the Technology behind Shared Information*,
    discusses the incentive to the miner, attacks, types of blockchain, and blockchain
    impacts in finance and industry sectors.


    Chapter 6, *Growth of Financial Transaction toward Bitcoin and Blockchain Technology*,
    deliberates the introduction to cryptocurrency, and its history and definitions.
    Nevertheless, this chapter also discusses some cybersecurity aspects of blockchain.


    Chapter 7, *A Brief Overview of Blockchain Algorithm and Its Impact upon Cloud-Connected
    Environment*, focuses on blockchain algorithm and its impact upon cloud-connected
    ecosystem.


    The focus of Chapter 8, *Solidity Essentials*, is on briefly understood Solidity
    Language. The need for Solidity is discussed. Its use case and implementation
    are addressed. Details of its environment setup and compilation are also provided.
    Its important components are explained along with examples for a better understanding
    of syntax. By the end of this chapter, the reader will be familiar with Solidity
    and will be able to write smart contracts on it.


    Chapter 9, *Installing Frameworks, Deploying, and Testing Smart Contracts in Ethereum
    Platform*, covers the smart contract programming with a special emphasis on Solidity,
    properties associated with a smart contract account, fetching accounts from Ganache
    module, deployment of smart contracts with Web3 and Infura, testing smart contracts
    with open-source tools such as Remix and Mocha framework for asynchronous testing,
    test coverage reports, and use of any assertion library. Hence, this chapter highlights
    the methods for writing smart contracts using various authoring tools such as
    Visual Studio. However, the easiest and fastest way for developing and testing
    the smart contracts is to use a browser-based tool known as Remix. Next, we write
    few smart contract applications with Solidity language and explain all the common
    function types used in it. The concepts of gas and transactions are thoroughly
    discussed. Lastly, this chapter is laid out in a manner that it helps the reader
    to get the comprehensive idea of writing smart contracts.


    Chapter 10, *Blockchain in Healthcare Sector*, discusses the existing and the
    latest new developments in implementation, challenges, applications, and future
    direction of the blockchain-based systems in healthcare sectors.


    Chapter 11, *Blockchain Theories and Its Applications*, describes the financial
    applications where blockchain provides traceability and transparency to the financial
    transactions, which makes it a unique technology to take care of financial applications.
    Financial applications in the area of banking services, insurance sector – health
    insurance, economic business applications, financial auditing, and cryptocurrency
    payment and exchange are part of discussion. Non-financial applications: health
    care – in healthcare sector, patients’ records should be shared with the healthcare
    stakeholders with confidentiality; blockchain is an effective technology to take
    care of this process. Governance – blockchain technology can serve as a path changer
    for the local and central governments to take care of governance.'
