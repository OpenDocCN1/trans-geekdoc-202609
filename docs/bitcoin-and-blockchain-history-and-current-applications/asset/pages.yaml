    in other blockchains. Later, these transactions are ordered into a block using
    a consensus mechanism. Finally, transaction validation is done using an application-specific
    endorsement policy by all the peers before committing the transaction to the ledger.


    With its new approach of execute-order-validate architecture, Hyperledger Fabric
    is much resilient, flexible, and scalable with enhanced performance and confidentiality
    over other existing blockchains with order-execute architecture. Fabric offers
    a highly configurable architecture. One of the configurational options is pluggable
    consensus. It can be considered as one of the major differentiating features of
    Hyperledger Fabric from other platforms. It drives the platform to be much effective
    and customized to fit diverse enterprise use cases When an enterprise with a trusted
    authority is considered, a simple crash fault tolerant (CFT) [4] consensus is
    much efficient over Byzantine Fault Tolerant (BFT) to avoid unnecessary drag on
    performance and throughput. Fabric doesn’t need a native cryptocurrency for running
    consensus mechanisms like mining and to execute smart contract. The unneeded of
    cryptocurrency and costly cryptographic mining method will reduce the implementation
    and maintenance cost


    Some other modular components of Fabric are pluggable ordering service. Ordering
    service is responsible for ordering the transactions that occurred in a given
    time interval. Pluggable membership service provider is responsible for identification
    and verification of the members transacting in the network with their cryptographic
    identities. Endorsement and validation policies are also pluggable.


    This kind of modular design and features grabs the attention of enterprises convincing
    them to try and build appropriate, efficient permissioned blockchain systems to
    a wide range of industry use cases which include finance, banking, supply chain,
    and many more. The application level flow will be explained in the upcoming sections,
    and in the below section, we will discuss some major components and concepts of
    Hyperledger Fabric.


    # 12.3.2 Hyperledger Fabric Network Concepts and Components


    Hyperledger Fabric [9] network consists of several architectural components and
    concepts associated with them. A network consists of several organizations known
    as members. Through connecting the MSP to the network, an individual enters a
    network. Each MSP has a Certificate Authority (CA) that provides their members
    with cryptographic certificates. Each member may have more than one peer participating
    in the blockchain network representing its organization. These peers in the network
    of different organizations or the same organization form a channel to share a
    ledger. Before diving into how things work on the network, we need to get familiar
    with some keywords, concepts, and components described below:


    # 12.3.2.1 Organization


    Organizations are also known as members. The provenance for a network begins by
    joining organizations to the network. A blockchain network administrator who creates
    a network can invite members into the network. Initially, an organization joins
    the network when its MSP is added to the network. These members participate in
    the network representing their organizations. Organization manages its members
    under a single MSP.'
