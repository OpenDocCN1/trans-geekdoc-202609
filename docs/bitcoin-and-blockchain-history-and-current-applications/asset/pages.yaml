    # 12.2.4 HYPERLEDGER FABRIC


    Hyperledger [1] is an open-source project of blockchains and related software
    released by the Linux Foundation in December 2015, which is backed by IBM. Fabric
    is the most popular project under Hyperledger. IBM is the top contributor to the
