  md: '(ii) a Byzantine Fault Tolerance (BFT). Proof-based consensus algorithm can
    be applied even in private and consortium blockchains, and so is not limited to
    public blockchain.


    # 4.2 PROOF-OF-X (POX) SCHEMES


    # 4.2.1 REACHING CONSENSUS – THE ISSUE OF BYZANTINE GENERALS


    Generally, Bitcoin consensus functions in a distributed way. There is a need for
    some kind of redundancy to guarantee fault tolerance, and the level of redundancy
    relies on the type of failures. For example, assume that three objects hold a
    value, and that one object fails and returns the same incorrect value. It is easy
    to find the failing object by comparing the results and decide on the correct
    value. So, the network requires n≥2f+1 in case of f failures. Nonetheless, failures
    can broadly be malicious or random. These failures are termed as Byzantine Generals
    Problem [6]. The real Byzantine problem is that n generals attempt to decide on
    a battle plan jointly by a messenger. Yet, f generals are traitors trying to break
    the deal. This problem is similar to an attempt to reach consensus by a distributed
    system. With consistent and trustworthy communication, Byzantine Generals Problem
    can achieve consensus [6]. The Fischer–Lynch–Paterson (FLP) proof demonstrates
    that no failures can be tolerated in asynchronous consensus protocol. Bitcoin
    uses randomness in mining process and readjusts it frequently. It does not allot
    any final or fixed peers for the validation process. Rather, it makes a thumb
    rule that transactions can be completed after six confirmations.


    Another technology that directly takes the result of Byzantine agreement is Ripple.
    To build consensus, Ripple uses a group of reliable authorities. It uses a round-based
    consensus to make final decisions. The final decision is nothing but the current
    state of all accounts. 5f+1 resilience is achieved in the Ripple consensus mechanism.


    One more approach for consensus is the timing model. In synchronous message propagation,
    every message arrives after a time period. A message that takes a longer time
    is considered a failure. On the other hand, in asynchronous propagation, no decision
    is made on message delivery. Ref. [7] states that the timing model may not be
    possible in asynchronous models as messages usually take longer time to deliver.


    In addition, the anonymous nature of Bitcoin makes Byzantine failure harder as
    it is possible for any attacker to introduce fake peers to divert the election
    process, thereby executing Sybil attacks. However, Nakamoto says that Bitcoin
    handles the Byzantine problem in a realistic way. Bitcoin assumes that an unknown-size
    synchronous network reduces the deterministic limit and embraces the final consistency.
    According to Ref. [8], under these notions, a fault tolerance of 2f+1 is derived,
    where f is the sum of hash power of mischievous miners (Byzantine failure). It
    means that even if a network has malicious miners, it can reach consensus as long
    as honest miners hold more than half of the hash power. Bitcoin holds fault tolerance
    only if synchronous property is maintained. Therefore, information transmission
    between honest miners is important particularly when the hash power of malicious
    users reaches a threshold value, which may make the system delicate and insecure.'
