  md: 'users on the network. There can be multiple blockchains existing simultaneously
    with information on them. There are primarily two types of blockchains, namely
    public blockchain and private blockchain.


    # ## 5.1.2 Public Blockchain


    A public blockchain, as the name suggests, is a network that does not require
    any permission for new participants. It has no restriction whatsoever, and anyone
    can join and contribute (through validating transactions with proof-of-work method
    or otherwise) to the growth of the blockchain. A new participant just needs to
    download the existing blockchain and join the network. The incentive for authentication
    on public networks is nominal fees for mining, i.e., miners who authenticate Bitcoin
    transactions receive some Bitcoins as a fee.


    # ## 5.1.3 Private Blockchain


    A private blockchain, however, is a network that does require invitation from
    the administrators of the network. A newly joined participant can be given either
    full or partial access to the network. A full access would mean that the new participant
    can not only view the information but can also authenticate subsequent information
    and add new blocks in the process. A partial access might mean that he does not
    have authentication provision. Hence, in a private blockchain, the degree of access
    to new participants is decided by owners of that blockchain. Such blockchains
    are more commonly used within organizations among employees.


    # ## 5.2 Issues with the Conventional System: Trust at Stake


    In its current form, the world of finance is based on an architecture where intermediaries
    execute transactions between interested parties. These intermediaries such as
    banks and financial institutions are bound by fiduciary responsibilities for their
    customers. It is because of the nature of this fiduciary responsibility, and it
    is imperative for the participants to have faith in the intermediary. The intermediary
    executes the transaction for a small commission/fee. However, many a time, they
    deviate from their fiduciary responsibility and act in self-interest either through
    rent-seeking behaviors of top executives or otherwise. The world witnessed the
    fall of once mighty Lehman Brothers. Other giants felt the heat including American
    International Group (AIG), Merill Lynch, Freddie Mac, Fannie Mae, and Royal Bank
    of Scotland, to name a few [4]. There was a growing sense of mistrust among investors
    over the non-fiduciary conduct of financial corporate bodies as depositories or
    intermediaries for their financial transactions. A similar situation resulted
    before in the enactment of Sarbanes-Oxley Act of 2002. Although blockchain as
    a technology was being experimented with and developed for decades, it was only
    after the white paper by Satoshi Nakamoto [5] that the technology of blockchain
    entered public conversation. The timing of the paper coincidentally matched with
    one of the worst financial crises that the world had seen in the past decades.'
