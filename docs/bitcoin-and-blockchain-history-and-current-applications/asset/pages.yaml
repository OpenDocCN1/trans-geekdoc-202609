    of a patient that are not suitable to be recorded in blockchain.


    # 10.4.2 ISSUES IN INTEROPERABILITY


    Interoperability is one of the issues in the blockchain used in the healthcare
    industry. It helps the blockchain from many different services and communication
    providers to have an appropriate and seamless talk between each other. When the
    data is shared effectively, this challenge generates hindrances [10].'
