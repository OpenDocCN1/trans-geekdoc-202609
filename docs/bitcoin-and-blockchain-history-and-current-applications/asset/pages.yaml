  md: 'purposes like reduce email spams, prevent Distributed Denial-of-Services (DDoS)
    attacks, etc. Like many other modern digital currencies, Hashcash also uses PoW
    algorithm to help in generating and distributing new coins. In fact, in 1997,
    Hashcash also ran into the same issues faced by the other currencies. Hashcash
    eventually became less effective because of its increased processing power requirement.
    In 2009, when Bitcoin was proposed, it started a new generation of digital currencies.
    Bitcoin’s association with blockchain technology and decentralization status make
    it different from many of the cryptocurrencies developed before. At the same time,
    it is not possible to visualize Bitcoin, leaving the earlier attempts at cryptocurrencies.


    # 1.3 BITCOIN IN A NUTSHELL


    Bitcoin and many other cryptocurrencies use open-source software to solve problems
    related to peer-to-peer (P2P) network. A P2P system functions in a way different
    from a government-issued fiat currency. Creating, certifying, and issuing fiat
    money is performed by one person and is used by many. It is more like a client
    server model in networking where a server receives and responds to requests from
    many clients. A server is responsible for ensuring the correctness of data or
    information provided to it. Making fake fiat currency is difficult and is an offense.


    A group of nodes that are linked to a network is called a P2P network. The nodes
    act both as client and as server. P2P network is faster, and its cost of maintenance
    is lesser than the client server model. It is more flexible to attacks or issues
    at one location. In addition to relying on a P2P network, Bitcoin also depends
    on the open-source software. In open-source software, the source code is distributed
    with no or less limitation on copyright in using the program.


    Bitcoin design overcomes the difficulties faced by the digital currencies. It
    was announced and deployed in 2008 and 2009, respectively, by Satoshi Nakamoto.
    Bitcoin gained popularity immediately after that. The identity of Nakamoto remains
    uncertain and leads to many speculations. Bitcoin brilliantly combines many existing
    technologies [5,6] and makes decentralization practical by limiting the number
    of votes per entity in PoW scheme.


    All transactions will be collected in a block by Bitcoin miners and the miner
    will attempt to solve the given cryptographic puzzle by changing its nonce value.
    Once the solution is obtained, it can be broadcasted along with the transactions
    to other nodes and can update the distributed ledger. Coin ownership can be found
    by traversing the blockchain until the coin’s most recent transaction is found.
    Due to malicious operations and transmission delays, it is possible to have forks
    in the chain. Consensus on such cases can be reached by taking the longest (block)
    chain for consideration. In this way, Sybil and double spending attacks can be
    mitigated to an extent by adding blockchain to PoW contributions. PoW generates
    the supply of Bitcoin continuously for miners as incentives. Bitcoin does not
    require a central authority to do these activities, thus making the distributed,
    digital currency practical. Table 1.1 differentiates the various features of centralized
    trust-based models and decentralized model.'
