  md: "**TABLE 9.1**  \n**Properties of a Transaction in Ethereum Platform**\n\n|\
    \ Property | Description |\n|---|---|\n| Nonce | Number of many times the sender\
    \ has sent a transaction |\n| To | Address of the account the money is transferring\
    \ to |\n| Value | Amount of the ether to be send to the desired address |\n| gasPrice\
    \ | Amount of ether the sender is willing to pay per unit gas for handling a particular\
