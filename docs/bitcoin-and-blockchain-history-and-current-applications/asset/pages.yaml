    Coin age can be compared with PoS, in terms of computational power in PoW. But
    the key difference is that the “power” is independent of the computer power. Thus,
    PoS offers a response to the accusation that PoW is wasteful of resources. Unlike
    Primecoin, which tries to put an inherent value in PoW, the high energy usage
    is greatly reduced in PoS. Furthermore, miners kill the age of the coin by demanding
