    # 3.1 INTRODUCTION


    Blockchain technology has revolutionized the world with its research work and
    business projects. Although blockchain sounds to be a new concept, it is there
    in the market for a while and only a couple of years ago it received the world''s
    attention. In 2008, Satoshi Nakamoto explained blockchain as creation of a single
    or a group of people known by pseudonyms. Blockchain is a large database that
    stores the transaction information of people securely and allows them to interact
    with anyone without the need of trusting any third party. Technically, blockchain
    is a secured, shared, and distributed ledger that enables the process of recording
    and tracking resources without the need of a centralized trusted authority. It
    enables the sharing of information between two parties within a peer-to-peer network.
    The resources can be tangible like money, land, houses, car, etc. or intangible
    like digital documents, copyrights, intellectual property rights, etc. Blockchain
    is a distinct way of storing data using a “chained block” structure using cryptographic
    methods, thereby ensuring the integrity of the data.


    # 3.2 HISTORY


    Although blockchain has become popular recently, the distributed ledger technology
    (DLT) is a much older concept, which is often associated with blockchain and creates
    confusion between the two. Giaglis of the University of Nicosia says, “Both are
    methods of organizing transaction records in a shared, distributed database but,
    DLT is an umbrella term that encompasses all sorts of structures — including blockchain,
    which is just one type.” The distributed ledgers need not to use blockchain, and
    blockchain does not have to be distributed though the practical value of blockchain
    is questionable without the characteristic of distributed ledger.


    The concept of Blockchain had started in 1991 with Stuart Haber and W. Scott Stornetta’s
    paper titled “How to Time-Stamp a Digital Document,” which provided the details
    of procedures to be practiced while making or changing a digital document. This
    model used a cryptographically safe series of blocks to keep time-stamped documents.
    To keep many documents in a single block, Merkle tree was'
