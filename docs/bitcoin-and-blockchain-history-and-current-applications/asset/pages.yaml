  md: '# 10.3.4 PHARMACEUTICAL INDUSTRY RESEARCH


    In the healthcare industry, one of the leading sectors and largest growing industry
    is pharmaceutical. Basically, the pharmaceutical industry helps to introduce potential
    and new drugs in markets. When the drugs are sold to patients its responsibility
    is to determine validity information for the medical products, to ensure safety,
    to evaluate [43] and process to produce safe drugs for patients so that they can
    recover quickly. The usual challenges faced by the drug manufacturing company
    is that they cannot timely track their own products, which may create many risk
    and issues such as invading fake drugs to circulate in use, allow counterfeiters
    in compromising production. One of the healthcare industry risks that has been
    observed throughout the world is producing and distributing the counterfeit drugs
    that too majorly in the developing and under-developed countries. Blockchain can
    be best-used technology in the times of Research and Development (R&D) and production
    of drugs. Blockchain are used to ensure potential drug’s production steps, monitor,
    and evaluate. In the recent past, a project of blockchain-based counterfeit medicine
    is launched by research foundation called Hyperledger [55,58]. It was launched
    to inspect and fight against the production and creation of the counterfeit drugs.
    The drugs are needed to be evaluated, monitored, and ensured that digital technologies
    are used in all the processes of development and supply in the drugs of pharmaceuticals
    for effective delivery in authenticating drugs for patients and reliability throughout
    the world that too mainly in the developing and under-developed countries. Digital
    Drug Control System (DDCS) is used to solve these issues of counterfeit drugs
    [48]. Some larger industries in the pharmaceutical (such as Amgen, Pfizer, and
    Sanofi) joined together and launched a pilot project DDCS based on blockchain
    to inspect and evaluate the new drugs that are released in the global market.
    The blockchain-based system tracks the drug location at any time, track the production
    of drugs [40], falsified drug traceability [54] is improved, and guarantee could
    be given for the drug quality supplied to the patients [48] and the supply system
    of the drugs [56] are secured.


    # 10.3.5 NEUROSCIENCE


    In the healthcare industry, one of the growing discipline is neuroscience. The
    neuroscience is developing in a new style by excluding all their mechanical interactions
    with its infrastructure of the surrounding and also allowing a user to control
    data and devices via mental commands and thought wave. These neural devices have
    the capability for interpreting the brain activity patterns and translate the
    patterns to commands which can be used to control the external devices, and based
    on the brain activity patterns, the present person’s mental state can be easily
    deducted. The devices such as ‘Cranial Dopplers’, ‘Electromyographs’, ‘Implantable
    Neurostimulators’, and ‘Neurosurgery Surgical Robots’ that consist of neural interface
    consist of special task such as they can read and interpret the signals of brain.
    These devices have wireless communication, chips for computing, and sensitive
    sensors. Electrical signals regarding the brain activity are read, deciphered,
    and the signals are transmitted.'
