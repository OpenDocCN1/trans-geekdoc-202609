    # 3.10.1 BITCOIN


    Bitcoin’s design is public and not owned or controlled by anyone, and everyone
    can be a part of that network. Refer Chapter 1 for a detailed discussion on Bitcoin
    [9].


    # 3.10.2 ETHEREUM


    Ethereum is an open-source software based on blockchain technology [10]. It is
    a distributed public blockchain network. It enables the developers to develop
    and install decentralized and distributed applications. Ethereum is similar to
    Bitcoin, except that the purpose and capability of both differ. One specific application
    of blockchain, i.e., P2P electronic cash system, is offered by Bitcoin. In contrast,
    Ethereum emphasizes running the code of any decentralized applications. In Ethereum,
    miners work to get ether unlike Bitcoin network where the miners work to mine
    Bitcoins. Ether is another type of crypto token that runs the Ethereum network.
    Ethereum has another type of crypto token called gas which would be issued as
    transaction fee for the miners.


    # 3.10.3 HYPERLEDGER


    Hyperledger is another open-source blockchain framework developed by a group of
    cross-industry experts. It adopts a collaborative software development approach
    that assures security, transparency, and interoperability. Hyperledger offers
    a wide range of tools and frameworks to create enterprise-based solutions.'
