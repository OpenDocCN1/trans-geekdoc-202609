    # ### 13.6.1 Methods in CampaignFactory Contract


    This contract is mainly used for creation and to keep track of the contracts.
    It consists of an array of type address to store the address of the deployed or
    created campaigns and two functions, one for the creation of the Campaign contract
    and the other for retrieving the addresses of the deployed campaigns. Figure 13.4
    represents the structure of CampaignFactory contract.


    Figure 13.5 shows the code involved in CampaignFactory contract. The method createCampaign
    has an argument minimum of type “uint.” The “minimum” represents the minimum amount
    of ether required to contribute to become as a contributor for the campaign. “Public”
    is a keyword that indicates the access modifier or who can access this function.
    Inside of this function, an address variable “newCampaign” is created for storing
    address value of the campaign deployed, which will be returned by the constructor
    of the contract Campaign. The constructor has two arguments “minimum” and “msg.sender.”
    The variable “msg” is struct type which is automatically invoked when a transaction
    occurs or when a function is called and stores the details like the address of
    the person who invoked the transaction, the amount of ether he is sending with
    it, etc.


    So, when a Campaign contract is being created, two variables representing the
    minimum contribution value and the address of the project creator or manager will
    be sent. The address returned which is stored in the newCampaign variable will
    be pushed into the array of deployed Campaigns variable.


    In solidity, there are two types of functions:


    +   1. The function that modifies the values in the contract or changes its state
    which is also known as transaction.

    +   2. The function that does not change any value in the contract or changes
    its state which is also known as “call” to a function. To represent this type
    of function a keyword “view” or “pure” is attached in the function declaration.


    The function “getDeployedCampaigns” is a view function that returns the addresses
    of the campaigns deployed on the Ethereum network, which are stored in the variable
    deployedCampaigns.'
