- pgno: 68
  md: '# 3.10.4 CORDA


    Corda is another open-source blockchain platform used for collecting and processing
    financial agreements that abide smart contracts. Any service that is built on
    Corda is compatible with network users. Corda is the only platform that offers
    both privacy of private networks and interoperability of public networks.


    Other than the discussed open-source platforms, there are quite a number of other
    popular frameworks such as Quorum, Openchain, Hydrachain, and Multichain.


    # 3.11 TESTNET


    An alternative Bitcoin blockchain used for testing is Testnet [11]. Put simply,
    Testnet is a replica of blockchain running in a host computer and primarily used
    for testing purposes. Testnet is not only for Bitcoin but also for every blockchain
    implementation at some point in the source code. This is because Testnets are
    vital components in the development process of a functional blockchain. Testnet
    coins do not have any monetary value and are different from actual Bitcoins. Since
    it has no financial value, experimenting is simple for the application developers
    or testers, without having to use expensive Bitcoin. Three generations of Testnets
    have existed thus far. Testnet2 was the very first Testnet reset to be done with
    a new genesis block since people were starting to exchange Testnet coins for legit
    money. The currently running test network is Testnet3. There are two major differences
    between Testnet and mainnet: (i) networkId—a network id is an identifier for the
    network and (ii) genesis block—the very first block of the chain. Since these
    two work on entirely different networks, they both have different genesis blocks
    though the content of the blocks may be the same.


    As compared to the main blockchain, Testnet receives fewer transactions and is
    usually much smaller. Since January 2018, the disk storage size was 14 GB, containing
    data for Testnet operation estimated for about six years. To download this data,
    approximately 12 GB of network activity peaking at 2 MB/s transfer rate is required.
    Testnet performs few important functions as follows.


    # 3.11.1 CONTINUOUS DEVELOPMENT


    Blockchain technology is still in its infancy and needs huge amount of development
    and testing to achieve mainstream acceptance and practice. In order to overcome
    the various challenges of blockchain, a lot of research and rigorous testing is
    required. Ultimately, Testnet acts as a simulation on how a real chain would work
    under real-world conditions.


    # 3.11.2 PREVENTS DISRUPTIONS


    As Testnets are replica of real chains, it is evident that conducting tests on
    a real chain would be more difficult as a complex interaction among the components
    can disrupt the network and can even break the chain. Hence, Testnet helps to
    ensure that everything is functioning properly before launching real chains.'
