  md: 'The other attacks include *Sybil attack* and *Eclipse attack*. In *Sybil attack*,
    the attacker tries to control part of the network by including fake nodes. This
    is done by a group of nodes. In *Eclipse attack*, a victim node is separated from
    the public network by the attacker and IP addresses to which the victim nodes
    connected are routed to attacker’s address. It is revealed that network congestion
    can be created by tampering the nodes of the network, thereby inducing several
    other attacks on network.


    # 2.12 SECURING BITCOIN NETWORKS


    To secure the Bitcoin network from the security threats discussed earlier, various
    countermeasures are presented in this section.


    To review the *DDoS attacks*, Johnson et al. [15] gave a game-based approach where
    the mining pools compete with each other by increasing their computational costs.
    It was concluded through this approach that bigger pools will have more incentives
    than smaller ones. Eyal [16] also applied a similar gaming approach and identified
    that larger pools grab most of the incentives through selfish behavior in the
    network. Bentov et al. [17] suggested a Proof-of-Activity (PoA) protocol to resolve
    DDoS attacks. Another approach to solve DDoS attacks is to monitor the network
    traffic continuously using any user-defined web service or browser like TOR.


    *Time jacking* is a deadly attack that has the potential to divide the network
    into multiple parts. To overcome time jack attacks, a set of techniques are suggested.
    These include the following: (i) to determine the upper limit of block timestamps,
    system time should be used instead of network time; (ii) possible time scales
    should be strictly followed; and (iii) only trusted peers should be used. To avoid
    *eclipse attacks*, the IP addresses of the trustworthy nodes are stored separately.
    Connections to the nodes are made on the trust factors of the nodes, and any mischievous
    nodes are banned from the network. It was advised that making few changes to the
    payment request message can reduce the probability of refund attacks. The payment
    request message should be modified with some customer information like registered
    email address, product information, or delivery address. Each payment request
    has a unique payment address associated with the key which would be used to make
    refunds. However, adding information about the customer may lead to compromise
    on user privacy. Anrychowicz et al. [18] provide a solution named “new deposit
    protocol” to deal with *malleability attacks*. It is proposed to save the transaction
    signature in a separate Merkle tree.


    In general, transactions with huge amounts of Bitcoins are not carried out due
    to the fear of loss by malicious activities. In such cases, these transactions
    are broken into several smaller transactions, which ultimately delays the completion
    process as the network has to validate several transactions. Hence, to reduce
    this delay, payments through offline transactions, called “micropayments,” are
    recommended. Micropayments take place via a separate channel called “micropayment
    channel.” These channels are part of the Bitcoin network itself but committed
    means for counterparties to perform transactions.


    *Tampering attacks* can be resolved when a peer broadcasts the time taken to mine
    a block along with the declaration of a new block. This would result in other
    peers in the network calculating the average time needed to mine a block. Through
    this, one'
