  md: "![](img/115a7d47166d21dfa1d1dc5986da244b_143_0.png)\n\n**FIGURE 8.5**  Lookup\
    \ process (1).\n\nHere on the right side, we can observe the underlying data structure\
    \ that represents mapping. To look up a value from the mapping, we have to provide\
    \ a key before time. After providing the key, it passes through a hashing function,\
    \ and then the hashing function outputs some predefined index. So, when searched\
    \ for “country” solidity point at index 3 inside mapping and retrieve the value\
    \ of that element. Consequently, keys are not stored in mapping, i.e., we cannot\
    \ prepare a list of keys within the mapping [7].\n\n+   B. Also, values are non-iterable\
    \ in a mapping. In other words, we cannot loop through mapping and print out the\
    \ different values it contains. We cannot run a function or make a call to the\
    \ mapping to retrieve all its values. This is closely related to the fact that\
    \ we discussed before, the inability to access the list of keys in mapping. So,\
    \ we can assert that mappings are only good for single-value look-ups and not\
    \ for storing information which we need to iterate over.\n+   \n+   C. In mapping,\
    \ “all values exist.” To understand this, let us take the same object “info,”\
    \ convert it to mapping, now try to lookup for a key, and say “state.” It will\
    \ then get passed to a hashing function and will return some index. Rather than\
    \ informing us of no value at that particular index, it will return a default\
    \ value for that element. For example, if all the values in the “info” object\
    \ were “string,” then the default value would be an empty string. The default\
    \ value that is returned from the mapping depends on the value type passed to\
    \ the mapping. This concept is illustrated in Figure 8.6.\n\nRefer to the code\
