    # 1.9  SECURITY ATTACKS ON BITCOIN SYSTEM

    AND COUNTERMEASURES


    Since Bitcoin operates in a decentralized model with an uncontrollable environment,
    fraudsters and hackers consider transaction frauds are simple to do. Some of the
    common attacks on a Bitcoin system are (i) double spending, (ii) wallet attacks,
    (iii) network attacks, and (iv) mining attacks.


    # 1.9.1  Major Security Attacks


    # 1.9.1.1  Double Spending


    Double spending is a situation where a fraudulent user tries to spend the same
    set of coins in two different transactions simultaneously. For example, a malicious
    user creates a transact T at time t using a set of Bitcoins Bc to a vender V to
    purchase something. At the same time, the user creates and broadcasts another
    transactions T′ using the same coins Bc, and sends the coins to his wallet address.
    This situation is called “double spending,” where V will accept the purchase and
    send the goods, but cannot redeem the coins. For the coins are transmitted to
    the user’s account. This problem can be solved by enforcing the rule by the network
    miners who will validate and process the transactions to ensure that coins spent
    in previous transactions are not used as inputs for the subsequent transaction.
    Also, the PoW bases consensus and time-stamping helps in the orderly storage of
    transactions in blockchain. In this case, when a miner receives T and T′ transactions,
    it can check if both transactions seek to use the same coins, and thus process
    only one transaction and reject the other. Figure 1.5 shows the double spending
    attack.


    To detect the possibilities of double spending in payment systems, three techniques
    are suggested. The techniques are (i) listening period: in this, each transaction
    is linked by the seller to a listening duration, and he/she only delivers the
    product if he/she doesn’t find any double spending attempt. (ii) Inserting observers:
    this is an extension of the first attempt in which the vendor employs few observers
    (nodes) under his control within the network. These observers inspect for any
    double spending and then send the transactions to the vendor. (iii) Forwarding
    double spending attacks: in this technique, the nodes forward the transactions
    which attempt to double spending to neighbors rather than discarding them.


    # 1.9.1.2  Mining Pool Attacks


    In order to reduce the verification time of a block, mining pools are created
    to increase the computing resources. This reduces the verification time, thereby
    winning a reward. Mining pools have a pool manager who sends the unsolved works
    to the pool members (miners). The miners derive partial proof of works (PPoW)
    and full proof of works (FPoW), and submit them as shares to the manager. If the
    miner'
