    # 4.2.3 Proof of Stake – Resolving Incentive Problem


    While Bitcoin clearly shows that a PoW-based currency is feasible, there are still
    weaknesses. Bitcoin’s users pay the miners through an inflation process to protect
    the currency. Nonetheless, the future remains uncertain when the reward for the
    block decreases over time. Obviously, the block bonus halves about every four
    years (i.e., every 210,000 blocks). After halving the first reward, we can note
    a slight dip in the difficulty, suggesting that the miners leave the network.
    If the regulated coin supply continues as defined, the reward would be lesser
    than 1 BTC roughly in 2032, and it will come down to zero in 2140. This deflation,
    according to Ref. [9], is a process of self-destruction. It is putting the protection
    of digital currencies at risk by moving out the miners. Whether the transaction
    fees will be sufficient to account for the reward and provide the necessary motivation
    for miners remains unclear. The connection between the miners’ strategy and the
    mining reward follows a game theory–based trade-off. Once a miner finds a solution,
    it must be propagated before the others declare the following block to receive
    the reward. The number of blocks does not affect the difficulty of the PoW, but
    a greater number increases the time required to reach consensus: The longer it
    takes for it to be distributed over the network, the more bytes the block contains.
    If there are more transactions in a block, it takes longer to verify their validity,
    but the higher the number of transactions, the higher the reward. Nash equilibrium
    states that a point where no individual can benefit by changing their strategy.
    Interestingly, in this Nash equilibrium, miners will not include any transaction
    in their blocks. This would certainly make Bitcoin completely useless, which also
    affects miners. The Nash balance shifts once the transaction fees increase or
    the reward for the block drops significantly. This implies that there may be an
    incentive for transaction fees.


    There is, however, a problem with declining incentives that leads to the commons
    tragedy [10]. It is a gaming term which states that using individual, independent
    actions decreases the long-term gain of peer group by decreasing a common resource.
    Now let us look into the alternatives for PoW that allows us to revisit the basic
    requirements that must be met: First, block generation must in some way be “expensive,”
    and individual miners must not be able to acquire an excessive potential to mint
    coins. Second, consensus must ultimately be achieved; a common rule must be established
    for resolving forks and determining of main blockchain. And finally, it should
    be non-fraudulent.


    Coin age is considered as a possible alternative to PoW. Coin age is the amount
    of times the currency has been inactive. Assume if user A sends two coins to user
    B, and user B retained the coins for 80 days, then the coin age is 160 coin-days.
    When user B expends the two coins, the coin age accumulated is damaged. This method
    of using coin age to describe the incentives is called Proof-of-Stake (PoS). It
    is applied in Peercoin. A PoS block mining needs a coinstake block (similar to
    Bitcoin’s Coinbase transaction). Owners send their coins to themselves in a coinstake'
