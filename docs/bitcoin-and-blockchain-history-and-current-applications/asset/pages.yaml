    # 1.6  PROOF OF WORK


    In Bitcoin, multiple copies of blockchain exist in the network, and it is necessary
    to keep the global view of the blockchain consistent. For example, two different
    transactions can be created using the same coins to different receivers, which
    is called “double spending”. And if the two receivers process and get their transactions
    verified individually based on their local views of blockchain, the blockchain
    becomes inconsistent. Such problems can be resolved by (i) sharing verification
    process of the transaction to guarantee rightness of the transaction and (ii)
    letting everyone know the successfully processed transaction to assure the consistency
    of blockchain. Bitcoin uses PoW and a distributed consensus protocol to satisfy
    the above specifications.


    As mentioned, the distribution of verification process is to ensure the correctness
    of data by majority of valid users. Therefore, if the blockchain goes into an
    unstable state at any time, all users can update their local blockchain copy to
    the one accepted by most miners. But this election process is subject to Sybil
    attacks [4]. In Sybil attacks, a malicious user creates many virtual nodes and
    makes them vote for a wrong transaction, thereby disturbing the election process.


    PoW model helps Bitcoin to overcome the Sybil attacks. In this model, a miner
    has to solve a cryptographic mathematical puzzle to prove their genuineness similar'
