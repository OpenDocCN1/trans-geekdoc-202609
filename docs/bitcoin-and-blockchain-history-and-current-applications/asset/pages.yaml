  md: '# 10.1.2 **VISION**


    The vision is to adapt blockchain technology (BCT) in the healthcare centers and
    hospitals to get maximized benefits. Using BCT could lead to a betterment in healthcare
    systems such as secure data transaction, protecting user details, efficient data
    management, right treatments can be given to patients at right time by efficient
    diagnosis of patient’s health. From government hospitals to smaller clinical centers
    can adopt the BCT for a higher potential treatment.


    # 10.1.3 **HEALTHCARE**


    Health care is a data-oriented industry, where very vast data are being created,
    accessed, and then disseminated regularly. It is crucial to store or disseminate
    these huge sets of data. It is a significant challenge to handle the data, as
    these data are highly sensitive and have some limiting factors like privacy and
    security [24,36].


    In the smaller clinics as well as small healthcare field scalable, secure, and
    safe sharing of data is much important for the combined decision making and efficient
    diagnosis. Sharing data is essential and important to transfer medical data reports
    from the physicians or doctors to the consulting patients for quick update on
    the progress of the treatment. The physicians and doctors transfer the data or
    report to their patients with high privacy on a regular basis, in order to make
    sure that both sides consist of updated information regarding the health condition
    of the patient. In the endlessly utilized huge area big domains such as telemedicine
    and e-health record (EHR) in which the clinical reports are sent remotely to a
    distant location specialist for consulting the opinion of expert. In these types
    of systems, the data of the patient is sent via real-time online monitoring (such
    as telemetry or telemonitoring, etc.) or storing and forwarding technology [3,8,22,29].
    By using these online technologies, the remote diagnosis of the patients can be
    carried out and treated by experts with the help of transferred clinical reports.
    In these technologies, the privacy, security, and sensitivity of the clinical
    reports are the main challenges which occur since the data of the patients are
    sensitive in nature. Thus transferring of data in a scalable, secure, and safe
    way is very much important to support a meaningful and healthy communication between
    the remote patients and the experts. This successful safe transfer of clinical
    reports yields related confirmations or recommendations from the clinical experts
    or specialists that could be resulted in improvement in the accuracy of diagnosis
    and a much effective treatment [7,9,13,16,65].


    # 10.1.4 **CHALLENGES IN HEALTHCARE**


    In the field of healthcare, there are different challenges in interoperability.
    For example, the successful, safe, and secure transactions of clinical report
    data among the research institutes or healthcare organizations can have lots of
    challenges, when applied in practical operations. These clinical report data needs
    to be trustworthy, substantial, and mainly it should be a healthy collaboration
    among the involved entities. Some of the potential constraints that this industry
    faces are sensitivity of data, governing rules, data sharing procedures and agreements,
    ethical politics, and'
