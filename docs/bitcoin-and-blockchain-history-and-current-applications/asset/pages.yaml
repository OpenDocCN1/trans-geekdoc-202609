  md: "calling this function if the user has sent some ether, it will be directly\
    \ added to the contract balance. Without the payable modifier, the function will\
    \ not accept the ether that has been sent. The require will check the condition\
    \ whether ether sent is greater than minimumContribution value. If it is then\
    \ the function executes and he will be added as an approver or contributor. As\
    \ mentioned above, approvers is a mapping between address and Boolean. The “msg.sender”\
    \ will have the address of the person who invoked the function. For this address,\
    \ the value true will be assigned which implies that he is a contributor. The\
    \ variable approversCount is used to keep track of number of approvers are present\
    \ for the project at a given time. Every time when some become an approver, the\
    \ variable approversCount will be incremented by “1.”\n\n**createRequest ():**\
    \ This function creates the request for spending the ether to buy something which\
    \ will go for voting. The function should have the description or information\
    \ about the request like the item name, why he want to buy it, the cost for the\
    \ request, and the address of the recipient or vendor address to whose account\
    \ the money should be deposited. This function has “restricted” attached to it\
    \ as a modifier which indicates that the control will first go to the restricted\
    \ modifier we have defined and execute it, refer Figure 13.10. So, it will verify\
    \ whether the request is being created by the manager or not. If it is then it\
    \ will execute the remaining function or else it won’t.\n\nHere, we are creating\
    \ a variable “newRequest” of type Request struct which has a modifier “memory.”\
    \ The memory modifier indicates that this is a temporary variable and will be\
    \ stored in the memory, only when the control is in the function or when the function\
    \ is alive. The variables in the struct will be assigned with appropriate arguments\
    \ given. Then this memory variable will be pushed into the requests array, which\
    \ will be available for voting.\n\n**approveRequest ():** The contributors or\
    \ the approvers can approve a request by voting and if the approved percentage\
    \ of a request is greater than 50%, the request will be accepted and can be finalized.\
    \ The function has an argument index of type uint which represents the index of\
    \ the request in requests array. In this method, a storage variable request of\
    \ type Request struct is declared and is assigned with the value at the index\
    \ of requests array. Storage means that this variable request points directly\
    \ to the struct data at the index in the memory. It means if the data is changed\n\
    \n```\n```solidity\nfunction createRequest(string description, uint value, address\
    \ recipient)\n    public restricted {\n\n    Request memory newRequest = Request({\
    \  //Request(description, value, recipient, false)\n        description: description,\n\
    \        value: value,\n        recipient: recipient,\n        complete: false,\n\
    \        approvalCount: 0\n    });\n\n    requests.push(newRequest);\n}\n```\n\
    ```\n\n**FIGURE 13.10**  createRequest method."
