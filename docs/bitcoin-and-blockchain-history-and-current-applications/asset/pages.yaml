  md: 'The guidelines are designed to reinforce Kickstarter’s position that people
    are backing projects, not placing orders for a product. To underscore the notion
    that Kickstarter is a place in which creators and audiences make things together,
    creators across all categories are asked to describe the risks and challenges
    a project faces in producing it. This educates the public about the project goals
    and encourages contributions to the community.


    # The Flow of a Project/Campaign on Kickstart


    # 13.4 ISSUES WITH KICKSTARTER


    There are many successful projects as well as many failure and fraudulent projects.
    There is no guarantee that people who post projects on Kickstarter will deliver
    on their projects, use the money to implement their projects, or that the completed
    projects will meet backers’ expectations [1, 8]. Kickstarter advises backers to
    use their own judgment on supporting a project. They also warn project leaders
    that they could be liable for legal damages from backers for failure to deliver
    on promises. Projects might also fail even after a successful fundraising campaign
    when creators underestimate the total costs required or technical difficulties
    to be overcome. The backers will not get the refund for the failure product since
    the money is spent and the backers really cannot know whether it is a fraudulent
    project or it is a genuinely failed project. Either way the backers will not get
    any money return once they have contributed. All they have to do is wait for the
    reward or incentives that the project creator has promised. But there is a high
    percentage of possibility that even if the product is successfully completed,
    the backers may not receive the promised incentive. In those cases, Kickstarter
    won’t do any help to the backers. If the backers want the product or the money
    they contributed, all they can do is file a law suit against the project creator
    which is done rarely since it also costs a lot of money.


    There is always a possibility that a backer will always loose the money and not
    get justified in Kickstarter. There are so many obvious scams, fraud, and deceit
    in the Kickstarter [2, 4, 8]. Some of the problems with examples are illustrated
    below.


    Security issues: There are some issues related to securely transferring the money
    to the project creator on the platform. This issue is explained by taking the
    case of a project known as "Pillow Talk" by Little Riot company [2, 8].


    +   - Montgomery, the founder of Little Riot closed a successful Kickstarter campaign,
    after raising £82,000 in pre-orders for her invention Pillow Talk [9–11], which
    lets two people experience each other’s "presence" by sending the sound of one
    person’s real-time heartbeat to a speaker under their partner’s pillow.

    +   - The campaign was not only successful, it overfunded by almost 10%,but a
    glitch in Kickstarter’s payments system meant that when it came to charging people’s
    cards, every one of Pillow Talk’s backers received an email saying their payment
    had been declined.'
