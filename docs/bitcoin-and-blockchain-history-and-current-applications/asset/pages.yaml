    # 4.2.6 TENDERMINT


    Tendermint is a kind of Practical Byzantine Fault Tolerant (PBFT) consensus algorithm.
    Similar to PBFT, it provides a n 3 f+1 fault tolerance. It uses stake proof in
    conjunction with PBFT concepts to ensure safety, high throughput, and a processing
    time of 1–3 seconds at low blocks. Whereas a leader node is chosen pseudorandomly
    in PBFT, Tendermint embraces the lottery-based PoS properties and chooses the
    lead node with a probability proportional to the network share of stakeholders.
    Tendermint conducts several rounds of voting after member selection to reach consensus
    on addition of a new block to maintain 100% uptime. It needs a majority (about
    two-thirds) of its validators, and if more than one-third of the network goes
    offline, the progressing of network may stop and lose productivity. Transactions
    are organized, and if less than one-third of all verifiers are unreliable, it
    provides a safety guarantee that there are no competing blocks created and no
    forks in the blockchain present. Tendermint is compatible with public or private
    chains, but it does not enjoy the same level of scalability as PoW or PoS.


    # 4.2.7 FEDERATED BFT


    Ripple and Stellar implementation of blockchain expanded the conventional BFT
    for situations involving a node federation or consortium. Ripple consensus starts
    with a distinct node list (UNL) containing a list of active validator nodes in
    the network. Each node has a node list of 100+ nodes, and each list will overlap
    by atleast 40% with the lists stored by other nodes. Ripple performs several rounds
    of voting in which the nodes compile the transactions into candidate blocks and
    broadcast them to the other nodes in their list. Later, the nodes send the votes
    on every candidate block. Each round of voting lets nodes optimize their candidate
    block, and a new block is introduced to the list once an 80% majority vote is
    received. Thus, by conducting multiple rounds of votes, Ripple provides a sensitivity
    of n=5f+1 fault.


    In blockchain networks, Stellar presents the concept of quorums. A quorum is a
    set of nodes used to reach consensus. A node in such a network will form part
    of multiple quorum slices in which each slice of quorum safely reaches consensus
    by voting. As quorums and quorum slices are permitted to converge within the main
    Stellar network, Stellar allows open node participation in different sub-networks.
    Since Stellar chooses for security over liveness property, the blockchain will
    not advance until the malicious activity is resolved in the event of a malicious
    behavior in the network. Stellar offers versatile trust and low latency as it
    is computationally affordable. Quorums include a limited set of nodes that exchange
    voting messages.


