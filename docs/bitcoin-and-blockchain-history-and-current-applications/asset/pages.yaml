    # 2.6 JOINING AND CONSERVING THE NETWORK


    In the overlay, each peer in the Bitcoin network maintains a minimum of eight
    connections. Whenever this count is under run, the peer will actively try to make
    a connection with other peers. A peer can have more than eight connections if
    another peer tries to make a connection. The maximum number of connections a peer
    can handle is 125. The default port on which the peers receive incoming connection
    is 8333. To make a new connection, a peer implements a handshake by sending version
    and verack messages. Version message includes protocol version, timestamp for
    synchronization, and IP addresses. The peer node establishes a connection by responding
    with a verack message. The initial handshake between peers is shown in Figure
    2.2.


    If there are no messages for 90 minutes, the client will know the peer is offline.
    Bitcoin peers can also record the list of peers that are not connected directly
    to the network. After 24 hours in the network, every peer should send an addr
    message.


