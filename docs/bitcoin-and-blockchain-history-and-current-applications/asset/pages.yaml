    # ### 7.3.2 Different Types of Consensus Algorithms


    There are several types of consensus algorithms. The most common implementations
    are PoW and PoS. Each one has its own advantages and disadvantages when trying
    to balance security with functionality and scalability.


    # #### 7.3.2.1 Proof of Work (PoW)


    PoW architecture use the concept of consensus algorithm. It is widely used by
    Bitcoin and many other cryptocurrencies. The PoW algorithm is a vital part of
    mining process.


    The objective behind PoW is to guaranty numerous hashing procedures, so more computational
    power consumption declares more trials per second it need, and subsequently, miners
    who possess high hash rates have a potential chance to select a full proof solution
    for the next block (a.k.a. block hash). Enhancement of PoW consensus algorithm
    depends upon selection of miners and procedure of validation for a nascent block
    of transactions. It adds this block to the blockchain if the distributed nodes
    of the network reach consensus and agree that the block hash provided by the miner
    is a valid PoW.


    # #### 7.3.2.2 Proof of Stake (PoS)


    The PoS consensus algorithm came to reality in 2011 as an alternative solution
    to PoW. Although PoS and PoW share a common objective, they still deliver some
    fundamental discreteness and eccentricity, generally at the time of validation
    of new blocks.


    The identity of PoS consensus algorithm replaces the PoW mining strategy with
    a clear-cut procedure where blocks need validation according to the stake of the
    participants. The validator of each block (also called “forger” or “minter”) is
    decided by an investment of the cryptocurrency itself, not by the amount of computational
    power allocated. Each PoS system implements the algorithm in various ways, but
    in general, the blockchain is shielded by a pseudo-random election process that
    speculation of the node’s wealth determines the coins’ age (how long the coins
    are being locked or staked) – along with a randomization factor.


    The Ethereum blockchain is currently centered on a PoW algorithm, but the Casper
    protocol will shift the network infrastructure from PoW to PoS. It is an attempt
    to boost the network’s scalability [17–19].


