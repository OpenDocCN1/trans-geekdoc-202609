    process of hashing; notable among them are Message Digest (MD family of software)
    and Secure Hash Algorithm (SHA family of software). SHA-256 takes an input of
    arbitrary length and processes it through the hash function to generate an output
    of 256 bits. Any change whatsoever in the input, no matter how small, would result
    in a totally different output of 256 bits. SHA-512 does the same job, but the
    length of the output is 512 bits. Hashing is a one-way traffic where every time
    the same input would result in the same output, but one can’t derive the input
    from its corresponding output (Figure 5.5).


    # 5.6.2 CONSOLIDATING MULTIPLE HASH SIGNATURES


    A block in a blockchain might contain information of multiple transactions with
    each of them having their unique hash signature identity. These multiple hash
    signature identities within a block are aggregated to form a totally new hash
    signature identity till the root hash signature unique identity is reached. This
    unique signature identity serves as the hash identity for the whole block, and
    it is this hash signature identity that is used for linking of this block to the
    following block (Figure 5.6).


    ![](img/115a7d47166d21dfa1d1dc5986da244b_90_1.png)


