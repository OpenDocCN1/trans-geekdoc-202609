  md: 'to engage patient’s medical history and present medical data. Lots of researchers
    propose blockchain to maintain EHR system [11,23,39,49].


    MedRec prototype consists of blockchain to manage the integrity, authentication,
    easy data sharing, and confidentiality. It works based on decentralized system
    of record management. The patients are provided with detailed history which is
    immutable and provides easy access for the relevant information even across different
    healthcare organizations and providers [19]. But MedRec will not store any medical
    data or any adjustment and modification time. The records are marked in blockchain,
    and patients are forwarded with advice and then the patients are responsible for
    selecting the location to store data. It also moves the control power from the
    healthcare organization to their patients, weight is assigned to patients to indicate
    the owner’s responsibility. If there are some patients who cannot handle their
    data, specific agents are assigned to them by admin to fill the patient’s data.
    So a huge size of patients individually enters in and utilizes the data which
    can’t be predicted, they can create work, plan, and then diverse user interface.
    Where, the MedRec also consists of User Interface (UI) for improving connection
    to the data and record of health care, which circulates across various organizations.


    When implementing EHR system, there arise critical limitation issues in sharing
    the medical data such as auditing, controlling data, secure tailing of data in
    clinical data, and data provenance. Due to these issues, Xia et al. [62] proposed
    secure and safe blockchain system called MeDShare in order to perform clinical
    data transportation between parties that are entrusted. MeDShare is used for sharing
    clinical data and maintaining health data and records in electronic form among
    hospitals, providers who give cloud service and researchers of healthcare field
    with audit control in a personalized form, better data provenance, and limited
    possibility of threats for data privacy and security.


    EHR system usually consists of critical and high sensitivity that are data relevant
    to patients and shared frequently among healthcare providers, clinicians, pharmacists,
    researchers, and radiologists for providing effective and easy diagnosis and treatment.
    When these high-sensitive data of the patient are distributed, transmitted, or
    stored across different entities, the treatment of the patient could be compromised
    that would pose a huge threat to the health of the patient and maintain updated
    history of the patient. For example, if a patient is fighting against chronic
    diseases such as HIV or cancer, commonness of risk becomes much high along with
    pre-treatment and post-treatment history and rehabilitation steps or followups.
    Hence, updated history of patient is necessary to be maintained to carryout treatment
    effectively. Due to these issues, Dubovitskaya et al. [18] developed a framework
    based on blockchain to share, maintain, and manage the cancer patient’s clinical
    records in electronic form. A blockchain is adopted with permissions for storing,
    managing, and accessing the patient’s information in an encrypted form. This type
    of frameworks are used for practical implementation of blockchain to access the
    patient data, manage the security and privacy of patient clinical data history,
    and current data in practices.


    In 2016, project such as Estonian medical record based on blockchain is a benchmark
    in the medical history, where Estonia is merged along with blockchain’s global
    leadership. It is proposed with an idea to keep more than millions of private
    clinical records and also for the wide availability of the records for insurance
    companies [27] and medical providers.'
