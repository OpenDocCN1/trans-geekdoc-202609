- pgno: 62
  md: '# TABLE 3.1

    Evaluation of Public, Private, and Consortium Blockchains


    | Attribute | Public Blockchain | Private Blockchain | Consortium Blockchain |

    |---|---|---|---|

    | User access | Public | Restricted | Restricted |

    | User identity | Anonymous/pseudo-anonymous | Approved users | Approved users
    |

    | Participation in consensus | All peers | Single enterprise | Selective peers
    in multiple enterprise |

    | Content immutable | Yes, fully | Partly | Partly |

    | Transaction processing rate | Low | High | High |

    | Permissionless | Yes, Permissionless | Permissioned | Permissioned |


    There is no exchange of tokens or currency in private blockchain. No transaction
    fee is involved as nodes validating the block are known to each other. Hence,
    private blockchain is not tamper resistant like public blockchains. It is possible
    to rollback in private blockchain if the enterprise wishes to at any point of
    time. Hyperledger is an example of private blockchain.


    # 3.4.3 CONSORTIUM BLOCKCHAIN


    Similar to private blockchain, consortium blockchain also needs permission. On
    the other hand, the network expands to several organizations and provides accountability
    between the parties involved. Transaction fee is not involved in consortium blockchain,
    and computationally it is not difficult to publish a block. Consortium blockchain
    has the privacy benefits of private blockchain and has the secure and transparent
    natures of public blockchain. It is also called “hybrid blockchain.” Dragonchain
    is an example of hybrid blockchain. Table 3.1 summarizes the features of different
    blockchain types.


    # 3.5 PROPERTIES OF BLOCKCHAIN


    Many researchers work on blockchain technology, and their findings are influential
    in developing the technology suitable for many applications. Following are the
    salient features of blockchain technology.


    # 3.5.1 DECENTRALIZED


    In traditional centralized transaction systems, transactions are made through
    a mediator that provides transaction services. Usually, banks act as the central
    authority of the system that controls everything. The main aim of the decentralized
    system is to remove the necessity of a central authority and create a decentralized
    system across the world with computers (often called “nodes”) as parts of the
    system. Thus, all the nodes in the network will have the control instead of having
    one single authority.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 3.5.2 TRANSPARENT


    All transactions that take place on blockchain are open, and thus, anyone who
    is a part of the network can view all the transactions. This is the transparency
    that blockchain provides which never existed in the centralized system. Although
    blockchain provides anonymity of the users, it is possible to view the transactions
    made by the users using their public address.


    # 3.5.3 IMMUTABLE


    Immutable means once the data is entered in blockchain, then no changes can ever
    be made in that data. This property provides security and assures the users that
    the data will not be altered.


    # 3.5.4 PERSISTENCY


    Validation of transactions can be very quick, and invalid transactions can be
    identified and never are allowed in the block. Once the transactions are connected
    to a block, it is not possible to remove or reverse them.


    # 3.5.5 ANONYMITY


    Any user can communicate with every other user in the network using their public
    address. It is not possible to identify the user using this address, and anonymity
    is maintained without compromising the system''s transparency, as all transactions
    are documented in a public ledger. Yet, many researches show, using the right
    clustering and flow analysis technologies it is possible to track the user''s
    identity. Nonetheless, a lot of work has been done to address the privacy and
    anonymity issues, and various schemes are proposed to improve anonymity property.


    # 3.5.6 AUDITABILITY


    Blockchain transaction stores customer balance data based on an Unspent Transaction
    Output (UTXO) model. Whenever a transaction takes place, the unspent transactions
    will be referred. Once the transaction is complete and documented into a block,
    the status of the unspent transactions will be changed to spend. Hence, the transaction
    can be easily verified and tracked.


    # 3.6 TRANSACTIONS AND DIGITAL SIGNATURE


    A transaction or any data exchange to take place in a blockchain, the nodes of
    the network need a private and public key pair. A node uses a private key to sign
    and send the transaction to the receiver node''s blockchain address. These addresses
    can be obtained by cryptographic computations of the receiver''s public key. SHA-256
    encryption algorithm is used to calculate the blockchain address. To understand
    the transaction over blockchain, let''s take an example of a bus company. We book
    tickets via an app or web. The credit card company charges to process the transaction.'
