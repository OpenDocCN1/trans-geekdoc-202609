  md: '# ## 11.3 TYPES OF BLOCKCHAIN


    There are two types of blockchain platforms [3]:


    +   1. Permissioned blockchain.

    +   2. Permissionless blockchain.


    This is based on the consensus model used for the working of blockchain. In permissioned
    [10–12] blockchain, participants need consent to join the chain. This type of
    platform is specifically used by private organization with centrally controlled
    nature. Governing of blockchain can be done by a single entity or group of representatives.
    Transactions of permissioned blockchain platforms are available only to permitted
    representatives. The role of the participants is decided by providing additional
    security layer in the blockchain architecture.


    Permissionless platform is also known as public blockchain, which is purely decentralized
    in nature also known as public ledgers. It does not require any permission for
    the participants to join blockchain. Participants can download open-source protocol
    and be the part of blockchain. Permissionless platforms are having tokens to provide
    incentives to the participants. Based on the application usages, it can also be
    divided into three types [12,13]:


    +   1. Public blockchain.

    +   2. Private blockchain.

    +   3. Consortium blockchain.


    Public blockchain is nothing but permissionless blockchain where there is no restriction
    on participants and validators. Private blockchain is permissioned blockchain
    where only pre-approved participants are permitted to participate and/or validate
    the transaction. Consortium blockchain is also known as hybrid blockchain because
    the information is being shared like public blockchain but it can restrict the
    nodes that can access the blockchain.


    # ### 11.3.1 CHARACTERISTICS OF BLOCKCHAIN [12]


    Based on the above discussion, we enlist the characteristics of blockchain:


    +   1. Transparency in maintaining data in the form of transaction.

    +   2. Immutability – transaction once recorded is time stamped and is highly
    impossible to alter.

    +   3. Record persistency – transactions are checked and validated by the network
    group members.

    +   4. Auditability – information in the blocks are easier to trace and verify
    because of chain structure with time stamping.

    +   5. Decentralization control – distributed ledger mechanism.

    +   6. Low transaction cost – removal of intermediary’s role subsequently reduces
    transaction costs.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '+   7. Real-time data capturing and updation.

    +   8. Security using encryption technique.


    # 11.3.2 CHALLENGES OF BLOCKCHAIN [14–16]


    There are certain challenges that we need to deal with while implementing the
    blockchain. Those are:


    +   1. 51% attack – This is the kind of attack in which blockchain users form
    group as “mining pool” to mine more blocks. This mining pool holds maximum computing
    power. If this holding power is more than 51% computational capacity of the blockchain,
    then it will take control of the blockchain. After getting control by the group,
    they can modify transactions, can stop miners from mining blocks, can stop transaction
    validating process. These types of attacks were more feasible in the past when
    network size was smaller.

    +   2. Fork problem – This problem occurs when blockchain was upgraded from old
    version to new version. After upgradation, blockchain nodes can be divided into
    new nodes and old nodes. This problem occurs when non-upgraded nodes will not
    validate upgraded nodes or non-upgraded nodes will not follow the new consensus
    regulations. Because of this divergence took place in the blockchain nodes, if
    it is permanent, it is called as hard fork, and if it is temporary, it is called
    as soft fork.

    +   3. Scalability – Blockchain network keeps on growing day by day. With an increase
    in the blockchain, data and resources keep on adding burden on the system. Because
    of this, nodes will take more time to synchronize data and carry out complex computation.
    It will subsequently affect the effective working of the blockchain system.


    # 11.4 HISTORY AND DEVELOPMENT OF BLOCKCHAIN


    Stuart Haber and W. Scott Stornetta introduced blockchain in 1991 but real utilization
    of this technology came in view during the year 2008 [17] in the form of cryptocurrency
    application by unknown entity as an individual or small group called Satoshi Nakamoto.
    Research paper “Bitcoin: A Peer-To-Peer Electronic Cash System” by Satoshi Nakamoto
    explained the application of blockchain to transfer Bitcoin between network group
    members without using third-party involvement like financial institutions.


    After the introduction of this new mechanism, the first block of the blockchain
    was released. It is called Block 0, which is genesis block of blockchain and is
    a special case block, which does not contain address of previous block in blockchain
    technology. This is basic building block of the blockchain technology. Genesis
    block is developed by the originators of the blockchain. From records, it is reflected
    that it took six days to mine genesis block while average timestamp for mining
    a block in the blockchain is 10 minutes. Genesis block consists of 50 Bitcoin
    rewards. It is not clear whether it was kept intentionally or unintentionally.
    Using this open-source protocol, anyone across the world can participate in the
    blockchain network by entering into the contract.'
  merge: -1
  img_proc: true
