    \ at Figure 8.1 and analyze it.\n\n# a. **Pragma**\n\nThe first line of the code\
    \ carries a pragma directive. It is practiced to specify the version of solidity.\
    \ Here the version specified is “0.4.17”. In a project, different files can have\
    \ different versions; thus, a pragma directive is enacted in local to a source\
    \ file and automatically ignored while importing.\n\n# b. **Comments**\n\nComments\
    \ are additional notes or annotations provided by the programmer. These are ignored\
    \ by the compiler during interpretation and compilation. In solidity, comments\
    \ are used just as in C++: // for single-line comment, and /* and */ for multi-line\
    \ comments. As observed in Figure 8.1, comments are written after each statement\
    \ to explain its purpose.\n\n# c. **Keywords**\n\nBefore moving forward, let us\
    \ take a glance at a few important Keywords in solidity shown in Table 8.1.  \n\
    Most of these work similar to any other advanced programming language.\n\n```\n\
    ```solidity\npragma solidity ^ 0.4.17; //To Specify the version of solidity\n\n\
    contract SimpleStorage { //SimpleStorage is the name of the contract\n    uint\
    \ storedData; // unsigned integer \"storedData\"\n    function set(uint x) public\
    \ { //Public function with \"set\", take unsigned integer as an input\n      \
    \  storedData = x;\n    }\n    function get() public view returns (uint) { //Public\
    \ function with \"get\", view function does not make any changes in contract\n\
    \        return storedData;\n    }\n}\n```\n```\n\n**FIGURE 8.1**  Getting started\
    \ code.\n\n**TABLE 8.1**  \n**Keywords in Solidity**\n\n|  |  |  |  |\n|---|---|---|---|\n\
    | Abstract | after | alias | apply |\n| Auto | case | catch | copyof |\n| Default\
    \ | define | final | immutable |\n| Implements | in | inline | let |\n| Macro\
    \ | match | mutable | null |\n| Of | override | partial | promise |\n| Reference\
    \ | relocatable | sealed | sizeof |\n| Static | supports | switch | try |\n| Typedef\
    \ | typeof | unchecked |  |"
