    # 12.1 INTRODUCTION


    # 12.1.1 PERMISSIONED BLOCKCHAIN


    It is possible to architect, access, and manage a blockchain [1] in multiple ways.
    Some blockchains [1] need exceptional permissions for reading, transacting, writing,
    and accessing information about them. Such blockchains inherent configuration
    controls the interactions of the participant and defines their roles. Such blockchains
    are called permissioned blockchains.


    A permissioned blockchain facilitates auxiliary security by providing an access
    control layer to the blockchain network, which permits only well-defined identities
    to transact with the distributed ledger in the network, without making data public.
    Permissioned blockchains permit different levels of permissions to be designated
    to its users; therefore, access can be restricted, sufficing confidentiality.
    A participant may join the network without any permission but may need authorization
    for transacting within the network. Hence such blockchains are favored by individuals
    who within the blockchain need to define security, identity, and role. Authorized
    blockchains are common among companies and businesses at the industry level, for
    which security, identity, and role management are relevant. A few advantages of
    a permissioned blockchain are listed below:'
  merge: -1
  img_proc: true
- pgno: 213
  md: '+   - **Closed Environment:** The enterprise controls the resources and access
    to the blockchain. Every transaction made within the network is isolated to itself.
    Hence, it ensures security and privacy up to an extent.

    +   - **Transactions:** When nodes are distributed locally but also have much
    less nodes to participate in the network, the performance is faster ensuring that
    the transactions take less time to execute [2].

    +   - **Scalability:** The ability to add nodes and services with ease can provide
    a great advantage to an enterprise.

    +   - **Transparency and Accountability:** As all the participants in the network
    are well defined, every interaction made with the distributed ledger is traceable
    back to its provenance, and person who made a transaction is accountable for that
    particular transaction.

    +   - As permissioned blockchains have their advantages, according to the industry
    aspect, it also has some disadvantages:

    +   - **Conspiracy:** If in a permissioned blockchain, a group of members within
    the network collude to change the information in that blockchain, they will destroy
    the network''s credibility.

    +   - **Regulations:** As blockchains which are permissioned, operated by a group
    of enterprises and businesses, they must agree and stick to the regulations they
    implemented in the network. The threat of these regulations may not impact businesses
    that already comply with existing laws, but it may prevent new businesses from
    joining these permissioned blockchain networks.


    # 12.2 PERMISSIONED BLOCKCHAIN FRAMEWORKS


    As permissioned blockchains attracted many enterprises to explore the benefits
    of what it can offer, few frameworks gained popularity providing platforms. Some
    of them are Hyperledger Fabric [1], Quorum, Ethereum, and Corda [3,4].


