  md: '# ## 2.2 P2P NETWORK


    A flat or hierarchical organization structure is used in P2P network, which arranges
    the peer in a random graph. Peers are interconnected over an unencrypted TCP channel.
    A peer or a node in a P2P network is a computer that has Bitcoin node software
    installed in it. This Bitcoin node software is added automatically in Bitcoin
    full client wallet. It is possible to view only the nodes which run full client,
    and not all the nodes can be seen while trying to locate a node in the network.
    If a peer is interested in entering the network, Domain Name System (DNS) server
    names and DNS seeds are first inquired. Such DNS seeds are hardcoded in Bitcoin
    clients to find the active nodes in the network. The DNS seeds return the peers’
    IP addresses that are ready to accept new connections in response to the enquiry
    completed. A version message with block version number and current time of the
    sender peer is sent to make a connection between peers. The receiver peer sends
    its version message back to the sender peer. Once the connection is established
    between the two, they acknowledge it by sending *verack* message. After joining
    the network, peer discovery takes place on the basis of address propagation mechanism.
    In the mechanism of address propagation, peers can ask each other’s IP address
    using *getaddr* messages, and they can send their IP lists using *addr* messages.
    In order to find the peers that have some useful data, P2P uses techniques like
    expanding ring, random walks, Time-to-Live (TTL) search, etc. Peers can possess
    a sum of 125 connections, of which 8 are outgoing connections and 117 are incoming
    connections. Firewalls or network address translation (NAT) cannot have incoming
    connections and can have only outgoing connections.


    Every peer maintains their list of connections made. When a new block is generated,
    the miner broadcasts the information to its peers. The receiver validates the
    block and then passes it on to his peers. When a peer makes a transaction, it
    sends the message to its related peers. A peer sends an *inv* message to initiate
    a transaction. If the recipient responds with a *getdata* message, then the transaction
    is sent using *tx* code. If the transaction is real, the transaction shall be
    communicated in the same manner as above. If any faulty messages are sent, the
    peer will be penalized by maintaining a penalty score. If the score reaches a
    threshold, the connection of the peer will be banned.


    In general, the unstructured connections are easy to construct and strong in a
    dynamic environment, i.e., peers leave and join the network regularly. Searching
    a file in an unstructured network requires a flooding request as each peer would
    check on its local data. Due to a large number of copies of each question, there
    will be a huge overhead. Bitcoin network is, however, distinct from P2P file sharing
    networks. Bitcoin is not intended to find specific data objects to spread the
    data as quickly as possible and reach consensus over the network. P2P network
    structure is suited best for Bitcoin. Apart from this, the distributed model is
    used for data transmission, data storage, and data confirmation.


    # ## 2.3 SUMMARY OF BITCOIN SYSTEM


    The Bitcoin network is a worldwide decentralized consensus network built on a
    P2P architecture over the Internet. This network is formed across the world by
    individual nodes that run the Bitcoin core. Bitcoin core is an open-source software
    that'
