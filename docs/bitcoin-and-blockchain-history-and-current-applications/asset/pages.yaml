- pgno: 149
  md: '# 8.7.6 FUNCTION TYPES


    In solidity, several function types affect the behavior and execution of a function.
    Let''s discuss them one by one.


    +   - **A. Public:** Public functions can be accessed directly from outside. They
    develop as members of the smart contract interface. They can be called from within
    or even externally.

    +   - **B. Private:** Private functions can only be called inside the contract.
    They are inaccessible by the other contracts, not even within the derived contracts.
    Unlike the public, these functions are not members of the smart contract interface.

    +   - **C. Internal:** Internal functions like private cannot be accessed from
    outside. They can only be used within the contract they are defined in or with
    the contracts inheriting from it, without using “this” keyword. These functions
    are also not members of the smart contract interface.

    +   - **D. External:** External functions can be accessed directly externally,
    but not internally. They can be accessed easily by other contracts or via transactions
    [10]. These functions are members of the smart contract interface.

    +   - **E. View:** View functions are those that remain unchanged. So, we can
    use the terms “view” and “constant” interchangeably. View function returns data
    but does not modify the contract data.

    +   - **F. Pure:** Pure functions cannot modify or read the contract’s data. They
    are unauthorized to read state or transaction variables [11].

    +   - **G. Payable:** Payable functions are utilized to accept payment in the
    form of ethers. Whenever a payable function is used by some outside entity, it
    attempts to send some money with it. This function call will fail if required
    ethers [11] are not sent.


    # 8.7.7 FALLBACK FUNCTION


    A fallback function is a nameless function. It neither accepts an argument nor
    returns any data. It is evoked when a contract receives anonymous ethers or when
    the given function identifier is undefined. A smart contract can maintain only
    one fallback function. If a contract is expected to receive some ethers, then
    its fallback function must include the “payable” keyword.


    Let''s understand this with the example in Figure 8.17.


    In the above example, we have defined a contract “Test.” It holds a fallback function
    that increments x value for each invalid function call. The contract “Caller”
    shows how to call a function that does not exist, incrementing the value of x
    on each call.


    # 8.7.8 FUNCTION OVERLOADING


    Solidity supports function overloading. Function overloading is a feature that
    supports two or more functions with the same name but different functionalities.
    It occurs when functions with the same name have different return types or a number
    of arguments [5].


    Refer to the example in Figure 8.18 to understand function overloading in solidity.'
