    # 3.8  SHA-256


    SHA-256 is a cryptographic hash function which takes an input of any size and
    produces a fixed-size output [8]. Hash functions are more powerful because they
    are unidirectional, i.e., if an input is given, an output can be generated by
    anyone. Nevertheless, the input value can’t be recreated using the hashed output
    value. The powerful nature of SHA-256 makes it perfect for blockchain applications.


    # 3.9  HOW BLOCKCHAIN WORKS


    Blockchain is a distributed, decentralized public ledger that records transactions
    across the network (see Figure 3.8). The way in which blockchain works can be
    explained with an example. Let’s say, User A needs to send money to User B. To
    make this monetary transaction, A needs to know B’s wallet address. A wallet'
