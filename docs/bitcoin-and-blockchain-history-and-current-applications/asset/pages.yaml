    # 8.1  INTRODUCTION


    Solidity [1] is a statically typed, contract-oriented, high-level language that
    is used to code smart contracts [2, 3], which are functions that control the transfer
    of funds based on certain conditions. Solidity develops a machine-level code that
    executes on Ethereum Virtual Machine (EVM) [4], a distributed blockchain-based
    platform. It has many similarities with advanced programming languages like C,
    Python, and JavaScript. It supports various libraries, complex user-defined data
    types, and Object-Oriented Programming (OOP) concepts like inheritance, among
    several other features. Some use cases of Solidity-coded smart contracts are systematic
    voting, auctions, lottery, etc.


    In this section, we will focus on the basics of Solidity programming, and in the
    upcoming sections, we will learn more about smart contracts and EVM.


    # 8.2  ENVIRONMENT SETUP


    There are quite a few platforms and methods to work with solidity language. Some
    of them are:


    +   **a. Remix Online Editor**

    +   Online Editors, such as Remix, are recommended for small and quick projects.
    It renders a good range of solidity versions. It provides an environment to code,
    compile, and deploy smart contracts. Remix online editor is available at: “https://remix.ethereum.org”


    +   **b. npm / Node.js**

    +   Solidity compiler, solcjs, is also installed by npm using the command:


    ```

    ```bash

    $sudonpm install -g solc

    ```

    ```


    +   **c. Docker Image**

    +   Docker Image can be fetched for solidity programming using the command:


    ```

    ```bash

    $docker pull ethereum/solc:stable

    ```

    ```'
  merge: -1
  img_proc: true
