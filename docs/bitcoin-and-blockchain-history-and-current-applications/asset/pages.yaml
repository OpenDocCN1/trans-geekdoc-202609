    # 13.1  INTRODUCTION


    Crowdfunding [1,2] is the practice of funding a project or venture by raising
    small amounts of money from a large number of people, typically via the Internet.
    Crowdfunding is a form of crowdsourcing and alternative finance. In 2015, a worldwide
    estimate totaling over US$134 billion was raised by crowdfunding. Although similar
    concepts can also be executed through mail-order subscriptions, benefit events,
    and other methods, the term crowdfunding refers to Internet-mediated registries.
    This modern crowdfunding model is generally based on three types of actors: the
    project initiator who proposes the idea or project to be funded, individuals,
    or groups who support the idea, and a moderating organization (the “platform”)
    that brings the parties together to launch the idea, which is raising small amount
    of funds for a project from large people via Internet. It is an alternative form
    of finance. It supports entrepreneurship and bring the innovative ideas of people
    into life [2]. Although similar concepts can also be executed through mail-order
    subscriptions, benefit events, and other methods, the term crowdfunding refers
    to Internet-mediated registries. This modern crowdfunding model is generally based
    on three types of actors [1]: the project initiator who proposes the idea or project
    to be funded, individuals or groups who support the idea, and a moderating organization
    (the “platform”) that brings the parties together to launch the idea. There are
    so many crowdfunding platforms in which Kickstarter [3, 4] is one of the most
    famous and widely used platforms. The Kickstarter is taken as a case study and
    explains its functioning and issues with it.


    Crowdfunding [5–7] has been used to fund a wide range of for-profit, entrepreneurial
    ventures such as artistic and creative projects, medical expenses, travel, or
    community-oriented social entrepreneurship projects. “Kickstarter” [3, 4] is one
    of the famous crowdfunding platforms, which was taken as a case study and explained
    its working, problems and issues and how the blockchain technology solves these
    issues.


    # 13.2  KICKSTARTER


    Kickstarter [3] is an American public-benefit corporation based in Brooklyn, New
    York, that maintains a global crowdfunding platform focused on creativity and
    merchandising. The company’s stated mission is to “help bring creative projects
    to life.” Kickstarter has reportedly received more than $1.9 billion in pledges
    from 9.4 million backers to fund 257,000 creative projects, such as films, music,
    stage shows, comics, journalism, video games, technology, and food-related projects.
    People who back Kickstarter projects are offered tangible rewards or experiences'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'in exchange for their pledges. This model traces its roots to subscription
    model of arts patronage, where artists would go directly to their audiences to
    fund their work. The main mission of Kickstarter community is to help bring creative
    projects to life. They measure their success as a company by how well they achieve
    that mission, not by the size of their profits. The report further focuses on
    the Kickstarter platform in the Literature survey. Then the report elaborates
    on the implementation of the crowdfunding with the use of blockchain platform
    Ethereum.


    Kickstarter is a crowdfunding platform that allows users to raise money for a
    project and typically provides rewards for the backers. For example, if someone
    posts an idea of building a smart-watch with its description, usage, benefits,
    cost, the time for making it and rewards that a backer gets based on the contribution
    is specified. The people who likes the idea will fund the project by contributing
    some amount of money. When sufficient funding is reached, the person will start
    making the project and deliver it within the time he specified. After successful
    completion of product, the rewards will be sent to the people who supported to
    the project based on their contribution.


    A Kickstarter [3, 8] project page should have a video and description that clearly
    explains what are they building, the motivation behind making it, why are they
    creating it, the minimum amount of money required for producing the product, the
    deadline for funding, and the rewards that a contributor will receive when the
    product is completed. The progress of manufacturing the product should be constantly
    updated in the project page. If the funding did not reach the sufficient amount
    by the deadline, no funds are collected. Only when the funding goal is reached
    the backers credit card will be charged.


    Kickstarter charges a fee of 5% of the total funds raised on a project. And also,
    there is an additional fee of 3%–5% will be debited to process the payments. Kickstarter
    claims no proprietorship or control on the projects and the work generated by
    the project creators. The project pages on the website are stored forever and
    are available for the public. After sufficient funding is achieved, projects and
    uploaded content cannot be modified or deleted from the site. In the following
    section, a flow chart of the working functionality of Kickstarter platform is
    given, refer Figure 13.1.


    # 13.3 GUIDELINES IN KICKSTARTER


    To maintain its focus as a funding platform for creative projects, Kickstarter
    has outlined three guidelines for all project creators to follow: creators can
    fund projects only; projects must fit within one of the site’s 113 creative categories;
    and creators must abide by the site’s prohibited uses, which include charity and
    awareness campaigns [3, 8]. Kickstarter has additional requirements for hardware
    and product design projects. These include:


    +   - Banning the use of photorealistic renderings and simulations demonstrating
    a product.

    +   - Banning projects for genetically modified organisms.

    +   - Limiting awards to single items or a “sensible set” of items relevant to
    the project (e.g., multiple light bulbs for a house).

    +   - Requiring a physical prototype.

    +   - Requiring a manufacturing plan.'
