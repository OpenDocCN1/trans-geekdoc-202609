    # ## 2.11 BITCOIN NETWORK ATTACKS


    Distributed Denial-of-Service (DDoS) is the most common networking attack. This
    attack mainly aims at the financial services of Bitcoin like eWallets, mining
    pools, Bitcoin currency exchanges, etc. It is difficult to implement DoS attack
    on Bitcoin network as it is distributed in nature. A single user launches the
    attack in DoS, whereas multiple users simultaneously launch the attack in DDoS.
    DDoS attacks are not much expensive but have the potential to disrupt the network
    at a higher level. In DDoS, the attacker aims at the honest miners and tries to
    take them out of the network so that malicious miners can be included in the network.
    It is observed that DDoS attacks on larger pools make a huge profit to the attacker
    than attacking individual or smaller mining pools.


    Malleability attacks also aid DDoS attacks. The attacker can congest the transaction
    queue using *malleability attacks*. Transaction queue contains all pending transactions
    to be examined by the network. However, the attacker will create a fake transaction
    by keeping it as a high-incentive one. Thus, the miners are diverted to check
    this transaction and identify it as a fault transaction. By the time they realize,
    their time and effort must have been spent already. Malleability attack aims to
    waste the time and resources of peers in the network.


    Bitcoin network is susceptible for routing attacks as well. Apostolaki et al.
    [14] discussed the effects of small- to large-scale routing attacks. Bitcoin’s
    properties such as ease of routing and increased Bitcoin centralization with respect
    to routing and mining capability make it more vulnerable to the refund attacks.
    It is observed that the attacker who has taken control of <100 BGP prefixes can
    divide about half of the mining power.


    Bitcoin payment protocol suffers weak refund policies which may lead to *refund
    attacks*. Such an attack on BIP70 payment protocol has been demonstrated successfully.
    BIP70 is the most commonly used payment protocol, and most of the wallets use
    this for Bitcoin exchange. The leading payment processors Coinbase and Bitpay
    use BIP70 for payment to more than 10,000 merchants. Refund attacks are two types:
    (i) Silkroad attack and (ii) Market-place trader attack. They deal with the weakness
    of existing payment policies in authenticating and manipulating.


    *Time jacking attack* is another attack on Bitcoin networks. This attack manipulates
    the timestamps of the block by changing the network time with system time. As
    the creation of new blocks depends on network time counters, the attacker can
    deceive the node in accepting another blockchain if there are inaccurate timestamps.
    This attack may result in double spending, loss of miner resources, and reduced
    rate of verification of transactions.'
