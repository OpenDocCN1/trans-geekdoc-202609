    # 11.1 INTRODUCTION


    Blockchain! Now a days, it has become a buzzword. What is special about it? Why
    and how blockchain is a breakthrough technology? Before finding answers to these
    questions, we will understand the different problems faced by the enterprises
    during the time. Prior to 2008, enterprises specifically working with database
    applications over the networks were facing problems like nonrepudiation, maintaining
    transparency, unauthorized updation/alteration, and security of these transactions
    against unauthorized utilization. These enterprises were heavily dependent on
    third parties to tackle these issues. Although we are discussing about enterprises
    in general, specifically financial institutions were the major concern about these
    problems and their solutions. This is the reason in 2008, blockchain technology
    was introduced to the world in the form of cryptocurrency application [1].


    Blockchain is a technology that breaks these process hurdles and gets through
    the transactions successfully in a cost-effective and efficient way. This is the
    reason why it is a breakthrough technology. It is a chain of uneditable blocks
    of fixed sizes. These blocks are holding the transaction data up to 1MB [2]. Before
    preparing the blocks of transactions, these transactions were approved by the
    users in the network. Such prepared blocks are then attached to the previously
    created blocks to continue as a chain of blocks. Transaction information after
    adding every block in the chain is distributed across networks and is available
    to everyone. This process is carried out without intermediaries like financial
    institutions, government and non-government organizations. Blockchain carries
    all the work with encryption-based hash values. All the users in the network are
    sharing the details on the basis of peer-to-peer (P2P) network, where all the'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'nodes are working at the same level. Every user in the blockchain network saves
    local copy of the blockchain. When consensus validates the transaction in the
    group, then it will be added as the block of transaction in the blockchain. All
    this is done by taking care of privacy of the resources involved in the transaction.
    This technology involves "smart contracts" [3] automatically through computer
    programs.


    The specialty of the blockchain is the availability of this uneditable information
    to everyone giving transparency to the transactions across business applications.
    This is really beneficial to both enterprises and their stakeholders, where enterprises
    are delivering values through networks. It is like Distributed Ledger Technology
    (DLT) [4] but a bit different from it [5]. Both these technologies are working
    with decentralized networks, but in DLT, the owner/user is having more control
    over the networks, and information in the network is stored on different servers.
    In DLT, every node in the network will have its ledger and it will get updated
    immediately after the transaction at node level independently. In blockchain after
    approving transaction by consensus, blocks are prepared in cryptic format, and
    these are added to the chains of blocks based on certain hash functions to form
    the blockchain. We can say blockchain is one of the DLT. Figure 11.1 depicts the
    philosophy.


    # 11.2 BLOCKCHAIN WORKING


    Blockchain is decentralized and distributed ledger of blocks. These blocks are
    nothing but validated transactions by the participating nodes in the networks
    that cannot be modified or deleted after creating blocks. Blocks in the blockchain
    hold:


    +   - Transaction data – Block version number, timestamp, and transaction details.

    +   - Signature of the last block.

    +   - A Nonce is the abbreviation of a number used only once and is a random string
    of number generated by miner, which is appended to encrypted block.


    Figure 11.2 depicts the typical block in the blockchain.


    ![](img/115a7d47166d21dfa1d1dc5986da244b_202_0.png)


    FIGURE 11.1 DLT and blockchain relationship.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/115a7d47166d21dfa1d1dc5986da244b_203_0.png)


    FIGURE 11.2 Typical block structure in blockchain.


    Sufficient miners from the network nodes approve these transactions. Miner node
    with sufficient computational power can find the eligible signature to generate
    the blocks. These miner nodes use special hardware to attain computational power.
    This process is nothing but mining process. Mining process is done with proof-of-work
    (PoW) philosophy/protocol [3]. PoW is a protocol that calculates random hash value
    data from the block, which is very complicated and time-consuming computation
    process. After approval of transactions from miner, block will be appended to
    the chain as a new block. Miners upon creating new blocks will be rewarded with
    some sort of incentives in the form of Bitcoin.


    As PoW is complicated computation and consumes a lot of computational resources,
    “Proof of Stake” (PoS) philosophy/protocol [6] was used as an alternate option,
    where miners were rewarded based on how much stake they are holding while mining
    the block.


    “Delegate Proof of Stake” (DPoS) [7] is another form of PoS [8] in which blockchain
    users elect their delegate. This elected delegate node can generate and validate
    the blocks.


    “Practical Byzantine Fault Tolerance” (PBFT) [7] is another protocol to mine the
    block. This protocol is used to take care of malicious activity in the blockchain.
    Blocks are mined in the rounds. In each round, rule-based new primary will be
    selected. This primary is responsible for mining the block. This process will
    be conducted in three steps – pre-prepared, prepared, and commit. To prevent malicious
    activity during each step in a round, primary has to receive consent of two-thirds
    of total nodes.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '“Ripple” [7] is another protocol to generate nodes. It will create trusted
    sub-network in the blockchain. and based on the consent of these trusted subnetwork
    nodes, it will create the block. Under this protocol, blockchain network will
    be divided into two parts – servers and clients. The role of server is to carryout
    consensus process, while the role of clients is to transfer funds. Each server
    in the chain maintains Unique Node List (UNL). The server asks UNL about the transaction
    validity, if it 80% and above, UNL agrees and then transaction will be validated
    and added into the blockchain. Blockchain process is depicted in Figure 11.3.


    Blocks may be generated simultaneously as multiple miners may find a suitable
    nonce at the same time. It may create another chain in the blockchain but defined
    protocol will consider only longer chains as authentic chain.


    Each added block in the blockchain contains hash value from the previous block.
    If we try to alter the contents of the block, it will change hash value of the
    current block. This change of hash value mismatches with the hash value reflected
    in the immediate block making it unchain from the blockchain. If this altered
    transaction is accepted in the chain, it needs to be chained in subsequent blocks
    by changing hash value of every succeeding block in the chain, which is highly
    impossible. This makes blockchain as immutable [4]. In this way, blockchain first
    validates the transaction and safeguards it, and at last, these entries are preserved
    as records. Transaction in the blockchain is protected using digital signature
    based on public and private key mechanism. Blockchain structure is depicted in
    Figure 11.4.


    ![](img/115a7d47166d21dfa1d1dc5986da244b_204_0.png)


    FIGURE 11.3 Adding block in the blockchain.'
  merge: -1
  img_proc: true
