  md: '# 12.3.2.2 Consortium


    A consortium is a group on the blockchain network of non-ordering organizations.
    These are the channel-forming and entering organizations and their own peers.
    While there may be several consortia for a blockchain network, most blockchain
    networks have one consortium. All entities introduced to the network must be part
    of a partnership at the time of the creation of the channel. Nevertheless, an
    entity may be linked to an existing network that is not specified in a consortium.


    # 12.3.2.3 Membership Service Provider (MSP)


    MSP is like an abstraction layer to all cryptographic mechanisms and procedures
    behind issuing, validating, and authenticating certificates, which are issued
    by the Certification Authority to access a network. MSP can use one or more Certificate
    Authorities; these interfaces are configurable. The Fabric-CA API (application
    programming interface) is the default interface used for the MSP. This is another
    modular feature of Hyperledger Fabric. An MSP can define its own regulations attributing
    their identities.


    MSP’s responsibility is to validate and authenticate an identity, i.e., the generation
    and verification of transaction signature. More than one MSP can govern a Fabric
    network. It ensures modularity and interoperability of membership processes across
    various membership standards and architectures. Fabric supports various certificate
    architectures that facilitate the use of interfaces from the External CA that
    allow organizations to bring in their own trusted authorities.


    # 12.3.2.4 Certificate Authority (CA''s)


    An individual or node may participate in the network through a digital identity
    provided for it by a system trusted authority. Digital identities or simply identities
    have, in the most common case, the form of cryptographically authenticated digital
    certificates that follow the X.509 standard and are provided by a CA.


    Certificates are issued by a Certification Authority to various actors. The CA
    signs these certificates electronically and links the actor to the actor’s public
    key (and optionally to a specific property list). Therefore, if you trust the
    CA (and know its public key), you can assume that a particular actor is bound
    to the public key included in the certificate and retains the attributes included
    by validating the CA signature of the actor.


    # 12.3.2.5 Channels


    Channel is one of the most important concepts of Fabric network. Channels allow
    the same network to be used by organizations while maintaining complete isolation
    among multiple blockchains. It''s like a big blockchain branch. Only the channel
    participants on whom the transaction was performed can see the transaction’s details.


    Figure 12.1 depicts how Fabric supports multiple channels in a single main network.
    Each channel will have its own ledger completely isolated from one another, including
    the main network. Transactions within a channel will not affect transactions in
    another channel and same goes to ledgers'
