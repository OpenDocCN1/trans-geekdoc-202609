  md: "# 8.4.2.2 Local Variables\n\nVariables that are declared inside function scope\
    \ are called “Local variables.” These cannot be accessed outside the function.\
    \ The values of local variables are not saved between different function calls.\
    \ Notice the code shown in Figure 8.3 to understand local variables in solidity.\n\
    \n# 8.4.2.3 Global Variables\n\nVariables that exist permanently in a global namespace\
    \ are called “global or special variables.” They provide details related to blockchain\
    \ [6, 7] and other utility functions, i.e., transaction properties. Some block\
    \ and transaction properties are shown in Table 8.3.\n\n```\n```solidity\npragma\
    \ solidity ^0.4.17;\ncontract SolTest {\n    uint Data;    // State variable\n\
    \    constructor() public {\n        Data = 15;  // Using State variable\n   \
    \ }\n    function getAnswer() public view returns(uint){\n        uint x = 5;\
    \ // local variable\n        uint y = 6;\n        uint answer = a * b;\n     \
    \   return answer; //access the local variable\n    }\n}\n```\n```\n\n# FIGURE\
    \ 8.3 Local variables.\n\n# TABLE 8.3\n\n# Block and Transaction Properties\n\n\
    | Name | Returns |\n|---|---|\n| blockhash (uint blockNumber) returns (bytes32)\
