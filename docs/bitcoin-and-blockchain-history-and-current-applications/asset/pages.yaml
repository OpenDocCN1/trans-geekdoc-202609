    # 12.4.4.2 Organizations


    In the configtx.yaml as shown in Figure 12.20 the organization data represents


    +   - Name is the key by which this org will be referenced in channel.

    +   - ID is the key by which this org’s MSP definition will be referenced.

    +   - MSPDir contains about the path which contains the MSP configuration.

    +   - Policies defines the set of policies at this level of the config tree.

    +   - Anchor Peers is used to define all the peers a host location and port number,
    which can be used for cross-org gossip communication.


    # 12.4.4.3 Capabilities


    Since Hyperledger Fabric is a distributed system that will involve multiple organizations,
    there is a chance that different version of Fabric may exist in different nodes
    within the Fabric network and on channels in the Fabric network as shown in Figure
    12.21.


    +   - Channel: These capabilities apply to orderers and peers and must be supported
    by both.

    +   - Orderer: These capabilities apply to the orderers and may be safely used
    with prior release peers.

    +   - Application: These capabilities apply to the peer network and may be safely
    used with prior release orderers.


    # 12.4.4.4 Channel Defaults


    Channel Defaults defines the values that are to be encoded into a config transaction
    or genesis block for channel-related parameters as shown in Figure 12.22


    Policies:


    +   - Readers: Who may invoke the “Deliver: API.

    +   - Writers: Who may invoke the “Broadcast” API.

    +   - Admins: By default, who may modify elements at this config level.'
