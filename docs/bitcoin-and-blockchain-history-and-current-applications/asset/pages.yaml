  md: "# 8.8.2 **STATE VARIABLES**\n\nThese are used to store the state of the variables.\
    \ We have discussed state variables in the previous sections of this chapter.\n\
    \n# 8.8.3 **FUNCTION**\n\nFunction changes the state of the contract by modifying\
    \ the state variables. We have also discussed functions in the previous sections\
    \ of this chapter.\n\n# 8.9 **EVENTS**\n\nAs we know, blockchain transactions\
    \ are stored in blocks. Each transaction has some logs associated with it. A log\
    \ records details of an event as they occur. An event in solidity holds the current\
    \ status of the contract. It is stored in the form of logs. Events are declared\
    \ globally in a contract and will be triggered from within its function. To declare\
    \ an event, use the keyword “event” followed by an identifier and a list of parameters.\
    \ And to emit an event, use the “emit” keyword followed by the event name and\
    \ the arguments in parentheses.\n\nLet’s understand this with the help of the\
    \ example in Figure 8.21.\n\n# 8.10 **ERROR HANDLING**\n\nContracts in Solidity\
    \ are compiled into bytecode. While writing contracts, we come across various\
    \ errors. Unusual errors may occur at runtime or design time. The design level\
    \ checks for any syntax errors while compiling. But it is harder to detect any\
    \ runtime errors as they occur during the execution of a contract. Thus, it is\
    \ crucial to check a contract for possible runtime errors. Hence, for reducing\
    \ runtime and design time errors, a contract should follow a clean and robust\
    \ fashion.\n\nSolidity supports various methods for error handling. Some of them\
    \ are listed in Table 8.9.\n\n# **CONCLUSION**\n\nThe solidity language is developed\
    \ as a need for deploying smart contracts on the Ethereum Network. Solidity, a\
    \ contract-oriented, high-level language, is used for writing smart contracts\
    \ easily and efficiently. It develops a machine-level code that\n\n```\n```solidity\n\
    pragma solidity ^0.5.0;\n\ncontract TestEvent {\n    event Deposit(address indexed\
    \ _from, bytes32 indexed _id, uint _value);\n    function deposit(bytes32 _id)\
    \ public payable {\n        emit Deposit(msg.sender, _id, msg.value);\n    }\n\
    }\n```\n```\n\n**FIGURE 8.21**  Events in Solidity."
