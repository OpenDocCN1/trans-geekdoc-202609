    # 10.1.5 BLOCKCHAIN


    BCT acts as human memory, which secures data and keeps record for every data transaction
    among the users. Blockchain was first used in Bitcoin, and in the recent past,
    there are lots of interest in using the blockchain-based application for secure
    and safe data delivery in many fields such as healthcare data [4, 28,64], e-healthcare
    data sharing [2,60], biomedical [38], thinking and brain simulation. The blockchain
    uses peer-to-peer network, to obtain the distributive nature in public digital
    ledger. It consists of cryptography for protecting the data blocks of the user
    during transaction. Blockchain is designed to solve the limitations of synchronization
    in the distributive traditional database with the help of algorithm of distributive
    consensus. The basic characteristics of the BCT are open source, anonymity, transparent,
    decentralized, immutable, and autonomy as shown in Table 10.1.


    People who involve in the blockchain network verify every new transaction that
    has been carried out. All the transaction blocks are verified by each network
    nodes and turn into immutable. The workflow process of the blockchain is shown
    in Figure 10.1.


    In the near future, BCT would give potential help in reliable, secure, and personalized
    healthcare system by merging present up-to-date data of healthcare system


    **TABLE 10.1**

    **Characteristics of Blockchain and Its Description**


    | Characteristics | Description |

    |---|---|

    | Open source | The blockchain is an open-source network that provides access
    for all the people in connection to network. This feature not only allows anyone
    to check public records but also allows to develop and design various applications
    based on blockchain. |

    | Anonymity | When a data is transacted from one node to another node, identity
    and details of both the parties remains anonymous. Hence, the blockchain becomes
    more reliable and secure system. |

    | Transparent | The stored and recorded data present in blockchain are transparent
    to capable users. This property helps to prevent the alteration of data or data
    being stolen. |

    | Decentralization | The data in the database can be monitored, accessed, updated,
    and stored on many different systems at the same time. There is no single centralized
    authority to manage data instead it has open access for anyone who are connected
    to network. |

    | Immutable | Once the record is stored in the blockchain, it stays there forever,
    they can''t be easily modified without the control of concurrent nodes which is
    more than half of nodes. |

    | Autonomy | Blockchain is autonomous and independent, which means that any node
    in blockchain network can transfer, access, update, or store data in a safe and
    secure way. Thus, it makes the system free of external and intervention more trustworthy.
    |'
