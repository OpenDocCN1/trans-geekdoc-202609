    \ functions similar to JavaScript array, i.e., we can modify its length by adding\
    \ or removing an element. Its size is not predefined at declaration.\n\n```\n\
    Syntax: type [ ] arrName\nExample: uint[ ] storage\n```\n\nWhile declaring a dynamic\
    \ array, we do not specify its length in the square brackets. This implies that\
    \ we are designing an array whose length can stretch or shrink according to the\
    \ requirement [6].\n\n# ### 8.6.1.3 Array Properties\n\nArrays in solidity hold\
