    \ mapName\nExample: mapping (int => storedData) storage\n```\n```\n\nA search\
    \ inside of mapping is referred to as constant search time because no matter how\
    \ many pieces of data we are storing inside the mapping, it is always going to\
    \ take the same amount of time to execute a search.\n\n# 8.6.2.1 Mapping Gotchas\n\
    \n+   A. In mappings, keys are not stored, which means that we cannot get a list\
    \ of keys in mapping. Let’s understand this using an example:\n\n```\n```javascript\n\
    const info = {\n  name: 'John',\n  age: 21,\n  country: 'India'\n};\nObject.keys(info);\n\
    ```\n```\n\nOutput:\n\n```\n```text\n[\"name\", \"age\", \"country\"]\n```\n```\n\
    \nThis is a normal JavaScript object that lists out all information about a person.\
    \ We can easily retrieve all the keys and values of an object. But the same is\
    \ not true in the case of mapping in solidity. In solidity, we work with a classic\
    \ data structure called “hash table.” The hash table has a lookup process, as\
    \ explained in Figure 8.5."
