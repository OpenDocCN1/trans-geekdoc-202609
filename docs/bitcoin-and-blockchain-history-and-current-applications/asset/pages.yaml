- pgno: 74
  md: 'There is no central authority to issue or control the Bitcoins, but it is created
    by a process called *mining*. Mining is a process in which all legitimate transactions
    are stored in blocks and included in the register called “blockchain.” The added
    blocks are linked to the previous blocks so that reusing of Bitcoins can be prohibited.
    To add a block to the blockchain, a peer requires a nonce value that satisfies
    a particular equation using SHA-256 cryptographic hash function. Finding a nonce
    value is a computationally expensive task. So, a node who finds the suitable nonce
    value will be rewarded with an incentive. Nevertheless, this method of verifying
    a transaction might be confusing when each node attempts to relay its found block.
    Hence, to avoid such situation, a consensus algorithm is made between all peers
    in the network to decide which blocks should be added, which peers should be allowed
    to include the block, and so on.


    Consensus algorithms aim to safely update repeated distributed states and are
    the key piece of the puzzle in the operating principles of the blockchain. Consensus
    protocol assures that copies of the shared state are synchronized and accepted
    in blockchain at any given time. According to Refs. [1] and [2], the deterministic
    consensus in entirely asynchronous models of communication cannot recognize any
    faults. Therefore, partial synchronization assumptions are required with maximum
    transaction propagation latency thresholds. Cryptography and partial synchrony,
    digital currency and precursor designs are some of the previous works on consensus
    protocols. These were the building blocks of blockchain networks to create “decentralized”
    consensus algorithms.


    Several consensus algorithms have been proposed till date, which will be discussed
    in later sections of this chapter.


    In 2009, many variations of Bitcoin, such as Ethereum [3] and Nxtcoin [4], were
    introduced. A variant in which anyone can join and leave the network anytime is
    called “public blockchain.” Since the nodes can join and leave anytime, it is
    hard to predict the exact number of nodes; hence, applying the concept of consensus
    is difficult. In case the number of nodes is too high, exchanging the agreement
    and taking consensus of all nodes is even more difficult. On the other hand, to
    add a block in a blockchain, the nodes have to prove their quality compared with
    other nodes. Hence, a consensus algorithm named “proof-based consensus” was proposed.


    Proof of work (PoW) [5] is the first version of a proof-based algorithm. In this
    consensus algorithm, a node can broadcast their blocks over the network using
    their computing resources. Later several other proof-based algorithms such as
    Proof-of-Stake (PoS), Proof-of-Elapsed Time, Proof-of-Space, and Proof-of-Luck
    were also proposed. Noticing blockchain’s ability, many major organizations such
    as JP Morgan and IBM have begun to explore the technology. This gave rise to many
    other platforms in blockchain like private blockchain, consortium blockchain,
    etc. Unlike public blockchain, private blockchain allows nodes only from a single
    organization to involve in the verification process. In consortium blockchain,
    the nodes can be from different consortiums, but only permitted nodes are allowed
    in the network. Consensuses on these platforms are based on the results of majority.
    Hence, they are otherwise called as “voting-based consensus algorithm.” Nodes
    following voting-based consensus algorithm can either be (i) a crush fault tolerance
    or'
  merge: -1
