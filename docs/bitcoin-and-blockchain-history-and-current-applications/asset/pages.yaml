    network. Sometimes the attacker hides or changes his identity and performs collision
    attacks using the compromised nodes. In collision attack, the attacker separates
    an honest miner and detaches the transactions initiated by the miner or manipulates
    the miner to choose the blocks that are supported by the attacker. If no miner
    approves a transaction, then it may be used for double spending attack.


