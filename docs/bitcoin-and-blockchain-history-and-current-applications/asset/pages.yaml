- pgno: 43
  md: 'enables consensus using a process called “mining.” Through Bitcoin mining,
    the transactions are validated and recorded in an unchangeable, irreversible,
    distributed ledger called “blockchain.” Bitcoin network allows transfer of digital
    money among the users.


    Bitcoin is a digital money based on account entries. Bitcoin, therefore, cannot
    be perceived as digital currency but as balance of Bitcoin account. Bitcoin account
    is a key pair based on elliptic curve cryptography. The Bitcoin account can be
    located based on its address. The Bitcoin address can be generated using a public
    key. Any user can send Bitcoins based on the public information available to every
    other user. But to spend the Bitcoins, one needs a private key. A special software
    named “wallet” is used to create and manage this public–private key pair.


    Payment happens between Bitcoin accounts through transactions. A Bitcoin transaction
    needs an input which is the source Bitcoin account’s address and an output which
    is the destination address. A transaction can have one or more inputs and one
    or more outputs. From each input address, the amount of Bitcoins to be transferred
    is mentioned in transactions. Similarly, the amount to be transferred to each
    account from the destination address will also be available in the transaction.
    The source address is enforced to spend the exact amount received from the earlier
    transaction. Each input must, therefore, include the previous transaction identification
    number and the output index. As a result, at any point the output may either be
    spent or not spent. The output not expended is called Unspent Transaction Output
    (UTXO).


    To authorize any transaction, the user of the input address must generate a digital
    signature using his private key. This process is to ensure the ownership of the
    account. The user who is at the receiving end has to (i) validate the digital
    signature for its correctness and (ii) validate the Bitcoins are not spent in
    any previous transactions before agreeing to the payment.


    # 2.4 BITCOIN NODES


    Although the nodes in the Bitcoin network are all identical, they can play various
    roles in the network based on the functionality they support. A Bitcoin node is
    a database consisting of a ledger, routing functions, mining, and wallet services.
    Figure 2.1 shows a full node with all functionalities.


    A node that holds the whole blockchain up-to-date is called “full node,” while
    few nodes only retain the blockchain subset and validate the transactions using
    a method called “simplified payment verification” or SPV. They are otherwise called
    as lightweight nodes. Mining nodes are aimed at creating new blocks to solve the
    proof-of-work (PoW) algorithm by having a special hardware. Some mining nodes
    are full nodes, while few are SPV nodes which are involved in pool mining. User
    wallets are nothing but Bitcoin clients and are part of full node. Wallets which
    are installed in resource-limited devices such as smart phones are considered
    as SPV nodes. Other than the main nodes, there are several other protocols run
    by the servers and nodes. These protocols can be mining pool protocols or lightweight
    client access protocols. The different types of nodes are mentioned in Table 2.1.'
