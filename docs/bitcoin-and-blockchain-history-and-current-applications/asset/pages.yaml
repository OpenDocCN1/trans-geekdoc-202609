    # 2.1 INTRODUCTION


    The most interesting feature of Bitcoin is its decentralized environment. Bitcoin
    is an unstructured peer-to-peer (P2P) decentralized digital currency. As Transmission
    Control Protocol (TCP) connections are the basic communication structure, Bitcoin
    is built on them. Bitcoin was invented by Satoshi Nakamoto in 2009 [1]. Transactions
    are carried out between Bitcoin users. All transactions over the Bitcoin network
    are recorded on a transaction log called “blockchain.” The key feature of a currency
    is robustness and security. Cryptocurrencies attain these properties through a
    decentralized approach and cryptographic techniques. A decentralized method overcomes
    issues such as single-point failure and single source of trust, and increases
    the disagreement among different parties. Nevertheless, cryptocurrency uses a
    distributed mechanism that allows the device to maintain an unambiguous view of
    its state in order to reach consensus among users.'
