    # 1.4 TRANSACTION


    A publicly available database records every cryptocurrency exchange. Every Bitcoin
    has an address called Bitcoin address. Transfer of Bitcoins from one Bitcoin address
    to another is a transaction. Transactions that are yet to be recorded and most
    recent transactions are stored in blocks. Every time a block is completed, it’ll
    bring a new block into picture. Block generation produces rewards to the users.
    The reward system implements a new, unique transaction in the block as the first
    transaction. This first transaction is labeled as Coinbase transaction. The miner
    is always the creator of that block. A transaction is never completed until it
    gets added in a block. The miners compete to add the block to the existing blocks.
    The process of adding a new block is called mining. Every block comes with an
    incentive. New Bitcoins are generated and issued to the creator of the block at
    each block generation. Transactions are hashed, combined, and hashed once again
    at each block until a single hash value is obtained. This is called Merkle root
    [7]. Merkle root and the hash value of the previous block are stored in the block
    header. A typical Bitcoin transaction structure is given in Figure 1.1.


