    excessive records of transaction can be minimized, thereby reducing the network
    load. After receiving getdata message, user A will send the corresponding transaction
    detail to the neighbor. Once the transaction is verified, it will broadcast the
    same way as user A did, initiating with inv message.


    Bitcoin randomly selects one of every four messages to send inv messages and holds
    the remaining transactions. Thus, every neighbor receives random transactions.
    Although trickling reduces overhead, as in mix networks, it makes traffic analysis
    more difficult. It helps in hiding the creator of transactions. As messages are
    sent out for every 100 ms, there can be a delay in propagation of transactions.
    As Bitcoin trickling aims to transmit information as quickly as possible, it trades
    off overhead and piracy against the transaction of propagation. The user is responsible
    for his/her transaction. If a transaction does not get into a blockchain, then
    the user needs to rebroadcast the transaction and ensure that it gets added in
    the next block.


    Three different types of relay patterns are detected from a highly connected peer.
