    get transactions publicized on the blockchain, transaction fees increase to rates
    that discourage the use of Bitcoin, illustrating a major structural issue facing
    the blockchain.


    # 1.7 BITCOIN DEVELOPMENT ENVIRONMENT


    Bitcoin is an open-source mission, and MIT holds the license for its source code.
    Bitcoin Core can be downloaded for free. A community of volunteers had created
    the Bitcoin project. Initially, only Satoshi Nakamoto was there in the project.
    Later by 2016, it had around 400 contributors with a handful of developers and
    several part-time developers. Bitcoin Core can be regarded as the reference implementation
    of the Bitcoin system by Bitcoin since it is the authoritative reference on how
    to implement each part of the technology. It is labeled as the Satoshi client.
    Bitcoin Core acts as a Bitcoin node, and a collection of Bitcoin nodes form a
    Bitcoin network. Nakamoto initially released the “Bitcoin” software, but to make
    it different from the network, he later renamed it to “Bitcoin Core.” Bitcoin
    Core has all features of Bitcoins such as wallet, block validation engine, transaction,
    and full network node in P2P Bitcoin network.


