  md: '# 5.1 **INTRODUCTION TO THE BLOCKCHAIN TECHNOLOGY**


    Blockchain is the technology that enables its participants to verify existing
    blocks of information and add new ones based on a consensus algorithm. It generates
    time-stamped chunks of information encapsulated in blocks secured by hash signature
    and is immutable by nature. Blocks after blocks get added in the network as it
    increases in size with the addition of new participants and increased frequency
    of usage. A user has to download the blockchain architecture on his computing
    device either partially or in its entirety depending on his intention to use the
    blockchain. Once an information is verified and added to a block, the information
    is open to see for everyone in the blockchain, and hence it is popularly also
    known as the distributed ledger system. The blockchain technology can be used
    for multiple purposes, but it is widely known as the technology used for transaction
    of cryptocurrencies (Bitcoin being one of the most popular cryptocurrency). In
    popular culture, the distinction between blockchain and Bitcoin [1] is vague as
    they are often used interchangeably. However, to say that blockchain and Bitcoin
    are the same is akin to saying that electricity and light bulb are the same. It
    is common knowledge that electricity is the technology that has umpteen applications,
    a light bulb being just one of them. Similarly, blockchain is the technology with
    various applications including Bitcoin.^1 With the passage of time and acceptability
    among user groups, other currencies entered the fray with more applications such
    as smart contracts and other distributed applications.


    # 5.1.1  **BLOCKCHAIN: TYPES OF BLOCKCHAIN**


    Another misconception regarding blockchain at large is that there is one big comprehensive
    global blockchain consisting of information of all transactions. However, this
    is far from truth as there are multiple blockchain networks. The content on those
    networks would be determined by the users maintaining them, e.g., the blockchain
    network trading Bitcoins is a network for peer-to-peer transaction of Bitcoins
    only. Ethereum [2], however, is a different blockchain platform [3] that allows
    users not just to transact ether^2 but also to make and maintain smart contracts^3
    among the


    ^1 Bitcoin is the name of an extremely popular cryptocurrency. A cryptocurrency
    is a virtual asset that can be used in place of fiat currency as a medium of exchange.
    It uses advanced cryptography to escape alteration and duplicity, and ensure security.


    ^2 Ether is the name of the cryptocurrency used on the Ethereum platform. It is
    an alternative currency to Bitcoin.


    ^3 A smart contract is a misnomer because it is not a contract in the real sense
    of the word. It is a condition-based document that executes predetermined actions
    based on fulfillment of the mentioned conditions.


    A very simple example in the field of stock trading would be that an investor
    sets a threshold floor price for a share. No sooner than the stock price falls
    below that threshold price, the sell command would automatically get executed
    and the proceeds of the sale would get deposited in his trading account.


    The next example from the field of supply chain would be that the supplier’s account
    would get automatically credited once the shipment arrives inside the warehouse
    and invoice is signed.'
