  md: '# 1.9.2.3 Tampering


    In a Bitcoin network, once a block is mined, the nodes broadcast the information
    to other nodes. This process happens periodically in the network. The network
    assumes that the information is broadcasted at a fair speed, but the attacker
    may delay the broadcast by creating some congestion in the network. This kind
    of tampering may lead to any of the network attacks discussed above.


    # 1.10 PRIVACY AND ANONYMITY IN BITCOIN


    In traditional models, a trusted third party shares and secures fewer details
    of the users in transaction. However, the trusted party knows all customer information.
    According to Bradbury [15], privacy means the context is hidden, and anonymity
    hides its owner. There are several instances where privacy is highly regarded
    than anonymity and vice versa. The concept of being anonymous is being unidentifiable
    and untraceable. It is difficult to ensure 100% anonymity in traditional models.
    Many applications such as Mixing services, Onion Routing, and The Onion Router
    (TOR) claim to be anonymous but happen to disclose identity information. Anonymity
    and privacy always come with a price. Either the system that claims to provide
    these two requires more resources in time, space, and computation or the user
    has to pay more for being anonymous and private. In Bitcoin, everything is transparent
    and all transactions are shared publicly. Hence, anonymity is provided by keeping
    the public key anonymous, i.e., using pseudonyms for the addresses. Since pseudonyms
    are used, it is assumed that Bitcoin is anonymous.


    Nonetheless, it is widely stated that Bitcoin is not anonymous but described as
    “probably the world’s most open payment network.” All transactions are held in
    public, all users use pseudonyms of their addresses, and everybody in the network
    can track Bitcoin transactions between users. The real identity of users is not
    known as no other information of the users is stored. Even if there is a need
    for revealing identities between users, it will not be informed to any other users
    in the network. The users of Bitcoin cannot remain anonymous entirely, but they
    can be pseudonymous. It is believed that a certain level of privacy can be determined
    by the user while using Bitcoins. Using a new pair of keys (address) for every
    transaction can increase security to a large extent. Because creating a new key
    pair and linking it to every transaction avoids using keys that are linked to
    the previous transactions of the user, and thus the number of Bitcoins the user
    owns cannot be known. Another suggestion is, using multiple wallets for multiple
    purposes which cannot be linked to different transactions. For users who use wallets,
    their wallet transaction and address are tracked by the wallet service hosting
    it. So, it is possible for the hosting service to track the user’s Bitcoin address
    through their IP address and disclose the user’s identity. To prevent this, TOR,
    a popular tool, is used to hide the real IP address. TOR is a distributed overlay
    network consisting of TOR nodes for transmission control protocol (TCP)-based
    applications. TOR is designed based on Chaum’s mixnets. In TOR, data encryption
    happens multiple times and is transmitted through the path over the nodes where
    decryption of each layer happens at each node.'
