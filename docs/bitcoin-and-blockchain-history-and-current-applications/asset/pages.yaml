  md: "# ### 8.6.1.1 Fixed Array\n\nIn solidity, the most primitive array type is\
    \ a fixed array. It is an array with a fixed length. In JavaScript, arrays can\
    \ be resized by appending or removing a record, but the length of the fixed array,\
    \ in solidity, cannot be altered. Its size is predefined at declaration.\n\n```\n\
    Syntax: type arrName [ arrSize ]\nExample: uint storage [10]\n```\n\n# ### 8.6.1.2\
