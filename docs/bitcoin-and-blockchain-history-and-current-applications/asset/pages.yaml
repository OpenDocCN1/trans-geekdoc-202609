  md: '# 3.12 PAYMENT VERIFICATION


    In Bitcoin network, simplified payment verification nodes will have a subset of
    blockchains, i.e., only block headers. Simplified payment validation (SPV) nodes
    largely use Merkle trees. To check whether a transaction is added in a block,
    it uses a Merkle path or authentication path. This eliminates the need to download
    all the transactions. Consider, for example, an SPV [12] node that is willing
    to receive payments to an address in its wallet. A bloom filter is mounted on
    its peer-related connections by an SPV node to restrict the transactions received
    to those with interest addresses only. A merk leblock message will be used to
    submit the block if a peer recognizes a transaction that matches the bloom filter.
    The merk leblock message contains a Merkle path that connects the transaction
    specific to the Merkle core of the block and a block header. The SPV node can
    use this Merkle path to connect the transaction to the block and can ensure that
    the transaction is included in the chain. An SPV node uses the block header to
    connect the block to the rest of the blockchain. The ties between block and transaction
    and the connection between block and blockchain indicate that the transaction
    is inserted in the blockchain.


    # 3.13 BENEFITS AND CHALLENGES


    # 3.13.1 BENEFITS


    # 3.13.1.1 Decentralization


    There is no third-party intervention during transactions. Whatever cryptocurrency
    the user owns, it belongs only to the users. No central authority can own or handle
    it. Decentralized network provides protection against corruption and tampering.


    # 3.13.2 TRANSPARENT AND ANONYMOUS


    It is not easy to trace down a user’s address unless the user shares the wallet
    address. Even if the user publicizes, it is easy to generate another wallet address.
    Hence, the privacy of the user will be maintained. Simultaneously, as all blockchain
    transactions are registered in a public ledger, blockchain retains confidentiality
    without losing the transparent nature. While few research works have said that
    a transaction in blockchain can be traced back using clustering and flow analysis
    technologies, many research studies have suggested different schemes to boost
    anonymity property.


    # 3.13.3 LESS TRANSACTION FEE AND NO TAXES


    As blockchain transactions are decentralized and anonymous in nature, there is
    no practical way to apply any tax, and for instant transactions, there is no cost
    involved. Even if there is any cost involved, it is much less than a credit card,
    Paypal, or bank transfer [7].


    # 3.13.4 THEFT RESISTANCE


    It is not possible to steal Bitcoins from any user unless the rival knows the
    private key that is associated with the user’s wallet. However, if the user loses
    the private'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'key associated with his/her wallet by any means, the bitcoins in the wallet
    also lost forever and can never be recovered.


    Though blockchain has numerous benefits for the betterment of the Internet, it
    does have to face some technical challenges as well.


    # 3.13.5 Scalability


    Scalability is of big challenge. The size of Bitcoin is limited to 1 MB, and mining
    a block takes 10 minutes. The Bitcoin network is incapable of dealing high-frequency
    trading since it is limited to a rate of seven transactions per second. However,
    if the size of the block is increased, the storage space will also be increased
    and it will slow down the network speed. This results in centralization because
    fewer consumers want such large networks to be managed. The tradeoff between security
    and block size was therefore of major concern.


    # 3.13.6 High Energy Consumption


    The network blockchain uses the PoW model to achieve consensus. Although the PoW
    model protects the mining process from various security threats such as Sybil
    [8] attacks and double spending, it requires a great deal of energy and computing
    resources to calculate the required hash value for a block.


    # 3.13.7 Selfish Mining


    In blockchain, selfish mining strategy allows a miner to achieve larger revenue
    than the fair share. Miners may in future hide their mined blocks for more revenue.
    This can lead to many divisions of blockchain and hinder the growth of blockchain.


    # 3.13.8 Privacy Leakage


    Privacy at certain level can be achieved through public and private key pairs.
    Users transact through this key pair without knowing the real identity. Transactional
    privacy is not guaranteed by blockchain since the transactions and balances for
    each public key are available in public. In addition to this, the identity of
    the user can also be monitored through his/her transactions.


    # CONCLUSION


    Blockchain, in simple words, can be defined as a series of immutable, time-stamped
    data blocks managed by a set of computers not owned by any single entity. Data
    are encrypted in each of these blocks and clustered together using cryptographic
    principles. The blockchain network has no central authority – the very definition
    of a decentralized system. As it is a public and permanent ledger, the information
    contained in it is open for access by anyone and all. So, anything that is developed
    on the blockchain is transparent, and their actions are accountable to everyone
    concerned.'
