  md: 'transaction and add an already-defined percentage as their reward. To successfully
    mine a block, a hash value lesser than or equal to a target value is needed. The
    difficulty is determined individually unlike PoW. Since the hash is based on static
    data apart from a timeframe, miners cannot use their computing power to solve
    the puzzle faster than others. There is no nonce that can be changed. Instead,
    the timestamp changes every second, and miners are given a new chance to discover
    the response. When a solution is found, the coinstake transaction block is announced
    to the server. The miner collects the reward provided by the coinstake transaction,
    thus resetting the coin age at the same time. Subsequently, a new coin age can,
    of course, be gathered again, slowly increasing the chances of solving the puzzle
