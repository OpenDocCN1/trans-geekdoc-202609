    # 1.1 INTRODUCTION


    Over the past few decades, there have been many new applications on the Internet,
    solving problems in a supportive and distributed way. There are many well-known
    applications that are non-commercial and collaborative; for example, Hashcash,
    Anonymous Communication, and BitTorrent. Generally, few applications materialize
    soon after the software concept is perceived. But, there are few exceptions; one
    such idea is digital money. The concept of digital money is around since the 1980s,
    but it took few decades to develop as a fully distributed solution. As per Ref.
    [1], several attempts had been made to build digital currencies, but they required
    a central authority like bank to handle transactions. Later approaches such as
    Bitgold, B-money, Reusable Proof of Work (RPoW), and Karma suggested to have a
    cryptographic puzzle named proof of work (PoW). Based on this model, every user
    can mine their money but using a central bank to maintain the transactional details.


    To eliminate the central authority, the register which records all transaction
    details should also be distributive in nature. However, a serious risk involved
    in digital currencies or any distributed currency is double spending. As digital
    copies are smaller, it is possible for any malicious user to make two parallel
    transactions using the same coins to two different users. In traditional centralized
    models, the central authority like banks can identify and prevent such malicious
    acts, whereas it is not easy in a distributed model. The reason is that keeping
    the distributed information and mutual acceptance in a consistent state is challenging,
    especially in a malicious users environment. This goes down similar to the Byzantine
    Generals Problem [2]. This vision leads to employing quorum systems. Quorum systems
    [3] understand and accept that in a distributed environment, it is possible to
    have faulty information and mischievous users. Hence, to ensure a correct ledger,
    the voting concept was introduced assuming majority of peers are honest. However,
    this election approach leads to Sybil attacks [4], in which malicious users can
    set up several peers to challenge the electoral process and implant wrong information.
    Propagation delays are ignored and lead to brief inconsistencies. Bitcoin design
    overcomes all these difficulties.


    # 1.2 DIGITAL CURRENCIES BEFORE BITCOIN


    One of the earliest attempts to create cryptocurrency started few decades back
    in the Netherlands. When a petrol station in the Netherlands suffered nighttime
    thefts, few developers tried to link money with newly designed smart cards. A
    user who needs to access the petrol station can use these smart cards instead
    of cash. This can be'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'one of the earliest examples of electronic cash which might have led to the
    digital currency as we know them today. Some digital cash concepts before Bitcoin
    are explained below.


    # 1.2.1 BLINDED CASH


    In 1983, David Chaum was the first to describe digital money. He states that the
    key difference between credit-card payment and digital cash is anonymity. According
    to Chaum, users can anonymously receive digital money from banks. Banks can view
    who exchanged and how much money got exchanged, but cannot know what it is used
    for. Chaum uses cryptography to create a blind, digital signature termed “blinded
    cash” to make the cash anonymous. Therefore, “blinded cash” could be exchanged
    securely between individuals, by carrying identity signatures and the ability
    to change without traceability. But in 1988, Chaum went bankrupt. However, his
    concepts, formula, and encryption tools played a key role in developing digital
    currencies later.


    # 1.2.2 WEB-BASED MONEY


    In the 1990s, many companies tried to enlarge Chaum’s ideas. One such company
    is PayPal. It allowed the users to send money quickly and safely via web browser.
    Combined with eBay, it secured a dedicated user base and still remains a major
    payment service. Some companies even tried to trade gold via web browser. One
    successful operation was e-gold, which offered credit in exchange of gold or other
    precious metals. But in 2005, the federal government has to shut this down due
    to scams.


    # 1.2.3 B-MONEY


    Wei Dai, a developer, introduced a distributed, anonymous electronic cash system
    called B-money in 1998. B-money used digital pseudonyms in a distributed environment
    to transfer digital currency. It even enforces contracts in the network without
    using a third party. But B-money was not successful and failed to get any attention.
    However, Satoshi used some elements of B-money in his Bitcoin whitepaper.


    # 1.2.4 BIT GOLD


    Later, Bitgold, which is another digital currency, was proposed by Nick Szabo.
    Similar to today’s Bitcoin mining process, Bitgold had its own PoW mechanism through
    which the solutions were cryptographically signed and broadcasted to the public.
    Bitgold to an extent tried to avoid dependency on central authorities. However,
    it was not successful, but added bits to the evolution of digital currencies.


    # 1.2.5 HASHCASH


    According to the Merkle, Hashcash is one of the most successful pre-Bitcoin digital
    currencies developed in the mid-1990s. Hashcash was developed to serve many'
