  md: 'The reason for the growth of blockchain at a global level in medicine may be
    that it has strong patient assurance. By using the blockchain, the user’s health
    records can be made unaltered and immutable. If there is any adjustment made or
    unauthorized access can easily be recognized anywhere in blockchain. It is used
    for maintaining data integrity, identify criminal activities like records of adulteration
    or wholesale fraud, review is made simpler, and sharing medicinal record can be
    approved. When a patient visits, it can be noted by majority of suppliers of the
    patient quickly. Drug solution, hypersensitivities, and medication bugs are accommodated
    by patient caring algorithm throughout blockchain very quickly even without the
    requirement of any difficult forms of pharmaceutical compromise. The innovation
    of BCT is encouraged to improve access to healthcare data, encourage confirmation
    of medical data, managing clinical record [43,45], high effective care arrangement,
    and expanded security.


    # 10.3.2 Medical Fraud Deduction System


    One of the important huge blockchain applications in the medical field is the
    management of supply chain which consists of medical drugs. The supply chain management
    in the health care is more important due to its highly growing complexity. As
    if there occurs any compromise in supply chain of healthcare industry, in turn,
    it would greatly affect the patient’s wellbeing [35]. These supply chains of medical
    drugs are vulnerable. It contains holes in which any fraudulent attacks may happen
    since it consists of many moving peoples and parts. The usage of blockchain enables
    a secure and safe platform by eliminating the issues such as traceability of product
    is improved, higher-order data transparency is introduced and prevents the occurrence
    of fraud. A blockchain record undergoes process of validation and updated using
    smart contracts. So it is not easy to manipulate a blockchain [41].


    # 10.3.3 Clinical Research


    The issues that may occur in the clinical trials include issues, such as data
    enrolling [30], data privacy, record management, data sharing, and data integrity.
    The researchers of the healthcare field work on blockchain to resolve the issues
    that occur during the clinical trials by using blockchain [44]. In future, there
    could be a storm of applications based on blockchain, machine learning, and AI.


    Nugent et al. [46] proposed a study in which functionalities of smart contracts
    in the blockchain [12,61] are provided by a protocol called permissioned Ethereum
    that is used in parallel with the medical information management system. The problem
    of patient enrollment issue is discussed in this work. The study shows that the
    Ethereum results in much faster transactions when compared with Bitcoin, thus
    the conclusion suggests to use smart contracts in Ethereum to provide data management
    and transparency in the clinical trials. The blockchain-based patient enrollment
    belongs to the existing application in clinical research. Benchoufi [5] research
    is based on a blockchain framework, which is implemented in order to obtain all
    patient’s contents that can be stored and used for tracking in a secure way, untestability,
    and verifiable.'
