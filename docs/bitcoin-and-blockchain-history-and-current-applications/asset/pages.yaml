    # 9.9.4 RESETTING CONTRACT STATE


    Now, we are going to talk about one of the big issues around our current contract
    at present. After picking a winner, we send someone some amount of money. In an
    ideal world, we might try to reset our contract so we can run another round of
    the Raffle immediately after picking a winner. In other words, it''d be really
    nice if we could just have an infinite series of Raffle contract just running
    one after another without redeploying the contract.


    Figure 9.21 helps us to understand how to approach the above stated problem.


    When our contract is first created, we have an empty player’s array. Now, consider
    that one or two people might enter the contract or the lottery and their addresses
    are added to the player’s array.


    Now here’s the interesting part.


    When we pick a winner if we empty out our list of addresses, we can then essentially
    reset the state of our contract back to how it was first deployed. So by emptying
    out the list of players, we can reset the state of our contract and automatically
    get it ready for another round without redeploying the contract. By doing so,
    we can run the contract infinitely without ever having to redeploy it again and
    again.


    Figure 9.22 shows updated pickWinner () function for resetting contract state.


    ```

