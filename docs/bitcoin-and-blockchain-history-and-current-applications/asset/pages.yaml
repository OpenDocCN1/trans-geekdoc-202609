    # 3.4 TYPES OF BLOCKCHAIN


    Based on the application of the blockchain, it is classified into three major
    types as below. Each type has some unique features than the other.


    # 3.4.1 PUBLIC BLOCKCHAIN


    Public blockchain is an open-source and rightly decentralized setup in which anyone
    can be users, miners, or developers, and anybody can participate and publish new
    blocks. Thus, all transactions over public blockchain are transparent. They are
    also called “permissionless” as it permits anyone to take a copy of the blockchain
    and involve in block validation. Ethereum and Bitcoin are the best examples of
    public blockchain. As public blockchain allows a large number of users to be anonymous
    in network, it is mandatory to minimize the risk of malicious behavior. Therefore,
    publishing a new block involves solving a computationally difficult puzzle. A
    transaction fee is included in each transaction and is given as a reward to nodes
    trying to publish a block.


    # 3.4.2 PRIVATE BLOCKCHAIN


    Private blockchain is a permissioned blockchain, which means participants need
    consent to join the network. Only users who are given the permission to join the
    network can view the transactions. Since entities running the chain have more
    control over the participants and governing structures, private blockchain is
    more centralized than public blockchain. They are more suitable for individual
    enterprise solutions.'
