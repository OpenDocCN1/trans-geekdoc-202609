    proffered. The timestamp in this approach is unforgeable. To prevent the miners
    from using timestamps from the future, this approach uses Random Beacons [13].
    Since block withholding is possible in selfish mining, this approach minimizes
    the reward as fresh blocks are preferred by the network.


    # ### 1.9.1.3 Client-Side Security Threat


    Because of its immense success, Bitcoin is attracting a growing number of users
    to join the network. Every Bitcoin client has a pair of private and public keys.
    Hence, there is a need to have secure key management techniques. Otherwise, if
    the keys are lost, the user will suffer monetary loss at a higher level. Since
    the keys are stored in a wallet, wallet thefts are high in nature using mechanisms
    like system hacking, buggy software installation, and wrong usage of wallet. The
    usage of public key cryptography raises the concern for secure storage and management
    of user keys.


    In order to protect the wallet, “Cold Wallet” is proposed. It is a manual method
    and uses another account of the user where the excess amount of the user is stored.
    This method uses two computers in which one is not connected to the Internet,
    and a new private key is generated using wallet software. Since the second system
    is not connected to the Internet, it is not possible for the attackers to hack
    the wallet.


    # ### 1.9.1.4 Bitcoin Network Attacks


    Network attacks are majorly on Bitcoin and P2P communication networking protocols.
    The most common network attack is Denial-of-Services (DoS) that targets Bitcoin
    exchanges, wallets, and mining pools. As a Bitcoin network is distributed in nature,
    the effect of DoS is minimal on network operations. Hence, to disrupt the entire
    network, a strong attack like DDoS has to be applied. Unlike the DoS attack where
    a single attacker attacks the network, in DDoS, multiple attackers attack the
    network simultaneously. The intruder performs DDoS attack by removing the genuine
    miners from the network, thereby increasing the number of malicious users in the
    network. Under this situation, an honest miner may be burdened with numerous transaction
    requests from malicious miners. After some time, the miner may discard the input
    requests even the ones from honest miners. A total of 142 DDoS attacks were performed
    on 40 Bitcoin services, and 7% of known operators were the targets of these attacks
    [17].


    Several solutions have been proposed to avoid or mitigate the network attacks.
    For DDoS attacks, a game theoretic approach is used. This approach presumes that
    the smaller pools are weighted less than the larger pools. Therefore, a balance
    is dawning between players and pools with greater participants getting more rewards
    than the smaller pools. Ref. [14] suggests that Proof-of-Activity (PoA) can withstand
    the DDoS attack. In PoA, a crypt value is stored in every block header by the
    user who places the first transaction, and thus any subsequent storage of transactions
    in this block is done only through honest miners.


    All of the mentioned major attacks, in turn, have several other types of attacks
    which are mentioned in Figure 1.6.'
