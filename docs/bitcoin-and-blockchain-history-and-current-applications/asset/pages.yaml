    # 5.7 ROAD AHEAD


    Blockchain, similar to any other technology in its early stage, has been greeted
    with both enthusiasm and apathy. On the one hand, the supporters of the blockchain
    technology believe it to be the latest wave of revolution in the information and
    communications technology with the potential to radically impact multiple sectors.
    On the other hand, there is a group of naysayers who are of the opinion that blockchain
    technology is the latest buzzword which would never achieve its purported objective
    at best, and would be a convenient tool for illegal activities at worst.


    # 5.7.1 IMPACT ON EXISTING INDUSTRY: A NEW WAVE OF TECHNOLOGICAL REVOLUTION


    Advocates of the blockchain technology are of the opinion that this is the biggest
    revolution in the field of computer and technology since the advent of the World
    Wide Web (www). They claim that it has the potential to change every major industry
    as we know it. It is not a marginal increment in the existing technology, but
    it is here to devour the existing technology and create things in a totally different
    way.


    Many organizations that serve as middlemen or intermediaries between two parties
    in a transaction would be rendered irrelevant. Large organizations spend millions
    in improving service quality, grievance redress mechanism, advertising'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'and promotions, etc. and work toward customer satisfaction to develop trust
    among people. Customers value this trust, and it is an important determinant when
    they are choosing their intermediary such as stockbroker company, online shopping
    company, policy aggregator, and bank. The brokerage company helps investors match
    with the stock/debenture of their choice; online shopping aggregator helps customers
    match with the seller selling their favorite product; policy aggregator helps
    customers match with the company that sells policy which suits the investor needs;
    and banks both serve as market maker and custodian of customer’s deposits, and
    also transfer money from one party to another within and outside the country.
    All these intermediaries charge either a fixed sum or a portion of the transaction
    value as service fee for executing the transaction. The wide acceptance of blockchain
    technology and transition of business toward the same would result in complete
    rout of market makers and fee-/commission-based business models as all the information
    would be available in the public domain. Some of these intermediaries are already
    aware of the possibility of a tectonic shift in their business and hence are trying
    to adopt the technology at the earliest to fit their business model accordingly
    [8].


    # 5.7.2 IMPACT ON EXISTING INDUSTRY: DOOMED TO FAIL


    Cynics of the blockchain technology [9], on the other hand, opine that the hype
    created around the blockchain technology is synthetic in nature, and blockchain
    itself is a buzzword at best and a convenient tool of transaction in the hands
    of smugglers at worst. The naysayers assert that apart from being a relatively
    new technology that has not been tested successfully in a comprehensive manner,
    blockchain is a complex architecture to understand for beginners. Many governments,
    apprehensive about its impact on the economy coupled with loss of monetary control
    on the same, have either decided to ban its mining, usage, and possession altogether
    or stopped its use for some time to study it first. The wild volatility of cryptocurrencies
    could also pose grave uncertainty for that economy, which investors might want
    to avoid. The capacity of blockchain to handle user traffic at its current speed
    is very limited. Currently, each block takes about eight minutes to get authenticated
    and added in the chain, which needs to be reduced significantly with the improvement
    of technology. Security/privacy of the information on the public blockchain is
    another concern where though it is definitely difficult to attack the structure
    and make modifications, it is not impossible to do so. The intricacy of how malicious
    nodes would get a majority control of the network is not known clearly; however,
    if it does happen, it would be the end of it because majority consensus can be
    achieved by malicious nodes. Another issue with blockchain technology in terms
    of cryptocurrency is that the sender and receiver are anonymous. The information
    about transaction, its magnitude, time, etc. would be there on the block, but
    identification of the parties is anonymous. Hence, it can be used for illegal
    purposes very easily without proper regulation and monitoring agency. Finally,
    the system of using computational power for proof of work to validate a block
    requires a lot of energy, and it is totally unproductive given the objective to
    execute transaction at the earliest.'
