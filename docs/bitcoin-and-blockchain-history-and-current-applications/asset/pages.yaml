    target value and should have a certain number of leading zero bits to be less
    than the target. To do this, a high level of computational cost is applied to
    verification by PoW, and to do PoW, the miner needs a high level of computing
    resources. It is, therefore, very difficult to fake the computing resources. Thus,
    the problem of Sybil attacks is resolved.


    In general, the transactions are not mined individually. The miners collect the
    pending transactions to make a block and then mine the block by measuring the
    block’s hash value as well as varying nonce. The nonce must differ until the final
    value is less than or equal to the given target value. The miners share the 256-bit
    target value. It is not simple to calculate the hash value. SHA-256 is the hash
    function used in Bitcoin [8]. If the cryptographic hash function does not find
    the necessary hash value, the only alternative is to try different nonce until
    a solution is found (a hash value below the target). Consequently, the complexity
    of the puzzle depends on the target value, i.e., lower the target value, lesser
    the number of solutions, thereby making it more difficult to calculate the hash.
    Once the correct hash value is'
