    # 10.4 CHALLENGES IN IMPLEMENTING BCT ON HEALTHCARE


    The BCT is a new technology that is now being used in various industries [51];
    it has high potential opportunities [21] and benefits [1]. But there are some
    challenges in this technology as shown in Figure 10.5; they are discussed in detail
    in the following sections.


    # 10.4.1 PRIVACY AND SECURITY OF THE DATA


    Data privacy and data security are the major crucial challenges in using BCT in
    the healthcare field [37]. The usage of BCT completely eliminates the concept
    of using third party to perform transactions [57,66]. There is no third party
    involved but the BCT allows all the users in that community to do verification
    process of the blockchain records, thus information becomes prone to risks in
    security and potential privacy [1]. There is a high privacy issue since every
    node in the blockchain community can get access to the data that is transmitted.
