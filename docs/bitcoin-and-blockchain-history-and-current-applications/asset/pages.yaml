  md: '# ### 10.4.3 Storage Capacity Management


    Storage capacity management is one of the challenges that occurs in the blockchain
    used in the healthcare industry. In order to carry out the data transaction recording
    and processing, blockchain was initially created only with limited scope, so there
    is no heavy storage system. As the time passes, the technology spreads to too
    many different domains including healthcare; thus, the challenges of storage are
    revealed. A very huge amount of data is generated daily in the healthcare industry,
    such as X-rays, test reports, patient’s records, MRI scans, patient’s health history,
    and many other images regarding the medical treatment of the patient and all other
    medical data, all these details and data need a massive and huge space [6,47]
    to store the data in the blockchain which is available to each node present in
    the network chain. The blockchain applications mostly based on transaction of
    data; thus, the growth of the database is in rapid speed rate. As the database
    size keeps on increasing, the searching and accessing speed of records keeps on
    getting slow, this is not a suitable condition for the transaction, as speed is
    one of the essential factors for the transaction. So the solution for this challenge
    should be resilient [42] and scalable.


    # ### 10.4.4 Social Challenge


    Blockchain is in the developing or evolvement stage, thus it also faces many social
    challenges including cultural shifts and other challenges excluding technical
    challenges. A technology that has a vast difference from traditional technology
    is very much hard to accept and adopt. In the current era of digitalization, the
    healthcare industry is also shifting slowly toward the digitalization but still
    there is very a long way in order to completely transfer the industry based on
    blockchain or digitalization of data since they are not yet validated in aspects
    of the medical and healthcare industries. Doctors are hard to convince in switching
    to modern technologies instead of using paperwork, and this process needs a lot
    of effort and time. In the current world, the adaptation of blockchain is low
    in healthcare and medical sector and thus the policies remain untrusted. As there
    are so many challenges and threats, the blockchain still cannot be used as a solution
    to every issue in the field of healthcare.


    # ### 10.4.5 Standardization


    As blockchain is still in the early stage of development, the implementation of
    blockchain in the practical situations in the industry of healthcare and medicine
    faces challenges in standardization. To maintain a standard international authority,
    it requires many well-certified and authenticated standards. The information exchange
    format, nature of data, and size of data can be evaluated only if there are some
    predefined standards in the applications of blockchain. Defining standards will
    scrutinize the data that are shared and acts as safety precautionary measures.


    To understand more, identify the strength, identify the weakness, opportunities,
    examine and find the threats that occur in blockchain network of healthcare and
    medical domain can be analyzed with the analysis of SWOT approach as shown in
    Figure 10.6.'
