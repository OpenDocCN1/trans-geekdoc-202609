    is specifically designed for Bitcoin, it encrypts and transmits only new transactions.
    However, TOR encrypts all blockchain data. This results in better productivity
    and performance of nodes. The only drawback of TRR is the need to change Bitcoin
    protocol. Although TRR is more vulnerable to DDoS attacks, it can withstand man-in-the-middle
    attacks.


    # 1.11 RECLAIMING DISK SPACE


    In order to save the disk space, it is possible to discard the spent transactions
    that happened earlier. To achieve this, Merkle tree hashes the transactions without
    changing the block’s hash by adding only the root in block’s hash. Through this,
    the need to store the internal hashes can be eliminated. Later, the old blocks
    can be compressed by cutting off the branches of the tree.


    # 1.12 CONCLUSION


    In this chapter, the P2P decentralized digital currency Bitcoin and its properties
    have been discussed. The discussion on cryptocurrencies before Bitcoin shows the
    state of the art of existing cryptocurrency. The transparency nature of Bitcoin
    is the key aspect to achieve validity and user anonymity is another aspect which
    lets Bitcoin to keep growing. The most significant concept of mining based on
    PoW secures the model and eventually stabilizes the consensus. The various security
    attacks are explained in detail along with countermeasures.


