    # 12.4.3.1 Orderer


    Hyperledger Fabric provides few ordering mechanisms; some of them are SOLO, Kafka,
    RAFT.


    Developers playing with the Fabric use the SOLO ordering method. In the production
    stage, Kafka is the ordering system that could be used, it used the Apache Kafka.
    This system provides an ordering solution resistant of crash failure. RAFT ordering
    system offers both crash tolerance and Byzantine Fault Tolerance, which ensures
    that even if there are unstable or malicious nodes, agreement can be reached.


    We will be using the Kafka ordering system in the Hyperledger Fabric network.


