    Hyperledger Fabric varies from other blockchain networks, it is personal as well
    as allowed. Instead of open permissionless system allowing unknown identities
    to participate in the network (requiring protocols such as “proof of work”(PoW)
    to verify transactions and protect the network), members of a Hyperledger Fabric
    network join through a trusted Membership Service Provider (MSP) [8].


    Fabric also offers various pluggable configurations. Data on the ledger can be
    stored in multiple formats with pluggable consensus mechanisms and MSPs. Hyperledger
    Fabric introduces a concept called channels. Channels allow a group of identities
    from the same network to create a separate ledger for transactions, i.e., a separate
    subset blockchain of main blockchain. In this chapter, we are going to explore
    Hyperledger Fabric, its components and concepts, and a walkthrough for setting
    up a Fabric network. In the next section, we will be discussing about Fabric architecture.


    # 12.3 FABRIC ARCHITECTURE


    In this segment, we are going to discuss about Hyperledger Fabric’s architecture
    its concepts and components which constitute a network.


    # 12.3.1 FABRIC OVERVIEW


    Hyperledger Fabric [1] is a modular and flexible open-source system designed to
    develop, deploy, and manage authorized (permissioned) blockchains. Traditional
    blockchains use active replication, i.e., a consensus process that initially orders
    the transactions and transmits them to all peers. Second, the transactions are
    executed sequentially by each peer. This needs all peers to be deterministic in
    conducting each transaction and all transactions, resulting in a lack of overall
    system performance. This is known as the architecture of order-execution. This
    architecture can be found in virtually all existing blockchain systems such as
    Ethereum (with PoW-based consensus) that are open to permitted platforms. Permissioned
    blockchains did suffer from some limitations with the traditional architecture.
    Consensus mechanism washard-coded, transactions need to be deterministic, which
    can be programmatically difficult to guarantee.


    To overcome these drawbacks of existing permissioned blockchains, Hyperledger
    Fabric introduces a new architecture which they called execute-order-validate
    architecture [8]. In this architecture, transaction flow starts with the execution
    of the transactions, which are executed by a subset of peers (endorsing peers)
    in the network'
