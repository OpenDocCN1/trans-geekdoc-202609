    in the Request struct.


    **getSummary ()**: This function will return the summary or the current state
    of the contract.


    This function is marked as view since it does not change the data in the contract.
    The functions return the minimum contribution value, balance of the contract or
    the fund of the contract, requests length, the number of contributors, and the
    manager of the contract.


    Through the use of above-mentioned methods, the crowdfunding system spends the
    money efficiently and less chances for fraud can be achieved. In a brief, there
    are two contracts: one to control all the deployed campaigns contract and the
    other is for the campaign. The CampaignFactory contract will create contracts
    for the campaigns hosted on the site and stores the contract address. The contract
    campaign will control all the details and manages the money raised through funding
    for that particular campaign. The contract campaign has methods for contributing
    to the campaign through ether by becoming a contributor and raising funds, creating
    requests for purchasing thing from a vendor by the manager, voting for the request
    by the contributors, finalizing the request and transferring of ether, get the
    summary about the contract. All these methods will define the working of the contract.
    The sequence diagram for the whole process is given (refer Figure 13.13)


    The contract which we have designed should be deployed in the Ethereum network
    and a front-end must be created for user interaction purpose. For deployment,
    the test network like Rinkeby should be used first because it doesn’t cost real
    ether.


    # 13.7 CREATING THE FRONT-END USING REACT


    As said in deployment section, after deploying the contract the address and the
    Application Binary Interface (ABI) of the contract will be stored in a file. The
    ABI and the address are used to call or invoke a function and sent a transaction.
    In the project, React [29] is used for the development of web page. For server
    and routing purposes, Next.js [28] is used. Semantic-ui-react [130] is used for
    the styling of the web page.


    # 13.7.1 ARCHITECTURE OF NEXT.JS


    Next.js is a module used for server and routing purposes [28]. Using the JavaScript
    will render in the server side and also on the client side, i.e., web browser.
    It wraps all the react and renders it in the browser. Figure 13.14 depicts the
    features and advantages of next.


    When we use next, the default port of server is 13000. The next will render all
    the js files in the folder pages. When the server starts, the next will search
    for the index.js file in the pages folder. So, in the pages folder we are going
    to create all the required JavaScript files for the interaction with the contract.
    Figure 13.15 shows the brief model of how next routing works. The browser must
    have Metamask wallet installed, it is necessary for the website to work as it
    meant to be.


    In the home page, we have the search option for campaigns and we will display
    all the campaigns that are deployed. A page will be created for hosting of new
    campaign'
