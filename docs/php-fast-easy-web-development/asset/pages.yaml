  md: '# Registering and Modifying Session Variables


    The goal of this script is to register a variable and change its value during
    the course of a user session.


    +   1. Open a new file in your text editor.


    +   2. Start a PHP block:


    ```

    <?

    ```


    +   3. Call the session_start() function:


    ```

    session_start();

    ```


    +   4. Register a variable called count:


    ```

    session_register(''count'');

    ```


    +   5. Increment the value of $count to account for the current access:


    ```

    $count++;

    ```


    +   6. Create a string to hold a message, including the value of $count:


    ```

    $msg = "<P>You''ve been here $count times. Thanks!</p>";"

    ```


    +   7. Close the PHP block:


    ```

    ?

    ```


    +   8. Type the following HTML:


    ```

    <HTML>

    <HEAD>

    <TITLE>Count Me!</TITLE>

    </HEAD>

    <BODY>

    ```


    > NOTE

    Now, for long as this session exists, a variable called $count will be available.
    Currently, the variable has no value.'
