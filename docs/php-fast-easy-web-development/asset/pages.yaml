    # Miscellaneous Functions


    The die() and exit functions provide useful control over the execution of your
    script, offering an "escape route" for programming errors. Other functions found
    their way into this "miscellaneous" category.


    # die()


    The die() function outputs a given message and terminates the script when a returned
    value is false. Its syntax is


    ```

    die("message");

    ```


    For example, you would use the following code to print a message and stop the
    execution of your script upon failure to connect to your database:


    ```

    $connection = mysql_connect("servername", "username", "password")

    or die("Can''t connect to database.");

    ```


    # exit


    The exit statement terminates the execution of the current script at the point
    where the exit statement is made.


    # sleep() and usleep()


    The sleep() and usleep() functions put a pause, or a delay, at a given point in
    the execution of your PHP code. The syntax of these functions is


    ```

    sleep(seconds)

    usleep(microseconds);

    ```


    The only difference between sleep() and usleep() is that the given wait period
    for sleep() is in seconds, and the wait period for usleep() is in microseconds.


    # uniqid()


    The uniqid() function generates a unique identifier, with a prefix if you want
    one. Its syntax is


    ```

    uniqid("prefix");

    ```'
