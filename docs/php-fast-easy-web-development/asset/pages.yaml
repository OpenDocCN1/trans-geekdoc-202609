    When you define a field as auto_increment, it must also be defined as NOT NULL.\n\
    \n8. If the auto_increment check hasn't been checked, create the variable but\
    \ not place any text in it, and then close the block. This will assist in resetting\
    \ the value of the string as the looping continues:\n\n```\n} else {\n  $additional\
    \ = \"\";\n}\n```\n\n9. Create an if...else block that checks whether the primary\
    \ key check box has been checked:\n\n```\nif ($primary[$i]) == \"Y\") {\n```"
