- pgno: 221
  md: '# Planning Your Fields


    Creating a table is easy—it''s the planning that takes some brain power. To create
    a simple table, you only need to give it a name. But that would make a boring
    table, since it wouldn''t contain any columns (fields) and couldn''t hold any
    data. So, besides the name, you should know the number of fields and the types
    of fields you''d like to have in your table.


    The overall goal of this chapter is to create a table to hold data from your own
    personal music collection. Take a moment to think about the kinds of things you''d
    want to know: the title and artist, obviously, and maybe the record label, the
    date it was acquired, and your own personal notes regarding the recording.


    I thought about what I wanted for my own table, which I''ve decided to call my_music.
    The table below shows the fields I want it to contain.


    | Field Name | Description |

    | id | A unique ID number for the entry |

    | format | Is it a CD, cassette, or even an LP? |

    | title | The title of the recording |

    | artist_fn | The artist''s first name |

    | artist_In | The artist''s last name, or the name of the group |

    | rec_label | The record label |

    | my_notes | My own thoughts about the recording |

    | date_acq | Date acquired |


    In the next section, you''ll create sequence of forms that will take your table
    information and send it to your MySQL database. In the first step, you''ll submit
    the name of the table and the number of fields you want to include. The second
    step will display additional form fields so that you can define the properties
    of your table columns. A third step will send the request to MySQL, verify that
    the table was created, and display a "Success! message.


    Before getting into all that, take a moment to read about datatypes and unique
    fields.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# A Word about Datatypes


    All fields in table are given a particular datatype definition. The datatype defines
    the type of data that''s allowed in the field. With some datatype definitions,
    you must also define the maximum length allowed in the field, but others are assumed
    to have no particular length.


    It’s very important to define fields appropriately. For example, if you have a
    50-character varchar field to hold the name of a recording, and you try to stuff
    a 100-character string into the field, your string will truncate at 50 characters.


    Not only is it important to define the fields correctly so that the data fits
    inside the fields, also to define the fields with the correct SQL syntax—otherwise,
    the table won''t be created, period. For example, if you want to use the text
    for the my_notes field, you cannot specify a length; it’s automatically assumed
    to have a particular length.


    The following table shows a brief list of common datatypes, their descriptions,
    and how to define the length. A larger list can be found at www.thickbook.com
    in the “Extra” section.


    | Datatype | Description | Define the Length? |

    |---|---|--|

    | INT | A normal-sized integer, between 0 and 4294967295 | Not required; defaults
    to 11 |

    | FLOAT | A floating-point number (such as money) | Not required; defaults to
    10,2 where is 2 the number of decimals |

    | DATE | A date, in YYYY-MM-DD format, between 1000-01-01 and 9999-12-31 | No
    |

    | CHAR | A fixed-length string between 1 and 255 characters | Not required; defaults
    to 1 |

    | VARCHAR | A variable-length string between 1 and 255 characters | Yes |

    | TEXT | A field with a maximum length of 65535 characters | No |'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# CHAPTER 12: CREATING A DATABASE TABLE


    # The Importance of Unique Fields


    Using unique ID numbers helps you keep track of your data, and it will also help
    you down the road, as you attempt to establish relationships between multiple
    tables. In the my_music table, there will be an id field. Using this field as
    the unique field, instead of the title field, will allow you to have two recordings
    in your table that have the same name. For example, if you own the album Strange
    Fire by Indigo Girls, you could have two entries in your table: one for the version
    released in 1987 and 1989.


    If you didn''t use a unique identifier, you would have to pick only one version
    to put in your table, and your table wouldn''t be very accurate. I hope this simple
    example conveys the importance of having a unique identifier in each record in
    your table. The usage of the unique identifier will become more apparent throughout
    the remainder of this book, as you create more database-driven elements.


    # A Two-Step Form Sequence


    A two-step form sequence for creating a database table might seem like overkill.
    After all, you saw a basic table-creation SQL statement in Chapter 1, “Installing
    and Configuring MySQL,” when you created test_table:


    ```

    create table test_table (test_id int, test_node text);

    ```


    When you use a PHP script to create a table, all you''re doing is sending the
    exact same query to MySQL. However, you can tie a pretty ribbon around the process
    (creating a form-based interface) and call it an "administrative interface"!


    In the process of creating the administrative interface, you''ll start with an
    HTML form, then create a PHP script that takes information from that form and
    dynamically creates another form. Finally, you''ll create a script that sends
    the actual SQL query.


    # Step 1: Number of Fields


    This HTML form will contain two input fields: one for the name of the table and
    one for the number of fields your table will contain.'
