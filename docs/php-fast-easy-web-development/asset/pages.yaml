    # Using Cookies


    Cookies are great little tools, but they get a bad rap in the press when nasty
    people misuse them. These little bits of text will make your development life
    much easier if you use them properly. In this chapter, you''ll learn how to do
    the following:


    +   - Set a cookie

    - Extract data from a cookie

    - Amend your user authentication routines to use a cookie'
