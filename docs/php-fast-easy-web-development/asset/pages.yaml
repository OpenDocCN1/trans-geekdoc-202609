  md: '# Working with String Functions


    Numerous string functions are built into PHP, all of which are designed to make
    your life easier. Suppose you have to normalize strings for news headlines or
    product ID numbers, or calculate the length of a string before trying to stuff
    it into a database field. Those are just a few of the string functions you''ll
    learn about in the next section. For more string functions, take a look at the
    PHP Manual at http://www.php.net/manual/. The function list seems to grow daily
    as more people contribute to the language.


    # Creating an Input Form


    In this section, you''ll create the front end to a string modification script.
    This form will contain one text area and several radio buttons. The radio buttons
    will determine the string function to use.


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:


    ```

    <HTML>

    <HEAD>

    <TITLE>Generic Input Form</TITLE>

    </HEAD>

    <body>

    ```


    +   3. Begin your form. Assume that the method is post and the action is a script
    called display_input.php:


    ```

    <FORM METHOD="post" ACTION="display_input.php">

    ```


    +   4. Create a text area with a text label:


    <P><strong>Text Field:</strong><br><TEXTAREA NAME="text1" COLS=45 ROWS=5 WRAP=virtual></TEXTAREA></P>'
