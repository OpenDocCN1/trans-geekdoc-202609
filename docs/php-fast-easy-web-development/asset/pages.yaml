    ```


    +   1. At the prompt, type select from test_table; and press Enter.


    This command simply selects all fields from all rows (that''s what the * does)
    in the table called test_table and returns the data to the screen in a nicely-formatted
    table. The MySQL Monitor tells you how many rows were returned and how long it
    took to run the query.


    ```

    mysql> select from test_table order by test_id desc;

    test_id test_note

    99      Look Another note.

    1       This is a note.

    2 rows in set (0.00 sec)

    ```


    Add a little order to the results. Try to get the results ordered by ID number—largest
    number first.


    +   2. At the prompt, type select from test_table order by test_id desc; and press
    Enter.


    The result now shows the row with a test_id of 99 as the first row in the table.
    The "desc" in the command stands for "descending." There is another option, "asc,"
    which stands for "ascending." Ascending order is the default order.


