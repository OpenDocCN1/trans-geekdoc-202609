    The scripts used in these chapters can be executed on both Windows and Linux/Unix
    operating systems. On Windows, you can use both the forward slash (/) and the
    backslash (\ in file paths, whereas other operating systems use only the forward
    slash. The scripts in this chapter use the forward slash method in all instances.
    This method work even if you don''t specify a drive letter. For example:


    ```

    $path = "/Program Files/Apache Group/Apache/htdocs";

    ```


    This path, on Windows, is assumed to be on the current drive (in my case, C:/).
    If you need to specify a drive letter, do so:


