  md: '# Planning and Creating Your Administrative Menu


    You could just write one script that says "Select all of my data; I don''t care
    about the order," but that would be boring. In this chapter, you''ll see four
    ways to select records from the my_music table. To facilitate easy navigation,
    create an administration menu—fancy words for "a list of links to scripts"


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:


    ```

    <HTML>

    <HEAD>

    <TITLE>My Menu</TITLE>

    </HEAD>

    <BODY>

    <h1>My Menu</h1>

    <P><strong>My Music</strong></P>

    ```


    +   3. Start a bullet list and create the first link, to a script sel_byid.php.
    This script will display the records, ordered by ID number:


    ```

