- pgno: 8
  md: '# About the Author


    JULIE MELONI is the Technical Director for i2i interactive, a multimedia company
    located in usually-sunny Campbell, CA. She''s been developing Web-based applications
    since the Web first saw the light of day, and remembers the excitement surrounding
    the first GUI Web browser.


    She wholeheartedly believes that Linux is the OS of the present, not just the
    future, and feels guilty for working for Sun Microsystems. She would like to list
    all the activities she likes to do in her spare time, but she hasn''t had any
    spare time in five years, so that would be a short list.'
