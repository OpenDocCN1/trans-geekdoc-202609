    # Database Connectivity Functions for MySQL


    Numerous PHP functions exist for connecting to and querying a MySQL server. Following
    are some basic functions and their syntax. See the PHP Manual at http://www.php.net/manual/
    for a complete listing of MySQL functions—there are plenty!


    # mysql_connect()


    This function opens a connection to MySQL. It requires a server name, username,
    and password.


    ```

    $connection = mysql_connect("servername", "username", "password");

    ```


    # mysql_create_db()


    This function creates a database on the MySQL server. It requires a valid established
    connection.


    ```

    mysql_create_db("myDB");

    ```


    # mysql_drop_db()


    This function drops a database on the MySQL server. It requires a valid established
    connection.


    ```

    mysql_drop_db("myDB");

    ```


    # mysql_select_db()


    This function selects a database on the MySQL server for use by subsequent queries.
    It requires a valid established connection.


    ```

    $db = mysql_select_db("myDB", \$connection);

    ```


    # mysql_query()


    This function issues the SQL statement. It requires an open connection to the
    database.


    ```

    $sql_result = mysql_query("SELECT * FROM SOMETABLE", \$connection);

    ```'
