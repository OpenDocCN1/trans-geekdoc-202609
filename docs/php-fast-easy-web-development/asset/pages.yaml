    | Mode | Description |

    | --- | --- |

    | r | Read-only. The file pointer is at the beginning of the file. |

    | r+ | Reading and writing. The file pointer is at the beginning of the file.
    |

    | w | Write-only. The file pointer is at the beginning of the file, and the file
    is truncated to zero length. If the file does not exist, attempt to create it.
    |

    | w+ | Reading and writing. The file pointer is at the beginning of the file,
    and the file is truncated to zero length. If the file does not exist, attempt
    to create it. |

    | a | Write-only. The file pointer is at the end of the file (it appends content
    to the file). If the file does not exist, attempt to create it. |

    | a+ | Reading and writing. The file pointer is at the end of the file (it appends
    content to the file). If the file does not exist, attempt to create it. |


