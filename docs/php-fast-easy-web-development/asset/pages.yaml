    ```

    mysql create table test_table (test_id int, test_note text);

    query ok affected (0.11 sec)

    mysql show tables;

    tables in set db0

    test_table

    1 row in set (0.11 sec)

    mysql insert into test_table:

    mysql insert into test_table values (''1'', ''This is a note.'');

    query ok, 1 row affected (0.11 sec)

    ```


    +   6. To insert this row, type insert into test_table values(\''1'', ''This is
    a note.\'');; and press Enter.


    MySQL Monitor will respond with "Query OK." It will also tell you how many rows
    were affected and how long it took to complete the task.


    +   7. Insert another row by inserting into test_table values(\''99'', ''Look!
    Another note.\''); and pressing Enter.


    > For more information about the specifics of inserting data into tables, see
    Appendix C, "Basic MySQL Reference."


    If you have some data in your table, even if it is only two rows, get familiar
    with selecting data. Keep the MySQL Monitor open, because you''ll be using it
    in the next section as well.


    # Selecting Data from Your Test Table


    The select command is very powerful and will likely be the command you use often
    when working with PHP and MySQL. You can find more information about the select
    command in Appendix C, "Basic MySQL Reference," but for now, let''s do some data
    selections.'
