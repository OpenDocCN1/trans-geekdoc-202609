- pgno: 267
  md: '# Why Authenticate Anyone?


    When initially developing a Web site, you might want to restrict access to certain
    members of your development team. If your corporate Web site contains sensitive
    financial data, you might want to restrict your financial statements to a particular
    list of investors. Or maybe you just don''t want people poking around your personal
    things.


    A common type of user authentication is database-driven, in which usernames and
    passwords are kept in a database table and accessed via a login form and script.
    In the next section, you''ll create this database table and add some users to
    it.


    # Creating the User Table


    In Chapter 12, "Creating a Database Table," you followed a two-step table-creation
    process. You''ll be able to use that same process to create the authorized users
    table.


    +   1. Open your Web browser and type http://localhost/show_createtable.html


    +   2. In the Name field, type auth_users.


    +   3. In the Number of Fields field, type 4.


    > Before you submit the form, it should look like this:


    +   4. Click on the Go to Step 2 button.


    ![](img/461c18a4760b99ba5ad0e3e3f65bfb91_267_0.png)'
