- pgno: 413
  md: "Control structures use curly braces ({ and )) to separate the groups of statements\
    \ from the remainder of the program. Examples of common control structures follow;\
    \ memorizing these will make your life much easier.\n\n# if...elseif...else\n\n\
    if...elseif...else construct executes a statement based on the value of the expression\
    \ being tested. In the following sample if statement, the expression being tested\
    \ is \"$a is equal to 10.\"\n\n```\nif ($a == \"10\") {\n    // execute some code\n\
    }\n```\n\nAfter $a is evaluated, if it is found to have a value of 10 (that is,\
    \ if the condition is TRUE), the code inside the curly braces will execute. If\
    \ $a is found to be something other than 10 (if the condition is FALSE), the code\
    \ will be ignored, and the program will continue.\n\nTo offer an alternative series\
    \ of statements, $a not have a value of 10, add an else statement to the structure,\
    \ to execute a section of code when the condition is FALSE:\n\n```\nif ($a ==\
    \ \"10\") {\n    echo \"a equals 10\";\n} else {\n    echo \"a does not equal\
    \ 10\";\n}\n```\n\nThe elseif (or two words: \"else if\") statement can be added\
