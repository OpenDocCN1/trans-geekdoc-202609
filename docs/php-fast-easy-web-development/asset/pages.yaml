    <TD ALIGN=CENTER><INPUT TYPE=\"checkbox\" NAME=\"primary[\\]\" VALUE=\"Y\"\\></TD>\n\
    <TD ALIGN=CENTER><INPUT TYPE=\"checkbox\" NAME=\"auto_increment[\\]\" VALUE=\"\
    Y\"\\></TD>\n```\n\n4. Save this file.\n\nNext, you will modify the final part\
    \ of the table-creation script.\n\n5. Open do_createtable.php in your text editor.\n\
    \n6. Within the loop, the first line appends text to the $sql variable, which\
    \ holds the SQL statement for table creation. Since you've added two check boxes,\
    \ for additional elements of the SQL statement, you need to check for them. Start\
    \ by creating an if[...]else block that checks the auto_increment check box has\
    \ been checked:\n\n```\nif ($auto_increment[$i] == \"Y\") {\n```\n\n7. If the\
    \ auto_increment check box has been checked, create a variable to hold additional\
