- pgno: 439
  md: '# CREATE or DROP a Database


    Starting with something simple, you can use the CREATE command to create a new
    database. The syntax is


    ```

    CREATE DATABASE IF NOT EXISTS yourDBName;

    ```


    When you create a database with this command, you''re really just creating a directory
    that will hold the files that make up the tables in the database.


    To delete an entire database from the system, use the DROP command:


    ```

    DROP DATABASE IF EXISTS yourDBName;

    ```


    Be extremely careful when using the DROP command, because once you DROP the database,
    all of the tables are dropped as well!


    # CREATE or DROP a Table


    You can also use the CREATE command to create a table within the current database.
    The syntax is:


    ```

    CREATE TABLE yourTableName (fieldName [type], fieldName2 [type], ...) [options]

    ```


    To delete a table from the current database, use the DROP command:


    ```

    DROP TABLE yourTableName;

    ```


    Be extremely careful when using the DROP command, because once you DROP the tables,
    they''re gone!


    > NOTE

    Some common data types are int, float, char, varchar, date, time, datetime, text,
    and blob. The MySQL manual for a list of supported data types and any size and
    restrictions, or see the tutorial at http://www.thickbook.com/extra/php_datatypes.phtml.


    # ALTER a Table


    The ALTER command gives you the opportunity to modify elements of a particular
    table, such as renaming columns, changing the type of a column, adding columns,
    deleting columns, and so on. Following are some common uses:'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# INSERT, UPDATE, OR REPLACE WITHIN A TABLE 415


    +   - To add a column to a table, use this:

    ALTER TABLE yourTableName ADD columnspan fieldDefinition;


    +   - To delete a column from a table, use this:

    ALTER TABLE yourTableName DROP columnName;


    +   - To change a column from one type to another, use this:

    ALTER TABLE yourTableName CHANGE columnName newFieldDefinition;


    +   - To make a unique column in your table, use this:

    ALTER TABLE yourTableName ADD UNIQUE columnName (columnName)


    +   - To index a column in your table, use this:

    ALTER TABLE yourTableName ADD INDEX columnName (columnName)


    Using the ALTER command alleviates the need to delete an entire table and re-create
    it just because you spelled a field name incorrectly or made other minor mistakes.


    # INSERT, UPDATE, or REPLACE within a Table


    The INSERT and REPLACE commands populate your tables one record at a time. The
    syntax of INSERT is:


    ```

    INSERT INTO yourTableName (fieldName, fieldName2, ...)

    VALUES (''value of fieldName1'', ''value of fieldName2''...);

    ```


    When inserting records, be sure to separate your strings with single quotes or
    double quotes. If you use single quotes around your strings, and the data you
    are adding contains apostrophes, avoid errors by escaping the apostrophe (\'')
    within the INSERT statement. Similarly, if you use double quotes around your strings
    and you want to include double quotes as part of the data, escape them (\") within
    your statement"


    The REPLACE command has the same syntax and requirements as the INSERT command.
    The only difference is that you use REPLACE to overwrite a record in a table,
    based on a unique value:


    ```

    INSERT INTO yourTableName (fieldName, fieldName2, ...)

    VALUES (''value of fieldName1'', ''value of fieldName2''...);

    ```


    ![](img/461c18a4760b99ba5ad0e3e3f65bfb91_440_0.png)'
  merge: -1
  img_proc: true
- pgno: 441
  md: '# 416 APPENDIX C: BASIC MYSQL REFERENCE


    The UPDATE command modifies parts of a record without replacing the entire record.
    To update an entire column in a table with the same new value, use this:


    ```

    UPDATE tableName SET fieldName = `[new value]`;

    ```


    If you want to update specific rows, use a WHERE clause:


    ```

    UPDATE tableName SET fieldName = `[new value]` WHERE [`some expression]`;

    ```


    UPDATE can be a very powerful SQL command. For example, you can perform string
    functions and mathematical functions on existing records and use the UPDATE command
    to modify their values.


    # DELETE from a Table


    Like the DROP command, using DELETE without paying attention to what you''re doing
    can have horrible consequences in a production environment. Once you DROP a table
    or a record, it''s gone forever. Don''t be afraid; just be careful. To delete
    all the contents of a table, use the following:


    ```

    DELETE FROM tableName;

    ```


    If you want to delete only specific rows, use a WHERE clause:


    ```

    DELETE FROM tableName WHERE [`some expression]`;

    ```


    If you''re going to start deleting records, be sure you have a backup, just in
    case something goes wrong. Everyone screws up once.


    # SELECT from a Table


    When creating database-driven Web sites, the SELECT command will likely be the
    most-used command in your arsenal. The SELECT command causes certain records in
    your table to be chosen, based on criteria that you define. Here is the basic
    syntax of SELECT:


    ```

    SELECT [field names] FROM [table name]

    WHERE [`some expression]

    ORDER BY [field names];

    ```'
  merge: -1
  img_proc: true
- pgno: 442
  md: 'To select all the records in a table, use this:


    ```

    SELECT * FROM tableName;

    ```


    To select just the entries in a given column of a table, use this:


    ```

    SELECT columnName FROM tableName;

    ```


    To select all the records in the table and have them returned in a particular
    order, use an expression for ORDER BY. For example, if you have a date field for
    record entries and you want to see all the record entries ordered by newest to
    oldest, use this:


    ```

    SELECT * FROM tableName ORDER BY dateField DESC;

    ```


    DESC stands for "descending." To view from oldest to newest, use ASC for "ascending."
    ASC is the default order.


    You can also perform mathematical and string functions within SQL statements,
    thereby using SELECT to do more than just echo existing data. Some examples follow:


    # A Few String Functions


    This list contains only a few of the many string-related functions listed in the
    MySQL Manual. Visit http://www.mysql.com/ and check out the entire manual for
    more information.


    +   - You can concatenate values using the CONCAT() function. The syntax is SELECT
    CONCAT(field1,field2,...) AS newName FROM tableName;

    - Convert your results to lowercase using the LOWER() function. The syntax is
    SELECT LOWER(field1,field2,...) FROM tableName;

    - Convert your results to uppercase using the UPPER() function. The syntax is
    SELECT UPPER(field1,field2,...) FROM tableName;


    # A Few Date and Time Functions


    This list contains only a few of the many date and time-related functions listed
    in the MySQL Manual. Visit http://www.mysql.com/ and check out the entire manual
    for more information.'
  merge: -1
