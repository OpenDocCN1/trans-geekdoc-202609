  md: '# Essential PHP Language Reference


    This appendix is by no means a copy of the PHP Manual (found at http://www.php.net/manual/),
    which contains user-submitted comments and code samples. Instead, this appendix
    serves as an “essential” reference—it contains the elements of PHP that (in my
    opinion) you can''t live without. The PHP Development Team and all of the documentation
    contributors have done a wonderful job with the entire PHP Manual, and there''s
    no need to reinvent the wheel. However, since this appendix touches on only a
    small percentage of all there is to know about PHP, check the PHP Manual before
    asking a question on one of the PHP mailing lists.'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# PHP Start and End Tags


    To combine PHP code with HTML, the PHP code must be escaped, or set apart, from
    the HTML. The PHP engine will consider anything within the tag pairs shown in
    the table below as PHP code.


    | Opening Tag | Closing Tag |

    |---|---|

    | <?php | ?> |

    | <? | ?> |

    | <script language="php"> | </script> |


    # Variables


    You create variables to represent data. For instance, the following variable holds
    a value for sales tax:


    ```

    $sales_tax = 0.0875;

    ```


    This variable holds a SQL statement:


    ```

    $sql = "SELECT * FROM MY_TABLE";

    ```


    You can refer to the value of other variables when determining the value of a
    new variable:


    ```

    $tax_total = $sales_tax * $sub_total;

    ```


    The following are true of variable names:


    +   - They begin with a dollar sign ($).

    - They cannot begin with a numeric character.

    - They are case-sensitive.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# VARIABLES 383


    Here are some common variable types:


    +   - arrays

    - integers

    - floats

    - strings


    These types are determined by PHP, based on the context in which they appear.


    # Arrays


    In the following example, $fave_colors is an array that contains strings representing
    array elements. In this case, the array elements (0 to 3) are names of colors.


    ```

    $fave_colors[0] = "red";

    $fave_colors[1] = "blue";

    $fave_colors[2] = "black";

    $fave_colors[3] = "white";

    ```


    Array elements are counted with 0 as the first position.


    # Floats


    Each of the following variables is a float, or floating-point number. Floats are
    also known as "numbers with decimal points."


    ```

    $a = 1.552;

    $b = 0.964;

    $sales_tax = 0.875;

    ```


    # Integers


    Integers are positive or negative whole numbers, or "numbers without decimal points."
    Each of the following variables is an integer:


    ```

    $a = 15;

    $b = -521;

    ```


    # Strings


    A series of characters grouped within double quotation marks is considered a string:


    ```

    $a = "I am a string.";

    $b = "<P>This book is <strong>cool</strong>!";

    ```'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# 384 APPENDIX B: ESSENTIAL PHP LANGUAGE REFERENCE


    You can also reference other variables within your string, which will be replaced
    when your script is executed. For example:


    ```

    $num = 57; // an integer

    $my_string = "I read this book $num times!"; // a string

    ```


    When you run the script, $my_string will become "I read this book 57 times!"


    # Variables from HTML Forms


    Depending on the method of your HTML form (GET or POST), the variables will be
    part of the $_HTTP_POST_VARS or $_HTTP_GET_VARS global associative array. The
    name of the input field produces the name of the variable. For example, the input
    field produces the $first_name:


    ```

    <input type="text" name="first_name" size="20">

    ```


    If the method of your form was POST, this variable could also be referenced as
    $_HTTP_POST_VARS[''first_name'']. If the method was GET, you could also use $_HTTP_GET_VARS[''first_name''].


    # Variables from Cookies


    Like variables from forms, variables from cookies are kept in a global array called
    $_HTTP_COOKIE_VARS. If you set a cookie called "user" with a value of "Joe Smith",
    time: so:


    ```

    SetCookie("user", "Joe Smith", time+3600);

    ```


    a variable called $user is placed in $_HTTP_COOKIE_VARS with a value of "Joe Smith".
    You can refer to $user or $_HTTP_COOKIE_VARS[''user''] to get that value.


    # Environment Variables


    When a Web browser makes a request of a Web server, it sends along with the list
    of extra variables called environment variables. They can be very useful for displaying
    dynamic content or authorizing users.


    By default, environment variables are available to PHP scripts as $_VAR_NAME.
    However, to be absolutely sure that you''re reading the correct value, you can
    use the getenv() function to assign a value to a variable of your choice. The
    following are some common environment variables.'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'REMOTE_ADDR gets the IP address of the machine making the request. For example:


    ```

    $remote_address = getenv("REMOTE_ADDR");

    echo "Your IP address is $remote_address.";

    ```


    HTTP_USER_AGENT gets the browser type, browser version, language encoding, and
    platform. For example:


    ```

    $browser_type = getenv("HTTP_USER_AGENT");

    echo "You are using $browser_type.";

    ```


    For a list of HTTP environment variables and their descriptions, visit http://hoohoo.nucsa.uiuc.edu/cgi/env.html.


    # # Operators


    An operator is a symbol that represents a specific action. For example, the +
    arithmetic operator adds two values, and the = assignment operator assigns a value
    to a variable.


    # # Arithmetic Operators


    Arithmetic operators bear a striking resemblance to simple math, as shown in the
    table below.


    | Operator | Example | Action |

    | --- | --- | --- |

    | + | $b = $a + 3; | Adds values together |

    | - | $b = $a - 3; | Substracts values |

    | * | $b = $a * 3; | Multiplies values |

    | / | $b = $a / 3; | Divides values |

    | % | $b = $a % 3; | Returns the modulus, or remainder |'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# Assignment Operators


    The = is the basic assignment operator:

    $a = 124; // the value of $a is 124


    Other assignment operators are shown in the table below.


    | Operator | Example | Action |

    | --- | --- | --- |

    | += | $a += 3; | Changes the value of a variable to the current value plus the
    value on the right side |

    | -= | $a -= 3; | Changes the value of the variable to the current value minus
    the value on the right side |

    | .= | $a .= "string"; | Concatenates (adds on to) the value on the right side
    with the current value |


    # Comparison Operators


    It should come as no surprise that comparison operators compare two values. A
    value of true or false is returned by the comparison. The comparison operators
    are shown in the table below.


    | Operator | Definition |

    | --- | --- |

    | == | Equal to |

    | != | Not equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# Increment/Decrement Operators


    The increment/decrement operators do just what their name implies: add or subtract
    from a variable.


    | Operator | Usage | Definition |

    | --- | --- | --- |

    | Pre-increment | ++a | Increments by 1 and returns $a |

    | Post-increment | a++ | Returns $a and then increments $a by 1 |

    | Pre-decrement | --a | Decrements by 1 and returns $a |

    | Post-decrement | a-- | Returns $a and then decrements $a by 1 |


    # Logical Operators


    Logical operators allow your script to determine the status of conditions and,
    in the context of your if...else or while statements, execute certain code based
    on which conditions are true and are false.


    | Operator | Example | Result |

    | --- | --- | --- |

    | ! | !$a | TRUE if $a is not true |

    | && | $a && $b | TRUE if both $a and $b are true |

    | || | $a || $b | TRUE if either $a or $b is true |


    # Control Structures


    Programs are essentially a series of statements. Control structures'
