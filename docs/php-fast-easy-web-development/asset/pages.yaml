    # Escaping Your Code


    Right up there with remembering to end your commands with semicolons is remembering
    to escape things such as quotation marks. When you use quotation marks inside
    other quotation marks, the inner pairs must be delineated from the outside pair
    using the escape (\) character (also known as a backslash).


    The following steps show you what happens when your code isn''t escaped, and how
    to fix it.


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:


