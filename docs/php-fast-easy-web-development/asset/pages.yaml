- pgno: 321
  md: 'I thought about what I wanted for my own table, which I''ve decided to call
    my_contacts. This information appears in the table below.


    | Field Name | Description |

    |---|---|

    | id | Creates a unique ID number for the entry |

    | fname | The person''s first name |

    | lname | The person''s last name |

    | address1 | First line of the address |

    | address2 | Second line of the address |

    | address3 | Third line of the address |

    | postcode | Zip or postal code |

    | country | Country in which the person resides |

    | prim_tel | Primary telephone number |

    | sec_tel | Secondary telephone number |

    | email | E-mail address |

    | birthday | The person''s birthday |


    In the next section, you''ll modify the table-creation scripts from Chapter 12.
    You''ll add the ability to name primary keys and auto-incrementing fields.


    # Modifying the Table-Creation Scripts


    With a few minor modifications to two of the three scripts in the table-creation
    sequence from Chapter 12, you can add check boxes to the form to handle primary
    keys and auto-incrementing fields. These types of fields are incredibly useful
    for ID fields.


    +   1. Open do_showfielddef.php in your text editor.


    +   2. Find the section of $form_block that prints table headings, and add the
    following before the end of the row:


    ```

    <TH>PRIMARY KEY?</TH><TH>AUTO-INCREMENT?</TH>

    ```'
