- pgno: 22
  md: '# Introduction


    About a month after the release of my first book, PHP Essentials, my editors decided
    that a Fast & Easy version was warranted, due to the explosion in PHP usage and
    new developers. This book is what I came up with: a step-by-step, learn-by-example
    path to developing successful Web sites—with pictures included!


    The wonderful world of Open Source and shareware software has allowed us to include
    with this book a CD-ROM containing a Web server, a database server, and the release
    version of PHP 4.0.0. The first three chapters are dedicated to getting these
    tools up and running on your Windows or Linux machine. You''ll be surprised by
    how simple it is to do, and how good it looks on your resume.


    Before jumping into all of that, take a moment to familiarize yourself with PHP
    and its history.


    # What Is PHP?


    Its official name is PHP: Hypertext Preprocessor, and it is a server-side scripting
    language. When your Web browser accesses a URL, it is making a request to a Web
    server. When you request a PHP page, something like http://www.yourcompany.com/home.php,
    the Web server wakes up the PHP parsing engine and says, "Hey! You''ve got to
    do something before I send a result back to this person''s Web browser.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# INTRODUCTION


    Then, the PHP parsing engine runs through the PHP code found in home.php and returns
    the resulting output. This output is passed back to the Web server as part of
    the HTML code in the document, which in turn is passed on to your browser, which
    displays it to you.


    # A Brief History of PHP


    In 1994, an incredibly forward-thinking man named Rasmus Lerdorf developed a set
    of tools that used a parsing engine to interpret a few macros here and there.
    They were not extravagant: a guest book, a counter, and some other "home page"
    elements that were cool when the Web was in its infancy. He eventually combined
    these tools with a form interpretation (FI) package he had written, added some
    database support, and released what was known as PHP/FI.


    Then, in the spirit of Open Source software development, developers all over the
    world began contributing to PHP/FI. By 1997, more than 50,000 Web sites were using
    PHP/FI to accomplish different tasks—connecting to a database, displaying dynamic
    content, and so on.


    At that point, the development process really started becoming a team effort.
    With primary assistance from developers Zeev Suraski and Andi Gutmans, the version
    3.0 parser was created. The final release of PHP 3.0 occurred in June of 1998,
    when it was upgraded to include support for multiple platforms (it’s not just
    for Linux anymore!) and Web servers, numerous databases, and SNMP (Simple Network
    Management Protocol) and IMAP (Internet Message Access Protocol).


    So are we now?


    +   - Millions of Web servers run a version of PHP.

    - PHP 4.0.0 has been released, featuring the Zend engine.

    - Plug-in modules for code optimization and debugging are just around the corner.

    - PHP 4.0.0 can work with just about any combination of Web server, operating
    system, and database you can think up.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# What Does PHP Do?


    PHP does anything you want, except sit on its head and spin. Actually, with a
    little on-the-fly image manipulation and Dynamic HTML, it could probably do that,
    too.


    According to the PHP Manual, "The goal of the language is to allow Web developers
    to write dynamically generated pages quickly."


    Here are some common uses of PHP:


    +   * Perform system functions: create, open, read from, write to, and close files
    on your system; execute system commands; create directories; and modify permissions.

    * Gather data from forms: save the data to a file, send data via e-mail, return
    manipulated data to the user.

    * Access databases and generate content on-the-fly, or create a Web interface
    for adding, deleting, and modifying elements within your database.

    * Set cookies and access cookie variables.

    * Start sessions and use session variables objects.

    * Use PHP user authentication to restrict access to sections of your Web site.

    * Create images on-the-fly.

    * Encrypt data.


    These are just everyday uses. PHP 4.0.0 includes support for Java, Java Servlets,
    XML, and a myriad of other higher-level functions. The possibilities are endless.


    # Is PHP Right For You?


    Only you can decide if PHP should be your language, whether you''re developing
    sites for personal or commercial use on a small or large scale. I can tell you
    that in the commercial realm, I''ve worked with all of the popular server-side
    scripting languages—Active Server Pages (ASP), ColdFusion, Java Server Pages (JSP),
    Perl, and PHP—on numerous platforms and various Web servers, with varying degrees
    of success. PHP is the right choice for me: It''s flexible, fast, and simple in
    its output.'
  merge: -1
  img_proc: true
