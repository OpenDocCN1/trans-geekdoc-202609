    one for

    the feedback form, and one for the PHP script to process the form, send the mail,

    and return a response to the browser.


    # Creating the Feedback Form


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:


    ```

    <HTML>

    <HEAD>

    ```'
