- pgno: 414
  md: "# CONTROL STRUCTURES 389\n\nYou can use if statements alone or as part of an\
    \ if...else or if...elseif...else statement. Whichever you choose, you will find\
    \ this structure to be an invaluable element in your programs!\n\n# while\n\n\
    Unlike the if...else...else structure, in which each expression is evaluated once\
    \ and an action is performed based on its value of true or false, the while statement\
    \ continues to loop until an expression is false. In other words, the loop continues\
    \ while the expression is true.\n\nFor example, in the following while loop, the\
    \ value of $a is printed on the screen and is incremented by 1 as long as the\
    \ value of $a is less than or equal to 3:\n\n```\n$a = 0 // set a starting point\n\
    while ($a <= \"3\") {\n    echo \"equals $a<br>\"\n    $a++;\n}\n```\n\n# for\n\
    \nLike while loops, for loops evaluate the set of conditional expressions at the\
    \ beginning of each loop. Here is the syntax of the for:\n\n```\n(for expr1; expr2;\
    \ expr3) {\n    // code to execute\n}\n```\n\nAt the beginning of each loop, the\
    \ first expression is evaluated, followed by the second expression. If the second\
    \ expression is true, the loop continues by executing the code and evaluating\
    \ the third expression. If the second expression is false, the loop does not continue,\
    \ and the third expression is never evaluated.\n\nTaking the counting example\
    \ used in the while loop, rewrite it using a for loop:\n\n```\nfor ($a = 0; $a\
    \ <= \"3\"; $a++) {\n    echo \"equals $a<br>\"\n}\n```"
