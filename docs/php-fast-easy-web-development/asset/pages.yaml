- pgno: 117
  md: '# Displaying Browser-Specific HTML


    In the previous chapter, you learned to retrieve and print the HTTP_USER_AGENT
    environment variable to the screen. In this chapter, you''ll do a bit more interesting
    with the value of HTTP_USER_AGENT: print browser-specific HTML.


    However, having seen some of the possible values of HTTP_USER_AGENT in the last
    chapter, you can imagine that there are hundreds of slightly different values.
    So, it''s time to learn some basic pattern matching.


    You''ll use the preg_match() function to perform this task. This function needs
    two arguments: what you''re looking for, and where you''re looking:


    ```

    preg_match(/{what you''re looking for}/, "[where you''re looking]");

    ```


    This function will return a value of true or false, which you can use in if...else
    block to do whatever you want. The goal of the first script is to determine if
    a Web browser is Microsoft Internet Explorer, Netscape, or something else. This
    can be a little tricky, but not because of PHP.


    Within the value of HTTP_USER_AGENT, Netscape always uses the string "Mozilla"
    to identify it. Unfortunately, the value of HTTP_USER_AGENT for Microsoft Internet
    Explorer also uses "Mozilla" to show that it''s compatible. Luckily, it also uses
    the string "MSIE", so you can search for that. If the value of HTTP_USER_AGENT
    doesn''t contain either "Mozilla" or "MSIE", chances are very good that it''s
    not one of Web browsers.


    +   1. Open a new file in your text editor.


    +   2. Open a PHP block:


    ```

    <?

    ```


    +   3. Use getenv() to place the value of HTTP_USER_AGENT in a variable $agent:


    ```

    $agent = getenv("HTTP_USER_AGENT");

    ```'
  merge: -1
  img_proc: true
