  md: '# checkdate()


    checkdate() function validates a given date. Successful validation means that
    the year is between 0 and 32767, the month is between 1 and 12, and the proper
    number of days is in each month (leap years are accounted for). Its syntax is


    ```

    checkdate(month, day, year);

    ```


    # mtime()


    mtime() function returns the UNIX timestamp as a long integer (in the format of
    seconds since the Epoch) for a given date. Thus, the primary use of mtime() is
    to format dates in preparation for mathematical functions and date validation.
    Its syntax is


    ```

    mtime(hour, minute, second, month, day, year);

    ```


    # time() and microtime()


    time() function returns the current system time, measured in seconds since the
    Epoch. The syntax of time() is simply


    ```

    time();

    ```


    You could get a result such as 958950466.


    Using microtime() adds a count of microseconds, so instead of just receiving a
    result like 958950466, you would get a result like 0.93121600 958950466, at the
    exact moment you asked for the time since the Epoch (this includes both seconds
    and microseconds).


    The built-in filesystem functions can be very powerful tools—weapons, if used
    incorrectly. Be very careful when using filesystem functions, especially if you
    have PHP configured to run as root or some other system-wide user. For example,
    using a PHP script to issue an rm -R command while at the root level of your directory
    structure would be a very bad thing.'
