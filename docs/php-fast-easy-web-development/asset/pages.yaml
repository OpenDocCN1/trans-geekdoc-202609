  md: '# Creating a Username and Password


    When you installed the MySQL database in Chapter 1, you were working as the anonymous
    or root user. Before you begin working with databases on a regular basis, you
    should create a real user with a real password. There are two simple commands
    to issue, the MySQL monitor and the mysqladmin program.


    > NOTE

    These commands are exactly the same for MySQL on Windows and Linux/UNIX platforms.


    +   1. Start the MySQL monitor.


    +   2. Select the database called mysql by typing Use mysql at the mysql> prompt:


    +   3. Type the following SQL statement, substituting your own username and password:


    insert into user (host, user, password) values (''localhost'', ''sandman'', password(''tQ9472b''));


    +   4. Exit the MySQL monitor by typing exit at the mysql> prompt.


    +   5. Issue the mysqladmin flush-privileges command to reload the privilege tables
    using the mysqladmin program.


    The new user (sandman) will now have access to all databases and tables when using
    the password tQ9472b.


    > NOTE

    ''sandman'' will be the sample user in all database connectivity scripts from
    this point forward. Please substitute your own username and password where appropriate.


    # Connecting to MySQL


    The goal of this script is simply to connect to MySQL, which is running on your
    machine (localhost).


    +   1. Open a new file in your text editor.'
