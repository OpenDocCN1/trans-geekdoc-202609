- pgno: 47
  md: '# 22 CHAPTER 2: INSTALLING APACHE


    # 4. Change the value of ServerAdmin to your e-mail address.


    +   * ServerAdmin: Your address, where problems with the server should be mailed.
    This address appears on some server-generated pages, such as ServerAdmin: admin@example.com

    * ServerName allows you to set a host name which is sent back to Clients if your
    server''s different from the one the program get (i.e., use ServerName: localhost).

    * Note: You cannot just invent host names and they will work. The name you define
    must be resolved on your host. If you don''t understand why, ask your network
    administrator.

    * If you want to use an IP address instead of a name enter it here. You will have
    to access it by address (e.g., http://123.45.67.89/), and this will work everywhere
    in a sensible way.

    * ServerName localhost


    # 5. Change the value of ServerName to localhost.


    # 6. Save the file.


    Apache is now ready to run on your machine. In the next section, you''ll start
    and connect to Apache.


    # Starting Apache


    On the Windows platform, you can run Apache either on your own or as a service
    if you''re using Windows NT.


    # Starting Apache as a Service


    If you are using Windows NT and you want to run Apache as a service, follow these
    steps:


    +   1. From the Windows Start menu, open the Apache Web Server menu and select
    the Install Apache as a service item.

    2. Go to the Control Panel and open the Services window.

    3. Select Apache from the list of services.

    4. Click on Start.


    Apache will now run in the background. In a few moments, you''ll connect to your
    new Web server for the first time.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Manually Starting and Stopping Apache


    If you cannot run Apache as a service, don''t worry. You can still manually start
    and stop Apache.


    ![](img/461c18a4760b99ba5ad0e3e3f65bfb91_48_0.png)


    +   1. From the Windows Start menu, open the Apache Web Server menu and select
    the Start Apache item.


    A DOS window will open.


    Keep this DOS window open, or your Apache process will stop. You can minimize
    the window—just don''t close it.


    To stop Apache, select the Stop Apache item from the Apache Web Server menu on
    the Windows Start menu. For now, though, keep it running. In the next section,
    you''ll connect to your new Web server for the first time.


    # Connecting to Apache


    In the configuration section, you gave a value of localhost to ServerName in the
    httpd.conf file. You''ll use this name to connect to your Web server.


    > NOTE

    Only you can connect to your Web server using localhost. If you have a static
    IP and a machine name that resolves via DNS, you can substitute that name for
    localhost in the httpd.conf file, and other users can connect to that machine.
    This book assumes that you''ll be using localhost for now, but it really makes
    no difference if you have a real machine name. Simply substitute your machine
    name for localhost in the examples.'
  merge: -1
  img_proc: true
