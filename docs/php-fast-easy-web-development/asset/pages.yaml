- pgno: 32
  md: '# Creating a Test Table


    In this section, you''ll create a table in the database you created in the preceding
    section. The utility to use is the mysql program, which allows you to work within
    the MySQL database system from the command line.


    ![](img/461c18a4760b99ba5ad0e3e3f65bfb91_32_0.png)


    +   1. At the prompt, type mysql and press Enter.

    2. When the MySQL Monitor starts, it provides its own prompt. At this prompt (mysql>)
    you will type commands to create tables, insert tables, select data, select data,
    and so on. When ending your commands with a semicolon (;), because it''s a common
    terminator that is used in PHP as well.


    Now that you''ve connected to the MySQL Monitor, you need to tell it which database
    to use.


    ![](img/461c18a4760b99ba5ad0e3e3f65bfb91_32_1.png)


    +   2. At the prompt, use testDB; and press Enter.

    3. The MySQL Monitor will respond with "Database changed" if the database exists
    and you have permission to access it.


    It''s time to create a test table. This table will have a column for an ID number
    and a column for some text.


    > NOTE

    For more information about the specifics of creating tables, see Appendix C, "Basic
    MySQL Reference."'
  merge: -1
