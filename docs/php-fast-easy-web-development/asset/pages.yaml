- pgno: 294
  md: '# # 17

    Session Basics


    Sessions are like cookies on steroids. Using sessions, you can maintain user-specific
    information without setting multiple cookies or even using a database. In this
    chapter, you''ll learn how to do the following:


    +   - Start a session

    - Register a session variable

    - Enable a per-user access count

    - Maintain user preferences throughout multiple pages'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Check Your php.ini File


    Before you start working with sessions, check a value in your php.ini file. Look
    for this option:


    ```

    session.save_path = /tmp ; argument passed to save_handler

    ; in the case of files, this is the

    ; path where data files are stored

    ```


    You''ll need to modify the value of session.save_path so that the file can be
    written to a directory that exists. This change primarily affects Windows users,
    and the modification is simple:


    Enter a directory name after the = for session.save_path. For example, my php.ini
    file on Windows contains this:


    ```

    session.save_path = /Windows/temp ; argument passed to save_handler

    ; in the case of files, this is the

    ; path where data files are stored

    ```


    # What''s a Session?


    In terms of time, a session is the amount of time during which a user visits a
    site. In the programming world, a session is kind of like a big blob that can
    hold all sorts of variables and values.


    +   * This blob has an identification string, such as 940f8b05a40d5119c030c97745ead9.

    * This identification string is automatically sent to the user when a session
    is initiated, in a cookie called PHPSESSID.

    * On the server side, a matching temporary file is created with the same name
    (940f8b05a40d5119c030c97745ead9).'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Understanding Session Variables


    In the temporary session file on the Web server, registered session variables
    (and their values) are stored. Since these values and variables are not kept in
    a database, no additional system resources are required to connect to and extract
    information from database tables.


    For example, a temporary session file might contain the following:


    ```

    count|s:7:"76";nvalid|s:7:"yes";

    ```


    In this example, count and valid are the names of the registered variables and
    "76" and "yes" are their respective values. The keyword here is "registered."
    You have to register a variable within an active session before you can extract
    the value (using $count or $valid, in this example).


    When you attempt to retrieve a registered session variable, the sequence goes
    something like this (say you''re trying to get the value of $count):


    +   1. The PHP parser gets the value of \$PHPSESSID from the user cookie.


    +   2. The PHP parser finds a matching temporary session file.


    +   3. Inside the session file, the PHP parser looks for count and then finds
    its value (say, "76").


    +   4. \$count is equal to 76.


    Next, you''ll start your own per-user counter script using a session.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Starting a Session


    Starting a session is a snap. You just call the session_start() function, and
    PHP takes care of the rest—sending the cookie and creating the temporary file.


    +   1. Open a new file in your text editor.


    +   2. Start a PHP block:


    ```

    <?

    ```


    +   3. Call the session_start() function:


    ```

    session_start();

    ```


    > NOTE

    The session_start() function actually performs several important tasks. First,
    it checks if a session has been started for the current user, and it starts one
    if necessary. It also alerts the PHP engine that session variables and other session-related
    functions will be used within the specific script.

    Because of the dual purpose of session_start(), use it at the beginning of all
    session-related scripts.


    +   4. Create a string to hold a message:


    ```

    $msg = "started a session....";

    ```


    +   5. Close the PHP block:


    ```

    ?>

    ```


    +   6. Type the following HTML:


    ```

    <HTML>

    <HEAD>

    <TITLE>Start a Session</TITLE>

    ```'
  merge: -1
  img_proc: true
