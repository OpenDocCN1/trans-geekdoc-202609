- pgno: 323
  md: '10. If the primary key check box has been checked, append the primary key syntax
    to the $additional variable:


    > NOTE

    The syntax for naming a field as a primary key is separated by a comma from the
    initial field definition. It looks something like this:

    primary key (field_name)


    ```

    $additional .= "", primary key

    ($field_name[$i]});

    ```


    11. If the primary key check box hasn''t been checked, append an empty value to
    the $additional value, and then close the block:


    ```

    } else {

    $additional = "";

    }

    ```


    12. The last change is to the preexisting loop that checks for field length and
    creates parts of the SQL statement. Find the line that looks like this:


    ```

    $sql .= = " ($field_length[$i]),";

    ```


    13. Change the line so that it looks like the following. This ensures that $additional
    string is placed in the proper section of the SQL statement:


    ```

    $sql .= " ($field_length[$i]) $additional ,";

    ```


    14. Similarly, find a line that looks like the following:


    ```

    $sql .= ",";

    ```


    15. Change the line so that it looks like the following:


    ```

    $sql .= " $additional ,";

    ```


    16. Save the file.


    In the next section, you''ll use these new scripts to create the my_contacts table.'
  merge: -1
  img_proc: true
