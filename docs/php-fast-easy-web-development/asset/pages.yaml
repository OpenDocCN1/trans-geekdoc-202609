- pgno: 87
  md: "# PHP Operators\n\nHere are the main types of PHP operators and their functions:\n\
    \n+   - **Assignment operators.** Assign a value to a variable. Can also add to\
    \ or subtract from a variable's current value.\n- **Arithmetic operators.** You\
    \ know all of these operators. Addition, subtraction, division, and multiplication\
    \ occur when these operators are used.\n- **Comparison operators.** Compare two\
    \ values and return either true or false. You can then perform actions based on\
    \ the returned value.\n- **Logical operators.** Determine the status of conditions.\n\
    \nThe rest of this chapter is devoted to discussing some of the main operators\
    \ used in PHP. You'll be writing scripts for each, so hang on to your hat!\n\n\
    # Assignment Operators\n\nYou've already seen an assignment operator at work;\
    \ the equal sign is the basic assignment operator. Burn this into your brain:\
    \ = does not mean \"equal to\"; Instead, == (two equal signs) means \"equal to,\"\
    \ and the single = means \"is assigned to.\"\n\nTake a look at the assignment\
    \ operators in the following table and prepare to write a new script.\n\n| Operator\
    \ | Example | Action |\n|---|---|---|\\| += | $a += 3; | Changes the value of\
    \ a variable to the current value plus the value on the right side. |\n| -= |\
    \ $a -= 3; | Changes the value of a variable to the current value minus the value\
    \ on the right side. |\n .= | $a .= \"string\"; | Concatenates (adds on to) the\
    \ value on the right side with the current value. |"
  merge: -1
  img_proc: true
