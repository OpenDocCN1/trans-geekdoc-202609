  md: '# 182 CHAPTER 11: ESTABLISHING A CONNECTION


    If you can keep errors and warnings to a minimum, it will make the overall user
    experience much more pleasant if your database decides to render itself unavailable
    during peak Web-surfing hours.


    # Listing Databases on a Server


    Now that you''ve successfully used PHP to make a connection to MySQL, familiarize
    yourself with some of the built-in MySQL-related functions. In this section, you''ll
    use the following functions:


    +   - mysql_list_dbs() Used to list the databases on a MySQL server.

    - mysql_num_rows() Returns the number of rows in a result set.

    - mysql_tablename() Despite its name, this function can extract the name of a
    table or database from a result.


    The goal of this script is to list all the databases on the local MySQL server.


    # 1. Open a new file in your text editor.


    # 2. Start a PHP block:


    ```

    <?

    ```


    # 3. Create a variable to hold the result of the mysql_connect() function. Include
    the @ to suppress warnings, as well as the die() function to cause the script
    to end and a message to display if the connection fails:


    ```

    $connection = @mysql_connect("localhost", "sandman", "tq9472b") or ndie("Couldn''t
    connect.");

    ```


    # 4. Create a variable to hold the result of the mysql_list_dbs() function. Include
    the @ to suppress warnings, as well as the die() function to cause the script
    to end and a message to display if the script can''t get the:


    ```

    $dbs = @mysql_list_dbs($connection) or ndie("Couldn''t list databases.");

    ```


    > NOTE

    The only argument necessary for the mysql_list_dbs() function is the link identifier
    for the current connection.'
  merge: -1
  img_proc: true
