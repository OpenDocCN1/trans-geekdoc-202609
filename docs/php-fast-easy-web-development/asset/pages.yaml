    You''re not done yet, but your code should look something like this.


    If you looked at this code in your Web browser, you''d only see a title in the
    title bar. The burning question should be: "Why do we need all that HTML in a
    variable called $form_block?"


    In the next, you''ll add to the script so that it displays particular chunks of
    code based on certain actions. The string in $form_block is one of those chunks.


    # Adding Error Checking to the Script


    The plan is to use the global variable PHP_SELF, which has a value of the script''s
    current name. So really, $PHP_SELF will have a value of allinone_form.php in this
    instance. When you use PHP_SELF as a form action, you''re saying "When the submit
    button is clicked, reload this script and do something" instead of "When the submit
    button is clicked, go find another script and do something."


    Now that you have a shell of it, think about what this all-in-one script must
    do:


    +   * Display the form.

    * Submit the form.

    * Check for errors.

    * Print error messages without sending the form.

    * Send the form if no errors are found.'
