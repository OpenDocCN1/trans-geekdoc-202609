- pgno: 99
  md: '# Getting Variables from Forms


    HTML forms should contain the following elements:


    +   - A method

    - An action

    - A submit button


    In your HTML code, the first line of a form will look something like this:


    ```

    <FORM METHOD="post" ACTION="yourscript.php">

    ```


    When you click on a submit button in an HTML form, variables are sent to the script
    specified by the ACTION via the specified METHOD.


    The method can be either "post" or "get". Variables passed from a form to a PHP
    script are placed in the global associative array $HTTP_POST_VARS or $HTTP_GET_VARS,
    depending on the form method, and are automatically made available to your script.
    In the next section, you''ll see how this works.


    > NOTE

    Enabling variable tracking, or the placement of variables in global arrays, is
    a configuration option in PHP at installation time.


    In the next sections, you''ll create an HTML form and accompanying PHP script
    that perform calculations according to the form input.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Creating a Calculation Form


    In this section, you''ll create the front end to a calculation script. This form
    will contain two input fields and a radio button to select the calculation type.


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:


    <HTML>

    <HEAD>

    <TITLE>Calculation Form</TITLE>

    </HEAD>

    BODY>


    +   3. Begin your form. Assume that the method is post and the action is a script
    called calculate.php:


    <FORM METHOD="post" ACTION="calculate.php">


    +   4. Create an input field for the first value, with a text label:


    <P>Value 1: <INPUT TYPE="text" NAME="val1" SIZE=10></P>


    +   5. Create an input field for the second value, with a text label:


    <P>Value 2: <INPUT TYPE="text" NAME="val2" SIZE=10></P>


    +   6. Add a submit button:


    <P><INPUT TYPE="submit" NAME="submit" VALUE="Calculate\></P>


    +   7. Close your form:


    </FORM>'
