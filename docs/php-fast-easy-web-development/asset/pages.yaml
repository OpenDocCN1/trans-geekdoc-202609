- pgno: 193
  md: '# Check Your php.ini File


    Before you start uploading files, check a few values in your php.ini file. Look
    for these two lines:


    +   - upload_tmp_dir = ; temporary directory for HTTP uploaded files

    - upload_max_filesize = 2097152 ; 2 Meg default limit on file uploads


    You''ll need to modify these lines so the file upload process will work smoothly.


    +   1. Uncomment the upload_tmp_dir line by deleting the initial semicolon.


    +   2. Enter a directory name after the = for upload_tmp_dir.


    +   3. If you want to allow larger uploads, change the number of bytes for upload_max_filesize.


    For example, my php.ini file on Windows contains this:


    +   - upload_tmp_dir = c:/Windows/temp ; temporary directory for HTTP uploaded
    files

    - upload_max_filesize = 2097152 ; 2 Meg default limit on file uploads


    # Understanding the Process


    The process of uploading a file to a Web server through an HTML form interface
    puzzles a lot of people. Take a moment to understand the process you''ll create
    in the sections following this one.


    To start and finish this process, you''ll need the following:


    +   - An HTML form

    - A file to upload

    - A place to put the file

    - A script to put it there'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# CREATING THE FORM 169


    The process itself goes something like this:


    +   1. The user accesses the HTML form and sees a text field and the Browse button
    in his Web browser.


    +   2. The user browses his hard drive for the file he wants to upload and then
    selects a file.


    +   3. The full file path and file name appear in the text field.


    +   4. The user clicks the Submit button.


    +   5. The selected file goes out and lands at the Web server and sits around
    in a temporary directory.


    +   6. The PHP script used in the form action checks that a file was sent and
    executes a copy command on the temporary file to move it to a real directory on
    the Web server.


    +   7. The PHP script confirms the action for the user.


    > NOTE

    The PHP user (the user under which PHP runs, such as "nobody" or "www" or "joe")
    must have write permissions in the temporary directory as well as the target directory
    for the file.


    Start with simply creating the HTML form interface in the next section.


    # Creating the Form


    Start out by creating a one-field form. You can create a form to upload as many
    files as you like after you get this sequence to work with one file.


    +   1. Open a new file in your text editor.'
  merge: -1
  img_proc: true
