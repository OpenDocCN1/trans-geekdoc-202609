- pgno: 75
  md: '# 50 CHAPTER 4: MIXING PHP AND HTML


    This block contains three elements: the command (echo), the string (<P<em>Hello
    World! I''m using PHP!</em></P>), and the instruction terminator (;).


    Familiarize yourself with echo, because it will likely be your most often-used
    command. The echo statement is used to output information—in this case, to this
    HTML output:


    ```

    <P<em>Hello World! I''m using PHP!</em></P>

    ```


    The next section discusses a common error so that hopefully you''ll be able to
    avoid it.


    # The Importance of the Instruction Terminator


    The instruction terminator, also known as the semicolon (;), is absolutely required
    at the end of commands. The instruction terminator tells the PHP parser, “I’m
    done with this thing. Try the next one.


    If you do not end commands with a semicolon, the PHP parser will become confused,
    and your code will display errors. These next steps show you how to avoid one
    of these errors and, more importantly, how to fix it.


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:


    ```

    <HTML>

    <HEAD>

    <TITLE>Making an Error</TITLE>

    </HEAD>

    <BODY>

    ```


    +   3. Type the following PHP code:


    ```

    <?

    echo "<P>I am trying to produce an error</P>"

    echo "<P>Was I successful?</P>"

    ?>

    ```'
  merge: -1
  img_proc: true
