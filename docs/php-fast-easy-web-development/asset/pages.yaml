- pgno: 415
  md: '# Built-In Functions


    All of the following functions are part of the numerous functions that make up
    the PHP language. These really are just a small number of the PHP functions; they
    are the ones I use on a regular basis. Depending on the types of things you''ll
    be doing with PHP, you may or may not need more functions, but please visit the
    PHP Manual at http://www.php.net/manual/ and familiarize yourself with what is
    available.


    # Array Functions


    Numerous PHP functions are available for use with arrays. Only a few are noted
    here—those that I find absolutely essential, and those that form a foundation
    of knowledge for working with arrays.


    # array()


    The array() function allows you to manually assign values to an array. Here is
    the syntax of the array () function:


    ```

    $array_name = array("val1", "val2", "val3", ...);

    ```


    # array_push()


    The array_push() function allows you to add one or more elements to the end of
    an existing array. Its syntax is


    ```

    array_push($array_name, "element 1", "element 2", ...);

    ```


    # array_pop()


    The array_pop() function allows you to take (pop) off the last element of an existing
    array. Its syntax is


    ```

    array_pop($array_name);

    ```


    # array_unshift()


    The array_unshift() function allows you to add elements to the beginning of an
    existing array. Its syntax is


    ```

    array_unshift($array_name, "element 1", "element 2", ...);

    ```'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# array_shift()


    The array_shift() function allows you to take (pop) off the first element of an
    existing array. Its syntax is


    ```

    array_shift($array_name);

    ```


    # array_merge()


    The array_merge() function allows you to combine two or more existing arrays.
    Its syntax is


    ```

    array_merge($array1, $array2, ...);

    ```


    # array_keys()


    The array_keys() function returns an array of all the key names in an existing
    array. Its syntax is


    ```

    array_keys($array_name);

    ```


    # array_values()


    The array_values() function returns an array of all the values in an existing
    array. Its syntax is


    ```

    array_values($array_name);

    ```


    # count()


    The count() counts the number of elements in a variable. It''s usually to count
    the number of elements in an array, because any variable that is not an array
    has only one element—itself.


    In the following example, $a is assigned a value equal to the number of elements
    in the $colors array:


    ```

    $a = count($colors);

    ```


    If $colors contains the values "blue", "black", "red", and "green", $a will be
    assigned a value of 4.'
