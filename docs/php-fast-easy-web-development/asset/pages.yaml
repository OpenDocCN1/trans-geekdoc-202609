  md: '# PHP Resources


    PHP-related Web sites, newsgroups, and mailing lists are popping up all over the
    place. The ones listed here are just a smattering of what''s available.


    # Web Sites


    The majority of these sites are maintained by normal people on their own town,
    so if you use any of their resources, try to give back to the community by helping
    others with their questions when you can, contributing code snippets to code repositories,
    and so forth.


    # www.php.net


    # www.zend.com


    Zend Technologies, the folks behind the Zend engine of PHP4, have created a portal
    site for PHP developers. This personalized site not only showcases how you can
    build a high-traffic, dynamic site using PHP, but it also provides pointers, resources,
    and lessons on how to maximize the potential of PHP in all your online applications.


    # www.thickbook.com


    I created this Web site as a supplement to my books. You will find additional
    code samples and tutorials, book errata, downloadable code from the books, a feedback
    section, and anything else I think up in my spare time.


    # Webmonkey (hotwired.lycos.com/webmonkey/)


    The company that brings us Wired magazine also brings us HotWired, which spawned
    Webmonkey, a developer''s resource site with a section devoted to PHP.'
