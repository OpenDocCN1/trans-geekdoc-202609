    # What’s an Operator?


    In the previous section, you used an assignment operator (=) to assign values
    to your variables. There are other types of assignment operators, as well as other
    types of assignment operators in general. The basic function of an operator is
    to do something with the value of a variable. That “something” can be to assign
    a value, or compare two or more values.'
