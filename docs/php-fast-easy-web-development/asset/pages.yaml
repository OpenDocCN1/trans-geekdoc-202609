  md: '# Displaying Today''s Date


    Compared to the previous section, the changes needed to display the current date
    are a snap! The date() function is highly customizable once you know all the options.


    +   1. Open contact_menu.php in your text editor.

    2. Find this line, because the rest of the changes go in this block:

    } else if ($show_menu == "yes") {

    3. After the line that assigns a value to the $count variable, add this line to
    create a variable $today, containing a formatted date string:

    $today = date("1, F JS S Y");


    > NOTE

    You can find a list of date() function options in Appendix B.


    The date format options are interpreted as follows:


    | Format Option | Description |

    |---|---|

    | l | Long name of day (literal comma) |

    | F | Long name of month |

    | j | Day of month (2-digit) |

    | S | Ordinal suffix |

    | Y | Year (4-digit) |


    +   4. Find the following line in the $display_block string:

    <h1>My Contact Management System</h1>

    5. After it, add the following to print the date string:

    <p><em>Today is $today</em></p>

    6. Save your file.'
