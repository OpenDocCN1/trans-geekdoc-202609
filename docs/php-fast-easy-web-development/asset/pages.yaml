    # HTTP Functions


    The built-in functions for sending specific HTTP headers and cookie data are crucial
    aspects of developing large Web-based applications in PHP. Luckily, the syntax
    for these functions is easy to understand and implement.


    # header()


    The header() function outputs an HTTP header string, such as a location redirection.
    This output must occur before any other data is sent to the browser, including
    HTML tags.


    > NOTE

    This information bears repeating: do not attempt to send information of any sort
    to the browser before sending a header(). You can perform any sort of database
    manipulations or other calculations before the header(), but you cannot print
    anything to the screen—not even a newline character.


    For example, to use the header() function to redirect a user to a new location,
    use this code:


    ```

    header("Location: http://www.newlocation.com");

    exit;

    ```


    > TIP

    Follow a header() statement with the exit command. This ensures that the code
    does not continue to execute.'
