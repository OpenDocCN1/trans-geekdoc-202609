- pgno: 71
  md: '# How PHP Is Parsed


    So you have a file, and in that file you have some HTML and some PHP code. This
    is how it all works. Assume that PHP documents have an extension of .php.


    +   1. The Web browser requests a document with a .php extension.


    +   2. The Web server says, "Hey! Someone wants a PHP file. Something else needs
    to deal with it and sends the request to the PHP parser.


    +   3. The PHP parser finds the requested file and scans it for PHP code.


    +   4. When the PHP parser finds PHP code, it executes that code and places the
    resulting output (if any) into the place in the file formerly occupied by the
    code.


    +   5. This new output file is sent back to the Web server.


    +   6. The Web server sends it along to the Web browser.


    +   7. The Web browser displays the output.


    This method of code execution is called server-side. Code executed by the browser,
    such as JavaScript, is called client-side.


    To combine PHP code with HTML, the PHP code must be set apart from the HTML. In
    the next section, you''ll learn how this is done, using PHP start and end tags.


    # PHP Start and End Tags


    The PHP parser recognizes a few different types of PHP start and end tags. It
    will attempt to execute anything between these tags, so it had better be valid
    code!


    Study the following table to learn the three main sets of start and end tags recognized
    by the PHP parser.'
  merge: -1
  img_proc: true
- pgno: 72
  md: "# PHP START AND END TAGS\n\n| Basic PHP Start and End Tags |\n| Opening Tag\
    \ | Closing Tag |\n| <?php | ?> |\n| <? | ?> |\n| <script language=\"php\"> |\
    \ </script> |\n\nNext, you'll use all three sets of tags in a script, which I\
    \ promise will execute without errors.\n\n+   1. Open a new file in your text\
    \ editor.\n\n+   2. Type the following code, which uses the first tag type:\n\n\
    ```php\n<?php\necho \"<P>This is a test using the first tag type.</P>\";\n?>\n\
