  md: '# Configuring Apache


    At this stage, the only changes you''ll make to the Apache configuration files
    are

    minor administrative changes. Configuration files are located in the conf directory,

    within the Apache installation directory. So, if your installation is

    /usr/local/apache_1.3.12/ the configuration files will be in

    /usr/local/apache_1.3.12/.


    ```

    # ServerAdmin: Your address, where the server should be

    # e-mail This address appears on server-generated pages, such

    # as error documents

    ServerAdmin youraddress

    # ServerName allows you to set a host name that is sent back to clients for

    # if it''s different than the one the program would get (i.e. use

    # instead of the host''s real name)

    # Note: You cannot just invent host names and hope they work. The name you

    choose must be registered for your host, or you will be unable

    tthis. ask your network administrator.

    # If you don''t have a DNS name, enter the IP address here

    You will have to access it by its address (e. g. http://123.45.67.89/)

    # and make redirections in a sensible way

    #ServerName new host name

    ```


    +   1. Open a text editor.


    +   2. Open the httpd.conf file in

    the directory of the Apache

    installation directory.


    +   3. Find this section of text.


    ```

    # ServerName: Your address where the server should be

    # e-mail This address appears on server-generated pages, such

    # as error documents.

    ServerAdmin Julie@localhost.com

    # ServerName allows you to set a host name that is sent back to clients for

    # if it''s different than the one the program would get (i.e., use

    # instead of the host''s real name

    # Note: You cannot just invent host names and hope they work. The name you

    choose must be registered for your host, or you will be unable

    this. ask your network administrator.

    # If you don''t have a DNS name, enter the IP address here.

    You will have to access it by its address (e. g. http://123.45.67.89/)

    # and make redirections in a sensible way.

    ServerName localhost

    ```


    +   4. Change the value of

    ServerAdmin to your e-mail

    address.


    +   5. Change the value of

    ServerName to localhost.


    +   6. Save the file.


    Apache is now ready to run on your machine. In the next section, you''ll start
    and

    configure Apache.'
