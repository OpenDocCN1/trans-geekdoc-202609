    You can use the each() and list() functions to step through the array in fashion,
    printing the key and value for each element in the array:


    ```

    while (list($key, $val) = each(\$HTTP_GET_VARS)) {

    echo "\$key has a value of \$val<br>";

    }

    ```


    # reset()


