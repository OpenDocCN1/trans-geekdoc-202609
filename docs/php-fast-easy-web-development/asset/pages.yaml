  md: '# Running the CD


    To make the CD more user-friendly and take up less of your disk space, we’ve designed
    the CD-ROM so that you can install or copy only those files that you desire.


    # Linux


    +   1. Open the CD-ROM tray and insert the CD.


    +   2. As root, type the following at the command line: mount/dev/cdrom /tmp (replace
    /tmp with wherever you want to mount the CD).


    +   3. Start an X session (startx in most cases).


    +   4. Open your Web browser.


    +   5. Navigate through your file system until you find start_here.html, located
    in the directory where you mounted the CD-ROM.


    +   6. Open start_here.html with your Web browser.


    # Windows 95/98/2000/NT


    +   1. Open the CD-ROM tray and insert the CD.


    +   2. Open your Web browser.


    +   3. Navigate through your file system until you find start_here.html, on the
    CD-ROM.


