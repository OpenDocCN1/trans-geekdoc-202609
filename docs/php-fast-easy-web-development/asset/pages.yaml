    along closely.


    # Installing PHP4 for Windows


    Installing PHP4 with Apache on Windows is the same for Windows 95/98/2000/NT.
    If you encounter any problems, go to the PHP Web site at http://www.php-net/ and
    read the PHP Manual.


    Before you begin, find the CD-ROM included in this book and put it in your CD-ROM
    drive. Now you''re ready to install some files.


    +   1. Using Windows Explorer, navigate through the CD-ROM filesystems.


    +   2. Open the software directory.


    +   3. Open the Windows directory.


    +   4. Double-click on the file called php-4_0_0-Win32.exe. A dialog box will
    open, prompting for confirmation to unzip to C:\WINDOWS\TEMP\


    +   5. Change the unzip location to C:\php4\


    +   6. Click on Unzip to extract the files.


    +   7. Confirm the action by clicking on OK.


    +   8. Click on Close.


