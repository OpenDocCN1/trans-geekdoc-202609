  md: '# CHAPTER 1: INSTALLING AND CONFIGURING MYSQL


    ```

    mysql> explain test_table;

    Field | Type | Key | Default | Extra |

    test_id | int(11) | PRI | NULL | |

    test_note | | | | | |

    2 rows in set (0.05 sec)

    mysql> insert into test_table (''1'', ''This is a note.'');

    Query: 1 row affected (0.01 sec)

    mysql> insert into test_table (''99'', ''Look! Another note.'');

    Query: 1 row affected (0.00 sec)

    mysql> select * from test_table;

    test_id | test_note

    1 | This is a note.

    99 | Look! Another note.

    2 rows in set (0.16 sec)

    ```


    1. At the prompt, type select * from test_table; and press Enter. This command
    selects all fields from all rows (what''s the * does) in the table called test_table
    and returns the data to the screen in a nicely-formatted table.


    MySQL Monitor tells you how many rows were returned and how long it took the query
    to run.


    Add a little order to the results. To get the results by ID number—largest number
    first.


    ```

    mysql> insert into test_table (''1'', ''This is a note.'');

    Query: 1 row affected (0.01 sec)

    mysql> insert into test_table (''99'', ''Look! Another note.'');

    Query: 1 row affected (0.00 sec)

    mysql> select * from test_table order by test_id;

    test_id | test_note

    1 | This is a note.

    99 | Look! Another note.

    2 rows in set (0.16 sec)

    ```


    2. At the prompt, type select from table order by test_id desc; and press Enter.


    The result now shows the rows with a test_id of 99 as the first row in the table.
    The "desc" in the command stands for "descending." There is another option, "asc,"
    which stands for "ascending." Ascending order is the default order.


    The next section is for the installation of MySQL on Linux, assuming you don''t
    have two machines, skip ahead to Chapter 2, "Installing Apache," to install the
    Apache Web server.'
