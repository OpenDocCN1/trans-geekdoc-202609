  md: '# Creating the Record Addition Form


    The HTML form will contain an input field for each column in the my_music database
    table. In the previous chapter, you created eight fields, which corresponds to
    eight columns. Your record addition interface should have a space for each of
    these fields.


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:


    ```

    <HTML>

    <HEAD>

    <TITLE>Add a Record</TITLE>

    </HEAD>

    <body>

    <h1>Add a Record to my_music</h1>

    ```


    > NOTE

    Use the database field names as the value of the NAME attribute in the HTML form
    fields. Also, where appropriate, use the size of the database field as the value
    of the MAXLENGTH attribute in the HTML form fields.


    +   3. Begin your form. Assume that the method is post and the action is a script
    called do_addrecord.php:


    ```

    <FORM METHOD="post" ACTION="do_addrecord.php">

    ```


    +   4. Begin an HTML table to assist in layout. Start a new row and table data
    cell, and then create an input field for the ID, with a text label:


    ```

    <TABLE CELLSPACE=3 CELLPADDING=3>

    <TR>

    <TD VALIGN=TOP>

    <P><STRONG>ID:</STRONG><BR>

    <INPUT TYPE="text" NAME="id" SIZE=5 MAXLENGTH=5</P>

    ```


    +   5. Create an input field for the data acquired with a text label. Close the
    table data cell after the input field:


    ```

    <P><STRONG>Date Acquired (YYYY-MM-DD):</STRONG><BR>

    <INPUT TYPE="text" NAME="date_acq" SIZE=10 MAXLENGTH=10></P>

    <TD>

    ```


    > NOTE

    The date type used in MySQL uses the YYYY-MM-DD format. An example of using a
    date this format is 2000-05-31 (May 31, 2000).'
