  md: '# chmod(), chgrp(), and chown()


    Like the shell commands of the same name, the chmod(), chgrp(), and chown() functions
    modify the permissions, group, and owner of a directory or file. Here is the syntax
    of these functions:


    ```

    chmod("filename", mode);

    chgrp("filename", newgroup);

    chown("filename", newowner);

    ```


    In order to change permissions, groups, and owners, the PHP user must be the owner
    of the file, or the permissions must already be set to allow such changes by that
    user.


    # copy()


    The copy() function works much like the cp shell command: It needs a file name
    and a destination in order to copy a file. The syntax of copy() is


    ```

    copy("source filename", "destination");

    ```


    The PHP user must have permission to write into the destination directory, or
    the copy() function will fail.


    # fopen()


    The fopen() function opens a specified file or URL for reading and/or writing.
    The syntax of fopen() is


    ```

    fopen("filename", "mode")

    ```


    To open a URL, use http:// or ftp:// at the beginning of the file name string.
    You can open URLs only for reading, not writing.


    If the file name begins with anything else, the file is opened from the filesystem,
    and a file pointer to the opened file is returned. Otherwise, the file is assumed
    to reside on the local filesystem.'
