- pgno: 110
  md: '# Retrieving and Using REMOTE_ADDR


    By default, environment variables are available to PHP scripts as $VAR_NAME. For
    example, the REMOTE_ADDR environment variable is already contained as $REMOTE_ADDR.
    However, to be absolutely sure that you''re reading the correct value, use getenv()
    to assign a value to a variable of your choice.


    The $REMOTE_ADDR environment variable contains the IP address of the machine making
    the request. Let''s get the value of your REMOTE_ADDR.


    +   1. Open a new file in your text editor.


    +   2. Open a PHP block:


    ```

    <?

    ```


    +   3. Use getenv() to place the value of REMOTE_ADDR in a variable called $address:


    ```

    $address = getenv("REMOTE_ADDR");

    ```


    +   4. Print the value of $address to the screen:


    ```

    echo "Your IP address is $address.";

    ```


    +   5. Close your PHP block:


    ```

    ?>

    ```


    +   6. Save the file with the name remoteaddress.php.


    +   7. Place this file in the document root of your Web server.'
  merge: -1
  img_proc: true
