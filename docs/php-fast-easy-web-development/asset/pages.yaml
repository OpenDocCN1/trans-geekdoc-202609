- pgno: 54
  md: '# Starting and Stopping Apache


    There''s a handy utility in the bin directory within your Apache installation
    directory called apachectl. It allows you to to issue start, stop, and restart
    commands. Use this utility to start Apache for the first time.


    +   1. To get to the Apache installation directory, type `cd /usr/local/apache_1.3.12`
    and press Enter.


    ```

    $ /bin/apachectl start

    $ /bin/apachectl start: http started

    ```


    ![](img/461c18a4760b99ba5ad0e3e3f65bfb91_54_0.png)


    +   2. Type `/bin/apachectl start` and press Enter.


    You should see a message "httpd started." Then you will return to the prompt.


