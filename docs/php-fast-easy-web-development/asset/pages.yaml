- pgno: 120
  md: '# DISPLAYING PLATFORM-SPECIFIC HTML 95


    ![](img/461c18a4760b99ba5ad0e3e3f65bfb91_120_0.png)


    If you''re using neither Netscape nor Microsoft Internet Explorer, the actual
    value of HTTP_USER_AGENT will be printed.


    The Browser wars raged! No Web browser is used by a vast majority of Web surfers.
    Various flavors of Microsoft Internet Explorer (MSIE) account for approximately
    69% of Web browsers in use, while versions of Netscape (NS) assume the die-hard
    Lynx, Opera, and WebTV users to reach 100%.


    Although a 70/30 split might seem like a majority, if 150 million people have
    access to the Internet, 45 million non-Microsoft users is a high number of users
    to consider when developing a good site.


    HotWired maintains a browser reference at http://www.hotwired.com/webmonkey/reference/browser-chart/
    It shows some of the differences between the major browsers. In the next section,
    you''ll see that all platforms are not created equal, and in fact do not display
    HTML the same way either.


    # Displaying Platform-Specific HTML


    There are differences not only between browsers, but also between platforms. This
    difference is most clear with regards to fonts and font sizes. In the Windows
    world, you have fonts such as Times New Roman and Courier New. Slight variations
    of these fonts appear on the Macintosh and Linux/UNIX platforms; they are called
    Times and Courier. It doesn''t end there—the font sizes all display differently.
    A 10-point font on Macintosh or Linux is sometimes legible, but if you bump it
    up to 11- or 12-point, you are in business. If that same 12-point font is viewed
    on Windows, however, it might look like your text is trying to take over the world.'
  merge: -1
  img_proc: true
- pgno: 121
  md: "So, what to do? Use your new pattern-matching skills to extract the platform\
    \ from\nthe HTTP_USER_AGENT string, and then display platform-specific HTML. As\
    \ with\nmatching on a keyword—which you did in the previous section—you need to\n\
    know what you're looking for nail down the platform. In the next script, you'll\n\
    check for the keywords \"Win\" and \"Linux\" and print an appropriate stylesheet\n\
    block in your HTML result page.\n\n# 1. Open a new file in your text editor.\n\
    \n# 2. Open a PHP block:\n\n```\n<<?\n```\n\n# 3. Use getenv() to place the value\
    \ of HTTP_USER_AGENT in a variable called $agent:\n\n```\n$agent = getenv(\"HTTP_USER_AGENT\"\
    );\n```\n\n# 4. Start an if...else statement to find which of the preg_match()\
    \ functions is\ntrue, starting with the search for \"Win\":\n\n```\nif (preg_match(\"\
    /Win/i\", \"$agent\")) {\n  $style = \"win\"\n}\n```\n\n# 5. Continue the statement,\
    \ testing for \"Linux\":\n\n```\nelse if (preg_match(\"/linux/i\", \"$agent\"\
    )) {\n  $style = \"linux\";\n}\n```\n\n# 6. Create a basic stylesheet block for\
    \ Windows users:\n\n```\n$win_style = \"\"\n<style type=\"text/css\">\nnp, ul,\
    \ ol, li (font-family:Arial;font-size:10pt;font-weight:normal);\\n\nh1 (font-family:Arial;font-size:16pt;font-weight:bold);\\\
    n\nh2 (font-family:Arial;font-size:14pt;font-weight:bold);\\n\nstrong (font-family:Arial;font-size:10pt;font-weight:bold);\\\
    n\nem (font-family:Arial;font-size:10pt;font-style:italic);\\n\n</style>\n```\n\
    \n```\n\\?> * *;\n```"
