    # Selecting Data from the my_music Table


    The next four sections contain scripts that are variations on a theme: selecting
    and displaying data. A large portion of the scripts is repeated, but repetition
    makes perfection, as they say.


    The only new function in these scripts is the mysql_fetch_array() function. This
    function takes the result of a SQL query and fetches the rows in array format.
