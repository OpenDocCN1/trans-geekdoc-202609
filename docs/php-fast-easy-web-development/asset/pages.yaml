    In the next section, you''ll learn a good programming practice: commenting your
    code so people know what the heck is going on in it.


    # Commenting Your Code


    Commenting code is an excellent habit. Entering comments in HTML documents helps
    you (and others who might have to edit your document later) keep track of areas
    of large documents. Commenting also allows you to write notes to yourself during
    the development process.


    HTML comments are ignored by the browser and are contained within <!-- --> tags.
    For example, the following comment reminds you that the code following contains
    your logo graphic:


    ```

    <<!-- logo graphic goes here -->

    ```


    PHP uses comments, which are ignored by the PHP parser. PHP comments are usually
    preceded by double slashes, like this:


    ```

    // this is a comment in PHP code

    ```'
