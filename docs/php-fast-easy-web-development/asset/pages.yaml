  md: '# Windows Users:

    Check php.ini File


    If you''re using PHP4 on Windows, look for the following lines in your php.ini
    file:


    ```

    [mail function]

    SMTP            = ;for win32 only

    sendmail_from   = ;for win32 only

    ```


    You''ll need to modify the last two lines so that the mail() function works properly.


    +   1. For the SMTP entry, use "localhost" or the name of the outgoing mail server

    you use in your e-mail client.


    +   2. For the sendmail_from entry, enter your e-mail address.


    For example, my php.ini file on Windows contains this:


    ```

    [mail function]

    SMTP            = localhost

    sendmail_from   = julie@thickbook.com

    ```


