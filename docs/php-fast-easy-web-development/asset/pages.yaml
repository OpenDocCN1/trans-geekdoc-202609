- pgno: 83
  md: '# What''s a Variable?


    A variable is a representation of a particular value, such as "blue" or "19349377".
    By assigning a value to a variable, you can reference the variable in other places
    in your script, and that value will always remain the same (unless you change
    it, which you''ll learn about later).


    To create a variable, do the following:


    +   1. Think of a good name! For instance, if I want to create a variable to hold
    a username, I name my variable:


    username

    2. Put a dollar sign ($) in front of that name:


    $username

    3. Use the equal sign after the name (=) to assign a literal value to that variable.
    Put the value in quotation marks:


    $username = "joe"

    4. Assigning a value to a variable is an instruction, and as such should be terminated
    with a semicolon:


    $username = "joe";


    There you have it—a variable called "username" with a value of "joe". Later in
    this chapter, you''ll do some exciting things (such as math) with your variables!


    # Naming Your Variables


    As you''ve seen, variables begin with a dollar sign ($) and are followed by a
    meaningful name. The variable name cannot begin with a numeric character, but
    it can contain numbers and the underscore character (_). Additionally, variable
    names are case-sensitive, meaning that $YOURVAR and $yourvar are two different
    variables.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# PHP VARIABLE AND VALUE TYPES 59


    Creating meaningful variable names is another way to lessen headaches while coding.
    If your script deals with name and password values, don''t create a variable called
    $sn for name and $sp for the password—these are not meaningful names. If you pick
    up that script weeks later, you might think that $sn is the variable for "number"
    rather than "name" and that $sp stands for "page" rather than "password".


    # PHP Variable and Value Types


    You will create two main types of variables in your PHP code: scalar and array.
    Scalar variables contain only one value at a time, and arrays contain a list of
    values, or even another array.


    The example at the beginning of this chapter ($username = "joe") created a scalar
    variable, and the code in this book deals primarily with scalar variables. You
    can find information on arrays in Appendix B, "Essential PHP Language Reference.".


    When you assign a value to a variable, you usually assign a value of one of the
    following types:


    +   * Integers. Whole numbers (numbers without decimals). Examples are 1, 345,
    and 9922786. You can also use octal and hexadecimal notation: the octal 0123 is
    decimal 83 and the hexadecimal 0x12 is decimal 18.


    +   * Floating-point numbers ("floats" or "doubles"). Numbers with decimals. Examples
    are 1.5, 87.3446, and 0.8889992.


    +   * Strings. Text and/or numeric information, specified within double quotes
    ("") or single quotes (''\'').


    As you begin your PHP script, plan your variables and variable names carefully,
    and use comments in your code to remind yourself of the assignments you have made.'
  merge: -1
  img_proc: true
