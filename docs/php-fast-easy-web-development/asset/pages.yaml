    .dll files for additional PHP functionality, see Appendix A, "Additional Configuration
    Options."


    You''re now ready to move on to Part II, "The Absolute Basics of Coding in PHP,"
    and learn the fundamentals of the PHP language.


    # # If You''re Using Linux


    This section will show you how to install PHP4 on Linux using a file from this
    book''s CD-ROM, so track it down before you get started. This same file should
    work for other flavors of UNIX as well.


    You will build PHP4 as a dynamic module for Apache. By building a dynamic rather
    than a static module, you can upgrade or recompile PHP4 without having to recompile
    Apache as well.


    For example, all you''ll be doing in this section is configuring PHP for MySQL
    support. If you decide you want additional options later in the game—such as image
    creation functions or additional encryption functions—you''ll only have to change
    the configuration command for PHP4, recompile it, and restart Apache. No additional
    changes will be needed for the Apache installation.'
