- pgno: 29
  md: '# If You''re Using Windows


    The installation of MySQL on the Windows platform is a breeze, because an installation
    wizard does most of the work for you! You''ll be working with a file from this
    book''s CD-ROM , so track it down before you get started.


    # Installing MySQL for Windows


    Installing MySQL as a stand-alone process is the same for Windows 95/98/2000/NT.
    If you encounter any problems, go to the MySQL Web site at http://www.mysql.com/
    and read your manual.


    Before you begin, find the CD-ROM included in this book, and put it in your CD-ROM
    drive. Now you''re ready to install some files.


    +   1. Using Windows Explorer, navigate through the CD-ROM filesystem.


    +   2. Open the software directory.


    +   3. Open the Windows directory.


    +   4. Double-click on the file called mysql-shareware-3_22_34-win.exe. A dialog
    box will open, prompting for confirmation to unzip to C:\WINDOWS\TEMP\.


    +   5. Click on Unzip to extract the temporary files.


    +   6. Under the Start menu, select Run.


    +   7. Browse to C:\WINDOWS\TEMP\Setup.exe and click on OK. The MySQL Setup program
    will begin.'
  merge: -1
  img_proc: true
