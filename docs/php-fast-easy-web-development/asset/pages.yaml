- pgno: 403
  md: '# Windows Extensions


    The following support is compiled into the Windows binary release of PHP4.0.0:


    +   * Regular expression support

    * Dynamic library support

    * Internal Sendmail support

    * Perl-compatible regular expression support

    * ODBC support

    * Session support

    * XML support

    * MySQL support


    To get additional functionality, additional extensions (.dll files) are required.
    Some possibilities are listed in the following table.


    | Filename | Description |

    | --- | --- |

    | php_calendar.dll | Calendar conversion functions |

    | php_crypt.dll | Crypt support |

    | php_abase.dll | DBase support |

    | php_filepro.dll | Read-only access to Filepro databases |

    | php_ftp.dll | FTP-related functions |

    | php_gd.dll | GD Library functions for graphic manipulation |

    | php_imap.dll | IMAP support |

    | php_java.dll | Java support |

    | php_ldap.dll | LDAP functions |

    | php_mcrypt.dll | Mcrypt support |

    | php_mssql65.dll | Microsoft SQL Server 6.5 support |

    | php_mssql70.dll | Microsoft SQL Server 7.0 support |

    | php_nsmail.dll | Netscape mail functions |

    | php_oci8.dll | Oracle 8 support |

    | php_oracle.dll | Oracle support |

    | php_zlib.dll | ZLib functions |'
  merge: -1
