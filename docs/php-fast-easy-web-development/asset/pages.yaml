- pgno: 283
  md: '# What''s a Cookie?


    Cookies are little pieces of text that are sent to a user''s Web browser. Cookies
    can help you create shopping carts, user communities, and personalized sites.
    It''s not recommended that you store sensitive data in a cookie, but you can store
    a unique identification string that will match a user with data held securely
    in a database.


    Take the shopping example. Suppose you assign an identification variable to a
    user so that you can track what he does when he visits your site. The first user
    logs in, and you send a cookie with variables designed to say, "This is Joe, and
    Joe is allowed to be here." While Joe is surfing around your site, you can say,
    "Hello, Joe!" on and every page. If Joe clicks through your catalog and chooses
    14 different items to buy, you can keep track of these items and display them
    all in a bunch when Joe goes to the checkout area.


    # Setting Cookies


    Before you start setting cookies, determine how you will use them and at what
    point you will set them. Whatever cookies you decide to set, remember that you
    absolutely must set a cookie before sending any other content to the browser,
    because a cookie is actually part of the header information.


    ```

    <html>

    <head>

    <title>Bad Cookie</title>

    </head>

    <body>

    setcookie="test=ok; domain="yourdomain.com"; expires=0;

    <h1 style="color:red">Bad Cookie</h1>

    </html>

    </body>

    </html>

    ```


    > If you heed this warning, you won''t spend hours wondering why you''re getting
    "Cannot add header information" errors.


    This sample code does just that.


    ![](img/461c18a4760b99ba5ad0e3e3f65bfb91_283_0.png)'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# SETTING COOKIES 259


    It produces this error.


    Anytime you see this error,

    assume that you''ve sent

    something to the Web browser.

    This can include white space, a

    line break, or text you can

    actually see.


    The setcookie() function, used to set one cookie at a time, expects six arguments:


    +   * **Name.** Holds the name of the variable that will be kept in the global
    $HTTP_COOKIE_VARS and will be accessible in subsequent scripts.

    * **Value.** The value of the variable passed in the name parameter.

    * **Expiration.** Sets a specific time at which the cookie value will no longer
    be accessible. Cookies without a specific expiration will expire when the browser
    closes.

    * **Path.** Determines for which directories the cookie is valid. If a single
    slash is in the path parameter, the cookie is valid for all files and directories
    on the Web server. If a specific directory is named, this cookie is valid only
    for pages within that directory.

    * **Domain.** Cookies are valid only for the host and domain that set them. If
    no domain is specified, the default value is the host of the server that generated
    the cookie. The domain parameter must have at least two periods in the string
    in order to be valid.

    * **Security.** If the security parameter is 1, the cookie will only be transmitted
    via HTTPS.


    This following line is an example of a cookie called id with a value of 55ds80892jsjs2.
    This particular cookie will expire in four hours (the current time plus 14400
    seconds), and is valid for any page below the document root on the yourdomain.com.


    ```

    setcookie("id", "55ds80892jsjs2", time()+14400, "/", ".yourdomain.com",0);

    ```'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# CHAPTER 16: USING COOKIES


    In the next section, I''ll give you a cheat sheet for common values of time. Then
    you''ll move into using cookie variables.


    # Counting Time


    If you want to specify an expiration date or time, the easiest way to do that
    is to tell PHP to count forward for you, and then place a value in the expiration
    slot within the setcookie() function. This value should be a UNIX time integer
    (the number of seconds since January 1, 1970), which you can get using the time()
    function, with additional seconds added to it.


    The following table shows some common uses of time() +n within the setcookie()
    function.


    | Value | Definition |

    | --- | --- |

    | time()+60 | One minute from the current time |

    | time()+900 | 15 minutes from the current time |

    | time()+1800 | 30 minutes from the current time |

    | time()+3600 | One hour from the current time |

    | time()+14400 | Four hours from the current time |

    | time()+43200 | 12 hours from the current time |

    | time()+86400 | 24 hours from the current time |

    | time()+259200 | Three days from the current time |

    | time()+604800 | One week from the current time |

    | time()+2592000 | 30 days from the current time |


    # Setting a Test Cookie


    The goal of this little script is to set a test cookie and then print a message
    to the screen. Before you start, modify your Web browser preferences to prompt
    you before setting cookies. This is the only way to watch a cookie as the server
    attempts to send it to your browser.'
  merge: -1
  img_proc: true
