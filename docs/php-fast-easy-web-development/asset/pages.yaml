    ```

    split(pattern, string, [limit]);

    ```


    If a limit is specified, the split() function stops at the named position—for
    example, at the tenth value in a comma-delimited list.


    # # Session-Handling Functions


    Session handling is a way of holding on data as a user navigates your Web site.
    Data can be variables or entity objects. These simple functions are just a few
    of the session-related functions in PHP; see the PHP Manual at http://www.php.net/manual/
    for more.


    # # session_start()


    The session_start() function starts a session if one has not already started,
    or it resumes a session if the session ID is present for the user. This function
    takes no arguments and is called simply by placing the following at the beginning
    of the code:


    ```

    session_start();

    ```


    # # session_register()


    The session_register() function registers a variable within the current session.
    In other words, if you want to keep track of the value of a variable called $username
    within a user''s session, you must first register $username as a session variable.
    Its syntax is


    ```

    session_register("variable_name");

    ```'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# 408 APPENDIX B: ESSENTIAL PHP LANGUAGE REFERENCE


    For example, to register $username as a global session variable, use:


    ```

    session_register("username");

    ```


    # session_unregister()


    The session_unregister() function unregisters, or "forgets," a variable within
    the current session. Its syntax is


    ```

    session_unregister("variable_name");

    ```


    For example, to forget about the global session variable called $username, use:


    ```

    session_unregister("username");

    ```


    # session_destroy()


    The session_destroy() function effectively destroys all the variables and values
    registered for the current session. This function takes no arguments and is called
    simply by placing the following in your code:


    ```

    session_destroy();

    ```


    # String Functions


    This section only scratches the surface of PHP''s built-in string manipulation
    functions, but if you understand these common functions, your programming life
    will be quite a bit easier!


    # addslashes() and stripsslashes()


    The addslashes() and stripsslashes() functions are very important when inserting
    and retrieving data from a database. Often, text inserted into a database will
    contain special characters (single quotes, double quotes, backslashes, NULL) that
    must be "escaped" before being inserted. The addslashes() function does just that,
    using this syntax:


    ```

    addslashes(string);

    ```


    Similarly, the stripsslashes() function returns a string with the slashes taken
    away, using this syntax:


    ```

    stripslashes(string);

    ```'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# chop(), ltrim(), and trim()


    All three of these functions remove errant white space from a string. The chop()
    function removes white space from the end of a string, and ltrim() removes white
    space from the beginning of a string. The trim() function removes both leading
    and trailing white space from a string. Here is the syntax of these functions:


    ```

    chop(string);

    ltrim(string);

    trim(string);

    ```


    # echo()


    The echo() function returns output. The syntax of echo() is


    ```

    echo(parameter1, parameter 2, ...)

    ```


    For example:


    ```

    echo "I''m using PHP!\; // output is: I''m using PHP!

    echo 2+6; // output is 8

    ```


    The parentheses are not required when using echo.


    # explode() and implode()


    The explode() splits a string using a given separator and returns the values in
    an array. The syntax of explode() is


    ```

    explode("separator", "string");

    ```


    For example, the following code takes a string called $color_list, containing
    a comma-separated list of colors, and places each color into an array called $my_colors:


    ```

    $color_list = "blue,black,red,green,yellow,orange";

    $mycolors = explode(",", $color_list);

    ```


    Conversely, the implode() function takes an array and makes it into a string,
    using a given separator. The syntax of implode() is


    ```

    implode("separator", "string");

    ```'
  merge: -1
  img_proc: true
- pgno: 435
  md: 'For example, the following code takes an array called $color_list and then
    creates a string called $mycolors, containing the values of the $color_list array,
    separated by commas:


    ```

    $mycolors = implode("*", $color_list);

    ```


    # htmlspecialchars() and htmlentities()


    The htmlspecialchars() and htmlentities() functions convert special characters
    and HTML entities within strings into their acceptable representations. The htmlspecialchars()
    function converts only the less-than sign (< becomes &lt;), greater-than sign
    (> becomes &gt;), double quotes ("") becomes &quot;), and the ampersand (& becomes
    &amp;


    The htmlentities() function converts the characters in the ISO-8859-1 character
    set to the proper HTML entity. Here is the syntax of these functions:


    ```

    htmlspecialchars(string);

    htmlentities(string);

    ```


    # nl2br()


    The nl2br() function replaces all ASCII newlines with the HTML line break (<BR>).
    The syntax of the nl2br() function is


    ```

    nl2br(string);

    ```


    # sprintf()


    The sprintf() function returns a string that has been formatted according to a
    set of directives, as listed in the table on the next page. The syntax of sprintf()
    is


    ```

    sprintf(directives, string);

    ```


    # strlen()


    The strlen() function returns the length of a given string. Its syntax is


    ```

    strlen(string);

    ```'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# sprintf() Function Formating Directives


    | Directive | Result |

    | --- | --- |

    | % | Adds a percent sign. |

    | b | Considers the string an integer and formats it as a binary number. |

    | c | Considers the string integer and formats it with that ASCII value. |

    | d | Considers the string integer and formats it as a decimal number. |

    | f | Considers the string a double and formats it as a floating-point number.
    |

    | o | Considers the string an integer and formats it as an octal number. |

    | s | Considers and formats the string as a string. |

    | x | Considers the string an integer and formats it as a hexadecimal number (lowercase
    letters). |

    | X | Considers the string an integer and formats it as a hexadecimal number (uppercase
    letters). |


    # strtolower()


    strtolower() function returns a given string with all alphabetic characters in
    lowercase. Its syntax is


    ```

    strtolower(str);

    ```


    # strtoupper()


    strtoupper() function returns a given string with all alphabetic characters in
    uppercase. Its syntax is


    ```

    strtoupper(str);

    ```


    # substr()


    substr() function returns a portion of a string, given a starting position and
    optional ultimate length. Its syntax is


    ```

    substr(string, start, [length]);

    ```'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# 412 APPENDIX B: ESSENTIAL PHP LANGUAGE REFERENCE


    If the start position is a positive number, the starting position is counted from
    the beginning of the string. If the start position is negative, the starting position
    is counted from the end of the string.


    Similarly, if the optional length parameter is used and is a positive number,
    the length is counted from the beginning of the string. If the length parameter
    is used and is a negative number, the length is counted from the end of the string.


    For example:


    ```

    $new_string = substr("PHP is great", 1); // returns "HP is great!"

    $new_string = substr("PHP is great", 0, 7); // returns "PHP is "

    $new_string = substr("PHP is great", -1); // returns "!"

    $new_string = substr("PHP is great", -6, 5); // returns "great"

    ```


    # ucfirst()


    ucfirst() function changes the first alphabetic character in a string to an uppercase
    character. Its syntax is


    ucfirst(string);


    # ucwords()


    ucwords() function changes the first letter of each word in a string to uppercase.
    Its syntax is


    ucwords(string);


    # Variable Functions


    The basic variable functions, isset() and unset(), help you manage your variables
    within the scope of an application.


    isset() function determines whether a variable exists. The unset() function explicitly
    destroys the named variable. Here is the syntax of each:


    ```

    isset(var);

    unset(var);

    ```


    isset() function returns true if the variable exists and false if it does not.'
