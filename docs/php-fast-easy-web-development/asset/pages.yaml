- pgno: 404
  md: 'The only files included in the PHP4.0.x distribution package are php_calendar.dll,
    php_imap.dll, and php_ldap.dll. Short of building from Windows source, you''re
    currently limited to the kindness of others within the Open Source movement. One
    developer keeps reasonably up-to-date extensions at http://download.swwwing.com/php4/modules/


    To use Windows extensions, simply place them in your PHP directory and then modify
    the php.ini file.


    +   1. Find a section that starts like this:


    ;Windows Extensions


    +   2. For each extension you want to use, take away the semicolon before the
    name if the file is in the list.


    +   3. If the file is not in the list, add it:


    extension=[your_extension_name].dll


    +   4. After changing anything in the php.ini file, check the output of phpinfo()
    to verify your changes.


    # Linux Configuration Options


    Here is the configuration line used in Chapter 3 to build PHP:


    ```

    ./configure --mysql=/usr/local/mysql-3.22.32-pc-linux-gnu-i686/ --with-apxs=/usr/local/apache_1.3.12/bin/apxs

    ```


    This line tells PHP to include support for MySQL and build as a dynamic module.
    Many other configuration options are available to you, many of which you''ll never
    use (I know I don''t). The table below lists them in case you want to fiddle with
    your installation. Remember, since PHP is an Apache dynamic module, you don''t
    have to recompile Apache when making changes to PHP.'
  merge: -1
  img_proc: true
