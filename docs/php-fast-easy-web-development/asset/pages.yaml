    <li><a href="sel_byid.php">ordered by ID</a>

    ```


    +   4. Add a link to a script called sel_bydateacq.php. This script will display
    the records, ordered by date acquired. The most recently acquired item will be
    listed first:


    ```

    <li><a href="sel_bydateacq.php">ordered by date acquired</a> (most recent first)

    ```


    +   5. Add a link to a script called sel_byitle.php. This script will display
    the records, ordered by title:


    ```

    <li><a href="sel_byitle.php">ordered by title</a>

    ```


    +   6. Add a link to a script called sel_byartist.php. This script will display
    the records, ordered by artist:


