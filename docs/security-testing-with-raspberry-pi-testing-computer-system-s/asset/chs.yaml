  \ (KJV)\n\n## 关于作者\n\nDaniel W. Dieterle 在 IT 领域工作了 20 多年。在此期间，他曾在一家计算机支持公司工作，为纽约州北部和整个宾夕法尼亚州的数百家公司提供系统和网络支持。他还在一家财富\
  \ 500 强企业的数据中心工作过，在常春藤学院的计算机支持部门短暂工作，并在一家电气工程公司担任过。\n\n在过去的 9 年里，Daniel 作为计算机安全研究员和作者完全专注于安全领域。他的文章发表在国际安全杂志上，并被技术实体和媒体引用。他基于\
  \ `Kali Linux` 的书籍在全球范围内被大学、技术培训中心、政府和私营机构作为教学培训资源。Daniel 协助创建了许多安全培训课程和技术培训书籍，主要基于道德黑客和\
  \ `Kali Linux`，并乐于帮助该领域的新手。\n\nDaniel W. Dieterle\n\n![](img/00002.jpeg)\n\n电子邮箱：cyberarms@live.com\n\
