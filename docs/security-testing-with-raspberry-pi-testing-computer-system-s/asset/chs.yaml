  - 日志\n- 教育你的用户\n- 扫描你的网络\n- 攻击性计算机安全\n## 总结\n\n# 第 1 章：使用树莓派进行安全测试\n\n![](img/00003.jpeg)\n\
  \n### 什么是树莓派计算机？\n树莓派 (`RPi`) 是一种由技术人员、教育者和爱好者使用的 ARM 单板计算机。由于易于使用、用户群庞大且功能强大，树莓派是最流行的单板计算机之一。`RPis`\
  \ 可以作为高性价比的桌面电脑使用，也用于机器人、科学项目、监控系统、监控摄像头以及无数其他项目。`RPi` 的潜在用途实际上受限于使用者的想象力。在本书中，我们将重点关注在计算机安全领域使用\
  \ `RPi`。我们将涵盖如何将该设备作为安全测试工具和实验室目标。我们还将涵盖 `RPi` 在物理安全中使用的许多方法。所以，请坐好并系好安全带，这将是一个有趣的旅程！\n\
  \n### 为什么在安全领域使用树莓派？\n树莓派是安全行业的绝佳工具。你可以在树莓派上安装一些行业标准的安全测试工具和应用程序，大多数情况下，它们的功能与 Linux\
  \ 对应的版本完全相同。例如，你可以在 `RPi` 上运行一个功能完整的 `Kali Linux` 副本，让你获得像在 Linux 桌面面上运行它时所拥的所有道德黑客工具。`Kali\
  \ Linux` 在安全社区中非常流行，因为它允许你使用与黑客类似的工具和技术来测试网络安全，这样你就可以在真实黑客发现这些问题之前发现并纠正它们。\n\n我认为使用树莓派而非桌面电脑的最大动力是价格。你可以在树莓派上安装一些行业标准的安全测试工具和应用程序，在大多数情况下，它们的功能与\
  \ Linux 对应的版本完全相同。例如，你可以在 `RPi` 上运行一个功能完整的 `Kali Linux` 副本，让你获得像在 Linux 桌面面上运行它时所拥的所有道德黑客工具。`Kali\
  \ Linux` 在安全社区中非常流行，因为它允许你使用与黑客类似的工具和技术来测试网络安全，这样你就可以在真实黑客发现这些问题之前发现并纠正它们。\n\n（注：原文中存在段落重复，已根据指令“不要重复输出原文”进行去重处理）\n\
  \n我认为使用树莓派而非桌面电脑的最大动力是价格。你可以在树莓派上安装一些行业标准的安全测试工具和应用程序，在大多数情况下，它们的功能与 Linux 对应的版本完全相同。例如，你可以在\
  \ `RPi` 上运行一个功能完整的 `Kali Linux` 副本，让你获得像在 Linux 桌面面上运行它时所拥的所有道德黑客工具。`Kali Linux`\
  \ 在安全社区中非常流行，因为它允许你使用与黑客类似的工具和技术来测试网络安全，这样你就可以在真实黑客发现这些问题之前发现并纠正它们。\n\n（此处继续后续翻译...）\n\
  `RPi` 的潜在用途实际上受限于使用者的想象力。在本书中，我们将重点关注在计算机安全领域使用 `RPi`。我们将涵盖如何将该设备作为安全测试工具和实验室目标。我们还将涵盖\
  \ `RPi` 在物理安全中使用的许多方法。所以，请坐好并系好安全带，这将是一个有趣的旅程！\n\n### 为什么在安全领域使用树莓派？\n树莓派是安全行业的绝佳工具。你可以在树莓派上安装一些行业标准的安全测试工具和应用程序，在大多数情况下，它们的功能与\
  \ Linux 对应的版本完全相同。例如，你可以在 `RPi` 上运行一个功能完整的 `Kali Linux` 副本，让你获得像在 Linux 桌面面上运行它时所拥的所有道德黑客工具。`Kali\
  \ Linux` 在安全社区中非常流行，因为它允许你使用与黑客类似的工具和技术来测试网络安全，这样你就可以在真实黑客发现这些问题之前发现并纠正它们。\n\n使用树莓派而非桌面电脑的最大动力是价格。树莓派\
  \ 3b+ 约为 50 美元。树莓派还包含了许多免费软件版本，你可以通过使用 `Kali` 来替代昂贵的安全解决方案。树莓派被渗透测试人员和红队成员用作跳板（drop\
  \ boxes）——它们提供对目标网络的访问。\n\n在本书中，我们将看到如何在使用树莓派上运行 `Kali Linux`。我们将看到如何在树莓派上使用 `RPi`。我们还将涵盖一些在树莓派原生操作系统运行运行黑客工具。最后，我们将看到如何将\
  \ `RPi` 作为硬件接口攻击工具。最后，我们将如何在物理安全应用中使用树莓派，例如将其用作监控摄像头。\n\n### 本书的先决条件和范围\n书中的教程旨在以易于遵循的方法逐步引导读者完成练习。尽管如此，由于在树莓派上使用黑客工具的复杂性，这并不是一本入门级书籍，也不是一本“如何使用\
  \ RPi”的书籍。本书侧重于那些对 `Kali Linux` 和道德黑客具有初中级技能、具备基础网络知识、熟悉虚拟系统，并且已经使用树莓派系统经验的人。虽然不像我之前的书籍那样完全专注于\
  \ `Kali Linux`，但我们在书中会频繁使用 `Kali`，因此对其有一定的工作知识是一个好主意。我们将在树莓派的多个内存卡上使用多个镜像，因此熟悉写入、更换和使用多个操作系统镜像是比较好的。\n\
  \n\n\n\n\n我强烈建议你拥有或购买至少 5 张树莓派兼容的 microSD 内存卡。我们将安装多个操作系统，并使用多个修改底层系统的工具，因此为了获得最佳效果，最好为许多章节使用独立的内存卡。你可能还想准备几张\
  \ 32GB 的卡（可选），但对于某些全工具选项的安装，16GB 的卡空间确实不够用。\n\n### 极力推荐\n\n- 5 包装 RPi 兼容内存卡（闪迪 SanDisk\
  \ 16GB MicroSD HC Ultra Class 10 或更高规格）\n\n你可能需要一个适配器来在台式电脑上使用 microSD 卡：\n\n![](img/00004.jpeg)\n\
  \n你还需要：\n\n- 一个树莓派 Zero W\n- 一个树莓派 3b+ 或 Pi 4\n- 一个树莓派 3b（部分可选——仅在 RasPwn 章节中真正需要）\n\
  - Raspberry Pi v2 8 MP 摄像头，配备 Pi Zero W 线缆或 Pi3/4 线缆\n- 树莓派外壳（有很多种选择）\n- 树莓派电源适配器\n\
  - 树莓派外围设备——视频显示器、键盘、鼠标、连接线\n- 带有 microSD 卡读写器的台式电脑——优先选择 Windows 系统\n- 一个 USB WiFi\
  \ 适配器——我交替使用 TL-WN722N (v1) 和 Alfa AWUS036NHA\n\n我们还将在台式电脑上运行几个虚拟机，包括 VMWare 和 VirtualBox。一台最低配置要求至少为\
  \ 8GB 内存的现代系统。\n\n可选地，你可能想要：\n\n- 几张 32GB 内存卡用于全工具安装选项\n- 树莓派夜视摄像头\n- Pi 电池\n- 树莓派外壳，如\
  \ ZeroView 和 7 英树莓派 3 触摸屏外壳（在某些示例中显示，并非必须，但外壳非常棒！）\n\n注意：如果你使用的是 Pi Zero W 或 Pi\
  \ 3/4 系列，摄像头线缆是不同的。请确保为你购买适用于你的树莓派版本的正确线缆。\n\n树莓派有很多选择可选！有许多不同风格的外壳、配件和适配器。以下是编写本书时用到的一些硬件概览：\n\
  \n![](img/00005.jpeg)\n\n### 树莓派套装\n\n如果你是树莓派的新手，最好的开始方式之一是使用套装（Kit）。通常当你购买树莓派时，你只得到电脑主板。套装可以（取决于具体套装）提供内存卡、外壳、电源、散热器以及可能性的连接线。你必须仔细查看套装内容，有时它们是不包含树莓派的！当我买一个新的树莓派时，我通常会买一个包含主板、电源、散热器的套装，并另外购买一个带风扇的外壳。\n\
  \n树莓派 3B+ & 4 套装——有很多树莓派套装可用。我尝试过不同制造商的几个套装，从未出现过任何问题，但我更喜欢 Cana 套装和 Adafruit 套装。\n\
  \n对于 Sticky Kali Pi 章节，我使用了一个 Adafruit Pi-Hole 套装——这包括一个 2.8 英的 PiTFT 显示器和一个 Pi\
  \ 3b (`https://blog.adafruit.com/2018/10/11/new-product-ad-blocking-kit-for-pi-hole-with-2-8-pitft-no-soldering/`)。\n\
  \n![](img/00006.jpeg)\n\n树莓派 Zero W 套装——如果你从未拥有过 RPI Zero W，我建议购买一个包含视频和 USB 适配器的套装，因为这块\
  \ Pi 使用微显示器接口和 Micro USB C 类型接口。你可能还需要一个带供电的 USB Hub 来将多个 USB 设备连接到你的 Pi 0W，但这不是必须的。我使用过\
  \ Adafruit Pi Zero W Camera kit1，它包含 Pi Zero W、Pi Camera v2（80 万像素）和一个外壳。Vilros\
  \ Pi Zero W Complete Starter Kit2 也很好，因为它包含了必要的连接适配器和线缆，但不包含摄像头。\n\n### 道德黑客问题\n\
  \n在道德黑客与渗透测试中，安全测试人员基本上就像黑客。他们使用黑客最可能使用的工具和技术来测试目标网络的安全。区别在于他们受公司雇用进行安全测试，并在完成后向领导团队展示他们是如何进入的，以及可以如何修复漏洞。我在使用这些技术时看到的最大问题是伦理和法律。书中的一些安全测试技术在某些地区实际上是非法的。因此，用户在使用书中的信息之前，检查他们的当地、州和联邦法律是非常重要的。\n\
  \n此外，你可能会有一些用户尝试在他们没有获得许可的网络上使用 Kali Linux 或道德黑客工具。或者他们会尝试在生产环境网络上使用他们学过但可能尚未精通的技术。这些都是潜在的法律和伦理问题。切勿对你没有获得明确书面许可的系统运行安全工具。此外，在尝试在实时系统上使用可能修改数据或可能导致系统不稳定的测试之前，最好的方法是在一个离线的、非生产环境的网络副本上运行这些测试并分析结果。\n\
  \n### 免责声明\n\n切勿尝试访问你不拥有的电脑，或在没有获得书面许可的情况下对网络或电脑进行安全测试。此举可能会导致你面临法律起诉，你还可能身入监狱。\n\
  \n书中的信息仅供参考。\n\n\n\n\n设置虚拟机使得在实验室环境中学习攻击性计算机安全测试变得非常简单。这样一来，我们就不需要一整个房间的电脑来搭建学习环境，只需要一台足够强大可以同时运行多个虚拟机会话的机器即可。在编写本书时，我使用了一个带有\
  \ 8 GB 内存的 Windows 7 Core i7-6700 系统作为虚拟机宿主机。它有足够的动力同时运行我们的三个实验室操作系统，且完全没有问题。虽然\
  \ 64 位版本的工作原理也类似，但我为 Kali Linux 的安装选择了 32 位版本，因为 Kali 中安装的某些工具只会在 32 位系统上运行。如果你有虚拟系统的经验，可以使用任何你喜欢的虚拟机软件。我将使用\
  \ `VMware Player` 作为 Kali Linux 和 Metasploitable 2 的宿主机。更高级的读者还可以在 `VirtualBox`\
  \ 中设置 Metasploitable 3，作为一个额外的测试目标。\n\n当一切设置完成后，我们应该有一个有一个如下所示的小型测试网络：\n\n![](img/00007.jpeg)\n\
  \n我在书中使用的是 `172.24.1.0` 网络布局。你的网络/IP 地址可能会有所不同。\n\n**注意**：由于我们将处理脆弱的操作系统，请确保在宿主机系统和互联网之间有一个防火墙（最好是硬件防火墙）！\n\
  \n### 安装 VMware Player & Kali\n\n在 `VMware` 上安装 Kali 非常简单，因为 Offensive Security\
  \ 提供了一个可以下载的 Kali VMware 镜像，所以我们不会在这上面花费大量时间。基本上，只需下载 Kali 虚拟机镜像并在 `VMWare Player`\
  \ 中打开它即可。我们将逐步完成这一过程。\n\n1. 为适用于你的操作系统版本下载并安装 `VMWare Player`。\n\n`VMWare player`\
  \ 的版本和下载位置经常发生变化。在写本文时，`VMWare Player` 的当前版本是“VMWare Workstation 15 Player”。它可以作为非商业用途的免费版运行，也可以通过许可运行：\n\
  \n([`www.vmware.com/go/tryplayer`](https://www.vmware.com/go/tryplayer))\n\n![](img/00008.jpeg)\n\
  \n2. 选择你想安装的位置，通常使用默认设置即可。\n\n3. 按照安装提示操作，在需要时重启电脑。\n\n4. 启动 `VMWare`，对于免费版输入你的电子邮件地址，或者为商业用途购买并输入许可密钥。\n\
  \n5. 点击“继续（Continue）”，完成后点击“完成（Finish）”。\n\n6. 下载 Kali Linux 32 位虚拟机镜像 ([`www.offensive-security.com/kali-linux-vm-vmware-virtualbox-hyperv-image-download/`](https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-hyperv-image-download/))。\n\
  \n验证下载文件的校验和始终是一个好习惯，用以确认文件正确且未被修改或损坏。在 Windows 中，你可以使用 `certUtil` 命令执行此操作：\n\n\
  7. 从命令提示符中输入 `certUtil -hashfile [kali linux 下载文件] SHA256`\n\n![](img/0009.gif)\n\
  \n然后与 Kali 页面上列出的校验和进行比对。\n\n8. 接下来，将文件提取到你想运行它的位置。\n\n9. 启动 `VMware Player`。\n\n\
  10. 从菜单中点击“播放（Player）”。\n\n11. 点击“文件（File）”。\n\n12. 接下来点击“打开（Open）”。\n\n13. 导航到提取出的\
  \ Kali Linux `.vmx` 文件，选中它并点击“打开（Open）”。\n\n14. 它现在将出现在 `VMWare Player` 主界面上。\n\n\
  15. 选中 Kali 虚拟机，点击“编辑虚拟机设置（Edit Machine Settings）”。\n\n16. 在这里你可以查看并更改虚拟机的任何设置：\n\
  \n![](img/0010.jpeg)\n\n17. 点击“网络适配器（Network Adapter）”：默认设置为 `NAT`（网络地址转换）。`NAT`\
  \ 意味着每个虚拟机将在一个小的 `NAT` 网络中创建，并在它们之间以及宿主机共享；如果需要，它们也可以访问互联网。有些人报告说使用 `NAT` 会遇到问题且只能使用桥接（`Bridged`），因此我在书中对我的所有虚拟机都使用了\
  \ `bridged` 模式。如果你使用 `bridged`，请确保你的系统和互联网之间有一个硬件防火墙。此外，确保宿主机位于私有局域网，与任何业务或关键系统隔离。\n\
  \n18. 点击“确定（OK）”返回 `VMWare Player` 主界面。\n\n19. 现在只需点击“播放虚拟机（Play Virtual Machine）”即可启动\
  \ Kali。你可能会收到询问虚拟机是否已移动或复制的消息，只需点击“我复制了（I copied it）”。\n\n20. 请求安装 `VMWare tools`\
  \ 时，选择稍后安装。\n\n21. 当 Kali 启动时，你将进入登录界面：\n\n![](img/0011.jpeg)\n\n22. 使用用户名“root”和密码“toor”（root\
  \ 的反写）登录。\n\n23. 随后你将看到主桌面：\n\n![](img/0012.jpeg)\n\n我们现在已安装 Kali 虚拟机。\n\n### 设置\
  \ Kali IP 地址\n\n如果你愿意，可以把所有 IP 地址留为动态分配（DHCP）。这可能会变得有点混乱，你可能想为你的 Kali Linux 和 Metasploitable\
  \ 2 系统设置 IP 地址。你可以通过以下步骤设置 Kali IP 地址。\n\n1. 点击右上角的向下三角形。\n\n2. 点击“已连接（（Connected）”。\n\
  \n3. 然后点击“有线设置（Wired Settings）”，如下：\n\n![](img/013.jpeg)\n\n4. 点击左侧的“网络（Network）”。\n\
  \n5. 在“有线 - 已连接”下点击设置图标：\n\n![](img/014.jpeg)\n\n6. 点击 `IPv4` 标签页\n\n7. 点击“手动（Manual）”单选按钮\n\
  \n8. 在地址下输入 IP 地址、子网掩码和网关：\n\n```\n172.24.1.39 255.255.255.0 172.24.1.1\n```\n\n\
  9. 完成后点击“应用（Apply）”。\n\n重启系统。回来后，打开终端（点击启动处的终端）并运行 `ifconfig` 使 IP 地址已更改：\n\n![](img/015.jpeg)\n\
  \n如果你的路由器设置正确，你也应该能够访问互联网：\n\n![](img/016.jpeg)\n\n就这样；Kali 现在已安装并就绪。\n\n### 更新\
  \ Kali\n\nKali Linux 经常更新以包含最新的工具和功能。要更新 Kali，打开终端并输入：\n\n```\napt update\napt upgrade\n\
  ```\n\n![](img/017.jpeg)\n\n更新可能需要一段时间，并可能提示你输入。如果你不确定如何回答问题，直接使用默认响应。更新完成后重启。\n\
  \n现在 Kali 已更新，我们来谈谈 VMWare tools。\n\n### VMWare tools\n\n当 Kali 启动时，不要在提示时安装 VMware\
  \ tools。最新版本的 Kali 默认安装了 Vare tools。这使得操作系统与 `VMware` 配合得更好，通常提供更多视频选项控制并启用与主机的复制粘贴功能。如果宿主机与\
  \ Kali 虚拟机之间的复制粘贴停止工作，Kali 桌面上有一个文件可以重启 `vmtools`，让复制粘贴再次可用：\n\n![](img/018.jpeg)\n\
  \n### 安装 Metasploitable 2\n\nMetasploitable 2 是故意脆弱的 Linux 操作系统，作为一个 `VMware` 虚拟机。正如我们上面对\
  \ Kali 虚拟机所的操作，我们只需要下载 Metasploitable 2 虚拟机镜像、解压并使用 `VMware Player` 打开它。\n\n1. 下载\
  \ Metasploitable 2 ([`sourceforge.net/projects/metasploitable/files/Metasploitable2/`](http://sourceforge.net/projects/metasploitable/files/Metasploitable2/))\n\
  \n2. 解压文件并放在你选择的文件夹中：\n\n![](img/0020.jpeg)\n\n然后通过启动另一个 `VMWare Player` 在 `VMWare\
  \ Player` 中打开 Metasploitable 2。\n\n\n\n\n\n- 然后点击“播放 (Player)”、“文件 (File)”、“打开 (Open)”\n\
  - 导航到 `Metasploitable.vmx` 文件，选中它并点击“打开”\n\n![](img/00021.jpeg)\n\n它现在会出现在 VMware\
  \ Player 列表中。\n\n3. 现在进入 Metasploitable 的“编辑虚拟机设置”，并确保网络接口设置为“桥接 (Bridged)”（如果你喜欢，也可以设置为\
  \ NAT，只需确保所有虚拟机都设置为相同的设置）。\n\n![](img/00022.jpeg)\n\nMetasploitable 2 现在已准备就绪。\n\
  \n![](img/00023.gif)\n\n开始启动 Metasploitable 系统，如果系统询问你你是移动了还是复制了它，点击“我已复制它”。你现在应该可以看到\
  \ Metasploitable 桌面：\n\n![](img/00024.gif)\n\n4. 登录 - 注意登录提示符上方列出的管理员登录凭据 - 呵呵，安全安全！\n\
  \n登录名：`msfadmin`\n\n密码：`msfadmin`\n\n要退出此虚拟机窗口并夺回鼠标控制权，只需按下 `Ctrl-Alt`。\n\n### 设置\
  \ Metasploitable 2 的 IP 地址\n\n默认情况下，Metasploitable 2 的地址设置为“动态 (Dynamic)”。要将其设置为静态\
  \ IP，编辑 `/etc/network/interfaces` 文件并手动设置 IP 地址、子网掩码和网关（这些数字在你的网络中可能会不同）。我使用的 IP\
  \ 地址是 `172.24.1.218`。\n\n- 在 Metasploitable2 中导航到网络目录，`cd /etc/network`\n- 输入 `sudo\
  \ nano interfaces`\n- 修改 `iface eth0 inet dynamic` 行，将“dynamic”替换为“static”\n\n然后输入\
  \ IP 地址、子网掩码和你的路由器网关。它看起来应该像下面的截图：\n\n![](img/00025.gif)\n\n- 完成后，按 `ctrl-x`、`y`，然后按\
  \ `enter`\n- 输入 `cat interfaces` 来验证你的更改：\n\n![](img/00026.gif)\n- 输入 `sudo reboot`\
  \ 重启 Metasploitable2\n\n我们现在已经设置好了 Metasploitable2 和 Kali 系统并准备就绪。要验证 Kali 和 Metasploitable2\
  \ 是否可以互相看到，使用 `ping` 命令。\n\n在 Kali 终端中，ping Metasploitable2 虚拟机\n\n- 输入 `ping [Metasploitable\
  \ IP Address]`，例如在我的情况下，将是 `ping 172.24.1.218`\n- 按 `Ctrl-c` 停止\n\n![](img/00027.jpeg)\n\
  \n在 Metasploitable2 中，ping Kali 虚拟机：\n\n![](img/00028.gif)\n\n如果你在两个响应中都看到“64 bytes\
  \ from …”，那么就可以确定一切都设置好了，它们可以互相看到并正常通信。按 `Ctrl-Alt` 退出 Metasploitable2 虚拟机。\n\n\
  ### Metasploitable 3 安装（可选 - 高级）\n\n我将 Metasploitable 3 作为书中的某些攻击目标。与 MS2 不同，MS3\
  \ 是基于 Windows 的目标。我喜欢它是因为因为它提供了一套完全不同的服务可供攻击。它还包含了“夺旗赛 (Capture the Flag)”类型的游戏。通过利用服务，可以访问分散在文件系统中的开发者图片。我将其列为可选，因为我只建议高级用户尝试安装\
  \ MS3。最初你必须手动构建 MS3，而且有很多安装问题。你现在可以获得一个“预安装”版本，但你仍然需要像对待 MS2 一样“构建”它。MS3 似乎在 VirtualBox\
  \ 中运行得更好。因此，我在运行 VMWare 的同一台主机上安装了 VirtualBox。你只需要将 MS3 镜像设置为桥接网络，并为它提供与你的 VMWare\
  \ 虚拟机相同的网络地址，它们就能通信得很好。\n\n- 下载并安装 VirtualBox：[`www.virtualbox.org/`](https://www.virtualbox.org/)\n\
  - Metasploitable 3 快速启动和完整手册可以在此处找到：[`github.com/rapid7/metasploitable3`](https://github.com/rapid7/metasploitable3)\n\
  \n一旦构建了 MS3 镜像添加到 VirtualBox 中，打开 VirtualBox 中该虚拟机的网络设置，并将网络适配设置为“桥接 (Bridged)”：\n\
  \n![](img/00029.jpeg)\n\n启动 MS3，登录（用户和密码 = `vagrant`），然后你可以在 Windows 设置中为 MS3 设置网络\
  \ IP 地址。\n\n### 虚拟机安装总结\n\n到目前，在本节中涵盖了如何安装 VMWare Player 作为虚拟机主机。然后我们查看了 Kali Linux\
  \ 和 Metasploitable 2。我们还讨论了可选在同一台 Windows 主机上通过 VirtualBox 运行 Metasploitable 3。我们将它们都设置为使用相同的网络，以便它们可以相互通信并连接互联网（用于\
  \ Kali 更新）。我们将在书的其余部分使用这种设置。提醒一下，如果你设置了自己的宿主机并使用 DHCP，那么系统的 IP 地址在重启时可能会发生。如果你不确定动态分配的地址是什么，可以在虚拟机中运行\
  \ `ifconfig` (Linux) 或 `ipconfig` (Windows) 来查找它。\n\n### 树莓派 (Raspberry Pi) 安装说明\n\
  \n每一章都将涵盖树莓派是用来做什么的，以及推荐为它安装什么操作系统。如前提到的，我们将在书中介绍许多不同的 RPi 设置。我只是想在开始之前对树莓派介绍几点。\n\
  \n树莓派 OS 通常涉及：\n\n- 从互联网下载 RPi OS 镜像\n- 将其提取到 SD 卡\n\n### 如何安装 Raspbian\n\n让我们快速浏览如何在树莓派上安装\
  \ Raspbian。对于其他树莓派操作系统，安装也是类似的。再次，这些只是信息，你现在不需要安装操作系统，我们将在章节中进行。但如果你以前没有安装过 Raspbian，执行安装是一个良好的习惯。你可以在需要时重写内存卡。\n\
  \n从 Raspbian 下载页面：[`www.raspberrypi.org/downloads/raspbian/`](https://www.raspberrypi.org/downloads/raspbian/)\n\
  \n选择你需要使用的 Raspbian 版本：\n\n![](img/00030.jpeg)\n\n我们将根据章节使用 Raspbian Buster 桌面版或\
  \ Raspbian Buster Lite。最好验证下载文件的 SHA-256 哈希值。如果你使用 `qBittorent` 下载 Torrent 版本，它会自动验证哈希。这保证了你获得的是未修改的文件。\n\
  \n文件下载后，只需将你的 MicroSD 内存卡插入电脑的 MicroSD 接口。内存卡将在 Windows 中显示为可移动驱动器：\n\n![](img/00031.jpeg)\n\
  \n现在，只需将镜像写入驱动器。我使用 `balenaEtcher` (Etcher) 写入 Pi 镜像，它非常易用且效果极佳。如果下载镜像是压缩过的（大多数\
  \ Pi 镜像都是 .zip 或 .7z），你可能先解压缩。Etcher 可以在线处理，但速度会慢得多。\n\n- 下载 `balenaEtcher`，安装并运行\
  \ Etcher\n- 选择你的下载镜像，确保驱动器正确并点击“闪存 (Flash!)”\n\n![](img/00032.jpeg)\n\nEtcher 然后将镜像写入内存卡：\n\
  \n![](img/00033.jpeg)\n\n\n\n\n\n如果你使用的是适用于树莓派 3 或 4 系列的卡，那么你已经准备好了。写入完成后，只需弹出卡，将其插入\
  \ Pi，连接所有外围设备，最后为 Pi 接通电源。在首次启动时，文件系统将调整大小以占据整个驱动器并重启。随后它将进入 Raspbian 桌面。\n\n在第二次启动时，它会显示一个快速设置界面。\n\
  \n你将设置以下信息：\n\n* 地理位置（非常重要）\n* 密码（也非常重要！）\n* 视频设置\n* WiFi 设置\n\n然后它会提示你更新系统软件并重启。之后你就可以开始使用漂亮的\
  \ Raspbian 系统了：\n\n![](img/00034.jpeg)\n\nPi Zero W 的设置方法几乎相同，但多了一个可选步骤。\n\n###\
  \ 在 Pi Zero W 上设置 WiFi\n\n你现在不需要执行此操作，我们将在以后在实际使用它时再次介绍如何操作。但在 Pi Zero W 上，偶尔你需要在首次启动之前设置\
  \ WiFi 配置。由于 Pi0W 没有内置网络卡，你需要预先设置 WiFi 路由器的信息，以便能够远程连接到 Pi。这在写入镜像之后、但在从写入器拔出卡之前完成。简单来说，你需要将以下文本复制到文件中，添加你的\
  \ Wi-Fi 名称和密码，并将其保存到 SD 卡的根目录。如果你在 Windows 上进行操作，需要将文件的换行符（End of Line）设置为 Linux\
  \ 格式。一种简单的方法是使用程序“Notepad++”，可以在 [`notepad-plus-plus.org/`](https://notepad-plus-plus.org/)\
  \ 下载。\n\n你也可以在内存卡的根目录下创建一个名为 `ssh` 的空文件。这样做会自动开启 SSH，这样你就可以真正无头运行 Pi0W（仅内存卡和电源，不连接任何外围设备）。此过程在树莓派论坛中有介绍，也可以在这篇\
  \ Raspberry Pi Spy 文章 1 中找到。\n\n* 创建一个新的文本文件：\n\n```\ncountry=us\nupdate_config=1\n\
  ctrl_interface=/var/run/wpa_supplicant\nnetwork={\n  scan_ssid=1\n  ssid=\"Your\
  \ Wi-Fi Router Name\"\n  psk=\"Your Wi-Fi Password\"\n}\n```\n\n然后，如果你使用的是 Notepad++：\n\
  \n* 点击“编辑”（Edit）\n* 然后“ EOL 转换”（EOL conversion）\n* 并“设置为 Linux”（Set to Linux）\n\n\
  如下所示：\n\n![Pi Zero W Camera 4](img/00035.jpeg)\n\n3. 完成后，将文件以 `wpa_supplicant.conf`\
  \ 保存在 MicroSD 卡的根目录下。\n4. 同样创建一个没有扩展名的 `ssh` 空文件，并将其放在根目录。\n5. 将内存卡插入 Pi，连接外围设备，然后插上电源。\n\
  6. 使用 SSH 或 Putty 连接到 Pi。使用用户 `pi` 和密码 `raspberry` 登录。\n\n就是这样！如果你在无头运行 Pi0W，不需要连接键盘、鼠标或显示器，因为将远程连接到\
  \ Pi。\n\n### 查找你的 RPi IP 地址\n\n在使用 DHCP 设置 Pi 时，如何在网络上找到它？当你将 Pi 连接到网络时，它很可能会获得一个随机地址。你可以采取几种方法来定位它。如果你的\
  \ Pi 连接了显示器和键盘，只需进入终端并运行 `ifconfig`。\n\n如果你的 Pi 是以“无头”模式运行——即没有键盘、显示器或鼠标：\n\n1.\
  \ 检查你的路由器，查看它分配给 Pi 的 IP 地址（请参阅路由器用户手册）。\n2. 使用 `nmap` 扫描。\n\n如果你有一台安装了 `nmap` 的\
  \ Linux 机器，这可能是最快的方法。\n\n```\nifconfig\n```\n\n### 使用 XMING 和 Putty\n\n在使用 DHCP\
  \ 设置 Pi 时，如何在网络上找到它？当你将 Pi 连接到网络时，它很可能会获得一个随机地址。你可以采取几种方法来定位它。如果你的 Pi 连接了显示器和键盘，只需进入终端并运行\
  \ `ifconfig`。\n\n如果你的 Pi 是以“无头”模式运行——即没有键盘、显示器或鼠标：\n\n1. 检查你的路由器，查看它分配给 Pi 的 IP\
  \ 地址（请参阅路由器用户手册）。\n2. 使用 `nmap` 扫描。\n\n如果你有一台安装了 `nmap` 的 Linux 机器，这可能是最快的方法。\n\n\
  ```\nnmap\n```\n\n### Kali-Pi 的“Kalipi-Config” 配置\n\n如果你熟悉 Raspbian，你就知道运行 `raspi-config`\
  \ 来执行某些功能，如设置地理位置、扩展文件系统以填充内存卡、启用 Pi 摄像头或开启/关闭 SSH 服务。在 Re4son 的 Kali-Pi 中也有同样的程序，它被称为\
  \ `kalipi-config`。\n\n\n\n\n\n- Kali VMware 下载 - [https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-hyperv-image-download/]\n\
  - 1“使用 `wpa_supplicant.conf` 手动在 Pi 上设置 WiFi” - [https://www.raspberrypi-spy.co.uk/2017/]\n\
  \n# 第 3 章\n\n## Raspbian 上的渗透测试框架 (PenTesters Framework)\n\n![](img/00046.jpeg)\n\
  \n作者：David Kennedy, TrustedSec\n工具网站：[https://www.trustedsec.com/pentesters-framework/]\n\
  GitHub 站点：[https://github.com/trustedsec/ptf]\nPTF 演示视频：[https://vimeo.com/137133837]\n\
  \n渗透测试框架 (PTF) 是一个 Python 脚本，用于在基于 Debian、Ubuntu 和 ArchLinux 的发行版上安装一组常用的渗透测试工具。由于\
  \ Raspbian 是基于 Debian 的，PTF 可以正确地安装在 Raspberry Pi 3b+/ 4 上，且许多工具无需修改即可运行。尽管某些已安装的工具无法在\
  \ Pi 上运行。\n\nPTF 会将你选择的渗透测试工具类别安装到 Raspberry Pi 的 `/pentest` 目录中。然后你可以从 Raspbian\
  \ 终端访问并运行已安装的工具。安装过程需要一些时间，特别是当你进行全 PTF 安装时。但一旦完成，你就将拥有一个类似于 Kali Linux 的平台，直接在\
  \ Raspbian 上就能运行许多最常用的工具！\n\n### 安装和更新 Raspbian\n\n本章将使用 Raspberry Pi 3b+ 和 Raspbian。它在\
  \ Pi 4 上的用法完全相同。下载“Buster with Desktop”（带桌面版）版本的 Raspbian，然后进行完整更新。\n\n- 如果需要，安装\
  \ Raspbian 的说明可以在“安装操作系统”章节中找到。\n- 内存卡写入完成后（我使用 Etcher），将内存卡插入 Pi，连接上键盘、鼠标、网线和视频显示器。\n\
  - 最后，接通 Pi 的电源。\n- 按照启动时的桌面设置向导进行操作，并执行完整更新。\n\n### 安装 PTF\n\n安装并更新好 Raspbian 之后，下一步是安装\
  \ PTF。我强烈建议读者观看工具作者提供的 PTF 演示视频（链接在章节开头）。由于此视频涵盖了许多 PTF 主题，我们将快速跳过。PTF 由分类分类模块组成。你可以安装单个\
  \ PTF 模块或安装所有模块。如果你想对 PTF 进行全量安装，你需要一张 32 GB 的卡。全量安装在 Pi 上也可能需要几个小时。\n\n注意：某些在 Raspbian\
  \ Stretch 上运行良好的 PTF 工具，似乎在 Raspbian Buster 上运行时存在问题，希望未来的更新能修复这些问题。\n\n在 Raspbian\
  \ 终端中操作：\n\n- 输入 `sudo su`\n- 接下来，执行 `git clone https://github.com/trustedsec/ptf/`\n\
  - 最后，执行 `cd ptf`\n\n如下所示：\n\n![](img/00047.gif)\n\n现在启动 ptf：\n\n- 输入 `./ptf`\n-\
  \ 在 `ptf>` 提示符下，输入 `show modules`\n\n你将看到 PTF 所有可用的模块列表。你可以逐个安装。如果你有一个 32GB 的内存卡，可以安装所有模块：\n\
