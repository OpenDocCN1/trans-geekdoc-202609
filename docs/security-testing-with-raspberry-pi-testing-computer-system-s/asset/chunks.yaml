    \n## Chapter 3\n\n## The PenTesters Framework on Raspbian\n\n![](images/00046.jpeg)\n\
    \nTool Author: David Kennedy, TrustedSec\n\nTool Website: [https://www.trustedsec.com/pentesters-framework/](https://www.trustedsec.com/pentesters-framework/)\n\
    \nGitHub Site: [https://github.com/trustedsec/ptf](https://github.com/trustedsec/ptf)\n\
    \nPTF Walkthrough Video: [https://vimeo.com/137133837](https://vimeo.com/137133837)\n\
    \nThe PenTesters Framework (PTF) is a Python script that installs a collection\
    \ of commonly used pentesting tools on Debian, Ubuntu and ArchLinux based distributions.\
    \ As Raspbian is based on Debian, PTF correctly installs on a Raspberry Pi 3b+/\
    \ 4 and many of the tools work with no modification. Though some of the installed\
    \ tools will not run on a Pi. \n\nPTF installs the category of pentesting tools\
    \ that you choose into the “/pentest” directory on your Raspberry Pi. You can\
    \ than access and run the installed tools from the Raspbian Terminal. The install\
    \ takes a while to run, especially if you are doing a full PTF install. But when\
    \ it is finished, you have a Kali Linux like platform that has many of the most\
    \ commonly used tools running right off of Raspbian!\n\n### Install and update\
    \ Raspbian\n\nWe will be using a Raspberry Pi 3b+ for this chapter and Raspbian.\
    \ It works the exact same with a Pi 4. Download and the “Buster with Desktop”\
    \ version of Raspbian, then do a full update. \n\n        Instructions for installing\
    \ Raspbian can be found in the “Installing OS” chapter if needed\n\n        Once\
    \ your memory card is written (I use Etcher), insert the memory card into your\
    \ Pi, attach keyboard, mouse, network cable, and video display\n\n        Lastly,\
    \ power up the Pi\n\n        Follow through the Desktop setup wizard on bootup,\
    \ and perform a full update.\n\n### Install PTF\n\nOnce Raspbian is installed\
    \ & updated, the next step is to install PTF. I highly recommend the reader watch\
    \ the PTF Walkthrough Video provided by the tool author (link at beginning of\
    \ chapter). As this video covers many of the PTF topics, we will move through\
    \ this quickly. PTF is made up of modules by category. You can install individual\
    \ PTF modules or all of them. If you want to perform a full install of PTF, you\
    \ will need a 32 GB card. A full install can also take several hours on a Pi.\n\
    \nNOTE: Some PTF tools that worked fine with Raspbian Stretch, seem to have a\
    \ problem running with Raspbian Buster, hopefully future updates will fix these\
    \ issues. \n\nFrom a Raspbian terminal:\n\n        Enter, “sudo su”\n\n       \
    \ Next, “git clone https://github.com/trustedsec/ptf/”\n\n        Finally, “cd\
    \ ptf”\n\nAs seen below:\n\n![](images/00047.gif)\n\nNow to start ptf:\n\n       \
    \ Enter, “./ptf”\n\n        At the “ptf>” prompt, type, “show modules”\n\nYou\
    \ will see a list of all the available modules for PTF. You can install each individually.\
    \ If you have a 32GB memory card you can install them all:\n\n        use modules/install\\\
    _update\\_all\n\n![](images/00048.gif)\n\nA lot of the popular security tools\
    \ are included in PTF, you can also add new or custom tools (discussed in the\
    \ PTF Walkthrough video). We will look at just a couple of them, and show a few\
    \ usage examples. But first, the install will take a really long time, so it would\
    \ be a good time to get up and find something else to do for a while. Just check\
    \ on it periodically, you may need to allow it to install something as the install\
    \ progresses.\n\nAfter several hours, literally, you will see this:\n\n![](images/00049.gif)\n\
    \n        Reboot when finished\n\n        SSH into the Pi or if you are using\
    \ it locally, open a Terminal \n\nAll tools will be located in category directories\
    \ under the ‘/pentest’ directory, as seen below:\n\n![](images/00050.gif)\n\n\
    Many of the tools can be run from anywhere, but some tools require you to change\
    \ into its install directory for it to work properly. This is usually ‘/pentest’,\
    \ but some seem to run from ‘/usr/share’ as well. In this chapter we will only\
    \ cover a handful of tools installed by PTF. I highly advise the reader take a\
    \ few minutes and explore the install tools directories to find out all the tools\
    \ available in PTF.   \n\n### Scanning with NMAP\n\nNmap is the go-to tool for\
    \ network scanning. It easily scans a network and can return what systems are\
    \ up, what ports are open and what services they are running. It can also be used\
    \ as an attack tool using nmap scripts. We will take a quick look at all of these\
    \ features. \n\nIf it is not running, start up your Metasploitable2 VM. \n\nIn\
    \ the Raspbian Terminal (or remote through SSH or Putty):\n\n        Type, “nmap\
    \ -h” for options\n\nFor a fast port scan, just type the nmap command followed\
    \ by the target’s IP address:\n\n        nmap 172.24.1.218\n\nThis will show\
    \ that the target is up and will display any open TCP ports:\n\n![](images/00051.gif)\n\
    \nAs you can see Metasploitable2 has many open ports to target!\n\nWe can try\
    \ to get service version information by adding the “\\-A” command:\n\n       \
    \ nmap -A 172.24.1.218\n\nThis command will take a bit longer to run, but will\
    \ display OS and service software versions, if it can:\n\n![](images/00052.gif)\n\
    \nYou can also add the “\\-v” verbose or “\\-vv” very verbose switches to have\
    \ even more information returned to you. \n\nWe could also scan for just a single\
    \ port if we wanted using “\\-p”. \n\n        nmap 172.24.1.218 -p 21\n\n![](images/00053.gif)\n\
    \nThis shows that FTP port 21 is open. \n\nWe could scan for a range of ports\
    \ if we wanted, simply add additional port numbers, separated by a comma, as seen\
    \ below:\n\n![](images/00054.gif)\n\nYou could add in the “\\-A” again to get\
    \ service information about these ports:\n\n![](images/00055.gif)\n\nWe could\
    \ also try a Brute Force attack using an nmap script:\n\n        nmap --script\
    \ ftp-brute -p21 172.24.1.218\n\nAfter a few minutes:\n\n![](images/00056.gif)\n\
    \nIf you look closely at the bottom of the screenshot you will see “user:user\
    \ \\- Valid credentials”. From the screenshot you can see that nmap attempted\
    \ 3811 username & password combinations and was able to successfully login using\
    \ the username and password of “user”. Though brute force attacks are fun to run,\
    \ they generate a lot of noise and are usually picked up pretty quickly by Network\
    \ Security Monitoring (NSM) systems. \n\nIf we were to peek at network traffic\
    \ using Wireshark while the attack was running, we would see this:\n\n![](images/00057.jpeg)\n\
    \nNmap created a lot of FTP traffic, as it repeatedly tried to login again and\
    \ again, using different usernames and passwords. If we looked at an individual\
    \ FTP login attack in Wireshark, we would see this:\n\n![](images/00058.jpeg)\n\
    \nNmap continues to do this until either it finds a valid login response, or runs\
    \ out of usernames/ passwords to try. There are many tools that you can use for\
    \ scanning and brute forcing. We will look at some of these next.\n\n### Metasploit’s\
    \ FTP scanner\n\nWhat if we wanted to scan an entire network, and only look for\
    \ systems running certain services? One way we could do this is with Metasploit’s\
    \ scanners. Metasploit comes with a ridiculous number of scanners installed. \n\
    \nTo view them:\n\n        In a terminal, enter “msfconsole” to start Metasploit\
    \ \n\n        Then type “use auxiliary/scanner” and hit “tab” twice:\n\n![](images/00059.gif)\n\
    \nWe can use any of these tools to scan our target network for information. Let’s\
    \ scan our test network for running FTP servers and also do a version detection.\
    \ We can do so using the “auxiliary/scanner/ftp/ftp\\_version” scanner.\n\n       \
    \ Enter, “use auxiliary/scanner/ftp/ftp\\_version”\n\n        Next, “set RHOSTS \
    \ 172.24.1.200-220”\n\n        And finally, “run”"
