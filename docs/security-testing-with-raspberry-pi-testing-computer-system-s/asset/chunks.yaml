- raw: "And you should see the feed from your camera. \n\n![](images/00246.jpeg)\n\
    \nFor much more extensive information on PiCamera, check out the PiCamera Documentation\
    \ Webpage.\n\n#### PiCamera Conclusion\n\nIn this article, we covered controlling\
    \ a Raspberry Pi camera using Python PiCamera. PiCamera is a great solution for\
    \ users who are Python savvy and want to include camera control in their programs.\
    \ The authors of PiCamera have also made it very easy for non-programmers to use\
    \ by providing great documentation and easy to understand sample programs. \n\n\
    ### Other Project Possibilities: Portable Night Vision!\n\nThe Raspberry Pi is\
    \ one of the most versatile Single Board Computers that I have ever used. The\
    \ above examples are regular uses of the Pi Camera, and will get you started.\
    \ If you use your imagination, you can come up with some pretty interesting creations\
    \ with your RPis, like this project, my Portable Night Vision System.\n\n![](images/00247.jpeg)\n\
    \nUsing a Raspberry Pi 7” touchscreen case, I simply ran the cable for the NV\
    \ camera out of the case top, and attached the camera to the case. I then attached\
    \ an Anker “lip stick” style battery for power.\n\nAs seen below:\n\n![](images/00248.jpeg)\n\
    \nUsing simple PiCamera scripts based on the ones we just covered, I was able\
    \ to view the Night Vision video on the touchscreen display, and capture the real\
    \ time feed in HD video for later playback. This is the view of the inside of\
    \ a kitchen at night, you literally couldn’t see anything with the naked eye:\
    \ \n\n![](images/00249.jpeg)\n\nNot shown in the picture, but you could clearly\
    \ read the labels of cans that were on the countertop. Though the range was only\
    \ about the size of a medium to large room, it worked very well. This is the springboard\
    \ for a future night vision system that I want build. If, I mean, when I have\
    \ the time. \n\n### Fake Security Camera\n\nAnother one of my “in-process” builds\
    \ is a fake security “Scan Cam”. I have taken a fake outdoor security cam and\
    \ am converting it to a real camera system with Raspberry Pis. I thought about\
    \ adding a second Pi or small factor board and have it scan for Wireless Signals.\
    \ \n\n![](images/00250.jpeg)\n\n### Magic Mirrors\n\nThe flexibility of the Pi\
    \ opens up a lot of possible in-home surveillance projects for home security.\
    \ You could make Surveillance Magic Mirrors by combining multiple RPis and two-way\
    \ glass. One Pi handles the Magic Mirror functions and the other could be setup\
    \ as a camera, etc. Of course, don’t do stupid things with this, and always follow\
    \ your Federal, State and Local laws.\n\nThis is a large Magic Mirror I made a\
    \ few years back; it was powered by a Raspberry Pi 3:\n\n![](images/00251.jpeg)\n\
    \nThe custom build wood cabinet case held a full-size HDMI LED Display, and the\
    \ Pi:\n\n![](images/00252.jpeg)\n\nThe next one is a home surveillance Android\
    \ powered Magic Mirror. An old Android phone handles the “Magic Mirror” interface,\
    \ a Pi Zero W with camera provides the surveillance functions:\n\n![](images/00253.jpeg)\n\
    \nThis is literally just a large picture frame, a piece of one-way glass, and\
    \ an old Android phone running one of the “Magic Mirror” apps for Android:\n\n\
    ![](images/00254.jpeg)\n\nAnd a little surprise:\n\n![](images/00255.jpeg)\n\n\
    Never mind my bad tape job around the Pi, it worked! I just ran one of the surveillance\
    \ cam solutions on the Pi0W that we covered earlier in this chapter. In doing\
    \ so, I was able to view the video remotely, through the one-way glass! The tape\
    \ is important, as you cannot allow any light from the back side to get in, as\
    \ it will drastically affect your video recording quality. \n\nThese are just\
    \ two examples; the possibilities are really only limited by your imagination.\
    \ There are already numerous tutorials and videos online on how to build smart\
    \ mirrors, so I am not going to get into any build detail. Though usually all\
    \ you need is a RPi or old Android phone, Magic Mirror software (MagicMirror2\
    \ for the RPi5 works great), one-way glass and large picture frame. More adventurous\
    \ builders may want to build a custom case and use an HDMI display. Be very careful\
    \ if you decide to use a full-size monitor for your project as it usually involves\
    \ stripping the case plastic off of it, a whole lot of things can go wrong there\
    \ and you could end up with a paper weight instead of a working monitor - Ye have\
    \ been warned. Magic Mirrors even without the surveillance part are a fun project\
    \ for the whole family, check them out! \n\n### Finding Spy Bugs with an RTL-SDR\
    \ & Salamandra\n\nTool Author: Eldraco\n\nTool GitHub: [https://github.com/eldraco/Salamandra](https://github.com/eldraco/Salamandra)\n\
    \n![](images/00256.jpeg)\n\nWith the explosion of Internet of Things (IoT) devices,\
    \ and some hardware now being banned from certain facilities due to spying concerns,\
    \ it would be nice if there was an easy way to scan your facility, hotel room,\
    \ etc., to see if there are any hidden microphone “spy” devices. Salamandra is\
    \ a tool to detect and locate spy microphone devices in closed environments. Usually\
    \ the “Spy” microphones you can find online will record audio and then re-broadcast\
    \ it at a certain frequency. Salamandra displays any detected microphone type\
    \ devices along with its broadcasting frequency. Using a displayed signal strength,\
    \ it is possible to find the general location of the device.\n\n![](images/00257.jpeg)\n\
    \nI cover how to use Kali Linux, an RTL-SDR (I used a NooElec Nesdr Smart with\
    \ the included extendible antennae), and Salamandra on my website:\n\n[https://cyberarms.wordpress.com/2018/07/08/finding-spy-bugs-with-an-rtl-sdr-salamandra/](https://cyberarms.wordpress.com/2018/07/08/finding-spy-bugs-with-an-rtl-sdr-salamandra/)\n\
    \n### Plane Tracking with Raspberry Pi\n\nOkay, this one doesn’t have anything\
    \ to do with security, it is just a cool Pi project. Live Flight tracking websites\
    \ are very helpful. They allow you to see the actual location of flights around\
    \ the world. You can create a simple scanner using a Raspberry Pi that will allow\
    \ you to track nearby planes! “Automatic Dependent Surveillance – Broadcast” or\
    \ ADS-B is a signal broadcast publicly by airplanes that allow it to be tracked.\
    \ There are several ways that an airplane enthusiast can receive these signals\
    \ and plot a plane’s location on a map. One of the easiest ways that a hobby enthusiast\
    \ can do it, is with a Raspberry Pi 3 and an SDR-RTL USB dongle.\n\nTracking planes\
    \ with a Pi is pretty simple to do, all you need is an SDR-RTL, a Pi 3 running\
    \ Raspbian and the ADS-B mapping software. When the software is running, the SDR-RTL\
    \ receives the airplane’s signals, and then plots their location, in real time\
    \ on a Google Maps type display. \n\nI used the following equipment:\n\n       \
    \ Pi 3b running Raspbian \n\n        NooElec NESDR SMART USB with its standard\
    \ telescoping antennae\n\n        Pi 3, 7” Touchscreen case\n\n        For the\
    \ mapping software, I used Dump1090.\n\nI used the 7” Touchscreen for my project,\
    \ because I like the all in one capability. But it would work just as well with\
    \ a Pi 3 in a normal case, using a monitor, keyboard and mouse.\n\nThere are several\
    \ flight tracking software options out there and also several ways to interface\
    \ them with existing “Live Air Traffic Tracking” websites. For my project, I just\
    \ used the install tutorial on the Flightradar24 Forum:\n\n[https://forum.flightradar24.com/threads/10232-How-to-Install-dump1090-mutability\\\
    _1-15-dev-on-RPi](https://forum.flightradar24.com/threads/10232-How-to-Install-dump1090-mutability_1-15-dev-on-RPi)\n\
    \nAnother option from FlightAware, is to use their PiAware software & USB SDR.\
    \ Instructions for this can be found on their website - [https://flightaware.com/adsb/piaware/build](https://flightaware.com/adsb/piaware/build)\
    \ \n\n![](images/00258.jpeg)\n\nI had great success watching planes up to 50 miles\
    \ away with this simple setup. FlightAware’s website says a range of up to 300\
    \ miles is possible with the right antennae. Before we wrap up this final chapter,\
    \ lets switch gears and cover one more topic – Ad blocking with Pi-Hole."
