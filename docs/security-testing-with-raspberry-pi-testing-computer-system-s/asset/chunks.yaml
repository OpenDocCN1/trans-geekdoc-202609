- raw: "The NASA JPL network, mentioned in the beginning of this article, was compromised\
    \ by someone hooking up an un-authorized Pi to the network. Therefore, it is important\
    \ to educate your employees about the dangers that IoT devices, like Pis, can\
    \ pose to your network. Some companies have had success with putting up signs\
    \ encouraging safe computer surfing techniques and reminders on using complex\
    \ unique passwords on online accounts. For more information, the US Computer Emergency\
    \ Response Team (US CERT) has put together a great reference and alert site at\
    \ [http://www.us-cert.gov/ncas/tips/](http://www.us-cert.gov/ncas/tips/).\n\n\
    ### Scan your Network\n\nIf you are on the corporate security team or you are\
    \ the “computer security person”, scan your network for security issues before\
    \ the bad guys do. Just using Shodan will expose systems hanging out on your network\
    \ that may have been forgotten. Large companies commonly have many systems publicly\
    \ available that are running outdated Operating Systems or Web Server software.\
    \ Don’t forget to check for cameras, IoT devices and printers that are giving\
    \ out too much information like internal network information, SNMP strings and\
    \ user accounts. \n\nOpen source scanning tools (like OpenVas), or commercial\
    \ security scanning system (like NESSUS) can be used to scan your entire network\
    \ for security issues. If you have the proper authority to do so. OpenVas comes\
    \ pre-installed on Kali, there is somewhat of a process to get it working, but\
    \ there are numerous tutorials online.\n\n### Offensive Computer Security\n\n\
    Learn about offensive computer security techniques like those presented in this\
    \ book. We have only covered the most basic techniques used in offensive security.\
    \ Solely reading this book is not sufficient to make someone an “expert”, nor\
    \ does it alone qualify anyone to start using offensive security techniques in\
    \ a live environment. If you are new to this field and want to learn more, there\
    \ are a ton of books and security training seminars and classes available. There\
    \ are also a lot of purposefully vulnerable test systems and Capture the Flag\
    \ type systems where you can legally try out and perfect your skills. \n\nLastly,\
    \ connect with your local OWASP chapter or other security groups in your area.\
    \ Attend security conferences and make contacts in the security field. Many do\
    \ not mind helping out when asked good questions. SANS has some great classes\
    \ too. And once proficient, and with management’s permission, test the security\
    \ of your network systems.\n\n### Conclusion\n\nI hope you enjoyed this book.\
    \ It has really been a lot of fun and was a great challenge to write. If you have\
    \ any questions, please feel free to contact me at \\[cyberarms@live.com\\]. There\
    \ will be an “errata” page on my blog as possible issues are reported and as tutorials\
    \ change over time. My blog also contains years of notes and articles from the\
    \ security realm, so check it out!\n\nCyberarms.wordpress.com\n\nAlso, check out\
    \ DanTheIoTMan.com for numerous Raspberry Pi tutorials and walkthroughs.\n\nThank\
    \ you!\n\nDaniel Dieterle\n\nResources\n\n        1 “NASA hacked because of unauthorized\
    \ Raspberry Pi connected to its network” - [https://www.zdnet.com/article/nasa-hacked-because-of-unauthorized-raspberry-pi-connected-to-its-network/](https://www.zdnet.com/article/nasa-hacked-because-of-unauthorized-raspberry-pi-connected-to-its-network/)\n\
