    \ Camera` with `Pi Zero W` The kit. The camera cable is different if you are using\
    \ a `Pi Zero W` compared to a `Pi3` or `4` series. Make sure you get the correct\
    \ cable for your `Pi`. The `Pi 3` & `4` can use the same video cable.\n\n### ZeroView\
    \ Case\n\nProduct Page: [https://thehut.com/products/zeroview](https://thehut.com/products/zeroview)\n\
    \nThe `ZeroView` ` is truncated in the picture above, but this is literally the\
