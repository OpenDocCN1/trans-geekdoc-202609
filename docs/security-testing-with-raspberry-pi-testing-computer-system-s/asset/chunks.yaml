- raw: "Setting up virtual machines makes it very easy to learn offensive computer\
    \ security testing in a lab type environment. That way we do not need a room full\
    \ of computers to set up a learning environment, we only need one machine powerful\
    \ enough to run several Virtual Machine sessions at once. In writing the book,\
    \ I used a Windows 7 Core i7-6700 system with 8 GB of RAM as the Virtual Machine\
    \ host. It had plenty of power to run all three of our lab operating systems at\
    \ the same time with no problem at all. Though 64-bit versions should work similarly,\
    \ I chose 32-bit for the Kali Linux install as some of the tools installed in\
    \ Kali will only run on 32-bit systems. If you have experience with Virtual Systems,\
    \ you can use any Virtual Machine software that you want. I will be using VMware\
    \ Player as the host for Kali Linux & Metasploitable 2. More advanced readers\
    \ can also setup Metasploitable 3 in VirtualBox for an additional test target.\
    \ \n\nWhen everything is setup, we should have a small test network that looks\
    \ something like this:\n\n![](images/00007.jpeg)\n\nI use a 172.24.1.0 network\
    \ layout for the book. Your network/ IP addresses may be different.\n\nNOTE: As\
    \ we will be dealing with vulnerable operating systems, make sure that you have\
    \ a Firewall (Preferably hardware) between the Host system and the live internet!\n\
    \n### Install VMware Player & Kali \n\nInstalling Kali on VMware is pretty simple\
    \ as Offensive Security provides a Kali VMware image that you can download, so\
    \ we will not spend a lot of time on this. Basically, just download the Kali VM\
    \ image and open it in VMWare Player. We will step through the process.\n\n1.  \
    \ Download and install VMware Player for your version of Operating System.\n\n\
    VMWare player versions and the download location change somewhat frequently. At\
    \ the time of this writing, the current version of VMWare Player is “VMWare Workstation\
    \ 15 Player”. This can be run as either the free player for non-commercial usage\
    \ or via license:\n\n([https://www.vmware.com/go/tryplayer](https://www.vmware.com/go/tryplayer))\n\
    \n![](images/00008.jpeg)\n\n2.   Choose where you want it to install it, the default\
    \ is normally fine. \n\n3.   Follow through the install prompts, reboot when asked.\n\
    \n4.   Start VMWare and enter either your e-mail address for the free version\
    \ or purchase & enter a license key for commercial use.\n\n5.   Click, “Continue”\
    \ and then “Finish” when done.\n\n6.   Download the Kali Linux 32-bit VM Image\
    \ ([https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-hyperv-image-download/](https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-hyperv-image-download/)).\
    \ \n\nIt is always a good idea to verify the download file checksum to verify\
    \ that the file is correct and hasn’t been modified or corrupted. In Windows you\
    \ can do this with the certUtil command:\n\n7.   From a command prompt, enter\
    \ “certUtil -hashfile \\[kali linux download file\\] SHA256”\n\n![](images/00009.gif)\n\
    \nThen just verify the checksum with the one listed on the Kali download page.\n\
    \n8.   Next, extract the file to the location that you want to run it.\n\n9.  \
    \ Start the VMware Player.\n\n10.                       Click, “Player” from the\
    \ menu.\n\n11.                       Then “File”\n\n12.                      \
    \ Next click, “Open”.\n\n13.                       Navigate to the extracted Kali\
    \ Linux .vmx file, select it, and click, “Open”.\n\n14.                      \
    \ It will now show up on the VMWare Player home screen.\n\n15.                      \
    \ With the Kali VM highlighted click, “Edit Virtual Machine Settings”.\n\n16.                      \
    \ Here you can view and change any settings for the VM:\n\n![](images/00010.jpeg)\n\
    \n17.                       Click, “Network Adapter”:\n\nIt is set to NAT (Network\
    \ Address Translation) by default. NAT means that each Virtual machine will be\
    \ created in a small NAT network shared amongst them and with the host; they can\
    \ also reach out to the internet if needed. Some people have reported problems\
    \ using NAT and can only use Bridged, thus I used bridged for all of my virtual\
    \ machines in this book. If you do use bridged, make sure to have a hardware firewall\
    \ between your system and the Internet. Also, make sure the host is on a private\
    \ LAN, separate from any business or critical systems. \n\n18.                      \
    \ Click “OK” to return to the VMWare Player main screen.\n\n19.                      \
    \ Now just click, “Play Virtual Machine”, to start Kali. You may get a message\
    \ asking if the VM was moved or copied, just click, “I copied it”.\n\n20.                      \
    \ When prompted to install VMWare tools, select to install them later.\n\n21.                      \
    \ When Kali boots up, you will come to the Login Screen:\n\n![](images/00011.jpeg)\n\
    \n22.                       Login with the username, “root” and the password “toor”\
    \ (root backwards).\n\n23.                       You will then be presented with\
    \ the main Desktop:\n\n![](images/00012.jpeg)\n\nWe now have the Kali VM installed.\
    \ \n\n### Setting the Kali IP address\n\nYou can leave all the IP addresses as\
    \ dynamic assign (DHCP) if you want. This may get a little confusing and you might\
    \ want to set IP addresses for your Kali Linux and Metasploitable 2 systems. You\
    \ can set your Kali IP address using the following steps.\n\n1.  Click on the\
    \ down pointing triangle in the upper right, by the power button.\n\n2.  Click\
    \ on “Wired Connected” to expand it.\n\n3.  Then click on “Wired Settings” as\
    \ seen below:\n\n![](images/00013.jpeg)\n\n4.  Click on Network on the left side\
    \ menu.\n\n5.  Under “Wired - Connected” click the settings icon:\n\n![](images/00014.jpeg)\n\
    \n6.  Click the IPv4 tab\n\n7.  Click the “Manual” radial button.\n\n8.  Under\
    \ Addresses enter the IP address, netmask and gateway that you are going to use\
    \ for Kali (These numbers will be different for your router/ network, adjust accordingly),\
    \ using tab to move between number settings:\n\n        address 172.24.1.39\n\
    \n        netmask 255.255.255.0\n\n        gateway 172.24.1.1\n\n![](images/00015.jpeg)\n\
    \n9.  Click, “Apply” when finished. \n\nReboot the system. When it comes back\
    \ up, open a terminal window (click the terminal button on the quick start menu)\
    \ and run “ifconfig” to make sure the IP address was successfully changed:\n\n\
    ![](images/00016.jpeg)\n\nIf your router settings are correct, you should also\
    \ be able to reach the internet:\n\n![](images/00017.jpeg)\n\nAnd that’s it; Kali\
    \ should now be installed and ready to go. \n\n### Updating Kali \n\nKali Linux\
    \ is constantly being updated to include the latest tools and features. To update\
    \ Kali Linux, open a terminal prompt and type:\n\n        apt update\n\n       \
    \ apt upgrade\n\n![](images/00018.jpeg)\n\nThe update could take a while and may\
    \ prompt you for input. If you are unsure what how to answer a question, just\
    \ use the default response. Reboot when the update is complete.\n\nNow that Kali\
    \ is updated, let’s talk about the VMWare tools.\n\n### VMWare tools\n\nWhen Kali\
    \ boots up, don’t install the VMWare tools when prompted. The VMWare tools are\
    \ installed by default in the latest version of Kali. This allows the OS to work\
    \ better with VMware, usually giving you more control over video options and enables\
    \ cut & paste capability with the host. If copy & paste stops working between\
    \ the Host and the Kali VM, there is a file on the Kali Desktop that re-starts\
    \ VMtools so copy and paste will work again:\n\n![](images/00019.jpeg)\n\n###\
    \ Installing Metasploitable 2\n\nMetasploitable 2, the purposefully vulnerable\
    \ Linux operating system is also available as a VMWare virtual machine. As we\
    \ did with the Kali VM above, all we need to do is download the Metasploitable\
    \ 2 VM image, unzip it and open it with VMware Player. \n\n1.   Download Metasploitable\
    \ 2 ([http://sourceforge.net/projects/metasploitable/files/Metasploitable2/](http://sourceforge.net/projects/metasploitable/files/Metasploitable2/))\
    \ \n\n2.   Unzip the file and place it in the folder of your choosing: \n\n![](images/00020.jpeg)\n\
    \nThen just open Metasploitable 2 in VMWare by starting another copy of VMWare\
    \ Player:"
  fmt: '

    Setting up virtual machines makes it very easy to learn offensive computer security
    testing in a lab type environment. That way we do not need a room full of computers
    to set up a learning environment, we only need one machine powerful enough to
    run several Virtual Machine sessions at once. In writing the book, I used a Windows
    7 Core i7-6700 system with 8 GB of RAM as the Virtual Machine host. It had plenty
    of power to run all three of our lab operating systems at the same time with no
    problem at all. Though 64-bit versions should work similarly, I chose 32-bit for
    the Kali Linux install as some of the tools installed in Kali will only run on
    32-bit systems. If you have experience with Virtual Systems, you can use any Virtual
    Machine software that you want. I will be using `VMware Player` as the host for
    Kali Linux & Metasploitable 2. More advanced readers can also setup Metasploitable
    3 in `VirtualBox` for an additional test target.


    When everything is setup, we should have a small test network that looks something
    like this:


    ![](images/00007.jpeg)


    I use a `172.24.1.0` network layout for the book. Your network/ IP addresses may
    be different.


    **NOTE**: As we will be dealing with vulnerable operating systems, make sure that
    you have a Firewall (Preferably hardware) between the Host system and the live
    internet!


    ### Install VMware Player & Kali


    Installing Kali on `VMware` is pretty simple as Offensive Security provides a
    Kali VMware image that you can download, so we will not spend a lot of time on
    this. Basically, just download the Kali VM image and open it in `VMWare Player`.
    We will step through the process.


    1. Download and install `VMWare Player` for your version of Operating System.


    `VMWare player` versions and the download location change somewhat frequently.
    At the time of this writing, the current version of `VMWare Player` is “VMWare
    Workstation 15 Player”. This can be run as either the free player for non-commercial
    usage or via license:


    ([https://www.vmware.com/go/tryplayer](https://www.vmware.com/go/tryplayer))


    ![](images/00008.jpeg)


    2. Choose where you want it to install it, the default is normally fine.


    3. Follow through the install prompts, reboot when asked.


    4. Start `VMWare` and enter either your e-mail address for the free version or
    purchase & enter a license key for commercial use.


    5. Click, “Continue” and then “Finish” when done.


    6. Download the Kali Linux 32-bit VM Image ([https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-hyperv-image-download/](https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-hyperv-image-download/)).


    It is always a good idea to verify the download file checksum to verify that the
    file is correct and hasn’t been modified or corrupted. In Windows you can do this
    with the `certUtil` command:


    7. From a command prompt, enter `certUtil -hashfile [kali linux download file]
    SHA256`


    ![](images/0009.gif)


    Then verify the checksum with the one listed on the Kali page.


    8. Next, extract the file to the location that you want to run it.


    9. Start the `VMware Player`.


    10. Click, “Player” from the menu.


    11. Then “File”


    12. Next click, “Open”.


    13. Navigate to the extracted Kali Linux `.vmx` file, select it, and click, “Open”.


    14. It will now show up on the `VMWare Player` home screen.


    15. With the Kali VM highlighted click, “Edit Machine Settings”.


    16. Here you can view and change any settings for the VM:


    ![](images/0010.jpeg)


    17. Click, “Network Adapter”: It is set to `NAT` (Network Address Translation)
    by default. `NAT` means that each Virtual machine will be created in a small `NAT`
    network shared amongst them and with the host; they can also reach out to the
    internet if needed. Some people have reported problems using `NAT` and can only
    use `Bridged`, thus I used `bridged` for all of my virtual machines in this book.
    If you use `bridged`, make sure to have a hardware firewall between your system
    and the Internet. Also, make sure the host is on a private LAN, separate from
    any business or critical systems.


    18. Click “OK” to return to the `VMWare Player` main screen.


    19. Now just click, “Play Virtual Machine”, to start Kali. You may get a message
    asking if the VM was moved or copied, just click, “I copied it”.


    20. When prompted to install `VMWare tools`, select to install them later.


    21. When Kali boots up, you will come to the Login Screen:


    ![](images/0011.jpeg)


    22. Login with the username, “root” and the password “toor” (root backwards).


    23. You will then be presented with the main Desktop:


    ![](images/0012.jpeg)


    We now have the Kali VM installed.


    ### Setting the Kali IP address


    You can leave all the IP addresses as dynamic assign (DHCP) if you want. This
    may get a little confusing and you might want to set IP addresses for your Kali
    Linux and Metasploitable 2 systems. You can set your Kali IP address using the
    following steps.


    1. Click on the down pointing triangle in the upper right, by the power button.


    2. Click on “Wired Connected” to expand it.


    3. Then click on “Wired Settings” as seen below:


    ![](images/0013.jpeg)


    4. Click on Network on the left side menu.


    5. Under “Wired - Connected” click the settings icon:


    ![](images/0014.jpeg)


    6. Click the `IPv4` tab


    7. Click the “Manual” radial button.


    8. Under Addresses enter the IP address, netmask and gateway:


    ```

    172.24.1.39 255.255.255.0 172.24.1.1

    ```


    9. Click, “Apply” when finished.


    Reboot the system. When it comes back, open a terminal (click the terminal on
    the quick start) and run `ifconfig` to make the IP address was changed:


    ![](images/0015.jpeg)


    If your router settings are correct, you should also be able to reach the internet:


    ![](images/0016.jpeg)


    And that’s it; Kali should now be installed and ready to go.


    ### Updating Kali


    Kali Linux is constantly being updated to include the latest tools and features.
    To update Kali Linux, open a terminal and type:


    ```

    apt update

    apt upgrade

    ```


    ![](images/0017.jpeg)


    The update could take a while and may prompt you for input. If you are unsure
    how to answer a question, just use the default response. Reboot when the update
    is complete.


    Now that Kali is updated, let’s talk about the VMWare tools.


    ### VMWare tools


    When Kali boots up, don’t install the VMware tools when prompted. The Vare tools
    are installed by default in the latest version of Kali. This allows the OS to
    work better with `VMware`, usually giving you more control over video options
    and enables cut & paste capability with the host. If copy & paste stops working
    between the Host and the Kali VM, there is a file on the Kali Desktop that re-starts
    `vmtools` so copy and paste will work again:


    ![](images/0018.jpeg)


    ### Installing Metasploitable 2


    Metasploitable 2, the purposefully vulnerable Linux operating system is also available
    as a `VMware` virtual machine. As we did with the Kali VM above, all we need to
    do is download the Metasploitable 2 VM image, unzip it and open it with `VMware
    Player`.


    1. Download Metasploitable 2 ([http://sourceforge.net/projects/metasploitable/files/Metasploitable2/](http://sourceforge.net/projects/metasploitable/files/Metasploitable2/))


    2. Unzip the file and place it in the folder of your choosing:


    ![](images/0020.jpeg)


    Then just open Metasploitable 2 in `VMWare Player` by starting another copy of
    `VMWare Player`.

