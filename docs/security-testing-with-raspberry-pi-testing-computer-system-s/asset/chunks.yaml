- raw: "### Blocking Ads and Malware Sites with Pi-Hole\n\n![](images/00259.jpeg)\n\
    \nTool Website: [https://pi-hole.net/](https://pi-hole.net/)\n\nTool Wiki: [https://docs.pi-hole.net/](https://docs.pi-hole.net/)\n\
    \nLastly, another use for Raspberry Pi is to block those irritating ads and malware\
    \ sites with Pi-Hole. Pi-Hole is a network wide ad blocker that runs on Raspberry\
    \ Pi (and other platforms). You can also use a TFT display with Pi-Hole to get\
    \ stats at a glance. Pi-Hole will run on any supported device. I used Adafruit’s\
    \ 2.8” TFT resistive Pi-Hole kit, with a Raspberry Pi 3b. It was very easy to\
    \ assemble and use:\n\n[https://blog.adafruit.com/2018/10/11/new-product-ad-blocking-kit-for-pi-hole-with-2-8-pitft-no-soldering/](https://blog.adafruit.com/2018/10/11/new-product-ad-blocking-kit-for-pi-hole-with-2-8-pitft-no-soldering/)\n\
    \n        Adafruit has complete instructions for the entire process for their\
    \ kit here [https://learn.adafruit.com/pi-hole-ad-pitft-tft-detection-display/overview](https://learn.adafruit.com/pi-hole-ad-pitft-tft-detection-display/overview)\n\
    \n        Complete install instructions can also be found on the Pi-Hole Wiki:\
    \ [https://docs.pi-hole.net/](https://docs.pi-hole.net/)\n\nI am only going to\
    \ quickly cover the install process. If you purchase the Adafruit kit I highly\
    \ recommend you follow the steps provided on their website! It is important to\
    \ understand the security implications of using a RPi as a DNS server for your\
    \ entire home or office. If you are not completely comfortable with configuring\
    \ Raspberry Pis, DNS servers, web security and network configuration, do not attempt\
    \ this on your own. Proceed at your own risk, due to the wide variety of network\
    \ configurations available, I can not provide technical support for this setup.\
    \ \n\n#### Install Raspbian Lite\n\nJust download the appropriate file for your\
    \ Raspberry Pi (I use a Pi3b) and write it to a microSD card. Before you remove\
    \ the memory card from the writer, add a blank text file to the card with the\
    \ name, “ssh”, this will enable SSH by default when you boot up Raspbian for the\
    \ first time. \n\nNOTE: Don’t forget to change your Pi passwords, and use long\
    \ complex passwords! \n\nAttach your peripherals to your Pi, plug in the microSD\
    \ card, and apply power to your Pi. You should now be able to SSH into the Pi.\n\
    \n#### Install Raspbian updates\n\nIn a terminal run the following commands:\n\
    \n        apt update\n\n        apt upgrade\n\nAlso, in “Raspi-Config” if you\
    \ live in the US, set your locale to “US”, or whatever your country code actually\
    \ is - it defaults to “GB” and if this is not correct, can cause a lot of problems\
    \ when you run the graphical PADD interface for Pi-Hole.\n\n#### Install Pi-Hole\
    \ & PADD\n\nInstalling Pi-Hole is very simple.\n\nFrom a Raspbian terminal prompt\
    \ enter:\n\n        curl -sSL https://install.pi-hole.net | bash\n\nAnd then\
    \ follow through the installation prompts. \n\n#### Install PADD\n\n![](images/00260.jpeg)\n\
    \nIf you are using a TFT screen, installing PADD gives you a very nice interface\
    \ for the Pi-hole. Install will depend on what TFT screen you are using, so I\
    \ just followed Adafruit’s PADD install instructions for my 2.8” screen, located\
    \ here:\n\n[https://learn.adafruit.com/pi-hole-ad-pitft-tft-detection-display/install-padd](https://learn.adafruit.com/pi-hole-ad-pitft-tft-detection-display/install-padd)\n\
    \n#### Web Interface\n\nPi Hole’s Web Interface is really slick, it gives you\
    \ a lot of information in a nice graphical interface. When your Pi-Hole is running,\
    \ just surf to “\\[Raspberry Pi IP\\]/admin”, so if your RPi has an IP of 192.168.1.112\
    \ you would surf to “192.168.1.112/admin”. \n\nYou would then see a display like\
    \ this:\n\n![](images/00261.jpeg)\n\n#### Setting up clients to use Pi-Hole\n\n\
    Lastly, just set the DNS address of any system (or your router) you want to use\
    \ Pi-Hole to the IP address of your Pi-Hole RPi. This varies by Operating System,\
    \ so you will need to research how to do it for your network. It will then automatically\
    \ and silently block web ads as you surf! You can download additional block lists\
    \ available online, I block about 3 million sites with mine, but the problem is,\
    \ you may inadvertently block legit sites. You would then need to go through your\
    \ block lists and find what site shouldn’t be blocked – not a fun task. So, it\
    \ is best to use the default list, until you become familiar with your Pi-Hole\
    \ and want to tinker with additional block lists. \n\n#### Some Issues \n\nThe\
    \ Pi-Hole install directions wants you to rename your Pi. If your Pi-Hole install\
    \ kicks out a “can’t resolve hostname” during install, it’s because the RPI didn’t\
    \ update the hostname for your Pi. You just have to edit the hostname file yourself\
    \ and put in the new Pi name. If your Pi-Hole install hangs at “configuring resolvconf”\
    \ your resolv.conf file isn’t pointing to your DNS server (I use “1.1.1.1” for\
    \ the CloudFlares DNS service) and the DNS server location needs to be edited.\
    \ You can’t (reliably) edit this file directly. Instead you need to modify the\
    \ dhcpcd.conf file.\n\n### Conclusion & Wrap Up\n\nIn this chapter, I have demonstrated\
    \ 4 separate ways on how to use a Raspberry Pi as a surveillance camera. Through\
    \ the chapter we progressed from feature rich surveillance software to video command\
    \ line solutions. There are other programs that you can use, my best advice to\
    \ check each of them out and see which one best fits your individual needs. But\
    \ most importantly, have fun doing it! \n\n#### Resources\n\n1.  Raspberry Pi\
    \ Zero W Camera Pack - [https://www.adafruit.com/product/3414](https://www.adafruit.com/product/3414)\n\
    \n2.  Official Raspivid Webpage - [https://www.raspberrypi.org/documentation/usage/camera/raspicam/raspivid.md](https://www.raspberrypi.org/documentation/usage/camera/raspicam/raspivid.md)\n\
    \n3.  Raspberry Pi camera webpage - [https://www.raspberrypi.org/documentation/raspbian/applications/camera.md](https://www.raspberrypi.org/documentation/raspbian/applications/camera.md)\n\
    \n4.  Raspicam Commands -  [https://www.raspberrypi.org/documentation/usage/camera/raspicam/](https://www.raspberrypi.org/documentation/usage/camera/raspicam/)\n\
    \n5.  Magic Mirror 2 - [https://github.com/MichMich/MagicMirror](https://github.com/MichMich/MagicMirror)\n\
    \n## Chapter 11\n\n## Pi Defense and Conclusion\n\nWe spent a lot of time covering\
    \ offensive security techniques in this book. We will wrap things up with a quick\
    \ discussion on securing Pi systems from these types of attacks. In April, 2018,\
    \ NASA was hacked due to an unauthorized Raspberry Pi that was connected to the\
    \ NASA JPL network1. Hackers stole about 500 Megabytes of Mars Mission data. People\
    \ think, “it’s just a Raspberry Pi” and they forget that it is a fully functional\
    \ computer, one that can be a point of compromise just like any other system.\
    \ Therefore, it is important to follow company security standards and practices\
    \ when using a Pi. \n\n### Scanning using Shodan\n\nTool website: Shodan.io\n\n\
    Shodan or “The Hacker’s Google” is a search engine for computers. It acts a lot\
    \ like Google, but instead of looking for puppy or cat videos, it searches for\
    \ computers that are directly available on the internet. You can use filter keywords\
    \ to perform powerful searches in Shodan. For example, you could search for all\
    \ the Windows Servers that your company is using in Seattle, for example. It can\
    \ search by web app server version, OS version, and on and on. It makes it very\
    \ easy for a company to see what they have publicly available on the web. Unfortunately,\
    \ Shodan is also a tool that Hackers use to quickly find vulnerable systems on\
    \ the web. They could look for a vulnerable web server version in any country,\
    \ city, or corporate entity. You can find Raspberry Pi systems very easily using\
    \ Shodan.\n\n        In a web browser, surf to “shodan.io”"
