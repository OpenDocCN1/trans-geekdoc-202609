- raw: "Another similar prank type attack would be to make a P4wnP1 payload that causes\
    \ the computer to talk to the user. Again, this is accomplished by using very\
    \ simple PowerShell commands. \n\n        On Windows 10, start PowerShell\n\n\
            Enter the following command, “(New-Object -ComObject SAPI.SPVoice).Speak(“This\
    \ is a test”)”\n\nThat’s it! The computer should audible say, “This is a test”\
    \ in a computerized voice.\n\n![](images/00223.jpeg)\n\nThe computer will “talk”\
    \ or read back to you whatever is in the Speak part of the command. Can you take\
    \ that command and make a P4wnP1 payload out of it? Go ahead and give it a try.\
    \ One hint is that you will need to use single quotes (‘) for the speak string\
    \ instead of normal quote (“) for P4wnP1 to parse the line correctly. \n\nHere\
    \ is one way that it could be done:\n\n![](images/00224.jpeg)\n\nThe “Hide PowerShell\
    \ Function” is truncated in the picture above, but this is literally the same\
    \ program we used before, just the type command at the end has been changed. There\
    \ is now a single type command that enters the PowerShell speak command. If you\
    \ are really adventurous, mix the speak command with the hidden video command\
    \ from the last exercise. You should be able to come up with some interesting\
    \ combinations! \n\n#### Conclusion\n\nThis was just a very basic intro to P4wnP1.\
    \ We didn’t even cover interfacing with the deployed USB drive. The tool author\
    \ put in an amazing amount of time and released a very polished and powerful tool.\
    \ I mean, how many tool authors put a fully functional editor in their tool? As\
    \ the tool is programmable and can fire off of triggers, the usage of P4wnP1 is\
    \ really limited only by the imagination. For example, a recent article was released\
    \ to show how it could be used to bypass anti-virus (link below).  This is one\
    \ of my favorite HID tools, the more time you spend with it, the more uses you\
    \ will find for it!\n\n#### Resources\n\n        1 Run Hidden IE session, Terminate\
    \ after 30 seconds - [https://powershell.org/forums/topic/run-hidden-ie-session-terminate-after-30-seconds/](https://powershell.org/forums/topic/run-hidden-ie-session-terminate-after-30-seconds/)\n\
    \n        Recreating Iran AC/DC Thunderstruck Worm with PowerShell & Metasploit\
    \ - [https://cyberarms.wordpress.com/2015/02/09/recreating-iran-acdc-thunderstruck-worm-with-powershell-metasploit/](https://cyberarms.wordpress.com/2015/02/09/recreating-iran-acdc-thunderstruck-worm-with-powershell-metasploit/)\n\
    \n        Making your Computer talk with PowerShell - [https://cyberarms.wordpress.com/2015/01/09/making-your-computer-talk-with-powershell/](https://cyberarms.wordpress.com/2015/01/09/making-your-computer-talk-with-powershell/)\n\
    \n        Simple AV Evasion Symantec and P4wnP1 USB - [https://medium.com/@fbotes2/advance-av-evasion-symantec-and-p4wnp1-usb-c7899bcbc6af](https://medium.com/@fbotes2/advance-av-evasion-symantec-and-p4wnp1-usb-c7899bcbc6af)\n\
    \n## Chapter 10\n\n## Physical Security & Other Options\n\nThe last topic I wanted\
    \ to cover is using Pi’s for physical security. This includes Surveillance Cams,\
    \ Nanny cams, and other options. As there are already a lot of step-by-step tutorials\
    \ out there on using RPis for these projects, this will just be mostly an informational\
    \ overview instead of a tutorial chapter. Complete write ups for these projects\
    \ can be found on my “DanTheIOTMan.com” blog.\n\nFor this chapter, you will need:\n\
    \n        Raspberry Pi v2 8 MP Camera with Pi Zero W cable and/or Pi3,4 cable\n\
    \n        Raspberry Pi Camera case (Many to choose from)\n\nOptionally you will\
    \ need:\n\n        Raspberry Pi Night Vision Camera \n\n        ZeroView case\n\
    \n        Pi Battery\n\nNote: The camera cable is different if you are using\
    \ a Pi Zero W compared to a Pi3 or 4 series. Make sure you get the correct cable\
    \ for your Pi. The Pi 3 & 4 can use the same video cable.\n\nThere are several\
    \ software solutions for turning you Raspberry Pi into a surveillance system.\
    \ The following are just some of your available options. Some are a little slower,\
    \ but have a lot of features like motion detect and remote alert. Others don’t\
    \ have a lot of features but offer pretty close to real time video streaming.\
    \ I suggest you try out several and see which works best for your application.\
    \ \n\nFor the regular camera setup, I used an Adafruit Pi Zero W Camera kit1 that\
    \ included the Pi Zero W, the Pi Camera v2 (8 Megapixels), and a case. Though\
    \ this camera has great resolution, it does draw a bit more power and can run\
    \ a little on the hot side. I also used an Anker Battery Pack which allowed the\
    \ camera to be a bit more mobile:\n\n![](images/00225.jpeg)\n\nFor the Night Vision\
    \ Camera, I used a Raspberry Pi Night Vision Camera with 2 Infrared LEDs with\
    \ a Vilros Pi Zero W Starter Kit. I couldn’t find a case specifically for the\
    \ night vision camera, so I just bought the starter kit so I could have the extra\
    \ adapters for future projects:\n\n![](images/00226.jpeg)\n\nNo matter which option\
    \ you choose (night vision or regular camera) the Pi Zero W setup is the same.\
    \ The only thing you need to make sure when ordering cameras, is that it comes\
    \ with the correct cable for your version of Pi. Before we talk about surveillance\
    \ software, I just want to introduce one of my favorite cases, the “ZeroView”\
    \ case.\n\n### ZeroView Case\n\nProduct Page: [https://thepihut.com/products/zeroview](https://thepihut.com/products/zeroview)\n\
    \nThe ZeroView Pi Zero camera mount is one of the coolest camera “cases” that\
    \ I have found for the Pi Zero. The mount is made to hold a Pi Zero and a camera\
    \ in a special configuration that mounts to a window or any glass surface. The\
    \ case looks and works great:\n\n![](images/00227.jpeg)\n\nThe configuration of\
    \ the ZeroView is pretty unique, you can mount it in places that you couldn’t\
    \ place a normal case. It is nice too, as unlike some other Pi Zero camera cases,\
    \ you have easy access to the MicroSD card. Add a battery pack and you have a\
    \ lot of freedom in placing your surveillance camera. I have positioned mine in\
    \ a house window to cover an area that wasn’t covered with my commercial surveillance\
    \ system.  I have even mounted it to my car’s windshield and used it as a “dashboard”\
    \ cam, with exceptional results. \n\nWith that being said, let’s take a look at\
    \ four ways to turn your Raspberry Pi into a physical security device - a surveillance\
    \ camera! The chapter will start with the easiest and most feature rich solutions,\
    \ albeit a little slower video streaming speeds, to near real time solutions that\
    \ don’t have all the bells and whistles. \n\n### MotionEyeOS\n\nTool GitHub: [https://github.com/ccrisan/motioneyeos](https://github.com/ccrisan/motioneyeos)\n\
    \nTool Releases: [https://github.com/ccrisan/motioneyeos/releases](https://github.com/ccrisan/motioneyeos/releases)\n\
    \nTool Wiki: [https://github.com/ccrisan/motioneyeos/wiki](https://github.com/ccrisan/motioneyeos/wiki)\n\
    \nMotionEyeOS is the easiest and most feature packed surveillance software solution\
    \ that we will cover. MotionEyeOS has a plethora of options for setup, recording,\
    \ even streaming the video to another location. All of these options do come at\
    \ a price, as of the 4 methods that we will cover, this option produced one of\
    \ the slowest video captures. Even at the lowest resolution there seemed to be\
    \ a slight lag between recording and viewing the stream on another PC. \n\nSetup\
    \ is very easy for this project. Basically, all we need to do is download the\
    \ MotionEyeOS image from the tool releases page. Use the “RaspberryPi” image if\
    \ you have a Pi 0W, the pi2 image for a Pi 2, etc. Write the image to a memory\
    \ card (I used an 8GB card), set your Wi-Fi router info in the WPA Supplicant\
    \ file, and then just boot it up. \n\nUsing Notepad++, enable “Linux EOL Conversion”,\
    \ set your country code & WiFi information, and then save this text file as “wpa\\\
    _supplicant.conf”:\n\nctrl\\_interface=DIR=/var/run/wpa\\_supplicant GROUP=netdev\n\
    \nupdate\\_config=1\n\ncountry=US\n\nnetwork={\n\n     ssid=\"Your network name/SSID\"\
    \n\n     psk=\"Your WPA/WPA2 security key\"\n\n     key\\_mgmt=WPA-PSK\n\n}"
  fmt: "\nAnother similar prank type attack would be to make a `P4wnP1` payload that\
    \ causes the computer to talk to the user. Again, this is accomplished by using\
    \ very simple `PowerShell` commands.\n\n- On Windows 10, start `PowerShell`\n\
    - Enter the following command, `(New-Object -ComObject SAPI.Voice).Speak(\"This\
    \ is a test\")`\n\nThat’s it! The computer should audible say, \"This is a test\"\
    \ in a computerized voice.\n\n![](0223.jpeg\n\nThe computer will \"talk\" or read\
    \ back to you whatever is in `Speak` part of the command. Can you take that command\
    \ and make a `P4wnP1` payload of it? Go ahead and give it a try. One hint is that\
    \ you will need to use single quotes `'` for the `speak` string instead of normal\
    \ `\"` for `P4wnP1` to parse the line correctly. Here is one way that it could\
    \ be:\n\n![](0224.jpeg\n\nThe `Hide PowerShell `Function` is truncated in the\
    \ picture above, but this is literally the same program we used before, just the\
    \ command at the end has been changed. There is now a single command that enters\
    \ the `speak` command. If you are really adventurous, mix the `speak` command\
    \ with the hidden command from the last exercise. You should be able to come up\
    \ with some combinations!\n\n### Conclusion\n\nThis was just a very basic intro\
    \ to `P4wnP1`. We didn’t even cover interfacing with the USB. The author put in\
    \ an amazing amount of time and released a very polished and powerful tool. I\
    \ mean, how many authors put a fully functional in their? As the tool is programmable\
