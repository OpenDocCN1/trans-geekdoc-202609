    Tool GitHub: [https://github.com/mame82/P4wnP1_aloa](https://github.com/mame82/P4wnP1_aloa)


    In this chapter we will cover the new P4wnP1 release. P4wnP1 ALOA is a compete
    re-write of the original P4wnp1 with a multitude of new features. In my personal
    opinion, P4wnP1 ALOA is one of the best ethical hacking frameworks for the Raspberry
    Pi. It combines the capabilities of several Human Interface Device (HID) based
    tools into one, expands upon them, and allows you to completely change or control
    the device on the fly through a live web interface. P4wnP1 has a ton of features
    and capabilities, so this will only be a quick overview of the tool.


    ### Installation


    P4wnP1 ALOA runs on a Raspberry Pi Zero W. The tool is available from the author’s
    tool site, but it has also been added to the Official Kali Linux ARM downloads
    page. Installation is the same as previous tools, just download the image, extract
    it and write it to a microSD card.


    We will download the image from the Kali ARM website:


    1. Surf to [https://www.offensive-security.com/kali-linux-arm-images/](https://www.offensive-security.com/kali-linux-arm-images/).

    2. Under the Raspberry Pi tab, download Kali Linux P4wnP1 ALOA:

    ![](images/00199.jpeg)

    3. Extract (`7zip`) and write the image to a microSD card, `encher` works great:


    ![](images/00200.jpeg)


    P4wnP1 was designed to run “headless”, no need to connect peripherals. Just insert
    the memory card and plug the power cord into the outer edge USB connector on the
    Pi and you are ready to go. Notice I mentioned to plug the power cord into the
    outer edge connector. When you attach the P4wnP1 to a target system, you will
    not use the power connector, but the inside (middle) USB connector - Pay close
    attention to this as we go through the chapter.


    ### Connecting to P4wnP1


    Basically, how P4wnP1 works is that you connect to it via `SSH` or the web interface
    to configure the device. Then when you are ready to use it, you plug the device
    into the target system. Unlike other HID type devices, even when the P4wnP1 is
    deployed, you can still remote in and modify or reconfigure it on the fly! There
    are several ways to connect to the P4wnP1, we will cover:


    1. WiFi Connect

    2. USB RNDIS

    3. Bluetooth Connect


    Pick only one of the three to interface with the Pi at any time. I use WiFi Connect
    throughout this chapter.


    #### 1. WiFi Connection


    A few seconds after you plug power into your P4wnP1 power connector, a new Wi-Fi
    network will appear:

    ![](images/00201.gif)


    - Connect to the WiFi network:

    Password: `MaMe82-P4wnP1`


    You can now surf to the control panel interface or `SSH` into the Pi to get to
    the Kali Linux operating system.

    - For the Web Control interface, open a web browser and surf to: [http://172.24.0.1:8000](http://172.24.0.1:8000)

    ![](images/00202.jpeg)


    Or just `Putty` or `SSH` into `172.24.0.1` to access the underlying Kali Linux
    OS:

    ![](images/00203.gif)


    The Kali Linux used in Pw4nP1 is the same Kali Linux that you would get with a
    regular Kali for the Pi install. It comes, like the original, with a fairly bare
    bones install – the top 10 tools install. So, you have `Wireshark`, `nmap`, `Metasploit`
    and such. If you want the additional tools, you need to install the Kali Metapackages
    mentioned in the earlier Kali for the Pi chapter. You can also install individual
    tools with `apt install`. Remember though that the Pi Zero W doesn’t have the
    horsepower as the Pi 3b+, so I would be selective.


    #### 2. Connecting via USB RNDIS


    I use the Wi-Fi connect exclusively for control, but you can also connect to the
    Pi via USB RNDIS. If you plug the device into your host system using the inside
    (middle) USB connector, you can access the device as a USB Ethernet device. This
    is the same way you would connect the P4wnP1 to a target system. A new “Ethernet”
    adapter will appear on your system. You will be able to control the device via
    `Putty`, `SSH`, or through the Web control panel interface. The IP address will
    be different, it will now be `172.16.0.1` for the `SSH` interface and `172.16.0.1:8000`
    for the http control panel.


    A new Ethernet Adapter will appear on your host system:

    ![](images/00204.gif)


    Connecting with `SSH`:

    ![](images/00205.jpeg)


    Connecting to the HTML Control Panel:

    ![](images/00206.jpeg)


    You can then change any settings that you want.


    #### 3. Connecting via Bluetooth


    Lastly, we could also connect to P4wnP1. I use the Wi-Fi connect exclusively for
    control, but you can also connect to the Pi via USB RNDIS. If you plug the device
    into your host system using the inside (middle) USB connector, you can access
    the device as a USB Ethernet device. This is the same way you would connect the
    P4wnP1 to a target system. A new “Ethernet” adapter will appear on your system.
    You will be able to control the device via `Putty`, `SSH`, or through the Web
    control panel interface. The IP address will be different, it will now be `172.16.0.1`
    for the `SSH` interface and `172.16.0.1:8000` for the http control panel.


    ### P4wnP1 Control Panel Interface


    Now that we have covered several ways to connect to the P4wnP1, let’s take a look
    at the P4wnP1 Web Control. The tool creator has done an amazing job with the interface.
    I was messing around with a lot of different configurations and put the device
    in an unstable state. Any other HID type tool would have likely needed to be unplugged,
    brought back to the host system and re-configured. I was able to re-deploy default
    settings to the device, while it was connected to a target system, and I was back
    in business!


    Let’s take a look at the Main Menu items:


    ##### P4wnP1 Control Panel

    ![](images/00210.jpeg)


    On the Main Control Panel interface, you have the main option buttons across the
    top and changeable settings in the window below.


    ##### Connection Settings

    ![](images/00211.jpeg)


    Starting at the top, the left 4 menu buttons are for configuring the different
    connection types. You can change the WiFi name & channel, change the Bluetooth
    to High speed or Low Energy, setup the DHCP range, etc.


    ##### Trigger Actions

    ![](images/00212.jpeg)


    Trigger actions are a major part of the new P4wnP1 version. They really add a
    lot of intelligent scripting to the tool. There are several pre-existing scripts
    that tell P4wnP1 how to behave when it is connected to the target:

    ![](images/00213.jpeg)


    When you get used to using the tool, you can bring it to the next level by adding
    your own Trigger Actions. You can trigger off of any of the following events:

    ![](images/00214.jpeg)


    And perform any of the following actions:

    ![](images/00215.jpeg)

    '
