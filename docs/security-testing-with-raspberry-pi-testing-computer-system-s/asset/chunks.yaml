- raw: "You should see pretty much real-time video with almost no latency displayed\
    \ on your monitor. The “\\-t” switch just tells how long to display the camera\
    \ in milliseconds, or in our case, 10 seconds. If you want save the video you\
    \ record, just add the “\\-o” output switch to your command and add a filename:\n\
    \n        raspivid -o video.h264 -t 10000ls\n\nThe resultant video will be saved\
    \ in your current directory, which by default is “\\\\home\\\\pi”. If you want,\
    \ you can add the date & time to the video by adding “\\-a 12” to the previous\
    \ command.\n\n![](images/00236.jpeg)\n\nFor more information on the Raspivid command\
    \ and how to convert the output to mp4 format, check out the official raspivid\
    \ webpage2 and Raspberry Pi Camera webpage3. \n\n#### Snapshots with Raspistill\n\
    \nYou can also take image snapshots using the Raspistill command:\n\n       \
    \ raspistill -o picture.jpg\n\nThe camera will display to the screen, and after\
    \ a few seconds, takes a single picture which is saved as the output name provided.\
    \ More information on taking single shots and additional camera commands can be\
    \ found on the official raspberry pi webpage4. \n\nIf you SSH remotely into your\
    \ Pi using a program like Putty, you can run the camera commands, as seen below:\
    \ \n\n![](images/00237.jpeg)\n\nThe problem is that the video doesn’t show up\
    \ remotely, it simply displays on the monitor connected to the Pi. So technically\
    \ you could run the Pi like this to capture remote images, but you will not be\
    \ able to remotely view what the camera is actually seeing. To do so, we need\
    \ some additional setup.\n\n#### Running Pi Camera Remotely with Raspivid\n\n\
    There are different ways to remotely view video using the raspivid command. I\
    \ will cover one of the ways that seems to produce the best video quality with\
    \ little latency. For this section, we will run the Pi “headless”, which means\
    \ without keyboard or video. We also need a secondary Linux computer to use as\
    \ a remote viewer, I chose to use a Kali Linux system. \n\nFrom your remote system,\
    \ SSH into the Pi:\n\n        From a Linux terminal type “ssh pi@\\[your Pi IP\
    \ Address\\]”\n\n![](images/00238.jpeg)\n\nLeave that terminal window open and\
    \ open an additional Terminal on your Linux system. We will be entering commands\
    \ into both the regular Linux terminal and the SSH terminal windows. In effect\
    \ we will be redirecting the video output from the Pi to the Kali Linux system\
    \ through SSH. This technique is discussed in several sources including the Raspberry\
    \ Pi Forums: \n\n[https://www.raspberrypi.org/forums/viewtopic.php?t=219461](https://www.raspberrypi.org/forums/viewtopic.php?t=219461)\n\
    \nIn the regular Linux Terminal, run these commands:\n\n        Enter, “apt install\
    \ mplayer”\n\n        After that installs, “netcat -l -p 5000 | mplayer -fps\
    \ 60 -cache 2048 -”\n\n![](images/00239.jpeg)\n\nIn the Linux SSH Terminal, run\
    \ this command:\n\n        raspivid -t 0 -w 1280 -h 720 -o - | nc \\[Linux System\
    \ IP\\]  5000\n\n![](images/00240.jpeg)\n\nIt may take a second or two for the\
    \ display to appear. After that, full speed, close to real time video should appear\
    \ on your Linux computer:\n\n![](images/00241.jpeg)\n\nAnd that is it! With just\
    \ the two commands, we can view the video remotely. When finished, it is always\
    \ best to shut down the Pi before removing power from it.\n\n#### Raspivid Conclusion\n\
    \nIn this section, we quickly covered how to connect to and view a camera feed\
    \ using the built-in Raspbian Raspivid command. We also saw how to stream the\
    \ video to a remote system using netcat. There are numerous other ways you can\
    \ stream remote video with raspivid, and even upload it directly to YouTube, but\
    \ from what I have seen causes a bit of latency in the process. This is why I\
    \ prefer to use the netcat command as there is little to no latency. Next, we\
    \ will see how to stream video using Python.\n\n### Capturing Video with Python\
    \ using PiCamera\n\n![](images/00242.jpeg)\n\nTool Wiki: [https://projects.raspberrypi.org/en/projects/getting-started-with-picamera](https://projects.raspberrypi.org/en/projects/getting-started-with-picamera)\n\
    \nThis is the last of four solutions I will cover on creating a surveillance camera\
    \ using Raspberry Pi. As we have progressed, we have gone from solutions that\
    \ provide a lot of extra features, but due to the features have some video lag\
    \ – To solutions that offer pretty much real-time video streaming, but don’t offer\
    \ the extra bells and whistles. Python PiCamera is a Python solution for controlling\
    \ an RPi camera. It is very fast, and if you are a Python guru, you could even\
    \ create your own surveillance system with custom programming. \n\nEven if you\
    \ are not a Python master (I am definably not!), PiCamera is still pretty simple\
    \ to learn by just reading through the documentation. It is also easy to use thanks\
    \ to the example PiCamera scripts. For more information check out Raspberry Pi’s\
    \ official webpage using the PiCamera Wiki link above. We will use the same setup\
    \ and Raspbian install as the previous Raspivid section. \n\n#### PiCamera Setup\n\
    \nIf you don’t want to use the previous Raspbian install, and are installing from\
    \ scratch, you will need to install Raspbian. Once your image is written to the\
    \ memory card, don’t forget to set your WiFi using the wpa\\_supplicant.conf file\
    \ and create a blank file called “ssh” in the memory card root before you insert\
    \ it into your Pi. You will also need to enable the camera in the Raspberry Pi\
    \ configuration. \n\nNOTE: Don’t forget to turn off RPI Cam if you still have\
    \ it installed.\n\n        With the Pi powered off, attach video & keyboard \n\
    \n        Power up and log in\n\nNow we just need to install Python PiCamera:\n\
    \n        Enter, “sudo apt install python3-picamera”\n\n#### Viewing Video with\
    \ PiCamera\n\nThe official documents cover all of this, including this simple\
    \ program to view the camera feed:\n\nfrom picamera import PiCamera\n\nfrom time\
    \ import sleep\n\ncamera = PiCamera()\n\ncamera.start\\_preview()\n\nsleep(20)\n\
    \ncamera.stop\\_preview()\n\nThis will display the camera on the video screen\
    \ for 20 seconds. The script is very simple – the start command turns on the camera,\
    \ it runs for 20 seconds and then the stop command turns off the camera. \n\n\
    To create this program:\n\n        Use the text editor nano, “nano camera.py”\n\
    \n        Enter the program into the text file\n\n        “Ctrl-x”, “y” and\
    \ then “enter” to save the file as “camera.py”\n\n![](images/00243.jpeg)\n\nTo\
    \ run it:\n\n        Type in, “chmod 777 camera.py” to make it executable\n\n\
            Then, “python3 ./camera.py”\n\nAnd that is it! The video display should\
    \ show the camera feed.\n\n#### Recording Video with PiCamera\n\nHere is a simple\
    \ program to record a feed, a date time stamp has been added:\n\nimport datetime\n\
    \nimport time\n\ndate = datetime.datetime.now().strftime(\"%m\\_%d\\_%Y\\_%H\\\
    _%M\\_%S\")\n\nimport picamera\n\nwith picamera.PiCamera() as camera:\n\n    camera.start\\\
    _preview()\n\n    camera.start\\_recording(\"/home/pi/\"+ date + \"video.h264\"\
    )\n\n    camera.wait\\_recording(30)\n\n    camera.stop\\_recording()\n\n    camera.stop\\\
    _preview()\n\nThis will display the camera on the monitor for 30 seconds, and\
    \ record it to a file called “video.h264” with a date/ time stamp and save it\
    \ in your “/home/pi/” folder.\n\n![](images/00244.jpeg)\n\nCreate the program\
    \ with nano and save the file as “record.py”. Make it executable and then run\
    \ it:\n\n        chmod 777 record.py\n\n        python3 ./record.py\n\nViewing\
    \ it locally is all well and good, but you can also access the camera remotely\
    \ using Python.\n\n#### Remote Streaming with PiCamera\n\nThe PiCamera Documentation\
    \ Webpage includes a script for accessing PiCamera from a remote system. The script\
    \ is located here:\n\n[https://picamera.readthedocs.io/en/release-1.13/recipes2.html#web-streaming](https://picamera.readthedocs.io/en/release-1.13/recipes2.html#web-streaming)\n\
    \nJust save the script as “remotecam.py”, make it executable and run it.\n\nYou\
    \ should see this on your Raspberry Pi:\n\n![](images/00245.jpeg)\n\nNow on a\
    \ remote system on your network, open a web browser and surf to:\n\n        \\\
    [RPi IP Address\\]:8000"
