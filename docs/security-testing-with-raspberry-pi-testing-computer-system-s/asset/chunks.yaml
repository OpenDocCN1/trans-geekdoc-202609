- raw: "Tool GitHub: [https://github.com/mame82/P4wnP1\\_aloa](https://github.com/mame82/P4wnP1_aloa)\n\
    \nIn this chapter we will cover the new P4wnP1 release. P4wnP1 ALOA is a compete\
    \ re-write of the original P4wnp1 with a multitude of new features. In my personal\
    \ opinion, P4wnP1 ALOA is one of the best ethical hacking frameworks for the Raspberry\
    \ Pi. It combines the capabilities of several Human Interface Device (HID) based\
    \ tools into one, expands upon them, and allows you to completely change or control\
    \ the device on the fly through a live web interface. P4wnP1 has a ton of features\
    \ and capabilities, so this will only be a quick overview of the tool.\n\n###\
    \ Installation\n\nP4wnP1 ALOA runs on a Raspberry Pi Zero W. The tool is available\
    \ from the author’s tool site, but it has also been added to the Official Kali\
    \ Linux ARM downloads page. Installation is the same as previous tools, just download\
    \ the image, extract it and write it to a microSD card.\n\nWe will download the\
    \ image from the Kali ARM website:\n\n1.  Surf to [https://www.offensive-security.com/kali-linux-arm-images/](https://www.offensive-security.com/kali-linux-arm-images/).\n\
    \n2.  Under the Raspberry Pi tab, download Kali Linux P4wnP1 ALOA:\n\n![](images/00199.jpeg)\n\
    \n3.  Extract (7zip) and write the image to a microSD card, etcher works great:\n\
    \n![](images/00200.jpeg)\n\nP4wnP1 was designed to run “headless”, no need to\
    \ connect peripherals. Just insert the memory card and plug the power cord into\
    \ the outer edge USB connector on the Pi and you are ready to go. Notice I mentioned\
    \ to plug the power cord into the outer edge connector. When you attach the P4wnP1\
    \ to a target system, you will not use the power connector, but the inside (middle)\
    \ USB connector - Pay close attention to this as we go through the chapter.\n\n\
    ### Connecting to P4wnP1\n\nBasically, how P4wnP1 works is that you connect to\
    \ it via SSH or the web interface to configure the device. Then when you are ready\
    \ to use it, you plug the device into the target system. Unlike other HID type\
    \ devices, even when the P4wnP1 is deployed, you can still remote in and modify\
    \ or reconfigure it on the fly! There are several ways to connect to the P4wnP1,\
    \ we will cover:\n\n1.   WiFi Connect\n\n2.  USB RNDIS\n\n3.  Bluetooth Connect\n\
    \nPick only one of the three to interface with the Pi at any time. I use WiFi\
    \ Connect throughout this chapter. \n\n#### 1.  WiFi Connection\n\nA few seconds\
    \ after you plug power into your P4wnP1 power connector, a new Wi-Fi network will\
    \ appear:\n\n![](images/00201.gif)\n\n        Connect to the WiFi network:\n\n\
    Password: MaMe82-P4wnP1\n\nYou can now surf to the control panel interface or\
    \ SSH into the Pi to get to the Kali Linux operating system.  \n\n        For\
    \ the Web Control interface, open a web browser and surf to: [http://172.24.0.1:8000](http://172.24.0.1:8000)\n\
    \n![](images/00202.jpeg)\n\nOr just Putty or SSH into 172.24.0.1 to access the\
    \ underlying Kali Linux OS:\n\n![](images/00203.gif)\n\nThe Kali Linux used in\
    \ Pw4nP1 is the same Kali Linux that you would get with a regular Kali for the\
    \ Pi install. It comes, like the original, with a fairly bare bones install –\
    \ the top 10 tools install. So, you have Wireshark, nmap, Metasploit and such.\
    \ If you want the additional tools, you need to install the Kali Metapackages\
    \ mentioned in the earlier Kali for the Pi chapter.  You can also install individual\
    \ tools with apt install. Remember though that the Pi Zero W doesn’t have the\
    \ horsepower as the Pi 3b+, so I would be selective.\n\n#### 2.  Connecting via\
    \ USB RNDIS\n\nI use the Wi-Fi connect exclusively for control, but you can also\
    \ connect to the Pi via USB RNDIS. If you plug the device into your host system\
    \ using the inside (middle) USB connector, you can access the device as a USB\
    \ Ethernet device. This is the same way you would connect the P4wnP1 to a target\
    \ system. A new “Ethernet” adapter will appear on your system. You will be able\
    \ to control the device via Putty, SSH, or through the Web control panel interface.\
    \ The IP address will be different, it will now be 172.16.0.1 for the SSH interface\
    \ and 172.16.0.1:8000 for the http control panel. \n\nA new Ethernet Adapter will\
    \ appear on your host system:\n\n![](images/00204.gif)\n\nConnecting with SSH:\n\
    \n![](images/00205.jpeg)\n\nConnecting to the HTML Control Panel:\n\n![](images/00206.jpeg)\n\
    \nYou can then change any settings that you want.\n\n##### 3.   Connecting via\
    \ Bluetooth\n\nLastly, we could also connect to P4wnP1 via Bluetooth PAN. WiFi\
    \ is my preferred method, USB works fine, but Bluetooth can be temperamental and\
    \ I have had some communication errors trying to use Bluetooth since the latest\
    \ Kali update. If you want to give it a try:\n\n        On your Windows system,\
    \ turn Bluetooth on\n\n        In Windows, right click on the Bluetooth icon\
    \ on the lower right side of the screen and select, “Join a Personal Area Network”.\
    \ If it does not show up, search for the device. \n\n![](images/00207.jpeg)\n\n\
            Click on MAME82-P4WNP1 and click, “next”. \n\n        Enter the PIN,\
    \ “1337”\n\n        The device should now show up, right click on P4wnP1 and\
    \ click, “use as access point”:\n\n![](images/00208.jpeg)\n\nYou will now be connected\
    \ to the P4wnP1 via Bluetooth. If you open a command prompt and run “ipconfig”,\
    \ you can see that you are indeed connected to the device as an AP, and you have\
    \ an IP address on the device:\n\n![](images/00209.jpeg)\n\nYou can now connect\
    \ to the device using SSH or Putty (172.26.0.1), or use the HTTP control panel\
    \ interface (172.26.0.1:8000). If it doesn’t connect, you may need to go into\
    \ the HTTP control panel, turn off Bluetooth and turn it back on again. It is\
    \ done on the fly, no need to reboot the Pi, as soon as it is switched off, it\
    \ is disabled, switch it back on and it is re-enabled. Again, pick one of the\
    \ three ways to communicate with the Pi - WiFi, USB or Bluetooth. I use Wi-Fi\
    \ connect exclusively throughout this chapter. \n\n### P4wnP1 Control Panel Interface\n\
    \nNow that we have covered several ways to connect to the P4wnP1, let’s take a\
    \ look at the P4wnP1 Web Control Panel. This is where all the configuration and\
    \ control for the tool takes place. As previously mentioned, the web interface\
    \ is a “live” interface, when you make changes the changes are effective immediately\
    \ on the device. The tool creator has done an amazing job with the interface.\
    \ I was messing around with a lot of different configurations and put the device\
    \ in an unstable state. Any other HID type tool would have most likely needed\
    \ to be unplugged, brought back to the host system and re-configured. I was able\
    \ to re-deploy default settings to the device, while it was connected to a target\
    \ system, and I was back in business! \n\nLet’s take a look at the Main Menu items:\n\
    \n#####  \n\n##### P4wnP1 Control Panel\n\n![](images/00210.jpeg)\n\nOn the Main\
    \ Control Panel interface, you have the main option buttons across the top and\
    \ changeable settings in the window below. \n\n##### Connection Settings\n\n![](images/00211.jpeg)\n\
    \nStarting at the top, the left 4 menu buttons are for configuring the different\
    \ connection types. You can change the WiFi name & channel, change the Bluetooth\
    \ to High speed or Low Energy, setup the DHCP range, etc.\n\n##### Trigger Actions\n\
    \n![](images/00212.jpeg)\n\nTrigger actions are a major part of the new P4wnP1\
    \ version. They really add a lot of intelligent scripting to the tool. There are\
    \ several pre-existing scripts that tell P4wnP1 how to behave when it is connected\
    \ to the target:\n\n![](images/00213.jpeg)\n\nWhen you get used to using the tool,\
    \ you can bring it to the next level by adding your own Trigger Actions. You can\
    \ trigger off of any of the following events:\n\n  ![](images/00214.jpeg)\n\n\
    And perform any of the following actions:\n\n![](images/00215.jpeg)"
