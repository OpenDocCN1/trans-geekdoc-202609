    I highly recommend that you have or purchase at least a 5 pack of Raspberry Pi
    compatible microSD memory cards. We will be installing multiple operating systems
    and using multiple tools that modify the underlying operating system, so for best
    results, it is good to use a separate memory card for many of the chapters. You
    may also want a couple 32GB cards, optional, but for some of the full tool option
    installs, a 16GB card just is not big enough.


    ### Highly Recommended


    - 5 pack RPi compatible memory cards (SanDisk 16GB MicroSD HC Ultra Class 10 or
    better)


    You may need an adapter to use the microSD card in your desktop PC:


    ![](images/00004.jpeg)


    You will also need:


    - A Raspberry Pi Zero W

    - A Raspberry Pi 3b+ or Pi 4

    - A Raspberry Pi 3b (Somewhat optional - Just really needed for the RasPwn chapter)

    - Raspberry Pi v2 8 MP Camera with Pi Zero W cable or a Pi3/4 cable

    - Raspberry Pi case (Many to choose from)

    - Raspberry Pi power adapters

    - Peripheral devices for the Pi – Video display, keyboard, mouse, connector cables

    - Desktop computer with a microSD card writer – A Windows based system is preferred

    - One USB WiFi adapter – I use a TL-WN722N (v1) and an Alfa AWUS036NHA interchangeably


    We will also be running a couple Virtual Machines on the Desktop computer, including
    VMWare & VirtualBox. A modern system with at least 8GB of Ram as a minimum requirement.


    Optionally, you may want:


    - A couple 32GB memory cards for full tool install options

    - Raspberry Pi Night Vision Camera

    - Pi Battery

    - Raspberry Pi cases like the ZeroView and 7” Raspberry Pi 3 Touchscreen case
    (Shown in some examples, not necessary, but great cases!)


    Note: The camera cable is different if you are using a Pi Zero W or a Pi 3/4 series.
    Make sure you get the correct cable for your version of Pi.


    There are so many options to choose from with RPi! Many different style cases,
    accessories and adapters. Here is a look at some of the hardware used in creating
    this book:


    ![](images/00005.jpeg)


    ### Raspberry Pi Kits


    If you are new to Raspberry Pis, one of the best ways to start off is using a
    Kit. Normally when you purchase a Raspberry Pi, you just get the computer board.
    A kit can provide (depending on the kit) a memory card, case, power supply, heat
    sinks, and possibly connector cables. You have to look at the kit contents carefully,
    sometimes they come without a RPi! When I buy a new RPi, I usually get a kit that
    includes the board, power supply, heat sinks, and purchase a case that has a fan.


    Raspberry Pi 3B+ & 4 Kits – There are a lot of Raspberry Pi kits available. I
    have tried several kits from different manufacturers and have never had a problem,
    though I do prefer Cana Kits and Adafruit kits.


    For the Sticky Kali Pi chapter I used an Adafruit Pi-Hole kit – this includes
    a 2.8″ PiTFT display and a Pi 3b (`https://blog.adafruit.com/2018/10/11/new-product-ad-blocking-kit-for-pi-hole-with-2-8-pitft-no-soldering/`).


    ![](images/00006.jpeg)


    Raspberry Pi Zero W Kits – If you have never owned an RPI Zero W before, I recommend
    purchasing a kit that has video & USB adapters, as this Pi uses a micro display
    connecter and Micro USB C type connectors. You may also want a powered USB hub
    to connect multiple USB devices to your Pi 0W, but it is not necessary. I used
    an Adafruit Pi Zero W Camera kit1 that included the Pi Zero W, the Pi Camera v2
    (8 Megapixels), and a case. The Vilros Pi Zero W Complete Starter Kit2 is nice
    too because it includes necessary connector adapters and cables, but it does not
    include a camera.


    ### Ethical Hacking Issues


    In Ethical Hacking & Pentesting, a security tester basically acts like a hacker.
    They use tools and techniques that a hacker would most likely use to test a target
    network’s security. The difference being they are hired by the company to test
    security and when done reveal to the leadership team how they got in and what
    they can do to plug the holes. The biggest issue I see in using these techniques
    is ethics and law. Some security testing techniques covered in this book are actually
    illegal to do in some areas. So, it is important that users check their Local,
    State and Federal laws before using the information in this book.


    Also, you may have some users that try to use Kali Linux or other Ethical Hacking
    tools on a network that they do not have permission to do so. Or they will try
    to use a technique they learned, but may have not mastered on a production network.
    All of these are potential legal and ethical issues. Never run security tools
    against systems that you do not have express written permission to do so. In addition,
    it is always best to run tests that could modify data or possibly cause system
    instability on an offline, non-production replica of the network, and analyzing
    the results, before ever attempting to use them on live systems.


    ### Disclaimer


    Never try to gain access to a computer you do not own, or security test a network
    or computer when you do not have written permission to do so. Doing so could leave
    you facing legal prosecution and you could end up in jail.


    The information in this book is for educational purposes only.

