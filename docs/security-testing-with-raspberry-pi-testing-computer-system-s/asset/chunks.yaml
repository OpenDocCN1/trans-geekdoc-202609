- raw: "In this chapter we are going to look at three scanning tools that can be used\
    \ on the Raspberry Pi. Of course, you could use Nmap for scanning, and I cover\
    \ this extensively in my other books. Nmap works exactly the same on the Pi, so\
    \ I will not be covering that in this book. The first two tools we will cover\
    \ can be run on Raspbian with the PTF toolkit installed or on a Kali Pi install.\
    \ You can use these tools with one of the earlier Operating System installs if\
    \ you wish. Though, I highly recommend that WarBerryPi be installed on a fresh\
    \ copy of Raspbian.  \n\nAnother tool that is mentioned in OSCP exam preps is\
