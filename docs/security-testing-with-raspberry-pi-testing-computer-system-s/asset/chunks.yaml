- raw: "        Then click, “Player”, “File”, “Open”\n\n        Navigate to the\
    \ ‘Metasploitable.vmx’ file, select it and click, “Open”\n\n![](images/00021.jpeg)\n\
    \nIt will now show up in the VMware Player Menu.\n\n3.   Now go to “Edit Virtual\
    \ Machine Settings” for Metasploitable and make sure the network interface is\
    \ set to “Bridged” (or NAT if you prefer, just make sure all VMs are set the same).\n\
    \n![](images/00022.jpeg)\n\nMetasploitable 2 is now ready to use.\n\n![](images/00023.gif)\n\
    \nGo ahead and start the Metasploitable system, click “I copied it” if you are\
    \ asked if you moved or copied it. You should now see the Metasploitable Desktop:\n\
    \n![](images/00024.gif)\n\n4.   Login - Notice admin login credentials listed\
    \ above the login prompt - Yeah security! \n\nLogin name: msfadmin\n\nPassword:\
    \ msfadmin\n\nTo get out of this VM window and get mouse control back, just hit\
    \ “Ctrl-Alt”.\n\n### Set Metasploitable 2’s IP Address\n\nBy default, Metasploitable\
    \ 2’s address is set as “Dynamic”. To set it to a Static IP edit the “/etc/network/interfaces”\
    \ file and manually set the IP address, netmask and Gateway (these numbers may\
    \ be different on your network). I used the IP address of 172.24.1.218.\n\n       \
    \ In Metasploitable2 navigate to the network directory, “cd /etc/network”\n\n\
            Enter, “sudo nano interfaces”\n\n        Change the iface eth0 inet\
    \ dynamic line, replace “dynamic” with “static”\n\nThen enter an IP address, netmask,\
    \ and your router gateway. It should look something like the screenshot below:\n\
    \n![](images/00025.gif)\n\n        When finished, hit “ctrl-x”, “y”, and then\
    \ hit “enter”\n\n        Type in “cat interfaces” to verify your changes:\n\n\
    ![](images/00026.gif)\n\n        Type “sudo reboot” to reboot Metasploitable2\n\
    \nWe now have our Metasploitable2 and Kali systems setup and ready to use. To\
    \ verify that Kali and Metasploitable2 can see each other, use the ping command.\n\
    \nIn a Kali Terminal, ping the Metasploitable2 VM\n\n*   Enter “ping \\[Metasploitable\
    \ IP Address\\]” so, in my case it would be, “ping 172.24.1.218”\n\n*   Hit “Ctrl-c”\
    \ to stop\n\n![](images/00027.jpeg)\n\nAnd in Metasploitable2, ping the Kali VM:\n\
    \n![](images/00028.gif)\n\nIf you see “64 bytes from …” in both responses then\
    \ you can be assured that everything is setup and they can see each other and\
    \ communicate correctly. Press “Ctrl-Alt” to get out of the Metasploitable2 VM.\
    \ \n\n#### Metasploitable 3 Setup (Optional - Advanced)\n\nI use Metasploitable\
    \ 3 as some of the attack targets in this book. Unlike MS2, MS3 is a Windows Server\
    \ based target. I like it as it offers a completely different set of services\
    \ to attack. It also includes a “Capture the Flag” type game. “Playing cards”\
    \ using pictures of the developers are scattered throughout the file system and\
    \ are accessible by exploiting vulnerable services. I list this as optional, because\
    \ I recommend only more advanced users attempt the MS3 install. Originally you\
    \ had to manually build MS3, and there were a lot of install issues. You can now\
    \ get a “pre-installed” version, but you still need to “build” it, it’s not a\
    \ download and go VM like MS2.   \n\nThe Windows Server included in the build\
    \ is also time bombed, so it will ask for a license after so many days of use.\
    \ MS3 now comes somewhat pre-configured, but can still be a little tricky to set\
    \ up and still has the time bomb issue, so, I leave installing and using this\
    \ up to the reader. Those who don’t want to try the install can just read through\
    \ the tutorials parts that include MS3. \n\nMS3 also seems to run better in VirtualBox.\
    \ So, I installed VirtualBox on the same host that runs VMWare Player. All you\
    \ need to do is set the MS3 image to use Bridged networking, and give it an address\
    \ in the same network range as your VMWare virtual machines and they will communicate\
    \ just fine.\n\n        Download and install VirtualBox: \n\n[https://www.virtualbox.org/](https://www.virtualbox.org/)\n\
    \n        Metasploitable 3 Quick Start and Full Manual install instructions can\
    \ be found at:\n\n[https://github.com/rapid7/metasploitable3](https://github.com/rapid7/metasploitable3)\n\
    \nOnce the MS3 image is built, and added in VirtualBox, open the network settings\
    \ for the VM in VirtualBox and set the network adapters to “Bridged”:\n\n![](images/00029.jpeg)\n\
    \nStartup MS3, login (User & Password = vagrant), and then you can then set the\
    \ IP addresses for MS3 for your network range in the Windows network settings.\
    \ \n\n#### VM Install Wrap Up\n\nSo far in this section we covered how to install\
    \ VMWare Player as a virtual machine host. We then looked at installed Kali Linux\
    \ & Metasploitable 2. We also talked about optionally running Metasploitable 3\
    \ in VirtualBox on the same Windows host. We set them all up to use the same networking\
    \ so that they can communicate with each other and out to the internet if needed\
    \ (for Kali updates). We will use this setup throughout the rest of the book.\
    \ Just as a reminder, if you set up your own virtual host and are using DHCP,\
    \ the IP addresses of the systems may change when rebooted. If you are not sure\
    \ what your dynamically assigned address is you can run “ifconfig” (Linux) or\
    \ “ipconfig” (Windows) in the VM to find the IP address. \n\n### Raspberry Pi\
    \ Installation Notes\n\nEach chapter will cover what Raspberry Pi is used and\
    \ what OS installation is recommended for it. As mentioned, we will cover a lot\
    \ of different RPi setups in the book. I just wanted to cover a couple points\
    \ before we start to play with the Pis. These are just install notes, you don’t\
    \ need to install any Pi software yet.\n\nRaspberry Pi OS installs usually involve:\n\
    \n        Downloading the RPi OS image from the internet to a Desktop system\n\
    \n        Extracting & Writing the image to a MicroSD Card \n\nI use balenaEtcher\
    \ to write the Raspberry Pi images, it works fantastic:\n\n([https://www.balena.io/etcher/](https://www.balena.io/etcher/))\n\
    \n        Connect all the peripherals into the Pi\n\n        Carefully insert\
    \ the memory card, and finally plug power into the Pi\n\nWARNING: It’s important\
    \ to connect everything to the Pi before plugging power into it. The Pi will power\
    \ on as soon as power is applied. On a Pi0W you apply the power source to the\
    \ USB port on the outside edge, not the inner one.\n\n### How to Install Raspbian\n\
    \nLet’s quickly walk through installing Raspbian on a Pi. The install will be\
    \ similar for other Raspberry Pi operating system images. Again, this is just\
    \ for information, you do not need to actually install the OS now, we will do\
    \ that for the individual chapters. But if you haven’t installed Raspbian before,\
    \ it would be good practice to perform the install. You can always write over\
    \ the memory card later, when needed. \n\nFrom the Raspbian download page:\n\n\
    [https://www.raspberrypi.org/downloads/raspbian/](https://www.raspberrypi.org/downloads/raspbian/)\n\
    \nPick the Raspbian version that you need to use:\n\n![](images/00030.jpeg)\n\n\
    We will mostly be using the Raspbian Buster with Desktop or the Raspbian Buster\
    \ Lite, depending on the needs of the chapter. It is always good to verify the\
    \ download’s SHA-256 hash. If you download the Torrent version with qBittorent\
    \ it will automatically verify the hash. This guarantees that you get a non-modified\
    \ version of the file. \n\nOnce the file is downloaded, simply insert your MicroSD\
    \ Memory card into your desktop computer’s MicroSD interface. The memory card\
    \ will show up as a removable drive in Windows:\n\n![](images/00031.jpeg)\n\n\
    Now, just write the image to the drive. I use balenaEtcher (Etcher) for writing\
    \ Pi images, it is very easy to use and does a terrific job. If the download image\
    \ is compressed, most of the Pi Images are .zip or .7z, you may want to decompress\
    \ it first. Etcher can do this on the fly, but it is a lot slower.\n\n       \
    \ Download ([https://www.balena.io/etcher/](https://www.balena.io/etcher/)), install\
    \ and run Etcher\n\n        Select your download image, make sure the drive is\
    \ the correct one and click “Flash!”\n\n![](images/00032.jpeg)\n\nEtcher will\
    \ then write the image to the memory card:\n\n![](images/00033.jpeg)"
  fmt: '

    - Then click, “Player”, “File”, “Open”

    - Navigate to the `Metasploitable.vmx` file, select it and click, “Open”


    ![](images/00021.jpeg)


    It will now show up in the VMware Player Menu.


    3. Now go to “Edit Virtual Machine Settings” for Metasploitable and make sure
    the network interface is set to “Bridged” (or NAT if you prefer, just make sure
    all VMs are set the same).


    ![](images/00022.jpeg)


    Metasploitable 2 is now ready to use.


    ![](images/00023.gif)


    Go ahead and start the Metasploitable system, click “I copied it” if you are asked
    if you moved or copied it. You should now see the Metasploitable Desktop:


    ![](images/00024.gif)


    4. Login - Notice admin login credentials listed above the login prompt - Yeah
    security!


    Login name: `msfadmin`


    Password: `msfadmin`


    To get out of this VM window and get mouse control back, just hit `Ctrl-Alt`.


    ### Set Metasploitable 2’s IP Address


    By default, Metasploitable 2’s address is set as “Dynamic”. To set it to a Static
    IP edit the `/etc/network/interfaces` file and manually set the IP address, netmask
    and Gateway (these numbers may be different on your network). I used the IP address
    of `172.24.1.218`.


    - In Metasploitable2 navigate to the network directory, `cd /etc/network`

    - Enter, `sudo nano interfaces`

    - Change the `iface eth0 inet dynamic` line, replace “dynamic” with “static”


    Then enter an IP address, netmask, and your router gateway. It should look something
    like the screenshot below:


    ![](images/00025.gif)


    - When finished, hit `ctrl-x`, `y`, and then hit `enter`

    - Type in `cat interfaces` to verify your changes:


    ![](images/00026.gif)

    - Type `sudo reboot` to reboot Metasploitable2


    We now have our Metasploitable2 and Kali systems setup and ready to use. To verify
    that Kali and Metasploitable2 can see each other, use the `ping` command.


    In a Kali Terminal, ping the Metasploitable2 VM


    - Enter `ping [Metasploitable IP Address]` so, in my case it would be, `ping 172.24.1.218`

    - Hit `Ctrl-c` to stop


    ![](images/00027.jpeg)


    And in Metasploitable2, ping the Kali VM:


    ![](images/00028.gif)


    If you see “64 bytes from …” in both responses then you can be assured that everything
    is setup and they can see each other and communicate correctly. Press `Ctrl-Alt`
    to get out of the Metasploitable2 VM.


    ### Metasploitable 3 Setup (Optional - Advanced)


    I use Metasploitable 3 as some of attack targets in this book. Unlike MS2, MS3
    is a Windows based target. I like it as it offers a completely different set of
    services to attack. It also includes “Capture the Flag” type game. Using pictures
    of the developers are scattered throughout the file system are accessible by exploiting
    services. I list this as optional, because I recommend only advanced users attempt
    the MS3 install. Originally you had to manually build MS3, and there were lot
    of install issues. You can now get a “pre-installed” version, but you still need
    to “build” it, like MS2. MS3 also seems to run better in VirtualBox. So, I installed
    VirtualBox on the same host that runs VMWare. All you need to do is set the MS3
    image to use Bridged networking, and give it an address in the same network as
    your VMWare virtual machines they will communicate just fine.


    - Download and install VirtualBox: [https://www.virtualbox.org/](https://www.virtualbox.org/)

    - Metasploitable 3 Quick Start and Full Manual instructions can be found at: [https://github.com/rapid7/metasploitable3](https://github.com/rapid7/metasploitable3)


    Once the MS3 image is built, and added in VirtualBox, open the network settings
    for the VM in VirtualBox and set the network adapters to “Bridged”:


    ![](images/00029.jpeg)


    Startup MS3, login (User & Password = `vagrant`), and then you can set the IP
    addresses for MS3 for your network in the Windows settings.


    ### VM Install Wrap Up


    So far in this section we covered how to install VMWare Player as a virtual machine
    host. We then looked at Kali Linux & Metasploitable 2. We also talked about optionally
    running Metasploitable 3 in VirtualBox on the same Windows host. We set them all
    up to use the same networking so that they can communicate with each other and
    out to the internet (for Kali updates). We will use this setup throughout the
    rest of the book. Just as a reminder, if you set up your own host and are using
    DHCP, the IP addresses of the systems may change when rebooted. If you are not
    sure what your dynamically assigned address is you can run `ifconfig` (Linux)
    or `ipconfig` (Windows) in the VM to find it.


    ### Raspberry Pi Installation Notes


    Each chapter will cover what Raspberry Pi is used and what OS installation is
    recommended for it. As mentioned, we will cover a lot of different RPi setups
    in the book. I just wanted to cover a couple points before we start to play with
    the Pis. These are just install notes, you don’t need to install any Pi software
    yet.


    Raspberry Pi OS installs usually involve:


    - Downloading the RPi OS image from the internet to a Desktop system

    - Extracting & Writing the image to a MicroSD Card


    I use `balenaEt` to write the Raspberry Pi images, it works fantastic ([https://www.balena.io/etcher/](https://www.balena.io/etcher/)).


    - Connect all the peripherals into the Pi

    - Carefully insert the memory card, and finally plug power into the Pi


    WARNING: It’s important to connect everything to the Pi before plugging power
    into it. The Pi will power on as soon as power is applied. On a Pi0W you apply
    the power source to the USB port on the outside edge, not the inner one.


    ### How to Install Raspbian


    Let’s quickly walk through installing Raspbian on a Pi. The install will be similar
    for other Raspberry Pi operating system images. Again, this is just for information,
    you do not need to actually install the OS now, we will do that for the individual
    chapters. But if you haven’t installed Raspbian before, it would be good practice
    to perform the install. You can always write over the memory card later, when
    needed.


    From the Raspbian download page: [https://www.raspberrypi.org/downloads/raspbian/](https://www.raspberrypi.org/downloads/raspbian/)


    Pick the Raspbian version that you need to use:


    ![](images/00030.jpeg)


    We will mostly be using the Raspbian Buster with Desktop or the Raspbian Buster
    Lite, depending on the needs of the chapter. It is always good to verify the download’s
    SHA-256 hash. If you download the Torrent version with `qBittorent` it will automatically
    verify the hash. This guarantees that you get a non-modified version of the file.


    Once the file is downloaded, simply insert your MicroSD Memory card into your
    desktop computer’s MicroSD interface. The memory card will show up as a removable
    drive in Windows:


    ![](images/00031.jpeg)


    Now, just write the image to the drive. I use `balenaEtcher` (Etcher) for writing
    Pi images, it is very easy to use and does a terrific job. If the download image
    is compressed, most of the Pi Images are .zip or .7z, you may want to decompress
    it first. Etcher can do this on the fly, but it is a lot slower.


    - Download `balenaEtcher`, install and run Etcher

    - Select your download image, make sure the drive is the correct one and click
    “Flash!”


    ![](images/00032.jpeg)


    Etcher will then write the image to the memory card:


    ![](images/00033.jpeg)

