    \n        Nginx (192.168.99.7) - Web Server\n\n        MySQL Server (127.0.0.1)\
    \ - Database Server\n\n        OpenSSH (92.168.99.1) - SSH server\n\nOut of Date\
    \ Web Apps Include:\n\n        Drupal 7.34 (192.168.99.13/drupal-7.34/)\n\n       \
    \ Joomla 3.4.0 (192.168.99.13/joomla-3/)\n\n        osCommerce 2.3 (192.168.99.13/oscommerce/)\n\
    \n        WordPress 4.1 (192.168.99.13/wordpress4)\n\n        And several more!\n\
    \nVulnerable Web App Training Applications Include:\n\n        OWASP Bricks (192.168.99.13/bricks)\n\
    \n        Damn Vulnerable Web Application DVWA (192.168.99.13/dvwa)\n\n       \
    \ OWASP Hackademic (192.168.99.13/hackademic)\n\n        OWASP Mutillidae II\
    \ (192.168.99.13/mutillidae)\n\n        Peruggia (192.168.99.13/peruggia)\n\n\
            WackoPicko \n\n        WebGoat \n\nSo many targets! Many pentesting\
    \ images only include a handful of these features. This is an amazing collection\
    \ and offers a lot of possibilities in training. There is no way we could possible\
    \ cover all of these in this book, so we will only quickly look at a couple things.\
    \ See my Basic & Intermediate Security Testing with Kali Linux books for extensive\
    \ information on attacking several of these services & apps. \n\n### Scanning\
    \ RasPwn’s Vulnerable Services and Web Apps\n\nLet’s take a look at some of the\
    \ running services. A quick nmap scan will give you an overview of the target\
    \ environment.\n\nIn a Kali Linux Terminal, enter:\n\n        nmap 192.168.99.0/24\n\
    \nThis will locate all of RasPwn’s individual “systems” by IP address and list\
    \ open tcp ports.\n\nAs seen below: \n\nroot@kali:~# nmap 192.168.99.0/24\n\n\
    PORT     STATE SERVICE\n\n22/tcp   open  ssh\n\n53/tcp   open  domain\n\n139/tcp \
    \ open  netbios-ssn\n\n445/tcp  open  microsoft-ds\n\n901/tcp  open  samba-swat\n\
    \n5001/tcp open  commplex-link\n\n8080/tcp open  http-proxy\n\nNmap scan report\
    \ for nginx.playground.raspwn.org (192.168.99.7)\n\nPORT     STATE SERVICE\n\n\
    22/tcp   open  ssh\n\n139/tcp  open  netbios-ssn\n\n445/tcp  open  microsoft-ds\n\
    \n901/tcp  open  samba-swat\n\n5001/tcp open  commplex-link\n\n8080/tcp open \
    \ http-proxy\n\nNmap scan report for 192.168.99.10\n\nPORT     STATE SERVICE\n\
    \n22/tcp   open  ssh\n\n53/tcp   open  domain\n\n80/tcp   open  http\n\n139/tcp \
    \ open  netbios-ssn\n\n445/tcp  open  microsoft-ds\n\n901/tcp  open  samba-swat\n\
    \n5001/tcp open  commplex-link\n\n8080/tcp open  http-proxy\n\nNmap scan report\
    \ for playground.raspwn.org (192.168.99.13)\n\nPORT     STATE SERVICE\n\n22/tcp  \
    \ open  ssh\n\n80/tcp   open  http\n\n139/tcp  open  netbios-ssn\n\n443/tcp  open \
    \ https\n\n445/tcp  open  microsoft-ds\n\n901/tcp  open  samba-swat\n\n5001/tcp\
    \ open  commplex-link\n\n8080/tcp open  http-proxy\n\nNmap scan report for mail.playground.raspwn.org\
    \ (192.168.99.18)\n\nPORT     STATE SERVICE\n\n22/tcp   open  ssh\n\n25/tcp  \
    \ open  smtp\n\n139/tcp  open  netbios-ssn\n\n143/tcp  open  imap\n\n443/tcp \
    \ open  https\n\n445/tcp  open  microsoft-ds\n\n587/tcp  open  submission\n\n\
    901/tcp  open  samba-swat\n\n993/tcp  open  imaps\n\n5001/tcp open  commplex-link\n\
    \n8080/tcp open  http-proxy\n\nNmap scan report for 192.168.99.104\n\nAll 1000\
    \ scanned ports on 192.168.99.104 are closed\n\nFrom Nmap, we can see that there\
    \ are many ports and services running on several IP addresses. Now that we have\
    \ a basic view of the target, let’s scan RasPwn with a WebApp testing program.\
    \ I picked OWASP-Nettacker as it works well and isn’t very well know. \n\n###\
    \ OWASP-Nettacker\n\n![](images/00170.jpeg)\n\nTool GitHub Site: [https://github.com/zdresearch/OWASP-Nettacker](https://github.com/zdresearch/OWASP-Nettacker)\n\
    \nTool Wiki: [https://github.com/zdresearch/OWASP-Nettacker/wiki](https://github.com/zdresearch/OWASP-Nettacker/wiki)\n\
    \nOWASP-Nettacker is a multi-purpose web application scanning tool. It performs\
    \ target recon, information gathering and vulnerability assessment. If you provide\
    \ usernames and passwords, it will also perform brute force attacks.\n\nInstallation\
    \ instructions can be found here:\n\n[https://github.com/zdresearch/OWASP-Nettacker/wiki/Installation](https://github.com/zdresearch/OWASP-Nettacker/wiki/Installation)\n\
    \nBasically, from a Kali Terminal prompt, enter:\n\n        git clone https://github.com/zdresearch/OWASP-Nettacker.git\n\
    \n        cd OWASP-Nettacker\n\n        pip install -r requirements.txt\n\n\
            python setup.py install\n\nTo start the program in Wizard mode:\n\n       \
    \ Enter, “python ./nettacker.py --wizard”\n\n        Enter the IP address of\
    \ the target, “192.168.99.13”\n\n        Take the defaults for the thread number\
    \ questions\n\n        Enter an output filename\n\n        For “scan methods”,\
    \ enter “all”\n\n![](images/00171.jpeg)\n\n        Hit “enter” at scans to exclude\n\
    \n        For now, hit “enter” to bypass names and passwords, but you could enter\
    \ some here if you wish\n\n        Hit “enter” to accept the default answers\
    \ for the rest of the prompts\n\nNettacker then begins scanning and enumerate\
    \ the target:\n\n![](images/00172.jpeg)\n\nTarget information and vulnerabilities\
    \ are listed as they are found. When the tool is finished it presents a summary\
    \ report table:\n\n![](images/00173.gif)\n\nThe report is saved in the target\
    \ file and in the tool database. We could add username and passwords and have\
    \ Nettacker attempt brute force attacks. The report mentions WordPress vulnerabilities.\
    \ Let’s see if we can find out more information about the apps running on this\
    \ server using Sn1per. \n\n### Scanning RasPwn with Sn1per\n\nTool Author: @xer0dayz\n\
    \nTool Website: [https://xerosecurity.com/wordpress/](https://xerosecurity.com/wordpress/)\n\
    \nTool GitHub: [https://github.com/1N3/Sn1per](https://github.com/1N3/Sn1per)\n\
    \nWe have used Sn1per before, we will use it again here. This time we will cover\
    \ a couple different command switches to have it check for web services. But first,\
    \ let’s run a basic scan with brute force option against the 192.168.99.13 address:\n\
    \n        sniper -t 192.168.99.13 -b\n\n![](images/00174.jpeg)\n\nTake a moment\
    \ and read through the report. Next, let’s use the “web” scan switch to perform\
    \ a web analysis scan on the same target, to see if we get more information:\n\
    \n        Sniper -t 192.168.99.13 --mode web\n\n![](images/00175.jpeg)\n\nThis\
    \ starts multiple scanning programs. Notice that different tools are being used\
    \ in the web scan. Results are displayed as it proceeds. \n\n![](images/00176.jpeg)\n\
    \nThe directory brute forcing will take a long time, so you can use “Ctrl-c” to\
    \ exit if you want. But Look through the earlier parts of the report, the scanning\
    \ tools find multiple web applications running on the server.\n\nAs seen below:\n\
    \n![](images/00177.jpeg)\n\nThis includes:\n\n        http://192.168.99.13/wordpress3\n\
    \n        http://192.168.99.13/wordpress4\n\n        http://192.168.99.13/joomla-2\n\
    \n        http://192.168.99.13/joomla-3\n\nWe will scan these apps with specific\
    \ scanning tools in a moment. But let’s briefly look at one last scanning mode\
    \ in sn1per, “webscan”. Webscan will take a deep look into a web app to find vulnerabilities.\
    \ If you want, you can scan any of the individual testing tool directories, I\
    \ chose “Mutillidae”:\n\n        Sniper -t 192.168.99.13/Mutillidae --mode webscan\n\
    \n![](images/00178.jpeg)"
