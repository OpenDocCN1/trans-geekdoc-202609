    # Chapter 7


    ## Re4son’s DV-Pi


    ![](images/00159.jpeg)


    Tool Creator: Re4son


    Tool Website: [https://whitedome.com.au/re4son/sticky-fingers-dv-pi/](https://whitedome.com.au/re4son/sticky-fingers-dv-pi/)


    Another great Raspberry Pi based tool created by Re4son is “Damn Vulnerable Pi”.
    DV-Pi is a purposefully vulnerable RPi image that you can use in your test lab
    for hacking practice. The DV-Pi service runs on top of a Raspbian image, and you
    can turn the vulnerable service on or off from the touch interface or from the
    command line. DV-Pi comes in two options, DV-Pi 2 and DV-Pi 3. We will be using
    the easier DVD-Pi 3. Even though this is marked as “easier”, it is not an easy
    exploit for those new to the field. You need to know several tools, and have a
    knowledge of how webservers work and basic webserver exploitation techniques.
    So, don’t be upset if you can’t get this right away, more than an entry level
    skill is required.


    WARNING: Never attach DV-Pi directly to a live internet connection, always use
    it in a test lab or behind a firewall to prevent external access as it is vulnerable!
    Turn the vulnerable service off when not in use.


    According to the documentation, each image comes with one vulnerability to get
    in and one vulnerability to get root. Each image has two proof.txt files with
    a hash to prove successful compromise:


    `/proof.txt`


    `/root/proof.txt`


    The DV-Pi downloads work on Raspberry Pi 0/0W/1/2/3/3B+, I will be using a 3B+
    with TFT screen in this chapter.


    ### DV-Pi Installation


    Full install instructions are located on the tool website:


    [https://whitedome.com.au/re4son/download/sticky-fingers-dv-pi-3/#](https://whitedome.com.au/re4son/download/sticky-fingers-dv-pi-3/)


    Read and follow them, as they may change over time. The current steps are replicated
    here:


    - Download & extract the `.xy` image (7zip)

    - Write it to a memory card, `Etcher` works great

    - Attach peripherals, insert the memory card, apply power

    - SSH into the Pi


    Username: `pi`


    Password: `raspberry`


    As seen below:


    ![](images/00160.jpeg)


    If you have a touchscreen interface, use the following steps to set it up, if
    not skip ahead to the “exploiting” section.


    - `cd /usr/local/src/re4son-kernel\_4\*`

    - `sudo mount /dev/mmcblk0p1 /boot`

    - `sudo ./re4son-pi-tft-setup -h`


    Read through the help and find the correct switch for the display that you have.
    Mine is an Adafruit 2.8” resistive display, so the correct type for mine would
    be `28r`. Run the setup tool again and specify your display type with the `-t`
    switch:


    - `sudo ./re4son-pi-tft-setup -t 28r`

    - Answer “yes” to display the console on PiTFT display

    - “No” for GPIO to act as an on/off switch

    - Reboot


    You should now have an active TFT display. If you have a 2.8” display, like I
    am using, you need to perform one more step. Set the display for 2.8”, using the
    following command:


    - `cd /home/pi/DV-Pi-Menu`

    - `git checkout 2.8`


    ![](images/00161.jpeg)


    The touch button system acts the same as the Kali-Pi system.


    - Terminal will display the Terminal

    - X-TFT will display the desktop


    The Raspbian X-TFT desktop display is almost unusable on a 2.8” display. The new
    button is “DV-Pi”. This turns the DV-Pi system on or off. You may not want the
    system to always be vulnerable, so the vulnerable services are only started when
    the DV-Pi button is toggled to Red.


    ### Exploiting DV-Pi


    Let’s try scanning DV-Pi with `nmap`. You can use a Kali VM or if you have extra
    Raspberry Pi’s you can use Kali on a Pi and scan DV-Pi using the `nmap` command.
    It doesn’t matter if you are using a VM or Kali Pi, the commands would be the
    exact same. If we scan the DV-Pi system (my IP is 172.24.1.203) with the DV-Pi
    service stopped we will get this:


    ![](images/00162.jpeg)


    Only one port is open, port 22 the SSH service. Now, touch the DV-Pi button to
    enable the vulnerable services. The button should turn Red. If you don’t have
    the touch interface, just SSH in to DV-Pi and type, `dv-pi start`. You can also
    type, `dv-pi status` to see the status of the vulnerable service, or `dv-pi stop`
    to disable the vulnerable service.


    Enable the vulnerable service:


    ![](images/00163.gif)


    Scan the DV-Pi system with `nmap` again:


    ![](images/00164.jpeg)


    We now have a web server running on port 80. Go ahead and surf to your DV-Pi address
    from a web browser. You will now see a copy of the DV-Pi webpage:


    ![](images/00165.jpeg)


    `nmap 172.24.1.203`


    `nmap 172.24.1.203`


    `nmap -A 172.24.1.203`


    `wpscan --url 172.24.1.203 --content-dir`


    `wpscan --url 172.24.1.203 --content-manager aggressive`


    `wpscan --url 172.24.1.203 --plugins`


    `wpscan --url 172.24.1.203 --script=http-vuln-xss`


    `wpscan --url 172.24.1.203 --content-manager`


    `wpscan --url 172.24.1.203 --plugins`


    # Chapter 8


    ## RasPwn OS


    Tool Author: chuck@raspwn.org


    Tool Website: [http://www.raspwn.org/index](http://www.raspwn.org/index)


    RasPwn OS is a pentesting target loaded with multiple web apps and services. It
    is designed to run via Wi-Fi, so you have a self-contained lab, all on RPi. Just
    connect to the RPi and have it!


    ![](images/0168.jpeg)


    Warning: RasPwn is loaded with vulnerabilities, read the RasPwn documentation.
    Do not connect this device to an open internet connection!


    ### Installing RasPwn


    RasPwn will run on a Raspberry Pi 2b or 3b (I could not get it to run on 3b+).
    An 8GB or greater MicroSD card is recommended. The download file and full install
    directions are available on the OS website:


    [http://www.raspwn.org/install](http://www.raspwn.org/install)


    Installation is pretty straight forward. Just download the image, extract it and
    write it to a microSD card. As always, I just used `Etcher` to write the image.
    RasPwn is designed to run headless (without keyboard, mouse, video), but I usually
    attach a monitor for the first boot. Insert the MicroSD card into your Pi and
    power it on. On first time boot it will expand the filesystem to take up the entire
    card and reboot.


    Local (and SSH) login Credentials:


    - User: `pi`

    - Password: `pwnme!`


    ### Pentesting RasPwn


    We will use our Kali Linux VM as our testing platform and RasPwn as our target.
    As you connect to RasPwn over WiFi you need to use an external WiFi adapter and
    enable it in your Virtual Machine.


    With your Kali VM Running:


    - Insert your USB WiFi adapter

    - Click, `Player > Remable Devices >`

    - Find your USB WiFi card and connect to it


    Now in your Kali VM, click the network symbol in the upper right corner of the
    menu.

