- raw: "You can perform basic searches with one page returns for free. For more involved\
    \ searches you will need a Shodan account. I highly recommend a pay account, as\
    \ the service is so worth it. Using Shodan is very simple, just enter your search\
    \ terms just as you would in Google. There are multiple key words that you can\
    \ use to find Raspberry Pi systems online. \n\nHere are a few examples:   \n\n\
    ![](images/00262.jpeg)\n\n![](images/00263.jpeg)\n\nAt the time of this writing,\
    \ there were almost 200,000 online systems running Raspbian. You could also search\
    \ for “Raspberry Pi”, “RaspberryPi” or “RPi”. In the picture above you can see\
    \ 4,455 devices had “Raspberry Pi” somewhere in their description.  You can also\
    \ find them, and many other devices, using application server names, up to and\
    \ including web cam software.\n\nFor example, “MotionEye” which we covered in\
    \ the Physical Security chapter:\n\n![](images/00264.jpeg)\n\nGranted not all\
    \ of the returns will relative, but there is a high chance that many will be running\
    \ on a Raspberry Pi.   \n\n### Automatic Alerts with Shodan Network Monitor\n\n\
    Tool Website: [https://monitor.shodan.io/](https://monitor.shodan.io/)\n\nTool\
    \ Usage Video: [https://www.youtube.com/watch?v=T-9UvZ-l-tE](https://www.youtube.com/watch?v=T-9UvZ-l-tE)\n\
    \nYou can manually scan Shodan yourself and see a representation of all of your\
    \ publicly available business or home systems. But how could you tell if someone,\
    \ like at the JPL labs, hooked up a rogue device to your network. Shodan Network\
    \ Monitor is one solution to this problem. Using the Network Monitor, you can\
    \ configure Shodan to alert you if there are vulnerable systems, open ports or\
    \ changes on your network. There are also network security devices available that\
    \ can be used that perform the same function.\n\n### Normal Security Procedures\
    \ Apply\n\nTreat every Raspberry Pi (and IoT device!) with the same corporate\
    \ security mind you would any normal workstation, laptop or online device.  Don’t\
    \ think that because it is a Raspberry Pi that it’s just a toy, or hackers won’t\
    \ be able to find it, because they will - Possibly very quickly. So, all normal\
    \ security procedures apply. Though no system can be guaranteed to be 100% secure,\
    \ we can make our systems much tougher to compromise by using these techniques.\n\
    \n       Patches & Updates\n\n       Firewalls and Intrusion Prevention Systems\
    \ (IPS)\n\n       Limiting Services & User Authority\n\n       Using Long Complex\
    \ Passwords\n\n       Network Security Monitoring\n\n       Logging\n\n      \
    \ User Education\n\n       Scanning your network \n\n       Finally, using Offensive\
    \ Security\n\nLet’s briefly look at a couple of these topics:\n\n### Patches &\
    \ Updates\n\nAlways use the latest versions of Operating Systems and web server\
    \ apps if it is at all possible. Install critical updates as soon as they become\
    \ available. Hackers are actively targeting IoT devices like Pis, so adding these\
    \ to your update schedule, along with actively watching for critical updates is\
    \ extremely important. \n\n### Private LANs and Firewalls\n\nI recommend you create\
    \ a walled off private IP address play area for your Pi’s. This way, if it is\
    \ compromised, the attacker can’t easily use it to pivot further into your internal\
    \ network. Also, it is best to always have a hardware firewall between your Pi\
    \ and the Internet. As recent as a few years ago, some ISP’s were still giving\
    \ out live internet connections to small offices and home users that had no clue\
    \ that they needed a firewall.  That being said, always use a firewall, do not\
    \ attach any systems to a live internet connection without using one. Firewall\
    \ your incoming internet connection and also make sure that each individual system\
    \ is using a software firewall. Limit open ports to only those absolutely necessary.\
    \ Create an Ingress and Egress Rules policy to monitor or control information\
    \ entering and leaving your network. At the simplest level, block communication\
    \ with nations that you do not do business with. More advanced systems will allow\
    \ you to control what type of data and protocols are allowed to enter and leave\
    \ your network. \n\n### Limit Services & Authority Levels\n\nTurn off network\
    \ services and protocols on servers and systems that are not needed. The less\
    \ attack surface a server has, the better. Never let everyday users use elevated\
    \ security credentials for non-administrative tasks. Heavily restrict user “Root”\
    \ level use. \n\n### Complex Passwords \n\nThis should go without saying, but\
    \ use long complex passwords for any device (and web app) that is directly connected\
    \ to the internet. The longer, and more complex your password is, the longer it\
    \ will take for an attacker to crack it. Use a combination of Upper and Lowercase\
    \ letters, numbers and symbols. Use 2 Factor authentication when applicable. During\
    \ one security assessment, I found that a client used a person’s first name as\
    \ a web application administrator password! The program I used to test the web\
    \ app password was able to brute force it in just a few seconds. None of my online\
    \ personal passwords are shorter than 16 characters, and any device I hook to\
    \ the internet uses much longer ones. Use a different password for each service/\
    \ device (if you can) so that if your Pi is compromised, the attacker will not\
    \ be able to use the creds to gain access to other network systems.\n\n### Network\
    \ Security Monitoring\n\nI am a huge fan of Network Security Monitoring (NSM).\
    \ If you run your own network and don’t know what that is, run out (don’t walk)\
    \ and buy “The Tao of Network Security Monitoring, Beyond Intrusion Detection”,\
    \ by Richard Bejtlich. Basically, NSM is a system of capturing all of your network\
    \ traffic, sometimes at multiple points in your network, and analyzing it for\
    \ intrusions or anomalies. If you think that you can’t afford an NSM system, think\
    \ again. One of the most commonly used one is free! “Security Onion”2, created\
    \ by Doug Burks, is an extremely capable and feature rich NSM that is completely\
    \ free. All you need is a fairly decent computer to run it on, a network tap and\
    \ at least two network cards. \n\nSecurity Onion allows you to capture network\
    \ traffic and then analyzes it for issues and notifies you with alerts in a fairly\
    \ easy to use interface. Below are a couple screenshots of Security Onion in action.\
    \ The first one shows a slew of alerts that are triggered when “Autopwn” was used\
    \ against a system on the network.\n\n![](images/00265.jpeg)\n\nAs you can see\
    \ there are multiple warnings and alerts. The last line records 172 (CNT column)\
    \ incidents of one alert! Security Onion is also capable of capturing TOR use\
    \ on your network. TOR is an anonymizing protocol that uses encrypted communication\
    \ that is bounced around the world to help anonymize users. TOR can be used for\
    \ good, but hackers also use TOR to hide their attacks. Here is what happened\
    \ when I used TOR on my test network monitored by Security Onion:\n\n![](images/00266.jpeg)\n\
    \nNotice that multiple yellow “Known TOR Exit Node Traffic” alerts are raised.\
    \ Security Onion has a slew of features & tools, makes analyzing & tracking network\
    \ traffic much easier, and also alerts you when it sees suspicious traffic. It\
    \ is a good practice (and learning experience) to run Security Onion on your test\
    \ lab as you perform various security attacks to see what is, and more importantly,\
    \ what is not detected.\n\n### Logging\n\nMake sure security logging is enabled\
    \ on critical switches, routers, firewalls and systems. Preferably have critical\
    \ devices and systems send security logs to a syslog server so you can have a\
    \ secondary copy of them (in case hackers wipe system logs) and to make incident\
    \ response easier. This helps in tracking down malicious users and traffic across\
    \ devices if the worst does happen. Many of the basic level firewall routers even\
    \ include syslog capability now. \n\n### Educate your users"
