- raw: "![](images/00102.jpeg)\n\nRockyou.txt is the go-to wordlist for cracking.\
    \ The “\\-o” switch is our output file and the “\\-O” at the end of the command\
    \ is basically just a speed setting for Hashcat. That will get some of them, to\
    \ get the rest (some are challenging) you will need to play with rules and different\
    \ wordlists. Once you have the cracked passwords you can use them in automated\
    \ attack scanners like Metasploit to possibly gain further access. I cover this\
    \ in other parts of this book and extensively in my other books. Let’s switch\
    \ gears again and look at a recently modified tool that works great in Kali on\
    \ a Raspberry Pi. \n\n### Bettercap 2\n\nTool Website: [https://github.com/bettercap/bettercap](https://github.com/bettercap/bettercap)\n\
    \nTool Wiki: [https://www.bettercap.org/](https://www.bettercap.org/)\n\nBettercap\
    \ has been completely re-vamped and is basically a completely new tool for network\
    \ scanning and MitM attacks. The new version can be run interactively from a console,\
    \ or run using multiple switches from the command line, or using scripts called\
    \ “caplets”. We will quickly cover how to use Bettercap and walk through some\
    \ live examples. \n\n#### Quick Scan\n\n        Enter, “bettercap -iface eth0”\
    \ \n\nOr “bettercap -face wlan0”, depending on what interface you want to monitor.\
    \ When this command is executed, detected systems will be displayed as “endpoints”,\
    \ listed with IP and MAC address.\n\n        Type “help” for contextual help\
    \ and to view available commands. \n\nNotice the “net.recon” module is running:\n\
    \n![](images/00103.gif)\n\nYou can type, “help net.recon” to view the module’s\
    \ help, or turn the module on or off by entering “net.recon on” or “net.recon\
    \ off”. You can type, “net.show” to see what systems have been detected with Bettercap’s\
    \ passive scan:\n\n![](images/00104.jpeg)\n\n#### To run an active scan:\n\n       \
    \ Enter, “net.probe on”\n\n        wait a few seconds\n\n        Then type,\
    \ “net.show”\n\n![](images/00105.jpeg)\n\nWith the active scan it was able to\
    \ detect an additional system, an Android device. \n\nIf you type, “help” you\
    \ can see that the net.probe module is still running:\n\n![](images/00106.gif)\n\
    \nTurn it off with “net.probe off”.\n\n#### ARP spoof MitM\n\nWe can target an\
    \ individual computer for ARP spoofing. This will create a Man-in-the-Middle attack\
    \ between the target system and the router, so we can see everywhere the target\
    \ is visiting online. \n\n        Enter, “help arp.spoof”\n\n![](images/00107.gif)\n\
    \nWe just need to set the “arp.spoof.targets” setting. Use the “set” command to\
    \ set them and the “get” command to view the current setting. We can enter a single\
    \ IP, a list of IPs or an entire subnet. It is important to understand what you\
    \ are doing before you use this tactic in real life. It would not be a good idea\
    \ to re-direct all the net traffic of a high usage subnet through a single Raspberry\
    \ Pi. That is why it is important to understand your tools and techniques before\
    \ you ever use them in a real environment.  \n\nIn this example, I will target\
    \ a Windows 10 system on my network at 172.24.1.238:\n\n        set arp.spoof.targets\
    \ 172.24.1.238\n\n        Double check the setting with “get arp.spoof.targets”\n\
    \n![](images/00108.jpeg)\n\nIt correctly shows a single target.\n\nNow just start\
    \ arp.spoof:\n\n        arp.spoof on\n\n![](images/00109.gif)\n\nAnd then turn\
    \ net.sniff on:\n\n        net.sniff on\n\n![](images/00110.gif)\n\nNow, on the\
    \ target system, begin to surf the web. You should then see everywhere the target\
    \ surfs listed in Bettercap.\n\nTurn off the modules when you are done:\n\n![](images/00111.gif)\n\
    \n#### Bettercap Caplets\n\n[https://github.com/bettercap/caplets](https://github.com/bettercap/caplets)\n\
    \nCaplets are basically just Bettercap command scripts. You can call the caplets\
    \ from the command line and it runs the commands just as if you inputted the information\
    \ manually in interactive mode. \n\nSo, if we wanted to start bettercap and immediately\
    \ start scanning:\n\n        bettercap -iface eth0 -caplet netmon.cap\n\nThere\
    \ are some very interesting ones, take some time and check them out.\n\n#### Bettercap\
    \ Wi-Fi Scanner\n\nMy new favorite tool for testing Wi-Fi security is Bettercap!\
    \ The latest version has added Wi-Fi scanning and the new PMKID client-less attack.\
    \ The entire process is covered at:\n\n[https://www.evilsocket.net/2019/02/13/Pwning-WiFi-networks-with-bettercap-and-the-PMKID-client-less-attack/](https://www.evilsocket.net/2019/02/13/Pwning-WiFi-networks-with-bettercap-and-the-PMKID-client-less-attack/)\n\
    \nSo, we are not going to spend any time on this, other than a quick walkthrough.\
    \ It doesn’t seem to work with the built-in Pi wireless adapter, so you will need\
    \ to use your USB Wi-Fi adapter.\n\nExit Bettercap and then restart it using the\
    \ following commands:\n\n        bettercap -iface wlan1\n\n        wifi.recon\
    \ on\n\n        set wifi.show.sort clients desc\n\n        set ticker.commands\
    \ 'clear; wifi.show'\n\n        ticker on\n\n![](images/00112.jpeg)\n\nFind the\
    \ channel of the target router you want, and lock onto it with the following command:\
    \ \n\n        wifi.recon.channel X (enter channel #)\n\nNow you can generate\
    \ an association request and send it to every router in that channel: \n\n       \
    \ wifi.assoc all\n\nIf routers are vulnerable to this style of attack, they will\
    \ respond with a handshake file. Any captured handshakes are stored in the root\
    \ directory, and just need to be converted. This can be done with the following\
    \ command:\n\n        hcxpcaptool -z bettercap-wifi-handshakes.pmkid /root/bettercap-wifi-handshakes.pcap\n\
    \n![](images/00113.gif)\n\nYou could now copy the resultant ‘bettercap-wifi-handshakes.pmkid’\
    \ file to a regular Kali Linux system and attempt to crack the handshake file\
    \ using the following hashcat command:\n\n        hashcat -m16800 -a3 -w3 bettercap-wifi-handshakes.pmkid\
    \ '?d?d?d?d?d?d?d?d'\n\n#### Bettercap Bluetooth Low Energy\n\nLastly, you can\
    \ also detect and interact with Bluetooth Low Energy (BLE) devices using Bettercap.\n\
    \n        Use “ble.recon on” to turn on the Bluetooth scanner\n\n![](images/00114.gif)\n\
    \nYou can then use “ble.show” to view any detected devices, “ble.enum” & “ble.write”\
    \ to interact with the Bluetooth device. \n\n![](images/00115.jpeg)\n\nHacking\
    \ Bluetooth devices is beyond the scope of this book and will be covered in my\
    \ upcoming Advanced Kali book. Running Bettercap interactively is a lot of fun,\
    \ especially when you are learning its features. But using “caplets” greatly increases\
    \ the ease of use and provides attack automation.  \n\n#### Bettercap Upcoming\
    \ Features\n\nThe new “Hydra” graphical user interface for Bettercap looks amazing.\
    \ At the time of this writing it is still a work and progress, and doesn’t seem\
    \ to work on Kali for the Raspberry Pi. Definitely keep an eye on this, as it\
    \ will be a great addition to Bettercap!\n\n        [https://github.com/bettercap/hydra](https://github.com/bettercap/hydra)\n\
    \nThe latest version of Bettercap, released as this book was going to print, now\
    \ also includes a Google map type location capability! \n\nLet’s switch gears\
    \ a bit - The Web App pentesting tools available for Kali on the Raspberry Pi\
    \ are the exact same tools that are available with the standard Kali Pi. I cover\
    \ a lot of these tools in-depth in my Intermediate book and will also cover them\
    \ in my upcoming Advanced Kali book, so we will only look at one tool, “OWASP-ZAP”.\n\
    \n### OWASP ZAP - Web Application Testing\n\nOWASP Zed Attack Proxy (ZAP) or ZaProxy\
    \ is a Web Application scanning and testing tool that can be used by both security\
    \ professionals and developers. You can do a lot with ZAP; we will just be covering\
    \ some of the more common features for security testing. \n\n        Start your\
    \ Metasploitable2 VM\n\n        Then, in Kali, navigate to “03 – Web Application\
    \ Analysis/ Owasp-Zap” in the Applications menu.\n\n![](images/00116.jpeg)"
