    # Chapter 3


    ## The PenTesters Framework on Raspbian


    ![](images/00046.jpeg)


    Tool Author: David Kennedy, TrustedSec

    Tool Website: [https://www.trustedsec.com/pentesters-framework/]

    GitHub Site: [https://github.com/trustedsec/ptf]

    PTF Walkthrough Video: [https://vimeo.com/137133837]


    The PenTesters Framework (PTF) is a Python script that installs a collection of
    commonly used pentesting tools on Debian, Ubuntu and ArchLinux based distributions.
    As Raspbian is based on Debian, PTF correctly installs on a Raspberry Pi 3b+/
    4 and many of the tools work with no modification. Though some of the installed
    tools will not run on a Pi.


    PTF installs the category of pentesting tools that you choose into the `/pentest`
    directory on your Raspberry Pi. You can than access and run the installed tools
    from the Raspbian Terminal. The install takes a while to run, especially if you
    are doing a full PTF install. But when it is finished, you have a Kali Linux like
    platform that has many of the most commonly used tools running right off of Raspbian!


    ### Install and update Raspbian


    We will be using a Raspberry Pi 3b+ for this chapter and Raspbian. It works the
    exact same with a Pi 4. Download and the “Buster with Desktop” version of Raspbian,
    then do a full update.


    - Instructions for installing Raspbian can be found in the “Installing OS” chapter
    if needed.

    - Once your memory card is written (I use Etcher), insert the memory card into
    your Pi, attach keyboard, mouse, network cable, and video display.

    - Lastly, power up the Pi.

    - Follow through the Desktop setup wizard on bootup, and perform a full update.


    ### Install PTF


    Once Raspbian is installed & updated, the next step is to install PTF. I highly
    recommend the reader watch the PTF Walkthrough Video provided by the tool author
    (link at beginning of chapter). As this video covers many of the PTF topics, we
    will move through this quickly. PTF is made up of modules by category. You can
    install individual PTF modules or all of them. If you want to perform a full install
    of PTF, you will need a 32 GB card. A full install can also take several hours
    on a Pi.


    NOTE: Some PTF tools that worked fine with Raspbian Stretch, seem to have a problem
    running with Raspbian Buster, hopefully future updates will fix these issues.


    From a Raspbian terminal:


    - Enter, `sudo su`

    - Next, `git clone https://github.com/trustedsec/ptf/`

    - Finally, `cd ptf`


    As seen below:


    ![](images/00047.gif)


    Now to start ptf:


    - Enter, `./ptf`

    - At the `ptf>` prompt, type, `show modules`


    You will see a list of all the available modules for PTF. You can install each
    individually. If you have a 32GB memory card you can install them all:


    - use `modules/install_update_all`


    ![](images/00048.gif)


    A lot of the popular security tools are included in PTF, you can also add new
    or custom tools (discussed in the PTF Walkthrough video). We will look at just
    a couple of them, and show a few usage examples. But first, the install will take
    a really long time, so it would be a good time to get up and find something else
    to do for a while. Just check on it periodically, you may need to allow it to
    install something as the install progresses.


    After several hours, literally, you will see this:


    ![](images/00049.gif)


    - Reboot when finished

    - SSH into the Pi or if you are using it locally, open a Terminal


    All tools will be located in category directories under the `/pentest` directory,
    as seen below:


    ![](images/00050.gif)


    Many of the tools can be run from anywhere, but some tools require you to change
    into its install directory for it to work properly. This is usually `/pentest`,
    but some seem to run from `/usr/share` as well. In this chapter we will only cover
    a handful of tools installed by PTF. I highly advise the reader take a few minutes
    and explore the install tools directories to find out all the tools available
    in PTF.


    ### Scanning with NMAP


    Nmap is the go-to tool for network scanning. It easily scans a network and can
    return what systems are up, what ports are open and what services they are running.
    It can also be used as an attack tool using nmap scripts. We will take a quick
    look at all of these features.


    If it is not running, start up your Metasploitable2 VM.


    In the Raspbian Terminal (or remote through SSH or Putty):


    - Type, `nmap -h` for options


    For a fast port scan, just type the `nmap` command followed by the target’s IP:


    ```bash

    nmap [target_ip]

    ```


    This shows the target is up:


    ![](images/00051.gif)


    We can get service information by adding `-A`:


    ```bash

    nmap -A [target_ip]

    ```


    This will take a bit longer, but display service versions:


    ```bash

    nmap -A [target_ip]

    ```


    You can also add `-v` or `-vv` for verbose output:


    ```bash

    nmap -v [target_ip]

    nmap -vv [target_ip]

    ```


    We could scan a single port using `-p`:


    ```bash

    nmap -p 21 [target_ip]

    ```


    We could scan a range of ports:


    ```bash

    nmap -p 21-25 [target_ip]

    ```


    We could also try a Brute attack using an nmap script:


    ```bash

    nmap --script ftp-brute -p21 [target_ip]

    ```


    ### Metasploit’s FTP scanner


    What if we wanted to scan an entire network, and only look for systems running
    certain services? One way we could do this is with Metasploit’s scanners. Metasploit
    comes with a ridiculous number of scanners installed.


    To view them:


    - In a terminal, enter `msfconsole` to start Metasploit

    - Then type `use auxiliary/scanner` and hit `tab` twice:


    ![](images/00059.gif)


    We can use any of these tools to scan our target network for information. Let’s
    scan our test network for running FTP servers and also do a version detection.
    We can do so using the `auxiliary/scanner/ftp/ftp_version` scanner.


    - `use auxiliary/scanner/ftp/ftp_version`

    - `set RHOSTS 172.24.1.200-220`

    - `run`

