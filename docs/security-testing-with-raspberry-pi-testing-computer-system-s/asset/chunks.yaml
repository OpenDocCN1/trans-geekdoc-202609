    \ to see what the commands do and what command switches are valid. Available commands\
    \ can be seen below:\n\n![](images/00096.gif)\n\nSince we recovered the Vagrant\
    \ user’s credentials, let’s try to use them with Impacket. We can view and track\
    \ who is logged onto the target system with the “impacket-netview” command:\n\n\
            impacket-netview -target 172.24.1.172 WORKGROUP/vagrant:vagrant\n\nWe\
    \ simply use the command with the target’s IP address, the user name and password.\n\
    \n![](images/00097.gif)\n\nThere are currently 2 logged in users. Viewing and\
