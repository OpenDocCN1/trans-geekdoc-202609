    \ different if you are using a Pi Zero W or a Pi 3/4 series. Make sure you get\
    \ the correct cable for your version of Pi. \n\nThere are so many options to choose\
    \ from with RPi! Many different style cases, accessories and adapters. Here is\
    \ a look at some of the hardware used in creating this book:\n\n![](images/00005.jpeg)\n\
    \n### Raspberry Pi Kits\n\nIf you are new to Raspberry Pis, one of the best ways\
    \ to start off is using a Kit. Normally when you purchase a Raspberry Pi, you\
    \ just get the computer board. A kit can provide (depending on the kit) a memory\
    \ card, case, power supply, heat sinks, and possibly connector cables.  You have\
    \ to look at the kit contents carefully, sometimes they come without a RPi! When\
    \ I buy a new RPi, I usually get a kit that includes the board, power supply,\
    \ heat sinks, and purchase a case that has a fan.  \n\nRaspberry Pi 3B+ & 4 Kits\
    \ – There are a lot of Raspberry Pi kits available. I have tried several kits\
    \ from different manufacturers and have never had a problem, though I do prefer\
    \ Cana Kits and Adafruit kits. \n\nFor the Sticky Kali Pi chapter I used an Adafruit\
    \ Pi-Hole kit – this includes a 2.8″ PiTFT display and a Pi 3b ([https://blog.adafruit.com/2018/10/11/new-product-ad-blocking-kit-for-pi-hole-with-2-8-pitft-no-soldering/](https://blog.adafruit.com/2018/10/11/new-product-ad-blocking-kit-for-pi-hole-with-2-8-pitft-no-soldering/))\n\
    \n![](images/00006.jpeg)\n\nRaspberry Pi Zero W Kits – If you have never owned\
    \ an RPI Zero W before, I recommend purchasing a kit that has video & USB adapters,\
    \ as this Pi uses a micro display connecter and Micro USB C type connectors. You\
    \ may also want a powered USB hub to connect multiple USB devices to your Pi 0W,\
    \ but it is not necessary. I used an Adafruit Pi Zero W Camera kit1 that included\
    \ the Pi Zero W, the Pi Camera v2 (8 Megapixels), and a case. The Vilros Pi Zero\
    \ W Complete Starter Kit2 is nice too because it includes necessary connector\
    \ adapters and cables, but it does not include a camera. \n\n### Ethical Hacking\
    \ Issues \n\nIn Ethical Hacking & Pentesting, a security tester basically acts\
    \ like a hacker. They use tools and techniques that a hacker would most likely\
    \ use to test a target network’s security. The difference being they are hired\
    \ by the company to test security and when done reveal to the leadership team\
    \ how they got in and what they can do to plug the holes. The biggest issue I\
    \ see in using these techniques is ethics and law. Some security testing techniques\
    \ covered in this book are actually illegal to do in some areas. So, it is important\
    \ that users check their Local, State and Federal laws before using the information\
    \ in this book. \n\nAlso, you may have some users that try to use Kali Linux or\
    \ other Ethical Hacking tools on a network that they do not have permission to\
    \ do so. Or they will try to use a technique they learned, but may have not mastered\
    \ on a production network. All of these are potential legal and ethical issues.\
    \ Never run security tools against systems that you do not have express written\
    \ permission to do so. In addition, it is always best to run tests that could\
    \ modify data or possibly cause system instability on an offline, non-production\
    \ replica of the network, and analyzing the results, before ever attempting to\
    \ use them on live systems. \n\n### Disclaimer\n\nNever try to gain access to\
    \ a computer you do not own, or security test a network or computer when you do\
    \ not have written permission to do so. Doing so could leave you facing legal\
    \ prosecution and you could end up in jail. \n\nThe information in this book is\
    \ for educational purposes only.\n\nThere are many issues and technologies that\
    \ you would run into in a live environment that are not covered in this material.\
    \ This book only demonstrates some of the most basic usage of RPi in security\
    \ and should not be considered as an all-inclusive manual to Ethical hacking or\
    \ pentesting.\n\nBe very careful handling your Raspberry Pis. Due to the small\
    \ size, they can be easily damaged. Proceed at your own risk, any damage caused\
    \ to the hardware is the sole responsibility of the user. Use a static free environment\
    \ when assembling and using the Pi, also when inserting and removing memory cards.\
    \ \n\nI did not create any of the tools or software programs covered in this book,\
    \ nor am I a representative of Kali Linux, Offensive Security or Raspberry Pi.\
    \ Any errors, mistakes, or tutorial goofs in this book are solely mine and should\
    \ not reflect on the tool creators. Every exercise in this book worked at the\
    \ time of this writing. Install, usage and update procedures for tools change\
    \ over time, if the install/setup information presented here no longer works,\
    \ please check the tool creator’s website for the latest information. Thank you\
    \ to the Raspberry Pi developers for creating a spectacular product and thanks\
    \ to the individual tool creators, you are all doing an amazing job and are helping\
    \ secure systems worldwide! \n\nReferences\n\n1.  Raspberry Pi Zero W Camera Pack\
    \ - [https://www.adafruit.com/product/3414](https://www.adafruit.com/product/3414)\n\
    \n2.  The Vilros kit I originally purchased doesn’t seem to be available anymore,\
    \ this one looks comparable: [https://www.amazon.com/Vilros-Raspberry-Starter-Power-Premium/dp/B0748MPQT4/](https://www.amazon.com/Vilros-Raspberry-Starter-Power-Premium/dp/B0748MPQT4/)\n\
    \nThis one includes even more:\n\n[https://www.amazon.com/Vilros-Raspberry-Kit-Premium-Essential-Accessories/dp/B0748M1Z1B/](https://www.amazon.com/Vilros-Raspberry-Kit-Premium-Essential-Accessories/dp/B0748M1Z1B/)\n\
    \n## Chapter 2\n\n## Installing Virtual Machines\n\nIn this chapter we will setup\
    \ our testing lab. We won’t need the lab for every chapter, but it will be used\
    \ in some chapters. I created the chapters so that if Virtual Machines are too\
    \ advanced for some readers, they can still follow through the pictures to see\
    \ what is happening. But to thoroughly learn the topics, it is best to use a test\
    \ lab. If you have read my previous Kali Linux based books, you are in luck! We\
    \ will be using pretty much the exact same layout. We will use Kali Linux, Metasploitable\
    \ 2 and Metasploitable 3 as Virtual Machines (VMs) on a host computer. "
