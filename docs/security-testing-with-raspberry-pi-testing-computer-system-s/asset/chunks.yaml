    你应该能看到来自摄像头的画面流。


    ![](img/00246.jpeg)


    欲了解关于 `PiCamera` 的更多信息，请查看 `PiCamera` 文档网页。


    ## PiCamera 总结


    在本文中，我们涵盖了如何使用 Python `PiCamera` 控制树莓派摄像头。对于精通 Python 并想要在程序中加入摄像头控制的用户来说，`PiCamera`
    是一个极佳的解决方案。`PiCamera` 的作者还通过提供优秀的文档和易懂的示例程序，让非编程人员也能轻松使用。


    ## 其他项目可能性：便携式夜视！


    `Raspberry Pi` 是我用过的功能最强大的单板计算机之一。上面的示例是 `Pi Camera` 的常规用法，可以帮助你入门。如果你发挥想象力，可以用你的
    `RPis` 创造出非常有趣的作品，就像这个项目：我的便携式夜视系统。


    ![](img/00247.jpeg)


    使用一个 `Raspberry Pi` 7 英触摸屏外壳，我只需将 `NV` 摄像头的电缆从外壳顶部引出，并将摄像头安装在外壳上。然后，我连接了一个 `Anker`
    口红笔式电池供电。如下所示：


    ![](img/00248.jpeg)


    使用基于我们涵盖的简单 `PiCamera` 脚本，我能够在触摸屏显示器上查看 `Night Vision` 视频，并捕捉实时高清视频进行播放。这是深夜厨房内部的景象，实际上肉眼过去什么也看不见：


    ![](img/00249.jpeg)


    图片中没有显示，但你可以清晰地读出台面上的标签。虽然范围只有中等到大房间的大小，但它运行得非常好。这是我想要构建的未来夜视系统的跳板——我的意思是，等我有时间的时候。


    ## 伪装监控摄像头


    我的另一个作品是伪装监控。我拿了一个假外外摄像头，并正通过 `Raspberry Pis` 将其转换为一个真实的摄像头系统。我考虑过添加第二个 `Pi` 或小开发板来扫描无线信号。


    ![](img/00250.jpeg)


    ## 魔法镜子


    `Pi` 的灵活性为许多家庭监控安全项目提供了可能。你可以通过结合多个 `RPis` 和双向玻璃来制作 `Magic Mirrors`。一个 `Pi` 处理
    `Magic Mirror` 功能，另一个可以被设置为摄像头。当然，不要用这些东西做愚蠢的事，并务必遵守你的联邦、州和当地法律。这是几年前我制作的大型 `Magic
    Mirror`；它由 `Raspberry Pi 3` 供电：


    ![](img/00251.jpeg)


    定制的机柜容纳了一个全尺寸的 `HDMI Display` 和 `Pi`：


    ![](img/00252.jpeg)


    下一个是家庭监控 `Magic Mirror`。一台旧安卓手机处理 `Magic Mirror` 界面，一个带有摄像头的 `Pi Zero W` 提供监控功能：


    ![](img/00253.jpeg)


    这从本质上只是一个巨大的画框、一块单向玻璃和一台运行 Android 版 `Magic Mirror` 程序的旧安卓手机：


    ![](img/00254.jpeg)


    还有一个小惊喜：


    ![](img/00255.jpeg)


    别介意我在 `Pi` 周围做得很糟糕，但它成功了！我只是在 `Pi0W` 上运行了我们之前涵盖的监控摄像头解决方案之一。这样做，我能够通过单向玻璃远程查看视频！胶带非常重要，因为你不允许背面的任何光线透进来，否则会严重影响你的视频录制。


    这些只是两个例子；可能性真的仅限于想象力。网上已经有许多关于如何制作智能镜子的教程和视频，所以我不会详细介绍任何具体的构建细节。尽管你只需要一个 `RPi`
    或旧安卓手机、一个适用于 `RPi5` 的 `MagicMirror2` 软件、单向玻璃和一个大画框。更具冒险精神的构建者可能想要制作一个自定义外壳并使用
    `HDMI display`。如果你决定为你的项目使用全尺寸显示器，请务必小心，因为这通常涉及到拆掉外壳，可能会出现很多问题，你最终可能得到一个镇纸而不是一个正常工作的显示器——提警告了。即使没有监控部分，`Magic
    Mirrors` 也是一个全家有趣的项目，去尝试一下吧！


    ## 使用 RTL-SDR 和 Salamandra 寻找窃听器


    工具作者：`Eldraco`


    工具 GitHub: [`github.com/eldraco/Salamandra`](https://github.com/eldraco/Salamandra)


    ![](img/00256.jpeg)


    随着物联网（IoT）设备的爆炸，以及某些硬件现在因间谍担忧而在某些设施中被禁止，如果有一种简单的方法可以扫描你的设施、酒店房间等，查看是否有隐藏的麦克风窃听设备，那就好了。`Salamandra`
    是一个用于在封闭环境中检测和定位窃听麦克风设备的工具。通常你在网上找到的窃听器会录制音频并在特定频率重新广播。`Salamandra` 会显示任何检测到的麦克风类型设备及其广播频率。通过显示的信号强度，可以找到设备的大致。


    ![](img/00257.jpeg)


    我在我的网站上介绍了如何使用 `Kali Linux`、`RTL-SDR`（我使用了带有附带伸缩天线的 `NooElec Nesdr Smart`）和 `Salamandra`：


    [`cyberarms.wordpress.com/2018/07/08/finding-spy-bugs-with-an-rtl-sdr-salamandra`](https://cyberarms.wordpress.com/2018/07/08/finding-spy-bugs-with-an-rtl-sdr-salamandra/)


    ## 使用树莓派追踪飞机


    好了，这个与安全没有关系，它只是一个酷的 `Pi` 项目。实时飞行追踪网站非常有用。它们允许你看到世界各地航班的实际位置。你可以使用 `Raspberry
    Pi` 创建一个简单的扫描器，让你能够追踪附近的飞机！自动相关监视广播（`Automatic Dependent Surveillance – Broadcast`或
    `ADS-B`）是飞机公开广播的信号，允许其被追踪。飞机爱好者有几种方法接收这些信号并在地图上绘制飞机的位置。爱好者实现这一点最简单的方法之一是使用 `Raspberry
    Pi 3` 和一个 `SDR-RTL` USB 适配器。


    使用树莓派追踪飞机非常简单，你只需要 `SDR-RTL`、运行 `Raspbian` 的 `Pi 3` 以及 `ADS-B` 映射软件。当软件运行时，`SDR-RTL`
    接收飞机的信号，然后在 Google 地图类型的显示上实时绘制它们的位置。我使用了以下设备：


    字体 运行 `Raspbian` 的 `Pi 3b`

    - 带有标准伸缩天线的 `NooElec NESDR SMART` USB

    - `Pi 3`，7 英寸触摸屏外壳

    '
