    工具 GitHub：[`github.com/mame82/P4wnP1_aloa`](https://github.com/mame82/P4wnP1_aloa)


    在本章中，我们将介绍新版本的 P4wnP1。P4wnP1 ALOA 是对原始 P4wnp1 的完全重写，具有许多新功能。在我看来，P4wnP1 ALOA 是适用于树莓派（Raspberry
    Pi）最好的伦理攻击框架之一。它将多个基于人机接口（HID）的工具合为一体，对其进行了扩展，并允许你通过实时 Web 界面完全更改或控制设备。P4wnP1
    拥有大量功能和能力，因此这只是对该工具的快速概述。


    ### 安装


    P4wnP1 ALOA 运行在树莓派 Zero W 上。该工具可以在作者的工具网站获取，但也已添加到官方 Kali Linux ARM 下载页面。安装方法与之前的工具相同，只需下载镜像、解压并将其写入
    microSD 卡中。


    我们将从 Kali ARM 网站下载镜像：


    1. 访问 [`www.offensive-security.com/kali-linux-arm-images/`](https://www.offensive-security.com/kali-linux-arm-images/)。

    2. 在 Raspberry Pi 标签页下，下载 Kali Linux P4wnP1 ALOA：

    ![](img/00199.jpeg)

    3. 解压 (`7zip`）并将镜像写入 microSD 卡，使用 `encher` 效果非常好：


    ![](img/00200.jpeg)


    P4wnP1 设计为“无头”模式运行，不需要连接外围设备。只需插入内存卡并将电源线插入树莓派边缘的 USB 接口即可开始使用。请注意，我提到的是将电源线插入边缘接口。当你将
    P4wnP1 连接到目标系统时，你将不会使用电源接口，而是使用内部（中间）的 USB 接口——在我们接的章节中请密切关注这一点。


    ### 连接到 P4wnP1


    基本上，P4wnP1 的工作原理是你通过 `SSH` 或 Web 界面连接到它来配置设备。当你准备好使用它时，将设备插入目标系统。与其他 HID 类型设备不同，即使在
    P4wnP1 部署后，你仍然可以远程接入并随时修改或重新配置它！有几种连接到 P4wnP1 的方法，我们将涵盖：


    1. WiFi 连接

    2. USB RNDIS

    3. 蓝牙连接


    任何时候仅选择三者之一与树莓派交互。我在本章一直使用 WiFi 连接。


    #### 1. WiFi 连接


    插入 P4wnP1 电源接口几秒后，将出现一个新的 Wi-Fi 网络：

    ![](img/00201.gif)


    - 连接到 WiFi 网络：

    密码：`MaMe82-P4wnP1`


    你现在可以访问控制面板界面或通过 `SSH` 登录树莓派以进入 Kali Linux 系统。

    - 对于 Web 控制界面，打开 浏览器并访问：[`172.24.0.1:8000`](http://172.24.0.1:8000)

    ![](img/00202.jpeg)


    或者直接使用 `Putty` 或 `SSH` 连接到 `172.24.0.1` 以访问底层的 Kali Linux OS：

    ![](img/00203.gif)


    P4wnP1 中使用的 Kali Linux 与你为树莓派安装普通 Kali 时是一样的。它和原始版本一样，带有一个非常精简的安装——仅安装了前 10 个工具。因此，你拥有
    `Wireshark`、`nmap`、`Metasploit` 等。如果你需要额外的工具，需要安装之前的 Kali for Pi 章节中提到的 Kali Metapackages。你也可以通过
    `apt install` 安装单个工具。但记住，Pi Zero W 的性能没有 Pi 3b+ 强，所以我会有选择地安装。


    #### 2. 通过 USB RNDIS 连接


    我专门使用 WiFi 连接进行控制，但你也可以通过 RNDIS 连接到树莓派。如果你使用内部（中间）USB 接口将设备插入主机系统，你可以像 USB 以太网设备一样访问该设备。这和你将
    P4wnP1 连接到目标系统的方式相同。系统上会出现一个新的“以太网”适配器。你可以通过 `Putty`、`SSH` 或 Web 控制面板界面控制设备。IP
    地址将有所不同，现在 `SSH` 接口将变为 `172.16.0.1`，http 控制面板将变为 `172.16.0.1:8000`。


    主机系统上会出现一个新的以太网适配器：

    ![](img/00204.gif)


    使用 `SSH` 连接：

    ![](img/00205.jpeg)


    连接到 HTML 控制面板：

    ![](img/00206.jpeg)


    然后你可以更改任何你想要的设置。


    #### 3. 通过蓝牙连接


    最后，我们也可以连接到 P4wnP1。我专门使用 WiFi 连接进行控制，但你也可以通过 USB RNDIS 连接到树莓派。如果你使用内部（中间）USB 接口将设备插入主机系统，你可以像
    USB 以太网设备一样访问该设备。这和你将 P4wnP1 连接到目标系统的方式相同。系统上会出现一个新的“以太网”适配器。你可以通过 `Putty`、`SSH`
    或 Web 控制面板界面控制设备。IP 地址将有所不同，现在 `SSH` 接口将变为 `172.16.0.1`，http 控制面板将变为 `172.16.0.1:8000`。


    ### P4wnP1 控制面板界面


    现在我们已经涵盖了几种连接到 P4wnP1 的方法，让我们来看看 P4wnP1 的 Web 控制。工具开发者在界面方面做了非常出色的工作。我之前尝试了许多不同的配置，导致设备处于不稳定状态。任何其他
    HID 类型工具可能都需要拔掉、带回主机系统并重新配置。而我能够在连接到目标系统时向设备重新部署默认设置，并恢复了正常工作！


    让我们来看看主菜单项：


    ##### P4wnP1 控制面板

    ![](img/00210.jpeg)


    在主控制面板界面上，顶部有主要的选项按钮，下方窗口有可更改的设置。


    ##### 连接设置

    ![](img/00211.jpeg)


    从顶部开始，左侧四个菜单按钮用于配置不同的连接类型。你可以更改 WiFi 名称和信道、将蓝牙切换为高速或低功耗、设置 DHCP 范围等。


    ##### 触发器 (Trigger Actions)

    ![](img/00212.jpeg)


    触发器是新版 P4wnP1 的重要部分。它们确实为工具添加了许多智能脚本。有几个预先存在的脚本可以告诉 P4wnP1 在连接到目标时如何运行：

    ![](img/00213.jpeg)


    当你熟悉了该工具的使用后，可以通过添加自己的触发器将其提升到新水平。你可以根据任何以下事件进行触发：

    ![](img/00214.jpeg)


    并执行任何以下操作：

    ![](img/00215.jpeg)


    '
