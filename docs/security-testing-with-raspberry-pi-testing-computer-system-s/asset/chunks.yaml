    \n## Chapter 7\n\n## Re4son’s DV-Pi\n\n![](images/00159.jpeg)\n\nTool Creator:\
    \ Re4son\n\nTool Website: [https://whitedome.com.au/re4son/sticky-fingers-dv-pi/](https://whitedome.com.au/re4son/sticky-fingers-dv-pi/)\n\
    \nAnother great Raspberry Pi based tool created by Re4son is “Damn Vulnerable\
    \ Pi”. DV-Pi is a purposefully vulnerable RPi image that you can use in your test\
    \ lab for hacking practice. The DV-Pi service runs on top of a Raspbian image,\
    \ and you can turn the vulnerable service on or off from the touch interface or\
    \ from the command line. DV-Pi comes in two options, DV-Pi 2 and DV-Pi 3. We will\
    \ be using the easier DVD-Pi 3. Even though this is marked as “easier”, it is\
    \ not an easy exploit for those new to the field. You need to know several tools,\
    \ and have a knowledge of how webservers work and basic webserver exploitation\
    \ techniques. So, don’t be upset if you can’t get this right away, more than an\
    \ entry level skill is required. \n\nWARNING: Never attach DV-Pi directly to a\
    \ live internet connection, always use it in a test lab or behind a firewall to\
    \ prevent external access as it is vulnerable! Turn the vulnerable service off\
    \ when not in use. \n\nAccording to the documentation, each image comes with one\
    \ vulnerability to get in and one vulnerability to get root. Each image has two\
    \ proof.txt files with a hash to prove successful compromise:\n\n/proof.txt\n\n\
    \ /root/proof.txt\n\nThe DV-Pi downloads work on Raspberry Pi 0/0W/1/2/3/3B+,\
    \ I will be using a 3B+ with TFT screen in this chapter.\n\n### DV-Pi Installation\n\
    \nFull install instructions are located on the tool website: \n\n[https://whitedome.com.au/re4son/download/sticky-fingers-dv-pi-3/#](https://whitedome.com.au/re4son/download/sticky-fingers-dv-pi-3/)\n\
    \nRead and follow them, as they may change over time. The current steps are replicated\
