    \ fans, I wonder if some of them used Star Wars themed passwords? \n\nCopy the\
    \ text and paste it into a text document called “passwords.txt”\n\n![](images/00100.gif)\n\
    \nIf you have a lot of patience, you can try cracking the hashes on the Raspberry\
    \ Pi using John the Ripper. \n\n### Cracking Hashes with John the Ripper\n\nJust\
    \ enter the command “john” followed by our passwords file and the format, which\
    \ in this case is NT hashes:\n\n        john passwords.txt --format=NT\n\nIt\
    \ cracks the vagrant and administrator passwords right away:\n\n![](images/00101.gif)\n\
    \nThat is pretty much it, you are better off trying to crack the remaining hashes\
    \ on a stand-alone PC with a video card that has a fast GPU. Don’t hate me, but\
    \ I usually use a Windows workstation for password cracking. I don’t need to fuss\
    \ with getting video drivers working on Linux and, well, it works great. So, for\
    \ Windows the command to attempt to crack the remaining hashes would look something\
    \ like this:\n\n        hashcat64 -D 2 --remove -m 1000 MS3passwords.txt rockyou.txt\
    \ -o MS3cracked.txt -O\n\nThis tells Hashcat to use the GPU, remove password hashes\
    \ as they are cracked (not necessary in this case, but when you are dealing with\
    \ a massive list of hashes it will save you a lot of time. The “\\-m 1000” switch\
    \ tells hashcat that you are cracking NT hashes, and MS3passwords.txt is our hash\
