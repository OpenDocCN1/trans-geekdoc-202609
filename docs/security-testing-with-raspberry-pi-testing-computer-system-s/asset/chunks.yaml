    \ overview instead of a tutorial chapter. Complete write ups for these projects\
    \ can be found on my `DanTheIOTMan.com` blog.\n\nFor this chapter, you will need:\n\
    \n- Raspberry Pi v2 8 MP Camera with `Pi Zero W` cable and/or `Pi3,4` cable\n\
    - Raspberry Pi Camera case (Many to choose from)\n\nOptionally you will need:\n\
    \n- Raspberry Pi Night Vision Camera\n- `ZeroView` case\n- `Pi` Battery\n\nNote:\
    \ The camera cable is different if you are using a `Pi Zero W` compared to a `Pi3`\
