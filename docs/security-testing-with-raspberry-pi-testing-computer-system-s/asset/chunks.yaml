    In this chapter we are going to look at three scanning tools that can be used
    on the Raspberry Pi. Of course, you could use `Nmap` for scanning, and I cover
    this extensively in my other books. `Nmap` works exactly the same on the Pi, so
    I will not be covering that in this book. The first two tools we will cover can
    be run on Raspbian with the `PTF` toolkit installed or on a Kali Pi install. You
    can use these tools with one of the earlier Operating System installs if you wish.
    Though, I highly recommend that WarBerryPi be installed on a fresh copy of Raspbian.


    Another tool that is mentioned in OSCP exam preps is “MassScan”. I thought about
    adding it to this chapter, but decided against it. Yes, you can run `MassScan`
    from a Raspberry Pi. No, you probably shouldn’t do it. `MassScan` is a tool designed
    to scan large very large networks, like the entire Internet, very quickly. I do
    not recommend trying or using any tools like that (other than in a small test
    environment) on the Raspberry Pi due to lack of processing power.


    We will be using the `Metasploitable2` system as a target in this chapter.


    ## Scanning with Reconnoitre


    Tool Author: Codingo


    Tool GitHub: [https://github.com/codingo/Reconnoitre](https://github.com/codingo/Reconnoitre)


    `Reconnoitre` is a reconnaissance tool made to help those doing the OSCP labs.
    You cannot use automated tools during the exam, but this tool can help you learn
    what tools could be used in certain situations. The tool scans a target, performs
    services detection, and stores the obtained data, along with recommended commands
    for further exploration/ exploitation in an output folder.


    ### Installing and Using


    Full install instructions and usage examples available on the tool GitHub website.
    But basically, from either Kali or Raspbian with `PTF`, open a terminal and run
    the following commands:


    ```bash

    git clone https://github.com/codingo/Reconnoitre.git

    cd Reconnoitre/

    sudo python setup.py install

    ```


    #### Quick scan with service detection


    - If it is not running, start the `Metasploitable2` VM.

    - Then, `sudo reconnoitre -t 172.24.1.218 -o ~/Reconnoitre/output –services`


    This performs a services scan against our `Metasploitable` target and stores the
    output in the `~/Reconnoitre/output` directory.


    ![](images/00148.jpeg)


    The nice thing about `Reconnoitre` is that the tool output includes helpful hints
    on exploiting vulnerabilities found during scanning:


    ![](images/00149.jpeg)


    As an example, for brute forcing the detected SSH service, it recommends running
    the following testing commands:


    ```bash

    medusa -u root -P /usr/share/wordlists/rockyou.txt -e ns -h 172.24.1.218 - 22
    -M ssh

    hydra -f -V -t 1 -l root -P /usr/share/wordlists/rockyou.txt -s 22 172.24.1.218
    ssh

    ncrack -vv -p 22 --user root -P PASS_LIST 172.24.1.218

    ```


    ## Scanning with Vanquish


    ![](images/00150.gif)


    Tool Author: Frizb


    Tool GitHub: [https://github.com/frizb/Vanquish](https://github.com/frizb/Vanquish)


    `Vanquish` uses multiple opensource tools built into Kali for information gathering
    and vulnerability identification. Install and usage guide can be found on the
    tool GitHub site.


    ```bash

    git clone https://github.com/frizb/Vanquish

    cd Vanquish

    python Vanquish2.py -install

    vanquish --help

    ```


    #### Create the target host file and run a scan:


    ```bash

    echo 172.24.1.218 >> target.txt

    sudo vanquish -hostFile target.txt -logging

    ```


    ![](images/00151.jpeg)


    You can use `Ctrl-c` to skip a phase if it is taking too long, and `Ctrl-z` to
    exit.


    Output reports are stored in the target directory:


    ![](images/00152.gif)


    You can also perform custom brute force attacks using `Vanquish` – See “Custom
    Attack Plans” on the tool website for more information: [https://github.com/frizb/Vanquish](https://github.com/frizb/Vanquish)


    Last but not least, let’s look at WarBerryPi.


    ## WarBerry Pi Tactical Exploitation


    ![](images/00153.gif)


    Tool Author: SecGroundZero


    Tool Website: [https://github.com/secgroundzero/warberry](https://github.com/secgroundzero/warberry)


    `WarBerryPi` is a “drop box”, basically a Red Team leave-behind device that is
    hooked to a target’s network and then left to collect information and attack the
    target network. `WarBerryPi` is designed to hide on a target network and be as
    stealthy as possible while collecting data. You can also setup a covert 3G channel
    (which we will not cover) so you can access the `WarBerryPi` remotely. `WarBerry`
    analyzes existing traffic and tries to emulate a printer if it can’t find a good
    IP address, it can also emulate a MAC address of an existing device.


    NOTE: As with every tool and device covered in this book - This is for educational
    purposes only. It is illegal to use a device such as this on a computer network
    without proper authorization. Also, thoroughly test any tool and fully understand
    what it is doing, and how it could impact your network, before ever attempting
    to use it in a live environment.


    Complete instructions at: [https://www.peerlyst.com/posts/warberry-the-complete-guide](https://www.peerlyst.com/posts/warberry-the-complete-guide)


    ### Installing


    From a new Raspbian or Kali:


    ```bash

    git clone https://github.com/secgroundzero/warberry

    cd warberry

    bash setup.sh

    ```


    ### Performing a Simple WarBerry


    To perform a simple scan with `WarBerry`:


    ```bash

    sudo python warberry.py -I eth0 -i T3 -t 120

    ```


    ![](images/00154.gif)


    `-I` is the interface you want to scan. `-i` is the scanning intensity, you can
    enter `T1-T4`. The higher numbers are faster, but not stealthy. By default, responder
    will run for 15 minutes, you can change the amount of time it runs with the `-t`
    command. If it is not finished by the time the rest of the scans are finished,
    it will wait at the “waiting for responder” prompt. I use the `-t 120` to have
    it run for 2 minutes. You can also use `-Q` threaded mode for fast scanning, but
    again it is not stealthy.


    ### Malicious Mode


    Using the `-M` or “malicious mode” switch performs a much deeper (and longer running)
    scan/ attack process:


    ```bash

    sudo python warberry.py -I eth0 -M

    ```


    ![](images/00157.jpeg)


    All results are stored in the `Results` directory. You can also view the `WarBerry`
    database.


    ![](images/00158.jpeg)


    There is a Report function that makes a web interface to the reports, but it doesn’t
    seem to work after the latest OS updates. You can always use `sqlite3` to access
    the database.

    '
