    When prompted, allow it to restart any services without asking. Take a break as
    the updates install, reboot when the upgrade is finished. If there is an update
    to `ExploitDB` expect it to take a very long time to upgrade – During my install
    it took about a day for 2019-1 to complete, seemingly due to an `ExploitDB` update.
    In one of the Kali forums someone mentioned just removing `ExploitDB` before upgrade,
    but I leave that up to the readers discretion.


    All the Kali tools are available from the Applications menu and through the terminal.
    You will notice that the installed tool list is pretty sparse. This is on purpose,
    as you need to install Metapackages!


    ## Metapackages


    The Kali-Pi image comes pre-installed with some tools already installed. They
    were called the “top 10” in an earlier release of Kali and include `Metasploit`,
    `nmap`, `Recon-NG`, etc. The rest of the Kali tools can be downloaded via Kali
    “Metapackages”. `Metapackages` are security tool packages grouped by function.
    If you have a 16 GB or greater SDRam card, and a lot of patience, you can install
    the full Kali Linux install. If you didn’t need all of these tools, you could
    install just the Wireless tools (`kali-linux-wireless`) or the Web Application
    Assessment tools (`kali-linux-web`), depending on your needs.


    All the available Metapackages are listed on the Kali Metapackages website:


    - [https://tools.kali.org/kali-metapackages](https://tools.kali.org/kali-metapackages)


    Installation is simple, in a terminal just enter, `apt install` along with the
    metapackage that you want. You basically have 2 options; you can install the full
    package or individual tool packages. The only drawback to option 2 is that some
    of the necessary “helper” tools may not be installed and you may need to install
    them manually.


    ### Option 1


    If you want the full Kali install:


    - `apt install kali-linux-full`


    This includes all the tools from a normal Kali Linux install. This will take a
    very long time to install, so be patient.


    ### Option 2


    If you want to install a specific category of tools:


    Depending on what you want to do with your Kali install, a good choice is the
    Wireless tools. The wireless package includes numerous tools including ones for
    Wi-Fi, Bluetooth & SDR. You can see what packages are included by using the following
    command:


    ```bash

    apt-cache show kali-linux-wireless |grep

    ```

    (images/0092.gif)


    If these are the tools that want, then proceed with the install:


    ```bash

    apt install kali-linux-wireless

    ```


    Whichever option you pick, the new tools will show up in the Kali menu after the
    install:


    (images/0093.jpeg)


    Either install option seems to take hours, be patient, and reboot when it is finished.
    The downloaded tools are the SAME tools you would receive on the regular Kali
    install. These aren’t watered down versions or anything like that. I have run
    into a couple tools that didn’t work, or seemed to be missing, but that is a rare
    occurrence. If it works in the regular Kali install, chances you can do the same
    thing, the same way, in Raspberry Pi. So, after that long install, let’s play!


    ## Responder


    Tool Website: [https://github.com/lgandx/Responder/](https://github.com/lgandx/Responder/)


    `Responder` is an LLMNR, NBT-NS and MDNS poisoner. Basically, `Responder` pretends
    to be several Windows based services and will answer calls for these services.
    It has the capability to grab password hashes and possibly clear text creds. It
    works the best when someone on the network enters a network share incorrectly,
    `Responder` answers the call and nabs the user’s password. It is a great tool
    to setup and run to grab some easy creds from a target network. It’s also a perfect
    tool for Pi, as it could be used during penetration tests. In Kali, start `Responder`:


    ```bash

    responder -I eth0 -wb

    ```

    While that is running, start the Metasitable3 Virtual Machine. If you didn’t install
    Metasitable3, no worries, you can use a Windows 10 system if you have one. In
    the MS3 VM, attempt to surf to a non-existing network:


    ```bash

    //Server2/Secret

    ```

    (images/0094.jpeg)


    `Responder` will answer the query for the non-existing share and prompt the Windows’s
    user for their login credentials. If the user enters their credentials, we receive
    them in plain text along with the password hash for the user:


    (images/0095.jpeg)


    We now have some credentials and can use them to further attack the target network.
    `Impacket` is a set of great scripts you can use if you have valid credentials.
    We will look at this next.


    ## Impacket


    Tool Website: [https://www.secureauth.com/labs/open-source-tools/impacket](https://www.secureauth.com/labs/open-source-tools/impacket)


    GitHub Site: [https://github.com/SecureAuthCorp/impacket](https://github.com/SecureAuthCorp/impacket)


    `Impacket` is a collection of Python scripts used mostly for recon and post exploitation.
    The `Impacket` tools included with Kali is actually a subset of the complete script
    package. Each `Impacket` command can be a little different, so it is best to run
    the command by itself to display the built-in help page. Read through the help
    to see what the commands do and what command switches are valid. Available commands
    can be seen below:


    (images/0096.gif)


    Since we recovered the Vagrant user’s credentials, let’s try to use them with
    `Impacket`. We can view and track who is logged onto the target system with the
    `impacket-netview` command:


    ```bash

    impacket-netview -target 172.24.1.172 WORKGROUP/vagrant:vagrant

    ```

    We simply use the command with the target’s IP address, the username and password.


    (images/0097.gif)


    There are currently 2 logged in users. Viewing and tracking when users login and
    log off could come in very handy. Let’s try out some of the other scripts. What
    if we wanted a list of all the users along with when they last set their password?


    ```bash

    impacket-samrdump WORKGROUP/vagrant:vagrant@172.24.1.172

    ```

    Notice the command syntax is a little different here, check the tool’s help to
    see what is required for each tool.


    (images/0098.gif)


    A user list is nice, but it would be better if we could get their password hashes.
    Well, there is a script for that too!


    ```bash

    impacket-secretsdump WORKGROUP/vagrant:vagrant@172.24.1.172

    ```

    (images/0099.gif)


    Well, this server’s users are definitely Star Wars fans, I wonder if some of them
    used Star Wars themed passwords? Copy the text and paste it into a text document
    called `passwords.txt`.


    (images/0100.gif)


    If you have a lot of patience, you can try cracking the hashes on the Raspberry
    Pi using `John the Ripper`.


    ### Cracking Hashes with John the Ripper


    Just enter the command `john` followed by our passwords file and the format, which
    in this case is NT hashes:


    ```bash

    john passwords.txt --format=NT

    ```

    It cracks the vagrant and administrator passwords right away:


    (images/0101.gif)


    That is pretty much it, you are better off trying to crack the remaining hashes
    on a stand-alone PC with a video card that has a fast GPU. Don’t hate me, but
    I usually use a Windows workstation for password cracking. I don’t need to fuss
    with getting video drivers working on Linux and, well, it works great. So, for
    Windows the command to attempt to crack the remaining hashes would look something
    like this:


    ```bash

    hashcat64 -D 2 --remove -m 1000 MS3passwords.txt rockyou.txt -o MS3cracked.txt
    -O

    ```

