- raw: "Some buttons start services, and they turn green when the service is running.\
    \ So, if you hit “WWW” on the second menu, the Apache Web service starts on the\
    \ system. Hit “WWW” again, the green light goes off and the Apache service is\
    \ stopped. The FTP & SQL buttons enable and disable the Pure-FTPd & MySQL services.\n\
    \nNOTE: If you try to use the Mana toolkit (available on a later menu) a fake\
    \ captive portal will start instead. If you surf to the Kali-Pi IP address on\
    \ a different system you will see the fake portal:\n\n![](images/00137.jpeg)\n\
    \nThe web portal is displayed, but Mana is currently not working (there seems\
    \ to be a version issue with IPTables, and Mana is tagged as “Deprecated” on the\
    \ tool’s website, meaning there probably won’t be an update). \n\n##### RAS-AP\n\
    \nA remote access Wi-Fi program for the Pi. There are some issues reported with\
    \ RAS-AP currently, one potential work around mentioned is to use Pi-Tail instead.\
    \ Pi-Tail is covered later in this chapter. \n\n##### Darkstat\n\nStarts the Darkstat\
    \ Real-Time network statistics tool. This tool monitors network traffic and displays\
    \ the reports on a webpage. Once the tool is enabled, open a web browser on a\
    \ different computer and surf to the Kali-Pi address, port 667 (i.e. 172.24.1.114:667)\
    \ to see the display graph:\n\n![](images/00138.jpeg)\n\nYou can also start the\
    \ Darkstat service through SSH:\n\n        Enter, “service darkstat start”\n\n\
            Then, open a browser and surf to port 667 on the Pi (172.24.1.114:667)\n\
    \n        Enter, “service darkstat stop” when finished\n\nYou can change the\
    \ default behavior of darkstat by editing the darkstat config file “/etc/darkstat/init.cfg”:\
    \ \n\n![](images/00139.gif)\n\nYou can also run darkstat from the command line:\n\
    \n![](images/00140.gif)\n\n##### Ntopng\n\nStarts Ntop Next Generation (ntopng),\
    \ another network statistics program. Just touch the button to start the service,\
    \ then navigate to the Kali-Pi port 3000 (172.24.1.114:3000). Login with the default\
    \ credentials - admin/ admin. You will be prompted to change the password on first\
    \ login.\n\n![](images/00141.jpeg)\n\nYou can also start ntop remotely through\
    \ SSH:\n\n        Enter, “systemctl start redis-server”\n\n        Then, “ntopng”\n\
    \nThen use a web browser and connect to port 3000 (172.24.1.114:3000)\n\nWhen\
    \ finished:\n\n        Hit “ctrl-c” to exit ntop\n\n        systemctl stop redis-server\n\
    \n#### Menu 3\n\n![](images/00142.jpeg)\n\nFrom Menu 3, you can start Metasploit\
    \ or Kismet in a Terminal. These programs function the same as if you started\
    \ them normally, so I will not cover them here. The second row of buttons (OpenVAS,\
    \ Snort, PulledPork) is blacked out - the Kali-Pi website talks about how to setup\
    \ and use the programs behind these buttons. Let’s take a minute and look as the\
    \ last app button on the screen, the SDR-Scan button.\n\n##### Freq Show SDR\n\
    \nIf you have a USB RTL-SDR, touching the SDR-Scan button starts the Adafruit\
    \ app “Freq Show”. This is just a RF scanning app for the Pi, but it looks very\
    \ impressive on an attached TFT screen. \n\nTo use Freq Show:\n\n        Connect\
    \ your USB RTL-SDB device to the Pi \n\n        Touch the SDR-Scan button\n\n\
    You should immediately see a RF waveform display:\n\n![](images/00143.jpeg)\n\n\
    You can change the frequency and sampling rates with the “Config” button. You\
    \ can also change it to a “waterfall” type display using the “Switch Mode” buttons.\
    \ That’s pretty much all it does, like I said, it looks impressive. Show it to\
    \ your friends, you will amaze them. You can find out more about the settings\
    \ here on the Adafruit website:\n\n[https://learn.adafruit.com/freq-show-raspberry-pi-rtl-sdr-scanner/usage](https://learn.adafruit.com/freq-show-raspberry-pi-rtl-sdr-scanner/usage)\n\
    \n##### Menu 4\n\n![](images/00144.jpeg)\n\nMenu 4 is the Mana Toolkit Evil Access\
    \ Point menu. All the buttons on this menu pertain to different ways to start\
    \ the Mana Toolkit. For years Mana was the go-to tool for creating rogue Access\
    \ Points. Unfortunately, with the latest Kali software updates, Mana no longer\
    \ seems to function and the project has since been marked “deprecated”. I am not\
    \ sure if this menu will be changed for other purposes or if the Mana Toolkit\
    \ will be upgraded in the future, but at the time of this writing Mana does not\
    \ seem to be functional. \n\n##### Menu 5\n\n![](images/00145.jpeg)\n\nMenu 5\
    \ is a status page for the Pi. It lists the Internal clock speed, operating temp\
    \ and system voltage. A nice feature if need to check these statistics. If you\
    \ look at the file directory on the Pi, each menu corresponds to a like named\
    \ .py file, except for this menu. Menu 5 is currently saved as the “menu-9.py”\
    \ file.  \n\nAs seen below:\n\n![](images/00146.gif)\n\nWell, that about does\
    \ it for this chapter. As mentioned in the beginning of the chapter, Kali-Pi is\
    \ basically the functional equivalent of the official Kali Pi release covered\
    \ in the previous chapter. So other usage of Kali-Pi (installing & using metapackages,\
    \ using third party tools, etc.) will be identical to the official version. \n\
    \n### Pi-Tail\n\nPi-Tail is Re4son’s Sticky Finger Kali-Pi for the Pi Zero W,\
    \ with enhanced connectivity options. There are multiple ways you can set this\
    \ up. If you attach a display, keyboard and mouse it functions and acts just like\
    \ a regular Kali-Pi install. Again, like Kali-Pi it is a fairly bare bones install\
    \ and you would need to install the Metapackages that you want. Just realize that\
    \ the Pi Zero W does not have the horsepower that a Pi 3b+ does, so choose your\
    \ apps wisely.\n\nThe main difference between Kali-Pi and Pi-Tail, is that Pi-Tail\
    \ is pre-configured to run off of a mobile phone or tablet (or PC). It has support\
    \ for Bluetooth and WiFi connectivity setup by default. It also acts like a USB\
    \ drive when you connect it to your phone or tablet. I honestly had mixed results\
    \ with Pi-Tail. Sometimes is worked amazingly well, others I had a hard time connecting.\
    \ So, I will leave this as an option for the readers to explore. \n\nQuick Install\
    \ and Usage guide here:\n\n[https://whitedome.com.au/re4son/pi-tail](https://whitedome.com.au/re4son/pi-tail)\n\
    \n![](images/00147.jpeg)\n\nAll instructions on how to use Pi-Tail for different\
    \ connection techniques are covered in the Pi-Tail How To:\n\n[https://github.com/Re4son/RPi-Tweaks/blob/master/pi-tail/Pi-Tail.HOWTO](https://github.com/Re4son/RPi-Tweaks/blob/master/pi-tail/Pi-Tail.HOWTO)\n\
    \nAdditional Tips here:\n\n[https://github.com/Re4son/RPi-Tweaks/blob/master/pi-tail/Pi-Tail.README](https://github.com/Re4son/RPi-Tweaks/blob/master/pi-tail/Pi-Tail.README)\n\
    \nFollow the Pi-Tail instructions carefully, as there are multiple ways to setup\
    \ the different features. It also matters where you plug your USB cable into the\
    \ Pi Zero W, depending on what features you are using. \n\n#### Conclusion\n\n\
    In this chapter we covered using Re4son’s “Sticky Finger Kali-Pi”. We showed that\
    \ the main difference between this and the official Kali Raspberry Pi image is\
    \ the enhanced support for touch, mainly the touch button interface. We finished\
    \ the chapter by introducing “Pi-Tail”, the Kali-Pi solution for the Pi 0 W. Though\
    \ we didn’t talk about it much, we will dig deeper into using the Pi 0 W for security\
    \ testing later in the book. \n\n#### Resources\n\n        Kali-Pi Buttons -\
    \ [https://whitedome.com.au/re4son/topic/list-of-functions-buttons/](https://whitedome.com.au/re4son/topic/list-of-functions-buttons/)\n\
    \n        Kali-Pi Menus - [https://github.com/Re4son/Kali-Pi/tree/master/Menus](https://github.com/Re4son/Kali-Pi/tree/master/Menus)\n\
    \n        Freq Show SDR Scanner usage - [https://learn.adafruit.com/freq-show-raspberry-pi-rtl-sdr-scanner/usage](https://learn.adafruit.com/freq-show-raspberry-pi-rtl-sdr-scanner/usage)\n\
    \n## Chapter 6\n\n## Reconnoitre, Vanquish & WarBerryPi"
