  trans: '

    设置虚拟机使得在实验室环境中学习攻击性计算机安全测试变得非常简单。这样一来，我们就不需要一整个房间的电脑来搭建学习环境，只需要一台足够强大可以同时运行多个虚拟机会话的机器即可。在编写本书时，我使用了一个带有
    8 GB 内存的 Windows 7 Core i7-6700 系统作为虚拟机宿主机。它有足够的动力同时运行我们的三个实验室操作系统，且完全没有问题。虽然
    64 位版本的工作原理也类似，但我为 Kali Linux 的安装选择了 32 位版本，因为 Kali 中安装的某些工具只会在 32 位系统上运行。如果你有虚拟系统的经验，可以使用任何你喜欢的虚拟机软件。我将使用
    `VMware Player` 作为 Kali Linux 和 Metasploitable 2 的宿主机。更高级的读者还可以在 `VirtualBox`
    中设置 Metasploitable 3，作为一个额外的测试目标。


    当一切设置完成后，我们应该有一个有一个如下所示的小型测试网络：


    ![](img/00007.jpeg)


    我在书中使用的是 `172.24.1.0` 网络布局。你的网络/IP 地址可能会有所不同。


    **注意**：由于我们将处理脆弱的操作系统，请确保在宿主机系统和互联网之间有一个防火墙（最好是硬件防火墙）！


    ### 安装 VMware Player & Kali


    在 `VMware` 上安装 Kali 非常简单，因为 Offensive Security 提供了一个可以下载的 Kali VMware 镜像，所以我们不会在这上面花费大量时间。基本上，只需下载
    Kali 虚拟机镜像并在 `VMWare Player` 中打开它即可。我们将逐步完成这一过程。


    1. 为适用于你的操作系统版本下载并安装 `VMWare Player`。


    `VMWare player` 的版本和下载位置经常发生变化。在写本文时，`VMWare Player` 的当前版本是“VMWare Workstation
    15 Player”。它可以作为非商业用途的免费版运行，也可以通过许可运行：


    ([`www.vmware.com/go/tryplayer`](https://www.vmware.com/go/tryplayer))


    ![](img/00008.jpeg)


    2. 选择你想安装的位置，通常使用默认设置即可。


    3. 按照安装提示操作，在需要时重启电脑。


    4. 启动 `VMWare`，对于免费版输入你的电子邮件地址，或者为商业用途购买并输入许可密钥。


    5. 点击“继续（Continue）”，完成后点击“完成（Finish）”。


    6. 下载 Kali Linux 32 位虚拟机镜像 ([`www.offensive-security.com/kali-linux-vm-vmware-virtualbox-hyperv-image-download/`](https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-hyperv-image-download/))。


    验证下载文件的校验和始终是一个好习惯，用以确认文件正确且未被修改或损坏。在 Windows 中，你可以使用 `certUtil` 命令执行此操作：


    7. 从命令提示符中输入 `certUtil -hashfile [kali linux 下载文件] SHA256`


    ![](img/0009.gif)


    然后与 Kali 页面上列出的校验和进行比对。


    8. 接下来，将文件提取到你想运行它的位置。


    9. 启动 `VMware Player`。


    10. 从菜单中点击“播放（Player）”。


    11. 点击“文件（File）”。


    12. 接下来点击“打开（Open）”。


    13. 导航到提取出的 Kali Linux `.vmx` 文件，选中它并点击“打开（Open）”。


    14. 它现在将出现在 `VMWare Player` 主界面上。


    15. 选中 Kali 虚拟机，点击“编辑虚拟机设置（Edit Machine Settings）”。


    16. 在这里你可以查看并更改虚拟机的任何设置：


    ![](img/0010.jpeg)


    17. 点击“网络适配器（Network Adapter）”：默认设置为 `NAT`（网络地址转换）。`NAT` 意味着每个虚拟机将在一个小的 `NAT`
    网络中创建，并在它们之间以及宿主机共享；如果需要，它们也可以访问互联网。有些人报告说使用 `NAT` 会遇到问题且只能使用桥接（`Bridged`），因此我在书中对我的所有虚拟机都使用了
    `bridged` 模式。如果你使用 `bridged`，请确保你的系统和互联网之间有一个硬件防火墙。此外，确保宿主机位于私有局域网，与任何业务或关键系统隔离。


    18. 点击“确定（OK）”返回 `VMWare Player` 主界面。


    19. 现在只需点击“播放虚拟机（Play Virtual Machine）”即可启动 Kali。你可能会收到询问虚拟机是否已移动或复制的消息，只需点击“我复制了（I
    copied it）”。


    20. 请求安装 `VMWare tools` 时，选择稍后安装。


    21. 当 Kali 启动时，你将进入登录界面：


    ![](img/0011.jpeg)


    22. 使用用户名“root”和密码“toor”（root 的反写）登录。


    23. 随后你将看到主桌面：


    ![](img/0012.jpeg)


    我们现在已安装 Kali 虚拟机。


    ### 设置 Kali IP 地址


    如果你愿意，可以把所有 IP 地址留为动态分配（DHCP）。这可能会变得有点混乱，你可能想为你的 Kali Linux 和 Metasploitable 2
    系统设置 IP 地址。你可以通过以下步骤设置 Kali IP 地址。


    1. 点击右上角的向下三角形。


    2. 点击“已连接（（Connected）”。


    3. 然后点击“有线设置（Wired Settings）”，如下：


    ![](img/013.jpeg)


    4. 点击左侧的“网络（Network）”。


    5. 在“有线 - 已连接”下点击设置图标：


    ![](img/014.jpeg)


    6. 点击 `IPv4` 标签页


    7. 点击“手动（Manual）”单选按钮


    8. 在地址下输入 IP 地址、子网掩码和网关：


    ```

    172.24.1.39 255.255.255.0 172.24.1.1

    ```


    9. 完成后点击“应用（Apply）”。


    重启系统。回来后，打开终端（点击启动处的终端）并运行 `ifconfig` 使 IP 地址已更改：


    ![](img/015.jpeg)


    如果你的路由器设置正确，你也应该能够访问互联网：


    ![](img/016.jpeg)


    就这样；Kali 现在已安装并就绪。


    ### 更新 Kali


    Kali Linux 经常更新以包含最新的工具和功能。要更新 Kali，打开终端并输入：


    ```

    apt update

    apt upgrade

    ```


    ![](img/017.jpeg)


    更新可能需要一段时间，并可能提示你输入。如果你不确定如何回答问题，直接使用默认响应。更新完成后重启。


    现在 Kali 已更新，我们来谈谈 VMWare tools。


    ### VMWare tools


    当 Kali 启动时，不要在提示时安装 VMware tools。最新版本的 Kali 默认安装了 Vare tools。这使得操作系统与 `VMware`
    配合得更好，通常提供更多视频选项控制并启用与主机的复制粘贴功能。如果宿主机与 Kali 虚拟机之间的复制粘贴停止工作，Kali 桌面上有一个文件可以重启 `vmtools`，让复制粘贴再次可用：


    ![](img/018.jpeg)


    ### 安装 Metasploitable 2


    Metasploitable 2 是故意脆弱的 Linux 操作系统，作为一个 `VMware` 虚拟机。正如我们上面对 Kali 虚拟机所的操作，我们只需要下载
    Metasploitable 2 虚拟机镜像、解压并使用 `VMware Player` 打开它。


    1. 下载 Metasploitable 2 ([`sourceforge.net/projects/metasploitable/files/Metasploitable2/`](http://sourceforge.net/projects/metasploitable/files/Metasploitable2/))


    2. 解压文件并放在你选择的文件夹中：


    ![](img/0020.jpeg)


    然后通过启动另一个 `VMWare Player` 在 `VMWare Player` 中打开 Metasploitable 2。


    '
