    I used a Pi 0W, but you could do this exact same project using a regular Raspberry
    Pi 3 series, the only difference is that the Pi3/4 and Pi Zero use DIFFERENT video
    cables. So, make sure you have the correct video cable. Other than that, the steps
    for the project would be identical.


    ## Connecting to the Camera


    Wait a few seconds for the camera to boot and auto-connect to your WiFi. Then
    enter the camera’s IP address into a web browser. In a few seconds, you should
    see a screen like the one below:


    ![](images/00228.jpeg)


    Congratulations, you have just built your first surveillance camera with a Raspberry
    Pi!


    There are two icons on the upper left of the title bar. The circle with three
    lines is the settings button. The person icon is used to change users. You are
    logged in by default as a regular user, so there will not be a lot of options
    that can be set. To get to the complete settings available you must be logged
    in as admin (user `admin`, no password) and turn on “Advanced Settings”.


    NOTES: Change the password! Also, a word of caution, don’t enable “Fast Network
    Camera” mode if your camera doesn’t support it, you will lose configuration options
    and your camera may not work.


    MotionEyeOS gives you the ability to set a working Schedule. Here you can set
    the days and times that you want the camera to work, it also works with motion
    captured still images or movies. In the movies section, you can change Recording
    Mode to “Motion Triggered” or “Continuous” for 24/7 recording. Maximum Movie length
    is nice, I set mine to like 15 minutes (900 seconds), so every 15 minutes a new
    movie file is created, instead of one huge massive recording.


    When you are finished using your camera, it is a good idea to shut down the device,
    instead of just powering it off. Shutdown is located in the General Settings:


    ![](images/00229.jpeg)


    ## MotionEyeOS Conclusion


    MotionEyeOS is a great surveillance cam choice because it offers a ton of setup
    options. This helps customize the system to work like you want, be it one that
    captures stills on motion detect, or one that just runs 24x7 and saves individual
    video files. Let’s look at some more surveillance software options. Remember as
    we move along that the programs may not offer as many features, but have increasingly
    better streaming speed, approaching near real time. Next, we will cover RPI Cam
    Web Interface Software. RPI Cam doesn’t have as many software features as MotionEyeOS,
    but does have a slightly better streaming speed.


    ## RPI Cam Web Interface Software


    ![](images/00230.jpeg)


    Tool GitHub: [https://github.com/silvanmelchior/RPi\_Cam\_Web\_Interface](https://github.com/silvanmelchior/RPi_Cam_Web_Interface)


    Tool Wiki: [https://elinux.org/RPi-Cam-Web-Interface](https://elinux.org/RPi-Cam-Web-Interface)


    RPI Cam Web Interface is a great solution for Pi surveillance cams. It offers
    good real time streaming capability with little latency (at lower resolutions),
    and offers options for setting up motion detection and scheduling. I use it on
    a headless Pi Zero W (no keyboard, mouse or video) using Raspbian Buster Lite.


    ### Installing RPI Cam


    For installation, you need to install the Raspbian lite image on a memory card.
    You will want to create a `wpa_supplicant` file with your Wi-Fi password and write
    an empty `ssh` file to your memory card before powering it up the first time.


    ![](images/00231.jpeg)


    After you boot the Pi, we need to turn the camera on in the Pi Configuration:


    - SSH into the Raspberry Pi

    - Login as user: `pi` and password: `raspberry`

    - Type in `sudo raspi-config`

    - Cursor down to “Interfacing Options” and hit “enter”

    - Select “P1 Camera” and hit “enter”

    - And then “yes” and “enter” to enable the camera


    ![](images/00232.gif)


    - Hit enter at the “OK” prompt, then cursor down and hit enter on “Finish”

    - Hit enter on “Yes” to reboot

    - After reboot, enter, `sudo apt update`

    - Then, `sudo apt dist-upgrade`

    - Finally, `sudo apt install git`


    Note: Change your login and SSH passwords!


    Now you can install the RPI Cam software:


    ```bash

    git clone https://github.com/silvanmelchior/RPi_Cam_Web_Interface.git

    cd RPi_Cam_Web_Interface

    ./install.sh

    ```


    Set username and password when prompted. The install can take quite a while to
    run as there are a lot of dependencies. After the RPI Cam Web Interface is installed,
    you view and control the camera from a web interface that can be viewed through
    any web browser that is on the same network.


    ## Connecting to and using the RPi Cam


    Open a web browser and surf directly to the camera interface by entering `IP ADDRESS/html/`
    in the browser. You should see a live stream of the camera and the camera menu
    system:


    ![](images/00233.jpeg)


    The interface is pretty straightforward to use, just click the menu item that
    you need. So, for instance to start a video recording, click “record video start”.
    Click “record video stop” when done. You can change the camera settings by using
    the “Camera Settings” menu. Keep in mind that there are some minor latency issues
    when streaming, but it is much faster now than previous versions.


    To configure motion detection:


    - Click “motion detection start”

    - Then click “Edit motion settings”

    - Configure the settings you need


    Some of the settings can be a little cryptic, check the software Wiki for more
    information. Set up a recording schedule by clicking “Edit motion settings”. Access
    saved data with the “Download Videos and Images” button, as seen below:


    ![](images/00234.jpeg)


    System down.


    ## RPi Cam Conclusion


    MotionEyeOS is a great surveillance cam choice because it offers a ton of setup
    options. This helps customize the system to work like you want, be it one that
    captures stills on motion detect, or one that just runs 24x7 and saves individual
    video files. Let’s look at some more surveillance software options. Remember as
    we move along that the programs may not offer as many features, but have increasingly
    better streaming speed, approaching near real time. Next, we will cover RPI Cam
    Web Interface Software. RPI Cam doesn’t have as many software features as MotionEyeOS,
    but does have a slightly better streaming speed.


    ### Using Raspivid for low-latency Pi Zero W Video Streaming


    ![](images/00235.jpeg)


    The Raspberry Pi Raspbian OS has basic support for displaying video built in.
    These commands can offer near real time camera control but don’t offer the extra
    control options that the previous two provide. If you need real time camera access
    on a Pi without all the bells and whistles, using the built-in commands might
    be the right solution for you. Besides, directly controlling the camera with commands
    that you type in is a lot of fun as well.


    #### Installing Raspivid


    You can use the Raspbian install from the previous topic. All the commands we
    will need for this and the next section are already built into Raspbian, so no
    software installation is necessary.


    - From the RPI Web Interface, click on “Stop Camera”


    or from a terminal:


    ```bash

    cd ~/Pi_Cam_Web_Interface

    ./stop.sh

    ```


    This will stop RPI Cam and allow you to control it using the `raspivid` command.
    If you don’t remove RPI Cam, you will have to run this command each time you reboot
    your Pi.


    #### Viewing Video with Raspivid


    First, we will look at controlling the camera locally, with the Pi connected to
    a monitor and with a keyboard attached, and then we will cover using the camera
    remotely from another computer. As we only have the lite version of Raspbian installed,
    it will boot directly to a terminal prompt.


    Login and enter:


    ```bash

    raspivid -t 10000

    ```

