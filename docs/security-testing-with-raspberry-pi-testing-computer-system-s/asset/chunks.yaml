    ### 启动负载 (Stager)


    - 输入 `usestager`，空格，tab 键，tab 键


    ![](img/00075.gif)


    这将列出所有可用的启动器。注意这里有很多选项。让我们创建一个 Windows 启动批处理文件（bat）。当批处理文件在目标机器上运行时，它将执行一个 PowerShell
    命令，连接到我们的树莓派获取额外的代码，以创建一个远程代理。


    - 回车，`usestager windows/launcher_bat`


    - 然后输入，`info`


    这将显示所有我们可以为启动器设置的选项。在本示例中，我们仅设置 `Listener` 值，但请通读其他选项。要设置 `Listener`，请使用 `set
    Listener` 命令并包含我们在上一步中设置的 Empire Stage 名称，在本例中为 `http`。


    - 回车，`set Listener http`


    如果你愿意，可以设置其他选项，包括输出文件文件名/位置。你可以运行 `info` 命令来检查你的值是否设置正确：


    ![](img/00076.gif)


    - 完成后，输入 `generate`


    ![](img/00077.gif)


    现在输入 `listeners` 返回到监听器提示符。你会看到我们有一个活跃的 `Listener`：


    ![](img/00078.gif)


    现在复制生成的 `/tmp/launcher.bat` 文件并在 Windows 目标系统上运行它。如果目标系统存在漏洞，我们就获得了一个代理（agent）！


    ![](img/00079.gif)


    注意：Windows Defender 在阻止基于 PowerShell 的威胁方面越来越强大，因此 Defender 有很大可能会检测出该脚本为恶意脚本。可以使用其他设置和启动器来绕过
    Defender，但这超出了本书的范围。


    - 要与代理进行交互，如如下所示，输入 `interact [agent name]`：


    ![](img/00080.gif)


    - 输入，`sysinfo`


    ![](img/00081.jpeg)


    如果你输入 `help agentcmds`，将获得一个可以在 shell 中调使用的命令列表：


    ![](img/00082.gif)


    所以，如果我们使用 `whoami`，我们应该得到类似下面的结果：


    ![](img/00083.gif)


    我们可以尝试运行 UAC 绕过；这将我们的 shell 从管理员账户（如果目标是管理员）提升到无所不能的 System 级 shell。如果运行正常，它将创建一个禁用了
    UAC 的新代理。一旦你连接到新代理，你就可以运行 Mimikatz 或使用 `creds` 命令来获取用户凭据。如果你攻破的 Windows 系统没有以管理员身份运行，此操作将无效。你将看到所示所示错误：


    ![](img/00084.gif)


    我们将在书的后后部分查看绕过 UAC 并获取系统凭据的另一种方法。


    当你完成 Empire 后：


    - 输入，`exit`


    - 再次输入 `exit` 以关闭代理和监听器并返回到终端提示符。


    ### 在 PTF 中运行其他命令


    我们刚刚查看了在 PTF 中运行几个命令，还有很多更多！如之前提到的，命令要么位于 `/usr/share` 目录，要么位于 `/pentest/` 目录并按类别排序。花点时间查看这些目录并尝试这些工具。某些程序可能是图形界面化的，所以如果你通过
    SSH 远程使用 PTF，记住你可能需要运行 VNC 或 Xming 它们才能正常工作。


    如果你在 Windows 系统上使用 Xming 和 Putty，请记住，如果需要，可以使用 `startlxde-pi` 命令通过 Xming 运行完整的桌面。这将在你的
    Windows PC 上显示完整的桌面：


    ![](img/00085.jpeg)


    好了，本章就此结束。PTF 中还有很多我们没有涵盖的工具，自己去查看一下它们吧！在下一章中，我们将查看如何在树莓派上运行 Kali Linux。


    ### 资源


    - PowerShell Empire Listeners - [`www.powershellempire.com/?page_id=102`](https://www.powershellempire.com/?page_id=102)


    # 第 4 章


    ## Kali Linux 树莓派


    ![](img/00086.jpeg)


    在本章中，我们将介绍如何在树莓派 3b+ 上安装 Kali Linux。我们还将看到在该平台上运行若干 Kali 工具。由于我假设读者以前使用过 Kali
    Linux，目标是展示如何让树莓派快速运行起来，而不一定是展示如何运行每一个具体的工具。大多数工具的工作方式与在完整 PC 版 Kali 安装中完全一样。尽管某些工具（如
    `Hashcat`）显然没有兼容 ARM 的二进制文件，并且未包含在 Kali Pi 版本中。


    访问 Offensive Security ：


    [`www.offensive-security.com/kali-linux-arm-images/`](https://www.offensive-security.com/kali-linux-arm-images/)


    导航到 Kali ARM 镜像，然后选择 Raspberry Pi 分支。下载适用于树莓派的 Raspberry Pi 版本。由于使用的是 Pi3b+，下载
    64 位版本。


    镜像下载后，你需要使用 Etcher 写入你的 SD 卡：


    ![](img/0087.jpeg)


    将卡插入树莓派，连接键盘、鼠标、网络线和视频线缆。最后接上电源。树莓派将启动并出现登录界面。


    用户：`root`，密码：


    在“Welcome to the”消息处，点击“Use default”。现在你将进入 Kali。花时间熟悉它。它使用 Xfce 相比与常规 Kali 略有不同，但底层是一样的。


    ![](img/0089.jpeg)


    点击“Applications”（应用程序）按钮查看工具。目前非常空虚，我们将修复。有一些我们需要做的清理工作。


    ### 设置 SSH


    我们首先要进行的是重新生成 SSH 密钥。


    打开终端

    - `cd /etc/ssh/`

    - `mkdir default_keys`

    - `mv ssh_host_* default_keys/`

    - `dpkg-reconfigure openssh-server`


    几秒钟后我们有了新的 SSH 密钥。在当前的 Kali 版本中，默认允许 root 登录。这对我们的实验没有问题，但如果你打算将其用于常规用途，需要在 `/etc/ssh/sshd_config`
    中更改这一点。你还将需要使用 `passwd` 命令更改 root 密码。SSH 服务器在 Kali 安装中默认已启动，因此我们只需要 IP 地址。如果你是像我这样的老牌
    Linux 用户，你可能会使用 `ifconfig`，这些过时的命令在我看来更好用且更好看，尽管现在应该使用 `ip` 命令。


    - 输入 `ip a` 查看所有网络地址，或使用 `ip -4 a` 只查看 ip 4 地址。


    ![](img/0090.gif)


    现在你可以像我们在上一章中那样使用 SSH 或 Putty 远程连接到 Kali 系统。


    ### TFT 显示设置


    如果你为树莓派配备触摸屏，现在可以配置它。


    - 在终端中输入 `kalipi-tft-config`

    - 选择 `setup display` 并选择你的显示器

    - 你可能需要旋转显示

    - 更新 Kali 配置并重启


    我们在下一章 Re4son 的 Kali-Pi 中将更多讨论 TFT 显示。


    ### 更新


    我们要做的第一件事是全量更新。


    - 输入 `apt update`

    - 然后，`apt upgrade`

    '
