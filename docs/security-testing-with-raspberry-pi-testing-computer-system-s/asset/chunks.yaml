- raw: "I used a Pi 0W, but you could do this exact same project using a regular Raspberry\
    \ Pi 3 series, the only difference is that the Pi3/4 and Pi Zero use DIFFERENT\
    \ video cables. So, make sure you have the correct video cable. Other than that,\
    \ the steps for the project would be identical.\n\n#### Connecting to the Camera\n\
    \nWait a few seconds for the camera to boot and auto-connect to your WiFi. Then\
    \ enter the camera’s IP address into a web browser. In a few seconds, you should\
    \ see a screen like the one below:\n\n![](images/00228.jpeg)\n\nCongratulations,\
    \ you have just built your first surveillance camera with a Raspberry Pi! \n\n\
    There are two icons on the upper left of the title bar. The circle with three\
    \ lines is the settings button. The person icon is used to change users. You are\
    \ logged in by default as a regular user, so there will not be a lot of options\
    \ that can be set. To get to the complete settings available you must be logged\
    \ in as admin (user admin, no password) and turn on “Advanced Settings”.\n\nNOTES:\
    \ Change the password! Also, a word of caution, don’t enable “Fast Network Camera”\
    \ mode if your camera doesn’t support it, you will lose configuration options\
    \ and your camera may not work.\n\nMotionEyeOS gives you the ability to set a\
    \ working Schedule. Here you can set the days and times that you want the camera\
    \ to work, it also works with motion captured still images or movies. In the movies\
    \ section, you can change Recording Mode to “Motion Triggered” or “Continuous”\
    \ for 24/7 recording. Maximum Movie length is nice, I set mine to like 15 minutes\
    \ (900 seconds), so every 15 minutes a new movie file is created, instead of one\
    \ huge massive recording.  \n\nWhen you are finished using your camera, it is\
    \ a good idea to shut down the device, instead of just powering it off. Shutdown\
    \ is located in the General Settings: \n\n![](images/00229.jpeg)\n\n#### MotionEyeOS\
    \ Conclusion\n\nMotionEyeOS is a great surveillance cam choice because it offers\
    \ a ton of setup options. This helps customize the system to work like you want,\
    \ be it one that captures stills on motion detect, or one that just runs 24x7\
    \ and saves individual video files. Let’s look at some more surveillance software\
    \ options. Remember as we move along that the programs may not offer as many features,\
    \ but have increasingly better streaming speed, approaching near real time. Next,\
    \ we will cover RPI Cam Web Interface Software. RPI Cam doesn’t have as many software\
    \ features as MotionEyeOS, but does have a slightly better streaming speed.\n\n\
    ### RPI Cam Web Interface Software \n\n![](images/00230.jpeg)\n\nTool GitHub:\
    \ [https://github.com/silvanmelchior/RPi\\_Cam\\_Web\\_Interface](https://github.com/silvanmelchior/RPi_Cam_Web_Interface)\n\
    \nTool Wiki: [https://elinux.org/RPi-Cam-Web-Interface](https://elinux.org/RPi-Cam-Web-Interface)\n\
    \nRPI Cam Web Interface is a great solution for Pi surveillance cams. It offers\
    \ good real time streaming capability with little latency (at lower resolutions),\
    \ and offers options for setting up motion detection and scheduling. I use it\
    \ on a headless Pi Zero W (no keyboard, mouse or video) using Raspbian Buster\
    \ Lite. \n\n#### Installing RPI Cam\n\nFor installation, you need to install the\
    \ Raspbian lite image on a memory card. You will want to create a “wpa\\_supplicant”\
    \ file with your Wi-Fi password and write an empty “ssh” file to your memory card\
    \ before powering it up the first time. \n\n![](images/00231.jpeg)\n\nAfter you\
    \ boot the Pi, we need to turn the camera on in the Pi Configuration:\n\n       \
    \ SSH into the Raspberry Pi\n\n        Login as user: pi and password: raspberry\n\
    \n        Type in “sudo raspi-config”\n\n        Cursor down to “Interfacing\
    \ Options” and hit “enter”\n\n        Select “P1 Camera” and hit “enter”\n\n\
            And then “yes” and “enter” to enable the camera\n\n![](images/00232.gif)\n\
    \n        Hit enter at the “OK” prompt, then cursor down and hit enter on “Finish”\n\
    \n        Hit enter on “Yes” to reboot\n\n        After reboot, enter, “sudo\
    \ apt update”\n\n        Then, “sudo apt dist-upgrade”\n\n        Finally, “sudo\
    \ apt install git”\n\nNote: Change your login and SSH passwords!\n\nNow you can\
    \ install the RPI Cam software:\n\n        git clone https://github.com/silvanmelchior/RPi\\\
    _Cam\\_Web\\_Interface.git\n\n        cd RPi\\_Cam\\_Web\\_Interface\n\n       \
    \ ./install.sh\n\nSet username and password when prompted. The install can take\
    \ quite a while to run as there are a lot of dependencies. After the RPI Cam Web\
    \ Interface is installed, you view and control the camera from a web interface\
    \ that can be viewed through any web browser that is on the same network. \n\n\
    #### Connecting to and using the RPi Cam\n\nOpen a web browser and surf directly\
    \ to the camera interface by entering “IP ADDRESS/html/” in the browser. You should\
    \ see a live stream of the camera and the camera menu system:\n\n![](images/00233.jpeg)\n\
    \nThe interface is pretty straightforward to use, just click the menu item that\
    \ you need. So, for instance to start a video recording, click “record video start”.\
    \ Click “record video stop” when done. You can change the camera settings by using\
    \ the “Camera Settings” menu. Keep in mind that there are some minor latency issues\
    \ when streaming, but it is much faster now than previous versions.\n\nTo configure\
    \ motion detection:\n\n        Click “motion detection start”\n\n        Then\
    \ click “Edit motion settings”\n\n        Configure the settings you need\n\n\
    Some of the settings can be a little cryptic, check the software Wiki for more\
    \ information. Set up a recording schedule by clicking the “Edit Schedule settings”\
    \ button. Access saved data with the “Download Videos and Images” button, as seen\
    \ below:\n\n![](images/00234.jpeg)\n\nJust pick the file you want and download\
    \ it. As always it is best to use the “Shut Down System” command to shut down\
    \ when done, instead of just pulling the plug. You can do this in the System menu.\n\
    \n#### RPi Cam Conclusion\n\nRPI Cam Web Interface offers near real time streaming\
    \ with little latency. It also has a lot of features and options. In the next\
    \ two sections, we will cover accessing the camera directly from the command line.\
    \ This will increase our streaming time to pretty much real time with no latency.\
    \ But we lose the added benefits of software options and capabilities that both\
    \ MotionEyeOS and RPI Cam provides.\n\n### Using Raspivid for low-latency Pi Zero\
    \ W Video Streaming\n\n![](images/00235.jpeg)\n\nThe Raspberry Pi Raspbian OS\
    \ has basic support for displaying video built in. These commands can offer near\
    \ real time camera control but don’t directly offer the extra control options\
    \ that the previous two solutions provide. If you need real time camera access\
    \ on a Pi without all the bells and whistles, using the built-in commands might\
    \ be the right solution for you. Besides, directly controlling the camera with\
    \ commands that you type in is a lot of fun as well. \n\n#### Installing Raspivid\n\
    \nYou can use the Raspbian install from the previous topic. All the commands we\
    \ will need for this and the next section are already built into Raspbian, so\
    \ no software installation is necessary. \n\n        From the RPI Web Interface,\
    \ click on “Stop Camera”\n\nor from a terminal:\n\n        “cd ~/RPi\\_Cam\\\
    _Web\\_Interface” \n\n        “./stop.sh”\n\nThis will stop RPI Cam and allow\
    \ you to control it using the raspivid command. If you don’t remove RPI Cam, you\
    \ will have to run this command each time you reboot your Pi. \n\n#### Viewing\
    \ Video with Raspivid\n\nFirst, we will look at controlling the camera locally,\
    \ with the Pi connected to a monitor and with a keyboard attached, and then we\
    \ will cover using the camera remotely from another computer. As we only have\
    \ the lite version of Raspbian installed, it will boot directly to a terminal\
    \ prompt. \n\nLogin and enter:\n\n        raspivid -t 10000"
