    \ install`\n\n以 Wizard 模式启动程序：\n\n- 输入 `python ./nettacker.py --wizard`\n- 输入地址\
    \ `192.168.99.13`\n- 默认线程数\n- 输入文件名\n- 对于“scan methods”，输入 `all`\n\n![](img/0171.jpeg)\n\
    \n- 在 scans 处“enter”排除\n- 现在，在 names and passwords 处“enter”，但如果你愿意也可以输入一些\n- 对于其余提示，按“enter”接受默认答案\n\
    \nNettacker 然后开始扫描并枚举目标：\n\n![](img/0172.jpeg)\n\n目标信息和漏洞在发现时列出。当工具完成后，它会呈现摘要报告：\n\
    \n![](img/0173.gif)\n\n报告保存在目标文件工具数据库中。我们可以添加用户名和密码让 Nettacker 尝试破解攻击。报告提到了 WordPress\
    \ 漏洞。让我们看看是否可以使用 `Sniper` 发现更多关于运行在此服务器的应用的信息。\n\n### 使用 Sniper 扫描 RasPwn\n\n\
    工具作者：`@xer0day`\n\n工具网站：`https://xerosecurity.com/wordpress/`\n\n工具 GitHub：`https://github.com/1N3/Sniper`\n\
    \n我们以前用过 `Sniper`，在这里我们将再次使用它。这次我们将涵盖几个不同的开关来让它检查 Web 服务。但首先，对 `192.168.99.13`\
    \ 地址运行带破解选项的基本扫描：\n\n- `sniper -t 192.168.99.13 -b`\n\n![](img/0174.jpeg)\n\n\
    花点时间阅读报告。接下来，让我们使用“web”扫描开关对同一目标进行 Web 分析扫描，看看是否能获得更多信息：\n\n- `Sniper -t 192.168.99.13\
    \ --mode web`\n\n![](img/0175.jpeg)\n\n这启动了多个扫描程序。注意 Web 扫描中使用了不同的工具。结果随着进行进行显示。\n\
    \n![](img/0176.jpeg)\n\n目录破解需要很长时间，所以你可以使用 `Ctrl-c` 退出。但查看报告的前部分，扫描工具发现服务器上运行着多个\
    \ Web 应用。\n\n如下：\n\n![](img/0177.jpeg)\n\n这包括：\n\n- `192.168.99.13/wordpress3`\n\
    - `192.168.99.13/wordpress4`\n- `192.168.99.13/joomla-2`\n- `192.168.99.13/joomla-3`\n\
    \n我们稍后将用特定的扫描工具扫描这些应用。但让我们简单看一眼 `sn1per` 中的最后一种扫描模式 `webscan`。`webscan` 将深入查看\
    \ Web 应用以寻找漏洞。如果你愿意，可以扫描任何单独测试工具目录，我选择了 `Mutillidae`：\n\n- `Sniper -t 192.168.99.13/Mutillidae\
    \ --mode webscan`\n\n![](img/0178.jpeg)\n\n"
