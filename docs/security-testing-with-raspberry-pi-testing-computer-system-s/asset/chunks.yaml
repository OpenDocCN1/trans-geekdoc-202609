  trans: '


    某些按钮用于启动服务，当服务运行时，这些按钮会变为绿色。因此，如果你在第二个菜单中点击“WWW”，系统上的 Apache Web 服务就会启动。再次点击“WWW”，绿灯会熄灭，Apache
    服务也将停止。FTP & SQL 按钮用于启用和禁用 `Pure-FTPd` & `MySQL` 服务。


    注意：如果你尝试使用 `Mana` 工具包（在稍后的菜单中可用），将会启动一个伪造的强制性门户（captive portal）。如果你在另一台系统上访问 `Kali-Pi`
    的 IP 地址，将看到这个伪造门户：


    ![](img/00137.jpeg)


    网页门户会显示，但 `Mana` 目前无法工作（似乎存在 `IPTables` 的版本问题，且 `Mana` 在工具网站上被标记为“已弃用”（Deprecated），意味着可能不会有更新了）。


    ### RAS-AP


    一个适用于 Pi 的远程访问 Wi-Fi 程序。目前报告显示 `RAS-AP` 了一些问题，其中一个潜在的解决方案是使用 `Pi-Tail` 代替。`Pi-Tail`
    将在本章稍后部分介绍。


    ### Darkstat


    启动 `Darkstat` 实时网络统计工具。该工具监控网络流量并在网页上显示报告。一旦启用该工具，在另一台电脑上打开浏览器并访问 `Kali-Pi` 地址的
    667 端口（即 `172.24.1.114:667`）即可查看图表：


    ![](img/00138.jpeg)


    你也可以通过 SSH 启动 `darkstat` 服务：


    - 输入 `service darkstat start`

    - 然后，打开浏览器并访问 Pi 上的 667 端口（`172.24.1.114:667`）

    - 完成后输入 `service darkstat stop`


    你可以通过编辑 `darkstat` 配置文件 `/etc/darkstat/init.cfg` 来更改 `darkstat` 的默认行为：


    ![](img/00139.gif)


    你也可以从命令行运行 `darkstat`：


    ![](img/00140.gif)


    ### Ntopng


    启动 `Ntop Next Generation` (`ntopng`)，这是另一个网络统计程序。只需点击按钮启动服务，然后导航到 `Kali-Pi` 的端口
    3000（`172.24.1.114:3000`）。使用默认凭据 `admin/ admin` 。首次登录时会提示你更改密码。


    ![](img/00141.jpeg)


    你也可以通过 SSH 远程启动 `ntopng`：


    - 输入 `systemctl start redis-server`

    - 然后输入 `ntopng`


    然后使用浏览器连接到端口 3000（`172.24.1.114:3000`）


    完成后：


    - 按 `ctrl-c` 退出 `ntop`

    - `systemctl stop redis-server`


    ### Menu 3


    ![](img/00142.jpeg)


    通过菜单 3，你可以在终端中启动 `Metasploit` 或 `Kismet`。这些程序的功能与正常启动时一样，因此我在这里不会介绍它们。第二行按钮（`OpenVAS`、`Snort`、`PulledPork`）被锁定——`Kali-Pi`
    网站介绍了如何设置和使用这些按钮背后的程序。让我们花一点时间看看屏幕上的最后一个应用按钮，`SDR-Scan` 按钮。


    ### Freq Show SDR


    如果你有一个 USB `RTL-SDR`，点击 `SDR-Scan` 按钮将启动 Adafruit 应用程序 `Freq Show`。这只是一个用于 Pi
    的射频扫描程序，但在连接的 TFT 屏幕上看起来效果非常惊艳。


    使用 `Freq Show`：


    - 将你的 USB `RTL-SDB` 设备连接到 Pi

    - 点击 `SDR-Scan` 按钮


    你应该会立即看到射频波形显示：


    ![](img/00143.jpeg)


    你可以通过 `Config` 按钮更改频率和采样率。你还可以使用 `Switch Mode` 按钮将其更改为“瀑布图”类型的显示。正如我所说，它基本上就做这些，看起来很震撼。展示给你的朋友看，他们会很惊叹的。你可以在
    Adafruit 网站的这里找到更多关于设置的信息：


    [使用 Raspberry Pi RTL SDR 扫描器的频率 Show](https://learn.adafruit.com/freq-show-raspberry-pi-rtl-sdr-scanner/usage)


    ### Menu 4


    ![](img/0014.jpeg)


    菜单 4 是 `Mana Toolkit` 恶意接入点菜单。此菜单上的所有按钮都涉及启动 `Mana Toolkit` 的不同方法。多年来，`Mana` 是创建恶意接入点的首选工具。遗憾的是，随着最新的
    Kali 软件更新，`Mana` 似乎不再运行，且该项目已被标记为“已弃用”。我不确定此菜单是否会改为其他用途，或者 `Mana Toolkit` 未来是否会升级，但目前……


    ### Menu 5


    ![](img/00145.jpeg)


    菜单 5 是状态页面。


    ![](img/00146.gif)


    ### Pi-Tail


    `Pi-Tail` 是 Re4son 为 Pi 0 W 提供的解决方案。虽然我们没有讨论很多，但我们将在书的后面深入探讨如何使用 Pi 0 W 进行安全测试。


    '
