- raw: "If you are using the card for a Raspberry Pi 3 or 4 series, you are all set.\
    \ When it is finished writing, just eject the card, insert it into the Pi, attach\
    \ all your peripherals, and lastly connect power to the Pi. On first boot, the\
    \ file system will be resized to take up the entire drive and reboot. It will\
    \ then boot to the Raspbian desktop. \n\nOn the second boot, it will present you\
    \ with a quick setup screen.\n\nYou will set the following information:\n\n       \
    \ Geographical location (very important)\n\n        Password (also very important!)\n\
    \n        Video settings\n\n        WiFi Settings\n\nIt will then prompt you\
    \ to update the system software and reboot. You will then be all set to use the\
    \ beautiful Raspbian OS:\n\n![](images/00034.jpeg)\n\nSetup for a Pi Zero W is\
    \ pretty much the same, but with one other optional step.\n\n### Setting up WiFi\
    \ on a Pi Zero W\n\nYou don’t need to do this now, and we will cover how to do\
    \ this again later when we do actually use it. But occasionally on a Pi Zero W,\
    \ you will need to set your WiFi settings before first boot. As there is no built-in\
    \ network card on a Pi0W, you will need to pre-set the WiFi router information\
    \ so that you will be able to remotely connect to the Pi. This is done after writing\
    \ the image, but before you remove the card from the writer. Basically, you need\
    \ to copy the following text to a file, add in your Wi-Fi name and password, and\
    \ save it to the root directory of the SD card. If are doing this in Windows,\
    \ you need to set the file End of Line conversion to Linux format. An easy way\
    \ to do this is to use the program “Notepad ++”, available at [https://notepad-plus-plus.org/](https://notepad-plus-plus.org/).\
    \ \n\nYou can also add an empty file named “ssh” in the root directory of the\
    \ memory card. Doing so automatically enables SSH on the Pi, so you can truly\
    \ run the Pi0W headless (just the memory card and power, no peripherals connected).\
    \ This process is covered in the Raspberry Pi forums and can also be found in\
    \ this Raspberry Pi Spy article1.\n\n        Create a new text file:\n\ncountry=us\n\
    \nupdate\\_config=1\n\nctrl\\_interface=/var/run/wpa\\_supplicant\n\nnetwork={\n\
    \n scan\\_ssid=1\n\n ssid=\"Your Wi-Fi Router Name\"\n\n psk=\"Your Wi-Fi Password\"\
    \n\n}\n\nAnd then, if you are using Notepad ++\n\n        Click “Edit”\n\n       \
    \ Then “EOL conversion”\n\n        And “Set to Linux”\n\nAs seen below:\n\n![Pi\
    \ Zero W Camera 4](images/00035.jpeg)\n\n3.  When finished, save the file in the\
    \ MicroSD card root as “wpa\\_supplicant.conf“.\n\n4.  Also, create an empty file\
    \ named “ssh” with no extension and place it also in root folder.\n\n5.  Insert\
    \ the memory card into the Pi, attach peripherals, and then plug the power in.\n\
    \n6.  Use SSH or Putty to connect to the Pi. Login in with user “pi” and password\
    \ “raspberry”.\n\nAnd that is it! If you are running the Pi0W headless, you don’t\
    \ need a keyboard, mouse or monitor attached as you will connect to the Pi remotely.\n\
    \n### Finding your RPi IP Address\n\nWhen setting up your Pi with DHCP, how do\
    \ you find it on the network? Your Pi will most likely be given a random address\
    \ when you connect it to your network. There are several things you can do to\
    \ locate it. If your Pi has a monitor and keyboard attached. Just drop to a terminal\
    \ and run “ifconfig”.\n\nIf your Pi is running “headless” – without keyboard,\
    \ monitor or mouse:\n\n1.  Check your Router to see what IP address it gave the\
    \ Pi (consult your router user manual).\n\n2.  Use a nmap scan. \n\nThis is probably\
    \ the fastest method, if you have a Linux machine with nmap available:\n\n![](images/00036.jpeg)\n\
    \n3.  Use a program like cSploit (cSploit on Kali NetHunter is one of the most\
    \ useful tools!)\n\n![](images/00037.jpeg)\n\nUse whatever method above is the\
    \ easiest for you. \n\n### Using XMING and Putty\n\nIf you are remotely connecting\
    \ to your Pi from a Windows system, I recommend using Xming and PuTTY, but you\
    \ could use VNC software if you wish. PuTTY is a Windows SSH & Telnet client program.\
    \ Xming is an X Window System Server that allows you to run a graphical “X desktop”\
    \ remotely on Windows. So instead of just having a remote text terminal, you can\
    \ also run all the GUI programs and apps!   \n\nUsing Xming & PuTTY together:\n\
    \n1.  Download & install PuTTY - [https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html](https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html)\n\
    \n2.  Download & install Xming Server - [https://sourceforge.net/projects/xming/](https://sourceforge.net/projects/xming/)\n\
    \n3.  Run PuTTY, and click on “Connection > SSH > X11” in the Category menu. \n\
    \n4.  Now, just click “Enable X11 forwarding”, as seen below:\n\n![](images/00038.jpeg)\n\
    \nNOTE: On a RPi 4 you need to enter, “localhost:10.0” in the “X Display Location”\
    \ box.\n\n5.  Now, click on “Session” in the category Menu.\n\n6.   Lastly, enter\
    \ the Raspberry Pi’s IP address in the Host Name box, as seen below:\n\n![](images/00039.jpeg)\n\
    \nYou can also name and save this session if you want, so you don’t have to keep\
    \ enabling the X11 setting. Then, just click “open” when you are ready to connect\
    \ to your Pi!\n\nOn first connection you will receive this warning:\n\n![](images/00040.jpeg)\n\
    \n7.  Click “yes” to continue.\n\n8.  Next, just login:\n\n        Raspbian:\
    \ user “pi”, password “raspberry”\n\n        Kali Linux: user “root”, password\
    \ “toor” \n\nYou now have a full remote text terminal. But what if we want to\
    \ run graphical programs? You can use Xming for this! \n\n9.  Start Xming with\
    \ the “Xlaunch” shortcut on your Windows desktop.\n\n10.                     \
    \  Select, “One window” and “next”:\n\n![](images/00041.jpeg)\n\nFor a Raspberry\
    \ Pi 4, enter “10” for Display number, else leave it as “0”.\n\n11.                     \
    \ Leave “Start no client” selected and click “next”:\n\n![](images/00042.jpeg)\n\
    \n12.                      Then just click, “next” and “finish” on the next two\
    \ screens.\n\nA large blank Xming Window will open. You can now run any graphical\
    \ program you want and the display should show in your Xming window. You can run\
    \ single apps, like “wireshark” or on Kali-Pi you could run “startxfce4” (“startlxde-pi”\
    \ on Raspbian) to get a full remote X desktop.  \n\nIn the PuTTY Terminal:\n\n\
    ![](images/00043.jpeg)\n\nAfter a few seconds, the Kali Desktop will show up in\
    \ the Xming window:\n\n![](images/00044.jpeg)\n\nThis works pretty well on a Pi3b+,\
    \ but some of the very intense programs do lose connection after a while. But\
    \ it is good enough for our needs. Again, I like Xming, though you could install\
    \ and use a VNC program instead if you wish. \n\n### Kali-Pi’s “Kalipi-Config”\
    \ Configuration Program \n\nIf you are familiar with Raspbian, you know you need\
    \ to run “raspi-config” to perform functions like setting your location settings,\
    \ expanding the file system to fill the memory card, enabling the Pi camera, or\
    \ turning services like SSH On or Off. The same program is available in Re4son’s\
    \ Kali-Pi, it is just called, “kalipi-config”. \n\nAs seen below:\n\n![](images/00045.jpeg)\n\
    \nWell, I think I covered about all I can think of for setup. Let’s start the\
    \ fun stuff!\n\n#### Conclusion\n\nIn this chapter we covered installing VMware\
    \ player and the lab systems. We will use this lab throughout the entire book.\
    \ Practicing security techniques in a safe test lab is one of the best ways to\
    \ improve your skillset. Never attempt to use a new technique or untested tool\
    \ on a production system. You should always know exactly what tools will do, and\
    \ how to undo any changes tools make, before using them on live systems. Many\
    \ large corporations will actually have an exact copy of their production system\
    \ that they use for testing before attempting anything that could change or negatively\
    \ impact the live system.\n\nIn the next chapter, we will look as using the Pentesters\
    \ Framework on Raspbian!\n\n#### Resources\n\n        VMware - [https://www.vmware.com/](https://www.vmware.com/)\n\
    \n        Kali Install Directions - [https://docs.kali.org/category/installation](https://docs.kali.org/category/installation)"
  fmt: "\nIf you are using the card for a Raspberry Pi 3 or 4 series, you are all\
    \ set. When it is finished writing, just eject the card, insert it into the Pi,\
    \ attach all your peripherals, and lastly connect power to the Pi. On first boot,\
    \ the file system will be resized to take up the entire drive and reboot. It will\
    \ then boot to the Raspbian desktop.\n\nOn the second boot, it will present you\
    \ with a quick setup screen.\n\nYou will set the following information:\n\n* Geographical\
    \ location (very important)\n* Password (also very important!)\n* Video settings\n\
    * WiFi Settings\n\nIt will then prompt you to update the system software and reboot.\
    \ You will then be all set to use the beautiful Raspbian OS:\n\n![](images/00034.jpeg)\n\
    \nSetup for a Pi Zero W is pretty much the same, but with one other optional step.\n\
    \n### Setting up WiFi on a Pi Zero W\n\nYou don’t need to do this now, and we\
    \ will cover how to do this again later when we do actually use it. But occasionally\
    \ on a Pi Zero W, you will need to set your WiFi settings before first boot. As\
    \ there is no built-in network card on a Pi0W, you will need to pre-set the WiFi\
    \ router information so that you will be able to remotely connect to the Pi. This\
    \ is done after writing the image, but before you remove the card from the writer.\
    \ Basically, you need to copy the following text to a file, add in your Wi-Fi\
    \ name and password, and save it to the root directory of the SD card. If are\
    \ doing this in Windows, you need to set the file End of Line conversion to Linux\
    \ format. An easy way to do this is to use the program “Notepad ++”, available\
    \ at [https://notepad-plus-plus.org/](https://notepad-plus-plus.org/).\n\nYou\
    \ can also add an empty file named `ssh` in the root directory of the memory card.\
    \ Doing so automatically enables SSH on the Pi, so you can truly run the Pi0W\
    \ headless (just the memory card and power, no peripherals connected). This process\
    \ is covered in the Raspberry Pi forums and can also be found in this Raspberry\
    \ Pi Spy article1.\n\n* Create a new text file:\n\n```\ncountry=us\nupdate_config=1\n\
    ctrl_interface=/var/run/wpa_supplicant\nnetwork={\n  scan_ssid=1\n  ssid=\"Your\
    \ Wi-Fi Router Name\"\n  psk=\"Your Wi-Fi Password\"\n}\n```\n\nAnd then, if you\
    \ are using Notepad ++:\n\n* Click “Edit”\n* Then “EOL conversion”\n* And “Set\
    \ to Linux”\n\nAs seen below:\n\n![Pi Zero W Camera 4](images/00035.jpeg)\n\n\
    3. When finished, save the file in the MicroSD card root as `wpa_supplicant.conf`.\n\
    4. Also, create an empty file named `ssh` with no extension and place it also\
    \ in root folder.\n5. Insert the memory card into the Pi, attach peripherals,\
    \ and then plug the power in.\n6. Use SSH or Putty to connect to the Pi. Login\
    \ in with user `pi` and password `raspberry`.\n\nAnd that is it! If you are running\
    \ the Pi0W headless, you don’t need a keyboard, mouse or monitor attached as you\
    \ will connect to the Pi remotely.\n\n### Finding your RPi IP Address\n\nWhen\
    \ setting up your Pi with DHCP, how do you find it on the network? Your Pi will\
    \ most likely be given a random address when you connect it to your network. There\
    \ are several things you can do to locate it. If your Pi has a monitor and keyboard\
    \ attached. Just drop to a terminal and run `ifconfig`.\n\nIf your Pi is running\
    \ “headless” – without keyboard, monitor or mouse:\n\n1. Check your Router to\
    \ see what IP address it gave the Pi (consult your router user manual).\n2. Use\
    \ a `nmap` scan.\n\nThis is probably the fastest method, if you have a Linux machine\
    \ with `nmap` available.\n\n```\nifconfig\n```\n\n### Using XMING and Putty\n\n\
    When setting up your Pi with DHCP, how do you find it on the network? Your Pi\
    \ will most likely be given a random address when you connect it to your network.\
    \ There are several things you can do to locate it. If your Pi has a monitor and\
    \ keyboard attached. Just drop to a terminal and run `ifconfig`.\n\nIf your Pi\
    \ is running “headless” – without keyboard, monitor or mouse:\n\n1. Check your\
    \ Router to see what IP address it gave the Pi (consult your router user manual).\n\
    2. Use a `nmap` scan. \n\nThis is probably the fastest method, if you have a Linux\
    \ machine with `nmap` available.\n\n```\nnmap\n```\n\n### Kali-Pi’s “Kalipi-Config”\
    \ Configuration\n\nIf you are familiar with Raspbian, you know you need to run\
    \ `raspi-config` to perform functions like setting your location settings, expanding\
    \ the file system to fill the memory card, enabling the Pi camera, or turning\
    \ services like SSH On or Off. The same program is available in Re4son’s Kali-Pi,\
    \ it is just called `kalipi-config`. \n"
  trans: "\n\n如果你使用的是适用于树莓派 3 或 4 系列的卡，那么你已经准备好了。写入完成后，只需弹出卡，将其插入 Pi，连接所有外围设备，最后为\
    \ Pi 接通电源。在首次启动时，文件系统将调整大小以占据整个驱动器并重启。随后它将进入 Raspbian 桌面。\n\n在第二次启动时，它会显示一个快速设置界面。\n\
    \n你将设置以下信息：\n\n* 地理位置（非常重要）\n* 密码（也非常重要！）\n* 视频设置\n* WiFi 设置\n\n然后它会提示你更新系统软件并重启。之后你就可以开始使用漂亮的\
    \ Raspbian 系统了：\n\n![](img/00034.jpeg)\n\nPi Zero W 的设置方法几乎相同，但多了一个可选步骤。\n\n###\
    \ 在 Pi Zero W 上设置 WiFi\n\n你现在不需要执行此操作，我们将在以后在实际使用它时再次介绍如何操作。但在 Pi Zero W 上，偶尔你需要在首次启动之前设置\
    \ WiFi 配置。由于 Pi0W 没有内置网络卡，你需要预先设置 WiFi 路由器的信息，以便能够远程连接到 Pi。这在写入镜像之后、但在从写入器拔出卡之前完成。简单来说，你需要将以下文本复制到文件中，添加你的\
    \ Wi-Fi 名称和密码，并将其保存到 SD 卡的根目录。如果你在 Windows 上进行操作，需要将文件的换行符（End of Line）设置为 Linux\
    \ 格式。一种简单的方法是使用程序“Notepad++”，可以在 [`notepad-plus-plus.org/`](https://notepad-plus-plus.org/)\
    \ 下载。\n\n你也可以在内存卡的根目录下创建一个名为 `ssh` 的空文件。这样做会自动开启 SSH，这样你就可以真正无头运行 Pi0W（仅内存卡和电源，不连接任何外围设备）。此过程在树莓派论坛中有介绍，也可以在这篇\
    \ Raspberry Pi Spy 文章 1 中找到。\n\n* 创建一个新的文本文件：\n\n```\ncountry=us\nupdate_config=1\n\
    ctrl_interface=/var/run/wpa_supplicant\nnetwork={\n  scan_ssid=1\n  ssid=\"Your\
    \ Wi-Fi Router Name\"\n  psk=\"Your Wi-Fi Password\"\n}\n```\n\n然后，如果你使用的是 Notepad++：\n\
    \n* 点击“编辑”（Edit）\n* 然后“ EOL 转换”（EOL conversion）\n* 并“设置为 Linux”（Set to Linux）\n\
    \n如下所示：\n\n![Pi Zero W Camera 4](img/00035.jpeg)\n\n3. 完成后，将文件以 `wpa_supplicant.conf`\
    \ 保存在 MicroSD 卡的根目录下。\n4. 同样创建一个没有扩展名的 `ssh` 空文件，并将其放在根目录。\n5. 将内存卡插入 Pi，连接外围设备，然后插上电源。\n\
    6. 使用 SSH 或 Putty 连接到 Pi。使用用户 `pi` 和密码 `raspberry` 登录。\n\n就是这样！如果你在无头运行 Pi0W，不需要连接键盘、鼠标或显示器，因为将远程连接到\
    \ Pi。\n\n### 查找你的 RPi IP 地址\n\n在使用 DHCP 设置 Pi 时，如何在网络上找到它？当你将 Pi 连接到网络时，它很可能会获得一个随机地址。你可以采取几种方法来定位它。如果你的\
    \ Pi 连接了显示器和键盘，只需进入终端并运行 `ifconfig`。\n\n如果你的 Pi 是以“无头”模式运行——即没有键盘、显示器或鼠标：\n\n\
    1. 检查你的路由器，查看它分配给 Pi 的 IP 地址（请参阅路由器用户手册）。\n2. 使用 `nmap` 扫描。\n\n如果你有一台安装了 `nmap`\
    \ 的 Linux 机器，这可能是最快的方法。\n\n```\nifconfig\n```\n\n### 使用 XMING 和 Putty\n\n在使用 DHCP\
    \ 设置 Pi 时，如何在网络上找到它？当你将 Pi 连接到网络时，它很可能会获得一个随机地址。你可以采取几种方法来定位它。如果你的 Pi 连接了显示器和键盘，只需进入终端并运行\
    \ `ifconfig`。\n\n如果你的 Pi 是以“无头”模式运行——即没有键盘、显示器或鼠标：\n\n1. 检查你的路由器，查看它分配给 Pi 的 IP\
    \ 地址（请参阅路由器用户手册）。\n2. 使用 `nmap` 扫描。\n\n如果你有一台安装了 `nmap` 的 Linux 机器，这可能是最快的方法。\n\
    \n```\nnmap\n```\n\n### Kali-Pi 的“Kalipi-Config” 配置\n\n如果你熟悉 Raspbian，你就知道运行 `raspi-config`\
    \ 来执行某些功能，如设置地理位置、扩展文件系统以填充内存卡、启用 Pi 摄像头或开启/关闭 SSH 服务。在 Re4son 的 Kali-Pi 中也有同样的程序，它被称为\
    \ `kalipi-config`。\n\n"
