    # 使用树莓派进行安全测试


    封面艺术与设计：@alphaomikron


    第 1 章标题图形：@alphaomikron


    版权所有 © 2019 Daniel W. Dieterle。保留所有权利。未经出版者事先书面许可，不得以任何形式或通过任何手段对出版物进行复制、存储在检索系统中或传输。


    所有商标、注册商标和标志均为其各自所有者的财产。


    版本 1.1


    ## 献辞


    献给我的家人和朋友，感谢他们无尽的支持与鼓励。没有他们，我的第 6 个主要写作项目将无法实现。你们对我来说意味着一切！只剩下最后写一本书了！也许……


    Daniel Dieterle


    “没有战术的战略是通往胜利最慢的道路。没有战略的战术是失败前的噪音。” —— 孙子


    “需要是发明之母” —— 未知


    “你们看，我把你们像羊送入狼群一样，所以要像蛇一样机灵，像鸽子一样纯洁。” —— 马福音 10:16 (KJV)


    ## 关于作者


    Daniel W. Dieterle 在 IT 领域工作了 20 多年。在此期间，他曾在一家计算机支持公司工作，为纽约州北部和整个宾夕法尼亚州的数百家公司提供系统和网络支持。他还在一家财富
    500 强企业的数据中心工作过，在常春藤学院的计算机支持部门短暂工作，并在一家电气工程公司担任过。


    在过去的 9 年里，Daniel 作为计算机安全研究员和作者完全专注于安全领域。他的文章发表在国际安全杂志上，并被技术实体和媒体引用。他基于 `Kali Linux`
    的书籍在全球范围内被大学、技术培训中心、政府和私营机构作为教学培训资源。Daniel 协助创建了许多安全培训课程和技术培训书籍，主要基于道德黑客和 `Kali
    Linux`，并乐于帮助该领域的新手。


    Daniel W. Dieterle


    ![](img/00002.jpeg)


    电子邮箱：cyberarms@live.com


    网站：cyberarms.wordpress.com


    Twitter：@cyberarms


    ## 特别感谢


    特别感谢帮助我编写这本书的朋友们。你们的时间、见解和投入我深表感谢。


    Bill Marcy – 我的主编兼朋友，感谢你鼓励我写这本关于树莓派的 50 页安全书籍。另外的 150 多页（左右）只是额外赠品。


    @alphaomikron – 非常感谢你在封面艺术上付出的努力，它太棒了！感谢你持续的友谊，以及那些斯巴达礼物，太赞了！


    Azime Setol – 非常感谢你的见解、鼓励、智慧和幽默！


    我的信息安全家人 – 非常感谢你们与我分享你们的时间、知识和友谊。在我心中，你们都是超级巨星！


