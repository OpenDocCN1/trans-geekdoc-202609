  trans: '


    - 然后点击“播放 (Player)”、“文件 (File)”、“打开 (Open)”

    - 导航到 `Metasploitable.vmx` 文件，选中它并点击“打开”


    ![](img/00021.jpeg)


    它现在会出现在 VMware Player 列表中。


    3. 现在进入 Metasploitable 的“编辑虚拟机设置”，并确保网络接口设置为“桥接 (Bridged)”（如果你喜欢，也可以设置为 NAT，只需确保所有虚拟机都设置为相同的设置）。


    ![](img/00022.jpeg)


    Metasploitable 2 现在已准备就绪。


    ![](img/00023.gif)


    开始启动 Metasploitable 系统，如果系统询问你你是移动了还是复制了它，点击“我已复制它”。你现在应该可以看到 Metasploitable 桌面：


    ![](img/00024.gif)


    4. 登录 - 注意登录提示符上方列出的管理员登录凭据 - 呵呵，安全安全！


    登录名：`msfadmin`


    密码：`msfadmin`


    要退出此虚拟机窗口并夺回鼠标控制权，只需按下 `Ctrl-Alt`。


    ### 设置 Metasploitable 2 的 IP 地址


    默认情况下，Metasploitable 2 的地址设置为“动态 (Dynamic)”。要将其设置为静态 IP，编辑 `/etc/network/interfaces`
    文件并手动设置 IP 地址、子网掩码和网关（这些数字在你的网络中可能会不同）。我使用的 IP 地址是 `172.24.1.218`。


    - 在 Metasploitable2 中导航到网络目录，`cd /etc/network`

    - 输入 `sudo nano interfaces`

    - 修改 `iface eth0 inet dynamic` 行，将“dynamic”替换为“static”


    然后输入 IP 地址、子网掩码和你的路由器网关。它看起来应该像下面的截图：


    ![](img/00025.gif)


    - 完成后，按 `ctrl-x`、`y`，然后按 `enter`

    - 输入 `cat interfaces` 来验证你的更改：


    ![](img/00026.gif)

    - 输入 `sudo reboot` 重启 Metasploitable2


    我们现在已经设置好了 Metasploitable2 和 Kali 系统并准备就绪。要验证 Kali 和 Metasploitable2 是否可以互相看到，使用
    `ping` 命令。


    在 Kali 终端中，ping Metasploitable2 虚拟机


    - 输入 `ping [Metasploitable IP Address]`，例如在我的情况下，将是 `ping 172.24.1.218`

    - 按 `Ctrl-c` 停止


    ![](img/00027.jpeg)


    在 Metasploitable2 中，ping Kali 虚拟机：


    ![](img/00028.gif)


    如果你在两个响应中都看到“64 bytes from …”，那么就可以确定一切都设置好了，它们可以互相看到并正常通信。按 `Ctrl-Alt` 退出 Metasploitable2
    虚拟机。


    ### Metasploitable 3 安装（可选 - 高级）


    我将 Metasploitable 3 作为书中的某些攻击目标。与 MS2 不同，MS3 是基于 Windows 的目标。我喜欢它是因为因为它提供了一套完全不同的服务可供攻击。它还包含了“夺旗赛
    (Capture the Flag)”类型的游戏。通过利用服务，可以访问分散在文件系统中的开发者图片。我将其列为可选，因为我只建议高级用户尝试安装 MS3。最初你必须手动构建
    MS3，而且有很多安装问题。你现在可以获得一个“预安装”版本，但你仍然需要像对待 MS2 一样“构建”它。MS3 似乎在 VirtualBox 中运行得更好。因此，我在运行
    VMWare 的同一台主机上安装了 VirtualBox。你只需要将 MS3 镜像设置为桥接网络，并为它提供与你的 VMWare 虚拟机相同的网络地址，它们就能通信得很好。


    - 下载并安装 VirtualBox：[`www.virtualbox.org/`](https://www.virtualbox.org/)

    - Metasploitable 3 快速启动和完整手册可以在此处找到：[`github.com/rapid7/metasploitable3`](https://github.com/rapid7/metasploitable3)


    一旦构建了 MS3 镜像添加到 VirtualBox 中，打开 VirtualBox 中该虚拟机的网络设置，并将网络适配设置为“桥接 (Bridged)”：


    ![](img/00029.jpeg)


    启动 MS3，登录（用户和密码 = `vagrant`），然后你可以在 Windows 设置中为 MS3 设置网络 IP 地址。


    ### 虚拟机安装总结


    到目前，在本节中涵盖了如何安装 VMWare Player 作为虚拟机主机。然后我们查看了 Kali Linux 和 Metasploitable 2。我们还讨论了可选在同一台
    Windows 主机上通过 VirtualBox 运行 Metasploitable 3。我们将它们都设置为使用相同的网络，以便它们可以相互通信并连接互联网（用于
    Kali 更新）。我们将在书的其余部分使用这种设置。提醒一下，如果你设置了自己的宿主机并使用 DHCP，那么系统的 IP 地址在重启时可能会发生。如果你不确定动态分配的地址是什么，可以在虚拟机中运行
    `ifconfig` (Linux) 或 `ipconfig` (Windows) 来查找它。


    ### 树莓派 (Raspberry Pi) 安装说明


    每一章都将涵盖树莓派是用来做什么的，以及推荐为它安装什么操作系统。如前提到的，我们将在书中介绍许多不同的 RPi 设置。我只是想在开始之前对树莓派介绍几点。


    树莓派 OS 通常涉及：


    - 从互联网下载 RPi OS 镜像

    - 将其提取到 SD 卡


    ### 如何安装 Raspbian


    让我们快速浏览如何在树莓派上安装 Raspbian。对于其他树莓派操作系统，安装也是类似的。再次，这些只是信息，你现在不需要安装操作系统，我们将在章节中进行。但如果你以前没有安装过
    Raspbian，执行安装是一个良好的习惯。你可以在需要时重写内存卡。


    从 Raspbian 下载页面：[`www.raspberrypi.org/downloads/raspbian/`](https://www.raspberrypi.org/downloads/raspbian/)


    选择你需要使用的 Raspbian 版本：


    ![](img/00030.jpeg)


    我们将根据章节使用 Raspbian Buster 桌面版或 Raspbian Buster Lite。最好验证下载文件的 SHA-256 哈希值。如果你使用
    `qBittorent` 下载 Torrent 版本，它会自动验证哈希。这保证了你获得的是未修改的文件。


    文件下载后，只需将你的 MicroSD 内存卡插入电脑的 MicroSD 接口。内存卡将在 Windows 中显示为可移动驱动器：


    ![](img/00031.jpeg)


    现在，只需将镜像写入驱动器。我使用 `balenaEtcher` (Etcher) 写入 Pi 镜像，它非常易用且效果极佳。如果下载镜像是压缩过的（大多数
    Pi 镜像都是 .zip 或 .7z），你可能先解压缩。Etcher 可以在线处理，但速度会慢得多。


    - 下载 `balenaEtcher`，安装并运行 Etcher

    - 选择你的下载镜像，确保驱动器正确并点击“闪存 (Flash!)”


    ![](img/00032.jpeg)


    Etcher 然后将镜像写入内存卡：


    ![](img/00033.jpeg)


