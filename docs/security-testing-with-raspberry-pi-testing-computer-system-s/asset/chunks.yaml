- raw: "When you start the program, you are asked if you want to “persist the ZAP\
    \ Session”. This will store the active session so you can come back to it later.\
    \ For now, just select “no, I do not want to persist this session at this moment\
    \ in time” and click, “start”:\n\n![](images/00117.jpeg)\n\nYou are then presented\
    \ with the main interface. As you can see the screen is divided into three different\
    \ sections – a Sites window on the top left, a quick start/request/response Window\
    \ top right and a message box at the bottom.\n\nQuick Scan & Attack\n\nTo get\
    \ into the action quickly simply enter the address of your target (Mutillidae\
    \ on the Metasploitable2 system) in the “URL to attack” input box and click the\
    \ “Attack” button. \n\n        Enter, “http://172.24.1.218/mutillidae/” and then\
    \ click “Attack”\n\n![](images/00118.jpeg)\n\nThis will spider the entire target\
    \ website and scan it for vulnerabilities. The scan progress and pages found will\
    \ be displayed in the bottom window. When it is finished press “Alerts” to see\
    \ any security issues with the website:\n\n![](images/00119.jpeg)\n\nAnd as you\
    \ can see, ZAP found multiple issues with the website. Each folder contains different\
    \ types of security issues. For now, let’s just check out the first alert, the\
    \ “Path Traversal” folder. Go ahead and click to expand it, and then click on\
    \ the very first alert:\n\n![](images/00120.jpeg)\n\nOn the right side you will\
    \ see the page that has possible issues and the level of risk:\n\n![](images/00121.gif)\n\
    \nOWASP ZAP also explains the error:\n\n“The Path Traversal attack technique allows\
    \ an attacker access to files, directories, and commands that potentially reside\
    \ outside the web document root directory. An attacker may manipulate a URL in\
    \ such a way that the web site will execute or reveal the contents of arbitrary\
    \ files anywhere on the web server. Any device that exposes an HTTP-based interface\
    \ is potentially vulnerable to Path Traversal…\n\n… The most basic Path Traversal\
    \ attack uses the \"../\" special-character sequence to alter the resource location\
    \ requested in the URL. Although most popular web servers will prevent this technique\
    \ from escaping the web document root, alternate encodings of the \"../\" sequence\
    \ may help bypass the security filters. These method variations include valid\
    \ and invalid Unicode-encoding (\"..%u2216\" or \"..%c0%af\") of the forward slash\
    \ character, backslash characters (\"..\\\\\") on Windows-based servers, URL encoded\
    \ characters \"%2e%2e%2f\"), and double URL encoding (\"..%255c\") of the backslash\
    \ character.” \n\nBasically, this means that we can view files or folders on the\
    \ webserver just by using a special sequence. And OWASP ZAP gives us the exact\
    \ command to enter:\n\nhttp://172.24.1.218/mutillidae/?page=%2Fetc%2Fpasswd\n\n\
    The HTTP address above will take advantage of a vulnerable webpage on the Metasploitable\
    \ server. If we enter this URL in a web browser on our Kali system, it will go\
    \ to the Metasploitable server and pull up a certain webpage, the “?page=” part\
    \ followed by the webpage to display.\n\nThe page requested in the alert is “%2Fetc%2Fpasswd”.\
    \ Now this may not look like much, but if you are familiar with Linux (and encoding),\
    \ the command becomes “/etc/passwd”, which is the location of the server’s password\
    \ file!\n\nEntering this entire webpage address in a web browser will return this:\n\
    \n![](images/00122.jpeg)\n\nYou see what appears to be a normal web page, but\
    \ if you look in the center window you see this information:\n\nroot:x:0:0:root:/root:/bin/bash\
    \ daemon:x:1:1:daemon:/usr/sbin:/bin/sh bin:x:2:2:bin:/bin:/bin/sh sys:x:3:3:sys:/dev:/bin/sh\
    \ sync:x:4:65534:sync:/bin:/bin/sync games:x:5:60:games:/usr/games:/bin/sh man:x:6:12:man:/var/cache/man:/bin/sh\
    \ lp:x:7:7:lp:/var/spool/lpd:/bin/sh mail:x:8:8:mail:/var/mail:/bin/sh news:x:9:9:news:/var/spool/news:/bin/sh\
    \ uucp:x:10:10:uucp:/var/spool/uucp:/bin/sh proxy:x:13:13:proxy:/bin:/bin/sh www-data:x:33:33:www-data:/var/www:/bin/sh\
    \ backup:x:34:34:backup:/var/backups:/bin/sh list:x:38:38:Mailing List Manager:/var/list:/bin/sh\
    \ irc:x:39:39:ircd:/var/run/ircd:/bin/sh gnats:x:41:41:Gnats Bug-Reporting System\
    \ (admin):/var/lib/gnats:/bin/sh nobody:x:65534:65534:nobody:/nonexistent:/bin/sh\
    \ libuuid:x:100:101::/var/lib/libuuid:/bin/sh dhcp:x:101:102::/nonexistent:/bin/false\
    \ syslog:x:102:103::/home/syslog:/bin/false klog:x:103:104::/home/klog:/bin/false\
    \ \n\nThe user list from the system’s passwd file – Obviously not something you\
    \ want displayed on your webpage. For every alert that OWASP-ZAP finds, it also\
    \ includes a solution to protect your system from the vulnerability found. As\
    \ seen below:\n\n![](images/00123.jpeg)\n\nHopefully this chapter showed that\
    \ the tools in Kali for the Raspberry Pi work and function just as they do in\
    \ the regular Linux version. But can you add third part tools to Kali Pi? \n\n\
    ### Adding Third Party Tools\n\nKali Linux is the install OS of choice for many\
    \ security related third-party tools. By third party I mean any tool that isn’t\
    \ included in kali or in the Kali repositories. I have had mixed results with\
    \ using them on Raspberry Pis. Some work fine, but I have found a few that require\
    \ library files that just don’t exist yet for the ARM platform. My best advice\
    \ is, if you trust the third-party tool (it’s always good to check tool code and\
    \ try it out in a test environment first), and it recommends using Kali Linux,\
    \ install and try it. Bad case scenario is that it won’t work on the Pi, or worst\
    \ case, it could break your Kali install and you will need to re-write your Pi\
    \ image. This really happens more than you would think. The moral of this story\
    \ is, don’t keep important information on you Kali Pi microSD RAM card!  \n\n\
    ### Fluxion WiFi Attack\n\nFluxion GitHub site: [https://github.com/FluxionNetwork/fluxion](https://github.com/FluxionNetwork/fluxion)\n\
    \nFluxion Wiki: [https://github.com/FluxionNetwork/fluxion/wiki](https://github.com/FluxionNetwork/fluxion/wiki)\n\
    \nFluxion is a Wi-Fi attack and Social Engineering tool. Its capabilities include\
    \ WPA/WPA2 authentication, captive portal and rogue AP attacks. Install and usage\
    \ directions are included on the Fluxion website and Wiki, so we will cover this\
    \ quickly. You will need your USB Wi-Fi adapter for this tool. It is best to run\
    \ this program locally on the Pi. If you want to run it remotely through SSH you\
    \ will also need to run an X-server, like Xming. \n\nInstallation:\n\n       \
    \ git clone https://www.github.com/FluxionNetwork/fluxion.git\n\n        cd fluxion\n\
    \n        ./fluxion.sh\n\nFluxion uses several other tools in the background.\
    \ On usage it will check to see if you have all the required dependencies installed.\
    \ If not, it will prompt you to install them using “./fluxion.sh -I”. \n\n![](images/00124.jpeg)\n\
    \nAfter you select your language, you are prompted to select a wireless attack:\n\
    \n![](images/00125.gif)\n\n        Select “2” for Handshake Snooper\n\n       \
    \ Then “2” again to select your add-in USB WiFi adapter\n\n        Select the\
    \ channel to monitor, use “1 – All channels (2.4GHz)”, unless your Wi-Fi card\
    \ can handle 5GHz\n\n![](images/00126.gif)\n\n        A new screen opens, let\
    \ it run for 5 seconds after you see your target AP appear, then hit “Ctrl-c”\
    \ in that window. \n\n        You will then be presented with all AP’s detected.\
    \ Select the AP you want to target:\n\n![](images/00127.jpeg)\n\n        You\
    \ can skip target tracking\n\n        Next choose your handshake retrieval method\
    \ (aggressive jams clients and forces them to reconnect, which could be illegal\
    \ in some countries)\n\n        Work through the rest of the prompts - It prompts\
    \ you to take the defaults or green highlighted options. \n\n        When it\
    \ is ready, additional screens open and it begins listening for the handshake\
    \ file:\n\n![](images/00128.jpeg)\n\nYou are notified if the attack is successful. "
