- raw: "The events can also be set to fire once or multiple times, and you can add\
    \ multiple triggers, or modify existing ones. As you can see, with using the combination\
    \ of settings you could create a very powerful attack tool. The possible combinations\
    \ are really only limited to the imagination. As such, we will only cover using\
    \ the tool with the default triggers. But I highly suggest the reader check out\
    \ the tool author’s extensive documentation and then try them out. \n\n##### HIDScript\
    \ Editor\n\n![](images/00216.jpeg)\n\nThis is where the magic happens. With the\
    \ HIDScript editor you can create “Ducky”-like scripts that run on the target\
    \ system. The difference is, you can change these scripts on the fly through the\
    \ remote-control interface! When you click on the HidScript menu tab, you will\
    \ see the following display:\n\n![](images/00217.jpeg)\n\nGo ahead and read down\
    \ through the default script, we will run this in a moment. The script sets the\
    \ Keyboard country layout (if you have script problems, make sure this is set\
    \ to your country code). It then sets the typing speed. Notice the typing speed\
    \ is programmable. \n\nThe “waitLEDRepeat” command is next. This command, the\
    \ command syntax and a lot of information on using programming commands in P4wnP1\
    \ is covered in the tool documentation. For now, just know that when you plug\
    \ in the Pi to a target system, nothing will apparently happen other than a change\
    \ in the LED blink pattern. When the LED begins to blink repeatedly, it is in\
    \ a holding pattern, of sorts, until you press the “Num Lock” key multiple times.\
    \ This “removes the safety” and allows the payload to run.\n\nString text is entered\
    \ with the “type” command, notice the “/n” at the end of the line for the “enter”\
    \ key. The rest of the commands are a script to move the mouse around the screen\
    \ and change the typing speed. Simply make any changes you want on the script,\
    \ then click the “Run” button and the script is executed live on the target system.\
    \ \n\nLet’s try it out!\n\n### Running your first script\n\nWe need to shut down\
    \ the P4wnP1, move it to the target system and then run the desired script: \n\
    \n        Click “Generic Settings” on the P4wnp1 interface menu\n\n        Click\
    \ “Shutdown”\n\nWait a few seconds for the Pi to shut down (the power LED will\
    \ go out). Unplug the Pi and move it to the target system. Plug the Pi into the\
    \ target’s USB port using the inside (or middle located) USB connector on the\
    \ Pi Zero W.\n\n        Wait a few seconds for the Pi to connect and configure\
    \ itself to the target\n\nOn the Host system:\n\n        Reconnect to the Pi’s\
    \ Wi-Fi\n\n        Go back into the P4wnP1 control panel\n\n        Click the\
    \ HIDScript menu button\n\n        Click “Run”\n\nThis will cause the payload\
    \ to execute on the target system, through the USB port. We should see notepad\
    \ open, seemingly by itself, and typing appear on the screen:\n\n![](images/00218.jpeg)\n\
    \nWhen done, close Notepad on the target system. How cool is that? On the control\
    \ panel interface, we see a running log of the script execution, and a job completion\
    \ screen:\n\n![](images/00219.jpeg)\n\nIf something goes wrong with a script that\
    \ you made yourself, the execution log at the bottom of the screen is very helpful\
    \ to see where the problem is located. The error will give you the line number\
    \ where it is having issues, making troubleshooting much easier.\n\nLet’s try\
    \ another one! Without removing the Pi from the Target System, we can run an entirely\
    \ different attack script, remotely from our host system. \n\n        From the\
    \ HIDScript Editor menu, click “Load & Replace”\n\n        Select, “MS\\_Snake.js”\n\
    \nNotice the new script is displayed. Read through the script to see what this\
    \ one does.\n\n        When ready, click “Run” \n\n        On the target PC,\
    \ click “Num Lock” multiple times.\n\nMSPaint opens and a box is drawn and then\
    \ multiple lines are drawn in succession – Total Mouse control! Notice too that\
    \ we loaded an entirely different script on the P4wnP1 and executed it, without\
    \ ever disconnecting the Pi from the target!\n\n### Making Your Own P4wnP1 Scripts\n\
    \nRunning pre-made scripts is fun, now let’s try making our own script!\n\n1.\
    \  Select all of the code in the Editor from the previous script and delete it.\
    \ \n\n2.  Now, enter this new script:\n\nlayout('us');\n\ntypingSpeed(10,15)\n\
    \nwaitLEDRepeat(NUM);\n\npress(\"GUI r\");\n\ndelay(500);\n\ntype(\"cmd\\\\n\"\
    );\n\ndelay(1000);\n\ntype(\"start iexplore.exe https://youtu.be/dQw4w9WgXcQ\\\
    \\n\");\n\nIt should look like this:\n\n![](images/00220.jpeg)\n\nWhat do you\
    \ think the script will do? Let’s find out!\n\n3.  When done, click “Run”. \n\n\
    4.  Now, on the target system, hit “num lock” multiple times. \n\nA command prompt\
    \ opens, and in a second, a browser opens and you should see this:\n\n![](images/00221.jpeg)\n\
    \nRick Rolling with P4wnp1! That’s all well and good, but the entire browser window\
    \ comes up and there is an open command prompt on the screen as well. There has\
    \ to be a better way to do this. Well, there is! \n\nLoad the “Helper.js” script\
    \ in the Load & Replace menu:\n\n![](images/00222.jpeg)\n\nDon’t run this script!\
    \ I did that when I was helping alpha test P4wnP1 and asked the tool creator why\
    \ it didn’t work, lol! This script is actually a collection of helper functions\
    \ and scripts that we can use to build our own Scripts. Each script or function\
    \ has a comment before it, explaining what it does. We can use these directly\
    \ in our own scripts or modify them for our own use. \n\nLet’s grab a few of the\
    \ functions from this script and see if we can make our “Rickrolling” script a\
    \ little stealthier. We will use PowerShell in this example instead of the Command\
    \ Prompt. There are two helper scripts that will start and hide the PowerShell\
    \ window after it runs. Once the PowerShell window is open, we will “type” out\
    \ the commands to start a hidden Internet Explorer window, navigate to the Rick\
    \ Astley video on You Tube and play it. There are several ways to do this, here\
    \ is one example1:\n\nlayout('us');\n\ntypingSpeed(0,0)\n\nwaitLEDRepeat(NUM);\n\
    \n//PowerShell Start Function\n\nfunction startPS() {\n\npress(\"GUI r\");\n\n\
    delay(500);\n\ntype(\"powershell\\\\n\")\n\n}\n\n//Hide PowerShell Function\n\n\
    function hidePS() {\n\ntype('$h=(Get-Process -Id $pid).MainWindowHandle;$ios=\\\
    [Runtime.InteropServices.HandleRef\\];$hw=New-Object $ios (1,$h);$i=New-Object\
    \ $ios(2,0);((\\[reflection.assembly\\]::LoadWithPartialName(\"WindowsBase\")).GetType(\"\
    MS.Win32.UnsafeNativeMethods\"))::SetWindowPos($hw,$i,0,0,100,100,16512)')\n\n\
      press(\"ENTER\");\n\n}\n\n//Commands to start, hide and execute PowerShell\n\
    \nstartPS();\n\ndelay(500);\n\nhidePS();\n\ntype(\"$url = 'https://youtu.be/dQw4w9WgXcQ'\\\
    \\n\"); \n\ntype(\"$ie = New-Object -com internetexplorer.application\\\\n\");\n\
    \ntype(\"$ie.visible = $false\\\\n\");\n\ntype(\"$ie.navigate($url)\\\\n\");\n\
    \nGo ahead and Run this script on the target. \n\nA YouTube video should play\
    \ in a hidden window (You will need to use Task Manager to kill the Internet Explorer\
    \ process to stop it). You can save your new script using the “Store” button.\
    \ This is obviously a very basic example and more of a prank type attack. How\
    \ else better though to demonstrate to your Red Team exercise targets that you\
    \ successfully infiltrated their building, than to have a bunch of corporate PCs’\
    \ playing the pwnage video of your choice? As a matter of fact, several years\
    \ ago allegedly a US military hacker team did something similar to computers in\
    \ an Iranian Nuclear facility. At random times all the computers in the lab began\
    \ playing AC/DC’s Thunderstruck at maximum volume. I wrote an article on how this\
    \ could be re-created using a PowerShell script created by Christopher “@obscuresec”\
    \ Campbel. This technique is virtually identical to what we just covered and could\
    \ be modified easily to work with P4wnP1. Article link in the Resources section\
    \ below. I will leave this up to the reader to explore if you so desire. \n\n\
    ### Making your Computer Talk with P4wnP1"
