    Fluxion seemed to work well on the Pi most of the time, but would randomly do
    nothing at times. As mentioned before, getting some tools to run in Kali can be
    challenging at times, it is even more so with the Raspberry Pi versions. Even
    something as simple as running a system update could possibly break some previously
    working tools. Check tool author’s forums for issues, and of course Google is
    your friend. My best advice when using a Pi is to freeze your software versions
    when you have everything working and use it until you absolutely need to update.


    ## Secure Kali-Pi Drop Boxes


    The Kali website has an article on how to create “secure drop boxes” with the
    Pi. These are stand-alone encrypted Raspberry Pis that, as a pentester, you could
    leave on a physical site. As this information could make it harder for a defensive
    team to decipher what is on the Pi, I am not going to cover it, but the Kali article
    can be found here:


    [https://www.kali.org/tutorials/secure-kali-pi-2018/](https://www.kali.org/tutorials/secure-kali-pi-2018/)


    ## How to get remote graphical display in Windows


    You can get a remote Kali graphical interface on Windows using Xming, but the
    instructions have a couple additional steps.


    Setup `putty` to connect to enable x11 forwarding:


    - Under Session enter the target IP

    - Then, click on SSH, and then X11

    - Tick the “Enable X11 forwarding” box

    - Enter `localhost:0` in the x display location box, as seen below:


    ![](images/00129.jpeg)


    Create a new Kali user, replace username with the name for the new user:


    - `useradd -m [insert username]`

    - `passwd [username]`

    - `usermod -a -G sudo [username]`

    - `chsh -s /bin/bash [username]`


    Start Xming:


    - Run `xming` on your system

    - Choose what display you want, I usually choose “one window”


    Next, login through `Putty` using your new user.


    - In the remote terminal, enter, `startxfce4`


    And in a few seconds the Kali GUI should appear in Xming.


    ## Resources:


    - Kali Linux Help Forum - [https://forums.kali.org/forumdisplay.php?7-Kali-Linux-ARM-Architecture](https://forums.kali.org/forumdisplay.php?7-Kali-Linux-ARM-Architecture)

    - Kali Linux Metapackages - [https://www.kali.org/news/kali-linux-metapackages/](https://www.kali.org/news/kali-linux-metapackages/)

    - How to create a new normal user with sudo permission in Kali Linux - [https://esc.sh/blog/how-to-create-new-normal-user-with-sudo/](https://esc.sh/blog/how-to-create-new-normal-user-with-sudo/)

    - New attack on WPA/WPA2 using PMKID - [https://hashcat.net/forum/thread-7717.html](https://hashcat.net/forum/thread-7717.html)

    - Bettercap Caplets - [https://github.com/bettercap/caplets](https://github.com/bettercap/caplets)


    # Chapter 5


    ## Sticky Fingers Kali-Pi


    Tool Author: Re4son


    Tool Website: [https://whitedome.com.au/re4son/kali-pi/](https://whitedome.com.au/re4son/kali-pi/)


    Kali-Pi is a Kali Linux distribution optimized for touch screen usage. Originally,
    Kali Linux on the Raspberry Pi enthusiasts flocked to this distribution because
    Re4son’s kernel fixed a lot of hardware interface issues. The Kernel worked so
    well that it is now included in the Official Kali Linux release. Basically, the
    official Kali Linux and Kali-Pi releases are identical.


    ![](images/00130.jpeg)


    They both boot to the desktop and both come with minimal Kali tools installed,
    so you will need to install Metapackages, just as you did in the official release.
    So why still use Kali-Pi instead of the official release? One of the things that
    isn’t included in the official release is Re4son’s touchscreen menu system. This
    feature allows you to boot Kali right into a touchscreen driven menu system. Several
    tools are already setup in the menu, so literally all you need to do is just navigate
    to the menu screen you want and pick the tool, all using the touchscreen interface.
    As Kali-Pi is basically the same as the official release, we aren’t going to cover
    tool usage in this chapter - They are literally used the same way – It’s Kali
    Linux! What we will cover though is the touchscreen menu and a few of the menu
    tools. If you don’t have a TFT display, and aren’t planning on using the touch
    button menu, there really is no use for Kali-Pi, just use the Official version
    of Kali for the Pi, covered in the previous chapter. If you do have a TFT display
    for your Pi, then read on!


    For this chapter you will need your Raspberry Pi 3(b or b+) and a blank microSD
    card. Full install for the pre-configured image is located here:


    [https://whitedome.com.au/re4son/sticky-fingers-kali-pi-pre-installed-image/](https://whitedome.com.au/re4son/sticky-fingers-kali-pi-pre-installed-image/)


    Basically, just download, write and use the image. Etcher will let you write the
    compressed `.xz` image without expanding it, but if you expand (7zip) before writing,
    it will go much quicker.


    ![](images/00131.jpeg)


    Insert the memory card into your Pi, attach peripherals and power up. If you are
    just using a regular monitor it will look and act exactly like regular Kali. The
    username is `root`, and password is `toor` as well. You can also SSH into Kali-Pi.


    ![](images/00132.gif)


    On difference is that there is a built-in user named `pi` that we will use in
    a minute. But first, let’s cover setting up a TFT display, if you have one.


    ### Setting up a TFT Display


    1. SSH into your Kali-Pi.

    2. Run `kalipi-tft-config`, the screen configuration tool.

    3. Select your display (make sure you pick the correct one).

    4. Select your screen rotation (If you don’t know take the default).


    It will prompt you to reboot when finished. On reboot, you should see the Kali
    desktop appear on your TFT display:


    ![](images/00133.jpeg)


    And that’s it! We should now have the Kali Desktop on our display.


    ### Kali-Pi Button Touch Interface


    Kali-Pi has a multi-menu interface included, but if you want to use it, there
    are a couple configuration steps. Kali-Pi needs to boot to text console, instead
    of the GUI. We also need to add a line to our profile so it automatically starts
    boot.


    1. From a terminal, run `kalipi-config` (available from the `kalipi-tft-config`
    menu).

    2. Select `03 Boot Options`.

    3. Select `B1 Desktop / CLI`.

    4. Then select either `Console` or `Console Autologin`. If you choose Autologin
    you will be prompted to enter a username, I just use the `pi` account.

    5. Select `Finish` and reboot.

    6. Next, we need to edit the user’s profile so the menu auto runs:

    - Navigate to the user’s home directory (`/home/pi`)

    - Enter `nano .profile` (or your favorite editor) to edit the hidden user profile

    - Add this line at the end of the file - `sudo /home/pi/Kali-Pi/menu`


    As seen below:


    ![](images/00134.gif)


    7. Save and exit.


    Reboot the system and it should auto-login as user `Pi`. You will then see the
    touchscreen button interface. This is called `Menu 1` or the main menu:


    ![](images/00135.jpeg)


    The Pi will now boot to the button menu every time you boot up. Don’t forget that
    you can also SSH remotely into the Pi if needed. To use the menu system, simply
    touch the button to select the command you want. For example, touch “Terminal”
    to open a Kali Terminal, touch “X on TFT” to view the Kali desktop on the touchscreen
    display or touch the arrows to get to the additional menus. A description of the
    menus can be found here:


    [https://whitedome.com.au/re4son/topic/list-of-functions-buttons/](https://whitedome.com.au/re4son/topic/list-of-functions-buttons/)


    Let’s take a look at some of the additional menus and their features.


    #### Menu 2


    From the main menu, hit the button with the three right arrows to move to menu
    2.


    ![](images/00136.jpeg)


    ##### WWW, FTP, SQL

