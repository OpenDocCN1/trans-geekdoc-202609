    At the main menu, you will see a status page listed, and it shows our 1 listener
    active. Now we just need to build a payload stager.


    ### Start the Payload (Stager)


    - Type `usestager`, space, tab, tab


    ![](images/00075.gif)


    This lists all the stagers available. Notice there are many options. Let’s create
    a windows launcher bat file. When the batch file is run on a target it will execute
    a PowerShell command that reaches out to our Raspberry Pi for additional code
    that creates a remote agent.


    - Enter, `usestager windows/launcher_bat`


    - Then type, `info`


    This will display all the options that we can set for the stager. For this example,
    we will only set the `Listener` value, but read through the other options. To
    set the `Listener`, use the `set Listener` command and include the name of the
    Empire Stage we set in the last step, in this case, `http`.


    - Enter, `set Listener http`


    You can set other options including the output file name/ location if you wish.
    You can run the `info` command to check to see if your value set correctly:


    ![](images/00076.gif)


    - When done, enter `generate`


    ![](images/00077.gif)


    Now type, `listeners` to return to the listeners prompt. You will see that we
    have a `Listener` active:


    ![](images/00078.gif)


    Now copy the generated `/tmp/launcher.bat` file and run it on a Windows target
    system. If the target system is vulnerable, we get an agent!


    ![](images/00079.gif)


    Note: Windows Defender is getting much better at blocking PowerShell based threats,
    so there is a great chance that Defender will detect the script as malicious.
    There are other settings and launchers you can use to bypass Defender, but this
    is beyond the scope of this book.


    - To interact with the agent, type `interact [agent name]` as seen below:


    ![](images/00080.gif)


    - Type, `sysinfo`


    ![](images/00081.jpeg)


    If you type `help agentcmds` you will get a list of commands you can use from
    the shell:


    ![](images/00082.gif)


    So, if we use `whoami` we should get similar results as below:


    ![](images/00083.gif)


    We can try to run the UAC bypass; this will elevate our shell from an Administrator
    account (if the target is an admin) to the all-powerful System level shell. If
    this runs correctly it will create a new agent with UAC disabled. Once you connect
    to the new agent, you will be able to run Mimikatz or the `creds` command to grab
    the user credentials. If the Windows system that you compromised is not running
    as an administrator, this will not work. You will see the error shown below:


    ![](images/00084.gif)


    We will look at another way to bypass UAC and grab system creds later in the book.


    When you are finished with Empire:


    - Type, `exit`


    - And `exit` again to shut down the agent & listener and return to the terminal
    prompt.


    ### Running Additional Commands in PTF


    We just looked at running a few commands in PTF, there are many more! As mentioned
    previously the commands are either found in the `/usr/share` directory or in the
    `/pentest/` directory sorted by category. Take some time and go through these
    directories and check out the tools. Some of the programs may be graphical, so
    if you are using PTF remotely through SSH, remember you may need to run VNC or
    Xming for them to work properly.


    If you are using Xming and Putty on your Windows system remember that you can
    run a full desktop through Xming if you need to by using the `startlxde-pi` command.
    This will display the full desktop on your Windows PC:


    ![](images/00085.jpeg)


    Well, that wraps up this chapter. There are a lot of tools in PTF we did not cover,
    check them out! In the next chapter will look at running Kali Linux on a Raspberry
    Pi.


    ### Resources


    - PowerShell Empire Listeners - [https://www.powershellempire.com/?page_id=102](https://www.powershellempire.com/?page_id=102)


    # Chapter 4


    ## Kali Linux Raspberry Pi


    ![](images/00086.jpeg)


    In this chapter we will cover installing Kali Linux on a Raspberry Pi 3b+. We
    will also see how to run several Kali tools on this platform. As I assume the
    reader has used Kali Linux before, the goal is to show how to get up and running
    quickly on a Raspberry Pi, not necessarily to show how to run each individual
    tool. Most of the tools work just like they would in a full PC install of Kali.
    Though some of the tools, like `Hashcat`, apparently don’t have ARM compatible
    binaries and are not included in the Kali Pi version.


    Surf to the Offensive Security Website:


    [https://www.offensive-security.com/kali-linux-arm-images/](https://www.offensive-security.com/kali-linux-arm-images/)


    Navigate to the Kali ARM images and then select the Raspberry Pi branch. Download
    the version of Raspberry Pi for the Pi that you have. I used a Pi3b+ for this
    chapter, so I downloaded the Kali Linux Raspberry Pi 3 64-bit image. If you have
    a Pi 4, you must download the Pi 4 version of Kali.


    ![](images/00087.jpeg)


    Once the image is downloaded, all you need to do is write it you your SD Ram card.


    Etcher works great:


    ![](images/00088.jpeg)


    Insert your memory card into the Pi, attach keyboard, mouse, network line, and
    video cable. Lastly, plug in the power cord. The Pi will boot up and give you
    a graphical login screen.


    - Login with User: `root`, Password:


    At the “Welcome to the first start” message, click on “Use default”. You will
    then be presented with the Kali. Take a second and familiarize yourself with it.
    It is slightly different than the regular Kali, as it is using Xfce. But it is
    the same Kali underneath you know and love.


    ![](images/00089.jpeg)


    Click the “Applications” button to see the tools. They are pretty sparse at the
    moment; we will fix that. There are a couple housekeeping things we need to do.


    ### Setting up SSH


    The first thing we will want to do is regenerate the SSH keys.


    - Open a Terminal

    - `cd /etc/ssh/`

    - `mkdir default_keys`

    - `mv ssh_host_* default_keys/`

    - `dpkg-reconfigure openssh-server`


    In a couple seconds we should have new SSH keys.


    In the current version of Kali for the Pi, root login is permitted by default.
    This is fine for our lab, but this is something you would want to change in `/etc/ssh/sshd_config`
    if you were going to use this for regular purposes. You will also want to change
    the root password using the `passwd` command.


    The SSH server is already started by default in the Kali install, so all we need
    is the IP address. If you are an old time Linux user like me you will probably
    use `ifconfig`, the old deprecated commands are easier to use and look nicer in
    my opinion, though you are supposed to use the `ip` command now.


    - Enter, `ip a` to see all the network addresses or `ip -4 a` to only see the
    ip 4 address.


    ![](images/0090.gif)


    Now you can just SSH or use Putty like we did in the previous chapter to connect
    remotely to the Kali system.


    ![](images/0091.jpeg)


    ### TFT Display Setup


    If you have a touch screen display for your Pi, you can configure it now.


    - In a terminal, enter `kalipi-tft-config`

    - Choose `setup display` and pick your display

    - You may need to Rotate the display

    - Update the Kali config and then reboot


    We talk about TFT displays a lot more in Re4son’s version of Kali-Pi in the next
    chapter.


    ### Updates


    The first thing we should do is a full update.


    - Enter `apt update`

    - And then, `apt upgrade`

