    The implications of emotional contagion for group performance are profound and
    can involve both positive and negative emotions. Positive emotional contagion
    can enhance group cohesion and can lead to higher levels of cooperation, better
    problem-solving, and increased motivation. This is particularly relevant in organizational
    settings, where the mood and emotional tone set by leaders can trickle down to
    affect the entire team’s performance (Hennig-Thurau et al., 2006). For example,
    in a study on workplace dynamics, it was found that positive emotions expressed
    by leaders can significantly boost the morale and performance of their teams (Hennig-Thurau
    et al., 2006). On the other hand, negative emotional contagion can lead to increased
    stress and reduced productivity. Left unchecked, negative emotional contagion
    can result in conflicts, decreased motivation, and lower overall productivity.
    Studies in clinical settings have shown that the spread of negative emotions can
    exacerbate mental health issues, such as depression and anxiety, among patients
    and caregivers (*Journal of Business and Psychology* 2011).


    ## Mechanisms of Emotional Contagion


    Emotional contagion is facilitated by several mechanisms. Key among them is a
    process called `mimicry`, where individuals unconsciously imitate the emotional
    expressions of others, leading to a shared emotional experience. Here’s the interesting
    part: This process is largely automatic and can occur without conscious awareness.
    Studies have shown that when people observe others expressing emotions, they tend
    to mimic these expressions, which can then trigger similar emotional states in
    themselves (Hatfield, Cacioppo & Rapson 1994).


    Several factors can influence the extent to which emotional contagion occurs within
    groups. The intensity and frequency of emotional expressions play a crucial role.
    More intense and frequent emotional displays are more likely to be contagious.
    Social context and relationships between individuals also matter. In close-knit
    groups or teams, emotional contagion is more pronounced due to stronger interpersonal
    bonds and greater empathy among members (*PNAS* 2014). Interestingly, the medium
    of communication can also impact emotional contagion. While traditionally studied
    in face-to-face interactions, research has shown that emotional contagion can
    occur in online environments. For instance, large-scale studies on social media
    platforms like Facebook have demonstrated that emotions expressed in status updates
    can influence the emotions of others, even without direct physical interaction
    (*PNAS* 2014).


    ## Individual Susceptibility


    The susceptibility to emotional contagion also varies among individuals. It should
    come as no surprise that some people are more naturally susceptive than others,
    and research has illuminated that certain personality traits can make individuals
    more prone to emotional contagion. For instance, people with high levels of empathy
    or those who are more attuned to social cues are often more susceptible. On the
    flip side, individuals with traits such as psychopathy, characterized by low empathy,
    are less likely to experience emotional contagion (*PLOS ONE* 2021).


    ## Interview with Jaime Pineda


    About two hours and forty-five minutes south of Marco Iacoboni, neuroscientist
    Jaime Pineda sits in his-office at the University of California, San Diego. Like
    Iacoboni, Pineda’s research has contributed significantly to the understanding
    of mirror neurons, consciousness, and empathy, and the two scientists have even
    coauthored some studies. We wanted to learn more about emotional contagion, in
    particular, and about how shared emotional experiences can affect team performance.
    Pineda was uncertain that he’d have much to offer us.


    “I’m not sure how much I can share with you, or whatever could be useful, but
    I’m willing to do it,” Pineda said as we hit `RECORD` and began the interview.
    His humility was admirable, but his prediction was way off—in a short twenty-three
    minutes, Pineda gave quite a lot to think about and, beyond that, take action
    on.


    If you recall, mirror neurons are activated both when an individual performs an
    action and when they observe someone else performing the same action. This mirroring
    mechanism is fundamental to empathy and social bonding because it allows individuals
    to resonate with the emotions of others. According to Pineda, mirror neurons are
    highly sensitive to social and environmental cues. We asked whether mirror neurons
    differentiate between observing a friend or a colleague achieve success versus
    watching someone on another team or someone on TV, and Pineda believes this is
    so.


    “The evidence suggests that mirror neurons do differ based on familiarity,” he
    said. “If you’re familiar with someone, you tend to mirror them more than somebody
    who is unfamiliar. In general, the literature shows that anyone that’s like you,
    similar to you, we tend to mirror them more than somebody who is unlike us.”


    ## Mirror Neurons and Mu Suppression


    The activity of mirror neurons can be measured through a process known as `mu
    suppression`. `mu` rhythms are brain waves that diminish in amplitude when an
    individual engages in or observes movement, providing a biomarker for mirror neuron
    activity. Research has shown that `mu suppression` is linked to the activation
    of mirror neurons, thus serving as a reliable index for studying emotional contagion.
    These brain rhythms can become synchronized when individuals engage in common
    tasks, indicating effective communication and collaboration.


    Pineda explains that synchronized brain activity is crucial for cognitive functions
    such as working memory and attention, and in the context of team dynamics, synchronized
    brain activity among team members can enhance cooperation and collective performance.
    For instance, studies have shown that teams with higher levels of neural synchrony
    perform better in tasks that require close coordination and communication.


    “When brains become synchronized, sort of the analog of that, that these two brains
    are somehow communicating in some way that we really don’t know yet,” Pineda elaborated.
    “And our studies show that things like working memory are affected by how synchronized
    certain parts of the brain are, like the `frontal cortex` needs to be synchronized
    in order for there to be better working memory.”


    ## Psychological Momentum and Leadership


    It’s also clear that emotional contagion can lead to the creation of psychological
    momentum within a team. This momentum is characterized by a sense of collective
    efficacy and motivation, which propels the team toward achieving their goals.
    Pineda highlighted for us that fostering a positive emotional environment is essential
    for triggering this momentum. Leaders and team members can facilitate positive
    emotional contagion by displaying enthusiasm, support, and empathy, which in turn
    can inspire and energize the entire group. Moreover, he shared that the desire
    for social connection plays a significant role in emotional contagion. When individuals
    have a strong desire to connect and empathize with others, they are more likely
    to engage in mirroring behaviors. This social bonding can amplify the positive
    emotions within the group, leading to a self-reinforcing cycle of motivation and
    performance.


    These findings suggest several practical approaches for leveraging emotional contagion
    to build momentum in teams. These include:


    *   Setting positive expectations: Establishing a positive vision and clear goals
    can motivate team members and foster a sense of shared purpose.

    *   Promoting curiosity and empathy: Encouraging team members to be curious and
    empathetic toward one another can strengthen social bonds and enhance emotional
    contagion.

    *   Utilizing neurofeedback: Implementing neurofeedback techniques can help individuals
    synchronize their brain activity, leading to improved cognitive function and emotional
    regulation.

    *   Encouraging meditation: Activities such as meditation can induce synchronized
    brain states, promoting relaxation and reducing stress within the team.


    ##### LEADER ACTIONS

