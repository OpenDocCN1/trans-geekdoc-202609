    If you think about leadership as a process, it’s really about leveraging influence.
    And here’s the thing—the ability to influence others is closely tied to how well
    you communicate. If you want to amplify a spark, you have to be able to communicate
    both the opportunities that spark presents and the reality of it. What does this
    mean in practice? It’s about being clear on three things: Where are we right now?
    Where do we want to go? And how can we take advantage of this moment?


    There’s plenty of research to back this up. Multiple studies show just how important
    leader communication is when it comes to shaping followers’ attitudes and intentions.
    For example, how a leader communicates can boost followers’ motivation to complete
    their tasks, increase their levels of optimism, and even strengthen their sense
    of organizational support.


    David Petraeus in Iraq tried to highlight the ways in which they were making progress:
    We understand it will be a difficult journey, and here are the things that can
    help us understand how the actions we are taking will impact our ultimate objective.
    Whether in sports, business, or politics, it’s that ability to communicate effectively
    that amplifies the ability to influence effectively.


    ## The Role of Leadership in Momentum


    What we’re trying to do is help leaders understand how they can amplify the ability
    to influence others to do things in the best interest of the organization. How
    do we get them to buy in to whatever it is that needs to be done? Not everyone
    is going to see the same thing, so it’s the leader’s job to set the stage and
    define what’s being experienced.


    In Petraeus’s case, it was the ability to communicate the importance of little
    wins—not just to tell his people that they were winning but to do so with credibility—because
    he had told the truth up until then, in good times and bad.


    Talking strictly about momentum, the words leaders say are really important. Leaders
    are what throw fuel—or water—on the spark.


    Sometimes, leaders can actually amplify a negative. And in some of these cases,
    leader communications can stifle productivity and impede momentum. Sometimes,
    loss aversion is the enemy of opportunity.


    ## Data-Driven Strategy


    Where a tasseographer seeks to elucidate meaning from patterns in the remnants
    of a person’s cup of tea, the business analyst seeks to track and predict markets
    and performance through data big and small. Tea leaf reading is a form of entertainment,
    really—not science. But the insights from big data may seem that way, too, to
    an audience untrained in analytics. Without a way to track, measure, or predict
    it, momentum is more easily romanticized as a magical force that without preparation
    or intervention forms an unstoppable snowball effect. But to Guild CEO Rohan Chandran,
    it’s clear that momentum isn’t a wave to ride but rather something you must actively
    create and nurture. And to Chandran, it’s the role of the leader to communicate
    this potential in critical moments.


    Chandran would know a thing or two about that—both in corporate life and in being
    a deep observer of metrics on the sports field. His academic training in economics
    and computer science has contributed to roles at various major companies, all
    of which saw transformational growth through Chandran’s application of data to
    strategy.


    ## Red Teaming and the Yahoooids


    In the modern corporate landscape, “red teaming” plays a critical role. This strategic
    approach involves adopting the mindset of an adversary to identify and address
    vulnerabilities within a company’s operations. Companies engage in red teaming
    to bolster their defenses, ensuring that they are prepared for potential threats.
    It’s a proactive measure that highlights weaknesses before they can be exploited
    by actual adversaries. This form of security activity is indispensable because
    it keeps companies on their toes and introduces intentional friction to avoid
    unforced error. It’s akin to having a constant devil’s advocate challenging assumptions
    and exposing blind spots.


    But there’s a fine line between vigilance and paranoia. Chandran had a front-seat
    view of perhaps one of the greatest errors of self-protectiveness when serving
    as an executive at Yahoo. He tells us the story of a specialized team within the
    organization—the Paranoids—a legendary team within the company, known for its
    dedication to security and innovation during the early days of the internet. The
    team got its name due to its intense focus on security, often adopting a mindset
    of being “paranoid” about potential threats to Yahoo’s infrastructure and services.
    Formed in the mid-1990s, the Paranoids were tasked with protecting Yahoo’s rapidly
    growing web services. As Yahoo expanded, so did the complexity of security challenges,
    ranging from protecting user data to ensuring the integrity of the company’s various
    platforms. The Paranoids were at the forefront of developing and implementing
    security measures to safeguard against emerging cyber threats. And they were incredibly
    good at it.


    The Paranoids were known for their rigorous approach to security, using innovative
    practices to anticipate and mitigate risks. Their culture was one of proactive
    defense, where thinking like an attacker was key to building robust defenses.
    This mindset led to the development of many innovative security practices that
    were ahead of their time. The Paranoids implemented some of the earliest forms
    of web security protocols, including encryption and authentication methods that
    became industry standards. They developed comprehensive incident-response strategies
    that enabled Yahoo to quickly and effectively address security breaches. And the
    team was also involved in educating Yahoo users about security best practices,
    helping to raise awareness about online safety.


    But while the legacy of the Paranoids at Yahoo is significant in that they laid
    the groundwork for many of the security practices used in the industry today,
    it’s the innovation that this team may have stifled that left the most lasting
    mark on the company itself. Instead of seizing opportunities and doubling down
    on sparks of innovation, the input of the Paranoids often stalled progress out
    of fear. Chandran reflects on this period, noting how Yahoo dulled its momentum
    because it was too cautious.


    “Yahoo had the potential; it had everything,” Chandran told us. “Google plus Meta
    combined is what Yahoo could and should have been. And we had the talent, the
    data, and everything to go there.”


    But But despite having the resources to dominate, Yahoo became complacent, satisfied
    with being second place to these rising giants. This mindset of settling for less
    led to missed opportunities and, ultimately, the company’s decline from its former
    glory. Yahoo’s approach—its deference to “paranoia” over innovation—is a cautionary
    tale. At a time when the company could have pushed forward and embraced the rapidly
    evolving digital landscape, there was too much contentment with maintaining the
    status quo. Chandran recalls hearing phrases like “Being second in this market
    overall is not a bad thing,” which encapsulates the mindset that leads to stagnation.


    Chandran’s philosophy on momentum hearkens back to the definition of this phenomenon
    in physics: Momentum equals mass times velocity. “In business, you may not be
    able to change the mass or heft of your company instantly, but you can control
    the speed at which you operate,” Chandran explains. “This speed, when directed
    purposefully, creates momentum.”

