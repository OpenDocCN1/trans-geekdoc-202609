    20 世纪 90 年代后期，Iacoboni 及其在加州大学洛杉矶分校（UCLA）团队进行了突破性的实验，为人类镜像神经元提供了首次证据。这些发现发表在他
    1999 年的开创性论文《人类模仿的皮层机制》中，为社会认知和共情的研究开辟了新途径。这一发现的影响是巨大的。镜像神经元表明，我们的大脑天生共情并理解他人的能力，为古老的格言“设身处地”提供了神经学基础。这种神经镜像过程使人类能够理解他人的行为、意图和情感，从根本上塑造了我们的社交互动和文化发展。


    Iacoboni 的工作证实，镜像神经元不仅关乎模仿动作，还关乎理解背后的意图（《用自己的镜像神经元系统理解他人的意图》，2005 年），以及这些神经元如何影响从学习、语言发展到共情和社交纽带的方方面面，这些神经元在人类体验中的核心地位提供了有说服力的论证（《镜像他人：我们与他人建立联系的新科学》，2008
    年）。


    我们非常激动，Iacoboni 在项目初期就接受了我们的采访。我们通过同事了解了 Iacoboni，他们描述他既在智力上严谨，又富有共情力，这种结合恰恰反映了他的研究方法以及研究本身的主题。比任何时候都更想听听
    Iacoboni 对于镜像神经元与群体动能之间是否存在关系的问题的真实想法。


    “模仿是团队中自下而上建立信任和共情的一种方式，”Iacoboni 与分享道，“在不同的实践中这很容易做到。你可以进行个人练习，也可以构建一种实践，使团队成员之间产生大量模仿，从而产生更强的归属感。”


    Iacoboni 在回答中融入了哲学思考——引用了罗马皇帝马可·奥勒留的话，并强调了斯多葛派思维的核心原则：“真正重要的不是发生在你身上的事，而是你如何反应，”Iacoboni
    告诉我们，团队成员之间的共情甚至可以帮助个体免受错误后负面循环的影响。这并不是镜像神经元影响群体动能（或产生动能的可能性）的唯一方式。镜像神经元与组织动的其他许多方面有关。


    *   **领导者的榜样作用：** 组织中的领导者往往通过他们的行为、工作道德和态度来立标。当领导者表现出高能量、投入和战略愿景时，员工的镜像神经元会引导他们模仿这些行为，在整个组织中产生积极行动和态度的连锁。

    *   **情绪感染：** 镜像神经元在情绪感染中起着至关重要的作用，一个人的情感可以被他人镜像和分享。在组织中，当关键个人或群体表现出积极情绪（如热情和乐观），这些情绪可以蔓到整个组织，增强士气和集体动力。

    *   **共同目标和愿景：** 镜像神经元帮助个体理解并内化他人的意图和目标。在组织背景下，当领导者和经理有效沟通清晰且具有吸引力的愿景时，员工更有可能将自己的目标与这一愿景对齐，创造朝组织目标的统一动能。


    *   **努力协调：** 有效的协作和团队工作通常依赖预测和响应他人行动的能力。镜像神经元增强了这种能力，使团队成员能够同步努力。


    ### 领导者行动


    亨利·福特曾说：“聚集是一个开始，坚持下去是进步，共同合作是成功。”团队氛围可以影响一切。以下是领导者可以采取的三项行动：


    #### 1. 增强心理安全感。

    在《心理安全感的四个阶段》书中，Timothy R. Clark 描述了四个关键“阶段”：

    *   **包容：** 人们感到被接纳。

    *   **学习：** 团队成员感到提问、犯错和提供反馈是安全的。

    *   **贡献：** 团队成员对做出自己的贡献感到自信和舒适。

    *   **挑战：** 团队成员感到他们可以提出质疑或批评。


    #### 2. 通常认可符合预期的团队成员。

    领导者必须奖励成就以激励团队成员。Jack Zenger 和 Joseph Folkman 在 2022 年《哈佛商业评论》上的一篇文章中引用了一项针对数万份
    360 度评估的研究。认可度排名前 10%的领导者其平均投入度百分比为`69.8`。相反，排名后 10%的领导者其平均投入度百分比仅为`27.4`。


    #### 3. 通常寻求反馈。

    为了让领导者理解他们的行为如何被接收，他们必须获得反馈。Sheila Heen 和 Douglas Stone 所著的感谢反馈：接收反馈的科学与艺术》书中详述了一种可以增加获得反馈概率的简单做法。他们鼓励人们不要寻求宽泛、开放式的反馈。相反，他们的研究得出，向人们询问“一件事”更有效。例如，这样的问题可以是：`你鼓励我们继续做的一件事是什么？`获得有效的反馈可以帮助领导者更有效地服务于团队。


