    Not long after that, Brady found Danny Amendola in the end zone for a touchdown.
    Immediately, Belichick lifted two fingers, signaling his team was going for two
    points. They earned the two with a classic bit of Belichickian deception as the
    ball was directly snapped to `White` (rather than `Brady`), who converted. Suddenly,
    the score was 28–20 and, with just under six minutes to play, the contest that
    seemed out of reach was anybody’s game. At that point, a change was noticeable
    when looking at the body language of players on both teams. McCourty summed it
    up: “When we were only down by a touchdown, their players . . their eyes started
    to get big. They knew we were coming. They knew we had `Tom Brady` and no one
    wants to be in a one-score game if he’s on the other side. Our eyes, they started
    to narrow. We were locked in. It was a complete reversal of the first three-and-a-half
    quarters. They had a special teams player who, for most of the game, was barking
    at our sideline, talking trash after every kickoff. When we were down only one
    score, you could see him turn quietly after the kickoff and just jog off the field.
    Now we’re the ones screaming. What people don’t realize is that there are so many
    defensive players on the kickoff that the energy flows right into the next play
    as their offense comes out. And both sides know it. You both feel it. It’s almost
    like an out-of-body experience.”


    With four minutes remaining in the game, Atlanta moved the ball to the New England
    22-yard line, close enough for a field goal that would make any further New England
    comeback unlikely. But once again the Patriots defense answered the call. McCourty
    tackled a Falcons ball carrier for a loss, then `Trey Flower` sacked `Ryan` near
    the 40-yard line. On the next play, the New England defense’s pressure forced
    one of the Atlanta linemen into a penalty, pushing the ball back yet farther.
    The Falcons were certainly moving the ball . . the problem was they were moving
    it in the wrong direction.


    The Patriots forced the Falcons to punt and recovered the punt just inside their
    own 10-yard line. They had a little over three minutes to go ninety yards for
    a touchdown, after which they had to go for two again. `Brady` completed three
    passes in a row to three different players. One tripped and fell running his route,
    got up, and still made the catch. Another, `Julian Edelman`, had the pass tipped
    in front of him, making the pass available to the outstretched hands of no fewer
    than three Falcons players who converged on the ball.


    Game over.


    Except it wasn’t. Somehow, `Edelman` snaked his way among them and came up with
    the catch, the replay showing that his concentration was so absolute you could
    see him pin the ball against the opponent’s leg to keep it off the ground, where
    it would have been ruled incomplete.


    With one minute left to play, `White` ran for a touchdown to bring the Patriots
    within two points of the Falcons. During the two-point conversion, a Falcons lineman
    jumped offsides but still couldn’t prevent `Edelman` from catching a short screen
    pass and stretching the ball over the goal line. At this point, those watching
    the game were witnessing the greatest Super Bowl comeback of all time.


    “The energy is so completely with New England,” Aikman said. “This has been two
    completely different games. I don’t have any idea how the Falcons respond in overtime.”


    They didn’t get the chance. The Patriots won the coin toss and chose to receive
    the ball first. Now well protected by his offensive line, `Brady` proceeded to
    pick apart the Falcons’ defense and brought the Patriots to a first and goal after
    a Falcon defender was whistled for pass interference in the end zone. Two plays
    later, `White` ran it in for yet another New England Super Bowl victory.


    As the confetti fell like snow on the players and the crowds who rushed onto the
    field, a national radio announcer summed it up, saying: “Final score is 34–28
    in overtime, and the New England Patriots have redefined the word momentum here
    tonight.”


    The next morning, this book was born when a sports author gathered a team in Florida,
    turned to a large whiteboard, and scribbled the words `How does a team turn a
    moment into momentum?` Over the next seven-plus years, the project would grow
    to include a retired Army general whose last duty assignment was to serve as the
    chair of the Department of Behavioral Sciences and Leadership at the US Military
    Academy at West Point; a highly respected research scientist from the world of
    academics; and one of the best data analysts working in the worlds of public opinion
    and politics. The list of questions on the whiteboard grew: How do you prepare
    for “the moment”? Can momentum be generated? Can it be extended? What can be done
    if it has turned against you?


    Hundreds of interviews with and thousands of surveys of world-renowned experts,
    championship coaches, military leaders, political campaign strategists, and corporate
    leaders conducted over the past few years led us to the words you hold today.


    One thing became clear: Momentum is real to those we sought to learn from. How
    to prepare for, manipulate, extend, or reverse it became our assignment. This
    book will provide you with a model to do exactly that.


    So, use the energy from that sentence to propel you to the next chapter. Let’s
    go!


    ## Premise: From Flow to Momentum


    When Mihaly Csikszentmihalyi began exploring his theory of “flow,” he was called
    crazy, a crackpot. The venerable professor and researcher was convinced that people
    who found themselves in “flow” were able to stay focused longer and were thus
    capable of greater things. He knew he had felt it while he was writing. He knew
    he had seen it among athletes who seemingly come to a place where they can’t miss.
    But when he proposed this idea that “flow” was a “state” and should be pursued,
    his professional colleagues originally scoffed. Thirty years later, Csikszentmihalyi’s
    seminal book `Flow: The Psychology of Optimal Experience` is not only widely accepted
    but a bestseller that is celebrated as one of the most transformative theories
    in the psychology of performance. We were lucky for a chance to sit down with
    him for a lengthy dinner interview, prior to his passing in 2021, where he shared
    his thoughts on the evolution of “flow” and debated with us the intersection of
    this concept with momentum—both in the experiences of individuals and for teams.


    Flow state has gained a great deal of attention recently as biohackers seek ways
    to tap into this state of intense creativity and productivity, particularly for
    individuals seeking to maximize performance. What has long been known to athletes
    as “being in the zone,” flow state is now widely recognized as a phenomenon in
    no way limited to sports but an almost-euphoric sense of possibility and accomplishment
    with little sense of time, limitations, or practical constraints.


    Flow states have implications for teams, as well as individuals. Emerging science
    is beginning to prove something that has long been theorized: the existence of
    `mirror neurons`, which seem to be the basis for human empathy and intuition.
    These are the chemical messengers that transmit anticipated actions and evoke
    automatic responses from those around us. A simple example: How often have you
    felt like yawning after watching one or two others do so? But in a larger sense,
    `mirror neurons` seem to be the key to how any kind of collective emotion—excitement,
    hysteria, momentum—spreads organically through a group.

