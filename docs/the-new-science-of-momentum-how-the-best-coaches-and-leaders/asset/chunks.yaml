    Resilience, optimism, motivation, and other aspects of team life are influenced
    by belief and mindset. In psychology, a `belief` is a mental state or disposition
    that is often associated with a particular response, whereas `motivation` is the
    force that drives people to act and pursue specific goals or objectives. We can
    characterize the difference between belief and motivation with two questions:
    “Do you think we have what it will take to succeed?” and “Are you inclined to
    do what it will take to succeed?” Leaders must harness the power of belief in
    their teams and create a mindset that maintains people’s motivation to do the
    work.


    ### ACTION 1: Frame things positively


    Positive framing is a technique that involves presenting information in a way
    that influences how it’s perceived and received. There are numerous ways to use
    this practice. Here are three examples: (1) focus on gains—emphasize the benefits
    and opportunities of your message, rather than the costs and risks. You can also
    provide context and comparisons that put your message in a favorable light; (2)
    use positive words—use words and phrases that convey optimism, confidence, and
    enthusiasm; and (3) give examples—provide specific examples that illustrate the
    positive impact of your message.


    ### ACTION 2: Ensure your team has high expectancy


    Psychologist Victor Vroom’s expectancy theory of motivation originally examined
    motivational factors for individuals. But later research concluded the construct
    could also be applied to teams. The theory asserts behavior is motivated by anticipated
    results or consequences, and the intensity of the subject’s work is driven by
    the perception that their effort will lead to a desired outcome. The three major
    components of the theory examine the relationships between task behavior, performance
    outcome, and reward valence. Most importantly, the relationship between task behavior
    and performance outcome is called “expectancy.” In many instances, the relationship
    is characterized by the question “Do I believe that if I try it I can do it?”
    When the expectancy relationship is weak, motivation is lowered. Ensuring that
    your team has strong expectancy can be achieved through a variety of means (for
    example, provide training and resources, create a supportive environment, set
    clear expectations, provide regular feedback).


    ### ACTION 3: Encourage a growth mindset


    This concept was developed by Stanford psychologist Carol Dweck. It involves seeing
    challenges and feedback as opportunities for growth and improvement. You can model
    this by embracing challenges, seeking feedback, and learning from mistakes. When
    Satya Nadella took over Microsoft in 2014, he mandated that his senior leadership
    team read Dweck’s book `Mindset.` Ultimately, he held everyone at the company
    accountable for moving from a “know it all mindset” to a “learn it all mindset.”
    The resulting shift in mindset and culture played a huge role in Microsoft’s ability
    to successfully pivot into becoming a services company (and in doing so unlocking
    more than $2.75 trillion in market capitalization over the course of a decade).


    ## Outcomes and Feedback


    Everyone knows that to be a fighter pilot in the US military you need to have
    good eyesight. That’s just the start. You need a bachelor’s degree, preferably
    in an area such as engineering or math, and exceptional cardiovascular health
    to handle extreme g-forces. You need to excel on a series of tests in reasoning,
    problem-solving, mechanical systems, reading, special apperception, and aviation
    and naval principles. You need to rank strongly in a battery of personality assessments
    regarding stress management, leadership, and decision-making. And all of that’s
    before fight training begins.


    Pilots are responsible not only for their life and limb, and those of the troops
    or civilians they’re deployed to protect, but also for about $100 million in the
    aircraft they’re controlling. The responsibility is high, the stakes are high,
    and recruitment into these positions is fine-tuned to ensure the best possible
    chances of success for the team.


    For a select few elite fighter pilots, joining the Blue Angels flight demonstration
    squadron is an even higher honor and responsibility. Acceptance into the Blue
    Angels program is one of the most prestigious assignments a Navy or Marine Corps
    pilot can receive. It’s extremely competitive, and only the most skilled and experienced
    pilots are chosen. These are the pilots with extensive flight hours, often in
    combat situations, who have exhibited exceptional skills flying in close formations
    with complex aerobatic routines. They have to be carrier qualified, meaning they
    have experience landing on aircraft carriers, and they’re almost always at the
    rank of lieutenant commander or major. These pilots are expected to serve as ambassadors
    for the Navy and Marine Corps, showcasing the professionalism and capabilities
    of these services to the public. In this capacity, Blue Angels don’t just fly
    but also are expected to interact with communities, inspiring young people and
    representing the US armed forces at events across the country.


    Recruitment for the Blue Angels includes an element not often seen in military—or,
    really, most—contexts: peer selection. In this, current members of the Blue Angels
    play a significant role in selecting new team members.


    The Blue Angels operate in an environment where trust and cohesion are paramount.
    The peer selection process is designed to ensure that every member can rely on
    one another implicitly, which is critical for the safety and success of their
    high-risk performances. Blue Angels candidates are closely observed during training
    sessions. Current team members assess how the candidate performs under pressure,
    their adaptability to the team’s specific flying style, and their ability to learn
    and execute the precise maneuvers required. The team looks not only at the applicant’s
    flying skills but also at their personality, how well they work with others, and
    whether they would fit into the team’s close-knit culture. This ensures that the
    pilots chosen are not only capable but also fit well with the team’s culture and
    dynamics.


    Remarkably, the final decision on who is selected is made through a voting process
    by the current members of the Blue Angels team. Each pilot on the team has a say,
    and unanimity is often required for a candidate to be accepted. By comparison,
    while acceptance into other elite military teams such as the Green Berets or Navy
    SEALs includes observation and assessment of how well candidates perform in coordination
    with their peers, the final decisions on who gets in are made by instructors.


    This isn’t the only aspect of the Blue Angels process that is unusually flat or
    egalitarian, rather than hierarchical, in how they operate. Their feedback process
    is too. It’s a rank-free, brutally candid process that requires prospective Blue
    Angels pilots to exhibit not only the aforementioned exceptional eyesight, stamina,
    focus, knowledge, and teamwork. They have to have exceptionally thick skin too.

