- fmt: '

    In McLaughin’s thirty-five years in political consulting, he’s worked for national
    and world leaders—Ronald Reagan, Benjamin Netanyahu, Arnold Schwarzenegger, and
    Donald Trump, to name a few. But, despite the enormity of things he’s seen and
    worked on, to McLaughlin—a math student—the basic goal of a political strategy
    is simple: The currency is public opinion; generally speaking (although not always),
    you need to get to 51 percent, and you need momentum to get there.


    Preparing for momentum in politics, to McLaughlin, is a bit like calculus. “You
    have limits—an upper limit and lower limit. And you’re operating in those limits.
    Public opinion, when it gets information, will accelerate and decelerate, just
    like a curve. I don’t think it moves in a straight line; I think it moves like
    a curve. And there’s inflection points. When enough information is out there,
    and it’s not changing public opinion, then you’ve got to find the next one,” he
    told us. “So when we do surveys for people, we tell them as much as we can find.
    Certainly everybody wants to know their chances of winning and only after that
    ask about their strengths and weaknesses. They want to know the key issues that
    will bring them votes. To consultants, this translates into identifying the critical
    voter groups that would create a majority coalition, and then you’ve got to figure
    out how to use the media to convey information most efficiently.”


    Through all of these moving parts—these data-driven preparations—political momentum
    requires continual tracking of progress using whatever measuring sticks are available:
    donation amounts, number of donors, attendance at rallies, social media engagement,
    polling, web traffic, and even—yes—yard signs.


    “You have to track progress,” McLaughlin said. “You always constantly have to
    be moving toward the majority.”


    • • •


    Across the figurative aisle from John McLaughlin, and across a literal, lively
    living room from us, James Carville looked out of the picture windows that overlook
    the Shenandoah Valley. That overlook history itself.


    Legend has it that some major traumatic events, like battles in war, can leave
    behind an energetic imprint on the environment and that this residual energy plays
    and replays itself out over time, long after the original incident has quieted.
    To the surprise or discomfort of visitors of the Shenandoah Valley, Civil War
    clashes like at Belle Grove still seem to be getting fought out—by apparitions—giving
    modern witnesses a supernatural front seat to the sounds of cannons and the shouts
    of soldiers 160 years later.


    No doubt, the horrors of the Civil War left a deep psychological imprint on the
    nation, perhaps in few places as deeply as in western Virginia—where Union and
    Confederate territories met and to where pivotal battles reshaped the United States
    as we know it. The Battle of Belle Grove was part of the wider Shenandoah Valley
    Campaign of 1864. It began with what looked like a sure Confederate win. These
    forces, led by Lieutenant General Jubal Early, attacked sleeping Union soldiers
    under heavy fog, before dawn. They captured more than twelve hundred Union prisoners
    and more than twenty artillery pieces while forcing multiple Union divisions to
    fall back.


    Union major general Philip Sheridan returned from a meeting in Washington, DC,
    to this scene. He hurried to the battlefield—his arrival both calming and revitalizing
    his troops. The Union took their time from there; they didn’t rush in. Sheridan’s
    team interviewed prisoners and learned that beneath the surface of the Confederate
    attack were hungry, exhausted soldiers. They coordinated a plan and reorganized.
    The Union counterattack began just before 4:00 p.m., joined from the right by
    General G. A. Custer’s First Brigade and from the left by Colonel Thomas Devin’s
    Second Brigade.


    Confederate troops panicked and fell into disorder. Intense fighting led to a
    Union victory, forever weakening the Confederacy’s position in the Shenandoah
    Valley—a region they had relied on heavily for supplies. This valley had been
    considered the “Breadbasket of the Confederacy” due to its rich agricultural assets—wheat,
    apples, and poultry. Its location was central and provided exceptional cover.
    But following Belle Grove, never again would Confederate forces be able to maneuver
    down the valley to threaten the Union capital of Washington, DC.


    Momentum had shifted. Not by chance but through strategy and preparation. Through
    preparing for, seeing, and advancing a spark.


    While the region’s folklore holds that ghosts occasionally reenact the gruesome
    fights of the valley’s past, on a different type of battleground, that of politics,
    Carville would know a thing or two about momentum. Few have changed a landscape—of
    any nature—as dramatically as Carville has done in his field.


    Carville invited us into his home for an interview that was about as uncharacteristic
    as, well, you’d expect given the subject. There wasn’t a quiet corner but rather
    a friendly, constant buzz from the voices of Mary and their friends, and their
    friends’ children. Whether a manifestation of Carville and Matalin’s merged energy
    or in spite of it, the atmosphere was undeniably alive with expectation.


    I set the recorder on an end table next to Carville, about as close as it could
    get. I didn’t want to miss a word, but knew I would. We didn’t recount his personal
    story, but I was already familiar with the basics. Long before Carville’s distinctive
    personality, sharp wit, and unapologetic advocacy for his clients made him one
    of the most recognizable and influential figures in American politics, he had
    climbed a few hills of his own.


    Carville attended Louisiana State University right out of high school but in his
    own words was “less than an attentive scholar” and “had fifty-six-hours’ worth
    of F’s” before he dropped out and joined the United States Marine Corps for a
    two-year enlistment. Carville then returned to LSU, completing his undergraduate
    and law degrees, and worked jobs as a high school teacher and attorney before
    pivoting to his true passion, politics—where the “ranks” and rules are never clear
    clear-cut as they are in the military, and the clients are almost always less
    manageable than those who ring the bell of a law firm.


    But this is exactly the type of field where a rare personality like Carville’s
    thrives.


    As with many of the hundreds of interviews we’ve initiated on this subject, I
    asked Carville to define momentum. His response was a bit different from the usual.
    To Carville, momentum in politics is just as much about who has it as who doesn’t.
    Or rather who had it—and then lost it.


    George H. W. Bush used to talk about ‘Big Mo,’ because they were telling him in
    meetings, ‘You have momentum,’ Carville said just minutes into our conversation.
    “If you go back and look, he actually is one of the few politicians I’ve ever
    known to address it on somewhat of a regular basis.”


    Indeed, President Bush did have periods of high momentum, curtailed in part by
    none other than Carville himself.


    How did Carville and Governor Bill Clinton’s 1992 presidential campaign team engineer
    a win against an incumbent president who had been unfathomably high approval ratings—in
    the 90 percents—just a year before? To those who have come to know Carville’s
    style and approach, few would be surprised that it began with words. Really, with
    three short sentences:


    1. Change versus more of the same.

    2. The economy, stupid.

    3. Don’t forget health care.


    The second on this list—“the economy, stupid”—would become particularly salient,
    finding its way onto billboards, buttons, shirts, mugs, whiteboards, television
    commercials, radio ads, book covers, cartoon strips, debate stages, and... well,
    everywhere. Thirty years later, Carville’s catchphrase would spiral into its own
    set of memes, each with its own author-generated “it’s the fill-in-the-blank,
    stupid” content.

