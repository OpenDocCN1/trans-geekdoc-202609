    `GPU` 通过复杂的数学计算，将 2D 和 3D 数据转换为可以在屏幕上显示的图像。这涉及着色、纹理映射和多边形渲染等任务。与为串行处理设计的 `CPUs`
    不同，`GPUs` 擅长并行处理。这意味着它们可以同时处理成千上万的操作，使其成为图形渲染和其他数据密集型任务的理想选择。科学模拟和数据分析受益于这种同时进行许多计算的能力，从而加速了研发进程。


    黄（Huang）、Malachowsky 和 Priem 清楚地看到，`GPU` 在工程建模、大数据、医学突破和人工智能领域可能会产生变革性的影响。`GPUs`
    的并行处理能力使其成为机器学习和深度神经网络训练的理想工具，因为这些领域的任务需要巨大的计算资源来处理大型数据集和复杂的计算。


    你可能还记得高中物理中的“势能”概念：被储存起来直到释放时刻才释放的能量。想象一个被拉伸的弹簧、一个尚未划燃的火柴，或者一个处于山顶的球——它们尚未运动，但一旦被触发，就会释放出显著的能量。换句话说，势能不是单个实体的特征，而是系统的属性。它产生于组织内部，基于不同部分之间相互施加力的方式：例如与地球的引力，或者在混合时会发生成分相互改变的化学元素。


    在 `Nvidia` 的案例中，势能是通过安静、耐心且不懈的研究不断积累的。2013 年，`Nvidia` 将收入的四分之一以上投入到 `R&D` 中，远超其最大的竞争对手
    `Intel`，并比行业平均水平高出 80%。他们通过投资在为未来到来的时刻做准备。例如，三星（`Samsung`）在 2013 年的 `R&D` 投入仅占收入的
    8.2%，东（`Toshiba`）为 17.1%。


    是内部的员工首先观察到了 AI 的潜力。Malachowsky 的研究人员之一 Bryan Cantanzaro 在早期 AI 领域做过一些开创性的工作，并为团队带来了一些想法。“当时，我正领导着我们的高级研究小组，”Malachowsky
    说。“Jensen 的领导力以及我们执行层的一点在于，我们尊重这里有很多优秀人才且他们有很多绝佳的想法这一事实，我们应该在文化上鼓励他们追求这些想法的最优方案，你懂的，支持他们，让他们完善这些想法。”他将这种方法比作孵化器的概念，创新可以在墙内发生，人们不必离开公司就能尝试新事物。


    “这种情况有很多，”他继续道，“我们总是关注这些才华横溢的人何时何时对某事产生非常强烈的感觉。Bryan 显然觉得 AI 是一件大事。Jensen 抓住了它，并学习了大量相关知识。正是这些优秀的人推动了进程，将这项技术从学术和实验室带出现，并开启了
    AI 革命。”Malachowsky 说，黄精准地捕捉到了这一机会，并调整了 `Nvidia` 的战略，使其在这一领域占据了独特的地位。他们没有等待市场来决定自己的路径，而是利用他们的并行计算能力，专注于
    AI 的潜力。`Nvidia` 的研究人员意识到，他们的 `GPUs`——最初是为图形渲染设计的——也非常适合 AI 和深度学习所需的并行处理。他们致力于开发足够强大且敏捷的计算能力，以满足
    AI 合作伙伴和深度学习任务的复杂需求。


    当那些竞争对手已经是家喻户晓时，他们可能看到过 `Nvidia` 研究投入的报告，但可能对其意义并不太以为意。那些看起来像是绝望或幻觉的行为，实际上是 `Nvidia`
    审慎的准备，为注定要保密近十年的项目奠定了基础。竞争对手并不知道 `Nvidia` 的 `R&D` 努力不仅是为了增强用于游戏的 `GPUs`（这是一个他们已经主导的市场），还为了深耕
    AI、自动驾驶和深度学习。它的策略是耐心：等待完美的市场条件出现后，再发布突破性技术。


    在“AI 热潮”席卷大众市场很久以前，这些项目已经在 `Nvidia` 内部平静地以快速速度推进。他们的工程师和科学家正在不断突破技术所能实现的边界，为未来——即他们的创新将彻底改变多个行业——铺平道路。换句话说，`Nvidia`
    不仅仅是在应对当前的市场需求；它是在为未来的转变做准备，确保在时机成熟时，他们准备好用尖端技术冲锋，填补消费者刚刚意识到自己的需求。


    `Nvidia` 继续准备，继续招募最优秀的人才，并保持尽可能扁平的架构。他们正在为一次火花做准备。


    ### 编辑者注


    当本书准备付印时，推动 `Nvidia` 成为最有价值公司之一的投资界收到了震惊的消息。一家名为 `DeepSeek` 的中国公司声称构建了一个名为 `R1`
    的开源模型，可与 `ChatGPT` 媲美。但 `DeepSeek` 表示他们仅花费了 600 万美元，这只是大客户在这些模型上花费金额的一小部分。一夜之间，Nvidia
    股价下跌了 17%，公司蒸水了 6000 亿美元，这是市场历史上单家公司最大的单日跌幅。一些专家宣布 `DeepSeek` 的发布是“Nvidia 的终结”。有人认为
    `Nvidia` 背后的火花已被熄灭。唯一没有恐慌的人是 Jensen Huang 和他的团队。他们知道，是他们自己产品的一个较旧版本让这家公司构建了该模型。Huang
    沉默了几天，但最终给出了回应，表示投资者“错了”，而且像 `DeepSeek` 这样的产品的出现只会增加世界对更多 AI 模型的渴望。Huang 说：“太令人兴奋了。R1
    开源给全球带来的能量——不可置信。”华尔街并没有花长时间才听到并相信 Nvidia 的信息。公司在几周内就收回了几乎所有的损失价值。


