    布什对伊拉克日益加剧的混乱感到沮丧，这种局面不仅对人类生命，也对他自己的政治遗产构成了威胁。因此，他被由佩特鲁斯执掌的“新道路”的承诺所打动。总统向美国民众一次又一次强调了这一点。根据一份报告，在佩特鲁斯开始指挥的前六个月里，布什在演讲和新闻发布会上提到佩特鲁斯的名字超过了
    150 次。


    佩特鲁斯本人敦促人们保持耐心和信任。挑战将是巨大的，但这位将军拥有一套战略方法，他认为只要坚持下去，就能证明其具有变革性。他成为了反叛行动的公众脸面，以以前所未有的程度直接与美国民众及其士兵进行交流。幸运的是，佩特鲁斯深受士兵和政治家的高度信任，他利用这种信任创造了“战略性耐心”。


    佩特鲁斯此前的经历赋予了他极高的“信任方程式”分值。最重要的是，由于他的学术背景和对反叛行动的深刻理解，他被认为非常有能力。例如，在之前的项任务中，佩特鲁斯曾与海军陆战队中将詹姆斯·F·阿莫斯共同监督了陆军《野战手册
    3-4 反叛行动》的制定。此外，他曾成功领导第 101 空降师团在伊拉克摩苏尔行动，利用了国家建设和反叛行动准则。佩特鲁斯的能力、他在以往高可见度指挥任务中的记录，以及对国家指挥权威利益的清晰理解，都贡献了他的信任水平和威望。


    通常情况下，政治家任命负责问题公关的人至少会“给猪涂上口红（粉饰太平）”。但佩特鲁斯采取的做法恰恰相反。2007 年 5 月，佩特鲁斯告诉《华盛顿邮报：“这是一个在变得容易之前变得困难的时期。”佩特鲁斯并没有错。在他领导的前几个月里，用这位西点军校的话来说是“极其痛苦的”。轰炸在增加，死亡人数也随之增加。仅巴格达的暴力事件中，每天就有超过五十人死亡。氯气等化学武器首次投入，并在三个城市发生爆炸。在那段时间，平均每天发生一次汽车炸弹。要求美国从伊拉克撤出的声音日益高涨。


    ### 增援 (The Surge)


    然后情况发生了变化。那种变化就是“增援”。


    2007 年 2 月 10 日，佩特鲁斯发表了指挥 `MNF-I` 后的首次演讲。这是他在伊拉克的第三次任期，也是第二十八个月。但他那天说的话与他迄今所看到的一切完全反转。他向我们回忆那一刻时依然敏锐，仿佛他几分钟前还握着麦克风。


    “你接过指挥权，将旗帜交给士官，走向讲台，我说：‘我们要与民众生活在一起并保护他们，因为这是我们实现目标的唯一途径’”佩特鲁斯回忆道。“但这与我们之前所做的完全相反。在此之前，我们一直在从社区撤出，向大型基地集结，并将安全责任交给伊拉克安全部队，但由于暴力程度已经变得如此糟糕，他们已无法应对了。”


    对于他的士兵来说，佩特鲁斯刚刚传达了“以人口为中心”的战略，他们被要求深度融入伊拉克社区。


    用佩特鲁斯的话说，他们之前的做法和现在开始做的事之间有着“180 度的差异”。这没有比这更大的差异了，”他反思道，并注意到自己对新战略方向周围的怀疑态度是何其敏锐。国会尤为怀疑。在佩特鲁斯的确认听证会期间，他被要求同意在六个月后回来汇报结果。而这恰恰是许多人开始看到增援影响所耗费的时间。


    佩特鲁斯承诺，在汇报进展时会“对事实守信”——他将“抢在坏人抢占头条新闻之前，但仅限于已知真实、准确的信息”。不会有粉饰太平（给猪涂口红）。


    ### 清除、稳固、重建 (Clear, Hold, Build)


    但进展确实出现了。


    这种战略的转变被俗称为“清除、稳固、重建”——即美国将首先清除某个区域的叛乱分子并确保其安全，然后维持持续存在以稳固该地区，最后投入资源重建基础设施、基本服务和地方治理。


    然而，所有这些步骤都需要美国处理伊拉克的方式发生重大转变，首先是从美军人数的大幅增加开始。又部署了约三万名士兵，特别是在巴格达和安巴尔省。目标是让士兵饱和这些地区——在社区内创造肉眼可见的存在，保护民众，与当地领袖接触，并最终赢得伊拉克人的信任。


    饱和这些城市和社区并非易事。佩特鲁斯在所有能触及的地方建立了战斗哨所和巡逻基地，将大部分注意力集中在暴力活动最核心的区域。他们将每个哨所围起来以控制人员流动，并利用了当时可以想象的一切手段——生物识别卡、爆炸物探测犬、X
    射线等。


    社区的暴力越少，建立的信任就越多。美国及其盟友重建了诊所、市场和电网，每项行动都强化了上升而非下降的趋势。


    这一行动的核心特征是美军获得了当地逊尼部落领袖的合作，这些人反过来将帮助对抗基地基组织和其他极端组织。在某些情况下，这让以前的叛乱分子变成了盟友，并涉及对其他可能成为恐怖分子个人的康复。佩特鲁斯的团队会对伊拉克俘俘进行评估，识别出极极端成员，将他们转移到独立的最高安全设施中，然后与其他人合作说服他们改造。佩特鲁斯知道，虽然加强伊拉克安全部队的培训和能力需要巨大的努力，但最终，这将为安全责任移交给伊拉克当局铺平道路。'
- fmt: "\n### Get the Big Ideas Right\n\nAt the heart of any successful strategy is\
    \ the formulation of the “right big ideas.” Petraeus emphasizes the importance\
    \ of grounding these ideas in reality and keeping them fresh. “This is the basis\
    \ for what will become momentum,” Petraeus said, emphasizing that by far this\
    \ first task is the hardest. “If you don’t get these right, I don’t care how good\
    \ you are. All the other tasks, you can be the most brilliant, charismatic, compelling\
    \ communicator, you can set the greatest example, provide inspiration, energy,\
    \ oversight, all the rest of that, and even have a good plan for how you refine\
    \ the big ideas. But if you don’t get the big ideas right up front, and frankly,\
    \ if you don’t keep them current, if you don’t keep them refreshed and renewed\
    \ and adapted and refined—the rest of it doesn’t matter.”\n\nClarity of objective\
    \ and purpose is central, and it enables the ability to measure outcomes against\
    \ intended results. Andy Grove, the former CEO of `Intel`, used an `OKR` framework\
    \ (`Objectives and Key Results`) to highlight the need to have clarity regarding\
    \ what an organization is intent on achieving.\n\n### Communicate the Big Ideas;\
    \ No Spin\n\nOnce the right big ideas are established, effective communication\
    \ is paramount. Petraeus understood that buy-in from all stakeholders, including\
    \ the Iraqi people, was essential. He noted, “Everyone has to understand what\
    \ it is we’re trying to do, why we are going about it in that way” and that “we\
    \ want to get as much agreement and support as we possibly can.” His insistence\
    \ on transparent, fact-based communication was pivotal in maintaining the credibility\
    \ of his approach. This meant, at first, communicating failures as well as successes.\
    \ While communicating good news is easier than bad, “you have to communicate the\
    \ truth,” Petraeus insists. “Don’t try to spin, because if you spin, you erode\
    \ the reputation of the organization, of the leader, and then your communication\
    \ efforts are at risk, and then, they are typically not as effective.” \n\nPetraeus’s\
    \ tactic with communicating the truth didn’t always sit well with some on his\
    \ side. One mentor of Petraeus came to him, worried about what he described as\
    \ a “public relations problem” for the general. Petraeus’s response was incisive:\
    \ “Sir, this is not a public relations problem. This is a reality problem. And\
    \ once the reality truly does measurably change for the better, our communications\
    \ challenge will be much less, and ultimately it will go away.”\n\n### Lead Implementation\
    \ and Train for Excellence\n\nSuccessful leadership is not confined to formulating\
    \ ideas and communicating them. It extends to overseeing their implementation.\
    \ To Petraeus, this means leaders “being the example, the energy, the inspiration\
    \ . . tracking the great people, keep developing them, and allowing those not\
    \ measuring up to move on to something else.” Petraeus exemplified this by providing\
    \ hands-on guidance to his team, tracking metrics rigorously, and adapting strategies\
    \ when needed. “There were events that we did several times a week, to walk apatrol\
    \ with a unit, somewhere in Iraq, at least twice a week,” he said. “So I can actually\
    \ see it for myself on the ground, which had the added credibility, frankly, of\
    \ sharing a little bit of risk and degree of hardship with those soldiers who\
    \ were endeavoring to secure and serve the Iraqi people together with our Iraqi\
    \ security forces partners.”\n\nIn other words, Petraeus didn’t expect just his\
    \ troops to integrate with the Iraqi people; he himself did so too. This contributed\
    \ to Petraeus’s personal rapport with his people as well as his ability to more\
    \ meaningfully understand their strategic position and track and adjust course\
    \ as needed.\n\nBut for every successful implementation, adequate training must\
    \ come first. In the military, there’s a structured and institutionalized approach\
    \ to professional development. “It’s not optional,” Petraeus explained of the\
    \ mandatory training that military personnel at all levels undergo, including\
    \ basic training, specialized training, advanced courses, and impressive, sequential,\
    \ professionalism programs. Petraeus recognizes that few other government or civilian\
    \ organizations can match what the military requires of its people as far as training,\
    \ and that smaller organizations particularly struggle to allocate resources for\
    \ it. While Petraeus lauds the benefits of formal study to developing leaders,\
    \ he recognizes this may not be possible for all organizations to provide. “You\
    \ can make up for this lack of formal study by very extensive self-study,” he\
    \ said, “by reading about others who have gone before you and your profession,\
    \ others generally, and in any major leadership positions—you know, biographies,\
    \ histories, and so forth.”\n\nResearch supports this idea. For example, David\
    \ Moynihan, Sanjay Pandey, and Bradley Wright concluded that when leaders clearly\
    \ articulate behavior expectations in terms of both organizational and individual\
    \ employee practices and insist on high levels of performance in order to achieve\
    \ organizational goals that clearly communicate high but reasonable performance\
    \ expectations, there’s a measurable increase in employees’ understanding and\
    \ confidence in their work.\n\n### Collect Data and Refine Through Feedback\n\n\
    This leads to the final task, which to Petraeus is too often overlooked: refining\
    \ the big ideas. Petraeus explained this task as the process of “sometimes adding\
    \ new big ideas, sometimes discarding some, sometimes modifying or adapting. .\
    \ . . And then you do it again and again and again.” This ongoing process of refinement\
    \ ensured that the strategy remained agile and responsive to changing circumstances.\
    \ How did Petraeus refine? Through the careful monitoring of objective, key indicators\
    \ like high-visibility attacks, sectarian violence, and civilian casualties due\
    \ to this violence. By relentlessly focusing on these metrics and adapting strategies\
    \ accordingly, he started to see signs of progress. “For momentum to be meaningful,”\
    \ Petraeus said, “it has to be real, it has to be fact based, it has to be, again,\
    \ shown through objective, rigorous metrics.”\n\nThe Army’s `Doctrine Publication\
    \ 3-0, Operations` articulates the concept of seizing, retaining, and exploiting\
    \ the operational initiative, which is the military’s focus of gaining momentum.\
    \ Part of the concept highlights how “effective information management to process\
    \ information quickly is essential for staying inside the enemy’s decision-making\
    \ cycle. Combined with effective planning, information management helps commanders\
    \ anticipate enemy actions and develop branches, sequels, or adjustments.”\n\n\
    Petraeus recognized that military efforts alone would not bring lasting stability\
    \ to Iraq. He worked to facilitate political reconciliation among Iraq’s various\
    \ sectarian and ethnic groups, particularly between Shia and Sunni militias. And,\
    \ through all of this, he made good on his promise of unprecedented transparency\
    \ in communications to world audiences.\n\n“By the six-month mark, our casualties\
    \ were now coming down very significantly. Iraqi casualties were down. But the\
    \ major indicators of the success, the growing momentum of this campaign, were\
    \ really quite clear. And those, again, were overall attack numbers, the sectarian\
    \ violence numbers,” Petraeus said. He brought in data experts from various intelligence\
    \ agencies to support the collection of metrics, to challenge the data collected,\
    \ and to resolve discrepancies. Violence had decreased more than 90 percent. It\
    \ began to look not just possible but probable that Iraqis would be able to achieve\
    \ self-governance.\n"
