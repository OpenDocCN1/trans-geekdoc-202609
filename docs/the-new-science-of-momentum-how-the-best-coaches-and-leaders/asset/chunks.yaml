    政治动力通常集中在候选人和议题政治上。但社会变革背后的组织也面临着类似的动态。在过去的几十年里，美国大麻的获取途径经历了了巨大的变化。最初只是在少数几个州对医疗用途或低
    THC 产品的有限许可，现在已演变为全国性的转变，目前有超过三分之二的州允许使用医疗大麻，近一半的州允许娱乐使用。截至 2024 年，已有 23 个州实现了成人娱乐大麻合法化，与
    2012 年率先开展娱乐合法化的两个州——`Colorado` 和 `Washington` 相比，这代表了重大的扩张。这种快速变化反映了不断变化的公众态度、对大麻用于治疗和娱乐目的接受度的日益提高，以及对其经济潜力的日益认可。这种扩张引发了关于监管、公共健康和合法化社会影响的重要问题，为未来大麻可能在联邦范围内合法化铺定了道路。


    这种转变从远处看可能是自然形成的，但很大程度上是朝向变革共同努力的结果。我们的朋友、健康政策顾问 `Tamara Demko` 的研究为我们提供了一个独特的视角，让我们看到佛罗里达州（`Florida`）的倡导者如何准备并实现了大麻政策的转型转变。


    ### 立法改革之路之路


    在佛罗里达州 2014 年医疗大麻立法（`SB 1030`）通过之前的几年里，大麻改革倡导者一直在努力——有时勤奋，有时混乱——为机会时刻的到来做准备。试错与坚韧并存，随着时间的推移，大麻倡导者基于强大的领导力和战略性沟通奠定了有效的基础，将该问题定位为一旦“火花”来临，便已准备就绪。


    `Demko` 是一位受过哈佛大学教育的健康政策律师兼注册护士，拥有公共卫生学博士学位。作为佛罗里达州政治进程中的专业人士，以及通过包括大量知情人访谈、调查问、文献综述和数据分析的学术研究，她亲眼见证了这一过程的展开。


    “在 2014 年之前，人们为了放宽佛罗里达州当时极受限制的大麻法律出的努力并不少，但处处都是障碍，”她告诉我们，“大麻改革倡导者早就观察到，公众对医疗大麻的观点无论在全国还是在佛罗里达州内部都在发生变化，但对于合法的政策改革还没有清晰的路径。”


    ### 组织与招募


    作为回应，倡导者开始组织起来，从志同道合的人和组织组成的松散联盟转变为更有结构的实体。他们意识到，通向大变革的第一步可能会以渐进进展的形式出现，并开始关注与有同情心的利益相关者和医疗大麻的支持者建立联盟——特别是针对癫癫症等严重疾病的治疗——这有望产生更广泛的吸引力。他们招募了立法者——关键的立法领军人物——他们可以引导该问题通过该州的政治机器。


    在商业、体育和军事领域，是领导者（首席执行官、教练、军官）招募团队成员；而在政治努力中，情况往往相反。在政治中，倡导小组和其他联盟必须招募领导者——法案发起人、立法盟友，甚至是政治候选人——来推动他们的诉求。


    “在佛罗里达州，医疗大麻运动必须找到合适的人，即关键的立法领军人物，他们能够引导该问题通过该州的政治机器，”`Demko` 分享道。这些领导不仅必须来自执政党，还必须来自该州的关键地区，不仅在立法机构内部，而且与行政部门也保持着稳固的关系。毕竟，美国没有哪个立法机构可以免受行政否决的影响，即使是极其成功的立法努力也面临这种风险。


    ### 领导力与战略沟通


    “强大的领导力对于推动这种动力至关重要，”`Demko` 解释道，“运动中的关键人物，包括来自两个党的立法者，都投身这项事业。共和党立法者如 `Rob Bradley`
    参议员和 `Matt Gaetz` 代表员（他们都是佛罗里达州保守政治领域的知名人物）脱颖而出，成为医疗大麻法案的支持者。他们对 `SB 1030` 的发起对推动法案进展起了关键作用，因为他们的领导力让立法机构更加犹豫的成员相信，该法案在政治上是可行的，在道德上也是正确的。”


    在确定领导者后，针对不同利益相关者的针对性沟通开始，包括针对立法者、医疗保健人员和公众。民意调查（其中一些信息测试实验）为倡导者提供了反馈，告知他们哪些叙事在说服反大麻选民改变主意方面有效，哪些无效。通过这种反馈和其他方式，倡导者将该问题构建为一个同情的问题，强调了如
    `Charlotte Figi` 的案例，她是一个患有癫痫的孩子，她的发作通过一种低 THC 大麻得到了缓解。这种叙事对于产生共情和减少反对至关重要，因为它将对话从娱乐大麻转向了弱势儿童的健康和福祉。


    ### 转折点


    佛罗里达州大麻改革的真正转折点出现在 2014 年，当时一项关于医疗大麻的宪法修正案被提于 11 月投票。这项修正案如果通过，将重塑佛罗里达州的政治格局，特别是在一场预计将竞争激烈的州长竞选中动员民主党选民。担心潜在选举影响的共和党立法者将通过
    `SB 1030` 视为在满足日益增长的医疗大麻改革需求的同时，保持对该问题控制权的方法。


    倡导者已经为这一时刻做好了准备。他们已经与立法领军人物奠定了基础，建立了联盟，并以一种引起公众和政策制定者共鸣的方式构建了他们的信息。当宪法修正案的威胁出现时，他们能够利用这种政治紧迫性来推进他们的法案。通过将
    `SB 1030` 定位为比更广泛的宪法修正案更受控、重点更窄的替代方案，倡导者能够说服立法者，通过他们的法案是在应对公众需求的同时保留对该问题立法控制权的最佳方式。

    '
- fmt: '

    The passage of `SB 1030` underscores the importance of preparation in advocacy.
    Advocates had anticipated the moment when medical cannabis would become a politically
    viable issue, and they had recruited the right leaders and built the relationships,
    narratives, and coalitions necessary to act when the opportunity arose. Their
    readiness allowed them to capitalize on the momentum created by external factors—such
    as the proposed constitutional amendment and media attention—while maintaining
    control over the direction of the reform.


    “This case study demonstrates that effective advocacy is not only about responding
    to political shifts but about creating the conditions that make those shifts possible,”
    Demko said. “Marijuana reform advocates in Florida were able to turn a political
    spark into legislative success because they had built a solid foundation long
    before the spark arrived. Their preparation ensured that when the opportunity
    for momentum came, they were not only ready but positioned to ride the wave and
    lead the charge.”


    In the end, the passage of `SB 1030` was not just about seizing the moment; it
    was about being ready for the moment to arrive. This readiness turned a potential
    threat—the constitutional amendment—into a strategic advantage and allowed advocates
    to achieve a legislative victory that had eluded them in previous years.


    ### The Spark and the Slow Burn


    The spark turned into a slow burn. Soon after Florida approved the use of low-THC
    medical marijuana, the state expanded access to other THC varieties as well, albeit
    through physician recommendations.


    “It *should* be like that,” Jensen Huang told *60 Minutes* in May 2024 after hearing
    how employees at his company, `Nvidia`, described the company’s culture and, more
    specifically, Huang’s leadership style as a “demanding perfectionist” who “isn’t
    easy to work for.” The sixty-one-year-old CEO, who went from a “relentlessly bullied”
    teen washing dishes and bathrooms at diners to the thirteenth-richest person in
    the world with a net worth greater than $100 billion, runs his company much like
    the machines his company builds. Where most CEOs have about ten direct reports,
    Huang has fifty. Like General Petraeus walking patrols with his units, something
    few of his rank would do, Huang sees this structure as essential to avoiding unnecessary
    layers of management that can hinder transparency and slow progress. His tenure
    at `Nvidia` is also disproportionate to other Silicon Valley CEOs—three decades
    at the helm—and attrition at `Nvidia` among its workers is also unusually low
    despite their having ample opportunities to bring their skills elsewhere.


    Somehow, despite having about five times the number of direct reports that other
    major CEOs have, Huang has been criticized for lacking a personal touch with his
    employees. But Huang wasn’t the only leader, and `Nvidia`’s story wasn’t his alone.


    ### The Early Structure of Nvidia


    In this book, we’ve thought about leaders primarily as a single person at the
    top of a team or unit—and surely, many leaders operate with autonomy or in a hierarchy
    with few on the top. But the team that started `Nvidia` looked different and started
    even more differently. The entire early operation ran out of a small condo without
    A/C, with a team structure that was as flat as the space itself. There was no
    sprawling org chart, no layers of middle management—just three visionary leaders
    dividing the responsibility among themselves, each contributing their unique strengths
    to push the fledgling company forward.


    #### The Visionary

    Huang, the dynamic and ambitious CEO, was the driving force of the company. His
    role was not only to guide the strategic direction but to keep the company aligned
    with an audacious vision: to become the most important technology company in the
    world. While Huang may not have been deeply involved in the technical minutiae
    at first, he understood technology at a fundamental level and had an unparalleled
    knack for understanding how business and technology could intersect. In many ways,
    Huang was the external face of `Nvidia`, the person who could sell their ideas
    and their future.


    #### The Engineer

    Chris Malachowsky, the engineer, was the one who could build just about anything.
    In the early organization, Malachowsky was responsible for bringing `Nvidia`’s
    ideas to life. He focused on solving the complex technical problems that came
    with creating cutting-edge graphics technology in a time when the industry itself
    was still in its infancy. His role was hands-on and deeply technical; he was the
    one who ensured that `Nvidia`’s innovations were more than just concepts—they
    worked.


    #### The Architect

    Then there was Curtis Priem, the systems architect. Priem was the mastermind behind
    the overall design, able to look at the full scope of what `Nvidia` was trying
    to accomplish and find solutions that others couldn’t see. He filled in the gaps
    between Malachowsky’s engineering and Huang’s grand vision, ensuring the technology
    could function seamlessly and with long-term potential. While Malachowsky could
    build it, Priem was the one who figured out what “it” needed to be, translating
    the company’s goals into a product that could change industries.


    Together, these three founders formed the first and only true “org chart” at `Nvidia`.
    There were no rigid roles—each one contributed to the business in ways that often
    overlapped, their collective focus being survival and eventual success. And even
    as their beginning suffered no bureaucratic red tape, the three were preparing
    for growth.


    ### Preparing for Growth


    Sitting down to talk with Chris Malachowsky was a rare, treasured opportunity
    for a personal glimpse into how this trio grew to what `Nvidia` has become and
    how they prepared for the spark that drove the company’s meteoric rise, and Malachowsky
    was generous with his time.


    “I think this is quite unique among startups: We had the objective of being the
    most important technology company in the world,” Malachowsky shared. “We were
    three guys in an un-air-conditioned condominium, yet we had that objective. This
    is not trying to be self-serving, but we were independently exceptional at what
    we were doing. I was the engineer. I felt I could build anything and welcomed
    Curtis defining for us what was needed. Curtis could figure out anything from
    soup to nuts, and then tell you, ‘In the middle we need a saucepan.’ And then
    Jensen was just this brilliant technologist who had all the people skills. Independently
    we could go do our thing.”


    Only video gamers had really heard of `Nvidia` in its early years, after its first
    product launched in 1995. It was video game enthusiasts, PC manufacturers, and
    arcade machine developers who became familiar with the brand first—drawn in by
    its innovative multimedia accelerator card. But its widespread use was limited
    by major compatibility issues with existing software. In 1999, Nvidia introduced
    the `GeForce 256`, marketed as the world’s first `GPU`. We all rely on `GPUs`,
    which are specialized electronic circuits designed to accelerate the creation
    and rendering of images, videos, and animations and that handle the complex calculations
    required to produce high-quality graphics. `GPUs` are essential components in
    modern computing, particularly for applications requiring intensive visual processing—intricate
    technology that most people take for granted but have no real concept of their
    workings.


    Needless to say, `GPUs` were a significant advancement in graphics technology,
    establishing `Nvidia`’s products as superior in performance and capabilities compared
    to competitors. Many would have thought that this would be enough—dominating the
    expanding demand for graphics cards in an already booming gaming market. But `Nvidia`’s
    leadership saw even greater applications for its technologies.

