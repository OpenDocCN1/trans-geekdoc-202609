    Other models of recruitment look more at the functional needs of an organization.
    The Resource-Based View posits that organizations should recruit individuals who
    provide unique skills and competencies that are valuable, rare, inimitable, and
    nonsubstitutable. These resources contribute to a sustainable competitive advantage.
    Similarly, the Human Capital Theory and the Competency-Based Recruitment Model
    both focus on recruiting individuals with the knowledge, skills, and abilities,
    or specific competencies, required for the job—which include not only technical
    skills but also behavioral attributes like communication, teamwork, and leadership.


    Jim Collins’s concept of “getting the right people on the bus” in his book *Good
    to Great* aligns closely with several aspects of the P-O Fit model and the ASA
    framework. Collins emphasizes the importance of having the right people who share
    the core values and vision of the organization. This aligns with the P-O Fit model,
    which stresses the alignment between an individual’s values, beliefs, and personality
    with the organizational culture and values. Collins notes that great companies
    focus on “first who, then what,” meaning they first get the right people on the
    bus (in the organization) and the wrong people off, and then figure out where
    to drive it (strategic direction).


    Collins’s idea that the right people are those who are not only capable but also
    passionately committed to the organization’s mission parallels the ASA framework.
    According to the ASA model, organizations attract, select, and retain individuals
    who are a good fit with their culture, while those who do not fit well tend to
    leave. Collins emphasizes hiring based on character and innate capabilities rather
    than specific knowledge or skills, which resonates with the P-O Fit model’s focus
    on value and cultural alignment. The emphasis on cultural fit over specific job-related
    skills aligns with both the P-O Fit and ASA models, where fitting into the organizational
    culture is crucial for long-term success and commitment. And Collins’s idea of
    continually assessing whether team members are still the right fit for the bus
    mirrors the ASA model’s concept of attrition, where those who do not fit well
    naturally leave the organization.


    ### Military Context


    You’re almost certainly familiar with the US Army’s “Be All You Can Be” and the
    Marines’ “The Few. The Proud.” These slogans are part of the US military’s multifaceted
    recruitment theory that integrates elements from various recruitment and human
    resource management models, with a particular emphasis on strategic, psychological,
    and practical considerations.


    The military seeks to attract individuals who are drawn to the values and lifestyle
    of military service and those who meet stringent physical and mental criteria.
    Where in a business or sports environment, attrition may happen gradually or over
    time, the military front-loads attrition as much as possible. Basic training serves
    as both an introduction to military life and a further selection process where
    those not suited for military service are identified. In other words, the military
    seeks to quickly identify those who do not fit well and give them an early out.


    The employment of assessment center practices enhances the military’s ability
    to solidify their recruit retention success rate. For example, the `Armed Services
    Vocational Aptitude Battery Test` assesses candidates’ faculties in verbal, math,
    science, technology, and spatial areas. Medical examinations, physical fitness
    tests, and security background checks are other examples of frontloaded practices
    the military employs in comprehensive manner to get the “right” people into its
    ranks. Beyond measurable skills, the military also seeks to recruit a diverse
    workforce to reflect the society it serves and to benefit from a wide range of
    perspectives and skill—something that lends significantly to its culture.


    From there, the military invests in recruits as valuable assets. The military
    provides training and education ensuring personnel can meet the demands.


    ### Political Context


    Political recruitment is a complex process that has been the topic of significant
    research. In theory, it involves identifying, attracting, and selecting candidates
    based on various traits.


    But in practice, political recruitment is messier. Parties often use polls and
    focus groups to gauge public opinion. Extensive vetting (ideally) ensures candidates
    can withstand scrutiny, but vetting is almost always incomplete and provides a
    view of only what has already happened.


    ### The Case of Dwight D. Eisenhower


    Perhaps the most notable reluctant candidate of all time was `Dwight D. Eisenhower`,
    who became the thirty-fourth president of the United States. Eisenhower had a
    distinguished career as a military officer. He graduated from `West Point` in
    1915 and rose through the ranks of the US Army. During World War II, Eisenhower
    served as the supreme commander of the Allied Expeditionary Forces in Europe,
    where he led the successful invasion of Normandy (`D-Day`) and played a crucial
    role in the defeat of Nazi Germany. Despite his military success, Eisenhower had
    no political experience and initially showed little interest in a political career.
    His leadership during World War II made him a national hero, respected by both
    the public and political leaders.


