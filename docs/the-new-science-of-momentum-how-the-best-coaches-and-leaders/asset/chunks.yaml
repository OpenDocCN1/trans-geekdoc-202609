  raw: 'Perhaps most telling, however, is the wide gap between the belief in momentum
    and a confident understanding of what contributes to it. Nearly nine in ten respondents
    in our surveys say they believe certain conditions can help create momentum or
    make it more likely to occur; but when asked to elaborate on what those conditions
    might be, most said they aren’t sure.


    This book explores those conditions and how to build them. But first, it’s important
    to start with the basics: the scientific basis and definition of momentum, concepts
    that are related to but distinct from momentum, and an exploration of some efforts
    to “catch” or measure “Mo” in social contexts.


    ## [2](#nav.xhtml#sec3)


    ## [Momentum Defined](#nav.xhtml#sec3)


    “Try to define it.”


    Try to define love or pornography. Supreme Court Justice Potter Stewart tried
    with the latter but defaulted to what became among the best-known phrases in US
    legal history: “I know it when I see it.”


    Momentum joins the list of phenomena that can be perceived more easily than described.
    And it’s described . . . a lot.


    Think of the number of idioms that allude to momentum: “keep the ball rolling”;
    “gather steam”; “hit one’s stride”; “in full swing”; “gain traction”; “ride the
    wave”; “snowball effect”; “run with it.”


    And, of course, there are various clichés that dance around the same concept:
    “strike while the iron is hot,” “a rolling stone gathers no moss,” “the more you
    do, the more you can do,” “stay in the flow,” “success breeds success.” It’s no
    surprise, then, that most people believe—perhaps even without having consciously
    considered the question—that momentum is real.


    Most come to understand momentum long before they learn there’s a word for what
    such an experience feels like. Indeed, the concept becomes a lot easier to explain
    when you’ve felt it yourself—and more importantly, when you’ve been given the
    tools to spot it when it’s happening and to prepare for that moment.


    In physics, momentum—that is, transferred energy—is a property of a moving object
    that’s defined as the product of its mass and velocity. It is a vector quantity,
    meaning it has both magnitude and direction. The formula for momentum is:


    Momentum = Mass × Velocity


    Here’s what each part means:


    *   Momentum: This tells us how much “push” an object has when it’s moving. If
    something has more momentum, it means it’s harder to stop.


    *   Mass: This is how much stuff is in the object, like how heavy it is. The more
    mass an object has, the more momentum it can have.


    *   Velocity: This is how fast the object is moving and in what direction. The
    faster something moves, the more momentum it has.


    In other words, in physics, momentum depends on both the mass and the velocity
    of an object. An object with a greater mass or a higher velocity will have greater
    momentum. For example, a truck moving at a high speed will have a greater momentum
    than a bicycle moving at the same speed. Beyond mass and velocity, there are other
    variables that also predict or describe motion. These include:


    *   Vectors: Quantities that have both magnitude and direction. Vectors are used
    to represent physical quantities like force and displacement. For example, a force
    vector might be described as “ten newtons to the right,” where ten newtons is
    the magnitude and “to the right” is the direction.


    *   Direction: The line or path along which something is moving, pointing, or
    aiming. For example, direction tells you where a vector is pointing, such as “north,”
    “upward,” or “thirty degrees east of north.”


    *   Magnitude: The size or quantity of something. For example, the magnitude of
    a velocity vector tells you how fast something is moving, while the magnitude
    of a force vector tells you how strong the force is.


    It is the combination of these elements that creates the conditions in which momentum
    can be generated and sustained. These elements also provide scientists and laypeople
    multiple opportunities for observing and measuring momentum—detecting it in the
    physical world, and exploring how it may appear in the psychological experience
    for those in the midst of it.


    ### The History of Momentum in Science


    It is not our intention that this book become a textbook. However, numerous scientists
    have examined important elements of the science of momentum over the years and
    integrating their insights was paramount in our work.


    The concept of momentum has been studied for thousands of years. But the modern
    scientific understanding of momentum began to take shape during the sixteenth
    and seventeenth centuries with the work of scientists such as Galileo Galilei,
    Johannes Kepler, and Isaac Newton. Galileo is credited with first describing the
    concept of inertia, which is the property of matter that resists changes in motion.
    His experiments with rolling balls down inclined planes demonstrated that the
    speed of a moving object remained constant as long as no external forces acted
    upon it.


    Kepler’s laws of planetary motion, which he developed based on observations of
    the movements of planets, also contributed to the development of the modern understanding
    of momentum. His laws describe the relationships between the speed and position
    of planets as they orbit the sun.


    Isaac Newton’s laws of motion, which he published in 1687 in his work *Philosophiæ
    Naturalis Principia Mathematica* (*Mathematical Principles of Natural Philosophy*),
    represented a significant milestone in the understanding of momentum. Newton’s
    laws state that an object will remain at rest or in uniform motion in a straight
    line unless acted upon by an external force and that the force acting on an object
    is proportional to its mass times its acceleration.


    These laws provide a framework for understanding the behavior of objects in motion,
    including the concepts of momentum and kinetic energy.


    Generations of scientists since have conducted experiments and made discoveries
    that have contributed to the refinement of the concept of momentum. Some notable
    examples include the work of James Joule in the mid-nineteenth century, who demonstrated
    the relationship between heat and energy, and the experiments of Albert Einstein
    in the early twentieth century, which led to the development of the theory of
    relativity.


    Modern scientists from various fields of physics continue to study and explore
    the concept of momentum in specific conditions. For example, Steven Chu studies
    momentum at the atomic level; Wolfgang Ketterle studies momentum in microscopic
    systems; and William Phillips, Claude Cohen-Tannoudji, and Eric Cornell all study
    momentum in atoms at extremely low temperatures. These Nobel laureates are advancing
    the scientific understanding of momentum in directions Newton and Kepler could
    never have imagined possible.


    ### Momentum and Its Cousins, Inertia and Success


    There are a few concepts related to momentum, and sometimes confused for it: inertia
    and success. While inertia and momentum are related concepts in physics and in
    life, they have distinct meanings and applications.


    Inertia is the property of matter that resists changes in its state of motion.
    It is related to Newton’s First Law of Motion, which states that an object at
    rest will remain at rest and an object in motion will continue moving at a constant
    velocity along a straight line unless acted upon by an external force. Inertia
    is directly linked to an object’s mass—the greater the mass, the greater the inertia.


    Inertia is often associated with an object’s resistance to changes in its velocity
    or motion. For example, a heavy object requires more force to set it in motion
    or to stop it compared to a lighter object with less inertia. Inertia is also
    responsible for the tendency of moving objects to continue moving in the absence
    of external forces.'
