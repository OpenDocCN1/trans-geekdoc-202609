    # 对动能的信念与体验


    首先，超过十分之九（91%）的受访者表示，在涉及体育、商业、政治或军事等群体体验时，他们相信动能是“真实”的。但关键的一点是，这种观点在某种组织化群体的成员（93%）中持有的比例远高于非成员（74%）。特别是，在军事（98%）、体育团体（97%）、政治团体（96%）、商业团体（94%）和宗教团体（94%）的成员中，认为动能是真实的比例也更高。这是一个巨大的发现，因为在其他类型的人口群体中，我们发现几乎没有或完全没有差异。对动能真实性的信念在统计学上，于男性与女性、白人种与非白人种、内向者与外向者、民主党人与共和党人、已婚、离婚或单身人士，以及所有性取向的人群中相等。换句话之，在相信动能方面，真正的区别在于是否曾是团队的一员。一个人报告参与过的团队越多，他们相信动能真实性的可能性就越大。


    ## 动能的感知体验


    在个人生活中对动能的感知体验至少在总体上同样广泛。超过十分之九（92%）的受访者表示，他们在生活中至少在一个领域经历过（或更重要的是，见证过）他们认为是动能的，无论是在人际关系（62%）、体育（55%）、健身或健康（47%）、商业或金融（46%）、政治（39%）、宗教或精神领域（36%），还是军事行动（30%）。这种认为在生活中至少一个领域经历或见证过动能的信念，在很大程度上跨越了人口群体和个人身份，所有年龄段、民主党人与共和党人、已婚、单身和离婚人士、同性恋与异性恋、白人与非白人之间的回答比例大致相等。


    尽管如此，个人动能的感知体验体现在少数几类身上。具体而言，男性（95%）报告过动能的个人经历的比例高于女性（90%），外向者（98%）高于内向者（92%），年收入在
    5 万美元或以上的家庭成员（95%）高于年收入低于 5 万美元的家庭成员（89%），以及某种团队的成员（96%）高于非成员（69%）。后者的这一特征——团队或群体成员身份——再次证明了在动能体验上最深刻的差异。几类群体成员报告了最高的感知动能率：服过兵役的人（99%）、参加过运动队的人（98%）、参加过政治组织的人（98%）、从事商业的人（97%）以及参加过宗教组织的人（96%），都对动能触及过他们的生活表现出更强的信念，而未参与过这些类型群体的人。


    ## 条件与自我效能


    此外，整整十分之九（90%）的人认为某些条件可以帮助创造动能，或让团队或组织更容易体验到动能，而有 10%的人认为动能主要是随机的，无法受到影响。这种认为可以通过某些条件培养动能的观点，同样在群体成员（92%）中持有的比例远高于非成员（83%）。这个问题是我们对自我效能最接近的衡量，`Bandura`和`Hollenbeck`都将其描述为对自己影响个人或群体结果的能力的信念。


    群体成员是非常普遍的，至少按照我们的定义：在我们调查的受访者中，有十分之七的人表示他们至少属于一种定期聚会并追求共同目标的组织。然而，即使在这些属于群体并相信动能可以受某些条件影响的个体中，也只有四分之一（25%）的人表示他们经常与其他群体成员讨论动能，而同一比例的人（26%）则表示他们从未这样做过。更仔细地观察某些群体的成员，对动能缺乏定期讨论的现象变得更加显著。例如，在军事团队成员中，98%的人认为动能是真实的，99%的人认为他们在自己的生活中经历过，95%的人认为某些条件可以帮助群体创造动能——但只有
    35%的人表示他们经常与所属部队讨论动能。同样，在商业群体中，94%的人认为动能是真实的，97%的人认为他们在自己的生活中经历过，93%的人认为某些条件可以帮助群体创造动能——但只有
    30%的人表示他们经常与所属单位讨论动能。这种模式在运动员和政治专业人士身上同样适用：对动能的真实性存在广泛信念，有亲身经历，并相信群体可以创造让动能更有可能的条件——但极少有人在讨论他们究竟如何做到这一点。


    这可能意味着他们对于从何处开始这种对话缺乏理解。但总的来说，这些发现说明了人们对动能的广泛信念，特别是在那些参与了某种团队的人中，这反映了高自我效能的集体心态——这为这类对话的开展提供了肥沃的起点。


    ## 影响动能的因素


    当我们具体观察人们认为哪些因素可以增加团队体验动能的可能性时，我们的发现变得更具启发性。我们要求受访者告诉我们他们认为哪些因素（即我们模型中的组成部分）对团队产生动能可能的影响最大。两个竞争头位置的因素是群体领导力和群体化学反应（氛围）。在独立评分时，同等比例的人（均为
    86%）认为群体领导力和团队氛围对组织产生动能的可能性都有强力影响。团队氛围被认为对三十岁以下的人尤为重要，而领导力被 30 岁及以上的人认为相对更重要。


    也许从元心理学角度来看，最有趣的是，关于信念和心态对群体动能体验具有重要影响的这种程度异常高。超过十分之八（82%）的人表示信念和心态强烈影响群体动能——与正或负面反馈的影响（82%）并列。这超过了模型中的其他因素，包括群体文化（80%）、识别外部动能火花的能力（75%）、动能的准备（69%）以及群体成员的招募（66%）。但在其他术语中，只有
    18%的人认为信念和心态几乎没有影响。


    ## 结论


    也许在某些方面，对于动能而言，相信即是看到。


    可能不需要团队的每位成员在火花之初就相信动能是真实的或动能正在发生，才能使其潜力发挥。但组织中`某些`成员相信这一点并共享这种感知，似乎确实很重要。


