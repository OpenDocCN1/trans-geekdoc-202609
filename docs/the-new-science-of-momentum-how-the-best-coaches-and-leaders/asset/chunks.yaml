    军界有句言：“训练如战斗，战斗如训练。”这句格言指导着一种哲学，即创建模拟战斗环境的训练场景，让士兵为应对这些压力做好准备。此类场景（例如特种部队、两分钟演习、红区进攻、足球任意射门）被经常地整合到实践中，并在运动队中精准执行。所有领域的领导者都必须例行地让他们的人经历某些体验，帮助他们在火花出现时抓住机会（或在扭转时把握）。


    ### 行动 3：培养团队承担明智风险的能力。


    动态环境经常会揭示理解或能力上的缺口。为了抓住势头，团队必须频繁承担风险。鼓励你的团队评估风险的潜在后果，以便他们能够对是否继续做出明智的决策。明智风险是指那些如果引导得当就能推动事物前进，并且在未成功时可以承受的风险。相反，愚蠢风险则是那些一旦未实现目标就无法挽回的风险。伟大的组织通常为明智风险提供担保，而从不为愚蠢风险提供担保。


    ### 火花


    当 Nvidia 研究团队正在进行重大但低调的行动，设计能够为 AI 和深度学习需求提供独特强大的处理器时，有一家新公司正在寻找这样的技术。OpenAI 成立于
    2015 年，目标是以有利于人类的方式推进 AImap，他们很快意识到训练大型 AI 模型对计算的需求是巨大的。OpenAI 从一开始就需要高度可扩展的计算能力来实现其雄心勃勃的目标，而
    `Nvidia` 的 GPU 是自然之选——很少有替代方案可以比拟 `Nvidia` 在 AI 训练方面的硬件能力。OpenAI 的 AI 模型复杂性增加，并越来越多地转向
    `Nvidia` 的 GPU，因为它们在处理训练所需的海量数据集方面具有无可比拟的性能。


    `Nvidia` 准备的结果在近十年后以旋风之出现，当时 ChatGPT 推入公众视野，对 `Nvidia` GPU 及其他芯片的需求随之飙升。在发布后的两个月内，ChatGPT
    聚集了一亿用户，这是历史上任何平台最快的采用速度。2019 年，`Nvidia` 的市值约为 1000 亿美元。从 ChatGPT 发布到 2024 年 3
    月 12 日，`Nvidia` 的股价上涨了 428%。到 2023 年年中，`Nvidia` 的估值首次突破了 1 万亿美元。截至本文，其价值已超过 3
    万亿美元，使 `Nvidia` 成为拥有此类价值的三家公司之一。


    ChatGPT——`Nvidia` 准备工作的火花——点燃了一场仍在燃烧的火。


    对于某些观察者来说，`Nvidia` 自 2022 年以来的产品爆发是该公司开发创新并非常非常快地将其推向市场的证据。但观察者看来突然获得的势头，实际上是刻意且枯燥准备的结果。黄（Huang）和
    Malachowsky 就像弓箭手，在公司的弓上将整束箭拉得越来越远，他们开启了一场很少其他公司能经历的势头展示。`Nvidia` 的势头在那些观察市场的人看来可能是突然的，但实际上它是通过多年的密集研究和战略性耐心建立的，这将他们推向了技术进步的前沿。


    火花（AI 产品的规模公开采用）绝不会单独让 `Nvidia` 成为今天的力量。我们“势头模型”中的其他元素奠定了基础。例如，黄的领导力要求一种文化，即高级高管被要求独立运营、不懈努力并瞄准目标。而且，Malachowsky
    与我们分享道，`Nvidia` 有一套具体的、刻意的招聘方法。Malachowsky 分享了一个对于其他团队来说可能不利于复制的教训：如果他们找不到合适的人才，他们就完全不招聘。


    “我们承诺只雇佣最好的，不招佣平庸的。我们只会等。也许会人手不足，但我们会雇佣最好的，”他解释道，“我们有一支不会因为人手不足而退缩的。。实际上认为这是实力的勋章。我觉得贫乏可能不是正确的词，但处于匮乏状态能让人保持清醒，它让你变得深思熟虑，你知道，这有助于你，帮助你制定策略。”


    `Nvidia` 的创始人还意识到他们的业务在工作量上容易起伏。Malachowsky 分享道，在半导体世界，没有哪个成功故事能持续一两个季度。“我们想要度过那个时期，”他说，“所以我们会雇佣火箭科学家并让他去扫地。我宁愿让他做这件事，也不愿要一个唯一只会做这件事的人，因为明天，麻烦就会来临，我们会要求你回去去搞火箭科学。”换句话说，Malachowsky
    说，“我想给你们一个认可，即为了一个我尚未预见的未来，我暂时低利用了你们。”


    一旦 `Nvidia` 招到了合适的人，重点就转向了履行对已加入人员的义务并培养积极的团队氛围。“你必须公正地对待他们，给他们成功的机会，”Malachowsky
    说，“我们想雇佣聪明人，然后听取他们的意见。用优秀的人包围他们。我们告诉经理们，‘你想成为房间里最笨的那一个。’这样做是令人兴奋的。这具有激励性。”


    即使 `Nvidia` 在增长，其组织结构仍保持尽可能扁化——许多人将其归功于其非凡的崛起和持续的势头。三位创始人乐于全员上命的方法，人们可以根据需要从一个领域调动到另一个领域。这赋予了
    `Nvidia` 一种不常的转型能力。


    “我知道这听起来有点过时，但我以前告诉跟我工作的人，如果有人来找你请求帮助某项优先事项，你尽管去做；晚点告诉我就好。我不在乎，”Malachowsky 解释了一个很少经理会提供的流程，“人力资源部通常是最后一个知道人们在花什么时间的。你知道，甚至你的经理可能都不知道。你知道你在做什么。我们不是要求你请求许可。如果你做错了选择，让我们拉回来，但要快速转型。去吧，去做。不要纠结。”


    然而，转型的能力如果能与在机会出现时具备敏锐直觉相结合，或许会获益最大。`Nvidia` 的领导者看到了 OpenAI 中的火花，并建立了自己的套独特且经过测试的领导力、文化、招聘和准备方法。


    势头根据其定义，需要一个时刻。某些事情发生并开始推动事物，最好是朝着你的方向。我们选择将那个时刻称为“火花”。有时火花是显而易见的：一项你拥有独特优势帮助增长的改变规则技术的发布（如
    `ChatGPT`）；一个你转化为得分的掉球（如红者人队在 2017 年超级决赛中所做）；或者在政治竞选中意外的背书（正如克莱本代表在 2020 年民主党总统初选期间搂住陷入困境的乔·拜登肩膀那样）。有时火花是缓慢燃烧的：聘请了合适的教练或领导者，他们的行动静静累积并改变了氛围；或者在一个反对性性骚扰的运动中加入了几个勇敢的声音。

