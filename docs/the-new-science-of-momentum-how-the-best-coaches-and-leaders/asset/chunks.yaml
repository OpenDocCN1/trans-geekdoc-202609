    # The Belief in and Experience of Momentum


    For starters, greater than nine in ten (91 percent) say they believe momentum
    is “real” when it comes to group experiences such as in sports, business, politics,
    or the military. But critically, this view is held by greater portions of those
    who themselves are a member of some type of organized group (93 percent) compared
    with those who aren’t (74 percent). In particular, momentum is perceived as real
    by greater portions of those who are members of military (98 percent), sports
    (97 percent), political (96 percent), business (94 percent), and religious (94
    percent) groups. This is a huge finding, because across other types of demographic
    groups, we found few to no differences. The belief in momentum’s realness is held
    by statistically equal portions of men and women; White and non-White individuals;
    introverts and extroverts; Democrats and Republicans; those who are married, divorced,
    or single; and those of all sexual orientations. In other words, the real differentiator
    when it comes to believing in momentum is having been part of a team. And the
    more teams a person reports they’ve been a part of, the greater the likelihood
    that they believe in the realness of momentum.


    ## Perceived Experience of Momentum


    The perceived experience of momentum in one’s own life is equally widespread at
    least in the aggregate. More than nine in ten (92 percent) say they’ve experienced
    (or, importantly, witnessed) what they believe to be momentum in at least one
    area of life, whether in relationships (62 percent), sports (55 percent), fitness
    or wellness (47 percent), business or finance (46 percent), politics (39 percent),
    religion or spirituality (36 percent), or military efforts (30 percent). The belief
    that one has experienced or witnessed momentum in at least one area of life largely
    cuts across demographic groups and personal identities, with about equal response
    between members of all age groups; Democrats and Republicans; those who are married,
    single, and divorced; gay and straight; White and non-White.


    That said, the perceived experience of individual momentum is expressed by greater
    portions of a few types of people. Specifically, personal experiences with momentum
    are reported by greater portions of men (95 percent) compared with women (90 percent),
    extroverts (98 percent) compared with introverts (92 percent), those in households
    with incomes of $50,000 per year or more (95 percent) compared with those living
    in households earning less than $50,000 per year (89 percent), and those who are
    a member of some kind of team (96 percent) compared with those who are not (69
    percent). This latter feature—team or group membership—once again demonstrates
    the most profound difference in the experience of momentum. And a few types of
    group members report the highest rates of perceived momentum: Those who have served
    in the military (99 percent), on sports teams (98 percent), in political organizations
    (98 percent), in business (97 percent), and in religious organizations (96 percent)
    all express greater belief that momentum has touched their lives compared with
    those who haven’t participated in these types of groups.


    ## Conditions and Self-Efficacy


    Further, a full nine in ten (90 percent) believe that certain conditions can help
    create momentum or make it more possible for a team or organization to experience,
    while 10 percent believe that momentum is mostly random and can’t be influenced.
    The perception that momentum can be fostered through certain conditions, once
    again, is held by greater portions of those who themselves are members of groups
    (92 percent) compared with those who aren’t (83 percent). This question is our
    closest measure of self-efficacy, which both `Bandura` and `Hollenbeck` described
    as the belief in one’s ability to influence personal or group outcomes.


    Group membership is pretty common, at least as we’ve defined it: Seven in ten
    of those we surveyed say they belong to at least one type of organization that
    meets regularly and pursues shared goals. Yet even among these individuals who
    belong to groups and believe that momentum can be influenced by certain conditions,
    only one in four (25 percent) says they regularly discuss momentum with other
    group members, and that same portion—26 percent—says they never do so. Looking
    more closely at members of certain groups, the lack of regular discussion on momentum
    becomes even more striking. For example, among members of military teams, 98 percent
    believe momentum is real, 99 percent believe they’ve experienced it in their own
    lives, and 95 percent believe that certain conditions can help create momentum
    for a group—yet just 35 percent say they regularly discuss momentum with their
    unit. Similarly, among those in business groups, 94 percent believe momentum is
    real, 97 percent believe they’ve experienced it in their own lives, and 93 percent
    believe that certain conditions can help create momentum for a group—yet just
    30 percent say they regularly discuss momentum with their unit. This same pattern
    holds for athletes and political professionals as well: There’s widespread belief
    in the realness of momentum, firsthand experience with it, and the belief that
    groups can create conditions that make momentum more likely—yet very few are talking
    about how they can actually do so.


    Perhaps this suggests a lack of understanding of where to start that conversation.
    But overall, these findings illustrate widespread belief in momentum, particularly
    among people who are engaged with teams of some kind and reflect a collective
    mindset that is high in self-efficacy—a starting point that is ripe for such conversations
    to take hold.


    ## Factors Influencing Momentum


    Our findings get even a little more telling when looking at specifically what
    things people believe can increase the likelihood of a team experiencing momentum.
    We asked respondents to tell us which factors—which components of our model—they
    believe have the greatest influence on a team’s likelihood of momentum. The two
    factors that compete with each other for the top spot are group leadership and
    group chemistry. Rated independently, equal shares—86 percent—feel that group
    leadership and team climate, respectively, have strong influences over an organization’s
    likelihood of momentum. Team climate is seen as particularly important for under
    the age of thirty, while leadership is seen as relatively more important by those
    ages thirty and older.


    And perhaps most interesting from a metapsychological perspective, the conviction
    that beliefs and mindset matter significantly to the experience of group momentum
    is extraordinarily high. Greater than eight in ten (82 percent) say that beliefs
    and mindset strongly influence group momentum—tied with the influence of positive
    or negative feedback (82 percent). This exceeds other factors of the model, including
    group culture (80 percent), the ability to recognize an external spark for momentum
    (75 percent), preparation for momentum (69 percent), and how group members are
    recruited (66 percent). But in other terms, belief and mindset are seen as having
    little to no influence by just 18 percent.


    ## Conclusion


    Maybe, in some respects, when it comes to momentum, to believe it is to see it.


    It may not require every member of a team to believe that momentum is real or
    that momentum is happening at the outset of a spark in order for its potential
    to take hold. But having `some` members of an organization believe it and share
    this perception does seem to matter. Beliefs, like tangible molecules, can spread
    between people—as do emotions. Emotional contagion, the phenomenon where emotions
    spread from person to person, has been extensively studied in various social contexts.
    Research defines emotional contagion as the automatic and unconscious transmission
    of emotions between individuals, often occurring through nonverbal cues like facial
    expressions, body language, and tone of voice. This process can have significant
    implications for individual behavior and group dynamics.

