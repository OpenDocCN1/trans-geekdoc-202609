    But the line didn’t start off as a public-facing slogan. Rather, `Carville` wrote
    these three statements as an internal memo, hung within `Clinton`’s Little Rock
    headquarters, to help keep staff on message. It was the campaign team’s private
    playbook, so to speak—a set of points to which every member of the organization
    would agree, and advance around.


    It worked. The cohesive message of `Clinton`’s campaign surged, as things do when
    an organization finds its internal flow.


    “It just starts to cascade,” `Carville` told us.


    • • •


    ### The Political Stage vs. Competition


    Before going further, let’s take a step back and look at how the political stage
    differs from other forms of competition, or in what ways it’s alike. It helps
    to think of politics as a team sport, which isn’t hard to do—it’s clear that around
    each candidate is a campaign structure, and around that campaign are organizations
    that are to varying degrees aligned: national political parties and the local
    branches of it, advocacy groups, groups of voters who align on specific issues,
    donors, and so on.


    While the inclination might be to think of the candidate as the quarterback or
    CEO of a campaign organization, that’s not necessarily the most accurate parallel
    to make. Perhaps in local elections or early in an election cycle, a candidate
    does fill that role—but at the level of presidential politics, the candidate is
    one (albeit very important) piece of a much larger machine. In some sense, the
    candidate may be more like the mascot—an object that symbolizes a team, advances
    down a field, carries nearly all of the ultimate responsibility, and captures
    the full attention of bystanders while a world of action just outside the lens
    buoys each play.


    It’s also helpful to acknowledge that the organizations surrounding a political
    campaign are far less, well, organized than a military unit or an actual sports
    team. Presidential campaigns have multiple managers directing operations across
    every state, with field teams comprising paid staff and volunteers alike, and
    there’s a lot less control at that level. These operations are surrounded by,
    and influenced by, the preferences of interest groups and donors, often with competing
    motivations or policy objectives. There are significant inputs, and it’s not always
    perfectly hierarchical.


    ### Measuring Momentum in Politics


    Further, while forward motion is quite clear on a sports field, advancement in
    politics isn’t always so certain. In part, this is because the ability to measure
    “momentum” in politics—short of results on Election Day itself—relies on imperfect
    tools: instruments such as public opinion polls, attendance counts at rallies,
    and donations. These are indicators of success, but none on their own are perfect
    predictors of it.


    This is because success in national politics depends on not just the attitudes
    and feelings of individual actors but upon their behaviors too. A campaign team
    can operate with extraordinary unity, flow, and responsiveness—can be prepared,
    focused, and tuned into one another—and yet if people aren’t moved to independent
    action, in the form of casting a ballot, the campaign’s objective fails. This
    means that the work of political consultants depends considerably on instinct,
    intuition, and motivation—the very characteristics that led `James Carville` to
    rise to the top as he did.


    ### The Power of Validation


    From his perspective today, `Carville`’s view includes many successes beyond his
    own.


    “One of the great momentums was `Joe Biden` in 2020,” `Carville` offered, describing
    the Democratic primary. “He ran terribly in `Iowa` and `New Hampshire`, ran a
    little better in `Nevada`, and then he goes to `South Carolina` and blows it out,
    and everybody collectively said, ‘Fuck, this thing is over.’ Then he just swamped
    in `Virginia` and every other place. So he went from zero to sixty in a time like
    twenty-four seconds, twenty-three seconds, and then two seconds. That was caused
    by voters validating him.”


    `Carville` outlined how “the suburban women in `Virginia` saw what the Blacks
    in `South Carolina` were voting, and they said, ‘Okay, this is our guy.’ As soon
    as they saw that everybody was fine for voting for him overwhelmingly, that entire
    party changed its mind.”


    It’s not surprising, perhaps, that `Carville`’s recent experience of momentum
    happened at the level of primary elections. That’s really where the action falls,
    `Carville` believes, at least when it comes to the dynamics of influencing larger
    portions of the electorate. “In general elections, we’re so polarized. You just
    don’t have that many available voters to change minds as you do in the primaries,”
    he said.


    To `Carville`, validation by other voters is a key ingredient in political momentum—voters
    seeing how others respond to a candidate and thinking, “Well, they think he’s
    okay; then I think he or she’s okay.” And that’s what seemed to happen for `Joe
    Biden` in `South Carolina`. His campaign, at that point, was floundering. He hadn’t
    performed well in early primary states and was closing up storefronts in `California`
    because the campaign didn’t have any money.


    “They didn’t have any capital,” `Carville` said. “It was nothing until `Jim Clyburn`
    stepped in. I’ve never seen anything like it. They didn’t have headquarters. They
    didn’t have anything. They were just rambling around `South Carolina`, and the
    Thursday before he just dropped the hammer.”


    ### The Turning Point in South Carolina


    `Carville` didn’t exaggerate. House Majority Whip `Jim Clyburn`, the highest-ranking
    African American Democrat in `Congress`, single-handedly turned the tide for the
    former vice president’s campaign when gifting his endorsement to `Biden` just
    days before `South Carolina`’s Democratic primary. `Biden`’s political career
    was on life support everywhere, `South Carolina` included. His lead in the polls
    was in the single digits, and opponents, including billionaire `Tom Steyer` and
    `Bernie Sanders`, were making sizable gains. `Clyburn` saw this, telling `CNN`
    that polls generally “tighten up when you get close to an election.” Every candidate
    in the race wanted `Clyburn`’s endorsement, but `Biden` got it.


    “Once he did that—acceleration. Entirely. Understand—he won the [South Carolina]
    primary by 63 percent of all the votes from then on,” `Carville` said. “It was
    Black voters, suburban voters, it was everything. And it did not matter. Once
    that night came, it was over for. It was just over in an instant. I mean, it was
    really remarkable.”


    The cascade that followed was momentous. `Biden`’s decisive victory in `South
    Carolina` led multiple moderate opponents to drop out of the race, including `Pete
    Buttigieg` and `Amy Klobuchar`. And in what felt like a clear chain reaction,
    various other coveted endorsements, such as from Senate Democratic leader `Harry
    Reid`, `Barack Obama`’s US ambassador to the UN `Susan Rice`, and former candidate
    `BetoRourke`, all fell to `Biden`.


    The validation from `South Carolina` voters meant more, it seems, than high-profile
    endorsements. “That victory seems to have set off a domino effect of support among
    Democratic voters in southern states and minorities. In the 14 primary contests
    on Tuesday, `Biden` won every southern state. According to exit polling, `Biden`’s
    victories in some of these key states were largely thanks to strong support among
    minority voters,” wrote `Daniel Strauss` for *The Guardian* on March 4, 2020.


    The last remaining moderate Democrat in the race, `Michael Bloomberg`, soon also
    left the race, giving `Biden` his endorsement. There’s no doubt that `Jim Clyburn`
    lit a match for the `Biden` campaign. But if there hadn’t been kindling there
    to fuel and sustain a fire, the results would have been short-lived. There must
    have been something beneath the surface of `Biden`’s operation that was ready,
    prepared for momentum.

