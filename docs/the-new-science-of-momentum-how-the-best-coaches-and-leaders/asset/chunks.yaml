    “The fire at the Triangle Factory was the day the New Deal began,” Perkins later
    recalled. The New York State Legislature created the `Factory Investigating Commission`,
    which resulted in more than thirty new laws regulating labor conditions that went
    well beyond fire safety and into areas modern workers can rely on protections
    for—working hours, building inspections, sanitation, and more. The fire and the
    subsequent reforms laid the groundwork for future labor movements, including the
    establishment of the `Occupational Safety and Health Administration` in 1970.


    To many—including some history books—it would seem that the `Triangle Shirtwaist
    Factory Fire` was singularly responsible for the outcry and subsequent legislative
    changes that came. But organized efforts for worker protections were long underway.
    The `International Ladies’ Garment Workers’ Union` was founded in 1900 and had
    already organized massive efforts, including a twenty-thousand-strong strike in
    1909; and the `Women’s Trade Union League`, founded in 1903, was active in supporting
    such efforts including through providing bail for arrested strikers and organizers.
    The factory fire drew attention to the need for such efforts—galvanizing many
    more to join and propelling momentum for a movement whose leadership was prepared
    to advocate in the aftermath of tragedy.


    Once humankind grasped it could create and control fire, man’s reliance on this
    element profoundly changed everything from basic survival, diet and culture, technology,
    and even evolution. Fire offered warmth in cold climates, protection from predators,
    and a means to cook food, which made nutrients easier to digest and less likely
    to carry disease. Fire also extended human activities into the night, fostering
    social interactions and lending to the development of language and storytelling.
    Campfires, to this day, have that effect. Archaeological evidence reveals a variety
    of techniques used by early humans to start fires. The earliest known method was
    likely the use of natural fire sources, such as lightning strikes—capturing the
    fire from brush fires or even embers from lava flows and taking great measures
    to preserve the energy. But humans soon developed their own techniques for fire-making
    too. One of the oldest methods is the friction-based fire-starting technique,
    exemplified by the `hand drill` and the `bow drill`. Another method, the `fire
    plow`, involves rubbing a wooden stick against a groove in a `fireboard` to produce
    hot dust that ignites. Percussion methods, such as striking `flint` against `pyrite`
    or `steel`, were also used.


    Today, most take fire for granted. But if asked to start one from scratch, most
    would also fail. The same, only more so, is true with what it takes to ignite
    momentum—unlike physical fires, the sparks that ignite momentum may not be easy
    to spot. And beyond that, without human observation or perception, these momentum-igniting
    sparks may not exist at all.


    “If a tree falls in the forest and nobody is there to hear it, does it make a
    sound?” This thought experiment raises questions about observation, reality, and
    physics itself. From a scientific perspective, sound is a mechanical wave that
    results from the vibration of particles in a medium such as `air`, `water`, or
    solids. When a tree falls, it creates vibrations in the air that propagate as
    sound waves. Therefore, scientifically, the tree falling must, and does, produce
    sound waves regardless of whether anyone is present to hear them. But to Irish
    philosopher `George Berkeley`, who posed this question in the eighteenth century,
    the question is really a deeper one that delves into the nature of perception
    and reality. To `Berkeley`, this musing cut to the heart of `subjective idealism`—the
    idea that reality exists only as it is perceived by the mind. `Berkeley` argued
    that for something to exist, it must be perceived. In his view, if no one is there
    to perceive the sound, then it does not exist. This idea emphasizes the role of
    the observer in the existence of phenomena: Without our consciousness, nothing
    exists. In other words, objects or events don’t have objective existence outside
    of human perception.


    In few contexts is this concept more true or important than in the existence of
    sparks that ignite momentum for teams: For the most part, these sparks exist only
    if someone sees them. The spark—the moment, the opportunity, the flash of lightning
    or the first faint wisp of smoke—means something only if someone is there to observe
    it *and* sees it for what it is. Some sparks, or perhaps even many, can be destructive.
    And sometimes, that destruction—to social norms, a competitor’s winning streak,
    or an enemy’s advancement—is desirable to some. But for all of the various types
    of sparks, when it comes to the potential for initiating momentum, all share the
    necessity of someone to notice and act upon it. Some groundwork would have been
    laid for the flame to take hold—through preparation, organization, and an environment
    readied for the change.


    A great leader will amplify the spark by recognizing that true momentum is driven
    by an event that begins to change the minds and climate for a team that’s been
    preparing to take advantage of it.


    Sometimes, spark is huge. And sometimes, it’s the result of honest conversations
    between two leaders intent on making a positive difference.


    The `Ford Motor Company` was losing lots of money in the early 2000s. `William
    (Bill) Clay Ford Jr.` had assumed the company’s `CEO` role in October 2001 (in
    addition to holding the chairman role), and in the five years afterward, the company
    lost approximately $9.1 billion through July 2006. `Bill Ford` and the board knew
    change was required. So they set about finding a leader who could revive the company’s
    fortunes in the beginning of what held the potential to become a global economic
    downturn.


    `Bill Ford` was fully committed to saving the company and his family legacy. With
    two major US automakers staring at the possibility of entering bankruptcy, the
    American auto industry was in dire straits. Consequently, `Ford` designated three
    board members (`Irvine O. Hockaday`, former `CEO` of `Hallmark`; `John L. Thornton`,
    former president and `co-COO` of `Goldman Sachs Group.`; and `Jorma Ollila`, former
    chairman and `CEO` of `Nokia`) to head up the CEO search committee.


    Ultimately, the search committee determined that a strong candidate would have
    several attributes. The ideal person must have demonstrated an track track of
    outstanding accomplishments at the highest levels. Additionally, it was imperative
    the individual possess extensive experience in complex manufacturing and operations.
    The ideal candidate would possess a deep understanding of technology (present
    and emerging) and its relevance to different types of power plants (`internal
    combustion`, `electric-powered`, and `hybrid`). Finally, the ideal candidate would
    need to possess exceptional grit and a problem-solving orientation. Ultimately,
    Thornton recommended the board consider `Alan Mulally` (the president and `CEO`
    of `Boeing Commercial Airplanes`).


    `Mulally` was a `Boeing` lifer. He began his career there in 1969 as an aerospace
    engineer. Throughout the years he had climbed the ranks while working on many
    of the organization’s biggest programs (for example, `727`, `737`, `747`, `757`,
    `767`, `777`), ultimately becoming commercial airplanes `CEO` in 2001. Yet he
    was passed over twice for the `Boeing` `CEO` job. `Mulally` had won multiple awards
    in the industry while fostering sustained commercial success for his business.
    He also had a reputation as a humble, resolute, “lead by example” type of individual.
    Given his track record and attributes, `Mulally` quickly emerged as the leading
    candidate for the `Ford` role.

