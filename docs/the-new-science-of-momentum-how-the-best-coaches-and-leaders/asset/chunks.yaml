    “They’re very courageous, and I always have to sort of like drink a tall glass
    of optimism before I go in, because I’m gonna get the truth. And the truth is
    hard. You know, our systems aren’t there yet. Our processes aren’t there yet.
    We’re in the middle of one of the more complicated corporate turnarounds in history.
    I believe deeply in my heart we’re gonna win, but it’s hard. And you have to be
    willing to hear the hard truths. Though you know X, Y, and Z are working well,
    P, D, and Q are still not. And you have to take your breath and say one thing
    at a time. Stay with me, guys, you know we’re gonna knock these things out. And
    they see the progress on one side, and then they get the courage to bring the
    next thing to you. But you know it can be, it could be, a little tiring and could
    be a little exhausting, right? But that’s how I do it. I have these forums where
    I do my deep dives.”


    After her initial and ongoing deep dives to continually understand, map, and interpret
    challenges, Johnson shared with us the ensuing elements of her turnaround strategy.


    1.  *Give concise feedback:* Johnson’s personal life—her marriage and her athletics—have
    guided her approach to management. She never offers more than three things for
    someone to work on at any one time. “I don’t think you can work on more than three,”
    she shared with us. “Now, that said, if my senior leadership team were here, they’d
    be like, well, then, why are we working on five priorities. And it’s a good question.
    It’s fair. But we need to do those five things. So, yeah, I think three is the
    magic number for changing your own game. If you take five or seven priorities,
    whatever the number is, and you sprinkle them around the company, I hope that
    nobody’s working on more than three of those individually.”


    2.  *Be in the point, not in the match:* Johnson thinks back on a high-stakes
    doubles match where she became emotionally vulnerable to negative momentum. “I
    kind of lost sight of momentum as soon as we lost a couple of points,” she said.
    “I forgot about our winning momentum and went right into this losing momentum
    story in my head, and I kept thinking about winning the match and my partner.
    You know, we were sort of at the high level, thinking about the win versus the
    loss instead of ‘I gotta win this point right now.’ And this is the best way to
    go about that—that anchoring in winning one point at a time is deeply relevant
    to business, as is this notion of momentum and inertia.” In business, it isn’t
    as easy as it sounds to stay grounded in the point rather than the match. “It
    really isn’t easy. And, you know, I mean, the emotional dynamics especially. Look,
    we’re transforming a company, and we’re disrupting an industry. It’s a battleground.
    We’re competing with some of the biggest and best companies in the world to try
    and take share and change outcomes for customers. And it’s not just the strategy.
    It’s not just the operating plan and the execution. It’s not just the talent or
    the skills or the systems of the process. It’s managing the emotional dynamics
    of a battleground and staying focused on what’s going to make the biggest impact.
    That’s the job. And it’s really hard.”


    3.  *Get close and tell a story:* Johnson believes it’s impossible to “really
    empathize with a human or an issue or a problem unless you get really close to
    it” and that it’s “important for leadership to be okay with diving all the way
    down into it, so you can deeply understand it. And that’s not something that a
    lot of leaders do.” Johnson thinks that when most leaders “escape the ranks of
    level 1, 2, 3, 4, and they’re up in the 7 to 8 atmosphere, they forget to go back.”
    Johnson recommends that leaders get close to these problems, get close to your
    people, and once there focus on the power of storytelling: “If you wanna be a
    great commercial force in any industry, the art of storytelling is critical. There’s
    gotta be a problem. There’s gotta be a climax, and there’s gotta be an outcome
    and resolution. And if you can, embed that in how customers use and gain value
    from your products and services.”


    4.  *Be silly, and optimistic:* “I’m telling them something that I see that their
    management chain hasn’t told them yet. Something positive. It’s also delivering
    the excitement and the energy and the hope and the optimism back to them.” Johnson
    shared with us one particularly memorable story: “I love scooters, right? And
    I had several of them in my office, and I use them to disarm people. I say, ‘Hey.
    You wanna go for a scooter ride around the office?’ and people are like, ‘Is she
    crazy?’ No. Actually, I am a little bit crazy, but if you’re riding around on
    a scooter, it is almost impossible to take yourself too seriously. And that’s
    the trick, right?” Johnson didn’t reserve this tactic for staff only but for others
    who came into her orbit—including longtime Seattle Seahawks coach Pete Carroll,
    during their first encounter at Microsoft. Before even a handshake, Johnson invited
    Carroll to a scooter race, and he was all in. Johnson, in heels, may have seemed
    like an easy win for Carroll, who warned her in advance, “No whining!” But Johnson
    had no intention of being in such a position. “I started zooming down the hallway,
    and I figured, he’s a football coach so full contact isn’t a problem, right? So
    I used every imaginable technique to win that race. And I’m not going to tell
    you who won or lost. I will tell you that there were several wipeouts and a lot
    of laughing along the way.” Employees from their respective cubicles and offices
    looked on. About a hundred were in the office at the time. And there’s Pete Carroll
    zooming through the halls of Microsoft, on a scooter. “OSHA was not thrilled,”
    Johnson said, laughing.'
