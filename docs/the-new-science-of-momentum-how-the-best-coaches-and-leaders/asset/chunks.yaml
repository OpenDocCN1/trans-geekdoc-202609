    The `GPU` processes complex mathematical calculations to transform 2D and 3D data
    into images that can be displayed on a screen. This involves tasks like shading,
    texture mapping, and polygon rendering. Unlike `CPUs`, which are designed for
    serial processing, `GPUs` excel at parallel processing. This means they can handle
    thousands of operations simultaneously, making them ideal for graphics rendering
    and other data-intensive tasks. Scientific simulations and data analysis benefit
    from the ability to perform many calculations simultaneously, speeding up research
    and development.


    It was clear to Huang, Malachowsky, and Priem that the `GPU` could be transformative
    in the areas of engineering and modeling, big data, medical breakthroughs, and
    artificial intelligence. The parallel processing power of `GPUs` makes them ideal
    for machine learning and training deep neural networks, which require massive
    computational resources to handle large datasets and complex calculations.


    You may recall the concept of “potential energy” from high school physics: stored
    energy that is held until a point of release. Think of a spring that’s stretched,
    a match that’s not yet struck, or a ball that’s at the apex of a hill—not yet
    in motion but, when triggered, a significant display of energy is apparent. In
    other words, potential energy is not a characteristic of an individual entity
    but rather is a property of a system. It arises within organizations based on
    how various parts exert forces on one another: gravity, with the earth, or chemical
    elements that when mixed undergo mutual changes in composition.


    In the case of `Nvidia`, potential energy was building through quiet, patient,
    relentless research. In 2013, `Nvidia` spent more than one quarter of its revenue
    on `R&D`, far outpacing its largest competitor, `Intel`, and 80 percent more than
    the industry average. They were investing as they prepared for moments ahead.
    `Samsung`, for example, spent only 8.2 percent of its revenues on `R&D` in 2013,
    and `Toshiba`, 17.1 percent.


    It was an employee within the ranks that first observed the potential for AI.
    One of Malachowsky’s researchers, Bryan Cantanzaro, had done some seminal work
    in early AI and brought some ideas to the team. “At that point, I was running
    our advanced research group,” Malachowsky said. “One of the things about Jensen’s
    leadership and our executives is that we respect the fact that there’s lots of
    great people and they have lots of great ideas, and we should culturally encourage
    their passion to pursue the best of their ideas, you know, support them, let them
    flesh things out.” He likened this approach to the concept of an incubator, where
    innovation can happen within the walls, and one doesn’t have to leave a company
    to try something new.


    “There’s a lot of that,” he continued. “We always paid attention to when these
    brilliant people had a very strong feeling behind something. Bryan clearly felt
    AI was a big deal. Jensen latched onto it, learned a whole bunch about it. These
    were the brilliant guys that helped move the needle and bring this out of academia
    and research labs into the light of day and started the AI revolution.” Huang
    narrowed in on the opportunity, Malachowsky said, and pivoted `Nvidia` to be uniquely
    positioned for it. They didn’t wait for the market to dictate their path but leveraged
    their parallel computing capabilities to focus on AI’s potential. `Nvidia`’s researchers
    recognized that its `GPUs`—originally designed for rendering graphics—were also
    well suited for the parallel processing required in AI and deep learning. They
    set out to develop processing power strong and nimble enough to serve the complex
    needs of AI partners and deep learning tasks.


    While those competitors were already household names, and might have seen reports
    of `Nvidia`’s research investments, they were probably not too fazed by what it
    meant. What may have seemed like desperation or delusion was in fact `Nvidia`’s
    measured preparation, laying the groundwork for projects destined to stay under
    wraps for almost a decade. Competitors had no idea that `Nvidia`’s `R&D` efforts
    were not just about enhancing their `GPUs` for gaming—a market they already dominated—but
    also delving into AI, autonomous vehicles, and deep learning. Its strategy was
    patience: wait for the perfect market conditions before unveiling groundbreaking
    technologies.


    Long before the “AI boom” took hold in the popular marketplace, these projects
    were quietly advancing at a rapid pace at `Nvidia`. Their engineers and scientists
    were pushing the boundaries of what their technology could achieve, setting the
    stage for a future where their innovations would revolutionize multiple industries.
    In other words, `Nvidia` was not merely reacting to current market demands; it
    was preparing for future shifts, ensuring that when the right moment arrived,
    they would be ready to lead the charge with cutting-edge technology that would
    fill a need its consumers would be just coming to realize they wanted fulfilled.


    `Nvidia` continued to prepare, continued to recruit the best minds and stay as
    flat as possible. They were preparing for a spark.


    ### Editor’s Note


    As this book was going to press, the investment world that had pushed `Nvidia`
    to become one the most valuable companies received shocking news. A Chinese company
    called `DeepSeek` claimed it had built an open-source model called `R1` that was
    comparable to `ChatGPT`. But `DeepSeek` said it had done so for only $6 million,
    a tiny fraction of what big clients were spending on these models. Overnight,
    Nvidia stock dropped by 17 percent and the company lost $600 billion in value,
    the largest one-day drop for a single company in the market’s history. Some pundits
    declared the DeepSeek` announcement as the “end of Nvidia.” Some believed that
    the spark behind Nvidia has been doused. The only people that didn’t panic were
    Jensen Huang and his team. They knew that it was a less-advanced version of their
    own product that had allowed the Chinese company to build the model. Huang was
    silent for the first few days but ultimately offered a response, saying investors
    “got it wrong” and that the advent of products like `DeepSeek` would only add
    fuel to the world’s desire for more AI models. Huang said: “It is so incredibly
    exciting. The energy around the world as a result of R1 becoming open-sourced—incredible.”
