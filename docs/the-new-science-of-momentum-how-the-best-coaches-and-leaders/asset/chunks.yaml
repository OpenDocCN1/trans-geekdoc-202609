    - **Underlying Assumptions:** These are the unconscious, taken-for-granted beliefs,
    perceptions, thoughts, and feelings that truly drive behavior within the organization.
    Underlying assumptions are deeply embedded and hard to change, but they form the
    essence of the culture.


    Schein once said that “culture is not a surface phenomenon; it is our very core.”
    What this really means is that leaders must play an active role in shaping the
    cultural norms needed to execute strategy efficiently and effectively. On top
    of that, they have to build a culture that allows the organization to quickly
    adapt to opportunities or handle challenges when they come up.


    ![](images/f072-01.jpg)


    Schein also points out that culture is essential for helping an organization adapt
    to the world around it and maintain strong internal alignment. It’s the guidebook
    that tells people how to deal with challenges, make decisions, and work together
    smoothly. Externally, culture shapes how a company interacts with customers, competitors,
    and regulators. It affects the strategies, goals, and practices that help the
    company succeed in its environment. Internally, it creates cohesion by establishing
    shared language, norms, and values. Simply put, culture helps people understand
    their roles, resolve conflicts, and collaborate more effectively.


    If you’re trying to build momentum, embedding cultural norms that promote agility
    can be a game changer. A five-year study of workers in US and European companies,
    conducted by Gallup, identified eight factors that influence how quickly an organization
    can respond to business needs—these are what Gallup called the “Agile 8.”


    ![](images/f073-01.jpg)


    Gallup’s research also highlighted how central managers are in shaping the employee
    experience. A key takeaway from a 2018 Gallup article was that “only half of employees
    globally know what’s expected of them at work.” It’s tough to respond quickly
    when employees don’t know what their responsibilities are. The article also pointed
    out several key leadership behaviors that support the Agile 8 cultural norms,
    such as engaging the workforce, proactively managing performance, coaching and
    developing team members, and collaborating well with other managers. These behaviors
    are closely aligned with the elements of our Momentum Model.


    So where does your organization’s culture stand right now? And what steps can
    you take to change or improve it?


    Schein believed that “organizational cultures are created by leaders, and one
    of the most decisive functions of leadership may well be the creation, the management,
    and—if and when that may become necessary—the destruction of culture.” He recognized
    that this isn’t easy, though. “Changing the culture of a group is very difficult,
    not because people consciously resist new ways, but because of the unexamined
    assumptions they hold and the comfort that comes from the shared meaning those
    assumptions provide.”


    To maintain and strengthen a culture, Schein stresses that it has to be reinforced
    through “every human interaction within the organization.” He outlines several
    steps leaders can take to manage and transform culture effectively.


    - **Assessment:** Leaders must assess the current culture by identifying artifacts,
    espoused values, and underlying assumptions.

    - **Alignment:** Leaders should align organizational structures, processes, and
    practices with the desired culture.

    - **Communication:** Consistent communication of the desired culture through stories,
    symbols, and rituals is crucial.

    - **Role Modeling:** Leaders need to embody the desired culture through their
    actions and decisions.

    - **Reinforcement:** Reward systems and recognition should reinforce behaviors
    that align with the desired culture.

    - **Evolution:** Recognizing that culture change is a gradual process, leaders
    must be patient and persistent in their efforts.


    “Culture eats strategy for breakfast,” said management guru Peter Drucker. And
    that rings true. You can have the best playbook, the most skilled players, but
    if they don’t buy into the culture, it’s not going to work.


    In 2024, Nvidia ranked number one in Indiggo’s “Return on Leadership” scorecard,
    resulting primarily from the company’s high scores in strategic clarity, leadership
    alignment, and focused action—factors that mirror Schein’s research and create
    the most fertile ground, or potential energy, for momentum.


    Leadership influences a team’s direction, alignment, and level of commitment.
    But culture serves as the vehicle for how people elect to behave over time. Leaders
    must reinforce the behaviors and norms (for example, setting measurable subgoals)
    that set the conditions for generating positive momentum while also stamping out
    the behaviors that allow negative momentum to continue unabated (for example,
    allowing a lack of accountability). Getting the right people placed in your critical
    roles and holding them accountable for their teams’ behaviors over time is how
    you build a supportive culture (as opposed to one that holds the team back from
    doing the things required to seize upon momentum or reverse it when trending in
    the wrong direction).


    Before coaching the Warriors, Steve Kerr was a player himself. By 2003, he had
    played for six different NBA teams under six different head coaches. So, while
    he had never coached a team himself, he was no stranger to the various styles
    and approaches professional coaches. He’d no doubt gained perspective on what
    worked, and didn’t, and brought to his team a style that translated to phenomenal,
    sustainable momentum on the court and palpable joy while doing so.


    What would a culture of joy look like in your organization?


    The Burke-Litwin Change Model examines eleven factors that influence individual
    and organizational performance. One of the components of their model is organizational
    culture. Burke and Litwin identified several questions one should explore in service
    of identifying a “relatively enduring set of values and norms that underlie a
    social system.” The following five questions are a sample of ones the model related
    to:


    1. Does your organization have a distinct, apparent, readily identifiable culture?
    If so, what words would you use to describe it?

    2. What seems to drive people in this organization (or what is it that consistently
    gets people’s attention)?

    3. To what extent are organizational members clear about “how we do things here”?

    4. To what extent are members treated with respect and dignity?

    5. Is conflict surfaced and managed, or is it avoided?


    ## Leader Actions


    Edgar Schein once said, “The only thing of real importance that leaders do is
    to create and manage culture.” Schein’s work classified five things (that is,
    primary mechanisms) as the most powerful drivers one can leverage in service of
    modifying culture. The five items are as follows: what leaders pay attention to,
    measure, and control; leader reactions to critical incidents and organizational
    crises; deliberate role modeling, teaching, and coaching; criteria for allocation
    of rewards and status; organizational design and structure. Using these behaviors
    will be key when undertaking the following proposed actions related to fostering
    momentum.


    #### ACTION 1:


    ```

    Ensure your teams routinely reflect on their actions.

    ```

