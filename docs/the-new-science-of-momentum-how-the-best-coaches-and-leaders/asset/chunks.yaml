    # 生物识别与团队动力学


    生物识别技术（如心率变异性、皮肤电导和脑电图）已被用于研究团队动力学。这些衡量指标提供了团队成员之间生理同步性的洞察，而这是团队凝聚力的关键组成部分。例如，一项针对运动团队的心率变异性研究发现，在竞争任务期间，较高的凝聚力水平与更强的生理同步性相关。高凝聚力团队表现出更同步的心率，表明他们对压力和兴奋有共同的生理反应（Kwon
    et al., 2024）。这种同步性被认为可以增强沟通与协作，从而带来更好的表现。


    特别是脑电图（EEG）研究，为团队成员的神经同步性提供了宝贵的见解。在一次实验中，EEG 数据显示，与非凝聚团队相比，凝聚团队成员在合作任务期间具有更同步的脑波模式。这种神经同步性被认为有助于更好的沟通与协调，实现更有效的团队合作（`Smithsonian
    Magazine`, 2020）。


    ## 功能性磁共成像研究与大脑活动


    功能性磁共成像（fMRI）研究进一步深化了我们对团队凝聚力如何影响大脑活动的理解。一项显著的研究检查了在合作任务期间凝聚团队与非凝聚团队的大脑活动。来自高度凝聚力团队的参与者在与社会认知相关的脑区域（如内侧额叶皮层和颞顶交界）表现出更强的激活。这些区域对于理解他人的意图和协调共同行动至关重要（Santoro
    et al., 2015）。


    另一项使用功能 MRI 的研究探索了团队凝聚力如何影响对社会排斥的反应。凝聚团队成员在前扣回皮层中的活动较少，该区域与社会排斥的情绪痛苦有关。这表明，凝聚团队提供了一种应对排斥负面影响的缓冲，增强了情感韧性（Maynard
    et al., 2015）。


    ## 解释中的挑战


    解释结果的复杂之处在于，很难将凝聚力的产生原因与其结果隔离开来。例如，在证明凝聚团队在与社会认知和协作相关的脑区域显示出更强激活的 fMRI 研究中，这种增强的大脑活动不仅是凝聚力的衡量标准，也是其结果。


    从实践上来说，大多数企业、运动队、军事单位或其他组织无法获得功能 MRI 技术来定期（如果有的话）评估成员的大脑如何相互反应。但通过使用定期发布的问卷以及对协作进行独立观察，可以赋予领导者衡量和基准其内部凝聚力的能力。


    ## 氛围与文化


    氛围（Climate）与文化（Culture）之间存在重要区别。团队氛围可能随着一个人的改变而改变，但文化更加无处不在——改变一种文化可能需要多年。不出意料，氛围更像天气——反映了根据文化规范执行情况的当前工作环境状态。在
    2017 年的一篇 Medium 文章中，Jason Cummins 详细介绍了氛围与文化之间的七种区别。以下是他提到的关于氛围与文化差异的一些关键要点和警告：


    1. 氛围是浅层且反复的。文化是深层且持久的。氛围衡量组织的当前温度；文化则调节组织的温度。

    2. 氛围依赖于现状。文化能够抵御现状。

    3. 积极的氛围随成功之后。积极的文化能经受住成功。

    4. 氛围的变化更容易且可以快速发生。文化的改变很困难，耗时比我们预期的要长。

    5. 氛围是团队对当前事件和情况的反应。文化使团队能够应对不可预见的事件并在困境中坚持下去。

    6. 氛围领导者天生是反应性的，倾向于选择基于短期的快速解决方案。文化领导者天生是有意图，并愿意选择艰难的道路。

    7. 积极的氛围可以带来信任、创新和参与感，而消极的氛围可能导致冲突和糟糕的结果。


    ## 认可的角色


    考虑到氛围的直接性和影响，领导者必须理解建立良好氛围需要什么。认可和庆祝成功等关键因素都有帮助。Quantum Workplace 的研究得出结论：如果员工仅仅相信他们会获得认可，他们高度投入的可能性将是原来的
    2.7 倍。2.7 倍的倍数并不是什么小事。这是每小时行驶 60 英里与 162 英里之间的区别。或者这是获得 20% 选票与赢得选举的 54% 选票之间的区别。这是在一个季度赚取
    2.7 亿美元与 1 亿美元的区别。或者，用一个更直接的投入例子来说，团队成员投入了接近 100% 的精力。


    Quantum 进一步发现，52.5% 的受访者希望从直属经理获得更多认可，41% 的人希望从同事和伙伴获得更多认可。当团队成员得到适当认可时，对于建立积极氛围大有裨益。


    ## 镜像神经元的发现


    加州大学洛杉矶分校的 Marco Iacoboni 教授并不是为了研究镜像神经元——这种在执行动作以及观察他人执行相同动作时都会触发的特殊脑细胞。相反，当被誉为镜像神经元发现者的科学家
    Giacomo Rizzatti 接触他时，Iacoboni 起初不同意就人类这一现象的研究进行合作。Iacoboni 用自己的话说，对这种想法是“不可置信”的，并假设镜像神经元虽然在概念上极其有趣，但太神奇了而不可能是真实的，而是某种人为产物。


    对于这位医生兼博士学神经科学家来说，产生这种程度的怀疑是合理的。事实上，镜像神经元的发现对于那些首次记录它们的人来说确实是一个惊喜——如果可以的话，是一次偶然的发现。科学家一直在观察猴子的大脑以理解什么控制抓取动作。令他们惊讶的是，当猴子自己抓取物体时“亮起”的大脑区域，在猴子休息观察另一个体抓取物体时也会触发。


    Rizzatti 坚持招募 Iacoboni 加入他的研究团队，而且他引起了 Iacoboni 足够的兴趣，使后者同意访问位于意大利帕马的实验室以了解更多。从那时起，一切发生了变化。Iacoboni
    观察了这项发现的研究、结果和解剖结构，这项发现彻底改变了我们对人类相互作用的理解。它也将改变 Iacoboni 的职业生涯。

