    Ultimately, the spark is the place where belief systems begin to shift. Momentum
    is a mentality. It’s as much about your belief system as it is about the outcomes.
    One of the keys to this block in the model is how leaders train their team to
    see the spark. You want the team to see it favorably, though that doesn’t always
    happen naturally. Some on a team might see a spark and react, “If this happens,
    it will mean so much more work for us.” But when the leader can help frame it
    favorably, the team should think, “Look at all the opportunities we should get!”


    To do this well requires the ability to see the spark when it appears and to help
    fan it in a way that the flame of momentum becomes unstoppable.


    ### Preparatory Activities for Leaders


    Leaders can prepare their teams to recognize a spark in a variety of ways. Here
    are three examples of preparatory activities.


    First, they must strive to ensure clarity exists within the team regarding the
    organizational objectives and potential outcomes associated with them. There is
    research that concluded work performance was enhanced when process and goal clarity
    was high provided that team members are committed to the goal.


    Second, leaders must share information effectively to prepare their teams for
    seizing opportunities. Information power is one of the six power bases defined
    by John R. P. French and Bertram Raven in “The Bases of Social Power.” This type
    of power is focused on the ability to control the flow of information required
    to get things done. Information power is one of the three bases that if utilized
    well is likely to lead to greater commitment. (Altogether, there are six power
    bases that are likely to bring out one of three outcomes: commitment, compliance,
    or resistance.)


    Finally, leaders must teach their teams to collaborate. Numerous research studies
    have detailed how organizations benefit from effective collaboration. The 2007
    *Harvard Business Review* article “Eight Ways to Build Collaborative Teams” by
    Lynda Gratton and Tamara J. Erickson detailed the following preparatory actions
    leaders should continually strengthen in order to enhance collaboration:

    - investing in signature relationship practices (for example, securing state-of-the-art
    team collaboration software);

    - senior leaders modeling collaborative behaviors;

    - creating a “gift” culture (that is, mentoring and coaching people regularly
    at all levels);

    - ensuring the requisite skills (for example, equipping employees through training
    to understand they can build relationships, communicate well, and resolve conflicts
    creatively);

    - supporting a strong sense of community;

    - assigning team leaders that are task and relationship oriented;

    - building on “heritage” relationships (that is, placing at least a few people
    who have worked together previously on the team);

    - and making sure individual roles are clearly defined and the team is empowered
    to figure out how to accomplish its tasks.


    ### The Role of Tragedy


    Success can provide a spark, but so, too, can tragedy. It’s often uncomfortable
    to talk about, and we have certainly struggled with how to portray stories of
    positive momentum that started with a terrible event. Not every disaster results
    in momentum toward positive change. But this does happen, and it represents a
    type of spark that—discomforts and all—should’t be discounted.


    In politics and public policy, this potential is not uncommon: the spark for social
    change is often delivered from a particularly egregious wrongdoing or oversight.
    Public policy, at its best, predicts its own flaws and adjusts before calamity
    strikes, but in reality, policy change takes enormous effort and doesn’t abide
    by any set schedule. Sometimes, advocates for a certain issue feel like they’re
    screaming into a black hole, hoping their voices will result in heightened awareness
    of a problem; and sometimes, these voices go unheard until something terrible
    happens. The illustration we chose here is especially dramatic, both in the magnitude
    of catastrophe that represented the spark but also in the immediacy of change
    it led to. It also happens to be devastatingly literal.


    • • •


    ### Case Study: The Triangle Shirtwaist Factory Fire


    On Saturday, March 25, 1911, the workday at the Triangle Shirtwaist Factory in
    New York City was winding down. The hum of sewing machines filled the air as the
    afternoon sun streamed through the grimy windows. The factory, located on the
    top three floors of the Asch Building in New York City, was a maze of narrow aisles
    crammed with rows of tables, fabric scraps, and about five hundred young women—mostly
    immigrants and some as young as fourteen—hunched over their work.


    The fire that took hold and rapidly consumed the building is believed to have
    started from a discarded cigarette or match igniting a bin of cotton scraps. Within
    minutes of the spark—whatever it had been—flames spread rapidly through the factory,
    feeding on the fabric and paper patterns scattered everywhere. The workers were
    thrown into panic. They rushed toward the exits, but escape was hindered by several
    factors, including the cruel but common practice by factory owners to lock doors
    and stairwells in order to avoid theft and unauthorized breaks from work. The
    factory was a death trap.


    Yetta Lubitz, a survivor of the fire, later testified about the harrowing experience.
    She described the chaos and desperation that engulfed the factory floor. There
    was no time to think, she recounted—the smoke was suffocating, and the women could
    hardly see through it. With the main exit blocked, workers sought other ways out.
    Some tried to use the fire escape, but the flimsy structure collapsed under the
    weight of the fleeing workers, sending many plummeting to their deaths. Others,
    in a desperate bid to escape the flames, jumped from the windows, only to meet
    a tragic end on the pavement below. Some, such as Yetta, managed to survive by
    fleeing to the roof, where they were rescued by neighboring buildings’ employees
    who helped them to safety. Firefighters arrived quickly, but their equipment was
    inadequate. Their ladders could reach only the sixth floor, far below the burning
    factory floors. Witnesses on the street watched in horror as the fire consumed
    the building and workers jumped to their deaths.


    In the aftermath, 146 workers were confirmed dead. The public outrage that followed
    the fire was immense. It sparked a wave of mourning and anger that swept through
    the city. Vigils and protests were held, demanding justice for the lives lost.
    The tragedy exposed the brutal realities of industrial labor and ignited a movement
    for change, and indeed, it electrified existing efforts to improve working conditions.


    One witness to the fire was Frances Perkins. She was having tea with friends nearby
    when she heard the commotion and rushed to the scene. She saw the horrors of workers
    jumping from the burning building and suffocating inside. Perkins was no stranger
    to the need for reform. She was already deeply involved in labor advocacy—working
    with organizations like the New York Consumers League, which aimed to improve
    labor conditions, particularly for women and children. She had already been advocating
    for reforms to working hours, safer conditions, and better wages when she witnessed,
    before her eyes, perhaps the most tragic justification for her concerns. Her involvement
    only increased from there—she was appointed to the Committee on Safety of the
    City of New York and ultimately was appointed as the first female US secretary
    of labor by President Franklin D. Roosevelt.

