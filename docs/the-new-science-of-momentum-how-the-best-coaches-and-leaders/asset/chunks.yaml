    # Introduction

    Just as Jim Collins and John Kotter have provided foundational frameworks in the
    fields of leadership and organizational change, our research has led to the creation
    of a comprehensive model for understanding and generating momentum within teams
    and organizations. Through extensive interviews, rigorous data analysis, and a
    thorough review of the existing literature, we have identified nine interconnected
    elements that are crucial for optimizing momentum: leadership, culture, recruitment,
    preparation, spark, leader communications, team climate, belief and mindset, and
    outcomes and feedback. These elements not only work together to maximize the positive
    effects of momentum but can also serve as tools for reversing its downturn when
    an organization finds itself struggling. Each of these factors will be explored
    in depth in the following chapters, providing you with actionable insights and
    strategies.


    ![](images/f033-01.jpg)


    Before diving into the specific chapters, we want to give you a clear overview
    of how these components interact and reinforce one another. By considering how
    they show up in your own organization, you can begin to assess where the sparks
    of momentum may emerge and how you can harness them to drive sustained success.
    Momentum isn’t simply about capitalizing on favorable moments—it’s about understanding
    how to prepare for them, actively create them, shape them, and even work against
    them when things seem to be going against your team.


    ![](images/f034-01.jpg)


    ## LEADERSHIP

    “A leader takes people where they want to go. A great leader takes people where
    they don’t necessarily want to go but ought to be.”


    —ROSALYNN CARTER


    For the purposes of this model, the focus is on the action leaders take across
    multiple domains in service of effectively building upon moments. Leadership is
    a phenomenon examined at the individual, group, and organizational levels of analysis.
    Countless people have sought to codify the knowledge, skills, and attributes associated
    with effective leaders.


    In the following chapter, you’ll hear from renowned leaders we interviewed for
    this book, including General David Petraeus, sharing both theoretical and tactical
    tips for structuring leadership in a way that maximizes impact on every other
    element of this model: Leaders recruit; leaders shape culture; leaders drive preparation
    and the ability for team members to recognize both the various forms and shapes
    of spark; leaders communicate with teams to take action when it happens; leaders
    set the tone for team climate; and leaders foster beliefs and mindsets. Finally,
    leaders provide and accept feedback from major and passing outcomes, processing
    these inputs and using them to inform the next actions—the next recruitments,
    preparations, communications, and more.


    ## CULTURE

    “The only thing of real importance that leaders do is to create and manage culture.
    If you do not manage culture, it manages you, and you may not even be aware of
    the extent to which this is happening.”


    —EDGAR SCHEIN


    In “The Leader’s Guide to Corporate Culture,” Boris Groysberg, Jeremiah Lee, Jesse
    Price, and J. Yo-Jud Cheng characterized culture as “an organization’s tacit social
    order that shapes attitudes and behaviors in a lasting way.” Edgar Schein’s key
    article “Issues in Understanding and Changing Culture” defined culture as a “pattern
    of basic assumptions—invented, discovered, or developed by a given group as it
    learns to cope with its problems, external adaptation, and internal integration—that
    has worked well enough to be considered valid and, therefore, to be taught to
    new members as the correct way to perceive, think, and feel in relation to those
    problems.” Said in the most basic of ways, culture is all about the norms, values,
    and beliefs.


    ## RECRUITMENT

    For a team to seize momentum, it requires that nearly all team members are willing
    to do what is best. Team success must be a higher priority than individual success.
    A culture of “We” as opposed to “I” is essential in this pursuit.


    In the recruitment chapter, you’ll be given the opportunity to identify which
    elements, or qualities, may maximize chances for momentum. We will discuss the
    elements across our pillars, and conclude with interpersonal dynamics and potential
    assessment tools that can aid in identifying and recruiting “team players” and
    developing “momentum culture.”


    You’ll also hear from our original interviews with a handful of leaders in sports,
    government administration, and business—including basketball coach Sue Semrau,
    World Series winner David Ross, CEO Bob McDonald, and CEO Amy Howe. While recruitment,
    culture, and preparation all share space on a wheel, which lacks hierarchy, there’s
    a reason why we place recruitment on the top of the circle.


    ## PREPARATION

    Preparation may be the most widely studied and acknowledged input for success:
    John Wooden, Vince Lombardi, Peter Drucker, Jim Collins, and many others have
    popularized the deep importance of preparation and practice for success. But in
    our model, preparation means something more: being prepared not only to perform
    your role optimally but to spot and react to momentum, to sparks.


    Specifically, how does one prepare to seize a moment?


    If you’re only reacting to momentum once it’s happening, you’re already at a disadvantage—whether
    you’re on the positive or negative side of the phenomenon. Spotting Mo—and the
    spark(s) that precedes it—isn’t just about predicting game outcomes or enjoying
    the thrill of those moments. The ability to spot Mo is essential for individuals
    and teams in order to capitalize on momentum.


    Here, you’ll read from our conversations with Nvidia cofounder Chris Malachowsky,
    Coach Buzz Williams, and famed political consultants James Carville and John McLaughlin
    to explore the elements necessary to prepare for and generate momentum before
    the surge begins, and lay the groundwork to make yourself receptive to the mental
    and physical processes triggered by a realization of momentum.


    ## SPARK

    “Momentum doesn’t exist until you get that first victory. Before that, it’s just
    motivation.”


    –JOHN MAXWELL


    Victories aren’t always ultimate wins. In the military context, there are battles,
    and they may be a long way from determining the outcome of the war. Momentum is
    not static. Momentum is, by its very definition, movement. Sparks can initiate
    the movement if the right team has been recruited, they are communicating, and
    they are prepared.

