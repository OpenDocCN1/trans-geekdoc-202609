    “When you hear ‘Make it a great day’ as a young kid, initially, you’re rolling
    your eyes,” Geraghty shared with us. “But over time, it sort of sinks in that
    ‘Make it a great day’ means you have impact every day, you have the ability to
    influence what happens to you, or at a minimum, you have an ability to influence
    how you react to what happens to you, and how you, you internalize the lesson,
    if you will. So my dad said it all the time. And it’s something that I use with
    my team. And I think it does make a difference here.”


    ## Leadership Through Presence and Action


    When Geraghty first joined `GuideWell` and `Florida Blue`, it was clear there
    were issues—with customers and team members alike. Geraghty didn’t just ask for
    reports on call volumes or issues but made a point of spending time on the front
    lines, sitting down in the call center and listening in on customer service calls.
    This was not just a symbolic gesture; it was a deliberate effort to understand
    the customer experience and the challenges faced by employees in serving them.
    The impact of this action reverberated throughout the organization, sending a
    clear message that leadership is not removed from the day-to-day realities of
    the business.


    On the “home front,” Geraghty was listening too. He didn’t establish committees
    and wait for bureaucratic recommendations. He asked for input and then put things
    into action that spoke for themselves. For example, Geraghty eliminated executive
    parking privileges within twenty-four hours of a suggestion from an employee.
    This small but significant change communicated that no one in the organization
    was above the rest, and it broke down perceived barriers between leadership and
    staff. These actions were not just about the changes themselves but about what
    they represented—a commitment to a more egalitarian, inclusive, and responsive
    organizational culture.


    ## The Power of Debate and Debate


    `Listening` is, indeed, another form of communication. Young Pat Geraghty’s household
    gave him preparation in that arena as well. It was “debate filled,” he told us,
    where dinner conversations were lively discussions about current events and where
    everyone—children included—were expected to come prepared with facts and reasoned
    arguments. This environment fostered an appreciation for opinions and a recognition
    that disagreement, when handled with respect, can lead to better decision-making.


    “Our parents encouraged an active, lively, engaged discussion of what was going
    on in the world,” he told us. “And, you know, one of the basic things that come
    out of that, for me, is I absolutely don’t mind being challenged. In fact, I encourage
    it, and I love when somebody comes well prepared and has thought through their
    position. And, in fact, at the end of the day, if they have better arguments or
    a better description of the situation at hand, I’d be foolish not to go with their
    recommendation. So it creates an environment where I think people understand they
    contribute. Because it’s not a top-down environment. It’s a merit-based environment
    where the best ideas carry the day.”


    ## Calm and Vulnerability


    Geraghty also communicates through a sense of calm—a style he attributes in part
    to inspiration from watching famed basketball coach `John Wooden`.


    “One of my great role models in life was `John Wooden`, and `John Wooden` with
    a rolled-up program in his hand,” he said. “But you didn’t see him screaming a
    lot. You know, he was purposeful. He had planned well; he had done all the preparation.
    And then in the moment, he kept himself grounded. And so it was a role model for
    me to be thinking about. You have many people that influence your leadership style,
    and you try to take certain things from them.”


    Early in his career, Geraghty learned that trying to project an image of perfection
    was not only unsustainable but also counterproductive. By admitting mistakes and
    showing vulnerability, he has created a culture where his team feels safe to do
    the same. This openness fosters a more honest and transparent work environment,
    where challenges are addressed head-on, and continuous improvement is embraced.
    Comfort with vulnerability became particularly valuable during times of transformation
    and restructuring. Geraghty’s willingness to acknowledge the difficulties involved
    in change and to share his own uncertainties has helped to build trust and resilience
    within his team. By leading with vulnerability, he not only models the behavior
    he expects from his team but also creates an environment where collaboration and
    collective problem-solving can thrive.


    ## Storytelling as a Tool


    Geraghty understands that one of the most effective ways to communicate as a leader
    is through storytelling. Facts and figures are important, but they often fail
    to inspire. A well-told story, on the other hand, can move people, change mindsets,
    and drive action. Geraghty uses storytelling to highlight successes, illustrate
    challenges, and reinforce the values and mission of his organization.


    “I believe in the power of storytelling. I think a narrative actually moves the
    mindset,” he said. “And so when you can put in narrative form what you’re accomplishing,
    that is powerful to people. You can pile statistics on folks, and they’re just
    going to, you know, over, but a great story—that sticks. And so we are very intentional
    about storytelling. Our communications team is fabulous at storytelling and positioning
    our leaders—not just me but across the leadership team—to be storytellers to make
    sure we’re reinforcing the messages and the things that impact our customers.”


    ## Conclusion


    Geraghty’s example underscores the many forms that leader comms can, and ideally
    should, take: His communications take the form of intentional, debate, calmness,
    storytelling, and, above all else, action


    This combination delivered a powerful punch for `GuideWell` under Geraghty’s leadership.
    `GuideWell`, the holding company for `Florida Blue`, became the first in the country
    to transition into a mutual holding company within the health care sector. When
    they began this process, only two other companies in their state had done something
    similar, but both were in property and casualty insurance, and it took them eighteen
    to twenty-four months. `GuideWell`, however, achieved this transformation in just
    six months, much faster than anyone had done before. This rapid success challenged
    the perception that the company was slow and disjointed, demonstrating their ability
    to work efficiently across divisions.


    “People would have told you we’re slow, we don’t work across divisions, and I
    made a purposeful demonstration for folks about how fast it was done, how many
    parts of the organization had to contribute, to get it done,” Geraghty said. “Yet,
    when we went to our membership, 93 percent of our members voted in favor of putting
    this mutual insurance holding company in place. They’re the owners of our organization.
    So we were breaking down sort of the urban myths about how we moved as a company,”
    Geraghty reflected.

