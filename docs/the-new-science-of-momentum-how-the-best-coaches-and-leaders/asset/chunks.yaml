    or intangible ones, such as believing in fairness or justice. But, in general,
    beliefs tend to be fairly specific in scope. For example, Victor Vroom, a longtime
    professor at Yale’s School of Management, developed a motivational framework (expectancy
    theory) that explains how people choose to act based on their expectations of
    the outcomes. The theory examines three relationships regarding an individual’s
    belief in the likelihood of something transpiring. The first relationship was
    called “expectancy.” It essentially asks the question “If I try it, can I do it?”
    The second relationship was called “instrumentality.” This relationship poses
    the question “If I do it, will I get the reward?” Finally, the third relationship
    was called “valence.” It asks the question “If I get the reward, will I value
    it?” If someone possesses a weak belief in any one of the relationships, motivation
    is lowered.


    Mindsets, on the other hand, are a way of thinking or relating to these shared
    beliefs and become a set of attitudes or ideas that influence behaviors and outlooks.
    Mindsets are broader and encompass various beliefs that collectively determine
    one’s approach to life, challenges, and opportunities. While beliefs form the
    foundation of mindsets—in that what someone believes about themselves, others,
    and the world shapes their mindset—the latter concept has a far more overarching
    influence on behavior.


    It’s no surprise, then, that beliefs are more easily changed than mindsets. One
    may be persuaded by new facts and change beliefs or even assumptions about a person,
    event, or environment around them, but changing mindsets requires something to
    influence several interconnected beliefs. And some types of individual or group
    mindsets are structured in ways that influence how easily they can be changed.


