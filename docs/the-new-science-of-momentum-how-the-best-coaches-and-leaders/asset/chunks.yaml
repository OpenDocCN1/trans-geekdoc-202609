  trans: "\n\n不久后，布雷迪在端区找到了丹尼·阿门多拉并达阵得分。贝利奇克立即举起两个手指，示意他的球队要尝试两分。他们通过一次经典的贝利奇克式欺骗获得了这两分：球直接传给了\
    \ `White`（而不是 `Brady`），由他完成了达分。比分瞬间变为 28–20，在距离比赛结束不到六分钟的情况下，这场看似不可触及的比赛变成了任何人都有机会的较量。那时，观察双方球员的肢体语言，可以发现一种显而易见的变化。麦考考蒂总结道：“当我们只落后一个达阵时，他们的球员……他们的眼睛开始变大。他们知道我们要上了。他们知道我们有`Tom\
    \ Brady`，如果他在对面，没人想处在一个一分之差的比赛中。而我们的眼睛开始收紧。我们全神贯注。这是对前三半回合的完全反转。他们有一名特种球员，在比赛的大部分时间里都在我们场边叫叫，在每次开球后都挑衅。当我们只落后一分时，你可以看到他在开球后静静地转身走下场。而现在，我们才是那个尖叫的人。人们没有意识到，开球时有这么多防守球员，当他们的进攻方上场时，能量会直接流入下一次进攻。双方都清楚这一点。你们双方都能感受到。这几乎像是一种出体体验。”\n\
    \n比赛还剩四分钟时，亚特兰大将球推进到了新英队的 22 码线，这个距离足够进行一次射门，足以让新英队很难再有反比可能。但爱足人队的防守再次做出了回应。麦考蒂铲倒了猎鹰队的持球者造成损失，随后\
    \ `Trey Flower` 在 40 码线附近围擒了 `Ryan`。在下一次进攻中，新英队的防守压力迫使一名亚特兰大锋球员犯规，将球又推得更远。鹰队确实在推进球……问题是他们正朝着错误的方向推进。\n\
    \n爱足人队迫使鹰队弃踢，并在自己的 10 码线内抢回了球。他们还有三多分钟的时间来完成 90 码达阵，之后他们必须再次尝试两分。`Brady` 连续向三个不同的球员传了三次球。其中一人在跑路线时绊倒摔地，站起来后仍然接住了球。另一个人，`Julian\
    \ Edelman`，传球在他面前被挡了一下，导致球落到了至少三名鹰队球员伸出的手手中，他们向球聚拢而去。\n\n比赛结束。\n\n但并没有结束。不知怎么，`Edelman`\
    \ 在他们之中穿梭并抓住了球，回放显示他的注意力是如此绝对，以至于你可以看到他将球抵在对手的腿上以防止球落地，如果落地的话，球会被判为未完成。\n\n比赛还剩一分钟时，`White`\
    \ 冲球达阵，使新英队与猎鹰队仅差两分。在两分转换期间，一名猎鹰队锋线球员越位抢断，但仍未能阻止 `Edelman` 接住一个短平传球并将球压过球门线。此时，观战比赛的人们正在见证史以来最伟大的超级碗碗赛逆转。\n\
    \n“能量完全在新英队这边，”艾克曼说，“这是两场完全不同的比赛。我不知道鹰队在加赛中如何应对。”\n\n他们没有得到机会。爱足人队赢得了掷硬币并选择先接球。现在，在进攻线的良好保护下，`Brady`\
    \ 继续拆解猎鹰队的防守，并在一名鹰队防守球员在端区被判传球干扰后，带领新英队进入一分达区。两次进攻后，`White` 再次冲球达阵，赢得了新英队的又超级碗胜利。\n\
    \n当纸屑像雪一样落在球员和冲入场地的人群身上时，一位国家广播播音员总结道：“加赛最终比分 34–28，新英爱足队今晚重新定义了‘势头’这个词。”\n\n\
    第二天早上，这本书诞生了。当时一位体育作家在佛罗里达州聚集了一个团队，面对一块巨大的白板，写下了文字`一个团队如何将一个瞬间转化为势头？` 在接下来的七多年里，这个项目发展到包括一位退休的陆军将（他的最后一次职务是担任西点美国军事学院行为科学与领导力系主任）；一位来自学术界备受尊敬的研究科学家；以及公共舆论和政治领域最优秀的数据分析师之一。白板上的问题列表不断增加：你如何准备“那个瞬间”？势头可以产生吗？它能被延伸吗？如果它反过来对你该怎么办？\n\
    \n在过去的几年里，对世界知名专家、冠军教练、军事领袖、政治竞选策略师和企业领袖进行的数百次采访和数千次调查，引导我们得到了你今天手中的这些文字。\n\n\
    有一点变得清晰：对于我们所寻求学习的人来说，势头是真实的。如何准备、操纵、延伸或反转它成了我们的任务。这本书将为你提供一个恰恰可以做到这些的模型。\n\n\
    所以，利用这句话的能量来推动你进入下一章。走吧！\n\n## 前提：从心流到势头\n\n当米哈雅·契克森特米哈赖开始探索他的“心流”理论时，他被称为疯子、怪胎。这位受人尊敬的教授和研究人员坚信，处于“心流”状态的人能够保持长时间的注意力，因此能够成就更大的事业。他知道自己在写作时感受过这种感觉。他知道自己在那些似乎处于百发不中状态的运动员身上见过这种感觉。但当他提出“心流”是一种“状态”且应该被追求的观点时，他的专业同事最初对此嗤以鼻。三十年后，契克森特米哈赖的开创性著作`心流：最优体验心理学`不仅被广泛接受，而且是一本畅销书，被誉为表现心理学领域影响最大的理论之一。我们很幸运在他\
    \ 2021 年去世之前，与他进行了一次长时间的晚餐采访，期间他分享了对“心流”演变的看法，并与我们讨论了这一概念与势头之间的交集——无论是在个人经历还是团队层面。\n\
    \n心流状态近期引起了极大关注，因为生物黑客正在寻找方法进入这种高强度的创造力和生产力状态，特别是对于那些寻求表现最大化的个人而言。正如运动员长期以来所称的“进入状态（being\
    \ in the zone）”，心流状态现在被广泛认为这种现象绝不局限于运动，而是一种近乎狂喜的可能性感和成就感，且几乎没有时间、限制或现实约束的感觉。\n\
    \n    心流状态对团队和个人都有深远影响。新兴科学开始证明长期以来被假设的：`镜像神经元`的存在，它们似乎是人类同理心和直觉的基础。这些是化学信使，传输预期动作并引发我们周围的自动反应。一个简单的例子：你有多少次在看到一两个人打哈欠后自己也想打哈欠？但从更大的意义上说`镜像神经元`似乎是任何集体情绪——兴奋、歇斯、势头——在群体中有机传播的关键。\n\
    \n"
- fmt: "\nTransference of energy is one of the key properties of creating momentum\
    \ in physics; it is also the secret to building momentum within a team. But how\
    \ does this process happen? Enter mirror neurons as one possibility. As one team\
    \ member begins to experience success, the mirror neurons of their teammates begin\
    \ to register those accomplishments as their own. Combined with procedural adaptation\
    \ and an understanding of body language, the receptivity of mirror neurons can\
    \ help make momentum contagious—and virtually unstoppable. \n\nOur interviews\
    \ with neuroscientists Marco Iacoboni and Jaime Pineda detail the process where\
    \ as one person achieves something positive, the psychological impact of tribal\
    \ identity (“you are in my group, which means that you are like me and aligned\
    \ with my goals”) triggers a verifiable, biological mental response in teammates.\
    \ If teammates are properly aligned, their mirror neurons respond to the victory\
    \ as if they, too, had successfully completed the task. This creates a kind of\
    \ “mental muscle memory” within the brain, triggering growing confidence and feelings\
    \ of accomplishment within the entire group. It is this kind of contagious success\
    \ that becomes momentum. \n\nCsikszentmihalyi embraced as an extension of individual\
    \ flow states our model of momentum, which is focused on how organizations can\
    \ foster environments in which momentum can easily be transferred from one to\
    \ another. \n\n“The role of the leader or the coach is to be aware, to know what\
    \ the strengths of the set of individuals are and to recognize the opportunity\
    \ for using those strengths in the activity that you are doing together,” Csikszentmihalyi\
    \ told us, agreeing that the experience of “flow” is transferable between members\
    \ of an organization—“if they are in synchrony and supporting each other. And\
    \ things like faith are very important.” \n\n### The Experience Sampling Method\
    \ (ESM)\n\nCsikszentmihalyi conducted extensive research to develop the ideas\
    \ presented in *Flow*. His research methods were rigorous and innovative, particularly\
    \ in how he gathered data from participants. One of the key methods he used was\
    \ the Experience Sampling Method (`ESM`), which involved having participants keep\
    \ detailed daily logs or journals about their experiences throughout the day.\
    \ Participants were provided with pagers or other devices (in later studies, they\
    \ used smartphones) that would alert them at random times throughout the day.\
    \ When signaled, participants were asked to stop what they were doing and fill\
    \ out a short survey or journal entry. In these entries, participants recorded\
    \ what they were doing at that moment, how they felt, their level of concentration,\
    \ and their overall sense of engagement or satisfaction with the activity. This\
    \ method allowed Csikszentmihalyi to gather real-time data on people’s experiences,\
    \ rather than relying on retrospective accounts. \n\nIn addition to the real-time\
    \ sampling, participants were sometimes asked to keep more detailed journals about\
    \ their experiences, particularly those that involved deep concentration or enjoyment,\
    \ to help identify patterns in how flow experiences occurred. Csikszentmihalyi\
    \ analyzed the data from these logs and journals to identify common conditions\
    \ that facilitated the flow state. He found that flow experiences often occurred\
    \ when individuals were engaged in activities that were challenging but achievable,\
    \ where they had clear goals and immediate feedback, and where they were fully\
    \ absorbed in the task at hand. \n\nThe insights gained from these detailed logs\
    \ were crucial in shaping the concept of flow. Csikszentmihalyi was able to define\
    \ flow as a state where individuals are so engrossed in an activity that they\
    \ lose track of time and self-consciousness, finding deep satisfaction in the\
    \ process itself. This `ESM` method not only was instrumental in developing Csikszentmihalyi’s\
    \ “flow” but has since been widely applied in psychology, education, sports, and\
    \ many other fields. \n\n### Research on Momentum\n\nOur research for this book\
    \ also involved the solicitation of people’s thoughts, feelings, and experiences\
    \ with personal and team momentum, via three alternative methods: in-depth interviews;\
    \ targeted surveys of leaders in business, politics, sports, and the military;\
    \ and large-scale, scientific surveys of the general public. \n\nIn all of these\
    \ surveys and interviews, we asked: “Does momentum exist?” A staggering number\
    \ said yes, it does. This was the answer for 91 percent of the twenty-five-hundred-plus\
    \ Americans we asked in random sample surveys, and for an even greater portion—99\
    \ percent of the thousand coaches, business leaders, and National War College\
    \ military officers we targeted in our surveys of leaders. There were, of course,\
    \ a few outliers—including an ESPN statistician who argued vociferously that momentum\
    \ is an artifact or fallacy rather than a real phenomenon. That said, our research\
    \ found that the more groups or teams a person has been a member of, the more\
    \ likely they are to state a belief in the realness of momentum. More on that\
    \ later. For now, it’s clear that nearly everyone we contacted believed they had\
    \ lived momentum in some context and perhaps fallen victim to it as well. Pressed\
    \ to define momentum outside of a feeling, however, no uniform descriptions emerged.\
    \ Our respondents offered diverse descriptions, with professionals in these four\
    \ fields—politics, sports, the military, and business—providing particularly colorful\
    \ ones of the phenomenon. \n\n### Perspectives on Momentum\n\nFlorida State University\
    \ assistant basketball coach Stan Jones described momentum to us as a “competitive\
    \ energy tsunami,” a powerful surge that propels a team forward, elevating their\
    \ performance beyond expectations. In our talk with acclaimed leadership expert\
    \ John Maxwell, he described momentum as the “great exaggerator,” magnifying existing\
    \ currents and intensifying their impact. And perhaps most vividly, NBA champion\
    \ assistant coach Kevin Eastman told us he thinks of momentum as a “force multiplier”—that\
    \ momentum is “the force of energy, the force of enthusiasm, the force of *we’re\
    \ coming at you*.” \n\nDefining momentum may be like trying to catch lightning\
    \ in a bottle—it’s something you can feel, but it’s elusive when you try to put\
    \ it into words. You can feel things shift, but it’s challenging to quantify or\
    \ measure. The debate over momentum even served as the reason one major figure,\
    \ legendary political consultant James Carville, decided to participate in this\
    \ book. “Momentum is absolutely real. I think it’s a noble thing you’re doing\
    \ in writing this book,” Carville said, before qualifying his reason for offering\
    \ such a superlative. “I think it’s noble because you’re going to try to explain\
    \ something and you’re going to fail, but I just don’t want you to fail too big.”\
    \ He made it clear he was offering a little of his sarcasm but was fascinated\
    \ enough that he invited the authors to spend a day with him at his Virginia home.\n"
