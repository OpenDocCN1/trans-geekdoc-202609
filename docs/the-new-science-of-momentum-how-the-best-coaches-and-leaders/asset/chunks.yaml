    It is important to note that sustained effective leadership requires the presence
    of a high degree of trust by leaders and followers. So, our employment of leadership
    as a momentum driver incorporates an understanding of trust’s importance. The
    “Trust Equation” by David Maister, Charles Green, and Robert Galford is a model
    that highlights four key components of trustworthiness (credibility, reliability,
    intimacy, and self-orientation).


    ![](images/f047-01.jpg)


    ### The Components of Trustworthiness


    **Credibility** relates to the confidence others have in our knowledge, skills,
    and track record. It’s built through demonstrating our competence and sharing
    relevant experiences. Trust is difficult to establish if people perceive leaders
    as unqualified or too inexperienced.


    **Reliability** is about meeting expectations and consistently honoring commitments.
    It is important to keep one’s word and deliver on promises. Leaders that demonstrate
    reliability foster a sense of trust and confidence in their abilities.


    By emotional safety (`intimacy`), we do not mean to imply that we need to possess
    a deep personal relationship with someone. Building intimacy creates understanding,
    familiarity, and security. It leverages empathy, active listening, and a genuine
    interest in the other person’s interests.


    **Self-orientation** examines the extent to which a leader (or leaders) prioritize
    their own interests over those of others. The more self-oriented leaders are,
    the less trustworthy they’ll appear. Demonstrating a genuine concern for the best
    interests of others is important.


    ### Leadership and Momentum


    Northouse also offers us perhaps the most intuitive definition of leadership—one
    that we, in this book, and many others can use as a starting point for leadership
    in action: “a process whereby an individual influences a group of individuals
    to achieve a common goal.”


    This is why leadership isn’t a single component in our model, or even on one of
    our model’s wheels. Rather, it’s a primary driver of momentum, an influence that
    touches nearly every other input, pretty much continually. The preeminence of
    leadership in this model of momentum is backed up not only by academic research
    but by the perceptions of thousands of laypeople. In some of our surveys of the
    general public, we asked how much various factors influence the likelihood of
    a team experiencing momentum. From a list of nine factors, including many described
    in our model, “leadership” and “communication from leaders” shake out as the top
    two most influential.


    So, from all of this literature, what makes for a good leader?


    For that, we turn to our friend and contributor James Collins, whose 2001 book,
    *Good to Great: Why Some Companies Make the Leap . . . and Others Don’t*, has
    become a staple in business circles across sectors. Several large-scale data studies
    have explored the impact of leadership on organizational performance, and the
    research in *Good to Great* earned its perennial place on top leadership reading
    lists ever since.


    Over five years, Collins sought to identify the factors that enable good companies
    to transform into great ones, and examined companies that made such a leap and
    sustained that performance for at least fifteen years. The research team analyzed
    1,435 Fortune 500 companies over a forty-year period, eventually narrowing its
    focus to eleven companies. Collins found seven conditions that really set these
    companies apart, and no surprise, leadership was at the top of the list. A Level
    5 leader, to Collins, embodies a unique blend of personal humility and professional
    will. They are often modest and reserved but have an intense determination to
    do whatever it takes to make the company successful. Importantly, these Level
    5 leaders focus more on the success of the organization than on personal recognition.


    ### Leadership in the Military Context


    Outside of business, academic research, and theory—what does “leading for Mo”
    look like?


    A point scored in sports is clear—more baskets made or yards run. A point in politics
    is clear—an edge up in a poll or more ballots cast on election day. And a point
    in business is clear—more customers converted or a spike in the value of a stock.
    But in the military, a point gained or lost may very well be a human life. The
    stakes are different, weightier—and yet, somehow, often less clear and more complex.
    Perhaps this is because the scope is larger too. A sports team may have a handful
    or a few dozen teammates and a few dozen competitors. A political candidate may
    have a handful of folks to defeat in a primary or a few dozen committee members
    to persuade on a vote. Businesses can have anywhere from a few employees to many
    thousand, but the universe of that company is defined, and competitors are generally
    known and limited. Military conflicts are many orders of magnitude larger, as
    are the variety of environmental, social, and political factors that can influence
    outcomes. Add in the fact that, unlike a ninety-minute sports match, a campaign
    cycle in politics, or an end-of-quarter statement in business, military engagements
    aren’t mutually scheduled. The end can come down to a decision, not a decisive
    win, and the scoreboard may take years, if not generations, to fully assess.


    While these variables may make it difficult to apply lessons from other sectors
    to the military, it also means that lessons learned in the military context are
    particularly valuable to those in other fields. If a process works in the high-stakes,
    high-complexity military context, its application may prove quite powerful elsewhere.


    What can civilian leaders learn from military leaders who prepare for, drive,
    and implement game-changing, momentum-changing decisions? What does momentum look
    like, and mean, when the unit of measure is human life or shifts in power between
    nations? How can organizations leverage lessons learned on battlefields to improve
    their own agility, preparations, and responses to challenge?


    Educating leaders outside of the military context was not what General David Petraeus
    had top of mind in 2007 when he was called upon by President George W. Bush to
    pick up the pieces of the US engagement in Iraq. By the time he assumed command
    of the Multi-National Force in Iraq (`MNF-I`), the situation was dire, and his
    coalition was losing. It had devolved into spiraling chaos, sectarian violence,
    and a pervasive sense of hopelessness.


    The palpable negative momentum on the ground was only compounded by eroding public
    support at home. Americans were increasingly skeptical and frustrated by the war’s
    toll, measured in US casualties, billions in spending on military efforts, and
    a lack of progress in the goal to establish democracy and stability in the region.


    • • •


    When we met with David Petraeus, in the summer of 2023, when we asked the retired
    general to put himself back in that very moment, it seemed easy. It was as if
    no time had passed. Even his words often came in the present tense, as though
    the realness of what he and his team faced in Iraq in February 2007 was still
    happening, fresh, in that very moment.


    “We’re trying to break a cycle of violence, which is getting worse and worse.
    It’s spiraling, the country is spiraling downward, and we have to reverse that,”
    he said.


    Though no matter how many times Petraeus said the word `we`—then and now—at that
    moment, the weight of success or failure in the eyes of the world was squarely
    and almost singularly on his shoulders alone.

    '
