    ## [5](#nav.xhtml#sec6)


    ## [Culture](#nav.xhtml#sec6)


    When Joe Lacob and Peter Guber purchased the Golden State Warriors in July 2010,
    the $450 million price tag was the second highest in NBA history. One would have
    thought they were purchasing a team with an extraordinary recent record. Not so.


    The Warriors were underwater and had been for many years—with more than double
    the number of losses (56) as wins (26) in their most recent season—a 31.7 percent
    winning percentage. Rookie Steph Curry, brought aboard as the seventh overall
    pick in the draft, was a bright spot in an otherwise dismal season, but overall
    team performance was hampered by poor defense and a lack of depth. The team struggled
    to compete in a strong Western Conference, finishing well out of playoff contention.
    The new owners—a venture capitalist and media exec—knew change was needed. After
    trying and failing to see the results they wanted with other coaching staff, they
    brought on Steve Kerr in early 2014 to lead in yet another move questioned by
    many. After all, Kerr had a great playing career to boast of but no coaching experience
    of his own.'
