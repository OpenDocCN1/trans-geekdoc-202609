    have extreme limitations on how they can attract new blood and have little control
    over the characteristics of those in the pools from which they select. Therefore,
    the challenge is to create an optimal balance of personalities and skills within
    a team through mindful, strategic recruitment and preparation. Recruitment also
    applies within long-tenured teams or organizations where no “new” members are
    brought in but where a leader identifies or selects individuals for specific tasks
    within a larger game plan.


    Colleges and the military face the immense task of recruiting thousands of individuals
    at a time. Colleges, for instance, must fill their freshman classes each year,
    attracting students from diverse backgrounds and academic achievements. The more
    applicants they recruit, the pickier they can be about who is selected. The military,
    similarly, recruits a large number of personnel annually to maintain and bolster
    its ranks. Once recruits meet the basic criteria for enlistment, rigorous physical,
    academic, and personality testing helps the military determine who does what and
    where. But at phase one, for these giant organizations, recruitment is a numbers
    game, and significant quantities can make the cut.


    Companies often recruit for a dozen or more positions at a time, focusing on specific
    roles within their organization. This targeted recruitment requires a somewhat
    more refined approach compared to mass recruitment, but there are various channels
    through which to do so: headhunters, job boards, career websites, networking events,
    and their own platforms—not to mention a roster of existing employees who may
    grow into roles they didn’t start in to begin with.


    Then there are smaller businesses or sports teams where there’s only one or a
    few spots open per position. These teams need to be extremely selective, as each
    recruit can significantly affect the organization’s performance. These recruitment
    efforts benefit from advanced data analytics to assess candidate performance and
    potential, but with a limited and highly specified talent pool, competition between
    organizations can be fierce. And finally, in politics—where just one candidate
    from a party can appear on a final ballot—there’s just one seat. This recruitment
    process is highly strategic and personalized. Sometimes potential candidates wait
    years if not decades for their turn in line to run for a desired seat.


    Whether thousands of recruits or just one, recruitment is pivotal in our model
    of momentum. To understand how and why, we look first to the science of recruitment.


    There is a large body of research that examines the value created by the most
    productive talent. A 2012 study by Aguinis and Boyle published in *Personal Psychology*
    examined more than six hundred thousand people operating across a variety of fields
    like entertainment, research, politics, and athletics. Their study concluded that
    high performers are 400 percent more productive than average ones. Additionally,
    researchers have also studied the value generated by getting the right talent
    in the roles that produce the greatest amount of organizational value.


    A great example of the value associated with getting “A-level” talent in the most
    critical roles was detailed by Sandy Ogg (former chief human resources officer
    at Unilever and former operating partner at the Blackstone Group) in a 2018 *McKinsey
    Quarterly* article.


    Ogg noted that, during his time at Blackstone, a clear trend emerged among the
    most successful portfolio companies. Ogg highlighted that 80 percent of the companies
    who focused immediately on matching the “right talent” to their critical roles
    from the start achieved all of their first-year targets. Furthermore, those companies
    averaged a 2.5 multiple return on the initial investment. Ogg’s next finding was
    even more actionable: Of the 180 successful portfolio companies studied, the top
    twenty-two all made talent decisions by linking key leadership roles to the value
    they needed to generate. The takeaway? Getting the right people in place, and
    doing it quickly, plays a huge role in building momentum.


    Indeed, there are several academic models and theories that outline the principles
    of successful recruitment. These models, each based on a different set of underlying
    assumptions, provide a structured approach to understanding and implementing effective
    recruitment strategies.


    The Person-Organization Fit (P-O Fit) model, advanced by various industrial and
    organizational psychologists, gained prominence in the 1980s. The model emphasizes
    the alignment between an individual’s values, beliefs, and personality with the
    organizational culture and values. The better the fit, the more likely the individual
    will be satisfied, committed, and productive.


    The P-O Fit model was used as the basis for a more evolved concept—the Attraction-Selection-Attrition
    (ASA) framework, proposed by Benjamin Schneider in 1987. This model suggests that
    organizations attract individuals who share similar values and personalities (attraction),
    select those who fit the organizational culture (selection), and see those who
    do not fit often leave the organization (attrition).


    Both of these models underscore the assumption that team members who are happy
    and fulfilled in their work will perform well for the organization and that recruitment
    should begin with recruiting for fulfillment. Offshoots of these models suggest
    that people seek to join organizations where they perceive a sense of belonging
    and identity. Organizations, therefore, should recruit individuals who identify
    with their brand, mission, and social groups within the organization and should
    create and advertise jobs that are meaningful, provide autonomy, and offer opportunities
    for skill variety, task identity, and feedback.'
