  trans: '

    Brenneman 承认，转型的复杂性可能会让人无所从心，但他至少在某种层面上通过一份聚焦的单页计划来应对这种局面。对于进入困境环境的领导者来说，Brenneman
    的第一条建议是创建一个简单且可执行的计划。“你可以用 14 号字体写出一份单页计划，”他建议道，将复杂的策略提炼为聚焦的行动。对于 Brenneman 来说，这并不是要将公司的问题浓缩为过度简单的要点，而是要识别需要关注的四个五个关键领域，并创建一个聚焦的、可执行的路线图。这份单页计划的精妙之处在于它的易读性——组织中的每个人都能理解它、认同它并采取行动。


    在大陆航空（Continental），Brenneman 没有用数据或复杂的策略淹没他的团队，而是单页计划将注意力集中在四个关键领域：市场、财务、产品和人员。在每个类别下，Brenneman
    都列出了几个具体目标，以引导公司重回正轨。


    #### 计划的四个关键领域


    计划中的市场部分被命名为“飞行获胜”（Fly to Win），提醒人们只关注盈利的路线。“我们为什么要每天从格林斯伯勒（Greensboro）飞往格林维尔（Greenville）八次，而这两个客户都在第一班飞机上？”他问道。这种方法的简单性使他的团队能够迅速就资源投入方向做出决策。


    在财务方面，Brenneman 知道大陆航空需要整顿内部。“资助未来”（Fund the Future）成为了战斗口号，承诺在管理成本的同时，进行有利于航空公司长期获得成功的投资。产品部分——“让可靠性成为现实”（Make
    Reliability a Reality）——是 Brenneman 告诉公司回归本：准时将客户送往目的地，带上行李并提供一顿好餐。


    但 Brenneman 知道，如果员工不配合，这些改变都将无法维持。因此，计划的最后一个象限是“共同努力”（Work Together）——呼召长期以来因信任和内部冲突而分裂的员工实现团结。这不仅仅关乎口号，更关乎具体的行动。他甚至引入了准点奖金，为员工关注航空公司的成功创造直接激励。


    #### 创造小胜利


    为了实现这一目标，Brenneman 向我们强调了早期创造小胜利的重要性。在大陆航空，他最著名的倡议之一就是准点奖金。该公司在航班准时起飞方面一直排名垫底，因此
    Brenneman 为员工提供了现金奖金——排名第三获得六十五美元，第一获得一百美元。结果几乎是立竿见的：“到了第三个月，我们排了第三，到了第五个月，我们是第一，”Brenneman
    向我们回忆道。这不仅为公司节省了数百万的运营成本，还改变了员工的士气，给每个人提供了切实的证明，成功是可能的。一个简单的计划几乎立即带来了结果。


    Brenneman 单页计划的优之处不仅在于其简洁，更在于其清晰。从高管到一线员工，每个人都确切知道需要做什么。这些计划没有被埋在办公桌抽屉里；它们是活的文档，引导决策并激励行动。“只要你说出比这页纸上的内容更重要的东西，我就会从这一页上划掉一样东西并把它放在那里，”Brenneman
    解释道，强调了他对真正重要事情的无情聚焦。


    #### 参与与动能


    扭转动能另一个关键要素是与员工直接互动。Brenneman 并不只是坐在高管办公室里；他花时间在第一线。“每个周五下午，我都会去机场在飞行员休息室、机械师休息室待一会儿，”他回忆道。与员工建立信任使他能够打破管理层与员工之间的墙墙，培养一种合作而非分裂的文化。


    但也许 Brenneman 最深刻的洞察是，动能（无论是正面的还是负面的）都是强大的。他将其比作推着轮胎上山：“一旦让它滚起来，你只需要偶尔敲击一下，但绝对的，事是环环相扣的。”正向动能产生成功，而负面动能——如果不加控制——会导致进一步衰落。“如果你不相信自己能阻止它，失败就会导致失败，”他警告道。秘诀在于识别变化的微小信号，利用早期的胜利，并对改进保持持续无情的关注。


    对于任何面临看似不可能完成的转型的人来说，Brenneman 提供了一份路线图：面对残酷事实，简化你的策略，并让你的员工参与解决方案。路线图通常意味着顺序——一个接一个。但当被问及领导者和团队应该先做什么时，他的回答并没有提供线性的解决方案。例如在大陆航空，Brenneman
    的团队会问他们应该先处理什么——餐食、航站楼的地毯、行李问题还是别的。


    “我会告诉他们，你们必须立即并同时完成，因为它们都是某种累积性的。……但我总是告诉人们，从五个 F 开始：信仰（faith）、家庭（family）、朋友（friends）、健身（fitness）和财务（finance），对吧？”


    动能永远不是静态的——它要么随你一起移动，要么反对你。正如 Brenneman 的职业生涯证明的那样，当情况最糟糕时，可能正是领导者带着清晰、信念和对成功触手可及的信念介入的最佳时机。


    • • •


    也许体育历史上没有哪支球队比像贝勒大学（Baylor University）男篮那样迫切需要扭转动能。2003 年夏天，这支球队因为所有错误的原因成为了全国新闻。他们的一名球员帕特里克·丹尼（Patrick
    Dennehy）失踪了，他的队友 Carlos Dotson 最终被捕并指控谋杀 Dennehy。在那场悲剧之后，贝勒大学的教练戴夫·布利斯（Dave Bliss）被秘密录音，鼓励教练们对调查人员关于
    Dennehy 的情况撒谎，以掩盖布利斯向一些球员支付的非法资金。那年 8 月，布利斯和学校体育主任因羞愧辞职。


    该球队面临着严厉的处罚，甚至可能面临最严厉的裁决：终止该项目。历史上上是一支表现不佳的球队，贝勒的这份工作对于任何有资历的教练来说都是“毒药”。但对于刚刚在印第安纳州的中游院校瓦帕莱索（Valparaiso）完成首个赛季主教练工作的斯科特·德鲁（Scott
    Drew）来说，这是一生一次的机会。

