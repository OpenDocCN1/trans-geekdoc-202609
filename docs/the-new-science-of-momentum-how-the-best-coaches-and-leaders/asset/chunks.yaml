    Chandran illustrates this with a story from his time at Cricinfo. When they saw
    the potential of the web, they didn’t just sit back and watch. They dove in, experimenting
    and innovating rapidly. They added visuals to what used to be a text-based site
    and created the first live sports scorecard on the internet. They moved quickly.
    They created momentum. In stark contrast to how the Paranoids at Yahoo would intentionally,
    by design, slow things down out of caution for avoiding errors, Cricinfo powered
    ahead into uncharted territory, risks and all. The decision to do so was a parallel
    to the role Chandran sees for captains in the game of cricket.


    “On the cricket field, you might be waiting all day to take a wicket,” he elaborated.
    “And you’ve got two batters out there. And they’ve been going, you know, it’s
    a five-day game, and they’ve been going for six hours. And you’re sort of, what’s
    going to happen here? And then a moment happens because one of the batters is
    a little tired, and there’s an unforced error, if you will; that’s not really
    cricket speak, but it’ll work. That moment doesn’t create the momentum. What creates
    momentum is as the captain of that side that’s in the field at that point, it’s
    the decisions you make there—a door has been opened, but do you do something about
    it? And the best leaders in the sports field will react quickly and nimbly to
    seeing, ‘Oh, there was a spark—how do I latch on to it? Can I take advantage of
    that situation?’ In cricket, you’ll see the best leaders change strategy in those
    moments—the field setting changes, your strike bowler comes back on, and they
    say, ‘Can I now create momentum?’ And so my point here is that momentum is an
    intentional thing that you have to participate in creating, not just sit back
    and hope it happens.”


    This analogy translates to business leadership. Leaders must be vigilant for opportunities
    and ready to act swiftly to leverage them. It’s about seeing the spark and having
    the courage and strategy to act upon it—to communicate to one’s team that this
    is the moment, and then together turn it into a blazing fire.


    ## Leader Actions


    There is a saying that “I don’t know what I said until you tell me what you heard.”
    The ability to lead well is highly correlated with communications effectiveness.
    A leader’s ability to adroitly provide purpose, direction, and motivation is transmitted
    through their communications. Effective communication requires transmitting a
    message from a sender to a receiver using common symbols, with the goal of the
    receiver accurately understanding the message. Fostering momentum happens in part
    via written, verbal, and nonverbal mediums. Ensuring your communications are positively
    driving the desired team behaviors is vitally important.


    ### Action 1


    Clearly highlight the importance of significant facts.


    A variety of critical communications frameworks details the importance of generating
    clarity. Momentum is a function of tangible events being linked together. Yet
    leaders can wrongly believe certain things are patently obvious. Leaders must
    ensure people understand the significance of what is transpiring.


    ### Action 2


    Clearly articulate the way ahead.


    The establishment of clear expectations is the first step in creating accountability.
    For teams to build upon (or reverse) the significance of previous events, leaders
    must lay out their expectations for what must transpire. The military uses a framework
    called “leader’s intent” as a means for articulating the way ahead. The framework
    provides:

    1. `why` – it matters.

    2. `what` – must transpire.

    3. `how` – success criteria.


    ### Action 3


    Consistently ensure two-way communications.


    Leaders must cogently convey and receive information. Two-way communication can
    enhance trust and alignment. By reducing friction, leaders allow for better decision-making.

