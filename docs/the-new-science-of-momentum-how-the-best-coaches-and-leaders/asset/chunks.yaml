- fmt: '

    The military has a saying: “Train as you will fight.” The adage informs a philosophy
    of creating training scenarios that replicate combat conditions to prepare soldiers
    for the stress of those environments. Such scenarios (for example, special teams,
    two-minute drills, red zone offense, soccer placekicks) are routinely integrated
    into practice and executed with precision on sports teams. Leaders in all fields
    must routinely take their people through experiences that will help them to seize
    sparks (or reverse them) when they occur.


    ### ACTION 3: Develop your team’s ability to take smart risks.


    Dynamic environments routinely reveal gaps in understanding or capabilities. To
    seize momentum, teams must frequently take risks. Encourage your team to evaluate
    the potential consequences of taking risks so they can make an informed decision
    about whether or not to proceed with them. Smart risks are ones that can propel
    something forward if navigated well and can be absorbed if success is not achieved.
    Conversely, dumb risks are ones where there is no coming back from falling short
    of the objective. Great organizations routinely underwrite smart risk and never
    underwrite dumb risk.


    ### Spark


    While Nvidia’s research teams were making major, albeit quiet, moves designing
    processors that would be uniquely powerful for the needs of AI and deep learning,
    there was a new company out there looking for just that. OpenAI was founded in
    2015 with the goal of advancing AI in a way that benefits humanity, and they quickly
    realized that the computational demands for training large AI models were immense.
    OpenAI, from the outset, needed highly scalable computational power to achieve
    its ambitious goals, and `Nvidia`’s GPTs were the natural choice—few alternatives
    could match `Nvidia`’s hardware capabilities for AI training. OpenAI’s AI models
    grew in complexity and turned increasingly to `Nvidia`’s GPTs for their unmatched
    performance in processing the massive datasets required for training.


    The results of `Nvidia`’s preparation emerged in a whirlwind almost a decade later
    when ChatGPT propelled into the public view and demand for `Nvidia`’s GPUs and
    other chips skyrocketed in turn. Within two months of release, ChatGPT gathered
    a hundred million users, the fastest adoption of any platform in history. In 2019,
    `Nvidia`’s market value was around $100 billion. From the launch of ChatGPT to
    March 12, 2024, `Nvidia`’s stock price increased by 428 percent. By mid-2023,
    `Nvidia`’s valuation had surpassed $1 trillion for the first time. As of this
    writing, its value has exceeded $3 trillion, making `Nvidia` one of just three
    companies to boast such a value.


    ChatGPT—the spark to `Nvidia`’s preparation—set in motion a fire that’s still
    burning.


    To some observers, the explosion of products from `Nvidia` since 2022 is evidence
    that the company had developed innovations and brought them to market very, very
    fast. But what looked to observers like sudden momentum was in fact the result
    of intentional, and tedious, preparation. Huang and Malachowsky, the archers who
    had pulled a full sheaf of arrows further and further back in their company’s
    bow, set in motion a display of momentum few other companies will ever experience.
    `Nvidia`’s momentum may have appeared sudden to those watching the market but
    in fact was built through years of intensive research and strategic patience,
    which catapulted them to the forefront of technological advancement.


    The spark (massive public adoption of AI products) would never alone catapult
    `Nvidia` into the force it is today. Other elements of our Momentum Model had
    laid the groundwork. For example, Huang’s leadership demanded a culture where
    senior executives are expected to operate independently, work relentlessly, and
    take aim for the mark. And, Malachowsky shared with us, `Nvidia` had a concrete,
    intentional approach to recruitment. Malachowsky shared a lesson that may be uncomfortable
    for other teams to replicate: If they didn’t find the right talent, they didn’t
    hire at all.


    “We committed ourselves that we were just going to hire the best, that we’re not
    going to bring on the mediocre. We’re just going to wait it out. Maybe be understaffed,
    but we’re going to hire the best,” he explained. “We’ve got a workforce that’s
    not put off by being undermanned. I actually think it’s a badge of strength. I
    think depravity may not be the right term, but being in a state of want is clarifying,
    and it makes you be thoughtful and, you know, helps you, helps you strategize.”


    `Nvidia`’s founders also recognized that their business was prone to ups and downs
    in workload. Malachowsky shared that in the world of semiconductors, there was
    no success story that lasted more than a season or two. “We wanted to weather
    that,” he said. “And so we’d hire a rocket scientist and ask him to sweep the
    floor. I’d rather have him do that than somebody whose only capacity was to do
    that, because tomorrow, the shit is going to hit the fan, and we’re going to ask
    you to go back to rocket science.” In other words, Malachowsky said, “I wanted
    to give you credit for the fact that I’ve underutilized you for the benefit of
    a future that I haven’t yet seen.”


    Once `Nvidia` recruited the right people, the emphasis focused on fulfilling obligations
    to those already on board and fostering a positive team climate. “You’ve got to
    do them justice and give them the opportunity to succeed,” Malachowsky said. “We
    want to hire smart people and then listen to them. You surround them with great
    people. We tell our managers, ‘You want to be the dumbest one in the room.’ That
    is exciting. That is motivating.”


    Even as `Nvidia` grew, the org structure remained as flat as possible—a feature
    many credit for its extraordinary rise and sustained momentum. The three founders
    were comfortable with an all-hands-on-deck approach where people could be pulled
    from one area to another depending on where the greatest needs were. This gave
    `Nvidia` an atypical ability to pivot.


    “I know it’s a little passé, but I used to tell the people that work for me, somebody
    comes to you and asks for your help on something that’s a priority, you go do
    it; tell me about it later. I don’t care. Go do the right thing; fill us in later,”
    Malachowsky said, explaining a process that few managers would find themselves
    offering. “HR was the last one to generally know how people were spending their
    time. You know, even your manager may not know. You know whatever you’re doing.
    We’re not asking you to ask for permission. Let us pull you back if you made a
    wrong choice, but pivot quickly. Get, get on things. Don’t be hung up.”


    The ability to pivot is perhaps of greatest benefit, however, when it’s coupled
    with a strong intuition for noticing opportunities when they arise. The leaders
    of `Nvidia` saw the spark in OpenAI and had in place its own unique but tested
    approach to leadership, culture, recruitment, and preparation.


    Momentum, by its very definition, requires a moment. Something happens that begins
    moving things, preferably in your direction. We’ve chosen to call that moment
    your “spark.”


    Sometimes the spark is obvious: the announcement of a game-changing technology
    that you are uniquely positioned to help grow (like `ChatGPT`); the fumble that
    you turn into a touchdown (as the Patriots did in the 2017 Super Bowl); or the
    unexpected endorsement in a political campaign (as happened when Representative
    Clyburn put his arm around a floundering Joe Biden during the 2020 Democratic
    presidential primary). Sometimes the spark has a slow burn to it: the hiring of
    the right coach or leader who makes moves that quietly add up to a changed atmosphere,
    or the addition of a few courageous voices to a movement that speaks out against
    sexual harassment.

