    ## 5. 跨界授粉


    约翰逊将人员分配到跨职能小组，并坚持为团队成员留出时间互相认识。“我的领导团队是全新的，这其实是一件重大的事。为了加速需要时间建立的关系，我们分配时间每月面对面交流，并在这些会议中专门花时间进行关系发展。”约翰逊发起了性格测试，让团队成员分享结果，并谈论家庭、偏好和生活。“每个人的生活中都有这些疯狂的事情。我们腾出空间，让他们以任何他们感到舒适的方式将这些事带进来。我们并不强制要求你必须透露某种秘密。你可以设定自己的边界，但让我们了解你的人生和旅程正处于什么阶段。”约翰逊分享了她如何与团队成员交流：“‘你为什么来
    Lumen？这又是如何契合你的人生故事的？告诉我们一件超级有趣的事。’”


    尽管这个词被提到过多次，而且这种主题贯穿始终，但直到对话快结束时，我们才问凯特关于“动能”（momentum）的问题。


    “它是真实的吗？”我们问道。


    “这是一个非常肯定的答案，”约翰逊毫不犹豫地回答道，“首先，我有电气工程学位。我上过很多物理课。我热爱物理。它解释了宇宙是如何运作的。在转型中，惯性和动能是至关重要的。你知道，就像牛顿运动定律：运动的物体保持运动，静止的物体保持静止，除非有外力作用。我的信念是，这些定律在美国企业界的转化是：获胜的公司将一直获胜，失败的公司将一直失败，除非有某种外力，而在我们所在的行业中，Lumen
    的外力就是我们的转型。我们正在获得人才；我们正在进行系统刷新。我们正在重新设计我们的流程。我们正在重新设计带给客户的价值。这就是第一号外力。二号外力是地面互联网需求的前所未有的激增。现在我们已经准备好捕捉这一机会。动能等于质量乘以速度。我们需要更大的速度，而我们是一家拥有两万五千人的公司。他们必须和我一起投入，这样我们才能增加这个并跑得更快。”


    没有什么比弱者逆袭故事的快感或不可思议的反转更令体育迷着迷。竞技场内的能量变得触处可见，观众对即将到来的胜利的信念激增，关于“动能”的叙事占据了中心。这种现象并不仅限于体育；它在政治、军事历史和商业界也有回响，在那里命运的突然反转通常被视为不可阻挡动能的结果。


    一个处于失败边缘的团队，是如何变成令观察者震惊并全速冲刺胜利的的？我们承认，在我们读过的数千篇关于这一主题的期刊中，科学一直难以识别那些让动能变得更容易或更小的变量。以色列研究人员在《经济心理学杂志》上发表的一项
    2019 年的研究尤为引人注目。他们想知道，在常规时间内追平比分的 NBA 球队，在加赛中获胜的概率是否更高。换句话说，导致进入加赛的最后时刻平局是否产生了心理动能，从而推动这支落后追分的球队获胜？他们的统计模型并没有发现情况如此。但他们的结果确实揭示了多种驱动成功的变量：例如，主场优势，观众的能量贡献了团队的动力；以及团队的赛季战绩，持续的高水平表现不断累积。他们的研究还作为一项值得跟进的研究脱颖而出——这项研究不使用最终比分获胜作为感兴趣的因变量，而是观察导致失败方获得足够反转并最终进入加赛的因素。


    在本书中，我们承认最终比分很重要，但同样重要的是，我们关注的是那些让失败方实现足够反转以进入加赛的因素。


