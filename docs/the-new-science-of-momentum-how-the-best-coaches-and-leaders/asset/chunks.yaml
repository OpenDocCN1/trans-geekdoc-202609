    between people—as do emotions. Emotional contagion, the phenomenon where emotions
    spread from person to person, has been extensively studied in various social contexts.
    Research defines emotional contagion as the automatic and unconscious transmission
    of emotions between individuals, often occurring through nonverbal cues like facial
    expressions, body language, and tone of voice. This process can have significant
    implications for individual behavior and group dynamics.'
