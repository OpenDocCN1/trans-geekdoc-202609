    and interact accordingly (Richardson, 2013). Research indicates that the influence
    between the different forms of cohesion is bidirectional. But task cohesion has
    a stronger influence on social cohesion rather than the other way around. The
    implication of the relationship is that leaders are well advised to lean into
    learning what it takes to collectively perform the work well more so than primarily
    focusing on building strong bonds first.


    ACTION 2:


    Create realistic experiences to set the conditions for how you will “meet the
    moment.”'
