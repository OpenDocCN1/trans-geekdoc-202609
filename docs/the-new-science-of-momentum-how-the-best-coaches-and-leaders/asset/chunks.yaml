    最近，威斯康星大学密尔沃基分校 Paul Roebber 的一项研究发现，足球中的动能是真实的，并且可以提高球队的胜率。他的研究将动能定义为：在至少三次连续的控球转换中，胜率发生了持续变化。结果显示，动能爆发的发生频率比随机预测的要高。Roebber
    研究发现了动能的生理基础，被称为“胜利者效应”（winner effect），即成功会导致睾酮水平增加和压力荷尔蒙减少。这为动能如何体现提供了生物学解释。


    这些努力在很大程度上是为了证明动能的存在或影响，它们是一个极佳的起点。但我们最感兴趣的是另一组问题：在加时赛获胜的势头良好球队与未获胜的势头良好球队之间有什么区别？是什么区分了能够在季度之间保持动能的组织与不能的组织？小组成员之间什么样的沟通方式能最大化地增强凝聚力并减少摩擦——摩擦是动能的头号敌人？


    我们从这样一个假设开始：动能是存在的，并且可以通过刻意的准备类型和组织结构来操纵。我们给出了以下定义：


    动能是一种协同力量，影响着团队的进展、韧性和专注力；它对团队心态的影响（无论积极还是消极）是可以被操纵和延伸的。


    从这里开始，本书将探索相关研究，为领导者和团队提供信息，告知哪些元素将放大他们准备动能、抓住增长势头并将其转化为持续动能的机会。


    这就是我们的模型所提供的，我们期待与你一起迈向这一程。


    # 动能模型概述


    传奇的社会心理学家 Kurt Lewin 曾说：“没有什么事比良好的理论更实用的了。”当领导者利用严谨的模型、框架和理论时，他们可以增加产生成功结果的概率，因为他们能更整体地思考自己的方法。最近利用这种方法的一个例子是
    Satya Nadella 领导下的微软公司。


    Steve Ballmer 在 2000 年至 2014 年期间担任微软首席执行官。在他任期间，公司收入增长了 300%，利润增长了 200%。然而，当他离开时，公司股价比他接手时低。为什么？投资者认为公司过度依赖传统产品，并抵制主导新兴机会（例如，开源计算和智能手机）。相反，苹果公司的股价在同一时期从
    50 美元飙升至 500 美元。微软董事会显然公司需要产生积极的动能，而 Satya Nadella 是他们实现这一目标的人选。


    Nadella 于 1992 年加入微软并在公司内部不断晋升，最终在云服务和企业集团担任执行副总裁，直到 2014 年 2 月 4 日宣布他将成为公司第三任首席执行官。在随后的几年里，Nadella
    及其团队执行了一次精妙的战略转型，这种转型依赖于通过公司内部产生积极的创新动能，同时使用了一些知名的变革框架。


    对 Nadella（及其团队）早期对公司进行重新定位的简要检查发现，他们坚定地遵循了 John Kotter 和 Kurt Lewin 著名的变革模型，以及
    Edgar Schein 的文化变革机制。最重要的是，Nadella 意识到产生积极动能的必要性，并在担任 CEO 职位后不久便宣布，是时候“重新发现微软的灵魂，我们存在的意义了”。


    一旦就任 CEO 职位，Nadella 立即寻求在“解冻”组织的同时建立“紧迫感”。他通过强调技术格局的不断变化以及为什么与云优先的公司（例如，谷歌和亚马逊）竞争至关重要，来“诱发焦虑”。Nadella
    利用数据展示了微软现状的现实，同时向员工强调他是他们的一员。他采取了所有上述行动，为了让人们从舒适区中震惊出来。


    两个行动体现了 Nadella 对建立核心变革领导者小组的承诺。首先，他指令邀请 2013 年微软收购的每家公司的前首席执行官和首席技术官（CTO）参加组织宝贵的高管静讨会（高管静讨会通常是将公司前
    150 名领导者带到豪华的场外地点进行高层讨论）。这次峰会邀请引人注目，因为许多人在收购后的职位责任不足以获得参加此类闭门会议的资格。此外，受邀小组的经理职位也低于编码的邀请资格标准。Nadella
    采取这种方法是在挑战传统和文化。但他致力于将不同的视角作为一种强制性功能。


    其次是决定由高层领导者对公司不同部门的客户进行走访。这项命令同样不寻常。许多领导者反对进行此类走访。抵抗的暗流源于一种观点，即客户负责人非常了解如何最好服务他们的客户。因此，没有必要从公司其他地方带来领导者走访。然而，Nadella
    要求人们切实执行他的指令。随后的互动促进了各业务部门之间更有效的对齐，并揭示了可以通过文化修正解决的摩擦点。


    20 世纪 70 年代中期，Bill Gates 确立了微软的任务是“每个办公桌和每个家庭都有一电脑”。2014 年的现实是，公司在发达和工业化国家实际上实现了这一使命。因此，这一陈述不再是显著增长和创新的动力。Nadella
    意识到需要重新构想并“沟通公司愿景”，作为重新建立其动能努力的一部分。最终，Nadella 的团队将“赋能地球上的每个人和每个组织成就更多”确定为凝聚的愿景，并在客户走访和公司聚会期间开始分享它。


    释放组织内部潜能的能力与“赋能他人行动”高度相关。在 Nadella 任期之前，软件开发团队不能在公司内部共享代码。他迅速取消了这一限制，作为一种赋能行为。Nadella
    还鼓励公司的员工更有针对地探索新兴技术，无论这些技术与 Windows 有何感知关联。他希望通过放宽对他们的限制，让优秀的人才去发现如何实现伟大的可能。


    产生动能的能力可以通过利用展示性成就的短期胜利来获得。


