    and I said, ‘We’re going to live with the people to secure them because that is
    the only way we can do that,’” Petraeus recollected. “But that was the exact opposite
    of what we’d been doing. Prior to that, we’d been pulling out of the neighborhoods,
    consolidating on big bases, and handing off security responsibilities to the Iraqi
    security forces, who could no longer handle the level of violence because it had
    gotten so bad.”


    To his troops, Petraeus had just communicated the “population-centric” strategy
    in which they were expected to deeply integrate into Iraqi communities.


    It was, in Petraeus’s words, a “180-degree difference” between what they’d been
    doing before and what they embarked on. “It doesn’t get any bigger than that,”
    he reflected, noting how hyperaware he had been of the skepticism surrounding
    his new strategic direction. Congress was particularly skeptical. During Petraeus’s
    confirmation hearing, he was required to agree that he’d come back at the six-month
    mark to lay out the results. And that’s just about how long it took for many to
    begin seeing the impacts of the surge.


    Petraeus promised he would be “first with the truth” in relaying progress—that
    he would “beat the bad guys to the headline, but only with what is actually known
    to be the truth, to be accurate.” There would be no lipstick on the pig.


    But progress did come.


    The shift in strategy was popularly referred to as “Clear, Hold, Build”—in which
    the US would first clear an area of insurgents and secure it, then maintain a
    persistent presence to hold the area, and finally, devote resources to the rebuilding
    of infrastructure, essential services, and local governance.


    All of these steps, however, required a significant shift in the US approach to
    Iraq, beginning with a substantial increase in US troops. About thirty thousand
    more troops were deployed, particularly in Baghdad and Anbar Province. The goal
    was to saturate these areas with troops—to create a visible presence within communities,
    to protect the population, to engage with local leaders, and to ultimately win
    the trust of the Iraqi people.


    Saturating these cities and neighborhoods was no small task. Petraeus established
    combat outposts and patrol bases everywhere he could, focusing the most attention
    on those areas that were most central to the violence. They walled each off to
    control the movement of personnel and utilized everything one could imagine at
    that time—biometric ID cards, explosive-sniffing dogs, X-rays, and more.


    The less violence in neighborhoods, the more trust was built. The US and allies
    would rebuild medical clinics, markets, and the electrical grid, with each action
    reinforcing a trend of spiraling upward rather than downward.


    A central feature of this engagement was for American forces to secure the cooperation
    of local Sunni tribal leaders who would in turn help fight against Al-Qaeda and
    other extremist groups. In some instances, this turned former insurgents into
    allies and involved the rehabilitation of individuals who otherwise were at risk
    of being terrorists. Petraeus’s team would evaluate Iraqi detainees, identify
    the most extreme members of them, move them to separate, maximum security facilities,
    and then work with the rest to convince them to rehabilitate. Petraeus knew that,
    though it would take significant effort to enhance the training and capabilities
    of Iraqi security forces, ultimately, this would pave the way for the transition
    of security responsibilities to Iraqi authorities. While the previous approach
    had also aimed for Iraqi self-reliance, it was unsuccessful. It took the infusion
    of a significantly greater US presence in Iraq to prepare their people for sovereignty.


    More troops on the ground means more troops to lead. And how Petraeus approached
    that is where leaders in all sectors can take some notes.


    • • •


    David Petraeus was generous with us in his time and attention. We were far from
    the first interviewers, students, or friends to ask him how he turned things around
    in Iraq. It would have been reasonable for a person of his stature to rehash the
    past with complacent repetition or to reply with a tired “asked and answered.”
    Far from it, Petraeus relived with and for us the elements of his strategy in
    Iraq—specifically rethought from the perspective of momentum.


    When many leaders come to the same conclusion, independently, it’s worth a deeper
    look. Indeed, General Petraeus’s “Four Tasks of Strategic Leaders” aligns remarkably
    well within our Momentum Model. In these, he shares the elements that strategic
    leaders should focus on, including many that are familiar to our model: leadership,
    communications, and feedback in particular.'
