    There he was, a coach with just a single year of head coaching experience, none
    at the major college level, taking the reins of the least desirable job in America
    and declaring the ultimate vision. Scott Drew and Baylor might not have made it
    to the ultimate mountaintop until a number of years later, but the first step
    on that championship journey began with the words he spoke, and the vision he
    cast.


    ### They Preached Their Values from Day One


    When he took over a team in complete disrepair, one of the first things Drew did
    at Baylor was to implement team chapel services before every home game. The team
    chaplain had never been asked to do anything like that before, but Drew was adamant
    that the team not only needed regular instruction on how to perform and improve
    on the court, but they needed guidance and inspiration off it as well.


    One of the issues the Baylor team dealt with was substance abuse, brought on in
    part by Baylor’s historic willingness to use fake drug test results to keep players
    eligible. Drew and his staff told players there would be no tolerance for illegal
    drugs. But they also said there would be no profanity used either, and any violations
    of that rule would be punished with push-ups. They also said that, as a staff,
    they would hold themselves to the same standard.


    In their last game of the season against Oklahoma, Scott Drew was trying to fire
    up his team to match their opponent’s physicality. “We need to keep their asses
    off the boards,” the notoriously choirboy clean Drew screamed. “And I will do
    push-ups for that!” His team went wild.


    They finished their season in a close loss that night, but the message was sent,
    and the culture was turning.


    ### They Celebrated Wins, No Matter How Small


    Baylor lost that first season—and lost big. But Scott Drew and his staff were
    still able to create moments, and celebrate them, when the tide started to turn.
    Down by 40 to powerhouse Kansas late in the game, Scott Drew challenged his players
    to win the last four minutes. When Baylor made a hustle basket in the last few
    seconds to accomplish the goal, “we celebrated on the bench like we just won the
    national title,” Drew told us. “The crowd thought we were nuts. But we were building
    something.”


    The team would only win three conference games all season, but the coaches championed
    each one. They had a big whiteboard in their locker room, and when they won their
    first Big 12 game, they drew a huge “1” on it. When they beat Texas A&M for just
    their second win, the coaches made a big deal about erasing it, and putting a
    “2” on it. By the time they won their third, and final, conference game of the
    season, the players had taken over marker duties. The players were not just celebrating
    the wins but engaging in the cultural practices the coaches had created.


    The NCAA extended Baylor’s postseason sanctions for Drew’s first years in Waco.
    But through persistent optimism, consistent effort, and a disciplined adherence
    to the values and vision they set down on day one, the prophecy Drew preached
    at his initial press conference eventually came true.


    Winston Churchill is claimed to have said, “Success is not final, failure is not
    fatal: it’s the courage to continue that counts.” So it is true with momentum.
    By its very definition, momentum is impermanent—and measured really only against
    the context of periods of stasis, stability, or, in some cases, decline.


    Ups, in other words, are measured against flat roads or slumps, pains against
    some individual baseline of comfort. And to companies in the midst of an industry-wide
    crisis, success may also be a relative term. Certainly, to Lumen CEO Kate Johnson—who
    was brought in to transform the company during a period in which all tech companies
    were facing common threats—her starting goal was to change the goal itself.


    In the fast-paced, unforgiving world of technology and telecommunications, Lumen
    Technologies found itself at a critical juncture. Once a titan in the industry,
    known for its extensive network infrastructure and innovative solutions, Lumen
    faced a daunting reality: The company was losing its competitive edge. Market
    share was slipping, customer satisfaction was dwindling, and the once-unstoppable
    momentum had come to a grinding halt. Lumen’s struggles were not sudden but rather
    a slow, painful descent. The company, formerly known as CenturyLink, had expanded
    rapidly through acquisitions, including the high-profile purchases of Level 3
    Communications in 2017 and Qwest Communications in 2011. While these moves initially
    bolstered Lumen’s network capabilities and market presence, they also brought
    about significant integration challenges. The sheer scale of merging disparate
    systems and cultures proved overwhelming.


    Internally, morale was low. Employees were disillusioned by constant restructuring,
    and the lack of a cohesive vision led to inefficiencies. Externally, customers
    were frustrated. Service disruptions became commonplace, and the once-stellar
    reputation for reliability and innovation was tarnished. Competitors such as AT&T
    and Verizon seized the opportunity, leveraging their agility to outmaneuver Lumen
    in critical markets. It seemed as though the company’s best days were behind it.


    When Johnson was hired, Lumen had been operating on the principle of “you want
    to lose last,” she told us. “In a declining market, you’ve got secular headwinds,
    and everybody’s revenue is declining on that old copper [wire] base, and you want
    to keep paying a dividend. You want to lose last. You want to be the last company
    standing.” But that wasn’t what Johnson had in mind.


    “That was not my assignment,” Johnson was clear. “In November of 2022 the board
    of Lumen hired me to transform the company. We agreed. The only way to do that
    was to pivot to growth. We had to cut the dividend, and we had to set up a new
    mission and a new strategy, a new operating plan, and a completely new leadership
    team in order to get value from the fiber network we knew was coming. We saw some
    tailwinds that would be accretive to the story, but you know, when you think about
    how I’m leading the company versus prior administrations, it’s really an apple
    and an orange.”


    Johnson’s appointment marked a pivotal moment. Johnson, who had left her position
    as president of Microsoft US in 2021, brought a fresh perspective and an unwavering
    resolve to steer Lumen out of its quagmire. She had taken a sabbatical between
    jobs—focusing her attention on leadership and mindfulness courses, tapping more
    deeply into the spiritual basis for what her purpose was, and how she could best
    serve. Consistent with this type of discipline and intention, Johnson’s initial
    days were spent listening. She conducted a thorough assessment of the company’s
    strengths and weaknesses, engaging with employees at all levels. Her approach
    was holistic, recognizing that the key to reversing Lumen’s fortunes lay not just
    in technological advancements but in reigniting the human spirit within the organization.
    “Well, it starts with them, right?” Johnson reflected to us. “Because, you know,
    they’re the ones that wake up every day and make a decision. Am I gonna do it
    the old way, or am I gonna lean into the new way? The new way is scary. I might
    make a mistake. I might feel awkward. I might be embarrassed. But, you know, I
    gotta dive into it. I’ve gotta use this sort of systemic resilience we’re trying
    to build.”


    Johnson’s approach included “city swings,” where she would travel to different
    Lumen locations, immersing herself in local operations and meeting with employees,
    customers, analysts, and partners to understand their challenges and perspectives.
    “It’s very formulaic,” Johnson explained. “It’s a couple of days. And it’s these
    immersions.”

