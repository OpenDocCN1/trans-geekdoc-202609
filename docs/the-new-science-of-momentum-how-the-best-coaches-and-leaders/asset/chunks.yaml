  raw: 'Bush was frustrated by the intensifying disarray in Iraq and the risks this
    posed not only to human life but to his own legacy, and he was sold on the promise
    of a “new way forward” with Petraeus at the helm. And the president said so, again
    and again, to the American public. According to one report, Bush mentioned Petraeus’s
    name more than 150 times in speeches and press conferences in the first six months
    of Petraeus’s command.


    Petraeus, for his part, urged patience and trust. The challenge would be monumental,
    but the general was armed with a strategic approach that he believed, if maintained,
    would prove transformational. He became the public face of the counterinsurgency,
    communicating directly with the American people and his soldiers alike to an extent
    never seen before. Fortunately, Petraeus was highly trusted by soldiers and politicians
    alike, and he leveraged this trust to create strategic patience.


    Petraeus’s previous experiences had bestowed a high “trust equation” quotient
    upon him. Most importantly, he was viewed as very competent due to his academic
    pedigree and intellectual understanding of counterinsurgency. For example, Petraeus
    had overseen (along with Marine Lieutenant General James F. Amos) the Army’s creation
    of Field Manual 3-4 *Counterinsurgency* in a previous assignment. Furthermore,
    he had successfully led the 101st Airborne Division in Mosul, Iraq, leveraging
    nation-building and counterinsurgency doctrine. Petraeus’s competence, track record
    in previous high-visibility command assignments, and clear understanding of the
    national command authority’s interests all contributed to his level of trust and
    gravitas.


    Usually, the person appointed by politicians to PR a problem puts at least some
    lipstick on the pig. But Petraeus did the opposite. “This is a period in which
    it gets harder before it gets easier,” Petraeus told the *Washington Post* in
    May 2007. Petraeus wasn’t wrong. The first many months of his lead were, in the
    West Point graduate’s own words, “excruciating.” Bombings increased, as did their
    death tolls. More than fifty people died each day in the violence in Baghdad alone.
    Chemical weapons such as chlorine gas were used for the first time, detonating
    in three cities. There was an average of one car bombing every day during that
    time. Calls were rising for the US to withdraw from Iraq.


    And then something shifted. That shift was the “surge.”


    On February 10, 2007, Petraeus gave his first speech in command of the MNF-I.
    It was his third tour and twenty-eighth month in Iraq. But what he said that day
    presented a total reversal of everything he’d seen so far. His recollection to
    us of that moment was once again as sharp as though he’d held that microphone
    just minutes before.


