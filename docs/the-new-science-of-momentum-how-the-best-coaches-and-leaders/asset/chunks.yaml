    who are a good fit with their culture, while those who do not fit well tend to
    leave. Collins emphasizes hiring based on character and innate capabilities rather
    than specific knowledge or skills, which resonates with the P-O Fit model’s focus
    on value and cultural alignment. The emphasis on cultural fit over specific job-related
    skills aligns with both the P-O Fit and ASA models, where fitting into the organizational
    culture is crucial for long-term success and commitment. And Collins’s idea of
    continually assessing whether team members are still the right fit for the bus
    mirrors the ASA model’s concept of attrition, where those who do not fit well
    naturally leave the organization.


    ### Military Context


    You’re almost certainly familiar with the US Army’s “Be All You Can Be” and the
    Marines’ “The Few. The Proud.” These slogans are part of the US military’s multifaceted
    recruitment theory that integrates elements from various recruitment and human
    resource management models, with a particular emphasis on strategic, psychological,
    and practical considerations.


    The military seeks to attract individuals who are drawn to the values and lifestyle
    of military service and those who meet stringent physical and mental criteria.
    Where in a business or sports environment, attrition may happen gradually or over
    time, the military front-loads attrition as much as possible. Basic training serves
    as both an introduction to military life and a further selection process where
    those not suited for military service are identified. In other words, the military
    seeks to quickly identify those who do not fit well and give them an early out.


    The employment of assessment center practices enhances the military’s ability
    to solidify their recruit retention success rate. For example, the Armed Services
    Vocational Aptitude Battery Test assesses candidates’ faculties in verbal, math,
    science, technology, and spatial areas. Medical examinations, physical fitness
    tests, and security background checks are other examples of frontloaded practices
    the military employs in comprehensive manner to get the “right” people into its
    ranks. Beyond measurable skills, the military also seeks to recruit a diverse
    workforce to reflect the society it serves and to benefit from a wide range of
    perspectives and skill—something that lends significantly to its culture.


    From there, the military invests in recruits as valuable assets. The military
    provides extensive training and education to enhance the skills and capabilities
    of its personnel, ensuring they can meet the demands of their roles. There’s enormous
    focus on retaining skilled personnel by offering career development opportunities,
    competitive benefits, and support for personal and professional growth.


    ### Political Context


    Political recruitment is a complex and strategic process that has been the topic
    of significant academic research across various fields. In theory, integrating
    insights from behavioral sciences, leadership theories, diversity research, data
    analytics, and political science, political parties and organizations can develop
    more effective recruitment strategies to identify, attract, and support candidates
    who are likely to succeed in the political arena.


    And there are some efforts to do so. Increasingly, political machines are using
    big data analysis to understand the traits and qualities that appeal to voters,
    to understand the psychological traits that make for effective leaders, and to
    identify potential candidates based on demographics, social media activity, and
    public engagement.


    But in practice, political recruitment is messier. Parties often establish search
    committees to identify potential candidates. Polls and focus groups are used to
    gauge public opinion and identify desirable candidate traits. Potential candidates
    are persuaded to run through a combination of appeals to their sense of duty,
    party loyalty, and personal ambition. Extensive vetting (ideally) ensures they
    can withstand public scrutiny, but vetting is almost always incomplete or imperfect
    and gives an entity a view of only what’s already happened in a candidate’s life—not
    what’s to come.


    And here’s the real kicker: In politics, an individual can effectively nominate
    themselves for public consideration. Even if a party organization goes through
    a rigorous process to select one candidate to run for a seat as its nominee, other
    members of that same party can file to run too. Party organizations are often
    under constraints to appear neutral (at least as far as the public can tell) in
    primary elections, which can restrict the effectiveness of party elites in advancing
    the one person they *really* want in office.


    If they can get that person to agree to run at all.


    Perhaps the most notable reluctant candidate of all time was Dwight D. Eisenhower,
    who became the thirty-fourth president of the United States. Eisenhower had a
    distinguished career as a military officer. He graduated from West Point in 1915
    and rose through the ranks of the US Army. During World War II, Eisenhower served
    as the supreme commander of the Allied Expeditionary Forces in Europe, where he
    led the successful invasion of Normandy (D-Day) and played a crucial role in the
    defeat of Nazi Germany. Despite his military success, Eisenhower had no political
    experience and initially showed little interest in a political career. His leadership
    during World War II made him a national hero, respected by both the public and
    political leaders across the spectrum—all of which made him an attractive candidate
    for public office.


    The idea of Eisenhower running for president began to take shape in the late 1940s.
    Both parties wanted him—something we’d rarely find today—and both the Democratic
    and Republican parties sought to recruit Eisenhower as a presidential candidate.
    President Harry S. Truman even considered asking Eisenhower to run as a Democrat
    in 1948.


    But Eisenhower was extremely reluctant to enter politics. In fact, he continually
    refused. He had never been involved in partisan politics and was more focused
    on his military and administrative duties, including his role as president of
    Columbia University. Eisenhower valued his nonpartisan status and feared that
    entering politics might tarnish his reputation as a unifying national figure.'
