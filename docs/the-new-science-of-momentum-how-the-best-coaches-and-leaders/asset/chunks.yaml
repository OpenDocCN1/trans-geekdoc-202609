    ##### LEADER ACTIONS


    There is a saying that “I don’t know what I said until you tell me what you heard.”
    The ability to lead well is highly correlated with communications effectiveness.
    A leader’s ability to adroitly provide purpose, direction, and motivation is transmitted
    through their communications. Effective communication requires transmitting a
    message from a sender to a receiver using common symbols, with the goal of the
    receiver accurately understanding the message. Fostering momentum happens in part
    via written, verbal, and nonverbal mediums. Ensuring your communications are positively
    driving the desired team behaviors is vitally important.


    ACTION 1:


    Clearly highlight the importance of significant facts.


    A variety of critical communications frameworks details the importance of generating
    clarity. Momentum is a function of tangible events being linked together. Yet
    leaders can wrongly believe certain things are patently obvious. Leaders must
    ensure people understand the significance of what is transpiring.


    ACTION 2:


    Clearly articulate the way ahead.


    The establishment of clear expectations is the first step in creating accountability.
    For teams to build upon (or reverse) the significance of previous events, leaders
    must lay out their expectations for what must transpire. The military uses a framework
    called “leader’s intent” as a means for articulating the way ahead. The framework
    is a concise communications tool that provides three crucial pieces of information:
    (1) purpose—why the assignment matters; (2) key tasks—what must transpire; and
    (3) end state—the success criteria. The benefit of the leader’s intent framework
    is that it serves as a vehicle for empowerment. The “why” is provided to place
    things into context. The “what” is provided to ensure the “must do” smaller elements
    of the overarching task are understood. Finally, the “what success consists of”
    statement details how the team will know whether it has won. The intent statement
    does not articulate the “how” (thus empowering team members to develop plans that
    will achieve the intent).


    ACTION 3:


    Consistently ensure two-way communications transpire.


    Leaders must cogently convey and receive information. Effective two-way communication
    can enhance trust, strengthen alignment, and sustain adherence to behavioral expectations.
    The practice of routinely engaging in two-way communications can foster faster
    and more effective learning, creating the conditions for better decision-making.


    ## [10](#nav.xhtml#sec11)


    ## [Team Climate](#nav.xhtml#sec11)


    Garry Ridge made his living reducing friction. He also made his living reducing
    friction. No, that wasn’t a typo or an erroneous repeat. Ridge truly did make
    his living by literally reducing friction through the product his company made,
    WD-40, becoming a household go-to, and by reducing friction in the company’s organization—between
    the individuals and hierarchies within it. Perhaps it should be no surprise that
    Ridge’s philosophy of leadership is a match for what his company offers consumers—the
    promise that when friction is reduced, freedom of movement is possible, and that
    when movement is possible, momentum is too.


    “The opposite of momentum is friction,” Ridge told us. “So how do you remove friction
    that allows you to have momentum? You remove friction by having systems and behaviors
    in the organization that don’t cause churn and that don’t stop people from moving
    on.” On one level, Ridge’s approach reflects a callback to the Attraction-Selection-Attrition
    model of recruitment, where through attrition those who are a poor fit for the
    organization self-select out, making room for individuals who match a team’s culture
    to join and contribute. But Ridge’s theory of organizational “freedom” goes well
    beyond the choice to join or leave the ranks.


    “These values that we had were truly the foundation of freedom. People want three
    things: They want to be able to make their own choice, they want to know they
    matter, and they want to know they belong. That’s it,” Ridge shared with our team.
    “Choice is something that is given to people within a framework because people
    won’t make choices if they feel fear. And so at WD-40, we don’t make mistakes;
    we have learning moments, which are actually catalysts.”


    Ridge told the story of how WD-40 attempted to introduce a new product but was
    at first worried about the negative impact to the brand if the product didn’t
    work. To avoid this, they used a different color scheme and omitted the brand’s
    iconic shield—and the product flopped. They learned in that moment the motivating
    “power of the shield” and readjusted, tinkered with the branding, and tried again.


    “It created the opportunity to be able to move on to a new opportunity because
    people weren’t afraid,” Ridge said. At WD-40, learning moments became an important
    part of the culture—a feature, not a bug in a collaborative process that allowed
    them to take advantage of a spark.


    Another such learning moment, early in Ridge’s tenure at WD-40, led to perhaps
    the biggest transformation in his leadership approach. Ridge had just returned
    to the office from two weeks abroad.


    “I remember vividly how it happened,” he recounted. “I got back, and I hadn’t
    been in the office for long at all, and someone kind of barreled up to me and
    said, ‘I got to talk to you,’ and just dumped on me.” This was in the days where
    email wasn’t as prevalent, and Ridge was taken aback.


    “If you’d spent as much time finding out or doing something about finding out
    what you don’t know, instead of storing that anger up in your backpack for two
    weeks, you could’ve solved the problem,” Ridge told his employee, whose response
    was the spark for major change.


    “I didn’t have permission.”'
