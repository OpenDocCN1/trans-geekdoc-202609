    Bill Ford was so convinced Mulally could be the spark Ford needed that he offered
    to give up the chairman role if doing so was necessary to lock up a deal. Initially,
    the board connected with Mulally through a mutual acquaintance (Gordon Bethune,
    former chairman and CEO of Continental Airlines). But multiple intimate conversations
    between Ford and Mulally are what cemented the latter’s ascension into the CEO
    role.


    Mulally once said, “Leadership is having a compelling vision, a comprehensive
    plan, relentless implementation and talented people working together.” Creating
    all four of those outcomes is not easy. The Ford Motor Company lost $12.7 billion
    in 2006 and $30 billion total between 2006 and 2008. Yet it was profitable again
    by 2009 and had completely revamped its product offerings. The company was also
    the only major domestic automaker to decline taking the government bailout money
    (Troubled Asset Relief Program). Mulally’s recruitment and leadership helped to
    revamp the company’s culture and changed how they prepared to compete and win.
    So, how did he do it? Mulally utilized eleven principles to drive beliefs and
    create a performance culture leveraging effective communications driven by his
    weekly “business plan review” (BPR).


    The BPR involved profit center leaders and the twelve functional area heads. The
    integration of the BPR into the organization’s processes was very difficult initially
    due to the company’s long-standing silos (borne out of a large set of diffuse
    brands) and reputation for infighting. Furthermore, leaders were not used to highlighting
    shortcomings in their communications.


    Mulally’s BPR required each member of the leadership team to brief the status
    of their major projects (green for “on plan,” yellow for requiring attention,
    and red for urgent situations). All BPR items were connected to operational targets
    that played a role in fostering profitable growth. Anything that generated, delayed,
    or cost the company profitable growth was measured and assigned a color-coded
    status map. But leaders were less than forthcoming when briefing their status
    for several months after initiating the process. Everyone kept briefing their
    status as “green” despite the company’s well-known shortcomings. Mulally knew
    he had to build trust, and therefore he demonstrated patience as this subterfuge
    transpired.


    Then, one leader briefed his status as yellow, and an audible gasp was exhaled
    by the BPR attendees. Mulally’s response was simply, “Okay, how can we address
    the situation?” Mulally then followed up with “I can’t fix it on my own but the
    people on this call can.” That moment was the spark that got people to buy into
    the process, and the rest is history, as they say. Bill Ford’s belief in Alan
    Mulally’s competence and character made the spark possible when he took a chance
    on someone outside the industry whom he trusted to get the job done.


    ## Leader Actions


    When the word `spark` is used as a verb, it means “stimulating a dramatic event
    or process.” Momentum leaders act in service of creating positive sparks that
    galvanize people’s motivation (a force influencing direction, effort, and persistence)
    to perform actions that advance a team’s objectives.


    ### Action 1


    Foster clarity by the establishment of a clear mission statement and SMART goals
    to support its accomplishment.


    George T. Doran’s SMART goals framework (that is, specific, measurable, attainable,
    relevant, time bounded) is a vehicle for improving motivation and performance.
    Leaders must create a mission statement that is cogently understood by all team
    members. Subsequently, they must craft plans and objectives that support accomplishment
    of the mission. Ensuring your people can make the linkage between the mission
    and the spark can enhance their willingness to strengthen pursuit of the SMART
    goals. Edwin Locke and Gary P. Latham’s research highlighted the importance of
    five components in goal setting (clarity, challenge, acceptance, feedback, complexity),
    and the leader action we recommend ties directly to clarity and challenge.


    ### Action 2


    Enhance the team’s ability to collaborate effectively.


    A 2017 *Harvard Business Review* research publication cited several reasons why
    collaboration encounters obstacles. The top three reasons cited were “silos (67%),
    the lack of collaborative vision from leaders (32%), and senior managers not wanting
    to give up control (32%).” To address sparks effectively requires coordinated
    action by teams. Enhancing the team’s collaboration acumen is essential if they
    are to act decisively and effectively when a spark occurs. Patrick Lencioni’s
    *Five Dysfunctions of a Team* identified challenges teams routinely experience
    when seeking to “grow together.” Flipping the five dysfunctions is a recipe for
    strengthening collaboration: build trust, develop practices for addressing conflict,
    make team commitments, hold team members accountable for their behavior, and focus
    on collective results.


    ### Action 3


    Create shared understanding.


    Information is power. The US Army framework for creating high-performing teams
    (that is, Mission Command) utilizes “shared understanding” as one of its key principles.
    Shared understanding is “the ability of multiple people to use common knowledge
    to achieve shared goals. It’s based on the idea that understanding is an ability,
    and that people can modify their thoughts and actions to achieve their goals.”
    Jessica R. Mesmer-Magnus and Leslie A. DeChurch’s meta-analysis published in the
    *Journal of Applied Psychology* found that information sharing positively predicted
    team performance, cohesion, knowledge integration, and member satisfaction.


    ## Leader Communications


    We like to think leadership is about words. Words that inspire. Words that encourage.
    Words that direct. Words that bring clarity in the fog of uncertainty. But here’s
    the truth: Leadership communication is rarely about the words you say. It’s about
    the things you *do*.


    Think about it. The most powerful leaders don’t just talk. They act. They signal
    with every move they make. Sometimes it’s in the heat of the moment, when they
    step in without saying a word and change the entire trajectory of a situation.
    Other times, it’s a nod, a look, or even silence that says more than any speech
    ever could. And then there are the moments when the communication is baked into
    the preparation itself—the hours spent getting ready so that the time comes, the
    message is clear without a single word uttered: *This is what we’ve trained for.*


    Words matter, sure. But actions are the real conversation. They’re what separates
    good leaders from those rare few who spark momentum and turn the tide. Leadership
    communication is a constant pulse, an unspoken exchange that echoes through every
    decision, every gesture, every pause.


    Pat Geraghty, president and CEO of GuideWell and Florida Blue, was raised to assume
    such a role. In the early mornings of his childhood, Geraghty’s father would greet
    him with a saying that subtly, but powerfully, came to shape his understanding
    of both leadership and life: “Make it a great day.” Unlike the more common “Have
    a great day,” this phrase carried a powerful message that would become a cornerstone
    of Geraghty’s leadership philosophy at Prudential Financial, Blue Cross Blue Shield
    of New Jersey, Blue Cross and Shield of Minnesota, and ultimately as the helm
    of one of the largest health plans in the United States. The shift from passive
    to active—the difference between having and making—encapsulated a mindset of ownership,
    accountability, and proactive engagement.

