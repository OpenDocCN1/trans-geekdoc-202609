    placing the very best employees in strategic positions, good performers in support
    positions, and eliminating nonperforming employees and jobs that don’t add value.


    The graphic below highlights the distinction between A roles that require A talent.


    ![](images/f089-01.jpg)![](images/f090-01.jpg)


    If you knew the name David Ross before the 2012 Major League Baseball season,
    it would prove you were one of the sport’s great fans. Though Ross would go on
    to a fifteen-year MLB career, he spent all but two seasons of that time as a backup
    catcher bouncing among several teams. But Ross would become the exemplar of this
    module on recruiting.


    Halfway through his career, he earned that starting role with the Cincinnati Reds.
    When the Reds changed managers, bringing in Dusty Baker as leader, Baker noticed
    something about Ross that didn’t sit well with him. He felt his catcher had become
    more concerned about his personal statistics than he was team success. To make
    the point, he yanked Ross from the field in the middle of the game and replaced
    him with his backup. The move led to an animated conversation after the game where
    Ross demanded an explanation.


    The result: Baker cut Ross from the team weeks before the season’s end.


    Ross was given a short stint in Boston with the Red Sox, but when the team’s playoff
    run ended short of the World Series, General Manager Theo Epstein privately let
    Ross know he wouldn’t be invited back the following year. Then he offered a moment
    most leaders don’t give departing employees. “You should know,” Epstein began,
    “that when we looked at bringing you here, we called Cincinnati. The word we got
    was that we shouldn’t add you to the team because you’re a bad teammate. That’s
    not what we saw in the last few weeks, but that’s your reputation. And in this
    business, reputations die hard.”


    Ross left the meeting stunned. But rather than blame his former manager, he set
    out to change his reputation. When he landed with the Braves in Atlanta, he started
    asking every player in the locker room to tell them about the best teammate they
    ever played with and to give him three words to describe that teammate. He made
    a list of characteristics—encouraging, mentoring, truthful, and fully present
    among others—and set out to bring those to the field every day.


    Over the next four years when he played as a backup in Atlanta, he fully transformed
    the way others saw him. He was always standing on the top step of the dugout,
    praising teammates for great play. That made him a player that younger talent
    sought out for advice. And as his contract in Atlanta expired, fully half of the
    teams in baseball lined up to sign him to a deal. He was a backup . . . but he
    was the glue that could hold a team together.


    He went back to Boston, where he helped the Red Sox win the 2013 Series. Then
    he went to Chicago, where he helped the Cubs do the same in 2016. As the seventh
    game of that 2016 Series came to a close, the player who was lifted by teammates
    to their shoulders and carried from the field: David Ross, a backup catcher.


    “I learned so much on that journey,” Ross said for this book. “Every team needs
    talent. But what they also need are players who will make others better just by
    the words they say and the way they carry themselves. You have to bring those
    players to your team to find real success.”


    Ross would go on to manage the Cubs for three years, and he said he was always
    looking to recruit players who would offer selflessness as a skill.


    • • •


    Sue Semrau got silent. It was the first time in over an hour where our conversation
    about momentum simply stopped. The shared energy and animation about preparation,
    communication, culture, and leadership for momentum had been palpable. One idea
    flowed to the next; examples and thoughts intermingled. Stories. Theories. Visualizations
    of what momentum looked and felt like. But then we asked about recruitment, and
    the ability for coaches to seek talent that not only can perform well on the court
    but also has the right fit in terms of personality.


    Coach Semrau—who had transformed the Florida State Seminoles into a formidable
    force in women’s college basketball, leading the team to numerous NCAA tournament
    appearances and earning multiple ACC Coach of the Year honors—seemed to play out
    various responses in her head, perhaps some contradictory to others, before choosing
    to respond with a question: “In an ideal world with no constraints? Sure. We would
    love to recruit for personality.”


    She paused, her eyes reflecting a mix of resolve and contemplation. “But it’s
    never that simple.”


    Recruiting players for college basketball teams involves navigating numerous challenges
    and constraints. Some key difficulties and limitations faced by programs and coaches,
    we learned, include high demand and recruiting wars where the best high school
    players are flooded with promises of playing time, development opportunities,
    and exposure. Then there’s the academic requirements set by the NCAA that can
    disqualify otherwise talented players and admissions standards held by some schools,
    which can further limit the pool of potential recruits. The NCAA itself sets stringent
    rules governing recruitment, including limits on contact periods, official visits,
    and permissible benefits, and programs must be vigilant in monitoring compliance
    to avoid violations that could lead to sanctions. Programs are further restricted
    by the number of scholarships they can offer, and there are financial limits on
    how much programs can spend on recruiting activities. Then there’s the increasing
    use of the transfer portal, which allows players to move more freely between programs,
    adding another layer of complexity to recruiting and retention. Parents and other
    influencers often have significant input into a recruit’s decision, which can
    complicate the recruitment process. Coaches must navigate external pressures and
    sometimes unrealistic expectations from family and advisers.


    There’s only so many spots, and sometimes the players who fit the positions that
    need recruiting don’t have the right personalities or meet the academic criteria.
    The coach’s hands are often tied. In other words, it’s hard enough to find talent
    to match an open position. The rest is icing—or must be created, and fostered,
    once the recruit is signed. That’s where Coach Semrau thrived—in raising her new
    players into the team culture and, for lack of a better phrase, making it work.'
