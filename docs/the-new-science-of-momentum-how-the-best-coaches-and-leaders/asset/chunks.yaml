    ### They Didn’t Let Their Past Determine Their Future


    The previous coach had resigned in shame just two weeks prior and, as he took
    the podium to introduce himself to the college basketball world, Scott Drew had
    no idea how severe the penalties would be that his team would have to endure.
    But that didn’t stop him from boldly proclaiming the reason he was there.


    “At Baylor University, I did not come to go to the NCAA tournament,” Drew said
    at his introductory press conference. “We came to win games in the NCAA tournament.
    We came with the chance to win a national championship at Baylor University.”'
