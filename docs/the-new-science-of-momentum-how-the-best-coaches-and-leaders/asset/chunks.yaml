    `BERNIE BANKS` is the director of Rice University’s Doerr Institute for New Leaders
    and a professor in the practice of leadership within the university’s Jesse H.
    Jones Graduate School of Business.


    Bernie retired from the US Army in 2016 as a brigadier general after having successfully
    led West Point’s Department of Behavioral Sciences & Leadership in his final assignment.
    He has led multiple military units ranging in size from ten to more than three
    thousand people. Additionally, Bernie has engaged with organizations around the
    globe regarding their leader development efforts.

