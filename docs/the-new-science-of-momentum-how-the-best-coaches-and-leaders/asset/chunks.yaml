    需要注意的是，持续且有效的领导力需要领导者与追随者之间高度的信任。因此，我们将领导力作为动能驱动力时，包含了对信任重要性的理解。大卫·迈斯特（David Maister）、查尔斯·格林（Charles
    Green）和罗伯特·加尔福德（Robert Galford）提出的“信任方程式”是一个强调信赖度四个关键要素（信誉、可靠、亲密和自我导向）的模型。


    ![](img/f047-01.jpg)


    ### 信赖度的要素


    **信誉**（Credibility）涉及他人对我们知识、技能和过往业绩的信任。它是通过展示我们的能力和分享相关经验建立的。如果人们认为领导者不合格或缺乏经验，信任就很难建立。


    **可靠性**（Reliability）关乎符合预期并一如既往履行承诺。守信用、履行承诺非常重要。表现出可靠性的领导者会培养人们对其能力的信任和信心。


    通过情感安全（`intimacy`），我们并不是意味着我们需要与某人建立深层次的个人关系。建立亲密感可以创造理解、熟悉和安全感。它利用了同理心、积极倾听以及对他兴趣的真实关注。


    **自我导向**（Self-orientation）考察了领导者（或领导者们）在多大程度上将自身利益放在他人利益之上。领导者的自我倾向越强，看起来就越不可信。表现出对他人利益的真实关注是非常重要的。


    ### 领导力与动能


    诺斯（Northouse）还为我们提供了最直观的领导力定义——一个我们在本书以及许多其他书中都可以作为领导力实践起点的定义：“个人影响一个群体以实现共同目标的过程。”


    这就是为什么领导力不是我们模型中的单一要素，甚至不是模型中某一个轮子。相反，它是动能的主要驱动力，是一种几乎持续地影响几乎每一个其他输入因素的力量。领导力在这个动能模型中的卓越地位，不仅得到了学术研究的支持，也得到了数千名普通人的认可。在我们对公众的某些调查中，我们询问了各种因素对团队产生动能可能的影响有多大。在包含九个因素（包括我们模型中描述的许多因素）的列表中，“领导力”和“领导者的沟通”脱颖而出，成为影响力最大的两个。


    那么，从这些文献中可以看出，什么是一个优秀的领导者？


    为此，我们转向我们的朋友兼贡献者詹姆斯·柯林斯（James Collins），他 2001 年的著作《从优秀到卓越：有些公司为何飞跃……而另一些没有》（*Good
    to Great*）已成为各行业商业界的读物。若干大规模数据研究探索了领导力对组织绩效的影响，而《从优秀到卓越》中的研究自那时以后一直在领导力必读清单上占据常青之地。


    在五年里，柯林斯试图识别让优秀公司转型为伟大因素，并研究了那些实现了这种飞跃并保持了至少十五年表现的公司。研究团队在四十年的时间里分析了 1435 家财富
    500 强公司，最终将焦点缩小到 11 家公司。柯林斯发现了让这些公司脱颖而出的七个条件，意外的是，领导力位居首位。在柯林斯看来，“第五级领导者”体现了个人谦逊与专业意志的独特结合。他们通常很谦虚、内敛，但有着强烈的决心，不惜一切努力让公司取得成功。重要的是，这些第五级领导者更多地关注组织的成功，而非个人的认可。


    ### 军事语境下的领导力


    在商业、学术研究和理论之外，“为了动能而领导（leading for Mo）”是什么样子的？


    运动中的得分显而易见——进了更多的球或跑了更多码数。政治中的得分显而易见——民意调查中的领先或选举日投出的更多票。商业中的得分显而易见——转化了更多客户或股票价值的飙升。但在军事领域，赢得或失去的一分可能意味着一个人的生命。赌码不同，分量更重——尽管如此，往往往往不那么清晰且更加复杂。也许这是因为规模也更大。一支运动队可能只有几个或几十个队友和几十个竞争对手。一个政治候选人在初选中可能只需要击败几个人，或者在投票时需要说服几十名委员会成员。企业的员工人数从几个人到几千人不等，但该公司的宇宙是被定义的，竞争对手通常是已知的且有限的。军事冲突的规模要大出许多数量级，影响结果的环境、社会和政治因素也同样。此外，不同于
    90 分钟的体育比赛、政治竞选周期或业务季度末报告，军事行动不是相互预先计划的。结局可能取决于一个决定，而非决定性的胜利，而计分板可能需要几年、甚至几代人才能完全评估。


    虽然这些变量可能使得将其他领域的教训应用到军事领域变得困难，但也意味着在军事语境下学到的教训对其他领域的人来说特别有价值。如果一个流程在极风险、高复杂性的军事语境下有效，那么它在其他地方的应用可能会证明是非常强大的。


    平民领导者可以从那些准备、驱动并执行改变游戏决定的军事领导者身上学到什么？当衡量标准是人类生命或国家权力转移时，动能看起来是什么、意味着什么？组织如何利用从战场中学到的经验来提高自己的敏捷性、准备工作和应对能力？


    '
