    # Social Learning and Self-Efficacy


    Bandura’s groundbreaking research in the 1960s introduced the world to the concept
    of social learning theory, which posits that people learn behaviors through observation,
    imitation, and modeling. One of his most famous studies, the Bobo doll experiment,
    vividly illustrated this theory. In this study, children watched an adult model
    act aggressively toward a Bobo doll, a large inflatable toy. The adult hit, kicked,
    and verbally assaulted the doll. When the children were later given the opportunity
    to play with the Bobo doll, they imitated the aggressive actions they had observed,
    often replicating the exact behaviors and even inventing new ways to attack the
    doll. This experiment demonstrated that children could learn and replicate aggressive
    behaviors simply by observing others, without any direct reinforcement.


    ## Understanding Self-Efficacy


    Building on his work in social learning, Bandura developed the concept of self-efficacy,
    which he detailed extensively in his later research. Self-efficacy refers to an
    individual’s belief in their ability to execute behaviors necessary to attain
    their goals. One significant finding from Bandura’s research on self-efficacy
    was its impact on motivation and resilience. For example, Bandura discovered that
    individuals with high self-efficacy are more likely to set challenging goals,
    persist through difficulties, and recover quickly from setbacks. They approach
    tasks with a sense of confidence and are more resilient in the face of adversity
    compared to those with low self-efficacy, who may doubt their abilities and give
    up more easily.


    ### The Four Sources of Self-Efficacy


    The four main sources of information that inform how people conceive of their
    self-efficacy are as follows:

    1. **mastery experiences**—achieving success at a new task can help build self-belief;

    2. **vicarious experiences**—adopting the experiences of others as our own can
    help estimate the likelihood of success or failure in similar situations;

    3. **social persuasion**—dialoguing with others can influence self-perception;

    4. **physiological and affective states**—how we interpret our emotional and physical
    reactions can affect self-efficacy.


    ## Collective Efficacy in Communities


    In the 1990s, sociologists Robert Sampson, Stephen Raudenbush, and Felton Earls
    built upon Bandura’s research in a landmark study that underscored the importance
    of collective efficacy in community settings. Their design, which focused on Chicago
    neighborhoods, found that areas with high collective efficacy—characterized by
    mutual trust among neighbors and a shared willingness to intervene for the common
    good—experienced significantly lower rates of violence and crime. This finding
    highlighted how the collective belief in a community’s ability to maintain social
    order and achieve positive outcomes can dramatically impact real-world conditions.


    ## The Miracle on Ice


    The power of collective efficacy also touched the 1980 US Olympic hockey team,
    in a game famously known as the “Miracle on Ice.” This group of amateur and collegiate
    players faced the seemingly insurmountable challenge of competing against the
    Soviet Union’s seasoned and dominant team. Though the Soviets called their team
    “amateur,” their players were all part of the nation’s military and played together
    constantly. They had won the four previous gold medals. Under the leadership of
    Coach Herb Brooks, the US team cultivated a strong sense of collective efficacy.
    Brooks instilled confidence in his players through rigorous training, clear goals,
    and unwavering belief in their potential. The result was one of the most memorable
    upsets in sports history, as the US team defeated the Soviets and went on to win
    the gold medal. This victory was not merely the triumph of individual talent but
    a testament to the power of collective efficacy.


    ## Leadership and Team Dynamics


    Beyond structured social experiments and sports, Bandura’s research also set the
    stage for a deeper understanding of how self- and group efficacy influences outcomes
    in business and how leaders can foster collective efficacy within their organizations.
    We were fortunate for the chance to interview one great mind whose work on leadership,
    team dynamics, and group efficacy has brought academic research out of the ivory
    tower and into practical application for teams of all kinds.


    John Hollenbeck runs the Team Lab at Michigan State University’s Eli Broad College
    of Business. His research and citations to his work flood academic journals and
    popular magazines alike, providing scientists across various academic fields with
    tested theories to explore and providing workplaces with increasingly tactical
    advice, such as the optimal number of participants on video conference calls.
    The Department of Defense and the National Science Foundation have both called
    upon Hollenbeck to explore issues of importance to their respective teams, and
    when we called upon him to learn more about what might foster team momentum, he
    was generous in giving us some of his time and insights too.


    ## The Nature of Momentum


    Hollenbeck’s approach to studying the science of group dynamics necessitates a
    fair amount of natural skepticism about what’s real versus perceived, and that
    orientation was evident in Hollenbeck’s initial reaction to our questions of him
    on momentum. In many instances, Hollenbeck told us, he thinks that momentum is
    an “epiphenomenon”—an experience that’s more perceived than real, born through
    people seeing patterns and assuming causal relationships between things where
    none may truly exist.


    “The human brain has a natural tendency to detect associations,” Hollenbeck explained.
    One illustration is the “hot hand fallacy” where a series of successes is interpreted
    by observers—or the performer herself—as a streak of momentum but may or may not
    be exceptional beyond chance. For example, an NBA player hitting multiple shots
    in a row is often seen as “hot,” but as far as statistical probability, the streak
    may be indistinguishable from chance.


    But despite this uncertainty, to Hollenbeck, the question of “momentum or not?”
    is less meaningful than the question of how individual and team performance influences
    self-efficacy, or the belief in one’s ability, and how these beliefs, mindsets,
    and emotions spread through a group, influencing future performance and the potential
    for sustained momentum. In other words, even if the science is unclear on which
    events are true momentum and which can be predicted by chance, it may be a distinction
    without a difference when it comes to how team members perceive these experiences
    and act upon them. On a practical level, Hollenbeck’s scholarship tells us that
    a team’s belief that momentum is on their side can boost collective confidence
    and effort, even if the actual phenomenon is statistically insignificant.


    What do most people think of momentum, and do these perceptions differ between
    people who have more or less experience with team dynamics? In order to learn
    more about how people perceive momentum, and about how different types of people
    experience this phenomenon or attempt to manipulate its course in their professional
    lives, we fielded a series of comprehensive, scientific surveys on this and more,
    with fifteen hundred American adults responding. The results demonstrate extraordinary
    consensus on a number of things.

