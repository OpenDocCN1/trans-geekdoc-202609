- fmt: '

    When we first sat down to speak with Commander Alexander P. Armatas, he was the
    commanding officer of the Blue Angels for the 2023 and 2024 air show seasons.
    Originally from Skaneateles, New York, Armatas has had a distinguished career
    in naval aviation. He graduated from the United States Naval Academy in 2002 with
    a degree in aerospace engineering and earned his wings in 2005. Before taking
    command of the Blue Angels, Armatas served as the commanding officer of Strike
    Fighter Squadron 105 (`VFA-105`), also known as the “Gunslingers.” His leadership
    experience includes multiple deployments aboard aircraft carriers in support of
    various operations, such as Operation Freedom’s Sentinel. Armatas had accumulated
    more than four thousand flight hours and more than nine hundred carrier-arrested
    landings when we spoke. And beyond a tally of these flight hours—and of particular
    interest to our discussion of team dynamics and momentum—Armatas had led and participated
    in countless hours of debriefs with his teams, the feedback sessions that follow
    each show. These debriefs often last longer than the event being briefed. While
    a Blue Angels show may last forty-five minutes, the debriefs last anywhere from
    one hour to seven. And while the cheering crowds on the grounds offer nearly unanimous
    positive feedback for the great feats they just observed, the Blue Angels debrief
    sessions focus almost exclusively on what went wrong.


    “That’s how we operate,” Armatas told us. “We don’t have time to pat each other
    on the back and talk about all the good things. And we did enough things wrong
    that that’ll take up plenty of time on its own. So that’s where we focus; we focus
    on improving on the stuff we did wrong and accepting that the stuff we did right
    we’re going to do right again, which is important as well.”


    Armatas knows that these things change too—that something that went well on one
    show may go poorly in the next. There’s so little room for error that feedback
    must be equally clear. After all, these pilots fly within eighteen inches wingtip-to-wingtip
    of one another at speeds up to seven hundred miles per hour during high-speed
    passes.


    “You have to establish the ability to provide feedback to people without it being
    personal,” he said. “So you need to be able to give feedback to somebody—constructive
    criticism, negative feedback, whatever you want to call it. You need to be able
    to do that in a setting where we all trust each other and we all know that it
    is for the good of the organization and that it’s never personal.”


    While these sessions evoke extremely candid, unfiltered feedback, Armatas also
    underscores the importance of tact and delivery. He cites a common pitfall where
    some people with particularly strong personalities may say they don’t care what
    people think and pride themselves in saying what they want to say as long as they
    feel it’s true.


    “I think that’s a trap,” Armatas said. “I think that you can be right, and I tell
    my kids this all the time. I tell them, it doesn’t matter if you’re right if no
    one’s listening. I’m not saying you have to be the nicest, most likable person
    in the world, but if you don’t do a good job of saying something the right way,
    then the value of the feedback is diminished by the fact no one wants to hear
    from you because they’re upset about how it was delivered.”


    One way that the Blue Angels seek to ensure the most level, candid feedback during
    debriefs is to remove rank while doing so. When team members walk into work, yes,
    Commander Armatas is the boss. But when they enter the feedback room for the “after
    action report,” everyone takes their ranks off their arms. Nobody is a general,
    nobody is a captain—everyone becomes equal. To Armatas and his Blue Angel predecessors,
    this is essential for having powerfully honest conversations where everyone can
    participate. It’s not just the leader levying judgments; it may be the leader
    getting judged.


    “Everything is dissected, and everybody is critiqued by everyone else,” he told
    us. “Once you establish that trust within the organization, once we establish
    that none of this is personal, that we’re all working together for the same common
    goal, then you can debrief people. You need to be a talented aviator and a capable
    representative of the Navy and Marine Corps. That’s just to get you in the door.
    Your ability to have a bad day and take it in stride, as my coach used to say,
    that’s what keeps you here. That’s what allows the team to get to where it needs
    to get to.”


    We want momentum to take us someplace. If things are working right, momentum helps
    lead us to success. But momentum has a shelf life. Just because there’s a winning
    streak, it doesn’t mean it’ll continue at that same pace indefinitely. There are
    outcomes throughout a competitive experience—not just at the end of a game or
    the end of a quarter.


    We struggled with this chapter for that reason. It would be easy to say that momentum
    carried a team to a spot—but the truth is that there are many spots, many games,
    many deals, many battles, many elections. You don’t want just to live another
    day but to make some organization-changing transformations. We started out thinking
    about this chapter as relating to an “outcome,” singular. But it quickly became
    clear that “outcome” is both too narrow and too final. We debated various other
    ways of imagining it—“destination” or “result,” for example. But we returned to
    “outcomes,” plural, in recognition of the countless data points, results, and
    inputs that individuals and teams collect along the way to a shared goal.


    But at the heart of outcomes—the engine that drives what `outcomes` mean to a
    team—are the many opportunities they provide for feedback to react to. In other
    words, feedback is what makes outcomes meaningful in the context of momentum.
    This makes feedback one of the most critical components of personal and team development,
    serving as a guiding force for improvement, motivation, and performance evaluation.
    Feedback comes in various forms, each with distinct characteristics and implications
    for how it is received. Understanding the diverse types and natures of feedback—including
    verbal, nonverbal, kinesthetic, data driven, and environmental—can significantly
    enhance the effectiveness of communication and performance outcomes.


    Our model of momentum depends on feedback at every level, which is why feedback—like
    leadership—isn’t one “box” but rather a nearly all-encompassing feature, touching
    recruitment, spark, leadership, team climate, belief and mindset, preparation,
    and culture alike.


    We’ve already looked at how important it is for teams to be receptive to clues
    of momentum—to be able to feel, see, and identify a spark when it’s happening.
    Similarly, with feedback, it’s critical for teams and individuals to be receptive
    to what constitutes feedback, which comes in many forms.


    * Verbal feedback, is the most traditional and direct form of communication, typically
    involving spoken or written words that convey praise, criticism, or suggestions
    for improvement. This form of feedback is prevalent in educational settings, workplaces,
    and coaching environments. Verbal feedback can be immediate, such as in a live
    coaching session, or delayed, as in a written performance review. According to
    research, verbal feedback is most effective when it is specific, constructive,
    and delivered in a manner that is clear and understandable to the recipient (Hattie
    & Timperley, 2007).

