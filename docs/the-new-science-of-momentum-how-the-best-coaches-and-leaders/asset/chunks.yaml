    Recently, a study by University of Wisconsin–Milwaukee professor Paul Roebber
    found evidence that momentum is real in football and can improve a team’s chances
    of winning. His research defined momentum as a consistent change in win probability
    over at least three successive changes of possession. The results showed momentum
    streaks occur more often than random chance would predict. Roebber’s study identified
    a physiological basis for momentum called the “winner effect,” where success leads
    to increased testosterone and reduced stress hormones. This provides a biological
    explanation for how momentum could manifest.


    These efforts, largely designed to prove the existence or influence of momentum,
    are a great starting point. But it’s another set of questions that interests us
    the most: What are the differences between surging teams that win in overtime
    compared with the surging teams that don’t? What separates organizations that
    are able to maintain momentum between quarters and those that can’t? What types
    of communications between group members maximize cohesion and reduce friction—a
    top enemy of Mo?


    We start with the premise that momentum exists and can be manipulated by intentional
    types of preparation and organizational structure, and we give the following definition:


    Momentum is a synergistic force that influences the progress, resilience, and
    focus of a team; and its impact on the mindset of a team—positively or negatively—can
    be manipulated and extended.


    From here, this book explores research to inform leaders and teams about the elements
    that will amplify their chances of preparing for momentum, seizing the reins of
    a surge, and carrying it into sustained momentum.


    That’s what our model offers, and we look forward to going there with you.


    # Overview of the Momentum Model


    The fabled social psychologist Kurt Lewin once said, “There is nothing so practical
    as a good theory.” When leaders leverage rigorous models, frameworks, and theories,
    they can enhance their probability of generating a successful outcome because
    they think more holistically about their approach. A recent example of utilizing
    such an approach is Microsoft under Satya Nadella’s stewardship.


    Steve Ballmer served as the chief executive officer of Microsoft from 2000 to
    2014. During his tenure, the company’s revenue grew by 300 percent, and the profit
    rose by 200 percent. Yet the company’s stock price was lower when he departed
    than when he took over. Why? Investors thought the company was overreliant on
    legacy products and resistant to championing emerging opportunities (for example,
    open-source computing and smartphones). Conversely, Apple’s stock had risen from
    $50 to $500 during that same time frame. It was apparent to the Microsoft board
    that the company needed to generate positive momentum, and Satya Nadella was their
    choice to make it happen.


    Nadella joined Microsoft in 1992 and rose through its ranks, ultimately serving
    as the executive vice president of the Cloud and Enterprise Group before it was
    announced on February 4, 2014, that he would become the company’s third chief
    executive officer. In the years since then, Nadella and his team have executed
    a brilliant strategic pivot that relied on generating positive innovation momentum
    through the firm while using some noted change frameworks.


    A brief examination of Nadella’s (and his team’s) early years of repositioning
    the company reveals that they strongly adhered to John Kotter’s and Kurt Lewin’s
    celebrated change models and Edgar Schein’s cultural change mechanisms. Most importantly,
    Nadella recognized the need to generate positive momentum and declared shortly
    after assuming the CEO role that it was time to “rediscover the soul of Microsoft,
    our reason for being.”


    Once he assumed the CEO role, Nadella immediately sought to establish a “sense
    of urgency” while “unfreezing” the organization. He “induced anxiety” by highlighting
    the changing technology landscape and why it was imperative to compete with cloud-first
    companies (for example, Google and Amazon). Nadella employed data to show the
    reality of Microsoft’s situation while also emphasizing to the workforce that
    he was one of them. He undertook all the aforementioned actions in service of
    shocking people out of their comfort zone.


    Two actions were emblematic of Nadella’s commitment to building a core group of
    change leaders. First was his directive to invite the former CEOs and chief technology
    officers (CTOs) of every company Microsoft had acquired in 2013 to the organization’s
    prized executive retreat (the executive retreat traditionally involved taking
    the top 150 leaders in the company to a luxurious off-site location for high-level
    discussions). The summit invitation was noteworthy because many individuals did
    not possess high enough role responsibility post-acquisition to qualify for attending
    the conclave. Furthermore, the managers of the invited group fell below the codified
    invitation qualification qualification. Nadella was challenging convention and
    culture in taking this approach. But he was committed to leveraging the different
    perspectives as a forcing function.


    Second was the decision to conduct customer visits to a cross section of the company’s
    accounts by senior leaders. This edict, too, was unusual. There were many leaders
    who pushed back on the need to conduct such visits. An undercurrent of the resistance
    was rooted in the perspective that account leads had a good handle on how to best
    serve their customers. Thus, there was no need to bring leaders from across the
    company to conduct visits. Yet, Nadella held people accountable for following
    through on his instruction. The ensuing interactions fostered more effective alignment
    among business units and revealed friction points that could be addressed through
    cultural modifications.


    In the mid-1970s, Bill Gates had established the mission of Microsoft as “a computer
    on every desk and in every home.” The reality in 2014 was that the company had
    effectively accomplished that mission in developed and industrialized countries.
    Consequently, the statement was no longer a driver of significant growth and innovation.
    Nadella understood the need to reimagine and “communicate the company’s vision”
    as part of the effort to reestablish its momentum. Ultimately, Nadella’s team
    landed on “to empower every person and every organization on the planet to achieve
    more” as the coalescing vision and started sharing it during customer visits and
    company gatherings.


    The ability to unlock dormant organizational potential is highly correlated with
    “empowering others to act.” Prior to Nadella’s tenure, software development teams
    could not share code within the company. He quickly removed that restriction as
    an act of empowerment. Nadella also encouraged the company’s employees to more
    intentionally explore emerging technologies regardless of their perceived linkage
    to Windows. He wanted to let great talent figure out how to make great things
    possible by loosening the restrictions placed on them.


    The ability to generate momentum is aided by leveraging short-term wins that demonstrate
    tangible accomplishments. Nadella reduced some of the organization’s anxiety regarding
    internal competition by eliminating the process that forced managers to designate
    a small percentage of their team as underperformers. He also moved to create partnerships
    with longtime competitors in service of expanding the company’s product portfolio.

