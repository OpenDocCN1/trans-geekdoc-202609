    # “艾豪威尔征草运动”


    尽管艾豪威尔本人并不情愿，或许部分也是因为如此，一场名为“征草艾豪威尔”的基层运动开始获得动力。来自各行各业的公民包括退伍军人、商业领袖和普通美国人，认为艾豪威尔是领导国家度过战后复杂时代的理想候选人。他们相信，他的领导能力、正直人格和无党派立场使他成为统一国家的独特人。几位影响力人物在“征草艾豪威尔”运动中发挥了至关重要的作用。其中包括著名的政治家，如参议员亨利·卡伯特·洛奇二爵，他认为艾豪威尔是共和党在
    1952 年选举手中击败民主党的最佳希望。洛奇与其他人一起组织了委员会和集会，为艾豪威尔的竞选争取广泛支持。


    ## 基层动员与支持


    激烈的基层动员开始了。支持者在全国范围内成立了“艾豪威尔竞总统”俱乐部，收集签名并组织集会以展示广泛的公众支持。尽管艾豪威尔对竞选缺乏兴趣，但报纸、广播节目和杂志仍被用来推销他作为候选人，强调他在第二次世界大战期间的领导作用以及为国家带来稳定与繁荣的潜力。富有影响力的政治家和公众公开支持艾豪威尔，为这一征草运动增加了信誉和动力。


    ## 艾豪威尔的决定


    艾豪威尔开始将总统职位视为他对国家服务的延续。他坚信，需要他的领导力来应对冷战、对抗共产主义并处理国内挑战。这种广泛的使命号召引起了他的爱国主义共鸣。共和党领导层向艾豪威尔保证他在执政期间拥有巨大的自主权，并获得实施其国家愿景所需的支持。


    1952 年 1 月，在经过亲信顾问和家人的反复考虑与鼓励后，艾豪威尔最终同意竞选总统。他宣布了自己的竞选并进入共和党初选，最终获得了提名。


    “征草艾豪威尔”的努力是实践中动力的非凡范例——这是一个罕见的案例，动力 `preceded` 了政治胜利，即通过说服合适的候选人加入战斗，而不是像通常那样由个人自愿加入并希望动力推行其竞选活动。


    # 退伍军人事务部的危机


    当鲍勃·麦克纳德在 2014 年接任退伍军人事务部（VA）部长时，他继承了一个深陷丑闻和功能失调的机构。VA 一直受到广泛管理不善和系统性失败报告的困扰，最显著的体现在退伍军人接受医疗护理的严重延误。有些人已经等待了几个月，甚至几年才能获得治疗。这种情况在
    2014 年 4 月达到，举报人揭露了菲尼克斯退伍军人医院的退伍军人在等待治疗期间去世，且 VA 员工通过操纵记录来掩盖漫长的等待时间。这并非涉及一个或少数坏人的孤立问题，而是通过伪造记录以使等待时间看起来比实际短的做法是普遍存在的。这种不诚实行为源于一种缺乏问责制或后果意识的文化。


    这些发现引发了巨大的公众和政治抗议。退伍军人团体、立法者和普通民众要求立即改革，VA 面临国会的严厉审查，并举行了多次听证会来调查问题并确定责任。媒体持续关注
    VA 的失败，确保改革压力一直保持在高水平。而在麦克纳德掌政期间，这种聚光灯从未如此明亮。


    # 鲍勃·麦克纳德的崛起


    鲍勃·麦克纳德并非直接跃升到高层领导职位——无论在宝洁工作的三十三年里，还是在美国陆军中都不是如此。相反，麦克纳德是一个层层晋升的典范，在被赋予应对下一个挑战之前，通过深度参与学习每一个角色。麦克纳德的职业生涯始于西点美国军事学院的学，，于
    1975 年毕业并获得工程学学位。


    麦克纳德在西点担任军官期间足够努力，获得了许多荣誉，并以班级前 2%的成绩毕业，但他第一份工作——陆军空游兵仍然是从基层做起的。他以中尉身份进入第 82 空降师。最终，他成为一个营的副作战官，在北极圈附近领导战斗训练。他在带领部队的同时成功获得了了
    `MBA`，在离开军队后，他在开始商业生涯时再次从最低职位做起。


    他于 1980 年加入宝洁，担任 `Tide`（汰灵）的品牌助理，这是一个入门级职位，让他获得了市场营销和广告活动的经验，随后被晋升为品牌经理，负责研究和管理市场表现。后来，麦克纳德被派往菲律宾，然后是日本。他在这些市场担任副总裁和总经理，在每个地区的挑战中承担了重要的领导职责。他回到美国担任全球织物护理总裁，随后被任命为机构首席运营官，接着是总裁兼首席执行官，最后成为董事主席。在他的领导下，宝洁的全球客户群增加了近十亿，在他担任
    CEO 的四年里，股价上涨了 60%。


    # 领导风格与改革


    换句话说，麦克纳德不仅领导过机构，而且工作在组织的每一个层面——这一特点在巴拉克·奥巴马总统任命麦克纳德负责其政府内最大的混乱的机构之一时，具有极大的吸引力。事实上，当麦克纳德到达
    VA 时，那里显然严重人手不足，特别是在医疗护理和行政支持领域。麦克纳德还注意到许多 VA 设施存在严重的领导真空，导致它们效率低下或陷入混乱。在最高层，也缺乏被授权的领导力来解决系统性问题并实施必要的改革。麦克纳德的第一步是开启“倾听之旅”，访问全国的
    VA 设施，直接从退伍军人和 VA 员工那里了解他们面临的问题。同时，麦克纳德强调问责制和透明度，承诺解雇任何被发现参与不当行为或失职的员工。


    他是实打的“仆人型领导者”模范，一种走在前方的领导者。麦克纳德建立这种领导力所需的信任的众多方法之一是公布他的私人电话。


    “当我成为 VA 的领导时，我需要建立信任。在危机中，领导者必须更加易于接触，”麦克纳德说，“有一个周末，一位退伍军人给我打电话，我把他推荐给了我们的自杀预防热线。据我记得，他们干预了，那位退伍军人现在还活着。我没有换过那个号码。我现在仍然接听。”


