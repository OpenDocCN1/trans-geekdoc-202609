    In addition to the real-time sampling, participants were sometimes asked to keep
    more detailed journals about their experiences, particularly those that involved
    deep concentration or enjoyment, to help identify patterns in how flow experiences
    occurred. Csikszentmihalyi analyzed the data from these logs and journals to identify
    common conditions that facilitated the flow state. He found that flow experiences
    often occurred when individuals were engaged in activities that were challenging
    but achievable, where they had clear goals and immediate feedback, and where they
    were fully absorbed in the task at hand.


    The insights gained from these detailed logs were crucial in shaping the concept
    of flow. Csikszentmihalyi was able to define flow as a state where individuals
    are so engrossed in an activity that they lose track of time and self-consciousness,
    finding deep satisfaction in the process itself. This ESM method not only was
    instrumental in developing Csikszentmihalyi’s “flow” but has since been widely
    applied in psychology, education, sports, and many other fields.


    Our research for this book also involved the solicitation of people’s thoughts,
    feelings, and experiences with personal and team momentum, via three alternative
    methods: in-depth interviews; targeted surveys of leaders in business, politics,
    sports, and the military; and large-scale, scientific surveys of the general public.


    In all of these surveys and interviews, we asked: “Does momentum exist?” A staggering
    number said yes, it does. This was the answer for 91 percent of the twenty-five-hundred-plus
    Americans we asked in random sample surveys, and for an even greater portion—99
    percent of the thousand coaches, business leaders, and National War College military
    officers we targeted in our surveys of leaders. There were, of course, a few outliers—including
    an ESPN statistician who argued vociferously that momentum is an artifact or fallacy
    rather than a real phenomenon. That said, our research found that the more groups
    or teams a person has been a member of, the more likely they are to state a belief
    in the realness of momentum. More on that later. For now, it’s clear that nearly
    everyone we contacted believed they had lived momentum in some context and perhaps
    fallen victim to it as well. Pressed to define momentum outside of a feeling,
    however, no uniform descriptions emerged. Our respondents offered diverse descriptions,
    with professionals in these four fields—politics, sports, the military, and business—providing
    particularly colorful ones of the phenomenon.


    Florida State University assistant basketball coach Stan Jones described momentum
    to us as a “competitive energy tsunami,” a powerful surge that propels a team
    forward, elevating their performance beyond expectations. In our talk with acclaimed
    leadership expert John Maxwell, he described momentum as the “great exaggerator,”
    magnifying existing currents and intensifying their impact. And perhaps most vividly,
    NBA champion assistant coach Kevin Eastman told us he thinks of momentum as a
    “force multiplier”—that momentum is “the force of energy, the force of enthusiasm,
    the force of *we’re coming at you*.”


    Defining momentum may be like trying to catch lightning in a bottle—it’s something
    you can feel, but it’s elusive when you try to put it into words. You can feel
    things shift, but it’s challenging to quantify or measure. The debate over momentum
    even served as the reason one major figure, legendary political consultant James
    Carville, decided to participate in this book. “Momentum is absolutely real. I
    think it’s a noble thing you’re doing in writing this book,” Carville said, before
    qualifying his reason for offering such a superlative. “I think it’s noble because
    you’re going to try to explain something and you’re going to fail, but I just
    don’t want you to fail too big.” He made it clear he was offering a little of
    his trademark sarcasm but was fascinated enough that he invited the authors to
    spend a day with him at his Virginia home.


    These individuals, at the pinnacle of their fields, share a visceral understanding
    of momentum through their firsthand experiences. Their ability to articulate its
    essence suggests that those who have been deeply immersed in the ebbs and flows
    of competitive environments are more attuned to its effects.


    These professionals weren’t coached or taught about how to describe momentum;
    rather, the largely common experience of this phenomenon led to a remarkably similar
    view: When momentum is happening, captured energy is released with a greater yield
    than expected.


    Momentum magnifies.


    While those at the tops of their respective fields may have seen and felt momentum
    in their personal lives more than the average person, in our surveys of American
    adults, more than eight in ten say they’ve experienced it firsthand too.'
