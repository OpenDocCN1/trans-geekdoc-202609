    She’d also spend time at home base conducting employee forums, where she’d go
    layer by layer spending time with leadership. “Tell me everything,” she would
    say. “How are you thinking about my joining? How are you thinking about our new
    mission? How are you thinking about where we are?” And the teams would let Johnson
    see through their respective lenses. “You have to go all the way through the director
    community, the manager community, and the individual contributor community to
    get the full story. And I started with really small groups, six to ten people,”
    she told us, eventually building up to forums that would include thirty to fifty
    employees at a time.


    Johnson would speak at these, too, in part to demonstrate vulnerability in order
    to build comfort and trust. “At first, when you’re a new CEO and you come in and
    you have, you know, six to ten directors, they’re like, I’m not gonna tell you
    what I’m actually thinking, like this is terrifying,” she said. “But you demonstrate.
    You know, you get in the right mindset; you get curious. You share mistakes you’ve
    made, you own up to it, and you try and create a space that encourages bravery,
    the courage to tell you the truth, to speak truth to power.” It isn’t always easy,
    and Johnson knows that going in—not easy on the employees, and not always easy
    on her.


    “They’re very courageous, and I always have to sort of like drink a tall glass
    of optimism before I go in, because I’m gonna get the truth. And the truth is
    hard. You know, our systems aren’t there yet. Our processes aren’t there yet.
    We’re in the middle of one of the more complicated corporate turnarounds in history.
    I believe deeply in my heart we’re gonna win, but it’s hard. And you have to be
    willing to hear the hard truths. Though you know `X`, `Y`, and `Z` are working
    well, `P`, `D`, and `Q` are still not. And you have to take your breath and say
    one thing at a time. Stay with me, guys, you know we’re gonna knock these things
    out. And they see the progress on one side, and then they get the courage to bring
    the next thing to you. But you know it can be, it could be, a little tiring and
    could be a little exhausting, right? But that’s how I do it. I have these forums
    where I do my deep dives.”


    After her initial and ongoing deep dives to continually understand, map, and interpret
    challenges, Johnson shared with us the ensuing elements of her turnaround strategy.


    1. **Give concise feedback:** Johnson’s personal life—her marriage and her athletics—have
    guided her approach to management. She never offers more than three things for
    someone to work on at any one time. “I don’t think you can work on more than three,”
    she shared with us. “Now, that said, if my senior leadership team were here, they’d
    be like, well, then, why are we working on five priorities. And it’s a good question.
    It’s fair. But we need to do those five things. So, yeah, I think three is the
    magic number for changing your own game. If you take five or seven priorities,
    whatever the number is, and you sprinkle them around the company, I hope that
    nobody does.”


    2. **Be vulnerable and optimistic:** Johnson would speak at these too, in part
    to demonstrate vulnerability in order to build comfort and trust. “At first, when
    you’re a new CEO and you come in and you have, you know, six to ten directors,
    they’re like, I’m not gonna tell you what I’m actually thinking, like this is
    terrifying,” she said. “But you demonstrate. You know, you get in the right mindset;
    you get curious. You share mistakes you’ve made, you own up to it, and you try
    and create a space that encourages bravery, the courage to tell you the truth,
    to speak truth to power.” It isn’t always easy, and Johnson knows that going in—not
    easy on the employees, and not always easy on her.


    3. **Get close to the story:** “They’re very courageous, and I always have to
    sort of like drink a tall glass of optimism before I go in, because I’m gonna
    get the truth. And the truth is hard. You know, our systems aren’t there yet.
    Our processes aren’t there yet. We’re in the middle of one of the more complicated
    corporate turnarounds in history. I believe deeply in my heart we’re gonna win,
    but it’s hard. And you have to be willing to hear the hard truths. Though you
    know `X`, `Y`, and `Z` are working well, `P`, `D`, and `Q` are still not. And
    you have to take your breath and say one thing at a time. Stay with me, guys,
    you know we’re gonna knock these things out. And they see the progress on one
    side, and then they get the courage to bring the next thing to you. But you know
    it can be, it could be, a little tiring and could be a little exhausting, right?
    But that’s how I do it. I have these forums where I do my deep dives.”


    4. **Be silly to disarm:** “I love scooters, right? And I had several of them
    in my office, and I use them to disarm people. I say, ‘Hey. You wanna go for a
    scooter ride around the office?’ and people are like, ‘Is she crazy?’ No. Actually,
    I am a little bit crazy, but if you’re riding around on a scooter, it is almost
    impossible to take yourself too seriously. And that’s the trick, right?”

