    \ tactic with communicating the truth didn’t always sit well with some on his\
    \ side. One mentor of Petraeus came to him, worried about what he described as\
    \ a “public relations problem” for the general. Petraeus’s response was incisive:\
    \ “Sir, this is not a public relations problem. This is a reality problem. And\
    \ once the reality truly does measurably change for the better, our communications\
    \ challenge will be much less, and ultimately it will go away.”\n\n*   **Lead\
    \ Implementation and Train for Excellence:** Successful leadership is not confined\
    \ to formulating ideas and communicating them. It extends to overseeing their\
    \ implementation. To Petraeus, this means leaders “being the example, the energy,\
    \ the inspiration . . . tracking the great people, keep developing them, and allowing\
    \ those not measuring up to move on to something else.” Petraeus exemplified this\
    \ by providing hands-on guidance to his team, tracking metrics rigorously, and\
    \ adapting strategies when needed. “There were events that we did several times\
    \ a week, to walk apatrol with a unit, somewhere in Iraq, at least twice a week,”\
    \ he said. “So I can actually see it for myself on the ground, which had the added\
    \ credibility, frankly, of sharing a little bit of risk and degree of hardship\
    \ with those soldiers who were endeavoring to secure and serve the Iraqi people\
    \ together with our Iraqi security forces partners.”\n\n    In other words, Petraeus\
    \ didn’t expect just his troops to integrate with the Iraqi people; he himself\
    \ did so too. This contributed to Petraeus’s personal rapport with his people\
    \ as well as his ability to more meaningfully understand their strategic position\
    \ and track and adjust course as needed.\n\n    But for every successful implementation,\
    \ adequate training must come first. In the military, there’s a structured and\
    \ institutionalized approach to professional development. “It’s not optional,”\
    \ Petraeus explained of the mandatory training that military personnel at all\
    \ levels undergo, including basic training, specialized training, advanced courses,\
    \ and impressive, sequential, professionalism programs. Petraeus recognizes that\
    \ few other government or civilian organizations can match what the military requires\
    \ of its people as far as training, and that smaller organizations particularly\
    \ struggle to allocate resources for it. While Petraeus lauds the benefits of\
    \ formal study to developing leaders, he recognizes this may not be possible for\
    \ all organizations to provide. “You can make up for this lack of formal study\
    \ by very extensive self-study,” he said, “by reading about others who have gone\
    \ before you and your profession, others generally, and in any major leadership\
    \ positions—you know, biographies, histories, and so forth.”\n\n    Research supports\
    \ this idea. For example, David Moynihan, Sanjay Pandey, and Bradley Wright concluded\
    \ that when leaders clearly articulate behavior expectations in terms of both\
    \ organizational and individual employee practices and insist on high levels of\
    \ performance in order to achieve organizational goals that clearly communicate\
    \ high but reasonable performance expectations, there’s a measurable increase\
    \ in employees’ understanding and confidence in their work.\n\n*   **Collect Data\
    \ and Refine Through Feedback:** This leads to the final task, which to Petraeus\
    \ is too often overlooked: refining the big ideas. Petraeus explained this task\
    \ as the process of “sometimes adding new big ideas, sometimes discarding some,\
    \ sometimes modifying or adapting. . . . And then you do it again and again and\
    \ again.” This ongoing process of refinement ensured that the strategy remained\
    \ agile and responsive to changing circumstances. How did Petraeus refine? Through\
    \ the careful monitoring of objective, key indicators like high-visibility attacks,\
    \ sectarian violence, and civilian casualties due to this violence. By relentlessly\
    \ focusing on these metrics and adapting strategies accordingly, he started to\
    \ see signs of progress. “For momentum to be meaningful,” Petraeus said, “it has\
    \ to be real, it has to be fact based, it has to be, again, shown through objective,\
    \ rigorous metrics.”\n\n    The Army’s *Doctrine Publication *3-0*, Operations*\
    \ articulates the concept of seizing, retaining, and exploiting the operational\
    \ initiative, which is the military’s focus of gaining momentum. Part of the concept\
    \ highlights how “effective information management to process information quickly\
    \ is essential for staying inside the enemy’s decision-making cycle. Combined\
    \ with effective planning, information management helps commanders anticipate\
    \ enemy actions and develop branches, sequels, or adjustments.”\n\nPetraeus recognized\
    \ that military efforts alone would not bring lasting stability to Iraq. He worked\
    \ to facilitate political reconciliation among Iraq’s various sectarian and ethnic\
    \ groups, particularly between Shia and Sunni militias. And, through all of this,\
    \ he made good on his promise of unprecedented transparency in communications\
    \ to world audiences.\n\n“By the six-month mark, our casualties were now coming\
    \ down very significantly. Iraqi casualties were down. But the major indicators\
    \ of the success, the growing momentum of this campaign, were really quite clear.\
    \ And those, again, were overall attack numbers, the sectarian violence numbers,”\
    \ Petraeus said. He brought in data experts from various intelligence agencies\
    \ to support the collection of metrics, to challenge the data collected, and to\
    \ resolve discrepancies. Violence had decreased more than 90 percent. It began\
    \ to look not just possible but probable that Iraqis would be able to achieve\
    \ self-governance."
