    This was an overwhelming undertaking. It is estimated that McDonald proposed the
    removal of more than nine hundred employees during his first two years in office.
    This included the replacement of senior leaders within the VA and appointing new
    directors at some of the most troubled VA facilities. Recruiting for these roles—both
    in mass and for specific, niche roles—was not easy. Many new, talented people
    were brought in, but one new hire, in particular, stood out to McDonald: David
    Shulkin, recruited to serve as undersecretary for health, a critical role overseeing
    the Veterans Health Administration. Shulkin was a physician with extensive experience
    in health care management—described as one of the “high priests” of patient-centered
    care and the type of executive who would walk the floors of his hospitals on night
    shifts to ensure proper care was being given.


    McDonald recognized in Shulkin qualities that made him an ideal candidate for
    helping transform the culture of the organization. For starters, Shulkin had a
    collaborative style and an exceptional ability to work effectively with different
    types of people, including health care professionals, policymakers, and veterans
    themselves. McDonald saw Shulkin’s humility and compassion—an empathy that extended
    to veterans and their families. He would go the extra mile to understand individual
    concerns and needs, and he valued transparency in both his personal conduct and
    in the process through which he’d make decisions. Despite his high rank, Shulkin
    was approachable and grounded. He was hands-on and, like McDonald, a team player.


    Recruiting one’s successor may be one of the great acts of professional humility,
    and in McDonald’s selection of Shulkin, this, too, was true. Shulkin went on to
    become secretary of the VA, continuing McDonald’s legacy.


    “Life is a series of starting over,” McDonald told us. “Life is a series of chapters,
    and you as an individual have to have confidence in yourself that you aren’t afraid
    to start over.”


    Amy Howe, CEO of FanDuel, perhaps said it best in our interview on leadership
    and momentum. “The most important thing for me was to make sure that I could build
    the best leadership team around me,” Howe shared, describing how she’d recruited
    from within the ranks of her company—many who had been there since before sports
    betting was even legal—while looking to identify where they needed to bring in
    some new talent to the organization. “It doesn’t matter how good I am; I don’t
    scale as an individual.”


    ## Leader Actions


    The Pareto principle (also known as the 80/20 rule) is a phenomenon that states
    that roughly 80 percent of outcomes come from 20 percent of causes. Frequently,
    the principle is discussed in the vein of understanding one’s most important customers
    and the revenue they provide. Yet there is a body of research that suggests the
    80/20 rule also has implications for organizational talent. Finding the “right”
    people who possess the required capabilities and buy in to your principles is
    essential. Such people will drive the organizational actions required to foster
    and seize momentum.


    ### ACTION 1


    Identify your most critical roles and ensure you get the right people in those
    seats.


    A 2017 McKinsey Insight article encouraged leaders to “focus on the 5 percent
    who deliver 95 percent of the value.” Certain roles play a far larger part in
    generating organizational success than many others. Here is an example of this
    concept from the McKinsey article: “Let’s consider American football. If you asked
    people who is the most highly paid player on a team, they would correctly say
    the quarterback, the key person in the vast majority of plays. People would probably
    say that the second most highly paid player was the running back or the wide receiver,
    since they work directly with the quarterback to advance the ball. These people
    are wrong. It’s the relatively unnoticed left tackle, who protects a right-handed
    quarterback’s blind side from things he can’t see and could injure him.”


    ### ACTION 2


    Ensure your onboarding process is comprehensive and geared around the actual work
    to be performed.


    Great onboarding helps your new team members learn about the company’s culture
    and prepare for their employment. It also includes a plan of performance expectations
    for their first few months, which helps them focus and create momentum in their
    discrete roles.


    ### ACTION 3


    Routinely evaluate the effectiveness of your recruitment process.


    Continually seeking to refine your team’s ability to find the right talent is
    of the utmost importance. Merely mimicking the actions of how other organizations
    recruit talent will not ensure great outcomes for your team. Routine and rigorous
    examination of your process will help immensely to enhance it.


    ## Preparation


    When we rang Buzz Williams at 9:00 a.m. on a Wednesday morning, it was already
    midday for the famed basketball coach. He had already completed the Wednesday
    version of his daily workout routine—the days where he begins outdoors. It was
    a habit he started following his second year of coaching at Marquette right after
    he landed himself a three-day stay at the Mayo Clinic at the end of the season.
    Batteries of tests showed nothing specifically wrong with Williams—just the compounded
    effects of not sleeping right, not eating right, not handling stress.


    He started figuring out what would work, and by the time he was named head coach
    at Virginia Tech, the wellness regimen was well established.


    “I’ll be in here every morning at 5:00 a.m.,” Williams told his players and staff
    about the gym, and then he told us about how he made good on that promise. “I
    haven’t missed a day. However many years, no matter what, no matter what, I don’t
    miss a day. When we go on the road, we spend the night in a hotel. The next morning,
    we go to a local privately owned gym. And we train. That’s our ‘get better’ group.
    We take a picture of it and post it on social media. So we’ve created some traditions
    relative to our health, relative to our fitness. And I think that the players
    know it’s serious to me, because I do the same thing they do. I have the same
    cycle in the weight room that they do. So I have a pretty good feel for what their
    body’s going through.”


    From this level of self-discipline it should be no surprise, then, that Buzz Williams
    approaches the training and preparation of his team in a way few other coaches
    have endured. Also rare is that Williams explicitly weaves the concept of momentum
    into his team’s training, a feature that reflects not only the belief that momentum
    is real, and tangible, but that it can be prepared for—or even that preparation
    can make it happen.


    Williams coined his model `Time, Score, Momentum`(TSM) and walked us through how
    this works.


    “Time” refers primarily to the management of the game clock. This involves strategic
    use of time-outs and substitutions to maximize efficiency and effectiveness during
    the game, and it requires a deep understanding of when to speed up or slow down
    the game based on the situation, opponent, and flow.


    “Score” means constant awareness of the score and using this data to influence
    decision-making. This includes knowing when to play aggressively or conservatively
    and identifying and capitalizing on high-percentage scoring opportunities while
    minimizing low-percentage shots.


    Finally, “Momentum” requires the ability of players to recognize shifts in energy
    during the game and to make strategic moves to either sustain positive momentum
    or halt negative swings. This requires the maintenance of high levels of focus
    throughout the game, with players staying mentally engaged and resilient, especially
    during critical moments.

