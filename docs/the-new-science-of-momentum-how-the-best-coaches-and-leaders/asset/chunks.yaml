    # 引言


    在 2017 年 2 月的超级碗 5 决赛（Super Bowl LI）第一节，尼尔森公司估计全球有两亿观众正盯着电视，准备观看当年最受关注的体育赛事。到了第三节，近一半的观众已经离开了。亚特兰大法鹰队正肆情击着热门的新英人队，除了佐治亚州首府之外，很少有人想看一场一边倒的比赛。


    在整个上半场，法鹰队的一切都顺风顺利。相反，新英人的表现并不好看看，四分卫 `Tom Brady` 被多次擒杀，向空旷的接手员传传球，这对一支由 `Bill
    Belichick` 带领的球队来说是噩梦——他们犯了一些愚蠢的错误，例如在传球给跑锋 `LeGarrette Blount` 时掉落球，法鹰队随后便将其转化为得分。即使法鹰队在半场最后七分钟出现失误，那支可怜的爱人队也只得到了一个射球得分。三分分。这就是火力十足的新英人进攻组在比赛的前三十分内获得的所有得分。


    “在橄榄球赛中，你总是为了我们所谓的‘下半场转折’而战，”新英人队的角卫 `Devin McCourty` 在本书的采访中说道，“你希望在半场结束前拿到球并得分，然后在下半场开始时再次拿到球并得分。你掌控了比赛的势头，另一支球队觉得他们完蛋了。对于我们那场比赛来说，情况完全反相反。”


    法鹰队从更衣室出来后再次得分，在第三节中段以 28 比 3 领先新英人队。“如果你是新英人队的球迷，这不是你想看到的，”解说员 `Joe Buck` 说道，此时镜头推向了坐在场场边面无表情的
    `Belichick`。


    不，那不是。


    “我坐在场场边，心里对自己说：你们正被丢得不成脸，”`Brady` 多年后回忆道，“出去做点什么吧。让我们至少拿一个达阵得分。”


    随后，新英人队获得了一个小胜利。在第三档需要 8 码的情况下，`Brady` 被迫离开口袋——这对于新英人的球迷来说总是个不安的时刻——但他灵活地冲跑获得了一码首攻。几次进攻之后，他将短传传给跑锋
    `James White` 获得达阵得分，比分追为 28 比 9。观众欢呼起来，但此时看来，结果似乎已定局。新英人队错失了额外得分，但至少比分看起来体面了一些。


    “一旦我们得分，我要求防守组只要守住一次，就只要一次，”`Brady` 说。“他们做到了，然后我们推进了球场并踢了一个射球得分。”当时比赛还剩 9 分 44
    秒。“我看着比分板说，只差两个回合。”


    仅仅一多分钟后，在亚特兰大队 28 比 12 领先的情况下，法鹰队的四分卫 `Matt Ryan` 后撤准备传球，被新英人的线卫 `Dont’a Hightower`
    擒杀，导致 `Ryan` 掉球。新英人队在法鹰队的 25 码处抢回了球。


    “`Dont’a` 的那次掉球擒杀是你可以感觉到局面转折的时刻，”`McCourty` 说，“在那个时刻，我们互相看着彼此说：‘我们能赢这场比赛。’攻防两端的球员开始发力，源于我们从那次进攻中获得的能量以及站在我们边的信念。”


    “你感受到了，”`Brady` 说，“我们有了劲头。那些小小的胜利正像雪球一样滚越越大。”


