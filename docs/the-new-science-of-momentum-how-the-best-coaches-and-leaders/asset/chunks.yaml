    Two contemporary, high-profile examples of campaign autopsy reports were unveiled
    by Republicans in 2012 following Mitt Romney’s defeat to Barack Obama and by Democrats
    in 2016 following Hillary Clinton’s loss to Donald Trump. The Republican National
    Committee’s 2012 “Growth and Opportunity Project” was a comprehensive review to
    understand their loss. This report highlighted the party’s need to appeal to a
    broader demographic, including minorities, women, and younger voters. It criticized
    the party’s messaging and called for changes in communication strategies, particularly
    in engaging with Latino voters. The report also emphasized the importance of modernizing
    campaign infrastructure and technology.


    Similarly, the Democratic National Committee’s post-election analysis pointed
    to a range of issues, including the overreliance on data analytics over traditional
    campaign strategies, failure to adequately address economic anxieties in key swing
    states, and challenges with voter turnout. The report also critiqued the party’s
    messaging and outreach efforts, particularly in the Midwest. The findings sparked
    a significant debate within the Democratic Party about its direction, messaging,
    and strategy, contributing to shifts in leadership and approach in the subsequent
    2018 midterm elections—successfully so.


    The DNC’s 2016 autopsy report directly contributed to the party’s investment in
    grassroots efforts, particularly in swing districts within states. This included
    expanding voter outreach, building local campaign infrastructures, and engaging
    more directly with communities. There was a significant push to energize and mobilize
    volunteers, which helped boost voter turnout and engagement in the 2018 midterms.
    The emphasis on grassroots organizing was a key factor in flipping many Republican-held
    districts.


    Further, the report highlighted the need for the party to better communicate its
    economic message and address the concerns of working-class voters, particularly
    in the Midwest. For the 2018 midterms, Democrats honed their messaging around
    health care, the economy, and holding the Trump administration accountable, which
    resonated with a broader base of voters. The focus on health care, in particular,
    proved to be a unifying issue that helped Democrats win over voters in critical
    districts.


    Finally, the 2016 report had pointed out deficiencies in the party’s use of technology
    and data analytics. In response, the DNC invested in upgrading its technological
    infrastructure, improving voter data management, and employing more sophisticated
    data analytics for targeting and mobilization. This technological boost helped
    campaigns at all levels run more efficiently and effectively, resulting in better
    tools for voter engagement, including more targeted digital advertising and more
    efficient voter outreach efforts.


    The party’s investment in the postmortem—and in their willingness to receive highly
    critical feedback—paid off. In 2018, Democrats were able to flip forty-one House
    seats from Republican to Democrat, regaining control of the House of Representatives.


    # Leader Actions


    Douglas Stone and Sheila Heen’s book, *Thanks for the Feedback*, characterized
    feedback as a “two-way flow that is part of every interaction.” Subsequently,
    they identified that three primary types of feedback are involved in the flow:
    appreciation, coaching, and evaluation. When seeking to foster momentum, leaders
    will have to provide all three types of feedback and receive them as well. Most
    importantly, leaders are well advised to not view providing feedback as a “commonsense”
    practice. Learning how to properly deliver and receive feedback is an important
    skill set. Feedback influences the ability to foster momentum by enhancing learning
    or reinforcing/modifying behavior.


    ### Action 1


    Provide feedback with a purpose.


    It is important to “start with the end in mind.” What type of feedback are you
    intent on providing? What are you seeking to influence?


    ### Action 2


    Provide feedback with empathy and compassion.


    It is possible (and important) to address challenging situations well. Remember,
    you manage things but lead people. Treating them with respect is fundamental.
    Situations where you are trying to generate positive momentum or reverse negative
    momentum are generally characterized by higher-than-average levels of anxiety.
    Effective leaders harness the components of emotional intelligence (that is, self-awareness,
    self-regulation, motivation, empathy, and social skill) to manage themselves and
    create good habits.


    ### Action 3


    Understand the feedback “triggers” when you are receiving them.


    Leaders absorb stress when seeking to foster momentum. Additionally, they do not
    always accept nonconfirmatory feedback from their teams as being valid. Stone
    and Heen detailed three reasons, or “triggers,” that can negate our willingness
    to accept feedback.


    - **Truth triggers**: These are triggered by the content of the feedback itself,
    such as when it’s untrue, unhelpful, or wrong. In response, people may feel exasperated,
    wronged, or indignant.

    - **Relationship triggers**: These are triggered by who gave the feedback and
    the relationship the recipient has with them. For example, people may react differently
    to feedback from people they like.

    - **Identity triggers**: These are triggered when someone feels threatened by
    the feedback.


    There are multiple techniques leaders can leverage to overcome the triggers (for
    example, ask for clarification, focus on the content, manage your emotions, and
    look at the situation systemically).


    ## 13


    ## When When Mo Is Against You


    You know those moments, though few wish to remember them. Those times when walls
    are closing in and everything is spiraling downward. It’s the opposite sensation
    of the lightness, the *flow*, of momentum—but rather it’s the sharp knife of when
    Mo is working against you or your team. During these times, the air thickens,
    steps feel heavier no matter how fast you try to move. The weight of failure presses
    from all directions, and you might question every decision you’ve made. The foreign
    yet familiar voice of failure whispers in your ear, sometimes sounding like your
    own voice, and doubt clouds your thoughts. The horizon gets farther and farther
    away.


    These are the moments when a comeback might feel the hardest to contemplate. And
    yet—according to one person who might know more about turnaround than anyone else—these
    are the very moments where the path to fixing things is actually the *easiest.*


    “I always like taking things on that are really, fundamentally broken,” Greg Brenneman
    told us in a powerful interview about his experiences tackling the monster of
    Mo. Brenneman, a turnaround expert who has led companies like Continental Airlines
    and Burger King out of dire situations, knows this better than anyone. “Organizations
    that need a turnaround are much easier than organizations that are satisfactorily
    underperforming,” he shared with us, and quickly, a view that had seemed paradoxical
    moments before now seemed clearer. “This is because, in a real crisis, everyone
    acknowledges the problem, and there’s no resistance to change.”


    At Continental, where delays, lost luggage, and poor customer service were the
    norm, Brenneman walked into a situation where everyone knew it was bad—and that’s
    where he thrived, which meant that the door was open to radical change.

