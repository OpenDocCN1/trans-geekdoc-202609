    Political momentum is often focused on candidates, issue politics. But the organizations
    behind social change face similar dynamics. Over the past few decades, marijuana
    access in the United States has undergone a remarkable transformation. What began
    as limited allowances for medical use or low-THC products in a few states has
    grown into a nationwide shift, with more than two-thirds of states now permitting
    medical marijuana use and nearly half allowing recreational use. As of 2024, twenty-three
    states have legalized adult recreational marijuana, representing a significant
    expansion from just two states, `Colorado` and `Washington`, that pioneered recreational
    legalization in 2012. This rapid change reflects evolving public attitudes, growing
    acceptance of cannabis for both therapeutic and recreational purposes, and the
    increasing recognition of its economic potential. The expansion has raised important
    questions about regulation, public health, and the social impact of legalization,
    setting the stage for a future where marijuana could be federally legalized.


    This shift, while it may look organic from afar, was very much the result of a
    concerted effort toward change. Research by our friend, health policy consultant
    `Tamara Demko`, provided us a unique look into how advocates in one state, `Florida`,
    prepared for and achieved a transformational shift in cannabis policy.


    ### The Road to Legislative Reform


    In the years leading up to the passage of `Florida`’s 2014 medical cannabis legislation
    (`SB 1030`), marijuana reform advocates worked—sometimes diligently, sometimes
    in disarray—to prepare for a moment of opportunity. Trial and error was matched
    with tenacity, and over time, cannabis advocates laid an effective groundwork
    based on strong leadership and strategic communications that positioned the issue
    as ready for a “spark” when it arrived.


    `Demko`, a Harvard-educated health policy attorney and registered nurse, holds
    a PhD in public health and had a front-row seat to how this unfolded, both as
    a professional within `Florida`’s political process and in her academic research
    that included extensive informant interviews, surveys, literature reviews, and
    data analysis.


    “Prior to 2014, there was no shortage of efforts to open up `Florida`’s then highly
    restrictive marijuana laws, but roadblocks appeared at every turn,” she told us.
    “Marijuana reform advocates had long observed that public opinion on medical cannabis
    was shifting, both nationally and within `Florida`, but there was no clear path
    forward for legitimate policy reform.”


    ### Organizing and Recruitment


    In response, advocates began to organize, building from loose coalitions of like-minded
    people and organizations into more structured entities. They recognized that the
    first step toward big change would likely be seen in the form of incremental progress
    and began to focus on alliances with sympathetic stakeholders and proponents of
    medical cannabis—particularly for the treatment of serious illnesses like epilepsy—which
    promised broader appeal. They recruited lawmakers—key legislative champions—who
    could shepherd the issue through the state’s political machinery.


    While in business, sports, and the military, it’s leaders (CEOs, coaches, officers)
    who recruit team members, in political efforts, it’s often the opposite. In politics,
    advocacy groups and other coalitions have to recruit leaders—bill sponsors, legislative
    allies, and even political candidates—to carry their issues.


    “In `Florida`, the medical marijuana movement had to find the right people, the
    key legislative champions, who could shepherd the issue through the state’s political
    machinery,” `Demko` shared. These leaders had to be not only from the party that
    was in control but from key districts within the state, with strong relationships
    not only within the legislature but with the executive branch too. After all,
    no legislature in the United States is immune from executive veto, and even highly
    successful legislative efforts run this risk.


    ### Leadership and Strategic Communication


    “Strong leadership was essential in driving this momentum forward,” `Demko` explained.
    “Key figures in the movement, including legislators from both parties, took up
    the cause. Republican legislators like Senator `Rob Bradley` and Representative
    `Matt Gaetz`, both prominent figures in `Florida`’s conservative political sphere,
    emerged as champions of the medical cannabis bill. Their sponsorship of `SB 1030`
    was instrumental in moving the bill forward, as their leadership reassured more
    hesitant members of the legislature that the bill was both politically viable
    and morally sound.”


    With leaders identified, targeted communication began with different stakeholders,
    including with legislators, health care professionals, and the public. Public
    opinion polling, some of which included message-testing experiments, provided
    feedback to advocates about which types of narratives worked, and which didn’t,
    in persuading anti-marijuana voters to change their minds. Through this type of
    feedback and more, advocates framed the issue as one of compassion, highlighting
    cases like that of `Charlotte Figi`, a child with epilepsy whose seizures were
    alleviated by a strain of low-THC cannabis. This narrative was essential in generating
    empathy and reducing opposition, as it reframed the conversation away from recreational
    marijuana and toward the health and well-being of vulnerable children.


    ### The Turning Point


    The true turning point for marijuana reform in `Florida` came in 2014, when a
    constitutional amendment on medical marijuana was proposed for the November ballot.
    This amendment, if passed, had the potential to reshape `Florida`’s political
    landscape, particularly by mobilizing Democratic voters in what was expected to
    be a tight gubernatorial race. Republican lawmakers, concerned about the potential
    electoral impact, saw the passage of `SB 1030` as a way to address the growing
    demand for medical cannabis reform while maintaining control over the issue.


    Advocates were prepared for this moment. They had already laid the groundwork
    with legislative champions, built coalitions, and framed their message in a way
    that resonated with both the public and policymakers. When the threat of the constitutional
    amendment emerged, they were able to leverage this political urgency to advance
    their bill. By positioning `SB 1030` as a more controlled, narrowly focused alternative
    to the broader constitutional amendment, advocates were able to convince lawmakers
    that passing their bill was the best way to retain legislative control over the
    issue while addressing public demand.


    The CNN documentary featuring `Charlotte Figi` provided the emotional spark that
    advocates needed to push their cause over the line. The story of a young girl
    whose life had been dramatically improved by medical cannabis resonated deeply
    with the public and legislators alike. Advocates quickly capitalized on this media
    attention, using it to reinforce their message of compassion and urgency. This
    public narrative helped overcome opposition by shifting the focus away from drug
    users and toward innocent children in need of medical help.

