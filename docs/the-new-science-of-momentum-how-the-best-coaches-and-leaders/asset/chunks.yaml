    ##### Leader Actions


    Edgar Schein once said, “The only thing of real importance that leaders do is
    to create and manage culture.” Sociologists generally highlight that culture consists
    of the values, beliefs, systems of language, communication, and practices that
    people share in common and that can be used to define them as a collective. Consequently,
    how teams will respond to environmental stimuli is a function of how they’ve been
    acculturated to behave. It is important to understand that culture is “leader
    business,” and approaching it with intentionality is critical.


