    company recovered nearly all the value lost in a matter of weeks.


    ##### Leader Actions


    The *Oxford English Dictionary* defines *preparation* as “the action or process
    of making ready or being ready for use or consideration.” It is important to distinguish
    between the actions taken to accomplish the mission and those taken to prepare
    for executing those actions.


    1. Focus primarily on building task cohesion.


    Task cohesion refers to how well a team can work together in order to achieve
    common goals, tasks, or achievements (Schneider, Gruman, & Coutts, 2012). Conversely,
    social cohesion refers to the degree to which members of a team like each other
    and interact accordingly (Richardson, 2013). Research indicates that the influence
    between the different forms of cohesion is bidirectional. But task cohesion has
    a stronger influence on social cohesion rather than the other way around. The
    implication of the relationship is that leaders are well advised to lean into
    learning what it takes to collectively perform the work well more so than primarily
    focusing on building strong bonds first.


    2. Create realistic experiences to set the conditions for how you will “meet the
    moment.”

