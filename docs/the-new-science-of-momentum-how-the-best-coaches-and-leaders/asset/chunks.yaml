  trans: '


    情绪感染对团队表现的影响是深远的，并且可能涉及积极和负面情绪。积极的情绪感染可以增强团队凝聚力，并导致更高水平的合作、更好的问题解决能力以及动机动力。这在组织环境中尤为相关，因为领导者营造的情绪和情感基调会渗透并影响整个团队的表现（Hennig-Thurau
    et al., 2006）。例如，在关于职场动态的研究中发现，领导者表达的积极情绪可以显著提高团队的士气和表现（Hennig-Thurau et al.,
    2006）。另一方面，负面情绪感染会导致压力增加和生产力下降。如果不加控制，负面情绪感染可能导致冲突、动力下降以及整体生产力削弱。临床环境的研究表明，负面情绪的传播会加剧患者和护理人员抑郁、焦虑等心理健康问题（*Journal
    of Business and Psychology* 2011）。


    ## 情绪感染的机制


    情绪感染通过几种机制促进。其中关键之一是一种被称为`mimicry`（模仿）的过程，个体无意识地模仿他人的情感表达，从而导致共同的情感体验。有趣的地方在于：这个过程在很大程度上是自动的，可以在没有意识的情况下发生。研究表明，当人们观察他人表达情绪时，他们倾向于模仿这些表情，这随后会在体内触发类似的情感状态（Hatfield,
    Cacioppo & Rapson 1994）。


    几个因素会影响群体内部情绪感染发生的程度。情绪表达的强度和频率起着至关重要的作用。更强烈、更频繁的情绪展示更容易具有传染性。社会背景和个体之间的关系关系。在关系紧密的群体或团队中，由于成员之间存在更强的人际纽带和更大的共情能力，情绪感染更加显著（*PNAS*
    2014）。有趣的是，沟通媒介也会影响情绪感染。虽然传统研究集中于面对面的互动，但研究表明，情绪感染也可以发生在在线环境中。例如，对 Facebook 等社交媒体平台的大规模研究证明，状态更新中表达的情绪可以影响他情绪，即使没有直接的物理互动（*PNAS*
    2014）。


    ## 个体敏感性


    对情绪感染的敏感性在个体之间也存在差异。某些人天生比其他人更容易敏感，这并不意外，研究已经阐明某些人格特质会使个体更容易受到情绪感染。例如，高水平共情能力的人或对社交线更敏感的人通常更容易受到。相反，具有反社会人格等特征（以低共情为特征）的个体不太经历情绪感染（*PLOS
    ONE* 2021）。


    ## 对 Jaime Pineda 的采访


    在马可·伊亚科波尼（Marco Iacoboni）南方约两小时四十分钟的地方，神经科学家 Jaime Pineda 坐在加州大学圣地亚哥分区的办公室里。与
    Iacoboni 一样，Pineda 的研究对镜像神经元、意识和共情的理解做出了巨大贡献，这两位科学家甚至合作过了一些研究。我们想要进一步了解情绪感染，特别是共同的情感体验如何影响团队表现。Pineda
    不确定自己能为我们提供什么内容。


    “我不确定能和你们分享多少，或者什么东西是有用的，但我乐意这样做。”当我们按下`RECORD` 开始采访时，Pineda 这样说道。他的谦逊令人钦佩，但他的预测完全失误了——在短短二十三分钟内，Pineda
    提供了很多发人深省的内容，并且可以进一步付诸行动。


    如果你记得，当个体执行一个动作以及观察他人执行相同动作时，镜像神经元都会激活。这种镜像机制是共情和社会纽带的基础，因为它允许个体对他人的情感产生共鸣。根据
    Pineda 的说法，镜像神经元对社会和环境的线索非常敏感。我们询问镜像神经元在观察朋友或同事取得成功，与观察另一个团队的成员或电视上的人之间之间是否有所区别，Pineda
    认为确实如此。


    “证据表明，镜像神经元确实根据熟悉程度而不同，”他说，“如果你熟悉某人，你倾向于比面对陌生人更多地模仿他们。通常，文献显示，对于任何和你一样、和你相似的人，我们倾向于比模仿那些不像我们的人更多。”


    ## 镜像神经元与 mu 波抑制


    镜像神经元的活动可以通过被称为`mu suppression`（mu 波抑制）的过程来测量。`mu`节律是一种脑电波，当个体参与或观察运动时幅度会降低，为镜像神经元的活动提供了生物标志物。研究表明，`mu
    suppression` 与镜像神经元的激活有关，因此是研究情绪感染的可靠指标。当个体参与共同任务时，这些脑节律会同步，表明存在有效的沟通与协作。


    Pineda 解释说，同步的大脑活动对于工作记忆和注意力等认知功能至关重要，在团队动态的背景下，团队成员之间同步的大脑活动可以增强合作和集体表现。例如，研究显示，神经同步水平较高的团队在需要严密协调和沟通的任务中表现更好。


    “当大脑变得同步时，可以这样类比，即这两个大脑正以某种我们还完全不知道的方式以某种方式进行交流，”Pineda 详细解释道，“我们的研究显示，工作记忆等事物会受到大脑某些部分同步程度的影响，例如`frontal
    cortex`（额叶皮层）需要同步才能拥有更好的工作记忆。”


    ## 心理动力与领导力


    显而易见，情绪感染会导致团队内部产生心理动力。这种动力的特征是集体效能感和动力，它推动团队实现目标。Pineda 向我们强调，营造积极的情绪环境对于触发这种动力至关重要。领导者和团队成员通过展示热情、支持和共情来促进积极情绪感染，反过来也能激励整个群体。此外，他分享说社交连接的渴望在情绪感染中起着重要作用。当个体渴望与他人联系并共情时，他们更有可能参与模仿行为。这种社会纽带可以放大群体内的积极情绪，导致动力和表现的自我增强循环。


    这些发现建议了几种利用情绪感染建立团队动力的实用方法。这些包括：


    *   设定积极预期：建立积极的愿景和明确的目标可以激励团队成员并培养共同目标感。

    *   促进好奇心和共情：鼓励团队成员彼此保持好奇和共情可以加强社会纽带并增强情绪感染。

    *   利用神经反馈：实施神经反馈技术可以帮助个体同步大脑活动，从而改善认知功能和情绪调节。

    *   鼓励冥想：冥想等活动可以诱导同步的大脑状态，促进团队放松并减轻压力。


