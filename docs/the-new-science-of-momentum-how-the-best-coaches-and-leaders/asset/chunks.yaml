  raw: 'When we first sat down to speak with Commander Alexander P. Armatas, he was
    the commanding officer of the Blue Angels for the 2023 and 2024 air show seasons.
    Originally from Skaneateles, New York, Armatas has had a distinguished career
    in naval aviation. He graduated from the United States Naval Academy in 2002 with
    a degree in aerospace engineering and earned his wings in 2005. Before taking
    command of the Blue Angels, Armatas served as the commanding officer of Strike
    Fighter Squadron 105 (VFA-105), also known as the “Gunslingers.” His leadership
    experience includes multiple deployments aboard aircraft carriers in support of
    various operations, such as Operation Freedom’s Sentinel. Armatas had accumulated
    more than four thousand flight hours and more than nine hundred carrier-arrested
    landings when we spoke. And beyond a tally of these flight hours—and of particular
    interest to our discussion of team dynamics and momentum—Armatas had led and participated
    in countless hours of debriefs with his teams, the feedback sessions that follow
    each show. These debriefs often last longer than the event being briefed. While
    a Blue Angels show may last forty-five minutes, the debriefs last anywhere from
    one hour to seven. And while the cheering crowds on the grounds offer nearly unanimous
    positive feedback for the great feats they just observed, the Blue Angels debrief
    sessions focus almost exclusively on what went wrong.


    “That’s how we operate,” Armatas told us. “We don’t have time to pat each other
    on the back and talk about all the good things. And we did enough things wrong
    that that’ll take up plenty of time on its own. So that’s where we focus; we focus
    on improving on the stuff we did wrong and accepting that the stuff we did right
    we’re going to do right again, which is important as well.”


    Armatas knows that these things change too—that something that went well on one
    show may go poorly in the next. There’s so little room for error that feedback
    must be equally clear. After all, these pilots fly within eighteen inches wingtip-to-wingtip
    of one another at speeds up to seven hundred miles per hour during high-speed
    passes.


