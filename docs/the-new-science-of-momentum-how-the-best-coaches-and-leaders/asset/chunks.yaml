    ### Why a Model and Not a Formula?


    If you’ve picked up this book, it’s likely you’ve read other texts relating to
    leadership, business theory, or team building. It’s also likely you’ve seen guides
    that offer a “recipe for success” or a “blueprint for action” that promise leaders
    that if they follow a certain script, they can expect a certain result.


    Indeed, that’s what most formulas promise: You plug your own content in, and those
    inputs will generate an expected result.


    In various fields of study, from mathematics and science to economics and engineering,
    the terms *formula* and *model* are frequently used. Although these terms might
    seem interchangeable at first glance—and often are in popular speech—they represent
    different concepts and serve distinct purposes in the analysis, interpretation,
    and understanding of complex systems.


    Formulas are ubiquitous in science and engineering. In physics, for example, Newton’s
    Second Law of Motion is expressed as *F = ma* where *F* represents force, *m*
    represents mass, and *a* represents acceleration. This formula precisely quantifies
    how much force is needed to accelerate an object of a given mass. Formulas are
    typically more straightforward, focusing on a single relationship at a time.


    In contrast, a model is fundamentally a simplified representation of a real-world
    system, process, or concept. It is a tool used to explain, predict, or understand
    how different components of a system interact with one another. Their primary
    purpose is to help practitioners make sense of complex phenomena by breaking them
    down into more manageable components.


    For instance, in economics, a model might represent the relationship between supply
    and demand in a market. This model might include various factors such as price,
    consumer behavior, and production costs, all of which interact in complex ways.
    By simplifying these relationships into a model, economists can predict how changes
    in one variable, like a price increase, might affect the overall market.


    No model is a perfect representation of reality; instead, it is a useful approximation
    that helps us navigate and make decisions in the real world.


    Models provide the broad framework for understanding complex systems. They aren’t
    plug-and-play like formulas are, and they are by design an overgeneralization
    that can be applied to multiple conditions.


    Our model for momentum is just that.


    In the early days of our research, through hundreds of hours of interviews, original
    surveys, and deep dives into the literature on team dynamics, we noticed a pattern
    emerging across various fields—whether in business, military operations, politics,
    or sports. Leaders and strategists in each domain faced similar challenges when
    it came to optimizing team performance, fostering a positive climate, and achieving
    their objectives. Despite the apparent differences in context, the underlying
    principles of effective teamwork and leadership seemed to be strikingly similar.


    This observation led us to a question: Could there be a workable model that can
    be applied across these diverse domains, one that could adapt to teams of different
    natures, sizes, and structures? The resulting model is both flexible and robust,
    capable of addressing the unique demands of any context while maintaining a core
    set of principles that drive success.


    But even a great model—one that explains performance in other teams and can drive
    success for your own—doesn’t mean that if you do *a*, *b*, and *c*, you’re guaranteed
    momentum. A good model allows you to start preparing yourself. A great model allows
    many people to create action.


    Formulas are great—for baking, chemists, and predicting the paths of physical
    objects in space. But formulas have their limits when it comes to human interactions
    and group dynamics. Rather, we look to models as our guide.


    The story we shared about the transformation of Microsoft under Satya Nadella’s
    leadership highlights a process of organizational renewal guided in part by leveraging
    John P. Kotter’s research and famed “8-step change model” from his 1995 management
    classic, *Leading Change*, and follow-up 2014 book, *Accelerate: Building Strategic
