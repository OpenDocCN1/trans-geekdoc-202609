    In this chapter, we continue our conversation with Nvidia’s `Chris Malachowsky`
    and others to define and flesh out the various forms of spark that exist and that
    can be leveraged. In every competition there will be moments of opportunity—though
    sometimes it’s a matter of knowing what to look for. An improperly prepared team
    may miss a spark entirely or fail to react to it. Then the moment is gone. In
    sports, they call these “sudden change situations.” These are events that must
    be responded to immediately, such as an interception or fumble. In politics, we’ve
    all seen squandered opportunities for a candidate to react or respond to events
    or opponents’ foibles. In business, one of the most certain ways to fail to capture
    a spark is to assign a committee to evaluate an issue rather than taking decisive
    action.


    You’ll get a feel for the various shapes, sizes, and feels of spark—and through
    this, become equipped to spot it. . . and, better yet, to act upon it with your
    team.


    ## Leader Communications


    A spark has happened! The catalyst—the opportunity a team has waited for—is at
    hand. What now? This chapter explores the instrumental role of coaches, CEOs,
    and other leaders who have prepared their teams for momentum and then must communicate
    to teams that *this* is the moment. You’ll learn from our conversations with `General
    David Petraeus`, Blue Cross CEO `Pat Geraghty`, and prolific tech exec `Rohan
    Chandran` about tools that can be developed and deployed to maximize how your
    teams respond to sparks and leader inputs, and you’ll be given a concrete guide
    for how to navigate dynamics where multiple leaders must communicate in concert.


    ## Team Climate


    “Trust comes from intimacy, and the leader has got to build that intimacy, and
    then you’ve got to develop these quick wins.”


    —**BOB McDonald**


    Transference of energy is one of the key properties of creating momentum. It is
    also the secret to building momentum within a team. But how does this process
    happen? Here, you’ll explore multiple phenomena including imitation, mirroring,
    and “emotional contagion” between members of an organization or team.


    This chapter also incorporates what we’ve learned from interviews with WD-40 CEO
    `Garry Ridge` and neuroscientist `Marco Iacoboni` on the role of intrateam competition
    and other related dynamics, and you’ll get your hands on practical tips from leaders
    in diverse fields on ways to strengthen connections between members of a team.


    ## Belief and Mindset


    Beliefs are what individuals and organizations hold to be true. Mindsets are ways
    of thinking or relating to these shared beliefs. At the very least, belief and
    mindset are complementary concepts, but when it comes to manipulating momentum,
    our model suggests that both are essential. Members of a team can believe that
    momentum is real. But if they don’t share a common mindset or ethos of how to
    approach momentum, opportunities will quickly be lost.


    This chapter, with insights from our discussions with basketball coach `Cori Close`,
    researcher `John Hollenbeck`, and neuroscientist `Jaime Pineda`, dives deep into
    how the mind processes information and, in turn, shapes behavior, performance,
    and outcomes. Through scientific evidence and anecdotal exploration, you’ll examine
    how shared belief systems, and shared mindsets, can be developed and fine-tuned
    to perceive signals of momentum and enhance a team’s ability to cohesively respond.


    ## Outcomes and Feedback


    An essential factor in generating or maintaining Mo relates to feedback. Feedback
    is a widely studied topic in psychological research, and it is among the most
    relatable concepts for people when thinking about their own life experiences.
    When it comes to momentum, this body of literature has significant application.
    You’ll be given broad context for understanding how feedback works in various
    settings, and more specifically, how positive feedback fuels the process of momentum.


    Through our interview with Blue Angels commander `Alexander Armatas` and a deep
    review of the feedback science, you’ll learn how to observe feedback in your own
    organizations, and how to create new channels for receiving and responding to
    feedback in ways that can generate and sustain team momentum.


    ## Leadership


    Where momentum may feel easy to experience but surprisingly difficult to define,
    leadership may suffer from the opposite affliction: There’s just so much written
    about it. There are more than forty thousand books on Goodreads alone in the leadership
    category and many more on Amazon that touch on this topic. There are books on
    classical management theories and books on contemporary explorations of leadership
    in digital and diverse environments. And then there are the academic journals.
    They range from broad in their orientation—`Leadership` by `Sage`, for example,
    which publishes peer-reviewed research on leadership—to highly niche, like `Educational
    Leadership`, `Women in Leadership`, `Journal of Nonprofit Management`, and `International
    Journal of Leadership`, to name a few. A search of the Florida State University
    unified library system shows a total of 256 journals that relate to leadership;
    620,001 academic articles; 181,273 newspaper articles; 176,339 magazine articles;
    112,344 dissertations; and 103,836 book chapters. That doesn’t count government
    documents, conference proceedings, and more—all of that to say, there’s quite
    a lot to say about leadership.


    A walk back through the history of definitions of leadership brings us to `Ralph
    Stogdill` in 1950, who described leadership as the process of influencing the
    activities of a group toward achievement—a definition that emphasizes the relational
    and goal-oriented aspects of this trait. This was followed by `James MacGregor
    Burns`, in 1978, whose theory of transformational and transactional leadership
    advanced the idea that transformational leaders inspire and motivate followers
    to achieve higher levels of performance and moral development, while transactional
    leaders focus on exchange and rewards to manage their teams. This distinction
    had a profound impact on subsequent leadership research, leading to the development
    of the Multifactor Leadership Questionnaire by `Bernard Bass` and `Bruce Avolio`
    (1995), which operationalizes these constructs.


    Burns’s concept of transformational versus transactional leadership also inspired
    the work of `Peter G. Northouse`, whose 2018 seminal text, `Leadership: Theory
    and Practice`, makes clear that leadership is not a static trait or characteristic
    but rather an interaction between the leader and the group members.


    Northouse’s perspective is that leadership is contextual and can vary depending
    on the situation and the people involved. Northouse provides two major groupings
    of leadership definitions: trait and process. Trait theories of leadership seek
    to identify the innate qualities and characteristics that allow someone to successfully
    exercise leadership. Researchers have sought to glean what personality, physical,
    and intelligence factors account for leader effectiveness. Most importantly, trait
    theories focus solely on the leader and do not examine the follower.


    Process theories of leadership, on the other hand, emanate from the perspective
    that leadership is an event. Therefore, effective leadership results from the
    quality of interaction between the leader and the follower. Process theories suggest
    that leadership is a process accessible to everyone. We can best examine momentum
    when we use a process definition of leadership.

