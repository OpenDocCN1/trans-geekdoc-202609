    It’s the latter piece that may take the most effort to learn. Whereas time and
    score are quantitative elements that can be fairly easily measured or observed,
    momentum is a qualitative experience. The perception of momentum can vary between
    players, if some can feel it at all. Getting a team on the same page regarding
    what momentum looks and feels like is a challenge Williams was determined to tackle.
    And here’s how he did it.


    Beyond regimented practice sessions that include fundamental drills, the use of
    game situation scenarios, and extensive conditioning, Williams incorporates the
    use of video analysis in novel ways. In this, players watch videos of their own
    performances to identify strengths and areas for improvement—during which Williams
    encourages self-critique and reflection. And it includes opponent analysis, including
    rigorous examination of how opponents operate and perform. In these sessions,
    Williams will pause plays and rewind, calling on players to share what they’re
    observing and to identify the conditions that preceded momentum.


    “I’ll stop the clip more often than I will actually play it, because I want to
    see how each person is processing the information in real time, particularly when
    they’re seeing it for the first time,” Williams shared. One player’s observation
    of a meaningful moment can shape how others see the same phenomenon, and through
    extensive watching, pausing, discussion, and repetition, a sense of shared perception
    between team members develops. And this video work isn’t limited to basketball,
    either. Williams shows his players clips from other sports. Why? Because their
    minds are more open.


    “Using TSM in other sports may even be more meaningful to our guys,” Williams
    explained. “You know, if I show our kids a clip of an NBA team, well, they know
    that they follow that guy on social media, right? Oh, they’re wearing his shoes.
    They don’t like him. He’s a crybaby. And so they’re narrow in a lot of their opinions.
    And yeah, opinions come into play. But if I show him Oregon State or Arkansas
    baseball, it’s easier to ask—what do you see? What was the fingertip, the spark
    that changed everything?”


    Williams again and again and again has his players watch clips of themselves and
    others simply to find that spark. “We have to create an environment that recognizes
    the spark,” he said. “If you can’t sense the spark, there is no spark. So I train
    them to watch and say, ‘Let’s get out there and feel our way around. And let’s
    see if we can find the spark.’”


    “In my own illogical way, this is what I think momentum is,” mused basketball
    coach Kevin Eastman, “the surge that occurs when practice and preparation meets
    near perfection.”


    Similar to Buzz Williams, Eastman’s focus on practice is distinguished by meticulous
    planning, emphasis on mental conditioning, and data. He creates simulations of
    specific situations players might encounter during a game, such as end-of-quarter
    plays, defensive stances, and fast-break opportunities. But more than anything,
    Eastman is rare in his focus on the minutiae of the game, such as footwork, positioning,
    and timing. He meticulously studies opponents, breaking down their strategies,
    strengths, and weaknesses to create detailed game plans.


    The best organizations understand the importance of preparing for pivotal moments.
    One surprising insight that emerged from our interviews and conversations is how
    many people think success comes from simply waiting for an opportunity to arise.
    But if you wait without preparation, you won’t be in the best position to capitalize
    when it happens. In sports and the military, much of the work revolves around
    being ready for various scenarios, yet this concept has caught some in the business
    world off guard.


    The key to success lies not just in having a plan for the opportunity but in cultivating
    the right mindset to seize it. Coaches like Buzz Williams emphasize this by running
    practice drills that simulate high-pressure situations, such as being down with
    only a few seconds left on the clock. It’s about both game planning and instilling
    the belief in players that, even in the toughest circumstances, good outcomes
    are possible. This mindset allows individuals to be mentally prepared to perform
    at their best when the moment arrives.


    The military concept of “seizing the initiative” (setting and dictating the terms
    of action) is articulated in `Army Doctrine Publication 3-0, Unified Land Operations`.
    It is based on the notion that Army units “seize, retain, and exploit the initiative,”
    while accepting smart risk in service of gaining a position of relative advantage
    over an adversary. Army units routinely conduct rigorous preparatory exercises
    designed to hone their ability to seize the initiative when a situation is ripe
    for doing so. The exercises cover a range of scenarios spanning from the most
    likely course of action to the most dangerous. Rehearsals are also conducted in
    order to walk through major decision points while reinforcing what it will take
    to ensure organizational alignment. In the military, just like in business, sports,
    and politics, the preferred mode of operation is to be on offense where you are
    dictating the tempo. Ideally, you want competitors responding to you versus the
    other way around. Building an organization’s ability to accomplish actions effectively
    is related to the organizational psychology construct of task cohesion (that is,
    the degree to which members of a group work effectively together to achieve common
    goals). Rigorous preparation enhances task cohesion (which will heighten the likelihood
    of being able to impose one’s will on an opponent or situation).


    Similarly, in business, timing can be everything. For example, executives at `Lyft`
    anticipated that `Uber`’s toxic corporate culture would eventually implode, especially
    during its dominant days. They predicted that when `Uber` began making headlines
    for negative reasons, it would create an opportunity for `Lyft` to step in. So
    they strategically prepared for that moment. When `Uber`’s front-page controversies
    started piling up, `Lyft` was ready to launch a campaign reminding people that
    ridesharing could still be a safe and positive experience. They were prepared
    to seize the moment when their competitor faltered.


    ### How can you be ready to seize a moment?


    “Oppo research” is a bedrock of preparation in political campaigns—involving deep
    scrutiny of weaknesses and vulnerabilities, both for one’s opponent and oneself.
    Veteran political consultant and pollster `John McLaughlin` knows a thing or two
    about that, often finding himself in the position of educating his candidates
    about the skeletons in their own closets that his team of researchers has dug
    up. It’s not always met with welcome reception, either.


    “Most of the time, our internal research finds more than the candidate discloses,”
    McLaughlin shared. “Sometimes it’s important, sometimes it’s not. But you have
    to do it. Sometimes, when you’re the candidate, it’s hard to think of what might
    be there—even smart candidates miss their own vulnerabilities.”


    Other times, candidates know what might be dug up on them but don’t think it matters.
    For example, they might believe a contentious divorce file is sealed only to later
    discover that someone has a copy or stole one. But for the political consultant,
    these findings determine whether to take on a client or a race—or stay out—or
    to advise their candidate on how to best approach the baggage.


    “You have to expect the unexpected. So you prepare. And the best way, I find,
    most often the truth is the best option. If you find a fault, and there’s a `mea
    culpa`, you gotta do it. If, on the other hand, if you find out something that’s
    fatal, you might go to the candidate and say, ‘Save yourself time and money—don’t
    bother running.’”

