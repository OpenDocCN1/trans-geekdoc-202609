    “I saw it in their eyes,” Close told us just a year later. “They had this expectant
    look, like they knew our moment was coming.” This wasn’t just a coach’s wishful
    thinking. The players’ demeanor was infectious, a silent communication of certainty
    that transcended words. Even as Close’s own nerves frayed, her team remained composed,
    their belief unshaken, and this mindset was shared and reinforced through their
    body language.


    By halftime, the impossible seemed suddenly plausible. UCLA had cut the lead to
    eight, a significant shift from the twenty-one-point chasm that had once yawned
    between the teams. The momentum was tangible, a shift in the air that Close could
    almost touch. The Bruins had scored the last six points of the half, and with
    each basket, the noise in the building transformed. The raucous home crowd grew
    quieter, the Ducks’ body language more strained.


    In the locker room, Close saw that the team’s calm was not just a front. They
    huddled together, their conversations reflecting a shared belief that their time
    had come. “Our language never changed,” Close noted. “Even when we were down,
    they spoke like we were going to win. It was remarkable.” This shared mindset
    was evident in their actions and the way they carried themselves; it was a collective
    belief. The second half was a testament to this mindset. UCLA played not just
    to catch up but to win. The momentum had shifted, and Close saw how it affected
    everything—the noise level, the opposing team’s composure, and the very atmosphere
    of the game. The Ducks, once so dominant, now seemed tentative, their confidence
    shaken by the unrelenting advance of their opponents.


    With about a minute and a half remaining in the game, Close knew her players were
    exhausted from the energy it took to sustain the comeback. She wanted to call
    a time-out and call in relief, but her assistant coach knew otherwise. “He was
    wiser than I was,” Close considered. “He was like, you know, we have to ride momentum
    here. And he was right.” As the final buzzer sounded, it was UCLA that stood victorious.
    They had handed Oregon their only home loss of the season, a feat that seemed
    impossible just an hour before. Close reflected on that night as a defining moment,
    not just for the win but for the way it happened. “We stayed expectant,” she said,
    marveling at the power of belief.


    This game was not just a comeback; it was a lesson in the power of mindset. Close
    would carry this lesson with her, recognizing that the power of belief and body
    language of calm expectancy could indeed shape outcomes in ways she hadn’t fully
    appreciated before. The shared mindset among her players, communicated in how
    they moved, stood, and saw one another, had turned the tide in their favor and
    underscored the profound impact of collective belief.


    ### Understanding Beliefs


    Beliefs are what individuals and organizations hold to be true, such as the conviction
    or acceptance that something exists. Beliefs may be based on evidence, faith,
    personal experience, or cultural and societal influences. And beliefs can be about
    tangible aspects of the world, such as believing in the existence of gravity,
    or intangible ones, such as believing in fairness or justice. But, in general,
    beliefs tend to be fairly specific in scope.


    For example, Victor Vroom, a longtime professor at Yale’s School of Management,
    developed a motivational framework (expectancy theory) that explains how people
    choose to act based on their expectations of the outcomes. The theory examines
    three relationships regarding an individual’s belief in the likelihood of something
    transpiring:


    1. **Expectancy**: `If I try it, can I do it?`

    2. **Instrumentality**: `If I do it, will I get the reward?`

    3. **Valence**: `If I get the reward, will I value it?`


    ### The Role of Mindsets


    While beliefs form the foundation of something, mindsets, on the other hand, are
    a way of thinking or relating that influence behaviors. Mindsets are broader and
    encompass various beliefs that determine an approach. It’s no surprise, then,
    that beliefs are more easily changed than mindsets. Thanks to research advanced
    and popularized by Stanford University psychologist Carol Dweck, mindsets can
    be broadly categorized into two types:


    - **Growth Mindset**: Those with a growth mindset tend to believe that abilities
    and intelligence can be developed and improved over time through effort and perseverance.
    They see challenges as opportunities, view effort as the path to mastery, and
    believe that failures are valuable learning experiences.

    - **Fixed Mindset**: Those with a fixed mindset tend to believe that abilities
    and intelligence are static traits that cannot be developed. They avoid challenges,
    give up easily when faced with obstacles, and see effort as fruitless if natural
    talent is not present.


    Where those with a growth mindset welcome feedback, those with a fixed mindset
    are more likely to become defensive or dismissive. Growth mindsets embrace challenge,
    tend to persist and adapt to changing plans, and see effort as related to success.


    At the very least, belief and mindset are complementary concepts, but when it
    comes to manipulating momentum, our model suggests that both are essential. Members
    of a team can believe that momentum is real. But if they don’t share a common
    mindset or ethos of how to approach momentum, opportunities will quickly be lost.


    ief and mindset—the “I believe” of momentum—can’t be overstated. When things aren’t
    working quite right, some have a sense of panic. But if members of a team believe
    that they’ve done all of the things we’ve been talking about so far—they’ve prepared,
    they’ve brought the right people in, the right culture is in place, a spark has
    happened, the leader is amplifying it, they’re collectively clicking with a great
    team climate—then, yes, they will have a sense that “we can make this happen.”


    Albert Bandura was born on December 4, 1925, in the small town of Mundare, Alberta,
    Canada. Growing up in a rural community, Bandura developed a strong sense of curiosity
    and self-reliance, and as the youngest of six children, Bandura spent a lot of
    time watching and learning from his older siblings. These traits and experiences
    ultimately shaped what Bandura would come to study in his renowned career in psychology.
    After completing his undergraduate studies at the University of British Columbia,
    Bandura pursued his PhD in clinical psychology at the University of Iowa, where
    he was influenced by the behaviorist tradition but also began to explore new ways
    of understanding human thought and action.

