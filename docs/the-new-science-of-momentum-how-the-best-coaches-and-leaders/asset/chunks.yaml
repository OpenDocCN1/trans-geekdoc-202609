    When thinking about recruitment, it is easy to focus on a leader’s initial assembly
    of a team—bringing people in to form a team from the ground up, perhaps even all
    at a common time. In practice, however, recruitment is an ongoing exercise. Not
    all leaders have the chance to create a team from scratch. Rather, most inherit
