    The process of decision-making, reflection, and refinement is a symbiotic relationship,
    each influencing the other in a continuous loop. To learn faster and more effectively,
    teams must properly utilize proven reflection techniques regularly. For example,
    the US military conducts “In-Progress Reviews and After-Action Reviews” (`IPR/AAR`)
    throughout their activities in order to foster more effective decision-making.
    The `IPR/AAR` generally examines four questions: What was supposed to happen?
    What did happen? What accounts for things that transpired? What can we change
    the next time? The `IPR/AAR` is not intended to evaluate success or failure but
    rather to identify areas for improvement and strengths that can be maintained.


    ### ACTION 2: Embed agility behaviors into your culture


    The ability to seize momentum (or reverse it) requires challenging the status
    quo. Some cultures prize stability and others celebrate agility. Creating norms
    that celebrate agility-related behaviors (for example, collaboration, speed of
    decision-making, trial tolerance) is crucial if you are to seize upon the opportunities
    presented in a dynamic environment.


    ### ACTION 3: Ensure your culture prizes accountability.


    The word `accountability` has a negative connotation in many organizations. In
    the most effective organizations, `accountability` is `the` word. Seizing momentum
    requires a staunch adherence toward leaning into designated behaviors. Peter Bregman
    published a wonderful contribution to management literature in a January 2016
    article for `Harvard Business Review` discussing the topic of accountability.
    The piece delineated five actions required to foster accountability: establish
    clear expectations, create clear capability, ensure clear measurement, provide
    clear feedback, and ensure clear consequences. It is important that leaders reinforce
    these five behaviors.


    ## Recruitment


    Usually when a team wins a pivotal game in the last second, the postgame locker
    room is full of unbridled energy. Not so on May 13, 1994. Immediately after the
    Chicago Bulls pulled out a dramatic victory over the New York Knicks in game 3
    of the Eastern Conference semifinals at Chicago Stadium, the winning locker room
    was grim and heavy. Though the last few seconds of the game had secured a Bulls
    win, they had also revealed friction within the team from which that year’s squad
    would never recover.


    With the series tied 1–1, the game tied at 102–102 with 1.8 seconds remaining
    in regulation, “Zen Master” coach Phil Jackson called a time-out to draw up the
    final play. Everyone expected that the play would be designed for Scottie Pippen,
    one of the best all-around players in NBA history, to take the final shot and
    finish as the hero. But Jackson—known nearly as much for his Buddhist philosophy
    as for his strategic approach to the game—decided otherwise. He chose to design
    the play for Toni Kukoc, a talented Croatian player who had joined the Bulls that
    season and had a knack for making clutch shots. Pippen would be used as a decoy
    in the play’s design.


    Feeling slighted and disrespected by Jackson’s decision, Pippen refused to reenter
    the game. He declined to get off the bench and be part of the play. This was a
    shocking move, especially considering the high stakes. Even though Pippen wasn’t
    to be the focus of the play, his absence from the court could surely have compromised
    the success of Jackson’s strategy in various ways—the least of which was in the
    possibility that Pippen on the sidelines could serve as a clue to the opposition.


    But with Pippen on the bench, the play went on as planned. Toni Kukoc received
    the inbound pass from Pete Myers and hit a remarkable, game-winning jump shot,
    giving the Bulls a 104–102 victory. But the clamor of the win was overshadowed
    by Pippen’s act of selfish defiance. Everyone felt it—the players, the fans, the
    media. Pippen’s teammates were livid, none more than Bill Cartwright, one of the
    team’s veteran leaders. Cartwright wasn’t one to express emotion loudly or often,
    but the spontaneous speech he gave in the Bulls locker room that day would stick
    in the minds of those who heard it for decades to come.


    With tears streaming down his face, Cartwright called his team together. He couldn’t
    let Pippen’s decision to abandon his teammates at a critical moment go without
    response—surely, it couldn’t become the norm or be seen as a model to follow for
    others. He expressed profound disappointment in Pippen’s move, which ran contrary
    to his concept of team culture—one where players could rely on one another and
    where wins are shared, regardless of which role any individual player had. He
    was equally angry at Pippen’s display of disrespect toward Jackson as he was toward
    his fellow teammates, and he urged Pippen to apologize to the team and coach alike.
    Jackson also addressed what had happened, acknowledging Pippen’s value to the
    team but underscoring the need for every player to trust and follow the coach’s
    decisions. Pippen ultimately did apologize, though many sensed it wasn’t genuine,
    and the incident left a lasting mark on his legacy.


    Despite then having the series lead 2–1, the Bulls ultimately lost to the Knicks
    in the playoffs.


    It had been the first season after Michael Jordan’s first retirement from the
    Bulls, leaving the team without its iconic leader. Scottie Pippen openly expressed
    how he intended to fill that role. As Jordan’s sidekick, Pippen was remarkable
    for his versatility, defensive prowess, and ability to facilitate the offense.
    He was a seven-time NBA All-Star, a member of the NBA’s 50th Anniversary All-Time
    Team, and a key figure in the Bulls’ six championships during the 1990s. But when
    he was counted on as the “leader,” Pippen’s individual greatness found itself
    clashing with team dynamics. His self-oriented style and desire for recognition
    caused friction within the team.


    Many within basketball never saw Pippen the same way after that moment.


    Is it possible to be both a great star and a great teammate? For coaches who are
    searching for that combination—the player who is individually exceptional but
    equally capable of celebrating the wins of others—finding those unicorns is important
    when building that thing we call “team momentum.”


    This is why filling a roster, a company, a campaign, or a battalion with the right
    talent is paramount.


    As authors, we acknowledge that this part of the model is what twists most leaders
    into a pretzel. They want talent. They need talent. But when it comes to recruiting
    or putting together a team that can seize a moment and turn it into momentum,
    that talent has to be willing to prioritize team goals over personal stats.


    For momentum to really take off, teammates need to genuinely celebrate when someone
    else on the team does something big for the greater good. If even one person on
    your team sees someone else getting praise and reacts negatively—whether they
    internalize it or, even worse, act out because the big moment wasn’t theirs—it
    can completely douse the spark. Some might call this “pulling a Pippen.” That
    one small reaction can stop momentum in its tracks.


    People are always the key. A 2012 McKinsey global survey, part of the “War for
    Talent” study, measured the productivity gap between average and high performers
    based on how complex their job was. In low-complexity jobs, high performers were
    50 percent more productive than average ones. But in highly complex roles, the
    productivity difference was an astounding 800 percent! In short, finding top talent
    really matters.

