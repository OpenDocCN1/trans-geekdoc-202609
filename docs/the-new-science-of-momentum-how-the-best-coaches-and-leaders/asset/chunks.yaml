    # Kerr’s Cultural Transformation of the Golden State Warriors


    Kerr’s first move as head coach was to assess the existing culture of the Warriors.
    He found a team with potential but lacking a cohesive culture that emphasized
    teamwork and innovation. Rather, the culture was individualistic, focusing on
    the talents of key players rather than fostering a collective identity. Kerr knew
    that had to change.


    Kerr aligned the team’s strategies and practices with the desired cultural changes.
    He introduced a system that emphasized ball movement, unselfish play, a fast-paced
    style, and something else that isn’t on the list of most managers: joy. “It’s
    meant to be fun,” Kerr would tell his players. He established a set of four core
    values: joy, competition, compassion, and mindfulness, and of these, Kerr said,
    joy is “perhaps the easiest to understand, recognize, and impart.”


    There are plenty of road maps on coaching strategy but very few—if any—on coaching
    joy. To Kerr, however, that was the easy part. He’d play music during practice,
    a deviation from what he described as a “drill sergeant mentality” held by many
    other coaches, and he noticed quickly how the music would help the players feel
    “loose and energized.” And second, Kerr would promote joy through humor. “This
    is most noticeable in our daily video sessions, when we review game film. The
    team has a great video editor, and my staff and I often have him splice in some
    humor, whether from movies, the sports media, or other sources. Sometimes it’s
    just random funny stuff, but a lot of times it’s something relevant to our team—maybe
    something mildly embarrassing someone did or said—intended to get us laughing
    about ourselves and each other.”


    For compassion, Kerr knew that genuine care toward one another can’t be manufactured—but
    he certainly saw opportunities to build it. He’d invite parents, children, and
    the people closest to players to join the team on the road for group dinners and
    on the team plane. He wanted players to recognize in one another their struggles,
    vulnerabilities, and shared human experiences. And some of the techniques Kerr
    would use to foster compassion were amplified by his focus on mindfulness too:
    yoga, breathing exercises, and meditation. He’d bring in outside talent to lead
    these sessions, all with the goal to foster connectedness and the ability to enter
    “the zone.”


    ## Implementation and Leadership


    This approach required buy-in from all players, not just the stars, to work together
    and prioritize team success over individual achievements. To communicate the desired
    culture, Kerr consistently reinforced the principles of teamwork, collaboration,
    and joy in playing the game. He used team meetings, practice sessions, and one-on-one
    conversations to emphasize these values. Kerr also encouraged open communication
    and input from players, fostering a sense of ownership and involvement in the
    cultural shift.


    Kerr led by example, embodying the new cultural values. He demonstrated a collaborative
    and inclusive leadership style, valuing contributions from all team members and
    staff. Kerr’s approachability and willingness to listen set a standard for the
    entire organization. Perhaps more importantly, he reinforced the new culture by
    recognizing and rewarding behaviors that aligned with the team’s values. Players
    who demonstrated unselfish play, strong work ethic, and teamwork were celebrated.
    The organization also invested in player development and wellness programs, further
    supporting the cultural emphasis on holistic success.


    Kerr understood that cultural change is a gradual process. He was patient and
    persistent, continuously reinforcing the new cultural norms and values over multiple
    seasons. The evolution of the Warriors’ culture involved ongoing adjustments and
    refinements to maintain alignment with the desired values. And the results were
    remarkable.


    ## Results and Impact


    Kerr’s first season with the Warriors saw a 67–15 record. They rated first in
    the NBA on defense and second on offense. And by the 2015–16 season, the Warriors
    had the best regular-season record in NBA history: 73–9, surpassing the 1995–96
    Chicago Bulls’ 72-win season and setting a record maintained to the day of this
    writing. The Warriors went on to win the 2016–17 and 2017–18 championships. Despite
    the overwhelmingly positive reaction, some critics were skeptical about the sustainability
    of the Warriors’ transformation and playing style, particularly their heavy reliance
    on three-point shooting. But continued success and championships silenced most
    doubters. Sustainable it has been.


    The Golden State Warriors topped the *Forbes* annual valuations list for NBA teams
    for the first time in their history in 2022 and then topped the list again in
    2023 with a value of $7.7 billion. Their 2022–23 season generated $765 million
    in revenue, nearly 50 percent more than any other NBA team. It seems that player
    joy translates to fan joy too. The cultural transformation under Kerr’s leadership
    led to remarkable outcomes for both the development and success of individual
    players and the team’s performance as a whole. His approach not only led to championships
    but also revolutionized the style of play in the NBA, making the Warriors one
    of the most successful and influential teams of the modern era.


    # Theoretical Framework: Edgar Schein


    Jensen Huang and Steve Kerr may not be anything like each other in disposition,
    and they may never have read something written by Edgar Schein, the organizational
    psychologist who develo influential theories on organizational culture and its
    management. But Huang’s transformation of Nvidia and Kerr’s transformation of
    the Golden State Warriors closely mirror each other, and both reflect the principles
    of Schein’s theory in practice.


    Indeed, the influence of Schein’s scholarship on management theory and practice
    is so pervasive it may be difficult to separate what has been consciously inspired
    by his work and what came organically or intuitively to various leaders across
    sectors. Schein’s model has greatly contributed to understanding how culture influences
    organizational dynamics and performance.


    To Schein, the core function of leadership is managing culture. To Huang, “great
    ideas can come from anyone, anywhere. It’s about creating an environment where
    those ideas can flourish.” To Kerr, culture management is “the only thing of real
    importance that leaders do.”


    ## What is Culture?


    In *Organizational Culture and Leadership*, Edgar Schein defines `culture` as
    “the deeper level of basic assumptions and beliefs that are shared by members
    of an organization, that operate unconsciously and define in a basic ‘taken for
    granted’ fashion an organization’s view of itself and its environment” (5th ed.,
    2016). In simpler terms, Schein suggests that an organization’s culture is shaped
    early on by its founders and leaders. Their actions and beliefs set the tone,
    shaping culture through shared experiences, leading by example, and reinforcing
    behaviors that align with their values. In other words, leaders create culture
    by offering opportunities for group members to connect through things like rituals,
    stories, and traditions. And they serve as role models, using their behavior to
    set the standard for everyone else, while rewarding and reinforcing the actions
    they want to see more of.


    Schein identifies three distinct levels of organizational culture, each representing
    varying degrees of visibility and awareness:


    *   **Artifacts**: These are the visible and tangible elements of culture, such
    as architecture, office layout, dress code, and formal processes. Artifacts are
    easy to observe but difficult to interpret accurately without understanding the
    deeper levels of culture.


    *   **Espoused Values**: These are the stated values and norms that an organization
    explicitly endorses. They include mission statements, codes of ethics, and articulated
    beliefs. Espoused values provide insights into the organization’s desired culture
    but may not always reflect actual behavior.

