    决策、反思与完善的过程是一个共生关系，它们在持续的循环中相互影响。为了学得更快更高效，团队必须定期妥善利用经过证明的反思技术。例如，美军在整个活动过程中会进行“进行中审查与行动后回顾”（`IPR/AAR`），以培养更有效的决策。`IPR/AAR`
    通常考察四个问题：本应该发生什么？实际发生了什么？什么解释了这些发生的事变故？下一次我们可以改变什么？`IPR/AAR` 的目的不是为了评估成功或失败，而是为了识别改进领域和可以保持的优势。


    ### 行动 2：将敏捷行为融入你的文化中


    抓住势头（或扭转势头）需要挑战现状。有些文化重视稳定，而另一些文化则推崇敏捷。如果你想抓住动态环境中提供的机遇，那么建立推崇敏捷相关行为的规范（例如：协作、决策速度、对尝试的容忍）是至关重要的。


    ### 行动 3：确保你的文化重视责任制。


    `accountability`（责任制）一词在许多组织中带有负面含义。在最高效组织中，`accountability` 是核心词汇。抓住势头需要坚定地坚持投入指定的行为中。Peter
    Bregman 在 2016 年 1 月份为《哈佛商业评论》写的一篇文章发表了关于管理文献的精彩贡献，讨论了责任制的话。文章阐述了培养责任制所需的五个行动：建立明确的预期、创造清晰的能力、确保明确的衡量、提供清晰的反馈以及确保明确的后果。领导者强化这五种行为非常重要。


    ## 招募


    通常当一支球队在最后一秒赢得一场关键比赛时，赛后更衣室充满了无约束的能量。但 1994 年 5 月 13 日并非如此。在芝加哥公牛在芝加哥体育馆举行的东部半决赛第三场比赛中，戏剧性地击败纽约尼克斯队后，获胜方的更衣室气氛阴冷沉重。尽管比赛的最后几秒确保了公牛队的胜利，但它暴露了团队内部的摩擦，这种摩擦让那支球队从此再也没有能恢复。


    当系列赛比分平为 1-1，常规时间还剩 1.8 秒时比分平为 102-102，“禅师”教练菲尔·杰克逊请求暂停布置最后一次进攻。大家都预料这个战术是为 NBA
    历史上最好的全能球员之一斯卡蒂·皮宾（Scottie Pippen）设计的，让他完成最后的投篮并作为英雄终结。但杰克逊——他因佛教哲学和比赛策略同样闻名——他选择了不同的。他选择为托尼·库科克（Toni
    Kukoc）设计战术，这位才华横溢的克罗地亚球员在那个赛季加入了公牛队，并擅长关键球。皮宾在战术设计中被用作诱饵。


    对杰克逊的决定感到冷落和不尊重，皮宾拒绝重新回到比赛中。他拒绝下场参与战术。这是一个令人震惊的举，尤其是考虑到如此高的代价。尽管皮宾并不是战术的焦点，但他不在场上的缺席无疑会从各个方面损害杰克逊策略的成功——最轻的一点是坐在场边的皮宾可能会为对手提供线索。


    但由于皮宾坐在替补席上，战术仍按计划进行。托尼·库科接接到皮特·迈尔斯的传球，投中了一记不可赞叹的绝杀跳投，帮助公牛队以 104-102 获胜。但胜利的欢呼被皮宾自私的反抗行为所掩盖。每个人都感受到了——球员、粉丝、媒体。皮宾的队友们大发雷霆，其中比尔·卡特赖（Bill
    Cartwright）最为愤怒，他是球队的资深领袖之一。卡特赖不是那种会大声或频繁表达情感的人，但他那天在公牛队更衣室里发表的自发演讲将留在听过的人记忆中，持续了几十年。


    卡特赖泪水流着脸颊，将球队召聚在一起。他不能让皮宾在关键时刻放弃队友的决定不回应——无疑，这不能成为常态，也不能被视为他人效仿的榜样。他对皮宾的行为表达了深深的失望，这违背了他对团队文化的理念——即球员之间可以相互依靠，胜利是共享的，无论任何个人球员承担什么角色。他对于皮宾对杰克逊表现出的不尊重，以及对队友们的不尊重感到同样愤怒，并敦促皮宾向团队和教练道歉。杰克逊也处理了发生的事情，承认了皮宾对团队的价值，但强调了每位球员信任并遵循教练决定的必要性。皮宾最终道歉了，尽管许多人感觉到这并非出自真心，这件事给他的传奇留下了持久的印记。


    尽管当时系列赛以 2-1 领先，公牛队在季后赛中最终输给了尼克斯队。


    这是迈克尔·乔丹首次从公牛队退休后的第一个赛季，球队失去了它标志性的领袖。斯卡蒂·皮宾公开表达了他打算如何填补那个角色。作为乔丹的助手，皮宾以其多功能化、防守能力以及组织进攻的能力而闻名。他是七次
    NBA 全明星，NBA 50 周年历史最佳阵容成员，也是公牛队在 20 世纪获得六次冠军的关键人物。但当他被视为“领袖”时，皮宾的个人伟大与团队动态产生了冲突。他那以自我为中心的风格和对认可的渴望导致了团队内部的摩擦。


    篮球界的许多人在之后再也没有以同样的眼光看待皮宾。


    是否可能既是伟大的明星又是伟大的队友？对于寻找这种组合的教练来说——即那种个人极其卓越又能庆祝他人胜利的球员——寻找那类“独角兽”对于建立所谓的“团队势头”至关重要。

