  raw: 'Despite his reluctance, or perhaps even in part because of it, a grassroots
    movement known as “Draft Eisenhower” began to gain momentum. Citizens from various
    walks of life, including veterans, business leaders, and everyday Americans, saw
    Eisenhower as the ideal candidate to lead the nation through the complexities
    of the postwar era. They believed that his leadership skills, integrity, and nonpartisan
    stance made him uniquely qualified to unite the country. Several influential figures
    played crucial roles in the Draft Eisenhower movement. Among them were prominent
    politicians like Senator Henry Cabot Lodge Jr., who saw Eisenhower as the Republican
    Party’s best hope against the Democrats in the 1952 election. Lodge, along with
    others, organized committees and rallies to garner support for Eisenhower’s candidacy.


    Intense grassroots mobilization began. Supporters created “Eisenhower for President”
    clubs across the country, collecting signatures and organizing rallies to demonstrate
    widespread public support. Newspapers, radio shows, and magazines were utilized
    to promote Eisenhower as a candidate, despite his lack of interest, highlighting
    his leadership during World War II and his potential to bring stability and prosperity
    to the nation. Influential politicians and public figures publicly endorsed Eisenhower,
    adding credibility and momentum to the draft movement.


    Eisenhower began to see the presidency as a continuation of his service to the
    country. He was convinced that his leadership was needed to navigate the Cold
    War, combat communism, and manage domestic challenges. The widespread call to
    duty resonated with his sense of patriotism. Republican leadership assured Eisenhower
    that he would have significant autonomy in his administration and the support
    needed to implement his vision for the country.


    In January 1952, after much contemplation and encouragement from his closest advisers
    and family, Eisenhower finally agreed to run for president. He announced his candidacy
    and entered the Republican primaries, eventually securing the nomination.


    The Draft Eisenhower effort is an extraordinary example of momentum in practice—a
    rare case where momentum *preceded* a political win by convincing the right candidate
    to enter the fray, as opposed to the usual course of events where a person opts
    themselves in and desires momentum to push their campaign along.


    When Bob McDonald took over as secretary of the Department of Veterans Affairs
    in 2014, he inherited an agency mired in scandal and dysfunction. The VA had been
    plagued by reports of widespread mismanagement and systemic failures, most notably
    in the form of extensive delays in veterans receiving medical care. Some had been
    waiting months, even years, to receive care. This situation came to a head in
    April 2014 when whistleblowers exposed that veterans at the Phoenix VA hospital
    had died while waiting for care and that VA employees had manipulated records
    to hide the long wait times. Rather than an isolated issue involving one or a
    few bad actors, the practice of falsifying records to make wait times appear shorter
    than they were was widespread. This dishonesty was enabled by a culture lacking
    accountability or consequence.


    These revelations led to a massive public and political outcry. Veterans groups,
    lawmakers, and the general public demanded immediate reforms, and the VA came
    under intense scrutiny from Congress, with numerous hearings held to investigate
    the issues and determine responsibility. The media kept a spotlight on the VA’s
    failures, ensuring that the pressure for reform remained high. And this spotlight
    was never brighter than when McDonald took the reins.


    Bob McDonald didn’t just slingshot himself into top leadership roles—not in his
    thirty-three years at Procter & Gamble and not in the US Army. Rather, McDonald
    was an example of rising through the ranks, learning each role with deep involvement
    before being tapped to take on the next challenge. McDonald began his career as
    a student at the US Military Academy at West Point, graduating in 1975 with a
    degree in engineering.


    McDonald worked hard enough as a cadet at West Point to become highly decorated
    and graduate in the top 2 percent of his class, yet he started back at the bottom
    in his first assignment as an Army Airborne Ranger. He went to the 82nd Airborne
    Division as a second lieutenant. Eventually, he became the assistant operations
    officer of a battalion where he helped lead warfare training near the Arctic Circle.
    He managed to earn an MBA while leading his troops, and upon leaving the military,
    he once again returned to the lowest ranks as he began a career in business.


    He joined Procter & Gamble in 1980 as a brand assistant for Tide, an entry-level
    position that gave him experience in marketing and ad campaigns, before being
    promoted to brand manager, where he conducted research and managed performance
    in the market. Later, McDonald was sent to the Philippines and then to Japan.
    He served as vice president and general manager in those markets, taking on significant
    leadership in challenges in each location. He returned to the United States as
    president of Global Fabric Care before being pinned as the organization’s chief
    operating officer, then president and CEO, and then chairman of the board. Under
    his leadership, P&G added nearly one billion people to its global customer base,
    and its stock price increased by 60 percent in his four years as CEO.


    In other words, McDonald hadn’t just led but had worked in every level of the
    organization—a feature that appealed strongly to President Barack Obama when he
    appointed McDonald to one of the biggest agency messes of his administration.
    Indeed, when McDonald arrived at the VA, it was clearly critically understaffed,
    particularly in the areas of medical care and administrative support. McDonald
    also observed a severe leadership vacuum at many VA facilities, rendering them
    ineffective or in disarray. And at the topmost levels, there was a lack of empowered
    leadership to address systemic issues and implement necessary reforms. McDonald’s
    first step was to embark on a “listening tour,” visiting VA facilities across
    the country to hear directly from veterans and VA employees about the problems
    they faced. Concurrently, McDonald emphasized accountability and transparency,
    pledging to fire any employee found to have engaged in misconduct or to have failed
    in their duties.


    He is solidly crafted in the mold of the servant leader, one who leads from the
    front. And one of the many ways McDonald builds the trust needed for this kind
    of leadership is to give out his personal phone number.


    “When I became the leader at the VA, I needed to create trust. In a crisis, a
    leader has to be even more accessible,” said McDonald. “One weekend, a veteran
    called me, and I referred him to our Suicide Prevention Hotline. As I recall,
    they intervened, and the veteran’s alive today. I haven’t changed the phone number.
    And I still answer it today.”


    But at the core of what was necessary for McDonald to accomplish was a shift in
    recruitment: hiring more medical professionals and administrative staff, and hiring
    leaders who could effectively and transparently manage the organization with a
    strenuous commitment to accountability.'
