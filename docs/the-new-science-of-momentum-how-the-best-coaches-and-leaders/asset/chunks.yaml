    ## 5. Cross-pollinate


    Johnson put people in cross-functional groups and insisted upon setting aside
    time for team members to get to know one another. “My leadership team was brand
    new, which was kind of a big deal. In order to accelerate relationships, which
    take time to develop, we allocate time to be in person every month and, within
    these meetings, dedicate time toward relationship development.” Johnson initiated
    personality tests where team members shared results, talking about family, and
    preferences, and life. “Everybody’s got these crazy things going on in their lives.
    We make space to bring them in, in whatever way they’re comfortable. We don’t
    mandate that you have to tell some sort of secret. You set up your own boundaries,
    but give us a look at where you are in life and journey.” Johnson shares how she
    would talk to team members. “Why’d you come to Lumen? How does it fit into your
    life story? Tell us one thing that’s super interesting.”


    Though the word had been said a number of times, and the theme was felt throughout,
    it wasn’t until late in our conversation that we asked Kate about momentum.


    “Is it real?” we asked.


    “That’s a hard yes,” Johnson replied, without hesitation. “First of all, I have
    an electrical engineering degree. I’ve taken many physics classes. I love physics.
    That explains how the universe works. In a transformation, inertia and momentum
    are incredibly important. You know, the sort of the Newtonian laws of motion:
    Objects in motion stay in motion; objects at rest stay at rest unless there’s
    an external force. My belief is that the translation of those sets of laws to
    corporate America is that companies that are winning stay winning, and companies
    that are losing stay losing unless there’s some external force, and the external
    force at Lumen in our industry is our transformation. We’re getting the people
    and the talent; we’re getting a system refresh. We’re redesigning our processes.
    We’re redesigning the value that we bring to customers. So that’s external force
    number one. External force number two is this unprecedented spike in demand for
    terrestrial internet. Right now we’re prepared to capture that opportunity. Momentum
    is mass times velocity. I need more velocity, and we’re a twenty-five-thousand-person
    mass company. They gotta lean in with me so that we can increase that number and
    go faster.”


    Few things captivate sports fans more than the thrill of an underdog story or
    an unlikely comeback. The energy in the arena becomes palpable, the crowd’s belief
    in an impending victory surges, and the narrative of momentum takes center stage.
    This phenomenon isn’t confined to sports alone; it echoes in politics, military
    history, and the business world, where a sudden reversal of fortunes is often
    seen as the result of an unstoppable momentum.


    How does a team, on the precipice of defeat, become the team that stuns observers
    and full throttles into victory? We concede that in the thousands of journal articles
    we’ve read on this topic, science has struggled to identify the variables that
    make momentum more or less likely. One 2019 study by Israeli researchers in the
    `Journal of Economic Psychology` stands out as particularly interesting. They
    wanted to know whether NBA teams that clawed their way back to a tie in regulation
    time had a higher chance of winning in overtime. In other words, did the last-minute
    tie that led to extra minutes result in psychological momentum that drove the
    come-from-behind team to a win? Their statistical models didn’t find that to be
    the case. But what their results did uncover is a variety of variables that did
    drive success: home court advantage, for example, where the energy of crowds contributes
    to a team’s drive, and the team’s season record, where sustained levels of high
    performance built upon itself. Their study also stands out as one that deserves
    a follow-up study—one that doesn’t use a final score win as the dependent variable
    of interest but, rather, looks at the factors that led the losing team to achieve
    a comeback great enough to lead to overtime to begin with.


    In this book, we recognize that the final score matters, but equally so, we are
    interested in understanding how a team that’s struggling finds itself able to
    rally, improve, and seize a moment. The “final” outcome may leave them a point
    or two short of a `W` in a particular battle, but it is the bigger picture that
    matters just as much. Of course, final `W`’s matter too. Consider the 2004 American
    League Championship Series where the Boston Red Sox, down 3–0 to the New York
    Yankees, staged one of the most remarkable comebacks in sports history. The team’s
    dynamics, strategic decisions, and adjustments made during the series primed them
    for this surge. The psychological boost from each win reinforced their belief,
    creating a self-fulfilling cycle where momentum became more than just a feeling—it
    became a force that was tactically leveraged.


    This concept extends beyond sports. In the 1948 US presidential election, Harry
    Truman’s unexpected victory over Thomas Dewey is also attributed to his relentless
    campaign momentum. And this momentum wasn’t merely an accident. Truman’s team
    tapped into emerging voter sentiments, adjusted their strategies to capitalize
    on Dewey’s complacency, and effectively communicated a message that resonated
    with a fragmented electorate. What looked to the world like a natural wave of
    support was rooted not in chance but in the deliberate, strategic choices Truman
    and his team made.


    In military history, the Battle of Midway is often cited as a pivotal moment in
    World War II, where momentum shifted decisively in favor of the Allied forces.
    Once again, this turnaround was the result of deliberate intelligence operations,
    strategic decisions, and tactical executions that set the stage for this shift.
    The momentum that followed was not just a consequence of these actions but was,
    in part, created by them.


    Similarly, in the business world, Apple’s resurgence under Steve Jobs is frequently
    described as a momentum-driven comeback. And once again, the momentum witnessed
    by observers was not simply by chance. Apple’s resurgence was carefully cultivated
    through innovation, strategic leadership, and the ability to capture the zeitgeist
    of the early twenty-first century. The introduction of the iPod, and later the
    iPhone, didn’t just ride a wave of consumer interest—they created it, fueling
    a momentum that propelled Apple to unprecedented heights.


    In other words, teams, leaders, and organizations that successfully harness momentum
    do so by understanding and manipulating the conditions that allow it to flourish.
    The result may look effortless to observers—and, in the moment of a surge, may
    in fact feel effortless to the “players” too—but make no mistake, the often-hidden
    factors behind a reversal in momentum are born out of preparation, mindset, team
    climate, and leadership that together recognize and act upon a spark.


    # About the Authors


    **DON YAEGER** is a twelve-time `New York Times` bestselling author, longtime
    associate editor at `Sports Illustrated`, and today one of the most demanded public
    speakers on the corporate circuit. He delivers seventy speeches a year to an average
    annual audience of one hundred thousand people. He lives in Tallahassee, Florida,
    with his wife and two children. He is the host of the highly rated `Corporate
    Competitor Podcast` and offers training courses developed from his years of research
    into high-performance habits. Learn more at `www.donyaeger.com`.

