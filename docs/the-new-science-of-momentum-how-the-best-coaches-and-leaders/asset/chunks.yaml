    Brenneman acknowledges that the complexity of a turnaround can be overwhelming
    and combats that—at least on some level—with a focused, one-page plan. For leaders
    walking into a struggling environment, Brenneman’s first piece of advice is to
    create a simple, actionable plan. “You can put a one-page plan together in fourteen-point
    font,” he advises, distilling complex strategies into focused actions. For Brenneman,
    this isn’t about condensing a company’s problems into oversimplified bullet points.
    It’s about identifying the four or five critical areas that need attention and
    creating a focused, actionable road map. The genius of the one-pager is its accessibility—everyone
    in the organization can understand it, align with it, and act on it.


    At Continental, rather than flood his team with data or elaborate strategies,
    the one-page plan focused attention on four key areas: market, financials, product,
    and people. Under each category, Brenneman outlined a few specific goals that
    would steer the company back on course.


    #### The Four Key Areas of the Plan


    The market section of the plan was dubbed “Fly to Win,” a reminder to focus only
    on profitable routes. “Why are we flying Greensboro to Greenville eight times
    a day when both customers are on the first flight?” he asked. The simplicity of
    this approach allowed his team to quickly make critical decisions about where
    to focus their resources.


    On the financial front, Brenneman knew Continental needed to get its house in
    order. “Fund the Future” became the rallying cry, a commitment to managing costs
    while making investments that would set the airline up for long-term success.
    The product section—“Make Reliability a Reality”—was Brenneman’s way of telling
    the company to get back to basics: deliver customers to their destinations on
    time, with their luggage, and a good meal.


    But Brenneman knew none of these changes would stick if the people weren’t on
    board. So the final quadrant of the plan was “Work Together”—a call for unity
    among employees who had long been divided by distrust and internal conflict. This
    wasn’t just about slogans—it was about tangible actions. He even introduced on-time
    performance bonuses to create a direct incentive for employees to care about the
    airline’s success.


    #### Creating Small Wins


    Toward this goal, Brenneman emphasized to us the importance of creating small
    wins early. At Continental, one of his most famous initiatives was an on-time
    performance bonus. The company had consistently ranked last in getting flights
    out on time, so Brenneman offered employees a cash bonus—sixty-five dollars for
    ranking third and one hundred dollars for first place. The results were nearly
    immediate: “By month three, we were third, and by month five, we were first,”
    Brennaman recalled to us. This not only saved the company millions in operational
    costs but also transformed employee morale, giving everyone tangible proof that
    success was possible. A simple plan had brought results almost immediately.


    The beauty of Brenneman’s one-pagers wasn’t just their brevity—it was their clarity.
    Everyone, from executives to frontline employees, knew exactly what needed to
    be done. These plans didn’t get buried in a desk drawer; they were living, breathing
    documents that guided decisions and inspired action. “As soon as you say something
    more important than what’s on this page, I’m going to scratch off something on
    this page and put it there,” Brenneman explains, underscoring his relentless focus
    on what truly mattered.


    #### Engagement and Momentum


    Another key element of reversing momentum is engaging directly with your people.
    Brenneman didn’t just sit in the executive suite; he spent time in the trenches.
    “Every Friday afternoon, I’d go to the airport and spend time in the pilots’ lounge,
    the mechanics’ break room,” he recounts. Building trust with employees allowed
    him to break down the walls between management and the workforce, fostering a
    culture of cooperation rather than division.


    But perhaps Brenneman’s most profound insight is that momentum, whether positive
    or negative, is powerful. He likens it to pushing a tire up a hill: “Once you
    got it rolling, you could just whack it every once in a while, but absolutely,
    one thing begets the other.” Positive momentum breeds success, while negative
    momentum—if left unchecked—leads to further decline. “Failure can beget failure
    if you don’t believe you can stop it,” he warns. The secret lies in recognizing
    the small signals of change, capitalizing on early wins, and maintaining relentless
    focus on improvement.


    For anyone facing a seemingly impossible turnaround, Brenneman offers a road map:
    Face the brutal facts, simplify your strategy, and involve your people in the
    solution. Road maps usually imply an order of things—one task after another. But
    when asked what leaders and teams should do first, his response doesn’t offer
    a linear solution. At Continental, for example, Brenneman’s team would ask what
    they should tackle first—the meals, the carpet in the terminals, baggage issues,
    or what.


    “I would tell them, you got to do it right away and all at once, because it’s
    all kind of cumulative. . . But I always tell people, start with the five F’s:
    faith, family, friends, fitness, finance, right?”


    Momentum is never static—it’s either moving with you or against you. And as Brenneman’s
    career proves, when things are at their worst, it might be the exact right time
    for a leader to step in with clarity, conviction, and belief that success is within
    reach.


    • • •


    Maybe no team in the history of sports needed a reversal of momentum as desperately
    as the Baylor University men’s basketball team. In the summer of 2003, the team
    made national news for all the wrong reasons. One of their players, Patrick Dennehy,
    went missing, and his teammate Carlos Dotson was eventually arrested and charged
    with Dennehy’s murder. In the aftermath of that tragedy, Baylor’s coach, Dave
    Bliss, was secretly recorded encouraging coaches to lie to investigators about
    the circumstances surrounding Dennehy in order to cover up illegal payments Bliss
    was making to a number of players. In August of that year, Bliss and the school’s
    athletic director resigned in shame.


    The team was facing severe penalties and possibly even the harshest sanction of
    all: the termination of the program. Historically an underperforming team, the
    Baylor job was now radioactive to coaches with any pedigree. But to Scott Drew,
    who had just completed his first season as a head coach at midmajor Valparaiso
    University in Indiana, it was the opportunity of a lifetime. Drew didn’t just
    consider the job, he pursued it, sensing the chance to essentially reverse all
    that negativity at the largest Baptist university in the country and instill the
    right values from bottom up. “Our real goal in the early years was to come from
    that deep place and get to a place where people would talk about Baylor without
    mentioning the tragedy,” Drew said.


    To do this, Drew and his staff did several things to eliminate the negative momentum
    from the previous scandal and tragedy-fueled seasons as they headed down the long
    road back to respectability. Respect was earned quickly, and the ultimate testament
    to the journey came in 2021 when the team won a national championship.

