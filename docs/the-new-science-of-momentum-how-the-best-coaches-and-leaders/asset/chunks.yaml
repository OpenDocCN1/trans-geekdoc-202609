    # Introduction


    During the first quarter of Super Bowl LI in February 2017, the Nielsen Company
    estimated two hundred million viewers around the globe were tuned to their televisions,
    ready for that year’s most-watched sporting event. By the third quarter, nearly
    half the audience was gone. The Atlanta Falcons were pounding the favored New
    England Patriots, and few outside of Georgia’s capital city wanted to watch a
    rout.


    Through the first half, everything that could go right for the Falcons did. Conversely,
    New England was not much fun to watch, with quarterback `Tom Brady` getting sacked
    multiple times, throwing incomplete passes to wide open receivers, and nightmare
    of all nightmares for a `Bill Belichick` team, making silly mistakes like fumbling
    a handoff to running back `LeGarrette Blount` that the Falcons converted into
    a touchdown soon after. Even when the Falcons faltered, as they did during the
    final seven minutes of the first half, the hapless Pats could manage only a field
    goal. Three points. That was all the scoring the high-powered New England offense
    registered during the first thirty minutes of play.


    “In football you’re always playing for what we call the second half swing,” Patriots
    cornerback `Devin McCourty` said in an interview for this book. “That’s where
    you want to get the ball and go down and score just before halftime, then get
    it again to start the second half and score again. You take over the momentum
    of the game and the other team feels like they are done. For us in that game,
    it was the complete opposite.”


    Coming out of the locker room, the Falcons scored again and, midway through the
    third quarter, led New England 28–3. “If you’re New England, that’s not what you
    want to see,” announcer `Joe Buck` said, as the camera zoomed to `Belichick` deadanning
    on the sideline.


    No, it was not.


    “I was sitting on the sidelines saying to myself you are getting your butt embarrassed,”
    `Brady` recalled years later. “Go out and do something. Let’s just get one touchdown.”


    And then a small victory came New England’s way. On third down with eight yards
    to go, `Brady` was forced out of the pocket—always an uneasy moment for Patriots
    fans—but scrambled convincingly for a first down. A few plays later, he threw
    a short touchdown pass to running back `James White` to make it 28–9. The crowd
    cheered but, at this point, the outcome still seemed foregone. The Patriots missed
    the extra point, but at least the score seemed a bit more respectable.


    “Once we scored, I asked the defense to just get one stop, just one,” `Brady`
    said. “They did and then we drove the field and kicked a field goal.” There was
    9:44 left in the game. “I looked over at the scoreboard and said it was only a
    two-score game.”


    Just over a minute of game time later, with Atlanta still leading 28–12, Falcons
    quarterback `Matt Ryan` dropped back to pass and was engulfed by Patriot linebacker
    `Dont’a Hightower`, causing `Ryan` to fumble. The Patriots recovered the ball
    on the Falcons’ 25-yard line.


    “That strip sack by `Dont’a` was the moment when you could feel it turn,” `McCourty`
    said. “In that moment, we all looked at each other and said, ‘We can win this
    game.’ Guys on both sides of the ball started making plays off the energy we gained
    from that one play and the belief was on our side.”


    “You felt it,” `Brady` said. “We had some juice. Those little plays were becoming
    a snowball.”

