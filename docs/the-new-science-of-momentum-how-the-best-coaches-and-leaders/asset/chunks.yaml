    `BERNIE BANKS` 是莱斯大学 Doerr 新领导力学院（Doerr Institute for New Leaders）的院长，同时担任该大学
    Jesse H. Jones 学院商学院的领导力实践教授。


    Bernie 于 2016 年从美国陆军退役，享将衔。在最后一个职位中，他成功领导了西点军学院的行为科学与领导力部门。他曾领导过多个规模从十人到三千人的等的军事单位。此外，Bernie
    还与全球各机构就其领导力培养工作进行了广泛交流。

