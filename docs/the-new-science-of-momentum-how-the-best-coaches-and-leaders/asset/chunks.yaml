- fmt: '

    Similarly—at least in terms of the popular concept of momentum—“success” is a
    related term. Momentum and success are linked, yes—but they are also distinct
    from each other in a few important ways. Success refers to achieving a goal or
    desired outcome, often as a result of hard work, talent, skill, or some combination
    of these factors. Success can be a onetime event, such as winning a championship
    or securing a major business deal, or it can be an ongoing state, such as a successful
    career or a thriving business. Momentum, on the other hand, is more the feeling
    or state of mind that builds over time as a result of a series of successful outcomes
    or positive events. It is the sense that things are going in a positive direction
    and that success (or more success) is on the horizon.


    One way to think about the difference between momentum and success is to consider
    an athlete who has won a major championship. The athlete has achieved success,
    but they may or may not have a sense of momentum. If the athlete feels that their
    win was a fluke or that they got lucky, they may not have a sense of momentum
    going into their next competition.


    Finally, it’s important to consider that momentum is time-limited and fragile.
    Even a single setback or failure can break the positive feedback loop that generated
    the momentum, leading to a loss of confidence and energy. This is why momentum
    is often described as a “fleeting” or “transient” state.


    The temporality of momentum is noted by many scientists and practitioners alike.
    In our interviews, various people noted that momentum isn’t (and shouldn’t be)
    endlessly sustainable but rather a force that comes in waves. Visualizing momentum
    through various models, Coach Sue Semrau sees momentum as a sigmoid curve, and
    General Bernie Banks thinks about it as something analogous to how the Yerkes-Dodson
    curve depicts the relationship between arousal and performance.


    ![](images/f016-01.jpg)


    In both of these models, successes punctuate, and momentum ebbs and flows.


    We recognize momentum as a cycle—it can’t and shouldn’t be the constant goal.
    We aren’t suggesting that if you get on a roll that it goes forever. The question
    is—how to make it go five plays longer, five minutes longer, one quarter longer.


    ### Measuring Mo


    To measure something, it first must be perceptible. While there’s a range of how
    momentum is perceived, there’s no doubt it can be felt. And people sure put their
    money where their Mo is.


    ![](images/f017-01.jpg)


    Large-scale data studies have demonstrated that professional gamblers bet more
    on teams that they perceive as having momentum, and not just by a little bit.
    One study analyzed a high-frequency dataset of a major bookmaker in German football,
    and found that bettors stake about 40 percent more on teams that they believe
    have momentum versus those that just lost a game.


    Even though this analysis also found no evidence that perceived momentum mattered
    on average for match outcomes, and didn’t seem to be associated with the bookmaker
    offering more favorable odds, the perception of momentum nevertheless influenced
    betting behavior.


    Another study, looking at sports betting in the NBA, similarly found the existence
    of a “momentum effect” in which gamblers incorporate beliefs about momentum into
    their bets. These studies illustrate that sports bettors trust momentum as a variable
    that matters to future outcomes but, at the same time, seem to overstate its influence
    relative to other factors.


    Indeed, there’s a spectrum of where people place Mo in terms of its relative influence
    on outcomes—sometimes depending on whether they’re on the giving or receiving
    side of it.


    In social psychology, there are various concepts relating to how, or what, people
    attribute successes or failures to. With attribution bias, people tend to explain
    others’ behavior based on individual characteristics rather than considering external
    factors. For example—to assume that a person struggling to find employment is
    lazy rather than to believe that situations in that person’s life have left them
    at a difficult disadvantage. The opposite concept, “self-serving bias,” reverses
    these assumptions. Here a person may attribute their own successes to their personal
    characteristics or efforts rather than to the environment around them. To keep
    with the prior analogy, a young person who scores a high-paying job may attribute
    this hiring to their own competence versus family connections to the company’s
    leadership.


    Sometimes, though, Mo can be felt even before an outcome happens—before the winning
    shot is scored or a battlefield captured. People self-report how they, or full
    crowds, seem to recognize momentum when it’s just about to happen—not just as
    a retrospective explanation for a success but as a qualitative feeling as it’s
    approaching.


    How, then, can Mo be measured?


    ### Finding the Right Indicators and Tools


    The issue with momentum isn’t an “I’ll believe it when I see it” kind of thing.
    Because people do believe it exists and do believe they’ve seen it. Rather, the
    challenge is finding scientific tools that are sensitive enough to measure Mo
    in social contexts—such as in military, sports, business, or politics.


    Unlike in a controlled physics experiment where mass and speed can be precisely
    measured, momentum in everyday life may lack clear, objective indicators.


    While all instances of momentum involve motion, or a surge in progress, not all
    occurrences of progress are, in fact, momentum. We know that success isn’t itself
    momentum. How much progress or how much success does it take for something to
    reach a threshold of being momentous? Is it a quantity of progress, or a feeling
    of it?


    Questions like these, where the dependent variable itself is uncertain, can be
    uncomfortable in hard science, but not impossible. The scientific method requires
    investigators to disprove a hypothesis that an observed outcome is simply chance.
    In some studies, the dependent variable (outcome) and independent variables (factors
    that may influence it) are easy to measure and are highly distinct from one another.


    Take, for example, a study on how light travels in different conditions. The null
    hypothesis could be something like “There’s no difference in the speed of light
    in a vacuum and in water.” Data would be collected by objective tools, and the
    null hypothesis would ultimately be rejected—after tests and retests, it would
    be shown that light does in fact travel at different speeds in different mediums.


    Other questions involve some degree of subjectivity, such as in drug trials on
    the effectiveness of pain medication. For example, the “null hypothesis” may be
    that there’s no difference in pain relief between drug A and a placebo. In a controlled
    trial, researchers may find that patients who took drug A and patients given a
    placebo look about the same, statistically, in terms of self-reported pain levels.
    In this case, the null hypothesis couldn’t be rejected, and any differences in
    pain levels between treatment and placebo groups may be explained by mere chance.


    Finally, there are questions that involve either huge numbers of variables, high
    levels of subjectivity, or both. That’s where studies on momentum in social situations
    often fall. In a classic social experiment on momentum, researchers are tasked
    with disproving the assumption that a sustained surge in performance falls within
    a range that could be explained by chance.

