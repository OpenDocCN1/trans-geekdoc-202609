    Ridge began to put in place cultural requirements at WD-40 to avoid repeats of
    stagnation, confusion, and resentment. “We put in the company permissions and
    the maniaciac pledges, which gives people unilateral permission. And we all live
    it. Live it every day,” Ridge explained. Indeed, employees know this pledge, as
    does anyone who takes a deeper walk through the `WD-40` website.


    “I am responsible for taking action, asking questions, getting answers, and making
    decisions,” the pledge reads. “I won’t wait for someone to tell me. If I need
    to know, I’m responsible for asking. I have no right to be offended that I didn’t
    ‘get this sooner.’ If I’m doing something others should know about, I’m responsible
    for telling them.” Ridge explains, “The Maniac Pledge is about the honesty of
    action and the honesty of communication.”


    `WD-40`’s culture is one of fearlessness where employees feel safe to take risks,
    make mistakes, and learn from them without fear of retribution. Ridge understood
    that for the company to innovate and grow, employees needed to feel empowered
    and supported. And that, beyond being coworkers, these individuals formed what
    was really a tribe.


    To Ridge, the possibility for momentum is enhanced when a group of people come
    together as part of something bigger than themselves.


    “A group of people going in the same direction are going to have more momentum
    than a group of individuals running in different directions, right?” Ridge stated
    more than asked. “When we talk about tribes, we’re talking about the behavior
    of tribes that existed at the beginning of mankind. Now, the thing that was really,
    really powerful, that was very helpful for me was, the number one responsibility
    as that tribal leader is to be a learner and a teacher. So our whole concept of
    coaches and teaching and learning was all around, how do we help those we have
    the privilege to lead step into the better version of themselves? Now, you know,
    if I was to take you back thousands of years to my homeland, Australia, and we
    were at, we’re actually observing a group of Indigenous Australians, what would
    the tribal leader be doing? He’d be teaching the younger tribe members to throw
    a boomerang. Why? Because the boomerang was the tool of survival. And without
    competency around a boomerang, the tribe would not be able to exist. So this whole
    tribe thing was, again, it gets back to people wanting to belong. They want to
    know they’re part of something bigger than themselves.”


    `WD-40` tribe members know their company’s values, know their company’s leaders,
    and enjoy a sense of belonging and purpose. Like the lubricant they sell to make
    hinges and other surfaces less sticky, team climate at `WD-40` is the formula
    that reduces friction and drives success.


    ### The Science of Early Bonding


    From nearly the moment of birth, an infant’s brain is finely tuned to their mother’s
    voice, face, and scent. You might know this already from observation—but we no
    longer have to question whether the observed bond between mother and baby is imagined.
    Through advanced imaging techniques and biometrics, researchers can literally
    observe and measure what a strong bond between individuals looks like physiologically.
    Studies utilizing functional magnetic resonance imaging have shown that hearing
    their mother’s voice activates specific regions of an infant’s brain more robustly
    than any other voice. This is true for biological children and adopted children
    alike.


    One study by `Abrams et al. (2016)` found that when infants hear their mother’s
    voice, there is heightened activity in regions of the brain associated with emotion
    and reward processing, such as the `amygdala` and `ventral tegmental area`. This
    response was significantly stronger than when the infants were exposed to the
    voices of unfamiliar women. This suggests that a mother’s voice not only soothes
    and comforts but also plays a critical role in emotional and social development
    by activating neural circuits linked to bonding and attachment.


    The sight of a mother’s face is another powerful stimulus for an infant’s brain.
    Research by `Bushnell et al. (1989)` and subsequent studies have shown that infants
    as young as a few days old can distinguish their mother’s face from those of other
    women. Using eye-tracking technology and electrophysiological measures, scientists
    observed that infants spend more time looking at their mother’s face and show
    greater neural activation in the visual cortex. And beyond mere recognition, `Haan
    and Nelson (1997)` found that when infants viewed their mother’s face, there is
    increased activity in the `fusiform gyrus`, a brain region crucial for face recognition.
    Even the sense of smell plays a significant role in the mother–infant bond. `Porter
    et al. (1992)` employed olfactory tests to show that infants, when exposed to
    breast pads worn by their mothers versus those worn by other women, exhibited
    distinct behavioral preferences and physiological responses.


    Furthermore, studies using near-infrared spectroscopy have found that the brain’s
    olfactory regions light up more intensely when infants are exposed to their mother’s
    scent. This preferential activation suggests that a mother’s unique scent not
    only comforts the infant but also stimulates brain regions associated with recognition
    and memory, reinforcing the emotional connection. Unsurprisingly, then, the simultaneous
    exposure to a mother’s voice and face results in even more strongly enhanced neural
    synchrony in the infant’s brain.


    ### Expanding the Circle of Connection


    This type of bonding isn’t limited to moms. Research regarding newborn response
    to fathers and siblings shows similar patterns. And the neurophysiological response
    to one another is a two-way street. Literally, these new, foundational relationships
    change how brains function. For example, the transition to fatherhood involves
    significant changes in brain activity that support bonding and caregiving. A study
    published in *Social Neuroscience* by `Narcis A. Marshall and colleagues (2022)`
    examined brain connectivity in first-time fathers. During the study, expectant
    fathers underwent `functional MRI` scans both during their partner’s pregnancy
    and six months after the birth of their child. They found that greater resting-state
    functional connectivity between regions such as the `medial prefrontal cortex`
    and `lateral occipital cortex` was associated with increased empathy and stronger
    father–infant bonding. This connectivity was also linked to more supportive and
    effective parenting behaviors.

