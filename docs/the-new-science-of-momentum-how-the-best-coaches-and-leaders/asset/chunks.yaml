  raw: 'In the late 1990s, Iacoboni and his team at UCLA conducted groundbreaking
    experiments that provided the first evidence of mirror neurons in humans. These
    findings, published in his seminal paper “Cortical Mechanisms of Human Imitation”
    in 1999, opened up new avenues in the study of social cognition and empathy. The
    implications of this discovery are vast. Mirror neurons suggest that our brains
    are wired for empathy and understanding others, providing a neural basis for the
    age-old adage of “walking a mile in someone else’s shoes.” This neural mirroring
    process enables humans to understand the actions, intentions, and emotions of
    others, fundamentally shaping our social interactions and cultural developments.


    Iacoboni’s work has established that mirror neurons are not just about imitating
    actions but also about comprehending the intentions behind them (“Grasping the
    Intentions of Others with One’s Own Mirror Neuron System,” 2005), and how these
    neurons affect everything from learning and language development to empathy and
    social bonding, making a compelling case for the centrality of these neurons in
    human experience (“Mirroring People: The New Science of How We Connect with Others,”
    2008).


    We were thrilled that Iacoboni agreed to sit for an interview with us early in
    our project. We had learned of Iacoboni through colleagues, who described him
    as both intellectually rigorous and deeply empathetic, a combination that mirrors
    his approach to research and the very topic of its study. More than anything,
    we wanted to hear Iacoboni’s unfiltered thoughts on the question of whether there
    could be a relationship between mirror neurons and group momentum.


    “Imitation is a way of building trust and empathy from the bottom up in teams,”
    Iacoboni shared with us. “It’s fairly easy to do in different practices. You can
    practice individually, but you can also build the practice in a way which results
    in a lot of imitation between teammates, which can create more sense of belonging.”


    Iacoboni sprinkles philosophy into his answers—quoting Roman emperor Marcus Aurelius
    and drawing attention to a core tenet of the stoic mindset: “What really matters
    is not what happens to you, but how you react,” Iacoboni told us, suggesting that
    empathy between team members can even help insulate individuals from negative
    spirals following mistakes. And that’s not the only way mirror neurons may influence
    the group experience of (or likelihood for) momentum. Mirror neurons relate to
    various other aspects of organizational momentum.


    *   *Role modeling by leaders:* Leaders in organizations often set examples through
    their behavior, work ethic, and attitudes. When leaders demonstrate high energy,
    commitment, and strategic vision, mirror neurons in employees can lead them to
    imitate these behaviors, creating a ripple effect of positive actions and attitudes
    across the organization.


    *   *Emotional contagion:* Mirror neurons play a crucial role in emotional contagion,
    where the emotions of one person can be mirrored and shared by others. In organizations,
    when key individuals or groups exhibit positive emotions, such as enthusiasm and
    optimism, these feelings can spread throughout the organization, enhancing morale
    and collective motivation.


    *   *Shared goals and vision:* Mirror neurons help individuals understand and
    internalize the intentions and goals of others. In an organizational context,
    when leaders and managers effectively communicate a clear and compelling vision,
    employees are more likely to align their own goals with this vision, creating
    unified momentum toward organizational objectives.


    *   *Coordination of efforts:* Effective collaboration and teamwork often rely
    on the ability to anticipate and respond to the actions of others. Mirror neurons
    enhance this ability, allowing team members to synchronize their efforts and work
    more efficiently toward common goals. This coordinated effort can drive organizational
    momentum, as teams move in harmony toward achieving targets.


    ##### LEADER ACTIONS


    Henry Ford once said, “Coming together is a beginning, staying together is progress,
    and working together is success.” Team climate can influence all three things.
    Leaders must ensure a positive climate exists in addition to an effective culture.
    Here are three actions leaders can take in pursuit of that obligation.


    ACTION 1:


    Enhance psychological safety.


    In his book *The 4 Stages of Psychological Safety*, Timothy R. Clark describes
    four key elements or “stages” required for a psychologically safe environment:


    1.  **Inclusion:** People feel accepted in the workplace.


    2.  **Learning:** Team members feel safe asking questions, making mistakes, and
    giving feedback.


    3.  **Contributing:** Team members feel confident and comfortable making their
    own contributions to the team.


    4.  **Challenging:** All team members feel they can question or even criticize
    processes and protocols when they see something could be improved.


    ACTION 2:


    Routinely recognize teams and team members who are meeting expectations.


    Leaders must reward accomplishments to motivate team members to continue working
    hard in service of meeting or exceeding standards. A 2022 *Harvard Business Review*
    article by Jack Zenger and Joseph Folkman references a study regarding employee
    engagement and recognition. The study examined tens of thousands of 360-degree
    assessments conducted by the firm Zenger Folkman. Leaders rated in the top 10
    percent for providing recognition achieved an average employee engagement percentile
    of 69.8. Conversely, leaders rated in the bottom 10 percent achieved an average
    employee engagement percentile of 27.4.


    ACTION 3:


    Routinely ask for feedback.


    For leaders to understand how their actions are being received, they must receive
    objective feedback. The book *Thanks for the Feedback: The Science and Art of
    Receiving Feedback* by Sheila Heen and Douglas Stone details a simple practice
    that can enhance the likelihood of receiving feedback and its quality. They encourage
    people not to ask for broad, open-ended feedback. Instead, their research has
    concluded that asking people for “one thing” is more effective. For example, such
    a question could be structured as follows: “What’s one thing you would encourage
    us to keep doing?” Receiving effective feedback can aid leaders in serving as
    more effective agents for their teams.


    ## [11](#nav.xhtml#sec12)


    ## [Belief and Mindset](#nav.xhtml#sec12)


    The University of Oregon’s gymnasium was a cauldron of anticipation that night.
    The Ducks women’s basketball team, ranked second in the nation, was expected to
    dominate against UCLA’s then unranked team. But somewhere amid the frenzy of the
    crowd and the intensity of the game, UCLA’s head coach, Cori Close, observed something
    peculiar: Her team, facing a daunting 21-point deficit, displayed an unusual calm.
    Their body language, far from defeated, was almost serene. It looked like they
    knew something that the roaring sea of Oregon fans did not.


    Close watched from the sidelines, her pulse quickening with the mounting pressure.
    Yet her players exuded a quiet confidence. They moved with a steadiness that belied
    the score. Every gesture, every movement suggested not just hope but an unwavering
    expectation. It wasn’t bravado; it was belief. As the minutes ticked away, the
    Bruins chipped away at Oregon’s lead, point by point, possession by possession.'
