  trans: '


    但这条标语最初并不是一个面向公众的口号。相反，`Carville` 将这三条陈述作为一份内部备忘录，挂在 `Clinton` 的小罗石总部，以帮助员工保持口径一致。可以说，这是竞选团队的私人策略手册——一套组织中每个成员都会同意并围绕之展开的要点。


    它起效了。`Clinton` 竞选团队那凝聚力的信息不断涌现，正如一个组织找到了其内部节奏时所发生的那样。


    “它开始产生连锁反应，”`Carville` 告诉我们。


    • • •


    ### 政治舞台 vs. 竞争


    在继续之前，让我们后退一步，看看政治舞台与其他形式的竞争有何不同，或者在哪些方面是相似的。将政治视为一项团队运动并不难——显而易见，在每位候选人周围都有一个竞选结构，而在该竞选周围，是各种程度对齐的组织：国家政党及其地方分支、倡导团体、在特定问题上达成共的选民群体、捐赠者等。


    虽然人们倾向于将候选人视为竞选组织的四卫球员或首席执行官，但这并不一定是最准确的类比。也许在地方选举或选举周期的早期，候选人确实承担了这一角色——但在总统政治层面，候选人只是一个庞大机器中的一个（尽管非常重要）零件。在某种意义上，候选人可能更像吉祥物——一个象征团队的物体，在球场上推进，承担着几乎所有的最终责任，并在吸引旁观者的全部注意力，而镜头外充满动作的世界则推助着每一次进攻。


    同样有助于我们的是，政治竞选周围的组织在组织程度上远不如军事部队或真正的运动队那样有组织。总统竞选有多个经理指导各州的运作，实地团队由由薪职员工和志愿者组成，而在那个层面的控制力要少得多。这些行动受到利益集团和捐赠者偏好的包围和影响，而这些人的背后往往具有竞争性的动机或政策目标。这里有大量的投入，而且并不总是完美的金字塔结构。


    ### 衡量政治中的动能


    此外，虽然在运动场上的前进是显而易见的，但政治上的进展并不总是如此确定。在某种程度上，这是因为在政治中衡量“动能”的能力（除选举当天的结果外）依赖于不完美的工具：如民意调查、集会出席人数和捐赠额等仪器。这些是成功的指标，但其中任何一项单独来看都不是成功的完美预测因素。


    这是因为国家政治的成功不仅取决于个体行动者的态度和情感感受，还取决于他们的行为。竞选团队可以以非凡的团结、流畅和灵敏进行运作——可以做好准备、保持专注并彼此契合——但如果人们没有被促使采取独立行动（表现为投票），竞选的目标就失败了。这意味着，政治顾问的工作很大程度上取决于直觉、本能和动力——正是这些特征让
    `James Carville` 能够那样脱颖而出。


    ### 认可的力量


    从他今天的视角来看，`Carville` 的观点包含了他自己之外的许多成功。


    “2020 年 `Joe Biden` 是最伟大的动能之一，”`Carville` 在描述民主党初选时说道，“他在 `爱荷华` 和 `新罕布什尔` 的表现非常糟糕，在
    `内华达` 稍微好了一点，然后他去了 `南卡罗来纳` 并横扫了那里，所有人都一起说：‘妈的，这事儿完了。’接着他在 `弗吉尼亚` 和其他所有地方都席卷了一片。所以他在二十四秒、二十三秒，最后两秒的时间内从零飙到了六十。这是选民对他给予认可引起的。”


    `Carville` 概述了“`弗吉尼亚` 的郊区妇女看到了 `南卡罗来纳` 黑人的投票情况，她们说：‘好吧，这是我们的人。’。当他们看到每个人都压倒性地愿意给他投票时，整个政党都改变了主意。”


    也许 `Carville` 最近的动能经历发生在初选阶段，这并不意外。`Carville` 认为，那里确实是行动发生的地方，至少在影响更大范围选民的动态方面如此。“在大选举中，我们极化非常严重。你并没有像初选那样有那么多可以改变主意的可用选民，”他说。


    对 `Carville` 来说，其他选民的认可是政治动能的关键要素——选民看到其他人如何回应候选人，并想：“嗯，既然他们觉得他行，那我也觉得他或她行。”而这似乎就是
    `Joe Biden` 在 `南卡罗来纳` 身上发生的事。他的竞选在当时正陷入困境。他在早期初选州的表现并不理想，并且正在关闭 `加利福尼亚` 的办事处，因为竞选没钱了。


    “他们没有任何资金，”`Carville` 说，“在 `Jim Clyburn` 介入之前，一切都是虚无。我从未见过那种景象。他们没有总部。他们什么都没有。他们只是在
    `南卡罗来纳` 到处闲逛，而在那个周四，他直接落下了重锤。”


    ### 南卡罗来纳的转折点


    `Carville` 并没有夸张。众议院多数党鞭 `Jim Clyburn` 是国会中地位最高的非洲裔民主党人，在 `南卡罗来纳` 民主党初选几天前，他通过对
    `Biden` 背书，独自为这位前副总统的竞选扭转了局势。`Biden` 的政治生涯在到处都处于生命维持状态，包括 `南卡罗来纳`。他的民调领先优势是个位数，而对手（包括亿万翁
    `Tom Steyer` 和 `Bernie Sanders`）正在取得巨大进展。`Clyburn` 看出了这一点，并告诉 `CNN`，民调在“接近选举时通常会‘收紧’。”比赛中的每位候选人都想要
    `Clyburn` 的背书，但 `Biden` 得到了。


    “一旦他那样做了——加速。完全是。理解一下——从那时起，他以总票数的 63% 赢得了[南卡罗来纳]初选，”`Carville` 说，“那是黑人选民、郊区选民，是这一切。而且这很重要。一旦那个晚上降临，一切都结束了。就在瞬间，结束了。我的意思是，这真的很了。”


    随后的连锁反应是意义巨大的。`Biden` 在 `南卡罗来纳` 的决定性胜利导致多位温和派对手退出竞争，包括 `Pete Buttigieg` 和 `Amy
    Klobuchar`。在一种显然的链反应中，其他各种备受青的背书，例如参议院民主党领袖 `Harry Reid`、`Barack Obama` 的美国大使
    `Susan Rice` 以及前候选人 `BetoRourke`，都支持了 `Biden`。


    `南卡罗来纳` 选民的认可似乎比高知名背书更有意义。“这次胜利似乎引发了南部州民主人和少数族裔支持的骨牌效应。在周二的 14 场初选中，`Biden` 赢得了每一个南部州。根据出口民调，`Biden`
    在这些关键州的胜利很大程度上归功于少数族裔的强力支持，”`Daniel Strauss` 2020 年 3 月 4 日写于《卫报》。


    比赛中最后一位温和派民主党人 `Michael Bloomberg` 很快也退出了竞争，并将背书给了 `Biden`。毫无疑问，`Jim Clyburn`
    为 `Biden` 的竞选点燃了火柴。但如果下面没有引燃并维持火焰的燃料，结果将是转瞬即逝的。在 `Biden` 的运作表面下，某些东西准备就绪，迎接着动能。


