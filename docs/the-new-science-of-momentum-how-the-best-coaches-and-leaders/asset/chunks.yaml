    比尔·福特（Bill Ford）深信穆拉利（Mulally）正是福特所需的“火花”，以至于他甚至如果为了达成交易有必要，愿意放弃董事长职位。最初，董事会通过共同介绍人（大陆航空前主席兼首席执行官戈登·贝休恩）与穆拉利建立联系。但福特与穆拉利之间的多次私下会话，最终奠定了后者出任
    CEO 职位的基础。


    穆拉利曾说：“领导力就是拥有引人注目的愿景、周密的计划、不懈的执行以及优秀人才共同努力。”创造出这四项成果并非易事。福特汽车在 2006 年亏损了 127
    亿美元，2006 年至 2008 年间总亏损达 300 亿美元。然而，到 2009 年，它重新实现了盈利，并彻底革新了其产品阵容。该公司也是唯一一家拒绝政府救助资金（问题资产纾困计划）的大型本土汽车制造商。穆拉利的招聘和领导帮助重塑了公司文化，并改变了他们准备竞争和获胜的方式。那么，他是如何做到的呢？穆拉利利用十一项原则，通过其每周的“业务计划审查”（BPR）驱动的有效沟通，驱动信念并创造了绩效文化。


    BPR 涉及利润中心领导者和十二个职能部门负责人。由于公司长期存在的部门孤岛（源于大量分散的品牌）以及内耗斗争的声誉，最初将 BPR 整合到组织流程中非常困难。此外，领导者们并不习惯在沟通中强调缺点。


    穆拉利的 BPR 要求领导团队的每位成员都要简述其主要项目的状态（绿色表示“按计划进行”，黄色表示“需要注意”，红色表示“紧急情况”）。所有的 BPR 项目都与运营目标挂钩，这些目标对促进盈利增长起着作用。任何产生、延迟或增加公司盈利增长成本的因素都会衡量并分配到一个颜色标记的状态图中。但在启动该流程后的几个月里，领导者在汇报状态时并不十分坦诚。尽管公司存在众周知的缺点，每个人仍然汇报自己的状态为“绿色”。穆拉利知道他必须建立信任，因此在这种掩瞒行为发生时，他表现出了耐心。


    随后，一位领导者汇报其状态为黄色，BPR 与会者发出了清晰的吸气声。穆拉利的回答只是：“好的，我们如何处理这种情况呢？”穆拉利接着补充：“我无法独自解决它，但电话里的这些人可以。”那一刻就是让人们认同这一过程的火花，正如人们所说，剩下的就是历史了。比尔·福特对艾兰·穆拉利能力和人格的信任，使得他在给一个行业之外、他信任能完成工作的人机会时，这道火花成为了可能。


    ## 领导者行动


    当 `spark`（火花）作为动词使用时，它的意思是“刺激戏剧性的事件或过程”。动力领导者（Momentum leaders）致力于创造积极的火花，以激发人们的动力（一种影响方向、努力和坚持的力量），促使采取推进团队目标的行动。


    ### 行动 1


    通过建立明确的任务宣言和支持其实现的 SMART 目标来培养清晰度。


    乔治·T·多兰（George T. Doran）的 SMART 目标框架（即特定的、可衡量的、实现的、相关的、有时的）是提高动力和绩效的工具。领导者必须创建一个让所有团队成员都能清晰理解的任务宣言。随后，他们必须制定支持任务完成的计划和目标。确保你的员工能够建立任务与火花之间的联系，可以增强他们加强对
    SMART 目标的追求意愿。埃德温·洛克（Edwin Locke）和加里·P·莱姆（Gary P. Latham）的研究强调了目标设定中五个要素（清晰、挑战、接受、反馈、复杂）的重要性，我们建议的领导者行动直接关联清晰度和挑战。


    ### 行动 2


    增强团队有效协作的能力。


    2017 年《哈佛商业评论》（Harvard Business Review）的一项研究报告引用了协作遭遇障碍的几个原因。被引用的前三个原因是“部门孤岛（67%）、领导者缺乏协作愿景（32%）以及高级管理人员不想放弃控制权（32%）”。有效应对火花需要团队的协调行动。如果要在火花出现时采取果断且有效的行动，增强团队的协作敏锐度至关重要。帕特里克·伦西奥（Patrick
    Lencioni）的《团队的五朵障碍》（Five Dysfunctions of a Team）识别了团队在寻求“共同成长”时经常经历的挑战。扭转这五种障碍是加强协作的良方：建立信任、制定处理冲突的实践、做出团队承诺、对团队成员的行为负责并关注集体结果。


    ### 行动 3


    创造共同理解。


    信息就是力量。美国陆军创建高绩效团队的框架（即任务指挥）将“共同理解”作为其核心原则之一。共同理解是“多个人利用共同知识来达成共同目标的能力。它基于这样观点：理解是一种能力，人们可以修改自己的想法和行动来达成目标。”杰西卡·R·梅斯梅-马格努斯（Jessica
    R. Mesmer-Magnus）和莱斯利·A·德丘（Leslie A. DeChurch）在《应用心理学杂志》（Journal of Applied Psychology）上发表的元分析发现，信息共享正预测团队预测、凝聚力、知识整合和成员满意度。


    ## 领导者沟通


    我们认为领导力关乎语言。激励人心的语言。鼓励的语言。指导的语言。在不性的迷雾中带来清晰度的语言。但事实是：领导者的沟通很少关乎你说的话。它关乎你*所做的事*。


    想想。最强大的领导者不仅仅是说说。他们行动。他们通过每一个动作都在发出信号。有时是在紧要时刻，他们一言不发地介入并改变了整个局势的轨迹。其他时候，一个点头、一个眼神，甚至是沉默，都比任何演讲所表达的信息更多。还有一些时刻，沟通已经融入了准备工作之中——投入大量时间进行准备，以便在时刻到来时，无需一语信息依然清晰：*这就是我们训练过的。*


    语言确实重要。但行动才是真正的对话。它们将优秀的领导者与少数能够激发动力并扭转局势的人区分开来。领导沟通是一种持续的脉动，是一种贯穿每一次决策、每一个姿态、每一次停顿的交流。


    帕·格特（Pat Geraghty）是 GuideWell 和佛罗里达蓝的总裁兼首席执行官，他从小被培养承担这种角色。童年的早晨，格特的父亲会用一句话问候他，这句话潜移默化而地塑造了他对领导力和生活的理解：“去过美好的一天吧。”与更常见的“祝你有过美好的一天”不同，这句话包含了一个强大的信息，并成为格特在普鲁信金融、新泽西州蓝十字蓝、明尼苏达达州蓝十字蓝以及最终执掌这家美国最大的医疗计划之一时，领导力哲学的基石。从被动到主动的转变，概括了一种主人翁意识、责任感和积极参与的心态。

