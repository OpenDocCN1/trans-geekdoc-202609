    responses to social exclusion. Members of cohesive teams exhibited less activity
    in the anterior cingulate cortex, a region linked to the emotional distress of
    social exclusion. This suggests that cohesive teams provide a buffer against the
    negative effects of exclusion, enhancing emotional resilience (Maynard et al.,
    2015).


    The complication in interpreting results is that it can be difficult to pull apart
    the cause of cohesion from the result of it. For instance, in the functional MRI
    studies that demonstrate how cohesive teams show greater activation in brain regions
    associated with social cognition and cooperation, this enhanced brain activity
    is not just a measure of cohesion but also a consequence of it.


    Practically speaking, most businesses, sports teams, military units, or other
    organizations aren’t going to have access to functional MRI technology to regularly—if
    ever—assess how members’ brains respond to one another. But the use of regularly
    fielded questionnaires, and independent observation of collaboration, can give
    leaders the ability to gauge and benchmark cohesion in their ranks.


    There’s an important difference between climate and culture. The climate on a
    team can change with one person, but the culture is more pervasive—it can take
    years to change a culture. Climate is, perhaps unsurprisingly, more like the weather—reflecting
    the current state of a work environment based on how cultural norms are being
    enacted. In a 2017 Medium article, Jason Cummins detailed seven distinctions between
    climate and culture. Here are some key takeaways and cautions he notes on the
    difference between climate and culture:


    1.  Climate is shallow and erratic. Culture is deep and enduring. Climate measures
    the current organizational temperature. Culture regulates the organizational temperature.


    2.  Climate is dependent upon present circumstances. Culture withstands present
    circumstances.


    3.  A positive climate follows success. A positive culture withstands success.


    4.  Climate change is easier and can come quickly. Culture change is hard and
    takes longer than we would desire.


    5.  Climate is a team’s reaction to present events and circumstances. Culture
    enables a team to respond to unforeseen events and persevere during difficult
    circumstances.


    6.  Climate leaders are reactionary by nature and prone to choose the quick fix
    based on short-term results. Culture leaders are intentional by nature and are
    willing to choose the difficult road that leads to lasting impact.


    7.  Positive team climate can lead to a high degree of trust, collaboration, innovation,
    and engagement, while a negative one can result in conflict, frustration, and
    poor results.


    Leaders must understand what it takes to build a good climate given its immediacy
    and influence on team members’ level of engagement and satisfaction. Key factors
    like building trust, fostering collaboration, celebrating success, precise communications,
    and modeling desired behaviors can all help ensure the climate is facilitating
    a high level of team members’ trust and buy-in.


    One thing to keep in mind is that recognition plays a big role in this. Recognizing
    people for their efforts builds trust and celebrates successes at the same time.
    Research from Quantum Workplace concluded that employees are 2.7 times more likely
    to be highly engaged if they simply believe they will be recognized. That’s a
    huge difference!


    A multiplier of 2.7 is no small thing. It’s the difference between traveling at
    60 miles per hour or 162. Or the difference between earning 20 percent of a vote
    or an election-winning 54 percent. It’s earning $270 million in a quarter versus
    $100 million. Or, in a more direct example of engagement, a team member putting
    in close to 100 percent of one’s effort to a project versus significantly less.


    Quantum further found that 52.5 percent of their respondents desired more recognition
    from their first line manager, and 41 percent wanted more recognition from their
    coworkers and peers. When team members are recognized properly, it goes a long
    way toward building a positive climate.


    UCLA professor Marco Iacoboni didn’t set out to study mirror neurons—special brain
    cells that fire both when an individual performs an action and when they observe
    someone else performing the same action. Rather, when approached by Giacomo Rizzolatti,
    the scientist who is credited as discovering mirror neurons, Iacoboni didn’t at
    first agree to collaborate on research of this phenomenon in humans. Iacoboni
    was, in his own words, “incredulous” at the thought and assumed that, while extraordinarily
    interesting in concept, mirror neurons were too amazing to be real and must instead
    be “experimental artifacts.”


    It was a reasonable level of disbelief for the physician and PhD neuroscientist
    to have. Indeed, the discovery of mirror neurons had come as a surprise—an incidental
    finding, if you will—to those who first documented them. Scientists had been observing
    the monkey brain in the effort to understand what controlled the grasping movement.
    To their astonishment, the brain regions that “lit up” while a monkey himself
    grasped an object also fired while the monkey was at rest, watching another grasp
    an object.


    Rizzolatti persisted in his recruitment of Iacoboni to his research team, and
    he had inspired enough intrigue in Iacoboni that he agreed to visit their lab
    in Parma, Italy, to learn more. That’s when things changed. Iacoboni observed
    the studies, findings, and anatomies of a discovery that would revolutionize our
    understanding of human interactions. It would also change the course of Iacoboni’s
    career.'
