    Petraeus led the theMNF-I for nineteen months. He arrived at circumstances few
    thought would, or could, get much better. To most Americans, the engagement in
    Iraq was “another Vietnam” at best, and to Iraqis, civil war appeared inescapable.
    Petraeus was asked to “rescue a failing war,” but even though he was known as
    “the most competitive man on the planet,” few thought he could make it happen.
    But he did. Petraeus left an Iraq that was on its way to self-reliance and self-governance.


    Petraeus’s four tasks of strategic leaders are no doubt critical and highly relevant
    both in the military context and across sectors. When it comes to the leader’s
    role in momentum, a few other lessons can be drawn from the great general’s approach.
    We hope Petraeus will indulge our adding of these final two points to his model—lessons
    we’ve drawn from his accounts that leaders should take specific note of when developing
    their approaches to leading Mo.


    ## Empower Your “Field Commanders”


    Give individuals enhanced authority to make tactical decisions based on their
    understanding of local conditions. This allows for greater flexibility and adaptability—all
    the while maintaining rigorous oversight of outcomes and metrics. Petraeus was
    not just on the sidelines, although oftentimes leaders have no choice but to remain
    there. Petraeus himself would routinely accompany troops on patrols to experience
    firsthand what they were seeing—but no leader can be on every “field” at every
    time.


    These observations helped Petraeus provide field commanders with clear, concise
    documents to outline the overall mission, the desired end state, and their collective
    intent, or purpose—and then he’d get out of their way. This is really important.
    Providing such a clear “leader’s intent” (that is, purpose, key tasks, end state)
    can facilitate the ability to establish and accelerate momentum because subordinate
    leaders can make decisions in real time to advance achievement of the intent.
    As they devise plans (the how) to achieve the intent, they can keep building on
    successes in order to get closer to the objective end state.


    A clear leader’s intent provides direction and can be used to foster alignment
    (two of the three elements associated with the Center for Creative Leadership’s
    Leadership Model). Petraeus expected his subordinate commanders to align their
    actions with this intent, while providing them flexibility to adapt to rapidly
    changing situations. This type of delegation extended to decisions on resource
    allocation, troop movements, and engagement with local leaders. Field commanders
    were encouraged to pursue creative solutions and to share best practices with
    one another.


    ## Stack Small Wins, and Make Sure Your Team Members Take Note of Them


    Perhaps the biggest takeaway from General Petraeus is how momentum—the spark for
    it and the outcome alike—is born from stacking small wins. In other words, to
    Petraeus, momentum in Iraq was not a result of one grand event but a culmination
    of small wins. Reflecting on the building of this shift, Petraeus noted, “It was
    many small wins, many indicators of progress.” These wins weren’t isolated incidents
    but part of a larger trend that was gradually shifting the negative momentum toward
    a more positive trajectory.


    The effect was cumulative.


    “Once the people start to believe in your strategy, once your troops start to
    believe, and once Congress starts to understand it and see that it can actually
    achieve results, all of a sudden, the problems in getting appropriations and authorizations
    are much reduced. The resistance, which was considerable at the beginning, goes
    away,” he explained.


    In other words, small wins are impactful not only for the ground they gain but
    also for the resistance they reduce. It’s not enough, though, just to have the
    wins on some hidden tally sheet. The power of these small wins derives from team
    members knowing they happened—observing, feeling, and believing in them.


    In Iraq, Petraeus came in facing resistance from all sides, not the least of which
    was from members of his country’s own team. But surely, through preparing for
    momentum, seizing the wins when they came, and adjusting through extraordinary
    attention to feedback, resistance lessened, and momentum was reversed in his—and
    all of our—favor.


    ## LEADER ACTIONS


    Peter G. Northouse’s *Leadership: Theory and Practice* (2018) highlighted the
    prominence of four elements in varied conceptions of leadership: Leadership is
    a process, leadership involves influence, leadership occurs in groups, and leadership
    involves common goals. Consequently, the actions leaders should take to foster
    momentum must positively affect the aforementioned elements.


    ### ACTION 1:


    Ensure your team possesses a clear understanding of its purpose and mission.


    The ability to advance common goals starts with ensuring shared understanding.
    There are numerous examples of individuals and teams that lacked a clear understanding
    of what they were truly meant to accomplish. Some team members might place self-interest
    above those of the collective. Therefore, a leader must set clear expectations
    in order to align the team’s actions.


    ### ACTION 2:


    Enhance trust to amplify influence.


    The ability to lead effectively is amplified when a high degree of trust exists.
    Maister, Green, and Galford’s “Trust Equation” highlighted four elements: credibility,
    reliability, intimacy, and self-orientation (perceived interest alignment). When
    leaders are asking others to lean into behaviors that might generate some degree
    of anxiety, followers will undoubtedly conduct a trust assessment before electing
    to honor the leader’s request(s).


    ### ACTION 3:


    Model the desired behavior.


    Jim Kouzes and Barry Posner’s work *The Leadership Challenge* identified five
    exemplary practices of leadership. “Model the Way” was a practice concerning leaders’
    “establishment of principles concerning the way people (constituents, peers, colleagues,
    and customers alike) should be treated and the way they should pursue goals. Leaders
    create standards of excellence and set an example for others to follow.”


    The psychology field of behaviorism is based on the idea that all behaviors are
    learned through conditioning, which is a process of reinforcement and punishment.
    When leaders model the behavior they expect from others and hold them accountable
    for embracing those norms through `operant conditioning`, (a type of learning
    where behaviors are modified by associating with consequences), they can set examples
    of what right looks like when seeking to create momentum.

