    ## Quoting strings


    A “string” of text can be stored in a variable in the same way as a numeric value,
    but the assignment must surround the string with quote marks. Both single and
    double quote marks can be used for this purpose, but you must use the same type
    of quote marks to denote the beginning and end. For example, both these statements
    make valid string assignments:


    ```php

    $song_title = “Summertime Blues” ;

    $song_title = ‘Summertime Blues’ ;

    ```


    Where you wish to store a string of text that includes quote marks, you can “escape”
    the included quote marks by preceding them with a `\` backslash character, or
    use the alternative type of quote mark within the string. For example, both these
    statements assign strings that include quote marks:


    ```php

    $song_title = “the \"Summertime\" aria by George Gershwin” ;

    $song_title = ‘the “Summertime” aria by George Gerswin’ ;

    ```


    The second technique, using double quote marks within the string, is easier to
    read and is preferred throughout this book.


    ![image](Image00006.jpg)


    Variable names cannot contain spaces – but the underscore character is often used
    in their place.


    String values can be displayed as part of a mixed string by enclosing the mixed
    string in double quotes, like this:


    ```php

    echo “Many regard $song_title as a popular classic” ;

    ```


    String values can be joined together (“concatenated”) into a single string using
    the `.` concatenation operator, like this:


    ```php

    $hi = ‘Hello’ ;

    $bye = ‘Goodbye’ ;

    $song_title = $hi . $bye ; # ‘HelloGoodbye’

    ```


    Additionally, spaces and punctuation can usefully be inserted when concatenating
    strings, so the title assignment above could be modified to include a comma and
    a space:


    ```php

    $body_temp = 37.0 ;

    ```


    ![image](Image0041.jpg) Save the document in your hdocs directory then open the
    page via HTTP to see the variable values get


    ```php

    echo “<p>Body temperature is $body_temp degrees Celsius</p>” ;

    ```

