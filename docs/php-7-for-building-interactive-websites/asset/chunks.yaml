- raw: "PHP operator precedence determines how expressions are grouped for evaluation.\
    \ For example, the expression  **1 + 5 \\* 3**  evaluates to 16, not 18, because\
    \ the **\\*** multiplication opreator has a higher precedence than the **+** addition\
    \ operator. Parentheses can be used to specify precedence, so that  **(1 + 5)\
    \ \\* 3**  evaluates to 18. When operators have equal precedence their “associativity”\
    \ determines how expressions are grouped. For example, the - subtraction operator\
    \ is left-associative, so  **8 - 4 - 2**  is grouped as  **(8 - 4) - 2**  and\
    \ evaluates to 2. The table below lists common operators in order of precedence,\
    \ with the highest-precedence ones at the top. Operators on the same line have\
    \ equal precedence, so operator associativity determines how expressions are grouped.\n\
    \n| **Operator:** || **Associativity:** |\n\n| --- | --- |\n\n| **\\*\\*** ||\
    \ **Right** |\n\n| **++ -- ~** || **Right** |\n\n| **!** || **Right** |\n\n| **\\\
    * / %** || **Left** |\n\n| **\\+ - .** || **Left** |\n\n| **<< >>** || **Left**\
    \ |\n\n| **< <= > >=** || **None** |\n\n| **\\== != === !== <> <=>** || **None**\
    \ |\n\n| **&** || **Left** |\n\n| **^** || **Left** |\n\n| **|** || **Left** |\n\
    \n| **&&** || **Left** |\n\n| **||** || **Left** |\n\n| **??** || **Right** |\n\
    \n| **?=** || **Left** |\n\n| **\\=+= -= \\*= /= \\*\\*= .= %=  \n\n&= |= ^= <<=\
    \ >>= =>** || **Right** |\n\n| **and** || **Left** |\n\n| **xor** || **Left**\
    \ |\n\n| **or** || **Left** |\n\n| **,** || **Left** |\n\n![image](Image00019.jpg)\n\
    \nThe eagle-eyed will notice that the alternative forms of logical operators have\
    \ different levels of precedence. This can cause unexpected results in an expression\
    \ such as **$bool = true and false** versus the alternative **$bool = true &&\
    \ false** . Try each of these then do **var\\_dump($bool)** to see the difference.\n\
    \n **Summary** \n\n •  Arithmetical operators can form expressions with operands\
    \ for addition  **+**  , subtraction  **\\-**  , multiplication  **\\***  , division\
    \  **/**  , modulus  **%**  , and exponentiation  **\\*\\*** \n\n •  The assignment\
    \ operator  **\\=**  can be combined with any arithmetical operator to perform\
    \ an arithmetical calculation then assign the result\n\n •  Comparison operators\
    \ can form expressions with operands for equality  **\\==**  , inequality  **!=**\
    \  , identicality or not  **\\===**  ,  **!==**  , greater  **\\>**  , less  **<**\
    \  , greater, less or equal  **\\>=**  ,  **<=**  ,  **<=>** \n\n •  The conditional\
    \ operator  **?:**  evaluates an expression for a  **TRUE**  or  **FALSE**  Boolean\
    \ value, then returns one of two specified results depending on the evaluation\n\
    \n •  The  **??**  null coalescing operator traverses operands from left to right\
    \ and returns the first value that is not null\n\n •  Logical operators  **and**\
    \  ,  **&&**  ,  **or**  ,  **||**  and  **xor**  form expressions evaluating\
    \ two operands and return a value of true or false\n\n •  The logical  **!** \
    \ not operator returns the inverse Boolean value of a single operand\n\n •  Bitwise\
    \ operators  **|**  ,  **&**  ,  **~**  ,  **^**  ,  **<<**  and  **\\>>**  allow\
    \ the evaluation and manipulation of specific bits within an integer\n\n •  Increment\
    \  **++**  or decrement  **\\--**  operators that prefix a variable change its\
    \ value by one and return the result\n\n •  Increment  **++**  or decrement  **\\\
    --**  operators that postfix a variable return its current value, then change\
    \ its value by one\n\n •  Operator precedence determines how expressions are grouped\
    \ for evaluation\n\n •  When operators have equal precedence, their associativity\
    \ determines how the expression is grouped for evaluation\n\n •  The  **var\\\
    _dump()**  function can be used to see the type and value resulting from an expression\n\
    \n •  The special  **NULL**  constant represents a variable that has no value\
    \ whatsoever, not even zero\n\n4\n\n **Testing conditions** \n\n*This chapter\
    \ demonstrates the various PHP control structures that determine how a script\
    \ will proceed.*\n\n[**Seeking truth**](#text00006.html#sec25)\n\n[**Providing\
    \ alternatives**](#text00006.html#sec26)\n\n[**Switching branches**](#text00006.html#sec27)\n\
    \n[**Performing loops**](#text00006.html#sec28)\n\n[**Looping while true**](#text00006.html#sec29)\n\
    \n[**Breaking from loops**](#text00006.html#sec30)\n\n[**Summary**](#text00006.html#sec31)\n\
    \n **Seeking truth** \n\nThe  **if**  keyword is used to perform the basic conditional\
    \ test that evaluates a given expression for a Boolean value of  **TRUE**  or\
    \  **FALSE**  . Statements within braces following the evaluation will only be\
    \ executed when the expression is found to be  **TRUE**  . When the expression\
    \ is found to be  **FALSE**  , the PHP parser simply moves on to the next part\
    \ of the script.\n\n![image](Image00005.jpg)\n\nThe **if** construct is one of\
    \ the most important features in PHP, and in most other programming languages.\n\
    \nThe syntax of an  **if**  conditional test statement looks like this:\n\n **if\
    \ ( *test-expression* ) { *statement-to-execute-when-true ;* }** \n\nThere may\
    \ be multiple statements to be executed when the test is  **TRUE**  but each statement\
    \ must be terminated by a semi-colon:\n\n **if ( *test-expression* )** \n\n **{**\
    \ \n\n ***statement-to-execute-when-true ;  \n\nstatement-to-execute-when-true\
    \ ;  \n\nstatement-to-execute-when-true ;*** \n\n **}** \n\nMultiple expressions\
    \ can be tested using the logical  **&&**  or  **and**  operator to ensure that\
    \ following statements will only be executed when both expressions are found to\
    \ be  **TRUE**  , like this:\n\n **if ( ( *test-expression* ) && ( *test-expression*\
    \ ) )** \n\n **{** \n\n ***statement-to-execute-when-true ;  \n\nstatement-to-execute-when-true\
    \ ;  \n\nstatement-to-execute-when-true ;*** \n\n **}** \n\n![image](Image00005.jpg)\n\
    \nWhen the code to be executed is just a single statement, the braces may optionally\
    \ be omitted, but you may prefer to always include the braces for consistency.\n\
    \nAlternatively,  **if**  conditional test statements can be nested to test multiple\
    \ expressions so that statements will only be executed when all tests are found\
    \ to be  **TRUE**  , like this:\n\n **if ( *test-expression* )** \n\n **{** \n\
    \n **if ( *test-expression* )** \n\n **{** \n\n ***statement-to-execute-when-true\
    \ ;  \n\nstatement-to-execute-when-true ;  \n\nstatement-to-execute-when-true\
    \ ;*** \n\n **}** \n\n **}** \n\nMultiple  **if**  conditional test statements\
    \ can be made to provide alternatives for the script to follow.\n\n![image](Image00029.jpg)\n\
    \nif.php\n\n![image](Image00067.jpg) Between PHP tags, begin a script with a statement\
    \ that initializes an integer variable\n\n **<?php** \n\n**$num \\= 8 ;**\n\n\
    ![image](Image00068.jpg) Next, add statements that output a result when a conditional\
    \ test of numerical size is found to be  **TRUE** \n\n**if ( $num \\> 5 ) { echo\
    \ “$num exceeds 5<br>” ; }**\n\n**if ( $num <= 5 ) { echo “ $num is below 6<br>”\
    \ ; }**\n\n![image](Image00069.jpg) Now, add statements that output a result when\
    \ a conditional test of parity is found to be  **TRUE** \n\n**if ( $num % 2 \\\
    == 0 ) { echo “ $num is Even<br>” ; }**\n\n**if ( $num % 2 != 0 ) { echo “ $num\
    \ is Odd<br>” ; }**\n\n **?>** \n\n![image](Image00070.jpg) Save the document\
    \ in your web server’s  **/htdocs**  directory as  **if.php**  then open the page\
    \ via HTTP to see the results from successful tests get displayed\n\n![image](Image00071.jpg)\n\
    \n![image](Image00072.jpg) Edit the integer variable then save the modified script\
    \ and refresh the browser to see the results from other successful tests get displayed\n\
    \n**$num \\= 3 ;**\n\n![image](Image00073.jpg)\n\n![image](Image00006.jpg)\n\n\
    When the tested condition is **FALSE** , the PHP parser ignores its statement\
    \ block and simply moves on.\n\n **Providing alternatives** \n\nIt is often preferable\
    \ to extend an  **if**  statement by appending an  **else**  statement, specifying\
    \ statements within braces to be executed when the expressions evaluated by the\
    \  **if**  statement are found to be  **FALSE**  , with this syntax:\n\n **if\
    \ ( *test-expression* )** \n\n **{** \n\n ***statement-to-execute-when-true ;\
    \  \n\nstatement-to-execute-when-true ;  \n\nstatement-to-execute-when-true ;***\
    \ \n\n **}** \n\n **else** \n\n **{** "
