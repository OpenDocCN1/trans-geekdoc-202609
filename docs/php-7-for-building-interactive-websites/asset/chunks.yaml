- raw: "![image](Image00082.jpg) Now, insert this  **continue**  statement at the\
    \ beginning of the inner loop block, to skip the first iteration of the inner\
    \ loop – then save the document and view the change\n\n**if ( $i \\== 1 && $j\
    \ \\== 1 )**\n\n **{** \n\n**echo “Continues inner loop when i = $i and j = $j\
    \ <br>” ;**\n\n **continue ;** \n\n **}** \n\n![image](Image00083.jpg)\n\n![image](Image00006.jpg)\n\
    \nHere, the **continue** statement just skips the first iteration of the inner\
    \ loop when the outer loop tries to run it for the first time.\n\n **Summary**\
    \ \n\n •  The  **if**  keyword performs the basic conditional test that evaluates\
    \ an expression for a Boolean value of  **TRUE**  or  **FALSE** \n\n •  Statements\
    \ within braces following the evaluation will only be executed when the expression\
    \ is found  **TRUE** \n\n •  Multiple expressions can be tested using the logical\
    \  **&&**  operator, or by nesting multiple  **if**  conditional tests\n\n • \
    \ The  **else**  keyword specifies statements to be executed when the expression\
    \ evaluated by the  **if**  statement is found  **FALSE** \n\n •  The  **elseif**\
    \  keyword is used to append an alternative expression to be evaluated and statements\
    \ to be executed when  **TRUE** \n\n •  Multiple  **if-elseif-else**  statements\
    \ can often be performed more efficiently by a  **switch**  statement\n\n •  The\
    \  **case**  keyword is used to specify a value to be matched in a  **switch**\
    \  statement block\n\n •  Each  **case**  statement must end with a  **break**\
    \  keyword statement so the  **switch**  will exit when a match is found\n\n •\
    \  A  **default**  statement specifies code to be executed in the event that no\
    \ matches are found within any  **case**  statements\n\n •  A loop is a piece\
    \ of code in a script that automatically repeats until a test expression becomes\
    \  **FALSE** \n\n •  The PHP loop structures are  **for**  ,  **while**  ,  **do\
    \ while**  and  **foreach** \n\n •  A  **for**  loop structure specifies an initializer,\
    \ a test expression and an updater that increments (or decrements) a counter\n\
    \n •  An updater must always be included in the statement block of a  **while**\
    \  loop and a  **do while**  loop\n\n •  Unlike a  **while**  loop, a  **do while**\
    \  loop will always execute its statements at least once\n\n •  The  **break**\
    \  keyword can be used to prematurely terminate a loop when a specified condition\
    \ is met\n\n •  The  **continue**  keyword can be used to skip a single iteration\
    \ of a loop when a specified condition is met\n\n5\n\n **Employing functions**\
    \ \n\n*This chapter demonstrates how to create re-usable blocks of code in functions.*\n\
    \n[**Defining functions**](#text00007.html#sec32)\n\n[**Passing arguments**](#text00007.html#sec33)\n\
    \n[**Varying parameters**](#text00007.html#sec34)\n\n[**Recognizing scope**](#text00007.html#sec35)\n\
    \n[**Returning values**](#text00007.html#sec36)\n\n[**Calling back**](#text00007.html#sec37)\n\
    \n[**Summary**](#text00007.html#sec38)\n\n **Defining functions** \n\nPHP provides\
    \ many built-in functions that can be called by name in your scripts to execute\
    \ pre-defined actions, such as the array sorting functions described [here](#text00004.html#sec11)\
    \ . Additionally, you may create your own custom functions to execute specified\
    \ actions when called. This usefully allows PHP scripts to be modularized into\
    \ sections of code that are easier to understand and maintain.\n\n![image](Image00084.jpg)\n\
    \nYour custom function names may contain any combination of letters, numbers and\
    \ the underscore character, but must begin with a letter or an underscore. Understandably,\
    \ to avoid conflict the name may not duplicate an existing built-in function name,\
    \ so for example you may not create a custom function named “sort”.\n\nUnlike\
    \ PHP variables, function names are case-insensitive so  **cube()**  ,  **Cube()**\
    \  and  **CUBE()**  can all reference the same function. Nonetheless,- it is recommended\
    \ you always use the same case as that used to name the function in the function\
    \ definition.\n\nA function definition is created in a PHP script simply by stating\
    \ its name after the  **function**  keyword, followed by parentheses and curly\
    \ brackets (braces) containing the statements to be executed each time that function\
    \ gets called:\n\n **function *function\\_name* ( )** \n\n **{** \n\n ***statement-to-be-executed\
    \ ;  \n\nstatement-to-be-executed ;  \n\nstatement-to-be-executed ;*** \n\n **}**\
    \ \n\n![image](Image00006.jpg)\n\nPHP variable names are case-sensitive, but PHP\
    \ function names are not.\n\nA PHP script can then call upon a defined function\
    \ by name using  ***function\\_name* ( );**  to execute the statements it contains\
    \ whenever required. Although the interpreter runs the script from top to bottom,\
    \ a function call can appear before the function definition. This is not good\
    \ programming practice, however, so you should define functions before they are\
    \ called.\n\nFunctions may contain any valid PHP script code and may even contain\
    \ a further function definition. In that case, the inner function will not exist\
    \ until the outer function has been called.\n\n![image](Image00029.jpg)\n\nfunction.php\n\
    \n![image](Image00085.jpg) Begin a PHP script with a statement to define a function\n\
    \n **<?php** \n\n**function greet ()**\n\n **{** \n\n**echo ‘Hello User!<br>’\
    \ ;**\n\n **}** \n\n![image](Image00086.jpg) Next, add a statement to call the\
    \ function defined in the previous step, to have it execute its statement\n\n\
    **greet () ;**\n\n![image](Image00087.jpg) Now, define another function that contains\
    \ an inner function definition and a further statement\n\n**function outer ()**\n\
    \n **{** \n\n**function inner ()**\n\n **{** \n\n**echo ‘Inner function called.<br>’\
    \ ;**\n\n **}** \n\n**echo ‘Inner function created.<br>’ ;**\n\n **}** \n\n![image](Image00088.jpg)\
    \ Finally, add statements to call each of the functions defined in the previous\
    \ step\n\n**outer () ;**\n\n**inner () ;**\n\n **?>** \n\n![image](Image00089.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **function.php**\
    \  then open the page via HTTP to see the output from each function call\n\n![image](Image00090.jpg)\n\
    \n![image](Image00005.jpg)\n\nRemove the call to the outer function to see an\
    \ undefined function error when the script attempts to call the inner function.\n\
    \n **Passing arguments** \n\nData can be passed to functions as “arguments” in\
    \ the same way you can pass arguments to some built-in PHP functions. For example,\
    \ the  **sort()**  function takes the array to be sorted as its argument. Functions\
    \ can be created with any number of arguments but when called, data must be supplied\
    \ for each argument to avoid an error.\n\n![image](Image00006.jpg)\n\nParameters\
    \ must be specified in the function declaration as a comma-separated list, and\
    \ argument values passed by the caller as a comma-separated list.\n\nA function\
    \ accepting arguments is defined by including a comma-separated list of “parameters”\
    \ within the parentheses after the function name, like this:\n\n **function *function\\\
    _name* ( $*arg\\_1* , $*arg\\_2* , $*arg\\_3* )** \n\n **{** \n\n ***statement-to-be-executed\
    \ ;  \n\nstatement-to-be-executed ;  \n\nstatement-to-be-executed ;*** \n\n **}**\
    \ \n\nParameter names must adhere to the same naming conventions required for\
    \ PHP variables and should ideally be meaningful, to represent the nature of the\
    \ data they will be passed. The argument data must be passed by the call in the\
    \ correct order and can then be used by the statements within that function.\n\
    \nOptionally, the function definition can specify the type of data to be passed\
    \ from the caller by including a type description before the parameter name. Valid\
    \ type descriptions include  **int**  ,  **float**  ,  **string**  ,  **bool**\
    \  ,  **callable**  and  **array**  . When types are specified, a call that attempts\
    \ to pass an incorrect data type to the function will result in an error.\n\n\
    ![image](Image00003.jpg)\n\nThe ability to specify argument data types is a new\
    \ feature in PHP 7."
  fmt: "\n![image](Image00082.jpg) Now, insert this `continue` statement at the beginning\
    \ of the inner loop block, to skip the first iteration of the inner loop – then\
    \ save the document and view the change\n\n```php\nif ( $i \\== 1 && $j \\== 1\
    \ )\n{\n  echo “Continues inner loop when i = $i and j = $j <br>” ;\n  continue\
    \ ;\n}\n```\n\n![image](Image00083.jpg)\n\n![image](Image00006.jpg)\n\nHere, the\
    \ `continue` statement just skips the first iteration of the inner loop when the\
    \ outer loop tries to run it for the first time.\n\n## Summary\n\n- The `if` keyword\
    \ performs the basic conditional test that evaluates an expression for a Boolean\
    \ value of `TRUE` or `FALSE`\n- Statements within braces following the evaluation\
    \ will only be executed when the expression is found `TRUE`\n- Multiple expressions\
    \ can be tested using the logical `&&` operator, or by nesting multiple `if` conditional\
    \ tests\n- The `else` keyword specifies statements to be executed when the expression\
    \ evaluated by the `if` statement is found `FALSE`\n- The `elseif` keyword is\
    \ used to append an alternative expression to be evaluated and statements to be\
    \ executed when `TRUE`\n- Multiple `if-elseif-else` statements can often be performed\
    \ more efficiently by a `switch` statement\n- The `case` keyword is used to specify\
    \ a value to be matched in a `switch` statement block\n- Each `case` statement\
    \ must end with a `break` keyword statement so the `switch` will exit when a match\
    \ is found\n- A `default` statement specifies code to be executed in the event\
    \ that no matches are found within any `case` statements\n- A loop is a piece\
    \ of code in a script that automatically repeats until a test expression becomes\
    \ `FALSE`\n- The PHP loop structures are `for`, `while`, `do while` and `foreach`\n\
    - A `for` loop structure specifies an initializer, a test expression and an updater\
    \ that increments (or decrements) a counter\n- An updater must always be included\
    \ in the statement block of a `while` loop and a `do while` loop\n- Unlike a `while`\
    \ loop, a `do while` loop will always execute its statements at least once\n-\
    \ The `break` keyword can be used to prematurely terminate a loop when a specified\
    \ condition is met\n- The `continue` keyword can be used to skip a single iteration\
    \ of a loop when a specified condition is met\n\n5\n\n## Employing functions\n\
    \n*This chapter demonstrates how to create re-usable blocks of code in functions.*\n\
    \n- [Defining functions](#text00007.html#sec32)\n- [Passing arguments](#text00007.html#sec33)\n\
    - [Varying parameters](#text00007.html#sec34)\n- [Recognizing scope](#text00007.html#sec35)\n\
    - [Returning values](#text00007.html#sec36)\n- [Calling back](#text00007.html#sec37)\n\
    - [Summary](#text00007.html#sec38)\n\n### Defining functions\n\nPHP provides many\
    \ built-in functions that can be called by name in your scripts to execute pre-defined\
    \ actions, such as the array sorting functions described [here](#text00004.html#sec11).\
    \ Additionally, you may create your own custom functions to execute specified\
    \ actions when called. This usefully allows PHP scripts to be modularized into\
    \ sections of code that are easier to understand and maintain.\n\n![image](Image00084.jpg)\n\
    \nYour custom function names may contain any combination of letters, numbers and\
    \ the underscore character, but must begin with a letter or an underscore. Understandably,\
    \ to avoid conflict the name may not duplicate an existing built-in function name,\
    \ so for example you may not create a custom function named `sort`.\n\nUnlike\
    \ PHP variables, function names are case-insensitive so `cube()`, `Cube()`, and\
    \ `CUBE()` can all reference the same function. Nonetheless,- it is recommended\
    \ you always use the same case as that used to name the function in the function\
    \ definition.\n\nA function definition is created in a PHP script simply by stating\
    \ its name after the `function` keyword, followed by parentheses and curly brackets\
    \ (braces) containing the statements to be executed each time that function gets\
    \ called:\n\n```php\nfunction function_name ( )\n{\n  statement-to-be-executed\
    \ ;\n  statement-to-be-executed ;\n  statement-to-be-executed ;\n}\n```\n\n![image](Image00006.jpg)\n\
    \nPHP variable names are case-sensitive, but PHP function names are not.\n\nA\
    \ PHP script can then call upon a defined function by name using `function_name()`\
    \ to execute it.\n\n![image](Image00029.jpg)\n\n![image](Image0085.jpg)\n\n```php\n\
    <?php\nfunction greet()\n{\n  echo ‘Hello User!<br>’ ;\n}\n```\n\n![image](Image0086.jpg)\n\
    \n```php\n<?php\nfunction outer()\n{\n  function inner()\n  {\n    echo ‘Inner\
    \ called.<br>’ ;\n  }\n  echo ‘Inner created.<br>’ ;\n}\n\nouter();\ninner();\n\
    ?>\n```\n\n![image](Image0089.jpg)\n\nSave the document in your web server’s `/htdocs`\
    \ directory as `function.php` then open the page via HTTP to see the output from\
    \ each function\n\n![image](Image00090.jpg)\n\n![image](Image00005.jpg)\n\n###\
    \ Passing arguments\n\nData can be passed to functions as \"arguments\" in the\
    \ same way you can pass arguments to some built-in functions. For example, the\
    \ `sort()` function takes the array to be sorted as its argument. Functions can\
    \ be created with any number of arguments but when called, data must be supplied\
    \ for each argument to avoid an error.\n\n![image](Image00006.jpg)\n\nParameters\
    \ must be specified in the function declaration as a comma-separated list, and\
    \ argument values passed by the caller as a comma-separated list.\n\nA function\
    \ accepting arguments is defined by including a comma-separated list of \"parameters\"\
    \ within the parentheses after the function name, like this:\n\n```php\nfunction\
    \ function_name ( $arg_1 , $arg_2 , $arg_3 )\n{\n  statement-to-be-executed ;\n\
    \  statement-to-be-executed ;\n  statement-to-be-executed ;\n}\n```\n\nParameter\
    \ names must adhere to the same naming conventions required for PHP variables\
    \ and should ideally be meaningful, to represent the nature of the data they will\
    \ be passed. The argument data must be passed by the call in the correct order\
    \ and can then be used by the statements within that function.\n\nOptionally,\
    \ the function definition can specify the type of data to be passed from the caller\
    \ by including a type description before the parameter name. Valid type descriptions\
    \ include `int`, `float`, `string`, `bool`, `callable` and `array`. When types\
    \ are specified, a call that attempts to pass an incorrect data type to the function\
    \ will result in an error.\n\n![image](Image00003.jpg)\n\nThe ability to specify\
    \ argument data types is a new feature in PHP 7.\n"
  trans: "\n\n![image](img/Image00082.jpg) 现在，将此 `continue` 语句插入内层循环块开头，以跳过内层循环的第一次——然后保存文档并查看更改\n\
    \n```php\nif ( $i \\== 1 && $j \\== 1 )\n{\n  echo “Continues inner loop when\
    \ i = $i and j = $j <br>” ;\n  continue ;\n}\n```\n\n![image](img/Image00083.jpg)\n\
    \n![image](img/Image00006.jpg)\n\n在这里，当外层循环尝试首次运行时时，`continue` 语句仅跳过了内层循环的第一次。\n\
    \n## 总结\n\n- `if` 关键字执行基础条件测试，评估表达式的布尔值为 `TRUE`（真）或 `FALSE`（假）\n- 评估后大括号内的语句仅在表达式结果为\
    \ `TRUE` 时才会执行\n- 使用逻辑运算符 `&&` 就可以测试多个表达式，或者通过嵌套多个 `if` 条件测试来完成\n- `else` 关键字指定当\
    \ `if` 语句评估的表达式为 `FALSE` 时执行的语句\n- `elseif` 关键字用于附加一个待评估的备选表达式以及在为 `TRUE` 时执行的语句\n\
    - 多个 `if-elseif-else` 语句通常可以通过 `switch` 语句更高效地执行\n- `case` 关键字用于指定 `switch` 语句块中匹配的值\n\
    - 每个 `case` 语句必须以 `break` 关键字语句结束，以便 `switch` 在找到匹配项时退出\n- `default` 语句指定在任何 `case`\
    \ 语句中都未找到匹配项时执行的代码\n- 循环是脚本中的一段代码，它会自动重复执行，直到测试表达式变为 `FALSE`\n- PHP 循环结构有 `for`、`while`、`do\
    \ while` 和 `foreach`\n- `for` 循环结构指定了一个初始化器（initializer）、一个测试表达式和一个用于增加（或递减）计数器的更新器\n\
    - 在 `while` 循环和 `do while` 循环的语句块中必须包含一个更新器\n- 与 `while` 循环不同，`do while` 循环将至少执行一次其语句\n\
    - `break` 关键字可以在满足特定条件时提前终止循环\n- `continue` 关键字可以在满足特定条件时跳过循环的单迭代\n\n5\n\n## 使用函数\n\
    \n*本章将演示如何在函数中创建可用的代码块。*\n\n- 定义函数\n- 传递参数\n- 可变参数\n- 识别作用域\n- 返回值\n- 回调\n- 总结\n\
    \n### 定义函数\n\nPHP 提供了许多内置函数，可以在脚本中通过名称调用这些函数来执行预定义的操作，例如此处 描述的数组排序函数。此外，您也可以创建自己的自定义函数，在调用时执行指定的操作。这使得\
    \ PHP 脚本能够模块化为更易理解和维护的代码段。\n\n![image](img/Image00084.jpg)\n\n您的自定义函数名可以是字母、数字和下划线字符的任意组合，但必须以字母或下划线开头。为了避免冲突，名称不能与现有的内置函数名重复，例如您不能创建一个名为\
    \ `sort` 的自定义函数。\n\n与 PHP 变量不同，函数名不区分大小写，因此 `cube()`、`Cube()` 和 `CUBE()` 都可以引用同一个函数。尽管如此，建议您始终使用与函数定义时相同的字母写形式。\n\
    \n在 PHP 脚本中创建函数定义只需在 `function` 关键字后写其名称，然后跟着括号和大括号（大大括号），其中包含每次调用该函数时要执行的语句：\n\
    \n```php\nfunction function_name ( )\n{\n  statement-to-be-executed ;\n  statement-to-be-executed\
    \ ;\n  statement-to-be-executed ;\n}\n```\n\n![image](img/Image00006.jpg)\n\n\
    PHP 变量名对大小写敏感，但 PHP 函数名不是。\n\nPHP 脚本随后可以使用 `function_name()` 通过名称调用定义的函数来执行它。\n\
    \n![image](img/Image00029.jpg)\n\n![image](img/Image0085.jpg)\n\n```php\n<?php\n\
    function greet()\n{\n  echo ‘Hello User!<br>’ ;\n}\n```\n\n![image](img/Image0086.jpg)\n\
    \n```php\n<?php\nfunction outer()\n{\n  function inner()\n  {\n    echo ‘Inner\
    \ called.<br> ;\n  }\n  echo ‘Inner created.<br>’ ;\n}\n\nouter();\ninner();\n\
    ?>\n```\n\n![image](img/Image0089.jpg)\n\n将文档保存到 Web 服务器的 `/htdocs` 目录并为 `function.php`，然后通过\
    \ HTTP 访问页面以查看每个函数的输出\n\n![image](img/Image00090.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n### 传递参数\n\n数据可以以“参数”的形式传递给函数，就像您向某些内置函数传递参数一样。例如，`sort()` 函数将要排序的数组作为其参数。函数可以带有任意数量的参数，但在调用时，必须为每个参数提供数据以避免错误。\n\
    \n![image](img/Image00006.jpg)\n\n参数必须在函数声明中作为逗号分隔列表指定，调用者传递的参数值也必须以逗号分隔列表指定。\n\
    \n接受参数的函数通过在函数名后的括号内包含逗号分隔的“参数”列表来定义，如下：\n\n```php\nfunction function_name ( $arg_1\
    \ , $arg_2 , $arg_3 )\n{\n  statement-to-be-executed ;\n  statement-to-be-executed\
    \ ;\n  statement-to-be-executed ;\n}\n```\n\n参数名必须遵循 PHP 变量所需的相同命名规范，并且理想情况下具有意义，以表示它们将传递的数据性质。参数数据必须按正确的顺序通过调用传递，然后供该函数内部的语句使用。\n\
    \n可选情况下，函数定义可以通过在参数名之前包含类型描述来指定从调用者传递的数据类型。有效的类型描述包括 `int`、`float`、`string`、`bool`、`callable`\
    \ 和 `array`。当指定了类型时，尝试向函数传递错误数据类型的调用将导致错误。\n\n![image](img/Image00003.jpg)\n\n\
    指定参数数据类型的能力是 PHP 7 的新功能。\n\n"
