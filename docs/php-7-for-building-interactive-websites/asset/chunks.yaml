    \ the script.\n* The `mysqli_connect_error()` function returns an error message\
    \ if a connection attempt fails, and can be specified as the argument to the `die()`\
    \ function, to be called as the script halts.\n* It is recommended to place a\
    \ connection script outside the regular `/htdocs` directory for security and incorporate\
    \ it into other scripts, when needed, using a `require` statement.\n* The `mysqli_ping()`\
    \ function can verify connection to a specified database, then information can\
    \ be retrieved using `mysqli_get_server_info()` and `mysqli_get_host_info()`.\n\
    * The `mysqli_query()` function attempts to execute a SQL query on a specified\
    \ database object and the `mysqli_error()` function can be used to describe the\
    \ cause of a failed attempt.\n* Database connections should always be closed when\
    \ they are no longer required by calling the `mysqli_close()` function.\n* When\
    \ a database query succeeds, the `mysqli_num_rows()` function can reveal the total\
    \ number of rows retrieved.\n* The `mysqli_fetch_array()` function can create\
    \ an associative array of rows and data from a successful query result.\n* The\
    \ PHP `empty()` function can be used to test a posted HTML form field to discover\
    \ if it is empty.\n* A row of data can be added to a MySQL database table, using\
    \ the `mysqli_query()` function, then a confirmation test can be made using the\
    \ `mysqli_affected_rows()` function.\n* The browser can be relocated to a new\
    \ page using the `header()` function to specify a `Location:URL` argument.\n\n\
    12\n\n## Adding Web Services\n\nThis chapter demonstrates how to incorporate XML\
    \ data into PHP scripts.\n\n### Loading data\n[Loading data](#text00014.html#sec89)\n\
    \n### Getting nodes\n[Getting nodes](#text00014.html#sec90)\n\n### Getting attributes\n\
    [Getting attributes](#text00014.html#sec91)\n\n### Including feeds\n[Including\
    \ feeds](#text00014.html#sec92)\n\n### Setting parameters\n[Setting parameters](#text00014.html#sec93)\n\
    \n### Selecting components\n[Selecting components](#text00014.html#sec94)\n\n\
    ### Summary\n[Summary](#text00014.html#sec95)\n\n#### Loading data\n\nThe ubiquitous\
    \ nature of XML makes it ideal to transport data. XML (Extensible Markup Language)\
    \ is both human-readable and machine-readable. Many web services use XML to exchange\
    \ data. PHP provides several built-in ways to handle XML files. The most common\
    \ and simplest method is `SimpleXML`.\n\nSimpleXML allows you to treat XML data\
    \ as an object. Each element in the XML file becomes a property of the object,\
    \ and nested elements become nested objects.\n\nFor example:\n\n```php\n$xml =\
    \ simplexml_load_file('catalog.xml');\necho $xml->title;\n```\n\nThe `simplexml_load_file()`\
    \ function loads an XML file and returns a `SimpleXML` object. If the file cannot\
    \ be loaded, it returns `false`. You can also use `simplexml_load_string()` to\
    \ load XML from a string.\n\n```php\n$xml = simplexml_load_string($xml_string);\n\
    ```\n\nAA typical `catalog.xml` file might look like this:\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<catalog>\n  <book category=\"cooking\">\n    <title>Everyday\
    \ Italian</title>\n    <author>Giada Deiis</author>\n    <year>2005</year>\n \
    \   <price>30.00</price>\n  </book>\n  <book category=\"children\">\n    <title>Harry\
    \ Potter</title>\n    <author>J.K. Rowling</author>\n    <year>2005</year>\n \
    \   <price>29.99</price>\n  </book>\n</catalog>\n```\n\nIn the example above,\
    \ you can access the book titles like this:\n\n```php\nforeach ($xml->book as\
    \ $book) {\n    echo $book->title . \" - \" . $book->author . \"<br>\";\n}\n```\n\
    \nTo access attributes, use the square bracket syntax:\n\n```php\nforeach ($xml->book\
    \ as $book) {\n    echo $book['category'];\n}\n```\n\nYou can also add new elements\
    \ to the XML object:\n\n```php\n$new_book = $xml->addChild('book');\n$new_book->addChild('category',\
    \ 'fiction');\n$new_book->addChild('title', 'The Hobbit');\n$new_book->addChild('author',\
    \ 'J.R.R. Tolkien');\n$new_book->addChild('year', '1937');\n$new_book->addChild('price',\
    \ '15.00');\n```\n\nTo save the modified XML back to a file, use the `asXML()`\
    \ method:\n\n```php\n$xml->asXML('catalog_updated.xml');\n```\n\n#### Getting\
    \ nodes\n\nThe `SimpleXML` object implements the `Iterator` interface, which means\
    \ you can use it in a `foreach` loop to traverse the nodes.\n\n```php\nforeach\
    \ ($xml->book as $book) {\n    echo $book->title . \"<br>\";\n}\n```\n\nIf you\
    \ want to find specific nodes, you can use the `xpath()` method:\n\n```php\n$books\
    \ = $xml->xpath('//book[category=\"cooking\"]');\nforeach ($books as $book) {\n\
    \    echo $book->title . \"<br>\";\n}\n```\n\n#### Getting attributes\n\nAs shown\
    \ above, attributes can be accessed using the square bracket syntax:\n\n```php\n\
    echo $xml->book[0]['category'];\n```\n\nYou can also list all attributes of an\
    \ element using the `attributes()` method:\n\n```php\nforeach ($xml->book[0]->attributes()\
    \ as $name => $value) {\n    echo $name . \": $value<br>\";\n}\n```\n\n#### Including\
    \ feeds\n\nRSS feeds are a type of XML file used to provide updates on content.\
    \ You can use `SimpleXML` to parse an RSS feed:\n\n```php\n$rss = simplexml_load_file('feed.xml');\n\
    foreach ($rss->channel->item as $item) {\n    echo $item->title . \" - \" . $item->link\
    \ . \"<br>\";\n}\n```\n\n#### Setting parameters\n\nWhen working with web services,\
    \ you might need to send parameters in the request. You can build an XML request\
    \ body using `SimpleXML`:\n\n```php\n$request = new SimpleXMLElement('<request/>');\n\
    $request->addChild('id');\n```\n\n#### Selecting components\n\nTo select specific\
    \ components from an XML document, you can use `xpath()`:\n\n```php\n$titles =\
    \ $xml->xpath('//book/title');\n```\n"
  trans: "\n\n如果脚本发现表单字段为空，它将提供自身的错误信息；如果数据无法添加到数据库表中，它将提供一个 MySQL 错误消息。\n\n## 确认成功\n\
    \n现在是测试留言板流程的时间，以确保验证运行正常，并且发布的消息显示在论坛页面上：\n\n![image](img/Image00067.jpg) 打开“发布消息”页面，填写所有字段并提交表单，查看消息是否出现在论坛中\n\
    \n![image](img/Image00210.jpg)\n\n![image](img/Image00211.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n“发布者”详情是从 MySQL “forum”数据库表的 `first_name`、`last_name` 和 `post_date` 列中检索的。\n\
    \n![image](img/Image00068.jpg) 接下来，返回“发布消息”页面，尝试在不输入主题的情况下发布消息以查看错误。\n\n![image](img/Image00212.jpg)\n\
    \n![image](img/Image00069.jpg) 返回“发布消息”页面，并以不同身份发布更多消息，查看它们如何被添加到论坛中。\n\n![image](img/Image00213.jpg)\n\
    \n![image](img/Image00005.jpg)\n\n你可以停止 MySQL 服务并发布一条消息来查看 MySQL 错误报告。\n\n![image](img/Image00005.jpg)\n\
    \n新的论坛消息被添加到此表格底部，但可以通过在 SQL 查询中添加 `SORT` 子句来反转顺序。\n\n## 总结\n\n* PHP 脚本可以使用 `mysqli_connect()`\
    \ 函数连接到 MySQL 数据库，并将主机服务器、用户名、用户密码和数据库名称作为其参数。\n* `mysqli_connect()` 函数返回一个数据库连接对象，该对象可以作为参数提供其他函数，例如\
    \ `mysqli_set_charset()` 函数。\n* `die()` 函数等同于调用 `exit()` 函数来终止脚本。\n* `mysqli_connect_error()`\
    \ 函数在连接尝试失败时返回错误信息，并可以作为 `die()` 函数的参数，在脚本停止时调用。\n* 建议将连接脚本放置在常规 `/htdocs` 目录之外以确保安全，并在需要时使用\
    \ `require` 语句将其引入其他脚本中。\n* `mysqli_ping()` 函数可以验证与指定数据库的连接，然后可以使用 `mysqli_get_server_info()`\
    \ 和 `mysqli_get_host_info()` 获取信息。\n* `mysqli_query()` 函数尝试在指定的数据库对象上执行 SQL 查询，而\
    \ `mysqli_error()` 函数可以用于描述尝试失败的原因。\n* 当数据库连接不再需要时，应始终通过调用 `mysqli_close()` 函数关闭它们。\n\
    * 当数据库查询成功时，`mysqli_num_rows()` 函数可以揭示检索到的总行数。\n* `mysqli_fetch_array()` 函数可以根据成功查询的结果创建一个创建一个包含行和数据的关联数组。\n\
    * PHP 的 `empty()` 函数可以用于测试发布的 HTML 表单字段，以发现它是否为空。\n* 可以使用 `mysqli_query()` 函数向\
    \ MySQL 数据库表添加行数据，然后使用 `mysqli_affected_rows()` 函数进行确认测试。\n* 使用 `header()` 函数指定\
    \ `Location:URL` 参数可以将浏览器重定向到新页面。\n\n12\n\n## 添加 Web 服务\n\n本章演示了如何将 XML 数据整合到\
    \ PHP 脚本中。\n\n### 加载数据\n加载数据\n\n### 获取节点\n获取节点\n\n### 获取属性\n获取属性\n\n### 包含馈源\n\
    包含馈源\n\n### 设置参数\n设置参数\n\n### 选择组件\n选择组件\n\n### 总结\n总结\n\n#### 加载数据\n\nXML 的无处不在使其成为传输数据的理想选择。XML（可扩展标记语言）既是人类可读的也是机器可读的。许多\
    \ Web 服务使用 XML 来交换数据。PHP 提供了几种处理 XML 文件的内置方法。最常见且简单的方法是 `SimpleXML`。\n\nSimpleXML\
    \ 允许你将 XML 数据视为对象。XML 文件中的每个元素都变成对象的属性，嵌套元素变成嵌套对象。\n\n例如：\n\n```php\n$xml = simplexml_load_file('catalog.xml');\n\
    echo $xml->title;\n```\n\n`simplexml_load_file()` 函数加载一个 XML 文件并返回一个 `SimpleXML`\
    \ 对象。如果文件无法加载，它将返回 `false`。你还可以使用 `simplexml_load_string()` 从字符串加载 XML。\n\n```php\n\
    $xml = simplexml_load_string($xml_string);\n```\n\n一个典型的 `catalog.xml` 文件可能如下：\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<catalog>\n  <book category=\"\
    cooking\">\n    <title>Everyday Italian</title>\n    <author>Giada Deiis</author>\n\
    \    <year>2005</year>\n    <price>30.00</price>\n  </book>\n  <book category=\"\
    children\">\n    <title>Harry Potter</title>\n    <author>J.K. Rowling</author>\n\
    \    <year>2005</year>\n    <price>29.99</price>\n  </book>\n</catalog>\n```\n\
    \n在上面的示例中，你可以像这样访问书籍标题：\n\n```php\nforeach ($xml->book as $book) {\n    echo $book->title\
    \ . \" - \" . $book->author . \"<br>\";\n}\n```\n\n要访问属性，使用方括号语法：\n\n```php\n\
    foreach ($xml->book as $book) {\n    echo $book['category'];\n}\n```\n\n你还可以向\
    \ XML 对象添加新元素：\n\n```php\n$new_book = $xml->addChild('book');\n$new_book->addChild('category',\
    \ 'fiction');\n$new_book->addChild('title', 'The Hobbit');\n$new_book->addChild('author',\
    \ 'J.R.R. Tolkien');\n$new_book->addChild('year', '1937');\n$new_book->addChild('price',\
    \ '15.00');\n```\n\n要将修改后的 XML 保存回文件，使用 `asXML()` 方法：\n\n```php\n$xml->asXML('catalog.xml');\n\
    ```\n\n#### 获取节点\n\n`SimpleXML` 对象实现了 `Iterator` 接口，这意味着你可以在 `foreach` 循环中使用它来遍历节点。\n\
    \n```php\nforeach ($xml->book as $book) {\n    echo $book->title . \"<br>\";\n\
    }\n```\n\n如果你想找到特定的节点，可以使用 `xpath()` 方法：\n\n```php\n$books = $xml->xpath('//book[category=\"\
    cooking\"]');\nforeach ($books as $book) {\n    echo $book->title . \"<br>\";\n\
    }\n```\n\n#### 获取属性\n\n如所示，可以使用方括号语法访问属性：\n\n```php\necho $xml->book[0]['category'];\n\
    ```\n\n你还可以使用 `attributes()` 方法列出元素的所有属性：\n\n```php\nforeach ($xml->book[0]->attributes()\
    \ as $name => $value) {\n    echo $name . \": $value<br>\";\n}\n```\n\n#### 包含馈源\n\
    \nRSS 馈是一种用于提供内容更新 XML 文件。你可以使用 `SimpleXML` 解析 RSS 馈：\n\n```php\n$rss = simplexml_load_file('feed.xml');\n\
    foreach ($rss->channel->item as $item) {\n    echo $item->title . \" - \" . $item->link\
    \ . \"<br>\";\n}\n```\n\n#### 设置参数\n\n在与 Web 服务交互时，你可能需要在请求中发送参数。你可以使用 `SimpleXML`\
    \ 构建 XML 请求体：\n\n```php\n$request = new SimpleXMLElement('<request/>');\n$request->addChild('id');\n\
    ```\n\n#### 选择组件\n\n要从 XML 文档选择特定组件，可以使用 `xpath()`：\n\n```php\n$titles = $xml->xpath('//book/title');\n\
    ```\n\n"
