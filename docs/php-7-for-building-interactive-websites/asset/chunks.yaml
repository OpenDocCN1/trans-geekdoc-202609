- raw: "![image](Image00101.jpg) Save the edited document and reopen the page via\
    \ HTTP again to see the HTML code snippet\n\n![image](Image00111.jpg)\n\n![image](Image00102.jpg)\
    \ Use the **View Source** facility in your web browser to see the special character\
    \ entity equivalents encoded by PHP\n\n![image](Image00112.jpg)\n\n![image](Image00005.jpg)\n\
    \nThe PHP function **html\\_entity\\_decode()** can be used to unencode all entities\
    \ back to their original character state.\n\n **Summary** \n\n •  The PHP built-in\
    \ string comparison functions  **strcmp()**  ,  **strncmp()**  ,  **strcasecmp()**\
    \  and  **strncasecmp()**  each typically return a result of 1 (greater), 0 (equal)\
    \ or -1 (less)\n\n •  String comparisons are based on the numerical ASCII value\
    \ of each character, compared in sequence to account for order\n\n •  The ASCII\
    \ value of any character can be found using  **ord()** \n\n •  The length of any\
    \ string can be found using  **strlen()** \n\n •  The numerical index position\
    \ of a substring within a searched string can be found using  **strpos()**  and\
    \  **strrpos()**  functions\n\n •  The search functions  **strstr()**  ,  **stristr()**\
    \  ,  **strchr()**  and  **strrchr()**  each return the remainder of a searched\
    \ string on success\n\n •  The substring functions  **substr()**  ,  **substr\\\
    _replace()**  and  **substr\\_count()**  can extract, replace or count occurrences\n\
    \n •  The characters in a string can be reversed using  **strrev()**  , or the\
    \ string can be repeated using  **strrpt()** \n\n •  Padding characters can be\
    \ added to a string using  **strpad()**  and characters can be removed using \
    \ **trim()**  ,  **ltrim()**  or  **rtrim()** \n\n •  A string can be split into\
    \ individual parts by specifying a delimiter to the  **strtok()**  function\n\n\
    \ •  The  **date()**  function requires a string argument that specifies options\
    \ to determine the format of its returned date string\n\n •  By default the PHP\
    \ date timezone is set to UTC\n\n •  The  **date\\_default\\_timezone\\_set()**\
    \  function can be used to specify an alternative to the UTC default timezone\n\
    \n •  The  **strtotime()**  function will attempt to return an appropriate timestamp\
    \ for whatever date or time argument it receives\n\n •  The  **htmlentities()**\
    \  function will encode all string characters for which there is an equivalent\
    \ entity\n\n •  The  **htmlspecialchars()**  function will encode only characters\
    \ of special HTML significance to avoid recognition by a browser\n\n7\n\n **Building\
    \ classes** \n\n*This chapter demonstrates how to create and use virtual objects\
    \ for Object Oriented Programming with PHP.*\n\n[**Encapsulating data**](#text00009.html#sec47)\n\
    \n[**Creating an object**](#text00009.html#sec48)\n\n[**Initializing members**](#text00009.html#sec49)\n\
    \n[**Using constructors**](#text00009.html#sec50)\n\n[**Inheriting properties**](#text00009.html#sec51)\n\
    \n[**Embracing polymorphism**](#text00009.html#sec52)\n\n[**Summary**](#text00009.html#sec53)\n\
    \n **Encapsulating data** \n\nA class is a data structure that can contain both\
    \ variables and functions in a single entity. These are collectively known as\
    \ its “members” – the variables are known as its class “properties” and the functions\
    \ are known as its class “methods”.\n\n![image](Image00113.jpg)\n\nAccess to class\
    \ members from outside the class is controlled by “access specifiers” in the class\
    \ declaration. Typically, these will deny access to the class variables but allow\
    \ access to methods that can store and retrieve data from those variable members.\
    \ This technique of “data hiding” ensures that stored data is safely encapsulated\
    \ within the class variable members, and is the first principle of Object Oriented\
    \ Programming (OOP).\n\nA class declaration begins with the  **class**  keyword,\
    \ followed by a space, then a programmer-specified name – adhering to the usual\
    \ PHP naming conventions but beginning in uppercase. Next come the class property\
    \ declarations followed by the class method declarations. These are like regular\
    \ variable and function declarations but should each begin with an access specifier.\
    \ The class declaration syntax looks like this:\n\n **class *ClassName*** \n\n\
    \ **{** \n\n ***access-specifier* $*var1* , $*var2* , $*var3* ;** \n\n ***access-specifier\
    \ functionName1* ( $*arg1* , $*arg2* , $*arg3* )** \n\n **{** \n\n ***statements-to-execute*\
    \ ;** \n\n **}** \n\n **}** \n\n![image](Image00005.jpg)\n\nIt is conventional\
    \ to begin class names with an uppercase character and object names with lowercase.\n\
    \nAn access specifier may be any one of the keywords  **public**  ,  **private**\
    \  or  **protected**  , to specify access rights for its listed members:\n\n •\
    \   **public**  members are accessible from any place where the class is visible\n\
    \n •   **private**  members are accessible only to other members of the same class\
    \ in which they are defined\n\n •   **protected**  members are accessible only\
    \ to other members of the same class and members of classes derived from that\
    \ class\n\n![image](Image00005.jpg)\n\nDerived classes are introduced later in\
    \ this chapter – see [here](#text00009.html#sec51) .\n\nAny real-world object\
    \ can be defined by its attributes and by its actions. For example, a dog has\
    \ attributes such as age, weight and color, and actions it can perform such as\
    \ bark. The class mechanism in PHP provides a way to create a virtual dog object\
    \ within a script, where the class properties can represent its attributes and\
    \ the class methods represent its actions:\n\n **class Dog** \n\n **{** \n\n **private\
    \ $age ;  \n\nprivate $weight ;  \n\nprivate $color ;** \n\n **public function\
    \ bark() { echo ‘WOOF!’ ; }** \n\n **// Plus methods here to store data in the\
    \ properties.** \n\n **// Plus methods here to retrieve data from the properties.**\
    \ \n\n **}** \n\n![image](Image00006.jpg)\n\nWhile a PHP script class cannot perfectly\
    \ emulate a real-word object, the aim is to encapsulate all relevant attributes\
    \ and actions as class properties and methods.\n\nIt is important to recognize\
    \ that a class declaration only defines a data structure – in order to create\
    \ an object you must declare an “instance” of that data structure. This is achieved\
    \ by assigning a copy of a class to a variable using the  **new**  keyword, like\
    \ this:\n\n**$fido = new Dog() ;       // Creates an instance named “fido”**\n\
    \n **// of the programmer-defined** \n\n **// “Dog” data structure.** \n\nThe\
    \ instance object is a working copy of the original class data structure so retains\
    \ all its features. As the method in the example above has been declared  **public**\
    \  , it is visible in the script outside the class declaration. This means the\
    \ instance’s copy of the method can be called using a special  **\\->**  object\
    \ operator, like this:\n\n**$fido->bark() ;              // Outputs WOOF!**\n\n\
    The  **\\->**  object operator can be used to reference any visible class member,\
    \ but the variable properties in the example above have been declared  **private**\
    \  so are encapsulated in the object and are not directly accessible. The principle\
    \ of encapsulation in PHP programming describes the grouping together of data\
    \ and functionality in class members – these are the age, weight, color attributes\
    \ and bark action in this Dog class.\n\n![image](Image00019.jpg)\n\nNotice that\
    \ you must add parentheses after the class name in the statement creating an instance\
    \ object.\n\n **Creating an object** \n\nIn order to assign and retrieve data\
    \ from private members of a class, special  **public**  accessor methods must\
    \ be added to the class. These are “setter” methods to assign data, and “getter”\
    \ methods to retrieve data. Accessor methods are often named as the variable they\
    \ address, with the first letter made uppercase, and prefixed by “set” or “get”\
    \ respectively. For example, accessor methods to address an  **age**  variable\
    \ may be named  **setAge()**  and  **getAge()**  .\n\nThe setter and getter methods\
    \ can reference a member of the same class using a special  **$this**  “pseudo-variable”,\
    \ followed by the  **\\->**  object operator, and the property name. For example,\
    \ using  **$this->age**  to reference an age property:\n\n![image](Image00029.jpg)\n\
    \nobject.php"
