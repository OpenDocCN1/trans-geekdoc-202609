    \ capitalized string. Consider these statements for example:\n\n```php\ndefine(\
    \ ‘USER’ , ‘Mike’ ) ;\necho “Hello USER”\n```\n\n...the output here is `Hello\
    \ USER`, not `Hello Mike` as desired.\n\nIn order to include a constant’s value\
    \ in an output string it must be referenced separately and “concatenated” to the\
    \ string with the PHP . concatenation operator, like this:\n\n```php\necho ‘Hello\
    \ ‘ . USER ;\n```\n\n...the output here is now `Hello Mike` as desired.\n\nArray\
    \ constants, in which all elements contain fixed data values, can also be created\
    \ using the `define()` function like this:\n\n```php\ndefine( ‘WEEKDAYS’ , \\\
    [ ‘Mon’, ‘Tue’ , ‘Wed’ , ‘Thu’ , ‘Fri’ \\] ) ;\n```\n\n![image](Image00003.jpg)\n\
    \nThe ability to create constant arrays with the `define()` function is new in\
    \ PHP 7.\n\nConstants defined by the script author can be used just like the predefined\
    \ constants that are built into PHP, such as `PHP_VERSION` and `PHP_OS` that describe\
    \ the version and server operating system.\n\n![image](Image00029.jpg)\n\nconstant.php\n\
    \n![image](Image00036.jpg) Create a valid HTML document, like the one listed [here](#text00003.html#sec5)\
    \ , then insert PHP tags into the body section\n\n```php\n<?php\n# Statements\
    \ to be inserted here.\n?>\n```\n![image](Image00037.jpg) Now, insert between\
    \ the PHP tags a statement to create and initialize a constant\n\n```php\ndefine(\
    \ ‘USER’ , ‘Mike’ ) ;\n```\n![image](Image00038.jpg) Add a statement to create\
    \ and initialize an array constant\n\n```php\ndefine( ‘PETS’ , \\[ ‘Kitten’ ,\
    \ ‘Puppy’ , ‘Hamster’ \\] ) ;\n```\n![image](Image00039.jpg) Next, insert a statement\
    \ to display two constant values in a concatenated string\n\n```php\necho ‘<p>Hello\
    \ ‘ . USER . ‘ how is your ‘ . PETS[1] . ‘?</p>’ ;\n```\n![image](Image00040.jpg)\
    \ Insert a statement to display the predefined constant value of the PHP version\
    \ in a concatenated string\n\n```php\necho ‘<p>You are using PHP version ‘ . PHP_VERSION\
    \ ;\n```\n![image](Image00041.jpg) Finally, insert a statement to display the\
    \ predefined constant value of the host operating system in a string\n\n```php\n\
    echo ‘ running on ‘ . PHP_OS . ‘</p> ;\n```\n![image](Image00042.jpg) Save the\
    \ document in your web server’s `/htdocs` directory as `constant.php` then open\
    \ the page via HTTP to see the results get displayed.\n\n![image](Image00051.jpg)\n\
    \n![image](Image00019.jpg)\n\nYou cannot include constants in mixed strings, or\
    \ change their value, or begin their name with a dollar sign.\n\n![image](Image00006.jpg)\n\
    \nYou should always use uppercase for constant names to differentiate them from\
    \ variables.\n\n### Exploring superglobals\n\nPHP provides several predefined\
    \ variables that are globally available anywhere within any script. These are\
    \ aptly known as “superglobals” and are described here:\n\n- `GLOBALS` – an associative\
    \ array containing references to all global variables.\n- `SERVER` – an associative\
    \ array containing information such as headers, paths, and script locations.\n\
    - `GET` – associative array of variables passed via URL parameters.\n- `POST`\
    \ – associative array of variables passed via HTML form.\n- `FILES` – associative\
    \ array of uploaded files.\n- `COOKIE` – associative array to get data from a\
    \ cookie.\n- `SESSION` – associative array used to store data on the web server.\n\
    - `REQUEST` – associative array that default contains contents of `GET`, `POST`,\
    \ and `COOKIE`.\n- `ENV` – associative array containing environment variables.\n\
    \nFor example: \n\n```php\nforeach( $GLOBALS as $key => $value ) echo $key;\n\
    ```\n![image](Image00052.jpg)\n"
  trans: "\n\n```php\nforeach( $data as $type )\n{\n    var_dump( $type ) ;\n    echo\
    \ '<br> ;\n}\n```\n![image](img/Image00039.jpg) 最后，插入语句来销毁文件流资源，然后再次尝试获取它的数据类型。\n\
    \n```php\nfclose( $filestream ) ;\necho gettype( $filestream ) ;\n```\n![image](img/Image00040.jpg)\
    \ 将文档保存到 Web 服务器的 `/htdocs` 目录并为 `types.php`，然后通过 HTTP 打开该页面以查看显示的数据类型和值。\n\n\
    ![image](img/Image00050.jpg)\n\n![image](img/Image00005.jpg)\n\nPHP 文件流资源的创建和使用在\
    \ 第 8 章 中进行了详细演示。\n\n![image](img/Image00005.jpg)\n\n布尔常量 `TRUE` 和 `FALSE` 不区分大小写，因此可以写为\
    \ `true` 和 `false`。\n\n### 定义常量\n\n脚本中永远不会改变的固定数据值应该存储在 PHP “常量”中，而不是变量中。常量是一个命名的容器，可以在其中存储数值或字符串值，并可以使用常量的名称进行引用。\n\
    \n与变量不同，常量不能包含 `TRUE` 或 `FALSE` 的布尔值，不能表示对象，也不能表示 `NULL` 空值。此外，常量在脚本执行过程中不能被更改。这保护了常量值不被意外修改，是一种良好的编程实践。\n\
    \n![image](img/Image00005.jpg)\n\n在创建变量时，务必考虑其值是否会改变——如果不会改变，你本应该创建一个常量。例如，`define(\
    \ ‘PI’ , 3.14 ) ;`。\n\n常量的命名遵循与变量相同的命名规范，但传统上使用大写字母作为常量名——以便于将其与变量名区分开。使用 `define()`\
    \ 函数创建常量来指定常量的名称和它将包含的值，如下：\n\n```php\ndefine( ‘NAME’ , value ) ;\n```\n\n最重要的是，常量名前没有\
    \ `$` 符号符号前缀，因此它们不能包含在用于显示的混合字符串中——因为 PHP 无法区分常量名和普通的大写字符串。考虑以下语句作为示例：\n\n```php\n\
    define( ‘USER’ , ‘Mike’ ) ;\necho “Hello USER”\n```\n\n...这里的输出是 `Hello USER`，而不是预期的\
    \ `Hello Mike`。\n\n为了将常量的值包含在输出字符串中，必须单独引用它并使用 PHP 的 `.` 拼接运算符将其“连接”到字符串，如下：\n\
    \n```php\necho ‘Hello ‘ . USER ;\n```\n\n...这里的输出现在是预期的 `Hello Mike`。\n\n数组常量（所有元素都包含固定数据值的数组）也可以使用\
    \ `define()` 函数创建，如下：\n\n```php\ndefine( ‘WEEKDAYS’ , \\[ ‘Mon’, ‘Tue’ , ‘Wed’\
    \ , ‘Thu’ , ‘Fri’ \\] ) ;\n```\n\n![image](img/Image00050.jpg) 使用 `define()` 函数创建数组常量在\
    \ PHP 中是新的。由脚本定义的常量可以像预定义常量一样使用，例如 `PHP_VERSION` 和 `PHP_OS`，它们描述版本和操作系统。\n\n![image](img/Image00029.jpg)\n\
    \n![image](img/Image00039.jpg) constant\n\n![image](img/Image00036.jpg) 创建有效的\
    \ HTML 文档![image](img/Image00037.jpg) 在 body 中插入 PHP 标签\n\n```php\n<?php\n# Statements\
    \ here.\n?>\n![image](img/Image00038.jpg) 现在，在 PHP 标签之间创建一个常量\n\n```php\ndefine(\
    \ ‘USER’ , ‘Mike’ ) ;\n```\n![image](img/Image00040.jpg) 添加一个语句创建一个数组\n\n```php\n\
    define( ‘PETS’ , \\[ ‘Kitten’ , ‘Puppy’ , ‘Hamster’ \\] ;\n```\n![image](img/Image00041.jpg)\
    \ 接下来，插入一个语句在字符串中显示两个常量值\n\n```php\necho ‘<p>Hello ‘ . USER . ‘ is your ‘ . PETS\
    \ . ‘?</p> ;\n```\n![image](img/Image00042.jpg) 插入一个语句显示 PHP 版本的预定义常量\n\n```php\n\
    echo ‘<p>You are using PHP version ‘ . PHP_VERSION ;\n```\n![image](img/Image00043.jpg)\
    \ 最后，插入一个语句在字符串中显示主机操作系统的预定义常量\n\n```php\necho ‘<p> running on ‘ . PHP_OS . ‘</p>\
    \ ;\n```\n![image](img/Image00044.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并为 `constant.php`，然后通过\
    \ HTTP 打开页面以查看结果。\n\n![image](img/Image00051.jpg)\n\n![image](img/Image00019.jpg)\
    \ 你不能将常量包含在混合字符串中，不能更改它的值，也不能以美元符号开头命名。\n\n![image](img/Image00006.jpg) 你应该始终使用大写字母区分常量与变量。\n\
    \n### 探索全局变量\n\nPHP 提供了在任何脚本范围内全局可用的预定义变量。这些被形象地称为“全局变量”，如下：\n\n- `GLOBALS` –\
    \ 包含所有全局变量引用的关联数组。\n- `SERVER` – 包含头部、路径和脚本位置等信息的关联数组。\n- `GET` – 通过 URL 参数传递的变量关联数组。\n\
    - `POST` – 通过 HTML 表单传递的变量关联数组。\n- `FILES` – 上传文件的关联数组。\n- `COOKIE` – 用于从 cookie\
    \ 获取数据的关联数组。\n- `SESSION` – 用于在 Web 服务器上存储数据的关联数组。\n- `REQUEST` – 默认包含 `GET`、`POST`\
    \ 和 `COOKIE` 内容的关联数组。\n- `ENV` – 包含环境变量的关联数组。\n\n例如：\n\n```php\nforeach( $GLOBALS\
    \ as $key => $value ) echo $key;\n```\n![image](img/Image00052.jpg)\n\n"
