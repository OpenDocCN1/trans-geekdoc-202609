- raw: "![image](Image00058.jpg) Click the hyperlink to return to the HTML form and\
    \ enter a valid username, then push the submit button to see the login attempt\
    \ fail validation again\n\n![image](Image00181.jpg)\n\n![image](Image00061.jpg)\
    \ Return to the HTML form once more and enter a valid username and password to\
    \ see validation succeed\n\n![image](Image00182.jpg)\n\n![image](Image00183.jpg)\n\
    \n![image](Image00184.jpg) See overleaf how to view data stored within cookies,\
    \ using the  **cookie\\_data.php**  target of the hyperlink seen above\n\n![image](Image00006.jpg)\n\
    \nYou can also return to the HTML form and enter a username or a password that\
    \ includes non-alphanumeric characters, to see validation fail again.\n\n![image](Image00005.jpg)\n\
    \nValidation could be extended. For example, it may also allow underscore characters\
    \ and might specify a minimum permissible password length.\n\n **Viewing cookie\
    \ data** \n\nThe special PHP  **$\\_COOKIE**  global array variable stores cookie\
    \ names and values in an associative array of keys and values. Stored content\
    \ can be viewed by looping through the array to see all names and values, or using\
    \ the PHP  **var\\_dump()**  function:\n\n![image](Image00029.jpg)\n\ncookie\\\
    _data.php\n\n![image](Image00054.jpg) Begin a PHP script with a test to find if\
    \ any cookies are set and retrieve all stored names and values upon success\n\n\
    \ **<?php** \n\n**if( count( $\\_COOKIE ) > 0 )**\n\n **{** \n\n**echo ‘<dl> ‘\
    \ ;**\n\n**foreach( $\\_COOKIE as $key \\=> $value )**\n\n **{** \n\n**echo “<dt>Key:\
    \ $key ” ;**\n\n**echo “<dd>Value: $value ” ;**\n\n **}** \n\n**echo ‘</dl><hr>’\
    \ ;**\n\n**var\\_dump( $\\_COOKIE ) ;**\n\n **}** \n\n![image](Image00055.jpg)\
    \ Next, add alternative output for when cookies are absent\n\n **e** l**se** \n\
    \n **{** \n\n**echo ‘Please <a href=” cookie\\_form.html ”>Log In</a>’ ;**\n\n\
    \ **}** \n\n **?>** \n\n![image](Image00056.jpg) Save the document in your web\
    \ server’s  **/htdocs**  directory as  **cookie\\_data.php** \n\n![image](Image00057.jpg)\
    \ Now, open the HTML form  **cookie\\_form.html**  ([here](#text00012.html#cookie)\
    \ ) via HTTP and enter valid login data, then follow the link on  **cookie\\_get.php**\
    \  ([here](#text00012.html#cookiep) ) to see cookie data\n\n![image](Image00185.jpg)\n\
    \n![image](Image00005.jpg)\n\nYou can call the **setcookie( )** function at any\
    \ time to create a new cookie or overwrite an existing cookie.\n\n![image](Image00186.jpg)\n\
    \n![image](Image00058.jpg) Open the **Settings** menu in your web browser and\
    \ clear existing cookies that are stored on your system\n\n![image](Image00061.jpg)\
    \ Now, use the ![image](Image00187.jpg)Refresh button in your browser to reload\
    \ this page and see the alternative content – confirming that the cookie data\
    \ has been removed\n\n![image](Image00188.jpg)\n\n![image](Image00189.jpg)\n\n\
    ![image](Image00005.jpg)\n\nThe PHP manual describes the removal of a cookie by\
    \ setting its value to empty and its expiration date to the past. For example,\
    \ **setcookie(**   **$\\_COOKIE\\[ ‘user’ \\] , ‘‘ , time()-3600 )** . Additionally,\
    \ the **unset()** function can be used to destroy a specified variable.\n\n **Submitting\
    \ session data** \n\nUser data can be stored in cookies on the client computer\
    \ only if the user chooses to allow cookies onto their system. Many users prefer\
    \ to disallow cookies, however, to avoid tracking – but PHP provides a better\
    \ alternative. With PHP, user data can be stored on the server using the special\
    \  **$\\_SESSION**  global array variable. In order for PHP sessions to work,\
    \ each PHP page must call the built-in  **session\\_start()**  function at the\
    \ top of the page – before any HTML tags! HTML form submissions to the server\
    \ via the  **POST**  method assigns field data to the special PHP  **$\\_POST**\
    \  global array variable, and individual submission fields can be sought using\
    \ the built-in PHP  **isset()**  function. When this confirms the field is present,\
    \ its name and value can be stored in a session variable. This might be used to\
    \ store a username and password details for use across a website, as an alternative\
    \ to cookie storage:\n\n![image](Image00174.jpg)\n\nsession\\_form.html\n\n![image](Image00054.jpg)\
    \ Create an HTML document and add this form to its body section, specifying submission\
    \ method and the name of a PHP submission-handler script\n\n**<form name = ”entry”\
    \ method = ” POST ” action = ” session\\_set.php ”>**\n\n **<fieldset>** \n\n\
    **<legend>F or Name : Enter Only Letters </legend>  \n\nName : <input type=”text”\
    \ name=” user ” >**\n\n**Password : <input type=”password” name=” pass ” >**\n\
    \n**<p> For Password : Enter Only A-Z a-z 0-9 . \\_ (Minimum 8**\n\n**Characters)\
    \ </p> <input type=”submit” value=”Log In”>**\n\n **</fieldset>** \n\n **</form>**\
    \ \n\n![image](Image00055.jpg) Save the document in your web server’s  **/htdocs**\
    \  directory as  **session\\_form.html**  then open the page via HTTP to see the\
    \ form\n\n![image](Image00190.jpg)\n\n![image](Image00019.jpg)\n\nSession variables\
    \ will only be accessible to a PHP script if the **session\\_ start()** function\
    \ has been called at the top of the page.\n\n **Setting sessions** \n\nUpon receiving\
    \ a form submission, a PHP script can check for the presence of fields and might\
    \ perform validation of their associated values. For example, the  **ctype\\_alpha()**\
    \  function could be used to confirm they contain only letters, and the  **preg\\\
    _match()**  function could be used to confirm a value matches a specified pattern.\
    \ Once validated, the submitted fields’ names and values can be assigned to elements\
    \ of the  **$\\_SESSION**  global array variable. On successful completion, the\
    \ script can relocate the browser to the next page using the  **header()**  function\
    \ to specify that page’s URL:\n\n![image](Image00029.jpg)\n\nsession\\_set.php\n\
    \n![image](Image00054.jpg) Add an initial PHP script to make sessions available\n\
    \n **<?php session\\_start(); ?>** \n\n![image](Image00055.jpg) Begin a PHP script\
    \ to handle failed validation attempts\n\n **<?php** \n\n**function reject ( $entry\
    \ )**\n\n **{** \n\n**echo “Invalid $entry <br>” ;**\n\n**echo ‘Please <a href=”\
    \ session\\_form.html ”>Log In</a>’ ;**\n\n **exit() ;** \n\n **}** \n\n![image](Image00056.jpg)\
    \ Add a conditional test block to set two cookies for valid data, or call the\
    \ function to handle failed attempts\n\n**if( isset( $\\_POST\\[ ‘user’ \\] )\
    \ )**\n\n **{** \n\n**$user \\= trim( $\\_POST\\[ ‘user’ \\] ) ;**\n\n**if( !ctype\\\
    _alpha( $user ) ) { reject( ‘User Name’ ) ; }**\n\n**if( isset( $\\_POST\\[ ‘pass’\
    \ \\] ) )**\n\n **{** \n\n**$pass \\= trim( $\\_POST\\[ ‘pass’ \\] ) ;**\n\n**if(\
    \ !preg\\_match( ‘/^\\[A-Za-z0-9.\\_\\]{8,}$/’ , $pass ) )**\n\n**{ reject( ‘Password’\
    \ ) ; }**\n\n **else** \n\n **{** \n\n**$\\_SESSION\\[ ‘user’ \\] \\= $user ;**\n\
    \n**$\\_SESSION\\[ ‘pass’ \\] \\= $pass ;**\n\n**header( ‘Location: session\\\
    _get.php ’ ) ;**\n\n **}** \n\n **}** \n\n**} else { header( ‘Location: session\\\
    _form.html ’ ) ; }**\n\n **?>** \n\n![image](Image00057.jpg) Save the document\
    \ in your web server’s  **/htdocs**  directory as  **session\\_set.php**  then\
    \ see overleaf how to retrieve data\n\n![image](Image00006.jpg)\n\nThe **ctype\\\
    _alpha()** function returns true only if its argument contains letters.\n\n![image](Image00005.jpg)\n\
    \nThe **preg\\_match()** function accepts a regular expression and a string argument.\
    \ Regular expressions are beyond the remit of this book but you can precisely\
    \ copy this example to allow the permissible password pattern described on the\
    \ form. The password is left unencrypted in this example, to demonstrate later\
    \ that the user password meets the specified requirements.\n\n **Getting sessions**\
    \ \n\nSession data is accessible from the special  **$\\_SESSION**  global array\
    \ variable after a call is made to the  **session\\_start()**  function. The PHP\
    \  **isset()**  function can seek an element of a specified name. When this confirms\
    \ the element is present, its value can usefully be assigned to a regular script\
    \ variable. This might be used to retrieve a stored username for output on a page.\
    \ Where a sought element is absent, the script can offer an alternative to the\
    \ user:\n\n![image](Image00029.jpg)\n\nsession\\_get.php"
  fmt: "\n![image](Image00058.jpg) Click the hyperlink to return to the HTML form\
    \ and enter a valid username, then push the submit button to see the login attempt\
    \ fail validation again\n\n![image](Image00181.jpg)\n\n![image](Image00061.jpg)\
    \ Return to the HTML form once more and enter a valid username and password to\
    \ see validation succeed\n\n![image](Image00182.jpg)\n\n![image](Image00183.jpg)\n\
    \n![image](Image00184.jpg) See overleaf how to view data stored within cookies,\
    \ using the `cookie_data.php` target of the hyperlink seen above\n\n![image](Image00006.jpg)\n\
    \nYou can also return to the HTML form and enter a username or a password that\
    \ includes non-alphanumeric characters, to see validation fail again.\n\n![image](Image00005.jpg)\n\
    \nValidation could be extended. For example, it may also allow underscore characters\
    \ and might specify a minimum permissible password length.\n\n## Viewing cookie\
    \ data\n\nThe special PHP `$_COOKIE` global array variable stores cookie names\
    \ and values in an associative array of keys and values. Stored content can be\
    \ viewed by looping through the array to see all names and values, or using the\
    \ PHP `var_dump()` function:\n\n![image](Image00029.jpg)\n\ncookie_data.php\n\n\
    ![image](Image00054.jpg) Begin a PHP script with a test to find if any cookies\
    \ are set and retrieve all stored names and values upon success\n\n```php\n<?php\n\
    if( count( $_COOKIE ) > 0 )\n{\n    echo ‘<dl> ‘ ;\n    foreach( $_COOKIE as $key\
    \ => $value )\n    {\n        echo “<dt>Key: $key ” ;\n        echo “<dd>Value:\
    \ $value ” ;\n    }\n    echo ‘</dl><hr>’ ;\n    var_dump( $_COOKIE ) ;\n}\n```\n\
    \n![image](Image00055.jpg) Next, add alternative output for when cookies are absent\n\
    \n```php\nelse\n{\n    echo ‘Please <a href=” cookie_form.html ”>Log In</a>’ ;\n\
    }\n?>\n```\n\n![image](Image00056.jpg) Save the document in your web server’s\
    \ `/htdocs` directory as `cookie_data.php`\n\n![image](Image00057.jpg) Now, open\
    \ the HTML form `cookie_form.html` ([here](#text00012.html#cookie) ) via HTTP\
    \ and enter valid login data, then follow the link on `cookie_get.php` ([here](#text00012.html#cookiep)\
    \ ) to see cookie data\n\n![image](Image00185.jpg)\n\n![image](Image00005.jpg)\n\
    \nYou can call the `setcookie()` function at any time to create a new cookie or\
    \ overwrite an existing cookie.\n\n![image](Image00186.jpg)\n\n![image](Image00058.jpg)\
    \ Open the `Settings` menu in your web browser and clear existing cookies that\
    \ are stored on your system\n\n![image](Image00061.jpg) Now, use the ![image](Image00187.jpg)Refresh\
    \ button in your browser to reload this page and see the alternative content –\
    \ confirming that the cookie data has been removed\n\n![image](Image00188.jpg)\n\
    \n![image](Image00189.jpg)\n\n![image](Image00005.jpg)\n\nThe PHP manual describes\
    \ the removal of a cookie by setting its value to empty and its expiration date\
    \ to the past. For example, `setcookie($_COOKIE['user'], ‘’, time()-3600 )`. Additionally,\
    \ the `unset()` function can be used to destroy a specified variable.\n\n## Submitting\
    \ session data\n\nUser data can be stored in cookies on the client computer only\
    \ if the user chooses to allow cookies onto their system. Many users prefer to\
    \ disallow cookies, however, to avoid tracking – but PHP provides a better alternative.\
    \ With PHP, user data can be stored on the server using the special `$_SESSION`\
    \ global array variable. In order for PHP sessions to work, each PHP page must\
    \ call the built-in `session_start()` function at the top of the page – before\
    \ any HTML tags! HTML form submissions to the server via the `POST` method assigns\
    \ field data to the special PHP `$_POST` global array variable, and individual\
    \ submission fields can be sought using the built-in PHP `isset()` function. When\
    \ this confirms the field is present, its name and value can be stored in a session\
    \ variable. This might be used to store a username and password details for use\
    \ across a website, as an alternative to cookie storage:\n\n![image](Image00174.jpg)\n\
    \nsession_form.html\n\n![image](Image00054.jpg) Create an HTML document and add\
    \ this form to its body section, specifying submission method and the name of\
    \ a PHP submission-handler script\n\n```html\n<form name = ”entry” method = ”\
    \ POST ” action = ” session_set.php ”>\n<fieldset>\n    <legend>For or Name :\
    \ Enter Only Letters </legend>\n    Name : <input type=”text” name=” user ”>\n\
    \    Password : <input type=”password” name=” pass ”>\n    <p> For Password :\
    \ Enter minimum 8 characters</p>\n    <input type=\"\"submit” value=”Submit”>\n\
    </fieldset>\n</form>\n```\n\n![image](Image00055.jpg) Save the document in your\
    \ web server’s `/htdocs` directory as `session_set.php`\n\n![image](Image00057.jpg)\
    \ Now, open the HTML form `cookie_form.html` via HTTP and enter valid login data,\
    \ then see overleaf how to retrieve data\n\n```php\n<?php\nsession_start();\n\
    function reject($entry)\n{\n    echo “Invalid $entry” ;\n    exit();\n}\n\nif(\
    \ isset($_POST['user']) )\n{\n    $user = trim($_POST['user']);\n    if( !ctype_alpha($user)\
    \ ) {\n        reject('User Name’);\n    }\n    if( isset($_POST['pass']) )\n\
    \    {\n        $pass = trim($_POST['pass']);\n        if( !preg_match('/^[A-Za-z0-9]{8,}$/',',\
    \ $pass) ) {\n            reject('Password’);\n        }\n        else\n     \
    \   {\n            $_SESSION['user'] = $user;\n            $_SESSION['pass'] =\
    \ $pass;\n            header(Location: session_get.php’ ) ;\n        }\n    }\n\
    } else {\n    header(Location: session_form.html’ ) ;\n}\n?>\n```\n\n![image](Image00029.jpg)\n\
    \nsession_get.php\n"
  trans: "\n![image](img/Image00058.jpg) 点击超链接返回 HTML 表单并输入有效的用户名，然后点击提交按钮再次查看登录尝试验证失败。\n\
    \n![image](img/Image00181.jpg)\n\n![image](img/Image00061.jpg) 再次返回 HTML 表单并输入有效的用户名和密码，查看验证成功。\n\
    \n![image](img/Image00182.jpg)\n\n![image](img/Image00183.jpg)\n\n![image](img/Image00184.jpg)\
    \ 使用上文链接中的 `cookie_data.php` 目标，查看下文如何查看存储在 cookie 中的数据。\n\n![image](img/Image00006.jpg)\n\
    \n你也可以返回 HTML 表单，并输入包含非字母数字字符的用户名或密码，以查看验证再次失败。\n\n![image](img/Image00005.jpg)\n\
    \n验证可以进一步扩展。例如，它可能还会允许下划线字符，并可能指定最小允许密码长度。\n\n## 查看 cookie 数据\n\n特殊的 PHP `$_COOKIE`\
    \ 全局数组变量以键值对关联数组的形式存储 cookie 名称和值。可以通过遍历数组查看所有名称和值，或使用 PHP `var_dump()` 函数来查看存储的内容：\n\
    \n![image](img/Image00029.jpg)\n\ncookie_data.php\n\n![image](img/Image00054.jpg)\
    \ 开始一个 PHP 脚本，通过测试是否设置了任何 cookie，并在成功后检索所有存储的名称和值：\n\n```php\n<?php\nif( count(\
    \ $_COOKIE ) > 0 )\n{\n    echo ‘<dl> ‘ ;\n    foreach( $_COOKIE as $key => $value\
    \ )\n    {\n        echo “<dt>Key: $key ” ;\n        echo “<dd>Value: $value ”\
    \ ;\n    }\n    echo ‘</dl><hr>’ ;\n    var_dump( $_COOKIE ) ;\n}\n```\n\n![image](img/Image00055.jpg)\
    \ 接下来，为 cookie 不存在的情况添加备输出\n\n```php\nelse\n{\n    echo ‘Please <a href=” cookie_form.html\
    \ ”>Log In</a>’ ;\n}\n?>\n```\n\n![image](img/Image00056.jpg) 将文档保存到 Web 服务器的\
    \ `/htdocs` 目录下，命名为 `cookie_data.php`\n\n![image](img/Image00057.jpg) 现在，通过 HTTP\
    \ 打开 HTML 表单 `cookie_form.html` (此处 ) 并输入有效的登录数据，然后点击 `cookie_get.php` 上的链接 (此处\
    \ ) 来查看 cookie 数据。\n\n![image](img/Image00185.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n你可以随时调用 `setcookie()` 函数创建新的 cookie 或覆盖现有的 cookie。\n\n![image](img/Image00186.jpg)\n\
    \n![image](img/Image00058.jpg) 打开浏览器中的 `Settings` 菜单并清除存储在系统上的现有 cookie\n\n![image](img/Image00061.jpg)\
    \ 现在，使用浏览器中的 ![image](img/Image00187.jpg)刷新按钮重新加载此页面，并查看备用内容——确认 cookie 数据已删除。\n\
    \n![image](img/Image00188.jpg)\n\n![image](img/Image00189.jpg)\n\n![image](img/Image00005.jpg)\n\
    \nPHP 手册描述了通过将 cookie 的值设置为空并将过期日期设置为过去来删除 cookie。例如，`setcookie($_COOKIE['user'],\
    \ ‘’, time()-3600 )`。此外，可以使用 `unset()` 函数销毁指定的变量。\n\n## 提交会 数据\n\n只有当用户选择允许 cookie\
    \ 进入其系统时，用户数据才能存储在客户端计算机的 cookie 中。然而，许多用户为了避免追踪而倾向于禁用 cookie——但 PHP 提供了一个更好的替代方案。通过\
    \ PHP，可以使用特殊的 `$_SESSION` 全局数组变量将用户数据存储在服务器上。为了让 PHP Session 生效，每个 PHP 页面必须在页面顶部调用内置的\
    \ `session_start()` 函数——必须在任何 HTML 标签之前！通过 `POST` 方法向服务器提交 HTML 表单会将字段数据分配给特殊的\
    \ PHP `$_POST` 全局数组变量，并可以使用内置的 PHP `isset()` 函数查找单个提交字段。当确认该字段存在时，可以将其名称和值存储在会话变量中。这可以用于存储用户名和密码详情以供跨网站使用，作为\
    \ cookie 存储的替代方案：\n\n![image](img/Image00174.jpg)\n\nsession_form.html\n\n![image](img/Image00054.jpg)\
    \ 创建一个 HTML 文档并将表单添加到其 body 部分，指定提交方法和 PHP 处理脚本的名称\n\n```html\n<form name = ”entry”\
    \ method = ” POST ” action = ” session_set.php ”>\n<fieldset>\n    <legend>For\
    \ or Name : Enter Only Letters </legend>\n    Name : <input type=”text” name=”\
    \ user ”>\n    Password : <input type=”password” name=” pass ”>\n    <p> For Password\
    \ : Enter minimum 8 characters</p>\n    <input type=\"\"submit” value=”Submit”>\n\
    </fieldset>\n</form>\n```\n\n![image](img/Image00055.jpg) 将文档保存到 Web 服务器的 `/htdocs`\
    \ 目录下，命名为 `session_set.php`\n\n![image](img/Image00057.jpg) 现在，通过 HTTP 打开 HTML\
    \ 表单 `cookie_form.html` 并输入有效的登录数据，然后查看下文如何检索数据\n\n```php\n<?php\nsession_start();\n\
    function reject($entry)\n{\n    echo “Invalid $entry” ;\n    exit();\n}\n\nif(\
    \ isset($_POST['user']) )\n{\n    $user = trim($_POST['user']);\n    if( !ctype_alpha($user)\
    \ ) {\n        reject('User Name’);\n    }\n    if( isset($_POST['pass']) )\n\
    \    {\n        $pass = trim($_POST['pass']);\n        if( !preg_match('/^[A-Za-z0-9]{8,}$/',',\
    \ $pass) ) {\n            reject('Password’);\n        }\n        else\n     \
    \   {\n            $_SESSION['user'] = $user;\n            $_SESSION['pass'] =\
    \ $pass;\n            header(Location: session_get.php’ ) ;\n        }\n    }\n\
    } else {\n    header(Location: session_form.html’ ) ;\n}\n?>\n```\n\n![image](img/Image00029.jpg)\n\
    \nsession_get.php\n\n"
