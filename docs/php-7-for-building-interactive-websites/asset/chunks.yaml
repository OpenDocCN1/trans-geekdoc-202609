    <b> $str </b><br> $message <hr>\"\n} \n```\n\n![image](img/Image00010.jpg) 接下来，指派该函数来处理错误\n\
    \n```php\nset_error_handler( 'error_handler' ) ;\n```\n\n![image](img/Image00012.jpg)\
    \ 现在，搞点破坏——尝试访问一个未初始化的变量并尝试打开一个不存在的文件\n```php\necho($var) ;\n$file = fopen('nonsuch.txt',\
    \ 'r') ;\n```\n\n![image](img/Image00014.jpg) 显式触发自定义错误处理程序\n\n```php\n$number\
    \ = 2 ;\nif($number >=1)\n{ \n    trigger_error('Value of number must be 1 or\
    \ less') ;\n} \n```\n\n![image](img/Image00015.jpg) 将文档保存到 Web 服务器的 `/htdocs`\
    \ 目录下并命名为 `error.php`，然后通过 HTTP 打开页面以查看错误级别和相应的消息\n\n![image](img/Image00151.jpg)\n\
    \n![image](img/Image00006.jpg)\n\n注意，脚本在报告每个错误后会继续运行，不会在错误时终止。\n\n### 捕获异常\n\n\
    我们可以选择当特定错误条件发生时脚本应该如何进行。这种错误条件被称为“异常”（exception）。当异常发生时，称为“抛出”（thrown），处理该异常的代码被称为它的“捕获”（catch）。如果异常没有被捕获，PHP\
    \ 将其视为致命错误并发出一个难看的“未捕获异常”（Uncaught Exception）消息，类似于：\n\n![image](img/Image00152.jpg)\n\
    \n![image](img/Image00019.jpg)\n\n每个 `try` 块必须有一个关联的 `catch` 块，否则将发生致命的未捕获异常错误。\n\
    \n处理异常的关键是尝试在 `try` 代码块内执行操作来预判错误，并在关联的 `catch` 代码块中确定脚本应该如何进行。捕获块将接收一个 `Exception`\
    \ 类对象，该对象拥有 `getMessage()`、`getFile()` 和 `getLine()` 方法来获取详情。\n\n可以使用 `new` 关键字创建\
    \ `Exception` 类的实例，并可以使用 `throw` 关键字显式地抛出。\n\n还可以作为 `Exception` 类的派生类创建自定义异常处理程序，以提供你自己的自定义方法：\n\
    \n![image](img/Image00029.jpg)\n\nexception.php\n\n![image](img/Image00008.jpg)\
    \ 通过定义一个在条件测试失败时抛出异常的函数来启动 PHP 脚本\n\n```php\n<?php \n\nfunction check_size($num)\n\
    { \n    if($num < 10)\n    { \n        throw new Exception(\"Number : $num<br>Value\
    \ must exceed 10\") ; \n    }\n} \n```\n\n![image](img/Image00010.jpg) 预判特定错误并报告异常\n\
    \n```php\ntry { check_size(5) ; }\ncatch( Exception $e )\n{     \n    echo '<b>Size\
    \ Exception!</b><br>'.$e->getMessage() .'<hr>' ;     \n}\n```\n\n![image](img/Image00012.jpg)\
    \ 接下来，创建一个自定义异常处理类\n\n```php\nclass CustomException extends Exception\n{ \n  \
    \  public function get_details()\n    { \n        $details = ' File : ' . $this->getFile()..\n\
    \        '<br>Line : ' . $this->getLine()..\n        '<br>' . $this->getMessage()\
    \ ;\n        return $details;\n    }\n}\n```\n\n![image](img/Image00014.jpg) 现在，添加另一个会抛出异常的函数\n\
    \n```php\nfunction check_parity($num)\n{ \n    if($num % 2 !== 0)\n    { \n  \
    \      throw new CustomException(\"Number must be even\") ;\n    }\n}\n```\n\n\
    ![image](img/Image00115.jpg) 最后，预判特定错误并报告异常\n\n```php\ntry { check_parity(5) ;\
    \ }\ncatch( Exception $e )\n{     \n    echo '<b>Size Exception!</b><br>'.$e->getMessage()\
    \ .'<hr>' ;     \n}\n```\n\n注意，脚本在报告每个错误后会继续运行，不会在错误时终止。\n\n### 总结\n\n- 可以将函数名作为\
    \ `set_error_handler()` 函数的参数，将其指派为错误处理程序。\n- 错误处理函数在错误发生时被调用，也可以使用 `trigger_error()`\
    \ 函数显式地调用。\n- 当特定错误发生时会抛出异常。\n- 如果异常没有被捕获，PHP 将其视为致命错误并发出未捕获异常消息。\n- `try` 代码块用于预判特定错误，关联的\
    \ `catch` 块用于确定当错误发生时脚本应该如何进行。\n- `Exception` 类对象拥有 `getMessage()`、`getFile()`\
    \ 和 `getLine()` 方法，可以获取异常详情。\n- 可以作为 `Exception` 类的派生类创建自定义异常处理程序，以提供自定义异常方法。\n\
    \n"
