    \ and can contain member variable properties and member function methods\n\n •\
    \  Access to class members from outside the class is controlled by the  **public**\
    \  ,  **private**  or  **protected**  access specifier keywords\n\n •  Variable\
    \ properties are encapsulated by declaring them  **private**  so their values\
