    Changing values


    The PHP ++ operator and -- operator alter the given number by one and return the
    resulting value. These are often used to count iterations in a loop. The increment
    operator increases the value by one and the decrement operator decreases the value
    by one. Each of these operators may appear either before or after the variable
    containing the number to be changed to different effect! When either of these
    operators are placed before the variable (“prefixed”), they change the value by
    one then return the modified value, but when they are placed after the variable
    (“postfixed”) they return the current value, then change the value by one:


