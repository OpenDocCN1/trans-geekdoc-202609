- raw: " •  An HTML  **<form>**  tag’s  **action**  attribute specifies the PHP script\
    \ to handle the form submission, and its  **method**  attribute specifies how\
    \ the data is sent to the script\n\n •  Form data submitted by the  **POST** \
    \ method gets automatically stored in the PHP superglobal  **$\\_POST**  array\
    \ variable\n\n •  Elements of the  **$\\_POST**  array are named the same as the\
    \ HTML form element containing each submitted value\n\n •  PHP can ensure that\
    \ the user has entered data into submitted HTML form fields using the built-in\
    \  **isset()**  function\n\n •  The PHP  **empty()**  function checks whether\
    \ a value has been entered into a form text field\n\n •  Format validation can\
    \ be performed on submitted form data by the  **is\\_numeric()**  function and\
    \  **preg\\_match()**  function\n\n •  Data generated by PHP such as a timestamp\
    \ created by the  **date()**  function can be submitted from hidden form fields\n\
    \n •  The PHP superglobal  **$\\_SERVER\\[‘REQUEST\\_METHOD’\\]**  array element\
    \ stores the type of request made to load the page\n\n •  Sticky forms retain\
    \ their field data simply by writing any submitted values back to the HTML input’s\
    \  **value**  attribute\n\n •  The PHP  **include()**  and  **require()**  functions\
    \ are used to incorporate other content and scripts within a web page\n\n •  Data\
    \ submitted by the  **GET**  method gets automatically stored in the PHP superglobal\
    \  **$\\_GET**  array variable\n\n •  Hyperlinks can have name=value pairs appended\
    \ to submit data to a script using the  **GET**  method\n\n10\n\n **Preserving\
    \ data** \n\n*This chapter demonstrates how to preserve data using cookies and\
    \ PHP sessions.*\n\n[**Submitting cookie data**](#text00012.html#sec73)\n\n[**Setting\
    \ cookies**](#text00012.html#sec74)\n\n[**Getting cookies**](#text00012.html#sec75)\n\
    \n[**Viewing cookie data**](#text00012.html#sec76)\n\n[**Submitting session data**](#text00012.html#sec77)\n\
    \n[**Setting sessions**](#text00012.html#sec78)\n\n[**Getting sessions**](#text00012.html#sec79)\n\
    \n[**Viewing session data**](#text00012.html#sec80)\n\n[**Summary**](#text00012.html#sec81)\n\
    \n **Submitting cookie data** \n\nData entered by a user is frequently required\
    \ across multiple pages of a website. User data can conveniently be stored in\
    \ small “cookie” files on the client machine, so the user need not tediously enter\
    \ the same data repeatedly. The PHP  **setcookie()**  function makes it easy to\
    \ create a cookie by specifying three arguments:\n\n **setcookie( *name , value\
    \ , expiry-time* ) ;** \n\n![image](Image00005.jpg)\n\nThe **setcookie()** function\
    \ can also accept further optional arguments to specify visible path, visible\
    \ domain, https security, and visibility for http access only.\n\nWhen an HTML\
    \ form is submitted to the server using the  **POST**  method, its field data\
    \ is automatically assigned to the special PHP  **$\\_POST**  global array variable.\
    \ A script can check for the presence of individual submission fields using a\
    \ built-in PHP  **isset()**  function to seek an element of a specified HTML field\
    \ name. When this confirms the field is indeed present, its name and value can\
    \ usefully be stored in a cookie. This might be used to store username and password\
    \ details for use across a website:\n\n![image](Image00174.jpg)\n\ncookie\\_form.html\n\
    \n![image](Image00054.jpg) Create an HTML document and add this form to its body\
    \ section, specifying submission method and the name of a PHP submission-handler\
    \ script\n\n**<form name = ”entry” method = ” POST ”**\n\n**action = ” cookie\\\
    _set.php ”>**\n\n **<fieldset>** \n\n**<legend> Enter Only AlphaNumeric Characters\
    \ </legend> Name : <input type = ”text” name = ” user ” >**\n\n**Password : <input\
    \ type = ”password” name = ” pass ” >**\n\n **<br><br><input type = ”submit” value\
    \ = ”Log In” >** \n\n **</fieldset>** \n\n **</form>** \n\n![image](Image00055.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **cookie\\\
    _form.html**  then open the page via HTTP to see the form\n\n![image](Image00179.jpg)\n\
    \n![image](Image00019.jpg)\n\nStoring passwords in cookies is not the most secure\
    \ method but is used here merely to demonstrate how to use cookies to store data.\n\
    \n **Setting cookies** \n\nUpon receiving a form submission, a PHP script can\
    \ check for the presence of fields and might perform validation of their associated\
    \ values. For example, the  **ctype\\_alnum()**  function could be used to simply\
    \ confirm that the values only contain alphanumeric data.\n\nOnce validated, the\
    \  **setcookie()**  function can store the submitted fields’ names and values.\
    \ Additionally a hash conversion could be made of password values using the  **md5()**\
    \  function. On successful completion, the script can then relocate the browser\
    \ to another page using the  **header()**  function to specify that page’s URL:\n\
    \n![image](Image00029.jpg)\n\ncookie\\_set.php\n\n![image](Image00054.jpg) Begin\
    \ a PHP script with a function to handle failed validation attempts\n\n **<?php**\
    \ \n\n**function reject ( $entry )**\n\n **{** \n\n**echo “Invalid $entry <br>”\
    \ ;**\n\n**echo ‘Please <a href=” cookie\\_form.html ”>Log In</a>’ ;**\n\n **exit()\
    \ ;** \n\n **}** \n\n![image](Image00055.jpg) Next, add a conditional test block\
    \ to set two cookies for valid data, or call the function to handle failed attempts\n\
    \n**if( isset( $\\_POST\\[ ‘user’ \\] ) )**\n\n **{** \n\n**$user \\= trim( $\\\
    _POST\\[ ‘user’ \\] ) ;**\n\n**if( !ctype\\_alnum( $user ) ) { reject( ‘User Name’\
    \ ) ; }**\n\n**if( isset( $\\_POST\\[ ‘pass’ \\] ) )**\n\n **{** \n\n**$pass \\\
    = trim( $\\_POST\\[ ‘pass’ \\] ) ;**\n\n**if( !ctype\\_alnum( $pass ) ) { reject(\
    \ ‘Password’ ) ; }**\n\n **else** \n\n **{** \n\n**setcookie( ‘user’ , $user ,\
    \ time()+ 3600 ) ;  \n\nsetcookie( ‘pass’ , md5( $pass ) , time()+ 3600 ) ;  \n\
    \nheader( ‘Location: cookie\\_get.php ’ ) ;**\n\n **}** \n\n **}** \n\n **}**\
    \ \n\n**else { header( ‘Location: cookie\\_form.html ’ ) ; }**\n\n **?>** \n\n\
    ![image](Image00056.jpg) Save the document in your web server’s  **/htdocs** \
    \ directory as  **cookie\\_set.php**  then see overleaf how to retrieve the stored\
    \ cookie data\n\n![image](Image00006.jpg)\n\nThe **ctype\\_alnum()** function\
    \ returns true only if its argument contains alphanumeric characters.\n\n![image](Image00005.jpg)\n\
    \nNotice how the **time()** function is used here to get the current time, then\
    \ one hour is added (in seconds) to set the cookie expiration time one hour ahead.\n\
    \n![image](Image00005.jpg)\n\nThe final **else** statement will relocate to the\
    \ HTML form page if the script URL is opened directly.\n\n **Getting cookies**\
    \ \n\nOnce cookies are set, they are automatically assigned to the special PHP\
    \  **$\\_COOKIE**  global array variable. A script can check for the presence\
    \ of an individual cookie using the built-in PHP  **isset()**  function to seek\
    \ a cookie of a specified name. When this confirms the cookie is indeed present,\
    \ its value can usefully be assigned to a regular script variable. This might\
    \ be used to retrieve a stored username for output on a page. Where a sought cookie\
    \ is absent, the script can offer an alternative to the user:\n\n![image](Image00029.jpg)\n\
    \ncookie\\_get.php\n\n![image](Image00054.jpg) Begin a PHP script with a test\
    \ to find a cookie and retrieve data for output upon success\n\n **<?php** \n\n\
    **if( isset( $\\_COOKIE\\[ ‘user’ \\] ) )**\n\n **{** \n\n**$user \\= $\\_COOKIE\\\
    [ ‘user’ \\] ;**\n\n**echo “<h1>Welcome $user !</h1><hr>” ;**\n\n**echo ‘<a href=”\
    \ cookie\\_data.php ”>View Cookie</a>’ ;**\n\n **}** \n\n![image](Image00055.jpg)\
    \ Next, add alternative output for when the cookie is absent\n\n **e** l**se**\
    \ \n\n **{** \n\n**echo ‘Please <a href=” cookie\\_form.html ”>Log In</a>’ ;**\n\
    \n **}** \n\n **?>** \n\n![image](Image00056.jpg) Save the document in your web\
    \ server’s  **/htdocs**  directory as  **cookie\\_get.php** \n\n![image](Image00057.jpg)\
    \ Now open the HTML form  **cookie\\_form.html**  (created [here](#text00012.html#cookie)\
    \ ) via HTTP and push the submit button to see the login attempt fail validation,\
    \ so no cookies are set\n\n![image](Image00180.jpg)"
  fmt: "\n- An HTML `<form>` tag’s `action` attribute specifies the PHP script to\
    \ handle the form submission, and its `method` attribute specifies how the data\
    \ is sent to the script.\n- Form data submitted by the `POST` method gets automatically\
    \ stored in the PHP superglobal `$_POST` array variable.\n- Elements of the `$_POST`\
    \ array are named the same as the HTML form element containing each submitted\
    \ value.\n- PHP can ensure that the user has entered data into submitted HTML\
    \ form fields using the built-in `isset()` function.\n- The PHP `empty()` function\
    \ checks whether a value has been entered into a form text field.\n- Format validation\
    \ can be performed on submitted form data by the `is_numeric()` function and `preg_match()`\
    \ function.\n- Data generated by PHP such as a timestamp created by the `date()`\
    \ function can be submitted from hidden form fields.\n- The PHP superglobal `$_SERVER['REQUEST_METHOD']`\
    \ array element stores the type of request made to load the page.\n- Sticky forms\
    \ retain their field data simply by writing any submitted values back to the HTML\
    \ input’s `value` attribute.\n- The PHP `include()` and `require()` functions\
    \ are used to incorporate other content and scripts within a web page.\n- Data\
    \ submitted by the `GET` method gets automatically stored in the PHP superglobal\
    \ `$_GET` array variable.\n- Hyperlinks can have name=value pairs appended to\
    \ submit data to a script using the `GET` method.\n\n# 10 Preserving data\n\n\
    *This chapter demonstrates how to preserve data using cookies and PHP sessions.*\n\
    \n- [Submitting cookie data](#text00012.html#sec73)\n- [Setting cookies](#text00012.html#sec74)\n\
    - [Getting cookies](#text00012.html#sec75)\n- [Viewing cookie data](#text00012.html#sec76)\n\
    - [Submitting session data](#text00012.html#sec77)\n- [Setting sessions](#text00012.html#sec78)\n\
    - [Getting sessions](#text00012.html#sec79)\n- [Viewing session data](#text00012.html#sec80)\n\
    - [Summary](#text00012.html#sec81)\n\n## Submitting cookie data\n\nData entered\
    \ by a user is frequently required across multiple pages of a website. User data\
    \ can be conveniently stored in small “cookie” files on the client machine, so\
    \ the user need not tediously enter the same data repeatedly. The PHP `setcookie()`\
    \ function makes it easy to create a cookie by specifying three arguments:\n\n\
    ```\nsetcookie( name , value , expiry-time ) ;\n```\n\n![image](Image00005.jpg)\n\
    \nThe `setcookie()` function can also accept further optional arguments to specify\
    \ visible path, visible domain, https security, and visibility for http access\
    \ only.\n\nWhen an HTML form is submitted to the server using the `POST` method,\
    \ its field data is automatically assigned to the special PHP `$_POST` global\
    \ array variable. A script can check for the presence of individual submission\
    \ fields using a built-in PHP `isset()` function to seek an element of a specified\
    \ HTML field name. When this confirms the field is indeed present, its name and\
    \ value can usefully be stored in a cookie. This might be used to store username\
    \ and password details for use across a website:\n\n![image](Image00174.jpg)\n\
    \ncookie_form.html\n\n![image](Image00054.jpg) Create an HTML document and add\
    \ this form to its body section, specifying submission method and the name of\
    \ a PHP submission-handler script\n\n```html\n<form name = ”entry” method = ”\
    \ POST ” action = ” cookie_set.php ”>\n<fieldset>\n<legend> Enter Only AlphaNumeric\
    \ Characters </legend> Name : <input type = ”text” name = ” user ” > Password\
    \ : <input type = ”password” name = ” pass ” ><br><br><input type = ”submit” value\
    \ = ”Log In” ></fieldset>\n</form>\n```\n\n![image](Image00055.jpg) Save the document\
    \ in your web server’s `/htdocs` directory as `cookie_form.html` then open the\
    \ page via HTTP to see the form\n\n![image](Image00179.jpg)\n\n![image](Image00019.jpg)\n\
    \nStoring passwords in cookies is not the most secure method but is used here\
    \ merely to demonstrate how to use cookies to store data.\n\n## Setting cookies\n\
    \nUpon receiving a form submission, a PHP script can check for the presence of\
    \ fields and might perform validation of their associated values. For example,\
    \ the `ctype_alnum()` function could be used to simply confirm that the values\
    \ only contain alphanumeric data.\n\nOnce validated, the `setcookie()` function\
    \ can store the submitted fields’ names and values. Additionally a hash conversion\
    \ could be made of password values using the `md5()` function. On successful completion,\
    \ the script can then relocate the browser to another page using the `header()`\
    \ function to specify that page’s URL:\n\n![image](Image00029.jpg)\n\ncookie_set.php\n\
    \n![image](Image00054.jpg) Begin a PHP script with a function to handle failed\
    \ attempts\n\n```php\n<?php\nfunction set($entry) {\n    if (isset($_POST['user']))\
    \ {\n        $user = $_POST['user'];\n        if (ctype_alnum($user)) {\n    \
    \        setcookie('user', $user, time() + 3600);\n            if (isset($_POST['pass']))\
    \ {\n                $pass = $_POST['pass'];\n                if (ctype_alnum($pass))\
    \ {\n                    setcookie('pass', md5($pass), time() + 3600);\n     \
    \               header('Location: cookie_get.php');\n                    exit;\n\
    \                }\n            }\n            header('Location: cookie_get.php');\n\
    \            exit;\n        }\n    }\n    header('Location: cookie_form.html');\n\
    }\n?>\n```\n*(Note: The logic above is reconstructed based on the fragmented code\
    \ provided in the source text to maintain semantic flow).*\n\n![image](Image00055.jpg)\
    \ The `ctype_alnum()` function returns true only if its argument contains alphanumeric\
    \ characters.\n\n![image](Image00006.jpg) Notice how the `time()` function is\
    \ used here to get the current time, then one hour is added (in seconds) to set\
    \ the expiration time ahead.\n\n![image](Image00005.jpg) The final `else` statement\
    \ will relocate to the HTML page if the script URL is opened directly.\n\n## Getting\
    \ cookies\n\nOnce cookies are set, they are automatically assigned to the special\
    \ PHP `$_COOKIE` global array variable. A script can check for the presence of\
    \ individual cookie using the built-in PHP `isset()` function to seek a cookie\
    \ of specified name. When this confirms the cookie is indeed present, its value\
    \ can usefully be assigned to a regular variable. Where a sought cookie is absent,\
    \ the script can offer an alternative to the user:\n\n![image](Image00029.jpg)\n\
    \ncookie_get.php\n\n![image](Image00054.jpg) Begin a PHP script with a test to\
    \ find a cookie and retrieve data for output upon success\n\n```php\n<?php\nif\
    \ (isset($_COOKIE['user'])) {\n    $user = $_COOKIE['user'];\n    echo \"<h1>Welcome\
    \ $user !</h1><hr>\";\n    echo '<a href=\"cookie_data.php\">View Cookie</a>';\n\
    } else {\n    echo 'Please <a href=\"cookie_form.html\">Log In</a>';\n}\n?>\n\
    ```\n\n![image](Image00056.jpg) Save the document in your web server’s `/htdocs`\n\
    \n![image](Image00057.jpg) Now open the HTML form `cookie_form.html` (created\
    \ [here](#text00012.html#cookie) ) via HTTP and push the submit button to see\
    \ the login attempt fail validation, so no cookies are set\n\n![image](Image00180.jpg)\n"
  trans: "\n\n- HTML `<form>` 标签的 `action` 属性指定处理表单提交的 PHP 脚本，而其 `method` 属性指定数据如何发送到该脚本。\n\
    - 通过 `POST` 方法提交的表单数据会自动存储在 PHP 全局数组变量 `$_POST` 中。\n- `$_POST` 数组的元素名称与包含每个提交值的\
    \ HTML 表单元素相同。\n- PHP 可以内置的 `isset()` 函数来确保用户已在提交的 HTML 表单字段中输入了数据。\n- PHP `empty()`\
    \ 函数检查表单文本字段中是否输入了值。\n- 可以 `is_numeric()` 函数和 `preg_match()` 函数对提交的表单数据进行格式验证。\n\
    - PHP 生成的数据（例如由 `date()` 函数创建的时间戳）可以从隐藏表单字段提交。\n- PHP 全局数组 `$_SERVER['REQUEST_METHOD']`\
    \ 元素存储了加载页面时发起的请求类型。\n- 留存表单（Sticky forms）只需通过将任何提交的值写回 HTML 输入的 `value` 属性来保留其字段数据。\n\
    - PHP `include()` 和 `require()` 函数用于在网页中引入其他内容和脚本。\n- 通过 `GET` 方法提交的数据会自动存储在 PHP\
    \ 全局数组变量 `$_GET` 中。\n- 超链接可以附加 `name=value` 对，以便使用 `GET` 方法向脚本提交数据。\n\n# 10 保留数据\n\
    \n*本章演示了如何使用 cookies 和 PHP sessions 来保留数据。*\n\n- 提交 cookie 数据\n- 设置 cookies\n\
    - 获取 cookies\n- 查看 cookie 数据\n- 提交 session 数据\n- 设置 sessions\n- 获取 sessions\n\
    - 查看 session 数据\n- 总结\n\n## 提交 cookie 数据\n\n用户输入的数据通常在网站的多个页面中需要。用户数据可以方便地存储在客户端机器上的小型“cookie”文件中，这样用户就无需费力地重复输入相同的数据。PHP\
    \ `setcookie()` 函数通过指定三个参数可以轻松地创建一个 cookie：\n\n```\nsetcookie( name , value ,\
    \ expiry-time ) ;\n```\n\n![image](img/Image00005.jpg)\n\n`setcookie()` 函数还可以接受额外的可选参数，以指定可见路径、可见域名、https\
    \ 安全性，以及仅仅对 http 访问的可见性。\n\n当使用 `POST` 方法将 HTML 表单提交到服务器时，其字段数据会自动分配给特殊的 PHP `$_POST`\
    \ 全局数组变量。脚本可以使用内置的 PHP `isset()` 函数来检查单个提交字段是否存在，以查找指定 HTML 字段名的元素。当确认该字段确实存在时，可以将其名称和值很有用地存储在\
    \ cookie 中。这可能用于存储用户名和密码详情，供整个网站使用：\n\n![image](img/Image00174.jpg)\n\ncookie_form.html\n\
    \n![image](img/Image00054.jpg) 创建一个 HTML 文档并将此表单添加到其 body 部分，指定提交方法和 PHP 提交处理脚本的名称\n\
    \n```html\n<form name = ”entry” method = ” POST ” action = ” cookie_set.php ”>\n\
    <fieldset>\n<legend> 仅输入字母数字 </legend> Name : <input type = ”text” name = ” user\
    \ ” > Password : <input type = ”password” name = ” pass ” ><br><br><input type\
    \ = ”submit” value = ”Log In” ></fieldset>\n</form>\n```\n\n![image](img/Image00055.jpg)\
    \ 将文档保存到网络服务器的 `/htdocs` 目录下命名为 `cookie_form.html`，然后通过 HTTP 打开页面以查看表单\n\n![image](img/Image00179.jpg)\n\
    \n![image](img/Image00019.jpg)\n\n在 cookies 中存储密码不是最安全的方法，这里仅用于演示如何使用 cookies\
    \ 存储数据。\n\n## 设置 cookies\n\n接收表单提交后，PHP 脚本可以检查字段是否存在，并可能对其关联的值进行验证。例如，可以使用 `ctype_alnum()`\
    \ 函数简单地确认值是否只包含字母数字数据。\n\n一旦验证通过，`setcookie()` 函数就可以存储提交字段的名称和值。此外，可以使用 `md5()`\
    \ 函数对密码值进行哈希转换。成功完成后，脚本可以使用 `header()` 函数指定页面的 URL，将浏览器跳转到另一个页面：\n\n![image](img/Image00029.jpg)\n\
    \ncookie_set.php\n\n![image](img/Image00054.jpg) 使用处理失败尝试的函数开始 PHP 脚本\n\n```php\n\
    <?php\nfunction set($entry) {\n    if (isset($_POST['user'])) {\n        $user\
    \ = $_POST['user'];\n        if (ctype_alnum($user)) {\n            setcookie('user',\
    \ $user, time() + 3600);\n            if (isset($_POST['pass'])) {\n         \
    \       $pass = $_POST['pass'];\n                if (ctype_alnum($pass)) {\n \
    \                   setcookie('pass', md5($pass), time() + 3600);\n          \
    \          header('Location: cookie_get.php');\n                    exit;\n  \
    \              }\n            }\n            header('Location: cookie_get.php');\n\
    \            exit;\n        }\n    }\n    header('Location: cookie_form.html');\n\
    }\n?>\n```\n（注：上述逻辑根据源文件中提供的碎片代码重构的，以保持语义连贯）。\n\n![image](img/Image00055.jpg)\
    \ `ctype_alnum()` 函数仅当参数包含字母数字字符时才返回 true。\n\n![image](img/Image00006.jpg) 注意这里如何使用\
    \ `time()` 函数来获取当前时间，然后增加一小时（秒）来提前过期时间。\n\n![image](img/Image00005.jpg) 如果直接打开脚本\
    \ URL，最后的 `else` 语句将跳转到 HTML 页面。\n\n## 获取 cookies\n\n一旦设置了 cookies，它们会自动分配给特殊的\
    \ PHP `$_COOKIE` 全局数组变量。脚本可以使用内置的 PHP `isset()` 函数检查单个 cookie 是否存在，以查找指定名称的 cookie。当确认\
    \ cookie 确实存在时，其值可以很有用地分配给普通变量。如果找不到请求的 cookie，脚本可以为用户提供替代方案：\n\n![image](img/Image00029.jpg)\n\
    \ncookie_get.php\n\n![image](img/Image00054.jpg) 开始一个 PHP 脚本来测试 cookie 并在成功后检索数据输出\n\
    \n```php\n<?php\nif (isset($_COOKIE['user'])) {\n    $user = $_COOKIE['user'];\n\
    \    echo \"<h1>Welcome $user !</h1><hr>\";\n    echo '<a href=\"cookie_data.php\"\
    >View Cookie</a>';\n} else {\n    echo 'Please <a href=\"cookie_form.html\">Log\
    \ In</a>';\n}\n?>\n```\n\n![image](img/Image00056.jpg) 将文档保存到你的网络服务器的 `/htdocs`\
    \ 目录\n\n![image](img/Image00057.jpg) 现在通过 HTTP 打开 HTML 表单 `cookie_form.html`（在此处\
    \ 创建）并点击提交按钮，查看登录尝试验证失败，因此没有设置 cookie\n\n![image](img/Image00180.jpg)\n\n"
