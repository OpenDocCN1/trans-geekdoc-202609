    \ 找到。\n\n当前天气 API 允许以多种形式请求天气数据。该 API 参数包括：\n\n- `q` = 城市名称（或城市名、国家代码）\n- `units`\
    \ = 公制（摄氏度）、英制（华氏度）或标准（开尔文，默认）温度单位\n- `mode` = xml、html 或 json（默认）格式\n- `appid`\
    \ = 必需的授权密钥，在 OpenWeatherMap 注册后免费提供\n\n参数和必需的 `=` 值会在 `?` 之后附加到 OpenWeatherMap\
    \ URL 后，并用 `&` 分隔。\n\n来自 OpenWeatherMap 的响应可以作为 XML 文件交付，可以使用 PHP 的 `asXml()`\
    \ 函数指定文件名将其写入 Web 服务器的 `/htdocs` 文件夹。可以在 浏览器中检查该文件以发现所获取的数据性质、XML 元素名称、属性名称和结构：\n\
