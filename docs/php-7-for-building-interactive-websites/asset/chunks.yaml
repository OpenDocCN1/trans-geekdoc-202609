    \ are replaced by “entity” equivalents. The `htmlentities()` function encodes\
    \ all characters below, which each have an entity:\n\n![image](Image00109.jpg)\n\
    \n![image](Image00005.jpg)\n\nCall the PHP function `htmlentities()` with the\
    \ constant argument `HTML_ENTITIES` or `HTML_SPECIALCHARS` to return an array\
    \ of all represented characters. Unless you are concerned about non-English characters,\
    \ it is generally preferable to use the alternative `htmlspecialchars()` function\
    \ to encode only characters of special significance:\n\n- `&` ampersand becomes\
    \ `&amp;`\n- `“` double quote becomes `&quot;`\n- `‘` single quote becomes `&#039;`\n\
    - `<` less than becomes `&lt;`\n- `>` greater than becomes `&gt;`\n\nOne good\
    \ reason to encode HTML snippets with PHP is to prevent malicious JavaScript code\
    \ being executed unintentionally by the web browser. Encoding HTML tags into entities\
    \ ensures that the HTML `<script>` tag will not be recognized, so its JavaScript\
    \ code contents will not be executed:\n\n```php\n![php\n$html \\= ‘<script>window.location=”index.html”</script>’\
    \ ;\n// Statement to be inserted here.\necho $html ;\n?>\n```\n\nThe browser has\
    \ interpreted the code and relocated to the server’s index page because it recognized\
    \ the HTML `<script>` tag.\n\n![image](Image00100.jpg) Return to the PHP script\
    \ and insert a statement to encode special HTML characters\n\n```php\n$html \\\
    = htmlspecialchars( $html ) ;\n```\n"
  trans: "\n\n可以使用 `strtok()` 函数将字符串拆分为各个部分，该函数需要指定字符串以及一个分隔符，字符串将根据该分隔符进行分割。例如，如果你想将一个字符串拆分成单个单词，可以指定空格字符作为分隔符。函数将返回字符串的第一部分，即到分隔符为止的内容。有趣的是，`strtok()`\
    \ 函数会记住它在字符串中的位置，因此随后的调用只需指定分隔符即可返回字符串的下一个部分，直到没有找到更多分隔符。这种方式拆分字符串的最佳方法是使用循环对\
    \ `strtok()` 函数进行后续调用，直到到达字符串末尾。\n\n![image](img/Image00029.jpg)\n\nformat.php\n\
    \n![image](img/Image00098.jpg) 开始一个 PHP 脚本，使用语句初始化一个字符串变量并显示其值\n\n```php\n<?php\n\
    $str \\= ‘| PHP String Fun |’ ; echo “Original String : $str ” ;\n```\n\n![image](img/Image00099.jpg)\
    \ 接下来，添加语句来显示原始字符串的反转、重复和修剪后的版本\n\n```php\necho ‘<hr>Reversed String : ‘ .strrev(\
    \ $str ) ;\necho ‘<hr>Repeated String : ’ .str\\_repeat( $str , 3 ) ;\necho ‘<hr>Trimmed\
    \ String : ‘ .trim( $str , ‘|’ ) ;\n```\n\n![image](img/Image00100.jpg) 现在，添加一条语句来显示字符串开头填充了星号的\
    \ 30 个字符版本\n\n```php\n$pad \\= str\\_pad( $str , 30 , ‘\\*’ , STR\\_PAD\\_LEFT\
    \ ) ;\necho “<hr>Padded String : $pad ” ;\n```\n\n![image](img/Image00101.jpg)\
    \ 最后，添加语句围绕空格分割字符串，并用 ... 省略号分隔每个单独的部分\n\n```php\necho ‘<hr>Split String : ‘ ;\n\
    $token \\= strtok( $str , ‘ ‘ );\nwhile ( $token )\n{\n    echo “ $token ... “\
    \ ; $token \\= strtok( ‘ ‘ ) ;\n}\n?>\n```\n\n![image](img/Image00102.jpg) 将文档保存到你\
    \ Web 服务器的 `/htdocs` 目录中并命名为 `format.php`，然后通过 HTTP 访问页面以查看多种格式的字符串\n\n![image](img/Image00107.jpg)\n\
    \n![image](img/Image00006.jpg)\n\n你必须在每次后续调用 `strtok()` 时指定分隔符，以便继续处理字符串的下一个部分。\n\
    \n### 创建日期\n\nPHP `date()` 函数在调用时会返回日期字符串，但需要一个字符串参数来指定日期字符串的格式。该格式字符串可以包含一系列用于日期和时间的字母选项。例如，`date(\
    \ ‘n/j/y’ )` 可能会返回“4/22/16”。常用选项列在下方，并带有简要描述：\n\n| 选项: | 描述 | 示例: |\n| --- | ---\
    \ | --- |\n| **Y** | 四位年份 | 2014 |\n| **y** | 两位年份 | 14 |\n| **n** | 一位或双位的月份\
    \ | 7 |\n| **m** | 两位位的月份 | 07 |\n| **F** | 月份全称 | February |\n| **M** | 三字母月份简称\
    \ | Feb |\n| **j** | 一位或双位的日期 | 4 |\n| **d** | 两位位的日期 | 04 |\n| **l** | 星期全称 |\
    \ Monday |\n| **D** | 三字母星期简称 | Mon |\n| **S** | 两个字母的序后缀 | th |\n| **H** | 24\
    \ 小时制的小时 | 14 |\n| **i** | 分钟 | 45 |\n| **s** | 秒 | 30 |\n| **a** | 上午或下午 | am\
    \ |\n\n![image](img/Image00019.jpg)\n\n星期全称选项是一个小写的“L”。\n\n![image](img/Image00005.jpg)\n\
    \n你可以在 PHP 在线官方手册 [php.net/manual](http://www.php.net/manual) 中发现更多 `date()` 函数选项。\n\
    \n默认情况下，时区被设置为协调世界时 (UTC)，但你可以通过向 `date_default_timezone_set()` 函数传递指定参数来设置你自己的时区，并使用\
    \ `date_default_timezone_get()` 查看当前设置的时区。\n\n你还可以使用智能的 `strtotime()` 函数创建自己的时间戳。它可以接受一个日期字符串参数，并返回一个可以作为\
    \ `date()` 函数可选第二个参数的时间戳。传递给 `strtotime()` 的可以是可以是普通日期，例如“July 4, 2017”。此外，你还可以指定诸如“yesterday”、“+3months”或“next\
    \ Wednesday”之类的参数，`strtotime()` 函数将尝试解析并返回相应的时间戳。\n\n![image](img/Image00029.jpg)\n\
    \ndate.php\n\n![image](img/Image00098.jpg) 开始一个 PHP 脚本，使用语句初始化一个字符串变量并显示其值\n\n\
    ```php\n<?php\n// (初始化和显示的逻辑)\n?>\n```\n\n![image](img/Image00099.jpg) 接下来，添加语句来显示原始字符串的反转、重复和修剪后的版本\n\
    \n```php\n// (strrev, str_repeat 和 trim 的逻辑)\n```\n\n![image](img/Image00100.jpg)\
    \ 现在，添加一条语句来显示开头填充了星号的 30 个字符版本\n\n```php\n// (str_pad 的逻辑)\n```\n\n![image](img/Image00101.jpg)\
    \ 最后，添加语句围绕空格分割字符串，并用 ... 省略号分隔每个单独的部分\n\n```php\n// (strtok 循环的逻辑)\n```\n\n![image](img/Image00102.jpg)\
    \ 将文档保存到你 Web 服务器的 `/htdocs` 目录中并命名为 `format.php`，然后通过 HTTP 访问页面以查看多种格式的字符串\n\n\
    ![image](img/Image00107.jpg)\n\n![image](img/Image00006.jpg)\n\n你必须在每次后续调用 `strtok()`\
    \ 时指定分隔符，以便继续处理下一个部分。\n\n### 实体编码\n\n有两个 PHP 函数可编码 HTML 代码，将所有特殊字符替换为“实体”等效项。`htmlentities()`\
    \ 函数编码下面的字符，每个字符都有实体：\n\n![image](img/Image00109.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n调用 PHP 函数 `htmlentities()` 并传入常量参数 `HTML_ENTITIES` 或 `HTML_SPECIALCHARS` 以返回所有表示字符的数组。除非你担心非英语字符，否则通常倾向于使用替代函数\
    \ `htmlspecialchars()` 来仅编码具有特殊意义的字符：\n\n- `&` 安培符号变为 `&amp;`\n- `“` 双引号变为 `&quot;`\n\
    - `‘` 单引号变为 `&#039;`\n- `<` 小于变为 `&lt;`\n- `>` 大于变为 `&gt;`\n\n用 PHP 编码 HTML 代码的一个很好的理由是为了防止\
    \ 浏览器意外执行恶意的 JavaScript 代码。将 HTML 标签编码为实体可以确保 HTML `<script>` 标签不会被识别，因此 JavaScript\
    \ 代码内容不会被执行：\n\n```php\n<?php\n$html \\= ‘<script>window.location=”index.html”</script>\
    \ ;\n// 在此处插入插入语句。\necho $html ;\n?>\n```\n\n浏览器解释了代码并跳转到了服务器的首页，因为它识别了 HTML `<script>`\
    \ 标签。\n\n![image](img/Image00100.jpg) 返回 PHP 脚本并插入一条语句来编码特殊的 HTML 字符\n\n```php\n\
    $html \\= htmlspecialchars( $html ) ;\n```\n\n"
