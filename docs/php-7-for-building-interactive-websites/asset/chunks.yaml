    \ Summary\n\n- Arithmetical operators can form expressions with operands for addition\
    \ `+`, subtraction `-`, multiplication `*`, division `/`, modulus `%`, and exponentiation\
    \ `**`\n- The assignment operator `=` can be combined with any arithmetical operator\
    \ to perform an arithmetical calculation then assign the result\n- Comparison\
    \ operators can form expressions with operands for equality `==`, inequality `!=`,\
    \ identicality or not `===`, `!==`, greater `>`, less `<`, greater, less or equal\
    \ `>=`, `<=`, `<=>`\n- The conditional operator `?:` evaluates an expression for\
    \ a `TRUE` or `FALSE` Boolean value, then returns one of two specified results\
    \ depending on the evaluation then returns one of two specified results depending\
    \ on the evaluation\n- The `??` null coalescing operator traverses operands from\
    \ left to right and returns the first value that is not null\n- Logical operators\
    \ `and`, `&&`, `or`, `||` and `xor` form expressions evaluating two operands and\
    \ return a value of true or false\n- The logical `!` not operator returns the\
    \ inverse Boolean value of a single operand\n- Bitwise operators `|`, `&`, `~`,\
    \ `^`, `<<` and `>>` allow the evaluation and manipulation of specific bits within\
    \ an integer\n- Increment `++` or decrement `--` operators that prefix a variable\
    \ change its value by one and return the result\n- Increment `++` or decrement\
    \ `--` operators that postfix a variable return its current value, then change\
    \ its value by one\n- Operator precedence determines how expressions are grouped\
    \ for evaluation\n- When operators have equal precedence, their associativity\
    \ determines the expression is grouped for evaluation\n- The `var_dump()` function\
    \ can be used to see the type and value resulting from an expression\n- The special\
    \ `NULL` constant represents a variable that has no value whatsoever, not even\
    \ zero\n\n## Testing conditions \n\n*This chapter demonstrates the various PHP\
    \ control structures that determine how a script will proceed.*\n\n- [Seeking\
    \ truth](#text00006.html#sec25)\n- [Providing alternatives](#text00006.html#sec26)\n\
    - [Switching branches](#text00006.html#sec27)\n- [Performing loops](#text00006.html#sec28)\n\
    - [Looping while true](#text00006.html#sec29)\n- [Breaking from loops](#text00006.html#sec30)\n\
    - [Summary](#text00006.html#sec31)\n\n### Seeking truth\n\nThe `if` keyword is\
    \ used to perform the basic conditional test that evaluates a given expression\
    \ for a Boolean value of `TRUE` or `FALSE`. Statements within braces following\
    \ the evaluation will only be executed when the expression is found to be `TRUE`.\
    \ When the expression is found to be `FALSE`, the PHP parser simply moves on to\
    \ the next part of the script.\n\n![image](Image00005.jpg)\n\nThe `if` construct\
    \ is one of the most important features in PHP, and in most other programming\
    \ languages.\n\nThe syntax of an `if` conditional test statement looks like this:\n\
    \n```php\nif ( test-expression ) { statement-to-execute-when-true ; }\n```\n\n\
    There may be multiple statements to be executed when the test is `TRUE` but each\
    \ statement must be terminated by a semi-colon:\n\n```php\nif ( test-expression\
    \ )\n{\n    statement-to-execute-when-true ;\n    statement-to-execute-when-true\
    \ ;\n    statement-to-execute-when-true ;\n}\n```\n\nMultiple expressions can\
    \ be tested using the logical `&&` or `and` operator to ensure that following\
    \ statements will only be executed when both expressions are found to be `TRUE`,\
    \ like this:\n\n```php\nif ( ( test-expression ) && ( test-expression ) )\n{\n\
    \    statement-to-execute-when-true ;\n    statement-to-execute-when-true ;\n\
    \    statement-to-execute-when-true ;\n}\n```\n\n![image](Image00005.jpg)\n\n\
    When the code to be executed is just a single statement, the braces may optionally\
    \ be omitted, but you may prefer to always include the braces for consistency.\n\
    \nAlternatively, `if` conditional test statements can be nested to test multiple\
    \ expressions so that statements will only be executed when all tests are found\
    \ to be `TRUE`, like this:\n\n```php\nif ( test-expression )\n{\n    if ( test-expression\
    \ )\n    {\n        statement-to-execute-when-true ;\n        statement-to-execute-when-true\
    \ ;\n        statement-to-execute-when-true ;\n    }\n}\n```\n\nMultiple `if`\
    \ conditional test statements can be made to provide alternatives for the script\
    \ to follow.\n\n![image](Image00029.jpg)\n\nif.php\n\n![image](Image00067.jpg)\n\
    \nBetween PHP tags, begin a script with a statement that initializes an integer\
    \ variable\n\n```php\n<?php\n$num = 8;\n```\n\n![image](Image00068.jpg) Next,\
    \ add statements that output a result when a conditional test of numerical size\
    \ is found to be `TRUE`\n\n```php\nif ($num > 5 ) { echo \"$num exceeds 5<br>\"\
    ; }\nif ($num <= 5 ) { echo \"$num is below 6<br>\"; }\n```\n\n![image](Image00069.jpg)\
    \ Now, add statements that output a result when a conditional test of parity is\
    \ found to be `TRUE`\n\n```php\nif ($num % 2 == 0 ) { echo \"$num is Even<br>\"\
    ; }\nif ($num % 2 != 0 ) { echo \"$num is Odd<br>\"; }\n```\n\n`?>`\n\n![image](Image00070.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `if.php` then\
    \ open the page via HTTP to see the results from successful tests get displayed\n\
    \n![image](Image00071.jpg)\n\n![image](Image00072.jpg) Edit the integer variable\
    \ then save the modified script and refresh the browser to see the results from\
    \ other successful tests get displayed\n\n```php\n$num = 3;\n```\n\n![image](Image00073.jpg)\n\
    \n![image](Image00006.jpg)\n\nWhen the tested condition is `FALSE`, the PHP parser\
    \ ignores its statement block and simply moves on.\n\n### Providing alternatives\n\
    \nIt is often preferable to extend an `if` statement by appending an `else` statement,\
    \ specifying statements within braces to be executed when the expressions evaluated\
    \ by the `if` statement are found to be `FALSE`, with this syntax:\n\n```php\n\
    if ( test-expression )\n{\n    statement-to-execute-when-true ;\n}\nelse\n{\n\
    }\n```\n"
  trans: "\n\nPHP 运算符优先级决定了表达式如何分组进行评估。例如，表达式 `1 + 5 * 3` 的求值为 16 而不是 18，因为 `*` 乘运算符的优先级高于\
    \ `+` 加法运算符。可以使用括号指定优先级，使得 `(1 + 5) * 3` 的求值为 18。当运算符的优先级相同时，它们的“结合性”决定了表达式的分组方式。例如，`-`\
    \ 减法运算符是左结合的，所以 `8 - 4 - 2` 被分组为 `(8 - 4) - 2` 并求值为为 2。下表按优先级顺序列出了常用运算符，优先级最高的位于顶部。同一行的运算符优先级相等，因此运算符结合性决定了表达式的分组方式。\n\
    \n| 运算符: | 结合性: |\n| --- | --- |\n| `*` | 右 |\n| `++ -- ~` | 右 |\n| `!` | 右 |\n\
    | `* / %` | 左 |\n| `+ - .` | 左 |\n| `<< >>` | 左 |\n| `< <= > >=` | 无 |\n| `==\
    \ != === !== <> <=>` | 无 |\n| `&` | 左 |\n| `^` | 左 |\n| `|` | 左 |\n| `&&` | 左\
    \ |\n| `||` | 左 |\n| `??` | 右 |\n| `?=` | 左 |\n| `=+= -= \\*= /= \\*\\*= .= %=\
    \ &= |= ^= <<= >>= =>` | 右 |\n| `and` | 左 |\n| `xor` | 左 |\n| `or` | 左 |\n| `,`\
    \ | 左 |\n\n![image](img/Image00019.jpg)\n\n敏锐的人会注意到，逻辑运算符的替代形式具有不同的优先级级别。这可能会导致表达式如\
    \ `$bool = true and false` 与另一种形式 `$bool = true && false` 产生意料之外的结果。尝试这些每一种，然后执行\
    \ `var_dump($bool)` 来查看差异。\n\n### 总结\n\n- 算术运算符可以结合操作数形成表达式，用于加法 `+`、减法 `-`、乘法\
    \ `*`、除法 `/`、取模 `%` 和幂 `**`\n- 赋值运算符 `=` 可以与任何算术运算符结合，执行算术计算后赋值结果\n- 比较运算符可以结合操作数形成表达式，用于相等\
    \ `==`、不相等 `!=`、全相同或不相同 `===`、`!==`、大于 `>`、小于 `<`、大于或等于 `>=`, `<=`、`<=>`\n- 条件运算符\
    \ `?:` 评估一个表达式以获得 `TRUE` 或 `FALSE` 布尔值，然后根据评估结果返回两个指定结果之一\n- `??` 空合并合并运算符从左到右遍历操作数，并返回第一个非空值\n\
    - 逻辑运算符 `and`、`&&`、`or`、`||` 和 `xor` 形成评估两个操作数的表达式，并返回 true 或 false 值\n- 逻辑 `!`\
    \ 非运算符返回单个操作数的取反布尔值\n- 位运算运算符 `|`、`&`、`~`、`^`、`<<` 和 `>>` 允许对整数内的特定位进行评估和操作\n\
    - 前置递增 `++` 或递减 `--` 运算符将变量的值改变一个 1 并返回结果\n- 后置递增 `++` 或递减 `--` 运算符返回变量当前值，然后将其值改变一个\
    \ 1\n- 运算符优先级决定了表达式如何分组进行评估\n- 当运算符优先级相同时，它们的结合性决定了表达式如何分组进行评估\n- `var_dump()`\
    \ 函数可以用于查看表达式产生的类型和值\n- 特殊的 `NULL` 常量表示完全没有值的变量，甚至不是 0\n\n## 测试条件\n\n*本章演示了各种\
    \ PHP 控制结构，这些结构决定了脚本如何执行。*\n\n- 寻找真理\n- 提供替代方案\n- 切换分支\n- 执行循环\n- 在为真时循环\n- 跳出循环\n\
    - 总结\n\n### 寻找真理\n\n`if` 关键字用于执行基础条件测试，评估给定的表达式以获得 `TRUE` 或 `FALSE` 布尔值。评估后大括号内的语句仅在表达式被发现为\
    \ `TRUE` 时才会执行。当表达式被发现为 `FALSE` 时，PHP 解析器只需移动到脚本的下部分。\n\n![image](img/Image00005.jpg)\n\
    \n`if` 结构是 PHP 中最重要的特性之一，在大多数其他编程语言也是如此。\n\n`if` 条件测试语句的语法如下：\n\n```php\nif (\
    \ test-expression ) { statement-to-execute-when-true ; }\n```\n\n当测试为 `TRUE` 时，可能有多个语句要执行，但每条语句都必须以分号结束：\n\
    \n```php\nif ( test-expression )\n{\n    statement-to-execute-when-true ;\n  \
    \  statement-to-execute-when-true ;\n    statement-to-execute-when-true ;\n}\n\
    ```\n\n可以使用逻辑运算符 `&&` 或 `and` 测试多个表达式，以确保后续语句在测试均为 `TRUE` 时执行：\n\n```php\nif (\
    \ test-expression )\n&& ( test-expression )\n{\n    statement-to-execute-when-true\
    \ ;\n    statement-to-execute-when-true ;\n}\n```\n\n当执行的只是单个语句时，可以省略大括号，但你可能习惯始终包含大括号。或者，可以嵌套\
    \ `if``测试语句语句：\n\n```php\nif ( test-expression )\n{\n    if ( test-expression\
    \ )\n    {\n        statement-to-execute-when-true ;\n    }\n}\n```\n\n![image](img/Image00019.jpg)\n\
    \n多个 `if` 条件测试语句可以为脚本提供替代方案。\n\n![image](img/Image00029.jpg)\n\nif.php\n\n![image](img/Image0009..php\n\
    \n![image](Image00067.jpg)\n\n在 PHP 标签之间，从初始化整数变量的语句开始：\n\n```php\n<?php\n$num\
    \ = 8;\n```\n\n![image](img/Image00068.jpg) 接下来，语句语句当大小测试测试被发现为 `TRUE` 时输出结果：\n\
    \n```php\nif ($num > 5 ) { echo \"$num exceeds 5<br>\"; }\nif ($num <= 5 ) { echo\
    \ \"$num is below 6<br>\"; }\n```\n\n![image](img/Image00069.jpg) 现在，添加语句当奇偶性测试测试被发现为\
    \ `TRUE` 时输出结果：\n\n```php\nif ($num % 2 == 0 ) { echo \"$num is Even<br>\"; }\n\
    if ($num % 2 != 0 ) { echo \"$num is Odd<br>\"; }\n```\n\n`?>`\n\n![image](img/Image00070.jpg)\
    \ 将文档保存在 Web 服务器的 `/htdocs` 目录并为 `if.php`，然后通过 HTTP 打开页面查看成功测试的结果：\n\n![image](img/Image00071.jpg)\n\
    \n![image](img/Image00072.jpg) 修改整数变量，保存修改后的脚本并刷新浏览器查看其他成功测试的结果：\n\n```php\n$num\
    \ = 3;\n```\n\n![image](img/Image00073.jpg)\n\n![image](img/Image00006.jpg)\n\n\
    当被测试条件为 `FALSE` 时，PHP 解析器忽略其语句块并直接继续。\n\n### 提供替代方案\n\n通常最好通过附加一个 `else` 语句来扩展\
    \ `if` 语句，指定大括号内的语句在当 `if` 语句评估的表达式被发现为 `FALSE` 时执行，其语法如下：\n\n```php\nif ( test-expression\
    \ )\n{\n    statement-to-execute-when-true ;\n}\nelse\n{\n}\n```\n\n"
