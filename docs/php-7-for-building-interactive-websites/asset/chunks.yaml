    Comparing bits


    A byte comprises eight bits that can each contain a `1` or a `0` to store a binary
    number, representing decimal values from 0 to 255. Each bit contributes a decimal
    component only when that bit contains a `1`. Components are designated right-to-left
    from the “Least Significant Bit” (LSB) to the “Most Significant Bit” (MSB). The
    binary number in the bit pattern below represents decimal 50.


    ![image](Image00006.jpg)


    Many PHP programmers never use bitwise operators, but it is useful to understand
    what they are and how they may be used.


    | Bit No. | 8 MSB | 7 | 6 | 5 | 4 | 3 | 2 | 1 LSB |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | Decimal | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | Binary | 0 | 0 | 1 | 1 | 0 | 0 | 1 | 0 |


    It is possible to manipulate individual parts of a byte using “bitwise” operators.
    Bitwise operators allow evaluation and manipulation of specific bits within an
    integer.


    | Operator: | Name: | Binary number operation: |

    | --- | --- | --- |

    | `|` | OR | Return a `1` in each bit where either of two compared bits is a `1`
    Example: `1010 | 0101 = 1111` |

    | `&` | AND | Return a `1` in each bit where both of two compared bits is a `1`
    Example: `1010 && 1100 = 1000` |

    | `~` | NOT | Return a `1` in each bit where neither of two compared bits is a
    `1` Example: `1010 ~ 0011 = 0100` |

    | `^` | XOR | Return a `1` in each bit where only one of two compared bits is
    a `1` Example: `1010 ^ 0100 = 1110` |

    | `<<` | Shift left | Move each bit that is `1` a specified number of bits to
    the left Example: `0010 << 2 = 1000` |

    | `>>` | Shift right | Move each bit that is `1` a specified number of bits to
    the right Example: `1000 >> 2 = 0010` |


    Half of a byte is known as a “nibble” (4 bits). Bitwise operators compare binary
    numbers, whereas logical operators evaluate Boolean values. The `^` (exclusive
    OR) operator lets you exchange values within a limited nibble (4 bits). The bitwise
    operators are seldom used for instance, they can be useful for data stored in
    a nibble.


    ![image](Image00029.jpg)


