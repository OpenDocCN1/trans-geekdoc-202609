    \ statement creating the “pooch” object\n\n```php\n$pooch \\= new Dog(4, 18, ‘gray’);\n\
    ```\n"
  trans: "\n\n![image](img/Image00114.jpg) 以一个语句开始 PHP 脚本，声明名为“Dog”的类\n\n```php\n\
    <?php\nclass Dog\n{\n    // Members to be inserted here (steps 2-5).\n}\n```\n\
    \n![image](img/Image00115.jpg) 在 Dog 类定义的大括号之间，声明三个私有变量成员\n\n```php\nprivate $age\
    \ ;\nprivate $weight ;\nprivate $color ;\n```\n\n![image](img/Image00116.jpg)\
    \ 在私有变量之后，添加一个公共方法，在调用时输出字符串\n\n```php\npublic function bark () { echo ‘WOOF!\
    \ WOOF! <br> ; }\n```\n\n![image](img/Image00117.jpg) 添加公共的器方法（setter methods）——将单个参数值赋值给每个私有变量\n\
    \n```php\npublic function setAge ( int $yrs )\n{ $this-> age \\= $yrs ; }\n\n\
    public function setWeight ( int $lbs )\n{ $this-> weight \\= $lbs ; }\n\npublic\
    \ function setColor ( string $fur )\n{ $this-> color \\= $fur ; }\n```\n\n![image](img/Image00005.jpg)\
    \ 在类声明中，注意所有方法都声明为公共，所有变量都声明为私有。这种“公共接口，私有数据”的概念是创建类时的核心概念。\n\n![image](img/Image00118.jpg)\
    \ 添加公共的访问方法（getter methods）——从每个私有变量中检索单个值\n\n```php\npublic function getAge ()\
    \ { return $this-> age ; }\npublic function getWeight () { return $this-> weight\
    \ ; }\npublic function getColor () { return $this-> color ; }\n```\n\n![image](img/Image00119.jpg)\
    \ 在 Dog 类声明之后，声明一个名为“fido”的 Dog 类实例\n\n```php\n$fido \\= new Dog () ;\n```\n\n\
    ![image](img/Image00120.jpg) Fido\n\n添加调用每个 setter 方法语句来分配数据\n\n```php\n$fido\
    \ \\-> setAge ( 3 ) ;\n$fido \\-> setWeight ( 15 ) ;\n$fido \\-> setColor ( ‘brown’\
    \ ) ;\n```\n\n![image](img/Image00122.jpg) 添加调用每个 getter 方法语句来检索已分配的值\n\n```php\n\
    echo ‘Fido is a ‘ . $fido \\-> getColor (). ’ dog <br> ; ;\necho ‘Fido is ‘ .\
    \ $fido \\-> getAge (). ’ years old <br> ; ;\necho ‘Fido weighs ‘ . $fido \\->\
    \ getWeight (). ’ pounds<br> ; ;\n```\n\n![image](img/Image00123.jpg) 现在，添加对普通输出方法的调用\n\
    \n```php\n$fido \\-> bark () ;\n?>\n```\n\n![image](img/Image00124.jpg) 将文档保存到\
    \ Web 服务器的 `/htdocs` 目录并为 `object.php`，然后通过 HTTP 打开页面查看输出的类属性和方法调用\n\n![image](img/Image00125.jpg)\n\
    \n![image](img/Image00003.jpg) PHP 7 的新功能是还可以创建具有简单功能且没有名称的“匿名类”。例如，`$util = new\
    \ class { public function log($s) { echo $s ; } } ;`，可以通过 `$util->log( ‘Data’\
    \ ) ;` 调用。\n\n![image](img/Image00005.jpg) 该 `object.php` 脚本将在接下来的几页中随着新功能的引入被修改。\n\
    \n## 初始化成员\n\n程序可以通过声明多个类的实例来轻松地创建多个对象，每个对象都可以通过其 setter 方法分配单个值来拥有独特的属性。\n\n\
    通常将 setter 方法合并为一个接受每个私有变量参数的单个方法是非常方便的。这意味着在程序中可以使用单个语句分配所有值，但该方法内部将包含多个语句。\n\
    \n可选，每个参数可以为传递的每个参数指定允许的数据类型，并可能有用地为每个参数指定默认值：\n\n![image](img/Image00029.jpg)\n\
    \ninitializer.php\n\n![image](img/Image00114.jpg) 将上一个示例的副本“object.php”重命名为“initializer.php”\n\
    \n![image](img/Image00115.jpg) 在 Dog 类声明中，将 setter 方法替换为单个方法\n\n```php\npublic\
    \ function setValues(int $yrs \\= 2 , int $lbs \\= 8 , string $fur \\= ‘black’)\n\
    {\n    $this->age \\= $yrs ;\n    $this->weight \\= $lbs ;\n    $this->color \\\
    = $fur ;\n}\n```\n\n![image](img/Image00116.jpg) 在方法块中，插入为类变量赋值的语句\n\n![image](img/Image00117.jpg)\
    \ 在类定义之后，将对 setter 方法的调用替换为对方法的调用\n\n```php\n$fido \\-> setValues(3, 15, ‘brown’);\n\
    ```\n\n![image](img/Image00118.jpg) 同样，编辑创建“pooch”对象的语句\n\n```php\n$pooch \\=\
    \ new Dog(4, 18, ‘gray’);\n```\n\n![image](img/Image00119.jpg) 尝试向方法传递错误的数据类型以查看发生错误。\n\
    \n## 构造函数\n\n类变量成员可以通过特殊的“构造函数”（constructor）方法进行初始化，该方法每当创建类的实例时都会被调用。构造方法始终始终命名为\
    \ `__construct()` 并可以接受参数来设置类变量的初始值。\n\n![image](img/Image00131.jpg) 构造方法有一个对应的“析构方法”（destructor），每当类实例被销毁时就会被调用。析构方法始终命名为\
    \ `__destruct()`。\n\n构造和析构方法没有返回值且会自动调用，因此它们的声明不需要标识符。\n\n初始化类变量的值在创建对象的语句中传递给构造函数，位于对象名称括号后的：\n\
    \n![image](img/Image00029.jpg) constructor.php\n\n![image](img/Image00114.jpg)\
    \ 在 Dog 类声明中，将方法替换为此构造函数：\n\n```php\npublic function __construct(int $yrs \\=\
    \ 2 , int $lbs \\= 8 , string $fur \\= ‘black’)\n{\n    $this->age \\= $yrs ;\n\
    \    $this->weight \\= $lbs ;\n    $this->color \\= $fur ;\n}\n```\n\n![image](img/Image00115.jpg)\
    \ 现在，添加一个简单的析构方法\n\n```php\nfunction __destruct() { echo ‘<hr>Object Destroyed.’\
    \ ; }\n```\n\n![image](img/Image00117.jpg) 在 Dog 类声明之后，编辑创建“fido”对象的语句，将值传递给其构造方法，以初始化属性\n\
    \n```php\n$fido \\= new Dog(3, 15, ‘brown’);\n```\n\n"
