    不等运算符如果两个操作数不相等，则返回 `TRUE`，否则返回 `FALSE` 。


    ![image](img/Image00005.jpg)


    相等和不等运算符用于测试两个变量的状态，以便在 PHP 脚本中执行条件分支。


    ## 进行比较


