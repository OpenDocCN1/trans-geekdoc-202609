    \ using its node name and array index number.\n\n### Looping through nodes\n\n\
    The `SimpleXML` object provides methods to work with the data contained within\
    \ its data structure. Usefully, its `children()` method returns all child nodes\
    \ and can be used to loop through the nodes to retrieve each node’s content:\n\
    \n![image](Image00029.jpg)\n\nnodes-loop.php\n\n![image](Image00085.jpg) Begin\
    \ a PHP script with a statement to set a page title\n\n```php\n<?php\necho ‘<title>PHP\
    \ SimpleXML</title> ;\n```\n\n![image](Image00086.jpg) Add a statement to load\
    \ the XML data or quit\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\n\
    or die( ‘Unable to load data!’ ) ;\n```\n\n![image](Image00087.jpg) Next, initialize\
    \ an iteration counter at zero\n\n```php\n$counter = 0 ;\n```\n\n![image](Image00088.jpg)\
    \ Now, add a loop to increment the counter and to display all “title” and “category”\
    \ child node content\n\n```php\nforeach( $xml->children() as $book )\n{\n$counter\
    \ ++ ;\necho ‘Book ‘ . $counter . ‘ : ‘ ;\necho $book-> title .\n’ in easy steps\
    \ \\[’ . $book-> category . ’\\]<hr>’ ;\n}\n```\n\n![image](Image00089.jpg) Save\
    \ the document in your web server’s `/htdocs` directory as `nodes-loop.php`, alongside\
    \ the `catalog.xml` file, then open the page via HTTP to see all node content\n\
    \n![image](Image00218.jpg)\n\n![image](Image00005.jpg)\n\nNested `foreach` loops\
    \ can be used to traverse child nodes of each descendant generation.\n\n### Getting\
    \ attributes\n\nValues contained within attributes of a `SimpleXMLElement` object\
    \ can be referenced by stating the attribute name, within quotes, between brackets\
    \ following the node name. For example, `$object->child['feature']` accesses the\
    \ value within an attribute named “feature” of a top-level “child” element:\n\n\
    ![image](Image00029.jpg)\n\nattribs.php\n\n![image](Image00085.jpg) Begin a PHP\
    \ script with a statement to set a page title\n\n```php\n<?php\necho ‘<title>PHP\
    \ SimpleXML</title> ;\n```\n\n![image](Image00086.jpg) Add a statement to load\
    \ the XML data or quit\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\n\
    or die( ‘Unable to load data!’ ) ;\n```\n\n![image](Image00087.jpg) Next, retrieve\
    \ the content of the “title” element that is a child of the first “book” element\n\
    \n```php\necho ‘First book : ‘ .\n$xml-> book[0]-> title . ’ in easy steps<br>’\
    \ ;\n```\n\n![image](Image00088.jpg) Now, display the value of the “cover” attribute\
    \ of the “title” element, that is a child of the first “book” element\n\n```php\n\
    echo ‘Cover : ‘ . $xml-> book[0]-> title[‘cover’] . `<br>’ ;\n```\n\n![image](Image00089.jpg)\
    \ Use the value retrieved in the previous step to display a cover image for the\
    \ first “book” element\n\n```php\necho ‘<img src=”’ . $xml-> book[0]-> title[‘cover’]\
    \ . ’”>’ ;\n```\n\n![image](Image00091.jpg) Save the document in your web server’s\
    \ `/htdocs` directory as `nodes.php`, alongside the `catalog.xml` file, then open\
    \ the page via HTTP to see the attribute value and image\n\n![image](Image00219.jpg)\n\
    \n![image](Image00006.jpg)\n\nNotice that each attribute value here is the path\
    \ and filename to an image in a directory at `/htdocs/images`.\n\n### Looping\
    \ through attributes\n\nThe `SimpleXML` object `children()` method can once again\
    \ be used to loop through nodes and retrieve the value in a specified attribute\
    \ of a particular node on each iteration:\n\n![image](Image00029.jpg)\n\nattribs-loop.php\n\
    \n![image](Image00085.jpg) Begin a PHP script with a statement to set a page title\n\
    \n```php\n<?php\necho ‘<title>PHP SimpleXML</title> ;\n```\n\n![image](Image00086.jpg)\
    \ Add a statement to load the XML data or quit\n\n```php\n$xml = simplexml_load_file(\
    \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](Image00087.jpg)\
    \ Next, initialize an iteration counter at zero\n\n```php\n$counter = 0 ;\n```\n\
    \n![image](Image00088.jpg) Now, add a loop to increment the counter and to display\
    \ its value, then retrieve an attribute value on each iteration to display an\
    \ image\n\n```php\nforeach( $xml->children() as $book )\n{\n$counter ++ ;\necho\
    \ ‘Book ‘ . $counter . ‘ : ‘ ;\necho ‘<img src=”’ . $book-> title[‘cover’] . ’>’\
    \ ;\n}\n```\n\n![image](Image00089.jpg) Save the document in your web server’s\
    \ `/htdocs` directory as `attribs-loop.php`, alongside the `catalog.xml` file,\
    \ then open the page via HTTP to see all node content\n\nA `SimpleXMLElement`\
    \ object also provides an `attributes()` method that returns an associative array\
    \ of attribute names and values. For example, `$obj->attributes()` can be used\
    \ to retrieve all attributes of an element.\n\nRSS (Really Simple Syndication)\
    \ is a dialect of XML in which all documents must have a `<rss>` element containing\
    \ a `<channel>` element. Data is enclosed within inner elements:\n\n```xml\n<rss>\n\
    \  <channel>\n    <title>Example Feed</title>\n    <item>\n      <title>Example\
    \ Item</title>\n      <description>Example description</description>\n      <link>http://example.com</link>\n\
    \    </item>\n  </channel>\n</rss>\n```\n"
  trans: "\n由于在同一层级上有五个“book”节点，在本例中，它们被创建为一个数组。因此，可以使用节点名称和数组索引数字来单独引用每个节点。\n\n###\
    \ 循环遍历节点\n\n`SimpleXML` 对象提供了处理其数据结构中包含的数据的方法。有用的是，它的 `children()` 方法返回所有子节点，并可用于循环遍历节点以检索每个节点的内容：\n\
    \n![image](img/Image00029.jpg)\n\nnodes-loop.php\n\n![image](img/Image00085.jpg)\
    \ 使用设置页面标题的语句开始 PHP 脚本\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title> ;\n\
    ```\n\n![image](img/Image00086.jpg) 添加一条语句加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file(\
    \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)\
    \ 接下来，将迭代计数器初始化零\n\n```php\n$counter = 0 ;\n```\n\n![image](img/Image00088.jpg)\
    \ 现在，添加一个循环来增加计数器并显示所有“title”和“category”子节点的内容\n\n```php\nforeach( $xml->children()\
    \ as $book )\n{\n$counter ++ ;\necho ‘Book ‘ . $counter . ‘ : ‘ ;\necho $book->\
    \ title .\n’ in easy steps \\[’ . $book-> category . ’\\]<hr> ;\n}\n```\n\n![image](img/Image00089.jpg)\
    \ 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `nodes-loop.php`，与 `catalog.xml` 文件放在一起，然后通过\
    \ HTTP 打开页面查看所有节点内容\n\n![image](img/Image00218.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n可以使用嵌套的 `foreach` 循环来遍历每个后代代代的子节点。\n\n### 获取属性\n\n`SimpleXMLElement` 对象属性中包含的值可以通过在节点名称后的方括号内指定带引号的属性名称来引用。例如，`$object->child['feature']`\
    \ 访问顶层“child”元素中名为“feature”的属性值：\n\n![image](img/Image00029.jpg)\n\nattribs.php\n\
    \n![image](img/Image00085.jpg) 使用设置页面标题的语句开始 PHP 脚本\n\n```php\n<?php\necho ‘<title>PHP\
    \ SimpleXML</title> ;\n```\n\n![image](img/Image00086.jpg) 添加一条语句加载 XML 数据或退出\n\
    \n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable to load\
    \ data!’ ) ;\n```\n\n![image](img/Image00087.jpg) 接下来，将迭代计数器初始化零\n\n```php\n$counter\
    \ = 0 ;\n```\n\n![image](img/Image00088.jpg) 接下来，检索第一个“book”元素的子节点“title”元素的内容\n\
    \n```php\necho ‘First book : ‘ .\n$xml-> book[0]-> title . ’ in easy steps<br>\
    \ ;\n```\n\n![image](img/Image00088.jpg) 现在，显示作为第一个“book”元素的子节点的“title”元素的“cover”属性值\n\
    \n```php\necho ‘Cover : ‘ . $xml-> book[0]-> title[‘cover’] . `<br>’ ;\n```\n\n\
    ![image](img/Image00089.jpg) 使用上一步检索到的值为第一个“book”元素显示封面图像\n\n```php\necho ‘<img\
    \ src=”’ . $xml-> book[0]-> title[‘cover’] . ’>’ ;\n```\n\n![image](img/Image00091.jpg)\
    \ 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `nodes.php`，与 `catalog.xml` 文件放在一起，然后通过 HTTP\
    \ 打开页面查看属性值和图像\n\n![image](img/Image00219.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n注意，这里的每个属性值都是 `/htdocs/images` 目录下图片的路径和文件名。\n\n### 循环遍历属性\n\n`SimpleXML` 对象的\
    \ `children()` 方法再次用于循环节点，并在每次迭代中检索特定节点指定属性的值：\n\n![image](img/Image00029.jpg)\n\
    \nattribs-loop.php\n\n![image](img/Image00085.jpg) 使用设置页面标题的语句开始 PHP 脚本\n\n```php\n\
    <?php\necho ‘<title>PHP SimpleXML</title> ;\n```\n\n![image](img/Image00086.jpg)\
    \ 添加一条语句加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\n\
    or die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg) 接下来，将迭代计数器初始化零\n\
    \n```php\n$counter = 0 ;\n```\n\n![image](img/Image00088.jpg) 现在，添加一个循环来增加计数器并显示其值，然后在每次迭代中检索一个属性值来显示图像\n\
    \n```php\nforeach( $xml->children() as $book )\n{\n$counter ++ ;\necho ‘Book ‘\
    \ . $counter . ‘ : ‘ ;\necho ‘<img src=”’ . $book-> title[‘cover’] . ’>’ ;\n}\n\
    ```\n\n![image](img/Image00089.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `attribs-loop.php`，与\
    \ `catalog.xml` 文件放在一起，然后通过 HTTP 打开页面查看所有节点内容\n\n`SimpleXMLElement` 对象还提供了 `attributes()`\
    \ 方法，该方法返回一个属性名称和值的关联数组。例如，`$obj->attributes()` 可用于检索元素的所有属性。\n\nRSS (Really Simple\
    \ Syndication) 是 XML 的一种方言，所有文档必须包含一个包含 `<channel>` 元素的 `<rss>` 元素。数据封装在内部元素中：\n\
    \n```xml\n<rss>\n  <channel>\n    <title>Example Feed</title>\n    <item>\n  \
    \    <title>Example Item</title>\n      <description>Example description</description>\n\
    \      <link>http://example.com</link>\n    </item>\n  </channel>\n</rss>\n```\n"
