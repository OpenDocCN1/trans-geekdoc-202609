    - PHP code is enclosed in special start and end processing tags that allow you
    to jump into and out of “PHP mode”, to implement instructions within an HTML document.

    - PHP code is executed on the server (“server-side”), unlike JavaScript code that
    is executed in the browser (“client-side”). The client receives the results of
    running the script without knowing what the underlying code was. Recently, server-side
    has become to be known as “The Cloud”.


    ![image](Image00003.jpg)


    The New icon pictured above appears in this book to indicate new features introduced
    in PHP version 7.


    ## Understanding The Cloud


    Whenever a user asks to view a web page in their browser, it requests the page
    from the web server and receives the page in response, via the HTTP protocol.
    Where a web page contains PHP script, the web server will first call upon the
    PHP engine to process the code before sending the response to the web browser:


    ![image](Image00004.jpg)


    ![image](Image00005.jpg)


    HTTP (HyperText Transfer Protocol) is the common communication standard that allows
    any computer connected to any web server to access files across the web.


    The ensuing pages describe how to create a development environment for interactive
    websites by installing the following server-side technologies on your own computer:


    - **Web Server** – Abyss Web Server X1 Free Personal Edition

    - **PHP Engine** – PHP 7.0.4


    ![image](Image00006.jpg)


    The examples in this book are created and tested with these software versions
    but may require modification for other versions.


    ## Installing the Abyss server


    Abyss X1 is a free compact web server available for Windows, Mac OS X, and Linux
    operating systems available for download at **[aprelium.com](http://www.aprelium.com)**.


    Despite its small footprint, Abyss supports many powerful features including dynamic
    content generation with server-side scripts – so is an ideal companion for PHP.


    ![image](Image00007.jpg)


    Further guidance on installation of the Abyss Web Server is available at **[aprelium.com/abyssws/start.html](http://www.aprelium.com/abyssws/start.html)**.


    The Abyss Web Server can be installed on your own computer to provide an environment
    for interactive PHP website development:


    ![image](Image00008.jpg) Download the Abyss X1 Web Server setup package for your
    system from **[aprelium.com/abyssws/download.php](http://www.aprelium.com/abyssws/download.php)**.


    ![image](Image00009.jpg)


    ![image](Image00010.jpg) Run the setup installer and **Agree** the License terms,
    then select the Abyss Web Server component and click **Next**.


    ![image](Image00011.jpg)


    ![image](Image00006.jpg)


    The Abyss setup package for Windows is an executable file named `abwsx1.exe` that
    you run to install the web server.


    ![image](Image00012.jpg) Accept the suggested location of `C:\Abyss Web Server`
    then choose to **Install as a Windows Service**.


    ![image](Image00013.jpg)


    After the installation process completes, your system’s default web browser will
    open, displaying the Abyss Web Server Console.


    ![image](Image00014.jpg) Select your preferred language, then enter a name and
    password for future access to the Abyss Console.


    ![image](Image00015.jpg) Now log in using your chosen name and password to see
    the Abyss Console confirm the server Status as “Running”.


    ![image](Image00016.jpg)


    ![image](Image00017.jpg) Type `http://localhost` into your browser address field
    then hit **Enter** – to see the default Abyss “Welcome” page.


    ![image](Image00018.jpg)


    ![image](Image00019.jpg)


    If you choose the “Manual startup” option, the Abyss logo will not appear in your
    system tray for easy start/stop control and access to the server console. Instead,
    the console can be found with your browser at `http://localhost:9999` or numerically
    at `http://127.0.0.1:9999` (“localhost” is an alias for the IP address 127.0.0.1).


    ![image](Image00005.jpg)


    In the Abyss console, click the “Configure” button then the General icon to see
    the default HTTP Port is 80 and the default Documents Path (where your web pages
    will reside) is `/htdocs`.


    ## Installing the PHP engine


    The PHP interpreter “engine”, which implements PHP scripts within web pages, is
    available for Windows, Mac OS X and Linux operating systems as a free download
    at **[php.net](http://www.php.net)**.


    ![image](Image00001.jpg)


    Further guidance on installation of PHP is available at **[php.net/manual/en/install.php](http://www.php.net/manual/en/install.php)**.


    Additionally, a pre-configured package for the Abyss Web Server on Windows is
    available from **[aprelium.com](http://www.aprelium.com)** and is recommended
    for a simple fast installation:


    ![image](Image00008.jpg) Download the PHP setup package for your system from **[aprelium.com/downloads](http://www.aprelium.com/downloads)**.


    ![image](Image00010.jpg) Run the downloaded executable to begin the Setup Wizard.


    ![image](Image00020.jpg) Accept the License terms then click on **Next**.


    ![image](Image00019.jpg)


    If you are installing PHP for Windows, be sure to choose one of the Thread Safe
    versions.


    ![image](Image00014.jpg) Accept the suggested Destination Folder `C:\Program Files
    (x86)\PHP` then click **Install**.


    ![image](Image00015.jpg) Finally, after the installation completes, click on **Finish**
    to close the Setup.


    ![image](Image00005.jpg)


    The PHP installation location will be required when configuring the Abyss Web
    Server.


    ![image](Image00006.jpg)


    ## Integrating Abyss and PHP


    The Abyss Web Server must be configured to recognize PHP scripts and employ the
    PHP interpreter when it encounters them. This is achieved in the Abyss Console
    by associating the file extension `.php`:


    ![image](Image0008.jpg) Enter `http://localhost:9999` into your browser address
    to launch the Abyss Web Console, then click the **Configure** button.


    ![image](Image00010.jpg) Click on the `Scripting Parameters` icon to open the
    Scripting Parameters page for editing.


    ![image](Image00024.jpg) Ensure that the **Enable Scripts Execution** box is checked,
    then click the **Add** button in the Interpreters table.


    ![image](Image00014.jpg) Set the **Interface** parameter to `FastCGI (Local -
    Pipes)`.


    ![image](Image00015.jpg) Set the **Interpreter** parameter to the PHP path location
    on your system of `php-cgi.exe`.


    ![image](Image00017.jpg) Set the **Associated Extensions** parameter to `php`,
    so your configuration should look like that below:


    ![image](Image00025.jpg)


    ![image](Image00007.jpg)


    Further guidance on configuration of the Abyss Web Server is available online
    at **[aprelium.com/abyssws/start.html](http://www.com/abyssws/start.html)**.


    ![image](Image00006.jpg)


    The **localhost** domain name is an alias for the domain IP address of **127.0.0.1**
    – so the Abyss Web Server Console can alternatively be addressed as `http://127.0.0.1:9999`.


    ![image](Image00026.jpg) Click the **OK** button to validate your new configuration.


    ![image](Image00027.jpg) Click the **Restart** button that next appears to apply
    the changes you have made to the Abyss configuration.


    ![image](Image00028.jpg)


    ![image](Image00019.jpg)

    '
