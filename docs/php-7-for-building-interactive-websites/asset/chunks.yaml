- raw: "PHP provides a special “superglobal”  **$\\_SERVER**  array variable with\
    \ a  **REQUEST\\_METHOD**  element in which it stores the type of request. Where\
    \ a form uses the  **POST**  method for submission, two different types of request\
    \ are made to the PHP script when the page loads – simply displaying the form\
    \ uses the standard  **GET**  method made by most web pages, whereas submitting\
    \ the form uses the  **POST**  method. Therefore the request method can be examined\
    \ to determine which course of action to take.\n\nUsing this technique, the name\
    \ of the same single page is also specified as the form handler to the HTML  **action**\
    \  attribute. The form can be displayed by the usual  **echo**  instruction and\
    \ validation checks can be made for the response in the same way as described\
    \ for separate form handler scripts:\n\n![image](Image00029.jpg)\n\nsingle.php\n\
    \n![image](Image00036.jpg) Create an HTML document containing a PHP script that\
    \ examines the page request method\n\n **<?php** \n\n**if ( $\\_SERVER\\[ ‘REQUEST\\\
    _METHOD’ \\] != ‘POST’ )**\n\n **{** \n\n **\\# Form display statements to be\
    \ inserted here (step 2).** \n\n **}** \n\n **else** \n\n **{** \n\n **\\# Form\
    \ handling statements to be inserted here(step 3).** \n\n **}** \n\n![image](Image00037.jpg)\
    \ Now, insert a statement to display a form when the page has been requested by\
    \ the standard  **GET**  method\n\n**echo ‘**\n\n**<form action=” single.php ”\
    \ method=” POST ”>**\n\n **<fieldset>** \n\n **<legend>Send us your comments</legend>**\
    \ \n\n**<textarea rows=”5” cols=”40” name=” comment ”>**\n\n **</textarea>** \n\
    \n **</fieldset>** \n\n **<p><input type=”submit” ></p>** \n\n**</form> ‘ ;**\n\
    \n![image](Image00038.jpg) Next, insert a statement to handle the form submission\
    \ when the page has been requested by the  **POST**  method\n\n**if ( !empty (\
    \ $\\_POST\\[‘comment’\\] ) )**\n\n **{** \n\n**$comment \\= $\\_POST\\[‘comment’\\\
    ] ;**\n\n**echo “Comment : $comment “ ;**\n\n **}** \n\n **else** \n\n**{ $comment\
    \ \\= NULL ; echo ‘You must enter a comment’ ; }**\n\n **?>** \n\n![image](Image00039.jpg)\
    \ Save the document in your web server’s **/htdocs** directory as  **single.php**\
    \  then submit the form to see the responses\n\n![image](Image00166.jpg)\n\n![image](Image00167.jpg)\n\
    \n![image](Image00168.jpg)\n\n![image](Image00169.jpg)\n\n![image](Image00005.jpg)\n\
    \nThe form will be handled by the same page on submission if the action attribute\
    \ specifies an empty string **action=””** – but it is preferable to specify the\
    \ page name.\n\n **Making sticky forms** \n\nWhen a user attempts to submit a\
    \ form where a required field has not been completed, it is desirable to retain\
    \ the entries in the fields they have completed, by making the form “sticky”.\
    \ This is especially so for lengthy forms with many fields – so the user need\
    \ not complete all fields once more – and is easily achieved with PHP.\n\nSimply\
    \ assigning the relevant submitted field data from the  **$\\_POST**  array to\
    \ the HTML tag’s  **value**  attribute with  **echo**  retains the entry when\
    \ the form is displayed again for completion. As a precaution, the statement should\
    \ use the  **isset()**  function to check that the field was in fact completed\
    \ before submission.\n\nAn error message for each incomplete field can be assigned\
    \ to an array to advise of omissions when the form is displayed again, or a message\
    \ written confirming success when all fields are completed:\n\n![image](Image00029.jpg)\n\
    \nsticky.php\n\n![image](Image00036.jpg) Create an HTML document containing a\
    \ sticky form with two text fields for name and email address details\n\n**<form\
    \ method=” POST ” action=” <?php $\\_SERVER\\[ ‘PHP\\_SELF’ \\] ?> ” >**\n\n **<p>Name:**\
    \ \n\n**<input type=”text” name=” name ” value=” <?php if ( isset( $\\_POST\\\
    [ ‘name’ \\] ) ) echo $\\_POST\\[ ‘name’ \\] ; ?> ”> </p>**\n\n **<p>Email:**\
    \ \n\n**<input type=”text” name=” email ” value=” <?php if ( isset( $\\_POST\\\
    [ ‘email’ \\] ) ) echo $\\_POST\\[ ‘email’ \\] ; ?> ”></p>**\n\n **<p><input type=”submit”></p>**\
    \ \n\n **</form>** \n\n![image](Image00037.jpg) Now, add a PHP script to handle\
    \ the form submission\n\n **<?php** \n\n**if ( $\\_SERVER\\[ ‘REQUEST\\_METHOD’\
    \ \\] \\== ‘POST’ )**\n\n **{** \n\n **// Statements to be inserted here (steps\
    \ 3-5).** \n\n **}** \n\n **?>** \n\n![image](Image00038.jpg) Next, insert into\
    \ the PHP script block a statement to create an array for error messages\n\n**$errors\
    \ \\= array() ;**\n\n![image](Image00005.jpg)\n\n **$\\_SERVER\\[ ‘PHP\\_SELF’\
    \ \\]** is used by this example to ensure the script will still work if renamed.\n\
    \n![image](Image00006.jpg)\n\nThe **if** statement tests that the form has been\
    \ submitted by checking the request method is **POST** , not the **GET** method\
    \ that is used to display the empty form.\n\n![image](Image00039.jpg) Then, insert\
    \ statements to initialize variables with submitted values, or add to the errors\
    \ array for omissions\n\n**if ( empty( $\\_POST\\[ ‘name’ \\] ) ) { $errors\\\
    [\\] \\= ‘name’ ; }**\n\n**else { $name \\= trim( $\\_POST\\[ ‘name’ \\] ) ; }**\n\
    \n**if ( empty( $\\_POST\\[ ‘email’ \\] ) ) { $errors\\[\\] \\= ‘email’ ; }**\n\
    \n**else { $email \\= trim( $\\_POST\\[ ‘email’ \\] ) ; }**\n\n![image](Image00040.jpg)\
    \ Now, insert statements to write error messages or confirm successful form submission\n\
    \n**if( !empty( $errors ) )**\n\n**{ echo ‘Error! Please enter your ‘ ;**\n\n\
    **foreach ( $errors as $msg ) { echo “ - $msg “ ; } }**\n\n**else { echo “Success!\
    \ Thanks $name “ ; }**\n\n![image](Image00041.jpg) Save the document in your web\
    \ server’s  **/htdocs**  directory as  **sticky.php**  then open it via HTTP and\
    \ submit the form to see the retained values and response messages\n\n![image](Image00170.jpg)\n\
    \n![image](Image00171.jpg)\n\n![image](Image00005.jpg)\n\nIt is good practice\
    \ to use the **trim()** function, as seen here, to remove any leading and trailing\
    \ spaces from the submitted field value.\n\n **Uploading files** \n\nThe PHP \
    \ **$\\_FILES**  superglobal variable makes it simple to  **POST**  file uploads\
    \ from an HTML form if the  **<form>**  tag includes an  **enctype**  attribute\
    \ set to “multipart/formdata”. When submitted, a  **$\\_FILES**  associative array\
    \ is created with keys that include the file  **name**  , a generated temporary\
    \ name ( **tmp\\_name**  ), and the file  **size**  . The file name and size can\
    \ be used for validation. The temporary filename can then be specified to the\
    \  **move\\_uploaded\\_file()**  function along with the original filename to\
    \ upload the file:\n\n![image](Image00029.jpg)\n\nupload.php\n\n![image](Image00036.jpg)\
    \ Create an HTML document containing a sticky form with a file type input named\
    \ “image”\n\n**<form action=” <?php $\\_SERVER\\[ ‘PHP\\_SELF’ \\] ?>”**\n\n**method=”POST”\
    \ enctype = “multipart/formdata” >**\n\n**Select an image to upload :**\n\n**<input\
    \ type=”file” name=” image ” >**\n\n **<input type=”submit” value=”Upload Image”>\
    \ </form>** \n\n![image](Image00037.jpg) Now add a PHP script to handle the form\
    \ submission\n\n **<?php** \n\n**if ( $\\_SERVER\\[ ‘REQUEST\\_METHOD’ \\] ==\
    \ ‘POST’ )**\n\n **{** \n\n **// Statements to be inserted here (steps 3-7).**\
    \ \n\n **}** \n\n **?>** \n\n![image](Image00038.jpg) Next, insert statements\
    \ to initialize three variables with information about the file selected by the\
    \ user\n\n**$name \\= $\\_FILES\\[ ‘ image ’ \\]\\[ ‘name’ \\] ;**\n\n**$temp\
    \ \\= $\\_FILES\\[ ‘ image ’ \\]\\[ ‘tmp\\_name’ \\] ;**\n\n**$size \\= $\\_FILES\\\
    [ ‘ image ’ \\]\\[ ‘size’ \\] ;**\n\n![image](Image00039.jpg) Now, insert statements\
    \ to ensure the selected file is of a desired file type by testing the file extension,\
    \ or quit\n\n**$ext \\= pathinfo( $name , PATHINFO\\_EXTENSION ) ;**\n\n**$ext\
    \ \\= strtolower( $ext ) ;**\n\n**if( $ext != ‘png’ && $ext != ‘jpg’ && $ext !=\
    \ ‘gif’ )**\n\n**{ echo ‘Format must be PNG, JPG, or GIF’ ; exit() ; }**\n\n![image](Image00040.jpg)\
    \ Insert a statement to ensure the selected file is of a desired file size, or\
    \ quit\n\n**if( $size \\> 512000 )**\n\n**{ echo ‘File size must not exceed 500Kb’\
    \ ; exit() ; }**\n\n![image](Image00019.jpg)\n\nThe PHP configuration must permit\
    \ file uploads for this example to work. The configuration file **php.ini** ,\
    \ within the PHP directory, must contain a line **file\\_uploads = On** .\n\n\
    ![image](Image00005.jpg)"
  fmt: "\nPHP provides a special “superglobal” `$_SERVER` array variable with a `REQUEST_METHOD`\
    \ element in which it stores the type of request. Where a form uses the `POST`\
    \ method for submission, two different types of request are made to the PHP script\
    \ when the page loads – simply displaying the form uses the standard `GET` method\
    \ made by most web pages, whereas submitting the form uses the `POST` method.\
    \ Therefore the request method can be examined to determine which course of action\
    \ to take.\n\nUsing this technique, the name of the same single page is also specified\
    \ as the form handler to the HTML `action` attribute. The form can be displayed\
    \ by the usual `echo` instruction and validation checks can be made for the response\
    \ in the same way as described for separate form handler scripts:\n\n![image](Image00029.jpg)\n\
    \nsingle.php\n\n![image](Image00036.jpg) Create an HTML document containing a\
    \ PHP script that examines the page request method\n\n```php\n<?php\nif ( $_SERVER['REQUEST_METHOD']\
    \ != 'POST' )\n{\n    # Form display statements to be inserted here (step 2).\n\
    }\nelse\n{\n    # Form handling statements to be inserted here(step 3).\n}\n```\n\
    \n![image](Image00037.jpg) Now, insert a statement to display a form when the\
    \ page has been requested by the standard `GET` method\n\n```php\necho '<form\
    \ action=\" single.php \" method=\" POST \">\n    <fieldset>\n    <legend>Send\
    \ us your comments</legend>\n    <textarea rows=\"5\" cols=\"40\" name=\" comment\"\
    ></textarea>\n    </fieldset>\n    <p><input type=\"submit\" ></p>\n</form> ;\n\
    ```\n\n![image](Image00038.jpg) Next, insert a statement to handle the form submission\
    \ when the page has been requested by the `POST` method\n\n```php\nif (!empty(\
    \ $_POST['comment'] ))\n{\n    $comment = $_POST['comment'];\n    echo \"Comment\
    \ : $comment \";\n}\nelse\n{ \n    $comment = NULL ; \n    echo 'You must enter\
    \ a comment'; \n}\n?>\n```\n\n![image](Image00039.jpg) Save the document in your\
    \ web server’s `/htdocs` directory as `single.php` then submit the form to see\
    \ the responses\n\n![image](Image00166.jpg)\n![image](Image00167.jpg)\n![image](Image00168.jpg)\n\
    ![image](Image00169.jpg)\n![image](Image00005.jpg)\n\nThe form will be handled\
    \ by the same page on submission if the action attribute specifies an empty string\
    \ `action=\"\"` – but it is preferable to specify the page name.\n\n## Making\
    \ sticky forms\n\nWhen a user attempts to submit a form where a required field\
    \ has not been completed, it is desirable to retain the entries in the fields\
    \ they have completed, by making the form “sticky”. This is especially so for\
    \ lengthy forms with many fields – so the user need not complete all fields once\
    \ more – and is easily achieved with PHP.\n\nSimply assigning the relevant submitted\
    \ field data from the `$_POST` array to the HTML tag’s `value` attribute with\
    \ `echo` retains the entry when the form is displayed again for completion. As\
    \ a precaution, the statement should use the `isset()` function to check that\
    \ the field was in fact completed before submission.\n\nAn error message for each\
    \ incomplete field can be assigned to an array to advise of omissions when the\
    \ form is displayed again, or a message written confirming success when all fields\
    \ are completed:\n\n![image](Image00029.jpg)\n\nsticky.php\n\n![image](Image00036.jpg)\
    \ Create an HTML document containing a sticky form with two text fields for name\
    \ and email address details\n\n```html\n<form method=\" POST\" action=\"<?php\
    \ $_SERVER['PHP_SELF'] ?>\" >\n    <p>Name:\n    <input type=\"text\" name=\"\
    \ name\" value=\"<?php if ( isset($_POST['name']) ) echo $_POST['name']; ?> ?>></p>\n\
    \    <p>Email:\n    <input type=\"text\" name=\" email\" value=\"<?php if ( isset($_POST['email'])\
    \ ) echo $_POST['email']; ?> ?>></p>\n    <p><input type=\"submit\"></p> \n</form>\n\
    ```\n\n![image](Image00037.jpg) Now, add a PHP script to handle the form submission\n\
    \n```php\n<?php\nif ( $_SERVER['REQUEST_METHOD'] == 'POST' )\n{\n    // Statements\
    \ to be inserted here (steps 3-5).\n}\n?>\n```\n\n![image](Image00038.jpg) Next,\
    \ insert into the PHP script block a statement to create an array for error messages\n\
    \n```php\n$errors = array();\n```\n\n![image](Image00005.jpg)\n\n`$_SERVER['PHP_SELF']`\
    \ is used by this example to ensure the script will still work if renamed.\n\n\
    ![image](Image00006.jpg)\n\nThe `if` statement tests that the form has been submitted\
    \ by checking the request method is `POST`, not the `GET` method that is used\
    \ to display the empty form.\n\n![image](Image00039.jpg) Then, insert statements\
    \ to initialize variables with submitted values, or add to the errors array for\
    \ omissions\n\n```php\nif ( empty($_POST['name']) ) { $errors[] = 'name'; }\n\
    else { $name = trim($_POST['name']); }\n\nif ( empty($_POST['email']) ) { $errors[]\
    \ = 'email'; }\nelse { $email = trim($_POST['email']); }\n```\n\n![image](Image00040.jpg)\
    \ Now, insert statements to write error messages or confirm successful form submission\n\
    \n```php\nif( !empty( $errors ) )\n{ \n    echo 'Error! Please enter your ';\n\
    \    foreach ( $errors as $msg ) { echo \" - $msg \"; }\n}\nelse \n{ \n    echo\
    \ \"Success! Thanks $name \"; \n}\n```\n\n![image](Image00041.jpg) Save the document\
    \ in your web server’s `/htdocs` directory as `single.php` then submit the form\
    \ to see the responses\n\n`$_SERVER['PHP_SELF']` is used by this example to ensure\
    \ the script will still work if renamed.\n\n`$_POST` superglobal makes it simple\
    \ to `POST` file.\n\n## Uploading files\n\nIt is good practice to use the `trim()`\
    \ function, as seen here, to remove any leading and trailing spaces from the value.\n\
    \n`move_uploaded_file()` function along with the original filename to upload the\
    \ file:\n\n![image](Image0029.jpg)\n\nupload.php\n\n![image](Image00036.jpg) Create\
    \ an HTML document containing a sticky form with a file input named “image”\n\n\
    ```html\n<form action=\"<?php $_SERVER['PHP_SELF'] ?>\" method=\"POST\" enctype=\"\
    multipart/formdata\">\n    Select an image to upload:\n    <input type=\"file\"\
    \ name=\" image \">\n    <input type=\"submit\" value=\"Upload Image\">\n</form>\n\
    ```\n\n![image](Image00037.jpg) Now add a PHP script to handle the form submission\n\
    \n```php\n<?php\nif ( $_SERVER['REQUEST_METHOD'] == 'POST' )\n{\n    // Statements\
    \ to be inserted here (steps 3-7).\n}\n?>\n```\n\n![image](Image00038.jpg) Next,\
    \ insert statements to initialize three variables with information about the file\
    \ selected by user\n\n```php\n$name = $_FILES['image']['name'];\n$temp = $_FILES['image']['tmp_name'];\n\
    $size = $_FILES['image']['size'];\n```\n\n![image](Image00039.jpg) Now, insert\
    \ statements to ensure the selected file is of a desired file type by testing\
    \ the file extension, or quit\n\n```php\n$ext = pathinfo($name, PATHINFO_EXTENSION);\n\
    $ext = strtolower($ext);\nif($ext != 'png' && $ext != 'jpg' && $ext != 'gif')\n\
    {\n    echo 'Format must be PNG, JPG, or GIF';\n    exit();\n}\n```\n\n![image](Image00040.jpg)\
    \ Insert a statement to ensure the selected file is of a desired file size, or\
    \ quit\n\n```php\nif( $size > 512000 )\n{\n    echo 'File size must not exceed\
    \ 500Kb';\n    exit();\n}\n```\n\n![image](Image00019.jpg)\n\nThe PHP configuration\
    \ must permit file uploads for this example to work. The configuration file `php.ini`,\
    \ within the PHP directory, must contain a line `file_uploads = On`.\n\n![image](Image00005.jpg)\n"
  trans: "\n\nPHP 提供了一个特殊的“超全局”变量 `$_SERVER` 数组，其中包含 `REQUEST_METHOD` 元素，用于存储请求的类型。当表单使用\
    \ `POST` 方法提交时，页面加载时会向 PHP 脚本发送两种类型的请求——大多数页面显示表单使用标准的 `GET` 方法，而提交表单则使用 `POST`\
    \ 方法。因此，可以检查请求方法来确定采取何种操作。\n\n使用这种技术，同一个页面名也可以作为 HTML `action` 属性指定的表单处理程序。表单可以通过常用的\
    \ `echo` 指令显示，并像单独表单处理脚本那样对响应进行检查：\n\n![image](img/Image0029.jpg)\n\nsingle.php\n\
    \n![image](img/Image0036.jpg) 创建包含 PHP 脚本的 HTML 文档以检查页面方法\n\n```php\n<?php\nif\
    \ ( $_SERVER['REQUEST_METHOD'] != 'POST' )\n{\n    # 在此处插入显示表单的语句（步骤 2）。\n}\n\
    else\n{\n    # 在此处插入处理表单语句（步骤 3）。\n}\n```\n\n![image](img/Image0037.jpg) 现在，当页面通过\
    \ `GET` 方法请求时，插入一个显示表单的语句\n\n```php\necho '<form action=\" single.php \" method=\"\
    \ POST \">\n    <fieldset>\n    <legend>Send us comments</legend>\n    <textarea\
    \ rows=\"5\" cols=\"40\" name=\" comment\"></textarea>\n    </fieldset>\n    <p><input\
    \ type=\"submit\" ></p>\n</form>';\n```\n\n![image](img/Image0038.jpg) 接下来，当页面通过\
    \ `POST` 方法请求时，插入一个语句来处理表单提交\n\n```php\nif (!empty($_POST['comment']))\n{\n  \
    \  $comment = $_POST['comment'];\n    echo \"Comment : $comment \";\n}\nelse\n\
    { \n    $comment = NULL ; \n    echo 'You must enter a comment'; \n}\n?>\n```\n\
    \n![image](img/Image0039.jpg) 将文档保存到服务器的 `/htdocs` 目录并命名为 `single.php`，然后提交表单查看响应\n\
    \n![image](img/Image0166.jpg)\n![image](img/Image0167.jpg)\n![image](img/Image0168.jpg)\n\
    ![image](img/Image0169.jpg)\n![image](img/Image0005.jpg)\n\n如果 `action` 属性指定为空字符串\
    \ `action=\"\"`，表单将由同一个页面处理——但最好指定页面名。\n\n## 制作粘性表单（Sticky forms）\n\n当用户尝试提交未填写完整字段的表单时，最好保留他们已填写的字段内容，使表单具有“粘性”。这对于具有许多字段的长表单尤为重要——用户不需要再次填写所有字段——可以通过\
    \ PHP 轻松实现。\n\n简单地将 `$_POST` 数组中的相关提交字段赋值给 HTML 标签的 `value` 属性，可以在表单再次显示时保留输入。作为预防措施，语句应使用\
    \ `isset()` 函数检查提交前该字段确实已填写。\n\n每个未完整字段的错误信息可以分配给数组，在表单再次显示时提醒缺失，或者在所有字段完成后写入确认成功的消息：\n\
    \n![image](img/Image0029.jpg)\n\nsticky.php\n\n![image](img/Image0036.jpg) 创建一个包含姓名和邮箱详情两个文本字段的粘性表单\
    \ HTML 文档\n\n```html\n<form method=\" POST\" action=\"<?php $_SERVER['PHP_SELF']\
    \ ?>\">\n    <p>Name:\n    <input type=\"text\" name=\" name\" value=\"<?php if\
    \ ( isset($_POST['name']) ) echo $_POST['name']; ?>></p>\n    <p>Email:\n    <input\
    \ type=\"text\" name=\" email\" value=\"<?php if ( isset($_POST['email']) ) echo\
    \ $_POST['email']; ?>></p>\n    <p><input type=\"submit\"></p> \n</form>\n```\n\
    \n![image](img/Image0037.jpg) 现在，添加一个 PHP 脚本处理表单提交\n\n```php\n<?php\nif ( $_SERVER['REQUEST_METHOD']\
    \ == 'POST' )\n{\n    // 在此处插入语句（步骤 3-5）。\n}\n?>\n```\n\n![image](img/Image0038.jpg)\
    \ 接下来，在 PHP 脚本块中插入一个语句创建一个错误消息数组\n\n```php\n$errors = array();\n```\n\n![image](img/Image00005.jpg)\n\
    \n此示例使用了 `$_SERVER['PHP_SELF']` 以确保脚本重命名后仍然有效。\n\n![image](img/Image00006.jpg)\n\
    \n`if` 语句通过检查请求方法是否为 `POST` 而不是显示空表单的 `GET` 方法来测试表单已提交。\n\n![image](img/Image0039.jpg)\
    \ 然后，插入语句用提交的值初始化变量，或将缺失项添加到 `errors` 数组\n\n```php\nif ( empty($_POST['name'])\
    \ ) { $errors[] = 'name'; }\nelse { $name = trim($_POST['name']); }\n\nif ( empty($_POST['email'])\
    \ ) { $errors[] = 'email'; }\nelse { $email = trim($_POST['email']); }\n```\n\n\
    ![image](img/Image00040.jpg) 现在，插入语句写入错误消息或确认表单提交成功\n\n```php\nif( !empty( $errors\
    \ ) )\n{ \n    echo 'Error! Please enter your ';\n    foreach ( $errors as $msg\
    \ ) { echo \" - $msg \"; }\n}\nelse\n{\n    echo 'Success!'; \n}\n```\n\n![image](img/Image0041.jpg)\n\
    \n## 上传文件\n\n良好的做法是使用 `trim()` 函数（如所示）移除文件名值前后的空格。\n\n配合原始文件名使用 `move_uploaded_file()`\
    \ 函数上传文件：\n\n![image](img/Image0029.jpg)\n\nupload.php\n\n![image](img/Image0036.jpg)\
    \ 创建一个包含名为“image”的文件输入的 HTML 文档\n\n```html\n<form action=\"<?php $_SERVER['PHP_SELF']\
    \ ?>\" method=\"POST\" enctype=\"multipart/formdata\">\n    Select an image to\
    \ upload:\n    <input type=\"file\" name=\" image \">\n    <input type=\"submit\"\
    \ value=\"Upload Image\">\n</form>\n```\n\n![image](img/Image0037.jpg) 现在添加一个\
    \ PHP 脚本处理表单提交\n\n```php\n<?php\nif ( $_SERVER['REQUEST_METHOD'] == 'POST' )\n\
    {\n    // 在此处插入语句（步骤 3-7）。\n}\n?>\n```\n\n![image](img/Image0038.jpg) 接下来，插入语句用用户选择的信息初始化三个变量\n\
    \n```php\n$name = $_FILES['image']['name'];\n$temp = $_FILES['image']['tmp_name'];\n\
    $size = $_FILES['image']['size'];\n```\n\n![image](img/Image0039.jpg) 现在，插入语句通过测试文件扩展名确保所选文件类型正确，或退出\n\
    \n```php\n$ext = pathinfo($name, PATHINFO_EXTENSION);\n$ext = strtolower($ext);\n\
    if($ext != 'png' && $ext != 'jpg' && $ext != 'gif')\n{\n    echo 'Format must\
    \ be PNG, JPG, or GIF';\n    exit();\n}\n```\n\n![image](img/Image0040.jpg) 插入语句确保所选文件大小符合要求，或退出\n\
    \n```php\nif( $size > 512000 )\n{\n    echo 'File size must not exceed 500Kb';\n\
    \    exit();\n}\n```\n\n"
