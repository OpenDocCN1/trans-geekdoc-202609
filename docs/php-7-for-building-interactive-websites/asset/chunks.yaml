- raw: "It is important to recognize that by default, argument data is passed “by\
    \ value”. This means that if a function call specifies a variable name, only a\
    \ copy of the data within that variable gets passed to the function. Modifying\
    \ the argument will not affect the original data stored in the variable when it\
    \ is passed by value.\n\nIf you want a function to modify data stored in a variable,\
    \ specified in a function call, you must pass it “by reference”. This allows the\
    \ function to operate directly on the original data. Modifying the argument will\
    \ affect the original data in the variable when it is passed by reference. To\
    \ ensure that an argument is always passed to a function by reference, you need\
    \ simply prefix an  **&**  ampersand before the parameter name in the function\
    \ definition.\n\n![image](Image00029.jpg)\n\narguments.php\n\n![image](Image00085.jpg)\
    \ Begin a PHP script with a statement to initialize two variables with the same\
    \ integer value\n\n **<?php** \n\n**$a \\= $b \\= 5 ;**\n\n![image](Image00086.jpg)\
    \ Next, define a function that accepts two integer arguments – one by value and\
    \ the other by reference\n\n**function modify ( int $val , int & $ref )**\n\n\
    \ **{** \n\n **// Statements to be inserted here.** \n\n **}** \n\n![image](Image00087.jpg)\
    \ Now, insert statements to output the passed values, then increment those values\
    \ and display the modified values\n\n**echo “Passed values : $val , $ref <br>”\
    \ ;**\n\n**$val ++ ;**\n\n**$ref ++ ;**\n\n**echo “Incremented values : $val ,\
    \ $ref <hr>” ;**\n\n![image](Image00088.jpg) After the function block add a statement\
    \ to call the function, passing the variable values as arguments\n\n**modify (\
    \ $a , $b ) ;**\n\n![image](Image00089.jpg) Finally, add a statement to display\
    \ the values now stored in each variable\n\n**echo “Stored values : $a , $b ”\
    \ ;**\n\n **?>** \n\n![image](Image00091.jpg) Save the document in your web server’s\
    \  **/htdocs**  directory as  **arguments.php**  then open the page via HTTP to\
    \ see the argument and variable values\n\n![image](Image00092.jpg)\n\n![image](Image00006.jpg)\n\
    \nThe **int** type description in this example specifies that only integer data\
    \ values can be passed as arguments to the function.\n\n **Varying parameters**\
    \ \n\nDefault argument values can optionally be specified in a function definition\
    \ by assignment to the parameter name, like this:\n\n **function *function\\_name*\
    \ ( $*arg\\_1* , $*arg\\_2* = “Default String” )** \n\n **{** \n\n ***statement-to-be-executed\
    \ ;  \n\nstatement-to-be-executed ;  \n\nstatement-to-be-executed ;*** \n\n **}**\
    \ \n\nThis allows a function call to be made that specifies either one or two\
    \ argument values. If only one argument is specified, it is assigned to the first\
    \ parameter and the default value is used by the second parameter. Where default\
    \ values are specified for parameters, they must only appear in the parameter\
    \ list following (to the right of) parameters that have no specified default value.\
    \ Otherwise, a call without the correct total number of arguments would cause\
    \ an error.\n\n![image](Image00019.jpg)\n\nIf multiple default values are specified\
    \ there is currently no way to skip a parameter in a function call, to assign\
    \ an argument value to a particular parameter.\n\nIf you need to create a function\
    \ that will accept an unknown number of arguments, PHP has a special  **...**\
    \  “splat” operator for that purpose. This can be used in a function definition\
    \ like this:\n\n **function *function\\_name* ( ...$*args* )** \n\n **{** \n\n\
    \ ***statement-to-be-executed ;  \n\nstatement-to-be-executed ;  \n\nstatement-to-be-executed\
    \ ;*** \n\n **}** \n\nWhen the  **...**  splat operator is used to prefix a parameter\
    \ name in a function definition, multiple arguments can be passed to that parameter\
    \ to create an array. The array can be traversed like any other array to manipulate\
    \ the passed in argument values.\n\nAdditionally, the  **...**  splat operator\
    \ can be used to “unpack” an array specified in a function call to pass its element\
    \ values as individual arguments like this:\n\n **function *function\\_name* (\
    \ $*arg\\_1* , $*arg\\_2* , $*arg\\_3* )** \n\n **{** \n\n **echo $*arg\\_1* +\
    \ $*arg\\_2* + $*arg\\_3* ;** \n\n **}** \n\n **$arr = \\[ 1 , 2 , 3 \\] ;** \n\
    \n ***function\\_name* ( ...$arr ) ;         # Outputs 6** \n\n![image](Image00005.jpg)\n\
    \nThe **...** splat operator is also sometimes known as the “scatter” operator.\n\
    \n![image](Image00029.jpg)\n\nparameters.php\n\n![image](Image00085.jpg) Begin\
    \ a PHP script by defining a function that provides default string values to its\
    \ two parameters\n\n **<?php** \n\n**function drink ( string $tmp \\= ‘hot’ ,\
    \ string $flavor \\= ‘tea’ )**\n\n **{** \n\n **// Statement to be inserted here.**\
    \ \n\n **}** \n\n![image](Image00086.jpg) Next, insert a statement to display\
    \ its default values or passed in argument values\n\n**echo “Drinking $tmp $flavor\
    \ .<br>” ;**\n\n![image](Image00087.jpg) After the function block, add function\
    \ calls that optionally pass string arguments\n\n**drink () ; drink ( ‘iced’ )\
    \ ; drink ( ‘cold’ , ‘lemonade’ ) ;**\n\n![image](Image00088.jpg) Now, define\
    \ a function that can accept multiple integer arguments and display their total\
    \ value\n\n**function add ( int ... $numbers )**\n\n **{** \n\n**$total \\= 0\
    \ ;**\n\n**foreach( $numbers as $num ) { $total + \\= $num ; }**\n\n**echo “<hr>Total\
    \ : $total ” ;**\n\n **}** \n\n![image](Image00089.jpg) Finally, after the function\
    \ block add a statement to call the function in the previous step and pass three\
    \ values\n\n**add ( 1 , 2 , 3 ) ;**\n\n **?>** \n\n![image](Image00091.jpg) Save\
    \ the document in your web server’s  **/htdocs**  directory as  **parameters.php**\
    \  then open the page via HTTP to see the argument and default values\n\n![image](Image00093.jpg)\n\
    \n![image](Image00005.jpg)\n\nYou can specify regular positional parameters before\
    \ a parameter that accepts multiple arguments with the **...** splat operator.\
    \ Only arguments that outnumber the positional elements will be added to the array\
    \ of the final parameter.\n\n **Recognizing scope** \n\nWhen creating custom functions\
    \ it is important to understand how variable accessibility is limited by the variable’s\
    \ “scope”:\n\n •  Variables created outside a function have “global” scope, but\
    \ are not normally accessible from within any function block\n\n •  Variables\
    \ created inside a function have “local” scope so are only accessible from within\
    \ that particular function block\n\nAs a variable created within a function is\
    \ not accessible from elsewhere, its name may duplicate the name of a variable\
    \ outside a function block, or within another function block, without conflict.\
    \ This allows a global variable to contain a different value to a local variable\
    \ of the same name.\n\n![image](Image00019.jpg)\n\nGlobal variables in PHP are\
    \ not like those in other programming languages such as C, where they are automatically\
    \ available to functions. In PHP, global variables can only be used in functions\
    \ if first explicitly declared inside the function block using the **global**\
    \ keyword.\n\nIf you wish to use a global variable inside a function, you must\
    \ first include a statement with the  **global**  keyword to declare that the\
    \ variable name refers to a global variable, like this:\n\n **global *variable-name*\
    \ ;** \n\nThe scope of a variable created within a function can be altered to\
    \ make it available globally by preceding its declaration with the  **global**\
    \  keyword – but this is bad practice and should be avoided.\n\nFunction statements\
    \ can call other functions to execute their statements and can also call themselves\
    \ to execute recursively. As with loops, a recursive function must alter the state\
    \ of a tested condition so it will not continue forever. This might be a counter\
    \ value that gets passed in as an argument from an initial function call, then\
    \ gets incremented on successive recursive calls until it exceeds a value specified\
    \ in a test. Alternatively, a static local variable could be declared to store\
    \ an incrementing value like this:\n\n **static *variable-name* ;** "
  fmt: "\nIt is important to recognize that by default, argument data is passed “by\
    \ value”. This means that if a function call specifies a variable name, only a\
    \ copy of the data within that variable gets passed to the function. Modifying\
    \ the argument will not affect the original data stored in the variable when it\
    \ is passed by value.\n\nIf you want a function to modify data stored in a variable,\
    \ specified in a function call, you must pass it “by reference”. This allows the\
    \ function to operate directly on the original data. Modifying the argument will\
    \ affect the original data in the variable when it is passed by reference. To\
    \ ensure that an argument is always passed to a function by reference, you need\
    \ simply prefix an `&` ampersand before the parameter name in the function definition.\n\
    \n![image](Image00029.jpg)\n\n`arguments.php`\n\n![image](Image00085.jpg) Begin\
    \ a PHP script with a statement to initialize two variables with the same integer\
    \ value\n\n```php\n<?php\n$a = $b = 5 ;\n```\n\n![image](Image00086.jpg) Next,\
    \ define a function that accepts two integer arguments – one by value and the\
    \ other by reference\n\n```php\nfunction modify ( int $val , int & $ref )\n{\n\
    \    // Statements to be inserted here.\n}\n```\n\n![image](Image00087.jpg) Now,\
    \ insert statements to output the passed values, then increment those values and\
    \ display the modified values\n\n```php\necho “Passed values : $val , $ref <br>”\
    \ ;\n$val ++ ;\n$ref ++ ;\necho “Incremented values : $val , $ref <hr>” ;\n```\n\
    \n![image](Image00088.jpg) After the function block add a statement to call the\
    \ function, passing the variable values as arguments\n\n```php\nmodify ( $a ,\
    \ $b ) ;\n```\n\n![image](Image00089.jpg) Finally, add a statement to display\
    \ the values now stored in each variable\n\n```php\necho “Stored values : $a ,\
    \ $b ” ;\n?>\n```\n\n![image](Image00091.jpg) Save the document in your web server’s\
    \ `/htdocs` directory as `arguments.php` then open the page via HTTP to see the\
    \ argument and variable values\n\n![image](Image00092.jpg)\n\n![image](Image00006.jpg)\n\
    \nThe `int` type description in this example specifies that only integer data\
    \ values can be passed as arguments to the function.\n\n### Varying parameters\n\
    \nDefault argument values can optionally be specified in a function definition\
    \ by assignment to the parameter name, like this:\n\n```php\nfunction function_name\
    \ ( $arg_1 , $arg_2 = “Default String” )\n{\n    statement-to-be-executed ;\n\
    \    statement-to-be-executed ;\n    statement-to-be-executed ;\n}\n```\n\nThis\
    \ allows a function call to be made that specifies either one or two argument\
    \ values. If only one argument is specified, it is assigned to the first parameter\
    \ and the default value is used by the second parameter. Where default values\
    \ are specified for parameters, they must only appear in the parameter list following\
    \ (to the right of) parameters that have no specified default value. Otherwise,\
    \ a call without the correct total number of arguments would cause an error.\n\
    \n![image](Image00019.jpg)\n\nIf multiple default values are specified there is\
    \ currently no way to skip a parameter in a function call, to assign an argument\
    \ value to a particular parameter.\n\nIf you need to create a function that will\
    \ accept an unknown number of arguments, PHP has a special `...` “splat” operator\
    \ for that purpose. This can be used in a function definition like this:\n\n```php\n\
    function function_name ( ...$args )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n}\n```\n\nWhen the `...` splat operator is\
    \ used to prefix a parameter name in a function definition, multiple arguments\
    \ can be passed to that parameter to create an array. The array can be traversed\
    \ like any other array to manipulate the passed in argument values.\n\nAdditionally,\
    \ the `...` splat operator can be used to “unpack” an array specified in a function\
    \ call to pass its element values as individual arguments like this:\n\n```php\n\
    function function_name ( $arg_1 , $arg_2 , $arg_3 )\n{\n    echo $arg_1 + $arg_2\
    \ + $arg_3 ;\n}\n\n$arr = [ 1 , 2 , 3 ] ;\nfunction_name ( ...$arr )      # Outputs\
    \ 6\n```\n\n![image](Image00005.jpg)\n\nThe `...` splat operator is also sometimes\
    \ known as the “scatter” operator.\n\n![image](Image00029.jpg)\n\n`parameters.php`\n\
    \n![image](Image00085.jpg) Begin a PHP script by defining a function that provides\
    \ default string values to its two parameters\n\n```php\n<?php\nfunction drink\
    \ ( string $tmp = ‘hot’ , string $flavor = ‘tea’ )\n{\n    // Statement to be\
    \ inserted here.\n}\n```\n\n![image](Image00086.jpg) Next, insert a statement\
    \ to display its default values\n\n```php\necho “Drinking $tmp $flavor <br>” ;\n\
    ```\n\n![image](Image00087.jpg) After the function block add function calls that\
    \ optionally pass string\n\n```php\ndrink () ;\ndrink ( ‘iced’ ) ;\ndrink ( ‘cold’\
    \ , ‘lemonade’ ) ;\n```\n\n![image](Image00088.jpg) Now, define a function that\
    \ can accept multiple arguments and display their total\n\n```php\nfunction add\
    \ ( ...$numbers )\n{\n    $total = 0 ;\n    foreach(numbers as $num ) {\n    \
    \    $total += $num ;\n    }\n    echo “<hr>Total : $total ” ;\n}\n```\n\n![image](Image00089.jpg)\
    \ Finally, add a statement to call the function in the previous step and pass\
    \ three values\n\n```php\nadd ( 1 , 2 , 3 ) ;\n?>\n```\n\n![image](Image00091.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `parameters.php`\
    \ then open the page via HTTP to see the argument and default values\n\n![image](Image00093.jpg)\n\
    \n![image](Image00005.jpg)\n\nYou can specify regular positional parameters before\
    \ a parameter that accepts multiple arguments with `...`.\n\n### Recognizing scope\n\
    \nWhen creating custom functions it is important to understand how variable accessibility\
    \ is limited by the variable’s scope:\n\n- Variables created outside a function\
    \ have “global” scope, but are not normally accessible from within any function\n\
    - Variables created inside a function have “local” scope so are only accessible\
    \ from within that function block\n\nAs a variable created within a function is\
    \ not accessible from elsewhere, its name may duplicate the name of a variable\
    \ outside a function, or within another function block, without conflict. This\
    \ allows a global variable to contain a different value to a local variable.\n\
    \n![image](Image00019.jpg)\n\nGlobal variables in PHP are not like those in other\
    \ languages such as C, where they are automatically available to functions. In\
    \ PHP, global variables can only be used in functions if explicitly declared inside\
    \ the function using the `global` keyword.\n\nIf you wish to use a global variable\
    \ inside a function, you must first include a statement with the `global` keyword\
    \ to declare that the variable name refers to a global variable, like this:\n\n\
    ```php\nglobal variable_name ;\n```\n\nThe scope of a variable created within\
    \ a function can be altered to make it available globally by preceding its declaration\
    \ with the `global` keyword – but this is bad practice and should be avoided.\n\
    \nFunction statements can call other functions to execute their statements and\
    \ can also call themselves to execute recursively. As with loops, a recursive\
    \ function must alter the state of a tested condition so it will not continue\
    \ forever. This might be a counter value that gets passed in as an argument from\
    \ an initial function call, then gets incremented on successive recursive calls.\
    \ Alternatively, a static local variable could be declared to store an incrementing\
    \ value like this:\n\n```php\nstatic variable_name ;\n```\n"
  trans: "\n\n重要的是要意识到，默认情况下参数数据是“按值传递”（by value）的。这意味着如果函数调用指定了一个变量名，只有该变量内数据的拷贝会被传递给函数。当按值传递时，修改参数不会影响存储在变量中的原始数据。\n\
    \n如果你想让函数修改函数调用中指定的变量中存储的数据，你必须“按引用传递”（by reference）该变量。这允许函数直接在原始数据上进行操作。当按引用传递时，修改参数会影响变量中的原始数据。要确保参数始终通过引用传递给函数，你只需要在函数定义中的参数名前前加上一个\
    \ `&` 符号符号即可。\n\n![image](img/Image00029.jpg)\n\n`arguments.php`\n\n![image](img/Image00085.jpg)\
    \ 开始一个 PHP 脚本，使用一个语句初始化两个具有相同整数值的变量\n\n```php\n<?php\n$a = $b = 5 ;\n```\n\n![image](img/Image00086.jpg)\
    \ 接下来，定义一个接受两个整数参数的函数——一个按值传递，另一个按引用传递\n\n```php\nfunction modify ( int $val ,\
    \ int & $ref )\n{\n    // Statements to be inserted here.\n}\n```\n\n![image](img/Image00087.jpg)\
    \ 现在，插入语句输出传递的值，然后递增这些值并显示修改后的值\n\n```php\necho “Passed values : $val , $ref <br>”\
    \ ;\n$val ++ ;\n$ref ++ ;\necho “Incremented values : $val , $ref <hr>” ;\n```\n\
    \n![image](img/Image00088.jpg) 在函数块之后，添加一个语句调用该函数，并将变量值作为参数传递\n\n```php\nmodify\
    \ ( $a , $b ) ;\n```\n\n![image](img/Image00089.jpg) 最后，添加一个语句显示现在存储在每个变量中的值\n\
    \n```php\necho “Stored values : $a , $b ” ;\n?>\n```\n\n![image](img/Image00091.jpg)\
    \ 将文档保存到网络服务器的 `/htdocs` 目录并命名为 `arguments.php`，然后通过 HTTP 打开页面查看参数和变量值\n\n![image](img/Image00092.jpg)\n\
    \n![image](img/Image00006.jpg)\n\n此示例中的 `int` 类型描述指定只有整数数据值可以作为参数传递给函数。\n\n###\
    \ 变化的参数\n\n在函数定义中，可以通过赋值给参数名来可选地指定默认参数值，如下：\n\n```php\nfunction function_name\
    \ ( $arg_1 , $arg_2 = “Default String” )\n{\n    statement-to-be-executed ;\n\
    \    statement-to-be-executed ;\n    statement-to-be-executed ;\n}\n```\n\n这允许在进行函数调用时指定一个或两个参数值。如果只指定了一个参数，它会被赋值给第一个参数，第二个参数将使用默认值。如果为参数指定了默认值，它们必须仅出现在位于未指定默认值的参数之后（右侧）的参数列表中。否则，不带正确参数总数量的调用将导致错误。\n\
    \n![image](img/Image00019.jpg)\n\n如果指定了多个默认值，目前没有方法在函数调用中跳过某个参数来为特定参数分配参数值。\n\n\
    如果你需要创建一个接受未知数量参数的函数，PHP 有一个特殊的 `...` “拆散”（splat）运算符用于此目的。它可以像这样用在函数定义中：\n\n```php\n\
    function function_name ( ...$args )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n}\n```\n\n当使用 `...` 拆散运算符作为函数定义中的参数名前缀时，可以将多个参数传递给该参数以创建一个数组。该数组像像其他数组一样被遍历，以处理传递的参数值。\n\
    \n此外，`...` 拆散运算符可以用于“解包”函数调用中指定的数组，将其元素值作为单独参数传递，如下：\n\n```php\nfunction function_name\
    \ ( $arg_1 , $arg_2 , $arg_3 )\n{\n    echo $arg_1 + $arg_2 + $arg_3 ;\n}\n\n\
    $arr = [ 1 , 2 , 3 ] ;\nfunction_name ( ...$arr )      # 输出 6\n```\n\n![image](img/Image00005.jpg)\n\
    \n`...` 拆散运算符有时被称为“散列”（scatter）运算符。\n\n![image](img/Image00029.jpg)\n\n`parameters.php`\n\
    \n![image](img/Image00085.jpg) 开始一个 PHP 脚本，定义一个向其两个参数提供默认字符串值的函数\n\n```php\n<?php\n\
    function drink ( string $tmp = ‘hot’ , string $flavor )\n{\n    // Statement be\
    \ inserted here.\n}\n```\n\n![image](img/Image00086.jpg) 接下来，插入一个语句显示其默认值\n\n\
    ```php\necho “Drinking $tmp <br>” ;\n```\n\n![image](img/Image00087.jpg) 在函数块之后添加一个函数调用\n\
    \n```php\ndrink () ;\ndrink ( ‘iced’ ) ;\ndrink ( ‘cold’ , ‘lemonade’ )\n```\n\
    \n![image](img/Image00088.jpg) 现在，定义一个接受多个参数并显示它们总和的函数\n\n```php\nfunction add\
    \ ( ...$numbers )\n{\n    $total = 0 ;\n    foreach(numbers as $num ) {\n    \
    \    $total += $num ;\n    }\n    echo “<hr>Total : $total ” ;\n}\n```\n\n![image](img/Image00089.jpg)\
    \ 最后，添加一个语句调用该函数并传递三个值\n\n```php\nadd ( 1 , 2 , 3 ) ;\n?>\n```\n\n![image](img/Image00091.jpg)\
    \ 将文档保存到网络服务器的 `/htdocs` 目录并命名为 `parameters.php`，然后通过 HTTP 打开页面查看参数和默认值\n\n![image](img/Image00093.jpg)\n\
    \n![image](img/Image00005.jpg)\n\n你可以在接受多个参数的参数之前指定普通的位置参数。\n\n### 识别作用域\n\n创建自定义函数时，了解变量访问范围如何受作用域限制：\n\
    \n- 函数外部创建的变量具有“全局”范围，但通常无法从函数内部访问\n- 函数内部创建的变量具有“局部”范围，因此仅在该函数块内部可见\n\n由于函数内部创建的变量从外部无法访问，它的名称可以与函数外部或另一个函数块内的变量重名而不会冲突。这允许全局变量包含与局部变量不同的值。\n\
    \n![image](img/Image00019.jpg)\n\nPHP 中的全局变量不像 C 等语言，后者它们对函数是自动可用的。在 PHP 中，全局变量只有在函数内部使用\
    \ `global` 关键字显式声明后才能使用。\n\n如果你想在函数内部使用全局变量，必须首先包含一个带有 `global` 关键字的语句来声明该变量名引用全局变量，如下：\n\
    \n```php\nglobal variable_name ;\n```\n\n函数内部创建的变量的作用域可以通过在其声明前加上 `global` 关键字来更改，使其全局可用——但这是一种糟糕的做法，应该被避免。\n\
    \n"
