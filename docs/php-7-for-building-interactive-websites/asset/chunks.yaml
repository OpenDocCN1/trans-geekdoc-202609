- raw: "The MySQL Community Edition is available free at **[mysql.com/downloads/mysql](http://www.mysql.com/downloads/mysql)**\
    \ \n\nThe object returned by a successful call to  **mysqli\\_connect()**  is\
    \ very important as it is used as an argument in other PHP function calls that\
    \ communicate with the MySQL Server. For example, in the above script it must\
    \ be used as the first argument in the call to the  **mysqli\\_set\\_charset()**\
    \  function to identify the connection.\n\n![image](Image00005.jpg)\n\nThis chapter\
    \ assumes the MySQL database server is installed and configured for a user on\
    \ the localhost server, with full privileges to use a database named “website\\\
    _db”. Further instruction and examples can be found in our companion book in this\
    \ series [PHP & MySQL in easy steps](http://ineasysteps.com/products-page/all_books/php-mysql-in-easy-steps/)\
    \ .\n\nWhen the call to the  **mysqli\\_connect()**  function fails, the script\
    \ branches to an alternative that calls the  **die()**  function. This is equivalent\
    \ to calling  **exit()**  to immediately terminate the script. Optionally the\
    \  **die()**  function can accept a string argument that will be printed out as\
    \ the scripts halts. In this case the string message is returned by the  **mysqli\\\
    _connect\\_error()**  function that describes why the connection attempt failed.\n\
    \nAs the connection script contains sensitive user details, it must not be placed\
    \ alongside other PHP scripts in your web server’s  **/ htdocs**  directory. The\
    \  **connect\\_db.php**  script should instead be located in the parent directory\
    \ of  **/htdocs**  , where it is not directly accessible but can be incorporated\
    \ into other PHP scripts by a  **require**  statement, like this:\n\n **<?php**\
    \ \n\n**require ( ‘../connect\\_db.php’ ) ;**\n\n**if ( mysqli\\_ping( $dbc )\
    \ )**\n\n **{** \n\n**echo ‘MySQL Server ‘ . mysqli\\_get\\_server\\_info( $dbc\
    \ ) . ‘ on ‘ . mysqli\\_get\\_host\\_info( $dbc ) ;**\n\n **}** \n\n![image](Image00029.jpg)\n\
    \nrequire.php\n\nThe files in your web server’s directory structure should therefore\
    \ be arranged in the hierarchy depicted below, so when you request the  **require.php**\
    \  script via HTTP, the  **connect\\_db.php**  script gets incorporated from its\
    \ location in the parent directory, and the connection gets made to the MySQL\
    \ Server.\n\n![image](Image00200.jpg)\n\n![image](Image00201.jpg)\n\n![image](Image00006.jpg)\n\
    \nFiles that contain only pure PHP code, like both those listed here, should omit\
    \ the PHP **?>** closing tag at the end of the file. This prevents accidental\
    \ whitespace or new lines after the PHP closing tag, which may cause unwanted\
    \ effects.\n\n![image](Image00019.jpg)\n\nThe connection script **connect\\_db.php**\
    \ must be working successfully to connect to a MySQL database for the examples\
    \ in this chapter.\n\n **Creating a forum** \n\nUser messages can be stored in\
    \ a MySQL database table by a PHP script, so they may be subsequently retrieved\
    \ for display in a forum page containing messages from various registered users.\
    \ Typically a database table containing posted user messages might store the post\
    \ ID, the user’s first name and last name, the subject title, the message itself,\
    \ and the date when posted:\n\n| **Column Name:** || **Content Type:** || **Example:**\
    \ |\n\n| --- | --- | --- |\n\n| **post\\_id** || Number || 123 |\n\n| **first\\\
    _name** || Text || Mike |\n\n| **last\\_name** || Text || McGrath |\n\n| **subject**\
    \ || Text || Ice Cream |\n\n| **message** || Text || Delicious on a hot day. |\n\
    \n| **post\\_date** || Date/Time || 2016-07-24 12:30:00 |\n\n![image](Image00019.jpg)\n\
    \nMySQL database tables can only be created by the root MySQL user or another\
    \ MySQL user that has been granted full access privileges.\n\nA database table\
    \ of this design can be created using the Structured Query Language (SQL). The\
    \ design of this database table simply requires that SQL  **VARCHAR**  or  **TEXT**\
    \  data types should be specified for those columns storing text. Post IDs should\
    \ be positive SQL integer  **INT**  values that the table automatically allocates\
    \ with SQL  **AUTO\\_INCREMENT**  , and the message posted timestamp should be\
    \ stored as an SQL  **DATETIME**  value. All these items will be required to post\
    \ a message to the database table so each column must have an SQL  **NOT NULL**\
    \  rule.\n\n![image](Image00005.jpg)\n\nYou can discover how to fully use the\
    \ Structured Query Language with databases from our companion book in this series\
    \ entitled [SQL in easy steps](http://ineasysteps.com/products-page/all_books/sql-in-easy-steps-3rd-ed/)\
    \ .\n\nThe SQL query command required to produce this design as a MySQL database\
    \ table named “forum” can be issued at the prompt in the MySQL Command Line Client,\
    \ or issued by running a PHP script in the web browser.\n\n![image](Image00029.jpg)\n\
    \ncreate\\_forum.php\n\n![image](Image00067.jpg) Begin a PHP script with a statement\
    \ to connect to a database using the standard connection scripts described on\
    \ the previous page\n\n **<?php** \n\n**require( ‘..\\\\ connect\\_db.php ’ )\
    \ ;**\n\n![image](Image00068.jpg) Next, assign the SQL specifications of the table\
    \ design to a variable\n\n**$sql \\= ‘CREATE TABLE IF NOT EXISTS forum ( ‘ .**\
    \  \n\n**‘post\\_id INT UNSIGNED NOT NULL AUTO\\_INCREMENT ,’ .**  \n\n**‘first\\\
    _name VARCHAR(20) NOT NULL ,’ .**  \n\n**‘last\\_name VARCHAR(40) NOT NULL ,’\
    \ .**  \n\n**‘subject VARCHAR(60) NOT NULL ,’ .**  \n\n**‘message TEXT NOT NULL\
    \ ,’ .**  \n\n**‘post\\_date DATETIME NOT NULL ,’ .**  \n\n**‘PRIMARY KEY ( post\\\
    _id ) ) ‘ ;**\n\n![image](Image00069.jpg) Now, add a test to report whether the\
    \ table was created successfully, or describe the error on failure\n\n**if( mysqli\\\
    _query( $dbc , $sql ) === TRUE )**\n\n **{** \n\n**echo ‘Table “forum” created\
    \ successfully’ ;**\n\n **}** \n\n **else** \n\n **{** \n\n**echo ‘Error creating\
    \ table : ‘ .mysqli\\_error( $dbc ) ;**\n\n **}** \n\n![image](Image00070.jpg)\
    \ Remember to close the database connection when done\n\n**mysqli\\_close( $dbc\
    \ ) ;**\n\n![image](Image00072.jpg) Save the document in your web server’s  **/htdocs**\
    \  directory as  **create\\_forum.php**  then open the page via HTTP to create\
    \ the forum table\n\n![image](Image00202.jpg)\n\n![image](Image00005.jpg)\n\n\
    The SQL **VARCHAR** data type specifies a character length, whereas the **TEXT**\
    \ data type accommodates up to 65,535 characters.\n\n![image](Image00005.jpg)\n\
    \nThe **mysqli\\_query()** function executes the SQL query, whereas the **mysqli\\\
    _error()** function will provide a report if an error occurs.\n\n **Providing\
    \ the page** \n\nA forum page can be created to display previously posted messages\
    \ retrieved from the MySQL ‘forum’ database table, created on the previous page.\
    \ Forum messages can be displayed between the page header and footer, together\
    \ with a hyperlink to another page where the user can post a new forum message.\
    \ If the forum database contains no previously posted content, the script can\
    \ simply advise that there are currently no messages.\n\nThe PHP  **mysqli\\_query()**\
    \  function can make an SQL query to retrieve the database table content, and\
    \ the  **mysqli\\_num\\_rows()**  function can discover how many table rows are\
    \ in the result. When table rows are found in the result, the  **mysqli\\_fetch\\\
    _array()**  function can be used to fetch an associative array of rows and data\
    \ in each column by specifying the result and  **MYSQLI\\_ASSOC**  constant as\
    \ arguments:\n\n![image](Image00029.jpg)\n\nforum.php\n\n![image](Image00067.jpg)\
    \ Begin a PHP script with a statement to set the page title\n\n **<?php** \n\n\
    **$page\\_title \\= ‘PHP Forum’ ;**\n\n![image](Image00068.jpg) Next, add a statement\
    \ to include a page header\n\n**include ( ‘includes/header.html’ ) ;**\n\n![image](Image00069.jpg)\
    \ Add a statement to open the database connection\n\n**require ( ‘..\\\\connect\\\
    _db.php’ ) ;**\n\n![image](Image00070.jpg) Retrieve all messages from the database\
    \ table and assign them to a variable\n\n**$sql \\= ‘SELECT \\* FROM forum’ ;**\n\
    \n**$result \\= mysqli\\_query( $dbc , $sql ) ;**\n\n![image](Image00072.jpg)\
    \ Test whether the database table is empty and display an appropriate advisory\
    \ comment\n\n**if ( mysqli\\_num\\_rows( $result ) > 0 )**\n\n **{** "
