- raw: " ***statement-to-execute-when-false ;  \n\nstatement-to-execute-when-false\
    \ ;  \n\nstatement-to-execute-when-false ;*** \n\n **}** \n\n![image](Image00074.jpg)\n\
    \nAlternative expressions may also be evaluated in a conditional test by adding\
    \ an  **elseif**  statement, specifying statements within braces to be executed\
    \ when the alternative expression is found to be  **TRUE**  . An  **else**  statement\
    \ can be appended here too, to specify statements within braces to be executed\
    \ when the expressions evaluated by the  **if**  and  **elseif**  statements are\
    \ found to be  **FALSE**  , with this syntax:\n\n **if ( *test-expression* )**\
    \ \n\n **{** \n\n ***statement-to-execute-when-true ;  \n\nstatement-to-execute-when-true\
    \ ;  \n\nstatement-to-execute-when-true ;*** \n\n **}** \n\n **elseif ( *test-expression*\
    \ )** \n\n **{** \n\n ***statement-to-execute-when-true ;  \n\nstatement-to-execute-when-true\
    \ ;  \n\nstatement-to-execute-when-true ;*** \n\n **}** \n\n **else** \n\n **{**\
    \ \n\n ***statement-to-execute-when-false ;  \n\nstatement-to-execute-when-false\
    \ ;  \n\nstatement-to-execute-when-false ;*** \n\n **}** \n\nThis is a fundamental\
    \ programming technique that offers the script different directions in which to\
    \ proceed, depending on the result of the evaluations, and is known as “conditional\
    \ branching”.\n\n![image](Image00005.jpg)\n\nThe **elseif** keyword can also be\
    \ written as two separate words: **else if** .\n\n![image](Image00019.jpg)\n\n\
    You may come across some PHP scripts that use a **:** colon character rather than\
    \ curly brackets. This is not recommended as **if** and **else if** will only\
    \ be considered exactly the same when using curly brackets.\n\n![image](Image00029.jpg)\n\
    \nelse.php\n\n![image](Image00067.jpg) Between PHP tags, begin a script with a\
    \ statement that outputs a result only when a tested expression is  **TRUE** \n\
    \n **<?php** \n\n**if ( 4 \\> 2 ) { echo ‘<p>Yes, 4 is greater than 2 <br>’ ;\
    \ }**\n\n![image](Image00068.jpg) Next, add a statement that outputs a result\
    \ only when two tested expressions are both found to be  **TRUE** \n\n**if ( (\
    \ 4 \\> 2 ) && ( 8 \\> 4 ) )**\n\n**{ echo ‘4 is greater than 2 AND 8 is greater\
    \ than 4<br>’ ; }**\n\n![image](Image00069.jpg) Now, add a statement that outputs\
    \ a result when a tested expression is found to be  **TRUE**  or  **FALSE** \n\
    \n**if ( 4 \\> 8 )**\n\n**{ echo ‘4 is greater than 8 <br>’ ; }**\n\n **else**\
    \ \n\n**{ echo ‘4 is less than 8 <br>’ ; }**\n\n![image](Image00070.jpg) Finally,\
    \ add a statement that outputs a result when either of two tested expressions\
    \ are found to be  **TRUE**  or when both tested expressions are found to be \
    \ **FALSE** \n\n**if ( 4 \\> 8 )**\n\n**{ echo ‘This test is True </p>’ ; }**\n\
    \n**elseif ( 8 \\> 4 )**\n\n**{ echo ‘Alternative test is True </p>’ ; }**\n\n\
    \ **else** \n\n**{ echo ‘Both tests are False </p>’ ; }**\n\n **?>** \n\n![image](Image00072.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **else.php**\
    \  then open the page via HTTP to see the results of conditional branching get\
    \ displayed\n\n![image](Image00075.jpg)\n\n![image](Image00006.jpg)\n\nYou can\
    \ nest conditional **if** tests (one inside another) so that statements in the\
    \ inner block only get executed when both tests are found to be **TRUE** .\n\n\
    \ **Switching branches** \n\nConditional branching performed by multiple  **if-elseif-else**\
    \  statements can often be performed more efficiently by a  **switch**  statement\
    \ when the test expression just evaluates one condition.\n\nThe  **switch**  statement\
    \ works in an unusual way. It takes a given value as its parameter argument then\
    \ seeks to match that value from a number of  **case**  statements. Code to be\
    \ executed when a match is found is included in each  **case**  statement.\n\n\
    It is important to end each  **case**  statement with a  **break**  keyword statement,\
    \ so the  **switch**  statement will then exit when a match is found without seeking\
    \ further matches – unless that is the deliberate requirement.\n\nOptionally,\
    \ the list of  **case**  statements can be followed by a single final  **default**\
    \  statement to specify code to be executed in the event that no matches are found\
    \ within any of the  **case**  statements. So the syntax of a switch statement\
    \ typically looks like this:\n\n **switch ( test-value )** \n\n **{** \n\n **case\
    \ match-value : statements-to-execute-when-matched ; break**  ;\n\n **case match-value\
    \ : statements-to-execute-when-matched ; break**  ;\n\n **case match-value : statements-to-execute-when-matched\
    \ ; break**  ;\n\n **default : statements-to-execute-when-no-match-found ;** \n\
    \n **}** \n\n![image](Image00005.jpg)\n\nIt’s always a good idea to include a\
    \ **default** statement – even if it’s only to output an error message when the\
    \ **switch** statement fails.\n\nA  **switch**  statement can have many  **case**\
    \  statements, but no two of its  **case**  statements can attempt to match the\
    \ same value.\n\nWhere a number of match-values are to each execute the same statements,\
    \ only the final  **case**  statement need include the statements to be executed\
    \ and the  **break**  statement to exit the  **switch**  statement block. For\
    \ example, to output the same message for match-values of 0, 1 and 2:\n\n **switch\
    \ ( $number )** \n\n **{** \n\n **case 0 :** \n\n **case 1 :** \n\n **case 2 :\
    \ echo ‘Less than 3’ ; break ;** \n\n **case 3 : echo ‘Exactly 3’ ; break ;**\
    \ \n\n **default : echo ‘Greater than 3 or less than zero’ ;** \n\n **}** \n\n\
    ![image](Image00006.jpg)\n\nA **default** statement need not appear at the end\
    \ of the **switch** block, but it is logical to place it there where it needs\
    \ no **break** statement.\n\n![image](Image00029.jpg)\n\nswitch.php\n\n![image](Image00067.jpg)\
    \ Between PHP tags, begin a script with statements that initialize two variables\
    \ with an integer and character value\n\n **<?php** \n\n**$number \\= 2 ; $letter\
    \ \\= ‘B’ ;**\n\n![image](Image00068.jpg) Next, add a  **switch**  statement to\
    \ match the integer value\n\n**switch ( $number )**\n\n **{** \n\n**case 1 : echo\
    \ ‘Number is One<br>’ ; break ;**\n\n**case 2 : echo ‘Number is Two<br>’ ; break\
    \ ;**\n\n**case 3 : echo ‘Number is Three<br>’ ; break ;**\n\n**default : echo\
    \ ‘Number is Unrecognized<br>’ ;**\n\n **}** \n\n![image](Image00069.jpg) Now,\
    \ add a  **switch**  statement to match the character value\n\n**switch ( $letter\
    \ )**\n\n **{** \n\n**case ‘A’ : echo ‘Letter is A<br>’ ; break ;**\n\n**case\
    \ ‘B’ : echo ‘Letter is B<br>’ ; break ;**\n\n**case ‘C’ : echo ‘Letter is C<br>’\
    \ ; break ;**\n\n**default : echo ‘Letter is Unrecognized<br>’ ;**\n\n **}** \n\
    \n![image](Image00070.jpg) Finally, add a  **switch**  statement to match against\
    \ multiple integer values\n\n**switch ( $number )**\n\n **{** \n\n**case 0 : case\
    \ 1 : case 2 : echo ‘Less than 3<br>’ ; break ;**\n\n**default : echo ‘3 or more,\
    \ or less than zero’ ;**\n\n **}** \n\n **?>** \n\n![image](Image00072.jpg) Save\
    \ the document in your web server’s  **/htdocs**  directory as  **switch.php**\
    \  then open the page via HTTP to see the results of conditional branching get\
    \ displayed\n\n![image](Image00076.jpg)\n\n![image](Image00005.jpg)\n\nIn **switch**\
    \ statements, the **case** keyword, match-value and colon character are regarded\
    \ as a unique “label”.\n\n **Performing loops** \n\nA loop is a piece of code\
    \ in a script that automatically repeats. One complete execution of all statements\
    \ within a loop is called an “iteration”, or a “pass”. The length of a loop is\
    \ controlled by a conditional test made within the loop. While the tested expression\
    \ is found to be  **TRUE**  the loop will continue – until the tested expression\
    \ is found to be  **FALSE**  at which point the loop ends.\n\n![image](Image00077.jpg)\n\
    \nIn PHP there are four types of loop structure:\n\n •   **for**  loop – performs\
    \ a specified number of iterations\n\n •   **while**  loop – performs iterations\
    \ only while a test made at the start of each iteration evaluates as  **TRUE**\
    \ \n\n •   **do while**  loop – performs iterations only while a test made at\
    \ the end of each iteration evaluates as  **TRUE** \n\n •   **foreach**  loop\
    \ – performs iterations to traverse each element of an array, as introduced [here](#text00004.html#sec10)"
  fmt: "\n```php\nstatement-to-execute-when-false ;\nstatement-to-execute-when-false\
    \ ;\nstatement-to-execute-when-false ;\n}\n```\n![image](Image00074.jpg)\n\nAlternative\
    \ expressions may also be evaluated in a conditional test by adding an `elseif`\
    \ statement, specifying statements within braces to be executed when the alternative\
    \ expression is found to be `TRUE`. An `else` statement can be appended here too,\
    \ to specify statements within braces to be executed when the expressions evaluated\
    \ by the `if` and `elseif` statements are found to be `FALSE`, with this syntax:\n\
    \n```php\nif ( test-expression )\n{\n    statement-to-execute-when-true ;\n  \
    \  statement-to-execute-when-true ;\n    statement-to-execute-when-true ;\n}\n\
    elseif ( test-expression )\n{\n    statement-to-execute-when-true ;\n    statement-to-execute-when-true\
    \ ;\n    statement-to-execute-when-true ;\n}\nelse\n{\n    statement-to-execute-when-false\
    \ ;\n    statement-to-execute-when-false ;\n    statement-to-execute-when-false\
    \ ;\n}\n```\n\nThis is a fundamental programming technique that offers the script\
    \ different directions in which to proceed, depending on the result of the evaluations,\
    \ and is known as “conditional branching”.\n\n![image](Image00005.jpg)\n\nThe\
    \ `elseif` keyword can also be written as two separate words: `else if`.\n\n![image](Image00019.jpg)\n\
    \nYou may come across some PHP scripts that use a `:` colon character rather than\
    \ curly brackets. This is not recommended as `if` and `else if` will only be considered\
    \ exactly the same when using curly brackets.\n\n![image](Image00029.jpg)\n\n\
    `else.php`\n\n![image](Image00067.jpg) Between PHP tags, begin a script with a\
    \ statement that outputs a result only when a tested expression is `TRUE`\n\n\
    ```php\n<?php\nif ( 4 > 2 ) { echo ‘<p>Yes, 4 is greater than 2 <br>’ ; }\n```\n\
    ![image](Image00068.jpg) Next, add a statement that outputs a result only when\
    \ two tested expressions are both found to be `TRUE`\n\n```php\nif ( ( 4 > 2 )\
    \ && ( 8 > 4 ) )\n{ echo ‘4 is greater than 2 AND 8 is greater than 4<br>’ ; }\n\
    ```\n![image](Image00069.jpg) Now, add a statement that outputs a result when\
    \ a tested expression is found to be `TRUE` or `FALSE`\n\n```php\nif ( 4 > 8 )\n\
    { echo ‘4 is greater than 8 <br>’ ; }\nelse\n{ echo ‘4 is less than 8 <br>’ ;\
    \ }\n```\n![image](Image00070.jpg) Finally, add a statement that outputs a result\
    \ when either of two tested expressions are found to be `TRUE` or both tested\
    \ expressions are found to be `FALSE`\n\n```php\nif ( 4 > 8 )\n{ echo ‘This test\
    \ is True </p>’ ; }\nelseif ( 8 > 4 )\n{ echo ‘Alternative test is True </p>’\
    \ ; }\nelse\n{ echo ‘Both tests are False </p>’ ; }\n?>\n```\n![image](Image00072.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `else.php` then\
    \ open the page via HTTP to see the results of conditional branching get\n\n![image](Image00075.jpg)\n\
    ![image](Image00006.jpg) You can nest `if` tests (one inside another) so that\
    \ statements in the inner block only get executed when both tests are found to\
    \ be `TRUE`.\n\n## Switching branches\n\nConditional branching performed by multiple\
    \ `if-elseif-else` statements can often be performed more efficiently by a `switch`\
    \ statement when the test expression evaluates one condition. The `switch` statement\
    \ works in an unusual way. It takes a given value as its argument then seeks to\
    \ match that value from a number of `case` statements. Code to be executed when\
    \ a match is found is included in each `case` statement. It is important to end\
    \ each `case` statement with a `break` keyword, so the `switch` statement will\
    \ then exit when a match is found without seeking further matches unless that\
    \ is the deliberate requirement.\n\nOptionally, the list of `case` statements\
    \ can be followed by a single final `default` statement to specify code to be\
    \ executed in the event that no matches are found within any of the `case` statements.\
    \ So the syntax of a switch statement typically looks like this:\n\n```php\nswitch\
    \ ( test-value )\n{\n    case match-value : statements-to-execute-when-matched\
    \ ; break;\n    case match-value : statements-to-execute-when-matched ; break;\n\
    \    case match-value : statements-to-execute-when-matched ; break;\n    default\
    \ : statements-to-execute-when-match-found ;\n}\n```\n![image](Image00005.jpg)\
    \ It’s always a good idea to include a `default` statement – even if it’s only\
    \ to output an error message when the `switch` statement fails. A `switch` statement\
    \ can have many `case` statements, but two of its `case` statements can attempt\
    \ to match the same value. Where a number of match-values are to execute the same\
    \ statements, only the final `case` statement need include the statements to be\
    \ executed and the `break` statement to exit the `switch` statement block. For\
    \ example, to output the same message for match-values of 0, 1 and 2:\n\n```php\n\
    switch ( $number )\n{\n    case 0 :\n    case 1 :\n    case 2 : echo ‘Less than\
    \ 3’ ; break;\n    case 3 : echo ‘Exactly 3’ ; break;\n    default : echo ‘Greater\
    \ than 3 or less than zero’ ;\n}\n```\n![image](Image00006.jpg) A `default` statement\
    \ need not appear at the end of the `switch` block, but it is logical to place\
    \ it there where it needs no `break` statement.\n\n![image](Image00029.jpg)\n\n\
    `switch.php`\n\n![image](Image00067.jpg) Between PHP tags, begin a script with\
    \ statements that initialize two variables with an integer and character value\n\
    \n```php\n<?php\n$number = 2 ; $letter = ‘B’;\n```\n![image](Image00068.jpg) Next,\
    \ add a `switch` statement to match the integer value\n\n```php\nswitch ( $number\
    \ )\n{\n    case 1 : echo ‘Number is One<br>’ ; break;\n    case 2 : echo ‘Number\
    \ is Two<br>’ ; break;\n    case 3 : echo ‘Number is Three<br>’ ; break;\n   \
    \ default : echo ‘Number is Unrecognized<br>’ ;\n}\n```\n![image](Image00069.jpg)\
    \ Now, add a `switch` statement to match the character value\n\n```php\nswitch\
    \ ( $letter )\n{\n    case ‘A’ : echo ‘Letter is A<br>’ ; break;\n    case ‘B’\
    \ : echo ‘Letter is B<br>’ ; break;\n    case ‘C’ : echo ‘Letter is C<br>’ ; break;\n\
    \    default : echo ‘Letter is Unrecognized<br>’ ;\n}\n```\n![image](Image00070.jpg)\
    \ Finally, add a `switch` statement to match against multiple integer values\n\
    \n```php\nswitch ( $number )\n{\n    case 0 : case 1 : case 2 : echo ‘Less than\
    \ 3<br>’ ; break;\n    default : echo ‘3 or more, or less than zero’ ;\n}\n?>\n\
    ```\n![image](Image00072.jpg) Save the document in your web server’s `/htdocs`\
    \ directory as `switch.php` then open the page via HTTP to see the results of\
    \ conditional branching get\n\n![image](Image00076.jpg)\n![image](Image00005.jpg)\
    \ In `switch` statements, the `case` keyword, match-value and colon character\
    \ are regarded as a unique “label”.\n\n## Performing loops\n\nA loop is a piece\
    \ of code in a script that automatically repeats. One complete execution of all\
    \ statements within a loop is called an “iteration”, or a “pass”. The length of\
    \ a loop is controlled by a conditional test made within the loop. While the tested\
    \ expression is found to be `TRUE` the loop will continue – until the tested expression\
    \ is found to be `FALSE` at which point the loop ends.\n\n![image](Image00077.jpg)\n\
    \nIn PHP there are four types of loop structure:\n\n- `for` loop – performs a\
    \ specified number of iterations\n- `while` loop – performs iterations only while\
    \ a test made at the start of each iteration evaluates as `TRUE`\n- `do while`\
    \ loop – performs iterations only while a test made at the end of each iteration\
    \ evaluates as `TRUE`\n- `foreach` loop – performs iterations to traverse each\
    \ element of an array, as introduced [here](#text00004.html#sec10)\n"
  trans: "\n\n```php\nstatement-to-execute-when-false ;\nstatement-to-execute-when-false\
    \ ;\nstatement-to-execute-when-false ;\n}\n```\n![image](img/Image00074.jpg)\n\
    \n通过添加 `elseif` 语句，可以在条件测试中评估备选表达式，并在大括号内指定当发现备选表达式为 `TRUE` 时要执行的语句。此处也可以在此处追加一个\
    \ `else` 语句，以指定当 `if` 和 `elseif` 语句评估的表达式被发现为 `FALSE` 时执行大括号内的语句，语法如下：\n\n```php\n\
    if ( test-expression )\n{\n    statement-to-execute-when-true ;\n    statement-to-execute-when-true\
    \ ;\n    statement-to-execute-when-true ;\n}\nelseif ( test-expression )\n{\n\
    \    statement-to-execute-when-true ;\n    statement-to-execute-when-true ;\n\
    \    statement-to-execute-when-true ;\n}\nelse\n{\n    statement-to-execute-when-false\
    \ ;\n    statement-to-execute-when-false ;\n    statement-to-execute-when-false\
    \ ;\n}\n```\n\n这是一种基础编程技术，它根据评估结果为脚本提供不同的执行方向，被称为“条件分支”。\n\n![image](img/Image00005.jpg)\n\
    \n`elseif` 关键字也可以写成两个独立的单词：`else if`。\n\n![image](img/Image00019.jpg)\n\n你可能会遇到一些使用冒号\
    \ `:` 而不是大大括号的 PHP 脚本。这种做法是不推荐的，因为只有在使用大大括号时，`if` 和 `else if` 才会被视为完全相同。\n\n![image](img/Image00029.jpg)\n\
    \n`else.php`\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，用一个语句开始脚本，该语句仅在测试的表达式为\
    \ `TRUE` 时才输出结果\n\n```php\n<?php\nif ( 4 > 2 ) { echo ‘<p>Yes, 4 is greater than\
    \ 2 <br>’ ; }\n```\n![image](img/Image00068.jpg) 接下来，添加一个语句，仅当两个测试的表达式都被发现为 `TRUE`\
    \ 时才输出结果\n\n```php\nif ( ( 4 > 2 ) && ( 8 > 4 ) )\n{ echo ‘4 is greater than 2\
    \ AND 8 is greater than 4<br>’ ; }\n```\n![image](img/Image00069.jpg) 现在，添加一个语句，当测试的表达式被发现为\
    \ `TRUE` 或 `FALSE` 时输出结果\n\n```php\nif ( 4 > 8 )\n{ echo ‘4 is greater than 8\
    \ <br>’ ; }\nelse\n{ echo ‘4 is less than 8 <br>’ ; }\n```\n![image](img/Image00070.jpg)\
    \ 最后，添加一个语句，当两个测试的表达式中的任意一个被发现为 `TRUE` 或两个测试的表达式都被发现为 `FALSE` 时输出结果\n\n```php\n\
    if ( 4 > 8 )\n{ echo ‘This test is True </p>’ ; }\nelseif ( 8 > 4 )\n{ echo ‘Alternative\
    \ test is True </p>’ ; }\nelse\n{ echo ‘Both tests are False </p>’ ; }\n?>\n```\n\
    ![image](img/Image00072.jpg) 将文档保存到你 Web 服务器的 `/htdocs` 目录并命名为 `else.php`，然后通过\
    \ HTTP 打开页面以查看条件分支的结果\n\n![image](img/Image00075.jpg)\n![image](img/Image00006.jpg)\
    \ 你可以嵌套 `if` 测试（一个嵌套在另一个内部），使得内部块中的语句仅在两个测试都被发现为 `TRUE` 时才被执行。\n\n## 切换分支\n\n\
    当测试表达式评估一个条件时，通过多个 `if-elseif-else` 语句执行的条件分支可以通过 `switch` 语句更高效地完成。`switch` 语句的工作方式不同寻常。它接受一个给定的值作为参数，然后尝试从多个\
    \ `case` 语句中匹配该值。找到匹配项时要执行的代码包含在每个 `case` 语句中。重要的是要用 `break` 关键字结束每个 `case` 语句，这样\
    \ `switch` 语句在找到匹配后就会退出，而不会继续寻找后续匹配，除非这是刻意要求的。\n\n可选情况下，`case` 语句列表后面可以跟一个最终的\
    \ `default` 语句，以指定在任何 `case` 语句中未发现匹配项时执行的代码。因此，`switch` 语句的语法通常如下：\n\n```php\n\
    switch ( test-value )\n{\n    case match-value : statements-to-execute-when-matched\
    \ ; break;\n    case match-value : statements-to-execute-when-matched ; break;\n\
    \    case match-value : statements-to-execute-when-matched ; break;\n    default\
    \ : statements-to-execute-when-match-found ;\n}\n```\n![image](img/Image00005.jpg)\
    \ 包含 `default` 语句始终是一个好主意——即使它只是在 `switch` 语句失败时输出一条错误消息。`switch` 语句可以有很多个 `case`\
    \ 语句，但它的两个 `case` 语句可以尝试匹配相同的值。当多个 `match-values` 需要执行相同的语句时，只需要最后的 `case` 语句包含要执行的语句和\
    \ `break`。例如，当多个 `match-values` 执行相同的语句时，只需要最后的 `case` 语句包含要执行的语句和 `break`。例如，当多个\
    \ `match-values` 执行相同的语句时：\n\n```php\nswitch ( $number )\n{\n    case 0 : case\
    \ 1 : case 2 : echo ‘Less than 3’ ; break;\n    case 3 : echo ‘3’ ; break;\n \
    \   default : echo ‘3 or more’ ;\n}\n```\n![image](img/Image00006.jpg) `default`\
    \ 语句不需要出现在 `switch` 语句的末尾，但逻辑上将其放在那里，且它不需要 `break` 语句。\n\n![image](img/Image00029.jpg)\n\
    \n`switch.php`\n\n在 PHP 标签之间，用一个语句开始脚本，该语句初始化整数和字符值\n\n```php\n<?php\n$number\
    \ = 2 ; $letter = ‘B’;\n```\n![image](img/Image00067.jpg) 接下来，添加一个 `switch` 语句匹配整数值\n\
    \n```php\nswitch ( $number )\n{\n    case 1 : echo ‘Number is One’ ; break;\n\
    \    case 2 : echo ‘Number is Two’ ; break;\n    case 3 : echo ‘Number is Three’\
    \ ; break;\n    default : echo ‘Number is unrecognized’ ;\n}\n```\n![image](img/Image00068.jpg)\
    \ 现在，添加一个 `switch` 语句匹配字符值\n\n```php\nswitch ( $letter )\n{\n    case ‘A’ : echo\
    \ ‘Letter is A’ ; break;\n    case ‘B’ : echo ‘Letter is B’ ; break;\n    case\
    \ ‘C’ : echo ‘Letter is C’ ; break;\n    default : echo ‘Letter is unrecognized’\
    \ ;\n}\n```\n![image](img/Image00069.jpg) 最后，添加一个 `switch` 语句匹配多个整数值\n\n```php\n\
    switch ( $number )\n{\n    case 0 : case 1 : case 2 : echo ‘Less than 3’ ; break;\n\
    \    case 3 : echo ‘3’ ; break;\n    default : echo ‘3 or more’ ;\n}\n```\n![image](img/Image00070.jpg)\
    \ 在 `switch` 语句中，`case` 关键字、match-value 和冒号字符被视为一个独特的“标签”。\n\n![image](img/Image00072.jpg)\
    \ 将文档保存到你 Web 服务器的 `/htdocs` 目录并命名为 `switch.php`，然后通过 HTTP 打开页面以查看条件分支的结果\n\n\
    ![image](img/Image00075.jpg)\n\n## 执行循环\n\n循环是脚本中自动重复的代码段。循环内所有语句的完整执行称为一次“迭代”或“通过”。循环的长度由循环内部的条件测试控制。只要测试表达式被发现为\
    \ `TRUE`，循环就会继续——直到测试表达式被发现为 `FALSE`，此时循环结束。\n\nPHP 中有四种循环结构：\n\n- `for` 循环——执行指定次数的迭代\n\
    - `while` 循环——仅在每次迭代开始的测试评估为 `TRUE` 时执行迭代\n- `do while` 循环——仅在每次迭代结束的测试评估为 `TRUE`\
    \ 时执行迭代\n- `foreach` 循环——遍历数组中的每个元素执行迭代，如此处 所示\n\n"
