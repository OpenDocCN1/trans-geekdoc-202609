- raw: "Once a “filestream” object is created, its contents can be read one character\
    \ at a time by specifying the filestream as an argument to the PHP  **fgetc()**\
    \  function. To read every character this function can be called repeatedly in\
    \ a loop. The  **fgetc()**  function will return false when the end of the file\
    \ is reached and can end the loop:\n\n![image](Image00142.jpg)\n\n![image](Image00019.jpg)\n\
    \nIf you create this text file using Windows’ Notepad app you will see leading\
    \ Byte Order Mark characters in this example. The Notepad++ app shown here does\
    \ not add these.\n\n![image](Image00029.jpg)\n\nreadchars.php\n\n![image](Image00008.jpg)\
    \ Begin a PHP script with statements that attempt to open a plain text file for\
    \ reading, or exit the script upon failure\n\n **<?php** \n\n**$filestream \\\
    = fopen( ‘title.txt’ , ‘r’ )**\n\n **o** r **die( ‘Unable to open file!’ ) ;**\n\
    \n![image](Image00010.jpg) Next, add a loop to read the text file character-by-\
    \ character upon success and display its entire contents\n\n**while( $char \\\
    = fgetc( $filestream ) )**\n\n**{ echo $char . ’ \\* ‘ ; }**\n\n![image](Image00012.jpg)\
    \ Now, remember to close the file stream\n\n**fclose( $filestream ) ;**\n\n![image](Image00014.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **readchars.php**\
    \  , alongside the plain text file to be read, then open the page via HTTP to\
    \ see the file characters\n\n![image](Image00143.jpg)\n\n![image](Image00006.jpg)\n\
    \nThe **fgetc()** function returns false when there are no more characters to\
    \ get from the stream.\n\n **Writing a file** \n\nOnce a “filestream” object has\
    \ been created specifying a write mode, a text file can be created. Text can be\
    \ written into the file by specifying the filestream and a file name to the PHP\
    \  **fwrite()**  function. To format the text, non-printing invisible characters\
    \ can also be written to create line breaks and tab spacing:\n\n| **Character:**\
    \ || **Description:** |\n\n| --- | --- |\n\n| **\\\\n** || Newline Move to a new\
    \ line down |\n\n| **\\\\r** || Carriage return Move to the beginning of the line\
    \ |\n\n| **\\\\t** || Tab Move along the line to the next tab stop |\n\n![image](Image00019.jpg)\n\
    \nStrings containing non-printing characters must be enclosed within double quotes\
    \ so that PHP can interpret them.\n\n![image](Image00029.jpg)\n\nwrite.php\n\n\
    ![image](Image00008.jpg) Begin a PHP script with a statement to assign text, including\
    \ non-printing characters for formatting\n\n **<?php** \n\n**$poem \\= “\\\\r\\\
    \\n\\\\tI never saw a man who looked” ;**\n\n**$poem .= “\\\\r\\\\n\\\\tWith such\
    \ a wistful eye” ;**\n\n**$poem .= “\\\\r\\\\n\\\\tUpon that little tent of blue”\
    \ ;**\n\n**$poem .= “\\\\r\\\\n\\\\tWhich prisoners call the sky” ;**\n\n![image](Image00010.jpg)\
    \ Next, assign a name for the file to be written\n\n**$filename \\= ‘poem.txt’\
    \ ;**\n\n![image](Image00012.jpg) Attempt to create a plain text file for writing,\
    \ or exit the script upon failure\n\n**$filestream \\= fopen( $filename , ‘w’\
    \ )**\n\n **o** r **die( ‘Unable to open file!’ ) ;**\n\n![image](Image00014.jpg)\
    \ Write the file and display a confirmation of how many bytes have been written\
    \ in total\n\n**$num \\= fwrite( $filestream , $poem ) ;**\n\n**if( $num )**\n\
    \n **{** \n\n**echo “ $num bytes written to $filename ” ;**\n\n **}** \n\n![image](Image00015.jpg)\
    \ Now, remember to close the file stream\n\n**fclose( $filestream ) ;**\n\n![image](Image00017.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **write.php**\
    \  then open the page via HTTP to see confirmation that the text file has been\
    \ written\n\n![image](Image00144.jpg)\n\n![image](Image00026.jpg) Use File Explorer\
    \ to navigate to your web server’s  **/htdocs**  directory and see the file created\
    \ by the PHP script\n\n![image](Image00145.jpg)\n\n![image](Image00027.jpg) Open\
    \ the file to see the text written by the PHP script\n\n![image](Image00146.jpg)\n\
    \n![image](Image00005.jpg)\n\nYou can run this example repeatedly and each time\
    \ it will erase the content then write it again.\n\n **Appending text** \n\nOnce\
    \ a “filestream” object has been created specifying an append mode, a text file\
    \ can be opened to add text at its end. Text can be appended to the file by specifying\
    \ the filestream and a file name to the PHP  **fwrite()**  function. The process\
    \ is identical to writing a file, except that the file pointer is positioned at\
    \ the end of existing content before the text is written into the file:\n\n![image](Image00029.jpg)\n\
    \nappend.php\n\n![image](Image00008.jpg) Begin a PHP script with a statement to\
    \ assign text, including non-printing characters for formatting\n\n **<?php**\
    \ \n\n**$info \\= “\\\\r\\\\n\\\\r\\\\n\\\\tThe Ballad of Reading Gaol” ;**\n\n\
    **$info .= “\\\\r\\\\n\\\\t\\\\t\\\\tOscar Wilde 1898” ;**\n\n![image](Image00010.jpg)\
    \ Next, assign a name for the file to be written into\n\n**$filename \\= ‘poem.txt’\
    \ ;**\n\n![image](Image00012.jpg) Attempt to open the plain text file for appending,\
    \ or exit the script upon failure\n\n**$filestream \\= fopen( $filename , ‘a’\
    \ )**\n\n **o** r **die( ‘Unable to open file!’ ) ;**\n\n![image](Image00014.jpg)\
    \ Write the text and display a confirmation of how many bytes have been appended\
    \ in total\n\n**$num \\= fwrite( $filestream , $info ) ;**\n\n**if( $num )**\n\
    \n **{** \n\n**echo “ $num bytes appended to $filename ” ;**\n\n **}** \n\n![image](Image00015.jpg)\
    \ Now, remember to close the file stream\n\n**fclose( $filestream ) ;**\n\n![image](Image00017.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **append.php**\
    \  then open the page via HTTP to see confirmation that the text has been appended\
    \ to the file\n\n![image](Image00147.jpg)\n\n![image](Image00006.jpg)\n\nRemember\
    \ that non- printing characters must be enclosed in double quotes for interpretation.\n\
    \n![image](Image00026.jpg) Navigate to your web server’s  **/htdocs**  directory\
    \ and open the file to see the text appended by the PHP script\n\n![image](Image00148.jpg)\n\
    \n **Overwriting text** \n\nIt is important to recognize that when you write to\
    \ an existing file in write mode it will overwrite any existing content:\n\n![image](Image00029.jpg)\n\
    \noverwrite.php\n\n![image](Image00008.jpg) Begin a PHP script by attempting to\
    \ open an existing text file for writing, or exit the script upon failure\n\n\
    \ **<?php** \n\n**$filestream \\= fopen( ‘poem.txt’ , ‘w’ )**\n\n**or die( ‘Unable\
    \ to open file!’ ) ;**\n\n![image](Image00010.jpg) Upon success, write new text\
    \ into the file\n\n **f** w **rite( $filestream , ‘Overwritten!’ ) ;**\n\n![image](Image00012.jpg)\
    \ Now, remember to close the file stream\n\n**fclose( $filestream ) ;**\n\n![image](Image00014.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **overwrite.php**\
    \  then open the page via HTTP and reopen the text file to see its contents overwritten\n\
    \n![image](Image00149.jpg)\n\n![image](Image00019.jpg)\n\nBe careful when writing\
    \ to files as it is easy to accidentally overwrite.\n\n **Handling errors** \n\
    \nYou can anticipate possible errors and terminate a running script when they\
    \ occur using the  **die()**  function or the  **exit()**  function. Without this\
    \ contingency the default PHP error handler provides a useful, but unsightly message\
    \ when an error occurs. For example,  **fopen( ‘nonsuch.txt’ , ‘r’ )**  to open\
    \ a non-existing file:\n\n![image](Image00150.jpg)\n\n![image](Image00005.jpg)\n\
    \nThe **die()** and **exit()** functions perform identical operations in PHP,\
    \ but their terminology can have different appeals. For some, **die()** possibly\
    \ seems more appropriate to quit when an error is detected, and **exit()** may\
    \ seem more suitable to quit in other scenarios.\n\nIt is not always desirable\
    \ to terminate a script when an error occurs, but you can create a custom error\
    \ handler to provide a more user-friendly message than that provided by the default\
    \ PHP error handler. A custom error handler is simply a function with this syntax:\n\
    \n **function error\\_handler( *level* , *message* , *file* , *line* , *context*\
    \ )** \n\nOnly the first two parameters are required, the rest are optional. The\
    \ first of these is a numerical value, representing a constant, indicating the\
    \ severity of the error that has occurred:"
