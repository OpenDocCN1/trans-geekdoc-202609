  trans: "\n\n类方法的定义也被称为方法的“实现（implementation）”。\n\n![image](img/Image00119.jpg) 同时修改创建“rover”对象的语句——使用构造方法的默认值\n\
    \n```php\n$rover = new Dog ( ) ;\n```\n\n![image](img/Image00121.jpg) 删除调用所有三个对象的\
    \ `setValues` 方法的语句——现在构造方法取代了该方法\n\n![image](img/Image00006.jpg)\n\n虽然成员变量初始值是由构造方法设置的，但可以添加设置方法（setter）来后续更改值——并且这些新值可以通过获取方法（getter）检索。\n\
    \nPHP 提供了几个函数来对类查询，例如 `class_exists($class)`、`method_exists($class, $method)`\
    \ 和 `property_exists($class, $property)`，它们在成功时返回 `TRUE`。你还可以使用 `get_class_vars($class)`\
    \ 和 `get_class_methods($class)` 获取类成员列表，以仅查看“可见”成员：\n\n![image](img/Image00122.jpg)\
    \ 添加语句显示 `Dog` 类中可访问变量的总数\n\n```php\n$items= get_class_vars( 'Dog' ) ;\necho 'Dog\
    \ variables : ' .count($items) ;\n```\n\n![image](img/Image00123.jpg) 添加语句显示 `Dog`\
    \ 类中可访问方法的名称\n\n```php\necho 'Dog methods : ' ;\n$items= get_class_methods( 'Dog'\
    \ ) ;\nforeach($items as $item ) { echo $item ; }\n```\n\n![image](img/Image00124.jpg)\
    \ 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `constructor.php`，然后通过 HTTP 打开页面查看构造方法的输出\n\
    \n![image](img/Image00132.jpg)![image](img/Image00005.jpg) 可见变量的数量为零。临时将它们的访问修符改为\
    \ `public`，看它变为 3——这就是封装的体现。\n\n## 继承属性\n\nPHP 类可以作为一个全新的类来创建（如之前的示例所示），也可以从现有类中“派生（derived）”。重要的是，派生类继承其所派自的父类（基类）的成员——并加上它自身的成员。\n\
    \n![image](img/Image00133.jpg) 继承基类成员的能力允许创建派生类，这些类共享在基类中定义的某些属性。例如，“多边形（Polygon）”基类可以定义所有多边形通用的\
    \ `width（宽度）`和 `height（高度）`属性。“矩形（Rectangle）”和“三角形（Triangle）”类可以从 Polygon 类派生——继承宽度高度属性，并加上定义其独特特征的成员。\n\
    \n![image](img/Image00134.jpg) 继承的优点非常强大，它是面向对象编程（OOP）的第二个原则。派生类的声明在类类名后添加 `extends`\
    \ 关键字，随后是其所派生的类名：\n\n![image](img/Image00029.jpg) inheritance.php\n\n![image](img/Image00114.jpg)\
    \ 通过声明名为“Polygon”的基类开始 PHP 脚本，该类有两个由构造方法初始化的私有变量，并有两个公共的获取方法\n\n```php<?php\n\
    class Polygon\n{\n    private $width , $height ;\n    function __construct( int\
    \ $w= 4 , int $h= 5 )\n    {\n        $this->width = $w ;\n        $this->height\
    \ = $h ;\n    }\n    public function getWidth () { return $this->width ; }\n \
    \   public function getHeight () { return $this->height ; }\n}\n```\n\n![image](img/Image00115.jpg)\
    \ 在 Polygon 类之后，声明一个派自 Polygon 类的“Rectangle”类并添加一个独特方法\n\n```php\nclass Rectangle\
    \ extends Polygon\n{\n    public function area ()\n    {\n        return ( $this->getWidth()\
    \ * $this->getHeight() ) ;\n    }\n}\n```\n\n![image](img/Image00116.jpg) 在 Rectangle\
    \ 类之后，声明一个派自 Polygon 类的“Triangle”类并添加一个独特方法\n\n```php\nclass Triangle extends\
    \ Polygon\n{\n    public function area ()\n    {\n        return ( $this->getWidth()\
    \ * $this->getHeight() / 2 ) ;\n    }\n}\n```\n\n![image](img/Image00117.jpg)\
    \ 在 Triangle 类之后，添加两个语句使用默认值创建每个派生类的实例\n\n```php\n$rect = new Rectangle () ;\n\
    $trio = new Triangle () ;\n```\n\n![image](img/Image00118.jpg) 最后，添加两个语句输出每个派生类独特方法返回的值\n\
    \n```php\necho 'Rectangle Area : ' . $rect->area().'<hr>'\necho 'Triangle Area\
    \ : ' . $trio->area() ;\n?>\n```\n\n![image](img/Image00119.jpg) 将文档保存到服务器的 `htdocs`\
    \ 目录并命名为 `inheritance.php`，然后通过 HTTP 打开页面查看继承的成员\n\n![image](img/Image00135.jpg)![image](img/Image00019.jpg)\
    \ 不要混淆类实例和派生类——实例是类的拷贝，而派生类是继承基类的新类![image](img/Image00006.jpg) 在 PHP 中，派生类总是依赖于单一基类——不支持多继承。\n\
    \n## 拥抱多态\n\n面向对象编程（OOP）的三基石是封装、继承和多态。在之前的页面中我们了如何将数据封装在 PHP 类中，以及派生类如何继承基类的属性，因此现在我们可以探索最后一个基石原则：多态。\n\
    \n![image](img/Image00136.jpg) “多态（polymorphism）”一词（源自希腊，意为“多种形式”）描述了根据上下文赋予实体不同含义或用途的能力。例如，在现实世界中每个人都知道如何使用按钮（实体）——只需施压。然而，按钮的作用取决于它连接了什么（上下文），但结果不会影响按钮的使用方式。在面向对象编程的世界中，多态允许类在共享接口的同时具有不同的功能。接口不需要知道它在使用哪个类，因为它们就像现实世界的按钮一样，使用方式相同，但可以产生不同的结果。以这种方式拥抱多态允许程序员根据需求而非通过条件测试创建可交换的对象。PHP\
    \ 接口与类相似，但使用 `interface` 关键字声明，并且只包含方法定义，不包含任何执行的方法语句，如下：\n\n```php\ninterface\
    \ *InterfaceName*\n{\n    // 仅包含方法定义。\n}\n```\n\n接口声明中的方法定义也可以指定参数。实现接口的每个类必须通过指定其执行语句来实现它定义的所有方法。类通过在其声明中包含\
    \ `implements` 关键字和接口名称来附加接口，如下：\n\n```php\nclass *ClassName* implements *InterfaceName*\n\
    {\n    // 方法实现在此处。\n}\n```\n\n"
