    \n **</html>** \n\n![image](Image00010.jpg) Insert tags into the body section\
    \ to contain PHP code\n\n **<?php** \n\n **?>** \n\n![image](Image00012.jpg) Now,\
    \ insert between the PHP tags a descriptive comment and a line of code to write\
    \ content into the body section\n\n **\\# Write the traditional greeting.** \n\
    \n**echo ‘<h1>Hello World!</h1>’ ;**\n\n![image](Image00031.jpg)\n\n![image](Image00005.jpg)\n\
    \nNotice that the descriptive comment is enclosed between the PHP tags for information\
