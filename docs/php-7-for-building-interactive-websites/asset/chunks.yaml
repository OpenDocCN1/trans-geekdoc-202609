    \ `strstr()`, `stristr()`, `strchr()` and `strrchr()` each return the remainder\
    \ of a searched string on success\n- The substring functions `substr()`, `substr_replace()`\
    \ and `substr_count()` can extract, replace or count occurrences\n- The characters\
    \ in a string can be reversed using `strrev()`, or the string can be repeated\
    \ using `strrpt()` \n- Padding characters can be added to a string using `strpad()`\
    \ and characters can be removed using `trim()`, `ltrim()` or `rtrim()` \n- A string\
    \ can be split into individual parts by specifying a delimiter to the `strtok()`\
    \ function\n- The `date()` function requires a string argument that specifies\
    \ options to determine the format of its returned date string\n- By default the\
    \ PHP date timezone is set to UTC\n- The `date_default_timezone_set()` function\
    \ can be used to specify an alternative to the UTC default timezone\n- The `strtotime()`\
    \ function will attempt to return an appropriate timestamp for whatever date or\
    \ time argument it receives\n- The `htmlentities()` function will encode all string\
    \ characters for which there is an equivalent entity\n- The `htmlspecialchars()`\
    \ function will encode only characters of special HTML significance to avoid recognition\
    \ by a browser\n\n7\n\n## Building classes\n\n*This chapter demonstrates how to\
    \ create and use virtual objects for Object Oriented Programming with PHP.*\n\n\
    - [Encapsulating data](#text00009.html#sec47)\n- [Creating an object](#text00009.html#sec48)\n\
    - [Initializing members](#text00009.html#sec49)\n- [Using constructors](#text00009.html#sec50)\n\
    - [Inheriting properties](#text00009.html#sec51)\n- [Embracing polymorphism](#text00009.html#sec52)\n\
    - [Summary](#text00009.html#sec53)\n\n### Encapsulating data\n\nA class is a data\
    \ structure that can contain both variables and functions in a single entity.\
    \ These are collectively known as its \"members\" – the variables are known as\
    \ \"properties\" and the functions are known as \"methods\".\n\n![image](Image00113.jpg)\n\
    \nAccess to class members from outside the class is controlled by \"access specifiers\"\
    \ in the class declaration. Typically, these will deny access to class variables\
    \ but allow access to methods that can store and retrieve data from those members.\
    \ This technique of \"data hiding\" ensures that stored data is safely encapsulated\
    \ within the class members, and is the first principle of Object Oriented Programming\
    \ (OOP).\n\nA class declaration begins with `class` keyword, followed by a space,\
    \ then programmer-specified name – adhering to the usual naming conventions but\
    \ beginning in uppercase. Next come class property declarations followed by the\
    \ class method declarations. These are like regular variable and function declarations\
    \ but should begin with an access specifier. The class declaration looks like\
    \ this:\n\n```php\nclass ClassName {\n    access-specifier $var1, $var2, $var3;\n\
    \    access-specifier functionName($arg1, $arg2, $arg3) {\n        statements-to-execute\n\
    \    }\n}\n```\n\n![image](Image00005.jpg)\n\nIt is conventional to begin class\
    \ names with an uppercase character and object names with lowercase. An access\
    \ specifier may be any one of the keywords `public`, `private` or `protected`,\
    \ to specify access rights for its members:\n\n- `public` members are accessible\
    \ from any place where the class is visible\n- `private` members are accessible\
    \ only to other members of the same class in which they are defined\n- `protected`\
    \ members are accessible only to other members of the same class and classes derived\
    \ from that class\n\n![image](Image00005.jpg)\n\nDerived classes are introduced\
    \ later in this chapter. Any real-world object can be defined by its attributes\
    \ and by its actions. For example, a dog has attributes such as age, weight and\
    \ color, and actions it can perform such as bark. The class mechanism in PHP provides\
    \ a way to create a virtual dog object within a script, where class properties\
    \ represent its attributes and the class methods represent its actions:\n\n```php\n\
    class Dog {\n    private $age;\n    private $weight;\n    private $color;\n  \
    \  public function bark() { \n        echo 'WOOF!'; \n        // Plus methods\
    \ to store data in the properties.\n        // Plus methods to retrieve data from\
    \ the properties.\n    }\n}\n```\n\n![image](Image00006.jpg)\n\nWhile a PHP script\
    \ class cannot perfectly emulate a real-world object, the aim is to encapsulate\
    \ all relevant attributes and actions as class properties and methods. It is important\
    \ to recognize that a class declaration only defines a data structure – in order\
    \ to create an object you must declare an \"instance\" of that data structure.\
    \ This is achieved by assigning a copy of a class to a variable using the `new`\
    \ keyword, like this:\n\n```php\n$fido = new Dog(); // Creates an instance named\
    \ \"fido\" of the programmer-defined \"Dog\" data structure.\n```\n\nThe instance\
    \ object is a working copy of the original class data structure so retains all\
    \ its features. As the method in the example above has been declared `public`,\
    \ it is visible in the script outside the class declaration. This means the instance’s\
    \ copy of the method can be called using a special `->` object operator, like\
    \ this:\n\n```php\n$fido->bark(); // Outputs WOOF!\n```\n\nThe `->` object operator\
    \ can be used to reference any visible class member, but the variable properties\
    \ in the example above have been declared `private` so are encapsulated in the\
    \ object and are not directly accessible. The principle of encapsulation in PHP\
    \ programming describes the grouping together of data and functionality in class\
    \ members – these are the age, weight, color attributes and bark action in this\
    \ Dog class.\n\n![image](Image00019.jpg)\n\nNotice that you must add parentheses\
    \ after the class name in the statement creating an instance object.\n\n### Creating\
    \ an object\n\nIn order to assign and retrieve data from private members of a\
    \ class, special `public` accessor methods must be added to the class. These are\
    \ \"setter\" methods to assign data, and \"getter\" methods to retrieve data.\
    \ Accessor methods are often named as the variable they address, with the first\
    \ letter made uppercase, and prefixed by \"set\" or \"get\" respectively. For\
    \ example, accessor methods to address an `age` variable may be named `setAge()`\
    \ and `getAge()`.\n\nThe setter and getter methods can reference a member of the\
    \ same class using a special `$this` \"pseudo-variable\", followed by the `->`\
    \ object operator, and the property name. For example, using `$this->age` to reference\
    \ an age property:\n\n![image](Image00029.jpg)\n\nobject.php\n"
  trans: "\n\n![image](img/Image00101.jpg) 保存编辑后的文档并再次通过 HTTP 重新打开页面查看 HTML 代码片段\n\
    \n![image](img/Image00111.jpg)\n\n![image](img/Image00102.jpg) 使用网络浏览器中的**查看源代码**功能查看\
    \ PHP 编码的特殊字符实体等效值\n\n![image](img/Image00112.jpg)\n\n![image](img/Image00005.jpg)\n\
    \nPHP 函数 `html_entity_decode()` 可用于将所有实体还原回原始字符状态。\n\n## 总结\n\n- PHP 内置字符串比较函数\
    \ `strcmp()`、`strncmp()`、`strcasecmp()` 和 `strncasecmp()` 通常各返回 1（大于）、0（相等）或 -1（小于）的结果\n\
    - 字符串比较基于每个字符的数值 ASCII 值，按顺序进行比较以考虑顺序\n- 使用 `ord()` 可以找到任何字符的 ASCII 值\n- 使用 `strlen()`\
    \ 可以找到任何字符串的长度\n- 使用 `strpos()` 和 `strrpos()` 函数可以找到子字符串在搜索字符串中的数字索引位置\n- 搜索函数\
    \ `strstr()`、`stristr()`、`strchr()` 和 `strrchr()` 在成功时各返回搜索字符串的剩余部分\n- 子字符串函数\
    \ `substr()`、`substr_replace()` 和 `substr_count()` 可以提取、替换或计数次数\n- 使用 `strrev()`\
    \ 可以反转字符串中的字符，或使用 `strrpt()` 重复字符串\n- 使用 `strpad()` 可以字符串添加填充字符，使用 `trim()`、`ltrim()`\
    \ 或 `rtrim()` 删除字符\n- 通过向 `strtok()` 函数指定分隔符可以将字符串拆分为各个部分\n- `date()` 函数需要一个字符串参数，用于指定确定返回日期字符串格式的选项\n\
    - 默认情况下，PHP 日区设置为 UTC\n- `date_default_timezone_set()` 函数可用于指定 UTC 默认时区的替代方案\n\
    - `strtotime()` 函数将尝试为其接收到的任何日期或时间参数返回适当的时间戳\n- `htmlentities()` 函数会对所有具有等效实体的字符串字符编码\n\
    - `htmlspecialchars()` 函数将仅对特殊 HTML 意义的字符进行编码，以避免浏览器识别\n\n7\n\n## 构建类\n\n*本章演示了如何为\
    \ PHP 面向对象创建和使用虚拟对象。*\n\n- 封装数据\n- 创建对象\n- 初始化成员\n- 使用构造函数\n- 继承属性\n- 拥抱多态\n-\
    \ 总结\n\n### 封装数据\n\n类是一种数据结构，可以在单个实体中同时包含变量和函数。这些统称为它的“成员”——变量被称为“属性”，函数被称为“方法”。\n\
    \n![image](img/Image00113.jpg)\n\n从类外部对类成员的访问由类声明中的“访问修饰符”控制。通常，这些修饰符会拒绝访问类变量，但允许访问可以从这些成员中存储和检索数据的方法。这种“数据隐藏”技术确保了存储的数据安全地封装在类成员内部，它是面向对象编程（OOP）的第一条原则。\n\
    \n类声明以 `class` 关键字开头，后跟一个空格，然后是程序员指定的名称——遵循通常的命名规范但以大写开头。接下来是类属性声明，然后是类方法声明。这些类似于普通的变量和函数声明，但应该以访问修饰符开头。类声明如下：\n\
    \n```php\nclass ClassName {\n    access-specifier $var1, $var2, $var3;\n    access-specifier\
    \ functionName($arg1, $arg2, $arg3) {\n        statements-to-execute\n    }\n\
    }\n```\n\n![image](img/Image00005.jpg)\n\n习惯上是类名以大写字母开头，对象名以小写字母开头。访问修饰符可以是 `public`、`private`\
    \ 或 `protected` 关键字任意一个，用于指定其成员的访问权限：\n\n- `public` 成员可以在类可见的任何地方访问\n- `private`\
    \ 成员仅供其定义的同类其他成员访问\n- `protected` 成员仅供同类其他成员访问以及派自该类的类访问\n\n![image](img/Image00005.jpg)\n\
    \n派生类在本章后面介绍。任何现实世界对象都可以通过其属性和动作定义。例如，狗有诸如 age（年龄）之类的属性，也有 bark（叫）等动作。狗具有 age、color\
    \ 等属性，以及可以执行的动作。PHP 中的类机制提供了一种创建属性的方式：\n\n```php\nclass Dog {\n    private $age;\n\
    \    private $weight;\n    private $color;\n    public function bark() { \n  \
    \      echo 'WOOF!'; \n        // 在属性中存储数据。\n        // 从属性中检索数据。\n    }\n}\n\
    ```\n\n![image](img/Image00006.jpg)\n\n虽然 PHP 脚本无法完美模拟现实世界对象，但目标是将相关的属性和动作作为属性和方法进行封装。要重要的是，类声明仅定义数据结构——为了创建对象，必须声明该数据结构的“实例”。通过使用\
    \ `new` 关键字将类的副本赋值给变量来实现：\n\n```php\n$fido = new Dog(); // 创建一个名为 fido 的 Dog 数据结构实例。\n\
    ```\n\n实例对象是原始类的运行副本，因此保留了所有特性。由于示例中的方法已声明为 `public`，它在类外部脚本中是可见的。这意味着可以使用特殊的\
    \ `->` 对象运算符调用实例的方法：\n\n```php\n$fido->bark(); // 输出 WOOF!\n```\n\n`->` 对象运算符可以引用任何可见的类成员，但示例中的变量属性已声明为\
    \ `private`，因此封装在对象内部且无法直接访问。PHP 编程中的封装原则描述了将数据和功能组合在类成员中——这些是 Dog 类中的 age、weight、color\
    \ 属性和 bark 动作。\n\n[/content]\n\n### 创建对象\n\n注意在创建实例对象的语句中，类名后必须添加括号。\n\n为了对类的私有成员分配和检索数据，必须在类中添加特殊的\
    \ `public` 访问方法。这些是用于分配数据的 setter（设置）和用于检索数据的 getter（获取）。访问方法通常以它们处理的变量命名，并将首字母大写，并分别加上\
    \ \"set\" 或 \"get\" 前缀。例如，处理 `age` 变量的访问方法可以命名为 `setAge()` 和 `getAge()`。\n\nsetter\
    \ 和 getter 方法可以使用特殊的 `$this` “伪变量”、后跟 `->` 对象运算符和属性名来引用同类的成员。例如，使用 `$this->age`\
    \ 引用 age 属性：\n\n![image](img/Image00029.jpg)\n\nobject.php"
