  fmt: "\nPerhaps the most interesting loop structure is the `for` loop, which typically\
    \ has this syntax:\n\n```\nfor ( initializer ; test-expression ; updater )\n{\n\
    \    statement-to-execute-when-true ;\n    statement-to-execute-when-true ;\n\
    \    statement-to-execute-when-true ;\n}\n```\n\nThe `initializer` is used to\
    \ set a starting value for a counter of the number of iterations made by the loop.\
    \ An integer variable is used for this purpose and is traditionally named “i”.\n\
    \nUpon each iteration of the loop, the `test-expression` is evaluated and that\
    \ iteration will only continue while this expression is `TRUE`. When the `test-expression`\
    \ becomes `FALSE`, the loop ends immediately without executing the statements\
    \ again. With every iteration the counter is updated then the statements executed.\n\
    \n![image](Image00005.jpg)\n\nThe `updater` may be an incrementer, or it may be\
    \ a decrementer in a loop that counts down rather than counting up.\n\nLoops can\
    \ be nested, one within another, to allow complete execution of all iterations\
    \ of an inner nested loop on each iteration of the outer loop.\n\n![image](Image00029.jpg)\n\
    \nforloop.php\n\n![image](Image00067.jpg) Between PHP tags, create a script with\
    \ a `for` loop to output the loop counter value on each of three iterations\n\n\
    ```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n{\n    echo “<dt>Outer loop iteration\
    \ $i ” ;\n    # Nested loop to be inserted here.\n}\n?>\n```\n\n![image](Image00068.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `forloop.php`\
    \ then open the page via HTTP to see the loop counter values get displayed\n\n\
    ![image](Image00069.jpg) Now, insert a nested `for` loop to output its loop counter\
    \ value in a list on each of three iterations\n\n```php\nfor ( $j = 1 ; $j < 4\
    \ ; $j ++ )\n{\n    echo “<dd>Inner loop iteration $j ” ;\n}\n```\n\n![image](Image00070.jpg)\
    \ Save the document once more then open the page via HTTP to see both loop counter\
    \ values get displayed\n\n![image](Image00078.jpg)\n\n![image](Image00006.jpg)\n\
    \nA `for` loop counter can also count down – by decrementing the counter value\
    \ on each iteration using `$i--` in place of `$i++`.\n\n### Looping while true\n\
    \nA `while` loop is an alternative to the `for` loop described in the previous\
    \ example. The `while` loop also requires an initializer, test-expression, and\
    \ an updater, but these are not neatly listed within a single pair of parentheses\
    \ as they are in a `for` loop. Instead the initializer must appear before the\
    \ start of the loop block, and the `test-expression` must appear within parentheses\
    \ after the `while` keyword, followed by braces containing both an updater and\
    \ the statements to be executed on each iteration.\n\n```\ninitializer\nwhile\
    \ ( test-expression )\n{\n    statement/s-to-be-executed ;\n    updater ;\n}\n\
    ```\n\n![image](Image00019.jpg)\n\nEnsure that the test expression in a loop structure\
    \ will at some point become `FALSE` to avoid creating an infinite loop that never\
    \ ends.\n\nA `do while` loop provides a subtle variation on the syntax above by\
    \ placing the `do` keyword before the loop block and moving the `while` statement\
    \ to after the loop block:\n\n```\ninitializer\ndo {\n    statement/s-to-be-executed\
    \ ;\n    updater ;\n}\nwhile ( test-expression ) ;\n```\n\nBoth `while` loops\
    \ and `do while` loops will proceed to make iterations until the `test-expression`\
    \ is found to be `FALSE`, at which point the loop will exit. It is therefore essential\
    \ that the loop body contains code that will, at some point change the result\
    \ of the `test-expression` evaluation – otherwise an infinite loop is created\
    \ which will lock the system. The significant difference between a `while` loop\
    \ and a `do while` loop is that a `while` loop will not make a single iteration\
    \ if the `test-expression` is `FALSE` on its first evaluation. In contrast, a\
    \ `do while` loop will always make at least one iteration because its statements\
    \ are executed before the evaluation is made. If this is desirable a `do while`\
    \ loop is obviously the best choice, otherwise the choice between a `for` loop\
    \ and a `while` loop is largely a matter of personal preference. One rule of thumb\
    \ suggests that a `for` loop is best used to perform a specific number of iterations,\
    \ whereas a `while` loop is best used to iterate until a certain condition is\
    \ met. Loops are the perfect partner to use with arrays as each iteration can\
    \ effortlessly read or write into successive array elements.\n\n![image](Image00005.jpg)\n\
    \nYou will discover later in this book how a PHP `while` loop is used to retrieve\
    \ records from a MySQL database.\n\n![image](Image00029.jpg)\n\nwhileloop.php\n\
    \n![image](Image00067.jpg) Between PHP tags, begin a script with a `while` loop\
    \ to create an array\n\n```php\n<?php\n$numbers = array(10, 20, 30);\n$i = 0;\n\
    while ( $i < 3 )\n{\n    echo “<dt>While Loop” ;\n    $i++;\n}\n$i = 0;\ndo {\n\
    \    echo “<dt>Do While Loop” ;\n    $i++;\n} while ( $i < 3 );\n?>\n```\n\n![image](Image00068.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `whileloop.php`\
    \ then open the page via HTTP to see the array values get displayed\n\n![image](Image00069.jpg)\
    \ Next, add a nested `while` loop to output the value of each element\n\n```php\n\
    <?php\n$numbers = array(10, 20, 30);\n$i = 0;\nwhile ( $i < 3 )\n{\n    echo “<dt>While\
    \ Loop” ;\n    $j = 0;\n    while ( $j < 3 )\n    {\n        echo “<dd>Inner Loop”\
    \ ;\n        $j++;\n    }\n    $i++;\n}\n$i = 0;\ndo {\n    echo “<dt>Do While\
    \ Loop” ;\n    $j = 0;\n    while ( $j < 3 )\n    {\n        echo “<dd>Inner Loop”\
    \ ;\n        $j++;\n    }\n    $i++;\n} while ( $i < 3 );\n?>\n```\n\n![image](Image00070.jpg)\
    \ Save the document once more then open the page via HTTP to see both loop counter\
    \ values get displayed\n\n![image](Image00078.jpg)\n\n![image](Image00006.jpg)\n\
    \n### Breaking from loops\n\nThe `break` keyword can be used to prematurely terminate\
    \ a loop when a specified condition is met. The `break` statement is situated\
    \ inside the loop block and is preceded by a test expression. When the test returns\
    \ `TRUE`, the loop ends immediately and the program proceeds to the next task.\
    \ For example, in a nested loop it proceeds to the next iteration of the outer\
    \ loop.\n\n![image](Image00029.jpg)\n\nbreakcontinue.php\n\n![image](Image00067.jpg)\
    \ Between PHP tags, begin a script with a `for` loop that performs three iterations\n\
    \n```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n{\n    # Nested loop to be inserted\
    \ here.\n}\n?>\n```\n\n![image](Image00068.jpg) Next, insert a nested `for` loop\
    \ that also performs three iterations\n\n```php\nfor ( $j = 1 ; $j < 4 ; $j ++\
    \ )\n{\n    # Statements to be inserted here.\n}\n```\n\n![image](Image00069.jpg)\
    \ Now, insert a statement that outputs the value of both loop counters on each\
    \ iteration\n\n```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n{\n    echo “<dt>Outer\
    \ loop iteration $i ” ;\n    for ( $j = 1 ; $j < 4 ; $j ++ )\n    {\n        echo\
    \ “<dd>Inner loop iteration $j ” ;\n    }\n}\n?>\n```\n\n![image](Image00070.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `breakcontinue.php`\
    \ then open the page via HTTP to see both loop counter values get displayed\n\n\
    ![image](Image00078.jpg) Next, insert this `break` statement at the very beginning\
    \ of the inner loop block, to break out of the inner loop – then save the document\
    \ and view the change\n\n```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n{\n \
    \   for ( $j = 1 ; $j < 4 ; $j ++ )\n    {\n        if ( $i == 2 && $j == 1 )\n\
    \        {\n            echo “Breaks inner loop when i = $i and j = $j <br>” ;\n\
    \            break ;\n        }\n    }\n}\n?>\n```\n\n![image](Image00080.jpg)\n\
    \nHere, the `break` statement halts all three iterations of the inner loop when\
    \ the outer loop tries to run it the second time.\n\nThe `continue` keyword can\
    \ be used to skip a single iteration of a loop when a specified condition is met.\
    \ The `continue` statement is situated inside the loop block and is preceded by\
    \ a test expression. When the test returns `TRUE` that single iteration ends.\n"
  trans: "\n\n也许最有趣的循环结构是 `for` 循环，它通常具有以下语法：\n\n```\nfor ( initializer ; test-expression\
    \ ; updater )\n{\n    statement-to-execute-when-true ;\n    statement-to-execute-when-true\
    \ ;\n    statement-to-execute-when-true ;\n}\n```\n\n`initializer`（初始化器）用于为循环次数计数器设置起始值。为此通常使用整数变量，并传统命名为“i”。\n\
    \n在循环的每次迭代中，都会评估 `test-expression`（测试表达式），只有当该表达式为 `TRUE` 时，迭代才会继续。当 `test-expression`\
    \ 变为 `FALSE` 时，循环将立即结束，不再再次执行语句。在每次迭代中，计数器都会先更新，然后执行语句。\n\n![image](img/Image00005.jpg)\n\
    \n`updater`（更新器）可以是一个递增器，也可以是递减循环中的递减器。\n\n循环可以嵌套，即在一个循环内部另一个循环，以便在外层循环的每次迭代中，完整执行内部嵌套循环的所有迭代。\n\
    \n![image](img/Image00029.jpg)\n\nforloop.php\n\n![image](img/Image00067.jpg)\
    \ 在 PHP 标签之间，创建一个带有 `for` 循环的脚本，在三次迭代中的每次迭代输出循环计数器值\n\n```php\n<?php\nfor ( $i\
    \ = 1 ; $i < 4 ; $i ++ )\n{\n    echo “<dt>Outer loop iteration $i ” ;\n    #\
    \ 在此处插入嵌套循环。\n}\n?>\n```\n\n![image](img/Image00068.jpg) 将文档保存到 Web 服务器的 `/htdocs`\
    \ 目录中并命名为 `forloop.php`，然后通过 HTTP 打开页面以查看循环计数器值的显示\n\n![image](img/Image00069.jpg)\
    \ 现在，插入一个嵌套的 `for` 循环，在三次迭代中的每次迭代中在列表中输出其循环计数器值\n\n```php\nfor ( $j = 1 ; $j <\
    \ 4 ; $j ++ )\n{\n    echo “<dd>Inner loop iteration $j ” ;\n}\n```\n\n![image](img/Image00070.jpg)\
    \ 再次保存文档，然后通过 HTTP 打开页面以查看两个循环计数器值的显示\n\n![image](img/Image00078.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n`for` 循环计数器也可以进行递减——通过在每次迭代中使用 `$i--` 代替 `$i++` 来减少计数器值。\n\n### 在真时循环\n\n`while`\
    \ 循环是上例中 `for` 循环的替代方案。`while` 循环也需要初始化器、测试表达式和更新器，但它们不像 `for` 循环那样整齐地列在单对括号内。相反，初始化器必须出现在循环块开始之前，`test-expression`\
    \ 必须出现在 `while` 关键字后的括号内，随后跟着一个包含更新器和每次迭代中要执行的语句的大括号。\n\n```\ninitializer\nwhile\
    \ ( test-expression )\n{\n    statement/s-to-be-executed ;\n    updater ;\n}\n\
    ```\n\n![image](img/Image00019.jpg)\n\n确保循环结构中的测试表达式会在某处变为 `FALSE`，以避免创建永远不会结束的死循环。\n\
    \n`do while` 循环通过将 `do` 关键字放在循环块之前并将 `while` 语句移动到循环块之后，对上述语法进行了细微变动：\n\n```\n\
    initializer\ndo {\n    statement/s-to-be-executed ;\n    updater ;\n}\nwhile (\
    \ test-expression ) ;\n```\n\n`while` 循环和 `do while` 循环都会继续迭代，直到发现 `test-expression`\
    \ 为 `FALSE` 为止，此时循环将退出。因此，确保循环体中包含会在某处改变 `test-expression` 评估结果的代码是至关重要的——否则将创建一个导致系统锁死循环。`while`\
    \ 循环和 `do while` 循环之间的显著区别在于，如果 `test-expression` 在第一次评估时为 `FALSE`，则 `while` 循环不会执行任何迭代。相比之下，`do\
    \ while` 循环将至少执行一次迭代，因为它的语句是在进行评估之前执行的。如果这是你需要的，那么 `do while` 循环显然是最佳选择，否则在 `for`\
    \ 循环和 `while` 循环之间进行选择很大程度上取决于个人喜好。一个经验法是 `for` 循环最适合执行特定次数的迭代，而 `while` 循环最适合迭代到满足特定条件。循环是与数组使用的完美搭档，因为每次迭代都可以轻松地读取或写入连续的数组元素。\n\
    \n![image](img/Image00005.jpg)\n\n你将在本书的后续部分发现如何使用 PHP `while` 循环从 MySQL 数据库检索记录。\n\
    \n![image](img/Image00029.jpg)\n\nwhileloop.php\n\n![image](img/Image00067.jpg)\
    \ 在 PHP 标签之间，开始一个带有 `while` 循环的脚本创建一个数组\n\n```php\n<?php\n$numbers = array(10,\
    \ 20, 30);\n$i = 0;\nwhile ( $i < 3 )\n{\n    echo “<dt>While Loop” ;\n    $i++;\n\
    }\n$i = 0;\ndo {\n    echo “<dt>Do While Loop” ;\n    $i++;\n} while ( $i < 3\
    \ );\n?>\n```\n\n![image](img/Image00068.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录中并命名为\
    \ `whileloop.php`，然后通过 HTTP 打开页面以查看数组值的显示\n\n![image](img/Image00069.jpg) 接下来，添加一个嵌套的\
    \ `while` 循环输出每个元素的值\n\n```php\n<?php\n$numbers = array(10, 20, 30);\n$i = 0;\n\
    while ( $i < 3 )\n{\n    echo “<dt>While Loop” ;\n    $j = 0;\n    while ( $j\
    \ < 3 )\n    {\n        echo “<dd>Inner Loop” ;\n        $j++;\n    }\n    $i++;\n\
    }\n$i = 0;\ndo {\n    echo “<dt>Do While Loop” ;\n    $j = 0;\n    while ( $j\
    \ < 3 )\n    {\n        echo “<dd>Inner Loop” ;\n        $j++;\n    }\n    $i++;\n\
    } while ( $i < 3 );\n?>\n```\n\n![image](img/Image00070.jpg) 再次保存文档，然后通过 HTTP\
    \ 打开页面以查看两个循环计数器值的显示\n\n![image](img/Image00078.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n### 跳出循环\n\n`break` 关键字可在满足指定条件时提前终止循环。`break` 语句位于循环块内部，其前面有一个测试表达式。当测试返回 `TRUE`\
    \ 时，循环立即结束，程序继续执行下一个任务。例如，在嵌套循环中，它进入外层循环的下一次迭代。\n\n![image](img/Image00029.jpg)\n\
    \nbreakcontinue.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，开始一个执行三次迭代的 `for`\
    \ 循环脚本\n\n```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n{\n    # 在此处插入嵌套循环。\n\
    }\n?>\n```\n\n![image](img/Image00068.jpg) 接下来，插入一个同样执行三次迭代的嵌套 `for` 循环\n\n```php\n\
    for ( $j = 1 ; $j < 4 ; $j ++ )\n{\n    # 在此处插入语句。\n}\n```\n\n![image](img/Image00069.jpg)\
    \ 现在，插入一个在每次迭代中输出两个计数器值的语句\n\n```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n\
    {\n    echo “<dt>Outer loop iteration $i ” ;\n    for ( $j = 1 ; $j < 4 ; $j ++\
    \ )\n    {\n        echo “<dd>Inner loop iteration $j ” ;\n    }\n}\n?>\n```\n\
    \n![image](img/Image00070.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录中并命名为 `breakcontinue.php`，然后通过\
    \ HTTP 打开页面以查看两个计数器值的显示\n\n![image](img/Image00078.jpg) 接下来，在内部循环块的最开始插入此 `break`\
    \ 语句以跳出内部循环——然后保存文档并查看变化\n\n```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n{\n\
    \    for ( $j = 1 ; $j < 4 ; $j ++ )\n    {\n        if ( $i == 2 && $j == 1 )\n\
    \        {\n            echo “Breaks inner loop when i = $i and j = $j <br>” ;\n\
    \            break ;\n        }\n    }\n}\n?>\n```\n\n![image](img/Image00080.jpg)\n\
    \n在这里，当外层循环尝试第二次运行内部循环时，`break` 语句会停止内部循环的所有迭代。\n\n`continue` 关键字用于在满足指定条件时跳过循环的单次迭代。\n\
    \n"
