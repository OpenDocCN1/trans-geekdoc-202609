    \ ) ;\n```\n![image](Image00069.jpg) Now, add a statement to display the form\n\
    \n```html\n<form action=” process.php ”\nmethod=” POST ” accept-charset=”utf-8”>\n\
    First Name : <input name=” first_name ” type=”text”>\nLast Name : <input name=”\
    \ last_name ” type=”text”>\nSubject :<br>\n<input name=” subject ” type=”text”\
    \ size=”64”>\nMessage :<br>\n<textarea name=” message ” rows=”5” cols=”50”></textarea>\n\
    <p><input type=”submit” value=”Submit”></p>\n</form>\n```\n![image](Image00070.jpg)\
    \ Next, add a statement to create a hyperlink to the Forum page\n\n```php\necho\
    \ ‘<p>\n<a href=”forum.php”>Forum</a></p> ;\n```\n![image](Image00072.jpg) Add\
    \ a final statement to include a page footer\n\n```php\ninclude ( ‘includes/footer.html’\
    \ ) ;\n?>\n```\n`post.php`\n\nSave this script in your web server’s `/htdocs`\
    \ directory as `post.php` then follow the hyperlink on the Forum page to see this\
    \ message page ![image](Image00005.jpg) Notice that the form `action` attribute\
    \ nominates a submission handler named `process.php` – this is listed [here](#text00013.html).\n\
    \n![image](Image00208.jpg) ![image](Image00209.jpg) In practice, users of a forum\
    \ may have first registered their names. In that case, those names could also\
    \ be stored in a database table for recall later – usernames will be submitted\
    \ by the HTML form, for simplicity. ![image](Image00006.jpg) The Post Message\
    \ page provides a hyperlink back to the Forum page, should the user wish to return\
    \ there.\n\n### Processing messages\n\nHaving completed the PHP script to supply\
    \ a form to post new messages, described on the previous pages, you can now create\
    \ a PHP script to process the submitted messages. The script to process the HTML\
    \ form can ensure that all form fields are empty for simple validation. The `trim()`\
    \ function can be used to strip whitespace and the `empty()` function can be used\
    \ to test for empty string submissions. Once the form input is found to be valid,\
    \ the script can then store the submitted message in the “forum” database table.\
    \ If the attempt to post the message succeeds the forum page can be loaded to\
    \ display the messages, or upon failure an error message can be displayed:\n\n\
    ![image](Image00029.jpg) `process.php` Begin a PHP script with a statement to\
    \ set the page title\n\n```php\n<?php\n$page_title= ‘PHP Process Error’ ;\n```\n\
    ![image](Image00068.jpg) Next, add a statement to include a page header\n\n```php\n\
    include ( ‘includes/header.html’ ) ;\n```\n![image](Image00069.jpg) Now, add an\
    \ exit function to display a notification and a link to return to the post page\
    \ if validation fails\n\n```php\nfunction fail( $str )\n{\necho “<p>Please enter\
    \ a $str .</p>” ;\necho ‘<p><a hrefpost.php”>Post Message</a>’ ;\ninclude ( ‘includes/footer.html’\
    \ ) ;\nexit() ;\n}\n```\n![image](Image00070.jpg) Add a test to ensure the form\
    \ has been submitted\n\n```php\nif( isset( $_POST['message'] ) )\n{\n// Statements\
    \ to be inserted here (step 5).\n// Statements to be inserted here (step 6).\n\
    // Statements to be inserted here (step 7).\n}\n```\n![image](Image00006.jpg)\
    \ This script is nominated by the form in `post.php` to process its submitted\
    \ user messages. The form is not “sticky” though – so any entered field data is\
    \ not retained if the user must return to the form to complete an empty input\
    \ field.\n\n![image](Image00072.jpg) Insert tests to ensure the user has filled\
    \ in all form fields\n\n```php\nif ( !empty( trim( $_POST['first_name'] ) ) )\n\
    { $first_name = addslashes( $_POST['first_name'] ) ; }\nelse { fail( ‘First Name’\
    \ ); }\nif ( !empty( trim( $_POST['last_name'] ) ) )\n{ $last_name = addslashes(\
    \ $_POST['last_name'] ) ; }\nelse { fail( ‘Last Name’ ); }\nif ( !empty( trim(\
    \ $_POST['subject'] ) ) )\n{ $subject = addslashes( $_POST['subject'] ) ; }\n\
    else { fail( ‘Subject’ ); }\nif ( !empty( trim( $_POST['message'] ) ) )\n{ $message\
    \ = addslashes( $_POST['message'] ) ; }\nelse { fail( ‘Message’ ); }\n```\n![image](Image00082.jpg)\
    \ When validation succeeds, open the database connection\n\n```php\nrequire (\
    \ '../connect_db.php’ ) ;\n```\n![image](Image00203.jpg) Now, insert statements\
    \ to add the submitted form field values into the “forum” database table\n\n```php\n\
    $sql = “INSERT INTO forum\n( first_name, last_name, subject, message, post_date\
    \ )\nVALUES('$first_name’, ‘$last_name’, ‘$subject’, ‘$message’, NOW())” ;\n$result\
    \ = mysqli_query ( $dbc , $sql ) ;\n```\n![image](Image00204.jpg) Finally, insert\
    \ a statement to report a failure error or relocate the browser to the forum page\
    \ on success\n\n```php\nif ( mysqli_affected_rows( $dbc ) != 1 )\n{\necho ‘<p>Error</p>’\
    \ .mysqli_error( $dbc ) ;\nmysqli_close( $dbc ) ;\n}\nelse\n{\nmysqli_close( $dbc\
    \ ) ;\nheader( ‘Location: forum.php ’ ) ;\n}\n```\n"
