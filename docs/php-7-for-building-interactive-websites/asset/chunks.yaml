    \nImportantly, the title of a web page incorporating multiple files can be dynamically\
    \ written by PHP to allow maximum flexibility of otherwise static HTML header\
    \ content:\n\n![image](Image00174.jpg)\n\nheader.html\n\n![image](Image00036.jpg)\
    \ Create an HTML document containing static header content and a PHP snippet to\
    \ write the page title\n\n```html\n<!DOCTYPE HTML>\n<html lang=”en”>\n<head>\n\
    <meta charset=”UTF-8”>\n<title> <?php echo $page_title ; ?> </title>\n<link rel=”stylesheet”\
    \ href=”includes/style.css”>\n</head>\n<body>\n    <header><h1>Page Header</h1></header>\n\
    ```\n\n![image](Image00174.jpg)\n\nfooter.html\n\n![image](Image00037.jpg) Now,\
    \ create an HTML document containing footer content\n\n```html\n<footer><p>Page\
    \ Footer</p></footer>\n</body>\n</html>\n```\n\n![image](Image00038.jpg) Next,\
    \ create a folder named “includes” in the `/htdocs` directory of your web server\
    \ and save inside it the above documents as `header.html` and `footer.html` respectively\n\
    \n![image](Image00175.jpg)\n\nstyle.css\n\n![image](Image00039.jpg) Create a CSS\
    \ style sheet to present the header and footer content (and rules to present aspects\
    \ of later examples)\n\n```css\nheader > h1 { border-bottom : 1px dashed black\
    \ ; font-style : italic ; font-size : x-large ; }\nfooter > p { border-top : 1px\
    \ dashed black ; font-style : italic ; }\ntable { border-spacing : 5px ; width\
    \ : 530px ; }\nth { color : #FFF ; background : #000 ; text-align : left ; }\n\
    td { border-bottom : 1px solid black ; padding : 3px ; background : #F0F0F0 ;\
    \ text-align : left ; vertical-align:top ; }\np#err_msg { color : #F00 ; font-weight\
    \ : bold ; }\n```\n\n![image](Image00040.jpg) Save the style sheet in the `/includes`\
    \ folder you have created, alongside the HTML header and footer files\n\n![image](Image00041.jpg)\
    \ Finally, create a PHP script that sets the web page title and surrounds a form\
    \ with header and footer content\n\n```php\n<?php\n$page_title = ‘PHP Include’\
    \ ;\ninclude ( ‘includes/header.html’ ) ;\necho ‘<form action=” include.php ”\
    \ method=” POST ”>\n<p>Name: <input type=”text” name=”name ”></p>\n<p>Email: <input\
    \ type=”text” name=”email ”></p>\n</form> ;\ninclude ( ‘includes/footer.html’\
    \ ) ;\n?>\n```\n\n## Global Variables\n\nPHP provides several-in variables that\
    \ are always available in all scopes. These are called superglobals because they\
    \ do not need to be declared inside a function.\n\n- `$_POST` is an associative\
    \ array containing data sent via HTML POST forms.\n- `$_GET` is an associative\
    \ array containing variables passed via the URL.\n- `$_COOKIE` is an associative\
    \ array containing cookie variables.\n- `$_FILES` is an associative array containing\
    \ information about uploaded files.\n- `$_SERVER` is an associative array containing\
    \ information about headers, paths, and script locations.\n- `$_ENV` is an associative\
    \ array containing environment variables.\n- `$_SESSION` is an associative array\
    \ containing session variables.\n- `$_REQUEST` is an associative array containing\
    \ the contents of `$_GET`, `$_POST`, and `$_COOKIE`.\n- `$_GLOBALS` is an associative\
    \ array containing all variables available in the global scope.\n\n## Handling\
    \ Data\n\nThe most common way to collect data from a user is through the `$_GET`\
    \ and `$_POST` superglobals.\n\n### Using GET\n\nThe `$_GET` superglobal is used\
    \ to collect data sent via the URL. The data is appended to the URL as a query\
    \ string: `key=value`.\n\n```html\n<a href=\"www.example.com/php?id=1\">Link</a>\n\
    ```\n\nTo access the data, you use the `$_GET` array:\n\n```php\n<?php\nif ( isset(\
    \ $_GET['id'] ) ) {\n    echo \"The ID is: \" . $_GET['id'];\n}\n?>\n```\n\n###\
    \ Using POST\n\nThe `$_POST` superglobal is used to collect data sent via HTML\
    \ POST forms. Data is not visible in the URL, making it more secure for sensitive\
    \ information.\n\n```html\n<form action=\"process.php\" method=\"post\">\n   \
    \ Name: <input type=\"text\" name=\"name\">\n    Email: <input type=\"text\" name=\"\
    email\">\n    <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\nTo access\
    \ the data, you use the `$_POST` array:\n\n```php\n<?php\nif ( isset( $_POST['name']\
    \ ) ) {\n    echo \"Name: \" . $_POST['name'];\n}\n?>\n```\n\n## Validating Data\n\
    \nIt is important to validate user input before processing it. The `isset()` function\
    \ can be used to check if a variable is set.\n\n```php\n<?php\nif ( isset( $_POST['name']\
    \ ) && empty( $_POST['name'] ) ) {\n    echo \"Name is empty\";\n} else {\n  \
    \  echo \"Name: \" . htmlspecialchars($_POST['name']);\n}\n?>\n```\n\nThe `htmlspecialchars()`\
    \ function is used to prevent XSS attacks by converting special characters to\
    \ HTML entities.\n\n## Redirecting\n\nThe `header()` function can be used to redirect\
    \ the user to another page.\n\n```php\n<?php\nheader(\"Location: index.php\");\n\
    exit;\n?>\n```\n\n## Sessions\n\nSessions are used to store information across\
    \ multiple pages. To start a session, use `session_start()`.\n\n```php\n<?php\n\
    session_start();\n$_SESSION[\"user\"] = \"John\";\n?>\n```\n\nTo access session\
    \ data:\n\n```php\n<?php\nsession_start();\necho \"Welcome \" . $_SESSION[\"user\"\
    ];\n?>\n```\n"
  trans: "\n注意这里 `pathinfo()` 函数如何提供文件名的扩展名部分。\n\n![image](img/Image00041.jpg) 插入一条语句以确保所选文件与服务器上已有的文件同名，否则退出\
    \ `if( file_exists( $name ) )`。\n\n```php\n{ echo ‘File ‘ . $name . ’ already\
    \ uploaded’ ; exit() ; }\n```\n\n![image](img/Image00042.jpg) 最后，尝试上传文件，使用其原始文件名命名，并在表单下方显示它。\n\
    \n```php\ntry \n{ \n    move_uploaded_file( $temp , $name ) ;\n    echo ‘File\
    \ uploaded : ‘ . $name ;\n    echo ‘<br><img src=”’ . $name . ’>’ ;\n} \ncatch(\
    \ Exception $e )\n{\n    echo ‘File upload failed!’ ;\n}\n```\n\n![image](img/Image00160.jpg)\
    \ 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `upload.php`，然后通过 HTTP 打开并选择一个合适的图片文件上传到 `/htdocs`\
    \ 目录。\n\n![image](img/Image00172.jpg)\n\n![image](img/Image00173.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n`move_uploaded_file()` 函数的参数指定了（临时）文件名和目标。它可以很有用地指定一个特定的目录路径目标，例如 `‘uploads/’.$name`。\n\
    \n## 包围表单\n\nPHP 允许将多个文件合并创建一个网页。这意味着动态表单可以被静态头部和页脚内容包围，这些内容可以轻松重复用于创建网站内的其他页面。\n\
    \nPHP 的 `include()` 函数接受另一个文件的 URL 作为参数，将其包含在网页中。通常，被包含的静态内容文件是 HTML 文件，并位于 Web\
    \ 服务器 `/htdocs` 目录下的“includes”文件夹中。\n\nPHP 还提供了一个 `require()` 函数，它的工作原理与 `include()`\
    \ 相似，都可以在网页中包含其他文件，但有细微的差别。当 `include()` 函数失败时（例如找不到指定的文件），会向浏览器发送一个警告，但脚本会继续运行。当\
    \ `require()` 函数失败时，会打印错误但脚本会停止。通常 `include()` 函数包含静态 HTML 文件，而 `require()` 函数包含动态\
    \ PHP 脚本。\n\n重要重要的是，包含多个文件的网页标题可以通过 PHP 动态编写，从而为原本静态的 HTML 头部内容提供最大的灵活性：\n\n![image](img/Image00174.jpg)\n\
    \nheader.html\n\n![image](img/Image00036.jpg) 创建一个包含静态头部内容和写入页面标题 PHP 代码段的 HTML\
    \ 文档。\n\n```html\n<!DOCTYPE HTML>\n<html lang=”en”>\n<head>\n<meta charset=”UTF-8”>\n\
    <title> <?php echo $page_title ; ?> </title>\n<link rel=”stylesheet” href=”includes/style.css”>\n\
    </head>\n<body>\n    <header><h1>Page Header</h1></header>\n```\n\n![image](img/Image00174.jpg)\n\
    \nfooter.html\n\n![image](img/Image00037.jpg) 现在，创建一个包含页脚内容的 HTML 文档。\n\n```html\n\
    <footer><p>Page Footer</p></footer>\n</body>\n</html>\n```\n\n![image](img/Image00038.jpg)\
    \ 接下来，在 Web 服务器的 `/htdocs` 目录下创建一个名为“includes”的文件夹，并将上述文档分别保存为 `header.html` 和\
    \ `footer.html` 在其中。\n\n![image](img/Image00175.jpg)\n\nstyle.css\n\n![image](img/Image00039.jpg)\
    \ 创建一个 CSS 样式表来展示头部页脚内容（以及展示后续示例中某些方面的规则）。\n\n```css\nheader > h1 { border-bottom\
    \ : 1px dashed black ; font-style : italic ; font-size : x-large ; }\nfooter >\
    \ p { border-top : 1px dashed black ; font-style : italic ; }\ntable { border-spacing\
    \ : 5px ; width : 530px ; }\nth { color : #FFF ; background : #000 ; text-align\
    \ : left ; }\ntd { border-bottom : 1px solid black ; padding : 3px ; background\
    \ : #F0F0F0 ; text-align : left ; vertical-align:top ; }\np#err_msg { color :\
    \ #F00 ; font-weight : bold ; }\n```\n\n![image](img/Image00040.jpg) 将样式表保存到你创建的\
    \ `/includes` 文件夹中，以及 HTML 头部和页脚文件。\n\n![image](img/Image00041.jpg) 最后，创建一个 PHP\
    \ 脚本，设置网页标题并用头部和页脚内容包围表单。\n\n```php\n<?php\n$page_title = ‘PHP Include’ ;\ninclude\
    \ ( ‘includes/header.html’ ) ;\necho ‘<form action=” include.php ” method=” POST\
    \ ”>\n<p>Name: <input type=”text” name=”name ”></p>\n<p>Email: <input type=”text”\
    \ name=”email ”></p>\n</form> ;\ninclude ( ‘includes/footer.html’ ) ;\n?>\n```\n\
    \n![image](img/Image00172.jpg) upload.php\n\n![image](img/Image00160.jpg) 将文档保存到\
    \ Web 服务器的 `/htdocs` 目录下并命名为 `upload.php`，然后通过 HTTP 打开并选择一个合适的文件上传到 `/htdocs`\
    \ 目录。\n\n![image](img/Image00172.jpg)\n\n![image](img/Image00173.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n`move_uploaded_file()` 函数的参数指定了（临时）文件名和目标。它可以很有用地指定一个特定的目录路径目标，例如 `‘uploads/.$name`。\n\
    \n## 包围表单\n\nPHP 允许将多个文件合并创建一个网页。这意味着动态表单可以被静态头部和页脚内容包围，这些内容可以轻松重复用于创建网站内的其他页面。PHP\
    \ 的 `include()` 函数接受另一个文件的 URL 作为参数，将其包含在网页中。通常，被包含的静态内容文件是 HTML 文件，并位于 Web 服务器\
    \ `/htdocs` 目录下的“includes”文件夹中。PHP 还提供了一个 `require()` 函数，它的工作原理与 `include()` 相似，都可以在网页中包含其他文件，但有细微的差别。当\
    \ `include()` 函数失败时（例如找不到指定的文件），会向浏览器发送一个警告，但脚本会继续运行。当 `require()` 函数失败时，会打印错误但脚本会停止。通常\
    \ `include()` 函数包含静态 HTML 文件，而 `require()` 函数包含动态 PHP 脚本。重要重要的是，包含多个文件的网页标题可以通过\
    \ PHP 动态编写，从而为原本静态的 HTML 头部内容提供最大的灵活性：\n\n![image](img/Image00174.jpg)\n\nheader.html\n\
    \n![image](img/Image00036.jpg) 创建一个包含静态头部内容和写入页面标题 PHP 代码段的 HTML 文档。\n\n```html\n\
    <!DOCTYPE HTML>\n<html lang=”en”>\n<head>\n<meta charset=”UTF-8”>\n<title> <?php\
    \ echo $page_title ; ?> </title>\n<link rel=”stylesheet” href=”includes/style.css”>\n\
    </head>\n<body>\n    <header><h1>Page Header</h1></header>\n```\n\n![image](img/Image00174.jpg)\n\
    \nfooter.html\n\n![image](img/Image00037.jpg) 现在，创建一个包含页脚内容的 HTML 文档。\n\n```html\n\
    <footer><p>Page Footer</p></footer>\n</body>\n</html>\n```\n\n![image](img/Image00038.jpg)\
    \ 接下来，在 Web 服务器的 `/htdocs` 目录下创建一个名为“includes”的文件夹，并将上述文档分别保存为 `header.html` 和\
    \ `footer.html` 在其中。\n\n![image](img/Image00175.jpg)\n\nstyle.css\n\n![image](img/Image00039.jpg)\
    \ 创建一个 CSS 样式表来展示头部页脚内容（以及展示后续示例中某些方面的规则）。\n\n```css\nheader > h1 { border-bottom\
    \ : 1px dashed black ; font-style : italic ; font-size : x-large ; }\nfooter >\
    \ p { border-top : 1px dashed black ; font-style : italic ; }\ntable { border-spacing\
    \ : 5px ; width : 530px ; }\nth { color : #FFF ; background : #000 ; text-align\
    \ : left ; }\ntd { border-bottom : 1px solid black ; padding : 3px ; background\
    \ : #F0F0F0 ; text-align : left ; vertical-align:top ; }\np#err_msg { color :\
    \ #F00 ; font-weight : bold ; }\n```\n\n![image](img/Image00040.jpg) 将样式表保存到你创建的\
    \ `/includes` 文件夹中，以及 HTML 头部和页脚文件。\n\n![image](img/Image00041.jpg) 最后，创建一个 PHP\
    \ 脚本，设置网页标题并用头部和页脚内容包围表单。\n\n```php\n<?php\n$page_title = ‘PHP Include’ ;\ninclude\
    \ ( ‘includes/header.html’ ) ;\necho ‘<form action=” include.php ” method=” POST\
    \ ”>\n<p>Name: <input type=”text” name=”name ”></p>\n<p>Email: <input type=”text”\
    \ name=”email ”></p>\n</form> ;\ninclude ( ‘includes/footer.html’ ) ;\n?>\n```\n\
    \n## 全局变量\n\nPHP 提供了几个在所有作用范围内始终可用的变量。这些被称为全局变量，因为它们不需要在函数内部声明。\n\n- `$_POST`\
    \ 是包含通过 HTML POST 表单发送数据的关联数组。\n- `$_GET` 是包含通过 URL 传递变量的关联数组。\n- `$_COOKIE` 是包含\
    \ cookie 变量的关联数组。\n- `$_FILES` 是包含上传文件信息的关联数组。\n- `$_SERVER` 是包含标头、路径和脚本位置信息的关联数组。\n\
    - `$_ENV` 是包含环境变量的关联数组。\n- `$_SESSION` 是包含会话变量的关联数组。\n- `$_REQUEST` 是包含 `$_GET`、`$_POST`\
    \ 和 `$_COOKIE` 内容的关联数组。\n- `$_GLOBALS` 是包含全局作用范围内可用变量的关联数组。\n\n## 数据处理\n\n从用户那里收集数据常用的方法是通过\
    \ `$_GET` 和 `$_POST` 全局变量。\n\n### 使用 GET\n\n`$_GET` 全局变量用于收集通过 URL 发送的数据。数据以查询字符串的形式附加到\
    \ URL 后：`key=value`。\n\n```html\n<a href=\"www.example.com/php?id=1\">链接</a>\n\
    ```\n\n要访问数据，使用 `$_GET`：\n\n```php\n<?php\nif ( isset( $_GET['id'] ) ) {\n   \
    \ echo \"ID 为：\" . $_GET['id'];\n}\n?>\n```\n\n### 使用 POST\n\n`$_POST` 全局变量用于收集通过\
    \ HTML 表单发送的数据。数据不会显示在 URL 中，对于敏感信息来说更安全。\n\n```html\n<form action=\"process.php\"\
    \ method=\"post\">\n    姓名: <input type=\"text\" name=\"name\">\n    邮箱: <input\
    \ type=\"text\" name=\"email\">\n    <input type=\"submit\" value=\"提交\">\n</form>\n\
    ```\n\n要访问数据，使用 `$_POST` 数组：\n\n```php\n<?php\nif ( isset( $_POST['name'] ) )\
    \ {\n    echo \"姓名：\" . $_POST['name'];\n}\n?>\n```\n"
