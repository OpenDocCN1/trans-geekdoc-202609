    \ Statements to be inserted here (step 5).** \n\n **// Statements to be inserted\
    \ here (step 6).** \n\n **// Statements to be inserted here (step 7).** \n\n **}**\
    \ \n\n![image](Image00006.jpg)\n\nThis script is nominated by the form in **post.php**\
    \ to process its submitted user data messages. The form is not “sticky” though\
