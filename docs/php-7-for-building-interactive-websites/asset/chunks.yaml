- raw: "![image](Image00042.jpg) Open the page via HTTP by appending parameters to\
    \ the script name in the browser address field, such as “?name=mike&lang=PHP”,\
    \ to see them pass to the script\n\n![image](Image00053.jpg)\n\n![image](Image00005.jpg)\n\
    \n **$\\_SERVER\\[ ‘PHP\\_SELF’ \\]** is used by the example [here](#text00011.html#imgst)\
    \ to create a “sticky” HTML form.\n\n![image](Image00005.jpg)\n\n **$\\_SERVER\\\
    [ ‘REQUEST\\_ METHOD’ \\]** is used by the example [here](#text00011.html#imgsi)\
    \ to establish whether an HTML form has been submitted by a user.\n\n![image](Image00005.jpg)\n\
    \nThe HTTP **GET** method is used by the example [here](#text00014.html#imgp)\
    \ to set parameters for an XML Web Service response.\n\n **Summary** \n\n •  A\
    \ variable is a named container in which changeable data can be stored\n\n • \
    \ The value stored in a variable can be referenced using that variable’s name\n\
    \n •  Variable names must begin with a  **$**  dollar sign, may comprise letters,\
    \ numbers and underscore characters, and the first character after the  **$**\
    \  must only be a letter or an underscore\n\n •  A variable can store an integer\
    \ number, floating-point number, text string, Boolean value, object, or  **NULL**\
    \  value\n\n •  A variable is initialized using the = assignment operator to assign\
    \ an initial value to that variable\n\n •  A variable’s value can be displayed\
    \ as part of a mixed string by enclosing the string and variable name in double\
    \ quotes only\n\n •  Strings may be enclosed in either single quotes or double\
    \ quotes, and inner quote marks can be escaped using a backslash\n\n •  String\
    \ values can be joined together into a single string using the  **.**  concatenation\
    \ operator\n\n •  An array variable can store multiple items of data in sequential\
    \ array elements that are numbered starting at zero by default\n\n •  Optionally,\
    \ key names may be specified for each array element\n\n •  A  **foreach**  loop\
    \ can be used to traverse each element in an array\n\n •  The  **implode()** \
    \ and  **explode()**  functions convert between strings and arrays by adding or\
    \ removing specified separators\n\n •  Arrays can be sorted into alphanumeric\
    \ order by value or key\n\n •  A multi-dimensional array is simply an array whose\
    \ element values are themselves arrays\n\n •  The  **gettype()**  and  **var\\\
    _dump()**  functions can be used to check data types\n\n •  A constant is a named\
    \ container in which a fixed integer, floating-point number, or text string can\
    \ be stored\n\n •  Constant names are not prefixed by a  **$**  and are all uppercase\n\
    \n •  A constant is initialized using the  **define()**  function\n\n •  Superglobal\
    \ variables are always globally available anywhere within any script\n\n3\n\n\
    \ **Performing operations** \n\n*This chapter demonstrates the various PHP operators\
    \ for arithmetic, comparison and logical evaluation.*\n\n[**Doing arithmetic**](#text00005.html#sec17)\n\
    \n[**Making comparisons**](#text00005.html#sec18)\n\n[**Examining conditions**](#text00005.html#sec19)\n\
    \n[**Assessing logic**](#text00005.html#sec20)\n\n[**Comparing bits**](#text00005.html#sec21)\n\
    \n[**Changing values**](#text00005.html#sec22)\n\n[**Grasping precedence**](#text00005.html#sec23)\n\
    \n[**Summary**](#text00005.html#sec24)\n\n **Doing arithmetic** \n\nThe arithmetic\
    \ operators commonly used in PHP scripts are listed in the table below, together\
    \ with the operation they perform:\n\n| **Operator:** || **Operation:** |\n\n\
    | --- | --- |\n\n| **+** || Addition |\n\n| **\\-** || Subtraction |\n\n| **\\\
    *** || Multiplication |\n\n| **/** || Division |\n\n| **%** || Modulus |\n\n|\
    \ **\\*\\*** || Exponentiation |\n\n![image](Image00005.jpg)\n\nThe numbers used\
    \ along with operators to form expressions are known as “operands” – in the expression\
    \ **2 + 3** the numbers **2** and **3** are the operands.\n\nOperators for addition,\
    \ subtraction, multiplication and division act as you would expect. Care must\
    \ be taken, however, to group expressions for clarity where more than one operator\
    \ is used:\n\n| **a = b \\* c - d % e / f ;** || **\\# This is unclear.** |\n\n\
    | --- | --- |\n\n| **a = ( b \\* c ) - ( ( d % e ) / f ) ;** || **\\# This is\
    \ clearer.** |\n\n![image](Image00006.jpg)\n\nGroup expressions with parentheses\
    \ to specify evaluation precedence – innermost groups get evaluated first. See\
    \ [here](#text00005.html#sec23) for more on operator precedence.\n\nThe  **%**\
    \  modulus operator divides the first given number by the second given number\
    \ and returns the remainder of the operation. This is useful to determine if a\
    \ number has an odd or even value.\n\nThe  **\\*\\***  exponentiation operator\
    \ gives the result of raising the first operand to the power of the second operand.\n\
    \n| **a \\*\\* b** || **\\# Result of raising a to the b’th power** |\n\n| ---\
    \ | --- |\n\nShorthand expressions can usefully be created by combining an arithmetic\
    \ operator with the = assignment operator. For example:\n\n| **a += b ;** || **\\\
    # Equivalent to a = ( a + b ) ;** |\n\n| --- | --- |\n\n| **a -= b ;** || **\\\
    # Equivalent to a = ( a - b ) ;** |\n\n| **a \\*= b ;** || **\\# Equivalent to\
    \ a = ( a \\* b ) ;** |\n\n| **a /= b ;** || **\\# Equivalent to a = ( a / b )\
    \ ;** |\n\n![image](Image00029.jpg)\n\narithmetic.php\n\n![image](Image00054.jpg)\
    \ Create a valid HTML document, like the one listed [here](#text00003.html#sec5)\
    \ , then insert PHP tags into the body section\n\n **<?php** \n\n **\\# Statements\
    \ to be inserted here.** \n\n **?>** \n\n![image](Image00055.jpg) Now, insert\
    \ statements between the PHP tags to create and initialize two variables\n\n**$a\
    \ \\= 5 ;**\n\n**$b \\= 2 ;**\n\n![image](Image00056.jpg) Next, insert statements\
    \ to display the results of simple arithmetical operations using the variable\
    \ values\n\n**$result \\= $a + $b ; echo “Addition : $result <br>” ;**\n\n**$result\
    \ \\= $a \\- $b ; echo “Subtraction : $result <br>” ;**\n\n**$result \\= $a \\\
    * $b ; echo “Multiplication : $result <br>” ;**\n\n**$result \\= $a / $b ; echo\
    \ “Division : $result <br>” ;**\n\n![image](Image00057.jpg) Finally, insert a\
    \ statement to display the results of arithmetical evaluations of the variable\
    \ values\n\n**$result \\= $a % $b ; echo “Modulus : $result <br>” ;**\n\n**$result\
    \ \\= $a \\*\\* $b ; echo “Exponentiation : $result ” ;**\n\n![image](Image00058.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **arithmetic.php**\
    \  then open the page via HTTP to see the results and variable values get displayed\n\
    \n![image](Image00059.jpg)\n\n![image](Image00005.jpg)\n\nPHP has some useful\
    \ functions to work with numbers. For example, **round($a)** rounds **$a** to\
    \ the nearest integer and **number\\_format($a)** adds commas to **$a** denoting\
    \ groups of thousands.\n\n![image](Image00003.jpg)\n\nPHP 7 introduces a new **intdiv()**\
    \ function that performs an integer division on two operands and returns an integer.\
    \ For example, **intdiv(10,3)** returns **3** .\n\n **Making comparisons** \n\n\
    The operators that are commonly used in PHP scripts to compare two values are\
    \ listed in the table below:\n\n| **Operator:** || **Comparative test:** |\n\n\
    | :-- | :-- |\n\n| **\\==** || Equality |\n\n| **\\===** || Identicality |\n\n\
    | **!==** || Non-identicality |\n\n| **!=** || Inequality |\n\n| **<>** |\n\n\
    | **\\>** || Greater than |\n\n| **<** || Less than |\n\n| **\\>=** || Greater\
    \ than or equal to |\n\n| **<=** || Less than or equal to |\n\n| **<=>** || Spaceship\
    \ |\n\n![image](Image00003.jpg)\n\nThe **<=>** spaceship operator is a new feature\
    \ in PHP 7.\n\nThe  **\\==**  equality operator compares two operands and returns\
    \ a Boolean  **TRUE**  result if both are numerically equal in value, otherwise\
    \ it returns  **FALSE**  . Characters and strings are also compared numerically\
    \ by their ASCII code value. Conversely, the  **!=**  inequality operator returns\
    \  **TRUE**  if the two operands are not equal, otherwise it returns  **FALSE**\
    \  .\n\n![image](Image00005.jpg)\n\nEquality and inequality operators are useful\
    \ in testing the state of two variables to perform conditional branching in a\
    \ PHP script."
