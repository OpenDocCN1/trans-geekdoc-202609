    \ found by specifying the character as an argument to the PHP `ord()` function,\
    \ and the length of a string can be found by specifying it as the argument to\
    \ the PHP `strlen()` function.\n\n![image](Image00029.jpg)\n\ncharacters.php\n\
    \n![image](Image00029.jpg)\n\n```php\n<?php\n// Begin a PHP script with initialize\
    \ variables with string values\n$str1 = 'PHP In Steps';\n$str2 = 'PHP Easy Steps';\n\
    $str3 = 'PHP Easy Steps';\n$str4 = 'php in steps';\n\n// Next, add a loop to count\
    \ and display the total ASCII value of the first string\n$total = 0;\nfor ($i\
    \ = 0; $i < strlen($str1); $i++) {\n    $total += ord($str1[$i]);\n}\n\n// Next,\
    \ add statements to compare the strings\necho 'str1 vs $str2: ' . strcmp($str1,\
    \ $str2) . \"\\n\";\necho 'str1 vs $str3: ' . strcmp($str1, $str3) . \"\\n\";\n\
    echo 'str1 vs $str4: ' . strcmp($str1, $str4) . \"\\n\";\n\n// Now, add a statement\
    \ for a case-insensitive comparison\necho 'str1 vs $str4: ' . strcasecmp($str1,\
    \ $str4) . \"\\n\";\n\necho \"<hr>ASCII Total $str1 : $total\";\n?>\n```\n\n![image](Image00102.jpg)\n\
    \nSave the document in your web server’s `/htdocs` directory as characters.php\
    \ then open the page via HTTP to see the string comparisons\n\n![image](Image0103.jpg)\n\
    \n![image](Image0006.jpg)\n\nCharacter order is relevant as the ASCII totals for\
    \ two differently ordered strings could be equal, but the strings would not match.\n\
    \n### Searching text\n\nPHP provides a number of built-in functions to search\
    \ a string to find a specified substring or single character. The simple `strpos()`\
    \ function accepts two arguments to specify the string in which to search, and\
    \ the substring to find. It will search in sequence from the start of the string\
    \ to find a match. When a match is found the search halts and the `strpos()` function\
    \ returns an integer, which is the character index number position within the\
    \ string at which the first occurrence of a match begins. When no match is found\
    \ the `strpos()` function returns `FALSE`.\n\nThe `strrpos()` function works in\
    \ a similar way but returns the index number position at which the first occurrence\
    \ of a match begins when searching in reverse order, from the end of the string.\n\
    \nOther PHP search functions can return a part of the searched string, rather\
    \ than an index number indicating a match position.\n\nThe `strstr()` function\
    \ accepts two arguments to specify the string in which to search, and the substring\
    \ to find. It will search in sequence from the start of the string to find a match.\
    \ When a match is found, the search halts and the `strstr()` function returns\
    \ the remainder of the searched string from where the first occurrence of a match\
    \ begins. When no match is found the `strstr()` function returns `NULL`.\n"
  trans: "\n记得包含 `&` 符号前缀以创建对变量值的引用。\n\n![image](img/Image00005.jpg)\n\n注意，最后的函数调用从父作用域中获取了“morning”字符串。\n\
    \n### 总结\n\n* 自定义函数允许将 PHP 脚本模块化为易于理解和维护的代码段。\n* 函数名必须以字母或下划线字符开头，且不区分大小写。\n*\
    \ 函数通过在 `function` 关键字后陈述其函数名称，然后跟上包含语句的括号和花括号来定义。\n* 接受参数的函数通过在括号内包含一个用逗号分隔的参数列表来定义。\n\
    * 可选地，函数定义可以通过在参数名之前包含数据类型描述，来指定从调用者传递的数据的数据类型。\n* 参数数据通常按值传递，但如果给参数名加上 `&` 符号前缀，则可以按引用传递。\n\
    * 在函数定义中，通过给参数名进行赋值，可以可选地指定默认参数值。\n* 当给参数名加上 `...` 扩展运算符（splat operator）时，可以将多个参数传递给该参数以创建一个数组。\n\
    * 在函数外部创建的变量具有全局作用域，但除非函数块内部使用 `global` 关键字进行声明，否则无法在函数块内部访问。\n* 在函数内部创建的变量具有局部作用域，因此只能在该特定的函数块内部访问。\n\
    * 当程序作用域离开函数时，局部变量会丢失其值，但 `static` 变量会保留其值。\n* `return` 关键字向调用者返回一个项目，且函数定义可以可选地指定返回的数据类型。\n\
    * 匿名函数定义没有指定名称，但它是一个表达式，因此必须以分号 `;` 结束。\n* `use` 关键字和 `&` 符号前缀允许匿名函数引用返回函数中的局部变量。\n\
    \n# 6 字符串操纵\n\n*本章演示了在 PHP 脚本中操作文本字符串的各种方法。*\n\n* 比较字符\n* 搜索文本\n* 提取子字符串\n* 更改大小写\n\
    * 格式化字符串\n* 制作日期\n* 编码实体\n* 总结\n\n### 比较字符\n\nPHP 提供了多种内置函数来执行字符串比较。`strcmp()`\
    \ 函数接受两个字符串参数进行比较：如果两个字符串相等，则返回 0；如果第一个字符串大于第二个字符串，则返回正整数；如果第一个字符串小于第二个字符串，则返回负整数。\n\
    \n![image](img/Image0001.jpg)\n\n严格来说，`strcmp()` 返回的值取决于字符串的比较结果。如果字符串相等，则返回 0；如果第一个字符串大于第二个字符串，则返回正整数；如果第一个字符串小于第二个字符串，则返回负整数。`strncmp()`\
    \ 函数的工作方式类似，但它通过指定比较的字符数量来限制比较范围。\n\n如果你想忽略大小写，可以使用 `strcasecmp()` 函数。`strcasecmp()`\
    \ 接受两个字符串参数进行比较：如果两个字符串在忽略大小写的情况下相等，则返回 0；如果第一个字符串大于第二个字符串，则返回正整数；如果第一个字符串小于第二个字符串，则返回负整数。`strncasecmp()`\
    \ 函数的工作方式类似，但它通过指定比较的字符数量来限制比较范围，并忽略大小写。\n\n`strcmp()` 函数的返回值取决于字符串的比较结果。如果两个字符串相等，则返回\
    \ 0；如果第一个字符串大于第二个字符串，则返回正整数；如果第一个字符串小于第二个字符串，则返回负整数。\n\nASCII 是“美国信息交换标准”的缩写，规定了字符编码方案。通过\
    \ `ord()` 函数可以找到任何字符的 ASCII 值，通过 `strlen()` 函数可以找到字符串的长度。\n\n![image](img/Image0002.jpg)\n\
    \n```php\n<?php\n// 开始 PHP 脚本初始化变量\n$str1 = 'PHP In';\n$str2 = 'PHP Easy';\n$str3\
    \ = 'PHP Easy';\n$str4 = 'php in';\n\n// 接下来，添加一个循环来计算并显示总 ASCII 值\n$total = 0;\n\
    for ($i = 0; $i < strlen($str1); $i++) {\n    $total += ord($str1[$i]);\n}\n\n\
    // 接下来，添加语句来比较字符串\necho 'str1 vs $str2: ' . strcmp($str1, $str2) . \"\\n\";\n\
    echo 'str1 vs $str3: ' . strcmp($str1, $str3) . \"\\n\";\necho 'str1 vs $str4:\
    \ ' . strcmp($str1, $str4) . \"\\n\";\n\n// 现在，添加一个忽略大小写的比较语句\necho 'str1 vs $str4:\
    \ ' . strcasecmp($str1, $str4) . \"\\n\";\n\necho \"<hr>ASCII Total $str1 : $total\"\
    ;\n?>\n```\n\n![image](img/Image0102.jpg)\n\n将文档保存在 Web 服务器的 `/htdocs` 目录下的 characters.php，然后通过\
    \ HTTP 打开以查看字符串比较\n\n![image](img/Image0103.jpg)\n\n![image](img/Image0006.jpg)\n\
    \n字符顺序是相关的，因为两个顺序不同的字符串的 ASCII 总可能相等，但字符串本身并不匹配。\n\n### 搜索文本\n\nPHP 提供了多种内置函数来搜索字符串以查找子字符串或单个字符。简单的\
    \ `strpos()` 函数接受两个参数：指定要在其中搜索的字符串和要查找的子字符串。它将从字符串开始按顺序搜索直到找到匹配。一旦找到匹配，搜索停止，`strpos()`\
    \ 返回一个整数，即匹配项首次出现在字符串中的字符索引位置位置。如果没有找到匹配项，`strpos()` 返回 `FALSE`。\n\n`strrpos()`\
    \ 函数的工作方式类似，但在反向搜索（从字符串末尾开始）时，它返回匹配项首次出现的索引位置。\n\n其他 PHP 搜索函数可以返回搜索字符串的一部分，而不是指示匹配位置的索引数字。\n\
    \n`strstr()` 函数接受两个参数：指定要在其中搜索的字符串和要查找的子字符串。它将从字符串开始按顺序搜索直到找到匹配。一旦找到匹配，搜索停止，`strstr()`\
    \ 返回从匹配项首次出现开始的字符串剩余部分。如果没有找到匹配项，`strstr()` 返回 `NULL`。\n\n"
