    \ named “forum” can be issued at the prompt in the MySQL Command Line Client,\
    \ or issued by running a PHP script in the web browser.\n\n![image](Image00029.jpg)\n\
    \ncreate_forum.php\n\n![image](Image00067.jpg) Begin a PHP script with a statement\
    \ to connect to a database using the standard connection scripts described on\
    \ the previous page\n\n```php\n<?php\nrequire( '../connect_db.php' );\n```\n\n\
    ![image](Image0068.jpg) Next, assign the SQL specifications of the table to a\
    \ variable\n\n```php\n$sql = 'CREATE TABLE IF NOT EXISTS forum (\n    post_id\
    \ INT UNSIGNED AUTO_INCREMENT,\n    first_name VARCHAR(20),\n    last_name VARCHAR(40),\n\
    \    subject VARCHAR(60),\n    message TEXT,\n    post_date DATETIME,\n    PRIMARY\
    \ KEY (post_id)\n)';\n```\n\n![image](Image0069.jpg) Test whether the table was\
    \ created, or describe the error on failure\n\n```php\nif( mysqli_query($dbc,\
    \ $sql) === TRUE ) {\n    echo 'Table “forum” created successfully';\n} else {\n\
    \    echo 'Error creating table : ' . mysqli_error($dbc);\n}\n```\n\n![image](Image0070.jpg)\
    \ Remember to close the database connection when done\n\n```php\nmysqli_close($dbc);\n\
    ```\n\n![image](Image0072.jpg) Save the document in your web server’s `/htdocs`\
    \ directory as `create_forum.php` then open the page via HTTP to create the forum\n\
    \n![image](Image0202.jpg)\n\n![image](Image0005.jpg) The `VARCHAR` data type specifies\
    \ a character length, whereas the `TEXT` data type accommodates up to 65,535 characters.\n\
    \n![image](Image0005.jpg) The `mysqli_query()` function executes the SQL query,\
    \ whereas the `mysqli_error()` function will provide a report if an error occurs.\n\
    \n### Providing the page\n\nA forum page can be created to display previously\
    \ posted messages retrieved from the `forum` database table, created on the previous\
    \ page. Forum messages can be displayed between the page header and footer, together\
    \ with a hyperlink to another page where the user can post a new message. If the\
    \ forum database contains no previously posted content, the script can simply\
    \ advise that there are currently no messages.\n\nThe PHP `mysqli_query()` function\
    \ can make an SQL query to retrieve the database table content, and the `mysqli_num_rows()`\
    \ function can discover how many table rows are in the result. When table rows\
    \ are found in the result, the `mysqli_fetch_array()` function can be used to\
    \ fetch an associative array of rows and data in each column by specifying the\
    \ result and `MYSQLI_ASSOC` constant as arguments:\n\n![image](Image0029.jpg)\n\
    \nforum.php\n\n![image](Image0067.jpg) Begin a PHP script with a statement to\
    \ set the page title\n\n```php\n<?php\n$page_title = 'PHP Forum';\n```\n\n![image](Image0068.jpg)\
    \ Next, add a statement to include a page header\n\n```php\ninclude ( 'includes/header.html'\
    \ );\n```\n\n![image](Image0069.jpg) Add a statement to open the database connection\n\
    \n```php\nrequire ( '../connect_db.php' );\n```\n\n![image](Image0070.jpg) Retrieve\
    \ all messages from the database table and assign them to a variable\n\n```php\n\
    $sql = 'SELECT * FROM forum';\n$result = mysqli_query($dbc, $sql);\n```\n\n![image](Image0072.jpg)\
    \ Test whether the database table is empty and display an appropriate advisory\
    \ comment\n\n```php\nif ( mysqli_num_rows($result) > 0 ) {\n```\n"
  trans: "\n\nMySQL 社区版可以在 `[mysql.com/downloads/mysql](http://www.mysql.com/downloads/mysql)`\
    \ 免费获取。\n\n成功调用 `mysqli_connect()` 后返回的对象非常重要，因为它被用作与其他 MySQL 服务器通信的 PHP 函数调用的参数。例如，在上面的脚本中，它必须作为\
    \ `mysqli_set_charset()` 函数的第一个参数来标识连接。\n\n![image](img/Image00005.jpg)\n\n本章假设\
    \ MySQL 数据库服务器已经安装并为本地服务器上的用户进行了配置，且该用户拥有使用名为 `website_db` 数据库的完全权限。进一步的说明和示例可以参考我们系列中的配套书籍\
    \ [PHP & MySQL in easy steps](http://ineasysteps.com/products-page/all_books/php-mysql-in-easy-steps/)。\n\
    \n当调用 `mysqli_connect()` 函数失败时，脚本将跳转到调用 `die()` 函数的备选分支。这等同于调用 `exit()` 来立即终止脚本。可选的是，`die()`\
    \ 函数可以接受一个字符串参数，该字符串将在脚本停止时打印出来。在这种情况下，字符串消息由 `mysqli_connect_error()` 函数返回，描述了连接尝试失败的原因。\n\
    \n由于连接脚本包含敏感的用户信息，因此不能将其放在 Web 服务器的 `/htdocs` 目录下的其他 PHP 脚本旁边。`connect_db.php`\
    \ 脚本应该位于 `/htdocs` 的父目录中，在那里它无法被直接访问，但可以通过 `require` 语句被其他 PHP 脚本引入，如下：\n\n```php\n\
    <?php\nrequire ( '../connect_db.php' );\nif ( mysqli_ping($dbc) ) {\n    echo\
    \ 'MySQL Server ' . mysqli_get_server_info($dbc) . ' on ' . mysqli_get_host_info($dbc);\n\
    }\n```\n\n![image](img/Image00029.jpg)\n\nrequire.php\n\n因此，Web 服务器目录结构中的文件应按所示的层级结构排列，这样当你通过\
    \ HTTP 请求 `require.php` 脚本时，`connect_db.php` 脚本将从其父目录的位置引入，并建立到 MySQL 服务器的连接。\n\
    \n![image](img/Image00200.jpg)\n\n![image](img/Image00201.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n仅包含纯 PHP 代码的文件（如此处列出的两个文件）应省略文件末部的 PHP `?>` 结束标签。这可以防止 PHP 结束标签之后出现意外的空格或换行，这些可能会导致意外的副作用。\n\
    \n![image](img/Image00019.jpg)\n\n连接脚本 `connect_db.php` 必须成功工作以连接 MySQL 数据库，以便用于本章中的示例。\n\
    \n### 创建论坛\n\n用户消息可以通过 PHP 脚本存储在 MySQL 数据库表中，因此随后可以将其检索并显示在包含各种注册用户消息的论坛页面中。通常，包含已发布用户消息的数据库表可能会存储帖子\
    \ ID、用户的名和姓、主题标题、消息本身以及发布日期：\n\n| 列名: | 内容类型: | 示例: |\n| --- | --- | --- |\n|\
    \ `post_id` | 数字 | 123 |\n| `first_name` | 文本 | Mike |\n| `last_name` | 文本 | McGrath\
    \ |\n| `subject` | 文本 | Ice Cream |\n| `message` | 文本 | 热天里吃真棒。 |\n| `post_date`\
    \ | 日期/时间 | 2016-07-24 12:30:00 |\n\n![image](img/Image00019.jpg)\n\nMySQL 数据库表只能由\
    \ root MySQL 用户或其他授予完全访问权限的 MySQL 用户创建。\n\n这种设计的数据库表可以使用结构化查询语言 (SQL) 创建。该数据库表的设计仅要求为存储文本的列指定\
    \ SQL `VARCHAR` 或 `TEXT` 数据类型。帖子 ID 应该是正的 SQL 整数 `INT` 值，由表通过 SQL `AUTO_INCREMENT`\
    \ 自动分配，发布消息的时间戳应存储为 SQL `DATETIME` 值。向数据库表发布消息需要所有项目，因此每列都必须有一个 SQL `NOT NULL`\
    \ 规则。\n\n![image](img/Image00005.jpg)\n\n你可以从我们系列中的配套书籍 [SQL in easy steps](http://ineasysteps.com/products-page/all_books/sql-in-easy-steps-3rd-ed/)\
    \ 中了解如何充分使用数据库的结构化查询语言。\n\n生成此设计作为名为“forum”的 MySQL 数据库表所需的 SQL 查询命令可以在 MySQL 命令行客户端的提示符处发出，也可以通过在\
    \ 浏览器中运行 PHP 脚本发出。\n\n![image](img/Image00029.jpg)\n\ncreate_forum.php\n\n![image](img/Image00067.jpg)\
    \ 以一个语句开始 PHP 脚本，使用上一页描述的标准连接脚本连接数据库\n\n```php\n<?php\nrequire( '../connect_db.php'\
    \ );\n```\n\n![image](img/Image0068.jpg) 接下来，将表的 SQL 规范分配给变量\n\n```php\n$sql =\
    \ 'CREATE TABLE IF NOT EXISTS forum (\n    post_id INT UNSIGNED AUTO_INCREMENT,\n\
    \    first_name VARCHAR(20),\n    last_name VARCHAR(40),\n    subject VARCHAR(60),\n\
    \    message TEXT,\n    post_date DATETIME,\n    PRIMARY KEY (post_id)\n)';\n\
    ```\n\n![image](img/Image0069.jpg) 测试表是否创建，或者在失败时描述错误\n\n```php\nif( mysqli_query($dbc,\
    \ $sql) === TRUE ) {\n    echo 'Table “forum” created successfully';\n} else {\n\
    \    echo 'Error creating table : ' . mysqli_error($dbc);\n}\n```\n\n![image](img/Image0070.jpg)\
    \ 完成后关闭数据库连接\n\n```php\nmysqli_close($dbc);\n```\n\n![image](img/Image0072.jpg)\
    \ 将文档保存在 Web 服务器的 `/htdocs` 目录下名为 `create_forum.php`，然后通过 HTTP 打开页面创建论坛\n\n![image](img/Image002.jpg)\n\
    \n### 提供页面\n\n创建一个页面来显示从上一页创建的 `forum` 数据库表中检索的发布消息。论坛消息显示在页眉和页脚之间，并带有指向可以发布新消息页面的链接。如果论坛没有发布的内容，脚本可以简单提示没有消息。\n\
    \nPHP `mysqli_query()` 函数可以执行 SQL 查询以检索表内容，`mysqli_num_rows()` 函数可以发现结果中有多少表行。当结果中找到表行时，可以使用\
    \ `mysqli_fetch_array()` 函数通过指定结果和 `MYSQLI_ASSOC` 常量来获取行和每列数据的关联数组：\n\n![image](img/Image0029.jpg)\n\
    \nforum.php\n\n![image](img/Image0067.jpg) 以一个语句开始 PHP 脚本，设置页面标题\n\n```php\n<?php\n\
    $page_title = 'PHP Forum';\n```\n\n![image](img/Image0068.jpg) 接下来，添加一个语句包含页眉\n\
    \n```php\ninclude ( 'includes/header.html' );\n```\n\n![image](img/Image0069.jpg)\
    \ 添加一个语句打开数据库连接\n\n```php\nrequire ( '../connect_db.php' );\n```\n\n![image](img/Image0070.jpg)\
    \ 从数据库表中检索所有消息并将其分配给变量\n\n```php\n$sql = 'SELECT * FROM forum';\n$result = mysqli_query($dbc,\
    \ $sql);\n```\n\n![image](img/Image0072.jpg) 测试数据库表是否为空并显示适当的提示注释\n\n```php\n\
    if ( mysqli_num_rows($result) > 0 ) {\n```\n"
