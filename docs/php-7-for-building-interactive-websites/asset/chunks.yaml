- raw: "Unlike other local variables, which lose their value when the program scope\
    \ leaves the function, static variables retain their value. This means that the\
    \ updated value of an incremented value stored in a static local variable is recognized\
    \ on each function call.\n\nA recursive function might otherwise reference a global\
    \ variable counter value that gets incremented on successive recursive calls,\
    \ until it exceeds a value specified in a test.\n\n![image](Image00029.jpg)\n\n\
    scope.php\n\n![image](Image00085.jpg) Begin a PHP script by initializing a global\
    \ variable with an integer and displaying the variable value\n\n **<?php** \n\n\
    **$number \\= 1 ; echo “Global number : $number <br>” ;**\n\n![image](Image00086.jpg)\
    \ Next, define and call a function that initializes a like- named local variable\
    \ and displays that variable value **function show\\_local ()**\n\n **{** \n\n\
    **$number \\= 100 ; echo “Local number : $number <hr>” ;**\n\n **}** \n\n**show\\\
    _local () ;**\n\n![image](Image00087.jpg) Now, define and call a recursive function\
    \ that increments the global variable and a static variable on each call\n\n**function\
    \ recur ()**\n\n **{** \n\n**global $number ;        static $letter \\= ‘A’ ;**\n\
    \n**if( $number < 14 )**\n\n **{** \n\n**echo “ $number : $letter | “ ;**\n\n\
    **$number ++ ; $letter ++ ; recur () ;**\n\n **}** \n\n **}** \n\n**recur () ;**\n\
    \n![image](Image00088.jpg) Finally, after the function block add a statement to\
    \ display the modified global variable value\n\n**echo “<hr>Global number : $number\
    \ ” ;**\n\n **?>** \n\n![image](Image00089.jpg) Save the document in your web\
    \ server’s  **/htdocs**  directory as  **scope.php**  then open the page via HTTP\
    \ to see the global and local variable values\n\n![image](Image00094.jpg)\n\n\
    ![image](Image00006.jpg)\n\nIf you remove the **static** keyword from this function\
    \ the **$letter** variable will simply contain ‘A’ each time the function is called.\n\
    \n![image](Image00005.jpg)\n\nPHP also has a special **$GLOBALS** array in which\
    \ the value of a global variable can be referenced by its name. In this example\
    \ you could alternatively use **$GLOBALS\\[‘number’\\]** to get the value.\n\n\
    \ **Returning values** \n\nA custom PHP function can return a value to the caller\
    \ by adding a statement using the  **return**  keyword, like this:\n\n **function\
    \ *function\\_name* ( )** \n\n **{** \n\n ***statement-to-be-executed ;  \n\n\
    statement-to-be-executed ;*  \n\nreturn *value ;*** \n\n **}** \n\nThe  **return**\
    \  statement is optional and if omitted, functions will return a  **NULL**  value\
    \ to the caller by default.\n\nFunctions can only return a single item to the\
    \ caller, so they cannot return multiple values. You can, however, assign multiple\
    \ values to elements of an array and have a function return the single array to\
    \ the caller, then unpack the values.\n\nA  **return**  statement can include\
    \ an expression to be evaluated so its single result will be returned to the caller.\
    \ For example:\n\n **function square( int $number )** \n\n **{** \n\n **return\
    \ $number \\* $number ;** \n\n **}** \n\n **echo square( 3 ) ;         # Outputs\
    \ 9** \n\nTo ensure a function will only return a value of a desired data type,\
    \ the function declaration can, optionally, specify the return type description\
    \ such as  **int**  ,  **float**  ,  **string**  ,  **bool**  or  **array**  ,\
    \ like this:\n\n **function *function\\_name* ( ) : int** \n\n **{** \n\n ***statement-to-be-executed\
    \ ;  \n\nstatement-to-be-executed ;*  \n\nreturn *value ;*** \n\n **}** \n\nWhen\
    \ a return data type is specified, a function that attempts to return an incorrect\
    \ data type to the caller will result in an error.\n\n![image](Image00003.jpg)\n\
    \nThe ability to specify a return data type is a new feature in PHP 7.\n\n![image](Image00029.jpg)\n\
    \nreturn.php\n\n![image](Image00085.jpg) Begin a PHP script by defining a function\
    \ that must only return an array of data\n\n **<?php** \n\n**function supply ()\
    \ : array**\n\n **{** \n\n **// Statement to be inserted here.** \n\n **}** \n\
    \n![image](Image00086.jpg) Next, insert a statement to return an array of four\
    \ mixed values\n\n**return array ( 75 , 3.142 , ‘Super PHP’ , True ) ;**\n\n![image](Image00087.jpg)\
    \ After the function, add a statement that calls the function and assigns the\
    \ returned array values to a variable\n\n**$array \\= supply () ;**\n\n![image](Image00088.jpg)\
    \ Finally, add a loop to display each of the values returned from the function\n\
    \n**foreach( $array as $data )**\n\n **{** \n\n**echo “Element Value : $data <br>”\
    \ ;**\n\n **}** \n\n **?>** \n\n![image](Image00089.jpg) Save the document in\
    \ your web server’s  **/htdocs**  directory as  **return.php**  then open the\
    \ page via HTTP to see the returned values\n\n![image](Image00095.jpg)\n\n![image](Image00006.jpg)\n\
    \nIn PHP the Boolean **TRUE** value is represented numerically as 1.\n\n **Calling\
    \ back** \n\nPHP allows you to create “anonymous” functions that have no name\
    \ specified in the function definition. Like other functions, these can accept\
    \ arguments if parameters are specified and they can optionally return a value\
    \ when called. Unlike other function definitions, which are code constructs, an\
    \ anonymous function definition is an expression. This means that each anonymous\
    \ function definition must be terminated by a semicolon, like this:\n\n **function\
    \ ( )** \n\n **{** \n\n ***statement-to-be-executed ;  \n\nstatement-to-be-executed\
    \ ;*  \n\nreturn *value ;*** \n\n **} ;** \n\n![image](Image00019.jpg)\n\nDon’t\
    \ forget to add a terminating **;** semicolon after each anonymous function definition.\n\
    \nOn its own an anonymous function is of little use as, without a name, it cannot\
    \ be called, but it can be useful in other ways:\n\n •  Assigned to a variable,\
    \ an anonymous function can be called using the variable name\n\n •  Passed as\
    \ a callable argument to another function, an anonymous function can be called\
    \ later as a “callback”\n\n •  Returned from a function, an anonymous function\
    \ retains access to the returning function’s variables in “closure”\n\nBy assigning\
    \ an anonymous function to a variable you do, in effect, give the function a name\
    \ and can call it and pass it arguments as you would any other function – using\
    \ the variable name. Similarly, when you pass an anonymous function to another\
    \ function it can be called back and passed arguments as you would any other function\
    \ – using the parameter name. The PHP  **use**  keyword and  **&**  ampersand\
    \ prefix allows an anonymous function to reference a local variable in the returning\
    \ function.\n\n![image](Image00029.jpg)\n\ncallback.php\n\n![image](Image00085.jpg)\
    \ Begin a PHP script by assigning to a variable an anonymous function that accepts\
    \ a single argument\n\n **<?php** \n\n**$hello \\= function ( $user ) { echo “Hello\
    \ $user !<br>” ; } ;**\n\n![image](Image00086.jpg) Next, add a statement that\
    \ calls the anonymous function and passes a single argument\n\n**$hello ( ‘Mike’\
    \ ) ;**\n\n![image](Image00087.jpg) Now, define a regular function that accepts\
    \ a single callable argument and calls that function passing a string\n\n**function\
    \ greet ( callable $anon )**\n\n **{** \n\n**$anon ( ‘Carole Anne’ ) ;**\n\n **}**\
    \ \n\n![image](Image00088.jpg) Add a statement to call the function, defined in\
    \ the previous step, passing the anonymous function that was assigned to a variable\
    \ in the first step\n\n**greet( $hello ) ;**\n\n![image](Image00089.jpg) Next,\
    \ define another regular function, which has one local variable and returns an\
    \ anonymous function that references the local variable value\n\n**function meet\
    \ () : callable**\n\n **{** \n\n**$time \\= ‘morning’ ;**\n\n**return function(\
    \ $name ) use( & $time )**\n\n**{ return “Good $time , $name !” ; } ;**\n\n **}**\
    \ \n\n![image](Image00091.jpg) Assign to a variable the function defined in the\
    \ previous step then call that function, passing a string argument\n\n**$meeting\
    \ \\= meet () ;**\n\n**echo $meeting ( ‘Susan’ ) ;**\n\n **?>** \n\n![image](Image00096.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **callback.php**\
    \  then open the page via HTTP to see the returned values from anonymous functions\n\
    \n![image](Image00097.jpg)\n\n![image](Image00006.jpg)"
  fmt: "\nUnlike other local variables, which lose their value when the program scope\
    \ leaves the function, static variables retain their value. This means that the\
    \ updated value of an incremented value stored in a static local variable is recognized\
    \ on each function call.\n\nA recursive function might otherwise reference a global\
    \ variable counter value that gets incremented on successive recursive calls,\
    \ until it exceeds a value specified in a test.\n\n![image](Image00029.jpg)\n\n\
    scope.php\n\n![image](Image00085.jpg) Begin a PHP script by initializing a global\
    \ variable with an integer and displaying the variable value\n\n```php\n<?php\n\
    $number = 1 ; echo “Global number : $number <br>” ;\n```\n\n![image](Image00086.jpg)\
    \ Next, define and call a function that initializes a like- named local variable\
    \ and displays that variable value\n\n```php\nfunction show_local ()\n{\n    $number\
    \ = 100 ; echo “Local number : $number <hr>” ;\n}\nshow_local ()\n```\n\n![image](Image00087.jpg)\
    \ Now, define and call a recursive function that increments the global variable\
    \ and a static variable on each call\n\n```php\nfunction recur ()\n{\n    global\
    \ $number ;\n    static $letter = ‘A’ ;\n    if( $number < 14 )\n    {\n     \
    \   echo “ $number : $letter | “ ;\n        $number ++ ; $letter ++ ; recur ()\
    \ ;\n    }\n}\nrecur () ;\n```\n\n![image](Image00088.jpg) Finally, after the\
    \ function block add a statement to display the modified global variable value\n\
    \n```php\necho “<hr>Global number : $number ” ;\n?>\n```\n\n![image](Image00089.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `scope.php` then\
    \ open the page via HTTP to see the global and local variable values\n\n![image](Image00094.jpg)\n\
    \n![image](Image00006.jpg)\n\nIf you remove the `static` keyword from this function\
    \ the `$letter` variable will simply contain ‘A’ each time the function is called.\n\
    \n![image](Image00005.jpg)\n\nPHP also has a special `$GLOBALS` array in which\
    \ the value of a global variable can be referenced by its name. In this example\
    \ you could alternatively use `$GLOBALS['number']` to get the value.\n\n### Returning\
    \ values\n\nA custom PHP function can return a value to the caller by adding a\
    \ statement using the `return` keyword, like this:\n\n```php\nfunction function_name\
    \ ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed ;\n   \
    \ return value ;\n}\n```\n\nThe `return` statement is optional and if omitted,\
    \ functions will return a `NULL` value to the caller by default.\n\nFunctions\
    \ can only return a single item to the caller, so they cannot return multiple\
    \ values. You can, however, assign multiple values to elements of an array and\
    \ have a function return the single array to the caller, then unpack the values.\n\
    \nA `return` statement can include an expression to be evaluated so its single\
    \ result will be returned to the caller. For example:\n\n```php\nfunction square(\
    \ int $number )\n{\n    return $number * $number ;\n}\necho square( 3 ) ; # Outputs\
    \ 9\n```\n\nTo ensure a function will only return a value of a desired data type,\
    \ the function declaration can, optionally, specify the return type description\
    \ such as `int`, `float`, `string`, `bool` or `array`, like this:\n\n```php\n\
    function function_name ( ) : int\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    return value ;\n}\n```\n\nWhen a return data type is specified, a function\
    \ that attempts to return an incorrect data type to the caller will result in\
    \ an error.\n\n![image](Image00003.jpg)\n\nThe ability to specify a return data\
    \ type is a new feature in PHP 7.\n\n![image](Image00029.jpg)\n\nreturn.php\n\n\
    ![image](Image00085.jpg) Begin a PHP script by defining a function that must only\
    \ return an array of data\n\n```php\n<?php\nfunction supply () : array\n{\n  \
    \  // Statement to be inserted here.\n}\n```\n\n![image](Image00086.jpg) Next,\
    \ insert a statement to return an array of four mixed values\n\n```php\nreturn\
    \ array ( 75 , 3.142 , ‘Super PHP’ , True ) ;\n```\n\n![image](Image00087.jpg)\
    \ After the function, add a statement that calls the function and assigns the\
    \ returned array values to a variable\n\n```php\n$array = supply () ;\n```\n\n\
    ![image](Image00088.jpg) Finally, add a loop to display each of the values returned\
    \ from the function\n\n```php\nforeach( $array as $data )\n{\n    echo “Element\
    \ Value : $data <br>” ;\n}\n```\n"
  trans: "\n\n与其他局部变量（当程序作用域离开函数时会丢失值）不同，静态变量会保留其值。这意味着存储在静态局部变量中的递增后的值在每次调用函数时都会被识别。\n\
    \n否则，递归函数可能会引用全局变量计数器值，该值会在连续的递归调用中递增，直到超过测试中指定的值。\n\n![image](img/Image00029.jpg)\n\
    \nscope.php\n\n![image](img/Image00085.jpg) 通过初始化一个整数全局变量来启动 PHP 脚本，并显示变量值\n\n\
    ```php\n<?php\n$number = 1 ; echo “Global number : $number <br>” ;\n```\n\n![image](img/Image00086.jpg)\
    \ 下，定义并调用一个函数，该函数初始化一个同名的局部变量并显示该变量值\n\n```php\nfunction show_local ()\n{\n  \
    \  $number = 100 ; echo “Local number : $number <hr>” ;\n}\nshow_local ()\n```\n\
    \n![image](img/Image00087.jpg) 现在，定义并调用一个递归函数，该函数在每次调用时递增全局变量和静态变量\n\n```php\n\
    function recur ()\n{\n    global $number ;\n    static $letter = ‘A’ ;\n    if(\
    \ $number < 14 )\n    {\n        echo “ $number : $letter | “ ;\n        $number\
    \ ++ ; $letter ++ ; recur () ;\n    }\n}\nrecur () ;\n```\n\n![image](img/Image00088.jpg)\
    \ 最后，在函数块之后添加语句来显示修改后的全局变量值\n\n```php\necho “<hr>Global number : $number ” ;\n\
    ?>\n```\n\n![image](img/Image00089.jpg) 将文档保存在 Web 服务器的 `/htdocs` 目录并为 `scope.php`，然后通过\
    \ HTTP 打开页面以查看全局和局部变量值\n\n![image](img/Image00094.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n如果你从此函数中删除 `static` 关键字，则 `$letter` 变量在每次调用函数时将只包含 ‘A’。\n\n![image](img/Image00005.jpg)\n\
    \nPHP 还有一个特殊的 `$GLOBALS` 数组，可以通过其名称引用全局变量的值。在这个示例中，你可以替代地使用 `$GLOBALS['number']`\
    \ 来获取值。\n\n### 返回值\n\n自定义的 PHP 函数可以通过添加使用 `return` 关键字的语句向调用者返回值，如下所示：\n\n```php\n\
    function function_name ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    return value ;\n}\n```\n\n`return` 语句是可选的，如果省略，函数将默认向调用者返回 `NULL` 值。\n\
    \n函数只能向调用者返回一个项目，因此它们不能返回多个值。然而，你可以将多个值赋值给数组元素，并让函数返回该数组给调用者，然后对值进行解包。\n\n`return`\
    \ 语句可以包含一个待求值的表达式，其单一结果将返回给调用者。例如：\n\n```php\nfunction square( int $number )\n\
    {\n    return $number * $number ;\n}\necho square( 3 ) ; # 输出 9\n```\n\n为了确保函数只返回所需数据类型的值，可以可选地指定返回类型描述，例如\
    \ `int`、`float`、`string`、`bool` 或 `array`，如下：\n\n```php\nfunction function_name\
    \ ( ) : int\n{\n    statement-to-be-executed ;\n    statement-to-be-executed ;\n\
    \    return value ;\n}\n```\n\n当指定了返回数据类型时，尝试向调用者返回错误数据类型的函数将导致错误。\n\n![image](img/Image00003.jpg)\n\
    \n指定返回数据类型的能力是 PHP 7 的新功能。\n\n![image](img/Image00029.jpg)\n\nreturn.php\n\n![image](img/Image00085.jpg)\
    \ 通过定义一个必须只返回数据数组的函数来启动 PHP 脚本\n\n```php\n<?php\nfunction supply () : array\n\
    {\n    // 在此处插入语句。\n}\n```\n\n![image](img/Image00086.jpg) 下，插入一个语句返回一个包含四个混合值的数组\n\
    \n```php\nreturn array ( 75 , 3.142 , ‘Super PHP’ , True ) ;\n```\n\n![image](img/Image00087.jpg)\
    \ 在函数之后，添加一个调用该函数并将返回的数组值赋值给变量的语句\n\n```php\n$array = supply () ;\n```\n\n![image](img/Image00088.jpg)\
    \ 最后，添加一个循环来显示函数返回的每个值\n\n```php\nforeach( $array as $data )\n{\n    echo “Element\
    \ Value : $data <br>” ;\n}\n```\n\n"
