- raw: "Remember to include the & ampersand prefix to create a reference to the variable\
    \ value.\n\n![image](Image00005.jpg)\n\nNotice that the final function call gets\
    \ the ‘morning’ string from the parent scope.\n\n **Summary** \n\n •  Custom functions\
    \ allow PHP scripts to be modularized into sections of code that are easier to\
    \ understand and maintain\n\n •  Function names must begin with a letter or underscore\
    \ character and are not case-sensitive\n\n •  A function is defined by stating\
    \ its name after the  **function**  keyword, then parentheses and braces containing\
    \ statements\n\n •  A function accepting arguments is defined by including a comma-separated\
    \ list of parameters within the parentheses\n\n •  Optionally, a function definition\
    \ can specify the type of data to be passed from the caller by including a data\
    \ type description before the parameter name\n\n •  Argument data is normally\
    \ passed by value but can be passed by reference if the parameter name is given\
    \ an  **&**  prefix\n\n •  Default argument values can optionally be specified\
    \ in a function definition by assignment to the parameter name\n\n •  When a parameter\
    \ name is given a  **...**  splat operator prefix, multiple arguments can be passed\
    \ to that parameter to create an array\n\n •  Variables created outside a function\
    \ have global scope, but are not accessible from within a function block unless\
    \ it includes a declaration using the  **global**  keyword\n\n •  Variables created\
    \ inside a function have local scope so are only accessible from within that particular\
    \ function block\n\n •  Local variables lose their value when the program scope\
    \ leaves the function, but  **static**  variables retain their value\n\n •  The\
    \  **return**  keyword returns a single item to the caller and the function definition\
    \ can optionally specify the return data type\n\n •  An anonymous function definition\
    \ does not specify a name but is an expression so must end with a  **;**  semicolon\n\
    \n •  The  **use**  keyword and  **&**  ampersand prefix allow an anonymous function\
    \ to reference a local variable in the returning function\n\n6\n\n **Manipulating\
    \ strings** \n\n*This chapter demonstrates various ways to manipulate text strings\
    \ in PHP scripts.*\n\n[**Comparing characters**](#text00008.html#sec39)\n\n[**Searching\
    \ text**](#text00008.html#sec40)\n\n[**Extracting substrings**](#text00008.html#sec41)\n\
    \n[**Changing case**](#text00008.html#sec42)\n\n[**Formatting strings**](#text00008.html#sec43)\n\
    \n[**Making dates**](#text00008.html#sec44)\n\n[**Encoding entities**](#text00008.html#sec45)\n\
    \n[**Summary**](#text00008.html#sec46)\n\n **Comparing characters** \n\nPHP provides\
    \ a number of built-in functions to perform a comparison of two text strings.\
    \ The simple  **strcmp()**  function accepts two string arguments for comparison\
    \ and will return one of three integer values depending on the result. When the\
    \ strings exactly match,  **strcmp()**  will return zero. When the first string\
    \ argument is greater than the second,  **strcmp()**  will return 1, but when\
    \ the first string argument is less than the second,  **strcmp()**  will return\
    \ -1.\n\n![image](Image00019.jpg)\n\nStrictly speaking, the **strcmp()** returned\
    \ values will be a positive integer, zero, or a negative integer – but are typically\
    \ values of 1, 0, or -1.\n\nThe  **strncmp()**  function works in a similar way,\
    \ but accepts a third integer argument to specify the number of characters from\
    \ the start of the strings to be compared.\n\nThe  **strcmp()**  and  **strncmp()**\
    \  functions attach different importance to uppercase and lowercase characters\
    \ when comparing strings. When you prefer to ignore case, you can use the alternative\
    \ companion functions  **strcasecmp()**  and  **strncasecmp()**  instead.\n\n\
    To appreciate the results from each of the four comparison functions it is useful\
    \ to understand how the comparisons are actually made. Each character has a standard\
    \ numerical “ASCII” value where lowercase a-z is in the range 97-122 and uppercase\
    \ A-Z is in the range 65-90. Comparing the first value in each range we see that\
    \ “a” (97) is greater than “A” (65). Supplying these as arguments the  **strcmp()**\
    \  function would therefore return 1, as the first argument is greater than the\
    \ second. Conversely, if you specify “A” (65) as the first argument and “a” (97)\
    \ as the second argument then the  **strcmp()**  function would return -1, as\
    \ the first argument is less than the second. With string comparisons, each character\
    \ is compared in sequence to ensure that strings containing the same characters\
    \ in different order are not seen to be incorrectly equal. For example, comparing\
    \ “ABC” and “BAC” the first character “A” (65) is less than first character “B”\
    \ (66) so the  **strcmp()**  function would return -1, as the first argument is\
    \ less than the second.\n\n![image](Image00005.jpg)\n\nASCII is an abbreviation\
    \ for the American Standard Code for Information Exchange that specifies the universal\
    \ standard character coding scheme.\n\nThe ASCII value of any character can be\
    \ found by specifying the character as an argument to the PHP  **ord()**  function,\
    \ and the length of a string can be found by specifying it as the argument to\
    \ the PHP  **strlen()**  function.\n\n![image](Image00029.jpg)\n\ncharacters.php\n\
    \n![image](Image00098.jpg) Begin a PHP script with statements to initialize four\
    \ variables with string values\n\n **<?php** \n\n**$str1 \\= ‘PHP In Easy Steps’\
    \ ;**\n\n**$str2 \\= ‘PHP In Easy Steps’ ;**\n\n**$str3 \\= ‘PHP Easy Steps’ ;**\n\
    \n**$str4 \\= ‘php in easy steps’ ;**\n\n![image](Image00099.jpg) Next, add statements\
    \ to compare the strings\n\n**echo “’$str1’ versus ‘$str2’ : “ .strcmp( $str1\
    \ , $str2 ). ’<br>’ ;**\n\n**echo “’$str1’ versus ‘$str3’ : “ .strcmp( $str1 ,\
    \ $str3 ). ’<br>’ ;**\n\n**echo “’$str1’ versus ‘$str4’ : “ .strcmp( $str1 , $str4\
    \ ). ’<hr>’ ;**\n\n![image](Image00100.jpg) Now, add a statement for a case-insensitive\
    \ comparison\n\n**echo ‘Comparison Ignoring Case :<br>’ ;**\n\n**echo “’$str1’\
    \ versus ‘$str4’ : “ .strcasecmp( $str1 , $str4 ) ;**\n\n![image](Image00101.jpg)\
    \ Finally, add a loop to count and display the total ASCII code value of the first\
    \ string\n\n**$total \\= 0 ;**\n\n**for ( $i \\= 0 ; $i < strlen( $str1 ) ; $i\
    \ ++ )**\n\n **{** \n\n**$total += ord( $str1 \\[ $i \\] ) ;**\n\n **}** \n\n\
    **echo “<hr>ASCII Total $str1 : $total ” ;**\n\n **?>** \n\n![image](Image00102.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **characters.php**\
    \  then open the page via HTTP to see the string comparisons\n\n![image](Image00103.jpg)\n\
    \n![image](Image00006.jpg)\n\nCharacter order is relevant as the ASCII totals\
    \ for two differently ordered strings could be equal, but the strings would not\
    \ match.\n\n **Searching text** \n\nPHP provides a number of built-in functions\
    \ to search a string to find a specified substring or single character. The simple\
    \  **strpos()**  function accepts two arguments to specify the string in which\
    \ to search, and the substring to find. It will search in sequence from the start\
    \ of the string to find a match. When a match is found the search halts and the\
    \  **strpos()**  function returns an integer, which is the character index number\
    \ position within the string at which the first occurrence of a match begins.\
    \ When no match is found the  **strpos()**  function returns  **FALSE**  .\n\n\
    The  **strrpos()**  function works in a similar way but returns the index number\
    \ position at which the first occurrence of a match begins when searching in reverse\
    \ order, from the end of the string.\n\nOther PHP search functions can return\
    \ a part of the searched string, rather than an index number indicating a match\
    \ position.\n\nThe  **strstr()**  function accepts two arguments to specify the\
    \ string in which to search, and the substring to find. It will search in sequence\
    \ from the start of the string to find a match. When a match is found, the search\
    \ halts and the  **strstr()**  function returns the remainder of the searched\
    \ string from where the first occurrence of a match begins. When no match is found\
    \ the  **strstr()**  function returns  **NULL**  .\n\n![image](Image00019.jpg)"
