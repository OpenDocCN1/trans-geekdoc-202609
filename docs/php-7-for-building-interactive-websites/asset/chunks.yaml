    ![image](Image00005.jpg)


    Adopt a consistent naming style for your variables – such as all lowercase `$my_var`,
    or “camelcase” `$myVar` .


    ## Producing arrays


    ### Indexed arrays


    An array variable can store multiple items of data in sequential array “elements”
    that are numbered (“indexed”) starting at zero. So the first array value is stored
    in array element number zero. Individual array element values can be referenced
    using the variable name followed by the index number in square brackets. For example,
    `$days[0]` references the value stored in the first array element of an array
    variable named “days”. Similarly, `$days[1]` references the value stored in the
    second array element, and so on. Variable arrays can be created by making multiple
    statements that assign values to successive elements, or by making a single statement
    using a PHP `array()` function to fill the elements:


    ```php

    $days[] = ‘Monday’ ; $days[] = ‘Tuesday’ ; $days[] = ‘Wednesday’ ;

    ```


    or...


    ```php

    $days = array( ‘Monday’ , ‘Tuesday’ , ‘Wednesday’ ) ;

    ```


    Both create an array where the value stored in each element can be referenced
    using its index number, such as `$days[0]` .


    ![image](Image00045.jpg)


    ![image](Image00006.jpg)


    Square brackets denote “element” so are not needed after the variable name in
    the assignment using the `array()` function – they are only needed when addressing
    an element.


    ### Associative arrays


    When creating an array, you can optionally specify a key name for each element
    that can be used to reference that element’s value:


    ```php

    $months[''jan''] = ‘January’ ;

    $months[''feb''] = ‘February’ ;

    $months[''mar''] = ‘March’ ;

    ```


    or...


    ```php

    $months = array( ‘jan’ => ‘January’ , ‘feb’ => ‘February’ , ‘mar’ => ‘March’ )
    ;

    ```


    Both create an array where the value stored in each element can be referenced
    using its key name, such as `$months[''jan'']` .


    ### Traversing arrays


    All elements of an array can be traversed using a `foreach` loop to reference
    each element’s value in turn and assign it to a variable:


    ```php

    foreach( $months as $value ) {

    // Use the current $value

    }

    ```


    The keys can also be accessed on each iteration of the loop using


    ```php

    foreach( $months as $key => $value ) {

    // Use the current $key and $value

    }

    ```


    The `foreach` construct exists specifically for arrays and provides an easy way
    to traverse all array keys and values. See [here](#text0006.html#sec28) for more
    on loops.


