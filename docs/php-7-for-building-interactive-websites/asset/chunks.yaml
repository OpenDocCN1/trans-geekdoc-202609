- raw: "As there are five “book” nodes on the same hierarchical level, in this example\
    \ they are created as an array. Each node can therefore be individually referenced\
    \ using its node name and array index number.\n\n **Looping through nodes** \n\
    \nThe SimpleXML object provides methods to work with the data contained within\
    \ its data structure. Usefully, its  **children()**  method returns all child\
    \ nodes and can be used to loop through the nodes to retrieve each node’s content:\n\
    \n![image](Image00029.jpg)\n\nnodes-loop.php\n\n![image](Image00085.jpg) Begin\
    \ a PHP script with a statement to set a page title\n\n **<?php** \n\n**echo ‘<title>PHP\
    \ SimpleXML</title>’ ;**\n\n![image](Image00086.jpg) Add a statement to load the\
    \ XML data or quit\n\n**$xml \\= simplexml\\_load\\_file( ‘catalog.xml’ )**\n\n\
    **or die( ‘Unable to load data!’ ) ;**\n\n![image](Image00087.jpg) Next, initialize\
    \ an iteration counter at zero\n\n**$counter \\= 0 ;**\n\n![image](Image00088.jpg)\
    \ Now, add a loop to increment the counter and to display all “title” and “category”\
    \ child node content\n\n**foreach( $xml \\->children() as $book )**\n\n **{**\
    \ \n\n**$counter ++ ;**\n\n**echo ‘Book ‘ . $counter . ’ : ‘ ;**\n\n**echo $book\
    \ \\-> title .**\n\n**’ in easy steps \\[’ . $book \\-> category . ’\\]<hr>’ ;**\n\
    \n **}** \n\n![image](Image00089.jpg) Save the document in your web server’s \
    \ **/htdocs**  directory as  **nodes-loop.php**  , alongside the  **catalog.xml**\
    \  file, then open the page via HTTP to see all node content\n\n![image](Image00218.jpg)\n\
    \n![image](Image00005.jpg)\n\nNested **foreach** loops can be used to traverse\
    \ child nodes of each descendant generation.\n\n **Getting attributes** \n\nValues\
    \ contained within attributes of a SimpleXMLElement object can be referenced by\
    \ stating the attribute name, within quotes, between brackets following the node\
    \ name. For example,  **$object->child\\[ ‘feature’ \\]**  accesses the value\
    \ within an attribute named “feature” of a top-level “child” element:\n\n![image](Image00029.jpg)\n\
    \nattribs.php\n\n![image](Image00085.jpg) Begin a PHP script with a statement\
    \ to set a page title\n\n **<?php** \n\n**echo ‘<title>PHP SimpleXML</title>’\
    \ ;**\n\n![image](Image00086.jpg) Add a statement to load the XML data or quit\n\
    \n**$xml \\= simplexml\\_load\\_file( ‘catalog.xml’ )**\n\n**or die( ‘Unable to\
    \ load data!’ ) ;**\n\n![image](Image00087.jpg) Next, retrieve the content of\
    \ the “title” element that is a child of the first “book” element\n\n**echo ‘First\
    \ book : ‘ .**\n\n**$xml \\-> book\\[0\\] \\-> title . ’ in easy steps<br>’ ;**\n\
    \n![image](Image00088.jpg) Now, display the value of the “cover” attribute of\
    \ the “title” element, that is a child of the first “book” element\n\n**echo ‘Cover\
    \ : ‘ . $xml \\-> book\\[0\\] \\-> title\\[‘cover’\\] . ’<br>’ ;**\n\n![image](Image00089.jpg)\
    \ Use the value retrieved in the previous step to display a cover image for the\
    \ first “book” element\n\n**echo ‘<img src=”’ . $xml \\-> book\\[0\\] \\-> title\\\
    [‘cover’\\] . ’”>’ ;**\n\n![image](Image00091.jpg) Save the document in your web\
    \ server’s  **/htdocs**  directory as  **nodes.php**  , alongside the  **catalog.xml**\
    \  file, then open the page via HTTP to see the attribute value and image\n\n\
    ![image](Image00219.jpg)\n\n![image](Image00006.jpg)\n\nNotice that each attribute\
    \ value here is the path and filename to an image in a directory at **/htdocs/images**\
    \ .\n\n **Looping through attributes** \n\nThe SimpleXML object  **children()**\
    \  method can once again be used to loop through nodes and retrieve the value\
    \ in a specified attribute of a particular node on each iteration:\n\n![image](Image00029.jpg)\n\
    \nattribs-loop.php\n\n![image](Image00085.jpg) Begin a PHP script with a statement\
    \ to set a page title\n\n **<?php** \n\n**echo ‘<title>PHP SimpleXML</title>’\
    \ ;**\n\n![image](Image00086.jpg) Add a statement to load the XML data or quit\n\
    \n**$xml \\= simplexml\\_load\\_file( ‘catalog.xml’ )**\n\n**or die( ‘Unable to\
    \ load data!’ ) ;**\n\n![image](Image00087.jpg) Next, initialize an iteration\
    \ counter at zero\n\n**$counter \\= 0 ;**\n\n![image](Image00088.jpg) Now, add\
    \ a loop to increment the counter and to display its value, then retrieve an attribute\
    \ value on each iteration to display an image\n\n**foreach( $xml \\->children()\
    \ as $book )**\n\n **{** \n\n**$counter ++ ;**\n\n**echo ‘ ‘ . $counter . ’: ‘\
    \ ;**\n\n**echo ‘<img src=”’ . $book \\-> title\\[‘cover’\\] . ’”>’ ;**\n\n **}**\
    \ \n\n![image](Image00089.jpg) Save the document in your web server’s **/htdocs**\
    \ directory as  **attribs-loop.php**  , alongside the  **catalog.xml**  file,\
    \ then open the page via HTTP to see the counter and image displayed on each iteration\
    \ of the loop\n\n![image](Image00220.jpg)\n\n![image](Image00005.jpg)\n\nA SimpleXMLElement\
    \ object also provides an **attributes()** method that returns an associative\
    \ array of all attribute names and values within an element. For example, **$obj->child->attributes()**\
    \ \n\n **Including feeds** \n\nWith the ability to access data from XML documents\
    \ within PHP scripts, as described on the previous pages, we can easily incorporate\
    \ data from external sources. Many Web Services are offered as freely available\
    \ RSS (Rich Site Summary/Really Simple Syndication) feeds. An online search for\
    \ “rss feed directory” will provide a number of websites where links to free feeds\
    \ are categorized. RSS feeds deliver regularly updated data in XML format.\n\n\
    ![image](Image00221.jpg)\n\nYou can discover more about RSS online at **[rssboard.org](http://www.rssboard.org)**\
    \ and can enter the URL of any RSS feed into their validator to see its XML elements.\n\
    \nThe Yahoo! Developer Network (YDN) offer lots of free RSS feeds with helpful\
    \ information at **[real.developer.yahoo.com/rss](http://real.developer.yahoo.com/rss)**\n\
    \nThe only requirement for their use is that you must include an attribution to\
    \ Yahoo! on the web page where they are displayed.\n\nOne of the free RSS feeds\
    \ offered by Yahoo! provides regularly updated content describing entertainment\
    \ news items, and can be found at **[http://news.yahoo.com/rss/entertainment](http://news.yahoo.com/rss/entertainment)**\n\
    \nThis is delivered to the web browser as an XML file and can be displayed by\
    \ the browser with buttons added to the outer elements, which you can click to\
    \ expand (+) or collapse (-) nested elements.\n\nRSS is a dialect of XML in which\
    \ all documents must have a top-level  **<rss>**  element containing a  **<channel>**\
    \  element. Data is enclosed within inner elements:\n\n![image](Image00222.jpg)\n\
    \n![image](Image00223.jpg)\n\nThe tags highlighted here can be used to retrieve\
    \ the data of most interest. The item tags shown collapsed each also contain title,\
    \ description, link and “pubDate” elements describing each item.\n\n![image](Image00029.jpg)\n\
    \nrss.php\n\n![image](Image00085.jpg) Begin a PHP script with a statement to load\
    \ XML data from the RSS feed or quit\n\n **<?php** \n\n**$url \\= ‘http://rss.news.yahoo.com/rss/entertainment’\
    \ ;**\n\n**$xml \\=**\n\n**simplexml\\_load\\_file( $url ) or die( ‘Unable to\
    \ load data!’ ) ;**\n\n![image](Image00086.jpg) Next, add a statement to load\
    \ a page header file\n\n**include( ‘includes/rss-header.html’ ) ;**\n\n![image](Image00087.jpg)\
    \ Now, display each news item, then a page footer\n\n**foreach ( $xml \\-> channel\
    \ \\-> item as $item ) {**\n\n**echo ‘<a href=”’ . $item \\-> link . ’”>’ . $item\
    \ \\-> title . ’</a>’ ;**\n\n**echo ‘<br><small>’ . $item \\-> pubDate . ’</small><br>’\
    \ ;**\n\n**echo $item \\-> description . ‘<hr>’ ; }**\n\n**include( ‘includes/rss-footer.html’\
    \ ) ;**\n\n![image](Image00088.jpg) Save the document in your web server’s  **/htdocs**\
    \  directory as  **rss.php**  then open the page via HTTP to see the news\n\n\
    ![image](Image00224.jpg)\n\n![image](Image00006.jpg)\n\nThe terms of use for Yahoo!\
    \ RSS feeds require you to display an attribution on your page.\n\n **Setting\
    \ parameters** "
