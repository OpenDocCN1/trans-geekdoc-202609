  trans: "\n\n一旦创建了“文件流”（filestream）对象，可以通过指定文件流作为 PHP `fgetc()` 函数的参数来一次一个字符地读取其内容。为了读取每个字符，可以在循环中反复调用此函数。`fgetc()`\
    \ 函数在到达文件末尾时将返回 false，并可以结束循环：\n\n![image](img/Image00142.jpg)\n\n![image](img/Image00019.jpg)\n\
    \n如果你使用 Windows 的记事本应用创建此文本文件，将在此示例中看到前面的字节顺序标记（BOM）字符。此处显示的 Notepad++ 应用不会添加这些字符。\n\
    \n![image](img/Image00029.jpg)\n\nreadchars.php\n\n![image](img/Image00008.jpg)\
    \ 开始一个 PHP 脚本，其语句尝试打开一个纯文本文件进行读取，如果失败则退出脚本\n\n```php\n<?php \n$filestream = fopen(\
    \ ‘title.txt’ , ‘r’ )\nor die( ‘Unable to open file!’ ) ;\n```\n\n![image](img/Image00010.jpg)\
    \ 接下来，添加一个循环，在成功后逐字符读取文本文件并显示其全部内容\n\n```php\nwhile( $char = fgetc( $filestream\
    \ ) )\n{ echo $char . ’ \\* ‘ ; }\n```\n\n![image](img/Image00012.jpg) 现在，记得关闭文件流\n\
    \n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00014.jpg) 将文档保存到你\
    \ Web 服务器的 `/htdocs` 目录下并命名为 `readchars.php`，与要读取的纯文本文件放在一起，然后通过 HTTP 打开页面查看文件字符\n\
    \n![image](img/Image00143.jpg)\n\n![image](img/Image00006.jpg)\n\n当流中没有更多字符可以获取时，`fgetc()`\
    \ 函数返回 false。\n\n## 写入文件\n\n一旦创建了指定写入模式的“文件流”对象，就可以创建一个文本文件。可以通过向 PHP `fwrite()`\
    \ 函数指定文件流和文件名来将文本写入文件。为了格式化文本，还可以写入不可打印的不可见字符来创建换行和制表间距：\n\n| **字符：** | **描述：**\
    \ |\n| --- | --- |\n| `\\n` | 换行 移动到下一行 |\n| `\\r` | 回车 移动到行开头 |\n| `\\t` | 制表符\
    \ 沿行移动到下一个制表位 |\n\n![image](img/Image00019.jpg)\n\n包含不可打印字符的字符串必须包含在双引号内，以便 PHP\
    \ 能够解释它们。\n\n![image](img/Image00029.jpg)\n\nwrite.php\n\n![image](img/Image00008.jpg)\
    \ 开始一个 PHP 脚本，使用语句分配文本，包括用于格式化的不可打印字符\n\n```php\n<?php\n$poem= “\\r\\n\\tI saw\
    \ a man who looked” ;\n$poem .= “\\r\\n\\tWith a wistful eye” ;\n$poem .= “\\\
    r\\n\\tUpon that little of blue” ;\n$poem .= “\\r\\n\\tWhich prisoners the sky”\
    \ ;\n```\n\n![image](img/Image00010.jpg) 接下来为要写入的文件指定名称\n\n```php\n$filename=\
    \ ‘poem.txt’ ;\n```\n\n![image](img/Image00012.jpg) 尝试创建一个用于写入的纯文本文件，如果失败则退出脚本\n\
    \n```php\n$filestream= fopen( $filename , ‘w’ )\nor die( ‘Unable to open file!’\
    \ ) ;\n```\n\n![image](img/Image00014.jpg) 写入文件并显示总写入字节数的确认信息\n\n```php\n$num=\
    \ fwrite( $filestream , $poem ) ;\nif( $num )\n{\necho $num bytes written to $filename\
    \ ” ;\n}\n```\n\n![image](img/Image00015.jpg) 现在，记得关闭文件流\n\n```php\nfclose( $filestream\
    \ ) ;\n```\n\n![image](img/Image00017.jpg) 将文档保存到你 Web 服务器的 `/htdocs` 目录下并命名为\
    \ `write.php`，然后通过 HTTP 打开页面以确认文本文件已写入\n\n![image](img/Image00144.jpg)\n\n![image](img/Image00026.jpg)\
    \ 使用文件资源管理器导航到你 Web 服务器的 `/htdocs` 目录，查看 PHP 脚本创建的文件\n\n![image](img/Image00145.jpg)\
    \ 打开文件查看 PHP 脚本写入的文本\n\n![image](img/Image00146.jpg)\n\n![image](img/Image00005.jpg)\
    \ 你可以反复运行此示例，每次它都会擦除内容然后重新写入。\n\n## 追加文本\n\n一旦创建了指定追加模式的“文件流”对象，就可以打开一个文本文件并在末尾添加文本。可以通过向\
    \ PHP `fwrite()` 函数指定文件流和文件名来向文件中追加文本。该过程与写入文件相同，不同之处在于在文本写入文件之前，文件指针被位于现有内容的末尾：\n\
    \n![image](img/Image0029.jpg)\n\nappend.php\n\n![image](img/Image00008.jpg) 开始一个\
    \ PHP 脚本，使用语句分配文本，包括用于格式化的不可打印字符\n\n```php\n<?php \n$info= “\\r\\n\\r\\n\\tThe\
    \ Ballad of” ;\n$info .= “\\r\\n\\tOscar Wilde” ;\n```\n\n![image](img/Image00010.jpg)\
    \ 接下来，为要追加的文件指定一个名称\n\n```php\n$filename= ‘poem.txt’ ;\n```\n\n![image](img/Image00012.jpg)\
    \ 尝试打开用于追加的纯文本文件，如果失败则退出脚本\n\n```php\n$filestream= fopen( $filename , ‘a’ )\n\
    or die( ‘Unable to open file!’ ) ;\n```\n\n![image](img/Image00014.jpg) 写入文本并显示总追加字节数的确认\n\
    \n```php\n$num= fwrite( $filestream , $info ) ;\nif( $num )\n{\necho $num bytes\
    \ appended to $filename ” ;\n}\n```\n\n![image](img/Image00015.jpg) 现在，记得关闭文件流\n\
    \n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00017.jpg) 将文档保存到你\
    \ Web 服务器的 `/htdocs` 目录下并命名为 `append.php`，然后通过 HTTP 打开页面以确认文本已追加\n\n![image](img/Image00143.jpg)\n\
    \n![image](img/Image00006.jpg) 注意不可打印字符必须包含在双引号内以便解释。\n\n![image](img/Image00026.jpg)\
    \ 导航到你 Web 服务器的 `/htdocs` 目录并查看 PHP 脚本创建的文件\n\n![image](img/Image00145.jpg)\n\n\
    ## 覆盖文本\n\n要意识到，当你以写入模式写入文件时，它将覆盖任何现有内容：\n\n![image](img/Image0029.jpg)\n\noverwrite.php\n\
    \n![image](img/Image00008.jpg) 开始一个 PHP 脚本，尝试打开一个现有文本文件进行写入，如果失败则退出脚本\n\n```php\n\
    <?php \n$filestream= fopen( ‘poem.txt’ , ‘w’ )\nor die( ‘Unable to open file!’\
    \ ) ;\n```\n\n![image](img/Image00010.jpg) 成功后向文件中写入新文本\n\n```php\nfwrite( $filestream\
    \ , ‘Overwritten!’ ) ;\n```\n\n![image](img/Image00012.jpg) 现在，记得关闭文件流\n\n```php\n\
    fclose( $filestream ) ;\n```\n\n![image](img/Image00014.jpg) 将文档保存到你 Web 服务器的\
    \ `/htdocs` 目录下并命名为 `overwrite.php`，然后通过 HTTP 打开页面并重新打开文本文件以查看其内容已被覆盖\n\n![image](img/Image00144.jpg)\n\
    \n![image](img/Image0019.jpg) 写入文件时要小心，因为很容易覆盖。\n\n## 错误处理\n\n你可以预判可能的错误并在错误发生时使用\
    \ `die()` 函数或 `exit()` 函数终止运行中的脚本。如果没有这种应急措施，当错误发生时，默认错误处理器会提供一个有用但难看的消息。例如，`fopen(\
    \ ‘nonsuch.txt’ , ‘r’ )` 打开一个不存在的文件：\n\n![image](img/Image00150.jpg)\n\n![image](img/Image00005.jpg)\
    \ 当错误发生时，并不总是希望终止脚本，但你可以创建一个自定义错误处理器来提供比默认 PHP 错误处理器更具友好的消息。自定义错误处理器只是一个具有此语法的函数：\n\
    \n```php\nfunction error_handler( *level* , *message* , *file* , *line* , *context*\
    \ )\n```\n\n只有前两个参数是必须，其余是可选的。第一个参数是一个数值，代表一个常量，指示发生错误的严重程度：\n\n"
