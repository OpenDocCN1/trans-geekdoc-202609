- raw: "A string can be split into individual parts using the  **strtok()**  function\
    \ to specify the string and a delimiter token around which the parts should be\
    \ split. For example, if you want to split a string into individual words you\
    \ can specify the space character as the delimiter token. The first part of the\
    \ string, up to the delimiter token will be returned by the function. Interestingly,\
    \ the  **strtok()**  function remembers its position in the string, so subsequent\
    \ calls need only specify the delimiter token to return the next part of the string,\
    \ until no further delimiters are found. Splitting a string in this way can best\
    \ be achieved using a loop to make subsequent calls to the  **strtok()**  function,\
    \ until it reaches the end of the string.\n\n![image](Image00029.jpg)\n\nformat.php\n\
    \n![image](Image00098.jpg) Begin a PHP script with statements to initialize a\
    \ variable with a string and display its value\n\n **<?php** \n\n**$str \\= ‘|\
    \ PHP String Fun |’ ; echo “Original String : $str ” ;**\n\n![image](Image00099.jpg)\
    \ Next, add statements to display reversed, repeated and trimmed versions of the\
    \ original string\n\n**echo ‘<hr>Reversed String : ‘ .strrev( $str ) ;**\n\n**echo\
    \ ‘<hr>Repeated String : ’ .str\\_repeat( $str , 3 ) ;**\n\n**echo ‘<hr>Trimmed\
    \ String : ‘ .trim( $str , ‘|’ ) ;**\n\n![image](Image00100.jpg) Now, add a statements\
    \ to display a 30-character version of the string, padded with asterisks at the\
    \ beginning\n\n**$pad \\= str\\_pad( $str , 30 , ‘\\*’ , STR\\_PAD\\_LEFT ) ;**\n\
    \n**echo “<hr>Padded String : $pad ” ;**\n\n![image](Image00101.jpg) Finally,\
    \ add statements to split the string around spaces and display each individual\
    \ part separated by an ... ellipsis\n\n**echo ‘<hr>Split String : ‘ ;**\n\n**$token\
    \ \\= strtok( $str , ‘ ‘ );**\n\n**while ( $token )**\n\n **{** \n\n**echo “ $token\
    \ ... “ ; $token \\= strtok( ‘ ‘ ) ;**\n\n **}** \n\n **?>** \n\n![image](Image00102.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **format.php**\
    \  then open the page via HTTP to see the string formatted in several ways\n\n\
    ![image](Image00107.jpg)\n\n![image](Image00006.jpg)\n\nYou must specify the delimiter\
    \ on each subsequent call to **strtok()** to have it continue forward to the next\
    \ part of the string.\n\n **Making dates** \n\nThe PHP  **date()**  function will\
    \ return a date string when called, but requires a string argument to specify\
    \ a format for the date string. This format string can comprise a series of letter\
    \ options for date and time. For example,  **date( ‘n/j/y’ )**  might return “4/22/16”.\
    \ Popular options are listed below along with a brief description:\n\n| **Option:**\
    \ || **Description:** || **Example:** |\n\n| --- | --- | --- |\n\n| **Y** || Year\
    \ as four digits || 2014 |\n\n| **y** || Year as two digits || 14 |\n\n| **n**\
    \ || Month as one or two digits || 7 |\n\n| **m** || Month as two digits || 07\
    \ |\n\n| **F** || Month full name || February |\n\n| **M** || Month name as three\
    \ letters || Feb |\n\n| **j** || Day as one or two digits || 4 |\n\n| **d** ||\
    \ Day as two digits || 04 |\n\n| **l** || Weekday full name || Monday |\n\n| **D**\
    \ || Weekday as three letters || Mon |\n\n| **S** || Ordinal suffix as two letters\
    \ || th |\n\n| **H** || Hour in 24-hour format || 14 |\n\n| **i** || Minutes ||\
    \ 45 |\n\n| **s** || Seconds || 30 |\n\n| **a** || Ante or post meridiem || am\
    \ |\n\n![image](Image00019.jpg)\n\nThe weekday full name option is a lowercase\
    \ “L”.\n\n![image](Image00005.jpg)\n\nYou can discover more **date()** function\
    \ options in the PHP manual online at **[php.net/manual](http://www.php.net/manual)**\
    \ \n\nBy default, the timezone is set to the Universal Time Clock (UTC) but you\
    \ can set it to your own timezone by specifying it as an argument to the  **date\\\
    _default\\_timezone\\_set()**  function, and see the currently set timezone with\
    \  **date\\_default\\_timezone\\_get()**  .\n\nYou may also create your own timestamp\
    \ using the intelligent  **strtotime()**  function. This can accept a date string\
    \ argument and return a timestamp that can be supplied as an optional second argument\
    \ to the  **date()**  function. The argument specified to  **strtotime()**  can\
    \ be a regular text date, such as “July 4, 2017”. Additionally, you can specify\
    \ an argument such as “yesterday”, “+3months” or “next Wednesday” and the  **strtotime()**\
    \  function will try to figure it out and return an appropriate timestamp.\n\n\
    ![image](Image00029.jpg)\n\ndate.php\n\n![image](Image00098.jpg) Begin a PHP script\
    \ with statements to display the current date, day, time and current default timezone\n\
    \n **<?php** \n\n**echo ‘Date : ‘ .date( ‘jS F Y’ ). ’<br>’ ;**\n\n**echo ‘Day\
    \ : ‘ .date( ‘l’ ). ’<br>’ ;**\n\n**echo ‘Time : ‘ .date( ‘h:i:s a’ ). ’<br>’\
    \ ;**\n\n**echo ‘Timezone : ‘ .date\\_default\\_timezone\\_get(). ’<hr>’ ;**\n\
    \n![image](Image00099.jpg) Next, add statements to change the default timezone\
    \ and display a confirmation, then show the current time there\n\n**date\\_default\\\
    _timezone\\_set( ‘America/New\\_York’ ) ;**\n\n**echo ‘Timezone now : ‘ .date\\\
    _default\\_timezone\\_get() ;**\n\n**echo ‘<br>Time now : ‘ .date( ‘h:i:s a’ ).\
    \ ’<hr>’ ;**\n\n![image](Image00100.jpg) Now, add statements to create a timestamp\
    \ for the next day, then display its day name and date\n\n**$d \\= strtotime(\
    \ ‘tomorrow’ ) ;**\n\n**echo ‘Tomorrow : ‘ .date( ‘l, jS F Y’ , $d ). ’<br>’ ;**\n\
    \n![image](Image00101.jpg) Finally, add statements to create a timestamp for a\
    \ memorable date, then display its month and day number\n\n**$d \\= strtotime(\
    \ ‘July 11, 1994’ ) ;**\n\n**echo ‘David\\\\’s Birthday : ‘ .date( ‘F jS’ , $d\
    \ ) ;**\n\n **?>** \n\n![image](Image00102.jpg) Save the document in your web\
    \ server’s  **/htdocs**  directory as  **date.php**  then open the page via HTTP\
    \ to see the date strings formatted by the options\n\n![image](Image00108.jpg)\n\
    \n![image](Image00005.jpg)\n\nNotice that you can include separator characters\
    \ such as **:** and **/** in the format string.\n\n![image](Image00006.jpg)\n\n\
    Some countries prefer date order of M/D/ Y while others prefer D/M/ Y so you can\
    \ choose your preferred date format options.\n\n **Encoding entities** \n\nThere\
    \ are two PHP functions available to encode HTML code, so that all characters\
    \ of special significance or unusual characters are replaced by “entity” equivalents.\
    \ The  **htmlentities()**  function encodes all characters below, which each have\
    \ an entity equivalent:\n\n![image](Image00109.jpg)\n\n![image](Image00005.jpg)\n\
    \nCall the PHP function **get\\_html\\_translation\\_ table()** with the constant\
    \ argument of **HTML\\_ENTITIES** or **HTML\\_SPECIALCHARS** to return an array\
    \ of all represented characters.\n\nUnless you are concerned about non-English\
    \ language characters, it is generally preferable to use the alternative  **htmlspecialchars()**\
    \  function to encode only characters of special HTML significance:\n\n •   **&**\
    \  ampersand – becomes  **&amp;** \n\n •   **“**  double quote – becomes  **&quot;**\
    \ \n\n •   **‘**  single quote – becomes  **&#039;** \n\n •   **<**  less than\
    \ – becomes  **&lt;** \n\n •   **\\>**  greater than – becomes  **&gt;** \n\n\
    One good reason to encode HTML snippets with PHP is to prevent malicious JavaScript\
    \ code being executed unintentionally by the web browser. Encoding HTML tags into\
    \ entities ensures that the HTML  **<script>**  tag will not be recognized, so\
    \ its JavaScript code contents will not be executed:\n\n![image](Image00029.jpg)\n\
    \nencode.php\n\n![image](Image00098.jpg) Create a PHP script with statements to\
    \ initialize a variable with an HTML snippet and display its value\n\n **<?php**\
    \ \n\n**$html \\= ‘<script>window.location=”index.html”</script>’ ;**\n\n**//\
    \ Statement to be inserted here.**\n\n**echo $html ;**\n\n **?>** \n\n![image](Image00099.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **encode.php**\
    \  then open the page via HTTP to hopefully see the HTML code snippet\n\n![image](Image00110.jpg)\n\
    \nThe browser has interpreted the code and relocated to the server’s index page\
    \ because it recognized the HTML  **<script>**  tag.\n\n![image](Image00100.jpg)\
    \ Return to the PHP script and insert a statement to encode special HTML characters\n\
    \n**$html \\= htmlspecialchars( $html ) ;**"
