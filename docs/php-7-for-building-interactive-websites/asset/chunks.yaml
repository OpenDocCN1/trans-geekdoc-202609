    \n[**Summary**](#text00010.html#sec61)\n\n **Reading files** \n\nThe ability to\
    \ read and write files located on the web server is useful to log information\
    \ and to provide page content. In order to process files, a “filestream” object\
    \ must first be created using the PHP  **fopen()**  function. This requires two\
    \ arguments to specify the name or path of the file and a file “mode”. The file\
    \ mode determines the nature of the operation to be performed and places the file\
    \ pointer at a suitable position within the file:\n\n| **File mode:** || **Operation:**\
    \ |\n\n| --- | --- |\n\n| r || Open an existing file to read File pointer starts\
    \ at the beginning of the file |\n\n| w || Discard all contents of an existing\
    \ file or create a new file if none exists File pointer starts at the beginning\
    \ of the file |\n\n| a || Open an existing file and preserve all contents File\
    \ pointer starts at the end of the file |\n\n| r+ || Open a file to read from\
    \ or write to File pointer starts at the beginning of the file |\n\n| w+ || Open\
    \ a file to write to or read from Discard all contents of an existing file or\
    \ create a new file if none exists File pointer starts at the beginning of the\
    \ file |\n\n| a+ || Open a file to read from or write to and preserve all contents\
    \ File pointer starts at the end of the file |\n\n![image](Image00019.jpg)\n\n\
    The file mode specifier must appear within quote marks when supplied as an argument\
    \ to the **fopen()** function.\n\nIt is good practice to always provide an alternative\
    \ with the  **die()**  function in case the attempt to create a filestream fails.\n\
    \n![image](Image00005.jpg)\n\nSpecify an explanatory message as an argument to\
    \ the **die()** function.\n\nWhen a filestream is created successfully, the file\
    \ can be read by specifying the filestream and byte size as arguments to the \
    \ **fread()**  function. If the whole file is to be read it is convenient to use\
    \ the  **filesize()**  function to specify the byte size of the file to be read.\n\
    \nUpon completion of any file operation, the filestream must be destroyed by specifying\
    \ it as an argument to the  **fclose()**  function.\n\n![image](Image00138.jpg)\n\
    \n![image](Image00029.jpg)\n\nread.php\n\n![image](Image00008.jpg) Begin a PHP\
    \ script with statements that attempt to open a plain text file for reading, or\
    \ exit the script upon failure\n\n **<?php** \n\n**$filestream \\= fopen( ‘manifesto.txt’\
    \ , ‘r’ )**\n\n **o** r **die( ‘Unable to open file!’ ) ;**\n\n![image](Image00010.jpg)\
    \ Next, add a statement to read the text file upon success and display its entire\
