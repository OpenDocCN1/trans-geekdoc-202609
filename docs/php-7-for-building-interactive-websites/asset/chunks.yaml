    ## Examining conditions


    ### Conditional operator


    The conditional operator `?:` is also known as the “ternary” operator as it has
    three components. This operator first evaluates an expression for a `TRUE` or
    `FALSE` Boolean value, then returns one of two specified results depending on
    the evaluation. The conditional operator syntax looks like this:


    ```

    ( test-expression ) ? result-if-true : result-if-false ;

    ```


    The conditional operator can be used to evaluate whether a given number is one
    or more, to ensure correct grammar in output regarding singular and plural items.
    This avoids awkward phrases such as “There is 5”:


    ```php

    $verb = ( $number == 1 ) ? ‘is’ : ‘are ‘;

    echo “There $verb $number”;

    ```


    In this case, when the `$number` variable has a value of one, the ‘is’ result
    will be assigned to the `$verb` variable, otherwise the ‘are’ result will be assigned.


    ![image](Image00019.jpg) Do not use more than one `?:` conditional operator in
    a single statement as the results may be unpredictable.


    The conditional operator can also be used to evaluate whether a given number is
    odd or even (“parity”) by examining if there is any remainder after dividing the
    number by two, then assign an appropriate string result like this:


    ```php

    $parity = ( $number % 2 == 0 ) ? ‘Odd’ : ‘Even’;

    echo “$number is $parity”;

    ```


    In this case, when the modulus operation returns a value of one, the ‘Odd’ result
    will be assigned to the `$parity` variable, otherwise the ‘Even’ result will be
    assigned.


    ### Null coalescing operator


    PHP has a special `NULL` value that is a built-in constant, which represents a
    variable with no value whatsoever – not even zero. The null coalescing operator
    `??` can be used to return the first operand if it exists and is not null, otherwise
    the second operand. This is useful to avoid multiple `isset()` checks.


    ```php

    $username = $_GET[''user''] ?? ''guest'';

    ```


    The null coalescing operator `??` is a shorthand for the ternary operator. It
    checks if a variable is set and not null.


    ```php

    $username = isset($_GET[''user'']) ? $_GET[''user''] : ''guest'';

    ```


    This is exactly the same as:


    ```php

    $username = $_GET[''user''] ?? ''guest'';

    ```


    The null coalescing operator can also be used to assign a default value to a variable
    if it is null.


    ```php

    $username = $_GET[''user''] ?? ''guest'';

    ```


    The null coalescing operator `??` can also be used with arrays.


    ```php

    $name = $array[''name''] ?? ''Anonymous'';

    ```


    The null coalescing operator is a convenient way to handle potential null values
    in your PHP code.


    The null coalescing operator `??` can be used to return the first value that is
    not null.


    ```php

    $result = $a ?? $b ?? $c;

    ```


    The null coalescing operator `??` is also available as the null coalescing assignment
    operator `??=`.


    ```php

    $a ??= $b;

    ```


    The null coalescing operator can be used in complex expressions.


    ```php

    $result = $a ?? $b;

    ```


    The null coalescing operator `??` is a powerful tool for handling null values
    in PHP.


    ```php

    $value = $a ?? ''default'';

    ```


    The null coalescing operator `??` is also used to simplify code.


    ```php

    $value = $array[''key''] ?? ''default'';

    ```

