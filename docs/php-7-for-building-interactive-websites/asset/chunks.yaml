- raw: "**foreach( $data as $type )**\n\n **{** \n\n**var\\_dump( $type ) ;**\n\n\
    **echo ‘<br> ‘ ;**\n\n **}** \n\n![image](Image00039.jpg) Finally, insert statements\
    \ to destroy the filestream resource then attempt to get its data type once more\n\
    \n**fclose( $filestream ) ;**\n\n**echo gettype( $filestream ) ;**\n\n![image](Image00040.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **types.php**\
    \  then open the page via HTTP to see the data types and values get displayed\n\
    \n![image](Image00050.jpg)\n\n![image](Image00005.jpg)\n\nThe creation and use\
    \ of PHP filestream resources are demonstrated fully in [Chapter 8](#text00010.html)\
    \ .\n\n![image](Image00005.jpg)\n\nThe Boolean constants **TRUE** and **FALSE**\
    \ are not case-sensitive, so may be written as **true** and **false** .\n\n **Defining\
    \ constants** \n\nFixed data values that will never change in a script should\
    \ be stored in a PHP “constant”, rather than in a variable. A constant is a named\
    \ container in which numeric or string values can be stored and can be referenced\
    \ using the constant’s name.\n\nUnlike a variable, a constant cannot contain Boolean\
    \ values of  **TRUE**  or  **FALSE**  , nor represent an object, nor a  **NULL**\
    \  empty value. Additionally, a constant cannot be changed as the script proceeds.\
    \ This safeguards the constant value from accidental alteration and is good programming\
    \ practice.\n\n![image](Image00005.jpg)\n\nWhen creating a variable, always consider\
    \ whether its value will ever change – if it will not you should create a constant\
    \ instead. For example, **define( ‘PI’ , 3.14 ) ;** \n\nConstant names are subject\
    \ to the same naming conventions as variables, but it is traditional to use uppercase\
    \ characters for constant names – to easily distinguish them from variable names.\
    \ Constants are created using a  **define()**  function to specify the constant’s\
    \ name and the value it will contain, like this:\n\n **define( *‘NAME’ , value*\
    \ ) ;** \n\nMost significantly, constant names are not prefixed by a $ dollar\
    \ sign, so they cannot be included in mixed strings for display – as PHP cannot\
    \ distinguish a constant name from a regular capitalized string. Consider these\
    \ statements for example:\n\n **define( ‘USER’ , ‘Mike’ ) ;** \n\n **echo “Hello\
    \ USER”** \n\n...the output here is  **Hello USER**  , not  **Hello Mike**  as\
    \ desired.\n\nIn order to include a constant’s value in an output string it must\
    \ be referenced separately and “concatenated” to the string with the PHP . concatenation\
    \ operator, like this:\n\n **echo ‘Hello ‘ . USER ;** \n\n...the output here is\
    \ now  **Hello Mike**  as desired.\n\nArray constants, in which all elements contain\
    \ fixed data values, can also be created using the  **define()**  function like\
    \ this:\n\n **define( ‘WEEKDAYS’ , \\[ ‘Mon’, ‘Tue’ , ‘Wed’ , ‘Thu’ , ‘Fri’ \\\
    ] ) ;** \n\n![image](Image00003.jpg)\n\nThe ability to create constant arrays\
    \ with the **define()** function is new in PHP 7.\n\nConstants defined by the\
    \ script author can be used just like the predefined constants that are built\
    \ into PHP, such as  **PHP\\_VERSION**  and  **PHP\\_OS**  that describe the version\
    \ and server operating system.\n\n![image](Image00029.jpg)\n\nconstant.php\n\n\
    ![image](Image00036.jpg) Create a valid HTML document, like the one listed [here](#text00003.html#sec5)\
    \ , then insert PHP tags into the body section\n\n **<?php** \n\n **\\# Statements\
    \ to be inserted here.** \n\n **?>** \n\n![image](Image00037.jpg) Now, insert\
    \ between the PHP tags a statement to create and initialize a constant\n\n**define(\
    \ ‘USER’ , ‘Mike’ ) ;**\n\n![image](Image00038.jpg) Add a statement to create\
    \ and initialize an array constant\n\n**define( ‘PETS’ , \\[ ‘Kitten’ , ‘Puppy’\
    \ , ‘Hamster’ \\] ) ;**\n\n![image](Image00039.jpg) Next, insert a statement to\
    \ display two constant values in a concatenated string\n\n**echo ‘<p>Hello ‘ .\
    \ USER . ‘ how is your ‘ . PETS\\[1\\] . ‘?</p>’ ;**\n\n![image](Image00040.jpg)\
    \ Insert a statement to display the predefined constant value of the PHP version\
    \ in a concatenated string\n\n**echo ‘<p>You are using PHP version ‘ . PHP\\_VERSION\
    \ ;**\n\n![image](Image00041.jpg) Finally, insert a statement to display the predefined\
    \ constant value of the host operating system in a string\n\n**echo ‘ running\
    \ on ‘ . PHP\\_OS . ‘</p>’ ;**\n\n![image](Image00042.jpg) Save the document in\
    \ your web server’s  **/htdocs**  directory as  **constant.php**  then open the\
    \ page via HTTP to see the results get displayed\n\n![image](Image00051.jpg)\n\
    \n![image](Image00019.jpg)\n\nYou cannot include constants in mixed strings, or\
    \ change their value, or begin their name with a dollar sign.\n\n![image](Image00006.jpg)\n\
    \nYou should always use uppercase for constant names to easily differentiate them\
    \ from variables in your code.\n\n **Exploring superglobals** \n\nPHP provides\
    \ several pre-defined variables that are always globally available anywhere within\
    \ any script. These are aptly known as “superglobals” and are described briefly\
    \ here:\n\n •   **$GLOBALS**  – an associative array containing references to\
    \ all variables which are currently defined in the global scope of the script,\
    \ according to context. The variable names are the keys of this associative array.\
    \ For example:\n\n **foreach( $GLOBALS as $key => $var) echo “&bull; $key “**\
    \ \n\n![image](Image00052.jpg)\n\n •   **$\\_SERVER**  – an array containing information\
    \ such as headers, paths and script locations, that is arbitrarily provided by\
    \ the web server\n\n •   **$\\_GET**  – an associative array of variables passed\
    \ to the script by appended URL parameters\n\n •   **$\\_POST**  – an associative\
    \ array of variables passed to the script by the HTTP POST method\n\n •   **$\\\
    _FILES**  – an associative array of uploaded file items passed to the script by\
    \ the HTTP POST method\n\n •   **$\\_COOKIE**  – an associative array of variables\
    \ passed to the script via HTTP from cookies on the user’s computer\n\n •   **$\\\
    _SESSION**  – an associative array containing variables available to each script\
    \ on a website until the user exits\n\n •   **$\\_REQUEST**  – an associative\
    \ array that by default contains the contents of  **$\\_GET**  ,  **$\\_POST**\
    \  and  **$\\_COOKIE** \n\n •   **$\\_ENV**  – an associative array of variables\
    \ passed to the current script by the shell environment under which the PHP parser\
    \ is running. Different systems will run different kinds of shells\n\n![image](Image00005.jpg)\n\
    \nThe **$\\_FILES** superglobal is used by the file upload example [here](#text00011.html#sec69)\
    \ .\n\n![image](Image00005.jpg)\n\nThe **$\\_POST** superglobal is used by the\
    \ HTML form submission example [here](#text00011.html#imga) .\n\n![image](Image00005.jpg)\n\
    \nThe **$\\_COOKIE** superglobal is used by the example [here](#text00012.html#sec75)\
    \ to get data from a cookie on the user’s computer.\n\n![image](Image00005.jpg)\n\
    \nThe **$\\_SESSION** superglobal is used by the example [here](#text00012.html#sec78)\
    \ to store data on the web server.\n\n![image](Image00029.jpg)\n\nsupers.php\n\
    \n![image](Image00036.jpg) Create a valid HTML document, like the one listed [here](#text00003.html#sec5)\
    \ , then insert PHP tags into the body section\n\n **<?php** \n\n **\\# Statements\
    \ to be inserted here.** \n\n **?>** \n\n![image](Image00037.jpg) Now, insert\
    \ between the PHP tags a statement to display your server software details\n\n\
    **echo ‘Web Server : ‘ . $\\_SERVER\\[ ‘SERVER\\_SOFTWARE’ \\] . ’<br>’ ;**\n\n\
    ![image](Image00038.jpg) Add a statement to display this script name\n\n**echo\
    \ ‘This Script : ‘ . $\\_SERVER\\[ ‘PHP\\_SELF’ \\] . ’<br>’ ;**\n\n![image](Image00039.jpg)\
    \ Next, insert statements to display the host name and the page request method\n\
    \n**echo ‘Host Name : ‘ . $\\_SERVER\\[ ‘HTTP\\_HOST’ \\] . ’<br>’ ;**\n\n**echo\
    \ ‘Request Method : ‘ . $\\_SERVER\\[ ‘REQUEST\\_METHOD’ \\] ;**\n\n![image](Image00040.jpg)\
    \ Insert a statement to display appended URL parameters\n\n**foreach( $\\_GET\
    \ as $key \\=> $value )**\n\n**{ echo ‘<hr>HTTP GET : ‘ . $key . ‘=’ . $value\
    \ ; }**\n\n![image](Image00041.jpg) Save the document in your web server’s  **/htdocs**\
    \  directory as  **supers.php** "
