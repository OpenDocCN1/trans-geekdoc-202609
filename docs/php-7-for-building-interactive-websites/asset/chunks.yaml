    echo $a % $b; // 1

    echo $a ** $b; // 25


    $a += $b; // 7

    $a -= $b; // 3

    $a *= $b; // 10

    $a /= $b; // 5

    $a %= $b; // 1

    $a **= $b; // 25

    ?>

    ```


    PHP 有一些处理数字的有用函数。例如，round($a)` 将 `$a` 四舍入到最近的整数，`number_format($a)` 为 `$a` 添加表示千位的逗号。


