- raw: "This script supplies its own error messages if it finds empty form fields,\
    \ or a MySQL error message if the data cannot be added to the database table.\n\
    \n **Confirming success** \n\nIt’s now time to test the message board process\
    \ to ensure that validation performs correctly, and posted messages appear on\
    \ the Forum page:\n\n![image](Image00067.jpg) Open the Post Message page, then\
    \ complete all fields and submit the form to see the message appear on the forum\n\
    \n![image](Image00210.jpg)\n\n![image](Image00211.jpg)\n\n![image](Image00006.jpg)\n\
    \nThe “Posted By” details are retrieved from the first\\_name, last\\_name, and\
    \ post\\_date columns of the MySQL “forum” database table.\n\n![image](Image00068.jpg)\
    \ Next, return to the Post Message page then attempt to post a message with no\
    \ Subject entry to see an error\n\n![image](Image00212.jpg)\n\n![image](Image00069.jpg)\
    \ Return to the Post Message page and post more messages as different users to\
    \ see them get added to the forum\n\n![image](Image00213.jpg)\n\n![image](Image00005.jpg)\n\
    \nYou can stop the MySQL Server service and post a message to see the MySQL error\
    \ report.\n\n![image](Image00005.jpg)\n\nNew forum messages are added to the bottom\
    \ of the table here but the order could be reversed by adding a **SORT** clause\
    \ to the SQL query.\n\n **Summary** \n\n •  A PHP script can connect to a MySQL\
    \ database using the  **mysqli\\_connect()**  function to specify the host server,\
    \ username, user password, and database name as its arguments\n\n •  The  **mysqli\\\
    _connect()**  function returns a database connection object, which can be supplied\
    \ as the argument to other functions, such as the  **mysqli\\_set\\_charset()**\
    \  function\n\n •  The  **die()**  function is equivalent to calling the  **exit()**\
    \  function to terminate the script\n\n •  The  **mysqli\\_connect\\_error()**\
    \  function returns an error message if a connection attempt fails, and can be\
    \ specified as the argument to the  **die()**  function, to be called as the script\
    \ halts\n\n •  It is recommended to place a connection script outside the regular\
    \  **/htdocs**  directory for security and incorporate it into other scripts,\
    \ when needed, using a  **require**  statement\n\n •  The  **mysqli\\_ping()**\
    \  function can verify connection to a specified database, then information can\
    \ be retrieved using  **mysqli\\_get\\_server\\_info()**  and  **mysqli\\_get\\\
    _host\\_info()** \n\n •  The  **mysqli\\_query()**  function attempts to execute\
    \ a SQL query on a specified database object and the  **mysqli\\_error()**  function\
    \ can be used to describe the cause of a failed attempt\n\n •  Database connections\
    \ should always be closed when they are no longer required by calling the  **mysqli\\\
    _close()**  function\n\n •  When a database query succeeds, the  **mysqli\\_num\\\
    _rows()**  function can reveal the total number of rows retrieved\n\n •  The \
    \ **mysqli\\_fetch\\_array()**  function can create an associative array of rows\
    \ and data from a successful query result\n\n •  The PHP  **empty()**  function\
    \ can be used to test a posted HTML form field to discover if it is empty\n\n\
    \ •  A row of data can be added to a MySQL database table, using the  **mysqli\\\
    _query()**  function, then a confirmation test can be made using the  **mysqli\\\
    _affected\\_rows()**  function\n\n •  The browser can be relocated to a new page\
    \ using the  **header()**  function to specify a  **‘Location:URL’**  argument\n\
    \n12\n\n **Adding Web Services** \n\n*This chapter demonstrates how to incorporate\
    \ XML data into PHP scripts.*\n\n[**Loading data**](#text00014.html#sec89)\n\n\
    [**Getting nodes**](#text00014.html#sec90)\n\n[**Getting attributes**](#text00014.html#sec91)\n\
    \n[**Including feeds**](#text00014.html#sec92)\n\n[**Setting parameters**](#text00014.html#sec93)\n\
    \n[**Selecting components**](#text00014.html#sec94)\n\n[**Summary**](#text00014.html#sec95)\n\
    \n **Loading data** \n\nThere are many “Web Services” available online, which\
    \ provide free data that can usefully be incorporated in your own web pages. Typical\
    \ examples might supply live stock prices, the latest news stories, or current\
    \ weather conditions.\n\nMost Web Services offer to supply data in the XML (eXtensible\
    \ Markup Language) file format. This is designed to be both human-readable and\
    \ machine-readable and is not reliant upon any single platform. For example, a\
    \ Java program can send XML data over the internet to a .NET application, and\
    \ vice versa.\n\nXML looks very much like HTML, but with XML you make up your\
    \ own element names. The element tags surround content and may include attributes,\
    \ as with HTML. It is important that each element has both opening and closing\
    \ tags, and that elements are correctly nested for the XML document to be “well-formed”.\n\
    \n![image](Image00019.jpg)\n\nAll XML documents must begin with an XML file type\
    \ declaration – like the one shown here on line one.\n\n![image](Image00214.jpg)\n\
    \n![image](Image00215.jpg)\n\ncatalog.xml\n\n![image](Image00005.jpg)\n\nThe **catalog.xml**\
    \ file shown here will be used in the next few examples to demonstrate how to\
    \ load XML data and how to access element values or attribute values.\n\nPHP provides\
    \ an XML parser called “SimpleXML” that can load an XML document into memory as\
    \ a hierarchical tree structure. The  **simplexml\\_load\\_file()**  function\
    \ requires the XML file name and path to transform the document into a data structure\
    \ comprising “SimpleXMLElement” objects. The data structure can then be explored\
    \ using the  **var\\_dump()**  function.\n\n![image](Image00029.jpg)\n\ncatalog.php\n\
    \n![image](Image00085.jpg) Begin a PHP script with a statement to set a page title\
    \ and to preserve text formatting\n\n **<?php** \n\n**echo ‘<title>PHP SimpleXML</title><pre>’\
    \ ;**\n\n![image](Image00086.jpg) Next, add a statement to load the XML data or\
    \ quit\n\n**$xml \\= simplexml\\_load\\_file( ‘catalog.xml’ )**\n\n**or die( ‘Unable\
    \ to load data!’ ) ;**\n\n![image](Image00087.jpg) Now, display all the SimpleXMLElement\
    \ objects\n\n**var\\_dump( $xml ) ;**\n\n![image](Image00088.jpg) Save the document\
    \ in your web server’s  **/htdocs**  directory as  **catalog.php**  , alongside\
    \ the  **catalog.xml**  file, then open the page via HTTP to see the SimpleXMLElement\
    \ objects\n\n![image](Image00216.jpg)\n\n![image](Image00005.jpg)\n\nNotice that\
    \ this data structure depicts an array named “book” that has five array elements\
    \ – corresponding to the five XML **<book>** elements.\n\n![image](Image00006.jpg)\n\
    \nThe ubiquitous nature of XML makes it ideal to transport data across the internet.\n\
    \n **Getting nodes** \n\nThe data structure contained in a SimpleXML object describes\
    \ a parent-child relationship between outer and inner XML elements. Each member\
    \ of the data structure is known as a “node”. The top-level nodes are direct child\
    \ descendants of the SimpleXML object itself, so can be referenced using the object\
    \ name,  **\\->**  object operator, and child node name. For example,  **$object->child**\
    \  . A child of the child node (grandchild) can be referenced by adding a further\
    \ -> object operator, and the grandchild node name, such as  **$object->child->grandchild**\
    \  and so on for each further generation:\n\n![image](Image00029.jpg)\n\nnodes.php\n\
    \n![image](Image00085.jpg) Begin a PHP script with a statement to set a page title\n\
    \n **<?php** \n\n**echo ‘<title>PHP SimpleXML</title>’ ;**\n\n![image](Image00086.jpg)\
    \ Add a statement to load the XML data or quit\n\n**$xml \\= simplexml\\_load\\\
    _file( ‘catalog.xml’ )**\n\n**or die( ‘Unable to load data!’ ) ;**\n\n![image](Image00087.jpg)\
    \ Next, retrieve the content of the “title” element that is a child of the first\
    \ “book” element\n\n**echo ‘First book : ‘ .**\n\n**$xml \\-> book\\[0\\] \\->\
    \ title . ’ in easy steps<br>’ ;**\n\n![image](Image00088.jpg) Now, retrieve the\
    \ content of the “category” element that is a child of the first “book” element\n\
    \n**echo ‘Language category : ‘ . $xml \\-> book\\[0\\] \\-> category ;**\n\n\
    ![image](Image00089.jpg) Save the document in your web server’s  **/htdocs** \
    \ directory as  **nodes.php**  , alongside the  **catalog.xml**  file, then open\
    \ the page via HTTP to see the node content\n\n![image](Image00217.jpg)\n\n![image](Image00005.jpg)"
