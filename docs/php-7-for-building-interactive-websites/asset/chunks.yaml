- raw: "| **Level:** || **Constant:** || **Description:** |\n\n| --- | --- | --- |\n\
    \n| **2** || **E\\_WARNING** || Non-fatal runtime error |\n\n| **8** || **E\\\
    _NOTICE** || Non-fatal possible error |\n\n| **256** || **E\\_USER\\_ERROR** ||\
    \ Fatal user-generated error |\n\n| **512** || **E\\_USER\\_WARNING** || Non-fatal\
    \ user-generated error |\n\n![image](Image00005.jpg)\n\nThe basic error levels\
    \ are listed in this table but the PHP manual lists many more ( **[php.net/manual](http://www.php.net/manual)**\
    \ ).\n\nA custom error handler function is nominated to handle errors by specifying\
    \ its function name as the argument to the built-in PHP  **set\\_error\\_handler()**\
    \  function.\n\nThe error handler is called when an error occurs, or can be called\
    \ explicitly using the  **trigger\\_error()**  function to specify an error message\
    \ as its argument.\n\n![image](Image00029.jpg)\n\nerror.php\n\n![image](Image00008.jpg)\
    \ Begin a PHP script by defining a custom error handler function to report an\
    \ error level and error message\n\n **<?php** \n\n**function error\\_handler (\
    \ $level , $message )**\n\n **{** \n\n**switch( $level )**\n\n **{** \n\n**case\
    \ 2 : $str \\= ‘Warning!’ ; break ;**\n\n**case 8 : $str \\= ‘Notice!’ ; break\
    \ ;**\n\n**default : $str \\= ‘Error!’ ;**\n\n **}** \n\n**echo “<b> $str </b><br>\
    \ $message <hr>” ;**\n\n **}** \n\n![image](Image00010.jpg) Next, nominate the\
    \ function to handle errors\n\n**set\\_error\\_handler( ‘ error\\_handler ’ )\
    \ ;**\n\n![image](Image00012.jpg) Now, for some mischief – attempt to access an\
    \ uninitialized variable and try to open a non-existing file **echo( $var ) ;**\n\
    \n$ **file \\= fopen( ‘nonsuch.txt’ , ‘r’ ) ;**\n\n![image](Image00014.jpg) Explicitly\
    \ trigger the custom error handler\n\n**$number \\= 2 ;**\n\n**if( $number \\\
    >= 1 )**\n\n **{** \n\n**trigger\\_error( ‘Value of number must be 1 or less’\
    \ ) ;**\n\n **}** \n\n![image](Image00015.jpg) Save the document in your web server’s\
    \  **/htdocs**  directory as  **error.php**  then open the page via HTTP to see\
    \ the error levels and appropriate messages\n\n![image](Image00151.jpg)\n\n![image](Image00006.jpg)\n\
    \nNotice that the script continues after reporting each error, it does not terminate\
    \ on error.\n\n **Catching exceptions** \n\nWe can choose how a script should\
    \ proceed when a specific error condition occurs. This error condition is called\
    \ an “exception”. When an exception occurs it is said to be “thrown”, and code\
    \ handling the exception is said to be its “catch”. If an exception is not caught,\
    \ PHP will treat it as a fatal error and issue an unsightly “Uncaught Exception”\
    \ message, something like this:\n\n![image](Image00152.jpg)\n\n![image](Image00019.jpg)\n\
    \nEach **try** block must have an associated **catch** block, otherwise a fatal\
    \ Uncaught Exception error will occur.\n\nThe key to handling exceptions is to\
    \ anticipate the error by trying to execute an action within a  **try**  code\
    \ block, and determine how the script should proceed in an associated  **catch**\
    \  code block. The catching block is passed an  **Exception**  class object that\
    \ has  **getMessage()**  ,  **getFile()**  and  **getLine()**  methods to retrieve\
    \ details.\n\nAn instance of the  **Exception**  class can be created using the\
    \  **new**  keyword, and can be explicitly thrown using the  **throw**  keyword.\n\
    \nA custom exception handler can also be created as a derived class of the  **Exception**\
    \  class, to provide your own custom methods:\n\n![image](Image00029.jpg)\n\n\
    exception.php\n\n![image](Image00008.jpg) Begin a PHP script by defining a function\
    \ that will throw an exception when a conditional test fails\n\n **<?php** \n\n\
    **function check\\_size( $num )**\n\n **{** \n\n**if( $num < 10 )**\n\n **{ throw\
    \ new** \n\n**Exception( “Number : $num<br>Value must exceed 10” ) ; }**\n\n **}**\
    \ \n\n![image](Image00010.jpg) Anticipate a specific error and report the exception\n\
    \n**try { check\\_size( 5 ) ; }**\n\n**catch( Exception $e )**\n\n**{     echo\
    \ ‘<b>Size Exception!</b><br>’. $e->getMessage() .’<hr>’ ;       }**\n\n![image](Image00012.jpg)\
    \ Next, create a custom exception handler class\n\n**class CustomException extends\
    \ Exception**\n\n **{** \n\n**public function get\\_details ()**\n\n **{** \n\n\
    **$details \\= ‘ File : ‘ . $this \\-> getFile ().**\n\n**‘<br>Line : ‘ . $this\
    \ \\-> getLine ().**\n\n**‘<br>’ . $this \\-> getMessage () ;**\n\n**return $details\
    \ ;**\n\n **}** \n\n **}** \n\n![image](Image00014.jpg) Now, add another function\
    \ that will throw an exception when a conditional test fails\n\n**function check\\\
    _parity ( $num )**\n\n **{** \n\n**if( $num % 2 !== 0 )**\n\n **{** \n\n**throw\
    \ new CustomException ( “Number : $num <br>Value must be even” ) ;**\n\n **}**\
    \ \n\n **}** \n\n![image](Image00015.jpg) Finally, anticipate a specific error\
    \ and report the exception\n\n**try { check\\_parity ( 5 ) ; }**\n\n**catch( CustomException\
    \ $e )**\n\n**{     echo ‘<b>Parity Exception!</b><br>’ . $e \\-> get\\_details\
    \ (). ’<hr>’ ;       }**\n\n![image](Image00017.jpg) Save the document in your\
    \ web server’s  **/htdocs**  directory as  **exception.php**  then open the page\
    \ via HTTP to see the exceptions caught and appropriate message details\n\n![image](Image00153.jpg)\n\
    \n![image](Image00006.jpg)\n\nFor more on derived classes and inheritance see\
    \ [here](#text00009.html#sec50) .\n\n![image](Image00005.jpg)\n\nA **try** block\
    \ can contain multiple **throw** statements to anticipate multiple error conditions,\
    \ and can be followed by multiple **catch** blocks to handle those exceptions.\n\
    \n **Summary** \n\n •  The  **fopen()**  function is used to create a filestream\
    \ object and requires two arguments to specify a file name and a file mode\n\n\
    \ •  It is good practice to provide an alternative with the  **die()**  function\
    \ in case an attempt to create a filestream fails\n\n •  The  **fread()**  function\
    \ is used to read a filestream created using the ‘ **r**  ’ file mode, and the\
    \  **filesize()**  function can be used to specify the byte size of the file\n\
    \n •  Upon completion of any file operation the filestream must be destroyed by\
    \ calling the  **fclose()**  function\n\n •  The  **fgets()**  function can be\
    \ used to read a file line-by-line and the  **feof()**  function can recognize\
    \ the end of a file\n\n •  The  **fgetc()**  function can be used to read a file\
    \ character-by-character and will return false at the end of the file\n\n •  Text\
    \ can be written into a file by specifying the filestream and the file name as\
    \ arguments to the  **fwrite()**  function\n\n •  The  **fwrite()**  function\
    \ will overwrite existing text using the ‘ **w**  ’ file mode but will append\
    \ text when using the ‘ **a**  ’ file mode\n\n •  The name of a function can be\
    \ specified as the argument to the  **set\\_error\\_handler()**  function to nominate\
    \ it as a custom error handler\n\n •  The error handler function is called when\
    \ an error occurs or can be called explicitly using the  **trigger\\_error()**\
    \  function\n\n •  An exception is thrown when a specific error condition occurs\n\
    \n •  If an exception is not caught, PHP will treat it as a fatal error and issue\
    \ an Uncaught Exception message\n\n •  A  **try**  code block is used to anticipate\
    \ a specific error and its associated  **catch**  block is used to determine how\
    \ the script should proceed when that error occurs\n\n •  An  **Exception**  class\
    \ object has  **getMessage()**  ,  **getFile()**  and  **getLine()**  methods\
    \ that can retrieve exception details\n\n •  A custom exception handler can be\
    \ created as a derived class of the  **Exception**  class to provide custom exception\
    \ methods\n\n9\n\n **Producing forms** \n\n*This chapter demonstrates how to use\
    \ PHP scripts to process HTML form data.*\n\n[**Performing actions**](#text00011.html#sec62)\n\
    \n[**Checking set values**](#text00011.html#sec63)\n\n[**Validating form data**](#text00011.html#sec64)\n\
    \n[**Filtering data**](#text00011.html#sec65)\n\n[**Sending hidden data**](#text00011.html#sec66)\n\
    \n[**Handling submissions**](#text00011.html#sec67)\n\n[**Making sticky forms**](#text00011.html#sec68)\n\
    \n[**Uploading files**](#text00011.html#sec69)\n\n[**Surrounding forms**](#text00011.html#sec70)\n\
    \n[**Appending link data**](#text00011.html#sec71)\n\n[**Summary**](#text00011.html#sec72)\n\
    \n **Performing actions** "
