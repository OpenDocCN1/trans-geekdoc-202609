- raw: "Notice that there is no **strrstr()** (companion function to **strstr()**\
    \ ) to search in reverse order.\n\nSimilarly, where character case is unimportant,\
    \ you can use the companion  **stristr()**  function to make a case-insensitive\
    \ search. This will return the remainder of the searched string from where the\
    \ first occurrence of a case-insensitive match begins.\n\nThe  **strchr()**  function\
    \ works in a similar way but accepts two arguments to specify the string in which\
    \ to search, and a single character to find. As you might expect, the companion\
    \  **strrchr()**  function begins searching in reverse order, from the end of\
    \ the string. Both return the remainder of the searched string from where the\
    \ first occurrence of a match begins.\n\n![image](Image00029.jpg)\n\nsearch.php\n\
    \n![image](Image00098.jpg) Begin a PHP script with statements to initialize a\
    \ variable with a string value and report its length\n\n **<?php** \n\n**$str\
    \ \\= ‘Most Users usually find PHP useful.’ ;**\n\n**echo “’ $str ’<br>String\
    \ Length : “ .strlen( $str ) ;**\n\n![image](Image00099.jpg) Next, add statements\
    \ to search the string, both forwards and reverse, and report the position of\
    \ a given substring\n\n**echo “<br>First ‘us’ found at : “ .strpos( $str , ‘us’\
    \ ) ;**\n\n**echo “<br>Final ‘us’ found at : “ .strrpos( $str , ‘us’ ) ;**\n\n\
    ![image](Image00100.jpg) Now, add statements to search the string, both case-\
    \ sensitive and case-insensitive, and return the remainder of the string following\
    \ a substring match\n\n**echo “<hr>Substring from first ‘us’ : “ .strstr( $str\
    \ , ‘us’ ) ;**\n\n**echo “<br>Substring from first ‘us’ case insensitive : “**\n\
    \n**.stristr( $str , ‘us’ ) ;**\n\n![image](Image00101.jpg) Finally, add statements\
    \ to search the string, both forwards and reverse, and return the remainder of\
    \ the string following a character match\n\n**echo “<hr>Characters from first\
    \ ‘u’ : “ .strchr( $str , ‘u’ ) ;**\n\n**echo “<br>Characters from final ‘u’ :\
    \ “ .strrchr( $str , ‘u’ ) ;**\n\n **?>** \n\n![image](Image00102.jpg) Save the\
    \ document in your web server’s  **/htdocs**  directory as  **search.php**  then\
    \ open the page via HTTP to see the search results\n\n![image](Image00104.jpg)\n\
    \n![image](Image00006.jpg)\n\nThere are three occurrences of ‘us’ in this string,\
    \ but only the first and third are matched.\n\n **Extracting substrings** \n\n\
    A substring can be extracted from a string by stating the string, and index position\
    \ of a substring within the string, as arguments to the  **substr()**  function.\
    \ Optionally, a third argument can specify the substring length. You may replace\
    \ a substring using the  **substr\\_ replace()**  function to specify string,\
    \ substring, index position and length arguments. The total number of occurrences\
    \ of a substring within a string can be found using the  **substr\\_count()**\
    \  function:\n\n![image](Image00029.jpg)\n\nsubstring.php\n\n![image](Image00098.jpg)\
    \ Begin a PHP script with statements to initialize a variable with a string value\
    \ and count substrings\n\n **<?php** \n\n**$str \\= ‘SQL in easy steps features\
    \ SQL queries’ ;**\n\n**echo “’ $str ’<br>’SQL’ Count: “ .substr\\_count( $str\
    \ , ‘SQL’ ) ;**\n\n![image](Image00099.jpg) Next, add statements to extract two\
    \ substrings\n\n**echo ‘<hr>Index 27 : ‘ .substr( $str , 27 ) ;**\n\n**echo ‘<hr>Index\
    \ 4 Length 13 : ‘ .substr( $str , 4 , 13 ) ;**\n\n![image](Image00100.jpg) Now,\
    \ add a statement to initialize a variable with a string\n\n**$sub \\= ‘PHP &\
    \ MySQL’ ;**\n\n![image](Image00101.jpg) Finally, add statements to replace a\
    \ substring with a new string value and to display the modified string\n\n**$str\
    \ \\= substr\\_replace( $str , $sub , 0 , 3 ) ;**\n\n**echo “<hr>’ $str ’” ;**\n\
    \n **?>** \n\n![image](Image00102.jpg) Save the document in your web browser’s\
    \  **/htdocs**  directory as  **substring.php**  then open the page via HTTP to\
    \ see the extracted substrings and modified string\n\n![image](Image00105.jpg)\n\
    \n![image](Image00006.jpg)\n\nThe length argument in **substr\\_replace()** specifies\
    \ the length of the substring to be replaced. In this example, it is **3** – to\
    \ replace the three characters ‘SQL’ with a longer string.\n\n **Changing case**\
    \ \n\nPHP provides functions to easily modify the character case of a specified\
    \ string argument. The  **strtolower()**  function changes all characters to lowercase\
    \ and  **strtoupper()**  changes them all to uppercase. Additionally, the  **ucfirst()**\
    \  function makes only the first string character uppercase, whereas the  **ucword()**\
    \  function makes the first character of every word in the string into uppercase:\n\
    \n![image](Image00029.jpg)\n\ncase.php\n\n![image](Image00098.jpg) Begin a PHP\
    \ script with statements to initialize a variable with a string and display its\
    \ value\n\n **<?php** \n\n**$str \\= “C++ Programming in easy steps” ;**\n\n**echo\
    \ “Original String : ‘ $str ’ <hr>” ;**\n\n![image](Image00099.jpg) Next, add\
    \ statements to display a lowercase version\n\n**$ver \\= strtolower( $str ) ;**\n\
    \n**echo “Lowercase String : ‘ $ver ’ <br>” ;**\n\n![image](Image00100.jpg) Now,\
    \ add statements to display an uppercase version\n\n**$ver \\= strtoupper( $str\
    \ ) ;**\n\n**echo “Uppercase String : ‘ $ver ’ <hr>” ;**\n\n![image](Image00101.jpg)\
    \ Finally, add statements to display a capitalized string version and a capitalized\
    \ words version\n\n**$ver \\= ucfirst( strtolower( $str ) ) ;**\n\n**echo “Uppercase\
    \ First String Character : ‘ $ver ’ <br>” ;**\n\n**echo ‘Uppercase First Word\
    \ Character : ‘ .ucwords( $ver ) ;**\n\n **?>** \n\n![image](Image00102.jpg) Save\
    \ the document in your web server’s  **/htdocs**  directory as  **case.php** \
    \ then open the page via HTTP to see the changed case versions of the original\
    \ string\n\n![image](Image00106.jpg)\n\n![image](Image00019.jpg)\n\nThe **ucfirst()**\
    \ function only changes the first character of a string. Other uppercase characters\
    \ will remain unless first changed to lowercase with the **strtolower()** function,\
    \ as seen here.\n\n **Formatting strings** \n\nPHP provides a number of built-in\
    \ functions to conveniently format strings by manipulating their characters. The\
    \ simple  **strrev()**  function accepts a single string argument and returns\
    \ that string in reversed character order, so it reads back to front.\n\nThe \
    \ **strrpt()**  function accepts two arguments to specify a string, and an integer\
    \ of how many total times that string should be repeated in the string it will\
    \ return.\n\nThe  **strpad()**  function accepts three arguments to specify a\
    \ string, a total length of the character string it will return, and a character\
    \ or substring pattern with which to fill the difference between the original\
    \ string and the specified returned string length. The padding will, by default,\
    \ be added to the end of the original string but can be added to its start by\
    \ adding a fourth argument using a special  **STR\\_PAD\\_LEFT**  flag.\n\nThe\
    \  **trim()**  function can accept a single string argument and will return a\
    \ string in which all white-space characters (spaces, line returns, tabs) have\
    \ been removed from the start and end of the original string. Optionally, a second\
    \ argument can specify a character or pattern to be removed from the start and\
    \ end of the original string, in place of the white-space default.\n\nSimilarly,\
    \ where you only want to remove characters from the start of the original string,\
    \ you can use the companion  **ltrim()**  function, or where you only want to\
    \ remove characters from the end of the original string, you can use the companion\
    \  **rtrim()**  function.\n\n![image](Image00005.jpg)\n\nThe PHP **implode()**\
    \ and **explode()** functions can be used to convert arrays to strings, and strings\
    \ to arrays – see [here](#text00004.html#sec11) for more details."
  fmt: '

    Notice that there is no `strrstr()` (companion function to `strstr()`) to search
    in reverse order.


    Similarly, where character case is unimportant, you can use the companion `stristr()`
    function to make a case-insensitive search. This will return the remainder of
    the searched string from where the first occurrence of a case-insensitive match
    begins.


    The `strchr()` function works in a similar way but accepts two arguments to specify
    the string in which to search, and a single character to find. As you might expect,
    the companion `strrchr()` function begins searching in reverse order, from the
    end of the string. Both return the remainder of the searched string from where
    the first occurrence of a match begins.


    ![image](Image00029.jpg)


    search.php


    ![image](Image00098.jpg) Begin a PHP script with statements to initialize a variable
    with a string value and report its length


    ```php

    <?php

    $str = ‘Most Users usually find PHP useful.’ ;

    echo “’ $str ’<br>String Length : “ .strlen( $str ) ;

    ```


    ![image](Image00099.jpg) Next, add statements to search the string, both forwards
    and reverse, and report the position of a given substring


    ```php

    echo “<br>First ‘us’ found at : “ .strpos( $str , ‘us’ ) ;

    echo “<br>Final ‘us’ found at : “ .strrpos( $str , ‘us’ ) ;

    ```


    ![image](Image00100.jpg) Now, add statements to search the string, both case-
    sensitive and case-insensitive, and return the remainder of the string following
    a substring match


    ```php

    echo “<hr>Substring from first ‘us’ : “ .strstr( $str , ‘us’ ) ;

    echo “<br>Substring from first ‘us’ case insensitive : ”.stristr( $str , ‘us’
    ) ;

    ```


    ![image](Image00101.jpg) Finally, add statements to search the string, both forwards
    and reverse, and return the remainder of the string following a character match


    ```php

    echo “<hr>Characters from first ‘u’ : “ .strchr( $str , ‘u’ ) ;

    echo “<br>Characters from final ‘u’ : “ .strrchr( $str , ‘u’ ) ;

    ?>

    ```


    ![image](Image00102.jpg) Save the document in your web server’s `/htdocs` directory
    as `search.php` then open the page via HTTP to see the search results


    ![image](Image00104.jpg)


    ![image](Image00006.jpg) There are three occurrences of ‘us’ in this string, but
    only the first and third are matched.


    ### Extracting substrings


    A substring can be extracted from a string by stating the string, and index position
    of a substring within the string, as arguments to the `substr()` function. Optionally,
    a third argument can specify the substring length. You may replace a substring
    using the `substr_replace()` function to specify string, substring, index position
    and length arguments. The total number of occurrences of a substring within a
    string can be found using the `substr_count()` function:


    ![image](Image00029.jpg)


    substring.php


    ![image](Image00098.jpg) Begin a PHP script with statements to initialize a variable
    with a string value and count substrings


    ```php

    <?php

    $str = ‘SQL in easy steps features SQL queries’ ;

    echo “’ $str ’<br>’SQL’ Count: “ .substr_count( $str , ‘SQL’ ) ;

    ```


    ![image](Image00099.jpg) Next, add statements to extract two substrings


    ```php

    echo ‘<hr>Index 27 : ‘ .substr( $str , 27 ) ;

    echo ‘<hr>Index 4 Length 13 : ‘ .substr( $str , 4 , 13 ) ;

    ```


    ![image](Image00100.jpg) Now, add a statement to initialize a variable with a
    string


    ```php

    $sub = ‘PHP & MySQL’ ;

    ```


    ![image](Image00101.jpg) Finally, add statements to replace a substring with a
    new string value and to display the modified string


    ```php

    $str = substr_replace( $str , $sub , 0 , 3 ) ;

    echo “<hr>’ $str ’” ;

    ?>

    ```


    ![image](Image00102.jpg) Save the document in your web browser’s `/htdocs` directory
    as `substring.php` then open the page via HTTP to see the extracted substrings
    and modified string


    ![image](Image00105.jpg)


    ![image](Image00006.jpg) The length argument in `substr_replace()` specifies the
    length of the substring to be replaced. In this example, it is `3` – to replace
    the three characters ‘SQL’ with a longer string.


    ### Changing case


    PHP provides functions to easily modify the character case of a specified string
    argument. The `strtolower()` function changes all characters to lowercase and
    `strtoupper()` changes them all to uppercase. Additionally, the `ucfirst()` function
    makes only the first string character uppercase, whereas the `ucword()` function
    makes the first character of every word in the string:


    ![image](Image00029.jpg)


    case.php


    ```php

    <?php

    $str = “C++ Programming in easy steps” ;

    echo “Original String : $str ”<hr> ;

    ```


    ![image](Image00098.jpg) Next, add statements to display a lowercase version


    ```php

    $ver = strtolower( $str ) ;

    echo “Lowercase String : $ver <br>” ;

    ```


    ![image](Image00099.jpg) Now, add statements to display an uppercase version


    ```php

    $ver = strtoupper( $str ) ;

    echo “Uppercase String : $ver <hr>” ;

    ```


    ![image](Image00100.jpg) Finally, add statements to display a capitalized string
    and a capitalized words version


    ```php

    $ver = ucfirst( strtolower( $str ) ) ;

    echo “Uppercase First String : $ver <br>” ;

    echo ‘Uppercase First Word : ‘ .ucwords( $ver ) ;

    ?>

    ```


    ![image](Image00102.jpg) Save the document in your web server’s `/htdocs` directory
    as `case.php` then open the page via HTTP to see the changed case of the original
    string


    ![image](Image00106.jpg)


    ![image](Image00019.jpg) The `ucfirst()` function only changes the first character
    of a string. Other uppercase characters will remain unless first changed with
    the `strtolower()` function, as seen here.


    ### Formatting strings


    PHP provides a number of built-in functions to conveniently format strings by
    manipulating their characters. The simple `strrev()` function accepts a single
    string argument and returns that string in reversed order, so it reads back to
    front.


    The `strrpt()` function accepts two arguments to specify a string, and an integer
    of how many total times that string should be repeated in the string it will return.


    The `strpad()` function accepts three arguments to specify a string, a total length
    of the character string it will return, and a character or substring pattern with
    which to fill the difference between the original string and the specified string
    length. The padding will, by default, be added to the end of the original string
    but can be added to its start by adding a fourth argument using a special `STR_PAD_LEFT`
    flag.


    The `trim()` function can accept a single string argument and will return a string
    in which all white-space characters (spaces, line returns, tabs) have been removed
    from the start and end of the original string. Optionally, a second argument can
    specify a character or pattern to be removed from the start and end of the original
    string.


    Similarly, where you only want to remove characters from the start of the original
    string, you can use the companion `ltrim()` function, or where you only want to
    remove characters from the end of the original string, you can use the companion
    `rtrim()` function.


    ![image](Image00005.jpg)


    The PHP `implode()` and `explode()` functions can be used to convert arrays to
    strings, and strings to arrays – see [here](#text00004.html#sec11) for more details.

    '
  trans: '

    请注意，没有名为 `strrstr()`（`strstr()` 的伴侣函数）的用于反向搜索。


    同样，当字符大小写时不重要时，你可以使用伴侣函数 `stristr()` 进行不区分大小写的搜索。这将返回从搜索字符串中第一个不区分大小写的匹配项开始的，该字符串的剩余部分。


    `strchr()` 函数的工作方式类似，但它接受两个参数：指定要从中搜索的字符串，以及要查找的单个字符。正如你预期的那样，伴侣函数 `strrchr()`
    从字符串末尾开始反向搜索。两者都返回从搜索字符串中第一个匹配项开始的，该字符串的剩余部分。


    ![image](img/Image00029.jpg)


    search.php


    ![image](img/Image00098.jpg) 开始一个 PHP 脚本，使用语句初始化一个带有字符串值的变量，并报告其长度


    ```php

    <?php

    $str = ‘Most Users usually find PHP useful.’ ;

    echo “’ $str ’<br>String Length : “ .strlen( $str ) ;

    ```


    ![image](img/Image00099.jpg) 接下来，添加语句对字符串进行搜索（包括正向和反向），并报告给定子串的位置


    ```php

    echo “<br>First ‘us’ found at : “ .strpos( $str , ‘us’ ) ;

    echo “<br>Final ‘us’ found at : “ .strrpos( $str , ‘us’ ) ;

    ```


    ![image](img/Image00100.jpg) 现在，添加语句对字符串进行搜索（包括区分大小写和不区分大小写），并返回子串匹配后的字符串剩余部分


    ```php

    echo “<hr>Substring from first ‘us’ : “ .strstr( $str , ‘us’ ) ;

    echo “<br>Substring from first ‘us’ case insensitive : ”.stristr( $str , ‘us’
    ) ;

    ```


    ![image](img/Image00101.jpg) 最后，添加语句对字符串进行搜索（包括正向和反向），并返回字符匹配后的字符串剩余部分


    ```php

    echo “<hr>Characters from first ‘u’ : “ .strchr( $str , ‘u’ ) ;

    echo “<br>Characters from final ‘u’ : “ .strrchr( $str , ‘u’ ) ;

    ?>

    ```


    ![image](img/Image00102.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `search.php`，然后通过
    HTTP 打开页面查看搜索结果


    ![image](img/Image00104.jpg)


    ![image](img/Image00006.jpg) 此字符串中出现了三次 ‘us’，但只有第一个和第三个被匹配了。


    ### 提取子串


    可以通过向 `substr()` 函数传递字符串以及该子串在字符串中的索引位置作为参数，从字符串中提取子串。可选地，第三个参数可以指定子串的长度。你可以使用
    `substr_replace()` 函数通过指定字符串、子串、索引位置和长度参数来替换子串。子串在字符串中出现的总次数可以使用 `substr_count()`
    函数来找到：


    ![image](img/Image00029.jpg)


    substring.php


    ![image](img/Image00098.jpg) 开始一个 PHP 脚本，使用语句初始化一个带有字符串值的变量并计算子串数量


    ```php

    <?php

    $str = ‘SQL in easy steps features SQL queries’ ;

    echo “’ $str ’<br>’SQL’ Count: “ .substr_count( $str , ‘SQL’ ) ;

    ```


    ![image](img/Image00099.jpg) 接下来，添加语句提取两个子串


    ```php

    echo ‘<hr>Index 27 : ‘ .substr( $str , 27 ) ;

    echo ‘<hr>Index 4 Length 13 : ‘ .substr( $str , 4 , 13 ) ;

    ```


    ![image](img/Image00100.jpg) 现在，添加语句初始化一个带有字符串值的变量


    ```php

    $sub = substr( $str , 0 , 3 )

    ```


    ![image](img/Image00101.jpg) 最后，添加语句替换字符串并显示替换后的字符串


    ```php

    $str = substr_replace( $str, ''PHP'', 0, 3 )

    echo “<hr> . $str ;

    ```


    ![image](img/Image00102.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `search.php`，然后通过
    HTTP 打开页面查看替换后的字符串


    ![image](img/Image00005.jpg)


    ![image](img/Image00104.jpg) `substr_replace()` 函数中的长度指定了要替换的字符串


    ![image](img/Image00006.jpg) 在此例中，它将字符串改为 ‘SQL’。


    ### 修改大小写


    PHP 提供了许多函数来轻松修改字符的大小写。`strtolower()` 函数将字符串的所有字符转换为小写，`strtoupper()` 函数将它们转换为大写。此外，`ucfirst()`
    函数将字符串的第一个字符转换为大写，而 `ucwords()` 函数则将每个单词的首字母转换为大写：


    ![image](img/Image00029.jpg)


    case.php


    ```php

    <?php

    $str = “C++ in easy steps” ;

    echo “Original String : $str ;

    ```


    ![image](img/Image00098.jpg) 接下来，添加语句显示小写版本


    ```php

    $ver = strlower( $str )

    echo “Lowercase String : $ver ;

    ```


    ![image](img/Image00099.jpg) 现在，添加语句显示大写版本


    ```php

    $ver = strtoupper( $str )

    echo “Uppercase String : $ver ;

    ```


    ![image](img/Image00100.jpg) 最后，添加语句显示首字母大写的单词版本


    ```php

    $ver = ucfirst( $str )

    echo “Uppercase First String : $ver ;

    echo ‘Uppercase Word : ‘ .ucwords( $ver ) ;

    ?>

    ```


    ![image](img/Image00102.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `case.php`，然后通过
    HTTP 打开页面。


    ### 格式化字符串


    PHP 提供了许多内置函数可以通过操作字符来方便地格式化字符串。简单的 `strrev()` 函数接受单个字符串参数并返回反转后的字符串。


    `str_repeat()` 函数接受两个参数：指定字符串以及该字符串应重复的总次数整数。


    `strpad()` 函数接受三个参数：指定字符串、要返回的字符字符串的总长度，以及用于填充原始字符串与指定长度之间差异的字符或子串模式。默认情况下，填充将添加到原始字符串的末尾，但通过添加第四个参数使用特殊的
    `STR_PAD_LEFT` 标志可以将其添加到开头。


    `trim()` 函数可以接受单个字符串参数，并返回一个去除了字符串开头和结尾空白字符（空格、换行符、制表符）的字符串。可选地，第二个参数可以指定从字符串开头和结尾移除的字符或模式。


    同样，如果你只想从字符串开头移除字符，可以使用伴侣函数 `ltrim()`，或者如果你只想从字符串末尾移除字符，可以使用伴侣函数 `rtrim()`。


    ![image](img/Image00005.jpg)


    PHP `implode()` 和 `explode()` 函数可以将数组转换为字符串，并将字符串转换为数组——更多信息请参见此处。


    '
