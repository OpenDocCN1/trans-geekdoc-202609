    \ 2015 年发布，由最新的 Zend 3 引擎驱动，提供了更高的性能。如今，PHP 已安装在超过 2000 万个网站和 100 万台 Web 服务器上。\n\
    \n为什么 PHP 如此流行？\n* PHP 对新手来说非常简单，但对专业程序员来说提供了许多高级功能。\n\n"
