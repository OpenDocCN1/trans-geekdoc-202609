- raw: "Processing data submitted from an HTML form on a web page is perhaps the most\
    \ fundamental task performed by a PHP script.\n\nThe HTML  **<form>**  tag’s \
    \ **action**  attribute is used to nominate the PHP script that will process (“handle”)\
    \ the form data. Additionally, the  **<form>**  tag’s  **method**  attribute is\
    \ used to specify how the data is sent to the script – typically by the  **POST**\
    \  method. So the HTML form tag and attributes might look like this:\n\n **<form\
    \ action=”script.php” method=”POST”>** \n\nPHP provides a special “superglobal”\
    \  **$\\_POST**  array variable in which it stores form data submitted by the\
    \  **POST**  method. It creates an array element of the same name as each submitted\
    \ form element name, storing the value they contain. For example with this form\
    \ element:\n\n **<input type=”text” name=”email” >** \n\n![image](Image00019.jpg)\n\
    \nThis is case-sensitive so the capitalization must be precisely as described\
    \ – **$\\_POST\\[‘EMail’\\]** or **$\\_Post\\[‘email’\\]** are incorrect for example.\n\
    \nOn submission of the form, PHP will create an array element named  **$\\_POST\\\
    [‘email’\\]**  containing the value entered into that form input by the user.\n\
    \nFor easy recognition PHP variables of the same names as the form elements can\
    \ be assigned the values stored in their corresponding  **$\\_POST**  array elements.\
    \ The values can then be displayed in a response page created by the action handler\
    \ script:\n\n![image](Image00029.jpg)\n\naction.php\n\n![image](Image00036.jpg)\
    \ Create an HTML document containing a form with three text input fields for data\
    \ submission\n\n**<form action=” action\\_handler.php ” method=” POST ”>**\n\n\
    \ **<dl>** \n\n **<dt>Name:** \n\n**<dd><input type=”text” name=” name ”>**\n\n\
    \ **<dt>Email Address:** \n\n**<dd><input type=”text” name=” mail ”>**\n\n **<dt>Comments:**\
    \ \n\n**<dd><textarea rows=”5” cols=”20” name=” comment ” >**\n\n **</textarea>**\
    \ \n\n **</dl>** \n\n **<p><input type=”submit” ></p>** \n\n **</form>** \n\n\
    ![image](Image00037.jpg) Now, save the document in your web server’s  **/htdocs**\
    \  directory as  **action.php** \n\n![image](Image00029.jpg)\n\naction\\_handler.php\n\
    \n![image](Image00038.jpg) Next create an HTML document containing a script to\
    \ assign form values to like-named PHP variables for output\n\n **<?php** \n\n\
    **$name \\= $\\_POST\\[‘name’\\] ;**\n\n**$mail \\= $\\_POST\\[‘mail’\\] ;**\n\
    \n**$comment \\= $\\_POST\\[‘comment’\\] ;**\n\n**echo “<p>Thanks for this comment\
    \ $name ...</p>” ;**\n\n**echo “<p><i> $comment </i></p>” ;**\n\n**echo “<p>We\
    \ will reply to $mail </p>” ;**\n\n **?>** \n\n![image](Image00039.jpg) Save the\
    \ document in your web server’s  **/htdocs**  directory as  **action\\_handler.php**\
    \  then open  **action.php**  via HTTP and submit some data to see it get displayed\
    \ in the response page produced by the PHP script\n\n![image](Image00154.jpg)\n\
    \n![image](Image00155.jpg)\n\n![image](Image00005.jpg)\n\nForm submission methods\
    \ may be either “GET” or “POST”. The **GET** method appends name=value pairs to\
    \ the URL but is mostly used to request information – such as retrieving a database\
    \ record. The **POST** method can submit more data, is more secure as the data\
    \ is not appended to the URL, and is mostly used when an action is to be performed\
    \ – such as updating a database record. The **POST** method is therefore preferred\
    \ for most examples in this book.\n\n **Checking set values** \n\nPHP can easily\
    \ ensure that the user has entered data into submitted HTML form fields using\
    \ the built-in  **isset()**  function. This function takes the name of a variable\
    \ as its argument and returns  **TRUE**  only if that variable value is not  **NULL**\
    \  – thus ensuring that the variable has been “set” with some value. Empty form\
    \ fields will be  **NULL**  unless the user has entered a value.\n\nConditional\
    \ tests can be made with the  **isset()**  function to indicate where form fields\
    \ have been left empty, or to provide a response page where the fields have been\
    \ completed:\n\n![image](Image00029.jpg)\n\nisset.php\n\n![image](Image00036.jpg)\
    \ Create an HTML document containing a form with three radio buttons providing\
    \ a single field for data submission\n\n**<form action=” isset\\_handler.php ”\
    \ method=” POST ”>**\n\n **<fieldset>** \n\n **<legend>What kind of language is\
    \ PHP?</legend>** \n\n**Scripting<input type=”radio” name=” definition ” value=”\
    \ Scripting ”> <br>**\n\n**Markup<input type=”radio” name=” definition ” value=”\
    \ Markup ”> <br>**\n\n**Programming<input type=”radio” name=” definition ” value=”\
    \ Programming ”>**\n\n **</fieldset><p><input type=”submit” ></p>** \n\n **</form>**\
    \ \n\n![image](Image00037.jpg) Now, save the document in your web server’s  **/htdocs**\
    \  directory as  **isset.php** \n\n![image](Image00029.jpg)\n\nisset\\_handler.php\n\
    \n![image](Image00038.jpg) Next, create an HTML document containing a PHP script\
    \ to initialize a variable with a submitted value – or with  **NULL**  if no value\
    \ has been submitted\n\n **<?php** \n\n**if ( isset( $\\_POST\\[‘definition’\\\
    ] ) )**\n\n **{** \n\n**$definition \\= $\\_POST\\[‘definition’\\] ;**\n\n **}**\
    \ \n\n **else** \n\n **{** \n\n**$definition \\= NULL ;**\n\n **}** \n\n **\\\
    # Response statements to be inserted here (step 4).** \n\n **?>** \n\n![image](Image00039.jpg)\
    \ Finally, insert statements to output an appropriate response according to the\
    \ value of the variable\n\n**if ( $definition != NULL )**\n\n **{** \n\n**if (\
    \ $definition != ‘Scripting’ )**\n\n**{ echo “ $definition is Incorrect” ; }**\n\
    \n **else** \n\n**{ echo “ $definition is Correct” ; }**\n\n **}** \n\n **else**\
    \ \n\n**{ echo ‘You must select one answer’ ; }**\n\n **?>** \n\n![image](Image00040.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **isset\\\
    _handler.php**  then open  **isset.php**  via HTTP and submit the form to see\
    \ the responses\n\n![image](Image00156.jpg)\n\n![image](Image00157.jpg)\n\n![image](Image00158.jpg)\n\
    \n![image](Image00159.jpg)\n\n![image](Image00005.jpg)\n\nIt is technically more\
    \ efficient to test whether a condition is not **TRUE** than whether it is **TRUE**\
    \ – as fewer possibilities need evaluating.\n\n **Validating form data** \n\n\
    As users may inadvertently submit forms with empty fields, or with data in the\
    \ wrong format, it is essential your PHP scripts ensure required fields are completed\
    \ and submitted data is valid.\n\nTo ensure the user has entered something into\
    \ a text field, PHP provides an  **empty()**  function that accepts a variable\
    \ argument and returns  **TRUE**  if its value is an empty string, zero,  **NULL**\
    \  or  **FALSE**  .\n\nTo ensure the user has entered data in numeric format,\
    \ PHP provides an  **is\\_numeric()**  function that accepts a variable argument\
    \ and returns  **TRUE**  only if its value is a number.\n\nMore specific data\
    \ validation can be performed using the PHP  **preg\\_match()**  function that\
    \ accepts a “regular expression” argument and a variable argument in which to\
    \ seek a pattern. Typically, this is used to ensure an email address is in the\
    \ expected format:\n\n![image](Image00029.jpg)\n\nvalid.php\n\n![image](Image00036.jpg)\
    \ Create an HTML document containing a form with two text fields for data submission\n\
    \n**<form action=” valid\\_handler.php ” method=” POST ”>**\n\n **<fieldset>**\
    \ \n\n **<legend>Enter a quantity and email address</legend>** \n\n**<p>Quantity\
    \ : <input type=”text” name=” quantity ”></p>**\n\n**<p>Email Address : <input\
    \ type=”text” name=” email ”></p>**\n\n **</fieldset><p><input type=”submit” ></p>**\
    \ \n\n **</form>** \n\n![image](Image00037.jpg) Now, save the document in your\
    \ web server’s  **/htdocs**  directory as  **valid.php** \n\n![image](Image00029.jpg)\n\
    \nvalid\\_handler.php\n\n![image](Image00038.jpg) Next, create an HTML document\
    \ containing a PHP script to initialize a variable with a submitted value – or\
    \ with  **NULL**  if no value has been submitted\n\n **<?php** \n\n**if ( !empty\
    \ ( $\\_POST\\[‘quantity’\\] ) )**\n\n **{** \n\n**$quantity \\= $\\_POST\\[‘quantity’\\\
    ] ;**\n\n **\\# Format validation to be inserted here (step 4).** \n\n **}** \n\
    \n **else** \n\n**{ $quantity \\= NULL ; echo ‘You must enter a quantity<br>’\
    \ ; }**\n\n![image](Image00039.jpg) Insert statements to ensure the format is\
    \ numeric"
  fmt: "\n# Introduction\n\nProcessing data submitted from an HTML form on a web page\
    \ is perhaps the most fundamental task performed by a PHP script.\n\nThe HTML\
    \ `<form>` tag’s `action` attribute is used to nominate the PHP script that will\
    \ process (“handle”) the form data. Additionally, the `<form>` tag’s `method`\
    \ attribute is used to specify how the data is sent to the script – typically\
    \ by the `POST` method. So the HTML form tag and attributes might look like this:\n\
    \n```html\n<form action=\"script.php\" method=\"POST\">\n```\n\nPHP provides a\
    \ special “superglobal” `$_POST` array variable in which it stores form data submitted\
    \ by the `POST` method. It creates an array element of the same name as each submitted\
    \ form element name, storing the value they contain. For example with this form\
    \ element:\n\n```html\n<input type=\"text\" name=\"email\">\n```\n\n![image](Image00019.jpg)\n\
    \nThis is case-sensitive so the capitalization must be precisely as described\
    \ – `$_POST['EMail']` or `$_Post['email']` are incorrect for example.\n\nOn submission\
    \ of the form, PHP will create an array element named `$_POST['email']` containing\
    \ the value entered into that form input by the user.\n\nFor easy recognition\
    \ PHP variables of the same names as the form elements can be assigned the values\
    \ stored in their corresponding `$_POST` array elements. The values can then be\
    \ displayed in a response page created by the action handler script:\n\n![image](Image00029.jpg)\n\
    \naction.php\n\n![image](Image00036.jpg) Create an HTML document containing a\
    \ form with three text input fields for data submission\n\n```html\n<form action=\"\
    action_handler.php\" method=\"POST\">\n  <dl>\n    <dt>Name:</dt>\n    <dd><input\
    \ type=\"text\" name=\"name\"></dd>\n    <dt>Email Address:</dt>\n    <dd><input\
    \ type=\"text\" name=\"mail\"></dd>\n    <dt>Comments:</dt>\n    <dd><textarea\
    \ rows=\"5\" cols=\"20\" name=\"comment\"></textarea></dd>\n  </dl>\n  <p><input\
    \ type=\"submit\"></p>\n</form>\n```\n\n![image](Image00037.jpg) Now, save the\
    \ document in your web server’s `/htdocs` directory as `action.php`\n\n![image](Image00029.jpg)\n\
    \naction_handler.php\n\n![image](Image00038.jpg) Next create an HTML document\
    \ containing a script to assign form values to like-named PHP variables for output\n\
    \n```php\n<?php\n$name = $_POST['name'];\n$mail = $_POST['mail'];\n$comment =\
    \ $_POST['comment'];\necho \"<p>Thanks for this comment $name ...</p>\";\necho\
    \ \"<p><i> $comment </i></p>\";\necho \"<p>We will reply to $mail </p>\";\n?>\n\
    ```\n\n![image](Image00039.jpg) Save the document in your web server’s `/htdocs`\
    \ directory as `action_handler.php` then open `action.php` via HTTP and submit\
    \ some data to see it get displayed in the response page produced by the PHP script\n\
    \n![image](Image00154.jpg)\n\n![image](Image00155.jpg)\n\n![image](Image00005.jpg)\n\
    \nForm submission methods may be either “GET” or “POST”. The `GET` method appends\
    \ name=value pairs to the URL but is mostly used to request information – such\
    \ as retrieving a database record. The `POST` method can submit more data, is\
    \ more secure as the data is not appended to the URL, and is mostly used when\
    \ an action is to be performed – such as updating a database record. The `POST`\
    \ method is therefore preferred for most examples in this book.\n\n## Checking\
    \ set values\n\nPHP can easily ensure that the user has entered data into submitted\
    \ HTML form fields using the built-in `isset()` function. This function takes\
    \ the name of a variable as the argument and returns `TRUE` only if that variable\
    \ is set. It is technically more efficient to test whether a condition is not\
    \ `TRUE` than whether it is `TRUE` – as fewer possibilities need evaluating.\n\
    \nAs users may inadvertently submit forms with empty fields or with data in the\
    \ wrong format, it is essential your scripts ensure required fields are completed.\
    \ Conditional tests can be made with `isset()` to indicate where fields have been\
    \ left:\n\n![image](Image00029.jpg)\n\nisset.php\n\n![image](Image00036.jpg) Create\
    \ an HTML document containing a form with three radio buttons for submission\n\
    \n```html\n<form action=\"isset_handler.php\" method=\"POST\">\n  <fieldset>\n\
    \    <legend>What kind of language?</legend>\n    <input type=\"radio\" name=\"\
    definition\"><br>\n    <input type=\"radio\" name=\"definition\"><br>\n    <input\
    \ type=\"radio\" name=\"definition\">\n  </fieldset>\n  <p><input type=\"submit\"\
    ></p>\n</form>\n```\n\n![image](Image00037.jpg) Now, save the document in your\
    \ web server’s `/htdocs` directory as `isset_handler.php`\n\n![image](Image00029.jpg)\n\
    \nisset_handler.php\n\n![image](Image00038.jpg) Next create an HTML document containing\
    \ a script to initialize a variable with a submitted value – or with `NULL` if\
    \ no value has been submitted\n\n```php\n<?php\nif (isset($_POST['definition']))\
    \ {\n    $definition = $_POST['definition'];\n    # Format validation to be inserted\
    \ here (step 4).\n    if ($definition != \"\") {\n        echo \"$definition is\
    \ Correct\";\n    } else {\n        echo \"$definition is Incorrect\";\n    }\n\
    } else {\n    echo \"You must select one answer\";\n}\n?>\n```\n\n![image](Image00039.jpg)\n\
    \nTo ensure the user has entered something into a text, PHP provides an `empty()`\
    \ function that accepts a variable argument and returns `TRUE` if its value is\
    \ an empty string, zero, or `NULL`. To ensure the user has entered data in numeric\
    \ format, PHP provides an `is_numeric()` function that accepts a variable argument\
    \ and returns `TRUE` only if its value is a number. More specific data validation\
    \ can be performed using the `preg_match()` function that accepts a “regular expression”\
    \ argument and a variable argument in which to seek a pattern. Typically, this\
    \ is used to ensure an email address is in the expected format:\n\n![image](Image00029.jpg)\n\
    \nvalid.php\n\n![image](Image00036.jpg) Create an HTML document containing a form\
    \ with two text fields for data submission\n\n```html\n<form action=\"valid_handler.php\"\
    \ method=\"POST\">\n  <fieldset>\n    <legend>Enter a quantity and email address</legend>\n\
    \    <p>Quantity : <input type=\"text\" name=\"quantity\"></p>\n    <p>Email Address\
    \ : <input type=\"text\" name=\"email\"></p>\n  </fieldset>\n  <p><input type=\"\
    submit\"></p>\n</form>\n```\n\n![image](Image00037.jpg) Now, save the document\
    \ in your web server’s `/htdocs` directory as `valid.php`\n\n![image](Image00029.jpg)\n\
    \nvalid_handler.php\n\n![image](Image00038.jpg) Next, create an HTML document\
    \ containing a PHP script to initialize a variable with a submitted value – or\
    \ with `NULL` if no value has been submitted\n\n```php\n<?php\nif (!empty($_POST['quantity']))\
    \ {\n    $quantity = $_POST['quantity'];\n    # Format validation to be inserted\
    \ here (step 4).\n} else {\n    $quantity = NULL;\n    echo 'You must enter a\
    \ quantity<br>';\n}\n?>\n```\n"
  trans: "\n\n# 序言\n\n处理来自网页上 HTML 表单提交的数据可能是 PHP 脚本执行的最基础的任务之一。\n\nHTML `<form>`\
    \ 标签的 `action` 属性用于指定将处理（处理）表单数据的 PHP 脚本。此外，`<form>` 标签的 `method` 属性用于指定数据如何发送到脚本——通常通过\
    \ `POST` 方法。因此，HTML 表单标签和属性看起来可能如下所示：\n\n```html\n<form action=\"script.php\"\
    \ method=\"POST\">\n```\n\nPHP 提供了一个特殊的“超全局”`$_POST` 数组变量，在其中存储通过 `POST` 方法提交的表单数据。它会创建一个与每个提交的表单元素名称同名的数组元素，并存储它们所包含的值。例如，使用这个表单元素时：\n\
    \n```html\n<input type=\"text\" name=\"email\">\n```\n\n![image](img/Image00019.jpg)\n\
    \n该操作对大小写敏感，因此大小写必须与描述完全一致——例如，`$_POST['EMail']` 或 `$_Post['email']` 都是错误的。\n\n\
    提交表单时，PHP 将创建一个名为 `$_POST['email']` 的数组元素，其中包含用户在该表单输入框中输入的值。\n\n为了方便识别，可以将与表单元素同名的\
    \ PHP 变量赋值为存储在对应 `$_POST` 数组元素中的值。然后可以将这些值显示在由 action 处理脚本创建的响应页面中：\n\n![image](img/Image00029.jpg)\n\
    \naction.php\n\n![image](img/Image00036.jpg) 创建一个包含三个文本输入字段用于数据提交的表单的 HTML 文档\n\
    \n```html\n<form action=\"action_handler.php\" method=\"POST\">\n  <dl>\n    <dt>Name:</dt>\n\
    \    <dd><input type=\"text\" name=\"name\"></dd>\n    <dt>Email Address:</dt>\n\
    \    <dd><input type=\"text\" name=\"mail\"></dd>\n    <dt>Comments:</dt>\n  \
    \  <dd><textarea rows=\"5\" cols=\"20\" name=\"comment\"></textarea></dd>\n  </dl>\n\
    \  <p><input type=\"submit\"></p>\n</form>\n```\n\n![image](img/Image00037.jpg)\
    \ 现在，将文档保存到你 Web 服务器的 `/htdocs` 目录下名为 `action.php`\n\n![image](img/Image00029.jpg)\n\
    \naction_handler.php\n\n![image](img/Image00038.jpg) 接下来创建一个包含脚本的 HTML 文档，将表单值赋值给同名的\
    \ PHP 变量以便输出\n\n```php\n<?php\n$name = $_POST['name'];\n$mail = $_POST['mail'];\n\
    $comment = $_POST['comment'];\necho \"<p>Thanks for this comment $name ...</p>\"\
    ;\necho \"<p><i> $comment </i></p>\";\necho \"<p>We will reply to $mail </p>\"\
    ;\n?>\n```\n\n![image](img/Image00039.jpg) 将文档保存到你 Web 服务器的 `/htdocs` 目录下名为 `action_handler.php`，然后通过\
    \ HTTP 访问 `action.php` 并提交一些数据，查看它们如何显示在 PHP 脚本生成的响应页面中\n\n![image](img/Image00154.jpg)\n\
    \n![image](img/Image00155.jpg)\n\n![image](img/Image00005.jpg)\n\n表单提交方法可以是“GET”或“POST”。`GET`\
    \ 方法将 name=value 键值对附加到 URL 中，但主要用于请求信息——例如检索数据库记录。`POST` 方法可以提交更多数据，由于数据没有附加到\
    \ URL 中，它更安全，并且主要用于需要执行的操作场景——例如更新数据库记录。因此，本书中的大多数示例都优先使用 `POST` 方法。\n\n## 检查设置的值\n\
    \nPHP 可以使用内置的 `isset()` 函数轻松地确保用户已向提交的 HTML 表单字段输入了数据。该函数接受变量名作为参数，并仅在该变量被设置（set）时才返回\
    \ `TRUE`。在技术上，测试一个条件是否为非 `TRUE` 比测试它是否为 `TRUE` 更高效——因为需要评估的可能性较少。\n\n由于用户可能会无意中提交空字段或格式错误的表单，因此你的脚本确保必要字段已填写至关重要。可以使用\
    \ `isset()` 进行条件测试以指示哪些字段被遗漏了：\n\n![image](img/Image00029.jpg)\n\nisset.php\n\n\
    ![image](img/Image00036.jpg) 创建一个包含三个单选按钮用于提交的 HTML 文档\n\n```html\n<form action=\"\
    isset_handler.php\" method=\"POST\">\n  <fieldset>\n    <legend>What kind of language?</legend>\n\
    \    <input type=\"radio\" name=\"definition\"><br>\n    <input type=\"radio\"\
    \ name=\"definition\"><br>\n    <input type=\"radio\" name=\"definition\">\n \
    \ </fieldset>\n  <p><input type=\"submit\"></p>\n</form>\n```\n\n![image](img/Image00037.jpg)\
    \ 现在，将文档保存到你 Web 服务器的 `/htdocs` 目录下名为 `isset_handler.php`\n\n![image](img/Image00029.jpg)\n\
    \nisset_handler.php\n\n![image](img/Image00038.jpg) 接下来创建一个包含脚本的 HTML 文档，用提交的值初始化变量——如果没有提交任何值，则初始化为\
    \ `NULL`\n\n```php\n<?php\nif (isset($_POST['definition'])) {\n    $definition\
    \ = $_POST['definition'];\n    # 格式验证在此处插入（第 4 步）。\n    if_definition != \"\"\
    ) {\n        echo \"$definition is Correct\";\n    } else {\n        echo \"$definition\
    \ is Incorrect\";\n    }\n} else {\n    echo \"You must select one answer\";\n\
    }\n?>\n```\n\n![image](img/Image00039.jpg)\n\n为了确保用户在文本输入了内容，PHP 提供了 `empty()`\
    \ 函数，它接受变量参数，如果其值为空字符串、零或 `NULL` 则返回 `TRUE`。为了确保用户输入的是数字格式，PHP 提供了 `is_numeric()`\
    \ 函数，它接受变量参数，并仅在其值为数字时返回 `TRUE`。更具体的数据验证可以使用 `preg_match()` 函数执行，它接受一个“正则表达式”参数和一个搜索模式的变量参数。通常，这用于确保电子邮件地址符合预期格式：\n\
    \n![image](img/Image00029.jpg)\n\nvalid.php\n\n![image](img/Image00036.jpg) 创建一个包含两个文本字段用于数据提交的\
    \ HTML 文档\n\n```html\n<form action=\"valid_handler.php\" method=\"POST\">\n  <fieldset>\n\
    \    <legend>Enter a quantity and email address</legend>\n    <p>Quantity : <input\
    \ type=\"text\" name=\"quantity\"></p>\n    <p>Email Address : <input type=\"\
    text\" name=\"email\"></p>\n  </fieldset>\n  <p><input type=\"submit\"></p>\n\
    </form>\n```\n\n![image](img/Image00037.jpg) 现在，将文档保存到你 Web 服务器的 `/htdocs` 目录下名为\
    \ `valid.php`\n\n![image](img/Image00029.jpg)\n\nvalid_handler.php\n\n![image](img/Image00038.jpg)\
    \ 接下来创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量——如果没有提交任何值，则初始化为 `NULL`\n\n```php\n<?php\n\
    if (!empty($_POST['quantity'])) {\n    $quantity = $_POST['quantity'];\n    #\
    \ 格式验证在此处插入（第 4 步）。\n} else {\n    $quantity = NULL;\n    echo 'You must enter\
    \ a quantity<br>';\n}\n?>\n```\n\n"
