    operand. It returns the inverse value of the given operand, so if the variable
    `$var` is a `TRUE` value then `! $var` would return a `FALSE` value. The `!` operator
    is useful to toggle the value of a variable in a loop with a statement like `$var
    = ! $var` . On each iteration the value is reversed, like flicking a switch on
    and off.


