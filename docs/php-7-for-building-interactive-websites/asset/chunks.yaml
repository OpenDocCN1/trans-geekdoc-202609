- raw: " •  PHP code is enclosed in special start and end processing tags that allow\
    \ you to jump into and out of “PHP mode”, to implement instructions within an\
    \ HTML document.\n\n •  PHP code is executed on the server (“server-side”), unlike\
    \ JavaScript code that is executed in the browser (“client-side”). The client\
    \ receives the results of running the script without knowing what the underlying\
    \ code was. Recently, server-side has become to be known as “The Cloud”.\n\n![image](Image00003.jpg)\n\
    \nThe New icon pictured above appears in this book to indicate new features introduced\
    \ in PHP version 7.\n\n **Understanding The Cloud** \n\nWhenever a user asks to\
    \ view a web page in their browser, it requests the page from the web server and\
    \ receives the page in response, via the HTTP protocol. Where a web page contains\
    \ PHP script, the web server will first call upon the PHP engine to process the\
    \ code before sending the response to the web browser:\n\n![image](Image00004.jpg)\n\
    \n![image](Image00005.jpg)\n\nHTTP (HyperText Transfer Protocol) is the common\
    \ communication standard that allows any computer connected to any web server\
    \ to access files across the web.\n\nThe ensuing pages describe how to create\
    \ a development environment for interactive websites by installing the following\
