- raw: " •  Parameter values are specified by an = character and are appended to a\
    \ URL after a  **?**  and are separated by  **&** \n\n •  A SimpleXML object can\
    \ be written as an XML file on the server using the  **asXml()**  function\n\n\
    \ •  Selected components of a SimpleXML object can be dynamically incorporated\
    \ into a PHP application\n\n![image](Image00232.jpg)\n\n![image](Image00233.jpg)\n\
    \n![image](Image00234.jpg)"
  fmt: '

    - Parameter values are specified by an `=` character and are appended to a URL
    after a `?` and are separated by `&`。

    - A `SimpleXML` object can be written as an XML file on the server using the `asXml()`
    function。

    - Selected components of a `SimpleXML` object can be dynamically incorporated
    into a PHP application.


    ![image](Image00232.jpg)

    ![image](Image00233.jpg)

    ![image](Image00234.jpg)

    '
  trans: '


    - 参数值通过 `=` 字符指定，并附加在 `?` 之后的 URL 后，参数之间用 `&` 分隔。

    - `SimpleXML` 对象可以使用 `asXml()` 函数写入服务器上的 XML 文件。

    - `SimpleXML` 对象的所选组件可以动态集成到 PHP 应用程序中。


    ![image](img/Image00232.jpg)

    ![image](img/Image00233.jpg)

    ![image](img/Image00234.jpg)

    '
