- raw: "Some Web Services provide a static URL, like the Yahoo! RSS feed in the previous\
    \ example, that simply delivers XML data pre- determined by the content supplier.\
    \ Other Web Services provide a more flexible API (Application Programming Interface)\
    \ that allows you to specify parameters in the URL request to determine what data\
    \ you will receive, and in which format.\n\n![image](Image00225.jpg)\n\nDiscover\
    \ more about OpenWeatherMap at [**openweathermap.org**](http://www.openweathermap.org)\
    \ and sign up to receive your own ID key.\n\nOpenWeatherMap has a free Current\
    \ Weather Data API that can be found at **[http://api.openweathermap.org/data/2.5/weather](http://api.openweathermap.org/data/2.5/weather)**\n\
    \nThe Current Weather Data API allows you to request weather data in many forms.\
    \ The parameters provided by this API include:\n\n •  **q** = city name (or city\
    \ name, country code)\n\n •  **units** = metric (celsius), imperial (fahrenheit),\
    \ or standard (kelvin, the default) temperature scale\n\n •  **mode** = xml, html,\
    \ or json (the default) format\n\n •  **appid** = required authorization key,\
    \ supplied free upon registration at OpenWeatherMap\n\nThe parameters and required\
    \  **\\=**  values are appended to the OpenWeatherMap URL after a  **?**  and\
    \ are separated by  **&**  .\n\nThe response from OpenWeatherMap can be delivered\
    \ as an XML file that may be written into the web server’s  **/htdocs**  folder\
    \ using the PHP  **asXml()**  function to specify a filename. This can be examined\
    \ in the web browser to discover the nature of the data retrieved, the XML element\
    \ names, attribute names and structure:\n\n![image](Image00029.jpg)\n\nparams.php\n\
    \n![image](Image00085.jpg) Begin a PHP script by assigning string values to four\
    \ variables, which will be used to set response parameters\n\n **<?php** \n\n\
    **$city \\= ‘New York’ ;**\n\n**$units \\= ‘imperial’ ;**\n\n**$mode \\= ‘xml’\
    \ ;**\n\n**$id \\= ‘28df3c64f387cf55026e0de3fb8beaa4’ ;**\n\n![image](Image00086.jpg)\
    \ Next, add a statement to build a request string using specified parameter values\n\
    \n**$request \\=**\n\n**‘http://api.openweathermap.org/data/2.5/weather?’ .**\n\
    \n**‘q=’ . $city . ’&units=’ . $units . ’&mode=’ . $mode . ’&APPID=’ . $id ;**\n\
    \n![image](Image00087.jpg) Now, add a statement to load XML data using the request\
    \ string parameters, or quit\n\n**$xml \\= simplexml\\_load\\_file( $request )**\n\
    \n**or die( ‘Unable to load data!’ ) ;**\n\n![image](Image00215.jpg)\n\nparams.xml\n\
    \n![image](Image00088.jpg) When a response is received, attempt to write the content\
    \ as an XML file in the web server’s  **/htdocs**  directory\n\n **try** \n\n\
    \ **{** \n\n**$xml \\->asXml( ‘params.xml’ ) ;**\n\n **// Statement to be inserted\
    \ here (step 5).** \n\n **}** \n\n**catch( Exception $e )**\n\n **{** \n\n**echo\
    \ ‘Error : ‘ . $e \\->getMessage() ;**\n\n **}** \n\n![image](Image00089.jpg)\
    \ Insert a statement to relocate the browser to view the newly created XML document\n\
    \n**header( ‘Location: params.xml’ ) ;**\n\n![image](Image00091.jpg) Save the\
    \ PHP script in your web server’s  **/htdocs**  directory as  **params.php** \
    \ then open the page via HTTP to examine the XML content of the retrieved response\n\
    \n![image](Image00226.jpg)\n\n![image](Image00006.jpg)\n\nThe response will only\
    \ contain weather data for prevailing conditions.\n\n![image](Image00227.jpg)\n\
    \nThe data highlighted here is that of most interest. It can be retrieved using\
    \ each containing element name and attribute name.\n\n **Selecting components**\
    \ \n\nHaving examined the response data retrieved from OpenWeatherMap on the previous\
    \ page, selected components can be dynamically incorporated into a PHP sticky\
    \ form XML App:\n\n![image](Image00029.jpg)\n\nweather.php\n\n![image](Image00085.jpg)\
    \ Begin a PHP script by loading a page header file to provide a banner image\n\
    \n **<?php** \n\n**include( ‘includes/weather-header.html’ ) ;**\n\n![image](Image00086.jpg)\
    \ Next, add a conditional test to see if the page has been opened by form submission\n\
    \n**if( $\\_SERVER\\[ ‘REQUEST\\_METHOD’ \\] \\== ‘POST’ )**\n\n **{** \n\n **//\
    \ Statements to be inserted here (steps 3-6).** \n\n **}** \n\n![image](Image00087.jpg)\
    \ Inside the conditional test block, assign parameter string values to four variables\n\
    \n**$city \\= ( empty( $\\_POST\\[ ‘city’ \\] ) ) ? ”New York”**\n\n **: $\\_POST\\\
    [ ‘city’ \\] ;** \n\n**$units \\= ‘imperial’ ;**\n\n**$mode \\= ‘xml’ ;**\n\n\
    **$id \\= ‘28df3c64f387cf55026e0de3fb8beaa4’ ;**\n\n![image](Image00088.jpg) Next,\
    \ inside the conditional test block, insert a statement to build a request string\
    \ using specified parameter values\n\n**$request \\=**\n\n**‘http://api.openweathermap.org/data/2.5/weather?’\
    \ .**\n\n**‘q=’ . $city . ’&units=’ . $units . ’&mode=’ . $mode . ’&APPID=’ .\
    \ $id ;**\n\n![image](Image00089.jpg) Now, inside the conditional test block insert\
    \ a statement to load XML data using the parameters, or quit\n\n**$xml \\= simplexml\\\
    _load\\_file( $request )**\n\n**or die( ‘Unable to load data!’ ) ;**\n\n![image](Image00091.jpg)\
    \ Finally, insert statements to output retrieved data\n\n**$icon \\= ‘ http://openweathermap.org/img/w/’\
    \ .**\n\n**$xml->weather\\[ ‘icon’ \\] . ’.png’ ;**\n\n**echo ‘<h1>Today in ‘\
    \ . $xml->city\\[ ‘name’ \\] ;**\n\n**echo ‘ it\\\\’s ‘ . $xml->weather\\[ ‘value’\
    \ \\] .**\n\n**’ <img src=’ . $icon . ’></h1>’ ;**\n\n**echo ‘<ul><li>Temperature\
    \ : ‘ . $xml->temperature\\[‘value’\\] ;**\n\n**echo ‘&deg; ‘ . $xml->temperature\\\
    [ ‘unit’ \\] ;**\n\n**echo ‘<li>Wind : ‘ . $xml->wind->speed\\[ ‘name’ \\] ;**\n\
    \n**echo ‘<li>Humidity : ‘ . $xml->humidity\\[‘value’\\] . ’&#37;</ul>’ ;**\n\n\
    ![image](Image00005.jpg)\n\nNotice that a default city value is assigned in case\
    \ the form is submitted without user input.\n\n![image](Image00005.jpg)\n\nThe\
    \ value of the **icon** attribute is the name of a PNG image file. When concatenated\
    \ to the path and **.png** file extension, it provides an appropriate weather\
    \ image.\n\n![image](Image00096.jpg) After the test block, add statements to create\
    \ a form\n\n**echo ‘<form method=”POST ” action=”weather.php ”>’ ;**\n\n**echo\
    \ ‘<fieldset><legend>Enter City Name</legend>’ ;**\n\n**echo ‘ <input type=”text”\
    \ name=”city”>’ ;**\n\n**echo ‘<input type=”submit”**\n\n**name=”submission” value\
    \ = ”Get Weather”>’ ;**\n\n**echo ‘</fieldset></form>’ ;**\n\n![image](Image00228.jpg)\
    \ Finally, in the script, load a page footer file to display icons denoting the\
    \ technologies employed by this app\n\n**include( ‘includes/weather-footer.html’\
    \ ) ;**\n\n![image](Image00229.jpg) Save the PHP script in your web server’s \
    \ **/htdocs**  directory as  **weather.php**  then open the page via HTTP and\
    \ submit the form to see weather for the default New York location. Enter another\
    \ city name and re-submit to see that weather report\n\n![image](Image00230.jpg)\n\
    \n![image](Image00231.jpg)\n\n![image](Image00006.jpg)\n\nThe **action** attribute\
    \ specifies this same script filename to make the form sticky.\n\n **Summary**\
    \ \n\n •  XML elements must each have an opening and closing tag and be correctly\
    \ nested to be well-formed\n\n •  PHP has an XML parser called SimpleXML that\
    \ can load an XML document into memory as a hierarchical tree structure\n\n •\
    \  The  **simplexml\\_load\\_file()**  function creates a data structure of SimpleXMLElement\
    \ objects\n\n •  The data structure of a SimpleXML object describes a parent-\
    \ child relationship between outer and inner XML elements\n\n •  Each member of\
    \ a SimpleXML data structure is a node\n\n •  Top-level nodes are direct child\
    \ descendants of the SimpleXML object itself\n\n •  Nodes can be referenced using\
    \ the  **\\->**  object operator to address each generation of the hierarchical\
    \ tree structure\n\n •  The  **children()**  method returns all child nodes and\
    \ can be used to loop through tree nodes to retrieve each node’s content\n\n •\
    \  Attributes can be referenced by stating the attribute name, within quotes,\
    \ between brackets following the node name\n\n •  RSS feeds deliver regularly\
    \ updated data in XML format\n\n •  RSS is a dialect of XML in which all documents\
    \ must have a top-level  **<rss>**  element containing a  **<channel>**  element\n\
    \n •  Web Services may provide a static URL or an API that allows you to specify\
    \ parameters in the URL request"
