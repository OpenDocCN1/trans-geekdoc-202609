    \n| Element content || A || B || C || D || E |\n| --- | --- | --- | --- | ---\
    \ | --- |\n| Index numbers || [0] || [1] || [2] || [3] || [4] |\n\n![image](Image00048.jpg)\n\
    \nArrays can also have multiple indices – to represent multiple dimensions. An\
    \ array created with two indices is a two-dimensional array in which the elements\
    \ appear in multiple rows:\n\n| First index || [0] || A || B || C || D || E |\n\
    | --- | --- | --- | --- | --- | --- | --- |\n| | [1] | F || G || H || I || J |\n\
    | Second index || [0] || [1] || [2] || [3] || [4] |\n\nWith multi-dimensional\
    \ arrays, the value contained in each element is referenced by stating the number\
    \ of each index. For example, with the two-dimensional array above the element\
    \ [1][2] contains the letter H. Two-dimensional arrays are useful to store grid-based\
    \ information, such as XY coordinates. Creating a three-dimensional array, with\
    \ three indices, would allow XYZ coordinates to be stored.\n\nCreating a multi-dimensional\
    \ array in PHP is simply a matter of creating an outer array, whose elements are\
    \ themselves arrays. As usual you may optionally specify a key name for element\
    \ element in this case to represent each inner array. Individual values can then\
    \ be referenced using the key name and inner index: `$matrix['Letter'][0]`\n\n\
    ![image](Image0019.jpg) Multi-dimensional arrays with more than two indices can\
    \ produce hard to read code and may lead to errors. It is, however, necessary\
    \ to always enclose array variables that use quoted keys within curly braces when\
    \ included in a string: `echo “Element value is {$matrix['Letter'][0]}” ;`\n\n\
    All inner arrays in a multi-dimensional array can be accessed using a `foreach`\
    \ loop to iterate through the arrays. A nested `foreach` loop can then reference\
    \ each element in turn.\n\n![image](Image0029.jpg) matrix.php\n\n![image](Image0036.jpg)\
    \ Create a valid HTML document, like the one listed [here](#text00003.html#sec5),\
    \ then insert PHP tags into the body section\n\n```php\n<?php\n# Statements to\
    \ be inserted here.\n?>\n```\n\n![image](Image0037.jpg) Now, insert between the\
    \ PHP tags a statement to create and initialize two regular arrays and a two-dimensional\
    \ array with key names\n\n`$letters = array( ‘A’ , ‘B’ , ‘C’ ) ;`\n`$numbers =\
    \ array( 1 , 2 , 3 ) ;`\n`$matrix = array( ‘Letter’ => $letters , ‘Number’ =>\
    \ $numbers ) ;`\n\n![image](Image0038.jpg) Next, insert a statement to display\
    \ a single value `echo “<p>Start : {$matrix['Letter'][0]}</p>”`\n\n![image](Image0039.jpg)\
    \ Finally, insert statements to display the key and value in all elements as unordered\
    \ lists\n\n```php\nforeach( $matrix as $array )\n{\n    echo ‘<ul>’ ;\n    foreach(\
    \ $list as $key => $value )\n    {\n        echo “<li> $key = $value” ;\n    }\n\
    \    echo ‘</ul>’ ;\n}\n```\n\n![image](Image0040.jpg) Save the document in your\
    \ web server’s `/htdocs` directory as `matrix.php` then open the page via HTTP\
    \ to see the variable array values displayed\n\n![image](Image00049.jpg)\n\n![image](Image00005.jpg)\
    \ Multi-dimensional arrays are more common than you might think. For example,\
    \ an HTML form that allows multiple selections for inputs with the same name are\
    \ submitted as a multi-dimensional array.\n\n![image](Image00006.jpg) Array variables\
    \ that use quoted keys must be enclosed within curly braces when included in a\
    \ string.\n\n## Checking types\n\nPHP variables can store various types of data\
    \ so it is useful to clearly understand each data type in detail:\n\n `string`:\
    \ a series of characters in which each character is the size of one byte, up to\
    \ a maximum length of 2GB. Strings enclosed in single quotes are treated as literals,\
    \ whereas strings in double quotes will interpret special characters.\n- `int`:\
    \ a non-decimal number between 2,147,483,648 and -2,147,483,647, specified as\
    \ a decimal (10-based), hexadecimal (16-based – prefixed with 0x), or octal (8-based\
    \ – prefixed with 0).\n- `float`: a floating-point decimal number or a number\
    \ in exponential format. A float is also known as a “double”.\n- `bool`: an expression\
    \ of a Boolean truth value, which may be only true or false.\n- `array`: an ordered\
    \ map of multiple data values that associates keys to values. The keys are index\
    \ numbered by default or may be explicitly-specified labels.\n- `object`: a class\
    \ containing stored data properties and providing methods to process data.\n-\
    \ `resource`: a reference to an external resource that is created and used by\
    \ special functions.\n- `NULL`: a variable with no value whatsoever. It may have\
    \ not been initialized, have been assigned the `NULL` constant, or have been nullified\
    \ by the PHP `unset()` function.\n\n![image](Image00005.jpg) The creation and\
    \ use of PHP class objects are demonstrated fully in [Chapter 7](#text00009.html).\n\
    \nThe data type of any item can be checked by specifying it as the argument to\
    \ the `gettype()` function. For example, where a variable `$num` contains an integer\
    \ value, `gettype($num)` will return “integer” and where a variable `$str` contains\
    \ a string value, `gettype($str)` will return “string”, and so on. Where the data\
    \ type cannot be identified the `gettype()` function will return “unknown type”.\n\
    \nPerhaps more usefully, the `var_dump()` function can check an item’s data type\
    \ and will dump structured information that displays its type and value.\n"
  trans: "\n\n```php\n<?php\n# 在此处插入语句。\n?>\n```\n\n![image](img/Image00037.jpg) 现在，在\
    \ PHP 标签之间插入一条语句，创建并初始化一个带有键名和值的变量数组\n\n`$cars = array( ‘Dodge’ => ‘Viper’ , ‘Chevrolet’\
    \ => ‘Camaro’ , ‘Ford’ => ‘Mustang’ ) ;`\n\n![image](img/Image00038.jpg) 接下来，插入语句将数组的所有键和值以项目列表的形式显示在定义列表中\n\
    \n```php\necho ‘<dl><dt>Original Element Order :<dd>’ ;\nforeach( $cars as $key\
    \ => $value )\n{ echo ‘ &bull; ‘ , $key . ‘ ‘ . $value ; }\n```\n\n![image](img/Image00039.jpg)\
    \ 然，插入语句按值对数组进行排序并显示。\n\n```php\nasort( $cars ) ;\necho ‘<dt>Sorted Into Value\
    \ Order :<dd>’ ;\nforeach( $cars as $key => $value )\n{ echo ‘ &bull; ‘ , $key\
    \ . ‘ ‘ . $value ; }\n```\n\n![image](img/Image00040.jpg) 最后，插入语句按键对数组进行排序并显示。\n\
    \n```php\nksort( $cars ) ;\necho ‘<dt>Sorted Into Key Order :<dd>’ ;\nforeach(\
    \ $cars as $key => $value )\n{ echo ‘ &bull; ‘ , $key . ‘ ‘ . $value ; }\necho\
    \ ‘</dl>’ ;\n```\n\n![image](img/Image00041.jpg) 将文档保存到网络服务器的 `/htdocs` 目录中并命名为\
    \ `sort.php`，然后通过 HTTP 打开页面以查看排序后的数组值显示。\n\n![image](img/Image00047.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n你可以使用 `count()` 函数发现数组中元素的数量。例如，`$num = count( $array ) ;`\n\n![image](img/Image00006.jpg)\
    \ 在键很重要的情况下，请勿使用 `sort()` 或 `rsort()` 函数。\n\n## 描述维度\n\n数组元素的编号更准确的说法是“数组索引”，由于元素编号从零开始，因此有时被称为“基于零的索引”。使用单个索引创建的数组是一维数组，其中元素出现在单行中：\n\
    \n| 元素内容 || A || B || C || D || E |\n| --- | --- | --- | --- | --- | --- |\n|\
    \ 索引数字 || [0] || [1] || [2] || [3] || [4] |\n\n![image](img/Image00048.jpg)\n\n\
    数组也可以有多个索引以表示多个维度。使用两个索引创建的数组是二维数组，其中元素出现在多行中：\n\n| 第一个索引 || [0] || A || B ||\
    \ C || D || E |\n| --- | --- | --- | --- | --- | --- |\n| | [1] | F || G || H\
    \ || I || J |\n| 第二个索引 || [0] || [1] || [2] || [3] || [4] |\n\n对于多维数组，每个元素中包含的值通过列出每个索引的数字来引用。例如，在上面的二维数组中，元素\
    \ [1][2] 包含字母 H。二维数组用于存储网格信息，例如 XY 坐标。创建一个具有三个索引的三维数组将允许存储 XYZ 坐标。\n\n在 PHP 中创建多维数组只需只需创建一个外部数组，其元素本身也是数组。与通常一样，你可以选择性为此情况下的每个元素指定键名，以表示每个内部数组。然后可以使用键名和内部索引引用单独的值：`$matrix['Letter'][0]`\n\
    \n![image](img/Image0019.jpg) 具有两个以上索引的多维数组可能会产生难以阅读的代码并可能导致错误。然而，在字符串中包含使用带引号键的数组变量时，始终将其括在花括号内：`echo\
    \ “Element value is {$matrix['Letter'][0]}” ;`\n\n可以使用 `foreach` 循环遍历数组来访问多维数组中的所有内部数组。嵌套的\
    \ `foreach` 循环可以轮引用每个元素。\n\n![image](img/Image0029.jpg) matrix.php\n\n![image](img/Image0036.jpg)\
    \ 创建一个有效的 HTML 文档，如此处 所列出的那样，然后在正文部分插入 PHP 标签\n\n```php\n<?php\n# 在此处插入语句。\n?>\n\
    ```\n\n![image](img/Image00037.jpg) 现在，在 PHP 标签之间插入一条语句，创建并初始化两个普通数组和一个带有键名的二维数组\n\
    \n`$letters = array( ‘A’ , ‘B’ , ‘C’ ) ;`\n`$numbers = array( 1 , 2 , 3 ) ;`\n\
    `$matrix = array( ‘Letter’ => $letters , ‘Number’ => $numbers ) ;`\n\n![image](img/Image00038.jpg)\
    \ 接下来，插入语句显示单个值 `echo “<p>Start : {$matrix['Letter'][0]}</p>”`\n\n![image](img/Image00039.jpg)\
    \ 最后，插入语句以无序列表的形式显示所有元素中的键和值\n\n```php\nforeach( $matrix as $array )\n{\n    echo\
    \ ‘<ul>’ ;\n    foreach( $array as $key => $value )\n    {\n        echo “<li>$key\
    \ = $value</li>”;\n    }\n    echo ‘</ul>’\n}\n```\n\n![image](img/Image00040.jpg)\
    \ 将文档保存到网络服务器的 `/htdocs` 目录中并命名为 `matrix.php`，然后通过 HTTP 打开页面以查看变量值\n\n![image](img/Image00049.jpg)\n\
    \n![image](img/Image00005.jpg) 多维数组比你想象的要常见。例如，具有相同名称的 HTML 表单作为多维数组提交。\n\n![image](img/Image00006.jpg)\
    \ 使用带引号键的数组变量必须括在花括号内。\n\n## 检查类型\n\nPHP 变量可以存储各种类型的数据，因此清楚了解每种数据类型很有用：\n\nstring：字符序列，其中每个字符的大小为一个字节，最大长度为\
    \ 2GB。单引号内的字符串被视为字面量，而双引号字符串会解释特殊字符。\n- int：在 2,147,483,648 到 -2,147,483,647 之间的非小数数字，指定为十进制（10\
    \ 进制）、十六进制（16 进制 - 前缀为 0x）或八进制（8 进制 - 前缀为 0）。\n- float：浮点小数或指数格式的数字。浮点也被称为“double”。\n\
    - bool：布尔真值表达式，可能只有 true 或 false。\n- array：关联键和值的多个数据值的有序映射。键默认按索引编号，也可以是显式指定的标签。\n\
    - object：包含存储的数据属性并提供处理数据方法的类。\n- resource：特殊函数创建并使用的外部资源的引用。\n- NULL：没有任何值的变量。它可能没有被初始化、被赋值了\
    \ `NULL` 常量，或者被 PHP `unset()` 函数置空。\n\n![image](img/Image00005.jpg) PHP 类对象的创建和使用将在第\
    \ 7 章中充分演示。\n\n可以通过指定项目作为 `gettype()` 函数的参数来检查数据类型。例如，当变量 `$num` 包含整数值时，`gettype($num)`\
    \ 返回“integer”，当变量 `$str` 包含字符串值时，`gettype($str)` 返回“string”，依此类推。当无法识别数据类型时，`gettype()`\
    \ 函数将返回“unknown type”。\n\n也许更有用的是 `var_dump()` 函数可以检查项目的数据类型并输出显示其类型和值的结构化信息。\n\
    \n"
