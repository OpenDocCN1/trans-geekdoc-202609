    \ conditions.\n\n![image](Image0227.jpg) The data highlighted here is of most\
    \ interest. It can be retrieved using each element name and attribute name. Selecting\
    \ components having examined the response data from OpenWeatherMap on the previous\
    \ page can be dynamically incorporated into a PHP sticky XML App:\n\n![image](Image0029.jpg)\
    \ weather.php\n\n![image](Image0085.jpg) Begin a PHP script by loading a page\
    \ header file to provide a banner image.\n\n```php\n<?php\ninclude('includes/header.html');\n\
    ```\n\n![image](Image0086.jpg) Next, add a conditional test to see if the page\
    \ has been opened by form submission.\n\n```php\nif($_SERVER['REQUEST_METHOD']\
    \ == 'POST') {\n    // Statements to inserted here (steps 3-6).\n    $city = (empty($_POST['city']))\
    \ ? \"New York\" : $_POST['city'];\n    $units = 'imperial';\n    $mode = 'xml';\n\
    \    $id = '28df3c64f387cf55026e0de3fb8beaa4';\n}\n```\n\n![image](Image0087.jpg)\
    \ Inside the conditional test block, insert a statement to build a request string\
    \ using specified parameter values.\n\n```php\n$request = 'http://api.openweathermap.org/data/2.5/weather?'\
    \ . 'q=' . $city . '&units=' . $units . '&mode=' . $mode . '&APPID=' . $id;\n\
    ```\n\n![image](Image0088.jpg) Next, inside the conditional test block insert\
    \ a statement to load XML data using the parameters, or quit.\n\n```php\n$xml\
    \ = simplexml_load_file($request) or die('Unable to load data!');\n```\n\n![image](Image0089.jpg)\
    \ Finally, insert statements to output retrieved data.\n\n```php\n$icon = 'http://openweathermap.org/img/w/'\
    \ . $xml->weather['icon'] . '.png';\necho '<h1>Today in ' . $xml->city['name']\
    \ . ' it\\'s ' . $xml->weather['value'] . '<img src=' . $icon . '></</h1>';\n\
    echo '<ul><li>Temperature : ' . $xml->temperature['value'] . '° ' . $xml->temperature['unit']\
    \ . '<li>Wind : ' . $xml->wind->speed['name'] . '<li>Humidity : ' . $xml->humidity['value']\
    \ . '%</li></ul>';\n```\n\n![image](Image0005.jpg) Notice that a default city\
    \ value is assigned in case the form is submitted without user input.\n\n![image](Image0005.jpg)\
    \ The value of the `icon` attribute is the name of a PNG image file. When concatenated\
    \ to the path and `.png` file extension, it provides an appropriate weather image.\n\
    \n![image](Image0096.jpg) After the test block, add statements to create a form.\n\
    \n```php\necho '<form method=\"POST \" action=\"weather.php\">';\necho '<fieldset><legend>Enter\
    \ City Name</legend>';\necho ' <input type=\"text\" name=\"city\">';\necho '<input\
    \ type=\"submit\" name=\"submission\" value=\"Get Weather\">';\necho '</fieldset></form>';\n\
    ```\n\n![image](Image0228.jpg) Finally, in the script, load a page footer file\
    \ to display icons denoting the technologies employed by this app.\n\n```php\n\
    include('includes/weather-footer.html');\n```\n\n![image](Image0229.jpg) Save\
    \ the PHP script in your web server’s `/htdocs` directory as `weather.php` then\
    \ open the page via HTTP and submit the form to see weather for the default New\
    \ York location. Enter another city name and re-submit to see that weather report.\n\
    \n![image](Image00230.jpg)\n![image](Image00231.jpg)\n![image](Image00006.jpg)\
    \ The `action` attribute specifies this same filename to make the form sticky.\n\
    \n### Summary\n\n- XML elements must each have an opening and closing tag and\
    \ be correctly nested to be well-formed.\n- PHP has an XML parser called SimpleXML\
    \ that can load an XML document into memory as a hierarchical tree structure.\n\
    - The `simplexml_load_file()` function creates a data structure of SimpleXMLElement\
    \ objects.\n- The data structure of a SimpleXML object describes a parent-child\
    \ relationship between outer and inner XML elements.\n- Each member of a SimpleXML\
    \ data structure is a node.\n- Top-level nodes are direct child descendants of\
    \ the SimpleXML object itself.\n- Nodes can be referenced using the `->` object\
    \ operator to address each generation of the hierarchical tree structure.\n- The\
    \ `children()` method returns all child nodes and can be used to loop through\
    \ tree nodes to retrieve each node’s content.\n- Attributes can be referenced\
    \ by stating the attribute name, within quotes, between brackets following the\
    \ node name.\n- RSS feeds deliver regularly updated data in XML format.\n- RSS\
    \ is a dialect of XML in which all documents must have a top-level `<rss>` element\
    \ containing a `<channel>` element.\n- Web Services may provide a static URL or\
    \ an API that allows you to specify parameters in the URL request.\n"
  trans: "\n\n某些 Web 服务提供静态 URL，例如上一个示例中的 Yahoo! RSS 馈，它仅交付由内容供应商预先定义的 XML 数据。其他 Web\
