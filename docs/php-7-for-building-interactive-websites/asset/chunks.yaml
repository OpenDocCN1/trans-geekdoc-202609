- raw: "![image](Image00114.jpg) Begin a PHP script with a statement to declare a\
    \ class named “Dog”\n\n **<?php** \n\n**class Dog**\n\n **{** \n\n **// Members\
    \ to be inserted here (steps 2-5).** \n\n **}** \n\n![image](Image00115.jpg) Between\
    \ the braces of the Dog class declaration, declare three private variable members\n\
    \n**private $age ;**\n\n**private $weight ;**\n\n**private $color ;**\n\n![image](Image00116.jpg)\
    \ After the private variables, add a public method to output a string when called\n\
    \n**public function bark () { echo ‘WOOF! WOOF! <br>’ ; }**\n\n![image](Image00117.jpg)\
    \ Add public setter methods – to assign individual argument values to each of\
    \ the private variables\n\n**public function setAge ( int $yrs )**\n\n**{ $this->\
    \ age \\= $yrs ; }**\n\n**public function setWeight ( int $lbs )**\n\n**{ $this->\
    \ weight \\= $lbs ; }**\n\n**public function setColor ( string $fur )**\n\n**{\
    \ $this-> color \\= $fur ; }**\n\n![image](Image00005.jpg)\n\nIn the class declaration,\
    \ notice that all methods are declared public and all variables are declared private.\
    \ This notion of “public interface, private data” is a key concept when creating\
    \ classes.\n\n![image](Image00118.jpg) Add public getter methods – to retrieve\
    \ individual values from each of the private variables\n\n**public function getAge\
    \ () { return $this-> age ; }**\n\n**public function getWeight () { return $this->\
    \ weight ; }**\n\n**public function getColor () { return $this-> color ; }**\n\
    \n![image](Image00119.jpg) After the Dog class declaration, declare an instance\
    \ of the Dog class named “fido”\n\n**$fido \\= new Dog () ;**\n\n![image](Image00120.jpg)\n\
    \nFido\n\n![image](Image00121.jpg) Add statements calling each setter method to\
    \ assign data\n\n**$fido \\-> setAge ( 3 ) ;**\n\n**$fido \\-> setWeight ( 15\
    \ ) ;**\n\n**$fido \\-> setColor ( ‘brown’ ) ;**\n\n![image](Image00122.jpg) Add\
    \ statements calling each getter method to retrieve the assigned values\n\n**echo\
    \ ‘Fido is a ‘ . $fido \\-> getColor (). ’ dog <br>’ ;**\n\n**echo ‘Fido is ‘\
    \ . $fido \\-> getAge (). ’ years old <br>’ ;**\n\n**echo ‘Fido weighs ‘ . $fido\
    \ \\-> getWeight (). ’ pounds<br>’ ;**\n\n![image](Image00123.jpg) Now, add a\
    \ call to the regular output method\n\n$ **fido \\-> bark () ;**\n\n **?>** \n\
    \n![image](Image00124.jpg) Save the document in your web server’s  **/htdocs**\
    \  directory as  **object.php**  then open the page via HTTP to see the output\
    \ class properties and method call\n\n![image](Image00125.jpg)\n\n![image](Image00003.jpg)\n\
    \nA new feature in PHP 7 is the ability to also create “anonymous classes” with\
    \ simple functionality and no name. For example, **$util = new class { public\
    \ function log($s) { echo $s ; } } ;** that can be called with **$util->log( ‘Data’\
    \ ) ;** \n\n![image](Image00005.jpg)\n\nThis **object.php** script will get modified\
    \ over the next few pages as new features are incorporated.\n\n **Initializing\
    \ members** \n\nA program can easily create multiple objects simply by declaring\
    \ multiple instances of a class, and each object can have unique attributes by\
    \ assigning individual values with its setter methods.\n\nIt is often convenient\
    \ to combine the setter methods into a single method that accepts arguments for\
    \ each private variable. This means that all values can be assigned with a single\
    \ statement in the program, but the method will contain multiple statements.\n\
    \nOptionally, each parameter can specify a permissible data type for each argument\
    \ being passed, and may also usefully specify default values to each parameter:\n\
    \n![image](Image00029.jpg)\n\ninitializer.php\n\n![image](Image00114.jpg) Rename\
    \ a copy of the previous example “object.php” as a new program “initializer.php”\n\
    \n![image](Image00115.jpg) In the Dog class declaration, replace the three setter\
    \ methods with a single combined setter method that specifies the argument data\
    \ types and default values\n\n**public function setValues**\n\n**( int $yrs \\\
    = 2 , int $lbs \\= 8 , string $fur \\= ‘black’ )**\n\n **{** \n\n **// Statements\
    \ to be inserted here.** \n\n **}** \n\n![image](Image00116.jpg) In the method\
    \ definition block, insert three statements to assign values from passed arguments\
    \ to class variables\n\n**$this-> age \\= $yrs ;**\n\n**$this-> weight \\= $lbs\
    \ ;**\n\n**$this-> color \\= $fur ;**\n\n![image](Image00117.jpg) After the modified\
    \ class definition, replace the calls to the three setter methods by a single\
    \ call to the combined setter method – passing three arguments\n\n**$fido \\->\
    \ setValues ( 3 , 15 , ‘brown’ ) ;**\n\n![image](Image00118.jpg) Declare a second\
    \ instance of the Dog class named “pooch”\n\n**$pooch \\= new Dog () ;**\n\n![image](Image00119.jpg)\
    \ Add a second call to the combined setter method – passing three arguments for\
    \ the new object\n\n**$pooch \\-> setValues ( 4 , 18 , ‘gray’ ) ;**\n\n![image](Image00005.jpg)\n\
    \nTry passing an incorrect data type to the initializer method to see a type error\
    \ occur.\n\n![image](Image00121.jpg) Add statements calling each getter method\
    \ to retrieve the assigned values\n\n**echo ‘<hr>Pooch: ‘ . $pooch \\-> getAge\
    \ (). ’yrs’ ;**\n\n**echo $pooch \\-> getWeight (). ’lbs ’ . $pooch \\-> getColor\
    \ () ;**\n\n![image](Image00122.jpg) Add a second call to the regular output method\n\
    \n**$pooch \\-> bark () ;**\n\n![image](Image00123.jpg) Now, declare a third instance\
    \ of the Dog class named “rover”\n\n**$rover \\= new Dog () ;**\n\n![image](Image00124.jpg)\
    \ Add a third call to the combined setter method – this time passing no arguments\
    \ for the new object\n\n**$rover \\-> setValues ( ) ;**\n\n![image](Image00126.jpg)\
    \ Add statements calling each getter method to retrieve the assigned values, which\
    \ are specified default values\n\n**echo ‘<hr>Rover: ‘ . $rover \\-> getAge ().\
    \ ’yrs’ ;**\n\n**echo $rover \\-> getWeight (). ’lbs ’ . $rover \\-> getColor\
    \ () ;**\n\n![image](Image00127.jpg) Add a third call to the regular output method\n\
    \n**$rover \\-> bark () ;**\n\n![image](Image00128.jpg) Save the document in your\
    \ web server’s  **/htdocs**  directory as  **initializer.php**  then open the\
    \ page via HTTP to see the output set by the combined initializer method\n\n![image](Image00129.jpg)\n\
    \n![image](Image00130.jpg)\n\n![image](Image00006.jpg)\n\nYou must still call\
    \ the initializer method here, to assign the default values to the class variables\
    \ when passing no arguments.\n\n **Using constructors** \n\nClass variable members\
    \ can be initialized by a special “constructor” method that is called whenever\
    \ an instance of the class is created. The constructor method is always named\
    \ \\_\\_ **construct()**  and can accept arguments to set the initial value of\
    \ class variables.\n\n![image](Image00131.jpg)\n\nA constructor method has a companion\
    \ “destructor” method – that is called whenever an instance of the class is destroyed.\
    \ The destructor method is always named \\_\\_ **destruct()**  .\n\nConstructor\
    \ and destructor methods have no return value and are called automatically – they\
    \ cannot be called explicitly, and consequently their declarations need no access\
    \ specifier.\n\nValues to initialize class variables are passed to the constructor\
    \ method in the statement creating an object, in parentheses following the object\
    \ name:\n\n![image](Image00029.jpg)\n\nconstructor.php\n\n![image](Image00114.jpg)\
    \ Rename a copy of the previous example “initializer.php” as a new program “constructor.php”\n\
    \n![image](Image00115.jpg) In the Dog class declaration, replace the setValues\
    \ method with this constructor\n\n **function construct** \n\n**( int $yrs \\\
    = 2 , int $lbs \\= 8 , string $fur \\= ‘black’ )**\n\n **{** \n\n**$this-> age\
    \ \\= $yrs ;**\n\n**$this-> weight \\= $lbs ;**\n\n**$this-> color \\= $fur ;**\n\
    \n **}** \n\n![image](Image00116.jpg) Now, add a simple destructor method\n\n\
    **function \\_\\_destruct() { echo ‘<hr>Object Destroyed.’ ; }**\n\n![image](Image00117.jpg)\
    \ After the Dog class declaration, edit the statement creating the “fido” object\
    \ – to pass values to its constructor method, in order to initialize properties\n\
    \n**$fido \\= new Dog ( 3 , 15 , ‘brown’ ) ;**\n\n![image](Image00118.jpg) Similarly,\
    \ edit the statement creating the “pooch” object – to pass values to the constructor\
    \ method\n\n**$pooch \\= new Dog ( 4 , 18 , ‘gray’ ) ;**\n\n![image](Image00005.jpg)"
