- raw: "The definition of a class method is also known as the method “implementation”.\n\
    \n![image](Image00119.jpg) Also edit the statement creating the “rover” object\
    \ – to use default values of the constructor method\n\n**$rover \\= new Dog (\
    \ ) ;**\n\n![image](Image00121.jpg) Delete the statements calling the setValues\
    \ method of all three objects – the constructor now replaces that method\n\n![image](Image00006.jpg)\n\
    \nAlthough the initial values of the variable members are set by the constructor,\
    \ setter methods can be added to subsequently change the values – and those new\
    \ values can be retrieved by the getter methods.\n\nPHP provides several functions\
    \ to interrogate classes such as  **class\\_exists(*class* )**  ,  **method\\\
    _exists(*class, method* )**  , and  **property\\_exists(*class, property* )**\
    \  that return  **TRUE**  on success. You can also get a list of class members\
    \ with  **get\\_class\\_vars(*class* )**  and  **get\\_class\\_methods(*class*\
    \ )**  to see only “visible” members:\n\n![image](Image00122.jpg) Add statements\
    \ to display the total number of accessible variables in the Dog class\n\n**$items\
    \ \\= get\\_class\\_vars( ‘ Dog’ ) ;**\n\n**echo ‘<br>Dog variables : ‘ .count(\
    \ $items ) ;**\n\n![image](Image00123.jpg) Add statements to display the names\
    \ of accessible methods in the Dog class\n\n**echo ‘<br>Dog methods :’ ;**\n\n\
    **$items \\= get\\_class\\_methods( ‘ Dog’ ) ;**\n\n**foreach( $items as $item\
    \ ) { echo “ $item , ” ; }**\n\n![image](Image00124.jpg) Save the document in\
    \ your web server’s  **/htdocs**  directory as  **constructor.php**  then open\
    \ the page via HTTP to see the output set by the constructor\n\n![image](Image00132.jpg)\n\
    \n![image](Image00005.jpg)\n\nThe number of visible variables is zero. Temporarily\
    \ change their access specifier to public and see it become 3 – encapsulation\
    \ in action.\n\n **Inheriting properties** \n\nA PHP class can be created as a\
    \ brand new class, like those in previous examples, or can be “derived” from an\
    \ existing class. Importantly, a derived class inherits members of the parent\
    \ (base) class from which it is derived – in addition to its own members.\n\n\
    ![image](Image00133.jpg)\n\nThe ability to inherit members from a base class allows\
    \ derived classes to be created that share certain common properties, which have\
    \ been defined in the base class. For example, a “Polygon” base class may define\
    \ width and height properties that are common to all polygons. Classes of “Rectangle”\
    \ and Triangle” could be derived from the Polygon class – inheriting width and\
    \ height properties, in addition to their own members defining their unique features.\n\
    \n![image](Image00134.jpg)\n\nThe virtue of inheritance is extremely powerful\
    \ and is the second principle of Object Oriented Programming (OOP).\n\nA derived\
    \ class declaration adds the  **extends**  keyword after its class name, followed\
    \ by the name of class from which it derives:\n\n![image](Image00029.jpg)\n\n\
    inheritance.php\n\n![image](Image00114.jpg) Begin a PHP script by declaring a\
    \ base class named “Polygon”, which has two private variables initialized by the\
    \ constructor, and has two public getter methods\n\n **<?php** \n\n**class Polygon**\n\
    \n **{** \n\n**private $width , $height ;**\n\n**function construct( int $w \\\
    = 4 , int $h \\= 5 )**\n\n **{** \n\n**$this-> width \\= $w ;**\n\n**$this-> height\
    \ \\= $h ;**\n\n **}** \n\n**public function getWidth () { return $this-> width\
    \ ; }**\n\n**public function getHeight () { return $this-> height ; }**\n\n **}**\
    \ \n\n![image](Image00115.jpg) After the Polygon class, declare a “Rectangle”\
    \ class that derives from the Polygon class and adds a unique method\n\n**class\
    \ Rectangle extends Polygon**\n\n **{** \n\n**public function area ()**\n\n **{**\
    \ \n\n**return ( $this-> getWidth () \\* $this-> getHeight () ) ;**\n\n **}**\
    \ \n\n **}** \n\n![image](Image00116.jpg) After the Rectangle class, declare a\
    \ “Triangle” class that derives from the Polygon class and adds a unique method\n\
    \n**class Triangle extends Polygon**\n\n **{** \n\n**public function area ()**\n\
    \n **{** \n\n**return ( $this-> getWidth () \\* $this-> getHeight () / 2 ) ;**\n\
    \n **}** \n\n **}** \n\n![image](Image00117.jpg) After the Triangle class, add\
    \ two statements creating an instance of each derived class using default values\n\
    \n**$rect \\= new Rectangle () ;**\n\n**$trio \\= new Triangle () ;**\n\n![image](Image00118.jpg)\
    \ Finally, add two statements to output the value returned by the unique method\
    \ of each derived class\n\n**echo ‘Rectangle Area : ‘ . $rect \\-> area (). ’<hr>’\
    \ ;**\n\n**echo ‘Triangle Area : ‘ . $trio \\-> area () ;**\n\n **?>** \n\n![image](Image00119.jpg)\
    \ Save the document in your web server’s  **/htdocs**  directory as  **inheritance.php**\
    \  then open the page via HTTP to see the output from inherited members\n\n![image](Image00135.jpg)\n\
    \n![image](Image00019.jpg)\n\nDon’t confuse class instances and derived classes\
    \ – an instance is a copy of a class, whereas a derived class is a new class that\
    \ inherits properties of the base class from which it is derived.\n\n![image](Image00006.jpg)\n\
    \nIn PHP, a derived class is always dependent on a single base class – multiple\
    \ inheritance is not supported.\n\n **Embracing polymorphism** \n\nThe three cornerstones\
    \ of Object Oriented Programming (OOP) are encapsulation, inheritance, and polymorphism.\
    \ On the previous pages we have seen how data can be encapsulated within a PHP\
    \ class, and how derived classes inherit the properties of their base class, so\
    \ we can now explore the final cornerstone principle of polymorphism.\n\n![image](Image00136.jpg)\n\
    \nThe term “polymorphism” (from Greek, meaning “many forms”) describes the ability\
    \ to assign a different meaning or purpose to an entity according to its context.\
    \ For example, in the real world everyone knows how to use a push button (entity)\
    \ – you simply apply pressure to it. What that button does, however, depends on\
    \ what is connected to it (context), but the result does not affect how that button\
    \ is used.\n\nIn the world of Object Oriented Programming, polymorphism allows\
    \ classes to have different functionality while sharing a common interface. The\
    \ interface does not need to know which class it is using because they are, like\
    \ the real world button, all used the same way, but can produce different contextual\
    \ results. Embracing polymorphism in this way enables the programmer to create\
    \ interchangeable objects that can be selected according to requirement, rather\
    \ than by conditional tests.\n\nA PHP interface is similar to a class but is declared\
    \ using the  **interface**  keyword and can only contain method definitions, not\
    \ any method statements to be executed, like this:\n\n **interface *InterfaceName***\
    \ \n\n **{** \n\n **// Method definitions only go here.** \n\n **}** \n\n![image](Image00006.jpg)\n\
    \nMethod definitions in a interface declaration may also specify parameters.\n\
    \nEach class that implements an interface must implement all the methods it defines\
    \ by specifying their statements to be executed. A class is attached to an interface\
    \ by including the  **implements**  keyword and interface name in its declaration,\
    \ like this:\n\n **class *ClassName* implements *InterfaceName*** \n\n **{** \n\
    \n **// Method implementations go here.** \n\n **}** \n\nThe previous example\
    \ can be modified to embrace polymorphism by adding an interface and a single\
    \ function.\n\n![image](Image00029.jpg)\n\npolymorphism.php\n\n![image](Image00114.jpg)\
    \ Rename a copy of the previous example “inheritance.php” as a new program “polymorphism.php”\n\
    \n![image](Image00115.jpg) Declare an interface named “Shape”, which contains\
    \ a definition for the methods already implemented in the Rectangle and Triangle\
    \ classes\n\n**interface Shape { public function area () ; }**\n\n![image](Image00116.jpg)\
    \ Edit the first line of the Rectangle and Triangle class declarations – to associate\
    \ them with the interface\n\n**class Rectangle extends Polygon implements Shape**\n\
    \n**class Triangle extends Polygon implements Shape**\n\n![image](Image00117.jpg)\
    \ After the class blocks, add a function that accepts an argument of the Shape\
    \ type and calls its defined method\n\n**function getArea ( Shape $shape )**"
