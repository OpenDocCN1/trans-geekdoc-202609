- raw: "![image](Image00054.jpg) Add an initial PHP script to make sessions available\n\
    \n **<?php session\\_start() ; ?>** \n\n![image](Image00055.jpg) Now, begin a\
    \ PHP script to find a session variable and retrieve data for output upon success,\
    \ or provide an alternative for when the session variable is absent\n\n **<?php**\
    \ \n\n**if( isset( $\\_SESSION\\[ ‘user’ \\] ) )**\n\n **{** \n\n**$user \\= $\\\
    _SESSION\\[ ‘user’ \\] ;**\n\n**echo “<h1>Welcome $user !</h1><hr>” ;**\n\n**echo\
    \ ‘<a href=” session\\_data.php ”>View Session</a>’ ;**\n\n **}** \n\n **else**\
    \ \n\n**{ echo ‘Please <a href=” session\\_form.html ”>Log In</a>’ ; }**\n\n **?>**\
    \ \n\n![image](Image00056.jpg) Save the document in your web server’s  **/htdocs**\
    \  directory as  **session\\_get.php** \n\n![image](Image00057.jpg) Now, open\
    \ the HTML form  **session\\_form.html**  (created [here](#text00012.html#session)\
    \ ) via HTTP and push the submit button to see the login attempt fail validation\n\
    \n![image](Image00191.jpg)\n\n![image](Image00058.jpg) Return to the HTML form\
    \ and submit a valid username, to see the login attempt fail validation again\n\
    \n![image](Image00192.jpg)\n\n![image](Image00061.jpg) Return to the HTML form\
    \ once more and enter a valid username and password to see validation succeed\n\
    \n![image](Image00193.jpg)\n\n![image](Image00194.jpg)\n\n![image](Image00184.jpg)\
    \ See overleaf how to view data stored in session variables, using the  **session\\\
    _data.php**  target of the link seen above\n\n![image](Image00006.jpg)\n\nYou\
    \ can also return to the HTML form and enter a password below the minimum length\
    \ or containing invalid characters to see validation fail again.\n\n![image](Image00005.jpg)\n\
    \nNotice that the user in this example has added leading spaces before their name,\
    \ but that’s okay – these will be removed by the **trim()** function used in the\
    \ **session\\_set.php** script.\n\n **Viewing session data** \n\nThe special PHP\
    \  **$\\_SESSION**  global array variable stores names and values in an associative\
    \ array of keys and values. Stored content can be viewed by looping through the\
    \ array to see all names and values, or using the PHP  **var\\_dump()**  function.\
    \ Additionally, each session has a unique session ID number, which can be seen\
    \ using the PHP  **session\\_id()**  function.\n\n![image](Image00006.jpg)\n\n\
    The uniqueness of each session allows variables to exist without conflict.\n\n\
    Set session variables can be removed by specifying their element name to the PHP\
    \  **unset()**  function, and a session can be completely terminated by calling\
    \ the  **session\\_destroy()**  function:\n\n![image](Image00029.jpg)\n\nsession\\\
    _data.php\n\n![image](Image00054.jpg) Add an initial PHP script to make sessions\
    \ available\n\n **<?php session\\_start(); ?>** \n\n![image](Image00055.jpg) Now,\
    \ begin a PHP script to remove session variables, terminate a session, and confirm\
    \ termination\n\n **<?php** \n\n **function kill\\_session()** \n\n **{** \n\n\
    **unset( $\\_SESSION\\[ ‘user’ \\] ) ;  \n\nunset( $\\_SESSION\\[ ‘pass’ \\] )\
    \ ;  \n\nsession\\_destroy() ;**\n\n**echo ‘<hr>Session Destroyed<br>’ ;  \n\n\
    echo ‘Session ID : ‘ .session\\_id(). ’<br>’ ;  \n\nvar\\_dump( $\\_SESSION )\
    \ ;**\n\n **}** \n\n![image](Image00056.jpg) Now, add a test to find if any session\
    \ variables are set and retrieve all stored names and values\n\n**if( count( $\\\
    _SESSION ) > 0 )**\n\n **{** \n\n**echo ‘<dl> ‘ ;**\n\n**foreach( $\\_SESSION\
    \ as $key \\=> $value )**\n\n **{** \n\n**echo “<dt>Key: $key ” ; echo “<dd>Value:\
    \ $value ” ;**\n\n **}** \n\n**echo ‘</dl><hr>’ ;**\n\n **// Statements to be\
    \ inserted here (step 4).** \n\n **}** \n\n![image](Image00057.jpg) Insert statements\
    \ to display the session ID and array, then call the function to terminate the\
    \ session\n\n**echo ‘Session ID : ‘ .session\\_id(). ’<br>’ ;**\n\n**var\\_dump(\
    \ $\\_SESSION ) ;**\n\n **kill\\_session() ;** \n\n![image](Image00005.jpg)\n\n\
    You can assign a new value to a session variable at any time to overwrite an existing\
    \ stored value.\n\n![image](Image00058.jpg) Add alternative output for when a\
    \ session is absent\n\n **e** l**se** \n\n**{ echo ‘Please <a href=” session\\\
    _form.html ”>Log In</a>’ ; }**\n\n **?>** \n\n![image](Image00061.jpg) Save the\
    \ document in your web server’s  **/htdocs**  directory as  **session\\_data.php**\
    \ \n\n![image](Image00184.jpg) Now, open the HTML form  **session\\_form.html**\
    \  ([here](#text00012.html#session) ) via HTTP and enter valid login data, then\
    \ follow the link on  **session\\_get.php**  ([here](#text00012.html#sess) ) to\
    \ see session data\n\n![image](Image00195.jpg)\n\n![image](Image00196.jpg)\n\n\
    ![image](Image00197.jpg) Use the ![image](Image00198.jpg)Refresh button in your\
    \ browser to reload this page to see the alternative “Please Log In” content\n\
    \n![image](Image00005.jpg)\n\nNotice that the password adheres to the permissible\
    \ pattern.\n\n **Summary** \n\n •  The PHP  **set\\_cookie()**  function can be\
    \ used to store user data on the client machine for use across the pages of a\
    \ website\n\n •  There should be at least three arguments supplied to the  **set\\\
    _cookie()**  function to specify name, value and expiry time\n\n •  HTML form\
    \ submissions via the  **POST**  method automatically assign field data to the\
    \ PHP  **$\\_POST**  global array variable\n\n •  The  **isset()**  function can\
    \ seek an element of a specified HTML field name within the  **$\\_POST**  global\
    \ array\n\n •  The  **ctype\\_alnum()**  function can be used to confirm a value\
    \ only contains alphanumeric data for validation\n\n •  A hash conversion can\
    \ be made of a password value using the  **md5()**  function for encryption\n\n\
    \ •  The PHP  **header()**  function can specify a Location:URL to relocate the\
    \ browser\n\n •  Once cookies are set, they are automatically assigned to the\
    \ special PHP  **$\\_COOKIE**  global array variable\n\n •  User data can be stored\
    \ on the server in the PHP  **$\\_SESSION**  global array variable as an alternative\
    \ to cookie storage\n\n •  To use sessions, each PHP page must call the  **session\\\
    _start()**  function at the top of the page before any HTML tags\n\n •  HTML field\
    \ data submitted to the  **$\\_POST**  global array can be assigned to a  **$\\\
    _SESSION**  global variable array element\n\n •  The  **ctype\\_alpha()**  function\
    \ can be used to confirm a value only contains alphabetic letter data for validation\n\
    \n •  The  **preg\\_match()**  function can be used to confirm a value matches\
    \ a specified pattern for validation\n\n •  Each session has a unique session\
    \ ID number, which can be seen using the PHP  **session\\_id()**  function\n\n\
    \ •  Session variables can be removed using the  **unset()**  function and a session\
    \ can be terminated using the  **session\\_destroy()**  function\n\n •  Stored\
    \ content can be viewed using the  **var\\_dump()**  function and by looping through\
    \ the  **$\\_COOKIE**  or  **$\\_SESSION**  arrays\n\n11\n\n **Connecting databases**\
    \ \n\n*This chapter demonstrates how to establish a simple user forum with PHP\
    \ and a MySQL database.*\n\n[**Making a connection**](#text00013.html#sec82)\n\
    \n[**Creating a forum**](#text00013.html#sec83)\n\n[**Providing the page**](#text00013.html#sec84)\n\
    \n[**Supplying a form**](#text00013.html#sec85)\n\n[**Processing messages**](#text00013.html#sec86)\n\
    \n[**Confirming success**](#text00013.html#sec87)\n\n[**Summary**](#text00013.html#sec88)\n\
    \n **Making a connection** \n\nConnection to a MySQL database can be attempted\
    \ from a standard PHP script. The script defines a variable named “dbc” (database\
    \ connection) that gets assigned the value returned by calling a built-in  **mysqli\\\
    _connect()**  function. This call requires four arguments to specify the host\
    \ server, the MySQL username and password, and the database to connect. When the\
    \ call succeeds, the  **mysqli\\_connect()**  function returns an “object” that\
    \ represents the connection to the MySQL Server. The script looks like this:\n\
    \n **<?php** \n\n**$dbc \\=**\n\n**mysqli\\_connect( *‘host’ , ‘user’ , ‘password’\
    \ , ‘database’* )**\n\n**OR die ( mysqli\\_connect\\_error() ) ;**\n\n**mysqli\\\
    _set\\_charset( $dbc , ‘utf-8’ ) ;**\n\n![image](Image00029.jpg)\n\nconnect\\\
    _db.php\n\n![image](Image00199.jpg)"
  fmt: "\n![image](Image00054.jpg) Add an initial PHP script to make sessions available\n\
    \n```php\n<?php session_start() ; ?>\n```\n\n![image](Image00055.jpg) Now, begin\
    \ a PHP script to find a session variable and retrieve data for output upon success,\
    \ or provide an alternative for when the session variable is absent\n\n```php\n\
    <?php\nif( isset( $_SESSION['user'] ) )\n{ \n    $user = $_SESSION['user'] ;\n\
    \    echo \"<h1>Welcome $user !</h1><hr>\" ;\n    echo '<a href=\"” session_data.php\
    \ ”>View Session</a>' ;\n} \nelse \n{ \n    echo 'Please <a href=\"” session_form.html\
    \ ”>Log In</a>' ; \n}\n?>\n```\n\n![image](Image00056.jpg) Save the document in\
    \ your web server’s `/htdocs` directory as `session_get.php` \n\n![image](Image00057.jpg)\
    \ Now, open the HTML form `session_form.html` (created [here](#text0012.html#session)\
    \ ) via HTTP and push the submit button to see the login attempt fail validation\n\
    \n![image](Image00191.jpg)\n\n![image](Image00058.jpg) Return to the HTML form\
    \ and submit a valid username, to see the login attempt fail validation again\n\
    \n![image](Image00192.jpg)\n\n![image](Image00061.jpg) Return to the HTML form\
    \ once more and enter a valid username and password to see validation succeed\n\
    \n![image](Image00193.jpg)\n\n![image](Image00194.jpg)\n\n![image](Image00184.jpg)\
    \ See overleaf how to view data stored in session variables, using the `session_data.php`\
    \ target of the link seen above\n\n![image](Image00006.jpg)\n\nYou can also return\
    \ to the HTML form and enter a password below the minimum length or containing\
    \ invalid characters to see validation fail again.\n\n![image](Image00005.jpg)\n\
    \nNotice that the user in this example has added leading spaces before their name,\
    \ but that’s okay – these will be removed by the `trim()` function used in the\
    \ `session_set.php` script.\n\n### Viewing session data\n\nThe special PHP `$_SESSION`\
    \ global array variable stores names and values in an associative array of keys\
    \ and values. Stored content can be viewed by looping through the array to see\
    \ all names and values, or using the PHP `var_dump()` function. Additionally,\
    \ each session has a unique session ID number, which can be seen using the PHP\
    \ `session_id()` function.\n\n![image](Image00006.jpg)\n\nThe uniqueness of each\
    \ session allows variables to exist without conflict.\n\nSet session variables\
    \ can be removed by specifying their element name to the PHP `unset()` function,\
    \ and a session can be completely terminated by calling the `session_destroy()`\
    \ function:\n\n![image](Image00029.jpg)\n\nsession_data.php\n\n![image](Image00054.jpg)\
    \ Add an initial PHP script to make sessions available\n\n```php\n<?php session_start();\
    \ ?>\n```\n\n![image](Image00055.jpg) Now, begin a PHP script to remove session\
    \ variables, terminate a session, and confirm termination\n\n```php\n<?php\nfunction\
    \ kill_session()\n{ \n    unset( $_SESSION['user'] ) ;  \n    unset( $_SESSION['pass']\
    \ ) ;  \n    session_destroy() ;\n    echo '<hr>Session Destroyed<br>' ;  \n \
    \   echo 'Session ID : ' .session_id().'<br>' ;  \n    var_dump( $_SESSION ) ;\n\
    } \n```\n\n![image](Image00056.jpg) Now, add a test to find if any session variables\
    \ are set and retrieve all stored names and values\n\n```php\nif( count( $_SESSION\
    \ ) > 0 )\n{ \n    echo '<dl> ' ;\n    foreach( $_SESSION as $key => $value )\n\
    \    { \n        echo \"<dt>Key: $key \" ; echo \"<dd>Value: $value \" ;\n   \
    \ } \n    echo '</dl><hr>' ;\n    // Statements to be inserted here (step 4).\
    \ \n} \n```\n\n![image](Image00057.jpg) Insert statements to display the session\
    \ ID and array, then call the function to terminate the session\n\n```php\necho\
    \ 'Session ID : ' .session_id().'<br>' ;\nvar_dump( $_SESSION ) ;\nkill_session()\
    \ ; \n```\n\n![image](Image00005.jpg)\n\nYou can assign a new value to a session\
    \ variable at any time to overwrite an existing stored value.\n\n![image](Image00058.jpg)\
    \ Add alternative output for when a session is absent\n\n```php\nelse \n{ echo\
    \ 'Please <a href=\"” session_form.html ”>Log In</a>' ; }\n?>\n```\n\n![image](Image00061.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `session_data.php`\
    \ \n\n![image](Image00055.jpg) ... (text truncated for brevity) ... session.php\
    \ ... `session_form.html` ..._data.php\n\n![image](Image00054.jpg) Add an initial\
    \ PHP script to make sessions available\n\n```php\n<?php session_start(); ?>\n\
    ```\n\n![image](Image00055.jpg)\n\n### Summary\n\n- The special PHP `$_SESSION`\
    \ global array variable stores names and values in an associative array of keys\
    \ and values.\n- Stored content can be viewed by looping through the array to\
    \ see all names and values, or using the PHP `var_dump()` function.\n- Additionally,\
    \ each session has a unique session ID number, which can be seen using the PHP\
    \ `session_id()` function.\n- The uniqueness of each session allows variables\
    \ to exist without conflict.\n- Set session variables can be removed by specifying\
    \ their element name to the PHP `unset()` function, and a session can be completely\
    \ terminated by calling the `session_destroy()` function.\n"
  trans: "\n\n![image](img/Image00054.jpg) 添加一个初始 PHP 脚本以启用会话\n\n```php\n<?php session_start()\
    \ ; ?>\n```\n\n![image](img/Image00055.jpg) 现在，编写 PHP 脚本来查找会话变量并在成功后检索数据进行输出，或者在会话变量不存在时提供替代方案\n\
    \n```php\n<?php\nif( isset( $_SESSION['user'] ) )\n{ \n    $user = $_SESSION['user']\
    \ ;\n    echo \"<h1>Welcome $user !</h1><hr>\" ;\n    echo '<a href=\"” session_data.php\
    \ ”>View Session</a>' ;\n} \nelse \n{ \n    echo 'Please <a href=\"” session_form.html\
    \ ”>Log In</a>' ; \n}\n?>\n```\n\n![image](img/Image00056.jpg) 将文档保存到 Web 服务器的\
    \ `/htdocs` 目录下并命名为 `session_get.php` \n\n![image](img/Image00057.jpg) 现在，通过 HTTP\
    \ 打开 HTML 表单 `session_form.html`（可在此处 创建）并点击提交按钮，查看登录尝试失败验证\n\n![image](img/Image00191.jpg)\n\
    \n![image](img/Image00058.jpg) 返回 HTML 表单并提交一个有效的用户名，再次查看登录尝试失败验证\n\n![image](img/Image00192.jpg)\n\
    \n![image](img/Image00061.jpg) 再次返回 HTML 表单，并输入有效的用户名和密码，查看验证成功\n\n![image](img/Image00193.jpg)\n\
    \n![image](img/Image00194.jpg)\n\n![image](img/Image00184.jpg) 请阅上页了解如何使用上方链接中的\
    \ `session_data.php` 目标来查看存储在会话变量中的数据\n\n![image](img/Image00006.jpg)\n\n你也可以返回\
    \ HTML 表单，并输入一个低于最小长度或包含无效字符的密码，查看验证再次失败。\n\n![image](img/Image00005.jpg)\n\n\
    注意，此示例中的用户在姓名之前添加了前空格，但这没关系——这些空格将由 `session_set.php` 脚本中使用的 `trim()` 函数移除\n\n\
    ### 查看会话数据\n\n特殊的 PHP 全局数组变量 `$_SESSION` 以键值对的关联数组的形式存储名称和值。可以通过遍历数组来查看所有名称和值，或者使用\
    \ PHP 的 `var_dump()` 函数来查看存储的内容。此外，每个会话都有一个唯一的会话 ID 数字，可以使用 PHP 的 `session_id()`\
    \ 函数查看。\n\n![image](img/Image00006.jpg)\n\n每个会话的唯一性允许变量在不发生冲突的情况下存在。\n\n可以通过向\
    \ PHP `unset()` 函数指定元素名称来移除已设置的会话变量，并通过调用 `session_destroy()` 函数来完全终止会话：\n\n![image](img/Image00029.jpg)\n\
    \nsession_data.php\n\n![image](img/Image00054.jpg) 添加一个初始 PHP 脚本以启用会话\n\n```php\n\
    <?php session_start(); ?>\n```\n\n![image](img/Image00055.jpg) 现在，编写 PHP 脚本来移除会话变量、终止会话并确认终止\n\
    \n```php\n<?php\nfunction kill_session()\n{ \n    unset( $_SESSION['user'] ) ;\
    \  \n    unset( $_SESSION['pass'] ) ;  \n    session_destroy() ;\n    echo '<hr>Session\
    \ Destroyed<br>' ;  \n    echo 'Session ID : ' .session_id().'<br>' ;  \n    var_dump(\
    \ $_SESSION ) ;\n} \n```\n\n![image](img/Image00056.jpg) 现在，添加一个测试来查找是否设置了任何会话变量并检索所有存储的名称和值\n\
    \n```php\nif( count( $_SESSION ) > 0 )\n{ \n    echo '<dl> ' ;\n    foreach( $_SESSION\
    \ as $key => $value )\n    { \n        echo \"<dt>Key: $key \" ; echo \"<dd>Value:\
    \ $value \" ;\n    } \n    echo '</dl><hr>' ;\n    // 在此处插入语句（步骤 4）。 \n} \n```\n\
    \n![image](img/Image00057.jpg) 插入用于显示会话 ID 和数组的语句，然后调用函数终止会话\n\n```php\necho 'Session\
    \ ID : ' .session_id().'<br>' ;\nvar_dump( $_SESSION ) ;\nkill_session() ; \n\
    ```\n\n![image](img/Image00005.jpg)\n\n你可以随时为会话变量分配新值以覆盖已存储的值。\n\n![image](img/Image00058.jpg)\
    \ 为会话不存在时添加替代输出\n\n```php\nelse \n{ echo 'Please <a href=\"” session_form.html\
    \ ”>Log In</a>' ; }\n?>\n```\n\n![image](img/Image00061.jpg) 将文档保存到 Web 服务器的 `/htdocs`\
    \ 目录下并命名为 `session_data.php` \n\n![image](img/Image00055.jpg) ...（为了简洁已省略文本）...\
    \ session.php ... `session_form.html` ..._data.php\n\n![image](img/Image00054.jpg)\
    \ 添加一个初始 PHP 脚本以启用会话\n\n```php\n<?php session_start(); ?>\n```\n\n![image](img/Image00055.jpg)\n\
    \n### 总结\n\n- 特殊 PHP 全局数组变量 `$_SESSION` 以键值对的关联数组的形式存储名称和值。\n- 可以通过遍历数组来查看所有名称和值，或者使用\
    \ PHP 的 `var_dump()` 函数来查看存储的内容。\n- 此外，每个会话都有一个唯一的会话 ID 数字，可以使用 PHP 的 `session_id()`\
    \ 函数查看。\n- 每个会话的唯一性允许变量在不发生冲突的情况下存在。\n- 可以向 PHP `unset()` 函数指定元素名称来移除已设置的会话变量，并通过调用\
    \ `session_destroy()` 函数来完全终止会话。\n\n"
