    \ format then save it as  **hello.php**  in the Abyss server’s  **/htdocs**  folder\n\
    \n![image](Image00032.jpg)\n\n![image](Image00015.jpg) Next, enter the location\
    \ **http://localhost/hello.php** into your web browser’s address field to see\
    \ Abyss serve up a web page containing content written by embedded PHP code\n\n\
    ![image](Image00033.jpg)\n\n![image](Image00017.jpg) Now, use your web browser’s\
    \ **View Source** facility to see that PHP has written the content into the body\
    \ section, including the HTML  **<h1></h1>**  heading tags\n\n![image](Image00034.jpg)\n\
    \nPHP script can be embedded in earlier versions of HTML in just the same way.\
    \ Other examples in this book demonstrate embedded PHP script but do not repeatedly\
    \ list the HTML code.\n\n![image](Image00019.jpg)\n\nWindows’ Notepad automatically\
    \ adds a hidden “Byte Order Mark” (BOM) signature to the file, while other editors\
    \ (such as Code Writer shown here) allow this to be omitted. Code Writer is a\
    \ free text and code editor available from the Windows Store.\n\n![image](Image00006.jpg)\n\
    \nNote that the PHP **echo** instruction literally writes the entire content contained\
    \ within the pair of **‘ ‘** single quote marks.\n\n **Scripting by the rules**\
    \ \n\n **Tag rules** \n\nWhen the PHP engine receives input from the web server\
    \ it reads the input, from top to bottom, in a process called “parsing”. During\
    \ the parsing process, the PHP engine (a.k.a. parser) looks for the opening and\
    \ closing  **<?php**  and  **?>**  tags and understands that the content between\
    \ those tags is script code that it must interpret. Everything outside the  **<?php**\
    \  and  **?>**  tags is completely ignored, which allows PHP files to have mixed\
    \ content and allows PHP code to be embedded within HTML like this:\n\n**<p> Ignored\
    \ by PHP and displayed by the browser</p>**\n\n**<?php echo ‘Script code that\
    \ will be parsed’ ; ?>**\n\n**<p> Also ignored by PHP and displayed by the browser</p>**\n\
    \nIn order for this to work properly it is therefore important that all your PHP\
    \ script code must be enclosed between opening and closing  **<?php**  and  **?>**\
    \  tags, when embedded in an HTML file.\n\n![image](Image00005.jpg)\n\nTypically\
    \ your embedded PHP code will always have opening and closing <?php and **?>**\
    \ tags around script.\n\nThe only exception to this rule is when PHP script is\
    \ written in a pure PHP file, which contains only code. In this case it is preferable\
    \ to omit the closing  **?>**  tag like this:\n\n**<?php echo ‘Print this First’\
    \ ;**\n\n**echo ‘Print this Last’ ;**\n\nWhere your PHP script code intends only\
    \ to insert a single string of text into an HTML document, you may optionally\
    \ use the PHP short echo **<?=** and **?>** tags:\n\n**<?= ‘Hello!’ ; ?>** is\
    \ equivalent to **<?php echo ‘Hello!’ ; ?>**\n\nAdvanced PHP script code can also\
    \ insert text only when a tested condition is met, like this:\n\n**<?php if (\
    \ $expression \\== true ) : ?>**\n\n **Insert this text only if the expression\
    \ is true.** \n\n **<?php else : ?>** \n\n **Otherwise insert this text.** \n\n\
    \ **<?php endif ; ?>** \n\n![image](Image00006.jpg)\n\nConditional testing is\
    \ fully explained and demonstrated later in this book, in [Chapter 3](#text00005.html)\
    \ .\n\n **Statement rules** \n\nEach statement within the PHP language must be\
    \ terminated by a **;** semicolon character – just as each sentence in the English\
    \ language must be terminated by a **.** period character. The semicolon is recognized\
    \ by the parser as marking the end of an individual instruction that it must interpret.\
    \ So a PHP code block containing two statements could look like this:\n\n**<?php\
    \ echo ‘First statement’ ; echo ‘Second statement’ ; ?>**\n\nThe closing  **?>**\
    \  tag of a block of PHP code automatically implies a semicolon, however, so you\
    \ can optionally omit the semicolon terminating the last statement of a PHP block,\
    \ like this:\n\n**<?php echo ‘First statement’ ; echo ‘Second statement’ ?>**\n\
    \n![image](Image00005.jpg)\n\nIt does no harm to terminate the last statement\
    \ of a PHP block if you wish to do so.\n\n **Comment rules** \n\nIt is often worthwhile\
    \ adding comments to your PHP script code so it can be more easily understood\
    \ by others, or by yourself when revisiting your code later. All whitespace and\
    \ comments are completely ignored by the PHP parser so you can add as many comments\
    \ as you like, without any adverse effect on performance.\n\nSingle-line comments\
    \ may begin with a **#** hash character, or alternatively they may begin with\
    \ a **//** double-slash sequence.\n\nMulti-line (block) comments must be enclosed\
    \ within **/\\*** and **\\*/** character sequences, as used in the C programming\
    \ language:\n\n **<?php** \n\n**echo ‘First statement’ ; // A single-line comment.**\n\
    \n **/\\* This is a multi-line comment  \n\ncontaining two lines of comment. \\\
    */** \n\n**echo ‘Second statement’ ;**\n\n**echo ‘Final statement’ ; \\# Another\
    \ single-line comment.**\n\n **?>** \n\n![image](Image00005.jpg)\n\nThe **//**\
    \ single-line comment style is also used in C++ programming and the **#** single-line\
    \ comment style is also used in Unix/Linux BASH shell scripting.\n\n **Summary**\
    \ \n\n •  PHP is a scripting language that is especially suited for web development\
    \ as it can be embedded in HTML\n\n •  PHP code is executed server-side on The\
    \ Cloud, unlike JavaScript code that is executed client-side in the browser\n\n\
    \ •  Where a web page contains PHP script, the web server will first call upon\
    \ the PHP engine to process the code before sending the response to the web browser"
