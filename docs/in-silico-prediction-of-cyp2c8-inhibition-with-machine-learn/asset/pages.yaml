    the observed and the predicted binary classifications and is generally regarded
    as a balancing measure for the imbalanced data set. In addition, the area under
    the receiver operating characteristic curve (AUC)28 was also calculated to evaluate
    the reliability of the classifiers, whose value ranges from 0.5 to 1. The larger
    the area, the better the classification performance. When the AUC value is equal
    to 1, the predictive ability of the model is prefect, and when the AUC value is
    0.5, the model has no discriminative power.2,9


    # 2.5. Definition of Applicability Domain (AD) of Models. Due to the limitation
    of the chemical space of the data sets, any built models in principle need to
    predefine AD,30 which is used to reasonably define the applied scope of the classification
    models. The setting of AD can prevent excessive prediction deviation resulting
    from the large characteristic difference between the tested chemicals and the
    training set. It means that if the query chemical is distributed in the AD, the
    model prediction can be considered to be relatively reliable; otherwise, it is
    less credible. In this study, the Euclidean distance-based method31 was used to
    obtain the AD, which is defined by the structural similarity between the training
    and the test sets. The distance of each molecule in the test set with its k-nearest
    neighbors in the training set was calculated. If one of these k distances exceeds
    the threshold of AD, the query compound is regarded as outside the AD;32 otherwise,
    it has fallen in the domain. The AD calculation is implemented according to the
    following formula


    ```

    D_x = \bar{y} + Za (5)

    ```


    where \bar{y} and \sigma represent the average value and standard deviation of
    the calculated Euclidean distance, respectively, and Z is an arbitrary parameter,
    which determines the size of the AD.


    # 2.6. Identification of Privileged Substructures. In this study, privileged substructures
    refer to molecular functional groups that frequently appear in the CYP2C8 inhibitors.
    These substructures in inhibitors tend to react with the CYP2C8 metabolic enzyme
    to exert biological activity. Therefore, identification of these privileged substructures
    has an essential role for the determination of potential CYP2C8 inhibitors.33
    Here, high-frequency substructures were evaluated by information gain (IG)34,35
    and substructure frequency analysis.36 IG calculates the information entropy of
    each pattern in a molecule to assess its probability in the validation system.
    The greater the values of IG are, the more credible the substructures are. The
    substructure frequency can be calculated by the following functional formula


    ```

    frequency of a fragment = N_fragment x N_total / N_fragment, total x N (6)

    ```


    where N_fragment is the number of compounds containing the fragments in CYP2C8
    inhibitors or noninhibitors, N_total is the total number of compounds in the training
    set, N_fragment, total is the total number of compounds containing this fragment,
    and N is the number of CYP2C8 inhibitors or noninhibitors.


    The MoSS node embedded in the KNIME 3.037 and the SARpy software38 was employed
    to identify the substructures in the training set. MoSS is a graph-based approach
    that generates substructures by embedding fragments parallel to all compounds
    throughout the growth process.39 SARpy uses “string mining” to extract substructures
    from the SMILES notation of the compounds, which does not split the ring structures.40
    After many trials, in MoSS, “Minimum fold support in %” was set to 10, “Maximum
    complement support in %” and “Minimum fragment size” were set to 5, and “Maximum
    fragment size” was set to 16. The rest adopted the default settings. In SARpy,
    the numbers of atoms were set to range from 5 to 16, accuracy was set to “OPTIMAL”,
    and CYP2C8 inhibitors were chosen as the study object.


    # 3. RESULTS


    # 3.1. Data Set Analysis. We initially collected 303 inhibitors and 211 noninhibitors
    from PubChem and the literature. During the data collection process, we found
    that three compounds in PubChem were stereoismers of each other, one compound
    is the R configuration, one is S configuration, and the remaining one is a racemate.
    However, these three compounds are all labeled as “active”. We did not consider
    the chirality of the compound in the data processing so we treated two of the
    three compounds as duplicates and removed them. Three compounds extracted from
    the literature are incompatible with those extracted from PubChem. In the literature,
    these compounds are considered as noninhibitors, but they are labeled as “active”
    in PubChem. Thus, we removed these compounds for model construction. In addition,
    among these chemicals, 11 are duplicates and 1 is an inorganic compound, which
    were also removed. As such, we obtained 290 inhibitors and 204 noninhibitors in
    total. Since the inhibitors retrieved from the PubChem are very similar to each
    other, we clustered these inhibitors by the molecular fingerprint similarity method
    to obtain 250 inhibitors. For the validation data set, we collected 81 compounds
    from three sources. Among them, one is duplicated in the training and test sets
    and one is an inorganic compound containing boron. We removed these 2 compounds
    and got 79 compounds as the external validation set. Finally, we obtained 533
    organic compounds from four different sources, including the literature, Web site,
    and two publicly available databases. Among them, 312 chemicals are positive (inhibitors)
    and 221 are negative (noninhibitors).


    After data splitting, the training, test, and external validation sets contain
    363, 91, and 79 compounds, respectively. The numbers of CYP2C8 inhibitors and
    noninhibitors in each data set are listed in Table 1. The SMILES and classification
    information on the data sets are provided in the Supporting Information (data.xlsx).


