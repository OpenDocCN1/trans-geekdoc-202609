    validation, test, and external sets indicate that


    our models have satisfactory predictive power and can provide useful information
    for classifying potential CYP2C8 inhibitors and noninhibitors. However, our models
    still have certain limitations. Due to the small quantity of experimentally measured
    CYP2C8 noninhibitors reported, relatively few negative compounds were used for
    modeling, which may result in insufficient “learning” of negative data features
    in our models. As can be seen from the results of the cross validation, test,
    and external validation sets, the S# value is slightly lower than the SE value
    in general. It is hoped that this problem could be solved with the increase of
    CYP2C8 biological experimental data in the future. In addition, the inorganic
    compounds were removed before modeling. Thus, our models cannot predict these
    species.


    # 5. CONCLUSIONS


    In this study, on the basis of a diverse data set of CYP2C8 enzymes, 5 machine-learning
    algorithms including SVM, RF, KNN, NN, and LR combined with 9 molecular fingerprints
    were used to develop 45 binary classification models. Considering the values of
    AUC, CA, SE, SP, and MCC, the 5 best-performing models by 10-fold cross validation
    were obtained for further assessment using the test and external validation sets.
    The overall predictive accuracy is satisfactory, where the AUC and CA values are
    over 0.8 and 0.7, respectively. In addition, our results showed that the models
    built with the Ext and Pub fingerprints were superior to others, and the SVM algorithm
    was more suitable for classifying CYP2C8 inhibitors/noninhibitors. The Euclidean
    distance- based applicability domain calculation was further applied, whose value
    was obtained by searching for parameters k and Z. Moreover, a combination of information
    gain and substructure frequency analysis was used to detect several privileged
    substructures. In conclusion, the built prediction models and the privileged substructures
    could be useful for quickly identifying potential CYP2C8 inhibitors in the early
    stage of drug design.


