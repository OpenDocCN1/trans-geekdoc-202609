    正确预测了 CYP2C8 抑制剂。MCC 是观察值与预测二值分类之间的相关系数，通常被视为不平衡数据集的平衡度量。此外，还计算了受试者工作特征曲线下的面积（AUC）²⁸，以评估分类器的可靠性，其取值范围从
    0.5 到 1。面积越大，分类性能越好。当 AUC 值等于 1 时，模型的预测能力完美；当 AUC 值为 0.5 时，模型没有判别能力。²,⁹


    ## 2.5. 模型适用域 (AD) 的定义


    由于数据集化学空间的局限性，原则上构建的任何模型都需要预先定义 AD³⁰，用于合理界定分类模型的应用范围。AD 的设置可以防止因测试化学物质与训练集之间存在较大的特征差异而导致预测偏差过大。这意味着，如果查询化学物质分布在
    AD 内，模型预测可被视为相对可靠；否则，其可信度较低。本研究采用基于欧氏距离的方法³¹获取 AD，该方法由训练集和测试集之间的结构相似度定义。计算测试集中每个分子与其在训练集中
    k 个最近邻的距离。如果这 k 个距离中有一个超过 AD 的阈值，则查询化合物被认为在 AD 之外；³²否则，它落在域内。AD 的计算根据以下公式实施：


    $$

    D_x = \bar{y} + Z\sigma \quad (5)

    $$


    其中 $\bar{y}$ 和 $\sigma$ 分别代表计算出的欧氏距离的平均值和标准差，$Z$ 是一个任意参数，决定了 AD 的大小。


    ## 2.6. 特权子结构的识别


    在本研究中，特权子结构是指频繁出现在 CYP2C8 抑制剂中的分子官能团。抑制剂中的这些子结构倾向于与 CYP2C8 代谢酶发生反应以发挥生物活性。因此，识别这些特权子结构对于确定潜在的
    CYP2C8 抑制剂具有不可或缺的作用。³³ 在此，通过信息增益（IG）³⁴,³⁵ 和子结构频率分析³⁶来评估高频子结构。IG 计算分子中每个模式的信息熵，以评估其在验证系统中的概率。IG
    值越大，子结构越可信。子结构频率可以通过以下函数公式计算：


    $$

    \text{fragment frequency} = \frac{N_{\text{fragment}} \times N_{\text{total}}}{N_{\text{fragment,
    total}} \times N} \quad (6)

    $$


    其中 $N_{\text{fragment}}$ 是 CYP2C8 抑制剂或非抑制剂中包含该片段的化合物数量，$N_{\text{total}}$ 是训练集中化合物的总数，$N_{\text{fragment,
    total}}$ 是包含该片段的化合物总数，$N$ 是 CYP2C8 抑制剂或非抑制剂的数量。


    使用嵌入在 KNIME 3.0³⁷ 中的 MoSS 节点和 SARpy 软件³⁸来识别训练集中的子结构。MoSS 是一种基于图的方法，它通过嵌入片段平行于所有化合物在整个生长过程中生成子结构。³⁹
    SARpy 使用“字符串挖掘”从化合物的 SMILES 表示中提取子结构，这不拆分环结构。⁴⁰ 经过多次尝试，在 MoSS 中，“最小折叠支持率（%）”设置为
    10，“最大互补支持率（%）”和“最小片段大小”设置为 5，“最大片段大小”设置为 16。其余采用默认设置。在 SARpy 中，原子数设置为从 5 到 16，准确性设置为“OPTIMAL”，并选择
    CYP2C8 抑制剂作为研究对象。


