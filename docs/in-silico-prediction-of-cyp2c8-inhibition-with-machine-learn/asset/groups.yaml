    ## 4.3. 优势亚结构分析。


    总共获得了 19 个独特的优势亚结构，如表 7 和表 8 所示。其中，含氮杂环亚结构（如 1H-苯并[d]咪唑、1-苯基-1H-吡唑和喹啉）在文献报道的 CYP2C8
    抑制剂中频繁出现，例如 Azilsartan（45）、Candesartan cilexetil（14）和 Nilotinib（46）。含有这些片段的分子倾向于与
    CYP2C8 相互作用，这可能是因为它可以占据活性空腔中的远端疏水口袋。例如，在 CYP2C8 复合物晶体结构（PDB 代码 2NNI）中，强效竞争性抑制剂孟鲁司特的氯喹啉环与位于螺旋
    G 下方的疏水残基簇相互作用，从而稳定其结合，如 47,48 所示，见图 3A。


    其余的优势亚结构具有相似的骨架，包括苯磺酰胺、苯甲酰胺和 N-苯基甲酰胺片段。事实上，许多已报道的强效 CYP2C8 抑制剂都包含上述结构片段，例如 Zafirlukast（49）、Dabrafenib（50）和
    Gliburide（14）。根据 PDB 代码 2NNI 的晶体结构，孟鲁司特的末端羧酸基团与活性位点附近螺旋 B'' 处的极性氨基酸簇（包括 Ser100、Ser103
    和 Asn217）形成氢键（图 3A）。此外，在 CYP2C8 的另一种复合物晶体结构（PDB 代码 2VN0）中，噻唑烷二酮中的酮氧可以与螺旋 G 中的
    Arg241 和螺旋 F 中的 Asn204 形成氢键。结构中间的其他氧原子通过周围的水分子与 Ser103 形成氢键 51,52（图 3B）。因此，含有磺酰胺或酰胺基团的化合物可以与
    CYP2C8 螺旋 B'' 附近的极性氨基酸簇或 Arg241 和 Asn204 形成极性相互作用，这可以解释为什么苯磺酰胺和苯甲酰胺片段在 CYP2C8
    抑制剂中频繁存在。


    此外，MoSS 和 SARy 还鉴定出一些含有氟原子的亚结构。事实上，氟原子存在于几种已知的 CYP2C8 抑制剂中，如 Dabrafenib 和 Nilotinib。作为吸电子基团，F
    降低了苯环的电子云密度，从而增强了分子的疏水性 53,54，使其更容易结合到 CYP2C8 的疏水腔中。


    ## 4.4. 我们模型的局限性。


    10 折交叉验证、测试集和外部集的总体准确率表明，我们的模型具有令人满意的预测能力，可以为分类潜在的 CYP2C8 抑制剂和非抑制剂提供有用信息。然而，我们的模型仍有一定的局限性。由于实验测定的
    CYP2C8 非抑制剂数量有限，用于建模的阴性化合物较少，这可能导致我们的模型对阴性数据特征的“学习”不足。从交叉验证、测试和外部验证集的结果可以看出，一般来说
    S# 值略低于 SE 值。希望随着未来 CYP2C8 生物实验数据的增加，这一问题能够得到解决。此外，在建模前移除了无机化合物。因此，我们的模型无法预测这些物种。


    ## 5. 结论


    在本研究中，基于多样化的 CYP2C8 酶数据集，结合 SVM、RF、KNN、NN 和 LR 等 5 种机器学习算法与 9 种分子指纹，开发了 45 个二元分类模型。考虑
    AUC、CA、SE、SP 和 MCC 的值，通过 10 折交叉验证获得性能最佳的 5 个模型，并进一步使用测试集和外部验证集进行评估。总体预测准确率令人满意，其中
    AUC 和 CA 值分别超过 0.8 和 0.7。此外，我们的结果表明，使用 Ext 和 Pub 指纹构建的模型优于其他模型，并且 SVM 算法更适合于分类
    CYP2C8 抑制剂/非抑制剂。进一步应用了基于欧氏距离的适用域计算，其值通过搜索参数 k 和 Z 获得。此外，结合信息增益和亚结构频率分析用于检测几种优势亚结构。总之，所构建的预测模型和优势亚结构可用于药物设计早期阶段快速鉴定潜在的
    CYP2C8 抑制剂。


