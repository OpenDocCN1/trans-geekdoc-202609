    **摘要**：细胞色素 P450 2C8（CYP2C8）是人体主要的药物代谢酶之一，负责约 5% 临床用药的代谢。因此，CYP2C8 的抑制作用（可能导致潜在的不良反应事件）不容忽视。美国食品药品监督管理局（FDA）发布的体外药物相互作用研究工业指南也指出，在临床试验前需要确定受试药物是否为
    CYP2C8 抑制剂。然而，目前的研究主要集中于预测其他主要 P450 酶的抑制剂，CYP2C8 抑制作用的重要性被忽视了。因此，需要开发模型来识别潜在的
    CYP2C8 抑制剂。在本研究中，通过结合九种分子指纹的五种机器学习方法，构建了用于预测 CYP2C8 抑制作用的计算机模拟分类模型。通过测试集和外部验证集评估了所构建模型的性能。最佳模型在测试集和外部验证集中的
    AUC 值分别为 0.85 和 0.90。基于分子相似性分析了适用域，并显示出其对提高预测准确率的影响。此外，通过信息增益和子结构频率分析，识别出几种代表性的特权子结构，如
    1H-苯并[d]咪唑、1-苯基-1H-吡唑和喹啉。总体而言，我们的研究结果将有助于 CYP2C8 抑制作用的预测。


    ![](img/c231614c653e97fe1a89fe8f2f1da0bc_0_0.png)


    ## 1. 引言


    细胞色素 P450 酶（CYPs）的抑制作用是导致不良反应和药物退市的最重要原因之一[1]。因此，在临床试验前，需要确定药物候选者是否为主要药物代谢 P450
    的抑制剂。美国食品药品监督管理局（FDA）发布的体外药物相互作用研究工业指南规定，药物开发者需要评估药物是否抑制主要的 P450 代谢酶，包括 CYP1A2、CYP2B6、CYP2C8、CYP2C9、CYP2C19、CYP2D6
    和 CYP3A4[2]。


    实验方法识别 P450 抑制作用通常耗时、昂贵且劳动密集。因此，已开发了许多计算机模拟模型来识别 P450 抑制作用[3–8]。目前，文献中报道的 P450
    抑制作用计算机模拟预测主要基于机器学习方法，这些方法越来越多地应用于数据分析、分类问题以及其他领域[9–11]。Shao 等人使用基于规则的 C5.0 决策树算法构建五个主要
    P450 抑制剂的分类模型。Rydberg 等人利用支持向量机（SVM）对五个主要 P450 酶的抑制剂和非抑制剂进行分类，并开发了用于预测 P450 抑制剂的
    WhichCyp Web 服务器。我们课题组[12]利用人工神经网络开发了一种组合分类器，用于预测五个主要 P450 代谢酶的抑制剂。最近，Li 等人[13]开发了一种基于自编码器深度神经网络的多任务模型，用于区分五个主要
    P450 亚型的抑制剂和非抑制剂。Wu 等人[14]使用两种集成学习方法和两种深度学习方法构建分类模型，以预测五个主要 P450 酶的抑制剂。尽管报道的模型展示了相对较高的准确率，但这些研究主要关注包括
    CYP3A4、2D6、2C9、2C19 和 1A2 在内的五个主要 P450 亚型。其他主要的药物代谢 P450 尚未涉及在公开报告中。


    CYP2C8 是 CYP2C 亚家族的成员，占肝脏中总 P450 酶的约 6−7%[12]。CYP2C8 负责约 5% 市售药物的代谢[13]，包括阿莫地喹（amodiaquine）、头孢拉定（ceveratinone）和艾立昔美（esziltaxeme）[14]。在过去十年中，由于药物相互作用和遗传多态性导致的不良反应，CYP2C8
    在药物反应中的重要性已被认可[14]。例如，CYP2C8 的抑制剂吉非罗齐（gemfibrozil）与底物西维津（civezine）的组合导致了严重的不良反应[15]。因此，快速识别
    CYP2C8 抑制作用对于指导新药的设计和发展具有重要意义。然而，目前尚未报道用于 CYP2C8 抑制作用的预测模型。


    在本研究中，我们使用多种机器学习方法开发了计算机模拟模型，用于分类 CYP2C8 抑制剂和非抑制剂。通过测试集和外部验证集评估所构建模型的稳健性。基于欧几里得距离方法，定义了适用域以排除某些极端化合物。此外，通过信息增益和子结构频率分析检测抑制剂和非抑制剂之间结构特征的差异，从而推导出导致
    CYP2C8 抑制作用的特权子结构。


    ## 2. 材料与方法


    ### 2.1. 数据收集与准备


    在本研究中，我们从 PubChem 生物测定数据库[16]和两篇出版物[14,17]中收集了数据集。与其他文献报道相比，这两篇出版物提供的数据更全面，基本上覆盖了目前已知的
    CYP2C8 抑制剂。


    用于开发分类模型的数据集是从 PubChem 生物测定数据库[16]和 2005 年发表的文献[17]中手动收集的。对于来自 PubChem 的数据，活性
    ≤ 50 μM 或 ChemBL 明确报告为活性的化合物在 CYP2C8 生物测定表征中被标记为活性。每种化合物使用的活性类型为 IC50、INH 和 Ki
    之一。从 2005 年的文献[17]中，在 30 μM 浓度下检查了 209 种药物对 CYP2C8 的抑制作用。其中，48 种化合物表现出大于 50% 的抑制作用，并进一步评估
    IC50 的测量。结果显示，6 种药物的 IC50 值小于 1 μM，17 种药物在 1 至 10 μM 之间，25 种药物在 10 至 40 μM 范围内。文献和
    PubChem 中的化合物活性标准相似。因此，我们将来自 PubChem 和文献的数据中标记为“活性”的化合物视为 CYP2C8 抑制剂，将“非活性”视为非抑制剂。删除了没有化合物数值或文献支持的化学物质。从文献[17]收集的
    48 种化合物被归类为抑制剂和非抑制剂。所有分子都被转换为简化分子输入线规范（SMILES）字符串。为了获得高质量数据，两个数据集通过以下步骤进行了仔细预处理：

    - 保留有机物质，

    - 将盐转化为相应的碱或酸，以及

    - 去除重复的化学结构。


    然后，CYP2C8 抑制剂被标记为“1”，非抑制剂被标记为“0”。最后，预处理的数据集通过内部 python 脚本按 8:2 的比例随机划分为训练集和测试集。


    为了评估所构建模型的泛化能力，从不同来源构建了外部验证集，包括 DrugBank 数据库[18]、Backman 等人的文献[15]以及印第安纳大学医学院（
    https://drug-interactions. medicine.iu.edu/Main/Table.aspx ）。与 PubChem 的数据处理类似，排除来自
    DrugBank 但没有文献来源的药物。剩余的 CYP2C8 抑制剂被视为阳性数据。此外，从印第安纳大学医学院数据集收集的六种 CYP2C8 抑制剂被添加到阳性数据集中。文献中报道的
    IC50 > 100 μM 的化合物被视为阴性数据。对于外部验证集，应用与训练集和测试集相同的数据预处理程序，并排除训练集或测试集中的重复数据。


    数据集的多样性和质量对于构建高度稳健的模型至关重要[6,13]。在我们的工作中，我们利用化学空间分布和 Tanimoto 平均相似性指数[20]来评估数据集的化学多样性。化学空间分布定义为分子量（MW）和脂/水分配系数（ALogP）的二维空间分布图，这些值由
    Pipeline Pilot 2017 R2 软件计算[19]。Tanimoto 相似性指数取值介于 0 和 1 之间，使用 python 脚本计算。数值越小，两种化合物的结构相似度越低。


    ### 2.2. 分子表征


    使用分子指纹来表示上述数据集中的分子。分子可以通过指纹转换为结构键的二进制字符串和索引，作为机器学习模型的输入。使用 PADEL-Descriptor 软件工具[21]计算了九种类型的分子指纹，包括原子对
    2D 指纹（AP2D, 780 位）、Estate 指纹（Est, 79 位）、扩展指纹（Ext, 512 位）、指纹-FP（FP, 1024 位）、仅图形指纹（Gra,
    1024 位）、Klekota-Roth 指纹（KR, 4860 位）、MACCS 指纹（Mac, 166 位）、Pubchem 指纹（Pub, 881 位）和子结构指纹（Sub,
    307 位）。这些指纹的详细描述可在原始文献中找到[1,2,5]。


    ### 2.3. 模型构建


    在本研究中，采用五种广泛使用的机器学习算法来构建 CYP2C8 抑制剂和非抑制剂的预测模型，包括支持向量机（SVM）[23]、随机森林（RF）[24]、k
    近邻（KNN）[25]、神经网络（NN）[26]和逻辑回归（LR）[27]。所有算法均使用 scikit-learn 包版本 0.21.4 实现。


    由于几种机器学习算法受参数设置的影响较大，采用 k 折交叉验证遍历训练集中的所有数据。首先，训练集被划分为 k 个子集，k − 1 个子集首先用于构建模型，剩余的子集用于模型验证。此过程重复
    k 次。然后，选择网格搜索算法为机器学习方法选择最佳参数。在本研究中，k 的值设为 10。通过交叉验证获得的前五个模型的详细参数设置如表 S1 所示。


    ### 2.4. 模型性能评估


    在本研究中，采用训练集的 10 折交叉验证来检查所构建模型的稳健性。测试集用于进一步评估预测能力，不同来源的外部验证集用于评估模型的泛化能力。计算了几个指标以直观地评估模型质量。在二元分类模型中，数据集通常分为两类：阳性和阴性。真阳性（TP）表示
    CYP2C8 抑制剂被正确预测为阳性。真阴性（TN）表示 CYP2C8 非抑制剂被准确预测为阴性。假阳性（FP）表示 CYP2C8 非抑制剂被错误预测为抑制剂，而假阴性（FN）表示
    CYP2C8 抑制剂被错误预测为非抑制剂[28]。基于这些定义，使用以下公式计算灵敏度（SE）、特异性（SP）、Mathews 相关系数（MCC）和分类准确率（CA）


    $$ SE = \frac{TP}{TP + FN} \quad (1) $$


    $$ SP = \frac{TN}{TN + FP} \quad (2) $$


    $$ CA = \frac{TP + TN}{TP + TN + FP + FN} \quad (3) $$


    $$ MCC = \frac{(TP \times TN - FP \times FN)}{\sqrt{(TP + FP)(TP + FN)(TN + FP)(TN
    + FN)}} \quad (4) $$


    其中 CA 代表所有阳性和阴性数据中准确分类化学物质总数的比例。SE 和 SP 是两个常用的分类性能指标。SE 是 CYP2C8 抑制剂的预测准确率。SP
