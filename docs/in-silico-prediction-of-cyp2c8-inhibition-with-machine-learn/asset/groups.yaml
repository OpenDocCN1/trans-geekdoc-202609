    study. Several AD calculation methods have been reported in the literature, such
    as distance-based methods,³¹ probability density distribution,⁴⁰ and convex hull.⁴¹
    The extensively used Euclidean distance-based method was adopted for AD analysis³¹,⁴²
    in this study. First, the similarity distance matrix was calculated using the
    training set to obtain the values of the parameters $\gamma$ and $\sigma$, which
    are 0.905 and 0.095, respectively. Then, the $D_{T}$ was acquired by adjusting
    the two variables Z and k, whose values were screened from 3 to 5 and from $-5.5$
    to $-4.5$, respectively. As shown in Table 5, more


