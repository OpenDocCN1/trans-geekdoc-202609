    # In Silico Prediction of CYP2C8 Inhibition with Machine-Learning Methods


    Xiaoxiao Zhang, Piaopiao Zhao, Zhiyuan Wang, Xuan Xu, Guixia Liu, Yun Tang, and
    Weihua Li*


    Cite This: Chem. Res. Toxicol. 2021, 34, 1850−1859


    Read Online


    ACCESS | Metrics & More | Article Recommendations | Supporting Information


    ABSTRACT: Cytochrome P450 2C8 (CYP2C8) is a major drug-metabolizing enzyme in
    humans and is responsible for the metabolism of ~5% drugs in clinical use. Thus,
    inhibition of CYP2C8, which causes potential adverse drug events, cannot be neglected.
    The in vitro drug interaction studies guidelines for industry issued by the FDA
    also point out that it needs to be determined whether investigated drugs are CYP2C8
    inhibitors before clinical trials. However, current studies mainly focus on predicting
    the inhibitors of other major P450 enzymes, and the importance of CYP2C8 inhibition
    has been overlooked. Therefore, there is a need to develop models for identifying
    potentiaI CYP2C8 inhibition. In this study, in silico classification models for
    predicting CYP2C8 inhibition were built by five machine-learning methods combined
    with nine molecular fingerprints. The performance of the models built was evaluated
    by test and external validation sets. The best model had AUC values of 0.85 and
    0.90 for the test and external validation sets, respectively. The applicability
    domain was analyzed based on the molecular similarity and exhibited an impact
    on the improvement of prediction accuracy. Furthermore, several representative
    privileged substructures such as 1H-benzo[d]imidazole, 1-phenyl-1H-pyrazole, and
    quinoline were identified by information gain and substructure frequency analysis.
    Overall, our results would be helpful for the prediction of CYP2C8 inhibition.


    ![](img/c231614c653e97fe1a89fe8f2f1da0bc_0_0.png)


    # 1. INTRODUCTION


    Inhibition of cytochrome P450 enzymes (CYPs) is one of the most important reasons
    for adverse drug reactions and drug delisting.1 Therefore, it needs to be determined
    whether drug candidates are inhibitors of major drug-metabolizing P450s before
    clinical trials. The in vitro drug interaction studies guidance for industry issued
    by the U.S. Food and Drug Administration (FDA) stipulates that drug developers
    need to evaluate whether drugs inhibit the major P450 metabolic enzymes, including
    CYP1A2, CYP2B6, CYP2C8, CYP2C9, CYP2C19, CYP2D6, and CYP3A4.2


    Experimental identification of P450 inhibition is generally time consuming, costly,
    and labor intensive. Thus, many in silico models have been developed to identify
    P450 inhibition.3−8 At present, the in silico prediction for P450 inhibition reported
    in the literature is mainly based on machine-learning methods, which are increasingly
    used in data analysis, classification problems, and other fields.9−11 Shao et
    al. used the rule-based C5.0 decision tree algorithm to build classification models
    for the inhibitors of five major P450s. Rydberg et al. exploited a support vector
    machine (SVM) to classify inhibitors and noninhibitors for the five main P450
    enzymes and developed the WhichCyp Web server for predicting the P450 inhibitors.
    Our group12 employed an artificial neural network to develop a combined classifier,
    which is used to predict the inhibitors of five major P450


    metabolic enzymes. Recently, Li et al.13 developed a multitask model based on
    an autoencoder deep neural network to discriminate inhibitors and noninhibitors
    of the five major P450 isoforms. Wu et al.14 used two ensemble-learning and two
    deep-learning methods to build classification models to predict inhibitors for
    the five major P450 enzymes. Although the reported models demonstrated relatively
    high accuracy, these studies mainly focused on the five major P450 isoforms including
    CYP3A4, 2D6, 2C9, 2C19, and 1A2. Other major drug-metabolizing P450s have not
    been involved in the public reports.


    CYP2C8 is a member of the CYP2C subfamily, accounting for about 6−7% of the total
    P450 enzymes in the liver.12 CYP2C8 is responsible for the metabolism of ~5% marketed
    drugs,13 including amodiaquine, ceveratinone, and esziltax-eme.14 In the past
    decade, the importance of CYP2C8 in drug response has been recognized due to adverse
    reactions resulting from drug−drug interactions and genetic poly-


