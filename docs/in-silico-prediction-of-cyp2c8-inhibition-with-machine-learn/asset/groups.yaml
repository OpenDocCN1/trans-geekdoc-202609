    R 构型，一个是 S 构型，剩下一个是外消旋体。然而，这三个化合物都被标记为“活性”。我们在数据处理中未考虑化合物的手性，因此将其中两个化合物视为重复项并移除。从文献中提取的三个化合物与从
    PubChem 中提取的不兼容。在文献中，这些化合物被视为非抑制剂，但它们在 PubChem 中被标记为“活性”。因此，我们在模型构建中移除了这些化合物。此外，在这些化学品中，11
