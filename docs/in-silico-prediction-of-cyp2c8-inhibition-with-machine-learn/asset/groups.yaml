    and quinoline frequently occur in the CYP2C8 inhibitors reported in the literature,
    such as Azilsartan, 45 Candesartan cilexetil, 14 and Nilotinib. 46 Molecules containing
    these fragments tend to interact with CYP2C8, possibly because it can occupy the
    distal hydrophobic pocket in the active cavity. For example, in the complex crystal
    structure of CYP2C8 (PDB code 2NNI), the chloroquinoline ring of the potent competitive
    inhibitor Montelukast interacts with the hydrophobic residue cluster located below
    helix G to stabilize its binding to CYP2C8, 47,48 as shown in Figure 3A.


    The remaining privileged substructures have similar scaffolds including the benzenesulfonamide,
    benzamide, and N-phenyl- formamide fragments. In fact, many reported potent CYP2C8
    inhibitors contain the above structural fragments, such as Zafirlukast, 49 Dabrafenib,
    50 and Gliburide. 14 According to the crystal structure of PDB code 2NNI, the
    terminal carboxylic acid group of Montelukast forms hydrogen bonds with the polar
    amino acid cluster (including Ser100, Ser103, and Asn217) near helix B'' in the
    active site (Figure 3A). In addition, in another complex crystal structure of
    CYP2C8 (PDB code 2VN0), the ketone oxygen in the thiazolidinedione can form hydrogen
    bonds with Arg241 in helix G and Asn204 in helix F. The other oxygen in the middle
    of the structure forms hydrogen bonds with Ser103 via the surrounding water molecules
    51,52 (Figure 3B). Therefore, compounds containing sulfonamide or amide groups
    can form polar interactions with the polar amino acid cluster near helix B'' or
    Arg241 and Asn204 of CYP2C8, which may explain the frequent presence of benzenesulfonamide
    and benzamide fragments in CYP2C8 inhibitors.


    In addition, some substructures containing fluorine atoms were also identified
    by MoSS and SARy. In fact, fluorine atoms are present in several known CYP2C8
    inhibitors such as Dabrafenib and Nilotinib. As an electron-withdrawing group,
    F reduces the electron cloud density of the benzene ring, thus enhancing the hydrophobicity
    of the molecule, 53,54 making it easier to bind to the hydrophobic cavity of CYP2C8.


