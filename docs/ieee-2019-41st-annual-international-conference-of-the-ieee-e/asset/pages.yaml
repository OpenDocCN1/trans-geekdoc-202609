    dictionaries different and yield better classification performance. For example,
    with just one level, we learn 50 atoms for MNIST; 625 atoms for the bg-newgroup
    and 148 for GTZAN; compared to the last level of deep learning, we performed experiments
    with up to three levels. For the MNIST database and its variants, the number of
    atoms in the multi-level dictionaries: 300-150.5. For the 20-newgroup and the
    GTZAN (music database), the number of atoms varies from the previous layer. The
