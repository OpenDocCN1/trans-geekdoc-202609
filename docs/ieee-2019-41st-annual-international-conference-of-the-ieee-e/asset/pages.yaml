    = \varphi(D_2\varphi(DN_2))$, Equation (17) can be written as $X = D_1Z_1$ such
    that it can be solved as single dictionary learning. The representation is not
    sparse. Hence it can be solved using alternating minimization:


    ```

    $min \|X - D_1Z_1\|_F^2$$

    ```


    Optimality of (19) by alternating minimization has been proven in [56]. Therefore
