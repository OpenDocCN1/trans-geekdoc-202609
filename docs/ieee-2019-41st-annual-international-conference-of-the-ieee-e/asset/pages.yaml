    # B. DEP BOLTZMANN MACHINE


    Restricted Boltzmann Machines are undirected models that use hidden units to model
    the distribution of the stochastic units. The hidden layer is symmetrically connected
    to the visible unit and the architecture is ''restricted'' as there are no connections
    between units of the same layer. Traditionally, RBMs are used to model the distribution
    of the input p(x).


