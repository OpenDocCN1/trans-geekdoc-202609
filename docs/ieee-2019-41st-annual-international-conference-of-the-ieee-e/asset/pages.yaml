    the results for shallow dictionary and Column 3 shows the results with different
    levels of deep learning. The results show that for all the databases, deep learning
    offers improvements over shallow dictionary learning. The improvement in accuracy
    is possibly owing to more abstract representation learned from layers. Depending
    on the complexity of the dataset, the difference in performance varies from 0.4%
    to 9%. Table 2 indicates the first layer dictionary on MNIST database.


    Generally, the atoms are initialized by random choices from the training set;
