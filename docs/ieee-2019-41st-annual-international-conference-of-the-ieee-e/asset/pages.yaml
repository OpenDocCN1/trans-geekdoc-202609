    IIIT Delhi, New Delhi 110025,

    Corresponding author: M. Vatsa (mayank@iiit.1.in).


    ABSTRACT Two representation learning paradigms are dictionary learning and deep
    learning. While dictionary learning focuses on learning “basis” or “features”
    by matrix factorization, deep learning focuses on extracting features using “weights”
    or “filter” in a greedy layer by layer fashion. This paper focuses on combining
    the concepts of these two paradigms by proposing deep learning and how sheer architectures
    can be built using the layers of dictionary learning. The proposed technique is
    compared with other deep learning approaches, such as stacked autoencoder, deep
    belief network, and convolutional neural network. Experiments on benchmark data
    show that the proposed technique achieves higher classification and clustering
    accuracies. On a real-world problem of electrical appliance classification, we
    show that dictionary learning excels where others do not at-par. We postulate
    that the proposed formulation can provide the path for a new class of deep learning
    tools.


    INDEX TERMS Deep learning, dictionary learning, feature representation.


    # I. INTRODUCTION


    In representation learning paradigm, dictionary learning has received a lot of
    interest. Researchers adopted the concept of dictionary learning in [1] and information
    retrieval [2] in 90s. In early days, the ‘dictionary learning’ had not been; researchers
    were using the matrix factorization. The goal was to learn an empirical basis
    from data. It required decomposing the data to a basis/dictionary matrix and a
    feature matrix; hence the “matrix factorization” approach was used.


    The current popularity of dictionary learning owes to K-SVD, [3]. K-SVD is an
    algorithm to decompose a matrix (training data) into a dense basis and sparse
    coefficients. However, the concept of such a sparse-dense decomposition is K-SVD
    [5]. Since the advent of K-SVD in 2006, there has been a plethora of work on this
    topic. Dictionary learning can be used for unsupervised problems like image segmentation
    as well as for problems arising in sparse feature extraction. Furthermore, it
    dictionary learning has been used to all inverse problems in image processing
    starting from simple image [6], [7] and denoising, inpainting [9], to complex
    problems such as half-toning [10]. Such problems can also be solved by the Compressed
    Sensing (CS) [12], [13]. However, it has been seen that dictionary learning is
    the


    yields better (customized representation) compared to the fixed basis obtained
    by Compressed Sensing. Mathematical transforms such as Discrete Cosine Transform
    (DCT), wavelet, and Gabor have been used in image classification [14]–16]. Existing
    techniques have used these transforms as a firstly followed by statistical feature
    extraction methods as Principal Component Analysis (PCA) or Linear Discriminant
    Analysis (LDA) before using the features to a classifier. Dictionary learning
    has replaced these transforms in image processing, it is also used in feature
    extraction scenarios. Dictionary learning provides researchers the opportunity
    to design dictionaries which yield not only sparse representation (e.g., wavelet,
    wavelet, and DCT) but also informative.


