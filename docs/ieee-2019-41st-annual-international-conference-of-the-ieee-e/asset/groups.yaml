    ABSTRACT Two representation learning paradigms are dictionary learning and deep
    learning. While dictionary learning focuses on learning “basis” or “features”
    by matrix factorization, deep learning focuses on extracting features using “weights”
    or “filter” in a greedy layer by layer fashion. This paper focuses on combining
    the concepts of these two paradigms by proposing deep learning and how sheer architectures
    can be built using the layers of dictionary learning. The proposed technique is
    compared with other deep learning approaches, such as stacked autoencoder, deep
    belief network, and convolutional neural network. Experiments on benchmark data
    show that the proposed technique achieves higher classification and clustering
    accuracies. On a real-world problem of electrical appliance classification, we
    show that dictionary learning excels where others do not at-par. We postulate
    that the proposed formulation can provide the path for a new class of deep learning
    tools.


