    类别的出现情况大体相同。这在 [50] 中得到了修正。


    带标签的 KSVD 是学习判别性稀疏表示的技术之一。它易于理解和实现；在人脸识别中效果良好 [28]。第一种技术被称为 Discriminative-SVD
    [28] 或 LC-KSVD [29]；它提出了以下优化问题：


    ```

    $$\min_{D} \|X - DZ_{D,A}\|_F^2 + \lambda_1 \|D_{D,A}\|_F^2 + \lambda_2 \|Z_A\|_1
    + \lambda_3 \|Q - AZ_A\|_F^2$$

    ```


    这里，$Q$ 是训练样本；它是正确类别和零的基。$A$ 是线性分类器的参数。


    在 [29] 中，提出了第二种表述来惩罚分类错误。LC-SVD2 表述如下：


    ```

    $$\min_{D,Z} \|X - DZ_{D,A}\|_F^2 + \lambda_1 \|D_{D,A}\|_F^2 + \lambda_2 \|Z_A\|_1
    + \lambda_3 \|H - Z\|_F^2$$

    ```


    $H$ 是对应输入信号的“稀疏”代码，在训练样本 $X_i$ 和字典项 $D_j$ 具有相同标签的索引处，$H_i$ 没有值。这种表述不仅在特定系数 $Z_j$
    上识别标签，而且在字典原子上识别标签。


    ```

    $p(H) = \prod p(h|x)$

    ```


    ```

    $p(H|X) = \prod p(h|x)$

    ```


    假设输入是二进的，节点激活的概率为：


    ```

    $p(x|h) = sig(W^T h)\np p(h|x) = sig(W x)$

    ```


    计算该函数的精确值几乎是不可行的。然而，存在一种通过对比散度（contrastive divergence）训练的梯度的随机近似。吉尔斯采样重构的收敛产生了一种能量分布的近似值，通过该分布可以计算梯度。


    通常，RBM 是无监督的，但也有研究使用类别标签来训练判别性 RBM [55]。还有本质上是稀疏的 RBM [52]。稀疏性通过仅当隐藏单元超过某些阈值时才触发来控制。通过将稀疏
    RBM 扩展为具有组内/类内相似模式，也可以实现监督 [53]。


