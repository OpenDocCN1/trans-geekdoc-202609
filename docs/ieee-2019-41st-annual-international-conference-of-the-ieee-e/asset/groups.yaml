    深度字典学习


    2016年6月12日接收，2016年7月26日接受，2017年1月27日发表。


    **S. TARYAL (IEEE 高级会员), ANHAL MAJUMDAR (IEEE 高级会员), SINGH (IEEE 高级会员), 以及 MAYANK
    VATSA (IEEE 高级会员)**

    新德里 IIIT

    通讯作者：M. Vatsa (mayank@iiit.in)。


    摘要——两种表示范式是字典学习和深度学习。字典学习侧重于通过矩阵分解学习“基”或“特征”，而深度学习则侧重于使用权重提取特征。本文侧重于通过如何使用字典学习构建深度架构，从而结合这两种范式的概念。将所提技术与堆叠自动编码器、深层信仰网络和卷积神经网络等学习方法进行了比较。在电力分类真实基准数据上的实验表明，字典学习在其他方法不佳的情况下表现优异。我们假设所提出的公式可以为一类新型深度学习工具提供路径。


    索引术——深度学习，字典学习，特征表示。


    ## I. 引言


    在表示学习范式中，字典学习在90年代引起了广泛关注。研究人员将字典学习的概念应用于信息检索 [1], [2]。在早期，字典学习尚未出现；研究人员使用的是矩阵分解。其目标是从数据中学习经验基；因此需要将数据分解为特征矩阵。字典学习如今的盛行归功于
    K-SVD [3]。K-SVD 是一种将矩阵（训练数据）分解为稠密基和稀疏系数的算法。然而，这种稀疏-稠密分解的概念是 K-SVD [5]。自2006年K-SVD出现以来，关于该主题已产生了大量工作。字典学习可用于图像分割等无监督问题，也可用于稀疏特征提取中出现的问题。此外，字典学习已用于图像处理中的所有反演问题，从简单的图像去噪
    [6]、补全 [7] 到复杂的层析扫描问题 [10]。这类问题也可以通过压缩感知 (CS) [12], [13] 解决。然而发现，与压缩感知获得的固定基相比，字典学习可产生更好的（定制表示）。离散余弦变换
    (DCT)、小波和 Gabor 等数学变换已用于图像分类 [14]–[16]。现有技术在使用特征进入分类器之前，首先通过主成分分析 (PCA) 或线性判别分析
    (LDA) 等统计特征提取方法使用这些变换。字典学习已取代图像处理中的这些变换；它也被用于特征提取场景。字典学习为研究人员提供了设计字典的机会，这种字典不仅能产生稀疏表示（例如小波和
    DCT），而且包含丰富的信息。


    字典学习的早期技术提出了学习特定字典类别的原生方法 [17]–[19]。后来，字典学习中引入了字典惩罚以提高分类性能。其中一种技术是包含 softmax 字典函数
    [20]–[22]；之后在字典惩罚中加入了 Fisher 准则、线性分类误差 [24] 和 [25]。在 [27], [28] 中，通过将学习到的特征映射到表示类引入了区分性。之前对字典学习“浅”模型的研究学习了受限玻尔兹曼机
    (RBM) [30] 和自动编码器 (AE) [31]，这是两种流行的深度学习架构。在深度学习 (DL) 中，代价是数据与学习基给出的表示之间的欧几里得距离；对于
    RBM，它是重构误差；而对于 AE，代价是数据与解码表示/特征之间的重构误差。


    对于稀疏表示问题，目标是学习一个以稀疏方式表示样本的基，即 $Z$ 需要是稀疏的。K-SVD [3], [4] 是稀疏表示最著名的技术。从根本上说，它解决了问题：


    $$\min ||X - DZ||^2_F \text{ 使得 } ||Z||_0 \le \ell$$


    几乎同时，当字典学习获得关注时，机器学习研究人员发现通过深层网络架构可以实现线性紧凑的表示。深层信仰网络 (DBN) 通过连续堆叠多个 RBM 形成 [32]。同样，堆叠自动编码器
    (SAE) 通过一个接一个的 AE 创建 [34], [35]。


    受第一种学习范式的启发，在希望学习多级字典的道路上，深度学习社区的许多研究人员已经通过设计更深架构实现了这一点；我们断言，所提出的字典学习算法将产生多个字典，这些字典随后可以合并为单级。然而，这种合并后的字典将不同于所提出的深度学习。本文剩余部分在第二节介绍字典学习的文献综述，第三节介绍方法论，第四节介绍评估。


    ## II. 文献综述


    我们将回顾之前关于字典学习、堆叠自动编码器和玻尔兹曼机的研究。


    ### A. 字典学习


    字典学习的早期研究侧重于学习用于表示的基。对字典或学习系数没有限制。使用的方法是学习基：


    $$\min ||X - DZ||^2_F (1)$$


    这里 X 是数据，D 是字典，Z 符合学习系数的约束。合成字典公式 K-SVD 更好；如果另外一个（Z 和 D）是常数，则它在数据和 D 的每一个项上都是线性的。


