    better on benchmark datasets. Experiments on a practical approach of application
    classification show that our method offers higher accuracies where other deep
    learning techniques significantly lower results. Similar to the advancements made
    in "deep learning", it is our assertion that the formulation of dictionary learning
    provides the basis to develop more efficient dictionary algorithms and help in
    advancing state-of-the-art.


    In the future, we plan to test the robustness of dictionary learning in the presence
    of noise, and limits of training sample. We also plan to apply this technique
    to other problems such as biometrics, vision, and speech processing. Further,
    there has been a lot of work on supervised dictionary learning; we expect to improve
    the results ever by incorporating techniques from supervised learning.


