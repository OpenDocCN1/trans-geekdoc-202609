    IIIT, New Delhi

    Corresponding author: M. Vatsa (mayank@iiit.in).


    ABSTRACT—Two representation paradigms are dictionary learning and deep learning.
    While dictionary learning focuses on learning "basis" or "features" by matrix
    factorization, deep learning focuses on extracting features using weights. This
    paper focuses on combining the concepts of these two paradigms by proposing how
    deep architectures can be built using dictionary learning. The proposed technique
    is compared with other learning approaches such as stacked autoencoder, deep belief
    network, and convolutional neural network. Experiments on real-world benchmark
    data of electrical classification show that dictionary learning excels where others
    do not. We postulate that the proposed formulation can provide a path for a new
    class of deep learning tools.


    INDEX TERMS—Deep learning, dictionary learning, feature representation.


    ## I. INTRODUCTION


    In representation learning paradigm, dictionary learning has received a lot of
    interest in the 90s. Researchers adopted the concept of dictionary learning for
    information retrieval [1], [2]. In early days, dictionary learning had not been;
    researchers were using matrix factorization. The goal was to learn an empirical
    basis from data; hence required decomposing the data to a feature matrix. The
    current popularity of dictionary learning owes to K-SVD [3]. K-SVD is an algorithm
    to decompose a matrix (training data) into a dense basis and sparse coefficients.
    However, the concept of such sparse-dense decomposition is K-SVD [5]. Since the
    advent of K-SVD in 2006, there has been plethora of work on this topic. Dictionary
    learning can be used for unsupervised problems like image segmentation as well
    as for problems arising in sparse feature extraction. Furthermore, dictionary
    learning has been used for all inverse problems in image processing starting from
    simple image denoising [6], inpainting [7], to complex problems such as tomography
    [10]. Such problems can also be solved by Compressed Sensing (CS) [12], [13].
    However, it has been seen that dictionary learning yields better (customized representation)
