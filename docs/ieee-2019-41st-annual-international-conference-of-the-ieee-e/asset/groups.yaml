    The label consent KSVD is one of the techniques for learning discriminative sparse\
    \ representation. It is simple to understand and implement; it showed results\
    \ for face recognition [28]. The first technique is mentioned as Discriminative-SVD\
    \ [28] or LC-KSVD[29]; it proposes an optimization problem of the following:\n\
    \n```\n$$\\min_{D} \\|X - DZ_{D,A}\\|_F^2 + \\lambda_1 \\|D_{D,A}\\|_F^2 + \\\
    lambda_2 \\|Z_A\\|_1 + \\lambda_3 \\|Q - AZ_A\\|_F^2$$\n```\n\nHere, $Q$ is of\
    \ the training samples; it is a basis for the correct class and zeroes. $A$ is\
    \ a parameter of the linear classifier.\n\nIn [29], a second formulation is proposed\
    \ another to penalize the classification error. The LC-SVD2 formulation is as\
    \ follows:\n\n```\n$$\\min_{D,Z} \\|X - DZ_{D,A}\\|_F^2 + \\lambda_1 \\|D_{D,A}\\\
    |_F^2 + \\lambda_2 \\|Z_A\\|_1 + \\lambda_3 \\|H - Z\\|_F^2$$\n```\n\n$H$ is a\
    \ 'sparse' code corresponding to input signal has no values of $H_i$ at indices\
    \ where the training sample $X_i$ and the dictionary item $D_j$ share the same\
    \ label. This formulation identifies labels not only on the specific coefficients\
    \ $Z_j$ but also on the dictionary atoms.\n\n```\n$p(H) = \\prod p(h|x)$\n```\n\
    \n```\n$p(H|X) = \\prod p(h|x)$\n```\n\nAssuming a binary input, the probability\
    \ that a node will be active is:\n\n```\n$p(x|h) = sig(W^T h)$\nnp p(h|x) = sig(W\
    \ x)$\n```\n\nComputing the exact of this function is almost intractable. however,\
    \ there is a stochastic approximation to the gradient trained as contrastive divergence.\
    \ A convergence of Gibbs sampling reconstruction, produces an approximation of\
    \ the energy distribution, which the gradient can be computed.\n\nUsually, RBM\
    \ is unsupervised, but there are studies where discriminative RBMs are trained\
    \ using the class labels [55]. There are also RBMs, which sparse in nature [52].\
    \ The sparsity is controlled by firing hidden units only if they are over some\
    \ threshold. Supervision can also be achieved using sparse RBMs by extending it\
    \ to have similarity pattern within the group/class [53].\n\n![](img/5de391b384cc1d6b5a694c0bae136b4b_2_0.png)\n\
    \nFIGURE 2. Deep Boltzmann Machine.\n\nDeep Boltzmann Machines (DBM) [54] is an\
    \ extension of RBM by creating multiple hidden layers on top of each other (2).\
    \ DBM is an undirected learning model and it differs from the other stacked architectures\
    \ in which each layer receives feedback from both the top and down-layer signals.\
    \ This feedback mechanism helps managing uncertainty in learning models. The traditional\
    \ RBM Gaussian-Bernoulli RBM [55] can be used with real-valued (between 0 and\
    \ 1) visible units.\n\n## B. DEP BOLTZMANN MACHINE\n\nRestricted Boltzmann Machines\
    \ are undirected models that use hidden units to model the distribution of the\
    \ stochastic units. The hidden layer is symmetrically connected to the visible\
    \ unit and the architecture is 'restricted' as there are no connections between\
    \ units of the same layer. Traditionally, RBMs are used to model the distribution\
    \ of the input $p(x)$.\n\n![](img/5de391b384cc1d6b5a694c0bae136b4b_2_1.png)\n\n\
    FIGURE 1. Restricted Boltzmann Machine.\n\nThe schematic diagram of RBM is shown\
    \ in Fig. 1. The objective is to learn the network weights (W) and the representation\
    \ (H). It is achieved by optimizing the Boltzmann cost function given by\n\n```\n\
    $p(W,H) = e^{-E(W,H)}$\n```\n\nwhere, $E(W,H) = -H^T W$ including the bias terms.\
    \ Assuming independence, the conditional distributions are given by.\n\n## C.\
    \ STACKED AUTOENCODER\n\nAn autoencoder consists of two parts – the encoder maps\
    \ the input to a latent representation and the decoder maps the latent representation\
    \ back to the data. For a given input (including the bias term) $x$, the latent\
    \ space is expressed as:\n\n```\n$h = Wx$\n```\n\nHere, rows $w$ of the link weights\
    \ are the weights from input to the hidden node. Usually, a non-linear activation\
    \ function is used at the output of the hidden units leading to:\n\n```\n$h =\
    \ \\phi(Wx)$\n```\n\n# S. Tariol et al.: Deep Dictionary Learning\n\n# IEEE Access\n\
    \n![](img/5de391b384cc1d6b5a694c0bae136b4b_3_0.png)\n\nand\n\n```\n$f = \\phi(W_L\\\
    phi(W_{L-1} \\dots \\phi(W_1X)))$\n```\n\nSolving the problem (13) is computationally\
    \ challenging. Also learning many parameters (network weights) leads to over-fitting.\
    \ Both these issues, the weights are usually learned in a greedy layer-by-layer\
    \ fashion [31], [34].\n\nStacked denoencoder [35] is a variant of the autoencoder\
    \ where the input consists of noisy samples and the output consists of clean samples.\
    \ The encoder and decoder are used to denoise input samples. Another variation\
    \ for the autoencoder is to regularize it, ise.\n\n```\n$arg \\min ||X - g \\\
    circ f(X)||^2 + R(W, X)$ (14)\n```\n\nThe regularization can be a sparsity term\
    \ [56], or a weight decay (Frobenius norm of W) as used in the convolutional autoencoder\
    \ [58]. The regularization term is usually chosen so that is differentiable and\
    \ hence minimizing using gradient descent techniques.\n\nFIGURE 3. Single Layer\
    \ Autoencoder.\n\nAlthough the sigmoid function is popularly used, other non-linear\
    \ functions such as tanh can also be used. Rectifier units and linear layers map\
    \ network layer activation; owing to linearity, the process is considered faster.\
    \ The decoder maps the latent variables to the data space.\n\n```\n$x = W^T \\\
    phi(Wx)$ (11)\n```\n\nSince the data space is assumed to be the space of real\
    \ numbers, there is no signal noise during training, the problem is to learn decoding\
    \ $W$ and $W'$. These are learned by decoding the Euclidean cost:\n\n```\n$arg\
    \ \\min ||X - W^T \\phi(WX)||^2$ (12)\n```\n\n## III. DICTIONARY LEARNING\n\n\
