    RICHA SINGH (S''04–M''09–SM''14) 于2008年在美国西弗吉尼亚州摩根敦堡的西弗吉尼亚大学获得计算机科学博士学位。她目前是印度新德里理工学院（IIT
    Delhi）的研究教授，同时也是美国西弗吉尼亚大学的访问教授。她的研究曾获得印度身份识别认证计划（UDAI）和印度政府的资助。她在同行评审期刊、书籍章节和会议上发表了超过175篇论文。其兴趣领域包括生物识别、模式识别和机器学习。


    MAYANK VATSA (S''04–M''09–SM''14) 于2005年在美国西弗吉尼亚州摩根敦堡的西弗吉尼亚大学获得计算机科学硕士和博士学位，目前是印度新德里理工学院（IIT
    Delhi）的副教授以及美国西弗吉尼亚大学的访问教授。他的研究曾获得印度身份识别认证计划（UDAI）和印度政府的资助。他在同行评审期刊、书籍章节和会议上发表了超过175篇论文。


    她是因德拉普拉斯塔理工学院的 Kusum and Mohan Pai 学金获得者、印度科学与技术部（DST）FAST 奖获得者，并多次获得国际会议的最佳论文和最佳海报奖。她是
    *Information Fusion*（Elsevier）、*IEEE Access* 以及 *EURAS Journal on Image and Video
    Processing*（Springer）的编辑。她担任了 ISBA 2017 的联合大会主席和 BTAS 2016 的程序委员会联合主席。


    他的兴趣领域包括图像处理、计算机视觉和研究员工作。他是印度科学与技术部（DST）FAST 奖获得者，并多次获得国际会议的最佳论文和最佳海报奖。他还是 *IEEE
    ACCESS* 和 *Information Fusion*（Elsevier）的副编辑。他曾担任 ICB 2013、IJCB 2014 和 ISBA 2017
    的程序委员会联合主席。


