    图 2. 深度玻尔兹曼机。


    深度玻尔兹曼机 (DBM) [54] 是 RBM 通过堆叠创建多个隐藏层实现的扩展 (2)。DBM 是一种无向学习模型，它与其他堆叠架构不同，每层都接收来自顶部和底层信号的反馈。这种反馈机制有助于管理学习模型中的不确定性。传统的
    RBM 高斯-贝尔努利 RBM [55] 可用于实值（0 到 1 之间）可见单元。


    ## B. 受限玻尔兹曼机


    受限玻尔兹曼机是无向模型，使用隐藏单元对随机单元的分布建模。隐藏层与可见单元对称连接，由于同层单元之间没有连接，因此该架构是“受限”的。传统的，RBM 用于对输入
    $p(x)$ 的分布。


    ![](img/5de391b384cc1d6b5a694c0bae136b4b_2_1.png)


    图 1. 受限玻尔兹曼机。


    RBM 的原理图如图 1 所示。目标是学习网络权重 (W) 和表示 (H)。这通过优化给定的玻尔兹曼代价函数来实现：


    ```

    $p(W,H) = e^{-E(W,H)}$

    ```


    其中，$E(W,H) = -H^T W$，包含了偏置项。假设独立性，条件分布给给出。


    ## C. 堆叠自动编码器


    自动编码器由两部分组成——编码器将输入映射到潜在表示，解码器将潜在表示映射回数据。对于给定的输入（包括偏置项）$x$，潜在空间表示为：


    ```

    $h = Wx$

    ```


    这里，连接权重的行 $w$ 是从输入到隐藏节点的权重。通常在隐藏单元的输出处使用非线性激活函数，导致：


    ```

    $h = \phi(Wx)$

    ```


