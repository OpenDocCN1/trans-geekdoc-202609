    # Early Termination Directives


    ## Common Parameters


    * `evaluation_interval`: how often the policy is applied. Each time the training
    script records the main metric, it is considered an interval. Therefore, a parameter
    of `1` will apply the directive each time the training script reports the main
    metric. A parameter of `2` will apply the directive the other times that the training
    script notifies the main metric. If it is not specified, it is set to `1` by default.
    `evaluation_interval` `evaluation_interval` `evaluation_interval`


    * `delay_evaluation`: delays the first evaluation of the directive a specified
    number of intervals. It is an optional parameter that allows all configurations
    to be executed during an initial minimum number of intervals, which prevents the
    premature termination of training series. If specified, the policy applies each
    multiple of `evaluation_interval` that is greater than or equal to `delay_evaluation`.


    The Azure Machine Learning service supports the following early termination directives.


    ## Bandit Directive


    Bandit is a termination directive based on the factor of delay or the amount of
    delay and the evaluation interval. The directive terminates in advance those executions
    in which the main metric is not within the factor of delay or amount of delay
    specified concerning the series of workouts with the best performance. This directive
    takes the following configuration parameters:


    * `slack_factor` or `slack_amount`: the allowed delay concerning the series of
    workouts with the best performance. Specifies the allowed delay as a relation.
    Specifies the allowed delay as an absolute quantity, rather than a relation. `slack_factor`
    `slack_amount`


    For example, imagine that a bandit policy is applied in interval `10`. Suppose
    that the execution with the best performance in interval `10` reports the main
    metric of `0.8` to maximize it. If the directive were specified with a parameter
    of `0.2`, those training series whose best metric in interval `10` is less than
    `0.66` (`0.8 / (1 + )`) would end. If, on the other hand, the directive was specified
    with a parameter of `0.2`, those training series whose best metric in the interval
    `10` is less than `0.6` (`0.8 - `) will end. `slack_factor` `slack_factor` `slack_amount`
    `slack_amount`


    * `evaluation_interval`: the frequency with which the directive is applied (optional
    parameter).


    * `delay_evaluation`: delays the first evaluation of the directive a specified
    number of intervals (optional parameter).


    ```python

    from azureml.train.hyperdrive import BanditPolicy

    early_termination_policy = BanditPolicy(slack_factor = 0.1, evaluation_interval=1,
    delay_evaluation=5)

    ```

    In this instance, the early termination policy is applied at each interval when
    the metrics are notified, starting at the evaluation interval `5`. Any execution
    whose best metric is less than `(1 / (1 + 0.1)`, or at `91 %` of the execution
    with the best performance, will be finished.


    ## Median Stopping Directive


    The median of detention is an early termination directive based on the execution
    of average values of the main metrics reported by the executions. This directive
    calculates the average values of execution in all the training series and finishes
    the executions, whose performance is worse than the median of the average values
    of execution. This directive takes the following configuration parameters:


    * `evaluation_interval`: the frequency with which the directive is applied (optional
    parameter).


    * `delay_evaluation`: delays the first evaluation of the directive a specified
    number of intervals (optional parameter).


    ```python

    from azureml.train.hyperdrive import MedianStoppingPolicy

    early_termination_policy = MedianStoppingPolicy(evaluation_interval=1, delay_evaluation=5)

    ```

    In this instance, the early termination policy is applied at each interval, beginning
    at the evaluation interval `5`. Execution is terminated at interval `5` if its
    best principal metric is worse than the median of the average execution values
    during the intervals in a ratio of `1` to `5` in all the training series.


    ## Truncation Selection Directive


    The truncation selection cancels a given percentage of executions with the lowest
    performance in each evaluation interval. The executions are compared based on
    their performance in the main metric, and `X%` with the lowest performance is
    terminated. This directive takes the following configuration parameters:


    * `truncation_percentage`: the percentage of executions with the lowest performance
    that will be completed in each evaluation interval. Specify an integer value between
    `1` and `99`.


    * `evaluation_interval`: the frequency with which the directive is applied (optional
    parameter).


    * `delay_evaluation`: delays the first evaluation of the directive a specified
    number of intervals (optional parameter).

