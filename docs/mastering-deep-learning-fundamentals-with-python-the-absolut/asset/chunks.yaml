- raw: CONCLUSION Many deep learning systems were identified as early as the 1980s
    (and even earlier, but the results were unimpressive, while advances in the theory
    of artificial neural networks (pre-training of neural networks using a special
    case of an omnidirectional graphical model, the so-called Boltzmann limited machine
    ) and the computing power of the mid-2000s (first of all, Nvidia graphic processors
    , and now Google tensor processors ) allowed to create complex technological architectures
    of neural networks with sufficient performance and allowing to solve a wide range
    of tasks that could not be effectively solved earlier, For example, in computer
    vision , machine translation , speech recognition and the quality of the solution
    in many cases is now comparable, and in some cases exceeds the efficiency of “protein”
    experts. Deep learning algorithms are contrasted to shallow learning algorithms
    by the number of parameterized transformations encountered by the signal propagating
    from the input layer to the output layer, where a data processing unit that has
    learnable parameters, such as weights or thresholds, is considered a parametrized
    transformation. The chain of changes from input to output is called CAP - the
    transfer of responsibility ( eng.   Credit assignment path, CAP).). CAPs describe
    potential causal relationships along with the network from entry to exit, with
    the path in different branches may have different lengths. For a forward formed
    neural network, the CAP depth is not different from the network depth and is equal
    to the number of hidden layers plus one (the output layer is also parameterized).
    For recurrent neural networks in which the signal can jump through the layers
    bypassing the intermediate ones, the CAP due to feedback is potentially unlimited
    in length. There is no universally agreed threshold for the depth of division
    of shallow learning from deep learning, but it is usually considered that deep
    learning is characterized by several non-linear layers (CAP> 2). Jörgen Schmidhuber
    also highlights “very deep learning” when CAP is> 10 .
  fmt: '

    # CONCLUSION


    Many deep learning systems were identified as early as the 1980s (and even earlier,
    but the results were unimpressive, while advances in the theory of artificial
    neural networks (pre-training of neural networks using a special case of an omnidirectional
    graphical model, the so-called `Boltzmann limited machine`) and the computing
    power of the mid-2000s (first of all, `Nvidia graphic processors`, and now `Google
    tensor processors`) allowed to create complex technological architectures of neural
    networks with sufficient performance and allowing to solve a wide range of tasks
    that could not be effectively solved earlier, For example, in `computer vision`,
    `machine translation`, `speech recognition` and the quality of the solution in
    many cases is now comparable, and in some cases exceeds the efficiency of “protein”
    experts. Deep learning algorithms are contrasted to shallow learning algorithms
    by the number of parameterized transformations encountered by the signal propagating
    from the input layer to the output layer, where a data processing unit that has
    learnable parameters, such as weights or thresholds, is considered a parametrized
    transformation. The chain of changes from input to output is called `CAP` - the
    transfer of responsibility (eng. Credit assignment path, `CAP`).). `CAP`s describe
    potential causal relationships along with the network from entry to exit, with
    the path in different branches may have different lengths. For a forward formed
    neural network, the `CAP` depth is not different from the network depth and is
    equal to the number of hidden layers plus one (the output layer is also parameterized).
    For recurrent neural networks in which the signal can jump through the layers
    bypassing the intermediate ones, the `CAP` due to feedback is potentially unlimited
    in length. There is no universally agreed threshold for the depth of division
    of shallow learning from deep learning, but it is usually considered that deep
    learning is characterized by several non-linear layers (`CAP > 2`). `Jörgen Schmidhuber`
    also highlights “very deep learning” when `CAP > 10`.

    '
  trans: '


    # 结论


    许多深度学习系统早在 1980 年代就已被识别出来（甚至更早，但结果并不令人印象深刻，而人工神经网络理论的进步（使用一种特殊的全向图形模型的神经网络预训练，即所谓的
    `Boltzmann limited machine`）以及 2000 年代中期的计算能力（首先是 `Nvidia graphic processors`，现在是
    `Google tensor processors`）使得能够创建具有足够性能的神经网络复杂技术架构，并能够解决以前无法有效解决的广泛任务，例如在 `computer
    vision`、`machine translation`、`speech recognition` 中，并且在许多情况下解决方案的质量现在已可与“蛋白质”专家的效率相媲美，在某些情况下甚至超过了“蛋白质”专家的效率。深度学习算法与浅层学习算法的区别在于信号从输入层传播到输出层时遇到的参数化变换的数量，其中具有可学习参数的数据处理单元，例如权重或阈值，被视为参数化变换。从输入到输出的变化链被称为
    `CAP` - 责任转移（eng. Credit assignment path, `CAP`）。）。`CAP`s 描述了网络从入口到出口沿线的潜在因果关系，不同分支中的路径可能具有不同的长度。对于前向形成的神经网络，`CAP`
    深度与网络深度没有区别，等于隐藏层数加一（输出层也是参数化的）。对于信号可以通过反馈绕过中间层跳跃的循环神经网络，`CAP` 由于反馈而在长度上可能无限。尚无
    universally agreed threshold 来划分浅层学习与深度学习的深度阈值，但通常认为深度学习的特点是具有多个非线性层（`CAP > 2`）。`Jörgen
    Schmidhuber` 还强调了“非常深的深度学习”，当 `CAP > 10` 时。


    '
