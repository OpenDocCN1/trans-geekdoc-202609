    `deep learning` 是 `machine learning` 的一个子单元。`Machine learning` 是 `artificial intelligence`
    的一个子单元。换句话说，所有 `deep learning` 算法都是 `machine learning` 算法，但许多 `machine learning`
    算法并不使用 `deep learning`。`Deep learning` 特指一种名为 `neural network` 的算法类，技术上仅指“deep
    ağ neural networks（而且一秒钟）。第一个 `neural network` 于 1949 年开发，但当时用处不大。它将持续优于从 1970
    年代的 `neural network` 基于模型到 2010 年的传统 AI 形式。


    这些非学习型 AI 类型包括基于规则的算法（考虑一个极其复杂的 `if / else` 块数组）；基于直觉的 AI 如 `A * search`；约束饱和算法如
    `Arc Consistency`；树搜索算法如 `minimax`（由著名的 `Deep Blue` 国际象棋 AI 使用）；等等。


    阻止 `machine learning` 尤其是 `deep learning` 成功发展的两件事是——大型数据集的可用性和计算能力不足。在 2018 年，数据过剩，任何拥有
    `AWS` 账户和信用卡的人都可以访问分布式超级计算机。由于数据和计算能力的全新可用性，`Machine learning` 尤其是 `deep learning`
    席卷了 AI 世界。


    你应该知道 `machine learning` 还有其他类别，例如无监督学习和强化学习，你将学习 `machine learning` 的一个子集，称为监督学习。`Supervised
    learning` 算法通过反复强迫机器猜测来工作。具体来说，我们（人类）希望他对我们已知正确答案的数据做出预测。这被称为 much tagged data
    etiket - 标签是我们希望机器预测的一切。


    这里有一个例子：假设我们想设置一个算法来预测某人是否可以延长他们的抵押贷款。我们需要一组不违约抵押贷款的人。我们将收到这些人的数据；将它们输入 `machine
    learning` 算法；让他猜测每个人，一旦预测，我们就告诉机器实际答案是什么。真或假，`machine learning` 算法已经改变了它如何改变预测。我们重复这个过程很多次，通过数学的奇迹，我们机器的预测变得更好。虽然估计相对缓慢，但我们需要大量数据来训练这些算法。


    诸如 `linear regression`、`support vector machines` 和 `decision trees` 之类的 `Machine
    learning` 算法以不同的方式“学习”，但都应用相同的过程：做出预测，得到纠正，并调整基于预测的预测机制。在更高层面上，这就像一个人学习的方式。


    回想一下，`deep learning` 是 `machine learning` 的一个子单元，专注于一种特定类别的 `machine learning`
    算法，称为 `neural networks`。`Neural networks` 主要受人类大脑工作原理的启发——单个“神经元”从其他神经元接收“信号”，进而向其他“神经元”发送
    ”signals diğer to other“ 信号”。每个神经元以某种方式转换传入的“信号”，最终产生输出信号。如果一切顺利，这个信号代表准确的预测！


    这是一个有用的心理模型，但计算机不是生物大脑。神经元缺乏突触或其他处理大脑的生物机制。随着生物模型的破坏，研究人员和科学家使用图论来模拟人工 `neural
    networks`，而不是将 `neural networks` 识别为“人工大脑”，而是将其识别为具有强大功能的复杂图。


    从图论的角度来看，`neural network` 是一系列连接节点的层；每个节点代表一个“神经元 ve，每个连接代表一个“突触”。不同类型的网络具有不同的连接。


    `deep learning` 的最简单方法是深度 `neural network`。深度 `neural network` 是一个图，包括一系列全连接层。给定层上的每个节点都与下一层上的每个节点都有边；这些边中的每一条都被分配了不同的权重。整个层序列是“大脑。如果所有这些边上的权重设置正确。`Deep
    Learning` 研究将是关于如何创建这些图的各种版本；调整链接权重直到系统运行，并确保我们的机器认为我们做到了。


    使 `Deep Learning` 成为可能的机制如 `gradient descent` 和 `backpropagation` 结合了来自不同数学学科的许多思想。要理解，`neural
    networks` 需要一些数学背景。


    ## 背景信息 - 一点点什么


    当你想到使用 `PyTorch` 和 `TensorFlow` 等库有多容易时，你不需要很多数学。“但在完成两门课程所需的阅读后，我只是很高兴我有我的数学经验。`linear
    algebra`、数学、概率、统计和图论主题的子集已经出现。在大学获得这些信息大约需要五门课程。数学 1、2 和 3；线性代数；和计算机科学 101。


    幸运的是，你不需要所有这些领域。根据我迄今为止所见，如果你想自己进入 `neural networks`，我建议：从 `linear algebra` 开始，你需要知道并通过点积，`matrix
    product`（特别是乘以不同维度的矩阵的规则）。你不必快速手工完成这些事情，但你应该足够舒适，可以在白板或纸上做小样本。你也应该感到满意地处理“多维字段
    - - `deep learning` 使用许多维度的向量。


