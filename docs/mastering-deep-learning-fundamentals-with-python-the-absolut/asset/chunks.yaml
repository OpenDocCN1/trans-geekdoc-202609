- raw: 'FUNDAMENTALS OF NEURAL NETWORKS AND DEEP LEARNING Neural networks are the
    subsequent big thing when it comes to heavy calculations and smart algorithms.
    This is how they work and why they are so amazing. If you continue with technical
    news, you''ve probably encountered the concept of neural networks (also called
    neural networks). In 2016, Google''s AlphaGo neural network hit one of the best
    professional Go players in the world in a 4-1 series. YouTube also announced that
    they would use neural networks to better understand their video clips. YouTube
    will use neural networks to truly understand video clips. YouTube will use neural
    networks to truly understand videos. Searching on YouTube can be frustrating,
    as YouTube does not see the video the same way a person does. Recently, Google
    adds a patent that can change it. Dozens of other stories can be remembered. But
    what specifically is a neural network? Whence does it work? And why is it so common
    in machine learning? A computer like a brain Modern neuroscientists often discuss
    the brain as a type of computer. Neural networks endeavour to do the opposite:
    build a computer that functions like a brain . Of course, we only have a brief
    understanding of the brain''s extremely complex functions, but by creating a simplified
    simulation of how the brain processes data, we can build a type of computer that
    works very differently than a regular one. Computer processors concoct data serially
    ("in order"). They perform many procedures on a set of data, one at a time. Parallel
    processing ("multi-stream processing at once") significantly reduces the computer
    by using multiple processors in series. An artificial neural network (so-called
    separating it from the actual neural networks in the brain) has a fundamentally
    different structure. It is much interconnected. This makes it possible to process
    data very quickly, learn from that data and update its internal structure to improve
    performance. However, the high interconnection level has some astonishing effects.
    For example, neural networks are very good for recognizing obscure patterns in
    the data. The ability to learn The ability of the neural network to learn is its
    greatest strength. With standard database architecture, a programmer must develop
    an algorithm that tells the computer what to do with incoming data to ensure that
    the computer outputs the correct answer . An input-output response may be as simple
    as "when the A key is pressed," A "appears on the screen" or as complex as complex
    statistics. Neural networks, on the other hand, do not need the same type of algorithms.
    By learning mechanisms they can essentially design their algorithms 4 Machine
    learning algorithms that shape your life 4 Machine learning algorithms that create
    your life You may not realize it, but machine learning is already around you,
    and it can exert a surprising degree of influence over your life. It is important
    to note that since neural networks are programs written on machines that use standard
    serial processing hardware, current technology still sets limits. Building a hardware
    variant of a neural network is another problem altogether. From Neurons to Nodes
    Now that we have laid the foundation for how neural networks work, we can start
    looking at some of the details. The basic construction of an artificial neural
    network looks like this: ![neural network architecture](image288.jpg)Each of the
    circles is named a "node", and it simulates a single neuron. To the left are inputs
    nodes, in the middle are hidden nodes, and to the right are output nodes. In very
    basic terms, the input connections accept input values, which may be a binary
    1 or 0, part of an RGB colour value, status of a chess piece or something else.
    These nodes serve the information flowing into the network. Each input button
    is linked to several hidden nodes (sometimes to each hidden node, sometimes to
    a subset). Input nodes take the information they are given and pass it on to the
    hidden layer. For example, an input button may send a signal ("fire" in neurology)
    if it receives a 1 and remains dormant if it receives a zero. Each hidden node
    has a threshold value: if all its summed inputs reach a certain value, it burns
    . From synapses to connections Each connection corresponding to an anatomical
    synapse is also given a specific weight, which allows the network to place more
    emphasis on the action of a specific node. Here''s an example: ![neural net weight](image298.jpg)As
    you can see, the weight of connection B is higher than that of terminals A, and
    C. Let us say that hidden node 4 will only fire if it has a total input of 2 or
    higher. This means that if 1 or 3 fires on their own, 4 will not be triggered,
    but 1 and 3 together would trigger the node. Node 2 can also trigger the node
    itself via connection B. Let''s take the weather as a practical example. Say that
    you design a simple neural network to determine whether there should be a winter
    storm warning. Using the above connections and weights, node 4 can only shoot
    if the temperature is below 0 F and winds over 30 MPH, or it would fire if there
    is more than 70 per  cent chance of snow. The temperature would be fed into node
    1, winds to node 3 and probability of snow in node 2. Now node 4 can take into
    account all these when determining which signal to send to the output layer. Better
    than simple logic Of course, this function can easily be issued with simple and
    logical gates. But more complex neural networks, such as the one below, can do
    much more complex operations. ![neural network example](image308.jpg)Output nodes
    work in the same way as hidden layers: output nodes sum the input from the hidden
    layer, and if they reach a certain value, output the output nodes and send specific
    signals. At the end of the process, the output layer sends a set of signals indicating
    the result of the input. While the network shown above is simple, deep neural
    networks can have many hidden layers and hundreds of nodes. ![deep neural network](image314.jpg)Picture
    credit: Neural networks and deep learning by Michael A. Nielsen Error correction
    The process so far is relatively simple. But where neural networks shine is learning.
    Most neural networks use a process called back propagation, which sends signals
    back through the network. Before programmers distribute a neural network, they
    run it through a training phase where it receives a set of inputs with known results.
    For example, a programmer can teach a neural network to recognize images Use your
    smartphone to identify something with CamFind Use your smartphone to identify
    something with CamFind This app can identify almost any object you throw at it.
    It''s not just cool, but it also has a lot of practical uses. The input can be
    a picture of a car, and the correct effect would be the word "car". The programmer
    gives the image as input and sees what comes out of the output node. If the network
    responds  with "aircraft", the programmer tells you that it is incorrect. The
    network then does adjustments to its connections, which changes the weights of
    different links between nodes. This action is controlled by a specific learning
    algorithm that is added to the network. The network extends to adjust connection
    weights until it provides the correct output. This is a simplification, but neural
    networks can learn very complex operations using similar principles. Continued
    improvement Even after training, backpropagation continues and this is where neural
    networks become cool. They continue to learn as they are used, integrate new information
    and make tweaks to the importance of different connections, become more and more
    efficient and effective in the task they were intended for. This can be as easy
    as image recognition or as complicated as playing Go. In this way, neural networks
    always change and improve. And this can have surprising effects, resulting in
    networks that prioritize things that a programmer would not have prioritized .
    In addition to the process described above, which is called supervised learning,
    there is also another method: unattended learning. In this situation, neural networks
    take input and try to recreate it precisely in their production, using backpropagation
    to update their connections. It may sound like a fruitless exercise, but this
    way, networks learn to extract useful features and generalize these features to
    improve their models. Deep Trouble Back propagation is a very productive way to
    teach neural networks... when they are just a few layers deep. As the number of
    hidden layers raises, the efficiency of back propagation decreases. This is a
    problem for deep networks. With back propagation, they are often no more effective
    than simple networks. Researchers have evolved up with several solutions to this
    problem, the specifics of which are quite complex and beyond the scope of this
    introductory part. Which many of these solutions are trying to do, is easy to
    reduce the network''s complexity by training it to "compress" the data. ![neural
    net pruning](image335.jpg)To do this, the network studies to extract a smaller
    number of identifying functions in the input, eventually becoming more efficient
    in its calculations. The network makes generalizations and abstractions, much
    like people learn. After this learning, the network can cut nodes and connections
    that it considers being less critical. This makes the network extra effective,
    and learning becomes more comfortable. Neural Network Applications So neural networks
    simulate how the brain learns by using multiple layer nodes - input, hidden and
    output and they can learn both in supervised and unanswered situations. Complex
    networks can make abstractions and generalize, make them more productive and better
    able to learn. What can we use these systems for ? In theory, we can practice
    neural networks for almost anything. And you have certainly used them without
    understanding it. They are very common in speech and visual recognition, for example,
    because they can learn to select specific characteristics that sounds or images
