    # Nonlinear activation function


    Proportionality situations are usually special cases. The nonlinear functions
    make it possible to separate the nonlinearly separable data. They are the most
    used activation functions. A non-linear equation governs the correspondence between
    the inputs and the output. ![](image717.jpg)


    The use of nonlinear activation functions is simply essential for the simple reason
    that linear functions only work with a single layer of the neuron. Because beyond
    a layer of neurons, the recurrent application of the same linear activation function
    will no longer have any impact on the result. In other words, to solve complex
    problems, the use of nonlinear functions is mandatory. Let''s see this with examples:


    Look at the picture below; we have two types of data represented in blue and orange.
    The goal is to separate them; the use of a linear activation function is enough.
    The red line represents the decision boundary resulting from the activation function.
    The decision boundary results from the logistic regression performed by the function,
    i.e. the classification of the data. In this case, the data are well separated,
    and we thus reach a success rate of 100% from a simple linear function. ![](image723.jpg)


    Let''s continue with another situation, we always have two types of data, but
    this time classified differently. Since logistic regression is linear, it is impossible
    to place the decision boundary in such a way as to perfectly separate the data
    represented in blue from those in orange. The success rate when classifying the
    data is only about 50% (image below). We are here in a case yet very simple, the
    two types of data are easily distinguished, but a linear activation function cannot
    suffice. ![](image728.jpg)


    Thus, to properly separate these data, one will need a nonlinear activation function
    exerting a further logistic regression. The image below represents the same situation
    as the previous one, but this time we used a nonlinear activation function. Our
    two types of data are now perfectly separated (image below). ![](image733.jpg)


    Another critical point is that data processed by neurons can reach surprisingly
    large values. The use of a linear function, which does not modify the output,
    the values of the data transmitted from neurons to neurons can become larger and
    more computationally complex. To remedy this, non-linear activation functions
    reduce the output value of a neuron most often in the form of a simple probability.


    ## Types of nonlinear activation functions


    ### Sigmoid


    The primary purpose of the function is to reduce the input value to reduce it
    from 0 to 1. In addition to expressing the value as a probability, if the input
    value is a very large positive number, the function will convert that value. Value
    in a probability of 1. Conversely, if the input value is a very large negative
    number, the function will convert this value to a probability of 0. On the other
    hand, the equation of the curve is such that only small values affect the variation
    of output values. The image below represents the sigmoid function: ![](image742.jpg)


    The Sigmoid function has several defaults:

    It is not centred on zero, that is to say, that negative inputs can generate positive
    outputs. Being rather flat, it has a rather weak influence on the neurons compared
    to other activations functions. The result is often very close to 0 or 1, causing
    the saturation of some neurons. It is expensive in terms of calculation because
    it includes the exponential function.


    ### tanh


    The Tanh function is also called "hyperbolic tangent". ![](image752.jpg)


    This function is comparable to the Sigmoid function. The difference with the Sigmoid
    function is that the Tanh function produces a result between -1 and 1. The Tanh
    function is in general preferable to the Sigmoid function because it is centred
    on zero. Large negative inputs tend to -1 and large positive inputs tend to 1.
    Apart from this advantage, the Tanh function has the same other disadvantages
    as the Sigmoid function.


    ### Relu


    To solve the difficulty of saturation of the two preceding functions (Sigmoid
    and Tanh), there exists the function ReLU (Unit of Linear Correction). This function
    is the most used. ![](image759.jpg)


    The function ReLU is interpreted by the formula: `f(x) = max(0, x)`. If the input
    is invalidating, the output is 0, and if it is negative, then the output is x.
    This activation function greatly increases network convergence and does not saturate.
    But the ReLU function is not perfect. If the input value is negative, the neuron
    remains inactive, so the weights are not updated, and the network does not learn.


    ### Leaky ReLU


    ![](image766.jpg)


    The Leaky ReLU function is interpreted by the formula: `f(x) = max(0.1x, x)`.
    The Leaky Relu function tries to correct the ReLU function when the input is negative.
    The concept of Leaky ReLU is when the input is negative; it will have a small
    positive slope of 0.1. This function somewhat eliminates the problem of reLU function
    inactivity for negative values, but the results obtained with it are not consistent.
    It still retains the characteristics of a ReLU activation function, that is to
    say computationally efficient, it converges much more quickly and does not saturate
    in the positive regions.


    ### Parametric ReLU


    The idea of ​​the Leaky ReLU function can be further expanded. Instead of multiplying
    x by a constant term, we can multiply it by a hyperparameter that seems to work
    better than the Leaky ReLU function. This extension to the Leaky ReLU function
    is known as parametric ReLU. The parametric ReLU function is interpreted by the
    formula: `f(x) = max(ax, x)` where `a` is a hyperparameter. This gives neurons
    the ability to choose which slope is best in the negative region. With this capability,
    the parametric ReLU function can become a classic ReLU function or a Leaky ReLU
    function. It will be most often preferable to use the function ReLU, its two other
    versions (Leaky ReLU and parametric ReLU) are experiments without real added value.


    Over the years, various functions have been used. In this section, only the main
    ones have been mentioned. At present, there is still a lot of research to be done
    to find an appropriate activation function that allows the neural network to learn
    more efficiently and quickly.

