    # DEEP LEARNING ACTIVATION FUNCTIONS


    Deep Learning and explains the interest of the activation function. Also, it shows
    the importance of choosing the activation function used to drive a neural network.


    First, before defining precisely what an activation function is, let''s talk about
    its origin to understand its role better. The "action potential inspired the activation
    function", an electrical phenomenon between two biological neurons.


    Let''s start with a little reminder of the SVT course on the composition of a
    biological neuron: A neuron has a cell body, an axon that allows it to send messages
    to other neurons and has dendrites that allow it to receive signals from other
    neurons.


    Now that you''re up to date, let''s explain what the action potential is: In the
    image below, the orange rectangle indicates the region where the two neurons communicate.
    The neuron receives signals from other neurons through the dendrites. The weight
    associated with a dendrite, called synaptic weight, is multiplied by the incoming
    signal. Dendrite signals are accumulated in the cell body, and if the resulting
    signal strength exceeds a certain threshold, the neuron transmits the message
    to the axon. Otherwise, the signal is killed by the neuron and does not spread
    further. The action potential is, therefore, the variation of the signal strength
    indicating whether the communication should be done or not. ![](image682.jpg)


    The activation function decides whether to transmit the signal. In this case,
    it is a simple function with only one parameter: the threshold. Now, when we learn
    something new, the threshold and the probability of connection (called synaptic
    weight) of some neurons change. This creates new connections between neurons,
    allowing the brain to learn new things.


    ## Artificial neurons


    Now let''s discuss how it all works with a network of artificial neurons: Incoming
    values in a neuron (`x1`, `x2`, `x3`, ..., `xn`) are multiplied with their weight
    (synaptic weight reference) associated with them (`w1`, `w2`, `w3`, ..., `wn`).
    We then sum these multiplications and finally add the bias (a reference to the
    threshold). The image below shows the calculation formula. ![](image693.jpg)


    The function `Z(x)` corresponds to the pre-activation, that is to say, the step
    preceding the activation. Then, the activation function intervenes. The result
    `z` of the pre-activation function `Z(x)` is interpreted by an activation function
    `A(z)` producing a result `y`. ![](image698.jpg)


    The purpose of the activation is to transform the signal to obtain an output value
    from complex transformations between the inputs. To do this, the activation function
    must be non-linear. It is this non-linearity that makes it possible to create
    such changes. We will see why.


    ## Non-linearity


    Let''s start by briefly seeing the difference between a linear and nonlinear activation
    function:


    ### Linear activation function


    It is a simple function of the form: `f(x) = ax` or `f(x) = x`. The input goes
    to the output without a big modification or any modification. We remain here in
    a situation of proportionality. ![](image707.jpg)

