    outperform neural network-based models from the 1970s to the traditional AI forms
    of 2010. These non-learning AI types include rule-based algorithms (consider an
    extremely complex array of if / else blocks); Intuitive based AIs such as A \*
    search; Constraint saturation algorithms such as Arc Consistency; tree search
    algorithms such as minimax (used by the famous Deep Blue chess AI); and more.
    Two things that prevented machine learning and especially deep learning were successful
    — availability of large data sets and no computational power. In 2018, there is
    a surplus of data, and anyone with an AWS account and credit card can access a
    distributed  supercomputer. Due to the new availability of data and computing
    power, Machine learning and especially deep learning has taken the AI ​​world
    by storm. You should know that there are other categories of machine learning
    such as unsupervised learning and reinforcement learning, you will learn about
    a subset of machine learning called supervised learning. Supervised learning algorithms
    work by forcing the machine to guess repeatedly. Specifically, we (people) want
