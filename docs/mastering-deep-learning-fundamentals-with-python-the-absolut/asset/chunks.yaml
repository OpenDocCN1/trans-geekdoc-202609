    ## PART I: FUNDAMENTALS OF DEEP LEARNING

    In recent years, the increasing number of software technologies shaped under three
    specialized topics such as artificial intelligence, machine learning and deep
    learning has led to an increasing interest in these three subjects. Even though
    the experts working in these fields have not yet reached consensus about these
    words, new concepts emerge every day about these three issues which are sometimes
    used interconnected and sometimes used in different meanings. Artificial intelligence,
    which directly enters the centre of our lives with advancing technology, machine
    learning that regulates the decision mechanism of computers, and deep learning
    examining the data analysis and algorithms underneath all of these, is progressing
    towards becoming a common future field of study for many disciplines. As it is
    an older term in general, these studies, which are referred to as artificial intelligence,
    directly affect the course of technology. We are now able to program devices with
    up to a certain level of processors with over 100 programming languages. These
    devices execute the commands they receive from us through their systems in the
    same period they receive from us. The biggest share in the advancement of technology
    is called the programmable feature, which has a flawless operation. However, no
    matter how much this talent develops, no matter how artificial intelligence enters
    into our lives, it is defeated every time against the human brain. For example,
    it can easily understand and solve structures consisting of repetitions, control
    groups or mathematical operations; the current technology remains inadequate in
    uncertain expressions that need logic. In this way, Deep Learning, which is essential
    to teach learning methods to this system, manifests itself. Starting from artificial
    intelligence learning, first of all, from data processing to algorithms and data
    sets to machine learning, image processing and analysis, which is called the highest
    point of artificial intelligence, and deep learning that includes all of these,
    is due to all these reasons and needs. In modern years it has become a popular
    topic.

