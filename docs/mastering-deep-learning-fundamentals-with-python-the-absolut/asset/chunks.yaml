    ### TruncationSelectionPolicy 示例


    ```python

    from azureml.train.hyperdrive import TruncationSelectionPolicy

    early_termination_policy = TruncationSelectionPolicy(evaluation_interval=1, truncation_percentage=20,
    delay_evaluation=5)

    ```


    In this instance, the early terminus policy is applied at each interval, beginning
    at evaluation interval 5. Execution will be terminated at interval 5 if its performance
    in this interval is at 20% of the lowest performance of all executions in interval
    5.


    ### Without termination directive


    If you want all training series to run to completion, set the directive to `None`.
    The effect will be not to apply any early termination directive.


    `Policy=None`


    ### Default policy


    If no directive is specified, the hyperparameter adjustment service will allow
    all training series to run until completed.


    ### Note


    If you are looking for a conservative policy that provides savings without completing
    promising jobs, you can use a Median Detention Directive with `evaluation_interval=1`
    and `delay_evaluation=5`. It is a conservative configuration that can provide
    savings of between 25% and 35% without loss of the main metric (according to our
    evaluation data).


    ### Resource allocation


    Control the resource budget for the hyperparameter adjustment experiment by specifying
    the maximum total number of training runs. Optionally, specify the maximum duration
    for the hyperparameter adjustment experiment.


    `max_total_runs`: maximum total number of training executions that will be created.
    Upper limit: for example, you can have fewer executions if the hyperparameter
    space is finite and has fewer samples. It must be a number between 1 and 1000.


    `max_duration_minutes`: maximum duration in minutes of the hyperparameter adjustment
    experiment. The parameter is optional and, if it exists, all series that might
    be running after this duration is automatically cancelled.


    **Note** If specified `max_total_runs` and `max_duration_minutes` the experiment
    hyperparameter adjustment ends when the first of these two thresholds are reached.


    Also, specify the maximum number of training series that will be executed at the
    same time during the hyperparameter adjustment search.


    `max_concurrent_runs`: maximum number of series that will be executed at the same
    time at a given time. If you do not specify any, the number of executions will
    start in parallel. If specified, the value must be a number between 1 and 100.


    **Note** The number of simultaneous executions is determined by the resources
    available in the specified process destination. Therefore, you must ensure that
    the process destination has the resources available for the desired simultaneity.


    Assign resources for the adjustment of hyperparameters:

    `max_total_runs=20`, `max_concurrent_runs=4`


    In this code, an adjustment experiment of hyperparameters is configured to use
    a maximum of 20 total executions, in such a way that 4 configurations are executed
    at the same time.


    ### Configuration of the experiment


    Configure the hyperparameter adjustment experiment using the hyperparameter search
    space defined, the early termination directives, the main metrics, and the allocation
