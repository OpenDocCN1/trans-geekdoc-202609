    ## PART I: FUNDAMENTALS OF DEEP LEARNING

    近年来，以人工智能、机器学习和深度学习这三个专业主题为基础塑造的软件技术数量不断增加，这导致了人们对这三个主题的兴趣日益增长。尽管在这些领域工作的专家尚未就这些词语达成共识，但关于这三个有时相互关联、有时含义不同的问题，每天都会出现新的概念。随着技术的进步，人工智能直接进入我们的生活中心，调节计算机决策机制的机器学习，以及研究所有这些之下的数据分析和算法的深度学习，正在朝着成为众多学科共同的未来研究领域发展。作为一个更古老的术语，通常所指的人工智能研究，直接影响着技术的发展方向。我们现在能够使用超过
    100 种编程语言为最高可达一定水平的处理器编程。这些设备在接收到我们指令的同时，通过其系统在同一时期执行我们发出的命令。技术进步中最大的份额被称为可编程特性，它具有无懈可击的操作。然而，无论这种才能如何发展，无论人工智能如何进入我们的生活，它每次都败给了人类大脑。例如，它可以轻松理解和解决由重复、控制组或数学运算构成的结构；当前技术在需要逻辑的不确定表达上仍然不足。在这种情况下，深度学习应运而生，它对于教导该系统学习方法至关重要。从人工智能学习开始，首先从数据处理到算法和数据集的机器学习，到被称为人工智能最高点的图像处理和分析，以及包含所有这些的深度学习，正是由于所有这些原因和需求。在现代，它已成为一个热门话题。


