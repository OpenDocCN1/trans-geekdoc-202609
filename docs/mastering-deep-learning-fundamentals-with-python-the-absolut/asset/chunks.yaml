    # Language Reference GUI and IDLE - 它是什么？


    GUI 是 Graphic User Interface 的缩写，是部分创建虚拟窗口、按钮、菜单等的程序。这允许用户通过点击等来调用与所述元素关联的函数，其目的可以是向文本框发送文本、检索文件或将其发送到外部存储设备（如硬盘）、绘制图形等等。GUI
    组件的代码可在 Python 的 `Tk` 库中见到。来自 `Tk` 库的窗口的代码可以通过基本窗口顶部的单词 `Tk` 来识别。


    ```

    >>> from Tkinter import Label

    >>> childAfLabel = Label ()

    ```


    由于如前所述，`Tk` 中存在 GUI 组件的基本模型，工匠 `Tkinter` 可以发出 `Tk`，声明必须提供基本窗口构造的代码以构建 `Label()`
    的副本，在本例中我选择将其命名为 `childrenAfLabel`，因为与其他孩子一样，它有其起源，从中它在母亲中继承，该术语也用于其他丹麦计算机语言书籍中。在英语中，母亲被称为父类
    parent。在 Python 中，也使用术语主类或基本类。


    ## Immediate mode


    从旧的 DOS 中，你可能知道提示符 `dose c:`。在 Python 中，`>>>` 用作相应的清晰消息。Python 处于 Immediate 或也称为交互模式的消息。从这里开始你的
    Python 编程，但当然，成熟的 Python 程序员也会返回并使用，例如。当测试新的程序片段时。


    ## Comments


    当你编程时，不时需要插入注释 - 程序的一部分，你和其他人可以阅读，但计算机语言会跳过。在 Python 中，`#`（井号 - 在丹麦语中称为花园门或牛排符号）标记。注释从花园门开始并延续程序行。


    Ex. 1:

    ```

    >>> # Python runs over comments

    >>> print "Comments are for you and not for the computer."

    ```

    Comments are for you and not for the computer.


    也可以打印井号，如果它是文本字符串的一部分。


    Ex. 2:

    ```

    >>> print "Here we print a hash sign #"

    ```

    Here we print a hash sign #


    在此示例中，没有注释。牛排符号在这里是文本字符串的一部分。Python 应该喜欢响应它而不是绕过它。请注意，井号在这里被打印出来，而在它发挥其正确作用的示例中则没有。


    注释在引号中 par 字符串也可以用 3 个引号（单引号或双引号）括起来。


    Ex. 1:

    ```

    >>> print """

    Name: The cliff island Bornholm

    Population: 44.500

    """

    ```

    Name: The cliff island Bornholm

    Population: 44,500


    ## Arithmetic operators


    加法 `+` ex: `3 + 4 = 12`

    减法 `-` ex: `3 - 4 = - 1`

    乘法 `*` ex: `3 * 4 = 12`

    指数表示 `**` ex: `3 ** 4 = 81`

    除法 `/` ex: `3/4 = 0`（向下舍入到最接近的整数）

    除法 `//` ex: `3 // 4 = 0`（向下舍入到最接近的整数）

    取模 `%` ex: `3.0 % 4.0 = 0.75`


    危险：注意整数除法

    ```

    >>> 25/24

    1

    ```

    25 除以 24 应该得到 1.0416666666666667，但 Python 自动向下下降到最接近的整数，在本例中为 1。

    ```

    >>> 25 / 24.0

    1.0416666666666667

    ```


    ## Variables


    变量是指向计算机内存（RAM）中多个地址的指针，其中数据，可能有多种东西，例如。数字和文本字符串被放置。


    变量声明

    ```

    >>> x = y = z = 0

    >>> x

    0

    >>> y

    0

    >>> z

    0

    ```

    注意：在 Python 中，使用 `==` 表示等于，使用 `=` 表示赋值。


    变量可以被覆盖

    ```

    >>> e = 1000 # global variable variable

    >>> def nix ():

    ... global e

    ... e = 25

    ...

    >>> e

    1000

    >>> nix()

    >>> e

    25

    ```


    变量地址

    ```

    >>> a = 25

    >>> type(a)

    <type ''int''>

    >>> a = 12.4

    >>> type(a)

    <type ''float''>

    ```


    变量在 RAM 中的地址可以用 `id` 找到

    ```

    >>> a = 12.4

    >>> id(a)

    13609595 6

    ```


    ## Boolean expressions / variables


    布尔表达式/变量可以取/赋 2 个值且仅 2 个。这 2 个值是 true（真）和 false（假）。


    Ex. 1:

    ```

    >>> 2 == 3

    0

    >>> 2 == 2

    1

    ```


    ## Write interactively


    在交互模式下，数字可以用 2 个不同的函数输入：`raw_input`，其中数字作为文本接收，以及 `input` 将数字作为数字接收。


    ## Scripts


    如果以及当你需要在 Python 中开发更大的项目时，你需要将你的 Python 代码保存为可以反复使用的单独文件。


    在 Linux 中，Python 脚本可以通过在程序的第一行插入 `#! / usr / bin / env python` 使其直接可执行。


    脚本可以通过以下命令分配可执行模式或权限：

    ```

    $ chmod + x myscript.py

    ```


    ## If, elif and else


    ```

    >>> def findMax(a, b, c):

    ... max = a

    ... if b> a:

    ... max = b

    ... if c> b:

    ... max = c

    ... return max

    ...

    >>> findMax(37, 2 * 19, 43)

    43

    ```


    ## Function definition and call


    ```

    >>> def function():

    ... a = 4 * 5

    ... return a

    ...

    >>> function()

    20

    ```


    带参数的函数：

    ```

    >>> def f(a):

    ... return a * 1.25

    ...

    >>> f(75)

    93.75

    ```


    ## Lists


    列表是零到多个相关空间的变量。其方括号知道列表。


    ```

    >>> list = []

    >>> list.append("Ypnasted")

    ```


    切片：

    ```

    >>> l = [1,2,3,3,4,5,6,7,8,9]

    >>> print l[0]

    1

    >>> print l[0:4]

    [1, 2, 3, 3]

    ```


    ## Tuples


    元组由逗号分隔的 anal 值组成。


    ```

    >>> t = 1,2,3,4,5

    >>> t

    (1, 2, 3, 4, 5)

    ```


    ## Dictionary


    ```

    >>> dictionary = {}

    >>> postal codes = {"Rønne": 3700, "Allinge": 3770}

    ```


    ## Escape sequences


    换行

    水平制表符

    回车


    ## Number system


    十六进制和八进制数


    在 Python 中，十六进制数以前导零后跟 `x` 指定，并以十六进制数字结尾，例如。`0x49` 对应于 `9 + 4 * 16 = 73` 在我们正常的
    10 进制系统中。


    ```

    >>> for i in range(0,9):

    ... print "10 i", i, ". is:", 10 ** i

    ...

    ```


    打印十六进制数：

    ```

    >>> for i in range(0,17):

    ... print hex(i)

    ...

    ```


    ```

    >>> a = 0x49

    >>> a

    73

    ```


    ```

    >>> "x41", chr(65)

    (''A'', ''A'')

    ```


    '
