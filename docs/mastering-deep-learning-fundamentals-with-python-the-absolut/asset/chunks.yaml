  fmt: '

    # BEST PRACTICES IN PYTHON AND ZEN OF PYTHON


    ## The Zen of Python


    The Zen of Python is a group of 19 principles that influence the design of the
    Python programming language, and are useful to understand and use the language.


    Written and published on Python''s mailing list in June 1999 by Tim Peters, Python''s
    Zen was later published as the Python Enhancement Proposal `PEP` number 20, and
    is also present on the Python official website, in English. It is also included
    as "Easter egg" in the Python interpreter distribution and appears when you type
    command `import this`.


    The initial message on the mailing list, like the subsequent publications, mention
    not 19, but 20 principles, "Including one (...) to be added by Guido", but this
    twentieth principle has never been published, and probably does not exist.


    The text also includes an implicit reference to Guido Van Rossum (... "unless
    you are Dutch").


    The text in English has been put in the public domain.


    ### Text


    A French translation has been released under a Creative Commons BY-NC-SA license
    in a Python programming course.


    Prefer : beauty to ugliness, the explicit to the implicit, the simple to the complex
    and complex to the complicated, the unrolled to the nested, airy to the compact.


    Take into account the readability.


    Special cases can never be enough to violate the rules.


    But, to purity, privilege the practical aspect.


    Do not pass the errors in silence, ... or gag them explicitly.


    In the face of ambiguity, to guess does not let you go.


    Know that there should be one and only one way of proceeding, even if, at first
    glance, it is not obvious, unless you are Dutch.


    Better now than ever.


    However, it is often better than immediately.


    If the implementation is difficult to explain, it''s a bad idea.


    If the implementation is easily explained, it may be a good idea.


    Namespaces! Holy good idea! Let''s do more stuff like that.

    '
  trans: '


    # Python 最佳实践与 Python 之禅


    ## Python 之禅


    Python 之禅是一组 19 条原则，影响了 Python 编程语言的设计，对于理解和使用该语言非常有用。


    Python 之禅由 Tim Peters 于 1999 年 6 月在 Python 邮件列表上撰写并发布，后来作为 Python 增强提案 `PEP` 编号
    20 发布，并在 Python 官方网站上以英文形式提供。它也被包含在 Python 解释器发行版的“彩蛋”中，当你输入命令 `import this` 时会出现。


    邮件列表上的初始信息以及后续的出版物中提到的是 20 条原则，而不是 19 条，“包括一条 (...) 由 Guido 添加”，但这条第二十条原则从未发布过，可能也不存在。


    文本中还隐含地提到了 Guido Van Rossum (... “除非你是荷兰人”)。


    英文文本已置于公有领域。


    ### 文本


    一份法语翻译已在 Python 编程课程中以知识共享署名-非商业性使用-相同方式共享许可发布。


    偏好：美胜于丑，显式胜于隐式，简单胜于复杂，复杂胜于繁琐，展开胜于嵌套，通透胜于紧凑。


    考虑可读性。


    特殊情况永远不足以违反规则。


    但是，为了纯粹性，优先考虑实用性。


    不要默默传递错误，... 或明确地将其噤声。


    面对模糊性，猜测并不能让你解脱。


    要知道应该有且仅有一种进行的方式，即使乍一看并不明显，除非你是荷兰人。


    现在比以往更好。


    然而，它通常比立即更好。


    如果实现难以解释，那就是一个坏主意。


    如果实现很容易解释，那可能是一个好主意。


    命名空间！好主意！让我们多做些类似的事情。


    '
