    # PYTHON 数据结构


    在编程中，''数据结构''是一种组织数据的结构。数据结构的选择很重要，因为它们对性能有不同的意义，并且根据计划使用的算法而表现不同。数据结构是一种抽象描述，与“数据类型”不同。数据类型可能是例如
    `Integer`、`String` 或 `boolean`。它具有明确的意义，而数据结构描述的是未定义的东西，例如列表或数组。


    在不同的类别中有许多不同的数据结构。我们有“线性数据结构” (`List`, `Stack`, `Queue`, 等)。另一个在编程中占有重要地位的结构类别是
    "`Tree`" 。它们比例如 `Stack` 稍微复杂一些。许多数据结构已经内置于编程语言中（例如 `Python` 中的 `list`），并且一些现成的模块和库已实现并准备好该结构。尽管如此，了解它们“内部”是如何工作的仍然很重要。有三种不同的数据结构。


    * `Stack` (Linear Data Structure)

    * `Queue` (Linear Data Structure)

    * `Linked List` (Linear Data Structure)


    '
