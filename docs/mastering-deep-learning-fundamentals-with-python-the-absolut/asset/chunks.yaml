    # 机器学习基础


    计算机科学在近年发生了很大变化。现在人工智能的概念被频繁使用。人工智能是让机器从环境、错误和人身上学习的一种努力。虽然该领域有很多不同的分支（模式识别、人工神经网络、强化学习、统计推断、概率机器学习、监督-无监督学习），但我们仍然不知道正确的方法。哪种技术会引领我们走向更美好的世界？可能没有单一的技术能解决所有问题。利用不同技术和组合来生产智能系统的方式也取决于通用技术的发展。没几年前的电脑速度并不快。也许未来我们也可以这样说。将特定问题分散到大量机器上（区块链）是一个非常重要的方法。这样研究就加速了。20-30
    年前被认为梦想的事情，如今已是生活的常态。例子：`ABS`（防抱死制动），飞机的自动驾驶，Google 搜索建议，地图，电子邮件垃圾邮件检测。预测长期未来是非常具有挑战性的。没有人能做到。


