    \ a Queue:\n```python\n>>> from queue import Queue\n>>> myList = Queue()\n>>>\
    \ myList.is_empty()\nTrue\n>>> myList.enqueue(\"Tiger\")\n>>> myList.enqueue(\"\
    Lion\")\n>>> myList.enqueue(\"Moose\")\n>>> myList.is_empty()\nFalse\n>>> myList.dequeue()\n\
    'Tiger'\n>>> myList.peek()\n'Lion'\n>>> myList.enqueue(\"Godzilla\")\n>>> myList.dequeue()\n\
    'Lion'\n```\n\nVisuAlgo Stack Linked list\n\nFor both Queue and Stack, we have\
    \ used Python's built-in List: a to store values, so so far we have only made\
    \ a special version of Python's List. The idea is that we should not need List\
    \ without having to build the entire data structure ourselves. To succeed, we\
    \ will use nodes and will build our own linked list. Queue and Stack are also\
    \ just a special version of the linked list.\n\nWe can imagine a regular List\
    \ / Array as the picture below. The array is stored in memory as a bit, and in\
    \ that bit, the values ​​are arranged one after the other. Then we do not need\
    \ to know where each value is but just the array.\n\n![Array in memory](image2155.jpg)\n\
    Array in memory\n\nFor a linked list of nodes, we cannot assume that the values\
    \ ​​are adjacent to each other, but they are allocated to different places in\
    \ the memory. Therefore, each value in the linked list must be linked to the next\
    \ value. We use a Node class for that.\n\n![Linked list of nodes](image2162.jpg)\n\
    A linked list of nodes\n\nThe simplest version of a Node class contains only two\
    \ attributes, one for holding data and one for keeping track of the next node.\
    \ We call the first node in a non-empty list the head, the head of the list. To\
    \ access the nodes in a linked list, there must be a reference to the head. From\
    \ the head, we can access the remaining nodes by following the pointers in the\
    \ nodes. The next node's next attribute contains `None` to show that it's the\
    \ last node.\n\nThe list in the picture is called a single-linked list. There\
    \ are also double-linked lists; then each node is linked to the node before and\
    \ after. Another common type is the Circular linked list. In a Circular linked\
    \ list, the last node is linked to the first.\n\n![Circular Single Link List](image2169.jpg)\n\
    Circular Single Link List\n\nThen there is of course also Circular double-linked\
    \ list, and they can be sorted or unsorted. A sorted list automatically sorts\
    \ the list. When adding new data to the list, the entire list is searched to find\
    \ the right place in the order. An unsorted list adds only to the value, usually\
    \ the last in the list.\n\nVisuAlgo Stack Nod class\n\nThen we should look at\
    \ how the code can look for the node class. Very little code is needed as we only\
    \ need an attribute for data and one for the next node.\n\n```python\nclass Node:\n\
    \    \"\"\" Node class \"\"\"\n    def __init__(self, data, next = None):\n  \
    \      \"\"\" Initialize object with the data and set next to None. next will\
    \ be assigned later when new data needs to be added. \"\"\"\n        self.data\
    \ = data\n        self.next = next\n```\n\nWe test using it in the python3 interpreter.\n\
    ```python\n>>> head = node(1)\n>>> head\n<__main__.Node object at 0x743545132>\n\
    >>> head.data\n1\n```\n\nWe have created a Node object and tested it and its data.\
    \ Now we are going to create one more object and connect ours head with the new\
    \ one.\n```python\n>>> n2 = node(32)\n>>> n2.data\n32\n>>> head.next\n>>> head.next\
    \ = n2\n>>> head.next\n<__main__.Node object at 0x7453468745>\n# Value of the\
    \ first node\n>>> head.data\n1\n# Second value of the node\n>>> head.next.data\n\
    32\n```\n\nWhen we print the `head.next` first time we get no output for the value\
    \ is None. After we assigned \"head.next\", \"head.next\" contains our \"n2\"\
    \ object. Then we can write `head.next.data` to access the data, 32 in the \"\
    n2\" object.\n\nTest yourself to create one to the node, `n3` and assign to `n2.next`.\
    \ Print the \"n3's\" value via `head.next.next.data` and `n2.next.data`.\n\nIn\
    \ this way, we can build a linked list.\n\n### Traverse nodes\nStarting at a list's\
    \ head and going through all the nodes and doing something with them is called\
    \ traversing a list. E.g. we need to traverse a list if we want to print out all\
    \ nodes values. We do this most easily by creating a new variable that is used\
    \ to point to the list's head and use it to traverse the list.\n\n```python\n\
    number_list = Node(3) # Create first node, head\ntemp = Node(2) # Create node\
    \ and assign to temp variable\ntemp.next = Node(4) # Create node and assign to\
    \ temp.next\nnumber_list.next = temp # Assign temp to number_list.next\n```\n\n\
    Above, we create a simple list `number_list` that contains `[3, 2, 4]`. To print\
    \ all values ​​we use a while loop.\n\n```python\ncurrent_node = number_list\n\
    while current_node != None:\n    print(current_node.data) # Print nodes value\n\
    \    current_node = current_node.next # Move to next node\n```\n\nIn the loop\
    \ we replace the pointer, `current_node` with the next node and in this way we\
    \ traverse the list without changing it. `number_list` still contains the same\
    \ structure.\n\n### Get value with index\nNow we are going to get a value at with\
    \ an index.\n\n```python\ndef get(index, head):\n    # Get value by index\n  \
    \  if head is None:\n        current_node = head\n        counter = 0\n      \
    \  pass\n    else:\n        pass\n    # Raise exception of index out of binding\n\
    ```\n\nWe start by checking that the first node is None, that is, the list is\
    \ empty. Then we create the variable `current_node` that we will use when we traverse\
    \ to keep the node we are on. `counter` is used for counting which index we are\
    \ on. If the list is then empty, `head == None` know that whatever index is, it\
    \ will be out-of-bound and will then lift an exception.\n\nNow we add the loop\
    \ that goes through the list.\n\n```python\ndef get(index, head):\n    # Get value\
    \ by index\n    if head is not None:\n        current_node = head\n        counter\
    \ = 0\n        while current_node.next is not None and counter < index:\n    \
    \        current_node = current_node.next\n            counter += 1\n    else:\n\
    \        pass\n    # raise exception for index out of bound\n```\n\nWe have a\
    \ \"while\" loop running as long as there is a next node, that is, `head.next`\
    \ not None, and our counter is under index. `index` should contain which index\
    \ we want to get the value from. If \"next\" is not \"None\", we change `current_node`\
    \ to the next node and increase the counter by one. In other words, the loop continues\
    \ either until the list is over or counter == index.\n\n```python\ndef get(index,\
    \ head):\n    # Get value by index\n    if head is not None:\n        current_node\
    \ = head\n        counter = 0\n        while current_node.next is not None and\
    \ counter < index:\n            current_node = current_node.next\n           \
    \ counter += 1\n        if counter == index:\n            return current_node.data\n\
    \        else:\n            # Raise exception for index out of bound\n       \
    \     raise IndexError()\n    else:\n        # Raise exception for index out of\
    \ bound\n        raise IndexError()\n```\n\nAfter our while loop we need to check\
    \ if it ran out for the index to be too high or if we have found the index. If\
    \ we are on the index we print the value otherwise we will lift an index-out-of-bounds\
    \ error. This is a way to write the code to look through a list for an index;\
    \ there are at least 20 other ways to write it. Try to find other ways to write\
    \ it.\n\nWe also test the function.\n\n```python\nnumber_list = Node(1)\nnumber_list.next\
    \ = Node(2, Node(3, Node(4)))\nprint(get(0, number_list)) # 1\nprint(get(3, number_list))\
    \ # 4\nprint(get(5, number_list)) # IndexError\n```\n\nNow we have code to download\
    \ from a linked list and also seen how we can connect several nodes. How do we\
    \ remove a node from the list?\n\n### Remove node\nTo remove a node, we need to\
    \ use two variables when we cross the list. We need `current_node` and `previous`,\
    \ `current_node` is used to traverse the node to be deleted. `previous` should\
    \ always point to the previous node, the node before `current_node`. When we have\
    \ found the right node, we switch the node in `previous` that it points to the\
    \ node after `current_node`. Finally, we delete the node we want to remove `del\
    \ temp`.\n\n![Find the right nodes](image2279.jpg)\nFind the right nodes\n\nStep\
    \ 1, traverse the nodes so `current_node` point to the one to be deleted and `previous`\
    \ point to the previous node.\n\n![Linking previous.next to current_node.next](image2284.jpg)\n\
    Linking previous.next to current_node.next\n\nStep 2, assign `current_node.next`\
    \ to `previous.next`.\n\n![Delete current_node](image2290.jpg)\nDelete current_node\n\
    \nStep 3, delete `current_node`.\n\n### Add node\nWhen we are joining a node,\
    \ it is crucial which order we do things; otherwise, we can lose all nodes that\
    \ should be after the new one we add. In the picture below, we start from the\
    \ list `[1, 2, 4]` and we want to insert a new node, with the number 5 as value,\
    \ between 2 and 4. The list should look like `[1, 2, 5, 4]` it is ready.\n\n![Find\
    \ the right node and create new](image2297.jpg)\nFind the right node and create\
    \ new\n\nStep 1, traverse the nodes so `current_node` point to the node that should\
    \ be before the new one. Insert new_node.next to current_node.next\n\nStep 2,\
    \ assign `current_node.next` to `new_node.next`. So both point to the same node.\n\
    \n![Insert current_node.next to new_node.](image2305.jpg)\nInsert current_node.next\
    \ to new_node.\n\nAssign `new_node` to `current_node`. Next we have a complete\
    \ list again. If we do this in this order, we need not worry about losing any\
    \ nodes. Think about what had happened if we had skipped step 2 and instead directly\
    \ assigned the new node to `current_node.next`.\n\nAs mentioned, there are many\
    \ types of data structures. For a list, you can look at List of data structures.\
    \ Here we have raised three of the most common ones. Hope you have got a little\
    \ insight into how they work.\n"
  trans: "\n\n# 先决条件\n你可以在 Python 和面向对象方面学习基础知识。你已经完成了异常练习。\n\n## 栈\n栈是一种长数据结构，就像它听起来一样，像一个栈或堆栈。想象一个盘子堆，其中一个盘子代表一个对象、变量或你存储的任何东西。为了处理“存取”操作，你从顶部开始工作。该方法称为“LIFO”（后进先出）。栈包含相同的数据类型。\n\
    \n通常使用一组特定的方法：\n1. `.push()`（添加）\n2. `.pop()`（删除）\n3. `.peek()`（显示顶部内容而不改变栈）\n\
    4. `.is_empty()`（根据栈是否为空返回 True / False）\n5. `.size()`（返回栈中元素的数量）\n\n一个具有指定座位数目的栈。栈的实现可以如下所示：\n\
    \n```python\nclass Stack:\n    def __init__(self):\n        self.items = []\n\
    \    def is_empty(self):\n        return self.items == []\n    def push(self,\
    \ item):\n        self.items.append(item)\n    def pop(self):\n        try:\n\
    \            return self.items.pop()\n        except IndexError:\n           \
    \ return \"Empty list.\"\n    def peek(self):\n        return self.items[len(self.items)\
    \ - 1]\n    def size(self):\n        return len(self.items)\n```\n\n使用栈可以如下进行：\n\
    ```python\nmyList.pop()\n'Empty list.'\n>>> myList.size()\n0\n```\n\nVisuAlgo\
    \ Stack Queue\n\n## 队列\n队列是一种线性数据结构，让人联想到栈。不同之处在于队列两端都是开放的。一端用于添加元素，另一端用于移除元素。该方法称为“先进先出”。\n\
    \n通常使用的方法有：\n1. `.enqueue()`（添加）\n2. `.dequeue()`（删除）\n3. `.peek()`（显示顶部内容而不改变队列）\n\
    4. `.is_empty()`（根据队列是否为空返回 True / False）\n5. `.size()`（返回队列中元素的数量）\n\n一个没有指定位置数量的队列。队列的实现可能如下所示：\n\
    \n```python\nclass Queue:\n    def __init__(self):\n        self.items = []\n\
    \    def is_empty(self):\n        return self.items == []\n    def enqueue(self,\
    \ item):\n        self.items.insert(0, item)\n    def dequeue(self):\n       \
    \ try:\n            return self.items.pop()\n        except IndexError:\n    \
    \        return \"Empty list.\"\n    def peek(self):\n        return self.items[len(self.items)\
    \ - 1]\n    def size(self):\n        return len(self.items)\n```\n\n使用队列：\n```python\n\
    >>> from queue import Queue\n>>> myList = Queue()\n>>> myList.is_empty()\nTrue\n\
    >>> myList.enqueue(\"Tiger\")\n>>> myList.enqueue(\"Lion\")\n>>> myList.enqueue(\"\
    Moose\")\n>>> myList.is_empty()\nFalse\n>>> myList.dequeue()\n'Tiger'\n>>> myList.peek()\n\
    'Lion'\n>>> myList.enqueue(\"Godzilla\")\n>>> myList.dequeue()\n'Lion'\n```\n\n\
    VisuAlgo Stack Linked list\n\n对于队列和栈，我们都使用了 Python 内置的列表：用于存储值，因此到目前为止我们只制作了 Python\
    \ 列表的特殊版本。想法是我们不应该在不自己构建整个数据结构的情况下使用列表。为了成功，我们将使用节点并构建自己的链表。队列和栈也只是链表的特殊版本。\n\n\
    我们可以把一个常规的列表 / 数组想象成下面的图片。数组在内存中以位的形式存储，在该位中，值一个接一个地排列。然后我们不需要知道每个值的位置，只需要知道数组即可。\n\
    \n![Array in memory](img/image2155.jpg)\nArray in memory\n\n对于节点链表，我们不能假设值彼此相邻，而是分配到内存中的不同位置。因此，链表中的每个值都必须链接到下一个值。我们为此使用\
    \ Node 类。\n\n![Linked list of nodes](img/image2162.jpg)\nA linked list of nodes\n\
    \n最简单的 Node 类版本只包含两个属性，一个用于保存数据，一个用于跟踪下一个节点。我们将非空列表中的第一个节点称为头，列表的头部。要访问链表中的节点，必须有一个对头的引用。从头开始，我们可以通过跟随节点中的指针来访问剩余的节点。下一个节点的\
    \ next 属性包含 `None` 以表明它是最后一个节点。\n\n图片中的列表称为单向链表。还有双向链表；然后每个节点都链接到前一个节点和后一个节点。另一种常见类型是循环链表。在循环链表中，最后一个节点链接到第一个。\n\
    \n![Circular Single Link List](img/image2169.jpg)\nCircular Single Link List\n\
    \n然后当然还有循环双向链表，它们可以是有序的或无序的。有序列表会自动对列表进行排序。向列表添加新数据时，会搜索整个列表以找到正确的顺序位置。无序列表只添加到值，通常是列表的最后一个。\n\
    \nVisuAlgo Stack Nod class\n\n然后我们应该看看节点类的代码可能是什么样子。需要的代码很少，因为我们只需要一个用于数据，一个用于下一个节点的属性。\n\
    \n```python\nclass Node:\n    \"\"\" Node class \"\"\"\n    def __init__(self,\
    \ data, next = None):\n        \"\"\" Initialize object with the data and set\
    \ next to None. next will be assigned later when new data needs to be added. \"\
    \"\"\n        self.data = data\n        self.next = next\n```\n\n我们在 python3 解释器中使用它进行测试。\n\
    ```python\n>>> head = node(1)\n>>> head\n<__main__.Node object at 0x743545132>\n\
    >>> head.data\n1\n```\n\n我们创建了一个 Node 对象并对其及其数据进行了测试。现在我们将再创建一个对象并将我们的 head 与新对象连接起来。\n\
    ```python\n>>> n2 = node(32)\n>>> n2.data\n32\n>>> head.next\n>>> head.next =\
    \ n2\n>>> head.next\n<__main__.Node object at 0x7453468745>\n# Value of the first\
    \ node\n>>> head.data\n1\n# Second value of the node\n>>> head.next.data\n32\n\
    ```\n\n当我们第一次打印 `head.next` 时，我们没有输出，因为值是 None。在我们分配 \"head.next\" 之后，\"head.next\"\
    \ 包含我们的 \"n2\" 对象。然后我们可以写 `head.next.data` 来访问数据，\"n2\" 对象中的 32。\n\n自己测试创建到节点的\
    \ `n3` 并分配给 `n2.next`。通过 `head.next.next.data` 和 `n2.next.data` 打印 \"n3\" 的值。\n\
    \n以这种方式，我们可以构建一个链表。\n\n### 遍历节点\n从列表的头开始遍历所有节点并对其执行某些操作称为遍历列表。例如，如果我们想打印出所有节点的值，我们就需要遍历列表。我们最容易通过创建一个新变量来做到这一点，该变量用于指向列表的头并用它来遍历列表。\n\
    \n```python\nnumber_list = Node(3) # Create first node, head\ntemp = Node(2) #\
    \ Create node and assign to temp variable\ntemp.next = Node(4) # Create node and\
    \ assign to temp.next\nnumber_list.next = temp # Assign temp to number_list.next\n\
    ```\n\n上面，我们创建了一个简单的列表 `number_list`，它包含 `[3, 2, 4]`。要打印所有值，我们使用 while 循环。\n\n\
    ```python\ncurrent_node = number_list\nwhile current_node != None:\n    print(current_node.data)\
    \ # Print nodes value\n    current_node = current_node.next # Move to next node\n\
    ```\n\n在循环中，我们用下一个节点替换指针 `current_node`，以这种方式遍历列表而不改变它。`number_list` 仍然包含相同的结构。\n\
    \n### 使用索引获取值\n现在我们将使用索引获取一个值。\n\n```python\ndef get(index, head):\n    # Get\
    \ value by index\n    if head is None:\n        current_node = head\n        counter\
    \ = 0\n        pass\n    else:\n        pass\n    # Raise exception of index out\
    \ of binding\n```\n\n我们首先检查第一个节点是否为 None，即列表为空。然后我们创建变量 `current_node`，我们在遍历时将使用它来保持我们所在的节点。`counter`\
    \ 用于计数我们所在的索引。如果列表为空，`head == None`，则知道无论索引是什么，它都会越界并会引发异常。\n\n现在我们添加遍历列表的循环。\n\
    \n```python\ndef get(index, head):\n    # Get value by index\n    if head is not\
    \ None:\n        current_node = head\n        counter = 0\n        while current_node.next\
    \ is not None and counter < index:\n            current_node = current_node.next\n\
    \            counter += 1\n    else:\n        pass\n    # raise exception for\
    \ index out of bound\n```\n\n我们有一个 \"while\" 循环，只要有下一个节点，即 `head.next` 不为 None，并且我们的计数器小于索引，就会运行。`index`\
    \ 应该包含我们想要获取值的索引。如果 \"next\" 不为 \"None\"，我们将 `current_node` 更改为下一个节点并将计数器增加一。换句话说，循环继续进行，直到列表结束或\
    \ counter == index。\n\n```python\ndef get(index, head):\n    # Get value by index\n\
    \    if head is not None:\n        current_node = head\n        counter = 0\n\
    \        while current_node.next is not None and counter < index:\n          \
    \  current_node = current_node.next\n            counter += 1\n        if counter\
    \ == index:\n            return current_node.data\n        else:\n           \
    \ # Raise exception for index out of bound\n            raise IndexError()\n \
    \   else:\n        # Raise exception for index out of bound\n        raise IndexError()\n\
    ```\n\n在我们的 while 循环之后，我们需要检查它是因索引过高而退出还是找到了索引。如果我们在索引上，我们打印值，否则我们将引发索引超出范围错误。这是一种编写代码以查找列表中索引的方法；至少有\
    \ 20 种其他方法可以编写它。尝试找到其他方法来编写它。\n\n我们也测试该函数。\n\n```python\nnumber_list = Node(1)\n\
    number_list.next = Node(2, Node(3, Node(4)))\nprint(get(0, number_list)) # 1\n\
    print(get(3, number_list)) # 4\nprint(get(5, number_list)) # IndexError\n```\n\
    \n现在我们有了从链表下载的代码，并且也看到了如何连接多个节点。我们如何从列表中删除一个节点？\n\n### 删除节点\n要删除一个节点，我们需要在遍历列表时使用两个变量。我们需要\
    \ `current_node` 和 `previous`，`current_node` 用于遍历要删除的节点。`previous` 应该始终指向前一个节点，即\
    \ `current_node` 之前的节点。当我们找到正确的节点时，我们切换 `previous` 中的节点，使其指向 `current_node` 之后的节点。最后，我们删除要移除的节点\
    \ `del temp`。\n\n![Find the right nodes](img/image2279.jpg)\nFind the right nodes\n\
    \n步骤 1，遍历节点使 `current_node` 指向要删除的节点，而 `previous` 指向前一个节点。\n\n![Linking previous.next\
    \ to current_node.next](img/image2284.jpg)\nLinking previous.next to current_node.next\n\
    \n步骤 2，将 `current_node.next` 分配给 `previous.next`。\n\n![Delete current_node](img/image2290.jpg)\n\
    Delete current_node\n\n步骤 3，删除 `current_node`。\n\n### 添加节点\n当我们加入一个节点时，操作顺序至关重要；否则，我们可能会丢失所有应该在我们添加的新节点之后出现的节点。在下面的图片中，我们从列表\
    \ `[1, 2, 4]` 开始，我们想在 2 和 4 之间插入一个新节点，值为 5。列表应该看起来像 `[1, 2, 5, 4]`，它已准备就绪。\n\n\
    ![Find the right node and create new](img/image2297.jpg)\nFind the right node\
    \ and create new\n\n步骤 1，遍历节点使 `current_node` 指向应该在新节点之前的那一个。将 new_node.next 插入到\
