    # DEEP LEARNING PARAMETERS AND HYPER-PARAMETERS


    ## What are hyper parameters?


    The hyper parameters are adjustable parameters that are chosen to train a model
    and that govern the training process itself. For example, to train a deep neural
    network, you must decide the number of hidden layers in the network and the number
    of nodes in each layer before training the model. These values usually remain
    constant during the training process.


    In deep learning or machine learning scenarios, the performance of the model depends
    to a large extent on the selected hyper parameter values. The objective of the
    hyper parameters exploration is to search between different configurations of
    hyper parameters until finding the one those results in optimal performance.


    Normally, the process of exploring hyper parameters is a very laborious manual
    work, since the search space is very extensive, and the evaluation of each configuration
    can be expensive.


    Azure Machine Learning allows you to automate the hyper parameter scanning efficiently,
    saving you a considerable amount of time and resources. Specify the range of hyper
    parameter values and a maximum number of training series. The system then automatically
    starts several simultaneous series with different parameter settings and looks
    for the configuration that results in optimal performance, as measured by the
    metric you have chosen.


    The series of low-performance training is automatically terminated in advance,
    which reduces the waste of process resources. Instead, these resources are used
    to explore other hyper parameter configurations.


    ## Definition of the search space


    Automatically adjust the hyper parameters by scanning the range of values defined
    for each hyper parameter.


    ## Types of hyper parameters


    Each hyper parameter can be discrete or continuous.


    ### Discrete hyper parameters


    The discrete hyper parameters are specified with an object choice between discrete
    values. Can be:


    * one or more values separated by commas;

    * an object range;

    * any arbitrary list object.


    ![](image382.jpg)In this case, `batch_size` take one of the values `[16, 32, 64,
    128]` and `number_of_hidden_layers` take one of the values `[1, 2, 3, 4]`.


    Advanced discrete hyperparameters can also be specified through a distribution.
    The following distributions are supported:


    * `quniform(low, high, q)`: returns a value as round (uniform (low, high) / q)
    * q

    * `qloguniform(low, high, q)`: returns a value as round (exp (uniform (low, high))
    / q) * q

    * `qnormal(mu, sigma, q)`: returns a value as round (normal (mu, sigma) / q) *
    q

    * `qlognormal(mu, sigma, q)`: returns a value as round (exp (normal (mu, sigma))
    / q) * q


    ### Continuous hyperparameters


    Continuous hyperparameters are specified as distribution through a continuous
    range of values. The supported distributions are:


    * `Uniform(low, high)`: returns a value evenly distributed between low and high.

    * `log-uniform(low, high)`: returns a value that is extracted according to exp
    (uniform (low, high)) so that the logarithm of the returned value is evenly distributed.

    * `Normal(mu, sigma)`: returns a real value that is normally distributed with
    half mu and standard deviation sigma.

    * `Lognormal(mu, sigma)`: returns a value extracted according to exp (normal (mu,
    sigma)) so that the logarithm of the returned value is normally distributed.


    The following is an example of parameter space definition:


    ![](image411.jpg)This code describes a search space with two parameters: `learning_rate`
    and `keep_probability`. It has a normal distribution with a mean value of 10 and
    a standard deviation of 3. It has a uniform distribution with a minimum value
    of 0.05 and a maximum value of 0.1.


    `learning_rate`

    `keep_probability`


    ## Sampling the hyperparameter space


    You can further specify the parameter sampling method that will be used during
    the definition of the hyperparameter space. The Azure Machine Learning service
    supports random sampling, grid sampling and Bayesian sampling.


    ### Random sampling


    In random sampling, the hyperparameter grades are randomly selected from the specified
    search space. Random sampling provides the search space to include discrete and
    continuous hyperparameters.


    ![](image420.jpg)


    ### Grid sampling


    Grid sampling performs a simple grid search for all possible values of the defined
    search space. It can only be used with hyperparameters specified with. For example,
    the following space has six samples in total: `choice`


    ![](image426.jpg)


    ### Bayesian sampling


    Bayesian sampling is centred on the Bayesian optimization algorithm and makes
    intelligent decisions about the hyper parameter values to be sampled next. The
    sample is taken based on how the previous samples have been executed, in such
    a way that the new sample improves the notified main metric.


    When Bayesian sampling is used, the number of simultaneous runs affects the effectiveness
    of the adjustment process. Normally, a smaller number of simultaneous executions
    can lead to a better convergence of sampling, given that the lower degree of parallelism
    increases the number of executions that benefit from previously completed executions.


    Bayesian sampling only supports distributions `choice` and `uniform` in the search
    space.


    ![](image434.jpg)


    Note Bayesian sampling does not hold any early termination policy (see the specification
    of an early termination directive). When using Bayesian parameter sampling, set
    the value to, or do not add the parameter `early_termination_policy = None` `early_termination_policy`


    ## Specification of the main metric


    Specify the main metric that you want to be optimized with the hyperparameter
    adjustment experiment. In each training series, the main metric is evaluated.
    Executions with poor performance (where the main metric does not meet the criteria
    set by the early termination directive) are terminated.


    In addition to the name of the main metric, it will also specify the goal of the
    optimization: whether to maximize or minimize the main metric.


    * `primary_metric_name`: name of the main metric to optimize. The name of the
    main metric must exactly match the name of the metric recorded by the training
    script. See Register metrics for hyperparameter adjustment.

    * `primary_metric_goal`: it can be `PrimaryMetricGoal.MAXIMIZE` or `PrimaryMetricGoal.MINIMIZE`
    and it determines if the main metric will be maximized or minimized when evaluating
    the executions.


    ![](image452.jpg)Optimize the executions to maximize "precision". Be sure to record
    this value in the training script.


    ## Register metrics for the adjustment of hyperparameter s


    The training script for the model must record the relevant metrics during model
    training. When configuring the hyperparameters setting, you must specify the main
    metric that will be used to evaluate the performance of the executions. (See specification
    of the main metric to optimize).


    In the training script, you must record this metric so that it is available for
    the hyper-parameter adjustment process.


    Record the metrics of the training script using the following sample code snippet:


    ![](image460.jpg)The training script calculates the value `val_accuracy` and registers
    it as "precision", which is used as the main metric. Each time the metric is recorded,
    the hyper-parameter adjustment service receives it. It is the developer of the
    model who must determine how often this metric is reported.


    ## Specification of an early termination directive


    Automatically end executions with low performance with the help of an early termination
    policy. The completion reduces the waste of resources, which are used to explore
    other parameter settings.


    When using an early termination policy, you can configure the following parameters
    that control when a policy is applied:

