    # INTRODUCTION TO MACHINE LEARNING AND DEEP LEARNING


    `deep learning` is a sub-unit of `machine learning`. `Machine learning` is a sub-unit
    of `artificial intelligence`. In other words, all `deep learning` algorithms are
    `machine learning` algorithms, but many `machine learning` algorithms do not use
    `deep learning`. `Deep learning` refers specifically to an algorithm class called
    a `neural network`, and technically only to “deep ağ neural networks (moreover
    one second). This first `neural network` was developed in 1949, but it was not
    very useful at the time. It will consistently outperform `neural network`-based
    models from the 1970s to the traditional AI forms of 2010.


    These non-learning AI types include rule-based algorithms (consider an extremely
    complex array of `if / else` blocks); Intuitive based AIs such as `A * search`;
    Constraint saturation algorithms such as `Arc Consistency`; tree search algorithms
    such as `minimax` (used by the famous `Deep Blue` chess AI); and more.


    Two things that prevented `machine learning` and especially `deep learning` were
    successful — availability of large data sets and no computational power. In 2018,
    there is a surplus of data, and anyone with an `AWS` account and credit card can
    access a distributed supercomputer. Due to the new availability of data and computing
    power, `Machine learning` and especially `deep learning` has taken the AI world
    by storm.


    You should know that there are other categories of `machine learning` such as
    unsupervised learning and reinforcement learning, you will learn about a subset
    of `machine learning` called supervised learning. `Supervised learning` algorithms
    work by forcing the machine to guess repeatedly. Specifically, we (people) want
    him to make predictions about the data we already know the right answer for. This
    is called much tagged data etiket - the tag is everything we want the machine
    to predict.


    Here''s an example: Let''s say we wanted to set up an algorithm to predict whether
    someone could extend their mortgages. We need a group of people who do not default
    on their mortgages. We will receive data about these people; feed them into `machine
    learning` algorithm; ask him to guess each person, and once predicted, we tell
    the machine what the answer is actually. True or false, the `machine learning`
    algorithm has changed how it changes predictions. We repeat this process many
    times, and through the miracle of mathematics, our machine''s predictions are
    better. Although estimates are relatively slow, we need a lot of data to train
    these algorithms.


    `Machine learning` algorithms such as `linear regression`, `support vector machines`,
    and `decision trees` “learn” in different ways, but apply all the same process:
    make a prediction, get a correction, and adjust the prediction-based prediction
    mechanism. On the upper level, it''s like how a person learns.


    Recall that `deep learning` is a sub-unit of `machine learning` that focuses on
    a particular category of `machine learning` algorithms called `neural networks`.
    `Neural networks` are primarily inspired by the way the human brain works - individual
    “neurons” receive “signals” from other neurons and in turn, send ”signals diğer
    to other“ neurons ”. Each neuron somehow converts incoming “signals” and eventually
    produces an output signal. If everything went well, this signal represents accurate
    prediction!


    This is a useful mental model, but computers are not biological brains. Neurons
    lack synapses or other biological mechanisms that process the brain. As the biological
    model is disrupted, researchers and scientists use graph theory to model artificial
    `neural networks`, instead of identifying `neural networks` as “artificial brains,
    identifying them as complex graphs with powerful features.


    From the lens of graph theory, a `neural network` is a series of layers of connected
    nodes; Each node represents a “neuron ve, and each connection represents a“ synapse.
    Different types of networks have different connections.


    The simplest method of `deep learning` is a deep `neural network`. A deep `neural
    network` is a graph, including a series of fully connected layers. Each node on
    a given layer has an edge to each node on the next layer; Each of these edges
    is dispensed a different weight. The whole layer sequence is the “brain. If the
    weights on all these sides are set correctly. The `Deep Learning` study will be
    about how to create different versions of these graphs; adjust the link weights
    until the system operates, and make sure our machine thinks we did it.


    Mechanics that make `Deep Learning` such as `gradient descent` and `backpropagation`
    combine many ideas from different mathematical disciplines. To understand, `neural
    networks` need some math background.


    ## Background Information - A Bit of Everything


    When you think about how easy you can use libraries like `PyTorch` and `TensorFlow`,
    you don''t need a lot of math. “But after doing the reading required for the two
    classes, I''m just glad I had my math experience. A subset of the topics of `linear
    algebra`, mathematics, probability, statistics and graph theory has already emerged.
    Getting this information at the university will take about five courses. Mathematics
    1, 2 and 3; Linear Algebra; and computer science 101.


    Fortunately, you don''t need all of these areas. Based on what I''ve seen so far
    if you want to enter the `neural networks` yourself, I recommend: From `linear
    algebra`, you need to know and pass the point product, the `matrix product` (in
    particular the rules of multiplying matrices of different dimensions). You don''t
    have to do these things quickly by hand, but you should be comfortable enough
    to make small samples on whiteboard or paper. You should also feel satisfied working
    with “multidimensional fields - - `deep learning` uses many dimensional vectors.

    '
