- raw: "*   evaluation\\_interval: how often the policy is applied. Each time the\
    \ training script records the main metric, it is considered an interval. Therefore,\
    \ a parameter of 1 will apply the directive each time the training script reports\
    \ the main metric. A parameter of 2 will apply the directive the other times that\
    \ the training script notifies the main metric. If it is not specified, it is\
    \ set to 1 by default. evaluation\\_interval evaluation\\_interval evaluation\\\
    _interval \n\n*   delay\\_evaluation: delays the first evaluation of the directive\
    \ a specified number of intervals. It is an optional parameter that allows all\
    \ configurations to be executed during an initial minimum number of intervals,\
    \ which prevents the premature termination of training series. If specified, the\
    \ policy applies each multiple of evaluation\\_interval that is greater than or\
    \ equal to delay\\_evaluation. \n\nThe Azure Machine Learning service supports\
    \ the following early termination directives . Bandit Directive Bandit is a termination\
    \ directive based on the factor of delay or the amount of delay and the evaluation\
    \ interval. The directive terminates in advance those executions in which the\
    \ main metric is not within the factor of delay or amount of delay specified concerning\
    \ the series of workouts with the best performance. This directive takes the following\
    \ configuration parameters: \n\n*   slack\\_factoror slack\\_amount: the allowed\
    \ delay concerning the series of workouts with the best performance. Specifies\
    \ the allowed delay as a relation. Specifies the allowed delay as an absolute\
    \ quantity, rather than a relation. slack\\_factor slack\\_amount \n\nFor example,\
    \ imagine that a bandit policy is applied in interval 10. Suppose that the execution\
    \ with the best performance in interval 10 reports the main metric of 0.8 to maximize\
    \ it. If the directive were specified with a parameter of 0.2, those training\
    \ series whose best metric in interval 10 is less than 0.66 (0.8 / (1 + )) would\
    \ end. If, on the other hand, the directive was specified with a parameter of\
    \ 0.2, those training series whose best metric in the interval 10 is less than\
    \ 0.6 (0.8 - ) will end. slack\\_factorslack\\_factor slack\\_amountslack\\_amount\
