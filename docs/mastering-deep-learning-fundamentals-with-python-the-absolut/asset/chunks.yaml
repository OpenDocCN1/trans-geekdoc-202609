    a parameter that will be invoked with the sampled hyperparameters. The parameter
    describes the training script to be executed, resources per job (one or more GPUs)
    and the process destination to be used.


    Since the available resources determine the simultaneity in the hyperparameter
    adjustment experiment, make sure that the process destination specified in has
    sufficient resources for the desired simultaneity.


    `estimator`


    `estimator` `estimator` (For more information on estimators, see how to train
