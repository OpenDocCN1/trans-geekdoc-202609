    the user to solve complex classification problems using `SVM`. As with artificial
    neural networks, the failure of the method to elaborate on the decision by the
    user posed a serious obstacle to its spread. This was the general picture in the
    mid-2000s, but especially with the wave spread of big data, these methods were
    far from meeting the need.


    ## Random Matrix Theory


    At this very moment, a method of mathematical solution that was as old as finding
    artificial neural networks was remembered by a large audience. It was, known so
    much that it was used in many fields from solid state physics to chemistry. This
    method, which is called the Random Matrix Theory, is used by scientists to model
    the universality of a complex system that scientists have discovered in the modelling
    of complex systems. Nobel Prize winner Eugene Wigner is said to have said. "all
    complex, correlated systems exhibit universality, from a crystal lattice to the
    Internet."


    ## Deep learning


    So much so that it started to be applied to a wide range of fields from modeling
    energy levels of atoms to spectral analysis of chemical substances to modeling
    of clusters on the Internet. The problem of not being able to cope with the fact
    that Artificial Neural Networks were more than five hidden layers during these
    applications was also remembered. Ultimately, this was a complex problem and was
    based on matrices. In this way, successive solutions such as voice recognition,
    natural language processing and image recognition have emerged. It''s called Deep
    Learning. It can be said that the name refers to the removal of the obstacle to
    increasing the number of hidden layers in artificial neural networks. Of course,
    as in the period of artificial neural networks in the 1990s, it is possible to
    create great expectations and come up with small solutions, but what has been
    done so far is very promising.


    ## Central Limit Theorem


    Just as the central limit theorem in the early 20th century made the normal distribution
    one of the basic tools of modeling in the scientific world, the circular distribution
    of eigenvalues based on the random matrix theorem seems to have the same effect.


    ## Julia


    What is being done in the software world to use these methods, which require operations
