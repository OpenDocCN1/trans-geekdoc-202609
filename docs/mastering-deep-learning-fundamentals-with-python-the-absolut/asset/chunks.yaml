    # FUNDAMENTALS OF STATISTICS


    The theory of statistical learning is a system of machine learning from the fields
    of statistics and functional analysis. The theory of statistical learning deals
    with the problem of finding a predictive function based on data. The theory of
    statistical learning has led to applications in areas such as computer vision,
    speech recognition, the bioinformatics and baseball. The objectives of learning
    are prediction and comprehension. Learning involves several categories, including
    supervised learning, unsupervised learning, learning and reinforcement learning.
    From the theory of statistical learning, supervised learning is the most appropriate.


    Supervised learning involves learning from a set of training data. Each point
    of the formation is a pair of input-outputs, where the input corresponds to an
    output. The learning problem is to infer the function that maps between the input
    and the output so that the learned function can be used to predict the output
    of future input.


    Depending on the type of exit, supervised learning problems are either regression
    problems or classification problems. If the output takes a continuous range of
    values, it is a regression problem. Using Ohm''s Law as an example, a regression
    could be made with voltage as input and current as output. The regression would
    find the functional relationship between voltage and current


    ![](image114.jpg)![](image118.jpg)


    # FUNDAMENTALS OF LINEAR ALGEBRA


    A function `f`, or model as we have called it previously, is a mechanism that
    transforms an input data `x` into a result `y`. A function is characterized by
    an equation of the type:


    ![picture](image130.jpg)


    If a datum `x` consists of a component or dimension, we speak of scalar; if it
    consists of several components as follows:


    ![picture](image135.jpg)


    It is then called vector. The set of all the vectors `x` that can be constructed
    is called space. In space, there exists at least a subset of vectors that can
    be combined by addition or multiplication to obtain all the space; this subset
    of vectors is called base.


    The matrix is the generalization of the concept of vector: it is a vectors vector
    or 2-dimensional array. It is possible to add and multiply matrices with each
    other, vectors between them, and matrices with vectors. The matrices are extremely
    useful from notation because they make it possible to write in a dense way equations
    of functions!


    We can define the norm of a vector `x` as the distance of this vector at the origin.
    The latter is noted as follows:


    ![Description: picture](image143.jpg)


    In particular, we distinguish:


    The standard 2 or Euclidean distance:


    ![picture](image149.jpg)


    The standard 1 or absolute value:


    ![picture](image154.jpg)


    The notion of the norm is also generalizable to matrices, which we do not detail
    here.


    ## Interpolation


    Given a history of points, interpolating means determining the function that passes
    through all these points. In general, we use polynomial interpolation. This could
    be a regression method. However, this method is avoided as it very often leads
    to over-learning.


    ## Supervised learning with equations


    To evaluate the performance of a classifier `f`, we first define a cost function
    `L` that will give a measure of the error between the prediction `f(x)` and the
    real value `y`. In general, the cost function is chosen as the square of the difference
    to the result to be predicted; this is the least squares approximation:


    ![](image164.jpg)


    Then, we define an error function `R`, which measures the sum of the differences
    between the real value `y` and the prediction `f(x)`.


    ![](image169.jpg)


    Where `n` is the number of elements in the history


    So, doing a regression is to find the function `f` that minimizes the error:


    ![](image175.jpg)


    How to get the minimum of a function? It is important to specify that `f` is a
    function whose form is known (for example, a linear function of the type `y =
    a * x + b`). To determine `f`, it is sufficient to determine its parameters. (In
    the case of the linear function, the parameters are `a` and `b`). These parameters
    are obtained by minimizing the error function `R`.


    In most cases, there are exact methods for minimizing `R` using very expensive
    computing operations for a machine. In general, it is faster to estimate the value
    of the parameters off by performing several tests on the value of the parameters.
    The number of values taken by the parameters being infinite, it is necessary to
    carry out these tests cleverly. For this, we use optimization methods, the best
    known to be the gradient method.


    ## Linear regression


    ### Simple regression - x is a scalar


    Linear regression is a supervised learning method for estimating `f` assuming
    `f` has a linear form:


    ![](image185.jpg)


    Determining `f` then consists in finding `a` and `b` while minimizing the function
    `R`:


    ![](image190.jpg)


    As previously explained, it is possible to solve this equation using the gradient
    method.


    ### Multiple regression - x is a vector


    In that case,


    ![](image197.jpg)


    Where `A` is a vector and `B` is a scalar. The optimization formula becomes:


    ![](image203.jpg)


    Thus, with the vector notation, one can see that it is easy to generalize most
    of the methods applied to scalars. However, the calculation time is more important
    because there are more coefficients to evaluate (`p + 1` coefficient instead of
    2).


    ### Multiple regressions, matrix notation


    In the literature, one often finds these equations put in matrix form to have
    condensed writing. Let `X` be the matrix of `n` vectors `x`, `Y` the matrix of
    `n` vectors `y`. Then `A` becomes a matrix, and we can write:


    ![](image210.jpg)


    A little parenthesis about the possibilities of regressions


    ### Nonlinear regressions


    There are many regression models more complex than linear regression; we must
    choose the right type of regression for the right problem: polynomial regression,
    splines, time series, logistic regression, kernel regression.


    ### Dimension reduction


    As with CPA in unsupervised learning, it is possible to use regression methods
    for dimension reduction. When the number of characteristics is large, it is interesting
    to determine which characteristics influence the result. For this, we use regularization
    methods. The principle of regularization is to correct the error `R` by a term
    depending on the parameters worth 1 or 0. One of the regularization methods is
    called Lasso regression:


    ![](image220.jpg)


    This method reduces the number of dimensions cancelling much of the coefficients
    `A`. It should be noted that the parameter picture to be determined empirically.
    We are done with the explanation of regressions and this is about supervised learning.

