  trans: '


    # 特性和优势


    卷积网络的一个主要优势是使用与进入同一卷积核的所有神经元的信号相关联的唯一权重。这种方法减少了内存占用，提高了性能并允许平移处理不变性。这是卷积神经网络相对于多层感知器的主要优势，多层感知器将每个神经元视为独立，因此为每个输入信号分配不同的权重。


    当输入体随时间变化 `video` 或 `sound` 时，在神经元设置中沿时间尺度添加一个参数变得很有趣。在这种情况下，我们将称之为具有时延的神经网络 `TDNN`。


    与其它图像分类算法相比，卷积神经网络使用相对较少的预处理。这意味着网络负责自行改变其滤波器 `learning without supervision`，而这对于其它更传统的算法来说并非如此。缺乏初始参数化和人工干预是
    `CNN` 的一大优势。


    ## 卷积神经网络与多层感知器的区别


    尽管对图像处理有效，多层感知器 `MLPs` 在处理大图像时存在困难，因为随着图像尺寸的增大，连接数量呈指数增长，因为每个神经元都“完全连接”到前一层和下一层的每个神经元。


    卷积神经网络，其原理受脊椎动物视觉皮层的启发，相反限制了神经元与其相邻层神经元之间的连接数量，这大大减少了需要学习的参数数量。对于像 `AlexNet` 这样深的网络，例如，需要学习的参数中超过
    90% 来自最深的 3 层 `Fully connected`，其余部分与 `5` 个卷积层有关。


    `CNN` 在 3 维中的一层 `green = volume of entry, the blue = volume of the receiving field,
    grey = layer of CNN, circles = independent artificial neurons`


    例如，如果我们取一个图像尺寸 `32 × 32 × 3` `32 wide, 32 high, 3 colour channels`，`MLP` 第一隐藏层中的单个全连接神经元将有
    `3,072` 个输入 `32 * 32 * 3`。一个 `200 × 200` 的图像因此会导致每个神经元处理 `120,000` 个输入，这乘以神经元数量后变得巨大。


    卷积神经网络旨在在保持自然图像强“空间局部”相关性的同时限制输入数量。


    与 `MLP` 相比，`CNN` 具有以下区别特征：


    **局部连接**：得益于接收场限制了神经元输入的数量，同时保持 `MLP` 架构，卷积神经网络因此确保“滤波器”对空间局部输入模式产生最强响应，这导致了入口的简约表示。这种表示在内存中占用的空间更少。此外，由于需要估计的参数数量减少了，因此对于固定的数据量，其
    `statistical` 估计更稳健 `compared to an MLP`。


    **共享权重**：在卷积神经网络中，一个神经元的滤波参数 `对于给定的接收场` 对于同一核的所有其它神经元 `处理图像的其它所有感受野` 都是相同的。这种设置
    `weight vector and bias` 在“函数卡”中定义。


    **平移不变性**：由于同一核 `filter` 的所有神经元都是相同的，因此该核检测到的模式与图像中的空间位置无关


    这些特性共同使卷积神经网络能够在估计参数 `28` 时获得更大的稳健性 `on learning problems` 因为，对于一个固定大小的学习语料库，每个参数的数据量更高。很好。权重共享也大大减少了需要学习自由参数的数量，从而减少了网络运行的内存需求。内存占用的减少使得可以学习更大、通常更强大的网络。


    ### 在自然语言自动处理中的应用 `NLP`


    代替图像像素，大多数 `NLP` 函数的输入是句子或文档。将 `CNN` 应用于此 `see any RN` 的想法是将单词和文档转换为矩阵形式。矩阵的每一行对应一个
    token，通常是一个词，但也可以是一个字符。也就是说，每一行都是一个表示词的向量。通常，这些向量是词嵌入 `small representations`，例如
    `word2vec` 或 `GloVe`。


    例如，对于一个 20 个词的短语，使用 100 维嵌入，我们将有一个 `20 × 100` 矩阵作为输入。这就是我们 `CNN` 的“图像”。


    图像处理中的卷积滤波包括拖动一个代表特征的窗口在图像上，并计算特征与扫描图像的每个部分之间的卷积积。然而，在 `NLP` 中，我们通常使用在矩阵的完整行上滑动的滤波器
    `the words`。因此，滤波器的“宽度”通常与输入矩阵的宽度相同。高度或区域大小可能变化，但一次滑动窗口超过 2 到 5 个词是典型的。


    # 第二部分：深度学习实践 `IN JUPYTER NOTEBOOKS`


    `Python` 是一种功能强大的计算机语言，对于互联网开发和基于网络的应用程序极其有效。为什么在已经有一长串非常好且功能完善的老式计算机语言可用的情况下，你还要涉足
    `Python` 呢？例如，让我们提及：


    * `Python` 可用于所有知名操作系统，包括 `Linux`、`Mac` 和 `Windows`。

    * `Python` 很容易从一个操作系统迁移到另一个操作系统，例如。从 `Linux` 到 `Windows` 反之亦然。

    * 非常容易学习——对于计算机语言的初学者来说也是如此。

    * `Python` 结合了卓越的强大功能和非常清晰的语法 `read: a way of doing things`。


