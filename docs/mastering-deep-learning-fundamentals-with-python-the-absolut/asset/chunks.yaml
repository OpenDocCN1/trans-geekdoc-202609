    # FUNDAMENTALS OF PROBABILITY


    The process of benefiting from science in decision-making processes that started
    with probability theory continued with the extraction of certain parameters to
    summarize the data. Sampling characteristics of the available data, such as mean
    value and variance, were used to test the hypothesis with probability distribution
    functions from probability theory. Today, techniques that are still used in many
    decision-making processes have emerged, including what some of us know as `A/B
    testing`.


    ## Forecasting


    The basis for decision-making is the prediction. Estimation is possible by generating
    a mathematical model as input (`s/s`) from inputs and inputs and then using this
    model in decision making. The first models were simple and naturally linear because
    they answered the current problems. This meant that the inputs were produced by
    adding and/or subtracting each other to produce output. Therefore, Regression
    method can be considered as a problem of passing a straight equation from the
    points in the data. This method is, of course, nonlinear known as non-linear multiplication
    and division operations are also used to bring the transition to functions. In
    this way, we have the opportunity to pass a curve from the points at hand and
    make our estimation more accurate accordingly. Using the probability distribution
    function in this process was necessary to model the chance factor in the problem.


    ## Artificial intelligence


    In the 1950s, academic circles engaged in artificial intelligence, while dealing
    with algorithms for learning and problem solving of a computer, were pondering
    on finding solutions without knowing the distribution function of data at hand.
    Living things could make decisions without knowing statistics. During these periods,
    two basic methods came to the fore. Artificial neural networks and decision trees.
    Neither of these methods was based on statistics. In artificial neural networks,
    the structure of the neural cells was simulated, and a layered network was formed.
    In this structure, the input layer was called the input layer, and the output
