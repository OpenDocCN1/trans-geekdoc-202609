    # 概率基础


    从概率论开始的、利用科学进行决策过程的历程，继续发展为从数据中提取某些参数以进行概括。利用来自概率论的概率分布函数，对可用数据的抽样特征（如均值和方差）进行假设检验。如今，已涌现出许多仍在决策过程中使用的技术，其中一些我们所知的就是
    `A/B testing`。


    ## 预测


    决策的基础是预测。通过从输入和输入生成数学模型作为输入 (`s/s`)，然后将该模型用于决策，可以进行估计。最早的模型很简单，自然是线性的，因为它们解决了当时的问题。这意味着输入是通过彼此相加和/或相减来产生输出的。因此，回归方法可以被视为从数据点中穿过一条直线方程的问题。当然，该方法是非线性的，已知非线性乘法和除法运算也被用来将过渡带入函数。这样，我们就有机会从手头的点中穿过一条曲线，并据此使我们的估计更准确。在此过程中使用概率分布函数对于对问题中的偶然因素进行建模是必要的。


    ## 人工智能


    在 1950 年代，学术界从事人工智能的人在处理计算机的学习和问题解决算法时，正在思考如何在不知道手头数据的分布函数的情况下找到解决方案。生物体可以在不知道统计数据的情况下做出决策。在这些时期，出现了两种基本方法。人工神经网络和决策树。这两种方法都不是基于统计的。在人工神经网络中，模拟了神经细胞的结构，并形成了一个分层网络。在该结构中，输入层被称为输入层，输出层被称为输出层。这两者之间的隐藏层是隐藏层。我有。从
    1980 年代末到 2000 年初的时期被人们铭记为黄金时代。在此期间结束时，系统的复杂性增加，如果隐藏层超过四到五层，结果就无法改善。从某种意义上说，即使没有停止，经济地生产的过程也放慢了。虽然决策树在某些问题的应用中能给出良好的结果，但由于数据规模增大带来的问题，以及在算法解决方案方面并不十分成功，它们的应用仅限于有限的问题。虽然在统计学领域已经产生了某些先进的非线性方法，但尚未取得可以应用于手头问题的普遍进展。对于高级方法，可以研究与时间序列相关的非线性方法。再次，以不同的方式重新使用多维空间


    在人工神经网络 (`ANNs`) 在 1990 年代末停滞不前的这一点上，一种所谓的支持向量机成为了一种有前途的方法，用来处理 `ANN` 无法应对的复杂性。在该方法中，使用了数学中的复杂问题、空间结构以及允许在这些空间之间转换的函数来摆脱复杂性。当然，人工神经网络也需要在多维空间中进行处理，但空间之间没有转换。根据这些非常复杂的数学方法，如电影中在空间大小中使用的门，核函数
    (`kernel functions`) 已被引入并用于解决许多问题。其主要原因是在空间 `A` 中需要非线性解决方案的复杂问题，可以使用核函数通过到空间
    `B` 而作为线性问题来处理。这样，就有可能在该空间中使用线性方法。这在商业生活中的反映是，使用 `SVM` 开发的一些产品允许用户使用 `SVM` 解决复杂的分类问题。与人工神经网络一样，该方法无法让用户详细阐述决策，这对其推广构成了严重障碍。这是在
    2000 年代中期的大致情况，但尤其是随着大数据浪潮的传播，这些方法远不能满足需求。


    ## 随机矩阵理论


    就在这一刻，一种与发现人工神经网络一样古老的数学求解方法被广大受众重新记起。它是如此为人所知，以至于被用于从固体物理到化学的许多领域。这种被称为随机矩阵理论的方法被科学家用来对科学家在复杂系统建模中发现的复杂系统的普适性进行建模。诺贝尔奖获得者尤金·维格纳据说曾说过。“所有复杂的相关系统都表现出普适性，从晶体格到互联网。”


    ## 深度学习


    如此之多，以至于它开始被应用于从原子能级建模到化学物质光谱分析，再到互联网上集群建模的广泛领域。在这些应用期间，人工神经网络无法应对超过五层隐藏层的事实也被人们记起。最终，这是一个复杂的问题，并且是基于矩阵的。这样，就出现了语音识别、自然语言处理和图像识别等连续解决方案。它被称为深度学习。可以说，这个名字指的是移除了增加人工神经网络中隐藏层数量的障碍。当然，就像
    1990 年代人工神经网络时期一样，有可能产生巨大的期望并提出小的解决方案，但迄今为止所做的工作非常有前景。


    ## 中心极限定理


    正如 20 世纪初的中心极限定理使正态分布成为科学界建模的基本工具之一，基于随机矩阵定理的特征值的圆形分布似乎具有同样的效果。


    ## Julia


    软件世界正在做什么来使用这些需要对非常大的矩阵进行运算的方法？这些模型由现有的大数据技术提供支持。然而，已经开发并使用了新的软件库来处理巨大的矩阵。甚至正在开发特定于站点的软件语言。其中之一是
    `Julia`。有望成为越来越受欢迎的语言之一的候选者。


    ## 科学家时代


    已经说过，数据科学家将成为时代的主角，科学将变得更加突出。目前，该领域的最佳科学家正被谷歌、微软和 IBM 等公司招揽，而这些科学家生产的数学模型最近已用于具有语音和图像处理功能的产品中。为了在这样的世界中竞争，我们正处于一个世纪的开端，在这个世纪里，应用数学领域的科学家将与企业公司更紧密地合作。

    '
