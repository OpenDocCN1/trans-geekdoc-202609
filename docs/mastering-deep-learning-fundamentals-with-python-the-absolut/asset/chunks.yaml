    # 安装 Python


    Python 在 80 年代末诞生，其主要目标是让人类（而不仅仅是机器！）能够读懂。因为这个原因，它看起来很简单，但不用担心——Python 除此之外也是一个非常强大的语言！Django
    就是用 Python 编写的。我们需要 Python 来在 Django 中做事。让我们开始安装它吧！我们希望你安装 Python 3 的最新版本，所以如果你已经有更早的版本，你需要更新它。如果你已经安装了
    3.4 或更高版本，应该就够用了。


    ## 安装 Python：Windows


    首先，检查你的电脑上安装的是 32 位还是 64 位 Windows。这将在系统信息页面的“系统类型”行中显示。要进入该页面，可以尝试以下方法之一：

    - 同时按下 Windows 键和 Pause / Break 键

    - 从 Windows 菜单打开控制面板，从那里进入“系统和安全”，然后进入“系统”。

    - 按下 Windows 键，然后进入 设置 > 系统 > 关于系统


    你可以在官方网站下载适用于 Windows 的 Python：`https://www.python.org/downloads/windows/`。按照“Latest
    Python 3 Release - Python xxx”链接。


    如果你安装的是 64 位版本的 Windows，请下载 Windows x86-64 可执行安装程序。如果不是，请下载 Windows x86 可执行安装程序。


    下载发行版后，你应该启动它（双击）并按照说明操作。注意名为“Setup”（`Setup`）的安装向导屏幕：你需要向下滚动并选择“Add Python 3.6
    to the PATH”选项，如图所示（它可能看起来有所不同——取决于你安装的版本）：


    ![不要忘记将 Python 添加到系统变量 Path](img/image2358.jpg)


    安装完成后，你可能会看到建议了解更多关于 Python 或你安装的版本的信息。关闭此窗口——你将在本指南中学到更多！


    **注意：** 如果你使用的是较旧版本的 Windows（7、Vista 或更早版本），并且安装 Python 3.6.x 以错误消息结束，你可以尝试：要么安装所有可用的
    Windows 更新并再次尝试安装 Python 3.6；要么安装较早版本的 Python，例如 3.4.6。


    如果你必须安装早期版本的 Python，安装屏幕可能看起来与上面显示的略有不同。不要忘记将窗口滚动到“Add python.exe to Path”这一行，然后单击其左侧的按钮并选择“Will
    be installed on the local hard drive”项目：


    ![将 Python 添加到 Path 变量，早期版本](img/image2367.jpg)


    ## 安装 Python：OS X


    **注意：** 在 OS X 上安装 Python 之前，你需要检查你的 Mac 设置是否允许你安装未从 App Store 下载的软件包。进入系统设置（在“程序”文件夹中），点击“安全和隐私”并选择“常规”选项卡。如果在“允许下载自：”部分中选择了“仅
    Mac App Store”，请将其更改为“Mac App Store 和已安装的开发者”。


    你需要访问链接 `https://www.python.org/downloads/release/python-361/` 并下载 Python 发行版：

    - 下载 Mac OS X 64 位 / 32 位安装程序文件

    - 双击 `python-3.6.1-macosx10.6.pkg` 以启动安装程序。


    ## 安装 Python：Linux


    你可能现在已经安装了 Python。要检查这一点（以及语言版本），打开控制台并输入以下命令：


    ```

    $ python3 --version

    Python 3.6.1

    ```


    如果你安装了另一个不低于 3.4.0 的 Python 版本（例如 3.6.0），则无需更新。如果未安装 Python，或你想使用另一种语言版本，则可以按如下方式安装：


    ### 安装 Python：Debian 或 Ubuntu


    在控制台中输入此命令：


    ```

    $ sudo apt install python3

    ```


    ### 安装 Python：Fedora


    在控制台中使用以下命令：


    ```

    $ sudo dnf install python3

    ```


    如果你使用的是旧版本的 Fedora，则可能会收到“command dfnis not found”错误。在这种情况下，使用 `yum`。


    ### 安装 Python：openSUSE


    使用控制台中的以下命令：


    ```

    $ sudo zypper install python3

    ```


    通过打开终端应用程序并运行命令 `python3` 来确保安装成功：


    ```

    $ python3 --version

    Python 3.6. 1

    ```


    你看到的版本可能不是 3.6.1——将是你安装的版本。


    **注意：** 如果你使用的是 Windows 并收到错误消息说找不到 `python3`，请尝试输入 `python`（不带 3）并检查是否为 Python
    3.4.0 或更高版本。如果你有任何疑问，或出了问题，不知道下一步该做什么，请向你的教练求助！有时事情并不完全顺利，因此最好请更有经验的人帮忙。


    ## 文本编辑器


    有许多不同的编辑器，这取决于个人喜好。大多数 Python 程序员使用复杂但功能极其强大的 IDE（集成开发环境），例如 PyCharm。然而，它们可能不太适合初学者；我们提供同样强大但简单得多的选项。下面是我们偏好的列表，但你也可以向你的教练寻求建议——这样更容易获得帮助。


    ### Gedit


    `Gedit` 是一个开放、免费的编辑器，可用于所有操作系统。在这里下载它。


    ### Sublime Text 3


    `Sublime Text` 是一个非常常见的文本编辑器，有免费试用。它易于安装，易于使用，也适用于所有操作系统。在这里下载它。


    ### Atom


    `Atom` 是最新的 GitHub 文本编辑器。它是免费的、开放的、易于安装且易于使用。可用于 Windows、OSX 和 Linux。


    ### 为什么我们需要代码编辑器？


    你可能会问——如果可以使用 Word 或 Notepad，为什么还要安装单独的代码编辑程序呢？首先，代码应以纯文本形式存储，而 Word 或 TextEdit
    等程序的问题在于它们不会以这种形式保存文件，而是使用富文本（带格式和字体），例如 `RTF`（富文本格式）。第二个原因是专用编辑器为编程提供了许多有用的功能，例如根据其含义对代码进行颜色高亮显示和自动关闭引号。稍后我们将看到所有这些功能的实际效果。很快你就会把你的代码编辑器视为一个经过验证的最爱工具
    :)


    '
