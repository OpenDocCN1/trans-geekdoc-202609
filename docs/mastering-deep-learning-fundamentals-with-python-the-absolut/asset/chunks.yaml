    from, e.g. Internet browsers in Windows. It can then be called object-oriented
    programming, so it suggests. All windows, buttons and other normal objects are
    pre-programmed, so you can directly use them and of course, customize them according
    to your needs at the given moment. In C ++ you need to write lots of program lines
    to achieve the same. It is also very easy to integrate Python and C ++ into one
    another.


    One of the most prominent features of OOP (object-oriented programming) is reuse.
    With the three examples shown, you have already seen that Python has excellent
    properties in this area too, for, of course, the code for a full-finished window
    cannot possibly be assembled and performed in the 2-3 program lines that each
    example contains. Many times the code is needed. If Python did not possess the
    ability to recycle, then the very large program needed to create the fully finished
    window should be developed every time the window was to be used - that is, 3 times
    only for the examples shown. It would be huge programs that would be almost inapplicable
    due to the enormous scale.


    The code for the example shown and for several others is contained in the `Widget`
    class. `Label`, `Entry`, `Text` and `Frame` are all subclasses in `Widget`.


    Python is the backbone of Jython. This means that a major or minor part of a Jython
    program is and will continue to be Python. In Jython, it is often easier to develop
    Java applets than it is in Java itself. Applets can be used as integrated parts
    of HTML, XHTML, XML languages for websites.


    In Linux, you often talk about the entire software package with the software mentioned
    above packages like Linux. It is wrong. Linux is the core (the central unit /
    the controlling program. In Python, there is also a core. It is small, which should
    also be. For this controlling unit, there is a very large library (library). That
    means a lot of it, You need to have already been developed and tested for you
    Your task will be to write the code that combines the components of the library
    and develop new properties as needed, but you can also greatly expand Python yourself
    your functions (methods), classes, modules, etc.


    ### What does Python cost and where do I get it?


    Python is free and available for the vast majority of operating systems. If you
    do not have the latest version, you can always download it at `http://www.python.org`.
    Installing Python is very easy if the language is not already installed on your
    computer. However, this is usually the case if you use SuSE, RedHat or Mandrake.


    There is a very large development of Python in progress. Only the ca. 3 months,
    it has taken me to write this book, there have been 2 full updates of the language
    (the released versions are 2.2 and 2.3). But not only that, but there are also
    updates for the latter without changing the version name. Right now, October 16,
    2003, version 2.3.2 is the current one. In version 2.4, there should be quite
    a lot of changes, so Python can do even more (e.g. processing 64-bit character
    code).


    ### Guide to Python documentation


    If you are completely new to programming, it can be difficult to understand how
    the documentation of a programming language is screwed up. But once you can figure
    it out, it is often and often much easier to get help in the documentation of
    the language than having to ask for help for a specific function on a mailing
    list.


    Documentation for python can be found online at `http://www.python.org/doc/`.
    Here you can also find guides and HowTo''s for various topics. The documentation
    is divided into 7 categories: Module overview, tutorial, library reference, Macintosh
    reference, language reference, language extensions and a Python / C API.


