    # INSTALLING PYTHON


    Python came into being in the late 80s, and its main goal is to be clear to people
    (and not just machines!). Because of this, it looks simple, but do not worry -
    Python besides this is also a very powerful language! Django is written in Python.
    We need Python to do something in Django. Let''s start by installing it! We want
    you to install the latest version of Python 3, so if you already have an earlier
    version, you will need to update it. If you already have version 3.4 or higher
    installed, it should fit.


    ## Install Python: Windows


    First, check which version of Windows you have on your computer - 32-bit or 64-bit.
    This will be indicated in the “System Type” line on the System Information page.
    To get there, try one of these ways:

    - Press the Windows and Pause / Break keys simultaneously

    - Open the control panel from the Windows menu, from there go to "System and Security",
    then to "System."

    - Press the Windows key, then go to Settings> System> About system


    You can download Python for Windows from the official website: `https://www.python.org/downloads/windows/`.
    Follow the link "Latest Python 3 Release - Python xxx".


    If you own a 64-bit variant of Windows installed, download the Windows x86-64
    executable installer. If not, download the Windows x86 executable installer.


    After downloading the distribution, you should launch it (double click) and follow
    the instructions. Pay attention to the setup wizard screen, which is called “Setup”
    (`Setup`): you need to scroll down and select the “Add Python 3.6 to the PATH”
    option as shown in the figure (it might look like - depending on the version you
    install):


    ![Do not forget to add Python to the system variable Path](image2358.jpg)


    When the installation is finished, you can see a suggestion to learn more about
    Python or the version you installed. Close this window - you will learn much more
    in this guide!


    **Note:** if you are using an older version of Windows (7, Vista or an older version),
    and installing Python 3.6.x ends with an error message, you can try: either install
    all available Windows updates and try installing Python 3.6 again; or install
    an earlier version of Python, for example, 3.4.6.


    If you had to install an early version of Python, the installation screen might
    look a little different than the one shown above. Do not forget to scroll the
    window to the line “Add python.exe to Path”, then click the button to the left
    of it and select the item “Will be installed on the local hard drive”:


    ![Adding Python to Path Variable, Early Versions](image2367.jpg)


    ## Install Python: OS X


    **Note:** Before installing Python on OS X, you need to check that your Mac settings
    allow you to install packages not downloaded from the App Store. Go to the System
    Settings (in the "Programs" folder), click "Security and Safety" and select the
    "General" tab. If in the section “Allow downloads from:” the option “App Store
    for Mac” is selected, change it to “App Store for Mac and from installed developers”.


    You need to follow the link `https://www.python.org/downloads/release/python-361/`
    and download the Python distribution:

    - Download the Mac OS X 64-bit / 32-bit installer file

    - Double-click on `python-3.6.1-macosx10.6.pkg` to launch the installer.


    ## Installing Python: Linux


    It is likely that you now have Python installed. To check this (as well as the
    language version), open the console and enter the following command:


    ```

    $ python3 --version

    Python 3.6.1

    ```


    If you have another version of Python installed, no less than 3.4.0 (for example,
    3.6.0), then there is no need to update. If Python is not installed, or you want
    to use another version of the language, then you can install it as follows:


    ### Installing Python: Debian or Ubuntu


    Enter this command in the console:


    ```

    $ sudo apt install python3

    ```


    ### Install Python: Fedora


    Use the following command in the console:


    ```

    $ sudo dnf install python3

    ```


    If you have an old version of Fedora, then you may get a "command dfnis not found"
    error. In this case, use `yum`.


    ### Install Python: openSUSE


    Use the following command in the console:


    ```

    $ sudo zypper install python3

    ```


    Make sure that the installation was successful by opening the Terminal application
    and running the command `python3`:


    ```

    $ python3 --version

    Python 3.6. 1

    ```


    The version that you see may not be 3.6.1 - there will be a version that you installed.


    **NOTE:** if you were using Windows and received an error message saying that
    it was `python3` not found, try typing `python` (without 3) and check if it will
    be Python version 3.4.0 or higher. If you have any doubts, or something went wrong,
    and you have no idea what to do next, ask your coach! Sometimes things don''t
    go quite smoothly, so it''s best to ask someone with more experience to help.


    ## Text editor


    There are many different editors, and it comes down to personal preference. Most
    Python programmers use complex but extremely powerful IDEs (Integrated Development
    Environments), such as PyCharm. However, they are probably not very suitable for
    beginners; we offer equally powerful, but far simpler options. Below is a list
    of our preferences, but you can also ask your coach for advice - it will be easier
    to get help from him.


    ### Gedit


    `Gedit` is an open, free editor, available for all operating systems. Download
    it here.


    ### Sublime Text 3


    `Sublime Text` is a very common text editor with a free trial. It is easy to install
    and easy to use and is also available for all operating systems. Download it here.


    ### Atom


    `Atom` is the latest GitHub text editor. It is free, open, easy to install, and
    easy to use. Available for Windows, OSX and Linux.


    ### Why do we need a code editor?


    You may ask - why install a separate code editing program if you can use Word
    or Notepad? First, the code should be stored in plain text, and the problem of
    programs such as Word or TextEdit is that they do not save files in this form,
    but use rich text (with formatting and fonts), for example, `RTF` (Rich Text Format).
    The second reason is that specialized editors provide many useful features for
    programming, such as colour code highlighting depending on its meaning and automatically
    closing quotes. Later we will see all this in action. Soon you will start thinking
    about your code editor as a proven favourite tool :)

    '
