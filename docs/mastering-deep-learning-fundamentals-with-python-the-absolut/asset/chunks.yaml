    # 提前终止指令


    ## 常见参数


    * `evaluation_interval`：策略应用的频率。每次训练脚本记录主要指标时，即视为一个间隔。因此，参数为 `1` 时，指令会在训练脚本每次报告主要指标时应用。参数为
    `2` 时，指令会在训练脚本通知主要指标的另一次应用。未指定时，默认为 `1`。`evaluation_interval` `evaluation_interval`
    `evaluation_interval`


    * `delay_evaluation`：将指令的首次评估延迟指定的间隔数。它是一个可选参数，允许所有配置在初始最小间隔数内执行，从而防止训练序列过早终止。如果指定，策略会在大于或等于
    `delay_evaluation` 的 `evaluation_interval` 的每个倍数上应用。


    Azure Machine Learning 服务支持以下提前终止指令。


    ## Bandit 指令


    Bandit 是一种基于延迟因子或延迟量以及评估间隔的终止指令。该指令会提前终止那些主要指标未在延迟因子或指定延迟量范围内，相对于表现最佳的训练系列的执行。此指令采用以下配置参数：


    * `slack_factor` 或 `slack_amount`：相对于表现最佳的训练系列允许的延迟。指定允许的延迟作为关系。指定允许的延迟作为绝对数量，而非关系。`slack_factor`
    `slack_amount`


    例如，假设在间隔 `10` 应用 bandit 策略。假设在间隔 `10` 表现最佳的执行报告的主要指标为 `0.8` 以最大化它。如果指令指定参数为 `0.2`，则那些在间隔
    `10` 中最佳指标小于 `0.66`（`0.8 / (1 + )`）的训练系列将结束。如果另一方面，指令指定参数为 `0.2`，则那些在间隔 `10` 中最佳指标小于
    `0.6`（`0.8 - `）的训练系列将结束。`slack_factor` `slack_factor` `slack_amount` `slack_amount`


    * `evaluation_interval`：指令应用的频率（可选参数）。


    * `delay_evaluation`：将指令的首次评估延迟指定的间隔数（可选参数）。


    ```python

    from azureml.train.hyperdrive import BanditPolicy

    early_termination_policy = BanditPolicy(slack_factor = 0.1, evaluation_interval=1,
    delay_evaluation=5)

    ```

    在此实例中，提前终止策略在指标被通知的每个间隔应用，从评估间隔 `5` 开始。任何最佳指标小于 `(1 / (1 + 0.1)`，或为表现最佳执行 `91
    %` 的执行将被完成。


    ## 中位数停止指令


    拘留的中位数是一种基于执行报告的主要指标平均值的执行的提前终止指令。此指令计算所有训练系列中执行的平均值，并完成那些性能差于执行平均值中位数的执行。此指令采用以下配置参数：


    * `evaluation_interval`：指令应用的频率（可选参数）。


    * `delay_evaluation`：将指令的首次评估延迟指定的间隔数（可选参数）。


    ```python

    from azureml.train.hyperdrive import MedianStoppingPolicy

    early_termination_policy = MedianStoppingPolicy(evaluation_interval=1, delay_evaluation=5)

    ```

    在此实例中，提前终止策略在每个间隔应用，从评估间隔 `5` 开始。如果其最佳主要指标在 `1` 到 `5` 的间隔比率中差于所有训练系列中执行平均值的中位数，则在间隔
    `5` 终止执行。


    ## 截断选择指令


    截断选择在每次评估间隔取消给定百分比的性能最低的执行。执行基于其在主要指标上的性能进行比较，并终止性能最低的 `X%`。此指令采用以下配置参数：


    * `truncation_percentage`：在每次评估间隔中将被完成的性能最低的执行的百分比。指定 `1` 到 `99` 之间的整数值。


    * `evaluation_interval`：指令应用的频率（可选参数）。


    * `delay_evaluation`：将指令的首次评估延迟指定的间隔数（可选参数）。


