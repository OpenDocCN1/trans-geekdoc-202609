    # 深度神经网络层


    深度神经网络（`DNN`）被称为介于输入层和输出层之间有若干隐藏层的[人工神经网络](https://wiki.example.org/feynmans_learning_method)（`ANN`）。与轻量级
    `ANNs` 一样，`DNNs` 可以建模复杂的非线性关系。神经网络的首要目标是接收一组输入，对其进行逐步复杂的计算并输出，以解决诸如分类等现实世界问题。我们只需为神经网络提供输入。在深度网络中，我们有顺序的数据输入、输出和流动。


    ![`www.codigofuente.org/wp-content/uploads/2019/04/deep-670x294.jpeg`](img/image579.jpg)


    神经网络通常用于监督学习和强化学习问题。这些网络围绕一组相互连接的层展开。在深度学习中，隐藏层的实际数量通常是非线性的，可以很大；比如说大约 1000 层。我们主要使用梯度下降法来优化网络并最小化损失函数。我们可以使用
    `Imagenet`，一个包含数百万张数字图像的存储库，来对猫和狗等数据进行分类。`DL` 网络除了静态图像外，还越来越多地用于动态图像，以及时间序列和文本分析。训练数据集是深度学习模型的重要组成部分。此外，反向传播是训练
    `DL` 模型的<|message|>算法。`DL` 处理具有复杂输入和输出转换的大型神经网络的训练。`DL` 的一个例子是将照片分配给照片中人物姓名，如社交网络中所做的那样，用短语描述图像是另一个最近的
    `DL` 应用。


    ## DL 映射


    神经网络是具有 `x1`、`x2`、`x3` ... 等输入的目的，这些输入在两个（浅层网络）或几个中间操作（也称为层，深度网络）中被转换为 `z1`、`z2`、`z3`
    等输出。权重和偏差从一层到另一层发生变化。"`W`" 和 "`v`" 是神经网络各层的权重或突触。使用深度学习的最佳情况是监督学习问题。在这里，我们有一组大型的数据输入和期望的一组输出。


    ## 反向传播算法


    在这里，我们应用反向传播算法来获得正确的输出预测。最基本的深度学习数据集是 `MNIST`，一组手写数字数据。我们可以用 `Keras` 深度训练一个卷积神经网络，以对该数据集中的手写数字图像进行分类。神经网络分类器的触发或激活提供了一个分数。例如，要将患者分类为生病和健康，我们考虑身高、体重和体温、血压等参数。高分意味着患者生病，低分意味着他们健康。输出层和隐藏层中的每个节点都有其分类器。输入层接收输入并将其分数传递给下一个隐藏层进行额外激活，这一过程一直持续到达到输出为止。这种从左到右的输入到输出的进展称为前向传播。


    神经网络中的信用分配路径（`CAP`）是从入口到出口的变换序列。`CAPs` 在入口和出口之间建立可能的原因联系。对于给定的前馈神经网络，`CAP` 的深度或
    `CAP` 的深度是隐藏层的数量加一，因为输出层包含在内。对于信号可以通过一层多次传播的循环神经网络，`CAP` 的深度可能无限。


    ## 深度网络和浅层网络


    没有精确的深度阈值可以将浅层学习与深度学习区分开来；但通常认为，对于具有多个非线性层的深度学习，`CAP` 必须大于二。神经网络中的基本节点是感知器，它模仿生物神经网络中的神经元。然后我们有多层感知器或
    `MLP`。一组权重和偏差修改每组输入。每个边都有不同的权重，每个节点都有唯一的偏差。神经网络预测的准确性取决于其权重和偏差。提高神经网络准确性的过程称为训练。前向传播网络的输出与已知准确的值进行比较。电荷函数或损失函数是生成输出与实际输出之间的区别。训练的目标是通过数百万个训练示例使训练成本尽可能小。为此，网络调整权重和偏差，直到预测与正确结果匹配。一旦训练良好，神经网络就有潜力随时做出准确的预测。


    当模式变得复杂，你希望计算机识别它们时，你必须选择神经网络。在这种复杂模式的情况下，神经网络优于所有其他竞争算法。计算机擅长执行重复计算和遵循详细说明，但它们在识别复杂模式方面并不擅长。如果存在简单模式识别问题，支持向量机（`SVM`）或逻辑回归分类器可以很好地完成工作，但随着模式复杂性的增加，别无选择，只能搜索深度神经网络。因此，对于复杂模式，如人脸，浅层神经网络会失败，别无选择，只能使用具有更多层的深度神经网络。


    深度网络可以通过将复杂模式分解为更简单的模式来完成其工作。例如，在人脸中，边缘可用于检测嘴唇、鼻子、眼睛、耳朵等部位，然后再重新组合形成人脸。正确预测的准确性变得如此精确，以至于最近在谷歌模式识别挑战中，深度网络超过了人类。


    这种分层感知器网络的思想已经存在一段时间了。在这个领域，深度网络模仿人类大脑。但这一个缺点是它们需要很长时间来训练。然而，最近的高性能 GPU 已能在不到一周的时间内训练此类深度网络；而快速
    CPU 可能需要数周甚至数月才能完成同样的任务。


    ## 选择深度网络


    如何选择深度网络？我们必须确定我们是在构建分类器还是试图在数据中寻找模式，以及我们是否要使用无监督学习。为了从未标记的数据集中获得模式，我们使用受限玻尔兹曼机或自动编码器。


    选择深度网络时请考虑以下几点：

    对于文本处理、情感分析、命名实体分析和识别，我们使用循环网络或递归神经张量网络或 `RNTN`；

    对于在字符级别工作的任何语言模型，我们使用循环网络。

    对于图像识别，我们使用深度信念网络 `DBN` 或卷积网络。

    对于对象识别，我们使用 `RNTN` 或卷积网络。

    对于语音识别，我们使用循环网络。

    通常，深度理解网络和具有整流线性单元或 `RELUs` 的多层感知器是分类的良好选择。

    对于时间序列分析，始终建议使用循环网络。


    神经网络已经存在超过 50 年；但现在才被赋予更多重要性。原因是当我们尝试用一种称为传播的方法训练它们时，我们发现了一个称为泄漏或爆炸梯度的问题。当这种情况发生时，训练需要更长时间，精度就会退居其次。当我们训练一个数据集时，我们不断计算成本函数，即一组标记训练数据的预测输出与实际输出之间的差异。通过调整权重和偏差的值来降低成本函数，直到获得最低值。训练方法使用梯度，即成本相对于权重或偏差值变化的变化率。


    ## 受限玻尔兹曼网络或自动编码器 - RBN


    2006 年，通过解决梯度泄漏问题取得了突破。Geoff Hinton 提出了一种新颖的策略，推动了受限玻尔兹曼机 `RBM` 的发展，这是一种浅层的两层网络。第一层是可见层。此外，第二层是隐藏层。可见层中的每个节点都连接到隐藏层中的每个节点。该网络被称为受限，因为同一层内的两个层不允许接收连接。


    自动编码器是编码数据为向量的网络。创建原始数据的隐藏或压缩图像。向量在降维中很有用。向量将原始数据压缩为更少的基本维度。自动编码器与解码器结合使用，这使得可以根据其隐藏表示重建输入数据。`RBM`
    是双向翻译器的数学等价物。前向传递接收条目并将它们翻译成编码条目的数字集。同时，反向传递接收这组数字并将其翻译回重建的条目。训练良好的网络以高精度再次执行。


    ## 深度信念网络 - DBNs


    深度信念网络（`DBNs`）是通过组合 `RBM` 并引入智能训练方法而制成的。我们有一个新的设计，最终解决了梯度消失问题。Geoff Hinton 创建了
    `RBMs`，也创建了深度信念网络作为反向传播的替代方案。`DBN` 在结构上类似于 `MLP`（多层感知器），但在训练方面却大不相同。正是训练使 `DBNs`
    能够超越其浅层对应物。


    `DBN` 可以被视为一个 `RBM` 堆栈，其中一个 `RBM` 的隐藏层是上方 `RBM` 的可见层。第一个 `RBM` 可以尽可能精确地重建其输入。领先
    `RBM` 的隐藏层被视为第二个 `RBM` 的可见层，并且使用第一个 `RBM` 的输出对第二个 `RBM` 进行训练。此过程一直迭代，直到网络中的每一层都配备完毕。在
    `DBN` 中，所有 `RBM` 都学习整个条目。`DBN` 通过按顺序调整整个输入全局工作，随着模型慢慢改进，就像相机镜头对焦在图像上一样。


    `RBM` 堆栈超过单个 `RBM`，就像多层感知器 `MLP` 超过单个感知器一样。在此阶段，`RBMs` 已检测到数据中固有的模式，但没有名称或标签。为了完成
    `DBN` 的训练，我们必须向模式引入标签并使用监督学习微调网络。我们需要非常小的标记样本集，以便将特征和模式与名称相关联。这小批标记数据用于训练。与原始数据集相比，这组标记数据可以非常小。权重和偏差略有修改，导致网络对模式的感知略有变化，通常整体准确性略有提高。训练也可以使用
    GPU 在合理的时间内完成，与浅层网络相比提供非常准确的结果，我们也看到了消除梯度问题的解决方案。


    ## 对抗生成网络 - GANs


    对抗生成网络是深度神经网络，由两个相互对抗的网络组成，因此得名“对抗”。`GANs` 在 2014 年由蒙特利尔大学的研究人员发表的一篇文章中介绍。Facebook
    人工智能专家 Yann LeCun 提到 `GANs` 时称对抗训练是“过去 10 年 ML 中最有趣的想法”。`GANs` 的潜力是巨大的，因为网络扫描学会了模仿任何数据分布。`GANs`
    可以被训练来构建与我们 strikingly 相似的平行世界，适用于任何领域：图像、音乐、语音、散文。在某种程度上，它们是机器人艺术家，其作品相当令人印象深刻。


    在 `GAN` 中，一个神经网络，称为生成器，生成新的数据实例，而另一个，判别器，评估它们以确定其真实性。假设我们试图生成像 `MNIST` 数据集中那样从现实世界中获取的手写数字。当向判别器展示真实
    `MNIST` 数据集的实例时，其工作是将其识别为真实。


    现在研究 `GAN` 的以下步骤：

    生成器网络接收随机数形式的输入并返回图像。此生成的图像连同从实际数据集中获取的图像流一起作为判别器网络的输入提供。判别器接收真实和虚假图像并返回概率，一个介于
    0 和 1 之间的数字，其中 1 表示真实性预测，0 表示虚假。


    ## 循环神经网络 - RNNs


    `RNNS` 是数据可以在任何地方流动的神经网络。这些网络用于语言建模或自然语言处理（`NLP`）等应用。`RNN` 背后的基本概念是使用顺序信息。在典型的神经网络中，预计所有输入和输出都是相互独立的。如果我们想预测句子中的下一个词，我们必须知道它之前出现的词。`RNNs`
    被称为循环，因为它们对序列的每个元素重复相同的任务，并且输出基于之前的计算。因此，可以说 `RNN` 具有“记忆”，它携带有关先前估计的信息。理论上，`RNNs`
    可以利用非常长序列中的信息，但在现实中，它们只能回溯几个步骤。


    ### 循环神经网络


    长短期记忆网络（`LSTMs`）是最常用的 `RNNs`。与卷积神经网络一起，`RNNs` 已被用作生成未标记图像描述的模型的一部分。令人惊讶的是，这似乎效果很好。


    ## 深度卷积神经网络 - CNN


    如果我们增加神经网络中的层数使其更深，它会提高网络的复杂性，使我们能够建模更困难的函数。然而，权重和偏差的数量会呈指数增长。学习如此困难的问题可能对普通神经网络来说是不可能的。这导致了一个解决方案，即卷积神经网络。


    `CNN''s` 广泛用于计算机视觉；它们也已应用于自动语音识别的声学建模。卷积神经网络背后的想法是“移动滤波器”的想法，它通过图像传递。这个移动的滤波器，或卷积，应用于例如像素的节点邻域，其中应用的滤波器是节点值
    0.5 的倍数。杰出的研究员 Yann LeCun 是卷积神经网络的先驱。Facebook 就像人脸识别软件一样使用这些网络。`CNN` 已成为人工视觉项目的解决方案。卷积网络中有很多层。在
    `Imagenet` 挑战中，一台机器在 2015 年能够在对象识别上击败人类。


    简而言之，卷积神经网络（`CNN`）是多层神经网络。层有时多达 17 层或更多，并假设输入数据是图像。


    ### 卷积神经网络


    `CNN''s` 极大地减少了必须调整的参数数量。因此，`CNN` 高效地处理原始图像的高维性。


    '
