- raw: "PYTHON DATA STRUCTURES In programming, a 'data structure' is a structure for\
    \ organizing data. The choice of data structure is important since they have different\
    \ significance for performance and perform differently depending on which algorithms\
    \ have been planned to be used. A data structure is an abstract description, unlike\
    \ 'data types'. A data type may be, for example, Integer, String or boolean. It\
    \ has a definite significance while a data structure describes something undefined,\
    \ such as a list or array. There are many different data structures in different\
    \ categories. We have \"Linear Data Structures\" (List, Stack, Queue, etc.). Another\
    \ structure category that has a large place in programming is \"Tree\". They are\
    \ a little more complex than, for example, a Stack. Many data structures are already\
    \ built into the programming languages (e.g. list in Python), and some ready-made\
    \ modules and libraries have the structure implemented and ready. Nevertheless,\
    \ it is important to have an insight into how they work \"on the inside\". There\
    \ are three different data structures. \n\n*   Stack (Linear Data Structure) \n\
    \n*   Queue (Linear Data Structure) \n\n*   Linked List (Linear Data Structure) "
  fmt: '

    # PYTHON DATA STRUCTURES


    In programming, a ''data structure'' is a structure for organizing data. The choice
    of data structure is important since they have different significance for performance
    and perform differently depending on which algorithms have been planned to be
    used. A data structure is an abstract description, unlike ''data types''. A data
    type may be, for example, `Integer`, `String` or `boolean`. It has a definite
    significance while a data structure describes something undefined, such as a list
    or array.


    There are many different data structures in different categories. We have "Linear
    Data Structures" (`List`, `Stack`, `Queue`, etc.). Another structure category
    that has a large place in programming is "`Tree`". They are a little more complex
    than, for example, a `Stack`. Many data structures are already built into the
    programming languages (e.g. `list` in `Python`), and some ready-made modules and
    libraries have the structure implemented and ready. Nevertheless, it is important
    to have an insight into how they work "on the inside". There are three different
    data structures.


    * `Stack` (Linear Data Structure)

    * `Queue` (Linear Data Structure)

    * `Linked List` (Linear Data Structure)

    '
