    # 深度学习激活函数


    深度学习并解释了激活函数的意义。此外，它还展示了选择用于驱动神经网络的激活函数的重要性。


    首先，在精确定义激活函数是什么之前，让我们先谈谈它的起源，以便更好地理解其作用。“动作电位启发了激活函数”，这是一种发生在两个生物神经元之间的电现象。


    让我们先回顾一下关于生物神经元组成的 SVT 课程要点：一个神经元具有细胞体，轴突使其能够向其他神经元发送信息，并且具有树突使其能够从其他神经元接收信号。


    现在你已经了解了最新情况，让我们解释一下动作电位是什么：在下面的图像中，橙色矩形表示两个神经元通信的区域。神经元通过树突接收来自其他神经元的信号。与树突相关联的权重，称为突触权重，会乘以传入的信号。树突信号在细胞体中累积，如果由此产生的信号强度超过某个阈值，神经元就会将信息传递给轴突。否则，信号会被神经元杀死并且不会进一步传播。因此，动作电位就是表示是否应进行通信的信号强度的变化。![](img/image682.jpg)


    激活函数决定是否传输信号。在这种情况下，它是一个只有一个参数的简单函数：阈值。现在，当我们学习新事物时，一些神经元的阈值和连接概率（称为突触权重）会发生变化。这会在神经元之间创建新的连接，使大脑能够学习新事物。


    ## 人工神经元


    现在让我们讨论一下人工神经元网络的工作原理：神经元中的输入值（`x1`、`x2`、`x3`、...、`xn`）与其关联的权重（突触权重参考）（`w1`、`w2`、`w3`、...、`wn`）相乘。然后我们对这些乘积求和，最后加上偏置（阈值的参考）。下图显示了计算公式。![](img/image693.jpg)


    函数 `Z(x)` 对应于预激活，也就是激活之前的一步。然后，激活函数介入。预激活函数 `Z(x)` 的结果 `z` 被激活函数 `A(z)` 解释，产生结果
    `y`。![](img/image698.jpg)


    激活的目的在于转换信号，以从输入之间的复杂转换中获得输出值。为此，激活函数必须是非线性的。正是非线性使得创造此类变化成为可能。我们将看到原因。


    ## 非线性


    让我们先简要看看线性激活函数和非线性激活函数的区别：


    ### 线性激活函数


    它是一种形式简单的函数：`f(x) = ax` 或 `f(x) = x`。输入几乎不经修改或不经任何修改就传到输出。这里我们仍处于比例关系的情况。![](img/image707.jpg)


    '
