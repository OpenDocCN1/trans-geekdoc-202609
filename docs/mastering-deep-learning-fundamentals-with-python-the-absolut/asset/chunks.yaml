- raw: 'CONVOLUTIONAL NEURAL NETWORK The visual cortex of vertebrates directly inspires
    convolutional neural networks. A network of convolutional neurons also called
    convent (for "Convolutional Network"), or CNN (for "Convolutional Neural Network").
    We distinguish two parts, a first part which is called the convolutive part of
    the model and the second part, which one will call the classification part of
    the model which corresponds to a model MLP (Multi Layers Perceptron). ![](image783.jpg)It
    is a network of multilayer neurons and more precisely it is a deep network composed
    of multiple layers which in general are organized in blocks (CONV → RELU → POOL).
    There are four types of layers for a convolutional neural network:  the convolutional
    layer, the poolin layer g, the ReLU correction layer, and the fully-connected
    layer. ![](image788.jpg)The convolution layer The convolutional layer is the key
    component of convolutional neural networks and is still at least their first layer.
    Its purpose is to locate the presence of a set of features in the images received
    as input. For this, we perform convolutional filtering: the principle is to "drag"
    a window representing the feature on the image and calculate the product of convolution
    between the feature and each portion of the scanned image. A feature is then seen
    as a filter: the two terms are equivalent in this context. Three hyperparameters
    make it possible to size the volume of the convolution layer. Depth of the layer:
    number of convolution nuclei (or number of neurons associated with the same receiver
    field) . The step controls the overlap of the receiver fields. The smaller the
    pitch, the more overlapping the receiver fields and the greater the output volume.
    The margin (at 0) or zero paddings: sometimes, it is convenient to put zeros at
    the border of the input volume. The size of this zero-padding is the third hyperparameter.
    This margin makes it possible to control the spatial dimension of the output volume.
    In particular, it is sometimes desirable to keep the same area as that of the
    input volume. Pool Layer: Pooling This type of layer is often placed between two
    convolution layers: it receives several feature maps as input and applies to each
    of them the pooling operation. The operation of pooling (or sub-sampling) consists
    in reducing the size of the images while preserving their important characteristics.
    For this, the image is cut into regular cells; then the maximum value is kept
    within each cell. In practice, small square cells are often used to avoid losing
    too much information. The most common choices are adjacent cells of 2 × 2 pixels
    size that do not overlap, or 3 × 3 pixels cells, spaced from each other by a step
    of 2 pixels (which therefore overlap). The same number of feature maps are output
    as input, but these are much smaller . The pooling layer reduces the number of
    parameters and calculations in the network. This improves the efficiency of the
    network and avoids over-learning. It is common to periodically insert a Pooling
    layer between successive Conv layers in a ConvNet architecture. Its function is
    to gradually reduce the spatial size of the representation to reduce the number
    of parameters and calculations in the network, and thus also to control the over-adjustment.
    The pooling layer operates independently on each depth slot of the input and resizes
    it spatially, using the MAX operation. Thus, the pooling layer makes the network
    less sensitive to the position of features: the fact that a feature is a little
    higher or lower, or even that it has a slightly different orientation should not
    cause a change radical in the classification of the image. the ReLU layer To improve
    the efficiency of the treatment by interleaving between the processing layers,
    a layer that will operate a mathematical function (activation function) on the
    output signals. in this context we find ReLU ( Rectified Linear Units ) refers
    to the actual non-linear function. defined by ReLU (x) = max (0, x) . The ReLU
    correction layer, therefore, replaces all negative values ​​received as inputs
    with zeros. It plays the role of the activation function Often, the Relu correction
    is preferable, but there is another form. The correction by  hyperbolic tangent
    f (x) = tanh (x), The correction by the saturating hyperbolic tangent :  f (x)
    = | tanh (x) |, The correction by the  sigmoid function {\\ displaystyle f (x)
    = (1 + e ^ {- x}) ^ {- 1}}. f (x) = (1 + e -x ) -1 Fully-connected layer The fully-connected
    layer is evermore the last layer of a neural network, convolutive or not - so
    it is not characteristic of a CNN. This type of layer receives an input vector
    and produces a new output vector. For this, it applies a linear combination and
    optionally an activation function to the values ​​received at the input. The fully-connected
    layer classifies the input image of the network: it returns a vector of size N,
    where N is the number of classes in our image classification problem. Each element
    of the vector indicates the probability for the input image to belong to a class.
    For example, if the problem consists in distinguishing cats from dogs, the final
    vector will be of size 2: the first  element (respectively, the second) gives
    the probability to belong to the class "cat" (respectively "dog"). Thus, the vector
    \[0.90.1\] means that the image has a 90% chance of representing a cat. Each value
    of the input array "vote" in favour of a class. The votes do not all have the
    same importance: the layer gives them weights that depend on the element of the
    table and the class. To calculate the probabilities, the fully-connected layer,
    therefore, multiplies each input element by a weight, adds the sum, and then applies
    an activation function (logistic if N = 2,  softmax  if N> 2): It is possible
    to replace fully connected CNN layers with convolutional layers, which makes it
    fully convolutional.  All-convolutional network is a good idea. I invite you to
    discover it. To begin To help us understand the operation of a convolutional neural
    network, we will help with a simplified example and try to determine if an image
    represents an X or an O. Our CNN has only one task to perform: each time we present
    a photo, it must decide if this photo represents an X or an O. He considers that
    in each case, there can only be ''either. ![](image825.jpg)for a computer, an
    image is zero more than an array of 2-dimensional pixels (a sort of giant chessboard)
    with each box containing a specific number: In our example, a pixel with the value
    1 is a white pixel, and -1 is black. ![](image830.jpg)Features - features. CNN
    compares images fragment by fragment. The fragments he looks for are called features.
    The features correspond to pieces of the image. ![](image837.jpg)By finding approximate
    features that are roughly similar in 2 different images, the CNN is much better
    at detecting similarities than by a full image-to-image comparison. ![](image842.jpg)Each
    feature is like a mini-image, ie a small array of dimension 2 values. The features
    bring together the most common aspects of the images. In the case of the image
    showing an X, the characteristics defining the two diagonals and the intersection
    of the latter represent the most common features of an X. These characteristics
    probably correspond to the arms and the centre of any image of an image. X. ![](image847.jpg)Convolutio
    n When presented including a new image, the CNN does not know exactly if the features
    will be present in the image or where they could be, so it seeks to find them
    in the entire image and any position. ![](image853.jpg)By calculating in the whole
    image if a characteristic is present, we do filtering. The mathematics we use
    to do this is called convolution, from which the convolutional neural networks
    take their name. To calculate the correspondence between a characteristic and
    a sub-part of the image, it is sufficient to multiply each pixel of the characteristic
    by the value that this same pixel contains in the image. Next, add the responses
    and divide the result by the total number of pixels in the feature. If the 2 pixels
    are white (value 1) then 1 \* 1 = 1. If both are black, then (-1) \* (-1) = 1.
    In all cases, each matching pixel results in 1. Similarly, each shift gives -1.
    If all the pixels in a characteristic match, then their addition and then their
    division by the total number of pixels gives 1. In the same way, if none of the
    pixels of  the characteristic correspond to the sub-part of the image, then the
    answer is -1. ![](image860.jpg)To complete a convolution, one repeats this process
    aligning the characteristics with each subpart of the image. We then take the
    result of each convolution and create a new table of 2 dimensions. This map of
    matches is also a filtered version of the original image. It is a map showing
