    # 神经网络与深度学习基础


    神经网络是当谈到繁重计算和智能算法时出现的下一个大事物。这就是它们的工作原理以及为什么它们如此惊人。如果你持续关注技术新闻，你可能已经遇到过神经网络的概念（也称为神经网络）。2016
    年，谷歌的 AlphaGo 神经网络在 4-1 的系列赛中击败了世界上最好的职业围棋选手之一。YouTube 还宣布他们将使用神经网络更好地理解他们的视频剪辑。YouTube
    将使用神经网络真正理解视频剪辑。YouTube 将使用神经网络真正理解视频。YouTube 上的搜索可能令人沮丧，因为 YouTube 看待视频的方式与人不同。最近，谷歌增加了一项可以改变这一点的专利。还有数十个其他故事可以被记住。但具体来说，神经网络是什么？它从何处工作？为什么它在机器学习中如此常见？


    ## 像大脑一样的计算机


    现代神经科学家经常将大脑讨论为一种计算机类型。神经网络则试图做相反的事情：构建一个像大脑一样运行的计算机。当然，我们对大脑极其复杂的功能只有初步的理解，但通过创建大脑处理数据方式的简化模拟，我们可以构建一种与普通计算机工作方式非常不同的计算机。计算机处理器串行构造数据（“按顺序”）。它们对一组数据执行许多程序，一次一个。并行处理（“同时多流处理”）通过串联使用多个处理器显著减少了计算机。人工神经网络（因此称为与大脑中的实际神经网络区分开来）具有根本不同的结构。它是高度互联的。这使得它能够非常快速地处理数据，从数据中学习并更新其内部结构以提高性能。然而，高互联水平会产生一些惊人的效果。例如，神经网络非常擅长识别数据中的模糊模式。


    ### 学习能力


    神经网络的学习能力是其最大的优势。对于标准数据库架构，程序员必须开发一个算法，告诉计算机如何处理传入数据，以确保计算机输出正确答案。输入-输出响应可能像“当按下
    A 键时”一样简单，屏幕上出现“A”或像复杂的统计一样复杂。另一方面，神经网络不需要同类型的算法。通过学习机制，它们本质上可以设计自己的算法 4 塑造你生活的机器学习算法
    4 创造你生活的机器学习算法 你可能没有意识到，但机器学习已经在你周围，并且可以对你的生活产生惊人的影响程度。需要注意的是，由于神经网络是编写在机器上的程序，而这些机器使用标准串行处理硬件，因此当前技术仍然设置了限制。构建神经网络的硬件变体是另一个完全不同的问题。


    ## 从神经元到节点


    现在我们已经为神经网络的工作原理奠定了基础，我们可以开始查看一些细节。人工神经网络的基本构造如下所示：

    ![neural network architecture](img/image288.jpg)

    每个圆圈被称为“节点”，它模拟单个神经元。左侧是输入节点，中间是隐藏节点，右侧是输出节点。非常基本地说，输入连接接受输入值，这可能是一个二进制 1 或 0，RGB
    颜色值的一部分，国际象棋棋子的状态或其他东西。这些节点服务于流入网络的信息。每个输入按钮都链接到多个隐藏节点（有时链接到每个隐藏节点，有时链接到一个子集）。输入节点接收它们被给予的信息并将其传递给隐藏层。例如，如果输入按钮接收到
    1，则会发送信号（神经学中的“放电”），如果接收到零则保持休眠。每个隐藏节点都有一个阈值：如果其所有累加输入达到某个值，它就会燃烧。


    ### 从突触到连接


    每个对应于解剖学突触的连接也赋予特定的权重，这使得网络能够更强调特定节点的动作。这里有一个例子：

    ![neural net weight](img/image298.jpg)

    正如你所看到的，连接 B 的权重高于终端 A 和 C。让我们说隐藏节点 4 只有在总输入为 2 或更高时才会放电。这意味着如果 1 或 3 单独放电，4 将不会被触发，但
    1 和 3 一起就会触发该节点。节点 2 也可以通过连接 B 自身触发该节点。让我们以天气为例作为实际例子。假设你设计一个简单的神经网络来确定是否应该发布冬季风暴警告。使用上述连接和权重，节点
    4 只有在温度低于 0 华氏度且风速超过 30 英里/小时时才会射击，或者如果降雪概率超过 70%。温度将输入到节点 1，风输入到节点 3，降雪概率输入到节点
    2。现在节点 4 可以在确定向输出层发送哪个信号时考虑所有这些因素。


    ### 比简单逻辑更好


    当然，这个功能可以用简单的逻辑门轻松发出。但更复杂的神经网络，如下图所示，可以执行更复杂的运算。

    ![neural network example](img/image308.jpg)

    输出节点的工作方式与隐藏层相同：输出节点对来自隐藏层的输入求和，如果达到某个值，则输出输出节点并发送特定信号。在过程结束时，输出层发送一组信号，表示输入的结果。虽然上面显示的网络很简单，但深度神经网络可以有许多隐藏层和数百个节点。

    ![deep neural network](img/image314.jpg)

    图片来源：Michael A. Nielsen 的《神经网络与深度学习》


    ## 错误校正


    到目前为止的过程相对简单。但神经网络在学习方面表现出色。大多数神经网络使用一种称为反向传播的过程，该过程将信号传回网络。在程序员分发神经网络之前，他们会让它经历一个训练阶段，在此期间它会接收一组已知结果的输入。例如，程序员可以教神经网络识别图像
    使用你的智能手机通过 CamFind 识别某物 使用你的智能手机通过 CamFind 识别某物 此应用程序可以识别你扔给它的几乎任何物体。它不仅很酷，而且也有很多实际用途。输入可以是一辆汽车的图片，正确的效果将是“汽车”一词。程序员将图像作为输入提供并查看输出节点出来的内容。如果网络回应“飞机”，程序员会告诉你它是错误的。然后网络对其连接进行调整，这会改变节点之间不同链接的权重。此操作由添加到网络中的特定学习算法控制。网络会扩展以调整连接权重，直到提供正确的输出。这是一个简化，但神经网络可以使用类似的原理学习非常复杂的运算。


    ### 持续改进


    即使在训练之后，反向传播仍会继续，这就是神经网络变得很酷的地方。它们在被使用时继续学习，整合新信息并对不同连接的重要性进行调整，在它们被设计用于的任务中变得越来越高效和有效。这可能像图像识别一样简单，也像下围棋一样复杂。以这种方式，神经网络总是变化和改进。这可能会产生惊人的效果，导致网络优先考虑程序员不会优先考虑的事情。除了上面描述的过程之外，该过程称为监督学习，还有另一种方法：无监督学习。在这种情况下，神经网络接收输入并尝试在其输出中精确地重现它，使用反向传播来更新其连接。它听起来可能像是一项无用的练习，但以这种方式，网络学会提取有用的特征并将这些特征推广以改进其模型。


    ## 深度困境


    反向传播是一种非常有效教授神经网络的方式……当它们只有几层深时。随着隐藏层数量的增加，反向传播的效率会下降。这对深度网络来说是个问题。有了反向传播，它们通常与简单网络一样有效。研究人员已经演化出几种解决这个问题的方案，其具体细节相当复杂，超出了本入门部分的范围。许多这些解决方案试图做的事情很容易通过训练网络“压缩”数据来减少网络的复杂性。

    ![neural net pruning](img/image335.jpg)

    为此，网络学习提取输入中较少数量的识别功能，最终在计算中变得更有效。网络进行概括和抽象，就像人们学习一样。在这种学习之后，网络可以剪掉它认为不太关键的节点和连接。这使得网络更加有效，学习变得更容易。


    ## 神经网络应用


    因此，神经网络通过使用多层节点——输入、隐藏和输出来模拟大脑如何学习，它们可以在监督和无回答的情况下学习。复杂的网络可以进行抽象和概括，使它们更具生产力并更善于学习。我们可以用这些系统做什么？从理论上讲，我们可以为几乎任何事情练习神经网络。而且你肯定在不理解的情况下使用过它们。它们在语音和视觉识别中非常常见，例如，因为它们可以学习选择声音或图像共有的特定特征。所以当你问
    Siri 8 你可能没有意识到 Siri 可以做的事情 8 你认为 Siri 不能做的事情 Siri 已成为 iPhone 的决定性特征之一，但对许多人来说，它并不总是很有用。虽然其中任何一个都归因于语音识别的限制，使用……的奇怪之处。阅读更多
    在哪里最近的加油站，你的 iPhone 会将你的语音通过神经网络以找出你正在说什么。可能有不同的神经网络学习预测你可能请求的不同事情。

    ![siri icon](img/image346.jpg)

    自动驾驶汽车可以使用神经网络处理视觉数据，从而遵守道路规则并避免碰撞。各种各样的机器人都可以从帮助它们有效地完成任务的神经网络中受益。计算机可以学习玩象棋、围棋和雅达利经典游戏。如果你曾经与聊天机器人交谈过，有可能是神经网络提供适当的答案。互联网搜索可以从神经网络中受益，因为高效的并行处理模型可以快速处理大量数据。神经网络还可以教你你的习惯来自定义你的搜索结果或预测你接下来要寻找的内容。这种预测模型对营销人员（以及任何需要预测复杂人类行为的人）来说非常有价值。图像识别，光学字符识别
    提取图像文本的 5 款最佳 OCR 工具 从图像中提取文本的 5 款最佳 OCR 工具 当你有纸张喷射时，你如何将所有手写文本转换为数字程序能够识别和索引的东西？请在附近保留良好的
    OCR 软件。阅读更多，股票市场预测，路线搜索，大数据处理，医疗成本分析，销售预测，电子游戏 AI……可能性几乎无穷无尽。神经网络学习模式、概括和成功预测行为的能力使其在无数情况下具有价值。


    ## 神经网络的未来


    神经网络已从简单的模型发展到非常复杂的学习模拟。它们在我们的手机、平板电脑中运行，并运行我们使用的许多网络服务。还有许多其他机器学习系统。但由于神经网络与人类大脑的相似性（以极度简化的方式），它们是最迷人的。随着我们继续开发和完善模型，没有人说它们能做什么。


