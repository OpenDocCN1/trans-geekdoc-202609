  trans: '


    # 深度学习参数与超参数


    ## 什么是超参数？


    超参数是用于训练模型并控制训练过程本身的可调参数。例如，要训练一个深度神经网络，你必须在训练模型之前决定网络中隐藏层的数量以及每一层的节点数。这些值在训练过程中通常保持不变。


    在深度学习或机器学习场景中，模型的性能在很大程度上取决于所选超参数值。超参数探索的目标是在不同的超参数配置之间进行搜索，直到找到导致最佳性能的配置。


    通常，探索超参数的过程是一项非常繁琐的手工工作，因为搜索空间非常庞大，并且评估每个配置可能成本很高。


    Azure Machine Learning 允许你高效地自动化超参数扫描，为你节省大量时间和资源。指定超参数值的范围和最大训练系列数。系统随后会自动启动多个同时进行的系列，使用不同的参数设置，并寻找导致最佳性能的配置，该性能由你选择的指标衡量。


    低性能训练系列会自动提前终止，从而减少了流程资源的浪费。相反，这些资源被用于探索其他超参数配置。


    ## 搜索空间的定义


    通过扫描为每个超参数定义的值范围来自动调整超参数。


    ## 超参数的类型


    每个超参数可以是离散的或连续的。


    ### 离散超参数


    离散超参数使用在离散值之间的对象 choice 指定。可以是：


    * 用逗号分隔的一个或多个值；

    * 一个对象范围；

    * 任意列表对象。


    ![](img/image382.jpg)在此情况下，`batch_size` 取 `[16, 32, 64, 128]` 中的一个值，而 `number_of_hidden_layers`
    取 `[1, 2, 3, 4]` 中的一个值。


    高级离散超参数也可以通过分布来指定。支持以下分布：


    * `quniform(low, high, q)`: 返回一个值 round (uniform (low, high) / q) * q

    * `qloguniform(low, high, q)`: 返回一个值 round (exp (uniform (low, high)) / q) * q

    * `qnormal(mu, sigma, q)`: 返回一个值 round (normal (mu, sigma) / q) * q

    * `qlognormal(mu, sigma, q)`: 返回一个值 round (exp (normal (mu, sigma)) / q) * q


    ### 连续超参数


    连续超参数通过连续值范围的分布来指定。支持的分布有：


    * `Uniform(low, high)`: 返回一个在 low 和 high 之间均匀分布的值。

    * `log-uniform(low, high)`: 返回一个根据 exp (uniform (low, high)) 提取的值，使得返回值的对数均匀分布。

    * `Normal(mu, sigma)`: 返回一个半为 mu、标准差为 sigma 的正态分布的实值。

    * `Lognormal(mu, sigma)`: 返回一个根据 exp (normal (mu, sigma)) 提取的值，使得返回值的对数呈正态分布。


    以下是参数空间定义的示例：


    ![](img/image411.jpg)此代码描述了一个包含两个参数的搜索空间：`learning_rate` 和 `keep_probability`。它具有均值为
    10、标准差为 3 的正态分布。它具有最小值为 0.05、最大值为 0.1 的均匀分布。


    `learning_rate`

    `keep_probability`


    ## 采样超参数空间


    你可以在超参数空间定义期间进一步指定将使用的参数采样方法。Azure Machine Learning 服务支持随机采样、网格采样和贝叶斯采样。


    ### 随机采样


    在随机采样中，超参数等级从指定的搜索空间中随机选择。随机采样提供的搜索空间可包含离散和连续超参数。


    ![](img/image420.jpg)


    ### 网格采样


    网格采样对定义搜索空间的所有可能值执行简单的网格搜索。它只能与使用指定的超参数一起使用。例如，以下空间总共有六个样本：`choice`


    ![](img/image426.jpg)


    ### 贝叶斯采样


    贝叶斯采样以贝叶斯优化算法为中心，并对下一次采样的超参数值做出智能决策。采样是基于之前样本的执行情况进行的，以使新样本改善已通知的主要指标。


    使用贝叶斯采样时，同时运行的数量会影响调整过程的有效性。通常，较少的并发执行可能导致采样的更好收敛，因为较低的并行度增加了受益于先前已完成执行的执行次数。


    贝叶斯采样仅在搜索空间中支持 `choice` 和 `uniform` 分布。


    ![](img/image434.jpg)


    注意 贝叶斯采样不遵循任何提前终止策略（参见提前终止指令的规范）。使用贝叶斯参数采样时，将值设置为，或不添加参数 `early_termination_policy
    = None` `early_termination_policy`


    ## 主要指标的指定


    指定你希望通过超参数调整实验进行优化的主要指标。在每个训练系列中，主要指标都会被评估。性能不佳的执行（主要指标未达到提前终止指令设定的标准）将被终止。


    除了主要指标的名称外，还将指定优化目标：是最大化还是最小化主要指标。


    * `primary_metric_name`: 要优化的主要指标的名称。主要指标的名称必须与训练脚本记录的指标名称完全匹配。参见为超参数调整注册指标。

    * `primary_metric_goal`: 它可以是 `PrimaryMetricGoal.MAXIMIZE` 或 `PrimaryMetricGoal.MINIMIZE`，并决定在评估执行时主要指标将被最大化还是最小化。


    ![](img/image452.jpg)优化执行以最大化“precision”。确保在训练脚本中记录此值。


    ## 为超参数调整注册指标


    模型的训练脚本必须在模型训练期间记录相关指标。在配置超参数设置时，你必须指定将用于评估执行性能的主要指标。（参见主要指标优化的规范）。


    在训练脚本中，你必须记录此指标，以便超参数调整过程可以使用它。


    使用以下示例代码片段记录训练脚本的指标：


    ![](img/image460.jpg)训练脚本计算 `val_accuracy` 的值并将其注册为“precision”，用作主要指标。每次记录指标时，超参数调整服务都会接收到它。是模型开发者必须确定此指标报告的频率。


    ## 提前终止指令的指定


    借助提前终止策略自动结束性能低下的执行。完成可减少资源的浪费，这些资源可用于探索其他参数设置。


    使用提前终止策略时，可以配置以下控制策略应用时机的参数：


    '
