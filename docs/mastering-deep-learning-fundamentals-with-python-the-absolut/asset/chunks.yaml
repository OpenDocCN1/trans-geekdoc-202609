    \n![Insert current_node.next to new_node.](img/image2305.jpg)\nInsert current_node.next\
    \ to new_node.\n\n将 `new_node` 分配给 `current_node`。接下来我们又有了一个完整的列表。如果按此顺序执行，我们无需担心丢失任何节点。想想如果我们跳过步骤\
    \ 2 而直接将新节点分配给 `current_node.next` 会发生什么。\n\n如前所述，有许多类型的数据结构。对于列表，你可以查看数据结构列表。在这里，我们提出了三种最常见的。希望你对它们的工作原理有所了解。\n\
    \n"
