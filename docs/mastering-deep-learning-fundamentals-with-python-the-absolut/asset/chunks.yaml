- raw: "Features and Benefits A major advantage of convolutional networks is the use\
    \ of a unique weight associated with the signals entering all the neurons of the\
    \ same convolution core. This method reduces the memory footprint, improves performance\
    \ and allows translation processing invariance. This is the main advantage of\
    \ the convolutional neural network concerning the multilayer perceptron, which\
    \ considers each independent neuron and therefore assigns a different weight to\
    \ each incoming signal . When the input volume varies in time (video or sound),\
    \ it becomes interesting to add a parameter along the time scale in the setting\
    \ of neurons. In this case, we will speak of a neural network with a time delay\
    \ (TDNN). Compared to other image classification algorithms, convolutional neural\
    \ networks use relatively little pre-processing. This means that the network is\
    \ responsible for changing its filters by itself (learning without supervision),\
    \ which is not the case for other, more traditional algorithms. The absence of\
    \ initial parameterization and human intervention is a major asset of CNN. Difference\
    \ between Comparative Convolutional Neural Networks and Multilayer Perceptron\
    \ Although effective for image processing, Multilayer Perceptrons (MLPs) have\
    \ difficulty handling large images, due to the exponential growth in the number\
    \ of connections with the size of the image, as each neuron is \"totally connected\"\
    \ to each of the neurons of the previous and next layer. The convolutional neural\
    \ networks, whose principle is inspired by that of the vertebrate visual cortex,\
    \ on the contrary limits the number of connections between a neuron and the neurons\
    \ of the adjacent layers, which drastically decreases the number of parameters\
    \ to be learned. For a deep network such as AlexNet for example, more than 90%\
    \  of the parameters to be learned are due to 3 layers \"Fully connected\" deepest,\
    \ and the rest relates to the (5) convolutional layers. One layer of the CNN in\
    \ 3 dimensions (green = volume of entry, the blue = volume of the receiving field,\
    \ grey = layer of CNN, circles = independent artificial neurons) For example,\
    \ if we take an image size 32 × 32 × 3 (32 wide, 32 high, 3 colour channels),\
    \ a single fully connected neuron in the first hidden layer of the MLP would have\
