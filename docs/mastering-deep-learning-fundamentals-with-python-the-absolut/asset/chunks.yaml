    examined. Again, the new re-use of multi-dimensional spaces in a different way


    At the point where Artificial Neural Networks (`ANNs`) remained in the late 1990s,
    a so-called Support Vector Machine became a promising method of dealing with the
    complexity that `ANN` could not cope with. In this method, complex problems, space
    structures in mathematics and functions that allow the transition between these
    spaces were used to get rid of complexity. Of course, artificial neural networks
    also required processing in multi-dimensional spaces, but there was no transition
    between spaces. According to these very complex mathematical methods, such as
    doors used in a space size in the film pass, kernel function (`kernel functions`)
