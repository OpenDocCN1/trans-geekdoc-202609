    # 非线性激活函数


    比例关系通常是特例。非线性函数使得分离非线性可分的数据成为可能。它们是最常用的激活函数。输入与输出之间的对应关系由非线性方程控制。![](img/image717.jpg)


    使用非线性激活函数是必不可少的，原因很简单：线性函数仅适用于神经元的单层。因为在神经元层之外，反复应用相同的线性激活函数将不再对结果产生任何影响。换句话说，要解决复杂问题，使用非线性函数是强制性的。让我们通过示例来看：


    看下面的图片；我们有两种用蓝色和橙色表示的数据。目标是分离它们；使用线性激活函数就足够了。红线代表激活函数产生的决策边界。决策边界源于函数执行的逻辑回归，即数据的分类。在这种情况下，数据被很好地分离，因此我们仅通过简单的线性函数就能达到
    100% 的成功率。![](img/image723.jpg)


    让我们继续另一个情况，我们仍然有两种类型的数据，但这次分类方式不同。由于逻辑回归是线性的，因此不可能放置决策边界以完美地分离蓝色表示的数据和橙色表示的数据。分类数据的成功率只有约
    50%（下图）。我们在这里的情况还很简单，两种类型的数据很容易区分，但线性激活函数不足以胜任。![](img/image728.jpg)


    因此，为了正确分离这些数据，需要一个执行进一步逻辑回归的非线性激活函数。下图表示与前一个相同的情况，但这次我们使用了非线性激活函数。我们的两种类型数据现在被完美地分离了（下图）。![](img/image733.jpg)


    另一个关键点是，神经元处理的数据可能达到惊人的大值。线性函数不会修改输出，从神经元到神经元传输的数据值可能会变得更大且计算更复杂。为了解决这个问题，非线性激活函数通常以简单概率的形式降低神经元的输出值。


    ## 非线性激活函数的类型


    ### Sigmoid


    该函数的主要目的是将输入值降低到 0 到 1 之间。除了将值表示为概率外，如果输入值是非常大的正数，该函数会将该值转换为概率 1 的值。相反，如果输入值是非常大的负数，该函数会将该值转换为概率
    0。另一方面，曲线的方程是这样的，只有较小的数值会影响输出值的变化。下图表示 sigmoid 函数：![](img/image742.jpg)


    Sigmoid 函数有几个缺点：

    它不是以零为中心，也就是说，负输入可能产生正输出。它比较平坦，对神经元的影响相对较弱，与其他激活函数相比。结果往往非常接近 0 或 1，导致某些神经元饱和。它在计算上昂贵，因为它包含指数函数。


    ### tanh


    Tanh 函数也称为“双曲正切”。![](img/image752.jpg)


    该函数与 Sigmoid 函数相当。与 Sigmoid 函数的区别在于，Tanh 函数产生的结果在 -1 和 1 之间。Tanh 函数通常优于 Sigmoid
    函数，因为它以零为中心。较大的负输入趋向于 -1，较大的正输入趋向于 1。除了这个优点之外，Tanh 函数具有与 Sigmoid 函数相同的其他缺点。


    ### Relu


    为了解决前面两个函数（Sigmoid 和 Tanh）的饱和困难，存在 ReLU 函数（线性校正单元）。该函数是最常用的。![](img/image759.jpg)


    ReLU 函数由公式解释：`f(x) = max(0, x)`。如果输入无效，输出为 0，如果为负，则输出为 x。该激活函数大大提高了网络收敛速度且不会饱和。但
    ReLU 函数并不完美。如果输入值为负，神经元保持不活跃，因此权重不会更新，网络无法学习。


    ### Leaky ReLU


    ![](img/image766.jpg)


    Leaky ReLU 函数由公式解释：`f(x) = max(0.1x, x)`。Leaky Relu 函数试图在输入为负时修正 ReLU 函数。Leaky
    ReLU 的概念是当输入为负时，它将具有 0.1 的小正斜率。该函数在一定程度上消除了 ReLU 函数在负值下不活跃的问题，但使用它获得的结果并不一致。它仍然保留了
    ReLU 激活函数的特性，即计算高效，在正区域收敛得更快且不饱和。


    ### Parametric ReLU


    Leaky ReLU 函数的思想可以进一步扩展。不是将 x 乘以一个常数项，我们可以将其乘以一个超参数，该超参数似乎比 Leaky ReLU 函数效果更好。对
    Leaky ReLU 函数的这种扩展被称为参数化 ReLU。参数化 ReLU 函数由公式解释：`f(x) = max(ax, x)` 其中 `a` 是一个超参数。这使神经元能够选择负区域的最佳斜率。凭借这种能力，参数化
    ReLU 函数可以成为经典的 ReLU 函数或 Leaky ReLU 函数。最常见的是更倾向于使用 ReLU 函数，其另外两个版本（Leaky ReLU 和参数化
    ReLU）是实验性的，没有真正的附加价值。


    多年来，使用了各种函数。在本节中，只提到了主要函数。目前，仍有很多研究需要做，以找到合适的激活函数，使神经网络能够更高效、更快速地学习。


    '
