    In Python, you can learn object-oriented programming (programming and use of windows,
    buttons and the like) without understanding many of the complex details beforehand.
    Later you can then, if desired, familiarize yourself with the technique behind
    the construction. Python is a beginner-friendly computer language that automatically
    controls many of the complex details behind the scene. It allows you to use the
    power of the overall things in your project without having to dig in depth for
    every step.


    Here, too, let us anticipate the events a bit and see the following example, which
    may also interest the experienced Java, C ++ or Delphi programmer.


    ```

    >>> from Tkinter import Label

    >>> widget = Label()

    ```


    There should probably have been 1 program line more in the example shown. In this
