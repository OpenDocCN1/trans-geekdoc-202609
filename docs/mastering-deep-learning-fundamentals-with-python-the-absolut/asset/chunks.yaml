    column represents information about that person, such as its name, his address,
    his email address, his purchases and his browsing history. In this situation,
    the location of rows and columns does not matter. Lines can be re-arranged, and
    columns can be reordered without losing the importance of the data. On the other
    hand, rearranging the rows and columns of an image makes it completely intractable.


    A general rule: if your data remains as exploitable after exchanging some columns
    between them, you probably cannot use the convolutional neural networks. Nevertheless,
    if you can make your problem look like looking for patterns in an image, CNNs
    can be exactly what you need.

    '
  trans: '


    # 卷积神经网络


    脊椎动物的视觉皮层直接启发了卷积神经网络。卷积神经元的网络也称为 convent（“卷积网络”），或 `CNN`（“卷积神经网络”）。我们区分两个部分，第一部分称为模型的卷积部分，第二部分，我们称之为模型的分类部分，对应于模型
    `MLP`（多层感知器）。


    ![](img/image783.jpg)


    它是一个多层神经元网络，更准确地说它是一个深度网络，由多个层组成，通常按块组织（`CONV` → `RELU` → `POOL`）。卷积神经网络有四种类型的层：卷积层、池化层、ReLU
    修正层和全连接层。


    ![](img/image788.jpg)


    ## 卷积层


    卷积层是卷积神经网络的关键组件，至少也是其第一层。其目的是定位输入图像中一组特征的存在。为此，我们执行卷积滤波：原理是“拖动”代表特征的窗口在图像上，并计算特征与扫描图像的每个部分之间的卷积积。一个特征然后被视为一个滤波器：在这种情况下，这两个术语是等价的。


    三个超参数可以确定卷积层的体积大小。


    层深度：卷积核的数量（或与同一接收场相关联的神经元数量）。


    步长控制接收场的重叠。步长越小，接收场重叠越多，输出体积越大。


    边缘处的边距（为 0）或零填充：有时，在输入体积的边界处放置零是方便的。这个零填充的大小是第三个超参数。这个边距可以控制输出体积的空间维度。特别是，有时希望保持与输入体积相同的面积。


    ## 池化层：池化


    这种类型的层通常放置在两个卷积层之间：它接收多个特征图作为输入，并对每个特征图应用池化操作。池化（或子采样）操作在于在保留其重要特征的同时减小图像的大小。为此，图像被切分为规则的单元；然后在每个单元内保留最大值。实际上，通常使用小的正方形单元以避免丢失太多信息。最常见的选择是不重叠的
    2 × 2 像素的相邻单元，或间隔 2 像素的 3 × 3 像素单元（因此会重叠）。


    输出的特征图数量与输入相同，但要小得多。池化层减少了网络中的参数数量和计算量。这提高了网络的效率并避免了过拟合。


    在 ConvNet 架构中，通常在连续的 Conv 层之间定期插入一个 Pooling 层。其功能是逐渐减小表示的空间大小以减少网络中的参数数量和计算量，从而也控制过拟合。


    池化层独立地对输入的每个深度槽操作并在空间上调整其大小，使用 MAX 操作。因此，池化层使网络对特征的位置不那么敏感：特征稍微高一点或低一点，甚至方向略有不同，都不应导致图像分类的根本性变化。


    ## ReLU 层


    为了通过在处理层之间交错来提高处理的效率，一个层将对输出信号执行数学函数（激活函数）。在这种情况下我们找到 ReLU（Rectified Linear Units）指的是实际的非线性函数。定义为
    `ReLU(x) = max(0, x)`。


    ReLU 修正层因此用零替换所有作为输入接收的负值。它起着激活函数的作用


    通常，Relu 修正是可取的，但还有另一种形式。


    双曲正切修正 `f(x) = tanh(x)`，

    饱和双曲正切修正：`f(x) = | tanh(x) |`，

    sigmoid 函数修正 `f(x) = (1 + e ^ {- x}) ^ {- 1}`。`f(x) = (1 + e -x ) -1`


    ## 全连接层


    全连接层始终是神经网络的最后一层，无论是卷积还是非卷积——因此它不是 CNN 的特征。这种类型的层接收输入向量并产生新的输出向量。为此，它对接收到的输入值应用线性组合并可选地应用激活函数。


    全连接层对网络的输入图像进行分类：它返回一个大小为 N 的向量，其中 N 是我们图像分类问题中的类别数。向量的每个元素表示输入图像属于某个类别的概率。


    例如，如果问题在于区分猫和狗，最终向量将为大小 2：第一个元素（分别第二个）给出属于“猫”类别（分别“狗”）的概率。因此，向量 `[0.90.1]` 意味着图像有
    90% 的机会代表一只猫。


    输入数组的每个值都“投票”支持某个类别。投票并不都具有同等重要性：该层为它们赋予权重，这些权重取决于表中的元素和类别。为了计算概率，全连接层因此将每个输入元素乘以权重，相加，然后应用激活函数（如果
    N = 2 则为 logistic，如果 N> 2 则为 softmax）：


    可以用卷积层替换全连接 CNN 层，这使其完全卷积。全卷积网络是一个好主意。我邀请你去发现它。


    ## 开始


    为了帮助我们理解卷积神经网络的工作原理，我们将借助一个简化示例并尝试确定图像是否代表 X 或 O。我们的 CNN 只有一个任务要执行：每次我们展示一张照片时，它必须决定这张照片是否代表
    X 或 O。他认为在每种情况下，只能有‘要么’。


    ![](img/image825.jpg)


    对于计算机来说，图像不就是一个二维像素的数组（一种巨大的棋盘）吗，每个方格包含一个特定的数字：


    在我们的例子中，值为 1 的像素是白色像素，-1 是黑色。


    ![](img/image830.jpg)


    ### 特征 - 特征。


    CNN 按片段比较图像。它寻找的片段称为特征。特征对应于图像的片段。


    ![](img/image837.jpg)


    通过找到在 2 个不同图像中大致相似的近似特征，CNN 比通过完整的图像到图像比较更能检测相似性。


    ![](img/image842.jpg)


    每个特征就像一个迷你图像，即一个二维值的数组。特征汇集了图像中最常见的方面。在显示 X 的图像的情况下，定义两个对角线及其相交的特征代表 X 的最常见特征。这些特征可能对应于任何
    X 图像的手臂和中心。


    ![](img/image847.jpg)


    ### 卷积


    当呈现包括新图像时，CNN 不完全知道特征是否会出现在图像中或它们可能位于何处，因此它试图在整个图像和任何位置中找到它们。


    ![](img/image853.jpg)


    通过在整个图像中计算特征是否存在，我们进行滤波。我们用来执行此操作的数学称为卷积，这也是卷积神经网络得名的原因。


    要计算特征与图像子部分之间的对应关系，只需将特征的每个像素乘以图像中该相同像素包含的值。然后，将响应相加并将结果除以特征中的像素总数。


    如果 2 个像素都是白色（值 1）则 1 * 1 = 1。如果两者都是黑色，则 (-1) * (-1) = 1。在所有情况下，每个匹配的像素都会产生 1。同样，每个偏移都会产生
    -1。如果特征中的所有像素都匹配，则它们的相加然后除以像素总数会得到 1。同样，如果特征的任何像素都不对应于图像的子部分，则答案为 -1。


    ![](img/image860.jpg)


    要完成卷积，可以重复此过程，将特征与图像的每个子部分对齐。然后我们取每个卷积的结果并创建一个新的二维表。这个匹配图也是原始图像的滤波版本。它是一张地图，显示特征在图像中被找到的位置。


    ![](img/image865.jpg)


    接近 1 的值显示强匹配；接近 -1 的值显示对功能摄影负片的强匹配，而接近 0 的值与任何类型都不对应。


    ![](img/image870.jpg)


    ![](img/image874.jpg)


    一张图像变成一堆滤波图像。


    ![](img/image879.jpg)


    下一步是对每个其他现有特征重复完整的卷积过程。结果是一组滤波图像，每张图像对应一个特定的滤波器。建议将这组卷积操作视为一个单一的处理步骤：在卷积神经网络中，这称为卷积层，这表明最终会添加其他层。


    虽然原理相对简单，我们可以在毛巾背面轻松解释我们的 CNN，但加法、乘法和除法的数量会迅速累积。从数学上讲，它们随着图像中像素的数量、每个特征的像素数量线性增加。如此众多的因素，很容易使这个问题变得无限复杂。因此，微处理器制造商现在制造专门用于
    CNN 所需操作的专用芯片也就不足为奇了。


    ## 池化层


    池化是一种方法，可以取一个大图像并在保留其包含的最重要信息的同时减小其大小。池化概念背后的数学再次并不复杂。确实，只需逐步将一个小窗口拖动到图像的所有部分，并在每次步骤中取该窗口的最大值。实际上，通常使用
    2 或 3 个像素的窗口和 2 像素的值作为步长值。


    池化：减少图像堆栈


    选择窗口大小（通常为 2 或 3）。

    选择步长（通常为 2）。

    浏览你的滤波图像的窗口。

    从每个窗口中取最大值。


    ![](img/image894.jpg)


    池化后，图像仅剩下其起始像素的四分之一。


    ![](img/image898.jpg)


    因为它在每个步骤中保留窗口中包含的最大值，所以它保留了该窗口的最佳特征。这意味着它不在乎特征是从窗口的哪个位置提取的。结果是 CNN 可以找到图像中是否存在特征，而不管它在何处。这有助于特别解决与计算机超文学相关的问题。


    ![](img/image904.jpg)


    最终，池化层只是在图像或图像集合上进行池化过程。输出将具有相同数量的图像，但每个图像将具有更少的像素。这将减少计算负担。例如，它将 800 万像素的图像转换为
    200 万像素的图像，这将使稍后要执行的其余操作变得容易得多。


    ## 整流线性单元（ReLU）归一化


    将所有负数改为零。


    ![](img/image912.jpg)


    整个过程中的一个重要元素是整流线性单元或 ReLU。这一概念背后的数学再次相当简单：每当像素中存在负值时，它就会被 0 替换。因此，CNN 被允许保持健康（在数学意义上）通过防止学习的值停留在
    0 附近或爆炸到无穷大。


    ![](img/image916.jpg)


    它是一个不性感但基本工具，因为没有它，CNN 就不会产生我们所知道的结果。ReLU 层的输出与输入的大小相同，只是所有负值都被删除。一个的输出成为下一个的输入。


    ![](img/image923.jpg)


    ## 深度学习


    ![`miro.medium.com/max/700/0*HWjBSG5tB9XtVEnd.`](img/image928.jpg)


    你可能已经注意到，你给每个层输入的内容（即二维数组）与你在输出处得到的内容（其他二维数组）非常相似。因此，我们可以像乐高积木一样一个接一个地添加它们。原始图像被滤波、校正和池化，以创建在每个图像中可见的缩小且特征滤波的图像集。这些可以再次被滤波和缩小。每次，特征变得更大更复杂，图像变得更紧凑。这允许较低的层表示图像的简单方面，例如光边和点。较高的层表示图像的更复杂方面，例如形状和模式。这些往往很容易识别。例如，在训练用于识别人脸的
    CNN 中，较高的层表示人脸的一部分的模式和模式（1）。


    ## 全连接尿布


    ![`miro.medium.com/max/657/0*eOpPyVVPU7jTA8gH.`](img/image935.jpg)


    CNNs 在它们的工具箱中还有另一支箭。事实上，全连接层取高层滤波图像并将它们翻译成投票。在我们的例子中，我们只需要决定 X 和 O 两个类别之间。全连接层是传统神经网络的主要构建块。它们不是将输入视为二维数组，而是将它们视为单个列表并同等对待。每个值都投票决定图像是
    X 还是 O。然而，过程并不完全民主。一些值比其他值更能检测图像是 X，而另一些值更能检测 O。因此，它们比其他值具有更大的投票权。这种投票称为权重，或连接相应值和每个类别之间的强度。


    当向 CNN 显示新图像时，它会通过较低的层传播，直到到达最终的全连接层。然后进行选举。票数最多的解决方案获胜并被宣布为图像的类别。


    ![`miro.medium.com/max/700/0*TFoomaHKXGaaVcng.`](img/image941.jpg)


    全连接层与其他层一样可以一个接一个地添加，因为它们的输出值（投票列表）与它们的输入值（值列表）非常相似。实际上，通常会一个接一个地添加多个全连接层，每个中间层为“隐藏”的幽灵类别投票。事实上，每个额外的层让网络学习有助于改进决策的特征的更复杂组合。


    ## 反向传播


    ![`miro.medium.com/max/611/0*Z-4PVr6SmhdbjR6F.`](img/image946.jpg)


    即使我们的 CNN 分析进展顺利，仍然缺少一些东西：特征来自哪里？我们如何定义全连接层的权重？如果你必须手动选择所有内容，CNNs 会比它们现在更受欢迎。幸运的是，有一个非常重要的概念为我们做了这项工作：反向传播。


    为了能够使用反向传播，我们必须有一组我们已经知道要选择的类别的图像。这意味着一些有爱心（和耐心）的灵魂已经提前分析了成千上万的图像，并将每个图像与其各自的类别相关联，X
    或 O。这些图像因此被用于尚未驱动的 CNN，这意味着每个特征的每个像素和每个全连接层的每个权重都配置为随机值。


    之后，我们开始一次又一次地向 CNN 拍摄图像。对于 CNN 分析的每张图像，都会得到一个投票。我们在分类中犯的错误数量然后告诉我们我们的特征和权重的质量。然后可以调整特征和权重以减少错误。每个值都会增加或减少，并且每次都会重新计算网络的新误差值。无论做出什么调整，如果误差减小，则该拟合将被保留。


    在对每个特征的每个像素、每个卷积层和每个全连接层的每个权重执行此操作之后，新的权重为该图像提供了一个工作略好的响应。然后用具有标签的其他每个图像重复此过程。仅出现在罕见图像中的元素很快就会被遗忘，但在大数量图像中定期发现的模式会被特征和连接权重保留。


    如果有足够的标记图像，这些值会在一组对各种情况都相当有效的数值上稳定下来。显而易见，反向传播是另一个昂贵的计算步骤，也是专用计算机硬件的另一个动机。


    ## 超参数


    不幸的是，CNN 的所有方面都不是像我们到目前为止所看到的那样直观易学。因此，始终有一长串必须手动设置的参数才能使 CNN 取得更好的结果。


    对于每个卷积层，应该选择多少个特征？每个特征中应考虑多少个像素？

    对于每个池化层，应该选择哪个窗口大小？什么不？

    对于每个额外的全连接层，应该定义多少个隐藏神经元？


    此外，除了这些参数之外，还有其他更高层次的架构元素需要考虑：应该包含多少个每种类型的层？按什么顺序？一些深度学习模型可以有超过一百层，这使得可能性的数量极其重要。


    由于存在如此多的可能组合和排列，到目前为止只测试了可能配置的一小部分。CNNs 的不同设计通常由科学界积累的知识所激励，偶尔会出现一些差距，从而在性能上带来惊人的改进。尽管我们以相对简单和直观的方式介绍了构建
    CNNs 的主要构建块，但已经测试了大量变体和设置，并取得了非常好的结果，例如新型层和更复杂的层间连接方式。


    ## 超越图像


    ![`miro.medium.com/max/586/0*oAqI5qw7e5wPh6g6.`](img/image966.jpg)


    尽管我们用 X 和 O 的例子涉及图像的使用，但 CNNs 也可以用于对其他类型的数据进行分类。诀窍是：无论你处理什么类型的数据，都将该数据转换为使其看起来像图像。


    例如，音频信号可以分解为较短持续时间的较小的片段，并将每个片段分解为低、中、高甚至更细的频率带。这可以用二维数组表示，其中每一列是一个时间块，每一行是一个频率带。彼此靠近的“像素”的假图像密切相关。在这些情况下
    CNNs 工作得很好。


    科学家们特别有创意。在类似的方法中，他们已将文本数据改编用于自然语言处理，甚至将化学数据改编用于药物发现。


    ![](img/image974.jpg)


    一种不适合这种格式的特定数据类型是所有“客户数据”，其中表的每一行代表一个客户，每一列代表有关该人的信息，例如其姓名、地址、电子邮件地址、购买和浏览历史。在这种情况下，行和列的位置并不重要。行可以重新排列，列可以重新排序而不会丢失数据的重要性。另一方面，重新排列图像的行和列会使其完全无法处理。


    一条通用规则：如果你的数据在交换它们之间的某些列后仍然可以利用，你可能无法使用卷积神经网络。然而，如果你能使你的问题看起来像是在图像中寻找模式，CNNs 可能正是你所需要的。


    '
