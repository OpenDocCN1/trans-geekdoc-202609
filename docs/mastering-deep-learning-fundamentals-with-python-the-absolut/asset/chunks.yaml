    # 统计学基础


    统计学习理论是统计学和泛函分析领域中的机器学习体系。统计学习理论处理基于数据寻找预测函数的问题。统计学习理论已在计算机视觉、语音识别、生物信息学和棒球等领域得到应用。学习的目的是预测和理解。学习涉及多个类别，包括监督学习、无监督学习、学习和强化学习。从统计学习理论来看，监督学习是最合适的。


    监督学习涉及从一组训练数据中学习。形成的每个点都是输入-输出对，其中输入对应于输出。学习问题是推断输入和输出之间的映射函数，以便学习到的函数可用于预测未来输入的输出。


    根据输出类型，监督学习问题要么是回归问题，要么是分类问题。如果输出取连续范围的值，则为回归问题。以欧姆定律为例，可以以电压作为输入、电流作为输出进行回归。回归将找到电压和电流之间的函数关系


    ![](img/image114.jpg)![](img/image118.jpg)


    # 线性代数基础


    函数 `f`，或我们之前称之为模型，是将输入数据 `x` 转换为结果 `y` 的机制。函数由以下类型的方程表征：


    ![picture](img/image130.jpg)


    如果数据 `x` 由一个分量或维度组成，我们称之为标量；如果它由以下几个分量组成：


    ![picture](img/image135.jpg)


    则称为向量。所有可以构造的向量 `x` 的集合称为空间。在空间中，至少存在一个向量子集，可以通过加法或乘法组合来获得整个空间；该向量子集称为基。


    矩阵是向量概念的推广：它是向量向量或二维数组。可以将矩阵彼此相加和相乘，矩阵与向量之间，以及矩阵与向量相乘。矩阵在记法上非常有用，因为它们能够以密集的方式书写函数的方程！


    我们可以将向量 `x` 的范数定义为该向量到原点的距离。后者记为如下：


    ![Description: picture](img/image143.jpg)


    特别地，我们区分：


    标准 2 或欧几里得距离：


    ![picture](img/image149.jpg)


    标准 1 或绝对值：


    ![picture](img/image154.jpg)


    范数的概念也可以推广到矩阵，这里不详细说明。


    ## 插值


    给定一组点的历史，插值意味着确定穿过所有这些点的函数。通常，我们使用多项式插值。这可能是一种回归方法。然而，这种方法通常被避免，因为它经常导致过学习。


    ## 方程的监督学习


    为了评估分类器 `f` 的性能，我们首先定义一个代价函数 `L`，它将给出预测 `f(x)` 与真实值 `y` 之间误差的度量。通常，代价函数被选为与要预测的结果之差的平方；这是最小二乘近似：


    ![](img/image164.jpg)


    然后，我们定义一个误差函数 `R`，它衡量真实值 `y` 与预测 `f(x)` 之间的差异之和。


    ![](img/image169.jpg)


    其中 `n` 是历史中元素的数量


    因此，进行回归就是找到使误差最小化的函数 `f`：


    ![](img/image175.jpg)


    如何获得函数的最小值？重要的是要指出 `f` 是一个形式已知的函数（例如，线性函数 `y = a * x + b`）。要确定 `f`，只需确定其参数即可。（在线性函数的情况下，参数是
    `a` 和 `b`）。这些参数通过最小化误差函数 `R` 得到。


    在大多数情况下，有精确的方法来最小化 `R`，但对机器来说计算操作非常昂贵。通常，更快的方法是通过对参数值进行多次测试来估计参数值。由于参数取的值是无限的，因此有必要巧妙地进行这些测试。为此，我们使用优化方法，最为人所知的是梯度法。


    ## 线性回归


    ### 简单回归 - x 是标量


    线性回归是一种监督学习方法，用于在假设 `f` 具有线性形式的情况下估计 `f`：


    ![](img/image185.jpg)


    确定 `f` 然后就在于在最小化函数 `R` 的同时找到 `a` 和 `b`：


    ![](img/image190.jpg)


    如前所述，可以使用梯度法求解该方程。


    ### 多元回归 - x 是向量


    在这种情况下，


    ![](img/image197.jpg)


    其中 `A` 是一个向量，`B` 是一个标量。优化公式变为：


    ![](img/image203.jpg)


    因此，使用向量记法，可以看出将标量方法推广到大多数方法很容易。然而，计算时间更重要，因为有更多系数需要评估（`p + 1` 个系数而不是 2 个）。


    ### 多元回归，矩阵记法


    在文献中，人们经常发现这些方程以矩阵形式表示以获得简洁的写法。设 `X` 为 `n` 个向量 `x` 的矩阵，`Y` 为 `n` 个向量 `y` 的矩阵。那么
    `A` 变为矩阵，我们可以写成：


    ![](img/image210.jpg)


    关于回归可能性的一个小括号


    ### 非线性回归


    有许多比线性回归更复杂的回归模型；我们必须为正确的问题选择正确的回归类型：多项式回归、分段多项式、时间序列、逻辑回归、核回归。


    ### 降维


    与无监督学习中的 CPA 一样，可以使用回归方法进行降维。当特征数量很大时，有趣的是确定哪些特征影响结果。为此，我们使用正则化方法。正则化的原理是通过一个取决于参数的值为
    1 或 0 的项来修正误差 `R`。正则化方法之一称为 Lasso 回归：


    ![](img/image220.jpg)


    该方法通过使系数 `A` 的大部分为零来减少维度。应注意，参数图片需要通过经验确定。我们已经完成了对回归的解释，这与监督学习有关。


