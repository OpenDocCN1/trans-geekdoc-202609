    # Language Reference GUI and IDLE - what is it?


    GUI is an abbreviation of Graphic User Interface and are the programs that partly
    create the virtual windows, buttons, menus, etc. This allows the user, by clicking
    etc. to call the functions associated with said elements, the purpose of which
    can be to send a text to a text box, retrieve a file or send one to external storage
    such as a hard drive, drawing graphics and much more. The code for the GUI components
    is found inter alia. In Python''s `Tk` library. The code for the windows coming
    from the `Tk` library can be seen by the word `Tk` at the top of the basic window.


    ```

    >>> from Tkinter import Label

    >>> childAfLabel = Label ()

    ```


    Since, as mentioned, there is a basic model of the GUI components in `Tk`, the
    workman `Tkinter` can send out `Tk`, stating that the code for the construction
    of the basic window must be made available for construction of a copy of `Label()`,
    which in this case I have chosen to call `childrenAfLabel`, because as other children
    it has its origin, from which it inherits in the mother, a term that is also used
    in other Danish books on computer language. In English, the mother is called the
    parent (parent). In Python, the term, the main class or the basic class is also
    used.


    ## Immediate mode


    From old DOS, you may know the prompt `dose c:`. In Python, `>>>` is used as a
    corresponding clear message. A message that Python is in Immediate or as it is
    also called interactive mode. It is from here that you start your Python programming,
    but certainly, also the mature Python programmer returns to and uses, for example.
    When testing new program bits.


    ## Comments


    When you program, from time to time, you need to insert comments - parts of the
    program that you and others can read, but the computer language skips. In Python,
    `#` (the hash sign - in Danish called garden gate or steak sign) marks. A comment
    begins at the garden gate and continues the program line.


    Ex. 1:

    ```

    >>> # Python runs over comments

    >>> print "Comments are for you and not for the computer."

    ```

    Comments are for you and not for the computer.


    It is also possible to print the hash sign if it is part of a text string.


    Ex. 2:

    ```

    >>> print "Here we print a hash sign #"

    ```

    Here we print a hash sign #


    In this example, there were NO comments. The steak sign is here a part of a text
    string. One such Python should like to respond to and not bypass. Note that the
    steak sign is printed here, which it did not in the example where it served its
    proper purpose.


    Comments in quotes par Strings can also be enclosed in 3 quotes (single or double).


    Ex. 1:

    ```

    >>> print """

    Name: The cliff island Bornholm

    Population: 44.500

    """

    ```

    Name: The cliff island Bornholm

    Population: 44,500


    ## Arithmetic operators


    Addition `+` ex: `3 + 4 = 12`

    Subtraction `-` ex: `3 - 4 = - 1`

    Multiplication `*` ex: `3 * 4 = 12`

    Exponent notation `**` ex: `3 ** 4 = 81`

    Division `/` ex: `3/4 = 0` (rounding down to the nearest whole number)

    Division `//` ex: `3 // 4 = 0` (rounding down to the nearest whole number)

    Modulus `%` ex: `3.0 % 4.0 = 0.75`


    DANGER: Beware of integer divisions

    ```

    >>> 25/24

    1

    ```

    25 divided by 24 should give 1.0416666666666667, but Python automatically descends
    downwards to the nearest integer, which in this case is 1.

    ```

    >>> 25 / 24.0

    1.0416666666666667

    ```


    ## Variables


    A variable is a pointer pointing to several addresses in the computer''s memory
    (RAM), where data, there may be several things, for example. Numbers and text
    strings are placed.


    Statement of variables

    ```

    >>> x = y = z = 0

    >>> x

    0

    >>> y

    0

    >>> z

    0

    ```

    NOTE: In Python, use `==` for equal to and `=` for assign.


    Variables can be overwritten

    ```

    >>> e = 1000 # global variable variable

    >>> def nix ():

    ... global e

    ... e = 25

    ...

    >>> e

    1000

    >>> nix()

    >>> e

    25

    ```


    Variables address

    ```

    >>> a = 25

    >>> type(a)

    <type ''int''>

    >>> a = 12.4

    >>> type(a)

    <type ''float''>

    ```


    Variables address in RAM can be found with `id`

    ```

    >>> a = 12.4

    >>> id(a)

    13609595 6

    ```


    ## Boolean expressions / variables


    Boolean expressions / variables can take / assign 2 values and only 2. The 2 values
    are true (true) and false (false).


    Ex. 1:

    ```

    >>> 2 == 3

    0

    >>> 2 == 2

    1

    ```


    ## Write interactively


    In interactive mode, numbers can be entered with 2 different functions: `raw_input`,
    where numbers are received as was the text, and `input` that receives numbers
    as numbers.


    ## Scripts


    If and when you need to develop larger projects in Python, you will need to save
    your Python code as individual files you can use over and over again.


    In Linux, Python scripts can be made directly executable by inserting `#! / usr
    / bin / env python` as the first line of the program.


    The script can be assigned an executable mode or permission using the command:

    ```

    $ chmod + x myscript.py

    ```


    ## If, elif and else


    ```

    >>> def findMax(a, b, c):

    ... max = a

    ... if b> a:

    ... max = b

    ... if c> b:

    ... max = c

    ... return max

    ...

    >>> findMax(37, 2 * 19, 43)

    43

    ```


    ## Function definition and call


    ```

    >>> def function():

    ... a = 4 * 5

    ... return a

    ...

    >>> function()

    20

    ```


    Function with a parameter:

    ```

    >>> def f(a):

    ... return a * 1.25

    ...

    >>> f(75)

    93.75

    ```


    ## Lists


    Lists are variables of zero to several related spaces. Its square brackets know
    the list.


    ```

    >>> list = []

    >>> list.append("Ypnasted")

    ```


    Slicing:

    ```

    >>> l = [1,2,3,3,4,5,6,7,8,9]

    >>> print l[0]

    1

    >>> print l[0:4]

    [1, 2, 3, 3]

    ```


    ## Tuples


    Tuples consist of anal values separated by commas.


    ```

    >>> t = 1,2,3,4,5

    >>> t

    (1, 2, 3, 4, 5)

    ```


    ## Dictionary


    ```

    >>> dictionary = {}

    >>> postal codes = {"Rønne": 3700, "Allinge": 3770}

    ```


    ## Escape sequences


    A new line

    Horizontal Tab

    Carriage return


