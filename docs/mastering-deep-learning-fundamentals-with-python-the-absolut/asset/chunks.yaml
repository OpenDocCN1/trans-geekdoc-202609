    # DEEP NEURAL NETWORKS LAYERS


    A deep neural network (`DNN`) is known as an artificial neural network (`ANN`)
    with several layers hidden between the input and output layers. As in slight `ANNs`,
    `DNNs` can model complex non-linear relationships. The foremost goal of a neural
    network is to receive a set of inputs, make progressively complex calculations
    in them and output to solve real-world problems such as classification. We just
    feed the neural networks. We have sequential data entry, exit and flow in a deep
    network.


    ![https://www.codigofuente.org/wp-content/uploads/2019/04/deep-670x294.jpeg](image579.jpg)


    Neural networks are generally used in supervised learning and reinforcement learning
    problems. These networks are centres on a set of interconnected layers. In deep
    learning, the actual number of hidden layers, often non-linear, can be large;
    Let''s say about 1000 layers. We mainly use the gradient descent method to optimize
    the network and minimize the loss function. We can use `Imagenet`, a repository
    of millions of digital images to classify a set of data like cats and dogs. `DL`
    networks are increasingly used for dynamic images, apart from static images, and
    for time series and text analysis. Training data sets is an important part of
    the Deep Learning models. Also, Backpropagation is the main algorithm in the training
    of `DL` models. `DL` deals with the training of large neural networks with complex
    input and output transformations. An example of `DL` is the assignment of a photo
    to the name of the person(s) in the photo as they do in social networks and describing
    an image with a phrase is another recent `DL` application.


    ## DL Mapping


    Neural networks are purposes that have inputs like `x1`, `x2`, `x3` ... that are
    transformed into outputs like `z1`, `z2`, `z3`, etc. in two (shallow networks)
    or several intermediate operations also called layers (deep networks). The weights
    and biases change from one layer to another. "`W`" and "`v`" are the weights or
    synapses of the layers of the neural networks. The best case of using deep learning
    is the problem of supervised learning. Here, we have a large set of data inputs
    with a desired set of outputs.


    ## Backpropagation algorithm


    Here we apply the backward propagation algorithm to obtain the correct output
    prediction. The most basic deep-learning data set is the `MNIST`, a set of data
    from handwritten digits. We can deeply train a convolutional neural network with
    `Keras` to classify images of handwritten digits from this set of data. The triggering
    or activation of a neural network classifier provides a score. For instance, to
    classify patients as sick and healthy, we consider parameters such as height,
    weight and body temperature, blood pressure, etc. A high score means that the
    patient is sick, and a low score means that they are healthy. Each node in the
    output and hidden layers has its classifiers. The input layer takes inputs and
    passes its scores to the next hidden layer for additional activation, and this
    continues until the output is reached. This input to output progress from left
    to right in the forward direction is called forward propagation.


    The credit allocation path (`CAP`) in a neural network is the series of transformations
    that start from the entrance to the exit. `CAPs` make probable causal connections
    between entry and exit. The depth of the `CAP` for a given direct-feed neural
    network or the depth of the `CAP` is the number of hidden layers plus one as the
    output layer is included. For recurrent neural networks, where a signal can propagate
    through a layer several times, the depth of the `CAP` can be potentially unlimited.


    ## Deep networks and shallow networks


    There is no precise threshold of depth that divides the superficial learning from
    deep learning; but in general, it is accepted that for deep learning that has
    multiple non-linear layers, the `CAP` must be greater than two. The basic node
    in a neural network is a perception that mimics a neuron in a biological neural
    network. Then we have Multilayer Perception or `MLP`. A set of weights and biases
    modifies each set of inputs. Each edge has a different weight, and each node has
    a unique bias. The accuracy of the prediction of a neural network depends on its
    weights and biases. The process of improving the accuracy of the neural network
    is called training. The output of a forward propagation network is compared to
    the value that is known to be accurate. The charge function or the loss function
    is the distinction between the generated output and the actual output. The goal
    of training is to make the cost of training as small as possible through millions
    of training examples. To do this, the network adjusts the weights and biases until
    the prediction matches the correct result. Once well trained, a neural network
    has the potential to make an accurate prediction at all times.


    When the pattern becomes complex, and you want your computer to recognize them,
    you must opt for neural networks. In such complex pattern scenarios, the neural
    network outperforms all other competing algorithms. Computers have proven to be
    good at performing repetitive calculations and following detailed instructions,
    but they have not been as good at recognizing complex patterns. If the problem
    of recognition of simple patterns exists, a support vector machine (`SVM`) or
    a logistic regression classifier can do the job well, but as the complexity of
    the pattern increases, there is no choice but to search deep neural networks.
    Therefore, for complex patterns such as a human face, superficial neural networks
    fail and have no alternative but to use deep neural networks with more layers.


    Deep networks can do their job by dividing complex patterns into simpler ones.
    For example, on the human face, edges would be used to detect parts such as lips,
    nose, eyes, ears, and so on and then recombine them to form a human face. The
    accuracy of the correct prediction has become so precise that recently, in a Google
    Pattern Recognition Challenge, a deep network exceeds that of a human.


    This idea of a network of layered perceptrons has existed for some time. In this
    area, deep networks mimic the human brain. But one disadvantage of this is that
    they take a lot of time to train. However, recent high-performance GPUs have been
    able to train such deep networks in less than a week; while the fast CPU could
    have taken weeks or perhaps months to do the same.


    ## Choose a deep network


    How to choose a deep network? We have to determine if we are building a classifier
    or if we are trying to find patterns in the data and if we are going to use unsupervised
    learning. To obtain patterns from an unlabeled data set, we use a restricted Boltzmann
    machine or an automatic encoder.


    Consider the following points when choosing a deep network:

    For text processing, sentiment analysis, analysis and recognition of the named
    entity, we use a recurrent network or recursive neural tensor network or `RNTN`;

    For any language model that works at the character level, we use the recurrent
    network.

    For image recognition, we use the deep belief network `DBN` or convolutional network.

    For the recognition of objects, we use an `RNTN` or a convolutional network.

    For voice recognition, we use the recurring network.

    In general, deep understanding networks and multilayer perceptrons with rectified
    linear units or `RELUs` are good options for classification.

    For the analysis of time series, it is always recommended to use a recurrent network.


    Neural networks have existed for more than 50 years; but only now has it been
    given more importance. The reason is that they are difficult to train when we
    try to train them with a method called propagation, we find a problem called leak
    or explosion gradients. When that happens, training takes more time and precision
    takes a back seat. When we train a data set, we constantly calculate the cost
    function, which is the difference between the predicted output and the actual
    output of a set of tagged training data. The cost function is decreased by adjusting
    the values of weights and biases until the lowest value is obtained. The training
    method uses a gradient, which is the rate at which the cost will change concerning
    the change in weight or bias values.


    ## Restricted Boltzmann Networks or Autoencoders - RBN


    In 2006, a breakthrough was achieved by addressing the problem of leakage gradients.
    Geoff Hinton devised a novel strategy that drove to the development of the Restricted
    Boltzmann Machine: `RBM`, a shallow two-layered network. The first layer is the
    visible layer. Moreover, the second layer is the hidden layer. Each node in the
    noticeable layer is connected to each node in the hidden layer. The network is
    known as restricted because two layers within the same layer are not allowed to
    receive a connection.


    Autoencoders are networks that encode data as vectors. Create a hidden or compressed
    image of the raw data. The vectors are useful in the reduction of dimensionality.
    The vector compresses the raw data into a smaller number of essential dimensions.
    The automatic encoders are combined with decoders, which allows the reconstruction
    of the input data based on its hidden representation. `RBM` is the mathematical
    equivalent of a bidirectional translator. A forward pass takes entries and translates
    them into a set of numbers that encode the entries. Meanwhile, a backward pass
    takes this set of numbers and translates them back into reconstructed entries.
    A well-trained network performs again with a high degree of accuracy.


    ## Deep belief networks - DBNs


    Deep belief networks (`DBNs`) are made by combining `RBM` and introducing an intelligent
    training method. We have a new design that finally solves the problem of the disappearance
    of the gradient. Geoff Hinton created the `RBMs` and also Deep Belief Nets as
    an alternative to backward propagation. A `DBN` is similar in structure to an
    `MLP` (Multi-layer perceptron), but very different when it comes to training.
    It is the training that allows `DBNs` to overcome their shallow counterparts.


    A `DBN` can be viewed as an `RBM` stack where the hidden layer of an `RBM` is
    the visible layer of the `RBM` located above. The first `RBM` can reconstruct
    its input as precisely as possible. The hidden layer of the leading `RBM` is apprehended
    as the visible layer of the second `RBM`, and the second `RBM` is trained using
    the outputs of the first `RBM`. This process is iterated until each layer in the
    network is equipped. In a `DBN`, all `RBM` learns the entire entry. A `DBN` works
    globally by adjusting the entire input in succession as the model slowly improves
    as the lens of a camera focusing on an image.


    An `RBM` stack exceeds a single `RBM` as a multilayer perceptron `MLP` exceeds
    a single perceptron. In this stage, the `RBMs` have detected patterns inherent
    in the data but without any name or label. To finish the training of the `DBN`,
    we have to introduce labels to the patterns and fine-tune the network with supervised
    learning. We require a very small set of labelled samples so that features and
    patterns can be associated with a name. This small set of tagged data is used
    for training. This set of tagged data can be very small compared to the original
    data set. The weights and biases are slightly modified, resulting in small change
    in the network''s perception of the patterns and, often, a small increase in overall
    accuracy. The training can also be achieved in a reasonable time using GPUs that
    offer very accurate results compared to shallow networks, and we also see a solution
    to eliminating the gradient problem.


    ## Antagonistic Gene Networks - GANs


    Antagonistic generative networks are deep neural networks that comprise two networks,
    one against the other, hence the name "antagonistic". The `GANs` was featured
    in an article published by researchers at the University of Montreal in 2014.
    Yann LeCun, an artificial intelligence expert at Facebook, referring to `GANs`,
    called the training in confrontation "the most interesting idea in the last 10
    years in ML". The potential of the `GANs` is enormous since network scanning learns
    to imitate any data distribution. `GANs` can be taught to build parallel worlds
    strikingly similar to ours in any domain: images, music, speech, prose. In a way,
    they are robot artists and their production is quite impressive.


    In a `GAN`, a neural network, known as the generator, generates new instances
    of data, while the other, the discriminator, evaluates them to determine their
    authenticity. Let''s say we are trying to generate handwritten numbers like those
    found in the `MNIST` data set, which is taken from the real world. The work of
    the discriminator, when an instance of the true `MNIST` data set is shown, is
    to identify them as authentic.


    Now study the following steps of the `GAN`:

    The generator network receives information in the form of random numbers and returns
    an image. This generated image is provided as input to the discriminating network
    together with a stream of images taken from the actual data set. The discriminator
    takes both real and false images and returns probabilities, a number between 0
    and 1, where 1 represents a prediction of authenticity and 0 represents false.


    ## Recurrent neural networks - RNNs


    `RNNS` are neural networks in which data can flow in any place. These networks
    are utilised for applications such as language modelling or natural language processing
    (`NLP`). The basic concept underlying the `RNN` is to use sequential information.
    In a typical neural network, it is expected that all inputs and outputs are free
    of each other. If we want to predict the next word in a sentence, we have to know
    what words came before it. The `RNNs` are called recurrent since they repeat the
    same task for each element of a sequence, and the output is based on the previous
    calculations. Therefore, it can be said that the `RNN` has a "memory" that carries
    information about what has been earlier estimated. In theory, `RNNs` can use information
    in very long sequences, but in reality, they can look back only a few steps.


    ### Recurrent neural networks


    Long-term memory networks (`LSTMs`) are the most commonly used `RNNs`. Along with
    convolutional neural networks, `RNNs` have been used as part of a model to generate
    descriptions of untagged images. It''s pretty amazing how well this seems to work.


    ## Deep convolutional neural networks - CNN


    If we improve the number of layers in a neural network to make it deeper, it raises
    the complexity of the network and enables us to model more difficult functions.
    However, the number of weights and biases will increase exponentially. Learning
    such difficult problems may become impossible for normal neural networks. This
    leads to a resolution, the convolutional neural networks.


    `CNN''s` are widely used in computer vision; They have also been applied in acoustic
    modelling for automatic voice recognition. The idea after convolutional neural
    networks is the idea of a "moving filter" that passes through the image. This
    filter in motion, or convolution, is applied to a certain neighbourhood of nodes
    that, for example, can be pixels, where the filter applied is 0.5 x the value
    of the node. The outstanding researcher Yann LeCun was a pioneer in convolutional
    neuronal networks. Facebook, like facial recognition software, uses these networks.
    `CNN` has been the solution for artificial vision projects. There are many layers
    in a convolutional network. In the `Imagenet` challenge, a machine was able to
    defeat a human in recognition of objects in 2015.


    In short, convolutional neural networks (`CNN`) are multilayer neural networks.
    Layers sometimes have up to 17 or more and assume that the input data is images.


    ### Convolutional neuronal networks


    `CNN''s` drastically reduce the number of parameters that must be adjusted. Therefore,
    `CNN` efficiently handles the high dimensionality of raw images.

