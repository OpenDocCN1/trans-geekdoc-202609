    # Features and Benefits


    A major advantage of convolutional networks is the use of a unique weight associated
    with the signals entering all the neurons of the same convolution core. This method
    reduces the memory footprint, improves performance and allows translation processing
    invariance. This is the main advantage of the convolutional neural network concerning
    the multilayer perceptron, which considers each independent neuron and therefore
    assigns a different weight to each incoming signal.


    When the input volume varies in time `video` or `sound`, it becomes interesting
    to add a parameter along the time scale in the setting of neurons. In this case,
    we will speak of a neural network with a time delay `TDNN`.


    Compared to other image classification algorithms, convolutional neural networks
    use relatively little pre-processing. This means that the network is responsible
    for changing its filters by itself `learning without supervision`, which is not
    the case for other, more traditional algorithms. The absence of initial parameterization
    and human intervention is a major asset of `CNN`.


    ## Difference between Comparative Convolutional Neural Networks and Multilayer
    Perceptron


    Although effective for image processing, Multilayer Perceptrons `MLPs` have difficulty
    handling large images, due to the exponential growth in the number of connections
    with the size of the image, as each neuron is "totally connected" to each of the
    neurons of the previous and next layer.


    The convolutional neural networks, whose principle is inspired by that of the
    vertebrate visual cortex, on the contrary limits the number of connections between
    a neuron and the neurons of the adjacent layers, which drastically decreases the
    number of parameters to be learned. For a deep network such as `AlexNet` for example,
    more than 90% of the parameters to be learned are due to 3 layers `Fully connected`
    deepest, and the rest relates to the `5` convolutional layers.


    One layer of the `CNN` in 3 dimensions `green = volume of entry, the blue = volume
    of the receiving field, grey = layer of CNN, circles = independent artificial
    neurons`


    For example, if we take an image size `32 × 32 × 3` `32 wide, 32 high, 3 colour
    channels`, a single fully connected neuron in the first hidden layer of the `MLP`
    would have `3,072` entries `32 * 32 * 3`. A `200 × 200` image would thus result
    in treating `120,000` entries per neuron which, multiplied by the number of neurons,
    becomes enormous.


    Convolutional neural networks aim to limit the number of inputs while maintaining
    the strong "spatially local" correlation of natural images.


    In contrast to `MLP`, `CNN` has the following distinguishing features:


    **Local connectivity**: thanks to the receiver field which limits the number of
    neuron inputs, while maintaining the `MLP` architecture, the convolutional neural
    networks thus ensure that the "filters" produce the strongest response to a spatially
    localized input pattern, which leads to a parsimonious representation of the entrance.
    Such a representation takes up less space in memory. Also, since the number of
    parameters to be estimated is reduced, their `statistical` estimate is more robust
    for a fixed data volume `compared to an MLP`.


    **Shared weights**: In convolutional neural networks, the filtering parameters
    of one neuron `for a given receiver field` are identical for all other neurons
    of the same nucleus `processing all the other receptive fields of the image`.
    This setting `weight vector and bias` is defined in a "function card".


    **Invariance to translation**: as all the neurons of the same core `filter` are
    identical, the pattern detected by this nucleus is independent of spatial location
    in the image


    Together, these properties allow the convolutional neural networks to obtain greater
    robustness in the estimation of parameters `28` on learning problems since, for
    a set size of learning corpus, the amount of data per parameter is higher. Great.
    Weight sharing also greatly reduces the number of free parameters to learn, and
    thus the memory requirements for network operation. The decrease in the memory
    footprint makes it possible to learn larger networks that are often more powerful.


    ### Application in the automatic processing of natural language `NLP`


    Instead of picture pixels, most `NLP` functions have sentences or documents as
    entries. The idea for applying a `CNN` `see any RN` is to transform words and
    documents into a matrix form. Each row of the matrix matches to a token, usually
    a word, but it can also be a character. That is, each line is a vector that represents
    a word. In general, these vectors are word inclusions `small representations`
    such as `word2vec` or `GloVe`.


    For example, for a 20-word phrase using a 100-dimensional embedding, we would
    have a `20 × 100` matrix as input. This is our "image" for `CNN`.


    Convolutional filtering in image processing consists of dragging a window representing
    the feature on the image and calculating the convolution product between the feature
    and each portion of the scanned image. However, in `NLP`, we usually use filters
    that slide over complete rows of the matrix `the words`. Thus, the "width" of
    the filters is generally the same as the width of the input matrix. The height,
    or size of the area, may vary, but slippery windows of more than 2 to 5 words
    at a time are typical.


    # PART II: DEEP LEARNING IN PRACTICE `IN JUPYTER NOTEBOOKS`


    `Python` is a powerful computer language that is extremely effective for internet
    development and web-based applications. Why in the world would you be involved
    in `Python` when there is already a long line of really good old and well-functioning
    computer languages to go to? As an example, let’s mention:


    * `Python` is available for all well-known operating systems including `Linux`,
    `Mac` and `Windows`.

    * `Python` is easy to move from one operating system to another, for example.
    From `Linux` to `Windows` and vice versa.

    * Is very easy to learn - also for beginners in the use of computer languages
    in general.

    * `Python` combines remarkable strength with a very clear syntax `read: a way
    of doing things`.

