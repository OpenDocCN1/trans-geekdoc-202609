    ## C. 深度卷积神经网络


    在计算机视觉领域，深度卷积神经网络是一个不可忽视的重要部分。它是一种前馈神经网络，包含卷积操作并具有深层结构。在图像处理方面，它比 BP 神经网络具有更好的能力。许多研究人员致力于卷积网络的研究，并取得了许多显著成果，开发了如
    VGG(16)、ResNet(11)、Exception(12) 等模型，这些模型提高了应用于我们日常生活中的识别率，例如人脸识别、场景图像识别、车辆识别等。在分类这一研究课题上，我们在现阶段取得了良好的效果，具有改进潜力。


    这是一种由 Google 深度学习团队开发的高效神经网络。Google 在 ICML 上发表的方法显示这项工作的效果非常好 [13]。传统的研究受限于有限的计算能力。通过扩展网络，只扩展了一个维度的图像分辨率，就实现了更高的准确率，例如
    ResNet-18 和 ResNet-50！另一方面，每个元素的模型并不是完全独立的，而是通过复合模型缩放算法相互作用以平衡三种操作，实现了与现有分类网络相似的精度指数，并大幅减少了参数和计算量。


    表示高效表达的网络计算公式为公式 4：


    ```

    $N = \prod_{i=1}^{n} \Phi_{i}^{\gamma}(X, w_{i}, c_{i})$

    ```


    其中 n 是基础层，i 是阶段，Li 是输入 $L_{i}$ 是 i 阶段中特征结构的表示。模型缩放算法的目标是在满足约束条件的情况下使约束最大化，如公式
    5 所示。需要优化的参数是网络深度 (d)、网络宽度 (w) 和分辨率 (r)。


    ```

    $maxAccuracy(d, w, r) \quad (5)$

    ```


    ```

    $Memory(N) \leq target memory\nFLOPS(N) \leq target flops$

    ```


    我们用 $\phi$-索引表示待优化的参数，如公式 6。同时，我们对 $\alpha$、$\beta$ 和 $\gamma$ 做了许多限制。我们可以将 $\phi$
    固定为 1，然后得到满足公式的参数，即 $\alpha = 1.2$，$\beta = 1.1$，$\gamma = 1$。


    ```

    $depth: d = a^{\alpha} \quad (6)$

    ```


    width：$w = b^{\beta}$


    $resolution: r = y^{\gamma}$

    $s \cdot a \cdot y^{2} = 2$

    $a \geq 1, y \geq 1, \gamma \geq 1$


    然后我们使用 Efficientnet 来提取多维融合的特征。


    ## D. 注意力机制


    垃圾信息中存在大量无关信息，这些信息可能对我们的决策产生影响，导致背景信息变得混乱。注意力机制可以模拟人类注意力，并从人类注意力机制和注意力中学习 [17]。我们可以利用从注意力机制提取的特征来关注处理对象的重要部分，使模型能够关注关键特征并识别出正确的图像
    [18]。


    在使用注意力时，将 F 的输出图作为输入 U，然后进入注意力模块，该模块包含三种操作：


    - 1. 通过池化值将每个通道的二维压缩 (H*W) 压缩为数值 z [19]。参见公式 7。这是一种在空间维度上具有全局感受野的特征，操作后通道数保持不变，为
    1 * C。


    ```

    $Z_{c} = E_{fc}(U) = \frac{1}{H \times W} \sum_{i=1}^{H} \sum_{j=1}^{W} U_{(i,j)}
    \quad (7)$

    ```


    - 2. 激励：这主要是为每个通道参数生成一个权重值，使用两个全连接层形成瓶颈以建立通道之间的相关性，并输出一维注意力权重 $s$，激活每个层通道，其数量与通道数相同
    [22]。


    ```

    $s = F_{exc}(X, W) = \sigma(g(X, W)) \quad (8)$

    ```


    其中 $\sigma$ 是规则和激活函数。

    - 3. 注意力：将上一步操作获得的权重值与 U 中对应的通道相乘，如公式 9 所示，我们可以增强关键通道的注意连接，并通过它们各自的权重进行衡量。


    ```

    $\hat{F}_{c} = F_{exc}(U_{c}) = s_{c} \cdot U_{c} \quad (9)$

    ```


    ## III. 实验环境与实现


    本实验的硬件环境如下：

    配备配备 Intel Core i7-3.2GHz CPU 的服务器、64GB 内存、NVIDIA GTX 1080Ti 显卡、Ubuntu 16.04 系统和
    PyTorch 深度学习框架。


    研究中使用的数据是人工智能垃圾分类项目的 1735 张图像。垃圾类别已标记了每个名称和类别。共有 40 种物品，如箱子、电池、水果和果肉，分为 4 类垃圾：有害垃圾、厨余垃圾、可回收物和其他垃圾；算法中的垃圾类型名称进行了如下设置；例如：一次性快餐。数据中的
    13000 张图像用于训练集，6735 张用于测试集。分布如表 I 和 II 所示。


    ### 表 I 训练集


    | 垃圾类别 |  | 数量 |

    | :--- | :--- | :--- |

    | 可回收物 | 23 | 7475 |

    | 厨余垃圾 | 8 | 2600 |

    | 有害垃圾 | 3 | 975 |

    | 其他垃圾 | 6 | 1950 |


    ### 表 II 测试集


    | 垃圾 | 图片数量 |

    | :--- | :--- |

    | 可回收物 | 1872 |

    | 厨余垃圾 | 1347 |

    | 有害垃圾 | 505 |

    | 其他垃圾 | 1110 |


    在实验的第一阶段，对图像数据进行处理包括两个部分：数据增强和归一化。图像大小限制在 45 像素。数据被输入网络进行训练。在每个 epoch 中测试模型，并记录准确率和损失率。在此实验之后，基于有害垃圾、厨余垃圾、可回收物识别并预测了
    40 种图像。经过 30 个 epoch 的训练，准确率达到了 93.7%，损失在 0.81-0.83 之间。损失率问题线图显示在 epoch 开始时，损失率约为
    0.3。


