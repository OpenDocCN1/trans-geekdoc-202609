    ## C. Deep Convolution Neural Network


    In the field of computer vision, deep convolution networks are an important part
    that cannot be ignored. It is a kind of feedforward neural network which contains
    convolution and has a deep structure. It has better ability than the BP neural
    network in image processing. Many researchers are working on convolution network,
    and have achieved many remarkable results developed models as VGG(16), ResNet(11),
    Exception(12) and so on, which have improved the recognition rate applied to our
    daily life, such as face recognition, stage image recognition, vehicle recognition
    and so on. In this research topic of classification, we effective has quality
    at this stage, makes and improvement potential.


    An efficient neural network developed by Google deep learning team. The approach
    published by Google in ICML the effect of this work is very good [13]. The traditional
    research is limited to limited computing power. By expanding the network, we only
    expand one dimension image resolution, achieve higher accuracy, such as ResNet-18
    and ResNet-50! On the other hand, the models of each element are not completely
    independent and interact with each other through a compound model scaling algorithm
    to balance the three operations, to achieve the accuracy index similar to the
    existing classification network, and greatly reduce the amount of parameters and
    calculations.


    The network calculation of expression efficient is formula 4:


    ```

    $N = \prod_{i=1}^{n} \Phi_{i}^{\gamma}(X, w_{i}, c_{i})$

    ```


    Where n is the basic layer, i is the stage, and the Li is the input $L_{i}$ is
    the representation of feature structures, in the i-stage. The goal of model scaling
    algorithm is to maximize the constraints that we meet constraints, as formula
    5. The parameters to be optimized are network depth (d), network width (w) and
    resolution (r).


    ```

    $maxAccuracy(d, w, r) \quad (5)$

    ```


    ```

    $Memory(N) \leq target memory\nFLOPS(N) \leq target flops$

    ```


    We express the parameters to be optimized by $\phi$-index, as formula 6. At the
    same time, we make many restrictions on $\alpha$, $\beta$ and $\gamma$. We can
    fix $\phi$ as 1, and then get the parameters that satisfy the formula, which are
    $\alpha = 1.2$, $\beta = 1.1$, $\gamma = 1$.


    ```

    $depth: d = a^{\alpha} \quad (6)$

    ```


    width: $w = b^{\beta}$


    $resolution: r = y^{\gamma}$

    $s \cdot a \cdot y^{2} = 2$

    $a \geq 1, y \geq 1, \gamma \geq 1$


    Then we use Efficientnet to extract features of multidimensional fusion.


    ## D. Attention Mechanism


    There are lot of irrelevant information in spam messages, which may have a certain
    impact on our decision-making, making the background information about the garbage.
    Attention mechanism can mimic human attention and learns from human attention
    mechanism and attention [17]. We can use the features extracted from attention
    mechanism to focus on the important parts of the object to be processed, so that
    the model can focus on the key features and recognize the right image [18]


    When using attention, the output map of F is used as input U, and then enters
    the attention module, which is used with three operations:


    - 1. The two-dimensional compression (H*W) of each channel is compressed to a
    number z by pooling the values [19]. See formula 7. It is a feature that has a
    global receptive field, in spatial dimension, and the number of channels unchanged
    after operation, which is 1 * C.


    ```

    $Z_{c} = E_{fc}(U) = \frac{1}{H \times W} \sum_{i=1}^{H} \sum_{j=1}^{W} U_{(i,j)}
    \quad (7)$

    ```


    - 2. Excitation: This is mainly to generate a weight value for each channel parameters,
    use two fully connected layers to form a bottleneck to establish the correlation
    between channels, and output one-dimensional attention weight $s$, to activate
    each layer channel of the number of which is the same as the number of channels
    [22].


    ```

    $s = F_{exc}(X, W) = \sigma(g(X, W)) \quad (8)$

    ```


    Where $\sigma$ is a rule and activation function.

    - 3. Attention: Multiply the weight value obtained from the previous operation
    with the corresponding channel in U, as shown in formula 9, we can enhance the
    attention and connection of key channels, which are measured by their respective
    weights.


    ```

    $\hat{F}_{c} = F_{exc}(U_{c}) = s_{c} \cdot U_{c} \quad (9)$

    ```


