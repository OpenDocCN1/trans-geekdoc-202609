    # 2021 亚太通信技术与计算机科学会议 (ACCTCS)


    # # 垃圾分类深度学习图像识别技术研究


    郭强 (Qiang Guo)

    软件工程学院

    信息学院

    理工大学

    中国北京


    石玉良 (Yuliang Shi)

    软件工程学院

    信息学院

    理工大学

    中国北京


    王世凯 (Shikai Wang)

    软件工程学院

    信息学院

    理工大学

    中国北京


    *通讯作者邮箱：

    qbj2013@email.bjut.edu.cn


    邮箱: shlj@bjut.edu.cn


    邮箱: skwang@email.bjut.edu.cn


    **摘要—**随着工业的快速发展，人们的日常生活变得比以往任何时候都要丰富，同时也带来了大量的垃圾。各种类型的垃圾不断产生，人们缺乏垃圾分类的相关知识，导致人工或机器人分类的困难。本文引入了一种基于深度学习卷积网络的算法来帮助垃圾分类。在图像识别任务中，为了解决数据量小和物体尺寸不一的问题，利用特征提取器提取物体特征。为了避免对小批次数据产生明显影响，我们将
    BN 替换为 GN（组归一化）。为了强调目标物体的重要性，引入了注意力机制。在模型输出后，我们添加了注意力机制来增强目标物体的重要信息，使模型专注于关键特征并更好地识别图像；根据上述过程，我们将垃圾分为四类（可回收物、厨余垃圾、有害垃圾）。其他结果显示，模型可以有效分类和识别垃圾类型。实验结果表明，该算法精度较高，具有良好的性能和鲁棒性。在研究实践意义上，这种可靠的方法可以帮助人们了解垃圾类型并供机器人进行分类，因此具有非常重要的应用场景和意义，适用于解决和消除垃圾问题。我们需要准确地分类垃圾，然后进行不同种类的垃圾分类，这将影响垃圾收集效率和进行分类的人员。


    然而，从目前垃圾分类和处理的效率来看，人们对垃圾类型的认知非常匮。当人们将垃圾放入错误的桶中时，系统首先识别垃圾，但识别效果并不如人意。垃圾分类在排序方面面临困难。


    传统的垃圾分类主要由研究人员进行。由于缺乏垃圾分类的意识和知识，很容易发生错误分类。这些目标检测方法的模型较为复杂，鲁棒性较差。例如，图像分析应用于计算机视觉。在黄玲关于局部特征提取和构建的研究中，该方法被用于改进垃圾收集，工作耗时为
    1.17[3]。如今，人们越来越关注深度学习在人类和图像识别中的作用。深度学习是构建各种有效网络的强大方法，极大地提高了图像识别的准确性，非常有用。


    **关键词—**垃圾分类，卷积神经网络，图像处理技术，垃圾分类


    # I. 引言


    随着工业的发展，人们的日常生活变得丰富，每天都使用和消费生活品，生活垃圾和工业垃圾中产生了大量垃圾。这些类型的垃圾种类复杂、难以区分且难以分类，属于劳动密集型工作。因此，在处理这些垃圾问题时，一些人会将垃圾填埋或焚烧，这会对环境造成巨大危害，且这种方法产生的有害物质是不可


    # II. 实验过程及相关概念


    # B. 组归一化 (Group Normalization)


    针对上述垃圾分类和识别问题，我们设计并实施了这一实验，实验的整体流程如图11所示。


    图像归一化是通过一系列变换将图像转换为相应的标准形式，以便找到图像中的不变性，使得这些图像原本是相同或系列，从而使图像能够抵抗噪声的攻击，加速梯度下降寻找最优解，加速训练网络的收敛，并防止交换方差的影响[7]。归一化对于维持数据在
    0 到 1 之间的统计分布是必要的。


    现在常用的归一化方法是组归一化（GN）算法，它可以将批次数据完全拉回到均值 0 和方差 1，从而不仅能稳定而且加速网络的训练。它的缺点是对于小批次大小的效果较差；会导致性能下降和错误率增加。组归一化在
    [9] 中提出，它将通道进行分组并计算每组内的均值和方差。GN 的计算与批次大小无关，其准确性在不同批量大小下都是稳定的，与 BN 相比减少了误差。


    在实验过程中，我们希望优化和改进神经网络的训练。首先，我们将理解相关概念。


    # A. 数据增强


    在神经网络训练中，我们增加深度和宽度，以增强神经网络的能力并促进数据分布的拟合。同时我们也遇到了一个问题，随着神经网络参数的增加，模型会出现过拟合，导致过拟合，即对数据高度拟合，但测试准确率非常低，特别是在数据集较小时泛化性差！


    在实验过程中，我们使用数据增强的方法来防止过拟合问题。数据增强包括裁剪、颜色抖动、图像水平和垂直翻转等方法，增加了数据量。卷积神经网络对物体的位移、视角、尺寸和光照是不变的，也就是说数据增强不会影响神经网络的训练，但会增强模型的泛化能力并提高准确率[6]。图2了数据增强的一个示例。


    当我们使用数据增强时，通常使用公式：


    ```

    $$\hat{x}_i = \frac{x_i - \mu_i}{\sigma_i}$$

    ```


    其中 x 是某层特征图中特定位置的点；i 是 N、C、H 和 W 四个维度的坐标；C 是通道轴，H 和 W 是高度和宽度轴。


    在公式中，$\mu$ 是均值，$\sigma$ 是标准差。它们的计算如公式2所示，这是一个小的常数值：


    ```

    $$\mu_i = \frac{1}{G}\sum_{j \in G_i} x_j, \\ \sigma_i = \sqrt{\frac{1}{G}\sum_{j
    \in G_i} (x_j - \mu_i)^2 + \epsilon}$$

    ```


    在公式2中，G 是在拟合 k 条件后计算均值的点集区域，m 是该集合的大小。因此我们关注组归一化中 k 条件的定义，如公式3所示：


    ```

    $S_i = \{k | k \in L_i, [\frac{c}{G}] = [\frac{c}{G}]$

    ```


    C 是每组的通道数；$\frac{c}{G}$ 意味着 i 和 k 在同一组通道中，也就是说，组归一化意味着方向分组、对每组进行归一化并计算均值。


    在本次实验中，我们将组归一化应用于图像处理，并替换高效网络中的 BN 以改进由你引起的影响


