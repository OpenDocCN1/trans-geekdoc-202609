    **Abstract—**With the rapid development of industry, people''s daily life has
    become more and more rich than ever, while the pleasure brings a large number
    of garbage to carry. Various types of garbage are produced, and people lack the
    knowledge related to garbage classification, which leads to the difficulty of
    manual or robot classification. An algorithm based on deep learning convolutional
    network is introduced to help garbage classification. In the image recognition
    task, in order to solve the problem of small amount of data and different sizes
    of objects, Feature extractor is used to extract the features of objects. To avoid
    the obvious effect on small batch in the network, we replace BN with GN (Group
    Normalization). In order to emphasize the importance of target object, the attention
    mechanism is introduced. After the output of the model, we add attention mechanism
    to enhance the important information of the target object, so that the model can
    focus on the key features and better identify the image; according to the above
    process, we classify into four categories (Recyclables, Kitchen garbage, Hazardous
    garbage). The other result shows that the model can effectively classify and identify
    the types of garbage. The experimental results show that the accuracy of the algorithm
    is high, with good performance and robustness. In the practical significance of
    the research, this reliable method can help people know the type of garbage and
    the types of garbage for robot sorting, so it has very important application scenarios
    and significance.


    suitable only to solve and eliminate the garbage problem. We need to classify
