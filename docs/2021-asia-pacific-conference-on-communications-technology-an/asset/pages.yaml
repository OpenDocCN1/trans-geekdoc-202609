    # V. CONCLUSION


    In view of the difficulty of garbage classification, this research uses convolutional
    neural network method to solve the problem. At the same time, we improve the network
    and optimize the process. The results achieved the expected goal, the recognition
    accuracy is satisfied, and the garbage classification effective very good improvement.
    This method can be applied to many applications of garbage classification, such
    as garbage sorting and treatment plant, garbage classification by mobile app,
    which is efficient and convenient has has significance and bound applications.


    However, in the laboratory conditions, the environment is like a longer and the
    accuracy rate may be improved. We may continue to solve these problems in the
