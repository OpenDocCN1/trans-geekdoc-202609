  md: '# II. EXPERIMENTAL PROCESS AND RELATED CONCEPTS


    # B. Group Normalization


    Aiming at the problem of garbage classification and recognition mentioned above,
    we designed and implemented this experiment, and the overall flow of the experiment
    is shown in Figure 1.


    Image normalization is to transform the image into the corresponding standard
    form through a series of transformations, so as to find the invariants in the
    image, as to make that these images are originally the same or a series, so that
    the image can resist the attack of noise, accelerate the gradient descent to find
    the optimal solution, accelerate the convergence of training network, and prevent
    affine variance the effect of exchange[7]. Normalization is necessary to maintain
    the distribution of data with the statistical distribution between 0 and 1.


    | Image Input | Data Augmentation | Data Normalization | Module | Efficient Training
    | Attention Classification |

    |---|---|---|---|---||

    | | Hazardous | Kitchen garbage | Recyclables | Other garbage |


    Figure 1. Experimental process


    Now the commonly used normalization method is group normalization (GN) algorithm,
    which can fully pull batch data back to the mean value of 0 and the variance of
    1, so as to not only stabilize, but also accelerate the training of the network.
    Its disadvantage is that it has poor effect for small batch size; performance
    degradation and increase the rate of error. Group normalization is proposed in
    [9], which groups the channels and calculates the mean and variance within each
    group. The calculation of GN is not related to the batch size, and its accuracy
    is stable under various batch sizes, and the error is reduced compared with BN.


    In the process of experiment, we want to optimize and improve the training of
    neural network. First, we will understand the related concepts.


    # A. Data Augmentation


    In training of neural network, we increase the depth and breadth, so as to enhance
    the ability of neural network and facilitate the fitting of distribution of data.
    At the same time, we encounter a problem, that with the increasing of neural network
    parameters the model will overfit, resulting in overfitting, which is highly fitting
    the data, but the accuracy is very low for the test, and the generalization is
    especially when the data set is small!


    In the process of experiment, we use the way of data augmentation to prevent the
    overfitting problem. Data augmentation includes methods like clipping, color jitter,
    horizontal and vertical flipping of images, which increases the amount of data.
    Convolution neural network is invariant to the displacement, view angle, size
    and illumination of objects, that is say, data augmentation does not affect the
    training of neural network, but will enhance the generalization ability of model
    and improve the accuracy rate[6]. Figure 2 shows an example of data augmentation.


    When we use data augmentation, we usually use formula:


    ```

    $$\hat{x}_i = \frac{x_i - \mu_i}{\sigma_i}$

    ```


    Where x is a point in specific position in the feature map of a layer; i is the
    coordinates of the four dimensions of N, C, H and W; C is the channel axis, H
    and W are the height and width axes.


    In the formula, $\mu$ is the mean and $\sigma$ is the standard deviation. Their
    calculation is shown in formula 2, which is a small constant value:


    ```

    $$\mu_i = \frac{1}{G}\sum_{j \in G_i} x_j, \\sigma_i = \sqrt{\frac{1}{G}\sum_{j
    \in G_i} (x_j - \mu_i)^2 + \epsilon}$

    ```


    And in formula 2, the G is the area of point set to calculate the mean value after
    fitting the k condition, and m is the size of this set. Therefore we focus on
    the definition of k condition in group normalization, as as formula 3:


    ```

    $S_i = \{k | k \in L_i, [\frac{c}{G}] = [\frac{c}{G}]$

    ```


    C is the number of channels in each group; $\frac{c}{G}$ means that i and k are
    in the same group of channels, that is to say, group normalization means grouping
    in direction, normalizing each group and calculating the mean value.


    In this experiment, we apply group normalization to image processing, and replace
    BN in Efficient network to improve the influence caused by you


