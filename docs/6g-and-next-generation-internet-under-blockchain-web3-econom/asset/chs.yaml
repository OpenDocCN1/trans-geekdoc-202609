  \ *通往 6G 的之路*\n\nDOI: [10.1201/9781003427322-](https://doi.org/10.1201/9781003427322-)\n\
  \n## 引言\n\n互联网一直在从移动互联网转向物联网（IoT）和未来的触觉互联网。同样，未来 5G 网络的能力将远超前几代通信。除了区域容量提升 1000\
  \ 倍、峰值速率达到 10 Gb/s 以及至少 1000 亿设备的连接外，5G 愿景的一个重要方面是*去中心化*。虽然 2G、3G 和 4G 蜂窝网络是在基础设施完全控制的假设下构建的，5G\
  \ 系统可能会放弃这一假设并演变为去单元化的架构。\n\n5G、物联网和触觉互联网在设计目标上存在显著重叠——最值得注意的是极可靠低时延通信（URLLC），这需要协同工作来保证低延迟和可靠性。今天的互联网正在开启一个新时代。虽然第一代数字革命带给我们信息互联网，但由区块链技术驱动的第二代革命正在带我们进入价值互联网，一个真正的点对点（P2P）平台。\n\
  \n有些人将去中心化区块链技术称为“21 世纪的炼金术”，因为它可以利用终端设备将计算转化为数字黄金。更重要的是，根据 Don 和 Alex Tapscott\
  \ 的说法，区块链技术使信任协作能够更充分地共享创造的财富，而不是试图解决日益严重的社会不平等。结果是区块链技术有助于为分布式资本主义和更具包性的经济创造平台。\n\
  \n特别值得关注的区块链技术是以太坊，它于 2015 年 7 月上线。以太坊由维塔里克·布特林（Vitalik Buterin）创立，他请求一种更广泛、更通用的脚本语言用于开发去中心化应用（DApps），这些应用不仅限于加密货币，这是比特币所缺乏且被比特币社区拒绝的能力。以太坊实现了新的经济形式以及公司、业务和所有权的分布式模型（例如，自组织层次结构和成员制合作社）。正如布特林所说，大多数技术倾向于自动化边缘执行琐事任务的工人，而以太坊则使中心自动化。例如，以太坊不是让出租车司机失业，而是让\
  \ Uber 失业，让出租车司机直接与客户工作（在 Uber 的自动驾驶汽车最终消灭他们的工作之前）。因此，以太坊的目标与其说是消除工作，不如说是改变工作的定义。事实上，它催生了以太坊项目内部第一个去中心化自治组织（DAO）的诞生。DAO\
  \ 是一种开源的分布式软件，“同时无处不在又无处存在”，从而创造了一种范式转移，为业务民主化提供了新机会，并使未来的企业家能够根据其改变世界的使命、愿景和战略的最优化需求，设计定制的虚拟组织。\n\
  \n\n\n\n\n关于比特币和其他去中心化数字货币已有许多优秀的综述（例如 \\[7\\]）。同样，区块链技术对整个社会和工业的基本概念和潜力也已在各种现有教程中得到了全面描述（例如\
  \ \\[8\\]）。在本章中，我们重点关注如何在物联网（IoT）背景下使用区块链技术，通过对实现新兴区块链物联网（B-IoT）的最新进展和开放挑战提供最新的综述。与底层机器间通信（`M2M`）中完全没有人类参与的物联网不同，触觉互联网（Tactile\
  \ Internet）预计通过通过互联网提供触觉信息（即触碰和执行）的实时传输，来实现对物理或虚拟对象的远程控制，从而将人类保留在环路（而非排除在之外）。为此，我们详细阐述了以太坊区块链技术，特别是\
  \ `DAO`，如何被实现未来的技术社会系统，特别是触觉互联网，而后者的具体工作机制尚不清楚 \\[8\\]]。\n\n本章其余部分的结构如下：在“以太坊对比比特币区块链”章节中，我们首先详细解释了以太坊和比特币区块链之间的共同点和特定差异。“区块链物联网（B-IoT）：最新进展与相关工作”章节回顾了新兴\
  \ B-IoT 的最新进展和开放挑战。在“IEEE P1918.1 触觉互联网”章节中，在简要回顾新兴触觉互联网的关键概念后，我们引入了所谓的人-代理-机器人协作（`HART`）设计方法，以及我们提出的基于嵌入人工智能（`AI`）能力的先进多接入边缘计算的低延迟\
  \ FiWi 增强 LTE-A 异构网络。在“触觉互联网的去中心化”章节中，我们详细阐述了以太坊特别是 `DAO` 在帮助触觉互联网去中心化方面的潜在作用。“区块链、人工智能与人类智能：未来之路”章节更详细地讨论了区块链、`AI`\
  \ 与增强智能的共生关系，“开放挑战与未来工作”章节建议了未来的研究方向。最后，“结论”章节总结全章。\n\n# 区块链技术\n\n在本节中，我们将简要概述区块链技术的基本概念，特别关注以太坊和比特币之间的主要共同点和特定差异。然后我们将介绍\
  \ `DAO`，它代表了以太坊中比特币无法找到的显著特征。\n\n## 以太坊对比比特币区块链\n\n随着公共组织和私营公司寻求利用其潜力，区块链技术已经经历了多次迭代。典型的区块链网络本质上是一个分布式数据库（也称为“账本”），由参与方执行或在它们之间共享的所有交易或数字事件记录组成。区块链可以分为公共网络（即\
  \ `permissionless`）和私有网络（即 `permissioned` 许可）。在前一类中，任何人都可以加入并参与区块链。相反，私有区块链应用特定的访问控制机制来决定谁可以加入网络。公共区块链是不可篡改的，因为任何交易都无法被篡改或更改。此外，它是伪匿名的，因为参与交易的身份由随机字符串形式的地址密钥表示。表\
  \ 2.1 突出了公共区块链和私有区块链之间的主要区别。注意，以太坊和比特币都是公共区块链。图 2.1 说明了比特币和以太坊之间的主要共同点和差异。比特币区块链主要设计用于促进比特币交易。它是世界上第一个真正去中心化、开源且抗审查的功能性数字货币。比特币利用基于\
  \ `SHA256` 哈希函数和数字签名的加密工作证明（`PoW`）共识机制。实现共识提供了极高的容错能力，确保了零停机，并使存储在区块链上的数据永远不可更改且抗审查。存在两种类型的参与者，其角色定义如下：\n\
  \nTable 2.1\n\n|  || 公共区块链 | 私有区块链 |\n| --- | --- | --- |\n| 网络类型 | 完全去中心化 | 部分去中心化\
  \ |\n| --- | --- | --- |\n| 访问权限 | 无许可读/写 | 许可读/写 |\n| 用户身份 | 伪匿名 | 已知参与者 |\n| 共识机制\
  \ | 工作证明/权益证明 | 预先批准的参与者 |\n| 共识确定 | 由所有矿工决定 | 由一个组织决定 |\n| 不可篡改性 | 几乎无法篡改 | 可能被篡改\
  \ |\n|目的 | 任何去中心化应用 | 业务应用 |\n\n![FIGURE 2.1 比特币和以太坊区块链：共同点与差异。](img/fig2_1.jpg)\n\
  \n*   *普通节点*：普通节点是一种传统的参与者，他们拥有区块链副本，并使用区块链网络发送或接收比特币。\n*   *矿工*：矿工是具有特定角色的参与者，通过验证交易创建区块并将其提交到区块链网络作为区块来构建区块链。矿工充当网络保护者，只要他们对挖掘过程、所需的硬件和软件以及互联网连接有足够的知识，就可以在世界的任何地方运行。\n\
  \n在比特币区块链中，大约每 10 分钟挖出一个区块，区块大小限制为 `1 MB`。注意，比特币区块链被限制在每秒七次交易的速度，这使其不适用于高频交易。比特币区块链的其他弱点还包括其脚本语言，该语言仅提供有限的小指令且不是图灵完备的。此外，使用比特币脚本语言开发应用程序需要编程和密码学的高级技能。\n\
  \n\n\n\n以太坊目前是仅次于比特币的热门区块链。它由瑞士非营利组织以太坊基金会开发，并来自全球开发者的贡献。以太坊有自己的名为“Ether”的加密货币，它提供了允许跨网络价值交换的主要流动性形式。Ether\
  \ 还提供了支付和赚取支持及使用网络产生的交易费的机制。与比特币一样，Ether 也是投机的对象，经历了巨大的波动。以太坊非常适合开发需要快速构建，并通过区块链平台进行高效、安全交互的\
  \ DApps。与比特币类似，以太坊使用 PoW（工作量证明）共识方法来验证交易并证明某些工作成果。PoW 机制使用的哈希算法被称为“Ethash”。与比特币不同，以太坊开发者期望用\
  \ PoW 替代所谓的“权益证明”（PoS）共识。PoS 要求矿工持有一定量的 Ether，如果矿工试图攻击区块链网络，这些 Ether 将被没收。以太坊平台通常被称为构建在底层区块链之上的“图完备以太坊虚拟机（EVM）”。图完备意味着只要资源足够，任何系统或编程语言都能计算任何可计算的内容。请注意，EVM\
  \ 执行交易需要少量的费用。这些费用被称为“gas”，所需的 gas 数量取决于给定指令的大小。指令越长，需要的 gas 就越多。\n\n比特币区块链简单地包含一个交易列表，而以太坊的基本单位是“账户”。以太坊区块链跟踪每个账户的状态，其中所有的状态转换都是账户之间价值和信息的传输。账户概念被认为是以太坊区块链的核心组成部分数据模型，因为用户通过交易与以太坊网络交互至关重要。账户代表外部代理的身份（例如人类或自动化代理、矿矿节点）。账户使用公钥加密对每笔交易进行签名，以便\
  \ EVM 可以安全地验证交易发送者的身份。\n\n除了 C++ 之外，以太坊还支持几种基于 JavaScript 和 Python 的编程语言（例如 Solidity、Serpent、Mutan\
  \ 或 LLL），其中 Solidity 是编写所谓的“智能合约”最流行的语言。智能合约是一种完全按照程序运行且不受任何第三方干预的协议。它使用自己任意的所有权规则、交易格式和状态转换逻辑。智能合约的每个方法都可以通过交易或另一个方法调用。智能合约实现了\
  \ DApps 的应用，在应用程序编程接口（API）方面，DApps 可能与传统应用程序看起来完全一样，尽管中心化的后端服务被运行在去中心化以太坊网络上的智能合约取代，而不依赖任何中央服务器。现有的有趣\
  \ DApps 包括 Augur（一个去中心化预测市场）、Weifund（开源筹平台）、Golem（超级计算）和 Ethlance（去中心化工作市场平台）等。为了在\
  \ DApps 之间提供有效的通信手段，以太坊使用了 Whisper P2P 协议，这是一种用于秘密消息和数字加密的全去中心化中间件。Whisper 支持在不需要信任第三方的情况下创建加密通信路由。它基于采样服务，考虑了网络地址翻译（NAT）和防火墙等网络限制。通常，任何中心化服务都可以通过以太坊区块链转换为\
  \ DApp。\n\n### 去中心化自治组织 (DAOs)\n\n加密货币和区块链最显著的可能是它们让全球范围内的人和组织在追求自身利益的同时创造巨大的共享价值。许多观察者认为，这是目前公司的真实替代。加密货币的去中心化、基于群体的技术、分布式账本、分布式共识和智能合约提供了从根本上改变人们组织事务的方式，并为企业设计提供了新的范式。最近用群体取代公司的两个尝试是区块链技术和\
  \ DAOs。DAO 是没有中央权威或领导者的去中心化组织。它们运行在编码以太坊区块链上的编程代码上。与区块链一样，DAO 的代码通过消除对中心化控制的需求，脱离了传统组织。即使是\
  \ DAO 的原始开发者也没有额外的权限，因为它在没有任何人工干预的情况下独立运行。它可能由一组个人资助以支付基本成本，并给予资助者投票权而不是任何形式的所有权或股权。这创建了一个自主且透明的系统，只要它为客户提供有用的服务，它就会在网络上继续运行。\n\
  \n部署 DAO 概念实现智能合约自动化的成功示例是 Storj，它是一个去中心化、安全、隐私且加密的云存储平台，可以作为 Dropbox 或 Google Drive\
  \ 等中心化存储提供者的替代方案。DAO 可能由一组个人资助以支付基本成本，给予资助者投票权而不是任何形式的所有权或股权。这创建了一个自主且透明的系统，只要它为客户提供有用的服务，它就会在网络上继续运行。DAO\
  \ 以开源分布式软件的形式存在，执行智能合约并根据指定的治理规则和指南工作。Buterin 在以太坊博客上这样描述 DAO 的理想：“它是运行在互联网上并自主运行的实体，但也高度依赖雇佣个人来执行自动化本身无法完成特定任务。”与完全自主的\
  \ AI 代理不同，DAO 仍然需要人类的深度参与，特别是根据 DAO 定义的协议进行交互以运行。为了说明 DAO 和 AI 的区别，图 2.2 显示了一个象限图，根据自动化和人类在边缘和中心的参与程度，对\
  \ DAOs、AI、传统组织以及机器人（已广泛部署在装配线等领域中）进行了分类。我们将详细阐述如何利用 DAO 的这一特定特征（即中心是自动化，边缘是人类）在“去中心化触觉互联网”章节中开发触觉互联网。为此，我们还简要指出，根据\
  \ Buterin 的观点，DAO 是非营利的，尽管人们可以在 DAO 中赚钱，但不是通过投资 DAO 本身，而是通过参与其生态系统（例如通过成员身份）。\n\n\
  ![图 2.2 DAOs 与人工智能、传统组织以及机器人（已广泛部署在装配线等领域中）：自动化和人类在边缘和中心的参与程度。（来自以太坊博客）](img/fig2_2.jpg)\n\
  \n为了方便起见，表 2.2 总结了比特币和以太坊区块链对比的技术细节。\n\n\n\n\n## 比特币与以太坊区块链的对比\n\n| | 比特币 (BITCOIN)\
  \ | 以太坊 (ETHEREUM) |\n| --- | --- | --- |\n| 货币 | 比特币 | 以太币 |\n| 应用 | 加密货币 | 加密货币、智能合约、DApps/DAO\
  \ |\n| 编写语言 | C++ | C++, Go, Python |\n| 共识机制 | 工作量证明 (基于 SHA-256) | 工作证明 (Ethash),\
  \ 正在规划权益共识 |\n| 图灵完备性 | 否 | 是 |\n| 匿名机制 | 否 | 是（通过 Whisper 协议） |\n| 抗审查性 | 否 | 是\
  \ |\n| 交易限制 | 7 次/秒 | 20 次/秒 |\n| 状态概念 | 否 | 数据 |\n| 智能合约语言 | 否 | Solidity, Serpent,\
  \ Mutan, LLL |\n| 智能合约执行 | 否 | 以太坊虚拟机 (EVM) |\n| 区块时间 | 10 分钟 | 15 秒 |\n| 数据模型 |\
  \ 基于交易 | 基于账户 |\n| 客户端 P2P 连接 | 否 | 是（通过 Whisper 协议） |\n| 路由 | 否 | 是（Whisper 协议）\
  \ |\n\n## 区块链物联网与边缘计算\n\n在本节中，在定义了区块链与物联网（B-IoT）的集成后，我们将讨论这种集成的动机，随后描述集成区块链与边缘计算所面临的挑战。\n\
  \n### 区块链物联网 (B-IoT)：最新进展与相关工作\n\n回顾引言，物联网（IoT）的设计旨在实现机器之间在不依赖人类参与的情况下进行通信。因此，其底层的机器间（M2M）通信对于实现工业和其他以机器为中心的流程自动化非常有用。新兴的\
  \ B-IoT 代表了两种大规模技术——区块链和 M2M 通信的强大结合，使我们能够实现复杂的多步骤 IoT 流程（例如通过智能合约）。随着 IoT 设备之间通信协议的种类不断增加，需要一种透明且高度安全、可靠的\
  \ IoT 设备管理系统。本节综述了新兴 B-IoT 的先进技术，描述了近期进展和开放的挑战。\n\n大多数 IoT 设备受到资源限制，这限制了它们成为区块链网络的一部分。为了应对这些局限性，Novo\
  \ `[9]` 提出了一种去中心化的访问管理系统，在该，所有实体都是以太坊区块链的一部分，但 IoT 设备以及所谓的“管理枢纽”节点除外，这些节点代表不同无线传感器网络的\
  \ IoT 设备向区块链请求权限。此外，被称为“管理器”的实体与托管在区块链中特定“代理节点”上的智能合约交互，以定义或修改其关联 IoT 设备资源的访问控制策略。该概念验证的实现评估了不属于以太坊网络的新系统架构组件（即管理枢纽和\
  \ IoT 设备），并证明了所提访问管理架构在延迟和扩展性方面的可行性。另一个有趣的以太坊案例研究可以在 `[10]` 中找到，该研究回顾了现用的以太坊区块链包，根据其在处理访问控制策略、数据存储和数据流管理方面的智能合约功能，来实现一个智能家居系统。\n\
  \nLiao 等人 `[11]` 更详细地研究了实现区块链驱动的 IoT 服务的架构问题。在一项以智能物品租赁服务作为 B-IoT 服务示例的初步研究中，作者比较了基于以太坊的四种不同架构风格：(i)\
  \ 全中心化（无区块链的云），(ii) 伪分布式物品（物理位于中央云），(iii) 分布式物品（由智能合约直接控制），以及 (iv) 完全分布式。初步结果表明，在终端用户设备上部署区块链端点的完全分布式架构在鲁健性和安全性方面更为优越。\n\
  \n`[12]` 讨论了在以太坊交易中集成安全元素的各种视角。提出了一种用于在智能物品交换的以太坊交易建立信任的新颖架构。为了防止签名密钥被盗或被黑客攻击，作者建议使用\
  \ `javacard-secure elements` 和所谓的“加密货币智能卡”（CCSC）。讨论了两个 CCSC 用例。在第一种情况下，CCSC 集成在由\
  \ `Arduino` 驱动的低廉 B-IoT 设备中，传感器数据集成到以太坊交易中。第二种用例涉及在远程 APDU 调用安全（RACS）服务器上部署 CCSC，以便通过\
  \ get 椭圆数字签名算法 (`ECDSA`) 实现远程安全的数字签名。\n\n区块链交易需要数字签名等公钥加密操作。然而，并非所有的 B-IoT 设备都能支持这种计算密集型任务。出于这个原因，Polyz\
  \ 和 Fotiou `[13]` 了一种面向网关方法的初步设计，将所有与区块链的操作卸载到网关。作者指出，他们的方法与以太坊客户端架构兼容。\n\n由于 IoT\
  \ 应用服务的巨大规模和分布式特性，区块链技术可以被用于提供一个安全的、防篡改的 B-IoT 网络。具体而言，抗改性和去中心化信任的关键属性允许我们构建一个没有单点故障的安全认证和授权服务。为此，Gupta\
  \ 等人 `[14]` 初尝试开发一种由区块链支持的安全模型，为 B-IoT 网络中传输和接收的数据提供机密性、完整性和可用性。所提出的解决方案在 `TCP/IP`\
  \ 传输层之上包含一个区块链协议层和一个区块链应用层。前者包含用于 B-IoT 节点的分布式共识算法，而后者定义了 IoT 特定的交易及其在高层协议中的语义。为了评估所提分层架构的可行性和性能，在树形拓扑连接的\
  \ B-IoT 节点使用 `1 Gbps Ethernet` 或 `54 Mbps WiFi` 链路进行了仿真。仿真结果显示，当用无线 WiFi 替换替换以太网时，延迟的增加和带宽的减少对区块到达率的影响不大，因为区块难度调整会动态适应网络状况。\n\
  \n在各种低功耗广网（LPWA）技术中，远距离（LoRa）无线射频（RF）被认为是实现大规模 IoT 部署最有前景的助力之一。Özyilmaz 和 Yurdakul\
  \ `[15]` 展示了一个概念验证演示器，使低功耗、资源受限的 LoRa IoT 终端设备通过作为全节点节点的中间网关访问以太坊区块链网络。具体而言，电池供电的\
  \ IoT 终端设备将位置数据发送到 LoRa 网关，网关反通过标准的基于 Go 的以太坊客户端 `Geth` 使用智能合约将其转发到区块链网络。LoRa 网关与后端应用程序服务器之间的事件驱动通信机制已实现为概念验证演示器。\n\
  \n\n\n\n\n物联网（IoT）对象识别面临一个根本性挑战源于传统的域名系统（DNS）。通常，DNS 在中心化模块中管理，因此在大型系统中，它可能会由于单方面的高级持续威胁（APT）攻击以及区域文件同步延迟导致大规模故障。显然，需要一种更健壮、分布式的名称管理系统，以支持\
  \ DNS 的平滑演进，并使其对于物联网及整个未来网络更加高效。为此，Duan 等人引入了一种名为“DNSLedger”的去中心化区块链域名系统 \\[16]。为了重建\
  \ DNS 的层级结构，`DNSLedger` 包含了两种区块链：(i) 一个存储所有顶级域名信息的单一根链，以及 (ii) 多个顶级域名（TLD）链，每个链负责各自域名的信息。在\
  \ `DNSLedger` 中，域名服务器作为区块链节点，而每个 `TLD` 链可能会选择一个或多个服务器加入根链。`DNSLedger` 客户端可以执行常见的\
  \ DNS 功能，如域名查询、应用和修改。\n\n上述许多研究都将以太坊作为首选区块链。事实表明，完全分布的以太坊架构能够增强健性和安全性。此外，通常采用面向网关的设计方法，将计算密集型任务从低功耗、资源受限的物联网终端卸载到中间网关，从而使其能够访问以太坊区块链网络。同时还表明，WiFi\
  \ 访问链路的延迟增加和带宽减少不会导致区块到达率大幅恶化。\n\n尽管近期取得了进展，但以太坊与其他区块链区分的显著特征（见“以太坊对比比特币区块链”章节）仍有待深入探索，包括它们与人工智能、机器人等其他新兴关键技术的共生，以及被称为“边缘计算”的去中心化云计算解决方案的融合。\n\
  \n### 区块驱动边缘计算\n尽管近期取得了进展，但以太坊与其他区块链区分的显著特征（见“以太坊对比比特币区块链”章节）仍有待深入探索，包括它们与人工智能、机器人等其他新兴关键技术的共生，以及被称为“边缘计算”的去中心化云计算解决方案的融合。\n\
  \n此处特别感兴趣的问题是如何利用去中心化机制来实现……，这在 \\[8] 中尚未被考虑。云计算面临的关键挑战之一是端到端响应。为了解决这一挑战，提出了多接入边缘计算（`MEC`），它是一种附近的、资源丰富的计算机或计算机集群。根据\
  \ ETSI 发布的白皮书，`MEC` 被认为是一种关键新兴技术。鉴于上述论，将区块链和边缘计算集成成一个统一的实体成为一种自然趋势。一方面，通过将区块链引入边缘计算网络，系统可以提供可靠的网络访问和控制。另一方面，边缘计算使得从功率限制的设备进行区块链存储和挖矿成为可能。此外，边缘计算实现了扩展的存储和计算\
  \ \\[17]。\n\n近期关于区块链和边缘计算开展了多项研究。在 \\[18] 中，通过将共识过程和数据处理任务卸载到更强大的边缘计算资源，资源受限的物联网设备从计算密集型任务中解放出来。所提出的\
  \ `EdgeChain` 构建在以太坊平台上，使用智能合约监控和监管物联网设备的行为。在 \\[19] 中，提出了另一种具有边缘计算能力的物联网区块链计算卸载方案，称为\
  \ `BeCome`。该研究的目标旨在减少边缘计算设备的任务卸时间和能量消耗，同时实现负载均衡和数据完整性。\n\nZhaofeng 等人 \\[20]] 了一种基于区块链的边缘计算信任数据管理方案\
  \ `BlockTDM`，用于解决边缘计算环境中的数据信任和安全问题。具体而言，作者提出了一种灵活可配置的区块链架构，包括相互身份验证协议、灵活共识、智能合约、区块和交易数据管理以及区块链节点管理和部署。`BlockTDM`\
  \ 方案支持基于矩阵的多通道数据分段以及对敏感或隐私数据的隔离保护。此外，作者在交易负载存储到区块链系统之前设计了用户定义的敏感数据加密。他们通过适当的智能合约实现了对受保护区块链数据和交易的条件访问和解密查询。他们的分析和评估表明，提出的\
  \ `BlockTDM` 方案为信任数据管理提供了一种通用、灵活且可配置的区块链范式，具有高度的可信度。\n\n总之，区块链驱动边缘计算已成为一个重要概念，它利用去中心化管理和分布式服务来满足下一代通信网络的安全、可扩展性和性能需求，这在“去中心化触觉互联网”中进行了更详尽的技术讨论。\n\
  \n## IEEE P1918.1 触觉互联网\n\n在本节中，我们简要概述触觉互联网的基本概念、特征、结构和分类。随后，将更详细介绍一些典型的触觉互联网应用和网络基础设施需求。\n\
  \n### 触觉互联网：核心原理\n\n\n\n\n\n“触觉互联网”（Tactile Internet）这一术语由 `Fettweis` 于 2014 年提出。在他的开创性论文\
  \ `[21]` 中，触觉互联网被定义为一种突破性技术，通过要求`1–10 ms`的往返延迟，实现了对现实和虚拟对象进行触觉引导和控制的前所未有的移动应用。随后在\
  \ 2014 年后期，`ITU-T`发布了一份关于触觉互联网的技术观察报告，强调扩大有线和无线接入网络领域的研究至关重要，这将引入新的想法和概念，增强接入网络的冗余和多样性，以满足触觉互联网应用对严格延迟以及载波级可靠性的要求\
  \ `[22]`。触觉互联网为实时远程物理交互提供了媒介，这需要在虚拟或真实对象（即人类、机器和流程）之间进行闭环信息的交换。这种强制性的端到端设计充分体现在新兴\
  \ `IEEE P1918.1` 标准工作组（成立于 2016 年 3 月）参考架构的关键原则中，该工作组旨在为触觉互联网定义框架 `[23]`。其中，关键原则构想了(i)\
  \ 开发一种通用的触觉互联网参考架构；(ii) 通过无线（例如蜂窝、WiFi）或无线线混合网络支持局域及广域连接；(iii) 利用网络边缘云变体的计算资源。该工作组将触觉互联网定义为“一种网络或网络集合，用于人类或机器以感知实时远程访问、感知、操作或控制现实或虚拟对象或流程”。`IEEE\
  \ P1918.1` 中考虑的一些关键用例包括远程操作、触觉通信、沉浸式虚拟现实和汽车控制。\n\n为了使其更具 5G 中心特色，触觉互联网最近也被称为 5G\
  \ 赋能的触觉互联网 `[24, 25]`。请记住，与之前的四代蜂窝网络不同，未来的 5G 网络将导致蜂窝和 WiFi 技术及标准的日益融合 `[26]`。此外，还需要认识所谓“回传瓶颈”重要性，这需要一种同时利用无线前端和有线回传技术的端到端设计方法。或者正如\
  \ `[26]` 的首席作者 `Andrews` 雄辞地指出的：“在各地部署基站对于为移动站提供高速接入是极好的，但难道这只是把责任推给了基站吗？基站现在必须以某种方式将这些数据在有线核心网络之间进行传输？”\
  \ `[27]`。显然，触觉互联网开启了许多令人兴奋的研究方向，通过互联网为人机交互增加了一个新维度。根据上述 `ITU-T` 技术观察报告，触觉互联网应该是当今物联网（IoT）演变的下一次飞跃，尽管\
  \ 5G、IoT 和触觉互联网之间存在显著重叠。例如，`Fig. 2.3]` 通过 IoT、5G 和触觉互联网这三个视角提供了上述共同点和差异的视图。主要差异最好通过底层通信范式和实现设备来表达。`IoT`依赖于\
  \ `M2M` 通信，重点关注智能设备（例如传感器和执行器）。在与新兴的 `MTC` 共存的同时，`5G` 将保持其传统的人机（`H2H`）通信范式用于传统的三业务业务（语音、视频和数据），并日益关注与其他无线技术（尤其是\
  \ WiFi）的集成以及去中心化。相反，触觉互联网将以利用触觉和力觉设备的人机（`H2M`）通信为中心。更重要的是，尽管存在差异，`IoT`、`5G`和触觉互联网似乎正在向一组共同的重要设计目标融合：\n\
  \n![图 2.3 物联网 (IoT)、5G 和触觉互联网的三个视角：共同点与差异。](img/fig2_3.jpg)\n\n`FIGURE 2.3` 物联网\
  \ (IoT)、5G 和触觉互联网的三个视角：共同点与差异。\n\n*   量级为 1 ms 的极低延迟\n*   极高可靠性，几乎可以保证 99.999%的可用性\n\
  *   H2H 和 M2M 共存\n*   以数据为中心技术的集成，特别关注 WiFi\n*   安全性\n\n重要的是，触觉互联网涉及`H2M`交互固有的“人在环”（`HITL`）本质，而与其底层`M2M`通信中完全没有人类参与的新兴`IoT`不同。尽管`M2M`\
  \ 通信对于工业和其他以机器为中心的流程的自动化有用，但触觉互联网将以人机/机器人（`H2M/R`）通信为中心，从而允许采用以人为中心的设计方法，以创造新的沉浸式体验，并通过互联网扩展人类的能力（即对人类的增强而非自动化）\
  \ `[28]`。\n\n### 人-智能体-机器人协作\n\n通过一种能够流流协调人类与机器协同活动的流程来实现高级人机协作的一种前景前景的方法，可以在尚年轻的人-智能体-机器人协作（`HART`）领域\
  \ `[29]`。与早期的自动化研究不同，HART 超越了对完全自主（即完全的独立和自给自足）以及自主系统之间协作/协作自主的单一关注，这些目标是在设计人类环外的解决方案时排除人类作为潜在的队友。在\
  \ HART 中，人类与机器之间功能和任务的动态分配起着核心作用，这种分配可能随时间变化或在不同情况下不可预测。特别是，随着日益智能的机器的兴起，历史上通过“人类擅长/机器擅长”（`HABA/MABA`）方法来决定哪些任务最适合人类执行哪些由机器执行而非协同工作的方法已经过时。为了更好地理解当前智能机器的潜力和局限性，`T.\
  \ H. Davenport`和`J. Kirby`在他们的著作*Only Humans Need Apply: Winners and Losers in the\
  \ Age of Smart Machines*中沿着两个维度对智能机器的能力分类，即行动能力和学习能力。行动能力涉及四个任务级别，从最基础的任务（例如分析数字）到执行数字任务（由智能体完成）甚至物理任务（由机器人完成）。另一方面，学习能力通过四个等级升级，从没有内在智能的人类辅助机器到具有上下文感知、学习甚至自我意识智能的机器。\n\
  \n\n\n\n\n根据 Bradshaw 等人 \\[29] 的研究，在 HART（人类辅助机器人技术）等研究挑战中，开发能够让自主系统不仅为人类服务，还能与人类及其他系统协同工作的能力，代表了一项重要的开放问题，即将人类视为智能智能体团队的“成员”，而不是继续将其视为传统的“用户”。在下文中，我们引入并扩展了光无线（FiWi）增强型\
  \ LTE 进阶（LTE-A）异构网络（HetNets）的概念，通过利用 AI 增强的 MEC 能力来实现低往返延迟和低抖动，从而实现本地和非本地远程操作。\n\
  \n### 低延迟 FiWi 增强 LTE-A 异构网络\n\n### 低延迟 FiWi 增强 LTE-A 异构网络\n\nFiWi 接入网络也称为“无线光宽带接入网络”（WOBANs），结合了光纤网络的可靠性、稳健性和高容量，以及无线网络的灵活性、无处和成本优势\
  \ \\[30]。为了提供每用户高达 200 Mbps 的峰值数据速率并实现完全固移动融合的愿景，将现有的遗留线路和微波回传技术替换为集成的 FiWi 宽带接入网络至关重要。\n\
  \nBeyranvand 等人 \\[31\\] 研究了统一以覆盖为中心的 4G 移动网络与以容量为中心的基于数据以太网技术的 FiWi 宽带接入网络（通过光纤回传共享和\
  \ WiFi 卸载能力应对移动数据流量的前所增长）带来的性能收益。我们通过概率分析和验证仿真，评估了 FiWi 增强 LTE-A 异构网络的最大聚合吞吐量、卸载效率，特别是延迟性能，包括各种本地化无纤回传冗余和无线保护技术的积极影响。在研究中，我们特别关注了由于以太网无源光网络（`EPON`）光纤故障导致的光纤回传可靠性问题，以及由于\
  \ WiFi Mesh 节点失败以及空间 WiFi 覆盖限制导致的 WiFi 卸载限制。\n\n例如，图 2.4 展示了不同 WiFi 卸载率（`WOR`）下，FiWi\
  \ 增强 LTE-A 异构网络的平均端到端延迟性能与聚合吞吐量的关系，其中 `0 ≤ WOR ≤ 1` 表示卸载到 WiFi 的移动用户流量百分比。所出的分析和验证仿真结果是在假设均匀流量负载和真实的\
  \ LTE-A 及 FiWi 网络配置下，并应用最小（光和无线）跳数路由得到的。更多细节请参考 \\[31]。目前，让我们假设 `EPON` 的可靠性是理想的（即不发生光纤回传故障）。然而，与\
  \ `EPON` 不同，WiFi Mesh 网络可能有 `10−6` 的概率遭受无线服务中断。我们从图 2.4 中观察到，随着 `WOR` 的增加，FiWi 增强\
  \ LTE-A 异构网络的吞吐量延迟性能显著提高。具体来说，通过将 `WOR` 从 `0.1` 改变到 `0.57`，最大可用聚合吞吐量从约 61 Mbps 增加到约\
  \ 126 Mbps（即最大可用聚合吞吐量增加了一倍多）。更重要的是，进一步增加 `WOR` 到 `0.9` 并不会导致最大可用聚合吞吐量的再次显著增加，但对于降低平均端到端延迟并使其在广泛流量负载下保持在\
  \ `10−3` 秒（1 ms）的极低水平非常有帮助。因此，这一结果表明，通过 WiFi 从 4G 移动网络卸载大部分数据流量是获得 1 ms 极低延迟的一种前景方法。\n\
  \n![FIGURE 2.4 不同 WiFi 卸载率 (WOR) 下平均端到端延迟与聚合吞吐量的关系](img/fig2_4.jpg)\n\nFIGURE 2.4\
  \ 不同 WiFi 卸载率 (WOR) 下平均端到端延迟与聚合吞吐量的关系。\n\n### AI 增强型 MEC：将 AI 推向边缘\n\n图 2.5 展示了带有\
  \ AI 增强 MEC 服务器的 FiWi 增强 LTE-A 异构网络的通用网络架构。光纤回传由时分或波分复用（`TDM/WDM`）`IEEE 802.3ah/av`\
  \ 1/10 Gb/s `EPON` 组成，中心光终端（`OLT`）与远程光网络单元（`ONUs`）之间的典型光纤范围为 20 km。`EPON` 可能包含多个阶段，每个阶段通过波分分路器和合并器或波复用器和解复用器分开。有不同的\
  \ ONU 子集。`ONU` 可以为固定（有线）用户服务。或者，它可以连接到小区网络基站（`BS`）或 `IEEE 802.11n/ac/s` WLAN Mesh\
  \ 门户点（`MPP`），分别产生同地的 `ONU-BS` 或 `ONU-MPP`。根据轨迹，移动用户（`MU`）可以通过小区网络或 WLAN Mesh 前端进行通信，前端由\
  \ `ONU-MPPs`、中间 Mesh 点（`MPs`）和 Mesh 接入点（`MAPs`）组成 \\[32]。\n\n![FIGURE 2.5 用于本地和非本地远程操作的带有人工智能\
  \ (AI)-增强 MEC 的基于 FiWi 的触觉互联网架构](img/fig2_5.jpg)\n\nFIGURE 2.5 用于本地和非本地远程操作的带有人工智能\
  \ (AI)-增强 MEC 的基于 FiWi 的触觉互联网架构。\n\n假设人类操作员（`HOs`）和远程操作机器人（`TORs`）仅通过 WLAN 通信，而不是使用双模式\
  \ 4G/WiFi 手机的 `MUs`。远程操作在本地或非本地进行，取决于涉及的 `HO` 和 `TOR` 的距离，如图 2.5](#chapter02.xhtml#f2_5）所示。在本地远程操作中，`HO`\
  \ 和相应的 `TOR` 关联同一个 `MAP`，并通过该 `MAP` 交换命令和反馈样本，而不经过光纤回传。相反，如果 `HO` 和 `TOR` 关联不同的\
  \ `MAPs`，非本地远程操作通常通过回传 `EPON` 和中心 `OLT` 进行。尽管最近对利用机器学习进行光通信和网络感兴趣，但为 `HOs` 实现沉浸式透明远程操作体验的边缘智能尚未探索。在\
  \ \\[32\\]中，Maier 和 Ebrahimzadeh 在我们考虑的网络边缘应用了机器学习，以实现沉浸且无缝的触觉互联网体验。为了实现边缘智能，选定的\
  \ `ONU- BS/MPPs` 配备了 AI 增强 MEC 服务器。这些服务器依赖于位于光无线接口处的计算节点（见图 2.5](#chapter02.xhtml#f2_5））的计算能力来预测反馈路径中的延迟触觉样本。结果是\
  \ `HO` 能够以 1 ms 的粒度实时感知远程任务环境，从而实现更紧密的协作、改进安全控制并提高远程操作系统的可靠性。\n\n\n\n\n\n回顾“引言”部分，触觉互联网（Tactile\
  \ Internet）将涉及人机交互（H2M）固有的人类在回路（HITL）特性，而非新兴的物联网（IoT）。因此，它允许采用以人为中心的设计方法，通过互联网扩展人类的能力，实现人类的**增强**而非自动化。最近，Maier\
  \ 等人 [28]] 提出观点，触觉互联网可能是当代及早期互联网先驱们所设想的人类增强和人机共生的先驱。具体而言，我们阐述了 AI 增强智能体在支持人类进行人机任务协调方面可能发挥的作用。为了实现先进的人机协作，我们开发了一种计算和物理任务的分布式分配算法，用于流畅地协调\
  \ HART（人机增强协作）活动（例如共享使用用户和/或网络拥有的机器人）。在我们的设计方法中，所有 HART 成员通过通信建立了一种集体自我意识，目标是使任务完成时间最小化。\n\
  \n在接下来，我们寻找上述 HART 成员与 DAO、AI 和机器人互补优势之间的协同作用（参见图 2.2），以通过去中心化触觉互联网来促进局部人机协作集群。为了这一目标，更好地理解\
  \ AI 的优点和局限性至关重要。最近，斯坦福大学启动了`人工智能百年研究 (AI100)`。在首份报告《2030 年的人工智能与生活》中，作者将 AI 定义为一组计算技术，其灵感源于人们利用其神经系统和身体进行感知、学习、推理和采取的方式。他们还指出，AI\
  \ 在短期内可能取代任务而非工作，并强调了通过众包人类专业知识来解决单凭计算机无法良好解决的问题的重要性。\n\n### 分布式边缘智能\n\n> 首先，让我们通过部分或完全去中心化\
  \ MEC（多边缘计算）来探索利用移动终端设备的潜力。我们在融合光纤-无线移动网络的光-无线接口处引入了 AI 增强型 MEC 服务器用于计算卸载。假设与 [28]]\
  \ 相同的默认网络参数设置和仿真设置，我们考虑 1 ≤ `N[Edge]` ≤ 4 个 AI 增强型 MEC 服务器，每个服务器关联 8 个终端用户，其中 1\
  \ ≤ `N[PD]` ≤ 8 个部分去中心化的终端用户可以通过改变其计算卸载概率来灵活控制卸载任务的数量。剩余的 8 − `N[PD]` 是完全中心化的终端用户，仅依赖边缘计算（即其计算卸载概率等于\
  \ 1）。注意，当 `N[Edge]` = 4 时，所有终端用户都可以将其计算任务卸载到边缘节点。相反，当 `N[Edge]` < 4 时，一个或多个边缘节点不可用于计算卸载，其关联终端用户将回退到本地计算资源（即完全去中心化）。图\
  \ 2.6 显示了在不同 `N[Edge]` 和 `N[PD]` 下，部分去中心化终端用户的平均任务完成时间随计算卸载概率的变化情况。我们从图 2.6 中观察到，对于给定的\
  \ `N[Edge]`，增加 `N[PD]`（即更高的去中心化程度）有效减少平均任务完成时间。具体而言，对于 `N[Edge]` = 4，高去中心化程度（`N[PD]`\
  \ = 8）允许终端用户通过将计算卸载概率优化调整为 0.7，获得高达 89.5% 的平均任务完成时间缩短。\n\n![图 2.6 不同数量部分去中心化终端用户\
  \ (nPD) 和人工智能 (AI)-增强型 MEC 服务器 (nedge) 的平均任务完成时间（秒）随计算卸载概率的变化图。](img/fig2_6.jpg)\n\
  \n图 2.6 不同数量部分去中心化终端用户 (`n[PD]`) 和人工智能 (AI)-增强型 MEC 服务器 (`n[edge]`) 的平均任务完成时间（秒）随计算卸载概率的变化图。\n\
  \n随着互联的计算能力遍布全球并在其之上构建了实用的平台，大众已成为一种明显可行且有价值的资源。根据 McAfee 和 Brynjolfsson [6]]，对于现代资本主义核心的企业来说，有许多方法可以挖掘\
  \ DAO 等这样没有证书且传统缺乏经验的技术赋能群体成员的专业知识。Maier 等人 [28]] 开发了一种基于共享用户和/或网络拥有机器人的 HART 中心任务协调的物理任务自我感知分配算法。回顾“AI\
  \ 增强型 MEC：将 AI 推向边缘”，通过使用我们的 AI 增强型 MEC 服务器作为自主智能体，我们证明了来自 TOR（远程操作机器人）的延迟力反馈样本可以在本地生成并交付给邻近的\
  \ HO（人类操作员）。然而注意，基于样本预测的远程操作系统的性能很大程度上取决于预测算法的准确性。\n\n### 众包：扩展 HO 劳动力队伍\n\n为了在去中心化的触觉互联网中实现\
  \ DAO，可以使用以坊建立远程物理任务执行的 HO-TOR 会话，其中智能合约有助于建立和维护信任的 HART 成员身份，并允许每个 HART 成员对所有参与的\
  \ HO、TOR 和 MEC 服务器拥有全局知识，这些服务器按照广泛使用的网关导向方法作为自主智能体运行（参见区块链物联网 (B-IoT)：最新进展与相关工作）。HO\
  \ 远程执行给定的物理任务，直到最近的 `n` 个触觉反馈样本中有 `k` 个发生预测错误。此时，HO 立即停止远程操作并通知智能体。智能体将中断的任务分配给附近的可用\
  \ HO，由其移动到任务点并完成物理任务。对于 `n` = 5，图 2.7 描述了不同 `k` 和 `f[human]/f[robot]` 下的平均任务完成时间随预测错误概率的变化，其中\
  \ `f[human]` 和 `f[robot]` 分别代表人类机器人执行物理任务的能力（每秒操作数）。我们观察到，当 `k` = 1 时，随着预测错误概率从\
  \ 0 增加到 0.25，任务完成时间增加，而 `k` = 3 时几乎保持不变。进一步注意，随着人类能力的增强（即增加 `f[human]/f[robot]`），结果任务完成时间会减少直到达到平台期，因为移动会产生额外的延迟。\n\
  \n![图 2.7 不同预测错误数量 (k) 和人类机器人操作能力比例 (fhuman/frobot) 的平均任务完成时间（秒）随预测错误概率的变化图。](img/fig2_7.jpg)\n\
  \n图 2.7 不同预测错误数量 (`k`) 和人类机器人操作能力比例 (`f[human]/f[robot]`) 的平均任务完成时间（秒）随预测错误概率的变化图。\n\
  \n## 区块链、AI 与人类智能：未来之路\n\n今天，人工智能、机器学习、机器人和物联网正在汇聚，并开始利用加密货币、代币发行（ICO）、虚拟资产和万物代币化引发新的变革浪潮。\n\
  \n这些创新的融合结果引发了人们对失业、机器人主宰以及未来的普遍担忧 [33]]。\n\n\n\n\n\nMaier 等人 [28]] 提到了将研究重点从 AI\
  \ 转向智能增强（IA）的重要性，即利用信息技术来增强人类决策。然而需要注意的是，在不确定性增加的动态任务环境和极其复杂的现实场景中，IA 会变得非常困难。IA\
  \ 也称为“认知增强”或“机器增强智能”，对于增强人类的创造力、理解力、效率和智能将发挥重要作用。\n\n### 基于认知辅助的智能增强\n\n边缘计算是一种广泛研究的方法，旨在增加众包的效用，它可以通过通过提供认知辅助，引导人类一步步地完成物理任务执行过程。从技术上讲，这可以通过为无技能的\
  \ `DAO` 成员配备增强现实（AR）头设备（例如带有 WiFi 连接的 `HoloLens 2`）来轻松实现，该头设备可以从其最近的 AI 增强型 `MEC`\
  \ 服务器实时接收工单信息。\n\n### HITL 混合增强智能\n\n人类面对许多问题往往具有高度的不确定性、复杂性和开放性。为了解决此类问题，可以引入人类交互和参与。因此，这催生了用于高级人机协作的\
  \ HITL 混合增强智能概念 [34]]。HITL 混合增强智能定义为一种智能模型，它需要人类交互并允许处理可能无法通过机器学习轻松训练或分类的问题和需求。通常，机器学习在理解非结构化现实环境以及处理不完整信息和复杂的时空相关任务方面优于人脑。因此，机器无法独立完成人类社会中的所有任务。相反，AI\
  \ 和人类智能被看作是高度互补的。\n\n根据 Zheng 等人 [34]]，互联网为 HITL 混合增强智能提供了巨大的创新空间。具体而言，云机器人和 AR\
  \ 是多机器人协作系统中增强个体智能的增长最快的商业应用之一。HITL 混合增强智能的主要研究课题之一是开发相关方法，允许机器不仅从海量训练样本中学习，还能从人类知识中学习，以完成高度智能的任务。\n\
  \n### 去中心化组织的兴起\n\n这是为通用人工智能（AGI）提供的一种非常有趣的例子。\n\n### 面向人类增强的助推\n\n扩展人类交互，助推理论的利用。根据\
  \ Richard Thaler（这位诺贝尔经济学奖获得者），助推理论可以通过区块链技术影响人类行为。\n\n## 挑战与未来工作\n\n互联网正在不断演进，边缘计算对于实现未来系统具有巨大的潜力。类似的，`5G`\
  \ 网络将满足触感互联网对严格的延迟和可靠性的需求。Maier 等人 [35]] 最近概述了通过共享智能在机器人和人类之间实现触感互联网的技术。然而，区块链技术在未来移动网络中的前景广阔。尽管如此，区块链技术在未来移动网络中仍有许多研究问题待解决。\n\
  \n# 结论\n\n在本章中，我们展示了许多 `IoT` 研究利用区块链技术将计算密集型任务从资源受限的设备卸载到中间网关。基于我们对 HART 协作工作的研究，更高层次的\
  \ AI 增强将有助于缩短任务的完成时间。\n\n## 备注\n\n1. SingularityNET 白皮书，“一种下一代智能合约和分布式应用平台，”[`singularitynet.io`](https://singularitynet.io)。\n\
