  \ 年 7 月。\n\n13. S. Voshmgir，“标记化与区块链代币分类：一种形态学框架，《IEEE 计算机与通信研讨会（ISCC）论文集》，法国雷内斯，pp.\
  \ 1–6，2020 年 7 月。\n\n# 结论\n\n我们的关注重点是探索 DAO、CPSS 以及未来的 Web3 及其底层代币经济，以实现在信息素社会中的集体智能。以下是各章节的更详细总结。\n\
  \n在第 2 章中，我们展示了许多新兴的区块链物联网（B-IoT）研究使用以太坊作为选择区块链，并采用面向网关的设计方法将计算密集型任务从资源受的终端设备卸到中间网关，使其能够访问以太坊网络。为此，我们首先解释了以太坊和比特币区块链之间的共同点和区别，随后在技术上更详细地介绍了\
  \ DAO。我们随后讨论了区块链与物联网（B-IoT）整合的动机，并介绍了区块链与边缘计算整合的挑战。在我们近期关于协调混合 HART 活动的触觉互联网工作的基础上，我们引入了基于嵌入\
  \ AI 能力的先进 MEC 的低延迟 FiWi 增强 LTE-A 异构网络。我们随后证明了高水平去中心化 AI 增强 MEC 有助于缩短计算任务的平均完成时间。此外，对于去中心化触觉互联网中的物理任务执行，我们探索了如何使用以太坊\
  \ DAO 和智能合约建立可信的 HART 成员，以及在远程操作机器人的触觉反馈预测不可靠的情况下，人类众包如何帮助减少物理任务完成时间。我们概述了技术融合的未来研究方向，以便通过增强和共享智能利用助推（nudge）理论来成功完成人机混合任务，该理论是\
  \ 2017 年诺贝尔经济学奖得者理查德·H·塞勒推广的行为经济学新概念。\n\n\n\n\n在第 3 章中，我们探索了以太坊区块链技术（特别是上述 `DAO`\
  \ 概念）如何用于触觉互联网（Tactile Internet）的去中心化。该技术实现了感知实时远程控制真实或虚拟对象/过程的前所未有的移动应用，并代表了未来技术社会系统的一个前景示例。我们证明了，通过将计算卸载概率设置为\
  \ 0.7，提高 AI 增强型 `MEC` 的去中心化水平可以将平均计算任务完成时间缩短高达 89.5%。此外，我们观察到，对于中高反馈预测误差概率的任务，只要人类提供等同甚至更优越的操作能力，众包人类协助对于减少物理任务的平均完成时间是有益的，即\
  \ $~\\\\frac{f_{human}}{f_{robot}} \\geq 1.$。为此，我们提出了一种助推合约（nudge contract），作为一种技术，在触觉互联网背景下通过非惩罚手段影响人类行为以促进技能转移。具体而言，助推合约旨在通过太坊智能合约实现技能转移过程并提供奖励。随后，我们证明了所考虑的助推合约有助于通过失败机器人与熟练人类之间的共享智能成功完成任务。\n\
  \n在第 4 章中，我们涵盖了我们的决策受社会影响以及他人行为和态度影响的一些方式。为此，我们研究了区块链背景下被广泛研究的行为经济学信任游戏。除了设计了一种不需要实验者在玩家中间的去中心化信任游戏外，我们还提出了一种简单高效的基于区块链的存款机制，作为玩家之间的预承诺。“预承诺”（pre-commitment）一词最早由\
  \ 2005 年诺贝尔经济学奖得主托马斯·谢林于 1978 年引入，作为一种名为 `Egonomics` 的自管理系统的一部分。\n\n在第 5 章中，我们解释了\
  \ 6G 与第五代（5G）在几个方面的不同。6G 不仅将探索更多高频段频谱，还将汇聚包括连接机器人和区块链技术在内的驱动性技术趋势。重要的是，我们证明了 6G\
  \ 将比 5G 更以人为中心，而 5G 主要关注行业垂直领域。将人置于未来超级智能社会的中心，是预期研究重点从工业 4.0 转向基于 `CPSS` 的社会 5.0\
  \ 的转变的核心驱动主题；`CPSS` 在社会、认知和物理层面整合人类，并让他们参与具有多种类型元人类能力的物理-信息-社会行为。具体而言，我们关注从传统货币经济向未来非货币经济的范式转变，例如我们所考虑的基于区块链的\
  \ Web3 代币经济及其在近期出现的 `DAO` 中的重要作用。为此，我们展示了用于社会 5.0 的基于 `CPSS` 的代币工程 DAO 框架。考虑到其与去中心化区块链技术的相似性，我们采用了“信息素”（stigmergy）——一种在社会性虫社会中广泛存在的生物自组织机制——通过基于区块链的在线环境中创建的痕迹（反馈回路），促进离线代理之间的间接通信和内部协调。最重要的是，我们研究了由代币化数字孪生媒介的间接通信，以推进未来社会\
  \ 5.0 和基于代币经济的 Web3 中的集体智能；在这种环境中，人类像蜂群大脑中的神经元，而区块链技术充当连接组织，创建被称为代币的可编程激励机制。最后，我们实验性地展示了在涉及众包\
  \ `MTurk` 工人和链上预言机验证的区块链在线环境中，如何通过信息素痕迹增加集体智能（`CI`）和奖励驱动的代币。\n\n## 注释\n\n1. 1. C.\
