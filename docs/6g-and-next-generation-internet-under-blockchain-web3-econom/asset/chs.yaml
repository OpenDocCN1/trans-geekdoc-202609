  \ 亚洲通信与光电大会 (ACP)*, 中国杭州, 2018.\n\n\n\n\n\n我们在第 2 章中已经看到，人们对将区块链适应物联网（IoT）的特定需求表现出日益增长的兴趣，以开发各种区块链物联网（B-IoT）应用，涵盖了从智慧城市、工业\
  \ 4.0 到金融交易和农业等领域。为此，[1] 的作者指出智能合约的重要作用，智能合约被定义为在满足特定条件时自主执行的自给自足去中心化代码段，以太坊是首批使用智能合约的区块链之一。以太坊允许用户在网络之上编写并运行自己的代码。通过更新代码，用户能够修改物联网设备的行为，从而简化维护和错误纠正。除了众知的\
  \ B-IoT 问题（如在资源受限的物联网设备上托管区块链、低交易率和长区块创建时间）外，Fernández-Caramés 和 Fraga-Lamas [1]\
  \ 还识别出了早期 B-IoT 开发和部署之外的若干重大挑战，这些挑战需要进一步的研究。除了技术挑战（例如访问控制和安全性）外，作者得出结论：构建监管环境（例如`去中心化所有权`）是释放\
  \ B-IoT 潜力以供广泛使用的最大问题之一。\n\n最近，在[2]中，网关被用作本地资源受限物联网集群的 B-IoT 服务代理，通过存储它们的区块链账户并代表它们执行智能合约。提出的基于智能合约的框架由多个访问控制合约（ACC）组成。每个\
  \ `ACC` 为每个 B-IoT 资源维护一个误行为列表，包括误行为的细节、时间以及对其主体对象的惩罚（例如在一段时间内阻止访问请求）。此外，除了注册合约外，该框架还涉及所谓的`判决合约\
  \ (JC)`，它实现特定的误行为判定方法。在收到来自 ACCs 的误行为报告后，`JC` 确定对应对象的惩罚，并将决策返回给 ACCs 执行。\n\n尽管最近取得了进展，但使以太坊区别于其他区块链的重要特征仍有待更深入的探索，包括它们与去中心化边缘计算解决方案之外的人工智能和机器人等新兴关键技术的共生。此处特别感兴趣的问题是：如何利用去中心化区块链机制让个人之间出现新的混合协作形式，这种形式在企业而非个人主导的传统市场导向型经济中尚未被考虑[3]。特别感兴趣的是以太坊的去中心化自治组织（DAO）概念。事实上，在关于如何利用我们数字未来的最新著作[4]中，Andrew\
  \ McAfee 和 Erik Brynjolfsson 提到了“DAO 之路”，它可能会用技术赋能的群体取代公司等传统组织。\n\n虽然第五代（5G）网络尚未广泛部署，但早期研究已经开始跨越\
  \ 5G 网络，并预测未来的第六代（6G）愿景可能是什么。与 5G 不同，6G 不仅将在高频段探索更多频谱，还将汇聚驱动性技术趋势。Saad 等人[5] 认为\
  \ 6G 后将有以下三个驱动应用：(*i*)区块链和分布式账本技术，(*ii*)连接机器人和自主系统，以及(*iii*)无线脑机交互（人机交互的一个子类）。在本章中，我们关注触觉互联网（Tactile\
  \ Internet），它应该是今天物联网演变的下一次飞跃。注意，具有底层机器间（M2M）通信的物联网对于实现工业和其他以机器为中心的流程的自动化有用。它设计用于在不依赖任何人类参与的情况下实现机器通信。相反，触觉互联网将通过其内在的人在环（HITL）本质为人机（H2M）交互增加一个新维度，从而允许采用以人为中心的设计方法来创造新的沉浸式体验，并通过互联网扩展人类的能力，即对人类的增强而非自动化[6]。本章旨在解决上述的开放研究挑战。\n\
  \nMaier 和 Ebrahimzadeh [6] 涵盖了触觉互联网的各个重要方面（即触觉流量表征和边缘智能），但对区块链的未来工作仅进行了简要概述。在本章中，我们在[6]的发现的基础上，做了以下贡献：(*i*)\
  \ 调查利用移动终端用户设备通过区块链实现去中心化的潜力，(*ii*) 探索如何利用众包来缩短物理任务的完成时间，以及 (*iii*) 将 B-IoT 框架从判决合约扩展到助推合约（nudge\
  \ contract），以便在更广泛的触觉互联网背景下对人类用户进行助推。\n\n本章其余结构如下。“触觉互联网去中心化”章节详述了以太坊特别是 DAO 在帮助触觉互联网去中心化方面的潜在作用。“助推：从判决合约到助推合约”章节中，我们探索了将\
  \ B-IoT 判决合约框架扩展到助推合约的可能性，以便在更广泛的触觉互联网背景下对人类用户进行`助推`。最后，“结论”部分总结全章。\n\n## 去中心化触觉互联网\n\
  \n### FiWi 增强型移动网络：所有权的扩散\n\nMaier 和 Ebrahimzadeh [6] 显示，可以通过以下实现 5G 超可靠低延迟通信（URLLC）要求：增强以覆盖为中心的\
  \ 4G LTE-A 异构网络（HetNets），分别在回传和前端接入了基于低成本、以数据为中心的 EPON 和 WLAN 技术的以容量为中心的 FiWi 接入网络。图\
  \ 3.1 详细说明了此类 FiWi 增强型移动网络的架构。常见的 EPON 光纤回传由多个光网络单元（ONUs）共享，这些单元可以连接到固定用户，也可以与 WLAN\
  \ MPP 或蜂窝基站（BS）接口。产生的 ONU-MPPs/ONU-BSs 中可能配备了 AI 增强型 MEC 服务器（稍后将详细描述）。在用户端侧，我们考虑了以下三类用户：传统的移动终端（MU）以及涉及远程操作的\
  \ HO 和 TOR 对，这些对可以是局部的也可以是非局部的。\n\n![图 3.1 用于沉浸式触觉互联网的带有 AI 增强 MEC 的 FiWi 增强型移动网络架构](img/fig3_1.jpg)\n\
  \n图 3.1 用于沉浸式触觉互联网的带有 AI 增强 MEC 的 FiWi 增强型移动网络架构。\n\n\n\n\n\n本章更有趣点是，Maier 和 Ebrahimzadeh\
  \ \\[6\\] 探索了将人类视为智能机器团队的“成员”，而非继续将其视为传统的“用户”的理念。此外，我们详细阐述了 AI 增强型代理（例如 `MEC` 服务器）在支持人类进行人机之间任务协调方面可能发挥的作用。为了实现先进的人机协作，我们开发了一种计算和物理任务的分布式分配算法，用于流畅地编排混合人机团队（HART）协作活动。具体而言，所有\
  \ HART 成员通过通信建立了一种集体自我意识，目标是基于对可能由用户或网络拥有的机器人共享，使任务完成时间最小化。我们特别对在机器人可能取代其工作的人员之间*分散机器人所有权*的影响感兴趣。我们的研究结果表明，从性能角度（任务完成时间）来看，如果将机器人所有权完全从网络运营商转移到移动用户，性能不会出现下降，尽管将所有权分散到终端用户之间，对于谁能从机器人等新技术中获益产生了巨大影响。当然，这同样适用于区块链技术。回想“引言”章节，去中心化所有权是释放区块链物联网（B-IoT）更广泛用途潜力最大的问题之一。\n\
  \n鉴于 6G 将支持新的服务类型，例如面向计算的通信（CoC） \\[7\\]，其中新的智能设备需要分布式计算，我们正在寻找上述 HART 成员身份与 `DAO`、`AI`\
  \ 和机器人互补优势之间的协同，以通过去中心化触觉互联网来促进本地人机协作集群。为了实现这一目标，更好地理解 AI 的优点和局限性至关重要。斯坦福大学最近启动了*人工智能百年（AI100）*。在首份报告《2030\
  \ 年的人工智能与生活》中，作者将 AI 定义为一组计算技术，其灵感源于人类利用神经系统和身体进行感知、学习、推理和采取的方式。他们还指出，AI 在短期内可能会取代任务而非工作，并强调了人类专业知识*众包*对于解决计算机本身无法良好解决的问题的重要性。随着互联的计算力遍布全球，并在之上构建了实用的平台，大众已成为一种证明可行且宝贵的资源。根据\
  \ McAfee 和 Brynjolfsson \\[4\\]，对于处于现代资本主义核心的公司来说，有很多方法可以挖掘像 `DAO` 这样技术赋能群体中没有证书且缺乏传统经验成员的专业知识。\n\
  \n### AI 增强型 MEC\n\n根据 \\[7\\]]，`6G` 将超越移动互联网，并被要求从核心到终端设备支持无处不在的 AI 服务。在接下来，我们探索了通过部分或完全去中心化\
  \ `MEC` 来利用移动终端用户设备的潜力。回想上文，我们提到了在 FiWi 增强型移动网络的光纤无线接口处使用 AI 增强型 `MEC` 服务器。在我们考虑的场景中，我们假设人类操作员侧的人机界面（`HSI`）配备了所谓的\
  \ AI 驱动型边缘样本预测模块（`ESF`），该模块负责在样本丢失或过度延迟时为人类操作员提供预测样本。这有助于人类操作员对远程环境有透明的感知。在 B-IoT\
  \ 场景下，这些 `MEC` 服务器被用作网关，需要作为 B-IoT 服务代理，通过将区块链交易卸载到更强大的边缘计算资源，将资源受限的 IoT 设备从计算密集型任务中释放出来，正如“引言”章节中讨论的。这种设计限制在触觉互联网中可以放，因为用户设备（例如先进的智能手机或上述用户拥有的机器人）的计算资源比\
  \ IoT 设备更丰富，因此可以被用于去中心化。\n\n在我们的模拟中，我们将 FiWi 网络参数设置如下：分布式协调函数帧间（`DIFS`） = `34 µsec`、短帧间（`SIFS`）\
  \ = `16 µsec`、物理层（`PHY`）头部 = `20 µsec`、`W0` = `16 µsec`、`H` = `6`、`E` = `9 µsec`、发送请求（`RTS`）\
  \ = `20 bytes`、允许发送（`CTS`） = `14 bytes`、确认（`ACK`） = `14 bytes`。\n\n\n\n\n\n注意，在图\
  \ 3.2 中，平均任务完成时间处于秒级，范围从 2.5 秒到 25 秒，取决于计算卸载概率。因此，考虑到以坊每秒 20 笔交易的限制，区块链技术众所周知的低交易率对于计算任务的执行，特别是对于触觉互联网（Tactile\
  \ Internet）背景下机器人执行的物理任务，并不构成重大挑战，因为预期的由机器人本地 CPU 执行的矿矿过程将卸载到附近的 MEC 服务器，以缩短任务完成和交易确认时间。\n\
  \n## 众包服务\n\nMaier 和 Ebrahimzadeh \\[6\\] 基于用户和网络所有机器人的共享使用，开发了一种用于以 HART 为中心的任务协调的物理任务自感知任务分配算法。通过将我们的\
  \ AI 增强型 MEC 服务器作为自主智能体，我们证明了来自远程操作端（TORs）的延迟力反馈样本可以在本地生成并交付给邻近的主控端（HO）。具体而言，我们开发了一种基于人工神经网络（ANN）的延迟（或丢失）力反馈样本预测方案。通过将预测样本交付给\
  \ HO 而不是等待延迟样本，我们证明了 AI 增强型 MEC 服务器使 HO 能够以 1 毫秒的粒度感知远程物理任务环境，从而实现更紧密的协同和更高的安全控制。但注意，基于样本预测的遥操作系统的性能很大程度上取决于预测算法的准确性。\n\
  \n在下文中，我们探索在 TOR 的力反馈样本预测不可靠的情况下，众包如何帮助减少物理任务的完成时间。为了在去中心化的触觉互联网中实现 DAO，可以使用以坊来建立用于远程物理任务执行的\
  \ HO-TOR 会话，其中智能合约帮助建立/维护信任的 HART 成员关系，并允许每个 HART 成员对所有参与的 HO、TOR 和作为自主智能体的 MEC\
  \ 服务器拥有全局认知。我们假设 HO 远程执行给定的物理任务，直到最近收到的 `X%` 触觉反馈样本中出现预测错误的样本。此时，HO 立即停止遥操作并通知智能体。智能体将该中断的任务分配给\
  \ TOR 附近的人类（例如空闲的 HO），然后由该人类移动到任务点并完成物理任务。对于给定的 ESF 实现，预测错误的概率可以通过计算被预测错误的样本数与预测正确样本数之值的长期平均值来量化。图\
  \ 3.3 展示了对于不同的人类人类穿越时间 `T[traverse]` 以及不同人类与机器人操作能力比例 $\\frac{\\\\, f\\_{human}}{f\\\
  _{robot}}$，平均任务完成时间随样本预测错误概率的变化，其中 `f[human]` 和 `f[robot]` 分别代表人类和机器人每秒能够执行的操作次数。我们可以从图\
  \ 3.3 中得出几点观察结果。显然，选择穿越时间较短且恰好更靠近被中断 TOR 的人类是有益的。我们还观察到比例 $\\frac{\\\\, f\\_{human}}{f\\\
  _{robot}}$ 对平均任务完成时间有显著影响。显然，对于小于 1（即 1/3）的比例，人类的帮助用处较小，因为他/她完成物理任务需要更多时间。相反，当比例等于\
  \ 1（即 3/3）特别是大于 1（即 5/3）时，众包通过利用人类卓越的操作能力发挥了作用。人类或机器人更适合执行某项物理任务无疑取决于其性质。然而，对于给定的物理任务，从\
  \ DAO 中即使是不经过认证且缺乏经验的众包成员那里获得帮助的一种有趣方法可能是通过*助推*（nudging）来增强人类的能力，如文所示。\n\n![图 3.3\
  \ 对于不同的人类人类穿越时间 ttraverse ∈ {2, 5} 秒以及不同人类与机器人操作能力比例 \\frac{\\\\, f\\_{human}}{f\\\
  _{robot}}$，平均物理任务完成时间（秒）随样本预测错误概率的变化图（当 X = 80% 固定）。](img/fig3_3.jpg)\n\nFIGURE\
  \ 3.3 对于不同的人类人类穿越时间 ttraverse ∈ {2, 5} 秒以及不同人类与机器人操作能力比例 $\\frac{\\\\, f\\_{human}}{f\\\
  _{robot}}$，平均物理任务完成时间（秒）随样本预测错误概率的变化图（当 X = 80% 固定）。\n\n## 助推：从裁判合约到助推合约\n\n###\
  \ 认知辅助：从 AI 到智能增强 (IA)\n\n> 一种广泛研究的增加众包有用性的方法是边缘计算，它可以通过为人类提供*认知辅助*来引导他们一步步完成任务。在技术上，这可以通过为人类配备增强现实（AR）头戴设备（例如带有\
  \ WiFi 连接的 HoloLens 2）轻松实现，该设备从最近的 AI 增强 MEC 服务器实时接收工作信息。Maier 和 Ebrahimzadeh \\\
  [6\\] 阐述了利用信息技术增强人类决策，从 AI 转向智能增强（IA）的重要性。但注意，在不确定性增加的动态任务环境和复杂的现实情况下，IA 变得困难。\n\
  \n### 人机协作增强智能\n\n人类面临许多问题往往具有高不确定性、复杂且开放。为了解决这些问题，必须引入人类交互和参与，从而产生了先进人机协作的*人机协作增强智能*概念。这种增强智能被定义为一种需要人类交互的智能模型，允许处理难以通过机器学习进行训练或分类的问题和需求。通常，机器学习在理解非结构化现实环境以及处理不完整信息和复杂的时空相关任务方面逊于人脑。因此，机器无法独立完成人类社会中的所有任务。相反，AI\
  \ 和人类智能被认为是高度互的。\n\n互联网为人机协作增强智能提供了巨大的创新空间。具体而言，云机器人 AR 是增强多机器人协作系统中个体智能增长快的商业应用之一。人机协作增强智能的主要研究课题之一是开发相关方法，使机器不仅从海量训练样本中学习，还能从人类知识中学习，通过不同机器人和人类之间的共享智能来完成高度智能的任务。\n\
  \n### 去中心化自组织协作 (DSOC)\n\n\n\n\n一个催使人类和机器智能跨越互联网迈向一种新型自组织通用人工智能（AGI）形式的极非常有趣的例子，就是所谓的\
  \ `SingularityNET`（[`singularitynet.io`](https://singularitynet.io)）。可以将 SingularityNet\
  \ 视为一个`去中心化自组织合作体 (DSOC)`，该概念类似于 `DAO`。`DSOC` 本质上是一种用于创建新类型智能合约的分布式计算架构。执行这些智能合约的实体被称为代理（agents），它们可以在云端、手机、机器人或其他嵌入式设备上运行。服务通过智能合约启用的\
  \ `APIs` 向任何客户提供，并可能需要多个代理利用其集体智能采取组合动作。通常，可能有多个代理能够以不同的方式和不同程度完成给定的任务请求。发送到网络的每个任务请求都需要代理的独特组合，从而形成了一个相互依赖的“提议网络”，其中代理之间通过“提议-请求对”相互提供提议以交换服务。每当有人想要代理执行服务时，就会为该特定任务签署一份智能合约。为此，`DSOC`\
  \ 旨在通过卓越的发现机制寻找有用的代理，并“引导”（nudging）它们成为贡献者，从而利用尽可能广泛代理的贡献。\n\n### 助推合约：通过智能合约进行引导\n\
  \n在 `DSOC` 和“引言”部分引入的裁判合约的基础上，我们开发了一种`助推合约`，以增强 `DAO` 中无技能群体成员的人类能力。根据 2017 年诺贝尔经济学奖得主\
  \ Richard H. Thaler 的说法，助推（nudge）定义为选择架构的任何方面，它能以可预测的方式改变人们的行为，而又不禁止任何选项或显著改变他们的经济激励。如果部署当，助推可以引导人——而不是像传统的触觉互联网中那样引导物理或虚拟对象——来使他们做出更好的选择，并对各种类型的人群产生积极影响。\n\
  \n### 结果\n\n我们的助推合约旨在通过向熟练的 `DAO` 成员学习完成中断的物理任务，目标是最小化学习损失（学习损失指的是可执行任务时间与最优执行时间之间的差异）。给定助推合约启用并与每种传输技能相关的奖励，远程熟练的\
  \ `DAO` 成员向无技能的人类/机器人提交学习指令的哈希地址。该哈希地址存储在区块链上，相应的学习指令数据可能存储在远程去中心化存储服务器上，例如星际文件系统（`IPFS`）。\n\
  \n![images/fig3_4.jpg)\n\n图 3.4 学习损失（秒）对比子任务数量 `n[sub]` 和遍历时间 `ttraverse` 的子任务学习概率。\n\
  \n# 结论\n\n在本章中，我们探索了如何利用以太坊区块链技术，特别是 `DAO` 来触觉互联网的去中心化，这使得感知实时远程引导物理或虚拟对象/过程提供了前所未有的移动应用，并代表了未来技术社会系统的一个良好示例。我们证明，通过将计算卸载概率设置为\
  \ `0.7`，AI 增强型 `MEC` 的更高去中心化可以将平均计算任务完成时间缩短高达 89.5%。此外，我们观察到，对于中高反馈预测误差概率，只要人类提供等同甚至更优的操作能力（即\
  \ $\\frac{f_{human}}{f_{robot}} \\geq 1$），众包人类协助有助于减少物理任务的平均完成时间。为此，我们提出的助推合约试图通过故障机器人与熟练人类之间的共享智能来成功完成任务。一个值得探索的研究方向是不仅将计算任务卸载到\
  \ `MEC` 服务器上，还卸载到利用率不足的邻近终端用户，这种方法被称为移动自接云（mobile ad hoc cloud）。\n\n## 注释\n\n1.\
