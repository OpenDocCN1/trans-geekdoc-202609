  \n\n\n\n\n\n\n\n# 16G-区块链愿景与研究方向\n\nDOI: [10.1201/9781003427322-1](https://doi.org/10.1201/9781003427322-1)\n\
  \n## 背景与动机\n\n### 移动网络与互联网的演进\n\n全球移动网络标准的通用演进首先是在第一、二代中最大化覆盖范围，然后在第三、四代中最大化容量。除了更高的容量外，第五代（5G）移动网络的研究还关注更低的端到端延迟、更高的频谱效率和能效，以及更多的连接节点\
  \ [1]。具体而言，第一代（1G）移动网络设计用于语音服务，速率高达 2.4 kbit/s，使用模拟信号传输信息，且没有通用的无线标准。相反，第二代（2G）基于数字调制技术，提供的数据速率高达\
  \ 384 kbit/s，不仅支持语音服务，还支持短信服务（`SMS`）等数据服务。主导的 2G 标准是全球移动通信系统（`GSM`）。第三代（3G）移动网络提供了至少\
  \ 2 Mbit/s 的数据速率，并实现了高级服务，包括网页浏览、电视流媒体和视频服务。为了实现全球漫游，成立了 `3GPP` 来定义技术规范和移动标准。第四代（4G）移动网络于\
  \ 21 世纪 00 年代后期引入。4G 是一个完全基于互联网协议（`IP`）的网络，能够提供下行高达 1 Gbit/s、上行高达 500 Mbit/s 的高速数据速率，支持数字视频广播（`DVB`）、高清电视内容和视频聊天等高级应用。LTE\
  \ 进阶版（`LTE-A`）是主导的 4G 标准，它集成了协调多点（`CoMP`）收发、多输入多输出（`MIMO`）和正交频分复用（`OFDM`）等技术 [2]。5G\
  \ 的主要目标首次不仅使用微波频段，还使用了毫米波（`mm-wave`）频段，以显著将数据速率提升至 10 Gbit/s [3]。5G 的另一个特征是更高效的频谱利用，通过增加每赫兹比特数来衡量\
  \ [4]。`ITU`的国际移动电信 2020（`IMT 2020`）标准提出了以下三大主要的 5G 用用场景：\n\n1. 增强移动宽带（`Embb`）\n\
  2. 超可靠低延通信（`URLLC`）\n3. 大规模机器类通信（`mMTC`） [5]\n\n有趣的 5G 低延迟应用之一是新兴的触觉互联网（Tactile\
  \ Internet），它设想实现`触觉通信`，从而使用户不仅能看到、听到，还能感知。触觉互联网由计算机化、自动化和机器人化的最新驱动，预计将显著增强人机交互，将今天的内容交付网络转换为技能交付网络，通过互联网操控物理物体\
  \ 6]。触觉互联网有望创造新的创业机会和工作，对我们生活的几乎每个领域产生深远影响，涵盖从增强/虚拟现实（`AR/VR`）、自动驾驶到医疗保健的智能电网。许多垂直领域（例如`AR/VR`、远程诊断、远程手术和临场感）需要极低延迟和极高可靠性\
  \ 10]。然而，某些并不一定需要移动性的用例可以通过固定网络实现。这表明未来的蜂窝网络需要完全融合，允许灵活选择不同的固定和移动接入技术并共享核心网络功能 [11]。交互系统（特别是`AR/VR`和远程操作）需要\
  \ 1-10 毫秒的极低往返延迟以及高可靠性。触觉互联网的高可用性和安全性、极快速响应时间和运营商级可靠性为人类与机器的交互增加了新维度。为了更深入地理解触觉互联网，将其与新兴的物联网（`IoT`）和\
  \ 5G 移动网络进行比较可能会有所帮助。虽然`IoT`的概念并不新鲜并追溯到 1995 年，但直到最近，工业界和学术界对`IoT`的兴趣才开始快速增长。图 1.1](#chapter01.xhtml#f1_1）展示了符合`ITU-T`标准的触觉互联网的革命性跨越！\n\
  \n![图 1.1 符合 ITU-T 技术报告的触觉互联网革命性跨越](img/fig1_1.jpg)\n\n图 1.1 符合`ITU-T`技术报告的触觉互联网革命性跨越。\n\
  \n触觉互联网与`IoT`之间的区别可以通过底层通信范式和赋能终端设备来表达。触觉互联网涉及人机交互中固有的人类回路（`HITL`）本质，而`IoT`则围绕自主机器间（`M2M`）通信中心，与人类没有交互。触觉互联网依赖人机/机器人（`H2M/R`）交互，因此允许以人为中心的设计方法来创造新的沉浸式体验，通过互联网扩展人类的能力。此外，触觉互联网可以被视为沉浸式`VR`从虚拟环境到物理环境的延伸。它允许对不仅是虚拟物体也是真实的物体（例如遥操作机器人）进行触觉引导和控制。虚拟（即在线）世界与物理（即离线）世界之间的边界变得越来越难以察觉，同时人类的数字和物理能力通过边缘计算变体得到扩展，理想情况下是嵌入了人工智能（`AI`）的能力。\n\
  \n\n\n\n\n最近，Maier 等人 [13]]引入了*无物物联网*（Internet of No Things），作为迈向后智能手机时代（6G 时代）的重要阶梯，在那个时代，智能手机可能不再被需要。我们认为，虽然\
  \ 5G 应该是关于万物互联（Internet of Everything），但为了实现变革，6G 可能只是“万物”的反面，即“无物”（Nothing），或者从技术角度来说，是“无物体”（No\
  \ Things）。无物物联网在不拥有或携带任何类型的计算或存储设备的情况下提供各种人类意图的服务。它设想让网络服务在需要时从周围环境中出现，在不需要时消失。从当前基于设备的互联网到无物物联网的过渡分为三个阶段：(*i*)可携戴设备（bearables，例如智能手机），(*ii*)可穿戴设备（wearables，例如\
  \ Google 和 Levi's 的智能夹克），最后是*(iii)*近场设备*（nearables）。近场设备指的是附近的计算/存储技术和服务提供机制，这些机制足够智能，能够根据用户的上下文和历史进行学习和反应，以提供用户意图的服务。\n\
  \nJoseph A. Paradiso [14]] 在 MIT 媒体实验室概述了他在物联网背景下关于超感知（ESP）的开创性工作。作者表明，在传感器驱动的世界里，嵌入任何事物中的网络连接传感器作为人类神经系统的延伸，使我们能够进入\
  \ Mark Weiser 在一个世纪多年前就预言的泛在计算时代。在《21 世纪的计算机》中，Mark Weiser 认为最深刻的技术是那些会消失的技术。它们将自己织入日常生活的结构中，直到与生活无不可分\
  \ [15]。这现在被广称为泛在计算，尽管 Mark Weiser 最初称其为*具身虚拟*（embodied virtuality）。\n\n图 1.2 描绘了我们提出的超感知网络（ESPN）的架构，该网络整合了移动计算的以下三个进化阶段：(*i*)无处不在、(*ii*)泛在以及(*iii*)说服性计算。无处不在的计算嵌入在我们周围的事物中（即近场设备），而泛在计算涉及我们的可携戴设备和可穿戴设备。说服性计算旨在通过社会影响改变用户的行为。在线虚拟环境中改变行为的一种有趣现象被称为“普罗透斯效应”（Proteus\
  \ effect），个体的行为是由其虚拟化身的特征和特质塑造的，特别是通过化身间事件期间的交互。底层的物理网络基础设施如图 1.2 所示，它由 WLAN Mesh\
  \ 网关接入点（MPPs）和蜂窝基站（BSs）共享的光纤骨干组成，这些基站与光网络单元（ONUs）同位置部署，而 ONU 又连接到光纤骨干的中央光线路终端（OLT）。基于真实的触觉轨迹，我们研究了人类操作员（HO）与远程操作机器人（TOR）之间的非本地远程操作用例，它们都是物理（即离线）实体（图\
  \ 1.2 ）。此外，Maier 和 Ebrahimzadeh [[16] 表明，AI 增强的 MEC 通过预测延迟或丢失的触觉反馈样本，有助于将触觉反馈与大规模传播延迟的影响解耦。这使得人类能够以\
  \ 1 ms 的粒度实时感知远程任务环境。\n\n![FIGURE 1.2 超感知网络 (ESPN) 架构，整合了移动计算的三个进化阶段：(i)无处不在，(ii)泛在以及(iii)说服性计算。](img/fig1_2.jpg)\n\
  \nFIGURE 1.2 超感知网络 (ESPN) 架构，整合了移动计算的三个进化阶段：(*i*)无处不在、(*ii*)泛在以及(*iii*)说服性计算。\n\n\
  ## 6G 愿景\n\n当 5G 进入商业部署阶段时，研究已开始关注预计在 2030 年部署的 6G 网络 [17–19]。通常，下一代系统并非凭空出现，而是遵循前几代的工业和技术趋势。与\
  \ 6G 一致的潜在研究方向见 [20]，包括：\n\n-   `6G 将继续向高频移动`：鉴于低频频谱几乎耗尽，目前的趋势是在更高频获取更宽的带宽。\n- \
  \  `大规模 MIMO 将仍然是 6G 的关键技术`：大规模 MIMO 是 5G 的定义技术，使天线数量从 2 增加到 64。由于信道编码和调制器的性能增益已饱和，6G\
  \ 提高频谱效率的希望将留在多天线领域。\n-   `6G 将云服务推向新高度`：随着不断提高的数据速率、短延迟和低传输成本，许多计算和存储功能已从手机移动到云端。因此，手机大部分计算能力专注于呈现渲染，使\
  \ VR、AR 或扩展现实（XR）变得更加震撼且负担得起。许多基于云的 AI 服务可能会更容易、更广泛地流行。除了手机外，廉价的功能终端可能会再次兴起，为更多应用领域提供增长机会。\n\
  -   `无接入传输在 6G 中可能更加突出`：在过去的蜂窝网络代中，传输主要基于强中央控制的接入导向设计。6G 需要更多的无接入协议和方法。非正交多接入（`NOMA`）技术由于其短延迟性能，尽管在\
  \ 5G 时代未能成功，可能会获得另一个流行的机会。\n-   `mMTC 更可能在下一代成功之前先成型`：由于人与通信的市场增长已饱和，mMTC 一直是下一代系统设计的主要方向之一。人们曾\
  \ 5G mMTC 为蜂窝行业带来显著增长。但到为止，这种预期与现实情况不符。因此，目前的趋势表明，mMTC 更可能通过利用在低频运行的旧技术来流行。\n- \
  \  `6G 将传输网络转换为计算网络`：6G 可能的特征之一是传输、计算、AI、机器学习和大数据分析的协调运行，使得 6G 能够自主检测用户的传输意图，并根据用户的意图和愿望提供个性化服务。\n\
  \n\n\n\n\n2019 年 9 月，全球首份 6G 白皮书发布，这是首届 6G 无线峰会的会议成果。该会议于 2019 年 3 月初在芬兰莱维（Levi）举行，来自来自\
  \ 29 个国家的近 300 名参与者，其中包括主要的基础设施制造商、运营商、监管机构以及学术界 [21]。白皮书每年将根据年度 6G 无线峰会的结果进行更新。虽然\
  \ 5G 的发展主要是为了应对消费者预期的容量增长需求，并实现物联网（IoT）日益增长的重要性，但 6G 需要一种更整体性的方法，涵盖更广泛的群体。此外，6G\
  \ 将比 5G 更以人为本，后者主要侧重于工业垂直领域。将人置于未来超智能社会的中心，也是近期新兴的“社会 5.0”概念的核心所在 [22]。\n\n用于 5G\
  \ 的许多关键性能指标（KPIs）同样适用于 6G。然而，在 5G 之后（B5G）以及 6G 时代，大多数技术领域的 KPI 再次指向 10 到 100 倍的增长，尽管从客户的角度来看，价格降低\
  \ 1000 倍可能是 6G 成功的关键 [23]。注意，降低成本对于为农村和欠发达地区提供连接尤为重要，在这些地区，回传部署的成本是主要的限制。根据 Yaacoub\
  \ 和 Alouini [24]，考虑到全球约一半人口住在农村或欠发达地区，提供农村连接代表了 6G 的一个关键挑战和机遇。在其他重要的 KPI 中，6G 有望成为首个用户峰值吞吐量超过\
  \ 1 Tbit/s 的无线标准。\n\n更有趣的是，6G 设想让如远程临场等作为实际旅行替代品的完全全新的服务，通过图形表示（如化身）、可穿戴显示器、移动机器人和无人机、专用处理器以及下一代无线网络的结合来实现。同样，智能手机可能会通过轻量化眼镜被无处不在的\
  \ XR 体验取代，并通过耳机和触觉界面向其他感官提供反馈。此外，鉴于 2030 年数字世界和物理世界将深度纠缠，6G 需要一个嵌入信任的网络。为此，区块链（也称为分布式账本技术\
  \ DLT）由于其能够在不需要任何中央权威的情况下以分布式方式建立和维护信任，可能会在 6G 网络中发挥重要作用。\n\n### 区块链与分布式账本技术\n\n\
  区块链技术的巨大潜力早已从加密世界扩散到普通大众的手中。我们都曾以各种方式听过，它可能是目前任何已知市场（包括现实世界和数字空间）中最具革命性的技术。区块链技术主要是比特币\
  \ [25] 以及许多其他数不胜完的加密货币背后的支撑 [26]。区块链本质上是一个分布式数据库，记录了参与方之间执行并共享的所有交易或数字事件的记录（或公共账本）\
  \ [27]。公共账本中的每笔交易都通过系统中大多数参与者之间的共识进行验证。一旦输入，信息就永远无法删除。区块链包含了对曾经发生过的每一笔交易的确定且可验证的记录。当区块达到特定大小时，它会被赋予时间戳，并通过加密哈希链接到上一个区块，从而形成带有时间戳的区块链（因此得名为区块链），如图图\
  \ 1.3\n\n图 1.3 区块链交易工作流的图形表示。\n\n区块链技术已成功应用于金融和非金融领域。它有潜力减少我们社会中最重要的经济和监管参与者之一——中间人的角色\
  \ [28, 29]。区块链技术最初与去中心化的加密货币比特币相关，因为它是该网络的主要且首个应用（被称为区块链 1.0 [30]）。然而，除了比特币之外，还有许多其他用例和数百个使用区块链作为平台的不同应用，例如以太坊。\n\
  \n`Ethereum` 是一种运行在区块链技术上的开放软件平台。其核心是所谓的以太坊虚拟机（`EVM`），它能够执行任意算法复杂度的代码 [31]。以太坊平台不仅可以作为加密货币，还可以允许开发者编写智能合约以及存储在区块链上的代码，这些代码在满足预设条件时执行。以太坊智能合约允许终端用户与下一代去中心化应用（DApps）交互。与后端代码运行在中心化服务器上的传统应用程序不同，DApps\
  \ 的服务器-客户端模型是去中心化的。DApps 运行在没有中央权威的区块链网络上，并使用去中心化存储协议。通过使创建应用程序的过程变得简单高效，DApps 可以用于许多其他领域。例如，它们可以实现非金融区块链\
  \ DApps（例如 IoT 设备注册 DApp、基于区块链的数字身份应用）。以太坊和智能合约的兴起标志着区块链 2.0 的到来 [30]。\n\n\n\n\n\
  \n随着区块链技术的炒热不断推进，区块链 3.0 旨在普及基于区块链的解决方案，将其范围从传统领域（金融、商品交易等）扩展到政府、物联网、去中心化 AI、供应链管理、智能能源、健康、数据管理和教育\
  \ \\[32, 33\\]。因此，区块链的应用已演进到更广泛的范围。然而，这些新应用为下一代平台引入了新特性，包括关键方面，如平台互联或更高级的智能合约，后者通过自执行代码在减少官僚主义的同时提供更高水平的透明度。因此，这些新技术在互联网上实现了互不知或不信任的用户之间更加去中心化且自发的协调，这通常被称为去中心化自治组织（DAO）。DAO\
  \ 以开源分布式软件的形式存在，用于执行以太坊项目中构建的智能合约。DAO 类似于去中心化组织，之处是由自主软件代理（即智能合约）而非人类来做出决策。在更加去中心化的设置中，治理规则通过代币化的激励和惩罚自动引导行为\
  \ \\[34\\]。在这种情况下，由特殊智能合约管理的称为代币的可编程资产充当治理规则，在没有中心化中介的情况下激励并引导一个参与者网络 \\[34\\]。此外，DAO\
  \ 发行的代币使其相应的持有者能够对有关组织发展的事务进行投票并做出决策。结果是决策过程是自动化的，参与者之间达成了共识。例如，图 1.4 描绘了区块链技术从区块链\
  \ 1.0 到 3.0 的演变。\n\n![图 1.4 区块链技术的演变。](img/fig1_4.jpg)\n\n图 1.4 区块链技术的演变。\n\n智能合约引入区块链为这种颠覆性技术增加了编程性，并通过移除用于（非）业务目的管理的第三方改变了软件生态系统。尽管充满前景，但智能合约和区块链无法访问网络之外的信息（即链下数据）。区块链实际上是一个封闭系统，其交互仅限于其上的可用数据。因此，这仍然是一个开放的实际问题，被称为“预言机问题”，定义为现实世界的数据如何传输到区块链或从区块链传输\
  \ \\[35\\]。为了这一目标，预言机（也称为数据喂）作为受信任的第三方服务，发送并验证外部信息，并将其提交给智能合约以触发区块链中的状态变化 \\[36\\\
  ]。预言机不仅可以将信息传递给智能合约，还可以将其发送到外部资源。它们仅仅是区块链上的合约，用于为其他合约的数据请求提供服务。没有预言机，智能合约的连接性将非常有限；因此，由于扩大了智能合约的操作范围，它们对区块链生态系统至关重要。\n\
  \n## 高级区块链技术：现有技术与近期进展\n\n在本节中，我们回顾了与高级技术相关的之前的研究，将其分为三个独立的类别后，我们将详细讨论每一个：DAO、区块链预言机和代币工程。\n\
  \n### DAO\n\n过去几年中，DAO 在区块链领域出现，作为互联网的一种新形式。DAO 是一种社会技术系统，通过在区块链上部署的智能合约来实现治理。DAO\
  \ 被定义为具有共同目标的成员集合，通过区块链基础设施进行协调和决策。通常，DAO 的成员注册一个特定的地址，并拥有与该地址相关的治理代币，这些代币是参与决策过程所需的。成员可以是人类或机器。此外，DAO\
  \ 还可以管理资源，例如加密货币。\n\n第一个著名的 DAO 是 `The DAO`，由一组程序员于 2016 年 4 月推出。该 DAO 是一种对冲基金，贡献者可以直接对项目进行投票。2016\
  \ 年 6 月，由于 `The DAO` 代码的错误，攻击者掠夺了其大部分资金 \\[37\\]。去中心化金融（DeFi）的另一个 DAO 示例是：\n\n-\
  \ Aragon 是目前最大的 DAO 平台。它提供了一个创建自己的 DAO 的静态模板，但也允许自定义。模板设置了一个特殊代币，由一个小组做出决策，例如接受新成员。它引入的另一个关键特性是权限，作为安全连接应用和实体（用户或其他应用）的访问控制系统。最初，DAO\
  \ 创建者拥有管理权限，但通常会将这些权限转移给投票应用，从而通过投票进行管理。\n- 与 Aragon 不同，DAOstack 平台不提供许多自定义。除此之外，它们目前为所有的\
  \ DAO 提供单一的决策系统。这种投票系统被称为“全息共识”（holographic consensus） \\[38]旨在解决 DAO 的扩展问题。在全息共识中，如果满足某些条件，批准提案所需的多数可以从绝对多数减少为相对多数。最重要的涉及到预测者或质押者，他们不一定是任何\
  \ DAO 的成员。这些预测者可以质押名为 `GEN` 的特殊代币来预测提案的结果。如果预测者正确，将获得奖励；如果失败，则失去质押。对于提案，如果质押金额达到特定限制，该提案的多数将变为相对多数。结果是质押者帮助\
  \ DAO 突出有意义的提案并在服务有用时获利。在实践中，这种行为模拟了预测市场。\n- Colony 是最新发布的 DAO 平台，能够创建 DAO（他们称之为殖民地）。Colony\
  \ 的 DAO 由具有共同目标和资源的人共享，尽管这些 DAO 可以分为具有更特定目的的领域甚至子领域。\n\n### 区块链预言机\n\n区块链预言机可以根据不同的属性进行分类：（*i*）*来源*，即数据的起源；（ii*）*信息方向*，即从区块链的角度来看是入站还是出站；（iii*）*数据流的发起者*，无论是推模式还是拉取通信；（iv）信任，即中心化或去中心化；以及（v）设计模式。\n\
  \n\n\n\n\n预言机数据源涵盖：(*i*) `软件预言机`，数据来自在线源（例如，在线网络服务器或数据库）；(*ii*) `硬件预言机`，数据来自物理世界（例如，IoT\
  \ 设备、机器人）；以及(*iii*) `人类预言机`，即由一个在特定领域具有专业知识/技能的个人充当预言机角色。他们可以研究并验证来自各种来源的信息的真实性，并将这些信息翻译成智能合约。由于人类预言机可以使用密码学验证其身份，欺诈者伪造身份并提供损坏数据的概率非常低。\n\
  \n信息方向意味着信息流向的方式，即相对于数据流发起者，信息是从外部资源流入还是指向外部资源。为此，这些选项有四种组合：(*i*) `基于拉取的入站预言机 (pull-based\
  \ inbound oracle)`，当链上组件向链外组件请求链外状态时；(*ii*) `基于拉取的出站预言机 (pull-based outbound oracle)`，当链外组件从链上组件获取链上状态时；(*iii*)\
  \ `基于推送的入站预言机 (push-based inbound oracle)`，当链外组件将链外状态发送到链上组件时；(*iv*) `基于推送的出站预言机\
  \ (push-based outbound oracle)`，当链上组件将链外状态发送到链外组件时。\n\n此外，存在信任的概念，它可以是中心化的或去中心化的。`中心化预言机`效率很高，但它们存在风险，因为由单一实体提供信息并控制预言机，一旦故障，会导致合约对漏洞和攻击的韧性降低。相比之下，`去中心化预言机`（即基于共识的预言机）通过查询多个资源增加了提供给智能合约信息的可靠性。需要注意的是，如果一个预言机是无许可的，用户可以加入或离开，且每个用户都拥有平等权利，则它被认为是去中心化的\
  \ [41]。最后，预言机设计模式定义为(*i*) `请求-响应 (request-response)`，当数据空间巨大且可以实现为链上智能合约，并通过链上或链外预言机启动以监控、检索和返回数据；(*ii*)\
  \ `发布-订阅 (publish-subscribe)`，当数据预计会变化时，例如实时简单摘要 (RSS) 馈送；以及(*iii*) `立即读取 (immediate\
  \ read)`，当需要立即做出决策时。\n\n存在许多实现入站预言机的商业和开源工具。`Orisi` \n\n`Reality Keys` 提供了自动化和人类驱动的基于拉取的入站预言机的组合\
  \ [42]。`Chainlink`\n\n区块链入站预言机也已经在多项研究工作中被考虑过。Xu 等人引入了`验证预言机 (validation oracles)`\
  \ 的概念，即作为入站预言机的受信第三方操作节点（自动或人工）[44]。作者区分了内部预言机（定期向区块链传输经过外部验证的数据）和外部预言机（基于区块链外部信息，作为交易的可信外部验证者进行运行）。根据我们的方案，我们看到前者是基于推送的，而后者是基于拉取的。预言机领域的开创性研究工作之一是\
  \ Adler 等人引入的 `ASTRAEA` 被介绍为一种去中心化的基于拉取的入站预言机服务 [45]。该实现提供了一个投票游戏，用于决定命题的真伪或错误。玩家可以是投票者或认证者。虽然认证者在需要高准确性的情况下发挥作用，但投票者被用于低风险/低回报的角色。Zhang\
  \ 等人提出了 `Town Crier`，这种基于推送的入站预言机像一个数据馈系统，连接了区块链与抓取安全网站的后端[46]。\n\n更有趣的是，Heiss 等人为链上可信数据提供了一系列关键需求，并解释了面临的挑战及其解决方案\
  \ [47]。他们认为，除了分布式系统的特征——安全性和活性之外，真实性也是必要的，因为它可以防止由于虚假数据提供而执行的区块链状态转换。基于这些属性，对每种属性的挑战被定义为可用性、正确性和激励兼容性。激励兼容性包含两个关键特征：(i)\
  \ 可归因性 (attributability)，即将数据映射到源提供者，并根据其行为对数据源进行奖励或惩罚；(ii) 可问责性 (accountability)，定义为在提供数据之前质押保证金，并在提供真实数据后退还。正确性由真实性和完整性组成，前者分别处理对数据源的批准，后者则显示数据在转换过程中不应被篡改。最后，活性\
  \ (liveness) 指可可用性和可访问性，前者意味着系统的可用性应与其不可用的组件一样，即停机时间应保持极低。后者意味着数据在任何时候都是可访问的。\n\n\
  ### 代币工程\n\n代币随着 `Web3` 的引入而出现 [34]。Web1 让所有人分享想法，Web2 允许社区形成并讨论这些想法，而 Web3 则让这些社区利用金融资本，从讨论转向实际行动。从核心上说，代币是分布式账本中的条目，分配给区块链账户，交易需要授权，从而确保真实性并防止未经许可的篡改。代币可以使用扩展或实例化的币模板进行定制设计。代币可以被理解为区块链上的资产，可以通过以太坊地址和特殊的智能合约进行存储或管理。以太坊上存在多种类型的代币，通常用于\
  \ DApp 并遵循现有的标准。最流行的代币标准描述如下：\n\n*   `ERC-20 标准`\n*   `ERC-721 标准`\n*   `ERC-1155\
  \ 标准`\n\n## 从工业 4.0 指向社会 5.0\n\n### 物理信息社会系统 (CPSS)\n\n工业 4.0 下的智能工厂具有许多优势，例如资源的最优，但也意味着制造过程中的人工干预最少。当人类在社会、认知和物理层面功能性地集成到物理信息系统\
  \ (CPS) 中时，它变成了所谓的物理信息社会系统 (CPSS)，其成员可以参与 CPS 行为，最终实现具有各种超能力的元人类。\n\n\n\n\n\n最近，在\
  \ 2021 年 1 月，欧盟委员会发布了关于工业 5.0 的政策简报第一版\\[48]。工业 5.0 将由一种重新发现并扩展的目的性来定义，它超越了单纯为了利润而生产商品和服务的理念。纯粹利润驱动的方法已变得越来越不可持续。在全球化的世界中，对利润的狭隘关注无法正确考虑到环境和社会成本与效益。此外，新冠\
  \ 19 疫情等危机凸显了我们目前全球化生产模式的脆弱性，特别是在价值链服务于人类基本需求（例如医疗保健）时。这种更广泛的目的包含三个核心元素：(i) 以人为本，(ii)\
  \ 可持续性以及(iii) 韧性。\n\n工业 5.0 的特征中最重要的范式转型之一是将关注点从技术驱动的进步转向彻底的以人为中心的方法。工业 5.0 的一个重要前提是技术服务于人，而不是反之，即通过`VR/AR`工具、移动机器人和外骨骼等创新技术手段来扩展工人的能力（技能提升和和再培训）。\n\
  \n目前，工业 5.0 出现了两种愿景。第一种是人机协作，人类专注于需要创造力的任务，而机器人负责其余工作。工业 5.0 的第二种愿景是生物经济，即一种针对工业过程对生物资源进行智能利用的整体方法\\\
  [50]。生物经济已在全球范围内成为实现可持续经济的主流柱。它的成功基于我们对生物过程和原理的理解，这有助于彻底改变我们由化石资源主导的经济，并建立一个合适的框架，使经济、生态和社会被视为必要的单一整体，而非竞争对手。更具体地说，生物化将成为生物经济的指导原则。生物化利用自然的效率来实现经济目的——无论是植物、动物、残渣还是自然有机生物。几乎每个学科都与生物学有着广阔的交界面。长期来看，生物化将像今天的数字化一样，作为一种跨学科方法具有同样的意义。生物化将像数字化触发工业\
  \ 4.0 一样，为工业 5.0 铺平道路。显而易见，生物化和数字化这两个趋势将是互利共利的[51]。\n\n有趣的是，在\\[48]]中，作者还详述了工业 5.0\
  \ 与社会 5.0 概念之间的关系。虽然这两个概念之所以关联，是因为它们都提到了我们社会和经济向新范式的根本性转变，但社会 5.0 并不局限于制造业，而是基于物理空间和虚拟空间的整合来应对更大的社会挑战。在随后的章节中，我们将进一步阐述社会\
  \ 5.0 的愿景，并展示一个生物化的说明性用用例。\n\n## 社会 5.0\n\n工业革命将农业人口从 90%以上减少到 5%以下。同样地，IT 革命将制造业人口从\
  \ 70%以上减少到约 15%。`6G`时代的智能革命将整个服务业人口减少到 10%以下。对于人们将去向何处以及将做什么的问题，\\[52]]的作者给出了如下答案：游戏！不是休闲，而是网络空间中的科学游戏。人工社会、计算实验和并行执行——所谓的`ACP`方法——可能形成科学基础，而`CPSS`平台可能是智能产业兴生的赋能基础设施。在`ACP`方法中，智能产业将构建各种人工社会、组织和系统，以执行不同类型的计算实验，并进行大量的科学游戏，以分析、评估和优化决策过程，以及通过真实与虚拟双重实体的并行执行和交互，以最短的时间、最低的能量和成本完成任务所需的技能和资源，这些实体我们可以我们可以一起玩游戏、工作和生活的。一切万物在网络空间中将有其平行的化身或数字孪生，以便我们可以在任何重大决策或操作之前进行大量的科学游戏。这种全新的、未知的由`CPSS`支持的连接生活方式和工作环境最终将导致高满意度，以及能力和效率的提升。此外，\\\
  [52]]的作者预见，基于休格·埃弗里特量子物理学多世界解释（`MWI`）的多重宇宙或平行宇宙，将在复杂空间基础设施时代随着智能产业的出现而成为现实，这需要一种新的职业——科学游戏工程师。然而，他警告说，`CPSS`通过网络空间的众包从群众中收集巨大能量并将其释放到物理空间的能力可能会带来有利和不利的后果。因此，关键的研究挑战之一是基于`CPSS`的以人为中心的复杂空间构建。\n\
  \n与工业 4.0/5.0 类似，社会 5.0 通过充分利用`ICT`并将物理空间与网络空间融合，不仅应用了社会机器人和实体人工智能，还应用了环境智能、`VR/AR`和先进的人机界面（`HCIs`）等新兴技术。然而，社会\
  \ 5.0 平衡了工业 4.0 对商业的强调。如果说工业 4.0 范式被理解为专注于创建智能工厂，那么社会 5.0 旨在创建世界上第一个超级智能社会。更有的是，根据日立大学\\\
  [22]]，社会 5.0 还预见了从传统货币向未来非货币经济的范式转变，这种转变基于能够衡量那些没有货币价值的、人类共同成长活动的技术。\n\n\n\n\n与工业\
  \ 4.0 类似，社会 5.0 旨在通过社会机器人、环境智能、先进的人机交互（HCI）、具身智能以及包括 VR/AR 在内的各种扩展现实，结合上述 CPSS，实现数字世界与物理世界的无缝融合。社会\
  \ 5.0 有两个愿景。第一个是人机协作。在这种愿景中，机器人（包括社会机器人）与人类将在尽可能的任何时间和共同工作。人类专注于需要创造力的任务，而机器人负责其余工作，从而产生了上述\
  \ `DAO` 的概念。`DAO` 是以太坊区块链的一个独特特性，高度依赖众包人类技能来解决机器人和自主 AI 代理单独单独解决的问题。社会 5.0 的第二个愿景是仿生学，研究为了工业目的智能利用生物资源，以帮助实现社会、经济和生态之间的平衡。\n\
  \n## 目的与大纲\n\n本书的剩余结构如下。\n\n第 2 章 研究了区块链技术在开发新型分布式所有权模型（如触觉互联网）方面的能力。在本章中，我们还讨论了比特币和以太坊区块链之间的相似之处和不同之处。比较表明，以太坊是作为区块链平台的更好选择。我们还认为以太坊优于其他区块链是因为它具有许多显著特征，包括\
  \ `DAO` 及其与 AI 和机器人的协作工作，而且它与去中心化边缘计算解决方案高度兼容。在我们的研究中，我们展示了 `DAO` 产生了一种新的混合协作形式，其中智能和自动化处于中心，而人类在边缘运行。最后，我们通过概述开放的研究挑战和未来的工作对本章进行总结。\n\
  \n第 3 章 详细阐述了 `DAO` 在帮助触觉互联网作为未来 6G 应用实现去中心化方面的潜力，并将其去中心化与 AI 增强的多接入边缘计算（`MEC`）相结合。多接入边缘计算（`MEC`）展示的结果表明，更高程度的去中心化会缩短计算任务的完成时间。此外，我们将现有的\
  \ `BIoT` 框架中的 `judge contract`（该合约控制 IoT 设备的行为并通过阻塞网络访问对其进行惩罚）扩展到了更广泛的触觉互联网语境。开发的\
  \ `nudge contract`（助推合约）旨在通过向 `DAO` 的远程技能人类成员学习来完成中断的物理任务，同时最小化学习损失。我们的 `nudge contract`\
  \ 通过适宜的奖励机制（而不是惩罚）改变人类行为，以促进信任的技能转移。\n\n第 4 章 研究了区块链背景下行为经济学中广泛研究的信任游戏，特别关注开发高效协作和协调技术的重要性。在识别出区块链实现信任游戏的开放研究挑战后，我们首先开发了一个\
  \ `smart contract` 来替代位于信任者和受托者中间的实验者，并通过实验证明通过使用押金来增强信任和可信度，可以实现高达 100% 的社会效率。然后，我们为网络化的\
  \ `N` 人信任游戏提供了一种链上区块链预言机架构，其中涉及第三类人类代理——`observers`（观察者），他们跟踪玩家的投资和互惠性。第三方奖励和惩罚决策的存在有助于平均归一化互惠性提高到\
  \ 80% 以上，即使不需要任何押金。此外，我们关注 6G 时代新兴的机器人经济学（robonomics）领域，该领域研究区块链技术对社会人机交互的社会技术影响，以及为了让机器人融入人类社会的行为经济学。最后，我们通过实验证明了用于社会机器人的混合逻辑-情感说服策略显著提高了受托者的可信态和互惠性。\n\
  \n第 5 章 探索了未来的 6G 移动网络及其向更以人为中心的预期转变，从而实现所谓的社会 5.0 愿景。此外，我们在最近关于 6G 时代机器人经济学的工作的基础上进行了扩展。如上所述，机器人经济学研究人机交互及其社会技术影响，以及区块链技术和加密货币——不仅是硬币，更有趣的是代币（tokens）。具体而言，我们研究了创建物理和数字世界资产及访问权的代币化数字孪生的过程，密切关注其在未来\
  \ Web3 及其底层代币经济（今日信息经济和平台经济的继任者）中的核心作用。在介绍了我们用于社会 5.0 的基于 `CPSS` 自底向上多层代币工程框架后，我们实验性证明了如何通过目标驱动的代币来增强基于区块链的\
  \ `DAO` 的集体人类智能。\n\n最后，第 6 章](#conc.xhtml) 通过总结本书的主要发现来结束全书。\n\n## 注释\n\n1. 国际 电信联盟—电信标准部门\
