  \ Automation Letters, vol. 3, no. 3, pp. 1639–1646, July 2018.\n\n\n\n\n\n区块链外部数据源意味着链上数据存在不可靠、被恶意修改或虚假报告的风险。通常，会使用各种博弈论机制来激励数据的真实性提供。然而，根据\
  \ Heiss 等人 \\[3\\]的观点，这些方法仅解决了确保数据上链系统`trustworthiness`（信任性）这一更大挑战的部分方面。可信数据上链系统的一个关键属性是真实性（truthfulness），这意味着区块链状态转换的执行不会由虚假数据提供引起，相反，数据总是以善意的方式提供。真实性引发的挑战是构建激励兼容的系统，在这些系统中，参与者被假设为受自身利益驱动的理性`homini\
  \ oeconomici`（经济人），其首要目标是通过对其行为和行为的金钱奖励和惩罚来实现个人效用最大化。\n\n在本章中，我们关注行为经济学中广泛研究的`信任游戏`（trust\
  \ game）。尽管信任游戏尚未在区块链背景下进行研究，但它允许对信任、信任度以及人类行为者之间的互惠性进行更系统性的研究 \\[4\\]。接下来，我们展示了一种网络化的信任游戏版本，利用社交机器人改变玩家行为的有利特性。为此，我们详细阐述了新兴领域`robonomics`（机器人经济学），该领域研究区块链技术对社会化人机交互的社会技术影响。经典的信任游戏仅涉及两个人类玩家，分别称为信任者（trustor）和受托者（trustee），他们匿名配对，并被赋予一定数量的`X`个货币单位。图\
  \ 4.1 展示了信任者与受托者之间的顺序交换。信任者可以将将其资产的比例 `0 ≤ p ≤ 1` 转移给受托者。然后，实验者将此金额乘以因子 `K > 1`（例如翻倍或增加到三倍）。受托者可以将接收金额的比例\
  \ `0 ≤ q ≤ 1` 直接转回给信任者，而不经过实验者。注意，信任游戏捕捉了两个行为者之间的任何通用经济交换。根据 Alós-Ferrer 和 Farolfi\
  \ \\[5\\]的观点，信任游戏在未来许多年内仍然是研究社会资本与其经济增长关系的重要工具，其中对高效协作与协调技术的研究将特别受到关注。\n\n![图 4.1\
  \ 涉及两个人类玩家（信任者和受托者）和中间一个实验者的经典信任游戏。](img/fig4_1.jpg)\n\nFIGURE 4.1 涉及两个人类玩家（信任者和受托者）和中间一个实验者的经典信任游戏。\n\
  \n本章的其余部分结构如下。在“6G 愿景：区块链与机器人”章节中，我们首先简要回顾未来移动网络的 6G 愿景，随后讨论了区块链在 6G 网络中的挑战和收益，并特别关注区块链预言机（oracles）和说服机器人的预期作用。在“区块链支持的信任游戏”章节中，我们识别了实现区块链支持信任游戏的开放研究挑战，包括其社会效率性能以及合适的奖励和惩罚机制的设计。然后，我们深入探讨了通过应用基础区块链技术并通过实验验证来实现基于智能合约的经典信任游戏去化版本的技术问题。“网络化\
  \ N 人信任游戏的链上预言机”章节探索了先进的区块链技术，特别是链上预言机，以促进网络化`N` 人（即多人）信任游戏中公平的社会效率。在“机器人经济学：使用说服性机器人进行\
  \ N 人信任游戏”章节中，我们利用机器人说服策略的有利特性，将`N` 人信任游戏置于机器人经济学的背景下研究。最后，“结论”章节结束本章。\n\n## 6G\
  \ 愿景：区块链与机器人\n\n### 区块链对 6G 的收益\n区块链用于生成大规模索引作为所有网络通信的安全措施。它作为一种相互、集体且通用的账本。区块链实现了从客户端-服务器到可信点对点网络的转换。根据\
  \ Saad 等人 \\[6\\]的观点，区块链和分布式账本技术（DLT）可以被视为下一代分布式传感服务，其对连接的需求超可靠低延迟通信（URLLC）和海量机器通信（mMTC）的协同结合，以保证低延迟、可靠连接和可扩展性\
  \ \\[7\\]。区块链技术与第六代（6G）通信网络的结合带来了以下收益：\n\n*   **智能资源管理：** 根据 David 和 Berndt \\[8\\\
  ]，网络资源管理和共享在 6G 中起着重要作用。资源管理操作如频谱共享、编排和去中心化计算必须与海量基础设施兼容。为此，预计区块链和智能将在自组织网络资源管理中发挥主要作用。此外，智能合约有助于处理和自动化运营商与终端用户之间的关系。\n\
  *   **安全与隐私特性：** 另一个重要收益是在不损害用户安全和隐私的情况下，复杂的利用所有 6G 网络资源、和服务用户数据 \\[8\\]。在这方面，基于区块链的安全和隐私解决方案（如去中心化身份验证和访问控制、数据所有权、完整性、可追溯性和监控，以及主权身份（SSI）范式）不断出现，为用户提供机制，使其能够在数字交易期间变得匿名、安全并控制自己的个人数据。\n\
  *   **可信的 6G 通信：** 6G 将融合数字世界和物理世界，旨在感知现实世界并整合从自动系统到扩展现实的广泛应用 \\[8\\]。在 6G 网络基础设施中利用区块链的机会增强了新服务的可信度和性能提升。例如，区块链可以实现无需中心化中间的可信收费和计单。此外，由于\
  \ 6G 与 5G 类似构建在虚拟化和切片网络架构之上，区块链有助于建立可信且去中心化的服务水平协议（SLA）管理。然而，这些解决方案仍需大规模实施。因此，6G\
  \ 预计将支持具有多样 SLA 保证的极广泛用例，并需要以可信的方式进行管理。\n\n\n\n\n\nSaad 等人 `[6]` 观察到，正在部署的第五代（5G）蜂窝系统正暴露其与\
  \ 5G 作为万物互联（IoE）赋能者的最初假设相比的内在局限性。他们认为，6G 不仅应该探索高频段的更多频谱，更重要的是要汇聚驱动技术趋势。其中，他们声称 6G\
  \ 后方将有以下三大驱动应用：\n- (*i*) `blockchain`与分布式账本技术，\n- (*ii*) `连接机器人`与`自主系统`，\n- (*iii*)\
  \ `无线脑机交互`（人机交互的一个子类）。\n\n事实上，在 6G 中，存在一种强烈的观点认为移动终端的性质将发生变化，智能移动机器人预计将发挥更重要的作用\
  \ `[7]`。具体来说，David 和 Berndt `[8]` 认为，能够为人类用户提供良好建议的 6G 服务无疑将受到欢迎。根据 6Genesis 旗舰计划（6GFP）于\
  \ 2019 年 9 月发布的全球首份 6G 白皮书，6G 将比主要关注行业垂直领域的 5G 更具有以人为本的特征。\n\n这篇关于 6G 愿景的简要回顾显示，`blockchain`\
  \ 技术和机器人将在未来移动网络中发挥核心作用，这些网络将比前几代蜂窝网络更以人为中心。先进的 `blockchain` 技术（如能够将来自人类用户的区块链外部离链信息上链的预言机）有望利用人类智能，而不仅仅是机器学习。同样，与人类交互的智能移动机器人也展现出广阔前景。\n\
  \n## 区块链驱动的信任游戏\n\n在本节中，我们首先识别开放的研究挑战，然后开发一种基于区块链的经典信任游戏，并实验性地研究其影响。\n\n### 开放的研究挑战\n\
  \n使用 `blockchain` 技术信任游戏应解决以下研究挑战：\n\n- **社会效率**：回想上述，信任游戏允许社会资本增长，为此`社会效率` 起着重要作用。社会效率被定义为考虑到外部性的总收益最优分配。通常情况下，外部性是指影响交易双方之外的第三方的成本或利益。当我们把信任游戏扩展到多玩家游戏时，我们将社会效率衡量为信任者和受托者的总收益之比。如果信任者发送了全部资金\
  \ `X`，则实现了 100% 的社会效率，这等于 `X(K + 1)`。请注意的是，最大化总收益要求在给定的 `K` 值下设置 `p = 1`，尽管 `q`\
  \ 可以设置为任意值。然而，参数 `q` 在控制信任者和受托者之间相等或不等的收益分配方面起着重要作用。相反，如果信任者决定不发送任何内容（即 `p = 0`），由于缺乏信任（信任者侧）或缺乏信誉（受托者侧），双方都只剩下\
  \ `X`，且社会效率为 `0%`。如何以公平的方式在基于区块链的信任游戏中提高社会效率是一项重要的研究挑战。\n\n- **多玩家信任游戏中的信任与信誉**：过去，信任游戏限于两个玩家。Abbas\
  \ 等人 `[9]` 引入了一种新的多玩家信任游戏，将通常建模为双人游戏的信任概念推广到可以同时进行游戏的玩家群体。根据 Abbas 等人 `[9]`，演化博弈论显示，没有诚实者的社会将为整个社会和个人带来最大的财富。然而，当初始群体即使包含极少的不诚实者时，社会也会收敛于零信任。所提的多玩家信任游戏显示，尽管信任者和信誉者的组合是最理性的社会状态。需要注意的是，`[9]`\
  \ 中的多玩家信任游戏是在无结构的环境中进行的，即群体没有任何特定的空间拓扑结构或社交网络。Chica 等人 `[10]` 研究了网络化的多玩家信任游戏是否能比无结构群体产生更高水平的信任和全球财富（即总收益）。为此，玩家被映射到空间网络结构中，这限制了他们与邻域的交互和合作。与\
  \ Abbas 等人 `[9]`（单个不诚实者的存在就会完全消除信任并导致全球财富为零）不同，Chica 等人 `[10]` 发现建立网络结构对于促进信任和全球财富具有性，即使初始群体中存在大量不诚实者，信任也能得到促进。显然，在网络化的多玩家信任游戏中开发适当的网络解决方案以实现不同策略之间的有效合作是一个有趣的挑战。\n\
  \n- **奖励与惩罚机制设计**：为了实现理想的社会目标，机制设计 理论起着重要作用。根据 Maskin `[11]` 的观点，机制设计理论可以被视为经济理论的“工程”侧。经济学家想要解释或预测机制的结果，而机制设计理论反转了研究方向，首先确定社会目标，然后询问是否可以设计相应的机制来实现该目标。如果是肯定的，那么这种机制可能是何种形式，其中机制可以是制度、程序或用于确定理想结果的游戏。\n\
  \n\n\n\n\n机制设计中一个有趣的例子是所谓的*利他性惩罚*（altruistic punishment），它用于确保多人公共物品游戏中的合作 [12]。利他性惩罚意味着个体惩罚他人，尽管惩罚具有成本且没有物质收益。实验表明，对违背者（即不可信的参与者）进行利他性惩罚是合作的关键动力，如果存在利他性惩罚的可能性，合作就会繁荣；如果被排除，合作就会崩溃。设计外部性（如第三方惩罚和替代性奖励机制）对于激励多人公共物品游戏以及特别是\
  \ *N*-人信任游戏中的人类合作具有重要意义。\n\n*   **经济实验的去中心化实现：** 一种广泛用于开发和开展几乎任何类型经济实验（包括上述公共物品游戏和我们考虑的信任游戏）的实验软件是\
  \ `Zurich Toolbox for Ready-made Economics (z-Tree)` [13]。`z-Tree` 软件以客户端-服务器应用的形式实现，其中供实验者的中央服务器应用程序称为\
  \ `z-Tree`，供游戏参与者的远程客户端应用程序称为 `z-Leaf`。它是免费提供的，并允许通过互联网进行经济实验。然而，缺点是 `z-Tree` 不支持玩家之间的点对点（P2P）通信，而非基于区块链的去中心化实现。\n\
  \n### 实验者智能合约\n\n首先，我们开发了一个智能合约来取代信任者和受托者之间中间的实验者（参见图 4.1）。开发过程使用了 Truffle 框架。\n\
  \n具体来说，在我们的实验者合约中，我们使用了以下全局变量：(*i*) `msg.value`，代表发送的交易；(*ii*) `msg.sender`，代表向实验者智能合约发送交易的玩家地址，即信任者或受托者。信任者和受托者都使用他们的以太坊外部持有账户（EOA），通过公钥和私钥来交互并调用我们实验者智能合约的每个函数。以下我们简要概述实验者智能合约的核心函数和参数：\n\
  \n*   **函数 `investFraction()`：** 该函数允许信任者投入其资金 `X` 的部分 `p`。一旦调用，它将获取信任者收到的 `msg.value`\
  \ `p`，利用合约余额将其乘以因子 `K`，并直接传输到受托者的账户。受托者接收 `msg.value` · `K`。\n*   **函数 `splitFraction()`：**\
  \ 该函数允许受托者从信任者的投入中拆分部分 `q`。一旦调用，它从受托者账户提取指定的拆分金额并发送到信任者账户。\n*   **参数 `Onlytrustor`（修饰符类型）：**\
  \ 该修饰应用于 `investFraction()` 函数。因此，只有信任者可以调用实验者智能合约的此函数。\n*   **参数 `Onlytrustee`（修饰符类型）：**\
  \ 该修饰应用于 `splitFraction()` 函数。因此，只有受托者可以调用实验者智能合约的此函数。\n\n我们注意到，在执行实验者智能合约的每个函数后，都会使用事件（event）来创建通知并保存日志。事件有助于追踪并通知双方关于合约的当前状态和活动。\n\
  \n### 区块链机制保证金\n\n使用单向安全押金为一方对另一方提供信任是非常常见的，特别是通过电子商务和众包平台进行商品和服务交换。在区块链语境下，保证金是一种智能合约协议，定义了双方之间的安排，其中一方向第三方质押资产。区块链机制保证金的一个有趣用例可以在\
  \ [14] 中找到。在论文中，作者提出了一种新协议，利用区块链实现了注册的电子递送（e-Deliveries）服务的所有预期属性。在所提的协议中，作者包含了一种保证金机制，旨在鼓励发送者避免不实行为和欺诈尝试，并按照协议阶段预定义的方式完成交换。如果发送者按照协议完成交换，保证金将返回给发送者。在我们的工作中，我们建议在实验者智能合约中添加一个可选函数\
  \ `deposit()`，以增强两个玩家之间的信任和可信度。为此，我们进行了了以下两处修改：\n\n*   **函数 `deposit()`：** 该函数允许受托者提交金额\
  \ `2 ≤ D ≤ X` 的货币单位（在我们考虑的以太坊案例中为 Ether）作为保证金提交到实验者智能合约。只有在完成 `q > 0` 的交易时，保证金才会返回给受托者。否则，当\
  \ `q` = 0 时，受托者将丢失保证金。需要注意的是，上述 `Onlytrustee()` 修饰符也应用于此函数。\n*   **函数 `splitFraction()`：\
  \ 我们对该函数进行了修改，允许受托者拆分收到的金额（即 `q > 0`）。否则，交易将被拒绝，直到受托者拆分收到的金额为止。一旦发生这种情况，函数会将金额传输到信任者账户，并将保证金\
  \ `D` 返回到受托者账户。\n\n### 实验设置\n\n接下来，我们通过基于以太坊的区块链实验，研究保证金作为一种有效的预承诺机制对信任游戏表现（即社会效率和归一化互惠）的影响。我们在实验者智能合约中设置\
  \ `K` = 2，并考虑不同的保证金值 `D` = {0, 2, 5*, X*} Ether，其中 `D` = 0 表示不带任何保证金的经典信任游戏。实验是在两名来自不同大学的学生进行的。选择仅两名学生的理由是首先关注定义上仅涉及两个玩家的传统信任游戏，这让我们能够更确定保证金机制的效果是真实的。此外，通过相同的两名参与学生进行实验，使我们能够更好地观察游戏过程中的行为变化。至于入选标准，我们注意到学生之间彼此不知道对方身份，这对于确保他们之间的匿名性至关重要。此外，这些学生之前没有进行过任何行为研究实验。也没有任何参与者对信任游戏或其他任何投资游戏实验有先验知识或经验。两名参与学生均为男性，年龄分别为\
  \ 23 岁和 25 岁。\n\n\n\n\n在实验开始时，委托者和受托人均获得了 `X` = 10 Ether 的赠金。我们运行了四次实验，每次的 `D` 值均不同。四次实验均持续了五轮。我们注意到，在\
  \ `D` = 10 Ether 的实验中，受托人将其全部赠金 `X` 投入存款，因此 `D` = `X` Ether。所有实验均通过互联网进行。所有参与者使用其\
  \ Ethereum 账户与我们实验者的智能合约进行交互。我们注意到，委托者和受托人都需要支付燃料费（gas fee）。燃料价格是指在以太坊区块链平台上成功执行交易或运行智能合约函数所需的定价值。以加密货币\
  \ Ether 的微小单位定价，通常被称为 `Gwei`。每个 `Gwei` 等于 0.000000001 ETH (10^(−9) Ether)。鉴于其成本最低，我们认为部署智能合约和发送交易相关的交易费用与投入和分配的金额相比是可以忽略不计的。\n\
  \n图 4.2 展示了平均社会效率和归化互惠性（均以百分比表示）相对于存款 `D` = {0, 2, 5*, X*}（以 Ether 为单位）。我们将归化互惠性定义为\
  \ `q/p` 的比例，用以衡量受托人对委托者慷慨 `p` 的互惠性 `q`。注意，归化互惠性对于衡量在给定可行社会效率下，从受托人到委托者以及反之的总收益公平分配非常用。注意，图\
  \ 4.2 还显示了每个 `D` 值下测量得分最小值与最大值之间的区间。\n\n![图 4.2 使用 k = 2 和 x = 10 的实验者智能合约，平均社会效率和归化互惠性\
  \ q/p 与存款 d = {0, 2, 5, x} ether 的关系图（以最小到最大测量得分区间显示）。](img/fig4_2.jpg)\n\n图 4.2\
  \ 使用 `k` = 2 和 `x` = 10 的实验者智能合约，平均社会效率和归化互惠性 `q/p` 与存款 `d` = {0, 2, 5*, x*} ether\
  \ 的关系。\n\n我们从图 4.2 中得出了以下有趣的观察。首先，社会效率随着存款 `D` 的增加而持续增长，直到在 `D` = `X` 时达到 100%的峰值。因此，通过正确应用\
  \ `D` = `X` 的区块链存款机制，可以使经典信任游戏的社会效率表现最大化。这是因为受托人在投入最大存款后，委托者发送了全部赠金（即 `p` = 1）。通过这样做，实现了\
  \ 30 Ether 的最大总收益，转化为 100% 的社会效率。值得提到，这在实验的所有五轮中都是如此。其次，与没有任何存款（`D` = 0）的经典信任游戏相比，随着存款\
  \ `D` 的增加，平均归化互惠性显著提高。\n\n具体而言，在经典信任游戏中，平均归化互惠性低至 18%。相比之下，对于仅为 `D` = 2 Ether 的存款，平均归化互惠性上升到\
  \ 80%。有趣的是，进一步增加 `D` 并不会导致大幅的额外增加，例如，`D` = `X` 时平均归化互惠性等于 83%。因此，当 `D` > 0 时，存款金额不会显著改变归化互惠性（`q/p`\
  \ ≈ 80%）。最后，图 4.2 表明，随着存款 D 的增加，两个玩家的行为变得更加一致，这从最小到最大值测量得分区间的缩小可以看出。\n\n在随后的章节中，我们将经典双人信任游戏扩展到网络化\
  \ `N` 人信任游戏，并研究先进的区块链技术（特别是链上预言机）如何通过不同的奖励和惩罚机制驱动玩家行为。在其他方面，我们寻求理解在不牺牲社会效率的情况下，是否可以实现归化互惠性的提高。\n\
  \n# 网络化 N 人信任游戏的链上预言机\n\n## 预言机架构\n\n图 4.3 展示了我们提出的用于网络化 `N` 人信任游戏的链上预言机架构。所提出的架构由一组集群或池组成。每个集群包含三类代理：(*i*)\
  \ 委托者、(*ii*) 受托人和(*iii*) 观察者。观察者与玩家（委托者/受托人）的区别在于，观察者不参与游戏，而是跟踪和评估信任及诚信标准，如投资（`p`）和分配（`q`）。玩家通过\
  \ DApp 使用其公私钥与实验者的智能合约交互。游戏的不同回合由观察者使用 `Etherscan` 进行远程监控![图 4.3 网络化 n 人信任游戏的链上预言机架构。(images/fig4_3.jpg)\n\
  \n图 4.3 网络化 n 人信任游戏的链上预言机架构。\n\n我们在网络化 `N` 人信任游戏中激励玩家协作的第三方惩罚奖励机制基于众包。具体而言，观察者向助推合约（nudge\
  \ contract）提供集体人类智能，以惩罚表现出不当行为的集群或个体，或对良好行为提供正向奖励。助推合约以忠诚点的形式管理奖励-惩罚机制。委托者可以通过诚实的交易、投资和参与游戏获得忠诚点，并兑换积分以获得奖励。同样，受托人因慷慨的互惠而获得奖励。忠诚点让玩家保持参与度并意识到整体目标，即总收益、社会效率和归化互惠性的增加。此外，玩家拥有一个与其公钥关联的评分档案，玩家每执行一次诚实操作即可获得\
  \ 1 分，如果操作不诚实则失去 1 分。评分档案由助推合约管理。委托者和受托人可以通过调用 `getTrustorLoyalty()` 和 `getTrusteeLoyalty()`\
  \ 函数分别检查其忠诚奖励点的状态。此外，还设计了一种激励策略，利用行为心理学原理结合经济结果，使系统在改变玩家行为方面更加有效。玩家在游戏中达到一定数量的忠诚奖励点后将获得\
  \ Ether 形式的货币奖励，例如，10 分 = 1 Ether。\n\n获得的 Ether 将加入玩家的赠金 `X` 中，用于游戏后续回合的投资和支付。我们注意到，有更先进的方案可以计算用户的评分/声誉，例如\
  \ [15, 16]]。\n\n## 基于投票决策的链上\n\n在我们的预言机实现中，我们为玩家和观察者分配了预定的公钥。每个密钥对的创建可以使用多种选项完成，包括\
  \ Ethereum 钱包和在线/离线以坊地址生成器，例如：Vanity-ETH\n\n\n\n\n\n我们将提出的链上预言机在多人 `N`-玩家信任游戏中的性能，与传统的双人基准实验进行了对比。为此，我们邀请了同样的两位之前玩过经典双人信任游戏的学生，并要求他们再次玩游戏，即在没有任何观察者的情况下进行。接着，我们邀请他们在有两个观察者存在的情况下玩游戏。这两名玩家被告知他们的账户与忠诚奖励积分相关，如果他们诚实行为，积分将会增加；否则，他们将受到惩罚并失去\
  \ 1 个忠诚积分。双方玩家都清楚，每积累 10 个忠诚积分将获得 1 个 Ether。此外，他们被通知决策将由两个观察者做出，观察者将监控他们的在线交易以做出独立的奖励/惩罚决定。所有四名参与者通过互联网匿名进行互动。\n\
  \n图 4.4 比较了无观察者的双人信任游戏与有观察者的四人信任游戏的平均社会效率。该图清楚地证明了对于所有的 `D` 取值，观察者的存在对社会效率的积极影响。请注意，在有观察者的情况下，瞬时社会效率对于所有\
  \ `D` 取值都达到了最大 100%，而在双人信任游戏中，这需要全额存款 `D` = `X` Ether 才能实现。至于有无观察者情况下可实现的归一化互惠性，情况类似，如图\
  \ 4.5 所示。然而，虽然观察者的存在有助于将平均（及瞬时）归一化互惠性一致保持在 80%以上（相比之下，图 4.2 中低于 80%），但仍有进一步提高的空间，特别是对于\
  \ `0 ≤ D < X`。\n\n![图 4.4 无观察者的双人信任游戏与有观察者的四人信任游戏相对于存款 d = {0, 2, 5, x} ether 的平均社会效率（显示从最小到最大的测量得分区间）。](img/fig4_4.jpg)\n\
  \n图 4.4 无观察者的双人信任游戏与有观察者的四人信任游戏相对于存款 d = {0, 2, 5*, x*} ether 的平均社会效率（显示从最小到最大的测量得分区间）。\n\
  \n![图 4.5 无观察者的双人信任游戏与有观察者的四人信任游戏相对于存款 d = {0, 2, 5, x} ether 的平均归一化互惠性 q/p（显示从最小到最大的测量得分区间）。](img/fig4_5.jpg)\n\
  \n图 4.5 无观察者的双人信任游戏与有观察者的四人信任游戏相对于存款 d = {0, 2, 5*, x*} ether 的平均归一化互惠性 q/p（显示从最小到最大的测量得分区间）。\n\
  \n# 机器人经济：使用说服性机器人进行多人信任游戏\n\n### 机器人经济：核心原则\n\n许多研究表明，机器人的物理存在有利于说服力、好感度和信任度等多种社会互动元素。因此，利用社会机器人的这些有利特性是增强信任游戏性能的一种前景良好的解决方案。与人类操作员连接的社会机器人形成了一个实体，创造了人与机器人沉浸式共存的新范式，其中说服性机器人旨在通过社会影响改变用户的行为。重要的是，这些机器人与其说是工具，不如不如说是伙伴，它们在社会环境中的说服作用主要是以人为中心的\
  \ [17]。\n\n最近，在[18]中，一项针对五名参与者的实验性试点研究通过以`绿须巫 (WoZ)` 方式操作（即由人员远程控制机器人）的人形机器人，将信任游戏从原始的人与人语境调整到社会人机交互（sHRI）设置。获得的结果表明，玩\
  \ sHRI 信任游戏的人遵循与人类信任模型非常相似的人机信任模型。然而，由于缺乏人类常见的`社交线索`（例如面部表情或手势），这些线索通常会影响对信任度的初始评估，几乎所有参与者最初的投入金额较低，并在通过社会经验积极探索机器人的行为和信任度后增加了投入金额。\n\
  \n接下来，我们关注新兴的`机器人经济（robonomics）`领域，该领域研究区块链技术对 sHRI、行为经济学、行为博弈论以及加密货币（货币和代币）对机器人融入人类社会的社会技术影响\
  \ [19]。机器人经济涉及说服性机器人，其中物理或虚拟机器人代理通过心理奖励以及实物奖励，作为人类行为修正的执行者或监督者。在最近的一项探索性 sHRI 研究[20]中，比较了十种多模态`说服策略`在社会机器人试图影响人类行为方面的有效性。实验表明，两种特定的说服策略——情感策略和逻辑策略——实现了最高的说服力和信任度。\n\
  \n### 说服性机器人策略\n\n与[21]类似，我们开发了一个`群智巫 (CoZ)`平台，让观察者能够远程控制放置在受托人面前软银社会机器人 Pepper\
  \ 的手势，并通过基于 Web 的文本转语音翻译进行实时对话。CoZ 用户界面使用 Django Web 服务器构建。受托人可以通过语音和 Pepper 的触控平板板与\
  \ Pepper 通信。为了支持语音通信，我们实现了一个基于 Web 的语音转文本工具。当从语音中提取文本时，受托人可以在 Pepper 的平板板上看到他的消息以进行验证。接着，语音转文本函数调用另一个函数为主消息（提取的文本）添加额外字段，包括序列\
  \ ID、发送者 ID、消息类型和时间，以便在 Django 服务器上区分这些消息。被调用的函数执行封化过程，并通过 OOCSI 中间件将消息发送到 Django\
  \ 服务器。\n\n在我们开发的 CoZ 系统中，有两种消息：信息消息和控制消息。信息消息由观察者创建。此类消息通过 Pepper 组播给所有观察者和受托人以更新他们，但不包括信任者。受托人可以在\
  \ Pepper 的平板板上看到所有信息消息。此外，Pepper 使用文本转语音功能将观察者的消息传输给受托人。控制消息用于 CoZ 架构的重要功能，例如在 Pepper\
  \ 上执行手势。CoZ 界面调用 JavaScript 方法来调用 Django 服务器上的一个新事件。被调用的方法设置了所有相关关节的角度以及 Pepper\
  \ 眼睛的发光二极管（LED）颜色。由于两个或多个观察者可能同时按下相同或不同的社交线索按钮，Django 服务器实现了一个队列来同步所有发出的命令。当 Pepper\
  \ 正在执行手势时，Django 服务器将下一个手势放入队列并连续发送给 Pepper。\n\n此外，我们的 CoZ 用户界面提供了一个区域，观察者可以通过 Pepper\
  \ 的眼睛观察受托人的环境。为了实现这一部分，我们使用了 `OpenCV`。\n\n\n\n\n\n# CoZ 接口与 Pepper 策略\n\n`CoZ` 接口还显示了九个社交提示按钮，以防止可能的拼写错误并为观察者填补沟通空白节省时间。这九个社交提示按钮分别是：“争取时间”、“告诉我详情”、“做得好”、“你好”、“再见”、“张开双臂”、“挑衅手”、“不”和“寻求关注”。观察者可以在对话期间按下这些按钮来执行\
  \ `Pepper` 的不同手势，从而影响受托人的行为。\n\n此外，我们起草了两个脚本：一种是诉诸受托人左脑（即 `logics`）的逻辑说服策略，另一种是诉诸受托人右脑（即\
  \ `emotions`）的情感说服策略。每个脚本都包含存储在 `CoZ` 接口下拉菜单中的预设句子，观察者可以从中进行选择，通过实时的文本转语音消息引导受托人的行为向互惠方向靠拢。不同的机器人说服策略运行方式如下：\n\
  \n- **逻辑策略**：包含一套奖励和惩罚机制。此外，`Pepper` 通过上述 `CoZ` 平台通过语音合成提供一些经济和技术建议。\n- **情感策略**：包含一套奖励/惩罚机制，`Pepper`\
  \ 通过 `CoZ` 平台使用语音合成鼓励消息。此外，`Pepper` 通过手势和具身交流向受托人展示社交提示。\n- **混合策略**：将上述逻辑和情感策略结合为一种混合策略。它包含一套奖励/惩罚机制，`Pepper`\
  \ 不仅通过 `CoZ` 平台通过语音合成提供经济和技术建议，还提供鼓励。此外，`Pepper` 通过手势和具身交流向受托人展示社交提示。\n\n例如，表 4.1\
  \ 列出了我们提出的混合逻辑-情感说服策略中 `Pepper` 使用的社交提示。在这种策略中，一个观察者执行逻辑策略，另一个观察者执行情感策略，使受托人接收混合信息和混合的情身交流。根据受托人的行为，观察者在实验的每轮中执行“信任行为动作”或“不信任行为动作”。表\
  \ 4.1 中的社交提示允许观察者使用我们开发的 `CoZ` 平台控制 `Pepper` 的语音合成和具身交流。\n\n### 实验设置\n\n我们进行了涉及\
  \ 20 名学生的大规模实验，以衡量我们开发的说服机器人策略（即逻辑、情感和混合策略）的有效性。与我们上次双玩家信任游戏实验类似，参与的学生不知道彼此的身份。此外，学生之前没有进行过任何行为研究实验。选取学生的年龄在\
  \ 24 到 32 岁之间。其中 3 名女性，17 名男性。实验分为四个阶段：基准、逻辑、情感和混合策略。每个阶段涉及 5 轮。我们首先进行了基准信任游戏实验，受托人不与\
  \ `Pepper` 交互；随后进行了让受托人接触 `Pepper` 的逻辑、情感和混合逻辑-情感说服策略的实验。信任者和受托人都通过区块链账户与实验者的智能合约进行交互。信任人在单独房间玩游戏，而受托人则独自在实验室与\
  \ `Pepper` 在。`Pepper` 由观察者通过我们的 `CoZ` 平台远程控制。我们使用了相同的设置，即信任者的初始资金 `X` = 10 Ether，`K`\
  \ = 2。此外，在所有说服策略中，我们没有使用任何押金机制（即 `D` = 0）。\n\n### 结果\n\n系统使用以下函数初始化状态：\n```javascript\n\
  if (endowment > K) {\n    updateStrategy(X, \"logical\");\n}\n```\n\n\n\n\n\n机器人学（Robonomics）是一个近期新兴的跨学科研究社会技术领域，它将行为经济学与先进区块链技术以及说服性机器人相结合。鉴于其在行为经济学中的重要地位以及信任在区块链中的相关性，我们关注了信任游戏（trust\
  \ game），包括其网络化多人扩展版本。我们通过实验证明了区块链机制`deposit`（押金）和`on-chaining oracle`（链上预言机）对提高社会效率和互惠性具有积极影响。我们的实验结果表明，第三方（如人类观察者，特别是社会机器人）的存在在基于区块链的信任游戏中起着重要作用。虽然信任游戏的核心实验者可以很容易被我们提出的`experimenter\
  \ smart contract`（实验者智能合约）取代，但通过`on-chaining oracles`执行的同伴压力，特别是由说服性机器人实现的具身通信，被证明具有比`deposit`等货币激励更潜的社会影响力，这为未来的工作开辟了新的研究方向。\n\
