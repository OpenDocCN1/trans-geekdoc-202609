  \ pp. 1–7, Jan–June 2020.\n\n# 5 超有机体到 6G 时代的信息迹社会与集体智能\n\nDOI: [10.1201/9781003427325](https://doi.org/10.1201/9781003427325)\n\
  \n## 引言\n\n与之前的代不同，未来第六代（6G）网络预计将通过将无线演进从“连接物”转变为“连接智能”来产生变革性影响。在其备受赞誉的《社会物理》（Social\
  \ Physics）中——该术语由现代社会学创始人奥古斯特·孔德（Auguste Comte）提出——麻理工学院媒体实验室教授亚历克斯德·彭顿（Alex Pentland）认为，社会互动（如社会学习和社交压力）是驱动集体智能（CI）演进的主要动力。根据彭顿的观点，集体智能是通过对周围同伴的共享学习以及利用暴露效应产生理想的行为变化而产生的。\n\
  \n\n\n\n\nMax Borders 通过他的 `social singularity`（社会奇点）概念呼应了这一结论，该概念定义了人类未来将像蜂群思维一样运行的节点，即\
  \ `CI`（群体智能）。目前，有两个独立的过程正在时间上飞速演进：(*i*) 技术奇点：机器变得越来越聪明（例如机器学习和 `AI`），以及 (*ii*) 社会奇点：人类变得越来越聪明。事实上，他认为这两个独立的过程实际上是同一个底层过程的两个方面，正等待着被编织在一起，以创造新的`以人为中心`的行业。越来越多地，我们将像蜜蜂一样完成大型任务，其中人类作为人类蜂群思维中的神经元，而区块链技术作为结缔组织来创建虚拟的信息素足迹，即可编程的激励机制。\n\
  \n自工业化开始以来，人类已经经历了三次工业革命，分别是蒸汽机的发展（18-19 世纪中叶）、电气化（1870 年以后）和数字化（1970 年以后）。当前的第四次工业革命是通过物联网（`IoT`）结合其他新兴技术（最重要的是网络物理系统（`CPS`））实现的。`CPS`\
  \ 帮助弥合了制造业与信息技术之间的差距，并诞生了智能工厂。这种技术演变开启了`工业 4.0`，它是德国政府《高技术战略 2020 行动计划》的主要日程、美国通用电气公司的工业互联网以及中国的“互联网+”。一种将人类置于今日\
  \ `CPS` 中的以人为中心的方法，是日本政府《第五次科学技术基本计划》中的“社会 5.0”倡议 [2]]。通过在社会、认知和物理层面对人类进行功能性整合，`CPS`\
  \ 变成了所谓的`网络物理社会系统（CPSS）` [3]]。\n\n`CPSS` 的*成员*可能参与各种网络物理社会行为。Gladden [4] 在最近的研究中从技术上更详细地调查了“社会\
  \ 5.0”的以人为本。Gladden [4] 将“社会 5.0”的目标描述为：能够为所有人创造平等的机会，并提供一个有助于释放每个个体全部潜的环境。为了实现这一点，“社会\
  \ 5.0”将充分利用新兴的信息与通信技术（`ICT`），以消除每个个人自我实现的社会障碍。例如，图 5.1 描绘了从过去社会到未来社会的转变，以及它们与工业的协同演进\
  \ [4–6]]。\n\n![图 5.1 社会与工业向社会 5.0 的协同演进 [4, 5, 6].](images/fig5_1.jpg)\n\n图 5.1\
  \ 社会与工业向社会 5.0 的协同演进 [4, 5, 6]]。\n\n与`工业 4.0` 类似，“社会 5.0”旨在通过使用社会机器人、环境智能、先进的人机交互（`HCI`）、具身智能以及各种类型的扩展现实（`XR`）等，无缝融合数字世界与物理世界（另见图\
  \ 5.1）。然而，“社会 5.0”试图平衡“工业 4.0”的商业化侧重点。为此，“社会 5.0”的总目标将是创造世界上第一个超级智能社会。相反，“工业 4.0”的重点是创建一个完全自动化的智能工厂，因此对现场的人员需求最少。更有趣的是，“社会\
  \ 5.0”还构想了从传统货币经济向未来非货币经济的范式转变，这种经济基于可以衡量活动的技术，人类人类共同进化，这种活动没有货币价值（稍将在`代币经济学*的背景文中解释）[7]]。\n\
  \n有趣的是，上述的“社会 5.0”愿景与未来 `6G` 网络的远远景契合得惊人。`6G` 预计比第五代（`5G`）更以人类为中心，正如 `6GFP` 的全球首份\
  \ `6G` 白皮书概述的，`5G` 主要关注智能电网或智能城市等工业垂直领域。Maier [8] 通过展示两个突出的以人在环为中心的 5G/6G 示例，说明了\
  \ `CPSS` 的潜力。第一个是触觉互联网，它被广泛认为是最有趣的 `5G` 低延迟应用之一 [9]]。第二个是未来的“无物互联网”，它是通向开启 `6G`\
  \ 后智能手机时代的重要基石 [10]]。或许更重要的是，我们还详述了`机器人经济学`（`robonomics`）——这是 `6G` 时代的一个新兴领域，以及先进区块链技术在实现“社会\
  \ 5.0”愿景中所起的作用。\n\n在本章中，我们基于近期对 `6G` 时代`机器人经济学`的工作。我们旨在探索先进的区块链技术，以实现被称为 `Web3`\
  \ 的下一代互联网，该网络利用`代币化*`（`tokenization*`）的概念作为将价值物品转换为数字代币的过程。代币化将物理和数字世界中的资产以及访问权和许可数字化封装为称为“代币”的单元。我们研究了目标驱动型代币的设计，通过激励一个自主群体为“社会\
  \ 5.0”做出贡献来促进协作。为此，我们首先提出了一个基于 `CPSS` 的自下而上的代币工程框架，特别关注其激励机制在代币设计中的关键作用。然后，我们探索了`间接通信`（`indirect\
  \ communication`）的概念，通过在强化协作增强的“社会 5.0”中的痕迹，将社会组织与环境组织耦合来维持社会凝聚力，同时引导其集体行为创造公共物品。\n\
  \n本章其余部分的结构如下：“社会 5.0：从机器人经济学到代币经济学”章节详述了机器人经济学和代币经济学在社会 5.0 中的作用。在“通往以人为中心社会的路径\
  \ (DAO)”章节中，我们概述了建议的通往以人为中心社会的路径，并在技术上更详细地解释了目标驱动型代币和代币工程。此外，我们介绍了用于社会 5.0 的基于 `CPSS`\
  \ 的自下而上多层代币工程框架。“从超级有机体到 6G 时代的协作增强社会与集体智能”章节中，我们解释了提出的框架如何应用于推进 6G 时代的人类集体智能。“实施与实验结果”章节描述了其实验实现，并突出了了一些说明性结果。最后，“结论”章节对本章进行了总结。\n\
  \n## 社会 5.0：从机器人经济学到代币经济学\n\nCardenas 和 Kim [11] 对区块链及其他去中心化技术如何影响人类与机器人代理的交互以及他们向人类社会的整合提供了见解。为此，区块链技术可以作为账本，机器人和人类可以在其中访问并记录任何价值，如所有权证明或财务交易。此外，智能合约有助于编码机器人与人类之间自我执行和自我验证的协议逻辑。加密货币可用于允许机器人承担财务义务并与人类进行价值交换，反之亦然。\n\
  \n\n\n\n\nFreni 等人 \\[12] 最近分析了从传统货币经济学向非货币代币经济学的转变，以及代币在基于区块链的生态系统中的核心作用。去中心化区块链技术已在不同的价值基础场景中，通过利用名为`tokenization`（代币化）的过程应用于非货币语境。现有资产的代币化是指为任何物理对象或金融资产创建`tokenized\
  \ digital twin`（数字化数字孪生）的过程。生成的代币是封装价值的可交易单位。它们可以作为激励措施，协调特定监管生态系统中的参与者，以实现预期结果。根据\
  \ Freni 等人 \\[12]]，代币具有颠覆性潜力，通过将其用于声誉或投票权，可以将价值的概念扩展到经济领域之外。通过代币化，可以在其利益相关者之间共享奖励和收益，在激励生态系统中利用不同类型的数字化价值。\n\
  \n代币可以代表任何现有的数字或物理资产，也可以代表数字或物理世界中资产的访问权和权限。代币作为账目条目存储，并映射到区块链地址，该地址代表代币持有者的身份。最初，代币是通过底层区块链协议铸造的。然而，随着`Ethereum`的出现，代币移动到了区块链协议栈的顶层，现在可以在应用层创建，从而产生了所谓的应用代币。通过`Ethereum`，应用代币可以遵循以\
  \ 代币标准（例如 `ERC-20`），通过一种特定的智能合约类型（被称为代币合约）轻松廉价地发行。\n\n代币可能是区块链网络的杀手级应用，并被认为是被称为\
  \ Web3 的下一代互联网的主要驱动力之一 \\[13]]。如图 5.2 所示所示，虽然 Web1（只读网页）和 Web2（读写网页）分别开启了知识经济和今天的平台经济，但\
  \ Web3 将实现`token economy`，其中任何人的贡献都将通过代币获得补偿。代币经济以数字方式实现了完全全新的用例、业务模式以及资产和访问权的类型，这些在以前经济上是不可行的，从而实现了全新的全新的用例和价值创造模型。请注意，“代币经济”一词并不新鲜。在认知心理学中，它作为一种交换媒介被广泛研究，而且更重要的是，它作为建立理想人类行为的正向强化方法，这本身可能被视为一种价值创造。然而，与通常仅作支付媒介的硬币不同，代币可以用于广泛的不同的非货币目的。这种目标驱动型代币对于激励一个自治群体协作并为共同目标做出贡献具有重要作用。根据\
  \ Voshmgir \\[13]，对代币（特别是不同类型和角色）的探索仍处于非常早期。\n\n![图 5.2 互联网经济的演变：从只读的 Web1 信息经济和读写\
  \ Web2 平台经济，到基于去中心化区块链和自执行智能合约技术的读-写-执行 Web3 代币经济。](img/fig5_2.jpg)\n\n图 5.2 互联网经济的演变：从只读的\
  \ Web1 信息经济和读写 Web2 平台经济，到基于去中心化区块链和自执行智能合约技术的读-写-执行 Web3 代币经济。\n\n代币经济在实现新兴的去中心化自治组织（DAO）方面起着核心作用，DAO\
  \ 已成为近年来区块链技术快速发展催生的热点 \\[14]。DAO 可以被视为一个社会系统，由智能代理组成，基于现实和人工智能区块链系统共同演进为人机整合。在\
  \ DAO 中，所有的运行规则都以智能合约的形式记录在区块链上。代币经济激励措施结合分布式共识协议，用于实现 DAO 的自运行、自治理和自演化。事实上，根据 Wang\
  \ 等人 \\[14]]，使用代币作为激励是 DAO 的主要动力，其中他们所陈述的多层 DAO 参考模型中的所谓的`incentive mechanism`（激励机制）层将是代币设计的关键（稍后将进行更多讨论）。\n\
  \n## 通向以人为本社会的路径 (DAO)\n\n尽管在过去几年中发行了许多代币，但大多数这些发行的代币缺乏适当的功能设计和机制设计。在本节中，我们旨在通过讨论目标驱动型代币和引入代币工程这一重要问题来解决这两个缺点。\n\
  \n### 目标驱动型代币与代币工程\n\n回想“社会 5.0：从机器人经济学到代币经济学”章节，我们仍然处于探索不同代币角色和类型的非常早期阶段。例如，所谓的`purpose-driven\
  \ tokens`（目标驱动型代币）激励个人目标目标目标或集体目标。这种集体目标可能是公共物品，也可以是对负外部性的减少（例如减少 CO[2] 排放）。目标驱动型代币在不需要传统中介（例如政府）的情况下引入了公共物品创造的新形式。`Ethereum`\
  \ 等区块链网络通过提供只需几行智能合约代码即可创建应用代币的基础设施，将价值创造的思想推向高度，原则上任何目标都可以被激励。然而，鉴于运营用例仍然有限，这种技术驱动的公共物品创造的新现象需要更多的研发\
  \ \\[13]。\n\n工作量证明 (`PoW`）是维护公共物品的关键机制 \\[13]]。尽管集体生产公共物品可以产生正外部性，但它并不排除其他负外部性（例如区块链的耗能型挖矿过程）。在设计目标驱动型代币作为提供公共物品的手段时，行为经济学方法（例如著名的助推技术和行为博弈论）为引导个人采取某些行动提供了重要工具。\n\
  \n在接下来，我们关注代币工程这一重要问题，这是一个新兴术语，定义为分析、设计和验证代币化生态系统的理论、实践和工具 \\[13]]。它涉及一个自下而上的代币工程框架的设计，以及用于解决目标驱动型代币问题的适当机制的设计。请注意，机制设计是经济学的一个分支，处理如何激励每个人为集体目标做出贡献的问题。它也被称为“逆向博弈论”，因为它从博的终点（即理想的输出）开始，然后反向设计（激励）机制。\n\
  \n### 针对社会 5.0 的代币工程 DAO 框架\n\n\n\n\n\n回想“社会 5.0：从机器人经济学到代币经济学”章节，对于代币设计，在[14]中提出了一种多层\
  \ DAO 参考模型，尽管该模型刻意保持了通用性，与社会 5.0 无任何特定关系。DAO 参考模型的自下而上架构由以下五层组成：(*i*)基础技术、(*ii*)治理运营、(*iii*)激励机制、(*iv*)组织形式和(*v*)表现形式。由于空间限制，我们建议感兴趣的读者参阅[14]以获取有关通用\
  \ DAO 参考模型的更多信息以及对每一层的更详细描述。在下文中，我们将通用 DAO 参考模型适配到社会 5.0 的特定需求，并重点介绍我们在基于 CPSS 的自下而上代币工程\
  \ DAO 框架中中所做的修改。\n\n图 5.3 描绘了我们为社会 5.0 提出的多层代币工程 DAO 提框架，该框架构建在先进的 CPSS 之上。物联网作为主要的\
  \ CPS（信息物理系统）示例已经开启了工业 4.0，而在“引言”中简要提到的先进的 CPSS（如未来的“无物物联网”）将成为开启社会 5.0 的关键。正如在[10]中详细解释的那样，无物物联网为数字世界与现实世界的融合创建了一个融合平台，提供各种人类意图的服务，而无需拥有或携带任何类型的计算或存储设备。它设想让互联网服务在需要时从*周围环境*中出现，在不需要时消失。从目前基于设备的设备的互联网向无物物联网的过渡分为三个阶段：(*i*)可携带设备（例如智能手机）、(*ii*)可穿戴设备（例如\
  \ Google 和 Levi's 的智能夹克），最后最后是(*iii*)近场设备（nearables）。近场设备指的是附近的计算/存储技术和业务提供机制，它们足够智能，能够*根据用户的上下文和历史进行学习和反应*，以提供用户意图的服务。图\
  \ 5.3 底部的基础技术层说明了无物物联网底层的关键赋能技术（例如区块链）。此外，该层包含了未来技术，最显著的是生物工程，预计这些技术将在未来的超智能社会 5.0\
  \ 中发挥日益重要的作用（另见图 5.1）。\n\n![FIGURE 5.3 基于 CPSS 的社会 5.0 自下而上代币工程 DAO 框架](img/fig5_3.jpg)\n\
  \n图 5.3 基于 CPSS 的社会 5.0 自下而上代币工程 DAO 框架。\n\n在基础技术层之上，存在治理运营层。通常情况下，该层通过智能合约（例如投票）编码共识，并通过链上和链下协作（链上预言机）实现\
  \ DAO 的自治理。此外，该层包括通过智能合约实现的助推机制（助推合约）、集体决策以及成员之间的知识共享。激励机制层涵盖了上述与代币相关的技术及其为了促进代币工程而进行的恰当对齐。接下来，组织形式层包括在提议的\
  \ DAO 项目整个生命周期内的投票过程和成员身份。请注意，在经济学中，带有受监管访问权（如成员身份）的公共物品被称为*俱乐部货物*（club goods）。\n\
  \n最后，表现层允许成员采取简单的、局部独立的行动，这些行动共同导致 DAO 以及整个社会 5.0 复杂自适应系统行为的出现。由于其与去中心化区块链技术具有惊人的相似性，我们探索了在蚂蚁和蜜蜂等社会性昆虫社会中广泛存在的生物信息迹（stigmergy）机制的潜力，特别是它们通过成员在环境中创建气味*痕迹*（traces）进行自组织和间接协调的内在能力。感知到这些痕迹后，其他社会成员受到刺激执行后续动作，从而以一种自持续的自催化方式强化痕迹，而不需要任何中央控制实体，正如下文“从超有机体到信息迹社会以及\
  \ 6G 时代的集体智能”章节中所解释的那样。\n\n### 人对人的利用：控制论与社会\n\n将基于 Web2 的社交网络迁移到 Web3 的一个显著例子是\
  \ Facebook 在 2019 年 6 月的最近公告，宣布推出一种新基础设施来管理他们命名为*Libra*（后更名为 Diem）的代币，包括用于与法定货币交换的适当价格稳定机制。然而，代币化货币的设计不足以实现社会\
  \ 5.0 的愿景。为了说明这一点，请注意包括前高管在内的人开始公开质疑社交媒体对我们生活的影响，并公开了他们帮助创建了我们今天所知的社交媒体的遗憾。\n\n\
  更多以人为中心的解决方案的有用提示可以在控制论的起源中找到。在他开基性的著作《人对人的利用：控制论与社会》中，控制论的创始人诺伯特·维纳（Norbert Wiener）认为，根据控制原理工作的机器的危险在于，它们可能被人类或人类用来增加对其他人类的控制。为了避免这种重重危险，维纳强调了人类学家（例如[4]）和哲学的需求。他假设科学家必须了解人类的本质及其内在目标，并认为通过反馈环路的*内部通信*对于社会的福利至关重要。\n\
  \n## 从超有机体到信息迹社会以及 6G 时代的集体智能\n\n在本节中，我们通过从社会性昆虫群体观察到的具有类脑认知能力的生物超有机体中借鉴灵感，探索如何在社会\
  \ 5.0 中实现上述内部通信的完整性。信息迹（stigmergy，源自希腊语*stigma*“符号”和*ergon*“工作”）由法国动物学家皮埃尔·保罗·格拉斯（Pierre-Paul\
  \ Grassé）于 1959 年首次引入，是一种自组织机制，使其能够对其矛盾的观察提供优雅的解释：在社会性昆虫群体中，个体像独自工作一样工作，但它们的集体活动似乎是协调的。在信息迹中，个体在环境中留下痕迹，这些痕迹会对它们产生反馈，从而激发其后续动作。群体通过各种形式的存储在环境中记录活动，并利用这些记录通过反馈环组织并约束集体行为，从而产生了间接的概念。因此，信息迹通过环境和社会组织的耦合维持了社会凝聚力。请注意，对于社会生活的进化，从孤独到社会生活的路径可能并没有想象的那么复杂。事实上，在人工智能的群体智能子领域（例如群体机器人），信息迹被广泛认为是关键概念之一。\n\
  \n在下文中，我们说明图 5.3 中基于 CPSS 的代币工程 DAO 框架如何应用于社会 5.0，并描述相关的、目标驱动代币和机制的自下而上设计步骤：\n\n\
  *   **第 1 步：明确目标**\n\n\n\n\n\n回想“通往以人为中心的社会的路径（DAO）”章节可知，任何代币化生态系统的设计都始于一个理想的输出，即其目的。正如“引言”部分所述，Society\
  \ 5.0 的目标是 CPSS 成员提供一种技术社会环境，该环境 (*i*) 扩展了人类能力 (*ii*) 衡量了旨在人类共同智能化的活动。为此，正如 6G 时代广泛预期的那样，我们在相互连接的人类与物体群体中将\
  \ `AI` 推进到 `CI`。\n\n### 步骤 2：选择合适的 CPSS\n\n我们选择了最近提出的“无物物联网”（Internet of No Things）作为最先进的\
  \ CPSS，因为其最终转型阶段涉及近程设备（nearables），这些设备有助于为提供以人为中心和用户意图的服务创建智能环境（参见“通往以人为中心的社会的路径（DAO）”章节）。Maier\
  \ 等人 \\[10\\] 引入了超感知网络（`ESPN`），该网络在近程设备（如社交机器人、虚拟化身）中集成了无处不在的计算和说服性计算，通过社交影响改变人类用户的行为。在本章中，我们关注区块链和机器人学（robonomics）这两种基础技术，分别用于扩展\
  \ `ESPN’s online environment` 和 `offline agents`。\n\n### 步骤 3：定义 PoW\n\n回想“通往以人为中心的社会的路径（DAO）”章节可知，`PoW`\
  \ 是维护技术驱动公共物品的关键机制。具体而言，我们感兴趣的是创建俱乐部物品（club goods），这在“通往以人为中心的社会的路径（DAO）”章节中简要提到，其监管的访问权限避免了广为人知的“公地悲剧”\
  \ \\[15\\]。为了调节访问，我们利用了链上预言机（`on-chaining oracles`）的区块链技术。`链上预言机` 对于以可靠的方式将外部离线信息带入区块链至关重要。链上信息可能源于人类用户。因此，`链上预言机`\
  \ 有助于挖掘人类智能 \\[16\\]。作为 `PoW`，我们通过决策和知识共享定义了预言机对 CPSS 治理操作的贡献，这两者对于实现 `CI` 的特定目标都至关重要。\n\
  \n### 步骤 4：设计激励对齐的代币\n\n大多数代币缺乏适当的激励机制设计。回想“Society 5.0：从机器人学到代币经济学”章节可知，将代币作为激励是\
  \ DAO 的核心，且其研究才刚刚开始。重要的是，请回想代币化过程创建了`代币化数字孪生体`，通过包含`投票权` 来协调参与者并监管生态系统，以追求理想的结果。代币化数字孪生体的创建是通过`token\
  \ contract` 完成的，该合约激励了我们定义的 `PoW`，涉及以下两个步骤：(*i*) 创建代表物理或数字世界中给定资产的数字孪生体，以及 (*ii*)\
  \ 创建一个或多个代币，将给定物理/数字资产的访问权限/许可分配给代币持有者的区块链地址。\n\n### 步骤 5：通过信息素与痕迹促进 DAO 成员间的间接通信\n\
  \n最后，让参与特定 DAO 项目的成员 (*i*) 在 `ESPN’s blockchain-enabled online environment` 中记录其目标驱动的受代币激励的活动，并\
  \ (*ii*) 使用这些区块链交易（例如存款）作为`traces`（痕迹），在受信息素增强的 Society 5.0 中引导集体行为向更高水平的 `CI` 发展。\n\
  \n图 5.4 详细插说明了这五个步骤中每一步的功能，包括它们的运行交互。\n\n![图 5.4 使用代币化数字孪生体通过信息素增强的 Society 5.0，以推进\
  \ CPSS 中的集体智能 (CI)。](img/fig5_4.jpg)\n\n图 5.4 使用代币化数字孪生体通过信息素增强的 Society 5.0，以推进\
  \ CPSS 中的集体智能 (CI)。]\n\n## 实现与实验结果\n\n人类智能的通用定义是完成任务的成功率。在我们的实现中，人类智能任务（`HIT`）通过利用图像数据库\
  \ `ImageNet` 实现。\n\n图 5.5 详细描述了我们实现的设置和实验步骤。我们开发了一个基于 JavaScript 的 `HIT` 平台，让人们从\
  \ 20 张 `ImageNet` 图像中选择，并添加相关的图像标记信息，通过中间服务器 `OOCSI` 将两者都交付到配置妥当的 `MTurk` 和 `Amazon\
  \ Web Services (AWS)` 账户。`MTurk` 工人对每个提交的 `HIT` 提供的答案由`链上预言机`进行评估，该预言机使用符合 `ERC-20`\
  \ 标准的访问权限令牌来监管投票过程，并释放分配给每个成功标记图像的目标驱动代币。最后，人类将发现的/奖励的代币作为信息素痕迹留在区块链上，帮助参与的 DAO\
  \ 成员更新关于奖励地图的知识并继续进行探索。\n\n![图 5.5 通过 Amazon MTurk 和链上预言机通过个人或集体的 ImageNet 标记发现隐藏的代币奖励地图。](img/fig5_5.jpg)\n\
  \n图 5.5 通过 Amazon MTurk 和链上预言机通过个人或集体的 ImageNet 标记发现隐藏的代币奖励地图。]\n\n图 5.6 显示了信息素对八位成员在奖励地图中发现的集体智能和内部奖励的积极影响。作为对比，该图还显示了没有信息素时的实验结果，此时\
  \ DAO 成员没有从知识共享中受益。\n\n![图 5.6 有无信息素的集体智能（百分比）和内部奖励（代币），对比众包工人数量。](img/fig5_6.jpg)\n\
  \n图 5.6 集体智能（百分比）和内部奖励。\n\n# 结论\n\nSociety 5.0 完美契合了未来 6G 预期的从垂直行业向以人为中心的转变。它利用了参与人类行为的\
  \ CPSS 以及能够实现从货币向非货币范式转移的技术，例如我们考虑的基于区块链的 `Web3` 经济及其在新兴 DAO 中的重要作用。由于与去中心化区块链技术的相似性，我们采用了信息素——一种在昆虫社会中广泛存在的生物自组织机制——通过区块链在线环境中创建的痕迹（反馈循环）促进离线代理之间的间接通信和内部协调。我们实现的基于\
  \ CPSS 的 Society 5.0 自下而上代币工程 DAO 框架经证明，通过区块链在线环境中的信息素痕迹增加了 `CI` 和奖励的目标驱动代币。\n\n\
