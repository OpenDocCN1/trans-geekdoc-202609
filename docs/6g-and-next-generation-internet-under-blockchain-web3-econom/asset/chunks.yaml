    物联网（IoT）对象识别面临一个根本性挑战源于传统的域名系统（DNS）。通常，DNS 在中心化模块中管理，因此在大型系统中，它可能会由于单方面的高级持续威胁（APT）攻击以及区域文件同步延迟导致大规模故障。显然，需要一种更健壮、分布式的名称管理系统，以支持
    DNS 的平滑演进，并使其对于物联网及整个未来网络更加高效。为此，Duan 等人引入了一种名为“DNSLedger”的去中心化区块链域名系统 \[16]。为了重建
    DNS 的层级结构，`DNSLedger` 包含了两种区块链：(i) 一个存储所有顶级域名信息的单一根链，以及 (ii) 多个顶级域名（TLD）链，每个链负责各自域名的信息。在
    `DNSLedger` 中，域名服务器作为区块链节点，而每个 `TLD` 链可能会选择一个或多个服务器加入根链。`DNSLedger` 客户端可以执行常见的
    DNS 功能，如域名查询、应用和修改。


    上述许多研究都将以太坊作为首选区块链。事实表明，完全分布的以太坊架构能够增强健性和安全性。此外，通常采用面向网关的设计方法，将计算密集型任务从低功耗、资源受限的物联网终端卸载到中间网关，从而使其能够访问以太坊区块链网络。同时还表明，WiFi
    访问链路的延迟增加和带宽减少不会导致区块到达率大幅恶化。


    尽管近期取得了进展，但以太坊与其他区块链区分的显著特征（见“以太坊对比比特币区块链”章节）仍有待深入探索，包括它们与人工智能、机器人等其他新兴关键技术的共生，以及被称为“边缘计算”的去中心化云计算解决方案的融合。


    ### 区块驱动边缘计算

    尽管近期取得了进展，但以太坊与其他区块链区分的显著特征（见“以太坊对比比特币区块链”章节）仍有待深入探索，包括它们与人工智能、机器人等其他新兴关键技术的共生，以及被称为“边缘计算”的去中心化云计算解决方案的融合。


    此处特别感兴趣的问题是如何利用去中心化机制来实现……，这在 \[8] 中尚未被考虑。云计算面临的关键挑战之一是端到端响应。为了解决这一挑战，提出了多接入边缘计算（`MEC`），它是一种附近的、资源丰富的计算机或计算机集群。根据
    ETSI 发布的白皮书，`MEC` 被认为是一种关键新兴技术。鉴于上述论，将区块链和边缘计算集成成一个统一的实体成为一种自然趋势。一方面，通过将区块链引入边缘计算网络，系统可以提供可靠的网络访问和控制。另一方面，边缘计算使得从功率限制的设备进行区块链存储和挖矿成为可能。此外，边缘计算实现了扩展的存储和计算
    \[17]。


    近期关于区块链和边缘计算开展了多项研究。在 \[18] 中，通过将共识过程和数据处理任务卸载到更强大的边缘计算资源，资源受限的物联网设备从计算密集型任务中解放出来。所提出的
    `EdgeChain` 构建在以太坊平台上，使用智能合约监控和监管物联网设备的行为。在 \[19] 中，提出了另一种具有边缘计算能力的物联网区块链计算卸载方案，称为
    `BeCome`。该研究的目标旨在减少边缘计算设备的任务卸时间和能量消耗，同时实现负载均衡和数据完整性。


    Zhaofeng 等人 \[20]] 了一种基于区块链的边缘计算信任数据管理方案 `BlockTDM`，用于解决边缘计算环境中的数据信任和安全问题。具体而言，作者提出了一种灵活可配置的区块链架构，包括相互身份验证协议、灵活共识、智能合约、区块和交易数据管理以及区块链节点管理和部署。`BlockTDM`
    方案支持基于矩阵的多通道数据分段以及对敏感或隐私数据的隔离保护。此外，作者在交易负载存储到区块链系统之前设计了用户定义的敏感数据加密。他们通过适当的智能合约实现了对受保护区块链数据和交易的条件访问和解密查询。他们的分析和评估表明，提出的
    `BlockTDM` 方案为信任数据管理提供了一种通用、灵活且可配置的区块链范式，具有高度的可信度。


    总之，区块链驱动边缘计算已成为一个重要概念，它利用去中心化管理和分布式服务来满足下一代通信网络的安全、可扩展性和性能需求，这在“去中心化触觉互联网”中进行了更详尽的技术讨论。


    ## IEEE P1918.1 触觉互联网


    在本节中，我们简要概述触觉互联网的基本概念、特征、结构和分类。随后，将更详细介绍一些典型的触觉互联网应用和网络基础设施需求。


    ### 触觉互联网：核心原理


