    # Acknowledgment


    The completion of this book would have never been possible without the support
    and collaboration of a number of amazing people. I would like to thank my former
    advisor Prof. Martin Maier of the Institut National de la Recherche Scientifique
    (INRS), Montréal, Canada for outstanding support and guidance in my initial academic
    and scientific steps. Furthermore, I would like to thank Dr. Amin Ebrahimzadeh
    and Dr. Sajjad Rostami for their fruitful collaboration to the experimental results
    reported in [Chapters 3](#chapter03.xhtml#c03), [4](#chapter04.xhtml#c04), and
    [5](#chapter05.xhtml#c05) of this book. At CRC Press, I would like to thank Daina
    Habdanka and Laura Piedrahita for their guidance throughout the whole process
    of preparing the book. Finally, and most importantly, I like to take this opportunity
    to express my great depth of gratitude to my parents and friends for their endless
    support, love, and encouragement.


