    Max Borders 通过他的 `social singularity`（社会奇点）概念呼应了这一结论，该概念定义了人类未来将像蜂群思维一样运行的节点，即
    `CI`（群体智能）。目前，有两个独立的过程正在时间上飞速演进：(*i*) 技术奇点：机器变得越来越聪明（例如机器学习和 `AI`），以及 (*ii*) 社会奇点：人类变得越来越聪明。事实上，他认为这两个独立的过程实际上是同一个底层过程的两个方面，正等待着被编织在一起，以创造新的`以人为中心`的行业。越来越多地，我们将像蜜蜂一样完成大型任务，其中人类作为人类蜂群思维中的神经元，而区块链技术作为结缔组织来创建虚拟的信息素足迹，即可编程的激励机制。


    自工业化开始以来，人类已经经历了三次工业革命，分别是蒸汽机的发展（18-19 世纪中叶）、电气化（1870 年以后）和数字化（1970 年以后）。当前的第四次工业革命是通过物联网（`IoT`）结合其他新兴技术（最重要的是网络物理系统（`CPS`））实现的。`CPS`
    帮助弥合了制造业与信息技术之间的差距，并诞生了智能工厂。这种技术演变开启了`工业 4.0`，它是德国政府《高技术战略 2020 行动计划》的主要日程、美国通用电气公司的工业互联网以及中国的“互联网+”。一种将人类置于今日
    `CPS` 中的以人为中心的方法，是日本政府《第五次科学技术基本计划》中的“社会 5.0”倡议 [2]]。通过在社会、认知和物理层面对人类进行功能性整合，`CPS`
    变成了所谓的`网络物理社会系统（CPSS）` [3]]。


    `CPSS` 的*成员*可能参与各种网络物理社会行为。Gladden [4] 在最近的研究中从技术上更详细地调查了“社会 5.0”的以人为本。Gladden
    [4] 将“社会 5.0”的目标描述为：能够为所有人创造平等的机会，并提供一个有助于释放每个个体全部潜的环境。为了实现这一点，“社会 5.0”将充分利用新兴的信息与通信技术（`ICT`），以消除每个个人自我实现的社会障碍。例如，图
    5.1 描绘了从过去社会到未来社会的转变，以及它们与工业的协同演进 [4–6]]。


    ![图 5.1 社会与工业向社会 5.0 的协同演进 [4, 5, 6].](images/fig5_1.jpg)


    图 5.1 社会与工业向社会 5.0 的协同演进 [4, 5, 6]]。


    与`工业 4.0` 类似，“社会 5.0”旨在通过使用社会机器人、环境智能、先进的人机交互（`HCI`）、具身智能以及各种类型的扩展现实（`XR`）等，无缝融合数字世界与物理世界（另见图
    5.1）。然而，“社会 5.0”试图平衡“工业 4.0”的商业化侧重点。为此，“社会 5.0”的总目标将是创造世界上第一个超级智能社会。相反，“工业 4.0”的重点是创建一个完全自动化的智能工厂，因此对现场的人员需求最少。更有趣的是，“社会
    5.0”还构想了从传统货币经济向未来非货币经济的范式转变，这种经济基于可以衡量活动的技术，人类人类共同进化，这种活动没有货币价值（稍将在`代币经济学*的背景文中解释）[7]]。


    有趣的是，上述的“社会 5.0”愿景与未来 `6G` 网络的远远景契合得惊人。`6G` 预计比第五代（`5G`）更以人类为中心，正如 `6GFP` 的全球首份
    `6G` 白皮书概述的，`5G` 主要关注智能电网或智能城市等工业垂直领域。Maier [8] 通过展示两个突出的以人在环为中心的 5G/6G 示例，说明了
    `CPSS` 的潜力。第一个是触觉互联网，它被广泛认为是最有趣的 `5G` 低延迟应用之一 [9]]。第二个是未来的“无物互联网”，它是通向开启 `6G`
    后智能手机时代的重要基石 [10]]。或许更重要的是，我们还详述了`机器人经济学`（`robonomics`）——这是 `6G` 时代的一个新兴领域，以及先进区块链技术在实现“社会
    5.0”愿景中所起的作用。


    在本章中，我们基于近期对 `6G` 时代`机器人经济学`的工作。我们旨在探索先进的区块链技术，以实现被称为 `Web3` 的下一代互联网，该网络利用`代币化*`（`tokenization*`）的概念作为将价值物品转换为数字代币的过程。代币化将物理和数字世界中的资产以及访问权和许可数字化封装为称为“代币”的单元。我们研究了目标驱动型代币的设计，通过激励一个自主群体为“社会
    5.0”做出贡献来促进协作。为此，我们首先提出了一个基于 `CPSS` 的自下而上的代币工程框架，特别关注其激励机制在代币设计中的关键作用。然后，我们探索了`间接通信`（`indirect
    communication`）的概念，通过在强化协作增强的“社会 5.0”中的痕迹，将社会组织与环境组织耦合来维持社会凝聚力，同时引导其集体行为创造公共物品。


    本章其余部分的结构如下：“社会 5.0：从机器人经济学到代币经济学”章节详述了机器人经济学和代币经济学在社会 5.0 中的作用。在“通往以人为中心社会的路径
    (DAO)”章节中，我们概述了建议的通往以人为中心社会的路径，并在技术上更详细地解释了目标驱动型代币和代币工程。此外，我们介绍了用于社会 5.0 的基于 `CPSS`
    的自下而上多层代币工程框架。“从超级有机体到 6G 时代的协作增强社会与集体智能”章节中，我们解释了提出的框架如何应用于推进 6G 时代的人类集体智能。“实施与实验结果”章节描述了其实验实现，并突出了了一些说明性结果。最后，“结论”章节对本章进行了总结。


    ## 社会 5.0：从机器人经济学到代币经济学


    Cardenas 和 Kim [11] 对区块链及其他去中心化技术如何影响人类与机器人代理的交互以及他们向人类社会的整合提供了见解。为此，区块链技术可以作为账本，机器人和人类可以在其中访问并记录任何价值，如所有权证明或财务交易。此外，智能合约有助于编码机器人与人类之间自我执行和自我验证的协议逻辑。加密货币可用于允许机器人承担财务义务并与人类进行价值交换，反之亦然。


    '
- fmt: '

    The shift from conventional monetary economics to nonmonetary tokenomics and the
    central role tokens play in blockchain-based ecosystems were analyzed recently
    by Freni et al. \[[12](#chapter05.xhtml#r5_12)\]. Decentralized blockchain technologies
    have been applied in a non-monetary context by exploiting a process known as `tokenization`
    in different value-based scenarios. The tokenization of an existing asset refers
    to the process of creating a `tokenized digital twin` for any physical object
    or financial asset. The resultant tokens are tradeable units that encapsulate
    value digitally. They can be used as incentives to coordinate actors in a given
    regulated ecosystem in order to achieve a desired outcome. According to Freni
    et al. \[[12](#chapter05.xhtml#r5_12)\], tokens have a disruptive potential to
    expand the concept of value beyond the economic realm by using them for reputation
    purposes or voting rights. Through tokenization, different types of digitized
    value can be exploited in an ecosystem of incentives by sharing the rewards and
    benefits among its stakeholders.


    Tokens can represent any existing digital or physical asset, as well as access
    rights to assets and permissions in the digital or physical world. A token is
    stored as an entry in the ledger and is mapped to a blockchain address, which
    represents the identity of the token holder. Originally, tokens were minted by
    using the underlying blockchain protocols. However, with the advent of `Ethereum`,
    tokens moved up the blockchain protocol stack and can now be created on the application
    layer, giving rise to so-called application tokens. With `Ethereum`, application
    tokens can be issued easily and cheaply following the Ethereum token standards
    (e.g., `ERC-20`) via a specific type of smart contract, known as token contract.


    Tokens might be the killer application of blockchain networks and are recognized
    as one of the main driving forces behind the next-generation Internet referred
    to as the Web3 \[[13](#chapter05.xhtml#r5_13)\]. As shown in [Fig. 5.2](#chapter05.xhtml#f5_2),
    while the Web1 (read-only web) and Web2 (read-and-write web) enabled the knowledge
    economy and today’s platform economy, respectively, the Web3 will enable the `token
    economy` where anyone’s contribution is compensated with a token. The token economy
    enables completely new use cases, business models, and types of assets and access
    rights in a digital way that were economically not feasible before, thus enabling
    completely new use cases and value creation models. Note that the term token economy
    is far from novel. In cognitive psychology, it has been widely studied as a medium
    of exchange, and arguably more importantly, as a positive reinforcement method
    for establishing desirable human behavior, which in itself may be viewed as one
    kind of value creation. Unlike coins, however, which have been typically used
    only as a payment medium, tokens may serve a wide range of different non-monetary
    purposes. Such purpose-driven tokens are instrumental in incentivizing an autonomous
    group of individuals to collaborate and contribute to a common goal. According
    to Voshmgir \[[13](#chapter05.xhtml#r5_13)\], the exploration of tokens, in particular
    different types and roles, is still in the very early stages.


    ![FIGURE 5.2 Evolution of Internet economy: From read-only Web1 information economy
    and read-write Web2 platform economy to read-write-execute Web3 token economy
    based on decentralized blockchain and self-executing smart contract technologies.](images/fig5_2.jpg)


    [FIGURE 5.2](#chapter05.xhtml#b05fig5_2) Evolution of Internet economy: From read-only
    Web1 information economy and read-write Web2 platform economy to read-write-execute
    Web3 token economy based on decentralized blockchain and self-executing smart
    contract technologies.


    The token economy plays a central role in realizing the emerging decentralized
    autonomous organizations (DAO), which has become a hot topic spawned by the rapid
    development of blockchain technology in recent years \[[14](#chapter05.xhtml#r5_14)\].
    The DAO may be viewed as a social system composed of intelligent agents coevolving
    into human-machine integration based on real-world and artificial blockchain systems.
    In the DAO, all the operational rules are recorded on the blockchain in the form
    of smart contracts. Token economy incentives together with distributed consensus
    protocols are utilized to realize the self-operation, self-governance, and self-evolution
    of the DAO. In fact, according to Wang et al. \[[14](#chapter05.xhtml#r5_14)\],
    the use of tokens as incentives is the main motivator for the DAO, whereby the
    so-called `incentive mechanism` layer of their presented multi-layer DAO reference
    model will be key for the token design (to be discussed in more shortly shortly).


    ## THE PATH (DAO) TO A HUMAN-CENTERED SOCIETY


    While a lot of tokens have been issued over the last few years, most of these
    issued tokens lack proper functionality and mechanism design. In this section,
    we aim at addressing these two shortcomings by discussing purpose-driven tokens
    and introducing the important problem of token engineering.


    ### Purpose-Driven Tokens and Token Engineering


    Recall from “Society 5.0: From Robonomics to Tokenomics” section that we are still
    in the very early stages of exploring different roles and types of tokens. For
    instance, so-called `purpose-driven tokens` incentivize individual behavior to
    contribute to a certain purpose or idea of a collective goal. This collective
    goal might be a public good or the reduction of negative externalities to a common
    good, e.g., reduction of CO[2] emissions. Purpose-driven tokens introduce a new
    form of public goods creation without requiring traditional intermediaries, e.g.,
    governments. Blockchain networks such as `Ethereum` took the idea of collective
    value creation to the next level by providing a public infrastructure for creating
    an application token with only a few lines of smart contract code, whereby in
    principle any purpose can be incentivized. However, given that operational use
    cases are still limited, this new phenomenon of tech-driven public goods creation
    needs much more research and development \[[13](#chapter05.xhtml#r5_13)\].


    Proof-of-work (`PoW`) is an essential mechanism for the maintenance of public
    goods \[[13](#chapter05.xhtml#r5_13)\]. Even though the collective production
    of public goods can result in positive externalities, it does not necessarily
    exclude other negative externalities, e.g., energy-intense mining process of blockchains.
    When designing purpose-driven tokens as a means to provide public goods, behavioral
    economics methods, e.g., the well-known nudging technique and behavioral game
    theory, provide important tools to steer individuals toward certain actions.


    In the following, we focus on the important problem of token engineering, an emerging
    term defined as the theory, practice, and tools to analyze, design, and verify
    tokenized ecosystems \[[13](#chapter05.xhtml#r5_13)\]. It involves the design
    of a bottom-up token engineering framework along with the design of adequate mechanisms
    for addressing the issues of purpose-driven tokens. Note that mechanism design
    is a subfield of economics that deals with the question of how to incentivize
    everyone to contribute to a collective goal. It is also referred to as “reverse
    game theory” since it starts at the end of the game (i.e., its desirable output)
    and then goes backward when designing the (incentive) mechanism.


    ### Token Engineering DAO Framework for Society 5.0

