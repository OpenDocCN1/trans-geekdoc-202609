- fmt: '

    Ethereum is currently the second-most popular public blockchain after Bitcoin.
    It has been developed by the Ethereum Foundation, a Swiss non-profit organization,
    with contributions from all over the world. Ethereum has its own cryptocurrency
    called “Ether,” which provides the primary form of liquidity allowing for exchange
    of value across the network. Ether also provides the mechanism for paying and
    earning transaction fees that arise from supporting and using the network. Like
    Bitcoin, Ether has been the subject of speculation witnessing wide fluctuations.
    Ethereum is well suited for developing DApps that need to be built quickly and
    interact efficiently and securely via the blockchain platform. Similar to Bitcoin,
    Ethereum uses a PoW consensus method for authenticating transactions and proving
    the achievement of a certain amount of work. The hashing algorithm used by the
    PoW mechanism is called “Ethash.” Different from Bitcoin, Ethereum developers
    expect to replace PoW with a so-called “proof-of-stake” (PoS) consensus. PoS will
    require Ether miners to hold some amount of Ether, which will be forfeited if
    the miner attempts to attack the blockchain network. The Ethereum platform is
    often referred to as a “Turing-complete Ethereum virtual machine (EVM)” built
    on top of the underlying blockchain. Turing-completeness means that any system
    or programming language is able to compute anything computable, provided it has
    enough resources. Note that the EVM requires a small amount of fee for executing
    transactions. These fees are called “gas,” and the required amount of gas depends
    on the size of a given instruction. The longer the instruction, the more gas is
    required.


    Whereas the Bitcoin blockchain simply contains a list of transactions, Ethereum’s
    basic unit is the “account.” The Ethereum blockchain tracks the state of every
    account, whereby all state transitions are transfers of value and information
    between accounts. The account concept is considered an essential component and
    data model of the Ethereum blockchain because it is vital for a user to interact
    with the Ethereum network via transactions. Accounts represent the identities
    of external agents (e.g., human or automated agents, mining nodes). Accounts use
    public key cryptography to sign each transaction such that the EVM can securely
    validate the identity of the sender of the transaction.


    Beside C++, Ethereum supports several programming languages based on JavaScript
    and Python (e.g., Solidity, Serpent, Mutan, or LLL), whereby Solidity is the most
    popular language for writing so-called ‘smart contracts. A smart contract is an
    agreement that runs exactly as programmed without any third-party interference.
    It uses its own arbitrary rules of ownership, transaction formats, and state-transition
    logic. Each method of a smart contract can be invoked via either a transaction
    or another method. Smart contracts enable the realization of DApps, which may
    look exactly the same as conventional applications with regard to application
    programming interface (API), though the centralized backend services are replaced
    with smart contracts running on the decentralized Ethereum network without relying
    on any central servers. Interesting examples of existent DApps include Augur (a
    decentralized prediction market), Weifund (an open platform for crowdfunding),
    Golem (supercomputing), and Ethlance (decentralized job market platform), among
    others. To provide an effective means of communications between DApps, Ethereum
    uses the Whisper P2P protocol, a fully decentralized middleware for secret messaging
    and digital cryptography. Whisper supports the creation of confidential communication
    routes without the need for a trusted third party. It builds on a peer sampling
    service that takes into account network limitations such as network address translation
    (NAT) and firewalls. In general, any centralized service may be converted into
    a DApp by using the Ethereum blockchain.


    ### Decentralized Autonomous Organizations (DAOs)


    The most remarkable thing about cryptocurrencies and blockchain might be how they
    enable people and organizations on a global level, all acting in their own interest,
    to create something of immense shared value. Many observers assert that this is
    a real alternative to current companies. The decentralization, crowd-based technologies
    of cryptocurrencies, distributed ledgers, distributed consensus, and smart contracts
    provide the possibility to fundamentally change the way people organize their
    affairs and offer a new paradigm for enterprise design. Two recent efforts to
    substitute a crowd for a company are blockchain technology and DAOs. DAOs are
    decentralized organizations without a central authority or leader. They operate
    on a programming code that is encoded on the Ethereum blockchain. Like the blockchain,
    the code of a DAO moves away from traditional organizations by removing the need
    for centralized control. Not even the original developers of the DAO have any
    extra authority because it runs independently without any human intervention.
    It may be funded by a group of individuals who cover its basic costs and give
    the funders voting rights rather than any kind of ownership or equity shares.
    This creates an autonomous and transparent system that will continue on the network
    for as long as it provides a useful service to its customers.


    A successful example of deploying the DAO concept for automated smart contract
    operation is Storj, which is a decentralized, secure, private, and encrypted cloud
    storage platform that may be used as an alternative to centralized storage providers
    like Dropbox or Google Drive. A DAO may be funded by a group of individuals who
    cover its basic costs, giving the funders voting rights rather than any kind of
    ownership or equity shares. This creates an autonomous and transparent system
    that will continue on the network for as long as it provides a useful service
    for its customers. DAOs exist as open-source, distributed software that executes
    smart contracts and works according to specified governance rules and guidelines.
    Buterin described the ideal of a DAO on the Ethereum Blog as follows: “It is an
    entity that lives on the Internet and exists autonomously, but also heavily relies
    on hiring individuals to perform certain tasks that the automation itself cannot
    do.” Unlike AI-based agents that are completely autonomous, a DAO still requires
    heavy involvement from humans specifically interacting according to a protocol
    defined by the DAO to operate. For illustrating the distinction between a DAO
    and AI, [Fig. 2.2](#chapter02.xhtml#f2_2) shows a quadrant chart that classifies
    DAOs, AI, traditional organizations as well as robots, which have been widely
    deployed in assembly lines among others, with regard to automation and humans
    involved at their edges and center. We will elaborate on how this particular feature
    of DAOs (i.e., automation at the center and humans at the edges) can be exploited
    for decentralizing the Tactile Internet in “Decentralizing the Tactile Internet”
    section. Toward this end, we also briefly note that according to Buterin a DAO
    is non-profit, though one can make money in a DAO, not by providing investment
    into the DAO itself but by participating in its ecosystem (e.g., via membership).


    ![FIGURE 2.2 DAOs versus artificial intelligence, traditional organizations, and
    robots (widely deployed in assembly lines, among others): Automation and humans
    involved at their edges and center. (From Ethereum blog.)](images/fig2_2.jpg)


    [FIGURE 2.2](#chapter02.xhtml#b02fig2_2) DAOs versus artificial intelligence,
    traditional organizations, and robots (widely deployed in assembly lines, among
    others): Automation and humans involved at their edges and center. (From Ethereum
    blog.)


    For convenience, [Table 2.2](#chapter02.xhtml#t2_2) summarizes the technical details
    of our comparison of Bitcoin and Ethereum blockchains.

