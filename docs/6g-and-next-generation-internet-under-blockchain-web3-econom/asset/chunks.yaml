    我们将提出的链上预言机在多人 `N`-玩家信任游戏中的性能，与传统的双人基准实验进行了对比。为此，我们邀请了同样的两位之前玩过经典双人信任游戏的学生，并要求他们再次玩游戏，即在没有任何观察者的情况下进行。接着，我们邀请他们在有两个观察者存在的情况下玩游戏。这两名玩家被告知他们的账户与忠诚奖励积分相关，如果他们诚实行为，积分将会增加；否则，他们将受到惩罚并失去
    1 个忠诚积分。双方玩家都清楚，每积累 10 个忠诚积分将获得 1 个 Ether。此外，他们被通知决策将由两个观察者做出，观察者将监控他们的在线交易以做出独立的奖励/惩罚决定。所有四名参与者通过互联网匿名进行互动。


    图 4.4 比较了无观察者的双人信任游戏与有观察者的四人信任游戏的平均社会效率。该图清楚地证明了对于所有的 `D` 取值，观察者的存在对社会效率的积极影响。请注意，在有观察者的情况下，瞬时社会效率对于所有
    `D` 取值都达到了最大 100%，而在双人信任游戏中，这需要全额存款 `D` = `X` Ether 才能实现。至于有无观察者情况下可实现的归一化互惠性，情况类似，如图
    4.5 所示。然而，虽然观察者的存在有助于将平均（及瞬时）归一化互惠性一致保持在 80%以上（相比之下，图 4.2 中低于 80%），但仍有进一步提高的空间，特别是对于
    `0 ≤ D < X`。


    ![图 4.4 无观察者的双人信任游戏与有观察者的四人信任游戏相对于存款 d = {0, 2, 5, x} ether 的平均社会效率（显示从最小到最大的测量得分区间）。](img/fig4_4.jpg)


    图 4.4 无观察者的双人信任游戏与有观察者的四人信任游戏相对于存款 d = {0, 2, 5*, x*} ether 的平均社会效率（显示从最小到最大的测量得分区间）。


    ![图 4.5 无观察者的双人信任游戏与有观察者的四人信任游戏相对于存款 d = {0, 2, 5, x} ether 的平均归一化互惠性 q/p（显示从最小到最大的测量得分区间）。](img/fig4_5.jpg)


    图 4.5 无观察者的双人信任游戏与有观察者的四人信任游戏相对于存款 d = {0, 2, 5*, x*} ether 的平均归一化互惠性 q/p（显示从最小到最大的测量得分区间）。


    # 机器人经济：使用说服性机器人进行多人信任游戏


    ### 机器人经济：核心原则


    许多研究表明，机器人的物理存在有利于说服力、好感度和信任度等多种社会互动元素。因此，利用社会机器人的这些有利特性是增强信任游戏性能的一种前景良好的解决方案。与人类操作员连接的社会机器人形成了一个实体，创造了人与机器人沉浸式共存的新范式，其中说服性机器人旨在通过社会影响改变用户的行为。重要的是，这些机器人与其说是工具，不如不如说是伙伴，它们在社会环境中的说服作用主要是以人为中心的
    [17]。


    最近，在[18]中，一项针对五名参与者的实验性试点研究通过以`绿须巫 (WoZ)` 方式操作（即由人员远程控制机器人）的人形机器人，将信任游戏从原始的人与人语境调整到社会人机交互（sHRI）设置。获得的结果表明，玩
    sHRI 信任游戏的人遵循与人类信任模型非常相似的人机信任模型。然而，由于缺乏人类常见的`社交线索`（例如面部表情或手势），这些线索通常会影响对信任度的初始评估，几乎所有参与者最初的投入金额较低，并在通过社会经验积极探索机器人的行为和信任度后增加了投入金额。


    接下来，我们关注新兴的`机器人经济（robonomics）`领域，该领域研究区块链技术对 sHRI、行为经济学、行为博弈论以及加密货币（货币和代币）对机器人融入人类社会的社会技术影响
    [19]。机器人经济涉及说服性机器人，其中物理或虚拟机器人代理通过心理奖励以及实物奖励，作为人类行为修正的执行者或监督者。在最近的一项探索性 sHRI 研究[20]中，比较了十种多模态`说服策略`在社会机器人试图影响人类行为方面的有效性。实验表明，两种特定的说服策略——情感策略和逻辑策略——实现了最高的说服力和信任度。


    ### 说服性机器人策略


    与[21]类似，我们开发了一个`群智巫 (CoZ)`平台，让观察者能够远程控制放置在受托人面前软银社会机器人 Pepper 的手势，并通过基于 Web 的文本转语音翻译进行实时对话。CoZ
    用户界面使用 Django Web 服务器构建。受托人可以通过语音和 Pepper 的触控平板板与 Pepper 通信。为了支持语音通信，我们实现了一个基于
    Web 的语音转文本工具。当从语音中提取文本时，受托人可以在 Pepper 的平板板上看到他的消息以进行验证。接着，语音转文本函数调用另一个函数为主消息（提取的文本）添加额外字段，包括序列
    ID、发送者 ID、消息类型和时间，以便在 Django 服务器上区分这些消息。被调用的函数执行封化过程，并通过 OOCSI 中间件将消息发送到 Django
    服务器。


    在我们开发的 CoZ 系统中，有两种消息：信息消息和控制消息。信息消息由观察者创建。此类消息通过 Pepper 组播给所有观察者和受托人以更新他们，但不包括信任者。受托人可以在
    Pepper 的平板板上看到所有信息消息。此外，Pepper 使用文本转语音功能将观察者的消息传输给受托人。控制消息用于 CoZ 架构的重要功能，例如在 Pepper
    上执行手势。CoZ 界面调用 JavaScript 方法来调用 Django 服务器上的一个新事件。被调用的方法设置了所有相关关节的角度以及 Pepper
    眼睛的发光二极管（LED）颜色。由于两个或多个观察者可能同时按下相同或不同的社交线索按钮，Django 服务器实现了一个队列来同步所有发出的命令。当 Pepper
    正在执行手势时，Django 服务器将下一个手势放入队列并连续发送给 Pepper。


    此外，我们的 CoZ 用户界面提供了一个区域，观察者可以通过 Pepper 的眼睛观察受托人的环境。为了实现这一部分，我们使用了 `OpenCV`。


