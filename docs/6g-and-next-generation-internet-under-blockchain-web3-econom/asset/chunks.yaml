- fmt: '

    One of the fundamental challenges of object identification in IoT stems from the
    traditional domain name system (DNS). Typically, DNS is managed in centralized
    modules and, thus, may cause large-scale failures as a result of unilateral advanced
    persistent threat (APT) attacks as well as zone file synchronization delays in
    larger systems. Clearly, a more robust and distributed name management system
    is needed that supports the smooth evolution of DNS and renders it more efficient
    for IoT and the future Internet in general. Toward this end, a decentralized blockchain-based
    domain name system called “DNSLedger” was introduced by Duan et al. \[[16](#chapter02.xhtml#r2_16)\].
    To rebuild the hierarchical structure of DNS, `DNSLedger` contains two kinds of
    blockchain: (i) a single root chain that stores all the top-level domain information
    and (ii) multiple top-level domain (TLD) chains, each responsible for the information
    about its respective domain name. In `DNSLedger`, servers of domain names act
    as blockchain nodes, while each `TLD` chain may select one or more servers to
    join the root chain. `DNSLedger` clients may execute common DNS functions such
    as domain name lookup, application, and modification.


    Many of the aforementioned studies considered Ethereum as the blockchain of choice.
    It was shown that fully distributed Ethereum architectures are able to enhance
    both robustness and security. Furthermore, a gateway-oriented design approach
    was often applied to offload computationally intensive tasks from low-power, resource-constrained
    IoT end devices onto an intermediate gateway and, thus, enable them to access
    the Ethereum blockchain network. Also, it was shown that the block arrival rate
    does not deteriorate much by the increased latency and reduced bandwidth of WiFi
    access links.


    Despite the recent progress, the salient features that set Ethereum aside from
    other blockchains (see “Ethereum versus Bitcoin Blockchains” section) remain to
    be explored in more depth, including their symbiosis with other emerging key technologies
    such as AI and robots as well as decentralized cloud computing solutions known
    as “edge computing.”


    ### Blockchain-Enabled Edge Computing

    Despite the recent progress, the salient features that set Ethereum aside from
    other blockchains (see “Ethereum versus Bitcoin Blockchains” section) remain to
    be explored in more depth, including their symbiosis with other emerging key technologies
    such as AI and robots as well as decentralized cloud computing solutions known
    as “edge computing.”


    A question of particular interest hereby is how decentralized mechanisms may be
    leveraged to let, which have not been entertained in \[[8](#chapter02.xhtml#r2_8)\].
    One of the critical challenges in cloud computing is the end-to-end responsiveness.
    To address this challenge, multi-access edge computing (`MEC`) is proposed, which
    is a trusted, resource-rich computer or cluster of computers nearby. According
    to the white paper published by ETSI, `MEC` is considered a key emerging technology.
    In light of the aforementioned arguments, the integration of blockchain and edge
    computing into one unified entity becomes a natural trend. On one hand, by incorporating
    blockchain into the edge computing network, the system can provide reliable access
    and control of the network. On the other hand, edge computing enables blockchain
    storage and mining from power-limited devices. Furthermore, computation at the
    edges enable scalable storage and computation \[[17](#chapter02.xhtml#r2_17)\].


    Several recent studies on blockchain and edge computing have been carried out.
    In \[[18](#chapter02.xhtml#r2_18)\], resource-constrained IoT devices were released
    from computation-intensive tasks by offloading consensus processes and data-processing
    tasks onto more powerful edge computing resources. The proposed `EdgeChain` was
    built on the Ethereum platform and uses smart contracts to monitor and regulate
    the behavior of IoT devices. Another blockchain-enabled computation offloading
    scheme for IoT with edge computing capabilities, called `BeCome`, was proposed
    in \[[19](#chapter02.xhtml#r2_19)\]. The authors of this study aimed at decreasing
    the task offloading time and energy consumption of edge computing devices while
    achieving load balancing and data integrity.


    The study by Zhaofeng et al. \[[20](#chapter02.xhtml#r2_20)\\] proposed a blockchain-based
    trusted data management scheme called `BlockTDM` for edge computing to solve the
    data trust and security problems in an edge computing environment. Specifically,
    the authors proposed a flexible and configurable blockchain architecture that
    includes a mutual authentication protocol, flexible consensus, smart contract,
    block and transaction data management as well blockchain node management and deployment.
    The `BlockTDM` scheme is able to support matrix-based multichannel data segment
    and isolation for sensitive or privacy data protection. Moreover, the authors
    designed user-defined sensitive data encryption before the transaction payload
    is stored in the blockchain system. They implemented a conditional access and
    decryption query of the protected blockchain data and transactions through an
    appropriate smart contract. Their analysis and evaluation show that the proposed
    `BlockTDM` scheme provides a general, flexible, and configurable blockchain-based
    paradigm for trusted data management with high credibility.


    In summary, blockchain-enabled edge computing has become an important concept
    that leverages decentralized management and distributed services to meet the security,
    scalability, and performance requirements of next-generation of communications
    networks, as discussed in technically greater detail in “Decentralizing the Tactile
    Internet.”


    ## THE IEEE P1918.1 TACTILE INTERNET


    In this section, we give a brief overview of the basic concepts, features, structure,
    and taxonomy of the Tactile Internet. Subsequently, some of the typical Tactile
    Internet applications and network infrastructure requirements are presented in
    greater detail.


    ### The Tactile Internet: Key Principles

