    Robonomics is a recently emerging sociotechnical field of interdisciplinary research
    that integrates behavioral economics with advanced blockchain technologies and
    persuasive robotics. Given its prominent role in behavioral economics and the
    relevance of trust in blockchains, we focused on the trust game, including its
    networked multiplayer extension. We experimentally demonstrated the beneficial
    impact of the blockchain mechanisms `deposit` and `on-chaining oracle` on improving
    both social efficiency and reciprocity significantly. Our experimental results
    show that the presence of third parties such as human observers and in particular
    social robots play an important role in a blockchain-enabled trust game. While
    the trust game’s central experimenter may be easily replaced with our presented
    `experimenter smart contract`, the peer pressure executed by `on-chaining oracles`
    and especially the embodied communications enabled by persuasive robots were shown
    to have a potentially greater social impact than monetary incentives such as `deposit`,
    opening up new research avenues for future work.


