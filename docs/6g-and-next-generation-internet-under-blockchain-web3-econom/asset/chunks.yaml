    Oracle data sources can range from (*i*) `software oracles`, where data comes
    from online sources (e.g., online web servers or database), (*ii*) `hardware oracles,`
    where data comes from the physical world (e.g., IoT devices, robots), and (*iii*)
    `human oracles,` in which an individual with specialized knowledge/skills in a
    particular field can play the role of the oracle. They can research and verify
    the authenticity of information from various sources and translate that information
    into smart contracts. Since human oracles can verify their identity using cryptography,
    the possibility of a fraudster faking their identity and providing corrupted data
    is relatively very low.


    Direction of information means the way information flows, i.e., from or to external
    resources with respect to the initiator of the data flow. Toward this end, there
    are four combinations of these options: (*i*) `pull-based inbound oracle,` when
    the on-chain component requests the off-chain state from an off-chain component,
    (*ii*) `pull-based outbound oracle,` when the off-chain component retrieves the
    on-chain state from an on-chain component, (*iii*) `push-based inbound oracle,`
    when the off-chain component sends the off-chain state to the on-chain component,
    (*iv*) `push-based outbound oracle,` when the on-chain component sends the off-chain
    state to an off-chain component.


    Further, there is the concept of trust that can be centralized or decentralized.
    `Centralized oracles` are efficient but they can be risky because a single entity
    provides information, controls the oracles, and a failure makes the contracts
    less resilient to vulnerabilities and attacks. In contrast, `decentralized oracles`
    (i.e., consensus-based oracles) increase the reliability of the information provided
    to smart contracts by querying multiple resources. It should be noted that an
    oracle is considered decentralized if it is permissionless such that users can
    join or leave, and every user has equal rights [[41](#chapter01.xhtml#r1_41)].`.
    Finally, oracles design patterns are defined as (*i*) `request-response,` when
    the data space is huge and can be implemented as on-chain smart contracts and
    initiated on-chain or off-chain oracles for monitoring, retrieving, and returning
    data, (*ii*) `publish-subscribe,` when the data is expected to change, e.g., really
    simple syndication (RSS) feeds, and (*iii*) `immediate read,` when the data is
    required for an immediate decision.


    There exist many commercial and open-source tools that implement inbound oracles.
    `Orisi`


    `Reality Keys` provides a combination of both automated and human-driven pull-based
    inbound oracles [[42](#chapter01.xhtml#r1_42)]. `Chainlink`


    Blockchain inbound oracles have also been considered in a number of research works.
    Xu et al. introduce the concept of `validation oracles`, namely trusted third-party
    operators (either automatic or human) that act as inbound oracles [[44](#chapter01.xhtml#r1_44)].
    The authors distinguish between internal ones, periodically transmitting externally
    verified data to the blockchain, and external ones, operating as trusted external
    validators of transactions based on information that is external to the blockchain.
    According to our scheme, we see that the former is push-based and the latter is
    pull-based. Among the pioneering research works in the field of oracles is `ASTRAEA
    introduced by Adler et al. as a decentralized pull-based inbound oracle service
    [[45](#chapter01.xhtml#r1_45)]. The implementation provides a voting game, which
    decides the truth or inaccuracy of propositions. Players can be voters or certifiers.
    While certifiers play a role in cases with the requirement for high accuracy,
    voters are utilized for low-risk/low-reward roles. Zhang et al. present `Town
    Crier`, a push-based inbound oracle that acts like a data-feed system connecting
    a blockchain with a back-end that scrapes secure websites [[46](#chapter01.xhtml#r1_46)].


    More interestingly, Heiss et al. provide a set of key requirements for trustworthy
    data on-chaining, explaining the challenges and the solutions for them [[47](#chapter01.xhtml#r1_47)].
    They argue that in addition to safety and liveness as the characteristics of distributed
    systems, truthfulness is necessary as it prevents the execution of blockchain
    state transition from untruthful data provisioning. Based on these properties.
    Challenges are defined for each of them as availability, correctness, and incentive
    compatibility. Incentive compatibility consists of two key characteristics: (i)
    attributability referred to as mapping data to the source provider, and with respect
    to the behavior, the data source can be rewarded or penalized, and (ii) accountability
    defined as depositing stake before providing data, and upon the truthful data
    provisioning, it is paid back. Correctness consists of authenticity and integrity
    such that the former deals with approving the data source and the latter shows
    the data should become untampered during the transition, respectively. Finally,
    liveness refers to availability and accessibility such that the former implies
    that the availability of the system should be as good as of its least available
    component i.e., the outage should be kept minimum. The latter means that data
    must be accessible at any time.


    ### Token Engineering


    Tokens have emerged with the introduction of `Web3` [[34](#chapter01.xhtml#r1_34)].
    While Web1 allowed everyone to share ideas and Web2 allowed communities to form
    and discuss those ideas, Web3 enables those communities to leverage financial
    capital and go from discussions to tangible action. At their core, tokens are
    entries in distributed ledgers that are assigned to blockchain accounts and for
    which transactions require authorization, thereby authenticity and preventing
    modification and tampering without consent. Tokens are designed in a customized
    way by using a token template that can be extended or instantiated. Tokens can
    be understood as an asset that resides on the blockchain, which can be stored
    or managed using Ethereum addresses and special smart contracts. There are various
    types of tokens that can be built on Ethereum, usually used in DApps and followed
    an existing standard. The most popular tokens standards are described below:


    *   `ERC-20 Standard`

    *   `ERC-721 Standard`

    *   `ERC-1155 Standard`


    ## FROM INDUSTRY 4.0 TOWARD SOCIETY 5.0


    ### Cyber-Physical-Social Systems (CPSS)


    Smart factories under Industry 4.0 have several benefits such as optimal resource
    handling, but also imply minimum human intervention in manufacturing. When human
    beings are functionally integrated into a cyber-physical-social (CPS) at the social,
    cognitive, and physical levels, it becomes a so-called cyber-physical-social systems
    (CPSS), whose members may engage in CPS behaviors that eventually enable metahuman
    beings with diverse types of superhuman capabilities. CPSS belongs to the family
    of future techno-social systems that by design still require heavy involvement
    from humans at the network edge instead of automating them away. For a comprehensive
    survey of the state of the art of CPSS, we refer the interested reader to [[49](#chapter01.xhtml#r1_49)].


    ### Industry 5.0

