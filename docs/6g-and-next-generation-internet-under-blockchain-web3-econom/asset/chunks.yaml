- fmt: "\nSaad et al. `[[6](#chapter04.xhtml#r4_6)]` observed that the ongoing deployment\
    \ of fifth generation (5G) cellular systems is exposing their inherent limitations\
    \ compared to the original premise of 5G as an enabler for the Internet of Everything\
    \ (IoE). They argue that 6G should not only explore more spectrum at high-frequency\
    \ bands but, more importantly, converge driving technological trends. Among others,\
    \ they claim that there will be the following three driving applications behind\
    \ 6G: \n- (*i*) `blockchain` and distributed ledger technologies,\n- (*ii*) `connected\
    \ robotics` and `autonomous systems`,\n- (*iii*) `wireless brain-computer interaction`\
    \ (a subclass of human-machine interaction). \n\nIn fact, in 6G, there is a strong\
    \ notion that the nature of mobile terminals will change, whereby intelligent\
    \ mobile robots are anticipated to play a more important role `[[7](#chapter04.xhtml#r4_7)]`.\
    \ More specifically, David and Berndt `[[8](#chapter04.xhtml#r4_8)]` argue that\
    \ 6G services that could provide human users with good advice would certainly\
    \ be appreciated. According to the world’s first 6G white paper published by the\
    \ 6Genesis Flagship Program (6GFP) in September 2019, 6G will become more human-centered\
    \ than 5G, which primarily focused on industry verticals.\n\nThis brief review\
    \ of the 6G vision shows that `blockchain` technologies and robots are anticipated\
    \ to play a central role in future mobile networks, which will become more human-centered\
    \ than previous generations of cellular networks. Advanced `blockchain` technologies\
    \ such as oracles that enable the on-chaining of blockchain-external off-chain\
    \ information stemming from human users hold promise to leverage also on human\
    \ intelligence rather than machine learning only. Similarly, intelligent mobile\
    \ robots interacting with human users appear a promising solution to not only\
    \ give physical and/or emotional assistance, but also to nudge human behavior\
    \ by benefitting from persuasive robots.\n\n## Blockchain-Enabled Trust Game\n\
    \nIn this section, we first identify open research challenges, then, we develop\
    \ a blockchain-enabled implementation of the classical trust game using `Ethereum`\
    \ and experimentally investigate the beneficial impact of a simple yet effective\
    \ blockchain mechanism known as `deposit` on enhancing both trust and trustworthiness\
    \ as well as increasing social efficiency.\n\n### Open Research Challenges\n\n\
    The use of decentralized `blockchain` technologies for the trust game should tackle\
    \ the following research challenges:\n\n- **Social Efficiency:** Recall from above\
    \ that the trust game allows the study of social capital for achieving economic\
    \ growth. Toward this end, the closely related term `social efficiency` plays\
    \ an important role. Social efficiency is defined as the optimal distribution\
    \ of resources in society, taking into account so-called externalities as well.\
    \ In general, an externality is the cost or benefit that affects third parties\
    \ other than the voluntary exchange between a pair of producer and consumer. We\
    \ will study the impact of externalities below, when we extend the classical trust\
    \ game to multiplayer games. We measure social efficiency as the ratio of the\
    \ achieved total payoff of both trustor and trustee and the maximum achievable\
    \ total payoff, which is equal to `X`(`K` + 1). A social efficiency of 100% is\
    \ achieved if the trustor sends her/his full endowment `X` (i.e., `p` = 1), which\
    \ is then multiplied by `K`, and the trustee reciprocates by sending back the\
    \ received amount `XK` fully or in part, translating into a total payoff of `q`\
    \ · `XK` + (1 − `q`) · `XK` + `X` = `X`(`K` + 1). Note that maximizing the total\
    \ payoffs requires to set `p` = 1 for a given value of `K`, though `q` may be\
    \ set to any arbitrary value. The parameter `q`, however, plays an important role\
    \ in controlling the (equal or unequal) distribution of the total payoffs between\
    \ trustor and trustee, as discussed in more detail shortly. Conversely, if the\
    \ trustor decides to send nothing (i.e., `p` = 0) due to the lack of trust (on\
    \ the trustor’s side) and/or lack of trustworthiness (on the trustee’s side),\
    \ both are left with their endowment `X` and the social efficiency equals `2*X/X(*K*\
    \ + 1) = 2/*(*K* + 1)`. How to improve social efficiency in an equitable fashion\
    \ in a blockchain-enabled trust game is an important research challenge.\n\n-\
    \ **Trust and Trustworthiness in N-Player Trust Game:** In the past, games of\
    \ trust have been limited to two players. Abbass et al. `[[9](#chapter04.xhtml#r4_9)]`\
    \ introduced a new `N`-player trust game that generalizes the concept of trust,\
    \ which is normally modeled as a sequential two-player game to a population of\
    \ multiple players that can play the game concurrently. According to Abbass et\
    \ al. `[[9](#chapter04.xhtml#r4_9)]` evolutionary game theory shows that a society\
    \ with no untrustworthy individuals would yield maximum wealth to both the society\
    \ as a whole and the individual in the long run. However, when the initial population\
    \ consists of even the slightest number of untrustworthy individuals, the society\
    \ converges to zero trustors. The proposed `N`-player trust game shows that the\
    \ promotion of trust is an uneasy task, despite the fact that a combination of\
    \ trustors and trustworthy trustees is the most rational and optimal social state.\n\
    \n    It’s important to note that the `N`-player trust game in `[[9](#chapter04.xhtml#r4_9)]`\
    \ was played in an unstructured environment, i.e., the population was not structured\
    \ in any specific spatial topology or social network. Chica et al. `[[10](#chapter04.xhtml#r4_10)]`\
    \ investigated whether a `networked` version of the `N`-player trust game would\
    \ promote higher levels of trust and global net wealth (i.e., total payoffs) in\
    \ the population than that of an unstructured population. To do so, players were\
    \ mapped to a spatial network structure, which restricts their interactions and\
    \ cooperation with local neighborhoods. Unlike Abbas et al. `[[9](#chapter04.xhtml#r4_9)]`,\
    \ where the existence of a single untrustworthy individual would eliminate trust\
    \ completely and lead to zero global net wealth, Chica et al. `[[10](#chapter04.xhtml#r4_10)]`\
    \ discovered the importance of establishing network structures for promoting trust\
    \ and global net wealth in the `N`-player trust game in that trust can be promoted\
    \ despite a substantial number of untrustworthy individuals in the initial population.\
    \ Clearly, the development of appropriate communication network solutions for\
    \ achieving efficient cooperation and coordination among players with different\
    \ strategies in a networked `N`-player trust game represents an interesting research\
    \ challenge.\n\n- **Reward & Penalty Mechanism Design:** For the implementation\
    \ of desirable social goals, the theory of `mechanism design` plays an important\
    \ role. According to Maskin `[[11](#chapter04.xhtml#r4_11)]`, the theory of mechanism\
    \ design can be thought of as the “engineering” side of economic theory. While\
    \ the economic theorist wants to explain or forecast the social outcomes of mechanisms,\
    \ the mechanism design theory reverses the direction of inquiry by identifying\
    \ first the social goal and then asking whether or not an appropriate mechanism\
    \ could be designed to attain that goal. And if the answer is yes, what form that\
    \ mechanism might take, whereby a mechanism may be an institution, procedure,\
    \ or game for determining desirable outcomes.\n"
