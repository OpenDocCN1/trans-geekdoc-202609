    2019 年 9 月，全球首份 6G 白皮书发布，这是首届 6G 无线峰会的会议成果。该会议于 2019 年 3 月初在芬兰莱维（Levi）举行，来自来自
    29 个国家的近 300 名参与者，其中包括主要的基础设施制造商、运营商、监管机构以及学术界 [21]。白皮书每年将根据年度 6G 无线峰会的结果进行更新。虽然
    5G 的发展主要是为了应对消费者预期的容量增长需求，并实现物联网（IoT）日益增长的重要性，但 6G 需要一种更整体性的方法，涵盖更广泛的群体。此外，6G
    将比 5G 更以人为本，后者主要侧重于工业垂直领域。将人置于未来超智能社会的中心，也是近期新兴的“社会 5.0”概念的核心所在 [22]。


    用于 5G 的许多关键性能指标（KPIs）同样适用于 6G。然而，在 5G 之后（B5G）以及 6G 时代，大多数技术领域的 KPI 再次指向 10 到 100
    倍的增长，尽管从客户的角度来看，价格降低 1000 倍可能是 6G 成功的关键 [23]。注意，降低成本对于为农村和欠发达地区提供连接尤为重要，在这些地区，回传部署的成本是主要的限制。根据
    Yaacoub 和 Alouini [24]，考虑到全球约一半人口住在农村或欠发达地区，提供农村连接代表了 6G 的一个关键挑战和机遇。在其他重要的 KPI
    中，6G 有望成为首个用户峰值吞吐量超过 1 Tbit/s 的无线标准。


    更有趣的是，6G 设想让如远程临场等作为实际旅行替代品的完全全新的服务，通过图形表示（如化身）、可穿戴显示器、移动机器人和无人机、专用处理器以及下一代无线网络的结合来实现。同样，智能手机可能会通过轻量化眼镜被无处不在的
    XR 体验取代，并通过耳机和触觉界面向其他感官提供反馈。此外，鉴于 2030 年数字世界和物理世界将深度纠缠，6G 需要一个嵌入信任的网络。为此，区块链（也称为分布式账本技术
    DLT）由于其能够在不需要任何中央权威的情况下以分布式方式建立和维护信任，可能会在 6G 网络中发挥重要作用。


    ### 区块链与分布式账本技术


    区块链技术的巨大潜力早已从加密世界扩散到普通大众的手中。我们都曾以各种方式听过，它可能是目前任何已知市场（包括现实世界和数字空间）中最具革命性的技术。区块链技术主要是比特币
    [25] 以及许多其他数不胜完的加密货币背后的支撑 [26]。区块链本质上是一个分布式数据库，记录了参与方之间执行并共享的所有交易或数字事件的记录（或公共账本）
    [27]。公共账本中的每笔交易都通过系统中大多数参与者之间的共识进行验证。一旦输入，信息就永远无法删除。区块链包含了对曾经发生过的每一笔交易的确定且可验证的记录。当区块达到特定大小时，它会被赋予时间戳，并通过加密哈希链接到上一个区块，从而形成带有时间戳的区块链（因此得名为区块链），如图图
    1.3


    图 1.3 区块链交易工作流的图形表示。


    区块链技术已成功应用于金融和非金融领域。它有潜力减少我们社会中最重要的经济和监管参与者之一——中间人的角色 [28, 29]。区块链技术最初与去中心化的加密货币比特币相关，因为它是该网络的主要且首个应用（被称为区块链
    1.0 [30]）。然而，除了比特币之外，还有许多其他用例和数百个使用区块链作为平台的不同应用，例如以太坊。


    `Ethereum` 是一种运行在区块链技术上的开放软件平台。其核心是所谓的以太坊虚拟机（`EVM`），它能够执行任意算法复杂度的代码 [31]。以太坊平台不仅可以作为加密货币，还可以允许开发者编写智能合约以及存储在区块链上的代码，这些代码在满足预设条件时执行。以太坊智能合约允许终端用户与下一代去中心化应用（DApps）交互。与后端代码运行在中心化服务器上的传统应用程序不同，DApps
    的服务器-客户端模型是去中心化的。DApps 运行在没有中央权威的区块链网络上，并使用去中心化存储协议。通过使创建应用程序的过程变得简单高效，DApps 可以用于许多其他领域。例如，它们可以实现非金融区块链
    DApps（例如 IoT 设备注册 DApp、基于区块链的数字身份应用）。以太坊和智能合约的兴起标志着区块链 2.0 的到来 [30]。


