  trans: '


    根据 Bradshaw 等人 \[29] 的研究，在 HART（人类辅助机器人技术）等研究挑战中，开发能够让自主系统不仅为人类服务，还能与人类及其他系统协同工作的能力，代表了一项重要的开放问题，即将人类视为智能智能体团队的“成员”，而不是继续将其视为传统的“用户”。在下文中，我们引入并扩展了光无线（FiWi）增强型
    LTE 进阶（LTE-A）异构网络（HetNets）的概念，通过利用 AI 增强的 MEC 能力来实现低往返延迟和低抖动，从而实现本地和非本地远程操作。


    ### 低延迟 FiWi 增强 LTE-A 异构网络


    #### 低延迟 FiWi 增强 LTE-A 异构网络


    FiWi 接入网络也称为“无线光宽带接入网络”（WOBANs），结合了光纤网络的可靠性、稳健性和高容量，以及无线网络的灵活性、无处和成本优势 \[30]。为了提供每用户高达
    200 Mbps 的峰值数据速率并实现完全固移动融合的愿景，将现有的遗留线路和微波回传技术替换为集成的 FiWi 宽带接入网络至关重要。


    Beyranvand 等人 \[31\] 研究了统一以覆盖为中心的 4G 移动网络与以容量为中心的基于数据以太网技术的 FiWi 宽带接入网络（通过光纤回传共享和
    WiFi 卸载能力应对移动数据流量的前所增长）带来的性能收益。我们通过概率分析和验证仿真，评估了 FiWi 增强 LTE-A 异构网络的最大聚合吞吐量、卸载效率，特别是延迟性能，包括各种本地化无纤回传冗余和无线保护技术的积极影响。在研究中，我们特别关注了由于以太网无源光网络（`EPON`）光纤故障导致的光纤回传可靠性问题，以及由于
    WiFi Mesh 节点失败以及空间 WiFi 覆盖限制导致的 WiFi 卸载限制。


    例如，图 2.4 展示了不同 WiFi 卸载率（`WOR`）下，FiWi 增强 LTE-A 异构网络的平均端到端延迟性能与聚合吞吐量的关系，其中 `0 ≤
    WOR ≤ 1` 表示卸载到 WiFi 的移动用户流量百分比。所出的分析和验证仿真结果是在假设均匀流量负载和真实的 LTE-A 及 FiWi 网络配置下，并应用最小（光和无线）跳数路由得到的。更多细节请参考
    \[31]。目前，让我们假设 `EPON` 的可靠性是理想的（即不发生光纤回传故障）。然而，与 `EPON` 不同，WiFi Mesh 网络可能有 `10−6`
    的概率遭受无线服务中断。我们从图 2.4 中观察到，随着 `WOR` 的增加，FiWi 增强 LTE-A 异构网络的吞吐量延迟性能显著提高。具体来说，通过将
    `WOR` 从 `0.1` 改变到 `0.57`，最大可用聚合吞吐量从约 61 Mbps 增加到约 126 Mbps（即最大可用聚合吞吐量增加了一倍多）。更重要的是，进一步增加
    `WOR` 到 `0.9` 并不会导致最大可用聚合吞吐量的再次显著增加，但对于降低平均端到端延迟并使其在广泛流量负载下保持在 `10−3` 秒（1 ms）的极低水平非常有帮助。因此，这一结果表明，通过
    WiFi 从 4G 移动网络卸载大部分数据流量是获得 1 ms 极低延迟的一种前景方法。


    ![FIGURE 2.4 不同 WiFi 卸载率 (WOR) 下平均端到端延迟与聚合吞吐量的关系](img/fig2_4.jpg)


    FIGURE 2.4 不同 WiFi 卸载率 (WOR) 下平均端到端延迟与聚合吞吐量的关系。


    #### AI 增强型 MEC：将 AI 推向边缘


    图 2.5 展示了带有 AI 增强 MEC 服务器的 FiWi 增强 LTE-A 异构网络的通用网络架构。光纤回传由时分或波分复用（`TDM/WDM`）`IEEE
    802.3ah/av` 1/10 Gb/s `EPON` 组成，中心光终端（`OLT`）与远程光网络单元（`ONUs`）之间的典型光纤范围为 20 km。`EPON`
    可能包含多个阶段，每个阶段通过波分分路器和合并器或波复用器和解复用器分开。有不同的 ONU 子集。`ONU` 可以为固定（有线）用户服务。或者，它可以连接到小区网络基站（`BS`）或
    `IEEE 802.11n/ac/s` WLAN Mesh 门户点（`MPP`），分别产生同地的 `ONU-BS` 或 `ONU-MPP`。根据轨迹，移动用户（`MU`）可以通过小区网络或
    WLAN Mesh 前端进行通信，前端由 `ONU-MPPs`、中间 Mesh 点（`MPs`）和 Mesh 接入点（`MAPs`）组成 \[32]。


    ![FIGURE 2.5 用于本地和非本地远程操作的带有人工智能 (AI)-增强 MEC 的基于 FiWi 的触觉互联网架构](img/fig2_5.jpg)


    FIGURE 2.5 用于本地和非本地远程操作的带有人工智能 (AI)-增强 MEC 的基于 FiWi 的触觉互联网架构。


    假设人类操作员（`HOs`）和远程操作机器人（`TORs`）仅通过 WLAN 通信，而不是使用双模式 4G/WiFi 手机的 `MUs`。远程操作在本地或非本地进行，取决于涉及的
    `HO` 和 `TOR` 的距离，如图 2.5](#chapter02.xhtml#f2_5）所示。在本地远程操作中，`HO` 和相应的 `TOR` 关联同一个
    `MAP`，并通过该 `MAP` 交换命令和反馈样本，而不经过光纤回传。相反，如果 `HO` 和 `TOR` 关联不同的 `MAPs`，非本地远程操作通常通过回传
    `EPON` 和中心 `OLT` 进行。尽管最近对利用机器学习进行光通信和网络感兴趣，但为 `HOs` 实现沉浸式透明远程操作体验的边缘智能尚未探索。在 \[32\]中，Maier
    和 Ebrahimzadeh 在我们考虑的网络边缘应用了机器学习，以实现沉浸且无缝的触觉互联网体验。为了实现边缘智能，选定的 `ONU- BS/MPPs`
    配备了 AI 增强 MEC 服务器。这些服务器依赖于位于光无线接口处的计算节点（见图 2.5](#chapter02.xhtml#f2_5））的计算能力来预测反馈路径中的延迟触觉样本。结果是
    `HO` 能够以 1 ms 的粒度实时感知远程任务环境，从而实现更紧密的协作、改进安全控制并提高远程操作系统的可靠性。


