    As the hype of blockchain technology advanced, Blockchain 3.0 aims to popularize
    blockchain-based solutions expanding the traditional sectors (finance, goods transactions,
    and so on) to government, IoT, decentralized AI, supply chain management, smart
    energy, health, data management, and education \[[32](#chapter01.xhtml#r1_32),
    [33](#chapter01.xhtml#r1_33)\]. Therefore, the applications of blockchain have
    evolved to much wider scopes. However, these new applications introduce new features
    to the next-generation platforms including key aspects such as platforms interconnection
    or more advanced smart contracts that provide higher levels of transparency while
    reducing bureaucracy with self-enforcing code. These new technologies, therefore,
    promise more decentralized and spontaneous coordination over the Internet between
    users who do not know or trust each other, often referred to as decentralized
    autonomous organizations (DAO). DAO exists as open-source, distributed software
    for executing smart contracts built within the Ethereum project. DAO is like a
    decentralized organization, except that autonomous software agents (i.e., smart
    contracts) make the decisions, not humans. In a more decentralized setup, the
    governance rules automatically steer behavior with tokenized incentives and disincentives
    \[[34](#chapter01.xhtml#r1_34)\]. In such cases, programmable assets called tokens
    managed by a special smart contract act as governance rules to incentivize and
    steer a network of actors without centralized intermediaries \[[34](#chapter01.xhtml#r1_34)\].
    Further, the tokens issued by the DAO enable their respective holders to vote
    on matters about the development of the organization and make decisions. As a
    result, the decision-taking process is automated and a consensus is reached among
    the participants. For illustration, [Fig. 1.4](#chapter01.xhtml#f1_4) depicts
    the evolution of blockchain technology from Blockchain 1.0 to 3.0.


    ![FIGURE 1.4 Evolution of blockchain technology.](images/fig1_4.jpg)


    [FIGURE 1.4](#chapter01.xhtml#b01fig1_4) Evolution of blockchain technology.


    The introduction of smart contracts to the blockchain has added programmability
    to this disruptive technology and has changed the software ecosystem by removing
    third parties for the administration of (non) business purposes. Although promising,
    smart contracts and blockchain do not have access to the information outside of
    their networks (i.e., off-chain data). The blockchain in fact is an enclosed system
    where interactions are limited to the data available on it. Hence, it is still
    an open practical problem referred to as the “oracle problem” that is defined
    as how real-world data can be transferred into/from the blockchain \[[35](#chapter01.xhtml#r1_35)\].
    Toward this end, oracles (also known as data feeds) act as trusted third-party
    services that send and verify external information and submit it to smart contracts
    to trigger state changes in the blockchain \[[36](#chapter01.xhtml#r1_36)\]. Oracles
    may not only relay information to the smart contracts but also send it to external
    resources. They are simply contracts on the blockchain for serving data requests
    by other contracts. Without oracles, smart contracts would have limited connectivity;
    hence, they are vital for the blockchain ecosystem due to broadening the scope
    of smart contracts operation.


    ## ADVANCED BLOCKCHAIN TECHNOLOGIES: PRIOR ART AND RECENT PROGRESS


    In this section, we review prior research work related to advanced blockchain
    technologies and, after classifying them into three separate yet interdependent
    categories, we discuss each one in greater detail. The main branches of our classification
    are DAO, blockchain oracles, and token engineering.


    ### DAO


    The last few years have seen the emergence of DAO in the field of blockchain as
    a new form for running organizations on the Internet. DAO is novel socio-technical
    systems that enable a new way of online coordination and decision-making. DAO
    as a new form of online governance are collections of smart contracts deployed
    on a blockchain platform that intercede groups of members (humans or machines).
    In short, DAO may be defined as a group of members with common goals that join
    under a blockchain infrastructure that enforces a set of shared rules. Typically,
    the members of a DAO are registered, each with a unique address. They also have
    a number of governance tokens linked to that address, which are usually required
    for participation and may play a role in the DAO decision-making process. It is
    also common that DAO manage resources, e.g., cryptocurrencies, whereby DAO members
    may decide how to allocate them through a decision system.


    The first remarkable DAO was `The DAO`, launched in April 2016 by a group of programmers.
    The DAO was a sort of hedge fund, in which contributors could directly vote for
    projects. In June 2016, due to an error in `The DAO` code, an attacker robbed
    a large part of its funds \[[37](#chapter01.xhtml#r1_37)\]. Another example of
    DAO on decentralized finance (DeFi) is `MakerDAO`


    The main platforms are:


    - **Aragon**: Aragon is by far the largest DAO platform. Aragon provides a static
    template to make one’s own DAO, but it also allows one to create customized one.
    The template sets a special token, which is used by a small group of members to
    take decisions, like accepting new members. The other key feature that Aragon
    introduces are permissions, which serve as an access control system intended to
    safely connect apps and entities (users or other apps) together. Initially, the
    DAO creator has the permissions to manage it, but usually, the creator transfers
    those permissions to the voting app such that the DAO is managed through voting.

    - **DAOstack**: Unlike Aragon, DAOstack platform does not offer many customizations.
    Among others, they currently provide a single decision-making system for all their
    DAOs. This voting system, called `holographic consensus` \[[38](#chapter01.xhtml#r1_38)\],
    aims to solve the problems of scaling a DAO. In holographic consensus, the quorum
    required to approve a proposal can be reduced from absolute majority to relative
    majority if some conditions are met. The most significant condition concerns the
    predictors or stakers, who are not necessarily members of any DAO. Those predictors
    can stake a special token called `GEN` to predict the result of a proposal. If
    stakers are right, they are rewarded, whereas if they fail, they lose their stake.
    Regarding the proposal, if the staked amount reaches a specific limit, then the
    quorum of that proposal will be reduced to a relative majority. As a result, stakers
    help DAO to highlight meaningful proposals and make a profit if their services
    are useful. In practice, this behavior mimics a prediction market \[[39](#chapter01.xhtml#r1_39)\].

    - **Colony**: Colony has been the latest and recently released DAO platform that
    enables the creation of DAO, or “colonies,” as they named them. Colony’s DAO are
    shared by people with common goals and resources to accomplish them, though these
    DAOs can be split into domains or even sub-domains with more specific purposes.


    ### Blockchain Oracles


    Blockchain oracles can be classified depending on a number of different qualities:
    (*i*) *source,* i.e. the origin of data, (*ii*) *direction of information,* i.e.
    inbound or outbound from the viewpoint of the blockchain, (*iii*) *the initiator
    of the data flow,* whether it is push- or pull-based communication, (iv) trust,
    i.e. centralized or decentralized, and (v) design pattern.

