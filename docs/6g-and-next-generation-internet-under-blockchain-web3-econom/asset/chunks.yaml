    Maier 等人 [28]] 提到了将研究重点从 AI 转向智能增强（IA）的重要性，即利用信息技术来增强人类决策。然而需要注意的是，在不确定性增加的动态任务环境和极其复杂的现实场景中，IA
    会变得非常困难。IA 也称为“认知增强”或“机器增强智能”，对于增强人类的创造力、理解力、效率和智能将发挥重要作用。


    ### 基于认知辅助的智能增强


    边缘计算是一种广泛研究的方法，旨在增加众包的效用，它可以通过通过提供认知辅助，引导人类一步步地完成物理任务执行过程。从技术上讲，这可以通过为无技能的 `DAO`
    成员配备增强现实（AR）头设备（例如带有 WiFi 连接的 `HoloLens 2`）来轻松实现，该头设备可以从其最近的 AI 增强型 `MEC` 服务器实时接收工单信息。


    ### HITL 混合增强智能


    人类面对许多问题往往具有高度的不确定性、复杂性和开放性。为了解决此类问题，可以引入人类交互和参与。因此，这催生了用于高级人机协作的 HITL 混合增强智能概念
    [34]]。HITL 混合增强智能定义为一种智能模型，它需要人类交互并允许处理可能无法通过机器学习轻松训练或分类的问题和需求。通常，机器学习在理解非结构化现实环境以及处理不完整信息和复杂的时空相关任务方面优于人脑。因此，机器无法独立完成人类社会中的所有任务。相反，AI
    和人类智能被看作是高度互补的。


    根据 Zheng 等人 [34]]，互联网为 HITL 混合增强智能提供了巨大的创新空间。具体而言，云机器人和 AR 是多机器人协作系统中增强个体智能的增长最快的商业应用之一。HITL
    混合增强智能的主要研究课题之一是开发相关方法，允许机器不仅从海量训练样本中学习，还能从人类知识中学习，以完成高度智能的任务。


    ### 去中心化组织的兴起


    这是为通用人工智能（AGI）提供的一种非常有趣的例子。


    ### 面向人类增强的助推


    扩展人类交互，助推理论的利用。根据 Richard Thaler（这位诺贝尔经济学奖获得者），助推理论可以通过区块链技术影响人类行为。


    ## 挑战与未来工作


    互联网正在不断演进，边缘计算对于实现未来系统具有巨大的潜力。类似的，`5G` 网络将满足触感互联网对严格的延迟和可靠性的需求。Maier 等人 [35]]
    最近概述了通过共享智能在机器人和人类之间实现触感互联网的技术。然而，区块链技术在未来移动网络中的前景广阔。尽管如此，区块链技术在未来移动网络中仍有许多研究问题待解决。


    ## 结论


    在本章中，我们展示了许多 `IoT` 研究利用区块链技术将计算密集型任务从资源受限的设备卸载到中间网关。基于我们对 HART 协作工作的研究，更高层次的 AI
    增强将有助于缩短任务的完成时间。


    ## 备注


    1. SingularityNET 白皮书，“一种下一代智能合约和分布式应用平台，”[`singularitynet.io`](https://singularitynet.io)。


