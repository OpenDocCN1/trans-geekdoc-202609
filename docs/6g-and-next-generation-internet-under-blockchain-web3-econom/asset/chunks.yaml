    Saad 等人 `[6]` 观察到，正在部署的第五代（5G）蜂窝系统正暴露其与 5G 作为万物互联（IoE）赋能者的最初假设相比的内在局限性。他们认为，6G
    不仅应该探索高频段的更多频谱，更重要的是要汇聚驱动技术趋势。其中，他们声称 6G 后方将有以下三大驱动应用：

    - (*i*) `blockchain`与分布式账本技术，

    - (*ii*) `连接机器人`与`自主系统`，

    - (*iii*) `无线脑机交互`（人机交互的一个子类）。


    事实上，在 6G 中，存在一种强烈的观点认为移动终端的性质将发生变化，智能移动机器人预计将发挥更重要的作用 `[7]`。具体来说，David 和 Berndt
    `[8]` 认为，能够为人类用户提供良好建议的 6G 服务无疑将受到欢迎。根据 6Genesis 旗舰计划（6GFP）于 2019 年 9 月发布的全球首份
    6G 白皮书，6G 将比主要关注行业垂直领域的 5G 更具有以人为本的特征。


    这篇关于 6G 愿景的简要回顾显示，`blockchain` 技术和机器人将在未来移动网络中发挥核心作用，这些网络将比前几代蜂窝网络更以人为中心。先进的 `blockchain`
    技术（如能够将来自人类用户的区块链外部离链信息上链的预言机）有望利用人类智能，而不仅仅是机器学习。同样，与人类交互的智能移动机器人也展现出广阔前景。


    ## 区块链驱动的信任游戏


    在本节中，我们首先识别开放的研究挑战，然后开发一种基于区块链的经典信任游戏，并实验性地研究其影响。


    ### 开放的研究挑战


    使用 `blockchain` 技术信任游戏应解决以下研究挑战：


    - **社会效率**：回想上述，信任游戏允许社会资本增长，为此`社会效率` 起着重要作用。社会效率被定义为考虑到外部性的总收益最优分配。通常情况下，外部性是指影响交易双方之外的第三方的成本或利益。当我们把信任游戏扩展到多玩家游戏时，我们将社会效率衡量为信任者和受托者的总收益之比。如果信任者发送了全部资金
    `X`，则实现了 100% 的社会效率，这等于 `X(K + 1)`。请注意的是，最大化总收益要求在给定的 `K` 值下设置 `p = 1`，尽管 `q`
    可以设置为任意值。然而，参数 `q` 在控制信任者和受托者之间相等或不等的收益分配方面起着重要作用。相反，如果信任者决定不发送任何内容（即 `p = 0`），由于缺乏信任（信任者侧）或缺乏信誉（受托者侧），双方都只剩下
    `X`，且社会效率为 `0%`。如何以公平的方式在基于区块链的信任游戏中提高社会效率是一项重要的研究挑战。


    - **多玩家信任游戏中的信任与信誉**：过去，信任游戏限于两个玩家。Abbas 等人 `[9]` 引入了一种新的多玩家信任游戏，将通常建模为双人游戏的信任概念推广到可以同时进行游戏的玩家群体。根据
    Abbas 等人 `[9]`，演化博弈论显示，没有诚实者的社会将为整个社会和个人带来最大的财富。然而，当初始群体即使包含极少的不诚实者时，社会也会收敛于零信任。所提的多玩家信任游戏显示，尽管信任者和信誉者的组合是最理性的社会状态。需要注意的是，`[9]`
    中的多玩家信任游戏是在无结构的环境中进行的，即群体没有任何特定的空间拓扑结构或社交网络。Chica 等人 `[10]` 研究了网络化的多玩家信任游戏是否能比无结构群体产生更高水平的信任和全球财富（即总收益）。为此，玩家被映射到空间网络结构中，这限制了他们与邻域的交互和合作。与
    Abbas 等人 `[9]`（单个不诚实者的存在就会完全消除信任并导致全球财富为零）不同，Chica 等人 `[10]` 发现建立网络结构对于促进信任和全球财富具有性，即使初始群体中存在大量不诚实者，信任也能得到促进。显然，在网络化的多玩家信任游戏中开发适当的网络解决方案以实现不同策略之间的有效合作是一个有趣的挑战。


    - **奖励与惩罚机制设计**：为了实现理想的社会目标，机制设计 理论起着重要作用。根据 Maskin `[11]` 的观点，机制设计理论可以被视为经济理论的“工程”侧。经济学家想要解释或预测机制的结果，而机制设计理论反转了研究方向，首先确定社会目标，然后询问是否可以设计相应的机制来实现该目标。如果是肯定的，那么这种机制可能是何种形式，其中机制可以是制度、程序或用于确定理想结果的游戏。


    '
- fmt: '

    An interesting example of mechanism design is the so-called *altruistic punishment*
    to ensure human cooperation in multiplayer public goods games [[12](#chapter04.xhtml#r4_12)].
    Altruistic punishment means that individuals punish others, even though the punishment
    is costly and yields no material gain. It was experimentally shown that altruistic
    punishment of defectors (i.e., untrustworthy participants) is a key motive for
    cooperation in that cooperation flourishes if altruistic punishment is possible,
    and breaks down if it is ruled out. The design of externalities such as third-party
    punishment and alternative reward mechanisms for incentivizing human cooperation
    in multiplayer public goods games in general and *N*-player trust game in particular
    is of great importance.


    *   **Decentralized Implementation of Economic Experiments:** A widely used experimental
    software for developing and conducting almost any kind of economic experiments,
    including the aforementioned public goods games and our considered trust game,
    is the `Zurich Toolbox for Ready-made Economics (z-Tree)` [[13](#chapter04.xhtml#r4_13)].
    The `z-Tree` software is implemented as a client-server application with a central
    server application for the experimenter, called `z-Tree`, and a remote client
    application for the game participants, called `z-Leaf`. It is available free of
    charge and allows economic experiments to be conducted via the Internet. On the
    downside, however, `z-Tree` does not support peer-to-peer (P2P) communications
    between players, as opposed to a decentralized blockchain-enabled implementation.


    ### Experimenter Smart Contract


    First, we develop a smart contract that replaces the experimenter in the middle
    between trustor and trustee (see [Fig. 4.1](#chapter04.xhtml#f4_1)). The development
    process makes use of the Truffle framework.


    More specifically, in our experimenter contract, we use the following global variables:
    (*i*) `msg.value`, which represents the transaction that is sent, and (*ii*) `msg.sender`,
    which represents the address of the player who has sent the transaction to the
    experimenter smart contract, i.e., trustor or trustee. Both trustor and trustee
    use their Ethereum Externally Owned Account (EOA), which uses public and private
    keys to interact and invoke each function of our experimenter smart contract.
    In the following, we provide a brief overview of the core functions and parameters
    of our experimenter smart contract:


    *   **Function `investFraction()`:** This function allows the trustor to invest
    a portion `p` of her endowment `X`. Once called, it takes the received `msg.value`
    `p` from the trustor, multiplies it by factor `K` using the contract balance,
    and transfers it directly to the trustee’s account. The trustee receives `msg.value`
    · `K`.

    *   **Function `splitFraction()`:** This function allows the trustee to split
    a portion `q` of the received investment from the trustor. Once called, it takes
    the set split amount from the trustee’s account and sends it to the trustor’s
    account.

    *   **Parameter `Onlytrustor` (modifier type):** This modifier is applied to the
    `investFraction()` function. Thus, only the trustor can invoke this function of
    the experimenter smart contract.

    *   **Parameter `Onlytrustee` (modifier type):** This modifier is applied to the
    `splitFraction()` function. Thus, only the trustee can invoke this function of
    the experimenter smart contract.


    We note that after the execution of each function of the experimenter smart contract,
    an event is used to create notifications and saved logs. Events help trace and
    notify both players about the current state of the contract and activities.


    ### Blockchain Mechanism Deposit


    The use of one-way security deposits to provide trust for one party with respect
    to the other is quite common, particularly for the exchange of goods and services
    via e-commerce and crowdsourcing platforms. In the context of blockchains, a deposit
    is an agreement smart contract that defines the arrangement between parties, where
    one party deposits an asset with a third party. An interesting use case of the
    blockchain mechanism deposit can be found in [[14](#chapter04.xhtml#r4_14)]. In
    this paper, the authors propose a new protocol that achieves the fulfillment of
    all the desired properties of a registered electronic Delivery (e-Deliveries)
    service using blockchain. In the proposed protocol, the authors included a deposit
    mechanism with the aim to encourage the sender to avoid dishonest behavior and
    fraud attempts, and also to conclude the exchange in a predefined way following
    the phases of the protocol. The deposit will be returned to the sender if he finishes
    the exchange according to the protocol. In our work, we propose to add an optional
    function `deposit()` to our experimenter smart contract to improve trust and trustworthiness
    between both players. Toward this end, we make the following two modifications:


    *   **Function `deposit()`:** This function allows the trustee to submit an amount
    of `2 ≤ D ≤ X` monetary units (i.e., Ether in our considered case of Ethereum)
    as a deposit to the experimenter smart contract. The deposit is returned to the
    trustee only if a transaction with `q > 0` is completed. Otherwise, with `q` =
    0, the trustee loses the deposit. It should be noted that the aforementioned `Onlytrustee()`
    modifier is also applied to this function.

    *   **Function `splitFraction()`:** We make a modification to this function to
    allow the trustee to split the received amount (i.e., `q > 0`). Otherwise, the
    transaction is rejected until the trustee splits the received amount. Once this
    happens, the function transfers the amount to the trustor’s account and returns
    the deposit `D` to the trustee’s account.


    ### Experimental Setup


    Next, we investigate the impact of the deposit as an effective pre-commitment
    mechanism on the trust game performance (i.e., social efficiency and normalized
    reciprocity) via Ethereum-based blockchain experiments. We set `K` = 2 in our
    experimenter smart contract and consider different deposit values of `D` = {0,
    2, 5*, X*} Ether, whereby `D` = 0 denotes the classical trust game without any
    deposit. The experiment was conducted with two graduate students from different
    universities. The rationale behind the selection of only two students is to first
    focus on the conventional trust game that by definition involves only two players.
    This allows us to be more certain that the effects of the deposit mechanism are
    real. In addition, conducting our experiment with the same two participating students
    allows us to better observe the behavior change during the rounds of the game.
    As for our inclusion criteria, we note that the students didn’t know each other’s
    identity, which was important to ensure anonymity between them. Further, the students
    hadn’t conducted any behavioral research experiments before. Nor did either participant
    had any prior knowledge or experience with the trust game or any other investment
    game experiments. The two participating students were male and their age was 23
    and 25 years, respectively.

