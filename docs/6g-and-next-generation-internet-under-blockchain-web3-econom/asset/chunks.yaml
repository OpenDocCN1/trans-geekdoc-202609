    回想“通往以人为中心的社会的路径（DAO）”章节可知，任何代币化生态系统的设计都始于一个理想的输出，即其目的。正如“引言”部分所述，Society 5.0
    的目标是 CPSS 成员提供一种技术社会环境，该环境 (*i*) 扩展了人类能力 (*ii*) 衡量了旨在人类共同智能化的活动。为此，正如 6G 时代广泛预期的那样，我们在相互连接的人类与物体群体中将
    `AI` 推进到 `CI`。


    ### 步骤 2：选择合适的 CPSS


    我们选择了最近提出的“无物物联网”（Internet of No Things）作为最先进的 CPSS，因为其最终转型阶段涉及近程设备（nearables），这些设备有助于为提供以人为中心和用户意图的服务创建智能环境（参见“通往以人为中心的社会的路径（DAO）”章节）。Maier
    等人 \[10\] 引入了超感知网络（`ESPN`），该网络在近程设备（如社交机器人、虚拟化身）中集成了无处不在的计算和说服性计算，通过社交影响改变人类用户的行为。在本章中，我们关注区块链和机器人学（robonomics）这两种基础技术，分别用于扩展
    `ESPN’s online environment` 和 `offline agents`。


    ### 步骤 3：定义 PoW


    回想“通往以人为中心的社会的路径（DAO）”章节可知，`PoW` 是维护技术驱动公共物品的关键机制。具体而言，我们感兴趣的是创建俱乐部物品（club goods），这在“通往以人为中心的社会的路径（DAO）”章节中简要提到，其监管的访问权限避免了广为人知的“公地悲剧”
    \[15\]。为了调节访问，我们利用了链上预言机（`on-chaining oracles`）的区块链技术。`链上预言机` 对于以可靠的方式将外部离线信息带入区块链至关重要。链上信息可能源于人类用户。因此，`链上预言机`
    有助于挖掘人类智能 \[16\]。作为 `PoW`，我们通过决策和知识共享定义了预言机对 CPSS 治理操作的贡献，这两者对于实现 `CI` 的特定目标都至关重要。


    ### 步骤 4：设计激励对齐的代币


    大多数代币缺乏适当的激励机制设计。回想“Society 5.0：从机器人学到代币经济学”章节可知，将代币作为激励是 DAO 的核心，且其研究才刚刚开始。重要的是，请回想代币化过程创建了`代币化数字孪生体`，通过包含`投票权`
    来协调参与者并监管生态系统，以追求理想的结果。代币化数字孪生体的创建是通过`token contract` 完成的，该合约激励了我们定义的 `PoW`，涉及以下两个步骤：(*i*)
    创建代表物理或数字世界中给定资产的数字孪生体，以及 (*ii*) 创建一个或多个代币，将给定物理/数字资产的访问权限/许可分配给代币持有者的区块链地址。


    ### 步骤 5：通过信息素与痕迹促进 DAO 成员间的间接通信


    最后，让参与特定 DAO 项目的成员 (*i*) 在 `ESPN’s blockchain-enabled online environment` 中记录其目标驱动的受代币激励的活动，并
    (*ii*) 使用这些区块链交易（例如存款）作为`traces`（痕迹），在受信息素增强的 Society 5.0 中引导集体行为向更高水平的 `CI` 发展。


    图 5.4 详细插说明了这五个步骤中每一步的功能，包括它们的运行交互。


    ![图 5.4 使用代币化数字孪生体通过信息素增强的 Society 5.0，以推进 CPSS 中的集体智能 (CI)。](img/fig5_4.jpg)


    图 5.4 使用代币化数字孪生体通过信息素增强的 Society 5.0，以推进 CPSS 中的集体智能 (CI)。]


    ## 实现与实验结果


    人类智能的通用定义是完成任务的成功率。在我们的实现中，人类智能任务（`HIT`）通过利用图像数据库 `ImageNet` 实现。


    图 5.5 详细描述了我们实现的设置和实验步骤。我们开发了一个基于 JavaScript 的 `HIT` 平台，让人们从 20 张 `ImageNet` 图像中选择，并添加相关的图像标记信息，通过中间服务器
    `OOCSI` 将两者都交付到配置妥当的 `MTurk` 和 `Amazon Web Services (AWS)` 账户。`MTurk` 工人对每个提交的
    `HIT` 提供的答案由`链上预言机`进行评估，该预言机使用符合 `ERC-20` 标准的访问权限令牌来监管投票过程，并释放分配给每个成功标记图像的目标驱动代币。最后，人类将发现的/奖励的代币作为信息素痕迹留在区块链上，帮助参与的
    DAO 成员更新关于奖励地图的知识并继续进行探索。


    ![图 5.5 通过 Amazon MTurk 和链上预言机通过个人或集体的 ImageNet 标记发现隐藏的代币奖励地图。](img/fig5_5.jpg)


    图 5.5 通过 Amazon MTurk 和链上预言机通过个人或集体的 ImageNet 标记发现隐藏的代币奖励地图。]


    图 5.6 显示了信息素对八位成员在奖励地图中发现的集体智能和内部奖励的积极影响。作为对比，该图还显示了没有信息素时的实验结果，此时 DAO 成员没有从知识共享中受益。


    ![图 5.6 有无信息素的集体智能（百分比）和内部奖励（代币），对比众包工人数量。](img/fig5_6.jpg)


    图 5.6 集体智能（百分比）和内部奖励。


    ## 结论


    Society 5.0 完美契合了未来 6G 预期的从垂直行业向以人为中心的转变。它利用了参与人类行为的 CPSS 以及能够实现从货币向非货币范式转移的技术，例如我们考虑的基于区块链的
    `Web3` 经济及其在新兴 DAO 中的重要作用。由于与去中心化区块链技术的相似性，我们采用了信息素——一种在昆虫社会中广泛存在的生物自组织机制——通过区块链在线环境中创建的痕迹（反馈循环）促进离线代理之间的间接通信和内部协调。我们实现的基于
    CPSS 的 Society 5.0 自下而上代币工程 DAO 框架经证明，通过区块链在线环境中的信息素痕迹增加了 `CI` 和奖励的目标驱动代币。


