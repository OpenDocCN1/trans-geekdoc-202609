  trans: '


    机制设计中一个有趣的例子是所谓的*利他性惩罚*（altruistic punishment），它用于确保多人公共物品游戏中的合作 [12]。利他性惩罚意味着个体惩罚他人，尽管惩罚具有成本且没有物质收益。实验表明，对违背者（即不可信的参与者）进行利他性惩罚是合作的关键动力，如果存在利他性惩罚的可能性，合作就会繁荣；如果被排除，合作就会崩溃。设计外部性（如第三方惩罚和替代性奖励机制）对于激励多人公共物品游戏以及特别是
    *N*-人信任游戏中的人类合作具有重要意义。


    *   **经济实验的去中心化实现：** 一种广泛用于开发和开展几乎任何类型经济实验（包括上述公共物品游戏和我们考虑的信任游戏）的实验软件是 `Zurich
    Toolbox for Ready-made Economics (z-Tree)` [13]。`z-Tree` 软件以客户端-服务器应用的形式实现，其中供实验者的中央服务器应用程序称为
    `z-Tree`，供游戏参与者的远程客户端应用程序称为 `z-Leaf`。它是免费提供的，并允许通过互联网进行经济实验。然而，缺点是 `z-Tree` 不支持玩家之间的点对点（P2P）通信，而非基于区块链的去中心化实现。


    ### 实验者智能合约


    首先，我们开发了一个智能合约来取代信任者和受托者之间中间的实验者（参见图 4.1）。开发过程使用了 Truffle 框架。


    具体来说，在我们的实验者合约中，我们使用了以下全局变量：(*i*) `msg.value`，代表发送的交易；(*ii*) `msg.sender`，代表向实验者智能合约发送交易的玩家地址，即信任者或受托者。信任者和受托者都使用他们的以太坊外部持有账户（EOA），通过公钥和私钥来交互并调用我们实验者智能合约的每个函数。以下我们简要概述实验者智能合约的核心函数和参数：


    *   **函数 `investFraction()`：** 该函数允许信任者投入其资金 `X` 的部分 `p`。一旦调用，它将获取信任者收到的 `msg.value`
    `p`，利用合约余额将其乘以因子 `K`，并直接传输到受托者的账户。受托者接收 `msg.value` · `K`。

    *   **函数 `splitFraction()`：** 该函数允许受托者从信任者的投入中拆分部分 `q`。一旦调用，它从受托者账户提取指定的拆分金额并发送到信任者账户。

    *   **参数 `Onlytrustor`（修饰符类型）：** 该修饰应用于 `investFraction()` 函数。因此，只有信任者可以调用实验者智能合约的此函数。

    *   **参数 `Onlytrustee`（修饰符类型）：** 该修饰应用于 `splitFraction()` 函数。因此，只有受托者可以调用实验者智能合约的此函数。


    我们注意到，在执行实验者智能合约的每个函数后，都会使用事件（event）来创建通知并保存日志。事件有助于追踪并通知双方关于合约的当前状态和活动。


    ### 区块链机制保证金


    使用单向安全押金为一方对另一方提供信任是非常常见的，特别是通过电子商务和众包平台进行商品和服务交换。在区块链语境下，保证金是一种智能合约协议，定义了双方之间的安排，其中一方向第三方质押资产。区块链机制保证金的一个有趣用例可以在
    [14] 中找到。在论文中，作者提出了一种新协议，利用区块链实现了注册的电子递送（e-Deliveries）服务的所有预期属性。在所提的协议中，作者包含了一种保证金机制，旨在鼓励发送者避免不实行为和欺诈尝试，并按照协议阶段预定义的方式完成交换。如果发送者按照协议完成交换，保证金将返回给发送者。在我们的工作中，我们建议在实验者智能合约中添加一个可选函数
    `deposit()`，以增强两个玩家之间的信任和可信度。为此，我们进行了了以下两处修改：


    *   **函数 `deposit()`：** 该函数允许受托者提交金额 `2 ≤ D ≤ X` 的货币单位（在我们考虑的以太坊案例中为 Ether）作为保证金提交到实验者智能合约。只有在完成
    `q > 0` 的交易时，保证金才会返回给受托者。否则，当 `q` = 0 时，受托者将丢失保证金。需要注意的是，上述 `Onlytrustee()` 修饰符也应用于此函数。

    *   **函数 `splitFraction()`： 我们对该函数进行了修改，允许受托者拆分收到的金额（即 `q > 0`）。否则，交易将被拒绝，直到受托者拆分收到的金额为止。一旦发生这种情况，函数会将金额传输到信任者账户，并将保证金
    `D` 返回到受托者账户。


    ### 实验设置


    接下来，我们通过基于以太坊的区块链实验，研究保证金作为一种有效的预承诺机制对信任游戏表现（即社会效率和归一化互惠）的影响。我们在实验者智能合约中设置 `K`
    = 2，并考虑不同的保证金值 `D` = {0, 2, 5*, X*} Ether，其中 `D` = 0 表示不带任何保证金的经典信任游戏。实验是在两名来自不同大学的学生进行的。选择仅两名学生的理由是首先关注定义上仅涉及两个玩家的传统信任游戏，这让我们能够更确定保证金机制的效果是真实的。此外，通过相同的两名参与学生进行实验，使我们能够更好地观察游戏过程中的行为变化。至于入选标准，我们注意到学生之间彼此不知道对方身份，这对于确保他们之间的匿名性至关重要。此外，这些学生之前没有进行过任何行为研究实验。也没有任何参与者对信任游戏或其他任何投资游戏实验有先验知识或经验。两名参与学生均为男性，年龄分别为
    23 岁和 25 岁。


    '
- fmt: '

    At the beginning of the experiment, both trustor and trustee were given an endowment
    of `X` = 10 Ether. We ran the experiment four times, each time for a different
    value of `D`. Each of the four experiments took five rounds. We note that for
    the experiment with `D` = 10 Ether, the trustee put her full endowment `X` into
    the deposit, thus `D` = `X` Ether. All experiments were run across the Internet.
    Both participants interacted with our experimenter’s smart contract using their
    Ethereum accounts. We note that both the trustor and the trustee need to pay a
    gas fee. Gas price refers to the pricing value, required to successfully conduct
    a transaction or execute a function in a smart contract on the Ethereum blockchain
    platform. Priced in small fractions of the cryptocurrency Ether, commonly referred
    to as `Gwei`. Each `Gwei` is equal to 0.000000001 ETH (10^(−9) Ether). Given its
    lowest cost, we considered transaction fees associated with deploying the smart
    contract and sending transactions negligible compared to the amounts invested
    and split.


    [Figure 4.2](#chapter04.xhtml#f4_2) depicts the average social efficiency and
    normalized reciprocity (both given in percent) vs. deposit `D` = {0, 2, 5*, X*}
    (given in Ether). We define normalized reciprocity as the ratio of `q/p` as a
    measure of the trustee’s reciprocity, `q`, in response to the trustor’s generosity,
    `p`. Note that the normalized reciprocity is useful to gauge the fair distribution
    of total payoffs from trustee to trustor, and vice versa, for a given achievable
    social efficiency. Note that [Fig. 4.2](#chapter04.xhtml#f4_2) also shows the
    interval between minimum and maximum measured score for each value of `D`.


    ![FIGURE 4.2 Average social efficiency and normalized reciprocity q/p vs. deposit
    d = {0, 2, 5, x} ether using experimenter smart contract with k = 2 and x = 10
    (shown with minimum-to-maximum measured score intervals).](images/fig4_2.jpg)


    [FIGURE 4.2](#chapter04.xhtml#b04fig4_2) Average social efficiency and normalized
    reciprocity `q/p` vs. deposit `d` = {0, 2, 5*, x*} ether using experimenter smart
    contract with `k` = 2 and `x` = 10 (shown with minimum-to-maximum measured score
    intervals).


    We make the following interesting observations from [Fig. 4.2](#chapter04.xhtml#f4_2).
    First, the social efficiency continually grows for an increasing deposit `D` until
    it reaches the maximum of 100% for `D` = `X`. Thus, the social efficiency performance
    of the classical trust game can be maximized by applying the blockchain chain
    mechanism of deposit properly with `D` = `X`. This is due to the fact that the
    trustor sends her full endowment (i.e., `p` = 1) after the trustee has put in
    her maximum deposit. In doing so, a maximum total payoff of 30 Ether is achieved,
    translating into a social efficiency of 100%. It is worthwhile to mention that
    this was the case in all five rounds of the experiment. Second, the average normalized
    reciprocity improves significantly for increasing deposit `D` compared to the
    classical trust game without any deposit (`D` = 0).


    Specifically, in the classical trust game, the average normalized reciprocity
    is as low as 18%. By contrast, for a deposit of as little as `D` = 2 Ether, the
    average normalized reciprocity rises to 80%. Interestingly, further increasing
    `D` does not lead to sizeable additional increases, e.g., average normalized reciprocity
    equals 83% for `D` = `X`. Hence, the amount of the deposit does not change the
    normalized reciprocity significantly with `q/p` ≈ 80% for `D` > 0. Finally, [Fig.
    4.2](#chapter04.xhtml#f4_2) illustrates that for an increasing deposit D, the
    behavior of the two players becomes more consistent, as indicated by the decreasing
    intervals of minimum to maximum measured scores.


    In the subsequent section, we extend the classical two-player trust game to a
    networked `N`-player trust game and study how advanced blockchain technologies,
    most notably on-chaining oracles, drive the behavior of players by means of different
    reward and penalty mechanisms. Among others, we seek to understand whether an
    increased normalized reciprocity is achievable without sacrificing social efficiency.


    # ON-CHAINING ORACLE FOR NETWORKED N-PLAYER TRUST GAME


    ## Architecture of Oracle


    [Figure 4.3](#chapter04.xhtml#f4_3) depicts the architecture of our proposed on-chaining
    oracle for the networked `N`-player trust game. The proposed architecture comprises
    a set of clusters or pools. Each cluster contains three types of agents: (*i*)
    trustors, (*ii*) trustees, and (*iii*) observers. The difference between observers
    and players (trustors/trustees) is that observers don’t play, but track and evaluate
    trust and trustworthiness criteria such as investment (`p`) and split (`q`). Players
    interact with the experimenter smart contract using their public-private keys
    through a DApp. The different rounds of the game are monitored remotely by the
    observers using `Etherscan` ![FIGURE 4.3 Architecture of on-chaining oracle for
    networked n-player trust game.](images/fig4_3.jpg)


    [FIGURE 4.3](#chapter04.xhtml#b04fig4_3) Architecture of on-chaining oracle for
    networked n-player trust game.


    The design of a third-party punishment and reward mechanism for incentivizing
    player cooperation in our networked `N`-player trust game is based on crowdsourcing.
    Specifically, observers provide their collective human intelligence to the nudge
    contract in order to punish a cluster or an individual player, who demonstrates
    inappropriate behavior, or provide a positive reward for good behavior. The nudge
    contract manages the reward-penalty mechanism in the form of loyalty points. A
    trustor can earn loyalty points for an honest transaction, investment, and engagement
    in the game and redeem earned points for rewards. Similarly, the trustee is rewarded
    for generous reciprocity. Loyalty points keep the players engaged and aware of
    the overall goals, i.e., increase of total payoff, social efficiency, and normalized
    reciprocity. In addition, the players have a score profile associated with their
    public key, whereby players earn 1 point for every honest action and lose 1 point
    if their action is dishonest. The scoring profile is managed by the nudge contract.
    Trustor and trustee can check the status of their loyalty reward points by calling
    the function `getTrustorLoyalty()` and `getTrusteeLoyalty()`, respectively. Furthermore,
    an incentive strategy was designed to incorporate principles of behavioral psychology
    using economic outcomes to render the system more effective in changing the players’
    behavior. Players earn a monetary reward in the form of Ether after reaching a
    certain number of loyalty reward points in the game, e.g., 10 points = 1 Ether.


    The ethers earned are added to the player’s endowment `X`, which will be used
    for the investment and payoff in future rounds of the game. We note that there
    are more advanced schemes to compute the score/reputation of users, e.g., [[15](#chapter04.xhtml#r4_15),
    [16](#chapter04.xhtml#r4_16)]].


    ## On-Chaining of Voting-Based Decisions


    In our oracle implementation, we assigned predetermined public keys to both players
    and observers. The creation of each key pair can be accomplished by using several
    options, including Ethereum wallets and online/offline Ethereum address generators,
    e.g., Vanity-ETH

