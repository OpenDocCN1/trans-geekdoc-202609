    DAO framework for Society 5.0.


    Above the basic technology layer, there exists the governance operation layer.
    Generally speaking, this layer encodes consensus via smart contracts (e.g., voting)
    and realizes the DAO’s self-governance through on-chain and off-chain collaboration
    (on-chaining oracle). Further, this layer includes nudging mechanisms via smart
    contract (nudge contract), collective decision-making, and knowledge sharing among
    its members. The incentive mechanism layer covers the aforementioned token-related
    techniques and their proper alignment to facilitate token engineering. Next, the
    organization form layer includes the voting process and membership during the
    lifecycle of a proposed DAO project. Note that, in economics, public goods that
    come with regulated access rights (e.g., membership) are called *club goods*.


    Finally, the manifestation layer allows members to take simple, locally independent
    actions that together lead to the emergence of complex adaptive system behavior
    of the DAO and Society 5.0 as a whole. Due to its striking similarity to decentralized
    blockchain technology, we explore the potential of the biological *stigmergy*
    mechanism widely found in social insect societies such as ants and bees, especially
    their inherent capability of self-organization and indirect coordination by means
    of olfactory *traces* that members create in the environment. Upon sensing these
    traces, other society members are stimulated to perform succeeding actions, thus
    reinforcing the traces in a self-sustaining autocatalytic way without requiring
    any central control entity, as explained below in “From Superorganism to Stigmergic
    Society and Collective Intelligence in the 6G Era” section.


