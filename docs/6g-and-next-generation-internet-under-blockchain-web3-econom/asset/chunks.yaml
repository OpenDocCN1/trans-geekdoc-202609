- fmt: '

    Recall from the “Introduction” that the Tactile Internet will involve the inherent
    HITL nature of H2M interaction, as opposed to the emerging IoT. Thus, it allows
    for a human-centric design approach toward extending the capabilities of the human
    through the Internet for the augmentation rather than automation of the human.
    Recently, Maier et al. [[28](#chapter02.xhtml#r2_28)]] put forward the idea that
    the Tactile Internet may be the harbinger of human augmentation and human-machine
    symbiosis envisioned by contemporary and early-day Internet pioneers. More specifically,
    we elaborated the role AI-enhanced agents may play in supporting humans in their
    task coordination between humans and machines. Toward achieving advanced human-machine
    coordination, we developed a distributed allocation algorithm of computational
    and physical tasks for fluidly orchestrating HART coactivities (e.g., the shared
    use of user- and/or network-owned robots). In our design approach, all HART members
    established through communication a collective self-awareness with the objective
    of minimizing the task completion time.


    In the following, we search for synergies between the aforementioned HART membership
    and the complementary strengths of the DAO, AI, and robots (see [Fig. 2.2](#chapter02.xhtml#f2_2))
    to facilitate local human-machine coactivity clusters by decentralizing the Tactile
    Internet. Toward this end, it is important to better understand the merits and
    limits of AI. Recently, Stanford University launched its `One Hundred Year Study
    on Artificial Intelligence (AI100)`. In the inaugural report “Artificial Intelligence
    and Life in 2030,” the authors defined AI as a set of computational technologies
    that are inspired by the ways people use their nervous systems and bodies to sense,
    learn, reason, and take action. They also point out that AI will likely replace
    tasks rather than jobs in the near term and highlight the importance of crowdsourcing
    human expertise to solve problems that computers alone cannot solve well.


    ### Decentralized Edge Intelligence


    > First, let us explore the potential of leveraging mobile end-user equipment
    by partially or fully decentralizing MEC. We introduce the use of AI-enhanced
    MEC servers at the optical-wireless interface of converged fiber-wireless mobile
    networks for computation offloading. Assuming the same default network parameter
    setting and simulation setup as in [[28](#chapter02.xhtml#r2_28)]], we consider
    1 ≤ `N[Edge]` ≤ 4 AI-enhanced MEC servers, each associated with 8 end users, whereof
    1 ≤ `N[PD]` ≤ 8 partially decentralized end users can flexibly control the number
    of offloaded tasks by varying their computation offloading probability. The remaining
    8 − `N[PD]` are fully centralized end users that rely on edge computing only (i.e.,
    their computation offloading probability equals 1). Note that for `N[Edge]` =
    4, all end users may offload their computation tasks onto an edge node. Conversely,
    for `N[Edge]` < 4, one or more edge nodes are unavailable for computation offloading
    and their associated end users fall back on their local computation resources
    (i.e., fully decentralized). [Figure 2.6](#chapter02.xhtml#f2_6) shows the average
    task completion time versus computation offloading probability of the partially
    decentralized end users for different `N[Edge]` and `N[PD]`. We observe from [Fig.
    2.6](#chapter02.xhtml#f2_6) that for a given `N[Edge]`, increasing `N[PD]` (i.e.,
    higher level of decentralization) is effective in reducing the average task completion
    time. Specifically, for `N[Edge]` = 4, a high decentralization level (`N[PD]`
    = 8) allows end users to experience a reduction of the average task completion
    time of up to 89.5% by optimally adjusting their computation offloading probability
    to 0.7.


    ![FIGURE 2.6 Average task completion time (in seconds) versus computation offloading
    probability for different numbers of partially decentralized end users (nPD) and
    artificial intelligence (AI)-enhanced MEC servers (nedge).](images/fig2_6.jpg)


    [FIGURE 2.6](#chapter02.xhtml#b02fig2_6) Average task completion time (in seconds)
    versus computation offloading probability for different numbers of partially decentralized
    end users (`n[PD]`) and artificial intelligence (AI)-enhanced MEC servers (`n[edge]`).


    As interconnected computing power has spread around the world and useful platforms
    have been built on top of it, the crowd has become a demonstrably viable and valuable
    resource. According to McAfee and Brynjolfsson [[6](#chapter02.xhtml#r2_6)]],
    there are many ways for companies that are squarely at the core of modern capitalism
    to tap into the expertise of uncredentialed and conventionally inexperienced members
    of the technology-enabled crowd such as the DAO. Maier et al. [[28](#chapter02.xhtml#r2_28)]]
    developed a self-aware allocation algorithm of physical tasks for HART-centric
    task coordination based on the shared use of user- and network-owned robots. Recall
    from “AI-Enhanced MEC: Pushing AI to the Edge” that by using our AI-enhanced MEC
    servers as autonomous agents, we showed that delayed force feedback samples coming
    from TORs may be locally generated and delivered to HOs in close proximity. Note,
    however, that the performance of the sample forecasting-based teleoperation system
    heavily relies on the accuracy of the forecast algorithm.


    ### Crowdsourcing: Expanding the HO Workforce


    Toward realizing DAO in a decentralized Tactile Internet, Ethereum may be used
    to establish HO-TOR sessions for remote physical task execution, whereby smart
    contracts help establish and maintain trusted HART membership and allow each HART
    member to have global knowledge about all participating HOs, TORs, and MEC servers
    that act as autonomous agents following the widely used gateway-oriented approach
    (see Blockchain IoT (B-IoT): Recent Progress and Related Work). An HO remotely
    executes a given physical task until `k` out of the recent `n` haptic feedback
    samples are misforecast. At this point, the HO immediately stops the teleoperation
    and informs the agent. The agent assigns the interrupted task to an available
    HO in the vicinity, who then traverses to the task point and finalizes the physical
    task. For `n` = 5, [Fig. 2.7](#chapter02.xhtml#f2_7) depicts the average task
    completion time versus the probability of sample misforecast for different `k`
    and `f[human]/f[robot]`, where `f[human]` and `f[robot]` denote the capability
    (in terms of number of operations per second) of a human and robot for performing
    physical tasks, respectively. We observe that the task completion time increases
    as the probability of sample misforecast grows from 0 to 0.25 for `k` = 1, whereas
    it remains almost unchanged for `k` = 3. Further, note that as humans become more
    capable (i.e., increasing `f[human]/f[robot]`), the resultant task completion
    time decreases until it hits a plateau, as traversing incurs additional delays.


    ![FIGURE 2.7 Average task completion time (in seconds) versus the probability
    of sample misforecast for different number of misforecasts (k) and ratio of human
    and robot operational capabilities (fhuman/frobot).](images/fig2_7.jpg)


    [FIGURE 2.7](#chapter02.xhtml#b02fig2_7) Average task completion time (in seconds)
    versus the probability of sample misforecast for different number of misforecasts
    (`k`) and ratio of human and robot operational capabilities (`f[human]/f[robot]`).


    ## Blockchain, AI, and Human Intelligence: THE PATH FORWARD


    Today, AI, machine learning, robots, and IoT are converging to create a new wave
    of change as they begin to take advantage of cryptocurrencies, initial coin offerings
    (ICOs), virtual assets, and tokenization of everything.


    The outcome of this convergence of innovations and human cause fears about job
    loss, robot overlords, and the future in general [[33](#chapter02.xhtml#r2_33)]].

    '
