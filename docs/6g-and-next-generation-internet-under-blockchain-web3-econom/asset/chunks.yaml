    # 结论


    我们的关注重点是探索 DAO、CPSS 以及未来的 Web3 及其底层代币经济，以实现在信息素社会中的集体智能。以下是各章节的更详细总结。


    在第 2 章中，我们展示了许多新兴的区块链物联网（B-IoT）研究使用以太坊作为选择区块链，并采用面向网关的设计方法将计算密集型任务从资源受的终端设备卸到中间网关，使其能够访问以太坊网络。为此，我们首先解释了以太坊和比特币区块链之间的共同点和区别，随后在技术上更详细地介绍了
    DAO。我们随后讨论了区块链与物联网（B-IoT）整合的动机，并介绍了区块链与边缘计算整合的挑战。在我们近期关于协调混合 HART 活动的触觉互联网工作的基础上，我们引入了基于嵌入
    AI 能力的先进 MEC 的低延迟 FiWi 增强 LTE-A 异构网络。我们随后证明了高水平去中心化 AI 增强 MEC 有助于缩短计算任务的平均完成时间。此外，对于去中心化触觉互联网中的物理任务执行，我们探索了如何使用以太坊
    DAO 和智能合约建立可信的 HART 成员，以及在远程操作机器人的触觉反馈预测不可靠的情况下，人类众包如何帮助减少物理任务完成时间。我们概述了技术融合的未来研究方向，以便通过增强和共享智能利用助推（nudge）理论来成功完成人机混合任务，该理论是
    2017 年诺贝尔经济学奖得者理查德·H·塞勒推广的行为经济学新概念。

