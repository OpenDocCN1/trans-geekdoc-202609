    # Conclusions


    Our focus was on exploring the role of the DAO, CPSS, and the future Web3 and
    its underlying token economy toward realizing collective intelligence in a stigmergic
    society. In the following, a more detailed summary of each chapter is presented.


    In [Chapter 2](#chapter02.xhtml#c02), we showed that many of the emerging blockchain
    Internet of Things (B-IoT) studies use Ethereum as the blockchain of choice and
    apply a gateway-oriented design approach to offload computationally intensive
    tasks from resource-constrained end-devices onto an intermediate gateway, thus
    enabling them to access the Ethereum blockchain network. Toward this end, we first
    explained the commonalities of and specific differences between Ethereum and Bitcoin
    blockchains followed by a description of the DAO in technically greater detail.
    We then discussed the motivation for the integration of blockchain and IoT (B-IoT)
    followed by a description of the challenges of integrating blockchain and edge
    computing. Building on our recent Tactile Internet work on orchestrating hybrid
    HART coactivities, we introduced our proposed low-latency FiWi enhanced LTE-A
    HetNets based on advanced MEC with embedded AI capabilities. We then showed that
    higher levels of decentralized AI-enhanced MEC are effective in reducing the average
    completion time of computational tasks. Further, for remote execution of physical
    tasks in a decentralized Tactile Internet, we explored how Ethereum’s DAO and
    smart contracts may be used to establish trusted HART membership and how human
    crowdsourcing helps physical task completion time in the event of unreliable forecasting
    of haptic feedback samples from teleoperated robots. We outlined future research
    avenues on technological convergence in order to successfully accomplish hybrid
    machine+human tasks by augmented and shared intelligence tapping into the theory
    of nudge, a recent novel development in behavioral economics concept popularized
    by Richard H. Thaler, the 2017 Nobel Laureate in Economics.


