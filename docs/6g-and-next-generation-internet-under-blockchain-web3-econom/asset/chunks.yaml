    \ we study the tokenization process of creating tokenized digital twins of assets\
    \ and access rights in the physical and digital world, paying close attention\
    \ to its central role in the future Web3 and its underlying token economy, the\
    \ successor of today’s information and platform economies. After introducing our\
    \ CPSS-based bottom-up multilayer token engineering framework for Society 5.0,\
    \ we experimentally demonstrate how the collective human intelligence of a blockchain-enabled\
    \ DAO can be enhanced via purpose-driven tokens.\n\n        Finally, [Chapter\
    \ 6](#conc.xhtml) concludes the book by summarizing the major findings of the\
    \ book.\n\n        ## NOTES\n\n        1.  [International](#chapter01.xhtml#n1_101b)\
