    research avenues on technological convergence in order to successfully accomplish
    hybrid machine+human tasks by augmented and shared intelligence tapping into the
    theory of nudge, a recent novel development in behavioral economics concept popularized
    by Richard H. Thaler, the 2017 Nobel Laureate in Economics.'
