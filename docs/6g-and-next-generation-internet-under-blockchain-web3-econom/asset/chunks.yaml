    # 16G-区块链愿景与研究方向


    DOI: [10.1201/9781003427322-1](https://doi.org/10.1201/9781003427322-1)


    ## 背景与动机


    ### 移动网络与互联网的演进


    全球移动网络标准的通用演进首先是在第一、二代中最大化覆盖范围，然后在第三、四代中最大化容量。除了更高的容量外，第五代（5G）移动网络的研究还关注更低的端到端延迟、更高的频谱效率和能效，以及更多的连接节点
    [1]。具体而言，第一代（1G）移动网络设计用于语音服务，速率高达 2.4 kbit/s，使用模拟信号传输信息，且没有通用的无线标准。相反，第二代（2G）基于数字调制技术，提供的数据速率高达
    384 kbit/s，不仅支持语音服务，还支持短信服务（`SMS`）等数据服务。主导的 2G 标准是全球移动通信系统（`GSM`）。第三代（3G）移动网络提供了至少
    2 Mbit/s 的数据速率，并实现了高级服务，包括网页浏览、电视流媒体和视频服务。为了实现全球漫游，成立了 `3GPP` 来定义技术规范和移动标准。第四代（4G）移动网络于
    21 世纪 00 年代后期引入。4G 是一个完全基于互联网协议（`IP`）的网络，能够提供下行高达 1 Gbit/s、上行高达 500 Mbit/s 的高速数据速率，支持数字视频广播（`DVB`）、高清电视内容和视频聊天等高级应用。LTE
    进阶版（`LTE-A`）是主导的 4G 标准，它集成了协调多点（`CoMP`）收发、多输入多输出（`MIMO`）和正交频分复用（`OFDM`）等技术 [2]。5G
    的主要目标首次不仅使用微波频段，还使用了毫米波（`mm-wave`）频段，以显著将数据速率提升至 10 Gbit/s [3]。5G 的另一个特征是更高效的频谱利用，通过增加每赫兹比特数来衡量
    [4]。`ITU`的国际移动电信 2020（`IMT 2020`）标准提出了以下三大主要的 5G 用用场景：


    1. 增强移动宽带（`Embb`）

    2. 超可靠低延通信（`URLLC`）

    3. 大规模机器类通信（`mMTC`） [5]


    有趣的 5G 低延迟应用之一是新兴的触觉互联网（Tactile Internet），它设想实现`触觉通信`，从而使用户不仅能看到、听到，还能感知。触觉互联网由计算机化、自动化和机器人化的最新驱动，预计将显著增强人机交互，将今天的内容交付网络转换为技能交付网络，通过互联网操控物理物体
    6]。触觉互联网有望创造新的创业机会和工作，对我们生活的几乎每个领域产生深远影响，涵盖从增强/虚拟现实（`AR/VR`）、自动驾驶到医疗保健的智能电网。许多垂直领域（例如`AR/VR`、远程诊断、远程手术和临场感）需要极低延迟和极高可靠性
    10]。然而，某些并不一定需要移动性的用例可以通过固定网络实现。这表明未来的蜂窝网络需要完全融合，允许灵活选择不同的固定和移动接入技术并共享核心网络功能 [11]。交互系统（特别是`AR/VR`和远程操作）需要
    1-10 毫秒的极低往返延迟以及高可靠性。触觉互联网的高可用性和安全性、极快速响应时间和运营商级可靠性为人类与机器的交互增加了新维度。为了更深入地理解触觉互联网，将其与新兴的物联网（`IoT`）和
    5G 移动网络进行比较可能会有所帮助。虽然`IoT`的概念并不新鲜并追溯到 1995 年，但直到最近，工业界和学术界对`IoT`的兴趣才开始快速增长。图 1.1](#chapter01.xhtml#f1_1）展示了符合`ITU-T`标准的触觉互联网的革命性跨越！


    ![图 1.1 符合 ITU-T 技术报告的触觉互联网革命性跨越](img/fig1_1.jpg)


    图 1.1 符合`ITU-T`技术报告的触觉互联网革命性跨越。


    触觉互联网与`IoT`之间的区别可以通过底层通信范式和赋能终端设备来表达。触觉互联网涉及人机交互中固有的人类回路（`HITL`）本质，而`IoT`则围绕自主机器间（`M2M`）通信中心，与人类没有交互。触觉互联网依赖人机/机器人（`H2M/R`）交互，因此允许以人为中心的设计方法来创造新的沉浸式体验，通过互联网扩展人类的能力。此外，触觉互联网可以被视为沉浸式`VR`从虚拟环境到物理环境的延伸。它允许对不仅是虚拟物体也是真实的物体（例如遥操作机器人）进行触觉引导和控制。虚拟（即在线）世界与物理（即离线）世界之间的边界变得越来越难以察觉，同时人类的数字和物理能力通过边缘计算变体得到扩展，理想情况下是嵌入了人工智能（`AI`）的能力。


