    of human-intended services without owning or carrying any type of computing or
    storage devices. It envisions Internet services appearing from the *surrounding
    environment* when needed and disappearing when not needed. The transition from
    the current gadgets-based Internet to the Internet of No Things is divided into
    three phases: (*i*) bearables (e.g., smartphone), (*ii*) wearables (e.g., Google
    and Levi’s smart jacket), and then finally (*iii*) nearables. Nearables denote
    nearby computing/storage technologies and service provisioning mechanisms that
    are intelligent enough to *learn and react according to user context and history*
    in order to provide user-intended services. The basic technology layer at the
    bottom of [Fig. 5.3](#chapter05.xhtml#f5_3) illustrates the key enabling technologies
