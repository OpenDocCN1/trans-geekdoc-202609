  raw: 'Maier et al. \[[28](#chapter02.xhtml#r2_28)\] touched on the importance of
    shifting the research focus from AI to intelligence amplification (IA) by using
    information technology to enhance human decisions. Note, however, that IA becomes
    difficult in dynamic task environments of increased uncertainty and real-world
    situations of great complexity. IA, also known as “cognitive augmentation” or
    “machine-augmented intelligence,” will be instrumental in enhancing the creativity,
    understanding, efficiency, and intelligence of humans.


    ### Cognitive-Assistance-Based Intelligence Amplification


    Edge computing is a widely studied approach to increase the usefulness of crowdsourcing,
    which may be used to guide humans step-by-step through the physical task execution
    process by providing them with cognitive assistance. Technically, this could be
    easily realized by equipping an unskilled DAO member with an augmented reality
    (AR) headset (e.g., HoloLens 2 with WiFi connectivity) that receives work-order
    information in real time from its nearest AI-enhanced MEC server.


    ### HITL Hybrid-Augmented Intelligence


    Many problems that humans face tend to be of high uncertainty, complexity, and
    open-ended. To solve such problems, human interaction and participation may be
    introduced. As a result, this gives rise to the concept of HITL hybrid-augmented
    intelligence for advanced human-machine collaboration \[[34](#chapter02.xhtml#r2_34)\].
    HITL hybrid-augmented intelligence is defined as an intelligent model that requires
    human interaction and allows for addressing problems and requirements that may
    not be easily trained or classified by machine learning. In general, machine learning
    is inferior to the human brain in understanding unstructured real-world environments
    and processing incomplete information and complex spatiotemporal correlation tasks.
    Hence, machines cannot carry out all the tasks in human society on their own.
    Instead, AI and human intelligence are better viewed as highly complementary.


    According to Zheng et al. \[[34](#chapter02.xhtml#r2_34)\], the Internet provides
    an immense innovation space for HITL hybrid-augmented intelligence. Specifically,
    cloud robotics and AR are among the fastest-growing commercial applications for
    enhancing the intelligence of an individual in multi-robot collaborative systems.
    One of the main research topics of HITL hybrid-augmented intelligence is the development
    of methods that allow machines to learn from not only massive training samples
    but also human knowledge to accomplish highly intelligent tasks via shared intelligence
    among different robots and humans.


    ### The Rise of the Decentralized Self-Organizing Cooperative


    A very interesting example to catalyze human and machine intelligence toward a
    new form of self-organizing artificial general intelligence (AGI) across the Internet
    is the so-called SingularityNET.


    ### Nudging toward Human Augmentation


    Extending on the DSOC concept, we advocate the use of the nudge theory for enhancing
    the human capabilities of unskilled crowd members of the DAO. According to Richard
    H. Thaler, the 2017 Nobel Laureate in Economics, the nudge theory claims that
    positive reinforcement and indirect suggestions can influence the behavior of
    groups and individuals. A suitable nudging mechanism aims at completing interrupted
    local physical tasks by learning from a remote skilled DAO member, who is able
    to transfer her knowledge as data via a secure blockchain transaction embedded
    in a smart contract with an appropriate reward for each sub-task. This smart contract
    will initially enhance the local HO’s capability, thereby allowing it to successfully
    accomplish a given task via shared intelligence among failing robots and skilled
    humans.


    ## OPEN CHALLENGES AND FUTURE WORK


    The Internet has been constantly evolving from the mobile Internet to the emerging
    IoT and future Tactile Internet. Similarly, the capabilities of future 5G networks
    will extend far beyond those of previous generations of mobile communication.
    By boosting access networks’ redundancy and diversity as envisioned in ITU-T \[[22](#chapter02.xhtml#r2_22)\],
    FiWi-enhanced 4G LTE-A HetNets with AI-embedded MEC hold great promise to meet
    the stringent latency and reliability requirements of immersive Tactile Internet
    applications. Maier \[[35](#chapter02.xhtml#r2_35)\] recently outlined some research
    ideas that help tap into the full potential of the Tactile Internet. However,
    other concepts such as the discussed spreading ownership, DAO, and HART membership
    will be instrumental in ushering in new ideas and concepts to facilitate local
    human-machine coactivity clusters by completely decentralizing edge computing
    via emerging Ethereum blockchain technologies to realize future techno-social
    systems such as the Tactile Internet, which by design still requires heavy involvement
    from humans at the network edge instead of automating them away. More work lies
    ahead to integrate Ethernet-based FiWi-enhanced mobile networks with Ethereum
    blockchain technologies. Although blockchain technology is promising technology
    to enhance today’s IoT, there are still many research issues to be addressed before
    the integration of blockchain with IoT, especially in future mobile networks (i.e.,
    6G and beyond) that play a primordial role in constructing the underlying infrastructure
    for blockchains.


    ## CONCLUSIONS


    In this chapter, we showed that many of the emerging B-IoT studies use Ethereum
    as the blockchain of choice and apply a gateway-oriented design approach to offload
    computationally intensive tasks from resource-constrained end devices onto an
    intermediate gateway, thus enabling them to access the Ethereum blockchain network.
    Building on our recent Tactile Internet work on orchestrating hybrid HART coactivities,
    we showed that higher levels of decentralized AI-enhanced MEC are effective in
    reducing the average completion time of computational tasks. Further, for remote
    execution of physical tasks in a decentralized Tactile Internet, we explored how
    Ethereum’s DAO and smart contracts may be used to establish trusted HART membership
    and how human crowdsourcing helps decrease physical task completion time in the
    event of unreliable forecasting of haptic feedback samples from teleoperated robots.
    We outlined future research avenues on technological convergence to successfully
    accomplish hybrid machine-human tasks by tapping into the shared intelligence
    of the crowd.


    ## NOTE


