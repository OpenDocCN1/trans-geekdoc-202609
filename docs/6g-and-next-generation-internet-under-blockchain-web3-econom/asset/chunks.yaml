    A question of particular interest hereby is how decentralized blockchain mechanisms
    may be leveraged to let new hybrid forms of collaboration among individuals, which
    have not been entertained in the traditional market-oriented economy dominated
    by firms rather than individuals \[[8](#chapter02.xhtml#r2_8)\].


    ### Blockchain-Enabled Edge Computing


    One of the critical challenges in cloud computing is the end-to-end responsiveness
    between the mobile device and an associated cloud. To address this challenge,
    multi-access edge computing (MEC) is proposed, which is a mobility-enhanced small-scale
    cloud data center that is located at the edge of the Internet (e.g., Radio Access
    Network \[RAN\]) and in close proximity to mobile subscribers. An MEC entity is
    a trusted, resource-rich computer or cluster of computers that is well-connected
    to the Internet and available for use by nearby mobile devices. According to the
    white paper published by ETSI, MEC is considered a key emerging technology to
    be an important component of next-generation networks. In light of the aforementioned
    arguments, the integration of blockchain and edge computing into one unified entity
    becomes a natural trend. On one hand, by incorporating blockchain into the edge
    computing network, the system can provide reliable access and control of the network,
    computation, and storage over decentralized nodes. On the other hand, edge computing
    enables blockchain storage and mining computation from power-limited devices.
    Furthermore, off-chain storage and off-chain computation at the edges enable scalable
    storage and computation on the blockchain \[[17](#chapter02.xhtml#r2_17)\].


    Several recent studies on blockchain and edge computing have been carried out.
    In \[[18](#chapter02.xhtml#r2_18)\], resource-constrained IoT devices were released
    from computation-intensive tasks by offloading blockchain consensus processes
    and data-processing tasks onto more powerful edge computing resources. The proposed
    EdgeChain was built on the Ethereum platform and uses smart contracts to monitor
    and regulate the behavior of IoT devices based on how they act and use resources.
    Another blockchain-enabled computation offloading scheme for IoT with edge computing
    capabilities, called “BeCome,” was proposed in \[[19](#chapter02.xhtml#r2_19)\].
    The authors of this study aimed at decreasing the task offloading time and energy
    consumption of edge computing devices, while achieving load balancing and data
    integrity.


    The study by Zhaofeng et al. \[[20](#chapter02.xhtml#r2_20)\] proposed a blockchain-based
    trusted data management scheme called “BlockTDM” for edge computing to solve the
    data trust and security problems in an edge computing environment. Specifically,
    the authors proposed a flexible and configurable blockchain architecture that
    includes a mutual authentication protocol, flexible consensus, smart contract,
    block and transaction data management as well as blockchain node management and
    deployment. The BlockTDM scheme is able to support matrix-based multichannel data
    segment and isolation for sensitive or privacy data protection. Moreover, the
    authors designed user-defined sensitive data encryption before the transaction
    payload is stored in the blockchain system. They implemented a conditional access
    and decryption query of the protected blockchain data and transactions through
    an appropriate smart contract. Their analysis and evaluation show that the proposed
    BlockTDM scheme provides a general, flexible, and configurable blockchain-based
    paradigm for trusted data management with high credibility.


    In summary, blockchain-enabled edge computing has become an important concept
    that leverages decentralized management and distributed services to meet the security,
    scalability, and performance requirements of next-generation of communications
    networks, as discussed in technically greater detail in “Decentralizing the Tactile
    Internet.”


    ## THE IEEE P1918.1 TACTILE INTERNET


    In this section, we give a brief overview of the basic concepts, features, structure,
    and taxonomy of the Tactile Internet. Subsequently, some of the typical Tactile
    Internet applications and network infrastructure requirements are presented in
    greater detail.


    ### The Tactile Internet: Key Principles'
