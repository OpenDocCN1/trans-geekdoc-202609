    We have seen in [Chapter 2](#chapter02.xhtml#c02) that there has been a growing
    interest in adapting blockchain to the specific needs of the Internet of Things
    (IoT) in order to develop a variety of blockchain Iot (B-IoT) applications, ranging
    from smart cities and Industry 4.0 to financial transactions and farming, among
    others. Toward this end, the authors of [[1](#chapter03.xhtml#r3_1)] pointed out
    the important role of smart contracts, which are defined as pieces of self-sufficient
    decentralized code that are executed autonomously when certain conditions are
    met, whereby Ethereum was one of the first blockchains using smart contracts.
    The use of Ethereum allows users to write and run their own code on top of the
    network. By updating the code, users are able to modify the behavior of IoT devices
    for simplified maintenance and error correction. Besides well-known B-IoT problems
    such as hosting a blockchain on resource-constrained IoT devices, low transaction
    rates, and long block creation times, Fernández-Caramés and Fraga-Lamas [[1](#chapter03.xhtml#r3_1)]
    identified several significant challenges beyond early B-IoT developments and
    deployments that will need further investigation. Apart from technological challenges,
    e.g., access control and security, the authors concluded that shaping the regulatory
    environment, e.g., `decentralized ownership`, is one of the biggest issues to
    unlock the potential of B-IoT for its broader use.


    Recently, in [[2](#chapter03.xhtml#r3_2)], gateways were used to act as B-IoT
    service agents for their respective cluster of local resource-constrained IoT
    devices by storing their blockchain accounts and using them to execute smart contracts
    on their behalf. The proposed smart contract-based framework consists of multiple
    access control contracts (ACCs). Each `ACC` maintains a misbehavior list for each
    B-IoT resource, including details and time of the misbehavior as well as the penalty
    on its subject, e.g., blocking access requests for a certain period of time. Further,
    in addition to a register contract, the framework involves the so-called `judge
    contract (JC)`, which implements a certain misbehavior judging method. After receiving
    the misbehavior reports from the ACCs, the `JC` determines the penalty on the
    corresponding subjects and returns the decisions to the ACCs for execution.


    Despite the recent progress, the salient features that set Ethereum aside from
    other blockchains remain to be explored in more depth, including their symbiosis
    with other emerging key technologies such as AI and robots apart from decentralized
    edge computing solutions. A question of particular interest hereby is how decentralized
    blockchain mechanisms may be leveraged to let emerge new hybrid forms of collaboration
    among individuals, which haven’t been entertained in the traditional market-oriented
    economy dominated by firms rather than individuals [[3](#chapter03.xhtml#r3_3)].
    Of particular interest will be Ethereum’s concept of decentralized autonomous
    organizations (DAO). In fact, in their latest book on how to harness our digital
    future [[4](#chapter03.xhtml#r3_4)], Andrew McAfee and Erik Brynjolfsson speak
    of “The Way of The DAO” which may substitute a technology-enabled crowd for traditional
    organizations such as companies.


    While fifth generation (5G) networks have not been widely deployed yet, early
    studies have already started to look beyond 5G networks and speculate what the
    future sixth generation (6G) vision might be. Unlike 5G, 6G will not only explore
    more spectrum at high-frequency bands, but converge driving technological trends.
    Saad et al. [[5](#chapter03.xhtml#r3_5)] argue that there will be the following
    three driving applications behind 6G: (*i*) blockchain and distributed ledger
    technologies, (*ii*) connected robots and autonomous systems, and (*iii*) wireless
    brain-computer interaction (a subclass of human-machine interaction). In this
    chapter, we focus on the Tactile Internet, which is supposed to be the next leap
    in the evolution of today’s IoT. Note that the IoT with its underlying machine-to-machine
    (M2M) communications is useful for enabling the automation of industrial and other
    machine-centric processes. It is designed to enable communications among machines
    without relying on any human involvement. Conversely, the Tactile Internet will
    add a new dimension to human-to-machine (H2M) interaction involving its inherent
    human-in-the-loop (HITL) nature, thus allowing for a human-centric design approach
    toward creating novel immersive experiences and extending the capabilities of
    the human through the Internet, i.e., augmentation rather than automation of the
    human [[6](#chapter03.xhtml#r3_6)]. This chapter aims at addressing the open research
    challenges outlined above.


    Maier and Ebrahimzadeh [[6](#chapter03.xhtml#r3_6)] covered various important
    aspects of the Tactile Internet (i.e., haptic traffic characterization and edge
    intelligence), but outlined future work on the blockchain only briefly. In this
    chapter, we build on our findings in [[6](#chapter03.xhtml#r3_6)] and make the
    following contributions: (*i*) investigate the potential of leveraging mobile
    end-user equipment for decentralization via blockchain, (*ii*) explore how crowdsourcing
    may be used to decrease the completion time of physical tasks, and (*iii*) extend
    the B-IoT framework from judge contract to nudge contract for enabling the nudging
    of human users in a broader Tactile Internet context.


    The remainder of the chapter is structured as follows. “Decentralizing the Tactile
    Internet” section elaborates on the potential role of Ethereum and in particular
    the DAO in helping decentralize the Tactile Internet. In “Nudging: From Judge
    Contract to Nudge Contract” section, we explore possibilities to extend the B-IoT
    framework of judge contract to nudge contract for enabling the `nudging` of human
    users in a broader Tactile Internet context. Finally, “Conclusions” section concludes
    the chapter.


    ## DECENTRALIZING THE TACTILE INTERNET


    ### FiWi Enhanced Mobile Networks: Spreading Ownership


    Maier and Ebrahimzadeh [[6](#chapter03.xhtml#r3_6)] have shown that the 5G ultra-reliable
    and low latency communications (URLLC) requirements can be achieved by enhancing
    coverage-centric 4G LTE-A HetNets with capacity-centric FiWi access networks based
    on low-cost, data-centric EPON and WLAN technologies in the backhaul and front-end,
    respectively. [Figure 3.1](#chapter03.xhtml#f3_1) illustrates the architecture
    of such FiWi-enhanced mobile networks in greater detail. The common EPON fiber
    backhaul is shared by a number of optical network units (ONUs), which may either
    connect to fixed subscribers or interface with a WLAN MPP or a cellular BS. Some
    of the resultant ONU-MPPs/ONU-BSs may be equipped with an AI-enhanced MEC server
    (to be described in more detail shortly). On the end-user side, we consider the
    following three types of subscribers: conventional MUs as well as pairs of HO
    and TOR involved in teleoperation, which may be either local or non-local.


    ![FIGURE 3.1 Architecture of FiWi enhanced mobile networks with AI-enhanced MEC
    for immersive Tactile Internet applications.](images/fig3_1.jpg)


    [FIGURE 3.1](#chapter03.xhtml#b03fig3_1) Architecture of FiWi enhanced mobile
    networks with AI-enhanced MEC for immersive Tactile Internet applications.

