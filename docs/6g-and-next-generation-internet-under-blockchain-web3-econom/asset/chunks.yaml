    # 5 超有机体到 6G 时代的信息迹社会与集体智能


    DOI: [10.1201/9781003427325](https://doi.org/10.1201/9781003427325)


    ## 引言


    与之前的代不同，未来第六代（6G）网络预计将通过将无线演进从“连接物”转变为“连接智能”来产生变革性影响。在其备受赞誉的《社会物理》（Social Physics）中——该术语由现代社会学创始人奥古斯特·孔德（Auguste
    Comte）提出——麻理工学院媒体实验室教授亚历克斯德·彭顿（Alex Pentland）认为，社会互动（如社会学习和社交压力）是驱动集体智能（CI）演进的主要动力。根据彭顿的观点，集体智能是通过对周围同伴的共享学习以及利用暴露效应产生理想的行为变化而产生的。


