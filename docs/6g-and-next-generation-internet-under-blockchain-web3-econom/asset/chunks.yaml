    Freni 等人 \[12] 最近分析了从传统货币经济学向非货币代币经济学的转变，以及代币在基于区块链的生态系统中的核心作用。去中心化区块链技术已在不同的价值基础场景中，通过利用名为`tokenization`（代币化）的过程应用于非货币语境。现有资产的代币化是指为任何物理对象或金融资产创建`tokenized
    digital twin`（数字化数字孪生）的过程。生成的代币是封装价值的可交易单位。它们可以作为激励措施，协调特定监管生态系统中的参与者，以实现预期结果。根据
    Freni 等人 \[12]]，代币具有颠覆性潜力，通过将其用于声誉或投票权，可以将价值的概念扩展到经济领域之外。通过代币化，可以在其利益相关者之间共享奖励和收益，在激励生态系统中利用不同类型的数字化价值。


    代币可以代表任何现有的数字或物理资产，也可以代表数字或物理世界中资产的访问权和权限。代币作为账目条目存储，并映射到区块链地址，该地址代表代币持有者的身份。最初，代币是通过底层区块链协议铸造的。然而，随着`Ethereum`的出现，代币移动到了区块链协议栈的顶层，现在可以在应用层创建，从而产生了所谓的应用代币。通过`Ethereum`，应用代币可以遵循以
    代币标准（例如 `ERC-20`），通过一种特定的智能合约类型（被称为代币合约）轻松廉价地发行。


    代币可能是区块链网络的杀手级应用，并被认为是被称为 Web3 的下一代互联网的主要驱动力之一 \[13]]。如图 5.2 所示所示，虽然 Web1（只读网页）和
    Web2（读写网页）分别开启了知识经济和今天的平台经济，但 Web3 将实现`token economy`，其中任何人的贡献都将通过代币获得补偿。代币经济以数字方式实现了完全全新的用例、业务模式以及资产和访问权的类型，这些在以前经济上是不可行的，从而实现了全新的全新的用例和价值创造模型。请注意，“代币经济”一词并不新鲜。在认知心理学中，它作为一种交换媒介被广泛研究，而且更重要的是，它作为建立理想人类行为的正向强化方法，这本身可能被视为一种价值创造。然而，与通常仅作支付媒介的硬币不同，代币可以用于广泛的不同的非货币目的。这种目标驱动型代币对于激励一个自治群体协作并为共同目标做出贡献具有重要作用。根据
    Voshmgir \[13]，对代币（特别是不同类型和角色）的探索仍处于非常早期。


    ![图 5.2 互联网经济的演变：从只读的 Web1 信息经济和读写 Web2 平台经济，到基于去中心化区块链和自执行智能合约技术的读-写-执行 Web3
    代币经济。](img/fig5_2.jpg)


    图 5.2 互联网经济的演变：从只读的 Web1 信息经济和读写 Web2 平台经济，到基于去中心化区块链和自执行智能合约技术的读-写-执行 Web3 代币经济。


    代币经济在实现新兴的去中心化自治组织（DAO）方面起着核心作用，DAO 已成为近年来区块链技术快速发展催生的热点 \[14]。DAO 可以被视为一个社会系统，由智能代理组成，基于现实和人工智能区块链系统共同演进为人机整合。在
    DAO 中，所有的运行规则都以智能合约的形式记录在区块链上。代币经济激励措施结合分布式共识协议，用于实现 DAO 的自运行、自治理和自演化。事实上，根据 Wang
    等人 \[14]]，使用代币作为激励是 DAO 的主要动力，其中他们所陈述的多层 DAO 参考模型中的所谓的`incentive mechanism`（激励机制）层将是代币设计的关键（稍后将进行更多讨论）。


    ## 通向以人为本社会的路径 (DAO)


    尽管在过去几年中发行了许多代币，但大多数这些发行的代币缺乏适当的功能设计和机制设计。在本节中，我们旨在通过讨论目标驱动型代币和引入代币工程这一重要问题来解决这两个缺点。


    ### 目标驱动型代币与代币工程


    回想“社会 5.0：从机器人经济学到代币经济学”章节，我们仍然处于探索不同代币角色和类型的非常早期阶段。例如，所谓的`purpose-driven tokens`（目标驱动型代币）激励个人目标目标目标或集体目标。这种集体目标可能是公共物品，也可以是对负外部性的减少（例如减少
    CO[2] 排放）。目标驱动型代币在不需要传统中介（例如政府）的情况下引入了公共物品创造的新形式。`Ethereum` 等区块链网络通过提供只需几行智能合约代码即可创建应用代币的基础设施，将价值创造的思想推向高度，原则上任何目标都可以被激励。然而，鉴于运营用例仍然有限，这种技术驱动的公共物品创造的新现象需要更多的研发
    \[13]。


    工作量证明 (`PoW`）是维护公共物品的关键机制 \[13]]。尽管集体生产公共物品可以产生正外部性，但它并不排除其他负外部性（例如区块链的耗能型挖矿过程）。在设计目标驱动型代币作为提供公共物品的手段时，行为经济学方法（例如著名的助推技术和行为博弈论）为引导个人采取某些行动提供了重要工具。


    在接下来，我们关注代币工程这一重要问题，这是一个新兴术语，定义为分析、设计和验证代币化生态系统的理论、实践和工具 \[13]]。它涉及一个自下而上的代币工程框架的设计，以及用于解决目标驱动型代币问题的适当机制的设计。请注意，机制设计是经济学的一个分支，处理如何激励每个人为集体目标做出贡献的问题。它也被称为“逆向博弈论”，因为它从博的终点（即理想的输出）开始，然后反向设计（激励）机制。


    ### 针对社会 5.0 的代币工程 DAO 框架


    '
- fmt: '

    Recall from “Society 5.0: From Robonomics to Tokenomics” section that for the
    token design a multilayer DAO reference model was proposed in [[14](#chapter05.xhtml#r5_14)],
    though it was intentionally kept generic without any specific relation to Society
    5.0. The bottom-up architecture of the DAO reference model comprises the following
    five layers: (*i*) basic technology, (*ii*) governance operation, (*iii*) incentive
    mechanism, (*iv*) organization form, and (*v*) manifestation. Due to space constraints,
    we refer the interested reader to [[14](#chapter05.xhtml#r5_14)] for further information
    on the generic DAO reference model and a more detailed description of each layer.
    In the following, we adapt the generic DAO reference model to the specific requirements
    of Society 5.0 and highlight the modifications made in our CPSS-based bottom-up
    token engineering DAO framework.


    [Figure 5.3](#chapter05.xhtml#f5_3) depicts our proposed multilayer token engineering
    DAO framework for Society 5.0 that builds on top of state-of-the-art CPSS. While
    the Internet of Things as a prime CPS example has ushered in Industry 4.0, advanced
    CPSS such as the future Internet of No Things, briefly mentioned in the “Introduction,”
    will be instrumental in ushering in Society 5.0. As explained in more detail in
    [[10](#chapter05.xhtml#r5_10)], the Internet of No Things creates a converged
    service platform for the fusion of digital and real worlds that offers all kinds
    of human-intended services without owning or carrying any type of computing or
    storage devices. It envisions Internet services appearing from the *surrounding
    environment* when needed and disappearing when not needed. The transition from
    the current gadgets-based Internet to the Internet of No Things is divided into
    three phases: (*i*) bearables (e.g., smartphone), (*ii*) wearables (e.g., Google
    and Levi’s smart jacket), and then finally (*iii*) nearables. Nearables denote
    nearby computing/storage technologies and service provisioning mechanisms that
    are intelligent enough to *learn and react according to user context and history*
    in order to provide user-intended services. The basic technology layer at the
    bottom of [Fig. 5.3](#chapter05.xhtml#f5_3) illustrates the key enabling technologies
    (e.g., blockchain) underlying the Internet of No Things. In addition, this layer
    contains future technologies, most notably bionics, that are anticipated to play
    an increasingly important role in a future super-smart Society 5.0 (see also [Fig.
    5.1](#chapter05.xhtml#f5_1)).


    ![FIGURE 5.3 CPSS-based bottom-up token engineering DAO framework for Society
    5.0.](images/fig5_3.jpg)


    [FIGURE 5.3](#chapter05.xhtml#b05fig5_3) CPSS-based bottom-up token engineering
    DAO framework for Society 5.0.


    Above the basic technology layer, there exists the governance operation layer.
    Generally speaking, this layer encodes consensus via smart contracts (e.g., voting)
    and realizes the DAO’s self-governance through on-chain and off-chain collaboration
    (on-chaining oracle). Further, this layer includes nudging mechanisms via smart
    contract (nudge contract), collective decision-making, and knowledge sharing among
    its members. The incentive mechanism layer covers the aforementioned token-related
    techniques and their proper alignment to facilitate token engineering. Next, the
    organization form layer includes the voting process and membership during the
    lifecycle of a proposed DAO project. Note that, in economics, public goods that
    come with regulated access rights (e.g., membership) are called *club goods*.


    Finally, the manifestation layer allows members to take simple, locally independent
    actions that together lead to the emergence of complex adaptive system behavior
    of the DAO and Society 5.0 as a whole. Due to its striking similarity to decentralized
    blockchain technology, we explore the potential of the biological *stigmergy*
    mechanism widely found in social insect societies such as ants and bees, especially
    their inherent capability of self-organization and indirect coordination by means
    of olfactory *traces* that members create in the environment. Upon sensing these
    traces, other society members are stimulated to perform succeeding actions, thus
    reinforcing the traces in a self-sustaining autocatalytic way without requiring
    any central control entity, as explained below in “From Superorganism to Stigmergic
    Society and Collective Intelligence in the 6G Era” section.


    ### The Human Use of Human Beings: Cybernetics and Society


    A prominent example of moving a Web2-based social network to Web3 was Facebook’s
    recent announcement in June 2019 to launch a new infrastructure to manage their
    own token coined *Libra* (later renamed Diem), including suitable price stability
    mechanisms for its exchange with fiat currencies. However, the design of tokenized
    currencies will not be sufficient for realizing the Society 5.0 vision. To see
    this, note that people, including former and founding executives, began publicly
    questioning the impact of social media on our lives and opened up about their
    regrets over helping create social media as we know it today.


    Useful hints for more human-centered solutions may be found in the origins of
    cybernetics. In his seminal book “The Human Use of Human Beings: Cybernetics and
    Society,” Norbert Wiener, the founder of cybernetics, argues that the danger of
    machines working on cybernetic principles, though helpless by themselves, is that
    such machines may be used by a human being or a block of human beings to increase
    their control over the rest of the human race. In order to avoid the manifold
    dangers of this, Wiener emphasizes the need for the anthropologist (see, e.g.,
    [[4](#chapter05.xhtml#r5_4)]) and the philosopher. He postulates that scientists
    must know what man’s nature is and what his built-in purposes are, arguing that
    the integrity of *internal communication* via feedback loops is essential to the
    welfare of society.


    ## FROM SUPERORGANISM TO STIGMERGIC SOCIETY AND COLLECTIVE INTELLIGENCE IN THE
    6G ERA


    In this section, we explore how the aforementioned integrity of internal communication
    may be achieved in Society 5.0 by borrowing ideas from the biological superorganism
    with brain-like cognitive abilities observed in colonies of social insects. The
    concept of stigmergy (from the Greek words *stigma* “sign” and *ergon* “work”),
    originally introduced in 1959 by French zoologist Pierre-Paul Grassé, is a class
    of self-organization mechanisms that made it possible to provide an elegant explanation
    to his paradoxical observations that in a social insect colony, individuals work
    as if they were alone while their collective activities appear to be coordinated.
    In stigmergy, traces are left by individuals in their environment that may feed
    back on them and thus incite their subsequent actions. The colony records its
    activity in the environment using various forms of storage and uses this record
    to organize and constrain collective behavior through a feedback loop, thereby
    giving rise to the concept of *indirect communication*. As a result, stigmergy
    maintains social cohesion by coupling of environmental and social organization.
    Note that with respect to the evolution of social life, the route from solitary
    to social life might not be as complex as one may think. In fact, in the AI subfield
    of swarm intelligence, e.g., swarm robotics, stigmergy is widely recognized as
    one of the key concepts.


    In the following, we illustrate how our CPSS-based token engineering DAO framework
    in [Fig. 5.3](#chapter05.xhtml#f5_3) can be applied to Society 5.0 and describe
    the involved bottom-up design steps of suitable purpose-driven tokens and mechanisms:


    *   **Step1: Specify Purpose**

