    # 致谢


    如果没有许多优秀人士的支持与合作，本书的完成将是不可能的。感谢我的前导师，加拿大蒙特利尔国家科学研究所 (INRS) 的 Martin Maier 教授，在我最初的学术和科学阶段给予了卓越的支持和指导。此外，我要感谢
    Amin Ebrahimzadeh 博士和 Sajjad Rostami 博士，他们为本书第 3 章、第 4 章 和第 5 章 中报告的实验结果所付出的高效合作。在
    CRC Press，我要感谢 Daina Habdanka 和 Laura Piedrahita 在准备本书的整个过程中的提供的指导。最后，最重要的是，我想借此机会对我的父母和朋友无尽的支持、爱和鼓励表示最深的谢意。


