- fmt: '

    In September 2019, the world’s first 6G white paper was published as an outcome
    of the first 6G wireless summit, which was held in Levi, Finland, earlier in March
    2019 with almost 300 participants from 29 countries, including major infrastructure
    manufacturers, operators, regulators as well as academia [[21](#chapter01.xhtml#r1_21)].
    Each year, the white paper will be updated following the annual 6G wireless summit.
    While 5G was primarily developed to address the anticipated capacity growth demand
    from consumers and to enable the increasing importance of the IoT, 6G will require
    a substantially more holistic approach, embracing a much wider community. Further,
    6G will become more human-centered than 5G, which primarily focused on industry
    verticals. Putting people at the center of a future super-smart society lies also
    at the heart of the recently emerging concept of Society 5.0 [[22](#chapter01.xhtml#r1_22)].


    Many of the key performance indicators (KPIs) used for 5G are valid also for 6G.
    However, beyond 5G (B5G) and 6G, KPIs in most of the technology domains once again
    point to an increase by a factor of 10–100, though a 1000 times price reduction
    from the customer’s viewpoint may be also key to the success of 6G [[23](#chapter01.xhtml#r1_23)].
    Note that cost reduction is particularly important for providing connectivity
    to rural and underprivileged areas, where the cost of backhaul deployment is the
    major limitation. According to Yaacoub and Alouini [[24](#chapter01.xhtml#r1_24)],
    providing rural connectivity represents a key 6G challenge and opportunity given
    that around half of the world’s population lives in rural or underprivileged areas.
    Among other important KPIs, 6G is expected to be the first wireless standard to
    exceed a peak throughput of 1 Tbit/s per user.


    Arguably more interestingly, 6G envisions that totally new services such as telepresence,
    as a surrogate for actual travel, will be made possible by combinations of graphical
    representations (e.g., avatars), wearable displays, mobile robots and drones,
    specialized processors, and next-generation wireless networks. Similarly, smartphones
    are likely to be replaced by pervasive XR experiences through lightweight glasses,
    whereby feedback will be provided to other senses via earphones and haptic interfaces.
    Furthermore, 6G needs a network with embedded trust given that the digital and
    physical worlds will be deeply entangled by 2030. Toward this end, blockchain
    also known as distributed ledger technology (DLT) may play a major role in 6G
    networks due to its capability to establish and maintain trust in a distributed
    fashion without requiring any central authority.


    ### Blockchain and Distributed Ledger Technologies


    The radical potential of blockchain technology has long spread outside the world
    of crypto into the hand of the general public. We’ve all heard through one way
    or another that it is most likely the most revolutionary technology that is presently
    available in any known market and that includes the real world as well as the
    digital space. Blockchain technology is principally behind the emergence of Bitcoin
    [[25](#chapter01.xhtml#r1_25)] and many other cryptocurrencies that are too numerous
    to mention [[26](#chapter01.xhtml#r1_26)]. A blockchain is essentially a distributed
    database of records (or public ledger) of all transactions or digital events that
    have been executed and shared among participating parties [[27](#chapter01.xhtml#r1_27)].
    Each transaction in the public ledger is verified by consensus between the majority
    of the participants in the system. Once entered, information can never be erased.
    The blockchain contains a certain and verifiable record of every single transaction
    ever made. At the point when the block reaches a certain size, it is timestamped
    and linked to the previous block through a cryptographic hash, thereby forming
    a chain of timestamped blocks (hence the name blockchain), as depicted in [Fig.
    1.3](#chapter01.xhtml#f1_3).


    ![FIGURE 1.3 A graphical representation of blockchain transaction workflow.](images/fig1_3.jpg)


    [FIGURE 1.3](#chapter01.xhtml#b01fig1_3) A graphical representation of blockchain
    transaction workflow.


    Blockchain technology is being successfully applied in both financial and non-financial
    applications. It has the potential to reduce the role of one of the most important
    economic and regulatory actors in our society, the middleman [[28](#chapter01.xhtml#r1_28),
    [29](#chapter01.xhtml#r1_29)]. Blockchain technology was initially linked to the
    decentralized cryptocurrency Bitcoin, as it is the main and first application
    of the network (known as Blockchain 1.0 [[30](#chapter01.xhtml#r1_30)]). However,
    there exist many other use cases and several hundred different applications besides
    Bitcoin that use blockchain technology as a platform such as Ethereum.


    `Ethereum` is a type of open software platform that runs on blockchain technology.
    At its heart lies the so-called Ethereum Virtual Machine (`EVM`), which is capable
    of executing code of arbitrary algorithmic complexity [[31](#chapter01.xhtml#r1_31)].
    The Ethereum platform can be used not only as a cryptocurrency but also to allow
    developers to write smart contracts, and program codes stored on a blockchain
    that are executed when predetermined conditions are met. Ethereum smart contracts
    allow end-users to interact with next-generation decentralized applications (DApps).
    As opposed to traditional centralized applications, where the backend code is
    running on centralized servers, DApps are apps whose server-client models are
    decentralized. DApps run on blockchain networks without a central authority and
    use decentralized storage protocols. DApps may be used in many other fields by
    making the process of creating applications much easier and more efficient. For
    instance, they can be used for realizing non-financial blockchain DApps (e.g.,
    IoT device registration DApp, blockchain-based digital identity application).
    The rise of Ethereum and smart contracts heralded Blockchain 2.0 [[30](#chapter01.xhtml#r1_30)].

