    ### AI-Enhanced MEC


    According to \[[7](#chapter03.xhtml#r3_7)\], 6G will go beyond mobile Internet
    and will be required to support ubiquitous AI services from the core to the end
    devices. In the following, we explore the potential of leveraging mobile end-user
    equipment by partially or fully decentralizing MEC. Recall from above that we
    introduced the use of AI-enhanced MEC servers at the optical-wireless interface
    of FiWi-enhanced mobile networks. In our considered scenario, we assume that the
    human-system interface (HSI) at the human operator side is equipped with the so-called
    AI-enabled edge sample forecasting module (ESF), which is responsible to provide
    the human operator with the predicted samples if the samples are lost or excessively
    delayed. This as a result helps the human operator have a transparent perception
    of the remote environment. In a B-IoT context, these MEC servers have been used
    as gateways that are required to act as B-IoT service agents to release resource-constrained
    IoT devices from computation-intensive tasks by offloading blockchain transactions
    onto more powerful edge computing resources, as discussed in the “Introduction”
    section. This design constraint can be relaxed in the Tactile Internet, where
    the user equipment (e.g., state-of-the-art smartphones or the aforementioned user-owned
    robots) is computationally more resourceful than IoT devices and thus may be exploited
    for decentralization.


    In our simulations, we set the FiWi network parameters as follows: Distributed
    Coordination Function Interframe Space (DIFS) = 34 µsec, Short Interframe Space
    (SIFS) = 16 µsec, Physical Layer (PHY) Header = 20 µsec, W0 = 16 µsec, H = 6,
    E = 9 µsec, Request To Send (RTS) = 20 bytes, Clear To Send (CTS) = 14 bytes,
    Acknowledgment (ACK) = 14 bytes, rWMN = 300 Mbps, cPON = 10 Gbps, PON fiber reach
    lPON = 20 Km, average packet length L = 1500 bytes, ς[*L*]² = 0, ONU-AP radius
    = 102 m. We also consider 1 ≤ NEdge ≤ 4 AI-enhanced MEC servers, each associated
    with 8 end-users, whereof 1 ≤ NP D ≤ 8 partially decentralized end-users can flexibly
    control the number of offloaded tasks by varying their computation offloading
    probability. The remaining 8—NP D are fully centralized end-users that rely on
    edge computing only (i.e., their computation offloading probability equals 1).
    Note that for NEdge = 4, all end-users may offload their computation tasks onto
    an edge node. Conversely, for NEdge < 4, one or more edge nodes are unavailable
    for computation offloading and their associated end-users fall back on their local
    computation resources (i.e., fully decentralized). The computational capacity
    of MEC servers and partially decentralized end-users are set to 1.44 GHz and 185
    MHz, respectively. For a more detailed description of the system model, parameter
    setting, and network configuration, the interested reader is referred to Maier
    and Ebrahimzadeh \[[6](#chapter03.xhtml#r3_6)\]. [Figure 3.2](#chapter03.xhtml#f3_2)
    shows the average task completion time vs. computation offloading probability
    of the partially decentralized end-users for different NEdge and NP D. We observe
    from [Fig. 3.2](#chapter03.xhtml#f3_2) that for a given NEdge, increasing NP D
    (i.e., higher level of decentralization) is effective in reducing the average
    task completion time. Specifically, for NEdge = 4, a high decentralization level
    (NP D = 8) allows end-users to experience a reduction of the average task completion
    time of up to 89.5% by optimally adjusting their computation offloading probability
    to 0.7. As shown in [Fig. 3.2](#chapter03.xhtml#f3_2), increasing NP D results
    in not only a decrease of the average execution time but also a decrease of the
    communication overhead/burden in the wireless fronthaul of our considered FiWi
    network, as a larger number of users shift the computation load from the MEC servers
    toward their local CPUs.


    ![FIGURE 3.2 Average computational task completion time (in seconds) vs. computation
    offloading probability for different numbers of partially decentralized end-users
    (NPD) and AI-enhanced MEC servers (nedge).](images/fig3_2.jpg)


    [FIGURE 3.2](#chapter03.xhtml#b03fig3_2) Average computational task completion
    time (in seconds) vs. computation offloading probability for different numbers
    of partially decentralized end-users (*NPD)* and AI-enhanced MEC servers (*n[edge]*).'
