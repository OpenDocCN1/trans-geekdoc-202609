    More interestingly to this chapter, note that Maier and Ebrahimzadeh \[[6](#chapter03.xhtml#r3_6)\]
    explored the idea of treating the human as a “member” of a team of intelligent
    machines rather than keep viewing him as a conventional “user.” In addition, we
    elaborated on the role AI-enhanced agents (e.g., `MEC` servers) may play in supporting
    humans in their task coordination between humans and machines. Toward achieving
    advanced human-machine coordination, we developed a distributed allocation algorithm
    of computational and physical tasks for fluidly orchestrating hybrid HART coactivities.
    More specifically, all HART members established through communication a collective
    self-awareness with the objective of minimizing the task completion time based
    on the shared use of robots that may be either user- or network-owned. We were
    particularly interested in the impact of *spreading ownership* of robots among
    people whose work they may replace. Our results showed that from a performance
    perspective (in terms of task completion time) no deterioration occurs if the
    ownership of robots is shifted entirely from network operators to mobile users,
    though spreading ownership across end-users makes a huge difference in who reaps
    the benefits from new technologies such as robots. This also applies to blockchain
    technologies, of course. Recall from the “Introduction” section that decentralized
    ownership is one of the biggest issues to unlock the potential of B-IoT for its
    broader use.


    Given that 6G will support new service types, e.g., computation-oriented communications
    (CoC) \[[7](#chapter03.xhtml#r3_7)\], where new smart devices call for distributed
    computation, we search for synergies between the aforementioned HART membership
    and the complementary strengths of the `DAO`, `AI`, and robots to facilitate local
    human-machine coactivity clusters by decentralizing the Tactile Internet. Toward
    this end, it’s important to better understand the merits and limits of AI. Recently,
    Stanford University launched its *One Hundred Year Study on Artificial Intelligence
    (AI100)*. In the inaugural report “Artificial Intelligence and Life in 2030,”
    the authors defined AI as a set of computational technologies that are inspired
    by the ways people use their nervous systems and bodies to sense, learn, reason,
    and take action. They also point out that AI will likely replace tasks rather
    than jobs in the near term and highlight the importance of *crowdsourcing* of
    human expertise to solve problems that computers alone cannot solve well. As interconnected
    computing power has spread around the world and useful platforms have been built
    on top of it, the crowd has become a demonstrably viable and valuable resource.
    According to McAfee and Brynjolfsson \[[4](#chapter03.xhtml#r3_4)\], there are
    many ways for companies that are squarely at the core of modern capitalism to
    tap into the expertise of uncredentialed and conventionally inexperienced members
    of the technology-enabled crowd such as the `DAO`.


    ### AI-Enhanced MEC


    According to \[[7](#chapter03.xhtml#r3_7)\],], `6G` will go beyond mobile Internet
    and will be required to support ubiquitous AI services from the core to the end
    devices. In the following, we explore the potential of leveraging mobile end-user
    equipment by partially or fully decentralizing `MEC`. Recall from above that we
    introduced the use of AI-enhanced `MEC` servers at the optical-wireless interface
    of FiWi-enhanced mobile networks. In our considered scenario, we assume that the
    human-system interface (`HSI`) at the human operator side is equipped with the
    so-called AI-enabled edge sample forecasting module (`ESF`), which is responsible
    to provide the human operator with the predicted samples if the samples are lost
    or excessively delayed. This as a result helps the human operator have a transparent
    perception of the remote environment. In a B-IoT context, these `MEC` servers
    have been used as gateways that are required to act as B-IoT service agents to
    release resource-constrained IoT devices from computation-intensive tasks by offloading
    blockchain transactions onto more powerful edge computing resources, as discussed
    in the “Introduction” section. This design constraint can be relaxed in the Tactile
    Internet, where the user equipment (e.g., state-of-the-art smartphones or the
    aforementioned user-owned robots) is computationally more resourceful than IoT
    devices and thus may be exploited for decentralization.


    In our simulations, we set the FiWi network parameters as follows: Distributed
    Coordination Function Interframe Space (`DIFS`) = `34 µsec`, Short Interframe
    Space (`SIFS`) = `16 µsec`, Physical Layer (`PHY`) Header = `20 µsec`, `W0` =
    `16 µsec`, `H` = `6`, `E` = `9 µsec`, Request To Send (`RTS`) = `20 bytes`, Clear
    To Send (`CTS`) = `14 bytes`, Acknowledgment (`ACK`) = `14 bytes`.

