    which will be increased if they act honestly. Otherwise, they will be punished
    and lose 1 loyalty point. Both players were aware that they will be rewarded with
    1 Ether for each 10 accumulated loyalty reward points. In addition, they are notified
    that the decision will be made by two observers, who will monitor their online
    transactions in order to make their independent reward/penalty decisions. All
    four participants interact anonymously via the Internet.


    [Figure 4.4](#chapter04.xhtml#f4_4) compares the average social efficiency of
    the two-player trust game without observers with that of the four-player trust
    game with observers. The figure clearly demonstrates the beneficial impact of
    the presence of observers on social efficiency for all values of *D*. Note that
    with observers the instantaneous social efficiency reaches the maximum of 100%
    for all values of *D*, as opposed to the two-player trust game where this occurs
    requiring the full deposit of *D* = *X* Ether. As for the normalized reciprocity
    achievable with and without observers, things are similar, as shown in [Fig. 4.5](#chapter04.xhtml#f4_5).
    However, while the presence of observers helps raise the average (and instantaneous)
    normalized reciprocity consistently above 80% (compared to below 80% in [Fig.
    4.2](#chapter04.xhtml#f4_2)), there still remains room for further improvement,
    especially for 0 ≤ *D < X*.


    ![FIGURE 4.4 Average social efficiency vs. deposit d = {0, 2, 5, x} ether for
    two-player trust game without observers and 4-player trust game with observers
    (shown with minimum-to-maximum measured score intervals).](images/fig4_4.jpg)


    [FIGURE 4.4](#chapter04.xhtml#b04fig4_4) Average social efficiency vs. deposit
    *d* = {0, 2, 5*, x*} ether for two-player trust game without observers and 4-player
    trust game with observers (shown with minimum-to-maximum measured score intervals).


    ![FIGURE 4.5 Average normalized reciprocity q/p vs. deposit d = {0, 2, 5, x} ether
    for two-player trust game without observers and 4-player trust game with observers
    (shown with minimum-to-maximum measured score intervals).](images/fig4_5.jpg)


    [FIGURE 4.5](#chapter04.xhtml#b04fig4_5) Average normalized reciprocity *q/p*
    vs. deposit *d* = {0, 2, 5*, x*} ether for two-player trust game without observers
    and 4-player trust game with observers (shown with minimum-to-maximum measured
    score intervals).


    ## ROBONOMICS: PLAYING THE *N*\-PLAYER TRUST GAME WITH PERSUASIVE ROBOTS


    ### Robonomics: Key Principles


    Many studies have shown that the physical presence of robots benefits a variety
    of social interaction elements such as persuasion, likeability, and trustworthiness.
    Thus, leveraging these beneficial characteristics of social robots represents
    a promising solution toward enhancing the performance of the trust game. Social
    robots connected with human operators form a physical embodiment that creates
    the new paradigm of an immersive coexistence between humans and robots, whereby
    persuasive robots aim at changing the behavior of users through social influence.
    Importantly, these robots are less like tools and more like partners, whose persuasive
    role in a social environment is mainly human-centric \[[17](#chapter04.xhtml#r4_17)\].


    Recently, in \[[18](#chapter04.xhtml#r4_18)\], an experimental pilot study with
    five participants adapted the trust game from its original human-human context
    to a social human-robot interaction (sHRI) setting using a humanoid robot operated
    in a *Wizard-of-Oz (WoZ)* manner, where a person controls the robot remotely.
    The obtained findings suggest that people playing the sHRI trust game follow a
    human-robot trust model that is quite similar to the human-human trust model.
    However, due to the lack of common *social cues* present in humans (e.g., facial
    expressions or gestures) that generally influence the initial assessment of trustworthiness,
    almost all participants started investing a lower amount and increased it after
    actively exploring the robot’s behavior and trustworthiness through social experience.


    In the following, we focus on the emerging field of *robonomics*, which studies
    the sociotechnical impact of blockchain technologies on sHRI, behavioral economics,
    behavioral game theory, and cryptocurrencies (both coins and tokens) for the social
    integration of robots into human society \[[19](#chapter04.xhtml#r4_19)\]. Robonomics
    involves persuasive robotics, whereby a physical or virtual robotic agent is used
    as enforcer or supervisor of human behavior modification via psychological rewards
    in addition to tangible rewards. In a recent exploratory sHRI study \[[20](#chapter04.xhtml#r4_20)\],
    ten multimodal *persuasive strategies* were compared with regard to their effectiveness
    of social robots attempting to influence human behavior. It was experimentally
    shown that two particular persuasive strategies—affective and logical strategies—achieved
    the highest persuasiveness and trustworthiness.


    ### Persuasive Robotics Strategies


    Similar to \[[21](#chapter04.xhtml#r4_21)\], we developed a *Crowd-of-Oz (CoZ)*
    platform for letting observers remotely control the gestures of Softbank’s social
    robot Pepper placed in front of the trustee and have a real-time dialogue via
    web-based text-to-speech translation. The CoZ user interface is built using a
    Django web server. The trustee can communicate with Pepper through voice and Pepper’s
    tactile tablet. To support voice communication, we implemented a web-based speech-to-text
    tool. When text is extracted from voice, the trustee can see his/her message on
    Pepper’s tablet in order to verify it. Next, the speech-to-text function calls
    another function to add additional fields to the main message (extracted text),
    including sequence ID, sender ID, message type, and time to make the message distinguishable
    on the Django server. The called function executes a marshaling process and sends
    the message to the Django server through the OOCSI middleware


    In our developed CoZ system, there are two types of messages: information and
    control. The information messages are created by the observers. This type of message
    is multicast to all observers and the trustee through Pepper to update them, but
    not the trustor. The trustee can see all the information messages on Pepper’s
    tablet. Moreover, Pepper uses a text-to-speech function to transfer the observers’
    messages to the trustee. The control messages are used for important functionalities
    of the CoZ architecture, e.g., performing a gesture on Pepper. When an observer
    presses a social cue button, the CoZ web-interface invokes a JavaScript method
    to call a new event on the Django server. The invoked method sets all the related
    joints’ angles plus the Light-Emitting Diode (LED) colors of Pepper’s eyes. Given
    that two or more observers may press the same or different social cue buttons
    simultaneously, the Django server implemented a queue to synchronize all issued
    commands. While Pepper is performing a gesture, the Django server puts the next
    gesture in the queue and sends it to Pepper back-to-back.


    Further, our CoZ user interface provides a section, where an observer can watch
    the trustee’s environment through Pepper’s eyes. To implement this part, we used
    OpenCV'
