    Blockchain-external data sources imply the risk that the on-chained data may be
    unreliable, maliciously modified, or untruthfully reported. Typically, various
    game-theoretical mechanisms are used to incentivize the truthful provisioning
    of data. According to Heiss et al. \[[3](#chapter04.xhtml#r4_3)\], however, those
    approaches address only partial aspects of the larger challenge of assuring `trustworthiness`
    in data on-chaining systems. A key property of trustworthy data on-chaining systems
    is truthfulness, which means that no execution of blockchain state transition
    is caused by untruthful data provisioning, but instead, data is always provisioned
    in a well-intended way. The challenge that derives from truthfulness is the building
    of incentive-compatible systems, where participants are assumed to act as rational
    self-interest driven `homini oeconomici`, whose primary goal is to maximize their
    individual utility via monetary rewards and penalties for their actions and behavior.


    In this chapter, we focus on the `trust game` widely studied in behavioral economics.
    The trust game hasn’t been investigated in a blockchain context yet, though it
    allows for a more systematic study of not only trust and trustworthiness but also
    reciprocity between human actors \[[4](#chapter04.xhtml#r4_4)\]. Next, we present
    a networked version of the trust game leveraging the beneficial characteristics
    of the social robots in changing players’ behavior. Toward this end, we elaborate
    on the emerging field of `robonomics`, which studies the sociotechnical impact
    of blockchain technologies on social human-robot interaction. The classical trust
    game involves only two human players referred to as trustor and trustee, who are
    paired anonymously and are both endowed with a certain amount `X` of monetary
    units. [Figure 4.1](#chapter04.xhtml#f4_1) illustrates the sequential exchange
    between trustor and trustee. The trustor can transfer a fraction `0 ≤ p ≤ 1` of
    her/his endowment to the trustee. The experimenter then multiplies this amount
    by a factor `K > 1`, e.g., doubled or tripled. The trustee can transfer a fraction
    `0 ≤ q ≤ 1` of the received amount directly back to the trustor without going
    through the experimenter. Note that the trust game captures any generic economic
    exchange between two actors. According to Alós-Ferrer and Farolfi \[[5](#chapter04.xhtml#r4_5)\],
    the trust game will remain an important instrument for the study of social capital
    and its relation to economic growth for many years to come, whereby research on
    efficient cooperation and coordination technologies will be of particular interest.


    ![FIGURE 4.1 Classical trust game involving two human players (trustor and trustee)
    and one experimenter in the middle.](images/fig4_1.jpg)


    [FIGURE 4.1](#chapter04.xhtml#b04fig4_1) Classical trust game involving two human
    players (trustor and trustee) and one experimenter in the middle.


    The remainder of the chapter is structured as follows. In “6G Vision: Blockchains
    and Robots” section, we first briefly review the 6G vision of future mobile networks,
    followed by a discussion of the challenges and benefits of blockchain in 6G networks
    paying close attention to the anticipated role of blockchain oracles and persuasive
    robots. In “Blockchain-Enabled Trust Game” section, we identify open research
    challenges of realizing a blockchain-enabled trust game, including its social
    efficiency performance and the design of suitable reward and penalty mechanisms.
    We then delve into the technical issues of implementing a smart-contract-based
    decentralized version of the classical trust game by applying basic blockchain
    technologies and validating them experimentally. “On-Chaining Oracle for Networked
    N-Player Trust Game” section explores advanced blockchain technologies, most notably
    on-chaining oracles, to facilitate equitable social efficiency in a networked
    `N`-player (i.e., multiplayer) trust game. In “Robonomics: Playing the N-Player
    Trust Game with Persuasive Robots” section, we put the `N`-player trust game in
    the context of robonomics leveraging the beneficial characteristics of robot persuasive
    strategies to foster prosocial human behavior. Finally, “Conclusions” section
    concludes the chapter.


    ## 6G VISION: BLOCKCHAINS AND ROBOTS


    ### Blockchain Benefits for 6G

    Blockchain is used to generate the large-scale index as a security measure for
    all network communication. It serves as a mutual, collective, and common ledger.
    Blockchain performs the transition from client-server to a trusted peer-to-peer
    network. According to Saad et al. \[[6](#chapter04.xhtml#r4_6)\], blockchain and
    distributed ledger technology (DLT) may be viewed as the next generation of distributed
    sensing services, whose need for connectivity will require a synergistic mix of
    ultra-reliable and low-latency communications (URLLC) and massive machine-type
    communications (mMTC) to guarantee low-latency, reliable connectivity, and scalability
    \[[7](#chapter04.xhtml#r4_7)\]. A combination of blockchain technologies and sixth
    generation (6G) communications network yield the following benefits:


    *   **Intelligent Resource Management:** According to David and Berndt \[[8](#chapter04.xhtml#r4_8)\],
    network resource management and sharing play a significant role in 6G. Resource
    management operations such as spectrum sharing, orchestration, and decentralized
    computation have to be compatible with massive infrastructure volumes. Toward
    this end, blockchain and smart contracts are anticipated to play a major role
    for self-organizing network resource management. Further, smart contracts help
    handle and automate the relationship between operators and end-users.

    *   **Security and Privacy Features:** Another important benefit is the sophisticated
    use of all 6G network resources, services, and user data without compromising
    user security and privacy \[[8](#chapter04.xhtml#r4_8)\]. In this regard, security
    and privacy-preserving solutions based on blockchain such as decentralized authentication
    and access control, data ownership, integrity, traceability, and monitoring as
    well as the self-sovereign identity (SSI) paradigm, have been emerging to provide
    users with mechanisms that enable them to become anonymous, secure, and take control
    of their personal data during digital transactions.

    *   **Trustworthy 6G Communications:** 6G will fuse the digital and physical worlds
    for the purpose of sensing the real world and integrate far-reaching applications,
    ranging from autonomous systems to extended reality \[[8](#chapter04.xhtml#r4_8)\].
    The opportunities for exploiting blockchain in 6G network infrastructures enhance
    the trustworthiness and performance gains of new services. For instance, blockchain
    can enable trusted charging and billing without centralized intermediaries. In
    addition, blockchain helps establish trusted and decentralized service level agreement
    (SLA) management given that, similar to 5G, 6G builds on virtualized and sliced
    network architectures. However, these solutions still need to be implemented at
    an extremely large scale. As a result, 6G is expected to support a very wide range
    of use cases with diverse SLA guarantees that need to be managed in a trusted
    manner.

