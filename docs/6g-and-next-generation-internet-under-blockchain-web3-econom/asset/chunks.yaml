    # Conclusions


    DOI: [10.1201/9781003427322-6](https://doi.org/10.1201/9781003427322-6)


    ## SUMMARY


    The blockchain revolution is about to flip the status quo of centralized systems
    in most industries in favor of more decentralized, transparent, open, secure,
    and efficient infrastructures. While most people view blockchain from a transactional
    perspective, there are still many salient aspects of a true blockchain that people
    have not paid particular attention to. These facets, however, are responsible
    for the nature of the technology as we know it and the reason why it’s set to
    revolutionize the way people transact with others in the near and distant future.
    Blockchain is changing our society on a fundamental level. It is transforming
    what we can do online, how we do it, and who can participate. This book examined
    the design and investigation of the pillars of human-centered blockchain technologies
    for the sixth generation (6G) era.


    This book is based on blockchain as promising underlying human-centered technologies
    on which the 6G era is envisioned to rely. In particular, we studied different
    aspects of the emerging Tactile Internet and presented in-depth technical insights
    into realizing human-in-the-loop (HITL)-centric teleoperation Tactile Internet
    over FiWi-enhanced networks, including the synergies between the Human-Agent-Robot
    Teamwork (HART) membership and the complementary strengths of robots to facilitate
    local human-machine coactivity clusters by decentralizing the Tactile Internet
    using advanced blockchain technologies. Specifically, we studied the role of the
    Ethereum decentralized autonomous organizations (DAO) and human crowdsourcing
    in helping decrease task completion time in the event of unreliable connectivity
    and/or network failures. Further, we investigated the role of behavioral economics
    games in studying trust and trustworthiness between agents. From the outcome of
    our investigation and experimentation, we showed that our considered trust game
    of behavioral economics can be enhanced using basic and advanced Ethereum blockchain
    techniques and using persuasive robots strategies borrowed from the field of robonomics.
    Finally, the book explored Society 5.0 as an important stepping stone toward realizing
    the vision of human-centered 6G mobile networks. Our focus was on exploring the
    role of the DAO, CPSS, and the future Web3 and its underlying token economy toward
    realizing collective intelligence in a stigmergic society. In the following, a
    more detailed summary of each chapter is presented.


    In [Chapter 2](#chapter02.xhtml#c02), we showed that many of the emerging blockchain
    Internet of Things (B-IoT) studies use Ethereum as the blockchain of choice and
    apply a gateway-oriented design approach to offload computationally intensive
    tasks from resource-constrained end-devices onto an intermediate gateway, thus
    enabling them to access the Ethereum blockchain network. Toward this end, we first
    explained the commonalities of and specific differences between Ethereum and Bitcoin
    blockchains followed by a description of the DAO in technically greater detail.
    We then discussed the motivation for the integration of blockchain and IoT (B-IoT)
    followed by a description of the challenges of integrating blockchain and edge
    computing. Building on our recent Tactile Internet work on orchestrating hybrid
    HART coactivities, we introduced our proposed low-latency FiWi enhanced LTE-A
