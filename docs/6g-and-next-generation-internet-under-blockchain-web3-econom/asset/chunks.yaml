    # 16G-Blockchain Vision and Research Directions


    DOI: [10.1201/9781003427322-1](https://doi.org/10.1201/9781003427322-1)


    ## Background and Motivation


    ### Evolution of Mobile Networks and Internet


    The general evolution of global mobile network standards was first to maximize
    coverage in the first and second generations and then to maximize capacity in
    the third and fourth generations. In addition to higher capacity, research on
    fifth generation (5G) mobile networks has focused on lower end-to-end latency,
    higher spectral efficiency and energy efficiency, and more connection nodes [[1](#chapter01.xhtml#r1_1)].
    More specifically, the first generation (1G) mobile network was designed for voice
    services with a data rate of up to 2.4 kbit/s. It used analog signals to transmit
    information, and there was no universal wireless standard. Conversely, second
    generation (2G) was based on digital modulation technologies and offered data
    rates of up to 384 kbit/s, supporting not only voice services but also data services
    such as short message service (`SMS`). The dominant 2G standard was the global
    system for mobile (`GSM`) communication. The third generation (3G) mobile network
    provided a data rate of at least 2 Mbit/s and enabled advanced services, including
    web browsing, TV streaming, and video services. For achieving global roaming,
    `3GPP` was established to define technical specifications and mobile standards.
    Fourth generation (4G) mobile networks were introduced in the late 2000s. 4G is
    an all-Internet Protocol (`IP`) based network, which is capable of providing high-speed
    data rates of up to 1 Gbit/s in the downlink and 500 Mbit/s in the uplink in support
    of advanced applications like digital video broadcasting (`DVB`), high-definition
    TV content, and video chat. LTE-Advanced (`LTE-A`) has been the dominant 4G standard,
    which integrates techniques such as coordinated multipoint (`CoMP`) transmission
    and reception, multiple-input multiple-output (`MIMO`), and orthogonal frequency
    division multiplexing (`OFDM`) [[2](#chapter01.xhtml#r1_2)]. The main goal of
    5G has been to use not only the microwave band but also the millimeter-wave (`mm-wave`)
    band for the first time in order to significantly increase data rates up to 10
    Gbit/s [[3](#chapter01.xhtml#r1_3)]. Another feature of 5G is a more efficient
    use of the spectrum, as measured by increasing the number of bits per Hertz [[4](#chapter01.xhtml#r1_4)].
    `ITU`’s International Mobile Telecommunications 2020 (`IMT 2020`) standard proposed
    the following three major 5G usage scenarios:


    1. Enhanced mobile broadband (`Embb`)

    2. Ultra-reliable and low latency communications (`URLLC`)

    3. Massive machine-type communications (`mMTC`) [[5](#chapter01.xhtml#r1_5)]


    One of the most interesting 5G low-latency applications is the emerging Tactile
    Internet that envisages realizing `haptic communications` and thereby enabling
    users to not only see and hear but also touch and manipulate remote physical and/or
    virtual objects through the Internet [[6](#chapter01.xhtml#r1_6), [7](#chapter01.xhtml#r1_7)].
    The Tactile Internet, which is driven by recent advancements in computerization,
    automation, and robotization, is expected to significantly augment human-machine
    interaction, thereby converting today’s content delivery networks into skillset/labor
    delivery networks [[8](#chapter01.xhtml#r1_8)–[10](#chapter01.xhtml#r1_10)]. The
    Tactile Internet holds promise to create new entrepreneurial opportunities and
    jobs, which are expected to have a profound socioeconomic impact on almost every
    segment of our everyday life with use cases ranging from augmented/virtual reality
    (`AR/VR`) and autonomous driving to healthcare and smart grid. Many of these industry
    verticals (e.g., `AR/VR`, telediagnosis, telesurgery, and telepresence) require
    very low latency and ultra-high reliability for realizing ultra-responsive interactive
    applications such as bilateral teleoperation/telepresence. Note, however, that
    some use cases which do not necessarily require mobility all the time can be realized
    over fixed broadband networks. This suggests that future cellular networks need
    to be fully converged networks, allowing for a flexible selection of different
    fixed and mobile access technologies while sharing core network functionalities
    [[11](#chapter01.xhtml#r1_11)].


    Interactive systems, including in particular `AR/VR` and teleoperation, demand
    an ultra-low round-trip latency of 1–10 ms together with high reliability. The
    high availability and security, ultra-fast and highly reliable response times
    and carrier-grade reliability of the Tactile Internet will add a new dimension
    to the interaction of humans with machines/robots. To gain a more profound understanding
    of the Tactile Internet, it may be helpful to compare it to the emerging Internet
    of Things (`IoT`) and 5G mobile networks. While the concept of `IoT` is far from
    novel and goes back to 1995, it is only recently that we are experiencing a rapidly
    increasing growth of interest in `IoT` from both industry and academia. [Figure
    1.1](#chapter01.xhtml#f1_1) depicts the revolutionary leap of the Tactile Internet
    in compliance with the `ITU-T`!


    ![FIGURE 1.1 Revolutionary leap of the Tactile Internet in compliance with ITU-T
    Technology Watch Report.](images/fig1_1.jpg)


    [FIGURE 1.1](#chapter01.xhtml#b01fig1_1) Revolutionary leap of the Tactile Internet
    in compliance with `ITU-T` Technology Watch Report.


    The difference between the Tactile Internet and `IoT` may be best expressed in
    terms of underlying communications paradigms and enabling end devices. The Tactile
    Internet involves the inherent human-in-the-loop (`HITL`) nature of human-to-machine
    interaction, whereas the `IoT` is centered around autonomous machine-to-machine
    (`M2M`) communications without any interaction with humans. The Tactile Internet
    relies on human-to-machine/robot (`H2M/R`) interaction and thus allows for a human-centric
    design approach towards creating novel immersive experiences, expanding humans’
    capabilities through the Internet. Furthermore, the Tactile Internet may be viewed
    as an extension of immersive `VR` from a virtual to a physical environment. It
    allows for the tactile steering and control of not only virtual but also real
    objects, e.g., teleoperated robots. The boundary between virtual (i.e., online)
    and physical (i.e., offline) worlds is to become increasingly imperceptible, while
    both digital and physical capabilities of humans are to be extended via edge computing
    variants, ideally with embedded artificial intelligence (`AI`) capabilities.

