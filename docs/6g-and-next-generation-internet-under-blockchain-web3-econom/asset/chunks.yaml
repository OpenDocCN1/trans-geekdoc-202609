  trans: "\n\n预言机数据源涵盖：(*i*) `软件预言机`，数据来自在线源（例如，在线网络服务器或数据库）；(*ii*) `硬件预言机`，数据来自物理世界（例如，IoT\
    \ 设备、机器人）；以及(*iii*) `人类预言机`，即由一个在特定领域具有专业知识/技能的个人充当预言机角色。他们可以研究并验证来自各种来源的信息的真实性，并将这些信息翻译成智能合约。由于人类预言机可以使用密码学验证其身份，欺诈者伪造身份并提供损坏数据的概率非常低。\n\
    \n信息方向意味着信息流向的方式，即相对于数据流发起者，信息是从外部资源流入还是指向外部资源。为此，这些选项有四种组合：(*i*) `基于拉取的入站预言机\
    \ (pull-based inbound oracle)`，当链上组件向链外组件请求链外状态时；(*ii*) `基于拉取的出站预言机 (pull-based\
    \ outbound oracle)`，当链外组件从链上组件获取链上状态时；(*iii*) `基于推送的入站预言机 (push-based inbound\
    \ oracle)`，当链外组件将链外状态发送到链上组件时；(*iv*) `基于推送的出站预言机 (push-based outbound oracle)`，当链上组件将链外状态发送到链外组件时。\n\
    \n此外，存在信任的概念，它可以是中心化的或去中心化的。`中心化预言机`效率很高，但它们存在风险，因为由单一实体提供信息并控制预言机，一旦故障，会导致合约对漏洞和攻击的韧性降低。相比之下，`去中心化预言机`（即基于共识的预言机）通过查询多个资源增加了提供给智能合约信息的可靠性。需要注意的是，如果一个预言机是无许可的，用户可以加入或离开，且每个用户都拥有平等权利，则它被认为是去中心化的\
    \ [41]。最后，预言机设计模式定义为(*i*) `请求-响应 (request-response)`，当数据空间巨大且可以实现为链上智能合约，并通过链上或链外预言机启动以监控、检索和返回数据；(*ii*)\
    \ `发布-订阅 (publish-subscribe)`，当数据预计会变化时，例如实时简单摘要 (RSS) 馈送；以及(*iii*) `立即读取 (immediate\
    \ read)`，当需要立即做出决策时。\n\n存在许多实现入站预言机的商业和开源工具。`Orisi` \n\n`Reality Keys` 提供了自动化和人类驱动的基于拉取的入站预言机的组合\
    \ [42]。`Chainlink`\n\n区块链入站预言机也已经在多项研究工作中被考虑过。Xu 等人引入了`验证预言机 (validation oracles)`\
    \ 的概念，即作为入站预言机的受信第三方操作节点（自动或人工）[44]。作者区分了内部预言机（定期向区块链传输经过外部验证的数据）和外部预言机（基于区块链外部信息，作为交易的可信外部验证者进行运行）。根据我们的方案，我们看到前者是基于推送的，而后者是基于拉取的。预言机领域的开创性研究工作之一是\
    \ Adler 等人引入的 `ASTRAEA` 被介绍为一种去中心化的基于拉取的入站预言机服务 [45]。该实现提供了一个投票游戏，用于决定命题的真伪或错误。玩家可以是投票者或认证者。虽然认证者在需要高准确性的情况下发挥作用，但投票者被用于低风险/低回报的角色。Zhang\
    \ 等人提出了 `Town Crier`，这种基于推送的入站预言机像一个数据馈系统，连接了区块链与抓取安全网站的后端[46]。\n\n更有趣的是，Heiss\
    \ 等人为链上可信数据提供了一系列关键需求，并解释了面临的挑战及其解决方案 [47]。他们认为，除了分布式系统的特征——安全性和活性之外，真实性也是必要的，因为它可以防止由于虚假数据提供而执行的区块链状态转换。基于这些属性，对每种属性的挑战被定义为可用性、正确性和激励兼容性。激励兼容性包含两个关键特征：(i)\
    \ 可归因性 (attributability)，即将数据映射到源提供者，并根据其行为对数据源进行奖励或惩罚；(ii) 可问责性 (accountability)，定义为在提供数据之前质押保证金，并在提供真实数据后退还。正确性由真实性和完整性组成，前者分别处理对数据源的批准，后者则显示数据在转换过程中不应被篡改。最后，活性\
    \ (liveness) 指可可用性和可访问性，前者意味着系统的可用性应与其不可用的组件一样，即停机时间应保持极低。后者意味着数据在任何时候都是可访问的。\n\
    \n### 代币工程\n\n代币随着 `Web3` 的引入而出现 [34]。Web1 让所有人分享想法，Web2 允许社区形成并讨论这些想法，而 Web3\
    \ 则让这些社区利用金融资本，从讨论转向实际行动。从核心上说，代币是分布式账本中的条目，分配给区块链账户，交易需要授权，从而确保真实性并防止未经许可的篡改。代币可以使用扩展或实例化的币模板进行定制设计。代币可以被理解为区块链上的资产，可以通过以太坊地址和特殊的智能合约进行存储或管理。以太坊上存在多种类型的代币，通常用于\
    \ DApp 并遵循现有的标准。最流行的代币标准描述如下：\n\n*   `ERC-20 标准`\n*   `ERC-721 标准`\n*   `ERC-1155\
    \ 标准`\n\n## 从工业 4.0 指向社会 5.0\n\n### 物理信息社会系统 (CPSS)\n\n工业 4.0 下的智能工厂具有许多优势，例如资源的最优，但也意味着制造过程中的人工干预最少。当人类在社会、认知和物理层面功能性地集成到物理信息系统\
    \ (CPS) 中时，它变成了所谓的物理信息社会系统 (CPSS)，其成员可以参与 CPS 行为，最终实现具有各种超能力的元人类。\n\n"
- fmt: '

    Recently, in January 2021, the European Commission released the first edition
    of their policy brief on Industry 5.0 \[[48](#chapter01.xhtml#r1_48)\]. Industry
    5.0 will be defined by a re-found and widened purposefulness, going beyond producing
    goods and services for profit. A purely profit-driven approach has become increasingly
    untenable. In a globalized world, a narrow focus on profit fails to account correctly
    for environmental and societal costs and benefits. Further, crises such as the
    Covid-19 pandemic highlighted the fragility of our current approach to globalized
    production, especially where value chains serve basic human needs, e.g., healthcare.
    This wider purpose constitutes three core elements: (i) human-centricity, (ii)
    sustainability, and (iii) resilience.


    One of the most important paradigmatic transitions characterizing Industry 5.0
    is the shift of focus from technology-driven progress to a thoroughly human-centric
    approach. An important prerequisite for Industry 5.0 is that technology serves
    people, rather than the other way around, by expanding the capabilities of workers
    (up-skilling and re-skilling) with innovative technological means such as `VR/AR`
    tools, mobile robots, and exoskeletons.


    Currently, two visions emerge for Industry 5.0. The first one is human–robot co-working,
    where humans will focus on tasks requiring creativity, and robots will do the
    rest. The second vision for Industry 5.0 is bioeconomy, i.e., a holistic approach
    toward the smart use of biological resources for industrial processes \[[50](#chapter01.xhtml#r1_50)\].
    The bioeconomy has established itself worldwide as a mainstay for achieving a
    sustainable economy. Its success is based on our understanding of biological processes
    and principles that help revolutionize our economy dominated by fossil resources
    and create a suitable framework so that the economy, ecology, and society are
    perceived as necessary single entities and not as rivals. More specifically, biologization
    will be the guiding principle of the bioeconomy. Biologization takes advantage
    of nature’s efficiency for economic purposes—whether they be plants, animals,
    residues, or natural organisms. Almost every discipline shares promising interfaces
    with biology. In the long term, biologization will be just as significant as a
    cross-cutting approach as digitalization already is today. Biologization will
    pave the way for Industry 5.0 in the same way as digitalization triggered Industry
    4.0. It is also obvious that the two trends—biologization and digitalization—will
    be mutually beneficial \[[51](#chapter01.xhtml#r1_51)\].


    It is interesting to note that in \[[48](#chapter01.xhtml#r1_48)\], the authors
    also elaborate on the relation between the concepts of Industry 5.0 and Society
    5.0. While both concepts are related in the sense that they refer to a fundamental
    shift of our society and economy towards a new paradigm, Society 5.0 is not restricted
    to the manufacturing sector but addresses larger social challenges based on the
    integration of physical and virtual spaces. In the subsequent sections, we further
    elaborate on the Society 5.0 vision and present an illustrative use case of biologization.


    ## Society 5.0


    The Industrial Revolution reduced the agricultural population from more than 90
    percent to less than 5 percent. Similarly, the IT revolution reduced the manufacturing
    population from more than 70 percent to approximately 15 percent. The Intelligence
    Revolution of the `6G` era will reduce the entire service population to less than
    10 percent. Upon the question of where will people go and what will they do then,
    the author of \[[52](#chapter01.xhtml#r1_52)\] gives the following answer: Gaming!
    Not leisure, but scientific gaming in cyberspace. Artificial societies, computational
    experiments, and parallel execution—the so-called `ACP` approach—may form the
    scientific foundation, while `CPSS` platforms may be the enabling infrastructure
    for the emergence of intelligent industries. In the `ACP` approach, intelligent
    industries will build all kinds of artificial societies, organizations, and systems
    in order to perform different types of computational experiments and conduct numerous
    scientific games for analyzing, evaluating, and optimizing decision-making processes,
    as well as mastering skills and resources required for the completion of tasks
    in the shortest time with the least energy and cost through the parallel execution
    of and interaction between real and artificial dual entities, who we can play,
    work, and live with. Everything will have its parallel avatar or digital twin
    in cyberspace, such that we can conduct numerous scientific games before any major
    decision or operation. This new, yet unknown `CPSS`-enabled connected lifestyle
    and working environment will eventually lead to high satisfaction as well as enhanced
    capacity and efficiency. Further, the author of \[[52](#chapter01.xhtml#r1_52)\]
    foresees that the Multiverse or parallel universes based on Hugh Everett’s many-worlds
    interpretation (`MWI`) of quantum physics will become a reality in the age of
    complex space infrastructures with the emergence of intelligent industries, which
    calls for a new profession of scientific game engineers. However, he warns that
    the capability of `CPSS` to collect tremendous energy from the masses through
    crowdsourcing in cyberspace and then release it into physical space can bring
    both favorable and unfavorable consequences. Therefore, one of the critical research
    challenges is the human-centric construction of complex spaces based on `CPSS`.


    Similar to Industry 4.0/5.0, Society 5.0 merges the physical space and cyberspace
    by leveraging `ICT` to its fullest and applying not only social robots and embodied
    AI but also emerging technologies such as ambient intelligence, `VR/AR`, and advanced
    human–computer interfaces (`HCIs`). However, Society 5.0 counterbalances the commercial
    emphasis of Industry 4.0. If the Industry 4.0 paradigm is understood as focusing
    on the creation of the smart factory, Society 5.0 is geared toward creating the
    world’s first supersmart society. More interestingly, according to Hitachi-UTokyo
    \[[22](#chapter01.xhtml#r1_22)\], Society 5.0 also envisions a paradigm shift
    from conventional monetary to future non-monetary economies based on technologies
    that can measure activities toward human co-becoming that have no monetary value.


    The relationship between Society 5.0 and past societies on the one hand and Industry
    4.0 on the other hand was described in more detail in Hitachi-UTokyo Laboratory,
    2020 \[[22](#chapter01.xhtml#r1_22)\]. While the focus of Society 4.0 was on building
    an information society via `ICT` for the purpose of increasing profitability,
    Society 5.0’s main goal is to merge cyberspace and physical space for the purpose
    of advancing humanity. Society 5.0 seeks to revolutionize not only the industry
    through `ICT` but also the living spaces and habits of the public.

