- fmt: '

    This conclusion is echoed by Max Borders through his concept of the `social singularity`
    that defines the point beyond which humanity will operate much like a hive mind,
    i.e., `CI`. Currently, two separate processes are racing forward in time: (*i*)
    the technological singularity: Machines are getting smarter (e.g., machine learning
    and `AI`), and (*ii*) the social singularity: Humans are getting smarter. In fact,
    he argues that these two separate processes are two aspects of the same underlying
    process waiting to be woven together toward creating new `human-centric` industries.
    More and more, we’ll act like bees to get big things done, whereby humans act
    as neurons in a human hive mind with blockchain technology acting as connective
    tissue to create virtual pheromone trails, i.e., programmable incentives.


    Ever since the beginning of industrialization, three industrial revolutions have
    been experienced with the development of steam engines (mid-18–19th century),
    electrification (1870 onward), and digitization (1970 onward), respectively. The
    current fourth industrial revolution has been enabled through the Internet of
    Things (`IoT`) in association with other emerging technologies, most notably cyber-physical
    systems (`CPS`). `CPS` help bridge the gap between manufacturing and information
    technologies and give birth to the smart factory. This technological evolution
    ushers in the `Industry 4.0` as a prime agenda of the High-Tech Strategy 2020
    Action Plan taken by the government of Germany, the Industrial Internet from General
    Electric in the United States of America, and the `Internet+` from China. A human-centered
    approach that puts humans in the loop of today’s `CPS` is the `Society 5.0` initiative
    of the 5th Science and Technology Basic Plan taken by the government of Japan
    [[2](#chapter05.xhtml#r5_2)]]. By functionally integrating human beings at the
    social, cognitive, and physical levels, `CPS` become so-called `cyber-physical-social
    systems (CPSS)` [[3](#chapter05.xhtml#r5_3)]].


    *Members*` of `CPSS` may engage in a wide variety of cyber-physical-social behaviors.
    The human-centeredness of `Society 5.0` was recently investigated in technically
    greater detail in Gladden [[4](#chapter05.xhtml#r5_4)]]. Gladden [[4](#chapter05.xhtml#r5_4)]
    describes the goal of `Society 5.0` as the ability to create equal opportunities
    for all and to provide an environment that helps unleash the full potential of
    each individual. To do so, `Society 5.0` will leverage on emerging Information
    and Communications Technology (`ICT`) to its fullest such that social barriers
    to each individual’s self-realization are removed. For illustration, [Fig. 5.1](#chapter05.xhtml#f5_1)
    depicts the transition from past to future societies and their co-evolution with
    industry [[4](#chapter05.xhtml#r5_4)–[6](#chapter05.xhtml#r5_6)]].


    ![FIGURE 5.1 Co-evolution of Society and industry toward Society 5.0 [4, 5, 6].](images/fig5_1.jpg)


    [FIGURE 5.1](#chapter05.xhtml#b05fig5_1) Co-evolution of Society and industry
    toward Society 5.0 [[4](#chapter05.xhtml#r5_4), [5](#chapter05.xhtml#r5_5), [6](#chapter05.xhtml#r5_6)]].


    Similar to `Industry 4.0`, `Society 5.0` aims at seamlessly fusing the digital
    and physical worlds by using social robots, ambient intelligence, advanced human-computer
    interfaces (`HCI`), embodied AI, and various flavors of extended reality (`XR`),
    among others (see also [Fig. 5.1](#chapter05.xhtml#f5_1)). However, `Society 5.0`
    tries to counterbalance the commercial emphasis of `Industry 4.0`. Toward this
    end, the overarching goal of `Society 5.0` will be the creation of the world’s
    first super-smart society. Conversely, the focus of `Industry 4.0` has been the
    creation of a smart factory that is fully automated and thus requires minimum
    human presence on-site. More interestingly, `Society 5.0` also envisions a paradigm
    shift from conventional monetary to future nonmonetary economies based on technologies
    that can measure activities toward human co-becoming that have no monetary value
    (to be explained shortly in the context of `tokenomics*) [[7](#chapter05.xhtml#r5_7)]].


    It is interesting to note that the aforementioned `Society 5.0` vision aligns
    surprisingly well with the far-reaching vision of future `6G` networks. `6G` is
    anticipated to be more human-centered than fifth generation (`5G`), which primarily
    focused on industry verticals such as smart grids or smart cities, as outlined
    in the world’s first `6G` white paper of the `6GFP`. Maier [[8](#chapter05.xhtml#r5_8)]
    illustrated the potential of `CPSS` by presenting two prominent 5/6G examples
    of human-in-the-loop centric systems. The first one is the Tactile Internet, which
    is widely viewed as one of the most interesting `5G` low-latency applications
    [[9](#chapter05.xhtml#r5_9)]]. The second one is the future Internet of No Things,
    which serves as an important stepping stone toward ushering in the `6G` post-smartphone
    era [[10](#chapter05.xhtml#r5_10)]]. Arguably more important, we also elaborated
    on `robonomics`, an emerging field in the `6G` era, and the role advanced blockchain
    technologies play in realizing the `Society 5.0` vision.


    In this chapter, we build on our recent work on `robonomics` in the `6G` era.
    We aim at exploring advanced blockchain technologies that enable the next-generation
    Internet known as `Web3`, which leverages the concept of `tokenization*` as a
    process for converting an item of value into digital tokens. Tokenization digitally
    encapsulates assets as well as access rights and permissions in the physical and
    digital world into units called tokens. We investigate the design of purpose-driven
    tokens to facilitate collaboration by incentivizing an autonomous group of people
    to contribute to Society 5.0. Toward this end, we first present our CPSS-based
    bottom-up token engineering framework, putting a particular focus on the key role
    of its incentive mechanism in token design. We then explore the concept of `indirect
    communication` to maintain social cohesion by the coupling of social and environmental
    organization via traces in stigmergy-enhanced Society 5.0, while steering its
    collective behavior toward creating public goods.


    The remainder of the chapter is structured as follows. “Society 5.0: From Robonomics
    to Tokenomics” section elaborates on the role of robonomics and tokenomics in
    Society 5.0. In “the Path (DAO) to a Human-Centered Society” section, we outline
    our proposed path to a human-centered society and explain purpose-driven tokens
    and token engineering in technically greater detail. Further, we introduce our
    CPSS-based bottom-up multilayer token engineering framework for Society 5.0. “From
    Superorganism to Stigmergic Society and Collective Intelligence in the 6G Era”
    section, we explain how our proposed framework can be applied to advance human
    collective intelligence in the 6G era. “Implementation and Experimental Results”
    section describes its experimental implementation and highlights some illustrative
    results. Finally, “Conclusions” section concludes the chapter.


    ## SOCIETY 5.0: FROM ROBONOMICS TO TOKENOMICS


    Cardenas and Kim [[11](#chapter05.xhtml#r5_11)] provided insights into how blockchain
    and other decentralized technologies have an impact on the interaction of humans
    with robot agents and their social integration into human society. Toward this
    end, blockchain technologies can serve as a ledger, where robots and humans may
    access and record anything of value, such as ownership titles or financial transactions.
    Further, smart contracts help encode the self-enforceable and self-verifiable
    agreement logic between a robot and a human. Cryptocurrencies may be used to allow
    robots to hold financial obligations and enter into exchanges of value with a
    human, and vice versa.

