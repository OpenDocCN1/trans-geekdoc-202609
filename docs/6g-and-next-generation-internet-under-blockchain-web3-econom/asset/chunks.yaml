  raw: "        Recently, in January 2021, the European Commission released the first\
    \ edition of their policy brief on Industry 5.0 \\[[48](#chapter01.xhtml#r1_48)\\\
    ]. Industry 5.0 will be defined by a re-found and widened purposefulness, going\
    \ beyond producing goods and services for profit. A purely profit-driven approach\
    \ has become increasingly untenable. In a globalized world, a narrow focus on\
    \ profit fails to account correctly for environmental and societal costs and benefits.\
    \ Further, crises such as the Covid-19 pandemic highlighted the fragility of our\
    \ current approach to globalized production, especially where value chains serve\
    \ basic human needs, e.g., healthcare. This wider purpose constitutes three core\
    \ elements: (i) human-centricity, (ii) sustainability, and (iii) resilience.\n\
    \n        One of the most important paradigmatic transitions characterizing Industry\
    \ 5.0 is the shift of focus from technology-driven progress to a thoroughly human-centric\
    \ approach. An important prerequisite for Industry 5.0 is that technology serves\
    \ people, rather than the other way around, by expanding the capabilities of workers\
    \ (up-skilling and re-skilling) with innovative technological means such as VR/AR\
    \ tools, mobile robots, and exoskeletons.\n\n        Currently, two visions emerge\
    \ for Industry 5.0. The first one is human–robot co-working, where humans will\
    \ focus on tasks requiring creativity, and robots will do the rest. The second\
    \ vision for Industry 5.0 is bioeconomy, i.e., a holistic approach toward the\
    \ smart use of biological resources for industrial processes \\[[50](#chapter01.xhtml#r1_50)\\\
    ]. The bioeconomy has established itself worldwide as a mainstay for achieving\
    \ a sustainable economy. Its success is based on our understanding of biological\
    \ processes and principles that help revolutionize our economy dominated by fossil\
    \ resources and create a suitable framework so that the economy, ecology, and\
    \ society are perceived as necessary single entities and not as rivals. More specifically,\
    \ biologization will be the guiding principle of the bioeconomy. Biologization\
    \ takes advantage of nature’s efficiency for economic purposes—whether they be\
    \ plants, animals, residues, or natural organisms. Almost every discipline shares\
    \ promising interfaces with biology. In the long term, biologization will be just\
    \ as significant as a cross-cutting approach as digitalization already is today.\
    \ Biologization will pave the way for Industry 5.0 in the same way as digitalization\
    \ triggered Industry 4.0. It is also obvious that the two trends—biologization\
    \ and digitalization—will be mutually beneficial \\[[51](#chapter01.xhtml#r1_51)\\\
    ].\n\n        It is interesting to note that in \\[[48](#chapter01.xhtml#r1_48)\\\
    ], the authors also elaborate on the relation between the concepts of Industry\
    \ 5.0 and Society 5.0. While both concepts are related in the sense that they\
    \ refer to a fundamental shift of our society and economy towards a new paradigm,\
    \ Society 5.0 is not restricted to the manufacturing sector but addresses larger\
    \ social challenges based on the integration of physical and virtual spaces. In\
    \ the subsequent sections, we further elaborate on the Society 5.0 vision and\
    \ present an illustrative use case of biologization.\n\n        ### Society 5.0\n\
    \n        The Industrial Revolution reduced the agricultural population from more\
    \ than 90 percent to less than 5 percent. Similarly, the IT revolution reduced\
    \ the manufacturing population from more than 70 percent to approximately 15 percent.\
    \ The Intelligence Revolution of the 6G era will reduce the entire service population\
    \ to less than 10 percent. Upon the question of where will people go and what\
    \ will they do then, the author of \\[[52](#chapter01.xhtml#r1_52)\\] gives the\
    \ following answer: Gaming! Not leisure, but scientific gaming in cyberspace.\
    \ Artificial societies, computational experiments, and parallel execution—the\
    \ so-called ACP approach—may form the scientific foundation, while CPSS platforms\
    \ may be the enabling infrastructure for the emergence of intelligent industries.\
    \ In the ACP approach, intelligent industries will build all kinds of artificial\
    \ societies, organizations, and systems in order to perform different types of\
    \ computational experiments and conduct numerous scientific games for analyzing,\
    \ evaluating, and optimizing decision-making processes, as well as mastering skills\
    \ and resources required for the completion of tasks in the shortest time with\
    \ the least energy and cost through the parallel execution of and interaction\
    \ between real and artificial dual entities, who we can play, work, and live with.\
    \ Everything will have its parallel avatar or digital twin in cyberspace, such\
    \ that we can conduct numerous scientific games before any major decision or operation.\
    \ This new, yet unknown CPSS-enabled connected lifestyle and working environment\
    \ will eventually lead to high satisfaction as well as enhanced capacity and efficiency.\
    \ Further, the author of \\[[52](#chapter01.xhtml#r1_52)\\] foresees that the\
    \ Multiverse or parallel universes based on Hugh Everett’s many-worlds interpretation\
    \ (MWI) of quantum physics will become a reality in the age of complex space infrastructures\
    \ with the emergence of intelligent industries, which calls for a new profession\
    \ of scientific game engineers. However, he warns that the capability of CPSS\
    \ to collect tremendous energy from the masses through crowdsourcing in cyberspace\
    \ and then release it into physical space can bring both favorable and unfavorable\
    \ consequences. Therefore, one of the critical research challenges is the human-centric\
    \ construction of complex spaces based on CPSS.\n\n        Similar to Industry\
    \ 4.0/5.0, Society 5.0 merges the physical space and cyberspace by leveraging\
    \ ICT to its fullest and applying not only social robots and embodied AI but also\
    \ emerging technologies such as ambient intelligence, VR/AR, and advanced human–computer\
    \ interfaces (HCIs). However, Society 5.0 counterbalances the commercial emphasis\
    \ of Industry 4.0. If the Industry 4.0 paradigm is understood as focusing on the\
    \ creation of the smart factory, Society 5.0 is geared toward creating the world’s\
    \ first supersmart society. More interestingly, according to Hitachi-UTokyo Laboratory\
    \ \\[[22](#chapter01.xhtml#r1_22)\\], Society 5.0 also envisions a paradigm shift\
    \ from conventional monetary to future non-monetary economies based on technologies\
    \ that can measure activities toward human co-becoming that have no monetary value.\n\
    \n        The relationship between Society 5.0 and past societies on the one hand\
    \ and Industry 4.0 on the other hand was described in more detail in Hitachi-UTokyo\
    \ Laboratory, 2020 \\[[22](#chapter01.xhtml#r1_22)\\]. While the focus of Society\
    \ 4.0 was on building an information society via ICT for the purpose of increasing\
    \ profitability, Society 5.0’s main goal is to merge cyberspace and physical space\
    \ for the purpose of advancing humanity. Society 5.0 seeks to revolutionize not\
    \ only the industry through ICT but also the living spaces and habits of the public.\
    \ Society 5.0 focuses heavily on the public impact of technology and aspires to\
    \ create a supersmart society, thus requiring metrics that are much more complex\
    \ than those used in Industry 4.0, whose focus centers on minimizing manufacturing\
    \ costs without taking social issues into account."
