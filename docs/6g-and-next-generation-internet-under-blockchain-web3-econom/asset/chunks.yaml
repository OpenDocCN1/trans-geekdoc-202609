    一个催使人类和机器智能跨越互联网迈向一种新型自组织通用人工智能（AGI）形式的极非常有趣的例子，就是所谓的 `SingularityNET`（[`singularitynet.io`](https://singularitynet.io)）。可以将
    SingularityNet 视为一个`去中心化自组织合作体 (DSOC)`，该概念类似于 `DAO`。`DSOC` 本质上是一种用于创建新类型智能合约的分布式计算架构。执行这些智能合约的实体被称为代理（agents），它们可以在云端、手机、机器人或其他嵌入式设备上运行。服务通过智能合约启用的
    `APIs` 向任何客户提供，并可能需要多个代理利用其集体智能采取组合动作。通常，可能有多个代理能够以不同的方式和不同程度完成给定的任务请求。发送到网络的每个任务请求都需要代理的独特组合，从而形成了一个相互依赖的“提议网络”，其中代理之间通过“提议-请求对”相互提供提议以交换服务。每当有人想要代理执行服务时，就会为该特定任务签署一份智能合约。为此，`DSOC`
    旨在通过卓越的发现机制寻找有用的代理，并“引导”（nudging）它们成为贡献者，从而利用尽可能广泛代理的贡献。


    ### 助推合约：通过智能合约进行引导


    在 `DSOC` 和“引言”部分引入的裁判合约的基础上，我们开发了一种`助推合约`，以增强 `DAO` 中无技能群体成员的人类能力。根据 2017 年诺贝尔经济学奖得主
    Richard H. Thaler 的说法，助推（nudge）定义为选择架构的任何方面，它能以可预测的方式改变人们的行为，而又不禁止任何选项或显著改变他们的经济激励。如果部署当，助推可以引导人——而不是像传统的触觉互联网中那样引导物理或虚拟对象——来使他们做出更好的选择，并对各种类型的人群产生积极影响。


    ### 结果


    我们的助推合约旨在通过向熟练的 `DAO` 成员学习完成中断的物理任务，目标是最小化学习损失（学习损失指的是可执行任务时间与最优执行时间之间的差异）。给定助推合约启用并与每种传输技能相关的奖励，远程熟练的
    `DAO` 成员向无技能的人类/机器人提交学习指令的哈希地址。该哈希地址存储在区块链上，相应的学习指令数据可能存储在远程去中心化存储服务器上，例如星际文件系统（`IPFS`）。


    ![images/fig3_4.jpg)


    图 3.4 学习损失（秒）对比子任务数量 `n[sub]` 和遍历时间 `ttraverse` 的子任务学习概率。


    ### 结论


    在本章中，我们探索了如何利用以太坊区块链技术，特别是 `DAO` 来触觉互联网的去中心化，这使得感知实时远程引导物理或虚拟对象/过程提供了前所未有的移动应用，并代表了未来技术社会系统的一个良好示例。我们证明，通过将计算卸载概率设置为
    `0.7`，AI 增强型 `MEC` 的更高去中心化可以将平均计算任务完成时间缩短高达 89.5%。此外，我们观察到，对于中高反馈预测误差概率，只要人类提供等同甚至更优的操作能力（即
    $\frac{f_{human}}{f_{robot}} \geq 1$），众包人类协助有助于减少物理任务的平均完成时间。为此，我们提出的助推合约试图通过故障机器人与熟练人类之间的共享智能来成功完成任务。一个值得探索的研究方向是不仅将计算任务卸载到
    `MEC` 服务器上，还卸载到利用率不足的邻近终端用户，这种方法被称为移动自接云（mobile ad hoc cloud）。


