    回想“社会 5.0：从机器人经济学到代币经济学”章节，对于代币设计，在[14]中提出了一种多层 DAO 参考模型，尽管该模型刻意保持了通用性，与社会 5.0
    无任何特定关系。DAO 参考模型的自下而上架构由以下五层组成：(*i*)基础技术、(*ii*)治理运营、(*iii*)激励机制、(*iv*)组织形式和(*v*)表现形式。由于空间限制，我们建议感兴趣的读者参阅[14]以获取有关通用
    DAO 参考模型的更多信息以及对每一层的更详细描述。在下文中，我们将通用 DAO 参考模型适配到社会 5.0 的特定需求，并重点介绍我们在基于 CPSS 的自下而上代币工程
    DAO 框架中中所做的修改。


    图 5.3 描绘了我们为社会 5.0 提出的多层代币工程 DAO 提框架，该框架构建在先进的 CPSS 之上。物联网作为主要的 CPS（信息物理系统）示例已经开启了工业
    4.0，而在“引言”中简要提到的先进的 CPSS（如未来的“无物物联网”）将成为开启社会 5.0 的关键。正如在[10]中详细解释的那样，无物物联网为数字世界与现实世界的融合创建了一个融合平台，提供各种人类意图的服务，而无需拥有或携带任何类型的计算或存储设备。它设想让互联网服务在需要时从*周围环境*中出现，在不需要时消失。从目前基于设备的设备的互联网向无物物联网的过渡分为三个阶段：(*i*)可携带设备（例如智能手机）、(*ii*)可穿戴设备（例如
    Google 和 Levi''s 的智能夹克），最后最后是(*iii*)近场设备（nearables）。近场设备指的是附近的计算/存储技术和业务提供机制，它们足够智能，能够*根据用户的上下文和历史进行学习和反应*，以提供用户意图的服务。图
    5.3 底部的基础技术层说明了无物物联网底层的关键赋能技术（例如区块链）。此外，该层包含了未来技术，最显著的是生物工程，预计这些技术将在未来的超智能社会 5.0
    中发挥日益重要的作用（另见图 5.1）。


    ![FIGURE 5.3 基于 CPSS 的社会 5.0 自下而上代币工程 DAO 框架](img/fig5_3.jpg)


    图 5.3 基于 CPSS 的社会 5.0 自下而上代币工程 DAO 框架。


    在基础技术层之上，存在治理运营层。通常情况下，该层通过智能合约（例如投票）编码共识，并通过链上和链下协作（链上预言机）实现 DAO 的自治理。此外，该层包括通过智能合约实现的助推机制（助推合约）、集体决策以及成员之间的知识共享。激励机制层涵盖了上述与代币相关的技术及其为了促进代币工程而进行的恰当对齐。接下来，组织形式层包括在提议的
    DAO 项目整个生命周期内的投票过程和成员身份。请注意，在经济学中，带有受监管访问权（如成员身份）的公共物品被称为*俱乐部货物*（club goods）。


    最后，表现层允许成员采取简单的、局部独立的行动，这些行动共同导致 DAO 以及整个社会 5.0 复杂自适应系统行为的出现。由于其与去中心化区块链技术具有惊人的相似性，我们探索了在蚂蚁和蜜蜂等社会性昆虫社会中广泛存在的生物信息迹（stigmergy）机制的潜力，特别是它们通过成员在环境中创建气味*痕迹*（traces）进行自组织和间接协调的内在能力。感知到这些痕迹后，其他社会成员受到刺激执行后续动作，从而以一种自持续的自催化方式强化痕迹，而不需要任何中央控制实体，正如下文“从超有机体到信息迹社会以及
    6G 时代的集体智能”章节中所解释的那样。


    ### 人对人的利用：控制论与社会


    将基于 Web2 的社交网络迁移到 Web3 的一个显著例子是 Facebook 在 2019 年 6 月的最近公告，宣布推出一种新基础设施来管理他们命名为*Libra*（后更名为
    Diem）的代币，包括用于与法定货币交换的适当价格稳定机制。然而，代币化货币的设计不足以实现社会 5.0 的愿景。为了说明这一点，请注意包括前高管在内的人开始公开质疑社交媒体对我们生活的影响，并公开了他们帮助创建了我们今天所知的社交媒体的遗憾。


    更多以人为中心的解决方案的有用提示可以在控制论的起源中找到。在他开基性的著作《人对人的利用：控制论与社会》中，控制论的创始人诺伯特·维纳（Norbert Wiener）认为，根据控制原理工作的机器的危险在于，它们可能被人类或人类用来增加对其他人类的控制。为了避免这种重重危险，维纳强调了人类学家（例如[4]）和哲学的需求。他假设科学家必须了解人类的本质及其内在目标，并认为通过反馈环路的*内部通信*对于社会的福利至关重要。


    ## 从超有机体到信息迹社会以及 6G 时代的集体智能


    在本节中，我们通过从社会性昆虫群体观察到的具有类脑认知能力的生物超有机体中借鉴灵感，探索如何在社会 5.0 中实现上述内部通信的完整性。信息迹（stigmergy，源自希腊语*stigma*“符号”和*ergon*“工作”）由法国动物学家皮埃尔·保罗·格拉斯（Pierre-Paul
    Grassé）于 1959 年首次引入，是一种自组织机制，使其能够对其矛盾的观察提供优雅的解释：在社会性昆虫群体中，个体像独自工作一样工作，但它们的集体活动似乎是协调的。在信息迹中，个体在环境中留下痕迹，这些痕迹会对它们产生反馈，从而激发其后续动作。群体通过各种形式的存储在环境中记录活动，并利用这些记录通过反馈环组织并约束集体行为，从而产生了间接的概念。因此，信息迹通过环境和社会组织的耦合维持了社会凝聚力。请注意，对于社会生活的进化，从孤独到社会生活的路径可能并没有想象的那么复杂。事实上，在人工智能的群体智能子领域（例如群体机器人），信息迹被广泛认为是关键概念之一。


    在下文中，我们说明图 5.3 中基于 CPSS 的代币工程 DAO 框架如何应用于社会 5.0，并描述相关的、目标驱动代币和机制的自下而上设计步骤：


    *   **第 1 步：明确目标**


