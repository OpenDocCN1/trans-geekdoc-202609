    # 区块链、人工智能与人类智能 *通往 6G 的之路*


    DOI: [10.1201/9781003427322-](https://doi.org/10.1201/9781003427322-)


    ## 引言


    互联网一直在从移动互联网转向物联网（IoT）和未来的触觉互联网。同样，未来 5G 网络的能力将远超前几代通信。除了区域容量提升 1000 倍、峰值速率达到
    10 Gb/s 以及至少 1000 亿设备的连接外，5G 愿景的一个重要方面是*去中心化*。虽然 2G、3G 和 4G 蜂窝网络是在基础设施完全控制的假设下构建的，5G
    系统可能会放弃这一假设并演变为去单元化的架构。


    5G、物联网和触觉互联网在设计目标上存在显著重叠——最值得注意的是极可靠低时延通信（URLLC），这需要协同工作来保证低延迟和可靠性。今天的互联网正在开启一个新时代。虽然第一代数字革命带给我们信息互联网，但由区块链技术驱动的第二代革命正在带我们进入价值互联网，一个真正的点对点（P2P）平台。


    有些人将去中心化区块链技术称为“21 世纪的炼金术”，因为它可以利用终端设备将计算转化为数字黄金。更重要的是，根据 Don 和 Alex Tapscott
    的说法，区块链技术使信任协作能够更充分地共享创造的财富，而不是试图解决日益严重的社会不平等。结果是区块链技术有助于为分布式资本主义和更具包性的经济创造平台。


    特别值得关注的区块链技术是以太坊，它于 2015 年 7 月上线。以太坊由维塔里克·布特林（Vitalik Buterin）创立，他请求一种更广泛、更通用的脚本语言用于开发去中心化应用（DApps），这些应用不仅限于加密货币，这是比特币所缺乏且被比特币社区拒绝的能力。以太坊实现了新的经济形式以及公司、业务和所有权的分布式模型（例如，自组织层次结构和成员制合作社）。正如布特林所说，大多数技术倾向于自动化边缘执行琐事任务的工人，而以太坊则使中心自动化。例如，以太坊不是让出租车司机失业，而是让
    Uber 失业，让出租车司机直接与客户工作（在 Uber 的自动驾驶汽车最终消灭他们的工作之前）。因此，以太坊的目标与其说是消除工作，不如说是改变工作的定义。事实上，它催生了以太坊项目内部第一个去中心化自治组织（DAO）的诞生。DAO
    是一种开源的分布式软件，“同时无处不在又无处存在”，从而创造了一种范式转移，为业务民主化提供了新机会，并使未来的企业家能够根据其改变世界的使命、愿景和战略的最优化需求，设计定制的虚拟组织。


