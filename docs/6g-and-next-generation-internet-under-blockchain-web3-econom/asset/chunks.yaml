    最近，Maier 等人 [13]]引入了*无物物联网*（Internet of No Things），作为迈向后智能手机时代（6G 时代）的重要阶梯，在那个时代，智能手机可能不再被需要。我们认为，虽然
    5G 应该是关于万物互联（Internet of Everything），但为了实现变革，6G 可能只是“万物”的反面，即“无物”（Nothing），或者从技术角度来说，是“无物体”（No
    Things）。无物物联网在不拥有或携带任何类型的计算或存储设备的情况下提供各种人类意图的服务。它设想让网络服务在需要时从周围环境中出现，在不需要时消失。从当前基于设备的互联网到无物物联网的过渡分为三个阶段：(*i*)可携戴设备（bearables，例如智能手机），(*ii*)可穿戴设备（wearables，例如
    Google 和 Levi''s 的智能夹克），最后是*(iii)*近场设备*（nearables）。近场设备指的是附近的计算/存储技术和服务提供机制，这些机制足够智能，能够根据用户的上下文和历史进行学习和反应，以提供用户意图的服务。


    Joseph A. Paradiso [14]] 在 MIT 媒体实验室概述了他在物联网背景下关于超感知（ESP）的开创性工作。作者表明，在传感器驱动的世界里，嵌入任何事物中的网络连接传感器作为人类神经系统的延伸，使我们能够进入
    Mark Weiser 在一个世纪多年前就预言的泛在计算时代。在《21 世纪的计算机》中，Mark Weiser 认为最深刻的技术是那些会消失的技术。它们将自己织入日常生活的结构中，直到与生活无不可分
    [15]。这现在被广称为泛在计算，尽管 Mark Weiser 最初称其为*具身虚拟*（embodied virtuality）。


    图 1.2 描绘了我们提出的超感知网络（ESPN）的架构，该网络整合了移动计算的以下三个进化阶段：(*i*)无处不在、(*ii*)泛在以及(*iii*)说服性计算。无处不在的计算嵌入在我们周围的事物中（即近场设备），而泛在计算涉及我们的可携戴设备和可穿戴设备。说服性计算旨在通过社会影响改变用户的行为。在线虚拟环境中改变行为的一种有趣现象被称为“普罗透斯效应”（Proteus
    effect），个体的行为是由其虚拟化身的特征和特质塑造的，特别是通过化身间事件期间的交互。底层的物理网络基础设施如图 1.2 所示，它由 WLAN Mesh
    网关接入点（MPPs）和蜂窝基站（BSs）共享的光纤骨干组成，这些基站与光网络单元（ONUs）同位置部署，而 ONU 又连接到光纤骨干的中央光线路终端（OLT）。基于真实的触觉轨迹，我们研究了人类操作员（HO）与远程操作机器人（TOR）之间的非本地远程操作用例，它们都是物理（即离线）实体（图
    1.2 ）。此外，Maier 和 Ebrahimzadeh [[16] 表明，AI 增强的 MEC 通过预测延迟或丢失的触觉反馈样本，有助于将触觉反馈与大规模传播延迟的影响解耦。这使得人类能够以
    1 ms 的粒度实时感知远程任务环境。


    ![FIGURE 1.2 超感知网络 (ESPN) 架构，整合了移动计算的三个进化阶段：(i)无处不在，(ii)泛在以及(iii)说服性计算。](img/fig1_2.jpg)


    FIGURE 1.2 超感知网络 (ESPN) 架构，整合了移动计算的三个进化阶段：(*i*)无处不在、(*ii*)泛在以及(*iii*)说服性计算。


    ## 6G 愿景


    当 5G 进入商业部署阶段时，研究已开始关注预计在 2030 年部署的 6G 网络 [17–19]。通常，下一代系统并非凭空出现，而是遵循前几代的工业和技术趋势。与
    6G 一致的潜在研究方向见 [20]，包括：


    -   `6G 将继续向高频移动`：鉴于低频频谱几乎耗尽，目前的趋势是在更高频获取更宽的带宽。

    -   `大规模 MIMO 将仍然是 6G 的关键技术`：大规模 MIMO 是 5G 的定义技术，使天线数量从 2 增加到 64。由于信道编码和调制器的性能增益已饱和，6G
    提高频谱效率的希望将留在多天线领域。

    -   `6G 将云服务推向新高度`：随着不断提高的数据速率、短延迟和低传输成本，许多计算和存储功能已从手机移动到云端。因此，手机大部分计算能力专注于呈现渲染，使
    VR、AR 或扩展现实（XR）变得更加震撼且负担得起。许多基于云的 AI 服务可能会更容易、更广泛地流行。除了手机外，廉价的功能终端可能会再次兴起，为更多应用领域提供增长机会。

    -   `无接入传输在 6G 中可能更加突出`：在过去的蜂窝网络代中，传输主要基于强中央控制的接入导向设计。6G 需要更多的无接入协议和方法。非正交多接入（`NOMA`）技术由于其短延迟性能，尽管在
    5G 时代未能成功，可能会获得另一个流行的机会。

    -   `mMTC 更可能在下一代成功之前先成型`：由于人与通信的市场增长已饱和，mMTC 一直是下一代系统设计的主要方向之一。人们曾 5G mMTC 为蜂窝行业带来显著增长。但到为止，这种预期与现实情况不符。因此，目前的趋势表明，mMTC
    更可能通过利用在低频运行的旧技术来流行。

    -   `6G 将传输网络转换为计算网络`：6G 可能的特征之一是传输、计算、AI、机器学习和大数据分析的协调运行，使得 6G 能够自主检测用户的传输意图，并根据用户的意图和愿望提供个性化服务。


