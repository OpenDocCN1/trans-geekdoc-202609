  raw: "In [Chapter 3](#chapter03.xhtml#c03), we explored how Ethereum blockchain\
    \ technologies, in particular the aforementioned concept of the DAO, may be leveraged\
    \ to decentralize the Tactile Internet, which enables unprecedented mobile applications\
    \ for remotely steering real or virtual objects/processes in perceived real-time\
    \ and represents a promising example of future techno-social systems. We showed\
    \ that a higher level of decentralization of AI-enhanced MEC reduces the average\
    \ computational task completion time of up to 89.5% by setting the computation\
    \ offloading probability to 0.7. Further, we observed that crowdsourcing of human\
    \ assistance is beneficial in decreasing the average completion time of physical\
    \ tasks for medium to high feedback misforecasting probabilities, provided the\
    \ human offers equal or even superior operational capabilities, i.e., $~\\\\frac{f\\\
    _{human}}{f\\_{robot}} \\\\geq 1.$ Toward this end, we proposed a nudge contract\
    \ as a technique to influence nearby human behavior without punishment for skills\
    \ transfer in the context of the Tactile Internet. Specifically, the nudge contract\
    \ aims to enable the skills transfer process as well as a reward by means of the\
    \ Ethereum smart contract. We then showed that the considered nudge contract helps\
    \ successfully accomplish tasks via shared intelligence among failing robots and\
    \ skilled humans.\n\nIn [Chapter 4](#chapter04.xhtml#c04), we covered some of\
    \ the ways in which our decisions are affected by social influences and the behavior\
    \ and attitude of other people. Toward this end, we investigated the widely studied\
    \ trust game of behavioral economics in a blockchain context. Besides the design\
    \ of a decentralized trust game without the need for the experimenter in the middle\
    \ between players, we presented a simple but efficient blockchain-based mechanism\
    \ of deposit as a pre-commitment between players. The term pre-commitment was\
    \ first introduced in 1978 by Thomas Schelling, the 2005 Nobel Laureate in Economics\
    \ as part of a self-management system called *Egonomics*\n\nIn [Chapter 5](#chapter05.xhtml#c05),\
    \ we explained that 6G will differ from fifth generation (5G) in several ways.\
    \ 6G will not only explore more spectrum at high-frequency bands but also converge\
    \ driving technological trends, including connected robotics and blockchain technologies.\
    \ Importantly, we showed that 6G will become more human-centered than 5G, which\
    \ primarily focused on industry verticals. Putting people at the center of a future\
    \ super-smart society is the driving theme for the anticipated shift of research\
    \ focus from Industry 4.0 to Society 5.0 based on CPSS, which integrates human\
    \ beings at the social, cognitive, and physical levels and engages them in cyber-physical-social\
    \ behaviors with diverse types of meta-human capabilities. Specifically, we focus\
    \ on the paradigm shift from conventional monetary to future non-monetary economies,\
    \ such as our considered blockchain-based Web3 token economy and its important\
    \ role in the recently emerging DAO. Toward this end, we presented our CPSS-based\
    \ token engineering DAO framework for Society 5.0. Given its similarity to decentralized\
    \ blockchain technology, we adopted stigmergy—a biological self-organization mechanism\
    \ widely found in social insect societies—for facilitating indirect communication\
    \ and internal coordination among offline agents via traces (feedback loops) created\
    \ in a blockchain-based online environment. Most notably, we studied indirect\
    \ communication mediated by tokenized digital twins to advance collective intelligence\
    \ in a future Society 5.0 and a token economy-based Web3, where humans act like\
    \ neurons in a hive mind with blockchain technology acting as connecting tissue\
    \ to create programmable incentives known as tokens. Finally, we experimentally\
    \ showed how to increase both Collective Intelligence (CI) and rewarded purpose-driven\
    \ tokens by means of stigmergic traces in a blockchain-based online environment\
    \ involving crowdsourced Amazon MTurk workers and validating on-chaining oracle.\n\
    \n## NOTES\n\n1.  [T](#conc.xhtml#ncon_1b). C. Schelling, “Egonomics, or the Art\
    \ of Self-Management,” *The American Economic Review*, May 1978.\n\n2.  [Jon](#conc.xhtml#ncon_2b)\
