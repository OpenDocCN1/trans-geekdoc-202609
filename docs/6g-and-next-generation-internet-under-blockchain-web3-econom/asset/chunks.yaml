    The term “Tactile Internet” was first coined by `Fettweis` in 2014. In his seminal
    paper `[[21](#chapter02.xhtml#r2_21)]`, the Tactile Internet was defined as a
    breakthrough enabling unprecedented mobile applications for tactile steering and
    control of real and virtual objects by requiring a round-trip latency of `1–10
    ms`. Later in 2014, `ITU-T` published a Technology Watch Report on the Tactile
    Internet, which emphasized that scaling up research in the area of wired and wireless
    access networks would be essential, ushering in new ideas and concepts to boost
    access networks’ redundancy and diversity to meet the stringent latency as well
    as carrier-grade reliability requirements of Tactile Internet applications `[[22](#chapter02.xhtml#r2_22)]`.
    The Tactile Internet provides a medium for remote physical interaction in real-time,
    which requires the exchange of closed-loop information between virtual or real
    objects (i.e., humans, machines, and processes). This mandatory end-to-end design
    approach is fully reflected in the key principles of the reference architecture
    within the emerging `IEEE P1918.1` standards working group (formed in March 2016),
    which aims to define a framework for the Tactile Internet `[[23](#chapter02.xhtml#r2_23)]`.
    Among others, the key principles envision to (i) develop a generic Tactile Internet
    reference architecture, (ii) support local area as well as wide area connectivity
    through wireless (e.g., cellular, WiFi) or hybrid wireless and wired networking,
    and (iii) leverage computing resources from cloud variants at the edge of the
    network. The working group defines the Tactile Internet as a “network or network
    of networks for remotely accessing, perceiving, manipulating or controlling real
    or virtual objects or processes in perceived real-time by humans or machines.”
    Some of the key use cases considered in `IEEE P1918.1` include teleoperation,
    haptic communications, immersive virtual reality, and automotive control.


    To give it a more 5G-centric flavor, the Tactile Internet has been more recently
    also referred to as the 5G-enabled Tactile Internet `[[24](#chapter02.xhtml#r2_24),
    [25](#chapter02.xhtml#r2_25)]`. Recall that, unlike the previous four cellular
    generations, future 5G networks will lead to an increasing integration of cellular
    and WiFi technologies and standards `[[26](#chapter02.xhtml#r2_26)]`. Furthermore,
    the importance of the so-called backhaul bottleneck needs to be recognized as
    well, calling for an end-to-end design approach leveraging both wireless front-end
    and wired backhaul technologies. Or, as eloquently put by `Andrews`, the lead
    author of `[[26](#chapter02.xhtml#r2_26)]`, “placing base stations all over the
    place is great for providing the mobile stations high-speed access, but does this
    not just pass the buck to the base stations, which must now somehow get this data
    to and from the wired core network?” `[[27](#chapter02.xhtml#r2_27)]`. Clearly,
    the Tactile Internet opens up a plethora of exciting research directions toward
    adding a new dimension to the human-to-machine interaction via the Internet. According
    to the aforementioned `ITU-T` Technology Watch Report, the Tactile Internet is
    supposed to be the next leap in the evolution of today’s IoT, although there is
    a significant overlap between 5G, IoT, and the Tactile Internet. For illustration,
    `[Fig. 2.3](#chapter02.xhtml#f2_3)]` provides a view of the aforementioned commonalities
    and differences through the three lenses of IoT, 5G, and the Tactile Internet.
    The major differences may be best expressed in terms of underlying communications
    paradigms and enabling devices. `IoT` relies on `M2M` communications with a focus
    on smart devices (e.g., sensors and actuators). In coexistence with emerging `MTC`,
    `5G` will maintain its traditional human-to-human (`H2H`) communications paradigm
    for conventional triple-play services (voice, video, and data) with a growing
    focus on the integration with other wireless technologies (most notably WiFi)
    and decentralization. Conversely, the Tactile Internet will be centered on human-to-machine
    (`H2M`) communications leveraging tactile and haptic devices. More importantly,
    despite their differences, `IoT`, `5G`, and the Tactile Internet seem to converge
    toward a common set of important design goals:


    ![FIGURE 2.3 The three lenses of the Internet of Things (IoT), 5G, and the Tactile
    Internet: Commonalities and differences.](images/fig2_3.jpg)


    `[FIGURE 2.3](#chapter02.xhtml#b02fig2_3)` The three lenses of the Internet of
    Things (IoT), 5G, and the Tactile Internet: Commonalities and differences.


    *   Very low latency on the order of 1 ms

    *   Ultra-high reliability with an almost guaranteed availability of 99.999%

    *   H2H and M2M coexistence

    *   Integration of data-centric technologies with a particular focus on WiFi

    *   Security


    Importantly, the Tactile Internet involves the inherent human-in-the-loop (`HITL`)
    nature of `H2M` interaction, as opposed to the emerging `IoT` without any human
    involvement in its underlying `M2M` communications. Although `M2M` communications
    is useful for the automation of industrial and other machine-centric processes,
    the Tactile Internet will be centered on human-to-machine/robot (`H2M/R`) communications
    and will thus allow for a human-centric design approach toward creating novel
    immersive experiences and extending the capabilities of the human through the
    Internet (i.e., augmentation rather than automation of the human) `[[28](#chapter02.xhtml#r2_28)]`.


    ### Human-Agent-Robot Teamwork


    A promising approach toward achieving advanced human-machine coordination by means
    of a superior process for fluidly orchestrating human and machine coactivity may
    be found in the still young field of human-agent-robot teamwork (`HART`) `[[29](#chapter02.xhtml#r2_29)]`.
    Unlike early automation research, HART goes beyond the singular focus on full
    autonomy (i.e., complete independence and self-sufficiency) and cooperative/collaborative
    autonomy among autonomous systems themselves, which aim at excluding humans as
    potential teammates for the design of human-out-of-the loop solutions. In HART,
    the dynamic allocation of functions and tasks between humans and machines, which
    may vary over time or be unpredictable in different situations, plays a central
    role. In particular, with the rise of increasingly smarter machines, the historical
    humans-are-better-at/machines-are-better-at (`HABA/MABA`) approach to decide which
    tasks are best performed by people and which by machines rather than working in
    concert has become obsolete. To provide a better understanding of the potential
    and limitations of current smart machines, `T. H. Davenport` and `J. Kirby` classified
    the capabilities of intelligent machines along two dimensions, namely their ability
    to act and their ability to learn, in their book, *Only Humans Need Apply: Winners
    and Losers in the Age of Smart Machines*. The ability to act involves four task
    levels, ranging from the most basic tasks (e.g., analyzing numbers) to performing
    digital tasks (done by agents) or even physical tasks (done by robots). On the
    other hand, the ability to learn escalates through four levels, spanning from
    human-support machines with no inherent intelligence to machines with context
    awareness, learning, or even self-aware intelligence.

