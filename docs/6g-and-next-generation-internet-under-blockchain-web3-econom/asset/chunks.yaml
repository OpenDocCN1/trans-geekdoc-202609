- fmt: '

    According to Bradshaw et al. \[[29](#chapter02.xhtml#r2_29)], among other HART
    research challenges, the development of capabilities that enable autonomous systems
    not merely to do things for people but also to work together with people and other
    systems represents an important open issue to treat humans as “members” of a team
    of intelligent actors rather than keep viewing them as a conventional “users.”
    In the following, we introduce and extend the concept of fiber-wireless (FiWi)
    enhanced LTE-advanced (LTE-A) heterogeneous networks (HetNets) to enable both
    local and non-local teleoperation by exploiting AI-enhanced MEC capabilities to
    achieve both low round-trip latency and low jitter.


    ### Low-Latency FiWi-Enhanced LTE-A HetNets with AI-Enhanced MEC


    #### Low-latency FiWi-enhanced LTE-A HetNets


    FiWi access networks, also referred to as “wireless-optical broadband access networks”
    (WOBANs), combine the reliability, robustness, and high capacity of optical fiber
    networks and the flexibility, ubiquity, and cost savings of wireless networks
    \[[30](#chapter02.xhtml#r2_30)]. To deliver peak data rates up to 200 Mbps per
    user and realize the vision of complete fixed-mobile convergence, it is crucial
    to replace today’s legacy wireline and microwave backhaul technologies with integrated
    FiWi broadband access networks.


    Beyranvand et al. \[[31](#chapter02.xhtml#r2_31)\] investigated the performance
    gains obtained from unifying coverage-centric 4G mobile networks and capacity-centric
    FiWi broadband access networks based on data-centric Ethernet technologies with
    resulting fiber backhaul sharing and WiFi offloading capabilities in response
    to the unprecedented growth of mobile data traffic. We evaluated the maximum aggregate
    throughput, offloading efficiency, and in particular, the delay performance of
    FiWi-enhanced LTE-A HetNets, including the beneficial impact of various localized
    fiber-lean backhaul redundancy and wireless protection techniques, by means of
    probabilistic analysis and verifying simulation. In our study, we paid close attention
    to fiber backhaul reliability issues stemming from fiber faults of an Ethernet
    passive optical network (`EPON`) and WiFi offloading limitations resulting from
    WiFi mesh node failures as well as temporal and spatial WiFi coverage constraints.


    For illustration, [Fig. 2.4](#chapter02.xhtml#f2_4) depicts the average end-to-end
    delay performance of FiWi-enhanced LTE-A HetNets versus aggregate throughput for
    different WiFi offloading ratio (`WOR`) values, whereby `0 ≤ WOR ≤ 1` denotes
    the percentage of mobile user traffic offloaded onto WiFi. The presented analytical
    and verifying simulation results were obtained by assuming a realistic LTE-A and
    FiWi network configuration under uniform traffic loads and applying minimum (optical
    and wireless) hop routing. For further details, the interested reader is referred
    to \[[31](#chapter02.xhtml#r2_31)\]. For now, let us assume that the reliability
    of the `EPON` is ideal (i.e., no fiber backhaul faults occur). However, unlike
    `EPON`, the WiFi mesh network may suffer from wireless service outages with a
    probability of `10−6`. We observe from [Fig. 2.4](#chapter02.xhtml#f2_4) that
    for increasing `WOR` the throughput-delay performance of FiWi-enhanced LTE-A HetNets
    is improved significantly. More precisely, by changing `WOR` from `0.1` to `0.57`
    the maximum achievable aggregate throughput increases from about 61 Mbps to roughly
    126 Mbps (i.e., the maximum achievable aggregate throughput has more than doubled).
    More importantly, further increasing `WOR` to `0.9` does not result in an additional
    significant increase of the maximum achievable aggregate throughput, but it is
    instrumental in decreasing the average end-to-end delay and keeping it at a very
    low level of `10−3` seconds (1 ms) for a wide range of traffic loads. Thus, this
    result shows that WiFi offloading the majority of data traffic from 4G mobile
    networks is a promising approach to obtain a very low latency on the order of
    1 ms.


    ![FIGURE 2.4 Average end-to-end delay versus aggregate throughput for different
    WiFi offloading ratio (WOR).](images/fig2_4.jpg)


    [FIGURE 2.4](#chapter02.xhtml#b02fig2_4) Average end-to-end delay versus aggregate
    throughput for different WiFi offloading ratio (WOR).


    #### AI-enhanced MEC: Pushing AI to the edge


    [Figure 2.5](#chapter02.xhtml#f2_5) depicts the generic network architecture of
    FiWi-enhanced LTE-A HetNets with an AI-enhanced MEC server. The fiber backhaul
    consists of a time or wavelength division multiplexing (`TDM/WDM`) `IEEE 802.3ah/av`
    1/10 Gb/s `EPON` with a typical fiber range of 20 km between the central optical
    line terminal (`OLT`) and remote optical network units (`ONUs`). The `EPON` may
    comprise multiple stages, each stage separated by a wavelength-broadcasting splitter
    and combiner or a wavelength multiplexer and demultiplexer. There are three different
    subsets of ONUs. An `ONU` may either serve fixed (wired) subscribers. Alternatively,
    it may connect to a cellular network base station (`BS`) or an `IEEE 802.11n/ac/s`
    WLAN mesh portal point (`MPP`), giving rise to a collocated `ONU-BS` or `ONU-MPP`,
    respectively. Depending on the trajectory, a mobile user (`MU`) may communicate
    through the cellular network or WLAN mesh front end, which consists of `ONU-MPPs`,
    intermediate mesh points (`MPs`), and mesh access points (`MAPs`) \[[32](#chapter02.xhtml#r2_32)\].


    ![FIGURE 2.5 Architecture of FiWi-based Tactile Internet with artificial intelligence
    (AI)-enhanced MEC for local and non-local teleoperation.](images/fig2_5.jpg)


    [FIGURE 2.5](#chapter02.xhtml#b02fig2_5) Architecture of FiWi-based Tactile Internet
    with artificial intelligence (AI)-enhanced MEC for local and non-local teleoperation.


    Human operators (`HOs`) and teleoperator robots (`TORs`) are assumed to communicate
    only via WLAN, as opposed to `MUs` using their dual-mode 4G/WiFi smartphones.
    Teleoperation is done either locally or non-locally, depending on the proximity
    of the involved `HO` and `TOR`, as illustrated in [Fig. 2.5](#chapter02.xhtml#f2_5).
    In local teleoperation, the `HO` and corresponding `TOR` are associated with the
    same `MAP` and exchange their command and feedback samples through this `MAP`
    without traversing the fiber backhaul. Conversely, if `HO` and `TOR` are associated
    with different `MAPs`, non-local teleoperation is generally done by communicating
    via the backhaul `EPON` and central `OLT`. Despite recent interest in exploiting
    machine learning for optical communications and networking, edge intelligence
    for enabling an immersive and transparent teleoperation experiences for `HOs`
    has not been explored yet. In \[[32](#chapter02.xhtml#r2_32)\], Maier and Ebrahimzadeh
    applied machine learning at the edge of our considered communication network for
    realizing immersive and frictionless Tactile Internet experiences. To realize
    edge intelligence, selected `ONU- BSs/MPPs` are equipped with AI-enhanced MEC
    servers. These servers rely on the computational capabilities of cloudlets collocated
    at the optical-wireless interface (see [Fig. 2.5](#chapter02.xhtml#f2_5)) to forecast
    delayed haptic samples in the feedback path. As a consequence, the `HO` is enabled
    to perceive the remote task environment in real-time at a 1-ms granularity, thus
    resulting in tighter togetherness, improved safety control, and increased reliability
    of the teleoperation systems.

