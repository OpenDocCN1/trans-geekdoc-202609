    我们在第 2 章中已经看到，人们对将区块链适应物联网（IoT）的特定需求表现出日益增长的兴趣，以开发各种区块链物联网（B-IoT）应用，涵盖了从智慧城市、工业
    4.0 到金融交易和农业等领域。为此，[1] 的作者指出智能合约的重要作用，智能合约被定义为在满足特定条件时自主执行的自给自足去中心化代码段，以太坊是首批使用智能合约的区块链之一。以太坊允许用户在网络之上编写并运行自己的代码。通过更新代码，用户能够修改物联网设备的行为，从而简化维护和错误纠正。除了众知的
    B-IoT 问题（如在资源受限的物联网设备上托管区块链、低交易率和长区块创建时间）外，Fernández-Caramés 和 Fraga-Lamas [1]
    还识别出了早期 B-IoT 开发和部署之外的若干重大挑战，这些挑战需要进一步的研究。除了技术挑战（例如访问控制和安全性）外，作者得出结论：构建监管环境（例如`去中心化所有权`）是释放
    B-IoT 潜力以供广泛使用的最大问题之一。


    最近，在[2]中，网关被用作本地资源受限物联网集群的 B-IoT 服务代理，通过存储它们的区块链账户并代表它们执行智能合约。提出的基于智能合约的框架由多个访问控制合约（ACC）组成。每个
    `ACC` 为每个 B-IoT 资源维护一个误行为列表，包括误行为的细节、时间以及对其主体对象的惩罚（例如在一段时间内阻止访问请求）。此外，除了注册合约外，该框架还涉及所谓的`判决合约
    (JC)`，它实现特定的误行为判定方法。在收到来自 ACCs 的误行为报告后，`JC` 确定对应对象的惩罚，并将决策返回给 ACCs 执行。


    尽管最近取得了进展，但使以太坊区别于其他区块链的重要特征仍有待更深入的探索，包括它们与去中心化边缘计算解决方案之外的人工智能和机器人等新兴关键技术的共生。此处特别感兴趣的问题是：如何利用去中心化区块链机制让个人之间出现新的混合协作形式，这种形式在企业而非个人主导的传统市场导向型经济中尚未被考虑[3]。特别感兴趣的是以太坊的去中心化自治组织（DAO）概念。事实上，在关于如何利用我们数字未来的最新著作[4]中，Andrew
    McAfee 和 Erik Brynjolfsson 提到了“DAO 之路”，它可能会用技术赋能的群体取代公司等传统组织。


    虽然第五代（5G）网络尚未广泛部署，但早期研究已经开始跨越 5G 网络，并预测未来的第六代（6G）愿景可能是什么。与 5G 不同，6G 不仅将在高频段探索更多频谱，还将汇聚驱动性技术趋势。Saad
    等人[5] 认为 6G 后将有以下三个驱动应用：(*i*)区块链和分布式账本技术，(*ii*)连接机器人和自主系统，以及(*iii*)无线脑机交互（人机交互的一个子类）。在本章中，我们关注触觉互联网（Tactile
    Internet），它应该是今天物联网演变的下一次飞跃。注意，具有底层机器间（M2M）通信的物联网对于实现工业和其他以机器为中心的流程的自动化有用。它设计用于在不依赖任何人类参与的情况下实现机器通信。相反，触觉互联网将通过其内在的人在环（HITL）本质为人机（H2M）交互增加一个新维度，从而允许采用以人为中心的设计方法来创造新的沉浸式体验，并通过互联网扩展人类的能力，即对人类的增强而非自动化[6]。本章旨在解决上述的开放研究挑战。


    Maier 和 Ebrahimzadeh [6] 涵盖了触觉互联网的各个重要方面（即触觉流量表征和边缘智能），但对区块链的未来工作仅进行了简要概述。在本章中，我们在[6]的发现的基础上，做了以下贡献：(*i*)
    调查利用移动终端用户设备通过区块链实现去中心化的潜力，(*ii*) 探索如何利用众包来缩短物理任务的完成时间，以及 (*iii*) 将 B-IoT 框架从判决合约扩展到助推合约（nudge
    contract），以便在更广泛的触觉互联网背景下对人类用户进行助推。


    本章其余结构如下。“触觉互联网去中心化”章节详述了以太坊特别是 DAO 在帮助触觉互联网去中心化方面的潜在作用。“助推：从判决合约到助推合约”章节中，我们探索了将
    B-IoT 判决合约框架扩展到助推合约的可能性，以便在更广泛的触觉互联网背景下对人类用户进行`助推`。最后，“结论”部分总结全章。


    ## 去中心化触觉互联网


    ### FiWi 增强型移动网络：所有权的扩散


    Maier 和 Ebrahimzadeh [6] 显示，可以通过以下实现 5G 超可靠低延迟通信（URLLC）要求：增强以覆盖为中心的 4G LTE-A 异构网络（HetNets），分别在回传和前端接入了基于低成本、以数据为中心的
    EPON 和 WLAN 技术的以容量为中心的 FiWi 接入网络。图 3.1 详细说明了此类 FiWi 增强型移动网络的架构。常见的 EPON 光纤回传由多个光网络单元（ONUs）共享，这些单元可以连接到固定用户，也可以与
    WLAN MPP 或蜂窝基站（BS）接口。产生的 ONU-MPPs/ONU-BSs 中可能配备了 AI 增强型 MEC 服务器（稍后将详细描述）。在用户端侧，我们考虑了以下三类用户：传统的移动终端（MU）以及涉及远程操作的
    HO 和 TOR 对，这些对可以是局部的也可以是非局部的。


    ![图 3.1 用于沉浸式触觉互联网的带有 AI 增强 MEC 的 FiWi 增强型移动网络架构](img/fig3_1.jpg)


    图 3.1 用于沉浸式触觉互联网的带有 AI 增强 MEC 的 FiWi 增强型移动网络架构。


