    # 4Blockchain Meets 6G*Social Human-Robot Interaction through Oracles and Behavioral
    Economics*


    DOI: [10.1201/9781003427322-4](https://doi.org/10.1201/9781003427322-4)


    ## INTRODUCTION


    A major limitation of the conventional blockchain is its inability to interact
    with the “outside world” since smart contracts can only operate on data that is
    on the blockchain. In the emerging B-IoT, sensors are typically deployed to bring
    sensor measurement data onto the blockchain \[[1](#chapter04.xhtml#r4_1)\]. Advanced
    blockchain technologies enable the *on-chaining* of blockchain-external off-chain
    information stem-ming also from real users, apart from sensors and other data
    sources only, thus leveraging also on human intelligence rather than machine learning
    only. To overcome this limitation, smart contracts may make use of so-called *oracles*,
    which are trusted decentralized blockchain entities whose primary task is to collect
    off-chain information and bring it onto the blockchain as trustworthy input data
    to smart contracts. Several decentralized oracle systems exist that rely on *voting-based
    games*, e.g., ASTRAEA \[[2](#chapter04.xhtml#r4_2)\].'
