- fmt: '

    Similar to Industry 4.0, Society 5.0 aims at seamlessly fusing the digital and
    physical worlds by using social robots, ambient intelligence, advanced HCI, embodied
    AI, and various flavors of extended reality including VR/AR, in addition to the
    aforementioned CPSS. Society 5.0 has two specific visions. The first one is human-robot
    co-working. In this vision, robots (including social robots) and humans will work
    together whenever and wherever possible. Humans will focus on tasks requiring
    creativity and robots will do the rest, giving rise to the aforementioned concept
    of the `DAO`. `DAO` is a unique feature of the Ethereum blockchain and heavily
    relies on crowdsourcing human skills to solve problems that robots and autonomous
    AI agents alone cannot solve well. The second vision of Society 5.0 is bionics,
    which studies the smart use of biological resources for industrial purposes to
    help achieve a balance between society, economy, and ecology.


    ## PURPOSE AND OUTLINE OF BOOK


    The remainder of this book is structured as follows.


    [Chapter 2](#chapter02.xhtml#c02) investigates blockchain technologies with respect
    to its capability to develop new models of distributed ownership such as the Tactile
    Internet. In this chapter, we also discuss the similarities and differences between
    Bitcoin and Ethereum blockchains. The comparison determines that Ethereum is a
    better choice as a blockchain platform. We also argue that Ethereum is better
    than other blockchains because of a number of salient features including `DAO`
    and its cooperative working with AI and robots and also that it is highly compatible
    with decentralized edge computing solutions. In our studies, we show that `DAO`
    gives birth to a new hybrid form of collaboration, in which intelligence and automation
    are at the center and humans operate at the edges. Finally, we conclude the chapter
    by outlining open research challenges and future work.


    [Chapter 3](#chapter03.xhtml#c03) elaborates on the potential of the `DAO` to
    help decentralize the Tactile Internet as a future 6G application and aligns its
    decentralization with AI-enhanced multi-access edge computing (`MEC`). Our presented
    results demonstrate that higher degrees of decentralization lower the completion
    times of computational jobs. In addition, we extend the existent `BIoT` framework’s
    `judge contract`, which controls IoT devices’ behavior and punishes them by blocking
    network access, to a broader Tactile Internet context. The developed `nudge contract`
    aims at completing interrupted physical tasks by learning from a remote skilled
    human member of the `DAO` while minimizing the learning loss. Our `nudge contract`
    modifies human behavior by means of a suitable reward mechanism (instead of punishment)
    in order to foster trusted skill transfers.


    [Chapter 4](#chapter04.xhtml#c04) investigates the widely studied trust game of
    behavioral economics in a blockchain context, paying close attention to the importance
    of developing efficient cooperation and coordination techniques. After identifying
    open research challenges of blockchain-enabled implementations of the trust game,
    we first develop a `smart contract` that replaces the experimenter in the middle
    between trustor and trustee and demonstrates experimentally that a social efficiency
    of up to 100 percent can be achieved by using deposits to enhance both trust and
    trustworthiness. We then present an on-chaining blockchain oracle architecture
    for a networked `N`-player trust game that involves a third type of human agent
    called `observers`, who track the players’ investment and reciprocity. The presence
    of third-party reward and penalty decisions helps raise the average normalized
    reciprocity above 80 percent, even without requiring any deposit. Further, we
    focus on the emerging field of robonomics in the 6G era, which studies the socio-technical
    impact of blockchain technologies on social human-robot interaction and behavioral
    economics for the social integration of robots into human society. Finally, we
    experimentally demonstrate that mixed logical-affective persuasive strategies
    for social robots improve the trustees’ trustworthiness and reciprocity significantly.


    [Chapter 5](#chapter05.xhtml#c05) explores future 6G mobile networks and their
    anticipated shift to become more human-centered, thereby enabling the so-called
    Society 5.0 vision. Further, we build on our recent work on robonomics in the
    6G era. As mentioned above, robonomics investigates social human-robot interaction
    and its socio-technical impact as well as blockchain technologies and cryptocurrencies,
    not only coins but—more interestingly—also tokens. Specifically, we study the
    tokenization process of creating tokenized digital twins of assets and access
    rights in the physical and digital world, paying close attention to its central
    role in the future Web3 and its underlying token economy, the successor of today’s
    information and platform economies. After introducing our `CPSS`-based bottom-up
    multilayer token engineering framework for Society 5.0, we experimentally demonstrate
    how the collective human intelligence of a blockchain-enabled `DAO` can be enhanced
    via purpose-driven tokens.


    Finally, [Chapter 6](#conc.xhtml) concludes the book by summarizing the major
    findings of the book.


    ## NOTES


    1. [International](#chapter01.xhtml#n1_101b) Telecommunication Union—Telecommunication
    Standardization Sector (`ITU-T`)

    2. [MakerDAO](#chapter01.xhtml#n1_201b) white paper: [https://makerdao.com/en/whitepaper/](https://makerdao.com)

    3. [Website](#chapter01.xhtml#n1_301b): [https://aragon.org/](https://aragon.org)

    4. [Website](#chapter01.xhtml#n1_401b): [https://alchemy.daostack.io/](https://alchemy.daostack.io)

    5. [Website](#chapter01.xhtml#n1_501b): [https://colony.io/](https://colony.io)

    6. [Colony](#chapter01.xhtml#n1_601b) Technical White Paper, [https://colony.io/whitepaper](https://colony.io)

    7. [Website](#chapter01.xhtml#n1_701b): [https://github.com/orisi](https://github.com)

    8. [Website](#chapter01.xhtml#n1_801b): [https://provable.xyz/](https://provable.xyz)

    9. [Website](#chapter01.xhtml#n1_901b): [https://chain.link/](https://chain.link)

    10. [Website](#chapter01.xhtml#n1_1001b): [https://eips.ethereum.org/EIP-20](https://eips.ethereum.org)

    11. [Website](#chapter01.xhtml#n1_1101b): [https://eips.ethereum.org/EIP-721](https://eips.ethereum.org)

    12. [Website](#chapter01.xhtml#n1_1201b): [https://www.cryptovels.com/parcels/2](https://www.cryptovels.com)

    13. [Website](#chapter01.xhtml#n1_1301b): [https://eips.ethereum.org/EIP-1155](https://eips.ethereum.org)


    ## REFERENCES


    1. [C. Rowell](#chapter01.xhtml#b01ref_1) and S. Han, “Practical Large Scale Antenna
    Systems for 5G Cellular Networks,” in *IEEE International Wireless Symposium (IWS
    2015)*, pp. 1–4.

    2. [P. Semov](#chapter01.xhtml#b01ref_2), P. Koleva, K. Tonchev, V. Poulkov and
    T. Cooklev, “Evolution of Mobile Networks and C-RAN on the Road Beyond 5G,” *International
    Conference on Telecommunications and Signal Processing (TSP),* pp. 392–398.

    3. [P. Rost](#chapter01.xhtml#b01ref_3), A. Banchs, I. Berberana, M. Breitbach,
    M. Doll, H. Droste, C. Mannweiler, M. A. Puente, K. Samdanis, B. Sayadi, “Mobile
    Network Architecture Evolution toward 5G,” IEEE Communications Magazine, vol.
    54, no. 5, pp. 84–91.

    4. [R. Askar](#chapter01.xhtml#b01ref_4), J. Chung, Z. Guo, H. Ko, W. Keusgen
    and T. Haustein, “Interference Handling Challenges toward Full Duplex Evolution
    in 5G and Beyond Cellular Networks,” IEEE Wireless Communications, vol. 28, no.
    1, pp. 51–59.

