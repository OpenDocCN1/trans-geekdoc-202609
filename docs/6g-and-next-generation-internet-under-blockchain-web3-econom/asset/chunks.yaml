  trans: "\n\n# CoZ 接口与 Pepper 策略\n\n`CoZ` 接口还显示了九个社交提示按钮，以防止可能的拼写错误并为观察者填补沟通空白节省时间。这九个社交提示按钮分别是：“争取时间”、“告诉我详情”、“做得好”、“你好”、“再见”、“张开双臂”、“挑衅手”、“不”和“寻求关注”。观察者可以在对话期间按下这些按钮来执行\
    \ `Pepper` 的不同手势，从而影响受托人的行为。\n\n此外，我们起草了两个脚本：一种是诉诸受托人左脑（即 `logics`）的逻辑说服策略，另一种是诉诸受托人右脑（即\
    \ `emotions`）的情感说服策略。每个脚本都包含存储在 `CoZ` 接口下拉菜单中的预设句子，观察者可以从中进行选择，通过实时的文本转语音消息引导受托人的行为向互惠方向靠拢。不同的机器人说服策略运行方式如下：\n\
    \n- **逻辑策略**：包含一套奖励和惩罚机制。此外，`Pepper` 通过上述 `CoZ` 平台通过语音合成提供一些经济和技术建议。\n- **情感策略**：包含一套奖励/惩罚机制，`Pepper`\
    \ 通过 `CoZ` 平台使用语音合成鼓励消息。此外，`Pepper` 通过手势和具身交流向受托人展示社交提示。\n- **混合策略**：将上述逻辑和情感策略结合为一种混合策略。它包含一套奖励/惩罚机制，`Pepper`\
    \ 不仅通过 `CoZ` 平台通过语音合成提供经济和技术建议，还提供鼓励。此外，`Pepper` 通过手势和具身交流向受托人展示社交提示。\n\n例如，表\
    \ 4.1 列出了我们提出的混合逻辑-情感说服策略中 `Pepper` 使用的社交提示。在这种策略中，一个观察者执行逻辑策略，另一个观察者执行情感策略，使受托人接收混合信息和混合的情身交流。根据受托人的行为，观察者在实验的每轮中执行“信任行为动作”或“不信任行为动作”。表\
    \ 4.1 中的社交提示允许观察者使用我们开发的 `CoZ` 平台控制 `Pepper` 的语音合成和具身交流。\n\n### 实验设置\n\n我们进行了涉及\
    \ 20 名学生的大规模实验，以衡量我们开发的说服机器人策略（即逻辑、情感和混合策略）的有效性。与我们上次双玩家信任游戏实验类似，参与的学生不知道彼此的身份。此外，学生之前没有进行过任何行为研究实验。选取学生的年龄在\
    \ 24 到 32 岁之间。其中 3 名女性，17 名男性。实验分为四个阶段：基准、逻辑、情感和混合策略。每个阶段涉及 5 轮。我们首先进行了基准信任游戏实验，受托人不与\
    \ `Pepper` 交互；随后进行了让受托人接触 `Pepper` 的逻辑、情感和混合逻辑-情感说服策略的实验。信任者和受托人都通过区块链账户与实验者的智能合约进行交互。信任人在单独房间玩游戏，而受托人则独自在实验室与\
    \ `Pepper` 在。`Pepper` 由观察者通过我们的 `CoZ` 平台远程控制。我们使用了相同的设置，即信任者的初始资金 `X` = 10 Ether，`K`\
    \ = 2。此外，在所有说服策略中，我们没有使用任何押金机制（即 `D` = 0）。\n\n### 结果\n\n系统使用以下函数初始化状态：\n```javascript\n\
    if (endowment > K) {\n    updateStrategy(X, \"logical\");\n}\n```\n\n"
