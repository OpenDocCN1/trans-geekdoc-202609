    回顾“引言”部分，触觉互联网（Tactile Internet）将涉及人机交互（H2M）固有的人类在回路（HITL）特性，而非新兴的物联网（IoT）。因此，它允许采用以人为中心的设计方法，通过互联网扩展人类的能力，实现人类的**增强**而非自动化。最近，Maier
    等人 [28]] 提出观点，触觉互联网可能是当代及早期互联网先驱们所设想的人类增强和人机共生的先驱。具体而言，我们阐述了 AI 增强智能体在支持人类进行人机任务协调方面可能发挥的作用。为了实现先进的人机协作，我们开发了一种计算和物理任务的分布式分配算法，用于流畅地协调
    HART（人机增强协作）活动（例如共享使用用户和/或网络拥有的机器人）。在我们的设计方法中，所有 HART 成员通过通信建立了一种集体自我意识，目标是使任务完成时间最小化。


    在接下来，我们寻找上述 HART 成员与 DAO、AI 和机器人互补优势之间的协同作用（参见图 2.2），以通过去中心化触觉互联网来促进局部人机协作集群。为了这一目标，更好地理解
    AI 的优点和局限性至关重要。最近，斯坦福大学启动了`人工智能百年研究 (AI100)`。在首份报告《2030 年的人工智能与生活》中，作者将 AI 定义为一组计算技术，其灵感源于人们利用其神经系统和身体进行感知、学习、推理和采取的方式。他们还指出，AI
    在短期内可能取代任务而非工作，并强调了通过众包人类专业知识来解决单凭计算机无法良好解决的问题的重要性。


    ### 分布式边缘智能


    > 首先，让我们通过部分或完全去中心化 MEC（多边缘计算）来探索利用移动终端设备的潜力。我们在融合光纤-无线移动网络的光-无线接口处引入了 AI 增强型
    MEC 服务器用于计算卸载。假设与 [28]] 相同的默认网络参数设置和仿真设置，我们考虑 1 ≤ `N[Edge]` ≤ 4 个 AI 增强型 MEC 服务器，每个服务器关联
    8 个终端用户，其中 1 ≤ `N[PD]` ≤ 8 个部分去中心化的终端用户可以通过改变其计算卸载概率来灵活控制卸载任务的数量。剩余的 8 − `N[PD]`
    是完全中心化的终端用户，仅依赖边缘计算（即其计算卸载概率等于 1）。注意，当 `N[Edge]` = 4 时，所有终端用户都可以将其计算任务卸载到边缘节点。相反，当
    `N[Edge]` < 4 时，一个或多个边缘节点不可用于计算卸载，其关联终端用户将回退到本地计算资源（即完全去中心化）。图 2.6 显示了在不同 `N[Edge]`
    和 `N[PD]` 下，部分去中心化终端用户的平均任务完成时间随计算卸载概率的变化情况。我们从图 2.6 中观察到，对于给定的 `N[Edge]`，增加 `N[PD]`（即更高的去中心化程度）有效减少平均任务完成时间。具体而言，对于
    `N[Edge]` = 4，高去中心化程度（`N[PD]` = 8）允许终端用户通过将计算卸载概率优化调整为 0.7，获得高达 89.5% 的平均任务完成时间缩短。


    ![图 2.6 不同数量部分去中心化终端用户 (nPD) 和人工智能 (AI)-增强型 MEC 服务器 (nedge) 的平均任务完成时间（秒）随计算卸载概率的变化图。](img/fig2_6.jpg)


    图 2.6 不同数量部分去中心化终端用户 (`n[PD]`) 和人工智能 (AI)-增强型 MEC 服务器 (`n[edge]`) 的平均任务完成时间（秒）随计算卸载概率的变化图。


    随着互联的计算能力遍布全球并在其之上构建了实用的平台，大众已成为一种明显可行且有价值的资源。根据 McAfee 和 Brynjolfsson [6]]，对于现代资本主义核心的企业来说，有许多方法可以挖掘
    DAO 等这样没有证书且传统缺乏经验的技术赋能群体成员的专业知识。Maier 等人 [28]] 开发了一种基于共享用户和/或网络拥有机器人的 HART 中心任务协调的物理任务自我感知分配算法。回顾“AI
    增强型 MEC：将 AI 推向边缘”，通过使用我们的 AI 增强型 MEC 服务器作为自主智能体，我们证明了来自 TOR（远程操作机器人）的延迟力反馈样本可以在本地生成并交付给邻近的
    HO（人类操作员）。然而注意，基于样本预测的远程操作系统的性能很大程度上取决于预测算法的准确性。


    ### 众包：扩展 HO 劳动力队伍


    为了在去中心化的触觉互联网中实现 DAO，可以使用以坊建立远程物理任务执行的 HO-TOR 会话，其中智能合约有助于建立和维护信任的 HART 成员身份，并允许每个
    HART 成员对所有参与的 HO、TOR 和 MEC 服务器拥有全局知识，这些服务器按照广泛使用的网关导向方法作为自主智能体运行（参见区块链物联网 (B-IoT)：最新进展与相关工作）。HO
    远程执行给定的物理任务，直到最近的 `n` 个触觉反馈样本中有 `k` 个发生预测错误。此时，HO 立即停止远程操作并通知智能体。智能体将中断的任务分配给附近的可用
    HO，由其移动到任务点并完成物理任务。对于 `n` = 5，图 2.7 描述了不同 `k` 和 `f[human]/f[robot]` 下的平均任务完成时间随预测错误概率的变化，其中
    `f[human]` 和 `f[robot]` 分别代表人类机器人执行物理任务的能力（每秒操作数）。我们观察到，当 `k` = 1 时，随着预测错误概率从
    0 增加到 0.25，任务完成时间增加，而 `k` = 3 时几乎保持不变。进一步注意，随着人类能力的增强（即增加 `f[human]/f[robot]`），结果任务完成时间会减少直到达到平台期，因为移动会产生额外的延迟。


    ![图 2.7 不同预测错误数量 (k) 和人类机器人操作能力比例 (fhuman/frobot) 的平均任务完成时间（秒）随预测错误概率的变化图。](img/fig2_7.jpg)


    图 2.7 不同预测错误数量 (`k`) 和人类机器人操作能力比例 (`f[human]/f[robot]`) 的平均任务完成时间（秒）随预测错误概率的变化图。


    ## 区块链、AI 与人类智能：未来之路


    今天，人工智能、机器学习、机器人和物联网正在汇聚，并开始利用加密货币、代币发行（ICO）、虚拟资产和万物代币化引发新的变革浪潮。


    这些创新的融合结果引发了人们对失业、机器人主宰以及未来的普遍担忧 [33]]。


    '
- fmt: "\nMaier et al. [[28](#chapter02.xhtml#r2_28)]] touched on the importance of\
    \ shifting the research focus from AI to intelligence amplification (IA) by using\
    \ information technology to enhance human decisions. Note, however, that IA becomes\
    \ difficult in dynamic task environments of increased uncertainty and real-world\
    \ situations of great complexity. IA, also known as “cognitive augmentation” or\
    \ “machine-augmented intelligence,” will be instrumental in enhancing the creativity,\
    \ understanding, efficiency, and intelligence of humans.\n\n### Cognitive-Assistance-Based\
    \ Intelligence Amplification\n\nEdge computing is a widely studied approach to\
    \ increase the usefulness of crowdsourcing, which may be used to guide humans\
    \ step-by-step through the physical task execution process by providing them with\
    \ cognitive assistance. Technically, this could be easily realized by equipping\
    \ an unskilled `DAO` member with an augmented reality (AR) headset (e.g., `HoloLens\
    \ 2` with WiFi connectivity) that receives work-order information in real time\
    \ from its nearest AI-enhanced `MEC` server.\n\n### HITL Hybrid-Augmented Intelligence\n\
    \nMany problems that humans face tend to be of high uncertainty, complexity, and\
    \ open-ended. To solve such problems, human interaction and participation may\
    \ be introduced. As a result, this gives rise to the concept of HITL hybrid-augmented\
    \ intelligence for advanced human-machine collaboration [[34](#chapter02.xhtml#r2_34)].].\
    \ HITL hybrid-augmented intelligence is defined as an intelligent model that requires\
    \ human interaction and allows for addressing problems and requirements that may\
    \ not be easily trained or classified by machine learning. In general, machine\
    \ learning is inferior to the human brain in understanding unstructured real-world\
    \ environments and processing incomplete information and complex spatiotemporal\
    \ correlation tasks. Hence, machines cannot carry out all the tasks in human society\
    \ on their own. Instead, AI and human intelligence are better viewed as highly\
    \ complementary.\n\nAccording to Zheng et al. [[34](#chapter02.xhtml#r2_34)]],\
    \ the Internet provides an immense innovation space for HITL hybrid-augmented\
    \ intelligence. Specifically, cloud robotics and AR are among the fastest-growing\
    \ commercial applications for enhancing the intelligence of an individual in multi-robot\
    \ collaborative systems. One of the main research topics of HITL hybrid-augmented\
    \ intelligence is the development of methods that allow machines to learn from\
    \ not only massive training samples but also human knowledge to accomplish highly\
    \ intelligent tasks via shared intelligence among different robots and humans.\n\
