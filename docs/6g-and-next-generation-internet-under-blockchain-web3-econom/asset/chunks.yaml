    随着区块链技术的炒热不断推进，区块链 3.0 旨在普及基于区块链的解决方案，将其范围从传统领域（金融、商品交易等）扩展到政府、物联网、去中心化 AI、供应链管理、智能能源、健康、数据管理和教育
    \[32, 33\]。因此，区块链的应用已演进到更广泛的范围。然而，这些新应用为下一代平台引入了新特性，包括关键方面，如平台互联或更高级的智能合约，后者通过自执行代码在减少官僚主义的同时提供更高水平的透明度。因此，这些新技术在互联网上实现了互不知或不信任的用户之间更加去中心化且自发的协调，这通常被称为去中心化自治组织（DAO）。DAO
    以开源分布式软件的形式存在，用于执行以太坊项目中构建的智能合约。DAO 类似于去中心化组织，之处是由自主软件代理（即智能合约）而非人类来做出决策。在更加去中心化的设置中，治理规则通过代币化的激励和惩罚自动引导行为
    \[34\]。在这种情况下，由特殊智能合约管理的称为代币的可编程资产充当治理规则，在没有中心化中介的情况下激励并引导一个参与者网络 \[34\]。此外，DAO
    发行的代币使其相应的持有者能够对有关组织发展的事务进行投票并做出决策。结果是决策过程是自动化的，参与者之间达成了共识。例如，图 1.4 描绘了区块链技术从区块链
    1.0 到 3.0 的演变。


    ![图 1.4 区块链技术的演变。](img/fig1_4.jpg)


    图 1.4 区块链技术的演变。


    智能合约引入区块链为这种颠覆性技术增加了编程性，并通过移除用于（非）业务目的管理的第三方改变了软件生态系统。尽管充满前景，但智能合约和区块链无法访问网络之外的信息（即链下数据）。区块链实际上是一个封闭系统，其交互仅限于其上的可用数据。因此，这仍然是一个开放的实际问题，被称为“预言机问题”，定义为现实世界的数据如何传输到区块链或从区块链传输
    \[35\]。为了这一目标，预言机（也称为数据喂）作为受信任的第三方服务，发送并验证外部信息，并将其提交给智能合约以触发区块链中的状态变化 \[36\]。预言机不仅可以将信息传递给智能合约，还可以将其发送到外部资源。它们仅仅是区块链上的合约，用于为其他合约的数据请求提供服务。没有预言机，智能合约的连接性将非常有限；因此，由于扩大了智能合约的操作范围，它们对区块链生态系统至关重要。


    ## 高级区块链技术：现有技术与近期进展


    在本节中，我们回顾了与高级技术相关的之前的研究，将其分为三个独立的类别后，我们将详细讨论每一个：DAO、区块链预言机和代币工程。


    ### DAO


    过去几年中，DAO 在区块链领域出现，作为互联网的一种新形式。DAO 是一种社会技术系统，通过在区块链上部署的智能合约来实现治理。DAO 被定义为具有共同目标的成员集合，通过区块链基础设施进行协调和决策。通常，DAO
    的成员注册一个特定的地址，并拥有与该地址相关的治理代币，这些代币是参与决策过程所需的。成员可以是人类或机器。此外，DAO 还可以管理资源，例如加密货币。


    第一个著名的 DAO 是 `The DAO`，由一组程序员于 2016 年 4 月推出。该 DAO 是一种对冲基金，贡献者可以直接对项目进行投票。2016
    年 6 月，由于 `The DAO` 代码的错误，攻击者掠夺了其大部分资金 \[37\]。去中心化金融（DeFi）的另一个 DAO 示例是：


    - Aragon 是目前最大的 DAO 平台。它提供了一个创建自己的 DAO 的静态模板，但也允许自定义。模板设置了一个特殊代币，由一个小组做出决策，例如接受新成员。它引入的另一个关键特性是权限，作为安全连接应用和实体（用户或其他应用）的访问控制系统。最初，DAO
    创建者拥有管理权限，但通常会将这些权限转移给投票应用，从而通过投票进行管理。

    - 与 Aragon 不同，DAOstack 平台不提供许多自定义。除此之外，它们目前为所有的 DAO 提供单一的决策系统。这种投票系统被称为“全息共识”（holographic
    consensus） \[38]旨在解决 DAO 的扩展问题。在全息共识中，如果满足某些条件，批准提案所需的多数可以从绝对多数减少为相对多数。最重要的涉及到预测者或质押者，他们不一定是任何
    DAO 的成员。这些预测者可以质押名为 `GEN` 的特殊代币来预测提案的结果。如果预测者正确，将获得奖励；如果失败，则失去质押。对于提案，如果质押金额达到特定限制，该提案的多数将变为相对多数。结果是质押者帮助
    DAO 突出有意义的提案并在服务有用时获利。在实践中，这种行为模拟了预测市场。

    - Colony 是最新发布的 DAO 平台，能够创建 DAO（他们称之为殖民地）。Colony 的 DAO 由具有共同目标和资源的人共享，尽管这些 DAO
    可以分为具有更特定目的的领域甚至子领域。


    ### 区块链预言机


    区块链预言机可以根据不同的属性进行分类：（*i*）*来源*，即数据的起源；（ii*）*信息方向*，即从区块链的角度来看是入站还是出站；（iii*）*数据流的发起者*，无论是推模式还是拉取通信；（iv）信任，即中心化或去中心化；以及（v）设计模式。


