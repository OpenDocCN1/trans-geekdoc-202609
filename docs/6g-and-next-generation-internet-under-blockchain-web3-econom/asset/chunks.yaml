    \ Path (DAO) to a Human-Centered Society” section that PoW is an essential mechanism\
    \ for the maintenance of tech-driven public goods. Specifically, we are interested\
    \ in creating club goods, briefly mentioned in “the Path (DAO) to a Human-Centered\
    \ Society” section, whose regulated access rights avoid the well-known “tragedy\
    \ of the commons.” \\[[15](#chapter05.xhtml#r5_15)\\] To regulate access, we exploit\
    \ the advanced blockchain technology of *on-chaining oracles*. On-chaining oracles\
    \ are instrumental in bringing external off-chain information onto the blockchain\
    \ in a trustworthy manner. The on-chained information may originate from human\
    \ users. Hence, on-chaining oracles help tap into human intelligence \\[[16](#chapter05.xhtml#r5_16)\\\
    ]. As PoW, we define the oracles’ contributions to the governance operation of\
    \ the CPSS via decision-making and knowledge sharing, which are both instrumental\
    \ in achieving the specific purpose of CI.\n\n*   **Step 4: Design Tokens with\
    \ Proper Incentive Alignment**\n\n    Most tokens lack proper incentive mechanism\
    \ design. Recall from “Society 5.0: From Robonomics to Tokenomics” section that\
    \ the use of tokens as incentives lie at the heart of the DAO and their investigation\
    \ has started only recently. Importantly, recall that the tokenization process\
    \ creates *tokenized digital twins* to coordinate actors and regulate an ecosystem\
    \ for the pursuit of a desired outcome by including *voting rights*. The creation\
    \ of a tokenized digital twin is done via a *token contract* that incentivizes\
    \ our defined PoW, involving the following two steps: (*i*) create digital twin\
    \ that represents a given asset in the physical or digital world, and (*ii*) create\
    \ one or more tokens that assign access rights/permissions of the given physical/digital\
    \ asset to the blockchain address of the token holder.\n\n*   **Step 5: Facilitate\
    \ Indirect Communication among DAO Members via Stigmergy & Traces**\n\n    Finally,\
    \ let the members participating in a given DAO project (*i*) record their purpose-driven\
    \ token-incentivized activities in ESPN’s blockchain-enabled online environment\
    \ and (*ii*) use these blockchain transactions (e.g., deposits) as *traces* to\
    \ steer the collective behavior toward higher levels of CI in a stigmergy enhanced\
    \ Society 5.0.\n\n[Figure 5.4](#chapter05.xhtml#f5_4) illustrates the functionality\
    \ of each of these five steps in more detail, including their operational interactions.\n\
    \n![FIGURE 5.4 Stigmergy enhanced Society 5.0 using tokenized digital twins for\
    \ advancing collective intelligence (CI) in CPSS.](images/fig5_4.jpg)\n\n[FIGURE\
    \ 5.4](#chapter05.xhtml#b05fig5_4) Stigmergy enhanced Society 5.0 using tokenized\
    \ digital twins for advancing collective intelligence (CI) in CPSS.\n\n## IMPLEMENTATION\
    \ AND EXPERIMENTAL RESULTS\n\nA general definition of human intelligence is the\
    \ success rate of accomplishing tasks. In our implementation, human intelligence\
    \ tasks (HIT) are realized by leveraging the image database ImageNet \n\n [Figure\
    \ 5.5](#chapter05.xhtml#f5_5) depicts the set-up and experimental steps of our\
    \ implementation in more detail. We developed a JavaScript-based HIT platform\
    \ to let a human select from 20 ImageNet images as well as add relevant image\
    \ tagging information and deliver both to the properly configured MTurk and Amazon\
    \ Web Services (AWS) accounts using an intermediate OOCSI server. The answers\
    \ provided by MTurk workers to each submitted HIT were evaluated by an on-chaining\
    \ oracle, which used ERC-20 compliant access right tokens to regulate the voting\
    \ process and release the purpose-driven tokens assigned to each successfully\
    \ tagged image. Finally, the human leaves the discovered/rewarded tokens as stigmergic\
    \ traces on the blockchain to help participating DAO members update their knowledge\
    \ about the reward map and continue its exploration.\n\n![FIGURE 5.5 Discovery\
    \ of hidden token reward map through individual or collective ImageNet tagging\
    \ via Amazon MTurk and on-chaining Oracle.](images/fig5_5.jpg)\n\n[FIGURE 5.5](#chapter05.xhtml#b05fig5_5)\
    \ Discovery of hidden token reward map through individual or collective ImageNet\
    \ tagging via Amazon MTurk and on-chaining Oracle.\n\n[Figure 5.6](#chapter05.xhtml#f5_6)\
    \ shows the beneficial impact of stigmergy on both collective intelligence and\
    \ internal reward in terms of hidden tokens discovered in the reward map by a\
    \ DAO with eight members. For comparison, the figure also shows our experimental\
    \ results without stigmergy, where the DAO members don’t benefit from sharing\
    \ knowledge about the unfolding reward map discovery process.\n\n![FIGURE 5.6\
    \ Collective intelligence (given in percent) and internal reward (given in tokens)\
    \ with and without stigmergy vs. number of crowdsourced Amazon MTurk workers.](images/fig5_6.jpg)\n\
    \n[FIGURE 5.6](#chapter05.xhtml#b05fig5_6) Collective intelligence (given in percent)\
    \ and internal reward (given in tokens) with and without stigmergy vs. number\
    \ of crowdsourced Amazon MTurk workers.\n\n## CONCLUSIONS\n\nSociety 5.0 nicely\
    \ aligns with future 6G’s anticipated shift from industry verticals to more human-centeredness.\
    \ It leverages on CPSS that engage humans in cyber-physical-social behaviors and\
    \ on technologies that enable a paradigm shift from conventional monetary to future\
    \ non-monetary economies, such as our considered blockchain-based Web3 token economy\
    \ and its important role in the recently emerging DAO. Given its similarity to\
    \ decentralized blockchain technology, we adopted stigmergy—a biological self-organization\
    \ mechanism widely found in social insect societies—for facilitating indirect\
    \ communication and internal coordination among offline agents via traces (feedback\
    \ loops) created in a blockchain-based online environment. Our implemented CPSS-based\
    \ bottom-up token-engineering DAO framework for Society 5.0 was experimentally\
    \ shown to increase both CI and rewarded purpose-driven tokens by means of stigmergic\
    \ traces in a blockchain-based online environment involving crowdsourced Amazon\
    \ MTurk workers and validating on-chaining oracle.\n\n## NOTES\n\n1.  [Website](#chapter05.xhtml#n5_105b):\
    \ [https://gizmodo.com/former-facebook-exec-you-don-t-realize-it-but-you-are-1821181133](https://gizmodo.com)\n\
    \n2.  [Website](#chapter05.xhtml#n5_205b): [https://www.image-net.org](https://www.image-net.org)\n\
    \n## REFERENCES\n\n1.  [K. B. Letaief](#chapter05.xhtml#b05ref5_1); W. Chen; Y.\
    \ Shi; J. Zhang and Y. A. Zhang, “The Roadmap to 6G: AI Empowered Wireless Networks,”\
    \ IEEE Communications Magazine, vol. 57, no. 8, pp. 84–90, Aug. 2019."
