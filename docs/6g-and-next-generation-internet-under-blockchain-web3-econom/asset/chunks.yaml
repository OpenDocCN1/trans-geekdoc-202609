    There exist excellent surveys on Bitcoin and other decentralized digital currencies
    (e.g., \[[7](#chapter02.xhtml#r2_7)\]). Likewise, the fundamental concepts and
    potential of blockchain technologies for society and industry in general have
    been described comprehensively in various existent tutorials (e.g., \[[8](#chapter02.xhtml#r2_8)\]).
    In this chapter, we focus on how blockchain technologies can be used in an IoT
    context by providing an up-to-date survey on recent progress and open challenges
    for realizing the emerging blockchain IoT (B-IoT). Unlike the IoT without any
    human involvement in its underlying machine-to-machine (`M2M`) communications,
    the Tactile Internet is anticipated to keep the human in (rather than out of)
    the loop by providing real-time transmission of haptic information, (i.e., touch
    and actuation) for the remote control of physical or virtual objects through the
    Internet. Toward this end, we elaborate on how Ethereum blockchain technologies,
    in particular the `DAO`, may be leveraged to realize future techno-social systems,
    notably the Tactile Internet, which is yet unclear in how exactly it would work
    \[[8](#chapter02.xhtml#r2_8)\]].


    The remainder of this chapter is structured as follows. In “Ethereum versus Bitcoin
    Blockchains” section, we first explain the commonalities of and specific differences
    between Ethereum and Bitcoin blockchains in greater detail. “Blockchain IoT (B-IoT):
    Recent Progress and Related Work” section then reviews recent progress and open
    challenges of the emerging B-IoT. In “The IEEE P1918.1 Tactile Internet” section,
    after briefly reviewing the key concepts of the emerging Tactile Internet, we
    introduce the so-called human-agent-robot teamwork (`HART`) design approach and
    our proposed low-latency FiWi enhanced LTE-A HetNets based on advanced multi-access
    edge computing with embedded artificial intelligence (`AI`) capabilities. In “Decentralizing
    the Tactile Internet” section, we elaborate on the potential role of Ethereum
    and, in particular the `DAO`, in helping decentralize the Tactile Internet. “Blockchain,
    AI, and Human Intelligence: The Path Forward” section discusses the symbiosis
    of blockchain, `AI`, and augmented intelligence in more detail, and “Open Challenges
    and Future Work” section suggests future research areas. Finally, “Conclusions”
    section concludes the chapter.


    # BLOCKCHAIN TECHNOLOGIES


    In this section, we give a brief overview of the basic concepts of blockchain
    technologies, paying particular attention to the main commonalities and specific
    differences between Ethereum and Bitcoin. We then introduce the `DAO`, which represents
    a salient feature of Ethereum that cannot be found in Bitcoin.


    ## Ethereum versus Bitcoin Blockchains


    Blockchain technologies have been undergoing several iterations as both public
    organizations and private corporations seek to take advantage of their potential.
    A typical blockchain network is essentially a distributed database (also known
    as a “ledger”), comprising records of all transactions or digital events that
    have been executed by or shared among participating parties. Blockchains may be
    categorized into public (i.e., `permissionless`) and private (i.e., `permissioned`)
    networks. In the former category, anyone may join and participate in the blockchain.
    Conversely, a private blockchain applies certain access control mechanisms to
    determine who can join the network. A public blockchain is immutable because none
    of the transactions can be tampered with or changed. Also, it is pseudo-anonymous
    because the identity of those involved in a transaction is represented by an address
    key in the form of a random string. [Table 2.1](#chapter02.xhtml#r2_1) highlights
    the major differences between public and private blockchains. Note that both Ethereum
    and Bitcoin are public blockchains. [Figure 2.1](#chapter02.xhtml#r2_1) illustrates
    the main commonalities and differences between Bitcoin and Ethereum. The Bitcoin
    blockchain is predominantly designed to facilitate Bitcoin transactions. It is
    the world’s first functional digital currency that is truly decentralized, open
    source, and censorship resistant. Bitcoin makes use of a cryptographic proof-of-work
    (`PoW`) consensus mechanism based on `SHA256` hash function and digital signatures.
    Achieving consensus provides extreme levels of fault tolerance, ensures zero downtime,
    and makes data stored on the blockchain forever unchangeable and censorship resistant.
    There are two different types of actors, whose roles are defined as follows:


    [Table 2.1](#chapter02.xhtml#r2_1)


    |  || PUBLIC BLOCKCHAIN | PRIVATE BLOCKCHAIN |

    | --- | --- | --- |

    | Network Type | Fully decentralized | Partially decentralized |

    | --- | --- | --- |

    | Access | Permissionless read/write | Permissioned read/write |

    | User Identity | Pseudo-anonymous | Known participants |

    | Consensus Mechanism | Proof-of-work/Proof-of-state | Pre-approved participants
    |

    | Consensus Determination | By all miners | By one organization |

    | Immutability | Nearly impossible to tamper | Could be tampered |

    | Purpose | Any decentralized applications | Business applications |


    ![FIGURE 2.1 Bitcoin and Ethereum blockchains: Commonalities and differences.](images/fig2_1.jpg)


    *   *Regular nodes*: A regular node is a conventional actor, who just has a copy
    of the blockchain and uses the blockchain network to send or receive Bitcoins.

    *   *Miners*: A miner is an actor with a particular role, who builds the blockchain
    through the validation of transactions by creating blocks and submitting them
    to the blockchain network to be included as blocks. Miners serve as protectors
    of the network and can operate from anywhere in the world as long as they have
    sufficient knowledge about the mining process, the hardware and software required
    to do so, and an Internet connection.


    In the Bitcoin blockchain, a block is mined about every 10 minutes, and the block
    size is limited to `1 MB`. Note that the Bitcoin blockchain is restricted to a
    rate of seven transactions per second, which renders it unsuitable for high-frequency
    trading. Other weaknesses of the Bitcoin blockchain include its script language,
    which offers only a limited number of small instructions and is non-Turing-complete.
    Furthermore, developing applications using the Bitcoin script language requires
    advanced skills in programming and cryptography.

