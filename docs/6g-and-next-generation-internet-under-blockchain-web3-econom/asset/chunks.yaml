    # 5 Superorganism to Stigmergic Society & Collective Intelligence in the 6G Era


    DOI: [10.1201/97810034273225](https://doi.org/10.1201/97810034273225)


    ## INTRODUCTION


    Unlike previous generations, future sixth generation (6G) networks are anticipated
    to be transformative by revolutionizing the wireless evolution from “connected
    things” to “connected intelligence.” In his critically acclaimed book “Social
    Physics,” a term originally coined by Auguste Comte, the founder of modern sociology,
    MIT Media Lab professor Alex Pentland argues that social interactions (e.g., social
    learning and social pressure) are the primary forces driving the evolution of
    CI. According to Pentland, CI emerges through shared learning of surrounding peers
    and harnessing the power of exposure to cause desirable behavior change.

