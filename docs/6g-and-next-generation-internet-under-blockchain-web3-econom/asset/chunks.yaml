    # 5From Superorganism to Stigmergic Society & Collective Intelligence in the 6G
    Era


    DOI: [10.1201/9781003427322-5](https://doi.org/10.1201/9781003427322-5)


    ## INTRODUCTION


    Unlike previous generations, future sixth generation (6G) networks are anticipated
    to be transformative by revolutionizing the wireless evolution from “connected
    things” to “connected intelligence” \[[1](#chapter05.xhtml#r5_1)\]. In his critically
    acclaimed book “Social Physics,” a term originally coined by Auguste Comte, the
    founder of modern sociology, MIT Media Lab professor Alex Pentland argues that
    social interactions (e.g., social learning and social pressure) are the primary
    forces driving the evolution of *collective intelligence (CI)*. According to Pentland,
    CI emerges through shared learning of surrounding peers and harnessing the power
    of exposure to cause desirable behavior change and build communities. He concludes
    that humans have more in common with bees than we like to admit and that future
    techno-social systems should scale up ancient decision-making processes we see
    in bees.'
