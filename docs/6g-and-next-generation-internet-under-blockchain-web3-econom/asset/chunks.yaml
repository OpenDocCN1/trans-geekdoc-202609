    decentralized, open market and internetwork for AIs,” November 2017. [https://singularitynet.io](https://singularitynet.io).


    ## REFERENCES


    1.  [M. Maier](#chapter02.xhtml#b02ref2_1), M. Chowdhury, B. P. Rimal and D. P.
    Van, “The Tactile Internet: Vision, Recent Progress, and Open Challenges,” IEEE
    Communications Magazine, vol. 54, no. 5, pp. 138–145, 2016.


    2.  [D. Tapscott](#chapter02.xhtml#b02ref2_2) and A. Tapscott, Blockchain Revolution:
    How the Technology Behind Bitcoin Is Changing Money, Business, and the World,
    Portfolio, Penguin, Toronto, 2016.


    3.  [W. Saad](#chapter02.xhtml#b02ref2_3), M. Bennis and M. Chen, “A Vision of
    6G Wireless Systems: Applications, Trends, Technologies, and Open Research Problems,”
    Preprint, arXiv:1902.10265, 2019.


    4.  [T. Salman](#chapter02.xhtml#b02ref2_4), M. Zolanvari, A. Erbad, R. Jain and
    M. Samaka, “Security Services Using Blockchains: A State of the Art Survey,” IEEE
    Communications Surveys & Tutorials, vol. 21, no. 1, pp. 858–880, 2019.


    5.  [V. Buterin](#chapter02.xhtml#b02ref2_5), “A Next-Generation Smart Contract
    and Decentralized Application Platform,” Ethereum White Paper, [www.ethereum.org](http://www.ethereum.org).


    6.  [A. McAfee](#chapter02.xhtml#b02ref2_6) and E. Brynjolfsson, Machine, Platform,
    Crowd: Harnessing Our Digital Future, W. W. Norton, New York, NY, 2017.'
