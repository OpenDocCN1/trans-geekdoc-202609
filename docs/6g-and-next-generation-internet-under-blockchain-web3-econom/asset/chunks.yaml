    \ 13\n    * `Town Crier`, 14–15\n    * 验证预言机, 14\n* 区块链技术; *另见* 区块链预言机; 以太坊 *vs*\
    \ 区块链 \n    * DApps, 8–9\n    * 去中心化, 25, 26\n    * 比特币的出现, 8\n    * 以太坊, 8, 26\n\
