  raw: 'A very interesting example to catalyze human and machine intelligence toward
    a new form of self-organizing artificial general intelligence (AGI) across the
    Internet is the so-called *SingularityNET* ([https://singularitynet.io](https://singularitynet.io)).
    One can think of SingularityNet as a *decentralized self-organizing cooperative
    (DSOC)*, a concept similar to DAO. DSOC is essentially a distributed computing
    architecture for making new kinds of smart contracts. Entities executing these
    smart contracts are referred to as agents, which can run in the cloud, on phones,
    robots, or other embedded devices. Services are offered to any customer via APIs
    enabled by smart contracts and may require a combination of actions by multiple
    agents using their collective intelligence. In general, there may be multiple
    agents that can fulfill a given task request in different ways and to different
    degrees. Each task request to the network requires a unique combination of agents,
    thus forming a so-called *offer network* of mutual dependency, where agents make
    offers to each other to exchange services via offer-request pairs. Whenever someone
    wants an agent to perform services, a smart contract is signed for this specific
    task. Toward this end, DSOC aims at leveraging contributions from the broadest
    possible variety of agents by means of superior discovery mechanisms for finding
    useful agents and *nudging* them to become contributors.


    ### Nudge Contract: Nudging via Smart Contract


    Extending on DSOC and the judge contract introduced in the “Introduction” section,
    we develop a *nudge contract* for enhancing the human capabilities of unskilled
    crowd members of the DAO. According to Richard H. Thaler, the 2017 Nobel Laureate
    in Economics, a nudge is defined as any aspect of a choice architecture that alters
    people’s behavior in a predictable way without forbidding any options or significantly
    changing their economic incentives. Deployed appropriately, nudges can *steer
    people*, as opposed to steer objects—real or virtual—as done in the conventional
    Tactile Internet, to make better choices and positively influence the behavior
    of crowds of all types.


    ### Results


    Our nudge contract aims at completing interrupted physical tasks by learning from
    a skilled DAO member with the objective of minimizing the learning loss, which
    denotes the difference between the achievable and optimum task execution times.
    Given the reward enabled by the nudge contract and associated with each skill
    transferred, a remote skilled DAO member submits a hash address of the learning
    instructions to an unskilled human/robot. The hash address is stored on the blockchain,
    whereby the corresponding data of the learning instructions may be stored on a
    remote decentralized storage server, e.g., Inter-Planetary File System (IPFS)
    ![FIGURE 3.4 Learning loss (in seconds) vs. subtask learning probability for different
    number nsub of subtasks and traverse time ttraverse.](images/fig3_4.jpg)


    [FIGURE 3.4](#chapter03.xhtml#b03fig3_4) Learning loss (in seconds) vs. subtask
    learning probability for different number *n[sub]* of subtasks and traverse time
    *ttraverse*.


    ## CONCLUSIONS


    In this chapter, we explored how Ethereum blockchain technologies, in particular
    the DAO, may be leveraged to decentralize the Tactile Internet, which enables
    unprecedented mobile applications for remotely steering real or virtual objects/processes
    in perceived real-time and represents a promising example of future techno-social
    systems. We showed that a higher level of decentralization of AI-enhanced MEC
    reduces the average computational task completion time by up to 89.5% by setting
    the computation offloading probability to 0.7. Further, we observed that crowdsourcing
    of human assistance is beneficial in decreasing the average completion time of
    physical tasks for medium to high feedback misforecasting probabilities, provided
    the human offers equal or even superior operational capabilities, i.e., $\\frac{f\_{human}}{f\_{robot}}
    \\geq 1$ . Toward this end, our proposed nudge contract tries to successfully
    accomplish tasks via shared intelligence among failing robots and skilled humans.
    An interesting research avenue to be explored is to offload the computation tasks
    not just on the MEC servers but also on the underutilized neighbor end-users,
    a method commonly known as *mobile ad hoc cloud*.


    ## NOTES


    1.  [Website](#chapter03.xhtml#n3_103b): [https://ipfs.io/](https://ipfs.io)


    2.  [We](#chapter03.xhtml#n3_203b) assume that the incoming physical tasks are
    decomposable, meaning that they can be broken into a number of subtasks. An example
    of such tasks can be the part assemblage in an industry automation scenario.


