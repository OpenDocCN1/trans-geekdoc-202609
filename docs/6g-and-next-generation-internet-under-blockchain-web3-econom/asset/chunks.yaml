- fmt: "\n# CoZ Interface and Pepper Strategies\n\nThe user `CoZ` interface also displays\
    \ nine social cue buttons to prevent possible typos and save time for observers\
    \ to fill communication gaps. The nine social cue buttons were as follows: “Gain\
    \ time,” “Tell me about it,” “Good job,” “Hi,” “Bye,” “Open arms,” “Taunting hands,”\
    \ “No,” and “Ask for attention.” Observers may press to perform different gestures\
    \ of `Pepper` during conversation and thereby influence the trustee’s behavior.\
    \ \n\nIn addition, we drafted two scripts, one for a logical persuasive strategy\
    \ appealing to the left side of the brain (i.e., `logics`) and another one for\
    \ an affective persuasive strategy appealing to the right side of the brain (i.e.,\
    \ `emotions`) of the trustee. Each script contains pre-specified sentences stored\
    \ in pull-down menus in the `CoZ` interface, from which observers may choose in\
    \ order to nudge the trustee’s behavior toward reciprocity via real-time text-to-speech\
    \ messages. The different persuasive robot strategies operate as follows:\n\n\
    - **Logical Strategy**: Contains a set of reward and punishment mechanisms. In\
    \ addition, `Pepper` performs some economical and technical advice via text-to-speech\
    \ through the above described `CoZ` platform.\n- **Affective Strategy**: Contains\
    \ a set of reward/punishment mechanisms and `Pepper` uses text-to-speech encouragement\
    \ messages through the `CoZ` platform. In addition, `Pepper` shows social cues\
    \ by means of gestures and embodied communications toward the trustee.\n- **Mixed\
    \ Strategy**: Combines the above logical and affective strategies into one mixed\
    \ strategy. It contains a set of reward/punishment mechanisms and `Pepper` provides\
    \ not only economical and technical advice but also encouragement via text-to-speech\
    \ messages through the `CoZ` platform. In addition, `Pepper` shows social cues\
    \ by means of gestures and embodied communications toward the trustee.\n\nFor\
    \ illustration, [Table 4.1](#chapter04.xhtml#t4_1) lists the social cues used\
    \ by `Pepper` in our proposed mixed logical-affective persuasive strategy. In\
    \ this strategy, one observer plays the logical strategy and the other observer\
    \ plays the affective strategy such that the trustee receives mixed messages and\
    \ mixed-em-bodied communications. Depending on the trustee’s behavior, the observers\
    \ carry out the “Trusted behavior action” or the “Untrusted behavior action” in\
    \ each round of the experiment. The social cues in [Table 4.1](#chapter04.xhtml#t4_1)\
    \ enable the observers to control `Pepper`’s text-to-speech and embodied communications\
    \ using our developed `CoZ` platform.\n\n### Experimental Setup\n\nWe ran large-scale\
    \ experiments involving 20 students to measure the effectiveness of our developed\
    \ persuasive robotics strategies (i.e., logical, affective, and mixed strategies).\
    \ Similar to our last experiment in the two players’ trust game, the participating\
    \ students didn’t know each other’s identity. Also, students hadn’t conducted\
    \ any behavioral research experiments before. The age of the selected students\
    \ was between 24 and 32 years. Three students were female and seventeen students\
    \ were male. The experiment was divided into four trials: baseline, logical, affective,\
    \ and mixed strategy. Each trial involved 5 rounds. We first conducted a baseline\
    \ trust-game experiment, where trustees didn’t interact with `Pepper`, as done\
    \ previously, followed by experiments exposing trustees to `Pepper`’s logical,\
    \ affective, and mixed logical-affective persuasive strategies. Both trustor and\
    \ trustee interacted via a blockchain account with the experimenter’s smart contract.\
    \ The trustor played the game from a separate room, while the trustee was in the\
    \ lab alone with `Pepper`. `Pepper` was controlled via our `CoZ` platform remotely\
    \ by the observer. We used the same parameter settings, i.e., endowment `X` =\
    \ 10 Ether for the trustor and `K` = 2. Further, in all persuasive strategies,\
    \ we didn’t use any deposit mechanism (i.e., `D` = 0).\n\n### Results\n\nThe system\
    \ initializes the state using the following function:\n```javascript\nif (endowment\
    \ > K) {\n    updateStrategy(X, \"logical\");\n}\n```\n"
  raw: 'The user CoZ interface also displays nine social cue buttons to prevent possible
    typos and save time for observers to fill communication gaps. The nine social
    cue buttons were as follows: “Gain time,” “Tell me about it,” “Good job,” “Hi,”
    “Bye,” “Open arms,” “Taunting hands,” “No,” and “Ask for attention.” Observers
    may press to perform different gestures of Pepper during conversation and thereby
    influence the trustee’s behavior. In addition, we drafted two scripts, one for
    a logical persuasive strategy appealing to the left side of the brain (i.e., logics)
    and another one for an affective persuasive strategy appealing to the right side
    of the brain (i.e., emotions) of the trustee. Each script contains pre-specified
    sentences stored in pull-down menus in the CoZ interface, from which observers
    may choose in order to nudge the trustee’s behavior toward reciprocity via real-time
    text-to-speech messages. The different persuasive robot strategies operate as
    follows:


    *   **Logical Strategy**: Contains a set of reward and punishment mechanisms.
    In addition, Pepper performs some economical and technical advice via text-to-speech
    through the above described CoZ platform.


    *   **Affective Strategy**: Contains a set of reward/punishment mechanisms and
    Pepper uses text-to-speech encouragement messages through the CoZ platform. In
    addition, Pepper shows social cues by means of gestures and embodied communications
    toward the trustee.


    *   **Mixed Strategy**: Combines the above logical and affective strategies into
    one mixed strategy. It contains a set of reward/punishment mechanisms and Pepper
    provides not only economical and technical advice but also encouragement via text-to-speech
    messages through the CoZ platform. In addition, Pepper shows social cues by means
    of gestures and embodied communications toward the trustee.


    For illustration, [Table 4.1](#chapter04.xhtml#t4_1) lists the social cues used
    by Pepper in our proposed mixed logical-affective persuasive strategy. In this
    strategy, one observer plays the logical strategy and the other observer plays
    the affective strategy such that the trustee receives mixed messages and mixed-em-bodied
    communications. Depending on the trustee’s behavior, the observers carry out the
    “Trusted behavior action” or the “Untrusted behavior action” in each round of
    the experiment. The social cues in [Table 4.1](#chapter04.xhtml#t4_1) enable the
    observers to control Pepper’s text-to-speech and embodied communications using
    our developed CoZ platform.


    [TABLE 4.1](#chapter04.xhtml#b04tbl4_1) Social cues used by Pepper in mixed persuasive
    strategy


    | ROUND NUMBER || TRUSTED BEHAVIOR ACTION || UNTRUSTED BEHAVIOR ACTION |


    | --- | --- | --- |


    | **Round 1** || *Text-to-speech:* Trust Game is a cooperative investment game.You
    all play together to get the best total payoff! || Untrusted behavior will be
    shown in Round 2 |


    | --- | --- | --- |


    | **Round 2** || *Text-to-speech:* Awesome! That’s a split worth celebrating!*Embodied
    communication:* Open arm gesture. || *Text-to-speech:* If this behavior is repeated,you
    will receive a punishment from the observers.*Embodied communication:* Taunting
    hand gesture. |


    | **Round 3** || *Text-to-speech:* If this good behavior is repeated,your partner
    will invest more in the next round.*Embodied communication:* Open arm gesture.
    || *Text-to-speech:* Weak reciprocity can causecostly punishment for you.*Embodied
    communication:* Taunting hand gesture. |


    | **Round 4** || *Text-to-speech:* Incredible! Your partner must be impressed!*Embodied
    communication:* Open arm gesture. || *Text-to-speech:* With such a behavior,the
    punishment will be executed next round.*Embodied communication:* Taunting hand
    gesture. |


    | **Round 5** || *Text-to-speech:* Congrats! Your good behaviortoward your partner
    has provided you with an incrementaltotal payoff over all rounds of the game.*Embodied
    communication:* Open arm gesture. || *Text-to-speech:* Your bad behaviortranslated
    into a very weak total payoff.*Embodied communication:* Taunting hand gesture.
    |


    ### Experimental Setup


    We ran large-scale experiments involving 20 students to measure the effectiveness
    of our developed persuasive robotics strategies (i.e., logical, affective, and
    mixed strategies). Similar to our last experiment in the two players’ trust game,
    the participating students didn’t know each other’s identity. Also, students hadn’t
    conducted any behavioral research experiments before. The age of the selected
    students was between 24 and 32 years. Three students were female and seventeen
    students were male. The experiment was divided into four trials: baseline, logical,
    affective, and mixed strategy. Each trial involved 5 rounds. We first conducted
    a baseline trust-game experiment, where trustees didn’t interact with Pepper,
    as done previously, followed by experiments exposing trustees to Pepper’s logical,
    affective, and mixed logical-affective persuasive strategies. Both trustor and
    trustee interacted via a blockchain account with the experimenter’s smart contract.
    The trustor played the game from a separate room, while the trustee was in the
    lab alone with Pepper. Pepper was controlled via our CoZ platform remotely by
    the observer. We used the same parameter settings, i.e., endowment *X* = 10 Ether
    for the trustor and *K* = 2. Further, in all persuasive strategies, we didn’t
    use any deposit mechanism (i.e., *D* = 0).


    ### Results


    [Figure 4.6](#chapter04.xhtml#f4_6) demonstrates the superior effectiveness of
    our persuasive strategies, especially mixed ones appealing to both sides of the
    brain, resulting in average normalized reciprocity well above 100%. Further, to
    better reveal the differences among the persuasive strategies, we have calculated
    the measurement range for the four strategies. The measurement range for the baseline
    experiment is 48.2 (Max = 81, Min = 32.8), while for the logical strategy, it
    is 67.8 (Max = 176.4, Min = 108.6), for the affective strategy, it is 59.4 (Max
    = 165.6, Min = 106.2), and the mixed strategy, it is 67 (Max = 194.4, Min = 127.4).
    As the results show, the baseline experiment has the smallest measurement range.
    Next, we computed the standard deviation for the baseline experiment as well as
    logical, affective, and mixed strategies, which is equal to 15.6, 21.75, 21.10,
    and 22.73, respectively. The results show that the baseline experiment has the
    smallest standard deviation among all considered strategies, while the mixed strategy
    has the largest one. Finally, we have computed the variance for the persuasive
    strategies under consideration. The calculated variance equals 245.83, 473.17,
    445.25, and 517.03 for the baseline, logical, affective, and mixed strategy, respectively.
    Based on the gathered results, we observe that the baseline experiment has the
    smallest and the mixed strategy has the largest variance.


    ![FIGURE 4.6 Average normalized reciprocity q/p without (baseline experiment)
    and with using logical, affective, and mixed logical-affective persuasive strategies
    for d = 0 (shown with minimum-to-maximum measured score intervals).](images/fig4_6.jpg)


    [FIGURE 4.6](#chapter04.xhtml#b04fig4_6) Average normalized reciprocity *q/p*
    without (baseline experiment) and with using logical, affective, and mixed logical-affective
    persuasive strategies for *d* = 0 (shown with minimum-to-maximum measured score
    intervals).


    ## CONCLUSIONS'
