    “触觉互联网”（Tactile Internet）这一术语由 `Fettweis` 于 2014 年提出。在他的开创性论文 `[21]` 中，触觉互联网被定义为一种突破性技术，通过要求`1–10
    ms`的往返延迟，实现了对现实和虚拟对象进行触觉引导和控制的前所未有的移动应用。随后在 2014 年后期，`ITU-T`发布了一份关于触觉互联网的技术观察报告，强调扩大有线和无线接入网络领域的研究至关重要，这将引入新的想法和概念，增强接入网络的冗余和多样性，以满足触觉互联网应用对严格延迟以及载波级可靠性的要求
    `[22]`。触觉互联网为实时远程物理交互提供了媒介，这需要在虚拟或真实对象（即人类、机器和流程）之间进行闭环信息的交换。这种强制性的端到端设计充分体现在新兴
    `IEEE P1918.1` 标准工作组（成立于 2016 年 3 月）参考架构的关键原则中，该工作组旨在为触觉互联网定义框架 `[23]`。其中，关键原则构想了(i)
    开发一种通用的触觉互联网参考架构；(ii) 通过无线（例如蜂窝、WiFi）或无线线混合网络支持局域及广域连接；(iii) 利用网络边缘云变体的计算资源。该工作组将触觉互联网定义为“一种网络或网络集合，用于人类或机器以感知实时远程访问、感知、操作或控制现实或虚拟对象或流程”。`IEEE
    P1918.1` 中考虑的一些关键用例包括远程操作、触觉通信、沉浸式虚拟现实和汽车控制。


    为了使其更具 5G 中心特色，触觉互联网最近也被称为 5G 赋能的触觉互联网 `[24, 25]`。请记住，与之前的四代蜂窝网络不同，未来的 5G 网络将导致蜂窝和
    WiFi 技术及标准的日益融合 `[26]`。此外，还需要认识所谓“回传瓶颈”重要性，这需要一种同时利用无线前端和有线回传技术的端到端设计方法。或者正如 `[26]`
    的首席作者 `Andrews` 雄辞地指出的：“在各地部署基站对于为移动站提供高速接入是极好的，但难道这只是把责任推给了基站吗？基站现在必须以某种方式将这些数据在有线核心网络之间进行传输？”
    `[27]`。显然，触觉互联网开启了许多令人兴奋的研究方向，通过互联网为人机交互增加了一个新维度。根据上述 `ITU-T` 技术观察报告，触觉互联网应该是当今物联网（IoT）演变的下一次飞跃，尽管
    5G、IoT 和触觉互联网之间存在显著重叠。例如，`Fig. 2.3]` 通过 IoT、5G 和触觉互联网这三个视角提供了上述共同点和差异的视图。主要差异最好通过底层通信范式和实现设备来表达。`IoT`依赖于
    `M2M` 通信，重点关注智能设备（例如传感器和执行器）。在与新兴的 `MTC` 共存的同时，`5G` 将保持其传统的人机（`H2H`）通信范式用于传统的三业务业务（语音、视频和数据），并日益关注与其他无线技术（尤其是
    WiFi）的集成以及去中心化。相反，触觉互联网将以利用触觉和力觉设备的人机（`H2M`）通信为中心。更重要的是，尽管存在差异，`IoT`、`5G`和触觉互联网似乎正在向一组共同的重要设计目标融合：


    ![图 2.3 物联网 (IoT)、5G 和触觉互联网的三个视角：共同点与差异。](img/fig2_3.jpg)


    `FIGURE 2.3` 物联网 (IoT)、5G 和触觉互联网的三个视角：共同点与差异。


    *   量级为 1 ms 的极低延迟

    *   极高可靠性，几乎可以保证 99.999%的可用性

    *   H2H 和 M2M 共存

    *   以数据为中心技术的集成，特别关注 WiFi

    *   安全性


    重要的是，触觉互联网涉及`H2M`交互固有的“人在环”（`HITL`）本质，而与其底层`M2M`通信中完全没有人类参与的新兴`IoT`不同。尽管`M2M`
    通信对于工业和其他以机器为中心的流程的自动化有用，但触觉互联网将以人机/机器人（`H2M/R`）通信为中心，从而允许采用以人为中心的设计方法，以创造新的沉浸式体验，并通过互联网扩展人类的能力（即对人类的增强而非自动化）
    `[28]`。


    ### 人-智能体-机器人协作


    通过一种能够流流协调人类与机器协同活动的流程来实现高级人机协作的一种前景前景的方法，可以在尚年轻的人-智能体-机器人协作（`HART`）领域 `[29]`。与早期的自动化研究不同，HART
    超越了对完全自主（即完全的独立和自给自足）以及自主系统之间协作/协作自主的单一关注，这些目标是在设计人类环外的解决方案时排除人类作为潜在的队友。在 HART
    中，人类与机器之间功能和任务的动态分配起着核心作用，这种分配可能随时间变化或在不同情况下不可预测。特别是，随着日益智能的机器的兴起，历史上通过“人类擅长/机器擅长”（`HABA/MABA`）方法来决定哪些任务最适合人类执行哪些由机器执行而非协同工作的方法已经过时。为了更好地理解当前智能机器的潜力和局限性，`T.
    H. Davenport`和`J. Kirby`在他们的著作*Only Humans Need Apply: Winners and Losers in the
    Age of Smart Machines*中沿着两个维度对智能机器的能力分类，即行动能力和学习能力。行动能力涉及四个任务级别，从最基础的任务（例如分析数字）到执行数字任务（由智能体完成）甚至物理任务（由机器人完成）。另一方面，学习能力通过四个等级升级，从没有内在智能的人类辅助机器到具有上下文感知、学习甚至自我意识智能的机器。


