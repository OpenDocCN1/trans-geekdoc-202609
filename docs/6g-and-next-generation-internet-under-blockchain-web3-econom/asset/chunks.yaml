  trans: '

    以太坊目前是仅次于比特币的热门区块链。它由瑞士非营利组织以太坊基金会开发，并来自全球开发者的贡献。以太坊有自己的名为“Ether”的加密货币，它提供了允许跨网络价值交换的主要流动性形式。Ether
    还提供了支付和赚取支持及使用网络产生的交易费的机制。与比特币一样，Ether 也是投机的对象，经历了巨大的波动。以太坊非常适合开发需要快速构建，并通过区块链平台进行高效、安全交互的
    DApps。与比特币类似，以太坊使用 PoW（工作量证明）共识方法来验证交易并证明某些工作成果。PoW 机制使用的哈希算法被称为“Ethash”。与比特币不同，以太坊开发者期望用
    PoW 替代所谓的“权益证明”（PoS）共识。PoS 要求矿工持有一定量的 Ether，如果矿工试图攻击区块链网络，这些 Ether 将被没收。以太坊平台通常被称为构建在底层区块链之上的“图完备以太坊虚拟机（EVM）”。图完备意味着只要资源足够，任何系统或编程语言都能计算任何可计算的内容。请注意，EVM
    执行交易需要少量的费用。这些费用被称为“gas”，所需的 gas 数量取决于给定指令的大小。指令越长，需要的 gas 就越多。


    比特币区块链简单地包含一个交易列表，而以太坊的基本单位是“账户”。以太坊区块链跟踪每个账户的状态，其中所有的状态转换都是账户之间价值和信息的传输。账户概念被认为是以太坊区块链的核心组成部分数据模型，因为用户通过交易与以太坊网络交互至关重要。账户代表外部代理的身份（例如人类或自动化代理、矿矿节点）。账户使用公钥加密对每笔交易进行签名，以便
    EVM 可以安全地验证交易发送者的身份。


    除了 C++ 之外，以太坊还支持几种基于 JavaScript 和 Python 的编程语言（例如 Solidity、Serpent、Mutan 或 LLL），其中
    Solidity 是编写所谓的“智能合约”最流行的语言。智能合约是一种完全按照程序运行且不受任何第三方干预的协议。它使用自己任意的所有权规则、交易格式和状态转换逻辑。智能合约的每个方法都可以通过交易或另一个方法调用。智能合约实现了
    DApps 的应用，在应用程序编程接口（API）方面，DApps 可能与传统应用程序看起来完全一样，尽管中心化的后端服务被运行在去中心化以太坊网络上的智能合约取代，而不依赖任何中央服务器。现有的有趣
    DApps 包括 Augur（一个去中心化预测市场）、Weifund（开源筹平台）、Golem（超级计算）和 Ethlance（去中心化工作市场平台）等。为了在
    DApps 之间提供有效的通信手段，以太坊使用了 Whisper P2P 协议，这是一种用于秘密消息和数字加密的全去中心化中间件。Whisper 支持在不需要信任第三方的情况下创建加密通信路由。它基于采样服务，考虑了网络地址翻译（NAT）和防火墙等网络限制。通常，任何中心化服务都可以通过以太坊区块链转换为
    DApp。


    ### 去中心化自治组织 (DAOs)


    加密货币和区块链最显著的可能是它们让全球范围内的人和组织在追求自身利益的同时创造巨大的共享价值。许多观察者认为，这是目前公司的真实替代。加密货币的去中心化、基于群体的技术、分布式账本、分布式共识和智能合约提供了从根本上改变人们组织事务的方式，并为企业设计提供了新的范式。最近用群体取代公司的两个尝试是区块链技术和
    DAOs。DAO 是没有中央权威或领导者的去中心化组织。它们运行在编码以太坊区块链上的编程代码上。与区块链一样，DAO 的代码通过消除对中心化控制的需求，脱离了传统组织。即使是
    DAO 的原始开发者也没有额外的权限，因为它在没有任何人工干预的情况下独立运行。它可能由一组个人资助以支付基本成本，并给予资助者投票权而不是任何形式的所有权或股权。这创建了一个自主且透明的系统，只要它为客户提供有用的服务，它就会在网络上继续运行。


    部署 DAO 概念实现智能合约自动化的成功示例是 Storj，它是一个去中心化、安全、隐私且加密的云存储平台，可以作为 Dropbox 或 Google Drive
    等中心化存储提供者的替代方案。DAO 可能由一组个人资助以支付基本成本，给予资助者投票权而不是任何形式的所有权或股权。这创建了一个自主且透明的系统，只要它为客户提供有用的服务，它就会在网络上继续运行。DAO
    以开源分布式软件的形式存在，执行智能合约并根据指定的治理规则和指南工作。Buterin 在以太坊博客上这样描述 DAO 的理想：“它是运行在互联网上并自主运行的实体，但也高度依赖雇佣个人来执行自动化本身无法完成特定任务。”与完全自主的
    AI 代理不同，DAO 仍然需要人类的深度参与，特别是根据 DAO 定义的协议进行交互以运行。为了说明 DAO 和 AI 的区别，图 2.2 显示了一个象限图，根据自动化和人类在边缘和中心的参与程度，对
    DAOs、AI、传统组织以及机器人（已广泛部署在装配线等领域中）进行了分类。我们将详细阐述如何利用 DAO 的这一特定特征（即中心是自动化，边缘是人类）在“去中心化触觉互联网”章节中开发触觉互联网。为此，我们还简要指出，根据
    Buterin 的观点，DAO 是非营利的，尽管人们可以在 DAO 中赚钱，但不是通过投资 DAO 本身，而是通过参与其生态系统（例如通过成员身份）。


    ![图 2.2 DAOs 与人工智能、传统组织以及机器人（已广泛部署在装配线等领域中）：自动化和人类在边缘和中心的参与程度。（来自以太坊博客）](img/fig2_2.jpg)


    为了方便起见，表 2.2 总结了比特币和以太坊区块链对比的技术细节。

    '
- fmt: '

    ## Comparison of Bitcoin and Ethereum blockchains


    | | BITCOIN | ETHEREUM |

    | --- | --- | --- |

    | Currency | Bitcoin | Ether |

    | Applications | Cryptocurrency | Cryptocurrency, Smart Contract, DApps/DAO |

    | Written in | C++ | C++, Go, Python |

    | Consensus | Proof-of-work (based on SHA-256) | Proof-of-work (Ethash), Planning
    for proof-of-stake |

    | Turing Completeness | No | Yes |

    | Anonymity Mechanisms | No | Yes (with Whisper protocol) |

    | Censorship Resistance | No | Yes |

    | Transaction Limit | 7 transactions/sec | 20 transactions/sec |

    | State Concept | No | Data |

    | Smart Contract Languages | No | Solidity, Serpent, Mutan, LLL |

    | Smart Contract Execution | No | Ethereum Virtual Machine (EVM) |

    | Block Time | 10 minutes | 15 seconds |

    | Data Model | Transaction-based | Account-based |

    | Client P2P Connections | No | Yes (with Whisper protocol) |

    | Routing | No | Yes (Whisper protocol) |


    ## BLOCKCHAIN IoT AND EDGE COMPUTING


    In this section, after defining the integration of blockchain and IoT (B-IoT),
    we discuss the motivation for such integration followed by a description of the
    challenges of integrating blockchain and edge computing.


    ### Blockchain IoT (B-IoT): Recent Progress and Related Work


    Recall from Introduction that the IoT is designed to enable communications among
    machines without relying on any human involvement. Thus, its underlying M2M communications
    is useful for enabling the automation of industrial and other machine-centric
    processes. The emerging B-IoT represents a powerful combination of two massive
    technologies—blockchain and M2M communications—that allows us to automate complex
    multistep IoT processes (e.g., via smart contracts). With the ever-increasing
    variety of communication protocols between IoT devices, there is a need for transparent
    yet highly secure and reliable IoT device management systems. This section surveys
    the state of the art of the emerging B-IoT, describing recent progress and open
    challenges.


    The majority of IoT devices are resource constrained, which restricts them to
    be part of the blockchain network. To cope with these limitations, Novo `[[9](#chapter02.xhtml#r2_9)]`
    proposed a decentralized access management system, where all entities are part
    of an Ethereum blockchain except for IoT devices as well as so-called “management
    hub” nodes that request permissions from the blockchain on behalf of the IoT devices
    belonging to different wireless sensor networks. In addition, entities called
    “managers” interact with the smart contract hosted at a specific “agent node”
    in the blockchain to define or modify the access control policies for the resources
    of their associated IoT devices. The proof-of-concept implementation evaluated
    the new system architecture components that are not part of the Ethereum network
    (i.e., management hub and IoT devices) and demonstrated the feasibility of the
    proposed access management architecture in terms of latency and scalability. Another
    interesting Ethereum case study can be found in `[[10](#chapter02.xhtml#r2_10)]`,
    which reviews readily available Ethereum blockchain packages for realizing a smart
    home system according to its smart contract features for handling access control
    policy, data storage, and data flow management.


    The architectural issues for realizing blockchain-driven IoT services were investigated
    in greater detail by Liao et al. `[[11](#chapter02.xhtml#r2_11)]`. In a preliminary
    study using a smart-thing-renting service as an example B-IoT service, the authors
    compared the following four different architectural styles based on Ethereum:
    (i) fully centralized (cloud without blockchain), (ii) pseudo-distributed things
    (physically located in central cloud), (iii) distributed things (directly controlled
    by smart contract), and (iv) fully distributed. The preliminary results indicate
    that a fully distributed architecture, where a blockchain endpoint is deployed
    on the end-user device, is superior in terms of robustness and security.


    The various perspectives for integrating secure elements in Ethereum transactions
    were discussed in `[[12](#chapter02.xhtml#r2_12)]`. A novel architecture for establishing
    trust in Ethereum transactions exchanged by smart things was presented. To prevent
    the risks that secret keys for signature are stolen or hacked, the author proposed
    to use `javacard-secure elements` and a so-called “cryptocurrency smart card”
    (CCSC). Two CCSC use cases were discussed. In the first one, the CCSC was integrated
    in a low-cost B-IoT device powered by an `Arduino` processor, in which sensor
    data are integrated in Ethereum transactions. The second use case involved the
    deployment of CCSC in remote APDU call secure (RACS) servers to enable remote
    and safe digital signatures by using the well-known elliptic curve digital signature
    algorithm (`ECDSA`).


    Blockchain transactions require public-key encryption operations such as digital
    signatures. However, not all B-IoT devices can support this computationally intensive
    task. For this reason, Polyzos and Fotiou `[[13](#chapter02.xhtml#r2_13)]` proposed
    a preliminary design of a gateway-oriented approach, where all blockchain-related
    operations are offloaded to a gateway. The authors noted that their approach is
    compatible with the Ethereum client-side architecture.


    Because of the massive scale and distributed nature of IoT applications and services,
    blockchain technology can be exploited to provide a secure, tamper-proof B-IoT
    network. More specifically, the key properties of tamper-resistance and decentralized
    trust allow us to build a secure authentication and authorization service, which
    does not have a single point of failure. Toward this end, Gupta et al. `[[14](#chapter02.xhtml#r2_14)]`
    made a preliminary attempt to develop a security model backed by blockchain that
    provides confidentiality, integrity, and availability of data transmitted and
    received by nodes in a B-IoT network. The proposed solution encompasses a blockchain
    protocol layer on top of the `TCP/IP` transport layer and a blockchain application
    layer. The first one comprises a distributed consensus algorithm for B-IoT nodes,
    whereas the latter one defines the IoT security-specific transactions and their
    semantics for the higher protocol layers. To evaluate the feasibility and performance
    of the proposed layered architecture, B-IoT nodes connected in a tree topology
    were simulated using `1 Gbps Ethernet` or `54 Mbps WiFi links. The simulation
    results showed that the block arrival rate was not affected much by the increased
    latency and reduced bandwidth when replacing wired Ethernet with wireless WiFi
    because the block difficulty adjustment adapts dynamically to the network conditions.


    Among various low-power wide-area (LPWA) technologies, long-range (`LoRa`) wireless
    radio frequency (`RF`) is considered one of the most promising enabling technologies
    for realizing massive IoT deployment. Özyilmaz and Yurdakul `[[15](#chapter02.xhtml#r2_15)]`
    presented a proof-of-concept demonstrator to enable low-power, resource-constrained
    LoRa IoT end devices to access an Ethereum blockchain network via an intermediate
    gateway, which acts as a full blockchain node. More specifically, a battery-powered
    IoT end device sends position data to the LoRa gateway, which in turn forwards
    it through the standard Go-lang-based Ethereum client `Geth` to the blockchain
    network using a smart contract. An event-based communication mechanism between
    the LoRa gateway and a backend application server was implemented as proof-of-concept
    demonstrator.

