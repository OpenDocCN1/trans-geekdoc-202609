    \n## INTRODUCTION\n\nThe Internet has been constantly evolving from the mobile\
    \ Internet to the emerging Internet of Things (IoT) and future Tactile Internet.\
    \ Similarly, the capabilities of future 5G networks will extend far beyond those\
    \ of previous generations of mobile communication. Besides 1000-fold gains in\
    \ area capacity, 10 Gb/s peak data rates, and connections for at least 100 billion\
    \ devices, an important aspect of the 5G vision is *decentralization*. While 2G,\
    \ 3G, and 4G cellular networks were built under the design premise of having complete\
    \ control at the infrastructure, 5G systems may drop this design assumption and\
    \ evolve the cell-centric architecture. \n\nThere is a significant overlap of\
    \ design objectives among 5G, IoT, and Tactile Internet—most notably ultra-reliable\
    \ and low-latency communication (URLLC)—which require a synergistic mix to guarantee\
    \ low latency and reliability. Today’s Internet is ushering in a new era. While\
    \ the first generation of digital revolution brought us the Internet of information,\
    \ the second generation—powered by blockchain technology—is bringing us the Internet\
    \ of value, a true peer-to-peer (P2P) platform.\n\nSome refer to decentralized\
    \ blockchain technology as the “alchemy of 21st century” because it may leverage\
    \ end-user equipment for converting computing into digital gold. More importantly,\
    \ according to Don and Alex Tapscott, blockchain technology enables trusted collaboration\
    \ that can share more fully in the wealth they create, rather than trying to solve\
    \ growing social inequality. As a result, blockchain technology helps create platforms\
    \ for distributed capitalism and a more inclusive economy.\n\nA blockchain technology\
    \ of particular interest is Ethereum, which went live in July 2015. Ethereum was\
    \ founded by Vitalik Buterin after his request for creating a wider and more general\
    \ scripting language for the development of decentralized applications (DApps)\
    \ that are not limited to cryptocurrencies, a capability that Bitcoin lacked and\
    \ was rejected by the Bitcoin community. Ethereum enables new forms of economic\
    \ organization and distributed models of companies, businesses, and ownership\
    \ (e.g., self-organized holarchies and member-owned cooperatives). Or as Buterin\
    \ puts it, while most technologies tend to automate workers on the periphery doing\
    \ menial tasks, Ethereum automates away the center. For instance, instead of putting\
    \ the taxi driver out of a job, Ethereum puts Uber out of a job and lets the taxi\
    \ drivers work with the customer directly (before Uber’s self-driving cars will\
    \ eventually wipe out their jobs). Hence, Ethereum does not aim at eliminating\
    \ jobs, so much as it changes the definition of work. In fact, it gave rise to\
    \ the first decentralized autonomous organization (DAO) built within the Ethereum\
    \ project. The DAO is an open-source, distributed software that exists “simultaneously\
    \ nowhere and everywhere,” thereby creating a paradigm shift that offers new opportunities\
    \ to democratize business and enables entrepreneurs of the future to design their\
    \ own virtual organizations customized to the optimal needs of their mission,\
    \ vision, and strategy to change the world.\n"
