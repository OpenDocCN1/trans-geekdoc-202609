    Note that in [Fig. 3.2](#chapter03.xhtml#f3_2), the average task completion time
    is on the order of seconds, ranging from 2.5 to 25 seconds depending on the computation
    offloading probability. Hence, given Ethereum’s transaction limit of 20 transactions/second,
    the notoriously low transaction rate of blockchain technologies doesn’t pose a
    significant challenge to the execution of computational tasks and especially physical
    tasks carried out by robots in the context of the Tactile Internet, given that
    the mining process anticipated to be performed by a local CPU of a robot will
    be offloaded to a nearby MEC server to increase both task completion and transaction
    confirmation times.


    ## CROWDSOURING


    Maier and Ebrahimzadeh \[[6](#chapter03.xhtml#r3_6)\] developed a self-aware allocation
    algorithm of physical tasks for HART-centric task coordination based on the shared
    use of user- and network-owned robots. By using our AI-enhanced MEC servers as
    autonomous agents, we showed that delayed force feedback samples coming from TORs
    may be locally generated and delivered to HOs in close proximity. More specifically,
    we developed an artificial neural network (ANN) based forecasting scheme of delayed
    (or lost) force feedback samples. By delivering the forecast samples to the HO
    rather than waiting for the delayed ones, we showed that AI-enhanced MEC servers
    enable HOs to perceive the remote physical task environment in real-time at a
    1-millisecond granularity and thus achieve tighter togetherness and improved safety
    control therein. Note, however, that the performance of the sample forecasting-based
    teleoperation system heavily relies on the accuracy of the forecast algorithm.


    In the following, we explore how crowdsourcing helps decrease the completion time
    of physical tasks in the event of unreliable forecasting of force feedback samples
    from TORs. Toward realizing DAO in a decentralized Tactile Internet, Ethereum
    may be used to establish HO-TOR sessions for remote physical task execution, whereby
    smart contracts help establish/maintain trusted HART membership and allow each
    HART member to have global knowledge about all participating HOs, TORs, and MEC
    servers that act as autonomous agents. We assume that an HO remotely executes
    a given physical task until `X%` of the most recently received haptic feedback
    samples are misforecast. At this point, the HO immediately stops the teleoperation
    and informs the agent. The agent assigns the interrupted task to a nearby human
    (e.g., an available HO) in the vicinity of the TOR, who then traverses to the
    task point and finalizes the physical task. The probability of misforecast for
    a given ESF implementation can be quantified by calculating the long-run average
    of the ratio of the number of samples that are subject to misforecast to the number
    of those that are predicted correctly. [Figure 3.3](#chapter03.xhtml#f3_3) depicts
    the average task completion time vs. probability of sample misforecast for different
    traverse time `T[traverse]` of the nearby human and different ratio of human and
    robot operational capabilities $\frac{\\, f\_{human}}{f\_{robot}}$, where `f[human]`
    and `f[robot]` denote the number of operations per second a human and robot is
    capable of performing, respectively. We can make several observations from [Fig.
    3.3](#chapter03.xhtml#f3_3). Obviously, it is beneficial to select humans with
    a shorter traverse time, who happen to be closer to the interrupted TOR. We also
    observe that the ratio $\frac{\\, f\_{human}}{f\_{robot}}$ has a significant impact
    on the average task completion time. Clearly, for a ratio of smaller than 1 (i.e.,
    1/3), human assistance is less useful since it takes him/her more time to complete
    the physical task. Conversely, for a ratio equal to 1 (i.e., 3/3) and especially
    larger than 1 (i.e., 5/3), crowdsourcing pays off by making use of the superior
    operational capabilities of the human. Whether humans or robots are better suited
    to perform a physical task certainly depends on its nature. However, for a given
    physical task, an interesting approach to benefit from the assistance of even
    uncredentialed and inexperienced crowd members of the DAO may be to enhance the
    capabilities of humans by means of *nudging*, as explained next.


    ![FIGURE 3.3 Average physical task completion time (in seconds) vs. probability
    of sample misforecast for different traverse time ttraverse ∈ {2, 5} seconds of
    nearby human and different ratio of human and robot operational capabilities \frac{\\,
    f\_{human}}{f\_{robot}} (for X = 80% fixed).](images/fig3_3.jpg)


    [FIGURE 3.3](#chapter03.xhtml#b03fig3_3) Average physical task completion time
    (in seconds) vs. probability of sample misforecast for different traverse time
    ttraverse ∈ {2, 5} seconds of nearby human and different ratio of human and robot
    operational capabilities $\frac{\\, f\_{human}}{f\_{robot}}$ (for X = 80% fixed).


    ## NUDGING: FROM JUDGE CONTRACT TO NUDGE CONTRACT


    ### Cognitive Assistance: From AI to Intelligence Amplification (IA)


    > A widely studied approach to increase the usefulness of crowdsourcing has been
    edge computing, which may be used to guide humans’ step-by-step through the physical
    task execution process by providing them with *cognitive assistance*. Technically
    this could be easily realized by equipping humans with an augmented reality (AR)
    headset (e.g., HoloLens 2 with WiFi connectivity) that receives work-order information
    in real-time from its nearest AI-enhanced MEC server. Maier and Ebrahimzadeh \[[6](#chapter03.xhtml#r3_6)\]
    elaborated on the importance of shifting the research focus from AI to intelligence
    amplification (IA) by using information technology to enhance human decisions.
    Note, however, that IA becomes difficult in dynamic task environments of increased
    uncertainty and real-world situations of great complexity.


    ### HITL Hybrid-Augmented Intelligence


    Many problems that humans face tend to be of high uncertainty, complexity, and
    open-ended. To solve such problems, human interaction and participation must be
    introduced, giving rise to the concept of *HITL hybrid-augmented intelligence*
    for advanced human-machine collaboration. HITL hybrid-augmented intelligence is
    defined as an intelligent model that requires human interaction and allows for
    addressing problems and requirements that may not be easily trained or classified
    by machine learning. In general, machine learning is inferior to the human brain
    in understanding unstructured real-world environments and processing incomplete
    information and complex spatiotemporal correlation tasks. Hence, machines cannot
    carry out all the tasks in human society on their own. Instead, AI and human intelligence
    are better viewed as highly complementary.


    The Internet provides an immense innovation space for HITL hybrid-augmented intelligence.
    Specifically, cloud robotics and AR are among the fastest-growing commercial applications
    for enhancing the intelligence of an individual in multi-robot collaborative systems.
    One of the main research topics of HITL hybrid-augmented intelligence is the development
    of methods that allow machines to learn from not only massive training samples
    but also human knowledge in order to accomplish highly intelligent tasks via shared
    intelligence among different robots and humans.


    ### Decentralized Self-Organizing Cooperative (DSOC)

