  raw: 'Recently, Maier et al. \[[13](#chapter01.xhtml#r1_13)\] introduced the *Internet
    of No Things* as an important stepping stone toward ushering in the sixth generation
    (6G) post-smartphone era, in which smartphones may not be needed anymore. We argued
    that while 5G was supposed to be about the Internet of Everything, to be transformative
    6G might be just about the opposite of Everything, that is, Nothing or, more technically,
    No Things. The Internet of No Things offers all kinds of human-intended services
    without owning or carrying any type of computing or storage devices. It envisions
    Internet services appearing from the surrounding environment when needed and disappearing
    when not needed. The transition from the current gadgets-based Internet to the
    Internet of No Things is divided into three phases: (*i*) bearables (e.g., smartphone),
    (*ii*) wearables (e.g., Google and Levi’s smart jacket), and then finally *(iii)*
    nearables. Nearables denote nearby computing/storage technologies and service
    provisioning mechanisms that are intelligent enough to learn and react according
    to user context and history in order to provide user-intended services.


    Joseph A. Paradiso \[[14](#chapter01.xhtml#r1_14)\] outlined his pioneering work
    on extrasensory perception (ESP) in an IoT context at MIT Media Lab. The authors
    showed that in a sensor-driven world, network-connected sensors embedded in anything
    function as extensions of the human nervous system and enable us to enter the
    long-predicted era of ubiquitous computing as envisioned by Mark Weiser more than
    a quarter of a century ago. In “The Computer for the 21st Century,” Mark Weiser
    argued that the most profound technologies are those that disappear. They weave
    themselves into the fabric of everyday life until they are indistinguishable from
    it \[[15](#chapter01.xhtml#r1_15)\]. This is now widely referred to as ubiquitous
    computing, though Mark Weiser called it *embodied virtuality* originally.


    [Figure 1.2](#chapter01.xhtml#f1_2) depicts the architecture of our proposed extrasensory
    perception network (ESPN), which integrates the following three evolutionary stages
    of mobile computing: (*i*) ubiquitous, (*ii*) pervasive, and (*iii*) persuasive
    computing. Ubiquitous computing is embedded in the things surrounding us (i.e.,
    nearables), while pervasive computing involves our bearables and wearables. Persuasive
    computing aims at changing the behavior of users through social influence. An
    interesting phenomenon for changing behavior in an online virtual environment
    is known as the “Proteus effect,” were the behavior of individuals is shaped by
    the characteristics and traits of their virtual avatars, especially through interaction
    during inter-avatar events. The underlying physical network infrastructure, which
    is illustrated in [Fig. 1.2](#chapter01.xhtml#f1_2), consists of a fiber backhaul
    shared by WLAN mesh portal points (MPPs) and cellular base stations (BSs) that
    are collocated with optical network units (ONUs), which in turn are connected
    to the central optical line terminal (OLT) of the fiber backhaul. Based on real-world
    haptic traces, we studied the use case of nonlocal teleoperation between a human
    operator (HO) and teleoperator robot (TOR), which are both physical (i.e., offline)
    entities ([Fig. 1.2](#chapter01.xhtml#f1_2)). Further, Maier and Ebrahimzadeh
    \[[16](#chapter01.xhtml#r1_16)\] showed that AI-enhanced MEC helps decouple haptic
    feedback from the impact of extensive propagation delays by forecasting delayed
    or lost haptic feedback samples. This enables humans to perceive remote task environments
    in real-time at a 1 ms granularity.


    ![FIGURE 1.2 Extrasensory perception network (ESPN) architecture integrating the
    three evolutionary stages of mobile computing: (i) ubiquitous, (ii) pervasive,
    and (iii) persuasive computing.](images/fig1_2.jpg)


    [FIGURE 1.2](#chapter01.xhtml#b01fig1_2) Extrasensory perception network (ESPN)
    architecture integrating the three evolutionary stages of mobile computing: (*i*)
    ubiquitous, (*ii*) pervasive, and (*iii*) persuasive computing.


    ### 6G Vision


    As 5G is entering the commercial deployment phase, research has started to focus
    on 6G mobile networks, which are anticipated to be deployed by 2030 \[[17](#chapter01.xhtml#r1_17)–[19](#chapter01.xhtml#r1_19)\].
    Typically, next-generation systems do not emerge from the vacuum, but follow the
    industrial and technological trends from previous generations. Potential research
    directions of 6G consistent with these trends were provided in \[[20](#chapter01.xhtml#r1_20)\],
    including among others:


    *   *6G will continue to move to higher frequencies with wider system bandwidth*:
    Given that the spectrum at lower frequencies has almost been depleted, the current
    trend is to obtain wider bandwidth at higher frequencies in order to increase
    the data rate more than 10 times.


    *   *Massive MIMO will remain a key technology for 6G*: Massive MIMO has been
    the defining technology for 5G that has enabled the antenna number to increase
    from 2 to 64. Given that the performance gains have saturated in the areas of
    channel coder and modulator, the hope of increasing spectral efficiency for 6G
    will remain in the multiple antenna area.


    *   *6G will take the cloud service to the next level*: With the ever-higher data
    rates, short delays, and low transmission costs, many of the computational and
    storage functions have been moved from the smartphone to the cloud. As a result,
    most of the computational power of the smartphone can focus on presentation rendering,
    making VR, AR, or extended reality (XR) more impressive and affordable. Many AI
    services that are intrinsically cloud-based may prevail more easily and broadly.
    In addition to smartphones, less expensive functional terminals may once again
    flourish, providing growth opportunities in more application areas.


    *   *Grant-free transmissions could be more prominent in 6G*: In past cellular
    network generations, transmissions were primarily based on a grant-oriented design
    with strong centralized system control. More advanced grant-free protocols and
    approaches will be needed for 6G. It is possible that the non-orthogonal multiple
    access (NOMA) technology may have another opportunity to prevail due to its short
    delay performance even though it failed to take off during the 5G time period.


    *   *mMTC is more likely to take shape in the older generation before it can succeed
    in the next generation*: mMTC has been one of the major directions for the next-generation
    system design since the market growth of communications between people has saturated.
    High expectations have been put on 5G mMTC to deliver significant growth for the
    cellular industry. Until now, however, this expectation has been mismatched with
    the reality on the ground. Therefore, the current trend appears to indicate that
    mMTC would be more likely to prevail by utilizing older technology that operates
    in a lower band.


    *   *6G will transform a transmission network into a computing network*: One of
    the possible trademarks of 6G could be the harmonious operations of transmission,
    computing, AI, machine learning, and big data analytics such that 6G is expected
    to detect the users’ transmission intent autonomously and automatically provide
    personalized services based on a user’s intent and desire.'
