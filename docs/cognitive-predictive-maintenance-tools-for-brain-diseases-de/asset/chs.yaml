  \n# 6 认知疾病预测器的探索与应用（如帕金森病和癫痫）\n\nB. V. Srividya and Sasi Smitha\n\nDayanand Sagar\
  \ College of Engineering, Bengaluru, India\n\nMeenakshi Bannerjee\n\nO.P. Jindal\
  \ Global University, Sonepat, Haryana, India\n\nDOI: `10.1201/9781003245346-6`\n\
  \n## 6.1 认知障碍\n\n认知障碍通常起病缓慢，但随着病情推移，最终会严重降低患者的生活质量。了解多种类型的认知疾病、其征兆和症状以及可选的治疗方法至关重要\
  \ [1]。\n\n神经认知疾病包括认知障碍。任何严重阻碍人清晰思考的能力，以至于其在没有治疗的情况下无法在社会中正常发挥功能的情况，都被称为认知疾病。广泛的认知疾病包括：\n\
  \n1. 发育性疾病；\n2. 痴呆；\n3. 运动技能功能障碍；\n4. 失忆症；\n5. 物质滥用导致的认知障碍。\n\n与大多数精神疾病类似，多种因素可能导致认知障碍。另一些因素是由遗传倾向引起的，而还有一些是由子宫内荷尔蒙水平失衡引起的。认知问题的常见环境原因包括在认知发育的关键时期（特别是婴儿期）营养不足和缺乏互动\
  \ [2]。\n\n物质滥用和身体伤害是导致认知障碍的另外两个显著原因。当控制认知功能的大脑区域受损时，会发生神经生理变化，无论是由于过度使用药物或酒精、物理创伤，还是这两者的结合，都可能导致认知功能不全\
  \ [3]。\n\n需要使用各种认知预测维护工具来早期检测多种认知疾病，例如阿尔茨海默病、双情感障碍、癫痫、帕金森病和抑郁症 [4]。这些工具在今天至关重要，因为目前还没有可靠的医学检测能够在早期阶段发现这些疾病。\n\
  \n根据 [5]，已经创建了两种电子健康平台用于疾病的实时识别和/诊断：可穿戴设备（`WDs`）和/或人体传感器网络（`BSNs`）。`WDs` 通常用于收集数据、测量生物变量或用户输入，本地处理通过移动云计算（`MCC`）或云计算（`CC`）服务完成。模型学习、计算密集型活动以及从传感器采集数据通常由\
  \ `CC` 服务处理，该服务还提供一个演示层，其中包括面向患者或医疗专业人员的用户警报、通知家属，甚至为后续调查提供视觉化方案和数据分析 [5]。\n\n未来的技术，如工业物联网、人工智能、机器学习、数据科学、大数据和不同的通信协议，可以被研究和开发用于各种认知疾病的早期检测，这对社会是有益的。将使用未来技术设计的设备与目前可用的认知疾病技术或设备进行比较也将大益。\n\
  \n本章重点关注用于早期检测多种认知疾病（如癫痫或帕金森病）的各种认知预测维护工具的设计、分析和使用。\n\n## 6.2 癫痫\n\n发作监测对于管理癫痫和评估治疗结果至关重要。目前，临床发作监测可能会漏掉发作，因此可能需要长期外围监测。在这工作中，使用可穿戴生物传感器来评估专门为检测发作创建的机器学习（`ML`）算法在各种癫痫发作期间的性能\
  \ [6]。\n\n癫痫被称为异常的大脑活动，这种活动可能导致发作或出现怪异行为、感觉以及偶尔意识丧失。有几种可能的发作症状。一些癫痫患者在发作期间只是呆神地发呆一会，而另一些人会反复抽动肢体或腿部。\n\
  \n由于癫痫是由异常的大脑活动引起的，发作会破坏大脑控制的任何过程。发作的征兆和症状包括：\n\n1. 瞬间的混乱；\n2. 发呆的动作；\n3. 肌肉僵硬；\n\
  4. 不自主的肢体抽动；\n5. 发生感知或意识丧失；\n6. 恐惧和焦虑等心理症状。\n\n症状随发作的类型而变化。症状在每次发作之间通常会是一致的，因为癫痫患者倾向于每次都发生相同类型的发作。\n\
  \n根据异常大脑活动开始的方式和位置，发作通常被分为两类 [7]：\n\n1. 局灶性发作；\n2. 全直性发作。\n\n## 6.3 局灶性发作\n\n当发作似乎是由大脑某一个区域的异常活动引起时，被称为局灶性发作。这些发作有两种类型：\n\
  \n1. *无丧失意识的单区域发作*：这些发作以前被称为单纯部分发作，不会导致意识丧失。它们可能会改变感觉或影响物体看起来、感觉起来、听起来或闻起来的样子。除了身体部位（如手臂或腿）的不自主抽动外，某些发作还会导致自发的感觉症状，如刺痛、眩晕和闪光。\n\
  \n2. *伴有意识变化的局灶性发作*：这些发作以前被称为复杂部分发作，包括意识或感的改变或丧失。这种发作可能会让你感觉像在做梦。经历意识减弱局灶性发作的人可能会直视太空，对周围环境没有正常反应，或者进行重复性动作，如绕圈行走或搓手。\n\
  \n局灶性发作在症状上可能模拟其他神经系统疾病，如偏头痛、嗜睡或精神疾病。为了区分癫痫与其他疾病，需要进行全面的评估和测试。\n\n## 6.4 全性发作\n\n\
  全面发作被定义为似乎影响大脑所有部分的发作，可以以六种形式出现：\n\n\n\n\n\n1. **失神发作（Seizures when absent）**。儿童通常会经历失神发作，也称为`小发作`。这种发作通常持续五到十秒，特征是发呆，并可能伴随或没有轻微物理动作，如咂嘴或眨眼。在这些集群性发作期间，可能会出现短暂的意识丧，每天可能发生\
  \ 100 次。\n\n2. **强直性发作（Tonic seizure）**。强直性发作会导致肌肉紧张并可能影响意识。患者的背部、手臂和腿可能因这些发作而变弱，导致失去平衡。\n\
  \n3. **失力性发作（Atonic seizures）**。也称为落下发作，与肌肉协调能力丧失有关。由于腿受影响，患者通常会倒地或跪地。\n\n4. **阵挛性发作（Clonic\
  \ seizures）**。肌肉抽搐、重复或节律运动是阵挛发作的征象。这些发作通常涉及面部、手臂和颈部。\n\n5. **肌抽挛性发作（Myoclonic seizures）**。上躯干、手臂和腿部通常受肌抽挛发作的影响，其通常表现为快速、短暂的抽搐或震颤。\n\
  \n6. **强直阵挛性发作（Tonic-clonic seizures）**。这些通常被称为`大发作`，是最严重的癫痫性发作类型。它们还可能导致身体抽搐、震动或摇抖，以及意识突然丧。偶尔可能导致咬舌或尿尿失禁。\n\
  \n需要进行全面的评估和测试来早期预测发作。为了对癫痫进行早期诊断，收治癫痫监测单元的注册患者需要在其手腕或脚踝上佩戴可穿戴传感器。传感器会测量体温、血脉搏、皮电活动、光电容积波（`BVP`）和加速度（`ACC`）。这些结果随后将由执证的癫痫学家确认，作为脑电图（`EEG`）发作开始和结束的基准比较。\n\
  \n建议使用可穿戴传感器作为自动评估癫痫和帕金森病等认知疾病体象的方法，以克服这些限制。\n\n本章的主要课题是各种认知预测性维护工具的设计、分析和应用，用于早期识别和预后帕金森病和癫痫等多种认知障碍。\n\
  \n## 6.5 用于癫痫筛查和管理的物联网基础设施\n\n心率变异性（`HRV`）与发作密切相关并显示出自主神经系统干扰，可以提供用于识别发作的实用临床数据。需要一个能够提供清晰数据、易于使用并能够早期干预的检测系统，为患者提供避免发作及其副作用的机会。\n\
  \n这项研究探索了普遍性强直阵挛性发作和常见的失神发作，这是两种不同且常见的癫痫危机类型。在这两种情况下，带有三轴加速度计（`ACM`）和/或心率（`HR`）[8,\
  \ 9]传感器的腕设备（`WDs`）可以有效检测发作。\n\n需要检查系统的工程学特征，因为每个患者都要承受包括`EEGs`、心电图（`ECGs`）以及`ACMs`和体温传感器在内的变量。\n\
  \n### 6.5.1 脑电图（EEGs）\n\n这是一种分析和记录骨骼肌产生的电活动的方法。一种名为`EEG`的无侵入脑成像技术[11]使用头皮电极监测由神经剧烈电活动引起的电压波动。\n\
  \n### 6.5.2 肌电图（EMG）\n\n当肌肉处于静止状态且不显示可记录的电位时，使用`EMG`[11]创建肌电图。当肌细胞在电学或神经上处于活跃状态时，`EMG`会检测到这些细胞产生的电位。随着收缩力的增加，电位的振幅也随之增加。\n\
  \n### 6.5.3 心电图（ECGs）\n\n在患有颞叶节癫痫（`TLE`）的个体中，心电图[12]提供了自动检测发作的额外益处，尽管将有线的医院系统作为家庭中的长期发作检测系统是不恰当的。\n\
  \n### 6.5.4 三轴加速度计（ACM）\n\n一种名为`ACM`[13]的仪器监测三个维度上的重力（或加速度）。这意味着将根据参考坐标系识别运动及其方向。\n\
  \n然而，如果没有陀螺仪，无法明确知道传感器的取向，即使通过计算重力加速度矢量对静态传感器来说这种估算是简单的。\n\n发作预测模型必须能够泛化到新的和之前未探索的`ACM`数据，并能够从关于发作的`ACM`数据中学习。模型必须能够快速识别正在发生或即将开始的发作。在这种情况下，模型应该能够忽略`WD`的取向。\n\
  \n### 6.5.5 体温传感器\n\n年龄在六个月到五岁之间的儿童在当体温高于 38 °C (100.4 °F)时会经历热性发作。12 到 18 个月的儿童最常受到这些发作的影响。儿童并不因为发生热性发作就一定患有癫痫；癫痫的特征是两次或多次不涉及发热的发作。\n\
  \n`[14]`调查发现，74%的普遍性强直阵挛性发作患者表现出相同的症状和行为。这些包括意识丧失（会导致身体倒地并被加速度传感器检测到）、肌肉痉挛（可以被`EMG`传感器拦截）以及心率升高（可以被`ECG`传感器检测到）。\n\
  \n如图 6.1](#ch6.xhtml#fig6_1 所示，来自各种传感器的数据被定期收集并处理，以预测任何发作的可能性。收集的数据存储在云服务器中，并用于分析触发发作的事件。发作的可能性会提前通知看护者，以便提供急性治疗。\n\
  \n\n\n\n\n神经科学研究利用脑电图（EEG）信号预测癫痫发作。使用带有 10–20 个电极的国际标准设备采集 EEG 信号。在本研究中，从免费在线数据获取了不同年龄组健康人和患者的健康记录（图\
  \ 6.4）。\n\n![图 6.4 工作流。](img/fig6_4_B.jpg)\n\n图 6.4 工作流。\n\n这项工作模型实现了滤波和信号预处理的组合操作。网络模型使用这些滤波后的数据进行训练，然后用于生成估计值\
  \ [15]]。\n\n### 6.6.1 滤波\n\n根据调查结果，滤波分为三个阶段：拉普拉斯滤波、空间滤波和平均滤波。使用拉普拉斯滤波器（一种边缘检测器）计算图像的二阶导数，即一阶导数的变化率。这确定了相邻像素值的变化是由边缘还是连续渐变引起的。\n\
  \n通过“空间滤波”过程，可以移除构成项目的特定空间频率，从而改变光学图像的质量。为了“平滑”照片，平均（或均值）滤波减少了相邻像素之间的强度波动。平均滤波器通过逐像素遍历图像，并将每个值替换为其自身及其相邻像素的平均值来工作。\n\
  \n### 6.6.2 变换\n\n图像经验模态分解（IEMD）是将希尔伯特-黄变换（HHT）的经验模态分解概念扩展到二维，用于图像处理。凭借其局部分离叠加空间频率的独特能力，IEMD\
  \ 为图像处理提供了一种工具。\n\n经验模态分解（EMD），通常称为本征函数模式，是一种将信号分解为各种简单振荡模式（固有模态函数 - IMF）的技术。因此，信号\
  \ `x`(*t*)`可以用残差和这些 IMF 组件之和来表示：\n\n$$x\\left( t \\right) = \\sum\\limits_{m = 1}^{M}D_{m}\\\
  left( t \\right) + r_{M}\\left( t \\right)$$\n\n其中 `r`*M*` 是残差，`M` 是 IMF 的总数。信号的\
  \ IMF 必须满足两个前提条件。首先，极值总数与过零点之间的差异最多为一。此外，由局部极大值和局部最小值定义的包络线在所有位置的平均值为零或极接近零。EMD\
  \ 算法的步骤如下：\n\n1. 从信号 `x`(*t*)` 中提取局部极大值和局部最小值\n2. 连接所有最小值和极大值以得到两个包络，`e_min`(*t*)`\
  \ 和 `e_max`(*t*)\n3. 计算它们之间的平均值，得到 $m\\left( t \\right) = \\frac{\\left\\lbrack\
  \ e\\min\\left( t \\right) + e\\max\\left( t \\right) \\right\\rbrack}{2}$\n4. 从\
  \ `x`(*t*)` 中提取细节得到 `d`(*t*) = `x`(*t*) − `m`(*t*)\n5. 验证上述 IMF 的要求以确定 `d`(*t*)`\
  \ 是否为 IMF\n6. 重复上述残差 `d`(*t*)` 操作\n\n在获得信号的初步 IMF `D1`(*t*)` 后，为了获得连续的 IMF，生成残差\
  \ `r`(*t*) = `x`(*t*) − `D1`(*t*)。从步骤 (1) 到步骤 (6) 描述的过程需要继续，直到无法从最终残差中获取 IMF 为止。\n\
  \nHHT 使用 EMD 进行信号分解，与傅里叶变换和小波变换本质不同，因为它不使用预定义的基函数，也不利用基函数与信号本身的符合性来提取成分。\n\n信号处理中的每个组件都有自己的\
  \ HHT，用于分解本征模态函数：\n\n$$\\mathit{yi}\\left( t \\right) = \\frac{1}{\\Pi}\\int\\limits_{-\
  \ \\infty}^{\\infty}\\frac{D_{m}j\\left( \\tau \\right)}{t - \\tau}\\mathit{d\\\
  tau}$$\n\n通过希尔伯特变换，解析信号定义为：\n\n`z`(*t*) = `x`(*t*) + `i`**`y`(*t*) = `a`(*t*)e^(`i`**`theta`(*t*)))\n\
  \n其中\n\n$$a\\left( t \\right) = \\sqrt{x^{2} + y^{2}}$$\n\n以及\n\n`theta`(*t*) =\
  \ arctan(`y`/*`x`*)\n\n在对每个组件执行希尔伯特变换后，原始数据可以表示如下形式的实部：\n\n$$x\\left( t \\right)\
  \ = \\Re\\left\\{ \\sum\\limits_{i = 1}^{n}a_{\\begin{array}{l} j \\\\\\\\ \\\\\\\
  \\ \\end{array}}\\left( t \\right)\\exp\\left\\lbrack i\\int w_{j}\\left( t \\right)\\\
  mathit{dt} \\right\\rbrack \\right\\}$$\n\n$$x\\left( t \\right) = \\Re\\left\\\
  { \\sum\\limits_{i = 1}^{n}a_{\\begin{array}{l} j \\\\\\\\ \\\\\\\\ \\end{array}}\\\
  left( t \\right)\\exp\\left\\lbrack i\\int w_{j}\\left( t \\right)\\mathit{dt} \\\
  right\\rbrack \\right\\}$$\n\n使用希尔伯特变换，解析信号定义为：\n\n`z`(*t*) = `x`(*t*) + `i`**`y`(*t*)\
  \ = `a`(*t*)e^(`i`**`theta`(*t*)))\n\n其中\n\n$$a\\left( t \\right) = \\sqrt{x^{2}\
  \ + y^{2}}$$\n\n以及\n\n`theta`(*t*) = arctan(`y`/*`x`*)\n\n在对每个组件执行希尔伯特变换后，原始数据可以表示为如下形式的实部：\n\
  \n$$x\\left( t \\right) = \\Re\\left\\{ \\sum\\limits_{i = 1}^{n}a_{\\begin{array}{l}\
  \ j \\\\\\\\ \\\\\\\\ \\end{array}}\\left( t \\right)\\exp\\left\\lbrack i\\int\
  \ w_{j}\\left( t \\right)\\mathit{dt} \\right\\rbrack \\right\\}$$\n\n$$x\\left(\
  \ t \\right) = \\Re\\left\\{ \\sum\\limits_{i = 1}^{n}a_{\\begin{array}{l} j \\\\\
  \\\\ \\\\\\\\ \\end{array}}\\left( t \\right)\\exp\\left\\lbrack i\\int w_{j}\\\
  left( t \\right)\\mathit{dt} \\right\\rbrack \\right\\}$$\n\n使用希尔伯特变换，解析信号定义为：\n\
  \n`z`(*t*) = `x`(*t*) + `i`**`y`(*t*) = `a`(*t*)e^(`i`**`theta`(*t*)))\n\n其中\n\n\
  $$a\\left( t \\right) = \\sqrt{x^{2} + y^{2}}$$\n\n以及\n\n`theta`(*t*) = arctan(`y`/*`x`*)\n\
  \n在对每个组件执行希尔伯特变换后，原始数据可以表示为如下形式的实部：\n\n$$x\\left( t \\right) = \\Re\\left\\{ \\\
  sum\\limits_{i = 1}^{n}a_{\\begin{array}{l} j \\\\\\\\ \\\\\\\\ \\end{array}}\\\
