  \ 619–627.\n\n# 4 神经系统疾病中生物医学信号的表征\n\nPriya Dev 和 Abhishek Pathak\n\n印度瓦拉纳西，瓦拉纳西希印度大学\n\
  \nDOI: [10.1201/9781003245346-4](https://dx.doi.org/10.1201/9781003245346-4)\n\n\
  ## 4.1 引言\n\n疾病在医学上定义为影响人体全身（包括脊髓）大脑和神经系统的神经系统疾病。大脑、脊髓、外周神经、自主神经系统和肌肉都参与其中。神经系统疾病可以是遗传性的或后天的，损伤程度取决于障碍范围，如瘫痪或癫痫。根据\
  \ Singh 等 2021，印度非传染性神经系统疾病的负担正在增加。\n\n生物医学信号有助于观察生理活动，范围涵盖从基因序列、蛋白质到心心律和图像。影像分析是诊断任何疾病的基本手段。计算机辅助诊断(`CADx`)或计算机辅助检测(`CADe`)系统协助临床医生做出快速判断并诊断脑部疾病，如癫痫、退行性疾病、自闭症、睡眠障碍、偏头痛和脑肿瘤。脑电图(`EEG`)是一种跨颅记录脑细胞活动的技术，用于确定功能状态，帮助医生诊断神经损伤、血栓和中风。目前对通过\
  \ CAD 系统识别人类专家可能会忽略的异常象的需求日益增长。\n\n## 4.2 用于神经系统疾病诊断的各种类型生物医学信号\n\n### 4.2.1 心电图\
  \ (`ECG`)\n\n心电图是评估心脏工作情况最简单、最快速的方法。通过放置在胸部、手臂和腿部特定位置的电极测量心脏电活动，然后将其连接到 `ECG` 机器并立即打印结果。`ECG`\
  \ 记录心脏的自然节律，以及电冲在通过心室传输时的强度和时间。`ECG` 报告的变化可能是心脏问题的迹象。在 `ECG` 信号中，一个心周期由 `PQRST`\
  \ 波组成。`ECG` 特征的自动分析至关重要，特别是对于检查长期记录 (Mahmoodabadi 等 2005)。\n\n\n\n\n心肌规律性的去极化和再极化与心房和心室收缩有关，这些收缩由\
  \ `P`、`QRS` 和 `T` 波的表现决定。`P` 波代表心脏上腔的两次心房激活，而 `QRS` 复合波和 `T` 波代表下腔的心室兴奋。在自动心电图分析中，`QRS`\
  \ 检测是主要问题。如果成功，随后会对心电图信号进行彻底检查。在心电图图中，`P` 波的水平波谷称为基线或等电位。随后是 `P` 波，代表心肌肌肉的去极化。`QRS`\
  \ 复合波随其后，代表几乎同时发生的联合再极化和心室去极化。随后是 `T` 波，代表心室再极化，而 `U` 波如果存在，通常被认为是心肌后电位的结果。正常心率在每分钟\
  \ 60 到 100 次之间，但异常情况包括心率过慢（心动缓）、心率过快（心速），而异常的心电图信号代表心律失常（Saritha et al. 2008, Ranjan\
  \ and Giri 2012）。\n\n在过去的十年里，已经开发了多种自动心电图信号提取和分析的研究和算法。提出并评估了不同的分类方法，许多先进技术显示了它们的优缺点，例如数字信号分析、人工神经网络、模糊逻辑方法、贝叶斯算法、遗传、隐马尔可夫模型、自组织映射和支持向量机，用于准确快速地提取心电图特征。有多种系统用于分类和分析心电图信号。\n\
  \n### 4.2.1.1 帕金森病 (PD)\n\nPD 是一种随时间进展的致残性神经系统疾病，通常在临床表现出现时，黑质神经元丢失超过 50%，纹状体多巴胺水平降低\
  \ 80%（Fearnley and Lees 1991, Ross et al. 2012）。在特征性运动症状出现几年甚至几十年之前，疾病过程可能处于活跃状态。为了开发和实施可能推迟疾病进展的药物，需要检测早期前驱症状的诊断方法。自主神经病变和早期心脏交感神经切断是帕金森病的非运动症状之一，该病被认为具有非运动症状，是一种涉及广泛解剖结构的系统性疾病。先进的心电图分析可提取更多信息，并识别\
  \ PD 高风险的人群。研究表明，传统的十秒心电图可以作为通用、非侵入且负担的前驱 PD 生标志物。一项研究探索了 PD 患者临床特征与心电图参数之间的关系。在\
  \ PD 患者中，发现 `BMI` 与 `PR` 和 `QRS` 间期正相关。`QRS` 间期与病程和 Hoehn and Yahr 分有关，而 `QT` 间期和\
  \ `QTc` 与年龄有关。临床特征和心电图值可能紧密相关。几种心电图特征可以指示自主功能障碍或疾病进展。在 PD 患者的治疗中，医生应更多关注心电图参数。这项研究提供了三个主要发现：首先，发现\
  \ `BMI` 与 `PR` 和 `QRS` 间期有良好关系；其次，`QRS` 间期与病程长度和 `HY` 期有关；第三，发现 `QTc` 与年龄有良好关系（Akbilgic\
  \ et al. 2020, Mochizuki et al. 2017）。\n\n### 4.2.1.2 肌萎缩侧索硬化症 (ALS)\n\nALS 是一种以第一、第二运动神经元变性为特征的致命神经系统疾病。最近的研究揭示了表型、临床基础和遗传感性的变异，这意味着\
  \ ALS 应被视为一种综合而非单一疾病。因此，ALS 的临床表现和发展可能大异。尽管认知和行为变化在 ALS 中很常见，但其他非运动临床方面如自主神经系统 (`ANS`)\
  \ 往往被忽视（Hardiman et al. 2011, Kiernan et al. 2011）。`ANS` 作为复杂变性过程的一部分对 ALS 的影响日益受到关注，假设\
  \ ALS 患者会获得自主神经功能障碍，其中包括心脏受累。\n\n各种中枢神经系统问题如 `ST` 段抬高、`T` 波倒置和 `QT` 间期延长已知产生模拟冠心综合征的心电图异常。与蛛网膜下或硬膜下出血相关的这些发现已有记录。通常认为\
  \ ALS 对心血管系统有负面影响。在 ALS 患者中，已证明亚临床交感神经亢进和副交感神经功能低下会导致心血管疾病（Pavlovic et al. 2010,\
  \ Asai et al. 2007, Shimizu et al. 1994）。只有少数文献描述了与此状况相关的心电图特征。ALS 中描述过假缺血模式，尽管也描述过假心肌梗死模式（Li\
  \ et al. 2000, Zhang et al. 2012）。此外，在没有基础缺血性心脏病的 ALS 患者中，由于呼吸衰竭或导致 ALS 的免疫介导性心肌损伤，记录到肌钙蛋白\
  \ T 水平升高（Von Lueder et al. 2011）。\n\n在评估校正 QT 间期 (`QTc`) 和 `QTc` 离度的研究中，心电图显示 ALS\
  \ 患者经心率校正后的平均 `QT` 明显更大，支持运动神经元疾病中的交感紊乱（Asai et al. 2007）。离子通道故障已与心脏有关，因此 ALS 患者的心电图变化可能是由于离子通道功能异常引起的（Chockalingam\
  \ and Wilde 2012）。心电图显示 ALS 患者胸胸导联出现负性 `T` 波，模拟了心肌缺血。互补研究排除了系统性和心脏性引起的心电图异常，暗示了假缺血心电图与\
  \ ALS 之间的联系。虽然已怀疑自主神经功能障碍，但这种心电图异常背后的机制尚待研究。\n\n\n\n其他研究发现心电图（ECG）异常是导致肌萎侧索硬化症（ALS）患者主要交感神经自主调节功能障碍的原因\
  \ (Pavlovic et al. 2010, Bella et al. 2015)）。在脑部交互反应（TAR）DNA 结合蛋白-43 (`pTDP-43`）疾病及相关神经元丢失的研究中，杏仁核和下丘脑被认为是主要的交感结构\
  \ (Brettschneider et al. 2013, Cykowski et al. 2014)）。鉴于交感神经亢进与猝死和应激诱导的心肌病有关，这一观点可以解释为什么在呼吸衰竭后，猝发心脏停动是\
  \ ALS 死亡原因之一。因此，心脏磁共振成像（CMR）在检测 ALS 心脏受累方面似乎比血检中的心脏参数更为敏感。\n\n### 4.2.2 脑电图 (EEG)\n\
  \n脑电图是一种读取大脑电位的技术，使用一种名为脑电图（EEG）的特殊设备进行测量。该设备包含电极、导电凝胶、放大器和模数转换器。电极或导线从大脑头皮开始传导电活动。EEG\
  \ 分析通常使用不同类型的电极。可重复的圆片是电极的一种。在圆片下涂少量导电凝胶 (`AgCl`)，将这些电极放置在头皮上 (Tallgren et al. 2005)。圆片由金、锡和银组成。电极的成本较低，使用寿命可能取决于圆片使用的金属和电线背部的绝缘层。这些电极可能会从头皮脱落，增加伪迹的可能性\
  \ (Taheri et al. 1994)。还有带有可重复圆片的脑电图帽，可以将导电凝胶注入帽的孔中。虽然优于多通道记录，但这种帽子帽的一个复杂问题是，如果一个电极失效，就必须更换整个帽子，这非常困难\
  \ (Stevens et al. 2007)。\n\n#### 4.2.2.1 EEG 信号分析及其阶段\n\n原始 EEG 信号在采集阶段直接从大脑头皮获取。第二阶段是预处理步骤，包括伪迹去除\
  \ (Ames 1971) 和数据滤波 (Basar 1998)。在信号捕获和分析中，检测并消除伪迹是一项艰巨的任务。多个变量可能导致伪迹，包括信号捕捉过程中的头部运动、电极/通道/探头的物理缺陷以及头电设备连接问题。这些伪迹还会产生形状异常的频率信号。分析的特征提取阶段使用傅里叶变换（一种信号处理技术）、小波、主成分分析和提取的显著特征（异常/正常）来划分信号特征\
  \ (Tong and Thankor 2009)。傅里叶变换将数据划分为四个频段——delta 波 (`4 Hz`)、theta 波 (`48 Hz`)、alpha\
  \ 波 (`813 Hz`) 和 beta 波 (`1330 Hz`)——它是应用最广泛的自动化方法 (Fonseca et al. 2006)。对于噪声较大的\
  \ EEG 信号，不建议使用快速傅里叶变换 (`FFT`) 方法。为了减少频谱损失并提高频率分辨率，应用了自回归 (`AR`) 等参数化谱估计方法。对于非平稳信号（如\
  \ EEG 信号 (Jasper 1958)），参数化技术无效。另一个重要阶段是分类，利用提取的特征获取目标观测值 (Kaneko et al. 1996)。在时域分析中，函数的提取和分类是两个核心问题。\n\
  \n### 4.2.2.2 信号及其特征\n\n头皮电极的频率、振幅、形状和位置均用于分类 EEG 波形。用于确定正常或异常节律的主要单位是频率。信号的频率决定了波形的经典分类，如\
  \ alpha、beta、theta、delta。某些波形的形状、头部分布和对称性特征可以识别 (Salmelin and Hari 1994)。在特定的年龄、注意力状态和睡眠下，某些波形模式是自然的。不同的脑波频率相关联\
  \ (Birbaumer et al. 1990, Kaufman 2001, Fell et al. 2010)。头皮电极的频率、振幅、形状和位置均用于分类\
  \ EEG 波形。确定正常或异常节律的主要单位是频率 (`Hz`)。\n\n### 4.2.2.3 EEG 在神经系统诊断中的作用\n\n### 4.2.2.3.1\
  \ 帕金森病\n\n使用反传播网络 (`BPNN`) 可以以 75% 的准确率、特异性和敏感性识别 PD 冻结的开始。原始形式的 EEG 数据（受者特征曲线下面积\
  \ `AROC` = `0.59–0.86`）被证明比干净的 EEG 数据 (`0.57–0.72`) 更具健壮性。原始 EEG 肌肉伪迹以及非线性提取和排序用于\
  \ PD 的生物标志物。使用 `BPNN` 分析 EEG 的功率谱密度 (`PSD`) 和中心频率 (`CF`) 分别提供了 27% 的性能和 80% 的敏感性。这种结合表面\
  \ EEG 记录的光谱、空间和时间特征的新方法可能是预测 PD 患者步行冻结的有效方法，并在考虑更优分类器时，为未来研究留了空间 (Kumar and Bhuvaneswari\
  \ 2012)。\n\n##### 4.2.2.3.2 阿尔海默病 (AD)\n\n为了诊断健康对照者的 AD，应记录并分析脑信号。以下文献综述概述了利用 EEG\
  \ 波诊断 AD 的各种方法和分类器。AD 患者的 EEG 信号比健康对照不复杂。对信号的谱重心 (`SC`)、零交叉率 (`ZCR`)、谱衰减 (`SR`)、谱熵\
  \ (`SE`) 和 Higuchi 分形维度 (`HFD`) 等特征进行了评估。在 AD 患者中，这些特征较简单且低级，但在额叶和颞叶中包含重要信息。研究了定量脑电图\
  \ (`QEEG`) 的相性和频率分析，以提高 AD 诊断的准确性。根据研究，AD 患者 delta 和 theta 波的绝对功率值会增加 (Kumar and\
  \ Bhuvaneswari 2012)。\n\n### 4.2.2.3.3 癫痫\n\n\n\n\n\n# 癫痫是最常见的脑疾病之一，影响着全球 6500 万个人(Thurman\
  \ et al. 2011)）。脑电图是最有效的癫痫诊断工具（(Noachtar and Rémi 2009)）。目前已有 4444 项旨在开发癫痫计算机辅助诊断（CAD）的研究。为了构建一种基于脑电图的癫痫\
  \ CAD，一项研究建议采用多阶段非线性预处理滤波器结合人工神经网络（ANN）(Nigam and Graupe 2004)）。所提技术的准确率达到了 97.2%。其他研究比较了各种熵算法，并假设可以使用熵值来区分神经常型和癫痫脑电图(Kannathal\
  \ et al. 2005)）。在分类方面，他们使用了自适应神经模糊推理方法，其准确率为 92.2%。随后，又使用了自适应模糊神经网络进行癫痫诊断(Sadati\
  \ et al. 2006)。利用离散小波变换（DWT）的子带能量提取函数。而他们提出的方法准确率为 85.9%。Ocak (2009)提出了一种使用 DWT\
  \ 的特征提取方法，该方法通过估计香农熵，在应用 DWT 时准确率超过 96%，在不使用时准确率为 73%。Subasi and Gursoy (2010)研究了多种将脑电图数据与独立成分分析（ICA）、线性判别分析（LDA）和主成分分析（PCA）相结合的策略，以减少脑电图数据的维度。Subasi\
  \ (2007)采用小波变换进行特征提取并结合专家模型进行分类。所提方法的整体准确率为 94.5%。Chen (2014)最近引入了一种复杂的特征提取方法，使用双树小波变换，通过最近邻分类获得了完美的分类准确率（100%）。\n\
  \n## 4.2.2.3.4 自症谱系障碍 (ASD)\n\n研究人员正专注于增强用于 ASD 的基于脑电图 CAD 技术(Patel et al. 2014)。在早期的几项研究中，已使用\
  \ CAD 工具对 ASD 进行了诊断。Sheikhani 等人报告的研究(2008)利用短时傅里叶变换（STFT）提取脑电信号的特性；并采用 k 最近邻（KNN）作为分类器。这种方法的整体准确率高达\
  \ 82.4%。研究人员在随后的出版物中使用更多测试数据开发了所提策略(Sheikhani et al. 2012)，实现了 96.4%的准确率。Ahmadlou\
  \ 等人 (2010)将分形维度（FD）描述为一种量化自闭症患者大脑动态变化和复杂性的方法。\n\n该分类器基于径基函数。据报道，该程序的准确率高达 90%。作者在另一项研究中使用了可见性图（VG）技术进行\
  \ ASD 诊断(Ahmadlou et al. 2012b)，并使用了模糊同步似然（Fuzzy SL）和改进的神经网络分类(Ahmadlou et al. 2012a)。两种提出的方法的准确率均为\
  \ 95.5%。为了分类神经常型和自闭症个体的信号，Bosl 等人 (2011)采用了最小均方误差特征多类 KNN、脑电信号向量、支持向量机（SVM）和朴素贝叶斯作为分类方法。九个月以下婴儿的分类准确率高于\
  \ 80%，九个月以下男性接近 100%，12 至 18 个月儿童的准确率在 70%到 90%之间。\n\n### 4.2.3 肌电图 (EMG)\n\n对肌肉产生的电脉冲的研究被称为\
  \ EMG。“肌电活动”一词被用于描述 EMG。肌肉组织携带电位的方式与神经相同，这些电信息被称为肌动作电位。在检测和记录 EMG 信号时，影响其保真度的有两个问题；即\
  \ EMG 能量除以噪声能量。不是目标信号部分的电脉冲被称为噪声(Reaz et al. 2006)。\n\n从直接放在皮肤上的电极获取的信号是皮肤下所有肌肉动作电位的组合。通过向肌肉插入导线或针电极，偶尔可以获取肌纤维的动作电位：\n\
  \n```\nx(n) = sum_{r=0}^{N} h(r)e(n-r) + w(n)\n```\n\n其中，建模的 EMG 信号为`x(n)`，处理后的\
  \ EMG 信号为`e(n)`，运动单位动作电位（MUAP）为`h(r)`，零均值高斯噪声为`w(n)`，运动单位放电次数为`N (Reaz et al. 2006)`。\n\
  \n### 4.2.3.1 金森病\n\n人工智能方法可以作为医疗辅助来提高诊断准确性。为了评估神经肌肉功能障碍，使用了肌电图（EMG）信号。提出了一种利用表面肌电图（sEMG）信号检测帕森病神经肌肉功能障碍的自动方法。该系统采用\
  \ ANN 方法来区分健康和异常 EMG 信号。在使用精细改进自适应线性能量检测（FM-ALED）方法检测 EMG 活动区后，利用 DWT 提取特征。使用 ECOTECH\
  \ 项目数据集进行实验分析，关注准确率参数（Acc）。此外，为了识别健康和帕森患者，设计了一种结合投票规则和小波频率系数（WCC）的多类神经网络分类方法。多种使用表面肌电图的研究用于评估诊断的正确性。所提方法实现了\
  \ 100%的分类准确率(Bengacemi et al. 2021)。\n\n#### 4.2.3.2 肌萎缩侧索硬化症 (ALS)\n\n\n\n\n在诊断中，EMG\
  \ 信号参数具有极大价值。大多数 EMG 信号特征是利用时域、频域和时频域得出的。\n\n时域特征如 `spectrogram`、`root mean square`、`entropy`、`power`\
  \ 和 `kurtosis` 已被用于分类 ALSALS 和健康信号。对于 ALS 和健康 EMG 信号的分类，采用了基于 `mel-frequency cepstral\
  \ coefficient`（梅尔频率倒谱系数）的特征作为 `KNN` 分类器的输入。为了对健康和 ALS 信号进行分类，使用了 `discrete wavelet\
  \ transform`（离散小波变换）系数。使用 `mean frequency`、`average value of spectral peak`、`zero-crossing\
  \ rate` 和 `autocorrelation` 等基于频率的时参数，通过 `KNN` 分类器对 ALS 和健康 EMG 进行了分类。为了区分 ALS 和正常\
  \ EMG 信号，研究人员评估了从 `short-time Fourier transform` 中恢复的起始峰特征数量，以及频谱的功率水平和向高频区域的频率偏移。最小二支持向量机\
  \ (`LS-SVM`) 分类具有复杂度适中、非线性决策区域方法、自适应实现以及收敛到最小均方误差解的优点。所选内核函数决定了 `LS-SVM` 分类器的能力。其结果成功解决了复杂的回归和模式识别问题。这种分类的基本目标是找到一个超平面，使其与每类中最邻数据点之间的分类间隔最大化。在带有\
  \ `polynomial kernel function` 的第二个固有模态函数 (`IMF`) 中，六个函数与 `LS-SVM` 分类相结合产生了 95%\
  \ 的准确率。临床医生在做出 ALS 疾病决策时可能会发现所提策略有用。其他脑疾病（特发性震颤、妥动综合征、多发性硬化等）在未来可以使用这些特征进行分类 (Mishra\
  \ et al. 2016)。\n\n### 4.2.3.3 脊髓损伤 (SCI)\n\nEMG 已被广泛使用，因为它是评估 SCI 后恢复的一种基础方法。然而，在临床实践中，多项研究表明可以使用多种\
  \ `EMG` 参数来评估功能障碍 (Pilkar et al. 2020, Merletti et al. 2021)。在未来，通过开发 `EMG` 设备可以帮助对\
  \ SCI 进行决策。例如，在尝试恢复上肢功能时，通过 `EMG` 的现有信息可以提供指导。在心率变异性 (HRV) 方面，虽然研究发现了一致的证据，但关于 `EMG`\
  \ 的信息仍是不被充分探索的 (Balminot et al. 2021)。\n\n## 4.2.4 心率变异性 (HRV)\n\nHRV 与压力、死亡、运动表现和疲劳有关。HRV\
  \ 主要用于检查 `ANS` 的功能。`ANS` 由交感神经系统 (`SNS`) 和副交感神经系统 (`PNS`) 组成。战斗或逃跑反应 `SNS` 使心率加快、血压降低；而\
  \ `PNS`（也称为休息和消化）维持平衡，这种交感神经状态使人体保持安全 (Ishaque et al. 2021)。\n\n### 4.2.4.1 肌不良症\n\
  \n心血管参与在肌不良症患者中常见。心律失常和传导异常在这些患者中并不罕见。肌不良症患者 HRV 的缺乏自 20 世纪 90 年代已有描述。此外，HRV 的变化与进展有关\
  \ (Lanza et al. 2001)。60 名杜氏型肌不良症 (`DMD`) 患者与对照组之间的显著差异在于 `NN50` 和高频功率 (`HF`)。有趣的是，除了\
  \ `HF` 功率外，HRV 指标与分数之间没有观察到显著相关性。Inoue et al. 2009 评估了 57 名 `DMD` 患者的 HRV 指标，并将其与脑钠肽\
  \ (`BNP`) 水平及左心射血分数联系起来，这表明 HRV 的变化可以作为该组心血管损伤的前临床标志。\n\n### 4.2.4.2 帕金森 (PD)\n\n\
  自主神经系统的功能障碍伴随着 PD 的典型症状。与其他神经系统疾病一样，PD 患者的 HRV 一致被报道为降低 (Turkka et al. 1987, Ludin\
  \ et al. 1987, van et al. 1993))\n\n\n\n未治疗的近期癫痫发作患者的心率变异性（HRV）数据存在冲突。Persson 等人（(2007)）比较了\
  \ 22 名健康良好的未治疗癫痫患者，发现从 24 小时 Holter 随访评估的 HRV 测量值没有变化。另一方面，Evrengül 等人 (2005) 更清楚地识别出未治疗癫痫患者在心动过速记录中评估的\
  \ `SDNN` 降低、`HF` 减少以及 `LF` 值更佳，这表明交感神经张力增加。然而，检查这些效应非常困难，因为它们获取于长时间和短时间的记录。在疾病的更晚阶段，特别是难治性癫痫，几十年来一直有报道显示\
  \ HRV 有显著变化 (Drake et al. 1998, Tomson et al. 1998, Ansakorpi et al. 2002)。颞叶癫痫患者的非线性\
  \ HRV 参数、幂律斜率和 `ApEn` 显著低于健康主体。与疾病控制良好的患者相比，在难治性患者中观察到 HRV 进一步恶化。在接受术前评估的患者中，在发作后期间评估了发作期间的\
  \ EEG 和 ECG，发现发作后立即以及随后的 5–6 小时观察期间，HRV 参数出现下降。\n\n## 4.2.5 脑磁图 (MEG)\n\n复杂的中间结构产生的效应严重阻碍了精确确定信号源的尝试，极大地限制了通过\
  \ `EEG` 在头皮检测到的与脑活动相关的电位变化。另一方面，MEG 监测由细胞内电流产生的磁场变化，这种电流的产生遵循安培定律的“右手定则”。与 `EEG`\
  \ 测量不同，这些测量不受硬膜、颅骨和头皮的影响。因此，该技术提供了一种安全、非侵入的方法来“听”静息和简单任务期间的脑活动，尽管测量了数百通道，但从受试者的角度来看，设置过程非常温和且快速。这些数据的数学建模允许在识别源的同时保持高达每秒数万次的采样频率\
  \ (Proudfoot et al. 2014)。\n\n`MEG` 检测到的神经活动是由突触后电位、树突兴奋器和抑制器的净贡献产生的，而不是锥体细胞的轴电位（太短）。由于通过顶树突（用“双极子”表示）的电流会产生径向延伸的磁场，`MEG`\
  \ 擅长检测位于颅骨切向的双极子。幸运的是，由于人类皮层广泛折皱的沟回，大多数皮层微柱倾向于这种取向。另一方面，MEG 对深层源（如皮层下）不敏感，因为磁场变化非常迅速。`MEG`\
  \ 记录的信号强度比 1.5 特斯拉磁场的传统临床磁共振（MR）扫描仪低 10⁴ 级。这被比作在摇滚演唱会上听大针落地的。磁场最低的可定量变化被认为是由直径为\
  \ 0.9 mm 的皮层表面同时运行的 50,000 个锥体细胞产生的。由于自产生振荡活动的调节被广泛认为是地理远端网络区域通信的主要机制，因此迫切需要一种具有极高时间敏感性的脑尺度成像技术\
  \ (Proudfoot et al. 2014)。\n\n### 4.2.5.1 MEG 的应用与潜力\n\n`MEG` 与脑活动的侵入性研究有密切联系，并在发现癫痫病因方面发现了早期的治疗效用，特别是为后期程序制定计划\
  \ (Stufflebeam 2011)。`MEG` 之前已开始在网络水平表征静息状态下的全脑活动 (Brookes et al. 2011)，以及在后期阶段的任务执行，它不再局限于相当基础的神经生理学描述\
  \ (Luckhoo et al. 2012)。`MEG` 现在通过移除仅基于血管模型相关性的伪影解释来验证这些发现。在脑激活期间，血氧依赖性（BOLD）序列促进了多态数据的捕捉\
  \ (Singh 2012)。\n\n## 4.2.5.2 EEG 在神经系统诊断中的作用\n\n### 4.2.5.2.1 AD（阿尔茨海默病）\n\nMEG\
  \ 是一种记录变化的强大技术。与对照组相比，AD 患者在功能连接（`FC`）研究中的连接性较低。为了得出任何结论，必须进行进一步研究。与健康对照（`HC`）相比，顶叶和颞区的连接已与\
  \ AD 进展有关。海马体也被显示参与其中，但还需要进一步研究。其他电生理指标如 `EEG`、局部场电位（`LFP`）、`fMRI`、正电子发射扫描（`PET`）和脑刺激可以通过\
  \ MEG 进行桥。\n\n### 4.2.5.2.2 创伤性脑损伤 (TBI)\n\n`MEG` 与解剖 `MRI` 结合使用，作为一种确保高时间和空间分辨率的功能脑成像方法。它已被证明在识别轻度\
  \ TBI 以及评估由 TBI 产生的功能网络连接异常方面非常有效。将 `MEG` 与 `EEG` 或 `DTI` 等其他技术结合，可以帮助研究人员更好地理解\
  \ TBI 如何影响连接。如果结合 `EEG` 或 `DTI` 使用 `MEG`，研究人员可以更好地了解 TBI 如何影响连接。尽管 `MEG` 在 TBI 中的应用目前限于研究，未来的研究可能会发现其在\
  \ TBI 中的临床用途，就像它在癫痫中那样 (Peitz et al. 2021)。\n\n\n\n\n除了测试的非侵入性外，磁脑图（MEG）在检测语言功能方面具有内在优势。它的时间分辨率是毫秒而非秒，这远高于功能磁共振成像（fMRI），fMRI\
  \ 捕捉的是八秒时间间隔内的血管变化，产生的是关于关键和非关键语言定位区域的静态图像。当血管系统出现异常（如动静脉畸形 AVMs）时，fMRI 可能会提供错误的定位。另一方面，每幅\
  \ MEG 图像都以毫秒级的时间精度测量整个磁诱导响应期间的大脑神经元激活，从而允许对语言功能涉及的顺序阶段进行系统研究。MEG 也被用于一些较小的研究中评估记忆功能。可以想象，根据未来在该领域的研究结果，MEG\
  \ 将取代颈动脉氨巴比妥醇试验（IAP），也称为用于语言和记忆侧化目的的 WADA 测试（Ray and Bowyer 2010）。\n\nMEG 是一种具有重要价值的方法，具有广泛的已知和潜在用途。它可以用于补充脑电图（EEG）进行癫痫病灶定位，因为它具有优于后者的内在优势。与其他现有技术相比，非侵入性与极高空间和时间分辨率的结合是无比拟的。在总体准确性方面，MEG\
  \ 源定位比 EEG 更准确。此外，由于 MEG 不受纯径向信号的污染，因此其建模也更简单。除了癫痫焦点定位外，大脑皮层的功能定位预计将是该技术未来最重要的用途。MEG\
  \ 可用于定义如语言和记忆等更复杂的认知过程，而不仅仅是如感觉和视觉等相对简单的功能，因此有潜力改变现有的言语皮层定位范式（Ray and Bowyer 2010）。\n\
  \n## 4.3 生物医学信号的局限性\n\n本章讨论的所有生物医学信号的局限性如表 4.1 所示。\n\n### 表 4.1 生物医学信号的局限性 (#ch4.xhtml#R_table4_1)\n\
  \n| 生物医学信号 | 局限性 | 参考文献 |\n| --- | --- | --- |\n| **ECG（心电图）** | -- 伪迹的存在<br>- 性能测量<br>-\
  \ 信号分析算法的复杂性<br>- 使用的电极类型<br>- ECG 波形形态<br>- P 波和 T 波分析 | Khairuddin et al. (2017)\
  \ |\n| **EEG（脑电图）** | -- EEG 记录的主要缺点是空间分辨率低。<br>- EEG 信号对于精确定位活动源没有帮助。换句话说，它们并不精确。<br>-\
  \ EEG 波形无法帮助研究人员区分于不同但紧邻位置的活动。 | Sangam et al. (2020) |\n| **EMG（肌电图）** | -- 记录动态肌肉活动的局限性。<br>-\
  \ 仅用于浅层肌肉。<br>- 没有标准的电极放置方法。<br>- 可能会影响受试者的运动模式。<br>- 串扰（Cross-talk）是一个问题。<br>-\
  \ 检测区域可能无法代表整个肌肉。 | Katzberg and Abraham (2021) |\n| **MEG（磁脑图）** | -- 患者在 MEG 检查期间需要保持静止<br>-\
  \ 装有心脏搏器或类似设备的患者可能无法进行 MEG 研究 | Burgess (2020) |\n\n### 4.3.1 ECG 伪迹\n\n> * 电极放置错误；\n\
  > * 意外左臂–右臂反转；\n> * 与右心心的鉴别诊断；\n> * 右臂/左脚 (RA/LL) 电极反转；\n> * 胸部或非标准的肢联放置；\n> * 右腿和右臂电极意外反转；\n\
  > * 左臂/右脚意外反转；\n> * 手脚反转或双侧手脚反转。\n\n> (Pérez-Riera et al. 2018)\n\n### 4.3.2 EEG\
  \ 伪迹\n\n> * 源于外部因素的环境伪迹和实验误差被归类为外源伪迹；\n> * 生理伪迹包括心电图、眼动、舌动、起搏器、脉冲、喷鼻声、肌源和摇晃伪迹；\n\
  > * 非生理伪迹包括床动、连接在患者或周围的房间电子设备、松动和高阻抗电极以及 60 Hz 伪迹；\n> * 眼电伪迹、肌肉伪迹、心脏伪迹和外源伪迹。\n\n\
  > (Sazgar and Young 2019, Jiang et al. 2019)\n\n### 4.3.3 EMG 伪迹\n\n> * 存在多种内、外源低频噪声源，会污染\
  \ sEMG 信号；\n> * 电源噪声和电缆运动伪迹是外源噪声源的例子；\n> * 皮肤-电极界面（电化学噪声）和电子放大系统（热噪声）是内在噪声源；\n>\
  \ * 运动伪迹是力脉通过肌肉并在皮肤-电极界面产生运动时的电化学噪声。\n\n> (De Luca et al. 2010)\n\n### 4.3.4 MEG\
  \ 伪迹\n\n> * 来自屏蔽室外部的干扰；\n> * 屏蔽室内的其他个人和设备；\n> * 患者体内的源，包括生理性和非生理性；\n> * 与目标无关无关头内活动；\n\
  > * 来自系统的传感器和记录电子噪声；\n> * 来自其他记录设备的伪迹，例如诱发电刺激器；\n> * 患者位置不正确；\n> * 记录期间的头部姿势变化；\n\
  > * 准配错误；\n> * 后处理期间输入的错误信号；\n> * 拟合错误。\n\n> (Burgess 2020)\n\n## 4.4 未来方法\n\n物联网（IoT）作为最关键的互联技术之一正在改变医疗行业。根据文献，IoT\
  \ 可以实现多种医疗和健康应用。例如，远程健康监测和交付、运动计划、慢性病、老年护理、治疗依从性和居家用药都可以受益于 IoT。此外，医疗辅助设备（如 ECG、传感器和其他诊断和成像设备）也可以通过\
  \ IoT 连接。基于 IoT 的设备网络预计将改善疾病诊断和预防，降低医疗成本，提高生活质量并改善患者对这些设备的体验。最后，IoT 有可能为构建更符合逻辑、更务实的\
  \ ECG 设备铺平道路，这些设备不仅能满足目前的需求，还能改变未来医疗服务的监测和交付方式。\n\n\n\n\n与旧方法相比，机器学习作为一种新兴技术，为高维和复杂数据提供了基于原理的自动且客观的算法，在脑电图（EEG）信号处理中展现了其优越性。尽管机器学习具有许多优势（例如低偏差和对模式识别的高敏感性），但必须同时考虑可靠的分类器、特定的特征提取、精选的数据以及计算成本。例如，在特定情况下，通道选择可以减少特征提取和模式识别的计算负载，这对于在线计算是可行的，特别是对于现实应用中的某些可穿戴或植入式设备。另一种选择是利用\
  \ 5G 技术支持的云计算来实现实时 EEG 记录与交换。深度学习是图像处理领域的趋势技术，但它现在才开始出现在 EEG 处理领域，展示了其在 EEG 模式检测中的优越性。\n\
  \n很可能，随着`蓝牙`、`Wi-Fi`、近场通信（NFC）和无线体域网络（WBAN）等不同通信模块的出现，医疗可穿戴设备（`HWDs`）现在可以实时可视化并共享数据。这些\
  \ `HWDs` 有助于广泛指标和生物电位的量化。测量心功能的 `ECG`、监测对神经刺激反应的肌肉活动的 `EMG`、监测脑活动的 `EEG` 以及记录眼球运动的眼电图（`EOG`）都是生物电位的示例。这些\
  \ `HWDs` 被广泛用作非侵入性医疗设备，特别是在床旁护理（`POC`）中。此外，由于穿戴设备是非侵入性的，它们简化了治疗程序并降低了以往与血液相关的感染风险。\n\
  \n`HWDs` 彻底改变了医疗保健行业。正如前所述，它们已被证明在监测各种生理参数方面是有效的。研究发现它们在监测方面具有广泛的应用前景；因此，需要进一步的工作来使其适用于诊断。这是由于大多数诊断技术需要使用诸如血液、尿液和唾液等样本，而\
  \ `HWDs` 难以整合这些样本。此外，`AI` 算法可以用于跟踪多种因素的体以进行预后，例如监督学习回归方法。同样，佩戴者的安全至关重要，因为 `HWDs`\
  \ 携带了受保护的健康信息（`PHI`），必须保护佩戴者的隐私。出于这些原因，`HWDs` 需要安全通信技术来确保佩戴者的机密性和隐私。`HWDs` 也被发现用于监测心血管疾病、肌肉疾病、血液和血糖水平等生理性疾病很有用。然而，`HWDs`\
  \ 用于 `PD`、`AD` 以及其他心理障碍等精神疾病的应用仍然有限。因此，在不久的将来，扩大 `HWDs` 在心理疾病方面的应用可能会非常有用。\n\n##\
  \ 4.5 总结\n\n本章关注了用于神经系统诊断的各种生物医学信号。在生物医学工程的教学和研究领域，生物医学信号和图像处理的各种技术被广泛使用。对生物医学信号生理理解的进步导致了新型临床方法。电生理信号与成像模态的结合是神经科学领域的一项重要策略。本章介绍了许多基于电生理信号与功能成像相结合的常用算法。由于该技术在此背景下的用途，案例研究包含了对\
  \ `ECG`、`EEG`、`EMG`、`MEG` 和 `HRV` 信号的评论。未来，可以将结合电生理信号与功能成像的先进算法和技术进行比较。\n\n## 参考文献\n\
