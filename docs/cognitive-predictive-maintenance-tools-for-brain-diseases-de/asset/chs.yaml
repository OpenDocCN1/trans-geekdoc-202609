  \ *Case Reports* 2012 (2012): bcr0120125543.\n\n# 5 电子设备与电路概述\n\nB. V. Srividya\
  \ 和 Sasi Smitha\n\nDayanand Sagar 工程学院，印度班加罗\n\nDOI: [10.1201/9781003245346-5](https://dx.doi.org/10.1201/9781003245346-5)\n\
  \n## 5.1 引言\n\n认知问题通常是逐渐开始的，但随着病情恶化，会显著降低受影响者的生活质量。了解各种认知疾病的形式、症状以及可选的疗法是[1]。\n\n\
  癫痫是一种以异常大脑活动为特征的疾病，可能导致发作，以及期间行为异常、情绪波动，偶尔出现意识丧。发作有许多潜在的征象。某些癫痫患者在发作期间只是短暂地发呆，而另一些人则会反复抽动四肢[2]。通常情况下，需要至少两次间隔至少\
  \ 24 小时的独立发作才能诊断为癫痫。大多数癫痫患者可以通过药物控制发作，尽管极少需要手术治疗。另一些患者最终实现了发作停止，而某些患者则需要持续治疗来管理发作。一些青少年癫痫患者可能会随着年龄增长而痊愈。\n\
  \n癫痫这种长期神经系统疾病会导致多种发作，其中某些发作的特征是不可控制的重复性抽挛，这对患者的日常生活产生巨大影响。对患者应佩戴的设备部分进行了专门考虑，并提供了细节。本研究将重点关注如何实现癫痫检测，[3]。\n\
  \n帕金森病（PD）是一种由于多巴胺水平过低引起的神经系统疾病。约 60% 的患者会出现三种主要症状：震颤、僵硬和运动缓慢。多巴胺类药物有助于某些症状，但随着疾病进展，其效果往往会下降[4]。\n\
  \n机器学习算法可以实现诊断[5]。通过对不同疾病的研究，深脑刺激（DBS）已成为药物性运动障碍、强迫症和癫痫的一种批准且有效的治疗方法。\n\n这些方法使用：\n\
  \n1. 植入大脑并连接电极的纤细绝缘线；\n2. 植入式脉冲发生器（IPG）；\n3. 连接这两个部分的引线；\n4. 可控制开关并调节信号的设备。\n\n\
  在 DBS 中，电极被放置在多个脑区，如图 5.1](#ch5.xhtml#fig5_1）所示[7]。这些电极提供电脉冲以调节异常脉冲。电脉冲还可能对细胞和各种化学物质产生影响。放置于胸部皮肤下的电子电路是深脑刺激器的主体，类似于起搏器。穿过皮肤的线将该装置与电极连接。\n\
  \n## 5.2 深脑刺激器中的电极\n\n医学电极通常由导线（用于传导电流）、金属电极以及对于表面电极[8]的导电凝胶或黏剂组成。电极能够捕捉到由细胞活动产生的微小电荷。这些电荷会被放大并在监测设备上显示为图像。\n\
  \n电极将离子电位转换为电位，以便在电子电路中处理信号（见图 5.2](#ch5.xhtml#fig5_2)）。\n\n\n\n\n\n电极是用于与非金属部件接触的导体。阳极和阴极是构成了二极管的两个电极。在接下来的章节中，将讨论各种电子电路和设备。\n\
  \n## 5.3 可植入式脉冲发生器 (IPG)\n\n一种名为 `IPG` \\[9\\]的电源，通过导线和延长线将电流传输到电极，跨越电极-组织界面，然后穿过组织回到\
  \ `IPG` 外壳内的返回电极。`IPG` 既可以使用电流源，也可以使用电压源。\n\n图 5.3 所示的框图描述了如电源、阳极和阴极电极以及场效应晶体管 (`FET`)\
  \ 等各种电子电路的使用。这些电子电路和设备的细节将在后续章节中详细阐述。\n\n![图 5.3 深脑刺激器中的可植入式脉冲发生器 [9]。](images/fig5_3_B.jpg)\n\
  \n图 5.3 深脑刺激器中的可植入式脉冲发生器 \\[9\\]\n\n导线通过延长线连接到 `IPG`，延长线是一种插入头部、颈部和肩膀皮肤下的绝缘线。`IPG`\
  \ 的第三个组件被称为“电池”，通常植入在锁骨附近的皮肤下。在某些情况下，它可能被放置在腹部皮肤下或胸部较低位置。这些延长线，如 图 5.4 所示，通常由封装在乙烯四氟乙烯中的非磁性合金组成，并用聚碳酸酯聚氨氨酯进行绝缘。\n\
  \n![图 5.4 深脑刺激器示意图 [10]。](images/fig5_4_B.jpg)\n\n图 5.4 深脑刺激器示意图 \\[10\\\\]\n\n\
  在使用 `DBS` 时，电极被放置在脑的多个区域。这些电极的电脉冲可以调节不规则的脉冲。或者，电脉冲可能会对脑细胞及分泌的各种化学物质产生影响。`DBS` 的水平由一个类似于起搏器的电子设备控制，该设备位于上胸皮肤下方。一个皮下连接将该装置与脑内的电极连接起来。\n\
