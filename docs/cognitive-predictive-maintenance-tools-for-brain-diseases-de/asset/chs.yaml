  \nPN 结二极管的符号表示。如 图 5.6 所示。\n\n \n\n\n\n\n\n晶体管符号的发射极有一个从 P 区指向 N 区的箭头。该箭头显示了晶体管在该方向上的典型电流流。在\
  \ NPN 和 PNP 晶体管中，发射极箭头的方向如图 5.11 所示相反。NP 晶体管与 PNP 互补。自由电子是 NPN 晶体管中的大部分载子，而 PNP\
  \ 晶体管中则是空穴。空偏或开路晶体管是指发射极、基极和集极终端未连接的晶体管。\n\n![图 5.11 NPN 和 PNP 晶体管的示意图。](img/fig5_11_B.jpg)\n\
  \n图 5.11 NPN 和 PNP 晶体管的示意图。\n\n在正向偏置模式下，NPN 晶体管的发射极结和集极结结分别为正偏和反偏。只有当 `V` 高于硅晶体管的\
  \ `0.7 volts` 势垒电位和锗晶体管的 `0.3 volts` 势垒电位时，发射极结才处于正偏状态。由于发射极结的正偏置，N 型发射极的自由电子沿基区方向流动。这构成了发射电流。\n\
  \n电子的流动方向与常规电流的方向相反。一旦进入基区，电子倾向于与空穴结合。这些被释放的电子在基极中与空穴结合时，就变成了基极电流。\n\n大多数未对电子不会与基极的空穴复合。这是由于基极宽度被做得极其微小，没有足够的空穴供电子进行复合。因此，大多数电子将扩散到集极区域，产生集极电流。由于集极电流是由从发射极区域注入的电子形成的，因此称为注入电流。热产生的载子为集极电流增加了另一个因素。反向饱和电流（这就是所指的这种电流）是一个非常小的电流。\n\
  \n为了使晶体管工作，有三种不同的配置，如下文所示 [14]。\n\n## 5.5 标准共基极配置\n\n这种设计有时被称为共基极接。在这种设置中，发射极作为输入终端，集极作为输出终端，基极作为公共终端(图\
  \ 5.12)。\n\n![图 5.12 共基极配置。](img/fig5_12_B.jpg)\n\n图 5.12 共基极配置。\n\n二极管对一个方向的电流流提供的电阻极小，对另一个方向的电阻极大。因此，二极管是一种单向器件。\n\
  \n## 5.6 典型的发射极设计：共发射极 (CE)\n\n也称为共发射极设置，基极作为输入终端，集极作为输出终端，发射极作为公共终端。\n\n发射极位于集极和基极之间是典型的发射极配置。如图\
  \ 5.13 所示，发射电流 (`I[B]`) 随基-发射极电压 (`VBE`) 的变化而波动，而集-发射极电压 (`VCE`) 则保持不变（参见图 5.14）。\n\
  \n![图 5.13 共发射极配置。](img/fig5_13_B.jpg)\n\n图 5.13 共发射极配置。\n\n![图 5.14 共发射极模式下晶体管的\
  \ VI 特性。](img/fig5_14_B.jpg)\n\n图 5.14 共发射极模式下晶体管的 VI 特性。\n\n## 5.7 集极的配置：共集极 (CC)\n\
  \n也称为共集极设置，基极作为输入终端或输出终端，集极作为公共终端。\n\n在共集极配置中，集极被认为是共享的。因此，输出从发射极和集极产生，而输入位于基极和集极之间。由于输出极电压始终跟踪基极输入电压，共集极设计经常被称为发射极跟随或电压跟随器，如图\
  \ 5.15 所示。\n\n![图 5.15 共集极配置。](img/fig5_15_B.jpg)\n\n图 5.15 共集极配置。\n\n如深部刺激器的内部框图(图\
  \ 5.3)所示，隐式放大器是增加信号强度所需的非常电子电路之一。\n\n## 5.8 作为放大器的晶体管 [11, 15]\n\n通过增强微弱信号的强度，晶体管充当放大器的角色。图\
  \ 5.16 显示了晶体管放大电路。晶体管的发射极和基极以正偏连接时，集极结区处于反偏状态。\n\n![图 5.16 作为放大器的晶体管。](img/fig5_16_B.jpg)\n\
  \n图 5.16 作为放大器的晶体管。\n\n\n\n\n\n## 放大器类型\n\n*   **D 类放大器**：D 类音频放大器本质上是非线性开关放大器或脉冲宽度调制\
  \ (`PWM`) 放大器。由于电流仅通过导通的晶管流过，因此在一个周期内不存在电压和电流波形重叠的时候。这使得 D 类放大器在理论上可以达到 100% 的效率。\n\
  \n*   **F 类放大器**：通过在输出网络中使用谐波谐振器，F 类放大器可以将输出波形转换为方波来提高输出和效率。当使用无限谐波调谐时，F 类放大器能够达到\
  \ 90% 的效率 [16, 17]。\n\n*   **G 类放大器**：这些放大器在传统 AB 类放大器设计的基础上进行了改进。G 类使用几路不同电压的电源轨，并在输入信号变化时自动在它们之间切换。这种频繁切换降低了平均功耗，从而减少了通过热量浪费造成的功率损失\
  \ [16, 18]。\n\n*   **I 类放大器**：这些放大器由两组互补的并行推挽输出开关器件组成，它们采样相同的输入波形。一个器件切换波形的正半部分而另一个切换负半部分，类似于\
  \ B 类放大器。当信号达到过零点或没有输入信号应用时，开关器件同时开启和关闭，通过 50% 的 `PWM` 占空比抵消任何高频脉冲。减少负开关器件的占空比以产生相反的效果，同时增加正开关器件的占空比以产生输出信号的正半部分。当\
  \ `class I` 放大器以超过 250 kHz 的开关频率运行时，被称为“交错脉冲宽度调制放大器”，因为不同的开关信号电流被认为在输出端是交错的 [19]。\n\
  \n*   **S 类放大器**：这些功率放大器是非线性开关模式放大器，功能与 D 类放大器类似。模拟输入信号通过 delta-sigma 调制器转换为数字方波脉冲，然后由\
  \ S 类放大器放大以增加输出功率，最后通过带通滤波器解调。由于这种开关放大器的数字信号始终是完全“开启”或“关闭”，因此可能达到 100% 的效率 [20]。\n\
  \n*   **T 类放大器**：这类放大器是一种独特的数字开关放大器架构。由于数字信号处理 (`DSP`) 芯片和多声道环绕声放大器的随处可用，T 类放大器作为一种音频放大器设计正越来越受欢迎。T\
  \ 类放大器通过在放大之前将模拟信号转换为数字 `PWM` 信号来提高效率。T 类放大器设计将 AB 类放大器的低失真信号电平与 D 类放大器的功率效率相结合\
  \ [19]。\n\n## BJT 与 JFET\n\n`BJT` 与结场效应晶管 (`JFET`) 之间的主要区别是 `BJT` 是一种基极电流调节输出电流的器件。相比之下，应用于\
  \ `JFET` 的输入电位控制器件的输出电流。与具有高输入阻抗的 `JFETs` 不同，`BJTs` 具有低输入阻抗。\n\n## 场效应晶管 (FET)\n\
  \n### 10 场效应晶管\n\n应用于 `JFET` 的输入电位控制器件的输出电流。与具有高输入阻抗的 `JFETs` 不同，`BJTs` 具有低输入阻抗。`FET`\
  \ 在……中是独特的……\n\n### 5.3 结晶\n\n应用于 `JFET` 的输入电位控制器件的输出电流。与具有高输入阻抗的 `JFETs` 不同，`BJTs`\
  \ 具有低输入阻抗。`FET` 在……中是独特的……\n\n### 18 结效应晶管\n\n应用于 `JFET` 的输入电位控制器件的输出电流。与具有高输入阻抗的\
  \ `JFETs` 不同，`BJTs` 具有低输入阻抗。`FET` 在……中是独特的……\n\n### 19 结效应晶管\n\n应用于 `JFET` 的输入电位控制器件的输出电流。与具有高输入阻抗的\
  \ `JFETs` 不同，`BJTs` 具有低输入阻抗。`FET` 在……中是独特的……\n\n### 20 结效应晶管\n\n应用于 `JFET` 的输入电位控制器件的输出电流。与具有高输入阻抗的\
  \ `JFETs` 不同，`BJTs` 具有低输入阻抗。`FET` 在……中是独特的……\n\n### 21 结效应晶管\n\n应用于 `JFET` 的输入电位控制器件的输出电流。与具有高输入阻抗的\
  \ `JFETs` 不同，`BJTs` 具有低输入阻抗。`FET` 在……中是独特的……\n\n### 22 结效应晶管\n\n应用于 `JFET` 的输入电位控制器件的输出电流。与具有高输入阻抗的\
  \ `JFETs` 不同，`BJTs` 具有低输入阻抗。`FET` 在……中是独特的……\n\n### 23 结效应晶管\n\n应用于 `JFET` 的输入电位控制器件的输出电流。与具有高输入阻抗的\
  \ `JFETs` 不同，`BJTs` 具有低输入阻抗。`FET` 在……中是独特的……\n\n### 24 结效应晶管\n\n应用于 `JFET` 的输入电位控制器件的输出电流。与具有高输入阻抗的\
  \ `JFETs` 不同，`BJTs` 具有低输入阻抗。`FET` 在……中是独特的……\n\n## JFET 特性\n\n`JFET` 在不同区域的特性取决于输入端：\n\
  \n*   **欧姆区**：当 `VGS = 0` 时，`JFET` 在沟道极小的耗尽区内充当电压控制电阻。\n*   **截止区**：夹断区（pinch-off\
  \ region）是该区域的另一个名称。当栅极电压明显为负时，`JFET` 进入此区域。通道随后关闭并停止传输电流。\n*   **饱和区**：栅极电压控制通道在饱和区的性能。\n\
  *   **击穿区**：如果漏源电压 (`VDS`) 足够高，`JFET` 通道会发生击穿，导致不受控的最大电流通过。\n\n除例外例外，P 型 `JFET`\
  \ 晶管的 V-I 特性曲线与 N 型 `JFET` 晶管相似。例如，当栅源电压 (`VGS`) 向正方向增加时，漏极电流会下降。\n\n当夹断电压 `VP`\
  \ 等于应用电压 `VGS` 时，没有漏极电流 `ID` 流过通道。当应用的栅极电压 `VGS` 在 0 到 `VP` 之间时，可以确定通过通道的漏极电流 `ID`。\n\
  \n$$I_{D} = I_{DSS}\\left( 1 - \\left( \\frac{V_{GS}}{V_{P}} \\right) \\right)^{2}$$\n\
  \n绝缘栅场效应晶管 (`IGFET`)，也称为金属氧化物半导体场效应晶管或 `MOSFET`，以及 `JFET` 是两种主要的 FET 类型。\n\n与 `JFET`\
  \ 相比，`MOSFET` 具有许多优势：\n\n*   漏电流极低；\n*   具有约 $10^{14}$ 欧姆的极输入阻抗；\n*   `MOSFET` 使用功率更少；\n\
  *   它被应用于极高频、高噪声应用；\n\n\n\n\n\n- 与 `JFET` 相比，它具有极快的开关速度。\n\n### 5.10.2 金属氧化物半导体场效应晶\
  \ (MOSFET)\n\n`MOSFET` 的 `drain`、`gate`、`source` 和 `body` 端子 \\[25\\]是它的四个端子。`source`\
  \ 端子和 `body` 端子经常被短路以形成三个端子。在 `MOSFET` 的 `gate` 和 `drain-source` 通道之间有一个由金属氧化物制成的绝缘层，这提高了输入阻抗并将\
  \ `gate` 与 `channel` 电气上隔离。此外，它还减少了漏电流。`JFETs` 没有这种绝缘层，因此它们没有如此高的输入阻抗或极低的漏电流。\n\n\
  `P-substrate` 物质（正式称为 `substrate`）是导致 `N-channel-MOSFET` 中产生 `body` 的原因。名为 `source`\
  \ 和 `drain` 的端子的形成取决于 `N-type` 材料。在这里，`N-type` 杂质被强掺杂，而 `P substrate` 杂质被轻掺杂。如 图\
  \ 5.20 所示，这些 `MOSFETs` 均有 `enhancement mode`（增强型）和 `depletion mode`（耗尽型）可用。\n\n\
  ![图 5.20 显示增强型和耗尽型 MOSFET 差异的示意图。](img/fig5_20_B.jpg)\n\n图 5.20 显示增强型和耗尽型 MOSFET\
  \ 差异的示意图。\n\n`N Channel-MOSFET` 的增强型及其符号分别在 图 5.21 和 5.22 中所示。`N Channel-MOSFET`\
  \ 的耗尽型及其符号分别在 图 5.23 和 5.24 中所示。\n\n![图 5.21 N 道增强型 MOSFET。](img/fig5_21_B.jpg)\n\
  \n图 5.21 N 道增强型 MOSFET。\n\n![图 5.22 N 道 MOSFET 的符号表示。](img/fig5_22_B.jpg)\n\n图 5.22\
  \ N 道 MOSFET 的符号表示。\n\n![图 5.23 N 道耗尽型 MOSFET。](img/fig5_23_B.jpg)\n\n图 5.23 N 道耗尽型\
  \ MOSFET。\n\n![图 5.24 N 道耗尽型 MOSFET 的符号表示。](img/fig5_24_B.jpg)\n\n图 5.24 N 道耗尽型\
  \ MOSFET 的符号表示。\n\n可以开发出一种大多数电载子（或 `electrons`）负责导电的 `MOSFET`。当该 `MOSFET` 激活到开启\
  \ 状态时，器件会产生最高水平的电流。`N-channel-MOSFET` 是这种 `MOSFET` 的名称。`source` 端子和由 `P-type` 产生的器件\
  \ `body` 耦合到共地。`gate` 端子接收正性电压。由于这种正性，它产生了一个电容效应。因此，在 `P substrate` 中，自由电子少数载流子被吸引并向\
  \ `gate` 端子迁移。结果是在电质层下方形成了一层暴露的离子，`holes` 和 `electrons` 在此处发生配对。随着施加的正电压逐渐增加并跨越最小阈值，少数载流子\
  \ `electrons` 能够防止与 `holes` 复合；它们还在两个 `P-type` 材料之间创建了 `channel` \\[26\\]。\n\n当进一步施加\
  \ `drain` 的正电压值时，晶体产生电流。`channel` 是由于取决于施加电位的电子浓度形成的。在 `gate` 上施加电压改善了电流流。因此，它被称为\
  \ `enhancement type N-channel-MOSFET`。\n\n### 5.10.3 N 道耗尽型 MOSFET\n\n增强型 `MOSFET`\
  \ 具有相似的设计；但其工作方式不同。\n\n`N-type` 杂质构成了 `drain` 端子和 `source` 端子之间的区域。\n\n\n\n\n\n\
  一种被称为 `FinFET` 的垂直鳍形结构作为器件的漏极和源极。源极和漏极被栅包围。通过这种设计，栅极足够长，漏极和源极之间的载流子通道得到了更好的静电控制。金属、氧化物和半导体在平面器件\
  \ `MOSFETs` 的基础结构中都起着作用。平面 `N-channel MOSFET` 是通过在 `P-substrate` 衬底上扩散高掺杂 `N` 区域制成的。在这个平面结构上，形成了一层二氧化硅。金属端子被刻蚀在二氧化硅的绝缘层上。与下方的\
  \ `N` 区域接触的金属端子形成漏极和源极。栅极端子是二氧化硅上与 `N` 区域不接触的金属层（图 5.26）。\n\n![Figure 5.26 FinFET\
  \ 示意图 [29].](images/fig5_26_B.jpg)\n\n图 5.26 FinFET 示意图 [29]。\n\n与 `MOSFETS` 相比，`FinFETs`\
  \ 得益于其三维结构具有显著优势 [30]。这些属性包括：\n\n*   单个芯片可以包含大量的晶体管。由于在给定足迹尺寸比 `MOSFETs` 具有更高的扩展性，`FinFET`\
  \ 技术适用于集成电路的生产。\n*   晶体管随芯片尺寸而缩小。这种紧凑性降低了栅极对通道载流子的控制能力，并使漏极和源极靠得。在 `MOSs` 中，这种短道效应会导致严重问题。`FinFETs`\
  \ 由于鳍的存在表现出优异的短道性能。\n*   平面 `MOSFETs` 经常采用沟道掺杂来增强短道行为。在 `FinFETs` 中，由于环绕栅覆盖了薄衬体，沟道掺杂是可选的。因此，`FinFETs`\
  \ 没有由掺杂引起的波动。\n*   为了减少漏电流并进而减少漏耗，栅极长度至关重要。在 `FinFETs` 中，栅极足够长可以环绕漏源通道，防止栅极未激活时产生漏电流。然而，当\
  \ `MOSFETs` 中的栅极缩小时，就会产生漏电流。\n*   在开关器件中，漏耗由漏电流和电压引起。`FinFETs` 比 `MOSFETs` 省电，因为它们是低漏电流器件。\n\
  *   平面 `MOSFET` 的驱动强度取决于沟道宽度，而 `FinFET` 晶体管的驱动强度可以通过合并更多、更长的鳍来增加。\n*   `FinFETs`\
  \ 更快的开关速度可能源于更大的驱动电流。与平面 `MOSFETs` 相比，三维 `FinFETs` 可以被视为高速电子器件。\n*   `FinFET` 技术使多栅器件的制造变得简单。由于平面架构，`MOSFETs`\
  \ 中的多栅制造非常耗费精力。\n*   与平面 `MOSFETs` 相比，`FinFETs` 具有更好的亚阈值率和更大的电压增益。\n\n## 参考文献\n\n\
