  \ Pune, India\n\n# 1 大脑及其结构与功能\n\n## 1.1 引言\n\n\n\n\n大脑是神经组织块，构成了中枢神经系统的大部分，位于颅骨的前部。从外观上看，大脑可以比作一个深度褶皱的核桃。它由数十亿个被称为神经元的脑细胞组成（Jorfi\
  \ et al. 2018）。神经元的结构由`轴`、`树突`和`细胞体`组成。`轴`是神经突起，负责从大脑向身体其他部分传输电和化学信号。`树突`是神经元的根状结构，负责接收来自其他神经细胞的信号。`细胞体`是神经元的核心，包含遗传信息（Birey\
  \ et al. 2017）。\n\n大脑由 60%的脂肪和 40%的水、蛋白质、碳水化合物和盐类的混合物组成（Pistell et al. 2010）。大脑本身并不是肌肉。它包含血管和神经，，包括神经元和胶质细胞。\n\
  \n它作为身体主要的信息接收器、组织者和分配器。脑细胞之间的信息传递是因为于全身神经系统中电和化学信号的传输。不同的信号控制着不同的过程，而你的大脑会解释每一种信号。大脑整合感觉信息并引导全身的运动反应（Risso\
  \ & Valle 2022）。\n\n成年大脑平均重量为 1.4 公斤（3 磅），已知其重量会随着年龄的增长而减少（Schwartz et al. 2022）。男性大脑重量比女性大脑重\
  \ 9.8%。这种重量的下降大约从 50-60 岁开始，这种进行性下降在 85-90 岁达到峰值，此时与年轻人的最大重量相比，平均重量减少了 11%（Brion\
  \ et al. 2021）。\n\n图 1.1 神经元的结构。\n\n图 1.2 大脑的结构。\n\n## 1.2 大脑的结构\n\n大脑结构分为三个主要部分：\n\
  1. 前脑；\n2. 中脑；\n3. 后脑。\n\n### 1.2.1 前脑\n\n大脑和小脑皮层构成了前脑。大脑是大脑最大的区域，大脑皮层是覆盖在大脑上的外层。大脑皮层由灰质组成，其包含细胞体和树突，它覆盖了内部的白质（Bit\
  \ et al. 2021）。大脑由灰质和白质组成，包含细胞体和神经纤维。大脑皮层仅包含灰质，因为这部分神经缺乏称为髓鞘的脂肪覆盖物（白质）。大脑既包含灰质也包含白质（Hoppstädter\
  \ et al. 2022）。\n\n#### 1.2.1.1 大脑\n\n大脑定义了个人的个性。它还负责智能、记忆、个性、情感、语言以及感觉和移动的能力，即自主性肌肉运动。\n\
  \n大脑分为左右两半，称为右半球和左半球。两半通过一组被称为胼脑的神经纤维连接，促进了两个半球之间的通信。两个半球带有不同的功能并控制身体的不同部分（Grant\
  \ et al. 2021）。\n\n左侧被认为是逻辑、分析和客观的一侧。右侧被认为更具直觉、创造力和主观性（Assaneo et al. 2019）。\n\n\
  #### 1.2.1.2 皮层\n\n大脑皮层是大脑表面的最外层覆盖。它由 140 亿到 160 亿神经细胞组成。大脑皮层负责高级思考、意识、想象、语言、记忆、感知、学习、推理、感觉和问题解决（Budson\
  \ et al. 2022）。\n\n感官器官的信息首先传输到大脑皮层的细胞中。这些信息通过神经和神经元以化学和电信号的形式引导到神经系统的其他部分。\n\n\
  皮层进一步分为四个功能区域，称为叶。这些叶以覆盖其上的颅骨命名，即额叶、顶叶、颞叶和枕叶（Bazira 2021）。\n\n图 1.3 前脑的四个叶。\n\n\
  - 额叶位于额头下方。额叶的功能调节注意力、注意力、自我监控、组织、面部表情、说话、自发性、个性、灵活性、问题解决和情感（Tucker & Luu 2023）。\n\
  - 顶叶位于额头，控制复杂的行为、触觉、空间感知、判断（Crowe-Riddell & Lillywhite 2023）。\n- 枕叶位于大脑后部，主要与视觉处理和视觉相关（Arioli\
  \ et al. 2021）。\n- 颞叶位于耳朵附近，控制语言理解、口语流利度、通用知识、听力和排序（Chandregowda et al. 2021）。\n\
  \n前脑的内部部分由：\n- 丘脑协调运动并将身体其他部分的感觉信息传输到皮层。\n- 下丘脑位于脑底部，是一组核集合，负责控制许多身体功能，如饥饿、口渴、情感、体温调节和昼夜节。它还控制垂体以及调节压力、性成熟、生长、代谢并平衡体内水分和矿物质的激素（Timothy\
  \ & Forlano 2020）。\n- 垂体只有豌大小，是内系统和神经系统之间的桥梁。它负责调节甲状腺激素、肾上腺激素、泌素、性激素、卵泡刺激激素、黄体激素、生长激素、黑素刺激激素和多巴胺。它还响应来自下丘脑的信号（Bhushan\
  \ et al. 2022）。\n- 松果体产生褪黑素，控制皮肤色素的激素。该腺体被称为“第三眼”，因为它受光敏感神经元的控制。\n\n### 1.2.2 中脑\n\
  \n中脑是脑干最小部分，长度为 2 厘米。它是后脑和前脑之间的连接桥梁。它位于丘脑和脑桥之间。中脑也被中脑，因为它发育于神经管的中脑，并连接脑桥和前脑。它包含两个脑神经的中继核，即动眼神经和滑神经，它们负责处理听觉和视觉信息（Rahimi-Balaei\
  \ et al. 2022）。它调节眼睛和眼睑的运动。\n\n中脑由（Sciacca et al. 2019）组成。\n\n\n\n\n*   `Tectum`（中盖）——中脑的背部，具有四个圆形的叶或丘，称为\
  \ `corpora quadrigemina`（四足板）。`superior colliculi`（上丘）负责视觉信号的处理。`inferior colliculi`（下丘）负责听觉信号的处理。\n\
  *   `Cerebral aqueduct`（脑水道）——穿过中脑连接第三第四脑腔。\n*   `Cerebral peduncle`（脑脚）——由连接前脑和后脑的厚神经束组成。\n\
  *   `Tegmentum`（脑底）——位于`tectum` 前方。包含各种神经束、网状结构和脑神经核。两个主要区域是`red nucleus`（红核）和`periaqueductal\
  \ gray`（导水周围灰）。参与运动协调。\n\n中脑的主要功能是：\n\n*   视觉和听觉反射中心。\n*   参与视觉和听觉信息的处理。\n*   调节眼球运动和瞳孔放大。参与调节肌肉运动和运动控制。与脑干的其他部分一起，控制至关重要的自主功能。参与调节疼痛、情绪、呼吸、警觉性等\
  \ (Mesman & Smidt 2020)。\n\n#### 1.2.2.1 脑桥\n\n`pons`（脑桥）的主要作用是神经系统各部分（包括小脑和大脑）之间的桥梁。许多重要神经起源于`pons`，例如`trigeminal\
  \ nerve`（三叉神经），负责脸部感觉以及控制咬合、咀嚼和吞咽的肌肉。它还包含`abducens nerve`（外动神经），让我们能够左右看，以及`vestibular\
  \ cochlear nerve`（前庭蜗蜗神经），让我们能够听觉。作为脑干的一部分，`pons`下部刺激并控制呼吸强度，而`pons`上部则降低呼吸的深度和频率\
  \ (Zuperku et al. 2019)。`pons`还与睡眠循环有关，控制呼吸和反射。它位于`medulla`（延髓）上方，`midbrain`（中脑）下方，紧邻小脑前方。`pons`参与许多感觉和自主过程，如运动控制、唤醒、维持平衡、呼吸功能、肌张力和昼夜节律\
  \ (Joseph et al. 2021)。\n\n#### 1.2.2.2 延髓\n\n`medulla`（延髓）的主要作用是调节我们的非意识生命维持功能，如呼吸、吞咽和心率。作为脑干的一部分，它还帮助在大脑和脊髓之间传输神经信息。它位于脊脑交界处。\n\
  \n### 1.2.3 后脑\n\n`cerebellum`或`hindbrain`（后脑）根据其位置命名，因为它位于头部后部，并部分收缩在两个大脑半球下方。在拉丁语中，“cerebellum”意为“小脑”，它负责处理和排序维持姿态和平衡以及协调肢体运动所需的信号。`cerebellum`被认为是大脑第二大部分，其巨大的表面通过复杂的折叠收纳在颅骨内，呈现出不规则的褶皱状外观\
  \ (Gur et al. 2021)。\n\n在人类中，`cerebellum`将运动冲动从大脑皮层的运动区传递到脊髓；从那里，冲动传递到指定的肌肉群。同时，`cerebellum`接收来自正在激活的肌肉和关节的冲动，并在某种程度上将其与运动皮层发出的指令进行比较，以便进行调整。因此，`cerebellum`既不是运动的唯一启动者，也不是神经冲动链中的简单环节，而是运动指令重路由以及在某些情况下精炼的场所。`cerebellum`的左右半球分别与身体同侧的脊髓神经束连接，并与对侧大脑半球连接。例如，涉及左臂运动的神经冲动起源于右大脑半球，关于运动方向、速度和强度的信息通过`cerebellum`的左半部分反馈回右大脑半球。负责四肢末端运动的神经起源于`cerebellum`的外边缘附近\
  \ (Zhang 2019, Hou & Qi 2022)。\n\n## 1.3 大脑疾病\n\n大脑是人体的控制中心。它调节生长、发育和功能。神经网络将信号传递到脊髓。大脑处理思想、情感，并通过脊髓发出反应。广泛的疾病会影响人的行为、性格和处理信息的能力\
  \ (Jensen al. 2020)。\n\n### 1.3.1 大脑疾病的类型\n\n大脑疾病有很多类型，从损伤、感染到脑肿瘤和痴呆症。结果根据类型和严重程度很大很大。\n\
  \n表 1.1 大脑疾病的总分类\n\n| 类别 | 描述 | 示例 |\n| --- | --- | --- |\n| 神经退行性疾病 | 神经退行性疾病是一个大类，包括神经元失去功能并最终死亡的任何情况。该类涵盖运动障碍（如`Parkinson’s\
  \ disease` 帕金森病）、神经肌肉疾病和大多数类型的痴呆。临床表现取决于首先影响的是哪种神经元，例如`motor neurone disease` 中的运动神经元；`Parkinson’s\
  \ disease` 中`substantia nigra` 黑质质中的神经元 (Shadfar et al. 2022)。 | 运动神经元疾病、肌萎侧索硬化症\
  \ |\n| 痴呆症 | 影响高级皮层功能并导致认知功能丧失到干扰日常生活的神经退行性疾病。它影响记忆、解决问题、语言和其他思维能力 (Compagnoni al.\
  \ 2020)。 | 阿尔茨海默病、额颞叶痴呆、路易体痴 |\n| 运动障碍 | 影响某种程度运动能力的大脑疾病。运动障碍可能损害自主运动（过度活动、运动减少或运动减慢）或引起不自主运动。\
  \ | 帕金森病、肌张力障碍、亨廷舞蹈症 |\n| 神经肌肉疾病 | 影响肌肉、控制肌肉的神经以及神经与肌肉之间通信的疾病。症状取决于疾病的严重程度，范围可涵盖从麻木（涉及感觉神经纤维）到肌肉无力及萎缩（涉及运动神经纤维或肌肉）\
  \ (Bachiller al. 2020)。 | 肌肉营养不良症、周围神经病、夏科-马里-蒂氏病 |\n| 脑肿瘤 | 脑肿瘤可能涉及脑组织的生长，或从身体其他部位扩散到大脑的继性沉积。原发性脑肿瘤可以是良性的，如`meningioma`\
  \ 脑膜瘤和`acoustic neuroma` 听瘤，也可以恶性的，如多种形式的`glioma` 胶质瘤。脑肿瘤有很多类型，其原因和严重程度各异 (Masmudi-Martín\
  \ al. 2021)。 | 胶质瘤、脑膜瘤、听瘤 |\n\n\n\n\n\n| 类别 | 说明 | 示例 |\n| :--- | :--- | :--- |\n\
  | 脑血管疾病 | 影响大脑血流或脑血管的疾病。这些疾病可能导致血栓形成或血管破裂，从而引起脑损伤或中风。 | `Stroke.Aneurysm.Arteriovenous\
  \ malformations (AVM).` |\n| 脑震和创伤性脑损伤 (TBI) | 由外力引起的损伤，如跌倒、车祸、运动损伤或家庭暴力事件。脑损伤的严重程度不等，从脑震（大脑的“挫伤”）到脑出血或昏迷。\
  \ | `Concussion.TBI.` |\n| 癫痫 | 一种长期神经系统疾病，神经元群变为自发性活动，导致发作或“抽搐”。发作会影响意识并引起痉挛或不自主运动\
  \ (Tidball et al. 2020)。 | `Epilepsy.` |\n| 偏头痛和头痛障碍 | 头痛可能是潜在医疗状况的症状，但头痛障碍（或原发性头痛）更常见于没有大脑显著潜在异常变的情况。某些头痛障碍会严重影响人的生活质量\
  \ (Ashina et al. 2021)。 | `Migraine.Tension-type headache.Cluster headache.` |\n\
  | 感染 | 当病毒或细菌进入大脑或脊髓时会发生神经系统感染。脑膜炎是大脑和脊髓外层的感染，而脑炎是大脑本身的感染。 | `Meningitis.Encephalitis.`\
  \ |\n| 炎症性疾病 | 当免疫系统误判并攻击健康细胞时会发生神经炎症性疾病。这发生在枢神经系统的各个部位，包括大脑、脊髓、视神经（例如多发性硬化、横性脊髓炎）、周围神经（格林-巴雷综合征）和神经肌肉接头（例如肌无力症）。\
  \ | `Multiple sclerosis.Transverse myelitis.Guillain-Barré syndrome.` |\n| 儿童神经病\
  \ | 儿童神经病是儿童青少年脑疾病、障碍和损伤。这些情况可能属于其他类别，但对于儿童来说，病因、症状和治疗方法通常不同。 | `Cerebral palsy.Autism.Dyslexia.`\
  \ |\n\n## 1.4 维持健康大脑功能的措施\n\n- 采取健康的生活方式。这包括心脏健康的饮食、规律运动、戒烟、限制酒精摄入和减轻压力 (Erickson\
  \ et al. 2019)。\n- 避免过度接触 X 射线和其他辐射源。\n- 确保你和亲人接种了细菌性脑膜炎疫苗。\n- 了解中风的警告信号并寻求紧急医疗救治。管理慢性健康状况，如高血压、高胆固醇、糖尿病和肥胖\
  \ (Penney et al. 2020)。\n- 防止跌倒、系安全带以及在骑自行车或进行接触运动时佩戴头盔，减少头部损伤的风险。\n- 保持心理和社交活跃。\n\
  \n### 1.4.1 疾病诊断\n\n诊断脑疾病有多种方法，包括：\n\n1. **活检**：你的医疗保健人员收集一小块组织样本进行实验室分析。活检有助于确定脑肿瘤是良性还是恶性。\n\
  2. **诊断测试**：这些包括脑电图 (`EEG`)，用于测量大脑的电活动。诱发电位测试评估神经信号向大脑的传输。\n3. **影像学检查**：`CT`、`MRI`\
  \ 和 `PET` 扫描提供大脑的详细图像。它们可以检测大脑活动和损伤区域。\n4. **实验室检查**：`血液`、`尿液`、粪便有助于医疗保健人员理解可能导致症状的原因。基因检测可以识别导致某些疾病的基因突变。\n\
  5. **心理测试**：患者在纸上或电脑上完成这些测试。医疗保健人员借此评估记忆、思维。\n6. **神经系统检查**：医疗保健人员将检查平衡、协调性和眼球运动\
  \ (Armstrong 2020, Koike 2021, Seng 2020, Tiwari et al. 2020)。\n\n\n- Bazira, P.\
  \ J.. “神经系统概述。” Surgery 39, no. 8 (2021).\n- Brion, L. P., Heyne, R., and Lair,\
  \ C. S. “修正：锌在新生儿生长和大脑发育中的作用：综述与范围性综述。” Pediatric Research 89, no. 7 (2021).\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 2 认知障碍的现状及其诊断\n\nPriya Dev\
  \ 和 Abhishek Pathak\n\n印度瓦拉纳西巴纳纳斯印度大学\n\n\n## 2.1 引言\n\n通过经验、思考和感官进行学习的心理活动或过程被称为认知。它包含了各种高级认知过程和活动，包括语言、计划、推理、判断、感知理解、决策和视觉空间功能。认知过程在利用当前信息的同时，也会产生新信息。\n\
  \n“认知缺陷”一词是一个涵盖性术语，用于描述多个认知领域的受损。人的认知缺陷可能是某些潜在疾病的症状之一；它并不特定于任何一种疾病或状况。此外，“认知障碍”与此术语是可以互换的。它可能是一种暂性的疾病，也可能是正在发展的、长期的疾病。然而，认知障碍作为神经认知障碍的子集，构成了一个更大的类别（DSM-5）。任何严重损害个人认知能力，导致其在不接受治疗的情况下难以在社会中正常生活的状况都被称为认知障碍。与认知下降相关最著名的疾病是阿尔茨海默病。\n\
  \n年龄相关的认知缺陷可能由多种疾病引起，包括中风、谵症、痴呆、抑郁、精神分裂症、长期滥用酒精、脑瘤、维生素缺乏、激素失调以及某些慢性疾病。认知缺陷是阿尔茨海默病、帕金森病、路易体痴呆、亨廷顿舞蹈症、HIV\
  \ 痴呆和朊病毒病等脑部疾病的症状。包括糖皮质激素、抗胆碱能药物、镇静剂和安定剂在药物也与认知缺陷有关。认知异常可能由于头部外伤、脑感染或脑膜感染而发生于任何年龄（[Beloff\
  \ et al. 2001]; [Kalnik et al. 2002]）。\n\n认知缺陷的来源难以预测且记录较少。然而，认知下降的主要因素是衰老。在美国，该状况影响了约\
  \ 500 万人。阿尔茨海默病的发病率随年龄显著增加，从 65 岁之前的低于 1%增加到 85 岁之后的每年 6%（[Mayeux and Stern 2012];\
  \ [Rajan et al. 2019]）。\n\n神经元破坏是认知障碍的主要病理机制。这还包括保护灰质的轴鞘损伤以及灰质本身（包括皮层、丘脑和基底节）。某些区域的损伤会导致功能缺损。例如，顶叶损伤可能导致视觉空间或穿着能力障碍。额叶系统可能导致计划障碍，而颞叶损伤可能导致语言和记忆障碍（[Dhakal\
  \ and Bobrin 2023]）。\n\n因此，我们将介绍几种认知障碍的现状及其诊断。\n\n## 2.2 路易体痴呆\n\n在阿尔茨海默病（AD）之后，路易体痴呆（LBD）是最常见的神经认知性痴呆。临床诊断与病理学诊断之间存在巨大差异。因此，准确识别路易体障碍（DLB）至关重要，因为这些患者需要特定的护理。\n\
  \n### 2.2.1 流行病学\n\n在美国，有 140 万人受 LBD 影响。根据患病率估算，DLB 在社区中的诊断中占 4.2%，在医疗机构中占 7.5%。DLB\
  \ 已被证实贡献了新发痴呆病例的 3.8%（[Jones and O’Brien 2014]）。DLB 最重要的危险因素是年龄。在 75 岁以上的人群中，DLB\
  \ 引起的痴呆病例约占 5%。其发病率为每 10 万人/年 3.5 例（[Marder et al. 2010]）。男性患 DLB 的概率高于女性。\n\n###\
  \ 2.2.2 发病机制\n\n\n\n\n\n脑内 $\\alpha$-突触核蛋白的异常聚集是路易体痴呆（LBD）的特征性特征。路易体和路易神经突起由这些聚集物形成（Walker\
  \ et al. 2015）。LBD 具有复杂的潜在发病机制，会导致神经元储备的增加或减少。这些 $\\alpha$-突触核蛋白的积累会损害神经元的功能，并最终导致其死亡（Taylor\
  \ et al. 2020）。大脑突触前末梢大量表达 $\\alpha$-突触核蛋白，这是一种含有 140 个氨基酸（AA）的蛋白（Cheignon et al.\
  \ 2018; Mehra et al. 2019）。它以未折叠单体的形式存在于细胞质中，但在脂质膜存在时可能会折叠并转化为二聚体和寡聚体，约占胞质蛋白含量的\
  \ 1%。它在胶质细胞中含量较少，在海马体、丘脑和小脑等脑区域的浓度较高。位于 `4q21` 的 `SNCA` 基因负责编码 $\\alpha$-突触核蛋白。除了\
  \ 140-AA 版本外，该蛋白还有两种剪接版本——126-AA 和 112-AA，两者都缺失了第 3 和第 5 号外显子（Šerý et al. 2013）。$\\\
  alpha$-突触核蛋白由三个主要结构域组成，分别为：(1) 亲双性 N 端区域，序列为 `KTKEGV` 并含有 11 个氨基酸重复序列，这对于 $\\alpha$-突触核蛋白四聚化至关重要，并有助于螺旋形成；(2)\
  \ 中央疏水区，包含有助于蛋白聚集的非淀粉蛋白组分区域；以及 (3) 富脯氨酸、酸性的 C 端区域（Mehra et al. 2021）。异常磷酸化、缩短和硝基化的突触蛋白会产生寡聚物，聚聚物形成纤维并被泛素化。它们还表现出异常的溶解性（Meade\
  \ et al. 2019）。这会导致神经元功能障碍或死亡。神经元的丢失会导致严重的多巴胺功能障碍、明显的胆碱能能性疾病以及其他神经递质问题（Caviness\
  \ et al. 2011; Gomperts 2016; Brás et al. 2020）。记忆和学习受产生乙酰胆碱神经元丢失的影响，而睡眠、行为、认知、运动和情绪则受产生多巴胺神经元死亡的影响。LBD\
  \ 的关键诊断标准是这些神经元的破坏以及随后的症状（Siderowf et al. 2018）。\n\n### 2.2.3 临床症状\n\n- 认知能力下降。\n\
  - 认知波动，严重程度足以干扰日常生活或社交活动。\n- 记忆力丧是最常见的症状（57%），其次是视觉幻觉（44%）、抑郁（33%）、步态障碍（28%）和震颤（25%）。\n\
  - LBD 受影响的认知领域包括注意、视觉空间、执行功能和记忆。\n- LBD 的关键诊断标准是这些神经元的破坏以及随后的症状。\n\n### 2.2.4 诊断标准\n\
  \n- 最近的研究导致了 LBD 标准的修正，例如提示性特征和核心临床症状。\n- 目前，通过同时存在提示性生物标志物和核心临床症状来进行 LBD 的诊断。\n\
  - 尽管记忆障碍是 LBD 的特征，但在早期阶段可能不会出现。\n- 帕金森体征和其他神经功能障碍可以构成 LBD 临床图谱的一部分。\n- LBD 影像学有助于医生区分\
  \ LBD 和 AD（阿尔茨海默病），例如：\n    - `SPECT/PET`：显示基底节多巴胺转运体密度降低。\n    - `123 I-MIBG 显像`：导致心肌摄取减少。\n\
  \    - `多导睡眠监测`：针对 LBD 特别独特的 REM 睡眠分析。\n    - `CT/MRI`：无或轻度颞叶萎缩，借此区分 LBD 和 AD。\n\
  \    - `FDG-PET`：检测到中颞叶代谢减低。\n    - `EEG`：检测到优势性的后部慢波活动，伴有周期性 alpha/theta 变化。\n\n\
  ### 2.2.5 挑战\n\n- 根据估计，每三个 LBD 病例中有一个被忽视，而 AD 经常被误诊。\n- LBD 的生物标志物对于提高诊断准确性是必要的。\n\
  - 生物标志物可用性不足、潜在 LBD 诊断利用不足、神经心理筛查不良以及不典型表现的普遍，都是可能增加困难的因素。\n\n## 2.3 急性弥漫性脑脊炎 (ADEM)\n\
  \n中枢神经系统（CNS）的一种急性脱髓鞘疾病被称为 ADEM。全球范围内 ADEM 的报告显示，它在儿科急症中很常见。通常，之前的病毒感染或接种会导致 ADEM\
  \ 的发生。大脑白质、脑干、视神经以及较少见的脊髓均受到 ADEM 的严重累及，该病通常为单相性。\n\n### 2.3.1 流行病学\n\n\n\n\n每年，每百万儿童中就有\
  \ 9.83 例被确诊为首次获得性脱髓综合征伴有临床孤立综合征（66.4%）、急性脱髓性脑脊髓炎（32.0%）和神经脊髓炎（1.6%）（Absoud et al.\
  \ 2013）。根据一项研究，加州 20 岁以下居民的 ADEM 发病率为每年每十万 0.4 例（Leake et al. 2004）。由于包括麻疹在内的多种病毒和细菌疾病的高发病率，ADEM\
  \ 在欠发达和资源匮乏的国家广泛流行（Murthy et al. 1999a；Murthy et al. 1999b）。\n\n## 2.3.2 疾病的病因\n\
  \nADEM 的发生通常伴随着广泛的病毒或细菌疾病，尽管上呼吸道感染是最常见的前驱因素。很难确定导致某些个体患病的特定病原体。在接触麻疹和风疹后，ADEM 的风险会增加。ADEM\
  \ 的一种常见病毒原因是 H1N1 流感病毒（Tenembaum 2013；Wingerchuk and Weinshenker 2013；Noorbakhsh\
  \ et al. 2008）。在流行地区，ADEM 也可以由疟疾和丝线虫引起（Mani et al. 2011；Paliwal et al. 2012）。ADEM\
  \ 的新发病因包括干细胞和异体骨髓移植（Paisiou et al. 2013）。\n\n## 2.3.3 发病机制\n\nADEM 患者可能具有遗传性易感性。韩国的一项研究将主要组织相容性复合体\
  \ II 类等位基因 `HLA-DRB1*1501` 和 `HLA-DRB5*0101` 联系起来。在俄罗斯发现 ADEM 与 `DRB1*01` 和 `DRB1*017`\
  \ 相关。在巴西，`HLA-DQB1*0602`、`DRB1*1501` 和 `DRB1*1503` 等位基因与 ADEM 的遗传易感性强相关（Oh et al.\
  \ 2004；Idrissova et al. 2003；Alves-Leon et al. 2009）。\n\n根据分子模拟假说，某些髓鞘抗原可能与引起 ADEM\
  \ 的病毒上的抗原决定具有具有结构相似性。针对致病细菌产生的抗体与髓鞘抗原发生交叉反应，引发针对神经组织的免疫反应（Pohl-Koppe et al. 1998；Cusick\
  \ et al. 2012；Wucherpfennig and Strominger 1995）。作为另一种观点，炎症级联理论认为，中枢神经系统的神经嗜性病毒感染导致髓鞘自身抗原通过受损的血脑屏释放到血液中。在外周血液循环中，免疫系统对这些自身抗原并启动炎症反应的链反应。在此过程中，会产生自身反应性\
  \ T 细胞克隆。这些 T 细胞穿过血脑屏进入脑实质，导致脑组织损伤（Miller et al. 2001；Richards et al. 2011）。针对髓鞘碱蛋白、脂质蛋白、髓鞘相关少突胶细胞基础蛋白和\
  \ `a-B-crystallin` 的 IgG 自身抗体是 ADEM 的标志物。T 淋巴细胞、富脂巨噬细胞以及较少的中的中粒细胞、嗜酸性细胞或浆细胞浸润构成了\
  \ ADEM 的炎症病变。轴突大部分完整。脱髓病变在疾病后期表现出星形胶细胞增生和胶质质化。ADEM 中的所有脱髓病变通常处于同一阶段，主要影响白质。通常情况下，疫苗相关的神经障碍涉及外周神经系统（Habek\
  \ and Žarković 2011；Young et al. 2010）。\n\n## 2.3.4 临床表现\n\n- ADEM 大多数临床症状为多症状和多灶；\n\
  - 非特异性前驱症状如发热、不适、头痛、恶心和呕吐在实际临床症状之前出现；\n- ADEM 的主要特征是脑病（意识模糊、昏睡、直肢张力和昏迷），在前驱症状出现七天后；\n\
  - 行为变化，如困惑、不耐烦和坐不安；\n- 神经系统异常，如视力丧失、半身不全、共济障碍、膀胱功能障碍和；\n- 儿童特别容易出现共济障碍；\n- 在严重患者，幕凹可能升高颅内压；\n\
  - 外周神经系统偶尔受到影响（Marin and Callen 2013；Garg2003）。\n\n## 2.3.5 诊断评估\n\nMRI 发现包括脑膜刺激、脑脊液（CSF）细胞增多（Young\
  \ et al. 2010）。脑脊液可能显示少量寡克隆性 `IgG` 带，尽管这些带随后可能会消失。多达 25% 的病例可能细胞增多开始。CSF 蛋白水平通常较高但很少超过\
  \ 100 mg/dL。连接小脑、脑干、脊髓和皮层物质的脑梁是病变最常见的地方。壳核是常累的灰质结构。病变可能表现出各种强化情况，包括斑片和云松状、单圆形或环状、开放环状、结节、皱纹、弥散。ADEM\
  \ 中的脱髓病变通常处于同一阶段，大多影响白质（Balasubramanya et al. 2007）。在 ADEM 急性期，病变扩散有限；在亚急性期，存在扩散且乙酰酰氨酸/胆碱比例下降\n\
  \n## 2.4 注意力缺陷多动障碍 (ADHD)\n\nADHD 是最常见的儿童神经发育障碍之一。它通常在青少年时期首次诊断，并持续到成年。患有 ADHD 的儿童可能难以集中、克制冲动行为或行为过度（Jaeschke\
  \ et al. 2021）。根据 DSM-IV，注意力不、多动和冲动是 ADHD 的症状。虽然世界卫生组织（WHO）对该疾病使用不同的术语——多动障碍，但它引用了相似的功能标准。ADHD/HD，正如通常所称，是医学领域最复杂的障碍之一（Goldman\
  \ et al. 1998）。它与受影响者更广泛的负面困难有关，并给家庭和社会带来沉重负担。了解 ADHD/HD 的流行病学可能有助于了解其分布和起源（特别是病因），并为在未来十年内协调内部医疗服务的资金分配提供参考，全球范围内的研究人员在此期间都做出了重大贡献（Bakare\
  \ 2012）。\n\n### 2.4.1 ADHD 的临床亚型\n\n根据特定个体表现出的最显著症状，ADHD 有三种基本形式：\n\n\n\n\n\n* \
  \  **主要注意不注意型**：个体难以控制或克服某项活动。个体经常处于紧张状态，或忘记某些日常生活中的特定事项（Magnin and Maurs 2017）。\n\
  *   **主要冲动-多动型**：个体表现出突然且多话的性格。长时间静止具有挑战性。儿童可能会不停地奔跑、跳跃或爬高。个体在冲动控制方面挣扎，并感到不安。\n\
  *   **混合型**：这是上述两种表现形式的结合或相反形式（Wamulugwa et al. 2017）。\n\n## 2.4.2 症状\n\n不同类型的 ADHD\
  \ 表现出各种症状，其中包括：\n\n*   说话话过多；\n*   抑郁；\n*   睡眠问题；\n*   焦虑；\n*   经常白日做梦；\n*   特定的学习障碍；\n\
  *   在与他人相处方面困难；\n*   多动-冲动。美国儿儿科学会 (AAP) 建议医疗保健人员在各种背景下询问儿童的成长情况，包括在家、学校或与同伴、父母、导师和其他监测儿童的成年人。医生应该检查孩子正在经历何种症状（Faraone\
  \ et al. 2021）。\n\n## 2.4.3 诊断\n\nADHD 障碍在非年龄组中特别流行。这是一种神经发育障碍，其特征是与年龄不符的不注意、多动和冲动。任何受此疾病影响的儿童都会发现难以集中或注意力。这既是遗传问题，也是环境问题。在\
  \ 12 岁以下的早期，通常会对儿童引入。该疾病一些非常有效的症状包括儿童在玩耍和控制行为方面存在困难。\n\n## 2.5 阿尔海默病 (AD)\n\n阿尔尔海默症协会将\
  \ 60–80% 的痴呆病例归类为 AD，这是一种退行性脑疾病。抑郁、困惑、吞咽和行走困难、判断力下降、互动减少和行为变化只是该疾病的特征之一，这些特征会恶化，使得执行日常任务变得更加困难（Alzheimer’s\
  \ Association 2021）。年龄、遗传和性别只是影响这些症状出现持续时间的少数变量示例（Vermunt et al. 2019）。\n\n### 2.5.1\
  \ 流行率\n\n根据目前的估算，到 2060 年，预计有 1380 万 65 岁及以上的美国人患 AD，而 COVID-19 疫情导致死亡人数增加了 16%（Alzheimer’s\
  \ Association 2021）。2021 年 AD 患者及其相关疾病的护理支付总费用（不包括非正式护理）估计为 3550 亿美元。\n\n### 2.5.2\
  \ 发病机制\n\n淀粉样蛋白-β (`Ab`) 和 tau 蛋白的聚集与 AD 的认知逐渐恶化有关（Selkoe and Hardy 2016）。β-分泌酶和\
  \ γ-分泌酶切割淀粉样前体蛋白 (`APP`) 以产生 `Ab`。结果 `Ab` 聚集形成毒性寡聚物，从而损害神经元（Haass and Selkoe 2007）。微管相关蛋白\
  \ tau (`MAPT`) 基因的可变剪接产生 tau，随后将其转换为可溶性蛋白异构体（Goedert et al. 1989）。`Ab` 和 tau 只是影响这些症状连续出现时间的的少数变量。\n\
  \n\n\n\n\n`Janus 激酶/信号转导和转录激活`（`JAK/STAT`）通路提供了一种直接的方法，以确保细胞外信号转换为转录反应。通过将来自细胞因子、激素和生长因子等配体的细胞外信号转移到细胞核，`JAK/STAT`信号系统控制响应细胞因子的基因表达。该通路在控制分化、凋亡、细胞生长和增殖等细胞过程方面广为人知。这些配体与其受体结合并激活`JAK`家族的四个成员：`JAK1`、`JAK2`、`JAK3`\
  \ 和 `Tyk2`（酪氨酸激酶 2）。这将反过来磷酸化 `JAKs` 以及受体。存在七种 `STAT`蛋白：`STAT1`、`STAT2`、`STAT3`、`STAT4`、`STAT5`、`STAT6`\
  \ 和 `STAT7`。结果是 `STAT4`、`STAT5A`、`STAT5B` 和 `STAT6` 被募集到磷酸化的 `JAKs`产生的位点。`STATs`\
  \ 被磷酸化、激活并形成二聚体。二聚化的 `STATs` 进入细胞核，并在那里结合特定的调节区域以控制基因表达（Kisseleva et al. 2002; Rawlings\
  \ et al. 2002）。\n\n活性氧在激活 `JAK/STAT`信号通路中的重要性加强了氧化压力与阿尔茨海默病（AD）病因有关的证据（Simon et\
  \ al. 1998）。此外，已经证明通过控制 `Nrf2` 信号抑制 `JAK/STAT` 通路对 AD 有保护作用（Sharma et al. 2020）。\n\
  \n## 2.5.2.3 FGF7/FRFR2/PI3K/AKT 通路\n\n成纤维细胞生长因子（`FGFs`）家族已知有 22 种配体，这是一个巨大的蛋白家族。它们通过结合高亲和力酪氨酸激酶受体（或\
  \ `FGFRs`）来发挥其细胞和生理作用，包括增殖、血管生成、侵性和迁移。通过磷酸化某些酪氨酸残基，这种相互作用激活了 `FGFR` 的胞内酪氨酸激酶结构域。`PI3K/AKT`信号是\
  \ `FGFR` 激活后耦合的下游细胞内信号通路之一。\n\n在 AD 患者和用 β-淀粉蛋白蛋白（`Ab`）处理的细胞中，`FGF7` 的 mRNA 水平升高。为了进一步支持这一点，实验证明在暴露于\
  \ `Ab` 的细胞中过表达 `FGF7` 与细胞存活和增殖率下降有关。在关于 AD 病因和 AD 实验模型的研究中，发现 `MiRNA` 的表达不同（Samadian\
  \ et al. 2021）。\n\n### 2.5.3 临床症状\n\nAD 的临床症状根据疾病严重程度分为三个阶段。\n\n### 2.5.3.1 轻度阿尔茨海默病症状\n\
  \n轻度 AD 患者可能看起来状况良好，但他们他们在理解周围正在发生的事情方面会变得越来越困难。个人及其家人随着时间的推移经常会意识到某些不对劲。问题可能包括：\n\
  \n* 记忆丧失；\n* 重复询问；\n* 因决策能力差导致决策不当；\n\n### 2.5.3.2 中度阿尔茨海默病\n\nAD 的临床症状进入这一阶段。对于许多配偶和家庭来说，这段需要更多的监测和照顾。一些迹象可能是：\n\
  \n* 遗忘；\n* 无法学习技能；\n* 注意力持续缩短；\n* 混乱增加；\n* 难以正确思考；\n* 语言挑战，以及阅读、写作和处理数字的困难；\n* 幻觉、妄想；\n\
  * 难以适应新环境；\n* 与朋友亲戚交往困难；\n* 冲动行为，例如在不合适的时间或地点换新衣服或使用脏话；\n* 难以完成复杂的家务，如穿衣；\n* 游荡、哭泣、躁和坐立不安，特别是在下午晚晚；\n\
  \n### 2.5.3.3 晚期疾病预警信号\n\n晚期 AD 患者完全依赖他人生活，且无法交流。随着病情恶化，患者可能大部分时间都卧在床上。他们的迹象通常包括：\n\
  \n* 缺乏交流；\n* 缺乏膀胱和肠道控制；\n* 体重减轻；\n* 睡眠增加；\n* 皮肤疾病；\n* 呻吟、翻滚或咯咯；\n* 抽搐；\n* 吞咽困难；\n\
  \n吸入性肺炎是 AD 患者死亡的原因。当人无法正常吞咽时，食物或液体进入肺部而非空气，导致这种肺炎的发生（Iq et al. 2013）。\n\n## 2.6\
  \ 额叶痴呆 (FTD)\n\n行为、执行功能和语言的进行性异常是 FTD 的特征，这是一种微妙的神经退行性临床状况。该病是早发性痴呆的主要原因，是所有年龄组中次于\
  \ AD 和路易体痴呆的第三常见痴呆。\n\n### 2.6.1 流行病学\n\n根据世界卫生组织（WHO）的数据，痴呆人数每 20 年将翻倍，到 2050 年将达到\
  \ 1.154 亿。在大多数研究中，FTD 是第二或第三常见的痴呆亚型，在关于早发性痴呆（患者年龄 65 岁）的 73 篇论文荟分析中，发病率范围 3% 到 26%（Knopman\
  \ and Roberts 2011; Lambert et al. 2014; Hodges et al. 2003）。\n\n### 2.6.2 症状\n\n\
  三种临床类型的 FTD 可能会表现出来，取决于最初局部的变性扩展到额叶和颞叶大部分区域的症状。患者逐渐表现出全球性认知下降、运动障碍（包括帕金森综合征），某些情况下还有运动神经元病。晚期疾病患者在吞咽、移动和进食方面困难。肺炎或其他继发感染通常是死亡原因，死亡通常在症状开始后约八年后发生。三种\
  \ FTD 临床类型包括：\n\n#### 2.6.2.1 行为变型额颞痴呆\n\n\n\n\n\n性格变化、抑制能力丧失和冷漠是行为变型额颞叶痴呆（FTD）最明显的早期症状。行为抑制丧失可能导致不礼貌和不符合社交规范的行为，例如：在不承认他人物理和社交边界的情况下接近陌生人；冲动或粗率的行为，如挥霍性消费；新的犯罪行为，如偷窃、公共场所撒尿、性骚扰或肇事逃逸；以及令人尴尬的个人言论。抑制能力减少往往会导致财务判断不佳，从而引起经济损失。尽管患者可能表现出不当的性评论，但他们通常性欲低下。冷漠可能被误解为抑郁症，因为它表现为对清洁、社交、爱好和工作的兴趣丧失。患者对亲人缺乏怜悯和共情，社交兴趣下降，且对他人感受和需求的接受能力随之降低。患者往往缺乏自我意识，可能无法识别知情者报告的许多变化。某些人的疼痛敏感性降低（Miller\
  \ and Boeve 2016）。\n\n#### 2.6.2.2 原发性进展性非流利性语症\n\n非流利型原发性进展性语症的特征是语法缺失或使用不当，以及语言输出缓慢、费力且断续（无语法症）。包括插入、删除、替换、易位和畸变在内，患者经常产生不一致的言语问题。在疾病早期，书面语言输出和语法理解测试中可以发现轻微的语法错误。尽管口语有明显的困难，但某些人仍能保持写作清晰（Gorno-Tempini\
  \ et al. 2011）。\n\n#### 2.6.2.3 语义变异型原发性痴呆\n\n语义性语症与联合性认知障碍的结合被称为语义痴呆（Neary et al.\
  \ 1998）。杏仁核和前颞叶的早期不对称变性导致了这些症状。词汇困难、词汇理解减少以及对人、地点和对象的命名障碍都是语义的的症状。右颞叶病变表现为行为改变，而左颞叶型则主要表现为语言语义丧失（语义变异型原发性痴呆）（Seeley\
  \ et al. 2005）。患者表现出表面性失语症和写字障碍，其特征是发音或拼写不寻常的单词会被常规化。他们仍保持良好的语法和流利的言语，其他语言领域得到保留，特别是在疾病早期。\n\
  \n当疾病从颞叶进展到眶额叶皮层时，会发生行为改变，如易怒、、情感疏离、失眠以及僵化或选择性饮食（有时集中在一种特定的食物上）。有时也会出现悲伤情绪（Seeley\
  \ et al. 2005）。虽然左颞叶型丧失了语义，但右侧功能（如视觉注意力）偶尔会增强。因此，左颞叶变性的患者更容易获得视觉强迫症，例如需要不断解决拼图、串珠子饰品、收集钱币、园艺、绘画和收集色彩鲜艳的物品。相反，右颞叶变性的患者会经历涉及单词和符号的语言强迫症，例如需要写下电话号码、地址和备注、玩双关语或玩纸牌游戏。\n\
  \n### 2.6.3 诊断\n\n可以使用多种程序辅助 FTD 的诊断。结构 MRI 和 CT 可显示萎缩模式（Rosen et al. 2002）。单光子发射\
  \ CT、功能性 MRI 和氟脱氧葡萄糖 PET 均显示在额叶或颞叶萎缩为主的情况下，存在比例性的灌注不足和代谢低下，以及额岛皮区的萎缩（Le Ber et al.\
  \ 2006）。\n\n部分符合行为变型 FTD 诊断标准的人其疾病进展非常缓慢（超过数十年），伴随认知逐渐下降，且 MRI 和 PET 测试通常正常。这种疾病被称为\
  \ FTD 类拟（FTD phenocopy）。其中一些人患有主要的精神疾病，如双相情感障碍、阿斯伯格综合征或假性疾病（Davies et al. 2006;\
  \ Kipps et al. 2010），而另一些人可能是缓慢的散发型或遗传型 FTD（Khan et al. 2012）。\n\nFTD 的鉴别诊断需要详尽的病史，考虑行为异常的演变、实验室检查、神经影像、家族史以及神经心理学测试的表现。\n\
  \n应考虑炎症性（自身免疫、副肿瘤性）、毒性（重金属、非法物质）或感染性（梅毒、HIV）原因。建议对患者进行阻塞性睡眠呼吸筛选。类似于行为变型 FTD 的痴呆可能由正常压力脑水和低颅内压障碍引起。脑脊液中\
  \ `β-amyloid` 水平低提示阿尔茨海默症，但脑脊液中极高水平 `tau` 可能提示快速进展的痴呆。尽管 AD 和 FTD 的病理学可能共存，但 `β-amyloid`\
  \ 成像很有用，特别是对于年轻患者，可以排除 AD。如果有痴呆、运动异常或精神病症的家族史，可能需要寻求遗传咨询并寻找导致 FTD 的基因。大多数遗传性额颞叶变性病例（约\
  \ 60%）是由 `C9orf72`、`MAPT` 和 `GRN` 基因突变引起的（Le Ber 2013; Goldman et al. 2011）。\n\n\
  几乎所有的额颞叶变性都是由微管相关蛋白 `MAPT`、TAR 结合蛋白分子量 43 kDa (`TDP-43`) 或融合瘤蛋白 (`FUS`) 引起的。额颞叶变性-tau、额颞叶变性-TDP\
  \ 和额颞叶变性-FUS 是相关的亚型。存在若干额颞叶变性病例的包含体仅对泛蛋白阳性、仅对 p62 阳性或不阳性（Mackenzie et al. 2010）。\n\
  \n## 2.7 癫痫\n\n### 2.7.1 流行病学\n\n癫痫是一种可以通过以下任何一点进行区分：至少两次间隔超过 24 小时的非诱发（或反射性）发作；一次非诱发（或反射性）发作，且在未来十年内再次发生两次非诱发发作的复发风险等于一般人群风险（至少\
  \ 60%）；以及癫痫综合症诊断（Fisher et al. 2005; Fisher et al. 2014）。根据 Fiest 等人的荟萃，全球癫痫终身患病率为每\
  \ 1000 人 7.6 例（Fiest et al. 2017）。男性的发病和患病率略高于女性。\n\n### 2.7.2 发病机制\n\n癫痫发作是由电压门控和神经递质门控离子通道引起的，这些通道可能导致神经元电活跃。频繁发作（尤其是状态）会导致氧化应激、神经元死亡（主要在内嗅皮层，这是一个与认知处理直接相关的脑区域）、神经发生、`BDNF`\
  \ 等生长因子的变化以及炎症（Van Rijckevorsel 2006; Holmes 2015）。\n\n\n\n\n\n### 2.7.3 癫痫的认知障碍机制\n\
  \n病因、发作与认知之间存在着复杂的相互作用（Lenck-Santini and Scott 2015）。癫痫活动的解剖剖部位对认知能力有显著影响。在大脑的特定区域，癫痫发作的原病灶与成年后的认知障碍密切相关。癫痫发作的原病灶与成年后认知障碍密切相关的大脑区域包括（Lenck-Santini\
  \ and Scott 2015; Saniya et al. 2017）。因此，颞叶癫痫患者的记忆力最差这并不意外（Bell et al. 2011）。海马体对记忆的发展至关重要。在癫痫发作期间，大脑异常兴奋的阈值是所有脑结构中最低的（Lin\
  \ et al. 2009）。由于存活的金锥细胞形成了异常的海马环路，导致长期、短期和空间记忆均受到损害（Lenck-Santini and Scott 2015）。\n\
  \n当涉及癫痫综合征（如被归类为癫痫脑病的综合征）时，认知障碍在早期发型癫痫患者中通常最为严重（Lenck-Santini and Scott 2015）。“癫痫脑病”一词是指一类严重的癫痫，可能从出生起就存在，导致反复性癫痫发作，以及认知、神经系统和行为障碍，并可能加剧儿童发育问题（Nickels\
  \ and Wirrell 2017）。\n\n此外，遗传因素经常在癫痫脑病的底层病因中起作用。研究人员已在四项独立研究中调查了癫痫认知障碍机制的遗传联系。已发现某些基因包括钠电压门控通道\
  \ α亚基 1（`SCN1A`）（Frank et al. 2006）、γ-氨基丁酸 A 型受体亚基 α1（`GABRA1`）（Macdonald et al.\
  \ 2010）、结节性硬化-1 基因（`TSC1`）（Bateup et al. 2011）以及钾钠激活通道 T 家族成员 1（`KCNT1`）（Imran et\
  \ al. 2019），会导致离子通道故障或皮层发育异常。通过多种过程（包括突触功能异常、神经连接改变、代谢降低和稳态功能受损），这些缺陷会导致某些脑区域的过度兴奋（Staley\
  \ 2015）。\n\n### 2.7.4 认知障碍与癫痫样活动\n\n脑电图（`EEG`）显示出代表癫痫样活动的特征性图谱（锐波、棘波、棘慢复合波）。这种活动可以简单地分为三类：发作期（发作期间）、发作后（发作后）和发间期（两次发作之间）。癫痫样活动通常与记忆丧失、智力低下、行为和交流问题以及注意力缺陷有关（Stafstrom\
  \ and Carmant 2015）。\n\n此外，取决于多种变量，癫痫样活动可能导致短期或长期损害。例如，包括复发次数、严重程度、患者年龄、预防发作使用的药物种类及其效果。发间期癫痫放电可能产生长远后果，随着时间的推移会显著改变认知功能，包括学习和记忆（Landi\
  \ et al. 2019）。此外，θ 波的强度和频率随着发作的重复而降低（Lin et al. 2009; Zhou et al. 2007）。\n\n###\
  \ 2.7.5 症状\n\n- 症状通常可分类为局灶性、泛发性或不明起源性发作（Fisher et al. 2017）。\n- 有多种类型的癫痫发作，可以表现为细微或显著、短暂或持续、频繁或罕见的事件。\n\
  - 它们表现可能从严重的全身性强直阵挛发作到轻微的眼睑抽动或拇指和嘴部的局部麻木（Panayiotopoulos 2010）。\n- 定向障碍通常发生在发作结束且患者恢复意识后。这一时间跨度可能从几分钟到几小时不等。\n\
  - 癫痫患者（`PWE`）有典型症状，包括语言问题、疲劳、行为异常、头痛以及注意力和记忆下降（Kuks and Snoek 2018）。\n- 对于许多人来说，共病带来的压力往往比实际的发痫发作更大。\n\
  - 存在认知和神经心理学问题（Helmstaedter and Witt 2017）。\n- 存在癫痫脑病。\n- 当发作频繁时，空间功能会下降（Lin et\
  \ al. 2009）。\n\n### 2.7.6 诊断\n\n- 脑电图（`EEG`）检查用于评估脑电活动。\n- 使用磁共振成像（`MRI`）扫描大脑以检查血管、肿瘤和感染。\n\
  - 临床症状包括意识丧失、肌肉抽搐、眼神呆、肌肉僵硬、呼吸改变、发作期间尿失或失禁、脸色苍白以及说话或理解困难。\n\n## 2.8 后皮层萎缩\n\nPCA\
  \ 是一种进展性神经退行性疾病，以视觉功能受损为特征。PCA 通常被认为是阿尔茨海默病（AD）的一种异常表现，因为大多数 PCA 患者在尸检中显示出 AD 病理变化。α-突触蛋白病与路易森体痴呆（LBD）、结节性基础变性、朊疾病以及非特异性病理变化的联系已在独立或结合研究中得到确认。\n\
  \n### 2.8.1 临床特征\n\n- 阅读困难\n- 记忆力问题\n- 情境定向障碍\n- 构造性功能障碍\n- 失写/写字困难\n- 识别性视觉无症\n\
  - 视力模糊\n- 命名困难\n- 脸识别无症\n- 衣穿操作障碍\n- 计算困难\n- 肢体操作障碍\n- 左右定向障碍\n- 手指无症\n- 视觉幻觉\n\n\
  ### 2.8.2 诊断\n\n- 计算机断层扫描（`CT`）脑部扫描可见后部萎缩。\n- 通过脱氧葡萄糖（`FDG`）正电子发射层扫描（`PET`）成像可识别枕叶-顶叶代谢降低。\n\
  - 可进行脑脊液（`CSF`）生物标志物检测，检测磷酸化蛋白和淀粉样蛋白 β 42 水平。\n- 核心认知特征（至少三个在早期或出现）包括：失认、左右定向障碍、计算困难、肢体操作障碍（非运动性）、识别性面部无症、失写、同向性视野缺、手指无症、构造性功能障碍、环境无症、眼球运动障碍、衣穿操作障碍、视动失调和手指无症。\n\
  - 非后皮层特征为前向性记忆功能下降（如语言和非视觉语言）。\n\n\n\n\n继阿尔茨海默病（AD）之后，帕金森病（PD）是最常见的神经退行性疾病。黑质神经元丢失导致纹状体多巴胺功能不足，以及神经元内包体中\
  \ α-突触蛋白聚集是 PD 的神经病理学特征。然而，许多过程和通路失调（包括氧化应激、线粒体功能障碍、细胞钙失衡、神经炎症以及神经递质系统的其他缺陷）共同导致了\
  \ PD 的病生理学机制（Zaman et al. 2021）。除了运动缓慢（动作迟）、僵直和静止震颤在内的典型运动特征外，PD 还伴随着广泛的非运动症状，这些症状显著增加了疾病负担。PD\
  \ 最重要的非运动症状之一认知障碍，其发生频率是普通人群的六倍（Aarsland et al. 2001），这对疾病的自然进展至关重要。即使在 PD 早期，认知障碍已被证明对运动症状之外具有重大的经济影响，这使得患者和护理人员共同关注的首要问题。认知下降会负面影响生活质量（QOL）和功能（Leroi\
  \ et al. 2012; Vossius et al. 2011; Chandler et al. 2021）。\n\n## 2.9.1 流行病\n\nPD\
  \ 患者患痴呆的风险是同龄无 PD 人的 2.5–6.0 倍（Aarsland et al. 2001; Perez et al. 2012）。AD 影响了 24–31%\
  \ 的 PD 患者（Aarsland et al. 2005）。对于诊断年龄在 54.0 至 70.2 岁之间的患者，帕金森病痴呆（PDD）的累积患病率在诊断后五年为\
  \ 17%，十年后为 46%，十四后为 83%（Hely et al. 2008; Buter et al. 2008）。此外，PDD 认知功能恶化的速度与 AD\
  \ 相当，许多 PDD 患者将入住养老院，并完全依赖外部的护理和帮助（Aarsland et al. 2004）。\n\n全球范围内，预计 2016 年有 610\
  \ 万人患 PD，高于 1990 年的 250 万，到 2040 年这一数字预计将增加四倍以上（Dorsey et al. 2018）。\n\n## 2.9.2\
  \ 病生理机制\n\n目前有许多不同的理论观点解释与 PD 认知能力相关的组织改变，有证据表明多种退行性过程和机制可能在起作用。\n\n### 2.9.2.1\
  \ 全身性神经递质下降及全脑多巴胺缺乏\n\n根据定义，黑质纹状体通路中多巴胺神经元的中度至重度丢失是所有 PD 患者的特征。与没有认知障碍的 PD 患者相比，帕金森病伴随轻度认知障碍（PD-MCI）患者在纹状体中经历了更广泛的多巴胺末端变性，特别是关联区背侧尾状核的多巴胺末端神经支配缺失（Sasikumar\
  \ and Strafella 2020）。然而，PD-MCI 患者脑中的其他多巴胺系统在某种程度上得到了保留，但 PDD 患者显示出到达额叶、顶叶和颞皮层区域的侧侧多巴胺通路显著丢失（Sasikumar\
  \ and Strafella 2020）。多巴胺在认知功能中可能起重要作用，这一点体现在：健康人群中，皮层多巴胺调节可以改善工作记忆以及视觉空间和注意力处理，并增强认知努力（Ranganath\
  \ and Jacob 2016; Westbrook et al. 2020）。\n\n### 2.9.2.2 交感和去肾上腺素神经系统\n\n蓝脑中合成去肾上腺素的神经元在人体中也会产生黑色素色素作为副产物（Keren\
  \ et al. 2015）。多个认知区域的感觉信号检测和调节（特别是注意、行为灵活性、工作记忆和长期记忆）是由这些神经元介导的，它们也支持清醒和唤醒（Borodovitsyna\
  \ et al. 2017）。额叶皮层和海马体是高去肾上腺素支配的区域，起源于蓝脑，对认知行为至关重要（Borodovitsyna et al. 2017）。PD-MCI\
  \ 的存在与黑色素信号之间存在相关性。\n\n### 2.9.2.3 前脑中的胆碱能系统\n\n新皮层、海马体和杏仁核大部分胆碱能支配来自前脑（Ballinger\
  \ et al. 2016; Pillet et al. 2020）。这些神经元对执行功能具有重要作用，特别是与记忆的功能（Ballinger et al. 2016）。前脑向海马体的胆碱能缺失对应记忆问题和\
  \ PDD 的发生（Pereira et al. 2020; Gargouri et al. 2019）。\n\n## 2.9.3 遗传影响\n\nPD 的风险因素包括\
  \ `SNCA`（编码 α-突触蛋白）、`TMEM175`（编码溶酶体钾通道）和 `GBA`（编码葡萄糖苷酶）突变，分别会导致 α-突触蛋白增加、钾电流减少以及葡萄糖苷酶和溶酶体活性降低（Wang\
  \ et al. 2015）。葡萄糖苷酶的表达、酶活性和 α-突触蛋白的沉积受 `GBA` 中特定核苷酸多态性的影响，该变异与 PD-MCI 和 PDD 相关（Jiang\
  \ et al. 2020）。`APOE 4`编码载脂蛋白 E）等位基因与其他遗传变异一样与疾病进展和认知恶化相关（Tan et al. 2021; Iwaki\
  \ et al. 2019; D’Souza and Rajkumar 2020）。`APOE 4` 等位基因可能使这些人比普通人群更容易随时间积累 β-淀样蛋白（D’Souza\
  \ and Rajkumar 2020）。\n\n## 2.9.4 临床特征\n\n*   **震颤**：震颤即节律性抖通常起始于肢体，通常是手或手指。患者可能会反复摩擦拇指和小指。这被称为丸剂震颤。患者在休息时手可能会颤抖。在执行任务时，震颤可能会减轻。\n\
  *   **运动缓慢（运动迟）**：随着时间推移，PD 可能会导致运动变慢，使简单任务变得困难且耗时。行走时步幅可能变短。从椅子上起来可能很困难。患者行走时可能会拖脚或摩擦地面。\n\
  *   **肌肉僵硬**：肌肉僵硬可能发生在身体任何部位。僵硬的肌肉可能会疼痛并限制活动范围。\n\n\n\n\n*   `姿态和平衡受损`。姿态可能变得驼斜，患者可能因帕金森病（PD）导致跌倒或平衡问题。\n\
  *   `自动运动丧失`。执行无意识运动的能力下降，包括眨眼、微笑或行走时摆臂。\n*   `语言变化`。语言不清晰，患者含糊不清。\n\n### 2.9.5\
  \ 诊断\n\n*   影像学检查：这些检查——如 `MRI`、脑超声和 `PET` 扫描——也可能有助于排除其他疾病。名为单光子发射计算机断层扫描 (`SPECT`)\
  \ 的多巴胺转运体 (`DAT`) 扫描对帕金森病具有特异性。认知能力评估：蒙特利尔认知评估 (`MoCA`)、马蒂斯痴呆评分量表第二版 (`MDRS-2`)\
  \ 和帕金森病认知评分量表 (`PD-CRS`) 根据它们在帕金森病中的临床测量属性，被分类为筛选认知功能的三个量表。\n*   针对工作记忆和注意各个领域；执行能力；语言、记忆和视觉空间技能的神经心理学测试。\n\
  *   神经精神特征：淡漠、抑郁、影像幻觉和精神疾病 (Skorvanek et al. 2018)。\n\n## 2.10 急性弥漫性脑髓炎 (ADEM)\n\
  \n这种被称为 `ADEM` 的中枢神经系统脱髓鞘疾病并不常见，且通常呈单相程。感染后、疫苗接种后和特发性脑髓炎都包含在 `ADEM` 这一术语下 (Johnson\
  \ 1987)。在 `ADEM` 中，可能会出现头痛、发热、恶心和呕吐等症状，可能伴有或没有精神状态改变，且起病迅速。\n\n### 2.10.1 流行病学\n\
  \n`ADEM` 的年发病率范围为每年 10 万中 0.07 至 0.60 人 (Torisu et al. 2010; Pohl et al. 2007; Xiong\
  \ et al. 2014)。亚洲国家认为儿童 `ADEM` 的发病率为每 10 万中 0.47 至 0.64 例 (Torisu et al. 2010; Xiong\
  \ et al. 2014)，相比之下，圣地亚哥和欧洲的发病率为每 10 万中 0.07 至 0.30 例 (Pohl et al. 2007; Leake et\
  \ al. 2004; Gudbjornsson et al. 2015_ 2015)。尽管 `ADEM` 可以发生于任何年龄段，但它通常发生在儿童身上。儿童人口中的男女比例为\
  \ 1.8:1.0，发病中位年龄在五至八岁之间 (Tenembaum et al. 2002)。成年病例发生在 33 至 41 岁之间，两者均不占优势。\n\n\
  ### 2.10.2 病因机制\n\n从病理学角度来看，`ADEM` 的特征是血管周围脱髓鞘、水肿和静脉炎症，以及含有髓蛋白的泡沫样的巨噬细胞 (Esposito\
  \ et al. 2015; Pohl et al. 2016)。可能还存在 `T` 和 `B` 淋巴细胞、浆细胞、小胶质细胞和嗜酸性粒细胞。有时这些融合区域可能作为静脉周围病变出现。脱髓鞘病变中的轴通常不受累，但在\
  \ `ADEM` 中已观察到严重的轴突损伤。脑脊液 (`CSF`) 中中磷酸化微管相关蛋白 (`TAU`) 水平升高是轴突损伤的标志。灰质 (`GM`) 中的胶质结节、血管周坏死、脑膜浸润和血管炎样病变是异常发现的示例\
  \ (Young et al. 2010)。在这种机制外，感染可能导致细胞因子释放和淋巴细胞对髓蛋白抗原的非特异性敏化 (Kothur et al. 2016)。这种事件可能触发\
  \ `T` 细胞耐受的，被称为“旁路激活”。因此，对中枢神经系统 (`CNS`) 的免疫介导损害可能由细胞介导和体液效应途径引起。\n\n### 2.10.3\
  \ 临床症状\n\n*   典型的 `ADEM` 是一种单相疾病，发生在之前的疾病之后，或者较少地发生在疫苗之后。潜伏期可从几天到几个月不等，通常表现为多种神经系统症状突然出现，并经常伴有精神状态急剧下降。\n\
  *   儿童和成年人具有相同的前驱症状，包括头痛、不适、易怒、发热和呕吐。神经系统症状通常在最初表现后两到五天出现 (Pohl et al. 2016)。\n\
  *   行为和/意识的变化严重程度从嗜睡到昏迷不等，都是脑病的一部分。意识障碍影响了 46–73% 的儿童患者和 20–56% 的成年患者 (Marchioni\
  \ et al. 2013)，可能需要重症监护住院 (43%) 或使用机械呼吸 (16%) (Tenembaum et al. 2002)。此外，某些个体可能表现出躁动、定向障碍和幻觉。\n\
  *   局灶神经系统症状。根据受影响的大脑部位，个体可能会出现各种症状。当枕叶受损时，可能会出现同样的视野缺损，如果情况严重且双侧，则可能导致皮层性盲。脑功能的高级缺失如失写症、失认症、失语症和计算困难也可能存在于患者中。当运动皮层受累时，患者可能出现锥体征（即\
  \ `Babinski sign`）、痉挛性肌张力增高和反射亢进。感觉缺失、构觉缺失（或本体觉丧失）以及疼痛和温度感知的下降是感觉症状的示例。脑干受累的患者可能出现脑神经麻痹。以下是最典型的症状：听力下降、味觉和嗅觉敏感度降低、呼吸衰竭、吞咽困难、构音障碍、眩晕、眼震和复视（脑神经麻痹以及视控制中心炎症）\
  \ (Pohl et al. 2016)。当脑干受累时，预后通常较差，爆发性进展的可能性更大 (Tenbaum 2008)。\n*   26–31% 的病例发生脑膜炎，由淋巴细胞浸润脑膜引起。\n\
  \n### 2.10.4 诊断标准\n\n国际儿童多发性硬化研究小组 (`IPMSSG`) 于 2007 年为包括 `ADEM` 在内的儿童获得性中枢神经系统脱髓鞘疾病提供了诊断标准。标准在\
  \ 2013 年进行了修订。然而，`ADEM` 仍然是一种排除性诊断。一旦排除了其他潜在神经系统疾病，必须满足下列所有标准 (Krupp et al. 2013)\
  \ 来确定是否患有 `ADEM`：\n\n1.  由脱髓鞘炎症引起的首次多灶性中枢神经系统发作；\n2.  脑病，其特征为嗜睡或行为改变，无发热、基础疾病或发作后征象；\n\
  3.  急性期（三个月）脑 `MRI` 异常。\n\n\n\n\n\n*   Aarsland, Dag, Julia Zaccai, and Carol Brayne.\
