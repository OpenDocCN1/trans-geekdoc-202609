  \ --- | --- | --- | --- | --- |\n| 11. | 放弃 | | | | |\n\n## 9.7 用于各种生物医学应用的可穿戴微波传感器/天线实际设计中的困境与可能性\n\
  \n\n\n\nMRI 和 CT 扫描等诊断设备目前可用，但它们往往笨重、昂贵，且患者使用起来具有挑战性。为此，需要新的可穿戴和便携式设备，帮助患者在不牺牲舒适度的情况下监测神经退行性疾病。此外，便携式可穿戴设备可以帮助医生在任何方便的时候（无论是在家里还是诊所）评估患者的神经退行性症状。最近的研究将微波雷达技术推向头部成像系统探索的前沿。与其他更传统的诊断方法相比，微波雷达技术具有许多优点，包括低成本、便携性以及无辐射暴露。微波成像可以通过测量人体组织不同的电学特性来区分正常和病理组织。\n\
  \n主要的挑战在于此，因为患者需要佩戴的仪器必须是高效、紧凑、轻量且让患者舒适的。\n\n在图 9.5 中，可穿戴传感器帽被用于捕捉大脑信号（Saeedi et\
  \ al. 2019）。这些传感器可以用于国防应用、紧急情况救援，以及通过实时跟踪汇报当前状况。\n\n![图 9.5 用于监测神经退行性疾病的可穿戴设备图片，显示了\
  \ (a) 正反面，(b) 侧面和 (c) 内部。来源：Saeedi et al. 2019。](img/fig9_5_B.jpg)\n\n图 9.5 用于监测神经退行性疾病的可穿戴设备图片，显示了\
  \ (a) 正反面，(b) 侧面和 (c) 内部。 来源：Saeedi et al. 2019。**\n\n射频天线在微波头部成像系统中起着至关重要的作用。图\
  \ 9.6 展示了实验设置。它由一个矢量网络分析仪 (VNA)、一个带有六个混合硅胶-织物传感器和两个柔性开关电路的可穿戴设备、一台主机 PC 以及一个带有生物仿体的颅骨模型组成，该模型模拟了大脑受神经退行性疾病损伤时的特征（即具有不同程度的大脑萎缩和侧脑室扩大）。\n\
  \n![图 9.6 实验设置。来源：Choudhry et al. (2020)。](img/fig9_6_B.jpg)\n\n图 9.6 实验设置。 来源：Choudhry\
  \ et al. (2020)。**\n\n在这项研究中，中度神经退行性病例与一个患有神经退行性疾病四五年的患者有关，而严重神经退行性病例则与一个患病九到十年的患者有关。图\
  \ 9.7 显示了测量结果与仿真结果对比的反射系数。这种比较显示了对实际设备的良好近似。\n\n![图 9.7 自由空间中传感器的仿真与实测反射系数。来源：数据来自\
  \ Gupta et al., 2016。](img/fig9_7_B.jpg)\n\n图 9.7 自由空间中传感器的仿真与实测反射系数 来源：数据来自 Gupta\
  \ et al., 2016。**\n\n大脑萎缩（也称为总脑容量减少）和侧脑室扩大是必须检测的两大变化，以识别个人大脑是否正在发生神经退行性疾病。人员制作了许多不同尺寸和体积的生物仿体，并将其置于颅骨模型中模拟大脑萎缩的结果。为了仿真，进行了这项操作。除了观察到的大脑变薄，研究还复制了侧脑室扩大的特征。这是通过使用固化的椰油生成不同尺寸的样品实现的，以模拟在侧脑室增大时积聚其中的脑脊液\
  \ (CSF)。\n\n这些样品被用于研究侧脑室扩大对大脑的影响。这样做是为了模拟侧脑室扩大的情况。在 500 到 800 MHz 之间，测得脑脊液的相对介电数处于\
  \ 70.0 到 68.9 之间（Choudhry et al. 2020）。另一方面，固化椰油的相对介电数处于最高水平 364。为了确保固化椰油样品和脑脊液样品具有可比的介电特性，在椰油固化之前加入了盐。混合了约\
  \ 36 毫升盐和 56 毫升椰油，制作出实验中使用的脑脊液仿体。这样做是为了模拟中度神经退行性疾病的影响。\n\n同样地，在严重神经退行性病例中，将 96 毫升盐和\
  \ 150 毫升椰油混合，产生实验中使用的脑脊液仿体。该仿体用于模拟严重神经退行性疾病患者中的脑脊液。使用这种技术是因为它源自 Gupta et al. (2016)的研究。\n\
  \n在那项研究中，作者生成了不同尺寸的脑脊液物体来模拟侧脑室扩大的特征。使用这种方法是因为它基于该研究。尽管制制的脑脊液物体没有准确代表脑脊液的流体性质，但这些样品为侧脑室扩大实验提供了一种方便的方法，以评估传感器和开关电路的性能。这些实验对于确定侧脑室扩大是否成功是必要的。需要此类实验来评估侧脑室扩张是否成功。因此，脑脊液分布在现实生活中也会符合这种复杂的形状，因此测得的\
  \ S 参数将是不同的。大脑侧脑室的真实几何形状比实验使用的球体物体复杂得多。\n\n\n\n已有若干记录在案尝试尝试基于雷达的微波系统对乳腺癌进行早期诊断 (Candefjord\
  \ et al. 2017; Porter et al. 2016; Bond et al. 2003)）。针对实际患者进行的乳腺癌诊断临床试验结果表明，在不遥远的将来，可能可以使用微波技术来补充现有的医学成像系统。该试验目的是进一步了解乳腺癌\
  \ (Preece et al. 2016)。\n\n最近，微波技术也被用于扫描头骨并诊断中风和伤性脑损伤等疾病 (Mobashsher et al. 2014;\
  \ Candefjord et al. 2017; Persson et al. 2014)）。\n\n这项技术的应用较新。与乳房相比，人类头部由于由头骨外的多层组织组成，其生物结构更为复杂\
  \ (Ireland and Bialkowski 2011)。在仿真工具的帮助下，对使用宽带（UWB）微波技术进行头部成像的可行性进行了研究 (Zhang et\
  \ al. 2012)。研究结果在此。假设健康头部产生的散射信号与含有癌细胞的头部产生的信号可以区分开，因为这两组信号之间存在差异。这是因为健康头部不包含任何肿瘤细胞。由于采用了所提的\
  \ Vivaldi 天线发射出的高工作频率范围，电磁波在头部模型中的穿透深度有限。因此，仅能够识别头部边缘附近的肿瘤。\n\n此外，由于采用切换系统，因为天线必须在物理上放置在头部周围才能工作。Mohammed\
  \ et al. (2014) 提供了一种利用利用 UWB Vivaldi 天线进行微波头部成像的中风检测系统。人工头部模型被 16 个 Vivaldi 天线组成的阵列包围，天线与头部模型之间的距离始终保持在半厘米。为了模拟出血性中风的效果，在头部模型内部放置了一个长\
  \ 2 厘米、宽 1 厘米、厚半厘米的椭圆体目标。\n\n图 9.8 显示所提方法成功揭示了目标中风的位置。它还展示了微控系统中的连接。利用 RF 同轴电缆在设备之间接收和发送信号以实现实时传输。\n\
  \n![图 9.8 所提射频切换系统的示意图。采用自：Mohammed et al., 2014.](img/fig9_8_B.jpg)\n\n图 9.8 所提射频切换系统的示意图。\
  \ 取自：Mohammed et al., 2014。\n\n为了开发一种可穿戴头部成像系统，必须为天线阵列（传感器）设计一种紧凑且轻量化的 RF 切换电路，并且必须使用市场上易于购买的慢性阿片类药物治疗（COTS）组件。我们决定采用\
  \ Analog Device 的 1P8T 开关 `HMC321LP4E` 和 1P4T 开关 `HMC241ALP3E` 评估板，它们分别由 Alizadeh\
  \ Meghrazi et al. (2020) 和 Choudhry et al. (2020) 设计，用于我们的单片微波集成电路（MMIC）1P8T 开关和\
  \ 1P4T 开关。这些开关提供了从 DC 到 1 GHz 的宽工作频率范围。\n\n\n\n在测量过程中，吸收器安装在天线上以抑制后瓣效应。其目的是防止系统拾取任何不需要的背景噪声。图\
  \ 9.11 显示，距离球形目标最近的三天线（`Antenna1`、`Antenna2` 和 `Antenna3`）的反射系数值在健康和不健康头部之间存在差异，这证实了\
  \ Mobashsher and Abbosh (2016)中报道的发现。\n\n![图 9.11 (a) 健康人的头部；(b) 未连接开关电路的患者头部；以及(c)\
  \ 带有开关电路的头部——虚线黑圈标出了 Mobashsher and Abbosh (2016) 报道地图上血点的精确位置。](img/fig9_11_B.jpg)\n\
  \n图 9.11 (a) 健康人的头部；(b) 未连接开关电路的患者头部；以及(c) 带有开关电路的头部——虚线黑圈标出了 Mobashsher and Abbosh\
  \ (2016) 报道地图上血点的精确位置。\n\n图 9.11 展示了健康个体以及患者的头部。这里还显示了另一张未使用开关电路制作的中风头部。这张图也被制作了，其目的是与不包含\
  \ RF 开关电路的系统进行比较。两幅图像表明中风在大脑中被精确识别并定位。这表明所提出的 RF 开关电路性能与不带开关电路的系统相当。可以通过增加使用的天线数量来提高成像系统的分辨率和精度；但这将需要使用更大型的可穿戴设备以容纳额外的天线，并且增加数据采集过程所需。\n\
  \n最具前景的特征（用于柔性天线的聚合物）也正引入柔性电子领域，用于生物医学检测（Sangeeta et al. 2022；Yempally et al. 2022；Yempally\
  \ et al. 2021）。Sangeeta et al. (2022) 的的最重要发现（与柔性天线柔性材料，特别是聚合物的选择有关）是聚合物是最佳选择。该应用用于识别生物信号，即用于患者监测。作为物联网系统的一个组件，在发现柔性传感器和天线设计方面存在大量机会，用于早期检测并显著改善患者的生活。\n\
  \n## 9.8 结论\n\n用于存储、处理、生产和管理健康相关数据的集中式 IT 系统时代正让位于患者与护理人员或医生之间进行分布式数据共享的新模型过渡时期，而可穿戴设备正在协助这一转型。其次，来自可穿戴设备和物联网的数据可能用于教育人工智能，以做出更准确的自动诊断和开发更有效的药物。可穿戴计算能够将分散的数据整合到个性化医疗系统中。鼓励更新健康数据并采取预防措施。可穿戴技术和数字健康医疗在改善健康的同时推动技术进步具有巨大前景。本章概述了为帮助阿尔茨海默病（AD）患者而创建的可穿戴设备。文中详细描述了柔性电子传感器和天线的各种应用。这项广泛研究的主要要点是设计一种舒适且轻量的系统来检测特定信号。此类柔性系统和天线的生物医学应用主要通过效率、舒适度、重量和辐射损耗等指标进行研究。可穿戴计算正在数字健康领域发生巨大的范式转移，目标是帮助\
  \ AD 患者的尖端解决方案。同样，应考虑其形状、尺寸和易用性。\n\n## 参考文献\n\n-   Alizadeh Meghrazi, M. et al.\
