  \ Conference (LAPC)*, Loughborough.\n\n# 10 使用超声波和红外光谱传感器进行阿尔茨海默症的预测与维护\n\nSasi\
  \ Smitha 和 B. V. Srividya\n\n\n\n\n\n印度，班加罗尔，达亚南德萨格尔工程学院\n\nDOI: [10.1201/9781003245346-10](https://dx.doi.org/10.1201/9781003245346-10)\n\
  \n## 10.1 引言\n\n尽管研究对阿尔茨海默病（AD）细胞病理学的理解不断加深，但治疗方面的进展仍然微小，因为其征兆和症状是逐渐出现的，掩盖了持续的恶化，直到做出诊断。临床痴呆测试利用神经学、认知和成像数据对可能性的\
  \ AD 或阿尔茨海默型老年性痴呆进行诊断。在这种情况下，确诊 AD 的唯一方法是对脑组织进行死后神经病理学分析（Gupta et al. 2018）。\n\n\
  正电子发射断层（PET）和磁共振成像（MRI）从根本上改变了 AD 的研究和医学诊断方法（Gupta et al. 2018）。可以创建准确反映 AD 神经病理学特征的高质量图像，例如\
  \ PET 中的神经纤维蛋白缠结和淀粉样蛋白斑块，以及 MRI 中指示 AD 进展性神经退行性的大脑皮层萎缩。内源性 CEST MRI 的测量不能替代酸性 CEST\
  \ MRI 的 `pHe` 测量。虽然内源性 CEST MRI 在评估某些特定病变方面可能仍具有很好的用途，但在根据 `pHe` 值评估病变时，外源性酸性 CEST\
  \ MRI 更合适。可以使用 FDG-PET 和 BOLD-MRI 分别评估包括区域血红蛋白氧合和葡萄糖摄取在动态 AD 过程（Sendra et al. 2018）。\n\
  \n## 10.2 使用红外分析传感器检测 AD\n\n### 10.2.1 红外光谱传感器\n\n分子与红外光相互作用的研究被称为红外光谱法。这可以通过三种不同的方式通过吸收、发射和反射测量来观察（Xu\
  \ et al. 2001）。\n\n一种寻找脑组织结构和成分变化的非侵入技术可以使早期干预结果的识别和评估成为可能。这可能会显著加速药物和预防措施的产生。特别是近红外光谱，对于探测深层组织可能很有益。光学光谱可以非侵入地捕获化学和结构信息（Varatharajan\
  \ et al. 2018）。由于这些波长仅被弱吸收且前向散射严重，近红外光必须穿过几厘米组织才能从头皮表面到达大脑。我们正在构建的临床光谱仪系统用于收集 650\
  \ 到 1050 nm 之间的散射光谱（Chong et al. 2017）。光导纤维制造具有光纤组件，即两个具有内部设计和制造工艺的光纤探头。\n\n使用特别特制的间距模板和弹性头带将光纤置在受试者的太阳穴区域。使用连续波钨卤素光源作为光源探头（单光纤、低羟、600\
  \ mm 芯，NA = 0.22）提供近红外光。探测器探头用于在不同的源-探测器距离（10–30 mm，以 5 mm 为间隔）收集散射光，并将其发送到连接冷却至\
  \ −50 °C 的电荷耦合器件（CCD）探测器的成像光谱仪上（Chong et al. 2017）。\n\n在过去的 20 年里，被称为功能近红外光谱（fNIRS）的光学成像方法在神经成像领域得到越来越多的应用。它使用两种不同波长的近红外激光（600\
  \ 到 1000 nm 之间），测量与皮层外层神经元代谢活动相关的氧血红蛋白（HbO）和脱氧血红蛋白（HbR）浓度变化。先前的研究表明，fMRI 产生的血氧水平依赖（BOLD）响应与\
  \ fNIRS 评估的血流动力学响应之间存在强关联，使得这两种模式大致等效（Agüera-Ortiz et al. 2017）。\n\n然而，fNIRS 比 fMRI\
  \ 和 PET 具有许多优势，包括非侵入性、更高的时间分辨率、高度便携性、成本更低、不易运动伪影影响、无电离辐射以及在测量期间对受试者的压力较小（Ishii et\
  \ al. 2016）。通过监测脑血流动力学响应，fNIRS 还提供了功能成像。由于这些优势，fNIRS 可在临床环境中用于对 AD 患者进行快速、非侵入性诊断或治疗监测（Ruiz-Rizzo\
  \ et al. 2017）。\n\n### 10.2.2 数字语音跨度任务\n\n为了尽量减少环境干扰，所有研究都在一个小空间内进行。建议受试者在开始实验任务前闭眼睛放松三分钟。在此期间，进行了基线\
  \ fNIRS 测量。之后，受试者接受了由 30 个区块组成的数字语音跨度任务（DVST），所示 `图 10.1(a)`。每个区块都从编码任务开始，要求受试者记忆显示在前方\
  \ 1.5 米处电脑屏幕上一系列数字，所示 `图 10.1(b)`。\n\n数字序列长度从四到六位不等，数字为 1 到 9，显示十秒钟。编码后有十秒钟的休息时间，期间指示患者保持冷静。之后，要求参与者口头回忆数字，并记录其反应以评估性能（Atkinson\
  \ et al. 2015）。所有 30 个序列在实验期间随机给受试者，以减少受试者预期效应。实验开始前向参与者详细说明了任务，并提供了足够的时间进行练习，使每个人熟悉方法。\n\
  \n### 10.2.3 fNIRS 配置\n\n本研究使用了多通道 NIRScout 系统（NIRx Medizintechnik GmbH，德国），包含 15\
  \ 个发射器和 16 个探测器，采样率为 3.91 Hz，用于测量 fNIRS 信号。分别在 760 nm 和 850 nm 处识别氧血红蛋白和脱氧血红蛋白。光极间距根据全球\
  \ 10-20 电脑图（EEG）放置方案设定为 3 cm，总共 46 个测量通道均匀分布在前额区和双侧顶区，所示 `图 10.2(a)`。使用塑料衬圈和固定架将所有发射器和探测器固定在弹性帽上，以确保光极与受试者的头骨充分接触。如图\
  \ 10.2 所示，用一对发射器-探测器对来描述一个 fNIRS 通道，所示 `图 10.2(b)`。\n\n\n\n\n\n![图 10.2 (a) 通道与\
  \ fNIRS 光探测器的布局。紫色线条和数字定义了 fNIRS 通道，红色圆圈表示发射器，绿色圆形表示探测器。全球通 10-20 EEG 布置位置由圆内部的标签标识。额叶区域\
  \ 1–20 通道，左顶叶区域 21–33 通道，右顶叶区域 34–46 通道。(b) 使用 nirsLAB 的发射器（红点）和探测器（黄点）的常用 3D 头部模型示例（NIRx\
  \ Medizintechnik GmbH, 德国）。](img/fig10_2_B.jpg)\n\n图 10.2 (a) 通道与 fNIRS 光探测器的布局。紫色线条和数字定义了\
  \ fNIRS 通道，红色圆圈表示发射器，绿色圆形表示探测器。全球通 10-20 EEG 布置位置由圆内部的标签标识。额叶区域 1–20 通道，左顶叶区域 21–33\
  \ 通道，右顶叶区域 34–46 通道。(b) 使用 nirsLAB 的发射器（红点）和探测器（黄点）的常用 3D 头部模型示例（NIRx Medizintechnik\
  \ GmbH, 德国）。\n\n### 10.2.4 数据预处理\n\n使用 `MATLAB` 分别对每个受试者的 fNIRS 数据进行分析和检查。对每个 fNIRS\
  \ 通道均进行了视觉检查，将具有显著尖峰的通道标记为“噪声”并在后续研究中予以忽略。为了减少 fNIRS 数据中的呼吸（0.2–0.3 Hz）和心脏干扰等伪影的干扰，在处理过程中使用了截止频率为\
  \ 0.01–0.20 Hz 的四阶巴特沃斯带通滤波器（0.8 Hz）。当使用修正的比尔-朗伯定律计算血红蛋白浓度差异时，高波长（850 nm）和低波长（760\
  \ nm）的差分路径长度因子分别为 6.38 和 7.15（`HbO` 和 `HbR`）。\n\n这是由于 `HbO` 信号与 fMRI BOLD 响应有更强的联系，与\
  \ `HbR` 相比，它被认为是与任务相关的变化的更可靠、更敏感的 fNIRS 参数。此外，在相关的衰老研究中，`HbO` 被描述为定义衰老效应更佳的标记。\n\
  \n对于每个清洗后的 fNIRS 通道，每个数据块的 `HbO` 信号被分为 30 次试验，从编码任务开始，每次间隔 20 秒。随后，通过对所有分段的 `HbO`\
  \ 信号取平均值，获得每个通道和每个受试者的总平均 `HbO` 信号。这些平均 `HbO` 信号被用于进一步的研究。\n\n### 10.2.5 数据分析\n\n\
  大脑的额叶、左顶叶和右顶叶区域在本研究中受到关注，是因为之前的工作在轻度认知障碍（MCI）/阿尔茨海默病（AD）组中取得了显著结果。因此，研究人员手动将预定数量的\
  \ fNIRS 通道分配给相关位置，如图图 10.2 所示。这些活动通道选择策略（包括在其他研究中应用的 `t` 值法和基于幅值的方法）在本研究中是无效的，因为四组的异常血流动力学响应与标准的血流动力学响应不同。\n\
  \n为了为每个每个区域（`ROI`）获得单一且代表性的 `HbO` 信号，本研究平均了同一区域内所有清洗后 fNIRS 通道的 `HbO` 信号。根据预处理结果，为四组中的每组计算两个参数：`HbO`\
  \ 的平均变化（`MHbO`）和 `HbO` 变化的斜率（`SPHbO`）。之前的的研究表明，`HbO` 的变化通常对应于代谢活动的变化，这与其功能活动有关，并可能需要\
  \ 10 秒才能达到显著的激活水平。\n\n采用 3–12 秒的时间帧来计算大脑每个区域的 `MHbO`。另一方面，`SPHbO` 被描述为 `HbO` 信号变化的线性速率，使其在任务开始后的\
  \ 10 秒内达到峰值或最低值。它展示了大脑特定部分对任务的反应。在执行简单的线性回归以计算任务开始与观测到的峰值之间的斜率之前，研究人员首先确定了 `HbO`\
  \ 信号绝对值达到峰值的时间。然后，将每个 `ROI` 中的线性回归系数确定为 `SPHbO`。\n\n### 10.2.6 统计分析\n\n通过考虑带有 Bonferroni–Holm\
  \ 多重比较调整的双样本 t 检验，比较了四组之间的精神状态检查（`MMSE`）得分和任务表现（总共六次比较）。使用每个受试者能够回想的准确序列数量（最多 30\
  \ 个）来评估其任务表现。\n\n简而言之，使用双样本 t 检验对任意两组进行比较，产生所有比较的 p 值。然后进行多重比较 Bonferroni–Holm 校正。第\
  \ `i` 次比较的调整后 p 值通过首先将所有 `p` 值从低到高排序（`i = 1, 2, ...`）来确定，其中 `ptarget` 是测试中的目标显著性水平，设定为\
  \ 0.05，且 `n` 表示研究中比较的总数。如果 `pi` 小于 `p`，\n\n(10.1)\n```\n\\frac{d²R}{dt²} = \\frac{3P_{0}}{\\\
  rho R} + \\frac{3\\sigma}{4\\pi R^{2}}\n```\n\n由于半径的微小变化，方程 10.1 可以写为\n\n(10.2)\n\
  ```\n\\frac{d²R}{dt²} = \\frac{3P_{0}}{\\rho}\\left( \\frac{1}{R_{0}} - \\frac{R\
  \ - R_{0}}{R_{0}^{2}} \\right) + \\frac{3\\sigma}{4\\pi}\\left( \\frac{1}{R^{2}}\
  \ - \\frac{2(R - R_{0})}{R_{0}^{2}} \\right)\n```\n\n或者\n\n(10.3)\n```\n\\frac{d²R}{dt²}\
  \ = - \\left( \\frac{3P_{0}}{\\rho R_{0}^{2}} + \\frac{3\\sigma}{2\\pi R_{0}^{3}}\
  \ \\right)R + \\left( \\frac{6P_{0}}{\\rho R_{0}} + \\frac{9\\sigma}{4\\pi R_{0}^{2}}\
  \ \\right)\n```\n\n因此空穴振动的自然频率为\n\n(10.4)\n```\nf_{0} = \\frac{1}{2\\pi R_{0}}\\\
  sqrt{\\frac{3P_{0}}{\\rho} + \\frac{3\\sigma}{4\\pi R_{0}}}\n```\n\n每个脑区域的 `MHbO`\
  \ 和 `SPHbO` 是同样通过双样本 t 检验（带有 Bonferroni–Holm 多重比较调整）评估的 fNIRS 衍生索引（四组，六次比较）。最后，计算了\
  \ `MMSE` 得分与 fNIRS 衍生索引之间的 Pearson 相关系数，显著性水平为 0.05，以评估血流动力学信号与临床评分之间的关系。\n\n预测性维护计划需要传感器数据才能有效工作。`IoT`\
  \ 传感器收集各种机器特征的数据，例如温度、压力和声音。在单个图像或跨多个视图中比较设备之间的温度差异时，专门使用了红外传感器。传感器利用红外辐射（`IR`）检测许多资产、部件的当前或即将发生的问题。传感器通过测量肉眼不可见的辐射波长变化的强度来确定元素的温度。\n\
  \n\n\n\n\n`IR`（红外）传感器是一种通过产生光来识别近距离物品的技术。`IR` 传感器在追踪物体温度的同时，还可能检测运动。通常情况下，所有物体都会发出某种形式的红外热辐射。尽管人眼无法察觉这些辐射，但红外传感器可以检测到这些辐射（Szczésniak\
  \ and Rymaszewska, 2016）。\n\n发射器仅为 `IR` LED，探测器仅为 `IR` 光二极管（发光二极管）。`LED`与`光二极管`之间最重要的区别在于它们的工作方式。`LED`将电能转换为光，而`光二极管`将光能转换为电能。`光二极管`可以吸收与`IR`\
  \ LED 发出的相同波长的红外光。当`IR` 光照射在`光二极管`上，电阻和输出电压将与接收到的`IR` 光量成比例变化。典型红外检测系统的五个基本要素是：红外源、传输通道、光学元件、红外探测器或接收器以及信号处理。红外激光和特定波长的`LEDs`是红外源的示例。三种常见的红外传输介质是真空、大气和光纤（Teipel\
  \ et al. 2015）。\n\n## 10.3 利用 AR/虚拟现实进行认知评估的 AD 早期诊断方法\n\n多种认知功能的退化是痴呆综合症的标志。其影响包括高死亡率，以及在患者护理、测试和治疗方面的巨额费用。虽然目前尚无痴呆症的治愈方法，但获得快速诊断可以帮助患者获得必要的护理、药物，并在可能的范围内继续参与智力、社交和身体活动。早期检测\
  \ AD 被认为可以显著提高患者及其家属的生活质量。虚拟现实（`VR`）是一种新兴方法，专门用于在在虚拟世界中导航时测试认知能力（Parsons 2015）。\n\
  \n除了侵入性/非侵入性划分外，认知测试和非认知测试也可用于识别 `AD`（Cruz-Oliver et al. 2014）。用于评估患者智力的技术被称为认知测试，它们是非侵入性的且易于使用的。相反，非认知测试包含了所有用于识别和诊断痴呆症的额外技术（Cordell\
  \ et al. 2013）。\n\n许多非侵入性非认知技术用于检测早期阶段的 `AD`（Muessig et al. 2013）。\n\n### 10.3.1\
  \ 神经成像技术\n\n计算机断层扫描（`CT`）或磁共振成像（`MRI`）等神经成像技术用于检测患者大脑中与疾病相关的变化。通过机器学习技术，将患者的头部 `MRI`\
  \ 数据与患 `AD` 患者的数据进行比较（Unay and Ekin 2011）。\n\n`AD` 患者体内存在白质和灰质变化。研究通过研究发现，双侧胼脑和内囊损伤与思维障碍（`DT`）之间存在联系。此外，研究人员声称右脑损伤与冷漠之间存在联系，将后者与右半球在启动行为和观察环境中的作用联系起来（Campbell\
  \ et al. 2009）。\n\n然而，由于成本、时间以及过程中的不适性，这些方法不适用于测试人群。此外，获取这些图像通常需要使用并非总是可用的医疗设备（且具有幽闭恐惧症）。这些方法不适用于大规模人群的测试方法，如图\
  \ 10.3 所示（Campbell et al. 2009）。\n\n![图 10.3 随机化的深层特征来自 ResNet18 和 DenseNet12 网络用于\
  \ AD 诊断](img/fig10_3)\n\n图 10.3 随机化的深层特征来自 ResNet18 和 DenseNet12 网络用于 AD\n\n\n\n\
  \n\n情绪分析是与行为相关的辅助方法之一。相反，其他方法则检查患者对特定刺激的反应。由于情绪识别在包括神经科学和心理学在内的多个领域的重要性，研究人员已经开发了许多用于识别人类情绪的方法。目前已有多种建议尝试使用各种数据（包括\
  \ `EEG`、眼动追踪、音频或面部手势）来分析这些反应或情绪。在会导致面部表情缺失的痴呆症病例（例如路易体痴呆症），面部表情分析是不可能的（Atkinson\
  \ et al. 2002）。\n\n### 10.3.4 阿茨海默病（AD）诊断的评估技术与指标\n\n本节讨论了各种 AD 诊断评估方法和指标。研究发现，基于评分和阈值的方法以及基于机器学习分类的方法是评估受试者障碍的两种主要策略（Lindeboom\
  \ et al. 2002）。\n\n### 10.3.5 用于 AD 诊断的机器学习技术\n\n机器学习作为人工智能的一个分支，其目标是提供让机器学习的方法。为了预测对新输入变量的反应，机器学习试图识别输入变量与相关响应之间的关系（Ter\
  \ Haar 2001）。\n\n各种方法使用的分类技术可以根据要识别的标签数量归类为三类：单类分类、二分类和多分类。大多数对海量数据进行 AD 检测的方法都使用了这些技术。其中两种是\
  \ MRI（核磁共振）和行为/传感器技术（Fountoulakis et al. 2000）。\n\n#### 10.3.5.1 二分类/多分类\n\n分类最常用的两种分类类型是二分类和多分类。二分类问题（即将数据划分为两类）最容易解决。在二分类分类器中，`SVM`\
  \ 是最常用的之一（Rösler et al. 2000）。\n\n多分类问题需要将提供的数据分离为两个以上以上的类别。可以使用多分类分类器或多个二分类分类器来解决这个问题。凭借\
  \ 92% 的准确率，`SVM` 分类器可以利用 MRI 信息区分 AD 患者和健康个体。来自 AD 和健康参与者的步态数据使用 `DTW`、`SVM` 和 `kNN`\
  \ 二分类分类器进行了分类。在阅读文本段落时，使用 `naive Bayes` 分类器利用包括视线长度、扫视振幅和总注视次数在内的变量来区分健康患者和 MCI（轻度认知障碍）患者。为了识别\
  \ MRI 扫描与 AD 潜在解释性变量之间的相关性，引入了通用线性模型（Loomis et al. 1999）。\n\n#### 10.3.5.2 单类分类\n\
  \n单类分类（`OCC`）旨在数据极不平衡时（训练数据主要来自某一类），隔离出一类项目并将其与其他项目区分开。此类数据被用作正样本。也可能来自其他类的数据，但由于伦理和财务原因，获取这些数据可能困难（Wang\
  \ et al. 1999）。\n\n密度估计技术属于第一类。这些需要大量的训练数据，并且对训练数据中的离群值不敏感。基于聚类的技术是第二类的重点。这些技术对离群值具有鲁棒性并考虑了数据的结构，但它们需要数据来代表整个类别。第三类是最后一种，定义了目标类别与其他类别之间的边界。后者收集的所有\
  \ `OCC` 仅使用正样本数据进行训练，而前者则将离群值添加到模型中。当类别重叠时，后者通常更实用（Sun and Hynynen 1998）。\n\n由于某些情况下病例有限，将\
  \ `OCC` 和多分类分类器用于声学输入以早期检测 AD 是困难的（Kohonen 1984）。\n\n言语症（说话和理解能力障碍）和情绪反应问题是阿尔茨海默症的相关症状。产生了一个名为\
  \ `AZTIAHO` 的数据库，由 50 名健康和 20 名 AD 参与者的视频数据。多分类分类器和 `OCC` 都采用多层感知器（`MLP`）。虽然多分类分类器对两个类别，但\
  \ `OCC` 生成的模型代表健康组。结果显示，当 AD 数据较少时，`OCC` 的性能优于多分类（Fry and Barger 1978）。\n\n使用 `OCC`\
  \ 主要目标是通过检测日常生活中的错误来帮助痴呆症。为了帮助患者和护理人员处理日常生活，他们建议使用 `OCC` 分类器以及放置在房屋内的传感器信息。由于很难指定活动期间可能发生的所有问题，研究人员使用成功完成活动未犯任何错误的参与者数据来训练\
  \ `OCC`。\n\n\n\n\n声波在生物医学研究中的主要和次要应用领域分别是诊断成像和治疗。应用声波的功率、强度和间隔时间在这些领域之间各不相同。控制声波传输的底层物理原理在两种情况下是相同的（Van\
  \ den Stock et al. 2015）。本文介绍了来自无颅骨大脑的理论和实验发现。声波很难穿过颅骨进入大脑。在一项新技术中，通过切除一小部分颅骨制造了一个声学“窗户”。根据脑病变的流行情况，近期研究提出了一种潜在的阿尔茨海默症治疗方法（Mitchell\
  \ 2017）。\n\n### 10.4.1 阿尔茨海默症物理症状对大脑萎缩的依赖性\n\n图 10.4(a) 展示了大脑萎缩，这是阿尔茨海默病（AD）的关键症状之一，也是许多问题的根源。大脑萎缩产生了不利影响（如图\
  \ 10.4(b)所示）。研究人员提到了两个现象以加强我们对它们的理解。第一个现象与尺寸测量有关。分析物体的比例是大脑结构的应用。例如，图 10.5 显示了两个指尖的几个传感器（1、2、3\
  \ 和 4），它们能向大脑传输有关物体的信息，并根据运动时间接收大脑的信号。两个手指可以移动物体，大脑接收手指记录的信息（Yang et al. 2016）。\n\
  \n![图 10.4 (a) 正常大脑的横截面；(b) 患阿尔茨海默症。](img/fig10_4_B.jpg)\n\n图 10.4 (a) 正常大脑的横截面；(b)\
  \ 患阿尔茨海默症。\n\n![图 10.5 大脑与根据运动时间检测物体的手指传感器是相关的。白圆（关闭）代表未接收信号，黑圆（开启）代表接收到信号。](img/fig10_5_B.jpg)\n\
  \n图 10.5 大脑与根据运动时间检测物体的手指传感器是相关的。白圆（关闭）代表未接收信号，黑圆（开启）代表接收到信号。\n\n当物体移动时，圆 1 和 2\
  \ 首先开启，然后随着时间推移，圆 1 关闭，圆 2 和 3 开启，以此此类推，如图 10.5 所示。因此，大脑识别出物体的尺寸和速度。然而，如图 10.3 所示，当两个手指交叉时，大脑无法准确识别物体。当白圆\
  \ 1 和 4 开启而 2 和 3 关闭时，大脑将其解释为存在两个物体。\n\n这个神奇的实验证明，如果相邻的圆圈开启，大脑将识别物体的尺寸。因此，如图 10.6\
  \ 所示，随着大脑变小，圆圈也变小，由于物体的信号干扰，更多的圆圈开启。从健康大脑和晚期阿尔茨海默症大脑接收的信息如图 10.7 所示。\n\n![图 10.6\
  \ 交叉手指和大脑接收到的信号。](img/fig10_6_B.jpg)\n\n图 10.6 交叉手指和大脑接收到的信号。\n\n![图 10.7 从健康大脑和晚期阿尔茨海默症大脑接收的信息。](img/fig10_7_B.jpg)\n\
  \n图 10.7 从健康大脑和晚期阿尔茨海默症大脑接收的信息。\n\n大脑在这种情况下将该物体解释为更大（Ishii et al. 2016）。阿尔茨海默症患者在大脑萎缩时会出现距离感知误差。记忆扰乱是第二个现象。人类大脑中有\
  \ 1011 个神经元细胞，它们通过电通信。一个或两个作为输出的轴突和作为电信号输入的许多树突形成了每个神经元（Ruiz-Rizzo et al. 2017）。为了激活，神经元需要从所有树突积累的特定水平的信号输入。一旦激活，神经元就会放电并通过其轴突向相邻神经元传递信号（Allen\
  \ 2017）。\n\n连接的权重和上方神经元的值决定了该层中每个神经元的值（Mitchell 2017）。\n\n\n\n\n*   Agüera-Ortiz,\
