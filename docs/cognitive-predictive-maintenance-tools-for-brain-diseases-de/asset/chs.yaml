  { \\sum\\limits_{i = 1}^{n}a_{\\begin{array}{l} j \\\\\\\\ \\\\\\\\ \\end{array}}\\\
  left( t \\right)\\exp\\left\\lbrack i\\int w_{j}\\left( t \\right)\\mathit{dt} \\\
  right\\rbrack \\right\\}$$\n\n### 6.6.3 特征提取\n\n根据调查调查，小波变换提供了最佳结果。离散小波变换（DWT）是一种特别适用于非平稳信号的工具。通过对母函数进行缩放和平移形成小波集，可以分离近似\
  \ `A` 和细节 `D`。频率分辨率翻倍，时间分辨率减半。\n\n$$\\begin{array}{l} {D_{j}\\left( t \\right)}\
  \ = \\sum\\limits_{k}s\\left( k \\right).l\\left( i \\right) \\\\\\\\ {A_{j}\\left(\
  \ t \\right)} = \\sum\\limits_{k}s\\left( k \\right).l\\left( i \\right) \\end{array}$$\n\
  \n从每个频段检索线特征，然后应用 DWT。\n\n### 6.6.4 预测\n\n从文献中可以注意到，像随机森林（RF）[16] 这样的分类器产生高精度的发作检测结果。RF\
  \ 算法根据决策树的预测来决定结果。通过平均各种树的结果来提供预测。随着树数量增加，结果的准确性得到提高。RF 技术克服了决策树技术的缺点：提高了准确性并减少了数据集的过拟合。\n\
  \nRF 算法的特征是：\n\n*   它提供了一种处理缺失数据的有用方法，比决策树算法更准确；\n*   它可以在不调整超参数的情况下产生准确预测；\n* \
  \  它解决了决策树的过拟问题；\n*   在每棵 RF 树中，节点分裂点随机选择特征子集。\n\n使用决策树和 RF，机器学习（ML）得到了有效结合。RF 识别方法运行快速，适用于高维数据。然而，在整个过程中产生了大量的超参数，为了在识别癫痫\
  \ EEG 信号时获得更高的准确性，需要调整模型参数。手动设置的选择通常取决于经验，因为目前还没有许多方法可以优化 RF 方法参数。\n\n决策树的 Gini\
  \ 纯度函数衡量了划分的成功程度。本质上，它帮助我们选择最佳的分 Split 器，以便构建简单的决策树。Gini 纯度的范围从 0 到 0.5 为：\n\n$$\\\
  textit{GINI}\\left( k \\right) = 1 - \\sum\\limits_{i = 1}^{K}\\mathit{Pi}$$\n\n\
  其中 *Pi* 是第 *i*^(th) 类的概率。\n\n\n\n\n\n$$\\textit{GINI}\\left( M^{\\ast} \\right)\
  \ = \\frac{n1}{n}\\textit{GINI}\\left( M1 \\right) + \\frac{n2}{n}\\textit{GINI}\\\
  left( M2 \\right) + \\frac{n3}{n}\\textit{GINI}\\left( M3 \\right)$$\n\n使用了聚类决策树\
  \ `{Tb*}`1`。对于一个输入样本，大小为“m”的决策树的识别结果大小也为“m”，且 `RF` 获取了所有的识别投票结果。在新节点上进行预测，票数最多的识别结果即为输出\
  \ $\\left\\{\\{ \\overset{\\Lambda}{C}b\\left( x \\right) \\right\\}\\_{1}^{m}$。\n\
  \n机器学习（ML）在结合某些计算工具用于通过 EEG 输入预测癫痫性发作时，其有效性得到了体现。然而，为了消除噪声和失真，必须对 EEG 信号进行预处理和过滤，如图图\
  \ 6.5 所示。这种被称为真阳性的问题涉及特征提取，并影响预测的时间准确性。\n\n![图 6.5 预测步骤。](img/fig6_5_B.jpg)\n\n\
  图 6.5 预测步骤。\n\n![图 6.6 分解树 [15]。](images/fig6_6_B.jpg)\n\n图 6.6 分解树 [15。\n\n该模型假设癫痫性发作在发生前足够充分，并提供了更高的真阳性率。预处理后，使用提取的时域和频域信息训练预测模型。模型在发作开始时检查发作前几分钟开始的起始状态：使用这些程序可以检测到\
  \ 92% 的发作。除了 EEG 之外，心率传感器和温度测量也可用于发作前的检测。\n\n## 6.7 使用心率传感器和温度传感器进行发作检测与预测\n\n进一步降低计算复杂度的方法是应用体温和心跳信号等原始数据。使用复杂的\
  \ ML/深度学习技术来估计模型，通过 ML 方法从温度、心跳和血红蛋白值中提取相关信息，如图图 6.7 所示。这种提出的方法使用了支持向量机（`SVMs`）和卷积神经网络（`CNN`），据认为它们能产生最佳的癫痫预测结果。边缘计算使得生成的模型具有独立性，并证明在有效的发作预测方法中。结果可以帮助现实世界中的癫痫患者。结果准确率达到\
  \ 99%。系统根据健康问题预判某些药物或处方药物剂量，并在观察到异常情况时使用全球移动通信系统（`GSM`）发送警报信息。此外，还可以追踪患者的体，当患者跌倒、恐慌或健康异常时，会发送警告作为通知。\n\
  \n![图 6.7 使用温度传感器和心率传感器进行发作预测。](img/fig6_7_B.jpg)\n\n图 6.7 使用温度传感器和心率传感器进行发作预测。\n\
  \n在这项研究中，通过 `ECG` 信号检测癫痫，该信号是通过使用植入皮肤的电极连续测量心脏电活动产生的。提供了一种基于共同空间模式（`CSP`）特征提取的识别系统。每个患者的单导和多导\
  \ `ECG` 信号被分成不重叠的段，并检查不同的段长度。每个信号段的特征通过将其投影到 `CSP` 投影矩阵来提取 [17, 18]。随后，使用使用径基函数内核构建并使用提取的特征训练的\
  \ `SVM` 分类器用于识别阶段。\n\n在这项研究中，使用 `CSP` 技术区分了正常和神经系统疾病相关的 `ECG` 信号。以下是 `CSP` 方法从第\
  \ 1 步到第 8 步的数学公式总结：\n\n1. 令 `Xi ∈ R^(N × S)` 为属于第 `nth` 个患者的 ECG 信号的第 `ith` 段。这里\
  \ `N` 是导联数，`S` 是样本数。\n2. 第 `nth` 个患者的归一化形式协方差矩阵通过以下公式确定：\n   $C_{n} = \\left( \\\
  frac{1}{M} \\right)\\sum_{i = 1}^{M}\\frac{X_{in}X_{in}^{T}}{Trace(X_{in}^{T})}$\n\
  \   其中 `M` 是段数，`T` 是矩阵的转置操作。\n3. 从所有患者获取协方差矩阵：\n   $C_{0} = \\left( \\frac{1}{M(L)}\
  \ \\right)\\sum_{j = 1}^{L}\\sum_{i = 1}^{M}\\frac{X_{ij}X_{ij}^{T}}{Trace(X_{ij}^{T})}$\n\
  \   其中 `L` 是患者数。\n4. 计算复协方差矩阵 `Cc = C_n + C_0`。\n5. 对矩阵 `Cc` 执行奇异值分解（`SVD`）以获得特征值\
  \ $\\psi$ 和特征向量 `Fc`：\n   $Cc = Fc\\psi Fc^{T}$\n6. 使用改进的白化滤波器 [[19]] 智能地强调 `QRS`\
  \ 复波并抑制 `ECG` 信号中的干扰。使用白化矩阵 `P = \\psi^{(−1)}Fc^{T}` 对协方差矩阵 `C_n` 和 `C_0` 执行白化变换以获得矩阵\
  \ `D_n` 和 `D_0`：\n   $D_n = PC_nP^{T}$\n   $D_0 = PC_0^{T}$\n7. 矩阵 `D_n` 和 `D_0`\
  \ 满足：\n   $D_n = U\\Lambda_nu^{T}$\n   $D_0 = U\\Lambda_0U^{T}$\n   这些矩阵具有共同特征向量，其中\
  \ `U` 和 $\\Lambda$ 分别代表特征向量和特征值的对角矩阵。\n8. 最后，构建大小为 `N × N` 的共同空间模式矩阵 `Wn`：\n   $Wn\
  \ = (U^{T}P)^{T}$\n   这里，空间滤波器是 `Wn` 的每一行，空间模式是 `Wn^{(−1)}` 的每一列。\n\n通过投影 `ECG`\
  \ 数据样本的每个段 $\\chi$ 来提取训练和测试特征向量，生成 [[20]] `B[n] = W[n]\\chi^{T}`，其中 $\\chi$ 是所考虑的第\
  \ `nth` 个患者的段。因此，相对于给定段 $\\chi$ 的特征向量 `f[n]` 定义为矩阵 `B[n]` 每一行方差的对数。\n\n针对第 `nth`\
  \ 个受体的分类器将从 `ECG` 段中提取的特征向量作为输入。目标第 `nth` 个受体的二分类为“1”，否则为“0”，这些是分类器的结果。由于使用了一对多分类方法，训练数据集的每个类别出现次数非常不平衡（即负样本的数量远多于正样本）。使用了过采样正案例的方法来实现正、负样本之间的平衡。\n\
  \n\n\n\n\n可以使用肌电图（EMG）检测发作。当癫痫患者处于无人照看时，双侧（全身性）强直-张挛性发作（TCSs）会增加猝死风险的风险 [21]。TCSs\
  \ 在人体睡眠时经常未被报告，这可能导致治疗选择不利。需要对这些严重的癫痫性抽搐进行自动识别，而可穿戴技术可以提供帮助。针对 TCSs，定量表面 EMG 变化显示出低频和高频信号成分的动态演变\
  \ [22]。发作生物标志物旨在增加高频 EMG 信号的算法。它们既可以识别发作，也可以将其与非癫性的痉挛发作区分开。有许多粘性可穿戴传感器可以应用于手臂，以及以臂带形式的可穿戴生物传感器。肌肉活动可以作为痉挛发作活动的替代，因为这里是测量\
  \ EMG 的良好位置。系统通过检测 EMG 的变化来识别抽搐，并通过粘胶贴应用在患者的二头肌上。该设备可以警告护理人员，并具有云端数据平台。此外，经过严格的训练和测试阶段后，可以引入\
  \ ML 算法来预测下一次抽搐发生的可能性，从而向护理人员发出警报 [23, 24]。研究发现，癫痫发作期间的肌肉激活机制与正常情况不同。此外，在持续肌肉激活方面，TCSs\
  \ 与强直性发作相比具有不同的强直期：TCSs 由信号频率大幅升高引起，而 TCSs 的强直期则以信号振幅的增加为特征 [25, 26]。\n\n除了需要维护的可穿戴传感器使用外，在更复杂的层面上追踪行为也至关重要，这包括活动模式、活动范围、睡眠质量和时长，以及情绪的行为指示，此外还利用可穿戴技术感知基础生物信号，例如基于对语音情感、社交连接或运动速度的研究。因此，分析数天或几周的行为变化是必要的，因为对前驱症状和发作触发事件的研究表明它们可能与发作风险有关。除了被动监测，可穿戴技术还可以主动向用户提问以评估情绪和认知性能的变化。为了捕捉高水平的动态脑状态，评估可以在预定间隔结合弹出调查，以及应用于注意或工作记忆等通用认知功能的特定测试套件\
  \ [27]（见图 6.8）。\n\n![图 6.8 用于检测发作的 EMG 传感器示意图。](img/fig6_8_B.jpg)\n\n[图 6.8 用于检测发作的\
  \ EMG 传感器示意图。\n\n## 6.9 帕金森病\n\n帕金森病（PD）是一种大脑多巴胺水平过低时发生的神经系统疾病。随着病情随时间恶化，残疾程度增加。帕金森病影响工业化国家\
  \ 60 岁以上成人的约 1%。震颤（尤其是静止时）、僵直和运动缓慢是该疾病的三大主要运动症状，可以通过左旋多巴治疗（运动迟缓）。这些运动症状会逐渐恶化，使日常生活变得困难并降低生活质量\
  \ [28]。其中一些症状可以用多巴胺类药物治疗，但随着病情恶化并扩散到身体其他区域，药物效果往往消失得更快。一些人还会遇到频繁的症状变化（“OFF/ON”状态）或不可控的转换（运动障碍），作为药物的副作用，这需要个性化的剂量调整。\n\
  \n在确定特定个人的帕金森病进展速度时，必须监测运动症状的变化以及对治疗的反应，以便制定个性化的治疗方案。丰富的临床医生会患者完成一系列常规运动任务，同时视觉评估其动作质量并分配症状评分。这是目前评估帕金森病症状的金标准。运动障碍协会统一帕金森病评分表是执行此类评估最常用的表。患者还被要求在日记中记录症状。然而，由于各自准确性较低且时间精度较差，这些方法具有局限性。有人建议克服这些限制的方法是使用可穿戴的惯性加速度计和肌电传感器对帕金森病症状进行自动诊断。多项研究表明，有关传感器和\
  \ ML 算法等可穿戴配件的信息可用于识别运动投诉。神经网络和 SVM 等 ML 算法被广泛利用，是因为它们具有从信息中学习分类模型并泛化到不可预测场景的能力，与之相反，信号处理曾被用于手动设计特定特征和识别症状。这些模型可以使用从各种人在诊所执行预定任务时收集的运动数据进行训练\
  \ [29]。\n\n## 6.10 用于帕金森病的物联网基础设施\n\n通常，加速度计、陀螺仪或磁力计是帕金森病研究中大部分的可穿戴技术。这些设备可以实时检测帕金森病运动症状，并通过特定的运动程序建立多个模型。这使得医生能够实时评估患者的活动状态。在一项研究检查了收集上肢震颤和运动迟缓的可穿戴传感器数据\
  \ [30]。\n\n### 6.10.1 运动迟缓\n\n运动迟缓是指运动速度和节奏缓慢，表现为运动过程中的逐渐停顿或停止。它是帕金森病的主要症状之一。\n\n\
  ### 6.10.2 震颤\n\n不可控制的抖动是震颤这种神经系统疾病的症状，最影响手部和手臂。虽然这种疾病很少致命，但可能导致丧失行动能力。帕金森震颤通常起始于身体的一侧（通常是手），然后扩散到另一侧。这些运动倾向于更强（高振幅）且频率较低。陀螺仪安装在背部，如图\
  \ 6.9 所示。该系统使用的算法已被证明根据步态平稳度、步态一致性和步态变异性等变量估计帕金森病患者的跌倒风险 [31]。\n\n\n\n\n\n拖曳、受限的摆臂动作以及多步旋转步态是帕金森病（PD）的特征。冻结和平衡问题的潜在风险增加了跌倒危险，且对治疗的反应表现出不可预测的不一致性。可穿戴传感器由于其运动的可预测性，以及能够通过位于三维分析功能的单一传感器进行追踪，被广泛应用于运动分析。研究表明，从躯干记录的震颤（jerk）测量对于检测帕金森病患者的平衡障碍和站立困难有效且准确。谐比（harmonic\
  \ ratio）基于三个运动轴的计算，用于衡量步态之间行走的稳定性或波动。它已成为识别冻结患者以及将帕金森病患者与对照组区分的敏感参数。\n\n为了获得关于药物“OFF”状态和“ON”状态转换充足的信息，数据采集技术通常涉及记录大量患者佩戴多个传感器，并在数小时内接受重复的临床检查。\n\
  \n震颤分析通过频率和振幅来区分震颤。可以使用加速度计或陀螺仪来区分震颤沿角轴或线性轴的位移，这已被证明会产生最大的残障。在研究中加入肌电图（EMG）提供了一种区分不同震颤亚型的有效可测量方法，它可以进一步阐明震颤形成过程中招募或同步的肌群\
  \ [32]。\n\n本研究的主要目标是比较几种技术在创建用于识别日常活动中帕金森病症状的机器学习模型时，扩展训练信息量的相对优势。在部分实施过程中，通过固定在手臂、手部和大腿上的灵活可穿戴传感器捕捉了运动，如图\
  \ 6.10]。\n\n![图 6.10 用于检测帕金森病的可穿戴设备。](img/fig6_10_B.jpg)\n\n图 6.10 用于检测帕金森病的可穿戴设备。\n\
  \n## 6.11 用于预测帕金森病的机器学习算法\n\nCNN（卷积神经网络）和随机森林（RF）分类器接收来自单个或一组传感器的数据，以产生训练好的统计集成模型。由于传感器位于身体两侧，使用提供的数据对这些值进行了评估\
  \ [33]。\n\n实施过程涉及训练两个随机森林分类器，一个用于震颤检测，另一个用于判断某个信息段是否存在运动迟缓。因此，根据所示的症状，每个片段的临床评分被赋予\
  \ 0 到 5 分的值，5 分最高。每个分类器以所有特征的向量作为输入，这些特征是使用每个片段的陀螺仪和加速度计信息计算的。这些参数在早期的帕金森病研究中成功捕捉了与速度频率相关的运动特征。随机森林分类器可调超参数数量少且能够减少过拟合，这是使用它的两个原因。为了尽量减少不准确性，树的数量被设定在理想水平\
  \ [34]。\n\n该研究项目训练了两个使用深度 CNN 的分类模型。基于 CNN 的模型不需要创建一组特征来编码信息段，因为它们可以从原始数据从头开始学习如何识别症状。网络层之间的权重通过从原始数据中学到的特征进行编码，这些特征描述了传感器数据与症状之间的相关性。\n\
  \n每个 CNN 有两个卷积层，每层的内核大小为 32 或 16 个样本，修正线性单元（ReLU）数量为 16 或 32，随后是池化为 4 或 6 个单元的最大池化层。最后两层由两个总共\
  \ 32 个神经元的密集层组成，每个神经元都有激活 ReLU 的能力。输入片段显示症状（运动迟缓/震颤）的概率由输出层使用 softmax 函数进行分类，神经元的数量与类别相同。\n\
  \n这项研究工作在一个与健康部门合作的机构中进行。最初考虑使用开源数据进行实施、训练和测试模型 [34]。\n\n## 6.12 结论\n\n\n\n\n\n\
  利用机器学习（ML）和可穿设备数据，可以自动检测多种类型的癫痫发作。初步结果表明，在多种发作类型中，其识别率均优于随机概率。未来的进展可能会考虑替代的数据平衡、预处理与后处理、融合以及集成学习技术，以及临床癫痫特征（如发作时长或综合征）。因此，尽管目前的结果证明了其可行性，但未来的进一步改进可能会提高检测效率。\n\
  \n患者需求的增加会给任何神经内科实践带来负担，迫使患有神经系统问题的患者前往广阔的覆盖区域之外寻求治疗，导致神经内科医生在进行检查和治疗患者时面临时间和空间上的压力。这在癫痫治疗中尤为明显，神经内科医生或其他癫痫专家极度匮乏，严重限制了可接诊的患者数量。随着全球医疗资源的减少，尤其是神经内科医生的减少，这种负担正在全球范围内增加。\n\
  \n医疗保健部门正经历着不断的转型，以满足日益增长的患者需求和复杂的治疗需求，同时向质量指标和循证治疗转型。在这种背景下，远程医疗已获得多个医学领域患者和从业者的支持。护理护理、行政支持、认证和可持续性仅仅是成功的癫痫诊所或中心的少数先决条件。\n\
  \n制定一个根据每位患者需求定制的癫痫治疗计划至关重要。除了这些问题，远程医疗还需要特定的技术和信息技术支持。计算机、带有摄像头的笔记本电脑、智能手机以及互联网服务的连接被认为是基础的技术必需品。捕捉和记录远程医疗会面的理想方式被认为需要与电子健康记录系统集成。这样，通过基于网络的服务传输发作日志、发作行动计划和检查报告等数据将变得简单且有保障。\n\
  \n随着技术的发展，对隐私和健康信息安全的担忧随之出现。数据加密是网上的一种服务，在这方面提供了帮助。可穿戴运动传感器正在迅速扩展，其在帕金森病（PD）症状评估中的应用为运动障碍的性质和特征提供了新的临床见解。然而，可穿戴设备提供的无偏客观数据不仅具有改善临床护理的潜力，还为具有表型和基因型变异的疾病提供了提供定制化治疗策略的可能性。\n\
  \n帕金森病常用的手术治疗方法是深脑刺激（DBS）。医生会植入细金属线，向大脑提供电脉冲以辅助控制某些运动症状。可以想象传感器数据作为一种前馈机制，用于微调和调节治疗增益的程度，特别是对于闭环\
  \ DBS 和帕金森病的新型给药泵系统。这些实时测量还可用于将患者分为不同的治疗模式并建立预测模型，从而更有效地管理他们的运动障碍。\n\n## 参考文献\n\n\
