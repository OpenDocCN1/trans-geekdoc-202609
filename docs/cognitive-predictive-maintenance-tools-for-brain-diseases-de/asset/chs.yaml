  \n\n\n\n\n皮肤覆盖了身体的大部分，是非侵入性健康穿戴设备（HWDs）的理想部位。这些位于皮肤上的设备可以监测生理和心理因素，用于治疗心血管和神经肌肉等疾病。可以通过对汗液进行定性和定量分析来诊断疾病。纺物或表皮材料可能用于基于皮肤的穿戴设备。这种区分是根据皮肤接触的性质的。基于纺物的可戴设备在衣服中融入传感器，而基于表皮的可戴设备则以类似于纹身的方式应用，被称为电子皮肤（e-skin）。各种热门\
  \ HWD 类别如图图 9.2 所示。它们大致可分为两部分：完全柔性和部分柔性。完全柔性可以是完全打印的，也可以像纹身一样在身体上佩戴，而且在药物递送系统中也很流行。\n\
  \n![图 9.2 各种热门柔性 HWD 及其应用。](img/fig9_2_B.jpg)\n\n图 9.2 各种热门柔性 HWD 及其应用。\n\n在接下来的章节中，我们将探索基于纹身和纺物的\
  \ HWD 如何用于监测和诊断疾病。织物几乎随处可见，并且已经存在了多年甚至几个世纪。从历史角度看，纺织品和衣服一直被认为是维持人体体温的手段以及审美上的必需品。由于它们安装简单且提供的舒适度高，它们可以被用于检测基本参数，如人体温度、心率和呼吸系统频率\
  \ (Massaroni et al. 2018; Alizadeh Meghrazi et al. 2020)。这使得它们能够用于人体感知。电子纺织品或简单的电子纺织品（e-textiles）是指代这一类\
  \ HWD 最常用的术语。电子纺织品是用电子元件和传感器织成的衣物。这些组件使服装能够执行多种功能。由于纺物具有伸伸性并能大面积与皮肤紧密接触，它是 HWD 的极佳介质（Choudhry\
  \ et al. 2020）。\n\n自从石墨烯、碳纳米管和纳米线被发现以来，人们曾多次尝试将传感器集成到衣服中，以进行持续监测。其中一项尝试是由 Yapici\
  \ 和 Alkhidir 完成的，他们开发了一种基于纺物的智能 HWD 用于监测心电图（ECGs）。心电图通常使用基于凝胶的 Ag/AgCl 电极线进行监测，这对于佩戴者来说可能不舒服。已经开发出嵌入\
  \ ECG 传感器的石墨烯功能化织物，用于基于纺物的 ECG 监测。由于石墨烯具有卓越的材料特性，并且与传统的凝胶基 ECG 监测有强相关性，因此决定它是该应用的最佳材料（Gong\
  \ et al. 2019; Jayathilaka et al. 2019; Modali et al. 2019）。\n\n（注：原文后续存在大量重复段落，译文已去重处理以保持逻辑清晰。）\n\
