  \n# 3 当前的认知测试与疗法\n\nPriya Dev 和 Abhishek Pathak\n贝纳勒斯印度大学 (Banaras Hindu University)\n\
  \n## 3.1 引言\n精神和行为障碍的 ICD-10 分类：临床描述和诊断指南。世界卫生组织，1992 年。\n（ 精神和行为障碍的 ICD-10 分类：临床描述和诊断指南。世界卫生组织，1992\
  \ 年。）\n认知障碍定义为：\n\n## 3.2 比较性认知评估\n\n### 3.2.1 简易精神状态量表 (MMSE)\n目前最常用的认知测试是 MMSE。它由\
  \ 11 个问题组成，总分为 30 分，用于对认知障碍程度进行分类。测试评估了语言、定向、登记、计算和注意力功能（Folstein et al. 1975）。分界值通常取决于受教育程度，因为在评估受过良好教育的人员时，需要调整传统的\
  \ 23 分界值以获得相同的敏感性和特异性（O’Bryant et al. 2008）。\n\n该检查经过了许多变体，有些针对特殊需求进行了改进。改良简易精神状态量表（3MS）将评分扩大到\
  \ 100 分，并增加了一些评估不同认知领域的问题；听力/视觉受损 MMSE 和正常 MMSE 都是一些示例（Teng and Chui 1987）。\n\n\
  #### 3.2.1.1 优点\n\n\n\n\nMMSE（简易精神状态量表）的普及无疑是其最大的资产。由于它是最广泛使用的认知检查，因此拥有海量的患者群体数据可用于测试评分的校准和患者比较。MMSE\
  \ 的易用性是另一个优点。它可以在极少培训的情况下在不到十分钟内完成实施和评分。尽管操作简单，但在检测有严重认知功能障碍（NCDs）的人方面，它具有很高的准确特异性。根据对包含\
  \ 1141 名受教育年限 16 年以上人员的 MMSE 分数的评估，在区分正常或患有较严重主要 NCD 的受教育个体时，MMSE 的准确率为 89%，灵敏度为\
  \ 66%，特异性为 99%（O’Bryant et al. 2008）。同样，MMSE 尽管易于使用，但涵盖了广泛的认知能力，每个领域至少涵盖测试的三个分。这既能对患者缺陷最严重的认知领域进行初步筛查，也能对患者的认知水平进行相当全面的评估。研究发现\
  \ MMSE 分数与大脑的形态学特征，特别是海马体（Dinomais et al. 2016）相关，海马体已知在情境记忆和空间记忆中起作用（Eichenbaum\
  \ et al. 1999），以及杏仁核、扣回和旁海马回（Dinomais et al. 2016），这表明 MMSE 产生的结果与许多昂贵的测试相当。\n\n\
  #### 3.2.1.2 缺点\n\n目前，MMSE 相关的知识产权问题是一个缺点。临床医生每次实施 MMSE 都必须向目前的专利持有者 MiniMental\
  \ 支付费用，至少对于官方当前版本，尽管由于 MMSE 受专利，实施的材料成本在理论上可以忽略不计。这种不便促使了免版税认知测试的产生（Folstein et\
  \ al. 1975）。虽然 MMSE 集中在几个不同的认知领域，但在评估其他关键特征（如视觉空间推理）方面受到限制，因为该部分只有一个问题。这是该测试的另一个缺点。这是一个严重的缺陷，因为视觉空间导航障碍是阿尔茨海默病（AD）和遗忘性轻度\
  \ NCD 的已知体（Hort et al. 2007）。该测试还高度依赖语言，如果参与者的阅读和语言能力较差，可能会偏偏结果（Park et al. 2018;\
  \ Albert and Teresi 1999; Weiss et al. 1995; Mayeaux et al. 1995）。此外，由于评估的灵敏度较低，能够获得相当高\
  \ MMSE 分数但仍表现出严重 NCD 症状的人必须接受二次评估（O’Bryant et al. 2008）。除了灵敏度低外，该测试预测未来衰化的能力也受到限制；然而，正在开发诸如预测阿尔茨海默病谱系发展的计算模型（COMPASS）等分析方法来解决这一缺陷（Zhu\
  \ et al. 2016）。\n\n### 3.2.2 画钟测试\n\n最常用的且在概念上最直观的认知测试之一是画钟检查。尽管该测试使用了许多种评分方法，但它们通常都对时钟的各个方面给出评分，例如其设计以及指针和数字的位置（Palsetia\
  \ et al. 2018）。在特定的时间（通常是 11:10），患者被要求画一个模拟时钟表盘。选择这一特定时刻是因为它需要同时使用双视野，并抑制对数字 10\
  \ 的“前额叶牵拉力”。在钟表盘上将分针指向数字 10 而不是数字 2，是严重 NCD 患者的常见错误（Ryan et al. 2009）。画钟有几项评分标准，但传统的标准强调视觉空间技能并采用十分制评分（Sunderland\
  \ et al. 1989）。\n\n### 3.2.2.1 优点\n\n画钟测试的简单可能是其最大的优点。只需极少准备，即可在不到两分钟内完成测试。测试评估多个认知过程（尤其是视觉空间推理）的能力是一个巨大的优势。描绘复杂的细节有助于测试评估运动力（praxis）。在测试期间将分针放置在正确时间的要求评估了计算能力。该测试通过比较钟表盘数字的相对大小和位置来衡量视觉空间推理。\n\
  \n### 3.2.2.2 缺点\n\n画钟测试的主要缺陷是评分不一致。由于提示非常开放，每个评分者可能会给出不同的分数。该测试还遭受了“地板效应”和“天花板效应”，因为它非常简单；一些仅患\
  \ NCD 的患者能够正确画钟，而另一些严重 NCD 患者则不能。需要二次评估来区分这两组人群。画钟测试还受限于几个重要的认知领域，特别是与语言相关的领域。这三个缺点指向了这一点。最后但同样重要的是，这项测试对于没有受过正式教育的人是不公平的。例如，一项针对受试者测试表现的干扰因素的研究发现了教育水平与表现之间的关联（de\
  \ Paula et al. 2013）。\n\n### 3.2.3 阿登布鲁克认知检查\n\n为了包含 MMSE 未涵盖的认知能力（如视觉空间推理），阿登布鲁克检查（ACE）作为\
  \ MMSE 的扩展而开发。ACE 原封包含了 MMSE，以提供 30 分的 MMSE 评分。ACE 是许多变体的基础，例如修订版阿登布鲁克检查（ACE-R），其目的是清晰定义子域评分；以及\
  \ ACE-III，其目的是加强 ACE-R 的某些部分（如重复和理解），并取代了 ACE 中的 MMSE 部分（Noone 2015）。严重 NCD 的常见界值是\
  \ ACE-III 总分 100 分中的 82 到 88 分之间（Noone 2015）。\n\nACE-III（Mathuran et al. 2000）是一种\
  \ 100 分的简短纸笔测试，可以在床边进行以评估整体认知功能。它提供多种语言版本，包括马拉拉地语、泰米尔语、泰卢语、印地语、印度英语和坎纳语。这项检查是免费的，临床和研究界值分别为\
  \ 88 分和 82 分（Zhu et al. 2016）。ACE 之前适用于其他一些印度语言，包括孟加拉语和马拉雅姆语（称为 MACE，并针对城市马拉雅姆语的人群建立了基于人群的常模；Palsetia\
  \ et al. 2018）。然而，这些适配版是 ACER 的，该版本已不再用于临床和研究领域，并已从 NeuRA 研究学院的网站（`https://www.neura.edu.au/`）下线。\n\
  \n\n\n\nACE 的优势之一是它能够评估 2D 和 3D 维的视觉空间能力，涵盖了如拼凑破碎字母和使用线框内克尔立方体进行空间推理等任务，同时保持了 MMSE\
  \ 所考察的认知领域的多样性。在诊断能力方面，ACE 的表现优于 MMSE，因为它填补了 MMSE 留下的各种空白。简版 ACE（M-ACE）是 ACE 的 30\
  \ 分缩减版本，其作者将该测试与 MMSE 进行了对比，发现 M-ACE 比 MMSE 更加敏感，且不易受天花板效应的影响。根据研究（Hsieh et al.\
  \ 2015），在 M-ACE 上得分低于 `21/30` 的患者可能患有严重的神经认知障碍（NCD）。此外，ACE 也不容易受到地板效应的影响。根据一项 2000\
  \ 年评估 ACE 识别轻度或重度 NCD、阿尔茨海默病（AD）和额颞叶显著 NCD 能力的研究，该测试能够区分阿尔茨海默病的不同阶段（Mathuranath\
  \ et al. 2000）。ACE 还具有易于实施和对培训要求少的优点。最后，该测试在翻译成不同语言后似乎仍然是可靠的。例如，一个阈值为 `74/100` 的日版\
  \ ACE 敏感性达到了 `0.889`，特异性为 `0.987`。\n\n### 3.2.3.2 缺点\n包含 `MMSE` 问题的 `ACE` 版本容易与\
  \ `ACE-III` 面临相同的专利问题，而 `ACE-III` 与 `MMSE` 不同。此外，由于 `ACE` 在英国（UK）创建，某些问题倾向于熟悉英国文化或其他具有相似政治结构的欧洲国家的人。例如，某些询问中会要求提供首相或反对党党领的名字（Callow\
  \ et al. 2015）。\n\n### 3.2.4 全科医生认知评估\n在基础医疗保健机构工作的医生可以使用为此目的创建的全科医生认知评估表（GPCOG）。该测试格式由两次访谈组成：一次针对患者，另一次针对信息提供者（患者的密友或亲属）。完成九个问题的患者访谈有两种方式：书面或在线形式（Brodaty\
  \ et al. 2002）。患者访谈中包含了画钟测试、地址回忆和近期新闻。在信息提供者访谈期间，会提出六个问题，关于患者执行日常活动的能力，如寻找物品、说话和处理金钱等（Brodaty\
  \ et al. 2002）。\n\n#### 3.2.4.1 优点\n`GPCOG` 仅通过九个问题即可评估患者的定向能力、视觉空间能力、执行功能、近期信息的提取以及延迟记忆（Brodaty\
  \ et al. 2002）。该测试的敏感性和特异性与 `MMSE` 相当，患者访谈大约需要四分钟，信息提供者访谈需要两分钟（Brodaty et al. 2002）。由于患者评估有书面和在线选项可选，医生现在可以专注于其他任务。`GPCOG`\
  \ 也是免费使用的，不像受专利保护的 `MMSE`。最后，`GPCOG` 似乎对教育程度或文化背景没有偏好（Basic et al. 2009）。\n\n####\
  \ 3.2.4.2 缺点\n该测试对信息提供者的依赖是其缺点之一。研究发现，患者的年龄是 `GPCOG` 认知评估部分得分的显著预测因子（`correlation\
  \ = 0.187`，`P = 0.01`），尽管这在基于信息提供者的部分中并不是一个影响因素（Brodaty et al. 2004）。\n\n### 3.2.5\
  \ 蒙特利认知评估\n蒙特利尔认知评估（MoCA）被创建为一种筛查工具，以取代 `MMSE`，因为它更适合检测轻度 NCD。初始测试在轻度 NCD 和 AD 方面均具有更好的敏感性，尽管特异性较低（Nasreddine\
  \ et al. 2005）；然而，通过对截止分数进行微调，`MoCA` 在检测轻度 NCD 方面的敏感性和特异性均优于 `MMSE`（Ciesielska et\
  \ al. 2016）。除了 `MMSE`，它还可以用于评估那些处于正常认知范围内但显示出其他认知障碍指标（如日常任务困难）的人。它还可以用于检查病情轻微到不足以影响其日常生活的人。这种纸笔考试可以免费参加。它涵盖了涵盖许多典型领域的询问和其他认知检查。测试还包含了画钟检查，并使用改进的连线测试来评估视觉运动、视觉感知和任务切换能力。语言熟程度、概念思维、回忆/记忆和定向能力均在\
  \ `MoCA` 中得到了测试（Julayanath et al. 2017）。\n\n`MoCA`（Nasreddine et al. 2005）是一种免费、快速且易用的全球筛查工具，因适用于多种语言（包括孟加拉语、坎纳达语、马拉拉地语、泰米尔语和乌尔德语）而日益流行。它已被批准用于帕金森病患者（nan\
  \ et al. 2015）。该测试有方法根据教育程度、视觉障碍和身体残调整评分，最高分为 30 分。对于重复评估，它具有良好的重测信度。26 分的阈值被用于区分认知障碍患者和正常受试者。计算机版本正在开发中。\n\
  \n#### 3.2.5.1 优点\n尽管该测试仅需十分分钟且可以在临床环境中完成，但它衡量了广泛的认知能力。此外，该测试免费获取（Julayanath et\
  \ al. 2017）。研究还发现 `MoCA` 比 `MMSE` 能更准确地预测认知储备，这可能增加了 `MoCA` 对早期 AD 的敏感性（Kang et\
  \ al. 2018）；发现认知储备较高的人患重度 NCD 的风险较低（Valenzuela and Sachdev 2006）。\n\n#### 3.2.5.2\
  \ 缺点\n`MoCA` 在感觉障碍方面的缺点值得注意。在一项对比 301 名老年人 `MoCA` 分数的研究中，其中 50% 的人没有感觉障碍，38%、5%、7%\
  \ 的人分别有听力、视觉或双感官障碍，研究发现，尽管对障碍个体调整了评分，但无障碍者的通过率仍然更高（Dupuis et al. 2015）。尽管与其他检查一样，获取了总分并与当前分数进行对比，但在\
  \ 2653 名心血管疾病老年人中，某些问题的失败率明显较高（Rossetti et al. 2011）。该测试也需要根据年龄和教育水平进行调整。\n\n\n\n\
  \n10/66 研究测试电池使用痴呆症社区筛查工具（`CSI-D`）(Hall et al. 1993) 作为认知筛查工具来评估普通认知功能(Sosa et al.\
  \ 2009)）。通过一个 32 项认知测试产生全局认知评分。此外，它还将一个关于患者日常活动和整体健康的 26 项信息者访谈结果整合到一个单一预测算法中(Prince\
  \ et al. 2011)）。`CSI-D` 还有一个精简版本，供非专业医疗保健人员在初级保健环境中使用(Prince et al. 2011)）。\n\n\
  ### 3.2.6.1 加尔加答的认知测试\n\n得益于全球认知筛查电池加尔加答筛查（(Prince et al. 2011)），加尔加答的人口拥有常模数据。使用的测试语言是孟加语。翻译后的测试电池是开放且免费的。\n\
  \n### 3.2.6.2 世界卫生组织老化与成人健康研究进行的成人健康调查\n\n一种名为世界卫生组织老化与成人健康研究调查（`SAGE`）的文化敏感性筛查工具是在在加纳、印度和坦桑尼亚进行的家庭健康调查中作为创建的。该试点研究包含了来自\
  \ 469 名印度成年人的词表学习测试、类别流畅性（动物）和数字跨度（正向和反向）的常模数据。`SAGE` 数据和认知测试公开可用(Das et al. 2006)。\n\
  \n### 3.2.6.3 Cognistat 的印度版本\n\n简版认知筛查工具 `Cognistat` 原称为神经行为认知状态检查，已针对印度人群进行了修改，并证明在创伤性脑损伤患者中具有良好的效度。尽管其在小规模上显示出很强的可靠性和效度，但尚未建立基于该人群的常模数据。测试出版者的网站未提及印度版本作为购买选项，因此不确定目前是否在售(Gupta\
  \ and Kumar 2009)。\n\n### 3.2.6.4 多领域认知筛查测试 (MDCST)\n\n`MDCST` (Hota et al. 2012)\
  \ 是一种敏感且用户型的全局认知筛查工具，旨在识别早期轻度认知障碍（`MCI`）。它还展示了强大的心理测量特征，使其能够在未来的人口统计学研究中使用。它已获批准用于适应并居住在海拔\
  \ 4300 米以上的低地地区人群。\n\n### 3.2.6.5 痴呆症评估快速测试\n\n快速测试痴呆症评估（`DART`）(Swati et al. 2015)\
  \ 包含四个测试项目——三个单词的重复、类别流畅性（蔬菜）、词汇回忆和画时钟——（此处省略原文中大量重复的相同测试项目描述）。\n\n### 3.2.6.6 Mattis\
  \ 评分量表\n\n`36` 项任务构成了印地语版本（此处省略原文中大量重复的相同描述）。\n\n### 3.2.6.7 通用痴呆症 (Rowland)\n\n\
  ……的应用——（此处省略原文中大量重复的相同描述）。\n\n### 3.2.6.8 图像受损记忆\n\n……的 `10` 项——（此处省略原文中大量重复的相同描述）。如果参与者无法回忆……，则\
  \ `15`。\n\n### 3.2.6.9 可用领域测试\n\n`SAGE` 数据和认知测试公开可用(Das et al. 2006)。`Bilingual`\
  \ 测试电池 (Chengappa and Kumar 2008) 提供印地语、坎纳达语、奥里亚和泰米语版本。\n\n### 3.2.6.10 针对印度人群设计的和标准化电池\n\
  \n#### 3.2.6.10.1 医学教育研究生学院 (PGI) 脑功能电池\n\n由 `五` 个子测试组成的 `PGI` 电池包括 `Bhatia’s Short\
  \ Scale`、`Verbal Adult Scale`、`Nahor–Benson Perceptual` 和 `Bender Visual Gestalt\
  \ Test`。\n\n#### 3.2.6.10.2 用于 PGI 的记忆量表\n\n`PGI` 记忆量表的 `十` 个子测试 (Pershad and Verma\
  \ 1990) 测量语言和非语言记忆、远期记忆、短期记忆和长期记忆。\n\n#### 3.2.6.10.3 精神与神经科学 (NIMHANS) 电池\n\n在印度创建第一个神经心理测试电池是\
  \ `NIMHANS` (Pershad and Wig 1978)。它包含大约 `20` 项测试。\n\n#### 3.2.6.10.4 成人 NIMHANS\
  \ 认知测试\n\n`19` 项针对印度人群修改和标准化的常用西方神经心理测试成了 `NIMHANS` 成人神经心理电池 (Mukundan and Murthy\
  \ 1979)。\n\n#### 3.2.6.10.5 儿童 NIMHANS 神经心理测试\n\n`NIMHANS` 儿童神经心理电池上的 `10` 项项目 (Rao\
  \ et al. 2004) 已经验证可用于脑损伤儿童。\n\n#### 3.2.6.10.6 老年 NIMHANS 神经心理电池\n\n\n\n\n\n一套名为“NIMHANS\
  \ 老年人神经心理学量表”（NNB-E）(Kar et al. 2011) 的全面测试方案被用于 55 至 80 岁的印度老年人。已证明，该量表在检测阿尔茨海默症老年患者方面具有很强的判别效度。\n\
  \n### 3.2.6.10.7 全印度医学科学学院印地语综合神经心理量表（成人版）\n\n由全印度医学科学院开发的印地语综合神经心理量表（成人版）(Tripathi\
  \ et al. 2013) 是一套年龄范围涵盖 15–80 岁的测试组合。其基础是鲁利亚-内布拉斯加神经心理学量表。总共有 160 个项目，分布在 10 个基础量表和\
  \ 4 个辅助量表中。它是印度唯一本地创建的印地语测试量表。\n\n### 3.2.6.10.8 痴呆研究小组的 10/66 认知测试量表\n\n10/66 痴呆研究小组的试验包含了普通认知功能、语言流性和记忆的测量，使用了该小组开发的认知测试量表(Gupta\
  \ et al. 2000)）。该量表是利用“阿尔茨海默症注册建立联盟”和“痴呆社区筛查工具”（CSID）的数据开发的。它为 65–80 岁的人提供了特定地区的标准。鉴于同一量表已在七个进行了常模化，它对于跨文化研究（古巴、多米尼共和国、委内瑞拉、秘鲁、墨西哥、中国和印度）非常有帮助。\n\
  \n### 3.2.6.10.9 HIV 认知测试量表\n\n已知受 HIV 影响敏感的认知领域通过 HIV 认知测试量表(Sosa et al. 2009)\
  \ 进行了评估。它包含了根据美国测试方法改编、用于泰米尔语和泰卢固语评估的检查。该量表目前没有公认的标准。\n\n### 3.2.6.11 市售的测试量表\n\n\
  韦克斯勒儿童智力测表（第四版印度版）和韦克斯勒成人智力测表（第四版印度版）被公认为全球金标准评估，现在出版社提供了专门针对印度人口定制的适配版本、标准和常模。此外，出版社还提供了韦克斯勒记忆量表（第三版印度版），该量表在全国范围内评估语言和非语言的学习与记忆。出版社最近还推出了韦克斯勒简版智力量表（第二版印度版），作为一种对认知能力的快速且准确测试(Yepthomi\
  \ et al. 2006)。虽然测试量表中的某些测试及其相关常模可以在临床和研究环境中独立使用，对于全面的认知评估具有重要价值，但由于获取成本高，临床心理学家和神经心理学家更多地在大型学术和医疗机构中使用。一套名为\
  \ CNS Vital Signs 的全面计算机神经心理测试量表提供多种语言，包括孟加拉语、古吉拉语、印地语、坎纳达语、马拉雅拉姆语、马拉地地语、旁遮普语、泰米尔语、泰卢固语和乌尔固语。它由十项已常模化的检查组成，尽管并不清楚是否存在基于印度人口的常模。\n\
  \n## 3.3 用于诊断和治疗认知障碍的虚拟现实应用\n\n### 3.3.1 虚拟现实诊断\n\n#### 背景\n\n虚拟现实（VR）是一个让人浸入模拟环境的概念。在某些情况下，触觉反馈可以通过系统（如控制器）传输给用户。用户可以通过一组物理传感器与该环境交互，并通常通过提供环境视觉和音频的头戴设备来感知该环境(Park\
  \ et al. 2019a)。在主要非退行性疾病（NCDs）背景下，VR 的魅力在于它可以根据程序的重点和设计，评估并提高空间推理以及其他认知能力(Park\
  \ et al. 2019b; Zucchella et al. 2018)。VR 独特特征在医学和精神病领域引起了极大关注。阿尔茨海默症甚至轻度遗忘性 NCD\
  \ 的特征都是视觉空间思维的下降(Hort et al. 2007)。虽然可以通过简单的视觉空间测试（包括一些纸笔测试）来测试空间认知，但这些测试与大型环境中的空间导航的相关性往往只有部分相关，或者根本不相关(Hegarty\
  \ et al. 2006)。这是目前主要 NCD 诊断检查的一个缺陷。将测试环境设置在虚拟现实中是包含 3D 大规模空间推理问题的一种潜在方法。研究发现，正确导航虚拟现实的能力与其现实世界中的对应能力相当(Van\
  \ Schaik et al. 2008)，且 MMSE 分与该能力相关。\n\n#### 自我中心与他中心导航\n\n相对于相对于个人位置的物体定位（自我中心导航）以及物体之间的相对定位（他中心导航）是两种主要的导航策略。Weniger\
  \ 等人要求患者记忆一个 VR 公园环境，以识别阿尔茨海默症和轻度 NCD 的自我中心导航缺陷。作者还要求患者记忆一个 VR 迷宫，以描述他中心导航的任何缺陷。虽然该研究无法在自我中心和他中心导航任务上区分轻度\
  \ NCD 患者和对照组，但这两项测试中的表现均差于对照组(Weniger et al. 2011)。利用中度遗忘性 NCD，Serino 等人（2015)(ch3.xhtml#ref3_89)\
  \ 评估了他中心和自我中心空间能力。AD 患者和对照组进入一个包含特定物体的虚拟房间。在第二阶段运行了两种测试之一。在第一种中，患者看到房间的俯视图，其中有其他物体但没有目标物体。在第二种中，患者进入只有一个箭头引导的空\
  \ VR 房间；该房间的角度与第一个不同。尽管这些差异取决于任务以及参与者进入虚拟空间的角度，但 AD 患者与对照组之间存在显著差异(Serino et al.\
  \ 2015)。\n\n#### 导航记忆\n\n\n\n\n\n为了评估空间工作记忆，Lee 等人开发了传统径向臂迷宫（RAM）的非沉浸式虚拟版本。迷宫由六条手臂组成，其中有一个目标，连接到一个中心平台。在离开一个手臂后，人必须先回到中心平台才能访问另一个手臂。记住哪些手臂已经访问过而哪些尚未访问是该迷宫的主要挑战。迷宫可以重复访问，而且由于迷宫的制作方式，某些手臂永远不会包含宝藏。“空间参考记忆”是指学习并记住哪些手臂永远不会含有财富的过程。根据\
  \ Lee 等人的研究，阿尔茨海默病（AD）患者的工作记忆和空间参考记忆均受损，而中度神经认知障碍（NCD）患者仅报告有空间参考记忆受到影响（Lee et al.\
  \ 2014）。Plancher et al. (2012) 利用 VR 城市环境的主、被动车辆探索，测试了遗忘性轻度 NCD 患者、AD 患者和对照组的情节记忆。\n\
  \n参与者被要求回忆的内容包括离心导航记忆和自我导航记忆（例如记住物品的位置/顺序）以及其他与路线相关的细节。参与者的认知健康是表现不佳的重要预测因子，尽管这种效应在\
  \ AD 患者中比在中度遗忘性 NCD 患者中更为显著（Plancher et al. 2012）。\n\n### 3.3.1.4 日常生活能力 (ADL)\n\
  \n执行日常任务的能力对于显著 NCD 的分类至关重要，这些疾病的特征是导致日常活动面临挑战的认知缺陷。尽管已经开发了许多调查和问卷，但在诊断中使用这一标准具有挑战性，因为它依赖于患者和/或护理者的访谈，这可能具有主观性并受受试者对问题解释的影响。此外，可靠的实施很大程度上受限于门诊环境（Sikkes\
  \ et al. 2009; Bucks et al. 1996; Johnson et al. 2004）。特别是 VR 使得模拟参与者实际上遇到的任务成为可能，从而根据他们处理任务的优劣进行评分。为了筛查早期显著\
  \ NCD，Tarnanas et al. (2013) 开发了一种包含跑步机和曲形屏幕的特殊 VR 设置。参与者必须应对不同难度的生火情境。\n\n研究发现，Bristol\
  \ ADL 和 Blessed ADL 测试对中度 NCD 向 AD 转换的预测准确性低于个人的得分（Tarnanas et al. 2013）。“难忘的一天”是\
  \ Dulau 等人制作的一项 VR 体验，包含游戏化的认知检查以及现实活动。大多数玩家发现该 VR 游戏玩起来简单，并表示比直接的筛选测试压力小。该测试的精确性相当弱，尽管它在功能上与纸笔\
  \ MMSE 相关，且有表明，参与者使用新技术的困难程度可能是一个因素。\n\n### 3.3.1.5 优势\n\n基于 VR 的认知检查的根本益处在于能够在\
  \ 3D 环境下检查视空间推理，这是 AD 和其他 NCD 导致认知能力的关键迹，而标准测试无法捕捉到这一点（Karr et al. 2018）。测试执行简单，允许收集大量试验数据，从而增强分类器的灵敏性/特异性（Zygouris\
  \ et al. 2015, 2017）。此外，由于受控环境可以根据需要轻松调整（Bohil et al. 2011），因此可能会处理现实环境中不实际或不可行的更复杂查询。此外，测试工作的“游戏化”可以通过将活动转变为更具趣味性，减少与传统测试相关的压力（Clay\
  \ et al. 2020）。\n\n\n\n\n基于 VR 的诊断其缺点是，获取必要设备的固定成本比其他测试略高。然而，随着时间的推移，VR 头显设备和设备的价格下降，基于\
  \ VR 的测试和治疗的实用性不断增加（Castelvecchi 2016）。此外，与目前的评估相比，基于 VR 的测试需要更高的管理技能。对社交线索的评估是\
  \ VR 可能具有局限性的另一个认知领域。与 VR 不同，传统的认知检查涉及患者与测试监考人员之间的对话。在 VR 中使用如 `MMSE` 等现代认知评估工具时，管理人员与患者之间缺乏直接的口头交流可能会可能会结果与原始版本不一致。此外，某些\
  \ VR 系统用户会产生晕动，这会损害他们的表现并让他们在使用 VR 系统时感到不适（Sikkes et al. 2009）。VR 体验的某些方面，例如每秒帧数和对急转的限制，可以通过调整来减少不适感（Dulau\
  \ et al. 2019）。像“模拟器晕症问卷”之类的测试可以识别那些在 VR 环境中容易感到恶心的人，这种方式可能会影响他们的结果（Kennedy et al.\
  \ 1993）。VR 和其他数字考试的使用可能会受到普遍技术恐惧症的阻碍（Tarnanas et al. 2013; Dulau et al. 2019）。最近的研究似乎已经解决了一些可用性问题，例如晕动，这可能是技术进步的结果（Clay\
  \ et al. 2020）。随着 VR 技术的发展和普及，这些缺点可能会被更有效地抵消。\n\n## 3.3.2 虚拟现实疗法\n\n### 3.3.2.1\
  \ 背景\n\n对于重度或轻度神经认知障碍（NCDs），目前还没有已知的药物治疗或预防措施。然而，某些行为和生活方式决策可能会减少个人认知障碍的可能性，研究表明\
  \ `AD` 与心理刺激和教育呈负相关（Geerlings et al. 1997）。因此，在寻找有效的药物治疗的过程中，投资于创建可能阻止认知恶化趋势的心理练习是理想的。事实证明，使用计算机环境来增强认知功能是有益的，而且这已经在轻度\
  \ NCDs 的背景下实现。计算机认知训练包括用于磨炼特定认知技能的练习，特别是专门创建的视频游戏（被称为“严肃游戏”）和虚拟现实体验。尽管这些程序并不总是在\
  \ VR 环境下进行，但这些程序显示了游戏化练习具有若干益处。在计算机训练课程之后，人们注意到了认知优势以及某些情感和健康方面的获益（Lampit et al.\
  \ 2014; Hill et al. 2017; Barnes et al. 2009）。研究发现，专门设计和市售的“健身游戏”（如用于 `Nintendo\
  \ Wii` 的游戏）都有助于老年人的平衡能力（Schwenk et al. 2016; Williams et al. 2011）。像“厨房与烹饪”这样要求用户执行认知负担任务或模拟对日常生活至关重要的实际事件的严肃游戏通常深受老年人的喜爱，对认知和独立性有显著的积极影响（Manera\
  \ et al. 2015）。虚拟现实游戏在教授 3D 导航方面具有特殊的前景。抑郁症也是重大 NCD 发生的重要风险因素。将患者浸入虚拟世界中以提升情绪是 VR\
  \ 的一种潜在用途。\n\n### 3.3.2.2 虚拟现实中的练习\n\n对于轻度 NCDs 人群，Lee (2016) 创建了一个期 12 周的虚拟现实健身计划。每周与患者进行三次游戏，总共\
  \ 36 节。在此期间，监测了患者的平衡能力、抑郁情况和生活质量，这三项指标均显示出显著改善。参加传统治疗课程的对照组没有经历任何明显的改善（Lee 2016）。尽管所使用的\
  \ VR 训练计划细节未知，但 Hwang 和 Lee 对 24 名患有轻度 NCD 的老年人使用了 VR 训练计划，发现与对照组相比，他们的平衡能力和认知测试得分有所提高（Hwang\
  \ and Lee 2017）。根据 Htut 等人的研究，VR 视频游戏运动可以同时增强认知功能，但在体力测试方面不如常规活动（Htut et al. 2018）。研究发现，将虚拟世界与流行的训练方法（包括静态自行车）相结合适用于各种老人，并被用户认为具有趣味（Sakhare\
  \ et al. 2019; Ben-Sadoun et al. 2016）。\n\n### 3.3.2.3 虚拟现实中的在线练习\n\n由于 VR 测试在评估患者的导航技能方面非常有效，它们可能对康复这些技能很有帮助。Kober\
  \ 等人使用了基于奥地利的 VR 导航模拟。参与者表现出大脑损伤，而非中度 NCD 或阿尔茨海默病。在 VR 训练课程之后，发现用户在空间认知测试上的整体表现有所提高（Kober\
  \ et al. 2013）。Man 等人发现，基于 VR 的记忆训练在认知问题方面的改善优于参与治疗师引导的记忆训练（Man et al. 2012）。尽管研究参与的总时间很短，但\
  \ Fasilis 等人发现玩严肃 VR 游戏的重大 NCD 患者没有显著改善：训练计划持续了四到五周（Fasilis et al. 2018）。\n\n###\
  \ 3.3.2.4 双任务训练\n\n在双任务训练中，在移动的同时执行具有认知负担的任务。这些任务有助于衡量步态控制，步态丧失是轻度 NCD 的典型特征，在帕金森病中尤为常见（Belghali\
  \ et al. 2017）。Liao 等人开发了一种结合身体和认知训练的双任务 VR 运动计划，他们发现与非 VR 组相比，该计划显著提高了 VR 组的表现，同时也改善了执行功能和步态表现。VR\
  \ 系统将身体锻炼与交互式环境相结合的特殊能力对于解决双任务表现问题很有帮助（Liao et al. 2019）。\n\n### 3.3.2.5 益处\n\n\n\
  \n\n如果拥有必要的设备，基于虚拟现实（VR）的疗法用户可以在家中进行训练（Dockx et al. 2016）。VR 疗法使患者能够在监督练习认知功能。此外，它们还为患者提供了在低风险下练习日常家务的机会。将任务的患者性能数据存储在云端进行分析是非常容易的。此外，某些\
  \ VR 运动计划比传统的体力活动方案更受欢迎（Htut et al. 2018），某些 VR 训练计划的用户将其描述为“有趣的”，这可以鼓励患者对基于 VR\
  \ 的认知训练计划产生从性（Liao et al., 2019）。如前所述，VR 运动使得结合认知成分变得简单（Eggenberger et al. 2015），这可以提供同时的身体和认知益处，这些益处可能受益于运动诱导的神经塑性过程的促进（Eggenberger\
  \ et al. 2015; Foster et al. 2011）。此外，研究显示，VR 的沉浸感在提高空间技能方面起着重要作用。\n\n在四周内，对 33\
  \ 名平均年龄 62 岁的参与者进行了评估，以确定沉浸式（VR）和非沉浸式视频游戏《水果忍者》的影响。VR 运动游戏参与者的抑制和任务切换能力提高，但非 VR\
  \ 小组没有（Huang 2020）。\n\n### 3.3.2.6 负面方面\n\n再次，设备采购的初始成本是一项巨大的固定成本。虽然 VR 有可能让患者独立于临床医生训练心理能力，但实际上，VR\
  \ 设备对于大多数人来说可能太贵，无法在家投资；因此，医生仍然负责监督训练。此外，VR 在培养社交技能方面可能存在局限性。上述研究指出，参与者很大程度上能够耐并享受\
  \ VR 系统，但样本量较小；需要具有更严谨的纳入和排除标准的大型研究，以进一步分析耐受性问题的普遍性。此外，如前所述，一些人在虚拟环境中会产生动症，这种不适感可能会限制或阻止他们使用治疗性\
  \ VR（Sikkes et al. 2009）。此外，严肃游戏通常被认为更适用于轻度神经退行性疾病（NCD）患者，而不是阿尔茨海默病（AD）和严重 NCD；严重\
  \ NCD 患者比轻度 NCD 患者更需要护理人员的协助（Manera et al. 2017）。\n\n### 3.3.3 混合现实与增强现实\n\n增强现实（AR）是将虚拟元素添加到真实世界中，而不是创建一个完全虚拟的区域，这与\
  \ VR 不同。通常使用真实环境的投影，并在其叠加虚拟信息和特征，以增强用户的现实感。“真正的”AR 通常局限于信息显示和非交互式组件，并添加了交互式的、完全虚拟的组件。在现实连续谱上，混合现实位于\
  \ VR 和 AR 之间，在真实世界的呈现中添加了交互式的、完全虚拟的组件（Farshid et al. 2018）。\n\n由于这些系统是“嵌入”的并且获得了社会接受，它们在日常生活中的实际应用受到一定限制。复杂的交互有时需要大量的计算能力，而在公共场所进行手势交互可能会显得突兀或不舒服（Carmigniani\
  \ et al. 2011）。得益于移动设备的普及使用和云计算的引入，移动增强现实（MAR）系统已应用于许多领域，包括导航、教育和娱乐（Chatzopoulos\
  \ et al. 2017）。虽然证明这些点的通常涉及较年轻的学生，而不是老年或认知障碍的人士，但 AR 系统已被证明可以提高学习（Albrecht et al.\
  \ 2013; Kucuk et al. 2016）。还建议将手机端 MAR 应用用于特定任务的游戏化，例如帮助老年人保持水分充足（Lehman et al.\
  \ 2018）。\n\n针对严重 NCD 和 AD 具有众多 AR 应用的 MAR 是为 AD 患者开发的。Rohrbach 等人研究了一种用于 AR 日常活动助手。研究人员评估了\
  \ AD 患者使用 `Microsoft HolLens` 和应用程序 `Therapy Lens` 泡茶的能力。该程序中包含了描述必要步骤的全息提示。可以使用语音命令推进流程。该程序的整体价值尚不清楚，因为接受\
  \ AR 支持的参与者并没有表现更好，而且完成每个任务实际上花费了更长时间。研究人员注意到，某些参与者在回忆如何操作系统存在困难，并推测可能是由于神经退行性疾病患者的学习能力差。尽管一些参与者抱怨\
  \ AR 系统不舒服，另一些人声称没有注意到或记住全息，但参与者仍对其表示了兴趣（Rohrbach et al. 2019）。其他方法，例如随处援助与救援协作（cARe），已被建议作为利用\
  \ AR 预测训练严重 NCD 患者日常活动的方法。值得注意的是`cARe` 具有“超时”选项，它可以再次提示用户并提供当前步骤的说明。该功能在患者分心或忘记任务时可能有用。还使用了基于赞扬的激励措施来鼓励患者。虽然对\
  \ `cARe` 的研究仍在进行中，但初步结果表明，在烹饪方面比书面指示更有用。与 `Therapy Lens` 一样，音频通信存在问题，且系统未能考虑到患者改变阶段顺序（Wolf\
  \ et al. 2018）。\n\n\n\n\nAruanno 等人开发了一款用于 HoloLens 的 MR（混合现实）认知训练器。该训练器使用了两个不同的原型进行测试；第一个是手势控制的；第二个——根据第一个原型的输入进行了更新——是语音和手势双控的。两者都包含了各种基于文本的练习，旨在提高短期记忆和空间记忆，涉及在用户周围环境中投影的箱中寻找特定物品。尽管研究中缺乏对照组，但参与者认为该训练器很有趣，且即使对于不熟悉技术的人来说，第二个原型也是易用的。HoloLens\
  \ 本身旨在减少 VR 系统常见的晕动症和疲劳感，因此报告的不适感非常少。此外，通过放弃 VR 的全沉浸感，MR 使用户能够保持对现实世界的感知。该研究阐明了创建\
  \ MR 认知训练器时必须解决的各种问题，例如文本说明放在什么位置、向用户提供什么样的反馈（声音、视觉等）以及交互技术——反应总体良好。Park 等人利用建立阿尔茨海默病注册登记的联盟（Alzheimer’s\
  \ Association）研究了 MR 认知训练器的效果，发现与传统的认知训练相比，该计划显著增强了视觉空间工作记忆 (Aruanno et al. 2017;\
  \ Park et al. 2019b)。\n\n## 3.4 建议\n\n虽然目前对主要的非痴呆性疾病（NCDs）还没有药物治疗，但早期诊断该疾病对于帮助患者管理以及推进可能导致治愈的研究仍然很有用。此外，基于\
  \ VR 的认知训练和严肃游戏等非药物疗法对于增强和维持认知功能也有帮助。早期诊断目前可以促进患者现在和未来辅助护理方案的决策过程。因此，需要一种针对严重 NCD\
  \ 的实用认知测试。必须同时考虑测试的实用性和科学质量。\n\n画钟测试可能是最实用的认知测试，但它不能充分评估语言能力。`MMSE` 已日益流行并已成为认知调查的标准，可能是实用价值最高的测试。然而，为了最大限地提高准确性、敏感性和特异性，由于相关的知识产权问题以及在测试视觉空间能力方面的缺陷，也许应该考虑\
  \ `ACE` 这样更全面的评估。使用没有相应专利的简单测试，如`全医师认知评估 (GPCOG)`，可能有助于解决知识产权问题。然而，目前还没有广泛使用的可以评估三维视觉空间推理的测试，这是遗忘性轻度\
  \ NCDs 和 AD（阿尔茨海默病）中的关键缺陷。\n\n严重 NCDs 的诊断，认知技能的发展以及抑郁症状的减少，可能都受益于基于 VR 的 3D 环境。随着实现这些技术的手段变得更加普及，在医院和家庭中使用虚拟、增强和混合现实变得更加实用。我们建议开发并检查\
  \ VR 空间评估（如虚拟迷宫），因为显然，使用空间思维的能力对于识别个人的主要 NCD 状况至关重要。这些 VR 程序可以作为认知训练工具，也可以作为测试工具。由于它们允许用户在保持环境意识的同时，仍为游戏和活动提供\
  \ 3D 空间组件，AR 和 MR 技术可能最在家使用。ADL（日常生活能力）任务提供了一种相当容易理解和完成的测试，可用于评估认知障碍的程度。由于 AR 和\
  \ MR 活动增加了参与度，可以鼓励轻重度 NCD 患者完成对维持心理能力至关重要的任务。\n\n## 参考文献\n\n*   Albert, Steven M.,\
