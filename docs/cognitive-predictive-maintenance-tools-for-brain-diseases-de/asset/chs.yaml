  right\\}$$\n\n使用希尔伯特变换，解析信号定义为：\n\n`z`(*t*) = `x`(*t*) + `i`**`y`(*t*) = `a`(*t*)e^(`i`**`theta`(*t*)))\n\
  \n其中\n\n$$a\\left( t \\right) = \\sqrt{x^{2} + y^{2}}$$\n\n以及\n\n`theta`(*t*) =\
  \ arctan(`y`/*`x`*)\n\n在对每个组件执行希尔伯特变换后，原始数据可以表示为如下形式的实部：\n\n$$x\\left( t \\right)\
  \ = \\Re\\left\\{ \\sum\\limits_{i = 1}^{n}a_{\\begin{array}{l} j \\\\\\\\ \\\\\\\
