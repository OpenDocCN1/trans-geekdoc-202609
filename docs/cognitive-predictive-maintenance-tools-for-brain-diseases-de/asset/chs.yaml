  \ and Theoretical Nanoscience）15(1):66–77.\n\n# 9 基于物联网的可穿戴设备疾病治疗进展\n\nSangeeta\
  \ Avinash Tripathi，SKN Sinhgad Institutes of Technology, 印度浦纳\nSanjay Kumar，Amity\
  \ University, 印度拉贾斯坦\nDOI: `10.1201/97810032453`\n\n## 9.1 引言\n\n许多领域领域与技术领域合作。最近我们见证了物联网（IoT）的爆炸式增长，这将加强两者之间的联系。心血管疾病、高血压以及阿尔茨海默病等神经系统疾病只是基于生物流控学、纹身和纺织的可穿戴技术的辅助手段。可穿戴设备作为药物递送系统的有效性增加，导致了个性化医疗的兴起。可穿戴设备存在一些需要解决的问题。本章介绍了旨在使生活更高效、更安全的各种可穿戴设备。\n\
  \n## 9.2 工作动力\n\n物联网是互联网加速增长的下一个逻辑转变。它涉及将设备连接到更大的网络中，并在网络中使用这些数据。所有设备必须具有唯一标识，并使用嵌入式技术感知自身及其环境的数据。数据必须经过连接和分析以做出更明明的决策。物联网为利用以前未发现的信息和洞察来改变工业流程和商业模式提供了巨大潜力。\n\
  \n\n\n\n\n根据 Pantelopoulos 和 Bourbakis (2010) 研究并发表在*世界卫生组织公报》（WHO）上的研究，慢性病导致了全球\
  \ 75% 的死亡人数，并造成了巨大的财务成本。可穿戴技术是指任何可以穿在衣服上或体内的电子设备。它们具有接收器和换能器。接收器负责识别目标分析物。该行业正试图通过应用物理信号来探索心率、血压、皮肤温度、呼吸频率和人体运动等因素（Pantelopoulos\
  \ and Bourbakis 2010; Chan 等 2012; Patel 等 2012; Kim 等 2019），以提取临床相关信息。\n\n痴呆症发病率的不断上升对全球健康在多个方面构成了重大问题。根据\
  \ Hurd 等 (2013) 和 Wimo 等 (2013) 的发现，在经济层面，痴呆症（特别是阿尔茨海默病，AD）是西方成本最高的疾病之一，预计每年花费高达\
  \ 1600 亿美元。这是一笔巨款。阿尔茨海默病是一种退行性脑疾病，通常通过三个主要阶段逐渐进展，分别称为早期、中期和中度或晚期，如 Patel 等 (2012)\
  \ 的研究所示。由于这种疾病以不同的方式影响人们，每位患病的人都可能有一套独特的症状，并以不同的方式通过各个阶段，如 Gupta 等 (2016) 所示。\n\n\
  在过去的十年里，可穿戴生物传感器受到了大量的关注，其中大部分集中在医疗保健行业。预计全球可穿戴传感器在 2017 年至 2025 年间将以约 38% 的复合年增长率（CAGR）增长，其中智能手表的发展速度尤为快。预计在此期间这些传感器的全球市场规模将达到\
  \ 17 亿美元。这种增长在很大程度上由医疗保健系统中个性化医疗的趋势驱动，如 Massaroni 等 (2018) 所示。生物诊断组件和工具笨重、昂贵，且在物联网领域需要专业人员操作。可穿戴技术可以将生物诊断转变为以患者为中心的方法，而不是以医院为中心的方法，尽管目前的技术和智能技术的生成存在一些缺点，包括相关生物识别信息量受限、美观性和舒适度差以及结构笨大。由于人体是一个柔软且弯曲的系统，在这种背景下，突破性的软可穿戴技术具有很高的价值。\n\
