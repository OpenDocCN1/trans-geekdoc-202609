  \ (EMG) 信号。(d) GET 从额头测的开眼和闭眼状态下的脑电图 (EEG) 频率响应显示，仅在闭眼时存在 alpha 波。无论眼睛睁开还是闭合，情况如此。来源：Someya\
  \ 和 Amagai (2019) 以及 Kabiri Ameri 等人 (2017)。](img/fig9_4_B.jpg)\n\n图 9.4 (a) 前臂上刻有石墨烯电子纹身\
  \ (GET)。(b) GET 心电图与商用胸部心电图监测仪的对比。(c) 使用 GET 系统从手臂传输肌电图 (EMG) 信号。(d) GET 从额头测的开眼和闭眼状态下的脑电图\
  \ (EEG) 频率响应显示，仅在闭眼时存在 alpha 波。无论眼睛睁开还是闭合，情况如此。 来源：Someya 和 Amagai (2019) 和 Kabiri\
  \ Ameri 等人 (2017)。]\n\n汗液、唾液、泪水和尿液都是人体产生的分泌物示例，包含了监测和诊断所需的重要指标。这些分泌物对于监测和识别疾病状况等目的是必要的。直接使用可穿戴健康设备\
  \ (HWDs) 是可能的，通过设备与其他平台交互进行使用也是行的。例如，微流控平台具有结合以从多种生物液中提取相关信息的潜力 (Padash et al.,\
  \ 2020)。HWDs 具有利用由各种材料制造的微流控平台的潜力。这些平台的示例包括基于聚合物、纸和微针的微流控设备 (Padash et al. 2020;\
  \ Li et al. 2020)，这些是指缩小到微米尺寸的针。\n\n本节其余部分提供了基于生物液的 HWDs 近期进展概述，并根据生物液的类型进行组织。汗液作为表皮生物液，是人体内部变化的重要指标，因此可以作为化学和生物传感的重要参数。汗液中发现的生物标志物包括代谢产物（如葡萄糖、乳酸和尿素）、蛋白质、核苷酸和电解质（如氯和钠），它们都具有重大的诊断意义\
  \ (Li et al. 2020)。汗液由多种生物标志物组成，每平方厘米皮肤由超过 100 多个腺体产生，使其易于进行化学分析。它分布于全身。因此，它可以用于提取各种化学和生物因子，从而使\
  \ HWDs 在床旁护理环境中提供监测和诊断。这可以通过将汗液作为溶剂来实现 (Rhomas et al. 2020)。\n\n泪水是另一种重要的生物液，可用于各种疾病的诊断和监测。糖尿病就是一个例子。此外，人们还专门为了诊断这种疾病而创建了多种\
  \ HWDs。\n\n糖尿病是一种代谢性疾病，其特征是葡萄糖或血糖水平过高，并且是一种慢性疾病。如果不进行管理，可能会导致包括心脏、眼睛、肾脏、神经和血管在内的多个器官遭受严重损害。预计如果不采取适当措施，糖尿病患者的数量将会增加，特别是在中等和低收入国家。从\
  \ 2000 年的 1.08 亿到 2020 年的 4.63 亿，全球糖尿病患者增加了倍多。\n\n根据世界卫生组织 (WHO) 的建议，预防糖尿病并发症除了保持健康的生活外还需要密切监测血糖。为了确定血液中的葡萄糖含量，开发了传统的便携式血糖计。然而，它需要患者忍受痛苦指刺，这可能会让他们暴露于血源病原体并增加感染风险。尿液是另一种可监测血糖的方法，但操作较困难，并可能受到限制，例如只能在家里使用。用尿液进行的测试远不如血液样本准确。泪水而非血液或尿液，可以作为\
  \ HWDs 中血糖测量的来源，这使其成为比传统监测方法更方便、舒适的替代方案。因此，HWDs 是比传统技术更具吸引力的替代方案。由 Sen 和 Sarin 领导的研究人员进行了一项研究，测量了泪液样本中的葡萄糖含量，并将这些发现与血液样本中的血糖联系起来。这证明了泪水是血糖量的有效方法\
  \ (Sen and Sarin 1980)。\n\n## 9.5 物联网进步下的认知疾病治疗\n\n二十一世纪正见证着快速的数字革命 (Uppal et al.\
  \ 2021)，物联网 (IoT) 已成为近年来的热门词。现实世界中的物理设备或实体可以通过互联网进行管理的观点是一个较新的概念。物联网服务于生活的各个方面；应用包括家居的远程控制、自然灾害警报、健康监测和位置追踪。\n\
  \n“物联网”(IoT) 一术语通常指任何可以在网络范围内通信并交换数据的设备。“事物”或“对象”可以是指任何与其他系统交互以收集数据的嵌入式系统或传感器，例如患者的心率、位置信息、图像识别或运动模式。在这种情况下，“事物”或“对象”也可以指同一物品。\n\
  \n可穿戴技术是驱动物联网的核心技术之一 (Izmailova et al. 2018)。类似地，可穿戴计算已经在多个领域（如娱乐业、工业物流和体育）引入了新的技术、更高效的过程和创新产品\
  \ (Gupta et al. 2012)。没有哪个行业比医疗行业更期待和吸收可穿戴技术 (Amit 等 2018)。可穿戴 IoT 设备结合智能手机应用程序可以是医疗服务的实用选择，作为患者的智能助手。健康、疾病预防、慢性患者护理和其他医学学科都是示例。可穿戴辅助技术描述帮助身体、认知或交流障碍人士提高生活质量的系统或技术。近年来，可穿戴技术鼓励并授权医疗人员超越诊所或办公室，帮助识别健康问题并跟踪疾病进展。\n\
  \n## 9.6 AD 患者专用的便携/可穿戴技术\n\n可穿戴技术是用于远程收集健康数据的传感器。这些电子设备在未来的医疗研究和发展具有巨大潜力，因为它们被设计成全天候并在需要时传输数据。内置在手环上的加速度计是用于被动收集个人活动数据的一种传感器\
  \ (Izmailova et al. 2018)。\n\n\n\n\n\n阿尔茨海默病（AD）的特征是认知能力随时间推移缓慢，包括无法记住近期事件或理解物体之间的空间关系。患有这种疾病的人不仅在记忆方面面临挣扰，在处理视觉信息的能力、甚至在意识以及识别亲人的能力上也存在困难。信息和通信技术的最新进展使得将地球上我们周围的一切连接到互联网成为可能。`IoT`\
  \ 正让这一切成为现实，它可以记录和存储大量被认为非常重要且非常有用的数据。这些知识在训练各种尖端机器学习和深度学习算法时具有巨大潜力。在对患者进行持续健康监测时，基于\
  \ `IoT` 的有用移动健康应用程序和可穿戴设备正在提供协助和支持。\n\n除了减轻医疗系统的压力和降低成本外，这些技术解决方案具有极大提高 AD 患者质量的的。在疾病早期，可穿戴设备和\
  \ `IoT` 策略旨在让患者在没有护理人员或家人协助的情况下，在生活的各个方面保持活跃。例如，对于诊断为 AD 的患者，可以通过治疗或指导的形式提供护理 (Gupta\
  \ et al. 2016)）。\n\n现在许多人正在使用可穿戴设备，但我们仍然需要将 `IoT` 与更先进的 `AI` 技术相结合 (Obulesu et al.\
  \ 2012) 以提高 AD 患者的生活质量 (Salehi et al. 2022)。AD 和其他形式的神经退行性疾病的特征是认知能力的逐渐下降，最终由于大脑无法维持神经连接导致死亡。与神经退行性相关的两个显著生理变化是脑组织的快速流失（称为脑萎缩）和侧脑室的扩大。根据一项研究，AD\
  \ 患者的脑脑萎缩率每年为 `1.9%` (`+/–` `0.9%`)，而健康老年人的该率仅为每年 `0.44%` (Sluimer et al. 2008 和\
  \ Spulber et al. 2010)。\n\n根据科布拉大学神经科学与细胞学中心为该项目编写的报告 (Chan et al. 2012)，AD 在疾病早期通过各种行为变化开始表现症状。如\
  \ 表 9.1 所示，观察到的变化按其频率降序排列。\n\n### 表 9.1 AD 的可观察变化\n\n|    | **感知变化** | **发生率 (%)**\
