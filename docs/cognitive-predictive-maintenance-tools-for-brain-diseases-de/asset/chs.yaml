  \n# 11 精神理解网络中的深度学习\n\nPriya Dev 和 Abhishek Pathak\n\n印度巴纳斯印度大学，瓦纳西\n\nDOI: [10.1201/9781003245346-11](https://dx.doi.org/10.1201/9781003245346-11)\n\
  \n## 11.1 引言\n\n世界卫生组织将精神疾病定义为影响个人思维、行为、情感和情绪的广泛健康疾病和状况，也会影响人的身体健康（Sagar et al.\
  \ 2020）。主要的精神疾病包括抑郁症、焦虑症、成瘾行为、注意力多动障碍（ADHD）、进食障碍和精神分裂症。目前，精神疾病日益普遍，估计全球范围内有 4.5\
  \ 亿人受此问题影响（Su et al. 2020）。此外，18 岁以下的儿童和青少年以及成年人也面临着很高的精神疾病风险（Singh et al. 2021）。\n\
  \n\n\n\n\n尽管个人可能会经常受到心理健康困扰，但只有当持续的症状和征象导致频繁压力并对正常功能能力产生负面影响时，它们才会成为疾病 (Al-Rousan\
  \ et al. 2017)。在全球范围内，按损失年数计算，精神疾病是疾病负担的第二大原因，也是残残调整寿命的主要原因之一。因此，精神疾病对医疗保健体系构成了严峻挑战，特别是在中收入和低收入国家。因此，心理健康已被公认为全球健康政策的重点关注领域，并被纳入联合国的可持续发展目标之中\
  \ (Insel 2018)。\n\n## 11.2 精神疾病不同类别的概述\n\n精神疾病的分类传统上始于发现患者群体之间差异与相似性的实用尝试。目前，精神疾病的分类主要用于报销和行政管理。此外，研究人员还利用这些分类识别患者群体中的同质群体，以便探索其属性以及精神疾病的可能决定因素，包括病因、治疗反应以及结果/结局\
  \ (Martland et al. 2020)。此外，分类作为临床实践和教学指南在近年来也变得重要。早期的行为医学和精神病学大多基于刑事判断和对病因的推测理论；操作性诊断的引入消除了实践中各个方面的神秘感，所识别出的临床特征必须以独立于评估者的方式进行定义、感知，并在可能的情况下进行评估。精神疾病分类的显著成就之一是能够将精神疾病解释为大脑功能障碍。例如精神分裂症最初被认为是一种社会标签和神话，但现在被定义为源于大脑内部不同精神功能的整合，包括可能导致精神障碍的思维处理错误\
  \ (Graham et al. 2019)。\n\n精神疾病的分类代表了精神病学和其他心理健康职业的主要方面，对于可能被诊断的个人来说，这是一个至关重要的问题。目前有两个广泛建立且通用的精神疾病分类系统，即《第十次国际疾病分类》（`ICD-10`）第\
  \ 5 章)。这两个系统列出了被认为是不同种类的精神疾病类别，尽管存在巨大差异，但它们也刻意汇合了独特代码以确保手册之间的可比性。下文将讨论一些显著的精神疾病类别。\n\
  \n### 11.2.1 神经认知障碍\n\n这些认知障碍是一类主要影响认知能力的精神疾病，包括记忆、学习、解决问题和感知。如谵症以及重度及轻度神经认知障碍最初被称为痴呆。认知障碍主要通过后获得的认知能力缺陷（而非发育性缺陷）来定义，其特征是在存在潜在大脑病理的基础上表现为功能下降\
  \ (Ekhtiari et al. 2021)。根据 `DSM-5`，主要领域包括记忆和学习、社会认知、语言、感知运动和注意力。尽管阿尔茨海默病在认知障碍病例中占较大比例，但其他还包括路易体病、帕金森病、亨廷顿病、额颞叶痴呆、创伤脑损伤和痴呆。认知障碍通常根据症状的严重程度被诊断为重度或轻度。认知障碍的主要导致症状是认知功能丧失，尽管病因因疾病而异，但大多数与大脑损伤有关\
  \ (Yochim and Mast 2021)。治疗主要取决于原因和造成的损害。\n\n### 11.2.2 物质滥用障碍\n\n物质滥用障碍主要是成瘾问题。因此，与他人相比，某些个体更容易产生此类障碍。家庭环境功能失调、遗传以及童年期的性及情感虐待环境等是显著的诱因和原因\
  \ (Bzdok and Meyer-Lindenberg 2018)。物质滥用通常会导致类似于精神疾病的症状。这通常发生在中毒和戒断期间。在某些情况下，物质滥用相关精神障碍在排毒后可能会持续一段时间，正如在滥用可因和苯胺后出现的长期抑郁和精神病症。在停止使用后还可能发生慢性戒断综合征，各种症状可能持续数月\
  \ (Quaak et al. 2021)。在这方面，苯二西卓类已被认为是某些引起长期戒断效应的关键药物，观察到其症状在停止滥用后可能持续多年。酒精、苯二西卓类和巴比妥类药物戒断可能是致命的。滥用幻幻剂也被注意到在停止使用很久以后仍会触发精神病和幻觉现象。物质滥用相关精神障碍的诊断通常基于社会损害、高风险行为以及生理/心理依赖的证据。这些精神疾病的显著症状包括耐受性的产生（导致个体需要更多药物或酒精）、对物质的渴望增加，以及停止使用后经历各种戒断症状\
  \ (Vázquez-Abad et al. 2020)。显著的精神疾病类型包括药物使用障碍和酒精使用障碍。\n\n### 11.2.3 精神病\n\n\n\n\
  \n精神病是指一种异常的心理状态，会导致个体在区分现实与非现实时面临挑战。精神病的症状包括幻觉和妄想，以及在特定情况下不恰当的不连贯的行为和言语 (Gkotsis\
  \ et al. 2017)。其他显著症状可能包括睡眠问题、缺乏动力、社交退缩以及执行日常活动的困难。精神病可能对患者产生不利的健康后果。此外，与其他精神疾病一样，精神病有许多不同的成因，包括双相情感障碍和分裂症等精神状况、睡眠剥夺、创伤、某些药物和医疗状况，以及甲基冰毒和大大麻等物质。还观察到在产后会出现产后精神病。在所有精神病病例中，神经递质\
  \ `dopamine` 被认为起着至关重要的作用 (Potes et al. 2018)。当精神病导致精神状态时被认为是急性的，如果是由于药物使用或医疗状况引起的，则被视为继发性的。\n\
  \n### 11.2.4 情绪障碍\n\n情绪障碍，通常称为情感情感障碍，是指一组心理和行为状况，其中个体情绪的扰乱是其核心底层特征 (Maziade 2017)。在这方面，情绪障碍可分为七类：(i)\
  \ 情绪异常高、(ii) 躁狂、(iii) 轻躁狂、(iv) 大度抑郁症、(v) 临床抑郁、(vi) 单极抑郁和(vii) 双相情感障碍。存在多种类型的抑郁障碍，通常具有较轻微的症状，例如心境抑郁障碍伴随心境波动障碍。此外，情绪障碍可能由物质使用引起，甚至可能针对特定的医疗状况而发生。\n\
  \n### 11.2.5 焦虑障碍\n\n焦虑障碍是指一组精神疾病，其特征是相当且不可控制的恐惧和焦虑感，这种程度以至于个体的职业、个人和社交功能受到严重损害。因此，焦虑可能会导致认知和生理症状，包括易怒、坐立不安、注意力集中困难、疲劳、胸痛、心率加快、腹痛以及随人而异的其他症状\
  \ (Horenstein and Heimberg 2020)。存在多种焦虑障碍，包括特定恐惧症、选择性缄默、分离焦虑障碍、广泛性焦虑障碍、恐慌障碍、广场恐惧和社交焦虑障碍。个体障碍的诊断主要通过特定的特殊触发事件、时机和症状来进行。\n\
  \n### 11.2.6 进食障碍\n\n饮食障碍是通过异常进食行为定义的精神疾病，这些行为对个体的心理和身体健康产生负面影响。显著的饮食障碍包括：神经性厌食，其特征是个体对增加重的恐惧、过度运动以及通过限制食物作为应对恐惧的手段；暴食症，受影响者在短时间内摄入大量食物；异食症，其特征是受影响者食用非食物物品；神经性暴食症，其特征是受影响者摄入大量食物后试图将其排出体外；反刍综合征，其特征是受影响者吐出食物。在所有精神病病例中，神经递质\
  \ `dopamine` 被认为起着至关重要的作用 (Potes et al. 2018)。\n\n### 11.3 COVID-19 期间心理健康问题的流行率\n\
  \n范围内，COVID-19 疫情导致了严重的心理和精神健康问题。尽管医疗工作人员和普通人群中报告了负担，但对于康复患者的心理健康状况仍为人知较少。近期关于心理健康的一研究显示，35%的人症状较轻，13%的人患有中度症状\
  \ (Khademi et al. 2021)。其他针对出院 COVID-19 患者的研究表明，10.4% 的患者确认有轻至重度焦虑症状，19% 患有临床抑郁。此外，COVID-19\
  \ 引起的创伤后应激障碍 (`PTSD`) 的诊断率为 12.4%。因此，作为对疫情的反应，心理挑战已成为重要问题。为了应对这些挑战，全球许多国家已实施了包括远程医疗指南、加强心理健康指南和心理健康热线在内的措施\
  \ (Boldrini et al. 2021)。\n\n### 11.4 后 COVID-19 神经精神异常及其临床表现\n\n从 2020 年 3 月疫情开始以来，人们对幸存者神经系统疾病风险增加表达了越来越多的担忧。这种担忧最初基于对其他冠状病毒的研究，随后出现了一系列病例报告、COVID-19\
  \ 参与中枢神经系统 (`CNS`) 的新兴证据以及对其发生机制的认知 (Fiorillo and Gorwood 2020)。类似的担忧也出现在 COVID-19\
  \ 精神后遗症方面，现有证据表明幸存者在感染后三个月内患焦虑和情绪障碍的风险较高。\n\n\n\n\n在这方面，已有报告显示约 30% 的住院 COVID-19\
  \ 患者同时具有延迟性和急性神经精神性表现。此外，即使是无症状和症状较轻的患者，通常也会表现出与神经认知障碍、睡眠节律紊乱、创伤记忆、��妄和疲劳相关的各种情绪障碍。通常，COVID-19\
  \ 后的精神病理始于冷漠、社交互动欲望降低、急性疲劳、睡眠障碍和注意力集中障碍，这些症状的持续会导致明显的抑郁。在明显的临床抑郁症和系统性感染的神经精神后果中，已经注意到包括睡眠改变、快感缺失、疲劳、饮食行为改变以及对社交关系兴趣丧失的症状，尽管悲观、无价值感和绝望是重度抑郁症的典型特征（Daly\
  \ et al. 2022）。在 COVID-19 病毒严重影响后重症监护服务的患者中，此类症状非常普遍。\n\n## 11.5 深度学习\n\n深度学习（DL）是指机器学习的一个子集，基本上是具有三层或更多层的神经网络。此类神经网络试图模拟人类大脑的行为，尽管远未达到其水平，但它使其能够通过从大量数据池中学习来有效学习（Shrestha\
  \ and Mahmood 2019）。即使由单层组成的神经网络能够做出近似预测，额外的隐藏层可能有助于优化和精炼以提高精度。在这方面，最简单形式的深度学习被视为一种预测分析自动化的手段。尽管传统的机器学习算法是线性的，但在深度学习中，算法按照特定的抽象顺序和不断增加的复杂度进行堆叠。\n\
  \n此外，深度学习驱动了多种不同类型的人工智能服务和应用，这些应用以增强自动化著称，能够执行无需人工干预的物理和分析任务。作为一项技术，深度学习是日常服务产品的基础，包括信用卡欺诈检测、语音控制电视遥控器和数字助手，以及包括自动驾驶汽车在内的新兴技术（Wang\
  \ et al. 2019）。深度学习仍然是数据科学的重要方面，包括预测建模和统计。对于负责收集、分析和解释海量数据的数据科学家来说，深度学习也具有巨大的优势，因为它使得过程变得简单而快速。\n\
  \n## 11.6 深度学习在精神障碍分类中的应用\n\n随着时间的推移，深度学习算法在数据分析任务方面取得了巨大成功，这归于它们揭示复杂数据模式的能力。此外，随着新型传感器、处理硬件和数据存储的进步，深度学习算法开始主导不同的领域，包括神经精神学领域（Vieira\
  \ et al. 2017）。针对不同类型的数据存在多种深度学习算法，范围从调查数据到源自功能磁共振（fMRI）的成像扫描。鉴于在神经精神障碍的诊断、预后估计以及治疗反应方面观察到的局限性，深度学习已成为一种日益有前景的方法。因此，深度学习已广泛应用于神经影像数据，目标是识别患有神经和精神障碍的患者。\n\
  \n通常，神经精神障碍的诊断是使用行为标准进行的，这使得诊断变得越来越具有挑战性。在这方面，需要神经成像等生物标志物的目标，与深度学习结合后，可能有助于诊断决策并增加其可靠性（Oh\
  \ et al. 2020）。因此，深度学习与机器学习方法之间的关键区别在于，深度学习允许基于原始数据学习最优特征表示，从而消除了对经典机器学习方法的需求（Craik\
  \ et al. 2019）。其结果包括日益客观和无偏的深度学习过程。2017 年进行的综述表明，深度学习技术应用于阿尔茨海默症、ADHD（多动症）的神经影像和分类以及疾病转换预测中是有效的。\n\
  \n因此，深度学习在精神障碍分类方面已显示出决定性的初步结果。然而，许多研究集中在 ADHD 和痴呆的诊断上，这可能是因为可以访问更多公开的神经影像数据集所致。基于此类数据集和精神疾病，已经实现了高于\
  \ 90% 的平衡精度水平，尽管只有少数研究检查了对疾病轨迹提供预测的能力，包括从轻度认知障碍到阿尔茨海默症的转变，而这对于在初始阶段检测该精神疾病并防止其进展至关重要（Vázquez-Abad\
  \ et al. 2020）。研究正在积累，利用深度学习和神经影像来分类其他精神疾病，包括自闭症、精神分裂症、抑郁症、帕金森病、癫痫和物质滥用障碍。\n\n###\
  \ 11.6.1 精神分裂症\n\n精神分裂症是一种病因不明严重精神障碍，具有多种不同的症状，包括混乱的行为和言语以及视觉和听觉幻觉。精神分裂症还导致患者在疾病期间出现认知障碍。由于缺乏该病的特定症状和临床检测，该疾病的早期干预和诊断非常困难。关于流行率，精神分裂症在全球范围内发生，影响全球约\
  \ 1% 的人口，几乎每 1 万人就有 111.5 人（Srinivasagopalan et al. 2019）。在美国，该疾病影响了 18 岁以上的近 260\
  \ 万人。此外，关于深度学习在精神分裂症中的作用，可以注意到，尽管患病患者体内存在明显的结构异常，但使用 MRI 进行检测是一项挑战。然而，经过训练的深度学习算法已通过应用\
  \ MRI 数据集诊断精神分裂症。最近的研究表明，深度学习算法在检测和诊断中表现出更好的性能，因为它能够从头部 MRI 数据中识别相关的结构方面。因此，深度学习算法在疾病初始阶段的不同患者组具有可接受的分类性能。因此，深度学习已用于描绘精神分裂症的结构特征，并在临床环境中提供辅助诊断数据。\n\
  \n### 11.6.2 ADHD\n\nADHD 指以冲动、活动不符合年龄的不注意力为特征的神经发育障碍。ADHD 的严重程度主要根据 DSM-5 标准根据症状数量和严重程度评估为轻度、中度。ADHD\
  \ 的全球发病率约为 5%。由于其病理机制的复杂性，目前尚未开发出诊断方法。因此，成像参数已用于诊断，它们提供了临床精神评估的重要客观辅助。\n\n\n\n\n\
  深度学习（DL）在多动缺陷障碍（ADHD）的诊断中发挥着重要作用，特别是在儿童中。例如，适当的全连接深度神经网络已用于通过功能连接来识别患有 ADHD 的儿童。观察发现，DL\
  \ 网络在诊断中的准确率达到了 90%，其中患者的 ADHD 辨别发生在脑的小脑和额叶区域 (Durstewitz et al. 2019)。尽管患者之间存在细微的异常，但\
  \ DL 已用于从大脑图像中提取重要信息，以对其分类并区分疾病的亚型。\n\n### 11.6.3 自闭症谱系障碍 (ASD)\n\nASD 指由大脑内部差异导致的发育障碍。ASD\
  \ 的严重程度被分为轻度、中度和重度，取决于所需的支持水平。尽管如此，在患病率方面，世界卫生组织估计全球每 160 名儿童中就有 1 人患有 ASD (Heinsfeld\
  \ et al. 2018)。关于深度学习对 ASD 的作用，可以注意到，它是一个日益充满前景的工具，用于研究跨大规模、异质数据集的模式。因此，DL 在 ASD\
  \ 诊断中利用了包含个人属性、社会反应评分和智商的数据，且与某些现有方法相比，DL 算法能对脑图像数据进行分类。DL 算法利用复杂数据，同时仅需极少的人工干预即可通过无监督学习方法提取相关方面。通过使用\
  \ DL 和无监督方法对临床群体进行分类，能够对与 ASD 相关的神经模式进行探索性搜索，这种方法减少了对特征选择中假设生成的依赖。\n\n### 11.7 深度学习在精神疾病中的最新进展\n\
  \n深度学习是机器学习的一个子集，已广泛应用于学术领域，并在语言处理和视觉识别领域打破了基准记录。与传统的机器学习算法不同，DL 能够通过非线性分层变换直接从原始数据中学习重要的特征和表示\
  \ (Chen et al. 2020)。由于于检测复杂和抽象模式的能力，DL 正越来越多地应用于以弥漫性和细微变化为特征的精神疾病神经影像学研究中。近期对 DL\
  \ 进展的综述揭示了目前用于各种精神和心理健康疾病神经影像的三个不同进展。\n\n首先，自动编码器的发展被认为是深度学习和机器学习领域的一项重大进展。由于头脑图像数据具有内在的高维特性，在模型训练之前需要特征简化方法，这正是自动编码器的重要功能。自动编码器是指一种包含两个关键组件的特定深度神经网络，包括学习生成低维原始输入表示的**编码器**，以及学习利用这些低维表示来重构接近原始输入数据的**解码器**。训练过程涉及重要特征的提取。通过损失函数的变体，通常可以通过改变损失函数来获取自动编码器的变体，通常是去噪自动编码器和稀疏自动编码器。\n\
  \nDL 的另一项关键进展涉及深度信念网络的发展，该模型是成功解决与深度神经网络相关优化挑战的模型之一 (Zhang et al. 2021)。较浅的神经网络通常被称为**受限玻尔兹曼机（RBM）**，是深度信念网络（DBN）的构建块。一个\
  \ RBM 包含一个隐藏层和一个可见层，不同层之间有适当的连接，但层与节点之间没有连接。此外，隐藏层经过训练以使其能够捕捉可见层中发现的随机表示。不同 RBM\
  \ 之间的级联实现了 DBN 的开发，其中上一个 RBM 的隐藏层成为下一个 RBM 的可见层，而上一个 RBM 的输出是下一个 RBM 的输入。层级训练的成功完成使得通过反向传播训练实现了模型的微调。\n\
  \n最后，DL 的另一项进展涉及卷积神经网络的发展和应用。最初的深度神经网络并不擅长处理视觉和图像相关的任务，因为图像被拉伸成向量会导致空间数据丢失，而且若干参数的训练具有挑战性且效率低下\
  \ (Gehrmann et al. 2018)。卷积神经网络灵感来自人类视觉神经系统，被认为适用于各种视觉相关的学习任务。因此，在卷积层中，不同的卷积核的作用类似于视觉神经元，并根据其受限区域在图像上顺序滑动。同时使用多个卷积核来查看与图像相关的不同类型的信息。\n\
  \n### 11.8 机器学习驱动的精准治疗\n\n与社会和环境动态相关的复杂性使得在现实世界背景下识别最佳行为变得具有挑战性。在这种情况下，决策涉及大脑的多个部分，以及在几种精神和神经系统疾病中加剧的通路\
  \ (Komatsu et al. 2021)。理解决策过程对于开发精准精神医学所需的合适机器学习工具至关重要。在一些关键精神疾病中，决策过程存在缺陷，这导致了不良的现实心理健康结果。例如，精神疾病决策中的缺陷源于基础神经心理学程序的异常，包括奖励处理、注意力受损、工作记忆和关联学习\
  \ (Mahmud et al. 2018)。决策过程的缺陷还被认为导致了各种异常行为，包括不遵从医嘱、不进行运动和饮食不当，这些因素反过来可能导致症状加重、生活满意度下降、日常功能受损以及住院和复发等问题。\n\
  \n\n\n\n为了消除决策中的缺陷，特别是在精神障碍的预测、诊断和治疗方面，机器学习已变得越来越得手。例如，机器学习方法提供了一套开发的工具集，能够实现个人层面的精确临床预测。预测模型在理论上位于遗传易感性与个体临床症状及其行为表现之间。使用不同的内表型（endophenotypes）通过及时诊断、疾病分层、更好的治疗和药物选择以及精神护理预后，在精细临床管理方面展现了转化潜力（Naylor\
  \ 2018）。尽管如此，人们仍观察到，各种机器学习模型在预测作为统计质量指标的预测方面保持着长期的关注，并能够根据单次观测（包括个人的神经、遗传和行为评估）预测结果。此外，最近的机器学习方法揭示了功能性纹状体异常与各种精神疾病的严重程度谱之间存在显著相关性，其中功能障碍在精神分裂症中最为严重，在\
  \ ADHD、强迫症和抑郁症中无法区分，而在双极情感障碍中较轻微。\n\n## 11.9 深度学习在精神健康结果研究中的应用\n\n作为近期的人智能技术之一，深度学习（DL）在包括医疗保健在内的多个现实世界应用中显示出卓越性能。深度学习方法旨在通过多层网络结构将输入的原始特征直接映射到输出，并能够捕捉数据的隐藏模式（Miotto\
  \ et al. 2018）。此外，作为机器学习和人工智能的最新进展，利用非线性计算处理层转换数据的深度学习，为从复杂数据中高效获取重要知识提供了新范式。近期，深度学习算法在包括精神保健在内的多个数据密集场景中表现出卓越性能。在最近的一项研究中，深度学习方法在精神病学的新兴应用领域关注主体行为和脑动态，以及在统计环境中嵌入可解释的计算模型（Purushotham\
  \ et al. 2018）。该研究的目标是对现有研究进行范围评估，利用深度学习技术分析与不同精神健康状况相关的各种类型数据。\n\n尽管人工智能在精神病研究中的应用日益广泛，但作为人工智能的一个分支深度学习引发了更多关注。深度学习涉及开发能够自动捕获隐藏数据模式的模型和算法，随后开发直接将输入数据映射到结果端到端技术（Shatte\
  \ et al. 2019）。神经网络和数据模型的创建是为了分析序列数据、遗传临床数据以及图像。在最近的一项研究中，分析了 57 篇描述基于深度学习技术的期刊文章（de\
  \ Bardeci et al. 2021）。研究人员透露，许多研究利用深度学习研究源自功能和结构 MRI 数据的神经影像。这些研究分析的数据有助于加深对抑郁症和精神分裂症相关的脑活动的理解。其他研究集中在利用深度学习分析原始脑电图（EEG）信号数据上。研究人员透露，与\
  \ EEG 有关的时间频谱信息对有效的抑郁症预测至关重要（Sui et al. 2020）。此外，使用深度学习的社交媒体数据分析主要关注压力检测，从而识别抑郁症并准确估计自杀风险。\n\
  \n## 11.10 深度学习的局限性与挑战\n\n深度学习的重要限制和挑战涉及样本量较小以及过拟合风险。因此，各种深度学习模型在训练阶段需要学习数百万个权重，与传统学习技术相比，需要增加样本数量来学习复杂的模式。然而，关于样本数量对于神经影像研究中的深度学习是否有意义目前尚无定论，这可以归于目前可用研究的数量有限。在对有限样本（特别是高维图像数据）上训练深度网络的情况下，模型可能在训练集上表现良好，但在测试集上表现糟糕，这种挑战被称为过拟合（Stead\
  \ 2018）。\n\n因此，深度学习的另一个局限性和挑战涉及数据获取标准的匮乏和数据质量的不均。很大比例的现有研究使用了公开的数据集，包括 ADHD-200\
  \ 和 ADIBE。尽管数据集相对较大，但由于它们源自具有不同场强、成像序列和线圈配置的不同站点，数据仍然是异质的。事实也表明，机器学习模型的性能受到不同成像参数的影响。此外，在功能\
  \ MRI 和弥散成像中广泛使用的回波平面成像（EPI）序列对不均匀性日益敏感，并且在空气和组织交界处的信号丢失和图像失真也变得越来越脆弱，包括颞叶和额叶，这些区域是精神病研究倾向于关注的大脑区域（Ewbank\
  \ et al. 2020）。尽管医学成像和磁共物理领域提出了几种校正技术，但对额外扫描和复杂计算的需求限制了此类校正方法在临床研究中的广泛应用。\n\n##\
  \ 11.11 结论\n\n\n\n\n精神疾病发病率的增加以及对有效心理健康治疗和护理的需求，结合人工智能的发展，导致了人们对机器学习领域、特别是 `DL`（深度学习）的探索日益增加。大多数研究集中在如何将\
  \ `DL` 用于精神疾病的诊断、检测、治疗和预测。正如本章所述，`DL` 具有为人类行为学习模式提供新途径的潜力；精神疾病症状及风险因素的检测；疾病进展预测；以及治疗的优化和定制。尽管\
  \ `DL` 在心理健康领域有多种应用机会，但它仍然是一个新兴研究领域，创建有效的、基于 `DL` 且可在实践中实施的应用程序面临着若干复杂的挑战。尽管如此，鉴于与心理健康相关的\
  \ `DL` 领域目前处于婴儿阶段，在介绍 `DL` 进展时应保持谨慎，以避免对新模型的可能意义和影响做出过早断言。如果考虑到在生成稳健且具有临床可靠性的 `DL`\
  \ 输出方面所面临的复杂性和挑战，这一建议至关重要。为此，现有模型中很大一部分在临床背景下的测试频率很低，这导致在评估其对于增强心理健康治疗和结果的实用性和效率方面存在空白。尽管如此，未来充满希望，因为目前正投入更多工作解决各种未解决的问题，并确保科学不断进步。\n\
  \n## 11.12 总结\n\n总之，世界卫生组织将精神疾病定义为一系列影响个人思考、行为、情感、情绪和身体健康的心理健康障碍和状况。精神疾病与工作、家庭和社交背景下的痛苦以及功能障碍紧密相连。精神疾病已使用两个系统进行分类，即\
  \ `ICD-10` 和 `DSM-5`。这些系统列出了不同的精神障碍类别，尽管存在显著差异，但为了使手册具有可比性，它们汇聚了独特的代码。\n\n在精神疾病的显著类别中包括认知障碍，它指的是一类主要影响认知能力（包括记忆、学习、解决问题和感知）的精神疾病。物质滥用相关障碍是指影响那些极易患上此类精神疾病的人群的药物成瘾性问题。物质滥用会引起类似于精神疾病的症状，并在宿醉和戒断期间尤为明显。精神疾病的另一类是精神病，它是指在建立何为何非现实方面面临困难的异常精神状态。精神病主要以幻觉、妄想和不协调的行为等症状为特征。此外，情绪障碍是精神疾病的另一类别，涉及一系列以情绪扰乱为特征的精神和行为状况。其他显著的精神障碍类别包括焦虑症和进食障碍。\n\
  \n为了有效诊断、治疗和管理精神障碍，`DL` 已被开发并广泛应用。`DL` 指机器学习的一个子集，基本上是一个具有三层或更多层的神经网络，试图模拟人类大脑的行为，尽管远未达到其水平，但使其能够通过从大量数据池中进行有效学习。新型传感器、处理硬件和数据存储的进步，使得\
  \ `DL` 算法能够在神经精神学中应用。因此，`DL` 已广泛用于神经成像数据，目标是识别神经系统和精神疾病的患者。例如，`DL` 已用于描绘分裂症的结构特征，并在临床背景下提供辅助诊断数据。`DL`\
  \ 还用于诊断儿童 `ADHD`（注意力缺陷动障碍），特别是在识别患有该病的儿童方面。因此，在 `ASD`（自闭症谱系障碍）研究中，`DL` 已被用作跨跨异质数据集模式的工具。\n\
  \n在 `DL` 算法及其应用方面已取得了若干进展。近期进展包括`自动编码器`的开发，它指的是一种具有两个组件的深度神经网络：产生低维原始输入表示的 `encoder`（编码器）以及利用低维表示重建接近原始输入数据的\
  \ `encoder`（解码器，注：原文此处两处均为 encoder，后应为 decoder）。尽管 `DL` 在心理健康、治疗和管理方面的应用增加了，但它仍面临若干挑战。例如，`DL`\
  \ 模型在训练阶段需要大量的权重。然而，`DL` 在数据获取方面仍存在某些局限性。\n\n## 致谢\n\n我们感谢医学研究所提供的技术支持。\n\n## 参考文献\n\
