    applications and solutions for planning, producing and promoting a world-class
    virtual event from start to finish. The event included the following:


    +   - Six hours of live broadcasting.

    +   - Fifty-seven countries reached.

    +   - Eight interactive sessions.

    +   - Twenty remote presenters.

    +   - Thirteen thousand people.


    How it all came together: Traditional roles were transitioned to virtual roles
    with similar responsibilities. Multiple cross-functional teams came together from
    around the world to provide their specialized services, including production services,
    technical support, content development, creative design and speaker coaching.


    # Chime Live platform


    ABC University selected Chime Live as a virtual event platform to host the 2020
    convocation. The purpose of the Chime Live platform was to host and enhance the
    university''s reimagined convocation in a way that would allow the university
    to celebrate with ABC learners and the ABC community. Chime Live is a stand-alone
    platform that will not be integrated with or connected to the ABC University-owned
    technology environment.


    Chime Live connects remote presenters and participants with interactive features
    that assist in overcoming distractions and maintaining high engagement levels.
    At home, at work or at the venue, Chime Live simplifies the streaming process
    and easily broadcasts keynote presentations, topic streams and planned breakouts.
    The purpose of this solution is to enhance the learners'' experience during the
    reimagined convocation ceremony by allowing some live interaction. This approach
    is consistent with learners'' expectations for an in-person ceremony because it
    allows them to interact and connect with their fellow graduates.


    The desired goals and supporting objectives for the convocation that would be
    realized as a result of utilizing Chime Live include the following:


