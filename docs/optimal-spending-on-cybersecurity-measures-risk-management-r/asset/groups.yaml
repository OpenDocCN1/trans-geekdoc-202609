  mdcn: "\n\n- 网络安全，包括防病毒防护和入侵预防与检测。\n- 硬件，包括服务器、电信设备、存储阵列和可移动介质。\n- 软件。\n- 数据。\n\
    - 服务。\n- 供应商的角色和响应。\n\n## 规划演练\n\n为确保演练不会导致事件或削弱服务能力，应仔细规划以最大限度地降低因演练直接导致事件发生的风险。这种风险管理——即服务恢复的要素——应与所进行的演练级别相适应。这可能包括以下内容：\n\
    \n- 确保在演练前立即备份所有数据。\n- 在隔离环境中进行演练。\n- 将演练安排在“非工作时间”或业务周期的安静时期进行，并了解最终用户的主要和次要桌面流程恢复模拟。\n\
    \n演练应真实、经过仔细规划并与利益相关方达成一致，以最大限度地降低对业务流程造成中断的风险。演练的规模和复杂性应与组织的恢复目标相适应。\n\n每项演练都应有“参照条款”，由演练发起人预先同意并签字批准，可能包括以下内容：\n\
    \n- 描述。\n- 目标。\n- 范围。\n- 假设。\n- 约束。\n- 风险。\n- 成功标准。\n- 资源。\n- 角色和职责。\n- 高级时间表/日程。\n\
    - 演练数据捕获。\n- 演练/事件日志记录。\n- 总结。\n- 演练后行动、后续跟进和报告。\n\n演练应规划为使组织能够实现已识别的成功标准。\n\n\
    ## 管理演练\n\n应建立清晰的演练指挥结构，并将角色和职责分配给适当的个人。演练指挥结构可能包括以下内容：\n\n- 演练指挥官和参与者，对测试和演练拥有整体控制权。\n\
    - 演练通信。\n- 确认有足够的工作人员可安全开展演练。\n- 足够的观察员和/或协调员，以记录演练过程并维护问题日志。\n- 演练关键里程碑。\n- 演练结束协议。\n\
    - 演练紧急停止协议。\n\n演练指挥应确保以下内容：\n\n- 目标和关键里程碑得以实现。\n- 所有演练材料和活动都具有适当的保密级别。\n- 任何持续风险都受到监控和缓解。\n\
    - 任何访客/观察员都已获授权。\n- 演练过程以一致的方式记录。\n- 所有参与者都接受总结，并汇总反馈。\n\n## 验证、审查和评估信息安全连续性\n\
    \n组织应定期验证已建立和实施的信息安全连续性控制措施，以确保它们在不利情况下仍然有效且适用。无论是在运营环境还是连续性环境中，组织、技术、程序和流程的变化都可能导致信息安全连续性要求的变化。在这种情况下，应针对变更后的要求审查信息安全的流程、程序和控制措施的连续性。\n\
    \n组织应通过以下方式验证其信息安全管理连续性：\n\n- 演练和测试信息安全连续性流程、程序和控制措施的功能，以确保它们与信息安全连续性目标一致；\n-\
    \ 演练和测试操作信息安全连续性流程、程序和控制措施的知识和常规，以确保其性能与信息安全连续性目标一致；以及\n- 当信息系统、信息安全流程、程序和控制措施或BCM/DR管理流程和解决方案发生变化时，审查信息安全连续性措施的有效性和适用性。\n\
    \n## 审查、报告和后续跟进\n\n演练结束时，应及时审查和跟进调查结果。这应包括以下内容：\n\n- 收集结果和调查结果。\n- 就演练目标和成功标准分析结果和调查结果。\n\
    - 识别任何差距。\n- 分配带有明确时间表的行动事项。\n- 创建演练报告，供演练发起人正式审议。\n- 汇总并跟进演练报告中的行动事项。\n\n## IRBC内部审计\n\
    \nIRBC内部审计计划应定义并记录审计标准、范围、方法和频率，且IRBC内部审计应每年进行一次。审计计划应确保仅任命合格的内部审计员执行审计。审计员的选拔和审计的执行应确保审计过程的客观性和公正性。进行IRBC内部审计的审计员应具备胜任该任务的能力。例如，他们应接受相关审计员培训以获得必要的技能和知识。\n\
