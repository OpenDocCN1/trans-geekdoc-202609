    # Case study #2: Chime Live solution


    As part of its 50th celebrations and in response to learner surveys, ABC University
    had two in-person convocation ceremonies planned for 2020: one at ABC on September
    18 and another in Toronto on October 2. Due to the COVID-19 pandemic, ABC University
    made the difficult decision to cancel its in-person convocation ceremonies planned
    for 2020. Delivering an engaging and impactful convocation for ABC learners is
    an important foundational commitment to the university’s learners and community.
    For this reason, the university selected Chime Live as a virtual event platform
    to host the 2020 convocation. ABC had an opportunity to reimagine the convocation
    in its 50th year in a way that would set it apart from other post-secondary institutions
    and truly highlight its “digital-first” mandate. The Chime Live platform would
    provide this opportunity, as it is a “virtual event” platform that enables live
    interactions among learners, guests and ABC team members.


    In spring 2020, the world faced an unprecedented situation, with countries locked
    down, stay-at-home orders in place and, for the meetings and events industry,
    the inability to gather. Questions arose regarding the immediate need for virtual
    meetings. To help industry professionals bridge the gap, PSAV and its family of
    companies produced a global webcast on April 2, 2020, that featured a team of
    experts. The team described real-life'
