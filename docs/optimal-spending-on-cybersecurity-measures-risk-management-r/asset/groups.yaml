    \ new ICT services should include sign-off that resilience has not been compromised\
    \ by even the simplest upgrades or improvements.\n- Due diligence on merger and\
    \ acquisition activity should include a resilience assessment.\n- ICT component\
    \ decommissioning should be reflected within related IRBC management systems.\n\
    \n## Monitoring, detection and analysis of threats\n\nThe organization should\
    \ establish a process to continuously monitor and detect the emergence of ICT\
    \ security threats, including but not limited to the following areas:\n\n- Retention\
    \ of staff, skills and knowledge.\n- Management of facilities to house ICT equipment—that\
    \ is, by monitoring the amount and nature of security.\n- Incidents/vulnerabilities\
    \ related to computer rooms.\n- Changes in supporting technology, plants, equipment\
    \ and networks.\n- Changes in information applications and databases.\n- Finance\
    \ or budget allocation.\n- The effectiveness of external services and suppliers.\n\
    \n## Testing and exercising\n\nThe organization should test not only the recovery\
    \ of the ICT service but also the protection and resilience elements to determine\
    \ whether\n\n- the service can be protected, maintained and/or recovered regardless\
    \ of the incident severity,\n- the IRBC management arrangements can minimize the\
    \ impact on the business and\n- the procedures for returning to business as usual\
    \ are valid.\n\n### Test and exercise programme\n\nIn most instances, the whole\
    \ set of IRBC elements and processes, including ICT recovery, cannot be proved\
    \ in one test and exercise.\n\nA progressive exercising regime might therefore\
    \ be appropriate for building a full simulation of a real incident. The programme\
    \ should include different levels of exercise, from familiarization to computer\
    \ room resilience, and should consider all aspects of end-to-end ICT service delivery.\n\
    \nThere are risks associated with tests and exercises, and such activities should\
    \ not expose the organization to an unacceptable level of risk. The test and exercise\
    \ programme should define how the risk of individual exercising is addressed.\
    \ Management sign-off on the programme should be obtained, and a clear explanation\
    \ of the associated risks should be documented.\n\nThe test and exercise programme\
    \ objectives should be fully aligned with the wider BCM scope and objectives and\
    \ should complement the organization’s broader exercise programme. Each test and\
    \ exercise should have both business objectives, even where there is no direct\
    \ business involvement, and a defined technical objective to test or validate\
    \ a specific element of the IRBC strategy.\n\nExercising individual elements in\
    \ isolation at the component level is complementary to full system exercising\
    \ and should be maintained as part of an ongoing test and exercise programme.\n\
    \nThe test and exercise programme should define the frequency, scope and format\
    \ of each exercise. The following are high-level examples of exercise scope:\n\
    \n- Recovery of a single data file or database following corruption.\n- Recovery\
    \ of a single server, including a full rebuild.\n- Recovery of an application,\
    \ which may consist of several servers, sub-applications and infrastructure.\n\
    - Failover of services hosted on a high-availability platform—that is, clustering\
    \ simulating the loss of any member of a cluster.\n- Data recovery from tape—that\
    \ is, recovery of single files or series of files from offsite tape storage.\n\
    - Network testing.\n- Communications infrastructure failover tests.\n\nExercises\
    \ should be progressive to include an increasing test of dependencies and interrelationships\
    \ and relevant end-user communities.\n\n### The scope of exercise\n\nExercising\
    \ should be carried out to\n\n- build confidence throughout the organization that\
    \ the resilience and recovery strategy will meet the business requirements;\n\
    - demonstrate that critical ICT services can be maintained and recovered within\
    \ agreed-upon service levels or recovery objectives regardless of the incident;\n\
    - demonstrate that the critical ICT services can be restored to the pre-test state\
    \ in the event of an incident at the recovery location;\n- provide the opportunity\
    \ for staff to familiarize themselves with the recovery process;\n- train staff\
    \ and ensure that they have adequate knowledge of IRBC plans and procedures;\n\
    - check that IRBC remains synchronized with ICT infrastructure and general infrastructure;\n\
    - identify any improvements required for the IRBC strategy, architecture or recovery\
    \ processes; and\n- provide evidence for audit purposes and demonstrate the organization’s\
    \ ICT service competence.\n\nExercising should apply to the entire ICT environment\
    \ and all the components that deliver end-to-end service, from the computer room\
    \ through the user desktop or any other service delivery channel.\n\n### Elements\
    \ of service recovery\n\nThe organization should exercise all elements of the\
    \ ICT service recovery as appropriate for its size, complexity and BCM scope.\
    \ The exercise should not focus solely on service recovery and resumption but\
    \ should include the reliability of resilience capability, system monitoring and\
    \ alert management. The organization should exercise from the component level\
    \ through full location-based system testing to achieve high levels of confidence\
    \ and resilience.\n\nThe following elements should be exercised:\n\n- Computer\
    \ rooms: Physical security, fire and water leak detection systems and evacuation\
    \ processes.\n- Heating, ventilation and air conditioning; environmental monitoring\
    \ and alert protocols and electrical services.\n- Infrastructure, including the\
    \ overall resilience of the network connectivity and network diversity.\n\n"
