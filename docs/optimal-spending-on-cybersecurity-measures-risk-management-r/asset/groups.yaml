    new features that expose the organization to new security, reliability, or compliance
    risks".


    Continuous testing is not just a QA function; in fact, it starts in the development
    environment. Developers build quality into the code and provide test data sets.
    QA engineers configure automation test cases and the testing environment.


    On the QA side, speed is essential. Test engineers meet the challenge of quick
    turnaround not only by automating the test process but also by redefining test
    methodologies:


    > Continuous testing creates a central system of decisions that helps you assess
    the business risk each application presents to your organization. Applied consistently,
    it guides development teams to meet business expectations and provides managers
    visibility to make informed trade-off decisions to optimize the business value
    of a release candidate.

    > –Continuous Testing for IT Leaders, Parasoft.


    Operations can ensure that monitoring tools are in place and test environments
    are properly configured. They can participate in functional, load, stress and
    leak tests and offer analysis based on their experience with similar applications
    running in production.


    The test function in a DevOps environment helps developers balance quality and
    speed. Using automated tools reduces the cost of testing and allows test engineers
    to leverage their time more effectively. Most importantly, continuous testing
    shortens test cycles by allowing integration testing earlier in the process.


    Continuous testing also eliminates testing bottlenecks through virtualized, dependent
