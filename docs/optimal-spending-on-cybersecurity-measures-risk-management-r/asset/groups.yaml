    be possible to define what “normal” looks like until sometime after the incident;
    therefore, it might not be possible to implement recovery plans immediately. The
    organization should therefore ensure that continuity arrangements are capable
    of extended operation in support of wider business continuity, allowing time for
    the development of “back-to-normal” recovery plans.


    # Content of plan documents


    The organization’s ICT response and recovery plans should be concise and accessible
    to those with responsibilities defined in the plans. Plans should contain the
    elements discussed in the following sections.


    # Purpose and scope


    The purpose and scope of each specific plan should be defined, agreed upon by
    management and understood by those who will invoke the plan. Any relationship
    to other relevant plans or documents within the organization, particularly to
    BCPs, should be clearly referenced, and the method of obtaining and accessing
    these plans should be described.


    Each incident management and ICT response and recovery plan should establish prioritized
    objectives in terms of the following:


    +   - The critical ICT services to be recovered.

    +   - The time frame in which they are to be recovered.

    +   - The recovery level needed for each critical ICT service activity.

    +   - The situation in which each plan can be invoked.


    Plans may also contain, where appropriate, procedures and checklists that support
    the post-incident review process.


    # Roles and responsibilities


    The roles and responsibilities of the people and teams with authority, in terms
    of both decision-making and authority to spend during and following an incident,
    should be clearly documented.


    # Plan invocation


    Invariably, time lost during a response cannot be regained. It is almost always
    better to initiate an ICT response and subsequently stand it down than to miss
    an opportunity to contain an incident early and prevent escalation. Therefore,
    the organization should use the incident management escalation and invocation'
