    institutions around the world. Currently, ABC University uses Maple TA, which
    is a vendor-built, on-premises testing and assessment software solution. The intent
    of this initiative is to migrate this platform to a software-as-a-service (SaaS)
    version of this solution known as Möbius. The Möbius Platform offers an interactive,
    online approach for ABC University students interested in pursuing science, technology,
    engineering and math courses. This initiative will also facilitate integration
    with the university’s learning management system (LMS). The students’ information,
    grades and courses will reside within this application.


    ### Questions


    - 1. Determine the inherent risk.

