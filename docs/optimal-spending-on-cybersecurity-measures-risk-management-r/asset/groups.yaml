    图 7.3 数字化网络安全风险管理评估流程（Kissoon, 2020）。


    ## 风险评估流程


    风险评估流程识别关键风险要素，一些示例如下：


    - 1 数据分类。

    - 2 战略/业务需求。

    - 3 应用程序开发。

    - 4 供应商关系。

    - 5 技术格局。

    - 6 法律/监管问题。

    - 7 品牌/声誉问题。

    - 8 运营问题。

    - 9 财务问题。

    - 10 安全和欺诈问题。


    ## 威胁建模


    威胁建模使得在保护有价值事物的背景下，能够识别、传达和理解威胁及其缓解措施。威胁建模可应用于广泛的项目，包括软件、应用程序、系统、网络、分布式系统、


    ## 表 7.1 威胁风险评估示例（Kissoon, 2020）。


    | 威胁 | 威胁类型 | 风险等级 | 缓解措施 | Microsoft Teams 中的缓解措施 |

    |---|---|---|---|---|

    | 欺骗：进程、机器、人员 | 冒充 | 高 | 访问控制身份验证 | 使用电话或短信实施多因素身份验证 (MFA)<br>• 一次性密码<br>• 条件访问策略
    |

    | 篡改：进程、内存 | 恶意代码 | 高 | 完整性权限 | 高级威胁防护 (ATP) |

    | 否认：进程、人员 | 冒充 | 高 | 责任追究<br>欺诈预防<br>日志记录<br>签名 | 信息屏障<br>• 电子发现：日志记录、保留：团队聊天、消息传递、与
    MS Stream 集成用于视频 |

    | 进程中的信息泄露 | 恶意代码<br>数据泄露 | 高 | 机密性<br>权限<br>加密 | 安全链接<br>• 数据丢失防护 (DLP) |

    | 信息泄露：数据存储、数据流 | 钓鱼<br>数据泄露 | 高 | 机密性<br>权限<br>加密 | 安全链接<br>• DLP |

    | 拒绝服务 | 破坏 | 高 | 可用性 | 审查云设计 |

    | 特权提升 | 冒充 | 高 | 访问控制<br>授权<br>隔离 | 自定义策略设置：共享敏感信息<br>• 信息屏障 |


    ## 表 7.2 威胁风险评估示例（Kissoon, 2020）。


    | 可能出错的情况 | 威胁类型 | 缓解措施 |

    |---|---|---|

    | 1 缺乏具有适当管理批准的用户访问管理流程 | 身份验证 | 1 已建立经批准的用户 (AU) 访问管理流程。<br>2 凭据和身份验证机制在存储和传输过程中均受加密保护。<br>3
    协议能够抵御暴力破解、字典和重放攻击。<br>4 强制执行强密码策略。<br>5 使用受信任服务器身份验证而非 SQL 身份验证。<br>6 密码使用带盐哈希存储。<br>7
    密码重置不会泄露密码提示或有效用户名。<br>8 账户锁定不会导致拒绝服务攻击。<br>9 启用所有管理活动的审计和日志记录。 |

    | 2 创建未经授权的管理员/等效管理员账户 | | |

    | 3 创建流氓账户 | | |

    | 4 滥用管理员/等效管理员账户 | 授权 | 1 使用强访问控制列表 (ACL) 来强制执行对资源的授权访问。<br>2 使用基于角色的访问控制来限制对特定操作的访问。<br>3
    系统对用户和服务账户遵循最小权限原则。<br>4 在表示层、业务层和数据访问层中正确配置了特权分离。<br>5 启用所有管理活动的审计和日志记录。 |

    | 5 滥用流氓账户 | | |

    | 6 恶意代码注入 | | |

    | 7 更改当前配置设置 | 配置管理 | 1 使用最小权限进程，服务账户没有管理功能。<br>2 启用所有管理活动的审计和日志记录。<br>3 限制管理员访问配置文件和管理员界面。
    |

    | 8 发起钓鱼攻击的能力 | | |

    | 9 信息泄露 | 存储和传输中的数据保护 | 1 使用标准加密算法和正确的密钥长度。<br>2 使用哈希消息身份验证码 (HMAC) 保护数据完整性。<br>3
    密钥（即密钥、机密数据）在传输和存储过程中均受加密保护。<br>4 使用内置安全存储来保护密钥。<br>5 不以明文发送凭据或敏感数据。 |

    | 10 更改应用程序代码 | 数据验证/参数验证 | 1 强制执行数据类型、格式、长度和范围检查。<br>2 验证从客户端发送的所有数据。<br>3 没有安全决策基于可操纵的参数（例如
    URL 参数）。<br>4 使用白名单验证进行输入过滤。<br>5 使用输出编码。 |

    | 11 中断应用程序的能力 | 错误处理和异常管理 | 1 所有异常均以结构化方式处理。<br>2 在发生错误和异常时，将特权恢复到适当级别。<br>3
    对错误消息进行清理，以确保不会向攻击者泄露任何敏感信息。 |

    | 12 敏感信息泄露 | 用户和会话管理 | 1 Cookie 中不以明文存储任何敏感信息。<br>2 身份验证 Cookie 的内容已加密。<br>3
    Cookie 配置为过期。<br>4 会话能够抵御重放攻击。<br>5 使用安全通信通道保护身份验证 Cookie。<br>6 执行关键功能时，强制用户重新进行身份验证。<br>7
    会话在注销时过期。 |

    | 13 恶意活动未被察觉 | 审计和日志 | 1 不记录敏感信息（例如密码、PII）。<br>2 对日志文件强制执行访问控制（例如 ACL）以防止未经授权的访问。<br>3
    对日志文件强制执行完整性控制（例如签名）以提供不可否认性。<br>4 日志文件为敏感操作和关键事件的日志记录提供审计跟踪。<br>5 在多个服务器的各层级中启用审计和日志记录。
    |


    物联网和业务流程。识别和分类威胁的一种方法是 STRIDE，这是一种了解使业务资产面临风险的威胁的有效方法。


    示例：威胁风险评估——Microsoft Teams 构建在 Office 365 超大规模企业级云上，并提供以下安全和合规功能。


    漏洞：匿名个人可以使用访客账户连接到 Microsoft Teams。


    ## 风险优先级：评估固有风险


    风险评估流程基于问卷，为每个风险要素制定一组问题。问题类别的示例包括以下内容：


    - 财务损失。

    - 媒体关注。

    - 需向监管机构报告。

    - 对供应商和员工的影响。

    - 信息系统损失或损坏，停机时间非常有限。


    每个问题可以以五种方式之一回答，风险程度递增，以便根据两个评分标准（即可能性和影响）为该问题分配 1 到 5 之间的风险评分。可以为每个问题、每个风险要素和整个项目计算定量固有风险评分，如下所示：


    - 每个问题的风险评分：可能性和影响评分的乘积。

    - 每个要素的风险评分：累加每个问题的数值评分，然后除以风险要素的问题数量。

    - 整体计划的风险评分：累加每个风险要素的数值评分，然后除以每个项目中的风险要素数量。


    此定量固有风险评分被分配一个定性风险评分，分类为高、中或低。定性固有风险评分显示哪个要素承担的风险最大，从而使决策者更容易决定在哪里分配资源。


    ## 影响评分标准


    表 7.3 显示了基于 1–5 评分的影响评分定量标准。


    '
