    # Suppliers


    The organization should ensure that critical suppliers are able to support the
    IRBC service capabilities required by the organization. These suppliers should
    have their own documented and tested business continuity and IRBC plans with the
    capacity to support concurrent activations of incident or recovery plans by customers.
    The organization should establish a process to evaluate the capacity and capability
