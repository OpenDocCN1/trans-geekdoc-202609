    \ 索引 151\n\n## 前言\n\n本书的目的是讨论组织在使用概念性网络安全风险管理框架时进行网络安全投资的决策过程。大多数概念模型考虑动态环境，该环境可适应决策过程中发生的变化。这些模型和框架依赖于特定场景或受控条件。由于网络安全行业内部的动态环境，缓解策略不断演变以应对新兴行业威胁。这些变化影响了先前框架和经济模型中使用的条件。组织内部关于网络安全支出的决策因利益相关者而异——具体来说，可用资金与合规所需推荐安全措施之间的对比。这些高管决策可能因对组织内保护相关信息资产所需的适当安全基线的偏见而带有色彩。实施安全措施的成本与实施所获益处之间的权衡不易衡量。因此，缺乏此信息可能会影响企业领导者为安全措施提供资金的决策，以及为推动创新、业务增长和客户满意度而进一步投资于开发新技术的选择。\n\
    \n本书关注组织在实施网络安全措施时所做的战略决策，属于风险管理领域，借鉴了 (1) 经济学、(2) 组织决策和 (3) 网络安全领域内的各种模型，以确定网络安全措施的最优支出，其中包括面向承担风险组织的预防性方法。本书提供了一个网络安全风险管理框架，并通过案例研究展示了该流程的应用。本书讨论了组织中的风险管理实践，并定义了将网络安全风险降至最低的战略方法。\n\
    \n本书通过协助企业领导者在实施网络安全措施时选择适当的风险缓解策略，为行业做出了贡献。该框架在组织内的应用将协助利益相关者做出有关网络安全支出的决策。通过审查其他研究，本书旨在利用案例研究方法论，证明在实施网络安全措施时，基于风险的决策是必要的。案例研究方法论深入探讨了承担风险组织在教育环境范围内的风险缓解策略，重点关注数字网络风险模型中确定的以下五个领域：(1)\
    \ 技术格局，(2) 数据分类，(3) 风险管理实践，(4) 网络安全措施的成本效益分析，(5) 业务目标。\n\n"
