  mdcn: "\n\n## 风险处理\n\n## 风险修改\n\n引入一个可能对风险产生正面或负面影响的额外因素。\n\n## 风险转移\n\n识别转移风险的方式和手段，无论是通过购买保险（即网络保险）还是通过外包。\n\
    \n## 风险规避\n\n选择不开展会导致风险出现的业务活动。\n\n## 风险接受\n\n对已识别的风险水平进行有意识和深思熟虑的接受，不通过修改或转移进行任何其他变更。\n\
    \n## 风险修复\n\n选择一系列策略、技术和程序，以减少资产被攻破的易感性。\n\n## 风险沟通\n\n风险沟通是传播信息和改善对风险管理决策理解的重要工具。这种理解和信息使利益相关者能够就决策将如何影响其利益和价值做出明智的决策。\n\
    \n## 风险监控与审查\n\n风险监控与审查是识别、分析和规划新发现风险以及管理已识别风险的过程。在整个过程中，风险所有者跟踪已识别的风险，揭示新风险，实施风险响应计划并评估风险响应计划的有效性。\n\
    \n![](img/8bcb92bad95ddd74218ba966f2798d54_31_0.png)\n\n图 3.3 基础风险管理流程（MITRE 研究所，2007）。\n\
    \n## 损失事件管理\n\n理解和管理损失事件对于有效的操作风险管理计划至关重要。此过程包括损失事件的频率、金额、类型和来源以及损失事件的综合列表。\n\n\
    ## 安全度量\n\n度量可以提供有关信息安全计划有效性、法规遵从水平以及员工和部门处理其负责的安全问题的能力的洞察。度量还可以帮助识别不采取某些缓解措施的风险水平，从而为优先投资未来资源提供指导。由于度量提供了传播风险的具体事实和共同词汇，因此还可用于提高组织内的安全意识水平。\n\
    \n安全度量是通过收集、分析和报告相关绩效数据来促进决策、改进绩效和问责制的工具。IT 安全度量基于 IT 安全绩效目标和宗旨。\n\n有效的度量通常被称为\
    \ SMART（具体、可衡量、可达成、可重复和时效性）。这些度量还应指示安全目标实现的程度，并促进改进组织整体安全计划的行动。需要考虑以下几点：\n\n-\
    \ 收集特定度量的准确数据可能有多困难。\n- 度量可能被误解的潜在风险。\n- 定期审查正在跟踪的度量并根据需要进行更改的必要性。\n\n## 关键绩效指标\n\
    \n关键绩效指标（KPI）是一种常用的绩效衡量标准，用于帮助组织定义和评估其成功程度，通常以朝着长期组织目标取得进展为准。\n\n以下是一些可跟踪且易于向相关利益相关者展示的明确网络安全度量示例。\n\
    \n- **准备程度**：组织网络上有多少设备已完全打补丁并保持最新？\n- **内部网络上的未识别设备**：组织网络上有多少此类设备？\n- **入侵尝试**：攻击者攻破组织网络的次数是多少？\n\
    - **平均检测时间（MTTD）**：安全威胁未被察觉的时间有多长？MTTD 衡量组织意识到潜在安全事件所需的时间。\n- **平均解决时间（MTTR）**：一旦发现威胁，组织需要多长时间来响应？\n\
    - **打补丁天数**：组织实施安全补丁需要多长时间？\n- **网络安全意识培训结果**：谁参加了（并完成了）培训？他们是否理解了材料？\n- **报告的网络安全事件数量**：用户是否向组织报告网络安全问题？\n\
    - **安全评级**：通常，向非技术同事传达度量的最简单方式是通过易于理解的记分卡。\n\n## 关键风险指标\n\n关键风险指标（KRI）是管理层用来指示与活动相关的风险的衡量标准。KRI\
    \ 是组织用来提供企业各个领域风险敞口增加早期信号的度量。\n\n### KRI 示例\n\n- 信息安全培训完成度。\n- 政策例外/偏差。\n- 钓鱼活动失败率。\n\
    - 未解决的审计发现。\n- 风险评估评级。\n- 按系统划分的补丁覆盖率。\n- 事件和事故。\n- 违规/泄露。\n- 按严重性和年龄划分的漏洞。\n\
    - 账户管理。\n\n## 风险文化与风险行为\n\n风险文化是组织中存在的价值观和行为体系，它塑造了管理层和员工的风险决策。风险文化的一个要素是对组织及其业务目的的共同理解。\n\
    \n组织的风险文化可能会：\n\n- 决定组织政策被员工内化并在日常行为中体现的程度，\n- 决定员工对超出明确规定的操作指南的威胁或情况的响应，以及\n\
    - 影响组织在监管机构、客户和更广泛市场中的声誉。\n\n## 4 风险管理实践 – 漏洞管理\n\n补丁和漏洞管理是一种旨在主动防止利用企业系统中存在的\
    \ IT 漏洞的安全管理实践。预期结果是减少组织在处理针对组织的意外/故意攻击（即恶意软件/勒索软件）的影响时所花费的时间和资金。主动管理系统中的漏洞将减少或消除被利用的潜在可能性。将此实践整合到风险管理实践中，为高管团队提供了关注点，即当现有漏洞得到适当监控时，其组织所承担的适当风险水平。\n\
    \n![](img/8bcb92bad95ddd74218ba966f2798d54_34_0.png)\n\n图 4.1 漏洞管理流程的要素（Huntsman，2017）。\n\
    \n补丁是开发用于解决软件中通常称为错误的问题的附加代码片段。它们可启用额外功能或解决程序中的安全缺陷。漏洞是恶意实体可以利用的缺陷，以获取其在计算机系统上被授权拥有之外的更大访问权限或特权。并非所有漏洞都有相关补丁；因此，系统管理员不仅必须了解适用的漏洞和可用的补丁，还必须了解其他修复方法——即设备或网络配置更改以及限制系统暴露于漏洞的员工培训。\n\
    \n组织应实施漏洞管理计划，通过识别、分类、修复和缓解漏洞的全面且持续的过程来解决其信息安全漏洞。\n\n### 维护资产清单\n\n组织内的利益相关者应维护\
    \ IT 资源的资产清单，以确定正在使用的硬件、操作系统（OS）和软件应用程序的类型。此外，利益相关者应作为系统配置管理过程的一部分，定期更新 IT 资产清单。组织有责任确定清单的目的和用途，并仅维护这些用途所需的信息。清单中的资源应分组并分配优先级，以便于修复工作，并可能包括以下内容：\n\
    \n- 1 关联系统名称。\n- 2 资产编号。\n- 3 IT 资源的所有者——即主要用户。\n- 4 系统管理员。\n- 5 物理位置。\n- 6 连接的网络端口。\n\
    - 7 软件配置。\n  - a 操作系统和版本号。\n  - b 软件包和版本号。\n  - c 网络服务。\n  - d IP 地址（如果是静态的）。\n\
    - 8 硬件配置。\n  - a 中央处理器。\n  - b 内存。\n  - c 磁盘空间。\n\n"
