    # Privacy risk assessments


    Privacy risk management is a cross-organizational set of processes that assist
    the organization in understanding how its systems, products and services may create
    concerns for individuals and how to develop effective solutions to manage these
    risks. Privacy risk assessment is a sub-process of identifying and evaluating
    specific privacy risks. In general, privacy risk assessments produce information
    that can assist organizations in weighing the benefits of data processing against
    the risks to determine the appropriate response.


    The internal control environment is defined as the technology and information
    security controls in place within the enterprise architecture. This landscape
    is usually depicted through enterprise architecture artefacts, which include but
    is not limited to diagrams, interfaces, communication channels and application/technology
    portfolios. In addition, it extends from the on-premises environment to suppliers,
    service providers, agents and partners. Therefore, in addition to internal assessments,
    external third-party assurance reports are utilized to assist with internal control
    environment assessments.


    # Cybersecurity framework


    Some organizations utilize cybersecurity risk-based frameworks to manage cybersecurity
    risk. The industry framework has been established through NIST and is composed
    of the following three parts: the framework core, the framework implementation
    tiers and the framework profiles. Each framework component strengthens the integration
    between cybersecurity activities and business drivers.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_116_0.png)


