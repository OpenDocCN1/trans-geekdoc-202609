    Web 应用程序平台捕获和存储——具体而言，包括但不限于有关 ABC 学生的任何个人信息，如下所示：<br>• 学生信息。<br>• 成绩。<br>• 课程信息。<br>•
    与学习工具互操作性的连接。<br><br>敏感身份验证数据 (SAD)：这是支付卡在购买时用于身份验证的信息。这包括来自完整磁条、卡安全码 (CSC, CVV2,
    CID, CAV2) 和个人识别号码 (PIN) 的数据。Möbius 平台促进 ABC 个人的支付卡交易，因此 DigitalEd 要求保护 SAD。 |
