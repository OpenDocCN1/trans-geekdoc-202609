    by which an ICT response and recovery plan is invoked should be clearly documented.
    This process should allow for the relevant plans or parts thereof to be invoked
    in the shortest possible time, either in advance of a potentially disruptive event
    or immediately after the occurrence of an event. The plan should include clear
    and precise descriptions of the following:


    +   - How to mobilize the assigned individual or team.

    +   - Immediate rendezvous points.

    +   - Subsequent team meeting locations and details of any alternative meeting
    locations.

    +   - Circumstances under which an IRBC response is deemed unnecessary—that is,
    minor faults and outages that, even in the case of critical ICT services, may
