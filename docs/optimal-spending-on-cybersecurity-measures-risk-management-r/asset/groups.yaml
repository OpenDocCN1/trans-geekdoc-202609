  mdcn: "\n\n- 已实施恶意和未经授权的代码检测。\n- 对外部服务提供商活动进行监控，以检测潜在的网络安全事件。\n- 对未经授权的人员、连接、设备和软件进行监控。\n\
    - 云服务器拥有众多现场安全团队和人员，对系统进行监控，以提供 24 x 7 服务。\n- 已建立机制，保护 Google 生产环境免受各种应用层拒绝服务攻击。\n\
    - Google 已实施漏洞管理计划，以检测和修复系统漏洞。\n\n## 检测流程\n\n- 检测的角色和职责已明确界定，以确保问责制。\n- 检测活动符合所有适用要求。\n\
    - 检测流程经过测试。\n- 事件检测信息已传达。\n- 检测流程持续改进。\n- Google 已制定事件响应政策，概述了管理职责和程序，以确保对信息安全事件做出快速、有效且有序的响应。\n\
    - 监控工具根据预定标准向运营人员发送自动警报。事件按政策升级。\n\n## 响应计划\n\n- 响应计划在事件期间或之后执行。\n- 信息安全事件按 Google\
    \ 的事件响应政策进行记录。从这些事件中收集的信息用于防止未来事件，并可作为信息安全培训的示例。\n\n## 通信\n\n- 在需要响应时，人员了解自己的角色和操作顺序。\n\
    - 事件按既定标准报告。\n- 信息按响应计划共享。\n- 与利益相关方的协调按响应计划进行。\n- 与外部利益相关方自愿共享信息，以实现更广泛的网络安全态势感知。\n\
    \n## 分析\n\n- 对检测系统的通知进行调查。\n- 了解事件的影响。\n- 执行取证。\n- 事件按响应计划进行分类。\n- 已建立流程，以接收、分析和响应来自内部和外部来源（即内部测试、安全公告或安全研究人员）向组织披露的漏洞。\n\
    \n## 缓解\n\n- 事件得到遏制。\n- 事件得到缓解。\n- 新发现的漏洞得到缓解或记录为可接受的风险。\n\n## 恢复计划\n\n- 恢复计划在网络安全事件期间或之后执行。\n\
    - Google 每年进行一次灾难恢复（DR）测试，为基础设施和应用团队提供一个协调场所，以测试通信计划、故障转移场景、运营过渡和其他应急响应。所有参与 DR\
    \ 演练的团队都会制定测试响应和事后分析，记录测试结果和经验教训。\n\n## 改进\n\n- 恢复计划吸取了经验教训。\n- 恢复策略已更新。\n\n##\
    \ 通信\n\n- 管理公共关系。\n- 事件后修复声誉。\n- 恢复活动已传达给内部和外部利益相关方，以及高管和管理团队。\n\n## 组织的风险偏好\n\
    \nMöbius 平台的剩余风险评级为 MEDIUM LOW。\n\n## 风险缓解策略\n\n可利用进一步的风险缓解建议，使其与业务单元的风险概况和 NIST\
    \ 网络安全框架的核心组件保持一致。\n\n## 供应链风险管理\n\n- ABC 大学应确保使用审计、测试结果或其他形式的评估定期评估 Aliyun，以确认其履行合同义务。\n\
    - ABC 大学应确保与供应商和第三方提供商进行响应、恢复计划和测试。\n\n## 身份管理、身份验证和访问控制\n\n- 应审查 ABC 大学内现有的技术和流程，并实施适当的安全控制，以包括与\
    \ ABC 大学 LMS 的集成。\n- 基于 Web 的界面应支持身份验证，包括基于标准的单点登录 (SSO)，利用 MFA 和密码/口令有效期要求。\n\
    \n## 信息保护流程和程序\n\n- DigitalEd 应考虑实施已批准的 DR 流程文档。\n- DigitalEd 的 DRP 所有组件应至少每年审查一次，并根据需要更新以反映变化。\n\
    - 与 PII 相关的信息安全控制：\n  - 保护从 ABC 大学到云托管环境（即 Google、Alibaba）的数据传输。\n  - 安全应用程序编程接口\
    \ (API) 的示例包括以下内容：\n    - 为客户端应用程序创建帐户。\n    - 帐户更新以使用 HTTP 基本身份验证。\n    - 访问控制的粒度，以确保每个客户端应用程序都能访问其适用操作所需的功能。\n\
    - 云托管环境中包含 PII 的数据库应\n  - 保护 PII 元素（即加密、掩码和哈希）；\n  - 为数据库中管理员/等效管理员账户的日志记录提供报告，供\
    \ ABC 大学管理层审查；以及\n  - 对数据库和系统日志实施完整性控制。\n\n## 意识和培训\n\n- 实施持续培训，并确保员工了解适当处理和处理\
    \ PII 及数据隐私。\n\n## 安全监控\n\n- 在 DigitalEd 环境中监控入侵的能力。\n- 将安全/数据相关的违规政策和程序与 ABC\
    \ 的事件管理流程集成。\n\n## 案例研究 #2：Chime Live 解决方案\n\n作为其 50 周年庆典的一部分，并回应学习者调查，ABC 大学原计划于\
    \ 2020 年举办两场线下毕业典礼：一场于 9 月 18 日在 ABC 举行，另一场于 10 月 2 日在多伦多举行。由于 COVID-19 大流行，ABC\
    \ 大学做出了艰难的决定，取消了原计划于 2020 年举办的线下毕业典礼。为 ABC 学习者提供引人入胜且有影响力的毕业典礼，是大学对学习者和社区的重要基础承诺。出于此原因，大学选择\
    \ Chime Live 作为虚拟活动平台来举办 2020 年毕业典礼。ABC 有机会在其 50 周年之际重新构思毕业典礼，使其与其他高等教育机构有所不同，并真正凸显其“数字优先”使命。Chime\
    \ Live 平台将提供这一机会，因为它是一个“虚拟活动”平台，能够实现学习者、宾客和 ABC 团队成员之间的实时互动。\n\n2020 年春季，世界面临着前所未有的局面，各国实施封锁，居家令生效，对于会议和活动行业来说，无法聚集。关于虚拟会议的即时需求出现了疑问。为了帮助行业专业人士弥补差距，PSAV\
    \ 及其旗下公司于 2020 年 4 月 2 日制作了一场全球网络直播，邀请了一支专家团队。该团队描述了从头到尾规划、制作和推广世界级虚拟活动的实际应用和解决方案。该活动包括以下内容：\n\
    \n- 六小时的实时直播。\n- 覆盖五十七个国家。\n- 八场互动环节。\n- 二十位远程演讲者。\n- 一万三千人。\n\n一切是如何汇聚在一起的：传统角色转变为具有类似职责的虚拟角色。来自世界各地的多个跨职能团队汇聚一堂，提供其专业服务，包括制作服务、技术支持、内容开发、创意设计和演讲者辅导。\n\
    \n## Chime Live 平台\n\nABC 大学选择 Chime Live 作为虚拟活动平台来举办 2020 年毕业典礼。Chime Live 平台的目的是举办并增强大学重新构思的毕业典礼，以便大学能够与\
    \ ABC 学习者和 ABC 社区一起庆祝。Chime Live 是一个独立平台，不会与 ABC 大学拥有的技术环境集成或连接。\n\nChime Live\
    \ 通过交互式功能连接远程演讲者和参与者，帮助克服分心并保持高参与度。无论是在家、在工作场所还是在活动现场，Chime Live 都能简化流媒体过程，并轻松直播主题演讲、主题流和计划分组会议。此解决方案的目的是通过允许一定的实时互动，增强学习者在重新构思的毕业典礼期间的体验。这种方法符合学习者对线下典礼的期望，因为它使他们能够与同届毕业生互动和联系。\n\
    \n利用 Chime Live 将实现的毕业典礼的期望目标和支持性目标包括以下内容：\n\n- 1 在 2020 年典礼上以有意义的方式庆祝学习者的成就：\n\
    \  - a 允许按学院或专业进行毕业生“实时”社交。\n  - b 包括所有本科生、研究生，以及文凭和证书课程的学生。\n\n"
