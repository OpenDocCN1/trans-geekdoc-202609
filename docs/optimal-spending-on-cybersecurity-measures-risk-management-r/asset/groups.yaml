  mdcn: "\n由 ABC 创建，并将在 CatchMyData 环境中维护。CatchMyData 作为一家公司将继续在安全性、应用程序维护和备份方面遵守原始\
    \ ABC 合同。\n\n## 问题\n\n- 1. 确定固有风险。\n- 2. 使用 NIST 网络安全框架：核心组件评估内部控制环境。\n- 3. 确定风险偏好、风险承受能力和风险概况。\n\
    - 4. 评估剩余风险，并在适当时提供建议。\n- 5. 制定风险缓解策略。\n\n## 案例研究 #5：Moneris Solutions\n\nSAD\
    \ 是指购买时用于身份验证的支付卡上的信息，包括完整磁条数据、卡安全码（CSC、CVV2、CID、CAV2）和 PIN。在支付卡处理模型中，ABC 大学与其收单银行建立了商户关系以接受支付卡交易。ABC\
    \ 大学已将支付卡数据的交易处理外包给第三方服务提供商 Moneris Solutions。大学的供应商负责遵守监管和法律法规，以及保护此类信息不被未经授权的第三方获取。本风险评估报告为信用卡服务费模型项目提供了剩余风险概况。\n\
    \n大学已与 Moneris Solutions 建立现有关系，为 ABC 客户提供交易处理。当前关系详情如下。\n\n![](img/8bcb92bad95ddd74218ba966f2798d54_145_0.png)\n\
    \n托管支付页面（HPP）流程如下：\n\n- 1. 客户到达 ABC 大学网站（应用程序）。此时，大学必须确定交易金额并收集任何其他数据。\n- 2. 一旦持卡人准备付款，大学结账页面将向\
    \ Moneris HPP 提交 HTTP 表单 POST。此时，客户将从大学网站重定向到 Moneris HPP URL。\n- 3. 在 HPP 上，持卡人将提供安全支付详细信息，例如卡号，并提交交易。此时，Moneris\
    \ 将处理交易，然后向客户提供收据。\n- 4. 一旦客户准备继续，他或她将被重定向回大学网站，即 HPP 配置中提供的响应 URL。\n\n大学提议的变更是在大学收据中添加服务费——具体来说，便利费。便利费计划旨在允许商户向持卡人收取费用，以提供替代支付渠道的便利。仅在以替代支付渠道形式提供真正的“便利”时才适用。便利费是消费者为所购买商品和/或服务支付的费用之上的单独费用，该费用将作为消费者账单上的单独行项目出现。从信息安全角度来看，此变更的影响很小。已确认不需要隐私影响评估（PIA），因为个人身份信息（PII）不在本项目增强范围内。此外，新收据将不包含任何需要大学内额外安全控制的敏感数据。大学通过服务提供商\
    \ Moneris Solutions 维持其当前的交易处理关系。\n\n## 问题\n\n- 1. 确定固有风险。\n- 2. 使用 NIST 网络安全框架：核心组件评估内部控制环境。\n\
    - 3. 确定风险偏好、风险承受能力和风险概况。\n- 4. 评估剩余风险，并在适当时提供建议。\n- 5. 制定风险缓解策略。\n\n## 案例研究 #6：校友学习联盟\n\
    \n校友学习联盟（ALC）是一个新的网络研讨会平台，旨在满足校友协会的特定需求。马里兰大学和另外 11 所学院和大学组成了 ALC，由 Professional\
    \ Book Club Guru（PBC Guru）管理。\n\n### 当前计划\n\nALC 是一个可以协助 ABC 大学创建在线课程以推动校友参与的组织。ABC\
    \ 大学与 PBC Guru 合作，利用 CloudWays 网络托管平台。该解决方案为大学提供了一个 ABC 品牌网站，用于向 ABC 校友管理和交付内容，提供以下服务：\n\
    \n- 1. 直播平台 – 向国际参与者托管网络研讨会和直播活动，活动或参与者数量不限，包括以下内容：\n  - 无限活动、注册和观看人数。\n  - 一个带有学校品牌的微型网站，允许校友注册即将举行的直播、观看直播和回看过去的活动。\n\
    \  - 注册并参加每个项目的个人分析。\n  - 个性化屏幕视图，允许屏幕品牌化，支持网络研讨会、小组讨论和现场活动直播。\n  - 与 ALC 创建的白标直播无缝集成。\n\
    \  - 每个在线活动注册页面上的年度基金捐款请求。\n  - 技术支持和平台培训。\n\n- 2. 白标网络研讨会——来自畅销书作者和职业专家的节目，面向各个生命阶段的校友。ALC\
    \ 每月制作两到四场网络研讨会，面向所有成员学校的校友开放。这些网络研讨会涵盖职业、生命阶段和终身学习等多个主题，以吸引 ABC 校友的不同群体。每场网络研讨会都是“白标”的，这意味着它在校友网络研讨会页面上为\
    \ ABC 品牌化，为 ABC 校友创造无缝的观看体验。由于 ALC 网络的规模，该联盟可以将顶级演讲者带到 ABC 校友面前。\n\n- 3. 专业协会——与其他联盟成员联系，学习最佳实践以实现专业发展。\n\
    \n- 4. 专家支持——专为校友协会成功而设计。\n\n### 托管服务提供商（MSP）模型\n\nPBC Guru 利用 CloudWays 提供的云托管平台，为\
    \ ABC 品牌网站提供开发、内容交付和运营。CloudWays 利用由 Digital Realty Data Centre Services 管理的安全数据中心，Data\
    \ Centre NYC3 托管支持此解决方案的技术。ABC 大学负责管理、更新和维护 ABC ALC 网站。因此，ABC 配备了专门的网站管理员，为 ABC\
    \ ALC 网站提供整体管理。\n\n## 问题\n\n- 1. 确定固有风险。\n- 2. 使用 NIST 网络安全框架：核心组件评估内部控制环境。\n\
    - 3. 确定风险偏好、风险承受能力和风险概况。\n- 4. 评估剩余风险，并在适当时提供建议。\n- 5. 制定风险缓解策略。\n\n## 案例研究 #7：Cascade\
    \ 软件\n\nABC 大学是一个半虚拟组织，学习者、员工和其他利益相关者群体依赖于用户界面（网站）来访问在线信息和资源——即课程、项目和服务。这些界面的可用性和有效性，包括其数字内容的质量，对于建立有效的数字体验至关重要。然而，大学当前的数字体验日益分散。此外，其现有解决方案（Alfresco\
    \ Web Content Management）中的网页发布功能不再由供应商提供或支持，需要一个可扩展的基于云的解决方案来支持大学战略目标的实现。本风险评估旨在审查与\
    \ Cascade 计划相关的内容管理和内容交付功能的变更。本次评估不包括任何现有流程，其中包括但不限于利用大学的身份和访问管理流程。\n"
