    于 2017 年春季推出了 Möbius 平台，旨在改善 STEM 课堂中作者、教师和学生的在线学习体验。 | 中度 | 可能 |

    | **5 技术格局**<br>供应商和第三方合作伙伴包括 GCP 系统和阿里云。 | 重大 | 频繁 |

    | 6 法律/法规<br>受特定监管要求约束的数据披露。<br>失去或泄露数据（即 PII）的受害者提起的诉讼。<br>监管机构评估的罚款和处罚。 | 重大
