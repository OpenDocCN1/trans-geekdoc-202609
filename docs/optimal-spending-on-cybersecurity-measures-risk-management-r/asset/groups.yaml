  - '[PAGE 80]


    # Defining requirements


    As part of its BCM programme, the organization should categorize its activities
    according to their priority for continuity, as determined by a business impact
    analysis, and define the minimum level at which each critical activity needs to
    be performed.


    Management should agree upon the organization’s business continuity requirements,
    and these requirements will result in recovery time objectives (RTOs) and recovery
    point objectives (RPOs) for the minimum business continuity objective (MBCO) per
    product, service or activity. RTOs start from the point at which a disruption
    occurs and run until the product, service or activity resumes.


    # Understanding critical services


    There may be several ICT services that are critical and required to enable recovery
    to take place. Each of these critical ICT services should have its own documented
    RTO and RPO for the MBCO of the ICT service. The objectives may include aspects
    of ICT service delivery, such as the help-desk. The RTO of critical ICT services
    will invariably be a lower priority than the RTO of business continuity. The organization
    should identify and document its critical ICT services to include brief descriptions
    and names that are meaningful to the organization at the service user level. This
    will ensure a common understanding between business and ICT staff, as different
    names may be used for the same ICT service. Each critical ICT service listed should
    identify the product or service that it supports, and management should agree
    upon the ICT services and the associated IRBC requirements.


    For each critical ICT service identified and agreed upon, all ICT components of
    the end-to-end service should be described and documented to show how they are
    configured or linked to deliver each service. Both the normal ICT service delivery
    environment and the ICT continuity service delivery environment configurations
    should be documented.


    For each critical ICT service, the current continuity capability—that is, the
    existence of a single point of failure—should be reviewed from a prevention perspective
    to assess the risks of service interruption or degradation, which can be taken
    as part of the overall BCM risk-assessment exercise. Opportunities to improve
    ICT service resilience and thereby lower the likelihood and/or impact of service
    disruption should also be sought. This type of review may also highlight opportunities
    to enable early detection and reaction to ICT service disruption. The organization
    can decide whether there is a business case for investing in identified opportunities
    to improve service resilience. This risk assessment, which may form part of the
    organization’s'
  - '[PAGE 81]


    overall risk-management framework, may also inform the business case for enhancing
    ICT service recovery capability.


    # Identifying gaps between ICT readiness capabilities and business continuity
    requirements


    For each critical ICT service, the current ICT readiness arrangements, such as
    prevention, monitoring, detection, response and recovery, should be compared with
    business continuity requirements, and any gaps should be documented.


    Management should be informed of any gaps between critical IRBC capability and
    business continuity requirements. Such gaps might indicate risks and the need
    for additional resilience and recovery resources, such as the following:


    +   - Staff, including numbers, skills and knowledge.

    +   - Facilities to house ICT equipment—that is, a computer room.

    +   - Supporting technology, plant, equipment and networks.

    +   - Information applications and databases.

    +   - Finance or budget allocation.

    +   - External services and suppliers.


    Management should sign-off on the ICT service definitions, the documented list
    of critical ICT services and the risks associated with identified gaps between
    critical IRBC capability and business continuity requirements.


    This should include, where appropriate, signing off on identified risks. The options
    for addressing the identified gaps and risks should then be explored by determining
    IRBC strategies.


    # Determining IRBC strategy options


    IRBC strategies should define the approaches to implement the required resilience
    strategies so that the principles of incident prevention, detection, response,
    recovery and restoration are in place.


    A full range of IRBC strategy options should be evaluated. The strategies chosen
    should support the business continuity requirements of the organization.


    The organization should consider implementation and ongoing resource requirements
    when developing the strategy. External suppliers may be contracted to provide
    specialized services and skills that play an important role in supporting the
    strategy.'
  - '[PAGE 82]


    The IRBC strategy should be flexible enough to cater to different business strategies
    in different markets.


    In addition, the strategy should consider internal constraints and factors, such
    as the following:


    +   - Budget.

    +   - Resource availability.

    +   - Potential costs and benefits.

    +   - Technological constraints.

    +   - The organization''s risk appetite.

    +   - The organization''s existing IRBC strategy.

    +   - Regulatory obligations.


    # IRBC strategy options


    The organization should consider a range of options for the incident readiness
    of its critical ICT services. The options should allow for increasing protection
    and resilience as well as providing for recovery and restoration from an unplanned
    disruption and may include an internal arrangement. Services delivered to the
    organization may be provided externally by one or more third parties.


    The options should consider the various components required to ensure the continuity
    and recovery of critical ICT services.


    # Skills and knowledge


    The organization should identify appropriate strategies for maintaining core ICT
    skills and knowledge. This may extend beyond employees to contractors and other
    stakeholders who possess extensive ICT specialist skills and knowledge. Strategies
    to protect or provide those skills may include the following:


    +   - Documentation of the way in which critical ICT services are performed.

    +   - Multiskill training of ICT staff and contractors to enhance skill redundancy.

    +   - Separation of core skills to reduce the concentration of risk.

    +   - Knowledge retention and management.


    # Facilities


    According to the identified risks, the organization should devise strategies to
    reduce the impact of the unavailability of normal ICT facilities.'
  - '[PAGE 83]


    These may include one or more of the following:


    +   - Alternative facilities within the organization, including displacement of
    other activities.

    +   - Alternative facilities provided by other organizations.

    +   - Alternative facilities provided by third-party specialists.

    +   - Working from home or at other remote sites.

    +   - Other agreed-upon suitable working facilities.

    +   - Use of an alternative workforce at an established site.

    +   - Alternative facilities that can be transported to the site of the disruption
    and used to directly replace some of the physical assets involved.


    Strategies for ICT facilities can vary significantly, and a range of options may
    be available. Different types of incidents or threats may require the implementation
    of multiple strategies that will be driven in part by the organization’s size,
    breadth of activities, locations, technologies and budget.


    In considering the use of alternative premises, the following should be considered:


    +   - Site security.

    +   - Staff access.

    +   - Proximity to existing facilities.

    +   - Availability.


    # Technology


    The ICT services upon which critical business activities depend should be available
    in advance of the resumption of the dependent critical business activities. The
    required solutions should ensure the availability of applications within specific
    time frames; that is, the RTOs should be determined as part of the business impact
    analysis (BIA). Technology platforms and application software should be put in
    place within time frames demanded by the organization. Technologies that support
    critical ICT services frequently require complex arrangements to ensure continuity,
    and the following should be considered when selecting IRBC strategies:


    +   - RTOs and RPOs for critical ICT services that support the critical activities
    identified by the BCM programme.

    +   - Location and distance between technology sites.

    +   - Number of technology sites.

    +   - Remote access to systems.

    +   - Cooling requirements.'
  md: '

    ## Defining requirements


    As part of its BCM programme, the organization should categorize its activities
    according to their priority for continuity, as determined by a business impact
    analysis, and define the minimum level at which each critical activity needs to
    be performed.


    Management should agree upon the organization’s business continuity requirements,
    and these requirements will result in recovery time objectives (RTOs) and recovery
    point objectives (RPOs) for the minimum business continuity objective (MBCO) per
    product, service or activity. RTOs start from the point at which a disruption
    occurs and run until the product, service or activity resumes.


    ## Understanding critical services


    There may be several ICT services that are critical and required to enable recovery
    to take place. Each of these critical ICT services should have its own documented
    RTO and RPO for the MBCO of the ICT service. The objectives may include aspects
    of ICT service delivery, such as the help-desk. The RTO of critical ICT services
    will invariably be a lower priority than the RTO of business continuity. The organization
    should identify and document its critical ICT services to include brief descriptions
    and names that are meaningful to the organization at the service user level. This
    will ensure a common understanding between business and ICT staff, as different
    names may be used for the same ICT service. Each critical ICT service listed should
    identify the product or service that it supports, and management should agree
    upon the ICT services and the associated IRBC requirements.


    For each critical ICT service identified and agreed upon, all ICT components of
    the end-to-end service should be described and documented to show how they are
    configured or linked to deliver each service. Both the normal ICT service delivery
    environment and the ICT continuity service delivery environment configurations
    should be documented.


    For each critical ICT service, the current continuity capability—that is, the
    existence of a single point of failure—should be reviewed from a prevention perspective
    to assess the risks of service interruption or degradation, which can be taken
    as part of the overall BCM risk-assessment exercise. Opportunities to improve
    ICT service resilience and thereby lower the likelihood and/or impact of service
    disruption should also be sought. This type of review may also highlight opportunities
    to enable early detection and reaction to ICT service disruption. The organization
    can decide whether there is a business case for investing in identified opportunities
    to improve service resilience. This risk assessment, which may form part of the
    organization’s overall risk-management framework, may also inform the business
    case for enhancing ICT service recovery capability.


    ## Identifying gaps between ICT readiness capabilities and business continuity
    requirements


    For each critical ICT service, the current ICT readiness arrangements, such as
    prevention, monitoring, detection, response and recovery, should be compared with
    business continuity requirements, and any gaps should be documented.


    Management should be informed of any gaps between critical IRBC capability and
    business continuity requirements. Such gaps might indicate risks and the need
    for additional resilience and recovery resources, such as the following:


    - Staff, including numbers, skills and knowledge.

    - Facilities to house ICT equipment—that is, a computer room.

    - Supporting technology, plant, equipment and networks.

    - Information applications and databases.

    - Finance or budget allocation.

    - External services and suppliers.


    Management should sign-off on the ICT service definitions, the documented list
    of critical ICT services and the risks associated with identified gaps between
    critical IRBC capability and business continuity requirements.


    This should include, where appropriate, signing off on identified risks. The options
    for addressing the identified gaps and risks should then be explored by determining
    IRBC strategies.


    ## Determining IRBC strategy options


    IRBC strategies should define the approaches to implement the required resilience
    strategies so that the principles of incident prevention, detection, response,
    recovery and restoration are in place.


    A full range of IRBC strategy options should be evaluated. The strategies chosen
    should support the business continuity requirements of the organization.


    The organization should consider implementation and ongoing resource requirements
    when developing the strategy. External suppliers may be contracted to provide
    specialized services and skills that play an important role in supporting the
    strategy.


    The IRBC strategy should be flexible enough to cater to different business strategies
    in different markets.


    In addition, the strategy should consider internal constraints and factors, such
    as the following:


    - Budget.

    - Resource availability.

    - Potential costs and benefits.

    - Technological constraints.

    - The organization''s risk appetite.

    - The organization''s existing IRBC strategy.

    - Regulatory obligations.


    ## IRBC strategy options


    The organization should consider a range of options for the incident readiness
    of its critical ICT services. The options should allow for increasing protection
    and resilience as well as providing for recovery and restoration from an unplanned
    disruption and may include an internal arrangement. Services delivered to the
    organization may be provided externally by one or more third parties.


    The options should consider the various components required to ensure the continuity
    and recovery of critical ICT services.


    ## Skills and knowledge


    The organization should identify appropriate strategies for maintaining core ICT
    skills and knowledge. This may extend beyond employees to contractors and other
    stakeholders who possess extensive ICT specialist skills and knowledge. Strategies
    to protect or provide those skills may include the following:


    - Documentation of the way in which critical ICT services are performed.

    - Multiskill training of ICT staff and contractors to enhance skill redundancy.

    - Separation of core skills to reduce the concentration of risk.

    - Knowledge retention and management.


    ## Facilities


    According to the identified risks, the organization should devise strategies to
    reduce the impact of the unavailability of normal ICT facilities. These may include
    one or more of the following:


    - Alternative facilities within the organization, including displacement of other
    activities.

    - Alternative facilities provided by other organizations.

    - Alternative facilities provided by third-party specialists.

    - Working from home or at other remote sites.

    - Other agreed-upon suitable working facilities.

    - Use of an alternative workforce at an established site.

    - Alternative facilities that can be transported to the site of the disruption
    and used to directly replace some of the physical assets involved.


    Strategies for ICT facilities can vary significantly, and a range of options may
    be available. Different types of incidents or threats may require the implementation
    of multiple strategies that will be driven in part by the organization’s size,
    breadth of activities, locations, technologies and budget.


    In considering the use of alternative premises, the following should be considered:


    - Site security.

    - Staff access.

    - Proximity to existing facilities.

    - Availability.


    ## Technology


    The ICT services upon which critical business activities depend should be available
    in advance of the resumption of the dependent critical business activities. The
    required solutions should ensure the availability of applications within specific
    time frames; that is, the RTOs should be determined as part of the business impact
    analysis (BIA). Technology platforms and application software should be put in
    place within time frames demanded by the organization. Technologies that support
    critical ICT services frequently require complex arrangements to ensure continuity,
    and the following should be considered when selecting IRBC strategies:


    - RTOs and RPOs for critical ICT services that support the critical activities
    identified by the BCM programme.

    - Location and distance between technology sites.

    - Number of technology sites.

    - Remote access to systems.

    - Cooling requirements.

