    # Scenario analysis


    Scenario analysis shows a forward-looking view of operational risk that augments
    historical internal and external data. These exercises allow stakeholders to identify
    and manage risk exposures through business decisions and risk-mitigation strategies.


    Threat actor analysis: Identify actors who pose a threat to the organization.


    Impact analysis: Determine the areas that the organization is focused on protecting.


    Scenario selection: Determine scenarios that could have a catastrophic impact
    on the organization.


    At minimum, a scenario should include the following:


    The situation: An explanation of the sequence of events that leads to an adverse
    outcome. These may be industry and organization specific but must include items
    such as the following:


    +   - Business continuity planning (BCP) events.

    +   - External attacks by hackers, competitors or government agencies.

    +   - Malicious insiders stealing information.

    +   - Accidental release of confidential information.

    +   - The mishandling of data by vendors and third parties.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_22_0.png)


    Figure 2.3 The process of scenario analysis.'
  - '[PAGE 23]


    The outcomes: Outcomes that are unfavourable to an organization and are a result
    of the event should be clearly identified. An event may have multiple outcomes;
    for example, the same scenario may result in the loss of revenue, legal costs
    and regulatory fines. Each outcome should be explicitly laid out, and its impact
    should be described.


    Controls in place: Controls work as separate lines of defence, at times sequentially
    and at other times interacting with each other to help prevent the occurrence
    of an adverse event. Often, the correct operation of one control may provide adequate
    protection or mitigation. If controls operate independently of each other, as
    they often do, the combined probability of all of them failing simultaneously
    tends to be significantly lower than the probability of any one of them failing.


    Frequency of occurrence: The frequency or likelihood of the scenario being realized
    should be a part of the scenario analysis and is best estimated in a discussion
    with management.


    Severity of the outcomes: The severity of each of the adverse outcomes should
    be estimated separately.


    Scenario examples are as follows:


    +   - Scenario #1: Patch management.

    +   - Scenario #2: Network ransomware/malware attack.

    +   - Scenario #3: Unplanned attack.

    +   - Scenario #4: Financial break-in/external attack.

    +   - Scenario #5: Cloud security breach.


    Attack tree development: Develop detailed attack trees for each scenario.


    Control assessment: Map controls to the attack tree and assess effectiveness.


    Remediation: Use the control assessment to plan remediation projects that address
    control gaps.


    Response planning: Create or enhance existing response plans to cater to extreme
    scenarios.


    Exercise: Test the control strength, response plan and overall preparedness.


    # Step 6: Update strategies and policies accordingly


    One or two months after the scenarios are implemented, it is essential to evaluate
    the strategic plan and update the policies. This evaluation and update process
    should be completed on a periodic basis.'
  - '[PAGE 24]


    # # 3 Alignment with enterprise risk management


    # ## Operational risk management


    Operational risk is defined by the Bank of International Settlements (BIS) as
    “the risk of loss resulting from inadequate or failed internal processes, people
    and systems or from external events (strategic and reputational risk is not included
    in this definition for the purpose of a minimum regulatory operational risk capital
    charge)” (Basel Committee on Banking Supervision, 2001). Legal risk is included
    in this definition. Operational risk is therefore the sum of operating, information
    systems, compliance and legal risk.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_24_0.png)


    Figure 3.1 The elements of operational risk management through the Sergio Galanti
    operational risk puzzle (Caldas, 2006).'
