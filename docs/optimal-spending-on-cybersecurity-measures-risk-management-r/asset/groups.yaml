    ## Collaboration


    Development and IT operations work together, and DevOps extends far beyond the
    IT organization due to the need for collaboration, which extends to all stakeholders
    in the delivery of software.


    > "The foundation of DevOps success is how well teams and individuals collaborate
    across the enterprise to get things done more rapidly, efficiently and effectively"
    – Tony Bradley, “Scaling Collaboration in DevOps”, DevOps.com.


    ## Automation


    DevOps relies heavily on automation and tools and on toolchains to automate large
    parts of the end-to-end software development and deployment process.


    | Health - Status Security Tools / Services | Web - Application Development Tools
    / Services | Operating System (OS) Tools / Services | Governance Validation Management
