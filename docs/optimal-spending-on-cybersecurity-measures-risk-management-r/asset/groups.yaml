    The team at AWS defines continuous delivery as a DevOps “software development
    practice where code changes are automatically built, tested and prepared for a
    release to production”. It expands upon continuous integration by deploying all
    code changes to a testing environment and/or a production environment after the
    build stage. When continuous delivery is implemented properly, developers will
