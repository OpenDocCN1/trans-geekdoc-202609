  mdcn: "\n\n技术组未监控的软件中识别出的漏洞和威胁。修复测试指南可能包括以下内容：\n\n- 大多数厂商提供某种身份验证机制。下载的补丁应根据厂商提供的任何真实性验证方法进行检查，包括加密校验和、签名和数字证书。\n\
    \n- 安装前还应对所有补丁运行病毒扫描。在运行扫描之前，系统管理员应确保防病毒程序中的病毒特征数据库是最新的。\n\n- 补丁和配置修改应在非生产系统上进行测试，因为修复可能轻易产生意外后果。\n\
    \n- 安装一个补丁可能还会无意中卸载或禁用另一个补丁。如果存在依赖关系，确保补丁按正确顺序安装非常重要。\n\n- 应对一组能够准确代表已部署系统配置的系统进行测试，因为可能的系统配置非常多，厂商不可能全部测试。\n\
    \n## 部署漏洞修复\n\n组织应将漏洞修复部署到适用的系统中，包括那些不面临立即被利用风险的系统。漏洞修复还应纳入组织主机的标准构建和配置中。\n\n\
    可应用于受影响系统的三种主要修复方法。\n\n## 安全补丁安装\n\n- 应用安全补丁（也称为修复程序或热修复）可以修复漏洞，因为补丁包含修改软件应用程序以解决和消除问题的代码。\n\
    \n- 从厂商网站下载的补丁通常是最新的，并且通常不包含恶意代码。\n\n## 配置调整\n\n- 调整应用程序或安全控制的配置可以有效阻断攻击向量并降低被利用的威胁。常见的配置调整包括禁用服务和修改权限，以及更改防火墙规则和修改路由器访问控制。\n\
    \n  - 易受攻击的软件应用程序的设置可以通过调整文件属性或注册表设置来修改。\n\n## 软件移除\n\n- 移除或卸载受影响的软件或易受攻击的服务可以消除漏洞及任何相关威胁。当系统上不需要某个应用程序时，这是一个实用的解决方案。\n\
    \n- 确定系统的使用方式、移除不必要的软件和服务，以及仅运行系统用途所必需的内容，是推荐的安全实践。\n\n在安装补丁之前，管理员应确保正在打补丁的系统保持当前的完整备份。无论修复涉及自动打补丁还是手动更新，系统管理员可能认为建议修复的缺点大于其优点。他们可能不希望安装补丁或执行配置修改。这些决策背后的原因应予以记录，并传达给技术团队，再传达给相应的管理层以供批准。\n\
    \n## 评估风险\n\n必须仔细权衡延迟修复的风险。确定网络风险量的风险评估是帮助确定企业内漏洞管理状态的另一种方式。\n\n技术团队可以使用风险评估信息来确定哪些资产应首先打补丁，或者是否有任何系统可以承受与其相关的风险。然而，在不知道这种风险将如何影响网络连接资产的情况下，很难对新漏洞的风险进行评级。\n\
    \n在评估风险时，技术团队应考虑以下各节中讨论的问题。\n\n## 威胁等级\n\n需要修复的系统是否面临众多和/或重大威胁？例如，公共 Web 服务器和大多数联邦政府组织可能面临高威胁等级。\n\
    \n## 被攻破风险\n\n被攻破的可能性有多大？如果漏洞容易被利用，则应迅速应用修复。\n\n## 被攻破的后果\n\n被攻破的后果是什么？如果系统是关键系统或包含敏感数据，则应立即执行修复。\n\
    即使对于非关键系统，如果成功利用会导致攻击者完全控制系统，此原则同样适用。\n\n## 将漏洞和修复信息分发给本地管理员\n\n技术团队负责向本地管理员通报与团队范围内且在组织软件清单中的软件包相对应的漏洞和修复。\n\
    \n## 补丁管理\n\n广泛的手动打补丁计算机是无效的，因为需要安装的补丁数量很多，个人使用这种方法保持系统更新是不切实际的。虽然打补丁和漏洞监控通常看起来是一项艰巨的任务，但通过经过测试和集成的打补丁流程（该流程高效利用自动打补丁技术），可以持续缓解组织漏洞。企业补丁管理工具允许技术团队或与其密切合作的团队自动且快速地将补丁推送到许多计算机。\n\
    \n![](img/8bcb92bad95ddd74218ba966f2798d54_43_0.png)\n\n图 4.2 补丁管理生命周期（ManageEngine，2020）。\n\
    \n## 使用分阶段方法部署企业补丁管理工具\n\n分阶段实施补丁管理工具可以在一致部署补丁应用程序之前，先与小组解决流程和用户沟通问题。大多数组织首先将补丁管理工具部署到标准化桌面系统和配置相似的单平台服务器场。完成此操作后，组织应解决集成多平台环境、非标准桌面系统、旧计算机和配置异常的计算机这一更困难的问题。对于自动打补丁工具不支持的操作系统和应用程序以及某些配置异常的计算机，可能需要使用手动方法。对于这些类型的系统，应制定并实施手动打补丁流程的书面程序，技术团队应协调本地管理员的工作。\n\
    \n## 执行补丁的自动部署\n\n技术团队应使用企业补丁管理工具自动将补丁部署到 IT 设备。一旦选择了补丁管理技术，组织的 IT 管理员负责设计解决方案架构、执行测试、部署和保护解决方案以及维护运营和安全。\n\
    \n## 技术安全\n\n在企业内部署企业补丁管理工具可以通过减少漏洞来增强组织的安全态势。当这些工具包含用于防范安全风险和威胁的内置安全措施时，通常会提高安全性。使用这些工具存在一些风险：\n\
    \n- 补丁可能已被篡改（无意或故意）。\n\n- 凭证可能被滥用。\n\n- 解决方案组件（包括代理）中的漏洞可能被利用。\n\n- 实体可能监控工具通信以识别漏洞（尤其是当主机位于外部网络上时）。\n\
    \n组织可以通过应用部署任何企业级应用程序时应使用的标准安全技术来降低这些风险。\n\n"
