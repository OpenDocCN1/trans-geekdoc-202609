    +   • Software access to hosted instances is granted securely to Möbius development
    staff to set up and maintain the software. All access is granted/revoked based
    on “need to know” best practices. The software handles access to machines through
    enforcement of public RSA keys that are created by the users needing access.


    +   • GCP employs various next-generation threat protection (NGPT) techniques
    at the data centre level, as outlined here: https://storage. googleapis.com/gfw-touched-accounts-pdfs/google-cloud-security-
    and-compliance-whitepaper.pdf.


    +   • Google’s management performs periodic assessments of internal identity,
