    # # 6 Risk-management practice – business continuity management


    A business continuity management (BCM) programme manages an organization’s risk
    of business disruption through the implementation of IT readiness for business
    continuity. A failure of ICT services may potentially result in security issues,
    such as system intrusion and malware infections. The organization’s ICT readiness
    for business continuity (IRBC) is based on ISO 27031 and includes incident preparedness,
    DR planning and emergency response and management.


    BCM is a holistic management process that identifies potential threats to the
    continuity of an organization’s business activities and provides a framework for
    building resilience and capability through an effective response that safeguards
    the interests of the organization from disruptions.


    As part of an organization’s BCM process, IRBC is a component of the programme.


    IRBC focuses on the management of one or more systems that complement and support
    the organization’s BCM programme to improve the organization’s readiness for the
    following:


    +   - Respond to the constantly changing risk environment.

    +   - Ensure the continuation of critical business operations supported by the
    related ICT services.

    +   - Be ready to respond before an ICT service disruption occurs upon detection
    of one or a series of related events that become incidents.

    +   - Respond to and recover from incidents/disasters and failures.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_76_0.png)


    Figure 6.1 The business continuity process (phoenixNAP, 2020).'
  - '[PAGE 77]


    # Key principles


    An organization’s BCM programme should be based on the following key principles:


    +   - Incident prevention – Protecting ITS from threats, such as environmental
    and hardware failures, operational errors, malicious attacks and natural disasters,
    is critical to maintaining an organization’s desired level of system availability.

    +   - Incident detection – Incidents should be detected at the earliest opportunity
    to minimize the impact on services, reduce recovery efforts and preserve the quality
    of service.

    +   - Response – Responding to an incident in the most appropriate manner will
    lead to a more efficient recovery and minimize downtime.

    +   - Recovery – Identifying and implementing the appropriate recovery strategy
    ensures the timely resumption of services and maintains the integrity of data.
    Understanding the recovery priorities allows the most critical services to be
    reinstated first. Services of a less critical nature may be reinstated later or,
    in some circumstances, decommissioned.

    +   - Improvement – Lessons learned from small and large incidents should be documented,
    analysed and reviewed. Understanding these lessons will allow an organization
    to better prepare for, control and avoid incidents and disruption.


    # Key elements


    The key elements of the organization’s IRBC can be summarized as follows:


    +   People: Specialists with appropriate skills and knowledge and competent backup
    personnel.

    +   Facilities: The physical environment in which ICT resources are located.

    +   Technology:

    +   - Hardware, including racks, servers, storage arrays, tape devices and fixtures.

    +   - Network, including data connectivity, voice services, switches and routers.

    +   - Software, including OS, application software, links or interfaces between
    them.

    +   - Applications and batch processing routines.

    +   - Data: application data, voice data and other types of data.'
  - '[PAGE 78]


    +   - Processes such as supporting documentation to describe the configuration
    of ICT resources and enable the effective operation, recovery and maintenance
    of those services.


    Suppliers: Other components of end-to-end services where ICT service provision
    is dependent upon an external service provider or another organization within
    the supply chain—that is, a financial market data provider, telecom carrier or
    Internet service provider.


    # Establishing an organization’s ICT readiness using the plan perform check act


    # Policy


    An organization’s IRBC policy provides documented principles to which it will
    aspire and against which its effectiveness can be measured. It should


    +   - establish and demonstrate the commitment of management to an IRBC programme,

    +   - include or refer to the organization’s IRBC objectives,


    ![](img/8bcb92bad95ddd74218ba966f2798d54_78_0.png)


    Figure 6.2 The elements of the ICT readiness process (ISO, 2020).'
  - '[PAGE 79]


    +   - define the scope of IRBC, including limitations and exclusions,

    +   - be approved and signed off on by management,

    +   - be communicated to appropriate internal and external stakeholders,

    +   - identify and provide relevant authorities for the availability of resources
    such as the budget and personnel necessary to perform activities in line with
    the IRBC policy and

    +   - be reviewed at planned intervals and when significant changes, such as environmental
    changes or changes in the organization’s business and structure, occur.


    # Planning


    The main objective of the planning phase is to establish the organization’s ICT
    readiness requirements, including the following:


    +   - The IRBC strategy and IRBC plan that are required to support the legal,
    statutory and regulatory requirements relating to the defined scope and the achievement
    of the organization’s business continuity aims and objectives.

    +   - The performance criteria needed by the organization to monitor the degree
    of ICT readiness required to achieve those aims and objectives.


    # Resources


    As part of the policy mandate, the organization defines the need for an IRBC programme
    as part of its overall BCM objectives and determines and provides the resources
    needed to establish, implement, operate and maintain the IRBC programme.


    IRBC roles, responsibilities, competencies and authorities should be defined and
    documented.


    Management should perform the following tasks:


    +   - Appoint or nominate a person with appropriate seniority and authority to
    be accountable for IRBC policy and implementation.

    +   - Appoint one or more competent persons who, irrespective of other responsibilities,
    should implement the elements of this programme.

    +   - Maintain the IRBC management system as described by the programme.


    # Competency of staff


    The organization should ensure that all personnel who are assigned IRBC responsibilities
    are competent to perform the required tasks.'
  md: "\nThe risk-management process shows how to evaluate, starting with the absence\
    \ of internal controls, which is known as inherent risk. With the inclusion of\
    \ proper code certification, which indicates that the overall system works as\
    \ intended and that its environment protects it from undue influences, the risk\
    \ is mitigated. Secure capabilities allow stakeholders to take proactive actions\
    \ such as quarantining, meaning moving or deleting sensitive or non-public information\
    \ from their network before it negatively impacts their capabilities through unauthorized\
    \ exposure and results in a brand, reputational, financial, legal or cybersecurity\
    \ risk to the business. Stakeholders should be empowered to do the following:\n\
    \n- Continuously monitor all networks and automate actions.\n- Discover, classify\
    \ and act on all transactions involving data that have been identified as sensitive,\
    \ critical or confidential to create information privacy solutions.\n- Facilitate\
    \ compliance with all laws and regulations that apply to data, users and transactions\
    \ based on local and global laws as they apply.\n- Scale with information and\
    \ footprint growth and provide data protection in a timely and cost-effective\
    \ manner that allows for predictable constant mission outcomes.\n- Easily install,\
    \ deploy and update in a reasonable time frame to all applications that are utilized\
    \ by the organization in a manner that does not interrupt end-user expectations.\n\
    - Minimize the need for IT oversight by creating automated pre-defined actions\
    \ for information privacy solutions and data loss prevention.\n- Optimally, develop\
    \ a data security and data privacy dashboard similar to and integrated with network\
    \ management systems.\n- Provide daily, weekly, monthly and annual reports that\
    \ can be used to satisfy audit requests.\n- Reduce business risk and liability.\n\
    \nA common reason for not implementing DevOps and continuous delivery in IT organizations\
    \ is that this approach does not comply with industry standards and regulations\
    \ unless the risk-management process is considered. Two controls that are often\
    \ cited are the segregation of duties and change management.\n\nRegulations and\
    \ standards require organizations to prove that they know what is happening and\
    \ why. Therefore, protecting information and services and performing accurate\
    \ reporting are essential. Compliance with authorities to acquire certain data\
    \ and the mechanisms employed to secure the data acquired are at the forefront\
    \ of many discussions today. Most IT organizations are subject to regulation and\
    \ implement controls to ensure that they comply. Controls are also essential in\
    \ reducing the risk of loss, which may affect the confidentiality, integrity,\
    \ availability and privacy of information.\n\nLeveraging a risk-management approach\
    \ would facilitate an understanding of the residual risk once internal controls\
    \ are implemented. This would allow the business to gain an understanding of the\
    \ alignment of residual risk with its risk profile.\n\n## 6 Risk-management practice\
    \ – business continuity management\n\nA business continuity management (BCM) programme\
    \ manages an organization’s risk of business disruption through the implementation\
    \ of IT readiness for business continuity. A failure of ICT services may potentially\
    \ result in security issues, such as system intrusion and malware infections.\
    \ The organization’s ICT readiness for business continuity (IRBC) is based on\
    \ ISO 27031 and includes incident preparedness, DR planning and emergency response\
    \ and management.\n\nBCM is a holistic management process that identifies potential\
    \ threats to the continuity of an organization’s business activities and provides\
    \ a framework for building resilience and capability through an effective response\
    \ that safeguards the interests of the organization from disruptions.\n\nAs part\
    \ of an organization’s BCM process, IRBC is a component of the programme.\n\n\
    IRBC focuses on the management of one or more systems that complement and support\
    \ the organization’s BCM programme to improve the organization’s readiness for\
    \ the following:\n\n- Respond to the constantly changing risk environment.\n-\
    \ Ensure the continuation of critical business operations supported by the related\
    \ ICT services.\n- Be ready to respond before an ICT service disruption occurs\
    \ upon detection of one or a series of related events that become incidents.\n\
    - Respond to and recover from incidents/disasters and failures.\n\n![](img/8bcb92bad95ddd74218ba966f2798d54_76_0.png)\n\
    \nFigure 6.1 The business continuity process (phoenixNAP, 2020).\n\n### Key principles\n\
    \nAn organization’s BCM programme should be based on the following key principles:\n\
    \n- Incident prevention – Protecting ITS from threats, such as environmental and\
    \ hardware failures, operational errors, malicious attacks and natural disasters,\
    \ is critical to maintaining an organization’s desired level of system availability.\n\
    - Incident detection – Incidents should be detected at the earliest opportunity\
    \ to minimize the impact on services, reduce recovery efforts and preserve the\
    \ quality of service.\n- Response – Responding to an incident in the most appropriate\
    \ manner will lead to a more efficient recovery and minimize downtime.\n- Recovery\
    \ – Identifying and implementing the appropriate recovery strategy ensures the\
    \ timely resumption of services and maintains the integrity of data. Understanding\
    \ the recovery priorities allows the most critical services to be reinstated first.\
    \ Services of a less critical nature may be reinstated later or, in some circumstances,\
    \ decommissioned.\n- Improvement – Lessons learned from small and large incidents\
    \ should be documented, analysed and reviewed. Understanding these lessons will\
    \ allow an organization to better prepare for, control and avoid incidents and\
    \ disruption.\n\n### Key elements\n\nThe key elements of the organization’s IRBC\
    \ can be summarized as follows:\n\n- People: Specialists with appropriate skills\
    \ and knowledge and competent backup personnel.\n- Facilities: The physical environment\
    \ in which ICT resources are located.\n- Technology:\n  - Hardware, including\
    \ racks, servers, storage arrays, tape devices and fixtures.\n  - Network, including\
    \ data connectivity, voice services, switches and routers.\n  - Software, including\
    \ OS, application software, links or interfaces between them.\n  - Applications\
    \ and batch processing routines.\n  - Data: application data, voice data and other\
    \ types of data.\n  - Processes such as supporting documentation to describe the\
    \ configuration of ICT resources and enable the effective operation, recovery\
    \ and maintenance of those services.\n- Suppliers: Other components of end-to-end\
    \ services where ICT service provision is dependent upon an external service provider\
    \ or another organization within the supply chain—that is, a financial market\
    \ data provider, telecom carrier or Internet service provider.\n\n### Establishing\
    \ an organization’s ICT readiness using the plan perform check act\n\n#### Policy\n\
    \nAn organization’s IRBC policy provides documented principles to which it will\
    \ aspire and against which its effectiveness can be measured. It should\n\n- establish\
    \ and demonstrate the commitment of management to an IRBC programme,\n- include\
    \ or refer to the organization’s IRBC objectives,\n\n![](img/8bcb92bad95ddd74218ba966f2798d54_78_0.png)\n\
    \nFigure 6.2 The elements of the ICT readiness process (ISO, 2020).\n\n- define\
    \ the scope of IRBC, including limitations and exclusions,\n- be approved and\
    \ signed off on by management,\n- be communicated to appropriate internal and\
    \ external stakeholders,\n- identify and provide relevant authorities for the\
    \ availability of resources such as the budget and personnel necessary to perform\
    \ activities in line with the IRBC policy and\n- be reviewed at planned intervals\
    \ and when significant changes, such as environmental changes or changes in the\
    \ organization’s business and structure, occur.\n\n#### Planning\n\nThe main objective\
    \ of the planning phase is to establish the organization’s ICT readiness requirements,\
    \ including the following:\n\n- The IRBC strategy and IRBC plan that are required\
    \ to support the legal, statutory and regulatory requirements relating to the\
    \ defined scope and the achievement of the organization’s business continuity\
    \ aims and objectives.\n- The performance criteria needed by the organization\
    \ to monitor the degree of ICT readiness required to achieve those aims and objectives.\n\
    \n#### Resources\n\nAs part of the policy mandate, the organization defines the\
    \ need for an IRBC programme as part of its overall BCM objectives and determines\
    \ and provides the resources needed to establish, implement, operate and maintain\
    \ the IRBC programme.\n\nIRBC roles, responsibilities, competencies and authorities\
    \ should be defined and documented.\n\nManagement should perform the following\
    \ tasks:\n\n- Appoint or nominate a person with appropriate seniority and authority\
    \ to be accountable for IRBC policy and implementation.\n- Appoint one or more\
    \ competent persons who, irrespective of other responsibilities, should implement\
    \ the elements of this programme.\n- Maintain the IRBC management system as described\
    \ by the programme.\n\n#### Competency of staff\n\nThe organization should ensure\
    \ that all personnel who are assigned IRBC responsibilities are competent to perform\
    \ the required tasks.\n"
  mdcn: "\n\n风险管理流程展示了如何进行评估，从缺乏内部控制开始，这被称为固有风险。通过包含适当的代码认证，这表明整个系统按预期运行且其环境保护其免受不当影响，风险得以降低。安全功能使利益相关者能够采取主动措施，例如隔离，即在敏感或非公开信息通过未经授权的暴露对其能力产生负面影响并导致品牌、声誉、财务、法律或网络安全风险之前，从其网络中移动或删除此类信息。应授权利益相关者执行以下操作：\n\
    \n- 持续监控所有网络并自动执行操作。\n- 发现、分类并处理所有涉及已被识别为敏感、关键或机密数据的交易，以创建信息隐私解决方案。\n- 根据适用的本地和全球法律，促进遵守适用于数据、用户和交易的所有法律法规。\n\
    - 随信息和足迹的增长进行扩展，并及时、经济高效地提供数据保护，从而实现可预测的持续任务结果。\n- 在合理的时间内轻松安装、部署和更新组织使用的所有应用程序，且不会中断最终用户的预期。\n\
    - 通过为信息隐私解决方案和数据防泄漏创建自动预定义操作，最大限度地减少对IT监督的需求。\n- 理想情况下，开发一个与网络管理系统类似并集成的数据安全和数据隐私仪表板。\n\
    - 提供每日、每周、每月和每年的报告，可用于满足审计请求。\n- 降低业务风险和责任。\n\n在IT组织中不实施DevOps和持续交付的一个常见原因是，除非考虑风险管理流程，否则这种方法不符合行业标准和法规。经常引用的两种控制措施是职责分离和变更管理。\n\
    \n法规和标准要求组织证明他们知道发生了什么以及原因。因此，保护信息和服务并进行准确报告至关重要。遵守主管部门获取特定数据的要求以及用于保护所获取数据的机制，是当今许多讨论的焦点。大多数IT组织都受到监管并实施控制措施以确保合规。控制措施在降低损失风险方面也是必不可少的，这种损失可能会影响信息的机密性、完整性、可用性和隐私性。\n\
    \n利用风险管理方法有助于在实施内部控制后理解剩余风险。这将使企业能够了解剩余风险与其风险概况的一致性。\n\n## 6 风险管理实践 – 业务连续性管理\n\
    \n业务连续性管理（BCM）计划通过实施业务连续性的IT就绪性来管理组织的业务中断风险。ICT服务故障可能会导致安全问题，例如系统入侵和恶意软件感染。组织的业务连续性ICT就绪性（IRBC）基于ISO\
    \ 27031，包括事件准备、灾难恢复规划以及应急响应和管理。\n\nBCM是一种整体管理流程，用于识别组织业务活动连续性的潜在威胁，并通过有效响应提供构建韧性和能力的框架，以保护组织免受中断影响。\n\
    \n作为组织BCM流程的一部分，IRBC是该计划的一个组成部分。\n\nIRBC专注于管理一个或多个系统，这些系统补充和支持组织的BCM计划，以提高组织对以下方面的就绪性：\n\
    \n- 应对不断变化的风险环境。\n- 确保由相关ICT服务支持的关键业务运营持续进行。\n- 在检测到一项或一系列相关事件（这些事件会变成事件）之前，做好在ICT服务中断发生前响应的准备。\n\
    - 响应并从事件/灾难和故障中恢复。\n\n![](img/8bcb92bad95ddd74218ba966f2798d54_76_0.png)\n\n图\
    \ 6.1 业务连续性流程（phoenixNAP，2020）。\n\n### 关键原则\n\n组织的BCM计划应基于以下关键原则：\n\n- 事件预防 –\
    \ 保护IT服务（ITS）免受环境和硬件故障、操作错误、恶意攻击和自然灾害等威胁，对于维持组织所需的系统可用性水平至关重要。\n- 事件检测 – 应在最早机会检测到事件，以最大限度地减少对服务的影响，减少恢复工作并保持服务质量。\n\
    - 响应 – 以最恰当的方式响应事件将带来更高效的恢复并最大限度地减少停机时间。\n- 恢复 – 识别并实施适当的恢复策略可确保服务及时恢复并保持数据完整性。了解恢复优先级可使最关键的服务首先恢复。性质不那么关键的服务可能会在稍后恢复，或者在某些情况下被停用。\n\
    - 改进 – 应记录、分析和审查从小型和大型事件中吸取的教训。了解这些教训将使组织能够更好地准备、控制和避免事件及中断。\n\n### 关键要素\n\n组织IRBC的关键要素可总结如下：\n\
    \n- 人员：具备适当技能和知识的专家以及合格的备份人员。\n- 设施：ICT资源所在的物理环境。\n- 技术：\n  - 硬件，包括机架、服务器、存储阵列、磁带设备和固定装置。\n\
    \  - 网络，包括数据连接、语音服务、交换机和路由器。\n  - 软件，包括操作系统、应用软件以及它们之间的链接或接口。\n  - 应用程序和批处理例程。\n\
    \  - 数据：应用程序数据、语音数据和其他类型的数据。\n  - 流程，例如用于描述ICT资源配置并支持这些服务有效运行、恢复和维护的支持文档。\n- 供应商：端到端服务的其他组件，其中ICT服务提供依赖于外部服务提供商或供应链中的另一个组织——即金融市场数据提供商、电信运营商或互联网服务提供商。\n\
    \n### 使用计划-执行-检查-行动建立组织的ICT就绪性\n\n#### 政策\n\n组织的IRBC政策提供了其所追求的有记录的原则，并据以衡量其有效性。它应该\n\
    \n- 建立并展示管理层对IRBC计划的承诺，\n- 包含或引用组织的IRBC目标，\n\n![](img/8bcb92bad95ddd74218ba966f2798d54_78_0.png)\n\
    \n图 6.2 ICT就绪性流程的要素（ISO，2020）。\n\n- 定义IRBC的范围，包括限制和排除项，\n- 获得管理层批准并签字确认，\n- 向适当的内部和外部利益相关者传达，\n\
    - 识别并提供相关权限，以确保预算和人员等资源的可用性，从而按照IRBC政策开展活动，以及\n- 在计划的间隔以及发生重大变化（例如环境变化或组织业务和结构变化）时进行审查。\n\
    \n#### 规划\n\n规划阶段的主要目标是建立组织的ICT就绪性要求，包括以下内容：\n\n- 支持已定义范围及组织业务连续性目标和宗旨实现所需的法律、法定和监管要求的IRBC策略和IRBC计划。\n\
    - 组织监控实现这些目标和宗旨所需的ICT就绪性程度所需的绩效标准。\n\n#### 资源\n\n作为政策授权的一部分，组织将IRBC计划的需求定义为其整体BCM目标的一部分，并确定和提供建立、实施、运行和维护IRBC计划所需的资源。\n\
    \n应定义并记录IRBC的角色、职责、能力和权限。\n\n管理层应执行以下任务：\n\n- 任命或提名一位具有适当资历和权限的人员，负责IRBC政策和实施。\n\
    - 任命一名或多名合格人员，无论其他职责如何，都应实施本计划的各项要素。\n- 按计划所述维护IRBC管理系统。\n\n#### 员工能力\n\n组织应确保所有被分配IRBC职责的人员都具备执行所需任务的能力。\n\
    \n"
