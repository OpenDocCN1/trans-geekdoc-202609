    the opposite is true. When the costs and benefits of an activity are equal, the
    decision-maker may factor other qualitative measures into the decision.


    The three major activities usually associated with cybersecurity are (1) protecting
    the information of the authorized users of the information, (2) making information
    available to the authorized users on a timely basis and (3) protecting information
    from integrity flaws.


    The costs associated with these activities are significant, as organizations will
    incur costs to detect and correct security breaches that cannot be prevented.
    The benefits of cybersecurity are related to the cost savings, known as cost avoidance,
    associated with preventing cybersecurity breaches. The cost–benefit framework
    states that the goal of an organization should be to implement security procedures
    up to a point where the benefits minus the costs are maximized. In this framework,
    implementing cybersecurity activities beyond that point means that the incremental
    costs are greater than the incremental benefits of the additional security measures.
    In essence, the net benefit of implementing incremental cybersecurity measures
    beyond the maximum point is negative and, therefore, represents a financial cost
    to the organization.


    In contrast, the cybersecurity risk-management framework has four areas of consideration:
    (1) alignment with the organization’s risk appetite, (2) alignment with the risk-assessment
    process, (3) understanding of the cost–benefit analysis and (4) justification
    of the risk-mitigation strategy. Although cost–benefit analysis is impactful from
    a financial perspective, in some cases, other factors need to be considered to
    fully understand the impact of not implementing additional security measures.
    Incurring the cost of preventative security measures is essential, as in most
    cost–benefit analyses, the actual cost of remediating a cybersecurity breach is
    unrealized. Specifically, most organizations do not have the data to appropriately
    assess the cost/impact of a cybersecurity breach on an organization, such as its
    effect on the organization’s brand/reputation, legal/regulatory landscape, operational/technology
    environment, forensic/e-discovery-related items and third-party suppliers. Therefore,
    to adequately implement cybersecurity measures, in addition to conducting a cost–benefit
    analysis, stakeholders should implement an elaborate decision-making process to
    determine the additional security measures needed to adequately protect an organization
    from a cybersecurity breach while aligning with its risk appetite.'
