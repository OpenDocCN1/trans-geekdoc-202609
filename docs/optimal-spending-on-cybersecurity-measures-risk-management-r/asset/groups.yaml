    +   1 Agile and lean refer to teams iterating, with short development cycles and
    fast feedback. Agile focuses on culture and is agnostic in regard to the tools
    used.

    +   2 DevOps refers to how engineering organizations collaborate using cross-functional
    teams. DevOps starts with culture and drives towards tooling.

    +   3 System reliability engineering (SRE) refers to how engineering organizations
    automate, entrusting highly scaled operations to people with a software engineering
    mindset. SRE starts with tooling and drives towards culture.

    +   4 DevOps variants (such as “SecDevOps”) involve the insertion or addition
    of another organization/practice early in the SDLC, and the prevalence of these
    different types of DevOps speaks to the increasing integration of functions in
    modern organizations.


    DevOps incorporates many variations on the theme. However, most observers would
    agree that the following capabilities are common to virtually all DevOps cultures:
    (1) collaboration, (2) automation, (3) continuous integration, (4) continuous
    delivery, (5) continuous testing, (6) continuous monitoring and (7) rapid remediation.'
