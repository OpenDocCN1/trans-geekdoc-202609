    2019 年 5 月 1 日至 2020 年 4 月 30 日，以及 (3) 支付卡行业 (PCI) 数据安全标准 (DSS) 自我评估问卷 (SAQ)，截至
    2019 年 3 月 21 日。


    ### 资产管理


    - 供应商和第三方合作伙伴（即 DigitalEd 和 Google）中的物理设备和系统已列入清单。

