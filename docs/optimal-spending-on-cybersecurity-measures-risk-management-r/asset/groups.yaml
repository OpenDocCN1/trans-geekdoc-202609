- raw:
  - '[PAGE 131]


    +   - Privileged users understand their roles and responsibilities.

    +   - Third-party stakeholders—that is, suppliers, customers and partners—understand
    their roles and responsibilities.

    +   - Senior executives understand their roles and responsibilities.

    +   - Physical and cybersecurity personnel understand their roles and responsibilities.


    # DATA SECURITY


    +   - Multiple tenants are separated by individual databases and containers, such
    that there is no possibility for cross-contamination of data.

    +   - Communications and data transfers to data stores are encrypted via TLS 1–1.2
    protocols.

    +   - Encryption is used for traffic traversing the fibre between Google production
    facilities.

    +   - Google has an established key management process in place to support the
    organization’s use of cryptographic techniques.

    +   - Customer data that are uploaded or created are encrypted at rest.

    +   - Passwords are stored in the Möbius database using a b-crypt encryption scheme.

    +   - Databases are partially encrypted; that is, passwords are fully encrypted,
    but all table information is not fully encrypted.

    +   - DigitalEd uses Google''s Cloud Platform data centres as the hosts.

    +   - There are three centres used, which are as follows:

    +     - North America data are hosted in Montreal, Canada.

    +     - European Union and UK data are hosted in Germany.

    +     - Australia and Japan data are hosted in Australia.

    +   - Additionally, customers from China utilize Aliyun.

    +     - Chinese data are hosted in China.

    +   - Anti-virus, phishing detection, secure coding and anti-malware/anti-spam
    tools are in place to protect Google''s information assets. Tools are utilized
    to detect deviations from pre-defined OS configurations on production machines
    and correct them.

    +   - PII on removable media leaving Google facilities is approved and encrypted.

    +   - Google prohibits the use of removable media for the storage of PII and SPII
    unless the data have been encrypted.

    +   - Google data centre server floors, network rooms and security systems are
    physically isolated from public spaces and/or delivery areas.'
  - '[PAGE 132]


    +   • Access to sensitive data centre zones requires approval from authorized
    personnel and is controlled via badge readers, biometric identification mechanisms
    and/or physical locks.


    +   • Google data centres use redundant power systems and environmental controls
    for all systems to ensure reliability.


    # INFORMATION PROTECTION PROCESSES AND PROCEDURES


    +   • Google has developed policies and procedures governing the secure development
    lifecycle.


    +   • Google application and configuration changes are tested prior to implementation
    to production.


    +   • Google system changes are reviewed and approved by a separate technical
    resource before moving into production.


    +   • DigitalEd uses an application lifecycle management tool to manage all changes
    to the product and configuration changes. The process is reviewed every release
    and is followed by all engineering staff. The process has input from several stakeholders,
    as well as reviewers.


    +   • Any changes to DigitalEd''s policies or environment would be communicated
    directly to the appropriate contacts and via the following privacy policy page:
    www.digitaled.com/privacy.


    +   • In the event of emergencies that may affect Möbius services, customer contact
    persons are notified immediately with any relevant information and resolution
    plans.


    +   • DigitalEd can communicate by phone, e-mail and in application messaging
    via a banner.


    +   • DigitalEd reviews and updates the BCP annually.


    +   • In the event of emergencies that may affect Möbius services, backups (onsite
    and offsite) can be used to restore functionality in other locations with minimal
    loss of data.


    +   • Each region listed below has three zones used to provide continuous service.
    However, data are maintained in the appropriate regions as follows:

    +     • North America data are hosted in Montreal, Canada.

    +     • European Union and UK data are hosted in Germany.

    +     • Australia and Japan data are hosted in Australia.


    +   • DigitalEd is currently in the process of updating the Disaster Recovery
    Plan (DRP); once updated, it will be reviewed and tested.


    +   • DigitalEd Engineering has a checklist of security-related questions and
    testing that is used to ensure that the product is securely developed and implemented.'
  - '[PAGE 133]


    +   - Google has security policies addressing confidentiality, integrity and availability
    that have been approved by management and published on the intranet, which is
    accessible to all employees.

    +   - Google establishes security policies and procedures that clearly define
    the information security responsibilities of all employees. Within the information
    security policies and procedures, Google assigns responsibilities to the Google
    Information Security team.

    +   - Google manages operational risk by delegating decisions regarding risk identification
    and resource prioritization to the various engineering groups that directly support
    the operation of Google products and services.

    +   - Google has established policies and procedures that govern the use of cryptographic
    controls.


    # MAINTENANCE


    +   - DigitalEd has a separate group known as the site reliability team that manages
    and maintains the systems that support Môbius.

    +   - This team has several tools that are used to manage changes to the system
    and ensure that changes are reviewed and well understood.

    +   - The maintenance and repair of assets are performed and logged with approved
    and controlled tools.

    +   - Remote maintenance of assets is approved, logged and performed in a manner
    that prevents unauthorized access.


    # PROTECTIVE TECHNOLOGY


    +   - Audit/log records are determined, documented, implemented and reviewed in
    accordance with policy.

    +   - Removable media are protected, and their use is restricted according to
    policy.

    +   - The principle of least functionality is incorporated by configuring systems
    to provide only essential capabilities.

    +   - Communications and control networks are protected.

    +   - Mechanisms—that is, failure safety, load balancing, and hot swaps—are implemented
    to achieve resilience requirements in normal and adverse situations.

    +   - Mechanisms are in place to prevent and disconnect unauthorized access to
    the Google network from unauthorized devices.

    +   - Google segregates networks based on the types of services, users and information
    systems.'
  - '[PAGE 134]


    +   - Google has an established key management process in place to support the
    organization’s use of cryptographic techniques.

    +   - Descriptions of Google’s system and its boundaries are available to authorized
    external users by ongoing communications with customers or via Google’s official
    blog postings.

    +   - Google has dedicated teams who are responsible for monitoring, maintaining,
    managing and securing the networks. Access to network devices is restricted to
    authorized personnel and is periodically reviewed. Devices require a valid machine
    certificate to access the corporate network. Connections to the corporate wireless
    network are encrypted. There are mechanisms in place to protect the production
    environment against a variety of application-layer denial-of-service attacks.

    +   - Google segregates networks based on the types of services, users and information
    systems.


    # ANOMALIES AND EVENTS


    +   - A baseline of network operations and expected data flows for users and systems
    is established and managed.

    +   - Detected events are analysed to understand attack targets and methods.

    +   - Event data are collected and correlated from multiple sources and sensors.

    +   - The impacts of events are determined.

    +   - Incident alert thresholds are established.

    +   - When Google determines that there has been a breach, policies and procedures
    exist to ensure that customers are notified in a timely manner in accordance with
    disclosure laws or contractual agreements.


    # SECURITY CONTINUOUS MONITORING


    +   - DigitalEd has a policy of performing security and penetration testing annually,
    including incorporating the lessons learned into the software development life
    cycle.

    +   - In November 2019, security penetration testing was performed by Info-Transec
    against the 2019.2 release.

    +   - In situations when security/penetration testing vulnerabilities are identified,
    they are prioritized with the most critical problems addressed in the release.

    +   - The network is monitored to detect potential cybersecurity events.

    +   - The physical environment is monitored to detect potential cybersecurity
    events.

    +   - Personnel activity is monitored to detect potential cybersecurity events.'
