  - '[PAGE 130]


    +   - Google has an established policy specifying that access to information resources,
    including data and the systems that store or process data, is authorized based
    on the principle of least privilege.

    +   - Google maintains formal user registration and de-registration procedures
    for granting and revoking access.

    +   - Google has established formal guidelines for passwords to govern the management
    and use of authentication mechanisms.

    +   - Access to sensitive Google systems and applications requires two-factor
    authentication in the form of a user ID, password, security key and/or certificate.

    +   - Google separates the duties of individuals by granting users access based
    on job responsibilities and least privilege and limiting access to only authorized
    users.

    +   - Access to Google’s production machines, support tools and network devices
    are managed via access control lists. Modifications of the access control lists
    are recorded and approved by administrators.

    +   - Access to Google’s corporate network, production machines, network devices
    and support tools requires a unique ID and verified credentials.

    +   - Access to Google’s network devices is authenticated via a user ID, password,
    security key and/or certificate.

    +   - Only Google users with the authorized private key may gain SSH access to
    production machines.

    +   - Access to Google’s internal support tools is restricted to authorized personnel
    using approved credentials.

    +   - External Google system users are identified and authenticated via the Google
    Accounts authentication system before access is granted.

    +   - Remote access to corporate machines requires a Google-issued digital certificate
    installed on the connecting device and two-factor authentication in the form of
    a user ID, password, security key and/or certificate.

    +   - Storage media used for offsite redundancy are protected and controlled during
    transport outside controlled areas using secure storage containers.


    # AWARENESS AND TRAINING


    +   - Google has established a privacy and information security training programme
    and requires relevant personnel to complete this training annually.

    +   - Google has a dedicated security team that is responsible for educating Google
    employees and contractors on security. Google has security policies that have
    been approved by management and published on the intranet, which are accessible
    to all employees and contractors.'
