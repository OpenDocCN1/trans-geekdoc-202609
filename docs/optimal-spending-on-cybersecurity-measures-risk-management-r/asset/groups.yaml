  mdcn: "\n\n- 特权用户了解其角色和职责。\n- 第三方利益相关方—即供应商、客户和合作伙伴—了解其角色和职责。\n- 高级管理人员了解其角色和职责。\n\
    - 物理和网络安全人员了解其角色和职责。\n\n## DATA SECURITY\n\n- 多租户通过独立的数据库和容器进行隔离，因此不存在数据交叉污染的可能性。\n\
    - 向数据存储的通信和数据传输通过 TLS 1.2 协议进行加密。\n- 加密用于在 Google 生产设施之间的光纤上传输的流量。\n- Google 已建立密钥管理流程，以支持组织使用密码技术。\n\
    - 上传或创建的客户数据在静止状态下均已加密。\n- 密码使用 bcrypt 加密方案存储在 Möbius 数据库中。\n- 数据库部分加密；即，密码已完全加密，但所有表信息并未完全加密。\n\
    - DigitalEd 使用 Google Cloud Platform 数据中心作为主机。\n- 使用了三个数据中心，具体如下：\n  - 北美数据托管在加拿大蒙特利尔。\n\
    \  - 欧盟和英国数据托管在德国。\n  - 澳大利亚和日本数据托管在澳大利亚。\n- 此外，来自中国的客户使用阿里云。\n  - 中国数据托管在中国。\n\
    - 已部署反病毒、钓鱼检测、安全编码以及反恶意软件/反垃圾邮件工具，以保护 Google 的信息资产。使用工具检测生产机器上偏离预定义操作系统配置的情况并予以纠正。\n\
    - 离开 Google 设施的可移动介质上的 PII 已获批准并加密。\n- 除非数据已加密，否则 Google 禁止使用可移动介质存储 PII 和 SPII。\n\
    - Google 数据中心服务器楼层、网络机房和安全系统与公共区域和/或送货区域在物理上隔离。\n- 访问敏感数据中心区域需要授权人员批准，并通过徽章读卡器、生物识别机制和/或物理锁进行控制。\n\
    - Google 数据中心为所有系统使用冗余电源系统和环境控制，以确保可靠性。\n\n## INFORMATION PROTECTION PROCESSES\
    \ AND PROCEDURES\n\n- Google 已制定管理安全开发生命周期的政策和程序。\n- Google 应用程序和配置更改在部署到生产环境之前进行测试。\n\
    - Google 系统更改在转入生产环境之前由独立的技术资源审查和批准。\n- DigitalEd 使用应用程序生命周期管理工具来管理产品和配置的所有更改。该流程在每个版本中都会审查，并由所有工程人员遵循。该流程征求了多个利益相关方以及评审人的意见。\n\
    - DigitalEd 的政策或环境的任何更改都将直接通知相应联系人，并通过以下隐私政策页面进行通知：www.digitaled.com/privacy。\n\
    - 在可能影响 Möbius 服务的紧急情况下，客户联系人会立即收到任何相关信息和解决方案。\n- DigitalEd 可以通过电话、电子邮件和通过横幅的应用内消息进行沟通。\n\
    - DigitalEd 每年审查和更新业务连续性计划（BCP）。\n- 在可能影响 Möbius 服务的紧急情况下，可以使用备份（现场和异地）在其他位置恢复功能，且数据损失最小。\n\
    - 下面列出的每个区域都有三个可用区用于提供连续服务。但是，数据按如下方式保存在相应的区域：\n  - 北美数据托管在加拿大蒙特利尔。\n  - 欧盟和英国数据托管在德国。\n\
    \  - 澳大利亚和日本数据托管在澳大利亚。\n- DigitalEd 目前正在更新灾难恢复计划（DRP）；更新后，将对其进行审查和测试。\n- DigitalEd\
    \ 工程团队有一份安全相关问题和测试的检查清单，用于确保产品安全开发和实施。\n- Google 有针对机密性、完整性和可用性的安全政策，已获管理层批准并发布在所有员工均可访问的内联网上。\n\
    - Google 建立安全政策和程序，明确界定所有员工的信息安全职责。在信息安全政策和程序中，Google 将职责分配给 Google 信息安全团队。\n\
    - Google 通过将风险识别和资源优先级排序方面的决策委派给直接支持 Google 产品和服务运营的各个工程团队来管理运营风险。\n- Google 已建立管理密码控制使用的政策和程序。\n\
    \n## MAINTENANCE\n\n- DigitalEd 有一个名为站点可靠性团队的独立团队，用于管理和维护支持 Möbius 的系统。\n- 该团队拥有多种工具，用于管理系统更改并确保更改经过审查并被充分理解。\n\
    - 资产的维护和修理使用经过批准和控制的工具执行并记录。\n- 资产的远程维护经过批准、记录，并以防止未经授权访问的方式执行。\n\n## PROTECTIVE\
    \ TECHNOLOGY\n\n- 审计/日志记录根据政策确定、记录、实施和审查。\n- 可移动介质受到保护，其使用根据政策受到限制。\n- 通过配置系统仅提供基本功能，将最小功能原则纳入其中。\n\
    - 通信和控制网络受到保护。\n- 已实施故障安全、负载均衡和热插拔等机制，以在正常和不利情况下实现弹性要求。\n- 已实施机制以防止并断开来自未经授权设备对\
    \ Google 网络的未经授权访问。\n- Google 根据服务类型、用户和信息系统对网络进行隔离。\n- Google 已建立密钥管理流程，以支持组织使用密码技术。\n\
    - Google 的系统及其边界的描述可通过与客户的持续沟通或通过 Google 的官方博客文章提供给授权的外部用户。\n- Google 拥有专门团队，负责监控、维护、管理和保护网络。网络设备的访问仅限于授权人员，并定期审查。设备需要有效的机器证书才能访问企业网络。企业无线网络的连接已加密。已有机制保护生产环境免受各种应用层拒绝服务攻击。\n\
    - Google 根据服务类型、用户和信息系统对网络进行隔离。\n\n## ANOMALIES AND EVENTS\n\n- 已建立并管理用户和系统的网络操作及预期数据流基线。\n\
    - 检测到的事件会被分析，以了解攻击目标和方法。\n- 事件数据从多个来源和传感器收集并关联。\n- 确定事件的影响。\n- 已建立事件警报阈值。\n- 当\
    \ Google 确定发生违规时，存在政策和程序，以确保客户根据披露法律或合同协议及时收到通知。\n\n## SECURITY CONTINUOUS MONITORING\n\
    \n- DigitalEd 有每年进行安全和渗透测试的政策，包括将经验教训纳入软件开发生命周期。\n- 2019 年 11 月，Info-Transec 对\
    \ 2019.2 版本进行了安全渗透测试。\n- 在发现安全/渗透测试漏洞的情况下，将对其进行优先级排序，并在版本中优先解决最关键的问题。\n- 监控网络以检测潜在的网络安全事件。\n\
    - 监控物理环境以检测潜在的网络安全事件。\n- 监控人员活动以检测潜在的网络安全事件。\n\n"
