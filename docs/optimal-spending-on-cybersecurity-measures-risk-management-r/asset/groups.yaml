    # Case study #6: Alumni Learning Consortium


    The Alumni Learning Consortium (ALC) is a new webinar platform designed to meet
    the specific needs of alumni associations. The University of Maryland and 11 other
    colleges and universities formed the ALC, which is managed by Professional Book
    Club Guru (PBC Guru).


    # Current initiative


    The ALC is an organization that can assist ABC University with creating online
    programmes to drive alumni engagement. ABC University partnered with PBC Guru
    to utilize the CloudWays web hosting platform. This solution provides the university
    with an ABC-branded website that facilitates content management and delivery to
    ABC alumni for the following services:


    +   1 Livestream platforms – hosted webinars and live-stream events to international
    participants, with a limitless number of events or participants, including the
    following:

    +   * Unlimited events, registrations and viewers.

    +   * A school-branded microsite that allows alumni to register for upcoming live
    streams, view live streams and watch past events.

    +   * Analytics of the individuals who register and attend each programme.

    +   * Personalized screen views that allow on-screen branding with support for
    webinars, panel discussions and streaming in-person events.

    +   * Seamless integration with white-label live streams created by the ALC.

    +   * An annual fund donation request on the registration page of each online
    event.

    +   * Technical support and platform training.


    +   2 White-label webinars—programming from best-selling authors and career experts
    for alumni at all life stages. The ALC produces two to four webinars per month
    that are open to the alumni of all member schools. These webinars cover a range
    of career, life-stage and life-long learning topics to engage different segments
    of ABC alumni. Each webinar is “white labelled”, meaning that it is branded for
    ABC on the alumni webinar page, creating a seamless watch experience for ABC alumni.
    The consortium can bring top presenters to the ABC alumni due to the size of the
    ALC network.'
