    Examples of countermeasures include the following:


    +   - Keep the patching solution components tightly secured, including patching
    them.

    +   - Encrypt network communications.

    +   - Verify the integrity of patches before installing them—that is, use checksums.

    +   - Test patches before deployment to identify corruption.


    # Patch management process


    The fundamental considerations that an organization should integrate into its
    patch management process are discussed in the following sections.


    # Discovery


    The technology group ensures that the organization has a comprehensive, accurate
    network inventory that includes the following:


    +   - Understanding the types of devices.

    +   - OSs.

    +   - OS versions.

    +   - Third-party applications.


    # Standardization and categorization


    The technology group should implement a standardized approach to ensure, when
    possible, that devices run the same OS, use the same hardware, are configured
    in the same manner and run the same applications. The technology group should
    segment managed systems and/or users according to risk and priority based on the
    following aspects:


    +   - Machine types—that is, server, laptop, etc.

    +   - OSs.

    +   - OS versions.

    +   - User roles.


    # Patch management policy creation


    The technology group should create patching criteria by establishing what will
    be patched, when, and under what conditions. For example, the following should
    be considered:'
  - '[PAGE 46]


    +   - The frequency of the patching cycle—that is, the patching schedule for laptop
    end users may be weekly, while patching for servers may be less frequent and more
    manual.

    +   - The patching rollout cycle—that is, browser updates versus OS updates, critical
    versus non-critical updates.

    +   - Identification of maintenance windows to avoid disruption—that is, consider
    time zones for “follow the sun” patching.

    +   - Creation of exceptions.


    # Monitor new patches and vulnerabilities


    The technology group should implement a process to effectively:


    +   - understand vendor patch release schedules and models and identify reliable
    sources for timely vulnerability disclosures and

    +   - create a process for evaluating emergency patches.


    # Patch testing


    The technology group should ensure that an appropriate test environment is in
    place to


    +   - test that patches are working appropriately before production deployment,

    +   - create backups for easy rollback if necessary,

    +   - validate successful deployment and

    +   - monitor incompatibility or performance issues.


    # Configuration management


    The technology group should have a mechanism in to place to capture any changes
    made throughout the patching process.


    # Patch deployment


    Patch deployment should be well documented, with a planned outline for the changes
    that will occur once the patch is applied. The technology group should have an
    automated patch management process that facilitates scheduled regular update scans
    and ensures that patches are applied during non-peak periods. Clear fallback policies
    should be in place for patch deployment issues.'
  - '[PAGE 47]


    # Patch auditing


    The technology group should have a patch audit process in place to identify any
    failed or pending patches, including continuous monitoring for any unexpected
    incompatibility or performance issues.


    # Reporting


    The technology group should have a mechanism in place to produce a patch compliance
    report when required. This includes documenting risk acceptance and any exceptions
    that may occur.


    # Review, improve and repeat


    The technology group should have an established cadence for repeating and optimizing
    the patch management process, including the following:


    +   - Phasing out or isolating any outdated or unsupported machines.

    +   - Reviewing applicable policies.

    +   - Revisiting exceptions to verify whether they still apply or are necessary.


    # Verify vulnerability remediation through network and host vulnerability scanning


    The technology group and system administrators should verify that they have successfully
    remediated or mitigated vulnerabilities as intended.


    The technology group should confirm that the remediations have been conducted
    appropriately to avoid a security incident or unplanned downtime. This can be
    accomplished by several methods:


    +   - Verify that the files or configuration settings that the remediation was
    intended to correct have been changed as stated in the vendor’s documentation.

    +   - Scan the host with a vulnerability scanner to detect known vulnerabilities.

    +   - Review patch logs to verify that the recommended patches were installed
    properly.

    +   - Employ exploitation procedures or code to attempt to exploit the vulnerability—that
    is, perform a penetration test.


    Generally, exploitation tests involve launching actual attacks within a network
    or on a host, and this type of testing should be performed only on non-production
    equipment for certain vulnerabilities.'
  - '[PAGE 48]


    # Review the patch log


    Log files keep track of the history of a system. Patch logs can assist the technology
    group, as well as system administrators, with tracking and verifying installed
    patches. Using patch logs to monitor an organization’s systems helps achieve consistency
    and compliance with the remediation plan.


    An organization’s patch logs provide the following capabilities:


    +   - Identify which patches are installed on a system, allowing easy confirmation
    that the appropriate set of patches has been applied.

    +   - Ensure that patches are applied consistently across the organization through
    a comparison of log files.

    +   - Verify that a patch has been installed properly.

    +   - Determine whether the patch or a subsequent update improperly removed or
    damaged a previous patch.


    # Check patch levels


    An organization should consider verifying the patch levels of hosts. In most deployments,
    each host runs an agent that monitors various characteristics, such as OSs and
    application patches and anti-virus updates. When the host attempts to connect
    to the network, a network device such as a router requests information from the
    host’s agent. If the host does not respond to the request or the response indicates
    that the host is not fully patched, the network device causes the host to be placed
    on a separate virtual local area network (VLAN). This allows the organization
    to update the unpatched hosts while severely restricting functionality. Once a
    host on the VLAN has been fully updated, it is moved automatically from the VLAN
    to the organization’s regular network. The VLAN strategy can be particularly helpful
    for ensuring that mobile hosts are fully patched.


    # Vulnerability remediation training


    An organization should train administrators in how to apply vulnerability remediations.
    In organizations that rely on end users to patch computers, the technology group
    must also train users in this function.


    # Deploy security metrics


    This section discusses the development of patch and vulnerability metrics in the
    context of measuring characteristics per system. The word “system” here refers
    to a set of IT assets, processes, applications and related resources that are
    under the same direct management and budgetary control and have the'
  - '[PAGE 49]


    same function or mission objective, have essentially the same security needs and
    reside in the same general operating environment.


    # Type of patch and vulnerability metrics


    There are three main categories of patch and vulnerability metrics:


    +   - Susceptibility to attack.

    +   - Mitigation response time.

    +   - Cost.


    An organization’s susceptibility to attack can be approximated by several measurements.
    An organization can measure the following:


    +   - Number of patches needed.

    +   - Number of vulnerabilities.

    +   - Number of network services running on a per-system basis.


    These measurements should be taken individually for each computer within the system,
    and the results should then be aggregated to determine the system-wide results.
    Both raw results and ratios—that is, the number of vulnerabilities per computer—are
    important. The raw results help reveal the overall risk that a system faces because
    the more vulnerabilities, unapplied patches and exposed network services exist,
    the greater the chance that the system will be penetrated. Large systems consisting
    of many computers are thus inherently less secure than smaller similarly configured
    systems.


    The organization should consider using ratios when comparing the effectiveness
    of the security programmes of multiple systems. Ratios allow effective comparisons
    between systems. Both raw results and ratios should be measured and published
    for each system, as appropriate, since both are useful and serve different purposes.
    The initial measurement approach should not consider system security perimeter
    architectures—that is, firewalls that would prevent an attacker from directly
    accessing vulnerabilities on system computers. The default position should be
    to secure all computers within a system even if the system is protected by a strong
    security perimeter.


    Because most systems will not be fully secured, for a variety of reasons, the
    measurement should then be recalculated while factoring in the system’s security
    perimeter architecture. This will provide a meaningful measurement of a system’s
    actual susceptibility to external attackers. For example, this second measurement
    should not count vulnerabilities, network services or needed patches on a computer
    if they cannot be exploited through the system’s main firewall.'
