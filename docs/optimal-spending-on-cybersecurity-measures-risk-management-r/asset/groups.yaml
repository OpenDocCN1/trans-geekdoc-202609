    of Modern Web Applications: Knowledge, Skills, and Abilities for DevOps. Information
    Technology & Systems, Institute of Technology, University of Washington, Tacoma.


    Baranyj, J. & Buss da Silva, N. 2017. The use of predictive models to optimize
    risk of decisions. International Journal of Food Microbiology, 240, 19–23.


