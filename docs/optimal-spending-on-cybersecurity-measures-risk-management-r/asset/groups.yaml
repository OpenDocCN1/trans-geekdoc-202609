    \n## 优先处理资产\n\n组织应在资产清单中为每台设备定义风险和关键价值。识别设备的重要性以及负责批准访问该设备的个人非常重要。\n\n了解战略因素并清晰掌握详细信息时，以下因素非常重要：\n\
    \n- 风险偏好。\n- 风险承受水平。\n- 每台设备的风险缓解实践和政策。\n- 剩余风险处理。\n- 每台设备或服务的对策（如果服务与设备相关联）。\n\
    - 业务影响分析。\n\n## 评估漏洞\n\n以下部分描述了使用任何自动化或手动工具有效完成漏洞评估过程所采用的方法。\n\n## 系统基线定义\n\n\
    在漏洞评估之前会收集系统信息，并审查以下信息：\n\n- 设备是否具有适当的开放端口、进程和服务。\n- 应安装在设备上的批准驱动程序和软件。\n- 每台设备的基本配置；例如，如果设备是边界设备，则不应将其配置为包含默认管理员用户名。\n\
    \n## 漏洞扫描\n\n漏洞扫描器在许多组织中常被用来识别主机和网络上的漏洞。漏洞扫描器不仅识别主机及其上的开放端口，还识别关联的漏洞。会识别主机操作系统和活动应用程序，然后将其与已知漏洞数据库进行比较。\n\
    \n漏洞扫描器分为两种类型。\n\n网络扫描器用于绘制组织网络图并识别开放端口、易受攻击的软件和配置错误的服务。它们可以安装在网络上的单个系统上，并能快速定位和测试大量主机。\n\
    \n网络扫描器通常无法有效收集使用个人防火墙的主机的准确信息，除非个人防火墙配置为允许网络扫描活动。\n\n主机扫描器必须安装在要测试的每个主机上。这些扫描器主要用于识别特定主机操作系统和应用程序的配置错误及漏洞。主机扫描器具有高检测粒度，通常不仅需要主机（本地）访问权限，还需要根或管理员帐户。某些主机扫描器提供修复配置错误的功能。\n\
    \n组织的漏洞扫描器提供以下功能：\n\n- 识别网络上的活动主机。\n- 识别主机上的活动和易受攻击的服务（端口）。\n- 识别与发现的操作系统和应用程序关联的漏洞。\n\
    - 测试主机应用程序使用/安全策略的合规性。\n- 识别过时的软件版本以及适用的补丁或系统升级。\n\n在开始漏洞扫描之前，组织的技术团队应将适用的合规性要求集成到配置中。推荐的方法包括在被评估平台上使用相关工具和插件：\n\
    \n- 最佳扫描——即热门端口。\n- CMS Web 扫描——即 Joomla、WordPress、Drupal、通用 CMS。\n- 快速扫描。\n-\
    \ 最常见端口最佳扫描——即 65,535 个端口。\n- 防火墙扫描。\n- 隐蔽扫描。\n\n## 激进扫描\n\n- 全扫描，识别利用攻击和分布式拒绝服务（DDoS）攻击。\n\
    - 开放 Web 应用安全项目（OWASP）Top 10 扫描和 OWASP 检查。\n- Web 应用程序的 PCI DSS 准备。\n- 健康保险可携性和责任法案（HIPAA）合规性策略扫描。\n\
    \n## 漏洞评估报告\n\n漏洞评估报告应包括以下内容：\n\n- 基于资产关键性和结果的风险缓解技术。\n- 与结果和系统基线定义之间可能存在的任何差距相关的发现——即任何配置错误和发现的偏差。\n\
    - 纠正偏差和缓解可能漏洞的建议。\n\n报告中应详细说明高危和中危漏洞，包括以下内容：\n\n- 漏洞名称。\n- 发现日期。\n- 基于常见漏洞与披露（CVE）数据库的评分。\n\
    - 漏洞的详细描述。\n- 受影响系统的详细信息以及纠正漏洞的流程。\n- 如果可能，系统的漏洞概念验证（PoC）。\n- 用于漏洞负责人、纠正漏洞所花费的时间、下一次修订以及从漏洞识别到最终解决方案之间的对策的空白字段。\n\
    \n## 优先处理漏洞修复\n\n利益相关者应确定组织处理漏洞修复的顺序。技术组织负责监控安全来源中的漏洞公告、补丁和非补丁修复以及与组织清单内软件相对应的威胁。应监控多种来源，以确保相关利益相关者了解所有新发现的漏洞。\n\
    \n## 安全问题类型\n\n技术组织负责监控漏洞、修复和威胁：\n\n- 漏洞是导致系统安全性出现弱点的软件缺陷或配置错误，可被恶意实体利用以违反策略。\n\
    - 修复包括三种主要方法：\n  - 安装软件补丁。\n  - 调整配置设置。\n  - 删除受影响的软件。\n- 威胁是恶意实体开发的用于利用漏洞并可能对计算机系统或网络造成损害的攻击能力或方法。威胁通常以利用脚本、蠕虫、病毒、根套件和特洛伊木马的形式出现。\n\
    \n系统管理员应监控其控制下运行不在组织清单内的软件的系统，以查找漏洞、修复和威胁。\n\n## 监控漏洞、修复和威胁\n\n有多种资源可用于监控漏洞、修复和威胁的状态。每种资源都有其自身的优势和劣势。\n\
    \n建议使用多种类型的资源以确保准确和及时的了解。最常见的资源类型如下：\n\n- 供应商网站和邮件列表。\n- 第三方网站。\n- 第三方邮件列表和新闻组。\n\
    - 漏洞扫描器。\n- 漏洞数据库。\n- 企业补丁管理工具。\n\n组织可以使用以下资源类型来监控漏洞、修复和威胁：\n\n- 企业补丁管理工具，用于从受支持的供应商处获取所有可用补丁。\n\
    - 供应商安全邮件列表和网站，用于从企业补丁管理工具不支持的供应商处获取所有可用补丁。\n- 漏洞数据库是国家漏洞数据库或邮件列表，用于获取所有已知漏洞和建议修复的即时信息。\n\
    - 第三方漏洞邮件列表——即 US-CERT 网络安全警报，突出显示最关键的漏洞。\n\n对新漏洞、修复或威胁进行初步评估后，技术团队应继续监控更新和新信息。\n\
    \n## 优先处理漏洞修复\n\n技术团队在设定漏洞修复优先级时，应考虑每个威胁及其对组织的潜在影响。此评估包括以下内容：\n\n- 确定威胁或漏洞的重要性。\n\
    - 确定哪些系统易受攻击或暴露，重点关注对运行至关重要的系统和其他高优先级系统。\n- 评估如果漏洞未被删除并被利用，对系统、组织和网络的影响。\n- 确定相关蠕虫、病毒或利用攻击的存在、范围和传播情况。\n\
    - 查明是否已发布恶意代码及其分发级别。\n- 确定造成的损害，例如系统访问、信息泄露、任意代码执行或拒绝服务。\n- 确定应用补丁或非补丁修复所涉及的风险。\n\
    - 通过研究和测试，识别修复是否会影响其他软件应用程序或服务的功能。\n- 确定可接受的风险程度。\n\n## 维护特定修复数据库\n\n技术组织应维护组织内要应用的修复数据库。企业补丁管理工具通常提供相关数据库。技术组织还可以手动维护补丁管理工具不支持的\
    \ IT 技术的单独数据库。\n\n## 执行修复的通用测试\n\n技术组织应在使用标准化配置的 IT 设备上测试补丁和非补丁修复。系统管理员负责测试补丁和非补丁修复以缓解\n\
    \n"
