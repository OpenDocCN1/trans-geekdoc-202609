  mdcn: '


    ## 定义需求


    作为其业务连续性管理（BCM）计划的一部分，组织应根据业务影响分析确定的连续性优先级对其活动进行分类，并定义每项关键活动需要执行的最低水平。


    管理层应就组织的业务连续性要求达成一致，这些要求将针对每个产品、服务或活动的最低业务连续性目标（MBCO）产生恢复时间目标（RTO）和恢复点目标（RPO）。RTO
    从中断发生之时开始，直到产品、服务或活动恢复为止。


    ## 了解关键服务


    可能存在多项关键 ICT 服务，这些服务对于实现恢复是必需的。每项关键 ICT 服务都应针对 ICT 服务的 MBCO 拥有其自身的文档化 RTO 和 RPO。目标可能包括
    ICT 服务交付的各个方面，例如服务台。关键 ICT 服务的 RTO 优先级始终低于业务连续性的 RTO。组织应识别并记录其关键 ICT 服务，包括简要描述以及在服务用户层面对组织有意义的名称。这将确保业务和
    ICT 人员之间达成共识，因为同一 ICT 服务可能会使用不同的名称。列出的每项关键 ICT 服务都应识别其支持的产品或服务，管理层应就 ICT 服务及相关的
    IRBC 要求达成一致。


    对于每项已识别并达成一致的关键 ICT 服务，应描述并记录端到端服务的所有 ICT 组件，以展示它们如何配置或链接以交付每项服务。应记录常规 ICT 服务交付环境和
    ICT 连续性服务交付环境的配置。


    对于每项关键 ICT 服务，应从预防角度审查当前的连续性能力——即单点故障的存在——以评估服务中断或降级的风险，这可以作为整体 BCM 风险评估练习的一部分。还应寻求改善
    ICT 服务弹性并从而降低服务中断可能性和/或影响的机会。此类审查还可能突出早期检测和响应 ICT 服务中断的机会。组织可以决定是否有针对已识别机会投资以改善服务弹性的商业依据。此风险评估可能构成组织整体风险管理框架的一部分，也可能为增强
    ICT 服务恢复能力的商业依据提供参考。


    ## 识别 ICT 就绪能力与业务连续性要求之间的差距


    对于每项关键 ICT 服务，应将当前的 ICT 就绪安排（例如预防、监控、检测、响应和恢复）与业务连续性要求进行比较，并记录任何差距。


    管理层应被告知关键 IRBC 能力与业务连续性要求之间的任何差距。此类差距可能表明风险以及对额外弹性和恢复资源的需求，例如：


    - 人员，包括人数、技能和知识。

    - 用于容纳 ICT 设备的设施——即计算机机房。

    - 支持技术、工厂、设备和网络。

    - 信息应用程序和数据库。

    - 财务或预算分配。

    - 外部服务和供应商。


    管理层应对 ICT 服务定义、关键 ICT 服务的文档化列表以及关键 IRBC 能力与业务连续性要求之间已识别差距相关的风险进行签字确认。


    这应包括（在适当情况下）对已识别风险进行签字确认。然后应通过确定 IRBC 策略来探讨解决已识别差距和风险的选项。


    ## 确定 IRBC 策略选项


    IRBC 策略应定义实施所需弹性策略的方法，以确保事件预防、检测、响应、恢复和复原的原则到位。


    应评估一系列完整的 IRBC 策略选项。所选策略应支持组织的业务连续性要求。


    组织在制定策略时应考虑实施和持续资源需求。可以聘请外部供应商提供在支持策略方面发挥重要作用的专业服务和技能。


    IRBC 策略应足够灵活，以适应不同市场的不同业务策略。


    此外，策略应考虑内部约束和因素，例如：


    - 预算。

    - 资源可用性。

    - 潜在成本和收益。

    - 技术约束。

    - 组织的风险偏好。

    - 组织现有的 IRBC 策略。

    - 法规义务。


    ## IRBC 策略选项


    组织应考虑其关键 ICT 服务事件就绪的一系列选项。这些选项应允许增加保护和弹性，并为非计划中断后的恢复和复原提供保障，可能包括内部安排。提供给组织的服务可以由一个或多个第三方在外部提供。


    选项应考虑确保关键 ICT 服务连续性和恢复所需的各种组件。


    ## 技能和知识


    组织应识别维护核心 ICT 技能和知识的适当策略。这可能超出员工范围，扩展到承包商和其他拥有广泛 ICT 专业技能和知识的利益相关者。保护或提供这些技能的策略可能包括：


    - 记录执行关键 ICT 服务的方式。

    - 对 ICT 员工和承包商进行多技能培训，以增强技能冗余。

    - 分离核心技能以降低风险集中度。

    - 知识保留和管理。


    ## 设施


    根据已识别的风险，组织应制定策略以减少常规 ICT 设施不可用的影响。这些策略可能包括以下一项或多项：


    - 组织内部的替代设施，包括转移其他活动。

    - 其他组织提供的替代设施。

    - 第三方专家提供的替代设施。

    - 在家或其他远程站点工作。

    - 其他商定的合适工作设施。

    - 在既定站点使用替代劳动力。

    - 可以运输到中断现场并用于直接替换部分相关物理资产的替代设施。


    ICT 设施策略可能差异很大，可能有多种选项可用。不同类型的事件或威胁可能需要实施多种策略，这些策略部分取决于组织的规模、活动范围、地点、技术和预算。


    在考虑使用替代场所时，应考虑以下事项：


    - 站点安全。

    - 员工访问。

    - 与现有设施的接近程度。

    - 可用性。


    ## 技术


    关键业务活动依赖的 ICT 服务应在依赖的关键业务活动恢复之前可用。所需解决方案应确保应用程序在特定时间范围内可用；也就是说，RTO 应作为业务影响分析（BIA）的一部分来确定。技术平台和应用软件应在组织要求的时间范围内到位。支持关键
    ICT 服务的技术通常需要复杂的安排来确保连续性，在选择 IRBC 策略时应考虑以下事项：


    - 支持 BCM 计划识别的关键活动的关键 ICT 服务的 RTO 和 RPO。

    - 技术站点之间的位置和距离。

    - 技术站点的数量。

    - 系统的远程访问。

    - 冷却要求。


