    ## 8 案例研究


    ### 案例研究 #1 – Möbius 解决方案


    Möbius 是一个行业领先的数字学习平台，擅长为全球高等教育机构创建和部署交互式教学和评估内容。目前，ABC大学使用 Maple TA，这是一种供应商构建的本地测试和评估软件解决方案。此举旨在将该平台迁移到该解决方案的软件即服务（SaaS）版本，即
    Möbius。Möbius 平台为对攻读科学、技术、工程和数学课程感兴趣的 ABC大学学生提供交互式、在线方式。此举还将促进与大学学习管理系统（LMS）的集成。学生的信息、成绩和课程将存储在此应用程序中。


    ### 问题


    1. 确定固有风险。

    2. 使用 NIST 网络安全框架：核心组件评估内部控制环境。

    3. 确定风险偏好、风险承受能力和风险概况。

    4. 评估剩余风险，并在适当时提供建议。

    5. 制定风险缓解策略。


    ### 解决方案


    ### 业务概览


    在市场上拥有超过 15 年历史的 Möbius 平台被全球一些最大机构的学生、助教和教授使用。Möbius 是一个强大的在线创作和交付环境，专为满足科学、技术、工程和数学（STEM）课堂的需求而设计。它包括一套工具和功能，供作者设计和开发面向学生或同行的数字资产，以及一个交付环境，通过结合教学材料和动手活动，使用户能够并促进深度和主动学习。


    Möbius 平台提供以下功能：


    - 创建和部署在线 STEM 课程的机制。

    - 课程、评估和交互式学习活动，为 STEM 学生在引导但自定义的节奏下获取知识提供潜力。

    - 具有世界一流数学引擎的复杂 STEM 学科。

    - 创建和使用强大的多媒体可视化效果以锚定关键 STEM 概念的能力。

    - 向学生提供即时且有意义的反馈，并向教师提供学生参与度和理解度的数据。

    - 具有算法生成和随机问题的高级问题类型。

    - 访问由课程专家创建的高质量内容。

    - 与 ABC 的 LMS 无缝集成。


    ### 技术概览


    Möbius 平台由 DigitalEd 供应商拥有。此基于云的解决方案托管在 Google Cloud Platform (GCP) 系统和阿里云中。


    ### 风险评估


    ### 影响和可能性


    影响和可能性评级标准概述了每个保护要求的保护要求级别的评估。表 8.1 显示了适用于风险要素的影响和可能性评级。


    ### 固有风险


    固有风险已根据高、中、低三个分数之一进行分配，如表 8.2 所示。


    ABC大学 (AU) 员工和学生

