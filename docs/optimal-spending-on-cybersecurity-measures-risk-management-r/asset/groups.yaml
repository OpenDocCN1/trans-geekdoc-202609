  - '[PAGE 135]


    +   - Malicious and unauthorized code detection is in place.

    +   - External service provider activity is monitored to detect potential cybersecurity
    events.

    +   - Monitoring for unauthorized personnel, connections, devices and software
    is performed.

    +   - Cloud-based servers have numerous security teams and personnel onsite monitoring
    systems to provide 24 x 7 services.

    +   - There are mechanisms in place to protect the Google production environment
    against a variety of application-layer denial-of-service attacks.

    +   - Google has implemented a vulnerability management programme to detect and
    remediate system vulnerabilities.


    # DETECTION PROCESSES


    +   - The roles and responsibilities for detection are well defined to ensure
    accountability.

    +   - The detection activities comply with all applicable requirements.

    +   - The detection processes are tested.

    +   - Event detection information is communicated.

