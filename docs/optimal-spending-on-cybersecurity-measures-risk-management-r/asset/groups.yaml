  - '[PAGE 92]


    The plans should be documented such that competent personnel can use them in the
    event of an incident and include the following:


    +   Objectives: A short description of the objectives of the plans.


    +   Scope: Covering the following, with reference to the results of the BIA:


    +   The criticality of services: Description of the relevant services and identification
    of their criticality.


    +   Technology: An overview of the main technology that supports services, including
    where it is maintained.


    +   Business units: An overview of the entities that manage the technology.


    +   Documentation: An overview of the main documentation for the technology, including
    the locations where it is stored.


    +   Availability requirements: Business-defined requirements for the availability
    of services and related technology.


    +   Information security requirements: Requirements for the information security
    of services, systems and data, including confidentiality, integrity and availability
    requirements.


    +   Technology recovery procedures: Description of the procedures to be followed
    to recover ICT services, including the following:


    +   A list of activities—that is, desktop support and restoration contact information.


    +   A list of activities for recovering networks, systems, applications and databases
    to an agreed-upon level at an alternative location, considering the changed environment—that
    is, how it could affect line capacity and system-to-system communications.


    +   A list of activities for restoring basic functionality, such as security,
    routing and logging.


    +   Coordination within the application or among applications, data synchronization
    and potential automated procedures for handling a backlog of information.


    +   The process needed to restore ICT services and turn them over to their users
    to operate in recovery mode.


    +   Backup procedures.


    +   Where and how people can obtain further information and instructions—that
    is, hotline numbers and steps to return to normal.


    +   Appendices


    +   Inventory of information systems, applications and databases.


    +   Overview of network infrastructure and server names.


    +   Inventory of hardware and systems software.


    +   Contracts and service-level agreements (SLAs).'
