  mdcn: "\n\n![](img/8bcb92bad95ddd74218ba966f2798d54_140_0.png)\n\n图 8.2 Chime Live\
    \ 通过交互式功能连接远程演示者和参与者。\n\n- 2. 开发一个具有影响力和参与感的虚拟毕业典礼体验，包括以下元素：\n  - a. 典礼历史与传统。\n\
    \  - b. 关注参会者体验。\n  - c. 建筑和场地的虚拟现实导览。\n  - d. ABC 团队的祝贺视频。\n\n- 3. 在庆祝 ABC 成立\
    \ 50 周年之际，包含以下传承项目：\n  - a. 为毕业典礼制作“节日”类型的互动体验，包括 Beyond 50 装置（博物馆在盒子里），并为学院、系所和中心提供虚拟信息展位。\n\
    \  - b. 为毕业生创建特别的毕业照片滤镜。\n  - c. 允许在社交墙上实时祝贺，分享视频和图片，并捕获这些内容以供历史存档。\n  - d. 包含\
    \ 2020 年 6 月 25 日 ABC 的“点亮之夜”活动录像，以及埃德蒙顿高层大桥和卡尔加里塔的点亮场景。\n\nPSAV 员工访问 AWS 基础架构中\
    \ ABC 数据的授权方式如下：\n\n- 访问 AWS 控制台受 ACL 限制，并需要 MFA。\n- 数据库静态加密，所有数据库交互传输过程加密。\n\
    - 数据库备份以加密形式存储。\n- 所有加密均使用 AWS 密钥管理系统完成。\n- 加密密钥访问权限仅限授权网络管理员。\n- 密钥每年轮换一次。\n\
    - ABC 数据访问权限通过各种访问控制系统仅限授权人员。\n- 系统访问权限通过加密虚拟专用网络（VPN）访问仅限授权人员。\n\n## 问题\n\n-\
    \ 1. 确定固有风险。\n- 2. 使用 NIST 网络安全框架：核心组件评估内部控制环境。\n- 3. 确定风险偏好、风险承受度和风险概况。\n- 4.\
    \ 评估剩余风险，如有需要提供建议。\n- 5. 制定风险缓解策略。\n\n## 案例研究 #3：营销自动化工具\n\n目前，ABC 大学的大学关系部门使用多种工具，包括但不限于\
    \ MailChimp、Unbounce 和 Sprout Social，来管理和跟踪其营销活动——即电子邮件培育、登陆页面和转化，以及向潜在学生发布社交媒体内容。由于缺乏对这一局面的整合视图，招聘、营销和沟通团队成员难以协调工作。HubSpot\
    \ Marketing Hub 将通过在单一视图体验中集成营销自动化来解决这一挑战。HubSpot Marketing Hub 将与 Ellucian CRM\
    \ Recruit 产品（ILE）集成，以提供对潜在学习者的端到端管理，包括他们与 ABC 营销和招聘活动的行为互动和体验。HubSpot Marketing\
    \ Hub 将帮助实现活动目标，包括提高学习者/利益相关者满意度、获得更大市场份额，以及提高运营效率以推动学习者申请和注册。\n\nHubSpot Marketing\
    \ Hub 的实施将使 ABC 的营销和招聘工作能够高效扩展，因为大学关系部门继续提升其以程序化和个性化营销工作服务学院的能力。这些策略目前正在开发中，并与\
    \ ABC 的 imagine 战略、大学关系部门的目标以及 ABC 战略招生管理（SEM）计划中概述的招生/增长目标保持一致。\n\nHubSpot 是全球领先的入站营销、销售和服务平台。自\
    \ 2006 年以来，它逐步将其解决方案全球化。如今，来自 90 多个国家的数万名客户使用 HubSpot 软件、服务和支持来改变他们吸引、互动和服务客户的方式。HubSpot\
    \ 的入站营销软件由 VentureBeat、GetApp、Capterra 和 G2Crowd 评为第 1 名，并将社交媒体发布和监控、博客、搜索引擎优化（SEO）、网站内容管理、电子邮件营销以及报告和分析整合在一个平台中。\n\
    \nHubSpot 销售中心和 CRM（HubSpot 获奖的销售应用程序）使销售和服务团队能够与线索、潜在客户和客户进行更有效的对话。HubSpot 服务中心是创建无摩擦环境和令人满意的客户体验的最佳解决方案。\n\
    \nHubSpot 产品以 SaaS 解决方案形式提供。这些解决方案通过专门构建的 Web 应用程序、API 和电子邮件插件向大学提供。\n\nHubSpot\
    \ 投资的主要受益方将是 ABC 的营销和学生招聘团队，因为这将帮助他们提高战略性服务潜在学习者的能力。\n\n## 业务功能\n\nHubSpot Marketing\
    \ Hub 为 ABC 提供了包容性的入站营销软件，便于开展以下活动：\n\n- 1. 内容开发。\n- 2. 定向在线流量。\n- 3. 识别潜在客户的能力。\n\
    - 4. 消费者行为的跟踪和报告。\n- 5. 提供基于软件的工具，以在内部组织和管理信息。\n\n| Marketing Hub（基于 HubSpot CRM\
    \ 构建）功能 | | | | |\n|---|---|---|---|---|\n| 表单 | 移动端优化 | 电话支持 | 子域可用性 | 自定义报告\
    \ |\n| 广告管理 | 用户角色 | 博客与内容创建工具 | 营销自动化 | 活动报告 |\n| 对话收件箱 | Messenger 集成 | SEO\
