    Vulnerability: Anonymous individuals can connect to Microsoft Teams using a guest
    account.


    # Risk prioritization: Assess the inherent risk


    The risk-assessment process is based on a questionnaire in which a set of questions
    is formulated for each risk element. Examples of the question categories include
    the following:


    +   - Financial loss.

    +   - Media attention.

    +   - Reportable to regulator.

    +   - Impact on suppliers and employees.

    +   - Loss or damage to information systems with very limited downtime.


    Each question can be answered in one of five ways, in increasing order of risk,
    such that a risk score between 1 and 5 can be assigned for that question based
    on two rating scales—that is, likelihood and impact. A quantitative inherent risk
    score can be calculated for each question, each risk element and the overall project,
    as follows:


    +   - Risk score per question: Product of the likelihood and impact rating.

    +   - Risk score per element: Accumulating the numerical score per question and
    dividing it by the number of questions for a risk element.

    +   - Risk score for the overall initiative: Accumulating the numerical score
    per risk element and dividing it by the number of risk elements in each project.


    This quantitative inherent risk score is assigned a qualitative risk score categorized
    as high, medium or low. The qualitative inherent risk score shows which element
    carries the most risk, making it easier for decision-makers to decide where to
    allocate resources.


    # Impact rating scale


    Table 7.3 shows the quantitative scale for the impact rating based on a score
    of 1–5.'
