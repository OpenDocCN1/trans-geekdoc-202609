    - 对于高可见性和高敏感性的系统，应考虑进行独立开发测试。

    - 应在组件或安全区域级别完成初步测试，以确保每个组件或安全区域作为实体是安全的。

    - 应捕获生命周期中发生的所有安全测试的过程和结果，以供评估、问题识别和潜在重用。


    本阶段还应考虑以下漏洞评估：


    - 动态代码分析。

    - 渗透测试。

    - 道德黑客。

    - 密码破解。


    ## 发布与维护


    部署和实施后，软件维护期间应遵循安全实践。应用程序应定期更新并按以下方式评估：


    - 安全评估。

    - 漏洞扫描。

    - 渗透测试。

    - 道德黑客。


    ## 云环境


    漏洞管理是识别、分类、修复和缓解漏洞的过程，尤其是针对软件和固件。在基于云的环境中，此过程会变得复杂，因为各种技术层可以根据实现方式由不同组织管理。组织的漏洞管理计划应扩展到确保供应商管理的基于云的解决方案已建立适当的控制措施，以与组织的风险偏好和风险承受能力保持一致。


    ## 云环境中的漏洞扫描


    传统技术环境与基于云的环境之间的差异主要源于（1）组织将拥有和控制云服务基础设施的能力外包给外部供应商，以及（2）组织无法访问云原生服务的漏洞数据。由于 CVE
    ID 通常不分配给云原生漏洞，因此无法将数据与云原生漏洞关联。因此，作为客户的组织很难就易受攻击的云服务做出明智的、基于风险的决策。例如，组织应在何时决定拒绝风险并停止使用云服务，或接受风险并继续使用该服务？


    此外，即使为云原生漏洞分配了 CVE ID，传统环境与云环境之间的差异也非常大，以至于传统环境中通常与 CVE 关联的漏洞数据对于云服务漏洞来说是不充分的。例如，在传统
    IT 环境中，CVE 与软件版本相关联，组织可以通过检查版本来确定软件应用程序是否存在漏洞。在云服务中，软件版本通常仅为云服务提供商所知。因此，作为客户的组织可能无法应用安全控制或其他缓解措施来解决漏洞风险。


    ## 示例：Amazon Web Services Elastic Container Registry 中的漏洞扫描


    Amazon Web Services (AWS) Elastic Container Registry (ECR) 是一个完全托管的容器注册表，可让开发人员轻松存储、管理和部署容器镜像。镜像扫描是
    ECR 中的自动化漏洞评估功能，通过扫描广泛的 OS 漏洞，帮助提升组织应用程序容器镜像的安全性。


    ## 为容器实施镜像扫描


    容器安全涉及开发人员、安全运维工程师和基础设施管理员的一系列活动和工具。云原生供应链中一个关键环节是扫描容器镜像中的漏洞并获得可操作的洞察。ECR 镜像扫描使用
    ECR 原生解决方案，并为特定用例和计划重新扫描提供实施策略作为基础。


    ## 防止带有已知漏洞的镜像进入生产环境


    组织可以为其仓库启用镜像扫描或推送，以确保每个镜像都会自动针对聚合的 CVE 集进行检查。如果可用，AWS ECR 使用上游分发源中的 CVE 严重性；否则，可以使用通用漏洞评分系统
    (CVSS) 分数来获取国家漏洞数据库漏洞严重性评级。这可以帮助组织在将镜像提升并部署到生产环境之前，对容器镜像漏洞进行自动检测和响应。


    有两种扫描类型：


    静态扫描在部署前的环境中执行，这意味着开发人员（或 SecOps）可以在容器启动前检测漏洞。ECR 镜像扫描属于此类；也就是说，它使组织能够扫描容器镜像中的
    OS 软件包以查找 CVE（已知安全威胁的公开列表），而无需组织自行搭建扫描基础设施或购买第三方扫描许可证。


    动态扫描在运行时环境中执行，并识别在测试、QA 或生产环境中运行的容器的漏洞，从而可以识别由构建后安装的软件引入的漏洞以及零日漏洞。对于动态（或运行时）容器安全，有多种第三方选项可供选择


    ![](img/8bcb92bad95ddd74218ba966f2798d54_66_0.png)


    图 5.3 Amazon ECR 中的原生容器镜像扫描 (AWS, 2019)。


    由第三方提供，从 CNCF Falco 等开源解决方案到通过 AWS 容器能力合作伙伴提供的服务，包括 Aqua Security、Trend Micro
    和 Twistlock。


    应用程序投入生产后，验证它们是否仍然没有漏洞。组织还可以使用应用程序编程接口 (API) 命令扫描镜像，从而设置对运行中的容器镜像进行定期扫描，以确保持续监控。扫描完成后，ECR
    会发送通知，结果可在控制台和通过 API 获得。


    ## 用例


    此用例展示了用于生产环境的容器镜像的计划重新扫描。例如，该人员担任 SecOps 角色，负责管理多个 ECR 仓库，与其手动扫描镜像并查看镜像扫描的详细结果，不如使用高级概览并按仓库下钻的功能。示例设置包含四个
    Lambda 函数，用于提供管理扫描配置的 HTTP API 并处理镜像扫描的调度，以及一个 S3 存储桶用于存储扫描配置：


    ![](img/8bcb92bad95ddd74218ba966f2798d54_67_0.png)


    图 5.4 Amazon ECR 中的原生容器镜像扫描 (AWS, 2019)。


    ## 配置管理审计


    安全配置组织的云技术环境是组织与 AWS 之间的共同责任。组织提供安全配置设置的要求，并期望 AWS 提供一种机制来实施和定期审计现有配置。


    ## 风险管理实践 – DevOps


    DevOps 是一个术语，用于描述应用程序开发专业人员与基础设施运维专业人员之间更好的沟通与协作。它指一组新兴实践，旨在使开发人员和运维专业人员能够协同工作。开发人员希望更频繁地发布软件，而运维专业人员希望保护基础设施的稳定性。DevOps
    是一种业务策略，通过重叠传统的运营和开发领域，创造一个环境，通过开发人员和运维人员的交叉融合来不断改进运营。DevOps 的总体战略目标是最大化投资成果，并确保客户以满足其需求的方式持续获得更高的服务质量和功能。本分析将重点放在将风险管理实践集成到
    DevOps 框架中。


    DevOps 的总体目标是提高 IT 工作的业务价值，并专注于以下目标：


    - 通过持续且高质量的服务交付提供可衡量的业务价值。

    - 在技术、流程和人为因素等所有领域强调简单性和敏捷性。

    - 通过实现信任与共享、所有权、支持创新和鼓励协作，打破开发与运维之间的障碍。

    - 管理动态合规，因为访问/共享法律变化迅速。


    DevOps 代表了 IT 文化的变革，通过在面向系统的方法背景下采用敏捷、精益实践，专注于快速 IT 服务交付。DevOps 强调人员（和文化），并寻求改进运维团队与开发团队之间的协作。DevOps
    实施利用技术——尤其是自动化工具，这些工具可以从生命周期角度利用日益可编程和动态的基础设施。


    '
