  - '[PAGE 149]


    SSO authentication mechanism. It is important to note that sensitive data are
    not intentionally stored within the CMS hosting architecture.

    The Cascade initiative would perform the following:


    +   - Implement a new DX platform and DNS server in ABC’s cloud for Internet and
    intranet publishing requirements.

    +   - Develop a new scalable and high-availability architecture for ABC’s Internet
    and intranet, including a monitoring mechanism to gauge performance.

    +   - Develop an Internet and intranet site redesign and implementation plan that
    includes approaches to audit existing sites, develop criteria to identify “high-value
    sites”, develop and implement SEO tactics and work with stakeholders to redesign
    and deploy (or decommission and archive) primary sites based on the new web design
    and publishing standards and workflows.

    +   - Integrate website improvement and digital asset management (DAM) tools with
    the DX platform via APIs and configuration.

    +   - Rationalize and classify all identified sites.

    +   - Redesign and deploy new sites deemed “high-value” primary sites and decommission
    and/or archive the old sites.

    +   - Develop a list of secondary and tertiary sites for future redesign and deployment
    with the redesign of secondary and tertiary sites being out of scope.

    +   - Establish analytics—that is, Google Analytics—for all primary websites deployed.


    The application has two components: content management and content delivery. The
    former is a publishing engine that distributes content to a user-defined target.
    The latter is an arbitrary solution that is utilized by the Cascade software product
    to provide web content to an audience that is most appropriate to the business.


    The websites are categorized based on a criticality rating:


    +   - Critical—medium volume (10,000+), tied to event or business process or important
    communications asset.

    +   - Important—low-volume (<10,000) occasional use, not critical to move and
    can wait.

    +   - Non-critical—faculty web content for current students and staff.

    +   - LSS—low volume does not support a business process; however, it may contain
    historical information.

    +   - Out of scope—high volume (50,000+) used daily—students and staff.'
  - '[PAGE 150]


    The Cascade web content management system provides a means to publish information
    about ABC University’s academic resources for students and faculty and employment
    resources for staff. University websites are the primary means for communication
    with the audience; therefore, this is a business-critical application. The following
    services for website indexing, site search capabilities and DAM were included
    within this project:


    +   1 SiteSearch360—Batman Option as an alternative to the Google Mini Search
    Appliance. The owner of this service is SEMKNOX GmbH, and it involves the insertion
    of simple JavaScript into the Cascade website to facilitate search capabilities—specifically,
    four lines of code. Therefore, hosting or vendor involvement is out of scope.
    Site Search 360 has attained various industry requirements, as follows:


    +   - PCI DSS compliance.

    +   - ISO/IEC 27001:2013 for data centre certification.

    +   - The data processing agreement (DPA) required by general data protection
    regulations (GDPR).

    +   - Technical and organizational measures from SEMKNOX GmbH, the legal entity
    behind Site Search 360, and Hoster.


    +   2 The Enterprise DAM solution utilizes an outsourced data centre managed by
    Brandfolder, and its features include the ability to perform the following:


    +   - Tag and categorize assets.

    +   - Manage asset metadata—that is, name, date and description.

    +   - Create a workflow—that is, permissions for internal and external audiences,
    reviews and approvals, and notification.

    +   - Implement version control and rights management—that is, user restrictions.

    +   - Implement asset sharing across various teams—that is, lightboxes and asset
    tracking.

    +   - Perform searches—that is, simple and advanced searches in the DAM.

    +   - Edit assets—that is, images within the DAM—and convert to different formats.

    +   - Replace an asset in the DAM and have the replacement changed on the website.

    +   - Create a gallery within the DAM.

    +   - Implement reporting.'
  - '[PAGE 151]


    The university does not intentionally store sensitive or classified information
    on the web content management system. However, the possibility of accidental storage
    and distribution of this type of information exists.


    # Questions


    +   1 Determine the inherent risk.

    +   2 Assess the internal control environment using the NIST Cybersecurity Framework:
    Core Components.

    +   3 Determine the risk appetite, risk tolerance and risk profile.

    +   4 Assess the residual risk and provide recommendations, if appropriate.

    +   5 Develop the risk-mitigation strategy.


    # Case study #8: Chrome River travel and expense


    The purpose of this risk assessment was to assess the risk associated with implementing
    Module Finance Upgrade Phase 2: Travel and Expense Claim Module. Sensitive ABC
    data are collected, transmitted and stored in this system, and the risk assessment
    reviews the controls in place to adequately protect ABC data as required by the
    university’s data classification standard operating procedure.


    Chrome River applications leverage years of security leadership to utilize (1)
    security by design, achieved through multilayer encryption capabilities, secure
    systems framework and annual risk analysis; (2) enforced standards, tested processes
    and dedicated tools to protect customer data; and (3) annual security education
    and certification for employees to comply with established business conduct guidelines.
    Operational security is enforced by state-of-the-art scanning and intrusion detection,
    continuously updated to stay ahead of new attack vectors. Chrome River conducts
    regular audits to verify that operational security meets control requirements
    and that a global security incident process is in place that is monitored 24 hours
    per day, 7 days a week and 365 days per year (24×7×365). Chrome River services
    are designed to protect proprietary ABC content and data.


    In April 2018, ABC began the Module Finance & HR Upgrade Project to upgrade the
    finance, payroll and position control modules from Module version 8 to Module
    version 9, as Ellucian was removing support for Module version 8 at the end of
    2018. This phase of the project specifically included only the core modules, and
    items such as the Travel and Expense Management System (Module TEM) were listed
    as out of scope. The project team successfully implemented this upgrade in November
    2018.


    With the core finance and HR modules upgraded to supported versions, the finance
    and administration departments examined the support status of'
  - '[PAGE 152]


    the out-of-scope modules in the project. Module TEM entered sustaining support
    status on January 1, 2019. Ellucian’s supported expense management solution became
    Chrome River expense management, and the project sponsor requested that an upgrade
    to this module be included as a second phase of the Module Finance & HR Upgrade
    project. Digital governance approved a project change request in February 2019
    to implement the Chrome River expense management and invoice management modules.
    The legacy module TEM and associated module workflow products were be decommissioned.


    The purpose of this project was to implement the Module Finance Upgrade Phase
    2: Travel and Expense Claim Module.


    # ## Questions


    +   1. Determine the inherent risk.

    +   2. Assess the internal control environment using the NIST Cybersecurity Framework:
    Core Components.

    +   3. Determine the risk appetite, risk tolerance and risk profile.

    +   4. Assess the residual risk and provide recommendations, if appropriate.

    +   5. Develop the risk-mitigation strategy.'
