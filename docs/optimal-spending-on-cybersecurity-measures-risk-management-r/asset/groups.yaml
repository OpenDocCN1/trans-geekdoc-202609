  mdcn: "\n\nSSO 认证机制。需要注意的是，敏感数据并未故意存储在 CMS 托管架构中。\n\nCascade 计划将执行以下操作：\n\n- 在 ABC\
    \ 的云中实施新的 DX 平台和 DNS 服务器，以满足互联网和内联网发布要求。\n- 为 ABC 的互联网和内联网开发新的可扩展高可用性架构，包括用于评估性能的监控机制。\n\
    - 制定互联网和内联网网站改版与实施计划，包括审计现有网站的方法、制定识别“高价值网站”的标准、开发并实施 SEO 策略，并与利益相关方合作，根据新的网页设计和发布标准及工作流程对主要网站进行改版和部署（或停用和归档）。\n\
    - 通过 API 和配置，将网站改进和数字资产管理（DAM）工具与 DX 平台集成。\n- 对所有已识别的网站进行合理化和分类。\n- 改版并部署被认定为“高价值”主要网站的新网站，并停用和/或归档旧网站。\n\
    - 为未来的改版和部署制定次要和三级网站列表，次要和三级网站的改版不在本次范围内。\n- 为所有已部署的主要网站建立分析——即 Google Analytics。\n\
    \n该应用程序包含两个组件：内容管理和内容分发。前者是一个发布引擎，将内容分发到用户定义的目标。后者是 Cascade 软件产品使用的一种任意解决方案，用于向最适合业务的受众提供网页内容。\n\
    \n网站根据关键性评级进行分类：\n\n- 关键——中等容量（10,000+），与事件或业务流程或重要通信资产相关。\n- 重要——低容量（<10,000）偶尔使用，不关键迁移且可以等待。\n\
    - 非关键——面向当前学生和员工的教职员工网页内容。\n- LSS——低容量，不支持业务流程；但是，可能包含历史信息。\n- 范围外——高容量（50,000+）每日使用——学生和员工。\n\
    \nCascade 网络内容管理系统为发布 ABC 大学面向学生和教职员工的学术资源以及面向员工的就业资源信息提供了手段。大学网站是与受众沟通的主要方式；因此，这是一款业务关键型应用程序。本项目中包含了以下网站索引、站点搜索功能和\
    \ DAM 服务：\n\n1. SiteSearch360—Batman Option，作为 Google Mini Search Appliance 的替代方案。该服务的所有者是\
    \ SEMKNOX GmbH，涉及将简单的 JavaScript 插入 Cascade 网站以便于搜索功能——具体为四行代码。因此，托管或供应商参与不在范围内。Site\
    \ Search 360 已获得各项行业要求，如下：\n\n   - PCI DSS 合规性。\n   - ISO/IEC 27001:2013 数据中心认证。\n\
    \   - 一般数据保护条例（GDPR）要求的数据处理协议（DPA）。\n   - SEMKNOX GmbH（Site Search 360 背后的法人实体）和\
    \ Hoster 提供的技术和组织措施。\n\n2. 企业级 DAM 解决方案使用由 Brandfolder 管理的外包数据中心，其功能包括执行以下操作的能力：\n\
    \n   - 对资产进行标记和分类。\n   - 管理资产元数据——即名称、日期和描述。\n   - 创建工作流——即内部和外部受众的权限、评审和批准以及通知。\n\
    \   - 实施版本控制和权限管理——即用户限制。\n   - 在各团队之间实施资产共享——即光箱和资产跟踪。\n   - 执行搜索——即 DAM 中的简单搜索和高级搜索。\n\
    \   - 编辑资产——即 DAM 中的图像——并转换为不同格式。\n   - 替换 DAM 中的资产，并使替换内容在网站上同步更改。\n   - 在 DAM\
    \ 中创建画廊。\n   - 实施报告。\n\n大学不会故意在网络内容管理系统中存储敏感或机密信息。但是，此类信息意外存储和分发的可能性存在。\n\n##\
    \ Questions\n\n1. 确定固有风险。\n2. 使用 NIST 网络安全框架：核心组件评估内部控制环境。\n3. 确定风险偏好、风险承受度和风险概况。\n\
    4. 评估剩余风险，并在适当时提供建议。\n5. 制定风险缓解策略。\n\n## Case study #8: Chrome River travel and\
    \ expense\n\n本风险评估的目的是评估实施 Module 财务升级第 2 阶段：差旅与费用申报模块所关联的风险。敏感的 ABC 数据在此系统中被收集、传输和存储，风险评估审查了现有控制措施，以充分保护\
    \ ABC 数据，符合大学的数据分类标准操作程序的要求。\n\nChrome River 应用程序利用多年的安全领导经验，采用（1）安全设计，通过多层加密能力、安全系统框架和年度风险分析实现；（2）强制标准、经过测试的流程和专用工具来保护客户数据；以及（3）面向员工的年度安全教育和认证，以遵守既定的商业行为准则。运营安全通过最先进的扫描和入侵检测来强制执行，并持续更新以领先于新的攻击向量。Chrome\
    \ River 定期进行审计，以验证运营安全是否符合控制要求，并且已建立全球安全事件流程，该流程每天 24 小时、每周 7 天、每年 365 天（24×7×365）进行监控。Chrome\
    \ River 服务旨在保护 ABC 的专有内容和数据。\n\n2018 年 4 月，ABC 启动了 Module 财务与 HR 升级项目，将财务、工资和职位控制模块从\
    \ Module 版本 8 升级到 Module 版本 9，因为 Ellucian 将在 2018 年底停止对 Module 版本 8 的支持。项目的这一阶段特别仅包含核心模块，差旅与费用管理系统（Module\
    \ TEM）等项目被列为范围外。项目团队于 2018 年 11 月成功实施了此次升级。\n\n在核心财务和 HR 模块升级到受支持版本后，财务和行政部门审查了项目中范围外模块的支持状态。Module\
    \ TEM 于 2019 年 1 月 1 日进入维护支持状态。Ellucian 受支持的费用管理解决方案变成了 Chrome River 费用管理解决方案，项目赞助人请求将此模块的升级纳入\
    \ Module 财务与 HR 升级项目的第二阶段。数字治理于 2019 年 2 月批准了项目变更请求，以实施 Chrome River 费用管理和发票管理模块。旧版\
    \ Module TEM 及其关联模块工作流产品已被停用。\n\n本项目的目的是实施 Module 财务升级第 2 阶段：差旅与费用申报模块。\n\n##\
    \ Questions\n\n1. 确定固有风险。\n2. 使用 NIST 网络安全框架：核心组件评估内部控制环境。\n3. 确定风险偏好、风险承受度和风险概况。\n\
    4. 评估剩余风险，并在适当时提供建议。\n5. 制定风险缓解策略。\n\n## Bibliography\n\nAlali, M., Almogren,\
    \ A., Hassan, M. M., Rassan, I. A. L. & Bhuiyan, M. Z. A. 2018. 使用模糊逻辑推理系统改进网络安全风险评估模型.\
    \ Computer & Security, 74, 323–339.\n\nAlbrechtsen, E. & Howden, J. 2009. 信息安全管理人员与用户之间的信息安全数字鸿沟.\
    \ Computer & Security, 28, 476–490.\n\nAlexiou, S. 2019. 实用补丁管理与缓解. ISACA Journal,\
    \ 3.\n\nAlkaabi, A. 2014. 阿联酋信息安全风险最小化战略框架. 博士论文，贝德福德郡大学.\n\nAvgerou, C. 2000.\
    \ 信息系统：它是什么样的科学？Omega (West-Port), 28, 567–579.\n\nAWS. 2019. Amazon ECR 中的原生容器镜像扫描\
    \ (AWS, 2019)，2020 年 3 月查阅，aws.amazon.com/blogs/containers/amazon-ecr-native-container-image-scanning.\n\
    \nBang, S. K., Chung, S., Choh, Y. & Dupuis, M. 2013. 现代 Web 应用程序的扎根理论分析：DevOps\
    \ 的知识、技能与能力. 信息技术与系统，华盛顿大学塔科马分校技术学院.\n\nBaranyj, J. & Buss da Silva, N. 2017.\
    \ 使用预测模型优化决策风险. 国际食品微生物学杂志, 240, 19–23.\n\n巴塞尔银行监管委员会. 2001. 操作风险，国际清算银行.\n\n\
    Bin Ishaq Alseçai, K. 2015. 与信息技术相关的风险意识管理 (MERIT). 博士论文，格洛斯特大学.\n\nBirks, M.\
    \ & Mills, J. 2015. 扎根理论：实用指南. 伦敦，英国：SAGE 出版社.\n\nBojanc, R. & Jerman-Blazic,\
