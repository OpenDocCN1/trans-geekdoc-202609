    # IDENTIFY-P


    Identify-P develops the organization’s understanding of how to manage privacy
    risks for individuals arising from data processing. The activities in the identify-P
    function are foundational for the effective use of the privacy framework. Inventorying
    the circumstances under which data are processed, understanding the privacy interests
    of individuals who are directly or indirectly served or affected by the organization
    and conducting risk assessments enable an organization to understand the business
    environment in which it is operating and identifies and prioritizes privacy risks.


    # GOVERN-P


    Govern-P develops and implements an organization’s governance structure to enable
    an ongoing understanding of the risk-management priorities that are informed by
    privacy risk. The govern-P function is similarly foundational but focuses on organization-level
    activities—for example, (1) establishing the organization’s privacy values and
    policies, (2) identifying legal/regulatory requirements and (3) understanding
    the risk tolerance that enables the organization to focus and prioritize its efforts
    in ways that are consistent with its risk-management strategy and business needs.


    # CONTROL-P


    Control-P develops and implements appropriate activities to enable the organization
    to manage data with sufficient granularity to understand privacy risks. The control-P
    function is associated with data processing management from the perspectives of
    both organizations and individuals.


    # PROTECT P


    Protect-P develops and implements appropriate data processing safeguards. The
    protect-P function covers data protection to prevent cybersecurity-related privacy
    events and represents the intersection of privacy and cybersecurity risk management.


    # COMMUNICATE-P


    Communicate-P develops and implements appropriate activities to enable the organization
    to have a reliable understanding of how data are processed and the associated
    privacy risks.


    The communicate-P function includes the recognition that both the organization
    and individuals may need to know how data are processed to effectively manage
    privacy risks.'
