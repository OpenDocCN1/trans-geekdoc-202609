    ## Continuous integration


    Continuous integration is essential in DevOps cultures because DevOps emerged
    from an agile culture, and continuous integration is a fundamental tenet of the
    agile approach:


    > A cornerstone of DevOps is continuous integration (CI), a technique designed
    and named by Grady Booch that continually merges source code updates from all
    developers on a team into a shared mainline. This continual merging prevents a
    developer’s local copy of a software project from drifting too far afield as new
    code is added by others, avoiding catastrophic merge conflicts.

    >

    > – Aaron Cois, “Continuous Integration in DevOps”, DevOps blog, Software Engineering
    Institute, Carnegie Mellon


    The continuous integration principle of agile development has cultural implications
    for the development group. Forcing developers to integrate their work into other
    developers’ work frequently, at least daily, exposes integration issues and conflicts
    much earlier than the waterfall development approach. However, to achieve this
    benefit, developers must communicate with each other much more frequently.


