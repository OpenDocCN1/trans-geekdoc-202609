- pgno: 93
  md: '+   - Key ICT suppliers

    +     - Business-as-usual suppliers.

    +     - Recovery service suppliers.


    # Awareness, competency and training programme


    A coordinated programme should be implemented to ensure that processes are in
    place to regularly promote IRBC awareness in general and to assess and enhance
    the competency of all personnel who are relevant to the successful implementation
    of IRBC.


    # Document control


    # Control of IRBC records


    Controls should be established over IRBC records to


    +   - ensure that they remain legible, readily identifiable and retrievable and

    +   - provide for their storage, protection and retrieval.


    # Control of IRBC documentation


    Controls should be established over IRBC documentation to ensure that


    +   - documents are approved prior to issuance;

    +   - documents are reviewed, updated and re-approved as needed;

    +   - changes and the current revision status of documents are identified;

    +   - relevant versions of applicable documents are available at points of use;

    +   - documents of external origin are identified, and their distribution is controlled;
    and

    +   - the unintended use of obsolete documents is prevented, and such documents
    are suitably identified if they are retained for any purpose.


    # Monitoring and review


    # Maintaining IRBC


    With change comes risk—not only the risk of failure but also the risk of destabilizing
    existing policies and strategies. IRBC strategies should therefore be resilient
    and adaptable. Any change to ICT services that may affect'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'IRBC capability should be implemented only after the business continuity implications
    of the change have been assessed and addressed.


    The following steps are necessary to ensure that the IRBC strategies and plans
    remain appropriate for the organization:


    +   - Management should ensure that the IRBC strategies continue to support the
    organization''s BCM requirements.

    +   - The change management process should include all parties responsible for
    the planning and implementation of IRBC strategies.

    +   - The development process for new ICT services should include sign-off that
    resilience has not been compromised by even the simplest upgrades or improvements.

    +   - Due diligence on merger and acquisition activity should include a resilience
    assessment.

    +   - ICT component decommissioning should be reflected within related IRBC management
    systems.


    # Monitoring, detection and analysis of threats


    The organization should establish a process to continuously monitor and detect
    the emergence of ICT security threats, including but not limited to the following
    areas:


    +   - Retention of staff, skills and knowledge.

    +   - Management of facilities to house ICT equipment—that is, by monitoring the
    amount and nature of security.

    +   - Incidents/vulnerabilities related to computer rooms.

    +   - Changes in supporting technology, plants, equipment and networks.

    +   - Changes in information applications and databases.

    +   - Finance or budget allocation.

    +   - The effectiveness of external services and suppliers.


    # Testing and exercising


    The organization should test not only the recovery of the ICT service but also
    the protection and resilience elements to determine whether


    +   - the service can be protected, maintained and/or recovered regardless of
    the incident severity,

    +   - the IRBC management arrangements can minimize the impact on the business
    and

    +   - the procedures for returning to business as usual are valid.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Test and exercise programme


    In most instances, the whole set of IRBC elements and processes, including ICT
    recovery, cannot be proved in one test and exercise.


    A progressive exercising regime might therefore be appropriate for building a
    full simulation of a real incident. The programme should include different levels
    of exercise, from familiarization to computer room resilience, and should consider
    all aspects of end-to-end ICT service delivery.


    There are risks associated with tests and exercises, and such activities should
    not expose the organization to an unacceptable level of risk. The test and exercise
    programme should define how the risk of individual exercising is addressed. Management
    sign-off on the programme should be obtained, and a clear explanation of the associated
    risks should be documented.


    The test and exercise programme objectives should be fully aligned with the wider
    BCM scope and objectives and should complement the organization’s broader exercise
    programme. Each test and exercise should have both business objectives, even where
    there is no direct business involvement, and a defined technical objective to
    test or validate a specific element of the IRBC strategy.


    Exercising individual elements in isolation at the component level is complementary
    to full system exercising and should be maintained as part of an ongoing test
    and exercise programme.


    The test and exercise programme should define the frequency, scope and format
    of each exercise. The following are high-level examples of exercise scope:


    +   - Recovery of a single data file or database following corruption.

    +   - Recovery of a single server, including a full rebuild.

    +   - Recovery of an application, which may consist of several servers, sub-applications
    and infrastructure.

    +   - Failover of services hosted on a high-availability platform—that is, clustering
    simulating the loss of any member of a cluster.

    +   - Data recovery from tape—that is, recovery of single files or series of files
    from offsite tape storage.

    +   - Network testing.

    +   - Communications infrastructure failover tests.


    Exercises should be progressive to include an increasing test of dependencies
    and interrelationships and relevant end-user communities.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# The scope of exercise


    Exercising should be carried out to


    +   - build confidence throughout the organization that the resilience and recovery
    strategy will meet the business requirements;

    +   - demonstrate that critical ICT services can be maintained and recovered within
    agreed-upon service levels or recovery objectives regardless of the incident;

    +   - demonstrate that the critical ICT services can be restored to the pre-test
    state in the event of an incident at the recovery location;

    +   - provide the opportunity for staff to familiarize themselves with the recovery
    process;

    +   - train staff and ensure that they have adequate knowledge of IRBC plans and
    procedures;

    +   - check that IRBC remains synchronized with ICT infrastructure and general
    infrastructure;

    +   - identify any improvements required for the IRBC strategy, architecture or
    recovery processes; and

    +   - provide evidence for audit purposes and demonstrate the organization’s ICT
    service competence.


    Exercising should apply to the entire ICT environment and all the components that
    deliver end-to-end service, from the computer room through the user desktop or
    any other service delivery channel.


    # Elements of service recovery


    The organization should exercise all elements of the ICT service recovery as appropriate
    for its size, complexity and BCM scope. The exercise should not focus solely on
    service recovery and resumption but should include the reliability of resilience
    capability, system monitoring and alert management. The organization should exercise
    from the component level through full location-based system testing to achieve
    high levels of confidence and resilience.


    The following elements should be exercised:


    +   - Computer rooms: Physical security, fire and water leak detection systems
    and evacuation processes.

    +   - Heating, ventilation and air conditioning; environmental monitoring and
    alert protocols and electrical services.

    +   - Infrastructure, including the overall resilience of the network connectivity
    and network diversity.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '+   • Network security, including anti-virus protection and intrusion prevention
    and detection.

    +   • Hardware, including servers, telecoms equipment, storage arrays and removable
    media.

    +   • Software.

    +   • Data.

    +   • Services.

    +   • Role and response of suppliers.


    # Planning an exercise


    To ensure that an exercise does not cause incidents or undermine service capability,
    it should be carefully planned to minimize the risk of an incident occurring as
    a direct result. This risk management—that is, the elements of service recovery—should
    be appropriate to the level of the exercise being undertaken. This may include
    the following:


    +   • Ensuring that all data are backed up immediately prior to the exercise.

    +   • Conducting exercises in isolated environments.

    +   • Scheduling exercises “out of hours” or during quiet times in the business
    cycle, with knowledge of the end users’ primary and secondary desktop process
    recovery simulation.


    Exercises should be realistic, carefully planned and agreed upon with stakeholders
    so that there is minimum risk of disruption to business processes. The scale and
    complexity of exercises should be appropriate to the organization’s recovery objectives.


    Each exercise should have “terms of reference”, agreed upon and signed off in
    advance by the exercise sponsor, which may include the following:


    +   • Description.

    +   • Objectives.

    +   • Scope.

    +   • Assumptions.

    +   • Constraints.

    +   • Risks.

    +   • Success criteria.

    +   • Resources.

    +   • Roles and responsibilities.

    +   • High-level timeline/schedule.

    +   • Exercise data capture.

    +   • Exercise/incident logging.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '+   - Debriefing.

    +   - Post-exercise actions, follow-up and reporting.


    An exercise should be planned to enable the organization to achieve the success
    criteria identified.


    # Managing an exercise


    A clear exercise command structure should be developed, with roles and responsibilities
    allocated to appropriate individuals. The exercise command structure may include
    the following:


    +   - Exercise commander and participant(s) with overall control of the test and
    exercise.

    +   - Exercise communications.

    +   - Confirmation that there are enough staff available to safely undertake the
    exercise.

    +   - Sufficient observers and/or facilitators to capture the exercise proceedings
    and maintain an issue log.

    +   - Key exercise milestones.

    +   - End-of-exercise protocols.

    +   - Emergency stop exercise protocols.


    The exercise command should ensure the following:


    +   - Objectives and key milestones are met.

    +   - All exercise material and activities have appropriate levels of confidentiality.

    +   - Any ongoing risks are monitored and mitigated.

    +   - Any visitors/observers are authorized.

    +   - The exercise proceedings are captured in a consistent manner.

    +   - All participants are debriefed, and feedback is collated.


    # Verifying, reviewing and evaluating information security continuity


    The organization should verify the established and implemented information security
    continuity controls at regular intervals to ensure that they are valid and effective
    during adverse situations. Organizational, technical, procedural and process changes,
    whether in an operational or continuity context, can lead to changes in information
    security continuity requirements. In such'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'cases, the continuity of processes, procedures and controls for information
    security should be reviewed against the changed requirements.


    An organization should verify its information security management continuity by


    +   - exercising and testing the functionality of information security continuity
    processes, procedures and controls to ensure that they are consistent with the
    information security continuity objectives;

    +   - exercising and testing knowledge and routines to operate information security
    continuity processes, procedures and controls to ensure that their performance
    is consistent with the information security continuity objectives; and

    +   - reviewing the validity and effectiveness of information security continuity
    measures when information systems, information security processes, procedures
    and controls or BCM/DR management processes and solutions change.


    # Reviewing, reporting and follow-up


    At the end of an exercise, the findings should be reviewed and followed up promptly.
    This should include the following:


    +   - Gathering the results and findings.

    +   - Analysing the results and findings in relation to the exercise objectives
    and success criteria.

    +   - Identifying any gaps.

    +   - Assigning action points with defined timelines.

    +   - Creating an exercise report for formal consideration by the exercise sponsor.

    +   - Consolidating and following up on exercise report actions.


    # IRBC internal audit


    The IRBC internal audit plan should define and document the audit criteria, scope,
    method and frequency, and IRBC internal auditing should be conducted annually.
    The audit plan should ensure that only qualified internal auditors are appointed
    to perform the audit. The selection of auditors and the performance of the audit
    should ensure objectivity and impartiality in the audit process. Auditors conducting
    IRBC internal audits should be competent to undertake the task. For example, they
    should undergo relevant auditor training to acquire the necessary skills and knowledge.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'A procedure should be established to ensure that deficiencies identified in
    IRBC internal audits are rectified. The audit plan should also encompass external
    parties.


    For example, outsourcing vendors should be audited for their capability to support
    the organization’s IRBC strategies and plans during daily operation and response
    to and recovery from disaster.


    An internal audit should be conducted when there are significant changes to critical
    ICT services or business continuity requirements that are relevant to the IRBC
    scope or IRBC requirements.


    The results of the IRBC internal audit should be recorded and reported. Management
    should review the results of IRBC internal audits and the statuses of follow-up
    corrective actions.


    # Management review


    Management should ensure that the IRBC management system is reviewed at planned
    intervals. This review may be based on the input of internal or external audits
    or self-assessments. The review should include assessing opportunities for improvement
    and the need for changes to IRBC management, including IRBC policy and objectives.
    In addition, management should annually review the agreed-upon IRBC requirements,
    including ICT service definitions, the documented list of critical ICT services
    and the risks associated with identified gaps between critical ICT readiness capability
    and business continuity requirements. The results of the review should be clearly
    documented, and records should be maintained.


    # Review input


    The input to a management review should include information on the following:


    +   - Internal service levels.

    +   - External service providers’ ability to maintain appropriate levels of service.

    +   - The results of relevant audits.

    +   - Feedback from interested parties, including independent observations.

    +   - Status of preventive and corrective actions.

    +   - Level of residual risk and acceptable risk.

    +   - Follow-up actions from previous management reviews and recommendations.

    +   - Lessons learned from tests and exercises, incidents, education and awareness
    programmes and emerging best practices and guidelines.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Review output


    The output from the review should be signed off by management and include the
    following:


    +   - Varying the scope of the IRBC management system.

    +   - Improving the effectiveness of the IRBC management system.

    +   - Revised IRBC requirements, including ICT service definitions, the documented
    list of critical ICT services and the risks associated with gaps identified between
    critical ICT readiness capability and business continuity requirements.

    +   - Modifying the IRBC strategy and procedures, as necessary, to respond to
    internal and/or external events that could impact ICT services, including changes
    to

    +     - business requirements,

    +     - resilience requirements and

    +     - levels of risk and/or levels of risk acceptance.

    +   - Resource needs.

    +   - Funding and budget requirements.


    # Measurement of ICT readiness performance criteria


    The organization should monitor and measure its ICT readiness through the implementation
    of the measurement process of the defined ICT readiness performance criteria.


    # Quantitative and qualitative performance criteria


    The performance criteria for IRBC may be qualitative or quantitative. Quantitative
    criteria may include the following:


    +   - Over a given period, the number of incidents that have not been detected
    prior to disruption.

    +   - Detection time for incidents.

    +   - Number of incidents that cannot be effectively contained to reduce impact.

    +   - Availability of data sources to indicate the emergence of incidents through
    trend monitoring of events.

    +   - Time to react and respond to detected emerging incidents.


    Qualitative criteria are subjective in determining the performance of IRBC but
    usually require fewer resources in the measurement process. They may'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'include determining the efficiency of the processes used to plan, prepare and
    execute IRBC activities and can be measured through


    +   - a survey using a structured or unstructured questionnaire,

    +   - feedback from participants and stakeholders,

    +   - feedback workshops and

    +   - other focused group meetings.


    # IRBC improvement


    The organization should continually improve IRBC through the application of preventative
    and corrective actions that are appropriate to the potential impacts determined
    by its BIA and risk appetite.


    # Corrective action


    The organization should take action to correct any actual failure of the ICT service
    and elements of IRBC. The documented procedure for corrective action should define
    requirements for


    +   - identifying failures,

    +   - determining the causes of failures,

    +   - evaluating the need for actions to avoid non-conformities,

    +   - determining and implementing the corrective action needed,

    +   - recording the results of action taken and

    +   - reviewing corrective action taken.


    # Preventative action


    The organization should identify potential weaknesses in the elements of IRBC
    and establish documented procedures for


    +   - identifying potential failures,

    +   - identifying the causes of failures,

    +   - determining and implementing the preventative action needed and

    +   - recording and reviewing the results of action taken.'
  merge: -1
