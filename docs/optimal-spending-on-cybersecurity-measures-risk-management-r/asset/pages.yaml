- pgno: 103
  md: '# 7 Cybersecurity risk-management framework


    # Cyber risk investment model


    The cyber risk investment model is composed of the following elements:


    +   1 Technology landscape.

    +   2 Data classification.

    +   3 Risk-management practices.

    +   4 Cost–benefit analysis for cybersecurity measures.

    +   5 Business objectives.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_103_0.png)


    Figure 7.1 The cyber risk investment model, which comprises the (1) technology
    landscape and application portfolio, (2) data-centric focus, (3) risk-management
    practices, (4) cost–benefit analysis and (5) strategic development (Kissoon, 2020).'
  merge: -1
