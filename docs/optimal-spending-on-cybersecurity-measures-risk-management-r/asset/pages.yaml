- pgno: 61
  md: '# Secure software development lifecycle


    The secure software development lifecycle (SSDLC) is the process of including
    security artefacts in the SDLC process.


    An SSDLC is a framework that defines the process used by organizations to build
    an application from its inception to decommission. Throughout the years, multiple
    standard SDLC models have been proposed (waterfall, iterative, agile) and integrated
    into various organizational environments via multiple ways.


    # Planning and requirements


    The first step in any initiative is to map out a planning process. During this
    phase, an organization must identify the release theme, contents and timeline.
    This phase typically includes activities such as collecting end-user


    ![](img/8bcb92bad95ddd74218ba966f2798d54_61_0.png)


    Figure 5.2 The elements within the secure software development lifecycle (Digital
    Maelstrom, 2020).'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'requirements, determining user stories to include in the release, and planning
    release phases and dates.


    Key considerations during this phase include the following:


    +   - Ensuring that an application meets business requirements.

    +   - Engaging in threat modelling/secure design.

    +   - Choosing the language and libraries to use in the development process.

    +   - Mapping test cases to business and functional requirements.


    # Architecture and design


    In the architecture and design phase, the organization’s technology teams should
    follow the architecture and design guidelines to address identified risks. In
    addition, this phase evaluates the planned system design and potential integration
    with other systems, as well as the incorporation of shared services and common
    security controls, including the following:


    +   - Authentication.

    +   - Disaster recovery (DR).

    +   - Intrusion detection.

    +   - Incident reporting.


    When vulnerabilities are addressed early in the design phase, processes include
    threat modelling and architecture risk analysis to assist in simplifying and providing
    a secure development process.


    # Test planning


    Applying security controls in the testing phase should be considered carefully
    and planned logically. The intent is to integrate the controls into existing systems;
    therefore, challenges to system performance should be discovered early. Additionally,
    some security controls may limit or hinder normal development activities.


    For new information systems, the security requirements identified and described
    in the appropriate system security plans should be designed, developed and implemented.


    System security plans for operational information systems may require the development
    of additional security controls to supplement in-place controls or the modification
    of controls that are deemed less than effective.


    During this phase, decisions are made based on integration challenges and trade-offs.
    It is important to document major decisions and business/technology drivers.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'In cases where the application of a planned control is not possible or advisable,
    compensatory controls should be considered and documented.


    # Coding


    During the development phase, the organization’s development teams should train
    developers in secure coding practices. While performing the usual code review
    to ensure that the project has the specified features and functions, developers
    should minimize security vulnerabilities introduced in the code by integrating
    secure coding practices—that is, OWASP. Specifically, the source code should be
    periodically reviewed using automated tools or manual spot checks for common programming
    errors that have a detrimental impact on system security, including the following:


    +   - Cross-site scripting vulnerabilities.

    +   - Buffer overflows.

    +   - Race conditions.

    +   - Object model violations.

    +   - Poor user input validation and error handling.

    +   - Exposed security parameters.

    +   - Passwords in the clear.

    +   - Violations of stated security policy, models or architecture as part of
    the software development QA process.

    +   - Using open-source components in a secure way.

    +   - Static code analysis.

    +   - Vulnerability scanning.


    # Testing and results


    To reduce redundant functional and security testing activities, the following
    recommendations are made:


    +   - Functional test plans should include general security feature testing to
    the greatest extent possible.

    +   - Preliminary testing of basic security controls should be performed during
    functional testing to reduce or eliminate issues earlier in the development cycle—that
    is, mandatory access controls, secure code development and firewalls.

    +   - Preliminary testing is considered development-level testing, not certification
    and accreditation (C&A) testing, and if no changes occur, test results should
    be reused to the greatest extent possible in the C&A.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   - For systems of high visibility and sensitivity, independent development
    testing should be considered.

    +   - Preliminary testing should be completed at the component or security zone
    level to ensure that each component or security zone is secure as an entity.

    +   - The process and results of all security testing that occurs throughout the
    lifecycle should be captured for evaluation, issue identification and potential
    reuse.


    The following vulnerability assessments should also be considered during this
    phase:


    +   - Dynamic code analysis.

    +   - Penetration testing.

    +   - Ethical hacking.

    +   - Password hacking.


    # Release and maintenance


    After deployment and implementation, security practices should be followed throughout
    software maintenance. Applications should be regularly updated and assessed as
    follows:


    +   - Security assessment.

    +   - Vulnerability scanning.

    +   - Penetration testing.

    +   - Ethical hacking.


    # Cloud environments


    Vulnerability management is the process of identifying, classifying, remediating
    and mitigating vulnerabilities, especially in software and firmware. This process
    becomes complex in a cloud-based environment, as various layers of technology
    can be managed by different organizations based on the implementation. An organization’s
    vulnerability management programme should extend to ensuring that vendor-managed
    cloud-based solutions have appropriate controls in place to align with the organization’s
    risk appetite and risk tolerance.


    # Vulnerability scanning in a cloud environment


    The differences between traditional technology environments and cloud-based environments
    arise primarily from (1) an organization outsourcing the ability to own and control
    the infrastructure for cloud services to an'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'external vendor and (2) the organization being unable to access the vulnerability
    data of native cloud services. There is an inability to associate the data with
    cloud-native vulnerabilities, as CVE IDs are not generally assigned to them. Therefore,
    it becomes difficult for organizations as clients to make informed, risk-based
    decisions regarding vulnerable cloud services. For example, when should the organization
    decide to reject the risk and stop using a cloud service or accept the risk and
    continue using the service?


    Furthermore, even if CVE IDs are assigned to cloud-native vulnerabilities, the
    differences between traditional and cloud environments are so vast that vulnerability
    data that are normally associated with a CVE in a traditional environment are
    inadequate for cloud service vulnerabilities. For example, in a traditional IT
    environment, CVEs are linked to a software version, and the organization can determine
    whether a software application is vulnerable by checking the version. In cloud
    services, the software version is usually known only to the cloud service provider.
    Therefore, the organization as a client may be unable to apply security controls
    or other mitigations to address the risk of a vulnerability.


    # EXAMPLE: Vulnerability Scanning in Amazon Web Services Elastic Container Registry.


    The Amazon Web Services (AWS) Electric Container Registry (ECR) is a fully managed
    container registry that makes it easy for developers to store, manage and deploy
    container images. Image scanning is an automated vulnerability assessment feature
    in an ECR that helps improve the security of an organization’s application container
    images by scanning them for a broad range of OS vulnerabilities.


    # Implement image scanning for containers


    Container security comprises a range of activities and tools involving developers,
    security operations engineers and infrastructure administrators. One crucial link
    in the cloud-native supply chain is scanning container images for vulnerabilities
    and obtaining actionable insights. ECR image scanning uses the ECR native solution
    and provides an implementation strategy for a specific use case and scheduled
    re-scans as the foundation.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Prevent images with known vulnerabilities from entering production


    An organization can enable image scans or push for its repositories to ensure
    that every image is automatically checked against an aggregated set of CVEs. The
    AWS ECR uses the severity of a CVE from an upstream distribution source if available;
    otherwise, the common vulnerability scoring system (CVSS) score can be used to
    obtain the National Vulnerability Database vulnerability severity rating. This
    can assist an organization with automated detection and responses to container
    image vulnerabilities prior to promoting and deploying an image into production.


    There are two kinds of scanning:


    Static scanning is performed in environments prior to deployment with the implication
    that developers (or secops) can detect vulnerabilities before a container is launched.
    ECR image scanning falls under this category; that is, it enables an organization
    to scan OS packages in container images for CVEs, a public list of known security
    threats, without the need for an organization to set up its own scanning infrastructure
    or purchase third-party scanning licences.


    Dynamic scanning is executed in a runtime environment and identifies vulnerabilities
    for containers running in test, QA or production environments, making it possible
    to identify vulnerabilities introduced by software installed post-build as well
    as zero-day vulnerabilities. For dynamic (or runtime) container security, there
    is an array of options


    ![](img/8bcb92bad95ddd74218ba966f2798d54_66_0.png)


    Figure 5.3 Native container image scanning in Amazon ECR (AWS, 2019).'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'provided by third parties, from open-source solutions such as CNCF Falco to
    offerings through AWS container competency partners, including Aqua Security,
    Trend Micro and Twistlock.


    Once applications are in production, verify that they remain vulnerability free.
    An organization can also scan images using an application programmable interface
    (API) command, allowing it to set up periodic scans for running container images
    to ensure continued monitoring. ECR sends a notification when a scan is completed,
