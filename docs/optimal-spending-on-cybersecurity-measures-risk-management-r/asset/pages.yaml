- pgno: 146
  md: 'The hosted pay page (HPP) process flow is as follows:


    +   1 The customer arrives on the ABC University website (application). At this
    point, the university must determine the amount of the transaction and collect
    any additional data.

    +   2 Once the cardholder is ready to pay, the university checkout page will submit
    an HTTP form POST to the Moneris HPP. At this time, the customer will be redirected
    from the university website to the Moneris HPP URL.

    +   3 On the HPP, the cardholder will provide secure payment details, such as
    the card number, and submit the transaction. At this time, Moneris will process
    the transaction and then provide a receipt to the customer.

    +   4 Once the customer is ready to continue, he or she will be redirected back
    to the university website to the response URL provided in the HPP configuration.


    The change that is being proposed by the university is to add service fees—specifically,
    convenience fees—to the university receipt. The convenience fee programme was
    designed to allow merchants to offer the convenience of an alternative payment
    channel to the cardholder at a charge. This applies only when providing a true
    “convenience” in the form of an alternative payment channel. The convenience fee
    is a separate charge on top of what the consumer is paying for the goods and/or
    services being purchased, and this charge will appear as a separate line item
    on the consumer’s statement. From an information security viewpoint, the impact
    of this change is minimal. It was confirmed that a PIA was not required, as PII
    was not within the scope of this project enhancement. In addition, the new receipt
    would not contain any sensitive data that would require additional security controls
    within the university. The university maintained its current transaction processing
    relationship through the service provider Moneris Solutions.


    # Questions


    +   1 Determine the inherent risk.

    +   2 Assess the internal control environment using the NIST Cybersecurity Framework:
    Core Components.

    +   3 Determine the risk appetite, risk tolerance and risk profile.

    +   4 Assess the residual risk and provide recommendations, if appropriate.

    +   5 Develop the risk-mitigation strategy.'
