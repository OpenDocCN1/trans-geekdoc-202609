    SAD refers to the information on a payment card used for authentication at the
    time of a purchase, including data from the full magnetic strip, card security
    code (CSC, CVV2, CID, CAV2) and PIN. Within the payment card processing model,
    ABC University has a merchant relationship with its acquiring bank for accepting
    payment card transactions. ABC University has outsourced the transaction processing
    of payment card data to a third-party service provider, Moneris Solutions. The
    university''s vendor is responsible for compliance with regulatory and legal statutes,
    as well as protecting such information from dissemination to unauthorized parties.
    This risk-assessment report provides the residual risk profile for the credit
    card service fee model project.


    The university has an existing relationship with Moneris Solutions to provide
    transaction processing for ABC customers. The current relationship is detailed
    here.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_145_0.png)'
