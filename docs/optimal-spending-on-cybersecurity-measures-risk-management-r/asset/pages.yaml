- pgno: 9
  md: '# # 1 Introduction


    # ## Introduction


    This book shares a strategic framework that could be used by the various stakeholders
    involved in the implementation of cybersecurity measures to safeguard sensitive
    data. The existing literature shows that a wide range of principles are relevant
    within the cybersecurity decision-making process. Specific security measures are
    important and should be implemented appropriately to alleviate cybersecurity threats.
    The information provided in this book gives the necessary data to show that the
    cybersecurity decision-making process is clearly integrated with risk-management
    methodologies and the economics of information security to include current opportunity
    cost models.


    Economic optimization of information security is an area of interest to researchers
    and executives in most organizations. From a financial viewpoint, cost–benefit
    analysis is necessary and impactful to justify cybersecurity spending, as it relates
    to security measures. Previous authors have focused on either traditional risk-management
    practices or the organizational decision-making process of information security
    investments using cost–benefit analysis.


    This book aims to discuss the integration of organizational decision-making within
    cybersecurity spending to effectively articulate the business impact of cybersecurity
    risks. It focuses on the integration of risk-management practices with economics
    to support a balanced approach to cyber risk management. Each area was reviewed
    in-depth to provide an understanding of its application to cybersecurity and the
    decision-making process used when evaluating and investing in various security
    measures. Three global industry areas were analysed to gain a further understanding
    of current gaps, as noted later.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 2 Introduction


    # *Why are current implementations of cybersecurity frameworks effective in identifying,
    monitoring and responding to cybersecurity threats?*


    In analysing industry data, it is apparent that organizations currently leverage
    government and industry frameworks when implementing cybersecurity measures. The
    foundation of the decisions made by most stakeholders is based on ensuring compliance
    with government regulations, industry standards and internal policy.


    In addition, most organizations have anonymously expressed that they have experienced
    a type of cybersecurity breach, prioritized as follows: (1) malware/ransomware,
    (2) phishing, (3) lost/stolen computer media and (4) external/data breach, where
    94% of respondents expressed an average dollar loss of between $0 and $1 million.
    Organizational stakeholders believe that they can detect, respond to and monitor
    a security incident; however, they are not able to continuously prevent security
    incidents from occurring within their environment.


    These stakeholders believe that their organization is in compliance with government
    and industry standards. An organization measures the effectiveness of the implemented
    cybersecurity framework according to the following priorities: (1) compliance,
    (2) audit/assurance testing, (3) key performance indicators (KPIs), (4) capacity
    maturity models and (5) cost, considering the organization’s risk profile.


    # *What factors are used by an organization when investing in cybersecurity controls?*


    The decision-making mechanisms utilized by organizations when evaluating and implementing
    different security measures primarily focus on (1) compliance with government
    and industry regulations, (2) investment cost, (3) the impact of either a breach
    or fine, (4) either reputational or brand risk and (5) ease of use by the business.


    # *What decision-making mechanisms are organizations using when evaluating different
    security measures prior to implementation?*


    Stakeholders that make decisions on cybersecurity measures within their organizations
    include the following: (1) Chief Technology Officer (CTO), (2) Chief Information
    Security Officer (CISO), (3) Head of Business Line, (4) Chief Information Officer
    (CIO) and (5) Board of Directors. The CTO'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'and CISO are the stakeholders primarily responsible for advising and funding
    the investments within their organization, and each organization’s investment
    budget is between $1 and $5 million annually. Stakeholders are involved during
    the implementation of cybersecurity measures in the following ways: (1) direct
    involvement in the decision-making mechanism, (2) attendance at meetings on evaluating
    cybersecurity measures, (3) involvement in implementation activities related to
    cybersecurity measures and (4) support of the cybersecurity function.


    It is apparent that organizations have actively implemented cybersecurity frameworks;
    however, there is a need to enhance the decision-making process to reduce the
    number and types of breaches while strengthening the implemented cybersecurity
    framework to facilitate a stronger preventative approach. In addition, the factors
    used by an organization when investing in cybersecurity controls are heavily focused
    on compliance with government and industry regulations. Last, the decision-making
    process utilized when evaluating, implementing and investing in cybersecurity
    controls is weighted towards the technology organization and, therefore, may be
    biased based on competing priorities.


    Most organizations are faced with an array of choices when deciding on funding,
    as it relates to cybersecurity measures. Funding the investment cost to provide
    a secure environment can be complex.


    Cost-benefit analyses, risk appetite and business trade-offs are some of the areas
    that are factored into the overall decision-making process. Most stakeholders
    indicate that the following areas are critical in an organization’s decision-making
    process when allocating funds for cybersecurity measures.


    # Allocation of budget


    Although stakeholders believe that their organization has allocated a large enough
    budget to respond to or detect a cybersecurity breach, it is apparent that their
    organization’s cybersecurity budget is insufficient to ensure appropriate cybersecurity
    measures to prevent such breaches.


    # Ability to prevent a cybersecurity breach


    Although stakeholders believe that their organization can detect a cybersecurity
    breach in a timely manner, it is apparent that their organization is unable to
    prevent a cybersecurity breach, as some stakeholders indicate that their organization
    has encountered more than 15 breaches.'
  merge: -1
  img_proc: true
