    +   - The priorities for DigitalEd''s mission, objectives and activities are established
    and communicated.

    +   - The dependencies and critical functions for the delivery of critical services
    are established.

    +   - The resilience requirements to support the delivery of critical services
    are established for all operating states—that is, under duress/attack—during recovery
