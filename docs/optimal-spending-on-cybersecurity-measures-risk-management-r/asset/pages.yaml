    Suppliers: Other components of end-to-end services where ICT service provision
    is dependent upon an external service provider or another organization within
    the supply chain—that is, a financial market data provider, telecom carrier or
    Internet service provider.


    # Establishing an organization’s ICT readiness using the plan perform check act


