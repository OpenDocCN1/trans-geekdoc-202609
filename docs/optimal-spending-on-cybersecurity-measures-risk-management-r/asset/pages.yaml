    such as the budget and personnel necessary to perform activities in line with
    the IRBC policy and

    +   - be reviewed at planned intervals and when significant changes, such as environmental
    changes or changes in the organization’s business and structure, occur.


    # Planning


    The main objective of the planning phase is to establish the organization’s ICT
    readiness requirements, including the following:


    +   - The IRBC strategy and IRBC plan that are required to support the legal,
    statutory and regulatory requirements relating to the defined scope and the achievement
    of the organization’s business continuity aims and objectives.

    +   - The performance criteria needed by the organization to monitor the degree
    of ICT readiness required to achieve those aims and objectives.


    # Resources


    As part of the policy mandate, the organization defines the need for an IRBC programme
    as part of its overall BCM objectives and determines and provides the resources
    needed to establish, implement, operate and maintain the IRBC programme.


    IRBC roles, responsibilities, competencies and authorities should be defined and
    documented.


    Management should perform the following tasks:


    +   - Appoint or nominate a person with appropriate seniority and authority to
    be accountable for IRBC policy and implementation.

    +   - Appoint one or more competent persons who, irrespective of other responsibilities,
    should implement the elements of this programme.

    +   - Maintain the IRBC management system as described by the programme.


    # Competency of staff


    The organization should ensure that all personnel who are assigned IRBC responsibilities
    are competent to perform the required tasks.'
