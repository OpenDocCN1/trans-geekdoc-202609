  md: 'new features that expose the organization to new security, reliability, or
    compliance risks".


    Continuous testing is not just a QA function; in fact, it starts in the development
    environment. Developers build quality into the code and provide test data sets.
    QA engineers configure automation test cases and the testing environment.


    On the QA side, speed is essential. Test engineers meet the challenge of quick
    turnaround not only by automating the test process but also by redefining test
    methodologies:


    > Continuous testing creates a central system of decisions that helps you assess
    the business risk each application presents to your organization. Applied consistently,
    it guides development teams to meet business expectations and provides managers
    visibility to make informed trade-off decisions to optimize the business value
    of a release candidate.

    > –Continuous Testing for IT Leaders, Parasoft.


    Operations can ensure that monitoring tools are in place and test environments
    are properly configured. They can participate in functional, load, stress and
    leak tests and offer analysis based on their experience with similar applications
    running in production.


    The test function in a DevOps environment helps developers balance quality and
    speed. Using automated tools reduces the cost of testing and allows test engineers
    to leverage their time more effectively. Most importantly, continuous testing
    shortens test cycles by allowing integration testing earlier in the process.


    Continuous testing also eliminates testing bottlenecks through virtualized, dependent
    services and simplifies the creation of virtualized test environments that can
    be easily deployed, shared and updated as systems change. These capabilities reduce
    the cost of provisioning and maintaining test environments and shorten test cycle
    times by allowing integration testing earlier in the lifecycle.


    # Continuous delivery


    The team at AWS defines continuous delivery as a DevOps “software development
    practice where code changes are automatically built, tested and prepared for a
    release to production”. It expands upon continuous integration by deploying all
    code changes to a testing environment and/or a production environment after the
    build stage. When continuous delivery is implemented properly, developers will
    always have a deployment-ready built artefact that has passed through a standardized
    test process.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'The actual release frequency can vary greatly depending on the company''s legacy
    and goals. High-performing organizations using DevOps achieve multiple deployments
    per day compared to medium-performing organizations who release once per week
    to once per month.


    Exactly what is released varies depending on the organization. In some organizations,
    QA and operations triage potential releases: (1) many go directly to users, (2)
    some go back to development, and (3) a few simply are not deployed at all. In
    comparison, other organizations push everything that comes from developers out
    to users, counting on real-time monitoring and rapid remediation to minimize the
    impact of a rare failure. It is important to note that because each update is
    small, the chance of any one of them causing a failure is significantly reduced.


    Continuous delivery enables businesses to reduce the cycle time to obtain faster
    feedback from users, reduce the risk and cost of deployments, gain visibility
    of the delivery process itself and manage the risks of software delivery more
    effectively.


    From a risk and compliance perspective, continuous delivery is a more mature,
    efficient and effective method of applying controls to meet regulatory requirements
    than the traditional combination of automated and manual activities.


    # Continuous monitoring


    Given the sheer number of releases in a continuous delivery environment, it is
    difficult to implement the rigorous pre-release testing typically required in
    waterfall development approaches. In a DevOps environment, failures must be found
    and fixed in real time. With continuous monitoring, teams measure the performance
    and availability of software to improve stability. Continuous monitoring helps
    identify the root causes of issues quickly to proactively prevent outages and
    minimize user issues. Some monitoring experts even advocate that the definition
    of a service must include monitoring, as it is viewed as integral to service delivery.


    Similar to testing, monitoring starts in development. The same tools used to monitor
    the production environment can be employed in development to identify performance
    problems before a product moves into production. Two kinds of monitoring are required
    for DevOps: (1) server monitoring and (2) application performance monitoring.


    # Integration of risk-management practices in DevOps


    Through 2015, 80% of the risks associated with attaining DevOps programme objectives
    stemmed from how organizational change was managed.'
  merge: -1
  img_proc: true
