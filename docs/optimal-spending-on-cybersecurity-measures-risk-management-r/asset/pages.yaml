- pgno: 104
  md: '# Technology landscape


    The technology landscape is defined as the technology and information security
    measures in place within the enterprise architecture. This landscape is usually
    depicted through enterprise architecture artefacts that include but are not limited
    to the visual layout of the technology, system interfaces, communication channels,
    application portfolios, technology stack and security measures. This landscape
    extends from the on-premises environment to suppliers, service providers, agents
    and partners.


    # Data classification


    Data classification, in the context of cyber risk management, is the classification
    of data based on their level of impact on an organization and includes collection,
    use, disclosure and retention. The protection of data is based on the data classification
    level—that is, public, internal use, confidential or restricted. These levels
    define the type of safeguards that should be in place to adequately protect the
    data, regardless of how they are stored. Protection of data includes safeguards
    to minimize loss, theft, unauthorized access, use, disclosure, copying and modification.


    # Risk-management practices


    All organizations are confronted with risks that have the potential to negatively
    affect their business. Risk-management practices in the financial services sector
    focus on identifying, measuring and analysing those threats to reduce material,
    reputation, opportunity and other costs. These practices utilize the ERM framework,
    which is integrated with information security, privacy risk, vulnerability management,
    system and application development lifecycles along with BCM.


    # Cost–benefit analysis for cybersecurity measures


    Cost–benefit analysis is the widely accepted economic principle for managing all
    of an organization’s resources. This principle requires that the costs of an activity
    be compared with its benefits. When the benefits exceed the costs, it pays to
    engage in those activities, whereas if the costs exceed the benefits, the opposite
    is true. When the costs and benefits of an activity are equal, the decision-maker
    may factor other qualitative measures into the decision. The three major activities
    usually associated with cybersecurity are (1) protecting information from authorized
    users of the information, (2) making information available to authorized users
    on a timely basis and (3) protecting information from integrity flaws.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Business objectives


    Business objectives are specific and measurable goals that an organization wants
    to attain as it focuses on growth, profitability, efficiency and stability. These
    objectives are interconnected with the enterprise strategy and appear directly
    within the business strategy and multi-year road map.


    # Cybersecurity risk-management framework


    Risk signifies an uncertain event that may occur in a present or future process
    and can affect elements within the process. In the context of software engineering,
    some additional definitions are useful. Risk is defined as a two-part function:
    (1) the adverse impact an event would have if it occurred and (2) the likelihood
    of the event occurring.


    To further understand risk, it is essential to understand what is considered an
    adverse event. These unfavourable events can be viewed from multiple levels of
    abstraction and can occur in different stages of maturity. The maturity level
    is often categorized as one of the following three types: failures, errors and
    bugs. These terms are often erroneously believed to be interchangeable, but in
    the scope of risk management and software testing, they carry significantly different
    meanings.


    +   - A failure is a malfunction of the programme in relation to specifications
    and/or expected behaviour.

    +   - An error is the state of the programme in which failures occur.

    +   - A fault is the root cause in the codebase or environment of the error state
    and is used interchangeably with the term “bug”.


    The aim of risk management is for an organization to implement a framework that
    covers the work related to the risk associated with its environment. The goal
    is to continuously identify, analyse and assess the risk associated with the organization
    in a systematic, procedural manner. Risk management can, in many cases, assist
    in mitigating the risk of adverse events and prepare responses for a situation
    in which one or several identified risks have occurred. A significant amount of
    research has been dedicated to standardizing risk-management methodologies, both
    in the scope of software projects and in more general terms. One study that is
    often referenced is the National Institute of Standards and Technologies (NIST)
    SP 800–39 Risk-Management Process, which states that core activities should take
    place in an organization’s risk-management process to ensure that it is sufficient.
    These activities are outlined as follows:


    +   1 Framing risk is the step where the context of the risk is defined and the
    potential risk factors are identified.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '+   2. Assessing risk is the step where the probability and potential impact
    of a risk factor are examined.

    +   3. Responding to risk is the step where decisions are made regarding how to
    react to an adverse event and what to make of the assessed risk factors.

    +   4. Identifying risk has no inherent value; mitigating negative value through
    response plans and risk avoidance is what results in value.

    +   5. Monitoring risk is the process of monitoring the implementation and effectiveness
    of the risk-management plan determined through the other steps. This step is the
    continuous aspect of risk management and is responsible for identifying new risks,
    developing more efficient solutions and tracking.


    Risk assessment is an essential part of any organizational process—that is, business,
    technology and software—and can involve external third parties, such as suppliers,
    agents and vendors. There are many different definitions, but at its most basic,
    it is the process of gathering information related to the process or processes
    of interest to assess the risks related to them. It often includes estimating
    both the likelihood that an event will negatively affect the organization—that
    is, processes, technology and projects—and the extent to which that adversity
    will impact the organization. It is a complex process that requires analysing
    the relevant data related to the specific processes, technologies and projects,
    as well as the data related to the organization and potential end users.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_106_0.png)


    Figure 7.2 The elements of the risk-management process (NIST, 2020).'
  merge: -1
  img_proc: true
