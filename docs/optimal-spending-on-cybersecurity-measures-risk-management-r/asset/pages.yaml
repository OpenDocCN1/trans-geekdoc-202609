- pgno: 68
  md: '# Auditing configuration management


    Securely configuring an organization''s cloud technology environment is a responsibility
    shared between the organization and AWS. The organization provides requirements
    for secure configuration settings and expects AWS to provide a mechanism to implement
    and regularly audit the configurations in place.


    # Risk-management practice – DevOps


    DevOps is a term used to describe better communication and collaboration between
    application development professionals and infrastructure operations professionals.
    It refers to a set of emerging practices to enable developers and operations professionals
    to work together. Developers want to release software more frequently, while operations
    professionals want to protect the stability of the infrastructure. DevOps is a
    business strategy of overlapping traditional operational and developmental lanes
    to create an environment that continually improves operations through the cross-pollination
    of developers and operators. The overall strategic objective of DevOps is to maximize
    investment outcomes and ensure that customers continually receive increased service
    quality and features in a manner that satisfies their needs. This analysis will
    focus on integrating risk-management practices into the DevOps framework.


    The overall goal of DevOps is to improve the business value of the work completed
    in IT and to focus on the following goals:


    +   - Deliver measurable business value through continuous and high-quality service
    delivery.

    +   - Emphasize simplicity and agility in all areas, including technology, process
    and human factors.

    +   - Break down barriers between development and operations by enabling trust
    and sharing. ownership, supporting innovation and encouraging collaboration.

    +   - Manage dynamic compliance, as access/sharing laws change rapidly.


    DevOps represents a change in IT culture, focusing on rapid IT service delivery
    through the adoption of agile, lean practices in the context of a system-oriented
    approach. DevOps emphasizes people (and culture) and seeks to improve collaboration
    between operations and development teams. DevOps implementations utilize technology—especially
    automation tools that can leverage an increasingly programmable and dynamic infrastructure
    from a lifecycle perspective.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/8bcb92bad95ddd74218ba966f2798d54_69_0.png)


    +   1 Agile and lean refer to teams iterating, with short development cycles and
    fast feedback. Agile focuses on culture and is agnostic in regard to the tools
    used.

    +   2 DevOps refers to how engineering organizations collaborate using cross-functional
    teams. DevOps starts with culture and drives towards tooling.

    +   3 System reliability engineering (SRE) refers to how engineering organizations
    automate, entrusting highly scaled operations to people with a software engineering
    mindset. SRE starts with tooling and drives towards culture.

    +   4 DevOps variants (such as “SecDevOps”) involve the insertion or addition
    of another organization/practice early in the SDLC, and the prevalence of these
    different types of DevOps speaks to the increasing integration of functions in
    modern organizations.


    DevOps incorporates many variations on the theme. However, most observers would
    agree that the following capabilities are common to virtually all DevOps cultures:
    (1) collaboration, (2) automation, (3) continuous integration, (4) continuous
    delivery, (5) continuous testing, (6) continuous monitoring and (7) rapid remediation.'
