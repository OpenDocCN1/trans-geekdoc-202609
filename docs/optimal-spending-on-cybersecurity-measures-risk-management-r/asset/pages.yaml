- pgno: 80
  md: '# Defining requirements


    As part of its BCM programme, the organization should categorize its activities
    according to their priority for continuity, as determined by a business impact
    analysis, and define the minimum level at which each critical activity needs to
    be performed.


    Management should agree upon the organization’s business continuity requirements,
    and these requirements will result in recovery time objectives (RTOs) and recovery
    point objectives (RPOs) for the minimum business continuity objective (MBCO) per
    product, service or activity. RTOs start from the point at which a disruption
    occurs and run until the product, service or activity resumes.


    # Understanding critical services


    There may be several ICT services that are critical and required to enable recovery
    to take place. Each of these critical ICT services should have its own documented
    RTO and RPO for the MBCO of the ICT service. The objectives may include aspects
    of ICT service delivery, such as the help-desk. The RTO of critical ICT services
    will invariably be a lower priority than the RTO of business continuity. The organization
    should identify and document its critical ICT services to include brief descriptions
    and names that are meaningful to the organization at the service user level. This
    will ensure a common understanding between business and ICT staff, as different
    names may be used for the same ICT service. Each critical ICT service listed should
    identify the product or service that it supports, and management should agree
    upon the ICT services and the associated IRBC requirements.


    For each critical ICT service identified and agreed upon, all ICT components of
    the end-to-end service should be described and documented to show how they are
    configured or linked to deliver each service. Both the normal ICT service delivery
    environment and the ICT continuity service delivery environment configurations
    should be documented.


    For each critical ICT service, the current continuity capability—that is, the
    existence of a single point of failure—should be reviewed from a prevention perspective
    to assess the risks of service interruption or degradation, which can be taken
    as part of the overall BCM risk-assessment exercise. Opportunities to improve
    ICT service resilience and thereby lower the likelihood and/or impact of service
    disruption should also be sought. This type of review may also highlight opportunities
    to enable early detection and reaction to ICT service disruption. The organization
    can decide whether there is a business case for investing in identified opportunities
    to improve service resilience. This risk assessment, which may form part of the
    organization’s'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'overall risk-management framework, may also inform the business case for enhancing
    ICT service recovery capability.


    # Identifying gaps between ICT readiness capabilities and business continuity
    requirements


    For each critical ICT service, the current ICT readiness arrangements, such as
    prevention, monitoring, detection, response and recovery, should be compared with
    business continuity requirements, and any gaps should be documented.


    Management should be informed of any gaps between critical IRBC capability and
    business continuity requirements. Such gaps might indicate risks and the need
    for additional resilience and recovery resources, such as the following:


    +   - Staff, including numbers, skills and knowledge.

    +   - Facilities to house ICT equipment—that is, a computer room.

    +   - Supporting technology, plant, equipment and networks.

    +   - Information applications and databases.

    +   - Finance or budget allocation.

    +   - External services and suppliers.


    Management should sign-off on the ICT service definitions, the documented list
    of critical ICT services and the risks associated with identified gaps between
    critical IRBC capability and business continuity requirements.


    This should include, where appropriate, signing off on identified risks. The options
    for addressing the identified gaps and risks should then be explored by determining
    IRBC strategies.


    # Determining IRBC strategy options


    IRBC strategies should define the approaches to implement the required resilience
    strategies so that the principles of incident prevention, detection, response,
    recovery and restoration are in place.


    A full range of IRBC strategy options should be evaluated. The strategies chosen
    should support the business continuity requirements of the organization.


    The organization should consider implementation and ongoing resource requirements
    when developing the strategy. External suppliers may be contracted to provide
    specialized services and skills that play an important role in supporting the
    strategy.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'The IRBC strategy should be flexible enough to cater to different business
    strategies in different markets.


    In addition, the strategy should consider internal constraints and factors, such
    as the following:


    +   - Budget.

    +   - Resource availability.

    +   - Potential costs and benefits.

    +   - Technological constraints.

    +   - The organization''s risk appetite.

    +   - The organization''s existing IRBC strategy.

    +   - Regulatory obligations.


    # IRBC strategy options


    The organization should consider a range of options for the incident readiness
    of its critical ICT services. The options should allow for increasing protection
    and resilience as well as providing for recovery and restoration from an unplanned
    disruption and may include an internal arrangement. Services delivered to the
    organization may be provided externally by one or more third parties.


    The options should consider the various components required to ensure the continuity
    and recovery of critical ICT services.


    # Skills and knowledge


    The organization should identify appropriate strategies for maintaining core ICT
    skills and knowledge. This may extend beyond employees to contractors and other
    stakeholders who possess extensive ICT specialist skills and knowledge. Strategies
    to protect or provide those skills may include the following:


    +   - Documentation of the way in which critical ICT services are performed.

    +   - Multiskill training of ICT staff and contractors to enhance skill redundancy.

    +   - Separation of core skills to reduce the concentration of risk.

    +   - Knowledge retention and management.


    # Facilities


    According to the identified risks, the organization should devise strategies to
    reduce the impact of the unavailability of normal ICT facilities.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'These may include one or more of the following:


    +   - Alternative facilities within the organization, including displacement of
    other activities.

    +   - Alternative facilities provided by other organizations.

    +   - Alternative facilities provided by third-party specialists.

    +   - Working from home or at other remote sites.

    +   - Other agreed-upon suitable working facilities.

    +   - Use of an alternative workforce at an established site.

    +   - Alternative facilities that can be transported to the site of the disruption
    and used to directly replace some of the physical assets involved.


    Strategies for ICT facilities can vary significantly, and a range of options may
    be available. Different types of incidents or threats may require the implementation
    of multiple strategies that will be driven in part by the organization’s size,
    breadth of activities, locations, technologies and budget.


    In considering the use of alternative premises, the following should be considered:


    +   - Site security.

    +   - Staff access.

    +   - Proximity to existing facilities.

    +   - Availability.


    # Technology


    The ICT services upon which critical business activities depend should be available
    in advance of the resumption of the dependent critical business activities. The
    required solutions should ensure the availability of applications within specific
    time frames; that is, the RTOs should be determined as part of the business impact
    analysis (BIA). Technology platforms and application software should be put in
    place within time frames demanded by the organization. Technologies that support
    critical ICT services frequently require complex arrangements to ensure continuity,
    and the following should be considered when selecting IRBC strategies:


    +   - RTOs and RPOs for critical ICT services that support the critical activities
    identified by the BCM programme.

    +   - Location and distance between technology sites.

    +   - Number of technology sites.

    +   - Remote access to systems.

    +   - Cooling requirements.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   - Power requirements.

    +   - Use of unstaffed sites.

    +   - Telecoms connectivity and redundant routing.

    +   - The nature of “fallback”—that is, manual or automatic intervention—that
    is required to activate alternative ICT provision.

    +   - Level of automation required.

    +   - Technology obsolescence.

    +   - Outsourced service provider connectivity and other external links.


    # Data


    Additionally, critical business activities may depend on the provision of up-to-date
    or near-up-to-date data. Data continuity solutions should be designed to meet
    the RPOs of each critical business activity of the organization as they relate
    to critical business activities. The selected IRBC options should ensure the ongoing
    confidentiality, integrity and availability of critical data that support critical
    activities. Data storage and IRBC strategies should meet the organization’s business
    continuity requirements and should consider the following:


    +   - How data are securely stored—that is, disk, tape or optical media; appropriate
    backup and restoration mechanisms should be in place to ensure that the data are
    secure and in a safe environment.

    +   - Where information is stored, transported or transmitted, distance; location,
    network links, onsite, offsite or third party; and expected time frames for the
    retrieval of backup media.

    +   - Restoration time frame, driven by the volume of data, how they are stored
    and the complexity of the technical restoration process along with the requirements
    of service users and the needs of organizational continuity.


    An understanding of the “end-to-end” use of data throughout the organization is
    critical and may include information feeds to and from third parties.


    # Processes


    In selecting its IRBC strategy, the organization should consider the processes
    necessary to ensure the viability of that strategy, including those necessary
    in incident prevention, incident detection, incident response and DR. The organization
    should also identify any factors necessary for the effective implementation of
    those individual processes—that is, key skill sets, critical data, key enabling
    technologies or critical equipment/facilities.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Suppliers


    The organization should identify and document external dependencies that support
    ICT service provision and take adequate steps to ensure that critical equipment
    and services can be provided by its suppliers within pre-determined and agreed-upon
    time frames. Such dependencies may exist for hardware, software, telecoms, applications,
    third-party hosting services, utilities and environmental issues, such as air
    conditioning, environmental monitoring and fire suppression.


    Strategies for these services may include the following:


    +   - Storage of additional equipment and software copies at another location.

    +   - Arrangements with suppliers for the delivery of replacement equipment at
    short notice.

    +   - Rapid repair and/or replacement of faulty parts in the event of an equipment
    malfunction.

    +   - Dual supply of utilities such as power and telecoms.

    +   - Emergency generating equipment.

    +   - Identification of alternative/substitute suppliers.


    The organization should include ICT and BCM requirements in contracts with its
    partners and service providers. Contract schedules should include reference to
    each party''s obligations, agreed-upon service levels, response to major incidents,
    cost assignment, exercising frequency and corrective actions.


    # Signing off


    The selected IRBC strategy options should be presented to management with recommendations
    for a decision based on risk appetite and cost. Managers should be advised whether
    the selected IRBC strategy options are unable to meet the business continuity
    requirements, in which case they should be informed of current capability. Managers
    should select the IRBC strategies from the options presented to them and approve
    and sign-off on the documented options to confirm that the options have been properly
    undertaken and support the overall business continuity requirements.


    The selected IRBC strategy options should


    +   - cater to the likely risks and effects of disruption,

    +   - be integrated with the organization’s chosen business continuity strategies
    and

    +   - be appropriate for meeting the organization’s overall objectives within
    its risk appetite.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Enhancing IRBC capability


    # Enhancing resilience


    The organization should include within its high-level IRBC strategy and plans
    reference to specific enhancements of its IRBC capabilities, which are required
    to fulfil its identified IRBC requirements. These enhancements may be achieved
    through preventative and corrective actions as well as other specific processes
    or methodologies that are relevant responses to the organization’s BIA and risk
    appetite.


    # ICT readiness performance criteria


    # Identification of performance criteria


    Within any ICT environment, there are many potentially threatening events, such
    as hardware failures and security intrusion, and the organization should be capable
    of monitoring the threats and understanding whether the IRBC system is capable
    of adequately addressing them. The organization should therefore define performance
    criteria to measure the effectiveness of its ICT readiness. These criteria can
    be used to determine the desired quality of the response to a disruption in terms
    of both its effectiveness and efficiency. Performance criteria for IRBC should
    be based on the IRBC requirements as well as overall BCM objectives in terms of
    incident response and continuity requirements.


    # Implementing the elements of IRBC strategies


    # Awareness, skills and knowledge


    General awareness of the readiness of the elements of ICT services to include
    people, facilities, technology, data, processes and suppliers, as well as their
    critical components, is crucial in ensuring the required support for the business
    continuity governance and management system, including ICT readiness.


    The organization should therefore:


    +   - Raise, enhance and maintain awareness through an ongoing education and information
    programme for relevant staff and establish a process for evaluating the effectiveness
    of awareness delivery.

    +   - Ensure that staff are aware of how they contribute to the achievement of
    IRBC objectives.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The organization should ensure that all personnel who are assigned IRBC management
    responsibilities are competent to perform the required tasks by


    +   - determining the necessary competencies for such personnel,

    +   - conducting training needs analysis of such personnel,

    +   - providing training,

    +   - ensuring that the necessary competence has been achieved and

    +   - maintaining records of education, training, skills, experience and qualifications.


    # Facilities


    ICT recovery systems and critical data should, where possible, be physically separated
    from the operational site to prevent them from being affected by the same incident.
    The location of all ICT environments should be considered when implementing the
    strategy. For example, if possible, training or development ICT systems should
    be logically separated from production systems, as there may be an opportunity
    for these systems to be reconfigured in the event of a disaster to quickly restore
    production services.


    The overall scalability, manageability, supportability, performance and cost characteristics
    of the different implementation techniques should be examined to identify those
    that are most appropriate for the chosen strategies and support the overall business
    continuity aims and objectives.


    # Technology


    ICT technology strategies should be implemented and may include one or more of
    the following implementations and arrangements:


    +   - Hot standby, where ICT infrastructure is replicated across two sites.

    +   - Warm standby, where recovery takes place at a secondary site where ICT infrastructure
    is partially prepared.

    +   - Cold standby, where infrastructure is built or configured from scratch at
    an alternative location.

    +   - Ship-in arrangements, with external service providers providing hardware.

    +   - Composite arrangement of the preceding strategies: a “pick-and-mix” approach.


    # Information security


    The organization’s information security requirements should be included in planning
    for business continuity and DR. An organization should ensure that documented
    plans and response and recovery procedures are developed and'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'approved, detailing how the organization will manage a disruptive event and
    maintain its information security to a predetermined level based on management-approved
    information security continuity objectives.


    According to an organization''s information security continuity requirements,
    the organization should establish, document, implement and maintain the following:


    +   - Information security controls within business continuity or DR processes,
    procedures and supporting systems and tools.

    +   - Processes, procedures and implementation changes to maintain existing information
    security.

    +   - Controls during an adverse situation.

    +   - Compensatory controls for information security controls that cannot be maintained
    during an adverse situation.


    Information processing facilities should be implemented with redundancy sufficient
    to meet availability requirements. The organization should identify business requirements
    for the availability of information systems. Where availability cannot be guaranteed
    using the existing systems architecture, redundant components or architectures
    should be considered.


    Where applicable, redundant information systems should be tested to ensure that
    failover from one component to another component works as intended.


    # Data


    The arrangements identified for the availability of data should be aligned with
    the requirements identified within the IRBC management strategies and may include
    the following:


    +   - Additional data storage in a format that ensures data availability within
    the time frame identified in the business continuity programme.

    +   - Alternative locations for data storage that may be physical or virtual,
    provided that the security and confidentiality of the data are maintained.

    +   - Appropriate access procedures: if arrangements are made through third parties
    for the storage of information, the information owners should satisfy themselves
    that the appropriate controls are in place.


    # Processes


    IRBC processes should be documented clearly, and in enough detail, to enable competent
    staff to execute them. Some of these processes may differ from daily operations.
    IRBC procedures may be dependent on the situation'
