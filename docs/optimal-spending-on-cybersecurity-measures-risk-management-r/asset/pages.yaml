  img_proc: true
- pgno: 89
  md: 'that unfolds and, in practice, may need to be adapted based on the disruption—that
    is, the degree of loss or damage, the organization’s operational priorities and
    stakeholders’ demands.


    # Suppliers


    The organization should ensure that critical suppliers are able to support the
    IRBC service capabilities required by the organization. These suppliers should
    have their own documented and tested business continuity and IRBC plans with the
    capacity to support concurrent activations of incident or recovery plans by customers.
    The organization should establish a process to evaluate the capacity and capability
    of suppliers before engaging in their services and should continuously monitor
    and review the ability of suppliers after engaging them. Compliance with requirements/good
    practices in relevant standards is a useful means of determining suppliers’ capability—for
    example, the adoption of ISO/IEC 24762 best practices by suppliers hosting/managing
    an alternate processing facility and providing ICT DR services.


    # Incident response


    For any ICT incident, there should be an incident response to


    +   - confirm the nature and extent of the incident,

    +   - take control of the situation,

    +   - contain the incident and

    +   - communicate with stakeholders.


    The incident response should trigger an appropriate IRBC action. This response
    should be integrated with the overall BCM incident response and may invoke an
    incident management team. Individuals responsible for incident management should
    have plans for the activation, operation, coordination and communication of the
    incident response.


    # IRBC plan documents


    The organization should have documentation to manage potential disruption and
    thereby enable the continuity of ICT services and the recovery of critical activities.
    ICT incident management, business continuity and technical recovery plans may
    be activated in rapid succession or simultaneously. The organization may develop
    specific plan documents to recover or resume ICT services and return to a “normal”
    state. However, it might not'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'be possible to define what “normal” looks like until sometime after the incident;
    therefore, it might not be possible to implement recovery plans immediately. The
    organization should therefore ensure that continuity arrangements are capable
    of extended operation in support of wider business continuity, allowing time for
    the development of “back-to-normal” recovery plans.


    # Content of plan documents


    The organization’s ICT response and recovery plans should be concise and accessible
    to those with responsibilities defined in the plans. Plans should contain the
    elements discussed in the following sections.


    # Purpose and scope


    The purpose and scope of each specific plan should be defined, agreed upon by
    management and understood by those who will invoke the plan. Any relationship
    to other relevant plans or documents within the organization, particularly to
    BCPs, should be clearly referenced, and the method of obtaining and accessing
    these plans should be described.


    Each incident management and ICT response and recovery plan should establish prioritized
    objectives in terms of the following:


    +   - The critical ICT services to be recovered.

    +   - The time frame in which they are to be recovered.

    +   - The recovery level needed for each critical ICT service activity.

    +   - The situation in which each plan can be invoked.


    Plans may also contain, where appropriate, procedures and checklists that support
    the post-incident review process.


    # Roles and responsibilities


    The roles and responsibilities of the people and teams with authority, in terms
    of both decision-making and authority to spend during and following an incident,
    should be clearly documented.


    # Plan invocation


    Invariably, time lost during a response cannot be regained. It is almost always
    better to initiate an ICT response and subsequently stand it down than to miss
    an opportunity to contain an incident early and prevent escalation. Therefore,
    the organization should use the incident management escalation and invocation'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'protocols contained within its wider business continuity incident management
    plans as the basis for managing potential ICT-related service disruptions. The
    method by which an ICT response and recovery plan is invoked should be clearly
    documented. This process should allow for the relevant plans or parts thereof
    to be invoked in the shortest possible time, either in advance of a potentially
    disruptive event or immediately after the occurrence of an event. The plan should
    include clear and precise descriptions of the following:


    +   - How to mobilize the assigned individual or team.

    +   - Immediate rendezvous points.

    +   - Subsequent team meeting locations and details of any alternative meeting
    locations.

    +   - Circumstances under which an IRBC response is deemed unnecessary—that is,
    minor faults and outages that, even in the case of critical ICT services, may
    be managed by normal helpdesk and support arrangements and agreements.

    +   - Process for standing down the ICT response team once the incident is over
    and returning to business as usual.

    +   - ICT response and recovery plan documentation owner.

    +   - How the owner of the ICT response and recovery plan documentation will be
    held accountable for regularly reviewing and updating the documentation.

    +   - How a system of version control will be employed, all interested parties
    formally notified and a formal continuity plan document distribution record maintained.

    +   - Contact details.


    # ICT response and recovery plan documentation


    The ICT response and recovery plan documentation should


    +   - be flexible, feasible and relevant;

    +   - be easy to read and understand; and

    +   - provide a basis for managing serious issues that are deemed to merit an
    IRBC response, typically following a significant disruption event.


    The documentation should define the overarching framework within which the recovery
    plans are organized, covering the following:


    +   - Overall strategy.

    +   - Critical services with RTOs/RPOs.

    +   - Timelines for recovery.

    +   - Recovery teams and their responsibilities.'
  merge: -1
