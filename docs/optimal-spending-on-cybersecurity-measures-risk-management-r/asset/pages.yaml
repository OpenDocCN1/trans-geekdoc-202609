- pgno: 114
  md: '# Assess the internal controls


    # Internal control environment


    The control environment and monitoring activities are foundational for an organization
    to effectively manage its information security risk exposure. As stated in the
    2013 COSO Framework,


    The control environment is the set of standards, processes, and structures that
    provide the basis for carrying out internal control across the organization. The
    board of directors and senior management establish the tone at the top regarding
    the importance of internal control and expected standards of conduct.


    # Cybersecurity and privacy risk framework


    The privacy framework approach to privacy risk involves considering privacy events
    as potential problems individuals could experience that arise from system, product
    or service operations with data, whether in digital or non-digital form, through
    a complete lifecycle from data collection through disposal.


    # Privacy framework functions


    The five privacy framework functions are defined in the following sections.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_114_0.png)


    Figure 7.4 A cybersecurity and privacy risk relationship (NIST, 2020).'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# IDENTIFY-P


    Identify-P develops the organization’s understanding of how to manage privacy
    risks for individuals arising from data processing. The activities in the identify-P
    function are foundational for the effective use of the privacy framework. Inventorying
    the circumstances under which data are processed, understanding the privacy interests
    of individuals who are directly or indirectly served or affected by the organization
    and conducting risk assessments enable an organization to understand the business
    environment in which it is operating and identifies and prioritizes privacy risks.


    # GOVERN-P


    Govern-P develops and implements an organization’s governance structure to enable
    an ongoing understanding of the risk-management priorities that are informed by
    privacy risk. The govern-P function is similarly foundational but focuses on organization-level
    activities—for example, (1) establishing the organization’s privacy values and
    policies, (2) identifying legal/regulatory requirements and (3) understanding
    the risk tolerance that enables the organization to focus and prioritize its efforts
    in ways that are consistent with its risk-management strategy and business needs.


    # CONTROL-P


    Control-P develops and implements appropriate activities to enable the organization
    to manage data with sufficient granularity to understand privacy risks. The control-P
    function is associated with data processing management from the perspectives of
    both organizations and individuals.


    # PROTECT P


    Protect-P develops and implements appropriate data processing safeguards. The
    protect-P function covers data protection to prevent cybersecurity-related privacy
    events and represents the intersection of privacy and cybersecurity risk management.


    # COMMUNICATE-P


    Communicate-P develops and implements appropriate activities to enable the organization
    to have a reliable understanding of how data are processed and the associated
    privacy risks.


    The communicate-P function includes the recognition that both the organization
    and individuals may need to know how data are processed to effectively manage
    privacy risks.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Privacy risk assessments


    Privacy risk management is a cross-organizational set of processes that assist
    the organization in understanding how its systems, products and services may create
    concerns for individuals and how to develop effective solutions to manage these
    risks. Privacy risk assessment is a sub-process of identifying and evaluating
    specific privacy risks. In general, privacy risk assessments produce information
    that can assist organizations in weighing the benefits of data processing against
    the risks to determine the appropriate response.


    The internal control environment is defined as the technology and information
    security controls in place within the enterprise architecture. This landscape
    is usually depicted through enterprise architecture artefacts, which include but
    is not limited to diagrams, interfaces, communication channels and application/technology
    portfolios. In addition, it extends from the on-premises environment to suppliers,
    service providers, agents and partners. Therefore, in addition to internal assessments,
    external third-party assurance reports are utilized to assist with internal control
    environment assessments.


    # Cybersecurity framework


    Some organizations utilize cybersecurity risk-based frameworks to manage cybersecurity
    risk. The industry framework has been established through NIST and is composed
    of the following three parts: the framework core, the framework implementation
    tiers and the framework profiles. Each framework component strengthens the integration
    between cybersecurity activities and business drivers.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_116_0.png)


    Figure 7.5 The NIST cybersecurity framework (NIST, 2020).'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'The framework core is a set of cybersecurity activities, desired outcomes and
    applicable references that are common across critical infrastructure sectors.
    The core provides industry standards, guidelines and practices in a way that allows
    the communication of cybersecurity activities and outcomes from the executive
    level to the implementation/operations level.


    The framework core consists of five concurrent and continuous functions— identify,
    protect, detect, respond and recover. When considered as a whole, these functions
    provide a high-level strategic perspective on the lifecycle of an organization’s
    management of cybersecurity risk through an assessment of the internal control
    environment. The framework core then identifies the underlying key categories
    and subcategories of the specific outcomes for each function. These outcomes are
    equated with informative references, such as existing standards, guidelines and
    practices, for each subcategory.


    # Vendor assurance reports


    As outsourcing service providers (OSPs) manage a significant amount of customer
    data, systems, processes and operations, their ability to manage associated risks
    while meeting increasing compliance requirements often emerges as a priority.
    Many service providers are reactive to third-party reporting due to the lack of
    full visibility in their reporting portfolios. Creating a library of enterprise-wide
    requirements and mapping individual obligations to corresponding controls can
    help identify gaps and overlaps. For example, an organization may have one control
    for regulating physical access to its data centre, but it may align with 20 different
    internal and external requirements. An integrated library of requirements and
    control tests can make it easier to compile customer-centric reports.


    Outsourcing is a growing trend, and companies increasingly depend on third-party
    providers to deliver critical services. The purpose of third-party reports—that
    is, SOC2 or ISAE3402 reviews—is to provide client auditors with an objective report
    that expresses an opinion about the control environment of a service organization.
    These reports are designed to provide assurances about the effectiveness of the
    controls in place at a service organization—that is, SOC for Service Organizations:
    Trust Services Criteria (SOC2) assesses the security, availability or processing
    integrity of the system used to process client information or the confidentiality
    or privacy of that information.


    # Determine the organizational risk appetite


    An organization’s risk appetite is the amount of risk, on a broad level, that
    an organization is willing to accept as it attempts to achieve its goals and provide
    value to its stakeholders.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Table 7.6 A sample residual risk rating scale (Optiv, 2011).


    | | | Inherent Risk | | |

    |---|---|---|---|---|

    | | | Low | Medium | High |

    | Control effectiveness | Highly effective | Low | Low | Medium–low |

    | | Effective | Low | Medium–low | Medium |

    | | Partially effective | Low | Medium–low | Medium–high |

    | | Ineffective | Low | Medium | High |

    | | | Low | Medium | High |

    | | | Residual risk | | |


    During the risk-assessment process, an organization’s residual risk is assessed
    to determine the remaining risk after internal controls are implemented.


    Assessing this risk shows the organization the areas where a gap or lack of internal
    control exists. Usually, this is the area of focus for key stakeholders as they
    perform the cost-benefit analysis and determine the risk-mitigation strategy.
    In essence, residual risk should be aligned with the organization’s/business unit’s
    risk profile within the risk tolerance level.


    Specifically, the residual risk score is a qualitative score that is more granular
    than the inherent risk score. The inherent risk is assigned one of three scores—that
    is, high, medium or low—while the residual risk is commonly assessed based on
    five or more possible scores—that is, high, medium-high, medium, medium-low and
    low. This granularity highlights the control implementation progress over time
    and better reflects changes in the overall risk.


    # Risk-mitigation strategy


    In some circumstances, to align the residual risk with the organization’s/business
    unit’s risk appetite, further mitigation is required. Therefore, organizations
    are required to make decisions about funding cybersecurity activities in a manner
    consistent with the viewpoints of various stakeholders. Table 7.7 lists a risk
    treatment scale that aligns the impact, likelihood and inherent risk rating scale
    to identify areas that may require governance and risk mitigation through senior
    management oversight and additional cybersecurity measures.


    Cost-benefit analysis is the widely accepted economic principle for managing an
    organization’s resources. This principle requires that the costs of an activity
    be compared with its benefits. When the benefits exceed the costs, it pays to
    engage in those activities, whereas if the costs exceed the benefits,'
  merge: -1
  img_proc: true
