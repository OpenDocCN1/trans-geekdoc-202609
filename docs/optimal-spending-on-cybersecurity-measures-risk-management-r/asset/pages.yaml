- pgno: 6
  md: '# Preface


    The aim of this book is to discuss the decision-making process for cybersecurity
    investments in organizations using a conceptual cybersecurity risk-management
    framework. Most conceptual models consider the dynamic environment, which is adaptable
    to changes that occur within the decision-making process. These models and frameworks
    rely on either specific scenarios or controlled conditions. As a result of the
    dynamic environment within the cybersecurity industry, mitigation strategies evolve
    to address emerging industry threats. These variations influence the conditions
    that were used within previous frameworks and economic models. Decisions regarding
    cybersecurity spending within organizations vary based on the stakeholders—specifically,
    the funding available in comparison to the recommended security measures necessary
    for compliance. These executive decisions may be coloured with bias regarding
    the appropriate security baseline required to protect relevant information assets
    within the organization. The trade-off between the costs of implementing a security
    measure and the benefit derived from the implementation is not easily measured.
    Therefore, the lack of this information may impact the business leader''s decision
    to fund security measures and the choice to further invest in developing new technology
    to drive innovation, business growth and customer satisfaction.


    This book focuses on the strategic decisions made by organizations when implementing
    cybersecurity measures and belongs to the area of risk management, leveraging
    various models within the fields of (1) economics, (2) organizational decision-making
    and (3) cybersecurity to determine optimal spending on cybersecurity measures,
    which includes a preventative approach for risk-taking organizations. This book
    provides a cybersecurity risk-management framework and demonstrates the application
    of the process using case studies. This book discusses risk-management practices'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'in organizations and defines a strategic approach to minimize cybersecurity
    risks.


    This book makes an industry contribution by assisting business leaders with choosing
    an appropriate risk-mitigation strategy when implementing cybersecurity measures.
    The application of this framework within organizations will assist stakeholders
    with decisions pertaining to cybersecurity spending. In leveraging the review
    of additional studies, this book aims to utilize a case study methodology to demonstrate
    that risk-based decisions are necessary when implementing cybersecurity measures.
    The case study methodology provides an in-depth view of a risk-taking organization’s
    risk-mitigation strategy within the bounds of an educational environment focusing
    on the following five areas identified within a digital cyber risk model: (1)
    technology landscape, (2) data classification, (3) risk-management practices,
    (4) cost–benefit analysis for cybersecurity measures and (5) business objectives.'
  merge: -1
  img_proc: true
