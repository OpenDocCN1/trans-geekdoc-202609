- pgno: 14
  md: '# 2 Enterprise risk-management framework


    Risk-management methodologies stem from the enterprise risk-management (ERM) framework.
    This is defined as an organization’s ability to understand, control and articulate
    the nature and level of risks taking into account the business strategy, coupled
    with accountability for organizational risk. One of the main benefits of the ERM
    framework is an enhanced viewpoint and focus on risk management within the organization.
    ERM addresses the following organizational questions:


    +   - Should we pursue this initiative? This aligns with strategy, risk appetite,
    culture and ethics.

    +   - Can we achieve this initiative? This aligns with people, processes, structure
    and technological capabilities—that is, operational risk.

    +   - Did we accomplish this initiative? This is the assessment of expected results,
    continuous learning and a robust system of checks and balances.


    ERM promotes strategies that assist organizations in holistically managing risk.
    ERM is a governance structure that provides a horizontal view of the risk disciplines
    and operational risks of an institution.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_14_0.png)


    Figure 2.1 The COSO Internal Control Framework (COSO, 2020).'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'The elements of the ERM framework are detailed in the following sections.


    # Internal environment


    Management determines the philosophy regarding risk and establishes the level
    of risk the organization is willing to assume, known as risk appetite. The internal
    control environment provides the basis of how risk and controls are assessed and
    managed by an organization. The importance of ERM is communicated by executive
    management throughout the organization.


    # Common language around risk


    The risk-management approach must involve establishing a common risk terminology
    with appropriate training and awareness of the terminology by stakeholders within
    the organization. A common definition of risk is “the potential for loss, or the
    diminished opportunity for gain, which can obstruct the achievement of an organization’s
    business objectives”. Common terminology will facilitate communication across
    business units:


    +   - Risk is the possibility that an event will occur and adversely affect the
    achievement of objectives.

    +   - Risk culture is the appearance of ERM and the attitude towards it that management
    conveys to the organization’s personnel. Are management actions aligned with the
    implemented ERM strategies?” (COSO, 2020).


    # Risk-management steering committee


    It is important to establish a senior management-level committee to provide oversight
    of the implementation of the ERM framework. In addition, the committee will help
    delineate roles, responsibilities and accountabilities as identified within the
    framework.


    Roles and responsibilities: They must be clearly defined and communicated throughout
    an organization.


    Board of directors and CEO: They have ultimate accountability for all risks. Risk-management
    practices must be discussed periodically, and risk-management-related policies
    must be reviewed and approved.


    Senior management: Senior managers are responsible for designing, implementing
    and maintaining an effective framework. In addition, they'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'should develop policies and procedures, establish and monitor the risk appetite
    level and report regularly to the board of directors.


    Business units: They (1) promote a risk-aware culture; (2) identify, (3) assess,
    (4) measure, (5) monitor, (6) control and (7) report risks to senior management;
    (8) manage relevant risks within the framework established by senior management;
    and (9) ensure compliance with policies and procedures.


    Support departments—that is, legal, HR, and information technology (IT): They
    provide support to business units in developing and enforcing policies and procedures.


    Internal audit and compliance: They monitor and provide independent assurance
    of the effectiveness of the framework.


    Risk management: Risk managers coordinate the establishment of the framework and
    provide expertise.


    # Objective setting


    Objectives must exist before management can identify potential events affecting
    the achievement of organizational goals. ERM ensures that management has a process
    in place to set objectives and that the chosen objectives support and are aligned
    and consistent with an organization’s mission and risk appetite.


    # ERM methodology


    The development of a methodology for the ERM framework should include definitions
    of key risk terms, descriptions of roles and responsibilities and clear procedures
    for risk identification, assessment, measurement, mitigation, monitoring and reporting.
    The methodology should be expressed in a formally written document that comprises
    all the key business areas. The document should consider the organization’s strategic
    direction and objectives and clearly outline its capacity to take risks and its
    tolerance of potential loss. In addition, the risk appetite level must be regularly
    reviewed and approved by the senior management and board of directors.


    # Risk appetite


    Risk appetite is the amount of risk, on a broad level, that an organization is
    willing to accept as it tries to achieve its goals and provide value to stakeholders.
    It reflects the ERM philosophy and in turn influences the organization’s culture
    and operating style.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Risk tolerance


    Risk tolerance is the acceptable level of variation relative to the achievement
    of a specific objective and is often measured using the same units as the related
    objective. In setting risk tolerance, management considers the relative importance
    of the related objective and aligns risk tolerance with risk appetite to ensure
    that it operates within its risk appetite level.


    # Event identification


    Potential events from internal or external sources that might have an impact on
    the organization and affect the achievement of its objectives must be identified.
    Event identification includes distinguishing between events that represent risks,
    those that represent opportunities and those that may represent both risks and
    opportunities.


    # Risk assessment


    The identified risks are analysed and associated with objectives that may be affected
    to form a basis for determining how they should be managed. Risks are assessed
    on both inherent and residual bases, and the assessment should consider both risk
    likelihood and impact. Risk assessment must be performed continuously and throughout
    an organization.


    # Quantitative risk assessment


    Quantitative risk assessment refers to attempts to assign a monetary value to
    the assets being assessed, a monetary cost to the impact of an adverse event and
    percentages to the frequency of threats and the likelihood of events.


    # Risk calculation


    Risk = Asset Value × Threat × Vulnerability

    Asset value is usually the easiest to measure; however, it is difficult to quantify
    certain assets, such as institutional reputation.

    Threat may be very difficult to measure the potential for harm, although information
    from external sources is useful.

    Vulnerability can be measured using automated computing device vulnerability tools
    to provide information, but not all vulnerabilities can be quantified.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Qualitative risk assessment


    Qualitative risk assessments are scenario driven and do not attempt to assign
    monetary value to the assets being assessed or to the impact of an adverse event.
    They aim to rank the impacts of threats and criticality of assets into categories
    such as low, medium and high.


    # Risk response


    The organization identifies and evaluates possible responses to risks, which include
    avoiding, accepting, reducing and sharing risks. Management selects a set of actions
    to align risks with the organization’s risk tolerance and risk appetite. The ERM
    framework advocates the following responses:


    +   - Avoidance means the organization ceases the activities that cause the risk.
    Some examples of avoidance are ending a product line, selling a division or deciding
    against expansion.

    +   - Reduction means action is taken to mitigate the risk likelihood and impact.

    +   - Sharing means reducing the risk likelihood and impact by sharing a proportion
    of the risk. An extremely common sharing response is insurance.

    +   - Acceptance means no action is taken to affect the risk likelihood or impact.


    # Control activities


    Policies and procedures are established and implemented to ensure that the risk
    responses selected by management are effectively carried out.


    # Risk identification


    Risk identification can be completed through a risk control self-assessment (RCSA)
    approach coordinated by risk management and conducted with subject-matter experts.
    This method uses a risk taxonomy to identify applicable risks, inherent risk levels,
    quality of internal controls and residual risk levels.


    The process consists of the following steps:


    +   - Identify applicable risks and describe the business activity that exposes
    the business unit to each risk.

    +   - Establish the inherent risk level (H, M, L) and typical annual damage. Inherent
    risk prevents the achievement of business objectives without considering internal
    controls. Typical annual damage, if applicable,'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'can be estimated based on the subjective judgement of the business unit and
    should consider both past (actual losses) and potential future occurrences.


    +   Assess and rank the quality of internal controls (H, M, L) and the reason
    for the assessment. Internal controls mitigate the inherent risk and involve the
    implementation of policies, procedures and standards.


    +   Calculate the residual risk level (H, M, L) that remains after considering
    the relevant internal controls. For example, a medium inherent risk and low-quality
    internal controls will result in a high residual risk level.


    # Risk prioritization


    By using the results of the RCSA for each business unit, the key risks should
    be prioritized based on the residual risk levels. All high residual risks should
    be discussed with the risk-management steering committee, and risk-mitigation
    plans (RMPs) should be developed.


    # Risk-mitigation plans


    RMPs must be established by taking a risk-based approach to address areas with
    the greatest control weaknesses and largest potential for loss. Organizations
    will generally run out of resources before they run out of risk; therefore, high-risk
    items must be prioritized.


    Completion dates should be targeted, and responsible owners are selected to facilitate
    the risk-mitigation process.


    # Information and communication


    Relevant information is identified, captured and communicated in a form and time
    frame that enables people to carry out their responsibilities. Information for
    identifying, assessing and responding to risk is needed at all levels of an entity.


    # Monitoring


    ERM is monitored, and modifications are made as necessary. In this way, the organization
    can react dynamically, changing as conditions warrant.


    # Risk monitoring and reporting


    The key risks that were identified must be monitored and periodically reported
    to the senior management and board of directors.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Scenario planning and stress testing


    Among the many tools that a manager can use for strategic analysis, scenario planning
    can capture a wide range of possibilities with specific details. By identifying
    fundamental trends, the technology executive can define a series of scenarios
    that will assist the organization in reducing errors in the decision-making process.


    > “Scenarios are thorough and probable views of how business environments might
    extend into the future” (Ringland, 2002).


    # Step 1: Brainstorm future scenarios


    In the first step, the time frame is determined based on the following factors:


    +   - The lifecycle of the product.

    +   - Political conditions within the country.

    +   - Competitor analysis.

    +   - Technological advancement.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_20_0.png)


    Figure 2.2 The elements of scenario planning (Ringland, 2002).'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Step 2: Identify trends and driving forces


    Consider the following factors:


    +   - Who has an interest in these decisions?

    +   - Who will be affected by them?

    +   - Who could influence them?


    The apparent driving forces include but are not limited to suppliers, customers,
    competitors, employees, shareholders and government. Identification of the following
    factors is also essential:


    +   - Current roles of the driving forces.

    +   - Their interests.

    +   - Their positions in the field.

    +   - Their progress over time.


    # Step 3: Create a scenario planning template


    The driving forces of the environment are identified from the key factors identified
    in Step 2. These driving forces can originate in the following areas:


    +   - Society and its structures, including demographic, economic and political
    factors, as well as public opinion.

    +   - Markets and customer behaviour.

    +   - Technology and innovation.

    +   - The organization’s competitive structure within its industry.

    +   - The organization’s organizational capacities and core competencies.


    The forces that are highly predictable should be identified so that the organization
    can focus on the effects that are less likely to occur.


    # Step 4: Develop a scenario


    The essential task of scenario planning is developing the actual scenario. Through
    this phase, a situation should be built that incorporates each factor evaluated
    in the earlier steps and considers the traits and trends of the market. In building
    a scenario, the strengths and weaknesses of the plan should be identified and
    considered.


    # Step 5: Evaluate a scenario


    Through a systematic step-by-step procedure, the scenario team can achieve a balance
    between creativity and free-form imagination by using sound judgement based on
    knowledge and experience.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Scenario analysis


    Scenario analysis shows a forward-looking view of operational risk that augments
    historical internal and external data. These exercises allow stakeholders to identify
    and manage risk exposures through business decisions and risk-mitigation strategies.


    Threat actor analysis: Identify actors who pose a threat to the organization.


    Impact analysis: Determine the areas that the organization is focused on protecting.


    Scenario selection: Determine scenarios that could have a catastrophic impact
    on the organization.


    At minimum, a scenario should include the following:


    The situation: An explanation of the sequence of events that leads to an adverse
    outcome. These may be industry and organization specific but must include items
    such as the following:


    +   - Business continuity planning (BCP) events.

    +   - External attacks by hackers, competitors or government agencies.

    +   - Malicious insiders stealing information.

    +   - Accidental release of confidential information.

    +   - The mishandling of data by vendors and third parties.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_22_0.png)


    Figure 2.3 The process of scenario analysis.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The outcomes: Outcomes that are unfavourable to an organization and are a result
    of the event should be clearly identified. An event may have multiple outcomes;
    for example, the same scenario may result in the loss of revenue, legal costs
    and regulatory fines. Each outcome should be explicitly laid out, and its impact
    should be described.


    Controls in place: Controls work as separate lines of defence, at times sequentially
    and at other times interacting with each other to help prevent the occurrence
    of an adverse event. Often, the correct operation of one control may provide adequate
    protection or mitigation. If controls operate independently of each other, as
    they often do, the combined probability of all of them failing simultaneously
    tends to be significantly lower than the probability of any one of them failing.


    Frequency of occurrence: The frequency or likelihood of the scenario being realized
    should be a part of the scenario analysis and is best estimated in a discussion
    with management.


    Severity of the outcomes: The severity of each of the adverse outcomes should
    be estimated separately.


    Scenario examples are as follows:


    +   - Scenario #1: Patch management.

    +   - Scenario #2: Network ransomware/malware attack.

    +   - Scenario #3: Unplanned attack.

    +   - Scenario #4: Financial break-in/external attack.

    +   - Scenario #5: Cloud security breach.


    Attack tree development: Develop detailed attack trees for each scenario.


    Control assessment: Map controls to the attack tree and assess effectiveness.


    Remediation: Use the control assessment to plan remediation projects that address
    control gaps.


    Response planning: Create or enhance existing response plans to cater to extreme
    scenarios.


    Exercise: Test the control strength, response plan and overall preparedness.


    # Step 6: Update strategies and policies accordingly


    One or two months after the scenarios are implemented, it is essential to evaluate
    the strategic plan and update the policies. This evaluation and update process
    should be completed on a periodic basis.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# # 3 Alignment with enterprise risk management


    # ## Operational risk management


    Operational risk is defined by the Bank of International Settlements (BIS) as
    “the risk of loss resulting from inadequate or failed internal processes, people
    and systems or from external events (strategic and reputational risk is not included
    in this definition for the purpose of a minimum regulatory operational risk capital
    charge)” (Basel Committee on Banking Supervision, 2001). Legal risk is included
    in this definition. Operational risk is therefore the sum of operating, information
    systems, compliance and legal risk.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_24_0.png)


    Figure 3.1 The elements of operational risk management through the Sergio Galanti
    operational risk puzzle (Caldas, 2006).'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'In addition to the responsibility to protect organizational assets from the
    threats that exist in the current environment, risk managers must consider and
    manage risks to individuals when information systems process sensitive information—that
    is, personally identifiable information (PII).


    # Information security aspects of operational risk


    Security risk management provides a means of better understanding the nature of
    security threats and their interaction at an individual, organizational, or community
    level (Standards Australia, 2006, p. 6). Generically, the risk-management process
    can be applied to the security risk management context. The risk-management process
    advocated in ISO 31000 should be used as the foundation for risk management in
    an organization; however, security risk management has several unique processes
    that other forms of risk management do not consider.


    The core of security risk management is identical to ERM, which has been discussed
    in Chapter 2, with the addition of informational assessments, such as threats,
    criticality registers and vulnerability assessments. Security risk management
    is the integration between risk management and these assessment forms.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_25_0.png)


    Figure 3.2 The Information Technology – Security Techniques – Information Security
    Risk-Management process (ISO, 2020).'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Cybersecurity risk-assessment process


    Information security risk management is the systematic application of management
    policies, procedures and practices to establish the context for information security
    risks and for identifying, analysing, evaluating, treating, monitoring and communicating
    those risks.


    ISO 27005 is the “Information Technology – Security Techniques – Information Security
    Risk Management” standard released by the International Organization for Standardization
    (ISO) to provide guidance for the information security risk-management processes
    that are needed to implement an effective information security management system
    (ISMS). Although this standard is considered a risk-management standard, a significant
    portion addresses information security risk assessments, which are a key part
    of a risk-management programme.


    ISO 27005 is aligned with NIST SP 800–30 and is written from a high-level perspective
    compared to other frameworks. ISO 27005 has five major topic areas:


    +   i Information security risk assessment.

    +   ii Information security risk treatment.

    +   iii Information security risk acceptance.

    +   iv Information security risk communication.

    +   v Information security risk monitoring and review.


    # Risk identification


    Information security risk assesses the impacts that can occur on an organization
    and its stakeholders due to the threats and vulnerabilities associated with the
    operation of its information systems and the environments in which those systems
    operate. The primary means of mitigating information security-related risk is
    to select, implement, maintain and continuously monitor preventive, detective
    and corrective security controls to protect information assets from compromise
    or to limit the damage to an organization should a compromise occur.


    Risk identification consists of five main activities that are discussed in the
    following sections.


    # Identification of assets


    The objective of this activity is to identify the assets that are in the scope
    of the risk assessment, including the asset owners. In ISO 27005, assets are categorized
    as either primary or secondary. Primary assets are'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'core processes, activities and information and secondary assets are hardware,
    software, network, personnel, site and structure.


    # Identification of threats


    The objective of this step is to prepare a list of potential threats to each asset.
    According to ISO 27005, stakeholders such as asset owners, users, human resources
    staff and facilities management can assist in identifying these threats. ISO 27005
    also states that internal experience, particularly based on previous incidents
    or assessments, should be considered. One of the most useful contributions of
    ISO 27005 is the inclusion of standardized threat catalogues.


    # Identification of existing controls


    The objective of this activity is to identify existing controls. The guidance
    provided within ISO 27005 for this activity is open ended and does not specifically
    address the criteria or scale of the control review. ISO 27005 does provide references
    to information sources that may be able to assist in this activity. Examples of
    information sources for this part of the review are as follows:


    +   - Documents that have information about controls.

    +   - People responsible for information security.

    +   - Onsite reviews.

    +   - Review of internal audit results.


    # Identification of vulnerabilities


    The goal is to identify an asset’s vulnerabilities through the following actions:


    +   - Vulnerability scanning and penetration testing.

    +   - Code reviews.

    +   - Interviews.

    +   - Questionnaires.

    +   - Physical inspection.

    +   - Document analysis.


    # Identification of consequences


    The objective of this activity is to determine the possible damage or consequences
    that could be caused by an “incident scenario” or what other'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'frameworks refer to as a threat scenario. ISO 27005 provides a list of impact
    factors that can be used to identify and measure consequences.


    # Expressing and measuring risk


    Information security risk “is measured in terms of a combination of the likelihood
    of an event and its consequence”.


    It is further defined as an information security event, meaning “an identified
    occurrence of a system, service or network state indicating a possible breach
    of information security policy or failure of safeguards, or a previously unknown
    situation that may be security relevant”.


    In measuring risk, it is not the risk of a single, critical event that matters
    but the general map of risk composed of all possible critical events. This enables
    the assessor to determine the total risk, especially of probable events or especially
    severe events. There are two fundamental areas of risk that allow possible critical
    events to be classified during analysis according to their importance for the
    appropriate functioning of the organization. The first is operational security,
    and the second is business continuity.


    # Risk analysis


    Risk analysis consists of determining and evaluating the following:


    +   - Processes that enable the realization of organizational tasks.

    +   - Disruptive phenomena and the probability of their occurrence.

    +   - Resource vulnerability in the sense of the magnitude of disruptive phenomena
    and their potential influence on organizational activity.


    Risk analysis is a prerequisite for subsequently treating risk. Risk treatment
    pertains to controlling the risk so that it remains within acceptable levels.
    Risk can be reduced by applying security measures. Risk can also be


    +   - shared by outsourcing or insuring,

    +   - avoided and

    +   - accepted, in the sense that the organization accepts the likely impact of
    a security incident.


    The likelihood of a security incident occurring is a function of the likelihood
    that a threat will appear and that the threat will be able to successfully exploit
    the relevant system vulnerabilities. The consequences of the'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'occurrence of a security incident are a function of the likely impact the incident
    will have on the organization as a result of the harm sustained by the organization''s
    assets.


    # Risk evaluation and quantification


    Risk evaluation is the process of comparing the results of the risk analysis with
    the risk evaluation criteria defined to determine whether the cyber-risks are
    acceptable. The following are the basic steps of the risk evaluation process:


    +   • Identification.

    +   • Probability and impact.

    +   • Identified risk.

    +   • Treatment.

    +   • Secondary risk.

    +   • Residual risk.

    +   • Monitoring and review.


    Organization-wide security and privacy risk should be assessed, and the risk-assessment
    results should be updated on an ongoing basis. There are two types of risk assessment:


    +   • Qualitative.

    +   • Quantitative.


    # Risk-mitigation planning and verification


    Risk-mitigation planning is the process of developing options and actions to enhance
    opportunities and reduce threats to project objectives. Risk-mitigation implementation
    is the process of executing risk-mitigation actions. Risk-mitigation progress
    monitoring includes tracking identified risks, identifying new risks and evaluating
    risk process effectiveness throughout the initiative.


    The risk-mitigation step involves the development of mitigation plans designed
    to manage, eliminate or reduce risk to an acceptable level. Once a plan is implemented,
    it is continually monitored to assess its efficacy with the intent of revising
    the course of action if needed.


    General guidelines for applying risk-mitigation management options are based on
    the assessed combination of the probability of occurrence and the severity of
    the consequences of an identified risk.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Risk treatment


    # Risk modification


    The introduction of an additional factor that can positively or negatively influence
    risk.


    # Risk transfer


    The identification of ways and means to transfer a risk, either through the acquisition
    of insurance (i.e., cyber insurance) or by outsourcing.


    # Risk avoidance


    Electing not to pursue a business activity that would cause the risk to appear.


    # Risk acceptance


    Conscious and deliberate acceptance of the identified level of risk, without any
    other alteration by way of modification or transference.


    # Risk remediation


    The selection of a range of tactics, techniques and procedures to reduce an asset’s
    susceptibility to compromise.


    # Risk communication


    Risk communication is an important tool for disseminating information and improving
    the understanding of risk-management decisions. This understanding and information
    enable stakeholders to make informed decisions about how the decision will impact
    their interests and values.


    # Risk monitoring and review


    Risk monitoring and review is the process of identifying, analysing and planning
    for newly discovered risks and managing identified risks. Throughout the process,
    the risk owners track identified risks, reveal new risks, implement risk response
    plans and gauge the effectiveness of risk response plans.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/8bcb92bad95ddd74218ba966f2798d54_31_0.png)


    Figure 3.3 The foundational risk-management process (The MITRE Institute, 2007).


    # Loss event management


    Understanding and managing loss events are essential to an effective operational
    risk-management programme. This process includes the frequency, amount, type and
    source of loss events as well as a comprehensive list of loss events.


    # Security metrics


    Metrics can provide insights into information security programme effectiveness,
    levels of regulatory compliance, and the ability of staff and departments to address
    security issues for which they are responsible. Metrics can also help identify
    levels of risk in not taking certain mitigation actions and thus provide guidance
    for prioritizing future resource investments. Because metrics provide concrete
    facts and a common vocabulary for communicating risks, they may additionally be
    used to raise the level of security awareness within the organization.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Security metrics are tools designed to facilitate decision-making and improve
    performance and accountability by collecting, analysing and reporting relevant
    performance-related data. IT security metrics are based on IT security performance
    goals and objectives.


    Effective metrics are often referred to as SMART (specific, measurable, attainable,
    repeatable and time dependent). These metrics should also indicate the degree
    to which security goals are achieved and facilitate actions to improve the organization’s
    overall security programme. It is important to consider the following:


    +   - How difficult it might be to collect accurate data for a given metric.

    +   - The potential that the metric might be misinterpreted.

    +   - The need to periodically review metrics that are being tracked and make
    changes as needed.


    # Key performance indicators


    A KPI is a measure of performance commonly used to help an organization define
    and evaluate how successful it is, typically in terms of making progress towards
    its long-term organizational goals.


    The following are some examples of clear cybersecurity metrics that can be tracked
    and easily presented to relevant stakeholders.


    +   - **Level of preparedness**: How many devices on an organization’s network
    are fully patched and up to date?

    +   - **Unidentified devices on the internal network**: How many such devices
    are on an organization’s network?

    +   - **Intrusion attempts**: How many times have attackers breached the organization’s
    network?

    +   - **Mean time to detect (MTTD)**: How long do security threats go unnoticed?
    MTTD measures how long it takes for an organization to become aware of a potential
    security incident.

    +   - **Mean time to resolve (MTTR)**: How long does it take an organization to
    respond to a threat once it has been uncovered?

    +   - **Days to patch**: How long does it take an organization to implement security
    patches?

    +   - **Cybersecurity awareness training results**: Who has taken (and completed)
    training? Did they understand the material?

    +   - **Number of cybersecurity incidents reported**: Are users reporting cyber-security
    issues to the organization?

    +   - **Security ratings**: Often, the easiest way to communicate metrics to non-technical
    colleagues is through an easy-to-understand scorecard.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Key risk indicators


    A key risk indicator (KRI) is a measure used by management to indicate the risk
    associated with an activity. KRIs are metrics used by an organization to provide
    early signals of increasing risk exposure in various areas of the enterprise.


    # KRI examples


    +   - Information security training completeness.

    +   - Policy exceptions/deviations.

    +   - Phishing campaign failure rate.

    +   - Outstanding audit findings.

    +   - Risk-assessment ratings.

    +   - Patch coverage by system.

    +   - Incidents and events.

    +   - Breaches.

    +   - Vulnerabilities by criticality and age.

    +   - Account management.


    # Risk culture and risk behaviours


    Risk culture is the system of values and behaviours present in an organization
    that shapes the risk decisions of management and employees. One element of risk
    culture is a common understanding of the organization and its business purpose.


    The risk culture of an organization is likely to


    +   - determine the degree to which the organization’s policies are internalized
    by staff and exhibited in day-to-day behaviour,

    +   - determine staff response to threats or situations that fall outside well-prescribed
    operating guidelines and

    +   - influence the organization’s reputation among regulators, clients and the
    broader market.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 4 Risk-management practice – vulnerability management


    Patch and vulnerability management is a security management practice designed
    to proactively prevent the exploitation of IT vulnerabilities that exist within
    enterprise systems. The expected result is the reduction of time and finances
    spent by an organization when handling the impact of unintentional/intentional
    attacks on an organization—that is, malware/ransomware. Proactively managing the
    vulnerabilities within systems will either reduce or eliminate the potential for
    exploitation. Integrating this practice within risk-management practices provides
    executive management teams with a focus on the appropriate level of risk assumed
    by their organization when existing vulnerabilities are properly monitored.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_34_0.png)


    Figure 4.1 The elements of the vulnerability management process (Huntsman, 2017).'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Patches are additional pieces of code developed to address problems commonly
    known as bugs in software. They enable additional functionality or address security
    flaws within a programme. Vulnerabilities are flaws that can be exploited by a
    malicious entity to gain greater access or privileges than it is authorized to
    have on a computer system. Not all vulnerabilities have related patches; therefore,
    system administrators must be aware not only of applicable vulnerabilities and
    available patches but also of other methods of remediation—that is, device or
    network configuration changes and employee training that limits the exposure of
    systems to vulnerabilities.


    An organization should implement a vulnerability management programme to address
    its information security vulnerabilities through a comprehensive and continuous
    process of identifying, classifying, remediating and mitigating vulnerabilities.


    # Maintain an asset inventory


    Stakeholders within an organization should maintain an asset inventory of IT resources
    to determine the type of hardware, operating system (OS) and software applications
    in use. In addition, stakeholders should maintain an inventory of IT assets that
    is updated regularly as part of the system configuration management process. An
    organization is responsible for determining the purpose and use of the inventory
    and maintains only the information needed for those uses. The resources within
    the inventory should be grouped and assigned priority levels to facilitate remediation
    efforts and may include the following:


    +   1 Associated system name.

    +   2 Property number.

    +   3 Owner of the IT resource—that is, the main user.

    +   4 System administrator.

    +   5 Physical location.

    +   6 Connected network port.

    +   7 Software configuration.

    +      a OS and version number.

    +      b Software packages and version numbers.

    +      c Network services.

    +      d IP address (if static).

    +   8 Hardware configuration.

    +      a Central processing unit.

    +      b Memory.

    +      c Disk space.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '+   d Ethernet addresses—that is, network cards.

    +   e Wireless capability.

    +   f Input/output capability—that is, Universal Serial Bus, Firewire.

    +   9 Firmware versions.


    # Prioritize assets


    An organization should define the risk and critical value for each device within
    the asset inventory. It is important to identify the importance of the device
    and the individual(s) responsible for approving access to it.


    The following factors are important in understanding the strategic factors and
    gaining a clear understanding of details:


    +   - Risk appetite.

    +   - Risk tolerance level.

    +   - Risk-mitigation practices and policies for each device.

    +   - Residual risk treatment.

    +   - Countermeasures for each device or service (if a service is correlated with
    the device).

    +   - Business impact analysis.


    # Assess vulnerabilities


    The following sections describe the methods utilized to effectively complete a
    vulnerability assessment process using any automated or manual tool.


    # System baseline definition


    Information about the system is gathered before the vulnerability assessment,
    and the following information is reviewed:


    +   - Whether the device has the appropriate open ports, processes and services.

    +   - The approved drivers and software that should be installed on the device.

    +   - The basic configuration of each device; for example, if the device is a
    perimeter device, it should not be configured to contain a default administrator
    username.


    # Vulnerability scan


    Vulnerability scanners are commonly used in many organizations to identify vulnerabilities
    on hosts and networks. A vulnerability scanner identifies not only hosts and open
    ports on those hosts but also the associated'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'vulnerabilities. A host OS and active applications are identified and then
    compared with a database of known vulnerabilities.


    Vulnerability scanners can be of two types.


    Network scanners are used to map an organization’s network and identify open ports,
    vulnerable software and misconfigured services. They can be installed on a single
    system on the network and can quickly locate and test numerous hosts.


    Network scanners are generally ineffective at gathering accurate information on
    hosts using personal firewalls unless personal firewalls are configured to permit
    network scanning activity.


    Host scanners must be installed on each host to be tested. These scanners are
    used primarily to identify specific host OS and application misconfigurations
    and vulnerabilities. Host scanners have high detection granularity and usually
    require not only host (local) access but also a root or administrative account.
    Some host scanners offer the capability of repairing misconfigurations.


    An organization’s vulnerability scanners provide the following capabilities:


    +   • Identify active hosts on networks.

    +   • Identify active and vulnerable services (ports) on hosts.

    +   • Identify vulnerabilities associated with the discovered OSs and applications.

    +   • Test compliance with host application usage/security policies.

    +   • Identify out-of-date software versions and applicable patches or system
    upgrades.


    Prior to starting a vulnerability scan, an organization’s technology group should
    integrate the applicable compliance requirements into the configuration. The recommended
    approach includes the use of related tools and plug-ins on the platform being
    assessed:


    +   • Best scan—that is, popular ports.

    +   • CMS web scans—that is, Joomla, WordPress, Drupal, general CMS.

    +   • Quick scan.

    +   • Most common ports best scan—that is, 65,535 ports.

    +   • Firewall scan.

    +   • Stealth scan.


    # Aggressive scan


    +   • Full scan, identifying exploitation and distributed denial-of-service (DDoS)
    attacks.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '+   - Open Web Application Security Project (OWASP) Top 10 Scan and OWASP checks.

    +   - PCI DSS preparation for web applications.

    +   - Health Insurance Portability and Accountability Act (HIPAA) policy scan
    for compliance.


    # Vulnerability assessment report


    The vulnerability assessment report should include the following:


    +   - Risk-mitigation techniques based on the criticality of the assets and results.

    +   - Findings related to any possible gap between the results and the system
    baseline definition—that is, deviations in any misconfiguration and discoveries
    made.

    +   - Recommendations to correct the deviations and mitigate possible vulnerabilities.


    High and medium vulnerabilities should be detailed within the report to include
    the following:


    +   - The name of the vulnerability.

    +   - The date of discovery.

    +   - The score based on common vulnerabilities and exposures (CVE) databases.

    +   - A detailed description of the vulnerability.

    +   - Details of the affected systems and the process for correcting the vulnerability.

    +   - A proof of concept (PoC) of the vulnerability for the system, if possible.

    +   - A blank field for the owner of the vulnerability, the time it took to correct
    the vulnerability, the next revision and countermeasures between the identification
    of the vulnerability and the final solution.


    # Prioritize vulnerability remediation


    Stakeholders should prioritize the order in which the organization addresses vulnerability
    remediation. The technology organization is responsible for monitoring security
    sources for vulnerability announcements, patch and non-patch remediations and
    threats that correspond to the software within the organizational inventory. A
    variety of sources should be monitored to ensure that the appropriate stakeholders
    are aware of all newly discovered vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# ## Types of security concerns


    The technology organization is responsible for monitoring vulnerabilities, remediations
    and threats:


    +   - Vulnerabilities are software flaws or misconfigurations that cause a weakness
    in the security of a system and can be exploited by a malicious entity to violate
    policies.


    +   - Remediations include three primary methods:


    +   - Installation of a software patch.


    +   - Adjustment of a configuration setting.


    +   - Removal of the affected software.


    +   - Threats are capabilities or methods of attack developed by malicious entities
    to exploit vulnerabilities and potentially cause harm to a computer system or
    network. Threats usually take the form of exploit scripts, worms, viruses, rootkits
    and Trojan horses.


    System administrators should monitor systems under their control running software
    that is not contained in the organizational inventory for vulnerabilities, remediations
    and threats.


    # ## Monitor vulnerabilities, remediations and threats


    There are several types of resources available for monitoring the status of vulnerabilities,
    remediations and threats. Each type of resource has its own strengths and weaknesses.


    It is recommended that more than one type of resource be used to ensure accurate
    and timely knowledge. The most common types of resources are as follows:


    +   - Vendor websites and mailing lists.


    +   - Third-party websites.


    +   - Third-party mailing lists and newsgroups.


    +   - Vulnerability scanners.


    +   - Vulnerability databases.


    +   - Enterprise patch management tools.


    An organization can monitor vulnerabilities, remediation and threats using the
    following resource types:


    +   - Enterprise patch management tool to obtain all available patches from supported
    vendors.


    +   - Vendor security mailing lists and websites to obtain all available patches
    from vendors not supported by the enterprise patch management tool.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '+   - The vulnerability database is the National Vulnerability Database or
    mailing list to obtain immediate information on all known vulnerabilities and
    suggested remediations.

    +   - Third-party vulnerability mailing lists—that is, the US-CERT Cybersecurity
    Alerts that highlight the most critical vulnerabilities.


    After the initial assessment of a new vulnerability, remediation or threat, the
    technology team should continue to monitor updates and new information.


    # Prioritize vulnerability remediation


    The technology group should consider each threat and its potential impact on the
    organization when setting priorities for vulnerability remediation. This evaluation
    includes the following:


    +   - Determine the significance of the threat or vulnerability.

    +   - Establish which systems are vulnerable or exposed, with a focus on systems
    that are essential for the operation and other high-priority systems.

    +   - Evaluate the impact on the systems, organization and network if the vulnerability
    is not removed and is exploited.

    +   - Determine the existence, extent and spread of related worms, viruses or
    exploitation.

    +   - Ascertain whether malicious code has been published and the level of distribution.

    +   - Determine the damage caused, such as system access, information disclosure,
    arbitrary code execution or denial of service.

    +   - Determine the risks involved in applying patch or non-patch remediation.

    +   - Identify whether the remediation will affect the functionality of other
    software applications or services through research and testing.

    +   - Establish what degree of risk is acceptable.


    # Maintain a specific remediation database


    The technology group should maintain a database of remediations to be applied
    within the organization. Enterprise patch management tools usually supply a relevant
    database. The technology group may also manually maintain a separate database
    of IT technologies that are not supported by the patch management tool.


    # Conduct generic testing of remediations


    The technology group should test patches and non-patch remediations on IT devices
    that use standardized configurations. System administrators are responsible for
    testing patches and non-patch remediations to mitigate'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'vulnerabilities and threats identified for software that is not monitored by
    the technology group. Remediation testing guidelines may include the following:


    +   Most vendors provide some type of authentication mechanism. A downloaded patch
    should be checked against any of the authenticity methods provided by the vendor,
    including cryptographic checksums, signatures and digital certificates.


    +   A virus scan should also run on all patches before installation. Before running
    the scan, the system administrator should ensure that the virus signature database
    in the anti-virus programme is up to date.


    +   Patches and configuration modifications should be tested on non-production
    systems since remediation can easily produce unintended consequences.


    +   Installing one patch might also inadvertently uninstall or disable another
    patch. If there is a dependency, it is important to ensure that patches are installed
    in the correct sequence.


    +   Testing should be performed on a selection of systems that accurately represent
    the configuration of the systems in deployment, since so many possible system
    configurations exist that a vendor cannot possibly test all of them.


    # Deploy vulnerability remediations


    An organization should deploy vulnerability remediations to applicable systems,
    to include those that are not at immediate risk of exploitation. Vulnerability
    remediation should also be incorporated into the organization’s standard builds
    and configurations for hosts.


    There are three primary methods of remediation that can be applied to an affected
    system.


    # Security patch installation


    +   Applying a security patch, also called a fix or hotfix, repairs the vulnerability
    since patches contain code that modifies the software application to address and
    eliminate the problem.


    +   Patches downloaded from vendor websites are typically the most up to date
    and are usually free of malicious codes.


    # Configuration adjustment


    +   Adjusting how an application or security control is configured can effectively
    block attack vectors and reduce the threat of exploitation. Common configuration
    adjustments include disabling services and modifying privileges as well as changing
    firewall rules and modifying router access controls.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '+   - Settings of vulnerable software applications can be modified by adjusting
    file attributes or registry settings.


    # ## Software removal


    +   - Removing or uninstalling the affected software or vulnerable service eliminates
    vulnerability and any associated threat. This is a practical solution when an
    application is not needed on a system.

    +   - Determining how the system is used, removing unnecessary software and services,
    and running only what is essential for the system’s purpose are recommended security
    practices.


    Prior to installing a patch, administrators should ensure that a current full
    backup of the system being patched is maintained. Regardless of whether remediation
    involves automated patching or manual updates, system administrators may believe
    that the disadvantages of a suggested remediation outweigh its benefits. They
    may not wish to install the patches or perform configuration modifications. The
    reasons behind these decisions should be documented and communicated to the technology
    team and then to the appropriate management for approval.


    # ## Assess risk


    The risk of delaying remediation must be weighed carefully. Risk assessments that
    determine the amount of risk to the network are another way to help determine
    the state of vulnerability management within the enterprise.


    Technology groups can use risk-assessment information to determine which assets
    should be patched first or whether any systems can afford to absorb the risk associated
    with them. However, it is difficult to rate the risk of a new vulnerability without
    knowing how this risk will affect the network-connected assets.


    When assessing the risk, the technology team should consider the issues discussed
    in the following sections.


    # ## Threat level


    Do(es) the system(s) that require remediation face numerous and/or significant
    threats? For example, public web servers and most federal government organizations
    may face high threat levels.


    # ## Risk of compromise


    What is the likelihood that a compromise will occur? If the vulnerability is easy
    to exploit, then remediation should be applied swiftly.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Consequences of compromise


    What are the consequences of compromise? If the system is critical or contains
    sensitive data, then remediation should be performed immediately.

    This holds true even for non-critical systems if a successful exploitation would
    lead to an attacker gaining full control of the system.


    # Distribute vulnerability and remediation information to local administrators


    The technology team is responsible for informing local administrators about vulnerabilities
    and remediations that correspond to software packages within the team’s scope
    that are in the organizational software inventory.


    # Patch management


    Widespread manual patching of computers is ineffective, as the number of patches
    that need to be installed is significant, and it is impractical for individuals
    to keep systems up to date with this method. While patching and vulnerability
    monitoring can often appear to be an overwhelming task, consistent mitigation
    of organizational vulnerabilities can be achieved through a tested and integrated
    patching process that makes efficient use of automated patching technology. Enterprise
    patch management tools allow the technology team or a group that it works closely
    with to automatically and quickly push patches out to many computers.


    ![](img/8bcb92bad95ddd74218ba966f2798d54_43_0.png)


    Figure 4.2 The patch management lifecycle (ManageEngine, 2020).'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# **Deploy enterprise patch management tools using a phased approach**


    Implementing patch management tools in phases allows process and user communication
    issues to be addressed with a small group before deploying the patch application
    consistently. Most organizations deploy patch management tools first to standardized
    desktop systems and single-platform server farms of similarly configured servers.
    Once this has been accomplished, organizations should address the more difficult
    issue of integrating multi-platform environments, non-standard desktop systems,
    legacy computers and computers with unusual configurations. It may be necessary
    to use manual methods for OSs and applications not supported by automated patching
    tools as well as some computers with unusual configurations. For these types of
    systems, there should be a written and implemented procedure for the manual patching
    process and the technology group should coordinate local administrator efforts.


    # **Perform automated deployment of patches**


    The technology group should automatically deploy patches to IT devices using enterprise
    patch management tools. Once a patch management technology has been selected,
    an organization’s IT administrators are responsible for designing a solution architecture,
    performing testing, deploying and securing the solution and maintaining operations
    and security.


    # **Technology security**


    Deploying enterprise patch management tools within an enterprise strengthens the
    security posture in an organization through vulnerability reduction. These tools
    usually increase security specifically when they contain built-in security measures
    to protect against security risks and threats. The following are some risks associated
    with using these tools:


    +   - A patch may have been altered (inadvertently or intentionally).

    +   - Credentials may be misused.

    +   - Vulnerabilities in the solution components (including agents) may be exploited.

    +   - An entity could monitor tool communications to identify vulnerabilities
    (particularly when the host is on an external network).


    The organization can reduce these risks by applying standard security techniques
    that should be used when deploying any enterprise-wide application.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Examples of countermeasures include the following:


    +   - Keep the patching solution components tightly secured, including patching
    them.

    +   - Encrypt network communications.

    +   - Verify the integrity of patches before installing them—that is, use checksums.

    +   - Test patches before deployment to identify corruption.


    # Patch management process


    The fundamental considerations that an organization should integrate into its
    patch management process are discussed in the following sections.


    # Discovery


    The technology group ensures that the organization has a comprehensive, accurate
    network inventory that includes the following:


    +   - Understanding the types of devices.

    +   - OSs.

    +   - OS versions.

    +   - Third-party applications.


    # Standardization and categorization


    The technology group should implement a standardized approach to ensure, when
    possible, that devices run the same OS, use the same hardware, are configured
    in the same manner and run the same applications. The technology group should
    segment managed systems and/or users according to risk and priority based on the
    following aspects:


    +   - Machine types—that is, server, laptop, etc.

    +   - OSs.

    +   - OS versions.

    +   - User roles.


    # Patch management policy creation


    The technology group should create patching criteria by establishing what will
    be patched, when, and under what conditions. For example, the following should
    be considered:'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   - The frequency of the patching cycle—that is, the patching schedule for
    laptop end users may be weekly, while patching for servers may be less frequent
    and more manual.

    +   - The patching rollout cycle—that is, browser updates versus OS updates, critical
    versus non-critical updates.

    +   - Identification of maintenance windows to avoid disruption—that is, consider
    time zones for “follow the sun” patching.

    +   - Creation of exceptions.


    # Monitor new patches and vulnerabilities


    The technology group should implement a process to effectively:


    +   - understand vendor patch release schedules and models and identify reliable
    sources for timely vulnerability disclosures and

    +   - create a process for evaluating emergency patches.


    # Patch testing


    The technology group should ensure that an appropriate test environment is in
    place to


    +   - test that patches are working appropriately before production deployment,

    +   - create backups for easy rollback if necessary,

    +   - validate successful deployment and

    +   - monitor incompatibility or performance issues.


    # Configuration management


    The technology group should have a mechanism in to place to capture any changes
    made throughout the patching process.


    # Patch deployment


    Patch deployment should be well documented, with a planned outline for the changes
    that will occur once the patch is applied. The technology group should have an
    automated patch management process that facilitates scheduled regular update scans
    and ensures that patches are applied during non-peak periods. Clear fallback policies
    should be in place for patch deployment issues.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Patch auditing


    The technology group should have a patch audit process in place to identify any
    failed or pending patches, including continuous monitoring for any unexpected
    incompatibility or performance issues.


    # Reporting


    The technology group should have a mechanism in place to produce a patch compliance
    report when required. This includes documenting risk acceptance and any exceptions
    that may occur.


    # Review, improve and repeat


    The technology group should have an established cadence for repeating and optimizing
    the patch management process, including the following:


    +   - Phasing out or isolating any outdated or unsupported machines.

    +   - Reviewing applicable policies.

    +   - Revisiting exceptions to verify whether they still apply or are necessary.


    # Verify vulnerability remediation through network and host vulnerability scanning


    The technology group and system administrators should verify that they have successfully
    remediated or mitigated vulnerabilities as intended.


    The technology group should confirm that the remediations have been conducted
    appropriately to avoid a security incident or unplanned downtime. This can be
    accomplished by several methods:


    +   - Verify that the files or configuration settings that the remediation was
    intended to correct have been changed as stated in the vendor’s documentation.

    +   - Scan the host with a vulnerability scanner to detect known vulnerabilities.

    +   - Review patch logs to verify that the recommended patches were installed
    properly.

    +   - Employ exploitation procedures or code to attempt to exploit the vulnerability—that
    is, perform a penetration test.


    Generally, exploitation tests involve launching actual attacks within a network
    or on a host, and this type of testing should be performed only on non-production
    equipment for certain vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Review the patch log


    Log files keep track of the history of a system. Patch logs can assist the technology
    group, as well as system administrators, with tracking and verifying installed
    patches. Using patch logs to monitor an organization’s systems helps achieve consistency
    and compliance with the remediation plan.


    An organization’s patch logs provide the following capabilities:


    +   - Identify which patches are installed on a system, allowing easy confirmation
    that the appropriate set of patches has been applied.

    +   - Ensure that patches are applied consistently across the organization through
    a comparison of log files.

    +   - Verify that a patch has been installed properly.

    +   - Determine whether the patch or a subsequent update improperly removed or
    damaged a previous patch.


    # Check patch levels


    An organization should consider verifying the patch levels of hosts. In most deployments,
    each host runs an agent that monitors various characteristics, such as OSs and
    application patches and anti-virus updates. When the host attempts to connect
    to the network, a network device such as a router requests information from the
    host’s agent. If the host does not respond to the request or the response indicates
    that the host is not fully patched, the network device causes the host to be placed
    on a separate virtual local area network (VLAN). This allows the organization
    to update the unpatched hosts while severely restricting functionality. Once a
    host on the VLAN has been fully updated, it is moved automatically from the VLAN
    to the organization’s regular network. The VLAN strategy can be particularly helpful
    for ensuring that mobile hosts are fully patched.


    # Vulnerability remediation training


    An organization should train administrators in how to apply vulnerability remediations.
    In organizations that rely on end users to patch computers, the technology group
    must also train users in this function.


    # Deploy security metrics


    This section discusses the development of patch and vulnerability metrics in the
    context of measuring characteristics per system. The word “system” here refers
    to a set of IT assets, processes, applications and related resources that are
    under the same direct management and budgetary control and have the'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'same function or mission objective, have essentially the same security needs
    and reside in the same general operating environment.


    # Type of patch and vulnerability metrics


    There are three main categories of patch and vulnerability metrics:


    +   - Susceptibility to attack.

    +   - Mitigation response time.

    +   - Cost.


    An organization’s susceptibility to attack can be approximated by several measurements.
    An organization can measure the following:


    +   - Number of patches needed.

    +   - Number of vulnerabilities.

    +   - Number of network services running on a per-system basis.


    These measurements should be taken individually for each computer within the system,
    and the results should then be aggregated to determine the system-wide results.
    Both raw results and ratios—that is, the number of vulnerabilities per computer—are
    important. The raw results help reveal the overall risk that a system faces because
    the more vulnerabilities, unapplied patches and exposed network services exist,
    the greater the chance that the system will be penetrated. Large systems consisting
    of many computers are thus inherently less secure than smaller similarly configured
    systems.


    The organization should consider using ratios when comparing the effectiveness
    of the security programmes of multiple systems. Ratios allow effective comparisons
    between systems. Both raw results and ratios should be measured and published
    for each system, as appropriate, since both are useful and serve different purposes.
    The initial measurement approach should not consider system security perimeter
    architectures—that is, firewalls that would prevent an attacker from directly
    accessing vulnerabilities on system computers. The default position should be
    to secure all computers within a system even if the system is protected by a strong
    security perimeter.


    Because most systems will not be fully secured, for a variety of reasons, the
    measurement should then be recalculated while factoring in the system’s security
    perimeter architecture. This will provide a meaningful measurement of a system’s
    actual susceptibility to external attackers. For example, this second measurement
    should not count vulnerabilities, network services or needed patches on a computer
    if they cannot be exploited through the system’s main firewall.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'While the initial measurement of a system’s susceptibility to attack should
    not consider the system security perimeter architecture, it may be desirable to
    consider an individual computer’s security architecture. For example, vulnerabilities
    exploitable by network connections might not be counted if a computer’s personal
    firewall would prevent such exploitation attempts.


    # Number of patches


    It is natural for organizations that have deployed enterprise patch management
    tools to measure the number of patches needed per system since these tools automatically
    provide such data. The number of patches needed is of some value in approximating
    an organization’s susceptibility to attack, but the effectiveness of this measurement
    is limited because a particular security patch may fix one or many vulnerabilities,
    and these vulnerabilities may be of varying levels of severity. In addition, vulnerabilities
    for which there are no patches are often published. These vulnerabilities intensify
    the risk to organizations but cannot be captured by measuring the number of patches
    needed. The quality of this measurement can be improved by factoring in the number
    of patches rated critical by the issuing vendor and comparing the number of critical
    and non-critical patches.


    # Number of vulnerabilities


    The number of vulnerabilities that exist per system is a better measure of an
    organization’s susceptibility to attack. This metric would be included as a reporting
    output from the organization’s vulnerability scanning tools. As with measuring
    patches, the organization should consider the severity ratings of the vulnerabilities
    and group the number of vulnerabilities at each severity level or range of severity
    levels. The true impact of each vulnerability can be determined only by reviewing
    it in the context of the organizational environment. In addition, the impact of
    a vulnerability on a system depends on the network location of the system; that
    is, when the system is accessible from the Internet, vulnerabilities are usually
    more serious.


    # Number of network services running on a per-system basis


    The concept behind this metric is that each network service represents a potential
    set of vulnerabilities, so there is an enhanced security risk when systems run
    additional network services.


    On a large system, this measurement can indicate susceptibility to network attacks,
    both current and future. It is also useful to compare the number of network services
    running between multiple systems to identify systems that are doing a better job
    at minimizing their network services.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Measuring the effectiveness of patch and vulnerability management


    Patch and vulnerability metrics fall into three categories: susceptibility to
    attack, mitigation response time and cost, including a metric for the business
    impact of programme failures. The emphasis on patch and vulnerability metrics
    for a system or IT security programme should reflect the patch and vulnerability
    management maturity level. For example, attack susceptibility metrics such as
    the number of patches, vulnerabilities and network services per system are generally
    more useful for a programme with a low maturity level than for one with a high
    maturity level. Organizations should document what metrics will be used for each
    system and the details of each of those metrics. Realistic performance targets
    for each metric should be communicated to system owners and system security officers.
    Once these targets have been achieved, more ambitious targets can be set. It is
    important to carefully raise the bar for patch and vulnerability security to avoid
    overwhelming system security officers and system administrators.


    # Mitigation response time


    It is also important to measure how quickly an organization can identify, classify
    and respond to a new vulnerability and mitigate the potential impact. There are
    three primary response time measurements:


    +   - Vulnerability and patch identification.

    +   - Patch application.

    +   - Emergency security configuration changes.


    # Response time for vulnerability and patch identification


    This metric measures how long it takes the technology group to learn about a new
    vulnerability or patch. The timing should begin from the moment the vulnerability
    or patch is officially announced. This measurement should be made for a sampling
    of different patches and vulnerabilities and should include the various resources
    utilized by the technology group to gather information.


    # Response time for patch application


    This metric measures how long it takes to apply a patch to all relevant IT devices
    within the system. The timing should begin from the moment the technology group
    becomes aware of the patch. This measurement should be made where it is relatively
    easy for the technology group to verify patch installation.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'This measurement should include the individual and aggregate time spent on
    the following activities:


    +   - Patch analysis.

    +   - Patch testing.

    +   - Configuration management process.

    +   - Patch deployment effort.


    Verification can be performed using enterprise patch management tools or through
    vulnerability scanning, both host and network based. It may be useful to make
    this measurement on both critical and non-critical security patches.


    # Response time for emergency configuration changes


    This metric applies in situations where a vulnerability exists that must be mitigated
    but where there is no patch. In such cases, an organization should utilize the
    change management process that enables emergency configuration changes. The metric
    should measure the time it takes from the moment the technology group learns about
    the vulnerability to the moment when an acceptable workaround has been applied
    and verified. The following list contains examples of emergency processes that
    can be timed:


    +   - Firewall or router configuration changes.

    +   - Network disconnection.

    +   - Intrusion prevention device activation or reconfiguration.

    +   - E-mail filtering rule addition.

    +   - Computer isolation.

    +   - Emergency notification of staff.


    # Targeting metrics towards programme maturity


    The emphasis on patch and vulnerability metrics for a system or IT security programme
    should reflect the patch and vulnerability management maturity level. A programme
    with a low maturity level is likely to have a system with high susceptibility
    to attack, and metrics such as the vulnerability ratio should be of the highest
    priority. More mature programmes regularly fix all vulnerabilities; therefore,
    attack susceptibility metrics are less useful. These programmes should focus on
    metrics related to their response time to emerging threats and vulnerabilities
    and optimizing costs.


    While it is true that all metrics are important for programmes at all maturity
    levels, this discussion is intended to prioritize the implementation of metrics.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'NIST SP 800–26, Security Self-Assessment Guide for Information Technology Systems,
    defines maturity levels for various aspects of an IT security programme:


    +   - Level 1 – Control objectives have been documented in a security policy.

    +   - Level 2 – Security controls have been documented as procedures.

    +   - Level 3 – Procedures have been implemented.

    +   - Level 4 – Procedures and security controls have been tested and reviewed.

    +   - Level 5 – Procedures and security controls have been fully integrated into
    a comprehensive programme.


    # Patch and vulnerability metrics table


    The patch and vulnerability metrics table should be analysed on a per-system basis
    (Table 4.1).


    # Table 4.1 The metrics for patch and vulnerability management.


    | Metrics Name | Unit | Target Maturity Level (NIST) |

    |---|---|---|

    | Vulnerability ratio | Vulnerability/host | 3 |

    | Unapplied patch ratio | Patches/host | 3 |

    | Network services ratio | Network services/host | 3 |

    | Response time for vulnerability and patch identification | Time | 4 |

    | Patch response time (critical) | Time | 4 |

    | Patch response time (non-critical) | Time | 4 |

    | Emergency configuration response time | Time | 4 |'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 5 Risk-management practice – system development lifecycle


    ![](img/8bcb92bad95ddd74218ba966f2798d54_54_0.png)


    Figure 5.1 Elements of the system development lifecycle (SmartSheet, 2020).


    # Secure system development lifecycle


    A secure system development lifecycle (SDLC) process ensures that security assurance
    activities, such as penetration testing, code review and architecture'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'analysis, are an integral part of the development effort. Activities within
    each phase assist in the mitigation of vulnerabilities and management of risk.


    # Planning


    In the first phase of the system development process, the need for a new system
    to achieve the business''s strategic objectives is identified. This is a preliminary
    plan or a feasibility study for acquiring the resources to modify or improve a
    service. The purpose of this step is to determine the scope of the problem and
    identify solutions. The resources, costs, time and benefits should be considered
    at this stage.


    The feasibility study should incorporate the following:


    +   - Assessment of the impact on the existing environment.

    +   - Staff development and resource requirements.

    +   - Project development cost analysis.

    +   - Programme maintenance costs.

    +   - Evaluation of alternative project implementation approaches, such as build
    versus buy and outsourcing.

    +   - Description of the proposed solution.

    +   - Risks associated with the proposed solution.

    +   - Benefit analysis, including cost reduction, error reduction, new customers
    and improved customer service.

    +   - Involvement of information security teams to ensure that appropriate security
    concerns have been incorporated into the feasibility study.


    # Requirements


    This phase defines how an organization will focus on the source of its problem
    or the need for a change. In the event of a problem, possible solutions should
    be submitted and analysed to identify the most appropriate ways to address the
    goals of the project.


    Business and operational requirement specifications should be developed to ensure
    that the project requirements that are necessary to support business objectives
    are understood. Users and development teams generally lead this process. The business
    requirements should consider the following issues:


    +   - Data that are required to support the system or application and how they
    relate to other data.

    +   - Frequency of use of the system or application.

    +   - Required response time for online processing.

    +   - Function relations to and dependencies on other components.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - Identification of applicable legal or regulatory requirements or constraints.

    +   - Anticipated life span of the system or application.


    Operational requirements should consider the following issues:


    +   - Security requirements.

    +   - Contingency requirements.

    +   - Distributed and centralized processing requirements.

    +   - Data input strategy and responsibility.

    +   - Data retention requirements.

    +   - Output distribution requirements.

    +   - Expected transaction volumes, including project transaction growth.

    +   - Critical system performance requirements.


    Information security teams should be involved throughout the business and operational
    requirements phase to ensure that security concerns are properly addressed and
    reflected in the requirements document. The risk-assessment methodology is performed
    mainly during this phase to provide early security perspectives for the project
    team.


    # Design


    This phase involves describing the necessary specifications, features and operations
    that will satisfy the functional requirements of the proposed system. It includes
    the ability to transpose the business and operational requirements into functional
    requirements to reflect the anticipated user experience associated with the system
    or application. Functional specifications reflect the user’s perspective, which
    has been translated into the preliminary design. For maintenance and enhancement
    activities, the focus is on using a before/after description to document what
    will change.


    Functional specifications should include the following:


    +   - Data flow diagrams: Tracing data through all their processing points.

    +   - Data definitions: Defining data, data relationships and naming conventions.

    +   - Screen definitions: Defining input fields and checking ranges.

    +   - Inputs: Sources of inputs, types of data and description of data.

    +   - Report definitions: Describing reports, the data to be contained in each
    report, how the data values are derived and the users who utilize specific reports.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   Control and security requirements: Inputting editing requirements, audit
    log trails for critical data from the point of origin to the point of disposition
    and audit log trails for the use of privileges and identifying critical processing
    areas.


    +   System interface requirements: Identifying interaction points between this
    system and other systems, anticipated inputs and outputs, response time expectations
    and other intersystem dependencies.


    +   Backup, restart and recovery: Determining the frequency of backup, rationale
    behind backup, backup retention requirements, restart requirements specifying
    how the application should be restarted and recovery requirements.


    +   Contingency requirements: Conducting an analysis to determine how long the
    application can be unavailable before the business is affected and identifying
    datasets, software and other items that need to be restored at an offsite processing
    centre.


    +   Hardware requirements: Determining communication requirements, disk space
    and processing equipment.


    +   Service-level requirements: Determining uptime requirements, required response
    times, critical windows, deadlines for input and deadlines for report distribution.


    +   Capacity requirements: Determining transaction volumes and expected growth.


    +   Conversion requirements: Developing a method to be used to create data on
    the new system, a method to reconcile data during conversion, cutover requirements
    and a process for verifying converted data.


    During the functional specifications process, information security teams should
    generally be involved in supporting the project team’s efforts to capture the
    preliminary design and functional description of the system or application. Functional
    specifications should include security-related information such as technical features—that
    is, access controls and operational practices (i.e., awareness and training).
    Information security teams should review and provide feedback on this document
    prior to the detailed design phase.


    # Development


    This phase entails engaging the programmer, network engineer and/or database developer
    in the project. The work includes using a flow chart to ensure that the process
    is organized. The development phase signifies the end of the initial section of
    the process and the start of code development. Specifically, the code is produced
    according to the requirements produced in the design phase.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'In the development phase, the system’s or application’s security features are
    developed, configured and enabled, and the programme specifications are used to
    describe the programme logic and processing requirements. The programme specifications
    are developed as part of this phase prior to the commencement of programming.
    These specifications provide the requirements necessary to determine the steps
    needed to code the programmes.


    Information security teams should retain the right to perform source code reviews
    for critical aspects of the system or application, including user authentication,
    authorization and financial transactions. Source code reviews should have an enhanced
    focus on code provided by third parties, including offshore development organizations.


    # Testing


    This phase involves system integration and system testing of programmes and procedures
    and is normally carried out by a quality assurance (QA) professional to determine
    whether the proposed design meets the initial set of business goals. Testing may
    be repeated, specifically to check for errors, bugs and interoperability, and
    should be performed until the end user finds the results acceptable. Another part
    of this phase is verification and validation, both of which will help ensure successful
    completion.


    # Unit testing


    Unit testing is an integral part of the agile software development process that
    aims to identify and resolve bugs through a review of isolated sequences of code.
    The unit test criteria should include the following:


    +   - File updating, merging and sorting.

    +   - All decision logic.

    +   - All system or application interfaces and integration testing.

    +   - Invalid transactions and the related error-handling routines.

    +   - Restart/recovery routines.

    +   - Stress testing.

    +   - Error conditions.

    +   - Page counters and overflow headers.


    # System testing


    During the system testing phase, code development for the project is completed,
    and testing is performed to ensure that all functions work as required.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The system test environment is typically shared among all programmers with
    strictly controlled changes to the environment. System test criteria should include
    the following:


    +   - Verification that all functionality is performed as specified by the functional
    and design specifications.

    +   - Programme interfaces.

    +   - Other system interfaces.

    +   - Restart and recovery procedures.

    +   - Transaction validation and rejection.

    +   - Transaction processing cycles.

    +   - System or application performance criteria.

    +   - System or application output generation.

    +   - Stress testing.

    +   - Error handling.

    +   - Input/output verification.

    +   - Procedures and restrictions regarding the use of production data.

    +   - Complete and accurate audit log trails.

    +   - Security testing—that is, authentication and authorization.

    +   - System or application security testing—that is, ethical hacking.

    +   - Code reviews of critical sections of code and externally developed code.


    Where possible, system or application security testing should be executed using
    an automated testing tool. This will support the creation of tests and procedures
    that can be used for regression testing during future enhancements.


    # Parallel test plan


    Where an existing system or application is in place, parallel testing ensures
    that the functions within a simulated production environment are equivalent to
    the existing process.


    During the system testing phase, information security teams should be deeply involved
    in reviewing the security tests written by the project/test team and validating
    the security testing results. Security teams may also elect to perform a penetration
    test to ensure that the development team considers common security vulnerabilities.


    # Deployment


    Deployment involves the actual installation of the newly developed system and/or
    application. This step puts the project into production by moving the data and
    components from the old system into the new system through a direct'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'cutover. While this can be a complicated transition, the cutover typically
    occurs during off-peak hours, thus minimizing the risk.


    The cutover/installation plan documents the transition from an old system or application
    to a new one. This plan should address any migration of production data that has
    not been performed. It should also address the installation activities and coordination
    with system users. Fallback procedures should be defined in the event of an erroneous
    transition.


    # Maintenance


    This phase involves maintenance and requires regular updates. During this step,
    end users can refine the system to boost performance, add new capabilities or
    meet additional user requirements. It also includes a post-implementation review,
    conformance and defect tracking.


    # Post-implementation review


    A post-implementation review ensures that the system or application is operating
    at a satisfactory level. This review involves soliciting user feedback on the
    overall effectiveness of the project and the achievement of the requirements and
    timelines. This information provides valuable insight for future projects and
    identifies potential shortcomings in the SDLC.


    Security teams should participate in the post-implementation review to confirm
    that the security capabilities deployed are satisfactory.


    At this time, the documentation of all security decisions made in support of the
    system or application is finalized, and variances from existing security policies
    and standards are noted. Where variances are permitted on a temporary basis, tracking
    is initiated to ensure that they are resolved in accordance with an agreed-upon
    schedule.


    # Conformance and defect tracking


    The project management process should ensure conformance with all aspects of the
    SDLC. In this context, conformance refers to ensuring that the documents itemized
    earlier are created, reviewed and approved before the next phase of the SDLC.


    Any modification to a document, once approved, should be reviewed, and all impacted
    groups should agree on the change. Defect-checking tools should be used to monitor
    and track identified defects during all testing phases. This provides a basis
    for making informed decisions regarding the status and resolution of any defects.'
