- raw: 'Quality assurance aims to provide confidence the quality requirements will
    be met. Most standards (e.g., ISO, NIST, and C2M2) guide organizations to include
    quality assurance and control activities. Organizations provide training, templates,
    checklists, and processes to deliver the right quality. Then, we perform the work
    such as configuring a virtual server by following a checklist. After the work
    is performed, we conduct quality control: finding and fixing defects. Again, we
    rely upon training, templates, and checklists and follow processes to determine
    whether the right quality was delivered. We have an A-B-C approach to quality
    management: quality Assurance, Before, quality Control. The quality management
    process is seen in leading standards across industries; therefore, applying this
    simple quality management approach, you will likely be compliant with most quality
    domains, in most standards, most of the time. Expect regulators and insurance
    companies to request regular audits for cybersecurity specifically and technology
    generally. Auditing can be a type of quality control project (e.g., NIST Framework
    auditing and compliance process). Leading an audit project would be suitable for
    developing new project management capabilities and increasing one’s holistic understanding
    of the technology ecosystem.


    ![images](images/fig4.2.jpg)


    ***Figure 4.2 Quality management process***


    Cybersecurity Frameworks


    A cybersecurity framework is a collection of standards, guidelines, and best practices
    to manage cybersecurity risks. Frameworks can improve reliability and predictability.
    Two leading cybersecurity standards are briefly presented with linkages to the
    vital role project management has in meeting these standards:


    1. NIST Framework for Improving Critical Infrastructure Cybersecurity;


    2. ISO 27000 Series for Information Security Controls.


    These standards are widely adopted, and their influence is growing. They include
    an entire strategy life cycle from projects to operations with a continuous improvement
    orientation bringing new projects, new opportunities, and new services. Organizations
    use frameworks to identify areas to strengthen or new processes to implement.
    Organizations that follow these frameworks may be better positioned to manage
    the increasing demand for cybersecurity projects following continuous improvement
    practices.


    ***National Institute of Standards and Technology Cybersecurity Framework***


    The highly regarded NIST Framework for Improving Critical Infrastructure Cybersecurity
    is intended to protect critical infrastructures like transport, health, energy,
    food, water, communications, banking, and finance (National Institute of Standards
    and Technology 2018, 5). The NIST Framework guides cybersecurity for critical
    infrastructures. It can be used by any organization striving for better cybersecurity:
    “While this document was developed to improve cybersecurity risk management in
    critical infrastructure, the Framework can be used by organizations in any sector
    or community. The Framework enables organizations—regardless of size, degree of
    cybersecurity risk, or cybersecurity sophistication—to apply the principles and
    best practices of risk management to improving security and resilience” (National
    Institute of Standards and Technology 2018, 5).


    The basics of cybersecurity defense are to protect the organization’s assets through
    five functions and related categories ([Figure 4.3](#Chapter04.xhtml#fig4.3)).
    You may be asked to participate and lead projects in any of these areas; the sources
    of cybersecurity projects are vast.


    ![images](images/fig4.3.jpg)


    ***Figure 4.3 NIST Cybersecurity Framework: functions and categories***


    The categories reveal the scope of cybersecurity objectives and are supported
    by 108 subcategories (see [Appendix 1](#Appendix01.xhtml#ap1) for an example of
    the framework core). Within this framework of functions, categories, and subcategories,
    we better understand where we are today and where our organizational improvement
    targets lie. The NIST Framework includes implementation tiers designed to provide
    a path toward cybersecurity maturity and target achievement ([Figure 4.4](#Chapter04.xhtml#fig4.4),
    after National Institute of Standards and Technology 2018, 15–17).


    ![images](images/fig4.4.jpg)


    ***Figure 4.4 NIST cybersecurity capability maturity levels***


    Organizations use the NIST Framework to document their current profile of cybersecurity
    ([Figure 4.5](#Chapter04.xhtml#fig4.5), after PMI 2021, 6) and then initiate projects
    to take them to the target profile (e.g., address gaps in Tier 3, or progress
    from Tier 3 to Tier 4, or to comply with an external agency’s NIST-based guidelines).
    Thus, we can expect projects to improve the organization’s capabilities within
    these categories and from organizations implementing projects to mature through
    the NIST maturity tiers. *Shields Up* will help you plan, manage, and deliver
    projects to progress through the NIST maturity tiers.


    ![images](images/fig4.5.jpg)


    ***Figure 4.5 Cybersecurity improvement through projects***


    The NIST Framework is aligned with project management, and following a formal
    project management method helps you comply with the Framework. The NIST Framework
    includes a project-oriented section—Establishing or Improving a Cybersecurity
    Program—bringing the organization to its target profile through a project delivery
    approach (National Institute of Standards and Technology 2018, 21–22). This book
    helps you plan and implement NIST Framework-related cybersecurity projects.


    ***ISO 27001: Information Security Management***


    The ISO 27000 (ISO 2013b) is a set of information security standards to plan,
    implement, maintain, and improve the organization’s information security management
    system (see [Figure 4.6](#Chapter04.xhtml#fig4.6) for an overview of the ISO 27000
    standard). Often, organizations begin with an informal and disorganized approach
    to cybersecurity and then adopt a standard like ISO 27000 to manage information
    security threats systematically (ISO 2013a, 1–32).


    The ISO 27001 requirements are ordered into 114 controls where each addresses
    a specific cybersecurity risk (e.g., securing application services on public networks).
    These controls are categorized into 14 annexes/groups (beginning with Annex 5)
    seen in [Figure 4.6](#Chapter04.xhtml#fig4.6). These controls guide organizations
    to improve their cybersecurity. Organizations can determine current and target
    profiles as part of their continuous improvement efforts.


    ![images](images/fig4.6.jpg)


    ***Figure 4.6 ISO information security standards***


    Of particular interest is control A.14 System Acquisition, Development, and Maintenance
    since it includes project management activities such as:


    A.14.2 Security in Development and Support Processes: design in cybersecurity;


    A.14.2.7 Outsourced Development: manage outsourced projects to ensure the right
    quality of cybersecurity;


    A.14.2.8 System Security Testing: test security functionality;


    A.14.2.9 System Acceptance Testing: test that the systems are built as designed,
    including information security testing and compliance with best practices.


    This book aligns with the project management-related controls in this standard.
    Therefore, following this project management approach will help you comply with
    ISO 27001 information security management.'
