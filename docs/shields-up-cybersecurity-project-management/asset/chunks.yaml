    ## 关于作者


    **Gregory J. Skulmoski**，BEd, MBA, PhD, CITP, FBCS，是一位经验丰富（且饱经风霜！）的项目经理，曾在澳大利亚、中东和加拿大领导过技术类和非技术类项目，项目总金额约
    100 亿美元。他是注册信息技术专业人士，也是英国计算机学会终身会员。Greg 拥有项目管理博士学位，其研究重点是转型和优化项目所需的技能。在读博士期间，他获得了项目管理协会（PMI）颁发的声誉卓远的
    Robert J. Yourzak 学金奖。Greg 是 PMI《项目管理知识体系指南》® 2000 年版修订团队的核心成员，该团队修订了最初的 PMI `PMBOK`
    指南（`PMI` 1996）。他还贡献于其他标准，如 PMI 的《工作分解结构实践标准》、组织项目管理成熟度模型以及项目经理能力开发框架。Greg 曾在 16
    多个国家向技术观众展示过他的研究，他的研究成果发表在顶级期刊和书籍上。


    Skulmoski 博士目前在邦德大学（Bond University）社会与设计学院教授项目创新管理。Greg 的教学重点是成功实施技术项目的实用流程和工具。Greg
    利用这些混合项目管理工具和流程获得了 2017 年中东首席信息安全官奖（项目风险管理奖）。Skulmoski 博士正在为 Business Experts
    Press 出版他的著作《防御：网络安全项目管理》（*Shields Up: Cybersecurity Project Management*，预计 2022
    年出版）。Greg 喜欢打鼓、潜水，以及和家人朋友一起在户外活动。


