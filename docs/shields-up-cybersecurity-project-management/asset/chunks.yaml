- raw: '2. **Exploration:** Think about the type of position you would like in 5 to
    10 years. Search online for job descriptions for those target positions to understand
    the ideal competency set. For example, if you aim to become a cybersecurity manager,
    search online for this position to understand better the types of experiences
    and competencies that people in these target positions possess.


    3. **Career action plan:** Conduct a gap analysis between your competencies and
    your target job (e.g., cybersecurity manager) competencies. Then, develop a plan
    to acquire the related experience, knowledge, and skills.


    Notice the similarity with cybersecurity maturity best practices? Complete a self-assessment,
    identify gaps, and develop an action plan to reach your targets. We follow this
    process in our organizations, and we can use it in our career planning.


    ***Technical Competence Development***


    We are offered a wide array of career development opportunities, but we should
    be strategic: think about the skills needed today and in the future. Continue
    your technical development and add skills in emerging technologies such as collaborative
    AI, multimodal interfaces (e.g., seeing, hearing, and touching), and secure distributed
    ledgers (e.g., blockchain). Think about preparing for tomorrow’s technical opportunities.
    Identify future technical skill shortages and begin learning about solutions such
    as machine learning. Create a plan to acquire these skills and knowledge; certifications
    are a natural pathway to technical competence. However, many certifications have
    a short-value period; some certifications can become obsolete as emerging technologies
    surpass the underlying technology. For example, Microsoft planned the retirement
    of MCSA, MCSD, and MCSE certifications as the cloud gains prominence and Azure
    certifications emerge (Foley 2021, 1). The crux is that maintaining competence
    through technical certifications is a never-ending pursuit.


    ***Nontechnical Competence Development***


    The pathway to senior IT roles is through a combination of technical and nontechnical
    excellence. When you search online for “what skills do CISOs need?” notice that
    the lists include very few technical skills! Most of the CISO skills are soft
    skills like effective communications, collaboration, and negotiation. Indeed,
    these are the types of skills robots lack! We discover that strategic planning
    and delivering innovation are frequently listed as essential skills; CISOs use
    project management tools and processes to bring strategy and other innovations
    to life. Therefore, your development journey through project management can bring
    you closer to the CISO and other senior roles.


    Many nontechnical growth opportunities range from formal studies in a Master of
    Business Administration (MBA) degree to training and certification opportunities
    like Lean Six Sigma and project management certifications (Ottmann and Skulmoski
    2020, 3). Certifications take less time to complete than university degrees and
    can fill in competencies gaps. The MBA degree is also variable where one can do
    a general MBA degree or an applied degree (e.g., MBA with Project Management Specialization
    or MBA in Innovation Management). Universities are improving their service value
    streams by offering many learning pathways like part-time studies, stackable degrees,
    and microcredentials to tailor learning to the individual student.


    Approach your nontechnical training from a holistic perspective; think about the
    service value stream and how organizations approve projects to deliver innovations
    to the end user. Organizations follow the project management process and then
    hand over the product or service to operations to manage and optimize the service
    ([Figure 1.1](#Chapter01.xhtml#fig1.1)). Therefore, a well-rounded cybersecurity
    professional will have training and education in both the project and operations
    side. A project-oriented certification like the PMP or PRINCE with an MBA degree
    or Lean Six Sigma credential will help prepare oneself for leadership roles. Again,
    look at the competencies of managerial and leadership positions listed by recruiters
    to understand the desired/target skill set.


    Undertaking career planning in conjunction with an annual performance review can
    better position you to not only score well on the assessment but help you stand
    out for your thoroughness. Few IT professionals look beyond a year or two in their
    career planning, and most have a narrow focus on technical competence development.
    You will stand out if you also include business skills like project management
    and Lean Six Sigma in your training plan. It is not uncommon for organizations
    to support high-value employees (e.g., cybersecurity professionals) and pay for
    MBA studies from top universities. Plan and ask for support! Organizations struggle
    to find and keep cybersecurity talent. Organizations can keep their best people
    by supporting career planning and providing financial support for training and
    education and secondments and appointments to other positions to gain broad experience.


    With additional training, the cybersecurity professional gains new knowledge and
    skills; look for opportunities to apply these new competencies. You may work toward
    promotion within your organization to gain new experiences. However, a lateral
    transfer to a position such as Service Desk Queue Manager, IT Contracts Manager,
    and IT Service Quality Manager can also provide valuable growth experiences. These
    positions are within the technology department, but outside of cybersecurity;
    gaining experience in broad areas increases your understanding of the overall
    IT department and its services. You might also volunteer to “cover” for others
    when they take annual leave; you gain diverse experiences and accelerate your
    learning by covering for others. These lateral and coverage opportunities will
    expand your knowledge and skills in peripheral areas but also holistically.


    ***Microlearning***


    Following are some useful exercises to enhance your learning:


    • Look for articles about microlearning and continuous professional development
    to better understand this powerful mode of learning.


    • Search online for the career planning process and use tailoring to follow a
    process that makes sense to you.


    • Search job ads for senior technology positions to better understand emerging
    job requirements and associated competencies. Identify target competencies for
    development.


    • Look for balance so that you are developing technical and nontechnical competencies
    like leadership, communication, and project management.


    • Identify and develop lasting competencies (e.g., project management) that will
    not quickly become obsolete like many technical certifications becoming obsolete
    as new technologies emerge.


