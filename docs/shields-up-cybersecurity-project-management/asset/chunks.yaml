  trans: '

    我们看到，向精益化和数字化转型的趋势加速了对自动化项目的需求。首席信息官（CIO）受邀与业务部门合作，交付“高影响倡议”（Gartner 2020b, 3）。自动化项目日益成为一种紧迫的需求，即通过减少人工参与和改进客户体验来降低成本。自动化和机器人将成为一个增长领域，因为多种技术（例如
    `IoT`、`AI`、`sensors` 和机器智能）将结合起来，创造新的自动化机会（Skilton and Hovespian 2018, 59）。同样，我们将看到更多需要网络安全的自动化和集成项目。


    ## 启用超连接


    各机构正在竞速地与合作伙伴、应用程序（Mulesoft 2021, 4）以及外部数据建立连接，以提高竞争力（Aaser and McElhaney 2021,
    2）。更多的连接可以带来额外的创新和机会；但连接性的增加也可能带来更多的网络安全漏洞。连接的本质也在发生演变，物理、生物和数字领域之间形成了复杂的系统关系（Skilton
    and Hovsepian 2018, 55）。更多的连接导致了数字生态系统的发展。然而，超连接环境带来了一个问题：对数字生态系统的攻击可能会对受攻击资产的下游节点产生不利影响（Creese
    et al. 2020, 21）。


    ## 加入新兴的数字生态系统


    业务倡议致力于连接组织的系统；然而，它们也渴望与外部合作伙伴和客户建立更多连接。数字生态系统正在兴起，整合了 B2B 和 B2C 交互（Dietz, Khan,
    and Rab 2020, 3），为网络中的所有利益者创造价值（Diana and Torrance 2020, 1）。预计企业将要求更多参与数字生态系统，以跟快速变化的客户和员工（Dhasarathy
    et al. 2020, 2）。这些生态系统是复杂的并深受消费者欢迎；但它们也使网络安全团队面临管理额外漏洞可能。


    重复一遍，组织专注于交付价值；因此，调整我们的技术生态系统和流程以优化价值，使业务和 IT 目标保持一致。


    ## 应对更短的交付预期


    各机构的项目管理日趋成熟，并开始衡量关键绩效指标（`KPIs`），以评估项目启动、计划、设计、构建、测试和交付给终端用户的速度（Fitzpatrick and
    Strovink 2021, 4）。项目正经历从“快速失败”向“快速成功”的转变（PMI 2020, 2）。与快速交付周期相关的早期问题之一是，网络安全可能没有得到足够的重视，导致产生可以避免的漏洞（Boehm
    and Smith 2021, 2）。


    ## 提供基于分析的决策


    数字化转型项目正在改变我们的工作方式。随着数字连接的增加和流程的优化，业务在面临决策时将产生数据渴求。我们看到分析的需求增加，将其作为组织提供竞争优势的手段（Dietz
    et al. 2020, 6）。预计会有更多来自各种来源数据输入的 `AI` 支持的分析。使用 `AI` 支持分析的结果之一是，企业将预测新的机会，这些机会可能成为需要实施的新项目以及需要保护的更多数字服务。事实上，基于分析的决策是网络安全最佳实践的核心。


    ## 客户预期的总结


    技术需求和采用率正在迅速增长，这并不意外。这种需求是多维度的，始于通过优化和转型项目降低组织客户成本并增加价值的意愿（Moyer 2021, 3）。各机构正推进数字化转型和创新项目，需要新技术来提高竞争力。技术被用于在不断演变的数字生态系统中与业务伙伴和客户建立连接。我们的目标是保护这些系统和数据。因此，当我们看到对数字服务的需求增加时，也会看到对网络服务的服务的增加；攻击面正变得越来越复杂（Skilton
    and Hovsepian 2018, 36）。事实上，由于监管和保险要求，我们可能会看到更多网络安全合规项目。因此，更多的技术项目带来了更多的网络安全项目工作，并预期项目将一次性完成并按时按预算交付。


    业务敏捷性不同于传统的敏捷项目管理，后者以 `Agile Manifesto` 为基础并使用 `Scrum` 交付方法。业务敏捷性是指关于在动荡环境中通过快速利用市场机会来持续交付价值的能力。


    ## 第 3 章


    ## 网络安全的未来


    我们知道数字化转型的范围和速度正在增加并加速。更多的技术等于更多的网络安全工作。`cloud`、`AI`、`IoT` 和新兴技术正在被采用。然而，IT 网络安全部门也在发生变化。不仅是技术在变，我们的工作方式也在变（世界经济论坛
    2020, 3）。


    ### 技术威胁


    大多数观察者预测新威胁将来自新技术（例如 `5G`、`cloud`、`APIs`、`IoT/IoT`、`aaS` 供应商商、`blockchain`、`AI`、数字助手和智能手机）。这本书并不是关于我们感兴趣的具体技术；相反，新兴技术往往是漏洞的来源，许多漏洞源于恶意行为者和人为错误（例如云配置错误）。对新技术的密集攻击导致补丁窗口变得狭窄。国家级威胁将继续存在，并随着犯罪团伙的合作和协作而变得更具创新性。此外，我们不再关注威胁的性质（例如
    `malware`、`phishing`、`denial of service` 和密码攻击），而是担心新技术带来了新的漏洞和新的网络犯罪手段。


    ### 威胁目标


    各机构通过采用更多具有潜在漏洞的技术，日益成为攻击目标。由于 `IoT/IoT` 设备的普及、全球超连接的不断扩大以及远程办公的转型，人类攻击面也在增加。网络攻击变得更加复杂，试图控制计算机系统以瘫痪、干扰或控制技术。例如，我们可能会看到组织供应链中出现更多弱环节的数据外泄攻击。不幸的是，网络攻击的速度和规模呈指数级增长，导致一线网络防御人员出现警报疲劳（微软
    2020, 25）。


    ## 网络安全策略正在演变


    首席信息安全官（`CISOs`）负责制定和管理网络安全策略。当“网络攻击者保持防御优势”时，制定网络安全策略可能是非常困难的（Oltsik 2020, 7）。更具挑战的是，新技术处于不断开发和采用的状态中。这种加速的变化导致指导性最佳实践的出现较为缓慢（Howard
    2020, 3）。结果是 `CISOs` 在制定策略时需要具有创造力。


