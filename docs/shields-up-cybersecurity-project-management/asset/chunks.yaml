    When an information systems life-cycle approach is followed, the results are more
    predictable because the stakeholders understand the steps in the process and can
    plan accordingly. We are encouraged to build cybersecurity into the SDLC, including
    threat modeling, design reviews, static and dynamic testing, and penetration testing
    in the production environment (Microsoft 2020, 75). We see that the SDLC aligns
    with traditional project management, IT service management, and cybersecurity
    management best practices and with supporting processes like quality management.
    *Shields Up* is aligned with the information systems life-cycle approach. Therefore,
    by following the approaches in this book, you will continue to contribute to good
    project management, IT, and cybersecurity practices.


    Technical Framework Alignment: Final Thoughts


    Quality management is fundamental to many frameworks, including cybersecurity.
    The NIST Cybersecurity Framework is the de facto global framework many organizations
    use to deliver and optimize cybersecurity services. Cybersecurity services are
    often delivered within the ITIL framework that follows the Service Value Chain
    beginning with an identified need or opportunity, delivered to the organization
    through a project management delivery method that is used and optimized.


    [CHAPTER 5](#Contents.xhtml#rch5)


    [Project Management Frameworks](#Contents.xhtml#rch5)


    There are two categories of project management frameworks: competency frameworks
    for individuals and maturity models for organizations. Like cybersecurity capability
    maturity models, there are project management capability models like PMI’s Project
    Management Maturity Model (ProMMM). Organizations can follow these maturity models
    to improve their project management capabilities, much like improving capabilities
    by progressing through cybersecurity tiers. Since cybersecurity professionals
    are less likely to lead project management improvement projects, ProMMMs are out
    of scope for this book. Instead, we look at project management frameworks (e.g.,
    The Guide to the Project Management Body of Knowledge \[PMBOK® Guide\] and PRINCE2)
    aimed at individuals to guide them in project management.


    Multiple project management frameworks can be explained on a continuum of predictive
    to adaptive project delivery ([Figure 5.1](#Chapter05.xhtml#fig5.1)). We can use
    a predictive project management delivery approach to plan our project using schedules,
    budgets, and other tools to forecast task completion, phase by phase. This traditional
    approach is sometimes known as waterfall project management since it is sequential
    and linear; a new phase does not start until the previous phase finishes. Most
    professional organizations (e.g., the PMI and the International Project Management
    Association) support predictive approaches to project management.


    However, with the increasing popularity of agile project management, project management
    associations have embraced adaptive project management approaches like the Scrum
    method in their standards. Agile delivery approaches are appropriate when there
    is (i) ambiguity about the product or service to be delivered by the project team
    or (ii) ambiguity about how to deliver the product or service. Complex and ambiguous
    projects can benefit from an adaptive delivery approach; however, such approaches
    are out of scope for this book since (i) most cybersecurity projects have low
    ambiguity (e.g., install new software or conduct an audit), and (ii) the top cybersecurity
    frameworks (and ISO quality management) imply a traditional or predictive project
    management approach. Therefore, this book emphasizes the traditional project management
    delivery approach to help the reader deliver routine cybersecurity projects. However,
    the hybrid project management approach in *Shields Up* accommodates adaptive project
    work when sufficient ambiguity or complexity is encountered (e.g., design challenges).


    ![images](images/fig5.1.jpg)


    ***Figure 5.1 Project Delivery Continuum***


    Guide to the Project Management Body of Knowledge


    The PMBOK® Guide from the PMI is widely regarded as the de facto global project
    management standard. The PMBOK® Guide 7th Edition contains the Standard for Project
    Management and a PMBOK® Guide ([Figure 5.2](#Chapter05.xhtml#fig5.2)). The 7th
    Edition is a departure from previous versions: the earlier versions of the PMBOK®
    Guide directed the reader on *how* to implement a project by following processes
    like the planning process. The reader would use information in the knowledge areas
    (e.g., schedule, cost, and quality) during a project management process (e.g.,
    develop a schedule during the planning process). The focus of the PMBOK® Guide
    (editions 1–6) was tactical (how to plan and deliver projects), while the PMBOK®
    Guide 7th Edition is strategic (*what* to manage).


    Project management principles are emphasized in the 7th Edition of the PMBOK®
    Guide. Principles are intended to be applied to all projects, regardless of the
    type and complexity of the project, project manager, and sponsor. Principles are
    enduring and universal. The PMBOK® Guide 7th Edition principles guide our behavior
    in projects (PMI 2021, 42–43):


    ![images](images/fig5.2.jpg)


    ***Figure 5.2 PMBOK^® Guide Evolution***


    1. **Stewardship:** Be a diligent, respectful, and caring steward.


    2. **Collaborative team:** Build a collaborative project team environment.


    3. **Stakeholders:** Effectively engage with stakeholders.


    4. **Value:** Focus on value.


    5. **Holistic thinking:** Recognize, evaluate, and respond to systems interactions.


    6. **Leadership:** Demonstrate leadership behaviors.


    7. **Tailoring:** Tailor based on context.


    8. **Quality:** Build quality into processes and deliverables.


    9. **Complexity:** Navigate complexity.


    10. **Opportunities and threats:** Optimize risk responses.


    11. **Adaptability and resilience:** Embrace adaptability and resiliency.


    12. **Change management:** Enable change to achieve the envisioned future state.


    *Shields Up* is aligned with the processes and knowledge areas of the 6th Edition
    (e.g., quality and risk management processes from a tactical perspective) and
    the principles of the 7th Edition (strategic focus) that guide our behavior when
    we manage projects.


    Exercise


    These PMBOK® Guide principles are like the Agile Manifesto and ITIL 4 principles;
    take a moment to compare these principles to see that the IT profession has long
    been following these principles to guide our work (see agile project management,
    [Figure 5.4](#Chapter05.xhtml#fig5.4)). Think about how you complete your work
    according to these principles. These project management principles and others
    guide project delivery in the hybrid project management approach in *Shields Up.*
    Which principles can you prioritize for further development?


    ***Sense of Urgency***'
