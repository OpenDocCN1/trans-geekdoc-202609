- raw: '2. **Relative project size**: The size of the project will impact how you
    manage your project: larger projects often face more governance and increased
    formality than smaller ones.


    3. **Project criticality**: Projects are prioritized, and the degree of project
    criticality relates to the amount of governance and formality required to manage
    your project. Early career project managers usually are assigned less critical
    projects. Understanding project criticality to your sponsor also contributes to
    improved project alignment.


    4. **Uncertainty and risk (external)**: All projects face uncertainty and risk;
    they impact the project and how the project manager organizes work. Projects that
    are highly uncertain with many risks are more challenging to manage and may require
    a larger team and more formality. Even projects with less uncertainty and fewer
    risks can benefit from a formal risk management approach—the secret to project
    success!


    5. **Organizational environment**: We do not manage projects in a vacuum; the
    culture and governance impact how we manage our projects.


    6. **Business environment**: The projects we manage are impacted by the external
    business environment. For example, working with a global team can add to project
    complexity.


    Understanding the complexity of your project sooner rather than later improves
    the odds of project success. By assessing each attribute with the Gizmo, you methodically
    evaluate project complexity. The Project Feasibility Gizmo helps us appreciate
    the contextual complexity of project attributes external to the project. For example,
    the same project in Helsinki will likely be managed differently in Abu Dhabi or
    Moose Jaw due to the different external project environments. Understanding the
    external environment early in the project allows us to identify risks and issues
    when they are easiest to manage.


    Next, we assess the effort required to deliver the project. We use the Gizmo to
    examine project effort attributes:


    1. **Type of work**: The first project effort attribute is the type of work we
    are doing: building a bridge over a river, conducting a NIST compliance audit,
    or adding new security event management software. Some projects require more and
    different types of effort the project manager needs to understand when planning
    a project. For example, are we implementing only the basic functionality, or is
    the project innovative (e.g., early adoption of technology)? Whatever our first
    projects may be, they will probably be relatively smaller, less complex, and less
    critical to the organization, with a greater degree of latitude to drift from
    approved project targets.


    2. **Communications**: The nature of the communications impacts our project and
    the type of risks and issues we must manage. For example, auditing often involves
    gathering data from others, such as our colleagues in the PMO and Infrastructure
    teams who might not be in the same building as us, while upgrading a backup tool
    will require fewer communications. Therefore, the number of stakeholders and their
    location affects our projects.


    3. **Integration scope**: The number of different project elements that need to
    be integrated affects our project effort; the more elements to integrate (e.g.,
    budget and schedule reports, status reports, external stakeholders, human resource
    management, and contract management), the more significant effort is required
    to complete the project successfully. Integration scope can be a significant source
    of risks and issues discovered using the Gizmo.


    4. **Uncertainty and risk (internal)**: The complexity of the effort, the type
    of work, the number of project elements that need to be integrated, and so on
    all bring risks and issues that the project manager manages. Less complex projects
    that require less effort are often the first types of projects assigned to new
    project managers.


    The output of using the Project Feasibility Gizmo is the project manager has systematically
    gathered valuable project information with which to plan and to prevent risks
    from becoming issues—the Achilles Heel of technology projects. The project manager
    is encouraged to repeat the exercise with the project sponsor and their SME team
    if there is more than average uncertainty (e.g., a range of possible outcomes).
    You could find that you and the sponsor have very different perspectives of the
    project feasibility attributes resulting in misalignment at the beginning of the
    project; misalignment is not uncommon and working through the Gizmo brings alignment.


    Exercise


    Assess a project you have under consideration or one where you were a team member.
    Use the Project Feasibility Assessment Gizmo included in [Appendix 2](#Appendix02.xhtml#ap2).


    A key benefit from using the Project Feasibility Gizmo is that you address the
    Ability to Change Paradox directly and early in the project, thereby improving
    your probability of project success.


    ***The Ability to Change Paradox***


    The Ability to Change Paradox ([Figure 7.1](#Chapter07.xhtml#fig7.1)) faces all
    project managers and can affect project success if not properly managed (Hartman
    1999a, np). At the start of the project, one has very little information about
    the project. However, the amount of information we have increased throughout the
    project (e.g., we know which risks became issues, which project personnel delivered
    consistently on time, and which procurement delays were unavoidable). Over time,
    our ability to make changes decreases; it is easy to add scope or change the testing
    approach in the first week of the project compared to the later stages (e.g.,
    changing design when testing is finishing up is difficult). And if we wish to
    make changes, they are less costly to make at the beginning of the project than
    during later phases. Therefore, during the initiating and planning phases, our
    analysis can shift the information curve if we leverage the opportunity provided
    by the Ability to Change Paradox, work with the right stakeholders, and follow
    the hybrid project management processes and principles.


    *Ability to Change Paradox:* When changes are least costly and easiest to make
    at the beginning of the project, we lack information; however, when we have better
    information later in the project, those changes are often complicated and expensive.


    If risks are discovered later in the project, they may become issues resulting
    in a less than successful project with issues like missed milestones, overbudget
    expenditures, and quality compromises. We can mitigate this problem by shifting
    the information curve: bringing forward information ([Figure 7.1](#Chapter07.xhtml#fig7.1))
    to increase the quality and quantity of information sooner rather than later in
    the project. The Project Feasibility Gizmo is a tool that guides the project manager
    to understand the project better sooner, thereby shifting the information curve.
    The project manager learns more about the project to develop better plans, with
    greater lead time to manage project risks and avoid costly changes later; the
    foundation of front-end loading.


    ![images](images/fig7.1.jpg)


    ***Figure 7.1 Ability to change paradox***


    Initiate Phase: Final Thoughts


    During the initiation phase, the project manager strives to get formal approval
    to initiate the project. The project manager works with the project sponsor to
    develop a PID that gives authority to the project manager to proceed to the planning
    phase. The Gizmo might be used to develop a deeper understanding of the project
    to shift the information curve to avoid costly changes later in the project.


    ***Microlearning***


    Following are some online learning activities to deepen your understanding of
    the initiate phase; search for:


    • How to create an infographic?


    • What KPIs are used in project management? Planning and using project management
    KPIs and project assessment criteria can help you deliver the right amount of
    project management quality.


    • How does the ITIL 4 change control practice work?'
