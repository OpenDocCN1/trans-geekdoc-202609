    Discuss with your leadership the information they require in project status reports.
    Status reports can be improved if they are aligned with the project priority;
    if the priority is on time and cost, then the status report will have schedule
    and budget information and the related risks and issues.


    Many project managers develop a RACI chart (sometimes called a responsibility
    matrix) to help manage communications by clarifying roles and responsibilities
    for critical tasks and milestones ([Table 8.2](#Chapter08.xhtml#tab8.2)). Projects
    that lack a RACI chart face the risks of role confusion and omitting people in
    the communications process. The project manager assigns four different roles to
    project participants to improve communication and coordination:


    1. **Responsible:** The person(s) who will complete the task. While multiple people
    can be assigned responsibility to complete a task, too many Rs can congest and
    delay the activity (e.g., “too many cooks in the kitchen”).


    2. **Accountable:** The person responsible for delegating and overseeing the completion
    of the task (task owner) but might not be doing the work. There should only be
    one person accountable for each task and milestone. The accountable person usually
    approves the work completed by the responsible SME.


    3. **Consulted:** The person who may provide expert advice (two-way communication).
    Project managers try to balance who needs to be consulted since too many Cs can
    delay a project.


    4. **Informed:** People who need to know about the activity progress but are not
    directly involved in the work; they are given high-level rather than detailed
    project information (one-way communication).


    The project manager will analyze the RACI chart to ensure no empty cells and that
    no SME is overburdened with work (too many Rs). The project manager discusses
    the assigned roles with the team to get their buy-in. Once the RACI chart is completed
    with a high-level communications, plan is completed.


    ***Table 8.2 RACI chart***


    | **Task/milestone** || **Project manager** || **Project sponsor** || **SME #1**
    || **SME #2** || **SME #3** |


    | --- | --- | --- | --- | --- | --- |


    | **Activity A** || A || I || R || C || I |


    | **Milestone 1** || A || C || C || R || I |


    | **Activity B** || A || I || R || I || C |


    | **Activity C** || A || I || C || C || R |


    | **Milestone 2** || A || C || I || C || R |


    Risk Management


    Risk management is a critical success factor for technology projects and is a
    recommended ITIL general management practice (Limited, AXELOS 2019, 95–97); get
    risk management right, and the probability of project success exponentially increases.
    Risk management in *Shields Up* is aligned with ISO 31000:2018 Risk management—Guidelines
    (ISO 2018b); therefore, when you follow risk management in *Shields Up,* you are
    aligned with ISO 27000 Risk Management. Lean risk management centers on the risk
    management process supported by a risk register, quality management, and simple
    techniques that can be used on most projects, most of the time. Risk management
    is the process of planning, identifying, analyzing, treating, and controlling
    risks and issues. Risks and issues may be negative (e.g., delays) or positive
    (e.g., opportunities to crash an activity) and can be managed with the risk management
    process and risk register.


    The risk management process ([Figure 8.7](#Chapter08.xhtml#fig8.7)) is simple
    and effective; you can use this approach on most projects, most of the time. All
    project plans should include a section about risk and issue management. The project
    manager provides an overview of how risks and issues will be managed and communicated,
    the tools and processes used, and so on. For example, the project manager may
    schedule weekly risk management meetings ([Table 8.1](#Chapter08.xhtml#tab8.1))
    to review the risk register and include risks and issues on the status reports.
    The risk management process is a step-by-step approach. Once a risk is identified,
    it is analyzed qualitatively (high, medium, or low), then treated (risk prevention
    and actions), followed by documenting the risk in the risk register. ITIL and
    project management standards (e.g., PMBOK® Guide and PRINCE2) have common purposes
    and are naturally aligned. Following the risk management process complies with
    international standards and dramatically improves the probability of project success.
    The risk management process appears in [Figure 8.7](#Chapter08.xhtml#fig8.7),
    where the project team uses risk management throughout all the project phases.


    ![images](images/fig8.7.jpg)


    ***Figure 8.7 Risk management process***'
