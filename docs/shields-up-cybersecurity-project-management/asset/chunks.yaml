  trans: '

    项目经理和团队遵循风险管理流程并识别风险。风险识别包括风险原因、事件和影响（表 8.3），并按照语法进行记录。重要的概念是风险事件使用了传达不确定性的词汇，例如，我们使用
    `may`、`could` 和 `might` 来表示风险尚未发生但可能发生。在使用适当语法时，理解得到了提高，风险得以降低。因此，当我们识别一个风险时，我们将风险框架为原因、事件和影响，以便进行有效的分析和处理。


    ### 表 8.3 风险管理框架和语法


    | 元素 | 描述 | 语法 | 处理 |

    | --- | --- | --- | --- |

    | **风险原因** | 由于某种原因或理由产生的风险 | `由于`（Due to）延迟 | 风险发生的概率：高、中、低 | 防止此风险发生的措施 |

    | **风险事件** | 可能会影响项目（无论是正面还是负面）的事情 | `存在风险`服务器`可能`迟到 | — | — |

    | **风险影响** | 风险事件发生的后果 | `导致`（Resulting in）项目阶段延迟 | 如果风险发生，其对项目的影响：高、中或低 | 可以减轻（缓解）风险发生影响的措施
    |


    一旦我们识别并记录了风险（原因-事件-影响），就可以完成定性风险分析。首先，我们评估发生的概率：定性风险分析评估发生的概率：风险原因可能发生的可能性（图 8.7）。定性风险分析评估发生的概率为高、中或低。存在定量技术（例如蒙特卡洛模拟），表明风险发生的概率可能是
    88% 的概率（高）或 216% 的概率（低）。然而，定量技术更为繁琐（例如使用统计技术进行风险建模），且成本可能高昂。


    此外，许多定量技术需要大量时间进行建模并需要大型数据集。相反，在`Shield Up`，使用定性技术（高、中或低发生概率），因为它们易于生成和理解。项目经理和相关专家分析风险并对发生的概率达成一致。


    其次，我们分析风险事件将对项目产生的影响（例如延迟），如果它发生：我们评估对项目产生的影响（正面或负面）：高、中或低影响。项目经理和专家共同分析并对影响的影响，然后将他们的分析添加到风险表中。风险表是项目团队用于管理风险和问题的主要工具（附录
    3）；尽管它被称为风险表，但它也被用于管理问题（已经实现并成为项目问题的风险）。


    一旦我们识别了风险、理解了原因和影响并分析了发生的概率和影响，我们就检查处理风险的方法。首先，探索防止风险发生的方法。在我们由于生产短缺导致服务器延迟交付示例中，我们可以通过确保服务器准时离开工厂来防止延迟交付，例如协商支付溢价或寻找替代供应商。我们可以通过购买库存中的服务器型号并交付以满足我们的项目进度而不延迟我们的构建阶段来避免该风险。其次，如果风险发生，考虑缓解措施以减轻影响（例如，我们未能防止风险，风险变成了一个问题）。例如，我们可以完成其他项目活动以继续进展。我们可能会开始开发测试策略、计划和测试脚本。同时，我们等待服务器到达（例如，我们可能对开发内容和负责人员达成一致）。再次，我们更新缓解措施的风险表；我们分配带有完成日期的预防和缓解措施。如果我们在风险解决日期之前无法防止风险，则该风险将转换为问题。


    问题是已经实现的风险；风险事件原因未被防止，风险事件发生了，且项目受到了影响。我们以类似于风险的方式分析问题；然而，问题的原因是风险事件。由于问题已经发生，因此没有需要考虑的概率：只有影响（高、中或低）以及问题对项目的影响。问题语法使用如
    `will` 和 `has` 等术语，传达了风险已发生的 100% 确定性并导致了问题（例如，存在服务器`将`迟到的问题）。我们分配解决问题的行动并提供问题解决截止日期。因此，我们有了一个风险表，它支持我们如何管理风险和问题，以及谁负责预防、缓解和解决风险和问题。


    某些项目受益于风险管理工作会：关键项目利益相关者会面大约两个小时，识别、分析和处理项目风险和问题。首先，描述你针对项目的风险管理计划。使用黄色贴纸，并指示参与者在黄色贴纸上绘制风险管理元素的水平和垂直线，给出风险管理的概述（图
    8.8）。共同识别前几个风险，并向参与者展示如何完成带有信息的黄色贴纸（原因、事件、概率、影响、预防和缓解）。这种通用方法允许参与者提出任何风险（协作软件如在线脑图工具可以促进在线工作会）。当参与者写下风险时，他们积极为项目做贡献，并发生了团队建设。


    我们可以采取关注的方法，系统地检查与里程碑、关键路径、预算、阶段、采购流程、上线阶段等相关的风险。例如，检查关键路径上的每个活动，以识别、分析和处理风险和问题。我们重复我们的风险管理流程，检查主要里程碑、进度、预算等。通过关注特定的风险类别，我们是全面的，并显著改变了信息曲线。


    一旦风险被识别，我们就可以通过风险矩阵对它们进行排序（[图 8.9](#Chapter08.xhtml#fig8.9））。我们根据严重程度（概率 × 影响）对风险进行排序，并根据影响对问题进行排序（我们不对问题评估发生概率，因为问题已经存在）。例如，高概率/高影响风险应该是团队的重点，因为风险发生的概率很高，且如果它发生，对项目的影响是巨大的。因此，我们可以对风险进行排序，告知领导层严重风险，并实施我们的处理计划以预防和缓解。

    '
