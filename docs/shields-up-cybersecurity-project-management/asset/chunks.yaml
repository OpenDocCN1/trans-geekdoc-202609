    like cloud security specialists and cybersecurity project managers. Unfortunately,
    the demand for cybersecurity talent far exceeds the supply. The cybersecurity
    skill gap creates problems for businesses, such as delaying cybersecurity projects
    until a cybersecurity project manager is available to complete the project. The
    skill gap also creates opportunities for cybersecurity professionals to lead their
    first project. With leadership comes the responsibility for outcomes: project
    success. Therefore, project managers are more likely to deliver successful projects
    following a structured rather than an ad hoc project management delivery approach.


    Organizations increasingly rely on technology to deliver products and services
    and keep our information confidential, private, and secure. Organizations adapt
    best practices and frameworks to provide a structured approach to delivering products
    and services that meet approved requirements and service level agreements. Organizations
    rarely apply the standards and frameworks as designed; instead, they pick and
    choose the elements required to meet their requirements (e.g., they tailor the
    framework to their specific situation). We see tailoring guidance in project management
    standards like the `PMBOK® Guide` and `ITIL` to pick the essential project management
    tools and processes required to deliver a successful project ([Figure 15.1](#Chapter15.xhtml#fig15.1)).
    The focus of hybrid project management documented in `Shields Up` is to follow
    a structured approach to meet stakeholder needs and leverage opportunities to
    deliver value to the end users. The traditional project management delivery approach
    is appropriate for most projects. It has a foundation of risk management to improve
    the probability that value will be delivered to the service users. We may include
    iterative work to determine the best design or fix a defect found during testing.
    However, most cybersecurity projects can be implemented with the traditional project
    management delivery approach with iterations when required. While our project
    management approach may vary from project to project, our hybrid project management
    principles do not; we have a sense of urgency, encourage collaboration, and focus
    on delivering value.


    ![images](images/fig15.1.jpg)


    **Figure 15.1 Shields Up hybrid project management**


    Congratulations for making it thus far! You may want to review specific chapters,
    review the exercises, and complete the microlearning actions. Project management
    is a dynamic specialty attracting new practitioners and researchers each year,
    resulting in best practice maturity and new ways of work. Couple the advances
    in technology and cybersecurity with project management, we have a dynamic environment
    to plan, implement, and sustain value. Our journey to learn about project management
    continues.


    ## [PART III](#Contents.xhtml#rpt3)


    ## [Appendixes](#Contents.xhtml#rpt3)


    ## [APPENDIX 1](#Contents.xhtml#rap1)


    ### NIST Cybersecurity Framework Core Example](#Contents.xhtml#rap1)


    The National Institute of Standards and Technology (`NIST`) Framework for Improving
    Critical Infrastructure Cybersecurity is a leading global cybersecurity framework.
    Therefore, all IT professionals, including cybersecurity professionals, should
    be aware of the `NIST` Framework since everyone has a role in cybersecurity. The
    `NIST` standard is arranged according to functions, categories, subcategories,
    and references ([Table A1.1](#Appendix01.xhtml#taba1.1); National Institute of
    Standards and Technology 2018, 50).


    The `NIST` Framework helps organizations audit their cybersecurity capabilities,
    identify gaps, and set targets for improvements (more projects). Leading a cybersecurity
    audit or broader technology audit are good development projects as they are nontechnical
    and provide an overview of systems and services.


    **Table A1.1 NIST cybersecurity framework core example**


    | **Function** | **Category** | **Subcategory** | **References** |

    | :--- | :--- | :--- | :--- |

    | **Recover** | **Recovery Planning (RC.RP):** Recovery processes and procedures
    are executed and maintained to ensure restoration of systems or assets affected
    by cybersecurity incidents | **RC.RP-1:** Recovery plan is executed during or
    after a cybersecurity incident | `CIS CSC 10`, `COBIT 5` APO12.06,DSS02.05, DSS03.04,
    `ISO/IEC 27001:2013` A.16.1.5, `NIST SP 800-53 Rev. 4`CP1 |

    | **Improvements (RC.IM)** | Recovery planning and processes are improved by incorporating
    lessons learned | **RC.IM-1:** Recovery plans incorporate lessons learned | `COBIT
    5` APO12.06,BAI05.07, DSS04.08, `ISA 62443-2-1:2009` 4.4.3, `ISO/IEC 27001:2013`
    A6.1.5, `NIST SP 800-53 Rev. 4`CP1 |

    | **Communications (RC.CO)** | Recovery activities are coordinated with internal
    and external parties (e.g., coordinating centers, Internet Service Providers,
    owners of attacking systems, victims, other CIRTs, and vendors) | **RC.CO-1:**
    Public relations are managed | `COBIT 5` EDM03.02, `ISO/IEC 27001:2013` A6.1.4
    |

    | | **RC.CO-2:** Reputation is repaired after an incident | `COBIT 5` MEA03.02,
    `ISO/IEC 27001:2013` 7.4 |

    | | **RC.CO-3:** Recovery activities are communicated to internal and external
    stakeholders as well as executive and management teams | `COBIT 5` APO12.06, `ISO/IEC
    27001:2013` 7.4, `NIST SP 800-53 Rev. 4`CP1 |


    ## [APPENDIX 2](#Contents.xhtml#rap2)


    ### Project Management Gizmo](#Contents.xhtml#rap2)


    The Project Management Gizmo^([1](#Appendix02.xhtml#ap2fn1)) is a research-based
    tool to assess a project to understand the project’s complexity ([Table A2.1](#Appendix02.xhtml#taba2.1))
    and the effort required (Table A2.2) to deliver the project successfully (Skulmoski
    2008, 1). One can use the Gizmo to systematically assess a project to improve
    their front-end understanding to develop better project plans.


    The Gizmo becomes even more valuable when project stakeholders independently assess
    the project and compare their results. When used in a group setting, the Gizmo
    will help identify areas of alignment and misalignment. For example, the project
    manager might assess the type of work and give the effort to implement the technology
    a low score. In contrast, the implementing consultants give the effort to implement
    a higher score. The two then discuss why the scores are different and come to
    a consensus. Without the Gizmo, the project manager might underestimate the effort
    to implement the technology resulting in a schedule with insufficient time.

