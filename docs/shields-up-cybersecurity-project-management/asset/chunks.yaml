- raw: 'The first step in the tailoring process is to choose a project management
    approach; most cybersecurity projects can be implemented using hybrid project
    delivery ([Figure 6.2](#Chapter06.xhtml#fig6.2)). Indeed, the ITIL framework is
    flexible and allows organizations to fine-tune the Service Value Chain to meet
    the unique demands of their projects (Limited, AXELOS 2019, 18). Most project
    managers use the traditional project management approach and begin their careers
    by leading routine or less complex projects with low ambiguity. One predictably
    progresses through the project phases, primarily when stage gates govern progress.
    Stage gates (also known as control gates) are decision points where leadership
    can approve or terminate projects. Stage gates are beneficial if the project manager
    is new to managing projects and leadership wants to provide guide rails to help
    the new project manager successfully deliver their project. Stage gates are improved
    if they are measurable, objective, and published in advance. For example, we can
    leave the design phase and enter the build phase if the following documents are
    approved: (i) application detailed design, (ii) low-level design for infrastructure,
    and (iii) integration specification. One can also complete a project review at
    these project inflexion points where project status, project feasibility, and
    perhaps continued relevancy of the business case are reviewed.


    ![images](images/fig6.2.jpg)


    ***Figure 6.2 Hybrid project delivery approach***


    A key benefit of stage gates is poorly performing projects can be terminated or
    rescued with replanning and approval. Stage gates are widely used to improve rigor,
    governance, and quality and reduce risk. Stage gates are easy to understand, use,
    and implement. Include stage gates in your cybersecurity projects to document
    what you need to deliver, including terminating the project after completing the
    monitoring period.


    Should your organization lack formal stage gates, you can establish stage gates
    and success criteria with your manager and sponsor. Aligned with the ITIL Service
    Value Chain, there are milestone documents that the project manager develops,
    such as an approved project plan that completes the planning phase or the test
    report that completes the test phase ([Table 6.1](#Chapter06.xhtml#tab6.1)). In
    line with lean project management, we minimize the amount of documentation our
    projects produce; with experience, the quality of our documentation improves and
    becomes leaner.


    The hybrid project delivery approach includes the risk management process (identify,
    analyze, treat, and control) in each project phase ([Figure 6.2](#Chapter06.xhtml#fig6.2)).
    Risk management is critical to delivering successful projects (see the Risk Management
    section) and underlies most project management efforts and decisions. Finally,
    the hybrid project delivery approach accommodates iterations when required ([Figure
    6.2](#Chapter06.xhtml#fig6.2)). For example, we might go through an iteration
    to fine-tune the project scope to initiate the right project. Later, we may face
    design challenges, especially if the technology we implement is leading edge.
    We may complete multiple design iteration cycles to finalize the technical design.
    Likewise, when we test our application, we may encounter defects that require
    multiple attempts to find a feasible and implementable solution. These iterations
    may closely or loosely follow the Scrum method ([Figure 5.4](#Chapter05.xhtml#fig5.4))
    depending upon the purpose and capability of the team.


    ***Table 6.1 Stage gate criteria example***


    | **Stage gate criteria** |


    | Initiate || Business endorses the project (meeting minutes)Funding is provided
    (meeting minutes)Feasibility is endorsed (presentation to Change Control Board)Leadership
    provides approval to proceed (meeting minutes) |


    | Plan || Project Planning Workshop(s) is completed (meeting minutes)budget is
    baselinedSchedule is baselinedProject Planning Document is approved (links to
    minutes, schedule, and budget) |


    | Design || Design Workshop(s) is completed (minutes)Project Design Document(s)
    is approved |


    | Build || Build Workshop(s) is completed (meeting minutes)Project Build Document(s)
    is approved |


    | Test || Test Strategy Document(s) is approvedTesting Workshop(s) is completed
    (meeting minutes)Test Report Document(s) is approved |


    | T2P || T2P Workshop(s) is completed (meeting minutes)T2P Checklist is completedGo
    Live Plan is approvedChange Request is raised |


    | Close Out || Close Out Report is approvedChange Control Board approves project
    closeoutProject and team disbandment are documented and archived |


    Thus, hybrid project management in *Shields Up* uses the traditional waterfall
    project management delivery approach, governed by stage gates. The stage gates
    help govern progress. Underlying progress is risk management and iterative problem-solving
    cycles. Hybrid project management in *Shields Up* is about combining and tailoring
    practices, processes, principles, and tools to deliver a successful project. *Shields
    Up* is aligned with the cybersecurity and project management specialties ([Figure
    5.8](#Chapter05.xhtml#fig5.8)).


    When examining the frameworks and standards that guide IT, cybersecurity, and
    project management activities, one notes they are process-based. They begin with
    a need or opportunity, and then work is completed, resulting in something of value
    ([Figure 6.3](#Chapter06.xhtml#fig6.3); refer to the original figures for the
    details. Your eyes are fine!). They address a need by converting inputs into outputs
    by following processes to deliver value to the end user. Project management is
    the delivery method to provide value in these frameworks and standards. Therefore,
    your journey to improve your project management capabilities will help you succeed
    in these other frameworks.


    ![images](images/fig6.3.jpg)


    ***Figure 6.3 Hybrid project management alignment***


    These frameworks and standards begin with the organization identifying a need
    or opportunity delivered through a project. A process(es) is followed, and value
    is delivered. Therefore, by following the hybrid project management approach,
    you align to best practices and processes represented in these international standards
    and frameworks.


    Hybrid Project Management Principles


    The hybrid project management principles are intended to guide actions and decisions
    in most projects, most of the time, including cybersecurity projects (throughout
    the spectrum of technical to nontechnical projects). These principles help shape
    project culture and align the team. In project management and technology operations,
    we interact regularly with new team members both internally and externally. Each
    new interaction offers the opportunity to bring them into our culture and operational
    frameworks as we meet needs and opportunities to deliver value to the users of
    our services. Therefore, as project managers, we can be role models of the principles
    we value when collaborating with others in projects.


    Principles are found in many frameworks such as the PMBOK® Guide, ITIL, PRINCE2,
    and the Agile Manifesto. These principles are widely applicable and are found
    in hybrid project management detailed in *Shields Up.* The five hybrid project
    management principles include the following:


    1. **Value orientation**: The reason we work is to deliver value! In cyber-security
    projects, we may improve our ability to protect or respond, which our organization
    values. We take a holistic approach to deliver value and prefer to deliver value
    early and frequently. We are agile and welcome managed change.


    2. **Collaboration**: To deliver value, we regularly collaborate with others to
    meet expectations and deliver requirements. Our collaborations build trust through
    open communication, leading to high-performing teams.'
