    ### 4. Budget

    The high-level project budget is presented for comments. However, the budget is
    sensitive in some projects and organizations and not presented in the PPW. (Your
    finance and procurement colleagues can assist you with procurement [e.g., vendor
    selection] if it has not already been completed.)


    ### 5. People

    Project communications and resource management are presented. Effective communications
    will align with the project milestones, phases, and project priority. We communicate
    through meeting minutes and status reports. We use templates to guide content
    development (e.g., schedule and budgets) to share project information. The `RACI`
    chart can be used but might be too detailed for the PPW and may be reviewed separately.


    ### 6. Risks and issues:-

    Finally, the main risks and issues are presented. The focus is on the prevention
    and mitigation actions necessary to deliver a successful project. The goal is
    to put preventative actions in place to reduce the probability of the risk occurring
    (e.g., reduce the probability from medium to low). We also want to reduce the
    impact of a risk if it occurs (e.g., reduce the severity from high to medium or
    even low). We describe how we use the risk register and its use in project meetings
    and status reports.


    ### 7. Next steps:

    We conclude the meeting with the next steps: the project manager updates the project
    plan with the PPW attendees’ feedback and schedules a meeting with the project
    approvers to present the endorsed project plan with the project sponsor.


    The PPW is an early milestone and brings together stakeholders to present an overview
    of the integrated project plan for their feedback. Presenting a project plan to
    others can be intimidating; however, practice and a systematic approach will position
    you well to succeed. There is a common risk in meetings and workshops that the
    discussion could be side-tracked and take the meeting in an unintended direction.
    One technique to keep the meeting on track is setting up a flipchart to “park”
    important items out of scope for the PPW (e.g., optimization after the project
    is terminated). With the PPW feedback incorporated into the plan, we use the project
    change control process to approve the updated project plan endorsed by the PPW
    participants. Since the PPW is an important milestone in each project, the many
    elements can become templates for future PPWs. Therefore, attention to design,
    layout, content flow, and messaging will pay future dividends when reused.


    ## Project Change Management


    We use the project change management process ([#Chapter08.xhtml#ch8fn2]) ([Figure#Chapter08.xhtml#fig8.10])
    to approve the project plan and later to approve project changes (e.g., change
    the budget or schedule). Change management is fundamental to ITIL service management
    and is reflected in change enablement (Limited, AXELOS 2019, 112–115) and organizational
    change management practices (Limited, AXELOS 2019, 90–91). Managing project changes
    using a change management process is best practice.


    The change management process begins with a request for a new project or a change
    to an existing project (e.g., change the schedule). The project manager analyzes
    the requested change (e.g., assesses feasibility and impact to the project and
    program) or develops a project plan. The project manager then presents the change
    or project plan to the decision makers. If the change or project plan is denied,
    the project manager informs the requester. If the change or project plan is approved,
    the project manager implements the change. Not seen in the PPW, the project manager
    updates the project plan with the PPW attendees’ feedback and schedules a meeting
    with the project approvers to present the endorsed project plan with the project
    sponsor.


    ![images/fig10.jpg]

    *Figure 8.10 Change management process*


    The PPW is an early milestone and brings together stakeholders to present an overview
    of the integrated project plan for their feedback. Presenting a project plan to
    others can be intimidating; however, practice and a systematic approach will position
    you well to succeed. There is a common risk in meetings and workshops that the
    discussion could be side-tracked and take the meeting in an unintended direction.
    One technique to keep the meeting on track is setting up a flipchart to “park”
    important items out of scope for the PPW (e.g., optimization after the project
    is terminated). With the PPW feedback incorporated into the plan, we use the project
    change control process to approve the updated project plan endorsed by the PPW
    participants. Since the PPW is an important milestone in each project, the many
    elements can become templates for future PPWs. Therefore, attention to design,
    layout, content flow, and messaging will pay future dividends when reused.


    ## Ubiquitous Cybersecurity Planning


    It is good practice to build cybersecurity into our projects rather than adding
    cybersecurity as the project prepares to live. There are many resources to guide
    project planning to include cybersecurity, including the `ISO 27002 Information
    Technology-Security Techniques-Code of Practice for Information Security Controls`
    (ISO 2018a, 1–90):


    1. Ensure the development and test environments are secure.

    2. Add security requirements to the design.

    3. Include security within the milestones.


    Systematic project planning can shift the information curve and improve the probability
    of cybersecurity project success.


    ## Plan Phase: Final Thoughts


    Project planning is a fundamental part of the project and critical to success.
    When one assesses the root cause of project failure, insufficient planning and
    risk management are often cited along with inadequate testing. Therefore, allow
    sufficient time to plan your project. Following an integrated and lean planning
    process can increase the probability of project success. We aim to learn more
    about the project sooner to avoid costly changes later in the project.

