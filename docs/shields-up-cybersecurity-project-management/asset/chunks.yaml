- raw: 'Our goal is to seamlessly transfer the product or service produced by the
    project into operations with the intended outcomes. We complete the T2P actions
    identified as early as the planning phase to release the service into the production
    environment, including backout plans. We include training and communications to
    ensure a seamless transition. We work with the CAB and the release manager to
    plan and release the service into the production environment.


    ***Table 12.1 CAB go-live status report***


    | **Release elements** || **Status** || **Comments** |


    | --- | --- | --- |


    | Cybersecurity readiness || Green || List the security actions that have been
    completed and the state of readiness |


    | Systems readiness || Green || Ready |


    | New service readiness || Green || Ready |


    | Operational readiness || Green || Some training is outstanding; however, the
    sponsor confirms the organization is ready |


    | Training status || Amber || 11% of the organization has not completed training;
    additional training is being provided. 95% of the organization will be trained
    by Week 2 (post go-live) |


    | Communications readiness || Green || Ready—including backout communications
    |


    | Reporting readiness || Green || Ready—escalation procedures distributed |


    | Support readiness || Green || Ready—simulation exercises complete |


    | Risks || Green || No high severity risks; under control |


    | Issues || Green || No high severity issues; under control |


    | Other || — || None |


    ***Microlearning***


    Following are some practical exercises to enhance your learning. Search online
    for:


    • ITIL release management


    • ITIL release management templates


    • ITIL release management practice


    • Release strategies (e.g., canary/dark release)


    • Change authorization board


    [CHAPTER 13](#Contents.xhtml#rch13)


    [Monitor, Stabilize, and Close Out](#Contents.xhtml#rch13)


    The service or product has been delivered to operations, and the project team
    transitions to support (early life support) and closeout activities. ITIL’s Service
    Value Chain’s last activities are to deliver and support the new service according
    to users’ expectations and specifications. The team looks for feedback about the
    quality of the release and stays close to the end users. The project team receives
    service success feedback to guide support and future optimization planning. Some
    projects benefit from a go-live command center that gathers the project and operational
    resources for immediate ticket resolution and reporting escalation. The go-live
    plan will have predetermined trigger points to escalate and report issues and
    trigger points to uninstall and back the new service out of the production environment.


    One way to monitor the quality of the new service is to monitor incidents. ITIL
    provides guidelines in its Incident Management practice. The project manager will
    likely review daily incident reports, if any, to understand adoption and quality.
    For example, key performance indicators (KPIs) are monitored (e.g., resolution
    times) and compared to service level agreements (SLAs). When examining the incidents,
    categorize the incidents into technical and training-related incidents to better
    understand the quality of the implementation. Project managers often establish
    closeout stage gates based on tickets/day or tickets/week or close out the project
    a predetermined monitoring period (e.g., four weeks). While the project team monitors
    and supports the new service, they work concurrently on closeout activities like
    auditing contracts for compliance. Once the closeout metric has been reached,
    the project is closed out.


    The purpose of the closeout process is to formally terminate the project, transfer
    the product or service to the sponsor, and release project resources. Some project
    managers use a checklist to guide closeout activities such as:


    1. **Deliverable handover:** Formally transfer the deliverables to the sponsor
    and verify acceptance in meeting minutes or an e-mail. The requirements traceability
    matrix can be used ([Figure 11.2](#Chapter11.xhtml#fig11.2)), and columns include
    links to confirming meeting minutes or e-mails.


    2. **Project completion notice:** Inform all stakeholders that the requirements
    have been delivered and the project is completed. Direct the stakeholders to contact
    the service desk if they need assistance.


    3. **Contract closeout:** Review the contracts to ensure that all contractual
    obligations have been met. Some project managers use the requirements traceability
    matrix to document whether contract obligations have been met.


    4. **Resources:** Release resources (people and equipment) and celebrate with
    your team.


    5. **Lessons learned:** Complete a lessons learned exercise with the project stakeholders
    considering what went well and what can be improved.


    Document these actions in a closeout report and archive project documents for
    future reference. Inform the sponsor by e-mail that the project is closed out
    (terminated) and add the notification to the project archives.


    Lessons learned is a common practice in many organizations. What went well? What
    did we struggle with? What should we stop doing? What should we continue to do?
    And other questions help to learn, which is a cornerstone in all frameworks that
    guide good practice and hybrid project management in *Shields Up.* Closeout reports
    often include a lessons learned section. However, the lessons are often collected
    but not always learned; why do we have dismal and recurring project failure rates?
    Therefore, my recommendation is to complete lessons learned at the beginning of
    the project and the start of each project phase. During team meetings, these can
    be short discussions to apply the wisdom and knowledge developed on previous projects.
    Not only can we apply previous learnings, but the team values having their input
    implemented. Lessons learned can be implemented more effectively when the lessons
    are prioritized and assigned to a person to complete with a tracked and reported
    deadline.


    Microlearning


    Search online for more information about the tail end of projects; a strong finish
    is the preferred way to terminate projects:


    • How to terminate a project?


    • How to complete a lessons learned exercise?


    • Locate contract closeout templates and contract closeout letters?


    • Find project closeout best practices?


    [CHAPTER 14](#Contents.xhtml#rch14)


    [Operations and Optimize](#Contents.xhtml#rch14)


    When the project is closed out, operations manage the service delivered through
    your project. ITIL provides a framework, tools, and processes to manage and optimize
    the service. Remnants of the project may remain; there may be tickets on hold
    to complete outstanding project actions. For example, a requirement might not
    have been satisfied due to a defect fixed with a future patch. Vendors have their
    release strategy and schedule for patches and upgrades. The outstanding ticket
    can remind operations to look for the patch and plan its release to satisfy outstanding
    functionality.


    The Lean Six Sigma approach to optimization coupled with ITIL’s and ISO 9001’s
    continual improvement provides frameworks and tools to optimize products and services
    to deliver more value. Optimization will be more successful if proven processes
    are followed, like the Lean Six Sigma DMAIC problem solving and optimization process.
    Optimization proposals can result in new projects and initiatives along the Service
    Value Chain.


    Some projects take an iterative and phased approach (endorsed by ITIL), beginning
    with a minimum install. Once the basics are installed (“vanilla install”) and
    used, end users better understand what should be optimized and extended. Optimization
    can trigger new projects that can be considered using the change control process
    to provide approval to proceed with the new project.


    [CHAPTER 15](#Contents.xhtml#rch15)


    [Conclusion](#Contents.xhtml#rch15)'
