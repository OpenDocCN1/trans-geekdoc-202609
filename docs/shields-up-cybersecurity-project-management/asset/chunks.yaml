- raw: 'Two additional principles guide successful project managers: work with a sense
    of urgency and front-end load work. If you have ever thought, “I wish I had one
    more day to ….,” then these two other principles will help you deliver on time.
    Projects become late one day at a time; therefore, we try to maximize at a sustainable
    pace what we accomplish daily. We see this principle in successful project managers
    where action-oriented meetings start on time, with shorter durations. Meetings
    are scheduled for tomorrow rather than next week, and so on. Business and technical
    leaders notice not only your sense of urgency but also your team. Model a sense
    of urgency, and this principle will permeate your team’s project behavior.


    ***Front-End Loading***


    The second principle that reduces risks and issues is to front-end load: bringing
    forward work (where it makes sense) to create space in the future to leverage
    opportunities or manage risks and issues. Front-end loading is not a new concept
    but one that is proven to work; my father used to say: “Don’t put off until tomorrow
    what you can do today.” We can pull forward low-risk tasks such as setting up
    your templates (e.g., project charter infographic, design document, PLO duration
    estimates workbook, schedule, meeting minutes, status reports, T2P tracker, and
    testing defects register) and booking your meeting rooms (e.g., weekly meeting
    with the team, risk management meetings, and status meetings). Much of this work
    can be done after hours when your energy is low (e.g., setting up your team collaboration
    site). Successful project managers often work overtime at the start of the project;
    working long hours early in the project is much easier than working long days
    and weekends at the end of the project when stress is high! Front-end load and
    you are less likely to wish for one more day. Front-end loading and working with
    a sense of urgency allows you to learn more about your project sooner in the project
    life cycle. These two principles are effective and are noticed on projects. Incorporating
    a sense of urgency, front-end loading, and the PMBOK® Guide’s principles into
    your practice will improve your project success rate and inspire confidence.


    PRINCE2


    With a search online, one discovers that the PMP certification is widely respected
    and globally portable; however, the PRINCE2 project management framework is also
    popular ([PRINCE2.com](http://PRINCE2.com) 2021, 1). The UK government first released
    PRINCE2 (PRojects IN Controlled Environments) to guide public service technology
    projects in 1989. PRINCE2 includes processes, themes, and principles ([Figure
    5.3](#Chapter05.xhtml#fig5.3)). The PRINCE2 model is prescriptive; the reader
    is guided about what should be done on the project, when it should be done, and
    who should complete the task.


    ![images](images/fig5.3.jpg)


    ***Figure 5.3 PRINCE2 framework***


    Individuals can get certified in PRINCE2 through the AXELOS organization: PRINCE2
    Foundation or the more extensive PRINCE2 Practitioner. When comparing PRINCE2
    with the PMBOK® Guide v6 and v7, there are many similarities, such as following
    processes while guided by principles. The PMBOK® Guides have increasingly included
    agile components, while the PRINCE2 method expanded to include PRINCE2 Agile.
    *Shields Up* is aligned with these process-based frameworks and agile principles.


    Agile Project Management


    Agile project management means different things to different people; some in the
    business see agile project management as being flexible and nimble in our plans
    and execution. However, the IT professional may equate agile project management
    with the Scrum delivery method ([Figure 5.4](#Chapter05.xhtml#fig5.4)). Agile
    project management has been widely studied, and its benefits and challenges are
    increasingly understood (Azanha, Argoud, de Camargo Junior, and Antoniolli 2019,
    121–142; Drury, Conboy, and Power 2012, 1239–1254; Gemino, Horner Reich, and Serrador
    2021, 161–175; Serrador and Pinto 2015, 1040–1051). Agile project management can
    be effective under the right circumstances. Agile project management is best used
    when there is ambiguity in (i) what needs to be delivered or (ii) how to deliver
    the product or service. We use agile project management when our project faces
    high volatility and uncertainty (PMI 2021, 101).


    A Scrum begins when a product owner (project sponsor) prioritizes work in the
    product backlog, and the project team selects and plans the amount of work they
    can complete during one sprint (e.g., typically two weeks to one month). After
    the team plans the work, the project moves to the sprint cycle, where the product
    or service is designed, built, tested, and delivered to the product owner. Iterative
    work and continuous improvement/learning are inherent in agile project management
    to adapt to changes and feedback to deliver the right amount of value. The team
    then returns to the prioritized backlog to begin a new sprint with planning.


    One can overlay the waterfall project management approach onto the Scrum method
    ([Figure 5.4](#Chapter05.xhtml#fig5.4)) to see that the project work is similar
    in an agile and waterfall approach (e.g., plan, design, and build). Sound project
    management activities work in either approach: adaptive or predictive project
    management. Therefore, project management fundamentals are transferable to other
    project management and managerial approaches.


    Agile project work is guided by the Agile Manifesto ([Figure 5.5](#Chapter05.xhtml#fig5.5)):
    4 values and 12 principles ([AgileManifesto.org](http://AgileManifesto.org) 2001,
    1). The Scrum project management delivery method is intended to be coupled with
    the Agile Manifesto; delivering projects with the Scrum method will be challenging
    without the foundation of the Agile Manifesto guiding actions and decisions.


    ![images](images/fig5.4.jpg)


    ***Figure 5.4 Agile project management with the Scrum***


    ![images](images/fig5.5.jpg)


    ***Figure 5.5 Agile manifesto***


    Agile project management with the Scrum delivery method is perhaps one of the
    most popular adaptive project management approaches to develop, deliver, and sustain
    “complex projects” (Schwaber and Sutherland 2017, 3). A search online will show
    you other adaptive/agile approaches like Kanban, DevOps, and extreme programming.


    While most cybersecurity projects do not need the Scrum agile delivery method
    (e.g., they usually have low ambiguity levels), the *Shields Up* hybrid project
    management approach works well when leveraged with the Agile Manifesto’s principles
    and values. There are other project management approaches related to agile project
    management that we might add to our hybrid project management tool kit: lean project
    management and Lean Six Sigma.


    ***Lean Project Management***


    Lean operations and management are recurring themes in the press and this book;
    we do not want to do more on our projects than necessary. Lean is all about efficiency:
    doing the right things right. We try to reduce waste in our projects and deliver
    value for our stakeholders. We include a continuous improvement cycle to become
    leaner and more effective. Increasingly, many technology projects we implement
    have lean objectives: for example, we automate business processes to reduce steps
    for our customers. We should not be surprised that lean principles have been applied
    to project and information systems management.


    Microlearning


    Following are some activities to enhance your professional development journey:


    • Search for “lean operations” and “lean management” to see what our customers
    are reading and their expectations to become leaner through technology and automation.
    IT holds the solution to becoming lean, and cybersecurity specialists protect
    the lean solution.


    • Follow a lean operations or management blog to keep abreast of business trends.'
