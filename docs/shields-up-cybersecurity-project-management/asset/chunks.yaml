    事实上，项目管理是许多网络安全项目的隐含交付载体：“无论项目类型如何，都应在项目管理中考虑信息安全”（ISO 2018a, 10）。ISO 网络安全标准中的信息安全与项目管理语言紧密相连，例如“确保信息安全在信息系统的开发生命周期内被`设计和实现`”（ISO
    2018a, 18）。信息系统经历一个系统生命周期：启动、规范、设计、开发、测试、实施、使用、维护，并最终退出服务和报废（ISO 2018a, vii）。从“启动”到“实施”反映了项目生命周期，而从“使用”到“报废”则反映了运营。我们在
    ISO 标准中既看到了项目生命周期，也看到了运营生命周期。由于项目管理固有存在于 ISO 27000 信息安全管理标准体系中，因此当一个人精通项目管理时，在实施网络安全项目将更具成功。


    ISO 27000 系列网络安全标准是全面的，但缺乏成熟度模型；相反，ISO 网络安全标准可以被视为成熟度模型的最高层——第五级（Leal 2015, 2）。只需对
    ISO 27000 信息安全标准进行粗回顾，就能发现传统的瀑布式项目管理已深根其中。使用传统的项目管理交付方法和工具交付网络安全项目，将使你的项目符合 ISO
    27000 系列网络安全标准，并提高项目成功的概率。


    # IT 基础设施库（有限制，AXELOS）


    IT 部门为组织提供 IT 服务，如电子邮件、人力资源应用程序、效率应用程序以及 IT 生态系统的安全性。IT 领导层建立政策和程序来指导技术生态系统的生命周期管理。IT
    领导层通常依赖外部标准和框架来指导其行动。其承诺是，如果组织遵循某个框架，业务活动可以变得更加预测和稳定，同时保持所需的质量水平。组织遵循的重要 IT 框架之一是
    `ITIL`。虽然存在其他 IT 框架（例如 `COBIT` 和 `ISO IEC 20000`），但 `ITIL` 可能是最流行且应用广泛的。


    ## ITIL 概述


    什么是 `ITIL`？它是一个最佳实践的框架，用于交付和管理如威胁检测、电子邮件和项目管理等 IT 服务。`ITIL` 提供了一种全面、整体且系统的方法，用于交付价值、管理风险和质量、实施精益实践，以及构建一个支持增长和韧性的预测且稳定的技术生态系统。`ITIL`
    可以引导团队实现自动化、改进 IT 服务并将技术整合到业务实践中。`ITIL` 交付和管理技术的方式是全球最流行的方法之一（Berger, Shashidhar,
    and Varol 2020, 1），因此被视为全球事实上的标准（Tsunoda and Kino 2018, 1）。`ITIL` 的技术管理方式是 `Shields
    Up` 的理论基础，我们在此基础上构建了一种针对网络安全项目的混合项目管理方法。


    `ITIL` 的知名度吸引了研究兴趣（Berger et al. 2020, 1–6; Göbel and Cronholm 2015, 1–22; Marrone
    and Kolbe 2011, 363–380; Ramakrishnan 2014, 159–168），并识别出 `ITIL` 的以下优势：


    * 通过遵循经过验证的最佳实践和流程改进 IT 服务（Göbel and Cronholm 2015, 6）。

    * 随着 `ITIL` 采用的成熟，提高收益的实现（Marrone and Kolbe 2011, 377）。

    * 通过交付满足业务需求的服务提高客户满意度（Marrone, Kiessling, and Kolbe 2010, 381）。

    * 提高生产力，例如首次通话解决率的提升（Marrone et al. 2010, 378; Berger et al. 2020, 1）。

    * 通过通用术语改进沟通（Göbel and Cronholm 2015, 6）。

    * 提高投资回报率（Marrone et al. 2010, 378）。

    * 降低 IT 成本（Göbel and Cronholm 2015, 6）。


    `ITIL` 被广泛采用并增长部分归功于其潜在收益；事实上，我们看到了如“ITIL 基础是今年获得人数最多的认证”（Global Knowledge 2021）之类的陈述。2019
    年发布的 `ITIL` v4 与之前的版本有重大不同。它重塑了与客户、流程的关系，并接受了新的工作方式。


    ## ITIL 服务价值链


    组织通过考虑服务价值链开始他们的 `ITIL` 旅程。价值流是创建和交付产品服务的流程（AXELOS 2019, 66）。简单来说，当一个机会或需求触发新的服务（例如一个项目）时，服务价值链流程就开始了。


    ![images](img/fig4.7.jpg)

    *图 4.7 ITIL 服务链*


    六个服务价值链活动包括（AXELOS 2019, 66）：


    1. **计划 (Plan)**：对项目范围和服务的四个个维度达成共同共识。

    2. **改进 (Improve)**：持续改进整个价值链中的产品、服务和流程。

    3. **参与 (Engage)**：与利益相关者建立良好关系，以更好地理解他们的需求。

    4. **设计与转换 (Design and transition)**：实施满足利益相关者对质量、成本和上市时间预期的产品和服务。

    5. **获取/构建 (Obtain/build)**：在需要的时间和地点提供服务或产品。

    6. **交付与支持 (Deliver and support)**：根据约定的要求和性能规范支持产品和服务。


    虽然这些服务价值链活动看起来是顺序的，但规划、持续改进和参与利益相关者的活动贯穿整个服务价值链。


    这些服务价值链活动发生在服务管理的四个维度背景之下，这些维度为服务的管理的不同视角提供了洞察。服务的管理维度需要在从微观（项目）级到宏观（组织）级的服务进行规划和管理（AXELOS
    2019, 36）：


    * **组织与人员 (Organizations and people)**：服务价值链活动发生在组织环境中，并通过人的努力实现。在规划和执行活动（例如，网络安全项目）时，必须考虑组织的治理和通信系统。

    * **信息与技术 (Information and technology)**：在规划和交付服务价值链活动时，会考虑所需的信息、知识和技术。考虑信息、知识和技术维度的可行性和影响，以管理和交付服务。信息和技术维度是大多数网络安全项目的核心。

    * **合作伙伴与供应商 (Partners and suppliers)**：在规划和执行服务价值链活动时，会考虑与其他组织的关系。外包、合作伙伴关系以及与外部领域专家（SMEs）的其他关系在网络安全项目中很常见，并在网络安全项目中予以考虑。

    '
