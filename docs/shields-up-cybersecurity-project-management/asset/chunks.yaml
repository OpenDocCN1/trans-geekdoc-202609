  trans: '


    在*Shields Up: Cybersecurity Project Management*一书中，Greg 以巧妙且科学的方式在当代项目格局的复杂丛林中开辟出一条道路，为所有可能在现代项目管理中遇到挣扎的人士提供了全功能的路线图。但他的涵盖范围远不止于这些领域。他对业务合作伙伴期望、技术变化速度以及网络安全重要性日益增加等当前问题的框架和分析都是稳如磐石并经过了广泛的研究。他还投入了大量精力通过设计练习来吸引读者，帮助他们调整对本书的理解，并将其应用于他们今日所面临的网络安全项目管理困境中。


    *Shields Up* 平衡得非常好，包含了对瀑布式、`Agile`（敏捷）和精益项目管理方法意义深度的总结，同时保持了足够明快的节奏，让你欲不释手。我发现自己被吸引着读下去。Greg
    包含的细节恰到好处，并提供了许多实用的参考，使其成为一份完美的指南，而绝不会变成枯燥的读物。


    混合项目管理是当今商业环境中必不可少的能力，Greg 优雅地详述了一种灵活的方法，将预测型和自适应项目管理学科的精髓进行混合匹配，允许读者匹配技术以适应他们自己的网络安全项目语境。


    对于经验丰富的项目管理专业人士，*Shields Up* 对至关重要的实践提供了极其清晰且简洁的解释，例如项目启动文档结构、三点估算、风险和问题框架以及质量管理。我发现自己多次回头查看文本，记录了笔记和幻灯片，然后立即在我的最新项目中实施了许多
    Greg 的混合项目管理实践！


    正如你将在阅读这部作品时将观察到的那样，*Shields Up* 既轻量又极具实用性。我觉得这种方法的直接和简单令人耳目一新。就像一个准备正宗的“手球（sugo）”或一次标准的俯卧撑，项目管理的许多基础知识虽然许多人表面上理解了，但大多数人执行得很糟糕。正确掌握这些知识虽然困难，但却意味着获得卓越的结果。在书中，Gregory
    Skulmoski 博士向你展示了切实有效的方法，以便在你的网络安全项目中产生卓越的成果。


    —Chris Walker, SHRM-SCP


    ## 前言


    *数字化业务转型和新兴的网络物理系统创造了前所未有的安全风险*


    —Gartner 2020a, 1


    *Shields Up: Cybersecurity Project Management* 满足了网络安全专业人士开发项目管理能力以领导并在其网络安全项目中取得成功的需求。在第四次工业革命创新和新冠引发的数字化转型项目的推动下，技术的采用和普及正在增加并可能加速。*Shields
    Up* 旨在为网络安全和其他技术专业人员提供一份指南，用于计划、开发、管理和实施网络安全项目。


    *Shields Up* 分为两部分：(i) 技术和网络安全需求的增长以及 (ii) 混合项目管理。第一部分在创新交付方法的语境下构建了项目管理框架；即为了实现战略目标，组织越来越多地启动项目。技术预测显示对技术和网络安全的需求在增加。是什么驱动了技术的需求？未来的预见（检查可能的未来场景）是什么？


    ## 第一部分：网络安全项目需求的增长


    敏捷且对变化的预期和转瞬即逝的机会反应的组织利用技术获取竞争优势。他们可能实施技术来交付新产品和服务，或者通过消除浪费来提高流程效率。通过使流程精益化并减少过程中的材料或时间，组织试图满足客户。满意的客户购买商品和服务并进行重复购买。因此，优化和数字化是常见的业务目标。组织还通过技术协作并连接人员、系统和数据；我们看到超互联正在增加，扩展的数字生态系统正在形成。一旦实施了数字化转型项目，组织就渴望基于分析的决策能力；更多交付预期缩短的项目在第一次就做对！


    应对日益增长的需求，组织还看到对网络安全服务的需求激增，范围从保护数据资产到将新技术加入组织的威胁监控系统。业务合作伙伴成为创新的合作者，重视网络安全服务，并支持增加网络安全预算以确保其技术驱动的创新安全。然而，随着网络安全预算的增加，IT
    领导层被要求满足业务预期。该行业面临的问题之一是严重的网络安全技能缺口；由于缺乏合格的网络安全专业人员（包括项目经理），组织难以满足网络安全服务的需求。许多组织有空缺的网络安全职位，且招聘时间很长。这种动态产生是，网络安全专业人士被要求领导常规的网络安全项目，将更复杂的网络安全项目留给经验丰富的项目经理。


    组织不仅面临实施和管理更多技术、保持系统和信息安全以及在网络安全职位空缺的情况下完成工作的挑战，它们还可能看到更多的网络安全监管。政府和监管机构正在引入网络安全法规，某些组织有义务遵守。网络安全成熟度模型提供了通向合规和成熟度目标的路径和指导，例如`网络安全能力成熟度模型`（`C2M2`）。网络安全合规驱动了更多网络安全项目，如内部和外部审计。


    组织利用网络安全及相关标准和框架来履行网络安全期望和要求。有两个主要的网络安全标准可以指导组织优化其服务：由美国标准与技术研究所（`NIST`）发布的《改进关键基础设施网络安全框架》和《ISO
    27001 信息安全管理》（National Institute of Standards and Technology 2018, 1–55）。IT 部门可以遵循《基础技术服务库》（`ITIL`）标准，通过规划、设计、开发、测试、实施、运行和优化阶段来满足对服务或产品的需求，为最终用户交付价值。虽然项目管理被明确嵌入
    `ITIL` 中，但项目管理标准指导通过一系列交付方法交付价值，从预测型的传统的（瀑布式）项目管理交付方法到自适应敏捷技术如 `Scrum` 和 `Kanban`（看板）。《项目管理知识体系指南》（`PMBOK®
    Guide`）和 `PRINCE2` 是两个由专业级认证支持的重要项目管理标准。网络安全、`ITIL` 服务管理和项目管理的核心是质量管理以及 `ISO 9001`
    质量管理标准，它引导组织沿着持续改进的路径前进。


