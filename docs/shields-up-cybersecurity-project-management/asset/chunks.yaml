- raw: '• What can you expect from your industry and cybersecurity regulation investigation
    in the next two to five years? Understanding what may be coming to your industry
    may help you proactively prepare for new cybersecurity regulations.


    • Search for “how to conduct a cybersecurity audit.” Consider asking your manager
    to lead an audit project.


    • Look for cybersecurity audit tools and checklists.


    Cybersecurity Maturity Advancement


    Cybersecurity maturity models allow an organization to assess its current capabilities
    and position them at different levels. By developing a cybersecurity capability
    baseline, organizations can identify gaps and targets to reach. Currently, many
    cybersecurity maturity models ([Table 3.1](#Chapter03.xhtml#tab3.1)) have been
    compared and analyzed (Payette, Anegbe, Caceres, and Muegge 2015, 1–9; Rea-Guamán,
    San Feliu, Calvo-Manzano, and Sanchez-Garcia 2017, 1–15; Garba, Siraj, and Othman
    2020, 1–8).


    Numerous cybersecurity maturity models exist, such as the NIST (see [Chapter 4](#Chapter04.xhtml#ch4))
    and the Cybersecurity Capability Maturity Model (C2M2). The C2M2 can be used by
    any organization of any size or type to evaluate its cybersecurity position and
    make improvements (U.S. Department of Energy 2021, 12). The C2M2 model has 5 objectives,
    10 domains, and 3 maturity levels that an organization can use to assess its cybersecurity
    maturity ([Figure 3.1](#Chapter03.xhtml#fig3.1)).


    One can conduct an audit to assess the organization’s maturity level for each
    of the 10 domains. Analyzing the audit results, leadership can prioritize and
    establish maturity improvement targets for prioritized domains. Achieving these
    improvement goals can trigger new cybersecurity projects.


    ![images](images/fig3.1.jpg)


    ***Figure 3.1 C2M2 structure***


    ***Organizational Cybersecurity Certification***


    Some organizations may be required to become certified within a cybersecurity
    maturity model given the increasing and persistent cybersecurity threats and accompanying
    regulation efforts. For example, over 300,000 contractors and subcontractors work
    with the U.S. Department of Defense; most contractors require level 3 CMMC certification
    for contract eligibility (Horan 2020, 1; Fox 2021, 2). Those contractors who work
    with the U.S. Department of Energy will also need to certify against the C2M2
    soon (Schwartz 2019, 1). To sell to the U.S. federal government, some technology
    manufacturers must be NIST compliant (Allied Telesis 2021, 1). Therefore, expect
    organizations to comply with frameworks and subsequent auditing increasingly;
    both sources of cybersecurity projects are coming our way!


    Cybersecurity Skill Shortage


    The very nature of work is changing due to a “reskilling revolution” where the
    shelf life of people’s skills is reduced, requiring regular upskilling (Skulmoski,
    Langston, Patching, and Ghanbaripour 2020, 3). Organizations report challenges
    finding competent people (World Economic Forum 2020, 11). The digital disruption
    leads to digital skills gaps generally and for project managers to implement digital
    projects (PMI 2018, 6). Experts predict a sustained shortage of global project
    management talent through the next decade (PMI 2017b) exacerbated by the increase
    in demand for competent cybersecurity project positions (Oltsik 2020, 49). There
    is a shortage of project managers, but what about the cybersecurity skills shortage?


    ***Table 3.1 Cybersecurity maturity models***


    | **Model** || **Focus** |


    | --- | --- |


    | National Institute of Standards and Technology Cybersecurity Framework (NIST
    CSF) || The NIST CSF was first released in 2014 and includes five functions and
    five “implementation tiers” (e.g., maturity levels) |


    | C2M2 || First published in 1996 by the U.S. National Security Agency, it includes
    129 base practices across 22 process areas, with five maturity levels |


    | Electricity Subsector Cybersecurity Capability Maturity Model (ES-C2M2) || The
    U.S. Department of Energy introduced the ES-C2M2, a subset of the C2M2 model focused
    on energy |


    | Oil and Natural Gas Subsector Cybersecurity Capability Maturity Model (ONG-C2M2)
    || The ONG-C2M2 was designed specifically for the oil and gas sector with five
    maturity levels and is a subset of the C2M2 |


    | Community Cyber Security Maturity Model (CCSMM) || Developed by the Center for
    Infrastructure Assurance and security in 2006, it includes five maturity levels
    |


    | National Initiative for Cybersecurity Education (NICE)-Capability Maturity Model
    || The NICE-Capability Maturity Model was established in 2008 to develop cybersecurity
    staff and has three maturity levels |


    | ES-C2M2 || The U.S. Department of Energy released their ES-C2M2 in 2012 with
    10 domains and 3 maturity levels |


    | Federal Financial Institute of Examination Council-Capability Maturity Model
    (FFIEC-CMM) || The FFIEC-CMM was released in 2014 to guide financial institutions
    to improve their cybersecurity. The model has five domains and five maturity levels
    |


    | African Union Maturity Model for Cybersecurity (AUMMCS) || The AUMMCS was introduced
    in 2014 and had three domains and four maturity levels |


    | Systems Security Engineering Capability Maturity Model (SSE-CMM) || A descriptive
    model published in 2014 by the U.S. Department of Energy and is organized into
    10 domains with 4 maturity levels |


    | Computer Security Incident Response team (CSIRT) || The European Union Agency
    for Network and Information Security (ENISA) published the CSIRT maturity model
    with three tiers and four categories |


    | Cybersecurity Maturity Model Certification (CMMC) || The U.S. Department of
    Defense has implemented the CMMC framework to normalize and standardize the federal
    government’s defense industrial base. The model has 5 levels, 43 capabilities,
    and 171 practices |


    | CERT Resilience Management Model (CERT-RMM) || The CERT RMM guides organizations
    to assess business continuity, security, and IT operations |


    Finding qualified cybersecurity professionals is one of the most challenging of
    all technical professions (Morgan 2019, 4–6). “Simply put, it is more difficult
    to hire security professionals today than it was even three or four years ago”
    (Scholtz 2021, 13); indeed, the cybersecurity profession has been characterized
    as in a deepening “crisis” (Oltsik 2020, 5). The unemployment rate for cybersecurity
    professionals is zero percent and has been so since 2011 (Morgan 2019, 6). The
    high demand for cybersecurity professionals has attracted unqualified applicants
    where less than one in four were qualified (Morgan 2019, 2).


    Compounding the problem of the cybersecurity skills gap is that the cybersecurity
    role is changing to align with changing technologies and stakeholder expectations
    (Scholtz 2021, 14). We see specializations such as security strategist, vulnerability
    analyst, machine learning cyber analyst, cyber lawyer, and cybersecurity project
    manager. Now CISOs face a dual problem related to cybersecurity staffing: not
    only is it challenging to find suitable talent, but the cybersecurity job requirements
    are also shifting to account for future needs (Scholtz 2021, 14).


    One strategy to mitigate the cybersecurity skills shortage is to delegate some
    cybersecurity functions to the business, corporate, and other IT teams (Scholtz
    2021, 15). An emerging corporate value is everyone has a role in cybersecurity
    since the technology ecosystem is hyperconnected and complex (Morgan 2019, 2).
    For example, we may see our HR training unit provide cybersecurity awareness training
    to all staff rather than having a cybersecurity SME deliver the training. We cascade
    cybersecurity tasks to others where low-complexity cybersecurity projects are
    assigned to competent technical team members rather than an experienced project
    manager.'
