  trans: '

    在网络安全领域达到“精通”水平通常需要三到五年的时间（Oltsik 2020, 6）。网络安全专业人士可能会开发并维护与其职责直接相关的领域的技术能力。在建立技术熟练度的同时，网络安全专业人士可以开始进行全局规划，并在领导力、沟通和业务实践方面开发业务相关的能力（Oltsik
    2020, 17）。网络安全专业人士可以预测未来的业务需求，并针对其行业感兴趣的新兴技术开发能力。例如，预计将广泛采用流程自动化和高级分析；因此，在这些领域的发展将有利于网络安全专业人士。精益（Lean）和六西玛（Six
    Sigma）技术可以改进流程并减少统计变异（Stanton, Gough, Ballardie, Bartam, Bamber, and Sohal 2014,
    16），并支持流程自动化项目。进行职业规划有多种方法；但是，让我们先看看可以指导职业规划的可持续职业。


    ### 可持续的项目导向型职业


    我们研究了项目导向型的可持续职业，并确定了提高职业可持续性的关键行动（Skulmoski et al. 2020, 11–12）。可持续的职业是指工作以可持续的速度进行，并且生活保持平衡。人们从一个项目移动到另一个项目，而没有无计划的干扰。职业可持续性是一个广泛的问题，范围从面对离开拳台的拳击手，到为了抚养孩子而休职的母亲，再到需要赢得诉讼以留工作的律师。技术领域的中小型企业（SMEs）面临着跟上新兴技术并掌握其软件系统中不断扩展的数字功能组合的挑战。在零工经济和第四次工业革命中，我们日益以项目为导向，从一个项目转向另一个项目，有时从一个组织转向另一个组织。


    我们发现职业可持续性取决于两个因素：人脉网络和技能提升（Skulmoski et al. 2020, 76）。与其他专业人士建立人脉有助于人们发现新机会。保持联系可以增加能力并开启机会；从而提高职业可持续性。技能提升或扩展能力是另一个职业可持续性的驱动力。随着学习满足新兴需求的技能（如人工智能与机器人的协作），我们提升了职业可持续性。因此，具有远见的网络安全专业人士将投入时间来规划和培养自己的职业。


    技术和网络安全技能缺口问题已得到很好的研究，因为它是一个长期的且可能是棘手的问题。网络安全专业人士很幸运，有许多路径可以保持胜任，例如在技术平台中追求技术认证（例如
    `Azure`）或在网络安全框架中追求认证（例如 `CISSP`）。遗憾的是，网络安全技能缺口问题的部分与职业规划不当有关：“正如本报告及以往所示，组织和网络安全专业人士没有从战略角度来看待这一职业。持续缺乏培训、职业发展和长期规划。结果是网络安全专业人士往往在缺乏指导的情况下浑混过职业生涯，在工作之间跳槽，并临时增强技能集，而不是以任何系统性的方式”（Oltsik
    2020, 5）。也就是说，许多 IT 专业人士没有采取战略性方法进行职业规划。有些人在 `ITIL` 框架内使用 `T-Career` 模型，将能力演进的可视化（DuMoulin
    2019, 7）。


    ### 规划 T-型职业


    如果我们观察 IT 同行的职业晋升，就可以预见随时间的职业发展。人们将技能发展成技能集，并可以将其说明为我们 IT 同行的职业晋升……（此处重复多句，略）……等等，参考图
    A4.1）（参见 Demirkan and Spohrer 2015, 13）。`T` 字的水平部分代表业务技能，垂直部分代表技术技能。`I-型`仅代表技术技能，而
    `T-型`代表两者的平衡。一些网络安全专业人士会增加如 `Cisco 认证网络安全`或`认证道德黑客`等认证。


    首席信息安全官（CISO）需要技术技能基础，并更强调业务技能，以管理整个 `ITIL 服务价值系统`，该系统包括项目和运营，旨在为组织交付价值。CISO 工作要求的这三个例子都涉及项目管理：交付创新、数字化转型和持续价值的基础。


    ### 职业规划流程


    如果操作得当，职业规划是一项经常活动，例如在年度绩效考核期间，这样组织就可以支持你的发展目标（Oltsik 2020, 6）。你的职业规划可以输入到绩效评估中。有些人将年度绩效考核视为行政负担；然而，职业规划可以通过战略性方法推动职业发展。就像项目成功一样，伟大的职业不会偶然发生；伟大的职业是经过规划、管理和控制的。职业规划可以通过三个步骤完成：


    1. **自我评估**：招聘经理在招聘选拔过程中使用各种“清单”来评估能力和天赋。许多此类清单在职业规划期间可用，以获得额外的洞察（例如，在网上搜索职业和职业规划清单，以获得更正式的自我评估方法）。这些通常可以帮助识别优势和需要发展的领域。你处于能力发展阶段的什么位置？你的职业发展形状是
    `I` 型，还是正在形成一个用于平衡发展的 `T-型`职业？

    '
