    [Testimonials](#Contents.xhtml#rfm1)


    *Shields Up* was reviewed by a heterogeneous group of diverse experts in technology,
    cybersecurity, and project management. The project management reviewers include
    both researchers and thought leaders in the project management specialty not only
    with decades of experience but also practicing as technology project managers.
    The cybersecurity reviewers are not typical book reviewers (e.g., academics);
    instead, these reviewers work in cybersecurity and related technical domains,
    resulting in a practical understanding of project management and cybersecurity.
    Therefore, these technology innovators know exactly the challenges and demands
    of cybersecurity projects and are well-placed to provide critical reviews such
    as the following:


    **“Must Read”**


    “Shields Up: Cybersecurity Project Management *is comprehensive and incredibly
    timely, given the ever-increasing cybersecurity threat landscape. It should be
    a must-read for all IT project managers because of the importance of ensuring
    that all IT projects clearly and deliberately address cyber risks as just a normal
    part of the process. You stated it perfectly when you wrote, ‘It is good practice
    to build cybersecurity into our projects rather than adding cybersecurity as the
    project prepares to go-live.’ The most important takeaway is the multitude of
    methodologies and frameworks that IT professionals look to for guidance can be
    nicely aligned and integrated into a coherent delivery model without compromising
    quality or efficiency. I must commend Greg on a well-written and comprehensive
    guide for tackling this new digital world we live in Well done!”*—**Jason Roos,
    Chief Information Officer, King Abdullah University of Science and Technology,
    Saudi Arabia**


    **“Perfect Alignment”**'
