  trans: '

    质量保证旨在为质量要求将得到满足提供信心。大多数标准（例如 `ISO`、`NIST` 和 `C2M2`）都指导组织包含质量保证和控制活动。组织提供培训、模板、检查清单和流程来交付正确的质量。然后，我们按照检查清单执行工作，例如配置虚拟服务器。工作完成后，我们进行质量控制：发现并修复缺陷。同样，我们依赖于培训、模板和检查清单，并遵循流程来判断是否交付了正确的质量。我们的质量管理采用
    A-B-C 方法：质量保证（Assurance）、**之前**（Before）、质量控制（Control）。质量管理流程可见于各行各业的领先标准中；因此，通过应用这种简单的质量管理方法，你可能在大多数时间内符合大多数标准中的大多数质量领域。可以预计监管机构和保险公司会针对网络安全特别是通用技术方面要求定期审计。审计可以是一种质量控制项目（例如
    `NIST Framework` 审计和合规流程）。领导一个审计项目有助于开发新的项目管理能力，并增强对技术生态系统的整体理解。


    ![images](img/fig4.2.jpg)

    *图 4.2 质量管理流程*


    ## 网络安全框架


    网络安全框架是用于管理网络安全风险的标准、指南和最佳实践的集合。框架可以提高可靠性和预测性。这里简要介绍两个领先的网络安全标准，并将其与项目管理在满足这些标准方面的关键作用联系起来：


    1. 用于改进关键基础设施网络安全的 `NIST Framework`；

    2. 用于信息安全控制的 `ISO 27000 系列`。


    这些标准被广泛采用，影响力日益增长。它们包含了从项目到运营的整个策略生命周期，以持续改进为导向，带来了新项目、新机会和服务。组织利用框架识别需要加强的领域或需要实施的新流程。遵循这些框架的组织通过持续改进实践，可能更好地应对日益增长的网络安全项目需求。


    *美国国家标准与技术研究院网络安全框架*


    备受推崇的改进关键基础设施网络安全的 `NIST Framework` 旨在保护交通、健康、能源、食品、水、通信、银行和金融等关键基础设施（美国国家标准与技术研究院
    2018，5）。`NIST Framework` 指导关键基础设施的网络安全。任何努力提高网络安全的组织都可以使用它：“虽然此文档是为了改进关键基础设施的网络安全风险管理，但该框架适用于任何行业或社区的组织。该框架使组织无论规模、网络安全风险程度或技术水平如何，都能应用风险管理原则和最佳实践来提高安全韧性”（美国国家标准与技术研究院
    2018，5）。


    网络安全防御的基础是通过五个功能和相关类别保护组织的资产（见 图 4.3）。你可能会被要求参与并领导这些任何一个领域的项目；网络安全项目的来源是巨大的。


    ![images](img/fig4.3.jpg)

    *图 4.3 NIST 网络安全框架：功能与类别*


    类别揭示了网络安全目标的范围，并由 108 个子类别支持（参见 `附录 1` 框架核心示例）。在这个功能、类别和子类别的框架内，我们能更好地理解现状以及我们组织的改进目标在哪里。`NIST
    Framework` 包含了实施层，旨在为实现网络安全成熟和目标达成提供路径（`图 4.4`，来自美国国家标准与技术研究院 2018，15–17）。


    ![images](img/fig4.4.jpg)

    *图 4.4 NIST 网络安全能力成熟度*


    组织使用 `NIST Framework` 记录其当前的网络安全状况（`图 4.5`，来自 PMI 2021，6），然后启动项目将其带入目标状况（例如，解决第
    3 层差距，或从第 3 层进展到第 4 层，或符合外部机构基于 `NIST` 的指南）。因此，我们可以预计项目将提高组织在这些类别中的能力，并使实施项目的组织通过
    `NIST` 成熟层实现成熟。*Shields Up* 将帮助你计划、管理和交付项目，以通过 `NIST` 成熟层。


    ![images](img/fig4.5.jpg)

    *图 4.5 通过项目改进网络安全*


    `NIST Framework` 与项目管理对齐，遵循正式的项目管理方法有助于你符合框架。`NIST Framework` 包含一个以项目为导向的部分——建立或改进网络安全计划——通过项目交付方法将组织带入目标状况（美国国家标准与技术研究院
    2018，21–22）。本书帮助你计划和实施与 `NIST Framework` 相关的网络安全项目。


    ## ISO 27001：信息安全管理


    `ISO 27000` (`ISO 2013b`) 是一套信息安全标准，用于规划、实施、维护和改进组织的信息安全管理体系（见 `图 4.6` `ISO 27000`
    标准概述）。通常，组织从非正式且无组织的网络安全方法开始，然后采用如 `ISO 27000` 等标准来系统地管理信息安全威胁（ISO 2013a，1–32）。


    `ISO 27001` 要求被组织成 114 项控制措施，每个措施解决特定的网络安全风险（例如，公共网络上应用服务的安全）。这些控制措施被分为 14 个附录/组（从附录
    5 开始），见 `图 4.6`。这些控制措施指导组织改进其网络安全。组织作为持续改进努力的一部分确定当前和目标状况。


    ![images](img/fig4.6.jpg)

    *图 4.6 ISO 信息安全标准*


    特别值得关注的是控制措施 `A.14 系统获取、开发和维护`，因为它包含了项目管理活动，例如：


    `A.14.2 开发和支持过程中的安全`：设计中的安全；

    `A.14.2.7 外包开发`：管理外包项目以确保正确的网络安全质量；

    `A.14.2.8 系统安全测试`：测试安全功能；

    `A.14.2.9 系统验收`：测试系统按设计构建，包括信息安全测试和对最佳实践的遵循。


    本书与该标准中与项目管理相关的控制措施一致。因此，遵循这种项目管理方法将帮助你符合 `ISO 27001` 信息安全管理。

