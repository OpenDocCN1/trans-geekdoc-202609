    [Risk Register](#Contents.xhtml#rap3)


    The risk management process is reflected in the risk register and issue register.
    The risk register aligns with the risk management process: risk identification,
    analysis (qualitative), treatment, and monitoring and control ([Table A3.1](#Appendix03.xhtml#taba3.1)).


    ***Table A3.1 Risk register***


    | **Heading** || **Description** || **Example** |


    | --- | --- | --- |


    | Risk ID || Each risk has a unique ID || R-144 |


    | Date entered || The date the risk is entered into the risk register || February
    8, 2020 (write out the month to avoid confusion) |


    | Entered by || The person who entered the risk. Always assign to a single person
    and never a team || Debbie Hart, Project Manager |


    | Project || Project name || Big Data Lake |


    | Phase || Project phase || Plan |


    | Risk cause || The root cause of the risk || Due to manufacturing delays |


    | Risk event || The risk that may affect your project || There is a risk the servers
    may arrive late |


    | Risk effect || The consequence of the risk event || Resulting in a delay to
    the build phase |


    | Probability of occurring || The likelihood the risk may occur: high, medium,
    or low || Medium |


    | Impact || The impact to the project if the risk occurs: high, medium, or low
    || High |


    | Severity || Probability × Impact = Severity High = 3, medium = 2, and low =
    1 || 2 × 3 = 6 |


    | Risk prevention action || The actions to prevent the risk || Order servers that
    can be delivered on time |


    | Prevented by || The person responsible for preventing the risk || Barry Blanchard
    |


    | Risk mitigation action || The person responsible for mitigating the risk ||
    Change project logic to delay server configuration |


    | Mitigated by || The person responsible for mitigating the risk || Barry Blanchard
    |


    | Risk resolution date || The date the risk must be prevented, or the risk will
    become an issue || May 22, 2020 |


    | Risk status || The degree the risk is under control || Red: The risk cannot
    be prevented, and an issue is raised |


    | Issue ID || The issue ID if the risk cannot be prevented || I-22 |


    | Comments || Information about preventing, mitigating, and closing the risk ||
    Servers are 6 months behind production (February 22, 2020)Servers will be delivered
    late; confirmed with procurement (March 16, 2020) |


    Risk Narrative


    The project requires three servers for big data-intensive computing. However,
    due to a global thrust toward digital transformation, a global chip shortage results
    in manufacturing delays. The project manager has raised a risk (R-144) and updated
    the risk register ([Table A3.1](#Appendix03.xhtml#taba3.1)). Our infrastructure
    SME (Barry Blanchard) is managing procurement and has investigated the availability
    of other models of servers, but none are available to meet our schedule. To mitigate,
    the team will bring forward future work such as developing the test strategy and
    plan and creating the T2P checklist, to make room to catch up with server configuration,
    testing, and build activities. The project manager closes the risk, updates the
    risk register, and converts the risk to an issue (I-22).


    Issue Narrative


    The project manager opens an issue (I-22) that there is an issue that the servers
    will arrive four months late, resulting in a delay to the build phase ([Table
    A3.2](#Appendix03.xhtml#taba3.2)). The procuring SME has spoken with the vendor,
    and there is high certainty that the servers will arrive on or before August 14,
    2020. The project team has reviewed the schedule and will bring forward work such
    as working on the design, testing, and T2P documents to minimize the impact of
    the delay.


    ***Table A3.2 Issue register***


    | **Heading** || **Description** || **Example** |


    | --- | --- | --- |


    | Issue ID || Each issue has a unique ID || I-22 |


    | Date entered || The date the issue is entered into the issue register || March
    16, 2020 |


    | Entered by || The person who entered the issue || Debbie Hart, Project Manager
    |


    | Project || Project name || Big Data Lake |


    | Phase || Project phase || Plan |


    | Issue cause || The root cause of the issue || Due to manufacturing delays |


    | Issue event || The issue that affects your project || There is an issue the
    servers will arrive 4 months late |


    | Issue effect || The consequence of the issue event || Resulting in a delay to
    the build phase |


    | Impact || The impact to the project: high, medium, or low || High |


    | Issue resolution || The actions to resolve the issue || None |


    | Resolved by || The person responsible for resolving the issue || Barry Blanchard
    |


    | Resolution date || The date the issue must be resolved || August 14, 2020 |


    | Issue status || The degree the issue is under control || Red: The issue cannot
    be resolved in time |


    | Comments || Information about resolving and closing the issue || Servers are
    6 months behind manufacturing targets, but the vendor has promised a delivery
    date of August 14, 2020, resulting in a 4-month delay to the project (April 2,
    2020) |


    [APPENDIX 4](#Contents.xhtml#rap4)


    [Career Planning](#Contents.xhtml#rap4)


    Quality improvement is central in our frameworks and an integral component for
    continued success. Achieving quality improvement is more likely with a holistic
    approach: look for improvement opportunities throughout the Service Management
    System to optimize the value streams for our users (Limited, AXELOS 2019, 83–86).
    When one takes a holistic approach, the people involved in producing value can
    also benefit from assessing and developing their competencies. The cybersecurity
    professional can take a structured approach to improve their capabilities with
    career planning.'
