- raw: 'While CISOs are addressing immediate cyber threats, some are beginning to
    think about bad actors acquiring and using quantum computing power to facilitate
    their attacks resulting in an asymmetric advantage (Creese et al. 2020, 44). Others
    agree it is likely that the advances in technology “will overwhelm many current
    defenses” (Creese et al. 2020, 44). We see a trend that human involvement in cyberattacks
    (perpetrators and defenders) is decreasing; that is, machine learning algorithms
    and deep neural nets are being created to attack vulnerabilities, and defenders
    rely on these technologies to thwart the attacks since humans “cannot interact
    fast enough” (Creese et al. 2020, 30). Therefore, we see some CISOs moving away
    from 100 percent protection to supporting innovation with new technologies that
    have inherent risks to be competitive (Scholtz 2021, 11); that is, they are reducing
    their effort to remove 100 percent vulnerabilities and to improve their threat
    detection and response capabilities (Scholtz, 2021). We may see more emphasis
    on endpoint security solutions automated with AI and machine learning to detect
    and block malicious endpoint behavior (CyberEdge Group, LLC 2020, 26) and the
    emergence of cybersecurity mesh architectures (Groombridge 2021, 3).


    Delivery Expectations Are More Stringent


    Cybersecurity budgets are increasing to support cybersecurity strategy with expectations
    for improved governance through metrics related to cybersecurity activity and
    business success indicators to ensure that our cybersecurity investments are efficient
    and of high value (Scholtz 2021, 9). Indeed, there is a trend toward risk quantification
    to prioritize and target cybersecurity investments. Our CISOs commit to the board
    to deliver projects on time and on budget and manage change effectively and efficiently
    to bring innovation through the project pipeline (Hale 2017, 364; Scholtz 2021,
    9). Effective and efficient project management is the key to CISOs delivering
    what was promised.


    Business Partner Opportunities Emerge


    To achieve project success, we are encouraged to become more businesslike by supporting
    business outcomes rather than only protecting digital assets (Scholtz 2021, 4).
    We need to buy into business goals as if they were our own. That is, we need to
    move beyond technology; cybersecurity is increasingly seen holistically not only
    as a technical problem but also as a business problem as organizations become
    more mature with cybersecurity management (Hale 2017, 361–362). To be truly effective
    in our cybersecurity roles, we are encouraged to move beyond our technical focus
    and think like a CISO to improve our decision making (Scholtz 2021, 9); that is,
    we need to “learn the business inside and out” (Dhasarathy et al. 2020, 3). Therefore,
    *Shields Up* includes business-oriented exercises, microlearning, and career planning
    to assist the reader in developing a balanced set of competencies.


    Cybersecurity Budget Increases


    Generally, we will see IT budgets continue to grow as organizations put more resources
    into projects that deliver disruption, innovation, and transformation (Moyer 2021,
    3). It is not enough to implement technology; those technologies need to be managed
    and secured. Therefore, we see predictions that cybersecurity budgets will continue
    to increase (Claus 2017, 10; CyberEdge Group, LLC 2020, 20). Indeed, cybersecurity
    spending seems to be a never-ending cyber-arms race (CyberEdge Group, LLC 2020,
    9). One concludes that cybersecurity awareness and importance to the organization
    have also increased given cybersecurity budgets.


    One challenge with increased budgets is that demand for cybersecurity services
    exceeds capacity, putting innovation projects in jeopardy (Oltsik 2020, 42). While
    cybersecurity budgets are increasing, CISOs are asked to do more with less (Scholtz
    2021, 14); it appears that the demand for cybersecurity services can exceed the
    approved budgets for some organizations. CISOs are required to show value for
    the money spent on cybersecurity through KPIs and balanced scorecards, focusing
    on efficient and effective delivery of cybersecurity services and projects. Therefore,
    increased cybersecurity spending adds additional cybersecurity resources (if you
    can find them) and new initiatives often delivered through projects: more cybersecurity
    spending, more cybersecurity projects, and more emphasis on delivering and measuring
    value.


    Cybersecurity Regulation Expands


    We can expect more cybersecurity regulation (Creese et al. 2020, 37) for many
    reasons, such as the increase in the number of cyberattacks and the severity of
    damage cyberattacks can inflict. For example, AustCyber (2020, 1) estimates that
    a four-week disruption to the Australian economy due to a cyberattack could cost
    AUS $30 billion and a 163,000 job loss. The finance industry has recognized the
    magnitude of this potential loss: “Malicious actors are taking advantage of this
    digital transformation and pose a growing threat to the global financial system,
    financial stability, and confidence in the integrity of the financial system.
    Malign actors are using cyber capabilities to steal from, disrupt, or otherwise
    threaten financial institutions, investors, and the public” (Maurer and Nelson
    2020, 8). Maurer and Nelson (2020, 13 and 35) recommend more government regulation
    and cooperation to strengthen and protect the global financial system.


    Others predict cybersecurity regulations will become more stringent with heavier
    fines and shorter implementation times (Peacock 2020, 1). The Cybersecurity Act
    reinforces the European Union’s regulations and establishes a certification program
    for goods and services (European Commission 2021a, 1). Indeed, the United States
    has released an executive order to improve cybersecurity for all Federal agencies
    by “making bold changes and significant investments” (White House 2021, 1). Again,
    we predict more technology, cybersecurity attacks, and regulation. Unfortunately,
    cybersecurity regulation can be complex, fragmented, and conflicting, making compliance
    difficult (Pipikaite, Barrachin, and Crawford 2021, 2).


    Not only are cybersecurity regulations increasing, but their reach is also broadening.
    As machine learning cybersecurity activity increases, governments and agencies
    are becoming more aware of adversarial machine learning and are developing certification
    frameworks in response. For example, ISO and National Institute of Standards and
    Technology (NIST) are forming “certification rubrics” to assess the trustworthiness
    of machine learning (Microsoft 2020, 35). Such actions can lead to additional
    regulations related to machine learning.


    There are longstanding regulations related to cybersecurity, such as the Health
    Insurance Portability and Accountability Act (HIPAA) and the Gramm–Leach–Bliley
    Act (GLBA) (Warsinske, Mark, and Kevin 2020, 156). More American cybersecurity
    regulations are on their way (Tucker 2020, 1), especially after the massive ransomware
    attacks on Colonial Pipeline and JBS (Marks 2021, 1). The Australian government
    is in the process of gathering feedback about the direction of cybersecurity regulations
    that are aligned with international programs, voluntary, and incentive based (Australian
    Government 2021, 1). The European Commission advocates for strengthened legislation
    and certification across the EU due to the interconnected nature of the European
    Union (European Commission 2021b, 2). Therefore, due to the scale and frequency
    of cyberattacks, many commentators call for more government legislation and regulations
    (Creese et al. 2020, 37), with cyber-insurance requirements becoming more prescriptive.


    ***Microlearning***


    Following are exercises to enhance your learning and professional development:


    • Identify your organization’s cybersecurity regulations.'
