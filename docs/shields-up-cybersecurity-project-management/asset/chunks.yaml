  trans: '


    由于人工智能、云、传感器、物联网设备以及技术驱动创新的前景等多种驱动因素，技术的采纳正以加速的速度增长。技术的增加意味着对网络安全服务的的需求增加。监管的加强也导致对网络安全服务的需求增加。在网络安全专业人员和项目经理短缺的环境下，需求的增长意味着网络安全项目的增加。因此，`Shields
    Up: Cybersecurity Project Management` 的目的在于提供一种经过验证的方法，来计划、管理和交付与全球领先标准及最佳实践对齐的网络安全项目。


    ## 第二部分：混合项目管理


    混合式项目管理方法基于传统的项目管理方法（预测型），并在需要时进行迭代。混合式项目管理汲取了《敏捷宣言》、《PMBOK® 指南》以及其他标准和框架的原则。项目经理可以根据组织、项目和任务的需求，定制出合适的原则、流程、工具和方法。定制化可以提供一种精益的项目管理交付方法，有助于团队专注于产品和服务的生产。


    大多数网络安全项目都可以通过传统的项目管理方法（启动、计划、设计、构建、测试、实施、监控/稳定和结束）以及传统的项目管理流程（例如质量管理和风险管理）来交付。混合式项目管理利用了进度安排、预算和变更管理等传统的项目管理方法。`Shields
    Up` 中包含了创新技术，例如使用 `Perfect-Likely-Outrageous`（`PLO`，见 `Project Schedule`）估计法，并通过
    `Project Management Gizmo` 对您的网络安全项目进行评估，以对项目产生深度理解。每个网络安全项目阶段都经过了调整，并描述了一种精益的项目管理方法，概述了相关的流程、工具和考虑因素。


    遗憾的是，项目失败在技术和网络安全项目中过于常见。项目规划和风险管理可以提高项目成功的概率。`Shields Up` 概述了一个精益计划流程，以交付一个可以进入审批流程的项目计划。即使是最好的项目计划，如果风险管理执行不当也会失败。因此，结合质量管理，风险管理是混合式项目管理的核心。风险管理不需要通过图表和统计分析变得复杂；一种直观的定性风险管理方法通常成功管理网络安全项目的基础。


    `Shields Up` 附录中包含了补充材料，以进一步深化您的学习。`Project Management Gizmo` 工具有助于评估您的网络安全项目，该工具经国际项目管理协会许可包含（2008
    年于罗马展示）。任何项目都可以使用 `Gizmo` 进行评估，以对项目建立全面的理解并开始规划阶段。当项目经理、项目赞助商和团队使用 `Gizmo` 时，就会形成对项目的共同理解，成功的概率随之提高。


    第二个附录引导读者完成一次与年度绩效评估同步的职业规划迭代。我们在最佳实践的指导下，不断改进系统，同时也改进我们的人力。我们也面临网络安全技能的短缺。因此，鼓励网络安全专业人士进行职业规划。`Shields
    Up` 引导读者通过职业规划步骤来实现职业目标并建立可持续的职业生涯。


    最后，贯穿全书的还有补充练习和进一步的指导。`Shields Up` 提供了一种计划、管理和交付网络安全项目的方法。这些工具和实践可以立即应用于您的项目，而练习将引导您应用
    `Shields Up`。书中概述的许多概念可以使用随手可得的材料进行补充，以扩展您对项目管理的理解。`Shields Up` 在每一章中提供了微学习机会，让读者提高其项目管理能力和成功率。


    ## 学习成果


    本书旨在为那些对加深项目管理感兴趣的人提供一条技能提升路径。本书有三个学习成果：


    1. 将混合式项目管理应用于对正式项目管理能力有日益增长的网络安全项目需求中。

    2. 实施与 `NIST` 和 `ITIL` 等全球框架对齐的网络安全项目管理。

    3. 获取并使用混合式项目管理原则。


    通过阅读本书并利用它计划和实施网络安全项目，学习者将更好地理解网络安全背景下的项目管理，并最终交付成功的网络安全项目。虽然 `Shields Up` 专注于网络安全项目，但混合式项目管理方法、流程和工具可以适用于大多数技术和创新项目，如自动化、集成和机器人项目。


    '
