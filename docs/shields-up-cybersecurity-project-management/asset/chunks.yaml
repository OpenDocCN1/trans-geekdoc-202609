    我在信息技术学院教授了九年项目管理，非常享受学术生活，并看到学生学习和毕业。然而，我渴望实践我所主张的内容；管理我自己的项目。在项目初期，我加入了阿布扎比克利夫兰医学中心担任项目经理，交付了
    14 个战略性项目，涵盖了从技术类（例如 `IoT/cloud technologies`）到非技术类（例如内部审计）。我在一个项目管理办公室（PMO）工作，他们遵循
    `ITIL`、`ISO 27000`、`ISO 9001` 和 `PMBOK® Guide` 等领先标准（关于这些内容的更多信息请参见部分）。我亲历了多种标准和框架如何共存，以支持项目按时、按预算并达到正确的质量水平交付。我从我的领导（包括技术和临床领域）中学习，并对同事和团队成员的合作精神表示感谢。`Shields
    Up` 中的工具、流程和技术在阿布扎比克利夫兰医学中心的项目交付中得到了实施和完善。我很幸凭借在技术项目中管理风险的方式，荣得了 2017 年中东安全奖、首席信息安全官协会——`安全与风险领域
    100 位新星`奖。在项目一线奋斗了七年后，我回到了学术界，并加入了澳大利亚邦德大学的项目管理专业。


    我喜欢回到教室，将丰富的项目经验与学生们分享。我加入了一个实力强大的项目管理专业，那里有活跃且富有影响力的研究人员。我的同事 `Dr. Amir Ghanbaripour`
    审阅了 `Shields Up`，并对项目中的人为因素评价道：“在网络安全方面，携带盾牌的人比盾牌（技术）本身重要得多。”我的学生也是影响力的源泉：他们毕业、工作，并经常与我联系，分享他们成功应用
    `Shields Up` 中技巧的故事。在此期间，`Dr. Kam Jugdev` 联系我，希望我我为商业专家出版社（`BEP`）撰写一本项目管理书籍。我们曾是卡尔加大学的博士生，并曾合作出版过书籍。我教授一门技术项目管理课程，其中包含了出现在
    `Shields Up` 中的独特内容。我感谢 `Dr. Jugdev` 和 `BEP` 丛书编辑 `Dr. Timothy Kloppenborg`。`BEP`
    出版社和 Exeter Premedia Services 团队是专业的人士，他们践行精益项目管理，高效地让 `Shields Up` 成为现实。谢谢。


    # 第一部分 (#Contents.xhtml#rpt1)


    ## 网络安全需求日益增长 (#Contents.xhtml#rpt1)


    ## 第一章 (#Contents.xhtml#rch1)


    ### 引言 (#Contents.xhtml#rch1)


    我们生活在一个非凡的时代；技术的进步每天登上头条，例如“在未来十年，我们将经历比过去 100 年加更多的进展，因为技术正在重塑健康和材料科学、能源、交通以及广泛的其他行业和领域”（Corbo
    and Ostojic 2021, 2）。这些技术承诺也受到网络末日论头条的撞击，如“网络攻击时代：美国正努力遏制数字动荡的兴起”（Rushe and Borger
    2021, 1）。为了享受变革性技术的益处，我们需要确保这些技术和数据安全地使用。技术的采用会导致更多的网络安全项目。项目是“为创造独特的产品、服务或结果而进行的临时性努力”（PMI
    2021）。技术的采用会导致更多的网络安全项目。在项目一线奋斗了七年后，我回到了学术界，并加入了澳大利亚邦德大学的项目管理专业。


    ## 项目与运营


    我们生活在一个非凡的时代；技术的进步每天登上头条，例如“在未来十年，我们将经历比过去 100 年加更多的进展，因为技术正在重塑健康和材料科学、能源、交通以及广泛的其他行业和领域”（Corbo
    and Ostojic 2021, 2）。这些技术承诺也受到网络末日论头条的撞击，如“网络攻击时代：美国正努力遏制数字动荡的兴起”（Rushe and Borger
    2021, 1）。为了享受变革性技术的益处，我们需要确保这些技术和数据安全地使用。技术的采用会导致更多的网络安全项目。项目是“为创造独特的产品、服务或结果而进行的临时性努力”（PMI
    2021）。技术的采用会导致更多的网络安全项目。在项目一线奋斗了七年后，我回到了学术界，并加入了澳大利亚邦德大学的项目管理专业。


    信息技术（`IT`）部门提供电子邮件等运营服务。因此，我们既有项目也有运营；我们通过启动和交付项目来满足利益相关者的需求。在图 1.1] 中，我们看到 IT
    发现了一个改进检测功能的机会；他们批准了一个新项目。


    ```

    ![images](img/fig1.1.jpg)

    ```

    **图 1.1 项目为运营交付价值**


    我们生活在一个非凡的时代；技术的进步每天登上头条，例如“在未来十年，我们将经历比过去 100 年加更多的进展，因为技术正在重塑健康和材料科学、能源、交通以及广泛的其他行业和领域”（Corbo
    and Ostojic 2021, 2）。每天都有更多的网络安全项目。在项目一线奋斗了七年后，我回到了学术界，并加入了澳大利亚邦德大学的项目管理专业。

