    and build the product or service. Building is a technical effort, and it often
    requires minimal overview from the project manager other than to track and control
    progress according to the schedule. The ITIL Service Value System guides the build
    phase, where the project team works together as a system to build the service
    for the user (Limited, AXELOS 2019, 17–18). Some organizations document the build
    in an “as-built” document. Once the product or service has been built, and the
    build stage gate criteria are satisfied, the project moves to the test phase.


    Microlearning


    Following are some exercises to enhance your understanding of the build phase:


    • How does as-built documentation work?


    • What are the best practices for as-built documentation?


    • Search for “build phase templates.”


    [CHAPTER 11](#Contents.xhtml#rch11)


    [Test Phase](#Contents.xhtml#rch11)


    Now that the product or service is built, we move to the test phase and plan testing
    ([Figure 6.2](#Chapter06.xhtml#fig6.2)). Testing is a quality control activity:
    find and fix defects. We are fortunate to have consistent and broad guidance from
    quality, service, and project management specialties to apply to testing activities.
    (The NIST cybersecurity framework is operationally focused, and testing during
    a cybersecurity project is not directly addressed.) For example, the ISO 9001:2000
    quality management standard guides the user on how to deliver products and services:
    “In planning product realization, the organization shall determine the following,
    as appropriate: … c) required verification, validation, monitoring, inspection,
    and test activities specific to the product and the criteria for product acceptance;
    …” (ISO 2000, 30). We are guided to test and involve our stakeholders to verify
    the value we are delivering. Testing is critical to quality management and is
    considered a critical success factor in *Shields Up.*


    Testing during a project is directly addressed in ITIL’s Service Value System
    in its General Management Practices—Testing (Limited, AXELOS 2019, 24). *Shields
    Up* is aligned with the ITIL approach to delivering capability and includes the
    build, test, and deliver (T2P) phases ([Figure 6.2](#Chapter06.xhtml#fig6.2),
    the project delivery approach—project phases). However, you can begin developing
    the test strategy and plan earlier in the project if you have spare capacity.
    Again, you can use templates or a previous test strategy and plan as a starting
    point.


    Testing is an integral part of project management; for example, testing is part
    of the PMBOK® Guides. “During the planning phase, the project manager and team
    determine how to test or inspect the product, deliverable, or service to meet
    the stakeholders’ needs and expectations…” (PMI 2017a, 285). The PMI standard
    frames testing as a phase within the project life cycle: “Test. Final quality
    review and inspection of deliverables are carried out before transition, go-live
    or acceptance by the customer” (PMI 2021, 105). Thus, testing is a critical quality
    control activity embedded in quality management, service management, and project
    management standards and a central component in the *Shields Up* hybrid project
    management approach. We can begin developing a test strategy and plan as early
    as the planning phase on some projects and continue its development through to
    the test phase.


    Test Strategy


    Begin test planning by developing a test strategy and test plan. The test strategy
    may include a diagram of the testing process ([Figure 11.1](#Chapter11.xhtml#fig11.1))
    to illustrate the process and participants.


    The testing process diagram ([Figure 11.1](#Chapter11.xhtml#fig11.1)) does not
    illustrate the collaborative nature of planning the test strategy and plan; the
    project manager sets expectations for testing involvement when he meets with the
    sponsor and leadership early in the project and during the project planning workshop.
    Some organizations include a test strategy and plan approval process with a stage
    gate before testing commencement.


    ![images](images/fig11.1.jpg)


    ***Figure 11.1 Testing process***


    A test strategy is a concise report to stakeholders that outlines at a macro-level
    the testing approach and how the test objectives will be satisfied. The following
    are the basics of a test strategy and can be tailored to your project:


    1. **Test objectives**: Document and verify the test objectives (e.g., find and
    fix defects, improve confidence in the product or service, and verify the product
    or service meets expectations).


    2. **In scope**: Identify what will be tested and why.


    3. **Out of scope**: Document what will be excluded from testing and why.


    4. **Test type**: Identify and justify the types of tests you will use ([Table
    11.1](#Chapter11.xhtml#tab11.1)). Some add a “Rationale” column to justify why
    a particular test is in scope or out of scope. A search online reveals additional
    tests (e.g., smoke testing), and the reader can review this technical theory and
    practice to tailor the types of tests appropriate for the project.


    ***Table 11.1 System testing overview***


    | **Test type** || **Included** || **Due date** || **Responsible** |


    | --- | --- | --- | --- |


    | **Unit** || Yes || 12 September || Jason Hawk |


    | **Functional** || Yes || 17 September || Saif Al Llama |


    | **Integration** || Yes || 24 September || Makoto Tamari |


    | **Regression** || No || — || — |


    | **Install/uninstall** || Yes || 1 October || Federico Sant Anna |


    | **Performance/stress** || Yes || 1 October || Irene Cornell |


    | **User acceptance** || Yes || 15 October || Marianne Jones |


    | **Security** || Yes || 29 October || Israa Alberta |


    5. **Test execution**: Describe and justify whether testing will be manual or
    automated. Some tests may be automated (e.g., functional), while others may be
    manual (e.g., unit). There is an increasing number of open source and commercial
    testing tools, and many incorporate defect management.


    6. **Defect management**: Describe how defects will be managed and controlled
    and the software that you will use to manage the defects, including any outstanding
    actions (e.g., defects that are resolved with future software patches from the
    vendor).


    7. **Communications management**: Describe how stakeholders will be informed of
    test results, including the final test report.


    8. **Test schedule**: Include a high-level schedule or Gantt chart.


    9. **Test risk and issue management**: Describe that you will use the defect management
    process in conjunction with the risk management process. If significant defects
    are identified, a risk or an issue may be raised and managed.


    Some organizations have a test strategy and plan template (quality assurance)
    to guide the project manager. The project manager can front-end load the project
    by collecting test strategy and other project-related templates early in the project
    to help guide project planning.


    Test Plan


    The test plan is an extension of and companion to the test strategy. The test
    plan provides the details of the test environment, test scripts, and test data.
    The subject matter experts (e.g., vendor) usually take the lead to develop the
    test plan:


    1. **Test environment**: The test environment mirrors the production environment
    and is safe for testing and experimental defect resolution. The test environment
    includes the hardware, software, and operating system that meets the minimum requirements
    for test execution.'
