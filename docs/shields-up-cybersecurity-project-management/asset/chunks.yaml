- raw: '4. **Budget:** The high-level project budget is presented for comments. However,
    the budget is sensitive in some projects and organizations and not presented in
    the PPW. (Your finance and procurement colleagues can assist you with procurement
    \[e.g., vendor selection\] if it has not already been completed.)


    5. **People:** Project communications and resource management are presented. Effective
    communications will align with the project milestones, phases, and project priority.
    We communicate through meeting minutes and status reports. We use templates to
    guide content development (e.g., schedule and budgets) to share project information.
    The RACI chart can be used but might be too detailed for the PPW and may be reviewed
    separately.


    6. **Risks and issues:** Finally, the main risks and issues are presented. The
    focus is on the prevention and mitigation actions necessary to deliver a successful
    project. The goal is to put preventative actions in place to reduce the probability
    of the risk occurring (e.g., reduce the probability from medium to low). We also
    want to reduce the impact of a risk if it occurs (e.g., reduce the severity from
    high to medium or even low). We describe how we use the risk register and its
    use in project meetings and status reports.


    7. **Next steps:** We conclude the meeting with the next steps: the project manager
    updates the project plan with the PPW attendees’ feedback and schedules a meeting
    with the project approvers to present the endorsed project plan with the project
    sponsor.


    The PPW is an early milestone and brings together stakeholders to present an overview
    of the integrated project plan for their feedback. Presenting a project plan to
    others can be intimidating; however, practice and a systematic approach will position
    you well to succeed. There is a common risk in meetings and workshops that the
    discussion could be side-tracked and take the meeting in an unintended direction.
    One technique to keep the meeting on track is setting up a flipchart to “park”
    important items out of scope for the PPW (e.g., optimization after the project
    is terminated). With the PPW feedback incorporated into the plan, we use the project
    change control process to approve the updated project plan endorsed by the PPW
    participants. Since the PPW is an important milestone in each project, the many
    elements can become templates for future PPWs. Therefore, attention to design,
    layout, content flow, and messaging will pay future dividends when reused.


    Project Change Management


    We use the project change management process^([2](#Chapter08.xhtml#ch8fn2)) ([Figure
    8.10](#Chapter08.xhtml#fig8.10)) to approve the project plan and later to approve
    project changes (e.g., change the budget or schedule). Change management is fundamental
    to ITIL service management and is reflected in change enablement (Limited, AXELOS
    2019, 112–115) and organizational change management practices (Limited, AXELOS
    2019, 90–91). Managing project changes using a change management process is best
    practice.


    The change management process begins with a request for a new project or a change
    to an existing project (e.g., change the schedule). The project manager analyzes
    the requested change (e.g., assesses feasibility and impact to the project and
    program) or develops a project plan. The project manager then presents the change
    or project plan to the decision makers. If the change or project plan is denied,
    the project manager informs the requester. If the change or project plan is approved,
    the project manager implements the change. Not seen in the change control diagram
    is the option for the approvers to require more information or request a change,
    and the project manager goes into an iterative cycle. These iterations can waste
    time; therefore, we want to avoid iterations and get approval the first time the
    change or project plan is presented.


    ![images](images/fig8.10.jpg)


    ***Figure 8.10 Change management process***


    While the project manager develops the project plan, he periodically updates the
    approvers, so their input also guides project plan development. Therefore, when
    the project plan is endorsed by the project contributors (e.g., SMEs), the approvers
    are already familiar with the project plan. Before the change control meeting
    where the approvers will approve or reject the project plan, the project manager
    informally previews the high-level plan with the committee approvers and revises
    where necessary. The result is the approvers will be ready to approve the project
    plan in the change control meeting and you will avoid revision iterations. Previewing
    proposed changes with the approvers works the same way: get endorsement before
    the meeting to increase the probability the approvers will approve your project
    plan in the change control meeting.


    To improve the probability of success with the change control process, try to
    understand your audience’s expectations; what do the approvers want? We can tell
    the story the project plan was developed collaboratively with the stakeholders
    and endorsed. The approvers are interested in key risks and issues and your treatment
    plans. They also want to know how you will keep them informed throughout the project.
    Therefore, you can increase the likelihood of approval through collaboration,
    develop your project plan on a risk management foundation, and follow a hybrid
    project management approach. Some organizations follow an “approval chain,” beginning
    with business/sponsor approvals and ending with senior IT leadership approvals.
    The rationale is to have the business representatives approve the project plan
    first; once they approve, IT will approve. After the project plan is approved,
    archive the meeting’s minutes that provide your approval to proceed.


    Ubiquitous Cybersecurity Planning


    It is good practice to build cybersecurity into our projects rather than adding
    cybersecurity as the project prepares to go live. There are many resources to
    guide project planning to include cybersecurity, including the ISO 27002 Information
    Technology-Security Techniques-Code of Practice for Information Security Controls
    (ISO 2018a, 1–90):


    1. Ensure the development and test environments are secure.


    2. Add security requirements to the design.


    3. Include security within the milestones.


    Systematic project planning can shift the information curve and improve the probability
    of cybersecurity project success.


    Plan Phase: Final Thoughts


    Project planning is a fundamental part of the project and critical to success.
    When one assesses the root cause of project failure, insufficient planning and
    risk management are often cited along with inadequate testing. Therefore, allow
    sufficient time to plan your project. Following an integrated and lean planning
    process can increase the probability of project success. We aim to learn more
    about the project sooner to avoid costly changes later in the project. We can
    shift the information curve with project planning tools like the Project Management
    Gizmo, Priority Triangle, Done–Won–Who, and PLOs. These tools reveal essential
    information like risks and issues; following the risk management process brings
    risks and issues under control.


    We apply quality assurance and control techniques like reusing templates to reduce
    risks. We plan and design in security so that the technology we deliver is more
    likely to fit within our technology ecosystem. One message we need to give is
    that our project can fail. However, we are more likely to succeed with stakeholder,
    sponsor, and leadership engagement. Finally, we package the project plan as a
    professional report with branding, attractive layout, and design. A comprehensive
    and appealing design gives the reader confidence that they have chosen the right
    project manager.


    ***Microlearning***'
