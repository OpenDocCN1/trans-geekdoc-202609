- raw: 'In practice, we can use the triple constraint theory to help identify the
    project priority. We begin by drawing the Priority Triangle (Skulmoski and Hartman
    2000, 35). Time is shown to the left of the Priority Triangle since we wish to
    minimize the duration of our project. Cost is at the bottom of the Priority Triangle
    because we try to minimize costs. Finally, quality and scope are to the right
    since we wish to optimize scope and quality. We try to minimize delivery time;
    therefore, time is to the left (earlier rather than later) on the Priority Triangle.
    We wish to maximize value; therefore, quality and scope are to the right on the
    Priority Triangle. However, if we ask the project sponsor to identify the priority,
    the project sponsor will likely choose all constraints as the priority. Therefore,
    we have added a *No-Go* zone in the middle to force project stakeholders to identify
    the two most essential project priorities.


    Let’s look at the Priority Triangle in use. Our project is to add collaborative
    robots to a manufacturing process. We have three main stakeholders for our IT
    automation project: marketing, engineering, and finance ([Figure 8.2](#Chapter08.xhtml#fig8.2)).
    We explain the exercise, and marketing places their X in the triangle to indicate
    that delivering on time is the project priority, with quality and scope being
    the second priority. Their rationale is that marketing wants to start selling
    the product the project will produce. They also desire high quality since quality
    products are easier to sell. Engineering has prioritized quality since high-quality
    components are easier to maintain and have less frequent breakdowns. Finance prioritizes
    finishing according to budget, followed by finishing on schedule. Finance is responsible
    for maximizing the use of resources and therefore supports finishing according
    to the approved budget. They also want to finish on time to generate revenue once
    the collaborative robot automation is operational.


    You can see that the three stakeholders are misaligned with different project
    priorities ([Figure 8.2](#Chapter08.xhtml#fig8.2)). We become aligned by getting
    project priority direction from the project sponsor using the Priority Triangle.
    In this case, let us assume that finishing on time with the right quality/scope
    are the sponsor’s two project priorities. The project manager has flexibility
    over the budget to deliver the other two priorities.


    In practice, to deliver on time, the project manager may allow his team to work
    overtime to meet project milestones, even though working overtime may increase
    costs. However, to deliver on time, the right scope, and to the right level of
    quality, the project manager has the authority to overspend (within reason). The
    project team will know it is OK to work overtime to meet the schedule. The project
    manager knows the team is working overtime since he follows best practices and
    is close to his team (e.g., PMBOK® Guide principle: engage your stakeholders).
    The project manager will raise a risk if there is a probability they will overspend,
    and an issue if there is overspending. The project manager regularly informs status
    to the sponsor of the project, especially if risks are becoming issues (see Risk
    Management).


    The project manager documents the priority in the project plan, including its
    implications (e.g., the budget may be exceeded). However, the project manager
    will work to meet budget, quality, scope and schedule targets with proper risk
    management. After establishing the project priority, check it throughout the project
    to determine if the priority has changed. Determining the project priority helps
    to shift the information curve and reduce risks and issues.


    Success Criteria: Done–Won–Who


    There are three questions we can ask stakeholders to establish and maintain project
    alignment (Skulmoski and Hartman 2000, 34–35):


    1. **Done**: When is the project finished for you? Most projects have staggered
    finish dates due to the nature of the work delivered. For example, our procurement
    team might be finished our project once servers are delivered and tested. However,
    the project is not finished for cybersecurity until the application goes live
    and cybersecurity functionality is operationalized and stabilized. The project
    manager needs to understand a team with different completion dates; otherwise,
    teams may depart the project sooner than expected.


    2. **Won**: What must be delivered for you to be delighted? Define project success
    and make it measurable and objective. For example, the penetration testing team
    would like two weeks’ notice for their testing services; too often, they are asked
    to participate in last-minute testing that throws them off their schedule.


    3. **Who**: Who gets to vote on the first two questions? We identify the key stakeholders:
    those who can impact our project and those impacted by our project. We engage
    these stakeholders early in the project to reduce changes later due to not consulting
    with a critical project stakeholder.


    Again, the three-question tool helps shift the information curve as we better
    understand the project completion dates and success criteria early in our project.


    Exercise


    • For an existing or past project that you worked on, what was the project priority?
    Was there team alignment? Did project priority change during the project?


    • For an existing or past project that you worked on, complete a Done–Won–Who
    exercise. Did the project plan reflect the success criteria from asking when the
    project is done? What must be delivered for the project to be successful? Who
    gets to vote on the first two questions?


    Project Schedule


    Some believe one of the most important documents a project manager creates is
    a project schedule, and you are likely expected to create a schedule for your
    project. There are two common forms of schedule: a Gantt chart and a network diagram
    ([Figure 8.3](#Chapter08.xhtml#fig8.3)). You might not be able to read the details
    easily; instead, the purpose of the illustration is to display the conceptual
    relationship between the mission statement, WBS, Gantt chart, and network diagram.
    The Gantt chart is a bar chart that we derive from our WBS. The Gantt chart is
    the type of schedule typically shown to leadership since it clearly shows the
    start and finish dates for each phase, milestones, and the overall project completion
    date.


    The network diagram illustrates the start and finish of project activities, their
    logical dependencies, and who is responsible for task completion. For example,
    the network diagram illustrates the logic to procure servers before configuring,
    testing, and provisioning servers. The project team uses the network diagram to
    find the most efficient way to organize the project. The network diagram is tactical
    and can be developed in a scheduling application. The network diagram allows in-depth
    analysis to identify the critical path (the longest path through the network)
    and understand slack (also known as float and is the amount of time a task can
    be delayed without impacting other dependent tasks).


    The project manager collaborates with stakeholders to develop a Gantt chart and
    network diagram. Often, a high-level Gantt chart is presented in the main body
    of the project plan to give an overview of the schedule. At the same time, the
    detailed network diagram is included in the project plan appendixes, with a link
    to the complete project schedule. To develop these schedules, the project manager
    asks the most dreaded question to the SMEs: “how long will it take?”


    ![images](images/fig8.3.jpg)


    ***Figure 8.3 Schedule development***


    ***Three-Point Estimating***'
