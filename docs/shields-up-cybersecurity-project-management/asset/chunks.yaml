- raw: 'I taught project management in the College of Information Technology for nine
    years and enjoyed academia and see our students learn and graduate. However, I
    yearned to practice what I professed; to manage my own projects. I joined Cleveland
    Clinic Abu Dhabi as a project manager near the beginning of the project and delivered
    14 strategic projects ranging from technical (e.g., IoT/cloud technologies) to
    nontechnical projects (e.g., internal auditing). I worked in a PMO that followed
    leading standards such as ITIL, ISO 27000, ISO 9001, and the PMBOK® Guide (more
    about these in [Part 1](#Part01.xhtml#pt1)). I experienced how multiple standards
    and frameworks can coexist to support delivering projects on time, on budget,
    and to the right levels of quality. I learned from my leadership (both technical
    and clinical), and I am grateful for the collegiality of my colleagues and team
    members. The tools, processes, and techniques in *Shields Up* were implemented
    and refined delivering projects at Cleveland Clinic Abu Dhabi. I was fortunate
    to win the 2017 Middle East Security Award, Chief Information Security Officers
    Council—*100 Rising Stars in Security and Risk* for how I managed risks in technology
    projects: hybrid project management works. After seven years of being on the sharp
    end of projects, I returned to academia and joined the project management program
    at Bond University, Australia.


    I enjoyed being back in the classroom with diverse project experiences to share
    with our students. I joined a robust project management program with active and
    impactful researchers. My colleague Dr. Amir Ghanbaripour reviewed *Shields Up*
    and commented on the people aspect of projects: “The people who carry the shields
    are far more important than the shields (technology) themselves when it comes
    to cybersecurity.” My students are also a source of influence: they graduate,
    work, and often contact me with their own stories of successfully applying the
    techniques in *Shields Up*. During this time, Dr. Kam Jugdev contacted me about
    writing a project management book for the Business Experts Press (BEP). We were
    PhD students at the University of Calgary and had previously published together.
    I teach a technology project management subject that includes unique content appearing
    in *Shields Up.* I am grateful to Dr. Jugdev and the BEP Collection Editor: Dr.
    Timothy Kloppenborg for their guidance. The BEP publications and Exeter Premedia
    Services team were skilled professionals who live and breathe lean project management
    to efficiently bring *Shields Up* to life. Thank you.


    [PART I](#Contents.xhtml#rpt1)


    [Increasing Demand for Cybersecurity](#Contents.xhtml#rpt1)


    [CHAPTER 1](#Contents.xhtml#rch1)


    [Introduction](#Contents.xhtml#rch1)


    We live in extraordinary times; technological advances make headlines daily like
    “In the next decade, we’ll experience more progress than in the last 100 years
    combined, as technology reshapes health and materials sciences, energy, transportation,
    and a wide range of other industries and domains” (Corbo and Ostojic 2021, 2).
    These technology promises are tempered with cyber-doom headlines like “Age of
    the cyber-attack: the US struggles to curb the rise of digital destabilization”
    (Rushe and Borger 2021, 1). To enjoy the benefits of transformative technologies,
    we need to keep these technologies and data safe to use. More technological adoption
    results in more cybersecurity projects. A project is “a temporary endeavor undertaken
    to create a unique product, service, or result. The temporary nature of projects
    indicates a beginning and an end to the project work or a phase of the project
    work” (PMI 2021, 28). Some organizations complete work through “initiatives” that
    are miniprojects with less complexity and risk (e.g., install an application patch).
    Technology professionals implementing initiatives can benefit from hybrid project
    management practices and tailoring; however, the focus in *Shields Up* is on more
    extensive and complex projects where project success is not easily guaranteed.
    But first, let’s differentiate between projects and operations.


    Projects Versus Operations


    Information technology (IT) departments provide IT services like e-mail and business
    applications that cybersecurity teams keep safe and secure. End users leverage
    these services to complete their work to benefit their customers and organization;
    this is business operations. Service gaps and continuous improvement opportunities
    are identified, prioritized, and implemented as projects during business operations.
    Thus, projects feed into operations to help the business achieve its strategic
    objectives ([Figure 1.1](#Chapter01.xhtml#fig1.1)). For example, IT provides cybersecurity
    services behind the scenes for most in the organization but are considered operations
    since we provide these services every day. We may encounter a problem that we
    need to rectify or identify an opportunity we wish to leverage; either can trigger
    a request for a new project. In [Figure 1.1](#Chapter01.xhtml#fig1.1), we see
    that IT has identified an opportunity to improve threat detection functionality;
    they have approved and initiated a project to implement new detection software.
    By the length of the arrow, the project team is close to delivering the software
    into operations. We also notice the vertical dashed line in operations signifying
    a monitoring period after go live to fix any defects and optimize the new service.


    ![images](images/fig1.1.jpg)


    ***Figure 1.1 Projects deliver value to operations***


    We also implement projects for our business partners, such as upgrading our Enterprise
    Resource Planning (ERP) system or company website. Thus, we have operations and
    projects; we meet the needs of our stakeholders by initiating and delivering value
    into operations through projects. We follow the project management life cycle
    to deliver new IT services. Delivering new technical services using project management
    contributes to achieving business strategy (George 2008, 1).


    The business initiates new projects for many reasons, such as responding to threats
    or vulnerabilities, taking advantage of an opportunity, increasing revenues, decreasing
    costs, or regulatory compliance, as we have seen. Typically, a new project request
    is sent to an entity with approval authority like a change authorization board
    ([Figure 1.2](#Chapter01.xhtml#fig1.2)). A business case accompanies the request,
    and the proposed service and project is evaluated. The new project request may
    be approved, rejected, put on hold for future consideration, or require further
    information upon which a decision will be made. Some cybersecurity projects may
    be initiated through a formal committee, while others will be approved within
    the IT department. In [Figure 1.2](#Chapter01.xhtml#fig1.2), the change authorization
    board has approved an internal cybersecurity audit to prepare for accreditation
    by an external agency.


    ![images](images/fig1.2.jpg)


    ***Figure 1.2 Change authorization board***


    Going through a formal change control process adds value for the organization:


    1. Allow prioritization of requests for new IT services.


    2. Contribute to meeting regulatory requirements.


    3. Reduce the number of failed projects.


    4. Better manage the flow of projects through the organization.


    5. Improve our understanding of quality, time, scope, and time requirements for
    the project.


    6. Provide a forum for businesses to propose new projects and services.


    Some of the projects you will be asked to lead may come through a project prioritization
    and control process. We see organizations increasingly implementing more technology
    and cybersecurity projects using change authorization boards.


    Technology Forecast: Change, Change, and More Projects'
