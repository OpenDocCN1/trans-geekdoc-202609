    include AI technologies. However, these emerging technologies change the risk
    equation with increased and evolving threats, widening attacks, continued structural
    weaknesses, and grave consequences due to cyberattacks (Creese et al. 2020, 13).


    ## AI Technologies Become Mainstream


    AI is the next big thing (PMI 2019, 2). We see AI early adopters in several industries,
    including advertising, automotive, banking, electronics, financial services, health
    care, insurance, media, pharmaceuticals, telecommunications, and transportation
    (Corbo and Ostojic 2021, 2). We can expect AI to be widely applied to:


    1. Automation and productivity improvements across the value chain;

    2. Next-generation customer experience;

    3. Transformation in research and product development;

    4. New business models, products, and services (Corbo and Ostojic 2021, 2).


    Therefore, we will see more AI-related projects implementing applied AI applications
    and services. These AI-supported applications and services will need cybersecurity
    involvement.

    '
  trans: '


    在 IT 领域工作，我们看到了技术的不断变迁。我不禁想起那句话：“除了自动售卖机，一切都是确定的”很快，自动售卖机将仅支持数字支付。正在进行的变革在*第四次工业革命：世界经济论坛*中有了详细描述，研究人员将第四次工业革命描述为融合了数字、生物和物理实体的数字革命（Schwab
    2016, 7）。一个显著特征是这些技术出现的速度呈指数级增长，带来了巨大的影响：“影响的规模和变化的速度使得这场正在上演的转型与人类历史上任何其他工业革命都截然不同”（Schwab
    2016, 109）。数据处理和通信正以不断加快的速度进行，这给数据量、存储容量、处理能力以及所产生的知识带来了压力（Creese, Saunders, Axon,
    and Dixon 2020, 10），并可能触发新项目（例如升级基础设施）。我们看到一些组织正在拥抱持续流的数字化转型项目（Creese et al. 2020,
    10），这从 IT 预算的整体增长可以看出（Columbus 2020, 1）。


    我们看到人们通过移动技术以以前所未有的计算能力、存储容量和功能访问广泛的知识数据库。变革性技术正在涌现，如人工智能（AI）、数据建模、3D 打印、纳米制造、量子计算、大规模储能等。流行文献歌扬着数字加速和变革的新时代（表
    1.1）。


    我们的经理阅读这些来自数字思想领者的文章，期待持续且加速的技术进步。这些带来了可以利用的数字机会和需要保护的漏洞。这些影响力的报告现在驱动着业务战略，新技术改变了我们的客户预期。这些新兴技术的承诺往往被转化为对新项目和安全系统的请求。更多的网络安全项目正向我们袭！


    ### 表 1.1 数字加速与变革


    | 来源 | 信息 | 评语 |

    | --- | --- | --- |

    | McHugh (2020, 1) | “自动化速度正在加快，越来越多的组织正在创建全自动价值链” | 现在我必须担心维护我们系统的安全以及合作伙伴系统的安全
    |

    | Mulesoft (2020, 4) | “组织正不断投入 AI 能力，以加速和个性化客户服务，减少人为偏见并提高生产力” | 这些业务需求听起来很不错，但有这么多技术需要安全防护！
    |

    | Blackburn, LaBerge, O’Toole, and Schneider (2020, 3) | “大胆且深度整合的数字战略是数字化转型的最有效方法”
    | 大胆！我已经在加班来确保我们数据和系统的安全稳固了 |

    | Gonzalo, Harreis, Altable, and Villepelet (2020, 5) | “公司必须在需求生成和运营管理方面加速其在线能力”
    | 加速？我已经说过我在加班了！ |

    | Skilton and Hovsepian (2018, 60) | “人工智能以及智能系统融入行业、个人和社会的短期至长期影响，将对人类在工作中的角色和人类体验产生深远影响”
    | 我 10 年前就知道了！我每天都在经历系统带来的深远影响！ |

    | PMI (2018, 6) | 一份 PMI 报告发现，到 2030 年将出现的职位中，85% 甚至还没有被发明！ | 我几乎无法维持现有技术的安全，更不用说支持那些不存在的职位所需的技术了
    |

    | Scheibenreif and Raskino (2021, 1) | “机器客户代表了本十年最大的新增长机会。事实上，到 2030 年，至少 25%
    的购买决策将委托给机器” | 现在，我需要考虑机器被黑客攻击，导致机器客户非法使用我们的信用卡！ |


    ## 颠覆性技术的加速


    创新和技术采用正在加速，人们感觉到，如果组织不实施数字化转型战略，对于落后者来说可能已经赶不上技术先驱了（Aaldering and Song 2021,
    12）。事实上，Covid-19 触发了数字化的巨大加速（Scholtz 2021, 2）。这些技术需要被安全保护，因为它们会带来新的漏洞。然而，随着技术采用的速度加快，保护技术的需求也将随之加快。因此，先驱者可能会继续以加速实施技术，而落后者将试图追赶。结果将是产生更多的技术项目和以更快的节奏进行更多的网络安全工作。


    ## 需要保护的新技术


    在这里特定的技术和趋势并不重要；与技术采用相关的总体趋势更有意义。我们看到 5G 技术的部署开启了组织和恶意行为者连接、复杂性和机会的新时代。世界经济论坛（Creese
    et al. 2020, 6）预测以下变革性技术将变得越来越重要：无处不在的连接、AI 和机器学习、量子计算以及身份访问管理。结合 IoT 和传感器技术将带来新的保护机会和资产。组织将越来越多将其技术生态系统的部分移动到云端，从而为网络安全工作增加额外的复杂性。


    我们可以预计下一代计算带来的变革，如计算协作、分布式计算和量子计算将导致速度和效率的提高。先驱者将拥有颠覆性优势，并能够转型战略、运营、供应链和市场（Corbo
    and Ostojic 2021, 2）。我们的组织拥有先驱者提出新技术来帮助我们创新，这并不意外。预计会有更多包含 AI 的提案。然而，这些新兴技术改变了风险方程式，带来了增加和不断变化的威胁、扩大的攻击面、持续的结构性缺陷以及网络攻击导致的严重后果（Creese
    et al. 2020, 13）。


    ## AI 技术成为主流


    AI 是下一件大事（PMI 2019, 2）。我们看到多个行业都有 AI 先驱，包括广告、汽车、银行、电子产品、金融服务、医疗保健、保险、媒体、制药、电信和运输（Corbo
    and Ostojic 2021, 2）。我们可以预计 AI 将广泛应用于：


    1. 价值链的自动化和生产力提高；

    2. 下一代客户体验；

    3. 研究和产品开发的转型；

    4. 新的业务模式、产品和服务（Corbo and Ostojic 2021, 2）。


    因此，我们将看到更多与 AI 相关的项目实施应用类 AI 应用和服务。这些由 AI 支持的应用和服务将需要网络安全的参与。


    '
