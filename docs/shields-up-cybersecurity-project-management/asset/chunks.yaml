- raw: 'We see the drive toward leanness and digitization to accelerate the demand
    for automation projects. CIOs (Chief Information Officer) are invited to partner
    with the business to deliver “high impact initiatives” (Gartner 2020b, 3). There
    is a growing imperative for automation projects to reduce costs through reduced
    human involvement and improvements to customer experience. Automation and robotics
    will be a growth area since a diverse suite of technologies (e.g., IoT, AI, sensors,
    and machine intelligence) will be combined to create new automation opportunities
    (Skilton and Hovespian 2018, 59). Again, we will see more automation and integration
    projects requiring cybersecurity.


    Enable Hyperconnectivity


    Organizations are racing to connect with partners and applications (Mulesoft 2021,
    4) and external data to improve competitiveness (Aaser and McElhaney 2021, 2).
    More connections can bring additional innovation and opportunities; increased
    connectivity can potentially bring more cybersecurity vulnerabilities. The nature
    of connections is also evolving with complex systems relationships forming among
    the physical, biological, and digital domains (Skilton and Hovsepian 2018, 55).
    More connections lead to digital ecosystems development. However, hyperconnected
    environments present the problem where an attack on the digital ecosystem can
    negatively impact downstream actors dependent on the attacked asset (Creese et
    al. 2020, 21).


    Join the Emerging Digital Ecosystem


    Business initiatives strive to connect an organization’s systems; however, they
    also desire more connections with external partners and customers. Digital ecosystems
    are emerging that integrate business-to-business and business-to-consumer interactions
    (Dietz, Khan, and Rab 2020, 3) to create value for all stakeholders in the network
    (Diana and Torrance 2020, 1). We can expect businesses to request more participation
    in digital ecosystems to keep up with fast-evolving customers and workers (Dhasarathy
    et al. 2020, 2). These ecosystems are complex and welcomed by consumers; however,
    they present the potential for additional vulnerabilities to be managed by the
    cybersecurity teams.


    To repeat, organizations are focused on delivering value; therefore, tuning our
    technical ecosystems and processes to optimize value aligns business and IT goals.


    Meet Shorter Delivery Expectations


    Organizations are maturing with their project management and are beginning to
    measure key performance indicators (KPIs) for how quickly projects are initiated,
    planned, designed, built, tested, and delivered to the end-user (Fitzpatrick and
    Strovink 2021, 4). There is a shift from failing quickly to succeeding quickly
    in projects (PMI 2020, 2). One of the early issues related to speedy delivery
    cycles is that cybersecurity might not receive sufficient treatment resulting
    in avoidable vulnerabilities (Boehm and Smith 2021, 2).


    Provide Analytics-Based Decision Making


    Digital transformation projects are changing how we work. As our digital connections
    increase and processes are optimized, the business will be data thirsty when faced
    with decisions. We see an increased demand for analytics as a vehicle to provide
    the organization with a competitive advantage (Dietz et al. 2020, 6). Expect more
    AI-supported analytics with data inputs from a wide variety of sources. One result
    of using AI-supported analytics is that businesses will predict new opportunities
    that may become new projects to implement and more digital services to protect.
    Indeed, analytics-based decision making is at the core of cybersecurity best practices.


    Conclusion of Customer Expectations


    It is no surprise that technology demand and adoption are increasing and quickly.
    The demand is multidimensional, beginning with the desire to drive down costs
    and increase value for an organization’s customers through optimization and transformation
    projects (Moyer 2021, 3). Organizations are forging ahead with digital transformation
    and innovation projects, requiring new technology to improve competitiveness.
    Technology is leveraged to connect with business partners and customers in an
    ever-evolving digital ecosystem. Our purpose is to protect those systems and data.
    Therefore, as we see more demand for digital services, we will also see more demand
    for cybersecurity services; the attack canvas is becoming more sophisticated (Skilton
    and Hovsepian 2018, 36). Indeed, due to regulation and insurance requirements,
    we may see more cybersecurity compliance projects. Thus, more technology projects
    bring more cybersecurity project work with the expectation that the project will
    be done the first time and delivered on time and on budget.


    ^([1](#Chapter02.xhtml#rch2fn1)) Business agility is different than traditional
    agile project management, which uses the Scrum delivery method with the Agile
    Manifesto as its foundation. Business agility is about the ability to continuously
    deliver value by quickly leveraging market opportunities in a turbulent environment.


    [CHAPTER 3](#Contents.xhtml#rch3)


    [Future of Cybersecurity](#Contents.xhtml#rch3)


    We know that the reach and pace of digital transformation are increasing and accelerating.
    More technology equates to more cybersecurity work. The cloud, AI, IoT, and emerging
    technologies are becoming adopted. However, the IT cybersecurity department is
    also changing. Not only is technology changing, but also our way of working (World
    Economic Forum 2020, 3).


    Technology Threats


    Most observers predict new threats coming from new technologies (e.g., 5G, the
    cloud, APIs, IoT/AI-IoT, \*aaS providers, blockchain, AI, digital assistants,
    and smartphones). This book is not about the specific technologies we are interested
    in; instead, emerging technologies are often sources of vulnerabilities, with
    many coming from bad actors and human error (e.g., cloud misconfigurations). The
    barrage of attacks on new technologies results in a narrow window to patch. Nation-state
    threats will continue and become more innovative as criminal gangs partner and
    collaborate to become more effective. Additionally, we are less concerned about
    the nature of the threat (e.g., malware, phishing, denial of service, and password
    attacks) and more troubled that new technologies bring new vulnerabilities and
    new methods of cybercrime.


    Targets of Threats


    Organizations are increasingly being targeted by adopting more technologies with
    potentially more vulnerabilities. The human attack surface is also increasing
    due to the pervasiveness of IoT/AI-IoT devices, ever-broadening global hyperconnectivity,
    and a pivot to remote work. Cyberattacks are more sophisticated with attempts
    to control computer systems to immobilize, disturb, or control the technology.
    For example, we may see more weak-link data exfiltration attacks along organizations’
    supply chains. Unfortunately, the speed and scale of cyberattacks are growing
    exponentially, resulting in alert fatigue among frontline cyber-defenders (Microsoft
    2020, 25).


    Cybersecurity Strategy Is Evolving


    Chief information security officers (CISOs) are responsible for developing and
    managing their cybersecurity strategy. Developing a cybersecurity strategy can
    be daunting when “cyber-adversaries maintain an advantage over defenders” (Oltsik
    2020, 7). Adding to the challenge is that new technologies are in a constant state
    of development and adoption. This accelerated change results in best practices
    being slow to emerge to offer guidance (Howard 2020, 3). The result is CISOs need
    to be creative when developing their strategy.'
