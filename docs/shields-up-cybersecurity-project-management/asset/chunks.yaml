    # 1. 工作类型：与项目将产生的产品相关（例如：实施网络安全分析应用程序与进行网络安全审计）


    ## 1.1. 技术：技术开发的成熟程度、易用性以及经过验证的

    ## 1.2. 所需能力：所需能力的可用程度

    ## 1.3. 吸引力：项目利益相关者参与该项目的意愿程度

    ## 1.4. 独特性：产品和/或项目之前是否执行过的程度


    # 2. 沟通：有效且高效地计划、执行和接收开放沟通的易程度


    ## 2.1. 利益相关者人数：项目团队需要沟通的人数

    ## 2.2. 地理分布：利益相关者在整个区域、国家或世界的分散程度


    # 3. 整合范围：管理各种项目管理活动和流程以产生项目产品的难易程度


    ## 3.1. 接口数量：需要协调的项目元素数量和难度

    ## 3.2. 合同数量：需要管理的合同数量和复杂性


    # 4. 不确定性与风险：风险是导致结果发生变化的因素，而不确定性是可能结果的范围。成功完成项目的风险事件影响和发生概率从低到极高


    该项目管理小工具（Project Management Gizmo）经国际项目管理协会许可使用。


    # [附录 3]


    ## 风险登记


    风险管理过程反映在风险登记和问题登记表中。风险登记与风险管理过程对应：风险识别、分析（定性）、处置以及监控和控制（`Table A3.1`）。


    ***表 A3.1 风险登记***


    | 表头 | 描述 | 示例 |

    | --- | --- | --- |

    | 风险 ID | 每个风险都有唯一的 ID | R-144 |

    | 输入日期 | 风险录入风险登记的日期 | 2020 年 2 月 8 日（写出月份以避免混淆） |

    | 输入人 | 录入风险员。始终分配给个人，绝不分配给团队 | Debbie Hart, 项目经理 |

    | 项目 | 项目名称 | 大数据湖 (Big Data Lake) |

    | 阶段 | 项目阶段 | 计划 (Plan) |

    | 风险原因 | 风险的根源 | 由于制造延迟 |

    | 风险事件 | 可能影响你的项目的风险 | 存在可能延迟到达的风险 |

    | 风险影响 | 风险事件的后果 | 导致构建阶段延迟 |

    | 发生概率 | 风险发生的可能性：高、中、低 | 中 |

    | 影响 | 风险发生时对项目的影响：高、中、低 | 高 |

    | 严重程度 | 概率 × 影响 = 严重程度 高=3，中=2，低=1 | 2 × 3 = 6 |

    | 风险预防措施 | 防止风险发生的行动 | 订购可以准时交付的服务器 |

    | 预防人员 | 负责预防风险的人 | Barry Blanchard |

    | 风险缓解措施 | 负责缓解风险的人 | 修改项目逻辑以延迟服务器配置 |

    | 缓解人员 | 负责缓解风险的人 | Barry Blanchard |

