- raw: 'Technology adoption is increasing at an accelerated rate due to many drivers
    such as artificial intelligence, the cloud, sensors, IoT devices, and the promise
    of technology-driven innovation. More technology results in increased demand for
    cybersecurity services. More regulation results in an increased demand for cybersecurity
    services. Increased demand translates into an increase in cybersecurity projects
    in an environment with a shortage of cybersecurity professionals and project managers.
    And hence, the purpose of *Shields Up: Cybersecurity Project Management* is to
    provide a proven method to plan, manage, and deliver cybersecurity projects aligned
    with leading global standards and best practices.


    [Part 2](#Part02.xhtml#pt2): Hybrid Project Management


    The hybrid project management method is based on the traditional project management
    approach (predictive) with iterations where required. Hybrid project management
    draws on principles from the Agile Manifesto, the PMBOK® Guide, and other standards
    and frameworks. The project manager tailors principles, processes, tools, and
    methods suitable for the organization, project, and task. Tailoring can provide
    a lean project management delivery approach that facilitates the team being able
    to focus on producing products and services.


    Most cybersecurity projects can be delivered with the traditional project management
    approach (initiate, plan, design, build, test, implement, monitor/stabilize, and
    closeout) and traditional project management processes (e.g., quality and risk
    management). Hybrid project management utilizes traditional project management
    methods like scheduling, budgeting, and managing change. Innovative techniques
    are included in *Shields Up,* like Perfect-Likely-Outrageous (PLO, see *Project
    Schedule*) estimating and assessing your cybersecurity project with the Project
    Management Gizmo to develop a deep understanding of the project. Each cybersecurity
    project phase is tuned, a lean project management approach is described, and the
    processes, tools, and considerations are outlined.


    Unfortunately, project failure is far too common in technology and cybersecurity
    projects. Project planning and risk management can improve the probability of
    project success. *Shields Up* outlines a lean planning process to deliver a project
    plan ready to take into the approval process. Even the best project plans can
    fail if risk management is poorly executed. Therefore, with quality management,
    risk management is at the heart of hybrid project management. Risk management
    need not be complicated with charts and statistical analyses; an intuitive qualitative
    risk management method often underlies successfully managing cyber-security projects.


    Supplemental material is included in *Shields Up* appendixes to take your learning
    further. The Project Management Gizmo tool helps assess your cybersecurity project
    and is included with permission from the International Project Management Association,
    presented in Rome, 2008. Any project can be assessed with the Gizmo to develop
    a comprehensive understanding of the project to begin the planning phase. When
    the Gizmo is used by the project manager, project sponsor, and team, a shared
    understanding of the project develops, and the probability of success improves.


    A second appendix guides the reader to complete an iteration of career planning
    timed to coincide with an annual performance review. We are guided by best practices
    to continually improve not only systems but also our human resources. We also
    have a cybersecurity skills shortage. Therefore, the cybersecurity professional
    is encouraged to undertake career planning. *Shields Up* guides the reader through
    career planning steps to achieve career goals and build a sustainable career.


    Finally, throughout the book, there are supplemental exercises and further guidance.
    *Shields Up* provides an approach to planning, managing, and delivering cybersecurity
    projects. The tools and practices can immediately be applied to your projects,
    and the exercises guide you to apply *Shields Up.* Many of the concepts outlined
    in this book can be supplemented with readily available online materials to extend
    your understanding of project management principles and theory. *Shields Up* provides
    microlearning opportunities in each chapter for the reader to increase their hybrid
    project management competence and success in projects.


    Learning Outcomes


    This book aims to provide an upskilling pathway for those interested in deepening
    their understanding of cybersecurity project management.^([1](#Preface.xhtml#prefn1))
    There are three learning outcomes for this book.


    1. Apply hybrid project management to the increasing demand for more cybersecurity
    projects requiring formal project management competencies.


    2. Implement cybersecurity project management aligned with global IT frameworks
    like NIST and ITIL.


    3. Acquire and use hybrid project management principles and skills.


    By reading this book and using it to plan and implement cybersecurity projects,
    the learner will better understand project management in the context of cybersecurity
    management and ultimately deliver successful cybersecurity projects.


    ^([1](#Preface.xhtml#rprefn1)) While *Shields Up* is focused on cybersecurity
    projects, the hybrid project management approach, processes and tools, can be
    applied to most technology and innovation projects such as automation, integration,
    and robotics projects.


    [Acknowledgments](#Contents.xhtml#rfm4)


    I worked in Finance crunching numbers and one day my boss asked me to purchase
    twelve 386 CPU computers as part of the annual capital budgeting cycle: my first
    “IT project.” Later, I participated in the selection team for a new financial
    system. We implemented a customized system that was late and over budget. I wanted
    to learn more about business to become better at projects, and I completed a traditional
    MBA. Even with this new business knowledge about labor law, return on investment
    calculations, and the four pillars of marketing, my projects continued to struggle.
    I searched for answers and discovered the project management specialty.


    I enrolled in a project management program at the University of Calgary and learned
    how to plan and implement projects. I had many teachers who taught me the tools,
    processes, and finer points about project management. Thank you, professors Francis
    Hartman, George Jergeas, Janice Thomas, and Mr. Ken Hanley. All had practical
    project experience and helped me develop my own approach to managing projects.
    Dr. Francis Hartman led the project management specialization program and brought
    together engaged students to learn and have fun while polishing their assignments.
    Very quickly it seems that I almost finished my dissertation and thinking about
    what to do next? I spoke with Francis, and he recommended the Middle East. Shortly
    thereafter, I was hired by Zayed University in Abu Dhabi, United Arab Emirates,
    to teach project management.'
