    I taught project management in the College of Information Technology for nine
    years and enjoyed academia and see our students learn and graduate. However, I
    yearned to practice what I professed; to manage my own projects. I joined Cleveland
    Clinic Abu Dhabi as a project manager near the beginning of the project and delivered
    14 strategic projects ranging from technical (e.g., `IoT/cloud technologies`)
    to nontechnical projects (e.g., internal auditing). I worked in a PMO that followed
    leading standards such as `ITIL`, `ISO 27000`, `ISO 9001`, and the `PMBOK® Guide`
    (more about these in [Part 1](#Part01.xhtml#pt1)).  I experienced how multiple
    standards and frameworks can coexist to support delivering projects on time, on
    budget, and to the right levels of quality. I learned from my leadership (both
    technical and clinical), and I am grateful for the collegiality of my colleagues
    and team members. The tools, processes, and techniques in `Shields Up` were implemented
    and refined delivering projects at Cleveland Clinic Abu Dhabi. I was fortunate
    to win the 2017 Middle East Security Award, Chief Information Security Officers
    Council—`100 Rising Stars in Security and Risk` for how I managed risks in technology
    projects: hybrid project management works. After seven years of being on the sharp
    end of projects, I returned to academia and joined the project management program
    at Bond University, Australia.


    I enjoyed being back in the classroom with diverse project experiences to share
    with our students. I joined a robust project management program with active and
    impactful researchers. My colleague `Dr. Amir Ghanbaripour` reviewed `Shields
    Up` and commented on the people aspect of projects: “The people who carry the
    shields are far more important than the shields (technology) themselves when it
    comes to cybersecurity.” My students are also a source of influence: they graduate,
    work, and often contact me with their own stories of successfully applying the
    techniques in `Shields Up`. During this time, `Dr. Kam Jugdev` contacted me about
    writing a project management book for the Business Experts Press (`BEP`). We were
    PhD students at the University of Calgary and had previously published together.
    I teach a technology project management subject that includes unique content appearing
    in `Shields Up`. I am grateful to `Dr. Jugdev` and the `BEP` Collection Editor:
    `Dr. Timothy Kloppenborg` for their guidance. The `BEP` publications and Exeter
    Premedia Services team were skilled professionals who live and breathe lean project
    management to efficiently bring `Shields Up` to life. Thank you.


