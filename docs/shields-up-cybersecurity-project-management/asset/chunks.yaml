- raw: 'There is a shortage of cybersecurity project managers resulting in a strong
    demand today that will continue in the future (Oltsik 2020, 36). Rather than waiting
    for a project manager to become available to lead a routine cybersecurity project,
    cybersecurity project managers are assigned to more challenging and critical projects,
    leaving routine cybersecurity projects assigned to nonproject manager roles. Indeed,
    some recommend that IT departments provide training to technical staff ranging
    from “business, communications, leadership, and management skills” (e.g., managing
    projects and initiatives) (Oltsik 2020, 45).


    ***Profession in Crisis***


    Our cybersecurity profession is in crisis. Not only is there more technology to
    protect, but the technology is also becoming increasingly complex, resulting in
    an increased demand for cybersecurity services ([Figure 3.2](#Chapter03.xhtml#fig3.2)).
    The skills gap is especially exasperated in new cybersecurity technologies (Howard
    2020, 5).


    Additionally, there are other skill gap drivers, such as poor strategic planning
    by the organization and inadequate career planning by the individual. Finally,
    the cybersecurity role is changing from a technical focus to a broader role as
    a business partner that requires a broader skillset. Thus, there are many drivers
    of the cybersecurity skills gap.


    The impact of the cybersecurity skills gap is multifold and far reaching. Due
    to unfilled cybersecurity positions and increased demand for cybersecurity services,
    the workload assigned to cybersecurity professionals is heavy and can be stressful
    (Oltsik 2020, 21). A direct result of the increased workload is that cybersecurity
    professionals find it challenging to keep up with their learning about new technologies
    and to learn to use existing cybersecurity tools to their full potential resulting
    in increased risks for the organization (Oltsik 2020, 37). The cybersecurity skills
    gaps continue to impede organizational cybersecurity.


    ***Organizational Role***


    There are many ways organizations can mitigate the cybersecurity skills gap challenge.
    Since cybersecurity professionals are under constant pressure to remain competent
    and knowledgeable about cybersecurity, they struggle to find the time to develop
    new skills (Claus 2017, 8). Therefore, organizations can anticipate the skills
    shortage and support existing personnel in planning their cybersecurity careers
    and providing training and development opportunities (Howard 2020, 6; Oltsik 2020,
    20). Forward-thinking cybersecurity professionals will actively leverage this
    knowledge to plan their careers with managers and mentors.


    ![images](images/fig3.2.jpg)


    ***Figure 3.2 Cybersecurity skills gap shortage model***


    **Opportunity**: Organizations are advised to provide more support to technical
    staff such as training and development opportunities; therefore, discuss career
    development with your manager or human resources. They might provide premium-quality
    training and education funding and help with career pathways such as secondments
    and lateral moves. Your organization wants you to succeed!


    ***Cybersecurity Career Planning***


    It should not come as a surprise that busy cybersecurity professionals often neglect
    career planning when they routinely work long and stressful hours. Instead, cybersecurity
    professionals often take an informal and haphazard career management approach;
    however, cybersecurity professionals are encouraged to take a systematic approach
    to career planning with a transformation coach and develop holistically (Oltsik
    2020, 45). Too often, cybersecurity professionals have a tactical focus (Oltsik
    2020, 45) and chase certifications to develop technically. Focusing solely on
    developing technical expertise seems counterintuitive when 47 percent of security
    professionals (sample *N* = 327) reported that they aspired to become a CISO that
    is more of a business than a technical position (Oltsik 2020, 17). Therefore,
    as part of continuous improvement, cybersecurity professionals can benefit from
    career planning and broader development in nontechnical areas such as project
    management. (See the Career Planning in [Appendix 4](#Appendix04.xhtml#ap4).)


    Future of Cybersecurity: Final Thoughts


    Cybersecurity threats are increasing and becoming more innovative, with more targets.
    Organizations are responding with updated strategies and increased budgets to
    harden their security. Organizations face increased cybersecurity regulations,
    especially if they intend to operate within government procurement programs. As
    cybersecurity threats evolve, cybersecurity strategy is evolving, and organizations
    increasingly plan their cybersecurity maturity journey. However, while many have
    healthy budgets, leadership expects IT departments to deliver their projects on
    time and on budget. Thus, we have a cybersecurity skills shortage (technical and
    project management) that challenges organizations.


    [CHAPTER 4](#Contents.xhtml#rch4)


    [Technical Framework Alignment](#Contents.xhtml#rch4)


    Few organizations provide IT and cybersecurity services in isolation; that is,
    they often follow best practices and frameworks to provide quality services and
    products. Organizations follow external frameworks for cybersecurity operations
    and projects to guide quality, technology, cybersecurity, and project delivery
    (see [Figure 4.1](#Chapter04.xhtml#fig4.1)).


    All frameworks are aligned with a focus on satisfying the customer by predictably
    delivering products and services to the right level of quality, with continuous
    quality improvement driving innovation; delivering and optimizing value are common
    aims in these frameworks and standards.


    Quality Management: Cornerstone of Compliance


    What is quality management? According to International Organization for Standardization
    (ISO) 9004, quality policies and processes are established to achieve objectives
    through quality planning, quality assurance, control, and continuous improvement
    to make up the quality management system (ISO 2000, 10). Continuous improvement
    is fundamental to providing services valued by the end-user and is maximized if
    a continual improvement mindset is adopted by all project stakeholders (Limited,
    AXELOS 2019, 71). Project quality management includes those processes to plan,
    manage, and control the project and the project’s product or service to meet our
    stakeholder’s objectives (e.g., to provide something of value). Project quality
    management also includes continuous process improvement (PMI 2017a, 271). Information
    Technology Infrastructure Library (ITIL), ISO, and Project Management Institute
    (PMI) quality management guidance are closely related; the PMI focuses on quality
    management within the project context, while ISO quality management is more general.
    Therefore, these standards are aligned, and complying with one brings you close
    to complying with the other standards regarding quality management.


    ![images](images/fig4.1.jpg)


    ***Figure 4.1 External framework alignment***


    Quality management underpins best practices and standards related to project management,
    service management, and cybersecurity services. After planning how quality will
    be managed in the project, quality management can be seen as a three-step process:
    (a) quality assurance, (b) do the work, and (c) quality control ([Figure 4.2](#Chapter04.xhtml#fig4.2)).'
