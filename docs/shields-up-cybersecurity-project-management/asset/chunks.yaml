    improvement method related to agile project management. Lean Six Sigma combines
    lean management and Six Sigma goals (`[Figure 5.6](#Chapter05.xhtml#fig5.6)).
    Lean Six Sigma aims to improve processes by reducing waste and/or delays and improving
    quality, resulting in customer satisfaction. Improving processes is attractive
    to the business since Lean Six Sigma projects can provide three key benefits (Snee
    2010, 6):


    1. Deliver the maximum value contributing to business goals.

    2. Improve process performance for painful steps in the process.

    3. Improve information and resource flow while reducing waste and cycle time.


    ![images](images/fig5.6.jpg)


    **Figure 5.6 Lean six sigma goals**


    ### Exercise


    List some of your organization’s projects during the last 12 months; how many
    of them have roots in Lean Six Sigma goals (e.g., optimize steps, remove pain
    points, and reduce turnaround time)? Many organizations initiate projects to address
    Lean Six Sigma goals but lack the methods and tools to achieve the desired results!


    To gain the benefits of Lean Six Sigma (e.g., to reduce pain points and time to
    complete the process), users follow the DMAIC process (de Mast and Lokkerbolbol
    2012, 604–614): a data-driven, quality improvement process (`[Figure 5.7](#Chapter05.xhtml#fig5.7)).
    For example, the business owner (e.g., manufacturing) wants to improve a process
    (operations) and may follow DMAIC to initiate a quality improvement project. The
    project team establishes a baseline and measures how long it takes to get through
    the process targeted for improvement. The project team may interview users of
    the service to identify process pain points. The business sponsor will then propose
    a new project to deliver the Lean Six Sigma quality improvement goals. The improvement
    solution increasingly involves technology to automate steps in a business process
    with integration, AI, or IoT technologies. Once the solution is delivered and
    used in business operations, the team remeasures and documents any process improvements.
    The team resurveys process users to understand the value of quality improvements.
    IT professionals will see more project requests as part of the `Improve` phase
    of Lean Six Sigma. Cybersecurity professionals will be invited to join the team
    to secure the process and data.


    ![images](images/fig5.7.jpg)


    **Figure 5.7 DMAIC improvement cycle**


    Thus, Lean Six Sigma studies by the business are a way IT projects are identified
    and proposed to the organization. IT subject matter experts (SMEs) might be invited
    to join Lean Six Sigma projects to (i) implement technologies using a project
    management delivery approach and (ii) add cybersecurity to the technical solution.


    ## Project Management: Final Thoughts


    Project management helps to plan and deliver successful projects. Multiple project
    delivery approaches range from predictive (traditional waterfall) to adaptive
    (agile). Traditional project management is often process based, where we initiate
    a project, plan, design, build, deliver, and closeout the project. The leading
    project management standards and frameworks follow a similar process, with common
    theory (e.g., scope, quality, and risk management). One can use a hybrid project
    management approach (`[Figure 5.8](#Chapter05.xhtml#fig5.8)`) to combine elements
    of different standards and approaches as projects vary by industry (Skulmoski
    and Brendolan, In Press).


    Using a hybrid project management approach, the project manager can become lean
    in planning and delivering cybersecurity projects. The project manager combines
    and tailors the right project management-related standards, frameworks, processes,
    and tools to deliver their cybersecurity projects (`[Figure 5.8](#Chapter05.xhtml#fig5.8)`).


    ![images](images/fig5.8.jpg)


    **Figure 5.8 Cybersecurity hybrid project management**


    ## Microlearning


    Following are some practical exercises to enhance your learning:


    * Search online for Six Sigma free white belt training. Many training organizations
    offer free online white belt training and certification with the intention the
    student will sign up for subsequent training (e.g., Six Sigma yellow belt). Within
    one week of part-time studying the foundations of Lean Six Sigma, one can get
    a business-oriented certification.

    * Which of these frameworks listed in `[Figure 5.8](#Chapter05.xhtml#fig5.8)`
    are used in your organization? Search online for any unfamiliar frameworks.


    ## PART II

    ### Hybrid Project Management


    ## CHAPTER 6

    ### Cybersecurity Project Management


    The purpose of `Part 2(#Part02.xhtml#pt2)` is to provide practical guidance to
    plan and implement cybersecurity projects. This hybrid project management approach
    originates from theory and standards and has proven best practices for implementing
    technologies like cybersecurity. The intent is that your adaptation of the `Shields
    Up` approach will also be lean and tailored to your project’s and organization’s
    distinct needs. This hybrid project management approach is aligned with leading
    project management, ISO 9001 Quality Management, ISO 3100 Risk Management, ITIL,
    and NIST Frameworks and will help you successfully implement cybersecurity and
    other technology projects. Indeed, delivering new technical services valued by
    our organizations depends on effective project management throughout the value
    chain activities (Limited, AXELOS 2019, 95). Berger et al. (2020, 5) recommended
    that `ITIL 4` “is more than capable” of integrating service management, risk management,
    ISO 27001 information security management, and the NIST cybersecurity framework.
    One can bring together the key frameworks to deliver cybersecurity projects (`[Figure
    5.8](#Chapter05.xhtml#fig5.8)`).


    ### Hybrid Project Management


    Hybrid project management combines predictive and adaptive processes (PMI 2021,
    100). One uses a hybrid project management approach to adapt to the organizational
    setting and project; one recognizes that “one size does not fit all.”


    The 7th Edition of the PMBOK® Guide emphasizes “tailoring” to select the right
    processes, tools, techniques, and inputs to deliver one’s projects. One works
    from a macro to a micro perspective with a quality improvement cycle (`[Figure
    6.1](#Chapter06.xhtml#fig6.1)`, after PMI 2021, 137).


    ![images](images/fig6.1.jpg)


    **Figure 6.1 Tailoring your project**


    Therefore, hybrid project management allows the project manager to fine-tune the
    project delivery approach (processes, tools, techniques, and inputs, including
    personnel) to the organization’s needs and project using a tailoring approach.

