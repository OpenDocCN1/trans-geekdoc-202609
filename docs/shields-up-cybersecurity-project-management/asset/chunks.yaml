    网络安全项目经理的短缺导致了如今巨大的需求，且这种需求在未来将持续 (Oltsik 2020, 36)。与其等待项目经理空缺来领导常规的网络安全项目，不如将网络安全项目经理分配到更具挑战性和更关键的项目中，而将常规的网络安全项目分配给非项目经理角色的人员。事实上，一些人建议
    IT 部门为技术人员提供培训，范围涵盖“业务、沟通、领导力和管理技能”（例如，管理项目和倡议) (Oltsik 2020, 45)。


    ## 处于危机中的职业


    我们的网络安全行业正处于危机之中。不仅需要保护的技术越来越多，而且技术也变得日益复杂，导致对网络安全服务的的需求增加(图 3.2)）。在新的网络安全技术中，技能缺口尤为严重
    (Howard 2020, 5)。


    此外，还有其他技能缺口的驱动因素，例如组织战略规划不力以及个人职业规划不足。最后，网络安全角色正在从技术重点转向更广泛的业务伙伴角色，这需要更广泛的技能组合。因此，网络安全技能缺口存在许多驱动因素。


    网络安全技能缺口的影响是多方面且深远的。由于网络安全职位未填以及对网络安全服务的需求增加，分配给网络安全专业人员的工作量非常重且充满压力 (Oltsik 2020,
    21)。工作量增加的直接结果是网络安全专业人员很难跟上对新技术的学习，也难以学会充分利用现有网络安全工具，从而增加了组织的风险 (Oltsik 2020,
    37)。网络安全技能缺口持续阻碍组织的网络安全。


    ## 组织角色


    组织有很多方法可以缓解网络安全技能缺口的挑战。由于网络安全专业人员面临着保持专业能力和知识的持续压力，他们苦于找不到时间来开发新技能 (Claus 2017,
    8)。因此，组织可以预测技能短缺，并支持现有人员规划他们的网络安全职业，提供培训和发展机会 (Howard 2020, 6; Oltsik 2020, 20)。具有远见的网络安全专业人员将积极利用这些知识，与经理和导师一起规划他们的职业。


    ![images](img/fig3.2.jpg)


    ***图 3.2 网络安全技能缺口需求模型***


    **机会**：建议组织为技术人员提供更多支持，例如培训和发展机会；因此，请与您的经理或人力资源部门讨论职业发展。他们可能会提供高质量的培训和教育资金，并协助职业路径，如外借工作和横向调动。你的组织希望你成功！


    ## 网络安全职业规划


    忙碌的网络安全专业人员在经常进行长时间且高压工作时，往往忽视职业规划，这并不令人意外。相反，网络安全专业人员通常采取非正式且随意的职业管理方法；然而，鼓励网络安全专业人员与转型教练采取系统的方法进行职业规划，并进行全面发展
    (Oltsik 2020, 45)。网络安全专业人员往往侧重于战术 (Oltsik 2020, 45)，并追逐认证以在技术上进行发展。当 47% 的安全专业人员（样本量
    `N` = 327）报告他们渴望成为 CISO（即这更多是一个业务职位而非技术职位）时，仅专注于开发技术专长似乎是违反直觉的 (Oltsik 2020, 17)。因此，作为持续改进的一部分，网络安全专业人员可以从职业规划以及非技术领域（如项目管理）的更广泛发展中受益。（参见附录
    4 中的职业规划。）


    ## 网络安全的未来：最后思考


    网络安全威胁不断增加并变得更有创新性，目标更多。组织正在通过更新策略和增加预算来加强安全。组织面临着日益增加的网络安全法规，特别是如果打算在政府采购计划内运营。随着网络安全威胁的演变，网络安全战略也在演变，组织日益规划其网络安全成熟度之旅。然而，尽管许多组织拥有健康的预算，但领导层期望
    IT 部门按时、按预算交付项目。因此，我们面临着挑战组织的网络安全技能短缺（包括技术和项目管理方面的技能）。


    ## 第 4 章


    ### 技术框架对齐](#Contents.xhtml#rch4)


    很少有组织孤立地提供 IT 和网络安全服务；也就是说，他们通常遵循最佳实践和框架来提供高质量的服务和产品。组织遵循网络安全运营和项目的外部框架，以指导质量、技术、网络安全和项目交付（参见图
    4.1）。


    所有框架都对齐，重点在于通过可预测地交付达到质量水平的产品和服务来满足客户，并由持续质量改进驱动创新；交付和优化价值是这些框架和标准的共同目标。


    ## 质量管理：合规的基石


    什么是质量管理？根据国际标准化组织 (ISO) 9004，建立质量政策和过程通过质量规划、质量保证、控制和持续改进来实现目标，从而构成了质量管理体系 (ISO
    2000, 10)。持续改进是提供终端用户认可的服务的根本，如果所有项目利益相关者采取持续改进的心态，这种效果将最大化 (Limited, AXELOS 2019,
    71)。项目质量管理包括规划、管理和控制项目及其产品或服务的过程，以满足我们利益相关者的目标（例如，提供有价值的内容）。项目质量管理还包括过程持续改进 (PMI
    2017a, 271)。信息技术基础库 (ITIL)、`ISO` 和项目管理协会 (PMI) 的质量管理指南密切相关；`PMI` 侧重于项目背景下的质量管理，而
    `ISO` 质量管理更具通用性。因此，这些标准是对应的，符合其中一种标准就接近符合其他关于质量管理的标准。


    ![images](img/fig4.1.jpg)


    ***图 4.1 外部框架对齐***


    质量管理支撑着与项目管理、服务管理和网络安全服务相关的最佳实践和标准。在规划如何在项目中管理质量之后，质量管理可以被视为三个步骤：(a) 质量保证、(b)
    执行和 (c) 质量控制 (图 4.2)。


