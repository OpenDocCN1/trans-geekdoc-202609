    All schedules are developed with activity duration estimates; some estimates are
    top-down, where a sponsor gives the project manager a target completion date.
    Top-down estimates can be very aggressive and challenging to meet. Another way
    to estimate is bottom-up estimating; we use the `WBS` and estimate the duration
    each work package takes to complete, add up the durations, and arrive at the required
    effort. We then apply these estimates to our network diagram to determine the
    critical path and slack.


    The most common way of estimating is to use single-point estimates; for example,
    25 days, $25,000, 8 consultants, and 60 hours. Project managers often ask SMEss
    how long it will take to complete application testing. The `SME` is required to
    give one number, such as three weeks. However, what if the `SME` encounters more
    than average defects and the resolution time for some take longer than average?
    What if technical support from the vendor to fix the defects is delayed? What
    if testing goes perfectly, there are minimal defects, and we finish earlier than
    anticipated? The testing `SME` does not want to give a number too low or too high
    but does not have a way to communicate estimate uncertainty. Often, the `SMEs`
    delay responding to the project manager because they do not know which number
    to give. For complex, risky, and ambiguous projects, gathering estimates from
    a team of `SMEs` can take months. There is a better way: three-point estimates
    (also known as `PLO`: perfect, likely, and outrageous conditions of uncertainty).


    Three-point estimates have their origins in classical program evaluation review
    technique (`PERT`) scheduling theory. `PERT` provides a way to calculate how much
    time it will take to complete the project. `PERT` calculations capture duration
    estimates under three different conditions: (i) optimistic (the quickest time
    to complete a task), (ii) pessimistic (the maximum time to complete a task), and
    (iii) most likely (the time between the maximum and minimum times—some risks occur,
    but you also have some luck). We use a weighted average formula to generate a
    calculated estimate based on statistics.


    In *Shields Up,* we apply a modified `PERT` estimating technique pioneered by
    Professor Francis Hartman known as `PLO` estimating (1999b, np). The first improvement
    is that the terminology has changed; rather than optimistic, we use `perfect`,
    and rather than pessimistic, we use `outrageous`. The name changes intend to better
    understand the “tail ends” of the normal distribution curve where extreme and
    compound risks and opportunities exist. Often when risks become issues, a chain
    reaction occurs where a delay can trigger other risks and issues, resulting in
    a snowball effect of trouble for the project. When a `perfect` estimate is received,
    we challenge to see if we can improve the estimate; for example, we may ask if
    the time can be improved if they receive help? Or can the time be improved if
    the vendor configures the server onsite rather than the `SME`? We look for a scenario
    where everything goes right, we have lots of luck, and we are promoted at the
    end of the project! We bring creativity and innovation into the process to complete
    the activity we are estimating. By examining ways to optimize the time, we find
    opportunities in the schedule.


    We take a similar approach in `outrageous` estimates; we examine the tail end
    of risks becoming issues and triggering other risks and issues. For example, we
    need to estimate how long it will take to complete testing. We may receive an
    `outrageous` estimate and ask if the estimate includes the vendor being away sick.^([1](#Chapter08.xhtml#ch8fn1))
    We again challenge whether a defect may be resolved only with a future patch resulting
    in an additional increase to the `outrageous` estimate. We set up the `outrageous`
    scenario where many activities face issues. Therefore, we can capture estimates
    that include compound and complex risks and opportunities by using `outrageous`
    and `perfect`.


    We set up our spreadsheet to reflect the three conditions of uncertainty: `perfect`,
    `likely`, and `outrageous` ([Figure 8.4](#Chapter08.xhtml#fig8.4)). We follow
    the `WBS` to estimate the time to complete each work package. We meet with each
    project team to capture their duration estimates (meeting face-to-face or online
    to determine duration estimates rather than through e-mails aligns with the principles
    of the `Agile Manifesto` and the `PMBOK®` Guide v7`). We capture the `likely`,
    `perfect`, and `outrageous` estimates and then show the `SME` the calculated and
    likely estimates. We next discuss risk and wide-range estimates.


    ![images](images/fig8.4.jpg)


    ***Figure 8.4 PLO estimates***


    Wide-range estimates illustrate risks that activities will take longer than planned
    and opportunities to reduce the time to complete activities through crashing.
    The critical point is that you and your team members have identified risks and
    opportunities; risk/opportunity identification is the first step in risk management.
    We use simple qualitative risk management techniques for all the wide-range estimates
    to quickly analyze and establish plans to manage these wide-range risks and opportunities
    (see Risk Management).


    Thus, within 30 to 60 minutes, we can capture duration estimates from a stakeholder.
    We start with a project overview using the project charter infographic that includes
    the project priority. We capture the estimates for three conditions of uncertainty
    (`perfect`, `likely`, and `outrageous`), identify, analyze, and treat risks. We
    document the risk management plan for wide-range estimates in the risk register
    and move to the next `SME` to repeat the `PLO` exercise.


    ![images](images/fig8.5.jpg)


    ***Figure 8.5 Summarized PLO duration estimates***


    Once we capture the estimates from all contributing `SMEs` ([Figure 8.5a](#Chapter08.xhtml#fig8.5)),
    we are ready to summarize and analyze the results ([Figure 8.5b](#Chapter08.xhtml#fig8.5)).
    When we summarize `PLOs` by the project team (or `WBS` work package), we can see
    which teams face the most risk: wide-range estimates ([Figure 8.5b](#Chapter08.xhtml#fig8.5)).
    We further arrange the data to illustrate `PLOs` by team and project phase to
    understand better the effort required for each phase ([Figure 8.5d](#Chapter08.xhtml#fig8.5)).
    We display the calculated estimate rather than `PLOs` since the reader/approver
    is unlikely to be familiar with this technique. However, they welcome single-point
    estimates; the calculated estimates appear like single-point estimates and will
    not take the attention away from your estimates to a discussion about an innovative
    estimating technique (`PLO estimating). Therefore, use the calculated duration
    estimates when you develop your schedules.


    The benefits of using `PLOs` and the risk management process are they shift the
    information curve more than any other technique in the planning phase. Not only
    have we quickly captured duration estimates, but we also understand the risks
    and the opportunities to crash if we begin to fall behind our schedule. Few other
    project tools can deepen our understanding of the project early in the project
    life cycle as `PLO` estimates with risk management.


    Using `PLOs` (three-point estimates) provides many benefits, as hinted previously:


    1. **Fast estimates**: We saw the challenge single-point estimates give to `SMEs`
    where single-point estimates do not easily account for uncertainty. `PLOs` provide
    three conditions of uncertainty which makes it easier to provide high-quality
    estimates. It takes only half an hour to capture estimates from an `SME` for most
    projects. In one week of face-to-face meetings, the project manager can complete
    the first round of risk-informed estimating. It is common to show the `SMEs` the
    completed draft to see if anything was missed or if the estimates should be revised.

