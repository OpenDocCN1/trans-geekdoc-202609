- raw: 'Working in the IT field, we see constant technological change. I am reminded
    that “change is certain in everything except vending machines”; soon, vending
    machines will become digital payment only. The changes underway are detailed in
    the *Fourth Industrial Revolution: World Economic Forum* where the researchers
    describe the Fourth Industrial Revolution as a digital revolution fusing digital,
    biological, and physical entities (Schwab 2016, 7). A distinguishing characteristic
    is the exponential speed at which these technologies emerge, bringing significant
    impact: “The scale of the impact and the speed of the changes taking place have
    made the transformation that is playing out so different from any other industrial
    revolution in human history” (Schwab 2016, 109). Data processing and communications
    are proceeding at ever-accelerating speed, which stresses data volumes, storage
    capacity, processing, and knowledge created (Creese, Saunders, Axon, and Dixon
    2020, 10) and can trigger new projects (e.g., upgrade the infrastructure). We
    see some organizations embracing a continuous flow of digital transformation projects
    (Creese et al. 2020, 10), as seen in overall increases in IT budgets (Columbus
    2020, 1).


    We see people connecting with mobile technologies with unprecedented computing
    power, storage capacity, and functionality to access broad knowledge databases.
    Transformational technologies are emerging like artificial intelligence (AI),
    data modeling, 3D printing, nanomanufacturing, quantum computing, large-scale
    energy storage, and so forth. The popular literature trumpets the new age of digital
    acceleration and change ([Table 1.1](#Chapter01.xhtml#tab1.1)).


    Our managers read these articles from digital thought leaders, expecting continued
    and accelerated technological advances. These bring digital opportunities to leverage
    and vulnerabilities to secure. These influential reports now drive business strategy,
    and new technologies change our customer expectations. These emerging technological
    promises are often translated into requests for new projects and secure systems.
    More cybersecurity projects are coming our way!


    ***Table 1.1 Digital acceleration and change***


    | **Source** || **Message** || **Comment** |


    | --- | --- | --- |


    | McHugh (2020, 1) || “The pace of automation is accelerating, with more organizations
    creating fully automated value chains” || Now I have to worry about keeping our
    systems secure and the security of our partners’ systems |


    | Mulesoft (2020, 4) || “Organizations are increasingly investing in AI capabilities
    to expedite and personalize customer service, reduce human bias, and increase
    productivity” || These business requirements sound good, but that is a lot of
    technology to be secured! |


    | Blackburn, LaBerge, O’Toole, and Schneider (2020, 3) || “Bold, tightly integrated
    digital strategies are the most effective approach to digital transformation”
    || Bold! I’m already working overtime to keep our data and systems safe and secure
    |


    | Gonzalo, Harreis, Altable, and Villepelet (2020, 5) || “Companies must accelerate
    their online capabilities in both demand generation and operations management”
    || Accelerate? I already stated I am working overtime! |


    | Skilton and Hovsepian (2018, 60) || “The near to longer-term impact of artificial
    intelligence and the fusion of intelligent systems into industries, individuals,
    and societies will have a profound impact on the role of the human at work and
    human experience” || I knew this 10 years ago! I live the profound impact systems
    have every day! |


    | PMI (2018, 6) || A PMI report found 85% of the jobs that will be available by
    2030 haven’t even been invented yet! || I can barely keep current technologies
    safe, let alone technologies required to support jobs that don’t yet exist |


    | Scheibenreif and Raskino (2021, 1) || “Machine customers represent the biggest
    new growth opportunity of the decade. In fact, by 2030, at least 25% of all purchasing
    decisions will be delegated to machines” || Now, I need to think about machines
    being hacked, resulting in machine customers illegally using our credit cards!
    |


    Disruptive Technologies Acceleration


    Innovation and technology adoption is accelerating, and there is a feeling that
    if organizations do not implement a digital transformation strategy, it may be
    too late for laggards to catch up to technology early adopters (Aaldering and
    Song 2021, 12). Indeed, Covid-19 triggered a massive acceleration of digitization
    (Scholtz 2021, 2). These technologies need to be secured as they can present new
    vulnerabilities. However, as the pace of technology adoption accelerates, so will
    the need to secure technologies also accelerate. Thus, early adopters will likely
    continue to implement technology at an accelerated pace, and laggards will try
    to catch up. The result will be more technology projects and more cybersecurity
    work at an accelerated cadence.


    New Technologies to Protect


    The specific technologies and trends are less important here; the general trends
    related to technology adoption are of greater interest. We see the rollout of
    5G technologies leading to a new era of connectivity, complexity, and opportunity
    for organizations and bad actors. The World Economic Forum (Creese et al. 2020,
    6) predicts the following transformative technologies will be increasingly important:
    ubiquitous connectivity, AI and machine learning, quantum computing and next-generation
    identify, and access management. Combining technologies like IoT and sensors will
    bring new opportunities and assets to protect. Organizations will increasingly
    move components of their technology ecosystem to the cloud, thereby adding additional
    complexity to cybersecurity efforts.


    We can expect transformative change with next-generation computing like computational
    collaboration, distributed computing, and quantum computing resulting in increased
    computing speed and efficiency. Early adopters will have a disruptive advantage
    and can transform strategy, operations, supply chains, and markets (Corbo and
    Ostojic 2021, 2). It is no surprise that our organizations have early adopters
    who will propose new technologies to help us innovate. Expect more proposals that
    include AI technologies. However, these emerging technologies change the risk
    equation with increased and evolving threats, widening attacks, continued structural
    weaknesses, and grave consequences due to cyberattacks (Creese et al. 2020, 13).


    AI Technologies Become Mainstream


    AI is the next big thing (PMI 2019, 2). We see AI early adopters in several industries,
    including advertising, automotive, banking, electronics, financial services, health
    care, insurance, media, pharmaceuticals, telecommunications, and transportation
    (Corbo and Ostojic 2021, 2). We can expect AI to be widely applied to:


    1. Automation and productivity improvements across the value chain;


    2. Next-generation customer experience;


    3. Transformation in research and product development;


    4. New business models, products, and services (Corbo and Ostojic 2021, 2).


    Therefore, we will see more AI-related projects implementing applied AI applications
    and services. These AI-supported applications and services will need cybersecurity
    involvement.'
