- raw: 'We can expect the emergence of IoT to grow and accelerate as equipment vendors
    stay connected to their devices in the field to predict maintenance requirements
    using AI (Dahlqvist, Patel, Rajko, and Shulman 2019, 3). The technological advances
    in sensor technologies and the adoption of smart cities are also driving IoT adoption
    (Dahlqvist et al. 2019, 3). We may see nano IoT sensors attached to the human
    body, ingested, or integrated with organs to allow human body monitoring and augmentation
    (Skilton and Hovsepian 2018, 30). Innovations like ingested IoT sensors are examples
    of the rapidly growing IoT technology segment. Indeed, we may see as many as 50
    billion IoT devices by 2022, and such “rapid proliferation has made these products
    appealing targets for a growing number of cyberattacks” (Microsoft 2020, 30).
    Again, there are more opportunities for cybersecurity services delivered through
    projects.


    Unfortunately, bad actors will increasingly use AI and associated technologies
    in their cyberattacks. For example, the malicious use of AI will become more sophisticated
    and pervasive, where automating attacks can see increases to attack speed and
    scale (Creese et al. 2020, 28). Adversarial machine learning (actions to attack
    machine learning) is predicted to grow (Microsoft 2020, 35). The attackers will
    be able to extract more value from stolen data and will be able to deliver more
    damage from their attacks (Creese et al. 2020, 12). Offensive AI will find new
    ways of attacking its targets. AI defenses will also see an increase in adoption
    by organizations and individuals. AI defense capabilities will see an improving
    defense posture, dynamic threat detection, proactive defense, increased speed
    in response and recovery, and improvements to attack determination (Creese et
    al. 2020, 29). AI will help us detect threats in languages we do not understand
    and find and understand malicious patterns that no human would ever consider (CyberEdge
    Group, LLC 2020, 34). “We might even go out on a limb and say that machine learning
    and other AI technologies offer our last chance to catch up with and overtake
    the bad guys” (CyberEdge Group, LLC 2020, 35). More cybersecurity projects are
    predicted.


    [CHAPTER 2](#Contents.xhtml#rch2)


    [Customer’s Expectations Driving IT Departments](#Contents.xhtml#rch2)


    We see emerging trends that impact the nature of projects and are driven by our
    customers (internal and external), resulting in an expansion of IT services delivered
    through projects; these services require cybersecurity. Organizations invest in
    digital transformation projects for quick wins, high feasibility/high-value potential
    projects, and “moonshot” projects with a high return on investment but low feasibility
    (Obwegeser, Yokoi, Wade, and Voskes 2020, 8). Business is increasingly partnering
    with IT to implement projects that will transform their business. What do our
    customers expect from IT?


    Quest for More Agility


    Customers desire flexibility and speed to respond to new opportunities; they desire
    agility.^([1](#Chapter02.xhtml#ch2fn1)) They need scalable systems (Barquin, Dreischmeier,
    Hertli, Königsfeld, and Roth 2020, 2) and support for business changes. Indeed,
    we will see more combining technologies (e.g., sensors and IoT) through integration
    to deliver new business value (Corbo and Ostojic 2021, 2). Thus, our business
    partners increasingly see technology as a solution to problems and a way to quickly
    leverage innovation opportunities (business agility).


    Pursue Innovation


    Today, we hear “disrupt or be disrupted” as a call for innovation; whether incremental
    improvement or large-scale transformation, organizations are pursuing digital
    transformation through technical projects (PMI 2020, 2). Business leaders read
    that “most companies will need to build new digital businesses to stay economically
    viable” (Williams, Galvin, and LaBerge 2021, 3). Indeed, some recommend a proactive
    innovation mindset to succeed in the emerging hypercompetitive environment (PMI
    2020, 5). Early adopters of emerging technologies will most likely reap the most
    benefits (Corbo and Ostojic 2021, 15). Some of the most common digital transformation
    projects include digitizing the end-user experience, scaling, and enhancing the
    organization’s infrastructure (Dhasarathy, Gill, and Khan 2020, 2). Thus, cybersecurity
    professionals have the unique opportunity to ensure that the benefits promised
    by technological innovations can be delivered.


    Optimize Lean Operations


    The quest toward lean operations is a business strategy to do more with less;
    it delivers products and services efficiently and effectively. Achieving lean
    operations positions the unit or organization to be more competitive. Lean advocates
    strive to reduce steps in processes to make the process more efficient and remove
    “pain points.” We also try to reduce waste in materials and human resources used
    in the process. The Lean Six Sigma approach is a problem-solving technique to
    identify opportunities for improvement, often followed up with a process-improvement
    project. Many process-improvement projects have technology, integration, and automation
    at their core. These digital transformation activities can increase cybersecurity
    vulnerabilities for some organizations (Boehm et al. 2021, 8). Pandemic-driven
    digital transformation contributed to additional vulnerabilities due to the rapid
    implementation pace (Williams et al. 2021, 5). The desire to become leaner through
    technology can require more cybersecurity efforts and projects to address companion
    cybersecurity vulnerabilities.


    ***What Is Microlearning?***


    Traditional training involves attending a training course for a few days. After
    a few months, the learning decays unless it is refreshed or used. With microlearning,
    learner continuously acquires new knowledge that can be applied to real work.
    The duration for microlearning is often only a few minutes each day to read an
    article at the time of their choosing (Bleich 2021, 2). Microlearning can be more
    effective when the learner follows a learning to do list (Bersin and Zao-Sanders
    2019, 2).


    ***Microlearning***


    The following topics can improve your understanding and application of lean management
    principles and methods.


    • Think about lean-oriented projects in your organization; what are the project
    sponsor’s goals? Reduce time through the process? Automate manual steps? Reduce
    costs? Understanding the high-level request will help to understand detailed requirements.


    • Learn about Lean Six Sigma as a process-improvement technique.


    Digitize End-User Experiences


    Business is reimagining the role of technology with a greater focus on leveraging
    technology to achieve and report upon business objectives (Dhasarathy et al. 2020,
    2). We will continue to see requests for projects to transition from manual to
    automated processes and interactions (Dhasarathy et al. 2020, 2). The digitization
    of manual processes may be an output from a Lean Six Sigma or quality-improvement
    study to identify process optimization opportunities. Unfortunately, we see that
    “risk management has not kept pace with the proliferation of digital and analytics
    transformations” (Boehm and Smith 2021, 2); we may have been prioritizing on-time
    and on-budget delivery targets at the expense of optimized cybersecurity.


    Improve Processes With Automation'
