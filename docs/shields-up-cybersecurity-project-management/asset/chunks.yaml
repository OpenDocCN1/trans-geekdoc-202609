    ***图***


    ### 练习


    回顾 ITIL 服务价值链，并比较你的组织与该框架的齐程度。你使用了哪些实践，并将它们加入你的简历中？


    当遵循信息系统生命周期方法时，结果更具预测性，因为利益相关者理解流程中的步骤并可以进行相应的计划。我们鼓励在 SDLC 中构建网络安全，包括威胁建模、设计评审、静态和动态测试以及生产环境中的渗透测试（Microsoft
    2020, 75）。我们看到 SDLC 与传统的项目管理、IT 服务管理和网络安全管理最佳实践，以及质量管理等支持过程相一致。《Shields Up》 也与信息系统生命周期方法一致。因此，通过遵循本书的方法，你将继续对良好的项目管理、IT
    和网络安全实践做出贡献。


    ### 技术框架对齐：结语


    质量管理是许多框架（包括网络安全）的基础。NIST 网络安全框架是许多组织用于交付和优化网络安全服务的全球性标准框架。网络安全服务通常在 ITIL 框架内交付，该框架遵循服务价值链，从识别需求或机会开始，通过使用和优化的项目管理交付方法交付给组织。


    ### 项目管理框架


    项目管理框架分为两类：针对个人的能力框架和针对组织的成熟度模型。类似于网络安全能力成熟度模型，也有项目管理能力模型，例如 `PMI` 的项目管理成熟度模型
    (`ProMMM`)。组织可以遵循这些成熟度模型来提高其项目管理能力，就像通过提升网络安全等级来提高能力一样。由于网络安全专业人员不太可能领导项目管理改进项目，`ProMMMs`
    不在本书的范围内。相反，我们关注针对个人的项目管理框架（例如`《项目管理知识体系指南 [PMBOK® Guide]` 和 `PRINCE2`），旨在指导他们进行项目管理。


    多个项目管理框架可以在从预测性到自适应项目交付的连续体上进行解释（见图 5.1）。我们可以使用预测性项目管理交付方法，利用进度表、预算和其他工具来规划项目，分阶段预测任务完成情况。这种传统方法有时被称为瀑布式项目管理，因为它是顺序且线性的；在旧阶段完成之前，新阶段不会开始。大多数专业组织（例如
    `PMI` 和 `国际项目管理协会`）都支持预测性项目管理方法。


    然而，随着敏捷项目管理的日益流行，项目管理协会已在其标准中接纳了如 `Scrum` 方法等自适应项目管理方法。当存在 (i) 项目团队要交付的产品或服务的模糊性，或
    (ii) 如何交付产品或服务的模糊性时，敏捷交付方法是合适的。复杂且模糊的项目可以从自适应交付方法中受益；然而，此类方法不在本书的范围内，因为 (i) 大多数网络安全项目的模糊性较低（例如安装新软件或进行审计），以及
    (ii) 顶级网络安全框架（以及 `ISO` 质量管理）意味着传统的或预测性的项目管理方法。因此，本书强调传统的项目管理交付方法，以帮助读者交付常规网络安全项目。然而，《Shields
    Up》中的混合项目管理方法在遇到足够的模糊性或复杂性时（例如设计挑战）可以兼顾自适应性项目工作。


    ![images](img/fig5.1.jpg)


    ***图 5.1 项目交付连续体***


    ### 项目管理知识体系指南


    来自 `PMI` 的 `PMBOK® Guide` 被广泛认为是全球事实上的项目管理标准。`PMBOK® Guide` 第 7 版包含了项目管理标准（见图
    5.2）。较早版本的 `PMBOK Guide`（第 1-6 版）是战术性的（如何计划和交付），而 `PMBOK Guide` 第 7 版是战略性的（管理*什么*）。


    项目管理原则在 `PMBOK Guide` 第 7 版中得到了强调。原则旨在适用于所有项目，无论项目的类型、复杂性、项目经理和赞助人如何。原则是持久且通用的。`PMBOK
    Guide` 第 7 版的原则指导我们在项目中的行为（PMI 2021, 42–43）：


    ![images](img/fig5.2.jpg)


    ***图 5.2 PMBOK® Guide 演进***


    1. **务实 (Stewardship)**：做一个勤勉、尊重且关怀的管理者。

    2. **协作团队**：建立协作的项目团队环境。

    3. **利益相关者**：与利益相关者有效互动。

    4. **价值**：关注价值。

    5. **整体性**。

    11. **适应性与韧性**：拥抱适应性和韧性。

    12. **变更管理**：实现变革以达到预期的未来状态。


    《Shields Up》与第 6 版的流程和知识领域（例如从战术角度考虑质量和风险管理过程）以及第 7 版的原则（战略重点）一致，我们在我们在项目时的行为。


    ### 练习


    这些 `PMBOK Guide` 原则类似于《敏捷宣言》和 `ITIL 4` 原则；花点时间比较这些原则，发现 IT 行业长期以来一直遵循这些原则来指导我们的工作（见敏捷项目管理，图
    5.4）。思考你如何根据这些原则完成工作。这些项目管理原则和其他原则指导了《Shields Up》中混合项目管理方法中的项目交付。哪些原则是可以优先进一步培养的？


    ***紧迫感***


