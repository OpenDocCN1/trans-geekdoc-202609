  trans: '


    另外两个原则指导着成功的项目经理：带着紧迫感工作以及工作前置加载。如果你曾想过“我真希望我再多一天时间来……”，那么这另外两个原则将帮助你按时交付。项目的延期是一天一天积累的；因此，我们努力在一种可持续的速度下最大化我们每天完成的工作。在成功的项目经理身上，我们可以看到这种原则：行动导向的会议准时开始，且持续时间更短。会议安排在明天而不是下周，以此此类推。业务和技术领导者不仅会注意到你的紧迫感，还会注意到你的团队。效法紧迫感，这一原则将渗透到团队的项目行为中。


    ## 前置加载


    减少风险和问题的第二个原则是前置加载：将工作提前（在合理的情况下）进行，以便为未来利用机会或管理风险和问题留出空间。前置加载不是一个新概念，但被证明是有效的；我父亲过去常说：“今天能做的事就不要留到明天做。”我们可以提前处理低风险任务，例如设置你的模板（如：项目章程信息图、设计文档、PLO
    工期估算工作表、进度表、会议记录、状态报告、T2P 跟踪器和测试缺陷记录）以及预订你的会议室（如：团队周会、风险管理会议和状态会议）。许多工作可以在精力较低的下班后完成（例如：设置你的团队协作站点）。成功的项目经理通常在项目启动时加班；在项目早期长时间工作要比在项目结束、压力巨大时在深夜和周末工作要容易得多！进行前置加载，你就不可能希望再多一天了。前置加载和带着紧迫感工作可以让你在项目生命周期中更早地了解更多项目信息。这两个原则是有效的，并且在项目中得到了关注。将紧迫感、前置加载以及
    `PMBOK® Guide` 的原则融入你的实践中，将提高你的项目成功率并激发信心。


    ## PRINCE2


    通过在线搜索可以发现，`PMP` 认证广受尊重在全球范围内通用；然而，`PRINCE2` 项目管理框架也很流行（[PRINCE2.com](http://PRINCE2.com)
    2021, 1）。英国政府于 1989 年首次发布了 `PRINCE2`（受控环境中的项目)，以指导公共服务技术项目。`PRINCE2` 包含了过程、主题和原则（图
    5.3`）。`PRINCE2` 模型是规范性的；它会指导读者项目上应该做什么、什么时候做以及由谁来完成任务。


    ![images](img/fig5.3.jpg)


    图 5.3 PRINCE2 框架


    个人可以通过 `AXELOS` 组织获得 `PRINCE2` 认证：`PRINCE2 Foundation` 或更全面的 `PRINCE2 Practitioner`。将
    `PRINCE2` 与 `PMBOK® Guide` v6 和 v7 比较时，有许多相似之处，例如在原则的指导下遵循过程。`PMBOK® Guides` 越来越多包含了敏捷组件，而
    `PRINCE2` 方法已扩展包含 `PRINCE2 Agile`。*Shields Up* 与这些基于过程的框架和敏捷原则保持一致。


    ## 敏捷项目管理


    敏捷项目管理对人们来说意味着不同的含义；`图 5.4` 中的一些人将敏捷管理视为灵活性。`Camboy` 2019, 125; `Drury` 2012,
    139; `Gemino` 2021, 104; `Horner` 2015, 105; `Argoud` 2019, 121; `Antoni` 2012,
    142; `Serrador` 2021, 175; `PMI` 2021, 101; `Schwaber and Sutherland` 2017, 3
    都表明敏捷管理已得到广泛研究。使用 `Scrum` 方法的敏捷项目管理可能是最流行的自适应项目管理方法之一，用于开发 (i) 交付内容或 (ii) 在项目面对高波动性和不确定性时决定。


    使用 `Scrum` 方法的敏捷项目管理可能是最流行的自适应项目管理方法之一，用于开发 (i) 交付内容或 (ii) 在项目面对高波动性和不确定性时决定。


