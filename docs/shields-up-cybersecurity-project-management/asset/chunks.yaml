    Using `Gizmo` improves teams’ understanding of the project and aligns the team,
    resulting in better project plans. `Gizmo` guides the team to analyze the project
    systematically and helps the team shift the information curve. For example, the
    team may identify risks related to effort or competency gaps revealed with `Gizmo`.
    Once identified with `Gizmo`, risks can be managed with the risk management process.
    When one analyzes a project with `Gizmo`, you shift the information curve (see
    [Figure 7.1](#)) and better understand the project and your ability to address
    risks and opportunities sooner than later, resulting in a leaner project. Shifting
    the information curve with `Gizmo` can improve project success probability and
    deliver value meeting users’ expectations.


    ## Complexity attributes


    ### 1. Constraints

    Things that get in the way of carrying out tasks

    - **1.1 Human resources**: The people may not have the skills and/or be unavailable
    when needed.

    - **1.2 Time/schedule**: The amount of time may or not be enough to complete the
    project based on the approved durations.

    - **1.3 Budget/financing**: There may or may not be enough resources to complete
    the approved scope of the work.


    ### 2. Relative project size

    Projects become more complex as size increases; however, size is relative to the
    experience and capabilities of the organization. The impacts and probability of
    occurrence of risk events external to the project for successfully completing
    the project vary from low to extreme.


    ### 3. Project criticality

    The degree the project affects the viability and operational future of the organizations
    involved

    - **3.1 Importance**: How significant the project is to an organization’s strategy.

    - **3.2 Priority**: The project’s preference when another “competing” project
    is presented for managerial decision and action.

    - **3.3 Impact**: The effect a successful or unsuccessful project will have on
    the organizations and stakeholders involved.


    ### 4. Uncertainty and risk

    Risk is something that leads to a change in outcomes, while uncertainty is the
    range of possible outcomes. Here we assess the risks and uncertainty of the environment
    external to the project work itself.


    ### 5. Organizational environment

    The setting(s) that the project will be planned and managed

    - **5.1 Culture**: The degree the culture (customs, traditions, speech, rituals,
    dress, manners, etc.) of the organization is aligned with the project’s objectives,
    tools, and processes.

    - **5.2 Governance**: The degree the organization oversees its operations is compatible
    with how those in the project want to plan and manage.


    ### 6. Business environment

    The degree the business environment facilitates project completion

    - **6.1 Culture**: The degree the culture (customs, traditions, etc.) external
    to the organization is aligned with the project’s objectives, tools, and processes.

    - **6.2 Governance**: The degree the way the municipality/city/country is compatible
    with the way those in the project want to plan and manage.

    - **6.3 Economy**: The degree the economy(ies) facilitate project completion.

    - **6.4 Language**: The degree that the language used in the business setting
    is understood by those in the project.

    - **6.5 Political climate**: The degree of stability of the political situation.


