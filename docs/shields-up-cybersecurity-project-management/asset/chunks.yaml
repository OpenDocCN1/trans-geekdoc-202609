- raw: 'The project manager and team follow the risk management process and identify
    risks. Risk identification includes the risk cause, event, and effect ([Table
    8.3](#Chapter08.xhtml#tab8.3)) and is documented following risk syntax. The important
    concept is the risk event is written with words that convey uncertainty that the
    risk may or may not occur; for example, we use words like *may*, *could*, and
    *might* to indicate the risk event has not yet occurred but could occur. When
    the proper risk syntax is used, understanding improves and communication risks
    are reduced. Thus, when we identify a risk, we frame the risk as a risk cause,
    event, and effect to aid effective and efficient analysis and treatment.


    ***Table 8.3 Risk management framework and syntax***


    | **Element** || **Description** || **Syntax** || **Analysis** || **Treatment**
    |


    | --- | --- | --- | --- | --- |


    | **Risk cause** || Risks arise due to a cause or reason || *Due to* manufacturing
    delays || The probability the risk may occur: high, medium, or low probability
    of occurrence || Actions that can prevent this risk from occurring |


    | **Risk event** || Something that may affect your project (positively or negatively)
    || *There is a risk* that the servers *may* arrive late || — || — |


    | **Risk effect** || The consequence of the risk event occurring || *Resulting
    in* a delay in completing the build phase || If the risk occurs, the impact the
    risk event will have on the project: high, medium, or low impact || Actions that
    can mitigate (soften) the impact of the effect of the risk if the risk occurs
    |


    Once we identify and document the risk event (cause-event-effect), we can complete
    a qualitative risk analysis. First, we assess the probability of occurrence: the
    likelihood the risk cause may occur ([Figure 8.7](#Chapter08.xhtml#fig8.7)). Qualitative
    risk analysis assesses the probability of occurrence as high, medium, or low.
    There are quantitative techniques (e.g., Monte Carlo Simulation) that indicate
    that the probability of occurrence could be an 84.88 percent chance of occurring
    (high) or 24.116 percent chance of occurring (low). However, quantitative techniques
    are more cumbersome (e.g., risk modeling with statistical techniques), and the
    software can be expensive.


    Additionally, many quantitative techniques take significant time to model and
    require large data sets. Instead, in *Shields Up*, qualitative techniques (high,
    medium, or low probability of occurrence) are used since they are easy to generate
    and understand. The project manager and contributing SME analyze the risk and
    agree upon the probability of occurrence.


    Second, we analyze the effect the risk event will have on the project (e.g., a
    delay) if it occurs: we assess the impact (positive or negative) the effect will
    have on the project (high, medium, or low impact). Together the project manager
    and the SME analyze and agree upon the impact and then add their analysis to the
    risk register. The risk register is the primary tool the project team uses to
    manage risks and issues ([Appendix 3](#Appendix03.xhtml#ap3)); even though it
    is called a risk register, it is also used to manage issues (risks that have been
    realized and are project issues).


    Once we identified the risk, understood the cause and effect, and analyzed the
    probability of occurrence and impact, we examine ways to treat the risk. First,
    we explore ways to prevent the risk from occurring. In our example about the server
    being delivered late due to manufacturing shortages, we can prevent the late delivery
    by ensuring the servers leave the factory on time, such as negotiating to pay
    a premium for the server or finding an alternative supplier. We can avoid the
    risk by purchasing a server model in stock and delivering it to meet our project
    schedule and not delay our build phase. Second, we look at mitigation actions
    to soften the impact if the risk occurs (e.g., we could not prevent the risk,
    and the risk becomes an issue). For example, we can complete other project activities
    to continue to progress. We might begin developing our test strategy, plan, and
    test scripts. At the same time, we wait for the servers to arrive (e.g., we may
    agree upon the contents and people responsible for their development). Again,
    we update the risk register of our mitigation actions; we delegate prevention
    and mitigation actions with a completion date. If we cannot prevent the risk by
    the risk resolution date, then the risk is converted into an issue.


    Issues are risks that have been realized; the risk event cause was not prevented,
    the risk event occurred, and the project is affected. We analyze issues similarly
    to risks; however, the cause of the issue is the risk event. Since the issue has
    occurred, there is no probability of occurrence to consider: only the impact (high,
    medium, or low) and the issue’s effect on the project. The issue syntax uses terms
    like *will* and *has* that convey 100 percent certainty the risk occurred and
    resulting in an issue (e.g., there is an issue that the servers *will* arrive
    late). We delegate the actions to resolve the issue and provide an issue resolution
    deadline. Thus, we have a risk register that supports how we manage risks and
    issues, who is responsible for preventing, mitigating, and resolving risks and
    issues.


    Some projects benefit from a risk management workshop: key project stakeholders
    meet for about two hours to identify, analyze, and treat project risks and issues.
    First, describe your risk management plan for the project and give an overview
    of risk management theory. Use yellow stickies and instruct the participants to
    draw horizontal and vertical lines on the yellow stickies for the different elements
    of risk management (e.g., cause, event, effect probability, impact, prevention,
    and mitigation). Work together to identify the first few risks and show the participants
    how to complete the yellow stickies with risk information ([Figure 8.8](#Chapter08.xhtml#fig8.8)).
    Then ask the participants to identify some risks. This general approach allows
    participants to raise any risk and is designed to get the participants to work
    together and apply risk management theory. The participants place their risks
    onto the wall for everyone to see (collaborative software like online mind mapping
    tools can facilitate an online risk workshop). As participants write down risks,
    they actively contribute to the project and team building occurs.


    We can then take a focused approach and systematically examine risks related to
    milestones, critical path, budget, phases, procurement process, go-live phase,
    and so on. For example, examine each activity along the critical path to identify,
    analyze, and treat risks and issues. We can repeat our risk management process
    to examine the main milestones, the schedule, the budget, and so on. By focusing
    on specific categories of risks, we are comprehensive and considerably shift the
    information curve.


    Once risks are identified, we can then prioritize them with a risk matrix ([Figure
    8.9](#Chapter08.xhtml#fig8.9)). We prioritize risks by their severity (probability
    × impact) and issues by impact (we do not assess probability of occurrence with
    issues since the issue exists). For example, high probability/high impact risks
    should be the team’s focus as there is a high probability the risk may occur,
    and if it occurs, the impact on the project is high. We can then prioritize our
    risks, inform leadership of severe risks, and implement our treatment plans to
    prevent and mitigate. The risk register illustrates risk management efforts and
    becomes a historical record that should be preserved with other project documents
    (risk and issue registers can be used in disputes and litigation).


    ![images](images/fig8.8.jpg)


    ***Figure 8.8 Risk identification, analysis, and treatment***'
