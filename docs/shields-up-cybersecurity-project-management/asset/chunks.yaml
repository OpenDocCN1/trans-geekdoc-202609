  trans: '

    当我们谈论数字化转型时，我们看到的证据表明我们正在进入一个巨大的数字驱动变革时期，例如量子计算和医疗保健领域应用的 AI 研究（IBM 2021, 1–2）。由于技术采用速度的加快，我们的生活和工作方式正在迅速变化。企业正在制定由技术和创新驱动的战略。这种技术采纳的一个影响是，网络安全服务的需求和优先级已经增加。威胁态势和相关的漏洞已大幅扩大。企业正在增加技术和网络安全预算，但要求
    `CISO` 为投资回报率辩护并提供证明。


    随着网络安全工作的增加和预算的扩大，组织正在积极招聘网络安全专业人才，范围从初级职位到如云安全专家和网络安全项目经理等专业化职位。遗憾的是，对网络安全人才的需求远超供应。网络安全技能缺口给企业带来了许多问题，例如延迟网络安全项目，直到有网络安全项目经理到位才能完成项目。技能缺口也为网络安全专业人士提供了领导其第一个项目的机会。随着领导力而来的是对结果的责任：即项目的成功。因此，项目经理更有倾向于采用结构化而非随机的项目管理交付方法来交付成功的项目。


    组织日益依赖技术来交付产品和服务，并保持我们信息的机密、隐私和安全。组织调整最佳实践和框架，提供一种结构化的方法来交付符合批准要求和服务水平协议的产品和。。组织很少按照设计应用标准和框架；相反，他们会挑选满足其自身要求的元素（例如，他们根据特定情况对框架进行定制）。我们在
    `PMBOK® Guide` 和 `ITIL` 等项目管理标准中看到了定制指导，用于选择交付成功项目所需的项目管理工具和过程（图 15.1）。`Shields
    Up` 中记录的混合项目管理重点是遵循结构化方法满足利益相关者的需求，并利用机会为最终用户交付价值。传统的项目管理交付方法适用于大多数项目。它具有风险管理的基础，可以提高价值交付给服务用户的概率。我们可能会包含迭代工作，以确定最佳设计或修复在测试期间发现的缺陷。然而，大多数网络安全项目可以使用传统的项目管理交付方法实施，并在需要时进行迭代。虽然我们的项目管理方法可能因项目而异，但我们的混合项目管理原则并非如此；我们具有紧迫感，鼓励协作，并专注于交付价值。


    ![images](img/fig15.1.jpg)


    **图 15.1 Shields Up 混合项目管理**


    祝喜你已经走到了这里！你可能想要查看特定章节、回顾练习并完成微学习操作。项目管理是一项动态专业领域，每年吸引新的从业者和研究人员，导致了最佳实践的成熟和新的工作方式。将技术和网络安全的进步与项目管理相结合，我们有了一个规划、实施和维持价值的动态环境。我们学习项目管理的程仍在继续。


    ## 第三部分


    ## 附录


    ## 附录 1


    ### NIST 网络安全框架核心示例](#Contents.xhtml#rap1)


    美国国家标准与技术研究院 (`NIST`) 改进关键基础设施网络安全框架是全球领先的网络安全框架。因此，所有 IT 专业人员（包括网络安全专业人员）都应该意识到
    `NIST` 框架，因为每个人在网络安全中都发挥作用。`NIST` 标准根据功能、类别、子类别和引用进行安排（表 A1.1; 美国国家标准与技术研究院 2018,
    50）。


    `NIST` 框架帮助组织审计其网络安全能力、识别差距并设定改进目标（更多项目）。领导网络安全审计或更广泛的技术审计是很好的发展类项目，因为它们是非技术性的，并且提供了系统和服务的概览。


    **表 A1.1 NIST 网络安全框架核心示例**


    | **功能** | **类别** | **子类别** | **引用** |

    | :--- | :--- | :--- | :--- |

    | **恢复 (Recover)** | **恢复计划 (RC.RP):** 执行并维护恢复过程和程序，以确保受网络安全事件影响的系统或资产恢复 | **RC.RP-1:**
    在网络安全事件期间或之后执行恢复计划 | `CIS CSC 10`, `COBIT 5` APO12.06,DSS02.05, DSS03.04, `ISO/IEC
    27001:2013` A.16.1.5, `NIST SP 800-53 Rev. 4`CP1 |

    | **改进 (RC.IM)** | 通过吸取教训改进恢复计划和过程 | **RC.IM-1:** 恢复计划纳入教训 | `COBIT 5` APO12.06,BAI05.07,
    DSS04.08, `ISA 62443-2-1:2009` 4.4.3, `ISO/IEC 27001:2013` A6.1.5, `NIST SP 800-53
    Rev. 4`CP1 |

    | **通信 (RC.CO)** | 与内部和外部协调恢复活动（例如，协调中心、互联网服务供应商、攻击系统所有者、受害者、其他 CIRT 和供应商） | **RC.CO-1:**
    管理公关系 | `COBIT 5` EDM03.02, `ISO/IEC 27001:2013` A6.1.4 |

    | | **RC.CO-2:** 事件发生后修复声誉 | `COBIT 5` MEA03.02, `ISO/IEC 27001:2013` 7.4 |

    | | **RC.CO-3:** 向内外部利益相关者以及执行层和管理团队通信恢复活动 | `COBIT 5` APO12.06, `ISO/IEC 27001:2013`
    7.4, `NIST SP 800-53 Rev. 4`CP1 |


    ## 附录 2


    ### 项目管理工具](#Contents.xhtml#rap2)


    项目管理工具^(1)是一种基于研究的工具，用于评估项目以理解项目的复杂性（[表 A2.1](#Appendix02.xhtml#taba2.1））和成功交付项目所需的努力（表
    A2.2）（Skulmoski 2008, 1）。人们可以使用该工具系统地评估项目，以提高其前期理解，从而制定更好的项目计划。


    当项目利益相关者独立评估项目并比较结果时，该工具会变得更具价值。在小组环境中运行时，该工具将有助于识别一致和不一致的领域。例如，项目经理可能会评估工作类型，并对实施技术的努力给出低分。相反，实施顾问对实施技术的努力给出的高分。随后两人讨论评分不同的原因并达成共识。如果没有该工具，项目经理可能会低估实施技术的努力，导致进度表时间不足。

