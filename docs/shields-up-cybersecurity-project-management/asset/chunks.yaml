- raw: 'It takes three to five years to become “proficient” in a cybersecurity role
    (Oltsik 2020, 6). The cybersecurity professional will likely develop and maintain
    technical competence in areas immediately related to their role. While technical
    proficiency is being established, the cybersecurity professional can begin to
    plan holistically and develop business-related capabilities in leadership, communications,
    and business practices (Oltsik 2020, 17). Cybersecurity professionals can anticipate
    future business demands and develop capabilities in emerging technologies of interest
    to their industry. For example, business is expected to adopt process automation
    and advanced analytics widely; therefore, development in these areas will benefit
    cybersecurity professionals. Lean and Six Sigma techniques can improve processes
    and reduce statistical variations (Stanton, Gough, Ballardie, Bartam, Bamber,
    and Sohal 2014, 16) and can support process automation projects. There are multiple
    ways to undertake career planning; however, let’s first look at sustainable careers
    that can guide career planning.


    Sustainable Project-Oriented Career


    We researched project-oriented sustainable careers and identified critical actions
    to improve career sustainability (Skulmoski et al. 2020, 11–12). A sustainable
    career is one where the work continues at a sustainable pace, and there is balance
    in one’s life. One moves from project to project without unplanned interruptions.
    Career sustainability is a broad concern ranging from boxers who face the inevitability
    of leaving the ring, or mothers who take a leave of absence from paid employment
    to raise a family, or lawyers who need to win cases to stay employed. Technology
    SMEs are challenged to stay current with emerging technologies and master an expanding
    palette of digital functionalities in their software systems. In the Gig Economy
    and 4th Industrial Revolution, we are increasingly project-oriented and move from
    project to project, and sometimes organization to organization.


    We found that career sustainability depends on two contributors: networking and
    upskilling (Skulmoski et al. 2020, 76). Networking with other professionals helps
    people find new opportunities. Staying connected increases one’s capabilities
    and opens opportunities; career sustainability is improved. Upskilling or expanding
    one’s competencies is another career sustainability driver. We improve career
    sustainability as we learn the skills to meet emerging demands (AI collaboration
    with robotics). Therefore, forward-thinking cybersecurity professionals will invest
    time to plan and nurture their careers.


    The technology and cybersecurity skills gap problem has been well studied since
    it is a perennial and perhaps a wicked problem. Cybersecurity professionals are
    fortunate that there are many pathways to remain competent such as pursuing technical
    certifications in technical platforms (e.g., Azure) or in a cybersecurity framework
    (e.g., CISSP). Unfortunately, part of the cybersecurity skills gap problem is
    related to poor career planning: “As this and past reports indicate, organizations
    and cybersecurity professionals are not looking at the profession strategically.
    There is a continuous lack of training, career development, and long-term planning.
    As a result, cybersecurity professionals often muddle through their careers with
    little direction, jumping from job to job and enhancing their skill sets on the
    fly rather than in any systematic way” (Oltsik 2020, 5). That is, many IT professionals
    do not take a strategic approach to career planning. Some visualize competence
    progression within the ITIL framework using the T-Career model (DuMoulin 2019,
    7).


    Planning the T-Career


    One can envision career development over time if we look to the career progression
    of our IT colleagues. One develops skills into skill sets that can be illustrated
    as a shape across a maturity and capability spectrum ([Figure A4.1](#Appendix04.xhtml#figa4.1),
    after Demirkan and Spohrer 2015, 13). The basic depiction of a T-shape professional
    has been modified in *Shields Up,* where the horizontal part of the T represents
    business skills and the vertical part represents technical skills. The new university
    cybersecurity graduate has a technical foundation required to join an IT department
    and joins with an I-shape skill set. With time, the new cybersecurity professional
    settles and continues to learn the technologies required to perform their role.
    They may formally add vendor-specific technical certifications such as the Cisco
    Certified Network Associate Security certification or certify in a technique such
    as the Certified Ethical Hacker. The I-shape skillset broadens as SMEs accumulate
    technical skills and certifications.


    Some cybersecurity professionals add business-related skills by taking courses
    in effective communications, conflict resolution, emotional intelligence, budgeting,
    time management, and so on, depicted in forming a horizontal bar over the I-shape,
    transforming the shape into the T-shape. T-shape professionals have both technical
    and business skills and have expanded opportunities such as managerial roles;
    they can provide more value to their organizations and have improved career sustainability.
    Those who rise to chief information security officers (CISOs) have a foundation
    of technical skills, capped with a broad and deep business skill set. Conduct
    your job search for CISO positions, and you will find job requirements that emphasize
    the business skill set, such as:


    ![images](images/fig4.1.jpg)


    ***Figure A4.1 Competence development journey***


    1. Provide guidance to the CIO and the C-Suite leadership team and define and
    deliver strategic objectives while building goodwill and positive relationships.


    2. Lead information security strategic planning and budgeting cycles supported
    with security and compliance targets, strategies, metrics, and reporting dashboards.


    3. Create education and awareness programs that improve cybersecurity hygiene.


    The CISO needs a foundation of technical skills with a greater emphasis on business
    skills to manage the entire ITIL Service Value System that includes projects and
    operations to deliver value for the organization. These three examples of CISO
    job requirements all involve project management: the foundation of delivering
    innovation, digital transformation, and sustained value. Therefore, understanding
    your career targets and the type of role you aspire to can help you with effective
    career planning.


    Career Planning Process


    If done correctly, career planning is a regular occurrence, such as during annual
    performance assessments so that your organization can support your development
    goals (Oltsik 2020, 6). Your career planning can be input into the performance
    appraisal. Some consider annual performance assessments an administrative burden;
    however, career planning can propel one’s career with a strategic approach. Like
    project success, great careers do not happen by accident; great careers are planned,
    managed, and controlled. Career planning can be completed in three steps:


    1. **Self-assessment:** Hiring managers use various “inventories” to assess capabilities
    and aptitudes in the new hire selection process. Many of these inventories are
    available to gain additional insight during career planning (e.g., search online
    for career and career planning inventories for more formal self-assessment methods).
    These often can help identify strengths and areas to develop. Where are you in
    your competence development? Is your career development shape an I, or are you
    forming a T-shape career for balanced development ([Figure A4.1](#Appendix04.xhtml#figa4.1))?'
