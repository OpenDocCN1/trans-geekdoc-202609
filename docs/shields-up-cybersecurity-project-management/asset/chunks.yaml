- raw: 'Project planning is a skill that improves with use. The following topics can
    improve your understanding and application of project management and improve the
    probability of project success. Search online for the following topics to deepen
    your understanding of project planning:


    • How to make a project communications plan?


    • How to use a risk register?


    • Search for “project planning templates.”


    • Search for “project planning software.”


    ^([1](#Chapter08.xhtml#rch8fn1)) I lead a project where the European vendor closed
    his office for a month in December and January when 75% of his company (18 people
    in total) were sick with the Flu. The owner looked after his team and shut down
    the company for a month to help everyone recover. Our vendor returned to the project
    in mid-January, and our project was delayed three weeks. We rebaselined our project
    schedule using the change control process.


    ^([2](#Chapter08.xhtml#rch8fn2)) Cross-functional flowcharts with “swim lanes”
    are an effective way to illustrate processes and task ownership. We use cross-functional
    flowcharts with Lean Six Sigma process optimization projects to document the as-is
    process and its “pain points.” We optimize to re-draw the process to illustrate
    the reduction in steps and pain points. Drawing processes with cross-functional
    flowcharts is a useful skill for project participants.


    [CHAPTER 9](#Contents.xhtml#rch9)


    [Design Phase](#Contents.xhtml#rch9)


    Projects are initiated to deliver a product or service. The design phase is to
    develop a design for the product or service based on user requirements. Technology
    projects often have multiple design documents, such as the application detailed
    design, low-level infrastructure design, and integration design. The goal is to
    document the design collaboratively developed with the product or service users
    and then approve the design. Thus, end users and the technical team work together
    to develop a design that is submitted for approval. Some organizations have business
    analysts to assist with design activities and requirements elicitation and documentation.
    Once the design is approved, the project team moves to the next phase, where the
    technical team works to build the product or service according to the approved
    design. Systems analysis and design is a core topic in information systems programs
    at the postsecondary level and outside our project management perspective scope.
    However, project managers oversee the design phase and should be familiar with
    systems analysis and design basics.


    Design Phase Best Practices


    The ITIL 4 provides detailed guidance on designing a service and guides the reader
    to take a holistic design approach. Quality, risk, and project management contribute
    to a design that delights the end user. However, full value is unlikely to be
    delivered if such a holistic approach is not followed (Limited, AXELOS 2019, 34).
    The design can also be improved by using design thinking techniques (Defossez,
    McMillan, and Vuppala 2020, 4) and the Lean Six Sigma approach to optimize a process.
    For example, we can improve our design by designing-in cybersecurity functionality
    rather than addressing cybersecurity as an afterthought during the transition
    to the production environment phase.


    The project team needs to consider the risks throughout the project and are guided
    by ITIL’s risk management practice (Limited, AXELOS 2019, 95–97). An example of
    applying risk management to design is to apply the Cybersecurity Golden Rule:
    don’t build what you cannot adequately protect (Skilton and Hovsepian 2018, 207).
    We are also reminded that we can fail without a thorough project plan and not
    following good design practices (Limited, AXELOS 2019, 132–134). If you get the
    design right and follow a lean approach to implement the design, you are more
    likely to optimize value.


    A common approach to documenting the project requirements and design is to meet
    with the end users in a series of design workshops. The basic process is to meet
    in a workshop setting to elicit the design from stakeholders, document the required
    design in a design document(s), and then approve the design. Once approved, the
    design phase ends, and the build phase begins. A common risk is that the workshops
    might not be fully attended, resulting in a flawed or incomplete design being
    approved and then built. During testing, the users will inform the technical team
    that the design is “defective.” Therefore, one needs to prevent and mitigate poor
    workshop attendance. One prevention measure is to invite managers to the workshop.
    Their attendance conveys the workshop’s importance. If one’s boss attends, the
    worker is more likely to attend the workshop. One mitigation action is to repeat
    workshops for critical SMEs who may miss a design workshop. While repeating workshops
    can be resource intensive, adding additional workshops to accommodate principal
    SME’s input is sometimes unavoidable to progress according to the schedule.


    The project manager may use a design template from the PMO to document the design.
    Templates are a quality assurance aid and are used to develop a design document
    expediently. (You can find ITIL compliant design templates and workshop agendas
    online if your organization does not have its own.) The design document(s) needs
    to be approved as with the project plan. We can take a similar approval approach
    as we did in the planning phase. We inform the approvers of our progress, listen,
    incorporate their feedback, and then circulate the design document to the approvers
    for their approval. Once the design document is approved, the design phase ends.
    The technical team begins the build phase by building the product or service according
    to the specification in the design document(s).


    Design Phase: Final Thoughts


    The design phase produces a design that can be built and tested that meets the
    end-user’s expectations. Value is designed with the end users in design workshops.
    Business analysts specialize in elaborating and documenting the design, requirements,
    reports, and other elements. Our goal is to produce a design that accurately reflects
    the end-user’s and sponsors’ expectations from a project management perspective.
    The project manager schedules a series of design workshops and invites different
    team members to complete designs like a detailed application design, an integration
    design, and a low-level infrastructure design. There is a potentially high impact
    risk that not all required SMEs may attend the scheduled workshop due to other
    priorities. Therefore, one may mitigate representation gaps by scheduling additional
    workshops. Once the design is documented, it is circulated to the SMEs for their
    feedback. The feedback is used to update the design documents and is circulated
    for approval.


    ***Microlearning***


    Critical work is completed in the design phase, and there have been many advances
    related to improving design. Prior to searching online, review the microlearning
    activities in the “Technology Analysis” section in [Chapter 7](#Chapter07.xhtml#ch7)
    as they may relate to design phase activities. Search online for:


    • What are the steps in systems analysis and design?


    • How does ITIL work?


    • How does ITIL 3 service design work?


    • What is service catalog management? Capacity management? Availability management?
    Service continuity management? and so on


    • How does the ITIL 4 business analysis practice work?


    • What is design thinking?


    • What is business process design?


    • What is a design workshop agenda?


    • How do we document a design?


    • “ITIL service design templates”


    [CHAPTER 10](#Contents.xhtml#rch10)


    [Build Phase](#Contents.xhtml#rch10)'
