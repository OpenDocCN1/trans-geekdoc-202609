- raw: 'We also see in [Figure 8.9](#Chapter08.xhtml#fig8.9) that we group natural
    triads on the yellow stickies: *cause–probability of occurrence–prevention* belong
    together, and *effect–impact–mitigation* belong together. Yellow stickies and
    the risk management workshop can be a powerful tool to quickly identify and understand
    risks and foster team building to shift the information curve for all.


    ![images](images/fig8.9.jpg)


    ***Figure 8.9 Risk matrix***


    Risk management is one of the most important activities we need to perform in
    our projects. Even though we have budgets and schedules, there is a high rate
    of technology projects delivered late or over budget. Why? Risks became issues
    resulting in delays and overspending. These project managers thought they had
    suitable budgets and schedules yet overspent and delivered late; the critical
    reason for their failure is that risk management was likely not as effective as
    necessary. Therefore, to significantly improve the probability of project success,
    we need to become effective and efficient with managing risks and issues, the
    core of hybrid project management used in our quest to deliver value.


    Exercise


    Think about your organization or another you worked for:


    • How does your department manage and report risks and issues?


    • Does your organization use Monte Carlo Simulation to help analyze risks?


    • What is the IT project success rate in your industry?


    • Review ISO 27005 Risk Management Process to deepen your understanding of information
    security risk management.


    Microlearning


    Investing in risk management skills is time well spent since all that we do in
    a cybersecurity ecosystem involves risk. Therefore, the following microlearning
    opportunities can expand your understanding of this important topic—project risk
    management. Look online for more information about:


    • Risk management definition


    • Risk, issue, and uncertainty definitions


    • Risk management strategy


    • Risk management plans


    • Risk management templates


    • Risk management tools


    • Risk management matrix


    • ISO 31000:2018 Risk Management—Guidelines


    • Risk management and AI


    • Monte Carlo Simulation and


    • Risk management policy


    Quality Management


    Quality management includes tools and processes we use to ensure that the project
    will deliver the intended value for which it was initiated and documented in the
    quality management plan. We use training, templates, and checklists to help manage
    quality and other processes such as planning and tools like stage gates to verify
    the right quality is produced.


    *Shields Up* uses two quality management processes: quality assurance and quality
    control ([Figure 4.2](#Chapter04.xhtml#fig4.2)). We do quality assurance before
    undertaking an activity to ensure the activity is performed correctly. We can
    follow a checklist, procedure, process, or template to improve the likelihood
    that the work will be completed to the right level of quality. Training also supplements
    quality assurance; for example, team members learn to use the risk register to
    document risks and issues consistently. Or we follow configuration instructions
    to set up a server. Quality control checks the work after it has been performed;
    we find and fix defects. Again, checklists, templates, procedures, and training
    can guide quality control activities to find and fix defects. For example, we
    follow testing scripts to verify that the build works as per the approved design.
    Thus, we use quality assurance and control to deliver the right amount of value
    in our projects: Quality *A*ssurance *B*efore Quality *C*ontrol: ABC.


    Our hybrid project management approach focuses on performing the work correctly
    the first time; we can improve the probability of project success (Done–Won–Who)
    with quality management and risk management. We favor quality assurance over quality
    control; it is better to perform the work resulting in minimal defects than finding
    and fixing defects as part of the quality control effort. Quality assurance with
    templates and checklists guides our work to be completed the first time correctly.
    Risk management (e.g., prevention activities) helps to ensure the work is done
    correctly.


    We use governance techniques to help ensure high quality; for example, we structure
    our project with the traditional project management delivery approach with stage
    gates at the end of each phase to verify quality. If the team completes a high-quality
    design, the stakeholders approve the design, moving to the next phase. Risk and
    quality management are inherent in the hybrid project management approach, as
    seen in [Figure 6.2](#Chapter06.xhtml#fig6.2). You can see that the risk management
    process occurs in each phase, and the stage gates act as a quality control mechanism.
    We follow templates (e.g., application detailed design) structured to keep our
    content lean and guide content development.


    Thus far, we have met and planned in small groups with the sponsor and contributing
    SMEs. Our goal is to create a project plan to present to our project sponsor and
    leadership for approval to proceed with our project and leave the planning phase.
    We used the project charter/PID (project priority, scope, rationale, out of scope,
    WBS, Gantt chart, etc.) to orient and align our project team. We have a good understanding
    of our risks and issues and documented risks and issues in the risk register,
    and our project plan reflects a foundation of risk and issue management. Once
    we have a high-level plan, we schedule our first all-hands team meeting to “endorse”
    our project plan in a project planning workshop (PPW).


    Project Planning Workshop


    We exit the planning phase and begin the design phase when the project plan is
    approved (also known as the baselined project plan). The project plan contents
    vary according to the complexity and importance of the project, the audience who
    approves the project plan, and the reputation of the project manager. New project
    managers delivering complex and critical projects may need to develop more comprehensive
    plans.


    The PPW brings together contributing stakeholders and the project sponsor. The
    high-level plan is presented for their endorsement before submitting it to leadership
    for formal approval ([Figure 8.1](#Chapter08.xhtml#fig8.1)).


    1. **Background:** Begin by welcoming the PPW participants to the workshop and
    giving an overview of the workshop, to endorse the project plan. You can explain
    the delivery approach (e.g., predictive) and the governing stage gates.


    2. **Scope:** Confirm the project scope, WBS, rationale, and out of scope items.
    The results of the three questions (Done–Won–Who) can be summarized, and the approved
    project priority using the Priority Triangle can also be presented. Ask if any
    key stakeholders have been missed. Some use an infographic project charter to
    align the stakeholders.


    3. **Schedule:** Present the project schedule next. The goal is to get commitment
    from the stakeholders to contribute to the project according to the schedule.
    Show the high-level Gantt chart to orient the workshop attendees to the project
    timelines and see if it needs to be revised. Next, show the high-level network
    diagram that illustrates the schedule logic and critical path. The project manager
    discusses key activities where broad involvement is required (e.g., design workshops,
    user acceptance testing, and training) and conveys that the project can be delayed
    if there is insufficient attendance. It is a perennial risk to get project participants
    to attend design workshops, training, and testing events when their operational
    tasks need to be completed, especially if that work is tracked to a service level
    agreement (e.g., incident resolution time). Therefore, it is beneficial to set
    expectations that the project can fail without their assistance. Again, we welcome
    stakeholder feedback.'
