    management talent through the next decade (PMI 2017b) exacerbated by the increase
    in demand for competent cybersecurity project positions (Oltsik 2020, 49). There
    is a shortage of project managers, but what about the cybersecurity skills shortage?


    ***Table 3.1 Cybersecurity maturity models***


    | **Model** || **Focus** |

    | --- | --- |

    | National Institute of Standards and Technology Cybersecurity Framework (`NIST
    CSF`) | The `NIST CSF` was first released in 2014 and includes five functions
    and five “implementation tiers” (e.g., maturity levels) |

    | `C2M2` | First published in 1996 by the U.S. National Security Agency, it includes
    129 base practices across 22 process areas, with five maturity levels |

    | Electricity Subsector Cybersecurity Capability Maturity Model (`ES-C2M2`) |
    The U.S. Department of Energy introduced the `ES-C2M2`, a subset of the `C2M2`
    model focused on energy |

    | Oil and Natural Gas Subsector Cybersecurity Capability Maturity Model (`ONG-C2M2`)
    | The `ONG-C2M2` was designed specifically for the oil and gas sector with five
    maturity levels and is a subset of the `C2M2` |

    | Community Cyber Security Maturity Model (`CCSMM`) | Developed by the Center
    for Infrastructure Assurance and security in 2006, it includes five maturity levels
    |

    | National Initiative for Cybersecurity Education (`NICE`)-Capability Maturity
    Model | The `NICE`-Capability Maturity Model was established in 2008 to develop
    cybersecurity staff and has three maturity levels |

    | `ES-C2M2` | The U.S. Department of Energy released their `ES-C2M2` in 2012 with
    10 domains and 3 maturity levels |

    | Federal Financial Institute of Examination Council-Capability Maturity Model
    (`FFIEC-CMM`) | The `FFIEC-CMM` was released in 2014 to guide financial institutions
    to improve their cybersecurity. The model has five domains and five maturity levels
    |

    | African Union Maturity Model for Cybersecurity (`AUMMCS`) | The `AUMMCS` was
    introduced in 2014 and had three domains and four maturity levels |

    | Systems Security Engineering Capability Maturity Model (`SSE-CMM`) | A descriptive
    model published in 2014 by the U.S. Department of Energy and is organized into
    10 domains with 4 maturity levels |

    | Computer Security Incident Response team (`CSIRT`) | The European Union Agency
    for Network and Information Security (`ENISA`) published the `CSIRT` maturity
    model with three tiers and four categories |

    | Cybersecurity Maturity Model Certification (`CMMC`) | The U.S. Department of
    Defense has implemented the `CMMC` framework to normalize and standardize the
    federal government’s defense industrial base. The model has 5 levels, 43 capabilities,
    and 171 practices |

    | CERT Resilience Management Model (`CERT-RMM`) | The `CERT RMM` guides organizations
    to assess business continuity, security, and IT operations |


    Finding qualified cybersecurity professionals is one of the most challenging of
    all technical professions (Morgan 2019, 4–6). “Simply put, it is more difficult
    to hire security professionals today than it was even three or four years ago”
    (Scholtz 2021, 13); indeed, the cybersecurity profession has been characterized
    as in a deepening “crisis” (Oltsik 2020, 5). The unemployment rate for cybersecurity
    professionals is zero percent and has been so since 2011 (Morgan 2019, 6). The
    high demand for cybersecurity professionals has attracted unqualified applicants
    where less than one in four were qualified (Morgan 2019, 2).


    Compounding the problem of the cybersecurity skills gap is that the cybersecurity
    role is changing to align with changing technologies and stakeholder expectations
    (Scholtz 2021, 14). We see specializations such as security strategist, vulnerability
    analyst, machine learning cyber analyst, cyber lawyer, and cybersecurity project
    manager. Now CISOs face a dual problem related to cybersecurity staffing: not
    only is it challenging to find suitable talent, but the cybersecurity job requirements
    are also shifting to account for future needs (Scholtz 2021, 14).


    One strategy to mitigate the cybersecurity skills shortage is to delegate some
    cybersecurity functions to the business, corporate, and other IT teams (Scholtz
    2021, 15). An emerging corporate value is everyone has a role in cybersecurity
    since the technology ecosystem is hyperconnected and complex (Morgan 2019, 2).
    For example, we may see our HR training unit provide cybersecurity awareness training
    to all staff rather than having a cybersecurity SME deliver the training. We cascade
    cybersecurity tasks to others where low-complexity cybersecurity projects are
    assigned to competent technical team members rather than an experienced project
    manager.

