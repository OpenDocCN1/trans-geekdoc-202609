- raw: '2. **Test scripts**: Develop the detailed test instructions to test and verify
    that the requirements have been met (e.g., Load the website landing page and click
    on the “Login” button. Verify that the Login Screen appears with the Username
    and Password fields). Some distinguish test scripts (automated testing) from test
    cases (manual testing). Test scripts often include the test ID number, test data,
    testing steps, and actual and expected results. If the actual results differ from
    the expected results, there may be a defect.


    3. **Test data**: Data used during the test is developed rather than using real
    data due to privacy concerns. The project team develops data to use in the test
    scripts to verify that the system operates as designed. Since the data are developed,
    a lean-oriented team can develop versatile data to service multiple test scripts.
    Many testers leverage data management tools to reduce the administrative burden
    of test data management.


    4. **Test metrics**: Identify the metrics that the approvers desire (e.g., number
    of test scripts planned, number of test scripts executed, and number of defects);
    sometimes, testers provide metrics that are not required from approvers. Set up
    your testing dashboard to track the required metrics and easily add them to the
    test report.


    The reader is fortunate that an online search can refresh their knowledge of test
    environments, test scripts, data, and metrics and show the current state and trends
    in application testing (e.g., automated testing with AI capabilities).


    The test plan may include a requirements traceability matrix that maps the stakeholders’
    requirements to test scripts and tracks verification ([Figure 11.2](#Chapter11.xhtml#fig11.2)).
    The matrix is used as evidence that the project requirements have been met. The
    requirements traceability matrix is a quality assurance template that can be reused
    in future projects. The requirements traceability matrix can serve as a testing
    dashboard by adding status and results columns. Adding additional columns is an
    example of leanness in project documents. Testing applications increasingly offer
    cohesive support for managing the test environment, data, scripts, and defects
    management, while some testers use spreadsheets to guide and track testing. When
    testing is complete, the requirements traceability matrix can be included in the
    appendixes of the final test report.


    ![images](images/fig11.2.jpg)


    ***Figure 11.2 Requirements traceability matrix***


    ***User Acceptance Testing***


    User acceptance tests (UAT) verify if a system satisfies the approved stakeholder
    requirements. The UAT occurs after the testing team completes their series of
    tests (e.g., unit, functional, and integration), rectifies defects, and the SMEs
    believe the system performs as designed. Then, the project manager invites the
    end users to UAT testing workshops ([Figure 11.1](#Chapter11.xhtml#fig11.1)) to
    validate that the system performs as designed and meets stakeholder expectations.
    The testing team repeats the tests and uses the requirements traceability dashboard,
    test environment, scripts, and data. Ideally, the end user executes the scripts
    to understand the system better, resulting in finding and fixing defects before
    going live. The term “defects” is broadly used to mean the end user requires changes.
    For example, the system may operate as designed. Still, the user may request changes
    to menus—rather than a menu list in alphabetical order; the user may request the
    top five choices be prioritized and appear at the top of the drop-down menu. Or
    there could be spelling and grammar mistakes to fix. These defects are fixed and
    tracked to completion with the requirements traceability matrix or a testing dashboard.
    If there are any outstanding defects or comments, they are also noted in the traceability
    matrix and defects tracker.


    During UAT, the end user sees the system perform for the first time and may request
    design changes, even though the design has been approved. Should the end user
    request significant changes that may challenge the completion schedule or otherwise,
    the project manager may raise a risk that testing may be late. Sometimes the requested
    design changes can be deferred to a postproject optimization phase and not delay
    your project. Requests for significant changes are often traced back to the design
    phase and the quality of the end user involvement. Therefore, the project manager
    is prudent to ensure that end users are fully engaged in design workshops and
    design document review. Should the end user not be fully engaged in the design
    phase, then the project manager may raise a risk during the design phase that
    the test phase may take longer to complete due to requests for changes to the
    approved design.


    To complete the design phase, some project managers review the design document
    with the approving end user during a two-hour meeting and reduce the risk of not
    understanding the design. In *Shields Up,* we focus on preventing risks rather
    than resolving issues (e.g., quality assurance efforts are emphasized). Once the
    end users complete UAT testing and give their approval, the requirements traceability
    matrix is updated, and the approvals are recorded in meeting minutes or in an
    e-mail. The project manager then completes the test report; the last stage gate
    to leave the test phase.


    Test Report


    The test report contains the testing results and is prepared by the project manager
    ([Table 11.2](#Chapter11.xhtml#tab11.2)). The purpose of the test report is to
    document test results as outlined in the test strategy and test plan to determine
    whether sufficient quality exists and if the product or service is ready for release.
    It is prudent to refer to the test strategy and plan when writing the test report
    to ensure completeness.


    A search online will bring many examples of test reports and templates that can
    guide the project manager and team to tailor their test report to their project
    and audience. The test report is developed and sent to the project stakeholders
    for approval. Once approved, the test phase is completed, and the transition to
    production phase begins.


    Finally, before proceeding to the transition to production phase (T2P), some cybersecurity
    projects do not lend themselves to technical testing such as an audit or training
    project; however, there is still a role for quality assurance and quality control.
    For example, one can use peer reviews to find defects in a cybersecurity audit;
    a colleague can review the audit results to find any defects. After a cybersecurity
    training course is developed, it is best practice to pilot test the training to
    determine if the learning outcomes are met (e.g., complete a quality control check).


    ***Table 11.2 Test report contents***


    |   || **Contents** || **Comments** |


    | **Main body** || Test report overview || State the purpose of testing and overall
    results (e.g., the testing was successful), the first content the reader looks
    for in a test report. You may add the UAT was successful, the end users verified
    the system’s quality, and is ready for release |


    | Test results || List the testing metrics and highlight key points or anomalies
    of interest |


    | Defects || List defects encountered and resolved and any outstanding defects.
    Refer the reader to the Appendix—Outstanding Actions—for the defect resolution
    plan |


    | Conclusion || Restate the overall results and emphasize that testing is complete
    |


    | **Appendixes** || Application overview || Provide a brief overview of the software
    application should the reader be unfamiliar with its functionality. Identify integration
    points, cloud storage, security, etc. |


    | Test environment, data, and tools overview || Provide an overview and assessment
    of the test environment, data, and tools used to test the application |'
