    | 1.4 特殊性 | 常规、典型 | 1 2 3 4 N/A | 异常、稀有 |

    | 2. 通信 | 容易、有效、愉快 | 1 2 3 4 N/A | 敌对、困难、复杂、混乱 |

    | 2.1 利益相关者数量 | 较少 | 1 2 3 4 N/A | 众多 |

    | 2.2 地理分布 | 距离近（同一建筑或城市） | 1 2 3 4 N/A | 散布（不同国家） |

    | 3. 集成范围 | 一致、简单、凝聚 | 1 2 3 4 N/A | 割裂、混乱、模糊 |

    | 3.1 接口数量 | 较少、简单、常规 | 1 2 3 4 N/A | 众多、复杂、临时 |

    | 3.2 合同数量 | 较少、彼此熟悉 | 1 2 3 4 N/A | 众多、全新 |

