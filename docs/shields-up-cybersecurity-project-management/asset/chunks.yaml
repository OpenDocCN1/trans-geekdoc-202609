    我们的目标是将项目产生的产品或服务无缝转移到运营，并实现预期的成果。我们在规划阶段就完成了确定的 T2P 行，以便将服务发布到生产环境，包括回滚计划。我们包含了培训和沟通，以确保平稳过渡。我们与变更控制委员会（CAB）和发布经理合作，计划并将服务发布到生产环境。


    ### 表 12.1 CAB 上线状态报告


    | 发布元素 | 状态 | 注释 |

    | --- | --- | --- |

    | 网络安全就绪情况 | 绿色 | 列出已完成的安全措施以及就绪状态 |

    | 系统就绪情况 | 绿色 | 已就绪 |

    | 新服务就绪情况 | 绿色 | 已就绪 |

    | 运营就绪情况 | 绿色 | 部分培训尚未完成；但赞助人确认组织已准备就 |

    | 培训状态 | 橙色 | 11% 的人员尚未完成培训；正在提供额外的培训。95% 的人员将在第 2 周（上线后）完成培训 |

    | 沟通就绪情况 | 绿色 | 已就绪——包括回滚沟通 |

    | 报告就绪情况 | 绿色 | 已就绪——已发布升级程序 |

    | 支持就绪情况 | 绿色 | 已就绪——模拟演练已完成 |

    | 风险 | 绿色 | 无高严重风险；受控制中 |

    | 问题 | 绿色 | 无高严重问题；受控制中 |

    | 其他 | — | 无 |


    ### 微学习


    以下是一些增强你学习效果的实操练习。请在网络上搜索：


    * ITIL 发布管理

    * ITIL 发布管理模板

    * ITIL 发布管理实践

    * 发布策略（例如金丝雀发布/暗色发布）

    * 变更授权委员会


    # 第 13 章


    ## 监控、稳定与结束


    服务或产品已交付给运营，项目团队转向支持（早期生命支持）和结束活动。ITIL 服务价值链的最后活动是根据用户的期望和规范交付并支持新服务。团队寻求有关发布质量的反馈，并与最终用户保持联系。项目团队接收服务成功的反馈，以指导支持和未来的优化规划。某些项目受益于上线指挥中心，该中心聚集项目和运营资源，以便立即解决工单并进行报告升级。上线计划将具有预定的触发点，用于升级和报告问题，以及触发从生产环境中卸载并回滚新服务的触发点。


    监控新服务质量的一种方法是监控事件。ITIL 在其事件管理实践中提供了相关指南。项目经理可能会查看每日事件报告（如果有），以了解采用情况和质量。例如，监控关键性能指标（`KPIs`）（如解决时间）并将其与服务水平协议（`SLAs`）进行比较。在检查事件时，将事件分为技术类事件和培训相关类事件，以更好地理解实施质量。项目经理通常根据每天工单量或每周工单量建立结束阶段的门限，或者在预定的监控期（例如四周）后结束项目。在项目团队监控和支持新服务的同时，他们同时进行结束活动，如对合同进行合规审计。一旦达到结束指标，项目即告结束。


    结束流程的目的是正式终止项目，将产品或服务转移给赞助人，并释放项目资源。一些项目经理使用清单来指导结束活动，例如：


    1. **交付物交接：** 正式将交付物转移给赞助人，并在会议纪要或电子邮件中确认验收。可以使用需求追溯矩阵（`Figure 11.2`），其中包含确认会议纪要或电子邮件的链接。

    2. **项目完成通知：** 通知所有利益相关者需求已交付且项目已完成。指导利益相关者在需要协助联系服务台。

    3. **合同结束：** 审查合同以确保已履行所有合同义务。一些项目经理使用需求追溯矩阵记录是否已履行合同义务。

    4. **资源：** 释放资源（人员和设备）并与团队庆祝。

    5. **教训总结：** 与项目利益相关者完成教训总结，考虑哪些地方做得好，哪些地方可以改进。


    在结束报告中记录这些行动，并归档项目文件以供未来参考。通过电子邮件通知赞助人项目已结束（终止），并将通知添加到项目存档中。


    教训总结是许多组织的共同做法。哪些地方做得很好？我们遇到了哪些困难？我们应该停止做什么？我们应该继续做什么？以及其他问题也有助于学习，而这是 *Shields
    Up* 中所有指导良好实践和混合项目管理框架的基石。结束报告通常包含教训总结部分。然而，教训往往被收集了但并不总是被汲取；为什么我们的项目失败率如此惨淡且反复出现？因此，我的建议是在项目开始和每个项目阶段开始时完成教训总结。在团队会议期间，这些可以是简短的讨论，以应用在之前的项目中积累的智慧和知识。我们不仅可以应用之前的学习，团队也看重他们的建议得到实施。当对教训进行排序并分配给专人在受跟踪和报告的截止日期内完成时，教训总结的实施会更加有效。


    ### 微学习


    在网络上搜索更多关于项目尾声的信息；圆满收官是终止项目的首选方式：


    * 如何终止项目？

    * 如何完成教训总结练习？

    * 在哪里找到合同结束模板和合同结束函？

    * 寻找项目结束的最佳实践？


    # 第 14 章


    ## 运营与优化


    当项目结束后，运营部门负责管理通过你的项目交付的服务。ITIL 提供了一个框架、工具和流程来管理和优化服务。项目可能会留有遗留；可能会有挂起的工单以完成尚未完成的项目行动。例如，某个需求可能由于缺陷未得到满足，该缺陷可以通过未来的补丁来修复。供应商对补丁和升级有发布策略和计划。挂起的工单可以提醒运营人员寻找补丁并计划其发布，以满足缺失的功能。


    六西格玛优化方法结合 ITIL 和 ISO 9001 的持续改进，提供了优化产品和服务以交付更多价值的框架和工具。如果遵循经过证明的流程（例如六西格玛 DMAIC
    问题解决和优化流程），优化将更加成功。优化建议可能会导致服务价值链产生新的项目和倡议。


    某些项目采取迭代和分阶段的方法（ITIL 认可），从最小化安装开始。一旦基础功能安装（“原装安装”）并投入使用，最终用户将更好地了解哪些地方应该进行优化和扩展。优化可以触发新项目，这些项目可以通过变更控制流程进行考虑，以获得进行新项目的批准。


    '
