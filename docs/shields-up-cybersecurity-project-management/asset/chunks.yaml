    使用 `Gizmo` 可以提高团队对项目的理解并达成共识，从而产生更好的项目计划。`Gizmo` 引导团队系统地分析项目，并帮助团队转变信息曲线。例如，团队可能会识别出通过
    `Gizmo` 发现与工作投入或能力差距相关的风险。一旦通过 `Gizmo` 识别出风险，就可以通过风险管理流程进行管理。当你使用 `Gizmo` 分析项目时，你转变了信息曲线（参见图
    7.1），并更早地理解项目以及你应对风险和机会的能力，从而获得更精简的项目。通过 `Gizmo` 转变信息曲线可以提高项目的概率，并交付符合用户预期价值。


    ## 复杂度属性


    ### 1. 约束

    阻碍任务执行的因素

    - **1.1 人力资源**：人员可能不具备技能，或在需要时无法到位。

    - **1.2 时间/进度**：根据批准的时间，时间可能不足以完成项目。

    - **1.3 预算/融资**：可能或没有足够的资源来完成批准的工作范围。


    ### 2. 项目相对规模

    - 项目随着规模的增加而变得更加复杂；然而，规模相对于组织的经验和能力而言。项目外部风险事件对成功完成项目的影响和发生概率从低到极端不等。


    ### 3. 项目关键性

    项目对相关组织生存和运营未来的影响程度

    - **3.1 重要性**：项目对组织战略有多么重要。

    - **3.2 优先级**：当另一个“竞争性”项目提交进行管理决策和行动时，该项目的优先程度。

    - **3.3 影响**：项目成功或失败对相关组织和利益相关者产生。


    ### 4. 不确定性与风险

    风险是导致结果变化的因素，而不确定性是可能结果的范围。在这里我们评估项目工作本身外部环境的风险和不确定性。


    ### 5. 组织环境

    项目计划和管理的环境

    - **5.1 文化**：组织的文化（习俗、传统、语言、仪式、服装、礼仪等）与项目目标、工具和流程的匹配程度。

    - **5.2 治理**：组织监督运营的程度与项目人员希望计划和管理的方式的兼容性。


    ### 6. 商业环境

    商业环境促进项目完成的程度

    - **6.1 文化**：组织外部文化（习俗、传统等）与项目目标、工具和流程的匹配程度。

    - **6.2 治理**：市政/城市/国家的方式与项目人员希望计划和管理的方式的兼容性。

    - **6.3 经济**：经济促进项目完成的程度。

    - **6.4 语言**：商业环境中使用的语言被项目人员理解的程度。

    - **6.5 政治气候**：政治局势稳定程度。


    ## 表 A2.1 Gizmo 属性


    | 复杂度属性 | 简单 | 评分 | 复杂 |

    | :--- | :--- | :--- | :--- |

    | 1. 约束 | 约束少 | 1 2 3 4 N/A | 约束众多 |

    | i. 人力资源 | 胜任且到位 | 1 2 3 4 N/A | 技能缺乏或无法到位 |

    | ii. 时间/进度 | 允许时间充足，流程简单 | 1 2 3 4 N/A | 具有挑战性且复杂 |

    | iii. 预算/融资 | 预算宽松且备用金充足 | 1 2 3 4 N/A | 具有挑战性或不足 |

    | 2. 项目相对规模 | 规模小且易于管理 | 1 2 3 4 N/A | 极大 |

    | 3. 项目关键性 | 关键性低 | 1 2 3 4 N/A | 极关键性 |

    | i. 重要性 | 对组织重要性较小 | 1 2 3 4 N/A | 对组织极其重要 |

    | ii. 优先级 | 优先级低 | 1 2 3 4 N/A | 最高优先级 |

    | iii. 影响 | 失败不会产生长远影响 | 1 2 3 4 N/A | 项目失败，组织也失败 |

    | 4. 不确定性与风险 | 风险和可能的结果已识别 | 1 2 3 4 N/A | 风险众多且可能的结果范围广泛 |

    | 5. 组织环境 | 对项目管理友好且成熟 | 1 2 3 4 N/A | 对项目管理敌且不成熟 |

    | i. 文化 | 同质且和平 | 1 2 3 4 N/A | 多元化存在冲突 |

    | ii. 治理 | 责任链简单、清晰 | 1 2 3 4 N/A | 复杂、涉及多家公司、存在冲突 |

    | 6. 商业环境 | 对项目友好 | 1 2 3 4 N/A | 具有挑战性、困难、复杂、任意 |

    | i. 治理 | 公平、开放、可预测 | 1 2 3 4 N/A | 不公、不可预测、易腐败 |

    | ii. 经济 | 稳定、健康 | 1 2 3 4 N/A | 波动、虚弱 |

    | iii. 语言 | 同质 | 1 2 3 4 N/A | 异质 |

    | iv. 政治气候 | 公平、开放、可预测 | 1 2 3 4 N/A | 不公、不可预测、易腐败 |


    ## 表 A2.2 Gizmo 工作量属性


    | 工作量属性 | 简单 | 评分 | 复杂 |

    | :--- | :--- | :--- | :--- |

    | 1. 工作类型 | 常规、简单、不复杂 | 1 2 3 4 N/A | 复杂、不可预测、危险 |

