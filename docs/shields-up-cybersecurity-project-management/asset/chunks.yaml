    当首席信息安全官（CISO）应对紧迫的网络威胁时，一些人开始考虑坏法分子获取并利用量子计算能力来协助攻击，从而形成不对称优势（Creese et al. 2020,
    44）。其他人则认为，技术的进步“将击败许多当前的防御”（Creese et al. 2020, 44）。我们看到一种趋势：人类在网络攻击（攻击者和防御者）中的参与度正在减少；这意味着机器学习算法和深度神经网络被创建用于攻击漏洞，而防御者则依赖这些技术来阻止攻击，因为人类的“交互速度不够快”（Creese
    et al. 2020, 30）。因此，我们看到一些 CISO 正在放弃 100% 的保护，转而通过具有固有风险的新技术支持创新，以保持竞争力（Scholtz
    2021, 11）；也就是说，他们正在减少消除 100% 漏洞的努力，转而提升他们的威胁检测和响应能力（Scholtz, 2021）。我们可能会看到更多关注通过
    AI 和机器学习自动化的终端安全解决方案，以检测并拦截恶意的终端行为（CyberEdge Group, LLC 2020, 26），以及网络安全网架构的出现（Groombridge
    2021, 3）。


    ## 交付预期更加严格


    网络安全预算正在增加以支持网络安全战略，并期望通过与网络安全活动和业务成功指标相关的指标改进治理，以确保我们的网络安全投资是高效且高价值的（Scholtz
    2021, 9）。事实上，存在一种风险量化的趋势，以优先考虑并目标化网络安全投资。我们的 CISO 向董事会承诺按时、按预算交付项目，并有效高效地管理变更，通过项目管道带来创新（Hale
    2017, 364; Scholtz 2021, 9）。有效高效的项目管理是 CISO 履行承诺的关键。


    ## 业务伙伴机会的出现


    为了实现项目成功，我们被鼓励变得更加业务化，通过支持业务结果而非仅仅保护数字资产（Scholtz 2021, 4）。我们需要像认同自己的目标一样认同业务目标。也就是说，我们需要超越技术；随着组织网络安全管理方面日益成熟，网络安全越来越多地从整体上被视为一个业务问题，而非技术问题（Hale
    2017, 361–362）。为了在网络安全角色中真正发挥作用，我们被鼓励超越技术关注，像 CISO 一样思考以提高我们的决策能力（Scholtz 2021,
    9）；也就是说，我们需要“透彻地了解业务”（Dhasarathy et al. 2020, 3）。因此，`Shields Up` 包含了以业务为导向的练习、微学习和职业规划，帮助读者培养一套平衡的能力。


    ## 网络安全预算增加


    通常，我们将看到 IT 预算继续增长，因为组织正投入更多资源到提供颠覆、创新和变革的项目中（Moyer 2021, 3）。仅仅实施技术是不够的；这些技术需要被管理和保护。因此，我们预测网络安全预算将继续增加（Claus
    2017, 10; CyberEdge Group, LLC 2020）。网络安全预算的一个挑战是需求超过了能力（Olts 2020）。


    网络安全监管可能是复杂的、碎片化的且冲突的，使得合规变得困难（Pipikaite, Barrachin, and Crawford 2021）。网络安全法规不仅在增加，其覆盖范围也在扩大。随着机器学习网络安全活动的增加，政府和机构对对抗性机器学习变得日益关注，并正在制定相应的认证框架。例如，`ISO`
    和 `美国国家标准与技术研究院 (NIST)` 正在制定“认证准则”来评估机器学习的信赖度（Microsoft 2020）。


    ## 网络安全监管扩张


    由于网络攻击数量增加等许多原因，预计会有更多的网络安全监管（Creese et al. 2020, 37）。例如，`AustCyber (2020)` 估计，澳大利亚经济为期四周的干扰可能导致
    3000 亿美元的损失和 16.3 万人失业。金融行业已经意识到这种损失的规模：“坏法分子正在利用这种数字化转型来对金融机构进行窃取、破坏或其他威胁”（Maurer
    and Nelson 2020）。


    其他人预测网络安全监管将变得更加严格，伴随着更重的罚款和更短的实施周期（Peacock 2020）。《网络安全法》（`Cybersecurity Act`）强化了欧盟的规定，并为货物和服务建立了认证计划（European
    Commission 2021a）。事实上，美国已经发布了一项行政命令，通过“进行大胆变革和重大投资”来提高所有联邦机构的网络安全（White House
    2021）。长期存在与网络安全相关的法规，例如《健康保险可携带性与责任法案》（`HIPAA`）和格姆-莱奇-布莱利法案（`GLBA`）（Warsinske,
    Mark, and Kevin 2020）。更多的美国网络安全法规正在出台（Tucker 2020），特别是在 `Colonial Pipeline` 和
    `JBS` 遭受大规模勒索软件攻击之后（Marks 2021）。


    '
