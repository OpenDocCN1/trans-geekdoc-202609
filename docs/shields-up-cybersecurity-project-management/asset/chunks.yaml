    《Shields Up：网络安全项目管理》一书涵盖了读者在 IT 部门中可能担任的广泛角色，特别是在管理战略和运营项目方面，包括网络安全。从事项目管理、质量管理、风险管理、网络安全、IT
    运营支持、战略规划等工作的人都会非常感谢这本书。令我惊讶的是，它与 `NIST`、`ITIL`、`PMBOK`® 指南甚至 `ISO 风险管理` 完美契合。我主倡采用基于风险的方法来管理网络安全，这是《Shields
    Up》的核心主题。这本书分享了核心知识和专业技能，而 Greg 完美地把握了这些以及许多内容。”——**Irene Corpuz, PMP, ITIL, CISA,
    CEH, ISO 27001 首席实施员与审计师，项目经理，阿联酋联邦高等教育机构**


    **


    ## 卓越的项目管理实践


    “Skulmoski 博士的书是卓越项目管理实践的隐喻。它提供的内容对于快速发展的业务环境至关重要，而且其时效性令人赞叹。《Shields Up》将使项目经理能够成功交付技术和网络安全项目。”——**Alan
    Patching 教授，博士，项目管理，澳大利亚债券大学外部事务副院长**


    **


    ## 清晰简洁地指导网络安全专业人士


    “在《Shields Up》中，Skulmoski 清晰且简洁地指导网络安全专业人士如何将项目管理技术和原则融入工作中，以提升他们的项目水平和职业生涯。他显然理解网络安全专业人士的挣扎以及对时间的巨大需求。通过提供关于项目管理的专家建议（包括该领域的最新思想和发展），他为网络安全专业人士提供了他们成功所需的关键工具。”——**Derek
    Molnar, PMP, IT 项目经理，美国科罗拉多州立大学**


    **


    ## 一本坚实的指南


    “《Shields Up》是一本坚实的指南，涵盖了网络安全项目中常见的所有阶段和标准、未来需求，并深入探讨了为什么由于人才短缺和项目需求增加，IT 交付缺口只会恶化。从端到端的项目视角来看，这本书完美涵盖了网络安全项目管理的标准、衡量实践（`KPIs/SLAS`）和指导原则。总的来说，这本书以令人愉快且极快的节奏详尽地描述了技术项目管理的全景。”——**Thiago
    Santos, 高级技术架构师，Mulesoft，加拿大**


    **


    ## 务实、信息丰富且趣味可读


    “首先，我要感谢作者写了这本书。我发现它非常务实、信息丰富，而且读起来很有趣。《Shields Up》结构良好，易于阅读。作者对网络安全和项目管理专业领域提供了坚实的介绍，并辅以练习和微学习机会。此外，我发现这些插图非常有帮助，因为它们总结了知识并有助于记忆记忆，特别是对于每个指导框架（例如，`NIST`、`ITIL
    4` 和 `PMBOK`® 指南）。


    这本书在技术内容和项目管理内容之间取得了恰平衡，非常适合网络安全专业人士和大多数技术岗位。《Shields Up》 也会吸引那些在项目管理办公室（`PMOs`）工作的人。


    这本书的一个重要益处是，它可以指导技术人员转型项目管理职业。这本书可以作为一份快速参考指南，弥补技术和项目管理实践领域的知识差距。总的来说，我向技术专业人士推荐这本书。”——**Israa
    Abulawi, BEng, ISACA, 企业项目经理，医疗保健，阿联酋**


    **


    ## 独特资源


    “《Shields Up》是一份真正独特的资源。它通过项目管理的视角探索了网络安全这一重要领域。我相信，对于任何想在数字世界从事职业的人来说，这都是必读之。”——**Craig
    Langston, 博士，项目管理，澳大利亚债券大学**


    **


    ## 前言


    那是 2012 年 7 月底，我刚刚抵达阿布扎比，接受了 IBM 的职位。我因成功为临床医生实施培训计划而被 IBM 招募，在上班的第一天，我满头大汗、饱受时差，来到克利夫兰医学诊所的临时办公室，并见到了我的大客户——克利夫兰阿布扎比。


    尽管我当时已经拥有近 15 年的 IT 项目管理经验，但随后与 Greg 共事的几周、几个月和几年是一场教育。我的一些新同事非常讨厌向 Greg 提交交付物（例如详细需求），因为他的审查非常详尽。事实上，Greg
    坚持最高水平的质量，并在执行中展现了对项目管理理论和实践的深厚理解。


    我后来得知，Greg 关注质量保证（预防错误）而非质量控制（修复缺陷），这是一项团队建设工作，其目标是增强细节关注能力并在首次就确保技术正确，这是一种非常高效的方法。Greg
    的团队按时交付了所有项目，上线监控阶段异常平静，表明技术被成功采用。Greg 的项目提前结束。当项目结束时，供应商可以干净地离开，因为从未出现过质量问题；我很欣赏
    Greg 也照顾了他的供应商。


    Skulmoski 博士还证明自己精通成人学习和培训理论（成人教育）、课程和学科学习成果、教学设计以及许多成功学习所需的其他要素。回到 2015 年 3 月，我们按时开放了克利夫兰医学诊所阿布扎比院长，所有的护理人员都能使用世界级的系统提供关怀服务。Greg
    在几年后接受了债券大学的教授职位，随后我将与 Greg 学到的知识带到四个国家的十几个其他背景中，进行实验、重新学习，但在许多时候，我是站在与 Greg 共事期间形成的确定性基础上的。”


    '
