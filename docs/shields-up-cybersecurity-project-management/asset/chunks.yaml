    for perfect, likely, and outrageous conditions of uncertainty. We use the calculated
    estimates in the detailed and high-level budgets. We complete the budget exercise
    by looking for wide-range estimates, identifying risks, and updating our risk
    register for budget-related risks and issues.


    #### Project Communications

    A lean approach to project management is to consider project human resources and
    communications management at the same time since our communications focus on people.
    Human resources management is the process of leading, coordinating, and managing
    the project team and determining your team’s roles and responsibilities. Project
    communications management involves ensuring that the right people receive the
    right project information at the right time. Effective communications do not just
    happen; they need to be planned, managed, and monitored. There are many forms
    of project communication like e-mails, risk registers, schedules, budgets, status
    reports, and application design documents; many of these forms of communication
    result from project meetings.

    '
  trans: '


    ### 2. 风险敏感估算

    估算考虑了风险和机会；因此，PLO（三点估算）估算比大多数单点估算更现实。即使使用单点估算并增加 10% 的备用金，我们可能仍然低估了。例如，可能的估算总计为
    105 天，而计算出的估算为 127.2 天（见图 8.4）。如果我们使用可能值并加上备用金（`105 + 10.5 = 115.5`），我们仍然比计算出的估算少了近
    12 天。当你在网上搜索“IT 项目成功率”并查看准时完成的 IT 项目比例时，你会发现大约一半的 IT 项目都延期了；也就是说，所需的时间比批准的多。也许，如果项目经理遵循三点估算法并在计划中使用计算出的估算，许多此类
    IT 项目将通过使用更现实的 PLO 估算准时完成。


    ### 3. 识别风险

    通过查看宽范围估算（见图 8.4），可以明显看出风险存在的地方。例如，活动 A、C 和 D 在可能值和悲观估值之间跨范围很大；如果不妥善管理风险，这三个活动的完成时间可能会比可能估值长得多。我们已经识别了三个风险活动，项目经理和领域专家（SME）可以制定计划来防止和缓解相关风险。我们不仅快速获取了工期估算，还知道关键风险在哪里以及如何处理它们。没有
    PLO，单点估算可能会误导我们风险所在的位置。例如，在图 8.4 中，如果被问及哪项活动风险最大，很多人会猜是活动 D，因为它的时长最长（30 天）。然而，活动
    A 和 C 具有风险，但由于它们的工期估算较低，使用单点估算可能不会将其识别为风险活动。PLO 帮助我们发现并优先考虑风险。


    ### 4. 识别机会

    当我们使用 PLO 时，如果进度落后并希望赶回时间，我们可以识别出压缩活动的机会。例如，在图 8.4 中，如果我们需要压缩活动来追赶进度，由于完美估值和可能估值之间的跨度很大，我们将选择活动
    A 和 D 进行压缩（例如，它们在关键路径上）。我们不会优先考虑压缩活动 B、C 和 E，因为压缩它们能获得的时间非常少。


    ### 5. 提高估算质量

    由于估算技术是有方法的，且估算包含了风险和问题，因此我们的 PLO 估算比单点估算更好。通过 PLO 估算，项目经理理解每项估算的风险和机会，制定风险和问题管理计划，并将其记录在风险注册表中。PLO
    估算技术有助于移动信息曲线，从而获得质量更好的估算并提高进度成功率。


    ### 6. 提升专业水平

    当你高效地完成估算过程、识别了风险和机会并拥有一风险管理计划时，你在同事和领导面前的地位得到提升。使用 PLO 方法是职业发展的助器，因为你通过理解风险、问题和机会，并通过风险管理提高项目成功率，从而移动了信息曲线。


    现在我们有了工期估算，我们使用这些计算出的估算来制定进度。我们添加前置和后置逻辑，并为每个任务分配人员。进度计划软件随后可以为我们提供详细的基准进度。计算出的工期估算也用于更新甘特图。进度制定完成后，我们来制定预算。


    #### 练习

    建立一个电子表格模板，按阶段收集多个参与团队的 PLO 估算，以供未来项目使用。


    #### 项目预算

    预算编制与进度的编制过程类似；与其问“需要多久”，不如问“将花费多少费用”，并使用 PLO 估算技术来得出预算的计算估算值。正如前面提到的，某些项目不需要预算，因为资源是内部的，不需要外部支出（例如，顾问或新硬件）。假设你的项目需要更复杂的方法（例如，你需要确定间接成本和间接费用）。在这种情况下，财务和采购领域专家（SME）可以指导你按照组织的预算程序制定预算。


    然而，我们可以遵循 WBS（工作分解结构）来指导我们的估算并制定项目预算（见图 8.6）。我们的 WBS 展示了项目范围；因此，我们可以根据 WBS 开发“自下而上”的预算。WBS
    的顶部是预算类别（例如，工作流设计），底部包含活动。我们估算活动的成本并将其“汇总”到我们的预算类别中。我们向领导展示基于类别（高层）的预算，而不是基于预算种目的详细预算。我们可以将高层预算包含在项目计划的正文中，如果读者需要更多信息，则在项目计划的附录中包含更详细的预算。（我们可以在进度计划中使用相同的方法，向领导展示基于
    WBS 顶部分的甘特图：从初始配置到实施。我们使用底部的活动作为网络图的基础。）


    ![images](img/fig8.6.jpg)


    ***图 8.6 使用 WBS 开发预算***


    当我们与能够提供成本估算的资深 SME 会面时，可以像获取工期估算一样获取成本估算。首先审阅项目章程、优先级三角形（Priority Triangle）和
    PLO 估算法。我们获取在完美、可能和悲观不确定情况下的估算。我们将计算出的估算用于详细预算和高层预算。我们通过寻找宽范围估算、识别风险以及更新预算相关风险和问题的风险注册表来完成预算练习。


    #### 项目沟通

    项目管理的精益方法是同时考虑项目人力资源和沟通管理，因为我们的沟通关注的是人。人力资源管理是领导、协调和管理项目团队并确定团队角色和职责的过程。项目沟通涉及确保正确的人在正确的时间获得正确的项目信息。有效的沟通不会自动发生；它们需要计划、管理和监控。项目沟通有许多形式，如电子邮件、风险注册表、进度表、预算、状态报告和应用程序设计文档；这些许多沟通形式都源于项目会议。


    '
