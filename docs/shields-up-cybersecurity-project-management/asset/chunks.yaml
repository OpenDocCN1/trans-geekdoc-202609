    # 构建阶段 (Build Phase)


    构建阶段重点在于遵循设计文档中的要求并构建产品或服务。构建是一项技术工作，除了根据进度跟踪和控制进度外，项目经理通常只需要极少的概述。ITIL 服务价值系统指导着构建阶段，项目团队作为一个系统共同工作，为用户构建服务（Limited,
    AXELOS 2019, 17–18）。某些组织会在“竣工文档”（as-built）中记录构建过程。一旦产品或服务构建完成并满足构建阶段的关关标准，项目将进入测试阶段。


    ## 微学习


    以下是一些增强你对构建阶段理解的练习：


    * 竣工文档是如何运作的？

    * 竣工文档的最佳实践是什么？

    * 搜索“构建阶段模版”。


    # 第 11 章


    ## 测试阶段 (Test Phase)


    现在产品或服务已经构建完成，我们进入测试阶段并计划测试（[图 6.2]）。测试是一项质量控制活动：发现并修复缺陷。我们很幸拥有来自质量、服务和项目管理专业的持续且广泛的指导来应用于测试活动。（NIST
    网络安全框架侧重于操作层面，未直接涉及网络安全项目期间的测试。）例如，ISO 9001:2000 质量管理标准指导用户如何交付产品和服务：“在规划产品实现时，组织应根据实际情况确定以下内容：……
    c) 针对产品特定的所需的验证、确认、监控、检查和测试活动，以及产品验收标准；……”（ISO 2000, 30）。我们被指导进行测试并让利益相关者参与，以验证我们交付的价值。测试对于质量管理至关重要，并被认为是
    *Shields Up.* 中的一个关键成功因素。


    项目期间的测试在 ITIL 的服务价值系统的“通用管理实践——测试”中有直接阐述（Limited, AXELOS 2019, 24）。*Shields Up*
    与 ITIL 交付能力的方法保持一致，包含了构建、测试和交付（T2P）阶段（[图 6.2]，项目交付方法——项目阶段）。然而，如果你有空闲容量，可以在项目的更早阶段开始制定测试策略和计划。同样，你也可以使用模版或之前的测试策略和计划作为起点。


    测试是项目管理不可或缺的一部分；例如，测试是 PMBOK® 指南的一部分。“在规划阶段，项目经理和团队确定如何测试或检查产品、交付物或服务，以满足利益相关者的需求和期望……”（PMI
    2017a, 285）。PMI 标准将测试定性为项目生命周期中的一个阶段：“测试。在交接、上线或客户验收之前，将对交付物进行最终质量审查和检查”（PMI 2021,
    105）。因此，测试是嵌入在质量管理、服务管理和项目管理标准中的一项关键质量控制活动，也是 *Shields Up* 混合项目管理方法中的核心组件。在某些项目中，我们可以从早的规划阶段就开始制定测试策略和计划，并一直持续开发到测试阶段。


    ## 测试策略 (Test Strategy)


    通过制定测试策略和测试计划来开始测试规划。测试策略可能包含一张测试流程图（[图 11.1]），用以说明流程和参与者。


    测试流程图（[图 11.1]）并没有说明制定测试策略和计划的协作性质；项目经理在项目早期与赞助人和领导层会会以及在项目规划研讨期间，会为测试参与设定预期。某些组织在测试开始前包含一个带有阶段关卡的测试策略和计划审批流程。


    ![images](img/fig11.1.jpg)


    ***图 11.1 测试流程***


    测试策略是一份给利益相关者的简洁报告，从宏观层面概述测试方法以及如何满足测试目标。以下是测试策略的基础，可以根据你的项目进行定制：


    1. **测试目标**：记录并验证测试目标（例如：发现并修复缺陷、提高对产品或服务的信心，以及验证产品或服务符合预期）。

    2. **范围内内容**：识别将测试什么内容以及原因。

    3. **范围外内容**：记录哪些内容将被排除在测试之外以及原因。

    4. **测试类型**：识别并说明你将使用的测试类型理由（[表 11.1]）。有些人人会增加一“理由”列来说明为什么特定测试在范围之内或范围之外。在网上搜索可以发现额外的测试（例如冒烟测试），读者可以查看这些技术理论和实践，以定制适合项目的测试类型。


    ***表 11.1 系统测试概述***


    | **测试类型** | **包含** | **截止日期** | **负责人** |

    | --- | --- | --- | --- |

    | **单元** | 是 | 9 月 12 日 | Jason Hawk |

    | **功能** | 是 | 9 月 17 日 | Saif Al Llama |

    | **集成** | 是 | 9 月 24 日 | Makoto Tamari |

    | **回归** | 否 | — | — |

    | **安装/卸载** | 是 | 10 月 1 日 | Federico Sant |

    | **性能/压力测试** | 是 | 10 月 1 日 | Irene Cornell |

    | **用户验收** | 是 | 10 月 15 日 | Marianne Jones |

    | **安全** | 是 | 10 月 29 日 | Israa Alberta |


    5. **测试执行**：描述并说明测试将是手动还是自动。某些测试可以自动化（例如功能测试），而另一些可能是手动的（例如单元测试）。开源和商业测试工具日益增，许多工具集成了缺陷管理。

    6. **缺陷管理**：描述将如何管理和控制缺陷，以及将使用什么软件来管理缺陷，包括任何待办事项（例如通过供应商未来的软件补丁解决的缺陷）。

    7. **沟通管理**：描述如何告知利益相关者测试结果，包括最终测试报告。

    8. **测试进度**：包含一个高层进度或甘特图。

    9. **测试风险和问题管理**：描述将结合风险管理过程使用缺陷管理。如果发现了重大缺陷，可能会提出并管理风险或问题。


    某些组织拥有测试策略和计划模版（质量保证）来指导项目经理。项目经理可以在项目早期收集测试策略和其他项目相关的模版来实现项目前置，以帮助项目规划。


    ## 测试计划 (Test Plan)


    测试计划是测试策略的扩展和补充。测试计划提供了测试环境、测试脚本和测试数据的细节。领域专家（例如供应商）通常负责制定测试计划：


    1. **测试环境**：测试环境模拟生产环境，并且对于测试和实验性缺陷解决是安全的。测试环境包括满足测试执行最低要求的硬件、软件和操作系统。


