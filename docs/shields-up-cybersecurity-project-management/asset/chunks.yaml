    - 在未来二到五年内，你对你所在的行业和网络安全监管会有何预期？了解可能发生在你行业中的变化可能帮助你主动为新的网络安全法规做好准备。

    - 搜索“如何进行网络安全审计”。考虑要求你的经理领导审计项目。

    - 寻找网络安全审计工具和检查清单。


    ## 网络安全成熟度提升


    网络安全成熟度模型允许组织评估其当前能力并将其放在不同的级别。通过开发网络安全能力基准，组织可以识别差距和需要实现的目标。目前，许多网络安全成熟度模型（表
    3.1）已经过对比和分析（Payette, Anegbe, Caceres, and Muegge 2015, 1–9; Rea-Guamán, San Feliu,
    Calvo-Manzano, and Sanchez-Garcia 2017, 1–15; Garba, Siraj, and Ottoman 2020,
    1–8）。


    存在许多网络安全成熟度模型，例如 `NIST`（参见第 4 章）和网络安全能力成熟度模型（`C2M2`）。`C2M2` 可供任何规模或类型的组织用于评估其网络安全状况并进行改进（美国能源部
    2021, 12）。`C2M2` 模型包含 5 个目标、10 个领域和 3 个成熟度级别，组织可以使用这些标准来评估其网络安全成熟度（图 3.1）。


    人们可以通过开展审计来评估组织在 10 个领域中的每个成熟度级别。通过分析审计结果，领导层可以确定优先领域并建立成熟度改进目标。实现这些改进目标可能会触发新的网络安全项目。


    ![images](img/fig3.1.jpg)


    **图 3.1 C2M2 结构***


    ## 组织网络安全认证


    考虑到日益增长且持续的网络安全威胁以及随后的监管努力，某些组织可能被在网络安全成熟度模型中获得认证。例如，超过 300,000 名承包商和分包商与美国国防部合作；大多数承包商需要
    3 级 `CMMC` 认证才具有合同资格（Horan 2020, 1; Fox 2021, 2）。与美国能源部合作的承包商很快也需要针对 `C2M2` 进行认证（Schwartz
    2019, 1）。为了向美国联邦政府销售，某些技术制造商必须符合 `NIST` 标准（Allied Telesis 2021, 1）。因此，预计组织将日益遵守框架及随后的审计；网络安全项目的这两个来源正向我们走来！


    ## 网络安全人才短缺


    由于“技能转型革命”，工作的本质正在发生变化，人们技能的有效期正在缩短，需要定期进行技能提升（Skulmoski, Langston, Patching,
    and Ghanbaripour 2020, 3）。组织报告在寻找合格人才方面面临挑战（世界经济论坛 2020, 11）。数字化转型导致了通用的数字技能缺口，以及项目经理在实施数字项目方面的困难（PMI
    2018, 6）。专家预测在未来十年中，全球项目管理人才将持续短缺（PMI 2017b），而对合格网络安全项目岗位的需求增加加剧了这一点（Oltsik 2020,
    49）。项目经理存在短缺，但网络安全技能短缺的情况又是怎样的？


    ***表 3.1 网络安全成熟度模型***


    | **模型** | **重点** |

    | --- | --- |

    | 国家标准与技术研究院网络安全框架 (`NIST CSF`) | `NIST CSF` 最初于 2014 年发布，包含五个功能和五个“实施层”（例如，成熟度级别）
    |

    | `C2M2` | 由美国国家安全局于 1996 年首次发布，包含 22 个过程区域的 129 项基础实践，分为 5 个成熟度级别 |

    | 电力子部门网络安全能力成熟度模型 (`ES-C2M2`) | 美国能源部推出了 `ES-C2M2`，它是 `C2M2` 模型的子集，专注于能源 |

    | 石油和天然气子部门网络安全能力成熟度模型 (`ONG-C2M2`) | `ONG-C2M2` 专为石油气行业设计，具有 5 个成熟度级别，是 `C2M2`
    的子集 |

    | 社区网络安全成熟度模型 (`CCSMM`) | 由基础设施与安全中心于 2006 年开发，包含 5 个成熟度级别 |

    | 国家网络安全教育倡议 (`NICE`)-能力成熟度模型 | `NICE`-能力成熟度模型建立于 2008 年，用于培养网络安全人员，具有 3 个成熟度级别
    |

    | `ES-C2M2` | 美国能源部于 2012 年发布了 `ES-C2M2`，包含 10 个领域和 3 个成熟度级别 |

    | 联邦金融检查委员会能力成熟度模型 (`FFIEC-CMM`) | `FFIEC-CMM` 于 2014 年发布，指导金融机构改进其网络安全。该模型有 5
    个领域和 5 个成熟度级别 |

    | 非洲联盟网络安全成熟度模型 (`AUMMCS`) | `AUMMCS` 于 2014 年引入，具有 3 个领域和 4 个成熟度级别 |

    | 系统安全工程能力成熟度模型 (`SSE-CMM`) | 美国能源部于 2014 年发布的描述性模型，分为 10 个领域，具有 4 个成熟度级别 |

    | 计算机安全响应小组 (`CSIRT`) | 欧盟网络信息安全局 (`ENISA`) 发布了 `CSIRT` 成熟度模型，分为三个层级 |

    | 网络安全成熟度模型认证 (`CMMC`) | 美国国防部实施了 `CMMC` 框架以标准化国防工业基础。该模型有 5 个级别、43 项能力和 171 项实践
    |

    | CERT 弹性管理模型 (`CERT RMM`) | `CERT RMM` 引导组织评估业务连续性、安全和 IT 运营 |


