    ## 2. 探索

    思考你未来 5 到 10 年想担任的职位。在网上搜索这些目标职位的职位描述，以了解理想的能力组合。例如，如果你你的目标是成为一名网络安全经理，可以在网上搜索该职位，以更好地了解这些目标职位人员具备的经验类型和能力。


    ## 3. 职业行动计划

    对你的能力与目标工作（例如 `cybersecurity manager`）的能力进行差距分析。然后，制定一个计划来获取相关的经验、知识和技能。


    你注意到这与网络安全成熟度最佳实践之间的相似性了吗？完成自评估，识别差距，并制定行动计划以实现你的目标。我们在组织中遵循这一流程，并可以将其应用于我们的职业规划中。


    ### 技术能力开发

    我们提供了大量的职业发展机会，但我们应该具有战略性：考虑现在和未来所需的技能。继续你的技术开发，并增加新兴技术的技能，例如协作 AI、多模态接口（例如：视觉、听觉和触觉）以及安全的分布式账本（例如
    `blockchain`）。考虑为未来的技术机会做准备。识别未来的技术技能短缺，并开始学习如 `machine learning` 类的解决方案。制定一个获取这些技能和知识的计划；认证是通往技术能力的自然途径。然而，许多认证的价值期很短；随着新兴技术超越底层技术，某些认证可能会过时。例如，随着云服务的普及和
    `Azure` 认证出现，微软计划退休 `MCSA`、`MCSD` 和 `MCSE` 认证（Foley 2021, 1）。关键在于，通过技术认证维持能力是一场无休止的追求。


    ### 非技术能力开发

    通往高级 IT 职位的道路是技术与非技术的结合。当你在网上搜索“CISO 需要哪些技能？”时，你会发现列表中包含的技术技能非常少！CISO 的大部分技能是软技能，如有效的沟通、协作和谈判。事实上，这些正是机器人缺乏的技能！我们发现，战略规划和交付创新经常被列为基本技能；CISO
    使用项目管理工具和流程来将战略和其他创新变为现实。因此，你通过项目管理进行的职业发展之旅可以让你更接近 CISO 和其他高层职位。


    许多非技术性的增长机会涵盖了从工商管理硕士（`MBA`）学位的正式学习，到 `Lean Six Sigma` 和项目管理认证等培训和认证机会（Ottmann
    and Skulmoski 2020, 3）。完成认证的时间比大学学位短，并且可以填补能力差距。`MBA` 学位也是多变的，可以选择通用的 `MBA` 学位，也可以选择应用学位（例如：项目管理
    `MBA` 或创新管理 `MBA`）。大学正在通过提供许多学习路径（如兼职学习、可堆叠学位和微证书）来改进其服务价值流，为个人学生量身定制学习。


    从整体角度对待你的非技术培训；思考服务价值流以及组织如何批准项目向最终用户交付创新。组织遵循项目管理流程，然后将产品或服务交给运营部门进行管理和优化（图 1.1）。因此，一个全面的网络安全专家将在项目和运营方面接受培训和教育。像
    `PMP` 或 `PRINCE` 这样以项目为导向的认证结合 `MBA` 学位或 `Lean Six Sigma` 证书有助于为领导角色做好准备。再次，查看招聘人员列出的管理和领导职位的能力，以了解所需/目标技能集。


    将职业规划与年度绩效考核相结合，可以让你不仅在评估中获得高分，还能帮助你因严谨而脱颖而出。很少有 IT 专业人士在职业规划中考虑一或两年以后，而且大多数人的重点狭隘在技术能力开发上。如果你在培训计划中也包含项目管理和
    `Lean Six Sigma` 等业务技能，你将会脱颖而出。组织支持高价值员工（例如网络安全专业人员）并支付顶尖大学的 `MBA` 研究并不罕见。计划并寻求支持！组织很难寻找和留住网络安全人才。组织通过支持职业规划、提供培训教育支持以及派遣其他职位以获得广泛经验，可以留住优秀人才。


    通过额外的培训，网络安全专家获得了新的知识和技能；寻找应用这些新能力的机会。你可能争取组织内部晋升以获得新经验。然而，横调到如 `Service Desk
    Queue Manager`、`IT Contracts Manager` 和 `IT Service Quality Manager` 等职位也可以提供价值的增长经验。这些职位位于技术部门，但在网络安全部门之外；在广泛领域获得经验可以增加你对整个
    IT 部门及其服务的理解。你也可以自愿在他人休假时“替补”；通过替他人工作获得多样化的经验并加速你的学习。


    ### 微学习

    以下是一些增强你学习的实用练习：


    *   寻找关于微学习和持续性专业发展的文章，以更好地理解这种强大的学习模式。

    *   在网上搜索职业规划流程，并进行定制，以遵循一个符合你逻辑的流程。

    *   搜索高级技术职位的招聘广告，以更好地理解新兴的工作要求和相关能力。识别需要开发的目标能力。

    *   寻找平衡，使你能够开发技术能力以及领导力、沟通和项目管理等非技术能力。

    *   识别并开发持久的能力（例如项目管理），这些能力不会像许多技术认证那样，随着新技术的出现而迅速过时。


