    Test Phase: Final Thoughts


    Along with planning, the testing phase is critical to project success. As the
    criticality and importance of the project increases, so does testing comprehensiveness
    and formality. Testing is a quality control exercise; if the requirements definition
    was correctly executed (quality assurance), then there should be few defects in
    the testing phase. The test plan and strategy guide testing, and the test report
    documents results and next steps. These documents can form a set of templates
    for future testing. We first test the system to find and fix defects, and then
    we invite the end users to participate in UAT. They verify that the requirements
    have been met and that the service is ready for operations. If there is any incomplete
    testing or outstanding actions, we note them and perhaps raise tickets for future
    action.


    ***Microlearning***


    Testing technology has seen advances in testing the process and technologies.
    Search online and discover:


    • How does ITIL service validation and testing work?


    • How does technology defect management work?


    • How do you track testing defects?


    • What is the best testing software?


    • How does automated testing work?


    • Download test strategy, test plan, and test report templates for future use.


    [CHAPTER 12](#Contents.xhtml#rch12)


    [Transition to Production](#Contents.xhtml#rch12)


    The transition to production (T2P) phase includes those activities to hand over
    the product or service produced through the project delivery approach to the operations
    team. ITIL’s Release Management (Limited, AXELOS 2019, 125–127) guides a broad
    range of activities such as:


    1. Delivering the service with a waterfall or agile delivery method.


    2. Ensuring that the new release can be tracked, verified, uninstalled, and backed
    out of the production environment if necessary.


    3. Certifying deviations, risks, and issues can be managed and controlled.


    4. Completing knowledge and skills transfer to operations.


    Add cybersecurity activities to this list to bring the service or product into
    the production environment, such as adding the new product or service to the Security
    Information and Event Management (SIEM) system, conducting penetration testing,
    and revoking the vendor’s passwords.


    Transition to production planning can begin in the planning phase and is finished
    in the T2P phase. For example, cybersecurity should be designed into the product
    or service to meet cybersecurity requirements and have a smooth going-live path
    (ISO 2018a, 7). Critical to ITIL release and deployment, management success is
    the seamless transition between projects and operations for new services (Limited,
    AXELOS 2019, 143–145). Therefore, we develop formal plans to safely release the
    service to our end users to improve the probability of success and align with
    “do-it-once” thinking.


    The ITIL release management processes and tools guide project participants to
    develop and improve the capabilities to transition new and changed IT services
    into operations (Limited, AXELOS 2019, 125–127). Successful project managers create
    and reuse T2P checklists to guide the final project actions to take the product
    or service live.


    T2P Checklist


    Transition to production checklists act like a quality assurance guide to ensure
    that the tail end of the project is “tight, rather than loose.” That is, the final
    go-live activities to transition from a project phase to operations are planned,
    managed, and controlled to improve the probability of a successful implementation
    and adoption. T2P checklists vary by project and organization; however, common
    tasks must be completed to smooth service transition. Involve the deployment manager
    early in the project to plan your release and deployment actions and to create
    a lean T2P checklist:


    1. Inform the change authorization board (CAB) that a new service is preparing
    to go live. Astute project managers add an agenda item to the CAB meeting as much
    as two to three months or more prior to going live to raise the visibility of
    their project. They also inform the CAB that they use a T2P checklist to manage
    and control go-live activities to improve confidence in a methodical release.


    2. Test the backup/restore capabilities.


    3. Remove vendor access as appropriate.


    4. Add the new service to the information systems management system.


    5. Develop and add an FAQ for the new service to the service operations manual.


    6. Train the support desk.


    7. Train the end users.


    8. Perform a vulnerability assessment and remediation.


    9. Complete a system hardening review.


    10. Conduct an information system risk review.


    11. Complete a disaster recovery test.


    12. Develop a go-live communications plan including prepared communications to
    address risks (e.g., an unsuccessful implementation requiring an uninstall from
    the production environment).


    13. Set up a go-live command center for critical and priority projects.


    14. And so on.


    In line with best practices, the project manager completes only the T2P actions
    required to release the service to the end users. The services are valued and
    optimized; tailoring is applied to project planning and service transition activities.


    One of the final T2P actions is getting CAB’s approval to release the new service
    into the production environment. (Some projects do not involve systems released
    into the production environment like cybersecurity audits but may require a report
    or presentation.) Using the change management process is essential since system
    misconfigurations are a prominent attack vector and can be better managed with
    a systematic and formal review before being released into the production environment
    (Microsoft 2020, 74). The project manager coordinates the release date with the
    project schedule and a CAB meeting. Some projects benefit from the project manager
    discussing the release with CAB approving members before the meeting to provide
    detailed answers to any questions.


    When your release is ready to be discussed during the CAB meeting, begin by explaining
    the T2P process you followed (e.g., checklist and raising tickets for T2P services)
    to win confidence that your service is ready to be released and that the stakeholders
    endorse the release. Your message is “good process, good result.” For more critical
    and impactful projects, consider using an infographic or a dashboard ([Table 12.1](#Chapter12.xhtml#tab12.1))
    to explain that the release is ready to be deployed, the organization is ready
    for the release, and you have a plan to monitor and control the release. You strive
    to make approval easy by providing information CAB approvers desire.


    Once permission to proceed is provided by the CAB, it is time to follow your go-live
    plan. Some projects benefit from practicing their go-live, including restore backout,
    and escalation procedures. Quality is improved with checklists to guide go-live
    activities supported with short “standup” meetings. These T2P procedures contribute
    to a smooth and predictable go live.


    T2P: Final Thoughts'
