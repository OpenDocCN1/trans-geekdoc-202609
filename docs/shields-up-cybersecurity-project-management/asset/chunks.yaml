- raw: 'Examine your organization:


    • Identify the project management KPIs your organization tracks and reports. Are
    these the best KPIs to measure progress?


    • Investigate how your organization initiates projects.


    [CHAPTER 8](#Contents.xhtml#rch8)


    [Plan Phase](#Contents.xhtml#rch8)


    The purpose of the planning phase is to develop a plan that defines and *predicts*
    how the project will be executed, how much the project will cost, when the work
    will be executed and completed, the risks and issues encountered, and so on. The
    project manager identifies the work to be completed and who will complete the
    work. The project manager will produce a plan that expands the PID and may include
    a detailed schedule and budget. The goal is to approve the project plan to exit
    the planning phase.


    Lean Project Planning Process


    Lean project planning focuses on reducing waste and satisfying our stake-holders.
    We can follow a lean project planning process ([Figure 8.1](#Chapter08.xhtml#fig8.1))
    to expeditiously plan and shift the information curve resulting in better project
    plans. This phase aims to develop a lean project plan for leadership approval.
    We begin the process by meeting with our project sponsor and begin planning:


    1. **Mission statement:** Validate the mission statement (scope statement) developed
    with the sponsor and make it measurable and objective. (e.g., complete an audit
    of all IT services by June 2023; there is no budget as this is an internal project.)


    2. **Project priority:** Identify the project priority (Priority Triangle, discussed
    later) to achieve alignment.


    3. **Success criteria:** Document project success criteria (Done–Won–Who, discussed
    later) which also contribute to alignment.


    4. **Work breakdown structure:** Use the mission statement to develop a high-level
    work breakdown structure (WBS) that identifies the main work packages.


    ![images](images/fig8.1.jpg)


    ***Figure 8.1 Hybrid project planning process***


    5. **Schedule:** Use the WBS to develop a high-level Gantt chart (bar chart),
    and if your project is sufficiently large, develop a schedule detailing the critical
    path and float. Smaller projects can often be managed with a task list and completion
    dates aligned with the Gantt chart.


    6. **Budget:** Some projects do not require a budget as they are internal projects
    requiring minimal external resources. However, some projects require significant
    external resources (e.g., technical expertise and new equipment) to complete and
    benefit from following project budget and cost management processes.


    7. **Risks and issues:** Identify critical risks and issues (I always include
    the message “our project can fail, but with your support, we are more likely to
    succeed!” to encourage buy-in from the sponsor).


    8. **Governance:** Agree on governance and reporting (e.g., What information does
    the project sponsor and other stakeholders desire? Will there be monthly or weekly
    status meetings?).


    9. **Project roles and responsibilities:** Agree on the project sponsor and project
    manager.


    10. **Lessons learned:** Conduct a lessons learned exercise at the start of your
    project. Ask the sponsor about what went well and what was challenging on previous
    projects, so you can benefit from the lessons learned at the start of the project.
    Your sponsor will appreciate your willingness to incorporate their ideas into
    your project; you have started effective team building.


    Next, after planning with the project sponsor, meet with the SMEs to complete
    the work identified in the WBS. We repeat much of what we have completed with
    the project sponsor: review the mission statement and project priority (we can
    use the PID infographic to begin planning meetings). We examine the WBS to see
    if anything is missing. Thus, we have an iterative and inclusive approach to project
    planning, beginning with the project sponsor and main project contributors.


    We take an iterative and inclusive approach to develop the project plan. We begin
    planning with the sponsor and key project participants. We develop a high-level
    project plan to be presented to key stakeholders in a project planning workshop
    (PPW) (see Project Planning Workshop section). Additional feedback is gathered
    in the workshop, and the team endorses the project plan. The plan is then presented
    to leadership for approval (e.g., baseline the project plan).


    ***Microlearning***


    In *Shields Up*, we use many traditional project management tools and processes
    (e.g., budgeting and scheduling) because they have a long history of success.
    Therefore, we direct the students to search online to improve their understanding
    of the essential project management tools and processes. You can search online
    for detailed instructions and templates to complete the following components of
    a project plan.


    • How to create a project charter?


    • How to write a project mission statement?


    • How to create a WBS?


    • How to create a Gantt chart?


    • How to create a project network diagram?


    • How to create a project budget?


    • How to create a RACI chart?


    • How to manage version control?


    • How to sell anything?


    • How to tell a great story?


    • How to create a design and layout?


    Since baselining the project plan involves gaining the trust of your team, you
    might consider any approval process in the project life cycle to be a selling
    exercise. Therefore, “how to sell anything” and “storytelling” are added since
    they are powerful techniques to help you get approval to proceed. Design and layout
    considerations, graphics, and other creative considerations will give your project
    plan a professional look. You are likely to use selling, storytelling, layout,
    and design skills throughout your career.


    While *Shields Up* is more strategically focused, we include project management
    tools and methods that are lesser known but effective. These tools help us shift
    the information curve to learn more about your project sooner rather than later
    when changes are challenging to make and expensive.


    Priority Triangle


    Project alignment is an early goal project managers work toward since it helps
    to shift the information curve for the project team. Misalignment increases risks
    and issues like scope creep, delays, and cost overruns. However, when the project
    team is aligned, the team is more likely to become lean, and project success is
    more likely. We saw that the Project Feasibility Gizmo helps shift the information
    curve; the Gizmo also aligns the project team. The Priority Triangle (Skulmoski
    and Hartman 2000, 33–37) is another project management tool contributing to team
    alignment and risk reduction.


    The Priority Triangle ([Figure 8.2](#Chapter08.xhtml#fig8.2)) is adapted from
    Martin Barnes classical iron triangle, also known as the triple constraint theory
    (Kerzner 2013, 869). Project teams are constrained by scope, time, cost, and quality;
    a change in one constraint will affect the others. For example, if our client
    asks to increase the scope, we may face increased costs and schedule overruns
    due to the extra work to deliver the increased scope.


    ![images](images/fig8.2.jpg)


    ***Figure 8.2 Priority triangle and alignment***'
