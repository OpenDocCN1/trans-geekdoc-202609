  \ |\n| Scheibenreif and Raskino (2021, 1) | “机器客户代表了本十年最大的新增长机会。事实上，到 2030 年，至少\
  \ 25% 的购买决策将委托给机器” | 现在，我需要考虑机器被黑客攻击，导致机器客户非法使用我们的信用卡！ |\n\n## 颠覆性技术的加速\n\n创新和技术采用正在加速，人们感觉到，如果组织不实施数字化转型战略，对于落后者来说可能已经赶不上技术先驱了（Aaldering\
  \ and Song 2021, 12）。事实上，Covid-19 触发了数字化的巨大加速（Scholtz 2021, 2）。这些技术需要被安全保护，因为它们会带来新的漏洞。然而，随着技术采用的速度加快，保护技术的需求也将随之加快。因此，先驱者可能会继续以加速实施技术，而落后者将试图追赶。结果将是产生更多的技术项目和以更快的节奏进行更多的网络安全工作。\n\
  \n## 需要保护的新技术\n\n在这里特定的技术和趋势并不重要；与技术采用相关的总体趋势更有意义。我们看到 5G 技术的部署开启了组织和恶意行为者连接、复杂性和机会的新时代。世界经济论坛（Creese\
  \ et al. 2020, 6）预测以下变革性技术将变得越来越重要：无处不在的连接、AI 和机器学习、量子计算以及身份访问管理。结合 IoT 和传感器技术将带来新的保护机会和资产。组织将越来越多将其技术生态系统的部分移动到云端，从而为网络安全工作增加额外的复杂性。\n\
  \n我们可以预计下一代计算带来的变革，如计算协作、分布式计算和量子计算将导致速度和效率的提高。先驱者将拥有颠覆性优势，并能够转型战略、运营、供应链和市场（Corbo\
  \ and Ostojic 2021, 2）。我们的组织拥有先驱者提出新技术来帮助我们创新，这并不意外。预计会有更多包含 AI 的提案。然而，这些新兴技术改变了风险方程式，带来了增加和不断变化的威胁、扩大的攻击面、持续的结构性缺陷以及网络攻击导致的严重后果（Creese\
  \ et al. 2020, 13）。\n\n## AI 技术成为主流\n\nAI 是下一件大事（PMI 2019, 2）。我们看到多个行业都有 AI 先驱，包括广告、汽车、银行、电子产品、金融服务、医疗保健、保险、媒体、制药、电信和运输（Corbo\
  \ and Ostojic 2021, 2）。我们可以预计 AI 将广泛应用于：\n\n1. 价值链的自动化和生产力提高；\n2. 下一代客户体验；\n3. 研究和产品开发的转型；\n\
  4. 新的业务模式、产品和服务（Corbo and Ostojic 2021, 2）。\n\n因此，我们将看到更多与 AI 相关的项目实施应用类 AI 应用和服务。这些由\
  \ AI 支持的应用和服务将需要网络安全的参与。\n\n\n\n\n随着设备供应商保持与其现场设备的连接，并使用 AI 预测维护需求，我们可以预计物联网（IoT）的出现将会增长并加速（Dahlqvist,\
  \ Patel, Rajko, and Shulman 2019, 3）。传感器技术的进步以及智慧城市的普及推动了物联网的采用（Dahlqvist et al.\
  \ 2019, 3）。我们可能会看到纳米 IoT 传感器附在人体上、摄入或与器官整合，以便人体监测和增强（Skilton and Hovsepian 2018,\
  \ 30）。像摄入式 IoT 传感器这样的创新是快速增长的物联网技术领域的示例。事实上，到 2022 年，物联网设备可能多达 500 亿个，这种“快速扩散使得这些产品成为日益增加的网络攻击的吸引目标”（Microsoft\
  \ 2020, 30）。同样，通过项目交付网络安全服务将会有更多机会。\n\n遗憾的是，坏分子将在网络攻击中越来越多地使用 AI 及相关技术。例如，AI 的恶意使用将变得更加复杂和无处不在，自动化攻击可以增加攻击的速度和规模（Creese\
  \ et al. 2020, 28）。对抗性机器学习（攻击机器学习的行动）预计将增长（Microsoft 2020, 35）。攻击者将能够从被盗数据中提取更多价值，并能从攻击中造成更大的损害（Creese\
  \ et al. 2020, 12）。进攻性 AI 将找到攻击其目标的新方法。AI 防御也将看到组织和个人采用的增加。AI 防御能力将看到防御态的改进、动态威胁检测、主动防御、响应和恢复速度的提高以及对攻击判定的改进（Creese\
  \ et al. 2020, 29）。AI 将帮助我们检测我们不理解语言中的威胁，并发现和理解人类永远不会考虑的恶意模式（CyberEdge Group, LLC\
  \ 2020, 34）。“我们甚至可以放言说，机器学习和其他 AI 技术为我们提供了追赶并超越坏人的最后机会”（CyberEdge Group, LLC 2020,\
  \ 35）。预计将会有更多的网络安全项目。\n\n# 第 2 章\n\n## 客户期望驱动 IT 部门\n\n我们看到影响项目性质的、由我们的客户（内部和外部）驱动的新趋势，导致了通过项目交付的\
  \ IT 服务扩张；这些服务需要网络安全支持。组织投资数字化转型项目是为了获得快速胜利、高可行性/高价值潜力项目，以及具有高投资回报率但低可行性的“登月计划”式项目（Obwegeser,\
  \ Yokoi, Wade, and Voskes 2020, 8）。业务部门日益与 IT 合作，实施将转型其业务的项目。我们的客户对 IT 有什么期望？\n\n\
  ### 追求更高的敏捷性\n\n客户渴望灵活性和速度以应对新机会；他们渴望敏捷性^(1)。他们需要可扩展系统（Barquin, Dreischmeier, Hertli,\
  \ Königsfeld, and Roth 2020, 2）以及对业务变更的支持。事实上，我们将看到更多通过整合组合技术（例如，传感器和物联网）来交付新的业务价值（Corbo\
  \ and Ostojic 2021, 2）。因此，我们的业务伙伴日益将技术视为视为解决问题的方法以及快速利用创新机会的方式（业务敏捷性）。\n\n### 追求创新\n\
  \n今天，我们听到“不颠覆就会被颠覆”是创新的号召；无论是增进式改进还是大规模转型，组织都在通过技术项目追求数字化转型（PMI 2020, 2）。业务领袖读到“大多数公司需要建立新的数字业务以保持经济上的可行性”（Williams,\
  \ Galvin, and LaBerge 2021, 3）。事实上，一些人建议采取积极的创新心态以在新兴的超竞争环境中取得成功（PMI 2020, 5）。新兴技术的早期采用者最有可能获得最大的利益（Corbo\
  \ and Ostojic 2021, 15）。一些最常见的数字化转型项目包括终端用户体验数字化、规模化和增强组织基础设施（Dhasarathy, Gill,\
  \ and Khan 2020, 2）。因此，网络安全专业人员拥有独特机会来确保技术创新承诺的利益能够交付。\n\n### 优化精益运营\n\n对精益运营的追求是一种“以少胜多”的业务策略；它高效、有效地交付产品和服务。实现精益运营使该部门或组织更具竞争力。精益倡导者努力减少流程中的步骤，以使流程更高效并消除“痛点”。我们还尝试减少流程中使用的材料和人力资源的浪费。精益六格玛法（Lean\
  \ Six Sigma）是一种识别改进机会的问题解决技术，通常会有流程改进项目。许多流程改进项目以技术、集成和自动化为核心。这些数字化转型活动可能会增加某些组织的网络安全漏洞（Boehm\
  \ et al. 2021, 8）。疫情驱动的数字化转型由于实施速度快，导致了额外的漏洞（Williams et al. 2021, 5）。通过技术变得更精益的愿望可能更多的网络安全努力和项目来解决伴随的网络安全漏洞。\n\
  \n### 什么是微学习？\n\n传统的培训涉及参加几天的培训课程。几个月后，除非进行刷新或使用，否则学习效果会衰减。通过微学习，学习者不断获取可以应用于实际工作的新知识。微学习的持续时间通常每天几分钟，在他们选择的时间阅读一篇文章（Bleich\
  \ 2021, 2）。当学习者遵循“学习并做”清单时，微学习可能更有效（Bersin and Zao-Sanders 2019, 2）。\n\n### 微学习\n\
  \n以下主题可以提高你对精益管理原则和方法的理解与应用。\n\n- 思考你组织中以精益为导向的项目；赞助人的目标是什么？通过流程缩短时间？自动化手动步骤？降低成本？理解高层请求有助于理解详细需求。\n\
  - 学习精益六格玛作为一种流程改进技术。\n\n### 数字化终端用户体验\n\n业务部门正在重新想象技术的角色，更多地关注利用技术来实现和报告业务目标（Dhasarathy\
  \ et al. 2020, 2）。我们将继续看到从手动流程转变为自动化流程和交互的项目请求（Dhasarathy et al. 2020, 2）。手动流程的数字化可能是精益六格玛或质量改进研究的输出，用于识别流程优化机会。遗憾的是，我们看到“风险管理并未跟上数字化和分析转型的扩张”（Boehm\
  \ and Smith 2021, 2）；我们可能为了优先考虑按时和按预算交付目标而牺牲了优化的网络安全。\n\n## 通过自动化改进流程\n\n\n\n\n\
  我们看到，向精益化和数字化转型的趋势加速了对自动化项目的需求。首席信息官（CIO）受邀与业务部门合作，交付“高影响倡议”（Gartner 2020b, 3）。自动化项目日益成为一种紧迫的需求，即通过减少人工参与和改进客户体验来降低成本。自动化和机器人将成为一个增长领域，因为多种技术（例如\
  \ `IoT`、`AI`、`sensors` 和机器智能）将结合起来，创造新的自动化机会（Skilton and Hovespian 2018, 59）。同样，我们将看到更多需要网络安全的自动化和集成项目。\n\
  \n## 启用超连接\n\n各机构正在竞速地与合作伙伴、应用程序（Mulesoft 2021, 4）以及外部数据建立连接，以提高竞争力（Aaser and McElhaney\
  \ 2021, 2）。更多的连接可以带来额外的创新和机会；但连接性的增加也可能带来更多的网络安全漏洞。连接的本质也在发生演变，物理、生物和数字领域之间形成了复杂的系统关系（Skilton\
  \ and Hovsepian 2018, 55）。更多的连接导致了数字生态系统的发展。然而，超连接环境带来了一个问题：对数字生态系统的攻击可能会对受攻击资产的下游节点产生不利影响（Creese\
  \ et al. 2020, 21）。\n\n## 加入新兴的数字生态系统\n\n业务倡议致力于连接组织的系统；然而，它们也渴望与外部合作伙伴和客户建立更多连接。数字生态系统正在兴起，整合了\
  \ B2B 和 B2C 交互（Dietz, Khan, and Rab 2020, 3），为网络中的所有利益者创造价值（Diana and Torrance 2020,\
  \ 1）。预计企业将要求更多参与数字生态系统，以跟快速变化的客户和员工（Dhasarathy et al. 2020, 2）。这些生态系统是复杂的并深受消费者欢迎；但它们也使网络安全团队面临管理额外漏洞可能。\n\
  \n重复一遍，组织专注于交付价值；因此，调整我们的技术生态系统和流程以优化价值，使业务和 IT 目标保持一致。\n\n## 应对更短的交付预期\n\n各机构的项目管理日趋成熟，并开始衡量关键绩效指标（`KPIs`），以评估项目启动、计划、设计、构建、测试和交付给终端用户的速度（Fitzpatrick\
  \ and Strovink 2021, 4）。项目正经历从“快速失败”向“快速成功”的转变（PMI 2020, 2）。与快速交付周期相关的早期问题之一是，网络安全可能没有得到足够的重视，导致产生可以避免的漏洞（Boehm\
  \ and Smith 2021, 2）。\n\n## 提供基于分析的决策\n\n数字化转型项目正在改变我们的工作方式。随着数字连接的增加和流程的优化，业务在面临决策时将产生数据渴求。我们看到分析的需求增加，将其作为组织提供竞争优势的手段（Dietz\
  \ et al. 2020, 6）。预计会有更多来自各种来源数据输入的 `AI` 支持的分析。使用 `AI` 支持分析的结果之一是，企业将预测新的机会，这些机会可能成为需要实施的新项目以及需要保护的更多数字服务。事实上，基于分析的决策是网络安全最佳实践的核心。\n\
  \n## 客户预期的总结\n\n技术需求和采用率正在迅速增长，这并不意外。这种需求是多维度的，始于通过优化和转型项目降低组织客户成本并增加价值的意愿（Moyer\
  \ 2021, 3）。各机构正推进数字化转型和创新项目，需要新技术来提高竞争力。技术被用于在不断演变的数字生态系统中与业务伙伴和客户建立连接。我们的目标是保护这些系统和数据。因此，当我们看到对数字服务的需求增加时，也会看到对网络服务的服务的增加；攻击面正变得越来越复杂（Skilton\
  \ and Hovsepian 2018, 36）。事实上，由于监管和保险要求，我们可能会看到更多网络安全合规项目。因此，更多的技术项目带来了更多的网络安全项目工作，并预期项目将一次性完成并按时按预算交付。\n\
  \n业务敏捷性不同于传统的敏捷项目管理，后者以 `Agile Manifesto` 为基础并使用 `Scrum` 交付方法。业务敏捷性是指关于在动荡环境中通过快速利用市场机会来持续交付价值的能力。\n\
  \n# 第 3 章\n\n## 网络安全的未来\n\n我们知道数字化转型的范围和速度正在增加并加速。更多的技术等于更多的网络安全工作。`cloud`、`AI`、`IoT`\
  \ 和新兴技术正在被采用。然而，IT 网络安全部门也在发生变化。不仅是技术在变，我们的工作方式也在变（世界经济论坛 2020, 3）。\n\n### 技术威胁\n\
  \n大多数观察者预测新威胁将来自新技术（例如 `5G`、`cloud`、`APIs`、`IoT/IoT`、`aaS` 供应商商、`blockchain`、`AI`、数字助手和智能手机）。这本书并不是关于我们感兴趣的具体技术；相反，新兴技术往往是漏洞的来源，许多漏洞源于恶意行为者和人为错误（例如云配置错误）。对新技术的密集攻击导致补丁窗口变得狭窄。国家级威胁将继续存在，并随着犯罪团伙的合作和协作而变得更具创新性。此外，我们不再关注威胁的性质（例如\
  \ `malware`、`phishing`、`denial of service` 和密码攻击），而是担心新技术带来了新的漏洞和新的网络犯罪手段。\n\n###\
  \ 威胁目标\n\n各机构通过采用更多具有潜在漏洞的技术，日益成为攻击目标。由于 `IoT/IoT` 设备的普及、全球超连接的不断扩大以及远程办公的转型，人类攻击面也在增加。网络攻击变得更加复杂，试图控制计算机系统以瘫痪、干扰或控制技术。例如，我们可能会看到组织供应链中出现更多弱环节的数据外泄攻击。不幸的是，网络攻击的速度和规模呈指数级增长，导致一线网络防御人员出现警报疲劳（微软\
  \ 2020, 25）。\n\n## 网络安全策略正在演变\n\n首席信息安全官（`CISOs`）负责制定和管理网络安全策略。当“网络攻击者保持防御优势”时，制定网络安全策略可能是非常困难的（Oltsik\
  \ 2020, 7）。更具挑战的是，新技术处于不断开发和采用的状态中。这种加速的变化导致指导性最佳实践的出现较为缓慢（Howard 2020, 3）。结果是 `CISOs`\
  \ 在制定策略时需要具有创造力。\n\n\n\n\n\n当首席信息安全官（CISO）应对紧迫的网络威胁时，一些人开始考虑坏法分子获取并利用量子计算能力来协助攻击，从而形成不对称优势（Creese\
  \ et al. 2020, 44）。其他人则认为，技术的进步“将击败许多当前的防御”（Creese et al. 2020, 44）。我们看到一种趋势：人类在网络攻击（攻击者和防御者）中的参与度正在减少；这意味着机器学习算法和深度神经网络被创建用于攻击漏洞，而防御者则依赖这些技术来阻止攻击，因为人类的“交互速度不够快”（Creese\
  \ et al. 2020, 30）。因此，我们看到一些 CISO 正在放弃 100% 的保护，转而通过具有固有风险的新技术支持创新，以保持竞争力（Scholtz\
  \ 2021, 11）；也就是说，他们正在减少消除 100% 漏洞的努力，转而提升他们的威胁检测和响应能力（Scholtz, 2021）。我们可能会看到更多关注通过\
  \ AI 和机器学习自动化的终端安全解决方案，以检测并拦截恶意的终端行为（CyberEdge Group, LLC 2020, 26），以及网络安全网架构的出现（Groombridge\
  \ 2021, 3）。\n\n## 交付预期更加严格\n\n网络安全预算正在增加以支持网络安全战略，并期望通过与网络安全活动和业务成功指标相关的指标改进治理，以确保我们的网络安全投资是高效且高价值的（Scholtz\
  \ 2021, 9）。事实上，存在一种风险量化的趋势，以优先考虑并目标化网络安全投资。我们的 CISO 向董事会承诺按时、按预算交付项目，并有效高效地管理变更，通过项目管道带来创新（Hale\
  \ 2017, 364; Scholtz 2021, 9）。有效高效的项目管理是 CISO 履行承诺的关键。\n\n## 业务伙伴机会的出现\n\n为了实现项目成功，我们被鼓励变得更加业务化，通过支持业务结果而非仅仅保护数字资产（Scholtz\
  \ 2021, 4）。我们需要像认同自己的目标一样认同业务目标。也就是说，我们需要超越技术；随着组织网络安全管理方面日益成熟，网络安全越来越多地从整体上被视为一个业务问题，而非技术问题（Hale\
  \ 2017, 361–362）。为了在网络安全角色中真正发挥作用，我们被鼓励超越技术关注，像 CISO 一样思考以提高我们的决策能力（Scholtz 2021,\
  \ 9）；也就是说，我们需要“透彻地了解业务”（Dhasarathy et al. 2020, 3）。因此，`Shields Up` 包含了以业务为导向的练习、微学习和职业规划，帮助读者培养一套平衡的能力。\n\
  \n## 网络安全预算增加\n\n通常，我们将看到 IT 预算继续增长，因为组织正投入更多资源到提供颠覆、创新和变革的项目中（Moyer 2021, 3）。仅仅实施技术是不够的；这些技术需要被管理和保护。因此，我们预测网络安全预算将继续增加（Claus\
  \ 2017, 10; CyberEdge Group, LLC 2020）。网络安全预算的一个挑战是需求超过了能力（Olts 2020）。\n\n网络安全监管可能是复杂的、碎片化的且冲突的，使得合规变得困难（Pipikaite,\
  \ Barrachin, and Crawford 2021）。网络安全法规不仅在增加，其覆盖范围也在扩大。随着机器学习网络安全活动的增加，政府和机构对对抗性机器学习变得日益关注，并正在制定相应的认证框架。例如，`ISO`\
  \ 和 `美国国家标准与技术研究院 (NIST)` 正在制定“认证准则”来评估机器学习的信赖度（Microsoft 2020）。\n\n## 网络安全监管扩张\n\
  \n由于网络攻击数量增加等许多原因，预计会有更多的网络安全监管（Creese et al. 2020, 37）。例如，`AustCyber (2020)` 估计，澳大利亚经济为期四周的干扰可能导致\
  \ 3000 亿美元的损失和 16.3 万人失业。金融行业已经意识到这种损失的规模：“坏法分子正在利用这种数字化转型来对金融机构进行窃取、破坏或其他威胁”（Maurer\
  \ and Nelson 2020）。\n\n其他人预测网络安全监管将变得更加严格，伴随着更重的罚款和更短的实施周期（Peacock 2020）。《网络安全法》（`Cybersecurity\
  \ Act`）强化了欧盟的规定，并为货物和服务建立了认证计划（European Commission 2021a）。事实上，美国已经发布了一项行政命令，通过“进行大胆变革和重大投资”来提高所有联邦机构的网络安全（White\
  \ House 2021）。长期存在与网络安全相关的法规，例如《健康保险可携带性与责任法案》（`HIPAA`）和格姆-莱奇-布莱利法案（`GLBA`）（Warsinske,\
  \ Mark, and Kevin 2020）。更多的美国网络安全法规正在出台（Tucker 2020），特别是在 `Colonial Pipeline` 和\
  \ `JBS` 遭受大规模勒索软件攻击之后（Marks 2021）。\n\n\n\n\n\n- 在未来二到五年内，你对你所在的行业和网络安全监管会有何预期？了解可能发生在你行业中的变化可能帮助你主动为新的网络安全法规做好准备。\n\
  - 搜索“如何进行网络安全审计”。考虑要求你的经理领导审计项目。\n- 寻找网络安全审计工具和检查清单。\n\n## 网络安全成熟度提升\n\n网络安全成熟度模型允许组织评估其当前能力并将其放在不同的级别。通过开发网络安全能力基准，组织可以识别差距和需要实现的目标。目前，许多网络安全成熟度模型（表\
  \ 3.1）已经过对比和分析（Payette, Anegbe, Caceres, and Muegge 2015, 1–9; Rea-Guamán, San Feliu,\
  \ Calvo-Manzano, and Sanchez-Garcia 2017, 1–15; Garba, Siraj, and Ottoman 2020,\
  \ 1–8）。\n\n存在许多网络安全成熟度模型，例如 `NIST`（参见第 4 章）和网络安全能力成熟度模型（`C2M2`）。`C2M2` 可供任何规模或类型的组织用于评估其网络安全状况并进行改进（美国能源部\
  \ 2021, 12）。`C2M2` 模型包含 5 个目标、10 个领域和 3 个成熟度级别，组织可以使用这些标准来评估其网络安全成熟度（图 3.1）。\n\n\
  人们可以通过开展审计来评估组织在 10 个领域中的每个成熟度级别。通过分析审计结果，领导层可以确定优先领域并建立成熟度改进目标。实现这些改进目标可能会触发新的网络安全项目。\n\
  \n![images](img/fig3.1.jpg)\n\n**图 3.1 C2M2 结构***\n\n## 组织网络安全认证\n\n考虑到日益增长且持续的网络安全威胁以及随后的监管努力，某些组织可能被在网络安全成熟度模型中获得认证。例如，超过\
  \ 300,000 名承包商和分包商与美国国防部合作；大多数承包商需要 3 级 `CMMC` 认证才具有合同资格（Horan 2020, 1; Fox 2021,\
  \ 2）。与美国能源部合作的承包商很快也需要针对 `C2M2` 进行认证（Schwartz 2019, 1）。为了向美国联邦政府销售，某些技术制造商必须符合 `NIST`\
  \ 标准（Allied Telesis 2021, 1）。因此，预计组织将日益遵守框架及随后的审计；网络安全项目的这两个来源正向我们走来！\n\n## 网络安全人才短缺\n\
  \n由于“技能转型革命”，工作的本质正在发生变化，人们技能的有效期正在缩短，需要定期进行技能提升（Skulmoski, Langston, Patching,\
  \ and Ghanbaripour 2020, 3）。组织报告在寻找合格人才方面面临挑战（世界经济论坛 2020, 11）。数字化转型导致了通用的数字技能缺口，以及项目经理在实施数字项目方面的困难（PMI\
  \ 2018, 6）。专家预测在未来十年中，全球项目管理人才将持续短缺（PMI 2017b），而对合格网络安全项目岗位的需求增加加剧了这一点（Oltsik 2020,\
  \ 49）。项目经理存在短缺，但网络安全技能短缺的情况又是怎样的？\n\n***表 3.1 网络安全成熟度模型***\n\n| **模型** | **重点**\
  \ |\n| --- | --- |\n| 国家标准与技术研究院网络安全框架 (`NIST CSF`) | `NIST CSF` 最初于 2014 年发布，包含五个功能和五个“实施层”（例如，成熟度级别）\
  \ |\n| `C2M2` | 由美国国家安全局于 1996 年首次发布，包含 22 个过程区域的 129 项基础实践，分为 5 个成熟度级别 |\n| 电力子部门网络安全能力成熟度模型\
  \ (`ES-C2M2`) | 美国能源部推出了 `ES-C2M2`，它是 `C2M2` 模型的子集，专注于能源 |\n| 石油和天然气子部门网络安全能力成熟度模型\
  \ (`ONG-C2M2`) | `ONG-C2M2` 专为石油气行业设计，具有 5 个成熟度级别，是 `C2M2` 的子集 |\n| 社区网络安全成熟度模型\
  \ (`CCSMM`) | 由基础设施与安全中心于 2006 年开发，包含 5 个成熟度级别 |\n| 国家网络安全教育倡议 (`NICE`)-能力成熟度模型\
  \ | `NICE`-能力成熟度模型建立于 2008 年，用于培养网络安全人员，具有 3 个成熟度级别 |\n| `ES-C2M2` | 美国能源部于 2012\
  \ 年发布了 `ES-C2M2`，包含 10 个领域和 3 个成熟度级别 |\n| 联邦金融检查委员会能力成熟度模型 (`FFIEC-CMM`) | `FFIEC-CMM`\
  \ 于 2014 年发布，指导金融机构改进其网络安全。该模型有 5 个领域和 5 个成熟度级别 |\n| 非洲联盟网络安全成熟度模型 (`AUMMCS`) |\
  \ `AUMMCS` 于 2014 年引入，具有 3 个领域和 4 个成熟度级别 |\n| 系统安全工程能力成熟度模型 (`SSE-CMM`) | 美国能源部于\
  \ 2014 年发布的描述性模型，分为 10 个领域，具有 4 个成熟度级别 |\n| 计算机安全响应小组 (`CSIRT`) | 欧盟网络信息安全局 (`ENISA`)\
  \ 发布了 `CSIRT` 成熟度模型，分为三个层级 |\n| 网络安全成熟度模型认证 (`CMMC`) | 美国国防部实施了 `CMMC` 框架以标准化国防工业基础。该模型有\
  \ 5 个级别、43 项能力和 171 项实践 |\n| CERT 弹性管理模型 (`CERT RMM`) | `CERT RMM` 引导组织评估业务连续性、安全和\
  \ IT 运营 |\n\n\n\n\n\n网络安全项目经理的短缺导致了如今巨大的需求，且这种需求在未来将持续 (Oltsik 2020, 36)。与其等待项目经理空缺来领导常规的网络安全项目，不如将网络安全项目经理分配到更具挑战性和更关键的项目中，而将常规的网络安全项目分配给非项目经理角色的人员。事实上，一些人建议\
  \ IT 部门为技术人员提供培训，范围涵盖“业务、沟通、领导力和管理技能”（例如，管理项目和倡议) (Oltsik 2020, 45)。\n\n## 处于危机中的职业\n\
  \n我们的网络安全行业正处于危机之中。不仅需要保护的技术越来越多，而且技术也变得日益复杂，导致对网络安全服务的的需求增加(图 3.2)）。在新的网络安全技术中，技能缺口尤为严重\
  \ (Howard 2020, 5)。\n\n此外，还有其他技能缺口的驱动因素，例如组织战略规划不力以及个人职业规划不足。最后，网络安全角色正在从技术重点转向更广泛的业务伙伴角色，这需要更广泛的技能组合。因此，网络安全技能缺口存在许多驱动因素。\n\
  \n网络安全技能缺口的影响是多方面且深远的。由于网络安全职位未填以及对网络安全服务的需求增加，分配给网络安全专业人员的工作量非常重且充满压力 (Oltsik 2020,\
  \ 21)。工作量增加的直接结果是网络安全专业人员很难跟上对新技术的学习，也难以学会充分利用现有网络安全工具，从而增加了组织的风险 (Oltsik 2020,\
  \ 37)。网络安全技能缺口持续阻碍组织的网络安全。\n\n## 组织角色\n\n组织有很多方法可以缓解网络安全技能缺口的挑战。由于网络安全专业人员面临着保持专业能力和知识的持续压力，他们苦于找不到时间来开发新技能\
  \ (Claus 2017, 8)。因此，组织可以预测技能短缺，并支持现有人员规划他们的网络安全职业，提供培训和发展机会 (Howard 2020, 6; Oltsik\
  \ 2020, 20)。具有远见的网络安全专业人员将积极利用这些知识，与经理和导师一起规划他们的职业。\n\n![images](img/fig3.2.jpg)\n\
  \n***图 3.2 网络安全技能缺口需求模型***\n\n**机会**：建议组织为技术人员提供更多支持，例如培训和发展机会；因此，请与您的经理或人力资源部门讨论职业发展。他们可能会提供高质量的培训和教育资金，并协助职业路径，如外借工作和横向调动。你的组织希望你成功！\n\
  \n## 网络安全职业规划\n\n忙碌的网络安全专业人员在经常进行长时间且高压工作时，往往忽视职业规划，这并不令人意外。相反，网络安全专业人员通常采取非正式且随意的职业管理方法；然而，鼓励网络安全专业人员与转型教练采取系统的方法进行职业规划，并进行全面发展\
  \ (Oltsik 2020, 45)。网络安全专业人员往往侧重于战术 (Oltsik 2020, 45)，并追逐认证以在技术上进行发展。当 47% 的安全专业人员（样本量\
  \ `N` = 327）报告他们渴望成为 CISO（即这更多是一个业务职位而非技术职位）时，仅专注于开发技术专长似乎是违反直觉的 (Oltsik 2020, 17)。因此，作为持续改进的一部分，网络安全专业人员可以从职业规划以及非技术领域（如项目管理）的更广泛发展中受益。（参见附录\
  \ 4 中的职业规划。）\n\n## 网络安全的未来：最后思考\n\n网络安全威胁不断增加并变得更有创新性，目标更多。组织正在通过更新策略和增加预算来加强安全。组织面临着日益增加的网络安全法规，特别是如果打算在政府采购计划内运营。随着网络安全威胁的演变，网络安全战略也在演变，组织日益规划其网络安全成熟度之旅。然而，尽管许多组织拥有健康的预算，但领导层期望\
  \ IT 部门按时、按预算交付项目。因此，我们面临着挑战组织的网络安全技能短缺（包括技术和项目管理方面的技能）。\n\n# 第 4 章\n\n### 技术框架对齐](#Contents.xhtml#rch4)\n\
  \n很少有组织孤立地提供 IT 和网络安全服务；也就是说，他们通常遵循最佳实践和框架来提供高质量的服务和产品。组织遵循网络安全运营和项目的外部框架，以指导质量、技术、网络安全和项目交付（参见图\
  \ 4.1）。\n\n所有框架都对齐，重点在于通过可预测地交付达到质量水平的产品和服务来满足客户，并由持续质量改进驱动创新；交付和优化价值是这些框架和标准的共同目标。\n\
  \n## 质量管理：合规的基石\n\n什么是质量管理？根据国际标准化组织 (ISO) 9004，建立质量政策和过程通过质量规划、质量保证、控制和持续改进来实现目标，从而构成了质量管理体系\
  \ (ISO 2000, 10)。持续改进是提供终端用户认可的服务的根本，如果所有项目利益相关者采取持续改进的心态，这种效果将最大化 (Limited, AXELOS\
  \ 2019, 71)。项目质量管理包括规划、管理和控制项目及其产品或服务的过程，以满足我们利益相关者的目标（例如，提供有价值的内容）。项目质量管理还包括过程持续改进\
  \ (PMI 2017a, 271)。信息技术基础库 (ITIL)、`ISO` 和项目管理协会 (PMI) 的质量管理指南密切相关；`PMI` 侧重于项目背景下的质量管理，而\
  \ `ISO` 质量管理更具通用性。因此，这些标准是对应的，符合其中一种标准就接近符合其他关于质量管理的标准。\n\n![images](img/fig4.1.jpg)\n\
  \n***图 4.1 外部框架对齐***\n\n质量管理支撑着与项目管理、服务管理和网络安全服务相关的最佳实践和标准。在规划如何在项目中管理质量之后，质量管理可以被视为三个步骤：(a)\
  \ 质量保证、(b) 执行和 (c) 质量控制 (图 4.2)。\n\n\n\n\n质量保证旨在为质量要求将得到满足提供信心。大多数标准（例如 `ISO`、`NIST`\
  \ 和 `C2M2`）都指导组织包含质量保证和控制活动。组织提供培训、模板、检查清单和流程来交付正确的质量。然后，我们按照检查清单执行工作，例如配置虚拟服务器。工作完成后，我们进行质量控制：发现并修复缺陷。同样，我们依赖于培训、模板和检查清单，并遵循流程来判断是否交付了正确的质量。我们的质量管理采用\
  \ A-B-C 方法：质量保证（Assurance）、**之前**（Before）、质量控制（Control）。质量管理流程可见于各行各业的领先标准中；因此，通过应用这种简单的质量管理方法，你可能在大多数时间内符合大多数标准中的大多数质量领域。可以预计监管机构和保险公司会针对网络安全特别是通用技术方面要求定期审计。审计可以是一种质量控制项目（例如\
  \ `NIST Framework` 审计和合规流程）。领导一个审计项目有助于开发新的项目管理能力，并增强对技术生态系统的整体理解。\n\n![images](img/fig4.2.jpg)\n\
  *图 4.2 质量管理流程*\n\n## 网络安全框架\n\n网络安全框架是用于管理网络安全风险的标准、指南和最佳实践的集合。框架可以提高可靠性和预测性。这里简要介绍两个领先的网络安全标准，并将其与项目管理在满足这些标准方面的关键作用联系起来：\n\
  \n1. 用于改进关键基础设施网络安全的 `NIST Framework`；\n2. 用于信息安全控制的 `ISO 27000 系列`。\n\n这些标准被广泛采用，影响力日益增长。它们包含了从项目到运营的整个策略生命周期，以持续改进为导向，带来了新项目、新机会和服务。组织利用框架识别需要加强的领域或需要实施的新流程。遵循这些框架的组织通过持续改进实践，可能更好地应对日益增长的网络安全项目需求。\n\
  \n*美国国家标准与技术研究院网络安全框架*\n\n备受推崇的改进关键基础设施网络安全的 `NIST Framework` 旨在保护交通、健康、能源、食品、水、通信、银行和金融等关键基础设施（美国国家标准与技术研究院\
  \ 2018，5）。`NIST Framework` 指导关键基础设施的网络安全。任何努力提高网络安全的组织都可以使用它：“虽然此文档是为了改进关键基础设施的网络安全风险管理，但该框架适用于任何行业或社区的组织。该框架使组织无论规模、网络安全风险程度或技术水平如何，都能应用风险管理原则和最佳实践来提高安全韧性”（美国国家标准与技术研究院\
  \ 2018，5）。\n\n网络安全防御的基础是通过五个功能和相关类别保护组织的资产（见 图 4.3）。你可能会被要求参与并领导这些任何一个领域的项目；网络安全项目的来源是巨大的。\n\
  \n![images](img/fig4.3.jpg)\n*图 4.3 NIST 网络安全框架：功能与类别*\n\n类别揭示了网络安全目标的范围，并由 108\
  \ 个子类别支持（参见 `附录 1` 框架核心示例）。在这个功能、类别和子类别的框架内，我们能更好地理解现状以及我们组织的改进目标在哪里。`NIST Framework`\
  \ 包含了实施层，旨在为实现网络安全成熟和目标达成提供路径（`图 4.4`，来自美国国家标准与技术研究院 2018，15–17）。\n\n![images](img/fig4.4.jpg)\n\
  *图 4.4 NIST 网络安全能力成熟度*\n\n组织使用 `NIST Framework` 记录其当前的网络安全状况（`图 4.5`，来自 PMI 2021，6），然后启动项目将其带入目标状况（例如，解决第\
  \ 3 层差距，或从第 3 层进展到第 4 层，或符合外部机构基于 `NIST` 的指南）。因此，我们可以预计项目将提高组织在这些类别中的能力，并使实施项目的组织通过\
  \ `NIST` 成熟层实现成熟。*Shields Up* 将帮助你计划、管理和交付项目，以通过 `NIST` 成熟层。\n\n![images](img/fig4.5.jpg)\n\
  *图 4.5 通过项目改进网络安全*\n\n`NIST Framework` 与项目管理对齐，遵循正式的项目管理方法有助于你符合框架。`NIST Framework`\
  \ 包含一个以项目为导向的部分——建立或改进网络安全计划——通过项目交付方法将组织带入目标状况（美国国家标准与技术研究院 2018，21–22）。本书帮助你计划和实施与\
  \ `NIST Framework` 相关的网络安全项目。\n\n## ISO 27001：信息安全管理\n\n`ISO 27000` (`ISO 2013b`)\
  \ 是一套信息安全标准，用于规划、实施、维护和改进组织的信息安全管理体系（见 `图 4.6` `ISO 27000` 标准概述）。通常，组织从非正式且无组织的网络安全方法开始，然后采用如\
  \ `ISO 27000` 等标准来系统地管理信息安全威胁（ISO 2013a，1–32）。\n\n`ISO 27001` 要求被组织成 114 项控制措施，每个措施解决特定的网络安全风险（例如，公共网络上应用服务的安全）。这些控制措施被分为\
  \ 14 个附录/组（从附录 5 开始），见 `图 4.6`。这些控制措施指导组织改进其网络安全。组织作为持续改进努力的一部分确定当前和目标状况。\n\n![images](img/fig4.6.jpg)\n\
  *图 4.6 ISO 信息安全标准*\n\n特别值得关注的是控制措施 `A.14 系统获取、开发和维护`，因为它包含了项目管理活动，例如：\n\n`A.14.2\
  \ 开发和支持过程中的安全`：设计中的安全；\n`A.14.2.7 外包开发`：管理外包项目以确保正确的网络安全质量；\n`A.14.2.8 系统安全测试`：测试安全功能；\n\
  `A.14.2.9 系统验收`：测试系统按设计构建，包括信息安全测试和对最佳实践的遵循。\n\n本书与该标准中与项目管理相关的控制措施一致。因此，遵循这种项目管理方法将帮助你符合\
  \ `ISO 27001` 信息安全管理。\n\n\n\n事实上，项目管理是许多网络安全项目的隐含交付载体：“无论项目类型如何，都应在项目管理中考虑信息安全”（ISO\
  \ 2018a, 10）。ISO 网络安全标准中的信息安全与项目管理语言紧密相连，例如“确保信息安全在信息系统的开发生命周期内被`设计和实现`”（ISO 2018a,\
  \ 18）。信息系统经历一个系统生命周期：启动、规范、设计、开发、测试、实施、使用、维护，并最终退出服务和报废（ISO 2018a, vii）。从“启动”到“实施”反映了项目生命周期，而从“使用”到“报废”则反映了运营。我们在\
  \ ISO 标准中既看到了项目生命周期，也看到了运营生命周期。由于项目管理固有存在于 ISO 27000 信息安全管理标准体系中，因此当一个人精通项目管理时，在实施网络安全项目将更具成功。\n\
  \nISO 27000 系列网络安全标准是全面的，但缺乏成熟度模型；相反，ISO 网络安全标准可以被视为成熟度模型的最高层——第五级（Leal 2015, 2）。只需对\
  \ ISO 27000 信息安全标准进行粗回顾，就能发现传统的瀑布式项目管理已深根其中。使用传统的项目管理交付方法和工具交付网络安全项目，将使你的项目符合 ISO\
  \ 27000 系列网络安全标准，并提高项目成功的概率。\n\n# IT 基础设施库（有限制，AXELOS）\n\nIT 部门为组织提供 IT 服务，如电子邮件、人力资源应用程序、效率应用程序以及\
  \ IT 生态系统的安全性。IT 领导层建立政策和程序来指导技术生态系统的生命周期管理。IT 领导层通常依赖外部标准和框架来指导其行动。其承诺是，如果组织遵循某个框架，业务活动可以变得更加预测和稳定，同时保持所需的质量水平。组织遵循的重要\
  \ IT 框架之一是 `ITIL`。虽然存在其他 IT 框架（例如 `COBIT` 和 `ISO IEC 20000`），但 `ITIL` 可能是最流行且应用广泛的。\n\
  \n## ITIL 概述\n\n什么是 `ITIL`？它是一个最佳实践的框架，用于交付和管理如威胁检测、电子邮件和项目管理等 IT 服务。`ITIL` 提供了一种全面、整体且系统的方法，用于交付价值、管理风险和质量、实施精益实践，以及构建一个支持增长和韧性的预测且稳定的技术生态系统。`ITIL`\
  \ 可以引导团队实现自动化、改进 IT 服务并将技术整合到业务实践中。`ITIL` 交付和管理技术的方式是全球最流行的方法之一（Berger, Shashidhar,\
  \ and Varol 2020, 1），因此被视为全球事实上的标准（Tsunoda and Kino 2018, 1）。`ITIL` 的技术管理方式是 `Shields\
  \ Up` 的理论基础，我们在此基础上构建了一种针对网络安全项目的混合项目管理方法。\n\n`ITIL` 的知名度吸引了研究兴趣（Berger et al. 2020,\
  \ 1–6; Göbel and Cronholm 2015, 1–22; Marrone and Kolbe 2011, 363–380; Ramakrishnan\
  \ 2014, 159–168），并识别出 `ITIL` 的以下优势：\n\n* 通过遵循经过验证的最佳实践和流程改进 IT 服务（Göbel and Cronholm\
  \ 2015, 6）。\n* 随着 `ITIL` 采用的成熟，提高收益的实现（Marrone and Kolbe 2011, 377）。\n* 通过交付满足业务需求的服务提高客户满意度（Marrone,\
  \ Kiessling, and Kolbe 2010, 381）。\n* 提高生产力，例如首次通话解决率的提升（Marrone et al. 2010, 378;\
  \ Berger et al. 2020, 1）。\n* 通过通用术语改进沟通（Göbel and Cronholm 2015, 6）。\n* 提高投资回报率（Marrone\
  \ et al. 2010, 378）。\n* 降低 IT 成本（Göbel and Cronholm 2015, 6）。\n\n`ITIL` 被广泛采用并增长部分归功于其潜在收益；事实上，我们看到了如“ITIL\
  \ 基础是今年获得人数最多的认证”（Global Knowledge 2021）之类的陈述。2019 年发布的 `ITIL` v4 与之前的版本有重大不同。它重塑了与客户、流程的关系，并接受了新的工作方式。\n\
  \n## ITIL 服务价值链\n\n组织通过考虑服务价值链开始他们的 `ITIL` 旅程。价值流是创建和交付产品服务的流程（AXELOS 2019, 66）。简单来说，当一个机会或需求触发新的服务（例如一个项目）时，服务价值链流程就开始了。\n\
  \n![images](img/fig4.7.jpg)\n*图 4.7 ITIL 服务链*\n\n六个服务价值链活动包括（AXELOS 2019, 66）：\n\
  \n1. **计划 (Plan)**：对项目范围和服务的四个个维度达成共同共识。\n2. **改进 (Improve)**：持续改进整个价值链中的产品、服务和流程。\n\
  3. **参与 (Engage)**：与利益相关者建立良好关系，以更好地理解他们的需求。\n4. **设计与转换 (Design and transition)**：实施满足利益相关者对质量、成本和上市时间预期的产品和服务。\n\
  5. **获取/构建 (Obtain/build)**：在需要的时间和地点提供服务或产品。\n6. **交付与支持 (Deliver and support)**：根据约定的要求和性能规范支持产品和服务。\n\
  \n虽然这些服务价值链活动看起来是顺序的，但规划、持续改进和参与利益相关者的活动贯穿整个服务价值链。\n\n这些服务价值链活动发生在服务管理的四个维度背景之下，这些维度为服务的管理的不同视角提供了洞察。服务的管理维度需要在从微观（项目）级到宏观（组织）级的服务进行规划和管理（AXELOS\
  \ 2019, 36）：\n\n* **组织与人员 (Organizations and people)**：服务价值链活动发生在组织环境中，并通过人的努力实现。在规划和执行活动（例如，网络安全项目）时，必须考虑组织的治理和通信系统。\n\
  * **信息与技术 (Information and technology)**：在规划和交付服务价值链活动时，会考虑所需的信息、知识和技术。考虑信息、知识和技术维度的可行性和影响，以管理和交付服务。信息和技术维度是大多数网络安全项目的核心。\n\
  * **合作伙伴与供应商 (Partners and suppliers)**：在规划和执行服务价值链活动时，会考虑与其他组织的关系。外包、合作伙伴关系以及与外部领域专家（SMEs）的其他关系在网络安全项目中很常见，并在网络安全项目中予以考虑。\n\
  \n\n\n\n# 4. 价值流与流程\n\n组织的价值流和流程是我们为交付用户所认可的服务和服务产品而遵循的活动和流程。在这个维度上，我们被引导要变得精益并对变化做出快速响应。\n\
  \n从整体角度管理这些 ITIL 4 维度中的工作将提高项目成功率，因为我们并非孤立工作；这些维度会影响我们的网络安全项目。在规划网络安全项目时，我们可能会考虑这四个维度——风险、问题、假设和约束。\n\
  \n与其他标准和框架一样，`ITIL 4` 包含了在完成服务价值链中的工作时指导我们决策和行动的原则。当组织采用这些原则时，他们增加了采用统一方法交付服务产品的概率。这些原则适用于大多数服务价值链活动（Limited,\
  \ AXELOS 2019, 47–48）：\n\n1. **关注价值**：确保所有活动都能直接或间接地为组织、用户和/或其他利益相关者创造价值。\n2. **从现状开始**：对价值链活动应用精益思维，在丢弃现有内容并引入新项目之前，优化现有的产品和服务。我们寻求利用可用资源，通过系统性的衡量、观察和改进流程来减少浪费（精益六格玛方法与这一原则完美契合）。\n\
  3. **通过反馈迭代改进**：尽可能增量交付服务，而不是一次性交付，以降低风险并提高成功交付预期价值的概率。因此，寻找机会将网络安全项目拆分为多个较小的项目（例如第\
  \ 1 和第 2 阶段）。建立定期反馈机会以确保价值正在交付。\n4. **协作并提高透明性**：我们通过服务价值链交付服务，通常以团队形式，协作可以提高参与度、支持、承诺、持久成果、理解、信任和合作。共享透明度也有助于产生这些积极成果。\n\
  5. **整体思考和工作**：当作为完整的服务或产品而非单个组件进行概念交付时，价值就会提高。当服务价值系统（SVS，图 4.7）、服务的四个维度以及这些原则得到协调整合时，价值就会增加。对整个价值流的透明化有助于理解、管理和控制。整体思考和工作的原则是良好的网络安全实践。\n\
  6. **保持简单实用**：我们努力用最少的步骤完成服务价值链活动。鼓励精益思维。\n7. **优化和自动化**：我们寻找改进服务价值链的机会，以使我们交付和服务产品的价值最大化。我们越来越多地使用技术、自动化以及如精益六\
  \ Sigma DMAIC 流程等质量改进方法来指导改进。\n\n这些原则具有基础性，因为它们应该在任何情况下指导组织，即使组织目标、人员、项目类型等发生了变化。`ITIL`\
  \ 原则旨在沿着服务价值链在所有活动（例如项目和运营）中塑造组织文化（Limited, AXELOS 2019, 17–18）。\n\n`ITIL 4` 包含了代表在服务价值链中创建价值的用能力的实践（表\
  \ 4.1）。`ITIL 4` 发布了实践指南来为服务管理提供资源；可以将这些实践视为你在服务管理系统中用于交付价值的工具箱。`ITIL` 实践可以映射到技术项目中使用的传统项目管理交付方法中，以说明它们之间的近似关系，包括向生产的过渡（T2P）阶段。\n\
  \n因此，`ITIL 4` 有一个全面且整体的框架来管理网络安全项目等技术服务。`ITIL 4` 支持根据组织、背景和项目对框架进行定制；支持混合项目管理：“ITIL\
  \ SVS 支持许多方法，如敏捷、DevOps 和精益，以及传统的流程和项目管理，具有灵活的面向价值的运营模型”（Limited, AXELOS 2019, 44）。`ITIL\
  \ 4` 提供了一个与混合项目管理全面的服务管理框架。\n\n## 信息系统开发生命周期\n\n如果你觉得 `ITIL` 熟悉，可能是因为 `ITIL` 与良好的系统管理实践保持一致。你可能熟悉大学和学院信息系统课程中学习过的信息系统开发生命周期（`SDLC`）。该生命周期是基于流程且迭代的，旨在交付高质量系统以支持业务和客户的预期，就像\
  \ `ITIL` 一样。因此，`SDLC` 采取了面向流程的方法和迭代的质量改进生命周期（图 4.8）。`SDLC` 包含了项目活动（从规划到实施）和运营活动（运营、维护和优化）。\n\
  \n这种传统的系统开发方法也被称为瀑布模型。它已被修改，以提供开发系统的替代方法，例如螺旋模型、V 模型、快速应用开发、理性统一过程和敏捷交付方法（Sekgweleo\
  \ 2015, 52）。\n\n## 表 4.1 映射到项目阶段的 ITIL 实践\n\n| 实践 | 启动 | 计划 | 设计 | 构建 | 测试 | T2P\
