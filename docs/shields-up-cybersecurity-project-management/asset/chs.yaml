  ## 网络安全项目管理\n\n`第 2 部分(#Part02.xhtml#pt2)` 的目的是为计划和实施网络安全项目提供实务指导。这种混合项目管理方法源于理论和标准，已被证明是实施网络安全等技术的最佳实践。其意图在于你对\
  \ `Shields Up`（加强防御）方法的适应也将是精益的，并针对你项目和组织的独特需求进行定制。这种混合项目管理方法与领先的项目管理、ISO 9001 质量管理、ISO\
  \ 31000 风险管理、ITIL 以及 NIST 框架对齐，并将帮助你成功实施网络安全和其他技术项目。事实上，交付我们组织所重视的新技术服务取决于整个价值链活动中的有效项目管理（Limited,\
  \ AXELOS 2019, 95）。Berger 等人 (2020, 5) 建议 `ITIL 4` “完全能够”整合服务管理、风险管理、ISO 27001 信息安全管理和\
  \ NIST 网络安全框架。人们可以将关键框架整合以交付网络安全项目（图 5.8）。\n\n## 混合项目管理\n\n混合项目管理结合了预测型和适应型流程（PMI\
  \ 2021, 100）。使用混合项目管理方法来适应组织环境和项目；人们意识到“没有一成不变”。\n\nPMBOK® 指南第 7 版强调“裁剪”，以选择合适的流程、工具、技术和输入来交付项目。从宏观到微观的视角，通过质量改进循环进行工作（图\
  \ 6.1`，后 PMI 2021, 137）。\n\n![images](img/fig6.1.jpg)\n\n**图 6.1 裁剪你的项目**\n\n因此，混合项目管理允许项目经理使用裁剪方法，根据组织需求和项目情况对项目交付方法（流程、工具、技术和输入，包括人员）进行微调。\n\
  \n\n\n\n定制流程的第一步是选择一种项目管理方法；大多数网络安全项目都可以使用混合项目交付模式来实现（图 6.2）。事实上，`ITIL` 框架非常灵活，允许组织精调`服务价值链`以满足项目的独特需求（Limited,\
  \ AXELOS 2019, 18）。大多数项目经理使用传统的项目管理方法，并通过领导低模糊性的常规或低复杂度项目开始他们的职业生涯。人们通常按预期的阶段推进项目各个阶段，特别是当由`阶段关口`（`Stage\
  \ gates`）管理进度时。`阶段关口`（也称为控制关口）是决策点，领导层可以在此处批准或终止项目。如果项目经理是项目管理新手，且领导层希望提供指导轨道以帮助新项目经理成功交付项目，那么`阶段关口`将非常有益。如果阶段关口是可衡量的、客观且提前发布的，`阶段关口`的效果会更好。例如，如果批准了以下文档，我们就可以离开设计阶段进入构建阶段：(i)\
  \ 应用程序详细设计，(ii) 基础设施的底层设计，以及 (iii) 集成规范。人们还可以在这些项目转折点完成项目评审，审查项目状态、项目可行性以及业务案例的持续相关性。\n\
  \n![images](img/fig6.2.jpg)\n\n**图 6.2 混合项目交付方法**\n\n`阶段关口`的一个关键优势是，表现不佳的项目可以通过重新计划和批准来终止或救援。`阶段关口`广泛用于提高严谨性、治理和质量并降低风险。`阶段关口`易于理解、使用和实施。在你的网络安全项目中加入阶段关口`，以记录你需要交付的内容，包括在监控结束后终止项目。\n\
  \n如果你的组织缺乏正式的`阶段关口`，你可以与经理和赞助人共同建立`阶段关口`和成功标准。与`ITIL 服务价值链`一致的是，项目经理开发的里程碑文档，例如完成规划阶段的批准项目计划，或完成测试阶段的测试报告（表\
  \ 6.1）。根据精益项目管理原则，我们尽可能减少项目产生的文档数量；随着经验的积累，我们文档的质量将会提高并变得更加精简。\n\n混合项目交付方法在每个项目阶段都包含了风险管理过程（识别、分析、处理和控制）（图\
  \ 6.2）。例如，我们可能会通过一次迭代来精调项目范围，以启动正确的项目。随后，我们可能会面临设计挑战，特别是当我们实施的技术是前沿技术时。我们可能会完成多个设计迭代周期以确定技术设计。同样，当我们测试应用程序时，可能会遇到需要多次尝试才能找到可行且可解决方案的缺陷。根据团队的目的和能力，这些迭代可能会紧密或松地遵循`Scrum`方法（图\
  \ 5.4）。\n\n**表 6.1 阶段关口标准示例**\n\n| 阶段关口标准 |\n| :--- | :--- |\n| 启动 | 业务认可项目（会议纪要）提供资金（会议纪要）可行性获得认可（向变更控制委员会演示）领导层提供执行批准（会议纪要）\
  \ |\n| 计划 | 完成项目规划研讨会（会议纪要）预算基准进度基准项目计划文档通过批准（链接至纪要、进度和预算） |\n| 设计 | 完成设计研讨会（纪要）项目设计文档通过批准\
  \ |\n| 构建 | 完成构建研讨会（会议纪要）项目构建文档通过批准 |\n| 测试 | 测试策略通过批准测试研讨会（会议纪要）测试报告通过批准 |\n| T2P\
  \ | 测试研讨会（会议纪要）上线批准变更请求已提交 |\n| 结项 | 结项报告批准项目和团队解散已归档 |\n\n因此，*Shields Up* 的项目管理通过`阶段关口`指导行动。`阶段关口`有助于管理进度。`阶段关口`广泛用于提高严谨性、治理和质量并降低风险。`阶段关口`易于理解、使用和实施。在你的网络安全项目中加入阶段关口`，以记录你需要交付的内容，包括在监控结束后终止项目。\n\
  \n如果你的组织缺乏正式的`阶段关口`，你可以与经理和赞助人共同建立`阶段关口`和成功标准。与`ITIL 服务价值链`一致的是，项目经理开发的里程碑文档，例如完成规划阶段的批准项目计划，或完成测试阶段的测试报告（表\
  \ 6.1）。根据精益项目管理原则，我们尽可能减少项目产生的文档数量；随着经验的积累，我们文档的质量将会提高并变得更加精简。\n\n混合项目交付方法在每个项目阶段都包含了风险管理过程（识别、分析、处理和控制）（图\
  \ 6.2）。风险管理对于交付成功项目至关重要（见风险管理章节），它是大多数项目管理工作和决策的基础。最后，混合项目交付方法在需要时可以适应迭代（图 6.2）。例如，我们可能会通过一次迭代来精调项目范围，以启动正确的项目。随后，我们可能会面临设计挑战，特别是当我们实施的技术是前沿技术时。我们可能会完成多个设计迭代周期以确定技术设计。同样，当我们测试应用程序时，可能会遇到需要多次尝试才能找到可行且可解决方案的缺陷。根据团队的目的和能力，这些迭代可能会紧密或松地遵循`Scrum`方法（图\
  \ 5.4）。\n[/content]\n\n*(注：由于提供的原文中存在部分段落重复，译文已根据要求进行了去重处理，确保内容完整且不重复。)*\n\n---\n\
