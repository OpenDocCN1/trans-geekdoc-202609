  \ 年 4 月 2 日） |\n\n# [附录 4]\n\n## 职业规划\n\n质量改进是我们框架的核心，也是持续成功的不可或缺的一部分。通过整体方法更有可能实现质量改进：在整个服务管理系统中寻找改进机会，以优化面向用户的价值流（Limited,\
  \ AXELOS 2019, 83–86）。当人们采取整体方法时，参与产生价值的人也可以从评估和开发能力中受益。网络安全专业人员可以通过职业规划采取结构化的方法来提高自己的能力。\n\
  \n\n\n\n在网络安全领域达到“精通”水平通常需要三到五年的时间（Oltsik 2020, 6）。网络安全专业人士可能会开发并维护与其职责直接相关的领域的技术能力。在建立技术熟练度的同时，网络安全专业人士可以开始进行全局规划，并在领导力、沟通和业务实践方面开发业务相关的能力（Oltsik\
  \ 2020, 17）。网络安全专业人士可以预测未来的业务需求，并针对其行业感兴趣的新兴技术开发能力。例如，预计将广泛采用流程自动化和高级分析；因此，在这些领域的发展将有利于网络安全专业人士。精益（Lean）和六西玛（Six\
  \ Sigma）技术可以改进流程并减少统计变异（Stanton, Gough, Ballardie, Bartam, Bamber, and Sohal 2014,\
  \ 16），并支持流程自动化项目。进行职业规划有多种方法；但是，让我们先看看可以指导职业规划的可持续职业。\n\n### 可持续的项目导向型职业\n\n我们研究了项目导向型的可持续职业，并确定了提高职业可持续性的关键行动（Skulmoski\
  \ et al. 2020, 11–12）。可持续的职业是指工作以可持续的速度进行，并且生活保持平衡。人们从一个项目移动到另一个项目，而没有无计划的干扰。职业可持续性是一个广泛的问题，范围从面对离开拳台的拳击手，到为了抚养孩子而休职的母亲，再到需要赢得诉讼以留工作的律师。技术领域的中小型企业（SMEs）面临着跟上新兴技术并掌握其软件系统中不断扩展的数字功能组合的挑战。在零工经济和第四次工业革命中，我们日益以项目为导向，从一个项目转向另一个项目，有时从一个组织转向另一个组织。\n\
  \n我们发现职业可持续性取决于两个因素：人脉网络和技能提升（Skulmoski et al. 2020, 76）。与其他专业人士建立人脉有助于人们发现新机会。保持联系可以增加能力并开启机会；从而提高职业可持续性。技能提升或扩展能力是另一个职业可持续性的驱动力。随着学习满足新兴需求的技能（如人工智能与机器人的协作），我们提升了职业可持续性。因此，具有远见的网络安全专业人士将投入时间来规划和培养自己的职业。\n\
  \n技术和网络安全技能缺口问题已得到很好的研究，因为它是一个长期的且可能是棘手的问题。网络安全专业人士很幸运，有许多路径可以保持胜任，例如在技术平台中追求技术认证（例如\
  \ `Azure`）或在网络安全框架中追求认证（例如 `CISSP`）。遗憾的是，网络安全技能缺口问题的部分与职业规划不当有关：“正如本报告及以往所示，组织和网络安全专业人士没有从战略角度来看待这一职业。持续缺乏培训、职业发展和长期规划。结果是网络安全专业人士往往在缺乏指导的情况下浑混过职业生涯，在工作之间跳槽，并临时增强技能集，而不是以任何系统性的方式”（Oltsik\
  \ 2020, 5）。也就是说，许多 IT 专业人士没有采取战略性方法进行职业规划。有些人在 `ITIL` 框架内使用 `T-Career` 模型，将能力演进的可视化（DuMoulin\
  \ 2019, 7）。\n\n### 规划 T-型职业\n\n如果我们观察 IT 同行的职业晋升，就可以预见随时间的职业发展。人们将技能发展成技能集，并可以将其说明为我们\
  \ IT 同行的职业晋升……（此处重复多句，略）……等等，参考图 A4.1）（参见 Demirkan and Spohrer 2015, 13）。`T` 字的水平部分代表业务技能，垂直部分代表技术技能。`I-型`仅代表技术技能，而\
  \ `T-型`代表两者的平衡。一些网络安全专业人士会增加如 `Cisco 认证网络安全`或`认证道德黑客`等认证。\n\n首席信息安全官（CISO）需要技术技能基础，并更强调业务技能，以管理整个\
  \ `ITIL 服务价值系统`，该系统包括项目和运营，旨在为组织交付价值。CISO 工作要求的这三个例子都涉及项目管理：交付创新、数字化转型和持续价值的基础。\n\
  \n### 职业规划流程\n\n如果操作得当，职业规划是一项经常活动，例如在年度绩效考核期间，这样组织就可以支持你的发展目标（Oltsik 2020, 6）。你的职业规划可以输入到绩效评估中。有些人将年度绩效考核视为行政负担；然而，职业规划可以通过战略性方法推动职业发展。就像项目成功一样，伟大的职业不会偶然发生；伟大的职业是经过规划、管理和控制的。职业规划可以通过三个步骤完成：\n\
  \n1. **自我评估**：招聘经理在招聘选拔过程中使用各种“清单”来评估能力和天赋。许多此类清单在职业规划期间可用，以获得额外的洞察（例如，在网上搜索职业和职业规划清单，以获得更正式的自我评估方法）。这些通常可以帮助识别优势和需要发展的领域。你处于能力发展阶段的什么位置？你的职业发展形状是\
  \ `I` 型，还是正在形成一个用于平衡发展的 `T-型`职业？\n\n\n\n\n## 2. 探索\n思考你未来 5 到 10 年想担任的职位。在网上搜索这些目标职位的职位描述，以了解理想的能力组合。例如，如果你你的目标是成为一名网络安全经理，可以在网上搜索该职位，以更好地了解这些目标职位人员具备的经验类型和能力。\n\
  \n## 3. 职业行动计划\n对你的能力与目标工作（例如 `cybersecurity manager`）的能力进行差距分析。然后，制定一个计划来获取相关的经验、知识和技能。\n\
  \n你注意到这与网络安全成熟度最佳实践之间的相似性了吗？完成自评估，识别差距，并制定行动计划以实现你的目标。我们在组织中遵循这一流程，并可以将其应用于我们的职业规划中。\n\
  \n### 技术能力开发\n我们提供了大量的职业发展机会，但我们应该具有战略性：考虑现在和未来所需的技能。继续你的技术开发，并增加新兴技术的技能，例如协作 AI、多模态接口（例如：视觉、听觉和触觉）以及安全的分布式账本（例如\
  \ `blockchain`）。考虑为未来的技术机会做准备。识别未来的技术技能短缺，并开始学习如 `machine learning` 类的解决方案。制定一个获取这些技能和知识的计划；认证是通往技术能力的自然途径。然而，许多认证的价值期很短；随着新兴技术超越底层技术，某些认证可能会过时。例如，随着云服务的普及和\
  \ `Azure` 认证出现，微软计划退休 `MCSA`、`MCSD` 和 `MCSE` 认证（Foley 2021, 1）。关键在于，通过技术认证维持能力是一场无休止的追求。\n\
  \n### 非技术能力开发\n通往高级 IT 职位的道路是技术与非技术的结合。当你在网上搜索“CISO 需要哪些技能？”时，你会发现列表中包含的技术技能非常少！CISO\
  \ 的大部分技能是软技能，如有效的沟通、协作和谈判。事实上，这些正是机器人缺乏的技能！我们发现，战略规划和交付创新经常被列为基本技能；CISO 使用项目管理工具和流程来将战略和其他创新变为现实。因此，你通过项目管理进行的职业发展之旅可以让你更接近\
  \ CISO 和其他高层职位。\n\n许多非技术性的增长机会涵盖了从工商管理硕士（`MBA`）学位的正式学习，到 `Lean Six Sigma` 和项目管理认证等培训和认证机会（Ottmann\
  \ and Skulmoski 2020, 3）。完成认证的时间比大学学位短，并且可以填补能力差距。`MBA` 学位也是多变的，可以选择通用的 `MBA` 学位，也可以选择应用学位（例如：项目管理\
  \ `MBA` 或创新管理 `MBA`）。大学正在通过提供许多学习路径（如兼职学习、可堆叠学位和微证书）来改进其服务价值流，为个人学生量身定制学习。\n\n从整体角度对待你的非技术培训；思考服务价值流以及组织如何批准项目向最终用户交付创新。组织遵循项目管理流程，然后将产品或服务交给运营部门进行管理和优化（图\
  \ 1.1）。因此，一个全面的网络安全专家将在项目和运营方面接受培训和教育。像 `PMP` 或 `PRINCE` 这样以项目为导向的认证结合 `MBA` 学位或\
  \ `Lean Six Sigma` 证书有助于为领导角色做好准备。再次，查看招聘人员列出的管理和领导职位的能力，以了解所需/目标技能集。\n\n将职业规划与年度绩效考核相结合，可以让你不仅在评估中获得高分，还能帮助你因严谨而脱颖而出。很少有\
  \ IT 专业人士在职业规划中考虑一或两年以后，而且大多数人的重点狭隘在技术能力开发上。如果你在培训计划中也包含项目管理和 `Lean Six Sigma` 等业务技能，你将会脱颖而出。组织支持高价值员工（例如网络安全专业人员）并支付顶尖大学的\
  \ `MBA` 研究并不罕见。计划并寻求支持！组织很难寻找和留住网络安全人才。组织通过支持职业规划、提供培训教育支持以及派遣其他职位以获得广泛经验，可以留住优秀人才。\n\
  \n通过额外的培训，网络安全专家获得了新的知识和技能；寻找应用这些新能力的机会。你可能争取组织内部晋升以获得新经验。然而，横调到如 `Service Desk\
  \ Queue Manager`、`IT Contracts Manager` 和 `IT Service Quality Manager` 等职位也可以提供价值的增长经验。这些职位位于技术部门，但在网络安全部门之外；在广泛领域获得经验可以增加你对整个\
  \ IT 部门及其服务的理解。你也可以自愿在他人休假时“替补”；通过替他人工作获得多样化的经验并加速你的学习。\n\n### 微学习\n以下是一些增强你学习的实用练习：\n\
  \n*   寻找关于微学习和持续性专业发展的文章，以更好地理解这种强大的学习模式。\n*   在网上搜索职业规划流程，并进行定制，以遵循一个符合你逻辑的流程。\n\
  *   搜索高级技术职位的招聘广告，以更好地理解新兴的工作要求和相关能力。识别需要开发的目标能力。\n*   寻找平衡，使你能够开发技术能力以及领导力、沟通和项目管理等非技术能力。\n\
  *   识别并开发持久的能力（例如项目管理），这些能力不会像许多技术认证那样，随着新技术的出现而迅速过时。\n\n### 参考文献 [](#Contents.xhtml#rbm1)\n\
