  \n\n\n\n\n什么是精益项目管理？我们使用项目管理方法论的方式是为了减少浪费、取悦客户并寻找改进机会。精益项目管理有时在敏捷项目管理中被提到，因为两者都是某种新颖且兼容的技术。然而，精益项目管理并不是像敏捷或瀑布模型那样的另一种项目管理方法论。精益项目管理结合了多种方法论，通过优化项目资源为赞助者创造价值。\n\
  \n## 精益六格玛\n\n对最佳实践感兴趣的 IT 专业人士会将精益六格玛视为另一种与敏捷项目管理相关的改进方法。精益六格玛结合了精益管理和六西格玛目标（图\
  \ 5.6\n\n**图 5.6 精益六西格玛目标**\n\n#### 练习\n\n列出你组织过去 12 个月的一些项目；其中有多少源于精益六格玛目标（例如：优化步骤、消除痛点和缩短交付时间）？许多组织启动项目是为了解决精益六格玛目标，但缺乏实现所需结果的方法和工具！\n\
  \n为了获得精益六格玛的收益（例如减少痛点和完成流程的时间），用户遵循 DMAIC 流程（de Mast and Lokkerbolbol 2012, 604–614）：这是一个数据驱动的质量改进过程（图\
  \ 5.7).例如，业务所有者（如制造业）想要改进流程（运营），并可能遵循 DMAIC 启动质量改进项目。项目团队建立基准，并测量完成目标改进流程需要多长时间。项目团队可能会访谈服务用户以识别流程痛点。业务赞助人将提出一个新项目来交付精益六格玛质量改进目标。改进解决方案越来越多地涉及技术，通过集成、AI\
  \ 或 IoT 技术实现业务流程步骤的自动化。一旦解决方案交付并在业务运营中使用，团队将重新测量并记录任何流程改进。团队将对流程用户进行再次调查以理解质量改进的价值。IT\
  \ 专业人士将在精益六格玛的`Improve`改进）阶段看到更多的项目请求。网络安全专业人士将被邀请加入团队以确保流程和数据的安全。\n\n![images](img/fig5.7.jpg)\n\
  \n**图 5.7 DMAIC 改进循环**\n\n因此，业务对精益六格玛的研究是 IT 项目被识别并向组织提出的的一种方式。IT 领域专家（SME）可能会被邀请加入精益六格玛项目，以\
  \ (i) 使用项目管理交付方法实施技术，(ii) 为技术解决方案添加网络安全防护。\n\n## 项目管理：结语\n\n项目管理有助于计划和交付成功的项目。多种项目交付方法从预测型（传统瀑布型）到适应型（敏捷型）不等。传统项目管理通常是基于流程的，我们启动项目、计划、设计、构建、交付并结束项目。领先的项目管理标准和框架遵循类似的流程，具有通用的理论（例如：范围、质量和风险管理）。人们可以使用混合项目管理方法（图\
  \ 5.8），根据不同行业的项目差异，结合不同标准和方法的元素（Skulmoski and Brendolan, In Press）。\n\n通过混合项目管理方法，项目经理可以在计划和交付网络安全项目时变得更加精益。项目经理结合并定制合适的与项目管理相关的标准、框架、流程和工具，以交付他们的网络安全项目（图\
  \ 5.8）。\n\n![images](img/fig5.8.jpg)\n\n**图 5.8 网络安全混合项目管理**\n\n### 微学习\n\n以下是一些增强你学习的实操练习：\n\
  \n*   在网上上搜索“六西格玛免费白带培训”。许多培训机构提供免费的在线白带培训和认证，其目的是让学生参加后续的培训（例如：六西格玛黄带）。在兼职学习精益六格玛基础的一周内，可以获得一个面向业务的认证。\n\
