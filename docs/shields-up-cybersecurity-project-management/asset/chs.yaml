- "# Shields Up：网络安全项目管理指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 描述\n\n\
  我们预见在可见的未来会有更多的自动化、集成和在线活动，导致更多的网络安全风险和问题。因此，组织和个人正投入更多资源用于网络安全项目，以实施、维护和优化其数字服务及数据的机密性、完整性和可用性。网络安全项目和专业知识的需求日益增长，压缩了经验网络安全实施者的供应。这意味着，合格的网络安全项目经理将日益需求！结果是，更多的网络安全技术专家（通常是初级人员）在尚未胜任之前就被要求领导他们的第一个网络安全项目；现在该怎么办？\n\
  \n*筑防御：网络安全项目管理*专为我们的技术朋友编写，他们对入侵检测与防护系统（IDPS）比对风险清单更熟悉，但现在被要求领导网络安全项目。《筑防御》提供了一个为网络安全项目定制的端到端项目管理框架。更有经验的网络安全专业人士将欣赏这种方法的创新和精益元素。读者将受引导通过混合项目管理交付方法，并学习能够增加项目成功概率的关键项目管理工具。\n\
  \n*筑防御*中的网络安全项目管理符合国际标准，例如《项目管理知识体系指南》（PMBOK 指南）、美国国家标准与技术研究院 NIST 网络安全框架、ISO 27001\
  \ 信息安全管理以及 ISO 9000 质量管理。《筑防御》的一个关键特性是，读者可以快速应用混合项目管理方法，因为它与网络安全领域专家（SME）已遵循的全球性框架保持一致，从而使项目更具预测性和可重复性。\n\
  \n书中各处设有*微学习*和*练习*章节，引导读者进一步学习网络安全项目管理。微学习是一种新兴的持续职业发展方式，学习者在参加正式培训的同时，通过小块的知识进行持续学习。\n\
  \n## 关键词\n\n网络安全；混合项目管理；NIST 网络安全框架；ITIL 4 服务管理；职业规划；精益西格玛优化；风险管理；CISSP；持续；管理\n\n\
  \n*推荐语*\n\n*序*\n\n*前言*\n\n*致谢*\n\n# 第一部分 网络安全需求的日益增长\n\n# 第二部分 混合项目管理\n\n# 第三部分\
  \ 附录\n\n*参考文献*\n\n*关于作者*\n\n\n## 推荐语\n\n《筑防御》由一组来自技术、网络安全和项目管理领域的多元化专家进行了评审。项目管理评审员包括项目管理专业领域的研究人员和思想领袖，他们不仅拥有数十年的经验，还担任技术项目经理。网络安全评审员并非典型的书籍评论员（如学者）；相反，这些评审员工作于网络安全及相关技术领域，因此对项目管理和网络安全有实用的理解，并能够提供如下的批判性评审：\n\
  \n**“必读”**\n\n“考虑到日益严峻的网络安全威胁形势，《筑防御：网络安全项目管理》内容详尽且极具及时性。它应该是所有 IT 项目经理的必读之，因为确保所有\
  \ IT 项目作为流程的正常组成部分清晰且有针对地应对网络风险至关重要。您在书中写得非常完美：‘在我们的项目中构建网络安全，而不是在项目准备上线时再添加网络安全，是一种良好的做法。’最重要的收获是，IT\
  \ 专业人员寻求指导的众多方法和框架可以很好地对齐并整合到一个连贯的交付模型中，而不会损害质量或效率。我必须赞赏 Greg 为我们所生存的这个新数字世界编写了一份优良且全面的指南。做得好！”——**Jason\
  \ Roos，沙特阿拉伯阿卜杜拉科学技术大学首席信息官**\n\n**“完美对齐”**\n\n\n\n\n\n《Shields Up：网络安全项目管理》一书涵盖了读者在\
  \ IT 部门中可能担任的广泛角色，特别是在管理战略和运营项目方面，包括网络安全。从事项目管理、质量管理、风险管理、网络安全、IT 运营支持、战略规划等工作的人都会非常感谢这本书。令我惊讶的是，它与\
  \ `NIST`、`ITIL`、`PMBOK`® 指南甚至 `ISO 风险管理` 完美契合。我主倡采用基于风险的方法来管理网络安全，这是《Shields Up》的核心主题。这本书分享了核心知识和专业技能，而\
  \ Greg 完美地把握了这些以及许多内容。”——**Irene Corpuz, PMP, ITIL, CISA, CEH, ISO 27001 首席实施员与审计师，项目经理，阿联酋联邦高等教育机构**\n\
  \n**\n\n## 卓越的项目管理实践\n\n“Skulmoski 博士的书是卓越项目管理实践的隐喻。它提供的内容对于快速发展的业务环境至关重要，而且其时效性令人赞叹。《Shields\
  \ Up》将使项目经理能够成功交付技术和网络安全项目。”——**Alan Patching 教授，博士，项目管理，澳大利亚债券大学外部事务副院长**\n\n**\n\
  \n## 清晰简洁地指导网络安全专业人士\n\n“在《Shields Up》中，Skulmoski 清晰且简洁地指导网络安全专业人士如何将项目管理技术和原则融入工作中，以提升他们的项目水平和职业生涯。他显然理解网络安全专业人士的挣扎以及对时间的巨大需求。通过提供关于项目管理的专家建议（包括该领域的最新思想和发展），他为网络安全专业人士提供了他们成功所需的关键工具。”——**Derek\
  \ Molnar, PMP, IT 项目经理，美国科罗拉多州立大学**\n\n**\n\n## 一本坚实的指南\n\n“《Shields Up》是一本坚实的指南，涵盖了网络安全项目中常见的所有阶段和标准、未来需求，并深入探讨了为什么由于人才短缺和项目需求增加，IT\
  \ 交付缺口只会恶化。从端到端的项目视角来看，这本书完美涵盖了网络安全项目管理的标准、衡量实践（`KPIs/SLAS`）和指导原则。总的来说，这本书以令人愉快且极快的节奏详尽地描述了技术项目管理的全景。”——**Thiago\
  \ Santos, 高级技术架构师，Mulesoft，加拿大**\n\n**\n\n## 务实、信息丰富且趣味可读\n\n“首先，我要感谢作者写了这本书。我发现它非常务实、信息丰富，而且读起来很有趣。《Shields\
  \ Up》结构良好，易于阅读。作者对网络安全和项目管理专业领域提供了坚实的介绍，并辅以练习和微学习机会。此外，我发现这些插图非常有帮助，因为它们总结了知识并有助于记忆记忆，特别是对于每个指导框架（例如，`NIST`、`ITIL\
  \ 4` 和 `PMBOK`® 指南）。\n\n这本书在技术内容和项目管理内容之间取得了恰平衡，非常适合网络安全专业人士和大多数技术岗位。《Shields Up》\
  \ 也会吸引那些在项目管理办公室（`PMOs`）工作的人。\n\n这本书的一个重要益处是，它可以指导技术人员转型项目管理职业。这本书可以作为一份快速参考指南，弥补技术和项目管理实践领域的知识差距。总的来说，我向技术专业人士推荐这本书。”——**Israa\
  \ Abulawi, BEng, ISACA, 企业项目经理，医疗保健，阿联酋**\n\n**\n\n## 独特资源\n\n“《Shields Up》是一份真正独特的资源。它通过项目管理的视角探索了网络安全这一重要领域。我相信，对于任何想在数字世界从事职业的人来说，这都是必读之。”——**Craig\
  \ Langston, 博士，项目管理，澳大利亚债券大学**\n\n**\n\n## 前言\n\n那是 2012 年 7 月底，我刚刚抵达阿布扎比，接受了 IBM\
  \ 的职位。我因成功为临床医生实施培训计划而被 IBM 招募，在上班的第一天，我满头大汗、饱受时差，来到克利夫兰医学诊所的临时办公室，并见到了我的大客户——克利夫兰阿布扎比。\n\
  \n尽管我当时已经拥有近 15 年的 IT 项目管理经验，但随后与 Greg 共事的几周、几个月和几年是一场教育。我的一些新同事非常讨厌向 Greg 提交交付物（例如详细需求），因为他的审查非常详尽。事实上，Greg\
  \ 坚持最高水平的质量，并在执行中展现了对项目管理理论和实践的深厚理解。\n\n我后来得知，Greg 关注质量保证（预防错误）而非质量控制（修复缺陷），这是一项团队建设工作，其目标是增强细节关注能力并在首次就确保技术正确，这是一种非常高效的方法。Greg\
  \ 的团队按时交付了所有项目，上线监控阶段异常平静，表明技术被成功采用。Greg 的项目提前结束。当项目结束时，供应商可以干净地离开，因为从未出现过质量问题；我很欣赏\
  \ Greg 也照顾了他的供应商。\n\nSkulmoski 博士还证明自己精通成人学习和培训理论（成人教育）、课程和学科学习成果、教学设计以及许多成功学习所需的其他要素。回到\
  \ 2015 年 3 月，我们按时开放了克利夫兰医学诊所阿布扎比院长，所有的护理人员都能使用世界级的系统提供关怀服务。Greg 在几年后接受了债券大学的教授职位，随后我将与\
  \ Greg 学到的知识带到四个国家的十几个其他背景中，进行实验、重新学习，但在许多时候，我是站在与 Greg 共事期间形成的确定性基础上的。”\n\n\n\n\
  \n\n在*Shields Up: Cybersecurity Project Management*一书中，Greg 以巧妙且科学的方式在当代项目格局的复杂丛林中开辟出一条道路，为所有可能在现代项目管理中遇到挣扎的人士提供了全功能的路线图。但他的涵盖范围远不止于这些领域。他对业务合作伙伴期望、技术变化速度以及网络安全重要性日益增加等当前问题的框架和分析都是稳如磐石并经过了广泛的研究。他还投入了大量精力通过设计练习来吸引读者，帮助他们调整对本书的理解，并将其应用于他们今日所面临的网络安全项目管理困境中。\n\
  \n*Shields Up* 平衡得非常好，包含了对瀑布式、`Agile`（敏捷）和精益项目管理方法意义深度的总结，同时保持了足够明快的节奏，让你欲不释手。我发现自己被吸引着读下去。Greg\
  \ 包含的细节恰到好处，并提供了许多实用的参考，使其成为一份完美的指南，而绝不会变成枯燥的读物。\n\n混合项目管理是当今商业环境中必不可少的能力，Greg 优雅地详述了一种灵活的方法，将预测型和自适应项目管理学科的精髓进行混合匹配，允许读者匹配技术以适应他们自己的网络安全项目语境。\n\
  \n对于经验丰富的项目管理专业人士，*Shields Up* 对至关重要的实践提供了极其清晰且简洁的解释，例如项目启动文档结构、三点估算、风险和问题框架以及质量管理。我发现自己多次回头查看文本，记录了笔记和幻灯片，然后立即在我的最新项目中实施了许多\
  \ Greg 的混合项目管理实践！\n\n正如你将在阅读这部作品时将观察到的那样，*Shields Up* 既轻量又极具实用性。我觉得这种方法的直接和简单令人耳目一新。就像一个准备正宗的“手球（sugo）”或一次标准的俯卧撑，项目管理的许多基础知识虽然许多人表面上理解了，但大多数人执行得很糟糕。正确掌握这些知识虽然困难，但却意味着获得卓越的结果。在书中，Gregory\
  \ Skulmoski 博士向你展示了切实有效的方法，以便在你的网络安全项目中产生卓越的成果。\n\n—Chris Walker, SHRM-SCP\n\n##\
  \ 前言\n\n*数字化业务转型和新兴的网络物理系统创造了前所未有的安全风险*\n\n—Gartner 2020a, 1\n\n*Shields Up: Cybersecurity\
  \ Project Management* 满足了网络安全专业人士开发项目管理能力以领导并在其网络安全项目中取得成功的需求。在第四次工业革命创新和新冠引发的数字化转型项目的推动下，技术的采用和普及正在增加并可能加速。*Shields\
  \ Up* 旨在为网络安全和其他技术专业人员提供一份指南，用于计划、开发、管理和实施网络安全项目。\n\n*Shields Up* 分为两部分：(i) 技术和网络安全需求的增长以及\
  \ (ii) 混合项目管理。第一部分在创新交付方法的语境下构建了项目管理框架；即为了实现战略目标，组织越来越多地启动项目。技术预测显示对技术和网络安全的需求在增加。是什么驱动了技术的需求？未来的预见（检查可能的未来场景）是什么？\n\
  \n## 第一部分：网络安全项目需求的增长\n\n敏捷且对变化的预期和转瞬即逝的机会反应的组织利用技术获取竞争优势。他们可能实施技术来交付新产品和服务，或者通过消除浪费来提高流程效率。通过使流程精益化并减少过程中的材料或时间，组织试图满足客户。满意的客户购买商品和服务并进行重复购买。因此，优化和数字化是常见的业务目标。组织还通过技术协作并连接人员、系统和数据；我们看到超互联正在增加，扩展的数字生态系统正在形成。一旦实施了数字化转型项目，组织就渴望基于分析的决策能力；更多交付预期缩短的项目在第一次就做对！\n\
  \n应对日益增长的需求，组织还看到对网络安全服务的需求激增，范围从保护数据资产到将新技术加入组织的威胁监控系统。业务合作伙伴成为创新的合作者，重视网络安全服务，并支持增加网络安全预算以确保其技术驱动的创新安全。然而，随着网络安全预算的增加，IT\
  \ 领导层被要求满足业务预期。该行业面临的问题之一是严重的网络安全技能缺口；由于缺乏合格的网络安全专业人员（包括项目经理），组织难以满足网络安全服务的需求。许多组织有空缺的网络安全职位，且招聘时间很长。这种动态产生是，网络安全专业人士被要求领导常规的网络安全项目，将更复杂的网络安全项目留给经验丰富的项目经理。\n\
  \n组织不仅面临实施和管理更多技术、保持系统和信息安全以及在网络安全职位空缺的情况下完成工作的挑战，它们还可能看到更多的网络安全监管。政府和监管机构正在引入网络安全法规，某些组织有义务遵守。网络安全成熟度模型提供了通向合规和成熟度目标的路径和指导，例如`网络安全能力成熟度模型`（`C2M2`）。网络安全合规驱动了更多网络安全项目，如内部和外部审计。\n\
  \n组织利用网络安全及相关标准和框架来履行网络安全期望和要求。有两个主要的网络安全标准可以指导组织优化其服务：由美国标准与技术研究所（`NIST`）发布的《改进关键基础设施网络安全框架》和《ISO\
  \ 27001 信息安全管理》（National Institute of Standards and Technology 2018, 1–55）。IT 部门可以遵循《基础技术服务库》（`ITIL`）标准，通过规划、设计、开发、测试、实施、运行和优化阶段来满足对服务或产品的需求，为最终用户交付价值。虽然项目管理被明确嵌入\
  \ `ITIL` 中，但项目管理标准指导通过一系列交付方法交付价值，从预测型的传统的（瀑布式）项目管理交付方法到自适应敏捷技术如 `Scrum` 和 `Kanban`（看板）。《项目管理知识体系指南》（`PMBOK®\
  \ Guide`）和 `PRINCE2` 是两个由专业级认证支持的重要项目管理标准。网络安全、`ITIL` 服务管理和项目管理的核心是质量管理以及 `ISO 9001`\
  \ 质量管理标准，它引导组织沿着持续改进的路径前进。\n\n\n\n\n\n由于人工智能、云、传感器、物联网设备以及技术驱动创新的前景等多种驱动因素，技术的采纳正以加速的速度增长。技术的增加意味着对网络安全服务的的需求增加。监管的加强也导致对网络安全服务的需求增加。在网络安全专业人员和项目经理短缺的环境下，需求的增长意味着网络安全项目的增加。因此，`Shields\
  \ Up: Cybersecurity Project Management` 的目的在于提供一种经过验证的方法，来计划、管理和交付与全球领先标准及最佳实践对齐的网络安全项目。\n\
  \n# 第二部分：混合项目管理\n\n混合式项目管理方法基于传统的项目管理方法（预测型），并在需要时进行迭代。混合式项目管理汲取了《敏捷宣言》、《PMBOK®\
  \ 指南》以及其他标准和框架的原则。项目经理可以根据组织、项目和任务的需求，定制出合适的原则、流程、工具和方法。定制化可以提供一种精益的项目管理交付方法，有助于团队专注于产品和服务的生产。\n\
  \n大多数网络安全项目都可以通过传统的项目管理方法（启动、计划、设计、构建、测试、实施、监控/稳定和结束）以及传统的项目管理流程（例如质量管理和风险管理）来交付。混合式项目管理利用了进度安排、预算和变更管理等传统的项目管理方法。`Shields\
  \ Up` 中包含了创新技术，例如使用 `Perfect-Likely-Outrageous`（`PLO`，见 `Project Schedule`）估计法，并通过\
  \ `Project Management Gizmo` 对您的网络安全项目进行评估，以对项目产生深度理解。每个网络安全项目阶段都经过了调整，并描述了一种精益的项目管理方法，概述了相关的流程、工具和考虑因素。\n\
  \n遗憾的是，项目失败在技术和网络安全项目中过于常见。项目规划和风险管理可以提高项目成功的概率。`Shields Up` 概述了一个精益计划流程，以交付一个可以进入审批流程的项目计划。即使是最好的项目计划，如果风险管理执行不当也会失败。因此，结合质量管理，风险管理是混合式项目管理的核心。风险管理不需要通过图表和统计分析变得复杂；一种直观的定性风险管理方法通常成功管理网络安全项目的基础。\n\
  \n`Shields Up` 附录中包含了补充材料，以进一步深化您的学习。`Project Management Gizmo` 工具有助于评估您的网络安全项目，该工具经国际项目管理协会许可包含（2008\
  \ 年于罗马展示）。任何项目都可以使用 `Gizmo` 进行评估，以对项目建立全面的理解并开始规划阶段。当项目经理、项目赞助商和团队使用 `Gizmo` 时，就会形成对项目的共同理解，成功的概率随之提高。\n\
  \n第二个附录引导读者完成一次与年度绩效评估同步的职业规划迭代。我们在最佳实践的指导下，不断改进系统，同时也改进我们的人力。我们也面临网络安全技能的短缺。因此，鼓励网络安全专业人士进行职业规划。`Shields\
  \ Up` 引导读者通过职业规划步骤来实现职业目标并建立可持续的职业生涯。\n\n最后，贯穿全书的还有补充练习和进一步的指导。`Shields Up` 提供了一种计划、管理和交付网络安全项目的方法。这些工具和实践可以立即应用于您的项目，而练习将引导您应用\
  \ `Shields Up`。书中概述的许多概念可以使用随手可得的材料进行补充，以扩展您对项目管理的理解。`Shields Up` 在每一章中提供了微学习机会，让读者提高其项目管理能力和成功率。\n\
  \n## 学习成果\n\n本书旨在为那些对加深项目管理感兴趣的人提供一条技能提升路径。本书有三个学习成果：\n\n1. 将混合式项目管理应用于对正式项目管理能力有日益增长的网络安全项目需求中。\n\
  2. 实施与 `NIST` 和 `ITIL` 等全球框架对齐的网络安全项目管理。\n3. 获取并使用混合式项目管理原则。\n\n通过阅读本书并利用它计划和实施网络安全项目，学习者将更好地理解网络安全背景下的项目管理，并最终交付成功的网络安全项目。虽然\
  \ `Shields Up` 专注于网络安全项目，但混合式项目管理方法、流程和工具可以适用于大多数技术和创新项目，如自动化、集成和机器人项目。\n\n\n\n\n\
  我在信息技术学院教授了九年项目管理，非常享受学术生活，并看到学生学习和毕业。然而，我渴望实践我所主张的内容；管理我自己的项目。在项目初期，我加入了阿布扎比克利夫兰医学中心担任项目经理，交付了\
  \ 14 个战略性项目，涵盖了从技术类（例如 `IoT/cloud technologies`）到非技术类（例如内部审计）。我在一个项目管理办公室（PMO）工作，他们遵循\
  \ `ITIL`、`ISO 27000`、`ISO 9001` 和 `PMBOK® Guide` 等领先标准（关于这些内容的更多信息请参见部分）。我亲历了多种标准和框架如何共存，以支持项目按时、按预算并达到正确的质量水平交付。我从我的领导（包括技术和临床领域）中学习，并对同事和团队成员的合作精神表示感谢。`Shields\
  \ Up` 中的工具、流程和技术在阿布扎比克利夫兰医学中心的项目交付中得到了实施和完善。我很幸凭借在技术项目中管理风险的方式，荣得了 2017 年中东安全奖、首席信息安全官协会——`安全与风险领域\
  \ 100 位新星`奖。在项目一线奋斗了七年后，我回到了学术界，并加入了澳大利亚邦德大学的项目管理专业。\n\n我喜欢回到教室，将丰富的项目经验与学生们分享。我加入了一个实力强大的项目管理专业，那里有活跃且富有影响力的研究人员。我的同事\
  \ `Dr. Amir Ghanbaripour` 审阅了 `Shields Up`，并对项目中的人为因素评价道：“在网络安全方面，携带盾牌的人比盾牌（技术）本身重要得多。”我的学生也是影响力的源泉：他们毕业、工作，并经常与我联系，分享他们成功应用\
  \ `Shields Up` 中技巧的故事。在此期间，`Dr. Kam Jugdev` 联系我，希望我我为商业专家出版社（`BEP`）撰写一本项目管理书籍。我们曾是卡尔加大学的博士生，并曾合作出版过书籍。我教授一门技术项目管理课程，其中包含了出现在\
  \ `Shields Up` 中的独特内容。我感谢 `Dr. Jugdev` 和 `BEP` 丛书编辑 `Dr. Timothy Kloppenborg`。`BEP`\
  \ 出版社和 Exeter Premedia Services 团队是专业的人士，他们践行精益项目管理，高效地让 `Shields Up` 成为现实。谢谢。\n\
  \n\n\n\n\n我们生活在一个非凡的时代；技术的进步每天登上头条，例如“在未来十年，我们将经历比过去 100 年加更多的进展，因为技术正在重塑健康和材料科学、能源、交通以及广泛的其他行业和领域”（Corbo\
  \ and Ostojic 2021, 2）。这些技术承诺也受到网络末日论头条的撞击，如“网络攻击时代：美国正努力遏制数字动荡的兴起”（Rushe and Borger\
  \ 2021, 1）。为了享受变革性技术的益处，我们需要确保这些技术和数据安全地使用。技术的采用会导致更多的网络安全项目。项目是“为创造独特的产品、服务或结果而进行的临时性努力”（PMI\
  \ 2021）。技术的采用会导致更多的网络安全项目。在项目一线奋斗了七年后，我回到了学术界，并加入了澳大利亚邦德大学的项目管理专业。\n\n## 项目与运营\n\
  \n我们生活在一个非凡的时代；技术的进步每天登上头条，例如“在未来十年，我们将经历比过去 100 年加更多的进展，因为技术正在重塑健康和材料科学、能源、交通以及广泛的其他行业和领域”（Corbo\
  \ and Ostojic 2021, 2）。这些技术承诺也受到网络末日论头条的撞击，如“网络攻击时代：美国正努力遏制数字动荡的兴起”（Rushe and Borger\
  \ 2021, 1）。为了享受变革性技术的益处，我们需要确保这些技术和数据安全地使用。技术的采用会导致更多的网络安全项目。项目是“为创造独特的产品、服务或结果而进行的临时性努力”（PMI\
  \ 2021）。技术的采用会导致更多的网络安全项目。在项目一线奋斗了七年后，我回到了学术界，并加入了澳大利亚邦德大学的项目管理专业。\n\n信息技术（`IT`）部门提供电子邮件等运营服务。因此，我们既有项目也有运营；我们通过启动和交付项目来满足利益相关者的需求。在图\
  \ 1.1] 中，我们看到 IT 发现了一个改进检测功能的机会；他们批准了一个新项目。\n\n```\n![images](img/fig1.1.jpg)\n\
  ```\n**图 1.1 项目为运营交付价值**\n\n我们生活在一个非凡的时代；技术的进步每天登上头条，例如“在未来十年，我们将经历比过去 100 年加更多的进展，因为技术正在重塑健康和材料科学、能源、交通以及广泛的其他行业和领域”（Corbo\
  \ and Ostojic 2021, 2）。每天都有更多的网络安全项目。在项目一线奋斗了七年后，我回到了学术界，并加入了澳大利亚邦德大学的项目管理专业。\n\n\
  \n\n\n在 IT 领域工作，我们看到了技术的不断变迁。我不禁想起那句话：“除了自动售卖机，一切都是确定的”很快，自动售卖机将仅支持数字支付。正在进行的变革在*第四次工业革命：世界经济论坛*中有了详细描述，研究人员将第四次工业革命描述为融合了数字、生物和物理实体的数字革命（Schwab\
  \ 2016, 7）。一个显著特征是这些技术出现的速度呈指数级增长，带来了巨大的影响：“影响的规模和变化的速度使得这场正在上演的转型与人类历史上任何其他工业革命都截然不同”（Schwab\
  \ 2016, 109）。数据处理和通信正以不断加快的速度进行，这给数据量、存储容量、处理能力以及所产生的知识带来了压力（Creese, Saunders, Axon,\
  \ and Dixon 2020, 10），并可能触发新项目（例如升级基础设施）。我们看到一些组织正在拥抱持续流的数字化转型项目（Creese et al. 2020,\
  \ 10），这从 IT 预算的整体增长可以看出（Columbus 2020, 1）。\n\n我们看到人们通过移动技术以以前所未有的计算能力、存储容量和功能访问广泛的知识数据库。变革性技术正在涌现，如人工智能（AI）、数据建模、3D\
  \ 打印、纳米制造、量子计算、大规模储能等。流行文献歌扬着数字加速和变革的新时代（表 1.1）。\n\n我们的经理阅读这些来自数字思想领者的文章，期待持续且加速的技术进步。这些带来了可以利用的数字机会和需要保护的漏洞。这些影响力的报告现在驱动着业务战略，新技术改变了我们的客户预期。这些新兴技术的承诺往往被转化为对新项目和安全系统的请求。更多的网络安全项目正向我们袭！\n\
