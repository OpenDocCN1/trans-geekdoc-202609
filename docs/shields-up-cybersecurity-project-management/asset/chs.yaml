  \n*(注：由于您提供的文本中存在大量内容重复，译文已根据要求进行了去重处理。)*\n\n\n\n\n### 3. **风险关注**：我们未能交付预期价值或满足需求的关键原因是风险的发生。因此，我们的大部分时间与管理风险以实现计划有关。当我们与他人协作时，我们会以正式或非正式的方式讨论风险，并且所有决策都基于对风险的理解。\n\
  \n### 4. **质量倾向**：质量管理可以支持风险管理。例如，我们将质量保证和控制设计到工作中，以提高整个系统价值链的成功概率。我们利用机会进行反思、学习并优化我们自己、流程和技术，从而减少未来的风险。\n\
  \n### 5. **投入型领导**：领导者以紧迫感采取行动，并寻找前置投入的机会。他们关注客户和价值。投入型领导者重视包容性，并是项目管理的大使。\n\n这些混合型项目管理原则适用于项目经理、赞助人、利益相关者以及价值流中的内部和外部团队成员。\n\
  \n混合型项目管理允许团队结合方法和框架，根据环境、组织和项目定制其交付方法。剪裁和组合允许以一种灵活、主动且以价值为中心的方法向最终用户交付产品和服务。“*盾牌开启***Shields\
  \ Up*”项目管理遵循传统的瀑布交付方法，并结合迭代（敏捷），以利用机会或解决设计和测试阶段遇到的问题（图 6.2）。因此，我们在项目提议以应对机会或需求时的启动阶段开始项目。\n\
  \n# 第 7 章\n\n## 启动阶段\n\n混合型项目管理项目包括启动阶段（图 6.2）。领导层将决定项目的服务或产品（例如，将新应用程序引入技术生态系统）是否需要。某些项目可能包含一份业务计划，以证明项目的合理性并概述其对组织的利益。您的组织可能有一个变更授权委员会来审查和批准拟议的项目。随着项目重要性、复杂性和成本的增加，正式化的严谨性也随之增加。有些组织使用项目启动文档（`PID`），包含以下内容：\n\
  \n1. **项目范围**：项目将交付的工作的简要描述；\n2. **理由**：触发项目的业务案例概述；\n3. **利益相关者**：对 (i) 项目团队、(ii)\
  \ 可能影响项目的人员（例如赞助人、监管机构和领导层）以及 (iii) 受项目影响的人员（例如使用产品或服务的最终用户）的要描述；\n4. **风险和问题**：列出最严重的风险和问题；\n\
  5. **项目报告与控制**：包括你将如何控制项目并报告进度；\n6. **审批签名**：某些 `PID` 包含批准项目启动的赞助人/领导者的签名。\n\n如果您负责启动项目，可以向您的项目管理办公室（`PMO`）或领导层获取项目启动指南和内容。可以通过将\
  \ `PID` 制作成单页信息图来赋予其活力。在单页上记录和图解项目信息将成为一种强大的通信工具，可以在您的项目中使用和重复使用，以引导新利益相关者。重用项目产出物有助于精益化。支持\
  \ `PID` 是一项技术分析，以确保组织批准了正确的项目。一份专业的质量 `PID` 通常是新利益相关者看到的第一个项目文档，也是展示你专业水平的早期机会。\n\
  \n### 技术分析\n\n你可能会被要求从网络安全或技术角度对项目中的拟议技术进行评估。也许，我们的业务伙伴进行了精益六格玛研究，流程改进解决方案是利用 AI\
  \ 驱动的自动化来减少流程中的步骤。在检查项目建议书时，评估该技术从网络安全角度来看是否合理；例如，如果保护新服务的成本超过了投资回报率，那么利用该技术的业务提议可能是不可行的（Creese\
  \ et al. 2020, 44）。你可能需要与系统架构师讨论项目，以确保拟议的项目“符合”系统架构。假设项目建议书是一个网络安全项目。在这种情况下，领导层将对网络安全项目如何在降低风险的同时为组织的韧性和增长目标做出感兴趣（Scholtz\
  \ 2021, 4）。许多资源可以指导你的技术分析；在“*盾牌开启*”中，我们侧重于从项目管理的角度分析技术项目。\n\n#### 练习\n\n* 开发一个设计良好的\
  \ `PID` 模板，供后续项目使用。模板是提高质量和变得更精益的方法（参见“质量管理”）。\n* 收集你组织使用的项目管理模板以供未来使用，以便你的项目快速启动。\n\
  * 检查组织已实施的项目的业务案例，以理解成功业务案例的内容。\n* 系统架构的最佳实践是什么？\n* 如何改进系统架构？\n* 如何对齐系统架构？\n\n###\
  \ 项目分析\n\n选择最佳项目取决于 (i) 定义需求的质量、(ii) 分析的质量以及 (iii) 对替代项目能产出内容的理解质量（Daniel, Hempel,\
  \ and Srinivasan 2001, 39–54）。需求的质量来自项目赞助人（稍后将介绍更多关于项目的需求）。你可以委婉地向项目赞助人挑战替代项目：“帮我理解一下；我是这方面的新手。我们可以尝试这个解决方案吗？”你可能需要分析项目，而\
  \ `Project Feasibility Gizmo`（Skulmoski 2008, 1–6）是一种你可以用来深入理解项目的项目分析工具。\n\n***项目可行性工具\
  \ (Gizmo)***\n\n`Project Feasibility Gizmo` 是一种根据项目的复杂性和交付项目所需的努力来分析拟议项目的结构化方法。该工具是由多位项目管理专家（`N`\
  \ = 23）在三轮德尔菲研究项目中开发的。项目努力属性代表了交付项目的复杂程度（例如：工作类型、沟通、范围整合以及项目环境的不确定性和风险）。项目背景复杂性属性是外部的，包括外部环境的约束、不确定性和风险；项目相对大小；项目关键性以及业务环境。人们可以根据项目的复杂性属性和完成项目预期的工作来对项目进行评估。通过使用\
  \ `Project Feasibility Gizmo`，项目经理可以快速完成全面的项目评估，从而加强你的项目或你被要求评估的项目的技术分析。（请参见 附录\
  \ 2 中的 `Project Feasibility Gizmo` 和使用说明。）\n\n在使用工具完成可行性评估时，人们会对项目属性产生更深入的理解，帮助你定制和管理项目。我们首先检查影响你的项目并帮助你定制项目的六个项目复杂度属性：\n\
  \n1. **约束**：项目经理可能会面临某些约束，这些约束会影响你交付的产品或服务的质量，并对预算和进度目标产生挑战。\n\n\n\n\n\n### 2. 项目相对规模\n\
  项目规模将影响你管理项目的方式：与小型项目相比，大型项目通常面临更多的治理要求和更高的正式程度。\n\n### 3. 项目关键性\n项目是有优先级排序的，项目的关键性程度与管理项目所需的治理量和正式程度正相关。职业生涯早期的项目经理通常会被分配关键性较低的项目。理解赞助人眼中的项目关键性也有助于项目对齐。\n\
  \n## 4. 不确定性与风险（外部）\n所有项目都面临着不确定性和风险；它们会影响项目以及项目经理组织工作的方式。高度不确定且风险很多的项目管理更具挑战性，可能需要更大的团队和更高的正式程度。即使是不确定性较低、风险较小的项目也能从正式的风险管理方法中受益——这是项目成功的秘诀！\n\
  \n### 5. 组织环境\n我们不是在真空环境中管理项目的；文化和治理影响我们管理项目的方式。\n\n### 6. 业务环境\n我们管理的项目受外部业务环境的影响。例如，与全球团队合作可能会增加项目的复杂性。\n\
  \n越早理解项目的复杂性，项目成功的概率就越高。通过使用 `Gizmo` 评估每个属性，你可以系统地评估项目复杂性。`Project Feasibility Gizmo`\
  \ 帮助我们理解项目外部属性的背景复杂性。例如，同一个项目在赫尔辛基的管理方式可能与阿布扎比或穆斯角（Moose Jaw）不同，因为外部项目环境存在差异。在项目早期理解外部环境，使我们能够在最易于管理时识别风险和问题。\n\
  \n接下来，我们评估交付项目所需的投入。我们使用 `Gizmo` 来检查项目投入属性：\n\n# 1. 工作类型\n第一个项目投入属性是我们要正在进行的工作类型：在河流上造桥、进行\
  \ `NIST` 合规性审计，或添加新的安全事件管理软件。某些项目需要更多且不同类型的投入，项目经理在规划项目时需要理解这些投入。例如，我们是只实现基础功能，还是该项目具有创新性（例如，对技术的早期采用）？无论我们的首批项目是什么样的，它们可能都相对较小、复杂性较低，对组织的关键性不强，在偏离批准的项目目标时有更大的空间。\n\
  \n# 2. 沟通\n沟通的性质影响我们的项目以及我们必须管理的风险和问题类型。例如，审计通常涉及从他人那里收集数据，例如我们在 `PMO` 和 `Infrastructure`\
  \ 团队的同事，他们可能不在同一栋楼里；而升级备份工具所需的沟通较少。因此，利益相关者的数量及其位置会影响我们的项目。\n\n### 3. 集成范围\n需要集成的不同项目元素的数量影响我们的项目投入；要成的元素越多（例如预算和进度报告、状态报告、外部利益相关者、人力资源管理和合同管理），成功完成项目所需的投入就越巨大。集成范围可以是使用\
  \ `Gizmo` 发现风险和问题的重大来源。\n\n### 4. 不确定性与风险（内部）\n投入的复杂性、工作类型、需要集成的项目元素数量等都会带来项目经理管理的风险和问题。投入较少、复杂性较低的项目通常是分配给新项目经理的项目类型。\n\
  \n使用 `Project Feasibility Gizmo` 的结果是：项目经理系统地收集了宝贵的项目信息，用于规划并防止风险演变为问题——技术项目的“阿喀琉斯之踵”。如果存在高于平均水平的不确定性（例如，可能的结果范围），鼓励项目经理与项目赞助人及其\
  \ `SME` 团队重复此练习。你可能会发现你和赞助人对项目可行性属性有非常不同的看法，导致项目初期的不对齐；这种不对齐并不罕见，通过 `Gizmo` 解决可以带来对齐。\n\
  \n#### 练习\n评估一个你正在考虑的项目或你曾担任团队成员的项目。使用包含在附录 2 中的 `Project Feasibility Assessment\
  \ Gizmo`。\n\n使用 `Project Feasibility Gizmo` 的一个关键收益是，你可以在项目早期直接解决“变更能力悖论”（Ability\
  \ to Change Paradox），从而提高你项目成功的概率。\n\n## 变更能力悖论\n“变更能力悖论”（`图 7.1`）是所有项目经理面临的问题，如果管理不当，可能会影响项目的成功（Hartman\
  \ 1999a, np）。在项目开始时，人们对项目的了解非常少。然而，随着项目的进行，我们掌握的信息量不断增加（例如，我们知道哪些风险变成了问题，哪些项目人员准时交付，哪些采购延迟是不可避免的）。随着时间的推移，我们做出更改的能力在降低；与后期相比，在项目的第一周增加范围或更改测试方法是非常轻而易举的（例如，在测试结束时更改设计是非常困难的）。因此，在启动和规划阶段，如果我们利用“变更能力悖论”提供的机会，与正确的利益相关者合作，并遵循混合项目管理流程，我们的分析可以改变信息曲线。在项目开始、变更成本最低时，我们缺乏信息；然而，当我们项目后期拥有更好的信息时，那些更改往往是复杂且昂贵的。\n\
  \n如果在项目后期才发现风险，它们可能会变成问题，导致项目无法成功，出现错过里程碑、预算超支和质量妥协。我们可以通过移动信息曲线来缓解这个问题：提前获取信息（`图\
  \ 7.1`），以便在项目更早阶段信息的质量和数量。`Project Feasibility Gizmo` 是一个引导项目经理尽早理解项目的工具，从而移动信息曲线。项目经理学习更多项目信息以制定更好的计划，留出更多的前置时间来管理项目风险并避免后期昂贵的更改；这是前置加载（front-end\
  \ loading）的基础。\n\n![images](img/fig7.1.jpg)\n\n### 图 7.1 变更能力悖论\n\n## 启动阶段：结语\n\
  在启动阶段，项目经理努力获得启动项目的正式批准。项目经理与项目赞助人合作制定 `PID`，赋予项目经理进入规划阶段的权限。可以使用 `Gizmo` 来加深对项目的理解，以移动移动信息曲线，避免项目后期出现昂贵的更改。\n\
  \n### 微学习\n以下是一些加深你对启动阶段理解的在线学习活动；搜索：\n\n- 如何制作信息图？\n\n- 项目管理中使用哪些 `KPIs`？规划和使用项目管理\
  \ `KPIs` 以及项目评估标准可以帮助你交付适当的项目管理质量。\n\n- `ITIL 4` 变更控制实践是如何工作的？\n\n\n\n\n\n检查您的组织：\n\
  \n- 识别您的组织跟踪和报告的项目管理关键绩效指标（KPI）。这些是衡量进展的最佳 KPI 吗？\n- 调查您的组织如何启动项目。\n\n# 第 8 章\n\n\
  ## 计划阶段\n\n计划阶段的目的是制定一份计划，定义并预测项目将如何执行、成本多少、工作何时执行和完成、将遇到哪些风险和问题等。项目经理识别需要完成的工作以及由谁来完成工作。项目经理将制定一份扩展\
  \ `PID` 的计划，并可能包括详细的进度表和预算。目标是批准项目计划以退出计划阶段。\n\n## 精益项目计划流程\n\n精益项目计划侧重于减少浪费和满足利益相关者。我们可以遵循精益项目计划流程（图\
  \ 8.1）来快速计划并移动信息曲线，从而获得更好的项目计划。此阶段旨在制定供领导层批准的精益项目计划。我们通过与项目赞助人会面开始计划：\n\n1. **使命声明：**\
  \ 验证与赞助人共同开发的使命声明（范围声明），并使其可衡量且客观。（例如：在 2023 年 6 月前完成所有 IT 服务的审计；由于是内部项目，没有预算。）\n\
  2. **项目优先级：** 识别项目优先级（优先级三角形，后文讨论）以实现对齐。\n3. **成功标准：** 记录项目成功标准（完成–赢得–谁，后文讨论），这也有助于对齐。\n\
  4. **工作分解结构：** 使用使命声明制定高层工作分解结构（`WBS`），识别主要工作包。\n\n![images](img/fig8.1.jpg)\n\n\
  ***图 8.1 混合项目计划流程***\n\n5. **进度：** 使用 `WBS` 开发高层甘特图（条形图），如果您的项目足够大，则制定一个详细说明关键路径和浮时间的进度表。较小的项目可以使用任务列表和与甘特图对齐的完成日期进行管理。\n\
  6. **预算：** 部分项目不需要预算，因为它们是只需要少量外部资源的内部项目。然而，某些项目需要大量的外部资源（例如技术专家和新设备）来完成，并从遵循项目预算和成本管理流程中受益。\n\
  7. **风险和问题：** 识别关键风险和问题（我总是包含这样信息：“我们的项目可能会失败，但在您的支持下，我们更有可能成功！”，以鼓励赞助人的参与）。\n8.\
  \ **治理：** 同意治理和报告（例如：项目赞助人和其他利益相关者想要哪些信息？会有每月或每周的状态会议吗？）。\n9. **项目角色和职责：** 同意项目赞助人和项目经理选。\n\
  10. **教训总结：** 在项目开始时进行教训总结。询问赞助人之前的项目中哪些方面做得好，哪些方面具有挑战性，以便您在项目开始时就能从教训中受益。您的赞助人会感谢您愿意将他们的想法纳入您的项目中；您已经开始了有效的团队建设。\n\
  \n接下来，在与项目赞助人完成计划后，与领域专家（SME）会面以完成 `WBS` 中识别的工作。我们重复了与项目赞助人一起完成的大部分内容：审查使命声明和项目优先级（我们可以使用\
  \ `PID` 信息图来开始计划会议）。我们检查 `WBS` 查看是否有任何遗漏。因此，我们对项目计划采用了迭代且包容的方法，从项目赞助人和主要项目贡献者开始。\n\
  \n我们采用迭代且包容的方法来制定项目计划。我们从赞助人和关键项目参与者开始计划。我们制定一个高层项目计划，并在项目计划工作讨会（`PPW`）向关键利益相关者展示（参见项目计划工作讨会章节）。在会上收集额外的反馈，团队认可项目计划。然后将计划提交给领导层批准（例如：设定项目计划基准）。\n\
  \n### 微学习\n\n在 *Shields Up* 中，我们使用了许多传统的项目管理工具和流程（例如预算和进度安排），因为它们拥有成功的成功历史。因此，我们引导学生在线搜索，以提高对基本项目管理工具和流程的理解。您可以在网上搜索详细说明和模板，以完成项目计划的以下组件。\n\
  \n- 如何创建项目章程？\n- 如何编写项目使命声明？\n- 如何创建 `WBS`？\n- 如何创建甘特图？\n- 如何创建项目网络图？\n- 如何创建项目预算？\n\
  - 如何创建 RACI 图？\n- 如何管理版本控制？\n- 如何推销任何东西？\n- 如何讲述一个好故事？\n- 如何进行设计和布局？\n\n由于设定项目计划基准涉及获得团队的信任，您可能将项目生命周期中的任何批准过程都视为一次推销活动。因此，我们增加了“如何推销任何东西”和“故事讲述”，因为这些是帮助您获得执行批准的强大技术。设计和布局考虑、图形和其他创意考虑将使您的项目计划看起来非常专业。您可能在整个职业中都会使用推销、故事、布局和设计技能。\n\
  \n虽然 *Shields Up* 更侧重于战略，但我们包含了一些知名度较低但有效的项目管理工具和方法。这些工具帮助我们移动信息曲线，以便尽早了解更多关于您的项目的信息，而不是在变更难以实施且昂贵时才去了解。\n\
  \n## 优先级三角形\n\n项目对齐（对齐/对齐）是项目经理努力的一个早期目标，因为它有助于为项目团队移动信息曲线。不对齐会增加范围蔓延、延误和成本超支等风险和问题。然而，当项目团队对齐时，团队更容易变得精益，项目成功的可能性也更大。我们看到项目可行性小工具（Gizmo）有助于移动信息曲线；该工具也能对齐项目团队。优先级三角形（Skulmoski\
  \ and Hartman 2000, 33–37）是另一种有助于团队对齐和降低风险的项目管理工具。\n\n优先级三角形（图 8.2）改编自 Martin Barnes\
  \ 铁三角，也称为三重约束理论（Kerzner 2013, 869）。项目团队受范围、时间、成本和质量的约束；一个约束的变化将影响其他约束。例如，如果我们的客户要求增加范围，由于交付增加范围的额外工作，我们可能会面临成本增加和进度延误。\n\
  \n![images](img/fig8.2.jpg)\n\n***图 8.2 优先级三角形与对齐***\n\n\n\n\n在实践中，我们可以使用三重约束理论来帮助识别项目优先级。我们首先绘制“优先级三角形”（Priority\
  \ Triangle）（Skulmoski and Hartman 2000, 35）。时间显示在优先级三角形的左侧，因为我们希望尽可能缩短项目的持续时间。成本位于优先级三角形的底部，因为我们试图最小化成本。最后，质量和范围位于右侧，因为我们希望优化范围和质量。我们努力减少交付时间；因此，时间位于优先级三角形的左侧（更早而非更晚）。我们希望价值最大化；因此，质量和范围位于优先级三角形的右侧。然而，如果我们让赞助人确定优先级，赞助人可能会将所有约束都视为优先级。因此，我们在中间添加了一个\
  \ `No-Go`（不通过）区域，以强制项目利益相关者识别出两个核心的项目优先级。\n\n让我们来看看实际应用中的优先级三角形。我们的项目是在制造流程中添加协作机器人。我们的\
  \ IT 自动化项目有三个主要的利益相关者：营销、工程和财务（见图 8.2）。我们解释了这项练习，营销部门在三角形中标记了他们的 X，表示按时交付是项目的优先级，而质量和范围是第二优先级。他们的理由是营销部门希望开始销售该项目将生产的产品。他们还希望高质量，因为高质量的产品更容易销售。工程部门将质量放在首位，因为高质量的组件更容易维护，且故障频率较低。财务部门优先考虑按预算完成，其次是按计划完成。财务部门负责实现资源利用最大化，因此支持按照批准的预算完成。他们还希望按时完成，以便在协作机器人自动化运行后产生收入。\n\
  \n你可以看到，这三个利益相关者的项目优先级上是不一致的（见图 8.2）。我们通过使用优先级三角形从项目赞助人处获取项目优先级方向来达成一致。在这种情况下，让我们假设按时完成并具有正确的质量/范围是赞助人的两个项目优先级。项目经理在预算方面具有灵活性，以交付另外两个优先级。\n\
  \n在实践中，为了按时交付，项目经理可能会允许其团队加班以满足项目里程碑，尽管加班可能会增加成本。然而，为了实现按时交付、正确的范围和正确的质量水平，项目经理有权在（合理范围内）超支。项目团队会知道为了满足进度而加班是可以的。项目经理知道团队正在加班，因为他遵循最佳实践并与团队保持密切（例如，`PMBOK\
  \ Guide` 原则：参与你的利益相关者）。如果存在超支概率，项目经理将提出一个风险；如果发生了超支，则提出一个问题。项目经理定期向项目赞助人汇报状态，特别是当风险正在变成问题时（见风险管理）。\n\
  \n项目经理在项目计划中记录优先级及其产生的影响（例如，可能会超出预算）。然而，项目经理将通过适当的风险管理努力满足预算、质量、范围和进度目标。建立项目优先级后，在整个项目期间进行检查，以确定优先级是否发生了变化。确定项目有助于转移信息曲线并减少风险和问题。\n\
  \n## 成功标准：完成–赢得–谁参与\n\n我们可以向利益相关者提问三个问题，以建立并维护项目一致性（Skulmoski and Hartman 2000,\
  \ 34–35）：\n\n1. **完成（Done）**：项目对你来说什么时候算结束？由于交付工作的性质，大多数项目的完成日期是错开的。例如，我们的采购团队在服务器交付并测试后可能就完成了项目。然而，对于网络安全团队来说，直到应用程序上线且网络安全功能投入运行并稳定后，项目才算结束。项目经理需要理解具有不同完成日期的团队；否则，团队可能会比预期早离开项目。\n\
  2. **赢得（Won）**：必须交付什么才能让你感到满意？定义项目成功并使其具有可衡量且客观性。例如，渗透测试团队希望提前两周通知他们以提供测试服务；很多时候，他们被要求参加最后一刻的测试，这会打乱他们的计划。\n\
  3. **谁参与（Who）**：谁对前两个问题有投票权？我们识别关键利益相关者：那些能影响我们项目的人以及那些受我们项目影响的人。我们在项目早期接触这些利益相关者，以减少后期因未咨询关键项目利益相关者而导致的变更。\n\
  \n再次，这三个问题的工具有助于转移信息曲线，因为我们在项目早期就能很好地理解项目完成日期和成功标准。\n\n#### 练习\n\n- 针对你参与过的现有或过去项目，该项目的优先级是什么？团队之间达成共识了吗？项目优先级在项目执行过程中发生过变化吗？\n\
  - 针对你参与过的现有或过去项目，完成一次 Done–Won–Who 练习。项目计划是否反映了通过询问项目何时完成而得到的成功标准？为了使项目成功，必须交付什么？谁对前两个问题有投票权？\n\
  \n## 项目进度\n\n有些人认为，项目经理创建最重要的文档之一是项目进度表，你可能需要为你的项目创建一个进度表。进度表有两种常见形式：甘特图和网络图（见图\
  \ 8.3）。你可能无法轻松读取细节；相反，该图的目的是显示使命宣言、`WBS`、甘特图和网络图之间的概念关系。甘特图是我们根据 `WBS` 导出的条形图。甘特图是通常展示给领导层的进度类型，因为它清晰地显示了每个阶段、里程碑和整个项目的完成日期。\n\
  \n网络图展示了项目活动的开始和结束、逻辑依赖以及谁负责完成任务。例如，网络图展示了在配置、测试和准备服务器之前的采购逻辑。项目团队使用网络图寻找组织项目的效率方式。网络图是战术性的，可以在调度应用程序中开发。网络图允许深入分析，以识别关键路径（通过网络的最长路径）并理解松散（也称为浮动，是指任务在影响其他任务的情况下延迟的时间）。\n\
  \n项目经理与利益相关者协作开发甘特图和网络图。通常，高层甘特图呈现在项目计划的正文中，以提供进度概览。同时，详细的网络图包含在项目计划的附录中，并带有指向完整进度表的链接。为了开发这些进度表，项目经理向领域专家（SME）提出了最令人头疼的问题：“需要多久？”\n\
  \n![images](img/fig8.3.jpg)\n\n***图 8.3 进度开发***\n\n***三点估算法***\n\n\n\n\n所有进度计划都是根据活动持续时间的估算开发的；某些估算是自上而下的，即赞助人给项目经理设定一个目标完成日期。自上而下的估算可能非常具有进激性且难以实现。另一种估算方法是自下而上的估算；我们使用\
  \ `WBS`（工作分解结构）并估算每个工作包完成所需的持续时间，将这些时间相加，得出所需的工作量。然后，我们将这些估算应用于网络图，以确定关键路径和浮时间。\n\
  \n最常见的估算方法是使用单点估算；例如，25 天、$25,000、8 名顾问和 60 小时。项目经理经常询问领域专家（`SME`s）完成完应用测试需要多久。`SME`\
  \ 需要给出一个数字，例如三周。但是，如果 `SME` 遇到的缺陷比平均水平多，或者某些问题的解决时间比平均时间长怎么办？如果来自供应商的修复缺陷的技术支持延迟了怎么办？如果测试进展非常顺利，缺陷极少，我们比预期更早完成了怎么办？测试\
  \ `SME` 不想给出太低或太高的数字，但没有方法交流估算的不确定性。通常，`SMEs` 会延迟回复项目经理，因为他们不知道给哪个数字。对于复杂、高风险且模糊的项目，从\
  \ `SME` 团队中收集估算可能需要几个月。有一种更好的方法：三点估算（也称为 `PLO` 估算：即完美、可能和荒谬的不确定性条件）。\n\n三点估算源于经典的计划评估评审技术（`PERT`）调度理论。`PERT`\
  \ 提供了一种计算完成项目所需时间的方法。`PERT` 计算捕捉了三种不同条件下的持续时间估算：（i）乐观（完成任务的最快时间），（ii）悲观（完成任务的最长时间），以及（iii）最可能（最大和最小时间之间的时间——发生了一些风险，但你也有一些运气）。我们使用加权平均公式根据统计数据生成计算估算。\n\
  \n在 *Shields Up* 中，我们采用了弗朗西斯·哈特曼（Francis Hartman）教授首的改进 `PERT` 估算技术，即 `PLO` 估算（1999b,\
  \ np）。第一个改进是术语发生了变化；我们不再使用乐观，而是使用 `perfect`（完美），不再使用悲观，而是使用 `outrageous`（荒谬）。名称的改变旨在为了更好地理解正态分布曲线的“尾部”，那里存在极端且复合的风险与机会。通常当风险变成问题时，会发生连锁反应，延迟可能会触发其他风险和问题，导致项目陷入麻烦的雪球效应。当收到一个\
  \ `perfect` 估算时，我们会挑战以看看是否可以改进该估算；例如，我们可能会询问如果获得帮助，时间是否可以改进？或者如果供应商在现场配置服务器而不是由\
  \ `SME` 配置，时间是否可以改进？我们寻找的是一种一切进展顺利、运气极佳、且在项目结束时我们升职的情景！我们在估算过程中引入了创造和创新，以完成我们正在估算的活动。通过研究优化时间的方法，我们发现了进度表中的机会。\n\
  \n我们在 `outrageous` 估算中采取了类似的方法；我们检查风险变成问题并触发其他风险和问题的尾部。例如，我们需要估算完成测试需要多久。我们可能会收到一个\
  \ `outrageous` 估算，并询问估算是否包含了供应商请假的情况。(1) 我们再次挑战缺陷是否可能通过未来的补丁才能解决，从而导致 `outrageous`\
  \ 估算的额外增加。我们设定了许多活动面临问题的 `outrageous` 情景。因此，通过使用 `outrageous` 和 `perfect`，我们可以捕捉包含复合复杂风险与机会的估算。\n\
  \n我们设置表格来反映三种不确定性条件：`perfect`、`likely` 和 `outrageous`（图 8.4）。我们再次挑战缺陷是否可能通过未来的补丁解决。我们设置表格来反映三种不确定性条件：`perfect`、`likely`\
  \ 和 `outrageous`。我们通过这种方式来理解项目阶段的需求。我们将创造力和创新引入到过程中，以完成我们正在估算的活动。通过检查优化时间的方法，我们发现了进度表中的机会。\n\
  \n\n\n\n### 2. 风险敏感估算\n估算考虑了风险和机会；因此，PLO（三点估算）估算比大多数单点估算更现实。即使使用单点估算并增加 10% 的备用金，我们可能仍然低估了。例如，可能的估算总计为\
  \ 105 天，而计算出的估算为 127.2 天（见图 8.4）。如果我们使用可能值并加上备用金（`105 + 10.5 = 115.5`），我们仍然比计算出的估算少了近\
  \ 12 天。当你在网上搜索“IT 项目成功率”并查看准时完成的 IT 项目比例时，你会发现大约一半的 IT 项目都延期了；也就是说，所需的时间比批准的多。也许，如果项目经理遵循三点估算法并在计划中使用计算出的估算，许多此类\
  \ IT 项目将通过使用更现实的 PLO 估算准时完成。\n\n### 3. 识别风险\n通过查看宽范围估算（见图 8.4），可以明显看出风险存在的地方。例如，活动\
  \ A、C 和 D 在可能值和悲观估值之间跨范围很大；如果不妥善管理风险，这三个活动的完成时间可能会比可能估值长得多。我们已经识别了三个风险活动，项目经理和领域专家（SME）可以制定计划来防止和缓解相关风险。我们不仅快速获取了工期估算，还知道关键风险在哪里以及如何处理它们。没有\
  \ PLO，单点估算可能会误导我们风险所在的位置。例如，在图 8.4 中，如果被问及哪项活动风险最大，很多人会猜是活动 D，因为它的时长最长（30 天）。然而，活动\
  \ A 和 C 具有风险，但由于它们的工期估算较低，使用单点估算可能不会将其识别为风险活动。PLO 帮助我们发现并优先考虑风险。\n\n### 4. 识别机会\n\
  当我们使用 PLO 时，如果进度落后并希望赶回时间，我们可以识别出压缩活动的机会。例如，在图 8.4 中，如果我们需要压缩活动来追赶进度，由于完美估值和可能估值之间的跨度很大，我们将选择活动\
  \ A 和 D 进行压缩（例如，它们在关键路径上）。我们不会优先考虑压缩活动 B、C 和 E，因为压缩它们能获得的时间非常少。\n\n### 5. 提高估算质量\n\
  由于估算技术是有方法的，且估算包含了风险和问题，因此我们的 PLO 估算比单点估算更好。通过 PLO 估算，项目经理理解每项估算的风险和机会，制定风险和问题管理计划，并将其记录在风险注册表中。PLO\
  \ 估算技术有助于移动信息曲线，从而获得质量更好的估算并提高进度成功率。\n\n### 6. 提升专业水平\n当你高效地完成估算过程、识别了风险和机会并拥有一风险管理计划时，你在同事和领导面前的地位得到提升。使用\
  \ PLO 方法是职业发展的助器，因为你通过理解风险、问题和机会，并通过风险管理提高项目成功率，从而移动了信息曲线。\n\n现在我们有了工期估算，我们使用这些计算出的估算来制定进度。我们添加前置和后置逻辑，并为每个任务分配人员。进度计划软件随后可以为我们提供详细的基准进度。计算出的工期估算也用于更新甘特图。进度制定完成后，我们来制定预算。\n\
  \n#### 练习\n建立一个电子表格模板，按阶段收集多个参与团队的 PLO 估算，以供未来项目使用。\n\n#### 项目预算\n预算编制与进度的编制过程类似；与其问“需要多久”，不如问“将花费多少费用”，并使用\
  \ PLO 估算技术来得出预算的计算估算值。正如前面提到的，某些项目不需要预算，因为资源是内部的，不需要外部支出（例如，顾问或新硬件）。假设你的项目需要更复杂的方法（例如，你需要确定间接成本和间接费用）。在这种情况下，财务和采购领域专家（SME）可以指导你按照组织的预算程序制定预算。\n\
  \n然而，我们可以遵循 WBS（工作分解结构）来指导我们的估算并制定项目预算（见图 8.6）。我们的 WBS 展示了项目范围；因此，我们可以根据 WBS 开发“自下而上”的预算。WBS\
  \ 的顶部是预算类别（例如，工作流设计），底部包含活动。我们估算活动的成本并将其“汇总”到我们的预算类别中。我们向领导展示基于类别（高层）的预算，而不是基于预算种目的详细预算。我们可以将高层预算包含在项目计划的正文中，如果读者需要更多信息，则在项目计划的附录中包含更详细的预算。（我们可以在进度计划中使用相同的方法，向领导展示基于\
  \ WBS 顶部分的甘特图：从初始配置到实施。我们使用底部的活动作为网络图的基础。）\n\n![images](img/fig8.6.jpg)\n\n***图\
  \ 8.6 使用 WBS 开发预算***\n\n当我们与能够提供成本估算的资深 SME 会面时，可以像获取工期估算一样获取成本估算。首先审阅项目章程、优先级三角形（Priority\
  \ Triangle）和 PLO 估算法。我们获取在完美、可能和悲观不确定情况下的估算。我们将计算出的估算用于详细预算和高层预算。我们通过寻找宽范围估算、识别风险以及更新预算相关风险和问题的风险注册表来完成预算练习。\n\
  \n#### 项目沟通\n项目管理的精益方法是同时考虑项目人力资源和沟通管理，因为我们的沟通关注的是人。人力资源管理是领导、协调和管理项目团队并确定团队角色和职责的过程。项目沟通涉及确保正确的人在正确的时间获得正确的项目信息。有效的沟通不会自动发生；它们需要计划、管理和监控。项目沟通有许多形式，如电子邮件、风险注册表、进度表、预算、状态报告和应用程序设计文档；这些许多沟通形式都源于项目会议。\n\
  \n\n\n\n项目是协作性工作，通常通过会议来支持执行的进展（表 8.1）。会议可以以工作坊的形式进行，用于制定进度、记录设计和测试产品。项目经理根据项目进度安排工作坊。项目经理还会安排定期会议，作为其治理角色的一部分，通过向领导层提交状态报告来支持沟通流程。在这个每月项目会议计划的示例中，重点是每周向项目总监汇报，并每月向执行领导层进行项目评审。该计划允许项目经理和团队在周内通过每日站会计划当天的项目活动。此外还有每周的风险管理会议。这些每日站会和风险管理会议有助于项目经理监控和控制项目活动，并将项目状态汇报给领导层。项目经理需要建立类似的会议和沟通计划来支持项目活动。通常，如果会议是面对面的，一个关键挑战是寻找会议空间。安排会议计划和预订会议室是可以前置处理的项目活动；团队通常喜欢在同一个房间内循环的会议，这可以通过早期安排来实现。\n\
  \n### 表 8.1 月度项目会议计划\n\n| **周一** | **周二** | **周三** | **周四** | **周五** |\n| :--- |\
  \ :--- | :--- | :--- | :--- |\n| 1. 你有两个项目：项目 1 和项目 2，你通过每日站会 2 与团队会。每周你通过与团队负责人会面\
  \ 3，为与总监的状态会议做准备。团队每周审查风险和问题 4。每个月，你和其他项目经理会在执行领导层会议上向 CIO/CISO 提供状态更新 | **1**站会\
  \ 项目 1 总监项目评审 |\n| **4**站会 项目 1 | **5**站会 项目 1 站会 项目 2 风险与问题审查 | **6**站会 项目 1 团队负责人准备状态报告\
  \ | **7**站会 项目 1 项目经理状态评审 | **8**站会 项目 1 总监项目评审 |\n| **11**站会 项目 1 | **12**站会 项目\
  \ 1 站会 项目 2 风险与问题审查 | **13**站会 项目 1 团队负责人准备状态报告 | **14**站会 项目 1 项目经理状态评审 | **15**站会\
  \ 项目 1 总监项目评审 |\n| **18**站会 项目 1 | **19**站会 项目 1 站会 项目 2 风险与问题审查 | **20**站会 项目 1\
  \ 团队负责人准备状态报告 | **21**站会 项目 1 项目经理状态评审总监项目评审 | **22**站会 项目 1 总监项目评审执行领导层评审 |\n|\
  \ **25**站会 项目 1 | **26**站会 项目 1 站会 项目 2 风险与问题审查 | **27**站会 项目 1 团队负责人准备状态报告 | **28**站会\
  \ 项目 1 项目经理状态评审 | **29**站会 项目 1 总监项目评审 |\n\n与你的领导层讨论他们在项目状态报告中所需的信息。如果状态报告与项目优先级保持一致，其质量就可以得到提高；如果重点是准时和成本，那么状态报告将包含进度、预算信息以及相关的风险和问题。\n\
  \n许多项目经理会制定 RACI 图（有时称为责任矩阵），通过明确关键任务和里程碑的角色与职责来帮助管理沟通（表 8.2）。缺乏 RACI 图的项目面临角色混淆和在沟通过程中遗漏人员的风险。项目经理为项目参与者分配四个不同的角色，以改进沟通和协调：\n\
  \n1. **负责（Responsible）：** 负责完成任务的人。虽然可以分配多个人负责完成一项任务，但过多的 `Rs` 可能会导致活动拥堵和延迟（例如，“厨师多锅乱”）。\n\
  2. **问责/负责人（Accountable）：** 负责委派和监督任务完成的人（任务所有者），但可能不直接执行工作。每个任务和里程碑应只有一个负责人。问责人通常批准由负责的\
  \ `SME`（领域专家）所完成的工作。\n3. **被咨询（Consulted）：** 可能提供专家建议的人（双向通信）。项目经理试图平衡需要被咨询的人，因为过多的\
  \ `Cs` 可能会延迟项目。\n4. **知情（Informed）：** 需要了解活动进展但未直接参与工作的人；他们获得的是高层而非详细的项目信息（单向通信）。\n\
  \n项目经理将分析 RACI 图，以确保没有空格，且没有 `SME` 负荷过重（过多的 `Rs`）。项目经理会与团队讨论分配的角色以获得他们的认同。一旦完成了\
  \ RACI 图和高层沟通计划，计划便告完成。\n\n### 表 8.2 RACI 图\n\n| **任务/里程碑** | **项目经理** | **项目赞助商**\
  \ | **SME #1** | **SME #2** | **SME #3** |\n| :--- | :--- | :--- | :--- | :--- |\
  \ :--- |\n| **活动 A** | A | I | R | C | I |\n| **里程碑 1** | A | C | C | R | I |\n\
  | **活动 B** | A | I | R | I | C |\n| **活动 C** | A | I | C | C | R |\n| **里程碑 2**\
  \ | A | C | I | C | R |\n\n### 风险管理\n\n风险管理是技术项目的关键因素，也是 ITIL 通用管理实践（AXEL 2019,\
  \ 95–97）。做好风险管理，项目成功的概率就会增加。`Shields Up` 中的风险管理与 `ISO 31000:2018` 风险管理——指南（ISO 2018b）一致。精益风险管理以风险管理过程为中心，并由风险登记、质量管理以及适用于大多数项目的简单技术支持。风险我是计划、识别、分析、处理和控制风险的过程。风险可能是负面的（例如延迟）或正面的（例如加速活动的机会），可以通过风险管理过程和风险登记进行管理。\n\
  \n风险管理过程（图 8.7）简单有效；你可以在大多数项目中使用这种方法。所有项目计划都应包含一个关于风险和管理的章节。项目经理提供有关如何管理和沟通风险的概述、使用的工具和流程等。例如，项目经理可能会安排每周风险管理会议（表\
  \ 8.1）来审查风险登记并在状态报告中包含风险和问题。风险管理过程是一个一步步为进的方法。一旦识别出风险，就会对其进行定性分析（高、中、低），然后进行处理（预防措施），最后将风险记录在风险登记中。ITIL\
  \ 和项目管理标准（例如 `PMBOK® Guide` 和 `PRINCE2`）具有共同目标，且天然一致。遵循 `Shields Up` 中的风险管理符合国际标准，并极大地提高了项目成功的概率。风险管理过程出现在\
  \ `图 8.7` 中，项目团队在所有项目阶段都使用风险管理。\n\n```\n![images](img/fig8.7.jpg)\n```\n\n***图 8.7\
  \ 风险管理过程***\n\n\n\n项目经理和团队遵循风险管理流程并识别风险。风险识别包括风险原因、事件和影响（表 8.3），并按照语法进行记录。重要的概念是风险事件使用了传达不确定性的词汇，例如，我们使用\
  \ `may`、`could` 和 `might` 来表示风险尚未发生但可能发生。在使用适当语法时，理解得到了提高，风险得以降低。因此，当我们识别一个风险时，我们将风险框架为原因、事件和影响，以便进行有效的分析和处理。\n\
  \n### 表 8.3 风险管理框架和语法\n\n| 元素 | 描述 | 语法 | 处理 |\n| --- | --- | --- | --- |\n| **风险原因**\
  \ | 由于某种原因或理由产生的风险 | `由于`（Due to）延迟 | 风险发生的概率：高、中、低 | 防止此风险发生的措施 |\n| **风险事件** |\
  \ 可能会影响项目（无论是正面还是负面）的事情 | `存在风险`服务器`可能`迟到 | — | — |\n| **风险影响** | 风险事件发生的后果 | `导致`（Resulting\
  \ in）项目阶段延迟 | 如果风险发生，其对项目的影响：高、中或低 | 可以减轻（缓解）风险发生影响的措施 |\n\n一旦我们识别并记录了风险（原因-事件-影响），就可以完成定性风险分析。首先，我们评估发生的概率：定性风险分析评估发生的概率：风险原因可能发生的可能性（图\
  \ 8.7）。定性风险分析评估发生的概率为高、中或低。存在定量技术（例如蒙特卡洛模拟），表明风险发生的概率可能是 88% 的概率（高）或 216% 的概率（低）。然而，定量技术更为繁琐（例如使用统计技术进行风险建模），且成本可能高昂。\n\
  \n此外，许多定量技术需要大量时间进行建模并需要大型数据集。相反，在`Shield Up`，使用定性技术（高、中或低发生概率），因为它们易于生成和理解。项目经理和相关专家分析风险并对发生的概率达成一致。\n\
  \n其次，我们分析风险事件将对项目产生的影响（例如延迟），如果它发生：我们评估对项目产生的影响（正面或负面）：高、中或低影响。项目经理和专家共同分析并对影响的影响，然后将他们的分析添加到风险表中。风险表是项目团队用于管理风险和问题的主要工具（附录\
  \ 3）；尽管它被称为风险表，但它也被用于管理问题（已经实现并成为项目问题的风险）。\n\n一旦我们识别了风险、理解了原因和影响并分析了发生的概率和影响，我们就检查处理风险的方法。首先，探索防止风险发生的方法。在我们由于生产短缺导致服务器延迟交付示例中，我们可以通过确保服务器准时离开工厂来防止延迟交付，例如协商支付溢价或寻找替代供应商。我们可以通过购买库存中的服务器型号并交付以满足我们的项目进度而不延迟我们的构建阶段来避免该风险。其次，如果风险发生，考虑缓解措施以减轻影响（例如，我们未能防止风险，风险变成了一个问题）。例如，我们可以完成其他项目活动以继续进展。我们可能会开始开发测试策略、计划和测试脚本。同时，我们等待服务器到达（例如，我们可能对开发内容和负责人员达成一致）。再次，我们更新缓解措施的风险表；我们分配带有完成日期的预防和缓解措施。如果我们在风险解决日期之前无法防止风险，则该风险将转换为问题。\n\
  \n问题是已经实现的风险；风险事件原因未被防止，风险事件发生了，且项目受到了影响。我们以类似于风险的方式分析问题；然而，问题的原因是风险事件。由于问题已经发生，因此没有需要考虑的概率：只有影响（高、中或低）以及问题对项目的影响。问题语法使用如\
  \ `will` 和 `has` 等术语，传达了风险已发生的 100% 确定性并导致了问题（例如，存在服务器`将`迟到的问题）。我们分配解决问题的行动并提供问题解决截止日期。因此，我们有了一个风险表，它支持我们如何管理风险和问题，以及谁负责预防、缓解和解决风险和问题。\n\
  \n某些项目受益于风险管理工作会：关键项目利益相关者会面大约两个小时，识别、分析和处理项目风险和问题。首先，描述你针对项目的风险管理计划。使用黄色贴纸，并指示参与者在黄色贴纸上绘制风险管理元素的水平和垂直线，给出风险管理的概述（图\
  \ 8.8）。共同识别前几个风险，并向参与者展示如何完成带有信息的黄色贴纸（原因、事件、概率、影响、预防和缓解）。这种通用方法允许参与者提出任何风险（协作软件如在线脑图工具可以促进在线工作会）。当参与者写下风险时，他们积极为项目做贡献，并发生了团队建设。\n\
  \n我们可以采取关注的方法，系统地检查与里程碑、关键路径、预算、阶段、采购流程、上线阶段等相关的风险。例如，检查关键路径上的每个活动，以识别、分析和处理风险和问题。我们重复我们的风险管理流程，检查主要里程碑、进度、预算等。通过关注特定的风险类别，我们是全面的，并显著改变了信息曲线。\n\
  \n一旦风险被识别，我们就可以通过风险矩阵对它们进行排序（[图 8.9](#Chapter08.xhtml#fig8.9））。我们根据严重程度（概率 × 影响）对风险进行排序，并根据影响对问题进行排序（我们不对问题评估发生概率，因为问题已经存在）。例如，高概率/高影响风险应该是团队的重点，因为风险发生的概率很高，且如果它发生，对项目的影响是巨大的。因此，我们可以对风险进行排序，告知领导层严重风险，并实施我们的处理计划以预防和缓解。\n\
  \n\n\n\n我们在图 8.9 中也看到，我们在黄色便利贴上自然三元组进行了分组：`原因–发生概率–预防`为一组，`影响–影响程度–缓解`为一组。黄色便利贴和风险管理工作坊可以成为快速识别和理解风险的有力工具，并通过促进团队建设来转变所有的信息曲线。\n\
  \n![images](img/fig8.9.jpg)\n\n图 8.9 风险矩阵\n\n### 风险管理\n风险管理是我们在项目中需要执行的最活动之一。尽管我们有预算和进度表，但技术项目交付延迟或超支的比例很高。为什么呢？风险变成了问题，导致了延迟和过度支出。这些项目经理本认为他们拥有合适的预算和进度表，但仍然超支并延迟交付；他们失败的关键原因在于风险管理可能没有达到所需的有效。因此，为了显著提高项目成功的概率，我们需要在管理风险和问题方面变得有效且高效，这是我们在追求交付价值的过程中所使用的混合项目管理的核心。\n\
  \n#### 练习\n思考一下你的组织或你曾工作过的组织：\n* 你的部门如何管理和报告风险与问题？\n* 你的组织是否使用蒙特卡洛模拟来帮助分析风险？\n*\
  \ 你们行业的 IT 项目成功率是多少？\n* 回顾 `ISO 27005` 风险管理过程，以深化对信息安全风险管理的理解。\n\n### 微学习\n投资风险管理技能是完全值得的，因为我们在网络安全生态系统中所做的一切都涉及风险。因此，以下微学习机会可以扩展你对这一重要主题——项目风险管理的理解。可以在网上搜索更多信息：\n\
  * 风险管理定义\n* 风险、问题和不确定性的定义\n* 风险管理策略\n* 风险管理计划\n* 风险管理模板\n* 风险管理工具\n* 风险管理矩阵\n* `ISO\
  \ 31000:2018` 风险管理——指南\n* 风险管理与 AI\n* 蒙特卡洛模拟与\n* 风险管理策略\n\n### 质量管理\n质量管理包含了我们用于确保项目交付启动时预期价值并在质量管理计划中记录的价值的工具和过程。我们使用培训、模板和清单来帮助管理质量以及其他过程（如规划），并使用阶段关卡（stage\
  \ gates）等工具来验证产生正确的质量。\n\n`Shields Up` 使用两个质量管理过程：质量保证和质量控制（图 4.2）。我们在开展某活动之前进行质量保证，以确保活动执行正确。我们可以遵循清单、程序、流程或模板，以增加工作按正确质量水平完成的可能性。培训也补充了质量保证；例如，团队成员学习使用\
  \ `risk register` 来一致地记录风险和问题。或者我们遵循配置指令来设置服务器。质量控制在工作执行后进行检查；我们发现并修复缺陷。同样，清单、模板、程序和培训可以指导质量控制活动以发现并修复缺陷。例如，我们遵循\
  \ `testing scripts` 来验证构建是否按照批准的设计运行。因此，我们使用质量保证和控制来在项目中交付正确数量的价值：质量 `A`ssurance（保证）`B`efore（在...）质量\
  \ `C`ontrol（控制）：即 ABC。\n\n我们的混合项目管理方法侧重于第一次就正确完成工作；我们可以通过质量管理和风险管理提高项目成功的概率（Done–Won–Who）。我们倾向于使用质量保证而非质量控制；执行工作并产生极少缺陷，比作为质量控制努力的一部分发现并修复缺陷要好。带有模板和清单的质量保证指导我们的工作第一次就正确完成。风险管理（例如预防活动）有助于确保工作被正确完成。\n\
  \n我们使用治理技术来确保高标准；例如，我们通过传统的项目管理交付方法来组织项目，并在每个阶段结束时设置阶段关卡以验证质量。如果团队完成了高质量的设计，利益相关者将批准设计并进入下一阶段。风险和质量管理是混合项目管理方法固有的，如图\
  \ 6.2 所示。你可以看到风险管理过程发生在每个阶段，阶段关卡充当了质量控制机制。我们遵循结构化的模板（例如 `application detailed design`），以保持内容精简并指导内容开发。\n\
  \n到为止，我们已经与赞助人和相关领域专家（SME）通过小组进行了会议和规划。我们的目标是创建一个项目计划，提交给项目赞助人和领导层批准，以继续项目并结束规划阶段。我们使用\
  \ `project charter/PID`（项目优先级、范围、理由、范围外内容、`WBS`、`Gantt chart` 等）来引导并对齐我们的项目团队。我们对风险和问题有良好的理解，并在\
  \ `risk register` 中记录了风险和问题，我们的项目计划反映了风险和问题管理的基础。一旦我们有了高级计划，就会安排第一次全员会议，在项目规划工作坊（PPW）中“背书”我们的项目计划。\n\
  \n### 项目规划工作坊\n当项目计划获得批准（也称为基线项目计划）时，我们退出规划阶段并开始设计阶段。项目计划的内容根据项目的复杂性和重要性、批准项目计划的受众以及项目经理的声誉而异。交付复杂关键项目的新项目经理可能需要制定更全面的计划。\n\
  \n`PPW` 汇集了相关利益相关者和项目赞助人。在提交给领导层正式批准之前，会展示高级计划供他们背书（图 8.1）。\n\n1. **背景：** 首先欢迎 `PPW`\
  \ 参与者参加工作坊，并概述工作坊，以背书项目计划。你可以解释交付方法（例如预测型）和治理性阶段关卡。\n2. **范围：** 确认项目范围、`WBS`、理由和范围外事项。三个问题（Done–Won–Who）的结果可以汇总，并可以使用\
  \ `Priority Triangle` 展示已批准的项目优先级。询问是否遗漏了任何关键利益相关者。有些人使用信息图形式的项目范围章程来对齐利益相关者。\n\
  3. **进度：** 接下来展示项目进度。目标是获得利益相关者的承诺，按照进度为项目做出贡献。展示高级 `Gantt chart` 让工作坊参与者了解项目时间线，并查看是否需要修订。接下来，展示说明进度逻辑和\
  \ `critical path`（关键路径）的高级 `network diagram`。项目经理将讨论需要广泛参与的关键活动（例如设计工作坊、用户验收测试和培训），并传达如果参与人数不足，项目可能会延迟。当运营任务需要完成时，让项目参与者参加设计工作坊、培训和测试活动是一个长期的风险，特别是当这些工作被跟踪服务水平协议（例如事件解决时间）时。因此，设定预期即如果没有他们的帮助项目可能会失败是有益的。再次，我们欢迎利益相关者的反馈。\n\
  \n\n\n\n\n### 4. 预算\n此处提供了高层项目预算以供评审。然而，在某些项目和组织中预算是敏感的，不会在 PPW 中展示。（如果尚未完成采购，您的财务和采购同事可以协助您进行采购[例如，供应商选择]。）\n\
  \n### 5. 职员\n此处展示了项目沟通和资源管理。有效的沟通将与项目里程碑、阶段和项目优先级保持一致。我们通过会议纪要和状态报告进行沟通。我们使用模板来指导内容开发（例如，进度表和预算），以共享项目信息。可以使用\
  \ `RACI` 矩阵，但它对于 PPW 来说可能过于详细，并且可以单独进行评审。\n\n### 6. 风险与问题:-\n最后，展示了主要的风险和问题。重点在于为成功交付项目所需的预防和缓解措施。目标是建立预防措施，以降低风险发生的概率（例如，将概率从中等降低到低）。我们还希望在风险发生时降低其影响（例如，将严重程度从高降低到中等甚至低）。我们描述了如何使用风险注册表以及其在项目会议和状态报告中的用途。\n\
  \n### 7. 后续步骤:\n我们通过后续步骤结束会议：项目经理根据 PPW 与会者的反馈更新项目计划，并安排与项目批准者的会面，向项目赞助人展示已通过的项目计划。\n\
  \nPPW 是一个早期里程碑，它汇集了利益相关者，展示集成项目计划的概述以换取他们的反馈。向他人展示项目计划可能会令人压力；然而，实践和系统的方法将使你处于成功的优势。会议和研讨会中存在常见的风险，讨论可能会偏离主题并将会议带入非预期的方向。保持会议正轨的一种技术是设置一个白板来“存放”PPW\
  \ 范围之外的重要事项（例如，项目终止后的优化）。在将 PPW 反馈纳入计划后，我们使用项目变更控制流程来批准经 PPW 参与者认可的更新项目计划。由于 PPW\
  \ 是每个项目中的重要里程碑，其许多元素可以成为未来 PPW 的模板。因此，对设计、布局、内容流和信息传递的关注将在未来重用时产生丰厚的回报。\n\n## 项目变更管理\n\
  \n我们使用项目变更管理流程 ([#Chapter08.xhtml#ch8fn2]) ([Figure#Chapter08.xhtml#fig8.10]) 来批准项目计划，并在随后批准项目变更（例如，更改预算或进度）。变更管理是\
  \ ITIL 服务管理的基础，并体现在变更启用（Limited, AXELOS 2019, 112–115）和组织变更管理实践（Limited, AXELOS\
  \ 2019, 90–91）中。使用变更管理流程管理项目变更是最佳实践。\n\n变更管理流程始于新项目或对现有项目的更改（例如，更改进度）。项目经理分析请求的变更（例如，评估可行性对项目和计划的影响）或制定项目计划。然后，项目经理将变更或项目计划提交决策者。如果变更或项目计划被拒绝，项目经理告知请求者。如果变更或项目计划被批准，项目经理实施变更。PPW\
  \ 中未看到，项目经理根据 PPW 与会者的反馈更新项目计划，并安排与项目批准者的会面，向项目赞助人展示已通过的项目计划。\n\n![images/fig10.jpg]\n\
  *图 8.10 变更管理流程*\n\nPPW 是一个早期里程碑，它汇集了利益相关者，展示集成项目计划的概述以换取他们的反馈。向他人展示项目计划可能会令人压力；然而，实践和系统的方法将使你处于成功的优势。会议和研讨会中存在常见的风险，讨论可能会偏离主题并将会议带入非预期的方向。保持会议正轨的一种技术是设置一个白板来“存放”PPW\
  \ 范围之外的重要事项（例如，项目终止后的优化）。在将 PPW 反馈纳入计划后，我们使用项目变更控制流程来批准经 PPW 参与者认可的更新项目计划。由于 PPW\
  \ 是每个项目中的重要里程碑，其许多元素可以成为未来 PPW 的模板。因此，对设计、布局、内容流和信息传递的关注将在未来重用时产生丰厚的回报。\n\n## 无处不在的网络安全规划\n\
  \n将网络安全构建到我们的项目中是良好的做法，而不是在项目准备上线时才添加网络安全。有很多资源可以指导包含网络安全的项目规划，包括《ISO 27002 信息安全技术-安全技术-信息安全控制实践规范》（ISO\
  \ 2018a, 1–90）：\n\n1. 确保开发和测试环境是安全的。\n2. 在设计中添加安全需求。\n3. 将安全包含在里程碑中。\n\n系统的项目规划可以转变信息曲线，并提高网络安全项目成功的概率。\n\
  \n## 计划阶段：结语\n\n项目规划是项目的根本部分，对成功至关重要。当人们评估项目失败的根本原因时，规划不足和风险管理往往会与测试不并被提及。因此，请为项目规划留出足够的时间。遵循集成且精的规划过程可以增加项目成功的概率。我们的目标是尽早了解更多项目信息，以避免项目后期出现昂贵的变更。\n\
  \n\n\n\n项目规划是一项随着使用而提高的技能。以下主题可以提高你对项目管理的理解和应用，并提高项目成功的概率。可以在网上搜索以下主题以加深你对项目规划的理解：\n\
  \n* 如何制定项目沟通计划？\n* 如何使用风险注册？\n* 搜索“项目规划模板”。\n* 搜索“项目规划软件”。\n\n我曾领导过一个项目，其中一家欧洲供应商在\
  \ 12 月和 1 月关闭了办公室，因为他们公司 75%的人（总共 18 人）患了流感。该老板照顾了他的团队，并关闭了公司一个月来帮助大家康复。我们的供应商在\
  \ 1 月中旬回到项目，导致我们的项目延迟了三周。我们使用变更控制流程重新为项目进度设定了基准。\n\n带有“泳道图”的跨功能流程图是说明流程和任务所有权的有效方法。我们在精益六西格玛流程优化项目中，使用跨功能流程图来记录现状流程及其“痛点”。我们通过优化来重绘流程，以展示步骤和痛点的减少。对于项目参与者来说，使用跨功能流程图绘制流程是一项实用的技能。\n\
  \n# 第 9 章\n\n## 设计阶段\n\n项目的启动是为了交付产品或服务。设计阶段是根据用户需求为产品或服务开发一个设计。技术项目通常有多个设计文档，例如应用程序详细设计、低级基础设施设计和集成设计。其目标是记录与产品或服务用户共同开发的设计，然后对设计进行批准。因此，终端用户和技术团队共同开发一个提交待审批的设计。有些组织设有业务分析师来协助设计活动以及需求引导和文档编制。一旦设计获得批准，项目团队将进入下一阶段，技术团队将根据批准的设计来构建产品或服务。系统分析与设计是高等教育信息系统课程的核心课题，超出了我们的项目管理视角范围。然而，项目经理需要监督设计阶段，并熟悉系统分析与设计的基础知识。\n\
  \n### 设计阶段最佳实践\n\nITIL 4 为设计服务提供了详细指导，并引导读者采取全局设计方法。质量、风险和项目管理有助于产生令终端用户愉悦的设计。然而，如果不遵循这种全局方法，可能无法交付全部价值（Limited,\
  \ AXELOS 2019, 34）。还可以通过设计思维技术（Defossez, McMillan, and Vuppala 2020, 4）和精益六西格玛优化方法来改进设计。例如，我们可以在设计阶段就引入网络安全功能，而不是在过渡到生产环境的阶段才将网络安全作为事后考虑。\n\
  \n项目团队需要在整个项目过程中考虑风险，并受 ITIL 风险管理实践的指导（Limited, AXELOS 2019, 95–97）。将风险管理应用于设计的一个例子是应用网络安全黄金法则：不要构建你无法妥善保护的东西（Skilton\
  \ and Hovsepian 2018, 207）。我们还被提醒，如果没有详尽的项目计划且不遵循良好的设计实践，我们可能会失败（Limited, AXELOS\
  \ 2019, 132–134）。如果你正确设计设计并采用精益方法实施，你更有可能优化价值。\n\n记录项目需求和设计的常用方法是举办一系列设计研讨会与终端用户会面。基本流程是在研讨会环境中从利益相关者处引导出设计，将所需的设计记录在设计文档中，然后批准设计。一旦获得批准，设计阶段结束，构建阶段开始。一个常见的风险是研讨会可能无人完全出席，导致一个缺陷或不完整的设计被批准并被构建。在测试期间，用户将告知技术团队该设计有“缺陷”。因此，需要防止和缓解研讨会出席率低的问题。一种预防措施是邀请经理参加研讨会，他们的出席传达了研讨会的重要性。如果老板参加，员工更有可能参加研讨会。一种缓解措施是针对可能错过设计研讨会的关键专家（SME）重复研讨会。虽然重复研讨会会消耗大量资源，但为了根据进度推进，增加额外的研讨会以配合主要专家有时是不可避免的。\n\
  \n项目经理可以使用来自 PMO 的设计模板来记录设计。模板是质量保证工具，用于快速开发设计文档。（如果你的组织没有自己的模板，可以在网上找到符合 ITIL 标准的设计模板和研讨会议程。）设计文档需要像项目计划一样通过批准。我们可以采取与规划阶段类似的批准方法：我们告知审批者我们的进度，听取并整合他们的反馈，然后将设计文档发给审批者审批。一旦设计文档通过批准，设计阶段结束。技术团队根据设计文档中的规范开始构建产品或或或服务。\n\
  \n### 设计阶段：结语\n\n设计阶段产生一个可以构建和测试且符合终端用户预期的设计。价值是在设计研讨会上与用户共同设计的。业务分析师专长详细化和记录设计、需求、报告和其他元素。我们的目标是从项目管理的角度产生一个准确反映终端用户和赞助者预期的设计。项目经理安排一系列设计研讨会，并邀请不同的团队成员完成各种设计，如详细应用程序设计、集成设计和低级基础设施设计。存在一个高影响风险，即由于其他优先事项，并非所有要求的专家都可能参加计划中的研讨会。因此，可以通过安排额外的研讨会来缓解代表性缺失。一旦设计形成文档，将分发给专家以取反馈。反馈将用于更新设计文档并提交审批。\n\
  \n### 微学习\n\n\n\n\n# 构建阶段 (Build Phase)\n\n构建阶段重点在于遵循设计文档中的要求并构建产品或服务。构建是一项技术工作，除了根据进度跟踪和控制进度外，项目经理通常只需要极少的概述。ITIL\
  \ 服务价值系统指导着构建阶段，项目团队作为一个系统共同工作，为用户构建服务（Limited, AXELOS 2019, 17–18）。某些组织会在“竣工文档”（as-built）中记录构建过程。一旦产品或服务构建完成并满足构建阶段的关关标准，项目将进入测试阶段。\n\
  \n### 微学习\n\n以下是一些增强你对构建阶段理解的练习：\n\n* 竣工文档是如何运作的？\n* 竣工文档的最佳实践是什么？\n* 搜索“构建阶段模版”。\n\
  \n# 第 11 章\n\n## 测试阶段 (Test Phase)\n\n现在产品或服务已经构建完成，我们进入测试阶段并计划测试（[图 6.2]）。测试是一项质量控制活动：发现并修复缺陷。我们很幸拥有来自质量、服务和项目管理专业的持续且广泛的指导来应用于测试活动。（NIST\
  \ 网络安全框架侧重于操作层面，未直接涉及网络安全项目期间的测试。）例如，ISO 9001:2000 质量管理标准指导用户如何交付产品和服务：“在规划产品实现时，组织应根据实际情况确定以下内容：……\
  \ c) 针对产品特定的所需的验证、确认、监控、检查和测试活动，以及产品验收标准；……”（ISO 2000, 30）。我们被指导进行测试并让利益相关者参与，以验证我们交付的价值。测试对于质量管理至关重要，并被认为是\
  \ *Shields Up.* 中的一个关键成功因素。\n\n项目期间的测试在 ITIL 的服务价值系统的“通用管理实践——测试”中有直接阐述（Limited,\
  \ AXELOS 2019, 24）。*Shields Up* 与 ITIL 交付能力的方法保持一致，包含了构建、测试和交付（T2P）阶段（[图 6.2]，项目交付方法——项目阶段）。然而，如果你有空闲容量，可以在项目的更早阶段开始制定测试策略和计划。同样，你也可以使用模版或之前的测试策略和计划作为起点。\n\
  \n测试是项目管理不可或缺的一部分；例如，测试是 PMBOK® 指南的一部分。“在规划阶段，项目经理和团队确定如何测试或检查产品、交付物或服务，以满足利益相关者的需求和期望……”（PMI\
  \ 2017a, 285）。PMI 标准将测试定性为项目生命周期中的一个阶段：“测试。在交接、上线或客户验收之前，将对交付物进行最终质量审查和检查”（PMI 2021,\
  \ 105）。因此，测试是嵌入在质量管理、服务管理和项目管理标准中的一项关键质量控制活动，也是 *Shields Up* 混合项目管理方法中的核心组件。在某些项目中，我们可以从早的规划阶段就开始制定测试策略和计划，并一直持续开发到测试阶段。\n\
  \n## 测试策略 (Test Strategy)\n\n通过制定测试策略和测试计划来开始测试规划。测试策略可能包含一张测试流程图（[图 11.1]），用以说明流程和参与者。\n\
  \n测试流程图（[图 11.1]）并没有说明制定测试策略和计划的协作性质；项目经理在项目早期与赞助人和领导层会会以及在项目规划研讨期间，会为测试参与设定预期。某些组织在测试开始前包含一个带有阶段关卡的测试策略和计划审批流程。\n\
  \n![images](img/fig11.1.jpg)\n\n***图 11.1 测试流程***\n\n测试策略是一份给利益相关者的简洁报告，从宏观层面概述测试方法以及如何满足测试目标。以下是测试策略的基础，可以根据你的项目进行定制：\n\
  \n1. **测试目标**：记录并验证测试目标（例如：发现并修复缺陷、提高对产品或服务的信心，以及验证产品或服务符合预期）。\n2. **范围内内容**：识别将测试什么内容以及原因。\n\
  3. **范围外内容**：记录哪些内容将被排除在测试之外以及原因。\n4. **测试类型**：识别并说明你将使用的测试类型理由（[表 11.1]）。有些人人会增加一“理由”列来说明为什么特定测试在范围之内或范围之外。在网上搜索可以发现额外的测试（例如冒烟测试），读者可以查看这些技术理论和实践，以定制适合项目的测试类型。\n\
  \n***表 11.1 系统测试概述***\n\n| **测试类型** | **包含** | **截止日期** | **负责人** |\n| --- | ---\
  \ | --- | --- |\n| **单元** | 是 | 9 月 12 日 | Jason Hawk |\n| **功能** | 是 | 9 月 17 日\
  \ | Saif Al Llama |\n| **集成** | 是 | 9 月 24 日 | Makoto Tamari |\n| **回归** | 否 | —\
  \ | — |\n| **安装/卸载** | 是 | 10 月 1 日 | Federico Sant |\n| **性能/压力测试** | 是 | 10 月\
  \ 1 日 | Irene Cornell |\n| **用户验收** | 是 | 10 月 15 日 | Marianne Jones |\n| **安全**\
  \ | 是 | 10 月 29 日 | Israa Alberta |\n\n5. **测试执行**：描述并说明测试将是手动还是自动。某些测试可以自动化（例如功能测试），而另一些可能是手动的（例如单元测试）。开源和商业测试工具日益增，许多工具集成了缺陷管理。\n\
  6. **缺陷管理**：描述将如何管理和控制缺陷，以及将使用什么软件来管理缺陷，包括任何待办事项（例如通过供应商未来的软件补丁解决的缺陷）。\n7. **沟通管理**：描述如何告知利益相关者测试结果，包括最终测试报告。\n\
  8. **测试进度**：包含一个高层进度或甘特图。\n9. **测试风险和问题管理**：描述将结合风险管理过程使用缺陷管理。如果发现了重大缺陷，可能会提出并管理风险或问题。\n\
  \n某些组织拥有测试策略和计划模版（质量保证）来指导项目经理。项目经理可以在项目早期收集测试策略和其他项目相关的模版来实现项目前置，以帮助项目规划。\n\n##\
  \ 测试计划 (Test Plan)\n\n测试计划是测试策略的扩展和补充。测试计划提供了测试环境、测试脚本和测试数据的细节。领域专家（例如供应商）通常负责制定测试计划：\n\
  \n1. **测试环境**：测试环境模拟生产环境，并且对于测试和实验性缺陷解决是安全的。测试环境包括满足测试执行最低要求的硬件、软件和操作系统。\n\n\n\n\
  \n\n### 2. **测试脚本**：制定详细的测试指令，以测试并验证需求是否已满足（例如：加载网站着陆页并点击“登录”按钮。验证登录界面出现并包含用户名和密码字段）。某些人会将测试脚本（自动化测试）与测试用例（手动测试）区分。测试脚本通常包含测试\
  \ ID 号、测试数据、测试步骤以及实际结果和预期结果。如果实际结果与预期结果不符，则可能存在缺陷。\n\n### 3. **测试数据**：由于隐私考虑，测试过程中使用的数据是开发的而非使用真实数据。项目团队开发用于测试脚本的数据，以验证系统是否按设计运行。由于数据是开发的，精益型团队可以开发多功能数据来服务多个测试脚本。许多测试人员利用数据管理工具来减少测试数据管理的行政负担。\n\
  \n### 4. **测试指标**：识别审批者希望的指标（例如：计划的测试脚本数量、执行的测试脚本数量和缺陷数量）；有时，测试人员会提供审批者要求的指标。设置您的测试仪表板以跟踪所需的指标，并轻松将其添加到测试报告中。\n\
  \n读者很幸运，可以通过在线搜索刷新他们对测试环境、测试脚本、数据和指标的知识，并了解应用测试的现状和趋势（例如：具有 AI 能力的自动化测试）。\n\n测试计划可能包含一个需求追溯矩阵，该矩阵将利益者的需求映射到测试脚本并跟踪验证（图\
  \ 11.2）。该矩阵作为项目需求已满足的证据。需求追溯矩阵是一个质量保证模板，可以在未来项目中。通过添加状态和结果列，需求追溯矩阵可以作为测试仪表板。添加额外的列是项目文档中精益化的示例。测试应用程序日益为管理测试环境、数据、脚本和缺陷管理提供凝聚支持，而某些测试人员使用电子表格来引导和跟踪测试。测试完成后，需求追溯矩阵可以包含在最终测试报告的附录中。\n\
  \n![images](img/fig11.2.jpg)\n\n***图 11.2 需求追溯矩阵***\n\n### 用户验收测试\n\n用户验收测试（UAT）验证系统是否满足已批准的利益者需求。UAT\
  \ 发生在测试团队完成系列测试（例如：单元测试、功能测试和集成测试）、纠正缺陷且领域专家（SMEs）认为系统按设计运行之后。然后，项目经理邀请最终用户参加 UAT\
  \ 工作坊（图 11.1），以验证系统是否按设计运行并符合利益者的预期。测试团队重复测试并使用需求追溯仪表板、测试环境、脚本和数据。理想情况下，最终用户执行脚本以更好地了解系统，从而在上线前发现并修复缺陷。“缺陷”一词被泛指为最终用户需要更改。例如，系统可能按设计运行，尽管如此，用户可能要求更改菜单——而不是按字母顺序排列菜单列表；用户可能要求将前五个选项优先考虑并显示在下拉菜单顶部。或者可能有拼写和语法错误需要修复。这些缺陷通过需求追溯矩阵或测试仪表板进行修复并跟踪直到完成。如果有任何未解决的缺陷或注释，它们也会记录在追溯矩阵和缺陷跟踪器中。\n\
  \n在 UAT 期间，最终用户首次看到系统运行并可能请求设计更改，即使设计已经获得批准。如果最终用户请求可能挑战完成进度或或其他问题的重大更改，项目经理可能会提出测试可能会延迟的风险。有时，请求的设计更改可以推到项目后的优化阶段，而不会延迟您的项目。重大更改的请求通常可以追溯到设计阶段以及最终用户的参与质量。因此，项目经理确保最终用户充分参与设计工作坊和设计文档审查是审慎的。如果最终用户没有完全参与设计阶段，项目经理可能会设计阶段提出风险，即由于对批准设计的更改请求，测试阶段可能需要更长时间完成。\n\
  \n为了完成设计阶段，某些项目经理会在两小时的会议期间与获得批准的最终用户一起审查设计文档，减少不理解设计的风险。在 *Shields Up* 中，我们关注于预防风险而非解决问题（例如：强调质量保证工作）。一旦最终用户完成\
  \ UAT 测试并给予批准，将更新需求追溯矩阵，并将批准记录在会议纪或电子邮件中。项目经理随后完成测试报告；这是离开测试阶段的最后一个阶段门。\n\n### 测试报告\n\
  \n测试报告包含测试结果，由项目经理准备（表 11.2）。测试报告的目的是记录测试策略和测试计划概述的测试结果，以确定是否存在足够的质量，以及产品或服务是否准备好发布。在编写测试报告时，参考测试策略和计划以确保完整性是审慎的。\n\
  \n在线搜索将带来许多测试报告示例和模板，可以指导项目经理和团队根据其项目和受众定制测试报告。测试报告开发后将发送给项目利益者审批。一旦获得批准，测试阶段完成，并开始向生产阶段过渡。\n\
  \n最后，在继续向生产阶段过渡（T2P）之前，某些网络网络安全项目并不适用于技术测试，例如审计或培训项目；然而，质量保证和质量控制仍然有一席之地。例如，可以使用同行评审来发现网络安全审计中的缺陷；同事可以审查审计结果以发现任何缺陷。在开发完网络安全培训课程后，最佳实践是对培训进行试点测试，以确定是否满足了学习成果（例如：完成质量控制检查）。\n\
  \n***表 11.2 测试报告内容***\n\n| | **内容** | **注释** |\n| :--- | :--- | :--- |\n| **正文**\
  \ | 测试报告概述 | 说明测试目的和整体结果（例如：测试成功），这是读者在测试报告中查找的首要内容。您可以添加 UAT 成功、最终用户已验证系统质量并已准备好发布\
  \ |\n| 测试结果 | 列出测试指标并突出关注感兴趣的关键点或异常 |\n| 缺陷 | 列出已遇到并解决的缺陷以及任何未解决的缺陷。让读者查阅附录——待处理事项——以获取缺陷解决计划\
  \ |\n| 结论 | 重申整体结果并强调测试已完成 |\n| **附录** | 应用概述 | 如果读者不熟悉其功能，应提供软件应用程序的简要概述。识别集成点、云存储、安全性等。\
  \ |\n| 测试环境、数据和工具概述 | 提供用于测试应用程序的测试环境、数据和工具的概述和评估 |\n\n\n\n\n\n| 测试范围 | 识别范围内和范围外的测试内容。说明任何未执行的测试及其理由。完整的需求追溯矩阵可能会显示测试范围和所执行的测试类型。\
  \ |\n| 待办事项 | 列出完成测试或修复缺陷所需的任何待办事项。对于某些事项，创建一个服务工单并设定未来的完成日期，以与资源可用性或修复缺陷的补丁发布保持一致。\
  \ |\n| 经验总结 | 识别关于测试环境、测试数据、工具、测试流程等方面的经验教训。 |\n\n## 测试阶段：结语\n\n与规划一样，测试阶段对于项目的成功至关重要。随着项目关键性和重要性的增加，测试的全面性和正式性也随之增加。测试是一项质量控制活动；如果需求定义执行得当（质量保证），那么在测试阶段的缺陷应该很少。测试计划和策略指导了测试，而测试报告则记录了结果和后续步骤。这些文档可以形成未来测试的一套模板。我们首先测试系统以发现并修复缺陷，然后邀请最终用户参与\
  \ UAT（用户验收测试）。他们验证需求是否已满足以及服务是否已准备好运行。如果存在任何未完成的测试或待办事项，我们会记录它们，并可能为未来的行动创建工单。\n\
  \n### 微学习\n\n测试技术在测试流程和技术方面已经取得了进展。在网上搜索并发现：\n\n* ITIL 服务验证和测试是如何工作的？\n* 技术缺陷管理是如何工作的？\n\
  * 如何跟踪测试缺陷？\n* 最好的测试软件是什么？\n* 自动化测试是如何工作的？\n* 下载测试策略、测试计划和测试报告模板供未来使用。\n\n# 第 12\
  \ 章\n\n### 向生产环境过渡\n\n向生产环境过渡（T2P）阶段包括通过项目交付方法产生的产品或服务交交给运营团队的活动。ITIL 的发布管理（Limited,\
  \ AXELOS 2019, 125–127）指导了广泛的活动，例如：\n\n1. 使用瀑布式或敏捷交付方法交付服务。\n2. 确保新版本可以被跟踪、验证，并在必要时从生产环境中卸载和回滚。\n\
  3. 确保偏差、风险和问题可以被管理和控制。\n4. 完成向运营端的知识和技能转移。\n\n向列表中添加网络安全活动，以将服务或产品引入生产环境，例如将新产品或服务添加到安全信息和事件管理（SIEM）系统中，进行渗透测试并撤销供应商密码。\n\
  \n向生产环境过渡的规划可以在规划阶段开始，并在 `T2P` 阶段完成。例如，网络安全应该设计到产品或服务中以满足网络安全要求，并确保上线路径顺利（ISO 2018a,\
  \ 7）。ITIL 发布和部署的关键在于，管理的成功在于新服务在项目和运营之间的无缝过渡（Limited, AXELOS 2019, 143–145）。因此，我们制定正式计划，安全地将服务发布给最终用户，以提高成功概率并符合“一次到位”的思想。\n\
  \nITIL 发布管理流程和工具指导项目参与者开发并改进将新的及变更的 IT 服务过渡到运营的能力（Limited, AXELOS 2019, 125–127）。成功的项目经理创建并复用\
  \ `T2P` 清单，以指导采取最后的项目行动使产品或服务上线。\n\n### T2P 清单\n\n向生产环境过渡的清单就像质量保证指南，确保项目的收尾工作是“紧密而非松散的”。也就是说，从项目阶段过渡到运营的最终上线活动经过计划、管理和控制，以提高成功实施和采用的概率。`T2P`\
  \ 清单因项目和组织而异；但必须完成常见任务以确保服务的顺利过渡。在项目早期让部署经理参与，规划发布和部署行动，并创建一个精简的 `T2P` 清单：\n\n1.\
  \ 告知变更许可委员会（`CAB`）新服务准备上线。敏锐的项目经理会在上线前两三个月或更早在 `CAB` 会议中增加议程项目，以提高项目的可见性。他们还会告知\
  \ `CAB` 他们使用 `T2P` 清单来管理和控制上线活动，以增强对系统化发布的信心。\n2. 测试备份/恢复能力。\n3. 根据情况移除供应商访问权限。\n\
  4. 将新服务添加到信息系统管理系统中。\n5. 为新服务开发并添加 `FAQ` 到服务操作手册中。\n6. 培训支持服务台人员。\n7. 培训最终用户。\n\
  8. 执行漏洞评估和修复。\n9. 完成系统加固审查。\n10. 进行信息系统风险审查。\n11. 完成灾难恢复测试。\n12. 制定上线沟通计划，包括准备好的沟通文案以应对风险（例如，实施失败需要从生产环境卸载）。\n\
  13. 为关键和高优先级项目建立上线指挥中心。\n14.以此类推。\n\n根据最佳实践，项目经理仅完成将服务发布给最终用户所需的 `T2P` 行动。服务被赋予价值并优化；项目规划和服务过渡活动中应用了定制化处理。\n\
  \n最后的 `T2P` 行动之一是获得 `CAB` 批准以将新服务发布到生产环境中。（某些项目不涉及发布到生产环境的系统，例如网络安全审计，但可能需要报告或演示稿。）使用变更管理流程至关重要的，因为系统配置错误是一个主要的攻击向量，在进入生产环境之前通过系统化的正式审查可以得到更好的管理（Microsoft\
  \ 2020, 74）。项目经理根据项目进度和 `CAB` 会议协调发布日期。某些项目受益于项目经理在会上与 `CAB` 审批成员讨论发布事项，以便对任何问题提供详细解答。\n\
  \n当你的发布版本准备在 `CAB` 会议上讨论时，首先解释你遵循的 `T2P` 流程（例如清单操作和为 `T2P` 服务创建工单），以赢得对服务已准备好发布以及利益相关者认可该发布的信心。你的信息是“流程良好，结果良好”。对于更关键和影响更大的项目，考虑使用信息图或仪表板来解释发布已准备好部署，组织已准备好发布，并且你有一个监控和控制发布的计划。你通过提供\
  \ `CAB` 审批者渴望的信息，力使审批变得简单。\n\n\n\n\n我们的目标是将项目产生的产品或服务无缝转移到运营，并实现预期的成果。我们在规划阶段就完成了确定的\
  \ T2P 行，以便将服务发布到生产环境，包括回滚计划。我们包含了培训和沟通，以确保平稳过渡。我们与变更控制委员会（CAB）和发布经理合作，计划并将服务发布到生产环境。\n\
  \n### 表 12.1 CAB 上线状态报告\n\n| 发布元素 | 状态 | 注释 |\n| --- | --- | --- |\n| 网络安全就绪情况 |\
  \ 绿色 | 列出已完成的安全措施以及就绪状态 |\n| 系统就绪情况 | 绿色 | 已就绪 |\n| 新服务就绪情况 | 绿色 | 已就绪 |\n| 运营就绪情况\
  \ | 绿色 | 部分培训尚未完成；但赞助人确认组织已准备就 |\n| 培训状态 | 橙色 | 11% 的人员尚未完成培训；正在提供额外的培训。95% 的人员将在第\
  \ 2 周（上线后）完成培训 |\n| 沟通就绪情况 | 绿色 | 已就绪——包括回滚沟通 |\n| 报告就绪情况 | 绿色 | 已就绪——已发布升级程序 |\n\
  | 支持就绪情况 | 绿色 | 已就绪——模拟演练已完成 |\n| 风险 | 绿色 | 无高严重风险；受控制中 |\n| 问题 | 绿色 | 无高严重问题；受控制中\
  \ |\n| 其他 | — | 无 |\n\n### 微学习\n\n以下是一些增强你学习效果的实操练习。请在网络上搜索：\n\n* ITIL 发布管理\n* ITIL\
  \ 发布管理模板\n* ITIL 发布管理实践\n* 发布策略（例如金丝雀发布/暗色发布）\n* 变更授权委员会\n\n# 第 13 章\n\n## 监控、稳定与结束\n\
  \n服务或产品已交付给运营，项目团队转向支持（早期生命支持）和结束活动。ITIL 服务价值链的最后活动是根据用户的期望和规范交付并支持新服务。团队寻求有关发布质量的反馈，并与最终用户保持联系。项目团队接收服务成功的反馈，以指导支持和未来的优化规划。某些项目受益于上线指挥中心，该中心聚集项目和运营资源，以便立即解决工单并进行报告升级。上线计划将具有预定的触发点，用于升级和报告问题，以及触发从生产环境中卸载并回滚新服务的触发点。\n\
  \n监控新服务质量的一种方法是监控事件。ITIL 在其事件管理实践中提供了相关指南。项目经理可能会查看每日事件报告（如果有），以了解采用情况和质量。例如，监控关键性能指标（`KPIs`）（如解决时间）并将其与服务水平协议（`SLAs`）进行比较。在检查事件时，将事件分为技术类事件和培训相关类事件，以更好地理解实施质量。项目经理通常根据每天工单量或每周工单量建立结束阶段的门限，或者在预定的监控期（例如四周）后结束项目。在项目团队监控和支持新服务的同时，他们同时进行结束活动，如对合同进行合规审计。一旦达到结束指标，项目即告结束。\n\
  \n结束流程的目的是正式终止项目，将产品或服务转移给赞助人，并释放项目资源。一些项目经理使用清单来指导结束活动，例如：\n\n1. **交付物交接：** 正式将交付物转移给赞助人，并在会议纪要或电子邮件中确认验收。可以使用需求追溯矩阵（`Figure\
  \ 11.2`），其中包含确认会议纪要或电子邮件的链接。\n2. **项目完成通知：** 通知所有利益相关者需求已交付且项目已完成。指导利益相关者在需要协助联系服务台。\n\
  3. **合同结束：** 审查合同以确保已履行所有合同义务。一些项目经理使用需求追溯矩阵记录是否已履行合同义务。\n4. **资源：** 释放资源（人员和设备）并与团队庆祝。\n\
  5. **教训总结：** 与项目利益相关者完成教训总结，考虑哪些地方做得好，哪些地方可以改进。\n\n在结束报告中记录这些行动，并归档项目文件以供未来参考。通过电子邮件通知赞助人项目已结束（终止），并将通知添加到项目存档中。\n\
  \n教训总结是许多组织的共同做法。哪些地方做得很好？我们遇到了哪些困难？我们应该停止做什么？我们应该继续做什么？以及其他问题也有助于学习，而这是 *Shields\
  \ Up* 中所有指导良好实践和混合项目管理框架的基石。结束报告通常包含教训总结部分。然而，教训往往被收集了但并不总是被汲取；为什么我们的项目失败率如此惨淡且反复出现？因此，我的建议是在项目开始和每个项目阶段开始时完成教训总结。在团队会议期间，这些可以是简短的讨论，以应用在之前的项目中积累的智慧和知识。我们不仅可以应用之前的学习，团队也看重他们的建议得到实施。当对教训进行排序并分配给专人在受跟踪和报告的截止日期内完成时，教训总结的实施会更加有效。\n\
  \n### 微学习\n\n在网络上搜索更多关于项目尾声的信息；圆满收官是终止项目的首选方式：\n\n* 如何终止项目？\n* 如何完成教训总结练习？\n* 在哪里找到合同结束模板和合同结束函？\n\
  * 寻找项目结束的最佳实践？\n\n# 第 14 章\n\n## 运营与优化\n\n当项目结束后，运营部门负责管理通过你的项目交付的服务。ITIL 提供了一个框架、工具和流程来管理和优化服务。项目可能会留有遗留；可能会有挂起的工单以完成尚未完成的项目行动。例如，某个需求可能由于缺陷未得到满足，该缺陷可以通过未来的补丁来修复。供应商对补丁和升级有发布策略和计划。挂起的工单可以提醒运营人员寻找补丁并计划其发布，以满足缺失的功能。\n\
  \n六西格玛优化方法结合 ITIL 和 ISO 9001 的持续改进，提供了优化产品和服务以交付更多价值的框架和工具。如果遵循经过证明的流程（例如六西格玛 DMAIC\
  \ 问题解决和优化流程），优化将更加成功。优化建议可能会导致服务价值链产生新的项目和倡议。\n\n某些项目采取迭代和分阶段的方法（ITIL 认可），从最小化安装开始。一旦基础功能安装（“原装安装”）并投入使用，最终用户将更好地了解哪些地方应该进行优化和扩展。优化可以触发新项目，这些项目可以通过变更控制流程进行考虑，以获得进行新项目的批准。\n\
  \n\n\n\n当我们谈论数字化转型时，我们看到的证据表明我们正在进入一个巨大的数字驱动变革时期，例如量子计算和医疗保健领域应用的 AI 研究（IBM 2021,\
  \ 1–2）。由于技术采用速度的加快，我们的生活和工作方式正在迅速变化。企业正在制定由技术和创新驱动的战略。这种技术采纳的一个影响是，网络安全服务的需求和优先级已经增加。威胁态势和相关的漏洞已大幅扩大。企业正在增加技术和网络安全预算，但要求\
  \ `CISO` 为投资回报率辩护并提供证明。\n\n随着网络安全工作的增加和预算的扩大，组织正在积极招聘网络安全专业人才，范围从初级职位到如云安全专家和网络安全项目经理等专业化职位。遗憾的是，对网络安全人才的需求远超供应。网络安全技能缺口给企业带来了许多问题，例如延迟网络安全项目，直到有网络安全项目经理到位才能完成项目。技能缺口也为网络安全专业人士提供了领导其第一个项目的机会。随着领导力而来的是对结果的责任：即项目的成功。因此，项目经理更有倾向于采用结构化而非随机的项目管理交付方法来交付成功的项目。\n\
  \n组织日益依赖技术来交付产品和服务，并保持我们信息的机密、隐私和安全。组织调整最佳实践和框架，提供一种结构化的方法来交付符合批准要求和服务水平协议的产品和。。组织很少按照设计应用标准和框架；相反，他们会挑选满足其自身要求的元素（例如，他们根据特定情况对框架进行定制）。我们在\
  \ `PMBOK® Guide` 和 `ITIL` 等项目管理标准中看到了定制指导，用于选择交付成功项目所需的项目管理工具和过程（图 15.1）。`Shields\
  \ Up` 中记录的混合项目管理重点是遵循结构化方法满足利益相关者的需求，并利用机会为最终用户交付价值。传统的项目管理交付方法适用于大多数项目。它具有风险管理的基础，可以提高价值交付给服务用户的概率。我们可能会包含迭代工作，以确定最佳设计或修复在测试期间发现的缺陷。然而，大多数网络安全项目可以使用传统的项目管理交付方法实施，并在需要时进行迭代。虽然我们的项目管理方法可能因项目而异，但我们的混合项目管理原则并非如此；我们具有紧迫感，鼓励协作，并专注于交付价值。\n\
  \n![images](img/fig15.1.jpg)\n\n**图 15.1 Shields Up 混合项目管理**\n\n祝喜你已经走到了这里！你可能想要查看特定章节、回顾练习并完成微学习操作。项目管理是一项动态专业领域，每年吸引新的从业者和研究人员，导致了最佳实践的成熟和新的工作方式。将技术和网络安全的进步与项目管理相结合，我们有了一个规划、实施和维持价值的动态环境。我们学习项目管理的程仍在继续。\n\
  \n# 第三部分\n\n## 附录\n\n## 附录 1\n\n### NIST 网络安全框架核心示例](#Contents.xhtml#rap1)\n\n美国国家标准与技术研究院\
