  \ | | | | | | | |\n\n![images](img/fig4.8.jpg)\n\n***图***\n\n#### 练习\n\n回顾 ITIL\
  \ 服务价值链，并比较你的组织与该框架的齐程度。你使用了哪些实践，并将它们加入你的简历中？\n\n当遵循信息系统生命周期方法时，结果更具预测性，因为利益相关者理解流程中的步骤并可以进行相应的计划。我们鼓励在\
  \ SDLC 中构建网络安全，包括威胁建模、设计评审、静态和动态测试以及生产环境中的渗透测试（Microsoft 2020, 75）。我们看到 SDLC 与传统的项目管理、IT\
  \ 服务管理和网络安全管理最佳实践，以及质量管理等支持过程相一致。《Shields Up》 也与信息系统生命周期方法一致。因此，通过遵循本书的方法，你将继续对良好的项目管理、IT\
  \ 和网络安全实践做出贡献。\n\n### 技术框架对齐：结语\n\n质量管理是许多框架（包括网络安全）的基础。NIST 网络安全框架是许多组织用于交付和优化网络安全服务的全球性标准框架。网络安全服务通常在\
  \ ITIL 框架内交付，该框架遵循服务价值链，从识别需求或机会开始，通过使用和优化的项目管理交付方法交付给组织。\n\n### 项目管理框架\n\n项目管理框架分为两类：针对个人的能力框架和针对组织的成熟度模型。类似于网络安全能力成熟度模型，也有项目管理能力模型，例如\
  \ `PMI` 的项目管理成熟度模型 (`ProMMM`)。组织可以遵循这些成熟度模型来提高其项目管理能力，就像通过提升网络安全等级来提高能力一样。由于网络安全专业人员不太可能领导项目管理改进项目，`ProMMMs`\
  \ 不在本书的范围内。相反，我们关注针对个人的项目管理框架（例如`《项目管理知识体系指南 [PMBOK® Guide]` 和 `PRINCE2`），旨在指导他们进行项目管理。\n\
  \n多个项目管理框架可以在从预测性到自适应项目交付的连续体上进行解释（见图 5.1）。我们可以使用预测性项目管理交付方法，利用进度表、预算和其他工具来规划项目，分阶段预测任务完成情况。这种传统方法有时被称为瀑布式项目管理，因为它是顺序且线性的；在旧阶段完成之前，新阶段不会开始。大多数专业组织（例如\
  \ `PMI` 和 `国际项目管理协会`）都支持预测性项目管理方法。\n\n然而，随着敏捷项目管理的日益流行，项目管理协会已在其标准中接纳了如 `Scrum`\
  \ 方法等自适应项目管理方法。当存在 (i) 项目团队要交付的产品或服务的模糊性，或 (ii) 如何交付产品或服务的模糊性时，敏捷交付方法是合适的。复杂且模糊的项目可以从自适应交付方法中受益；然而，此类方法不在本书的范围内，因为\
  \ (i) 大多数网络安全项目的模糊性较低（例如安装新软件或进行审计），以及 (ii) 顶级网络安全框架（以及 `ISO` 质量管理）意味着传统的或预测性的项目管理方法。因此，本书强调传统的项目管理交付方法，以帮助读者交付常规网络安全项目。然而，《Shields\
  \ Up》中的混合项目管理方法在遇到足够的模糊性或复杂性时（例如设计挑战）可以兼顾自适应性项目工作。\n\n![images](img/fig5.1.jpg)\n\
  \n***图 5.1 项目交付连续体***\n\n### 项目管理知识体系指南\n\n来自 `PMI` 的 `PMBOK® Guide` 被广泛认为是全球事实上的项目管理标准。`PMBOK®\
  \ Guide` 第 7 版包含了项目管理标准（见图 5.2）。较早版本的 `PMBOK Guide`（第 1-6 版）是战术性的（如何计划和交付），而 `PMBOK\
  \ Guide` 第 7 版是战略性的（管理*什么*）。\n\n项目管理原则在 `PMBOK Guide` 第 7 版中得到了强调。原则旨在适用于所有项目，无论项目的类型、复杂性、项目经理和赞助人如何。原则是持久且通用的。`PMBOK\
  \ Guide` 第 7 版的原则指导我们在项目中的行为（PMI 2021, 42–43）：\n\n![images](img/fig5.2.jpg)\n\n\
  ***图 5.2 PMBOK® Guide 演进***\n\n1. **务实 (Stewardship)**：做一个勤勉、尊重且关怀的管理者。\n2. **协作团队**：建立协作的项目团队环境。\n\
  3. **利益相关者**：与利益相关者有效互动。\n4. **价值**：关注价值。\n5. **整体性**。\n11. **适应性与韧性**：拥抱适应性和韧性。\n\
  12. **变更管理**：实现变革以达到预期的未来状态。\n\n《Shields Up》与第 6 版的流程和知识领域（例如从战术角度考虑质量和风险管理过程）以及第\
  \ 7 版的原则（战略重点）一致，我们在我们在项目时的行为。\n\n#### 练习\n\n这些 `PMBOK Guide` 原则类似于《敏捷宣言》和 `ITIL\
  \ 4` 原则；花点时间比较这些原则，发现 IT 行业长期以来一直遵循这些原则来指导我们的工作（见敏捷项目管理，图 5.4）。思考你如何根据这些原则完成工作。这些项目管理原则和其他原则指导了《Shields\
  \ Up》中混合项目管理方法中的项目交付。哪些原则是可以优先进一步培养的？\n\n***紧迫感***\n\n\n\n\n\n另外两个原则指导着成功的项目经理：带着紧迫感工作以及工作前置加载。如果你曾想过“我真希望我再多一天时间来……”，那么这另外两个原则将帮助你按时交付。项目的延期是一天一天积累的；因此，我们努力在一种可持续的速度下最大化我们每天完成的工作。在成功的项目经理身上，我们可以看到这种原则：行动导向的会议准时开始，且持续时间更短。会议安排在明天而不是下周，以此此类推。业务和技术领导者不仅会注意到你的紧迫感，还会注意到你的团队。效法紧迫感，这一原则将渗透到团队的项目行为中。\n\
  \n## 前置加载\n\n减少风险和问题的第二个原则是前置加载：将工作提前（在合理的情况下）进行，以便为未来利用机会或管理风险和问题留出空间。前置加载不是一个新概念，但被证明是有效的；我父亲过去常说：“今天能做的事就不要留到明天做。”我们可以提前处理低风险任务，例如设置你的模板（如：项目章程信息图、设计文档、PLO\
  \ 工期估算工作表、进度表、会议记录、状态报告、T2P 跟踪器和测试缺陷记录）以及预订你的会议室（如：团队周会、风险管理会议和状态会议）。许多工作可以在精力较低的下班后完成（例如：设置你的团队协作站点）。成功的项目经理通常在项目启动时加班；在项目早期长时间工作要比在项目结束、压力巨大时在深夜和周末工作要容易得多！进行前置加载，你就不可能希望再多一天了。前置加载和带着紧迫感工作可以让你在项目生命周期中更早地了解更多项目信息。这两个原则是有效的，并且在项目中得到了关注。将紧迫感、前置加载以及\
  \ `PMBOK® Guide` 的原则融入你的实践中，将提高你的项目成功率并激发信心。\n\n## PRINCE2\n\n通过在线搜索可以发现，`PMP` 认证广受尊重在全球范围内通用；然而，`PRINCE2`\
  \ 项目管理框架也很流行（[PRINCE2.com](http://PRINCE2.com) 2021, 1）。英国政府于 1989 年首次发布了 `PRINCE2`（受控环境中的项目)，以指导公共服务技术项目。`PRINCE2`\
  \ 包含了过程、主题和原则（图 5.3`）。`PRINCE2` 模型是规范性的；它会指导读者项目上应该做什么、什么时候做以及由谁来完成任务。\n\n![images](img/fig5.3.jpg)\n\
  \n图 5.3 PRINCE2 框架\n\n个人可以通过 `AXELOS` 组织获得 `PRINCE2` 认证：`PRINCE2 Foundation` 或更全面的\
  \ `PRINCE2 Practitioner`。将 `PRINCE2` 与 `PMBOK® Guide` v6 和 v7 比较时，有许多相似之处，例如在原则的指导下遵循过程。`PMBOK®\
  \ Guides` 越来越多包含了敏捷组件，而 `PRINCE2` 方法已扩展包含 `PRINCE2 Agile`。*Shields Up* 与这些基于过程的框架和敏捷原则保持一致。\n\
