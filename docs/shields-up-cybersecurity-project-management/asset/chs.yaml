  \ 年 2 月 22 日）；服务器将延迟交付；已与采购部门确认（2020 年 3 月 16 日） |\n\n### 风险叙述\n\n该项目需要三台服务器用于大数据密集型计算。然而，由于全球数字化转型的趋势，全球芯片短缺导致了制造延迟。项目经理提出了一个风险（`R-144`）并更新了风险登记表（`Table\
  \ A3.1`）。我们的基础设施专家（`Barry Blanchard`）正在管理采购并调查了其他型号服务器的可用性，但没有一种能满足我们的进度。为了缓解，团队将提前开展工作，例如开发测试策略和计划以及创建\
  \ T2P 清单，为赶上服务器配置、测试和构建活动留出时间。项目经理关闭了风险，更新了风险登记，并将风险转换为问题（`I-22`）。\n\n### 问题叙述\n\
  \n项目经理开启了一个问题（`I-22`），即服务器将延迟四个月到达的问题，导致构建阶段延迟（`Table A3.2`）。采购专家已与供应商交谈，高度确定服务器将在\
  \ 2020 年 8 月 14 日或之前到达。项目团队已审查进度，并将提前开展工作，如处理设计、测试和 T2P 文档，以尽可能地减少延迟的影响。\n\n***表\
