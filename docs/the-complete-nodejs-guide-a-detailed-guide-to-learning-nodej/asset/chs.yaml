  \ => response.json())\n      .then(data => {\n        if (data.token) {\n      \
  \    ws = new WebSocket(`ws://localhost:3000?token=${data.token}`);\n          ws.onmessage\
  \ = (event) => {\n            const msg = JSON.parse(event.data);\n            const\
