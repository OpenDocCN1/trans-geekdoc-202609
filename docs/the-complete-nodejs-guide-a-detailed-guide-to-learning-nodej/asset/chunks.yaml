    ## 4.6. 构建一个简单的博客服务器\n\n在这个示例中，我们将使用 Express.js 构建一个简单的博客服务器。该服务器将包含创建、读取、更新和删除博客文章的功能。我们还将实现用于记录请求、处理身份验证、输入验证和错误处理的中间件。\n\
    \n### 项目结构\n\n这里是博客服务器的项目结构：\n\n```text\nblog-server/\n├── node_modules/\n├──\
    \ public/\n│   └── index.html\n├── middlewares/\n│   ├── logger.js\n│   ├── auth.js\n\
    │   ├── validatePost.js\n│   └── errorHandler.js\n├── routes/\n│   └── blog.js\n\
    ├── app.js\n└── package.json\n```\n\n### 第 1 步：初始化项目\n\n```bash\nmkdir blog-server\n\
    cd blog-server\nnpm init -y\nnpm install express body-parser morgan\n```\n\n###\
    \ 第 2 步：创建 HTML 页面\n\n在 `public` 目录创建一个 `index.html` 文件。\n\n`public/index.html`:\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
    >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <title>Simple Blog Server</title>\n</head>\n<body>\n  <h1>Welcome to the\
    \ Simple Blog Server</h1>\n  <p>This page demonstrates a simple blog server built\
    \ with Express.js.</p>\n</body>\n</html>\n```\n\n### 第 3 步：实现自定义中间件\n\n创建用于记录请求、处理身份验证、输入验证和错误处理的自定义中间间件。\n\
    \n`middlewares/logger.js`:\n\n```javascript\nmodule.exports = (req, res, next)\
    \ => {\n  console.log(`${req.method} ${req.url} - ${new Date().toISOString()}`);\n\
    \  next();\n};\n```\n\n`middlewares/auth.js`:\n\n```javascript\nmodule.exports\
    \ = (req, res, next) => {\n  const authHeader = req.headers.authorization;\n \
    \ if (authHeader && authHeader === 'Bearer mysecrettoken') {\n    next();\n  }\
    \ else {\n    res.status(401).json({ message: 'Unauthorized' });\n  }\n};\n```\n\
    \n`middlewares/errorHandler.js`:\n\n```javascript\nmodule.exports = (err, req,\
    \ res, next) => {\n  console.error(err.stack);\n  res.status(500).json({ message:\
    \ 'Something went wrong!' });\n};\n```\n\n`middlewares/validatePost.js`:\n\n```javascript\n\
    module.exports = (req, res, next) => {\n  const { title, content } = req.body;\n\
    \  if (!title || typeof title !== 'string') {\n    return res.status(400).json({\
    \ message: 'Invalid title' });\n  }\n  if (!content || typeof content !== 'string')\
    \ {\n    return res.status(400).json({ message: 'Invalid content' });\n  }\n \
    \ next();\n};\n```\n\n### 第 4 步：设置路由\n\n路由处理 CRUD 操作。\n\n`routes/blog.js`:\n\n\
    ```javascript\nconst express = require('express');\nconst router = express.Router();\n\
    const authMiddleware = require('../middlewares/auth');\nconst validatePostMiddleware\
    \ = require('../middlewares/validatePost');\n\nlet posts = [];\n\n// GET /api/posts\
    \ - 获取所有文章\nrouter.get('/posts', (req, res) => {\n  res.json(posts);\n});\n\n\
    // GET /api/posts/:id - 根据 ID 获取单篇文章文章\nrouter.get('/posts/:id', (req, res) =>\
    \ {\n  const post = posts.find(p => p.id === parseInt(req.params.id));\n  if (!post)\
    \ {\n    return res.status(404).json({ message: 'Post not found' });\n  }\n  res.json(post);\n\
    });\n\n// POST /api/posts - 创建新文章\nrouter.post('/posts', authMiddleware, validatePostMiddleware,\
    \ (req, res) => {\n  const { title, content } = req.body;\n  const newPost = {\
    \ id: posts.length + 1, title, content };\n  posts.push(newPost);\n  res.status(201).json(newPost);\n\
    });\n\n// PUT /api/posts/:id - 根据 ID 更新文章\nrouter.put('/posts/:id', authMiddleware,\
    \ validatePostMiddleware, (req, res) => {\n  const post = posts.find(p => p.id\
    \ === parseInt(req.params.id));\n  if (!post) {\n    return res.status(404).json({\
    \ message: 'Post not found' });\n  }\n  const { title, content } = req.body;\n\
    \  post.title = title;\n  post.content = content;\n  res.json(post);\n});\n\n\
    // DELETE /api/posts/:id - 根据 ID 删除文章\nrouter.delete('/posts/:id', authMiddleware,\
    \ (req, res) => {\n  posts = posts.filter(p => p.id !== parseInt(req.params.id));\n\
    \  res.json({ message: 'Post deleted' });\n});\n\nmodule.exports = router;\n```\n\
