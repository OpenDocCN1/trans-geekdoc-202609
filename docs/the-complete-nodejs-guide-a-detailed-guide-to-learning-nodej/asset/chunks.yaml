    \ with ID:', result.insertedId);\n\n}\n\ncreateUser();\n```\n\n### Reading (Finding)\
    \ Data\n\nTo retrieve data from a collection, you can use the `find` method. Here’s\
    \ an example of finding all documents in the `users` collection:\n\n```javascript\n\
    async function getUsers() {\n  const database = client.db('my_database');\n  const\
    \ users = database.collection('users');\n  const cursor = users.find({});\n  const\
    \ allValues = await cursor.toArray();\n  console.log('User data:', allValues);\n\
    }\n\ngetUsers();\n```\n\n### Updating Data\n\nTo update existing data in a collection,\
    \ you can use the `updateOne` or `updateMany` methods. Here’s an example of updating\
    \ a user’s password:\n\n```javascript\nasync function updateUser() {\n  const\
    \ database = client.db('my_database');\n  const users = database.collection('users');\n\
    \  const query = { username: 'johndoe' };\n  const update = { $set: { password:\
    \ 'newsecurepassword' } };\n  const result = await users.updateOne(query, update);\n\
    \  console.log('Matched documents:', result.matchedCount);\n  console.log('Modified\
    \ documents:', result.modifiedCount);\n}\n\nupdateUser();\n```\n\n![image](d2d_images/scene_break.png)\n\
    \n### DELETING DATA\n\nTo delete data from a collection, you can use the `deleteOne`\
    \ or `deleteMany` methods. Here’s an example of deleting a user from the `users`\
    \ collection:\n\n```javascript\nasync function deleteUser() {\n  const database\
    \ = client.db('my_database');\n  const users = database.collection('users');\n\
    \  const query = { username: 'johndoe' };\n  const result = await users.deleteOne(query);\n\
    \  console.log('Deleted documents:', result.deletedCount);\n}\n\ndeleteUser();\n\
    ```\n\n### Advanced Features: Indexing and Aggregation\n\n#### INDEXING\n\nIndexes\
    \ improve the speed of data retrieval operations on a collection. They are particularly\
    \ useful for fields that are frequently used in search conditions (`find` queries).\
    \ Creating an index on a field involves using the `createIndex` method. Here’s\
    \ an example of creating an index on the `username` field in the `users` collection:\n\
    \n```javascript\nasync function createIndex() {\n  const database = client.db('my_database');\n\
    \  const users = database.collection('users');\n  const result = await users.createIndex({\
    \ username: 1 });\n  console.log('Index created:', result);\n}\n\ncreateIndex();\n\
    ```\n\n#### Aggregation\n\nAggregation operations process data records and return\
    \ computed results. They are used to perform complex data transformations and\
    \ calculations. The `aggregate` method in MongoDB allows you to perform operations\
    \ like grouping, sorting, and averaging. Here’s an example of using `aggregate`\
    \ to group users by their username and count the number of users:\n\n```javascript\n\
    async function aggregateUsers() {\n  const database = client.db('my_database');\n\
    \  const users = database.collection('users');\n  const pipeline = [\n    { $group:\
    \ { _id: '$username', count: { $sum: 1 } } },\n    { $sort: { count: -1 } }\n\
    \  ];\n  const cursor = users.aggregate(pipeline);\n  const results = await cursor.toArray();\n\
    \  console.log('Aggregation results:', results);\n}\n\naggregateUsers();\n```\n\
