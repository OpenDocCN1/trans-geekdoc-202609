    - `.save`: 将此 REPL 会话中所有评估过的命令保存到文件\n- `.editor`: 进入编辑器模式\n- `.scope`: 显示当前作用域\n\
    - `.history`: 显示 REPL 历史\n- `.set`: 在 REPL 上下文中设置变量\n- `.inspect`: 检查变量\n\n###\
    \ .break\n**描述**: 如果你在编写多行表达式中间卡住，请使用此命令。它将退出当前表达式并返回 REPL 提示符。\n\n**用法**:\n```\n\
    > {\n...   const x = 10;\n...   .break\n>\n```\n\n### .clear\n**描述**: 清空当前的 REPL\
    \ 上下文。它是 `.break` 的别名。\n\n**用法**:\n```\n> const x = 10;\n> .clear\n> \n```\n\n\
    ### .exit\n**描述**: 退出 REPL。你也可以使用两次 `Ctrl+C` 退出。\n\n**用法**:\n```\n> .exit\n```\n\
    \n### .save <filename>\n**描述**: 将当前 REPL 会话保存到文件。这对于保存你的工作并在稍后查看很有用。\n\n**用法**:\n\
    ```\n> .save session.js\n```\n\n### .load <filename>\n**描述**: 在当前 REPL 会话中加载并执行文件。这允许你引入预定义的脚本或函数。\n\
    \n**用法**:\n```\n> .load script.js\n```\n\n### .editor\n**描述**: 进入多行输入模式，你可以在其中编写多行代码。要完成并评估代码，请按\
    \ `Ctrl+D`。\n\n**用法**:\n```\n> .editor\n// 进入编辑器模式 (Ctrl+D 完成， Ctrl+C 取消)\nconst\
    \ x = 10;\nconst y = 20;\nconsole.log(x + y);\nCtrl+D\n30\n>\n```\n\n### .scope\n\
    **描述**: 显示当前作用域的上下文，包括局部变量及其值。对于调试当前状态很有用。\n\n**用法**:\n```\n> const x = 10;\n\
    > .scope\n{\n  x: 10\n}\n>\n```\n\n### .history\n**描述**: 显示执行过的 REPL 命令历史。这有助于回顾和重用之前的命令。\n\
    \n**用法**:\n```\n1: const x = 10;\n2: console.log(x);\n3: .history\n```\n\n###\
    \ .set var value\n**描述**: 在 REPL 上下文中设置变量。这对于会话期间动态调整值很有用。\n\n**用法**:\n```\n>\
    \ .set y 50\n> console.log(y);\n```\n\n### .inspect var\n**描述**: 检查并打印变量的详细信息。对于调试复杂对象或变量很有用。\n\
    \n**用法**:\n```\n> const obj = { a: 1, b: 2 };\n> .inspect obj\n```\n\n### 访问 REPL\
    \ 历史\nREPL 保留你输入的命令历史。你可以使用向上和向下键浏览历史，轻松地重新运行命令或进行细微修改。\n\n### 下划线变量\nREPL 会**自动**将上一次评估表达式的结果赋值给变量\
    \ `_`，允许你在你在后续命令中使用它。\n\n**示例：使用下划线变量**\n```\n> 5 + 10\n15\n> _ * 2\n30\n```\n\
    在此示例中，`5 + 10` 的结果是 `15`，然后存储在 `_` 中。下一个命令将此结果乘以 `2`，得到 `30`。\n\nNode.js REPL\
    \ 是以交互方式实验 JavaScript 和 Node.js 代码的强大工具。它允许你快速测试代码段、调试代码并探索 Node.js API，而无需创建单独文件的开销。通过理解和利用\
    \ REPL 的功能，你可以显著提高你的开发和效率。\n\n# 3. 文件系统与流\n\n## 3.1. 文件的读取与写入\n处理文件是许多应用程序的基本方面。无论是读取配置文件、写入日志还是处理数据，理解如何在\
    \ Node.js 中读写文件都是至关重要的。Node.js 提供了 `fs` 模块，它提供了同步和异步方法来与文件系统交互。让我们深入探索这些概念。\n\n\
    ### fs 模块简介\nNode.js 中的 `fs` (File System) 模块允许你与计算机的文件系统交互。你可以使用它读取、写入、更新、删除以及管理文件和目录。`fs`\
    \ 模块可以通过以下方式引入：\n\n```javascript\nconst fs = require('fs');\n```\n\n### 读取文件\n\
    读取文件有两种完成方式：同步和异步。\n\n#### 同步读取\n在同步读取中，程序的执行会暂停直到文件读取操作完成。这对于小文件或简单脚本非常直接，但对于大文件或复杂的应用程序可能会阻塞事件循环。\n\
    \n**示例：同步读取**\n```javascript\nconst fs = require('fs');\n\ntry {\n  const data\
    \ = fs.readFileSync('example.txt', 'utf8');\n  console.log(data);\n} catch (err)\
    \ {\n  console.error('读取文件错误:', err);\n}\n```\n在此示例中，`fs.readFileSync('example.txt',\
    \ 'utf8')` 同步读取 `example.txt`。`utf8` 参数指定了编码。发生错误会被捕获并打印到控制台。\n\n#### 异步读取\n异步读取允许在读取文件时继续执行操作，使其更适用于文件和高性能应用程序。\n\
    \n**示例：异步读取**\n```javascript\nconst fs = require('fs');\n\nfs.readFile('example.txt',\
    \ 'utf8', (err, data) => {\n  if (err) {\n    return console.error('读取文件错误:',\
    \ err);\n  }\n  console.log(data);\n});\n\nconsole.log('读取文件...');\n```\n在此示例中，`fs.readFile('example.txt',\
    \ 'utf8', callback)` 异步读取文件。回调函数处理文件数据或任何错误。日志“读取文件...”会被立即打印，展示了非阻塞行为。\n\n###\
    \ 写入文件\n写入文件也可以同步或异步完成。\n\n#### 同步写入\n**示例：同步写入**\n```javascript\nconst fs = require('fs');\n\
    \nconst data = '如果某件事足够重要，你就应该尝试。即使结果可能是失败。Elon Musk';\n\ntry {\n  fs.writeFileSync('C:\\\
    \\Users\\\\MOAML\\\\Desktop\\\\file.txt', data);\n  console.log('文件写入成功');\n}\
    \ catch (err) {\n  console.error('写入文件错误:', err);\n}\n```\n\n"
