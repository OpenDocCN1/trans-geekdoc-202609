  trans: "\n\n### DELETE 方法\n\n- **幂等性**：多个相同的 DELETE 请求产生的效果应与单个请求相同。\n- **非安全**：会改变服务器的状态。\n\
    - **不可缓存**：对 DELETE 请求的响应通常不缓存。\n\n**用途**：\n- 从服务器删除资源。\n\n**示例**：\n```http\n\
    DELETE /users/1 HTTP/1.1\nHost: example.com\n```\n\n**解释**：在此示例中，向 `/users/1`\
    \ 终点发送 `DELETE` 请求，以删除 ID 为 1 的用户。\n\n### PATCH 方法\n\n**定义**：`PATCH` 方法用于对资源进行部分修改。\n\
    \n**特性**：\n- **非幂等性**：多个相同的 PATCH 请求可能会产生不同的效果。\n- **非安全**：会改变服务器的状态。\n- **不可缓存**：对\
    \ PATCH 请求的响应通常不缓存。\n\n**用途**：\n- 部分更新资源。\n\n**示例**：\n```http\nPATCH /users/1\
    \ HTTP/1.1\nHost: example.com\nContent-Type: application/json\n\n{\n \"email\"\
    : \"john.newemail@example.com\"\n}\n```\n在此示例中，向 `/users/1` 终点发送 `PATCH` 请求，仅更新\
    \ ID 为 1 的用户的电子邮箱。\n\n### OPTIONS 方法\n\n**定义**：`OPTIONS` 方法用于描述目标资源的通信选项端。\n\n\
    **特性**：\n- **幂等性**：多个相同的 OPTIONS 请求产生的效果应与单个请求相同。\n- **安全**：不改变服务器的状态。\n- **不可缓存**：对\
    \ OPTIONS 请求的响应通常不缓存。\n\n**用途**：\n- 检查服务器支持哪些 HTTP 方法。\n\n**示例**：\n```http\nOPTIONS\
    \ /users HTTP/1.1\nHost: example.com\n```\n在此示例中，向 `/users` 终点发送 `OPTIONS` 请求，以确定服务器为该资源支持的方法。\n\
    \n### HEAD 方法\n\n**定义**：`HEAD` 方法与 `GET` 方法相同，不同之处服务器**必须不**在响应中返回消息体。它用于获取写入响应标头中的元数据，而无需传输整个内容。\n\
    \n**特性**：\n- **幂等性**：多个相同的 HEAD 请求产生的效果应与单个请求相同。\n- **安全**：不改变服务器的状态。\n- **可缓存**：对\
    \ HEAD 请求的响应可以缓存。\n\n**用途**：\n- 检查资源是否存在。\n- 获取有关资源的元数据。\n\n```http\nHEAD /users\
    \ HTTP/1.1\nHost: example.com\n```\n在此示例中，向 `/users` 终点发送 `HEAD` 请求，以获取不带响应体的标头信息。\n\
    \n| HTTP 方法 | 幂等性 | 安全 | 可缓存 | 描述 |\n| :--- | :--- | :--- | :--- | :--- |\n| GET\
    \ | 是 | 是 | 是 | 从指定的资源检索数据。 |\n| POST | 否 | 否 | 否 | 向服务器发送数据以创建/更新资源。 |\n| PUT\
    \ | 是 | 否 | 否 | 更新资源或在不存在时创建它。 |\n| DELETE | 是 | 否 | 否 | 删除指定的资源。 |\n| PATCH |\
    \ 否 | 否 | 否 | 对资源进行部分修改。 |\n| OPTIONS | 是 | 是 | 否 | 描述资源的通信选项。 |\n| HEAD | 是 |\
    \ 是 | 是 | 获取资源的标头而不包含正文。 |\n\nHTTP 方法表 3\n\n![image](img/image198.png)\n\n## 4.1.\
    \ 创建简单的 Web 服务器\n\n在 Node.js 中创建一个简单的 Web 服务器是理解服务器端应用程序如何工作的关键步骤。Node.js 内置的\
    \ `http` 模块提供了设置服务器的所有功能。\n\n### 步骤 1：导入 HTTP 模块\n首先，你需要导入 `http` 模块。你不需要安装任何东西。\n\
    ```javascript\nconst http = require('http');\n```\n\n### 步骤 2：创建服务器\n`createServer`\
    \ 方法创建一个服务器实例。回调函数接收两个参数：`req`（请求对象）和 `res`（响应对象）。\n```javascript\nconst server\
    \ = http.createServer((req, res) => {\n    // 逻辑在这里\n});\n```\n\n### 步骤 3：监听端口\n\
    告诉服务器监听端口。开发中常用的端口有 3000、8080 和 5000。\n```javascript\nconst PORT = 3000;\nserver.listen(PORT,\
    \ () => {\n    console.log(`Server running at http://localhost:${PORT}`);\n});\n\
    ```\n\n### 完整示例\n```javascript\nconst http = require('http');\n\nconst server\
    \ = http.createServer((req, res) => {\n    res.statusCode = 200;\n    res.setHeader('Content-Type',\
    \ 'text/plain');\n    res.end('Hello, World!\\n');\n});\n\nconst PORT = 3000;\n\
    server.listen(PORT, () => {\n    console.log(`Server running at http://localhost:${PORT}`);\n\
    });\n```\n\n"
- fmt: "\n![image](d2d_images/image178.png)\n\n# 4. Introduction to Postman\n\nPOSTMAN\
    \ IS A POWERFUL and user-friendly tool designed to simplify the process of developing,\
    \ testing, and documenting APIs. It allows developers to send HTTP requests, inspect\
    \ responses, and automate API testing. With Postman, you can interact with your\
    \ web server without writing additional code, making it an essential tool for\
    \ web development and API testing.\n\n![image](d2d_images/image093.png)\n\n##\
    \ What is Postman?\n\nPOSTMAN IS A COLLABORATION platform for API development.\
    \ It provides a comprehensive set of tools to help you design, debug, test, and\
    \ document APIs. It supports various HTTP methods (`GET`, `POST`, `PUT`, `DELETE`,\
    \ etc.), and allows you to add headers, parameters, and request bodies with ease.\
    \ Postman’s intuitive interface and robust feature set make it a popular choice\
    \ among developers for API testing and development.\n\n![image](d2d_images/image157.png)\n\
    \n## Key Features of Postman\n\n1. **HTTP Requests**: Send HTTP requests with\
    \ various methods (`GET`, `POST`, `PUT`, `DELETE`, etc.).\n2. **Headers and Parameters**:\
    \ Add custom headers and query parameters to your requests.\n3. **Request Body**:\
    \ Send different types of request bodies (`raw`, `JSON`, `form-data`, etc.).\n\
    4. **Response Inspection**: View detailed responses including status codes, headers,\
    \ and body.\n5. **Environment Variables**: Use variables to manage different environments\
    \ (development, staging, production).\n6. **Automation**: Write tests and automate\
    \ API workflows with Postman’s scripting capabilities.\n7. **Collections**: Group\
    \ related requests into collections for better organization and reusability.\n\
    \n## How to Use Postman\n\n### Installing Postman\n\n1. **Download**: Visit the\
    \ Postman download page and download the appropriate version for your operating\
    \ system.\n2. **Install**: Follow the installation instructions for your platform\
    \ to install Postman.\n\n### Creating a New Request\n\n1. **Open Postman**: Launch\
    \ the Postman application.\n2. **Create a New Request**:\n   - Click on the `+`\
    \ button or `New` button in the top left corner to create a new request.\n   -\
    \ Select `HTTP Request`.\n\n![image](d2d_images/image219.png)\n\n1. **Set the\
    \ Request Method**:\n   - Use the dropdown menu to select the HTTP method (`GET`,\
    \ `POST`, `PUT`, `DELETE`, etc.).\n\n![image](d2d_images/image171.png)\n\n1. **Enter\
    \ the URL**:\n   - Enter the URL of the API endpoint you want to test (e.g., `http://localhost:3000`).\n\
    \n### Adding Headers and Parameters\n\n1. **Headers**:\n   - Click on the `Headers`\
    \ tab below the URL bar.\n   - Add key-value pairs for the headers you want to\
    \ include (e.g., `Content-Type: application/json`).\n2. **Query Parameters**:\n\
    \   - Click on the `Params` tab below the URL bar.\n   - Add key-value pairs for\
    \ the query parameters you want to include (e.g., `name=John&age=30`).\n\n###\
    \ Adding a Request Body\n\n1. **Select the Body Tab**:\n   - Click on the `Body`\
    \ tab below the URL bar.\n2. **Choose the Body Type**:\n   - Select the appropriate\
    \ body type (`raw`, `form-data`, `x-www-form-urlencoded`, etc.).\n3. **Enter the\
    \ Request Body**:\n   - For `raw` body type, select the data format (e.g., `JSON`)\
    \ and enter the request body.\n   - Example JSON body:\n\n```json\n{\n  \"name\"\
    : \"John\",\n  \"age\": 30\n}\n```\n\n### Sending the Request\n\n1. **Click Send**:\n\
    \   - Click the `Send` button to send the request to the server.\n2. **Inspect\
    \ the Response**:\n   - The response from the server will be displayed in the\
    \ lower section of Postman.\n   - You can view the response status, headers, and\
    \ body.\n\n### Using Postman Collections\n\n1. **Create a Collection**:\n   -\
    \ Click on the `Collections` tab on the left sidebar.\n   - Click the `New Collection`\
    \ button and give your collection a name.\n2. **Add Requests to Collection**:\n\
    \   - Save individual requests to the collection for better organization.\n  \
    \ - Click `Save` on the request and select the collection to save it to.\n\n###\
    \ Automating Tests\n\n1. **Write Tests**:\n   - Click on the `Tests` tab below\
    \ the URL bar.\n   - Write JavaScript code to create tests that validate the response.\n\
    \   - Example test:\n\n![image](d2d_images/image214.png)\n\n```javascript\npm.test(\"\
    STATUS CODE is 200\", function () {\n  pm.response.to.have.status(200);\n});\n\
    ```\n\nFor a thorough and engaging tutorial on using Postman, I highly recommend\
    \ watching the video clip by Hitesh Choudhary on YouTube, where he explains Postman\
    \ in an excellent way.\n\n## 2. Handling Requests and Responses\n\n### Different\
    \ HTTP Methods\n\nHTTP methods define the type of operation requested by the client.\
    \ Understanding these methods is crucial for building robust APIs.\n\n### Handling\
    \ GET Requests\n\nGET requests are used to retrieve data from the server. They\
    \ are idempotent, meaning multiple identical requests should not change the state\
    \ of the server.\n\nExample:\n```javascript\nconst http = require('http');\nconst\
    \ url = require('url');\n\nconst server = http.createServer((req, res) => {\n\
    \  if (req.method === 'GET') {\n    const query = url.parse(req.url).query;\n\
    \    res.statusCode = 200;\n    res.setHeader('Content-Type', 'application/json');\n\
    \    res.end(JSON.stringify(query));\n  } else {\n    res.statusCode = 405;\n\
    \    res.end('Method Not Allowed');\n  }\n});\n\nconst PORT = 3000;\nserver.listen(PORT,\
    \ () => {\n  console.log(`Server running at http://localhost:${PORT}`);\n});\n\
    ```\n\nTesting:\n1. Open Postman and create a GET request.\n2. Set the URL to\
    \ `http://localhost:3000?name=John&age=30`.\n3. Click `Send`.\n4. You will see\
    \ the response with the query parameters.\n\n### Handling POST Requests\n\nPOST\
    \ requests are used to send data to the server to create or update a resource.\
    \ The data is included in the request body.\n\nExample:\n```javascript\nconst\
    \ http = require('http');\n\nconst server = http.createServer((req, res) => {\n\
    \  if (req.method === 'POST') {\n    let body = '';\n    req.on('data', chunk\
    \ => {\n      body += chunk.toString();\n    });\n    req.on('end', () => {\n\
    \      res.statusCode = 200;\n      res.setHeader('Content-Type', 'application/json');\n\
    \      res.end(`Received data: ${body}`);\n    });\n  } else {\n    res.statusCode\
    \ = 405;\n    res.end('Method Not Allowed');\n  }\n});\n\nconst PORT = 3000;\n\
    server.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}`);\n\
    });\n```\n\nTesting:\n1. Open Postman and create a new POST request.\n2. Set the\
    \ URL to `http://localhost:3000`.\n3. Go to the `Body` tab, select `raw` and `JSON`,\
    \ and enter:\n```json\n{\n  \"name\": \"John\",\n  \"age\": 30\n}\n```\n4. Click\
    \ `Send`.\n5. You should see the response with the received data.\n\n### Handling\
    \ PUT Requests\n"
