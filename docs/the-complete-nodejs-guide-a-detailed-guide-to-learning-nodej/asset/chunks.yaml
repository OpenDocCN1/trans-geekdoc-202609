    \n–––––––––\n\n![image](img/scene_break.png)\n\n## 4.3 路由\n\n路由是确定应用程序如何响应对特定端点的客户端请求的过程，端点是一个\
    \ URI（或路径）以及特定的 HTTP 方法（GET、POST 等）。在 Node.js 中，路由可以使用内置的 `http` 模块实现，或者更常见的是，使用\
    \ `express` 框架，它提供了更直观、更强大的路由机制。\n\n### 使用 HTTP 模块的基础路由\n\n`http` 模块提供了设置路由的基本功能。然而，对于较大的应用程序，这种方法可能会变得非常繁琐。\n\
    \n![image](img/image041.png)\n\n使用 HTTP 模块的示例：\n\n```javascript\nconst http =\
    \ require('http');\nconst url = require('url');\nconst server = http.createServer((req,\
    \ res) => {\n  const parsedUrl = url.parse(req.url, true);\n  const pathname =\
    \ parsedUrl.pathname;\n\n  if (req.method === 'GET' && pathname === '/') {\n \
    \   res.statusCode = 200;\n    res.setHeader('Content-Type', 'text/plain');\n\
    \    res.end('Home Page');\n  } else if (req.method === 'GET' && pathname ===\
    \ '/about') {\n    res.statusCode = 200;\n    res.setHeader('Content-Type', 'text/plain');\n\
    \    res.end('About Page');\n  } else {\n    res.statusCode = 404;\n    res.setHeader('Content-Type',\
    \ 'text/plain');\n    res.end('404 Not Found');\n  }\n});\n\nconst PORT = 3000;\n\
    server.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n解释：\n\n* `url` 模块用于解析 URL 并提取 `pathname`。\n* 根据请求方法和 `pathname` 发送不同的响应。\n\
    \n### 使用 Express 的高级路由\n\nEXPRESS 是一个用于 Node.js 的 Web 应用程序框架，它简化了路由并为构建 Web 和移动应用程序提供了广泛的特性。\n\
    \n安装 Express：\n\n```bash\nnpm install express\n```\n\n使用 Express 的基础路由：\n\n```javascript\n\
    const express = require('express');\nconst app = express();\n\napp.get('/', (req,\
    \ res) => {\n  res.send('Home Page');\n});\n\napp.get('/about', (req, res) =>\
    \ {\n  res.send('About Page');\n});\n\napp.get('/users/:id', (req, res) => {\n\
    \  const userId = req.params.id;\n  res.send(`User ID: ${userId}`);\n});\n\napp.use((req,\
    \ res, next) => {\n  res.status(404).send('404 Not Found');\n});\n\nconst PORT\
    \ = 3000;\napp.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n–––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image215.png)\n\
    \n解释：\n\n* `app.get('/')`: 为对根 URL 的 GET 请求定义了路由。\n* `app.get('/about')`: 为对 `/about`\
    \ URL 的 GET 请求定义了路由。\n* `app.get('/users/:id')`: 为对 `/users/:id` 的 GET 请求定义了路由，其中\
    \ `:id` 是路由参数。\n* `app.use((req, res, next) => {...})`: 用于处理任何未匹配路由的 404 错误的中间件。\n\
    \n### 使用路径参数\n\n路径参数用于捕获 URL 中特定位置指定的值。\n\n使用路径参数的示例：\n\n```javascript\napp.get('/users/:id/books/:bookId',\
    \ (req, res) => {\n  const userId = req.params.id;\n  const bookId = req.params.bookId;\n\
    \  res.send(`User ID: ${userId}, Book ID: ${bookId}`);\n});\n```\n\n–––––––––\n\
    \n![image](img/scene_break.png)\n\n解释：\n\n* `:id` 和 `:bookId` 是路径参数的占位符。\n* `req.params`\
    \ 用于访问这些参数。\n\n### 使用查询参数\n\n查询参数用于以键值对的形式通过 URL 传递额外数据。\n\n使用查询参数的示例：\n\n```javascript\n\
    app.get('/search', (req, res) => {\n  const query = req.query;\n  res.send(`Search\
    \ Query: ${query}`);\n});\n```\n\n解释：\n\n* 查询参数通过 `req.query` 获取。\n* 在示例中，`req.query`\
    \ 获取查询参数的值。\n\n### 处理 HTTP 方法\n\nEXPRESS 使得处理同一路由的不同方法变得简单。\n\n示例：\n\n```javascript\n\
    app.route('/resource')\n  .get((req, res) => {\n    res.send('GET request to /resource');\n\
    \  })\n  .post((req, res) => {\n    res.send('POST request to /resource');\n \
    \ })\n  .put((req, res) => {\n    res.send('PUT request to /resource');\n  })\n\
    \  .delete((req, res) => {\n    res.send('DELETE request to /resource');\n  });\n\
    ```\n\n解释：\n\n* `app.route('/resource')`: 为同一路由链式处理程序。\n* 为 GET、POST、PUT 和 DELETE\
    \ 请求定义了不同的处理器。\n\n### 使用中间件进行路由\n\n中间件函数可以访问请求对象 (`req`)、响应对象 (`res`) 以及应用程序请求响应循环中的下一个中间件函数。\n\
    \n示例：\n\n```javascript\napp.use((req, res, next) => {\n  console.log(`Request\
    \ Method: ${req.method}, Request URL: ${req.url}`);\n  next();\n});\n\napp.get('/',\
    \ (req, res) => {\n  res.send('Home Page');\n});\n\napp.get('/about', (req, res)\
    \ => {\n  res.send('About Page');\n});\n```\n\n* 中间件记录请求的方法和 URL。\n* `next()`\
    \ 将控制权传递给下一个中间件函数。\n\n![image](img/image064.png)\n\n## 4.4 托管静态文件\n\n托管静态文件（如\
    \ HTML、CSS、JavaScript、图像等）是 Web 应用程序常见的需求。静态文件是在服务器上不会更改的文件，并按原交付给客户端。在 Node.js\
    \ 中，可以使用内置的 `http` 模块托管静态文件，但更常见的是使用 `express` 框架，它显著简化了这个过程。\n\n### 使用 HTTP 模块托管静态文件\n\
    \n虽然可以使用核心 `http` 模块托管静态文件，但它需要更多手动设置和处理。\n\n使用 HTTP 模块的示例：\n\n```javascript\n\
    const http = require('http');\n```\n\n"
