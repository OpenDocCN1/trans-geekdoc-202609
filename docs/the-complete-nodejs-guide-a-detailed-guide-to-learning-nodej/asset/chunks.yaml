    \n###  Parsing and Managing Data \n\n   P    ARSING AND MANAGING    data are essential\
    \ tasks when handling HTTP requests in Node.js.   Different types of data can\
    \ be sent in HTTP requests, such as JSON data, URL-encoded data, and multipart\
    \ form data (commonly used for file uploads).   This section will explain how\
    \ to parse and manage these different types of data. \n\n####  Parsing JSON Data\
    \ \n\n   J    SON (JAVASCRIPT OBJECT    Notation) is a lightweight data-interchange\
    \ format that is easy to read and write for humans and machines.   JSON is commonly\
    \ used for sending structured data in HTTP requests. \n\n  Example with Core HTTP\
    \ Module    : \n\n const http =    require    ('http'); \n\n const server = http.\
    \    createServer    ((req, res) => { \n\n if (req.method === 'POST' && req.headers\\\
    ['content-type'\\] === 'application/json') { \n\n let body = ''; \n\n req.   \
    \ on    ('data', chunk => { \n\n body += chunk.    toString    (); \n\n }); \n\
    \n req.    on    ('end', () => { \n\n try { \n\n const parsedData = JSON.    parse\
    \    (body); \n\n res.statusCode = 200; \n\n res.    setHeader    ('Content-Type',\
    \ 'application/json'); \n\n res.    end    (JSON.    stringify    ({ received:\
    \ parsedData })); \n\n } catch (err) { \n\n res.statusCode = 400; \n\n res.  \
    \  end    ('Invalid JSON'); \n\n } \n\n }); \n\n } else { \n\n res.statusCode\
    \ = 405; \n\n res.    end    ('Method Not Allowed'); \n\n } \n\n }); \n\n const\
    \ PORT = 3000; \n\n server.    listen    (PORT, () => { \n\n console.    log \
    \   (\\`Server running at http://localhost:${PORT}/\\`); \n\n }); \n\n  Explanation\
    \    : \n\n*     This code snippet sets up an HTTP server that listens for POST\
    \ requests with a    Content-Type    of    application/json    .  \n\n*    The\
    \ server reads the request body, parses it as JSON, and responds with the parsed\
    \ data. \n\n*     If the JSON is invalid, it returns a    400 Bad Request    status.\
    \  \n\n  Testing with Postman    : \n\n1.   Create a new POST request. \n\n2.\
    \   Set the URL to    http://localhost:3000    . \n\n3.   Set the    Content-Type\
    \    header to    application/json    . \n\n4.   In the Body tab, select    raw\
    \    and    JSON    , then enter: \n\n { \n\n \"name\": \"John\", \n\n \"age\"\
    : 30 \n\n } \n\n Click    Send    . \n\n####  Parsing URL-encoded Data \n\n  \
    \ U    RL-ENCODED DATA IS    often used in form submissions.   It encodes key-value\
    \ pairs in a URL format, where each key-value pair is separated by    &    and\
    \ keys/values are separated by    =    . \n\n ![image](d2d_images/image203.png)\n\
    \n  Example with Core HTTP Module    : \n\n const http =    require    ('http');\
    \ \n\n const querystring =    require    ('querystring'); \n\n const server =\
    \ http.    createServer    ((req, res) => { \n\n if (req.method === 'POST' &&\
    \ req.headers\\['content-type'\\] === 'application/x-www-form-urlencoded') { \n\
    \n let body = ''; \n\n req.    on    ('data', chunk => { \n\n body += chunk. \
    \   toString    (); \n\n }); \n\n req.    on    ('end', () => { \n\n const parsedData\
    \ = querystring.    parse    (body); \n\n res.statusCode = 200; \n\n res.    setHeader\
    \    ('Content-Type', 'application/json'); \n\n res.    end    (JSON.    stringify\
    \    ({ received: parsedData })); \n\n }); \n\n } else { \n\n res.statusCode =\
    \ 405; \n\n res.    end    ('Method Not Allowed'); \n\n } \n\n }); \n\n const\
    \ PORT = 3000; \n\n server.    listen    (PORT, () => { \n\n console.    log \
    \   (\\`Server running at http://localhost:${PORT}/\\`); \n\n }); \n\n ––––––––\
    \ \n\n ![image](d2d_images/scene_break.png) \n\n    E    XPLANATION     : \n\n\
    *     This code snippet sets up an HTTP server that listens for POST requests\
    \ with a    Content-Type    of    application/x-www-form-urlencoded    .  "
