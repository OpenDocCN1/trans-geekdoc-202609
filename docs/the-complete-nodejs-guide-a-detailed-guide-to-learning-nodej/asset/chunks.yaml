    \ err); \n\n return; \n\n } \n\n console.    log    ('Directory deleted successfully');\
    \ \n\n }); \n\n }); \n\n console.    log    ('Creating and deleting directory...');\
    \ \n\n  Explanation    : \n\n*    fs.mkdir('newDir', callback)    : Creates a\
    \ new directory named    newDir    .  \n\n*    fs.rmdir('newDir', callback)  \
    \  : Deletes the directory named    newDir    .  \n\n*    The program logs 'Creating\
    \ and deleting directory...'   immediately, demonstrating non-blocking behavior.\
    \ \n\n####  Example 3: Copying Files \n\n    O    BJECTIVE     : Copy a file from\
    \ one location to another. \n\n  Code    : \n\n const fs =    require    ('fs');\
    \ \n\n // Source and destination paths \n\n const source = 'source.txt'; \n\n\
    \ const destination = 'destination.txt'; \n\n // Copying the contents of 'source.txt'\
    \ to 'destination.txt' \n\n fs.    copyFile    (source, destination, (err) =>\
    \ { \n\n if (err) { \n\n console.    error    ('Error copying file:', err); \n\
    \n return; \n\n } \n\n console.    log    ('File copied successfully'); \n\n });\
    \ \n\n console.    log    ('Copying file...'); \n\n  Explanation    : \n\n*  \
    \  fs.copyFile(source, destination, callback)    : Copies the contents of    source.txt\
    \    to    destination.txt    .  \n\n*    The program logs 'Copying file...' \
    \  immediately, demonstrating non-blocking behavior. \n\n####  Example 4: Listing\
    \ Files in a Directory \n\n    O    BJECTIVE     : List all files and directories\
    \ within a specified directory. \n\n  Code    : \n\n const fs =    require   \
    \ ('fs'); \n\n // Listing the contents of the current directory \n\n fs.    readdir\
    \    ('.', (err, files) => { \n\n if (err) { \n\n console.    error    ('Error\
    \ reading directory:', err); \n\n return; \n\n } \n\n console.    log    ('Files\
    \ in directory:'); \n\n files.    forEach    (file => { \n\n console.    log \
    \   (file); \n\n }); \n\n }); \n\n console.    log    ('Listing files in directory...');\
    \ \n\n  Explanation    : \n\n*    fs.readdir('.', callback)    : Reads the contents\
    \ of the current directory (denoted by    .    ).  \n\n*    The program logs 'Listing\
    \ files in directory...'   immediately, demonstrating non-blocking behavior. \n\
    \n####  Example 5: Watching for File Changes \n\n    O    BJECTIVE     : Monitor\
    \ a file for changes and log when it is modified. \n\n  Code    : \n\n const fs\
    \ =    require    ('fs'); \n\n // Watching 'watchedFile.txt' for changes \n\n\
    \ fs.    watch    ('watchedFile.txt', (eventType, filename) => { \n\n if (filename)\
    \ { \n\n console.    log    (\\`${filename} file Changed\\`); \n\n } \n\n });\
    \ \n\n console.    log    ('Watching file for changes...'); \n\n  Explanation\
    \    : \n\n*    fs.watch('watchedFile.txt', callback)    : Watches    watchedFile.txt\
    \    for any changes (e.g., modifications, deletions).  \n\n*    The program logs\
    \ 'Watching file for changes...'   immediately, demonstrating non-blocking behavior.\
    \ \n\n####  Example 6: Appending Data to a File \n\n    O    BJECTIVE     : Append\
    \ data to an existing file. \n\n  Code    : \n\n const fs =    require    ('fs');\
    \ \n\n // Data to append \n\n const data = '\\\\nAppended text.'; \n\n // Appending\
    \ data to 'fileToAppend.txt' \n\n fs.    appendFile    ('fileToAppend.txt', data,\
    \ (err) => { \n\n if (err) { \n\n console.    error    ('Error appending to file:',\
    \ err); \n\n return; \n\n } \n\n console.    log    ('Data appended successfully');\
    \ \n\n }); \n\n console.    log    ('Appending data to file...'); \n\n  Explanation\
    \    : \n\n*    fs.appendFile('fileToAppend.txt', data, callback)    : Appends\
    \    data    to    fileToAppend.txt    .  \n\n*    The program logs 'Appending\
    \ data to file...'   immediately, demonstrating non-blocking behavior. \n\n These\
    \ practical examples demonstrate how to perform various file system operations\
    \ using Node.js, such as reading and writing files, creating and deleting directories,\
    \ copying files, listing directory contents, watching for file changes, and appending\
    \ data to files.   By understanding and utilizing these operations, you can efficiently\
    \ manage files and directories within your Node.js applications, ensuring robust\
    \ and flexible file handling capabilities. \n\n|  ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  ||  ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\
    \n| --- | --- | --- |\n\n ![image](d2d_images/chapter_title_above.png) \n\n# \
    \ ​   ![image](d2d_images/image167.png)  4.   HTTP and Web Servers \n\n ![image](d2d_images/chapter_title_below.png)\
    \ \n\n##  ​   Understanding HTTP Status Codes \n\n   H    TTP status codes are\
    \    standardized responses issued by a server in response to a client's request\
    \ made to the server.   These status codes are grouped into five classes: \n\n\
    1.    1xx (Informational)    : The request was received, continuing process. \n\
    \n2.    2xx (Successful)    : The request was successfully received, understood,\
    \ and accepted. \n\n3.    3xx (Redirection)    : Further action needs to be taken\
    \ in order to complete the request. \n\n4.    4xx (Client Error)    : The request\
    \ contains bad syntax or cannot be fulfilled. \n\n5.    5xx (Server Error)   \
    \ : The server failed to fulfill a valid request. \n\n####  Common HTTP Status\
    \ Codes \n\n####  404 Not Found \n\n    D    EFINITION     : The 404 status code\
    \ means that the server cannot find the requested resource.   This status code\
    \ is commonly returned when the URL requested by the client does not correspond\
    \ to any resource on the server.   It indicates a client-side error where the\
    \ user is trying to access a page that does not exist. \n\n  Typical Causes  \
    \  : \n\n*    Typing an incorrect URL. \n\n*    Clicking on a broken or dead link.\
    \ \n\n*    The resource has been moved or deleted. \n\n  Handling    : On encountering\
    \ a 404 error, the server should ideally respond with a custom 404 error page\
    \ that informs the user that the requested resource could not be found and provide\
    \ navigation options to help them find the desired content. \n\n####  500 Internal\
    \ Server Error \n\n    D    EFINITION     : The 500 status code indicates that\
    \ the server encountered an unexpected condition that prevented it from fulfilling\
    \ the request.   This is a generic error message, given when no more specific\
    \ message is suitable.   It signals a server-side error. \n\n  Typical Causes\
    \    : \n\n*    Server misconfiguration. "
