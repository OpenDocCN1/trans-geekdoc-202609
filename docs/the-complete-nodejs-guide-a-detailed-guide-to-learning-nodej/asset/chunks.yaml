    \ => { \n  console.error(error); \n});\n```\n\n–––––––\n\n![image](img/scene_break.png)\n\
    \n![image](img/image022.png)\n\n在这个示例中，我们创建了一个新的 promise，它接收带有带有参数的函数：`resolve`\
    \ 和 `reject`。这些是 JavaScript 提供的处理 promise 结果的函数。如果满足条件，我们调用 `resolve` 并传递一个成功消息；否则，我们调用\
    \ `reject` 并传递一个错误消息。\n\n`.then()` 方法用于定义 promise 成功（fulfilled）时发生什么，而 `.catch()`\
    \ 则处理 promise 被拒绝（rejected）时的任何错误。\n\n![image](img/image196.png)\n\n## 高级 Promise\
    \ 用法\n\n随着学习的深入，你将经常需要处理多个异步操作。这正是 Promise 发挥异彩的地方，它允许你链式操作并高效地管理它们。\n\n### Promise\
    \ 链式调用 (Chaining Promises)\n\n```javascript\nconst fetchData = new Promise((resolve,\
    \ reject) => { \n  setTimeout(() => resolve(\"Data fetched\"), 1000); \n}); \n\
    \nconst processData = data => { \n  return new Promise((resolve, reject) => {\
    \ \n    setTimeout(() => resolve(`${data} and processed`), 1000); \n  }); \n};\
    \ \n\nfetchData \n  .then(data => { \n    console.log(data); // 输出: Data fetched\
    \ \n    return processData(data); \n  }) \n  .then(processedData => { \n    console.log(processedData);\
    \ // 输出: Data fetched and processed \n  }) \n  .catch(error => { \n    console.error(error);\
    \ \n  });\n```\n\n–––––––\n\n![image](img/scene_break.png)\n\n![image](img/image126.png)\n\
    \n在这里，我们链式使用了两个 promise：`fetchData` 和 `processData`。第二个 promise 只在第一个完成后才会开始，确保了异步任务的顺序执行。\n\
    \n### 用于并发执行的 Promise.all\n\n有时，你需要并发运行多个 promise 并等待它们全部完成。`Promise.all` 非常适合这种场景。\n\
    \n```javascript\nconst promise1 = new Promise((resolve, reject) => setTimeout(resolve,\
    \ 1000, 'First')); \n\nconst promise2 = new Promise((resolve, reject) => setTimeout(resolve,\
    \ 2000, 'Second')); \n\nconst promise3 = new Promise((resolve, reject) => setTimeout(resolve,\
    \ 3000, 'Third')); \n\nPromise.all([promise1, promise2, promise3]) \n  .then(results\
    \ => { \n    console.log(results); // 输出: ['First', 'Second', 'Third'] \n  })\
    \ \n  .catch(error => { \n    console.error(error); \n  });\n```\n\n–––––––\n\n\
    ![image](img/scene_break.png)\n\n![image](img/image106.png)\n\nPROMISE.ALL 接收一个\
    \ promise 数组并返回一个单一 promise，该 promise 在数组中的所有 promise 都已解析（resolved）后变为解析。如果其中任何一个\
    \ promise 被拒绝，它也会被拒绝。\n\n## Async/Await 简介\n\nASYNC/AWAIT 是构建在 promise 之上的语法糖，于\
    \ ES2017 (ES8) 中引入。它让异步代码看起来和行为上更像同步代码，提高了可读性和可维护性。\n\n### 创建 async 函数\n\n`async`\
    \ 函数返回一个 promise。在这个函数内部，你可以使用 `await` 关键字来等待 promise 解析或拒绝。\n\n```javascript\n\
    async function fetchData() { \n  try { \n    let response = await fetch('https://api.example.com/data');\n\
    \    let data = await response.json();\n    console.log(data);\n  } catch (error)\
    \ { \n    console.error(\"Error fetching data:\", error); \n  }\n}\n```\n\n###\
    \ 使用 Async/Await 进行错误处理\n\n在 async/await 中，我们使用 `try/catch` 块来处理错误。\n\n```javascript\n\
    async function fetchDataWithErrorHandling() {\n  try {\n    let response = await\
    \ fetch('https://api.example.com/data');\n    if (!response.ok {\n      throw\
    \ new Error('Network response was not ok');\n    }\n    let data = await response.json();\n\
    \    console.log(data);\n  } catch (error) {\n    console.error('Error fetching\
    \ data:', error);\n  }\n}\n```\n\n### 处理多个异步操作\n\n当你需要并发处理多个操作时，可以使用 `await Promise.all`。\n\
    \n```javascript\nasync function fetchMultipleData() {\n  try {\n    let [data1,\
    \ data2] = await Promise.all([\n      fetch('https://api.example.com/data1'),\n\
    \      fetch('https://api.example.com/data2')\n    ]);\n    console.log(data1,\
    \ data2);\n  } catch (error) {\n    console.error('Error fetching multiple data:',\
    \ error);\n  }\n}\n```\n\n"
