    \n–––––––––\n\n![image](d2d_images/scene_break.png)\n\n## 4.3 Routing\n\nROUTING\
    \ IS THE PROCESS of determining how an application responds to a client request\
    \ to a particular endpoint, which is a URI (or path) and a specific HTTP method\
    \ (GET, POST, etc.). In Node.js, routing can be implemented using the built-in\
    \ `http` module or, more commonly, using the `express` framework which provides\
    \ a more intuitive and powerful routing mechanism.\n\n### Basic Routing with HTTP\
    \ Module\n\nThe `http` module provides the basic functionalities to set up routing.\
    \ However, this method can become cumbersome for larger applications.\n\n![image](d2d_images/image041.png)\n\
    \nExample using HTTP Module:\n\n```javascript\nconst http = require('http');\n\
    const url = require('url');\nconst server = http.createServer((req, res) => {\n\
    \  const parsedUrl = url.parse(req.url, true);\n  const pathname = parsedUrl.pathname;\n\
    \n  if (req.method === 'GET' && pathname === '/') {\n    res.statusCode = 200;\n\
    \    res.setHeader('Content-Type', 'text/plain');\n    res.end('Home Page');\n\
    \  } else if (req.method === 'GET' && pathname === '/about') {\n    res.statusCode\
    \ = 200;\n    res.setHeader('Content-Type', 'text/plain');\n    res.end('About\
    \ Page');\n  } else {\n    res.statusCode = 404;\n    res.setHeader('Content-Type',\
    \ 'text/plain');\n    res.end('404 Not Found');\n  }\n});\n\nconst PORT = 3000;\n\
    server.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\nExplanation:\n\n* The `url` module is used to parse the URL and extract\
    \ the `pathname`.\n* Different responses are sent based on the request method\
    \ and `pathname`.\n\n### Advanced Routing with Express\n\nEXPRESS IS A WEB APPLICATION\
    \ framework for Node.js that simplifies routing and provides a wide range of features\
    \ for building web and mobile applications.\n\nInstalling Express:\n\n```bash\n\
    npm install express\n```\n\nBasic Routing with Express:\n\n```javascript\nconst\
    \ express = require('express');\nconst app = express();\n\napp.get('/', (req,\
    \ res) => {\n  res.send('Home Page');\n});\n\napp.get('/about', (req, res) =>\
    \ {\n  res.send('About Page');\n});\n\napp.get('/users/:id', (req, res) => {\n\
    \  const userId = req.params.id;\n  res.send(`User ID: ${userId}`);\n});\n\napp.use((req,\
    \ res, next) => {\n  res.status(404).send('404 Not Found');\n});\n\nconst PORT\
    \ = 3000;\napp.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n–––––––––\n\n![image](d2d_images/scene_break.png)\n\n![image](d2d_images/image215.png)\n\
    \nEXPLANATION:\n\n* `app.get('/')`: Defines a route for GET requests to the root\
    \ URL.\n* `app.get('/about')`: Defines a route for GET requests to the `/about`\
    \ URL.\n* `app.get('/users/:id')`: Defines a route for GET requests to `/users/:id`,\
    \ where `:id` is a route parameter.\n* `app.use((req, res, next) => {...})`: Middleware\
    \ to handle 404 errors for any unmatched routes.\n\n### Using Path Parameters\n\
    \nPATH PARAMETERS ARE used to capture values specified at certain positions in\
    \ the URL.\n\nExample with Path Parameters:\n\n```javascript\napp.get('/users/:id/books/:bookId',\
    \ (req, res) => {\n  const userId = req.params.id;\n  const bookId = req.params.bookId;\n\
    \  res.send(`User ID: ${userId}, Book ID: ${bookId}`);\n});\n```\n\n–––––––––\n\
    \n![image](d2d_images/scene_break.png)\n\nEXPLANATION:\n\n* `:id` and `:bookId`\
    \ are placeholders for path parameters.\n* `req.params` is used to access these\
    \ parameters.\n\n### Using Query Parameters\n\nQUERY PARAMETERS ARE used to pass\
    \ additional data to the server as key-value pairs in the URL.\n\nExample with\
    \ Query Parameters:\n\n```javascript\napp.get('/search', (req, res) => {\n  const\
    \ query = req.query;\n  res.send(`Search Query: ${query}`);\n});\n```\n\nExplanation:\n\
    \n* Query parameters are accessed using `req.query`.\n* In this example, `req.query`\
    \ retrieves the value of the query parameter.\n\n### Handling HTTP Methods\n\n\
    EXPRESS MAKES IT EASY to handle different methods for the same route.\n\nExample:\n\
    \n```javascript\napp.route('/resource')\n  .get((req, res) => {\n    res.send('GET\
    \ request to /resource');\n  })\n  .post((req, res) => {\n    res.send('POST request\
    \ to /resource');\n  })\n  .put((req, res) => {\n    res.send('PUT request to\
    \ /resource');\n  })\n  .delete((req, res) => {\n    res.send('DELETE request\
    \ to /resource');\n  });\n```\n\nExplanation:\n\n* `app.route('/resource')`: Chaining\
    \ route handlers for the same route.\n* Different handlers are defined for GET,\
    \ POST, PUT, and DELETE requests.\n\n### Using Middleware for Routing\n\nMIDDLEWARE\
    \ FUNCTIONS are functions that have access to the request object (`req`), the\
    \ response object (`res`), and the next middleware function in the application’s\
    \ request-response cycle.\n\nExample:\n\n```javascript\napp.use((req, res, next)\
    \ => {\n  console.log(`Request Method: ${req.method}, Request URL: ${req.url}`);\n\
    \  next();\n});\n\napp.get('/', (req, res) => {\n  res.send('Home Page');\n});\n\
    \napp.get('/about', (req, res) => {\n  res.send('About Page');\n});\n```\n\n*\
    \ Middleware logs the request method and URL for every request.\n* `next()` passes\
    \ control to the next middleware function.\n\n![image](d2d_images/image064.png)\n\
    \n## 4.4 Serving Static Files\n\nSERVING STATIC FILES (such as HTML, CSS, JavaScript,\
