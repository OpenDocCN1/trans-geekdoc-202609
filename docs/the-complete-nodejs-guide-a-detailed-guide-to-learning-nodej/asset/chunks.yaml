  trans: "\n\n### 第 5 步：创建身份验证中间件\n\n`MIDDLEWARES/AUTH.JS` :\n\n```javascript\nconst\
    \ jwt = require('jsonwebtoken');\n\nconst users = require('../models/user');\n\
    \nconst SECRET_KEY = 'your_secret_key';\n\nconst authMiddleware = (req, res, next)\
    \ => {\n  const token = req.headers.authorization.split(' ')[1];\n\n  if (!token)\
    \ {\n    return res.status(401).json({ message: 'No token provided' });\n  }\n\
    \n  try {\n    const decoded = jwt.verify(token, SECRET_KEY);\n    const user\
    \ = users.find(u => u.id === decoded.id);\n    if (!user) {\n      return res.status(403).json({\
    \ message: 'Forbidden' });\n    }\n    req.user = user;\n    next();\n  } catch\
    \ (error) {\n    res.status(401).json({ message: 'Invalid token' });\n  }\n};\n\
    \nmodule.exports = authMiddleware;\n```\n\n### 第 6 步：在主应用程序文件中整合一切\n\n`APP.JS`\
    \ :\n\n```javascript\nconst express = require('express');\n\nconst bodyParser\
    \ = require('body-parser');\nconst http = require('http');\nconst authRoutes =\
    \ require('./routes/auth');\n\nconst chatHandler = require('./routes/chat');\n\
    \nconst authMiddleware = require('./middlewares/auth');\n\nconst app = express();\n\
    \napp.use(bodyParser.json());\n\n// 身份验证路由\napp.use('/auth', authRoutes);\n\n\
    // 受保护的路由示例\napp.get('/protected', authMiddleware, (req, res) => {\n  res.json({\
    \ message: 'Access granted', user: req.user.username });\n});\n\nconst server\
    \ = http.createServer(app);\n\n// WebSocket 聊天处理器\nchatHandler(server);\n\nconst\
    \ PORT = process.env.PORT || 3000;\n\nserver.listen(PORT, () => {\n  console.log(`Server\
    \ running on port ${PORT}`);\n});\n```\n\n### 第 7 步：创建一个简单的客户端\n\n创建一个基础 HTML\
    \ 文件来测试聊天应用程序。\n\n`public/index.html` :\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Chat Application</title>\n\
    \  <script>\n    let ws;\n    function login() {\n      const username = document.getElementById('username').value;\n\
    \      const password = document.getElementById('password').value;\n      fetch('/auth/login',\
    \ {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json'\
    \ },\n        body: JSON.stringify({ username, password })\n      }).then(response\
    \ => response.json())\n      .then(data => {\n        if (data.token) {\n    \
    \      ws = new WebSocket(`ws://localhost:3000?token=${data.token}`);\n      \
    \    ws.onmessage = (event) => {\n            const msg = JSON.parse(event.data);\n\
    \            const chat = document.getElementById('chat');\n            chat.innerHTML\
    \ += `<p><strong>${msg.user}:</strong> ${msg.message} <em>${msg.timestamp}</em></p>`;\n\
    \          };\n        } else {\n          alert('Login failed');\n        }\n\
    \      });\n    }\n\n    function sendMessage() {\n      const message = document.getElementById('message').value;\n\
    \      ws.send(JSON.stringify({ message }));\n      document.getElementById('message').value\
    \ = '';\n    }\n  </script>\n</head>\n<body>\n  <div>\n    <h1>Login</h1>\n  \
    \  <input type=\"text\" id=\"username\" placeholder=\"Username\">\n    <input\
    \ type=\"password\" id=\"password\" placeholder=\"Password\">\n    <button onclick=\"\
    login()\">Login</button>\n  </div>\n  <div>\n    <h1>Chat</h1>\n    <div id=\"\
    chat\"></div>\n    <input type=\"text\" id=\"message\" placeholder=\"Type a message\"\
    >\n    <button onclick=\"sendMessage()\">Send</button>\n  </div>\n</body>\n</html>\n\
    ```\n\n- 打开聊天客户端：\n  - 打开您的浏览器并导航到 `http://localhost:3000` 以访问聊天客户端。\n- 测试应用程序：\n\
    \  - 使用示例用户之一（`user1/password1` 或 `user2/password2`）登录。\n  - 开始发送消息并查看它们如何实时显示。\n\
    \n![image](img/image039.png)\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ | | | ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | ---\
    \ | --- |\n\n![image](img/chapter_title_corner_decoration_left.png)\n\n# 第 5 步：创建身份验证中间件\n\
    \n![image](img/chapter_title_corner_decoration_right.png)\n\n# 第 6 步：在主应用程序文件中整合一切\n\
    \n# 第 7 步：创建一个简单的客户端\n\n![image](img/image150.png)\n\n## 6. Node.js 数据库简介\n\n\
    数据库是 Web 应用的基础组件，能够实现数据的存储、检索和管理。Node.js 主要使用两种类型的数据库：SQL 和 NoSQL。每种类型都有其自身的优势和适用场景，我们将在本节中进行探索。\n\
    \n### 6.1 SQL 数据库也称为关系型数据库，在预定义的架构中存储数据。这些表以行和列的形式结构化，每行代表一条记录，每列代表一个数据属性。SQL\
    \ 数据库使用结构查询语言（SQL）来定义、操作和查询数据。SQL 数据库包括 MySQL、PostgreSQL、SQLite 和 Microsoft SQL\
    \ Server。SQL 数据库的主要优势之一是处理复杂查询和事务的能力。它们通过约束和表之间的关系维护数据完整性。\n\n另一方面，NoSQL 数据库旨在处理各种数据模型，包括文档、键值、列族和图格式。这些数据库以其灵活性、可扩展性和性能闻名。NoSQL\
    \ 数据库包括 MongoDB、Redis、Cassandra 和 Couchbase。与 SQL 数据库不同，NoSQL 数据库不需要固定架构，允许数据结构动态变化。这种灵活性使其适用于具有大量非结构化或半结构化数据的应用程序，例如社交平台、实时分析和内容管理系统。在\
    \ Node.js 中，可以使用针对特定类型的模块和库与数据库交互。对于 SQL 数据库，流行的模块包括用于 MySQL 的 `mysql` 和用于 PostgreSQL\
    \ 的 `pg`。这些模块提供了建立连接、执行查询和管理事务的方法。对于 NoSQL 数据库，常用的模块包括用于 MongoDB 的 `mongodb` 和用于\
    \ Redis 的 `redis`。这些模块促进了插入、更新和检索数据的操作，以及索引和集合的管理。\n\n科学原理支撑着数据库的设计和运行，确保它们能够高效地存储和检索数据，同时维护完整性和性能。一种原理是\
    \ `ACID` 合规性，代表原子性、一致性、隔离性和持久性。ACID 属性对于确保 SQL 数据库事务可靠处理至关重要。原子性保证事务中的所有操作要么成功完成，要么都不执行。一致性确保事务从一个有效状态变为另一个有效状态。隔离性防止并发事务相互干扰，持久性确保一旦事务提交，即使在系统故障的情况下也能保持持久。\n\
    \n![image](img/image207.png)\n\n![image](img/image199.png)\n\n"
- fmt: "\nNoSQL databases, while often prioritizing scalability and performance, may\
    \ adopt different consistency models, such as eventual consistency. Eventual consistency\
    \ is a consistency model used in distributed systems where updates to a database\
    \ will propagate and eventually all nodes will converge to the same value. This\
    \ model is particularly useful for systems that require high availability and\
    \ partition tolerance, as described by the CAP theorem. The CAP theorem states\
    \ that a distributed data store can only achieve two out of three guarantees:\
    \ Consistency, Availability, and Partition tolerance. NoSQL databases often trade\
    \ off strict consistency for better availability and partition tolerance, making\
    \ them suitable for applications with high read and write loads.\n\n![image](d2d_images/image138.png)\n\
    \n## 6.2. Working with SQL Databases (MySQL)\n\nSQL DATABASES ARE a cornerstone\
    \ of data management in many web applications, and MySQL is one of the most popular\
    \ SQL database management systems. Known for its reliability, performance, and\
    \ ease of use, MySQL is used by organizations of all sizes, from small startups\
    \ to large enterprises. This section will explore how to work with MySQL in a\
    \ Node.js environment, including setting up the database, establishing connections,\
    \ performing CRUD operations, and understanding advanced features like transactions\
    \ and indexing.\n\n### Setting Up MySQL\n\nBEFORE WORKING WITH MySQL in Node.js,\
    \ you need to install and configure MySQL on your system. You can download MySQL\
    \ from the official website and follow the installation instructions for your\
    \ operating system. Once installed, you can start the MySQL server and use the\
    \ MySQL command-line client or a graphical tool like MySQL Workbench to manage\
    \ your databases.\n\n![image](d2d_images/image159.png)\n\n### Installing MySQL\
    \ Module for Node.js\n\nTO INTERACT WITH MYSQL from a Node.js application, you\
    \ need to install the `mysql` module. This module provides methods to connect\
    \ to a MySQL database, execute queries, and manage connections.\n\n```bash\nnpm\
    \ install mysql\n```\n\n### Establishing a Connection\n\nESTABLISHING A CONNECTION\
    \ to a MySQL database involves creating a connection object with the necessary\
    \ configuration details such as host, user, password, and database name. Here's\
    \ an example of how to establish a connection:\n\n```javascript\nconst mysql =\
    \ require('mysql');\n\nconst connection = mysql.createConnection({\n  host: 'localhost',\n\
    \  user: 'root',\n  password: 'password',\n  database: 'my_database'\n});\n\n\
    connection.connect((err) => {\n  if (err) {\n    console.error('Error connecting\
    \ to MySQL:', err);\n    return;\n  }\n  console.log('Connected to MySQL');\n\
    });\n```\n\n### Performing CRUD Operations\n\nCRUD OPERATIONS (CREATE, Read, Update,\
    \ Delete) are the fundamental operations for interacting with a database. Let's\
    \ look at how to perform these operations using the `mysql` module in Node.js.\n\
    \n#### Creating (Inserting) Data\n\nTo insert data into a table, you can use the\
    \ `INSERT INTO` SQL statement. Here’s an example of inserting a new user into\
    \ the `users` table:\n\n```javascript\nconst user = { username: 'johndoe', password:\
    \ 'securepassword' };\nconst query = 'INSERT INTO users SET ?';\n\nconnection.query(query,\
    \ user, (err, results) => {\n  if (err) throw err;\n  console.log('User added\
    \ with ID:', results.insertId);\n});\n```\n\n#### Reading (Selecting) Data\n\n\
    To retrieve data from a table, you can use the `SELECT` SQL statement. Here’s\
    \ an example of selecting all users from the `users` table:\n\n```javascript\n\
    const query = 'SELECT * FROM users';\n\nconnection.query(query, (err, results)\
    \ => {\n  if (err) throw err;\n  console.log('User data:', results);\n});\n```\n\
    \n#### Updating Data\n\nTo update existing data in a table, you can use the `UPDATE`\
    \ SQL statement. Here’s an example of updating a user’s password:\n\n```javascript\n\
    const userId = 1;\nconst newPassword = 'newsecurepassword';\nconst query = 'UPDATE\
    \ users SET password = ? WHERE id = ?';\n\nconnection.query(query, [newPassword,\
    \ userId], (err, results) => {\n  if (err) throw err;\n  console.log('Changed\
    \ rows:', results.changedRows);\n});\n```\n\n#### Deleting Data\n\nTo delete data\
    \ from a table, you can use the `DELETE` SQL statement. Here’s an example of deleting\
    \ a user from the table:\n\n```javascript\nconst userId = 1;\nconst query = 'DELETE\
    \ FROM users WHERE id = ?';\n\nconnection.query(query, [userId], (err, results)\
    \ => {\n  if (err) throw err;\n  console.log('Deleted rows:', results.affectedRows);\n\
    });\n```\n\n### Advanced Features\n\n#### Transactions\n\nTransactions are a sequence\
    \ of one or more operations executed as a single unit. They ensure data integrity\
    \ and consistency, especially in cases where multiple operations depend on each\
    \ other. To perform transactions in MySQL, you can use `BEGIN`, `COMMIT`, and\
    \ `ROLLBACK` SQL statements. Here’s an example of a transaction:\n\n```javascript\n\
    connection.beginTransaction((err) => {\n  if (err) {\n    throw err;\n  }\n\n\
    \  const query1 = 'INSERT INTO accounts SET ?';\n  const account1 = { user_id:\
    \ 1, balance: 100 };\n\n  connection.query(query1, account1, (err, results) =>\
    \ {\n    if (err) {\n      return connection.rollback(() => {\n        throw err;\n\
    \      });\n    }\n\n    const query2 = 'INSERT INTO accounts SET ?';\n    const\
    \ account2 = { user_id: 2, balance: 200 };\n\n    connection.query(query2, account2,\
    \ (err, results) => {\n      if (err) {\n        return connection.rollback(()\
    \ => {\n          throw err;\n        });\n      }\n\n      connection.commit((err)\
    \ => {\n        if (err) {\n          return connection.rollback(() => {\n   \
    \         throw err;\n          });\n        }\n        console.log('Transaction\
    \ Complete.');\n      });\n    });\n  });\n});\n```\n\n#### Indexing\n\nIndexes\
    \ improve the speed of data retrieval operations on a database table. They are\
    \ particularly useful for columns that are frequently used in search conditions\
    \ (`WHERE` clauses) or join conditions.\n\nCreating an index on a column involves\
    \ using the `CREATE INDEX` SQL statement. Here’s an example of creating an index\
    \ on the `username` column in the `users` table:\n\n```javascript\nconst query\
    \ = 'CREATE INDEX idx_username ON users(username)';\n\nconnection.query(query,\
    \ (err, results) => {\n  if (err) throw err;\n  console.log('Index created:',\
    \ results);\n});\n```\n"
