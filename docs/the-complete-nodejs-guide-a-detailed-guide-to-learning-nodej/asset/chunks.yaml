    \ deleting file:', err);\n  }\n  console.log('File deleted successfully');\n});\n\
    \nconsole.log('Deleting file...');\n```\n\n![image](d2d_images/image118.png)\n\
    ![image](d2d_images/image084.png)\n\nIn this example:\n`fs.unlink('example.txt',\
    \ callback)` deletes `example.txt` asynchronously.\nThe callback function handles\
    \ any errors.\nThe message 'Deleting file...' is logged immediately, demonstrating\
    \ non-blocking behavior.\n\n### Watching Files for Changes\n\nNODE.JS CAN WATCH\
    \ changes in a file or directory, which is useful for implementing features like\
    \ live reloads.\n\nExample: Watching a File\n\n```javascript\nconst fs = require('fs');\n\
    \nfs.watch('example.txt', (eventType, filename) => {\n  if (filename) {\n    console.log(`${filename}\
    \ has been modified`);\n  }\n});\n```\n\nIn this example:\n`fs.watch('example.txt',\
    \ callback)` watches `example.txt` for changes.\nThe callback function logs a\
    \ message whenever the file is modified.\nThe message 'Watching file...' is logged\
    \ immediately.\n\n![image](d2d_images/image087.png)\n![image](d2d_images/image227.png)\n\
    \nReading and writing files in Node.js is made simple and efficient by the `fs`\
    \ module. Whether you choose synchronous or asynchronous depends on the specific\
    \ needs of your application. Synchronous methods are straightforward but can block\
    \ the event loop, while asynchronous methods are non-blocking and better suited\
    \ for performance-critical applications. By understanding and leveraging these\
    \ capabilities, you can handle file operations in your Node.js projects.\n\n##\
    \ 3.2 Working with Directories\n\nDIRECTORIES ARE ESSENTIAL for organizing files\
    \ within a file system. Node.js provides a robust set of methods through the `fs`\
    \ module to create, read, and delete directories. Understanding how to work with\
    \ directories is crucial for managing your application's structure.\n\n### Creating\
    \ Directories\n\nTO CREATE DIRECTORIES, Node.js offers both synchronous and asynchronous\
    \ methods.\n\n#### Synchronous Directory Creation\n\nEXAMPLE: SYNCHRONOUS Directory\
    \ Creation\n\n```javascript\nconst fs = require('fs');\n\ntry {\n  if (!fs.existsSync('new-directory'))\
    \ {\n    fs.mkdirSync('new-directory');\n    console.log('Directory created successfully');\n\
    \  } else {\n    console.log('Directory already exists');\n  }\n} catch (err)\
    \ {\n  console.error('Error creating directory:', err);\n}\n```\n\nIn this example:\n\
    `fs.existsSync('new-directory')` checks if the directory already exists.\n`fs.mkdirSync('new-directory')`\
    \ creates the directory if it doesn't.\nErrors are caught and logged to the console.\n\
    \n#### Asynchronous Directory Creation\n\nEXAMPLE: ASYNCHRONOUS Directory Creation\n\
    \n```javascript\nconst fs = require('fs');\n\nfs.mkdir('new-directory', (err)\
    \ => {\n  if (err) {\n    return console.error('Error creating directory:', err);\n\
    \  }\n  console.log('Directory created successfully');\n});\n\nconsole.log('Creating\
    \ directory...');\n```\n\n![image](d2d_images/image010.png)\n\nIn this example:\n\
    `fs.mkdir('new-directory', callback)` creates the directory asynchronously.\n\
    The callback function handles any errors.\nThe message 'Creating directory...'\
    \ is logged immediately, demonstrating non-blocking behavior.\n\n![image](d2d_images/image139.png)\n\
    \n### Reading Directories\n\nREADING THE CONTENTS of a directory can be done synchronously\
    \ or asynchronously to list files and subdirectories.\n\n#### Synchronous Directory\
    \ Reading\n\nEXAMPLE: SYNCHRONOUS Directory Reading\n\n```javascript\nconst fs\
    \ = require('fs');\n\ntry {\n  const files = fs.readdirSync('.');\n  console.log('Files\
    \ in directory:');\n  files.forEach(file => {\n    console.log(file);\n  });\n\
    } catch (err) {\n  console.error('Error reading directory:', err);\n}\n```\n\n\
    In this example:\n* `fs.readdirSync('.')` reads the contents of the current directory\
    \ synchronously.\n* The contents are logged to the console.\n\n#### Asynchronous\
    \ Directory Reading\n\nEXAMPLE: ASYNCHRONOUS Directory Reading\n\n```javascript\n\
    const fs = require('fs');\n\nfs.readdir('.', (err, files) => {\n  if (err) {\n\
    \    return console.error('Error reading directory:', err);\n  }\n  console.log('Files\
    \ in directory:');\n  files.forEach(file => {\n    console.log(file);\n  });\n\
    });\n\nconsole.log('Reading directory...');\n```\n\nIn this example:\n* `fs.readdir('.',\
    \ callback)` reads the contents of the current directory asynchronously.\n* The\
    \ callback function handles the file list and any errors.\n* The message 'Reading\
    \ directory...' is logged immediately, demonstrating non-blocking behavior.\n\n\
    ![image](d2d_images/image035.png)\n\n### Deleting Directories\n\nTO DELETE DIRECTORIES,\
    \ you can use both synchronous and asynchronous methods.\n\n#### Synchronous Directory\
    \ Deletion\n\nEXAMPLE: SYNCHRONOUS Directory Deletion\n\n```javascript\nconst\
    \ fs = require('fs');\n\ntry {\n  if (fs.existsSync('new-directory')) {\n    fs.rmdirSync('new-directory');\n\
    \    console.log('Directory deleted successfully');\n  } else {\n    console.log('Directory\
    \ does not exist');\n  }\n} catch (err) {\n  console.error('Error deleting directory:',\
    \ err);\n}\n```\n\nIn this example:\n"
