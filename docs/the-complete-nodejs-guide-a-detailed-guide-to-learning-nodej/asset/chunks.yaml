    \n##  ​   4.1.   Creating a Simple Web Server \n\n   C    REATING A SIMPLE WEB\
    \    server in Node.js is an essential step in understanding how server-side applications\
    \ work.   Node.js's built-in    http    module provides all the necessary functionality\
    \ to set up a basic web server.   This section will guide you through the process\
    \ of creating a simple web server, explaining each part in detail. \n\n Step 1:\
    \ Import the HTTP Module \n\n First, you need to import the    http    module.\
    \   This module provides the    createServer    method that will be used to create\
    \ the web server. \n\n const http =    require    ('http'); \n\n Step 2: Create\
    \ the Server \n\n Use the    createServer    method to create the server.   This\
    \ method takes a callback function that will be executed every time the server\
    \ receives a request.   The callback function has two parameters:    req    (the\
    \ request object) and    res    (the response object). \n\n const server = http.\
    \    createServer    ((req, res) => { \n\n res.statusCode = 200; // Set the response\
    \ status code to 200 (OK) \n\n res.    setHeader    ('Content-Type', 'text/plain');\
    \ // Set the response header \n\n res.    end    ('Hello, World!\\\\n'); // Send\
    \ the response body \n\n }); \n\n Step 3: Listen on a Port \n\n Tell the server\
    \ to listen on a specific port.   Commonly used ports for development are 3000,\
    \ 8080, and 5000. \n\n const PORT = 3000; \n\n server.    listen    (PORT, ()\
    \ => { \n\n console.    log    (\\`Server running at http://localhost:${PORT}/\\\
    `); \n\n }); \n\n Complete Example \n\n const http =    require    ('http'); \n\
    \n const server = http.    createServer    ((req, res) => { \n\n res.statusCode\
    \ = 200; \n\n res.    setHeader    ('Content-Type', 'text/plain'); \n\n res. \
    \   end    ('Hello, World!\\\\n'); \n\n }); \n\n const PORT = 3000; \n\n server.\
    \    listen    (PORT, () => { \n\n console.    log    (\\`Server running at http://localhost:${PORT}/\\\
    `); \n\n }); \n\n –––––––– \n\n ![image](d2d_images/scene_break.png) \n\n   \
    \        Importing the HTTP Module    : The    http    module is part of Node.js's\
    \ core modules, which means you don't need to install anything extra to use it.\
    \ \n\n     Creating the Server    : The    http.createServer    method creates\
    \ a new server instance.   The callback function handles incoming requests and\
    \ sends responses. \n\n     Setting the Status Code and Headers    :    res.statusCode\
    \    sets the HTTP status code of the response.    res.setHeader    sets the HTTP\
    \ headers.   In this case, we're setting the    Content-Type    header to    text/plain\
    \    . \n\n     Sending the Response    :    res.end    ends the response process.\
    \   The argument passed to    res.end    is sent as the response body. \n\n \
    \    Listening on a Port    :    server.listen    makes the server start listening\
    \ for incoming requests on the specified port.   The callback function logs a\
    \ message when the server starts successfully. \n\n Open your web browser and\
    \ navigate to    http://localhost:3000    .   You should see \"Hello, World!\"\
    \   displayed on the page. \n\n –––––––– \n\n ![image](d2d_images/scene_break.png)\
    \ \n\n ![image](d2d_images/image070.png)\n\n####  Expanding the Basic Server \n\
    \n   O    NCE YOU HAVE A BASIC    server running, you can expand its functionality\
    \ to handle more complex tasks. \n\n Handling Different URLs \n\n You can modify\
    \ the server to respond differently based on the requested URL. \n\n const http\
    \ =    require    ('http'); \n\n const server = http.    createServer    ((req,\
    \ res) => { \n\n res.statusCode = 200; \n\n res.    setHeader    ('Content-Type',\
    \ 'text/plain'); \n\n if (req.url === '/') { \n\n res.    end    ('Hello, World!\\\
    \\n'); \n\n } else if (req.url === '/about') { \n\n res.    end    ('About Us\\\
    \\n'); \n\n } else { \n\n res.statusCode = 404; \n\n res.    end    ('Not Found\\\
    \\n'); \n\n } \n\n }); \n\n const PORT = 3000; \n\n server.    listen    (PORT,\
    \ () => { \n\n console.    log    (\\`Server running at http://localhost:${PORT}/\\\
    `); \n\n }); \n\n Serving HTML Content \n\n You can serve HTML content instead\
    \ of plain text by setting the    Content-Type    to    text/html    . \n\n const\
    \ http =    require    ('http'); \n\n const server = http.    createServer   \
    \ ((req, res) => { \n\n res.statusCode = 200; \n\n res.    setHeader    ('Content-Type',\
    \ 'text/html'); \n\n res.    end    ('<h1>Hello, World!</h1>\\\\n'); \n\n });\
    \ \n\n const PORT = 3000; \n\n server.    listen    (PORT, () => { \n\n console.\
    \    log    (\\`Server running at http://localhost:${PORT}/\\`); \n\n }); \n\n\
    \ Creating a simple web server in Node.js is a foundational skill for web development "
