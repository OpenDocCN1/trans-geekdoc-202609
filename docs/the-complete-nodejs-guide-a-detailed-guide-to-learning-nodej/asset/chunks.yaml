    \   Text Data    : \n\n app.use(bodyParser.text()); \n\n  Example    : \n\n This is plain text data\
    \ \n\n####  Customizing Body-Parser \n\n   B    ODY-PARSER PROVIDES    options\
    \ to customize its behavior.   For instance, you can limit the size of the request\
    \ body to prevent abuse, or you can configure the extended option for URL-encoded\
    \ data. \n\n  Example with Custom Options    : \n\n const    express    =    require\
    \    ('express'); \n\n const bodyParser =    require    ('body-parser'); \n\n\
    \ const app =    express    (); \n\n // Use Body-Parser with custom options \n\
    \n app.    use    (bodyParser.    json    ({ limit: '10mb' })); \n\n app.    use\
    \    (bodyParser.    urlencoded    ({ extended: false, limit: '10mb' })); \n\n\
    \ app.    post    ('/submit', (req, res) => { \n\n const { name, email } = req.body;\
    \ \n\n res.    send    (\\`Received name: ${name}, email: ${email}\\`); \n\n });\
    \ \n\n const PORT = 3000; \n\n app.    listen    (PORT, () => { \n\n console.\
    \    log    (\\`Server running at http://localhost:${PORT}/\\`); \n\n }); \n\n\
    \     Limit Option    : The    limit    option restricts the maximum size of\
    \ the request body to 10MB. \n\n     Extended Option    : The    extended   \
    \ option determines whether to use the querystring library (when    false    )\
    \ or the qs library (when    true    ) for parsing URL-encoded data. \n\n ![image](d2d_images/image003.png)\n\
    \n###  Helmet \n\n####  What is Helmet? \n\n   H    ELMET IS A SECURITY    -focused\
    \ middleware for Express.js that helps secure your application by setting various\
    \ HTTP headers.   It aims to protect your app from some well-known web vulnerabilities\
    \ by configuring appropriate HTTP headers.   These vulnerabilities include cross-site\
    \ scripting (XSS), clickjacking, and other common attacks that can be mitigated\
    \ by setting the correct headers. \n\n####  Why Use Helmet? \n\n*     Security\
    \     : Provides a straightforward way to secure your application by setting HTTP\
    \ headers.  \n\n*     Simplicity     : Easy to implement and configure.  \n\n\
    *     Comprehensive     : Covers various aspects of security by enabling multiple\
    \ security-related headers.  \n\n*     Customization     : Allows you to configure\
    \ each header individually to suit your specific security needs.  \n\n####  Installing\
    \ Helmet \n\n   T    O USE HELMET IN YOUR    Node.js application, you first need\
    \ to install it using npm: \n\n npm install helmet \n\n####  Basic Usage of Helmet\
    \ \n\n   H    ERE’S A BASIC EXAMPLE    of how to use Helmet in an Express application:\
    \ \n\n1.    Set Up an Express Application    : \n\n const    express    =    require\
    \    ('express'); \n\n const helmet =    require    ('helmet'); \n\n const app\
    \ =    express    (); \n\n // Use Helmet to secure the app by setting various\
    \ HTTP headers \n\n app.    use    (    helmet    ()); \n\n // Define a simple\
    \ route \n\n app.    get    ('/', (req, res) => { \n\n res.    send    ('Hello,\
    \ secure world!'); \n\n }); \n\n const PORT = 3000; \n\n app.    listen    (PORT,\
    \ () => { \n\n console.    log    (\\`Server running at http://localhost:${PORT}/\\\
    `); \n\n }); \n\n     Import Express and Helmet    : We require both the    express\
    \    and    helmet    modules. \n\n     Use Helmet Middleware    : The    app.use(helmet())\
    \    line integrates Helmet into our application, automatically setting various\
    \ HTTP headers for enhanced security. \n\n     Define a Route    : We define\
    \ a simple route that responds with \"Hello, secure world!\"   when accessed.\
    \ \n\n   Open your browser or use a tool like Postman to navigate to    http://localhost:3000\
    \    . \n\n   Check the response headers to see the security headers added by\
    \ Helmet. \n\n ![image](d2d_images/image220.png)\n\n ![image](d2d_images/image112.png)\n\
    \n####  Headers Set by Helmet \n\n   H    ELMET SETS A VARIETY    of HTTP headers\
    \ to help secure your application.   Some of the key headers include: \n\n*  \
    \   Content-Security-Policy (CSP)     : Helps prevent XSS attacks by controlling\
    \ the sources from which content can be loaded.  \n\n*     X-DNS-Prefetch-Control\
    \     : Controls DNS prefetching, which can improve privacy.  \n\n*     Expect-CT\
    \     : Helps detect and prevent the use of misissued SSL certificates.  "
