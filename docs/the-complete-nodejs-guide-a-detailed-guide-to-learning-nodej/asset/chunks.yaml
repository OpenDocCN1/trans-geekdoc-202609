    \ => { \n\n console.    log    (\\`${username} joined the chat.\\`); \n\n });\
    \ \n\n chat.    on    ('message', (username, message) => { \n\n console.    log\
    \    (\\`${username}: ${message}\\`); \n\n }); \n\n chat.    on    ('leave', (username)\
    \ => { \n\n console.    log    (\\`${username} left the chat.\\`); \n\n }); \n\
    \n // Simulate user actions \n\n chat.    join    ('Alice'); \n\n chat.    sendMessage\
    \    ('Alice', 'Hello, everyone!'); \n\n chat.    leave    ('Alice'); \n\n chat.\
    \    join    ('Bob'); \n\n chat.    sendMessage    ('Bob', 'Hey Alice, where did\
    \ you go?'); \n\n chat.    leave    ('Bob'); \n\n In this file, we: \n\n1.   Import\
    \ the    Chat    module. \n\n2.   Create an instance of the    Chat    class.\
    \ \n\n3.   Register listeners for the 'join', 'message', and 'leave' events. \n\
    \n4.   Simulate user actions by calling the    join    ,    sendMessage    , and\
    \    leave    methods on the    Chat    instance. \n\n When you run this script,\
    \ you will see the following output: \n\n ![image](d2d_images/image186.png)\n\n\
    \ ![image](d2d_images/image124.png)\n\n####  Step 4: Enhancing the Chat Module\
    \ \n\n   L    ET'S ENHANCE OUR CHAT    application by adding a few more features:\
    \ \n\n*     Logging     : Log all events to a file.  \n\n*     Broadcasting  \
    \   : Broadcast messages to all connected users.  \n\n Enhanced chat.js: \n\n\
    \ const EventEmitter =    require    ('events'); \n\n const fs =    require  \
    \  ('fs'); \n\n class Chat extends EventEmitter { \n\n  constructor    () { \n\
    \n  super    (); \n\n this.users = \\[\\]; \n\n this.logStream = fs.    createWriteStream\
    \    ('chat.log', { flags: 'a' }); \n\n } \n\n  join    (username) { \n\n this.users.\
    \    push    (username); \n\n this.    emit    ('join', username); \n\n this.\
    \    logEvent    ('join', username); \n\n } \n\n  sendMessage    (username, message)\
    \ { \n\n this.    emit    ('message', username, message); \n\n this.    logEvent\
    \    ('message', username, message); \n\n this.    broadcast    (username, message);\
    \ \n\n } \n\n  leave    (username) { \n\n this.users = this.users.    filter \
    \   (user => user !== username); \n\n this.    emit    ('leave', username); \n\
    \n this.    logEvent    ('leave', username); \n\n } \n\n  logEvent    (event,\
    \ username, message = '') { \n\n const logMessage = \\`\\[${new Date().    toISOString\
    \    ()}\\] ${event.    toUpperCase    ()}: ${username} ${message}\\\\n\\`; \n\
    \n this.logStream.    write    (logMessage); \n\n } \n\n  broadcast    (username,\
    \ message) { \n\n this.users.    forEach    (user => { \n\n if (user !== username)\
    \ { \n\n this.    emit    ('broadcast', user, message); \n\n } \n\n }); \n\n }\
    \ \n\n } \n\n module.exports = Chat; \n\n In this enhanced version: \n\n1.   \
    \ Logging    : We added a    logStream    to log all events to a file named  \
    \  chat.log    .   The    logEvent    method logs events with timestamps. \n\n\
    2.    Broadcasting    : The    broadcast    method emits a 'broadcast' event to\
    \ all users except the sender. \n\n Enhanced index.js: \n\n const Chat =    require\
    \    ('./chat'); \n\n const chat = new Chat(); \n\n // Register listeners \n\n\
    \ chat.    on    ('join', (username) => { \n\n console.    log    (\\`${username}\
    \ joined the chat.\\`); \n\n }); \n\n chat.    on    ('message', (username, message)\
    \ => { \n\n console.    log    (\\`${username}: ${message}\\`); \n\n }); \n\n\
    \ chat.    on    ('leave', (username) => { \n\n console.    log    (\\`${username}\
    \ left the chat.\\`); \n\n }); \n\n chat.    on    ('broadcast', (user, message)\
    \ => { \n\n console.    log    (\\`Broadcast to ${user}: ${message}\\`); \n\n\
    \ }); \n\n // Simulate user actions \n\n chat.    join    ('Alice'); \n\n chat.\
    \    sendMessage    ('Alice', 'Hello, everyone!'); \n\n chat.    leave    ('Alice');\
    \ \n\n chat.    join    ('Bob'); \n\n chat.    sendMessage    ('Bob', 'Hey Alice,\
    \ where did you go?'); \n\n chat.    leave    ('Bob'); \n\n –––––––– \n\n ![image](d2d_images/scene_break.png)\
    \ \n\n ![image](d2d_images/image149.png)\n\n   I    N THIS ENHANCED     index.js\
    \    , we also register a listener for the 'broadcast' event.   Now, when a user\
    \ sends a message, it is broadcasted to all other users, and the events are logged\
    \ to    chat.log    . \n\n ![image](d2d_images/image065.png)\n\n ![image](d2d_images/image229.png)\n\
    \n##  Sources \n\n   T    HIS BOOK HAS BEEN    crafted with the support of various\
    \ books, websites, and articles to provide comprehensive and accurate information\
    \ on Node.js.   Here are 15 key sources that were invaluable in the creation of\
    \ this book: \n\n Books: \n\n \"Node.js Design Patterns\" by Mario Casciaro and\
    \ Luciano Mammino "
