    \ Logs\\`); \n\n } \n\n } \n\n module.exports = new Logger(); \n\n // main.js\
    \ \n\n const logger =    require    ('./logger'); \n\n logger.    log    ('First\
    \ log'); // Output: LOG: First log \n\n logger.    printLogCount    (); // Output:\
    \ 1 Logs \n\n const logger2 =    require    ('./logger'); \n\n logger2.    log\
    \    ('Second log'); // Output: LOG: Second log \n\n logger2.    printLogCount\
    \    (); // Output: 2 Logs \n\n In this example, the    Logger    class ensures\
    \ that only one instance is created.   Even when you require    logger    in multiple\
    \ files, it points to the same instance, maintaining a single state. \n\n####\
    \  3.   Factory Pattern \n\n   T    HE FACTORY PATTERN    is used to create objects\
    \ without exposing the instantiation logic to the client.   It provides a way\
    \ to encapsulate the creation of complex objects and makes the code more modular\
    \ and easier to maintain. \n\n Example: \n\n // shapeFactory.js \n\n class Circle\
    \ { \n\n  constructor    (radius) { \n\n this.radius = radius; \n\n } \n\n  draw\
    \    () { \n\n console.log(\\`Drawing a circle with radius ${this.radius}\\`);\
    \ \n\n } \n\n } \n\n class Square { \n\n  constructor    (side) { \n\n this.side\
    \ = side; \n\n } \n\n  draw    () { \n\n console.    log    (\\`Drawing a square\
    \ with side ${this.side}\\`); \n\n } \n\n } \n\n class ShapeFactory { \n\n static\
    \    createShape    (type, size) { \n\n if (type === 'circle') { \n\n return new\
    \ Circle(size); \n\n } else if (type === 'square') { \n\n return new Square(size);\
    \ \n\n } \n\n return null; \n\n } \n\n } \n\n module.exports = ShapeFactory; \n\
    \n // main.js \n\n const ShapeFactory =    require    ('./shapeFactory'); \n\n\
    \ const myCircle = ShapeFactory.    createShape    ('circle', 5); \n\n myCircle.\
    \    draw    (); // Output: Drawing a circle with radius 5 \n\n const mySquare\
    \ = ShapeFactory.    createShape    ('square', 4); \n\n mySquare.    draw    ();\
    \ // Output: Drawing a square with side 4 \n\n In this example,    ShapeFactory\
    \    abstracts the creation logic for different shapes, making the code cleaner\
    \ and more manageable. \n\n####  4.   Middleware Pattern \n\n   T    HE MIDDLEWARE\
    \ PATTERN    is widely used in web frameworks like Express.js.   It allows you\
    \ to define a pipeline of processing steps that requests pass through.   Each\
    \ middleware function can modify the request, response, or pass control to the\
    \ next middleware. \n\n // middleware.js \n\n function    logger    (req, res,\
    \ next) { \n\n console.log(\\`${req.method} ${req.url}\\`); \n\n  next    ();\
    \ \n\n } \n\n function    errorHandler    (err, req, res, next) { \n\n console.error(err.stack);\
    \ \n\n res.    status    (500).    send    ('Something broke!'); \n\n } \n\n module.exports\
    \ = { \n\n  logger    , \n\n errorHandler \n\n }; \n\n // server.js \n\n const\
    \    express    =    require    ('express'); \n\n const { logger, errorHandler\
    \ } =    require    ('./middleware'); \n\n const app =    express    (); \n\n\
    \ app.    use    (logger); \n\n app.    get    ('/', (req, res) => { \n\n res.\
    \    send    ('Hello World'); \n\n }); \n\n app.    get    ('/error', (req, res)\
    \ => { \n\n throw new Error('Oops!'); \n\n }); \n\n app.    use    (errorHandler);\
    \ \n\n app.    listen    (3000, () => { \n\n console.    log    ('Server running\
