    \n# Step 6: Running Your Node.js Application\n\n### Using VS Code Terminal\n\n\
    Open the terminal in VS Code (`Ctrl+`).\n\nRun your application using the `start`\
    \ script:\n\n```bash\nnpm start\n```\n\nNodemon will start your application and\
    \ automatically restart it whenever you make changes to the code.\n\n![image](d2d_images/image174.png)\n\
    \n![image](d2d_images/image011.png)\n\nBy setting up your development environment\
    \ in Visual Studio Code, you create a powerful and efficient workspace tailored\
    \ for Node.js development. With the right extensions, configurations, and tools,\
    \ VS Code can significantly streamline your workflow, making coding more enjoyable\
    \ and productive.\n\n## 1.6. Creating a Basic Web Server\n\nCreating a BASIC WEB\
    \ server using Node.js is an excellent way to understand how the platform works\
    \ and to see its simplicity and power in action. Let’s go through the steps to\
    \ set up your first Node.js web server, explaining every detail to ensure beginners\
    \ can follow along easily.\n\n### ![image](d2d_images/image091.png) Step 1: Setting\
    \ Up Your Project\n\nIN THE EXPLORER PANEL on the left, click the \"New File\"\
    \ button or right-click on your project folder and select \"New File.\"\n\nName\
    \ the file `server.js`. This will be the file where we write our server code.\n\
    \n### Step 2: Writing the Server Code\n\nWrite the Code:\n\nOpen `server.js` and\
    \ type the following code:\n\n```javascript\nconst http = require('http');\n\n\
    const hostname = '127.0.0.1';\n\nconst port = 3000;\nconst server = http.createServer((req,\
    \ res) => {\n  res.statusCode = 200;\n  res.setHeader('Content-Type', 'text/plain');\n\
    \  res.end('Hello, World!\\n');\n});\n\nserver.listen(port, hostname, () => {\n\
    \  console.log(`Server running at http://${hostname}:${port}/`);\n});\n```\n\n\
    Let's break down this code to understand what each part does.\n\n#### Understanding\
    \ the Code\n\n**Importing the `http` Module:**\n```javascript\nconst http = require('http');\n\
    ```\nThis line imports the built-in `http` module in Node.js. Modules are reusable\
    \ pieces of code that can be included in your application. The `http` module provides\
    \ the functionality to create an HTTP server, which can handle HTTP requests and\
    \ responses.\n\n**Defining the Hostname and Port:**\n```javascript\nconst hostname\
    \ = '127.0.0.1';\nconst port = 3000;\n```\nThese lines define the hostname and\
    \ port number where the server will listen for incoming requests. `127.0.0.1`\
    \ is the localhost address, meaning the server will only be accessible from your\
    \ computer. The port number `3000` is arbitrary and can be any available port,\
    \ but `3000` is commonly used for development servers.\n\n**Creating the Server:**\n\
    ```javascript\nconst server = http.createServer((req, res) => {\n  res.statusCode\
    \ = 200;\n  res.setHeader('Content-Type', 'text/plain');\n  res.end('Hello, World!\\\
    n');\n});\n```\nThis line creates an HTTP server. The `createServer` function\
    \ takes a callback function that is executed each time a request is received.\
    \ The callback function has two parameters: `req` (the request object) and `res`\
    \ (the response object).\n\n`req` represents the incoming request, containing\
    \ information like the request URL, method, headers, etc.\n`res` represents the\
    \ outgoing response, which we use to send data back to the client.\n\nInside the\
    \ callback function:\n- `res.statusCode = 200` sets the HTTP status code to `200`,\
    \ indicating a successful response.\n- `res.setHeader('Content-Type', 'text/plain')`\
    \ sets the `Content-Type` header to `text/plain`, indicating that the response\
    \ content is plain text.\n- `res.end('Hello, World!\\n')` sends the response body\
    \ `Hello, World!` and ends the response. The `\\n` adds a newline character at\
    \ the end.\n\n**Starting the Server:**\n```javascript\nserver.listen(port, hostname,\
    \ () => {\n  console.log(`Server running at http://${hostname}:${port}/`);\n});\n\
    ```\nThis line starts the server and makes it listen on the specified hostname\
    \ and port. The callback function provided to the `listen` method is executed\
    \ once the server starts successfully. It logs a message to the console indicating\
    \ that the server is running and providing the URL to access it.\n\n### Step 3:\
    \ Running the Server\n\n**Open the Integrated Terminal:**\nOpen the integrated\
    \ terminal in VS Code by pressing `` Ctrl+` `` or by selecting \"Terminal\" >\
    \ \"New Terminal\" from the top menu.\n\n**Run the Server:**\nIn the terminal,\
    \ ensure you are in your directory and run the following:\n\n```bash\nnode server.js\n\
    ```\nNodemon will start your application and automatically restart it whenever\
    \ you make changes to the code.\n\n![image](d2d_images/image174.png)\n\n![image](d2d_images/image011.png)\n\
    \n**Access the Server:**\nOpen your web browser and navigate to `http://127.0.0.1:3000/`.\
    \ You should see the message `Hello, World!` displayed in the browser.\n\n###\
    \ Step 4: Experimenting with Routes\n\nTo MAKE YOUR SERVER more interactive, you\
    \ can extend it to handle different routes. Here’s how you can:\n\n**Update the\
    \ `server.js` file:**\n```javascript\nconst http = require('http');\n\nconst hostname\
    \ = '127.0.0.1';\nconst port = 3000;\n\nconst server = http.createServer((req,\
    \ res) => {\n  res.setHeader('Content-Type', 'text/plain');\n  if (req.url ===\
    \ '/') {\n    res.statusCode = 200;\n    res.end('Welcome to the Home Page!\\\
    n');\n  } else if (req.url === '/about') {\n    res.statusCode = 200;\n    res.end('This\
    \ is the About Page!\\n');\n  } else {\n    res.statusCode = 404;\n    res.end('Page\
    \ Not Found\\n');\n  }\n});\n\nserver.listen(port, hostname, () => {\n  console.log(`Server\
    \ running at http://${hostname}:${port}/`);\n});\n```\nThis updated code introduces\
    \ routing by checking the `req.url` property to determine the requested path.\n\
    - If the requested URL is `/`, the server responds with `Welcome to the Home Page!`.\n\
    - If the requested URL is `/about`, the server responds with `This is the About\
    \ Page!`.\n- For any other URL, the server responds with a `404` status code and\
    \ the message `Page Not Found`.\n\n**Restart the Server:**\nIf the server is already\
    \ running, stop it by pressing `Ctrl+C` in the terminal. Run the server again:\n\
    \n```bash\nnode server.js\n```\n\n- Navigate to `http://127.0.0.1:3000/`. You\
    \ should see the message `Welcome to the Home Page!`. ![image](d2d_images/image058.png)\n\
    - Navigate to `http://127.0.0.1:3000/about`. You should see the message `This\
    \ is the About Page!`. ![image](d2d_images/image197.png)\n- Navigate to any other\
    \ URL, such as `http://127.0.0.1:3000/contact`. You should see the message `Page\
    \ Not Found`. ![image](d2d_images/image079.png)\n\nThis example demonstrates how\
    \ to handle different routes in a Node.js server. By checking the `req.url` property,\
    \ you can create custom responses for various endpoints. ![image](d2d_images/image163.png)\n"
