  trans: "\n\n第三方中间件由社区开发和维护。这些中间件函数提供了 Express 内置中间件未包含的额外功能。它们可以通过 `npm` 安装，并广泛用于\
    \ Express 应用程序。一些流行的第三方中间件包括：\n\n### morgan\n- **目的**：用于 Node.js 的 HTTP 请求日志中间件。它以预定义的格式记录请求，对于调试和监控\
    \ HTTP 请求非常有用。\n- **用法**：帮助对和和记录发送到服务器的 HTTP 请求。\n\n```bash\nnpm install morgan\n\
    ```\n\n### body-parser\n- **目的**：在你的处理程序之前通过中间件解析传入的请求体，并可以通过 `req.body` 属性访问。\n\
    - **用法**：用于解析请求体中的 JSON、URL 编码和原始数据。\n\n```bash\nnpm install body-parser\n```\n\
    \n### cors\n- **目的**：提供一个 Connect/Express 中间件，可以使用各种选项启用跨域资源共享 (CORS)。\n- **用法**：允许或限制从另一个域请求\
    \ Web 服务器上的资源。\n\n```bash\nnpm install cors\n```\n\n### helmet\n- **目的**：通过设置各种\
    \ HTTP 头部来帮助保护 Express 应用。\n- **用法**：通过恰当设置 HTTP 头部提供针对已知 Web 漏洞的保护。\n\n```bash\n\
    npm install helmet\n```\n\n![image](img/image051.png)\n\n### 自定义中间件\n自定义中间件函数是你为了满足应用程序特定需求而自己创建的。这些中间件函数可以执行日志记录、身份验证、错误处理等任务。\n\
    \n#### 自定义中间件示例：\n\n1. 日志中间件：\n\n```javascript\nconst express = require('express');\n\
    \nconst app = express();\n\n// 自定义日志中间件\napp.use((req, res, next) => {\n  console.log(`Request\
    \ Method: ${req.method}, Request URL: ${req.url}`);\n  next(); // 将控制权传递给下一个中间件函数\n\
    });\n\napp.get('/', (req, res) => {\n  res.send('Hello, World!');\n});\n\nconst\
    \ PORT = 3000;\n\napp.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n---\n\n![image](img/scene_break.png)\n![image](img/image007.png)\n\
    \n#### 身份验证中间件：\n\n```javascript\nconst express = require('express');\n\nconst\
    \ app = express();\n\n// 自定义身份验证中间件\nconst authenticate = (req, res, next) =>\
    \ {\n  const auth = req.headers.authorization;\n  if (auth && auth === 'mysecrettoken')\
    \ {\n    next(); // 用户已身份验证，继续执行下一个中间件\n  } else {\n    res.status(401).send('Unauthorized');\n\
    \  }\n};\n\napp.use(authenticate);\n\napp.get('/', (req, res) => {\n  res.send('Authenticated!');\n\
    });\n\nconst PORT = 3000;\n\napp.listen(PORT, () => {\n  console.log(`Server running\
    \ at http://localhost:${PORT}/`);\n});\n```\n\n---\n\n![image](img/scene_break.png)\n\
    ![image](img/image071.png)\n\n#### 错误处理中间件：\n\n```javascript\nconst express =\
    \ require('express');\n\nconst app = express();\n\n// 定义抛出错误的路由\napp.get('/',\
    \ (req, res) => {\n  throw new Error('Simulated error'); // 这将被错误处理器捕获\n});\n\n\
    // 自定义错误处理中间件\napp.use((err, req, res, next) => {\n  console.error(err.stack);\n\
    \  res.status(500).send('Something broke!');\n});\n\nconst PORT = 3000;\n\napp.listen(PORT,\
    \ () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n});\n\
    ```\n\n![image](img/image123.png)\n- **日志中间件**：记录每个传入请求的请求方法和 URL。\n- **身份验证中间件**：检查请求是否包含特定令牌，允许请求继续或返回\
    \ 401 状态响应。\n- **错误处理中间件**：捕获其他中间件或路由处理程序抛出的错误，并发送 500 内部服务器响应。\n\n![image](img/image103.png)\n\
    \n### 第三方中间件\n\n#### Morgan\n##### 什么是 Morgan？\nMORGAN 是一个流行的 Node.js 请求日志中间件。它简化了记录发送到你服务器请求的过程，这对于调试和监控你的应用程序至关重要。通过提供每个请求的详细日志，Morgan\
    \ 帮助开发者理解应用程序是如何被使用的并识别潜在问题。Morgan 可以配置为记录每个请求的各种详细信息，例如方法、URL、响应状态、响应时间等。它支持多种格式，你也可以创建适应你需的自定义格式。\n\
    \n##### 为什么使用 Morgan？\n- **调试**：通过提供每个请求的详细日志帮助识别问题。\n- **监控**：跟踪应用程序的性能和使用情况。\n\
    - **审计追踪**：维护所有请求的记录，以确保安全和合规。\n- **可定制**：允许你根据需求定义自定义格式。\n\n##### 安装 Morgan\n\
    要在你的 Node.js 应用程序中使用 MORGAN，首先需要使用 npm 安装它：\n```bash\nnpm install morgan\n```\n\
    \n##### Morgan 的基本用法\n这是一个关于如何在 Express 应用程序中使用 Morgan 的基础示例：\n\n首先设置 Express\
    \ 应用：\n\n```javascript\nconst express = require('express');\n\nconst app = express();\n\
    \n// 使用 Morgan 记录请求\napp.use(morgan('combined'));\n\n// 定义简单的路由\napp.get('/',\
    \ (req, res) => {\n  res.send('Hello, World!');\n});\n\nconst PORT = 3000;\n\n\
    app.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n- **导入 Express 和 Morgan**：我们引入了 `express` 和 `morgan` 模块。\n- **使用中间件**：`app.use(morgan('combined'))`\
    \ 行将 Morgan 集成到我们的应用程序中。`'combined'` 格式提供了全面的日志，包括远程 IP、请求方法、URL、HTTP 版本、响应状态、响应时间等。\n\
    - **定义路由**：我们定义了一个访问时会返回 \"Hello, World!\" 的路由。\n\n运行应用程序：\n```bash\nnode server.js\n\
    ```\n使用浏览器或 Postman 等工具访问 `http://localhost:3000`。\n\n查看日志：\n- 向服务器发送请求后，你将在控制台中看到类似的详细日志：\n\
    \n![image](img/image002.png)\n\n#### 自定义 Morgan\nMORGAN 支持几种预定义的格式，如 'combined'、'common'、'dev'、'short'\
    \ 和 'tiny'。你也可以创建自定义格式来记录你重要的细节。\n\n自定义格式示例：\n\n1. 定义自定义格式：\n\n```javascript\n\
    const express = require('express');\n\nconst morgan = require('morgan');\n\nconst\
    \ app = express();\n\n// 定义自定义格式\nmorgan.format('myFormat', ':method :url :status\
    \ :res[content-length] - :response-time ms');\n\n// 使用自定义格式\napp.use(morgan('myFormat'));\n\
    \napp.get('/', (req, res) => {\n  res.send('Hello, Custom Logger!');\n});\n\n\
    const PORT = 3000;\n\napp.listen(PORT, () => {\n  console.log(`Server running\
    \ at http://localhost:${PORT}/`);\n});\n```\n"
- fmt: "\n## Custom Format Definition\nThe `morgan.format('myFormat', ':method :url\
    \ :status :res[content-length] - :response-time ms')` line defines a custom logging\
    \ format named 'myFormat'. This format logs the HTTP method, URL, response status,\
    \ content length, and response time.\n\n### Using the Custom Format\nWe use the\
    \ custom format by passing 'myFormat' to the `morgan` middleware.\n\n### Viewing\
    \ the Custom Logs\n* After making a request to the server, you will see logs in\
    \ your console formatted according to your custom format:\n\n![image](d2d_images/image01.png)\n\
    \n![image](d2d_images/image060.png)\n\n## Body-Parser\n\n### What is Body-Parser?\n\
    BODY-PARSER IS A MIDDLEWARE for `Express.js` that allows you to parse incoming\
    \ request bodies in a middleware before your handlers, making the body contents\
    \ available under the `req.body` property. This is particularly useful for handling\
    \ form submissions, JSON payloads, and other types of data sent in the body of\
    \ HTTP requests.\n\nBody-Parser simplifies the process of extracting data sent\
    \ by the client, whether it's in JSON format, URL-encoded form data, or other\
    \ formats. This makes it an essential tool for developing APIs and handling various\
    \ types of request data in web applications.\n\n### Why Use Body-Parser?\n* Simplifies\
    \ Data Handling: Extracts and parses data from the request body, making it easily\
    \ accessible.\n* Supports Multiple Formats: Can parse JSON, URL-encoded data,\
    \ and raw data.\n* Integration with Express: Seamlessly integrates with `Express.js`\
    \ to handle request bodies.\n* Security: Helps in validating and sanitizing incoming\
    \ data to prevent common security vulnerabilities like SQL injection and XSS.\n\
    \n### Installing Body-Parser\nTO USE BODY-PARSER in your Node.js application,\
    \ you first need to install it using npm:\n\n```bash\nnpm install body-parser\n\
    ```\n\n### Basic Usage of Body-Parser\nHERE’S A BASIC EXAMPLE of how to use Body-Parser\
    \ in an Express application to handle JSON and URL-encoded data:\n\n1. Set Up\
    \ an Express Application:\n\n```javascript\nconst express = require('express');\n\
    \nconst bodyParser = require('body-parser');\n\nconst app = express();\n\n// Use\
    \ Body-Parser middleware to parse JSON and URL-encoded data\n\napp.use(bodyParser.json());\n\
    \napp.use(bodyParser.urlencoded({ extended: true }));\n\n// Define a simple POST\
    \ route to handle form data\n\napp.post('/submit', (req, res) => {\n  const {\
    \ name, email } = req.body;\n  res.send(`Received name: ${name}, email: ${email}`);\n\
    });\n\nconst PORT = 3000;\n\napp.listen(PORT, () => {\n  console.log(`Server running\
    \ at http://localhost:${PORT}/`);\n});\n```\n\nStart the server by running:\n\
    ```bash\nnode server.js\n```\n\nTesting with Postman:\n* Create a new POST request.\n\
    * Set the URL to `http://localhost:3000/submit`.\n* In the Body tab, select `raw`\
    \ and `JSON`, then enter:\n```json\n{\n  \"name\": \"John Doe\",\n  \"email\"\
    : \"john.doe@example.com\"\n}\n```\nClick Send.\n\n![image](d2d_images/image04.png)\n\
    \n![image](d2d_images/scene.png)\n\n### Handling Different Data Formats with Body-Parser\n\
    BODY-PARSER CAN BE configured to handle various types of data. Below are examples\
    \ of how to configure Body-Parser for JSON, URL-encoded, and raw data.\n\n1. JSON\
    \ Data:\n`app.use(bodyParser.json());`\nExample\n```json\n{\n  \"name\": \"John\
    \ Doe\",\n  \"email\": \"john.doe@example.com\"\n}\n```\n\n2. URL-encoded Data:\n\
    `app.use(bodyParser.urlencoded({ extended: true }));`\nExample `name=John+Doe&email=john.doe@example.com`\n\
    \n3. Raw Data:\n`app.use(bodyParser.raw());`\nExample: This is raw data\n\n4.\
    \ Text Data:\n`app.use(bodyParser.text());`\nExample: This is text data\n\n###\
    \ Customizing Body-Parser\nBODY-PARSER PROVIDES options to customize its behavior.\
    \ For instance, you can limit the size of the request body to prevent abuse, or\
    \ you can configure the `extended` option for URL-encoded data.\n\nExample with\
    \ Custom Options:\n```javascript\nconst express = require('express');\n\nconst\
    \ bodyParser = require('body-parser');\n\nconst app = express();\n\n// Use Body-Parser\
    \ with custom options\napp.use(bodyParser.json({ limit: '10mb' }));\napp.use(bodyParser.urlencoded({\
    \ extended: false, limit: '10mb' }));\n\napp.post('/submit', (req, res) => {\n\
    \  const { name, email } = req.body;\n  res.send(`Received name: ${name}, email:\
    \ ${email}`);\n});\n\nconst PORT = 3000;\n\napp.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n* The `limit` option restricts\
    \ the maximum size of the request body to 10MB.\n* The `extended` option determines\
    \ whether to use the `querystring` library (when `false`) or the `qs` library\
    \ (when `true`) for parsing URL-encoded data.\n\n![image](d2d_images/image03.png)\n\
    \n## Helmet\n\n### What is Helmet?\nHELMET IS A SECURITY-focused middleware for\
    \ `Express.js` that helps secure your application by setting various HTTP headers.\
    \ It aims to protect your app from some well-known web vulnerabilities by configuring\
    \ appropriate HTTP headers. These vulnerabilities include cross-site scripting\
    \ (XSS), clickjacking, and other common attacks that can be mitigated by setting\
    \ the correct headers.\n\n### Why Use Helmet?\n* Security: Provides a straightforward\
    \ way to secure your application by setting HTTP headers.\n* Simplicity: Easy\
    \ to implement and configure.\n* Comprehensive: Covers various aspects of security\
    \ by enabling multiple security-related headers.\n* Customization: Allows you\
    \ to configure each header individually to suit your specific needs.\n\n### Installing\
    \ Helmet\nTO USE HELMET IN YOUR Node.js application, you first need to install\
    \ it using npm:\n\n```bash\nnpm install helmet\n```\n\n### Basic Usage of Helmet\n\
    HERE’S A BASIC EXAMPLE of how to use Helmet in an Express application:\n\n1. Set\
    \ Up an Express Application:\n\n```javascript\nconst express = require('express');\n\
    \nconst helmet = require('helmet');\n\nconst app = express();\n\n// Use Helmet\
    \ to secure the app by setting various HTTP headers\napp.use(helmet());\n\n//\
    \ Define a simple route\napp.get('/', (req, res) => {\n  res.send('Hello, secure\
    \ world!');\n});\n\nconst PORT = 3000;\n\napp.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n* Import Express and Helmet:\
    \ We require both the `express` and `helmet` modules.\n* Use Helmet Middleware:\
    \ The `app.use(helmet())` line integrates Helmet into our application, automatically\
    \ setting various HTTP headers for enhanced security.\n* Define a Route: We define\
    \ a simple route that responds with \"Hello, secure world!\" when accessed.\n\
    * Open your browser or use a tool like Postman to navigate to `http://localhost:3000`.\n\
    * Check the response headers to see the security headers added by Helmet.\n\n\
    ![image](d2d_images/image220.png)\n\n![image](d2d_images/image112.png)\n\n###\
    \ Headers Set by Helmet\nHELMET SETS A VARIETY of HTTP headers to help secure\
    \ your application. Some of the key headers include:\n\n* Content-Security-Policy\
    \ (CSP): Helps prevent XSS attacks by controlling the sources from which content\
    \ can be loaded.\n* X-DNS-Prefetch-Control: Controls DNS prefetching, which can\
    \ improve privacy.\n* Expect-CT: Helps detect and prevent the use of misissued\
    \ SSL certificates.\n"
