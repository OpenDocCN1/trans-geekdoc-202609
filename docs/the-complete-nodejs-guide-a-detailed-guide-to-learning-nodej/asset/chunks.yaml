    \ did not receive a timely response from the upstream server.  \n\n|  Status Code\
    \  ||  Meaning  ||  Description  |\n\n| --- | --- | --- |\n\n|  1xx Informational\
    \  ||  ||  |\n\n|  100  ||  Continue  ||  The server has received the request\
    \ headers, and the client should proceed to send the request body.  |\n\n|  101\
    \  ||  Switching Protocols  ||  The requester has asked the server to switch protocols,\
    \ and the server is acknowledging that it will do so.  |\n\n|  2xx Successful\
    \  ||  ||  |\n\n|  200  ||  OK  ||  The request has succeeded.  |\n\n|  201  ||\
    \  Created  ||  The request has been fulfilled, resulting in the creation of a\
    \ new resource.  |\n\n|  204  ||  No Content  ||  The server successfully processed\
    \ the request, and is not returning any content.  |\n\n|  3xx Redirection  ||\
    \  ||  |\n\n|  301  ||  Moved Permanently  ||  The URL of the requested resource\
    \ has been changed permanently.  |\n\n|  302  ||  Found  ||  The URL of the requested\
    \ resource has been changed temporarily.  |\n\n|  304  ||  Not Modified  ||  Indicates\
    \ that the resource has not been modified since the last request.  |\n\n|  4xx\
    \ Client Error  ||  ||  |\n\n|  400  ||  Bad Request  ||  The server cannot process\
    \ the request due to a client error (e.g., malformed request syntax).  |\n\n|\
    \  401  ||  Unauthorized  ||  The request requires user authentication.  |\n\n\
    |  403  ||  Forbidden  ||  The server understood the request, but refuses to authorize\
    \ it.  |\n\n|  404  ||  Not Found  ||  The server cannot find the requested resource.\
    \  |\n\n|  408  ||  Request Timeout  ||  The server timed out waiting for the\
    \ request.  |\n\n|  5xx Server Error  ||  ||  |\n\n|  500  ||  Internal Server\
    \ Error  ||  The server encountered an unexpected condition that prevented it\
    \ from fulfilling the request.  |\n\n|  501  ||  Not Implemented  ||  The server\
    \ does not support the functionality required to fulfill the request.  |\n\n|\
    \  502  ||  Bad Gateway  ||  The server, while acting as a gateway or proxy, received\
    \ an invalid response from the upstream server.  |\n\n|  503  ||  Service Unavailable\
    \  ||  The server is not ready to handle the request, often due to temporary overload\
    \ or maintenance.  |\n\n|  504  ||  Gateway Timeout  ||  The server, while acting\
    \ as a gateway or proxy, did not receive a timely response from the upstream server.\
    \  |\n\n   T    ABLE.2 OF COMMON HTTP    Status Codes \n\n##  ​   Understanding\
    \ HTTP Methods \n\n   H    TTP METHODS, ALSO    known as verbs, are a fundamental\
    \ part of the HTTP protocol used for web communication.   These methods define\
    \ the action to be performed on the resources identified by a URL.   The most\
    \ commonly used HTTP methods are GET, POST, PUT, and DELETE, but there are others\
    \ like PATCH, OPTIONS, and HEAD, each serving a specific purpose. \n\n###  Detailed\
    \ Explanation of HTTP Methods \n\n####  GET Method \n\n    D    EFINITION    \
    \ : The GET method is used to request data from a specified resource.   Requests\
    \ using GET should only retrieve data and have no other effect on the data. \n\
    \n  Characteristics    : \n\n*     Idempotent     : Multiple identical GET requests\
    \ should have the same effect as a single request.  \n\n*     Safe     : Does\
    \ not alter the state of the server.  \n\n*     Cachable     : Responses to GET\
    \ requests can be cached for better performance.  \n\n  Usage    : \n\n*    Fetching\
    \ web pages. \n\n*    Retrieving data from a server. \n\n  Example    : \n\n GET\
    \ /users HTTP/1.1 \n\n Host: example.com \n\n In this example, a GET request is\
    \ made to the    /users    endpoint to retrieve a list of users. \n\n####  POST\
    \ Method \n\n    D    EFINITION     : The POST method is used to send data to\
    \ the server to create or update a resource.   The data is included in the body\
    \ of the request. \n\n  Characteristics    : \n\n*     Non-idempotent     : Multiple\
    \ identical POST requests can have different effects.  \n\n*     Not Safe    \
    \ : Alters the state of the server.  \n\n*     Not Cachable     : Responses to\
    \ POST requests are typically not cached.  \n\n  Usage    : \n\n*    Submitting\
    \ form data. \n\n*    Uploading files. \n\n*    Creating a new resource on the\
    \ server. \n\n  Example    : \n\n POST /users HTTP/1.1 \n\n Host: example.com\
    \ \n\n Content-Type: application/json \n\n { \n\n \"name\": \"John Doe\", \n\n\
    \ \"email\": \"john.doe@example.com\" \n\n } \n\n  Explanation    : In this example,\
    \ a POST request is made to the    /users    endpoint with JSON data in the body\
    \ to create a new user. \n\n####  PUT Method \n\n    D    EFINITION     : The\
    \ PUT method is used to update a current resource with new data.   If the resource\
    \ does not exist, PUT can create it. \n\n  Characteristics    : \n\n*     Idempotent\
    \     : Multiple identical PUT requests should have the same effect as a single\
    \ request.  \n\n*     Not Safe     : Alters the state of the server.  \n\n*  \
    \   Not Cachable     : Responses to PUT requests are typically not cached.  \n\
    \n  Usage    : \n\n*    Updating existing resources. \n\n*    Creating resources\
    \ at a specified URL. \n\n  Example    : \n\n PUT /users/1 HTTP/1.1 \n\n Host:\
    \ example.com \n\n Content-Type: application/json \n\n { \n\n \"name\": \"John\
    \ Doe\", \n\n \"email\": \"john.doe@example.com\" \n\n } \n\n  Explanation   \
    \ : In this example, a PUT request is made to the    /users/1    endpoint to update\
    \ the user with ID 1. \n\n####  DELETE Method \n\n    D    EFINITION     : The\
    \ DELETE method is used to delete a specified resource. \n\n  Characteristics\
    \    : "
