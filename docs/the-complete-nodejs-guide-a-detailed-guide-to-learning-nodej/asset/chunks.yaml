  trans: "\n\n## 3.5. 文件系统操作实用示例\n\n文件系统操作对于读取、写入以及管理文件和目录等各种任务至关重要。本节提供了实用示例，演示了如何使用\
    \ Node.js 执行这些操作。\n\n### 示例 1：读取和写入文件\n\n目标：读取文件内容并写入新文件。\n\n代码：\n\n```javascript\n\
    const fs = require('fs');\n\n// 读取 'input.txt' 的内容并将其写入 'output.txt'\n\nfs.readFile('input.txt',\
    \ 'utf8', (err, data) => {\n  if (err) {\n    console.error('Error reading file:',\
    \ err);\n    return;\n  }\n  fs.writeFile('output.txt', data, (err) => {\n   \
    \ if (err) {\n      console.error('Error writing file:', err);\n      return;\n\
    \    }\n    console.log('File has been written successfully');\n  });\n});\n\n\
    console.log('Reading and writing files...');\n```\n\n解释：\n\n* `fs.readFile('input.txt',\
    \ 'utf8', callback)`: 异步读取 `input.txt` 的内容。\n* `fs.writeFile('output.txt', data,\
    \ callback)`: 异步将从 `input.txt` 读取的数据写入 `output.txt`。\n* 程序立即打印 'Reading and writing\
    \ files...'，演示了非阻塞行为。\n\n### 示例 2：创建和删除目录\n\n目标：创建一个新目录并将其删除。\n\n代码：\n\n```javascript\n\
    const fs = require('fs');\n\n// 创建新目录 'newDir'\n\nfs.mkdir('newDir', (err) =>\
    \ {\n  if (err) {\n    console.error('Error creating directory:', err);\n    return;\n\
    \  }\n  console.log('Directory created successfully');\n  // 删除目录 'newDir'\n \
    \ fs.rmdir('newDir', (err) => {\n    if (err) {\n      console.error('Error deleting\
    \ directory:', err);\n      return;\n    }\n    console.log('Directory deleted\
    \ successfully');\n  });\n});\n\nconsole.log('Creating and deleting directory...');\n\
    ```\n\n解释：\n\n* `fs.mkdir('newDir', callback)`: 创建一个名为 `newDir` 的新目录。\n* `fs.rmdir('newDir',\
    \ callback)`: 删除名为 `newDir` 的目录。\n* 程序立即打印 'Creating and deleting directory...'，演示了非阻塞行为。\n\
    \n### 示例 3：复制文件\n\n目标：将文件从一个位置复制到另一个位置。\n\n代码：\n\n```javascript\nconst fs = require('fs');\n\
    \n// 源和目标路径\nconst source = 'source.txt';\nconst destination = 'destination.txt';\n\
    // 将 'source.txt' 的内容复制到 'destination.txt'\n\nfs.copyFile(source, destination,\
    \ (err) => {\n  if (err) {\n    console.error('Error copying file:', err);\n \
    \   return;\n  }\n  console.log('File copied successfully');\n});\n\nconsole.log('Copying\
    \ file...');\n```\n\n解释：\n\n* `fs.copyFile(source, destination, callback)`: 将\
    \ `source.txt` 的内容复制到 `destination.txt`。\n* 程序立即打印 'Copying file...'。\n\n### 示例\
    \ 4：列出目录中的文件\n\n目标：列出指定目录下的所有文件和目录。\n\n代码：\n\n```javascript\nconst fs = require('fs');\n\
    \n// 列出当前目录的内容\nfs.readdir('.', (err, files) => {\n  if (err) {\n    console.error('Error\
    \ reading directory:', err);\n    return;\n  }\n  console.log('Files in directory:');\n\
    \  files.forEach(file => {\n    console.log(file);\n  });\n});\n\nconsole.log('Listing\
    \ files in directory...');\n```\n\n解释：\n\n* `fs.readdir('.', callback)`: 读取当前目录的内容。\n\
    * 程序立即打印 'Listing files in directory...'。\n\n### 示例 5：监控文件变化\n\n目标：监控文件在被修改时的变化。\n\
    \n代码：\n\n```javascript\nconst fs = require('fs');\n\n// 监控 'watchedFile.txt' 的变化\n\
    fs.watch('watchedFile.txt', (eventType, filename) => {\n  if (filename) {\n  \
    \  console.log(`${filename} Changed`);\n  }\n});\n\nconsole.log('Watching file\
    \ for changes...');\n```\n\n解释：\n\n* `fs.watch('watchedFile.txt', callback)`:\
    \ 监控 `watchedFile.txt` 的任何变化（例如修改）。\n* 程序立即打印 'Watching file for changes...'。\n\
    \n### 示例 6：向文件追加数据\n\n目标：向现有文件追加数据。\n\n代码：\n\n```javascript\nconst fs = require('fs');\n\
    \n// 要追加的数据\nconst data = '\\nAppended text.';\n// 向 'fileToAppend.txt' 追加数据\n\
    \nfs.appendFile('fileToAppend.txt', data, (err) => {\n  if (err) {\n    console.error('Error\
    \ appending to file:', err);\n    return;\n  }\n  console.log('Data appended successfully');\n\
    });\n\nconsole.log('Appending data to file...');\n```\n\n解释：\n\n* `fs.appendFile('fileToAppend.txt',\
    \ data, callback)`: 向 `fileToAppend.txt` 追加数据。\n* 程序立即打印 'Appending data to file...'。\n\
    \n这些实用性示例演示了如何使用 Node.js 执行各种文件系统操作，例如读取和写入文件、创建和删除目录、复制文件、列出目录内容、监控文件变化以及向文件追加数据。通过理解并利用这些操作，你可以在\
    \ Node.js 应用中高效地管理文件和目录，确保处理的稳健与灵活。\n\n## 4. HTTP 与 Web 服务器\n\n### HTTP 状态码\n\n\
    HTTP 状态码是服务器对客户端请求做出的标准响应。这些状态码被分为五类：\n\n1. `1xx (信息性)`：请求已接收，继续处理。\n2. `2xx (成功型)`：请求已成功接收、理解并接受。\n\
    3. `3xx (重定向型)`：为了完成请求需要采取后续操作。\n4. `4xx (客户端错误)`：请求包含错误语法或无法执行。\n5. `5xx (服务器错误)`：服务器未能有效执行请求。\n\
    \n#### 常见 HTTP 状态码\n\n#### 404 未找到（Not Found）\n\n定义：404 状态码意味着服务器找不到请求的资源。当客户端请求的\
    \ URL 在服务器上没有对应的资源时，通常会返回此状态码。它表示客户端错误，即用户正在尝试访问不存在的页面。\n\n常见原因：\n\n* 输入了错误的 URL。\n\
    * 点击了失效或死链。\n* 资源已被移动或删除。\n\n处理：当遇到 404 错误时，服务器理想情况下应该返回自定义的 404 错误页面，告知用户找不到请求资源，并提供导航选项帮助他们找到所需内容。\n\
    \n#### 500 内部服务器错误（Internal Server Error）\n\n定义：500 状态码表示服务器遇到了意外情况，导致其无法执行请求。这是一个通用的错误消息，当没有更具体的错误信息可用时使用。它指示服务器端错误。\n\
    \n常见原因：\n\n* 服务器配置错误。\n\n"
- fmt: "\n* Script errors in server-side code.\n* Resource exhaustion (e.g., out of\
    \ memory).\n* Issues with third-party services or APIs the server is trying to\
    \ access.\n\nHandling: When a `500` error occurs, the server should log the error\
    \ details for further investigation and return a generic error message to the\
    \ user to avoid exposing sensitive information. Additionally, it is good practice\
    \ to show a custom error page that informs the user of the issue and, if possible,\
    \ provides a way to report the problem.\n\n## Detailed Explanation of HTTP Status\
    \ Codes\n\n### 1xx Informational\n* `100 Continue`: The server has received the\
    \ request headers, and the client should proceed to send the request body.\n*\
    \ `101 Switching Protocols`: The requester has asked the server to switch protocols,\
    \ and the server is acknowledging that it will do so.\n\n### 2xx Successful\n\
    * `200 OK`: The request has succeeded. The meaning of the success depends on the\
    \ HTTP method (`GET`, `POST`, `PUT`, `DELETE`).\n* `201 Created`: The request\
    \ has been fulfilled, resulting in the creation of a new resource.\n* `204 No\
    \ Content`: The server successfully processed the request, but is not returning\
    \ any content.\n\n### 3xx Redirection\n* `301 Moved Permanently`: The URL of the\
    \ requested resource has been changed permanently. The new URL is given in the\
    \ response.\n* `302 Found`: The URL of the requested resource has been changed\
    \ temporarily.\n* `304 Not Modified`: Indicates that the resource has not been\
    \ modified since the last request.\n\n### 4xx Client Error\n* `400 Bad Request`:\
    \ The server cannot process the request due to a client error (e.g., malformed\
    \ request syntax).\n* `401 Unauthorized`: The request requires user authentication.\n\
    * `403 Forbidden`: The server understood the request, but refuses to authorize\
    \ it.\n* `404 Not Found`: The server cannot find the requested resource.\n* `408\
    \ Request Timeout`: The server timed out waiting for the request.\n\n### 5xx Server\
    \ Error\n* `500 Internal Server Error`: The server encountered an unexpected condition\
    \ that prevented it from fulfilling the request.\n* `501 Not Implemented`: The\
    \ server does not support the functionality required to fulfill the request.\n\
    * `502 Bad Gateway`: The server, while acting as a gateway or proxy, received\
    \ an invalid response from the upstream server.\n* `503 Service Unavailable`:\
    \ The server is not ready to handle the request, often due to temporary overload\
    \ or maintenance.\n* `504 Gateway Timeout`: The server, while acting as a gateway\
    \ or proxy, did not receive a timely response from the upstream server.\n\n| Status\
    \ Code | Meaning | Description |\n| :--- | :--- | :--- |\n| 1xx Informational\
    \ | | |\n| 100 | Continue | The server has received the request headers, and the\
    \ client should proceed to send the request body. |\n| 101 | Switching Protocols\
    \ | The requester has asked the server to switch protocols, and the server is\
    \ acknowledging that it will do so. |\n| 2xx Successful | | |\n| 200 | OK | The\
    \ request has succeeded. |\n| 201 | Created | The request has been fulfilled,\
    \ resulting in the creation of a new resource. |\n| 204 | No Content | The server\
    \ successfully processed the request, and is not returning any content. |\n| 3xx\
    \ Redirection | | |\n| 301 | Moved Permanently | The URL of the requested resource\
    \ has been changed permanently. |\n| 302 | Found | The URL of the requested resource\
    \ has been changed temporarily. |\n| 304 | Not Modified | Indicates that the resource\
    \ has not been modified since the last request. |\n| 4xx Client Error | | |\n\
    | 400 | Bad Request | The server cannot process the request due to a client error\
    \ (e.g., malformed request syntax). |\n| 401 | Unauthorized | The request requires\
    \ user authentication. |\n| 403 | Forbidden | The server understood the request,\
    \ but refuses to authorize it. |\n| 404 | Not Found | The server cannot find the\
    \ requested resource. |\n| 408 | Request Timeout | The server timed out waiting\
    \ for the request. |\n| 5xx Server Error | | |\n| 500 | Internal Server Error\
    \ | The server encountered an unexpected condition that prevented it from fulfilling\
    \ the request. |\n| 501 | Not Implemented | The server does not support the functionality\
    \ required to fulfill the request. |\n| 502 | Bad Gateway | The server, while\
    \ acting as a gateway or proxy, received an invalid response from the upstream\
    \ server. |\n| 503 | Service Unavailable | The server is not ready to handle the\
    \ request, often due to temporary overload or maintenance. |\n| 504 | Gateway\
    \ Timeout | The server, while acting as a gateway or proxy, did not receive a\
    \ timely response from the upstream server. |\n\n## COMMON HTTP Status Codes\n\
    \n Understanding HTTP Methods\nHTTP METHODS, known as verbs, are a fundamental\
    \ part of the HTTP protocol used for web communication. These methods define the\
    \ action to be performed on the resources identified by a URL. The most commonly\
    \ used methods are `GET`, `POST`, `PUT`, and `DELETE`, but there are others like\
    \ `PATCH`, `OPTIONS`, and `HEAD`, each serving a specific purpose.\n\n### Detailed\
    \ Explanation of HTTP Methods\n\n#### GET Method\nDefinition: The `GET` method\
    \ is used to request data from a specified resource. Requests using `GET` should\
    \ only retrieve data and have no other effect on the data.\nCharacteristics:\n\
    * `Idempotent`: Multiple identical `GET` requests should have the same effect\
    \ as a single request.\n* `Safe`: Does not alter the state of the server.\n* `Cacheable`:\
    \ Responses to `GET` requests can be cached for better performance.\nUsage:\n\
    * Fetching web pages.\n* Retrieving data from a server.\nExample:\n```\nGET /users\
    \ HTTP/1.1\nHost: example.com\n```\nIn this example, a `GET` request is made to\
    \ the `/users` endpoint to retrieve a list of users.\n\n#### POST Method\nDefinition:\
    \ The `POST` method is used to send data to the server to create or update a resource.\
    \ The data is included in the body of the request.\nCharacteristics:\n* `Non-idempotent`:\
    \ Multiple identical `POST` requests can have different effects.\n* `Not Safe`:\
    \ Alters the state of the server.\n* `Not Cacheable`: Responses to `POST` requests\
    \ are typically not cached.\nUsage:\n* Submitting form data.\n* Uploading files.\n\
    * Creating a new resource on the server.\nExample:\n```http\nPOST /users HTTP/1.1\n\
    Host: example.com\nContent-Type: application/json\n\n{\n  \"name\": \"John Doe\"\
    ,\n  \"email\": \"john.doe@example.com\"\n}\n```\nIn this example, a `POST` request\
    \ is made to the `/users` endpoint with JSON data in the body to create a new\
    \ user.\n\n#### PUT Method\nDefinition: The `PUT` method is used to update a current\
    \ resource with new data. If the resource does not exist, `PUT` can create it.\n\
    Characteristics:\n* `Idempotent`: Multiple identical `PUT` requests should have\
    \ the same effect as a single request.\n* `Not Safe`: Alters the state of the\
    \ server.\n* `Not Cacheable`: Responses to `PUT` requests are typically not cached.\n\
    Usage:\n* Updating existing resources.\n* Creating resources at a specified URL.\n\
    Example:\n```http\nPUT /users/1 HTTP/1.1\nHost: example.com\nContent-Type: application/json\n\
    \n{\n  \"name\": \"John Doe\",\n  \"email\": \"john.doe@example.com\"\n}\n```\n\
    In this example, a `PUT` request is made to the `/users/1` endpoint to update\
    \ the user with ID 1.\n\n#### DELETE Method\nDefinition: The `DELETE` method is\
    \ used to delete a specified resource.\nCharacteristics:\n"
