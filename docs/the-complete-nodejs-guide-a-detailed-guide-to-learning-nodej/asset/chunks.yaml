  trans: "\n```javascript\nconst fs = require('fs');\nconst path = require('path');\n\
    \nconst server = http.createServer((req, res) => {\n  // Construct the file path\n\
    \  let filePath = path.join(__dirname, 'public', req.url === '/' ? 'index.html'\
    \ : req.url);\n  // Get the file extension\n  let extname = path.extname(filePath);\n\
    \  // Set default content type\n  let contentType = 'text/html';\n  // Determine\
    \ the content type based on the file extension\n  switch (extname) {\n    case\
    \ '.js':\n      contentType = 'text/javascript';\n      break;\n    case '.css':\n\
    \      contentType = 'text/css';\n      break;\n    case '.json':\n      contentType\
    \ = 'application/json';\n      break;\n    case '.png':\n      contentType = 'image/png';\n\
    \      break;\n    case '.jpg':\n      contentType = 'image/jpg';\n      break;\n\
    \  }\n  // Read the file and serve it\n  fs.readFile(filePath, (err, content)\
    \ => {\n    if (err) {\n      if (err.code == 'ENOENT') {\n        // File not\
    \ found\n        fs.readFile(path.join(__dirname, 'public', '404.html'), (err,\
    \ content) => {\n          res.writeHead(404, { 'Content-Type': 'text/html' });\n\
    \          res.end(content, 'utf8');\n        });\n      } else {\n        //\
    \ Some server error\n        res.writeHead(500);\n        res.end(`Server Error:\
    \ ${err.code}`);\n      }\n    } else {\n      // Serve the file\n      res.writeHead(200,\
    \ { 'Content-Type': contentType });\n      res.end(content, 'utf8');\n    }\n\
    \  });\n});\n\nconst PORT = 3000;\nserver.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n\n### 解释：\n\n- 该代码设置了一个基础的\
    \ HTTP 服务器，用于从 `public` 目录提供文件。\n- 它根据文件扩展名确定内容类型，并使用正确的内容类型提供文件。\n- 如果未找到文件，它会提供自定义的\
    \ 404 错误页面。\n\n![image](img/image102.png)\n\n### 使用 Express 提供静态文件\n\n使用 EXPRESS，通过\
    \ `express.static` 中间件的帮助，提供静态文件变得简单得多。\n\n#### 使用 Express 的示例：\n\n```\nproject-directory/\n\
    ├── public/\n│   ├── index.html\n│   ├── style.css\n│   └── script.js\n└── server.js\n\
    ```\n\n- `express.static` 中间件用于从 `public` 目录提供静态文件。\n- 当你访问 `http://localhost:3000`\
    \ 时，Express 会在 `public` 目录中查找 `index.html` 并提供。\n\n#### 自定义静态中间件\n\n你可以通过选项来来自定义\
    \ `express.static` 中间件的行为，例如设置缓存控制标头、指定回退路径等。\n\n#### 使用自定义选项的示例：\n\n```javascript\n\
    const express = require('express');\nconst path = require('path');\nconst app\
    \ = express();\nconst options = {\n  dotfiles: 'ignore', // 为 'allow', 'deny',\
    \ 'ignore'\n  etag: false,\n  extensions: ['htm', 'html'],\n  index: 'index.html',\n\
    \  maxAge: '1d', // 缓存控制\n  redirect: false,\n  setHeaders: function (res, path,\
    \ stat) {\n    res.set('x-timestamp', Date.now());\n  }\n};\n\n// 使用自定义选项从 \"\
    public\" 目录提供静态文件\napp.use(express.static(path.join(__dirname, 'public'), options));\n\
    \nconst PORT = 3000;\napp.listen(PORT, () => {\n  console.log(`Server running\
    \ at http://localhost:${PORT}/`);\n});\n```\n\n### 解释：\n\n- `dotfiles`: 控制对隐藏文件的处理。选项有\
    \ 'allow', 'deny', 'ignore'。\n- `etag`: 禁用 ETag 标头。\n- `extensions`: 设置默认的文件扩展名回退。\n\
    - `index`: 指定默认提供的文件。\n- `maxAge`: 设置 Cache-Control max-age 指令，单位为毫秒或 `ms` 模块接受的格式字符串。\n\
    - `redirect`: 禁用无末尾斜杠目录的重定向。\n- `setHeaders`: 允许你设置自定义标头。\n\n![image](img/image190.png)\n\
    ![image](img/image006.png)\n\n## 4.5. 使用中间件\n\n### 中间件简介\n\n中间件是 Express.js（一个用于\
    \ Node.js 的 Web 框架）的核心概念之一。中间件函数是能够访问请求对象 (`req`)、响应对象 (`res`) 以及应用程序请求-响应循环中下一个中间件函数的函数。中间件可以执行各种任务，例如执行代码、修改请求和响应对象、结束请求-响应循环以及调用堆栈中的下一个中间件函数。\n\
    \n中间件函数是 Express 程序的灵魂。它们提供了一种处理 HTTP 请求和响应的稳健机制，允许开发者构建复杂且功能丰富的 Web 应用。理解中间件如何工作以及如何有效地使用它们，对于任何使用\
    \ Express 的开发者来说都至关重要。\n\n![image](img/image184.png)\n\n#### 什么是中间件？\n\n中间件本质上是一系列为服务器接收的每个请求执行的函数。每个中间件函数都可以对请求和响应对象执行操作，并通过\
    \ `next()` 函数传递到下一个中间件。\n\n##### 中间件的关键特点\n\n1. **函数链**：中间件形成了一个函数链，每个函数执行特定任务后传递控制权。\n\
    2. **对请求和响应对象的访问**：中间件函数可以访问请求 (`req`) 和响应 (`res`) 对象，允许它们根据需要读取或修改这些对象。\n3. **控制流**：中间件函数可以控制请求-响应循环的流程。通过调用\
    \ `next()`，它们将控制权传递给下一个函数。如果不调用，请求-响应循环将结束。\n4. **顺序很重要**：中间件定义的顺序非常。它们按照定义的顺序执行。\n\
    \n### 中间件的类型\n\nExpress.js 中的中间件大致分为三类：内置中间件、第三方中间件和自定义中间件。每种类型都有不同的用途，并提供了有助于简化开发过程和增强\
    \ Web 应用能力的各种功能。\n\n#### 内置中间件\n\nExpress 自带了一系列内置中间件函数，提供了基础但重要的功能。这些中间件函数集成在\
    \ Express 中，不需要额外安装。最常用的内置中间件函数包括：\n\n- `express.static`:\n  - 用：提供 HTML、CSS、JavaScript、图像和其他资源的静态文件。\n\
    \  - 用：该中间件对于直接从服务器交付静态内容至关重要。\n- `express.json`:\n  - 用：解析具有 JSON 负载的传入请求，基于\
    \ `body-parser`。\n  - 用：该中间件对于期望请求体包含 JSON 数据的 API 非常有用。\n- `express.urlencoded`:\n\
    \  - 用：解析具有 URL 编码负载的传入请求。通常用于 HTML 表单提交。\n  - 用：该中间件对于处理数据在 URL 中编码的表单提交非常有用。\n\
    \n"
- fmt: "\nTHIRD-PARTY MIDDLEWARE is developed and maintained by the community. These\
    \ middleware functions provide additional functionalities that are not included\
    \ in the built-in middleware of Express. They can be installed via `npm` and are\
    \ widely used in Express applications. Some popular third-party middleware include:\n\
    \n### morgan\n- **Purpose**: HTTP request logger middleware for Node.js. It logs\
    \ requests in a predefined format and is useful for debugging and monitoring HTTP\
    \ requests.\n- **Usage**: Helps track and log HTTP requests made to the server.\n\
    \n```bash\nnpm install morgan\n```\n\n### body-parser\n- **Purpose**: Parses incoming\
    \ request bodies in a middleware before your handlers, available under the `req.body`\
    \ property.\n- **Usage**: Useful for parsing JSON, URL-encoded, and raw data in\
    \ the request body.\n\n```bash\nnpm install body-parser\n```\n\n### cors\n- **Purpose**:\
    \ Provides a Connect/Express middleware that can be used to enable Cross-Origin\
    \ Resource Sharing (CORS) with various options.\n- **Usage**: Allows or restricts\
    \ resources on a web server to be requested from another domain.\n\n```bash\n\
    npm install cors\n```\n\n### helmet\n- **Purpose**: Helps secure Express apps\
    \ by setting various HTTP headers.\n- **Usage**: Provides protection against well-known\
    \ web vulnerabilities by setting HTTP headers appropriately.\n\n```bash\nnpm install\
    \ helmet\n```\n\n![image](d2d_images/image051.png)\n\n### Custom Middleware\n\
    CUSTOM MIDDLEWARE FUNCTIONS are those you create yourself to meet specific requirements\
    \ of your application. These middleware functions can perform tasks like logging,\
    \ authentication, error handling, and more.\n\n#### Example of Custom Middleware:\n\
    \n1. Logging Middleware:\n\n```javascript\nconst express = require('express');\n\
    \nconst app = express();\n\n// Custom logging middleware\napp.use((req, res, next)\
    \ => {\n  console.log(`Request Method: ${req.method}, Request URL: ${req.url}`);\n\
    \  next(); // Pass control to the next middleware function\n});\n\napp.get('/',\
    \ (req, res) => {\n  res.send('Hello, World!');\n});\n\nconst PORT = 3000;\n\n\
    app.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n---\n\n![image](d2d_images/scene_break.png)\n![image](d2d_images/image007.png)\n\
    \n#### AUTHENTICATION MIDDLEWARE:\n\n```javascript\nconst express = require('express');\n\
    \nconst app = express();\n\n// Custom authentication middleware\nconst authenticate\
    \ = (req, res, next) => {\n  const auth = req.headers.authorization;\n  if (auth\
    \ && auth === 'mysecrettoken') {\n    next(); // User is authenticated, proceed\
    \ to the next middleware\n  } else {\n    res.status(401).send('Unauthorized');\n\
    \  }\n};\n\napp.use(authenticate);\n\napp.get('/', (req, res) => {\n  res.send('Authenticated!');\n\
    });\n\nconst PORT = 3000;\n\napp.listen(PORT, () => {\n  console.log(`Server running\
    \ at http://localhost:${PORT}/`);\n});\n```\n\n---\n\n![image](d2d_images/scene_break.png)\n\
    ![image](d2d_images/image071.png)\n\n#### ERROR HANDLING MIDDLEWARE:\n\n```javascript\n\
    const express = require('express');\n\nconst app = express();\n\n// Define the\
    \ route that throws an error\napp.get('/', (req, res) => {\n  throw new Error('Simulated\
    \ error'); // This will be caught by the error handler\n});\n\n// Custom error-handling\
    \ middleware\napp.use((err, req, res, next) => {\n  console.error(err.stack);\n\
    \  res.status(500).send('Something broke!');\n});\n\nconst PORT = 3000;\n\napp.listen(PORT,\
    \ () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n});\n\
    ```\n\n![image](d2d_images/image123.png)\n- **Logging Middleware**: Logs the request\
    \ method and URL for every incoming request.\n- **Authentication Middleware**:\
    \ Checks if the request contains a specific token and allows the request to proceed\
    \ or responds with 401 status.\n- **Error Handling Middleware**: Catches errors\
    \ thrown by other middleware or route handlers and sends 500 Internal Server response.\n\
    \n![image](d2d_images/image103.png)\n\n### Third-Party Middleware\n\n#### Morgan\n\
    ##### What is Morgan?\nMORGAN IS A POPULAR request logger middleware for Node.js.\
    \ It simplifies the process of logging requests made to your server, which is\
    \ crucial for debugging and monitoring your applications. By providing detailed\
    \ logs of each request, Morgan helps developers understand how their applications\
    \ are being used and identify potential issues. Morgan can be configured to log\
    \ various details about each request, such as the method, URL, response status,\
    \ response time, and more. It supports multiple formats, and you can also create\
    \ custom formats to suit your needs.\n\n##### Why Use Morgan?\n- **Debugging**:\
    \ Helps in identifying issues by providing detailed logs of each request.\n- **Monitoring**:\
    \ Tracks the performance and usage of your application.\n- **Audit Trails**: Maintains\
    \ a record of all requests for security and compliance.\n- **Customizable**: Allows\
    \ you to define custom formats based on your requirements.\n\n##### Installing\
    \ Morgan\nTO USE MORGAN IN YOUR Node.js application, you first need to install\
    \ it using npm:\n```bash\nnpm install morgan\n```\n\n##### Basic Usage of Morgan\n\
    HERE’S A BASIC EXAMPLE of how to use Morgan in an Express application:\n\nFirst\
    \ Set Up an Express Application:\n\n```javascript\nconst express = require('express');\n\
    \nconst morgan = require('morgan');\n\nconst app = express();\n\n// Use Morgan\
    \ for logging requests\napp.use(morgan('combined'));\n\n// Define a simple route\n\
    app.get('/', (req, res) => {\n  res.send('Hello, World!');\n});\n\nconst PORT\
    \ = 3000;\n\napp.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n- **Import Express and Morgan**: We require both the `express` and\
    \ `morgan` modules.\n- **Use Morgan Middleware**: The `app.use(morgan('combined'))`\
    \ line integrates Morgan into our application. The `'combined'` format provides\
    \ a comprehensive logging format that includes the remote IP, request method,\
    \ URL, HTTP version, response status, response time, and more.\n- **Define a Route**:\
    \ We define a simple route that responds with \"Hello, World!\" when accessed.\n\
    \nRunning the Application:\n```bash\nnode server.js\n```\nOpen your browser or\
    \ use a tool like Postman to navigate to `http://localhost:3000`.\n\nViewing the\
    \ Logs:\n- After making a request to the server, you will see detailed logs in\
    \ your console similar to this:\n\n![image](d2d_images/image002.png)\n\n#### Customizing\
    \ Morgan\nMORGAN SUPPORTS SEVERAL predefined formats such as 'combined', 'common',\
    \ 'dev', 'short', and 'tiny'. You can also create custom formats to log specific\
    \ details that are important to you.\n\nExample of a Custom Format:\n\n1. Define\
    \ a Custom Format:\n\n```javascript\nconst express = require('express');\n\nconst\
    \ morgan = require('morgan');\n\nconst app = express();\n\n// Define a custom\
    \ format\nmorgan.format('myFormat', ':method :url :status :res[content-length]\
    \ - :response-time ms');\n\n// Use the custom format\napp.use(morgan('myFormat'));\n\
    \napp.get('/', (req, res) => {\n  res.send('Hello, Custom Logger!');\n});\n\n\
    const PORT = 3000;\n\napp.listen(PORT, () => {\n  console.log(`Server running\
    \ at http://localhost:${PORT}/`);\n});\n```\n\n---\n\n![image](d2d_images/scene_break.png)\n\
    ![image](d2d_images/image026.png)\n"
