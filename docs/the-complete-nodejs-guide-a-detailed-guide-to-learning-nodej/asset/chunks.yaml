    \n–––––––\n\n![image](d2d_images/scene_break.png)\n\n### Multiple File Uploads\n\
    \n#### STEP 1: IMPORT REQUIRED Modules\n\n```javascript\nconst express = require('express');\n\
    const multer = require('multer');\nconst path = require('path');\nconst fs = require('fs');\n\
    ```\n\n#### Step 2: Configure Storage for Uploaded Files\n\n`multer` allows you\
    \ to configure storage options, such as the destination directory and file naming.\n\
    \n```javascript\nconst storage = multer.diskStorage({\n  destination: function\
    \ (req, file, cb) {\n    cb(null, 'uploads/'); // Directory to save the uploaded\
    \ files\n  },\n  filename: function (req, file, cb) {\n    cb(null, file.fieldname\
    \ + '-' + Date.now() + path.extname(file.originalname)); // Filename format\n\
    \  }\n});\n\nconst upload = multer({ storage: storage });\n```\n\n#### Step 3:\
    \ Set Up the Express Application\n\n```javascript\nconst app = express();\nconst\
    \ PORT = 3000;\n// Ensure the uploads directory exists\nif (!fs.existsSync('uploads'))\
    \ {\n  fs.mkdirSync('uploads');\n}\napp.use(express.static('public')); // Serve\
    \ static files from \"public\" directory\n```\n\n–––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n#### STEP 4: CREATE ENDPOINT for Multiple Files\n\n```javascript\napp.use(express.static('public'));\
    \ // Serve static files from \"public\" directory\napp.post('/upload-multiple',\
    \ upload.array('files', 10), (req, res) => {\n  try {\n    res.send('Files uploaded\
    \ successfully');\n  } catch (error) {\n    res.status(400).send('Error uploading\
    \ files');\n  }\n});\n```\n\n#### Step 5: Start the Server\n\n```javascript\n\
    app.listen(PORT, () => {\n  console.log(`Server is running on port ${PORT}`);\n\
    });\n```\n\n#### Step 6: Create an HTML Form for Multiple Files\n\nAlso create\
    \ an `index.html` file in the `public` directory with the following:\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>File\
    \ Upload</title>\n  <link rel=\"stylesheet\" href=\"/styles.css\">\n</head>\n\
    <body>\n  <h1>Upload Files</h1>\n  <form action=\"/upload-multiple\" method=\"\
    POST\" enctype=\"multipart/form-data\">\n    <input type=\"file\" name=\"files\"\
    \ multiple required>\n    <button type=\"submit\">Upload</button>\n  </form>\n\
    </body>\n</html>\n```\n\n–––––––\n\n![image](d2d_images/scene_break.png)\n\n###\
    \ Complete Example\n\nHERE’S THE COMPLETE code for the server:\n\n```javascript\n\
    const express = require('express');\nconst multer = require('multer');\nconst\
    \ path = require('path');\nconst fs = require('fs');\nconst app = express();\n\
    const PORT = 3000;\n// Ensure the uploads directory exists\nif (!fs.existsSync('uploads'))\
    \ {\n  fs.mkdirSync('uploads');\n}\nconst storage = multer.diskStorage({\n  destination:\
    \ function (req, file, cb) {\n    cb(null, 'uploads/');\n  },\n  filename: function\
    \ (req, file, cb) {\n    cb(null, file.fieldname + '-' + Date.now() + path.extname(file.originalname));\n\
    \  }\n});\n\nconst upload = multer({ storage: storage });\napp.use(express.static('public'));\n\
    // Serve the HTML form for file uploads\napp.get('/', (req, res) => {\n  res.sendFile(path.join(__dirname,\
    \ 'public', 'index.html'));\n});\n\n// Endpoint to handle multiple file uploads\n\
    app.post('/upload-multiple', upload.array('files', 10), (req, res) => {\n  try\
    \ {\n    res.send('Files uploaded successfully');\n  } catch (error) {\n    res.status(400).send('Error\
    \ uploading files');\n  }\n});\n\n// Start the server\napp.listen(PORT, () =>\
    \ {\n  console.log(`Server is running on port ${PORT}`);\n});\n```\n\n![image](d2d_images/image151.png)\n\
    \n### Explanation of the Code\n\n* **Express Setup**: We set up an Express application\
    \ to handle HTTP requests.\n* **multer Configuration**: We configure `multer`\
    \ to store uploaded files in the `uploads` directory with a unique filename.\n\
    * **Static Files**: We serve static files from the `public` directory, where we\
    \ place our HTML form.\n* **Upload Endpoint**: We create an endpoint `/upload-multiple`\
    \ that handles multiple file uploads. The `upload.array('files', 10)` middleware\
    \ processes the file uploads, allowing up to 10 files to be uploaded at a time.\
    \ The uploaded files are available in `req.files`.\n\n–––––––\n\n![image](d2d_images/scene_break.png)\n\
