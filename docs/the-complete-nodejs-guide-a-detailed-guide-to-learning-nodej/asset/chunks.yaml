    \nNODE.JS 可以监听文件或目录的变化，这对于实现如实时重载等功能非常有用。\n\n示例：监听文件\n\n```javascript\nconst fs\
    \ = require('fs');\n\nfs.watch('example.txt', (eventType, filename) => {\n  if\
    \ (filename) {\n    console.log(`${filename} has been modified`);\n  }\n});\n\
    ```\n\n在此示例中：\n`fs.watch('example.txt', callback)` 监听 `example.txt` 的变化。\n当文件被修改时，回调函数会记录一条消息。\n\
    消息 'Watching file...' 会被立即记录。\n\n![image](img/image087.png)\n![image](img/image227.png)\n\
    \n读取写入文件在 Node.js 中通过 `fs` 模块变得简单。选择同步还是异步方法取决于你的应用。同步方法会阻塞事件循环，而异步方法更适合性能敏感型应用。\n\
    \n## 3. 操作目录\n\n处理目录对于文件系统至关重要。操作目录。\n\n### 创建目录\n\n要创建目录，Node.js 提供了同步和异步方法。\n\
    \n#### 同步创建\n\n示例：同步创建\n\n```javascript\nconst fs = require('fs');\n\ntry {\n\
    \  if (!fs.existsSync('new-directory')) {\n    fs.mkdirSync('new-directory');\n\
    \    console.log('Directory created successfully');\n  } else {\n    console.log('Directory\
    \ already exists');\n  }\n} catch (err) {\n  console.error('Error creating directory:',\
    \ err);\n}\n```\n\n在此示例中：\n`fs.existsSync('new-directory')` 检查目录是否存在。\n`fs.mkdirSync('new-directory')`\
    \ 如果不存在则创建目录。\n\n#### 异步创建\n\n示例：异步创建\n\n```javascript\nconst fs = require('fs');\n\
    \nfs.mkdir('new-directory', (err) => {\n  if (err) {\n    return console.error('Error\
    \ creating directory:', err);\n  }\n  console.log('Directory created successfully');\n\
    });\n\nconsole.log('Creating directory...');\n```\n\n![image](img/image010.png)\n\
    \n在此示例中：\n`fs.mkdir('new-directory', callback)` 异步创建目录。\n错误将被捕获并记录到控制台。\n\n###\
    \ 读取目录\n\n读取目录的内容可以通过同步或异步的方式进行，以列出文件和子目录。\n\n#### 同步读取\n\n示例：同步读取\n\n```javascript\n\
    const fs = require('fs');\n\ntry {\n  const files = fs.readdirSync('.');\n  console.log('Files\
    \ in directory:');\n  files.forEach(file => {\n    console.log(file);\n  });\n\
    } catch (err) {\n  console.error('Error reading directory:', err);\n}\n```\n\n\
    在此示例中：\n`fs.readdirSync('.')` 同步读取当前目录的内容。\n内容记录到控制台。\n\n#### 异步读取\n\n示例：异步读取\n\
    \n```javascript\nconst fs = require('fs');\n\nfs.readdir('.', (err, files) =>\
    \ {\n  if (err) {\n    return console.error('Error reading directory:', err);\n\
    \  }\n  console.log('Files in directory:');\n  files.forEach(file => {\n    console.log(file);\n\
    \  });\n});\n\nconsole.log('Reading directory...');\n```\n\n在此示例中：\n`fs.readdir('.',\
    \ callback)` 异步读取当前目录的内容。\n回调函数处理文件列表和任何错误。\n\n### 删除目录\n\n要删除目录，你可以使用同步和异步方法。\n\
    \n#### 同步删除\n\n示例：同步删除\n\n```javascript\nconst fs = require('fs');\n\ntry {\n\
    \  if (fs.existsSync('new-directory')) {\n    fs.rmdirSync('new-directory');\n\
    \    console.log('Directory deleted successfully');\n  } else {\n    console.log('Directory\
    \ does not exist');\n  }\n} catch (err) {\n  console.error('Error deleting directory:',\
    \ err);\n}\n```\n\n在此示例中：\n`fs.existsSync('new-directory')` 检查目录是否存在。\n`fs.rmdirSync('new-directory')`\
    \ 如果存在则删除目录。\n\n#### 异步删除\n\n示例：异步删除\n\n```javascript\nconst fs = require('fs');\n\
    \nfs.rmdir('new-directory', (err) => {\n  if (err) {\n    return console.error('Error\
    \ deleting directory:', err);\n  }\n  console.log('Directory deleted successfully');\n\
    });\n\nconsole.log('Deleting directory...');\n```\n\n![image](img/image035.png)\n\
    \n"
- fmt: "\n* `fs.existsSync('new-directory')` checks if the directory exists.\n* `fs.rmdirSync('new-directory')`\
    \ deletes the directory if it exists.\n* Errors are caught and logged to the console.\n\
    \n![image](d2d_images/image038.png)\n\n### Asynchronous Directory Deletion\n\n\
    EXAMPLE: ASYNCHRONOUS Directory Deletion\n\n```javascript\nconst fs = require('fs');\n\
    \nfs.rmdir('new-directory', (err) => {\n  if (err) {\n    return console.error('Error\
    \ deleting directory:', err);\n  }\n  console.log('Directory deleted successfully');\n\
    });\n\nconsole.log('Deleting directory...');\n```\n\nIn this example:\n* `fs.rmdir('new-directory',\
    \ callback)` deletes the directory asynchronously.\n* The callback function handles\
    \ any errors.\n* The message 'Deleting directory...' is logged immediately, demonstrating\
    \ non-blocking behavior.\n\n### Renaming Directories\n\nNODE.JS ALLOWS YOU to\
    \ rename directories using the `fs.rename` and `fs.renameSync` methods.\n\n###\
    \ Synchronous Directory Renaming\n\nEXAMPLE: SYNCHRONOUS Directory Renaming\n\n\
    ```javascript\nconst fs = require('fs');\n\ntry {\n  fs.renameSync('old-directory',\
    \ 'new-directory');\n  console.log('Directory renamed successfully');\n} catch\
    \ (err) {\n  console.error('Error renaming directory:', err);\n}\n```\n\nIn this\
    \ example:\n* `fs.renameSync('old-directory', 'new-directory')` renames the directory\
    \ synchronously.\n* Errors are caught and logged to the console.\n\n### Asynchronous\
    \ Directory Renaming\n\nEXAMPLE: ASYNCHRONOUS Directory Renaming\n\n```javascript\n\
    const fs = require('fs');\n\nfs.rename('old-directory', 'new-directory', (err)\
    \ => {\n  if (err) {\n    return console.error('Error renaming directory:', err);\n\
    \  }\n  console.log('Directory renamed successfully');\n});\n\nconsole.log('Renaming\
    \ directory...');\n```\n\nIn this example:\n* `fs.rename('old-directory', 'new-directory',\
    \ callback)` renames the directory asynchronously.\n* The callback function handles\
    \ any errors.\n* The message 'Renaming directory...' is logged immediately, demonstrating\
    \ non-blocking behavior.\n\n### Watching Directories\n\nNODE.JS CAN MONITOR changes\
    \ in a directory, such as file additions, deletions, or modifications.\n\nExample:\
    \ Watching a Directory\n\n```javascript\nconst fs = require('fs');\n\nfs.watch('new-directory',\
    \ (eventType, filename) => {\n  if (filename) {\n    console.log(`Event: ${eventType}\
    \ on file: ${filename}`);\n  } else {\n    console.log(`Event: ${eventType}`);\n\
    \  }\n});\n\nconsole.log('Watching directory...');\n```\n\nIn this example:\n\
    * `fs.watch('new-directory', callback)` watches `new-directory` for changes.\n\
    * The callback function logs the type of event and the affected file.\n* The message\
    \ 'Watching directory...' is logged immediately.\n\n![image](d2d_images/image130.png)\n\
    \nWorking with directories in Node.js is made straightforward by the `fs` module.\
    \ You can create, read, rename, delete, and monitor directories using both synchronous\
    \ and asynchronous methods. While synchronous methods are simple and easy to use,\
    \ asynchronous methods are preferred for performance-critical applications as\
    \ they do not block the event loop. Understanding these operations allows you\
    \ to manage your application's file structure effectively, ensuring smooth and\
    \ efficient handling of directories.\n\n## 3.3 Streams and Buffers\n\nSTREAMS\
    \ AND BUFFERS are fundamental to handling I/O operations efficiently in Node.js.\
    \ They enable reading and writing data in a continuous flow, making it possible\
    \ to work with large datasets or files without loading everything into memory\
    \ at once. Let's dive deep into these concepts to understand their roles and how\
    \ to use them effectively.\n\n![image](d2d_images/image180.png)\n\n### Understanding\
    \ Streams\n\nSTREAMS ARE OBJECT in Node.js that allow you to read data from a\
    \ source or write data to a destination in a sequential manner. They provide a\
    \ way to handle data in chunks, which is crucial for performance and memory management.\n\
    \n#### Types of Streams\n\n1. Readable Streams: Used to read data from a source.\n\
    2. Writable Streams: Used to write data to a destination.\n3. Duplex Streams:\
    \ Can both read and write data.\n4. Transform Streams: Duplex streams that can\
    \ modify or transform the data as it is read or written.\n\n#### Readable Streams\n\
    \nREADABLE STREAMS ALLOW you to read data from a source, such as a file or an\
    \ HTTP response.\n\nExample: Reading a File with Readable Streams\n\n```javascript\n\
    const fs = require('fs');\n\nconst readStream = fs.createReadStream('example.txt',\
    \ 'utf8');\n\nreadStream.on('data', (chunk) => {\n  console.log('Reading chunk:',\
    \ chunk);\n});\n\nreadStream.on('end', () => {\n  console.log('File completed');\n\
    });\n\nreadStream.on('error', (err) => {\n  console.error('Error reading:', err);\n\
    });\n```\n![image](d2d_images/image78.png)\n\nIn this example:\n* `fs.createReadStream('example.txt',\
    \ 'utf8')` creates a readable stream for `example.txt`.\n* The `data` event is\
    \ emitted each time a chunk is read.\n* The `end` event is emitted when the entire\
    \ file has been read.\n* The `error` event is emitted if an error occurs reading.\n\
    \n#### Writable Streams\n\nWRITABLE STREAMS ALLOW you to write data to a destination,\
    \ such as a file or a network socket.\n\nExample: Writing to a File with Writable\
    \ Streams\n\n```javascript\nconst fs = require('fs');\n\nconst writeStream = fs.createWriteStream('example.txt');\n\
    \nwriteStream.write('Hello, ', 'utf8');\nwriteStream.write('world!', 'utf8');\n\
    writeStream.end();\n\nwriteStream.on('finish', () => {\n  console.log('File writing\
    \ completed');\n});\n\nwriteStream.on('error', (err) => {\n  console.error('Error\
    \ writing to:', err);\n});\n```\n\nIn this example:\n* `fs.createWriteStream('example.txt')`\
    \ creates a writable stream for `example.txt`.\n* The `write` method writes data\
    \ to the stream.\n* The `end` method indicates that no more data will be written.\n\
    * The `finish` event is emitted when all data has been written.\n* The `error`\
    \ event is emitted if an error occurs writing.\n\n#### Duplex Streams\n\nDUPLEX\
    \ STREAMS CAN perform both read and write operations, making them useful for network\
    \ communications and similar tasks.\n\nExample: Using a Duplex Stream\n\n```javascript\n\
    const net = require('net');\n\nconst server = net.createServer((socket) => {\n\
    \  socket.write('Welcome to the server!\\n');\n\n  socket.on('data', (data) =>\
    \ {\n    console.log('Received:', data.toString());\n    socket.write('You said:\
    \ ' + data);\n  });\n\n  socket.on('end', () => {\n    console.log('Client disconnected');\n\
    \  });\n\n  socket.on('error', (err) => {\n    console.error('Error:', err);\n\
    \  });\n});\n\nserver.listen(3000, () => {\n  console.log('Server listening on\
    \ port 3000');\n});\n```\n\nIn this example:\n* `net.createServer` creates a TCP\
    \ server that uses duplex streams.\n* The `socket` object represents a duplex\
    \ stream that can read data from the client and write data back to the client.\n\
    \n#### Transform Streams\n\nTRANSFORM STREAMS ARE duplex streams that can modify\
    \ or transform the data as it is read or written. They are particularly useful\
    \ for tasks like data compression and encryption.\n\nExample: Transform Stream\
    \ with zlib\n\n```javascript\nconst fs = require('fs');\nconst zlib = require('zlib');\n\
    \nconst readStream = fs.createReadStream('example.txt', 'utf8');\n```\n"
