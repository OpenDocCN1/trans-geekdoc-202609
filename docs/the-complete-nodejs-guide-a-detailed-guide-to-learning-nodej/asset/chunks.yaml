    \n![image](d2d_images/image022.png)\n\nIN THIS EXAMPLE, WE create a new promise\
    \ that takes a function with two parameters: `resolve` and `reject`. These are\
    \ functions that JavaScript provides to handle the outcome of the promise. If\
    \ the condition is met, we call `resolve` with a success message; otherwise, we\
    \ call `reject` with an error message.\n\nThe `.then()` method is used to define\
    \ what happens when the promise is fulfilled, while `.catch()` handles any errors\
    \ if the promise is rejected.\n\n![image](d2d_images/image196.png)\n\n## Advanced\
    \ Promise Usage\n\nAS YOU ADVANCE, YOU will often need to handle multiple asynchronous\
    \ operations. This is where promises really shine, allowing you to chain operations\
    \ and manage them efficiently.\n\n### Chaining Promises\n\n```javascript\nconst\
    \ fetchData = new Promise((resolve, reject) => { \n  setTimeout(() => resolve(\"\
    Data fetched\"), 1000); \n}); \n\nconst processData = data => { \n  return new\
    \ Promise((resolve, reject) => { \n    setTimeout(() => resolve(`${data} and processed`),\
    \ 1000); \n  }); \n}; \n\nfetchData \n  .then(data => { \n    console.log(data);\
    \ // Output: Data fetched \n    return processData(data); \n  }) \n  .then(processedData\
    \ => { \n    console.log(processedData); // Output: Data fetched and processed\
    \ \n  }) \n  .catch(error => { \n    console.error(error); \n  });\n```\n\n–––––––\n\
    \n![image](d2d_images/scene_break.png)\n\n![image](d2d_images/image126.png)\n\n\
    HERE, WE CHAIN TWO promises: `fetchData` and `processData`. The second promise\
    \ starts only after the first one fulfills, ensuring a sequential execution of\
    \ asynchronous tasks.\n\n### Promise.all for Concurrent Execution\n\nSometimes,\
    \ you need to run multiple promises concurrently and wait for all of them to complete.\
    \ `Promise.all` is perfect for this scenario.\n\n```javascript\nconst promise1\
    \ = new Promise((resolve, reject) => setTimeout(resolve, 1000, 'First')); \n\n\
    const promise2 = new Promise((resolve, reject) => setTimeout(resolve, 2000, 'Second'));\
    \ \n\nconst promise3 = new Promise((resolve, reject) => setTimeout(resolve, 3000,\
    \ 'Third')); \n\nPromise.all([promise1, promise2, promise3]) \n  .then(results\
    \ => { \n    console.log(results); // Output: ['First', 'Second', 'Third'] \n\
    \  }) \n  .catch(error => { \n    console.error(error); \n  });\n```\n\n–––––––\n\
    \n![image](d2d_images/scene_break.png)\n\n![image](d2d_images/image106.png)\n\n\
    PROMISE.ALL takes an array of promises and returns a single promise that resolves\
    \ when all the promises in the array have resolved. It rejects if any of the promises\
    \ reject.\n\n## Introduction to Async/Await\n\nA SYNC/AWAIT IS SYNTACTIC sugar\
    \ built on top of promises, introduced in ES2017 (ES8). It makes asynchronous\
    \ code look and behave more like synchronous code, improving readability and maintainability.\n\
    \n### Creating an Async Function\n\nAn `async` function returns a promise. Inside\
    \ this function, you can use the `await` keyword to wait for a promise to resolve\
    \ or reject.\n\n```javascript\nasync function fetchData() { \n  try { \n    let\
    \ response = await fetch('https://api.example.com/data'); \n    let data = await\
    \ response.json(); \n    console.log(data); \n  } catch (error) { \n    console.error('Error\
    \ fetching data:', error); \n  } \n} \n\nfetchData();\n```\n\nIn this example,\
    \ the `fetchData` function is declared with the `async` keyword. Inside, `await`\
    \ pauses the execution until the promise from `fetch` resolves. If the promise\
    \ rejects, the error is caught in the `catch` block.\n\n### Handling Multiple\
    \ Async Operations\n\nJust like with `Promise.all`, you can handle multiple async\
    \ operations concurrently using `await` inside an `async` function.\n\n```javascript\n\
    async function fetchMultipleData() { \n  try { \n    let [response1, response2]\
    \ = await Promise.all([ \n      fetch('https://api.example.com/data1'), \n   \
    \   fetch('https://api.example.com/data2') \n    ]); \n    let data1 = await response1.json();\
    \ \n    let data2 = await response2.json(); \n    console.log('Data 1:', data1);\
    \ \n    console.log('Data 2:', data2); \n  } catch (error) { \n    console.error('Error\
    \ fetching data:', error); \n  } \n}\n```\n\nIn this example, `Promise.all` is\
    \ used to fetch two sources.\n\n### Error Handling with Async/Await\n\nANDLING\
    \ ERRORS IN async/await resembles `try/catch` blocks in synchronous code.\n\n\
    ```javascript\nasync function fetchDataWithErrorHandling() { \n  try { \n    let\
    \ response = await fetch('https://api.example.com/data'); \n    if (!response.ok)\
    \ { \n      throw new Error('Response was not ok'); \n    } \n    let data = await\
    \ response.json(); \n    console.log(data); \n  } catch (error) { \n    console.error('Error\
    \ fetching data:', error); \n  } \n} \n\nfetchDataWithErrorHandling();\n```\n\n\
    In this function, `try/catch` are used to handle any errors that occur during\
    \ the fetch.\n\n![image](d2d_images/image222.png)\n\n![image](d2d_images/image10.png)\n\
    \n## 2. Error Handling Strategies\n\nAS YOU ADVANCE IN YOUR JavaScript and Node.js\
