    \n# 第 6 ：运行你的 Node.js \n\n### 使用 VS Code 终端\n\n在 VS Code 中打开终端 (`Ctrl+`)。\n\n\
    使用 `start` 脚本运行你的应用程序：\n\n```bash\nnpm start\n```\n\nNodemon 将启动你的应用程序，并在你对代码进行更改时自动重启它。\n\
    \n![image](img/image174.png)\n\n![image](img/image011.png)\n\n通过在 Visual Studio\
    \ Code 中配置开发环境，你创建了一个专为 Node.js 开发定制的强大且高效的工作空间。通过正确的扩展、配置和工具，VS Code 可以显著简化你的工作流，让编码变得更加愉快且高效。\n\
    \n## 1.6. 创建一个基础 Web 服务器\n\n使用 Node.js 创建一个基础 WEB 服务器是理解该平台工作原理以及观察其简单性和强大性的极佳方式。让我们通过步骤设置你的第一个\
    \ Node.js Web 服务器，并解释每一个细节，确保初学者能够轻松跟上。\n\n### ![image](img/image091.png) 第 1\
    \ 步：设置你的项目\n\n在左侧的资源管理器面板中，点击“新建文件”按钮，或右键点击你的项目文件夹并选择“新建文件”。\n\n将文件命名为 `server.js`。这将是我们编写服务器代码的文件。\n\
    \n### 第 2 步：编写服务器代码\n\n编写代码：\n\n打开 `server.js` 并输入以下代码：\n\n```javascript\nconst\
    \ http = require('http');\n\nconst hostname = '127.0.0.1';\n\nconst port = 3000;\n\
    const server = http.createServer((req, res) => {\n  res.statusCode = 200;\n  res.setHeader('Content-Type',\
    \ 'text/plain');\n  res.end('Hello, World!\\n');\n});\n\nserver.listen(port, hostname,\
    \ () => {\n  console.log(`Server running at http://${hostname}:${port}/`);\n});\n\
    ```\n\n让我们拆解这段代码来理解每个部分的作用。\n\n#### 理解代码\n\n**导入 `http` 模块：**\n```javascript\n\
    const http = require('http');\n```\n此行导入了 Node.js 内置的 `http` 模块。模块是可重用的代码段，可以包含在你的应用程序中。`http`\
    \ 模块提供了创建 HTTP 服务器的功能，它可以处理 HTTP 请求和响应。\n\n**定义主机名和端口：**\n```javascript\nconst\
    \ hostname = '127.0.0.1';\nconst port = 3000;\n```\n这些行定义了服务器监听传入请求的主机名和端口号。`127.0.0.1`\
    \ 是本地地址，意味着服务器将只能从你的计算机访问。端口号 `3000` 是任意的，可以是一个任何可用端口，但 `3000` 常用于开发服务器。\n\n**创建服务器：**\n\
    ```javascript\nconst server = http.createServer((req, res) => {\n  res.statusCode\
    \ = 200;\n  res.setHeader('Content-Type', 'text/plain');\n  res.end('Hello, World!\\\
    n');\n});\n```\n此行创建了一个 HTTP 服务器。`createServer` 函数接收一个回调函数，该函数会在每次接收到请求时执行。回调函数有两个参数：`req`（请求对象）和\
    \ `res`（响应对象）。\n\n`req` 代表传入的请求，包含请求 URL、方法、标头等信息。\n`res` 代表输出的响应，我们用它向客户端发送数据。\n\
    \n在回调函数内部：\n- `res.statusCode = 200` 将 HTTP 状态码设置为 `200`，表示响应成功。\n- `res.setHeader('Content-Type',\
    \ 'text/plain')` 将 `Content-Type` 头部设置为 `text/plain`，表示响应内容为纯文本。\n- `res.end('Hello,\
    \ World!\\n')` 发送响应体 `Hello, World!` 并结束响应。`\\n` 在结尾添加了一个换行符。\n\n**启动服务器：**\n\
    ```javascript\nserver.listen(port, hostname, () => {\n  console.log(`Server running\
    \ at http://${hostname}:${port}/`);\n});\n```\n此行启动服务器并使其在指定的主机名和端口上监听。传递给 `listen`\
    \ 方法的回调将在服务器成功启动后执行一次。它向控制台打印消息，指示服务器正在运行并提供访问它的 URL。\n\n### 第 3 步：运行服务器\n\n**打开集成终端：**\n\
    通过按下 `` Ctrl+` `` 或从顶部菜单选择“终端” > “新建终端”来打开 VS Code 中的集成终端。\n\n**运行服务器：**\n在终端中，确保你处于该项目目录并运行以下命令：\n\
    \n```bash\nnode server.js\n```\nNodemon 将启动你的应用程序，并在你对代码进行更改时自动重启它。\n\n![image](img/image174.png)\n\
    \n![image](img/image011.png)\n\n**访问服务器：**\n打开你的浏览器并导航到 `http://127.0.0.1:3000/`。你应该能看到\
    \ `Hello, World!` 消息。\n\n### 第 4 步：尝试路由\n\n为了让你的服务器更具交互性，你可以扩展它来处理不同的路由。你可以：\n\
    \n**更新 `server.js` 文件：**\n```javascript\nconst http = require('http');\n\nconst\
    \ hostname = '127.0.0.1';\nconst port = 3000;\n\nconst server = http.createServer((req,\
    \ res) => {\n  res.setHeader('Content-Type', 'text/plain');\n  if (req.url ===\
    \ '/') {\n    res.statusCode = 200;\n    res.end('Welcome to the Home Page!\\\
    n');\n  } else if (req.url === '/about') {\n    res.statusCode = 200;\n    res.end('This\
    \ is the About Page!\\n');\n  } else {\n    res.statusCode = 404;\n    res.end('Page\
    \ Not Found\\n');\n  }\n});\n\nserver.listen(port, hostname, () => {\n  console.log(`Server\
    \ running at http://${hostname}:${port}/`);\n});\n```\n这段更新的代码通过检查 `req.url` 属性引入路由。\n\
    - 如果请求 URL 是 `/`，服务器响应 `Welcome to the Home Page!`。\n- 如果请求 URL 是 `/about`，服务器响应\
    \ `This is the About Page!`。\n- 对于任何其他 URL，服务器响应 `404` 状态码和 `Page Not Found`。\n\
    \n**重启服务器：**\n如果服务器已经在运行，在终端中按 `Ctrl+C` 停止它。再次运行服务器：\n\n```bash\nnode server.js\n\
    ```\n\n- 导航到 `http://127.0.0.1:3000/`。你应该看到 `Welcome to the Home Page!`。![image](img/image058.png)\n\
    - 导航到 `http://127.0.0.1:3000/about`。你应该看到 `This is the About Page!`。![image](img/image197.png)\n\
    - 导航到任何其他 URL，例如 `http://127.0.0.1:3000/contact`。你应该看到 `Page Not Found`。![image](img/image079.png)\n\
    \n这个示例演示了如何在 Node.js 服务器中处理不同的路由。通过检查 `req.url` 属性，你可以为不同的端点创建自定义响应。![image](img/image163.png)\n\
    \n"
- fmt: "\nIn the upcoming chapters, we'll dive deeper into the core concepts of Node.js,\
    \ explore its powerful features, and build more sophisticated applications. For\
    \ now, take a moment to appreciate the simplicity and power of Node.js, and get\
    \ ready for the exciting journey ahead!\n\n|  ![image](d2d_images/chapter_title_corner_decoration_left.png)\
