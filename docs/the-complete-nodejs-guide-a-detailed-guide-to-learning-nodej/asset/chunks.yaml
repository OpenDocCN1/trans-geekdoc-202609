    \  .then(results => {\n    console.log(results);\n  })\n  .catch(error => {\n\
    \    console.error('One of the promises failed:', error);\n  });\n```\n\nHere,\
    \ `promise2` is rejected, so the `.catch()` block will handle the error, and the\
    \ operation will not log the results of the other promises.\n\n### Handling Errors\
    \ with Async/Await\n\nA `SYNC/AWAIT`, introduced in ES2017, simplifies working\
    \ with promises and provides a synchronous-like way to handle asynchronous code.\
    \ It also integrates well with `try/catch` for error handling.\n\n#### Using Try/Catch\
    \ with Async/Await\n\n```javascript\nasync function fetchData() {\n  try {\n \
    \   let response = await fetch('https://api.example.com/data');\n    let data\
    \ = await response.json();\n    console.log(data);\n  } catch (error) {\n    console.error('Error\
    \ fetching data:', error);\n  }\n}\n\nfetchData();\n```\n\nIn this example, any\
    \ errors occurring during the fetch operation or while parsing the JSON response\
    \ are caught and handled in the `catch` block.\n\n#### Handling Multiple Async\
    \ Operations\n\nUsing `Promise.all` with `async/await` allows you to handle multiple\
    \ asynchronous operations concurrently and catch errors effectively.\n\n```javascript\n\
    async function fetchMultipleData() {\n  try {\n    let [response1, response2]\
    \ = await Promise.all([\n      fetch('https://api.example.com/data1'),\n     \
    \ fetch('https://api.example.com/data2')\n    ]);\n    let data1 = await response1.json();\n\
    \    let data2 = await response2.json();\n    console.log('Data 1:', data1);\n\
    \    console.log('Data 2:', data2);\n  } catch (error) {\n    console.error('Error\
    \ fetching data:', error);\n  }\n}\n\nfetchMultipleData();\n```\n\n### Centralized\
    \ Error Handling in Node.js\n\nFOR LARGER APPLICATIONS, having a centralized error-handling\
    \ mechanism can simplify error management and improve code maintainability.\n\n\
    #### Error Handling Middleware\n\nIn an Express application, you can create an\
    \ error-handling middleware function.\n\n```javascript\nconst express = require('express');\n\
    const app = express();\n\n// Error handling middleware\napp.use((err, req, res,\
    \ next) => {\n  console.error(err.stack);\n  res.status(500).send('Something broke!');\n\
    });\n\n// Simulate an error\napp.get('/', (req, res) => {\n  throw new Error('Simulated\
    \ error');\n});\n\nconst PORT = 3000;\napp.listen(PORT, () => {\n  console.log(`Server\
    \ running on port ${PORT}`);\n});\n```\n\nIn this example, any error thrown in\
    \ the route handlers will be passed to the error-handling middleware, which logs\
    \ the error and sends a response to the client.\n\n![image](d2d_images/image027.png)\n\
    \n#### Creating Custom Error Classes\n\nCREATING CUSTOM ERROR classes can provide\
    \ more context and control over error handling.\n\n```javascript\nclass CustomError\
    \ extends Error {\n  constructor(message, statusCode) {\n    super(message);\n\
    \    this.statusCode = statusCode;\n  }\n}\n\nfunction riskyOperation() {\n  throw\
    \ new CustomError('Operation failed!', 400);\n}\n\ntry {\n  riskyOperation();\n\
    } catch (error) {\n  if (error instanceof CustomError) {\n    console.error(`Custom\
    \ error occurred: ${error.message} (Status Code: ${error.statusCode})`);\n  }\
    \ else {\n    console.error('An unexpected error occurred:', error);\n  }\n}\n\
    ```\n\nIn this example, the `CustomError` class extends the built-in `Error` class,\
    \ adding a `statusCode` property. This allows for more granular error handling\
    \ based on the type of error.\n\n![image](d2d_images/image086.png)\n\n## 7.3.\
    \ Event Emitters\n\nAS YOU CONTINUE TO dive deeper into Node.js, one of the core\
    \ concepts you will encounter is the event-driven architecture. This approach\
    \ is a fundamental part of how Node.js handles asynchronous operations and scales\
    \ efficiently. At the heart of this architecture is the `EventEmitter` class.\
    \ Understanding how to use event emitters effectively can greatly enhance your\
    \ ability to build responsive, scalable applications.\n\n#### What Are Event Emitters?\n\
    \nEVENT EMTERS ARE objects that can emit named events and register listeners for\
    \ those events. When an event is emitted, all the listeners registered for that\
    \ event are called synchronously. This mechanism is central to many parts of Node.js,\
    \ from the core modules to custom modules.\n\nImagine you're at a concert. The\
    \ band (emitter) plays music (emits an event), and the audience (listeners) reacts\
    \ by clapping, singing.\n\n#### Creating and Using Emitters\n\nLET'S START WITH\
    \ A simple example to see how emitters work.\n\n```javascript\nconst EventEmitter\
    \ = require('events');\n\nclass MyEmitter extends EventEmitter {}\n\nconst myEmitter\
    \ = new MyEmitter();\n\n// Register a listener for the 'greet' event\nmyEmitter.on('greet',\
    \ () => {\n  console.log('Hello! The greet event was emitted.');\n});\n\n// Emit\
    \ the 'greet' event\nmyEmitter.emit('greet');\n```\n\n![image](d2d_images/image164.png)\n\
    \nIn this example, we first import the `EventEmitter` class and create a new class\
    \ that extends `EventEmitter`. We then create an instance of this class, register\
    \ a listener for the `greet` event using the `on` method, and finally, emit the\
    \ `greet` event using the `emit` method.\n\n![image](d2d_images/image080.png)\n\
    \n#### Handling Multiple Events\n\nAN EMITTER CAN HAVE multiple events and listeners.\
    \ Each listener can be specific to an event, making it a powerful tool for managing\
    \ complex behaviors.\n\n```javascript\nconst EventEmitter = require('events');\n\
    \nclass MyEmitter extends EventEmitter {}\n\nconst myEmitter = new MyEmitter();\n\
    \n// Register multiple listeners for different events\nmyEmitter.on('start', ()\
    \ => {\n  console.log('Starting...');\n});\n\nmyEmitter.on('progress', (percent)\
    \ => {\n  console.log(`Progress: ${percent}%`);\n});\n\nmyEmitter.on('finish',\
    \ () => {\n  console.log('Finished!');\n});\n\n// Emit events\nmyEmitter.emit('start');\n\
    myEmitter.emit('progress', 50);\nmyEmitter.emit('progress', 75);\nmyEmitter.emit('finish');\n\
    ```\n\n![image](d2d_images/scene_break.png)\n![image](d2d_images/image092.png)\n\
    \nIN THIS EXAMPLE, WE have three events: 'start', 'progress', and 'finish'. Each\
    \ event has its own listener. When we emit these events, the corresponding listeners\
    \ are invoked with any provided arguments, allowing us to handle different parts\
    \ of a process.\n\n#### Removing Listeners\n\nSOMETIMES, YOU MAY need to remove\
    \ listeners to prevent memory leaks or to stop listening to certain events under\
    \ specific conditions. You can use the `removeListener` or `removeAllListeners`\
    \ methods for this purpose.\n\n```javascript\nconst EventEmitter = require('events');\n\
    \nclass MyEmitter extends EventEmitter {}\n\nconst myEmitter = new MyEmitter();\n\
    \nfunction onGreet() {\n  console.log('Hello! The greet event was emitted.');\n\
    }\n\n// Register the listener\nmyEmitter.on('greet', onGreet);\n\n// Emit the\
    \ 'greet' event\nmyEmitter.emit('greet');\n```\n"
