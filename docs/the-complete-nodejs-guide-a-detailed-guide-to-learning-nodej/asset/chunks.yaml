  trans: "\n\n* 服务端代码中的脚本错误。\n* 资源耗尽（例如，内存溢出）。\n* 服务器尝试访问的第三方服务或 API 问题。\n\n处理方式：当发生\
    \ `500` 错误时，服务器应记录错误详情以便进一步调查，并向用户返回通用的错误消息，以避免暴露敏感信息。此外，良好的做法是显示自定义错误页面，告知用户出现的问题，并在可能的情况下提供报告问题的方法。\n\
    \n## HTTP 状态码详细说明\n\n### 1xx 信息性\n* `100 Continue`: 服务器已接收请求头，客户端应继续发送请求体。\n*\
    \ `101 Switching Protocols`: 请求者要求服务器切换协议，服务器对此确认将执行该操作。\n\n### 2xx 成功\n* `200\
    \ OK`: 请求成功。成功的含义取决于 HTTP 方法（`GET`、`POST`、`PUT`、`DELETE`）。\n* `201 Created`: 请求已成功导致了新资源的创建。\n\
    * `204 No Content`: 服务器成功处理了请求，但没有返回任何内容。\n\n### 3xx 重定向\n* `301 Moved Permanently`:\
    \ 请求资源的 URL 已永久重定向。响应中给出了新 URL。\n* `302 Found`: 请求资源的 URL 已临时重定向。\n* `304 Not\
    \ Modified`: 表示资源自上次请求以来未被修改。\n\n### 4xx 客户端错误\n* `400 Bad Request`: 由于客户端错误，服务器无法处理请求（例如，请求语法格式错误）。\n\
    * `401 Unauthorized`: 请求需要用户认证。\n* `403 Forbidden`: 服务器理解了请求，但拒绝授权。\n* `404 Not\
    \ Found`: 服务器找不到请求的资源。\n* `408 Request Timeout`: 服务器等待请求超时。\n\n### 5xx 服务端错误\n\
    * `500 Internal Server Error`: 服务器遇到意外情况，导致无法完成请求。\n* `501 Not Implemented`: 服务器不支持完成请求所需的功能。\n\
    * `502 Bad Gateway`: 服务器在充当网关或代理角色时，从上游服务器接收到了无效响应。\n* `503 Service Unavailable`:\
    \ 服务器未准备好处理请求，通常是因为临时过载或维护。\n* `504 Gateway Timeout`: 服务器在充当网关或代理角色时，未从上游服务器收到及时的响应。\n\
    \n| 状态码 | 含义 | 描述 |\n| :--- | :--- | :--- |\n| 1xx Informational | | |\n| 100\
    \ | Continue | 服务器已接收请求头，客户端应继续发送请求体。 |\n| 101 | Switching Protocols | 请求者要求服务器切换协议，服务器对此确认将执行该操作。\
    \ |\n| 2xx Successful | | |\n| 200 | OK | 请求成功。 |\n| 201 | Created | 请求已成功导致了新资源的创建。\
    \ |\n| 204 | No Content | 服务器成功处理了请求，但没有返回任何内容。 |\n| 3xx Redirection | | |\n|\
    \ 301 | Moved Permanently | 请求资源的 URL 已永久重定向。 |\n| 302 | Found | 请求资源的 URL 已临时重定向。\
    \ |\n| 304 | Not Modified | 表示资源自上次请求以来未被修改。 |\n| 4xx Client Error | | |\n| 400\
    \ | Bad Request | 由于客户端错误，服务器无法处理请求（例如，请求语法格式错误）。 |\n| 401 | Unauthorized | 请求需要用户认证。\
    \ |\n| 403 | Forbidden | 服务器理解了请求，但拒绝授权。 |\n| 404 | Not Found | 服务器找不到请求的资源。 |\n\
    | 408 | Request Timeout | 服务器等待请求超时。 |\n| 5xx Server Error | | |\n| 500 | Internal\
    \ Server Error | 服务器遇到意外情况，导致无法完成请求。 |\n| 501 | Not Implemented | 服务器不支持完成请求所需的功能。\
    \ |\n| 502 | Bad Gateway | 服务器在充当网关或代理角色时，从上游服务器接收到了无效响应。 |\n| 503 | Service Unavailable\
    \ | 服务器未准备好处理请求，通常是因为临时过载或维护。 |\n| 504 | Gateway Timeout | 服务器在充当网关或代理角色时，未从上游服务器收到及时的响应。\
    \ |\n\n##  HTTP 状态码\n\n 理解 HTTP 方法\nHTTP 方法（称为动词）是用于网络通信的 HTTP 协议的基础部分。这些方法定义了对\
    \ URL 标识的资源上要执行的操作。最常用的方法是 `GET`、`POST`、`PUT` 和 `DELETE`，但还有其他方法如 `PATCH`、`OPTIONS`\
    \ 和 `HEAD`，它们都有特定的用途。\n\n### HTTP 方法详细说明\n\n#### GET 方法\n定义：`GET` 方法用于从指定的资源请求数据。使用\
    \ `GET` 的请求应只检索数据，不对数据产生任何其他影响。\n特性：\n* `幂等性`: 多次相同的 `GET` 请求产生的结果应与单个请求相同。\n\
    * `安全性`: 不改变服务器状态。\n* `可缓存性`: 对 `GET` 请求的响应可以缓存以提高性能。\n用途：\n* 获取网页。\n* 从服务器检索数据。\n\
    示例：\n```\nGET /users HTTP/1.1\nHost: example.com\n```\n在此示例中，向 `/users` 节点发送了\
    \ `GET` 请求，以获取用户列表。\n\n#### POST 方法\n定义：`POST` 方法用于向服务器发送数据以创建或更新资源。数据包含在请求的（体中。\n\
    特性：\n* `非幂等性`: 多次相同的 `POST` 请求可能会产生不同的影响。\n* `非安全性`: 会改变服务器状态。\n* `不可缓存性`: 对 `POST`\
    \ 请求的响应通常不会缓存。\n用途：\n* 提交表单数据。\n* 上传文件。\n* 在服务器上创建新资源。\n示例：\n```http\nPOST /users\
    \ HTTP/1.1\nHost: example.com\nContent-Type: application/json\n\n{\n  \"name\"\
    : \"John Doe\",\n  \"email\": \"john.doe@example.com\"\n}\n```\n在此示例中，向 `/users`\
    \ 节点发送了带有请求数据的 `POST` 请求，以创建一个新用户。\n\n#### PUT 方法\n定义：`PUT` 方法用于用新数据更新当前资源。如果资源不存在，`PUT`\
    \ 可以创建它。\n特性：\n* `幂等性`: 多次相同的 `PUT` 请求产生的结果应与单个请求相同。\n* `非安全性`: 会改变服务器状态。\n* `不可缓存性`:\
    \ 对 `PUT` 请求的响应通常不会缓存。\n用途：\n* 更新现有资源。\n* 在指定的 URL 创建资源。\n示例：\n```http\nPUT /users/1\
    \ HTTP/1.1\nHost: example.com\nContent-Type: application/json\n\n{\n  \"name\"\
    : \"John Doe\",\n  \"email\": \"john.doe@example.com\"\n}\n```\n在此示例中，向 `/users/1`\
    \ 节点发送了 `PUT` 请求，以更新 ID 为 1 的用户。\n\n#### DELETE 方法\n定义：`DELETE` 方法用于删除指定的资源。\n\
    特性：\n\n"
- fmt: "\n### DELETE Method\n\n- **Idempotent**: Multiple identical DELETE requests\
    \ should have the same effect as a single request.\n- **Not Safe**: Alters the\
    \ state of the server.\n- **Not Cachable**: Responses to DELETE requests are typically\
    \ not cached.\n\n**Usage**:\n- Removing resources from the server.\n\n**Example**:\n\
    ```http\nDELETE /users/1 HTTP/1.1\nHost: example.com\n```\n\n**Explanation**:\
    \ In this example, a `DELETE` request is made to the `/users/1` endpoint to delete\
    \ the user with ID 1.\n\n### PATCH Method\n\n**DEFINITION**: The `PATCH` method\
    \ is used to apply partial modifications to a resource.\n\n**Characteristics**:\n\
    - **Not Idempotent**: Multiple identical PATCH requests can have different effects.\n\
    - **Not Safe**: Alters the state of the server.\n- **Not Cachable**: Responses\
    \ to PATCH requests are typically not cached.\n\n**Usage**:\n- Partially updating\
    \ resources.\n\n**Example**:\n```http\nPATCH /users/1 HTTP/1.1\nHost: example.com\n\
    Content-Type: application/json\n\n{\n \"email\": \"john.newemail@example.com\"\
    \n}\n```\nIn this example, a `PATCH` request is made to the `/users/1` endpoint\
    \ to update only the email of the user with ID 1.\n\n### OPTIONS Method\n\n**DEFINITION**:\
    \ The `OPTIONS` method is used to describe the communication options for the target\
    \ resource.\n\n**Characteristics**:\n- **Idempotent**: Multiple identical OPTIONS\
    \ requests should have the same effect as a single request.\n- **Safe**: Does\
    \ not alter the state of the server.\n- **Not Cachable**: Responses to OPTIONS\
    \ requests are typically not cached.\n\n**Usage**:\n- Checking what HTTP methods\
    \ are supported by a server.\n\n**Example**:\n```http\nOPTIONS /users HTTP/1.1\n\
    Host: example.com\n```\nIn this example, an `OPTIONS` request is made to the `/users`\
    \ endpoint to determine the methods supported by the server for this resource.\n\
    \n### HEAD Method\n\n**DEFINITION**: The `HEAD` method is identical to `GET` except\
    \ that the server MUST NOT return a message body in the response. It is useful\
    \ for retrieving meta-information written in response headers, without having\
    \ to transport the entire content.\n\n**Characteristics**:\n- **Idempotent**:\
    \ Multiple identical HEAD requests should have the same effect as a single request.\n\
    - **Safe**: Does not alter the state of the server.\n- **Cachable**: Responses\
    \ to HEAD requests can be cached.\n\n**Usage**:\n- Checking if a resource exists.\n\
    - Fetching meta-information about a resource.\n\n```http\nHEAD /users HTTP/1.1\n\
    Host: example.com\n```\nIn this example, a `HEAD` request is made to the `/users`\
    \ endpoint to retrieve headers without the response body.\n\n| HTTP Method | Idempotent\
    \ | Safe | Cacheable | Description |\n| :--- | :--- | :--- | :--- | :--- |\n|\
    \ GET | Yes | Yes | Yes | Retrieve data from a specified resource. |\n| POST |\
    \ No | No | No | Send data to the server to create/update a resource. |\n| PUT\
    \ | Yes | No | No | Update a resource or create it if it does not exist. |\n|\
    \ DELETE | Yes | No | No | Delete a specified resource. |\n| PATCH | No | No |\
    \ No | Apply partial modifications to a resource. |\n| OPTIONS | Yes | Yes | No\
    \ | Describe the communication options for the resource. |\n| HEAD | Yes | Yes\
    \ | Yes | Retrieve headers for a resource without the body. |\n\nTable.3 of HTTP\
    \ Methods\n\n![image](d2d_images/image198.png)\n\n## 4.1. Creating a Simple Web\
    \ Server\n\nCreating a simple web server in Node.js is an essential step in understanding\
    \ how server-side applications work. Node.js's built-in `http` module provides\
    \ all the functionality to set up a server.\n\n### Step 1: Import the HTTP Module\n\
    First, you need to import the `http` module. You don't need to install anything.\n\
    ```javascript\nconst http = require('http');\n```\n\n### Step 2: Create the Server\n\
    The `createServer` method creates a server instance. The callback function takes\
    \ two parameters: `req` (the request object) and `res` (the response object).\n\
    ```javascript\nconst server = http.createServer((req, res) => {\n    // logic\
    \ goes here\n});\n```\n\n### Step 3: Listen on a Port\nTell the server to listen\
    \ on a port. Commonly used ports for development are 3000, 8080, and 5000.\n```javascript\n\
    const PORT = 3000;\nserver.listen(PORT, () => {\n    console.log(`Server running\
    \ at http://localhost:${PORT}`);\n});\n```\n\n### Complete Example\n```javascript\n\
    const http = require('http');\n\nconst server = http.createServer((req, res) =>\
    \ {\n    res.statusCode = 200;\n    res.setHeader('Content-Type', 'text/plain');\n\
    \    res.end('Hello, World!\\n');\n});\n\nconst PORT = 3000;\nserver.listen(PORT,\
    \ () => {\n    console.log(`Server running at http://localhost:${PORT}`);\n});\n\
    ```\n"
