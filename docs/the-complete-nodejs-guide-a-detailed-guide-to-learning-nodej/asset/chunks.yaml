    \ 部分列出了项目所需的包及其版本。\n\n| 命令 | 描述 |\n| --- | --- |\n| `npm init` | 初始化一个新的 Node.js\
    \ 项目并创建一个包含元数据和依赖项的 `package.json` 文件。 |\n| `npm init -y` | 使用默认值初始化一个新的 Node.js\
    \ 项目，跳过交互式提示。 |\n| `npm install <package>` | 安装一个包并将其添加到 `package.json` 的 `dependencies`\
