    \    (() => { \n\n throw err; \n\n }); \n\n } \n\n connection.    commit    ((err)\
    \ => { \n\n if (err) { \n\n return connection.    rollback    (() => { \n\n throw\
    \ err; \n\n }); \n\n } \n\n console.    log    ('Transaction Complete.'); \n\n\
    \ }); \n\n }); \n\n }); \n\n }); \n\n Indexing: \n\n Indexes improve the speed\
    \ of data retrieval operations on a database table.   They are particularly useful\
