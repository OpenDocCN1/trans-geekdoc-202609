    \ Internal Server Errors`）、创建自定义错误页面以及为了调试目的记录错误。\n\n#### 处理 404 Not Found\n\n\
    当服务器上未找到请求资源时，会发生 `404 错误`。捕获此错误并提供用户友好的消息而不是通用的浏览器错误页面是很重要的。\n\n#### 使用 Express\
    \ 的示例：\n\n```javascript\nconst express = require('express');\nconst app = express();\n\
    \n// 在此处定义你的路由\n\n// 捕获 404 并转发到错误处理器\napp.use((req, res, next) => {\n  res.status(404).send('404\
    \ Not Found');\n});\n\nconst PORT = 3000;\napp.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n\n解释：\n\n* 在定义路由之后，使用中间件函数捕获所有未匹配的路由。\n\
    * 将状态码设置为 `404` 并发送用户友好的消息。\n\n![image](img/image119.png)\n\n![image](img/image169.png)\n\
    \n#### 处理 500 Internal Server Errors\n\n`500 错误指示` 表示服务器端发生了问题。记录这些错误并向用户提供通用消息以避免暴露敏感信息是非常重要的。\n\
    \n#### 使用 Express 的示例：\n\n```javascript\nconst express = require('express');\n\
    const app = express();\n\n// 模拟一个错误\napp.get('/error', (req, res, next) => {\n\
    \  const err = new Error('Something went wrong!');\n  err.status = 500;\n  next(err);\n\
    });\n\n// 错误处理\napp.use((err, res, next) => {\n  console.error(err.stack);\n \
