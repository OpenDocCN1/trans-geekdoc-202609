  trans: "\n\n`PUT` 请求用于更新服务器上的资源。如果资源不存在，它们也可以用于创建资源。`PUT` 请求通常在请求体中包含数据。\n\n###\
    \ 示例代码\n```javascript\nconst http = require('http');\n\nconst server = http.createServer((req,\
    \ res) => {\n  if (req.method === 'PUT') {\n    let body = '';\n    req.on('data',\
    \ chunk => {\n      body += chunk.toString();\n    });\n    req.on('end', () =>\
    \ {\n      res.statusCode = 200;\n      res.setHeader('Content-Type', 'application/json');\n\
    \      res.end(`Updated data: ${body}`);\n    });\n  } else {\n    res.statusCode\
    \ = 405;\n    res.end('Method Not Allowed');\n  }\n});\n\nconst PORT = 3000;\n\
    \nserver.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n### 测试\n1. 打开 Postman 并创建一个新的 `PUT` 请求。\n2. 将 URL 设置为 `http://localhost:3000`。\n\
    3. 转到 `Body` 标签页，选择 `raw` 和 `JSON`，并输入：\n```json\n{\n  \"name\": \"John\",\n \
    \ \"age\": 31\n}\n```\n- 点击 `Send`。\n- 你将看到包含更新数据的响应：\n![image](img/image208.png)\n\
    \n### 处理 DELETE 请求\n`DELETE` 请求用于删除服务器上的资源。\n\n#### 示例\n```javascript\nconst http\
    \ = require('http');\n\nconst server = http.createServer((req, res) => {\n  if\
    \ (req.method === 'DELETE') {\n    const urlParts = req.url.split('/');\n    const\
    \ id = urlParts[urlParts.length - 1];\n    res.statusCode = 200;\n    res.setHeader('Content-Type',\
    \ 'text/plain');\n    res.end(`Resource with ID ${id} deleted`);\n  } else {\n\
    \    res.statusCode = 405;\n    res.end('Method Not Allowed');\n  }\n});\n\nconst\
    \ PORT = 3000;\n\nserver.listen(PORT, () => {\n  console.log(`Server running at\
    \ http://localhost:${PORT}/`);\n});\n```\n\n#### 测试\n1. 打开 Postman 并创建一个新的 `DELETE`\
    \ 请求。\n2. 将 URL 设置为 `http://localhost:3000/resource/123`。\n![image](img/image043.png)\n\
    1. 点击 `Send`。\n2. 你应该看到指示资源已删除响应：\n`Resource with ID 123 deleted`\n\n### 处理其他\
    \ HTTP 方法 (PATCH, OPTIONS, HEAD)\n\n#### PATCH: 用于对资源进行部分修改。\n\n##### 示例\n```javascript\n\
    const http = require('http');\n\nconst server = http.createServer((req, res) =>\
    \ {\n  if (req.method === 'PATCH') {\n    let body = '';\n    req.on('data', chunk\
    \ => {\n      body += chunk.toString();\n    });\n    req.on('end', () => {\n\
    \      res.statusCode = 200;\n      res.setHeader('Content-Type', 'application/json');\n\
    \      res.end(`Patched data: ${body}`);\n    });\n  } else {\n    res.statusCode\
    \ = 405;\n    res.end('Method Not Allowed');\n  }\n});\n\nconst PORT = 3000;\n\
    \nserver.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n##### 测试\n1. 打开 Postman 并创建一个新的 `PATCH` 请求。\n2. 将 URL 设置为 `http://localhost:3000`。\n\
    3. 转到 `Body` 标签页，选择 `raw` 和 `JSON`，并输入：\n```json\n{\n  \"name\": \"John\",\n \
    \ \"age\": 32\n}\n```\n- 点击 `Send`。\n- 你将看到包含修改后数据的响应：\n```json\n{\n  \"Patched\
    \ data\": \"{\\\"name\\\":\\\"John\\\",\\\"age\\\":32}\"\n}\n```\n![image](img/image127.png)\n\
    \n#### OPTIONS: 用于描述目标资源的通信选项。\n\n##### 示例\n```javascript\nconst http = require('http');\n\
    \nconst server = http.createServer((req, res) => {\n  if (req.method === 'OPTIONS')\
    \ {\n    res.statusCode = 200;\n    res.setHeader('Allow', 'GET, POST, PUT, DELETE,\
    \ PATCH, OPTIONS');\n  } else {\n    res.statusCode = 405;\n    res.end('Method\
    \ Not Allowed');\n  }\n});\n\nconst PORT = 3000;\n\nserver.listen(PORT, () =>\
    \ {\n  console.log(`Server running at http://localhost:${PORT}/`);\n});\n```\n\
    \n##### 测试\n1. 打开 Postman 并创建一个新的 `OPTIONS` 请求。\n2. 将 URL 设置为 `http://localhost:3000`。\n\
    3. 点击 `Send`。\n4. 你将看到响应：\n`Allow: GET, POST, PUT, DELETE, PATCH, OPTIONS`\n\n\
    ### 解析与管理数据\n`JSON` 是一种轻量级的数据交换格式，易于人类读写，也易于机器解析和生成。\n\n#### 核心模块示例\n```javascript\n\
    const http = require('http');\n\nconst server = http.createServer((req, res) =>\
    \ {\n  if (req.method === 'POST' && req.headers['content-type'] === 'application/json')\
    \ {\n    let body = '';\n    req.on('data', chunk => {\n      body += chunk.toString();\n\
    \    });\n    req.on('end', () => {\n      try {\n        const parsedData = JSON.parse(body);\n\
    \        res.statusCode = 200;\n        res.setHeader('Content-Type', 'application/json');\n\
    \        res.end(JSON.stringify({ received: parsedData }));\n      } catch (err)\
    \ {\n        res.statusCode = 400;\n        res.end('Invalid JSON');\n      }\n\
    \    });\n  } else {\n    res.statusCode = 405;\n    res.end('Method Not Allowed');\n\
    \  }\n});\n\nconst PORT = 3000;\n\nserver.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n#### 说明\n* 此代码段设置了一个服务器，监听\
    \ `Content-Type` 为 `application/json` 的 `POST` 请求。\n* 服务器读取请求体，将其解析，并返回解析后的数据。\n\
    * 如果 JSON 无效，它将返回 `400 Bad Request` 状态。\n\n#### 使用 Postman 测试\n1. 创建 `POST` 请求。\n\
    2. 将 URL 设置为 `http://localhost:3000`。\n3. 将 `Content-Type` 请求头设置为 `application/json`。\n\
    4. 在 `Body` 标签页中，选择 `raw` 和 `JSON`，然后输入：\n```json\n{\n  \"name\": \"John\",\n\
    \  \"age\": 30\n}\n```\n点击 `Send`。\n\n"
- fmt: "\n- The server reads the request body, parses it using `querystring.parse`,\
    \ and responds with the parsed data.\n\n### Testing with Postman:\n\n1. Create\
    \ a new `POST` request.\n2. Set the URL to `http://localhost:3000`.\n3. Set the\
    \ `Content-Type` header to `application/x-www-form-urlencoded`.\n4. In the `Body`\
    \ tab, select `x-www-form-urlencoded`, then add key-value pairs like `name=John`\
    \ and `age=30`.\n5. Click `Send`.\n\n![image](d2d_images/image015.png)\n\n![image](d2d_images/image201.png)\n\
    \n### Handling Multipart Form Data (File Uploads)\n\n`MULTIPART FORM DATA` is\
    \ used for file uploads and can contain both text and binary data. To handle multipart\
    \ form data, you typically use a middleware library like `multer` with `Express`.\
    \ \n\n#### Example with Express and Multer:\n\nInstall Express and Multer:\n\n\
    ```bash\nnpm install express multer\n```\n\nSet Up the Server:\n\n```javascript\n\
    const express = require('express');\nconst multer = require('multer');\nconst\
    \ path = require('path');\nconst app = express();\nconst upload = multer({ dest:\
    \ 'uploads/' });\n\napp.post('/upload', upload.single('file'), (req, res) => {\n\
    \  res.statusCode = 200;\n  res.setHeader('Content-Type', 'application/json');\n\
    \  res.end(JSON.stringify({ file: req.file }));\n});\n\nconst PORT = 3000;\napp.listen(PORT,\
    \ () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n});\n\
    ```\n\nExplanation:\n\n* This code snippet sets up an `Express` server with `Multer`\
    \ middleware to handle file uploads.\n* The `upload.single('file')` middleware\
    \ processes single file uploads with the form field name `file`.\n* The server\
    \ responds with information about the uploaded file.\n\n### Testing with Postman:\n\
    \n1. Create a new `POST` request.\n2. Set the URL to `http://localhost:3000/upload`.\n\
    3. In the `Body` tab, select `form-data`.\n\n![image](d2d_images/image000.png)\n\
    \n1. Add a key `file` and set the type to `File`.\n\n![image](d2d_images/image030.png)\n\
    \n1. Choose a file to upload.\n\n![image](d2d_images/image034.png)\n\n1. Click\
    \ `Send`.\n\n![image](d2d_images/image061.png)\n\n![image](d2d_images/image185.png)\n\
    \n![image](d2d_images/image017.png)\n\n![image](d2d_images/image023.png)\n\n![image](d2d_images/image096.png)\n\
    \n### Error Handling\n\n`PROPER ERROR HANDLING` is essential for creating a robust\
    \ and user-friendly application. In web development, it's important to manage\
    \ different types of errors gracefully and provide meaningful feedback to users.\
    \ This section covers handling common HTTP errors like `404 Not Found` and `500\
    \ Internal Server Errors`, creating custom error pages, and logging errors for\
    \ debugging purposes.\n\n#### Handling 404 Not Found\n\nA `404 ERROR OCCURS` when\
    \ the requested resource is not found on the server. It's important to catch this\
    \ error and provide a user-friendly message instead of a generic browser error\
    \ page.\n\n#### Example with Express:\n\n```javascript\nconst express = require('express');\n\
    const app = express();\n\n// Define your routes here\n\n// Catch 404 and forward\
    \ to error handler\napp.use((req, res, next) => {\n  res.status(404).send('404\
    \ Not Found');\n});\n\nconst PORT = 3000;\napp.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n\nExplanation:\n\n* After\
    \ defining your routes, use a middleware function to catch all unmatched routes.\n\
    * Set the status code to `404` and send a user-friendly message.\n\n![image](d2d_images/image119.png)\n\
    \n![image](d2d_images/image169.png)\n\n#### Handling 500 Internal Server Errors\n\
    \nA `500 ERROR INDICATES` that something went wrong on the server side. It's important\
    \ to log these errors and provide a generic message to the user to avoid exposing\
    \ sensitive information.\n\n#### Example with Express:\n\n```javascript\nconst\
    \ express = require('express');\nconst app = express();\n\n// Simulate an error\n\
    app.get('/error', (req, res, next) => {\n  const err = new Error('Something went\
    \ wrong!');\n  err.status = 500;\n  next(err);\n});\n\n// Error handling\napp.use((err,\
    \ res, next) => {\n  console.error(err.stack);\n  res.status(err.status || 500).send('500\
    \ Internal Server Error');\n});\n\nconst PORT = 3000;\napp.listen(PORT, () =>\
    \ {\n  console.log(`Server running at http://localhost:${PORT}/`);\n});\n```\n\
    \n#### Custom Error Pages\n\n`CUSTOM ERROR PAGES` improve user experience by providing\
    \ more context when errors occur.\n\n#### Example with Express:\n\n```javascript\n\
    const express = require('express');\nconst path = require('path');\nconst app\
    \ = express();\n\n// Serve static files from the \"public\" directory\napp.use(express.static(path.join(__dirname,\
    \ 'public')));\n\n// Define your routes here\n\n// Catch 404 and forward to error\
    \ handler\napp.use((req, res, next) => {\n  res.status(404).sendFile(path.join(__dirname,\
    \ 'public', '404.html'));\n});\n\n// Error handling\napp.use((err, res, next)\
    \ => {\n  console.error(err.stack);\n  res.status(err.status || 500).sendFile(path.join(__dirname,\
    \ 'public', '500.html'));\n});\n\nconst PORT = 3000;\napp.listen(PORT, () => {\n\
    \  console.log(`Server running at http://localhost:${PORT}/`);\n});\n```\n\n####\
    \ Logging Errors\n\n`LOGGING ERRORS IS CRUCIAL` for debugging and maintaining\
    \ your application. You can use simple logging with `console.error` or more advanced\
    \ logging libraries like `winston`.\n\n#### Example with Express and Winston:\n\
    \nInstall Winston:\n\n```bash\nnpm install winston\n```\n\nSet Up Winston Logging:\n\
    \n```javascript\nconst express = require('express');\nconst winston = require('winston');\n\
    const app = express();\nconst logger = winston.createLogger({\n  level: 'error',\n\
    \  format: winston.format.combine(\n    winston.format.timestamp(),\n```\n"
