  trans: "\n\n# 初始化一个新的 Node.js 项目：\n\n```bash\nnpm init -y\n```\n\n安装 `axios` 库以进行发送\
    \ HTTP 请求：\n\n```bash\nnpm install axios\n```\n\n## 创建你的应用程序\n\n在项目目录中创建一个名为 `app.js`\
    \ 的文件，并在代码编辑器中打开它。\n\n## 编写代码\n\n```javascript\nconst axios = require('axios');\n\
    \n// 获取天气数据的函数\n\nasync function fetchWeather(city) {\n  try {\n    const apiKey\
    \ = 'your\\_api\\_key\\_here'; // 替换为你的 OpenWeatherMap API key\n    const url\
    \ = `http://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;\n\
    \    const response = await axios.get(url);\n    const weatherData = response.data;\n\
    \    console.log(`Weather in ${city}:`);\n    console.log(`Temperature: ${weatherData.main.temp}°C`);\n\
    \    console.log(`Description: ${weatherData.weather[0].description}`);\n  } catch\
    \ (error) {\n    console.error('Error fetching weather data:', error.message);\n\
    \  }\n}\n\n// 从命令行参数中获取城市名称\n\nconst city = process.argv[2];\nif (!city) {\n \
    \ console.error('Please provide a city name.');\n  process.exit(1);\n}\n\n// 获取并显示天气数据\n\
    \nfetchWeather(city);\nconsole.log('Fetching weather data...');\n```\n\n## 理解代码\n\
    \n- **axios 库**: 我们使用 `axios` 库向 OpenWeatherMap API 发送 HTTP 请求。`Axios` 是一个基于 promise\
    \ 的 HTTP 客户端，可以在浏览器和 Node.js 中运行工作。\n- **异步函数 (`fetchWeather`)**: `fetchWeather`\
    \ 函数被定义为一个 `async` 函数，这允许我们使用 `await` 关键字来等待 `axios.get` 返回的 promise 解析完成。\n-\
    \ **错误处理**: 使用 `try...catch` 块来处理在 HTTP 请求过程中可能发生的任何错误。\n- **命令行参数**: 我们从命令行参数（`process.argv[2]`）中获取城市名称。如果没有提供城市名称，程序将带有错误消息退出。\n\
    - **非阻塞 I/O**: 调用了 `fetchWeather` 函数后，紧接着打印了消息“Fetching weather data...”。程序在等待\
    \ HTTP 请求完成之前就打印了此消息，这演示了非阻塞 I/O。\n\n### 重要提示\n\n要运行此应用程序，你需要一个来自 OpenWeatherMap\
    \ 的 API key。在 [OpenWeatherMap](https://openweathermap.org/) 注册并获取你的 API key。将代码中的\
    \ `'your\\_api\\_key\\_here'` 替换为你实际的 API key。\n\n现在，有一个小提示：OpenWeatherMap 就像你最喜爱的精品咖啡店。虽然你可以获得免费样品（免费层级），但如果你开始变得太喜欢它并不断回来获取更多（超过免费层级），你就需要为每一份额外的“天气数据杯”付费了。如果你觉得这是值得的，尽管去请自己体验一下高级天气预报吧！只需留意这些费用，以确保你的下一次天气更新不会带来意料的账单。\n\
    \n当一切运行正常时，输出通常如下所示：\n\n从从命令行运行应用程序：\n\n```bash\nnode app.js London\n```\n\n你应该能看到类似这样的输出：\n\
    \n```\nFetching weather data...\nWeather in London:\nTemperature: 15°C\nDescription:\
    \ clear sky\n```\n\n所以，如果你准备好为高级天气体验付费了，尽管直接从你的终端享受详细的预报吧！\n\n![image](img/image168.png)\n\
    \n## 2.4. Node.js 模块和 NPM\n\nNODE.JS 模块和 Node 包管理器 (NPM) 是 Node.js 生态系统中不可或缺的一部分。它们允许开发者组织项目结构、管理依赖关系并共享自己的模块。了解如何使用\
    \ NPM 对开发者来说至关重要。\n\n### Node.js 模块\n\nNode.js 支持三种类型的模块：内置模块、自定义模块和第三方模块。\n\n\
    #### 内置模块\n\nNode.js 自带了一组内置模块，提供了各种功能，例如文件系统、HTTP 服务器和实用程序。\n\n**示例：使用 `fs` 模块**\n\
    \n```javascript\nconst fs = require('fs');\n\nfs.readFile('example.txt', 'utf8',\
    \ (err, data) => {\n  if (err) throw err;\n  console.log(data);\n});\n```\n在此示例中，`fs`（文件系统）模块用于读取文件。\n\
    \n#### 自定义模块\n\n自定义模块是开发者创建以封装特定功能的模块。这些模块可以导出并导入到其他部分。\n\n**示例：创建并使用自定义模块**\n\
    \n1. 创建名为 `math.js` 的文件\n\n```javascript\n// math.js\nfunction add(a, b) {\n \
    \ return a + b;\n}\n\nfunction subtract(a, b) {\n  return a - b;\n}\n\nmodule.exports\
    \ = {\n  add,\n  subtract\n};\n```\n\n导入并使用 `math.js`模块\n\n```javascript\n// app.js\n\
    const math = require('./math');\n\nconst sum = math.add(5, 3);\nconst difference\
    \ = math.subtract(5, 3);\nconsole.log(`Sum: ${sum}`); // Sum: 8\nconsole.log(`Difference:\
    \ ${difference}`); // Difference: 2\n```\n\n#### 第三方模块\n\n第三方模块是由社区创建并通过 NPM 共享的。它们提供了从工具库到完整框架的各种功能。\n\
    \n**示例：使用第三方模块**\n\n要使用第三方模块，你需要使用 NPM 安装它，然后在应用程序中引入它。\n\n```bash\nnpm install\
    \ lodash\n```\n\n```javascript\nconst _ = require('lodash');\nconst array = [1,\
    \ 2, 3, 4, 5];\nconst reversedArray = _.reverse(array.slice());\nconsole.log(reversedArray);\
    \ // [5, 4, 3, 2, 1]\n```\n\n### Node 包管理器 (NPM)\n\nNPM 是随 Node.js 一带的强大工具。它允许开发者管理项目依赖、安装第三方模块并共享自己的模块。NPM\
    \ 使外部库和工具引入 Node.js 项目变得简单。\n\n#### 关键 NPM 命令\n\n**初始化项目**: 要启动一个新的 Node.js 项目并创建\
    \ `package.json` 文件（该文件包含项目及其依赖的元数据），你可以使用：\n\n```bash\nnpm init\n```\n\n此命令会提示你输入有关项目的信息，或者你可以使用\
    \ `npm init -y` 使用默认值生成 `package.json` 文件。\n\n**安装包**: 要安装一个包并将其添加到项目的依赖中，你可以：\n\
    \n```bash\nnpm install <package-name> --save\n```\n\n`--save` 标志确保该包被列在 `package.json`\
    \ 的 dependencies 部分。\n\n**全局安装包**: 某些包被用作命令行工具，通常会被全局安装以便可以在任何目录下使用。\n\n"
- fmt: "\n```bash\nnpm install -g <package-name>\n```\n\n## Listing Installed Packages\n\
    To see all the packages installed in your project, you use:\n\n```bash\nnpm list\n\
    ```\n\n## Updating a Package\nTo update a specific package to the latest version,\
    \ you use:\n\n```bash\nnpm update <package-name>\n```\n\n## Managing Dependencies\
    \ with `package.json`\n\nThe `package.json` file is a critical component of a\
    \ Node.js project. It keeps track of all the dependencies and scripts associated\
    \ with the project.\n\n### Example: A simple `package.json` file\n\n```json\n\
    {\n  \"name\": \"weather-app\",\n  \"version\": \"1.0.0\",\n  \"description\"\
    : \"A simple weather application\",\n  \"main\": \"app.js\",\n  \"scripts\": {\n\
    \    \"start\": \"node app.js\"\n  },\n  \"dependencies\": {\n    \"axios\": \"\
    ^0.21.1\"\n  },\n  \"author\": \"Your Name\",\n  \"license\": \"ISC\"\n}\n```\n\
    \n---\n\n![image](d2d_images/scene_break.png)\n\nIN THIS EXAMPLE, THE `package.json`\
    \ file includes basic information about the project, a start script to run the\
    \ application, and a dependency (`axios`). The `dependencies` section lists the\
    \ packages required by the project and their versions.\n\n| Command | Description\
    \ |\n| --- | --- |\n| `npm init` | Initializes a new Node.js project and creates\
    \ a `package.json` file with metadata and dependencies. |\n| `npm init -y` | Initializes\
    \ a new Node.js project with default values, skipping the interactive prompts.\
    \ |\n| `npm install <package>` | Installs a package and adds it to the `dependencies`\
    \ section of `package.json`. |\n| `npm install <package>—save` | (Deprecated)\
    \ Same as `npm install <package>`. |\n| `npm install <package>--save-dev` | Installs\
    \ a package and adds it to the `devDependencies` section of `package.json`. |\n\
    | `npm install <package> -g` | Installs a package globally, making it available\
    \ from the command line anywhere on your system. |\n| `npm install` | Installs\
    \ all dependencies listed in `package.json`. |\n| `npm uninstall <package>` |\
    \ Uninstalls a package and removes it from the `dependencies` section of `package.json`.\
    \ |\n| `npm update <package>` | Updates a package to the latest version that matches\
    \ the version range specified in `package.json`. |\n| `npm outdated` | Lists packages\
    \ that are outdated compared to the latest versions available. |\n| `npm list`\
    \ | Lists all installed packages in the current project along with their dependencies.\
    \ |\n| `npm list -g` | Lists all globally installed packages. |\n| `npm run <script>`\
    \ | Runs a script defined in the `scripts` section of `package.json`. |\n| `npm\
    \ test` | Runs the `test` script defined in `package.json`. |\n| `npm start` |\
    \ Runs the `start` script defined in `package.json`. |\n| `npm stop` | Runs the\
    \ `stop` script defined in `package.json`. |\n| `npm init <initializer>` | Initializes\
    \ a new project using an initializer (e.g., `npm init react-app`). |\n| `npm version\
    \ <newversion>` | Bumps the version in `package.json` to a new version (e.g.,\
    \ `npm version 1.0.1`). |\n| `npm publish` | Publishes a package to the NPM registry.\
    \ |\n| `npm unpublish <package>` | Removes a published package from the NPM registry\
    \ (can be used with `--force` for unpublishing). |\n| `npm cache clean--force`\
    \ | Clears the NPM cache. |\n| `npm config set <key> <value>` | Sets a configuration\
    \ key to a specified value. |\n| `npm config get <key>` | Retrieves the value\
    \ of a configuration key. |\n| `npm help` | Displays help information about NPM.\
    \ |\n| `npm search <term>` | Searches for packages matching the search term in\
    \ the NPM registry. |\n| `npm audit` | Performs a security audit of the project's\
    \ dependencies. |\n| `npm audit fix` | Automatically fixes vulnerabilities found\
    \ in the project's dependencies. |\n| `npm ci` | Installs dependencies from a\
    \ clean slate using `package-lock.json`, for continuous integration. |\n| `npm\
    \ rebuild` | Rebuilds native addons that were installed with `npm install`. |\n\
    | `npm dedupe` | Deduplicates dependencies in the project. |\n| `npm link` | Symlinks\
    \ a package folder during development. |\n| `npm unlink` | Removes symlink created\
    \ by `npm link`. |\n| `npm doctor` | Runs a set of checks to ensure your NPM installation\
    \ is in good shape. |\n| `npm exec <command>` | Runs a command from a local or\
    \ global package. |\n\nTable.1 NPM Commands\n\n![image](d2d_images/image025.png)\n\
    \n## Understanding Node.js modules\nModules help you organize code into pieces,\
    \ whether they are built-in, user-defined, or third-party. By mastering modules,\
    \ you can build cleaner and scalable applications.\n\n## REPL (Read-Eval-Loop)\n\
    The REPL is an interactive shell that comes with Node.js. It provides a quick\
    \ way to try out JavaScript.\n\n### What is REPL?\nREPL stands for:\n- **Read**:\
    \ It reads the user’s input, parses it into data structures.\n- **Eval**: It evaluates\
    \ the parsed code.\n- **Print**: It prints the result of the evaluation.\n- **Loop**:\
    \ It loops, waiting for new input.\n\n![image](d2d_images/image108.png)\n\n###\
    \ Starting the REPL\nTo start the Node.js REPL, simply open your terminal or command\
    \ prompt and type:\n\n```bash\nnode\n```\n![image](d2d_images/165)\n\nYou will\
    \ see a prompt (`>`) indicating that the REPL is ready to accept commands.\n\n\
    ### Basic Usage\n**Example 1: Arithmetic**\n```javascript\n> 1 + 2\n3\n> 5 * 10\n\
    50\n```\nThe REPL reads the input `1 + 2`, evaluates it, prints the result `3`,\
    \ and then waits for the next input.\n\n**Example 2: Variable Declaration**\n\
    ```javascript\n> let x = 10;\nundefined\n> x * 2\n20\n```\nYou can declare variables\
    \ and use them in subsequent commands. The REPL stores the state of the session,\
    \ allowing you to interact with declared variables.\n\n### Using Node.js APIs\
    \ in the REPL\nYou can also use Node.js built-in modules directly in the REPL.\n\
    \n**Example: Using the `fs` module**\n```javascript\n> const fs = require('fs');\n\
    undefined\n> fs.readFileSync('example.txt', 'utf8');\n'This is the content of\
    \ the file.'\n```\nIn this example, the `fs` module is required, and its `readFileSync`\
    \ method is used to read the contents of a file.\n\n### Multi-line Input\nThe\
    \ REPL supports multi-line input, allowing you to enter complex code structures\
    \ such as loops and functions.\n\n**Example: Defining a Function**\n```javascript\n\
    > function add(a, b) {\n... return a + b;\n... }\nundefined\n> add(5, 10);\n15\n\
    ```\nThe REPL waits for you to finish the function definition before evaluating\
    \ it. You can press Enter twice to indicate that you have finished the multi-line\
    \ input.\n\n### Special Commands\nTABLE OF REPL COMMANDS\n\n| Command | Explanation\
    \ |\n| --- | --- |\n| `.help` | Displays a list of all the special REPL commands\
    \ and their descriptions. |\n| `.break` | When you get stuck in a multi-line expression,\
    \ use this to get out of the current context. |\n| `.clear` | Alias for `.break`.\
    \ It clears the current context in the REPL. |\n"
