  trans: "\n\n![image](img/image178.png)\n\n# 4. Postman 简介\n\nPOSTMAN 是一个强大且用户型的工具，旨在简化\
    \ API 的开发、测试和文档编制过程。它允许开发者发送 HTTP 请求、检查响应并自动化 API 测试。通过 Postman，你可以在无需编写额外代码的情况下与\
    \ Web 服务器交互，使其成为 Web 开发和 API 测试的必备工具。\n\n![image](img/image093.png)\n\n## 什么是\
    \ Postman？\n\nPOSTMAN 是一个用于 API 开发的协作平台。它提供了一套全面的工具，帮助你设计、调试、测试和记录 API。它支持多种 HTTP\
    \ 方法（`GET`、`POST`、`PUT`、`DELETE` 等），并允许轻松添加头部（headers）、参数和请求体。Postman 直观的界面和强大的功能使其成为开发者进行\
    \ API 测试和开发的流行选择。\n\n![image](img/image157.png)\n\n## Postman 的核心功能\n\n1. **HTTP\
    \ 请求**：使用各种方法（`GET`、`POST`、`PUT`、`DELETE` 等）发送 HTTP 请求。\n2. **头部和参数**：在请求中添加自定义头部和查询参数。\n\
    3. **请求体**：发送不同类型的请求体（`raw`、`JSON`、`form-data` 等）。\n4. **响应检查**：查看详细的响应，包括状态码、头部和正文。\n\
    5. **环境变量**：使用变量管理不同的环境（开发、测试阶段、生产环境）。\n6. **自动化**：利用 Postman 的脚本能力编写测试并自动化 API\
    \ 工作流。\n7. **集合（Collections）**：将相关的请求分组到集合中，以便于管理和重复重用。\n\n## 如何使用 Postman\n\n\
    ### 安装 Postman\n\n1. **下载**：访问 Postman 下载页面，下载适用于你操作系统的相应版本。\n2. **安装**：按照你所在平台的安装说明安装\
    \ Postman。\n\n### 创建新请求\n\n1. **打开 Postman**：启动 Postman 应用程序。\n2. **创建新请求**：\n\
    \   - 点击左上角的 `+` 按钮或 `New` 按钮创建新请求。\n   - 选择 `HTTP Request`。\n\n![image](img/image219.png)\n\
    \n1. **设置请求方法**：\n   - 使用下拉菜单选择 HTTP 方法（`GET`、`POST`、`PUT`、`DELETE` 等）。\n\n![image](img/image171.png)\n\
    \n1. **输入 URL**：\n   - 输入你想测试的 API 端点的 URL（例如 `http://localhost:3000`）。\n\n###\
    \ 添加头部和参数\n\n1. **头部 (Headers)**：\n   - 点击 URL 下方的 `Headers` 标签。\n   - 为你想包含的头部添加键值对（例如\
    \ `Content-Type: application/json`）。\n2. **查询参数 (Query Parameters)**：\n   - 点击\
    \ URL 下方的 `Params` 标签。\n   - 为你想包含的查询参数添加键值对（例如 `name=John&age=30`）。\n\n### 添加请求体\n\
    \n1. **选择 Body 标签**：\n   - 点击 URL 下方的 `Body` 标签。\n2. **选择 Body 类型**：\n   - 选择合适的\
    \ Body 类型（`raw`、`form-data`、`x-www-form-urlencoded` 等）。\n3. **输入请求体**：\n   - 对于\
    \ `raw` Body 类型，选择数据格式（例如 `JSON`）并输入请求体。\n   - 示例 JSON 体：\n\n```json\n{\n  \"\
    name\": \"John\",\n  \"age\": 30\n}\n```\n\n### 发送请求\n\n1. **点击 Send**：\n   -\
    \ 点击 `Send` 按钮将请求发送到服务器。\n2. **检查响应**：\n   - 服务器的响应将显示在 Postman 的下半部分。\n   - 你可以响应状态、头部和主体。\n\
    \n### 使用 Postman 集合 (Collections)\n\n1. **创建集合**：\n   - 点击左侧边栏上的 `Collections`\
    \ 标签。\n   - 点击 `New Collection` 按钮并为集合命名。\n2. **将请求添加到集合**：\n   - 将单个请求保存到集合中以便于组织管理。\n\
    \   - 点击请求上的 `Save` 并选择要保存到的集合。\n\n### 自动化测试\n\n1. **编写测试**：\n   - 点击 URL 下方的\
    \ `Tests` 标签。\n   - 编写 JavaScript 代码创建验证响应的测试。\n   - 示例测试：\n\n![image](img/image214.png)\n\
    \n```javascript\npm.test(\"STATUS CODE is 200\", function () {\n  pm.response.to.have.status(200);\n\
    });\n```\n\n关于如何使用 Postman 的详尽且生动的教程，我强烈建议在 YouTube 上观看 Hitesh Choudhary 的视频，他用非常棒的方式讲解了\
    \ Postman。\n\n## 2. 处理请求和响应\n\n### 不同的 HTTP 方法\n\nHTTP 方法定义了客户端请求的操作类型。理解这些方法对于构建健壮的\
    \ API 至关重要。\n\n### 处理 GET 请求\n\nGET 请求用于从服务器检索数据。它们是等等的，意味着多次发送相同的请求不应改变服务器的状态。\n\
    \n示例：\n```javascript\nconst http = require('http');\nconst url = require('url');\n\
    \nconst server = http.createServer((req, res) => {\n  if (req.method === 'GET')\
    \ {\n    const query = url.parse(req.url).query;\n    res.statusCode = 200;\n\
    \    res.setHeader('Content-Type', 'application/json');\n    res.end(JSON.stringify(query));\n\
    \  } else {\n    res.statusCode = 405;\n    res.end('Method Not Allowed');\n \
    \ }\n});\n\nconst PORT = 3000;\nserver.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}`);\n});\n```\n\n测试：\n1. 打开 Postman 并创建一个\
    \ GET 请求。\n2. 将 URL 设置为 `http://localhost:3000?name=John&age=30`。\n3. 点击 `Send`。\n\
    4. 你将看到带有参数的响应。\n\n### 处理 POST 请求\n\nPOST 请求用于向服务器发送数据以创建或更新资源。数据包含在请求体内。\n\n\
    示例：\n```javascript\nconst http = require('http');\n\nconst server = http.createServer((req,\
    \ res) => {\n  if (req.method === 'POST') {\n    let body = '';\n    req.on('data',\
    \ chunk => {\n      body += chunk.toString();\n    });\n    req.on('end', () =>\
    \ {\n      res.statusCode = 200;\n      res.setHeader('Content-Type', 'application/json');\n\
    \      res.end(`Received data: ${body}`);\n    });\n  } else {\n    res.statusCode\
    \ = 405;\n    res.end('Method Not Allowed');\n  }\n});\n\nconst PORT = 3000;\n\
    server.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}`);\n\
    });\n```\n\n测试：\n1. 打开 Postman 并创建一个新的 POST 请求。\n2. 将 URL 设置为 `http://localhost:3000`。\n\
    3. 转到 `Body` 标签，选择 `raw` 和 `JSON`，并输入：\n```json\n{\n  \"name\": \"John\",\n  \"\
    age\": 30\n}\n```\n4. 点击 `Send`。\n5. 你应该看到带有接收数据的响应。\n\n### 处理 PUT 请求\n\n"
- fmt: "\n`PUT` requests are used to update a resource on the server. They can also\
    \ be used to create a resource if it does not exist. `PUT` requests typically\
    \ include data in the request body.\n\n### Example Code\n```javascript\nconst\
    \ http = require('http');\n\nconst server = http.createServer((req, res) => {\n\
    \  if (req.method === 'PUT') {\n    let body = '';\n    req.on('data', chunk =>\
    \ {\n      body += chunk.toString();\n    });\n    req.on('end', () => {\n   \
    \   res.statusCode = 200;\n      res.setHeader('Content-Type', 'application/json');\n\
    \      res.end(`Updated data: ${body}`);\n    });\n  } else {\n    res.statusCode\
    \ = 405;\n    res.end('Method Not Allowed');\n  }\n});\n\nconst PORT = 3000;\n\
    \nserver.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n### Testing\n1. Open Postman and create a new `PUT` request.\n2. Set\
    \ the URL to `http://localhost:3000`.\n3. Go to the `Body` tab, select `raw` and\
    \ `JSON`, and enter:\n```json\n{\n  \"name\": \"John\",\n  \"age\": 31\n}\n```\n\
    - Click `Send`.\n- You will see the response with the updated data:\n![image](d2d_images/image208.png)\n\
    \n### Handling DELETE Requests\n`DELETE` requests are used to delete a resource\
    \ on the server.\n\n#### Example\n```javascript\nconst http = require('http');\n\
    \nconst server = http.createServer((req, res) => {\n  if (req.method === 'DELETE')\
    \ {\n    const urlParts = req.url.split('/');\n    const id = urlParts[urlParts.length\
    \ - 1];\n    res.statusCode = 200;\n    res.setHeader('Content-Type', 'text/plain');\n\
    \    res.end(`Resource with ID ${id} deleted`);\n  } else {\n    res.statusCode\
    \ = 405;\n    res.end('Method Not Allowed');\n  }\n});\n\nconst PORT = 3000;\n\
    \nserver.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n#### Testing\n1. Open Postman and create a new `DELETE` request.\n\
    2. Set the URL to `http://localhost:3000/resource/123`.\n![image](d2d_images/image043.png)\n\
    1. Click `Send`.\n2. You should see the response indicating the resource was deleted:\n\
    `Resource with ID 123 deleted`\n\n### Handling Other HTTP Methods (PATCH, OPTIONS,\
    \ HEAD)\n\n#### PATCH: Used to apply partial modifications to a resource.\n\n\
    ##### Example\n```javascript\nconst http = require('http');\n\nconst server =\
    \ http.createServer((req, res) => {\n  if (req.method === 'PATCH') {\n    let\
    \ body = '';\n    req.on('data', chunk => {\n      body += chunk.toString();\n\
    \    });\n    req.on('end', () => {\n      res.statusCode = 200;\n      res.setHeader('Content-Type',\
    \ 'application/json');\n      res.end(`Patched data: ${body}`);\n    });\n  }\
    \ else {\n    res.statusCode = 405;\n    res.end('Method Not Allowed');\n  }\n\
    });\n\nconst PORT = 3000;\n\nserver.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n\n##### Testing\n1. Open\
    \ Postman and create a new `PATCH` request.\n2. Set the URL to `http://localhost:3000`.\n\
    3. Go to the `Body` tab, select `raw` and `JSON`, and enter:\n```json\n{\n  \"\
    name\": \"John\",\n  \"age\": 32\n}\n```\n- Click `Send`.\n- You will see the\
    \ response with the patched data:\n```json\n{\n  \"Patched data\": \"{\\\"name\\\
    \":\\\"John\\\",\\\"age\\\":32}\"\n}\n```\n![image](d2d_images/image127.png)\n\
    \n#### OPTIONS: Used to describe the communication options for the target resource.\n\
    \n##### Example\n```javascript\nconst http = require('http');\n\nconst server\
    \ = http.createServer((req, res) => {\n  if (req.method === 'OPTIONS') {\n   \
    \ res.statusCode = 200;\n    res.setHeader('Allow', 'GET, POST, PUT, DELETE, PATCH,\
    \ OPTIONS');\n  } else {\n    res.statusCode = 405;\n    res.end('Method Not Allowed');\n\
    \  }\n});\n\nconst PORT = 3000;\n\nserver.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n\n##### Testing\n1. Open\
    \ Postman and create a new `OPTIONS` request.\n2. Set the URL to `http://localhost:3000`.\n\
    3. Click `Send`.\n4. You will see the response with:\n`Allow: GET, POST, PUT,\
    \ DELETE, PATCH, OPTIONS`\n\n### Parsing and Managing Data\n`JSON` is a lightweight\
    \ data interchange format that is easy for humans to read and write and simple\
    \ for machines to parse and generate.\n\n#### Example with Core HTTP Module\n\
    ```javascript\nconst http = require('http');\n\nconst server = http.createServer((req,\
    \ res) => {\n  if (req.method === 'POST' && req.headers['content-type'] === 'application/json')\
    \ {\n    let body = '';\n    req.on('data', chunk => {\n      body += chunk.toString();\n\
    \    });\n    req.on('end', () => {\n      try {\n        const parsedData = JSON.parse(body);\n\
    \        res.statusCode = 200;\n        res.setHeader('Content-Type', 'application/json');\n\
    \        res.end(JSON.stringify({ received: parsedData }));\n      } catch (err)\
    \ {\n        res.statusCode = 400;\n        res.end('Invalid JSON');\n      }\n\
    \    });\n  } else {\n    res.statusCode = 405;\n    res.end('Method Not Allowed');\n\
    \  }\n});\n\nconst PORT = 3000;\n\nserver.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n\n#### Explanation\n* This\
    \ code snippet sets up an HTTP server that listens for `POST` requests with `Content-Type`\
    \ of `application/json`.\n* The server reads the request body, parses it as JSON,\
    \ and responds with the parsed data.\n* If the JSON is invalid, it returns a `400\
    \ Bad Request` status.\n\n#### Testing with Postman\n1. Create a `POST` request.\n\
    2. Set the URL to `http://localhost:3000`.\n3. Set the `Content-Type` header to\
    \ `application/json`.\n4. In the `Body` tab, select `raw` and `JSON`, then enter:\n\
    ```json\n{\n  \"name\": \"John\",\n  \"age\": 30\n}\n```\nClick `Send`.\n\n####\
    \ Parsing URL-encoded Data\n`URL-encoded data` is often used in form submissions.\
    \ It encodes key-value pairs in a URL format, where each key-value pair is separated\
    \ by `&` and keys/values are separated by `=`.\n\n#### Example with Core HTTP\
    \ Module\n```javascript\nconst http = require('http');\nconst querystring = require('querystring');\n\
    \nconst server = http.createServer((req, res) => {\n  if (req.method === 'POST'\
    \ && req.headers['content-type'] === 'application/x-www-form-urlencoded') {\n\
    \    let body = '';\n    req.on('data', chunk => {\n      body += chunk.toString();\n\
    \    });\n    req.on('end', () => {\n      const parsedData = querystring.parse(body);\n\
    \      res.statusCode = 200;\n      res.setHeader('Content-Type', 'application/json');\n\
    \      res.end(JSON.stringify({ received: parsedData }));\n    });\n  } else {\n\
    \    res.statusCode = 405;\n    res.end('Method Not Allowed');\n  }\n});\n\nconst\
    \ PORT = 3000;\n\nserver.listen(PORT, () => {\n  console.log(`Server running at\
    \ http://localhost:${PORT}/`);\n});\n```\n"
