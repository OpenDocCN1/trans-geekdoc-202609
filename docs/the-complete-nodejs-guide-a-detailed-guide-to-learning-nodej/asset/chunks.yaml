    \ to file...' 会被立即记录，展示了非阻塞行为。\n\n### 删除文件\n\n要删除文件，你可以使用 `fs.unlink` 和 `fs.unlinkSync`\
    \ 方法。\n\n示例：异步删除\n\n```javascript\nconst fs = require('fs');\n\nfs.unlink('C:\\\
    \\Users\\\\NAME\\\\Desktop\\\\file.txt', (err) => {\n  if (err) {\n    return\
    \ console.error('Error deleting file:', err);\n  }\n  console.log('File deleted\
    \ successfully');\n});\n\nconsole.log('Deleting file...');\n```\n\n![image](img/image118.png)\n\
    ![image](img/image084.png)\n\n在此示例中：\n`fs.unlink('example.txt', callback)` 异步地删除\
