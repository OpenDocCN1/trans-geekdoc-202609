    \n## 4.6. Building a Simple Blog Server\n\nIN THIS EXAMPLE, WE will build a simple\
    \ blog server using Express.js. This server will include functionalities for creating,\
    \ reading, updating, and deleting blog posts. We will also implement middleware\
    \ for logging requests, handling authentication, input validation, and error handling.\n\
    \n### Project Structure\n\nHERE IS THE PROJECT structure for the blog server:\n\
    \n```text\nblog-server/\n├── node_modules/\n├── public/\n│   └── index.html\n\
    ├── middlewares/\n│   ├── logger.js\n│   ├── auth.js\n│   ├── validatePost.js\n\
    │   └── errorHandler.js\n├── routes/\n│   └── blog.js\n├── app.js\n└── package.json\n\
    ```\n\n### Step 1: Initialize the Project\n\n```bash\nmkdir blog-server\ncd blog-server\n\
    npm init -y\nnpm install express body-parser morgan\n```\n\n### Step 2: Create\
    \ the HTML Page\n\nCREATE an `index.html` file inside the `public` directory.\n\
    \n`public/index.html`:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n  <title>Simple Blog Server</title>\n</head>\n<body>\n\
    \  <h1>Welcome to the Simple Blog Server</h1>\n  <p>This page demonstrates a simple\
    \ blog server built with Express.js.</p>\n</body>\n</html>\n```\n\n### Step 3:\
    \ Implement Custom Middleware\n\nCREATE CUSTOM MIDDLEWARE for logging requests,\
    \ handling authentication, input validation, and error handling.\n\n`middlewares/logger.js`:\n\
    \n```javascript\nmodule.exports = (req, res, next) => {\n  console.log(`${req.method}\
    \ ${req.url} - ${new Date().toISOString()}`);\n  next();\n};\n```\n\n`middlewares/auth.js`:\n\
    \n```javascript\nmodule.exports = (req, res, next) => {\n  const authHeader =\
    \ req.headers.authorization;\n  if (authHeader && authHeader === 'Bearer mysecrettoken')\
    \ {\n    next();\n  } else {\n    res.status(401).json({ message: 'Unauthorized'\
    \ });\n  }\n};\n```\n\n`middlewares/errorHandler.js`:\n\n```javascript\nmodule.exports\
    \ = (err, req, res, next) => {\n  console.error(err.stack);\n  res.status(500).json({\
    \ message: 'Something went wrong!' });\n};\n```\n\n`middlewares/validatePost.js`:\n\
    \n```javascript\nmodule.exports = (req, res, next) => {\n  const { title, content\
    \ } = req.body;\n  if (!title || typeof title !== 'string') {\n    return res.status(400).json({\
    \ message: 'Invalid title' });\n  }\n  if (!content || typeof content !== 'string')\
    \ {\n    return res.status(400).json({ message: 'Invalid content' });\n  }\n \
    \ next();\n};\n```\n\n### Step 4: Set Up Routes\n\nROUTES HANDLE CRUD operations.\n\
    \n`routes/blog.js`:\n\n```javascript\nconst express = require('express');\nconst\
    \ router = express.Router();\nconst authMiddleware = require('../middlewares/auth');\n\
    const validatePostMiddleware = require('../middlewares/validatePost');\n\nlet\
    \ posts = [];\n\n// GET /api/posts - Get all posts\nrouter.get('/posts', (req,\
    \ res) => {\n  res.json(posts);\n});\n\n// GET /api/posts/:id - Get a single post\
    \ by ID\nrouter.get('/posts/:id', (req, res) => {\n  const post = posts.find(p\
    \ => p.id === parseInt(req.params.id));\n  if (!post) {\n    return res.status(404).json({\
    \ message: 'Post not found' });\n  }\n  res.json(post);\n});\n\n// POST /api/posts\
    \ - Create a new post\nrouter.post('/posts', authMiddleware, validatePostMiddleware,\
    \ (req, res) => {\n  const { title, content } = req.body;\n  const newPost = {\
    \ id: posts.length + 1, title, content };\n  posts.push(newPost);\n  res.status(201).json(newPost);\n\
    });\n\n// PUT /api/posts/:id - Update a post by ID\nrouter.put('/posts/:id', authMiddleware,\
    \ validatePostMiddleware, (req, res) => {\n  const post = posts.find(p => p.id\
    \ === parseInt(req.params.id));\n  if (!post) {\n    return res.status(404).json({\
    \ message: 'Post not found' });\n  }\n  const { title, content } = req.body;\n\
    \  post.title = title;\n  post.content = content;\n  res.json(post);\n});\n\n\
    // DELETE /api/posts/:id - Delete a post by ID\nrouter.delete('/posts/:id', authMiddleware,\
    \ (req, res) => {\n  posts = posts.filter(p => p.id !== parseInt(req.params.id));\n\
    \  res.json({ message: 'Post deleted' });\n});\n\nmodule.exports = router;\n```\n"
