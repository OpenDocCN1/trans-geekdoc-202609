    \n##  ​   6.5.   Database Connection Pooling \n\n   D    ATABASE CONNECTION  \
    \  pooling is a technique used to maintain a cache of database connections so\
    \ that they can be reused, improving the performance and scalability of applications.\
    \   By reusing existing connections rather than creating new ones for each database\
    \ request, connection pooling reduces the overhead associated with establishing\
    \ database connections.   This section will explore how to implement database\
    \ connection pooling in Node.js using popular libraries for MySQL, PostgreSQL,\
    \ and MongoDB. \n\n ![image](d2d_images/image073.png)\n\n####  Why Use Connection\
    \ Pooling? \n\n1.    Performance    : Establishing a new database connection can\
    \ be time-consuming and resource-intensive.   Connection pooling allows for faster\
    \ query execution by reusing existing connections. \n\n2.    Resource Management\
    \    : Databases have a limit on the number of concurrent connections they can\
    \ handle.   Connection pooling helps manage these connections efficiently. \n\n\
    3.    Scalability    : Connection pooling enables applications to handle more\
    \ simultaneous database requests by efficiently managing a pool of reusable connections.\
    \ \n\n####  Implementing Connection Pooling in MySQL \n\n   T    O IMPLEMENT CONNECTION\
    \    pooling in MySQL, you can use the    mysql    or    mysql2    module.   Here’s\
    \ how to do it with the    mysql2    module: \n\n  Install the mysql2 Module \
    \   : \n\n npm install mysql2 \n\n  Create a Connection Pool    : \n\n const mysql\
    \ =    require    ('mysql2'); \n\n const pool = mysql.    createPool    ({ \n\n\
    \ host: 'localhost', \n\n user: 'root', \n\n password: 'password', \n\n database:\
    \ 'my\\_database', \n\n waitForConnections: true, \n\n connectionLimit: 10, \n\
    \n queueLimit: 0 \n\n }); \n\n // Use the pool to perform queries \n\n pool. \
    \   query    ('SELECT \\* FROM users', (err, results) => { \n\n if (err) throw\
    \ err; \n\n console.    log    (results); \n\n }); \n\n // Close the pool \n\n\
    \ pool.    end    ((err) => { \n\n if (err) throw err; \n\n console.    log  \
    \  ('Pool closed'); \n\n }); \n\n####  Implementing Connection Pooling in PostgreSQL\
    \ \n\n   T    O IMPLEMENT CONNECTION    pooling in PostgreSQL, you can use the\
    \    pg    module.   Here’s how to do it: \n\n  Install the pg Module    : \n\n\
    \ npm install pg \n\n  Create a Connection Pool    : \n\n const { Pool } =   \
    \ require    ('pg'); \n\n const pool = new Pool({ \n\n user: 'your\\_username',\
    \ \n\n host: 'localhost', \n\n database: 'your\\_database', \n\n password: 'your\\\
    _password', \n\n port: 5432, \n\n max: 10, // Maximum number of connections \n\
    \n idleTimeoutMillis: 30000, // Close idle clients after 30 seconds \n\n connectionTimeoutMillis:\
    \ 2000, // Return an error after 2 seconds if connection could not be established\
    \ \n\n }); \n\n // Use the pool to perform queries \n\n pool.    query    ('SELECT\
    \ \\* FROM users', (err, res) => { \n\n if (err) throw err; \n\n console.    log\
    \    (res.rows); \n\n }); \n\n // Close the pool \n\n pool.    end    ((err) =>\
    \ { \n\n if (err) throw err; \n\n console.    log    ('Pool closed'); \n\n });\
    \ \n\n –––––––– \n\n ![image](d2d_images/scene_break.png) \n\n####  Implementing\
    \ Connection Pooling in MongoDB \n\n   T    O IMPLEMENT CONNECTION    pooling\
