    \ | --- |\n![image](img/chapter_title_above.png) \n\n# Node.js 简介\n\n![image](img/chapter_title_below.png)\n\
    \n## 1.1 什么是 Node.js?\n\nNode.js 是一个开源、跨平台的运行时环境，允许开发者在  之外执行 JavaScript 代码。传统上，JavaScript\
    \ 局限于浏览器，主要用于增强网页的交互性。然而，随着 Node.js 的出现，开发者现在可以利用 JavaScript 进行服务器端脚本编写 [1]，能够在客户端和服务器端使用同一种编程语言开发动态且可扩展的\
    \ Web 应用。\n\n![image](img/image049.png)\n\n#### Node.js 的核心特性\n\n**事件驱动和非阻塞 I/O**：Node.js\
    \ 运行在单线程事件循环 [2] 上，利用非阻塞 I/O 调用。这意味着诸如读取或写入文件、与数据库交互或发送网络请求等操作都是异步处理的。这种架构允许 Node.js\
    \ 以高吞吐量和高效率处理许多并发连接，使其成为对性能和可扩展性至关重要的实时应用程序的理想选择。\n\n**单一编程语言**：Node.js 的显著优势之一是它允许开发者使用\
    \ JavaScript 同时进行服务器端和客户端开发。这种开发栈的统一简化了工作流，提高了生产力，并促进了服务器与客户端之间的代码复用。\n\n**NPM\
    \ (Node 包管理器)**：Node.js 自带 `npm`，它是最大的开源库和包生态系统。通过 `npm`，开发者可以轻松地共享、发现和集成第三方模块，显著加速开发过程。`npm`\
    \ 注册表 [3] 托管了数百万个包，涵盖了从数据库驱动程序、Web 框架到工具库和测试工具的各种功能。\n\n**快速且可扩展**：Node.js 的非阻塞特性和对异步操作的高效处理有助于它的速度和可扩展性。它可以以最小的开销管理大量的并发连接，使其成为性能和可扩展性至关重要的实时应用程序的理想选择。\n\
    \n**微服务和实时应用程序**：Node.js 在构建微服务 [4] 方面表现出色，应用程序被分为较小的、松耦合的服务，这些服务可以独立地进行开发、部署和扩展。此外，它对\
    \ WebSockets [5] 以及如 `Socket.IO` 等实时通信库的支持允许开发者创建聊天应用、实时更新和协作工具等实时应用。\n\n####\
    \ Node.js 的实际应用\n\n由于其多功能性和性能，Node.js 被应用于各个领域和行业。以下是 Node.js 发挥优势的一些实际应用场景：\n\
    \n**Web 服务器**：Node.js 常用于构建可以同时处理多个客户端请求的 Web 服务器。使用 `Express.js` [6] 等框架可以轻松开发具有路由、中间件和模板渲染能力的健壮\
    \ Web 应用。\n\n**API 开发**：通过 Node.js，开发者可以创建 RESTful API [7] 作为 Web 和移动应用程序的骨干。它的异步本质确保了即使在高负载下也能提供快速响应。\n\
    \n**实时应用程序**：Node.js 是开发实时应用（如聊天应用、在线游戏、直播和协作工具）的绝佳选择。它的事件驱动 [8] 架构和对 WebSockets\
    \ 的支持实现了实时通信和更新。\n\n**微服务**：Node.js 轻量级的特性和模块化使其适用于微服务架构。开发者可以独立地构建、部署和扩展单个服务，从而产生更具维护性和可扩展性的应用程序。\n\
    \n**命令行工具**：许多命令行工具和实用程序是用 Node.js 构建的，因为它易于脚本且可以访问文件系统。`npm` 本身等流行工具都是 Node.js\
    \ 应用的示例。\n\n#### 预览 Node.js 的运行实战\n\n"
