    \ custom formats to suit your needs. \n\n####  Why Use Morgan? \n\n*     Debugging\
    \     : Helps in identifying issues by providing detailed logs of each request.\
    \  \n\n*     Monitoring     : Tracks the performance and usage of your application.\
    \  \n\n*     Audit Trails     : Maintains a record of all requests for security\
    \ and compliance purposes.  \n\n*     Customizable     : Allows you to define\
    \ custom logging formats based on your requirements.  \n\n####  Installing Morgan\
    \ \n\n   T    O USE MORGAN IN YOUR    Node.js application, you first need to install\
    \ it using npm: \n\n npm install morgan \n\n####  Basic Usage of Morgan \n\n \
    \  H    ERE’S A BASIC EXAMPLE    of how to use Morgan in an Express application:\
    \ \n\n  First Set Up an Express Application    : \n\n const    express    =  \
    \  require    ('express'); \n\n const    morgan    =    require    ('morgan');\
    \ \n\n const app =    express    (); \n\n // Use Morgan for logging requests \n\
    \n app.    use    (    morgan    ('combined')); \n\n // Define a simple route\
    \ \n\n app.    get    ('/', (req, res) => { \n\n res.    send    ('Hello, World!');\
    \ \n\n }); \n\n const PORT = 3000; \n\n app.    listen    (PORT, () => { \n\n\
    \ console.    log    (\\`Server running at http://localhost:${PORT}/\\`); \n\n\
    \ }); \n\n*     Import Express and Morgan     : We require both the    express\
    \    and    morgan    modules.  \n\n*     Use Morgan Middleware     : The    app.use(morgan('combined'))\
    \    line integrates Morgan into our application.   The    'combined'    format\
    \ provides a comprehensive logging format that includes the remote IP, request\
    \ method, URL, HTTP version, response status, response time, and more.  \n\n*\
    \     Define a Route     : We define a simple route that responds with \"Hello,\
    \ World!\"   when accessed.  \n\n  Running the Application    : \n\n node server.js\
    \ \n\n Open your browser or use a tool like Postman to navigate to http://localhost:3000.\
    \ \n\n  Viewing the Logs    : \n\n*    After making a request to the server, you\
    \ will see detailed logs in your console similar to this: \n\n ![image](d2d_images/image002.png)\n\
    \n####  Customizing Morgan \n\n   M    ORGAN SUPPORTS SEVERAL    predefined formats,\
    \ such as 'combined', 'common', 'dev', 'short', and 'tiny'.   You can also create\
    \ custom formats to log specific details that are important to you. \n\n  Example\
    \ of a Custom Format    : \n\n1.    Define a Custom Format    : \n\n const   \
    \ express    =    require    ('express'); \n\n const    morgan    =    require\
    \    ('morgan'); \n\n const app =    express    (); \n\n // Define a custom format\
    \ \n\n  morgan    .    format    ('myFormat', ':method :url :status :res\\[content-length\\\
    ] - :response-time ms'); \n\n // Use the custom format \n\n app.    use    ( \
    \   morgan    ('myFormat')); \n\n app.    get    ('/', (req, res) => { \n\n res.\
    \    send    ('Hello, Custom Logger!'); \n\n }); \n\n const PORT = 3000; \n\n\
    \ app.    listen    (PORT, () => { \n\n console.    log    (\\`Server running\
    \ at http://localhost:${PORT}/\\`); \n\n }); \n\n –––––––– \n\n ![image](d2d_images/scene_break.png)\
    \ \n\n ![image](d2d_images/image026.png)"
