  trans: "\n\n* `fs.existsSync('new-directory')` 检查目录是否存在。\n* `fs.rmdirSync('new-directory')`\
    \ 如果目录存在则删除它。\n* 错误会被捕获并记录到控制台。\n\n![image](img/image038.png)\n\n### 异步删除目录\n\n\
    示例：异步删除目录\n\n```javascript\nconst fs = require('fs');\n\nfs.rmdir('new-directory',\
    \ (err) => {\n  if (err) {\n    return console.error('Error deleting directory:',\
    \ err);\n  }\n  console.log('Directory deleted successfully');\n});\n\nconsole.log('Deleting\
    \ directory...');\n```\n\n在此示例中：\n* `fs.rmdir('new-directory', callback)` 异步删除目录。\n\
    * 回调函数处理任何错误。\n* 立即记录消息 'Deleting directory...'，这演示了非阻塞行为。\n\n### 重命名目录\n\nNODE.JS\
    \ 允许你使用 `fs.rename` 和 `fs.renameSync` 方法重命名目录。\n\n### 同步重命名目录\n\n示例：同步重命名目录\n\n\
    ```javascript\nconst fs = require('fs');\n\ntry {\n  fs.renameSync('old-directory',\
    \ 'new-directory');\n  console.log('Directory renamed successfully');\n} catch\
    \ (err) {\n  console.error('Error renaming directory:', err);\n}\n```\n\n在此示例中：\n\
    * `fs.renameSync('old-directory', 'new-directory')` 同步重命名目录。\n* 错误会被捕获并记录到控制台。\n\
    \n### 异步重命名目录\n\n示例：异步重命名目录\n\n```javascript\nconst fs = require('fs');\n\nfs.rename('old-directory',\
    \ 'new-directory', (err) => {\n  if (err) {\n    return console.error('Error renaming\
    \ directory:', err);\n  }\n  console.log('Directory renamed successfully');\n\
    });\n\nconsole.log('Renaming directory...');\n```\n\n在此示例中：\n* `fs.rename('old-directory',\
    \ 'new-directory', callback)` 异步重命名目录。\n* 回调函数处理任何错误。\n* 立即记录消息 'Renaming directory...'，这演示了非阻塞行为。\n\
    \n### 监听目录\n\nNODE.JS 可以监控目录中的变化，例如文件的添加、删除或修改。\n\n示例：监听目录\n\n```javascript\n\
    const fs = require('fs');\n\nfs.watch('new-directory', (eventType, filename) =>\
    \ {\n  if (filename) {\n    console.log(`Event: ${eventType} on file: ${filename}`);\n\
    \  } else {\n    console.log(`Event: ${eventType}`);\n  }\n});\n\nconsole.log('Watching\
    \ directory...');\n```\n\n在此示例中：\n* `fs.watch('new-directory', callback)` 监听 `new-directory`\
    \ 的变化。\n* 回调函数记录事件类型和受影响的文件。\n* 立即记录消息 'Watching directory...'。\n\n![image](img/image130.png)\n\
    \n在 Node.js 中通过 `fs` 模块处理目录变得非常简单。你可以使用同步和异步方法创建、读取、重命名、删除和监控目录。虽然同步方法简单易用，但对于性能敏感型应用程序，更于使用异步方法，因为不会阻塞事件循环。理解这些操作允许你有效地管理应用程序的文件结构，确保目录处理的顺畅和高效。\n\
    \n## 3.3 流与缓冲区\n\n流（STREAMS）和缓冲区（BUFFERS）是 Node.js 中高效处理 I/O 操作的基础。它们允许以连续流读取和写入数据，使得可以在不需要一次将所有内容加载到内存的情况下处理数据集或文件。让我们深入探讨这些概念，理解它们的作用以及如何有效地使用它们。\n\
    \n![image](img/image180.png)\n\n### 理解流\n\n流是 Node.js 中的对象，允许你按顺序从源读取数据或向目标写入数据。它们提供了一种分块处理数据的方法，这对性能和内存管理至关重要。\n\
    \n#### 流的\n\n1. 可读流（Readable Streams）：用于从源读取数据。\n2. 可写流（Writable Streams）：用于向目标写入数据。\n\
    3. 双工流（Duplex Streams）：既可以读取也可以写入数据。\n4. 转换流（Transform Streams）：可以在读取或写入数据的同时修改或转换数据的双工流。\n\
    \n#### 可读流\n\n可读流允许你从源（例如文件或 HTTP 响应）读取数据。\n\n示例：使用可读流读取文件\n\n```javascript\n\
    const fs = require('fs');\n\nconst readStream = fs.createReadStream('example.txt',\
    \ 'utf8');\n\nreadStream.on('data', (chunk) => {\n  console.log('Reading chunk:',\
    \ chunk);\n});\n\nreadStream.on('end', () => {\n  console.log('File completed');\n\
    });\n\nreadStream.on('error', (err) => {\n  console.error('Error reading:', err);\n\
    });\n```\n![image](img/image78.png)\n\n在此示例中：\n* `fs.createReadStream('example.txt',\
    \ 'utf8')` 为 example.txt 创建了一个可读流。\n* 每当读取一个数据块，就会触发 `data` 事件。\n* 当整个文件读取完成后，会触发\
    \ `end` 事件。\n* 如果读取发生错误，会触发 `error` 事件。\n\n#### 可写流\n\n可写流允许你向目标（例如文件或网络套接字）写入数据。\n\
    \n示例：使用可写流写入文件\n\n```javascript\nconst fs = require('fs');\n\nconst writeStream\
    \ = fs.createWriteStream('example.txt');\n\nwriteStream.write('Hello, ', 'utf8');\n\
    writeStream.write('world!', 'utf8');\nwriteStream.end();\n\nwriteStream.on('finish',\
    \ () => {\n  console.log('File writing completed');\n});\n\nwriteStream.on('error',\
    \ (err) => {\n  console.error('Error writing to:', err);\n});\n```\n\n在此示例中：\n\
    * `fs.createWriteStream('example.txt')` 为 example.txt 创建了一个可写流。\n* `write` 方法将数据写入流中。\n\
    * `end` 方法表示不再有更多数据写入。\n* 当所有数据写入完成后，会触发 `finish` 事件。\n* 如果写入发生错误，会触发 `error`\
    \ 事件。\n\n#### 双工流\n\n双工流可以执行读取和写入操作，使其对于网络通信和类似任务非常有用。\n\n示例：使用双工流\n\n```javascript\n\
    const net = require('net');\n\nconst server = net.createServer((socket) => {\n\
    \  socket.write('Welcome to the server!\\n');\n\n  socket.on('data', (data) =>\
    \ {\n    console.log('Received:', data.toString());\n    socket.write('You said:\
    \ ' + data);\n  });\n\n  socket.on('end', () => {\n    console.log('Client disconnected');\n\
    \  });\n\n  socket.on('error', (err) => {\n    console.error('Error:', err);\n\
    \  });\n});\n\nserver.listen(3000, () => {\n  console.log('Server listening on\
    \ port 3000');\n});\n```\n\n在此示例中：\n* `net.createServer` 创建了一个使用双工流的 TCP 服务器。\n\
    * `socket` 对象代表一个双工流，可以从客户端读取数据并写回客户端。\n\n#### 转换流\n\n转换流是双工流，可以在读取或写入数据的同时修改或转换数据。它们对于数据压缩和加密等任务特别有用。\n\
    \n示例：带有 zlib 的转换流\n\n```javascript\nconst fs = require('fs');\nconst zlib = require('zlib');\n\
    \nconst readStream = fs.createReadStream('example.txt', 'utf8');\n```\n\n"
- fmt: "\n```javascript\nconst writeStream = fs.createWriteStream('example.txt.gz');\n\
    const gzip = zlib.createGzip();\nreadStream.pipe(gzip).pipe(writeStream);\n\n\
    writeStream.on('finish', () => {\n  console.log('File compression completed');\n\
    });\n```\n\nIn this example:\n* `zlib.createGzip` creates a transform stream that\
    \ compresses data.\n* The `pipe` method is used to chain the readable stream,\
    \ transform stream, and writable stream together.\n* Data read from `example.txt`\
    \ is compressed and written to `example.txt.gz`.\n\n## Understanding Buffers\n\
    \nBUFFERS ARE TEMPORARY storage areas for binary data. In Node.js, buffers are\
    \ used to handle raw binary data, making them essential for working with streams\
    \ and other I/O operations.\n\n### Creating Buffers\n\nBUFF CAN BE CREATED from\
    \ various sources, such as arrays, strings, or existing buffer data.\n\n### Example:\
    \ Creating a Buffer from a String\n\n```javascript\nconst buffer = Buffer.from('Hello,\
    \ world!', 'utf8');\nconsole.log(buffer);\nconsole.log(buffer.toString('utf8'));\n\
    ```\n\nIn this example:\n* `Buffer.from('Hello, world!', 'utf8')` creates a buffer\
    \ from the string 'Hello, world!' using UTF-8 encoding.\n* The buffer is then\
    \ converted back to a string using `buffer.toString('utf8')`.\n\n### Writing to\
    \ Buffers\n\nBUFF PROVIDE METHODS for writing binary data.\n\n### Example: Writing\
    \ to a Buffer\n\n```javascript\nconst buffer = Buffer.alloc(16);\nbuffer.write('Hello,\
    \ world!', 'utf8');\nconsole.log(buffer);\nconsole.log(buffer.toString('utf8'));\n\
    ```\n\nIn this example:\n* `Buffer.alloc(16)` creates a buffer of 16 bytes.\n\
    * The `write` method writes the string 'Hello, world!' to the buffer using UTF-8\
    \ encoding.\n* The buffer is then converted back to a string using `buffer.toString('utf8')`.\n\
    \n### Buffer Operations\n\nBUFF SUPPORT VARIOUS operations for manipulating binary\
    \ data, such as slicing and concatenating.\n\n### Example: Buffer Slicing\n\n\
    ```javascript\nconst buffer = Buffer.from('Hello, world!', 'utf8');\nconst slice\
    \ = buffer.slice(0, 5);\nconsole.log(slice.toString('utf8')); // Output: Hello\n\
    ```\n\nIn this example:\n* `buffer.slice(0, 5)` creates a new buffer that references\
    \ a portion of the original buffer.\n* The slice contains the first 5 bytes of\
    \ the original buffer, which is then converted to a string.\n\n### Example: Buffer\
    \ Concatenation\n\n```javascript\nconst buffer1 = Buffer.from('Hello, ', 'utf8');\n\
    const buffer2 = Buffer.from('world!', 'utf8');\nconst combined = Buffer.concat([buffer1,\
    \ buffer2]);\nconsole.log(combined.toString('utf8')); // Output: Hello, world!\n\
    ```\n\nIn this example:\n* `Buffer.concat([buffer1, buffer2])` concatenates `buffer1`\
    \ and `buffer2` into a single buffer.\n* The combined buffer is then converted\
    \ to a string.\n\n## Practical Applications of Streams and Buffers\n\nSTREAMS\
    \ AND BUFFERS are used in various real-world applications, such as:\n\n1. **File\
    \ Processing**:\n    * Reading and writing large files without loading them entirely\
    \ into memory.\n    * Example: Processing log files or media files.\n2. **Network\
    \ Communication**:\n    * Handling data transfer over networks efficiently.\n\
    \    * Example: Building HTTP servers, TCP servers, or WebSocket servers.\n3.\
    \ **Data Transformation**:\n    * Modifying data as it is read or written, such\
    \ as compression or encryption.\n    * Example: Compressing files using `gzip`\
    \ or encrypting data streams.\n4. **Real-time Data Processing**:\n    * Handling\
    \ real-time data streams, such as video streaming or real-time analytics.\n  \
    \  * Example: Processing video streams for live broadcasting.\n\n![image](d2d_images/scene_break.png)\n\
    ![image](d2d_images/image115.png)\n\nSTREAMS AND BUFFERS are powerful tools in\
    \ Node.js for handling I/O operations efficiently. Streams allow you to process\
    \ data in chunks, making them ideal for working with large datasets or files.\
    \ Buffers enable you to manipulate binary data directly, providing the foundation\
    \ for working with streams. By mastering these concepts, you can build robust\
    \ applications that handle data efficiently and perform well under load. Whether\
    \ you are processing files, communicating over networks, or transforming data\
    \ in real-time, streams and buffers are essential components of your Node.js toolkit.\n\
    \n## 3.4. Handling File Uploads\n\nHANDLING FILE UPLOADS is a common requirement\
    \ in web applications. Node.js provides various tools and libraries to simplify\
    \ this process. One of the most popular libraries for handling file uploads is\
    \ `multer`. This section will guide you through setting up file uploads using\
    \ `multer`.\n\n### Setting Up multer\n\n`multer` is a middleware for handling\
    \ `multipart/form-data`, which is primarily used for uploading files and works\
    \ seamlessly with Express.\n\n### Installation\n\nFirst, you need to install `multer`:\n\
    `npm install express multer`\n\n### Basic File Upload Example\n\n#### Step 1:\
    \ Import Modules\n\n```javascript\nconst express = require('express');\nconst\
    \ multer = require('multer');\nconst path = require('path');\n```\n\n#### Step\
    \ 2: Configure Storage for Uploaded Files\n\n```javascript\nconst storage = multer.diskStorage({\n\
    \  destination: function (req, file, cb) {\n    cb(null, 'uploads/'); // Directory\
    \ to save the files\n  },\n  filename: function (req, file, cb) {\n    cb(null,\
    \ file.fieldname + '-' + Date.now() + path.extname(file.originalname)); // Filename\
    \ format\n  }\n});\n\nconst upload = multer({ storage: storage });\n```\n\n####\
    \ Step 3: Set Up the Express Application\n\n```javascript\nconst app = express();\n\
    const PORT = 3000;\napp.use(express.static('public')); // Serve static files from\
    \ the \"public\" directory\n```\n\n#### Step 4: Create an Upload Endpoint\n\n\
    ```javascript\napp.post('/upload', upload.single('file'), (req, res) => {\n  try\
    \ {\n    res.send('File uploaded successfully');\n  } catch (error) {\n    res.status(400).send('Error\
    \ uploading file');\n  }\n});\n```\n\n#### Step 5: Start the Server\n\n```javascript\n\
    app.listen(PORT, () => {\n  console.log(`Server is running on port ${PORT}`);\n\
    });\n```\n\n#### Step 6: CREATE AN HTML Form for File Upload\n\nCreate an `index.html`\
    \ file in the `public` directory with the following content:\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>File Upload</title>\n\
    </head>\n<body>\n  <h1>Upload a File</h1>\n  <form action=\"/upload\" method=\"\
    POST\" enctype=\"multipart/form-data\">\n    <input type=\"file\" name=\"file\"\
    \ required>\n    <button type=\"submit\">Upload</button>\n  </form>\n</body>\n\
    </html>\n```\n\n### Complete Example\n\nHere’s the complete code for the server:\n\
    \n```javascript\nconst express = require('express');\nconst multer = require('multer');\n\
    const path = require('path');\n\nconst app = express();\nconst PORT = 3000;\n\n\
    const storage = multer.diskStorage({\n  destination: function (req, file, cb)\
    \ {\n    cb(null, 'uploads/');\n  },\n  filename: function (req, file, cb) {\n\
    \    cb(null, file.fieldname + '-' + Date.now() + path.extname(file.originalname));\n\
    \  }\n});\n\nconst upload = multer({ storage: storage });\n\napp.use(express.static('public'));\n\
    \napp.post('/upload', upload.single('file'), (req, res) => {\n  try {\n    res.send('File\
    \ uploaded successfully');\n  } catch (error) {\n    res.status(400).send('Error\
    \ uploading file');\n  }\n});\n\napp.listen(PORT, () => {\n  console.log(`Server\
    \ is running on port ${PORT}`);\n});\n```\n"
