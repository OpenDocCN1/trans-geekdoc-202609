    ## 6.6. Practical Examples: Building a RESTful API with Database Integration


    BUILDING A RESTFUL API with database integration is a common task in modern web
    development. In this section, we will create a simple RESTful API using `Node.js`,
    `Express`, and `Sequelize` for database integration with `PostgreSQL`. This API
    will handle basic CRUD operations for a `User` model.


    ### Setting Up the Project


    I INITIALIZE THE PROJECT:


    Create a new directory for your project and initialize it with `npm`:


    ```

    mkdir restful-api

    cd restful-api

    npm init -y

    ```


    nstall Dependencies:


    Install the required dependencies:


    ```

    npm install express sequelize pg pg-hstore body-parser

    ```


    Project Structure:


    Create the following directory structure:


    ```text

    restful-api/

    ├── config/

    │   └── database.js

    ├── models/

    │   └── user.js

    ├── routes/

    │   └── users.js

    ├── app.js

    └── package.json

    ```


    ### Configuring the Database


    DATABASE CONFIGURATION:


    Create a `config/database.js` file to configure the `Sequelize` instance:


    ```javascript

    const { Sequelize } = require(''sequelize'');


    const sequelize = new Sequelize(''my_database'', ''your_username'', ''your_password'',
    {


    host: ''localhost'',


    dialect: ''postgres'',


    logging: false,


    });


    module.exports = sequelize;

    ```


    Defining the User Model:


    Create a `models/user.js` file to define the `User` model:


    ```javascript

    const { DataTypes } = require(''sequelize'');


    const sequelize = require(''../config/database'');


    const User = sequelize.define(''User'', {


    username: {


    type: DataTypes.STRING,


    allowNull: false,


    unique: true,


    },


    password: {


    type: DataTypes.STRING,


    allowNull: false,


    },


    email: {


    type: DataTypes.STRING,


    allowNull: false,


    unique: true,


    },


    });


    module.exports = User;

    ```


    ### Setting Up Express and Routes


    CREATING THE EXPRESS App:


    Create an `app.js` file to set up the `Express` application:


    ```javascript

    const express = require(''express'');


    const bodyParser = require(''body-parser'');


    const sequelize = require(''./config/database'');


    const User = require(''./models/user'');


    const userRoutes = require(''./routes/users'');


    const app = express();


    // Middleware


    app.use(bodyParser.json());


    // Routes


    app.use(''/api/users'', userRoutes);


    // Sync database and start server


    sequelize.sync()


    .then(() => {


    app.listen(3000, () => {


    console.log(''Server is running on port 3000'');


    });


    })

    .catch(err => {


    console.error(''Unable to connect to the database:'', err);


    });

    ```


    Creating the Routes:


    Create a `routes/users.js` file to define the routes for user operations:


    ```javascript

    const express = require(''express'');


    const User = require(''../models/user'');


    const router = express.Router();


    // Get all users


    router.get(''/'', async (req, res) => {


    try {


    const users = await User.findAll();


    res.json(users);


    } catch (err) {


    res.status(500).json({ error: err.message });


    }


    });


    // Get a user by ID


    router.get(''/:id'', async (req, res) => {


    try {


    const user = await User.findByPk(req.params.id);


    if (user) {


    res.json(user);


    } else {


    res.status(404).json({ error: ''User not found'' });


    }


    } catch (err) {


    res.status(500).json({ error: err.message });


    }

    });


    // Create a new user


    router.post(''/'', async (req, res) => {


    try {


    const user = await User.create(req.body);


    res.status(201).json(user);


    } catch (err) {


    res.status(400).json({ error: err.message });


    }


    });


    // Update a user


    router.put(''/:id'', async (req, res) => {


    try {


    const user = await User.findByPk(req.params.id);


    if (user) {


    await user.update(req.body);


    res.json(user);


    } else {


    res.status(404).json({ error: ''User not found'' });


    }


    } catch (err) {


    res.status(400).json({ error: err.message });


    }

    });


    // Delete a user


    router.delete(''/:id'', async (req, res) => {


    try {


    const user = await User.findByPk(req.params.id);


    if (user) {


    await user.destroy();


    res.status(204);


    } else {


    res.status(404).json({ error: ''User not found'' });


    }


    } catch (err) {


    res.status(500).json({ error: err.message });


    }


    });


    module.exports = router;

    ```


    #### Running the API


    RUN THE API, EXECUTE the following command:


    ```

    node app.js

    ```


    Your RESTful API is now running on `http://localhost:3000`. You can use tools
    like Postman or cURL to test the endpoints.


    #### Testing the Endpoints


    Get all users: `GET http://localhost:3000/api/users`


    Get a user by ID: `GET http://localhost:3000/api/users/:id`


    Create a new user: `POST http://localhost:3000/api/users`


    Update a user: `PUT http://localhost:3000/api/users/:id`


    Delete a user: `DELETE http://localhost:3000/api/users/:id`

