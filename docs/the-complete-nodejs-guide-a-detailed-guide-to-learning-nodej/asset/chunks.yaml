  trans: "\n\n```javascript\nmyEmitter.emit('greet'); // Output: Hello! The greet\
    \ event was emitted.\n\n// Remove the listener\nmyEmitter.removeListener('greet',\
    \ onGreet);\n\n// Emit the 'greet' event again\nmyEmitter.emit('greet'); // No\
    \ output\n```\n\n–––––––\n\n![image](img/scene_break.png)\n\n在这里，我们为 'greet' 事件注册了一个监听器，触发该事件以观察监听器的动作，然后使用\
    \ `removeListener` 移除该监听器。当我们再次触发事件时，监听器将不再被调用。\n\n### 只监听一次事件\n\n在某些情况下，你可能只想对事件进行一次监听。为此，你可以使用\
    \ `once` 方法，它确保监听器只在事件第一次被触发时被调用。\n\n```javascript\nconst EventEmitter = require('events');\n\
    \nclass MyEmitter extends EventEmitter {}\n\nconst myEmitter = new MyEmitter();\n\
    \n// 注册一个只调用一次的监听器\nmyEmitter.once('specialEvent', () => {\n  console.log('This\
    \ will be logged only once.');\n});\n\n// 触发两次 'specialEvent'\nmyEmitter.emit('specialEvent');\
    \ // Output: This will be logged only once.\nmyEmitter.emit('specialEvent'); //\
    \ No output\n```\n\n在此示例中，'specialEvent' 的监听器是通过 `once` 注册的。当事件第一次触发时，监听器会被调用。然而，后续的事件触发不会触发该监听器。\n\
    \n### 使用事件发射器的错误处理\n\n处理错误是构建健壮应用程序的关键部分。事件发射器有一个特殊的 'error' 事件，你可以用它来优雅地处理错误。\n\
    \n示例：\n\n```javascript\nconst EventEmitter = require('events');\n\nclass MyEmitter\
    \ extends EventEmitter {}\n\nconst myEmitter = new MyEmitter();\n\n// 注册错误监听器\n\
    myEmitter.on('error', (err) => {\n  console.error('An error occurred:', err.message);\n\
    });\n\n// 触发错误事件\nmyEmitter.emit('error', new Error('Something went wrong!'));\n\
    ```\n\n在此示例中，我们为 'error' 事件注册了一个监听器。当触发错误事件时，监听器会记录错误信息。如果你在没有监听器的情况下触发了 'error'\
    \ 事件，Node.js 将抛出异常并终止进程，这突显了始终处理错误的重要性。\n\n![image](img/image131.png)\n\n### 实际用例：创建一个自定义事件发射器\n\
    \n为了在更实际的场景中查看事件发射器，让我们为简单的聊天应用程序创建一个自定义事件发射器。这将涉及为用户操作（如加入、发送消息和离开聊天）触发事件。\n\n\
    ```javascript\nconst EventEmitter = require('events');\n\nclass Chat extends EventEmitter\
    \ {\n  join(username) {\n    this.emit('join', username);\n  }\n\n  sendMessage(username,\
    \ message) {\n    this.emit('message', username, message);\n  }\n\n  leave(username)\
    \ {\n    this.emit('leave', username);\n  }\n}\n\nconst chat = new Chat();\n\n\
    // 注册监听器\nchat.on('join', (username) => {\n  console.log(`${username} joined the\
    \ chat.`);\n});\n\nchat.on('message', (username, message) => {\n  console.log(`${username}:\
    \ ${message}`);\n});\n\nchat.on('leave', (username) => {\n  console.log(`${username}\
    \ left the chat.`);\n});\n\n// 模拟用户操作\nchat.join('Alice');\nchat.sendMessage('Alice',\
    \ 'Hello everyone!');\nchat.leave('Alice');\n```\n\n在此示例中，我们定义了一个扩展 `EventEmitter`\
    \ 的 `Chat` 类。然后我们为常见的聊天操作（`join`、`sendMessage`、`leave`）创建了触发相应事件的方法。我们还注册了这些这些事件的监听器来处理消息。\n\
    \n![image](img/image204.png)\n\n## 7.4. 流与管道链\n\n流是 Node.js 中强大的功能之一，它通过分块读取或写入数据来实现高效的数据处理，而不是一次性将所有数据加载到内存中。这使得流成为处理大文件、实时数据以及其他对效率和性能至关场景的理想选择。理解流以及如何使用管道链可以显著增强你构建高性能\
    \ Node.js 应用的能力。\n\n![image](img/image052.png)\n\n### 什么是流？\n\n流是以持续的方式从源读取数据或向目的地写入数据的。Node.js\
    \ 中有四种类型的流：\n\n1. `Readable Streams`（可读流）：用于顺序读取数据。示例包括用于文件读取 `fs.createReadStream`\
    \ 和 HTTP 请求。\n2. `Writable Streams`（可写流）：用于顺序写入数据。示例包括用于文件写入 `fs.createWriteStream`\
    \ 和 HTTP 响应。\n3. `Duplex Streams`（双向流）：既可读又可写，用于双向通信。示例包括 TCP 套接字。\n4. `Transform\
    \ Streams`（转换流）：双向流的一种，可以在读取和写入时对数据进行修改或转换。示例包括用于压缩的 `zlib` 流。\n\n### 理解基础知识\n\
    \n#### 可读流：\n\n```javascript\nconst fs = require('fs');\n\n// 创建一个可读流\nconst readableStream\
    \ = fs.createReadStream('example.txt', {\n  encoding: 'utf8',\n  highWaterMark:\
    \ 16 * 1024 // 16 KB 块大小\n});\n\n// 处理流事件\nreadableStream.on('data', (chunk) =>\
    \ {\n  console.log('Received chunk:', chunk);\n});\n\nreadableStream.on('end',\
    \ () => {\n  console.log('No more data.');\n});\n\nreadableStream.on('error',\
    \ (err) => {\n  console.error('Error:', err);\n});\n```\n\n–––––––\n\n![image](img/scene_break.png)\n\
    \n在此示例中，我们从名为 `example.txt` 的文件创建一个可读流。当有数据块可读时会触发 `data` 事件。`end` 事件表示流没有更多数据了，而\
    \ `error` 事件处理读取过程中发生的错误。\n\n#### 创建可写流：\n\n```javascript\nconst fs = require('fs');\n\
    \n// 创建一个可写流\nconst writableStream = fs.createWriteStream('output.txt');\n\n//\
    \ 向流写入数据\nwritableStream.write('Hello, world!\\n');\nwritableStream.write('Writing\
    \ more data...\\n');\n\n// 结束可写流\nwritableStream.end('This is the end.\\n');\n\
    \n// 处理流事件\nwritableStream.on('finish', () => {\n  console.log('All writes are\
    \ now complete.');\n});\n\nwritableStream.on('error', (err) => {\n  console.error('Error:',\
    \ err);\n});\n```\n\n在这里，我们为名为 `output.txt` 的文件创建一个可写流。我们向流写入了多次数据，并调用 `end` 方法表示不再有更多数据写入。`finish`\
    \ 事件在所有数据都刷新到底层系统时触发，而 `error` 事件处理写入过程中发生的任何错误。\n\n### 管道链\n\nNode.js 流最强大的功能之一是将数据从一个流管道（pipe）到另一个流。这对于文件压缩等任务特别有用，你可以从文件中读取数据、进行压缩并写入另一个文件，全部在单个操作链中完成。\n\
    \n示例：\n\n```javascript\nconst fs = require('fs');\nconst zlib = require('zlib');\n\
    \n// 创建输入文件的可读流\nconst readableStream = fs.createReadStream('input.txt');\n\n\
    // 创建输出文件的可写流\nconst writableStream = fs.createWriteStream('input.txt.gz');\n\n\
    // 创建用于压缩的转换流\nconst gzip = zlib.createGzip();\n\nreadableStream.pipe(gzip).pipe(writableStream);\n\
    ```\n\n"
- fmt: "\n// Pipe the streams together \n\n```javascript\nreadableStream\n  .pipe(gzip)\
    \ // Compress the data\n  .pipe(writableStream) // Write the compressed data to\
    \ the output file\n  .on('finish', () => {\n    console.log('File successfully\
    \ compressed.');\n  })\n  .on('error', (err) => {\n    console.error('Error:',\
    \ err);\n  });\n```\n\nIn this example, we use `fs.createReadStream` to read data\
    \ from `input.txt`, `zlib.createGzip` to compress the data, and `fs.createWriteStream`\
    \ to write the compressed data to `input.txt.gz`. The `pipe` method connects these\
    \ streams together, allowing data to flow from the readable stream through the\
    \ transform stream and into the writable stream seamlessly.\n\n## Transform Streams\n\
    \nTRANSFORM STREAMS are a special type of duplex stream where the output is computed\
    \ based on the input. They are particularly useful for operations like compression,\
    \ encryption, or modifying data as it is being read or written.\n\n### Example\n\
    \n```javascript\nconst { Transform } = require('stream');\n\nclass UppercaseTransform\
    \ extends Transform {\n  _transform(chunk, encoding, callback) {\n    this.push(chunk.toString().toUpperCase());\n\
    \    callback();\n  }\n}\n\nconst uppercase = new UppercaseTransform();\n\n//\
    \ Using the custom transform stream\nprocess.stdin\n  .pipe(uppercase)\n  .pipe(process.stdout);\n\
    ```\n\nIn this example, we create a custom transform stream `UppercaseTransform`\
    \ that converts all input data to uppercase. By piping `process.stdin` to `uppercase`\
    \ and then to `process.stdout`, we can transform any input typed into the terminal\
    \ to uppercase before it is printed out.\n\n## Error Handling in Streams\n\nHANDLING\
    \ ERRORS in streams is crucial to ensure your application can recover gracefully\
    \ from unexpected issues.\n\n### Example\n\n```javascript\nconst fs = require('fs');\n\
    \nconst readableStream = fs.createReadStream('nonexistent.txt');\n\nreadableStream.on('error',\
    \ (err) => {\n  console.error('Error:', err);\n});\n\n// Providing a fallback\
    \ or alternate action\nreadableStream.on('error', (err) => {\n  if (err.code ===\
    \ 'ENOENT') {\n    console.log('File not found. Creating a new file...');\n  \
    \  fs.writeFileSync('nonexistent.txt', 'This is a new file.');\n  } else {\n \
    \   console.error('Error:', err);\n  }\n});\n```\n\nIn this example, we handle\
    \ an error event for a non-existent file. If the file is not found (`ENOENT` error\
    \ code), we create a new file as a fallback.\n\n![image](d2d_images/image046.png)\n\
    ![image](d2d_images/image183.png)\n\n## 7.5. Module Design Patterns\n\nAS YOU\
    \ DELVE DEEPER into advanced Node.js programming, understanding module design\
    \ patterns is essential. These patterns help you organize your code, improve maintainability,\
    \ and enhance scalability. Modules in Node.js are individual files or packages\
    \ that encapsulate specific functionality and can be reused across different parts\
    \ of your application. This section explores some common module design patterns\
    \ and how to apply them effectively in your Node.js projects.\n\n### 1. Revealing\
    \ Module Pattern\n\nTHE REVEALING MODULE Pattern is one of the most common design\
    \ patterns in JavaScript. It aims to encapsulate private members while exposing\
    \ only the necessary parts of the module.\n\n### Example\n\n```javascript\n//\
    \ mathModule.js\nconst mathModule = (() => {\n  let _privateCounter = 0;\n  function\
    \ _privateMethod() {\n    console.log('Private method');\n  }\n  function add(a,\
    \ b) {\n    _privateCounter++;\n    return a + b;\n  }\n  function subtract(a,\
    \ b) {\n    _privateCounter++;\n    return a - b;\n  }\n  return {\n    add,\n\
    \    subtract\n  };\n})();\n\nmodule.exports = mathModule;\n\n// main.js\nconst\
    \ math = require('./mathModule');\nconsole.log(math.add(5, 3)); // Output: 8\n\
    console.log(math.subtract(5, 3)); // Output: 2\n```\n\nIn this example, `_privateCounter`\
    \ and `_privateMethod` are private and not accessible outside `mathModule`. Only\
    \ the `add` and `subtract` methods are revealed and can be used by other modules.\n\
    \n![image](d2d_images/image028.png)\n\n### 2. Singleton Pattern\n\nTHE SINGLETON\
    \ PATTERN ensures that a class has only one instance and provides a global point\
    \ of access to it. This is useful for managing global states, like configurations\
    \ or logging.\n\n### Example\n\n```javascript\n// logger.js\nclass Logger {\n\
    \  constructor() {\n    if (Logger.instance) {\n      return Logger.instance;\n\
    \    }\n    this.logs = [];\n    Logger.instance = this;\n  }\n  log(message)\
    \ {\n    this.logs.push(message);\n  }\n  printLogs() {\n    console.log(this.logs);\n\
    \  }\n}\nmodule.exports = new Logger();\n\n// main.js\nconst logger = require('./logger');\n\
    logger.log('First log');\nconst logger2 = require('./logger');\nlogger2.log('Second\
    \ log');\n```\n*(Note: The logic was reconstructed based on the provided fragmented\
    \ text to ensure valid JS syntax)*\n\nIn this example, the `Logger` class ensures\
    \ only one instance is created.\n\n### 3. Factory Pattern\n\nTHE FACTORY PATTERN\
    \ is used to create objects without exposing instantiation logic to the client.\n\
    \n### Example\n\n```javascript\n// shapeFactory.js\nclass Circle {\n  constructor(radius)\
    \ {\n    this.radius = radius;\n  }\n  draw() {\n    console.log(`Drawing a circle\
    \ with radius ${this.radius}`);\n  }\n}\nclass Square {\n  constructor(side) {\n\
    \    this.side = side;\n  }\n  draw() {\n    console.log(`Drawing a square with\
    \ side ${this.side}`);\n  }\n}\nclass ShapeFactory {\n  static createShape(type,\
    \ size) {\n    if (type === 'circle') {\n      return new Circle(size);\n    }\
    \ else if (type === 'square') {\n      return new Square(size);\n    }\n    return\
    \ null;\n  }\n}\nmodule.exports = ShapeFactory;\n\n// main.js\nconst ShapeFactory\
    \ = require('./shapeFactory');\nconst myCircle = ShapeFactory.createShape('circle',\
    \ 5);\nmyCircle.draw(); // Output: Drawing a circle with radius 5\nconst mySquare\
    \ = ShapeFactory.createShape('square', 4);\nmySquare.draw(); // Output: Drawing\
    \ a square with side 4\n```\n\nIn this example, `ShapeFactory` abstracts the creation\
    \ logic for different shapes, making the code cleaner.\n\n### 4. Middleware Pattern\n\
    \nTHE MIDDLEWARE PATTERN is widely used in web frameworks like Express.js. It\
    \ allows you to define a pipeline of processing steps that requests pass through.\
    \ Each middleware function can modify the request, response, or pass control to\
    \ the next.\n\n### Example\n\n```javascript\n// middleware.js\nfunction logger(req,\
    \ res, next) {\n  console.log(`${req.method} ${req.url}`);\n  next();\n}\nfunction\
    \ errorHandler(err, req, res, next) {\n  console.error(err.stack);\n  res.status(500).send('Something\
    \ broke!');\n}\nmodule.exports = { logger, errorHandler };\n\n// server.js\nconst\
    \ express = require('express');\nconst { logger, errorHandler } = require('./middleware');\n\
    const app = express();\n\napp.use(logger);\napp.get('/', (req, res) => {\n  res.send('Hello\
    \ World');\n});\napp.get('/error', (req, res) => {\n  throw new Error('Oops!');\n\
    });\n\napp.use(errorHandler);\napp.listen(3000, () => {\n  console.log('Server\
    \ running on port 3000');\n});\n```\n"
