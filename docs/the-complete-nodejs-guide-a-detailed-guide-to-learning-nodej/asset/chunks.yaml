    \ true \n}); \n\nconst db = mongoose.connection; \n\ndb.on('error', console.error.bind(console,\
    \ 'connection error:')); \n\ndb.once('open', () => { \n  console.log('Connected\
    \ to MongoDB'); \n});\n```\n\n–––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n### Defining Schemas and Models\n\nSCHEMAS IN MONGO define the structure of\
    \ the documents within a collection. Once a schema is defined, you can create\
    \ a model based on that schema. Here’s an example of defining a `User` schema\
    \ and model:\n\n```javascript\nconst { Schema, model } = mongoose; \n\nconst userSchema\
    \ = new Schema({ \n  username: { \n    type: String, \n    required: true, \n\
    \    unique: true \n  }, \n  password: { \n    type: String, \n    required: true\
    \ \n  }, \n  email: { \n    type: String, \n    required: true, \n    unique:\
    \ true \n  }, \n  createdAt: { \n    type: Date, \n    default: Date.now  \n \
    \ } \n}); \n\nconst User = model('User', userSchema);\n```\n\n–––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n### Performing CRUD Operations\n\nMONGOOSE PROVIDES A simple and consistent\
    \ API for performing CRUD operations. Here’s how to create, read, update, and\
    \ delete records using Mongoose.\n\n#### Creating (Inserting) Data\n\nTo create\
    \ a new record in the database, use the `save` method:\n\n```javascript\nconst\
    \ newUser = new User({ \n  username: 'johndoe', \n  password: 'securepassword',\
    \ \n  email: 'johndoe@example.com' \n}); \n\nnewUser.save((err) => { \n  if (err)\
    \ return console.error(err); \n  console.log('User created:', newUser); \n});\n\
    ```\n\n#### Reading (Finding) Data\n\nTo retrieve data from the database, use\
    \ the `find` method:\n\n```javascript\nUser.find({}, (err, users) => { \n  if\
    \ (err) return console.error(err); \n  console.log('All users:', users); \n});\
    \ \n\nUser.findOne({ username: 'johndoe' }, (err, user) => { \n  if (err) return\
    \ console.error(err); \n  console.log('Single user:', user); \n});\n```\n\n####\
    \ Updating Data\n\nTo update an existing record, use the `updateOne` or `findByIdAndUpdate`\
    \ methods:\n\n```javascript\nUser.updateOne({ username: 'johndoe' }, { password:\
    \ 'newsecurepassword' }, (err, res) => { \n  if (err) return console.error(err);\
    \ \n  console.log('User updated:', res); \n}); \n\nUser.findByIdAndUpdate('user_id',\
    \ { email: 'newemail@example.com' }, (err, user) => { \n  if (err) return console.error(err);\
    \ \n  console.log('Updated user:', user); \n});\n```\n\n#### Deleting Data\n\n\
    To delete a record, use the `deleteOne` or `findByIdAndDelete` methods:\n\n```javascript\n\
    User.deleteOne({ username: 'johndoe' }, (err) => { \n  if (err) return console.error(err);\
    \ \n  console.log('User deleted'); \n}); \n\nUser.findByIdAndDelete('user_id',\
    \ (err) => { \n  if (err) return console.error(err); \n  console.log('User deleted');\
    \ \n});\n```\n\n### Advanced Features: Middleware and Virtuals\n\n#### MIDDLEWARE\n\
    \nMiddleware in Mongoose is similar to middleware in Express. It allows you to\
    \ define pre- and post-hooks for various model methods. Here’s an example of a\
    \ pre-save middleware that hashes a user’s password before saving it:\n\n```javascript\n\
    const bcrypt = require('bcrypt'); \n\nuserSchema.pre('save', function(next) {\
    \ \n  const user = this; \n  if (!user.isModified('password')) return next();\
    \ \n  bcrypt.hash(user.password, 10, (err, hash) => { \n    if (err) return next(err);\
    \ \n    user.password = hash; \n    next(); \n  }); \n});\n```\n\n#### Virtuals\n\
    \nVirtuals are document properties that you can get and set but that do not get\
    \ persisted to MongoDB. They are typically used for computed properties. Here’s\
    \ an example of adding a virtual property for the user’s full name:\n\n```javascript\n\
    userSchema.virtual('fullName').get(function() { \n  return `${this.firstName}\
    \ ${this.lastName}`; \n}); \n\nconst User = model('User', userSchema); \n\nconst\
    \ user = new User({ \n  firstName: 'John', \n  lastName: 'Doe' \n}); \n\nconsole.log(user.fullName);\
    \ // Output: John Doe\n```\n\n––––––––––\n\n![image](d2d_images/scene_break.png)\n\
    ![image](d2d_images/scene_break.png)\n\n### Connection Pooling\n\nConnection pooling\
    \ is a technique used to maintain a cache of connections so they can be reused.\
    \ Connection pooling reduces the overhead of establishing new connections.\n\n\
    1. **Performance**: Establishing a new connection can be time-consuming and resource-intensive.\n\
    2. **Resource Management**: Databases have a limit on concurrent connections they\
    \ can handle.\n3. **Scalability**: Connection pooling allows applications to handle\
    \ more requests efficiently.\n\n#### Implementing Connection Pooling in MySQL\n\
    \nTo implement connection pooling in MySQL, you can use the `mysql2` module. Here’s\
    \ how to do it:\n\n```javascript\nconst mysql = require('mysql2'); \n\nconst pool\
    \ = mysql.createPool({ \n  host: 'localhost', \n  user: 'root', \n  password:\
    \ 'password', \n  database: 'my_database', \n  waitForConnections: true, \n  connectionLimit:\
    \ 10, \n  queueLimit: 0 \n}); \n\n// Use the pool to perform queries\npool.query('SELECT\
    \ * FROM users', (err, results) => { \n  if (err) throw err; \n  console.log(results);\
    \ \n}); \n\n// Close the pool\npool.end((err) => { \n  if (err) throw err; \n\
    \  console.log('Pool closed'); \n});\n```\n\n#### Implementing Connection Pooling\
    \ in PostgreSQL\n\nTo implement connection pooling in PostgreSQL, you can use\
    \ the `pg` module. Here’s how to do it:\n\n```javascript\nconst { Pool } = require('pg');\
    \ \n\nconst pool = new Pool({ \n  user: 'your_username', \n  host: 'localhost',\
    \ \n  database: 'your_database', \n  password: 'your_password', \n  port: 5432,\
    \ \n  max: 10, // Maximum number of connections \n  idleTimeoutMillis: 30000,\
    \ // Close idle clients after 30 seconds \n  connectionTimeoutMillis: 2000 //\
    \ Return an error after 2 seconds if connection could not be established \n});\
    \ \n\n// Use the pool to perform queries\npool.query('SELECT * FROM users', (err,\
    \ res) => { \n  if (err) throw err; \n  console.log(res.rows); \n}); \n\n// Close\
    \ the pool\npool.end((err) => { \n  if (err) throw err; \n  console.log('Pool\
    \ closed'); \n});\n```\n\n#### Implementing Connection Pooling in MongoDB\n\n\
    To implement connection pooling in MongoDB, you can use the `mongodb` module.\
    \ Here’s how to do it:\n\n```javascript\nconst { MongoClient } = require('mongodb');\
    \ \n\nconst uri = 'mongodb://localhost:27017'; \n\nconst client = new MongoClient(uri,\
    \ { \n  useNewUrlParser: true, \n  useUnifiedTopology: true, \n  poolSize: 10,\
    \ // Maximum number of connections in the pool \n}); \n\nasync function run()\
    \ { \n  try { \n    await client.connect(); \n    console.log('Connected to MongoDB');\
    \ \n  } catch (err) {\n    console.error(err);\n  }\n}\n```\n"
