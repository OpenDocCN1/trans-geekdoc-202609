    \  useUnifiedTopology: true \n}); \n\nconst db = mongoose.connection; \n\ndb.on('error',\
    \ console.error.bind(console, 'connection error:')); \n\ndb.once('open', () =>\
    \ { \n  console.log('Connected to MongoDB'); \n});\n```\n\n–––––––––\n\n![image](img/scene_break.png)\n\
    \n### 定义 Schema 和模型\n\nMONGO 中的 SCHEMA 定义了集合中内部文档的结构。一旦定义了 Schema，你就可以基于该 Schema\
    \ 创建模型（model）。以下是一个定义 `User` Schema 和模型的示例：\n\n```javascript\nconst { Schema,\
    \ model } = mongoose; \n\nconst userSchema = new Schema({ \n  username: { \n \
    \   type: String, \n    required: true, \n    unique: true \n  }, \n  password:\
    \ { \n    type: String, \n    required: true \n  }, \n  email: { \n    type: String,\
    \ \n    required: true, \n    unique: true \n  }, \n  createdAt: { \n    type:\
    \ Date, \n    default: Date.now  \n  } \n}); \n\nconst User = model('User', userSchema);\n\
    ```\n\n–––––––––\n\n![image](img/scene_break.png)\n\n### 执行 CRUD 操作\n\nMONGOOSE\
    \ 提供了一个简单且一致的 API 来执行 CRUD 操作。以下是使用 Mongoose 进行创建、读取、更新和删除记录的方法。\n\n#### 创建（插入）数据\n\
    \n要在数据库中创建新记录，请使用 `save` 方法：\n\n```javascript\nconst newUser = new User({ \n \
    \ username: 'johndoe', \n  password: 'securepassword', \n  email: 'johndoe@example.com'\
    \ \n}); \n\nnewUser.save((err) => { \n  if (err) return console.error(err); \n\
    \  console.log('User created:', newUser); \n});\n```\n\n#### 读取（查找）数据\n\n要从数据库中检索数据，请使用\
    \ `find` 方法：\n\n```javascript\nUser.find({}, (err, users) => { \n  if (err) return\
    \ console.error(err); \n  console.log('All users:', users); \n}); \n\nUser.findOne({\
    \ username: 'johndoe' }, (err, user) => { \n  if (err) return console.error(err);\
    \ \n  console.log('Single user:', user); \n});\n```\n\n#### 更新数据\n\n要更新现有记录，请使用\
    \ `updateOne` 或 `findByIdAndUpdate` 方法：\n\n```javascript\nUser.updateOne({ username:\
    \ 'johndoe' }, { password: 'newsecurepassword' }, (err, res) => { \n  if (err)\
    \ return console.error(err); \n  console.log('User updated:', res); \n}); \n\n\
    User.findByIdAndUpdate('user_id', { email: 'newemail@example.com' }, (err, user)\
    \ => { \n  if (err) return console.error(err); \n  console.log('Updated user:',\
    \ user); \n});\n```\n\n#### 删除数据\n\n要删除记录，请使用 `deleteOne` 或 `findByIdAndDelete`\
    \ 方法：\n\n```javascript\nUser.deleteOne({ username: 'johndoe' }, (err) => { \n\
    \  if (err) return console.error(err); \n  console.log('User deleted'); \n});\
    \ \n\nUser.findByIdAndDelete('user_id', (err) => { \n  if (err) return console.error(err);\
    \ \n  console.log('User deleted'); \n});\n```\n\n### 高级功能：中间件和虚拟属性（Virtuals）\n\
    \n#### 中间件（MIDDLEWARE）\n\nMongoose 中的中间件类似于 Express 中的中间件。它允许你为各种模型方法定义前钩（pre-hooks）和后钩（post-hooks）。以下是一个保存前中间件的示例，它在保存用户密码之前对其进行哈希处理：\n\
    \n```javascript\nconst bcrypt = require('bcrypt'); \n\nuserSchema.pre('save',\
    \ function(next) { \n  const user = this; \n  if (!user.isModified('password'))\
    \ return next(); \n  bcrypt.hash(user.password, 10, (err, hash) => { \n    if\
    \ (err) return next(err); \n    user.password = hash; \n    next(); \n  }); \n\
    });\n```\n\n#### 虚拟属性（Virtuals）\n\n虚拟属性是文档的属性，你可以对其进行读取，但它们不会持久化到 MongoDB 中。它们通常用于计算属性。以下为用户全名添加虚拟属性的示例：\n\
    \n```javascript\nuserSchema.virtual('fullName').get(function() { \n  return `${this.firstName}\
    \ ${this.lastName}`; \n}); \n\nconst User = model('User', userSchema); \n\nconst\
    \ user = new User({ \n  firstName: 'John', \n  lastName: 'Doe' \n}); \n\nconsole.log(user.fullName);\
    \ // 输出: John Doe\n```\n\n––––––––––\n\n![image](img/scene_break.png)\n![image](img/scene_break.png)\n\
    \n### 连接池（Connection Pooling）\n\n连接池是一种用于维护连接缓存的技术，以便重复使用它们。连接池减少了建立新连接的开销。\n\n\
    1. **性能**：建立新连接可能耗时且消耗资源。\n2. **资源管理**：数据库对能够处理的并发连接数有数量限制。\n3. **可扩展性**：连接池允许应用程序高效地处理更多请求。\n\
    \n#### 在 MySQL 中实现连接池\n\n要在 MySQL 中实现连接池，你可以使用 `mysql2` 模块。以下是实现方法：\n\n```javascript\n\
    const mysql = require('mysql2'); \n\nconst pool = mysql.createPool({ \n  host:\
    \ 'localhost', \n  user: 'root', \n  password: 'password', \n  database: 'my_database',\
    \ \n  waitForConnections: true, \n  connectionLimit: 10, \n  queueLimit: 0 \n\
    }); \n\n// 使用连接池执行查询\npool.query('SELECT * FROM users', (err, results) => { \n\
    \  if (err) throw err; \n  console.log(results); \n}); \n\n// 关闭连接池\npool.end((err)\
    \ => { \n  if (err) throw err; \n  console.log('Pool closed'); \n});\n```\n\n\
    #### 在 PostgreSQL 中实现连接池\n\n要在 PostgreSQL 中实现连接池，你可以使用 `pg` 模块。以下是实现方法：\n\n```javascript\n\
    const { Pool } = require('pg'); \n\nconst pool = new Pool({ \n  user: 'your_username',\
    \ \n  host: 'localhost', \n  database: 'your_database', \n  password: 'your_password',\
    \ \n  port: 5432, \n  max: 10, // 最大连接数 \n  idleTimeoutMillis: 30000, // 空闲 30\
    \ 秒后关闭空闲客户端 \n  connectionTimeoutMillis: 2000 // 如果 2 秒后无法建立连接则返回错误 \n}); \n\n\
    // 使用连接池执行查询\npool.query('SELECT * FROM users', (err, res) => { \n  if (err) throw\
    \ err; \n  console.log(res.rows); \n}); \n\n// 关闭连接池\npool.end((err) => { \n \
    \ if (err) throw err; \n  console.log('Pool closed'); \n});\n```\n\n#### 在 MongoDB\
    \ 中实现连接池\n\n要在 MongoDB 中实现连接池，你可以使用 `mongodb` 模块。以下是实现方法：\n\n```javascript\nconst\
    \ { MongoClient } = require('mongodb'); \n\nconst uri = 'mongodb://localhost:27017';\
    \ \n\nconst client = new MongoClient(uri, { \n  useNewUrlParser: true, \n  useUnifiedTopology:\
    \ true, \n  poolSize: 10, // 池中的最大连接数 \n}); \n\nasync function run() { \n  try\
    \ { \n    await client.connect(); \n    console.log('Connected to MongoDB'); \n\
    \  } catch (err) {\n    console.error(err);\n  }\n}\n```\n\n"
