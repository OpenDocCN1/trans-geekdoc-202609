    \ list` | 列出当前项目中所有安装的包及其依赖项。 |\n| `npm list -g` | 列出所有全局安装的包。 |\n| `npm run <script>`\
    \ | 运行 `package.json` 中 `scripts` 部分定义的脚本。 |\n| `npm test` | 运行 `package.json`\
    \ 中定义的 `test` 脚本。 |\n| `npm start` | 运行 `package.json` 中定义的 `start` 脚本。 |\n| `npm\
    \ stop` | 运行 `package.json` 中定义的 `stop` 脚本。 |\n| `npm init <initializer>` | 使用初始化器初始化新项目（例如\
    \ `npm init react-app`）。 |\n| `npm version <newversion>` | 将 `package.json` 中的版本提升到新版本（例如\
    \ `npm version 1.0.1`）。 |\n| `npm publish` | 将包发布到 NPM 注册表。 |\n| `npm unpublish\
    \ <package>` | 从 NPM 注册表中移除已发布的包（可以使用 `--force` 进行强制取消发布）。 |\n| `npm cache clean--force`\
    \ | 清除 NPM 缓存。 |\n| `npm config set <key> <value>` | 将配置键设置为指定的值。 |\n| `npm config\
    \ get <key>` | 获取配置键的值。 |\n| `npm help` | 显示有关 NPM 的帮助信息。 |\n| `npm search <term>`\
    \ | 在 NPM 注册表中搜索匹配搜索术语的包。 |\n| `npm audit` | 对项目依赖项进行安全审计。 |\n| `npm audit fix`\
    \ | 自动修复项目依赖项中发现的漏洞。 |\n| `npm ci` | 使用 `package-lock.json` 从干净的状态安装依赖项，用于持续集成。\
    \ |\n| `npm rebuild` | 重新构建通过 `npm install` 安装的原生扩展。 |\n| `npm dedupe` | 去除项目的重复依赖。\
    \ |\n| `npm link` | 在开发期间为包文件夹创建符号链接。 |\n| `npm unlink` | 移除 `npm link` 创建的符号链接。\
    \ |\n| `npm doctor` | 运行一系列检查以确保您的 NPM 安装状态良好。 |\n| `npm exec <command>` | 从本地或全局包运行命令。\
    \ |\n\n表.1 NPM 命令\n\n![image](img/image025.png)\n\n## 理解 Node.js 模块\n模块帮助您将代码组织成不同的部分，无论是内置的、用户定义的还是第三方的。通过掌握模块，您可以构建更整洁、可扩展的应用程序。\n\
    \n## REPL (读取-评估-循环)\nREPL 是 Node.js 附带的一个交互式壳。它提供了一种尝试 JavaScript 的快速方法。\n\n\
    ### 什么是 REPL？\nREPL 代表：\n- **Read（读取）**：它读取用户的输入，并将其解析为数据结构。\n- **Eval（评估）**：它评估解析后的代码。\n\
    - **Print（打印）**：它打印评估结果。\n- **Loop（循环）**：它循环，等待新的输入。\n\n![image](img/image108.png)\n\
    \n### 启动 REPL\n要启动 REPL，只需打开终端或命令行提示符并输入：\n\n```bash\nnode\n```\n![image](img/165)\n\
    \n您将看到一个提示符（`>`），这表示 REPL 已准备好接受命令。\n\n### 基本用法\n**示例 1：算术运算**\n```javascript\n\
    > 1 + 2\n3\n> 5 * 10\n50\n```\nREPL 读取 `1 + 2`，进行评估，打印结果 `3`，等待下次输入。\n\n**示例 2：变量声明**\n\
    ```javascript\n> let x = 10;\nundefined\n> x * 2\n20\n```\n您可以声明变量并在随后的命令中中使用它们。\n\
    \n### 在 REPL 中使用 Node.js API\n您也可以直接在 REPL 中使用 Node.js 内置模块。\n\n**示例：使用 `fs` 模块**\n\
    ```javascript\n> const fs = require('fs');\nundefined\n> fs.readFileSync('example.txt',\
    \ 'utf8');\n'这是文件的内容。'\n```\n在这个示例中，引入了 `fs` 模块，并使用 `readFileSync` 方法读取文件内容。\n\
    \n### 多行输入\nREPL 支持多行输入，允许您输入复杂的代码结构，如循环和函数。\n\n**示例：定义函数**\n```javascript\n>\
    \ function add(a, b) {\n... return a + b;\n... }\nundefined\n> add(5, 10);\n15\n\
    ```\nREPL 会等待您完成函数定义后再进行评估。按两次回车可以表示您已完成多行输入。\n\n### 特殊命令\nREPL 特殊命令表\n\n| 命令\
    \ | 说明 |\n| --- | --- |\n| `.help` | 显示所有特殊 REPL 命令及其描述。 |\n| `.break` | 当您卡在多行表达式中时，使用此命令退出当前上下文。\
    \ |\n| `.clear` | `.break` 的别名。它会清除 REPL 中的当前上下文。 |\n\n"
- fmt: "\n\n| `.exit` | Exits the REPL. You can also use `Ctrl+C` twice to achieve\
    \ the same result. |\n| :--- | .save <filename>` | Saves the current REPL session\
    \ to a file. |\n| `.load <filename>` | Loads a file into the current REPL session.\
    \ |\n| `.editor` | Enters into a multi-line input mode where you can write multiple\
    \ lines of code. Press `Ctrl+D` to finish and evaluate the code. |\n| `.scope`\
    \ | Displays the current scope's context, including local variables. |\n| `.history`\
    \ | Shows the REPL history of commands executed. |\n| `.set var value` | Sets\
    \ a variable in the REPL context. |\n| `.inspect var` | Inspects and prints the\
    \ details of a variable. |\n\n### .help\n**DESCRIPTION**: Lists all the special\
    \ REPL commands available and provides a brief description of each.\n\n**Usage**:\n\
    ```\n> .help\n```\n\n- `.break`: Sometimes you get stuck, this gets you out\n\
    - `.clear`: Alias for `.break`\n- `.exit`: Exit the REPL\n- `.help`: Print this\
    \ help message\n- `.load`: Load JS from a file into the REPL session\n- `.save`:\
    \ Save all evaluated commands in this REPL session to a file\n- `.editor`: Enter\
    \ editor mode\n- `.scope`: Show current scope\n- `.history`: Show REPL history\n\
    - `.set`: Set a variable in the REPL context\n- `.inspect`: Inspect a variable\
    \ in detail\n\n### .break\n**DESCRIPTION**: Use this command if you get stuck\
    \ in the middle of writing a multi-line expression. It will exit the current expression\
    \ and return to the REPL prompt.\n\n**Usage**:\n```\n> {\n...   const x = 10;\n\
    ...   .break\n>\n```\n\n### .clear\n**DESCRIPTION**: Clears the current REPL context.\
    \ It is an alias for `.break`.\n\n**Usage**:\n```\n> const x = 10;\n> .clear\n\
    > \n```\n\n### .exit\n**DESCRIPTION**: Exits the REPL. You can also use `Ctrl+C`\
    \ twice to exit.\n\n**Usage**:\n```\n> .exit\n```\n\n### .save <filename>\n**DESCRIPTION**:\
    \ Saves the current REPL session to a file. This can be useful for saving your\
    \ work and reviewing it later.\n\n**Usage**:\n```\n> .save session.js\n```\n\n\
    ### .load <filename>\n**DESCRIPTION**: Loads and executes a file in the current\
    \ REPL session. This allows you to bring in predefined scripts or functions.\n\
    \n**Usage**:\n```\n> .load script.js\n```\n\n### .editor\n**DESCRIPTION**: Enters\
    \ into a multi-line input mode where you can write multiple lines of code. To\
    \ finish and evaluate the code, press `Ctrl+D`.\n\n**Usage**:\n```\n> .editor\n\
    // Entering editor mode (Ctrl+D to finish, Ctrl+C to cancel)\nconst x = 10;\n\
    const y = 20;\nconsole.log(x + y);\nCtrl+D\n30\n>\n```\n\n### .scope\n**DESCRIPTION**:\
    \ Displays the current scope's context, including local variables and their values.\
    \ Useful for debugging the current state.\n\n**Usage**:\n```\n> const x = 10;\n\
    > .scope\n{\n  x: 10\n}\n>\n```\n\n### .history\n**DESCRIPTION**: Shows the REPL\
    \ history of commands executed. It helps to review and reuse previous commands.\n\
    \n**Usage**:\n```\n1: const x = 10;\n2: console.log(x);\n3: .history\n```\n\n\
    ### .set var value\n**DESCRIPTION**: Sets a variable in the REPL context. This\
    \ can be useful for dynamically adjusting values during a session.\n\n**Usage**:\n\
    ```\n> .set y 50\n> console.log(y);\n```\n\n### .inspect var\n**DESCRIPTION**:\
    \ Inspects and prints the details of a variable. This is useful for debugging\
    \ complex objects or variables.\n\n**Usage**:\n```\n> const obj = { a: 1, b: 2\
    \ };\n> .inspect obj\n\n\n### Accessing REPL History\nThe REPL keeps HISTORY of\
    \ commands you’ve entered. You can navigate through your history using the up\
    \ and down keys, making it easy to re-run commands or make slight modifications.\n\
    \n### Underscore Variable\nThe REPL AUTOMATICALLY assigns the result of the last\
    \ evaluated expression to the `_` variable, allowing you to use it in subsequent\
    \ commands.\n\n**Example: Using the Underscore Variable**\n```\n> 5 + 10\n15\n\
    > _ * 2\n30\n```\nIn this example, the result of `5 + 10` is `15`, which is then\
    \ stored in `_`. The next command multiplies this result by `2`, yielding `30`.\n\
    \nThe Node.js REPL is a powerful tool for experimenting with JavaScript and Node.js\
    \ code in an interactive manner. It allows you to quickly test snippets, debug\
    \ code, and explore Node.js APIs without the overhead of creating separate files.\
    \ By understanding and leveraging the features of the REPL, you can significantly\
    \ enhance your development and productivity.\n\n# 3. File System and Streams\n\
    \n## 3.1. Reading and Writing Files\nHandling files is a fundamental aspect of\
    \ many applications. Whether you're reading configuration files, writing logs,\
    \ or processing data, understanding how to read and write files in Node.js is\
    \ crucial. Node.js provides the `fs` module, which offers both synchronous and\
    \ asynchronous methods for interacting with the file system. Let's explore these\
    \ concepts in depth.\n\n### Introduction to the fs Module\nThe `fs` (File System)\
    \ module in Node.js allows you to interact with the file system on your computer.\
    \ You can use it to read, write, update, delete, and manage files and directories.\
    \ The `fs` module can be imported using:\n\n```javascript\nconst fs = require('fs');\n\
    ```\n\n### Reading Files\nReading files can be done in two ways: synchronously\
    \ and asynchronously.\n\n#### Synchronous Reading\nIn SYNRONous READING, the execution\
    \ of the program pauses until the file reading operation is completed. This can\
    \ be straightforward for small files or simple scripts but can block the event\
    \ loop for larger files or more complex applications.\n\n**Example: Synchronous\
    \ Reading**\n```javascript\nconst fs = require('fs');\n\ntry {\n  const data =\
    \ fs.readFileSync('example.txt', 'utf8');\n  console.log(data);\n} catch (err)\
    \ {\n  console.error('Error reading file:', err);\n}\n```\nIn this example: `fs.readFileSync('example.txt',\
    \ 'utf8')` reads the contents of `example.txt` synchronously. The `utf8` argument\
    \ specifies the encoding. If an error occurs, it is caught and logged to the console.\n\
    \n#### Asynchronous Reading\nASYNCHRONOUS READING allows other operations to continue\
    \ while the file is being read, making it more suitable for larger files and high-performance\
    \ applications.\n\n**Example: Asynchronous Reading**\n```javascript\nconst fs\
    \ = require('fs');\n\nfs.readFile('example.txt', 'utf8', (err, data) => {\n  if\
    \ (err) {\n    return console.error('Error reading file:', err);\n  }\n  console.log(data);\n\
    });\n\nconsole.log('Reading file...');\n```\nIn this example: `fs.readFile('example.txt',\
    \ 'utf8', callback)` reads the file asynchronously. The callback function handles\
    \ the file data or any errors. The message 'Reading file...' is logged immediately,\
    \ demonstrating non-blocking behavior.\n\n### Writing Files\nWriting to files\
    \ can also be done synchronously or asynchronously.\n\n#### Synchronous Writing\n\
    **Example: Synchronous Writing**\n```javascript\nconst fs = require('fs');\n\n\
    const data = 'If somethings important enough, you should try. Even if - the probable\
    \ outcome is failure.Elon Musk';\n\ntry {\n  fs.writeFileSync('C:\\\\Users\\\\\
    MOAML\\\\Desktop\\\\file.txt', data);\n  console.log('File written successfully');\n\
    } catch (err) {\n  console.error('Error writing file:', err);\n}\n```\n"
