  trans: "\n\nNode.js 的架构以单线程事件循环、非阻塞 I/O、V8 引擎、`libuv` 库以及 C++ 绑定为特征，使其能够构建高性能、可扩展的网络应用程序。通过理解这些组件，开发者可以利用\
    \ Node.js 创建高效且响应迅速的应用，满足现代 Web 开发的需求。\n\n## 1.4. 安装 Node.js\n\n入门 Node.js 涉及在系统上设置运行时环境。Node.js\
    \ 可以安装在各种操作系统上，包括 Windows、macOS 和 Linux。本节将引导你完成这些各个平台的安装过程，确保你的设置顺畅且成功。\n\n###\
    \ 在 Windows 上安装 Node.js\n\n1. **下载安装程序**：\n   * 访问 Node.js 官网 [nodejs.org](https://nodejs.org)。\n\
    \n![image](img/image033.png)\n\n你将看到两个版本供下载：LTS（长期支持）版本和 Current（当前）版本。对于大多数用户，建议下载\
    \ LTS 版本，因为它更稳定且适用于生产环境。\n\n点击适用于 Windows 的安装程序以下载 `.msi` 文件。\n\n2. **运行安装程序**：\n\
    \   下载完成后，打开 `.msi` 文件运行安装程序。\n\n![image](img/image016.png)\n\n   * 按照 Node.js\
    \ 安装向导中的提示操作。默认设置对大多数用户已经足够。\n\n![image](img/image019.png)\n\n![image](img/image228.png)\n\
    \n确保勾选“自动安装必要的工具”选框，以安装原生模块所需的额外工具，例如 Python 和 Visual Studio Build Tools。\n\n\
    ![image](img/image085.png)\n\n![image](img/image036.png)\n\n3. **验证安装**：\n   安装完成后，打开命令提示符（你可以在开始菜单中搜索\
    \ `cmd`）。\n\n   输入 `node -v` 并按回车。此命令将显示已安装的 Node.js 版本。\n\n![image](img/image068.png)\n\
    \n   输入 `npm -v` 并按回车检查已安装的 `npm`（Node 包管理器）的版本。\n\n![image](img/image053.png)\n\
    \n4. **更新 npm（可选）**：\n   虽然 Node.js 预装了 `npm`，但将 `npm` 更新到最新版本是一个良好的习惯。\n\n  \
    \ 在命令提示符中输入 `npm install -g npm` 并按回车。\n\n### 在 macOS 上安装 Node.js\n\n1. **使用安装程序**：\n\
    \   访问 Node.js 官网 [nodejs.org](https://nodejs.org)。\n\n   下载 LTS 版本的 macOS 安装程序（`.pkg`\
    \ 文件）。\n\n   打开下载的 `.pkg` 文件并按照提示安装 Node.js。\n\n2. **使用 Homebrew**：\n   或者，你可以使用\
    \ macOS 流行的包管理器 Homebrew 来安装 Node.js。\n\n   如果你没有安装 Homebrew，打开终端并运行以下命令进行安装：\n\
    \n```bash\n/bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"\
    \n```\n\n   一旦安装 Homebrew，你就可以运行以下命令安装 Node.js：\n\n```bash\nbrew install node\n\
    ```\n\n![image](img/image145.png)\n\n   * **验证安装**：\n   打开终端并输入 `node -v` 检查已安装的\
    \ Node.js 版本。\n\n   输入 `npm -v` 验证已安装的 `npm` 版本。\n\n* **更新 npm（可选）**：\n   要将 `npm`\
    \ 更新到最新版本，请在终端运行以下命令：\n\n```bash\nnpm install -g npm\n```\n\n### 在 Linux 上安装 Node.js\n\
    \n对于 Linux 用户，安装过程可能会你使用的发行版略有不同。以下是某些常用发行版的步骤：\n\n1. **Debian 和 Ubuntu**：\n \
    \  打开终端并运行以下命令从官方 NodeSource 仓库安装 Node.js：\n\n```bash\ncurl -fsSL https://deb.nodesource.com/setup_lts.x\
    \ | sudo -E bash -\nsudo apt-get install -y nodejs\n```\n\n![image](img/scene_break.png)\n\
    \n此脚本将添加 NodeSource 仓库并安装 Node.js 以及 `npm`。\n\n* **CentOS 和 Fedora**：\n   对于 CentOS，运行以下命令添加\
    \ NodeSource 仓库并安装 Node.js：\n\n```bash\ncurl -fsSL https://rpm.nodesource.com/setup_lts.x\
    \ | sudo bash -\nsudo yum install -y nodejs\n```\n\n   对于 Fedora，你可以使用与 CentOS\
    \ 相同的命令，但用 `dnf` 代替 `yum`：\n\n```bash\ncurl -fsSL https://rpm.nodesource.com/setup_lts.x\
    \ | sudo bash -\nsudo dnf install -y nodejs\n```\n\n* **Arch Linux**：\n   打开终端并运行以下命令使用包管理器安装\
    \ Node.js：\n\n```bash\nsudo pacman -S nodejs\n```\n\n* **验证安装**：\n   安装完成后，运行以下命令验证\
    \ Node.js 版本：\n\n```bash\nnode -v\n```\n\n* **更新 npm（可选）**：\n   要将 `npm` 更新到最新版本，运行：\n\
    \n```bash\nnpm install -g npm\n```\n\n"
