    \nEXAMPLE: ASYNCHRONOUS Writing\n\n```javascript\nconst fs = require('fs');\n\n\
    const data = 'Hello, world!';\n\nfs.writeFile('example.txt', data, (err) => {\n\
    \  if (err) {\n    return console.error('Error writing file:', err);\n  }\n  console.log('File\
    \ written successfully');\n});\n\nconsole.log('Writing file...');\n```\n\nIn this\
    \ example:\n`fs.writeFile('example.txt', data, callback)` writes the string `data`\
    \ to `example.txt` asynchronously.\nThe callback function handles any errors.\n\
    The message 'Writing file...' is logged immediately, demonstrating non-blocking\
    \ behavior.\n\n### Appending to Files\n\nSOMETIMES, YOU MAY need to add data to\
    \ an existing file rather than overwriting it. The `fs.appendFile` and `fs.appendFileSync`\
    \ methods are used for this purpose.\n\nExample: Asynchronous Appending\n\n```javascript\n\
    const fs = require('fs');\n\nconst data = 'Appending some text...\U0001F974 \\\
