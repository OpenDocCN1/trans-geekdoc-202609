    \ \n\n2.    Authentication    : HTTPS verifies the identity of the server using\
    \ digital certificates issued by trusted Certificate Authorities (CAs).   This\
    \ prevents man-in-the-middle attacks where an attacker could impersonate the server.\
    \ \n\n3.    Data Integrity    : HTTPS ensures that the data sent and received\
