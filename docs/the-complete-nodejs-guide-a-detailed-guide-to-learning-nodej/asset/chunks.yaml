  trans: "\n\n```javascript\nconst promise2 = new Promise((resolve, reject) => setTimeout(reject,\
    \ 2000, 'Second failed'));\n\nconst promise3 = new Promise((resolve, reject) =>\
    \ setTimeout(resolve, 3000, 'Third'));\n\nPromise.all([promise1, promise2, promise3])\n\
    \  .then(results => {\n    console.log(results);\n  })\n  .catch(error => {\n\
    \    console.error('One of the promises failed:', error);\n  });\n```\n\n在这里，`promise2`\
    \ 被拒绝，因此 `.catch()` 块将处理错误，且操作不会记录其他 promise 的结果。\n\n### 使用 Async/Await 处理错误\n\
    \n`async/await` 引入于 ES2017，它简化了处理 promise 操作，并提供了一种类似于同步的方式来处理异步代码。它与 `try/catch`\
    \ 良好集成用于错误处理。\n\n#### 在 Async/Await 中使用 Try/Catch\n\n```javascript\nasync function\
    \ fetchData() {\n  try {\n    let response = await fetch('https://api.example.com/data');\n\
    \    let data = await response.json();\n    console.log(data);\n  } catch (error)\
    \ {\n    console.error('Error fetching data:', error);\n  }\n}\n\nfetchData();\n\
    ```\n\n在这个示例中，fetch 操作期间或解析 JSON 响应时发生的任何错误会被 `catch` 块捕获并处理。\n\n#### 处理多个异步操作\n\
    \n使用 `Promise.all` 配合 `async/await` 允许你并发处理多个异步操作并有效捕获错误。\n\n```javascript\nasync\
    \ function fetchMultipleData() {\n  try {\n    let [response1, response2] = await\
    \ Promise.all([\n      fetch('https://api.example.com/data1'),\n      fetch('https://api.example.com/data2')\n\
    \    ]);\n    let data1 = await response1.json();\n    let data2 = await response2.json();\n\
    \    console.log('Data 1:', data1);\n    console.log('Data 2:', data2);\n  } catch\
    \ (error) {\n    console.error('Error fetching data:', error);\n  }\n}\n\nfetchMultipleData();\n\
    ```\n\n### Node.js 中的集中错误处理\n\n对于较大的应用程序，拥有一个集中的错误处理机制可以简化错误管理并提高代码的可维护性。\n\n\
    #### 错误处理中间件\n\n在 Express 应用程序中，你可以创建一个错误处理中间件函数。\n\n```javascript\nconst express\
    \ = require('express');\nconst app = express();\n\n// 错误处理中间件\napp.use((err, req,\
    \ res, next) => {\n  console.error(err.stack);\n  res.status(500).send('Something\
    \ broke!');\n});\n\n// 模拟错误\napp.get('/', (req, res) => {\n  throw new Error('Simulated\
    \ error');\n});\n\nconst PORT = 3000;\napp.listen(PORT, () => {\n  console.log(`Server\
    \ running on port ${PORT}`);\n});\n```\n\n在这个示例中，在路由处理程序中抛出的任何错误将传递给错误处理中间件，中间件会记录错误并向客户端发送响应。\n\
    \n![image](img/image027.png)\n\n#### 创建自定义错误类\n\n创建自定义错误类为错误处理提供更多上下文和控制。\n\n\
    ```javascript\nclass CustomError extends Error {\n  constructor(message, statusCode)\
    \ {\n    super(message);\n    this.statusCode = statusCode;\n  }\n}\n\nfunction\
    \ riskyOperation() {\n  throw new CustomError('Operation failed!', 400);\n}\n\n\
    try {\n  riskyOperation();\n} catch (error) {\n  if (error instanceof CustomError)\
    \ {\n    console.error(`Custom error occurred: ${error.message} (Status Code:\
    \ ${error.statusCode})`);\n  } else {\n    console.error('An unexpected error\
    \ occurred:', error);\n  }\n}\n```\n\n在这个示例中，`CustomError` 类继承了内置的 `Error` 类，添加了一个\
    \ `statusCode` 属性。这允许根据错误类型进行更细粒度的错误处理。\n\n![image](img/image086.png)\n\n## 7.3.\
    \ 事件发射器 (Event Emitters)\n\n当你继续深入 Node.js 时，遇到的的核心概念之一是事件驱动架构。这种方法是 Node.js 处理异步操作和高效扩展的基础部分。该架构的核心是\
    \ `EventEmitter` 类。理解如何有效使用事件发射器可以极大地增强你构建响应式、可扩展应用程序的能力。\n\n#### 什么是事件发射器？\n\n\
    事件发射器是可以发射具名事件并为这些事件注册监听器的对象。当事件被发射时，所有为该事件注册的监听器都会同步调用。这种机制是 Node.js 许多部分的核心，从核心模块到自定义模块。\n\
    \n想象你正在参加演唱会。乐队（发射器）播放音乐（发射事件），观众（监听器）通过鼓掌、唱歌做出反应。\n\n#### 创建和使用发射器\n\n让我们从一个简单的示例开始，看看发射器是如何工作的。\n\
    \n```javascript\nconst EventEmitter = require('events');\n\nclass MyEmitter extends\
    \ EventEmitter {}\n\nconst myEmitter = new MyEmitter();\n\n// 为 'greet' 事件注册监听器\n\
    myEmitter.on('greet', () => {\n  console.log('Hello! The greet event was emitted.');\n\
    });\n\n// 触发 'greet' 事件\nmyEmitter.emit('greet');\n```\n\n![image](img/image164.png)\n\
    \n在这个示例中，我们首先导入 `EventEmitter` 类，并创建一个继承自 `EventEmitter` 的类。然后我们创建该类的实例，使用 `on`\
    \ 方法为 `greet` 事件注册监听器，最后使用 `emit` 方法发射 `greet` 事件。\n\n![image](img/image080.png)\n\
    \n#### 处理多个事件\n\n发射器拥有多个事件和监听器。每个监听器都可以针对特定的事件，使其成为管理复杂行为的强大工具。\n\n```javascript\n\
    const EventEmitter = require('events');\n\nclass MyEmitter extends EventEmitter\
    \ {}\n\nconst myEmitter = new MyEmitter();\n\n// 为不同的事件注册多个监听器\nmyEmitter.on('start',\
    \ () => {\n  console.log('Starting...');\n});\n\nmyEmitter.on('progress', (percent)\
    \ => {\n  console.log(`Progress: ${percent}%`);\n});\n\nmyEmitter.on('finish',\
    \ () => {\n  console.log('Finished!');\n});\n\n// 发射事件\nmyEmitter.emit('start');\n\
    myEmitter.emit('progress', 50);\nmyEmitter.emit('progress', 75);\nmyEmitter.emit('finish');\n\
    ```\n\n![image](img/scene_break.png)\n![image](img/image092.png)\n\n在这个示例中，我们有三个事件：'start'、'progress'\
    \ 和 'finish'。每个事件都有自己的监听器。当我们发射这些事件时，相应的监听器会带有提供的参数被调用，允许我们处理过程的不同部分。\n\n####\
    \ 移除监听器\n\n有时你可能需要移除监听器以防止内存泄漏或在特定条件下停止监听某些事件。你可以使用 `removeListener` 或 `removeAllListeners`\
    \ 方法来实现目的。\n\n```javascript\nconst EventEmitter = require('events');\n\nclass\
    \ MyEmitter extends EventEmitter {}\n\nconst myEmitter = new MyEmitter();\n\n\
    function onGreet() {\n  console.log('Hello! The greet event was emitted.');\n\
    }\n\n// 注册监听器\nmyEmitter.on('greet', onGreet);\n\n// 触发 'greet' 事件\nmyEmitter.emit('greet');\n\
    ```\n\n"
- fmt: "\n```javascript\nmyEmitter.emit('greet'); // Output: Hello! The greet event\
    \ was emitted.\n\n// Remove the listener\nmyEmitter.removeListener('greet', onGreet);\n\
    \n// Emit the 'greet' event again\nmyEmitter.emit('greet'); // No output\n```\n\
    \n–––––––\n\n![image](d2d_images/scene_break.png)\n\nHERE, WE REGISTER A listener\
    \ for the 'greet' event, emit the event to see the listener in action, and then\
    \ remove the listener using `removeListener`. When we emit the event again, the\
    \ listener is no longer called.\n\n### Listening to an Event Only Once\n\nTHERE\
    \ ARE SCENARIOS where you might want to listen to an event only once. For this,\
    \ you can use the `once` method, which ensures that the listener is called only\
    \ the first time the event is emitted.\n\n```javascript\nconst EventEmitter =\
    \ require('events');\n\nclass MyEmitter extends EventEmitter {}\n\nconst myEmitter\
    \ = new MyEmitter();\n\n// Register a listener that is called only once\nmyEmitter.once('specialEvent',\
    \ () => {\n  console.log('This will be logged only once.');\n});\n\n// Emit the\
    \ 'specialEvent' twice\nmyEmitter.emit('specialEvent'); // Output: This will be\
    \ logged only once.\nmyEmitter.emit('specialEvent'); // No output\n```\n\nIn this\
    \ example, the listener for 'specialEvent' is registered with `once`. When the\
    \ event is emitted the first time, the listener is called. However, subsequent\
    \ emissions of the event do not trigger the listener.\n\n### Error Handling with\
    \ Event Emitters\n\nHANDLING ERRORS IS a crucial part of building robust applications.\
    \ Event emitters have a special 'error' event that you can use to handle errors\
    \ gracefully.\n\nExample:\n\n```javascript\nconst EventEmitter = require('events');\n\
    \nclass MyEmitter extends EventEmitter {}\n\nconst myEmitter = new MyEmitter();\n\
    \n// Register an error listener\nmyEmitter.on('error', (err) => {\n  console.error('An\
    \ error occurred:', err.message);\n});\n\n// Emit an error event\nmyEmitter.emit('error',\
    \ new Error('Something went wrong!'));\n```\n\nIn this example, we register a\
    \ listener for the 'error' event. When an error is emitted, the listener logs\
    \ the error message. If you emit an 'error' event without a listener, Node.js\
    \ will throw an exception and terminate the process, highlighting the importance\
    \ of always handling errors.\n\n![image](d2d_images/image131.png)\n\n### Practical\
    \ Use Case: Creating a Custom Event Emitter\n\nTO SEE EVENT EMITTERS in a more\
    \ practical context, let’s create a custom event emitter for a simple chat application.\
    \ This will involve emitting events for user actions like joining, sending messages,\
    \ and leaving the chat.\n\n```javascript\nconst EventEmitter = require('events');\n\
    \nclass Chat extends EventEmitter {\n  join(username) {\n    this.emit('join',\
    \ username);\n  }\n\n  sendMessage(username, message) {\n    this.emit('message',\
    \ username, message);\n  }\n\n  leave(username) {\n    this.emit('leave', username);\n\
    \  }\n}\n\nconst chat = new Chat();\n\n// Register listeners\nchat.on('join',\
    \ (username) => {\n  console.log(`${username} joined the chat.`);\n});\n\nchat.on('message',\
    \ (username, message) => {\n  console.log(`${username}: ${message}`);\n});\n\n\
    chat.on('leave', (username) => {\n  console.log(`${username} left the chat.`);\n\
    });\n\n// Simulate user actions\nchat.join('Alice');\nchat.sendMessage('Alice',\
    \ 'Hello everyone!');\nchat.leave('Alice');\n```\n\nIn this example, we define\
    \ a `Chat` class that extends `EventEmitter`. We then create methods for common\
    \ chat actions (`join`, `sendMessage`, `leave`) that emit corresponding events.\
    \ We also register listeners for these events to handle messages.\n\n![image](d2d_images/image204.png)\n\
    \n## 7.4. Streams and Pipe Chaining\n\nSTREAMS ARE ONE OF the most powerful features\
    \ in Node.js, enabling efficient data processing by reading or writing data in\
    \ chunks, rather than loading all into memory once. This makes streams ideal for\
    \ handling large files, real-time data, and other scenarios where efficiency and\
    \ performance are crucial. Understanding streams and how to use pipe chaining\
    \ can significantly enhance your ability to build high performance Node.js applications.\n\
    \n![image](d2d_images/image052.png)\n\n### What Are Streams?\n\nSTREAMS ARE OBJECTS\
    \ that let you read data from a source or write data to a destination in a continuous\
    \ manner. In Node.js, there are four types of streams:\n\n1. `Readable Streams`:\
    \ Used for reading data sequentially. Examples include `fs.createReadStream` for\
    \ file reading and HTTP requests.\n2. `Writable Streams`: Used for writing data\
    \ sequentially. Examples include `fs.createWriteStream` for file writing and HTTP\
    \ responses.\n3. `Duplex Streams`: Both readable and writable, used for bidirectional\
    \ communication. Examples include TCP sockets.\n4. `Transform Streams`: A type\
    \ of duplex stream that can modify or transform the data as it is read and written.\
    \ Examples include `zlib` streams for compression.\n\n### Understanding the Basics\n\
    \n#### A READABLE Stream:\n\n```javascript\nconst fs = require('fs');\n\n// Create\
    \ a readable stream\nconst readableStream = fs.createReadStream('example.txt',\
    \ {\n  encoding: 'utf8',\n  highWaterMark: 16 * 1024 // 16 KB chunk size\n});\n\
    \n// Handle stream events\nreadableStream.on('data', (chunk) => {\n  console.log('Received\
    \ chunk:', chunk);\n});\n\nreadableStream.on('end', () => {\n  console.log('No\
    \ more data.');\n});\n\nreadableStream.on('error', (err) => {\n  console.error('Error:',\
    \ err);\n});\n```\n\n–––––––\n\n![image](d2d_images/scene_break.png)\n\nIN THIS\
    \ EXAMPLE, WE create a readable stream from a file named `example.txt`. The `data`\
    \ event is emitted whenever a chunk of data is available to be read. The `end`\
    \ event signifies that the stream has no more data to read, and the `error` event\
    \ handles any errors that occur during reading.\n\n#### Creating a Writable Stream:\n\
    \n```javascript\nconst fs = require('fs');\n\n// Create a writable stream\nconst\
    \ writableStream = fs.createWriteStream('output.txt');\n\n// Write data to the\
    \ stream\nwritableStream.write('Hello, world!\\n');\nwritableStream.write('Writing\
    \ more data...\\n');\n\n// End the writable stream\nwritableStream.end('This is\
    \ the end.\\n');\n\n// Handle stream events\nwritableStream.on('finish', () =>\
    \ {\n  console.log('All writes are now complete.');\n});\n\nwritableStream.on('error',\
    \ (err) => {\n  console.error('Error:', err);\n});\n```\n\nHere, we create a writable\
    \ stream to a file named `output.txt`. We write multiple pieces of data to the\
    \ stream and call the `end` method to indicate that no more data will be written.\
    \ The `finish` event is emitted when all data has been flushed to the underlying\
    \ system, and the `error` event handles any errors that occur during writing.\n\
    \n### Pipe Chaining\n\nONE OF THE MOST POWERFUL features of Node.js streams is\
    \ the ability to pipe data from one stream to another. This is especially useful\
    \ for tasks like file compression, where you can read data from a file, compress\
    \ it, and write to another file, all in a single chain of operations.\n\nExample:\n\
    \n```javascript\nconst fs = require('fs');\nconst zlib = require('zlib');\n\n\
    // Create a readable stream from the input file\nconst readableStream = fs.createReadStream('input.txt');\n\
    \n// Create a writable stream to the output file\nconst writableStream = fs.createWriteStream('input.txt.gz');\n\
    \n// Create a transform stream for compression\nconst gzip = zlib.createGzip();\n\
    \nreadableStream.pipe(gzip).pipe(writableStream);\n```\n"
