    \ and why everyone use it ?   ​   ^( \\[10\\] ) \n\n##  ​   4.2.   Handling Requests\
    \ and Responses \n\n###  Handling Different HTTP Methods \n\n   H    TTP METHODS\
    \ DEFINE    the type of operation that is being requested by the client.   Each\
    \ method has a specific purpose and usage.   Understanding how to handle different\
    \ HTTP methods in Node.js is crucial for building robust and RESTful APIs.   Here\
    \ we will explain how to handle GET, POST, PUT, DELETE, and other HTTP methods\
    \ (PATCH, OPTIONS, HEAD) in depth, with examples using Postman for testing. \n\
    \n ![image](d2d_images/image067.png)\n\n ![image](d2d_images/image153.png)\n\n\
    ###  Handling GET Requests \n\n    G    ET     requests are used to retrieve data\
    \ from the server.   They are idempotent, meaning multiple identical GET requests\
    \ should have the same effect as a single request.   GET requests do not change\
    \ the state of the server. \n\n  Example    : \n\n const http =    require   \
    \ ('http'); \n\n const url =    require    ('url'); \n\n const server = http.\
    \    createServer    ((req, res) => { \n\n if (req.method === 'GET') { \n\n const\
    \ parsedUrl = url.    parse    (req.url, true); \n\n const query = parsedUrl.query;\
    \ \n\n res.statusCode = 200; \n\n res.    setHeader    ('Content-Type', 'application/json');\
    \ \n\n res.    end    (JSON.    stringify    (query)); \n\n } else { \n\n res.statusCode\
    \ = 405; \n\n res.    end    ('Method Not Allowed'); \n\n } \n\n }); \n\n const\
    \ PORT = 3000; \n\n server.    listen    (PORT, () => { \n\n console.    log \
    \   (\\`Server running at http://localhost:${PORT}/\\`); \n\n }); \n\n ––––––––\
    \ \n\n ![image](d2d_images/scene_break.png) \n\n    T    ESTING     : \n\n1. \
    \  Open Postman and create a new GET request. \n\n2.   Set the URL to  [ http://localhost:3000?name=John&age=30\
    \ ](http://localhost:3000?name=John&age=30)  . \n\n ![image](d2d_images/image134.png)\n\
    \n1.   Click    Send    . \n\n2.   You will see the response with the query parameters:\
    \ \n\n ![image](d2d_images/image109.png)\n\n###  Handling POST Requests \n\n \
