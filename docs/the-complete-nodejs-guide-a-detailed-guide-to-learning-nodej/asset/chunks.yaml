  trans: "\n\n```javascript\nconst writeStream = fs.createWriteStream('example.txt.gz');\n\
    const gzip = zlib.createGzip();\nreadStream.pipe(gzip).pipe(writeStream);\n\n\
    writeStream.on('finish', () => {\n  console.log('File compression completed');\n\
    });\n```\n\n在此示例中：\n* `zlib.createGzip` 创建了一个压缩数据的转换流。\n* `pipe` 方法用于将可读流、转换流和可写流链式在一起。\n\
    * 从 `example.txt` 读取的数据被压缩并写入 `example.txt.gz`。\n\n## 理解缓冲区 (Buffers)\n\n缓冲区（BUFFERS）是用于二进制数据的临时存储区域。在\
    \ Node.js 中，缓冲区用于处理原始二进制数据，这使得它们对于处理流和其他 I/O 操作至关重要。\n\n### 创建缓冲区\n\n可以从各种源源**创建**缓冲区，例如数组、字符串或现有的缓冲区数据。\n\
    \n### 示例：从字符串创建缓冲区\n\n```javascript\nconst buffer = Buffer.from('Hello, world!',\
    \ 'utf8');\nconsole.log(buffer);\nconsole.log(buffer.toString('utf8'));\n```\n\
    \n在此示例中：\n* `Buffer.from('Hello, world!', 'utf8')` 使用 UTF-8 编码从字符串 'Hello, world!'\
    \ 创建一个缓冲区。\n* 随后使用 `buffer.toString('utf8')` 将缓冲区转换回字符串。\n\n### 写入缓冲区\n\n缓冲区**提供**用于写入二进制数据的方法。\n\
    \n### 示例：写入缓冲区\n\n```javascript\nconst buffer = Buffer.alloc(16);\nbuffer.write('Hello,\
    \ world!', 'utf8');\nconsole.log(buffer);\nconsole.log(buffer.toString('utf8'));\n\
    ```\n\n在此示例中：\n* `Buffer.alloc(16)` 创建了一个 16 字节的缓冲区。\n* `write` 方法使用 UTF-8 编码将字符串\
    \ 'Hello, world!' 写入缓冲区。\n* 随后使用 `buffer.toString('utf8')` 将缓冲区转换回字符串。\n\n###\
    \ 缓冲区操作\n\n缓冲区**支持**各种操作二进制数据的操作，例如切片和拼接。\n\n### 示例：缓冲区切片\n\n```javascript\nconst\
    \ buffer = Buffer.from('Hello, world!', 'utf8');\nconst slice = buffer.slice(0,\
    \ 5);\nconsole.log(slice.toString('utf8')); // 输出: Hello\n```\n\n在此示例中：\n* `buffer.slice(0,\
    \ 5)` 创建了一个引用原始缓冲区部分的的新缓冲区。\n* 切片包含原始缓冲区的前 5 个字节，然后将其转换为字符串。\n\n### 示例：缓冲区拼接\n\
    \n```javascript\nconst buffer1 = Buffer.from('Hello, ', 'utf8');\nconst buffer2\
    \ = Buffer.from('world!', 'utf8');\nconst combined = Buffer.concat([buffer1, buffer2]);\n\
    console.log(combined.toString('utf8')); // 输出: Hello, world!\n```\n\n在此示例中：\n\
    * `Buffer.concat([buffer1, buffer2])` 将 `buffer1` 和 `buffer2` 拼接成单个缓冲区。\n* 合并后的缓冲区随后被转换为字符串。\n\
    \n## 流和缓冲区的实际应用\n\n流（STREAMS）和缓冲区（BUFFERS）用于各种现实应用应用，例如：\n\n1. **文件处理**：\n   \
    \ * 读取和写入大文件无需将其完全加载到内存中。\n    * 示例：处理日志文件或媒体文件。\n2. **网络通信**：\n    * 高效地处理跨网络的数据传输。\n\
    \    * 示例：构建 HTTP 服务器、TCP 服务器或 WebSocket 器。\n3. **数据转换**：\n    * 在读取或写入时修改数据，例如压缩或加密。\n\
    \    * 示例：使用 `gzip` 压缩文件或加密数据流。\n4. **实时数据处理**：\n    * 处理实时数据流，例如视频流媒体或实时分析。\n\
    \    * 示例：为直播广播处理视频流。\n\n![image](img/scene_break.png)\n![image](img/image115.png)\n\
    \n流和缓冲区是 Node.js 中高效处理 I/O 操作的强大工具。流允许你分块处理数据，使其成为处理大型数据集或文件的理想选择。缓冲区允许你直接操作二进制数据，为处理流奠定了基础。通过掌握这些概念，你可以构建健壮的应用程序，高效地处理数据并在负载下表现良好。无论你是在处理文件、通过网络进行通信还是实时转换数据，流和缓冲区都是你\
    \ Node.js 工具箱中不可或缺的组件。\n\n## 3.4. 处理文件上传\n\n处理文件上传是 Web 应用中的常见需求。Node.js 提供了各种工具和库来简化这一过程。处理文件上传最流行的库之一是\
    \ `multer`。本节将引导你如何使用 `multer` 设置文件上传。\n\n### 设置 multer\n\n`multer` 是一个用于处理 `multipart/form-data`\
    \ 的中间件，主要用于上传文件，并与 Express 无缝工作。\n\n### 安装\n\n首先，你需要安装 `multer`：\n`npm install\
    \ express multer`\n\n### 基础文件上传示例\n\n#### 步骤 1：导入模块\n\n```javascript\nconst express\
    \ = require('express');\nconst multer = require('multer');\nconst path = require('path');\n\
    ```\n\n#### 步骤 2：配置已上传文件的存储\n\n```javascript\nconst storage = multer.diskStorage({\n\
    \  destination: function (req, file, cb) {\n    cb(null, 'uploads/'); // 保存文件的目录\n\
    \  },\n  filename: function (req, file, cb) {\n    // 文件名定义逻辑\n  }\n});\n\nconst\
    \ upload = multer({ storage: storage });\n```\n\n#### 步骤 3：设置 Express 应用\n\n```javascript\n\
    const app = express();\nconst PORT = 3000;\n\napp.use(express.static('public'));\
    \ // 从 public 目录提供静态文件\n```\n\n#### 步骤 4：创建上传节点\n\n```javascript\napp.post('/upload',\
    \ upload.single('file'), (req, res) => {\n  try {\n    res.send('上传成功');\n  }\
    \ catch (error) {\n    res.status(400).send('上传错误');\n  }\n});\n```\n\n#### 步骤\
    \ 5：启动服务器\n\n```javascript\napp.listen(PORT, () => {\n  console.log(`服务器运行在端口\
    \ ${PORT}`);\n});\n```\n\n#### 步骤 6：创建文件上传的 HTML 表单\n\n在 `public` 目录中创建一个 `index.html`\
    \ 文件，内容如下：\n\n```html\n<!DOCTYPE html>\n<html lang=\"zh\">\n<head>\n  <meta charset=\"\
    UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <title>文件上传</title>\n</head>\n<body>\n  <h1>上传文件</h1>\n  <form action=\"\
    /upload\" method=\"POST\" enctype=\"multipart/form-data\">\n    <input type=\"\
    file\" name=\"file\" required>\n    <button type=\"submit\">上传</button>\n  </form>\n\
    </body>\n</html>\n```\n\n### 完整示例\n\n这是服务器的完整代码：\n\n```javascript\nconst express\
    \ = require('express');\nconst multer = require('multer');\nconst path = require('path');\n\
    \nconst app = express();\nconst PORT = 3000;\n\nconst storage = multer.diskStorage({\n\
    \  destination: function (req, file, cb) {\n    cb(null, 'uploads/');\n  },\n\
    \  filename: function (req, file, cb) {\n    cb(null, file.fieldname + '-' + Date.now()\
    \ + path.extname(file.originalname));\n  }\n});\n\nconst upload = multer({ storage:\
    \ storage });\n\napp.use(express.static('public'));\n\napp.post('/upload', upload.single('file'),\
    \ (req, res) => {\n  try {\n    res.send('上传成功');\n  } catch (error) {\n    res.status(400).send('上传错误');\n\
    \  }\n});\n\napp.listen(PORT, () => {\n  console.log(`服务器运行在端口 ${PORT}`);\n});\n\
    ```\n\n"
