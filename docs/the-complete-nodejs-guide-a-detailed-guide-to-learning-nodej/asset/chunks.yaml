  trans: "\n\nNoSQL 数据库通常优先扩展性和性能，但可能采用不同的一致性模型，例如最终一致性。最终一致性是分布式系统中的一种一致性模型，其中数据库的更新将传播，并最终所有节点将收敛到相同的值。这种模型对于\
    \ CAP 定理所描述的高可用性和分区容错性系统特别有用。CAP 定理指出，分布式数据存储只能实现三个保证中的两个：一致性（Consistency）、可用性（Availability）和分区容错性（Partition\
    \ tolerance）。NoSQL 数据库通常为了更好的可用性和分区容错性而牺牲严格一致性，这使得它们适用于高读写负载的应用。\n\n![image](img/image138.png)\n\
    \n## 6.2. 使用 SQL 数据库 (MySQL)\n\nSQL 数据库是许多 Web 应用数据管理的基石，而 MySQL 是最流行的 SQL 数据库管理系统之一。MySQL\
    \ 以其可靠性、性能和易用性而闻名，被从初创公司到大型企业的各种规模组织所使用。本节将探索如何在 Node.js 环境中使用 MySQL，包括设置数据库、建立连接、执行\
    \ CRUD 操作以及理解事务和索引等高级功能。\n\n### 设置 MySQL\n\n在 Node.js 中使用 MySQL 之前，你需要在系统上安装并配置\
    \ MySQL。你可以从官方网站下载 MySQL，并按照你操作系统的安装说明进行操作。安装完成后，你可以启动 MySQL 服务器并使用 MySQL 命令行客户端或\
    \ MySQL Workbench 等图形化工具来管理你的数据库。\n\n![image](img/image159.png)\n\n### 为 Node.js\
    \ 安装 MySQL 模块\n\n要在 Node.js 中与 MySQL 交互，你需要安装 `mysql` 模块。该模块提供了连接 MySQL 数据库、执行查询和管理连接的方法。\n\
    \n```bash\nnpm install mysql\n```\n\n### 建立连接\n\n建立 MySQL 数据库连接涉及创建一个包含必要配置细节（如主机、用户、密码和数据库名）的连接对象。以下是建立连接的示例：\n\
    \n```javascript\nconst mysql = require('mysql');\n\nconst connection = mysql.createConnection({\n\
    \  host: 'localhost',\n  user: 'root',\n  password: 'password',\n  database: 'my_database'\n\
    });\n\nconnection.connect((err) => {\n  if (err) {\n    console.error('Error connecting\
    \ to MySQL:', err);\n    return;\n  }\n  console.log('Connected to MySQL');\n\
    });\n```\n\n### 执行 CRUD 操作\n\nCRUD 操作（创建 Create、读取 Read、更新 Update、删除 Delete）是与数据库交互的基础操作。让我们看看如何在\
    \ Node.js 中使用 `mysql` 模块执行这些操作。\n\n#### 创建（插入）数据\n\n要向表中插入数据，可以使用 `INSERT INTO`\
    \ SQL 语句。以下是在 `users` 表中插入一个新用户的示例：\n\n```javascript\nconst user = { username:\
    \ 'johndoe', password: 'securepassword' };\nconst query = 'INSERT INTO users SET\
    \ ?';\n\nconnection.query(query, user, (err, results) => {\n  if (err) throw err;\n\
    \  console.log('User added with ID:', results.insertId);\n});\n```\n\n#### 读取（查询）数据\n\
    \n要从表中检索数据，可以使用 `SELECT` SQL 语句。以下是从 `users` 表中查询所有用户的示例：\n\n```javascript\nconst\
    \ query = 'SELECT * FROM users';\n\nconnection.query(query, (err, results) =>\
    \ {\n  if (err) throw err;\n  console.log('User data:', results);\n});\n```\n\n\
    #### 更新数据\n\n要更新表中的现有数据，可以使用 `UPDATE` SQL 语句。以下是更新用户密码的示例：\n\n```javascript\n\
    const userId = 1;\nconst newPassword = 'newsecurepassword';\nconst query = 'UPDATE\
    \ users SET password = ? WHERE id = ?';\n\nconnection.query(query, [newPassword,\
    \ userId], (err, results) => {\n  if (err) throw err;\n  console.log('Changed\
    \ rows:', results.changedRows);\n});\n```\n\n#### 删除数据\n\n要从表中删除数据，可以使用 `DELETE`\
    \ SQL 语句。以下是从表中删除用户的示例：\n\n```javascript\nconst userId = 1;\nconst query = 'DELETE\
    \ FROM users WHERE id = ?';\n\nconnection.query(query, [userId], (err, results)\
    \ => {\n  if (err) throw err;\n  console.log('Deleted rows:', results.affectedRows);\n\
    });\n```\n\n### 高级功能\n\n#### 事务\n\n事务作为一个单元执行的多个操作序列。它们确保了数据的完整性和一致性，特别是在多个操作相互依赖的情况下。在\
    \ MySQL 中执行事务，可以使用 `BEGIN`、`COMMIT` 和 `ROLLBACK` SQL 语句。以下是一个事务的示例：\n\n```javascript\n\
    connection.beginTransaction((err) => {\n  if (err) {\n    throw err;\n  }\n\n\
    \  const query1 = 'INSERT INTO accounts SET ?';\n  const account1 = { user_id:\
    \ 1, balance: 100 };\n\n  connection.query(query1, account1, (err, results) =>\
    \ {\n    if (err) {\n      return connection.rollback(() => {\n        throw err;\n\
    \      });\n    }\n\n    const query2 = 'INSERT INTO accounts SET ?';\n    const\
    \ account2 = { user_id: 2, balance: 200 };\n\n    connection.query(query2, account2,\
    \ (err, results) => {\n      if (err) {\n        return connection.rollback(()\
    \ => {\n          throw err;\n        });\n      }\n\n      connection.commit((err)\
    \ => {\n        if (err) {\n          return connection.rollback(() => {\n   \
    \         throw err;\n          });\n        }\n        console.log('Transaction\
    \ Complete.');\n      });\n    });\n  });\n});\n```\n\n#### 索引\n\n索引提高了数据库表数据检索操作的速度。它们对于经常用在搜索条件（`WHERE`\
    \ 子句）或连接条件中的列特别有用。\n\n在列上创建索引涉及使用 `CREATE INDEX` SQL 语句。以下是在 `users` 表的 `username`\
    \ 列上创建索引的示例：\n\n```javascript\nconst query = 'CREATE INDEX idx_username ON users(username)';\n\
    \nconnection.query(query, (err, results) => {\n  if (err) throw err;\n  console.log('Index\
    \ created:', results);\n});\n```\n\n"
- fmt: "\n# Establishing a Connection\n\nESTABLISHING A CONNECTION to a PostgreSQL\
    \ database involves creating a client object with the necessary configuration\
    \ details such as host, user, password, and database name. Here’s an example of\
    \ how to establish a connection:\n\n```javascript\nconst { Client } = require('pg');\n\
    \nconst client = new Client({\n  host: 'localhost',\n  user: 'your_username',\n\
    \  password: 'your_password',\n  database: 'your_database',\n  port: 5432, //\
    \ Default port for PostgreSQL\n});\n\nclient.connect((err) => {\n  if (err) {\n\
    \    console.error('Error connecting to PostgreSQL:', err);\n    return;\n  }\n\
    \  console.log('Connected to PostgreSQL');\n});\n```\n\n# Performing CRUD Operations\n\
    \nCRUD OPERATIONS (CREATE, Read, Update, Delete) are fundamental operations for\
    \ interacting with a database. Let's look at how to perform these operations using\
    \ the `pg` module in Node.js.\n\n### Creating (Inserting) Data\n\nTo insert data\
    \ into a table, you can use the `INSERT INTO` SQL statement. Here’s an example\
    \ of inserting a new user into a `users` table:\n\n```javascript\nconst user =\
    \ { username: 'johndoe', password: 'securepassword' };\nconst query = 'INSERT\
    \ INTO users (username, password) VALUES ($1, $2) RETURNING id';\nclient.query(query,\
    \ [user.username, user.password], (err, res) => {\n  if (err) {\n    console.error('Error\
    \ inserting data:', err);\n    return;\n  }\n  console.log('User added with ID:',\
    \ res.rows[0].id);\n});\n```\n\n### Reading (Selecting) Data\n\nTo retrieve data\
    \ from a table, you can use the `SELECT` SQL statement. Here’s an example of selecting\
    \ all users from the `users` table:\n\n```javascript\nconst query = 'SELECT *\
    \ FROM users';\nclient.query(query, (err, res) => {\n  if (err) {\n    console.error('Error\
    \ reading data:', err);\n    return;\n  }\n  console.log('User data:', res.rows);\n\
    });\n```\n\n### Updating Data\n\nTo update existing data in a table, you can use\
    \ the `UPDATE` SQL statement. Here’s an example of updating a user’s password:\n\
    \n```javascript\nconst userId = 1;\nconst newPassword = 'newsecurepassword';\n\
    const query = 'UPDATE users SET password = $1 WHERE id = $2';\nclient.query(query,\
    \ [newPassword, userId], (err, res) => {\n  if (err) {\n    console.error('Error\
    \ updating data:', err);\n    return;\n  }\n  console.log('Rows affected:', res.rowCount);\n\
    });\n```\n\n### Deleting Data\n\nTo delete data from a table, you can use the\
    \ `DELETE` SQL statement. Here’s an example of deleting a user from the `users`\
    \ table:\n\n```javascript\nconst userId = 1;\nconst query = 'DELETE FROM users\
    \ WHERE id = $1';\nclient.query(query, [userId], (err, res) => {\n  if (err) {\n\
    \    console.error('Error deleting data:', err);\n    return;\n  }\n  console.log('Rows\
    \ deleted:', res.rowCount);\n});\n```\n\n![image](d2d_images/scene_break.png)\n\
    ![image](d2d_images/image06.png)\n\n# Advanced Features: Transactions and Indexing\n\
    \n### Transactions\n\nTransactions are a sequence of one or more SQL operations\
    \ executed as a single unit. They ensure data integrity and consistency, especially\
    \ in cases where multiple operations depend on other. Transactions follow the\
    \ ACID properties: Atomicity, Consistency, Isolation, and Durability.\n\nTo perform\
    \ transactions in PostgreSQL with Node.js, you can use `BEGIN`, `COMMIT`, and\
    \ `ROLLBACK` SQL statements. Here’s an example:\n\n```javascript\nclient.query('BEGIN',\
    \ (err) => {\n  if (err) {\n    console.error('Error starting transaction:', err);\n\
    \    return;\n  }\n  const query1 = 'INSERT INTO accounts (user_id, balance) VALUES\
    \ ($1, $2)';\n  const account1 = [1, 100];\n  client.query(query1, account1, (err,\
    \ res) => {\n    if (err) {\n      client.query('ROLLBACK', (rollbackErr) => {\n\
    \        if (rollbackErr) {\n          console.error('Error rolling back transaction:',\
    \ rollbackErr);\n        }\n        console.error('Error during transaction:',\
    \ err);\n      });\n      return;\n    }\n    const query2 = 'INSERT INTO accounts\
    \ (user_id, balance) VALUES ($1, $2)';\n    const account2 = [2, 200];\n    client.query(query2,\
    \ account2, (err, res) => {\n      if (err) {\n        client.query('ROLLBACK',\
    \ (rollbackErr) => {\n          if (rollbackErr) {\n            console.error('Error\
    \ rolling back transaction:', rollbackErr);\n          }\n          console.error('Error\
    \ during transaction:', err);\n        });\n        return;\n      }\n      client.query('COMMIT',\
    \ (err) => {\n        if (err) {\n          console.error('Error committing transaction:',\
    \ err);\n        } else {\n          console.log('Transaction complete.');\n \
    \       }\n      });\n    });\n  });\n});\n```\n\n### Indexing\n\nIndexes improve\
    \ the speed of data retrieval operations on a database table. They are particularly\
    \ useful for columns frequently used in search conditions (`WHERE` clauses) or\
    \ join conditions.\n\nCreating an index on a column involves using the `CREATE\
    \ INDEX` SQL statement. Here’s an example of creating an index on the `username`\
    \ column in the `users` table:\n\n```javascript\nconst query = 'CREATE INDEX idx_username\
    \ ON users(username)';\nclient.query(query, (err, res) => {\n  if (err) {\n  \
    \  console.error('Error creating index:', err);\n    return;\n  }\n  console.log('Index\
    \ created:', res);\n});\n```\n\n![image](d2d_images/image17.png)\n\n# MongoDB\n\
    \nMONGODB IS ONE THE most popular NoSQL databases, known for its flexibility,\
    \ scalability, and ease of use. It stores data in JSON-like documents, which makes\
    \ it a natural fit for applications that require a dynamic schema. This section\
    \ will explore how to work with MongoDB in a Node.js environment, including setting\
    \ up the database, establishing connections, performing CRUD operations, and understanding\
    \ advanced features like indexing and aggregation.\n\n![image](d2d_images/image224.png)\n\
    \n## Setting Up MongoDB\n\nBEFORE WORKING WITH MongoDB in Node.js, you need to\
    \ install and configure MongoDB on your system. You can download MongoDB from\
    \ the official website and follow the installation instructions for your operating\
    \ system. Once installed, you can start the MongoDB server using the command line.\n\
    \nStarting MongoDB:\n\n```bash\nmongod --dbpath /path/to/your/data\n```\n\n##\
    \ Installing MongoDB Module for Node.js\n\nTO INTERACT WITH MONGODB from a Node.js\
    \ application, you need to install the `mongodb` module. This module provides\
    \ methods to connect to a MongoDB database, execute queries, and manage connections.\n\
    \n```bash\nnpm install mongodb\n```\n\n## Establishing a Connection\n\nESTABLISHING\
    \ A CONNECTION to a MongoDB database involves creating a client object with the\
    \ necessary configuration details such as the connection URL and database name.\
    \ Here’s an example of how to establish a connection:\n\n```javascript\nconst\
    \ { MongoClient } = require('mongodb');\n\nconst uri = 'mongodb://localhost:27017';\n\
    const client = new MongoClient(uri, { useNewUrlParser: true, useUnifiedTopology:\
    \ true });\n\nasync function run() {\n  try {\n    await client.connect();\n \
    \   console.log('Connected to MongoDB');\n  } catch (err) {\n    console.error('Error\
    \ connecting to MongoDB:', err);\n  }\n}\n\nrun();\n```\n\n---\n\n![image](d2d_images/scene_break.png)\n\
    \n# Performing CRUD Operations\n\nCRUD OPERATIONS (CREATE, Read, Update, Delete)\
