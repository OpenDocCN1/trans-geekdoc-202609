    \ \n\n####  Installing Redis Module for Node.js \n\n   T    O INTERACT WITH REDIS\
    \    from a Node.js application, you need to install the    redis    module. \
    \  This module provides methods to connect to a Redis server, execute commands,\
    \ and manage connections. \n\n npm install redis \n\n####  Establishing a Connection\
    \ \n\n   E    STABLISHING A CONNECTION    to a Redis server involves creating\
    \ a client object with the necessary configuration details such as the host and\
    \ port.   Here’s an example of how to establish a connection: \n\n const redis\
    \ =    require    ('redis'); \n\n const client = redis.    createClient    ({\
    \ \n\n host: 'localhost', \n\n port: 6379 \n\n }); \n\n client.    on    ('connect',\
    \ () => { \n\n console.    log    ('Connected to Redis'); \n\n }); \n\n client.\
    \    on    ('error', (err) => { \n\n console.    error    ('Error connecting to\
    \ Redis:', err); \n\n }); \n\n –––––––– \n\n ![image](d2d_images/scene_break.png)\
    \ \n\n####  Performing Basic Operations \n\n   R    EDIS SUPPORTS A WIDE    range\
    \ of commands for various data structures.   Let's look at how to perform some\
    \ basic operations using the    redis    module in Node.js. \n\n Setting and Getting\
    \ Values: \n\n To set and get values in Redis, you can use the    set    and \
    \   get    commands.   Here’s an example of setting and getting a value: \n\n\
    \ // Set a value \n\n client.    set    ('key', 'value', redis.print); \n\n //\
    \ Get a value \n\n client.    get    ('key', (err, reply) => { \n\n if (err) throw\
    \ err; \n\n console.    log    ('Value:', reply); \n\n }); \n\n –––––––– \n\n\
    \ ![image](d2d_images/scene_break.png) \n\n   W    ORKING WITH HASHES    : \n\n\
