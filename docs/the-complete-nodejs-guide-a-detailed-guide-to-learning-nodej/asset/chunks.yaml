  trans: "\n\n- `Strict-Transport-Security` (`HSTS`): 强制与服务器建立安全的连接（通过 SSL/TLS 的 HTTP）。\n\
    - `X-Frame-Options`: 通过控制网站是否可以被框架来防止点击劫持（clickjacking）。\n- `X-Content-Type-Options`:\
    \ 防止浏览器将文件解释为不同的 MIME 类型，降低降低流式下载的风险。\n- `X-Permitted-Cross-Domain-Policies`:\
    \ 控制 Adobe Flash 和 Acrobat 的跨域策略。\n- `Referrer-Policy`: 控制随请求发送的引用者（referrer）信息量。\n\
    - `Feature-Policy`: 允许控制哪些浏览器功能。\n\n## 自定义 Helmet\n\n虽然 `Helmet` 的**默认配置** 提供了良好的安全性，但你可能想对其进行自定义，以满足你的特定需求。你可以启用或禁用特定的标头并配置它们的值。\n\
    \n自定义配置示例：\n\n```javascript\nconst express = require('express');\n\nconst helmet\
    \ = require('helmet');\n\nconst app = express();\n\n// 自定义 Helmet 配置\n\napp.use(helmet({\n\
    \  contentSecurityPolicy: {\n    directives: {\n      defaultSrc: [\"'self'\"\
    ],\n      scriptSrc: [\"'self'\", \"'trusted-scripts.com'\"],\n      objectSrc:\
    \ [\"'none'\"],\n      upgradeInsecureRequests: [],\n    },\n  },\n  referrerPolicy:\
    \ { policy: 'no-referrer' },\n  featurePolicy: {\n    features: {\n      fullscreen:\
    \ [\"'self'\"],\n      vibrate: [\"'none'\"],\n    }\n  }\n}));\n\napp.get('/',\
    \ (req, res) => {\n  res.send('Hello, secure world!');\n});\n\nconst PORT = 3000;\n\
    \napp.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n- `Content-Security-Policy`: 配置内容安全策略，允许脚本仅来自同源和 `trusted-scripts.com`，并禁止使用对象。\n\
    - `Referrer-Policy`: 将引用者策略设置为 `no-referrer`，这意味着不会发送任何引用者信息。\n- `Feature-Policy`:\
    \ 将某些浏览器功能的使用限制在特定来源。\n\n### 示例：使用 Helmet 安全 REST API\n\n这里有一个使用 Helmet 保护 REST\
    \ API 的**实际示例**：\n\n1. 设置 Express 应用：\n\n```javascript\nconst express = require('express');\n\
    \nconst helmet = require('helmet');\n\nconst app = express();\n\n// 使用 Helmet\
    \ 通过设置各种 HTTP 头部来保护应用\napp.use(helmet());\n\n// 解析 JSON 请求体\napp.use(express.json());\n\
    \n// 定义一个简单的 API 端点\napp.get('/api/data', (req, res) => {\n  res.json({ message:\
    \ 'Secure data' });\n});\n\nconst PORT = 3000;\n\napp.listen(PORT, () => {\n \
    \ console.log(`Server running at http://localhost:${PORT}/`);\n});\n```\n\n–––––––\n\
    \n![image](img/scene_break.png)\n\n- `Helmet 中间件`: 通过设置各种 HTTP 头部来保护应用程序。\n- `JSON\
    \ 解析中间件`: 使用 `express.json()` 解析 JSON 请求体。\n- `API 端点`: 定义了一个返回 JSON 响应的简单 GET\
    \ 端点。\n\n测试 API：\n\n- 打开你的浏览器或使用如 Postman 等工具导航到 `http://localhost:3000/api/data`。\n\
    - 检查响应头部以查看由 Helmet 添加的安全头部。\n\n![image](img/image161.png)\n\n![image](img/image156.png)\n\
    \n### 创建自定义中间件\n\n在这份**综合指南**中，我们将从零构建一个 Express.js ，演示自定义中间件的使用。此示例将包含一个便于理解的\
    \ HTML 页面，并涵盖各种中间件功能，如日志、身份验证、错误处理、速率限制和输入验证。\n\n我们将使用以下项目结构：\n\n![image](img/image063.png)\n\
    custom-middleware-app/\n├── node_modules/\n├── public/\n│   └── index.html\n├──\
    \ middlewares/\n│   ├── logger.js\n│   ├── auth.js\n│   ├── rateLimiter.js\n│\
    \   ├── validateInput.js\n│   └── errorHandler.js\n├── routes/\n│   └── api.js\n\
    ├── app.js\n└── package.json\n\n首先，设置项目并安装必要的依赖。\n\n```bash\nmkdir custom-middleware-app\n\
    cd custom-middleware-app\nnpm init -y\nnpm install express body-parser morgan\n\
    ```\n\n### 第 2 步：创建 HTML 页面\n\n在 `public` 目录下创建一个 `index.html` 文件。\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Custom\
    \ Middleware Example</title>\n</head>\n<body>\n  <h1>欢迎使用自定义中间件</h1>\n  <p>此页面演示了\
    \ Express.js 中自定义中间件的使用。</p>\n</body>\n</html>\n```\n\n–––––––\n\n![image](img/scene_break.png)\n\
    \n### 第 3 步：实现自定义中间件\n\n创建用于日志记录、身份验证、错误处理、速率限制和输入验证的**中间件**。\n\n`middlewares/logger.js`:\n\
    \n```javascript\nmodule.exports = (req, next) => {\n  console.log(`${req.method}\
    \ ${req.url} - ${new Date().toISOString()}`);\n  next();\n};\n```\n\n`middlewares/auth.js`:\n\
    \n```javascript\nmodule.exports = (req, next) => {\n  const authHeader = req.headers.authorization;\n\
    \  if (authHeader === 'Bearer secret') {\n    next();\n  } else {\n    res.status(401).json({\
    \ message: 'Unauthorized' });\n  }\n};\n```\n\n`middlewares/errorHandler.js`:\n\
    \n```javascript\nmodule.exports = (err, req, res, next) => {\n  console.error(err.stack);\n\
    \  res.status(500).json({ message: 'Something went wrong!' });\n};\n```\n\n`middlewares/rateLimiter.js`:\n\
    \n```javascript\nconst rateLimit = {};\nmodule.exports = (req, res, next) => {\n\
    \  const userIp = req.ip;\n  const currentTime = Date.now();\n  const timeWindow\
    \ = 60000; // 1 分钟\n  const requestLimit = 10;\n\n  if (!rateLimit[userIp]) {\n\
    \    rateLimit[userIp] = [];\n  }\n\n  // 过滤时间窗口内的请求\n  rateLimit[userIp] = rateLimit[userIp].filter(timestamp\
    \ => currentTime - timestamp < timeWindow);\n\n  if (rateLimit[userIp].length\
    \ >= requestLimit) {\n    res.status(429).json({ message: 'Too many requests,\
    \ please try again later.' });\n  } else {\n    rateLimit[userIp].push(currentTime);\n\
    \    next();\n  }\n};\n```\n\n`middlewares/validateInput.js`:\n\n```javascript\n\
    module.exports = (req, res, next) => {\n  const { title, description } = req.body;\n\
    \  if (!title || typeof title !== 'string' || title.trim() === '') {\n    return\
    \ res.status(400).json({ message: 'Invalid title' });\n  }\n  if (!description\
    \ || typeof description !== 'string' || description.trim() === '') {\n    return\
    \ res.status(400).json({ message: 'Invalid description' });\n  }\n  next();\n\
    };\n```\n\n–––––––\n\n![image](img/scene_break.png)\n\n### 第 4 步：设置路由\n\n创建一个\
    \ **API 路由**来演示自定义中间件的使用。\n\n`routes/api.js`:\n\n```javascript\nconst express\
    \ = require('express');\nconst router = express.Router();\nconst authMiddleware\
    \ = require('../middlewares/auth');\nconst rateLimiterMiddleware = require('../middlewares/rateLimiter');\n\
    const validateInputMiddleware = require('../middlewares/validateInput');\n\n//\
    \ 带有速率限制的保护路由\nrouter.get('/protected', authMiddleware, rateLimiterMiddleware,\
    \ (req, res) => {\n  res.json({ message: 'This is a protected route' });\n});\n\
    \n// POST /api/resource - 使用输入验证创建新资源\nrouter.post('/resource', validateInputMiddleware,\
    \ (req, res) => {\n  // 处理创建逻辑\n});\n```\n\n"
