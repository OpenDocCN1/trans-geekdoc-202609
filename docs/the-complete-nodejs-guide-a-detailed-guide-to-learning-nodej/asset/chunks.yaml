  trans: "\n\n// 将流连接起来 \n\n```javascript\nreadableStream\n  .pipe(gzip) // 压缩数据\n\
    \  .pipe(writableStream) // 将压缩后的数据写入输出文件\n  .on('finish', () => {\n    console.log('File\
    \ successfully compressed.');\n  })\n  .on('error', (err) => {\n    console.error('Error:',\
    \ err);\n  });\n```\n\n在这个示例中，我们使用 `fs.createReadStream` 从 `input.txt` 读取数据，使用\
    \ `zlib.createGzip` 压缩数据，并使用 `fs.createWriteStream` 将压缩数据写入 `input.txt.gz`。`pipe`\
    \ 方法将这些流连接在一起，允许数据无缝地从可读流流过变换流并进入可写流。\n\n## 变换流 (Transform Streams)\n\n变换流（TRANSFORM\
    \ STREAMS）是一种特殊的双工流（duplex stream），其输出是根据输入计算的。它们对于压缩、加密或在读写数据过程中修改数据等操作特别有用。\n\
    \n### 示例\n\n```javascript\nconst { Transform } = require('stream');\n\nclass UppercaseTransform\
    \ extends Transform {\n  _transform(chunk, encoding, callback) {\n    this.push(chunk.toString().toUpperCase());\n\
    \    callback();\n  }\n}\n\nconst uppercase = new UppercaseTransform();\n\n//\
    \ 使用自定义变换流\nprocess.stdin\n  .pipe(uppercase)\n  .pipe(process.stdout);\n```\n\
    \n在这个示例中，我们创建了一个自定义的变换流 `UppercaseTransform`，它将所有输入数据转换为大写。通过将 `process.stdin`\
    \ 管道到 `uppercase` 然后再到 `process.stdout`，我们可以在打印之前将输入到终端的任何内容转换为大写。\n\n## 流中的错误处理\n\
    \n在流中处理错误（HANDLING ERRORS）对于确保应用程序能够从意外问题中优雅地恢复至关重要。\n\n### 示例\n\n```javascript\n\
    const fs = require('fs');\n\nconst readableStream = fs.createReadStream('nonexistent.txt');\n\
    \nreadableStream.on('error', (err) => {\n  console.error('Error:', err);\n});\n\
    \n// 提供备用方案或替代操作\nreadableStream.on('error', (err) => {\n  if (err.code === 'ENOENT')\
    \ {\n    console.log('File not found. Creating a new file...');\n    fs.writeFileSync('nonexistent.txt',\
    \ 'This is a new file.');\n  } else {\n    console.error('Error:', err);\n  }\n\
    });\n```\n\n在这个示例中，我们处理了不存在文件的错误事件。如果未找到文件（`ENOENT` 错误代码），我们将创建一个新文件作为备选。\n\n\
    ![image](img/image046.png)\n![image](img/image183.png)\n\n## 7.5. 模块设计模式\n\n当你深入研究高级\
    \ Node.js 编程时，理解模块设计模式是非常关重要的。这些模式帮助你组织代码、提高可维护性并增强可扩展性。Node.js 中的模块是封装了特定功能的独立文件或包，可以在应用程序的不同部分进行复用。本节将探索一些常见的模块设计模式以及如何在你的\
    \ Node.js 项目中有效应用它们。\n\n### 1. 模块暴露模块模式 (Revealing Module Pattern)\n\n模块揭示模块模式（REVEALING\
    \ MODULE Pattern）是 JavaScript 中常见的设计模式之一。它的目标是封装私有成员，同时仅暴露模块必要的部分。\n\n### 示例\n\
    \n```javascript\n// mathModule.js\nconst mathModule = (() => {\n  let _privateCounter\
    \ = 0;\n  function _privateMethod() {\n    console.log('Private method');\n  }\n\
    \  function add(a, b) {\n    _privateCounter++;\n    return a + b;\n  }\n  function\
    \ subtract(a, b) {\n    _privateCounter++;\n    return a - b;\n  }\n  return {\n\
    \    add,\n    subtract\n  };\n})();\n\nmodule.exports = mathModule;\n\n// main.js\n\
    const math = require('./mathModule');\nconsole.log(math.add(5, 3)); // 输出: 8\n\
    console.log(math.subtract(5, 3)); // 输出: 2\n```\n\n在这个示例中，`_privateCounter` 和\
    \ `_privateMethod` 是私有的，无法在 `mathModule` 外部访问。只有 `add` 和 `subtract` 方法被暴露并可以被其他模块使用。\n\
    \n![image](img/image028.png)\n\n### 2. 单例模式 (Singleton Pattern)\n\n单例模式（SINGLETON\
    \ PATTERN）确保一个类只有一个实例，并为其提供全局访问点。这对于管理全局状态（如配置或日志）非常有用。\n\n### 示例\n\n```javascript\n\
    // logger.js\nclass Logger {\n  constructor() {\n    if (Logger.instance) {\n\
    \      return Logger.instance;\n    }\n    this.logs = [];\n    Logger.instance\
    \ = this;\n  }\n  log(message) {\n    this.logs.push(message);\n  }\n  printLogs()\
    \ {\n    console.log(this.logs);\n  }\n}\nmodule.exports = new Logger();\n\n//\
    \ main.js\nconst logger = require('./logger');\nlogger.log('First log');\nconst\
    \ logger2 = require('./logger');\nlogger2.log('Second log');\n```\n（注：根据提供的碎片文本重构了逻辑，以确保\
    \ JS 语法有效）\n\n在这个示例中，`Logger` 类确保了只创建一个实例。\n\n### 3. 工厂模式 (Factory Pattern)\n\n\
    工厂模式（FACTORY PATTERN）用于创建对象而不向客户端暴露实例化逻辑。\n\n### 示例\n\n```javascript\n// shapeFactory.js\n\
    class Circle {\n  constructor(radius) {\n    this.radius = radius;\n  }\n  draw()\
    \ {\n    console.log(`Drawing a circle with radius ${this.radius}`);\n  }\n}\n\
    class Square {\n  constructor(side) {\n    this.side = side;\n  }\n  draw() {\n\
    \    console.log(`Drawing a square with side ${this.side}`);\n  }\n}\nclass ShapeFactory\
    \ {\n  static createShape(type, size) {\n    if (type === 'circle') {\n      return\
    \ new Circle(size);\n    } else if (type === 'square') {\n      return new Square(size);\n\
    \    }\n    return null;\n  }\n}\nmodule.exports = ShapeFactory;\n\n// main.js\n\
    const ShapeFactory = require('./shapeFactory');\nconst myCircle = ShapeFactory.createShape('circle',\
    \ 5);\nmyCircle.draw(); // 输出: Drawing a circle with radius 5\nconst mySquare\
    \ = ShapeFactory.createShape('square', 4);\nmySquare.draw(); // 输出: Drawing a\
    \ square with side 4\n```\n\n在这个示例中，`ShapeFactory` 抽象了不同形状的创建逻辑，代码更加简洁。\n\n###\
    \ 4. 中间件模式 (Middleware Pattern)\n\n中间件模式（MIDDLEWARE PATTERN）在 Express.js 等 Web\
    \ 框架中被广泛使用。它允许你定义请求通过的处理管道。每个中间件函数都可以修改请求、响应或将控制传递给下一个中间件。\n\n### 示例\n\n```javascript\n\
    // middleware.js\nfunction logger(req, res, next) {\n  console.log(`${req.method}\
    \ ${req.url}`);\n  next();\n}\nfunction errorHandler(err, req, res, next) {\n\
    \  console.error(err.stack);\n  res.status(500).send('Something broke!');\n}\n\
    module.exports = { logger, errorHandler };\n\n// server.js\nconst express = require('express');\n\
    const { logger, errorHandler } = require('./middleware');\nconst app = express();\n\
    \napp.use(logger);\napp.get('/', (req, res) => {\n  res.send('Hello World');\n\
    });\napp.get('/error', (req, res) => {\n  throw new Error('Oops!');\n});\n\napp.use(errorHandler);\n\
    app.listen(3000, () => {\n  console.log('Server running on port 3000');\n});\n\
    ```\n\n"
