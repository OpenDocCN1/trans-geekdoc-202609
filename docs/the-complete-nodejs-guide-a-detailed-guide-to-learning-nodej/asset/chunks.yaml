    \ the `errorHandler` middleware handles any errors that occur in the application.\n\
    \n## 5. Proxy Pattern\n\nTHE PROXY PATTERN PROVIDES a surrogate or placeholder\
    \ for another object to control access to it. This is useful for implementing\
    \ lazy initialization, access control, logging, and more.\n\nExample:\n\n```javascript\n\
    // networkRequest.js\n\nclass NetworkRequest {\n  fetch (url) {\n    console.log(`Fetching\
    \ data from ${url}\\`);\n    return `Data from ${url}\\`;\n  }\n}\n\nclass NetworkRequestProxy\
    \ {\n  constructor() {\n    this.cache = {};\n    this.networkRequest = new NetworkRequest();\n\
    \  }\n\n  fetch(url) {\n    if (!this.cache[url]) {\n      this.cache[url] = this.networkRequest.fetch(url);\n\
    \    }\n    return this.cache[url];\n  }\n}\n\nmodule.exports = NetworkRequestProxy;\n\
    ```\n\n```javascript\n// main.js\n\nconst NetworkRequestProxy = require('./networkRequest');\n\
    \nconst proxy = new NetworkRequestProxy();\n\nconsole.log(proxy.fetch('https://api.example.com/data1'));\
    \ // Fetching data from https://api.example.com/data1\nconsole.log(proxy.fetch('https://api.example.com/data1'));\
    \ // Cached data\nconsole.log(proxy.fetch('https://api.example.com/data2')); //\
    \ Fetching data from https://api.example.com/data2\n```\n\nIn this example, `NetworkRequestProxy`\
    \ caches the results of network requests, avoiding redundant network calls and\
    \ improving performance.\n\n![image](d2d_images/image210.png)\n\n–––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n![image](d2d_images/image059.png)\n\n## 7.6. Practical Examples: Creating a\
    \ Custom Event Emitter\n\nIN THIS SECTION, WE'LL put into practice the concepts\
    \ learned about event emitters by creating a custom event emitter for a simple\
    \ chat application. This practical example will help you understand how to use\
    \ event emitters effectively to handle real-time events in your Node.js applications.\n\
    \n### Step 1: Setting Up the Project\n\nFIRST, LET'S SET UP our project directory\
    \ and create the necessary files.\n\n```\nmkdir chat-app\ncd chat-app\nnpm init\
    \ -y\nnpm install events\n```\n\nNext, create the following directory structure:\n\
    \n```\nchat-app/\n├── index.js\n└── chat.js\n```\n\n### Step 2: Creating the Chat\
    \ Module\n\nWE'LL CREATE A `Chat` class that extends the `EventEmitter` class\
    \ from the `events` module. This class will emit events for user actions like\
    \ joining, sending messages, and leaving the chat.\n\n```javascript\n// chat.js\n\
    \nconst EventEmitter = require('events');\n\nclass Chat extends EventEmitter {\n\
    \  join (username) {\n    this.emit('join', username);\n  }\n\n  sendMessage (username,\
    \ message) {\n    this.emit('message', username, message);\n  }\n\n  leave (username)\
    \ {\n    this.emit('leave', username);\n  }\n}\n\nmodule.exports = Chat;\n```\n\
    \nIn this module, the `Chat` class has three methods:\n\n1. `join(username)`:\
    \ Emits a 'join' event when a user joins the chat.\n2. `sendMessage(username,\
    \ message)`: Emits a 'message' event when a user sends a message.\n3. `leave(username)`:\
    \ Emits a 'leave' event when a user leaves the chat.\n\n### Step 3: Using the\
    \ Chat Module\n\nNOW, WE'LL USE the `Chat` module in our main application file.\
    \ We'll create an instance of the `Chat` class, register listeners for the events,\
    \ and simulate some user actions.\n\n```javascript\n// index.js\n\nconst Chat\
    \ = require('./chat');\n\nconst chat = new Chat();\n\n// Register listeners\n\
    chat.on('join', (username) => {\n  console.log(`${username} joined the chat.`);\n\
    });\n\nchat.on('message', (username, message) => {\n  console.log(`${username}:\
    \ ${message}`);\n});\n\nchat.on('leave', (username) => {\n  console.log(`${username}\
    \ left the chat.`);\n});\n\n// Simulate user actions\nchat.join('Alice');\nchat.sendMessage('Alice',\
    \ 'Hello, everyone!');\nchat.leave('Alice');\nchat.join('Bob');\nchat.sendMessage('Bob',\
    \ 'Hey Alice, where did you go?');\nchat.leave('Bob');\n```\n\nIn this file, we:\n\
    \n1. Import the `Chat` module.\n2. Create an instance of the `Chat` class.\n3.\
    \ Register listeners for the 'join', 'message', and 'leave' events.\n4. Simulate\
    \ user actions by calling `join`, `sendMessage`, and `leave`.\n\nWhen you run\
    \ this script, you will see the following output:\n\n![image](d2d_images/image18.png)\n\
    ![image](d2d_images/image24.png)\n\n### Step 4: Enhancing the Chat Module\n\n\
    LE'S ENHANCE OUR CHAT application by adding a few features:\n\n* Logging: Log\
    \ events events to file.\n* Broadcasting: Broadcast messages to all users.\n\n\
    ```javascript\n// chat.js\n\nconst EventEmitter = require('events');\nconst fs\
    \ = require('fs');\n\nclass Chat extends EventEmitter {\n  constructor() {\n \
    \   super();\n    this.users = [];\n    this.logStream = fs.createWriteStream('chat.log',\
    \ { flags: 'a' });\n  }\n\n  join (username) {\n    this.users.push(username);\n\
    \    this.emit('join', username);\n  }\n\n  leave (username) {\n    this.users\
    \ = this.users.filter(user => user !== username);\n    this.emit('leave', username);\n\
    \  }\n\n  logEvent (event, username, message = '') {\n    const logMessage = `[${new\
    \ Date().toISOString()}] ${event.toUpperCase()}: ${username} ${message}\\n`;\n\
    \    this.logStream.write(logMessage);\n  }\n\n  broadcast (username, message)\
    \ {\n    this.users.forEach(user => {\n      if (user !== username) {\n      \
    \  this.emit('broadcast', user, message);\n      }\n    });\n  }\n}\n\nmodule.exports\
    \ = Chat;\n```\n\nIn this enhanced version:\n\n1. Logging: We added a `logStream`\
    \ to log events. The `logEvent` method logs events with timestamps.\n2. Broadcasting:\
    \ The `broadcast` method emits a 'broadcast' event to all users except the sender.\n\
    \n```javascript\n// Enhanced index.js\n\nconst Chat = require('./chat');\n\nconst\
    \ chat = new Chat();\n\n// Register listeners\nchat.on('join', (username) => {\n\
    \  console.log(`${username} joined the chat.`);\n});\n\nchat.on('message', (username,\
    \ message) => {\n  console.log(`${username}: ${message}`);\n});\n\nchat.on('leave',\
    \ (username) => {\n  console.log(`${username} left the chat.`);\n});\n\nchat.on('broadcast',\
    \ (user, message) => {\n  console.log(`Broadcast to ${user}: ${message}`);\n});\n\
    \n// Simulate user actions\nchat.join('Alice');\nchat.sendMessage('Alice', 'Hello,\
    \ everyone!');\nchat.leave('Alice');\nchat.join('Bob');\nchat.sendMessage('Bob',\
    \ 'Hey Alice, where did you go?');\nchat.leave('Bob');\n```\n\nIN THIS ENHANCED\
    \ `index.js`, we also register a listener for the 'broadcast' event. Now, when\
    \ a user sends a message, it is broadcasted to all other users, and the events\
    \ are logged to `chat.log`.\n\n![image](d2d_images/image65.png)\n![image](d2d_images/image229.png)\n\
    \n## Sources\n\nTHIS BOOK HAS BEEN crafted with the support of various books,\
    \ websites, and articles to provide comprehensive and accurate information on\
    \ Node.js. Here are 15 key sources that were invaluable in the creation of this\
    \ book:\n\nBooks:\n\n\"Node.js Design Patterns\" by Mario Casciaro and Luciano\
    \ Mammino\n"
