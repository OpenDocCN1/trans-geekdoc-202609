    \ to the request object (    req    ), the response object (    res    ), and\
    \ the next middleware function in the application’s request-response cycle.  \
    \ Middleware can perform a variety of tasks such as executing code, making changes\
    \ to the request and response objects, ending the request-response cycle, and\
    \ calling the next middleware function in the stack. \n\n Middleware functions\
    \ are the heart and soul of Express applications.   They provide a robust mechanism\
    \ for handling HTTP requests and responses, enabling developers to build complex\
    \ and feature-rich web applications.   Understanding how middleware works and\
    \ how to use it effectively is crucial for any developer working with Express.\
    \ \n\n ![image](d2d_images/image184.png)\n\n####  What is Middleware? \n\n   M\
    \    IDDLEWARE IS ESSENTIALLY    a series of functions that are executed in sequence\
    \ for each request that comes into the server.   Each middleware function can\
    \ perform operations on the request and response objects, and either pass control\
    \ to the next middleware function using the    next()    function or end the request-response\
    \ cycle by sending a response to the client. \n\n#####  Key Characteristics of\
    \ Middleware \n\n1.    Chain of Functions    : Middleware functions form a chain\
    \ of operations where each function performs a specific task and then passes control\
    \ to the next function in the sequence. \n\n2.    Access to Request and Response\
    \ Objects    : Middleware functions have access to the request (    req    ) and\
    \ response (    res    ) objects, allowing them to read from and modify these\
    \ objects as needed. \n\n3.    Control Flow    : Middleware functions can control\
    \ the flow of the request-response cycle.   By calling    next()    , they pass\
    \ control to the next middleware function.   If they do not call    next()   \
    \ , the request-response cycle ends. \n\n4.    Order Matters    : The order in\
    \ which middleware functions are defined is important.   They are executed in\
    \ the order they are added to the application. \n\n###  Types of Middleware \n\
    \n   M    IDDLEWARE IN EXPRESS    .js can be broadly categorized into three types:\
    \ built-in middleware, third-party middleware, and custom middleware.   Each type\
    \ serves different purposes and provides various functionalities that help streamline\
    \ the development process and enhance the capabilities of your web applications.\
    \ \n\n####  Built-in Middleware \n\n   E    XPRESS.JS COMES WITH    a set of built-in\
    \ middleware functions that provide basic but essential functionalities.   These\
    \ middleware functions are integrated into Express and do not require any additional\
    \ installation.   The most commonly used built-in middleware functions include:\
    \ \n\n  express.static    : \n\n*     Purpose     : Serves static files such as\
    \ HTML, CSS, JavaScript, images, and other assets.  \n\n*     Usage     : This\
    \ middleware is essential for delivering static content to the client directly\
    \ from the server.  \n\n  express.json    : \n\n*     Purpose     : Parses incoming\
    \ requests with JSON payloads and is based on    body-parser    .  \n\n*     Usage\
    \     : This middleware is useful for APIs that expect JSON data in the request\
    \ body.  \n\n  express.urlencoded    : \n\n*     Purpose     : Parses incoming\
    \ requests with URL-encoded payloads.   This is typically used for HTML form submissions.\
    \  \n\n*     Usage    : This middleware is useful for handling form submissions\
    \ where the data is encoded in the URL. \n\n####  Third-Party Middleware "
