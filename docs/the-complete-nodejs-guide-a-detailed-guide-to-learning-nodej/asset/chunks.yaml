  trans: "\n\n# 建立连接\n\n与 PostgreSQL 数据库连接涉及创建一个包含必要配置详细信息的客户端对象，例如主机名、用户、密码和数据库名称。以下是建立连接的示例：\n\
    \n```javascript\nconst { Client } = require('pg');\n\nconst client = new Client({\n\
    \  host: 'localhost',\n  user: 'your_username',\n  password: 'your_password',\n\
    \  database: 'your_database',\n  port: 5432, // PostgreSQL 的默认端口\n});\n\nclient.connect((err)\
    \ => {\n  if (err) {\n    console.error('连接 PostgreSQL 错误:', err);\n    return;\n\
    \  }\n  console.log('已连接 PostgreSQL');\n});\n```\n\n# 执行 CRUD 操作\n\nCRUD 操作（创建、读取、更新、删除）是与数据库交互的基础操作。让我们看看如何在\
    \ Node.js 中使用 `pg` 模块执行这些操作。\n\n### 创建（插入）数据\n\n要向向表中插入数据，你可以使用 `INSERT INTO`\
    \ SQL 语句。以下是一个向 `users` 表插入一个新用户的示例：\n\n```javascript\nconst user = { username:\
    \ 'johndoe', password: 'securepassword' };\nconst query = 'INSERT INTO users (username,\
    \ password) VALUES ($1, $2) RETURNING id';\nclient.query(query, [user.username,\
    \ user.password], (err, res) => {\n  if (err) {\n    console.error('插入数据错误:',\
    \ err);\n    return;\n  }\n  console.log('用户已添加，ID 为:', res.rows[0].id);\n});\n\
    ```\n\n### 读取（查询）数据\n\n要从表中检索数据，你可以使用 `SELECT` SQL 语句。以下是从 `users` 表中查询所有用户的示例：\n\
    \n```javascript\nconst query = 'SELECT * FROM users';\nclient.query(query, (err,\
    \ res) => {\n  if (err) {\n    console.error('读取数据错误:', err);\n    return;\n \
    \ }\n  console.log('用户数据:', res.rows);\n});\n```\n\n### 更新数据\n\n要更新表中的现有数据，你可以使用\
    \ `UPDATE` SQL 语句。以下是更新用户密码的示例：\n\n```javascript\nconst userId = 1;\nconst newPassword\
    \ = 'newsecurepassword';\nconst query = 'UPDATE users SET password = $1 WHERE\
    \ id = $2';\nclient.query(query, [newPassword, userId], (err, res) => {\n  if\
    \ (err) {\n    console.error('更新数据错误:', err);\n    return;\n  }\n  console.log('受影响行数:',\
    \ res.rowCount);\n});\n```\n\n### 删除数据\n\n要从表中删除数据，你可以使用 `DELETE` SQL 语句。以下是从\
    \ `users` 表中删除一个用户的示例：\n\n```javascript\nconst userId = 1;\nconst query = 'DELETE\
    \ FROM users WHERE id = $1';\nclient.query(query, [userId], (err, res) => {\n\
    \  if (err) {\n    console.error('删除数据错误:', err);\n    return;\n  }\n  console.log('删除的行数:',\
    \ res.rowCount);\n});\n```\n\n![image](img/scene_break.png)\n![image](img/image06.png)\n\
    \n# 高级功能：事务与索引\n\n### 事务\n\n事务是系列作为单个单元执行的一个或多个 SQL 操作。它们确保数据完整性和一致性，特别是在多个操作依赖于其他操作的情况下。事务遵循\
    \ ACID 特性：原子性、一致性、隔离性和持久性。\n\n在 Node.js 中对 PostgreSQL 执行事务，你可以使用 `BEGIN`、`COMMIT`\
    \ 和 `ROLLBACK` SQL 语句。以下是一个示例：\n\n```javascript\nclient.connect((err) => {\n \
    \ if (err) {\n    console.error('连接数据库错误:', err);\n    return;\n  }\n  client.query('BEGIN',\
    \ (err) => {\n    if (err) {\n      console.error('开始事务错误:', err);\n      return;\n\
    \    }\n    client.query('INSERT INTO accounts(name, balance) VALUES($1, $2)',\
    \ ['Alice', 100], (err) => {\n      if (err) {\n        console.error('插入数据错误:',\
    \ err);\n        client.query('ROLLBACK');\n        return;\n      }\n      client.query('COMMIT',\
    \ (err) => {\n        if (err) {\n          console.error('提交事务错误:', err);\n \
    \       } else {\n          console.log('事务成功提交');\n        }\n      });\n   \
    \ });\n  });\n});\n```\n\n### 索引\n\n索引可以提高数据检索的速度。它们对于经常使用 `WHERE` 子句或连接操作的列非常有用。\n\
    \n在表上创建索引的示例如下：\n\n```sql\nCREATE INDEX idx_username ON users(username);\n```\n\
    \n"
