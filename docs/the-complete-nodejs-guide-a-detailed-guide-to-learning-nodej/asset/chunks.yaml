    \ server \n\n server.    listen    (3000, () => { \n\n console.    log    ('HTTPS\
    \ server running on port 3000'); \n\n }); \n\n  Generate SSL/TLS Certificates\
    \    : For development purposes, you can generate self-signed certificates using\
