  trans: "\n\n```javascript\napp.listen(PORT, () => {\n  console.log(`Server running\
    \ on port ${PORT}`);\n});\n```\n\n## 授权\n\n授权控制（AUTHORIZATION CONTROLS）定义了用户可以执行以及他们可以访问的资源。通常通过基于角色的访问控制\
    \ (RBAC) 或基于属性的访问控制 (ABAC) 实现。\n\n1. **基于角色的访问控制 (RBAC)**：为用户分配角色，并赋予角色权限。例如，“admin”角色可能可以访问所有资源，而“user”角色的访问权限有限。\n\
    2. **基于属性的访问控制 (ABAC)**：根据用户、资源和环境的属性授予访问权限。与 RBAC 相比，这允许更细粒度的控制。\n\n### 实现基于角色的授权\n\
    \n#### 1. 使用角色扩展用户模型：\n\n`MODELS/USER.JS`\n\n```javascript\nconst users = [\n\
    \  {\n    id: 1,\n    username: 'user1',\n    password: '$2a$10$CwTycUXWue0Thq9StjUM0uJ8BRg.GtOvBtt/RCK3GGbS1j3M4eCqa',\
    \ // 哈希密码 'password1'\n    role: 'user'\n  },\n  {\n    id: 2,\n    username:\
    \ 'admin',\n    password: '$2a$10$7sHhBft6A8IzTmKfv92BVuBPXk8lUNW.s2hlcX0DxE.MhAp.kTF7i',\
    \ // 哈希密码 'admin123'\n    role: 'admin'\n  }\n];\n\nmodule.exports = users;\n\
    ```\n\n#### 创建基于角色的授权的中间件：\n\n`middlewares/authorize.js`\n\n```javascript\nconst\
    \ jwt = require('jsonwebtoken');\nconst users = require('../models/user');\nconst\
    \ SECRET_KEY = 'your_secret_key';\n\nfunction authorize(roles = []) {\n  // roles\
    \ 参数可以是单个角色字符串（例如 'admin'）或角色数组（例如 ['admin', 'user']）\n  if (typeof roles ===\
    \ 'string') {\n    roles = [roles];\n  }\n  return (req, res, next) => {\n   \
    \ const token = req.headers.authorization.split(' ')[1];\n    if (!token) {\n\
    \      return res.status(401).json({ message: 'No token provided' });\n    }\n\
    \    try {\n      const decoded = jwt.verify(token, SECRET_KEY);\n      const\
    \ user = users.find(u => u.id === decoded.id);\n      if (!user || (roles.length\
    \ && !roles.includes(user.role))) {\n        return res.status(403).json({ message:\
    \ 'Forbidden' });\n      }\n      req.user = user;\n      next();\n    } catch\
    \ (error) {\n      res.status(401).json({ message: 'Invalid token' });\n    }\n\
    \  };\n}\n\nmodule.exports = authorize;\n```\n\n#### 使用基于角色的中间件保护路由：\n\n`routes/protected.js`\n\
    \n```javascript\nconst express = require('express');\nconst authorize = require('../middlewares/authorize');\n\
    const router = express.Router();\n\n// 仅限管理员的路由\nrouter.get('/admin', authorize('admin'),\
    \ (req, res) => {\n  res.json({ message: 'Welcome, admin!' });\n});\n\n// 用户和管理员路由\n\
    router.get('/user', authorize(['user', 'admin']), (req, res) => {\n  res.json({\
    \ message: `Welcome, ${req.user.role}!` });\n});\n\nmodule.exports = router;\n\
    ```\n\n#### 将保护路由集成到你的应用程序：\n\n`app.js`\n\n```javascript\nconst express = require('express');\n\
    const bodyParser = require('body-parser');\nconst authRoutes = require('./routes/auth');\n\
    const protectedRoutes = require('./routes/protected');\n\nconst app = express();\n\
    \napp.use(bodyParser.json());\napp.use('/auth', authRoutes);\napp.use('/protected',\
    \ protectedRoutes);\n\nconst PORT = process.env.PORT || 3000;\n\napp.listen(PORT,\
    \ () => {\n  console.log(`Server running on port ${PORT}`);\n});\n```\n\n![image](img/image021.png)\n\
    ![image](img/image200.png)\n\n## 5.4. Node.js 中的安全编码实践\n\n安全编码实践（SECURE CODING\
    \ PRACTICES）对于构建能够抵御恶意攻击的弹性健应用程序至关重要。Node.js 凭借其异步特性和丰富的生态系统，在安全方面既提供了机遇也带来了挑战。本节将涵盖编写安全\
    \ Node.js 代码的最佳实践，确保你的应用程序免受常见漏洞和威胁。\n\n![image](img/image005.png)\n\n### 输入验证与清理\n\
    \n1. **验证所有输入**：始终验证来自所有源的输入，包括用户输入、API 请求和来自其他服务的数据。使用 `Joi` 或 `validator` 等验证库来确保数据符合预期格式。\n\
    \n```javascript\nconst JI = require('joi');\n\nconst schema = Joi.object({\n \
    \ username: Joi.string().alphanum().min(3).max(30).required(),\n  password: Joi.string().pattern(new\
    \ RegExp('^[a-zA-Z0-9]{3,30}$')).required()\n});\n\nconst { error, value } = schema.validate({\
    \ username: 'user1', password: 'password1' });\nif (error) {\n  console.error('Validation\
    \ error:', error.details);\n} else {\n  console.log('Validated data:', value);\n\
    }\n```\n\n2. **清理输入**：从输入中移除或转义危险字符以防止注入攻击。使用 `sanitize-html` 等库。\n\n```javascript\n\
    const sanitizeHtml = require('sanitize-html');\nconst sanitized = sanitizeHtml('<script>alert(\"\
    xss\")</script>', {\n  allowedTags: [],\n  allowedAttributes: {}\n});\nconsole.log('Sanitized\
    \ input:', sanitized); // 输出: ''\n```\n\n### 避免 SQL 注入\n\n**使用参数化查询**：与数据库交互时，使用参数化查询或预处理语句来防止注入攻击。PostgreSQL\
    \ 的 `pg` 或 MySQL 的 `mysql2` 等库都支持此。\n\n```javascript\nconst { Client } = require('pg');\n\
    const client = new Client();\nconst userId = 1; // 用户输入\nconst query = 'SELECT\
    \ * FROM users WHERE id = $1';\nclient.query(query, [userId], (err, res) => {\n\
    \  if (err) {\n    console.error('Query error:', err.stack);\n  } else {\n   \
    \ console.log('Query result:', res.rows);\n  }\n});\n```\n\n### 防护跨站脚本 (XSS)\n\
    \n1. **转义输出**：在 HTML 中渲染用户生成的内容时，转义特殊字符以防止 XSS。使用 Pug 或 Handlebars 等模板引擎，它们会自动转义输出。\n\
    \n```javascript\n// PUG 示例\np= userInput // 自动转义 userInput\n\nconst Handlebars\
    \ = require('handlebars');\nconst template = Handlebars.compile('<p>{{userInput}}</p>');\n\
    const result = template({ userInput: '<script>alert(\"xss\")</script>' });\nconsole.log('Escaped\
    \ output:', result); // 输出: <p>&lt;script&gt;alert(\"xss\");&lt;/script&gt;</p>\n\
    ```\n\n### 使用安全头部\n\n1. **设置安全头部**：使用 `helmet` 等中间件设置相关的 HTTP 头部，通过防止常见攻击增强应用程序的安全性。\n\
    \n```javascript\nconst helmet = require('helmet');\nconst express = require('express');\n\
    \nconst app = express();\n\napp.use(helmet());\n\napp.get('/', (req, res) => {\n\
    \  res.send('Hello, secure world!');\n});\n\nconst PORT = process.env.PORT ||\
    \ 3000;\napp.listen(PORT, () => {\n  console.log(`Server running on port ${PORT}`);\n\
    });\n```\n\n### 防止跨站请求伪造 (CSRF)\n\n1. **使用 CSRF 保护**：实施 CSRF 保护以防止代表已授权用户执行未经授权的操作。使用\
    \ `csurf` 等中间件在表单中添加 CSRF 令牌并在服务器上进行验证。\n\n"
