    \  let filePath = path.join(__dirname, 'public', req.url === '/' ? 'index.html'\
    \ : req.url);\n  // Get the file extension\n  let extname = path.extname(filePath);\n\
    \  // Set default content type\n  let contentType = 'text/html';\n  // Determine\
    \ the content type based on the file extension\n  switch (extname) {\n    case\
    \ '.js':\n      contentType = 'text/javascript';\n      break;\n    case '.css':\n\
    \      contentType = 'text/css';\n      break;\n    case '.json':\n      contentType\
    \ = 'application/json';\n      break;\n    case '.png':\n      contentType = 'image/png';\n\
    \      break;\n    case '.jpg':\n      contentType = 'image/jpg';\n      break;\n\
    \  }\n  // Read the file and serve it\n  fs.readFile(filePath, (err, content)\
    \ => {\n    if (err) {\n      if (err.code == 'ENOENT') {\n        // File not\
    \ found\n        fs.readFile(path.join(__dirname, 'public', '404.html'), (err,\
    \ content) => {\n          res.writeHead(404, { 'Content-Type': 'text/html' });\n\
    \          res.end(content, 'utf8');\n        });\n      } else {\n        //\
    \ Some server error\n        res.writeHead(500);\n        res.end(`Server Error:\
    \ ${err.code}`);\n      }\n    } else {\n      // Serve the file\n      res.writeHead(200,\
    \ { 'Content-Type': contentType });\n      res.end(content, 'utf8');\n    }\n\
    \  });\n});\n\nconst PORT = 3000;\nserver.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n\n### Explanation:\n\n- This\
    \ code sets up a basic HTTP server that serves files from a `public` directory.\n\
    - It determines the content type based on the file extension and serves the file\
    \ with the correct content type.\n- If a file is not found, it serves a custom\
    \ 404 error page.\n\n![image](d2d_images/image102.png)\n\n### Serving Static Files\
    \ with Express\n\nUSING EXPRESS, serving static files becomes much simpler with\
    \ the help of the `express.static` middleware.\n\n#### Example with Express:\n\
    \n```\nproject-directory/\n├── public/\n│   ├── index.html\n│   ├── style.css\n\
    │   └── script.js\n└── server.js\n```\n\n- The `express.static` middleware is\
    \ used to serve static files from the `public` directory.\n- When you access `http://localhost:3000`,\
    \ Express will look for `index.html` in the `public` directory and serve it.\n\
    \n#### Customizing the Static Middleware\n\nYOU CAN CUSTOMIZE THE behavior of\
    \ the `express.static` middleware with options such as setting cache control headers,\
    \ specifying a fallback, and more.\n\n#### Example with Custom Options:\n\n```javascript\n\
    const express = require('express');\nconst path = require('path');\nconst app\
    \ = express();\nconst options = {\n  dotfiles: 'ignore', // Options are 'allow',\
    \ 'deny', 'ignore'\n  etag: false,\n  extensions: ['htm', 'html'],\n  index: 'index.html',\n\
    \  maxAge: '1d', // Cache control\n  redirect: false,\n  setHeaders: function\
    \ (res, path, stat) {\n    res.set('x-timestamp', Date.now());\n  }\n};\n\n//\
    \ Serve static files from the \"public\" directory with custom options\napp.use(express.static(path.join(__dirname,\
    \ 'public'), options));\n\nconst PORT = 3000;\napp.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n\n### Explanation:\n\n- `dotfiles`:\
    \ Controls the handling of dotfiles. Options are 'allow', 'deny', 'ignore'.\n\
    - `etag`: Disables ETag headers.\n- `extensions`: Sets default file extension\
    \ fallback.\n- `index`: Specifies the default file to serve.\n- `maxAge`: Sets\
    \ the Cache-Control max-age directive in milliseconds or a string in a format\
    \ accepted by the `ms` module.\n- `redirect`: Disables redirect for directories\
    \ without a trailing slash.\n- `setHeaders`: Allows you to set custom headers.\n\
    \n![image](d2d_images/image190.png)\n![image](d2d_images/image006.png)\n\n## 4.5.\
    \ Using Middleware\n\n### Introduction to Middleware\n\nMIDDLEWARE IS ONE OF the\
    \ core concepts of Express.js, a web application framework for Node.js. Middleware\
    \ functions are functions that have access to the request object (`req`), the\
    \ response object (`res`), and the next middleware function in the application’s\
    \ request-response cycle. Middleware can perform a variety of tasks such as executing\
    \ code, making changes to the request and response objects, ending the request-response\
    \ cycle, and calling the next middleware function in the stack.\n\nMiddleware\
    \ functions are the heart and soul of Express applications. They provide a robust\
    \ mechanism for handling HTTP requests and responses, enabling developers to build\
    \ complex and feature-rich web applications. Understanding how middleware works\
    \ and how to use it effectively is crucial for any developer working with Express.\n\
    \n![image](d2d_images/image184.png)\n\n#### What is Middleware?\n\nMIDDLEWARE\
    \ IS ESSENTIALLY a series of functions that are executed in sequence for each\
    \ request that comes into the server. Each middleware function can perform operations\
    \ on the request and response objects, and either pass control to the next middleware\
    \ function using the `next()` function or end the request-response cycle.\n\n\
    ##### Key Characteristics of Middleware\n\n1. **Chain of Functions**: Middleware\
    \ functions form a chain of operations where each function performs a specific\
    \ task and then passes control to the next function.\n2. **Access to Request and\
    \ Response Objects**: Middleware functions have access to request (`req`) and\
    \ response (`res`) objects, allowing them to read from and modify these objects\
    \ as needed.\n3. **Control Flow**: Middleware functions can control the flow of\
    \ the request-response cycle. By calling `next()`, they pass control to the next\
    \ function. If they do not call `next()`, the request-response cycle ends.\n4.\
    \ **Order Matters**: The order in which middleware functions are defined is important.\
    \ They are executed in the order they are added.\n\n### Types of Middleware\n\n\
    MIDDLEWARE IN EXPRESS.js can be broadly categorized into three types: built-in\
    \ middleware, third-party middleware, and custom middleware. Each type serves\
    \ different purposes and provides various functionalities that help streamline\
    \ the development process and enhance the capabilities of your web applications.\n\
    \n#### Built-in Middleware\n\nEXPRESS.JS COMES WITH a set of built-in middleware\
    \ functions that provide basic but essential functionalities. These middleware\
    \ functions are integrated into Express and do not require any additional installation.\
    \ The most commonly used built-in middleware functions include:\n\n- `express.static`:\n\
    \  - Purpose: Serves static files such as HTML, CSS, JavaScript, images, and other\
    \ assets.\n  - Usage: This middleware is essential for delivering static content\
    \ to the client directly from the server.\n- `express.json`:\n  - Purpose: Parses\
    \ incoming requests with JSON payloads and is based on `body-parser`.\n  - Usage:\
    \ This middleware is useful for APIs that expect JSON data in the request body.\n\
    - `express.urlencoded`:\n  - Purpose: Parses incoming requests with URL-encoded\
    \ payloads. This is typically used for HTML form submissions.\n  - Usage: This\
    \ middleware is useful for handling form submissions where the data is encoded\
    \ in the URL.\n"
