  trans: "\n });\n\n在这个示例中，`logger` 间件会记录每个请求，而 `errorHandler` 间件会处理应用程序中发生的任何错误。\n\
    \n## 5. 代理模式\n\n代理模式为另一个对象提供代理或占位符，以控制对它的访问。这对于实现懒性初始化、访问控制、日志记录等非常有用。\n\n示例：\n\
    \n```javascript\n// networkRequest.js\n\nclass NetworkRequest {\n  fetch (url)\
    \ {\n    console.log(`Fetching data from ${url}\\`);\n    return `Data from ${url}\\\
    `;\n  }\n}\n\nclass NetworkRequestProxy {\n  constructor() {\n    this.cache =\
    \ {};\n    this.networkRequest = new NetworkRequest();\n  }\n\n  fetch(url) {\n\
    \    if (!this.cache[url]) {\n      this.cache[url] = this.networkRequest.fetch(url);\n\
    \    }\n    return this.cache[url];\n  }\n}\n\nmodule.exports = NetworkRequestProxy;\n\
    ```\n\n```javascript\n// main.js\n\nconst NetworkRequestProxy = require('./networkRequest');\n\
    \nconst proxy = new NetworkRequestProxy();\n\nconsole.log(proxy.fetch('https://api.example.com/data1'));\
    \ // Fetching data from https://api.example.com/data1\nconsole.log(proxy.fetch('https://api.example.com/data1'));\
    \ // Cached data\nconsole.log(proxy.fetch('https://api.example.com/data2')); //\
    \ Fetching data from https://api.example.com/data2\n```\n\n在这个示例中，`NetworkRequestProxy`\
    \ 缓存了网络请求的结果，避免了冗余的网络调用并提升了性能。\n\n![image](img/image210.png)\n\n–––––––\n\n![image](img/scene_break.png)\n\
    \n![image](img/image059.png)\n\n## 7.6. 实际示例：创建自定义事件发射器\n\n在本节中，我们将通过为简单的聊天应用程序创建一个自定义的事件发射器，来实践所学的事件发射器概念。这个实用示例将帮助你理解如何有效地使用事件发射器来处理\
    \ Node.js 应用程序中的实时事件。\n\n### 第 1 步：设置项目\n\n首先，让我们设置我们的项目目录并创建必要的文件。\n\n```\nmkdir\
    \ chat-app\ncd chat-app\nnpm init -y\nnpm install events\n```\n\n接下来，创建以下目录结构：\n\
    \n```\nchat-app/\n├── index.js\n└── chat.js\n```\n\n### 第 2 步：创建聊天模块\n\n我们将创建一个扩展自\
    \ `events` 模块中 `EventEmitter` 类的 `Chat` 类。该类将为加入、发送消息和离开聊天等操作发射事件。\n\n```javascript\n\
    // chat.js\n\nconst EventEmitter = require('events');\n\nclass Chat extends EventEmitter\
    \ {\n  join (username) {\n    this.emit('join', username);\n  }\n\n  sendMessage\
    \ (username, message) {\n    this.emit('message', username, message);\n  }\n\n\
    \  leave (username) {\n    this.emit('leave', username);\n  }\n}\n\nmodule.exports\
    \ = Chat;\n```\n\n在这个模块中，`Chat` 类有三个方法：\n\n1. `join(username)`：当用户加入聊天时发射 'join'\
    \ 事件。\n2. `sendMessage(username, message)`：当用户发送消息时发射 'message' 事件。\n3. `leave(username)`：当用户离开聊天时发射\
    \ 'leave' 事件。\n\n### 第 3 步：使用聊天模块\n\n现在，我们将在主应用程序中使用 `Chat` 模块。我们将创建一个 `Chat`\
    \ 类的实例，注册事件的监听器，并模拟一些用户操作。\n\n```javascript\n// index.js\n\nconst Chat = require('./chat');\n\
    \nconst chat = new Chat();\n\n// Register 监听器\nchat.on('join', (username) => {\n\
    \  console.log(`${username} joined the chat.`);\n});\n\nchat.on('message', (username,\
    \ message) => {\n  console.log(`${username}: ${message}`);\n});\n\nchat.on('leave',\
    \ (username) => {\n  console.log(`${username} left the chat.`);\n});\n\n// 模拟用户操作\n\
    chat.join('Alice');\nchat.sendMessage('Alice', 'Hello, everyone!');\nchat.leave('Alice');\n\
    chat.join('Bob');\nchat.sendMessage('Bob', 'Hey Alice, where did you go?');\n\
    chat.leave('Bob');\n```\n\n在这个文件中，我们：\n\n1. 导入了 `Chat` 模块。\n2. 创建了 `Chat` 类的实例。\n\
    3. 注册了 'join'、'message' 和 'leave' 事件的监听器。\n4. 通过调用 `join`、`sendMessage` 和 `leave`\
    \ 模拟了用户操作。\n\n运行此脚本时，你将看到以下输出：\n\n![image](img/image18.png)\n![image](img/image24.png)\n\
    \n### 第 4 步：增强聊天模块\n\n让我们添加一些功能来增强我们的聊天应用程序：\n\n* 日志：将事件记录到文件中。\n* 广播：向所有用户广播消息。\n\
    \n```javascript\n// chat.js\n\nconst EventEmitter = require('events');\nconst\
    \ fs = require('fs');\n\nclass Chat extends EventEmitter {\n  constructor() {\n\
    \    super();\n    this.users = [];\n    this.logStream = fs.createWriteStream('chat.log',\
    \ { flags: 'a' });\n  }\n\n  join (username) {\n    this.users.push(username);\n\
    \    this.emit('join', username);\n  }\n\n  leave (username) {\n    this.users\
    \ = this.users.filter(user => user !== username);\n    this.emit('leave', username);\n\
    \  }\n\n  logEvent (event, username, message = '') {\n    const logMessage = `[${new\
    \ Date().toISOString()}] ${event.toUpperCase()}: ${username} ${message}\\n`;\n\
    \    this.logStream.write(logMessage);\n  }\n\n  broadcast (username, message)\
    \ {\n    this.users.forEach(user => {\n      if (user !== username) {\n      \
    \  this.emit('broadcast', user, message);\n      }\n    });\n  }\n}\n\nmodule.exports\
    \ = Chat;\n```\n\n在这个增强版本中：\n\n1. 日志：我们添加了一个 `logStream` 来记录事件。`logEvent` 方法带有时间戳记录事件。\n\
    2. 广播：`broadcast` 方法向发送者外的所有用户发射 'broadcast' 事件。\n\n```javascript\n//  Enhanced\
    \ index.js\n\nconst Chat = require('./chat');\n\nconst chat = new Chat();\n\n\
    // Register 监听器\nchat.on('join', (username) => {\n  console.log(`${username} joined\
    \ the chat.`);\n});\n\nchat.on('message', (username, message) => {\n  console.log(`${username}:\
    \ ${message}`);\n});\n\nchat.on('leave', (username) => {\n  console.log(`${username}\
    \ left the chat.`);\n});\n\nchat.on('broadcast', (user, message) => {\n  console.log(`Broadcast\
    \ to ${user}: ${message}`);\n});\n\n// 模拟用户操作\nchat.join('Alice');\nchat.sendMessage('Alice',\
    \ 'Hello, everyone!');\nchat.leave('Alice');\nchat.join('Bob');\nchat.sendMessage('Bob',\
    \ 'Hey Alice, where did you go?');\nchat.leave('Bob');\n```\n\n在增强后的 `index.js`\
    \ 中，我们还注册了 'broadcast' 事件的监听器。现在，当用户发送消息时，它会被广播给所有其他用户，并且事件会被记录到 `chat.log`。\n\
    \n![image](img/image65.png)\n![image](img/image229.png)\n\n## Sources\n\n本书的创作参考了各种书籍、网站和文章，旨在提供关于\
    \ Node.js 的全面且准确的信息。以下是本书过程中至关重要的 15 个关键来源：\n\n书籍：\n\n\"Node.js Design Patterns\"\
    \ 作者 Mario Casciaro 和 Luciano Mammino\n\n"
