  trans: "\nNode.js 的未来前景广阔，目前正不断努力提升其性能、安全开发者体验。重点关注领域包括：\n\n- 改进诊断功能：增强调试和性能分析工具，帮助开发者更高效地识别和解决问题。\n\
    - 安全性增强：继续加强安全模型，并为安全编码实践提供工具。\n- 性能优化：进一步优化运行时，以处理更具挑战性的工作负载。\n- 生态系统集成：确保与现代开发工具和框架的无缝集成。\n\
    \n## 1.3. Node.js 架构\n\n理解 Node.js 的架构对于体会其性能和可扩展性优势至关重要。Node.js 旨在用于构建可扩展的网络应用程序，其架构在实现这一目标中起着至关重要的作用。Node.js\
    \ 的架构可以大致归分为以下几个关键组件：\n\n1. 单线程事件循环\n2. 非阻塞 I/O\n3. V8 JavaScript 引擎\n4. Libuv\n\
    5. C++ 绑定\n\n### 单线程事件循环\n\nNode.js 的核心是单线程事件循环。与为每个客户端请求创建新线程的传统 Web 服务器不同，Node.js\
    \ 使用单线程处理所有传入的请求。这种单线程特性起初似乎是一个限制，但实际上它是 Node.js 的优势之一。事件循环在异步、非阻塞的范式上运行，允许 Node.js\
    \ 高效地处理许多并发连接，而无需管理多个线程的开销。\n\n事件循环的工作如下：\n\n- 传入请求：当请求到达时，Node.js 将其放入事件队列中。\n\
    - 事件循环处理：事件循环持续检查事件队列中的新请求并进行处理。\n- I/O 操作：如果请求涉及读取文件，Node.js 将其交给 `libuv` 处理。\n\
    - 回调函数：一旦操作完成，相应的回调将被添加到队列中。\n\n### 非阻塞 I/O\n\nNode.js 使用非阻塞 I/O 模型来处理高并发场景。在传统环境中，I/O\
    \ 操作可能会阻塞程序的执行，但在 Node.js 中，当 I/O 操作在后台进行时，执行会继续进行下一个任务。\n\n### V8 JavaScript\
    \ 引擎\n\nV8 引擎是执行 JavaScript 代码的核心。它由 Google 开发，直接将 JavaScript 编译为机器码，确保了服务器端应用的高性能和高效执行。\n\
    \n### Libuv\n\nLibuv 是一个多平台库，提供异步 I/O 能力。它管理事件循环和线程池，允许 Node.js 在不阻塞主线程的情况下处理各种任务。\n\
    \n### C++ 绑定\n\nNode.js 包含了 C++ 绑定，用于与底层系统功能建立接口。这些绑定允许 Node.js 执行关键操作并访问 JavaScript\
    \ 无法直接访问系统资源。\n\n## 实际示例：架构是如何运作的\n\n为了说明这些组件是如何协同工作的，让我们考虑一个用 Node.js 构建的简单服务器实际示例：\n\
    \n```javascript\nconst http = require('http');\nconst server = http.createServer((req,\
    \ res) => {\n  if (req.method === 'GET' && req.url === '/') {\n    res.writeHead(200,\
    \ { 'Content-Type': 'text/plain' });\n    res.end('Hello, World!\\n');\n  } else\
    \ {\n    res.writeHead(404, { 'Content-Type': 'text/plain' });\n    res.end('Not\
    \ Found\\n');\n  }\n});\n\nserver.listen(3000, () => {\n  console.log('Server\
    \ running at http://localhost:3000/');\n});\n```\n\n在此示例中：\n1. **单线程事件循环**：`createServer`\
    \ 函数设置了一个监听传入请求的 HTTP 服务器。每个请求都被添加到事件队列中，由事件循环进行处理。\n2. **非阻塞 I/O**：当接收到请求时，服务器处理它时不会阻塞事件循环。\n\
    3. **V8 引擎**：JavaScript 代码由 V8 引擎执行。\n4. **Libuv**：任何底层异步操作（如处理网络连接）都由 libuv 管理。\n\
    5. **C++ 绑定**：`http` 模块内部使用 C++ 绑定来高效处理网络请求和响应。\n\n"
- fmt: "\nNode.js's architecture, characterized by its single-threaded event loop,\
    \ non-blocking I/O, V8 engine, `libuv` library, and C++ bindings, enables it to\
    \ build high-performance, scalable network applications. By understanding these\
    \ components, developers can leverage Node.js to create efficient and responsive\
    \ applications that meet the demands of modern web development.\n\n## 1.4. Installing\
    \ Node.js\n\nGETTING STARTED WITH Node.js involves setting up the runtime environment\
    \ on your system. Node.js can be installed on various operating systems, including\
    \ Windows, macOS, and Linux. This section will guide you through the installation\
    \ process for each of these platforms, ensuring that you have a smooth and successful\
    \ setup.\n\n### Installing Node.js on Windows\n\n1. **Download the Installer**:\n\
    \   * Visit the official Node.js website at [nodejs.org](https://nodejs.org).\n\
    \n![image](d2d_images/image033.png)\n\nYOU WILL SEE TWO VERSIONS available for\
    \ download: the LTS (Long Term Support) version and the Current version. For most\
    \ users, it is recommended to download the LTS version as it is more stable and\
    \ suitable for production use.\n\nClick on the appropriate installer for Windows\
    \ to download the `.msi` file.\n\n2. **Run the Installer**:\n   Once the download\
    \ is complete, open the `.msi` file to run the installer.\n\n![image](d2d_images/image016.png)\n\
    \n* Follow the prompts in the Node.js Setup Wizard. The default settings are sufficient\
    \ for most users.\n\n![image](d2d_images/image019.png)\n\n![image](d2d_images/image228.png)\n\
    \nMake sure to check the box that says \"Automatically install the necessary tools\"\
    \ to install additional tools required for native modules, such as Python and\
    \ the Visual Studio Build Tools.\n\n![image](d2d_images/image085.png)\n\n![image](d2d_images/image036.png)\n\
    \n3. **Verify the Installation**:\n   After the installation is complete, open\
    \ a command prompt (you can search for `cmd` in the Start menu).\n\n   Type `node\
    \ -v` and press Enter. This command will display the installed version of Node.js.\n\
    \n![image](d2d_images/image068.png)\n\n   Type `npm -v` and press Enter to check\
    \ the installed version of `npm` (Node Package Manager).\n\n![image](d2d_images/image053.png)\n\
    \n4. **Update npm (Optional)**:\n   Although Node.js comes with `npm` pre-installed,\
    \ it is a good practice to update `npm` to the latest version.\n\n   In the command\
    \ prompt, type `npm install -g npm` and press Enter.\n\n### Installing Node.js\
    \ on macOS\n\n1. **Using the Installer**:\n   Visit the official Node.js website\
    \ at [nodejs.org](https://nodejs.org).\n\n   Download the macOS installer (`.pkg`\
    \ file) for the LTS version.\n\n   Open the downloaded `.pkg` file and follow\
    \ the prompts to install Node.js.\n\n2. **Using Homebrew**:\n   Alternatively,\
    \ you can use Homebrew, a popular package manager for macOS, to install Node.js.\n\
    \n   If you don't have Homebrew installed, open the Terminal and run the following\
    \ command to install it:\n\n```bash\n/bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"\
    \n```\n\n   Once Homebrew is installed, you can install Node.js by running:\n\n\
    ```bash\nbrew install node\n```\n\n![image](d2d_images/image145.png)\n\n* **Verify\
    \ the Installation**:\n   Open the Terminal and type `node -v` to check the installed\
    \ version of Node.js.\n\n   Type `npm -v` to verify the installed version of `npm`.\n\
    \n* **Update npm (Optional)**:\n   To update `npm` to the latest version, run\
    \ the following command in the Terminal:\n\n```bash\nnpm install -g npm\n```\n\
    \n### Installing Node.js on Linux\n\nFOR LINUX USERS, THE installation process\
    \ may vary slightly depending on the distribution you are using. Here are the\
    \ steps for some common distributions:\n\n1. **Debian and Ubuntu**:\n   Open the\
    \ Terminal and run the following commands to install Node.js from the official\
    \ NodeSource repository:\n\n```bash\ncurl -fsSL https://deb.nodesource.com/setup_lts.x\
    \ | sudo -E bash -\nsudo apt-get install -y nodejs\n```\n\n![image](d2d_images/scene_break.png)\n\
    \nTHIS SCRIPT WILL ADD the NodeSource repository and install Node.js along with\
    \ `npm`.\n\n* **CentOS and Fedora**:\n   For CentOS, run the following commands\
    \ to add the NodeSource repository and install Node.js:\n\n```bash\ncurl -fsSL\
    \ https://rpm.nodesource.com/setup_lts.x | sudo bash -\nsudo yum install -y nodejs\n\
    ```\n\n   For Fedora, you can use the same commands as CentOS, but use `dnf` instead\
    \ of `yum`:\n\n```bash\ncurl -fsSL https://rpm.nodesource.com/setup_lts.x | sudo\
    \ bash -\nsudo dnf install -y nodejs\n```\n\n* **Arch Linux**:\n   Open the Terminal\
    \ and run the following command to install Node.js using the package manager:\n\
    \n```bash\nsudo pacman -S nodejs\n```\n\n* **Verify the Installation**:\n   After\
    \ installation, verify the Node.js version by running:\n\n```bash\nnode -v\n```\n\
    \n* **Update npm (Optional)**:\n   To update `npm` to the latest version, run:\n\
    \n```bash\nnpm install -g npm\n```\n\n## 1.5. Setting Up the Environment\n\nVISUAL\
    \ CODE (VS Code) is one of the most popular editors among developers due to its\
    \ lightweight nature, extensive customization, and robust features. Setting up\
    \ your Node.js environment in VS Code will enhance your productivity and make\
    \ coding a pleasant experience.\n\n### Step 1: Installing Visual Code\n\nDOWNLOAD\
    \ VS CODE:\nGo to the [official Visual Code website](https://code.visualstudio.com/).\n\
    \nDownload the appropriate installer for your operating system (Windows, macOS,\
    \ Linux).\n\n### Step 2: Setting Up Your Node.js Project\n\nCreate a Directory:\n\
    Open VS Code. Use the built-in terminal in VS Code (you can open it by pressing\
    \ ``Ctrl+``) to create a new directory for your project:\n\n```bash\nmkdir my-node-project\n\
    cd my-node-project\n```\n\n![image](d2d_images/image122.png)\n\n![image](d2d_images/image221.png)\n\
    \n![image](d2d_images/image037.png)\n\nInitialize a Node.js Project:\nInitialize\
    \ your project by creating a `package.json` file:\n\n```bash\nnpm init\n```\n\n\
    Follow the prompts to enter your project details. You can accept the default values\
    \ by pressing Enter.\n\n![image](d2d_images/image230.png)\n\n### Step 4: Installing\
    \ Extensions in VS Code\n\nTO ENHANCE YOUR NODE development experience, install\
    \ the following extensions:\n\n**ESLint**:\nESLint helps identify and fix code\
    \ quality issues. To install, search for \"ESLint\" in the Extensions view and\
    \ click Install.\n\n![image](d2d_images/image018.png)\n\n**Prettier - Code Formatter**:\n\
    Prettier formats your code consistently. To install, search for \"Prettier\" in\
    \ the Extensions view and click Install.\n\n![image](d2d_images/image042.png)\n\
    \n**Nodemon**:\nNodemon automatically restarts your Node.js application when file\
    \ changes are detected. Although Nodemon is not an extension, you can install\
    \ it globally via `npm`:\n\n```bash\nnpm install -g nodemon\n```\n\n![image](d2d_images/image136.png)\n\
    \n### Step 5: Configuring Your Project\n\nCreating Essential Files:\n* Create\
    \ an `index.js` file in your project directory. This will be the entry point for\
    \ your Node.js application:\n\n```javascript\nconsole.log('Hello, World!');\n\
    ```\n\nSetting Up ESLint:\nInitialize ESLint in your project:\n\n```bash\nnpx\
    \ eslint --init\n```\n\nFollow the prompts to set up your ESLint configuration.\
    \ This will create an `.eslintrc` file in your project directory.\n\n![image](d2d_images/image121.png)\n\
    \n![image](d2d_images/image074.png)\n\nUpdating `package.json`:\nAdd a start script\
    \ to your `package.json` to use Nodemon for running your application:\n\n```json\n\
    \"scripts\": {\n  \"start\": \"nodemon index.js\"\n}\n```\n"
