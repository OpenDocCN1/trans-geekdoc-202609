  trans: "\n\n## 自定义格式定义\n`morgan.format('myFormat', ':method :url :status :res[content-length]\
    \ - :response-time ms')` 这一行定义了一个名为 'myFormat' 的自定义日志格式。该格式记录了 HTTP 方法、URL、响应状态、长度以及响应时间。\n\
    \n### 使用自定义格式\n我们通过将 'myFormat' 传递给 `morgan` 中间件来使用该自定义格式。\n\n### 查看自定义日志\n* 在向服务器发送请求后，你将在控制台中看到按照你的自定义格式格式化的日志：\n\
    \n![image](img/image01.png)\n\n![image](img/image060.png)\n\n## Body-Parser\n\n\
    ### 什么是 Body-Parser？\nBODY-PARSER 是一个用于 `Express.js` 的中间件，它允许你在处理程序之前在中间件中解析传入的请求体，使得正体内容可以通过\
    \ `req.body` 属性访问。这对于处理表单提交、JSON 负载以及发送在 HTTP 请求体中的其他类型的数据特别有用。\n\nBody-Parser\
    \ 简化了从客户端发送的数据提取过程，无论这些是 JSON 格式、URL 编码表单数据或其他格式。这使其成为开发 API 和处理 Web 应用程序中各种类型请求数据的必备工具。\n\
    \n### 为什么使用 Body-Parser？\n* 简化数据处理：从请求体中提取并解析数据，使其易访问。\n* 支持多种格式：可以解析 JSON、URL\
    \ 编码数据和原始数据。\n* 与 Express 集成：与 `Express.js` 无缝集成以处理请求体。\n* 安全性：帮助验证和清理入站数据，以防止\
    \ SQL 注入和 XSS 等常见的安全漏洞。\n\n### 安装 Body-Parser\n要在你的 Node.js 应用中使用 BODY-PARSER，你首先需要使用\
    \ npm 安装它：\n\n```bash\nnpm install body-parser\n```\n\n### Body-Parser 的基础用法\n\
    这里有一个关于如何在 Express 应用中使用 Body-Parser 处理 JSON 和 URL 编码数据的示例示例：\n\n1. 建立 Express\
    \ 应用：\n\n```javascript\nconst express = require('express');\n\nconst bodyParser\
    \ = require('body-parser');\n\nconst app = express();\n\n// 使用 Body-Parser 中间件解析\
    \ JSON 和 URL 编码数据\n\napp.use(bodyParser.json());\n\napp.use(bodyParser.urlencoded({\
    \ extended: true }));\n\n// 定义一个简单的 POST 路由来处理表单数据\n\napp.post('/submit', (req,\
    \ res) => {\n  const { name, email } = req.body;\n  res.send(`Received name: ${name},\
    \ email: ${email}`);\n});\n\nconst PORT = 3000;\n\napp.listen(PORT, () => {\n\
    \  console.log(`Server running at http://localhost:${PORT}/`);\n});\n```\n\n运行以下启动服务器：\n\
    ```bash\nnode server.js\n```\n\n使用 Postman 测试：\n* 创建一个新的 POST 请求。\n* 将 URL 设置为\
    \ `http://localhost:3000/submit`。\n* 在 Body 标签页中，选择 `raw` 和 `JSON`，然后输入：\n```json\n\
    {\n  \"name\": \"John Doe\",\n  \"email\": \"john.doe@example.com\"\n}\n```\n\
    点击 Send。\n\n![image](img/image04.png)\n\n![image](img/scene.png)\n\n### 使用 Body-Parser\
    \ 处理不同的数据格式\nBODY-PARSER 可以配置为处理各种类型的数据。以下是配置 Body-Parser 以处理 JSON、URL 编码和原始数据的示例。\n\
    \n1. JSON 数据：\n`app.use(bodyParser.json());`\n示例\n```json\n{\n  \"name\": \"John\
    \ Doe\",\n  \"email\": \"john.doe@example.com\"\n}\n```\n\n2. URL 编码数据：\n`app.use(bodyParser.urlencoded({\
    \ extended: true }));`\n示例 `name=John+Doe&email=john.doe@example.com`\n\n3. 原始数据：\n\
    `app.use(bodyParser.raw());`\n示例：这是原始数据\n\n4. 文本数据：\n`app.use(bodyParser.text());`\n\
    示例：这是文本数据\n\n### 自定义 Body-Parser\nBODY-PARSER 提供了选项来自定义其行为。例如，你可以限制请求体的大小以防止滥用，或者为\
    \ URL 编码数据配置 `extended` 选项。\n\n带有自定义选项的示例：\n```javascript\nconst express = require('express');\n\
    \nconst bodyParser = require('body-parser');\n\nconst app = express();\n\n// 使用带有自定义选项的\
    \ Body-Parser\napp.use(bodyParser.json({ limit: '10mb' }));\napp.use(bodyParser.urlencoded({\
    \ extended: false, limit: '10mb' }));\n\napp.post('/submit', (req, res) => {\n\
    \  const { name, email } = req.body;\n  res.send(`Received name: ${name}, email:\
    \ ${email}`);\n});\n\nconst PORT = 3000;\n\napp.listen(PORT, () => {\n  console.log(`Server\
    \ running at http://localhost:${PORT}/`);\n});\n```\n* `limit` 选项限制了请求体的最大大小为\
    \ 10MB。\n* `extended` 选项决定了解析 URL 编码数据时使用 `querystring` 库（为 `false` 时）还是 `qs`\
    \ 库（为 `true` 时）。\n\n![image](img/image03.png)\n\n## Helmet\n\n### 什么是 Helmet？\n\
    HELMET 是一个专注于安全性的 `Express.js` 中间件，通过设置各种 HTTP 头部来保护你的应用程序。它旨在通过配置正确的头部来保护你的应用免受一些已知网络漏洞的影响。\n\
    \n### 为什么使用 Helmet？\n* 安全性：提供了一种简单的方法来保护你的应用程序。\n* 简单性：易于实现和配置。\n* 全面：通过启用多个安全头部涵盖多个安全方面。\n\
    * 自定义：允许你根据特定需求单独配置每个头部。\n\n### 安装 Helmet\n要在你的 Node.js 应用中使用 HELMET，你首先需要使用 npm\
    \ 安装它：\n\n```bash\nnpm install helmet\n```\n\n### Helmet 的基础用法\n这里有一个如何在 Express\
    \ 应用中使用 Helmet 的示例示例：\n\n1. 建立 Express 应用：\n\n```javascript\nconst express = require('express');\n\
    \nconst helmet = require('helmet');\n\nconst app = express();\n\n// 使用 Helmet\
    \ 通过设置各种 HTTP 头部来应用\napp.use(helmet());\n\n// 定义一个简单的路由\napp.get('/', (req, res)\
    \ => {\n  res.send('Hello, secure world!');\n});\n\nconst PORT = 3000;\n\napp.listen(PORT,\
    \ () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n});\n\
    ```\n* 引入 Express 和 Helmet：我们引入了 `express` 和 `helmet` 模块。\n* 使用 Helmet 中间件：`app.use(helmet())`\
    \ 行将 Helmet 集成到应用程序中，自动设置各种 HTTP 头部以增强安全性。\n* 定义路由：我们定义了一个简单的路由，访问时会返回 \"Hello,\
    \ secure world!\"。\n* 使用浏览器或 Postman 等工具访问 `http://localhost:3000`。\n* 检查响应头部查看\
    \ Helmet 添加的安全头部。\n\n![image](img/image220.png)\n\n![image](img/image112.png)\n\
    \n### Helmet 设置的头部\nHELMET 设置了多种 HTTP 头部来帮助保护你的应用程序。其中一些关键头部包括：\n\n* 内容安全策略 (CSP)：通过控制加载内容的来源帮助防止\
    \ XSS 攻击。\n* X-DNS-Prefetch-Control：控制 DNS 预取，这可以提高隐私。\n* Expect-CT：有助于检测并防止错误签发的\
    \ SSL 证书的使用。\n\n"
- fmt: "\n- `Strict-Transport-Security` (`HSTS`): Enforces secure (HTTP over SSL/TLS)\
    \ connections to the server.\n- `X-Frame-Options`: Protects against clickjacking\
    \ by controlling whether the site can be framed.\n- `X-Content-Type-Options`:\
    \ Prevents browsers from interpreting files as a different MIME type, reducing\
    \ the risk of drive-by downloads.\n- `X-Permitted-Cross-Domain-Policies`: Controls\
    \ the Adobe Flash and Acrobat cross-domain policies.\n- `Referrer-Policy`: Controls\
    \ the amount of referrer information sent with requests.\n- `Feature-Policy`:\
    \ Allows control over which browser features can be used.\n\n## Customizing Helmet\n\
    \nWhile THE DEFAULT CONFIGURATION of `Helmet` provides a good level of security,\
    \ you might want to customize it to suit your specific needs. You can enable or\
    \ disable specific headers and configure their values.\n\nExample of Custom Configuration:\n\
    \n```javascript\nconst express = require('express');\n\nconst helmet = require('helmet');\n\
    \nconst app = express();\n\n// Custom Helmet configuration\n\napp.use(helmet({\n\
    \  contentSecurityPolicy: {\n    directives: {\n      defaultSrc: [\"'self'\"\
    ],\n      scriptSrc: [\"'self'\", \"'trusted-scripts.com'\"],\n      objectSrc:\
    \ [\"'none'\"],\n      upgradeInsecureRequests: [],\n    },\n  },\n  referrerPolicy:\
    \ { policy: 'no-referrer' },\n  featurePolicy: {\n    features: {\n      fullscreen:\
    \ [\"'self'\"],\n      vibrate: [\"'none'\"],\n    }\n  }\n}));\n\napp.get('/',\
    \ (req, res) => {\n  res.send('Hello, secure world!');\n});\n\nconst PORT = 3000;\n\
    \napp.listen(PORT, () => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n\
    });\n```\n\n- `Content-Security-Policy`: Configures the content security policy\
    \ to allow scripts only from the same origin and from `trusted-scripts.com`, and\
    \ disallows the use of objects.\n- `Referrer-Policy`: Sets the referrer policy\
    \ to `no-referrer`, meaning no referrer information will be sent.\n- `Feature-Policy`:\
    \ Restricts the use of certain browser features to specific sources.\n\n### Practical\
    \ Example: Secure REST API with Helmet\n\nHERE’S A PRACTICAL example of using\
    \ Helmet to secure a REST API:\n\n1. Set Up an Express Application:\n\n```javascript\n\
    const express = require('express');\n\nconst helmet = require('helmet');\n\nconst\
    \ app = express();\n\n// Use Helmet to secure the app by setting various HTTP\
    \ headers\napp.use(helmet());\n\n// Parse JSON request bodies\napp.use(express.json());\n\
    \n// Define a simple API endpoint\napp.get('/api/data', (req, res) => {\n  res.json({\
    \ message: 'Secure data' });\n});\n\nconst PORT = 3000;\n\napp.listen(PORT, ()\
    \ => {\n  console.log(`Server running at http://localhost:${PORT}/`);\n});\n```\n\
    \n–––––––\n\n![image](d2d_images/scene_break.png)\n\n- `Helmet Middleware`: Secures\
    \ the application by setting various HTTP headers.\n- `JSON Parsing Middleware`:\
    \ Parses JSON request bodies using `express.json()`.\n- `API Endpoint`: Defines\
    \ a simple GET endpoint that returns a JSON response.\n\nTesting the API:\n\n\
    - Open your browser or use a tool like Postman to navigate to `http://localhost:3000/api/data`.\n\
    - Check the response headers to see the security headers added by Helmet.\n\n\
    ![image](d2d_images/image161.png)\n\n![image](d2d_images/image156.png)\n\n###\
    \ Creating Custom Middleware\n\nIN THIS COMPREHENSIVE guide, we will build an\
    \ Express.js application from scratch that demonstrates the use of custom middleware.\
    \ This example will include an HTML page for ease of understanding and will cover\
    \ various middleware functionalities such as logging, authentication, error handling,\
    \ rate limiting, and input validation.\n\nWe'll use the following project structure:\n\
    \n![image](d2d_images/image063.png)\ncustom-middleware-app/\n├── node_modules/\n\
    ├── public/\n│   └── index.html\n├── middlewares/\n│   ├── logger.js\n│   ├──\
    \ auth.js\n│   ├── rateLimiter.js\n│   ├── validateInput.js\n│   └── errorHandler.js\n\
    ├── routes/\n│   └── api.js\n├── app.js\n└── package.json\n\nFirst, set up the\
    \ project and install the necessary dependencies.\n\n```bash\nmkdir custom-middleware-app\n\
    cd custom-middleware-app\nnpm init -y\nnpm install express body-parser morgan\n\
    ```\n\n### Step 2: Create the HTML Page\n\nCREATE AN `index.html` file inside\
    \ the `public` directory.\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n  <title>Custom Middleware Example</title>\n</head>\n\
    <body>\n  <h1>Welcome to Custom Middleware</h1>\n  <p>This page demonstrates the\
    \ use of custom middleware in Express.js.</p>\n</body>\n</html>\n```\n\n–––––––\n\
    \n![image](d2d_images/scene_break.png)\n\n### Step 3: Implement Custom Middleware\n\
    \nCREATE MIDDLEWARE for logging, authentication, error handling, rate limiting,\
    \ and input validation.\n\n`middlewares/logger.js`:\n\n```javascript\nmodule.exports\
    \ = (req, next) => {\n  console.log(`${req.method} ${req.url} - ${new Date().toISOString()}`);\n\
    \  next();\n};\n```\n\n`middlewares/auth.js`:\n\n```javascript\nmodule.exports\
    \ = (req, res, next) => {\n  const authHeader = req.headers.authorization;\n \
    \ if (authHeader === 'Bearer secrettoken') {\n    next();\n  } else {\n    res.status(401).json({\
    \ message: 'Unauthorized' });\n  }\n};\n```\n\n`middlewares/errorHandler.js`:\n\
    \n```javascript\nmodule.exports = (err, req, res, next) => {\n  console.error(err.stack);\n\
    \  res.status(500).json({ message: 'Something went wrong!' });\n};\n```\n\n`middlewares/rateLimiter.js`:\n\
    \n```javascript\nconst rateLimit = {};\nmodule.exports = (req, res, next) => {\n\
    \  const userIp = req.ip;\n  const currentTime = Date.now();\n  const timeWindow\
    \ = 60000; // 1 minute\n  const requestLimit = 10;\n\n  if (!rateLimit[userIp])\
    \ {\n    rateLimit[userIp] = [];\n  }\n\n  // Filter requests within the time\
    \ window\n  rateLimit[userIp] = rateLimit[userIp].filter(timestamp => currentTime\
    \ - timestamp < timeWindow);\n\n  if (rateLimit[userIp].length >= requestLimit)\
    \ {\n    res.status(429).json({ message: 'Too many requests, please try again\
    \ later.' });\n  } else {\n    rateLimit[userIp].push(currentTime);\n    next();\n\
    \  }\n};\n```\n\n`middlewares/validateInput.js`:\n\n```javascript\nmodule.exports\
    \ = (req, res, next) => {\n  const { title, description } = req.body;\n  if (!title\
    \ || typeof title !== 'string' || title.trim() === '') {\n    return res.status(400).json({\
    \ message: 'Invalid title' });\n  }\n  if (!description || typeof description\
    \ !== 'string' || description.trim() === '') {\n    return res.status(400).json({\
    \ message: 'Invalid description' });\n  }\n  next();\n};\n```\n\n–––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n### Step 4: Set Up Routes\n\nCREATE AN API ROUTE to demonstrate the use of custom\
    \ middleware.\n\n`routes/api.js`:\n\n```javascript\nconst express = require('express');\n\
    const router = express.Router();\nconst authMiddleware = require('../middlewares/auth');\n\
    const rateLimiterMiddleware = require('../middlewares/rateLimiter');\nconst validateInputMiddleware\
    \ = require('../middlewares/validateInput');\n\n// Protected route with rate limiting\n\
    router.get('/protected', authMiddleware, rateLimiterMiddleware, (req, res) =>\
    \ {\n  res.json({ message: 'This is a protected route' });\n});\n\n// POST /api/resource\
    \ - Create a new resource with input validation\nrouter.post('/resource', validateInputMiddleware,\
    \ (req, res) => {\n  const { title, description } = req.body;\n});\n```\n"
