    # V. SUMMARY


    The maintenance and optimization of mobile communication networks become complex
    with their growth, heterogeneity and unpredictable chaotic dynamics. A large amount
    of data is learned by machine learning and rules, and models are constructed to
    add specific scenarios in the network communication. Classify adapt to new functions
    and parameters for different scenarios, and optimize parameters. The application
    of Machine Learning to Mobile communication systems will bring more new challenges,
    especially in the complex physical environment, there are more problems to be
    overcome, and new needs need to be studied, and the applicable scenarios and feasibility
    of the technology are reasonably analyzed.


