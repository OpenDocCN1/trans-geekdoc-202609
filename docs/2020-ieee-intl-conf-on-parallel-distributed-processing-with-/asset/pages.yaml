    # ### III. CAPACITY ENHANCEMENT


    # #### A. Counters and feature Classification


    The network capacity refers to many users and some conditions are generally managed.
    For example, the LTE network uses a bandwidth of 20MHz, the default RRU hardware
    equipment config the power parameters. The network capacity needs to be enhanced
    in both downlink and uplink respectively [7].


    The corresponding capacity-related counters can be classified by the random forest
    algorithm.


    When the number of users in the cell is growing, the proportion of small packet
    users is getting larger, and the PDCH resources are getting limited, the number
    of downlink schedulers per UTI is limited and the downlink PDCH resource utilization
    rate is decreasing[12][13].


    In this scenario, with the PDCH and PDDS resource rate, the scheduler selects
    a large packet user and reserves PDCH resources for; when scheduling the last
    in the downlink, PDCH resources are allocated to the selected large packet user.
