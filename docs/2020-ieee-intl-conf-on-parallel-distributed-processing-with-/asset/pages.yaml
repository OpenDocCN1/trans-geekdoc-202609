    **Abstract—** The maintenance and optimization of mobile communication networks
    have become more complex with the legacy process especially with the introduction
    of new technologies. A large amount of UEs datasets used for machine learning
    classify the unique scenarios in the communication network. It adapts to new functions
    and parameters for different scenarios and optimizes them. This article presents
    the application of ML (Machine Learning) in mobile communication network capacity
    enhancement and gives the analysis result of feature extraction, clustering, and
    the back-off gradient maintainfall after every event.


    *Keywords—Scenario identification, feature clustering, optimal parameters*


    # I. INTRODUCTION


    Today''s Mobile Telecommunication networks are getting more complex with new technologies
    and services, more network nodes, excessive coverage, unpredictable distribution
    of total network capacity is a key challenge. With traditional network maintenance
    and optimization procedure, it is always challenge to utilize and network features
    with optimal efficiency in different clients and event.


    The key of machine learning is develop through a large amount of UEs datasets,
    learning internal laws and predicting uncertain results by acquired laws. Big
    data of mobile communication is processed using machine learning algorithms to
    build models, classify different scenarios in the communication network, configure
    new features and parameters for different scenarios, and also optimize parameters.


    This paper focuses on the analysis of LTE mobile capacity enhancement based on
    Machine Learning, selects the characteristics and parameters related to random
    forest and statistical indicators for comparison and after implementation, uses
    the KMeans algorithm to cluster applicable scenarios, and also apply regression
    algorithm. The algorithm finds optimal, establishes the result for different scenarios,
    the optimal value of the parameters, and finally realizes the improvement of network
    capacity performance [2].


    # II. PROCESS OF SOLUTION


    There are 2 stages for capacity enhancement in the Mobile Telecommunication network.
    The first step is to set up rules and models developed based on machine learning
    algorithms such as using random forest, clustering with KMeans-algorithms and
    regression with network experience [4]. The second step is real-time parameter
    adjustment optimization on radio access network (RAN) part, such as collecting
    reporting results, making a decision for next action through, and taking action
    for adjusting parameters with the support from reinforcement learning algorithm.
    As network capacity gradually increases, the parameters become convergently [5]
    [6].


    The key of machine learning is develop through a large amount of UEs datasets'
