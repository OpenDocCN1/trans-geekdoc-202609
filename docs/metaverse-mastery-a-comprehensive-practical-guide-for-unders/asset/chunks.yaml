  trans: '


    `ARKit` 和 `ARCore` 的发布使得开发者更容易在移动设备上创建 AR 体验。为了为 iOS 和 Android 创建基于 AR 的应用程序，开发者需要使用
    `ARKit` 或 `ARCore`。得益于平面检测和环境光估计等功能，数字全息可以轻松放置在用户的环境中，这使得全息对终端用户来说更加真实。这两个产品具有相似的功能集（能够检测环境光并将该信息传输到数字全息）。


    开发者使用两个软件开发包为特定硬件编写应用：`ARkit` 和 `ARCore`。iOS 和 Android 设备都可以配合它们使用，但它们都不是硬件。苹果和谷歌的增强现实移动实现不需要你购买单独的设备；如果你当前的移动设备符合
    `ARCore` 或 `ARKit` 的最低技术要求，你就可以使用现有移动设备。


    ## AR 头戴设备


    许多 AR 用户从智能手机开始他们的旅程，但这绝不是体验这项技术的最佳方式。移动设备的物理设计可能会导致沮丧的用户体验。为了使用数字增强，用户必须不断拿着设备，并捕捉真实世界的图像，将数字叠加层应用在其上方。另一个问题是，由于目前移动设备的形状限制，真实与数字世界的结合只能通过一个非常小的窗口（屏幕大小）看到。虚拟现实（VR）应用程序可以受益于头戴式设备。`Microsoft
    HoloLens`、`Meta 2` 和 `Magic Leap` 只是例子。这是我们在 AR 头戴设备上遇到的第一个障碍，它说明了在开发周期中，AR 头戴设备比
    VR 头戴设备落后了多少。


    尽管这三款头显是该领域最著名的设备，但它们还没有成为主流产品。`HoloLens` 目前已上市，但它主要面向企业和公司，而不是个人。`Meta 2` 有开发者套件，但尚未正式发布。截至本文写作，`Magic
    Leap` 的 `Creator Edition` 头戴设备尚未交付给开发者，尽管该公司拥有令人印象的团队和投资者群体（尽管 `Magic Leap` 宣布了
    2018 年发货）。


    带有前置半透明遮目镜的大头带或头盔似乎是 AR 头戴设备最常见的形式。眼镜表面投影了来自头戴设备的图像，在真实世界上创建了数字叠加层。眼镜和光场构成了 `Magic
    Leap One` 的外形，它采用了不同的方法。例如，`HoloLens` 是一个完全自包含的头戴设备，以较低的处理能力换取更大的运动自由度。其他设备（如
    `Meta 2`）依赖桌面 PC 的处理能力，从而限制了你的运动自由。它通过连接的 `Lightpack`（小型可穿戴电脑）驱动其 `Lightwear`
    眼镜，作为两者之间的媒介。


    该组中一个有趣的补充是 `Windows Mixed Reality` 头显。微软对虚拟现实和增强现实（VR 和 AR）的方法表明，这两种技术将会合并。通过前置摄像头而不是半透镜，目前的
    `Windows Mixed Reality` 头显可以作为增强现实体验的穿越通道，类似于 `HoloLens` 和 `Meta 2`。然而，此功能尚不可。目前，`Windows
    Mixed Reality` 头显只是虚拟现实设备，不具备增强现实功能。只有时间才能证明微软对这些设备的命名和定位是否表明它们将用于虚拟现实头戴设备以外的用途。


    当前一代 AR 头戴设备提供了目前可用的最佳体验，但它们只是短期解决方案。到底，没有人知道 AR 的最终外形将会是什么。它可能是像微软 `Windows Mixed
    Reality` 那样的头戴设备，也可能是某种 AR 眼镜。


    ## AR 眼镜


    在不久的未来，体验 AR 的最佳方式可能是通过眼镜。虚拟现实眼镜尚未以 `HoloLens` 或 `Meta 2` 的形式发布，这些目前更像大型遮目镜。然而，`Magic
    Leap One` 仍然是一副较大的眼镜。至于简单的 AR 眼镜，`Google Glass` 和 `Intel Vaunt` 是最著名的例子。另一方面，`Google
    Glass` 不仅仅是一个可穿戴 HUD（平抬头显示）。由于视野区域小、缺乏交互性、缺乏图形能力以及缺乏“放置”功能，数字内容无法“放置”在真实世界中。


    像 `Google Glass` 这样的 HUD 本身很有趣，但它们不被认为是真正的增强现实设备。关于苹果在发布 `ARKit` 后计划生产自己的 AR 眼镜的传闻充斥着，而且首席执行官
    `Tim Cook` 也赞扬 AR 是技术的未来。苹果尚未对此发表声明。目前，访问增强现实内容的唯一途径是通过移动设备或少数现有的增强现实头戴设备之一。


    ## 增强控制器


    AR/MR 控制器面临的挑战通常与 VR 控制器不同，这使得它们与其他类型的控制器区别开来。与大多数虚拟现实头相比，许多 AR 头戴设备允许用户通过视频流或使用半透明遮目镜看到周围的真实世界。这可以缓解传统头戴设备可能的一些问题。当用户能够看到真实世界时，他们就不再到处寻找真实物体了。


    这种改进的视角可能会加剧其他技术问题。由于可以看到真实世界，使用控制器与显示为真实对象的数字全息进行交互可能会很尴尬。这需要开发一种系统，允许用户仅通过手与数字对象交互。


    在 AR 中可以使用多种方法与物体交互。


    ### 触摸


    在移动 AR 实现中，触摸交互是最常用的。AR 在 `Snapchat` 等流行移动应用中的应用将该技术推向主流。在非 AR 设备（如智能手机）上实现增强现实也带来了一些缺点。


    在增强现实（AR）应用程序中使用移动设备输入方法是挑战之一。用户习惯于在移动设备屏幕上进行轻点、滑动和类似的屏幕操作，但这些操作可能不足以控制和导航 AR
    体验。


    在在移动设备上实现增强现实时，不涉及新硬件。相反，他们必须适应人们目前使用移动设备的方式。App 开发者通常负责决定如何在移动设备上处理 AR 输入。用户可以使用视线控制（在下一节介绍）和标准移动交互的组合与
    AR 内容交互。如果用户将视线光标/准星位于 3D 空间中的数字全息上，他们可以点击手机屏幕进行选择，并在后拖动数字全息。


    ### 视线


    在 AR 中使用视线控制很常见，就像在虚拟现实中一样。虽然可以使用手势或控制器点击等交互，但视线控制通常与其他操作结合使用，例如观察环境并关注特定物体。在移动视线控制中，通过跟随视线的网格，可以很容易看到用户的视线将真实世界中的数字全息带到哪里。这个
    `Android` 机器人形象的全息放置在叠加在实际场景上的虚拟网格上，以帮助终端用户可视化其位置。


    '
- fmt: 'It''s not uncommon for users of headset-based AR applications to see what
    they''re about to interact with via a small reticle (also known as a cursor or
    crosshair). As a result, applications can determine where a user''s attention
    lies and where it doesn''t. Cues can be triggered by an app if it needs a user
    to focus on an important object in the scene.


    The current state of gaze controls in augmented reality is adequate, but when
    combined with eye tracking, they will be excellent. Virtual and augmented reality
    (VR and AR) currently require the user to turn his or her entire head in order
    to look at digital objects. Future eye tracking implementations promise to make
    this method of selection much more natural-feeling and intuitive to users. As
    a general rule, when you want to focus on something, you don''t typically turn
    your entire head toward it. You''re more likely to focus on items by moving your
    head and your eyes together. AR headsets will be able to take into account not
    only the position of the head but also the position of the eyes, thanks to eye-tracking.
    Expect the use of gaze tracking in AR to skyrocket when eye tracking goes mainstream.


    ### Keyboard and mouse


    When we imagine the future, it''s easy to imagine a world without keyboards and
    mice, flying through a completely digital landscape and manipulating our digital
    environments with futuristic control input methods. A keyboard or mouse may still
    be the best current method of input for a wide range of tasks. Current AR implementations
    are aware of this. As an example, the `Meta 2` can be used with both a keyboard
    and a mouse.


    The use of a mouse in `Meta 2` is anticipated to become obsolete in the future
    as hand tracking technology improves, but some tasks, such as entering long text,
    may still benefit from using a keyboard. It''s possible, however, that the need
    for a keyboard for input will diminish as voice control becomes more commonplace.


    ### Voice


    Conversing with a machine in a language we understand is one of the most rapidly
    developing emerging technology fields, as demonstrated by its rapid growth. Conversative
    UI and artificial intelligence are quickly finding their place in society, from
    `Amazon Alexa` to `Google Home` to `Siri`. It''s only a matter of time before
    voice and speech become the primary control method for virtual reality and augmented
    reality. It''s easier to learn how to use voice commands than traditional hardware-based
    controls, which have a much steeper learning curve. Virtual reality (VR) applications
    can be controlled using voice commands, removing the need for users to learn a
    new system.


    Both `Google` and `Apple` have built-in digital assistants in their mobile devices,
    so `Magic Leap` has shown off voice control for its AR implementation. As a result,
    Microsoft''s AR headsets, including the `HoloLens` and `Windows Mixed Reality`
    headsets, rely heavily on voice commands.


    Standard controls in Microsoft''s `HoloLens` include a set of speech commands
    that Microsoft hopes will become the norm in AR (such as `select`, `go to start`,
    `teleport`, `go back`, and so on). Custom audio input options can be used by developers
    to create their own voice controls. A dictation option makes it possible for users
    to enter text into apps without having to deal with the awkward digital keyboard
    that many VR and AR apps have.


    Despite the fact that voice will probably never be the only way to input AR applications,
    most AR devices are going to have a big role in voice input in the near future.


    ### Hand tracking


    As one of the main differences between AR and virtual reality, you can see the
    world around you in AR. This includes being able to see your hands, which are
    the most common tools you use to interact with the world around you. In AR, hand
    tracking is much easier and less problematic than in VR because of this visibility.
    The core experience of some AR headsets includes gesture input via hand tracking.
    While most major VR headsets have treated hand tracking as a nice to have but
    not a necessity, hand tracking is a first-class citizen in AR. Hand tracking for
    AR headsets and glasses will likely be like the mouse for traditional two-dimensional
    screens. It is possible to interact with the digital holograms on display in the
    `Meta 2` and `HoloLens` headsets using standard gestures.


    Outside of AR, a company such as `ManoMotion` is attempting to bring gesture analysis
    and recognition into this space. It''s notable for its support of mobile AR, allowing
    developers to add this more "natural" method of interaction via gestures to their
    mobile applications, where a better method of AR input is sorely needed. `Manomotion`


    You may notice that most AR headsets have a problem with tracking your hands when
    they''re outside of your device''s or headset''s line of sight. This is a major
    issue. To put it another way, if you want to use gestures, hand motions, and the
    like, you''ll need to bring your hands up to your face. In the real world, it''s
    not a big deal if you''re able to get around without using your hands in front
    of your face. It''s important to know how to type, use a mouse or a video-game
    controller, and so on. In order to track users'' hands when they are out of sight,
    a separate piece of hardware is required, which defeats the purpose of providing
    friction-free hand tracking in the first place. The ability to track hands outside
    of the line of sight is expected to improve in the next generation of AR headsets.


    ### Motion controllers


    `HoloLens Clicker`, a device designed to allow users to click and scroll with
    minimal hand motion as a replacement for the `airtap` gesture, is one of the simple
    peripherals included in headsets like Microsoft''s `HoloLens`.


    Natural non-hardware controls like voice and gestures and full-blown motion controllers
    are bridged by simple controllers like the `Clicker`. For example, users can select
    a hologram by glancing at it and clicking it, or scroll by clicking and dragging
    the `Clicker` and then rotating it to the desired position by pressing the button
    and holding it. While the `Clicker` doesn''t address all of these issues, it''s
    still an improvement. You don''t have to keep your hands within the headset''s
    line of sight to select items when using it casually.


    Higher-end devices include Microsoft''s motion controllers for its current generation
    of Mixed Reality headsets or Magic Leap''s `"Control` controller with six degrees
    of freedom. AR''s motion controllers are likely to be very similar to VR''s. Similar
    to what we''ve seen with VR motion controllers, we can expect AR motion controllers
    to try to replicate the natural feel of using our hands and gestures.


    For example, using motion controllers in augmented reality (AR) could allow for
    additional hologram selection and movement options that gestures alone cannot.
    Compared to VR, there are currently fewer controller options for augmented reality.
    VR has a leg up on consumer devices, whereas AR has a lot of work to do in terms
    of hardware. There are, however, some patterns that can be discerned. The goal
    of augmented reality (AR) is to bring the digital and physical worlds together.
    Making the connection between the physical environment and digital content as
    seamless as possible will be the most critical step in the process. Create that
    frictionless relationship with users by using the least intrusive hardware solutions
    (such as hand tracking or voice input) and focusing on natural user interaction.


    Touch, gaze, voice, and hand tracking are all likely to be used to interact with
    your AR holograms in the near future.


    ## THE CURRENT ISSUES WITH AUGMENTED REALITY

