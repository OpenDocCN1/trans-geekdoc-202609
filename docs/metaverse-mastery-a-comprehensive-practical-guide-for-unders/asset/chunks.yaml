    微软可能想朝着那个方向发展，但其目前提供的头显设备尚未具备这种能力。然而，微软的 `Mixed Reality` 平台包含了硬件制造商可以使用的规范，用于创建自己的
    `Windows Mixed Reality Headsets`，因此它本身并不是一个特定的硬件。同样，在本章稍后讨论的 `Google Cardboard`
    其工作原理也类似。（`HTC Vive` 和 `Oculus Rift` 在某种意义上可以比苹果，因为每家制造商都创建并销售自己的头显设备硬件，并控制产品的所有方面。）


    另一方面，微软仅对 `Windows Mixed Reality` 软件规范拥有控制权；不需要创建自己的硬件。只要遵循微软的指南，第三方制造商就可以自由设计和营销他们自己的
    `Windows Mixed Reality` 头显设备。公司的增强现实头显设备 `Microsoft HoloLens` 在技术上也是 `Windows
    Mixed Reality` 平台的一部分。人们可能会在这里感到混淆。当在本节中谈到 `Windows Mixed Reality` 时，我通常指的是公司的系列沉浸式虚拟现实头显设备。`Microsoft
    HoloLens` 是我在讨论该话题时经常提到的设备之一。


    在没有统一标准可以使用的情况下，评估 `Windows Mixed Reality` VR 头显设备时很难进行同类比较。`Microsoft Windows
    Mixed Reality` 头显设备的基准规范可能与例如 `HP Windows Mixed Reality` 头显设备不同。因此，大多数 `Windows
    Mixed Reality` VR 头显设备往往处于 VR 范畴的高端。


    `PlayStation VR` 是视频游戏机制造商对虚拟现实的解读。为了使用 `PlayStation VR`，你不需要 `PC`，但你需要一台 `PlayStation`
    游戏机。它易于使用、价格实惠且游戏选择丰富，但评论人员对缺乏空间级体验、控制器性能不足以及与高端头显相比单眼分辨率较低等有意见。


    说某一种体验比另一种好并不一定如此。两者都有自己独特的优缺点。如果你想要最强大或最具沉浸感的 VR 体验，外部供电的“桌面”VR 体验是一个很好的选择。如果你对图像保真度不是那么在意，并且需要在戴着头显时移动，那么移动
    VR 头显可能更适合你。记住，这只是对第一代 VR 设备的评估。明年一两年内将发布高端设备，它们将消除对外部硬件电源的需求，或者至少在第二代体验中摆脱电线。如果用户能以此方式从机器断开连接，这将是让虚拟现实更普及的一一步。


    # 虚拟现实的特性


    除了价格和头显设计外，每种制造商都在为其提供的 VR 体验采取各种方法。以下章节将讨论一些最重要的 VR 特性。


    ### 空间级与固定体验


    通过空间级（Room-scale），用户的真实移动会被追踪到虚拟环境中，允许他们在 VR 体验的区域内自由漫游。为了跟踪用户在三维空间中的移动，第一代 VR
    头显除了头显本身，还需要外部传感器或摄像头。你想近距离观察鱼群吗？在虚拟太空船的地板上追逐你的机器人狗吗？有什么比在米开朗基罗的大卫像的 3D 复制品中走来学习学习更好的方法呢？如果你的现实物理空间允许，你就可以在空间级体验中做这些事情。


    使用向外跟踪（inside-out tracking）的虚拟现实设备正在迅速取代需要外部设备提供全房间体验的旧型号。相比之下，固定体验（stationary
    experience）正如其名：一种旨在让用户在大部分时间内保持坐姿或站立的 VR 体验。空间级 VR 体验目前仅通过高端 VR 头显（如 `Vive`、`Rift`
    或 `WinMR` 头显）可行，而不是基于移动的头显。


    用户在空间级虚拟现实体验中感到更加投入，因为他们的物理动作反映在虚拟世界中。走过虚拟房间就像走过真实的房间一样简单。当她需要从桌下拿东西时，她只需要蹲下并伸出手即可。在固定体验中使用
    `joystick` 或类似的硬件来完成相同的事情会损害体验并使其降低沉浸感。允许物理移动的虚拟现实 (`VR`) 体验对于让体验感觉更“真实”起了很大作用。


    在空间级下工作的缺点有很多。如果你想在虚拟现实中行走而不撞到物理障碍物，你就需要大量的开放地板空间来进行空间级体验。我们大多数人无法负担得起家中的整个房间留给虚拟现实设置，但开发者可以使用各种技巧来规避这一限制。


    防止用户撞到门和墙的现实物理障碍必须包含在空间级数字体验中，同样还有显示物理世界边界的边界。


    许多空间级 VR 体验还要求用户旅行超过其物理空间所承受的距离。在大多数情况下，对于那些希望在坐着时进行旅行的人来说，有一个简单的选择。她所有的固定体验都必须发生在单个位置，或者使用不同的方法进行移动，因为她在这些体验期间无法进行物理移动（例如，使用
    `controller` 移动视频游戏中的角色）。在涉及到空间级体验时，面临的是另一组问题。用户现在可以在虚拟世界中移动，但仅限于用户独特的物理配置所允许的范围。


    在虚拟现实中，某些用户可能走 20 英尺远。其他用户的物理 VR 区域可能受到限制，只有 7 英尺的模拟行走空间。VR 开发者现在必须就如何允许用户在物理和虚拟环境中移动做出一些艰难的决定。他们必须在几种不同的方法之间做出选择。


    ### 向外跟踪


    目前，只有高端消费级头显可以提供真实的空间级模拟。这些高端头显通常需要与 `computer` 的有线连接。用户在房间里移动时被迫跨越电线。头显中图像的显示以及头显在现实世界中的跟踪都需要布线。


    在第二代虚拟现实头显中，制造商正在寻找消除对有线显示的需求。与此同时，`DisplayLink` 和 `TPCast` 等公司正在研究在没有有线连接的情况下向头显流传输视频。


