  trans: '

    眼动追踪的一些潜在优势包括增加虚拟形象的表达力、提高项目选择的速度和准确性，以及通过注点渲染实现极高效率的图形处理。未来头戴设备可能会包含眼动追踪功能，但大多数头戴设备制造商不太可能这样做。几乎可以肯定，这一功能将在下一代或下下
    VR 头戴设备中包含。其利大于其弊。在目前，虚拟现实技术的下一个大跨越将由诸如 `Tobii` 和 `7Invensun` 等第三方公司提供。


    ### 社交/通信


    尽管已经发布了许多用于 VR 的社交应用，但社交互动仍然感觉像是 VR 缺失的功能。像 Against Gravity 开发的 `Rec Room` 等应用非常擅长在“纯社交”应用和游戏之间找到恰好的平衡，并强制用户参与社交互动。`Rec
    Room` 通过强制用户与其他用户玩游戏，减少了在虚拟现实中遇到陌生人的尴尬感。


    像 `Pluto VR` 这样的应用允许用户以不受限于特定游戏的方式在 VR 中连接。`Pluto` 能够通过任何 VR 应用与其他 VR 用户进行通信。`Pluto`
    可以作为覆盖层运行在你当前的 VR 体验之上，将任何 VR 体验变成结识新人的地方。另一方面，`Pluto` 的创建者认为它并不是社交应用。正如 `Pluto
    VR` 创始人 `Forest Gibson` 所说：“我们不是一个社交应用。我们认为自己是一个直接通信应用，”该公司表示。


    你可以使用任何虚拟现实应用的同时在 `Pluto` 中与朋友聊天。当你处于虚拟现实环境中时，他们会以悬浮虚拟的形式出现。无论你选择打开哪些应用，你朋友的 `Pluto`
    虚拟形象一直都在。


    在虚拟现实的未来，社交互动和通信将发挥重要作用。头戴设备制造商可能会找到鼓励这种互动的方法，但他们无法独立解决这个问题。虚拟现实中社交互动的方向将必须由软件开发者决定。


    **记住：** 在未来几年内，社交 VR 预计将大幅提高普及。VR 软件开发者在不久的将来将继续致力于社交互动。


    ## 评估增强现实的未来


    第二代虚拟现实（VR）设备大部分将于 2018 年和 2019 年发布，但大多数增强现实（AR）硬件设备尚未首次面向消费者大规模发布。为了确保在产品向大众发布之前建立市场，许多设备仍以“开发者预览”模式发布。此外，一些公司仅接受其即将推出的增强现实硬件的预订，这些设备直到今年晚些时候才能购买。


    在更大规模的推广和 AR 头戴设备的发布之前，无法对 AR 的潜在硬件采用情况做出准确评估。AR 头戴设备制造商可能仍在尝试如何让 AR 被更广泛的众接触。


    本节的信息基于我们已经对 AR 潜在用途的了解。我很好奇看到围绕 AR 的炒作是否有所根据，以及这对未来意味着什么，因为大部分 AR 仍处于“炒作”阶段。最后，我提到了你作为内容创作者或消费者可以对未来增强现实所期待的内容。


    ## 增强现实的近未来变化


    我们无法知道近未来 AR 将变成什么。AR 市场上存在大量的推测和可能的未来产品，这既令人兴奋又令人沮丧。AR 市场预测既是一门艺术也是一门科学；需要一些研究和猜测才能知道哪些应该认真对待，哪些应该忽略。


    AR 市场可能很难分析。要理清所有的预测和承诺是非常困难的。关注行业和潜在的新产品一直是一个好主意，但不要被谣言和推测分散了注意力。专注于目前提供的硬件和软件将允许你消除大量的无关信息。


    ### 评估市场


    未来的增强现实应用最可能分为两类：主流移动和企业级。这些应用可以在各种硬件平台上运行，但最可能以头戴设备或眼镜的形式出现。此外，大多数用户必须适应 AR 的新范式。作为一种对消费者来说具有显著学习曲线的新技术的例子，可以考虑智能手机。客户必须在几年内缓慢适应这种新的形式。。事实上，从大
    2D 屏幕到更小的 2D 屏幕的转变本质上是同一件事。尽管许多以前从未用过触摸屏设备，但他们对如何使用它至少有一定的了解。


    在与我们周围的世界进行交互时，AR 是一种全新的方法。即使明天发布了廉价的大众消费 AR 设备，消费者也需要时间适应这种消费内容的新方式。制造商和消费者之间尚未就最佳实践或标准化交互达成共识。对于
    AR，我们在电脑或移动设备上理所当然的许多事情（点击和拖拽、复制、粘贴）仍在完善中。


    由于陡峭的学习曲线以及消费者硬件和软件的缺乏，面向公众的 AR 头戴设备还有很长的路。很容易想象，除非新的竞争对手（如 `Google` 或 `Apple`）意外加入竞争，否则
    AR 头戴设备硬件的大规模采用至少还需要二到四年。


    有头戴 AR 未来将被采用的鼓舞信号。随着 `Apple` 和 `Google` 引入 `ARKit` 和 `ARCore`，大众现在可以第一次尝试增强现实。移动设备上的
    AR 可能并不完美，但这种早期的引入将有助于消费者开始 AR 学习曲线。当大众市场 AR 头戴设备推出时，移动设备上需要克服的心理障碍将小得多。


    AR 正在商业界迅速普及，特别是在少数利基领域。AR 可能很快被工业领域采纳。尽管工业应用广泛，但许多应用重点是减少生产时间和错误。对于普通消费者来说，`HoloLens`
    或 `Meta 2` 现在可能贵得无法接受，但在工业环境背景下，即使工人生产率小幅增加也能很快收回成本。


    # 第 10 章


    # WEB 3.0：它将如何影响金融领域？


    互联网即将经历一场重大变革。开放的数据格式和软件将有助于这场革命，此外人工智能和机器学习的指数级增长，以及区块链技术的快速发展也是如此动力。来自 Web 3.0
    的问候，这是第三代互联网服务以及 Web 演变的下一个阶段！


    Web 3.0 被认为将增加一个更智能、连接更紧密的互联网。语义网技术旨在建立一个能够理解和解释数据及知识的系统。我们工作和协作的方式将被 Web 3.0（即将到来的
    Web 重设计）所改变。富数据的 `IoT`（或物联网）将在这种向动态智能网络和基础设施的转型中诞生。这种空间 Web 执行摘要中存在的数字信息将模糊虚拟与现实世界之间的边界。


