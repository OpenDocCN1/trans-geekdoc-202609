- fmt: '

    Some of the potential benefits of eye-tracking include an increase in the expressiveness
    of avatars, improved item selection speed and accuracy as well as vastly more
    efficient graphics via foveated rendering. It''s possible that headsets will include
    eye-tracking in the future, but it''s unlikely that most headset manufacturers
    will do so. It''s almost a given that this feature will be included in VR headsets
    in the next generation or two. The benefits outweigh the drawbacks. The next big
    step in virtual reality technology will be provided by third-party companies such
    as `Tobii` and `7Invensun`, for the time being.


    ### Social/communication


    While many social apps have been released for VR, social interaction still feels
    like VR''s missing feature. Apps such as Against Gravity''s `Rec Room` are excellent
    at finding the right balance between a "purely social" app and a game and force
    its users to engage in social interactions. `Rec Room` reduces the awkwardness
    of meeting strangers in virtual reality by forcing users to play games with other
    users.


    Apps like `Pluto VR` allow users to connect in VR in ways that aren''t tied to
    a specific game. `Pluto` is able to communicate with other VR users via any VR
    app. `Pluto` can turn any VR experience into a place where you can meet new people
    by running as an overlay on top of your current VR experience. `Pluto`, on the
    other hand, isn''t considered a social app by its creators. In the words of `Pluto
    VR` co-founder `Forest Gibson`: "We are not a social application. "We see ourselves
    as a direct communication app," the company says.


    You can chat with your friends in `Pluto` while using any virtual reality app.
    When you''re in a virtual reality environment, they appear as floating avatars
    to chat. The `Pluto` avatars of your friends will remain with you regardless of
    which apps you choose to open.


    In the future of virtual reality, social interaction and communication will play
    a significant role. It''s possible that headset manufacturers can come up with
    ways to encourage this kind of interaction, but they won''t be able to solve the
    issue on their own. The direction of social interaction in virtual reality will
    have to be determined by software developers.


    **REMEMBER:** Within the next few years, social VR is expected to see a significant
    increase in popularity. VR software developers will continue to work on social
    interaction in the near future.


    ## ASSESSING THE FUTURE OF AUGMENTED REALITY


    Much of the second generation of virtual reality (VR) devices will be released
    in 2018 and 2019, but most augmented reality (AR) hardware devices have yet to
    see their first mass consumer release. To ensure that a market is established
    before a product is released to the general public, many devices are still released
    in "developer preview" mode. Additionally, some companies are only accepting preorders
    for their upcoming augmented reality hardware, which will not be available for
    purchase until later this year.


    No accurate assessment of the potential hardware adoption of AR can be made until
    larger-scale rollouts, and consumer releases of AR headsets have begun. The manufacturers
    of AR headsets are likely still experimenting with how to make AR accessible to
    a wider audience.


    The information in this section is based on what we already know about the potential
    uses of AR. I''m curious to see if the hype surrounding AR is warranted and what
    that means for the future, as much of AR is still in the "hype" phase. Finally,
    I touch on what you, as a content creator or a consumer, can expect from augmented
    reality in the future.


    ## THE NEAR-FUTURE CHANGES IN AUGMENTED REALITY


    We can''t know what AR will look like in the near future. A wide range of speculative
    and probable future products exists in the AR market, making it both exciting
    and frustrating. AR market forecasting is an art as well as a science; it takes
    some research and guesswork to know what to take seriously and what to disregard.


    The AR market can be a difficult one to analyze. It''s going to be difficult to
    sort through all the predictions and promises. Maintaining an eye on the industry
    and potential new products is always a good idea, but don''t get distracted by
    rumors and speculation. Focusing on currently available hardware and software
    will allow you to eliminate a great deal of irrelevant information.


    ### Evaluating the market


    Future augmented reality applications will most likely fall into two categories:
    mainstream mobile and enterprise. These are capable of running on a variety of
    hardware platforms but are most likely to take the form of a headset or eyewear.
    In addition, most users must get used to a new paradigm with AR. As an example
    of a new technology that came with a significant learning curve for consumers,
    consider smartphones. Customers had to adjust to this new form factor slowly over
    several years. As it was, the transition from a large 2D screen to an even smaller
    2D screen was essentially the same thing. Despite the fact that many people had
    never used a touchscreen device before, they had at least some familiarity with
    how to use one.


    When it comes to interacting with the world around us, AR is an entirely new approach.
    Consumers would need time to get used to the new way of consuming content even
    if an inexpensive mass-consumer AR device were released tomorrow. They haven''t
    been able to agree on the best practices or standardized interactions between
    manufacturers and consumers. For AR, many of the things we take for granted on
    our computers or mobile devices (click and drag, copy, paste) are still being
    worked out.


    AR headsets for the general public are still a long way off because of the steep
    learning curve and the lack of consumer hardware and software. It''s easy to imagine
    mass-market adoption of AR headset hardware being at least two to four years away
    unless a new competitor (such as `Google` or `Apple`) enters the fray unexpectedly.


    There are encouraging signs that headset AR will be adopted in the future. With
    the introduction of `ARKit` and `ARCore` by `Apple` and `Google`, the general
    public can now experiment with augmented reality for the first time. AR on mobile
    devices may not be perfect, but this early introduction will go a long way toward
    starting consumers on the AR learning curve. Mobile devices There will be a much
    smaller mental barrier to overcome when a mass-market AR headset is introduced.


    AR is rapidly gaining traction in the business world, particularly in a few niches.
    AR could be quickly adopted in the industrial sector. Despite the wide range of
    industrial applications, many focus on reducing production time and errors. A
    `HoloLens` or `Meta 2` may be prohibitively expensive for the average consumer
    right now, but in the context of an industrial setting, even a small increase
    in worker productivity can quickly pay for itself.


    # CHAPTER 10


    # WEB 3.0: HOW WILL IT IMPACT THE FINANCIAL SECTOR?


    The Internet is about to undergo a major transformation. Data formats and software
    that are open will help this revolution along with the exponential growth of artificial
    intelligence and machine learning, as well as the rapid development of blockchain
    technology. Greetings from Web 3.0, the third generation of internet services
    and the next stage in the evolution of the web!


    Web 3.0 is believed to add a more intelligent and connected internet. Semantic
    web technology aims to build a system that can understand and interpret data and
    knowledge. How we work and collaborate will be transformed by Web 3.0, the upcoming
    redesign of the web. An `IoT` (or Internet of Things) rich in data will be born
    out of this transformation into a dynamic smart web and infrastructure. There
    will be digital information in this spatial web Executive summary that will blur
    the boundaries between the virtual and the real world.

