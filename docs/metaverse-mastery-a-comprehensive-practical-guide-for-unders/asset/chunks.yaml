    `Apecoin` 持有者的游戏和其他服务。


    Otherside 是由 Yuga Labs 创建的元宇宙游戏使用 `Apecoin` 作为其原生代币，这就是为什么 `Bored Apes Yacht Club`
    代币如此流行的原因。据《财富》报道，Otherside 代币持有者最近有机会在 Yuba Labs 的虚拟土地销售中购买地块，这为公司赚了 3.2 亿美元。


    持有者购买了 55,000 个“Otherdeeds”，其中 45,000 个卖给了 Yuba Labs NFT 所有者和项目开发者等第三方。由于这次销售，以太坊的“gas
    费用”——每个用户在以太坊上进行交易时必须支付的费用——急剧增加。


    根据 Coin Telegraph 的报道，`Otherdeeds` 铸造过程的问题导致 `apecoin` 价格大幅下降，需求大幅减少。自销售宣布以来，`APE`
    的价格已从 26 美元跌到 3.49 美元。


    为了提高 `APE` 的价格，它正在被从流通中撤回。目前无法得知这是否有效。如果项目成功，通过以目前的廉价价格购买 `APE` 可能会赚很多钱。如果项目失败，`apecoin`
    将一文不值。


