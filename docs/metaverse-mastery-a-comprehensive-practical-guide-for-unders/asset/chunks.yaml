- fmt: '

    Outside-in tracking systems for the `Vive` and the `Rift` are currently constrained
    by the fact that the headsets and controllers are tracked by an external device.
    Outside of the headset, additional hardware is placed around the room where the
    user will move around while in VR space (called `sensors` or `lighthouses` for
    `Rift` and `Vive`, respectively). Unlike the headset, these sensors are not part
    of it. In 3D space, their placement around the room allows for extremely accurate
    tracking of the user''s headset and controller, but users are restricted to movement
    within the sensor''s view. Tracking is lost when the user leaves that area.


    With inside-out tracking, there is no need for external tracking sensors because
    they are built into the headset. In order to coordinate the user''s movement in
    virtual reality, the headset must interpret depth and acceleration cues from the
    real-world environment. Inside-out tracking is currently used by `Windows Mixed
    Reality` headsets.


    A "holy grail" for virtual reality, inside-out tracking removes the need for external
    sensors, allowing the user to roam freely. However, it has a price, just like
    any other technological decision. Internal tracking is currently less accurate
    and suffers from other drawbacks, such as losing track of controllers if they
    travel too far out of the headset''s field of vision. Second-generation headsets,
    on the other hand, use inside-out tracking to improve physical movement in virtual
    reality. Even with inside-out tracking, defining a virtual reality "playable"
    space may still be necessary. You''ll still need a way to tell where you can and
    can''t go in the area. Inside-out tracking is a big leap forward for the next
    generation of virtual reality headsets because it eliminates the need for external
    sensors.


    First-generation VR headsets still require a computer or external sensors to operate,
    but companies are finding creative ways to overcome these limitations. The `VOID`,
    for example, has implemented its own innovative solutions that provide a glimpse
    of what a fully self-contained VR headset could offer in terms of experience.
    They call it "hyper-reality," and it allows people to interact with digital elements
    in a physical way.


    The `VOID`''s backpack VR system is the company''s technological lynchpin. By
    mapping out entire warehouses of physical space and overlaying them with an exact
    digital representation of the physical space, the `VOID` is able to create a one-to-one
    digital representation of the physical space. Numerous new options now become
    available as a result of this. The `VOID` can create a digital door dripping with
    slime and vines in place of a plain real-world door. In the digital world, what
    might appear to be a bland gray box can be transformed into an evocative oil lamp
    that guides the user through unfamiliar territory.


    The `VOID`''s current backpack design is unlikely to succeed on a mass consumer
    scale. It''s cumbersome, expensive, and probably too complex for a large audience.
    This isn''t necessarily a bad thing, as it provides a taste of what immersive
    virtual reality could be like if cords and cables were removed. Both the `HTC
    Vive Focus` (which is already available in China) and `Oculus`s upcoming `Santa
    Cruz` developer kits appear to be gearing up to ship wireless headsets as early
    as 2018.


    ### Haptic feedback


    Virtual reality controllers already include haptic feedback, which is the sense
    of touch designed to convey information to the user. Rumble/vibration can be used
    to convey contextual information to users of `Xbox One`, `HTC Vive Wands`, and
    `Oculus Touch` controllers. You''re about to grab something. You''re putting your
    finger on a switch. You''ve shut a door behind you. But the feedback these controllers
    offer is rather limited. " Using these devices, you get the same sensation as
    if your phone vibrates when you get a notification.


    If the industry wants to make virtual reality feels as real as the real world
    while inside it, haptics must be taken a step further than it has so far been.
    Touch in virtual reality is a problem that many companies are trying to solve.


    `Go Touch VR` has created a VR touch system that can be worn on one or more fingers
    in order to simulate physical touch in virtual reality (VR). In essence, the `Go
    Touch VR` is nothing more than a pressure pad that you wear on the tips of your
    fingers. As the company `Go Touch VR` claims, users will have the sensation of
    holding onto an actual object in the virtual world. Some other companies, such
    as `Tactical Haptics`, are attempting to fix the controller''s haptic feedback
    issue. They claim to be able to simulate the types of friction forces you''d feel
    when interacting with physical objects by using sliding plates in the surface
    handle of their `Reactive Grip` controller. It is common to feel your tennis racquet
    push against your hand when making a swing.


    You''ll feel more resistance against your hand when moving heavy objects than
    moving light ones. To paint by hand, you''d feel the brush drag against your hand
    as if it were across canvas. These scenarios, according to `Tactical Haptics`,
    can be accurately simulated in a way that current controllers cannot. Companies
    like `HaptX` and `BHaptics` are developing haptic gloves, vests and exoskeletons.
    The `TactSuit` is currently being developed by `BHaptics`. It uses eccentric mass
    vibration motors to disperse the vibrations across the wearer''s face, vest front
    and back, and sleeves. With this technology, `BHaptics` claims that users can
    "feel" explosions and weapon recoils as well.


    With its `HaptX` platform, `HaptX` is one of the companies experimenting with
    haptics in virtual reality to the fullest extent. With the help of `HaptX`''s
    smart textiles, you will be able to perceive the texture, temperature, and form
    of objects. At the moment, it''s working on a haptic prototype to give virtual
    reality (VR) users realistic touch and force feedback. Microfluidic air channels
    embedded in the textile push against a user''s skin, allowing for force feedback
    that can be transmitted to the wearer. When compared to other haptic devices,
    `HaptX` claims that its use of technology provides a far superior experience.
    If combined with virtual reality, `HaptX`''s system takes users a step closer
    to immersive virtual reality.


    ### Audio


    In order to replicate reality as closely as possible, virtual reality (VR) must
    use other senses besides sight and touch. 3D audio, on the other hand, is ready
    to take the world by storm. Along with visual cues, it is possible to use audio
    cues to guide users through an online experience. A sound''s 3D direction of arrival,
    general distance to the source, and so on are all discernible to the human ear.
    An audio experience must be replicated in order for a user to feel as if she''s
    actually listening to it in the real world. It has been possible to create a 3D
    audio simulation for some time, but this was usually done as a quick fix. 3D audio
    has found a market that can help it advance with the rise of VR (and vice versa).

