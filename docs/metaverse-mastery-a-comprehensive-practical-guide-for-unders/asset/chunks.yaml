    Similarly, technological waves experience peaks and troughs before they are adopted
    by the general public. The `Gartner Hype Cycle`, a representation of how expectations
    around transformative technologies play out upon their release, was proposed by
    the information technology research firm `Gartner`. When a technology is first
    introduced, the `Gartner Hype Cycle` can help predict how quickly it will be adopted
    (or not). Pre-2007, the markets for the Internet (following the dot-com crash)
    and mobile phones experienced similar (if not identical) ups and downs.


    Early proofs of concept and media attention serve as an `Innovation Trigger` in
    the early stages of a technology''s development.


    The next peak is the `peak of overestimation`. As a result of the early successes
    and positive publicity, businesses have higher hopes for the technology than it
    is capable of delivering. The `Trough of Disillusionment` that follows occurs
    when actual implementations of the technology fall short of the high expectations
    set by the initial `Innovation Trigger` and media buzz. There are many technologies
    that fail in the `Trough of Disillusionment` and never live up to their initial
    promise.


    After weathering the `Trough of Disillusionment`, second- and third-generation
    products begin to appear, and the technology and its uses are better understood;
    those technologies reach the `Slope of Enlightenment`. Early adopters who are
    able to see through the trough with their ideas and executions intact often reap
    the benefits of mainstream adoption.


    Eventually, we arrive at the `Plateau of Productivity`, where companies that have
    weathered the turbulence of the hype cycle can reap the benefits of their early
    adoption. You can make better decisions about `VR` and `AR` by knowing where they
    are in the cycle. Consider whether or not now is the right time for your company
    to begin implementing these new technologies. Is everything ready to go, or should
    you wait a few more years before launching?


    `VR`, according to `Gartner`, will reach mass adoption in two to five years, having
    just emerged from the "Trough of Disillusionment," according to `Gartner`. The
    adoption of `AR`, on the other hand, is conservatively estimated by `Gartner`
    to be five to ten years away due to `AR` currently being in the `Trough of Disillusionment`.


    It may sound like an ominous place, but the `Trough of Disillusionment` is a necessary
    phase for technology to pass through. Before it reaches the hands of consumers,
    new technology must undergo a rigorous process of establishing its identity and
    determining its place in the world. Manufacturers must determine which issues
    it effectively resolves and which issues it fails to resolve effectively. That
    can take a lot of trial and error to discover.


    Adolescence is a good time for `AR` as a mass-market consumer product. It takes
    time for manufacturers and developers to figure out what form factor it should
    exist in, what problems it can solve, and how it can best solve them. Manufacturers
    of any emerging technology, including virtual reality and augmented reality, should
    be wary of rushing a product to market before these questions have been answered,
    as this can often lead to more problems than it solves. This `Hype Cycle` report
    for virtual and augmented reality was released by `Gartner` less than a month
    after `Apple`''s `ARKit` announcement and a full month before `Google`''s `ARCore`
    was announced. `ARKit` and `ARCore`''s release could be argued to have sparked
    mainstream adoption by virtue of their large installed base. That, however, seems
    a tad dishonest. Simply having a base installed does not guarantee widespread
    adoption (though it is a large piece of the puzzle).


    When using technology is as easy as opening your web browser, checking your email
    on your mobile device, or sending a text message to a friend, it has truly entered
    the mainstream. It has the the the.


    # CHAPTER 7


    ## EXPLORING THE CURRENT STATE OF VIRTUAL REALITY


    Being a part of virtual reality now when technology is constantly evolving is
    both exciting. It''s critical to pause and assess where things stand. Within the
    next year or two, many industry insiders predict that `VR` will become widely
    used. Many of the issues that exist today will be resolved by then.


    ## THE AVAILABLE FORM FACTORS OF VIRTUAL REALITY


    Although there are a number of virtual reality headsets, they all appear to share
    the same basic design. `VR` experiences may indeed benefit from this form factor,
    but it could also be a sign of a lack of innovation in mass consumer devices.
    For the time being, the majority of `VR` systems are implemented as head-mounted
    displays, but each company has developed its own design for how that factor should
    appear.


    The book''s main focus is on the consumer head-mounted displays (`HMDs`) with
    the largest user base in order to keep the book''s focus manageable and concise.
    `Oculus Rift`, `HTC Vive`, `Windows Mixed Reality`, `Samsung Gear VR`, `PlayStation
    VR`, `Google Daydream` and `Cardboard` are the only ones on the market at the
    time of writing. At the moment, these are the most widely available first-generation
    `VR` headsets, but that may change in the future. Many of the evaluation criteria
    I include here are likely to be shared by any new headset that comes along. The
    same criteria can be applied to many of the upcoming second-generation devices.
    You''ll be able to evaluate any new hardware that comes out if you''re familiar
    with the various options, benefits, and drawbacks of different hardware implementations.


    `HTC Vive` and `Oculus Rift` are currently at the top of our VR experience graph
    for consumers. It is without a doubt that they provide some of the most immersive
    virtual reality experiences to date. The headsets themselves, as well as the separate
    hardware needed to power them, aren''t free.

