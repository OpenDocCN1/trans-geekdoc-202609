    Applications ability to move across large areas in VR may face logistical challenges
    in the future. Some users may experience simulator sickness even if they use some
    of the previously mentioned solutions to move in VR in a way that corresponds
    to physical motion. Users may not want to walk long distances, even if Omni-directional
    treadmills could be guaranteed for every user to track their movement. For people
    with limited mobility, walking long distances may be impossible. Hardware and
    software developers must work together to find a solution to this problem. Furthermore,
    options exist.


    ### Health effects


    The greatest unknown here is the impact on one''s health. Using `Oculus Rift`
    while pregnant, elderly, tired, or suffering from heart conditions is discouraged
    by the company''s Health and Safety guidelines. Users may also experience severe
    dizziness, seizures, or blackouts as a result of using the product. That has a
    creepy ring to it. Virtual reality''s long-term health effects are also unknown.
    The long-term effects of VR headset use on the eyes and brain have yet to be thoroughly
    studied by researchers.


    Initial studies show that most adverse health effects are temporary and do not
    have a long-term impact on the user''s well-being. The longer-term effects of
    VR use will necessitate more research as users begin to spend longer periods of
    time in VR space. Until further notice, virtual reality companies appear to be
    taking a more cautious approach to long-term effects. VR has the potential to
    have negative effects, according to Sarah Sharples, the president of the Chartered
    Institute of Ergonomics and Human Factors, in an interview with The Guardian.
    The most critical thing we can do is to exercise caution and common sense. We
    should, however, not allow ourselves to be deterred by this technology''s enormous
    potential.


    ### Cannibalization of the market


    The VR market as a whole is also a concern. The mobile market has a massive advantage
    over the higher-end headsets in terms of adoption. `Google Cardboard` is the cheapest
    implementation. Perhaps for a good reason. Buying a $20 low-end mobile VR headset
    is easier on the wallet than saving up a few hundred dollars for a higher-end
    headset.


    Low-cost headsets, unsurprisingly, provide low-quality experiences. Because they
    mistakenly believe a low-end VR system is representative of the current state
    of VR immersion, users may write them off as nothing more than a toy.


    Perception, on the other hand, can frequently become a reality. As more low-end
    VR devices become available, could they hurt virtual reality''s overall market
    share in the long run? The sales figures of lower-end devices may have prompted
    some companies to pay more attention. As many headset manufacturers appear to
    be going multi-tiered with their next generation of headsets, they are able to
    cater to a wide range of consumers. When `Oculus` co-founder Nate Mitchell spoke
    to Ars Technica about the company''s upcoming three-headset strategy for its next
    generation of consumer headsets, he said that the `Oculus Go`, a lower-end standalone
    device, would be the first, followed by the `Oculus Santa Cruz`, a middle-tier
    headset. It is a similar story with `HTC`. The `HTC Vive Pro` was released as
    a high-end device, while the standalone `HTC Vive Focus` was released in China.


    The potential long-term market for virtual reality is likely to be large enough
    to support a wide range of products. Next-generation headsets have arrived, and
    we''ll be watching to see which devices gain the most traction. Midrange mobile
    device headsets are expected to grow in popularity in the near future, while high-end,
    external PC-based headsets are geared toward those who are going all-in on high-end
    gadgets. Those who fall into the latter category are a more limited market, but
    they are willing to pay more for the best-in-class experience that virtual reality
    can provide.


    # CHAPTER 8: EXPLORING THE CURRENT STATE OF AUGMENTED REALITY


    AR has recently experienced a resurgence of sorts. Virtual reality (VR) has a
    long and distinguished history, and as a result, AR has received less attention
    from the general public than VR. AR has always seemed to be a distant second to
    virtual reality in the minds of consumers, whether the concepts were more nebulous
    to understand or VR was seen as the "sexier" technology.


    The years from 2013 to mid-2017 saw the most dramatic increase in this. With the
    resurgence of virtual reality (VR) headsets, augmented reality (AR) was once again
    pushed to the sidelines. However, in the fall of 2017, something unexpected occurred.
    With the introduction of `ARKit` and `ARCore` by Apple and Google, the creation
    of augmented reality (AR) apps for `iOS` and `Android` devices has never been
    simpler for programmers. Due to this announcement, the total number of AR-compatible
    devices has risen to nearly 500 million (the installed base of compatible `iOS`
    and `Android` devices).


    AR-based applications aren''t for everyone, but those who want to give it a whirl
    don''t have to shell out for additional hardware.


    Like VR, AR appears to be experiencing some of the same problems as the latter
    at the moment. In the same way that `Google Cardboard` helped popularize virtual
    reality (VR), `ARKit` and `ARCore` are boosting consumer awareness of augmented
    reality (AR). The `Meta 2` and `Magic Leap` are superior in terms of wearable
    technology, but the `HoloLens`, `HoloLens`, and `Meta 2` do not provide the same
    level of immersion. What''s most intriguing is where AR''s adoption rates are
    estimated by researchers. Research firm Gartner, using its Technology Hype Cycle,
    claims that VR has begun its journey down the Slope of Enlightenment and that
    mass adoption of VR is expected within the next two to five years (2020 to 2023).
    In the Trough of Disillusionment, it claims AR is currently languishing, with
    mass adoption expected in five to ten years (2023 to 2028).


    ## THE AVAILABLE FORM FACTORS OF AUGMENTED REALITY


    AR, unlike virtual reality, is still trying to find the best form factor for it.
    Unlike virtual reality, AR is still trying to find the best form factor for it.
    AR is available today in a variety of forms, including glasses, headsets, large
    tablets, mobile phones, projectors, and heads-up displays (HUDs).


    There''s a good chance that any or all of these devices could be used in AR applications.
    Alternatively, it''s possible that none of these will be the "best" way to experience
    AR and another implementation will be released and reign supreme. (Perhaps AR-enabled
    contacts?). In the meantime, let''s take a look at some of the most popular executions
    currently on the market.


    ### Mobile devices


    AR experiences on mobile devices, despite being on the lower end of the spectrum,
    currently make up the majority of the market for AR. AR has been available in
    rudimentary form in a number of popular apps for some time now, but many users
    are unaware of it. A primitive form of augmented reality (AR) on mobile was being
    used by you every time you added bunny ears to your Snapchat image or saw a Pikachu
    playing in your local park.

