    physical movements are closely tracked by the virtual world''s graphics and movement.
    In spite of the fact that we have surpassed the processing power of computers
    from decades ago, we still encounter software that runs slower than games from
    that time period. To a greater or lesser extent, the more power we have, the more
    we expect from it. Improved graphics! The screen is getting a lot more crowded!
    Expanded viewing areas! We''re getting even more effects now! In order to avoid
    simulator sickness, you should be aware of the possible causes.


    **The screen-door effect**


    Put on an older VR headset or one powered by a smartphone and pay close attention
    to the image that appears in the headset. You may see "lines" between the displayed
    pixels depending on the device''s resolution. If you sat too close to your old
    TV set as a kid, you might have noticed the same thing. The term "screen-door
    effect" refers to this problem''s resemblance to looking out a screen door. In
    some VR headsets, this issue has been reintroduced despite the fact that it has
    been long solved for modern televisions with extremely high resolutions.


    Displays with lower resolution, such as older headsets or some smartphones, show
    this effect the most prominently because they are held inches from your nose and
    magnified by optic lenses. Several solutions have been proposed to this issue.
    A "light diffuser," for example, has been suggested by LG, but most agree that
    higher-resolution displays are the best solution. The screen-door effect can be
    alleviated by using high-definition displays, but this will necessitate more processing
    power. Better hardware, as with simulator sickness, should make this effect less
    common. Within the next generation or two of virtual reality headsets, the screen-door
    effect should be a thing of the past.


    **Movement in VR**


    It''s still difficult to move around in VR''s digital environment. For example,
    the Vive and Rift allow users to be tracked around the room, but not much further.
    Adding more features requires either a movement mechanic built into the app itself
    or specialized hardware that is beyond the capabilities of the majority of consumers.'
