    AR 长期以来被视为虚拟现实的影子。公众的想象力一直被访问与我们世界完全不同的纯虚拟世界的想法所吸引。相比之下，AR 长期一直被应用于制造业等业务环境中。因此，用户在工作中可能会对这项技术更加熟悉，这可能导致消费者在家庭中使用增强现实的情况增加。


    研究机构 Gartner 预计 VR 将 2020 年至 2023 年间被广泛采用，而 AR 则预计在几年后变得普及。因此，我们可能需要等十年时间才能看到我们一直所期待的
    AR 广泛普及。虚拟现实和增强现实都面临着技术挑战。增强现实（AR）与虚拟现实（VR）之间有许多相似之处，但也存在许多差异，包括需要计算机视觉来检测现实物体、需要透明显示器、需要放置数字物体、将数字全息图固定在现实世界以及许多其他方面。


    ### 外观形态与初印象

    AR 面临的最大挑战可能是它在与虚拟现实的战斗中必须克服的最大障碍之一。虚拟现实（VR）只有通过购买 VR 头显设备和驱动它的电脑才能体验。得益于 AR 被包含在标准的移动设备中，现在数亿人都可以接触
    AR。另一方面，AR 的体验可能并不尽如人意。然而，尽管苹果和谷歌的工程师做了努力，大多数人对增强现实的首次接触将限于移动设备的能力，尽管这些工程师付出了努力。


    正如俗语所，你没有第二次机会留下初印象。糟糕的移动 AR 体验可能会导致用户从整体上否定 AR，认为它在技术进步方面只能提供移动 AR 体验的能力。在这个过程中，许多其他具备
    AR 能力的外观形态可能会被忽视。这是一个错误。


    ### 成本与可用性

    对于“初印象”问题，没有简单的答案。目前市场上只有少数增强现实（AR）头显和眼镜，而那些针对业务或是“开发者版本”的产品尚未面向普通公众。AR 头显和眼镜的费用可能轻易达到数千美元，这使得除了最热诚的早期采用者和创新者之外，其他人都无法负担。这与低成本的
    VR 头显形成了对比。AR 和 VR 之间的这种价格差异可以解释为什么 AR 的大规模普及被预测要等几年以后。


    作为一种技术，增强现实和增强现实头显仍处于婴儿阶段或创新者阶段。对于新技术来说，跨越早期采用者的鸿沟并跨越达到早期大众消费者采用阶段可能是困难的。


    ### 感知用性

    对于计算机系统来说，即使是最尖端的硬件，如果没有同样出色的软件也毫无价值。许多人对 AR 的潜力感兴趣，但他们不确定用它做什么。由于大众媒体对虚拟现实进行了相对深入的探索，许多人意识到它所提供的优势。然而在大多数情况下，AR
    更多地保持着神秘，使得普通公众难以想象它将如何被使用。


    这里可能存在“先有鸡还是蛋”的问题。为了给尚未达到特定使用水平的硬件编写软件，开发者不愿这样做，而消费者也不愿意购买没有广泛应用供他们使用的硬件。购买这些小设备需要一个有说服力的理由。


    为了促进广泛采用，几位有进取心的软件开发者需要创建几个“必不可”的应用程序。对于这些软件开发者来说，获得首批“杀手级”AR 应用将不会是一条轻松的路。


    ### 追踪

    在现实世界三维空间中放置数字物体的能力是增强现实的一项关键特性。在现实标记的帮助下，可以指示物体应该在哪里，但无标记追踪是许多增强现实应用的终极目标。与需要更复杂的计算机视觉的无标记追踪相比，基于标记的
    AR 可以为追踪提供非常稳定的基础。只需要标记即可。


    计算机视觉是当谈论 AR 时经常用到的术语。如果你感兴趣了解更多关于计算机视觉以及它如何在增强现实（AR）背景下使用的，你将想要继续读下去。


    在技术上，开发能够处理无标记 AR 的计算机视觉是困难的，因为它需要对 3D 空间有深入的理解。我们眼睛看到的与计算机看到的之间的区别在于，我们的大脑很容易区分不同类型的表面，但计算机只看到像素的集合。计算机如何读取像素集合并破译它们的含义被称为计算机视觉。例如，计算机视觉将允许应用程序识别具有高度、宽度和深度的桌面图像。即使在可以处理必要数据的系统上，无标记
    AR 的速度也可能变慢。改变移动设备的位置或快速移动头部可能会导致放置在物理空间中的数字全息图发生位移，这会导致当你转过背看到椅子在地板上移动或滑动时，你认为你的家里闹鬼了。AR
    追踪是该技术最具挑战性的方面之一，但它对于维持用户的数字项目实际上存在于现实世界中的幻象至关重要。你可以预计下一代设备将优先考虑并改进当前一代的追踪。


    ### 视野

    数字全息图的视野（FOV）是它可以被看到的区域。FOV 是一个指代移动设备屏幕上可见空间数量的术语。你可以通过设备的屏幕看到 AR 世界中发生的情况。没有全息图的现实世界只有当你视线移开这个数字领域时才可见。在目前的
    AR 头显和眼镜中，数字视野仅覆盖可见区域的一小部分，而不是目罩或眼镜的整个区域。这就像是你通过一个小窗户或信箱查看虚拟世界。


    显然，更大的视野比更小的好。看到全息图在你的视野内被切断很容易损害游戏的整体体验。90 度视野似乎是目前这批头显中最宽阔的，但距离人类眼睛视野（垂直 135
    度，水平 200 度）仍然遥远。


    随着下一代硬件的发展，AR 预计将在改进视野方面取得巨大进展。微软已经宣布已找到一种方法将其下一代 HoloLens 的视野增加一倍以上。


    ### 视觉


