    元宇宙及其加密货币已经得到了介绍，你可能在好奇在这一世界中开始交易是否合适且安全。领先的经济学家和学者们毫无疑问地认为答案是肯定的，因为这背后有一系列极具令人信服的理由。


    首先，这个新的虚拟世界是一个你可以工作、玩耍和参与你喜欢的活动的地方。每个人也坚信，元宇宙和基于加密货币的经济交易将成为快速赚大钱的下一个前沿。数据表明，未来几个月的利润可能会非常高，因此他们建议投资者立即开始投资并使用这些加密货币。尽管如此，一些人仍然持怀疑态度，因为根据一些人的观点，这些加密货币对于那些整天沉浸在元宇宙或社交媒体中的人来说才具有价值和可用性。


    在元宇宙中运行需要一个拥有最低数量加密货币的虚拟钱包；否则，你将无法在虚拟平行世界中使用你的 `avatar` 做任何事情。根据美国最近的一项研究，18 岁至
    55 岁之间的人群反应是可以预测的。首先，年轻人更有兴趣在平行宇宙中操作并使用数字货币。其次，对这些新领域最怀疑的人认为，这些场景对现实生活和人关系构成了危险和伤害。本质，他们认为生活在虚拟世界的人无法与现实世界中的其他人建立有意义的关系。


    此外，元宇宙参与者将其定义为一种游戏和娱乐的可能现实，而不是一个工作的世界。像 `Amazon`、`Microsoft` 和 `Apple` 这样的大型企业也是怀疑的主要来源。许多人对对经济和市场的影响表示担忧。他们可能利用元宇宙的发展，在牺牲普通公民利益的基础上变得更加富有。


    另一方面，元宇宙是 Z 世代（即下一代）的必备品，当被问及时，他们表示这是近未来真正的演变。平行世界将传播到何种程度、它意味着什么、以及它将如何影响我们的传统经济，这些都是未来必须回答的问题。换句话说，元宇宙是一个转瞬即逝的时尚，还是未来商务和社会互动的基础石？


    ## 为什么元宇宙现在会变得更加流行


    全球几大科技公司正在对元宇宙发起全面进攻。`Microsoft` 想要创建一个企业元宇宙，而马克·扎克伯格则全力投入。`Fortnite`、`Minecraft`
    和 `Roblox` 已经让社交游戏成为了一种主流现象，并创建了可以开发元宇宙的平台。一些游戏开发者认为，深受 7 到 12 岁儿童喜爱的方块游戏 `Roblox`
    可能是未来最强大的元宇宙平台。`Hadean` 云软件为 `Minecraft` 提供动力，使其能够在每个世界扩展到数千名用户。


    直到最近，计算能力才出现，使得虚拟现实能够扩展到大规模。像 `Hadean` 和 `Improbable` 这样专门从事大规模分布式计算的公司可以同时在同一服务器上接入
    10,000 名玩家。在几年以前，在元宇宙中同时举办 50,000 人演唱会和体育活动的想法是不可想象的。


    随着加密货币和非同质化标记（NFT）的出现，元宇宙现在对于寻求扩大业务的企业来说更容易接触了。除了允许你在不同的元宇宙世界之间移动虚拟身份和货物之外，这些可交换代币还让你可以将你的
    `Roblox` 像素剑作为 `Fortnite` 大逃杀战中的有效武器。


    在《黑客帝国》和《头号玩家》中，元宇宙变得了真正的“元（meta）”，你能够无缝地在平台之间跳跃。类似的现象发生在 20 世纪 90 年代，当时手机手机开始允许人们跨不同网络互相发送短信，移动消息的爆发超了任何人的预期。


    ## 元宇宙不仅仅是一个游戏场所


    是的。在元宇宙中玩游戏并不是在那里度过时间的唯一方式。显而易见的起点是游戏，但如果从 `Web3.0` 的角度来看，元宇宙涵盖了得多的内容。Ariana Grande
    和 Travis Scott 曾在 `Fortnite` 上表演过，而 Lil Nas X 去年的 `Roblox` 秀吸引了 3300 万次观看。


    这就是为什么像位于巴黎的 `Stage11` 这样的公司如此引人注目。一家由 `Otium Capital` 资的名为 `Stage 11` 的初创公司正在为元宇宙开发沉浸式虚拟现实音乐体验，并与
    David Guetta、Snoop Dogg、Ne-Yo 和 Akon 等艺术家建立了合作。


    各种艺术家都将创建迎合元宇宙的公司，包括音乐家、时尚设计师和其他类型的服务提供者。位于伦敦的 `Gravity Sketch` 公司最近引入了一个虚拟协作室，设计师可以在那里远程处理同一个
    3D 设计任务。


    在更偏向业务的另一侧，会议、教育和医疗保健都是可能的。例如，瑞典初创公司 `Warping` 为企业创建 VR 培训视频，并与数字医疗机构 `Kry` 合作了一项试点项目，通过使用沉浸式场景帮助社交恐惧患者克服恐惧。


    `Nvidia` 的 `BMW` 工厂数字孪生是元宇宙的一部分。它可能是一个枯燥的元宇宙，但技术人员可以在其中工作，所以它仍然很重要。


    `Talewind Studios` 首席执行官兼创始人 Mike Allender 认为，所有公司在某个时候都会在元宇宙中拥有某种存在。“现在每家公司都有一个
    2D 网站。”


    数百家从初创公司到全球科技巨头的企业已经在元宇宙生态系统中立足。


    ## 第二章


    # 元宇宙的风险与挑战


    伴随着 `VR`（虚拟现实）、`AR`（增强现实）和 `MR`（混合现实）的使用，元宇宙高度依赖这些技术和设备。元宇宙像任何新技术一样，都有许多需要克服的障碍。必须改进用户体验、降低硬件成本并增强数据处理能力，以应对当下的挑战。


