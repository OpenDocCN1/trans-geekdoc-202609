    同样，技术浪潮在被大众接受之前都会经历高峰和低谷。`Gartner Hype Cycle`（技术跃跃曲线）代表了变革性技术在发布后预期变化的情况，由信息技术研究机构
    `Gartner` 提出。当一项技术首次引入时，`Gartner Hype Cycle`可以帮助预测它被采用的速度（或是否会被采用）。在 2007 年之前，互联网市场（互联网泡沫破后）和手机市场经历了类似的（尽管并非完全相同）的起伏。


    早期的概念证明和媒体关注在技术开发的早期阶段充当`创新触发点`（Innovation Trigger）。


    下一个峰值是`过度估值峰`（peak of overestimation）。由于早期的成功和正面宣传，企业对该技术的期望超过了其能够交付的能力。随之而来的`幻灭谷`（Trough
    of Disillusionment）发生在技术的实际应用未能达到初始`创新触发点`和媒体热度设定的高预期之时。许多技术在`幻灭谷`中失败，并未能实现最初的承诺。


    在度过`幻灭谷`之后，第二代和第三代产品开始出现，技术及其用途得到了更好的理解；这些技术达到了`启明期`（Slope of Enlightenment）。那些能够凭借自己的想法和执行力看穿低谷的早期采用者，往往可以从主流采用中获益。


    最终，我们到达了`生产力平台期`（Plateau of Productivity），那些度过炒作周期波动的公司可以从其早期采用中获益。通过了解 `VR` 和
    `AR` 在周期中的位置，你可以对它们做出更好的决策。考虑现在是否是你的公司开始实施这些新技术的正确时机。一切都准备就绪了吗，还是你应该在发布之前再等几年？


    根据 `Gartner` 的说法，`VR` 将在两五年内实现大规模采用，它刚刚走出“幻灭谷”。另一方面，`Gartner` 保守地估计 `AR` 的采用还需要五到十年，因为
    `AR` 目前正处于`幻灭谷`。


    这听起来像是一个不祥的地方，但`幻灭谷`是技术必须经历的阶段。在进入消费者手中之前，新技术必须经过一个严格的过程来确立其身份并确定其在世界的地位。制造商必须确定哪些问题可以被有效解决，而哪些问题无法被有效解决。发现这些可能需要大量的尝试。


    对于作为大众市场消费品的 `AR` 来说，青少年时期是一个时期。制造商和开发者需要时间来确定它应该以什么形式存在，它可以解决什么问题，以及如何最好地解决这些问题。任何新兴技术（包括虚拟现实和增强现实）的制造商都应该警惕在这些问题解决之前将产品推向市场，因为这往往会导致比解决的更多问题。这份关于虚拟和增强现实的`Hype
    Cycle` 报告是在 `Apple` 宣布 `ARKit` 后不到一个月发布的，并在 `Google` 宣布 `ARCore` 之前整整一个月发表的。可以认为，`ARKit`
    和 `ARCore` 的发布由于其庞大的安装基础而引发了主流采用。然而，这似乎有一点不诚。仅仅拥有安装基础并不能保证广泛的采用（尽管它是拼图中很大的一部分）。


    当使用技术变得像打开网络浏览器、在移动设备上检查电子邮件或向朋友发送短信一样简单时，它才真正进入了主流。它已经……已经……


    # 第 7 章


    ## 探索虚拟现实的现状


    在技术不断演变的今天，成为虚拟现实的一部分既令人兴奋又具有挑战性。停下来并评估现状是至关重要的。在未来一或两年内，许多业内人士预测 `VR` 将被广泛使用。今天存在的许多问题到那时将得到解决。


    ## 虚拟现实的可选形态


    尽管有许多虚拟现实头戴设备，但它们似乎都共享相同的基本设计。`VR` 体验可能受益于这种形态，但这也可能是大众消费设备缺乏创新的标志。目前，大多数 `VR`
    系统被实现为头戴式显示器，但每家公司都开发了关于该因素外观的自己的设计。


    书的重点是用户群最大的消费级头戴式显示器（`HMDs`），以保持书的重点且简洁。在写作时，`Oculus Rift`、`HTC Vive`、`Windows
    Mixed Reality`、`Samsung Gear VR`、`PlayStation VR`、`Google Daydream` 和 `Cardboard`
    是市场上唯一的选择。目前，这些是最广泛的第一代 `VR` 头显设备，但未来可能会发生变化。我在这里包含的许多评估标准可能会被任何新出的头显设备共享。同样的标准也适用于许多即将到来的第二代设备。如果你熟悉不同硬件实施的各种选择、优点和缺点，你就能评估任何新出的硬件。


    `HTC Vive` 和 `Oculus Rift` 目前处于我们消费者级 VR 体验图的顶端。毫无疑问，它们提供了迄今为止最具沉浸感的虚拟现实体验。头显本身以及驱动它们所需的独立硬件都不是免费的。

