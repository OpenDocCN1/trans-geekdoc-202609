    ### Augmented virtuality


    Augmented virtuality (AV), also known as merged reality, is a term that has yet
    to gain much traction in the industry. It is basically the inverse of typical
    AR. Although the term "augmented reality" (AR) typically refers to digital objects
    being integrated into real-world settings, "augmented reality" (AV) refers to
    digital objects being integrated into real-world settings. Video streaming from
    the real world and placing that video in a virtual space are examples of AV, as
    is creating a 3D digital representation of an existing physical object.


    ### Extended reality


    There is an umbrella term for all of the technologies we''ve discussed thus far:
    extended reality (XR) (including `VR`, `AR`, and AV). It is possible to measure
    a technology''s level of virtuality or realness using a continuum. The completely
    virtual is at one end of the spectrum, while the completely real is at the other.
    XR covers the entire range of this scale.


    Virtual reality and augmented reality, two terms that encompass a wide range of
    emerging technologies, are the primary focus of this chapter. Most situations
    can be summed up in those two words. My definition of virtual reality includes
    any hardware/software combination that creates a primarily or entirely digital
    experience for users to engage in. Any real-world environment that has been enhanced
    by digital elements is referred to as augmented reality (which may or may not
    interact with the real environment).


    ## A BRIEF HISTORY


    American science fiction writer Stanley G. Weinbaum wrote a short story called
    "Pygmalion''s Spectacles" in 1935 about an inventor who created goggles that allowed
    the wearer to trigger "a movie that gives one sight and sound, taste, smell and
    touch." This is your story; you can interact with the characters and hear their
    responses; the story revolves around you, and you are a part of it." Computers
    and television weren''t even invented when Weinbaum started writing. Weinbaum
    would probably be shocked if he traveled back in time and saw how closely his
    vision of `VR` resembles the current state of emerging technology.


    Virtual reality and augmented reality have a rich and diverse history that goes
    far beyond the scope of this article. In the meantime, a general look at some
    of the various incarnations of these technologies may provide some clues as to
    where these technologies are headed in the near future.


    ### The father of virtual reality


    According to `VR` pioneer Morton Heilig, who is widely recognized as the father
    of virtual reality cinema, a multisensory movie theater called "The Cinema of
    the Future" was first conceived in 1955. Heilig created a mechanical arcade cabinet
    called the `Sensorama`, for which he made a number of short films to engage the
    senses. Virtual reality headsets of today have a stereoscopic 3D display, stereo
    speakers, and haptic feedback through vibrations in the user''s chair.


    Heilig patented the `Telesphere Mask`, the first-ever head-mounted display (`HMD`),
    shortly after developing the `Sensorama`, which provided stereo 3D visuals and
    stereo sound. The `Sensorama`''s bulky seated form factor is more akin to today''s
    consumer `VR` headsets than this (relatively) small `HMD`.


    ### Augmented reality gets a name


    For each aircraft built in 1990, Boeing Computer Services Research was asked to
    create a replacement for Boeing''s current system of wiring instructions on plywood
    boards. Construction workers could use a head-mounted display that projected the
    position of cables onto multipurpose, reusable boards, as proposed by Caudell
    and his co-worker David Mizell. Wiring instructions could instead be worn by the
    workers themselves instead of on separate boards for each aircraft. The term augmented
    reality was coined by Caudell and Mizell.


    ### Early virtual reality failures


    During the Consumer Electronics Show in 1993, Sega announced its `Sega VR` headset
    for `Sega Genesis`, a massively popular videogame console at the time (CES). In
    the fall of 1993, Sega originally planned to deliver the device for $200, a reasonable
    price at the time. The system, however, was dogged by development issues and never
    made available to the general public. To Tom Kalinske, Sega''s CEO at the time,
    the `Sega VR` was put on hold due to testers developing severe headaches and motion
    sickness.


    One of the gaming industry''s most well-known names decided to get in on the action,
    as well. Nintendo''s `Virtual Boy` was the first portable 3D-capable device to
