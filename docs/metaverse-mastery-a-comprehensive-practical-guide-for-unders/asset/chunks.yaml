    应用程序在 VR 中跨越大区域的能力在未来可能会面临后勤挑战。即使用户使用了上述某些解决方案以一种与物理运动对应的方式在 VR 中移动，某些用户仍可能经历模拟器症。即使能保证每位用户都能使用全向跑步机来追踪其移动，用户可能也不想行走长距离。对于活动能力受限的人来说，行走长距离是不可能的。硬件和软件开发者必须通力合作寻找这一问题的解决方案。此外，目前也存在其他选择。


    ### 健康影响


    这里最大的未知数是对比个人健康的影响。公司的健康与安全指南不建议在怀孕、老年、疲劳或患有心脏疾病时使用 `Oculus Rift`。用户在使用该产品时可能会导致严重的头晕、癫痫发作或昏厥。这听起来令人不骨悚然。虚拟现实的长期健康影响也是不未知的。研究人员尚未对
    VR 头戴设备对眼睛和大脑的长期影响进行彻底研究。


    初步研究表明，大多数负面健康影响是暂时的，对用户的健康没有长期影响。随着用户开始在 VR 空间中花费更长时间，VR 的长期影响将需要更多的研究。在另行通知之前，虚拟现实公司似乎对长期影响采取了更加谨慎的态度。根据
    Sarah Sharples 在接受《卫报》采访时提到的人体工程与人类学会的表示，VR 具有产生负面影响的潜力。我们能做的最关键的事情是保持谨慎和常识。然而，我们不应该被这项技术的巨大潜力所震慑。


    ### 市场蚕食


    整个 VR 市场也是令人关注的问题。在采用率方面，移动市场比高端头戴设备具有巨大优势。`Google Cardboard` 是最便宜的实现方案。也许有其道理。购买一个
    20 美元的低端移动 VR 头戴设备比攒几百美元买高端头戴设备更省钱包。


    意所当然的是，低成本头戴设备提供的体验质量较低。由于用户错误地认为低端 VR 系统代表了当前 VR 沉浸的现状，他们可能会将其仅仅视为玩具。


    另一方面，感知也经常会变成现实。随着更多低端 VR 设备的出现，从长远来看，它们会损害虚拟现实的整体市场份额吗？低端设备的销售数据可能促使一些公司更加关注。许多头戴设备制造商似乎在下一代头戴设备上采用分级策略，他们能够满足广泛的消费者。当
    `Oculus` 创始人 Nate Mitchell 接受 Ars Technica 访谈，关于公司下一代消费级头戴设备即将推出的三产品策略时，他说低端一体式设备
    `Oculus Go` 将是第一个，随后是中端头戴设备 `Oculus Santa Cruz`。`HTC` 也是类似的情况。`HTC Vive Pro` 作为高端设备发布，而一体式的
    `HTC Vive Focus` 则在中国发布。


    虚拟现实的潜在长期市场可能足够大，能够支持各种产品。下一代头戴设备已经问世，我们将密切关注哪些设备将获得最大的关注度。预计中端移动设备头戴设备在不不的未来内将变得更加流行，而高端、基于外部
    PC 的头戴设备则面向那些全方位投入高端设备的人群。属于后一类的人群市场较小，但他们愿意为虚拟现实能提供的同类最佳体验支付更多费用。


    # 第 8 章：探索增强现实的现状


    AR 最近经历了某种复兴。虚拟现实（VR）拥有一种悠久的历史，由于如此，增强现实（AR）在消费者眼中受到的关注较少。AR 似乎正在经历某种复兴。虚拟现实（VR）拥有一种悠久的历史，由于如此，增强现实（AR）在消费者眼中受到的关注较少。AR
    似乎正在经历某种复兴。虚拟现实（VR）拥有一种悠久的历史，由于如此，增强现实（AR）在消费者眼中受到的关注较少。在 2013 年到 2017 年年中，发生了意外的事情。由于苹果和谷歌推出了
    `ARKit` 和 `ARCore`，在 `iOS` 和 `Android` 设备上创建增强现实（AR）变得前所未有的简单。由于虚拟现实（VR）头戴设备的复兴，增强现实（AR）再次被推向边缘。由于这一公告，兼容
    AR 的设备总数已增加到近 5 亿（`iOS` 和 `Android` 设备）。AR 应用程序并不适合所有人，但那些想要尝试一下的人不需要购买额外的硬件。


    与虚拟现实（VR）一样，AR 目前似乎面临着一些相同的问题。

