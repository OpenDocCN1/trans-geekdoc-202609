  trans: '


    Web 3.0 算能力的提升在很大程度上将通过 AI/ML 成为可能。通过计算机视觉和自然语言处理，人工智能将使机器和设备能够理解非数字世界。Web 3.0
    将由 AI 持续学习和改进其程序的能力提供动力，这将为用户带来个性化的体验。


    ### 去中心化数据架构


    Web 3.0 具有真正向大众开放互联网的潜力。使其开放和去中心化是实现这一点的主要方式之一。去中心化结构允许数据存储在各种相互连接的设备上，每种设备在网络中都有特定的用途，例如节点、验证者或开发者。由于数据经过加密并加了时间戳，系统中的任何设备都无法对其进行篡改或攻击。


    区块链技术被用于驱动这些能力。每个连接的设备上都有数据账本的副本，对数据的任何更改都必须经过结构中所有节点的批准。因此，同时访问所有连接的设备既困难又昂贵。


    ### 边缘计算基础设施


    为了让 5G 充分发挥其潜力，边缘计算提供的基础设施是必不可少的。凭借 5G 的速度比 4G 快 100 倍，设备与云端处理器之间的延迟将大幅减少。截至 2021
    年 6 月，全球已有 58 个国家部署了 5G，而 2020 年仅为 38 个。预计 3.5 年后将有 10 亿人 5G 服务。


    在边缘计算基础设施的帮助下，计算任务将在靠近甚至直接在数据采集现场执行。这将使边缘服务器、摄像头甚至智能手机能够实时运行脸识别算法，解锁各处的超级计算机处理能力。


    据预测 Web 3.0 将从根本上改变我们与人类及机器交互的方式。使用 Web 3.0，我们能够与世界上任何人或任何事物进行通信，而无需收费的中介机构。


    ## 金融服务中的 WEB 3.0


    在本世纪末尾，互联网将比现在更加去中心化和个性化。这对于金融领域具体意味着什么？拥有大量资金的银行和其他传统机构很快就能与金融科技公司竞争，但在那之前还有很长一段路要走。金融机构必须尽快开始投资并增强自身的内部技术能力。协作与伙伴关系将至关重要，我们已经看到了这一点。


    ### AI 和 ML 的出现


    金融机构正在利用 AI 创造新的收入来源、降低成本并简化劳动密集型流程。金融服务行业中工作的大多数人对人工智能（AI）的潜在应用也非常乐观。根据最近的 `NVIDIA`
    调查，超过十分之八的金融专业人士（83%）同意 AI 对公司未来的成功至关重要。


    根据金融公司的类型，使用 AI 的方法各异。大多数金融科技和投资公司主要将 AI 用于算法交易、欺诈检测和投资组合优化，而不是更通用的应用。银行主要将 AI
    用于欺诈检测、推荐系统以及销售和营销的改进。最后，对于零售银行，AI 不仅用于欺诈检测和预防，还用于获取客户留存，以及个性化产品服务的交叉销售和向上销售。


    由于银行的私人 AI 训练，银行减少了客户来电并更快地向客户交付新应用程序。同时，全球最大的跨境支付服务提供商 `BNY Mellon` 训练了其 AI 和
    ML 模型来预测欺诈，将其准确性提高了 20%。通过在纳秒内分析实时市场数据，AI 和高性能计算相结合，为交易员提供更好、更快的智能。


    然而，金融科技行业在 AI 方面看到了最突破性的进展。抵押贷款和保险是 `NerdWallet` 使用 ML 向客户推荐的金融产品之一。为了提高将 `NerdWallet`
    成员与正确产品匹配的能力，其推荐引擎正在输入大量的配置特征，包括信用评分、未结余额和信用利用率。


    ### 加密货币和去中心化金融平台的兴起


    描述任何连接互联网的人都可以访问的金融产品和服务，我们使用“去中心化金融”（`DeFi`）一术语。因此，没有中央权威可以阻止支付或拒绝访问这些产品和服务中的任何内容。


    如果 Web 3.0 是去中心化的并使用区块链技术，那么 DeFi 有潜力发挥比现在更大的作用。然而，我们可以预计近期中心化金融（`CeFi`）和去中心化金融（`DeFi`）世界的融合。`CeFi`
    和 `DeFi` 是最有可能在金融服务创新方面取得重大进展的金融服务提供商。


    通过 `DeFi`，传统金融的痛点如无法访问银行账户或金融服务；担心金融服务被政府或中央机构破坏；溢价和隐藏费用；内部人为流程导致的风险和延迟等都可以被消除。


    据我所知，DeFi 是如何工作的？`DeFi` 通过加密货币和智能合约在不涉及银行或其他金融机构的情况下提供服务。`DeFi` 中的智能合约立即消除了对金融机构的所有依赖。使用智能合约，资金可以在账户之间转移或退款，而无需涉及金融机构。


    `DeFi` 有许多潜在应用，而且这个列表不断增长。管理你的整个投资组合没有更好的方法了，一个允许你在全球范围内发送和接收资金的同时进行流式传输的系统。


    ## WEB 3.0 市场的演变


    随着区块链技术的发展，研究该技术的计算机科学家已成为资本市场的专家。对于数字商品和服务，不需要第三方支付服务提供商来促进交易。由点对点数字货币驱动的点对点数字服务。


    使用 `Bitcoin`，我们可以确保我们货币数字表示的完整性，因为它所代表的数据或内存被保存且无法被更改。与此同时，法币（也称为“硬通货”）正以前所未有的方式被操纵。持续的疫情和全球金融危机的影响迫使央行大幅增加了其资产负债表的规模。由于打印了大量货币，毫无疑问我们的钱将失去其真实价值。基于
    `Bitcoin` 的全球金融体系可能会使现金或 `Bitcoin` 的购买力远高于目前的基于法币的本地金融系统，后者每年都在损失购买力。


