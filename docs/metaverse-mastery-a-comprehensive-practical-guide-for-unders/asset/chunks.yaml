    Currently, available AR headsets, like current VR headsets, are unable to meet
    the high-resolution expectations of consumers. Additionally, poor occlusion is
    a problem with many current augmented reality devices (the effect of an object
    blocking another object). When we talk about occlusion in AR, we''re usually talking
    about physical objects blocking our view of digital ones. This is a problem in
    augmented reality mobile apps like `Pokémon Go` that you may have noticed: `Zubat`
    can appear to float above the ground in some scenes, while `Squirtle` appears
    to be wedged inside a wall in others. In AR, occlusion is not properly implemented,
    resulting in these kinds of visuals. It is possible to place digital objects accurately
    and realistically under, partially behind, on top of, or in any other relation
    to real-world objects.


    Currently, `Magic Leap` demo videos appear to show a very high level of occlusion
    (although the device has yet to ship, it is impossible for us to predict whether
    the production device will be able to meet the high bar set in its video demonstrations).


    The top and side legs of a table completely obscure the digital hologram of a
    robot. `Magic Leap`''s mass-consumer device could take AR to the next level if
    it can replicate this level of occlusion and fidelity of graphics. When viewed
    in the context of the marker-less orientation described earlier in the chapter,
    it may not appear to be much. An understanding of 3D space is required by simulation
    software if the robot is to be placed behind the table leg. It must be able to
    view the scene and determine what should be in the foreground, what should be
    in the background, and how the digital hologram should fit into all of this. Under
    the table, it needs to know what "forward in space" means and which parts of a
    table are closer together than others. That''s a tall order.


    # CHAPTER 9: THE FUTURE OF VIRTUAL AND AUGMENTED REALITY


    Many of the advances in virtual reality (VR) since the `Oculus DK1` Kickstarter
    in 2013 have been fueled by that initial spark, which has made VR a hot industry.
    As soon as second-generation hardware goes on sale, momentum from the first generation
    will have faded, and reality will begin to take hold of virtual reality. Is the
    first generation''s explosive trajectory going to be repeated by the second? Or
    will the hype fade as early adopters are lured away by a newer technology object?
    Alternatively, will VR settle into the Slope of Enlightenment, where it slowly
    gains adoption as more and more applications for the technology are revealed,
    or will it fall somewhere in the middle?


    For better or for worse, VR is going to undergo a lot of changes in the next few
    years. What you can expect in the market is what I''ll tell you about. You may
    also want to think about how you might be able to get ready for these changes.


    ## THE NEAR-FUTURE CHANGES IN VIRTUAL REALITY


    It''s the best way to prepare for the future unknown is to review what you already
    know. It''s possible to get a sense of where the market is headed by looking at
    the second generation of VR headsets, evaluating upcoming trends, reviewing new
    hardware accessories, and keeping an eye on the more cutting-edge startups.


    ### Evaluating the market


    Virtual reality headsets'' first-generation adoption rate was a common criticism
    of the current market. Some people believe that the VR industry has not received
    a sufficient return on its investment, given the large sums of money and media
    attention it has received. Virtual reality''s critics point to slower consumer
    adoption rates as a failure. Although this may be a valid criticism, the problem
    may be more a result of unrealistic expectations than a breakdown in the technology.
    When it comes to virtual reality, it''s easy to get swept up in the hype and expect
    instant results.


    For those in the virtual reality industry, this slower rate of adoption can be
    discouraging. They''re eager to share their work with the world, but first, the
    world has to catch up to them. For a first-generation device, VR has seen reasonable
    uptake. Lower-tier devices, on the other hand, have accounted for the majority
    of those sales. Those devices are fine, but the true transformative power of VR
    is based on how immersive an experience can be provided. Higher-end (and more
    expensive) VR headsets typically deliver better-quality (and more immersive) VR
    experiences than cheaper models.


    A chicken-and-egg problem may arise as a result of this. The most immersive VR
    headsets may become more affordable for the average consumer. There is still a
    long way to go before content creators can get their hands on the best VR headsets.
    As a result, this can lead to a self-sustaining feedback loop: As fewer people
    use high-end devices, there are fewer applications available for them, resulting
    in a smaller market share for high-end devices. To get out of the loop can be
    difficult.


    It''s normal for new technologies to experience setbacks in their development.
    The awkwardness of adolescence helps to shape well-adjusted people. Even though
    consumer-grade VR is still in its infancy, it has already shown that it is capable
    of delivering engaging experiences. User experience appears to be getting better
    and better with each generation. Now all that remains is for virtual reality to
    find its niche market. What are the most in-demand attributes? What is the market''s
    maximum tolerance for price? It''s more likely, though, that there are multiple
    markets, each with a different skill set that can be served.


    Virtual reality may seem a little strange to think of as a product that is still
    trying to find its audience. However, millions of first-generation devices have
    been sold and are still being used on a daily basis. Facebook CEO `Mark Zuckerberg`
    wants a billion people to experience virtual reality. Expectations accompany lofty
    goals. In order to reach such a large audience, VR will need to identify its target
    market(s).


    ### Looking at upcoming hardware and software


    However, what about the next generation of virtual reality software, accessories,
    and other options for immersive experiences? And how will this impact the consumer?
    Virtual reality has spawned a slew of companies devoted to making the experience
    more immersive, and as headsets have improved, so have the software and accessories
    that go with them. It''s impossible to predict which of the many new industries
    that virtual reality has spawned will survive and thrive in the long run. Due
    to their popularity, hardware manufacturers are incorporating third-party features
    (such as wireless adapters) directly into the next generation of headsets. Although
    eye-tracking and other features are on the VR headset roadmap for the foreseeable
    future, most likely, they will still be provided by third-party vendors. Other
    features, such as the ability to smell in virtual reality, will likely be available
    only as add-ons from third parties for some time.


    #### Haptics


    Sense of touch may be the next frontier for virtual reality, having already established
    itself in the realms of audio and visual immersion. Companies such as `HaptX`,
    `GoTouch VR`, and `UltraHaptics` all offer a variety of ways to experience haptics
    in virtual reality and could point to VR''s next big leap in user immersion.


    #### Eye-tracking

