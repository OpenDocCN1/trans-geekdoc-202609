  trans: '

    电影 `Ready Player One` 让我们窥见了近未来完全沉浸且交互式的虚拟现实世界。根据爱立信 2020 年的一项调查，十个人中有七个人认为，到
    2030 年，我们将拥有与现实世界无异的虚拟现实世界。虚构作品中有很多反乌托邦的场景，但这并非其中之一，至少与我们提到的其他虚构数字世界相比。


    ## Second Life


    Linden Labs 在 2003 年创立了 `Second Life`，远早于 `Facebook`（甚至在 `Meta` 发明之前）。关于这是否真的是元宇宙存在一些争议。这是因为正如其名称所示，它的设计目的是让用户创建一个虚拟身份并在网上过上另一种生活，而不是简单地将现实生活带进来。此外，也可以认为它是第一个被广泛接受的在线元宇宙环境。作为一个具有沉浸式、动手用户界面的百万级在线社区的有用案例，它可能并没有符合所有标准。


    ## Meta Horizons (Facebook)


    为了体现元宇宙概念对未来数字通信、社交和生活的重要性，马克·扎克伯格将他的公司更名为为 `Meta`。由于这一努力，`Horizon Worlds`（虚拟世界平台）、`Horizon
    Venues`（活动平台）和 `Horizon Workrooms`（协作平台）都已开发出来（虚拟办公室）。在这些平台上与他人互动时，可以使用代表用户的化身来代表他们。由于
    `Horizon` 的存在，我们被迫面对一个问题：我们想要一个所有权和治理权集中在公司所有者手中，还是分布且去中心化的元宇宙？


    ## Fortnite


    `Fortnite` 是有史最流行的在线游戏之一并不是秘密，但它并非唯一的一个。但 `Epic Games` 很快意识到，一旦他们将数百万精通技术的游戏玩家聚集在自己的平台上，它就可以产生更具变革性的影响。来自
    `Travis Scott`、`Ariana Grande` 和 `Billie Eilish` 等全球超级巨星的现场演唱会是将 `Fortnite` 世界转化为真正的元宇宙的主要关注线索之一。创意模式已被
    `02`、`ITV` 和 `家乐` 等品牌用于首次进军元宇宙。


    ## Decentraland


    `Decentraland` 是一个 web3 平台，游走于游戏、营销渠道和构建数字去中心化民主实验的边界之间。它由去中心化自治组织 (`DAO`) 治理，是`摩根士利`、`可口可乐`、`阿迪达`、`三星`
    和 `Snoop Dogg` 等大品牌的所在地。那里的土地起价为 `$10,000`，最贵的地块成本远超过 `$1 million` 的该地区原生货币 `MANA`。


    ## Nvidia Omniverse


    对于 3D 设计师来说，`Nvidia''s Omniverse` 是一个创意元宇宙平台。由领先的动画工作室 `Pixar` 开发的通用场景描述 (`USD`)
    语言使得 3D 对象和环境可以在不同的软件平台之间传输。动画师、服装设计师和其他设计师可以使用他们已经熟悉的工具对角色脸部协同工作。随着 3D 环境变得更加详细、沉浸式且创建耗时更长，这种创意框架将成为工作室创建元宇宙内容的必不可少的工具。


    ## Roblox


    每天有超过 5000 万人玩 `Roblox`。在沉浸式元宇宙中，任何人都可以创建并变现自己的虚拟世界，`Roblox` 让用户做到这一点变得简单。为了触达更年轻的群体，`Nike`、`Gucci`、`Ralph
    Lauren` 和 `Vans` 等品牌都已使用。


    ## The Sandbox


    作为一款手机游戏，`The Sandbox` 最终移植到了 `Ethereum`。3D 物品可以在平台上创建并销售。`SAND` 是也可以用于交易的货币。`汇丰`、`华纳音乐`、`PWC`
    和 `帕丽·希尔顿` 等公司都建立了业务。


    ## Otherside


    极其受欢迎的 `Bored Ape Club` (`BAYC`) 系列背后的团队 `Yuga Labs` 正在开发一个最近才宣布的元宇宙项目。第一批出售的“土地”在四月筹了
    `$285 million`。`Otherside` 的开发者表示：“玩家控制世界，他们的角色是可以操作的。”


    ## Pokemon Go


    在元宇宙概念成为热门话题之前，`Pokemon Go` 发布了。元宇宙如何融合现实与数字世界的最佳示例之一。为了进一步模糊现实业务之间的边界，游戏创建者 `Nintendo`
    允许他们发起广告活动。


    ## Metaverse Uses


    元宇宙技术已经被制造商用于加速产品设计、培训员工和提高效率。韩国元宇宙环境中设立的首个虚拟工厂的游客现在可以看到塑料螺丝的制造过程。VR 工厂的游客可以在模拟真实世界工厂的虚拟环境中操作虚拟机器来制造塑料螺丝。他们甚至可以更改工厂设置，例如生产速度。这种技术对元宇宙未来的制造公司将极有益。你不需要进行昂贵且耗时的物理测试来确定模拟是否有效。根据
    `PwC` 的研究，光是在产品和服务开发中使用 `VR` 和 `AR` 技术就可能在 2030 年导致 `GDP` 增加 `$360 billion`。以下是使用元宇宙改进制造方式的一些方法。


    ### Product Design Enhancement


    元宇宙的产品设计世界将通过 `VR` 和 `AR` 增强和优化。数字孪生是现实世界对象的虚拟表示。物联网 (`IoT`) 传感器从物理世界收集实时数据并发送到计算机，在元宇宙中重建为数字表示以创建数字孪生。数字孪生和元宇宙技术可以被组织用于以下目的：


    *   战略性产品可以规划、测试和构建，无需担心昂贵的错误。

    *   在潜在制造问题出现之前关注。

    *   协作空间是创建产品的理想场所。

    *   通过快速且不断地纳入反馈来频繁迭代，从而缩短产品周期。


    ### Training Manufacturing Workers Using XR


    '
- fmt: '

    When it comes to the metaverse, companies plan to use `VR` and `AR` technologies
    to provide immersive training experiences that increase new hire knowledge retention,
    reduce skill "leakage," and simplify knowledge transfer between teams. Technology
    conglomerate Honeywell employs immersive virtual reality and augmented reality
    to enhance training efforts. When employees retire, the company provides them
    with mixed reality headsets and records exactly what they do at work. The new
    hires will then be able to see this information overlaid on their own work.


    ## Increasing Productivity and Streamlining Production Methods


    Metaverse simulations will allow manufacturers to test thousands of possible factory
    scenarios and predict the consequences of upscaling or downsizing. Automation
    and facility optimization can be determined through the use of these simulations
    by businesses. Technicians are also benefiting from the use of `AR` technology.
    In `BMW` service centers, for example, technicians use `AR` glasses to complete
    complex repairs and solve maintenance issues. Video overlays are provided by the
    glasses, which allow the technician to collaborate with engineers and other experts
    on the problem.


    A virtual factory for electric vehicle drivetrains is also available at `BMW`,
    simulating a real-world production line. An entire production line was replicated
    digitally before building a factory in Bavaria to ensure that all processes were
    running smoothly.


    ## Improving Quality Control


    For quality control and maintenance checks, manufacturers in the metaverse will
    rely on `XR`. As a result, they will have lower return rates for defective products
    and lower maintenance costs because they will be able to identify equipment issues
    before they become major issues. `Airbus`, a European aerospace company, is overhauling
    its military aircraft maintenance inspection process. Drones equipped with high-definition
    cameras and `AR LIDAR` sensors conduct fly-around inspections, generating and
    transmitting data to experts who can detect flaws by examining the data on their
    tablets and augmented reality spectacles. This new system saves time and minimizes
    the damage to the aircraft.


    ## Improving Warehouses and Logistics


    Using `AR`, manufacturers in the metaverse will be able to streamline logistics
    and warehousing processes in the digital world. Among other things, supply chain
    planning and order picking will become more efficient and accurate in the near
    future.


    As the world''s largest logistics service provider, `DHL` successfully implemented
    augmented reality (`AR`) for order picking back in 2015. This new system is now
    being rolled out across North America by the company. The picking process can
    be made more efficient and error-free by providing employees with visual cues
    displayed on glasses as they move through the warehouse.


    **REMEMBER:** This is an exciting time for manufacturing and logistics innovation.
    By utilizing the metaverse, manufacturers will be able to create products faster,
    improve product design, increase retention rates through immersive training, and
    enhance factory and warehouse processes.


    ## THE RELATIONSHIP BETWEEN CRYPTOCURRENCIES, BLOCKCHAIN, AND METAVERSE


    Now that you''ve learned the basics, you''re ready to enter the Metaverse on your
    own computer, tablet, or smartphone. Individuals must also have a virtual wallet
    with the appropriate cryptocurrency in order to participate in the cryptocurrency
    market.


    However, what is it about it that is so intriguing? The concept and functionality
    of a virtual wallet are very similar to those of the physical wallets we use to
    carry cash around with us. The only difference is that "cryptocurrency" is used
    in the Metaverse, where money is not accurate. You can, however, perform all of
    the traditional real-world activities with these coins, including selling, buying,
    storing, and keeping, as well as increasing or decreasing their value.


    In other words, the economic transactions we can carry out with euros, dollars,
    or virtual currencies are identical. The Metaverse has its own currency, called
    `cryptocurrencies`. The `blockchain` has its own currency, called `digital tokens`.
    The `cryptocurrencies` can be used in the `Metaverse` to buy virtual goods and
    services.

    '
