    VR 中游戏手柄的问题在于它们与其他输入选项的集成程度不够。它是摆脱键盘和鼠标的良好第一步，但对于许多既是玩家又是 VR 用户来说，他们对它们很熟悉。比起使用标准游戏手柄，大多数
    VR 头显设备现在似乎倾向于使用更集成的运动控制器作为主要输入方法。缺乏数字集成是标准手柄的主要问题。使用手柄时的物理体验与数字体验之间的差异，可能会让用户从
    VR 体验中拉出。因此，大多数头显设备都开发了自己的运动控制器。


    ## 运动控制器


    VR 交互的既定标准已迅速转向运动控制器，而运动控制器曾仅仅是 2D PC 游戏中的一种噱头设备。大多数主要的头显设备制造商都已发布了与其产品配套的运动控制器。


    在理想的世界里，终端用户甚至察觉不到控制器的存在。在使用在本章讨论的许多输入方法时，用户必须在 VR 体验之外做出意识的决定：我现在正在点击头显设备侧面的一个按钮。到此时此刻，我正在键盘上寻找
    `W` 键。使用运动控制器是消除输入与虚拟现实体验分离问题的一步。虚拟现实（VR）通常让运动控制器看起来像是用户手的延伸。一些较贵的 VR 控制器包含六自由度运动能力，以进一步增强沉浸感。


    三维空间中的移动被称为具有六自由度（DoF）。取向跟踪（旋转）和位置跟踪（平移）是虚拟现实中交叉使用的术语，用于描述向前、向后、向上和左/右移动的能力。六自由度（DoF）能够对
    VR 控制器相对于物理位置和旋转进行精确追踪。


    为了跟上更贵的型号，第一代中端移动头显设备（`Gear VR` 和 `Daydream`）也增加了运动控制。高端头显有更多选择，但现在它们被精简了。它最常见的实现方式是一个集成了各种功能（触摸板、音量控制、返回/主页按钮等）的单一控制器。用户通过使用控制器的数字表示可以看到自己的手在现实世界中在做什么。这些控制器通常局限于三自由度，而不像更先进的运动控制器（仅跟踪其在虚拟空间中的旋转）。


    `Gear VR` 和 `Daydream` 头显的控制器追踪对于移动设备来说令人印象深刻，但仍逊于高端有线头显。此外，在没有第二个运动控制器（每手一个）的情况下，运动控制有时感觉像一个华丽的电视遥控器。这些单手控制表示虽然比高端运动控制选项不复杂，但仍然可以提供比以前讨论的选项更集成的
    VR 体验。在虚拟世界中看到控制器并追踪其物理运动，是让用户沉浸在虚拟现实并将用户的物理动作整合到虚拟空间的一大步。


    大多数高端头显设备（如 `Rift`、`Vive` 和 `Windows Mixed Reality`）都配备一对无线运动控制器。总体而言，尽管存在细微差异，但运动控制器之间有很多共同点。


    这些高端控制器可以实现亚毫米级的物体检测。使 VR 体验真正具有沉浸感的另一个重要步骤是，能够低头看到控制器与你的物理身体同步移动的视觉表示。虚拟现实应用越来越多地关注运动控制器作为其主要输入方法。目前，VR
    交互似乎由运动控制主导。VR 中存在且将继续存在大量的其他交互方式。


    ## 手部追踪


    得益于手部追踪，虚拟现实头显可以在不需要在用户手上额外硬件的情况下追踪用户的手部。有些人认为手部追踪是运动控制器演变的下一步。这是许多公司正在针对 VR 应用进行研究的途径。越来越多的人在
    AR 应用中转向这种控制方法。手部追踪长期以来一直是 `Leap Motion` 等公司在 VR 内部外的关注重点。2012 年，`Leap Motion`
    发布了用于 2D 显示器的手部追踪控制器。随着虚拟现实（VR）变得越来越流行，该公司看到了其技术在该空间进行交互的潜力，并将重心转移到了那里。


    手部追踪与传统运动控制器的不同在于，它显示的是你手的数字表示，而不是控制器、手柄或其他类似的虚拟“假”模型。当你的物理手做出捏合动作时，你的数字手也是如此。数字手会对人类手的弯曲做出反应。你的数字手会做出与物理手相同的手势。具有全手指追踪置的虚拟现实（VR）允许你看到你现实世界手的数字表示。感觉就像在尝试一个完全不同的身体。为了在
    VR 中观察你的数字表示打开和关闭拳头，你可能不得不盯着你拿着的那只手。


    然而，手部追踪在视觉吸引力上仍然存在一些问题。虚拟空间交互比使用运动控制器时更局限。使用运动控制器时可以进行许多硬件交互。运动控制器上的按钮、触控板和扳机触发虚拟世界中的各种事件。仅用手部追踪时没有这些选项。基于手部追踪的应用必须处理广泛的输入场景。由于只涉及用户的手，这是一项困难的任务。


    然而，手部追踪本身仍然令人印象深刻，但它缺乏用户在参与现实交互时预期的触反馈。如果你仅使用手部追踪在虚拟现实中拿起一个箱子，你将会错过拿起现实世界物体的感觉。


    在可预见的未来，手部追踪可能是标准消费者级虚拟现实（VR）设计的次要考虑因素。然而，手部追踪最终将进入虚拟现实。这种数字体验无法被忽视。


    ## 眼追踪


    第一款带有眼追踪功能的 VR 头显由 `FOVE` 在 2016 年发布。这些公司都收购了眼追踪初创公司，用于他们的各种 VR 和 AR 设备，表明这是一个值得关注的光领域。用户的
    VR 体验可以从眼追踪中受益匪浅。除了 `FOVE` 之外，大多数头显只能确定用户的头部转向，而不是用户实际看向哪里。


    大多数头显使用位于用户视野中心的准星来告知用户她的视线中心在哪里，正如我们在本章早些讨论的那样。另一方面，现实世界经常看到人们看向脸部前方以外的方向。尽管你可能正盯着正前方的电脑屏幕，但你的视线经常会被屏幕的底部或顶部，或者你的键盘或鼠标所吸引。


    '
