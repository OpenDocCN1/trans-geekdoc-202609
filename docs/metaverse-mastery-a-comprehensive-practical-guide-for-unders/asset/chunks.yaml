  trans: '

    `Vive` 和 `Rift` 的自外式追踪系统目前受限于头显和控制器由外部设备进行追踪的事实。在头显之外，用户在 VR 空间内移动的房间周围放置了额外的硬件（分别称为
    `Rift` 和 `Vive` 的 `sensor` 或 `lighthouse`）。与头显不同，这些传感器并不是头显的一部分。在 3D 空间中，它们在房间内的布局允许对用户的头显和控制器进行极其精确的追踪，但用户的移动限于传感器的视野。当用户离开该区域时，追踪将会丢失。


    使用内向式追踪，就不需要外部跟踪传感器，因为它们被内置在头显中。为了协调用户在虚拟现实中的移动，头显必须解释来自真实环境的深度和加速度线索。`Windows
    Mixed Reality` 头显目前正在使用内向式追踪。


    虚拟现实的“圣杯”——内向式追踪消除了对外部传感器的需求，允许用户自由移动。然而，就像任何其他技术决策一样，这是有代价的。内部追踪的准确性较低，并存在其他缺点，例如控制器超出头显视野范围会丢失追踪。另一方面，第二代头显使用内向式追踪来改进虚拟现实中的移动。即使有了内向式追踪，定义虚拟现实“可玩”空间可能仍然必要的。你仍然需要一种方式来告知哪里可以去。内向式追踪是下一代虚拟现实的一次飞跃，因为它消除了对外部传感器的需求。第一代头显仍然需要计算机或外部传感器才能工作，但公司正在寻找克服这些局限性的方法。例如，`VOID`
    实施了自己的解决方案，提供了全内置 VR 头显可以提供的体验。他们将其称为“超现实”，并允许人们以物理方式与数字元素交互。


    `VOID` 的内置 VR 系统是该公司的技术核心。通过映射整个物理空间并与其精确的数字表示叠加，`VOID` 能够创建物理空间的等比例数字表示。这种结果产生了许多新选择。`VOID`
    可以创建带有流体的数字空间。在数字世界中，一个看似平淡无奇的盒子可以转化为引导用户进入未知区域的感性灯塔。


    `VOID` 目前的内置设计不太可能在大规模市场上成功。它既笨重又昂贵，而且对于大众来说可能太复杂了。这并不一定是坏事，因为它提供了如果移除电缆和线后沉浸式虚拟现实的体验。`HTC
    Vive Focus`（已在中国）和 `occulus` 即将推出的开发者套件似乎正准备在 2018 年初推出无线头显。


    ### 触觉反馈


    虚拟现实控制器已经包含了触觉反馈，用于向用户传递触感。`Xbox One`、`HTC Vive Wands` 和 `occulus` 控制器的震动/抖动可以向用户传递信息。当你正要抓住某东西或在身后关上门时。但这些控制器提供的反馈相当有限。使用这些设备，当你手机收到通知时，你会获得同样的感。


    如果行业想要让虚拟现实在其中感觉起来像真实世界一样真实，那么触觉必须比目前更进一步。虚拟现实中的触摸是许多公司正试图解决的问题。


    `Go Touch VR` 创建了一种可以戴在一个或多个手指上的 VR 触摸系统，以模拟虚拟现实（VR）中的触摸。本质上，`Go Touch VR` 就是戴在指尖上的压力垫。`Go
    Touch VR` 公司声称，用户将在虚拟世界中拥有持有实际物体的感觉。其他一些公司，如 `Tactical Haptics`，正试图修复控制器的触觉反馈问题。他们声称通过使用其
    `Reactive Grip` 控制器手部的滑动板，能够模拟与物理物体交互时感受到的摩擦力。在挥拍时，感觉到网球拍推向手是很常见的。


    移动重物体时比移动轻物体会对手产生更大的阻力。用手绘画时，你会感觉到笔划过手，就像在画布上一样。根据 `Tactical Haptics`，这些场景可以用当前控制器无法的方式精确模拟。`HaptX`
    和 `BHaptics` 等公司正在开发触觉手套、背心和外骨骼。`TactSuit` 目前正由 `BHaptics` 开发。它使用离心质量震电机将震动分散到佩戴者的脸部、背前后和袖子上。通过这种技术，`BHaptics`
    声称用户还可以“感觉到”爆炸和武器后坐力。


    通过其 `HaptX` 平台，`HaptX` 是最大范围内实验虚拟现实触觉的公司之一。在 `HaptX` 智能织物的帮助下，你将能够感知物纹理、温度和形状。目前，它正在研发一种触觉原型，为虚拟现实（VR）用户提供真实的触摸和力反馈。嵌入织物中的微流体空气通道推压用户的皮肤，允许产生可以传输给佩戴者的力反馈。与其他触觉设备相比，`HaptX`
    声称其技术的使用提供了远为优的体验。如果与虚拟现实结合，`HaptX` 的系统将用户带向沉浸式虚拟现实近一步。


    ### 音频


    为了尽可能复制现实，虚拟现实（VR）必须使用视觉和触觉之外的其他感官。另一方面，3D 音频已准备好席卷世界。除了视觉线索外，可以使用音频线索引导用户体验在线体验。声音的
    3D 到达方向、与源的大致距离等对人耳都是可以辨别的。必须复制音频体验，让用户感觉自己真的在现实世界中听它。创建 3D 音频模拟已经可行一段时间，但这通常是作为一种临时解决方案的。3D
    音频已经发现了一个可以随着 VR 的兴起而进步的市场。

