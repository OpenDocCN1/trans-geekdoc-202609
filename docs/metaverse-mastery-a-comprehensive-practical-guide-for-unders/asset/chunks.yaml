- fmt: '

    The release of `ARKit` and `ARCore` has made it easier for developers to create
    AR experiences on mobile devices. In order to create AR-based apps for iOS and
    Android, developers will need to use `ARKit` or `ARCore`. Digital holograms can
    be placed in the user''s environment with ease, thanks to features like plane
    detection and ambient light estimation, which make the holograms appear more real
    to the end-user. The two products share a similar feature set (which is capable
    of detecting the ambient light and transferring that information to digital holograms).


    There are two software development packages that developers use to write apps
    for specific hardware: `ARkit` and `ARCore`. Both iOS and Android devices can
    be used with them, but neither is a piece of hardware. Apple''s and Google''s
    augmented reality mobile implementations don''t require you to buy a separate
    device; you can use your current mobile device if it meets the `ARCore` or `ARKit`
    minimum technical requirements.


    ## AR headsets


    Many AR users begin their journey on their smartphones, but this is by no means
    the best way to experience the technology. Mobile''s physical design can lead
    to a frustrating user experience. In order to use digital augmentation, a user
    must constantly hold a device and capture the image of the real world onto which
    the digital overlay is applied. Another issue is that due to the current form
    factors of mobile devices, the combined real and digital worlds can only be seen
    through a very small window (the size of the screen). Virtual reality (VR) applications
    can benefit greatly from the use of a headset. `Microsoft HoloLens`, `Meta 2`,
    and `Magic Leap` are just a few examples. This is the first snag we''ve run into
    with AR headsets, and it illustrates how far behind VR headsets AR headsets are
    in the development cycle right now.


    Despite the fact that these three headsets are among the most well-known in the
    field, none of them has yet become a mainstream product. The `HoloLens` is currently
    on the market, but it''s primarily aimed at businesses and corporations, not individuals.
    There is a developer kit for the `Meta 2`, but it has yet to see a full release.
    As of this writing, the `Creator Edition` of `Magic Leap`''s headsets has yet
    to be shipped to developers, despite the company''s impressive team and investor
    group (though `Magic Leap` announced a ship date of 2018).


    A large headband or helmet with a translucent visor attached to the front appears
    to be the most common form of AR headset. The goggles'' surface is projected with
    images from the headset, creating a digital overlay on the real world. Goggles
    and light fields make up the form factor of the `Magic Leap One`, which employs
    a different approach. `HoloLens`, for example, is an entirely self-contained headset
    that allows for more freedom of movement at the cost of a lower processing capacity.
    Others (such as `Meta 2`) rely on the processing power of a desktop PC and thus
    limit your freedom of movement. With its `Lightwear` goggles powered by a `Lightpack`
    (a small wearable computer) attached, it serves as an intermediary between the
    two.


    An interesting addition to this group is the `Windows Mixed Reality` headset.
    `Microsoft`s approach to virtual and augmented reality (VR and AR) suggests that
    the two technologies will eventually merge. With front-facing cameras instead
    of a translucent lens, the current `Windows Mixed Reality` headsets could serve
    as a pass-through for an augmented reality experience, similar to the `HoloLens`
    and `Meta 2`. However, this feature is not yet available. Currently, the `Windows
    Mixed Reality` headsets are only virtual reality devices with no augmented reality
    capabilities. Only time will tell if `Microsoft`s naming and positioning of these
    devices indicate that they will be used for more than just virtual reality headsets.


    The current generation of AR headsets provides the best experience currently available,
    but they are only short-term solutions. In the end, no one knows what the final
    form factor of AR will be. It could be a headset like `Microsoft`s `Windows Mixed
    Reality`, or it could be a form of AR glasses.


    ## AR glasses


    The best way to experience AR in the near future may be through a pair of glasses.
    Virtual reality glasses have yet to be released in the form of the `HoloLens`
    or `Meta 2`, which are currently more like large visors. However, `Magic Leap
    One` is still a rather large pair of goggles. In terms of simple AR glasses, `Google
    Glass` and `Intel Vaunt` are the most well-known examples. `Google Glass`, on
    the other hand, is nothing more than a wearable HUD. Digital content can''t be
    "placed" in the real world with its limited resolution and lack of interactivity
    due to its small viewing area, lack of graphic capabilities, and lack of ability
    to "place."


    HUDs, such as `Google Glass`, are interesting in their own right, but they are
    not considered true augmented reality devices. Rumors are rife about `Apple`s
    plans to produce its own pair of AR glasses following the release of `ARKit` and
    CEO `Tim Cook`''s praise of AR as the future of technology. `Apple` has yet to
    make a statement about this. For the time being, the only way to access augmented
    reality content is through a mobile device or one of the few available augmented
    reality headsets.


    ## Augmented controllers


    AR/MR controllers typically face a different set of challenges than VR controllers,
    and this sets them apart from other types of controllers. As compared to most
    virtual reality headsets, many AR headsets allow the user to see the real world
    around them either via video feed or by using a translucent visor. This can alleviate
    some of the issues that traditional headsets may have. When a user is able to
    see into the real world, they are no longer fumbling around for real objects.


    This improved perspective can also exacerbate other technical issues. Due to the
    fact that they can see the real world, it can be awkward to interact with digital
    holograms that are displayed as real-world objects using a controller. This necessitates
    the development of a system that allows users to interact with digital objects
    solely through the use of their hands.


    It is possible to interact with objects in AR using various methods.


    ### Touch


    In mobile AR implementations, touch interaction is most commonly used. AR''s use
    in popular mobile apps like `Snapchat` has pushed the technology into the mainstream.
    A few drawbacks have come along with the implementation of augmented reality on
    non-AR devices (such as smartphones).


    The use of mobile device input methods in augmented reality (AR) applications
    is one of the challenges. Users are familiar with tapping, swiping, and similar
    actions to the screen on their mobile devices, but these actions may not be sufficient
    to control and navigate an AR experience.


    When it comes to implementing augmented reality on a mobile device, there is no
    new hardware involved. Instead, they must adapt to how people currently use mobile
    devices. App developers are usually responsible for deciding how AR input is handled
    on mobile devices. Users can interact with AR content using a combination of gaze
    controls (covered in the next section) and standard mobile interactions. If a
    user positions his/her gaze cursor/reticle over a digital hologram in 3D space,
    he/she can tap the mobile screen to select it and then drag the digital hologram
    once selected.


    ### Gaze


    It''s common in AR to use gaze control, just like in virtual reality. While other
    interactions like gestures or controller clicks may also be used, gaze controls
    are often used in conjunction with other actions, such as looking around the environment
    and focusing on a specific object. With mobile gaze controls, it''s easy to see
    where the user''s gaze will take a digital hologram in the real world by using
    a grid that follows their gaze. This hologram of `Android`''s bugdroid mascot
    is placed on a virtual grid overlaid on top of the actual scene to aid the end-user
    in visualizing its location.

