    # 引言


    如果有人告诉你，在几年后我们将完全生活在一个虚拟世界中，你可能会感到惊讶。你在现实世界中可以做的几乎所有事情，都可以在数字世界中完成。我确定这现在听起来很不可思议，但在不久的将来它将变成现实。科技领域的流行词层出不去，但只有少数留了下来。随着技术以不断加快的速度进步，描述它的术语列表也在不断增加。“元宇宙”（Metaverse）是一个为了描述虚拟领域而创造的词，它将一直存在。过去几个月你可能听过很多这个词。元宇宙比大多数技术更难解释和理解，因为人类并不是实时存在的。它是互联网未来的愿景，也是追踪当前互联网基础设施状态的一种方式。在历史上，技术进步催生了新的企业和经济体。凭借其巨大的潜力，元宇宙是一个可能从根本上改变世界的规则改变者。


    交流电、无线电、手机和互联网共同创造了现代社会。虽然所有这些技术都是创新且突破性的，但没有人真正理解过它们。你对元宇宙也可以说同样的话。元宇宙仍处于开发的早期阶段，很少有人知道它是什么。如果你手里拿着这本书，你就有机会成为其中之一；你一定想知道未来将会变成什么样。这本书可以帮助你掌握元宇宙将给世界带来什么，以及每个人将如何从中获益。元宇宙将为每个个体和企业提供一个充满可能的世界。了解这些可能性可能帮助你比竞争对手领先一步。如果你今天仅仅将其视为一种互联网趋势，那么当革命来临时，你就会被抛弃。到这本书结束时，你将对这一未来性创新有彻底的理解，并掌握多种在这个虚拟新世界中投资、赚钱和使用资金的方法。


    我本身就是一名投资者，我知道决定是否应该押注这些新技术是多么困难。加密货币、区块链、NFT 和 Web3 将为元宇宙提供动力。这个主题可能复杂且令人困惑。我想帮助你明智地投资、赚钱和使用你的资金。我有信心，书中提供的方法、战术和概念将帮助你做出更好的财务决策，如果使用得当，它们可以帮助你创造一个安全的财务未来。那么，我们在等什么呢？让我们进入元宇宙吧。


    # 第一章：理解元宇宙


    这一代人的流行词可能是元宇宙。可以说，物联网将显著影响我们所知的日常生活。尽管它在 Facebook 将其名称更改为 `Meta` 之后才在互联网上流行起来，但专家们已经研究了很长时间。创建一个虚拟世界似乎很新，但它自
    20 世纪 90 年代初就已经存在了。


    ## 什么是元宇宙？


    为了介绍语境，“元宇宙”这个词是什么意思？虚拟和增强现实头设备通常将这种设想的互联网迭代版本描述为一个单一的、通用的虚拟世界。在《时代杂志》（Time Magazine）的定义中，元宇宙指的是一种数字社区。另一方面，元宇宙的当前概念统一了数字和物理领域。很少有东西像早期科幻小说中所想象的那样。这不是视频游戏；它是一个活生生的东西。组合发明：元宇宙使用了广泛的技术和趋势。我们可以预计物联网（`IoT`）、`5G`、人工智能（`AI`）和空间技术将通过使用
    `AR`、`VR` 和 `MR` 技术以及头戴式显示器（`HMDs`），在创建这个元宇宙中发挥重要作用。


    ## 元宇宙的组成


    在创建元宇宙时，多种技术需要协同工作。为了让元宇宙正常运行，所有这些技术必须整合。以下技术将为元宇宙提供动力：


    * 区块链和加密货币

    * 元宇宙现实

    * 人工智能

    * 三维重建

    * 物联网（`IoT`）


    ### 区块链和加密货币


    多个计算机节点共享一个名为 `blockchain` 的去中心化数据库。由于以数字格式存储信息，可以将 `blockchain` 视为一个数字数据库。它们提供了一种更开放、去中心化的方法来证明所有权并用户社区转移价值。与
    `blockchain` 关联的加密货币（如 `Bitcoin`）你可能会熟悉。得于加密货币，三维数字领域将能够定价。例如，游戏内货币 `MANA` 可用于购买
    `Decentraland` 中的虚拟土地。使用虚拟货币，你将能够作为 `NFTs` 购买土地。为了验证和保护这些 `NFTs` 的所有权，我们将使用 `blockchain`
    技术。元宇宙如 `Decentraland` 一样，预计将在各种加密货币上运行。元宇宙和加密货币都是中心化未来的关键组成部分。


    ### 元宇宙现实


    作为一个虚拟世界，元宇宙预计将具有参与感和沉浸感。进入虚拟世界的门户很可能是`增强现实`、`虚拟现实`和`混合现实`。`虚拟现实`和`增强现实`让我们能够想象未来的元宇宙。元宇宙的发展很大程度上取决于这些技术的演变。元宇宙公司正在投入数亿美元开发
    `AR` 和 `VR` 硬件和软件。在书的后面，我们将详细讨论这些技术。


    ### 人工智能


    人工智能（`AI`）长期以来一直是现实。它的许多应用包括商业策略、决策复杂性和计算速度。`AI` 可以在毫秒内处理大量数据。人工智能（`AI`）可以作为玩家角色（`NPCs`）用于元宇宙。所有游戏都有
    `NPCs`，它们是对玩家动作做出响应并交互的虚拟角色。具有人工智能的 `NPCs` 也可以放置在三维数字世界中与用户进行对话。同样，元宇宙将因此变成一个更好的地方。这只是
    `AI` 在元宇宙中使用的例子之一，但它 `AI` 在物理世界中使用的例子之一。


    ### 三维重建


