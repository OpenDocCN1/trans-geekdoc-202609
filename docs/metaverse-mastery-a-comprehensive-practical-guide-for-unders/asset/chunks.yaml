    如果投资者使用元宇宙代币，投资元宇宙可能会变得更容易，代币是元宇宙中主要的支付形式。本文写作时，`MANA` 的市值为 41 亿美元。随着元宇宙采用率的提高，元宇宙代币的价值预计将上升。然而，加密加密一样，元宇宙代币的价值可能会波动。因此，通过购买元宇宙代币作为投资，元宇宙投资者承担了代币价格波动的风险。


    ### 购买游戏内 NFT 或虚拟土地


    元宇宙的投资机会现在包括虚拟房地产，该领域已脱颖而出。你可以在类似于视频游戏的元宇宙环境中创建并交易资产以及直观的体验。在元宇宙平台上，你可以学习如何使用游戏内
    NFT 和虚拟土地块来投资元宇宙。


    通过注册元宇宙账户来购买 NFT 和虚拟土地。例如，在 `Decentraland` 中买卖虚拟土地很容易，在 `Sandbox` 中买卖 NFT 艺术，在
    `Axie Infinity` 中出售 NFT 角色和虚拟土地块。


    此外，通过 NFT 和虚拟土地投资元宇宙也会带来一些严重的后果。非同质化代币的价值不是预先的，可能会受到多种变量的影响，例如稀缺性。但通过一级和二级 NFT
    市场购买 NFT 或虚拟土地块既有优点也有缺点。


    在一级 NFT 市场（如元宇宙平台）上可以保证 NFT 更高的转售价值。另一方面，投资者可能难以确定一级市场中 NFT 的真实价值。二级市场（如 `OpenSea`）确保你可以比较价格并获取有关所有
    NFT 的信息。


    此外，虚拟房地产的日益普及表明，投资元宇宙加密货币可以变得简单。许多企业正投入数百万美元获得数字领土的股份。NFT 项目 `Pavia` 最近售出了其待售的
    100,000 个虚拟土地块中的 60%。


    你不能错过 `Decentraland`，它的流通量接近 3600 万个 `MANA`。`Sandbox` 是一个像 Snoop Dogg 这样的名人正在其中创建虚拟物业的元宇宙。由于这些因素，虚拟土地
    NFT 和游戏内 NFT 作为投资机会看起来很有前景。


