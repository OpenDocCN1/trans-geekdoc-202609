    第四章


    # 虚拟现实


    人们可以使用计算机建模和模拟在虚拟现实（VR）中与三维（3D）视觉或感官人工环境进行交互。结果是使用计算机技术创建了一个可以全 360 度探索的虚拟世界。为了描述可供多个用户探索和交互的
    3D 计算机环境，我们使用虚拟现实这一术语。虚拟现实系统使用电子头盔来创建真实的图像、声音和其他感觉，以模拟用户的实际物理存在。用户被传输到一个 3D 环境中，在环境中他们可以自由移动和交互以完成预定义的任务并实现目标，例如由设计师创建的虚拟博物馆。


    虚拟现实（VR）创建了一个计算机模拟环境，其中你不仅是一个被动的参与者，还是利用尖端图形、尖端硬件和艺术渲染体验的同谋。

