    元宇宙并不意味着必须使用虚拟现实头戴设备。大多数服务至少可以被头戴设备用户访问。因此，在线活动与完全沉浸在虚拟世界之间的界限可能会模糊。可穿戴 VR 设备很快将用于用于执行目前在智能手机上完成的任务。如果
    Facebook 的元宇宙像他们预期的那样流行，VR 可能会不再仅仅是一个小众产品。


    ## 元宇宙将不会局限于虚拟现实技术。


    延续上一点，元宇宙将不会被限制在纯数字环境中。相反，它可以通过增强现实设备以及你已经拥有的任何其他连接互联网的设备来访问。这为许多无法通过虚拟现实实现的新功能开辟了道路。在未来，增强现实等技术将使将元宇宙元素引入物理世界成为可能。此外，还将创建虚拟空间，使用户可以在任何地方在不使用头戴设备的情况下进行访问。


    ## 元宇宙的潜力可能比 VR 大得多


    教育、治疗和体育都是虚拟现实应用的一个例子。然而，它仍然被认为是世界上最流行的娱乐形式。从规模上来说，元宇宙听起来非常像一个更好、更先进的互联网版本。虽然许多人忽视了虚拟现实，但元宇宙预计对人们与周围世界互动的方式产生深远影响。


    ## 潜力与应用


    与虚拟现实相比，元宇宙似乎具有更广泛的用途。虚拟现实现在被用于许多行业，包括体育教育和康复。然而，人们继续将其视为一种娱乐形式。与大众认知相反，元宇宙的应用潜力要大得多。事实上，它是比我们目前拥有的互联网更好的版本。它还有潜力改变人们工作、浏览互联网以及与社交媒体互动的方式。此外，尽管许多人尚未采用虚拟现实，但在元宇宙的情况下，这似乎不太可能。


    ## 元宇宙将如何新地使用 VR、AR 和 MR


    要记住，虚拟现实产品是单用途投资，所有者的资金得到了充分利用。可能会有一个机会将协作和互操作性机制开源，允许这些体验相互互动，并构建出比我们目前能实现的更新、更丰富的体验。如果能够成功吸引内容创作者参与多样化的创作社区，那么虚拟现实、增强现实、混合现实等的人机接口可能被用于创造数字生活的新水平。此外，它将不再仅仅是一个只有技术人员和游戏玩家聚集的地方。


    你将能够在元宇宙中做你目前通过视频和图形能做的事情。虚拟会议、多人游戏和会议电话只是其中的几个例子。其他较不明显的应用也可能从这些新技术中受益，这可能导致数百万人购买
    XR 设备。


    以下是几种可能性：


    ### 数字孪生或镜像世界


    当一个物理物体或空间以数字方式重新创建时，它被称为“数字孪生”（例如，通过使用 `IoT` 传感器）。你可能没有意识到，但你已经在使用一个了——`Google
    Maps` 是世界上大部分地区的简化版数字孪生。


    为了让我们能够通过 VR 头戴设备（甚至只是通过智能手机）上的虚拟现实技术来体验真实的元宇宙，我们需要创建一个数字孪生——一个供我们可以在其中移动的镜像世界。它可能像
    `Minecraft` 对现实世界地标的重建。工程师和科学家已经使用 `nVidia` 的 `Omniverse` 创建了极其逼真的 3D 数字孪生。


    我们能够在舒适的家中访问位于世界另一端的地方和人，无论其如何实现。工程师和建筑师还可能模拟现实世界中的威胁、计划中的建筑可视化、交通和其他状况。可能甚至是实时的。


    然而，请记住，这些数字孪生还不是元宇宙，即使由于虚拟现实或混合现实设备使得它们变得真实且完全沉浸式。


    ### 增强现实中的虚拟培训和程序


    工程师、医学生和医生、城市规划师和气候科学家都是今天工作中使用 XR 技术的人士的少数例子。公司越来越多地转向虚拟现实和增强现实来远程培训员工，无论是工作场所安全培训、电网维护还是开放心脏手术。


    ### 虚拟房地产和城市开发


    一些投资者认为，随着物理世界房地产市场变得越来越遥不可及，我们将把盖房的幻想带到元宇宙。在数字世界中，我们使用的数量或空间没有物理限制。


    ### 虚拟现实中的社交生活


    由于过去几年社交距离的增加，许多人被说尝试在线，通常通过视频聊天。为了提供共享空间的幻象，虚拟活动和虚拟办公室平台随着时间的推移不断演变和创新。这些解决方案严重依赖于二维平面图和网站上的几次点击。


    在未来，得益于扩展现实技术，我们将能够感觉自己与正在交谈或观看表演的人处于同一个房间里。虚拟演唱会已经在 `Fortnite` 和 `Decentraland`
    中举行。

