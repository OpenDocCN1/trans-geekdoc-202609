    当你想到“未来科技”时，脑海中会浮怎样的画面？随着技术的不断演进，它将如何影响你十年后的生活？有些人想象了可以通过一个指令召唤的自动驾驶电动汽车。另一些人可能想象一个
    AI 乌托邦，在那里，机器人执行人类过去必须完成的琐碎劳动，将人们解放出来去应对生活中更困难的问题。


    人们还可能预见到一个他们能够设计自己现实的时代。戴上头戴设备，让他们就能在家里体验数千英之外足球场的氛围，即使他们正坐在自己的客厅里。戴着高科技眼镜，他们可以以全全息化身的形式与朋友聊天。他们甚至可以想象整个房间，走进去并调出环境模拟，就像身处于那里一样。虚拟现实（`VR`）和增强现实（`AR`）是普通人可能还没有机会体验的技术，但几乎每个人都能将它们想象成人类未来的一部分。这是有原因的。在电影、电视节目和书籍中，长期以来一直被虚拟现实的承诺所吸引——《头号玩家》中的
    `VR OASIS`（绿洲）、《矩阵》中的 `VR` 现实模拟、《星际迷航》中 `holodeck`（全息投影室）方位的环境重建。如今娱乐领域探索的不仅仅是魔法和想象力。


    至于 `VR` 和 `AR` 概念，它们确实存在。你可以戴上头戴设备，在家里就能到达世界的任何地方。无论你是谁，都可以做任何事情。你可以在家里观看直播体育赛事或演唱会。你可以在几秒内从一个星球跳到另一个星球，穿越整个太阳系。过去，公众被许下这类虚拟现实和增强现实（`VR/AR`）。然而，这种承诺到目前为止未能名其实际。


    然而，近年来，计算和制造技术已经跟上了虚拟现实和增强现实（`VR`）的承诺。科幻被带入了现实世界。谈到新科技时，亚瑟·C·克拉克（Arthur C. Clarke）曾说过：“任何足够先进的技术都与魔法无异。”虽然在中世纪时期使用
    `iPhone` 是可能的，但如果展示给过去的人看，它会被认为是一个神奇的画盒。高端消费级 `VR` 头戴设备的首次用户经常将这种体验描述为“魔法般的”。


    虚拟现实和增强现实（`VR` 和 `AR`）将在未来十年内对我们的生活产生深远影响。由于这些创新，我们社会的进程将发生彻底改变。但为了实现这一点，它们需要创造者的帮助——梦想家、创新者和魔法师。


    在深入研究虚拟现实和增强现实的细节之前，你需要对这些技术有一个基本的了解。当你阅读这一章时，你将学习如何区分各种形式的虚拟现实（`VR`）和增强现实（`AR`）。本章还包含了对我们如何到达技术历史这一点的快速回顾。最后，它讨论了
    `Gartner Hype Cycle`（高特纳技术曲线），这是一个预测虚拟现实（`VR`）和增强现实（`AR`）等新兴技术增长和变化的模型。


