    ### 增强虚拟现实


    增强虚拟（Augmented virtuality, AV）也称为合并现实（merged reality），这是一个在行业内尚未引起关注的术语。它基本上是典型
    AR 的相反。虽然“增强现实”（AR）通常指的是将数字对象集成到现实世界环境中，但“增强虚拟”（AV）指的是将现实世界集成到虚拟环境中。从现实世界流传输视频并将该视频置于虚拟空间中是
    AV 的示例，为现有的物理对象创建 3D 数字表征也是如此。


    ### 扩展现实


    我们目前为止讨论的所有技术都有一个统称：扩展现实（extended reality, 简称 XR）（包括 `VR`、`AR` 和 AV）。可以使用连续体来衡量一项技术的虚拟程度或真实程度。完全虚拟位于光谱的一端，而完全真实则位于另一端。XR
    涵盖了这一刻度的整个范围。


    虚拟现实和增强现实是涵盖了大量新兴技术的两个术语，也是本章的关注重点。大多数情况都可以归纳为这两个词。我对虚拟现实的定义包括任何为用户提供参与的、主要或完全数字化的体验的硬件/软件组合。任何被数字元素增强的现实环境都被称为增强现实（它可能与现实环境交互，也可能不会）。


    ## 简史


    美国科幻小说作家斯坦利·G·温恩姆（Stanley G. Weinbaum）在 1935 年写了一篇名为《皮格玛吕的眼镜》的故事，讲述了一个发明家创造了一种眼镜，让佩戴者能够触发“一部提供视觉、听、味觉、嗅觉和触感的电影”。这就是你的故事；你可以与角色互动并听到他们的回答；故事围绕你展开，而你是它的一部分。”在温恩姆开始写作时，计算机和电视还没有被发明。如果温恩姆回到现在，看到他对
    `VR` 的愿景与当前新兴技术的现状是如此相似，他可能会感到震惊。


    虚拟现实和增强现实拥有丰富且多样的历史，远超本文的范围。同时，对这些技术的各种形式进行概括观察，可能会为这些技术在不久后的发展方向提供一些线索。


    ### 虚拟现实之父


    根据被广泛认为是虚拟现实电影之父的 `VR` 先驱莫顿·海利格（Morton Heilig）的，一个名为“未来电影”的多感官电影院最早于 1955 年被构想。海利格创造了一个名为
    `Sensorama` 的机械街机，并为之制作了许多短片来吸引感官。今天的虚拟现实头戴设备具有立体 3D 显示、立体扬声器以及通过用户座椅震动提供的触觉反馈。


    海利格在开发出 `Sensorama` 后不久就申请了 `Telesphere Mask` 的专利，这是第一个头戴式显示器（HMD），它提供了立体 3D 视觉和立体声音。`Sensorama`
    笨重的座椅式结构比这个（相对）小的 `HMD` 更像今天的消费级 `VR` 头戴设备。


    ### 增强现实命名


    对于 1990 年制造的每架飞机，波音计算机服务研究部都被要求为波音现有的胶胶合板布线指令系统创建一个替代方案。根据考德尔（Caudell）和他的同事大卫·米泽尔（David
    Mizell）的建议，建筑工人可以使用头戴式显示器，将电缆的位置投影到多功能、可重复的板上。布线指令可以由工人自己佩戴，而不是为每架飞机使用单独的板。。“增强现实”这一术是由考德尔和米泽尔提出的。


    ### 早期虚拟现实的失败


    在 1993 年的消费电子展会（CES）上，世嘉宣布了用于当时非常流行的游戏主机 `Sega Genesis` 的 `Sega VR` 头戴设备。1993
    年秋，世嘉最初计划以 200 美元的价格交付该设备，这在当时是一个合理的价格。然而，该系统一直受到开发问题的困扰，从未向公众开放。对于当时的世嘉首席执行官汤·卡林斯基（Tom
    Kalinske）来说，由于测试人员出现了严重的头痛和晕动症，`Sega VR` 被搁置。


    游戏行业最著名的名字之一也决定加入其中。任天堂的 `Virtual Boy` 是发布的第一款便携 3D 设备。任天堂希望通过鼓励在传统的 2D 屏幕空间之外进行游戏开发，`Virtual
    Boy` 能让公司成为一个创新者。然而，`Virtual Boy` 也深受开发问题的困扰。


    任天堂决定在 `Virtual Boy` 中坚持使用红色 LED，因为公司对彩色 LCD 的最初测试导致了图像“跳跃”。此外， `Virtual Boy`
    最初是一个追踪头戴式系统。由于对儿童晕动症的担忧以及患斜视的风险，还开发了一个桌面版本。批评人士对其大加抨击。在上市的一年里，它未能达到销售目标并很快被停产。几十年来，由于这些早期的失败以及创建大众市场
    `VR` 设备的其他失败尝试，`VR` 的进展被局限于研究实验室和学术界。


    ### 虚拟现实的突破


    在 2010 年对现有的 `VR` 头戴设备表示不满后，科技企业家帕尔默·卢基（Palmer Luckey）着手创建了自己的设备。高昂的成本、巨大的重量、狭窄的视野和高延迟导致了糟糕的终端用户体验，所有因素结合使得它们昂贵得令人望而却步且笨重。


    这种挫败感产生的反应导致了卢基开发了一系列原型 `HMDs`，每台的设计目标都是：廉价、低延迟、广视野且重量舒适。他在众筹网站 Kickstarter 上提供的第六代设备
    `Rift Development Kit 1` 被命名为 `Oculus Rift (DK1)`。在 Kickstarter 活动中，几乎实现了原始目标的
    980%，筹集了 240 万美元。值得注意的是，Kickstarter 活动帮助将消费者对虚拟现实的热情推到了前所未有的水平。


    ### 增强现实走向主流


    AR 的流行得到了一个意外来源的推动：智能手机。在诞生几十年后，AR 仍然处于阴影中，就像虚拟现实（`VR`）一样。2017 年，苹果和谷歌都为其运行 iOS
    或 Android 的各种手持移动设备发布了各自的 AR 版本，这使其获得了自诞生以来最大的公众认知提升。据估计，到 2017 年底，拥有 `ARKit`
    和 `ARCore` 能力的设备数量超过了 25 亿。


    在相对孤寂中工作的 AR 突然有了一个巨大的消费者市场来创作内容，开发者也开始竞争为该市场创作内容。


    ## 评估技术泡沫周期


