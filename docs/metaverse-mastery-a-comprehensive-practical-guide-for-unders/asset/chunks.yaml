    目前，现 AR 头显与目前的 VR 头显一样，无法满足消费者对高分辨率的预期。此外，遮挡不良是许多当前增强现实设备的问题（一个物体遮挡另一个物体的效果）。当我们谈论
    AR 中的遮挡时，通常是指物理物体遮挡了我们对数字物体的观察。这是像 `Pokémon Go` 这样的增强现实移动应用中存在的问题，你可能注意到：在某些场景中，`Zubat`
    似乎漂浮在地面上方，而在另一些场景中`Squirtle` 似乎被嵌入在墙体内。AR 中的遮挡没有正确实现，导致了这些视觉效果。可以将数字对象准确且真实地放置在现实世界的下方、部分遮挡后、上方或处于任何其他关系中。


    目前，`Magic Leap` 的演示视频显示出非常高的遮挡水平（尽管该设备尚未上市，我们无法预测量产设备是否能够达到其视频演示中设定的高标准）。


    桌子的顶部和侧腿完全遮挡了机器人的数字全息。如果 `Magic Leap` 的消费级设备能够复制这种水平的遮挡和图形保真度，就能将 AR 推向新的高度。如果在本章前面描述的无标记定向语境下看，这似乎并不多。如果机器人要被放在桌腿后面，模拟软件就需要对
    3D 空间有理解。它必须能够观察场景并确定什么应该在前景，什么在背景，以及数字全息图如何融入这一切。在桌子下面，它需要知道什么是“空间中的前方”，以及桌子的哪些部分比其他部分更近。这是一个艰巨的任务。


    # 第 9 章：虚拟与增强现实的未来


    自 2013 年 `Oculus DK1` Kickstarter 项目启动以来，虚拟现实（VR）的许多进展都受到那最初火花的推动，这使得 VR 成为了一个热门行业。一旦第二代硬件开始上市，第一代的动能将会消退，现实将开始接管虚拟现实。第二代会重复第一代的爆炸式轨迹吗？还是说热度会随着早期采用者被新的技术产品所吸引而消退？或者，VR
    会进入“启蒙之坡”，随着越来越多该技术的应用被揭示，它逐渐获得市场认可，还是它会掉落在中间的某个位置？


    无论好坏，VR 在未来几年内将经历巨大的变化。我将告诉你你可以在市场上预期到什么。你可能也想一下你如何能为这些变化做好准备。


    ## 虚拟现实的近未来变化


    应对未来未知的最佳方法是回顾你已经知道的。通过观察第二代 VR 头显、评估即将到趋势、回顾新的硬件配件并关注更前沿的初创公司，可以感受到市场向何处发展。


    ### 评估市场


    虚拟现实头显的第一代采用率是当前市场的一个常见批评。一些人认为，考虑到 VR 行业收到的巨额资金和媒体关注，它并没有获得充分的投资回报。虚拟现实的批评者将消费者采纳速度较慢视为一种失败。尽管这可能是一个合理的批评，但问题可能更多源于不现实的预期，而不是技术上的故障。当涉及到虚拟现实时，人们很容易受到热潮影响并期待即时见效。


    对于虚拟现实行业的人来说，这种较慢的采纳率可能会令人沮丧。他们渴望向世界分享他们的工作成果，但首先，世界必须追上他们的脚步。对于第一代设备，VR 的采用情况是合理的。另一方面，低端设备占据了销售额的大部分。这些设备没有问题，但
    VR 真正的变革力量取决于体验能提供多大的沉浸感。高端（以及更贵）的 VR 头显通常比廉价型号提供质量更好（更沉浸感）的 VR 体验。


    这可能会导致一个鸡生蛋蛋的问题。最具沉浸感的 VR 头显可能变得普通消费者可以负担起。在内容创作者获得最好的 VR 头显之前，还有很长的路要走。结果会导致一个自我维持的反馈循环：使用高端设备的人越少，他们的应用程序就越少，导致高端设备的市场份额越小。跳出循环可能是困难的。


    新技术在开发过程中遇到挫折是正常的。青春期的尴尬有助于塑造适应能力良好的人。尽管消费级 VR 仍处于婴儿阶段，但它已经证明了自己能够提供引人入胜的体验。用户体验似乎随着每一代变得越来越好。现在剩下的只是虚拟现实找到它的利基市场。最需求的属性是什么？市场对价格的最大容忍度是多少？但更有可能存在多个市场，每个市场都有可以服务的不同技能组合。


    将虚拟现实看作一个仍在寻找受众的产品可能有点奇怪。然而，数百万第一代设备已经售出，并且每天仍在被使用。Facebook 首席执行官 `Mark Zuckerberg`
    希望有十亿人体验虚拟现实。高远目标伴随着巨大的预期。为了达到如此大的观众，VR 需要识别其目标市场。


    ### 展望即将推出的硬件和软件


    然而，下一代虚拟现实软件、配件和其他沉浸式体验的选择会如何？这将如何影响消费者？虚拟现实催生了致力于让体验更有沉浸感的公司，随着头显的改进，相应的软件和配件也随之提高。无法预测虚拟现实产生的许多新行业中哪些能够长期生存并繁荣。由于其受欢迎，硬件制造商正在将第三方功能（如无线适配器）直接整合到下一代头显中。尽管眼动追踪等功能在可预见的未来已经在
    VR 头显路线图中，但它们可能仍将由第三方供应商提供。其他功能，如在虚拟现实中的嗅觉，可能在一段时间内只能作为第三方的插件存在。


