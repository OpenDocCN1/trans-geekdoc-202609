    尽管这不是该技术首次被使用，但 COVID-19 疫情将其推向了房地产市场的前沿，封锁导致潜在买家无法实地看房。从那时起，出现了几家利用 3D 重建技术提供房地产虚拟导览的机构。这就像元宇宙一样，因为买家可以从任何位置观察他们新家，而无需踏入内部即可购买。元宇宙的主要目标之一是创建一个尽可能接近现实世界的数字环境。然而，3D
    重建可以用于创建看起来真实且自然的场景。通过先进的 3D 相机，我们可以创建建筑和其他现实世界位置的精确、具有照片实感的呈现。数字孪生（Digital twins），或者说现实世界对象的虚拟副本，是这种虚拟副本的另一种术语。


    ### 物联网 (IoT)


    通过传感器和小型设备将物理世界连接到互联网是物联网（IoT）的目标。连接到互联网后，这些小设备或装置将具有唯一的标识符以及传输数据的能力。现在已经有恒温器、医疗设备和语音激活扬声器通过物联网连接到各种数据源。元宇宙中的一个物联网用例是物理世界数据的收集和分发。这将提高数字表示的准确性。某些元宇宙对象的行为可能会受到物联网数据流的影响，例如取决于当前天气或其他状况。现实世界的设备可以通过物联网（Internet
    of Things）无缝连接到 3D 环境。因此，现在可以运行实时模拟了。物联网收集的数据可以通过人工智能和机器学习的应用来改进元宇宙环境。


    ## 元宇宙历史


    一个去中心化的新世界为个人、企业和全球开启了许多新可能性。尽管它看起来像是一个未来的概念，但它已经存在很长时间了。尼尔·斯蒂芬森编写的《雪崩解》（`Snow
    Crash`）是“元宇宙”一词首次被使用的地方。在连接物理世界和数字世界方面，这本书是你的最佳选择。这部由尼尔·斯蒂芬森于 1992 年出版的小说被广泛认为是该领域的先驱。


    小说中使用了类似于如今 VR 头戴设备的电子眼镜和个人终端来访问虚拟世界。由 Linden Lab 于 2003 年创建的虚拟在线世界 `Second Life`
    让这一概念变成了现实。尽管它的灵感来自《模拟人生》（`The Sims`）等视频游戏，但这个世界与虚拟世界完全不同。用户从日常生活中解放出来，可以逃到复杂的奇幻世界中，在他们可以扮演各种新身份。


    Linden Lab 的虚拟世界在第一年吸引了 15,000 名新成员。作为一个逃避现实的地方，该游戏迅速发展，包含了游戏内货币、所有权、广告和其他功能。尽管键盘和鼠标控制偶尔有出色的表现，但由于其巨大的潜力，它们仍无法跟上用户的需求。`Second
    Life` 是创建类似元宇宙事物的重要第一步，这一事实使我们将其归为此类。当欧内斯特·克莱恩（Ernest Cline）于 2009 年出版他的反乌托邦小说《玩家一》（`Ready
    Player One`）时，世界正受到社会、经济和气候变化问题的困扰。逃避现实的唯一理想方式就是访问“绿洲”（Oasis），一个虚拟世界。2018 年 3
    月 29 日标志着该小说的电影改编版的发行，而该小说此前在 2013 年已出版。提到这本书是因为它紧密地反映了目前的元宇宙愿景。除了书中的末日元素外，元宇宙和绿洲之间存在惊人的相似之处。它让我们领略了元宇宙最终形态的感受。硅谷的先驱们受到了这部电影/小说的启发。在《玩家一》上市不到两年后，`Oculus`
    就以少于 20 亿美元的价格被 Facebook 收购。


    `Oculus` 由虚拟现实先驱帕尔默·卢基基（Palmer Luckey）创立。`Oculus` 被 Facebook（现为 Meta）收购对当时来说是个谜团，这出于几个原因。在
    2011 年，虚拟现实还不是热门话题，而且 Facebook 主要是一家软件公司，因此他们收购 VR 公司似乎并不合理。然而，没有人理解扎克伯格更宏大的愿景意味着什么。在收购之后，企业开始意识到虚拟现实的重要性，进展也快了起来。许多企业，特别是游戏行业的企业随之行动，并随后引入了新的
    VR 体验。`Nintendo`、`Roblox` 和 `Epic Games` 都被提及。


    然而，微软和 Meta 这两个全球最有影响力的科技公司提供了比这些平台更有说服力的元宇宙采用证据。被称为“Mesh”的微软的新现实技术将使协作变得容易得多。它类似于元宇宙，但专门用于办公场所。`HoloLens`
    这一与其他公司合作的混合现实头戴设备将首个使用 Mesh。当 Facebook 改名为 Meta 时，引发了相当大的争议。


    作为虚拟现实的门户，该公司正在开发最廉价且易于使用的 VR 头设备。马克·扎克伯格将元宇宙视为互联网的下一次演进，并愿意投入数十亿美元来实现它。


