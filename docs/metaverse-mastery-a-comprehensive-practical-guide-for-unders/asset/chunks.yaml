- fmt: '

    What images come to mind when you think of "the technology of the future?" As
    technology continues to evolve, how will it impact your life in ten years'' time?
    Some people imagine self-driving electric cars that can be summoned at the command
    of a single word. Others may envision an AI utopia in which robots perform the
    menial labor tasks that humans have had to do in the past, freeing people up to
    tackle life''s more difficult problems.


    People may also envision a time when they will be able to design their own realities.
    Putting on a headset allows them to experience the atmosphere of a soccer stadium
    thousands of miles away, even if they''re sitting in their own living room. Wearing
    a pair of high-tech glasses, they could chat with their friend in the form of
    a fully-realized holographic avatar. They may even imagine an entire room where
    they could step in and dial up an environment simulation as if they were actually
    there. Virtual reality (`VR`) and augmented reality (`AR`) are technologies that
    the average person may not have had the opportunity to experience yet, but nearly
    everyone can envision them as a part of humanity''s future. There''s a reason
    for that. In movies, TV shows, and books, we''ve been sold on the promise of virtual
    reality for a long time—the `VR OASIS` of `Ready Player One`, the `VR` real-world
    simulations of `The Matrix`, the full-blown environmental recreation of the `holodeck`
    from `Star Trek`. It''s not just magic and imagination that''s being explored
    in entertainment these days.


    As far as `VR` and `AR` concepts go, they''re out there. You can wear a headset
    and be anywhere in the world from the comfort of your home. Whoever you are, you
    can do anything. It is possible to watch live sporting events or concerts from
    the comfort of your home. You can jump from planet to planet in a matter of seconds,
    traversing the entire solar system. In the past, the public has been promised
    these kinds of virtual and augmented reality (`VR/AR`). However, this promise
    has so far failed to live up to the hype.


    In recent years, however, computing and manufacturing technologies have caught
    up with the promises of virtual reality and augmented reality (`VR`). Science
    fiction has been brought into the real world. When it comes to new technology,
    Arthur C. Clarke once stated, "Any sufficiently advanced technology is indistinguishable
    from magic." While it''s possible to use an `iPhone` in medieval times, it would
    be considered a magical picture box if it was shown to a person in the past. First-time
    users of high-end consumer `VR` headsets frequently describe the experience as
    "magical."


    Virtual and augmented reality (`VR` and `AR`) will have a profound impact on our
    lives within the next decade. As a result of these innovations, our society''s
    course will be drastically altered. But in order to do so, they require the assistance
    of creators — dreamers, innovators, and magicians.


    Before diving into the nitty-gritty of virtual reality and augmented reality,
    you need a basic understanding of these technologies. As you read through this
    chapter, you''ll learn how to distinguish between various forms of virtual reality
    (`VR`) and augmented reality (`AR`). Also included in this chapter is a quick
    look back at how we got to this point in technological history. Finally, it discusses
    the `Gartner Hype Cycle`, a model for predicting the growth and change of emerging
    technologies like virtual reality (`VR`) and augmented reality (`AR`).


