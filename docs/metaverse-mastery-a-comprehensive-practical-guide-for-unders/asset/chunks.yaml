  raw: 'What images come to mind when you think of "the technology of the future?"
    As technology continues to evolve, how will it impact your life in ten years''
    time? Some people imagine self-driving electric cars that can be summoned at the
    command of a single word. Others may envision an AI utopia in which robots perform
    the menial labor tasks that humans have had to do in the past, freeing people
    up to tackle life''s more difficult problems.


    People may also envision a time when they will be able to design their own realities.
    Putting on a headset allows them to experience the atmosphere of a soccer stadium
    thousands of miles away, even if they''re sitting in their own living room. Wearing
    a pair of high-tech glasses, they could chat with their friend in the form of
    a fully-realized holographic avatar. They may even imagine an entire room where
    they could step in and dial up an environment simulation as if they were actually
    there. Virtual reality (VR) and augmented reality (AR) are technologies that the
    average person may not have had the opportunity to experience yet, but nearly
    everyone can envision them as a part of humanity''s future. There''s a reason
    for that. In movies, TV shows, and books, we''ve been sold on the promise of virtual
    reality for a long time—the VR OASIS of Ready Player One, the VR real-world simulations
    of The Matrix, the full-blown environmental recreation of the holodeck from Star
    Trek. It''s not just magic and imagination that''s being explored in entertainment
    these days.


    As far as VR and AR concepts go, they''re out there. You can wear a headset and
    be anywhere in the world from the comfort of your home. Whoever you are, you can
    do anything. It is possible to watch live sporting events or concerts from the
    comfort of your home. You can jump from planet to planet in a matter of seconds,
    traversing the entire solar system. In the past, the public has been promised
    these kinds of virtual and augmented reality (VR/AR). However, this promise has
    so far failed to live up to the hype.


    In recent years, however, computing and manufacturing technologies have caught
    up with the promises of virtual reality and augmented reality (VR). Science fiction
    has been brought into the real world. When it comes to new technology, Arthur
    C. Clarke once stated, "Any sufficiently advanced technology is indistinguishable
    from magic." While it''s possible to use an iPhone in medieval times, it would
    be considered a magical picture box if it was shown to a person in the past. First-time
    users of high-end consumer VR headsets frequently describe the experience as "magical."


    Virtual and augmented reality (VR and AR) will have a profound impact on our lives
    within the next decade. As a result of these innovations, our society''s course
    will be drastically altered. But in order to do so, they require the assistance
    of creators — dreamers, innovators, and magicians.


    Before diving into the nitty-gritty of virtual reality and augmented reality,
    you need a basic understanding of these technologies. As you read through this
    chapter, you''ll learn how to distinguish between various forms of virtual reality
    (VR) and augmented reality (AR). Also included in this chapter is a quick look
    back at how we got to this point in technological history. Finally, it discusses
    the Gartner Hype Cycle, a model for predicting the growth and change of emerging
    technologies like virtual reality (VR) and augmented reality (AR).


    ## VIRTUAL REALITY AND AUGMENTED REALITY


    Many different immersive experiences are referred to as "virtual reality," including
    augmented reality, mixed reality, and extended reality. The term "virtual reality,"
    as used in this chapter, refers to a computer-generated simulation of reality
    that creates an artificial physical environment. Typical virtual reality environments
    are isolated from the real world in that they are constructed entirely from scratch.
    There is no physical connection between the digital worlds and the places they
    are based on, such as the summit of Mount Everest or the underwater city of Atlantis.


    Viewing the real world while "augmenting" it with computer-generated input such
    as still images, audio, or video is known as augmented reality, and it can be
    achieved in two ways: either directly or via a device like a camera that creates
    a visual of the real world. In contrast to virtual reality, augmentation (adding
    to) rather than creation (creation from scratch) is the hallmark of augmented
    reality.


    The computer-generated content in AR is an overlay on top of the real-world content,
    according to the strict definition. Neither of the environments can communicate
    or respond to the other in any way. A more blended hybrid known as mixed reality,
    which combines elements of the real world and digital content, has been co-opted
    in recent years by the AR community.


    The term "augmented reality" refers to both augmented reality and mixed reality
    in this chapter. Both terms are often used interchangeably in the industry, and
    mixed reality is quickly becoming a more descriptive term for the combination
    of analog and digital realities. Likewise,


    ## OTHER TYPES OF VIRTUAL AND AUGMENTED REALITY


    For now, it''s hard to tell which terms will become obsolete and which ones will
    gain traction in the coming year due to the fact that VR and AR are still at an
    early stage (s). While the terms "virtual reality" and "augmented reality" are
    here to stay, there is a slew of new terms to learn about.


    **Mixed reality**


    You may be able to interact with computer-generated content in your view of the
    real world using mixed reality (MR). An alternative is for the system to link
    real-world objects to a purely digital environment. As a result, MR can at times
    function like virtual reality and at other times function like augmented reality.
    When using AR-based MR, the digital world''s content can interact with the real
    world as if it were an actual part of it. Some digital objects can even be interacted
    with as if they were actually present in the physical world. You might be able
    to watch a digital rocket take off from your coffee table or bounce a virtual
    soccer ball off the real-world walls and floor.


    In reality, Apple''s ARKit and Google''s ARCore fall somewhere between AR and
    MR and reveal the naming discrepancy taking place in the AR and MR industry. However,
    despite the fact that they project a digital layer on top of the real world, they
    are also capable of scanning and tracking surfaces in the real world. Using this
    technology, users can physically place digital objects in the real world, cast
    digital shadows on real-world objects, and adjust digital lighting to match the
    lighting conditions in the real world.


    An AR-based MR headset like the Microsoft HoloLens scans the real world and then
    adds digital objects to the mix. In comparison to Apple and Google''s current
    tablet offerings, this technology, which can also be found in Microsoft''s Meta
    2, goes a step further. Through the use of transparent visors, the virtual environment
    is projected onto the user''s eyes, and their hands can interact with it as if
    it were real.


    However, in other instances of MR, you may only see an entirely digital environment
    with no view of the real world, but this digital environment is connected to the
    real-world objects around you. Tables and chairs from the real world may appear
    as rocks or trees in your virtual world. In the real world, moss-covered cave
    walls can be seen on office walls. Virtual reality-based MR, or augmented virtuality,
    is what we''re looking at here.


    While MR allows for interaction with the digital world, the strict definition
    of AR does not allow for it. The industry, on the other hand, is blurring the
    lines between these two extremes. The term "augmented reality" is often used interchangeably
    with "mixed reality." Their significance will most likely evolve and grow as time
    passes. Unless otherwise stated, I use AR and MR interchangeably in this book.'
