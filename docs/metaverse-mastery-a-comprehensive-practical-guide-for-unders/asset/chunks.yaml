- fmt: '

    There are two types of immersion: mental and physical (or sensory). We''ve already
    mentioned this. For the most part, when people talk about "being immersed," they''re
    talking about the way it feels to be emotionally or mentally absorbed into the
    story. We use the term "physical immersion" interchangeably with "replacement"
    or "enhancement" of the participant''s senses in VR.


    As a result of being fully immersed in one''s surroundings, the term "sense of
    presence" is frequently used. Because there is still a lack of clarity on the
    meanings, relationships, and distinctions between these terms, it is difficult
    to use them effectively. As we begin this chapter, let''s take a look at what
    these three terms mean and how they''re used in context.


    *   Virtual reality is defined by its ability to immerse the user in a virtual
    world, while the goal of most media creators is to immerse the viewer in a virtual
    world through mental immersion.

    *   To be mentally immersed means to suspend disbelief and to be fully engaged
    in whatever it is that you are doing.

    *   This does not imply that the entire body is immersed or engulfed in the medium,
    nor does it imply that all of the body''s senses are stimulated.


    To describe these phenomena, we''ll use the terms mental and physical immersion.
    However, the VR community has also adopted the term "presence" to describe this
    concept (perhaps because of the prior use of the term telepresence). Our intended
    meaning might be better expressed with the term "sense of presence" rather than
    "presence" alone. To avoid confusion, we''ll use the term "mental immersion" to
    describe this concept.


    ### 3. Sensory Feedback


    By positioning their body in a certain way, participants can choose their vantage
    point and influence events in the virtual world, unlike in more traditional media.
    A media experience that does not include these features is less compelling than
    one that does. We won''t get into the philosophical debate about what reality
    is, but we will consider that there may be more than what we can see and hear
    with our unaided senses. Physical reality is the term we use to describe the latter.
    Our thoughts, dreams, and secondhand experiences in novels, films, radio, and
    so on are all examples of imagined reality. Diegesis is the term used to describe
    the process of imagining ourselves in the context of the medium. A medium''s diegesis
    includes places and events that are implied to exist or have occurred but are
    not explicitly shown. To experience virtual reality, we use less of our own imagination
    and rely more on the imagination of the content creator, which is why virtual
    reality is becoming increasingly popular. It is a medium that allows us to experience
    a simulated reality that is as close as possible to the real thing. Additionally,
    virtual reality can be used to reduce the dangers of physical reality and to create
    scenarios that are impossible in the real world.


    An essential component of virtual reality is sensory feedback. The VR system provides
    participants with immediate sensory feedback based on their physical position
    in the virtual world. Virtual reality environments that exclusively display haptic
    (touch) experiences do exist, but they are rare. Most feedback is received in
    the visual sense. As a mediating device, computers with high processing speeds
    are necessary for obtaining immediate interactive feedback. Tracking a user''s
    movement is necessary for a VR system to use its position as the basis for its
    sensory output. The participant''s head and at least one hand, or an object in
    hand, are typically tracked by a typical VR system. Most major joints can be tracked
    by advanced systems. Tracking in virtual reality can be accomplished using a variety
    of technologies.


    Computerized sensing of the physical world''s position (location and orientation)
    is a good definition of position tracking.


    ### 4. Interactivity


    VR must be interactive in order to be convincingly convincing as a genuine experience.
    As a result, interactivity is an essential part of any comprehensive definition
    of virtual reality. With the addition of a computer, interactivity is more easily
    achieved. It is possible to create alternate realities through the use of computers
    in a variety of contexts.


    These alternate realities do not necessitate the use of computer graphics. Classic
    computer games such as `The Oregon Trail`, `Adventure` and `Zork` (originally
    known as `Dungeon`) use only text to describe their environments. As the player
    types in command, the worlds respond to their commands, making the player feel
    like they''re a part of them. In these imaginary worlds, the player interacts
    with objects, characters, and places.


    Interactive fiction is a term now used to describe the medium of authored, text-based
    interactive worlds (`IF`). One example of interactivity is the ability to influence
    a computer-based world. The ability to alter one''s point of view within a world
    is another variation on this theme. It is possible to define interactive fiction
    as a form of storytelling in which the player is able to manipulate the world
    around them by moving around, picking up and placing objects, and so on. Virtual
    reality is more closely associated with the participant''s ability to move physically
    within the world, gaining a new perspective by moving the head. `IF` and `VR`
    may be defined by a single type of interaction, but both mediums can utilize the
    other type of interaction.


    As true as it may be, much virtual reality (`VR`) experiences are built with static
    worlds that cannot be modified by the user. Computational simulations are used
    to create artificial realities that represent a subset of the real world. As a
    result of these models, a large number of numerical values representing the state
    of the world over time can be generated. This could be done by using current weather
    conditions to solve mathematical equations that describe a thunderstorm and then
    translating these equations into visual representations of the storm.


    ### Collaborative Environment


    Multi-user interaction within a single virtual space or simulation is what we
    mean when we talk about a collaborative environment. Users are able to interact
    with each other in the simulation because they can see each other. A user''s `avatar`
    is a representation of themselves.


    For many VR applications, including those in combat simulation/practice and the
    VR game industry, this is a critical feature that allows for team play and human
    opponents. Other participants increase the difficulty of a situation by being
    unpredictable. Other VR applications will benefit from it as well. Because of
    the convenience of virtual prototyping, designers located all over the world can
    communicate and collaborate virtually. Multiple surgeons can watch an operation
    from the same vantage point while using telepresence surgery, and in some cases,
    they can transfer control to another participating surgeon.


    There are times when it is critical to know where the other people in the room
    are, how they are looking/pointing, and their words when engaging in a shared
    experience. User representation in a virtual world is denoted by the Hindi word
    `avatar` (which means the worldly manifestation of a deity). A person''s live
    video image can be used as part of or the entire avatar representation in some
    cases.


    It''s not just virtual reality that allows for multi-presence; it''s also possible
    to experience the phenomenon in non-VR contexts. Because there are two or more
    participants in a telephone call, it would also be considered a multi-presence
    virtual environment. As a result of this phenomenon, the term "cyberspace" was
    coined.


    ### Combining the Elements


    Taking into account all of these components yields a more accurate definition:

