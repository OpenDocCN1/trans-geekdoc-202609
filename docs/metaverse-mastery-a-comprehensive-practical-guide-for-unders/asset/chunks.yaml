    \ term.\n\nAs soon as you can get your hands on virtual reality or augmented reality\
    \ devices, or if you want to start creating content for these technologies, now\
    \ is the time to do so.\n\nCHAPTER 7 \n\n# EXPLORING THE CURRENT STATE OF VIRTUAL\
    \ REALITY\n\nBeing a part of VR development at a time when technology is constantly\
    \ evolving is both exciting and frenetic. It's critical to pause and assess where\
    \ things stand right now. Within the next year or two, are we on a collision course\
    \ with the peak of the fourth wave of technological change? In other words, is\
    \ the current VR cycle just another misstep in the development cycle of virtual\
    \ reality?\n\nAre we about to enter another decade of virtual reality wallowing\
    \ in the \"Trough of Disillusionment?\" after a promising rise and subsequent\
    \ washout that leaves companies high and dry? Many industry insiders predict that\
    \ virtual reality (VR) will become widely used by the years 2021 to 2023. Many\
    \ of the issues that exist today will be resolved by then, as VR headsets will\
    \ likely be in their third or fourth generation of technology.\n\nThis section\
    \ examines the current technological landscape (as of this writing). Many devices\
    \ of the first generation have been released, and many devices of the second generation\
    \ (or first and a half-generation) have been announced as well. Realizing where\
    \ VR now helps you make your own predictions about the future of technology, allowing\
    \ you to assess where we are in the VR cycle on your own\n\n## THE AVAILABLE FORM\
    \ FACTORS OF VIRTUAL REALITY\n\nAlthough there are a number of different types\
    \ of virtual reality headsets, they all appear to share the same basic design.\
    \ VR experiences may indeed benefit from this form factor, but it could also be\
    \ a sign of a lack of innovation in mass consumer devices if there is not more\
    \ variety in hardware implementations. VR's form factor may change completely\
    \ in the future. For the time being, the majority of VR systems are implemented\
    \ as head-mounted displays, but each company has developed its own design for\
    \ how that form factor should appear and function.\n\nThe book's main focus is\
    \ on the consumer head-mounted displays (HMDs) with the largest user base in order\
    \ to keep the book's focus manageable and concise. Oculus Rift, HTC Vive, Windows\
    \ Mixed Reality, Samsung Gear VR, PlayStation VR, Google Daydream and Cardboard\
    \ are the only ones on the market at the time of writing. At the moment, these\
    \ are the most widely available first-generation consumer VR headsets, but that\
    \ may change in the future. Many of the evaluation criteria I include here are\
    \ likely to be shared by any new headset that comes along. The same criteria can\
    \ be applied to many of the upcoming second-generation devices. You'll be able\
    \ to evaluate any new hardware that comes out if you're familiar with the various\
    \ options, benefits, and drawbacks of different hardware implementations.\n\n\
    HTC Vive and Oculus Rift are currently at the top of our VR experience graph for\
    \ consumers. It is without a doubt that they provide some of the most immersive\
    \ virtual reality experiences to date. The headsets themselves, as well as the\
    \ separate hardware needed to power them, aren't free.\n\nIn the same league as\
    \ the Vive and the Rift, Microsoft's Windows Mixed Reality VR headsets are now\
    \ available. However, don't be fooled by the name. Microsoft's virtual reality\
    \ headsets are referred to as \"Mixed Reality\" in the company's marketing, but\
    \ there is nothing \"mixed reality\" about them at this time. Will a pass-through\
    \ camera image of the surrounding environment allow the products to function as\
    \ both a VR headset and an augmented reality (AR) headset in the future?"
