  trans: '


    -   虚拟现实通过使用交互式计算机模拟来跟踪参与者的位置和动作，并向一个或多个感官提供反馈，而不是传统的感官反馈，创造出一种物理上存在于模拟（虚拟世界）中的幻象。


    根据这个定义，虚拟现实的从业者将能够区分在该媒介使用的许多不同类型的设备。


    在现代计算机系统中，可以使用额外的硬件设备来提供用户位置感知、感官显示以及适当交互的编程，以满足定义中描述的场景。头盔，也称为头戴式显示（`HMDs`），可能允许也可能不允许用户看到周围的情况。


    根据型号的不同，头盔可能有一个单屏屏幕或两个屏幕（每个眼睛一个）。得助于连接在头部的跟踪传感器，计算机系统可以知道参与者正在看哪里。计算机可以在几秒钟显示参与者位置的视觉表示。因此，在当前技术的局限下，参与者可以以尽可能自然和直观的方式探索计算机生成的世界。在这样的系统中可以引入额外的设备，使参与者能够以多种方式与世界交互。语音识别和连接到计算机的手套允许他们通过声音和世界中物体的运动与世界进行交互。


    创建一个虚拟现实体验可以通过多种方式实现，包括将用户放在由计算机生成的图像包围的虚拟现实房间内。通常，这是通过后投影法将计算机图形投影到大型固定屏幕上完成的。例如，芝加哥伊利诺大学分校电子可视化实验室的`CAVE`系统[`Cruz-Neria
    et al. 1992`]是为人知的。即使参与者只部分沉浸在视觉中，这种体验仍然引人入胜。


    虚拟现实（`VR`）并不总是一种视觉体验。外科医生可以使用连接计算机的医疗仪器与虚拟患者交互。


    为医生的手提供触觉反馈（阻力和压力）的设备模拟器器在器官上的感觉，跟踪医生的手。


    ## 人工现实


    人工现实是用户可以参与的交互式环境的另一个术语。“人工现实”这一术语由 Myron Krueger 创造，用来描述他的研究，现在通常被称为“虚拟现实”。他的第二本书《Artificial
    Reality II》中的大量内容都致力于探讨人工现实与艺术和技术的关系这一主题。在 Krueger 的词表中，他对人工现实的定义如下（我引用一下）：


    -   在人工现实中，身体与图形世界的关系被解释为参与者的动作以及生成的响应，这些响应维持了他或她的动作正在该世界内发生的幻象。


    ## 虚拟


    “Virtual”（虚拟）一词经常被用来暗示涉及虚拟现实技术，因为围绕着虚拟现实的热度。。“virtual”一词并不意味着它是虚拟现实，但这也不意味着它就是虚拟现实。


    计算机系统的名称可以包含“virtual”一词，表示系统的某些组件是硬件的扩展，通过不同的来源模拟真实物体。另一个应用是计算机生成的虚拟世界，在世界中物体看起来是真实的。可以在每个对象的名称中添加“virtual”一词，表示它仅仅是它所代表的物理对象的图像。在虚拟世界中，我们可以描述一个虚拟桌子和一个虚拟厨房。与其在虚拟现实中的用法类似，“virtual
    image”（虚像）一词在光学领域用于描述通过透镜或镜子看起来存在的物体。


    ## 虚拟世界


    虚拟环境和虚拟世界是两个经常被误解的术语。虚拟现实和虚拟世界之间是什么关系？“虚拟现实”和“虚拟世界”通常都被称为“虚拟环境”。然而，“虚拟环境”这个术语已经存在很久了。可以将虚拟环境定义为虚拟世界或虚拟现实硬件配置。


    ## 网络空间


    “Cyberspace”（网络空间）这一术语对于理解这些术语也很重要。人们多年来一直通过技术（例如电话）相互通信。结果是，一种新的网络空间诞生了。William
    Gibson 在 1984 年的小说《神经漫游》中首次使用了“cyberspace”一词来描述未来的计算机网络。


    虚拟现实并不等同于网络空间。虽然虚拟现实可以在网络空间中被使用，但它并非必须的。有许多简单的文本、语音或视频的例子。互联网上可以找到许多其他例子，例如实时聊天论坛、`MUDs`、新闻组等。电话、无线无线电和视频会议都是这种通信的例子。


    有趣注意的是，这种新空间经常被视为真实的地方。在这里在那里，人们对“here and there”一词的使用非常突出。如果你想知道某是否参与了聊天论坛，你可以问：“Beaker
    在吗？”这指的是论坛创建的虚拟空间。在电视采访中主持人说“我们现在有专家 Honeydew”，这种现象也会发生。然而，那个人通常不在他们的演播室，而是在另一个大屏幕上。


    ## 增强现实


    在某些情况下，虚拟现实应用旨在将虚拟表示与真实世界的感知相结合。通过使用虚拟表示可以获得关于真实世界的额外信息。“增强现实”一词用于描述这种应用（`AR`）。特殊的显示技术用于
    `AR`，允许用户在真实世界之上叠加额外信息。这个词来自《新国际英语词典》（1989）对 augment 的定义：“增加尺寸或范围”。通过增强现实，我们为用户提供了比他们正常感官更多的数据。


    虚拟现实和增强现实一样，可以被认为是后者的子集。不是沉浸在物理现实中，而是进入了一个结合真实与虚拟的混合现实。在大多数情况下，视觉感觉得到了增强。需要建筑机械系统信息的承包商可以在步行建筑时，通过戴的计算机连接护目镜显示管道和风道的位置。未来，医生可能会使用
    `AR` 检查患者的内部器官，同时保持对患者全身的观察。


    可能的 `AR` 应用集中在修复生物或机械系统内部组件的想法上。增强现实在医学中应用的一种方式是向医生和患者显示身体内癌症组织的的确切位置。`AR` 还可以用于告知医生在紧急情况下从哪里切开。医学学生可能会从第三个应用中受益，如果它解释了如何正确进行切开。


