- fmt: "\nA mobile visual display is typically required for augmented reality, especially\
    \ if the user intends to move around in the enhanced world. Head-mounted displays\
    \ are the most common, but a palm-based display is possible as well. The virtual\
    \ overlay must be perfectly aligned to the real world onto which it is mapped\
    \ in order for AR to work. Registration is the term for this process.\n\n### Telepresence\n\
    \nVirtual reality (VR) technology is used in telepresence. Transducers such as\
    \ video cameras and microphones serve as a substitute for the participant's own\
    \ senses in telepresence. From a first-person perspective, the participant can\
    \ see and hear in a remote location thanks to remote sensing devices. The user\
    \ can interact and influence the remote environment through their actions. In\
    \ contrast to most forms of virtual reality, telepresence depicts the real world\
    \ rather than one created entirely by computers.\n\nVR technology can be used\
    \ to place the user somewhere else in space, such as in an adjoining room or a\
    \ neighboring planet. Telepresence is an application. The fact that so many VR\
    \ practitioners use the term \"presence\" is probably due to the fact that telepresence\
    \ was already a well-established term in the closely related field of remote control\
    \ operations before VR. The word tele means \"far away,\" while \"present\" refers\
    \ to the state of being \"here.\" Telepresence can be used to manipulate deep-sea\
    \ probes, handle hazardous chemicals, and control spacecraft operations.\n\nTelepresence\
    \ can be used to solve large-scale issues. Using minimally invasive techniques,\
    \ a doctor can perform an operation while being observed by a small video camera\
    \ implanted inside the patient's body. The doctor uses tools that translate the\
    \ doctor's movements outside the patient's body into relatively small cutting\
    \ and sewing operations inside the patient's body.\n\nYou can interact with a\
    \ physically real, remote environment from your first-person point of view; there\
    \ are no restrictions on the remote environment's location, and there are no restrictions\
    \ on the size of the device used to carry out your commands. \n\n#### First-person\
    \ telepresence\n\nThe term \"telepresence\" refers to a situation in which the\
    \ user is able to see the remote world through the lens of a remote device. As\
    \ opposed to remote control operation, teleoperation involves the use of a remote\
    \ device by the operator while viewing the remote device through an external camera\
    \ to interact with the environment.\n\nIt is distinct from television, where the\
    \ participant only observes and does not participate. As a result, teleoperation's\
    \ requirement for seeing the world \"live\" (i.e., synchronously) is not met.\
    \ In general, telepresence is thought of as providing an insider's perspective\
    \ on the world, whereas teleoperation is thought of as offering an outsider's\
    \ perspective.\n\nA model airplane can be used to demonstrate the difference between\
    \ telepresence and teleoperation. It's possible to experience your surroundings\
    \ virtually through telepresence, but it's much more difficult to do so from a\
    \ first-person point of view than it is to do so via simple remote (tele) operation.\
    \ If you're piloting a radio-controlled plane, you'll typically be standing on\
    \ the ground, watching the plane execute the command you sent it from outside\
    \ the vehicle. Inside the craft, an onboard camera must be installed so that the\
    \ user can see what it would look like from a pilot's perspective.\n\n## VIRTUAL\
    \ REALITY, TELEPRESENCE, AUGMENTED REALITY, AND CYBERSPACE\n\nComputer-mediated\
    \ interfaces to the real and virtual worlds are frequently conflated in terms\
    \ of the types of interfaces. The terms virtual reality, augmented reality, telepresence\
    \ and cyberspace have all been defined, but it is worthwhile to take a closer\
    \ look at the similarities and differences between these closely related expressions.\n\
    \nVirtual reality's cousins augmented reality and telepresence can be compared\
    \ to each other. The physical world is combined with digitally generated information\
    \ in augmented reality. The user can interact and influence the remote environment\
    \ through their actions. We can see and interact with the real world in augmented\
    \ reality (proximal). Telepresence allows you to see what's happening in the physical\
    \ world (distal). In contrast to virtual reality, telepresence uses input from\
    \ the real world rather than a computer-generated one.\n\nCyberspace and virtual\
    \ reality have a more nuanced relationship. Their distinguishing characteristics\
    \ appear to cross over into one another. Unlike in the real world, there is no\
    \ direct sensory substitution in cyberspace. When a person interacts with a virtual\
    \ world rather than with other people in the real world, it does not always fall\
    \ under our definition of \"cyberspace\" (which may not include other people).\n\
    \nVirtual worlds and communities are both examples of technology-mediated interactions.\
    \ To be in cyberspace is to be in constant contact with other people's minds.\
    \ Immersive sensory immersion in a computer-created virtual world constitutes\
    \ virtual reality. Although cyberspace isn't a distinct medium, it is a feature\
    \ of many media. The term \"cyberspace\" refers to the existence of a virtual\
    \ world in which multiple people (the \"we\") can interact and be fully immersed.\n\
    \n# CHAPTER 5\n\n# METAVERSE AND VIRTUAL REALITY\n\nWe've seen glimpses of virtual\
    \ worlds where people can take on any identity they want in many works of science\
    \ fiction. One of the most intriguing aspects of modern technology is the concept\
    \ of a virtual world in which you can escape from the real world. You've probably\
    \ been hearing a lot lately about the latest metaverse developments. However,\
    \ because of the strong ties between the metaverse and virtual reality, there\
    \ has been a lot of discussion about the differences between the two.\n\nPeople\
    \ who are unfamiliar with the metaverse assume that it is a virtual world that\
    \ can be accessed through virtual reality headsets. Is virtual reality the same\
    \ as metaverse? No. There's a lot to tell the metaverse apart from virtual reality.\
    \ In this chapter, you'll learn how to tell the difference between the metaverse\
    \ and virtual reality.\n\n## THE HYPE BETWEEN METAVERSE AND VIRTUAL REALITY\n\n\
    After major corporations began investing in the metaverse, it became one of the\
    \ most talked-about topics in the tech industry. Big companies like Facebook and\
    \ Microsoft are launching their own platforms into the metaverse to compete with\
    \ the likes of Google and Sony. Only after Facebook's October 2021 announcement\
    \ of its rebranding as Meta did the term \"metaverse\" begin to gain traction.\
    \ What motivated Facebook to take this action?\n\nIntriguingly, the company's\
    \ announcement that it has sold 10 million Oculus VR headsets marks an important\
    \ milestone in the debate between virtual reality and the metaverse. Using the\
    \ internet in virtual environments is a common metaphor used to describe the metaverse.\
    \ Virtual reality, on the other hand, would only be one part of an interconnected\
    \ metaverse. For the sake of clarity, let's learn more about the metaverse and\
    \ virtual reality.\n\n## THE METAVERSE\n\nIn a metaverse vs. virtual reality debate,\
    \ you need a thorough understanding of both concepts. In 1992, a sci-fi novelist,\
    \ Neal Stephenson, coined the term \"metaverse\" in his novel \"Snow Crash.\"\
    \ Stephenson describes the metaverse as a virtual world from which the protagonist\
    \ could escape the real world in his novel.\n\nThe main character entered the\
    \ metaverse as a new avatar, one that was utterly unlike his previous persona.\
    \ Many of today's definitions of the metaverse are based on Stephenson's original\
    \ concept. The metaverse is often referred to as the next step in the evolution\
    \ of the internet.\n\nIn a metaverse, users can explore and interact with a variety\
    \ of virtual spaces, content, and services in three-dimensional environments.\
    \ There is a creator economy being established in the metaverse as a result of\
    \ the ability it gives different users to create virtual spaces and solutions.\n"
