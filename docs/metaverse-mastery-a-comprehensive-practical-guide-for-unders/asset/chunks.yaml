  trans: '


    全球经济格局正在发生演变。在无货币虚拟经济中，金融科技（FinTech）和新时代技术已深根固，而 Web 3.0 将改变我们工作、学习、交易和互动的方式。对于
    Web 3.0 的数据分类和存储，将不再需要中央控制点。这种去中心化网络的安全和存储将得到区块链等分布式账本技术的帮助。Web 3.0 将没有准入门槛或权限限制。随着
    Web 3.0 的到来，我们将审视出现的大机遇。金融服务和资本市场将在不久后经历重大变革。技术历史的一个新纪元将开启，我们将共同见证这一切。


    # WEB 3.0 的主要组成


    ## 区块链网络


    Web3 的区块链技术是一个关键组件。Web3 构建在区块链技术之上，去中心化是其核心。区块链技术使数据能够分布、去中心化和开放。因此，用户可以自由交易自己的数据，无需担心丢失所有权、失去隐私或依赖中介。此外，你可以安全地通过互联网登录，而无人察觉。虽然
    Web3 仍处于婴儿阶段，但基于区块链的代币和虚拟货币将发挥重要作用。此外，用户通过公开其如何变现以及对在线改进的贡献，来获得对平台增长贡献的回报。


    ## 人工智能


    AI 的进步使得做出实用的预测，甚至是原本不可能的救命行动成为可能。Web 2.0 也有 AI 的参与，但只要大型科技公司控制着大部分互联网流量，它在很大程度上仍然是由人类驱动的。在数字时代，人为错误、某些互联网服务的偏见评分以及偏差的产品评论是不可避免的。大多数在线评论服务允许客户留下反馈。当企业雇佣大量人员为其产品或服务撰写极星评价时，真是一件遗憾。人们可能会付费对某个应用或服务给出相反的负面评价。Web
    3.0 的使命是让人更难实施此类攻击。因为人工智能有助于区分合法行为和欺诈行为，它是互联网中不可或缺的组件。


    ## AR 和 VR


    在元宇宙中与他人玩游戏是常见的消遣。对于这一应用，虚拟现实（VR）和增强现实（AR）是主要的平台。公司的区块链项目构建在同质化代币之上，例如用于购买虚拟土地或化身服装的代币。元宇宙仍处于婴儿阶段，仍然是一个进行中的工作。用户和技术人员对这项仍处于婴儿阶段的技术潜力感到兴奋。


    许多人对元宇宙的未来有很高的期望：


    *   Web3 的元宇宙技术将使用区块链系统和开放标准构建，它将运行在全球的计算机网络上，而不是单一实体。

    *   增强现实、虚拟现实和全息投影这三种技术将用于创建 Web3 应用。

    *   为了使虚拟现实交易可能，将使用 `NFT`。

    *   对元宇宙的访问将不受传统守门人的限制。


    # WEB 3.0 的特性


    下列表是 Web 3.0 的一些特性：


    ## 去中心化


    没有单一系统可以访问所有的 Web3 数据，因为它们存储在区块链中。它们分布在许多不同的媒介上。这种做法导致了访问去中心化并增加了失败的可能性。


    ## 无许可


    Web3 不需要用户任何特殊权限即可访问互联网。使用某些服务时，用户不需要提供任何个人信息。隐私或其他信息都不必受到损害。


    ## 安全


    与 Web 2.0 相比，Web 3.0 的去中心化使得黑客更难针对特定的数据库。


    # WEB 3.0 及其发展


    万维网的第一版本被称为 Web 1.0。在这一阶段，大多数用户都是内容消费者。Web 1.0 主要是一个内容分发网络，使用户能够访问其他网站上的信息。这就是它的特殊之处：


    *   没有动态页面。

    *   服务器的文件系统是内容的主要来源。

    *   页创建是利用服务器端包含（SSI）或通用网关接口（CGI）的。

    *   使用框架（Frames）和表格（Tables）对页面上的元素进行定位和对齐。


    Web 2.0 开发的关键在于数字信息创建和分发方式从 Web 1.0 的的转变。“参与式社交网络”这一术语指的是将使用的一组互联网技术。当我们谈论今天的互联网时，我们将其视为
    Web 2.0：


    *   随随地可使用的基于 Web 的应用程序。

    *   针对特定问题的简单解决方案。

    *   价值被置于内容上，而不是软件上。

    *   可以轻松共享的数据。

    *   自下而上分布，而不是自上而下。

    *   客户和员工可以独立访问和使用的工具。

    *   使用社交媒体鼓励信息的共享和推广。

    *   由于网络效应，贡献的人越多，内容就会越好。


    本章将在接下来的章节详细介绍 Web 3.0 如何彻底变革互联网。


    # WEB 3.0 及其对经济和金融服务的意义


    ## 开放、无需信任且无限制的网络


    目前的互联网服务正在被淘汰，由第四代服务取代。从 Web 1.0 移动到 Web 2.0 花了十多年时间，Web 3.0 可能需要更长时间才能实现。在机器数据理解的驱动下，Web
    3.0 将使网站和应用程序变得智能、连接且透明。


    智能家居（从空调到灯泡的一切都可以被远程控制）已经显示出 Web 3.0 的早期迹象。使用物联网（IoT）技术，我们现在可以与任何连接设备进行实时通信。


    开放、无需信任和无许可是 Web 3.0 的标志。开放且易于的开发者社区将使用开源软件创建 Web 3.0，这就是为什么它被称为“开放”的。第二，Web 3.0
    网络将允许人们公开或私密地进行通信，而不需要信赖第三方。最后，Web 3.0 将是一个无许可网络，不需要治理机构进行监督。


    ## 人工智能（ML 算法）驱动的服务


    让我们仔细观察构成 Web 3.0 的组件。AI 和机器学习将处于 Web 3.0 的核心。通过这些技术，Web 3.0 网络将利用去中心化的结构化数据，从而产生意义的见解和预测。精密制造、目标广告、药物开发和气候建模只是该技术的许多用途之一。


