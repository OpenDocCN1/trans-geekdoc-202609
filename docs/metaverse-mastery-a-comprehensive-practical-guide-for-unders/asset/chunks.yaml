  trans: '

    既然你已经学习了基础知识，现在已经准备好通过自己的电脑、平板电脑或手机进入元宇宙了。个人必须拥有一个存有加密货币的虚拟钱包才能参与加密货币市场。


    然而，它到底有什么如此迷人之处？虚拟钱包的概念和功能与我们随身携带现金的实体钱包非常相似。不同在于，“加密货币”被用于元宇宙，而在那里金钱是不准确的。但是你仍然可以使用这些硬币进行所有传统的现实世界活动，包括出售、购买、存储和持有，以及价值的升值或贬值。


    换句话说，我们用欧元、美元或虚拟货币进行的经济交易是完全相同的。元宇宙有自己的货币，被称为`加密货币`。`区块链`有自己的货币，被称为`数字代币`。`加密货币`可以用于在`元宇宙`中购买虚拟商品和服务。

    '
- fmt: '

    The Metaverse and its cryptocurrencies have been explained, and you may be wondering
    if it is appropriate and safe to begin trading in this world. There is no doubt
    in the minds of leading economists and academics that the answer is a resounding
    yes, for a slew of compelling reasons.


    To begin, this new virtual world is a place where you can work, play, and engage
    in any activity you like. Everyone is also convinced that the Metaverse and economic
    transactions based on cryptocurrency will be the next frontier for making a lot
    of money quickly. The data suggests that profits could be very high in the coming
    months, so they advise investors to start investing and using these cryptocurrencies
    right away. Even so, some people remain skeptical because, according to some,
    these cryptocurrencies are only valuable and usable to those who spend their days
    playing in the Metaverse or on social media.


    A virtual wallet with a minimum amount of cryptocurrencies is required to operate
    in the Metaverse; otherwise, you will not be able to do anything with your `avatar`
    in the virtual parallel world. According to a recent study in the United States,
    the responses of people between the ages of 18 and 55 were predictable. In the
    first place, younger people are more likely to be interested in operating in the
    parallel universe and using digital currencies. As a second point, those who are
    most skeptical of these new horizons believe that these scenarios pose a danger
    and harm to real life and relationships. Essentially, they believe that people
    who live in a virtual world are unable to form meaningful relationships with others
    in the real world.


    In addition, Metaverse participants defined it as a possible reality for playing
    and having fun, but not a world in which to work. Large corporations, such as
    `Amazon`, `Microsoft`, and `Apple`, have also been a major source of skepticism.
    Concerns about the impact on the economy and the market have been raised by many.
    They may be able to take advantage of the Metaverse''s evolution to become even
    richer off the backs of ordinary citizens.


    The Metaverse, on the other hand, is a must-have for Generation Z, the next generation,
    who, when asked, say it is the real evolution of the immediate future. To what
    extent the parallel world will spread, what it will mean, and how it will influence
    our traditional economy are all questions that will have to be answered in the
    future. In other words, is the Metaverse a passing fad or the foundation for the
    future of commerce and social interaction?


    ## Why the Metaverse Will Become More Popular Now


    Several of the world''s largest technology firms are launching all-out attacks
    on the metaverse. `Microsoft` wants to create an enterprise metaverse, while Mark
    Zuckerberg is all in. `Fortnite`, `Minecraft`, and `Roblox` have already made
    social gaming a mainstream phenomenon and created platforms that can be used to
    develop the metaverse. The boxy game beloved by 7 to 12-year-olds, `Roblox`, may
    be the most powerful metaverse platform of the future, according to some game
    developers. The `Hadean` cloud software powers `Minecraft`, allowing it to scale
    to thousands of users per world.


    Only recently has the computing power emerged to allow virtual reality to be scaled
    to a massive scale. Companies like `Hadean` and `Improbable`, which specialize
    in large-scale distributed computing, can get 10,000 players on the same server
    simultaneously. For a few years now, the idea of holding 50,000-person concerts
    and sporting events at the same time in the metaverse was unthinkable.


    With the advent of cryptocurrencies and non-fungible tokens, the metaverse is
    now more accessible to businesses looking to expand their operations. As well
    as allowing you to move your virtual identity and goods between metaverse worlds,
    these interchangeable tokens will also allow you to use your `Roblox` pixelated
    sword as an effective weapon in the `Fortnite` battle royale.


    In `Snow Crash` and `Ready Player One`, the metaverse becomes truly "meta," and
    you are able to hop between platforms in a seamless manner. A similar phenomenon
    occurred in the 1990s when mobile phones began allowing people to text each other
    across different networks, and mobile messaging exploded beyond anyone''s expectations.


    ## Metaverse is More Than Just a Place to Play Games


    Yes. Playing games in the Metaverse isn''t the only way to spend your time there.
    The obvious place to start is with games, but the metaverse encompasses so much
    more when viewed from a `Web3.0` perspective. Ariana Grande and Travis Scott have
    performed at `Fortnite`, while Lil Nas X''s `Roblox` show last year drew 33 million
    views.


    That''s why companies like `Stage11`, based in Paris, are so intriguing. An `Otium
    Capital`-funded startup called `Stage 11` is developing immersive virtual reality
    music experiences for the metaverse and has partnered with artists like David
    Guetta, Snoop Dogg, Ne-Yo and Akon.


    Artists of all kinds will create companies that cater to the metaverse, including
    musicians, fashion designers, and other types of service providers. `Gravity Sketch`,
    a company based in London, recently introduced a virtual collaboration room where
    designers can work remotely on the same 3D design task.


    On the more business-oriented side, meetings, education, and healthcare are all
    possibilities. For example, `Warping`, a Swedish startup, creates VR training
    videos for businesses and has worked on a pilot project with digital doctor service
    `Kry` to help patients with social anxiety overcome their fears through the use
    of immersive virtual social scenarios.


    A digital twin of a `BMW` factory created by `Nvidia`''s Omniverse` is part of
    a metaverse. It may be a dull metaverse, but technicians will be able to work
    together in it, so it''s still important.


    All companies will have some sort of presence in the metaverse at some point in
    time, according to `Talewind Studios` CEO and cofounder Mike Allender. "Right
    now, every business has a 2D website. There will be a three-dimensional representation
    of that in the metaverse."


    Hundreds of businesses, ranging from early-stage startups to global technology
    conglomerates, have already established themselves within the metaverse ecosystem.


    ## Chapter 2


    # Risks and Challenges of the Metaverse


    With `VR` (Virtual Reality), `AR`, and `MR` devices in use, the Metaverse relies
    heavily on these technologies and devices. The Metaverse, like any new technology,
    has its share of hurdles to overcome. It is imperative to improve user experience,
    reduce hardware costs, and enhance software and data processing capabilities in
    order to meet today''s challenges.


    As a result, securing the Metaverse will be more difficult than securing current
    digital platforms, say cyber-security experts and researchers. Similar to the
    Internet''s security, privacy, and safety concerns, the Metaverse will exacerbate
    these issues even further. In the future, virtual worlds and augmented reality
    platforms will introduce entirely new security risks and pitfalls for users and
    businesses alike. There will always be threats to the Metaverse''s security, so
    it''s imperative that virtual worlds be built with security in mind from the outset.


    `Microsoft`''s corporate vice president of security, compliance, and identity,
    Vasu Jakkal, says that monitoring and detecting attacks on these new platforms
    will be "more difficult" than on existing media. As more and more human activity
    takes place in virtual spaces, the importance of security will only increase.
    In today''s digital world, maintaining security would be a nightmare. A growing
    number of experts believe that previously unimagined security flaws will become
    common occurrences and that this will exacerbate the vulnerability of already-vulnerable
    groups in our digital world already.

    '
