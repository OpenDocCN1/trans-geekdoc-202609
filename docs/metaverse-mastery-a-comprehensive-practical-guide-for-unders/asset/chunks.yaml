  trans: '

    对于头戴式 AR 应用的用户来说，通过一个小光准星（也称为光标或十字准线）查看他们正要交互的内容并不罕见。因此，应用程序可以确定用户的注意力集中在哪里，以及不在哪里。如果应用程序需要用户关注场景中的某个重要物体，它就可以触发相应的提示。


    目前增强现实中的视线控制尚可以接受，但当它们与眼动追踪相结合时，将变得非常出色。虚拟现实和增强现实（VR 和 AR）目前需要用户转动整个头部来查看数字物体。未来的眼动追踪实现有望让这种选择方法对用户来说感觉更加自然、更直观。从一般规律来说，当你想要关注某物时，通常不会将整个头转向它。你更有可能通过头部和眼睛的协同移动来关注项目。得益于眼动追踪，AR
    头戴设备将不仅考虑到头部的位置，还会考虑到眼睛的位置。预计随着眼动追踪成为主流，AR 中视线追踪的使用将急剧增长。


    ### 键盘和鼠标


    当我们想象未来时，很容易想象一个没有键盘和鼠标的世界，穿梭在完全数字化的景观中，并使用未来的控制输入方法来操作我们的数字环境。对于广泛的任务，键盘或鼠标可能仍然是目前最好的输入方法。目前的
    AR 实现意识到了这一点。例如，`Meta 2` 可以同时配合键盘和鼠标使用。


    随着手部追踪技术的改进，`Meta 2` 对鼠标的使用预计在未来将变得过时，但某些任务（如输入长文本）可能仍从使用键盘中获益。然而，随着语音控制变得越来越普遍，对键盘输入的需求可能会减少。


    ### 语音


    用我们人类能听懂的语言与机器对话是发展最快的新兴技术领域之一，其快速增长已证明了这一点。对话式 UI 和人工智能正迅速在社会中找到一席之地，从 `Amazon
    Alexa` 到 `Google Home` 再到 `Siri`。语音和演讲成为虚拟现实和增强现实的主要控制方法只是时间问题。学习使用语音命令比传统的基于硬件的控制更容易，因为后者的学习曲线陡峭得多。虚拟现实（VR）应用程序可以使用语音命令进行控制，消除了用户学习新系统的必要性。


    `Google` 和 `Apple` 都在其移动设备中内置了数字助手，因此 `Magic Leap` 已经为其 AR 实现展示了语音控制。结果，微软的 AR
    头戴设备（包括 `HoloLens` 和 `Windows Mixed Reality` 头戴设备）严重依赖语音命令。


    微软 `HoloLens` 的标准控制包括一组语音命令，微软希望这些命令能成为 AR 的常态（如 `select`、`go to start`、`teleport`、`go
    back` 等）。开发者可以使用自定义音频输入选项创建自己的语音控制。听写选项使用户能够向应用程序输入文本，而无需处理许多 VR 和 AR 应用中常见的那种尴尬的数字键盘。


    尽管语音可能永远不是 AR 应用的唯一输入方式，但在不久的将来，大多数 AR 设备将在语音输入中发挥重要作用。


    ### 手部追踪


    作为 AR 和虚拟现实之间的主要区别之一，你可以在 AR 中看到周围的世界。这包括能够看到自己的手，而手是你与周围世界交互时最常用的工具。由于这种可见性，AR
    中的手部追踪比 VR 容易得多，问题也更少。一些 AR 头戴设备的核心体验包括通过手部追踪进行手势输入。虽然大多数主流 VR 头戴设备将手部追踪视为锦上而非必需品，但在
    AR 中，手部追踪是一等公民。AR 头戴设备和眼镜的手部追踪可能像传统二维屏幕的鼠标一样。可以使用标准手势与 `Meta 2` 和 `HoloLens` 头戴设备上的数字全息图进行交互。


    在 AR 之外，像 `ManoMotion` 这样的公司正尝试将手势分析和识别引入这一领域。它对移动 AR 的支持值得关注，允许开发者通过手势将这种更“自然”的交互方法添加到他们的移动应用程序中，而这些地方正切需要更好的
    AR 输入方法。`Manomotion`


    你可能会发现，大多数 AR 头戴设备在手部位于设备或头戴设备视线之外时存在追踪手部的问题。这是一个大问题。换句话说，如果你想使用手势、手部动作等，你就需要将手放在脸部。在现实世界中，如果你可以在不使用脸前手的情况下行动，这并不是大问题。知道如何打字、使用鼠标或视频游戏控制器等是非常重要的。为了在用户手不在视线时追踪他们的手，需要单独的硬件，这违背了提供无摩擦手部追踪的初衷。在下一代
    AR 头戴设备中，视线外追踪的能力将得到改进。


    ### 运动控制器


    `HoloLens Clicker` 是一种旨在让用户通过最小手部动作进行点击和滚动以替代 `airtap` 手势的设备，它是微软 `HoloLens` 等设备的简单外设之一。自然的非硬件控制（如语音和手势）与全面的运动控制器之间通过
    `Clicker` 这样的简单控制器得以桥接。例如，用户可以通过看向并点击来选择全息图，或者通过点击并拖动 `Clicker` 来滚动，并通过按住并保持将其旋转到所需位置。虽然
    `Clicker` 并没有解决所有问题，但它仍然是一个进步。在使用它时，你不需要将手保持在头戴设备的视线内来选择项目。


    高端设备包括微软为其当前代混合现实头戴设备提供的运动控制器，以及 Magic Leap 具有六度自由度的 `"Control"` 控制器。

