- fmt: '

    A wide range of current headsets, including `Google Cardboard`, can play spatial
    audio. Listeners who have their ears on opposite sides of their heads can benefit
    from spatial audio. The user''s left ear will receive sounds from the right side
    of the device with a delay (because the sound wave travels slower to the ear farther
    away from the audio source). It used to be that before spatial audio, apps would
    simply play sounds from the left or right speaker, cross-fading between them.


    Stereo recordings are made with two microphones spaced apart, recording two separate
    channels of audio. To create a loose sense of space, the sound can be panned between
    each channel in this method of recording. Use of microphones that simulate a human
    head produces two-channel recordings known as `binaural recordings`. Playback
    through headphones can be extremely lifelike, thanks to this. `Binaural recordings`
    of live audio in virtual reality can provide a very immersive experience for the
    end-user.


    Both spatial and binaural have one drawback: Headphones are required to experience
    3D effects. This isn''t a deal-breaker for most VR headsets, but it''s something
    to keep in mind when comparing headsets.


    ## VIRTUAL CONTROLLERS


    If you don''t have a system of input that is as high-fidelity as the visuals,
    your virtual experience will quickly lose its potency. When a user moves their
    hands or feet in a virtual world, the immersion is shattered because those movements
    are not reflected in the virtual world. Oculus Rift founder Palmer Luckey told
    `The Verge`, "The virtual reality experience will not be complete with just the
    visual side." In order to interact with the virtual world, you must have a fully
    integrated input/output system that allows for both a natural view and a natural
    interaction.


    As you explore the world of virtual reality, you''ll come across a variety of
    input devices and features. They range from the simple to the complex. They all
    have different ideas about how virtual interaction should work. The simplest input
    solution, such as a gaze to trigger an action, may sometimes be the best solution
    for the experience. In some cases, nothing enhances the immersion experience more
    than a fully-realized digital hand mimicking the movements of a user''s real hand.


    ### Toggle button


    Toggle buttons are so commonplace that they don''t even need to be listed here.
    In addition, the `Google Cardboard` is currently the only virtual reality headset
    with a built-in controller. (As of this writing, based solely on the number of
    devices sold.)) When it comes to buttons, there isn''t much to explain beyond
    pointing them out where they are (or pointing them in the right direction if they
    don''t know where they are). Actions begin when you press the button.


    ### Integrated hardware touchpad


    A touchpad built into the side of some headsets, like the `Gear VR` from `Samsung`,
    takes the concept of an integrated hardware button a step further. Using a touchpad
    instead of a toggle button provides a better user experience. The touchpad allows
    the user to swipe horizontally or vertically, tap on items, toggle volume, and
    exit content as necessary. Additionally, the touchpad serves as a replacement
    for a device''s motion controller if the user loses it.


    One drawback of integrated control solutions is that they must be able to communicate
    with the device that is actually running the experience. For example, some mobile
    VR headsets with built-in hardware controls may require a `micro-USB` (or similar)
    connection to the mobile device. Touchpads also have the potential to pull users
    out of the virtual world because of their lack of natural integration with it
    (i.e., they don''t simulate the controller in the virtual world).


    ### Gaze controls


    Virtual reality applications can incorporate gaze controls into their user interfaces.
    If you''re looking for a more passive VR experience, these are a great option
    for you. For example, instead of using a touchpad or motion controller, you can
    simply stare at the control for a predetermined amount of time to activate it.
    Gestural controls are frequently used for less active applications, such as video
    and photo viewers, where the user is more passively engaged.


    Furthermore, the use of gaze controls is not limited to passive interaction. In
    VR, the gaze is frequently used in conjunction with other methods of interaction
    (such as hardware buttons or controllers). The use of gaze controls is likely
    to increase in popularity as eye-tracking becomes more widely accepted. Controls
    for the user''s gaze include a `reticle` (or `cursor`), a `timer`, and other features.
    A few seconds of focused attention is all it takes for the user to select or initiate
    an action on a given item. In addition, gaze controls can be used in conjunction
    with other types of input for deeper interactions.


    `Reticle` is any graphic used to show where the user is looking in virtual reality.
    When using headsets that don''t have eye-tracking, this is typically where a user''s
    eyes are trained. The `reticle`, which is often just a simple dot or crosshair,
    sits on top of all other elements to help the user visualize what they''re currently
    picking. In the interim, until more advanced eye tracking in headsets becomes
    widely available, a `reticle` in the center of view can provide a simple solution.


    ### Keyboard and mouse


    Interacting with a VR headset can sometimes be accomplished through the use of
    a standard mouse and keyboard. When using a headset, it''s difficult to see the
    keyboard, which can be a drawback of this setup. Even the most proficient touch-typists
    find it difficult to type if they are unable to look down at the keyboard, even
    for a brief moment. Using a mouse, on the other hand, has its drawbacks. The mouse
    has long been the primary means of navigating in 2D digital environments, such
    as on desktop computers. However, in a 3D environment, the user''s gaze should
    be controlled by the headset. It was possible to change a user''s perspective
    using both the mouse and their physical gaze in some early applications, but this
    interaction could be extremely confusing because the mouse would pull a user''s
    view in one direction while their physical gaze would pull it in a different direction.


    Some VR apps still support keyboards and mice, but those input methods have largely
    been replaced by more integrated solutions. These new integrated solutions, on
    the other hand, may have their own drawbacks. Long-form text can no longer be
    entered into applications using a keyboard as the primary input device.


    For this issue, a variety of solutions have been proposed. `Logitech` has developed
    a virtual keyboard for the `HTC Vive` that allows users to see a virtual representation
    of its keyboard. To help touch-typists around the world, `Logitech` has created
    a 3D model of its keyboard in your virtual reality space right on top of the physical
    version of the keyboard.


    There are also text input methods that are completely digital. Predictive typing
    is made possible by `Jonathan Ravasz''s Punch Keyboard`, which uses motion controllers
    as drumsticks.


    ### Standard gamepads


    For many gamers, a familiar input method is the standard gamepad (or videogame
    controller). Many gamers were already familiar with the `Xbox One` controller
    when the original `Oculus Rift` was shipped.

