    这就是为什么 Metahero 与 Wolf Studio 合作的原因。HERO 是其原生加密货币代币，在 2022 年 6 月的估值为 4336 万美元。尽管它比列表上的其他代币要小，但这是一个相对较新的项目，因此市值较小。


    与其他山寨币相比，Metahero 的今年至今（YTD）表现为负 93%。Metahero 可能会从首席执行官 Rob Gryn 与其另一个元宇宙项目 `Everdone`
    的近期合作中受益。


    ## 7. Terra Virtua Kolect (TVK)


    当 NFT 仍处于婴儿阶段时，Terra Virtua Kolect 诞生了。NFT 现在是虚拟环境的焦点。原生代币 `TVK` 可用于创建、出售和购买来自其他成员的
    NFT。


    考虑到近期 NFT 投资的激增，该项目具有巨大的潜力。根据 `CoinMarketCap` 的数据，该平台可以在网页、PC 和 VR/AR 环境中使用。


    为了提高 Terra Virtua 的长期可行性，近期整合了 `Cardano` 区块链。NFT Evening 报道，首个碳正向的区块链 `Polygon`
    已整合到该平台。


    `TVK` 的当前市值超过 2441 万美元，该公司今年至今的表现为 -85%。新的合作伙伴关系可能会增强长期可行性，例如最近宣布的与 NFT 游戏 `Kawaii
    Islands` 的合作。


    ## 8. Star Atlas (ATLAS)


    Star Atlas 是一个基于具有惊人视觉效果的游戏的元宇宙项目。该游戏发生在 2620 年的遥远未来，允许玩家在科幻世界中征服土地并收集资源。


    作为最近的一项协议，得益于与 PC 制造商 `iBuyPower` 的合作伙伴关系，该元宇宙预计 Star Atlas 的玩家人数将会增加。


    为了参与游戏，你必须获得元宇宙代币 `ATLAS`。当你玩并完成任务时，你将获得硬币，就像任何其他基于奖励的游戏一样。然而，在涉及到奖励时，情况则是另一回事。


    与基于以太坊的项目相比，该游戏构建在 `Solana` 上，其交易费用较低。它的市值略低于 1300 万美元，目前在交易所的交易价格为每币 0.005981
    美元。


    ## 9. Enjin (ENJ)


    Enjin 在元宇宙币方面也不例外例外。本地代币 `ENJ` 可以在这种元宇宙风格的游戏环境中被“铸造”，并用于购买帮助你在游戏中进步的资产。


    你可以使用 `ENJ` 代币购买游戏中的一切物品，从药物到角色升级。因此，它类似于一个市场。


    `Ethereum` 区块链驱动着 Enjin，目前的市值为 392,578,000 美元。目前 `Polkadot` 上的 Enjin NFT 平行链上已有
    100 多个游戏和应用程序可用。


    为了庆祝 500,000 个用户钱包的里程碑，Enjin 准备很快开始对其热门应用程序 `Enjin Wallet` 的 2.0 版本进行 Beta 测试。


    ## 10. Epik Prime (EPIK)


    NFT 已经成为元宇宙项目 Epik Prime 的焦点。`PancakeSwap`、`Hotcoin Global`、`KuCoin` 和 `Huobi
    Global` 都提供 `EPIK` 作为加密货币。超过 300 个游戏客户端以及与华纳音乐和环球音乐的许可协议表明，Epik 很可能从近期加密货币市场的低迷中恢复。。


    `EPIK` 的市值为 418 万美元，它在去年才发布。尽管它是列表上最小的代币，但大公司已经开始使用它，因此它值得关注。


