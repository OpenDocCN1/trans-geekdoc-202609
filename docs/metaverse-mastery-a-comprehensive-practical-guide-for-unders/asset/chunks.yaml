- fmt: '

    The problem with gamepads in VR is that they don''t feel as integrated with other
    input options. It was a good first step away from keyboard and mouse, but for
    many VR users who are also gamers, they were familiar. Rather than using standard
    gamepads, most VR headsets now appear to prefer more integrated motion controllers
    as the primary input method. Lack of digital integration was the primary problem
    with standard gamepads. The user can be yanked out of the VR experience by the
    difference in the physical and digital experiences of using the gamepad. As a
    result, the majority of headsets have developed their own motion controllers.


    ## Motion controllers


    The de facto standard for VR interaction has quickly shifted from motion controllers,
    which were once primarily a gimmicky device for 2D PC games. Most major headset
    manufacturers have released motion controllers that work with their products.


    In an ideal world, the end-user would be unable to tell that the controller is
    even there. Users must make conscious decisions outside of the VR experience when
    using many of the input methods discussed in this chapter: I am now clicking a
    button on the side of the headset. As of this moment, I''m scouting the keyboard
    for the `W` key. Using motion controllers is a step toward eliminating the problem
    of input being separate from your virtual reality experience. Virtual reality
    (VR) often makes motion controllers appear as if they are an extension of the
    user''s hand. Some of the more expensive VR controllers include six degrees of
    freedom-of-movement capabilities to further enhance immersion.


    Movement in three-dimensional space is referred to as having six degrees of freedom
    (DoF). Orientation tracking (rotation) and position tracking (translation) are
    two terms used interchangeably in virtual reality to describe the ability to move
    forward, backward, up, and left/right. 6 degrees of freedom (DoF) enables accurate
    tracking of the VR controllers in relation to their physical position and rotation.


    To keep up with the more expensive models, the first-generation mid-tier mobile
    headset options (`Gear VR` and `Daydream`) have added motion controls as well.
    The higher-end headsets had more options, but now they''ve been condensed. It
    is most commonly implemented as a single controller with various features (a touchpad,
    volume controls, Back/Home buttons, and so on) integrated into it. Users can see
    what their hands are doing in the real world by using a digital representation
    of their controller. These controllers are typically limited to three degrees
    of freedom, unlike the more advanced motion controllers (only tracking their rotation
    in the virtual space).


    `Gear VR` and `Daydream` headsets'' controller tracking is impressive for mobile
    devices, but it falls short of the high-end, tethered headsets''. In addition,
    the motion control can sometimes feel like a glorified TV remote without a second
    motion controller (one for each hand). These one-handed control representations,
    despite being less sophisticated than the higher-end motion control options, can
    still provide a more integrated VR experience than the previously discussed options.
    Seeing the controller in the virtual world and tracking its physical movement
    is a huge step toward immersing the user in virtual reality and incorporating
    a user''s physical movements into the virtual space.


    A pair of wireless motion controllers is included with most high-end headsets
    (such as the `Rift`, `Vive`, and `Windows Mixed Reality`). Overall, the motion
    controllers have a lot in common with each other despite some minor differences.


    Submillimeter object detection is possible with these high-end controller pairs.
    Another important step in making the VR experience truly immersive is being able
    to look down and see a visual representation of the controllers moving in tandem
    with your physical body. Increasingly, virtual reality applications are focusing
    on motion controllers as their primary input method. For the time being, VR interaction
    appears to be dominated by motion controls. There are and will continue to be
    a plethora of other ways to interact in VR.


    ## Hand tracking


    Virtual reality headsets can track a user''s hands without the need for additional
    hardware on the user''s hands, thanks to hand tracking. Some people believe that
    hand tracking is the next step in motion controller evolution. This is an avenue
    being investigated by a number of companies for both VR applications. More and
    more people are turning to this method of control in AR applications. Hand tracking
    has been a long-time focus of companies like `Leap Motion`, both inside and outside
    of VR. In 2012, `Leap Motion` released its hand-tracking controller for use with
    2D displays. As virtual reality (VR) became more popular, the company saw the
    potential of its technology for interaction in that space and shifted its focus
    there.


    Hand tracking differs from traditional motion controllers in that it displays
    a virtual representation of your hand in place of a controller, wand, or other
    similar virtual "fake" model. In the same way that your physical hand pinches,
    so does your digital hand. Digital hands respond to the flexing of human hands.
    Your digital hand makes the same gesture as your physical one. Virtual reality
    (VR) with full finger tracking allows you to see a digital representation of your
    real-world hands. Feels like trying on a completely different body. To watch your
    digital representation open and close its fist in VR, you may have to stare at
    the hand you''re holding.


    There are still some issues with hand tracking''s visual appeal, however. Virtual
    space interaction is more limited than it is with motion controllers. Numerous
    hardware interactions are possible when using a motion controller. The buttons,
    trackpads, and triggers on the motion controller can all fire off various events
    in the virtual world. With hand tracking alone, there are no such options. A hand-tracking-based
    application will have to deal with a wide range of input scenarios. This can be
    a difficult task, given that only the user''s hand is involved.


    However, hand tracking can be impressive in its own right, but it lacks the tactile
    feedback that a user would expect when engaging in real-world interactions. If
    you''re using hand tracking alone to pick up a box in virtual reality, you''ll
    miss out on the sensation of picking up a real-world object.


    For the foreseeable future, hand tracking is likely to be a secondary consideration
    in the design of standard consumer virtual reality (VR) experiences. However,
    hand tracking will eventually find its way into virtual reality. A once-in-a-lifetime
    experience like this can''t be ignored in the digital world.


    ## Eye-tracking


    The first VR headset with built-in eye tracking was released by `FOVE` in 2016.
    Each of these companies has acquired eye-tracking startups for use in their various
    VR and AR devices, indicating that this is a promising area to watch. A user''s
    VR experience could benefit greatly from eye-tracking. Most current headsets (aside
    from the `FOVE`) only determine where the user''s head is turned, not where the
    user is actually looking.


    Most headsets use a reticle that sits directly in the center of the user''s view
    to informing the user where her gaze is centered, as we discussed earlier in this
    chapter. The real world, on the other hand, frequently sees people looking in
    directions other than directly in front of their faces. In spite of the fact that
    you may be staring at a computer screen directly in front of you, your gaze is
    frequently drawn to the bottom or top of the screen to select various menus or
    to your keyboard or mouse.

    '
  raw: 'The problem with gamepads in VR is that they don''t feel as integrated with
    other input options. It was a good first step away from keyboard and mouse, but
    for many VR users who are also gamers, they were familiar. Rather than using standard
    gamepads, most VR headsets now appear to prefer more integrated motion controllers
    as the primary input method. Lack of digital integration was the primary problem
    with standard gamepads. The user can be yanked out of the VR experience by the
    difference in the physical and digital experiences of using the gamepad. As a
    result, the majority of headsets have developed their own motion controllers.


    **Motion controllers**


    The de facto standard for VR interaction has quickly shifted from motion controllers,
    which were once primarily a gimmicky device for 2D PC games. Most major headset
    manufacturers have released motion controllers that work with their products.


    In an ideal world, the end-user would be unable to tell that the controller is
    even there. Users must make conscious decisions outside of the VR experience when
    using many of the input methods discussed in this chapter: I am now clicking a
    button on the side of the headset. As of this moment, I''m scouting the keyboard
    for the W key. Using motion controllers is a step toward eliminating the problem
    of input being separate from your virtual reality experience. Virtual reality
    (VR) often makes motion controllers appear as if they are an extension of the
    user''s hand. Some of the more expensive VR controllers include six degrees of
    freedom-of-movement capabilities to further enhance immersion.


    Movement in three-dimensional space is referred to as having six degrees of freedom
    (DoF). Orientation tracking (rotation) and position tracking (translation) are
    two terms used interchangeably in virtual reality to describe the ability to move
    forward, backward, up, and left/right. 6 degrees of freedom (DoF) enables accurate
    tracking of the VR controllers in relation to their physical position and rotation.


    To keep up with the more expensive models, the first-generation mid-tier mobile
    headset options (Gear VR and Daydream) have added motion controls as well. The
    higher-end headsets had more options, but now they''ve been condensed. It is most
    commonly implemented as a single controller with various features (a touchpad,
    volume controls, Back/Home buttons, and so on) integrated into it. Users can see
    what their hands are doing in the real world by using a digital representation
    of their controller. These controllers are typically limited to three degrees
    of freedom, unlike the more advanced motion controllers (only tracking their rotation
    in the virtual space).


    Gear VR and Daydream headsets'' controller tracking is impressive for mobile devices,
    but it falls short of the high-end, tethered headsets''. In addition, the motion
    control can sometimes feel like a glorified TV remote without a second motion
    controller (one for each hand). These one-handed control representations, despite
    being less sophisticated than the higher-end motion control options, can still
    provide a more integrated VR experience than the previously discussed options.
    Seeing the controller in the virtual world and tracking its physical movement
    is a huge step toward immersing the user in virtual reality and incorporating
    a user''s physical movements into the virtual space.


    A pair of wireless motion controllers is included with most high-end headsets
    (such as the Rift, Vive, and Windows Mixed Reality). Overall, the motion controllers
    have a lot in common with each other despite some minor differences.


    Submillimeter object detection is possible with these high-end controller pairs.
    Another important step in making the VR experience truly immersive is being able
    to look down and see a visual representation of the controllers moving in tandem
    with your physical body. Increasingly, virtual reality applications are focusing
    on motion controllers as their primary input method. For the time being, VR interaction
    appears to be dominated by motion controls. There are and will continue to be
    a plethora of other ways to interact in VR.


    **Hand tracking**


    Virtual reality headsets can track a user''s hands without the need for additional
    hardware on the user''s hands, thanks to hand tracking. Some people believe that
    hand tracking is the next step in motion controller evolution. This is an avenue
    being investigated by a number of companies for both VR applications. More and
    more people are turning to this method of control in AR applications. Hand tracking
    has been a long-time focus of companies like Leap Motion, both inside and outside
    of VR. In 2012, Leap Motion released its hand-tracking controller for use with
    2D displays. As virtual reality (VR) became more popular, the company saw the
    potential of its technology for interaction in that space and shifted its focus
    there.


    Hand tracking differs from traditional motion controllers in that it displays
    a virtual representation of your hand in place of a controller, wand, or other
    similar virtual "fake" model. In the same way that your physical hand pinches,
    so does your digital hand. Digital hands respond to the flexing of human hands.
    Your digital hand makes the same gesture as your physical one. Virtual reality
    (VR) with full finger tracking allows you to see a digital representation of your
    real-world hands. Feels like trying on a completely different body. To watch your
    digital representation open and close its fist in VR, you may have to stare at
    the hand you''re holding.


    There are still some issues with hand tracking''s visual appeal, however. Virtual
    space interaction is more limited than it is with motion controllers. Numerous
    hardware interactions are possible when using a motion controller. The buttons,
    trackpads, and triggers on the motion controller can all fire off various events
    in the virtual world. With hand tracking alone, there are no such options. A hand-tracking-based
    application will have to deal with a wide range of input scenarios. This can be
    a difficult task, given that only the user''s hand is involved.


    However, hand tracking can be impressive in its own right, but it lacks the tactile
    feedback that a user would expect when engaging in real-world interactions. If
    you''re using hand tracking alone to pick up a box in virtual reality, you''ll
    miss out on the sensation of picking up a real-world object.


    For the foreseeable future, hand tracking is likely to be a secondary consideration
    in the design of standard consumer virtual reality (VR) experiences. However,
    hand tracking will eventually find its way into virtual reality. A once-in-a-lifetime
    experience like this can''t be ignored in the digital world.


    **Eye-tracking**


    The first VR headset with built-in eye tracking was released by FOVE in 2016.
    Each of these companies has acquired eye-tracking startups for use in their various
    VR and AR devices, indicating that this is a promising area to watch. A user''s
    VR experience could benefit greatly from eye-tracking. Most current headsets (aside
    from the FOVE) only determine where the user''s head is turned, not where the
    user is actually looking.


    Most headsets use a reticle that sits directly in the center of the user''s view
    to informing the user where her gaze is centered, as we discussed earlier in this
    chapter. The real world, on the other hand, frequently sees people looking in
    directions other than directly in front of their faces. In spite of the fact that
    you may be staring at a computer screen directly in front of you, your gaze is
    frequently drawn to the bottom or top of the screen to select various menus or
    to your keyboard or mouse.'
