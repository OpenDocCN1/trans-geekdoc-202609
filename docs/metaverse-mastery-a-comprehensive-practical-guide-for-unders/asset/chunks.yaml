    Adding foveated rendering to applications will be made possible through the use
    of eye-tracking. In foveated rendering, only the area a user is looking at directly
    is rendered in high definition, while the rest of the image is rendered at lower
    quality. Because current headsets don''t "know" where the user''s gaze may be,
    they must render the entire viewable area in full definition at all times. A single
    area is rendered in full at a time using focused rendering. Complex VR environments
    can now be rendered on lower-powered computers as a result of this reduction in
    processing power, making the technology more accessible to everyone. Developers
    focusing on creating foveated rendering hardware that can be added to existing
    VR devices, despite `VR` focus on eye tracking. Onboard eye-tracking for headsets
    may be a generation or two away, as major headset manufacturers have kept quiet
    about their plans to add eye tracking to their next generation.


    ## Current Issues with Virtual Reality


    A number of technical hurdles remain before consumer-grade virtual reality (`VR`)
    can truly reach its mass-market potential, but it is becoming lighter, cheaper,
    and more polished. With the surge in `VR` investments that have occurred over
    the last years, we should see quicker turnaround in finding solutions.


    In the following section, we''ll look at some of the most pressing issues facing
    virtual reality now, as well as some of the innovative solutions being developed
    to address those. A case of the dreaded “motion sickness” was a common complaint
    among users of the first generation virtual reality headsets. `Sega` and `Nintendo''s
    Virtual Boy` were both doomed due to this issue alone. Manufacturers of modern
    headsets are still battling this problem.


    When your inner ear''s vestibular sense of motion is inconsistent with what your
    eyes are seeing, motion sickness can occur. You may think you are sick if your
    brain thinks your body is sending inconsistent signals because of some disease.
    Anxiety and stress can trigger the release of chemicals in your brain that can
    cause a variety of unpleasant symptoms, including headaches, dizziness, and nausea.
    `VR` headsets can cause a sickness known as "simulation sickness," which is a
    form of motion sickness that doesn''t involve any real movement.


    A variety of approaches, including some that might seem strange, can be used to
    combat sickness. According to Purdue University''s Department of Computer Graphics,
    should be added to all virtual reality applications in order to stabilize the
    user. `Nasum virtual` is the name given to this sickness by `Virtualis LLC` for
    commercialization. Virtual reality sickness can be alleviated by placing the user''s
    nose in their field of view. You can see your nose in the real world, but you
    may not be aware of it. A 13.5% decrease in sickness severity and 13% increase
    in simulator time were reported by `Virtualis` users, who didn''t even notice
    the virtual nose.


    As a `VR` developer, you can combat sickness by minimizing latency between a user''s
    physical movement and the headset''s response. When we move our heads, the world
    around us responds immediately. There is no lag time. The headset''s lack of latency
    is of the utmost importance here. More than ever, the number of frames per second
    (`FPS`) that a headset can display is critical as `VR` becomes more widely available
    on low-powered mobile devices. In this way, the headset''s visuals can follow
    the user''s every move.


    Additionally, when developing or utilizing `VR` applications, the following tips
    can help prevent simulator sickness:


    * The headset should be properly positioned and adjusted. It''s very likely that
    your headset needs to be adjusted if the virtual world appears hazy while wearing
    it. Users can adjust the headset''s fit and distance from their eyes to remove
    any blurriness from their video feeds. Before beginning any virtual reality experience,
    make sure your headset is properly adjusted.

    * It''s time to get down. Being seated provides a sense of security for some people
    who suffer from motion sickness.

    * Ensure that the content is readable. Keep text usage in `VR` to a minimum and
    avoid reading or using small-font text (just a few words at a time).

    * As a result, there will be no surprises. Never programmatically move the camera
    when developing. The user should be able to tell whether the motion is triggered
    by his own movement or by interaction.

    * Take care when accelerating. Simulator sickness can be avoided by moving virtual
    cameras in a smooth fashion. Allow the user to move in the virtual world without
    accelerating or decelerating them.

    * Always keep an eye on where the user is going. Don''t reverse the camera or
    stop tracking the user''s head position when the user is moving. The view of a
    user must change as she moves her head.

    * Avoid items that can only be viewed from a certain angle. If you''re playing
    a 2D game, you''ll see a lot of fixed-view items (e.g., a pop-up notification
    or a heads-up display [`HUD`]) in the middle of the screen. However, this mechanic
    does not work well in virtual reality because it is not something that people
    are used to in the real world.


    Simulator sickness due to low `FPS` should, in theory, decrease as devices get
    more powerful. Simulator sickness can be minimized to a greater extent if the
    user''s physical movements are closely tracked by the virtual world''s graphics
    and movement. In spite of the fact that we have surpassed the processing power
    of computers from decades ago, we still encounter software that runs slower than
    games from that time period. To a greater or lesser extent, the more power we
    have, the more we expect from it. Improved graphics! The screen is getting a lot
    more crowded! Expanded viewing areas!


    ## Movement in VR


    It''s still difficult to move around in `VR`''s digital environment. For example,
    the `Vive` and `Rift` allow users to be tracked around the room, but not much
    further. Adding more features requires either a movement mechanic built into the
    app itself or specialized hardware that is beyond the capabilities of the majority
    of consumers.

