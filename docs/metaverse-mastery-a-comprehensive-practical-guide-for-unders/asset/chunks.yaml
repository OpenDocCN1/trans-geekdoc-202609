    Microsoft may want to go in that direction, but the capability isn''t fully present
    in the headsets it has available right now. However, Microsoft''s `Mixed Reality`
    platform includes specifications that hardware manufacturers can use to create
    their own `Windows Mixed Reality Headsets`, so it''s not a specific piece of hardware
    itself. Similarly, `Google Cardboard`, which is discussed later in this chapter,
    works in a similar way. ( The `HTC Vive` and `Oculus Rift` could be compared to
    Apple in the sense that each manufacturer creates and markets its own headset
    hardware and controls all aspects of the product.


    Microsoft, on the other hand, only has control over the `Windows Mixed Reality`
    software specifications; it is not required to create its own hardware. As long
    as they adhere to Microsoft''s guidelines, third-party manufacturers are free
    to design and market their own `Windows Mixed Reality` headsets. `Microsoft HoloLens`,
    the company''s augmented reality headset, is technically part of the `Windows
    Mixed Reality` platform as well. It''s possible to get lost in the shuffle. When
    I talk about `Windows Mixed Reality` in this section, I''m generally referring
    to the company''s line of immersive virtual reality headsets. The `Microsoft HoloLens`
    is one of the devices I frequently refer to when discussing the topic at hand.


    It''s difficult to make apples-to-apples comparisons when evaluating `Windows
    Mixed Reality` VR headsets when there isn''t a single standard to use. `Microsoft
    Windows Mixed Reality` headsets may have different baseline specifications than,
    for example, `HP Windows Mixed Reality` headsets. As a result, most `Windows Mixed
    Reality` VR headsets tend to be on the upper end of the VR spectrum.


    The `PlayStation VR` is a video game console manufacturer''s take on virtual reality.
    In order to use `PlayStation VR`, you do not need a `PC`, but you do need a `PlayStation`
    gaming console. It''s easy to use, affordable and has a wide selection of games,
    but reviewers have taken issue with the lack of a room-scale experience, the underpowered
    controllers, and the lower resolution per eye compared to higher-end headsets.


    To say that one experience is better than the other isn''t necessarily the case.
    Both have their own unique set of advantages and disadvantages. Externally powered
    "desktop" VR experiences are a good option if you want the most powerful or immersive
    VR experience possible. The mobile VR headsets may be a better fit for you if
    image fidelity isn''t as important to you and you need to be able to move around
    while wearing your headset. It''s important to keep in mind that this is only
    an evaluation of the first generation of VR devices. High-end devices will be
    released in the next year or two that do away with the need for external hardware
    power or at the very least do away with the wires from experience in the second
    generation. It will be a huge step forward in making virtual reality more widely
    available if users can disconnect from their machines in this way.


    # THE FEATURES OF VIRTUAL REALITY


    In addition to price and headset design, each manufacturer is taking a variety
    of approaches to the VR experience it provides. Some of the most important VR
    features are discussed in the following sections.


    ### Room-scale versus stationary experience


    With room-scale, a user''s real-world movements are tracked into the virtual environment,
    allowing him or her to roam freely around the play area of a VR experience. In
    order to track the user''s movement in three-dimensional space, first-generation
    VR headsets will need external sensors or cameras in addition to the headset.
    Is there a school of fish you''d like to get a closer look at? Run after your
    robot dog on the floor of your virtual spaceship? What better way to learn about
    Michelangelo''s David than to walk around in a 3D replica of it? You can do these
    things in a room-scale experience if your real-world physical space allows you
    to.


    Virtual reality devices that use inside-out tracking are rapidly replacing older
    models that require external devices to provide a full-room experience. In contrast,
    a stationary experience is exactly what it sounds like: a VR experience designed
    to keep the user seated or standing for the majority of the experience. Room-scale
    VR experiences are currently only possible with high-end VR headsets (such as
    the `Vive`, `Rift`, or `WinMR` headsets), not mobile-based headsets.


    Users can feel more immersed in room-scale virtual reality experiences because
    their physical movements are reflected in the virtual world. Walking across a
    virtual room is as simple as walking across a real one. When she needs to get
    something from under a table, she simply squats down and reaches under. Using
    a `joystick` or similar hardware to accomplish the same thing in a stationary
    experience would detract from the experience and make it less immersive. Virtual
    reality (`VR`) experiences that allow for physical movement go a long way toward
    making the experience feel more "real."


    The disadvantages of working at room-scale are numerous. If you want to be able
    to walk around in virtual reality without running into physical obstacles, you''ll
    need a lot of open floor space for a room-scale experience. Most of us can''t
    afford to dedicate entire rooms of our homes to virtual reality setups, but developers
    can use a variety of tricks to get around this limitation.


    Real-world physical barriers that prevent users from running into doors and walls
    must be included in room-scale digital experiences, as must boundaries that show
    where the physical-world boundaries exist.


    Many room-scale VR experiences also necessitate users to travel greater distances
    than their physical space can handle. In most cases, a straightforward option
    exists for those who wish to travel while remaining seated. All of her stationary
    experiences must either take place in a single location or use a different method
    for moving around since she can''t physically move around during them (for example,
    using a `controller` to move a character in a video game). It''s a different set
    of issues when it comes to room-scale experiences. A user can now move around
    in the virtual world, but only to the extent permitted by the user''s unique physical
    configuration.


    In virtual reality, some users may be able to walk as far as 20 feet. It''s possible
    that other users'' physical VR areas are constrained, with only 7 feet of emulated
    walking space. VR developers must now make some difficult decisions about how
    to allow users to move around in both the physical and virtual environments. They
    must choose between several different approaches.


    ### Inside-out tracking


    At this time, only high-end consumer headsets can provide realistic room-scale
    simulations. A wired connection to a `computer` is usually required for these
    high-end headsets. Users are forced to step over the wires as they move around
    the room. Wiring is required for both the display of images in the headset and
    for the tracking of the headset in the real world.


    In the second generation of virtual reality headsets, manufacturers are looking
    for ways to eliminate the need for a wired display. Streaming video to a headset
    without a wired connection is being researched by companies such as `DisplayLink`
    and `TPCast` in the meantime.

