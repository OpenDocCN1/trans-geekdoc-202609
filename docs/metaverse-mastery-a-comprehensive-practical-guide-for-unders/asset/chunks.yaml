  trans: '

    在过去的几年里，你可能已经听过元宇宙（Metaverse）和 NFT（非同质化代币）。然而，目前仍然存在很多误信息，因此获取相关知识至关重要。尽管许多人认为如此，但区块链技术的用途并不局限于加密货币领域。


    ### 理解 NFT 和区块链

    从本质上说，NFT 可以以多种方式被挥霍。在这方面，可以考虑一下艺术世界，以及那些无法被拥有但在拍卖会上以高价售出的独特艺术作品的销售。事实上，收藏家和具有纯粹投机兴趣的人对这些产品正变得越来越感兴趣。


    ### 影响与定义

    元宇宙和 NFT 已经在产生重大的经济和社会影响。即使 NFT 不是真实的，它仍然是一种极具吸引力的资产。你应该知道，NFT 的缩写代表“非同质化代币”（Non-fungible
    token），它被用于各种语境中。NFT 基本上是任何可以转移给新用户的物品。另一方面，所有权证书并没有赋予获得它的人完全的自由。NFT 所有者将要求遵守一套规则，包括禁止复制该物体。事实上，版权将始终受到保护。


    同样重要的是要记住 NFT 是一种合成物质，而非自然物质。因此，任何作品都可以数字化并转换为真实的、不可复制的且经过认证的物品。在任何情况下，都需要基于区块链的过程来让
    NFT 活起来。这都归结于 `Ethereum` 收取的费用，它与 `Bitcoin` 一起被广泛认为是加密货币的“母体”。


    目前，NFT 的需求量很大，而且不仅仅局限于收藏家和艺术爱好者。为了理解商业化的后果，你将需要检查随数字作品而来的所有权证书的所有特征，这些数字作品正变得越来越流行。事实上，如果你仔细观察
    NFT，你会发现除了区块链技术外，还有其他需要考虑的因素，例如买卖双方建立的信任。


    ### 数字所有权的机制

    简单来说，非同质化代币（字面意思为“不可复制的代币”）是独特的东西；它永远无法被其他东西取代。为了说明这一点，请考虑可以相互交易的数字货币。相比之下，你无法对艺术品、歌曲或视频游戏执行操作。


    重要的是，当你购买 NFT 时，你实际上并不是在购买产品，而是版权以及向他人展示它的能力。`smart contract`（智能合约）将用于将一切形式化。你不需要担心卖家和买家做出任意更改。从照片或视频开始，作品的数字格式被创建并保存在特殊位置。当涉及到计算机语言时，两个版本都不仅仅是零和一的字符串。哈希（Hash）是原始序列的较小版本。尽管哈希始终可以计算，但数字文档无法使用相同的哈希进行重建，这就是为什么现在提到这一点很重要。时间戳对于下一步至关重要，即将哈希存储在区块链上。


    ### 元宇宙与整合

    阅读这些后，人们通常会好奇 NFT 如何与元宇宙虚拟现实联系起来。非同质化代币允许你在元宇宙中交易，因为它们拥有相同的技术基础。由于这些代币的广泛使用，一个更自动的市场正在成为现实。`ETH`
    等加密货币可以用于买卖由哈希算法创建的哈希。作品作者可以在 NFT 内部被追溯，并通过跟踪所有权的转移相应证明合法的所有权。


    整个机制同时提供了数字作品的真实性和所有权的证明。一旦你拥有了哈希，你就可以在不依赖第三方或不受时间限制的情况下证明你的权利。真正重要的是代币底层的区块链是否保持运行。


    为了获取 NFT，你需要使用 `Ethereum` 区块链，在大多数情况下，你会发现它。但重要的是记住，在过去的几个月里，用于购买 NFT 的区块链及其竞争对手
    `Binance Smart Chain`、`EOS` 和 `TRON` 也在扩散。


    ### 技术基础

    如果你不知道区块链是什么或它是如何工作的怎么办？在这种情况下，你必须将其想象成一个巨大的数据库，它无法以任何方式更改，因为没有人的权利更改存储在内部的数据。即使是政府也无法控制区块链，因为它由多个独立运行的计算机组成。只要网络上的每台计算机都贡献力量，区块链就会继续运行。


    一旦时间戳存储在区块链中，你就可以声称任何数字化作品的所有权，例如电影或照片。即使信息被他人更改或伪造，其他人也无法声称相同的权利。因为区块链既是不可篡改的又是去中心化的，它的首次用途是为了
    `Bitcoin` 网络的利益。虚拟货币通过实现安全交易消除了“双重花费”（即伪造）的可能性。


    多年来区块链经历了许多变化。它已经演变成可以涵盖更广泛的金融交易，而不仅仅是货币交换。智能合约仅仅是去中心化的计算机产品，因为它们完全基于区块链，所以极其可靠，自
    2015 年以来一直专门为 `Ethereum` 开发。


    这意味着智能合约只能根据向公众公布的代码实施。区块链网络中未连接的单个节点无法进行任何更改或替换。使用 NFT 智能合约，可以跟踪创建、销售和购买智能合约的人。计算艺术品的哈希或数值序列被用于此。当涉及到
    `Ethereum` 时，`ERC-721` 或 `ERC-1155` 是最广泛使用和认可的 NFT。


    只要证书保持唯一，它就永远不会改变。为了托管 NFT，`Ethereum` 确保证书是可以被修改的。但是，它能够同时记录所有权的变化。

    '
- fmt: '

    As you might expect, the system as a whole appears to be quite dependable. Still,
    there are a few flaws in the system. There are a number of scenarios that could
    occur if the entire Ethereum blockchain''s current community decided to abandon
    the project. But don''t stop there; as time goes on, even hash information will
    become obsolete. There''s a chance that external links to the smart contract''s
    hashes will stop working.


    These issues are already being addressed. For those looking to commercialize NFT
    and conduct business in the Metaverse, a number of technological solutions have
    been developed to ensure the highest level of security. Some `NTFS`, for example,
    use `IPFS` type addresses to avoid external links that may one day disappear.
    If the owner of the site stops paying for hosting, or if they need to make room
    for new content, a `URL` may be removed. You can always find your content because
    `IPFS` addresses are unique to each node on the `IPFS` network. To ensure that
    the stored files are accessible and, therefore, long-lasting, a network of hosts
    has been set up.


    Other than Ethereum, the future of individual blockchains is uncertain, but progress
    is expected because those interested in buying and selling NFTs want more assurances.
    Pay attention to the blockchain where the smart contracts are hosted when purchasing
    an `NTF`. Buying an `NTF` linked to a blockchain that isn''t pre-tested puts you
    at serious risk of getting a piece of junk with no guarantees. Aim for well-decentralized
    blockchains that will not be abandoned in the near future.


    NFT and the cryptographic Metaverse, a virtual world in which people can interact,
    have a strong connection because of the blockchain''s existence. The Metaverse
    isn''t a standalone system but rather a symbiotic one that connects various digital
    building blocks. A subcategory is known as PFP, which stands for "Pictures-for-Proof,"
    is a subcategory of NFTs that includes entire collections of images that are exchanged
    for fun or recreational purposes. All of these unique NFTs are signed by well-known
    artists from around the world, making them particularly appealing to art collectors.


    To put it another way, in the Metaverse, NFTs are a form of ownership documentation.


    Since they''re so important, many businesses are spending a lot of money on developing
    encrypted content. Virtual art galleries, open to all players, have already been
    created in the video game industry to mimic the physical headquarters of manufacturing
    firms. Attend concerts, participate in various events, and touring rooms are all
    possibilities for participants.


    Coins like Bitcoin and Ethereum can be used to purchase digital works in the Metaverse.
    In this manner, the seller''s ownership of the object will be immediately transferred
    to the buyer via an `NFT`. If you''d rather get your hands on the Metaverse, you''ll
    be able to transfer ownership of it this time around as well.


    This system''s advantages and potential economic impact are self-evident. Because
    the blockchain in a cryptographic Metaverse is decentralized as opposed to other
    virtual realities governed by states or other bodies, those who operate within
    it gain an advantage. If a game hosted in the Metaverse were to be abandoned by
    the community, it would continue to be visible because of the blockchain''s support
    of the game.


    This is an important point to keep in mind: the Metaverse utilizes the same infrastructure
    as cryptocurrencies and NFTs. When you join the Metaverse, you will become a participant
    in the crypto-economic network, which is what these terms mean.


    As a result, a new economy is emerging, even if some aspects and boundaries have
    yet to be established. As of right now, the Metaverse presents an exciting opportunity,
    even if some aspects and boundaries have yet to be established. As of right now,
    the Metaverse presents an exciting opportunity, even if some aspects and boundaries
    have yet to be established. The Metaverse''s commercial real estate market has
    seen an increase in recent months. Additionally, high-end fashion brands have
    made their way into this ever-changing landscape. While this is going on, major
    technology companies around the world are making significant investments.


    Because the global market for NFTs has not yet been fully regulated, copyright
    poses a significant challenge. Parties involved in multi-million dollar transactions
    are expected to be concerned about possible copyright infringement. The legal
    protection that is recognized around the world appears to be difficult to obtain.
    Ad hoc regulations are required because there are a number of inconsistencies
    in the laws.


    There must be a precise definition in order to ensure the long-term viability
    of both the NFT and the Metaverse by defining what the commercialized work is
    and, above all, what the external link refers to the hash is. The link between
    NFT and the Metaverse is critical to businesses around the world, particularly
    the big fashion and tech companies. The inability to trade NFTs without first
    leveraging the blockchain ensures maximum transparency, especially for artists
    who create captivating and novel works.


    In any case, it''s critical to familiarize yourself with the dynamics of NFTs
    and the Metaverse before diving in. Do your research and stay up-to-date on the
    latest developments. Virtual world enthusiasts must be prepared to deal with unpleasant
    surprises and make purchases without proper consideration. As long as the blockchain
    is feeding Metaverse finance, cryptocurrency will always be the currency. You
    can trade digital representations of real-world objects, such as music, art, houses,
    and entire collections, once you enter the virtual world.


    CHAPTER 4


    # VIRTUAL REALITY


    A person can interact with a three-dimensional (3D) visual or sensory artificial
    environment using computer modeling and simulation in virtual reality (VR). As
    a result, a virtual world with full 360-degree exploration is created using computer
    technology. To describe a 3D computer environment that can be explored and interacted
    with by multiple users, we use the term virtual reality. VR systems currently
    use electronic helmets to create realistic images, sounds and other sensations
    that mimic the user''s actual physical presence. Users are transported into a
    3D environment where they can freely move and interact to complete predefined
    tasks and achieve goals such as education by designers who create virtual environments
    such as virtual museums.


    Virtual reality (VR) creates a computer simulation of an environment in which
    you are not just a passive participant but also an accomplice using cutting-edge
    graphics, cutting-edge hardware, and an artistically rendered experience.

