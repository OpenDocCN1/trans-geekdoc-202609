    **Haptic feedback**


    Virtual reality controllers already include haptic feedback, which is the sense
    of touch designed to convey information to the user. Rumble/vibration can be used
    to convey contextual information to users of Xbox One, HTC Vive Wands, and Oculus
    Touch controllers. You''re about to grab something. You''re putting your finger
    on a switch. You''ve shut a door behind you. But the feedback these controllers
    offer is rather limited. " Using these devices, you get the same sensation as
    if your phone vibrates when you get a notification.


    If the industry wants to make virtual reality feels as real as the real world
    while inside it, haptics must be taken a step further than it has so far been.
    Touch in virtual reality is a problem that many companies are trying to solve.


    Go Touch VR has created a VR touch system that can be worn on one or more fingers
    in order to simulate physical touch in virtual reality (VR). In essence, the Go
    Touch VR is nothing more than a pressure pad that you wear on the tips of your
    fingers. As the company *Go Touch VR* claims, users will have the sensation of
    holding onto an actual object in the virtual world. Some other companies, such
    as Tactical Haptics, are attempting to fix the controller''s haptic feedback issue.
    They claim to be able to simulate the types of friction forces you''d feel when
    interacting with physical objects by using sliding plates in the surface handle
    of their Reactive Grip controller. It is common to feel your tennis racquet push
    against your hand when making a swing.


    You''ll feel more resistance against your hand when moving heavy objects than
    when moving light ones. To paint by hand, you''d feel the brush drag against your
    hand as if it were being dragged across paper or canvas. These scenarios, according
    to Tactical Haptics, can be accurately simulated in a way that most current controllers
    cannot. Companies like HaptX and bHaptics are developing full-blown haptic gloves,
    vests and exoskeletons for virtual reality. The wireless TactSuit is currently
    being developed by BHaptics. A haptic mask, vest, and sleeves are all included
    in the TactSuit. It uses eccentric rotating mass vibration motors to disperse
    the vibrations across the wearer''s face, vest front and back, and sleeves, all
    while retaining the wearer''s full range of motion. With this technology, bHaptics
    claims that users can "feel" explosions and weapon recoils as well as being punched
    in the chest through their virtual reality headsets.


    With its HaptX platform, HaptX is one of the companies experimenting with haptics
    in virtual reality to the fullest extent. With the help of HaptX''s smart textiles,
    you will be able to perceive the texture, temperature, and form of objects in
    your environment. At the moment, it''s working on a haptic glove prototype to
    give virtual reality (VR) users realistic touch and force feedback. HaptX, on
    the other hand, goes a step further than most haptic hardware''s standard vibrating
    points. Microfluidic air channels embedded in the textile push against a user''s
    skin, allowing for force feedback that can be transmitted to the wearer.


    When compared to other haptic devices, HaptX claims that its use of technology
    provides a far superior experience. If combined with virtual reality, HaptX''s
    system takes users a step closer to immersive virtual reality experiences. HaptX''s
    system could lead to a full-body haptic platform, allowing you to truly experience
    virtual reality.


    **Audio**


    In order to replicate reality as closely as possible, virtual reality (VR) must
    use other senses besides sight and touch. 3D audio, on the other hand, is ready
    to take the world by storm. A realistic experience relies heavily on involving
    the user''s sense of hearing; in order to give the user a sense of presence and
    space, audio and visual elements work together.


    Along with visual cues, it is possible to use audio cues to guide users through
    an online experience. A sound''s 3D direction of arrival, general distance to
    the source, and so on are all discernible to the human ear. An audio experience
    must be replicated in order for a user to feel as if she''s actually listening
    to it in the real world. It has been possible to create a 3D audio simulation
    for some time, but this was usually done as a quick fix. 3D audio has found a
    market that can help it advance with the rise of VR (and vice versa).'
