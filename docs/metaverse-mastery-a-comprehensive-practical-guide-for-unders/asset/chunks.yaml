- fmt: '

    - Using interactive computer simulations that track the participant''s position
    and actions and provide feedback to one or more senses instead of traditional
    sensory feedback, virtual reality creates the illusion of being physically present
    in the simulation (a virtual world).


    Using this definition, practitioners of virtual reality will be able to distinguish
    between the many different types of devices that are used in the medium.


    In modern computer systems, additional hardware devices can be used to provide
    user position sensing, sensory display, and programming of appropriate interaction
    to meet the scenarios described in the definition. Helmets, also known as head-mounted
    displays (`HMDs`), may or may not allow users to see what''s going on around them.


    Depending on the model, the helmet may have a single screen or two screens (one
    for each eye). The computer system can tell where a participant is looking thanks
    to a tracking sensor attached to their head. The computer displays a visual representation
    of the participant''s location in a matter of seconds. As a result, the participant
    can explore a computer-generated world in a way that is as natural and intuitive
    as possible, given the limitations of current technology. It is possible to incorporate
    additional devices into such a system so that participants are able to interact
    with the world in a variety of ways. Voice recognition and a glove connected to
    the computer allow them to interact with the world through the voice and movement
    of objects in the world.


    Creating a virtual reality experience can be done in a variety of ways, including
    placing the user in a virtual reality room surrounded by computer-generated imagery.
    Typically, this is done by projecting computer graphics onto large stationary
    screens via a rear-screen projection method. As an example, the `CAVE` system
    from the University of Illinois at Chicago''s Electronic Visualization Lab [`Cruz-Neria
    et al. 1992`] is well-known. Even if the participant is only partially immersed
    in the visuals, the experience can still be engrossing.


    Virtual reality (`VR`) isn''t always a visual experience. A surgeon could use
    computer-connected medical instruments to interact with a virtual patient.


    Devices that provide haptic feedback (resistance and pressure) for the doctor''s
    hands, simulating the feel of instruments on the organs, track the doctor''s hands.


    ## Artificial Reality


    Artificial reality is another term for interactive environments in which a user
    can participate. The term "artificial reality" was coined by Myron Krueger to
    describe his research, and it is now commonly known as "virtual reality." A great
    deal of the material in his second book, `Artificial Reality II`, is devoted to
    the topic of artificial reality''s relationship to both art and technology. In
    Krueger''s glossary, he defines artificial reality as follows (and I''ll quote):


    - In an artificial reality, the body''s relationship to a graphic world is interpreted
    as a participant''s action and generated responses that maintain the illusion
    that his or her actions are taking place within that world.


    ## Virtual


    The word "virtual" is often used to imply that virtual reality technology is involved
    because of the hype surrounding virtual reality. The term "virtual" doesn''t imply
    that it''s a virtual reality, but that doesn''t mean it is.


    A computer system''s name can include the word "virtual" to indicate that some
    of the system''s components are extensions of the hardware, emulating the real
    thing through a different source. Another application is in computer-generated
    virtual worlds, where objects appear to be real. The word "virtual" can be added
    to each object''s name to indicate that it is merely an image of the physical
    object it represents. In a virtual world, we can describe a virtual table and
    a virtual kitchen. Similar to its use in virtual reality, the term "virtual image"
    is used in the field of optics to describe objects that appear to exist through
    a lens or mirror.


    ## Virtual World


    Virtual environments and virtual worlds are two terms that are frequently misunderstood.
    What is the relationship between virtual reality and the virtual world? Both "virtual
    reality" and "virtual world" are often referred to as "virtual environment." However,
    the term "virtual environment" has been around for a long time. It is possible
    to define a virtual environment as either a virtual world or a virtual reality
    hardware configuration. To describe their work in creating an interface that allowed
    a first-person perspective on a computer-generated scene, researchers at NASA''s
    Ames Research Lab used the term virtual environment in the mid-1980s.


    ## Cyberspace


    The term "cyberspace" is also important to understand in relation to these terms.
    People have been able to communicate with each other via technology (such as the
    telephone) for many years now. As a result, a brand-new location in cyberspace
    was born. William Gibson first used the term "cyberspace" in his novel `Neuromancer`
    in 1984 to describe the vast network of computers in the future that would allow
    its inhabitants to search for, retrieve, and communicate data.


    Virtual reality is not the same as cyberspace. While virtual reality can be used
    to communicate in cyberspace, it isn''t necessary. There are numerous examples
    of simple text, voice, or video triggering the creation of a virtual world on
    the internet. There are numerous other examples of places that can only be found
    online, such as live chat forums, `MUDs`, newsgroups, and so on. The telephone,
    CB radio, and video conferencing are all examples of non-internet communication.


    It''s interesting to note that this new space is often treated as if it were a
    real-world place. Here and there, people''s use of the words "here and there"
    stands out. If you want to know if someone is participating in a live chat forum,
    you might ask, "Is Beaker here?" This refers to the virtual space created by the
    forum. Even in television interviews where the host says, "Here with us now is
    an expert in virtual reality, Dr. Honeydew," this same phenomenon occurs. However,
    that person is frequently not present in their studio at all but rather on a large
    television screen in another location.


    ## Augmented Reality


    In some cases, virtual reality applications are designed to combine virtual representations
    with real-world perception. Additional information about the real world can be
    gained by using virtual representations. The term "augmented reality" is used
    to describe this type of application (`AR`). Special display technology is used
    in `AR` to allow users to overlay additional information on top of the real world.
    This word comes from the definition of augment in the New International Dictionary
    of the English Language (1989): "to increase in size or extent." With augmented
    reality, we''re giving users access to more data than they''d get from their normal
    senses.


    Virtual reality, like augmented reality, can be thought of as a subset of the
    former. Instead of being immersed in physical reality, one is transported into
    a hybrid reality that combines the real and the virtual. In most cases, the sense
    of sight is heightened. Contractors who need information about a building''s mechanical
    systems might display the location of pipe and ductwork on the computer-connected
    goggles they wear as they walk around the building. In the future, doctors may
    use `AR` to examine a patient''s internal organs while maintaining a view of the
    patient''s entire body.


    Potential `AR` applications are centered around the idea of repairing living or
    mechanical systems'' internal components. One way augmented reality might be used
    in medicine is to show doctors and patients exactly where cancerous tissue is
    located in their bodies. `AR` could also be used to inform a surgeon where to
    make an incision in the event of an emergency. A medical student might benefit
    from a third application if it explains how to properly make an incision.

