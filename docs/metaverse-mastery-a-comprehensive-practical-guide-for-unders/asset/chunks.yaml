  trans: '


    许多当前的耳机设备（包括 `Google Cardboard`）都可以播放空间音频。耳朵位于头部两侧的听者可以从空间音频中获益。用户的左耳将接收来自设备右侧的声音，且带有延迟（因为声波传播到距离声源较远的耳朵较慢）。在空间音频出现之前，应用程序简单地从左或右扬声器播放声音并在它们之间进行交叉淡出。


    立体声录音使用两个间隔开的麦克风完成，录制两个独立的音频通道。为了营造松散的空间感，这种录制方法可以在每个通道之间进行声相平衡。使用模拟人头的麦克风会产生被称为
    `binaural recordings`（双耳录音）的双通道录制。通过耳机播放可以非常真实。虚拟现实中现场音频的 `Binaural recordings`
    可以为终端用户提供非常沉浸的体验。


    空间音频和双耳录音都有缺点：需要耳机来体验 3D 效果。对于大多数 VR 头显设备来说这不是致命缺陷，但在比较头显设备时需要考虑到。


    ## 虚拟控制器


    如果你的输入系统没有视觉效果那么保真，你的虚拟体验将迅速失去效力。当用户在虚拟世界中移动手脚时，沉浸感会被打破，因为这些动作没有在虚拟世界中反映。Oculus
    Rift 创始人 Palmer Luckey 告诉 `The Verge`：“虚拟现实体验如果只有视觉方面将是不完整的。”为了与虚拟世界交互，你必须拥有一个完全集成的输入/输出系统，允许自然的视角和自然的交互。


    当你探索虚拟现实世界时，你会遇到各种输入设备和功能。它们从简单到复杂应有。它们对于虚拟交互应该如何运作都有不同的理念。最简单的输入方案（例如通过注视来触发动作）有时是体验的最佳解决方案。在某些情况下，没有什么比一个模拟用户手部动作的完全实现的数字手更能增强沉浸式体验了。


    ### 切换按钮


    切换按钮非常普通，以至于不需要在这里列出。此外，`Google Cardboard` 目前是唯一带有内置控制器的虚拟现实头显。（截至本文撰写时，仅根据设备销售数量）。谈到按钮，没有什么特别需要解释的，只需指出它们在哪里（或者如果用户不知道在哪里，就指引它们指向正确的方向）即可。动作在按下按钮时开始。


    ### 集成硬件触摸板


    某些头显侧面内置的触摸板（例如 `Samsung` 的 `Gear VR`）将集成硬件按钮的概念更进了一步。使用触摸板代替切换按钮提供了更好的用户体验。触摸板允许用户水平或垂直滑动、点击项目、切换音量并在必要时退出内容。此外，如果用户丢失了运动控制器，触摸板可以作为设备控制器的替代品。


    集成控制方案的缺点是，它们必须能够与实际运行体验的设备通信。例如，某些内置硬件控制的移动 VR 头显可能需要通过 `micro-USB`（或类似的连接）连接到移动设备。触摸板也具有将用户从虚拟世界中拉出的潜力，因为它们与虚拟世界缺乏自然的集成（即它们没有在虚拟世界中模拟控制器）。


    ### 注视控制


    虚拟现实应用程序可以将注视控制整合到用户界面中。如果你正在寻找一种更被动的 VR 体验，这些对你来说是很好的选择。例如，而不是使用触摸板或运动控制器，你只需盯着控制按钮预设的时间即可激活它。手势控制经常用于活跃程度较低的应用程序，例如视频和照片查看器，用户在这些应用中更多是被动参与。


    此外，注视控制的使用不仅限于被动交互。在 VR 中，注视经常与其他交互方法（如硬件按钮或控制器）结合使用。随着眼动追踪被更广泛地接受，注视控制的普及可能会增加。用户注视的控制包括
    `reticle`（准星/或光标）、`timer`（计时器）以及其他功能。用户只需专注几秒钟即可在给定项目上选择或启动动作。此外，注视控制可以与其他类型的输入结合使用以实现更深层次的交互。


    `Reticle`（准星）是任何用于显示用户在虚拟现实中看向何处的图形。当使用没有眼动追踪的头显时，这通常是用户训练眼睛的地方。`reticle` 通常只是一个简单的点或十字线，它位于所有其他元素之上，帮助用户视觉化他们当前正在选择的内容。在此期间，在头显中更先进的眼动追踪广泛普及之前，视野中心的
    `reticle` 可以提供一个简单的解决方案。


    ### 键盘和鼠标


    与 VR 头显的交互有时可以通过标准鼠标和键盘来实现。使用头显时，很难看到键盘，这可能是该设置的缺点。即使是最熟练的盲打字员，如果无法向下看键盘（即使只有片刻），很难打字。另一方面，使用鼠标也有其缺点。鼠标长期一直是
    2D 数字环境（如桌面电脑）导航的主要手段。然而，在 3D 环境中，用户的视线应该由头显控制。在某些早期应用程序中，可以使用鼠标和物理视线来改变用户的视角，但这种交互可能非常困惑，因为鼠标会将用户的视图向一个方向拉，而他们的物理视线会将其向另一个方向拉。


    某些 VR 应用仍然支持键盘和鼠标，但这些输入方法在很大程度上被更集成的解决方案取代了。然而，这些新的集成解决方案可能有它们自己的缺点。无法再使用键盘作为主要输入设备向应用程序输入长文本。


    针对这个问题已经提出了许多解决方案。`Logitech` 为 `HTC Vive` 开发了一个虚拟键盘，允许用户看到其虚拟表示。为了帮助全球的盲打字员，`Logitech`
    在你的虚拟现实空间中物理键盘上方创建了其键盘的 3D 模型。


    还有完全数字化的文本输入方法。`Jonathan Ravasz''s Punch Keyboard` 使预测输入成为可能，它使用运动控制器作为鼓槌。


    ### 标准游戏手柄


    对于许多游戏玩家来说，熟悉的输入方法是标准游戏手柄（或游戏控制器）。当原始的 `Oculus Rift` 发货时，许多玩家就已经熟悉 `Xbox One`
    控制器了。


