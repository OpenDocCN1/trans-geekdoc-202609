  trans: '

    虚拟现实如果实施得当，具有彻底改变我们的日常生活并提高生活质量的潜力。最后，可以说虚拟现实是一项学习新知识的价值工具，也是一种通过访问设计成艺术品的虚拟世界并在体验积极情绪来缓解压力的方式。例如，许多公司已经在使用虚拟现实为客户提供更个性化、更直观的体验，并连接全球的人们。


    虚拟现实的全部潜力正被多个领域，包括企业培训、商业、战斗训练、医疗、教育以及前提到的游戏技术等。在无数其他惊人的益处中，能够训练和练习模拟手术、战斗、飞行等潜在危险的现实世界操作，简直是
    VR 技术最显著的实务益处。


    虚拟现实技术让用户感觉自己正身处真实的地方，听到真实的声音，看到真实的物体。用户通过使用尖端的视觉效果、音频和其他技术，可以让自己沉浸在游戏世界中。


    尽管触觉、嗅觉和味觉目前不是数字体验的一部分，但未来将会成为。因此，生活的完整体验会被削弱。使用虚拟现实进行通信不应作为面对面的替代。由于缺乏肢体语言和其他交流手段，人们对欺骗的脆弱性将比他们目前在人际互动中经历的更加放大。


    学生可以在安全的环境中探索虚拟环境和危险练习技能。如果学生使用软件指出自己的错误并接收关于如何修复错误的即时反馈，他们将为现实世界做好更好的准备。学生可以使用手持
    VR 控制器举起、推和拉虚拟物体，从而在虚拟环境中物理地移动并与之互动。虚拟现实正在将教育推向新的高度。


    你所有的感官都沉浸在抬头显示器为你创造的虚拟娱乐世界中。你可以在一个充满复杂细节和各种功能的虚拟环境中设计、编辑、转换和测试你的模型。感谢于虚拟现实，你的员工可以体验数千种他们原本无法接触的情况，例如第一次使用昂贵的设备，或处于生命危险的危险境地。


    虚拟现实既有优点也有缺点：


    *   创建一个安全的学习环境。

    *   物理副作用。

    *   娱乐。

    *   缺乏灵活性。

    *   帮助培养技能。

    *   高成本。

    *   数据收集和隐私面临风险。

    *   失去人际接触。

    *   消除语言障碍。

    *   用户对虚拟世界产生成瘾。


    并不是所有人都能接触先进的虚拟现实技术，这是游戏的主要缺点之一。随着虚拟现实设备成本的不断下降，这种趋势值得关注。随着越来越多的人接触到虚拟现实技术，这种超凡的现象很快将被更广泛的观众所接触。


    ## 虚拟现实体验的核心要素


    虚拟世界、沉浸感、感官反馈和交互性都是虚拟现实的重要组成部分——或者说，对任何现实都是如此。


    ### 1. 虚拟世界


    例如，一个虚拟世界只能存在于特定的介质中。例如，它可能仅存在于一个人的脑海中，也可能以允许他人访问的方式进行广播。就像戏剧或电影剧本存在于其作品表演的语境之外一样，虚拟世界可以在不显示在
    `VR` 系统（即为产生 VR 体验而组装的硬件、软件和内容的集成集合）的情况下存在。虚拟世界在这些剧本中被描绘。将这个类比更推进一步。我们可以把戏剧的剧本仅仅看作它的描述。当戏剧的故事通过演员、布景和音乐赋予生命时，虚拟世界就被创建了。基于计算机的虚拟世界相似之处在于，它们描述了模拟中出现的物体。虚拟现实是一个术语，用于描述通过系统看到那个世界的体验，该系统以物理沉浸式的、交互式的呈现将这些物体和交互带给我们。


    ### 2. 沉浸感


    虚拟现实可以被定义为对另一种现实或视角的沉浸，因为用户必须完全沉浸在虚拟世界中。然而，这意味着什么呢？沉浸在不同现实或视角中的最佳地方在哪里？替代现实或视角：这些东西到底是什么？


    如果一个介质的参与者能够在没有介质帮助的情况下感知到比他们通常看到或听到的之外的东西，它就符合我们的定义。这个定义承认了这两种观察事物的方式，承认了感知当前所处现实之外其他东西的可能性。


    替代世界可以是实际位置的表示，也可以是纯虚构的。小说家、作曲家和其他创意人员经常想象替代世界。


    想象一下，你被赋予了魔法能力，生活在一个不同于你自己的的世界。人们和物体获得了新的能力；也许重力不存在。这个区域由人类和非人类生物栖息。我们不知道其他宇宙中是否存在空间。两点之间的最短路径可能不是直线。你认为这可能吗？


    如果你能想象这样一个地方，那么它确实是一个现实。涉及到虚拟世界时，想象力是起点。我们拥有想象力，可以在任何地方、任何时间、与任何人一起生活。我们只受限于想象力以及我们用来描述它们的词汇。


    我们经常有必要将想法化成具体的形态。当我们这样做时，我们能够参与他人的创作并与他们分享自己的创作。我们可以通过书籍、电影、广播、电视和动画旅行到异域风情的地方并体验不同的生活方式。然而，每种媒体只产生一种通信方式：从创作者到观众。观点已经决定。对话已经写好。故事的结果已经确定。然而，每个观众成员可能都以以独特的方式做出反应，即使创作者没有预料到这一点。


    模仿（Mimesis，一个描述世界真实程度或至少一致性的术语）可以决定一部小说是一个沉浸读者的替代世界，还是仅仅是一个讲故事的小说。物理沉浸而非心理沉浸是虚拟现实的第一步。许多其他媒体属于我们虚拟现实简单定义的范畴，因为物理沉浸是一个必要的组成部分。


    ***物理与心理沉浸***


