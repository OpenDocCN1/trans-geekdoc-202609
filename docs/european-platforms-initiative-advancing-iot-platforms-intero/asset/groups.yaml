    ## 4.3.3. Interoperability aspects


    Solving interoperability issues related to these patterns requires the use of
    common information models, e.g., offered through Semantic Web technologies. Those
    common information models need to allow the description of offerings, so that
    their consumers (e.g., services or applications) can work with them, even if they
    are from different domains or systems. The BIG IoT Core Model defines the core
    vocabulary required to create an Offering Description. The Offering Description
    relies on the work done within the W3C Web of Things (WoT) group, in particular,
    the Thing Description (TD) format [21] and going to be mapped also to W3C SSN/SOSA.
    The semantics are further enriched by domain independent and domain dependent
    models. A domain dependent model is used to semantically annotate the metadata,
    offering category and input/output data of an Offering Description. The BIG IoT
    semantic Application Domain Model is created using the BIG IoT semantic Core Model,
    domain independent and/or domain models. This model establishes the relationship
    between the core model and domain model. Along with offering categorization and
    data modeling, the Domain Model also defines the vocabulary to semantically annotate
    the domain dependent features of an offering. For example, the class “mobility:ParkingSpace”
    can be used to annotate a parking space and its features such as parking space
    id, or parking space location.


    For the semantic annotation of offering descriptions, e.g., defining the semantics
    of inputs, outputs and offering category, a well-defined vocabulary of domain
    terms is needed. This vocabulary should be widely shared and agreed upon so that
    all consumers and providers of IoT platforms can rely on it. Further, it should
    evolve in an open community process to allow active engagement by ecosystem stakeholders.
    We have selected schema.org as a basis for our domain model, as it provides a
    vendor-neutral, community-developed vocabulary for structured data.


    The central pillar of the ecosystem is the Marketplace. Here, a Provider (e.g.,
    an IoT platform) registers its resources by uploading an offering description
    (Section 3.2). To facilitate a provider in conforming with the BIG IoT API for
    offering its resources in the ecosystem, the Provider Library (Lib) can be utilized.
    It can be used to establish a gateway to the actual resources and implements the
    BIG IoT API and the various interactions and workflows (Section 3.4). The library
    authenticates the provider with the Marketplace and registers its offerings. It
    also offers a Web API to grant access to the resources.


    Beyond these mechanisms for providing access to IoT platforms, the Marketplace
    enriches the ecosystem with the possibility of monetizing the consumption of resources.
    Therefore, both sides, the consumer and provider, report accounting data (e.g.
    number of resource records obtained/provided) back to the Marketplace. This is
    the basis for charging and billing, and the foundation for business opportunities
    around the ecosystem.


    The above described IoT ecosystem is platform-scale independent. I.e., IoT platforms
    can operate either on cloud-level (e.g., server, data centre), on fog-level (e.g.,
    gateway, cellular communication base station), or on device-level (e.g., Raspberry
    PI, smartphone). In the last case, the IoT platform can represent an IoT ‘thing’.
    The BIG IoT API can be used independent of this scale of the platform.


