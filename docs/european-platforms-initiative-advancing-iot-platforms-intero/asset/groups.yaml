    以及平台之间开展重大合作，为消费者和用户提供更好的解决方案。服务和数据的跨平台可用性将使当前服务提供商能够将其服务拓展到新市场，但更重要的是，我们预计通过管理来自不同来源的数据来创造创新解决方案的能力将催生新的商业机会。


    ## 物联网平台格局

    ### 2.1. 定义


    物联网平台可以被定义为一个智能层，将物联网设备连接到网络，并将应用程序从设备中抽象出来，以实现服务的开发。物联网平台实现几个主要目标，例如灵活性（能够在不同环境中部署设备）、可用性（能够使用户体验变得简单）和生产力（通过实现服务创建来提高效率，同时也实现新服务开发）。物联网平台促进通信、数据流、设备管理和应用程序的功能。目标是在物联网平台框架内构建物联网应用程序。物联网平台允许应用程序将机器、设备、应用程序和人员连接到数据和控制中心
    [1]。


    物联网平台的功能涵盖从传感器/执行器、硬件到连接、云和应用程序的数字价值链，如图 2.1 所示。硬件连接平台用于连接边缘设备并在数据中心外部处理数据（边缘计算/雾计算），并对设备进行编程以实现即时决策。其主要优势是通过从传感器到数据中心的先进数据管理和分析实现安全性、互操作性、可扩展性和可管理性。物联网软件平台包括异构传感器/执行器的集成；各种

    ![](img/084215b3209e41ed4c28b3829663f1e4_11_0.png)

    图 2.1. 覆盖数据价值链的物联网平台 [1]


    通信协议抽象了所有这些复杂性，并为开发人员提供简单的 API，以便通过任何网络与任何传感器通信。


    物联网平台还协助数据摄取、存储和分析，以便开发人员能够专注于构建应用程序和服务，而这正是物联网中真正的价值所在。基于云的物联网平台由云提供商提供，以支持开发人员在其云上构建物联网解决方案。基础设施即服务（IaaS）提供商和平台即服务（PaaS）提供商为物联网开发人员提供覆盖不同应用领域的解决方案。PaaS
    解决方案抽象了底层网络、计算和存储基础设施，专注于移动和大数据功能，同时正在抽象边缘设备（传感器/执行器）

    并增加数据摄取/处理和分析服务的功能 [1]。


    物联网平台的定义在细微且或许次要的细节上可能有所不同，但在主要功能上重叠。其中最简洁的物联网平台定义之一由 Gartner [2] 提出。它将物联网平台定义为软件套件或
    PaaS 云服务，用于监控，并可管理和控制各种类型的端点，通常通过最终用户在平台上构建的应用程序实现。它促进涉及物联网端点以及与企业资源集成的操作。平台应具备以下能力：

    - 设备及其应用软件的配置与管理

    - 数据聚合、集成、转换、存储和管理（通常统称为“数据消化”）

    - 事件处理（规则引擎/编排/BPM）

    - 自定义和构建应用程序（SDK、应用服务器、IDE 等）

    - 物联网数据分析与可视化

    - 网络安全

    - 物联网设备通信（网络和/或互联网）

    - 适配器（API 中心、网关软件以及端点上的应用程序）

    - 面向终端用户和开发者的用户界面


    物联网平台促进通信、数据流、设备管理和应用程序的功能。平台本身并不是应用程序，尽管许多应用程序可以在物联网平台框架内完全构建。它将机器、设备、应用程序和人员链接到数据和控制中心。它并不局限于实体中央指挥；理想情况下，它可以从许多不同的位置点访问和管理。它采用更好的、更快的搜索引擎和数据存储系统，具有足以处理远超行业目前所达到的规模的容量和复杂性
    [3]。其大部分元素都是基于云的

    并运行在无线连接上，该连接可通过第三方提供商、应用程序编程接口（API）、蜂窝能力或——最可能的是——这些技术的组合来建立。


    通过仪表板、API、数据引擎和算法，平台使企业网络的元素和部门能够以比我们迄今所见更快的速度和更大的灵活性相互连接、监控和通信。来自不断扩大的生态系统的数据可以完全在线收集、排序和利用。平台还可以实现数据优先级排序，这在机器、传感器和其他对象开始产生新洪流信息时具有至关重要的意义。


    物联网平台提供安全功能、可扩展性以及拉取、存储和分析数据的能力。它可以连接机器、人员、应用程序或三者兼具。像任何智能网络一样，它提供固有的预测能力，利用数据用于维护和故障排除。用户界面直观且可扩展，允许未来开发应用程序扩展以及跟踪日益增多的连接设备、人员和数据源所需的必要可扩展性。


    本质上，物联网平台允许在增值应用程序中更大程度地集中资源。无需要求公司专注于技术栈的较低层级，这些层级虽然必不可少但并非价值正向，可以将注意力放在应用程序开发上；更智能、更集成的物联网生态系统；以及智能数据生成。


    使用物联网平台，应用程序可以更快地推向市场并获得更好的支持。连接性和数据管理——历史上需要大量时间和开发成本投入——在物联网平台上是“理所当然”的，就像电力生成一样可靠，也同样解放用户。


    物联网的根基是连接性：更多的物、更多的人，以及它们之间产生的连接矩阵。然而，在不到十年的时间里，该技术已远远超出了这一基本考虑。许多公司可能曾认为内部构建平台是有利的，但现在很明显，技术栈的很大一部分现在可以用现成工具和与供应商的有效合作来实现。


    ThingWorx [4] 将物联网平台定义为一组组件，使其能够实现：

    - 部署监控、管理和控制连接设备的应用程序。

    - 从连接设备远程收集数据。

    - 设备之间独立且安全的连接。

    - 设备/传感器管理。

    - 与第三方系统集成。


    物联网平台独立存在于物联网技术栈的硬件层和应用层之间。理想的平台将与任何连接设备集成，与设备应用程序融合，并以相同的方式实现物联网功能和功能到任何设备中。


    Link Labs [5] 在高层面上将物联网平台定义为“将边缘硬件、接入点和数据网络连接到价值链其他部分（通常是面向最终用户的应用程序）的支持软件”。物联网平台通常处理持续的管理任务和数据可视化，从而使用户能够自动化其环境。你可以将这些平台视为边缘收集的数据与面向用户的
    SaaS 或移动应用程序之间的中间人”。


    物联网平台通常被称为中间件解决方案，可统称为物联网的价值链，是物联网的“管道”。通常，物联网或 M2M 解决方案是来自多个供应商的功能的组合，包括：

    - 传感器或控制器。

    - 用于在数据网络之间聚合和传输数据的网关设备。


