    Every interoperability mechanism can be accessed through an API. The interoperability
    infrastructure layers can communicate and interoperate through the interfaces.
    This cross-layering allows to achieve a deeper and more complete integration.


    ## 4.5.3. Layers and interoperability aspects


    ### Device layer (D2D)

    At the device level, D2D solution will allow the seamless inclusion of novel IoT
    devices and their interoperation with already existing ones. D2D solution is a
    modular gateway that supports a vast range of protocols as well as raw forwarding.
    It is composed of a physical part that only handles network access and communication
    protocols, and a virtual part that handles all other gateway operations and services
    (gw virtualization). When connection is lost, the virtual part remains functional
    and is capable to answer the API and Middleware requests. The gateway follows
    a modular approach to allow the addition of optional service blocks to adapt to
    the specific case, allowing a fast growth of smart objects ecosystems.


    ### Network layer (N2N)

    N2N solution enables seamless Network-to-Network interoperability, allowing transparent
    smart object mobility, and information routing support. It will also allow offloading
    and roaming, which implies the interconnection of gateways and platforms through
    the network. Interoperability is achieved through the creation of a virtual network,
    using SDN and NFV paradigms, with the support of the N2N API. The N2N solution
    will allow the design and implementation of fully interconnected ecosystems, and
    solve the smart object mobility problem.


    ### Middleware layer (MW2MW)

    At the middleware level INTER-IoT solution will enable seamless resource discovery
    and management system for the IoT devices in heterogeneous IoT platforms. Interoperability
    at the middleware layer is achieved through the establishment of an abstraction
    layer and the attachment of IoT platforms to it. Different modules included at
    this level provide services to manage the virtual representation of the objects,
    creating the abstraction layer to access all their features and information. Those
    services are accessible through a general API. Interoperability at this layer
    will allow a global exploitation of smart objects in large scale multi-platform
    IoT systems.


    ### Application and Services layer (AS2AS)

    INTER-IoT will enable the use of heterogeneous services among different IoT platforms.
    Our approach will allow the discovery, catalogue, use and even composition of
    services from different platforms. AS2AS will also provide an API as an integration
    toolbox to facilitate the development of new applications that integrate existing
    heterogeneous IoT services.


    ### Semantics and Data layer (DS2DS)

    INTER-IoT guarantees a common interpretation of data and information among different
    IoT platforms and heterogeneous data sources that typically employ different data
    formats and ontologies, and are unable to directly share information among them.
    INTER-IoT DS2DS approach is the first solution that provides **universal semantic
    and syntactic interoperability** among heterogeneous IoT platforms. It is based
    on a novel approach, a semantic translation of IoT platforms’ ontologies to/from
    a common Central Ontology that INTER-IoT employs, instead of direct platform-to-platform
    translations. This technique reduces dramatically the number of potential combinations
    of semantic translations required for universal semantic interoperability. INTER-IoT
    semantic interoperability tools work with any vocabulary, or ontology. INTER-IoT''s
    own modular Central Ontology, called GOIoTP, for all IoT platforms, devices and
    services, is available at http://docs.inter-iot.eu/ontology. Also, syntactic translators
    allow interoperability between different data formats, such as JSON, XML, and
    others. Although the pilot deployments of INTER-IoT realize the Core Information
    Model with Extensions approach to semantic interoperability, INTER-IoT supports
    any solutions between its pilot approach and Core Information Model.


    ### Cross-Layer

    INTER-IoT also guarantees non-functional aspects that must be present across all
    layers: trust, security, privacy, and quality of service (QoS). As well, INTER-IoT
    provides a virtualized version of the solution for each layer, to offer the possibility
    of a quick and easy deployment. Security is guaranteed inside each individual
    layer, and the external API access is secured through encrypted communication,
    authentication and security tokens. INTER-IoT complies with the new European Data
    Privacy Law, and in the specific case of e-Health, in which information is highly
    sensitive, the Medical Device Regulation law.


    Regarding the architectural interoperability patterns described in Section 3.1.1,
    INTER-IoT supports all six patterns of interoperability:

    - Cross Platform Access, which is accomplished through AS2AS services or through
    MW2MW.

    - Cross Application Domain Access, as far as INTER-IoT is domain-agnostic and
    has universal semantic interoperability by means of the DS2DS solution.

    - Platform Independence, through AS2AS service composition and DS2DS semantic
    and syntactic translation.

    - Platform-Scale Independence, by means of INTER-IoT AS2AS.

    - Higher-level Service Facades, through INTER-IoT AS2AS services.

    - Platform-to-Platform interaction, INTER-IoT main goal by design. It is achieved
    through D2D and/or MW2MW solutions.


    All the aforementioned patterns are architectural. INTER-IoT has identified main
    patterns of interoperability from a different point of view or analysis: from
    the semantic point of view, regarding semantic interoperability and from the middleware
    interoperability point of view (related with syntactic and functional interoperability).
    INTER-IoT has its own macro and micropatterns that match with this approach.


    Finally, regarding the three main types of interoperability (functional, syntactic,
    semantic), INTER-IoT enables all of them. Universal syntactic and semantic interoperability
    among any platforms with different data formats and ontologies is possible through
    the INTER-IoT DS2DS solution. Moreover, other INTER-IoT layers (D2D & N2N) can
    provide functional interoperability among smart elements, enabling connectivity
    to the network.


    ## 4.6. symbIoTe


    The main goal of **symbIoTe** (**symbiosis of smart objects across IoT environments**)
    is to devise a **flexible and secure interoperability middleware** across IoT
    platforms facilitating rapid development of IoT applications across platforms,
    platform collaborations as well as dynamic and adaptive smart spaces. This is
    accomplished by 1) a **semantic IoT search engine** for connected (virtualized)
    smart objects (i.e., IoT resources) registered by platform providers, 2) **abstraction
    layer** for unified and secure usage of those resources across platforms, 3) **high-level,
    domain-specific APIs** (“Enablers”) for rapid cross-platform application development,
    4) **IoT platform federations**, i.e., associations between two platforms facilitating
    their secure interaction, collaboration and bartering of resources, 5) **dynamic
    and self-configurable** smart spaces offering interoperability for collocated
    devices and gateways, and 6) **secure interworking protocol** between the IoT
    platforms, gateways and smart devices. This supports SMEs and new entrants in
    the IoT market to build innovative IoT services within short development life
    cycles.

