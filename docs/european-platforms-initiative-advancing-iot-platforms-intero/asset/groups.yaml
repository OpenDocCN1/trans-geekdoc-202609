    # 4.5.2. INTER-IoT Architecture


    INTER-IoT presents a novel layer-oriented solution for interoperability, to provide
    interoperability at any layer and across layers among different IoT systems and
    platforms. Contrary to a more general global approach, the INTER-IoT layered approach
    has a higher potential in order to provide interoperability. It facilitates a
    tight bidirectional integration, higher performance, complete modularity, high
    adaptability and flexibility, and presents increased reliability.


    This layer-oriented solution is achieved through INTER-LAYER, several interoperability
    solutions dedicated to specific layers. Each interoperability infrastructure layer
    has a strong coupling with adjacent layers and provides an interface. Interfaces
    will be controlled by a meta-level framework to provide global interoperability.
    Every interoperability mechanism can be accessed through an API. The interoperability
    infrastructure layers can communicate and interoperate through the interfaces.
    This cross-layering allows to achieve a deeper and more complete integration.


    # 4.5.3. Layers and interoperability aspects


    Device layer (D2D): At the device level, D2D solution will allow the seamless
    inclusion of novel IoT devices and their interoperation with already existing
    ones. D2D solution is a modular gateway that supports a vast range of protocols
    as well as raw forwarding. It is composed on a physical part that only handles
    network access and communication protocols, and a virtual part that handles all
    other gateway operations and services (gw virtualization). When connection is
    lost, the virtual part remains functional and is capable to answer the API and
    Middleware requests. The gateway follows a modular approach to allow the addition
    of optional service blocks to adapt to the specific case, allowing a fast growth
    of smart objects ecosystems.'
  - '[PAGE 47]


    **Network layer (N2N):** N2N solution enables seamless Network-to-Network interoperability,
    allowing transparent smart object mobility, and information routing support. It
    will also allow offloading and roaming, what implies the interconnection of gateways
    and platforms through the network. Interoperability is achieved through the creation
    of a virtual network, using SDN and NFV paradigms, with the support of the N2N
    API. The N2N solution will allow the design and implementation of fully interconnected
    ecosystems, and solve the smart object mobility problem.


    **Middleware layer (MW2MW):** At the middleware level INTER-IoT solution will
    enable seamless resource discovery and management system for the IoT devices in
    heterogeneous IoT platforms. Interoperability at the middleware layer is achieved
    through the establishment of an abstraction layer and the attachment of IoT platforms
    to it. Different modules included at this level provide services to manage the
    virtual representation of the objects, creating the abstraction layer to access
    all their features and information. Those services are accessible through a general
    API. Interoperability at this layer will allow a global exploitation of smart
    objects in large scale multi-platform IoT systems.


    **Application and Services layer (AS2AS):** INTER-IoT will enable the use of heterogeneous
    services among different IoT platforms. Our approach will allow the discovery,
    catalogue, use and even composition of services from different platforms. AS2AS
    will also provide an API as an integration toolbox to facilitate the development
    of new applications that integrate existing heterogeneous IoT services.


    **Semantics and Data layer (DS2DS):** INTER-IoT guarantees a common interpretation
    of data and information among different IoT platforms and heterogeneous data sources
    that typically employ different data formats and ontologies, and are unable to
    directly share information among them. INTER-IoT DS2DS approach is the first solution
    that provides **universal semantic and syntactic interoperability** among heterogeneous
    IoT platforms. It is based on a novel approach, a semantic translation of IoT
    platforms’ ontologies to/from a common Central Ontology that INTER-IoT employs,
    instead of direct platform-to-platform translations. This technique reduces dramatically
    the number of potential combinations of'
