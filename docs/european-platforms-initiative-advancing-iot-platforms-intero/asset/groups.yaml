    Utilising IoT (platform) technology for handling automated complex systems is
    a key challenge for the future. In this context, complex systems relate to systems
    that are heavily composed of rich sensing capabilities (e.g. radar, visual) and
    advanced actuation (e.g. controlling robot arms). The automation of these complex
    systems requires intelligent sensor data processing and reasoning to meaningfully
    control the actuation. IoT platform technology has the potential to facilitate
    and enhance the creation of systems significantly by being the interoperable interface
    within and between complex systems and the automation. Sensors, actuators and
    ‘things’ description formats, communication protocols and APIs defined by the
    IoT community need to use a lingua franca to enable such intelligent processing
    and reasoning.


    Examples for such automated complex systems where IoT platform technology can
    provide a drastic development boost range from connected robots and robotic ecosystems
    over automated manufacturing lines that are integrated with logistic chains to
    automated vehicles (ships, aircrafts, trains, trucks, cars) and fleets.


