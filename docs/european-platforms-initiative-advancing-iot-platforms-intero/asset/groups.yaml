    data and information, by processing and analysing them to develop end-to-end solutions
    |

    | Smart City Platform | Commercial, Bosch | Considering solutions for Smart Cities,
    the requirements differ from those known for classical enterprise applications.
    In fact, Smart City installations are composed of many different solutions individually
    customized for the city, but with a common need w.r.t. operation, data sharing
    and security. The Smart City platform (SCP) targets to connect the silos in the
    Smart City, i.e., governance, mobility, energy, environment, industry life, tourism,
    etc. Bosch SCP offers tools and methods to develop, operate and maintain such
    systems without sacrificing data security and privacy. |

    | Wubby Platform | Commercial, Econais | Wubby is an ecosystem of software components
    and services for rapid development of everyday objects [28]. Everyday objects
    are physical objects embedded with electronics, software, sensors and network
    connectivity to collect and exchange data. |

