    semantic translations required for universal semantic interoperability. INTER-IoT
    semantic interoperability tools work with any vocabulary, or ontology. INTER-IoT
    own modular Central Ontology, called GOIoTP, for all IoT platforms, devices and
    services, is available at http://docs.inter-iot.eu/ontology. Also, syntactic translators
    allow interoperability between different data formats, such as JSON, XML, and
    others. Although the pilot deployments of INTER-IoT realize the Core Information
