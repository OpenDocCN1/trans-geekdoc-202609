    The most common way to achieve this is by using an ontology which is ‘an explicit
    specification of a [shared] conceptualization’ [6] and can be imaged like a formally
    defined information model. This is in line with the idea of the Semantic Web [13]
    introduced by Tim Berners-Lee in 2001, proposing the evolution of the Internet
    from a web of documents to a web of machine-readable and -understandable data.
    The corner stone technologies of the Semantic Web are the Resource Description
    Format¹ (RDF), a lightweight (meta data) data model for describing ontologies,
    and SPARQL Protocol and RDF Query Language² (SPARQL), which both are standardized
