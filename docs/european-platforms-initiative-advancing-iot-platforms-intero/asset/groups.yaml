    # Annex


    The following section captures the different platforms the IoT-EPI projects are
    utilizing in their project.


    The purpose is to present the current state of play and to get a nover view of
    for the diversity and overlap of IoT platforms across the seven emerging ecosystems.


    The analysis briefly introduces the IoT platform name, whether the platform is
    commercial or not and provides a brief description of its main purpose.


    # AGILE


    | IoT platform | Nature of platform | Brief description |

    |---|---|---|

    | Resin.io | Commercial | Device management platform for Linux based IoT devices.
    It makes it simple to deploy, update, and maintain code running on remote devices.
    |

    | Eclipse IoT | Open source | Eclipse IoT provides the technology needed to build
    IoT Devices, Gateways, and Cloud Platforms. It also provides open source implementations
    for IoT standards such as MQTT, CoAP, LWM2M, OneM2M, OPC-UA and more. |

    | NodeRED | Open source | Tool for wiring together hardware devices, APIs and
    online services in new and interesting way. IoT service enablement platform developed
    by IBM. |'
