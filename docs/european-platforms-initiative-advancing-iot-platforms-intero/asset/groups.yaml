    ## Annex

    以下章节记录了 IoT-EPI 项目在其项目中使用的不同平台。


    目的在于呈现当前状况，并对七个新兴生态系统中的物联网平台的多样性和重叠性提供新的概览。


    该分析简要介绍物联网平台名称、平台是否为商业性质，并提供其主要用途的简要描述。


    ### AGILE

    | IoT 平台 | 平台性质 | 简要描述 |

    |---|---|---|

    | Resin.io | 商业 | 用于基于 Linux 的物联网设备的设备管理平台。它使部署、更新和维护远程设备上运行的代码变得简单。 |

    | Eclipse IoT | 开源 | Eclipse IoT 提供了构建物联网设备、网关和云平台所需的技术。它还提供了 MQTT、CoAP、LWM2M、OneM2M、OPC-UA
    等物联网标准的开源实现。 |

    | NodeRED | 开源 | 用于以新颖有趣的方式连接硬件设备、API 和在线服务的工具。由 IBM 开发的物联网服务使能平台。 |


    ### BIG IoT

    | IoT 平台 | 平台性质 | 简要描述 |

    |---|---|---|

    | Smart Data Platform | 开源 | CSI Piemonte 的智能数据平台 (SDP) 是一个自助服务平台，可基于物联网和大数据实现应用开发
    [27]。SDP 基于 Yucca 项目，可实现应用程序、社交网络、系统和分布式对象的互联，并收集数据和信息，通过处理和分析它们来开发端到端解决方案 |

    | Smart City Platform | 商业, 博世 | 针对智能城市解决方案，需求与传统企业应用已知需求不同。事实上，智能城市安装由许多为城市单独定制的解决方案组成，但对运营、数据共享和安全有共同需求。智能城市平台
    (SCP) 旨在连接智能城市中的孤岛，即治理、移动、能源、环境、工业生活、旅游等。博世 SCP 提供工具和方法来开发、运营和维护此类系统，而不牺牲数据安全和隐私。
    |

    | Wubby Platform | 商业, Econais | Wubby 是一个用于快速开发日常物体的软件组件和服务生态系统 [28]。日常物体是嵌入电子、软件、传感器和网络连接以收集和交换数据的物理物体。
    |

    | OpenIoT Platform | 开源 | OpenIoT 是一个传感器中间件平台，可简化异构传感器数据的收集，同时确保其语义标注 [29]。它在云中实现语义互操作性并提供物联网应用开发工具。
    |


