    services or functional blocks. Composed functional blocks result in a specific
    service, which as well can be part of an aggregation of several services. Figure
    4.8 introduces a functional view onto those micro services, labelled as functional
    blocks. Basis for all


    ![](img/084215b3209e41ed4c28b3829663f1e4_43_0.png)


    Figure 4.7. bloTope concept illustration.


    functional blocks inside the ecosystem is the compliance to O-MI and O-DF. This
    compliance brings automatically the fundamental services for "publication" and
    "consumption" and their inherited sub-functions. For the interconnection of various
