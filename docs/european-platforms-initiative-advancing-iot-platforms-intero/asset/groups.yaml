    ![](img/084215b3209e41ed4c28b3829663f1e4_57_1.png)


    ![](img/084215b3209e41ed4c28b3829663f1e4_57_2.png)


    - *数据处理* 组件提供额外的功能来处理和操作平台中生成的数据。

    - *智能标签* 组件促进智能标签的集成、创建和扫描。

