    ## Annex

    The following section captures the different platforms the IoT-EPI projects are
    utilizing in their project.


    The purpose is to present the current state of play and to get a novel overview
    of the diversity and overlap of IoT platforms across the seven emerging ecosystems.


    The analysis briefly introduces the IoT platform name, whether the platform is
    commercial or not and provides a brief description of its main purpose.


    ### AGILE

    | IoT platform | Nature of platform | Brief description |

    |---|---|---|

    | Resin.io | Commercial | Device management platform for Linux based IoT devices.
    It makes it simple to deploy, update, and maintain code running on remote devices.
    |

    | Eclipse IoT | Open source | Eclipse IoT provides the technology needed to build
    IoT Devices, Gateways, and Cloud Platforms. It also provides open source implementations
    for IoT standards such as MQTT, CoAP, LWM2M, OneM2M, OPC-UA and more. |

    | NodeRED | Open source | Tool for wiring together hardware devices, APIs and
    online services in new and interesting way. IoT service enablement platform developed
    by IBM. |


    ### BIG IoT

    | IoT platform | Nature of platform | Brief description |

    |---|---|---|

    | Smart Data Platform | Open source | CSI Piemonte''s Smart Data Platform (SDP)
    is a self-service platform enabling application development based on Internet
    of Things and Big Data [27]. SDP is based on project Yucca which allows for interconnecting
    applications, social networks, systems and distributed objects and collecting
    data and information, by processing and analysing them to develop end-to-end solutions
    |

    | Smart City Platform | Commercial, Bosch | Considering solutions for Smart Cities,
    the requirements differ from those known for classical enterprise applications.
    In fact, Smart City installations are composed of many different solutions individually
    customized for the city, but with a common need w.r.t. operation, data sharing
    and security. The Smart City platform (SCP) targets to connect the silos in the
    Smart City, i.e., governance, mobility, energy, environment, industry life, tourism,
    etc. Bosch SCP offers tools and methods to develop, operate and maintain such
    systems without sacrificing data security and privacy. |

    | Wubby Platform | Commercial, Econais | Wubby is an ecosystem of software components
    and services for rapid development of everyday objects [28]. Everyday objects
    are physical objects embedded with electronics, software, sensors and network
    connectivity to collect and exchange data. |

    | OpenIoT Platform | Open Source | OpenIoT is a sensor middleware platform that
    eases the collection of data from heterogeneous sensors, while ensuring their
    semantic annotations [29]. It enables semantic interoperability in the cloud and
    provides IoT app development tools. |

