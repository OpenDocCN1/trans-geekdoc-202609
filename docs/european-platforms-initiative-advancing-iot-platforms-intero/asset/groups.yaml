    ## IoT platforms interoperability concepts, approaches and principles


    Achieving interoperability is one of the main objectives of the IoT. As the name
    Internet of Things already states, it is all about connecting things and make
    them easily accessible just like the Internet today. "Broadly speaking, interoperability
    can be defined as a measure of the degree to which diverse systems, organizations,
    and/or individuals are able to work together to achieve a common goal" [6]. However,
    interoperability is a complex thing and there are many aspects to it. In literature,
    there exists quite a lot of different classifications of these aspects of interoperability,
    often also called levels of interoperability. One of the most important classification
    of levels of interoperability for technical systems is called Levels of Conceptual
    Interoperability Model (LCIM) and is depicted in Figure 3.1. Although it was created
    in the context simulation theory it has a much broader applicability. It defines
    six levels of interoperability: technical, syntactic, semantic, pragmatic, dynamic
    and conceptual interoperability.


    The European Interoperability Framework designed "to support the delivery of pan-European
    eGovernment services to citizens and enterprises" [8] defines only three levels:
    technical, semantic and organisational interoperability.


    ![](img/084215b3209e41ed4c28b3829663f1e4_17_0.png)


    Figure 3.1. The Levels of Conceptual Interoperability Model [7].


    A more IoT-specific classification is provided by ETSI and AIOTI and defines four
    levels [9]: technical, syntactic, semantic and organisational interoperability.
    In short, they are defined as follows.


    - **Technical Interoperability:** usually associated with communication protocols
    and the infrastructure needed for those protocols to operate.

    - **Syntactic Interoperability:** usually associated with data formats and encodings,
    e.g., XML, JSON and RDF.

    - **Semantic Interoperability:** associated with the common understanding of the
    meaning of the exchanged content (information).

    - **Organisational Interoperability:** associated with the ability of organisations
    to effectively communicate and transfer information even across different information
    systems, infrastructures or geographic regions and cultures.


    As this is the most agreed-upon classification of interoperability levels within
    the IoT domain we follow it in this document.


    ## 3.1. IoT platforms interoperability challenges


    ### 3.1.1. Patterns of IoT interoperability


    Achieving interoperability on the IoT, requires a closer look at interactions
    of the key components in IoT ecosystems. Before looking into the specifics of
    technical interoperability, syntactic interoperability, semantic interoperability,
    and organizational interoperability, we analyse here those interactions and we
    identify in Figure 3.2 six generic interoperability patterns for IoT ecosystems.
    This subsection is based on the material published in [10].


    The “Cross Platform Access” pattern (Figure 3.2, I) is the basic characteristic
    of an interoperable IoT ecosystem. The goal of this pattern is to hide that an
    application or service accesses resources (information or functions) from different
    platforms through the same interface specification. The challenge of realizing
    this goal lies in allowing applications or services to discover platforms with
    relevant information, and enabling platforms that are potentially from different
    providers to have the same interface and use the same formats to communicate data.


    The pattern “Cross Application Domain Access” (Figure 3.2, II) extends the “Cross
    Platform Access” pattern. The goal is that services/applications are able to access
    information and functions not only from different platforms, but also from platforms,
    which host information from multiple application domains. Thereby, it is crucial
    that semantic interoperability is given through well-defined and shared information
    models. A cross-domain application that accesses multiple IoT platforms, could
    e.g. air quality information and traffic data to provide green routing through
    a city.


    ![](img/084215b3209e41ed4c28b3829663f1e4_19_0.png)


    I → Cross Platform Access Pattern

    II → Cross Application Domain Access Pattern

    III → Platform Independence Pattern

    IV → Platform-Scale Independence Pattern

    V → Higher-level Service Facades Pattern

    VI → Platform-to-platform


    Figure 3.2. The patterns of interoperability [10].


    The goal of the pattern “Platform Independence” (Figure 3.2, III) is to allow
    a single application or service to be used on top of different IoT platforms (e.g.
    in different regions). For example, these can be multiple deployments of a “smart
    parking” service used in two different geographic regions, which utilize different
    platforms with information about parking spots. This is especially challenging,
    when the sensors producing the IoT data are based on entirely different technology
    (e.g., radar-based parking spot observation, or counting in and outs of a parking
    lot).


    The goal of the “Platform-Scale Independence” pattern (Figure 3.2, IV) is to hide
    different platform scales towards the connecting services and applications. The
    so called server-level platforms are platforms with many devices connected (e.g.
    a cloud platform), whereas device-level platforms grant direct access to attached
    sensors, and fog-level platforms are intermediaries such as edge gateways. A platform
    implementing this pattern has to hide its scale from applications and services
    accessing it.


    Finally, the pattern “Higher-level Service Facades” (Figure 3.2, V) extends the
    interoperability requirements from platforms to higher-level services. Here, services
    are acting similar to platforms and also provide IoT offerings via a common interface.
    Such a service acts as a façade towards an IoT platform and use or process the
    IoT offerings of the platform to provide added value.


    Once the above described patterns are implemented, they ensure ecosystem interoperability
    and allow an easy re-usage of IoT offerings from the various platforms of the
    ecosystem.


    Organizational interoperability can be realized by IoT platform federations formed
    by multiple partnering institutions that collaborate by sharing IoT resources
    in locations originally out of their reach. This represents an additional horizontal
    integration that enables “Open networked” IoT business models according to the
    classification in [11].


    We can define an IoT platform federation as an association of several platforms
    enabling their secure interoperation, collaboration and sharing of resources.
    Platforms can be enabled to perform collaborative sensing/actuation tasks and
    to interact directly so as to trade/share resources. A mechanism for defining
    and monitoring Service Level Agreements (SLAs) should be in place, while we can
    also envision the emergence of roaming *IoT devices*, where a device registered
    and managed by one platform is nomadic and can interact with resources in smart
    spaces managed by another federated platform (in a *visited smart space*). Federated
    platforms should of course control the terms under which a roaming IoT device
    is allowed to use resources in environments operated by visited platforms.


    Platform-to-platform direct interactions enable existing (native) applications
    to use resources managed and operated by other federated platforms as if they
    were offered by a single platform, as shown in Figure 3.2.VI. This reduces the
    burden of interacting with multiple platforms from an application or a service,
    while platforms increase the portfolio of offered resources. For example, if Platform
    2 offers to barter data produced by its static temperature sensors within a federation
    formed by platforms 1 and 2, this means that Platform 1 can use and offer temperature
    readings produced by those sensors as if Platform 1 was managing the devices.


    Platform 1 offers in turn its temperature sensors located in another location
    to Platform 2. Therefore, an application or service can use the sensors from a
    single platform. Note that oneM2M has also identified such interaction between
    two platforms and tags the interface for platform interworking Mcc’ (between two
