    - *Data Processing* components provide additional functionality to handle and
    work with the data generated in the platform.

    - *SmartTags* components facilitate integration, creation and scanning of the
    SmartTags.

    - *Data Access* components provide the corresponding registries, semantic models
    and repositories on which TagItSmart operates.


    At the **Virtual Entity** level, the actual representations of the objects that
    are part of the platform provide access to their data and defined actions based
    on the semantic models.


    Taking the architecture described above as the starting point, here we describe
    how TagItSmart functionality can be implemented in practice:


    **Full Implementation of an IoT Platform with TagItSmart**: this scenario builds
    up from scratch all the components defined in the architecture of TagItSmart the
    functionality is integrated in the same codebase. The infrastructure needed to
    support the platform is provisioned by the implementation provider.


    **_Hosted in a third party IoT platform:_** this scenario integrates TagItSmart
    functionality in an already existing IoT platform. Components implementation might
    need some adaptation to comply with the existing platform, yet they should be
    interoperable by following the correspondent API. Infrastructure needs are set
    up by the third party IoT platform provider.


    **_Shared and hosted externally:_** this scenario considers TagItSmart as a standalone
    set of services that expose an open API and that can be accessed from different
    platforms simultaneously. Deployment and infrastructure needs are handled independently
    from the IoT Platform.


    The components defined in Figure 4.12. are the set of components needed to fulfil
    the requirements extracted from the different use cases, while enabling creation
    and lifecycle management of the SmartTags. Based on the chosen integration strategy,
    mapping of some of the components to real implementations and deployments in a
    specific IoT platform will be different.


    ## Table 4.2. TagItSmart APIs example


    | OPERATION | API | DESCRIPTION |

    |---|---|---|

    | SmartTag activation | POST /product/set-smart-tag-date | This method is used
    to activate the SmartTag to enable its use in the system. |

    | SmartTag scan | POST /product/product-context | This method is used to POST
    the location where the product was scanned and returns all related context for
    the product including reviews and sensor states. |

    | SmartTag recycle | POST /recycl3r/api/v1/recycling_info | This method is used
    to get information about sorting and location for product recycling. |


    As stated above, TagItSmart components define a common set of API methods to guarantee
    interoperability and seamless integration, as well as enabling creation of the
    third-party applications on top of its components (Table 4.1).


