    ThingWorx [4] defines an IoT platform as a suite of components that enable:


    +   - Deployment of applications that monitor, manage, and control connected devices.

    +   - Remote data collection from connected devices.

    +   - Independent and secure connectivity between devices.

    +   - Device/sensor management.

    +   - Integration with third party systems.


    IoT platforms exist independently between the hardware and the application layers
    of the IoT technology stack. The ideal platform will integrate with any connected
    device, blend in with device applications, and enable implementation of IoT features
