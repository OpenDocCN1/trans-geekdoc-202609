    Systems that do not natively support the necessary IoT standards can join by what
    we call Wrappers in bloTope, i.e. software components that expose the services
    that should be published to the IoT level using the appropriate standards (this
    corresponds to pattern V) “Higher-level Service Facades” in Figure 3.2). This
    also signifies ensuring that data and services that are not public remain non-accessible
    to unauthorized parties.


    In bloTope, “IoT standard” signifies a limited set of appropriate standards around
    the “waist” of the standards landscape as illustrated in Figure 4.4. If the IoT
    is expected to become a similar success story as the World Wide Web (WWW), it
    will need a similar foundation with a set of simple, well-defined, generic and
    powerful standards. The WWW started with HTTP and HTML as the initial core standards.
    Over time supplementary functionality has been introduced by other standards that
    augment the capabilities of WWW applications but the fundamental building blocks
    and principles are still the same.


    ![](img/084215b3209e41ed4c28b3829663f1e4_37_0.png)


    Figure 4.3. bloTope Systems of Systems type cross-connected (non-layered) connectivity.


    ![](img/084215b3209e41ed4c28b3829663f1e4_38_0.png)


    Figure 4.4. Illustration of bloTope standards landscape.


    The core IoT standards used in bloTope are shown in bold. The other standards
    are used depending on the domain and requirements of different applications. When
    other standards (or proprietary protocols and formats) than the core IoT standards
    are used, bloTope uses a Wrapper (i.e., a Service Facade) for making them compliant
    with the core IoT standards.


    bloTope takes full advantage of messaging standards developed and officially published
    by The Open Group, notably the Open Messaging Interface (O-MI) and Open Data Format
    (O-DF) standards¹³


    [22] [23]. Those standards emerged out of past EU FP6-FP7 projects, where real-life
    industrial applications required the collection and management of product instance-level
    information for many domains involving heavy and personal vehicles, household
    equipment, etc. Based on the needs of those real-life applications, and as no
    existing standards could be identified that would fulfil those requirements without
    extensive modification or extensions, the partner consortia started the specification
    of new IoT interoperability standards. O-MI mainly provides Technical Interoperability
    in the stack of Figure 2.1 with the necessary functionality needed for implementing
    generic IoT systems that is not provided by protocols such as HTTP. O-MI can be
    used for implementing RESTful IoT information systems, also using other underlying
    protocols than HTTP as illustrated in Figure 4.5.


    O-DF provides a generic content description model for Objects in the IoT that
    can be extended with more specific vocabularies (e.g., using domain-specific ontology
    vocabularies). O-DF currently uses XML as the underlying syntax but it provides
    a minimal, generic set of semantics for annotating IoT (and other) data. O-DF
    could be considered to bridge Level 2 (syntactic interoperability) and Level 3
    (semantic interoperability) in Figure 4.5 because it provides a capability to
    reference external taxonomies, ontologies and vocabularies in a platform-, domain-
    and scale-agnostic way.


    Figure 4.5 illustrates a bloTope ecosystem, where the different IoT standard compliant
    systems (through Wrappers or not) are aware of each other''s existence and the
    different data and services that they provide to each other14. When a new system
    needs to “join” a bloTope compliant ecosystem, e.g. a car that arrives into a
    new city and needs to discover available services, bloTope will provide discovery
    mechanisms for discovering relevant O-MI nodes. Certain nodes will implement the
    bloTope IoTBnB API, which is a marketplace for IoT compliant services.


    ![](img/084215b3209e41ed4c28b3829663f1e4_40_0.png)


    Figure 4.5. bloTope ecosystem illustration.


    Figure 4.6 illustrates how different platforms, systems and services can publish
    the desired data and services using IoT standards. The Open Data Format (O-DF)
    provides means for annotating "any" IoT data or service using existing or new
    vocabularies, such as schema.org, SSN, GML, etc., as shown in Figure 4.4. It is
    even possible to use several different vocabularies within one O-DF structure
    (including proprietary ones) by linked data principles.


    ![](img/084215b3209e41ed4c28b3829663f1e4_41_0.png)


    Figure 4.6. bloTope architecture illustration.


    The bloTope architecture is heavily influenced by a Micro-Services Architecture
    (MSA) thinking, where different "small" standards can be used jointly in the best
    way depending on application requirements. MSA is a generic way of implementing
    pattern V) "Higher-level Service Facades" in Figure 3.2. Support for MSA is a
    fundamental design principle of O-MI and O-DF in the sense that services of "any"
    size can be published and consumed, no matter if it is a simple request for a
    current sensor value or a request for available parking places in proximity of
    a car’s current location.


    Such an MSA approach provides several advantages regarding system flexibility
    and lean software principles because new IoT standards-compliant services can
    be composed from smaller, existing services. It also provides a risk management
    advantages in the current competitive IoT standardization landscape because different
    standard-compliant software components and wrappers can be adapted to support
    new or "winning" standards without impacting the whole system architecture.


    Whilst bloTope should be understood as a highly flexible and dynamic ecosystem
    capable of seamlessly integrating arbitrary proprietary IoT platforms, it nevertheless
    builds upon a number of several core components presented in the top layer of
    Figure 4.6, which provide essential functionality. The basic viewpoint coordinates
    of the architectural framework is presented in Figure 4.7. This figure adopts
    the conventions established, for example, by NIST15 or IoT-A16 with regards to
    the meanings of the cardinal directions North-South-East-West and set interaction
    patterns to human (north / west) and machines (south / east).


