    ![](img/084215b3209e41ed4c28b3829663f1e4_52_0.png)


    Figure 4.11. symbIoTe Compliance Levels


    ## 4.6.3. Interoperability Aspects


    The symbIoTe approach defines four interoperability levels, as depicted in Figure
    4.11. We also refer to them as compliance levels, when considering them from the
    perspective of an IoT platform wanting to become interoperable. In all four levels,
    interoperability is achieved by offering a unified and secure way to advertise,
    find and consume IoT resources, but in each level, a different interoperability
    scenario is enabled offering various degrees of details about the involved resources.


    Level 1 enables interactions between IoT applications and virtualized IoT resources
    (both sensors and actuators), i.e., applications can find and use resources across
    platforms through uniform interfaces. In addition, platforms can integrate symbIoTe
    components for flexible attribute-based access control. Level 2 allows IoT platforms
    to collaborate closely by forming **federations**. Federations can be considered
    as a closed and distributed version of the Core Services, i.e., the platforms
    can advertise and barter resources only to the members of the federation. **Level
    3** enables **dynamic smart spaces**: adoption of new resources at the gateway
    level and direct interactions between symbIoTe-enabled IoT devices (e.g. mobile
    devices and Arduino boards) in collocated smart spaces, even if they are connected
    to various gateways and managed by different IoT platforms. This enables resource
    migration between collocated and in proximity IoT gateways to prevent vendor lock-in.
    **Level 4** offers support for **roaming of IoT devices** which maintain their
    unique identity while on the move, and can always be found via the Core Services,
    regardless of their current location. Level 1 can be directly mapped to *semantic
    and syntactic interoperability*, as defined in the IERC Whitepaper on Interoperability
    [26]. Levels 2, 3 and 4 relate to *organizational interoperability*. symbIoTe
    proposes here an original approach with finer granularity of organizational interoperability
    by placing specific interoperability concepts in either the Cloud or Smart Space.


    ## 4.6.4. Uniqueness and specific features of the approach


    The first unique feature of symbIoTe is its solution for semantic interoperability
    that follows the *Core Information Model with Extensions* approach presented in
    Section 3.1.2. The *Core Information Model* (CIM) is the central information model
    used to describe resources registered to symbIoTe and is shared between all platforms.
    It is designed to be as abstract and minimalistic as possible and at the same
    time as specific as needed to create a minimal mutual understanding. This way,
    the CIM enables limited out-of-the-box interoperability between all platforms.
    To actually register resources with symbIoTe, platforms use *Platform-Specific
    Information Models* (PIMs) that are extensions of the CIM including platform-specific
    terms. As each PIM is an extension of the CIM, basic interoperability is ensured,
    even between platforms using different PIMs. Such flexibility goes beyond the
    state of the art and is expected to lead to a high acceptance by platform owners,
    especially SMEs, as the process of adapting their platform’s information model
    to symbIoTe is significantly simplified while it offers the means to use their
    existing information models.


    Furthermore, symbIoTe develops a strategy to enable a higher-level of interoperability
    between platforms using different PIMs. It is based on a translation between different
    PIMs based on declarative mappings using SPARQL query re-writing and data translation.
    This concept has the potential to create high impact on semantic interoperability
    for IoT solutions since the process of information model standardization is frequently
    lengthy and cumbersome, while it also limits platform’s flexibility.


    The second unique feature relates to the implemented *semantic search engine for
    IoT resources* that is provided by the Core Services that let IoT application
    developers find adequate IoT resources for various cross-platform and cross-domain
    applications. The search engine uses and supports the listed symbIoTe information
    models.


    The third uniqueness relates to direct platform-to-platform interactions within
    *platform federations* for closer collaboration between platforms. Here symbIoTe
    goes a step further to provide novel functionalities for enriching platform interactions:
    resource bartering, trust and SLA management, as well as support for smart device
    roaming across federated platforms.


    The fourth uniqueness relates to the *security perspective*. symbIoTe implements
    a flexible, distributed, and effective mechanism for controlled access to resources,
    both sensors and actuators, in a federation of heterogeneous IoT platforms. The
    conceived methodology grounds its roots in the powerful Attribute-Based Access
    Control mechanism. A specific access policy, defined as a combination of attributes
    (i.e., user’s properties, roles, details) is assigned to each resource, while
    the access to that resource can be granted only to users in possession of a set
    of attributes matching the aforementioned policy.


    The above listed features allow symbIoTe to support all six patterns of interoperability
    presented in Section 3.1.1.


