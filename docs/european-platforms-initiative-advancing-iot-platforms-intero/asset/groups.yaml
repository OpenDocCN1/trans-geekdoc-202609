    that connects edge hardware, access points, and data networks to other parts of
    the value chain (which are generally the end-user applications). IoT platforms
    typically handle ongoing management tasks and data visualization, which allow
    users to automate their environment. You can think of these platforms as the middleman
    between the data collected at the edge and the user-facing SaaS or mobile application".


    IoT platforms are often referred to as middleware solutions, which can collectively
    be referred to as the value chain of IoT, that are the "plumbing" of the IoT.
    Generally, an IoT or M2M solution is a mash-up of functions from multiple vendors,
    which include:


    +   - Sensors or controllers.

    +   - A gateway device to aggregate and transmit data back and forth to the data
