    interoperability in the IoT, interoperability resources must be efficiently and
    effectively managed.

    - Capacity of interoperability measurement in the IoT: to properly manage and
    execute interoperability in the IoT, a method must be reached to quantify and/or
    qualify the interoperability itself.

    - Dynamic interoperability techniques and methodologies for the IoT: to achieve
    enduring interoperability in the complex IoT ecosystem, ‘things’ must be permitted
    to enter and dynamically interoperate without the need for heavy modification.


    The validation aspect is very important in interoperability in general and even
    more so for the IoT. Testing and validating assert that interoperability methods,
    protocols and so on can cope with the specific nature and requirements of the
    IoT. We need to provide efficient and accurate test suites and an associated interoperability
    testing methodology that helps in testing thoroughly both the underlying protocols
    used by interconnected ‘things’, machines and smart objects, and the embedded
    services and applications. In this view, we have to consider that to most of the
    existing testing methods, interconnected ‘resources’ in the IoT are naturally
