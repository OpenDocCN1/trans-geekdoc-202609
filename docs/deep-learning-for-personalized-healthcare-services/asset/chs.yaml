  \ b, c, d\n\n# 使用机器学习和深度学习集成方法进行癌症早期预测\n\nWasiur Rhmann Babasaheb Bhimrao Ambedkar\
  \ 大学，卫星校区，阿姆提，印度）\nBabita Pandey，Babasaheb Bhimrao Ambedkar 大学，阿姆提，印度（Amethi, India）\n\
  \n### 摘要\n\n癌症是全球范围内导致死亡的最常见原因。根据国际癌症研究机构 2018 年发布的报告，全球每五位男性中有一位、每六位女性中有一位一生患癌症。全球每年有每八位男性中的一位、每十一位女性中的一位死于癌症。肺癌和乳腺癌是新增病例最多的两种主要癌症。乳腺癌是女性中仅次于肺癌的常见高致死疾病。癌症患者的生存状况很大程度上取决于对疾病的及时、准确诊断。在文献中，各种机器学习（ML）技术被应用于乳腺癌预测。机器学习技术利用历史数据进行疾病预测。将肿瘤识别为良性或恶性是癌症检测的关键部分，被视为一个分类问题。在本章中使用了基于集成的方法和深度学习（DL）技术进行肺癌和乳腺癌预测。使用了从著名的\
  \ UCI ML 数据库获取的 Wisconsin 和 Coimbra 两个数据集进行实验。集成技术被用于构建具有改进预测能力的有效分类器。通常，使用逻辑回归（LR）、随机森林（RF）、朴素贝叶斯（NB）和支持向量机等机器学习分类器进行预测。不同分类器的组合被用于增强单分类器的性能，这种组合分类器被称为集成。近年来，机器学习的一个子领域深度学习已作为一个极具前景的领域出现，其技术极大提升了模型性能，引起了研究者的关注。深度学习源于神经网络。尽管深度学习技术在不同类型的问题上表现出非常出色的性能，但其计算量巨大。在本章中，集成机器学习技术在\
  \ Coimbra 和肺癌两个数据集上显示出最佳性能，而深度神经网络在 Wisconsin 数据集上显示出最佳结果，集成技术的结果与其非常接近。\n\n**关键词：**\
  \ 机器学习，集成，深度学习，乳腺癌，肺癌，\n\n## 1. 引言\n\n由于癌症具有复发性且死亡率高，任何类型的癌症治疗费用都非常昂贵。人工智能（AI）辅助临床技术对于病理学家和医生在癌症早期诊断中非常有效。与经验方法相比，基于人工智能的诊断技术的准确性高得多[1]。癌症患者的生存很大程度上取决于对疾病的及时准确诊断。将肿瘤识别为良性或恶性是癌症检测的关键部分。不同的研究人员已使用基于机器学习（ML）的模型进行癌症检测。\n\
  \n\n\n\n每年有大量女性患上乳腺癌并去世。肺癌也是导致死亡原因。监督分类技术被广泛应用于乳腺癌和肺癌的检测。`ML` 是不断演变的基于 `AI` 的计算研究领域的一部分，在不同领域具有广泛的应用。随着数据可用性的提高，利用\
  \ `ML` 技术创建预测模型的使用率也随之俱增。不同的 `ML` 算法已在软件安全、网络安全、软件工程、加密货币价格预测和医学诊断等不同领域得到了探索。\n\n\
  `ML` 技术的分类如下：监督技术和无监督技术。监督技术使用带有目标标签的数据集来训练模型，而无监督技术则没有目标标签来训练模型。监督分类技术被广泛用于癌症检测。随着技术的进步，生物和医学科学的研究人员正关注提高疾病检测的准确性。许多癌症预测研究使用了数值型数据集，而文献中的某些研究使用了图像；但获取此类图像有时是一项艰巨的任务，同时，基于图像的预测需要大量的计算。因此，在本研究中仅使用数值型数据集进行癌症预测。\n\
  \n在本章中，探索了用于 `ML` 技术集成和深度学习（`DL`）技术对两种不同类型的癌症进行预测。研究了两种主要的癌症，即乳腺癌和肺癌的早期阶段的预测。集成技术通过结合两种或两种不同类型的\
  \ `ML` 技术以获得更好的结果。集成技术的三大类是装袋（bagging）、提升（boosting）和堆叠（stacking）。它们在提升预测性能方面具有不同的优势。\n\
  \n`DL` 源于 `ML` 并灵感源于人脑；`DL` 模型具有多个神经元作为信息处理单元。`DL` 技术涉及大量的计算，对于较大的数据集，需要图形处理器（`GPU`）。近年来，`DL`\
  \ 技术取得了丰的成果：从图像处理到视频处理，从文本分类到文本摘要等。`DL` 技术通常不需要像 `ML` 技术那样进行人工特征选择。不同的 `DL` 技术，如深度神经网络（`DNN`）[2]、循环神经网络（`RNN`）[3]、长短期记忆（`LSTM`）[4]以及卷积神经网络（`CNN`）[5]分别适用于不同类型的任务。在本章中，`DNN`\
  \ 被用于癌症预测。此外，本章还把基于集成的技术和 `DNNs` 应用癌症预测。\n\n本章分为六部分：第 2 节 包含了应用于各种癌症预测的各种 `ML` 技术，第\
  \ 3 节 讨论了集成技术及其类型，第 4 节 介绍了 `DL` 技术，第 5 节 包含了用于实验目的的不同数据集，而第 6 节 包含了评估不同技术性能的各种指标。最后，结论、结果和讨论在第\
  \ 7 节 中给出，第 8 节 以未来展望结束了本章。\n\n\n\n\n监督学习和无监督学习技术是机器学习（ML）技术的两大大类。监督技术进一步分为分类技术和回归技术，它们基于具有特征和目标变量的训练数据集；而无监督技术在训练模型时不需要目标变量。文献中的大多数预测模型使用了分类技术。机器学习和数据挖掘技术已探索用于癌症药物反应预测，以开发治疗癌症的有效药物\
  \ [6]。随着技术的进步，研究人员开始关注提高疾病检测准确性的技术。文中讨论了一些预测领域的领先研究。Patrício 等人 [7] 提出了一种基于血液分析和人体测量数据的乳腺癌预测模型。他们收集了\
  \ 166 名参与者的数据，发现支持向量机（`SVM`）是性能最好的模型，灵敏度高达 88%，特异性高达 90%。Kourou 等人 [8] 回顾了各种应用于癌症预测的机器学习技术。他们使用了多种输入特征，通过\
  \ `SVMs`、人工神经网络（`ANNs`）、决策树（`DTs`）以及贝叶斯网络（`BNs`）进行癌症预测。Patrício 等人 [7] 使用朴素贝叶斯和\
  \ `KNN`（K-近邻）进行乳腺癌分类。他们在威斯康州乳腺癌数据集上进行了实验。他们发现 `KNN` 的准确率达到 97.51%。Shen 等人 [9] 开发了一种基于乳腺影像筛查的深度学习乳腺癌检测技术。他们使用卷积网络对乳腺影像进行分类。INbreast\
  \ 数据集达到了灵敏度：86.7%，特异性：96.1%。Ray 等人 [10] 讨论了基于机器学习技术的乳腺癌预测模型。他们将在图像和数值数据上应用了随机森林、高斯朴素贝叶斯、决策树和\
  \ `KNN` 分类器进行癌症预测。与基于数值数据的预测模型相比，基于图像的模型具有良好的精确率、召回率和 F 分数。文献中的一些研究使用了图像 [11, 12]\
  \ 进行乳腺癌预测。在当前的研究中，仅使用数值数据集进行乳腺癌预测。集成技术和 `DNNs` 被应用于乳腺癌预测。Lync 等人 (2017) 提出了一种基于机器学习的肺癌预测技术。该方法将目标变量视为连续值并应用基于回归的监督技术来预测生存时间。梯度提升方法的均方根值为\
  \ 15.05。Pradeep 和 Naveen [13] 使用支持向量、朴素算法和 C4.5 算法对肺癌患者的生存率进行了研究。Kadir 和 Gleeson\
  \ [14] 提出了使用 `SVM` 的乳腺癌预测方法。深度学习 `CNN` 技术也用于图像数据集的癌症预测。从现有文献来看，大部分癌症预测研究使用了分类技术来区分良性和恶性。通常使用的分类技术有随机森林、`SVM`、朴素贝叶斯、`ANN`\
  \ 等。一些癌症预测研究基于回归技术来预测肿瘤大小。应用于癌症的机器学习技术如下：\n\n### 2.1 支持向量机 (SVM)\n\n它是用于分类和回归的监督技术\
  \ [15]。在数据集有限时，它显示出良好的速度和性能。它能轻松分类可分离数据，并使用核技巧（kernel trick）处理非线性分离数据。`SVM` 在低特征和高特征数据集上表现良好。\n\
  \n![Figure 1: Support vector machine.](img/b_9783110708127-005_fig_001)\n\n图 1：支持向量机\n\
  \n### 2.2 随机森林\n\n这是一种可用于分类和回归的监督技术。该技术从原始数据集中创建多个决策树 [16]。决策树的最终预测通过投票机制结合，见图 2。\n\
  \n![Figure 2: Random forest.](img/b_9783110708127-005_fig_002)\n\n图 2：随机森林\n\n###\
  \ 2.3 朴素贝叶斯\n\n朴素贝叶斯是一种基于概率的分类器。它假设特征是独立的并使用贝叶斯定理进行分类。\n\n$P(class|feature) = \\\
  frac{P(feature|class) * P(class)}{P(feature)}$\n\n后验概率：$P(class|feature)$\n\n先验概率：$P(class)$\n\
  \n### 2.4 决策树\n\n决策树是一种用于分类和回归问题的非参数监督技术。决策树包含作为内部节点，而叶子节点代表目标标签。它们速度很快，不需要对数据集进行缩放。信息增益决定了使用哪个特征进行划分。乳腺癌数据集的决策树见图\
  \ 3](#9783110708004_008234.xhtml#b_9783110708127-005_ref_003)。\n\n![Figure 3: Decision\
  \ tree(J48) of breast cancer dataset.](img/b_9783110708127-005_fig_003)\n\n图 3：乳腺癌数据集的决策树(J48)\n\
  \n### 2.5 K-近邻\n\n这是一种有助于分类和回归的非参数监督技术。该算法假设相似类型的数据点位置较近。该数据集基于特征的相似性工作，即测试特征与训练数据的匹配程度。通过\
  \ `KNN` 分类见图 4](#9783110708004_008234.xhtml#b_9783110708127-005_fig_004)。\n\n![Figure\
  \ 4: K-nearest neighbors.](img/b_9783110708127-005_fig_004)\n\n图 4：K-近邻\n\n### 2.6\
  \ 逻辑回归\n\n逻辑回归是一种分类技术 [17]，使用自变量的线性方程来预测因变量。因变量的范围从负无穷到正无穷。使用 Sigmoid 函数将其转换为二进制形式。Sigmoid\
  \ 函数如下：\n\n$y = g(x) = \\frac{1}{1 + e^{-x}}$\n\nSigmoid 函数图见图 5](#9783110708004_008234.xhtml#b_9783110708127-005_fig_005)。\n\
  \n![Figure 5: Sigmoid function graph in logistic regression.](img/b_9783110708127-005_fig_005)\n\
  \n\n\n\n图 5：逻辑回归中的 Sigmoid 函数图。\n\n`y` 的值位于 0 和 1 之间，其阈值在分类问题中通常取为 0.5。如果该值高于阈值，则输出为\
  \ 1；否则在二分类中输出为 0。\n\n## 3 机器学习技术的集成\n\n集成技术是两种或两种机器学习（ML）技术的组合 [18]。与单个分类器相比，这些技术通常能提高预测性能。异质集成是不同类型分类器的组合，而同质集成则是将性质相似的分类器结合在一起。下文将进一步讨论基于集成的技术。\n\
  \n### 3.1 Bagging 分类器\n\nBagging 将多个相似类型的 ML 模型结合起来，这些模型是在从原始数据通过自助法（bootstrap）获得的不同数据集上训练的。自助法中的数据项与原始数据集的相似性约占四之三。不同模型的预测结果通过多数投票进行组合。Bagging\
  \ 分类器减少了预测的变异。Bagging 分类器的过程见图 6。\n\n![图 6：AdaBoost 的 Bagging 分类器。](img/b_9783110708127-005_fig_006.png)\n\
  \n图 6：AdaBoost 的 Bagging 分类器。\n\n### 3.2 Stacking\n\n在 stacking 中，多个弱模型与元模型（meta-model）结合以提高预测准确性。这里，元模型是逻辑回归，基模型是随机森林、逻辑回归和朴素贝叶斯。Stacking\
  \ 在提高弱分类器的预测能力非常非常。对于肺癌数据集，使用随机森林作为元学习器，而基学习器为 SMO、朴素贝叶斯和 LogitBoost，如图 7 所示。\n\n\
  ![图 7：Stacking 集成。](img/b9783110708127-005_fig_007.png)\n\n图 7：Stacking 集成。\n\n\
  ### 3.3 投票\n\n在投票中，多个预测模型参与做出最终预测。研究中，SMO、AdaBoost、随机森林、逻辑回归和朴素贝叶斯模型用于乳腺癌数据集的最终预测，而\
  \ SMO、随机森林、LogitBoost 则用于基于肺癌数据集的投票，如图 8 所示。\n\n![图 8：投票集成。](img/b9783110708127-005_fig_008.png)\n\
  \n图 8：投票集成。\n\n## 4 深度神经网络\n\n在最近的文献中，基于深度学习（DL）的模型在图像分类、音频和视频分类等更广泛的应用类别中显示出非常好的准确率。DL\
  \ 已应用于医学领域，如心跳检测（Murat）、健康管理 [19]等。\n\n![图 9：用于癌症的深度神经网络。](img/b9783110708127-005_fig_009.jpg)\n\
  \n图 9：用于癌症的深度神经网络。\n\nDNN 是一种简单的连接神经网络。它包含多个隐藏层。密集层包含连接的神经元，每个神经元都与前一层的神经元连接。在本章中，使用了五个分别具有\
  \ 30、16、8、4 个神经元的密集层，以及一个具有 2 个神经元的输出层。密集层是全连接的。每个神经元计算一个激活函数，前几层的神经元通过加权边与后续层连接。最初，权重随机分配，随后在每次迭代后，更新权重以找到结果。DL\
  \ 技术是计算密集型的，需要大量数据才能获得更好的结果。用于癌症的 DNN 见图 9。\n\n![图 10：神经单元。](img/b9783110708127-005_fig_010.png)\n\
  \n图 10：神经单元。\n\n有一层用于获取输入特征，有一个输出层用于给出结果。这些层包含连接的神经元。每个神经元都作为一个信息处理单元 [20]。在当前的\
  \ DNN 中，密集层被用作隐藏层。\n\n神经网络是一个信息处理单元。示例神经元见图 10。神经元中有一个激活函数用于处理。激活函数 `f` 接收组合输入并给出输出。激活函数通常是非线性函数。非线性函数有助于通过反向传播算法纠正分类错误。通常\
  \ sigmoid 和 ReLU（修正线性单元）被用作激活函数。ReLU 使用以下函数：\n\n```\nf(z) = max(z, 0)\n```\n\n如果输入为正数，ReLU\
  \ 函数的输出为输入的值；否则，其值为 0。\n\n$Sigmoid 函数: f(z) = 1 / (1 + e^{-z})$\n\nsigmoid 函数给出在\
  \ 0 到 1 范围内的取值。\n\n## 5 癌症数据集\n\n在本节中，讨论了用于癌症预测的不同类型数据集。数据集分为以下两类。\n\n### 5.1 数值数据集\n\
  \n在本研究中，使用了用于癌症预测的不同类型数据集。来自 UCI 仓库的乳腺癌、Coimbra 数据和 Wisconsin 数据集 [21]。这些数据集是数值型的。有\
  \ 9 个独立变量。目标是癌症或无癌症。该数据集包含 116 个案例，总共有 10 个属性。\n\nWisconsin 数据集被许多研究人员用于乳腺癌预测，SMO、随机森林、逻辑回归和朴素贝叶斯模型\
  \ [22, 23]。该数据集包含 31 个特征，有 546 条记录。这些记录被分类为良性和恶性。由于第二个数据集包含大量特征，使用信息增益选择了特征。`fractal_dimension_se`、`symmetry_se`、`fractal_dimension_mean`、`texture_se`\
  \ 和 `smoothness_se` 因其信息增益低而被移除。表 1 和 2 显示了 Coimbra 和 Wisconsin 数据集的不同属性。Weka 软件中\
  \ Wisconsin 数据集中每个特征 `f[i]` 的信息增益 [24] 用于特征选择。为了执行分类，所有特征都作为输入，因为减少特征会导致分类性能变差。数据集包含\
  \ 357 个良性和 212 个恶性案例。\n\n肺癌数据集中有 32 个实例和 56 个属性。数据集对三种癌症进行分类。属性具有范围从 0 到 3 的整数变量。使用最频繁的值来填充缺失值。\n\
  \n表 1：Coimbra 数据集属性。\n\n| S. no. | Attribute | Description |\n| --- | --- | ---\
  \ |\n| 1 | Age | Numeric |\n| 2 | BMI | Numeric |\n| 3 | Glucose | Numeric |\n|\
  \ 4 | Insulin | Numeric |\n| 5 | HOMA | Numeric |\n| 6 | Leptin | Numeric |\n| 7\
  \ | Adiponectin | Numeric |\n| 8 | Resistin | Numeric |\n| 9 | MCP.1 | Numeric |\n\
  | 10 | Classification | 二进制 1=健康 2=患者 |\n\n表 2：Wisconsin 数据集属性。\n\n| S. no. | Attribute\
  \ | Description |\n| --- | --- | --- |\n\n\n\n\n\n| 1 || 半径 || 数值（从中心到周缘点距离的平均值）\
  \ |\n| --- | --- | --- |\n| 2 || 纹理 | 数值（灰度值的标准差） |\n| 3 || 周长 | 数值 |\n| 4 || 面积\
  \ | 数值 |\n| 5 || 平滑度 | 数值（半径长度的局部变化） |\n| 6 || 紧凑性 | 数值（定义为周长²/面积 – 1.0） |\n| 7\
  \ || 凹度 | 数值（轮廓凹陷部分的严重程度） |\n| 8 || 凹点 | 数值（轮廓凹陷部分的数量） |\n| 9 || 对称性 | 数值 |\n| 10\
  \ || 分形维度 | 数值（“海岸线近似” – 1） |\n| 11 || 诊断 | (M = 恶性, B = 良性) |\n\n对数据集中的每张图像计算了每个特征的平均值、标准误差和最差值。\n\
  \n由于不同特征的范围不同，对数据集进行了归一化处理。通过归一化，特征范围被缩小到 0 到 1 之间。归一化使用以下方程：\n\n(1)$x = \\frac{x\
  \ - x_{min}}{x_{max} - x_{min}}$\n\n其中 `x[min]` 和 `x[max]` 是被归一化属性的最小值和最大值。\n\n\
  ### 5.2 基于图像的数据集\n\n近年来，基于图像的疾病诊断非常流行。研究人员探索了各种深度学习技术来预测不同的疾病。有一些供研究人员使用的公开数据集，带有适用于实验目的说明。癌症图像数据可以在\
  \ [`www.cancerimagingarchive.net/`](https://www.cancerimagingarchive.net/) 找到。该仓库是由美国癌症研究所癌症治疗与诊断部门创建的。\n\
  \n## 6 用于性能评估的指标\n\n在研究中，阳性病例为恶性，阴性病例为良性。由于当数据集倾斜时，准确率不是分类器性能的良好衡量，因此使用了精确率、召回率和\
  \ `f`-测量值 [25]。\n\n分类结果的混淆矩阵如表 3 所示。\n\n表 3：癌症预测的混淆矩阵。\n\n| || 预测恶性 || 预测良性 |\n\
  | --- | --- | --- |\n| 实际恶性 || 真阳性 (TP) || 真阴性 (TN) |\n| --- | --- | --- |\n| 实际良性\
  \ || 假阳性 (TP) | 假阴性 (TN) | \n\n真阳性 (TP)：定义为预测为恶性且实际为恶性的病例数量。\n\n真阴性 (TN)：定义为预测为良性且实际为良性的病例数量。\n\
  \n假阳性 (FP)：定义为预测为恶性但实际为良性的病例数量。\n\n假阴性 (FN)：定义为预测为良性但实际为恶性的病例数量。\n\n研究中使用的指标讨论如下：\n\
  \n准确率通过正确分类实例的百分比来度量。当数据集不平衡时，它不是一个良好的性能指标，通过以下方程计算：\n\n(2)${Accuracy} = \\frac{{TP}\
  \ + {TN}}{{TP} + {TN} + {FP} + {FN}}$\n\n精确率（Precision）通过正确预测的恶性类别数量与分类器预测为恶性的类别总数之比来计算。计算方式如下：\n\
  \n(3) ${Precision} = \\frac{TP}{TP + FP}$\n\n召回率（Recall）测量为正确预测的恶性病例与总恶性病例的比例。其公式如下：\n\
  \n(4)${Recall} = \\frac{TP}{TP + FN}$\n\nF 值是精确率和召回率的调和平均值，其公式如下：\n\n(5)$F{- measure}\
  \ = \\frac{2 \\times {Precision} \\times {Recall}}{{Precision} + {Recall}}$ 这些指标的范围在\
  \ 0 到 1 之间。\n\n## 7 结果讨论\n\n实验都在数据挖掘和支持机器学习的开源软件 WEKA 中进行。使用 10 折交叉验证对 Coimbra 数据集进行的不同技术结果如表\
