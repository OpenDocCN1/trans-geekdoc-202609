  \ 2019, pp. 185–189.\n\n\n\n\n\n# 使用两种深度学习算法 CNN 和 RNN 对冠心心病进行分析及其敏感性分析\n\nMildred\
  \ J. Nwonye，博茨瓦纳大学，加博隆；Lakshmi Narasimhan，博茨瓦纳大学，加博隆；Zablon A. Mbero，博茨瓦纳大学，加博隆\n\
  \n### 摘要\n\n心脏病是全球第一死因，每年导致约 1790 万人死亡，其中 85%是由心脏病发作和中风引起的，超过 75%的死亡发生在第三世界国家。生活方式、缺乏运动和饮食不健康是人们患心脏病的主要原因，导致他们前往医院或医疗中心接受治疗。高血压、糖尿病、吸烟和过量饮酒等风险因素是导致心脏疾病的原因。分析有助于早期检测并促进冠心心病的诊断。本章描述了一个使用两种深度学习算法——即循环神经网络（`RNN`）和卷积神经网络（`CNN`）通过一系列敏感性分析构建的诊断模型。敏感性分析针对输入层数（`NOIL`）、训练测试比例的扰动以及训练轮数（epochs）进行。所选特征是基于来自\
  \ Kaggle 数据库的冠心病风险因素。该数据集来源于弗拉明翰心脏研究的冠心病，包含 15 个属性和一个目标变量。敏感性分析结果显示，当数据集按 50:50\
  \ 划分时，`RNN`模型预测个人在十年内是否会患病的准确率为 85.98%，而当数据集按 55:45 划分时，`CNN`模型的预测准确率为 85.79%。\n\
  \n关键词：心脏病、冠心心病、`CNN`、`RNN`、`NOIL`、扰动分析、训练轮数，\n\n## 1. 引言\n\n生命取决于心脏的正常功能。任何影响心脏正常功能的异常都被称为心脏病或心血管疾病（`CVD`）。心血管疾病包括风湿性心脏病、脑血管心脏病、冠心心病（`CHD`）、先天性心脏病、外周动脉疾病、肺栓和深静脉血栓，属于心脏和血管疾病。年龄、性别、饮食、血压（`BP`）、酒精摄入、吸烟、肥胖、缺乏活动和家族史等多种因素都会导致个人患心血管疾病。如今，人们为了生计而努力工作，加之忙碌的生活，忽视了健康；此外，在获得文凭或学位后进入职场，他们的生活方式或饮食会发生变化。不同的生活方式导致饮食改变、压力水平和压力增加、血压升高，如果不加注意，就会演变为心脏病。世界卫生组织（`WHO`）在\
  \ 2016 年表示，`CVD`是全球范围内主要的死因，每年导致至少 1790 万人死亡，估计占全球死亡总数的 31%。在美国，心脏病是主要死因，其中`CHD`占死亡人数的七分之一，每年导致超过\
  \ 36 万人死亡。每年约有 79 万人发生心脏病发作，其中 11.4 万人死亡。从 2004 年至 2014 年，`CHD`的年死亡率下降到 35.5%，但风险因素仍然令人担忧。心脏病发作和`CHD`是十种最贵的住院出院诊断中的两种，预计在\
  \ 2013 年至 2030 年间，冠心心病治疗的医疗费用将增长 100%。在博茨瓦纳，非传染性疾病（`NCD`）占死亡人数的 37%，其中`CVD`是首要原因，而`CHD`导致了\
  \ 130 例死亡。人们只有在被迫去医院时才会发现健康问题。但随着技术的发展，如物联网（`IoT`）、人工智能，医生可以使用高效准确的诊断模型做出决策。各种学习方法已取得成功。\n\
  \n在本章中，我们使用卷积神经网络（`CNN`）和循环神经网络（`RNN`）处理风险因素（年龄、收缩压、糖尿病、总胆醇），并改变训练轮数、数据比例和输入层数（`NOIL`）。本章结构如下：第\
  \ 2 节回顾了研究人员的工作，第 3 节介绍了方法论；第 4 节给出了改进`CNN`和`RNN`算法的细节，第 5 节描述了扰动以及敏感性分析；第 6 节讨论了参数扰动对`RNN`和`CNN`的影响，结论总结了本章并为未来工作提供了方向。\n\
  \n## 2. 相关工作\n\n大多数研究人员已使用多种机器学习算法预测心脏病的诊断，包括增加一些特征选择方法以提高算法的准确性。Peter 和 Somasundaram\
  \ 使用了朴素贝叶斯（`NB`）、决策树（`DT`）、K 近邻（`KNN`）和神经网络（`NN`）来检测自变量与因变量之间的关联。基于相关性的特征选择（`CFS`）子集、卡方、一致性子集、增益率、过滤属性、过滤子集、信息增益、潜在语义、单个属性和\
  \ relief 被用于属性或特征选择。他们的结果显示，当应用`CFS`技术比较时，`NB`分类器的准确率最高，达到 85.5%。Hasan 等人使用数据挖掘技术发现隐藏模式，并结合相关特征在没有医学专家支持的情况下预测心脏病，使用了\
  \ UCI 机器学习库的 Cleveland 心脏病数据集。该数据集包含 14 个属性和 303 条记录。采用信息增益特征选择技术来选择高度相关的特征。使用了分类技术如`KNN`、使用迭代二分法\
  \ 3（`ID3`）的`DT`、逻辑回归（`LR`）、高斯`NB`和随机森林（`RF`）。`LR`显示出更好的性能，其在所有 14 个属性上的准确率为 89.5%，在\
  \ 10 个属性上的准确率为 92.76%，优于其他技术。\n\n\n\n\nKohli 和 Arora [12] 提出在识别系统中使用分类算法可以促进慢性疾病的早期检测，并提高患者的生存率。使用的三个数据集是\
  \ UCI 机器学习库中的心脏、乳腺癌和糖尿病数据集 [10]，并使用了 `LR` [13]、`DTs` [14]、`RF` [15]、`SVM` [16] 以及自适应增强提升\
  \ [17] 算法。结果显示，线性回归在心脏病预测方面最好，准确率为 87.1%；`SVM` 在糖尿病预测方面性能最高，准确率为 85.71%；`AdaBoost`\
  \ 分类器在乳腺癌预测中的准确率为 98.57%。Yan 等人 [18] 采用多层感知器 (`MLP`) 架构为五种常见的心脏病创建了诊断支持系统¹。\n\n\
  Zhang 等人 [20] 提出使用基于 1-D `CNN` 多层构建的深度学习分类器，利用从心电图 (`ECG`) 中提取的相关信息。使用了 MIT-BIH\
  \ 心律失常数据库 [21]，并使用 `F1` 分、正性预测值 (`PPV`) 和敏感性进行性能评估，结果值分别为 0.976、0.977 和 0.976。Baccouche\
  \ 等人 [22] 提出了一种不同神经网络的集成学习框架——门控循环单元 (`GRU`)、长短期记忆网络 (`LSTM`)、双向 `GRU` (`BiGRU`)、双向\
  \ `LSTM` (`BiLSTM`)、`MLP` 和 `CNN`——以准确预测各种类型的心脏病。基于模型的选择方法 [22] 结合递归特征消除法 [22] 被用作墨西哥“Medica\
  \ Norte Hospital”的特征选择方法，该数据包含 800 条记录和 141 个特征。使用的性能指标有 `accuracy`（通过混淆矩阵的值计算）、`precision`（精确率）、`recall`（召回率）、曲线下面积\
  \ (`AUC`) 和 `F1` 分数。对于目标 1，`LSTM` 具有最高的精确率值 0.86；`BiGRU` 具有最高召回率；`F1`、`accuracy`\
  \ 和 `AUC` 值分别为 0.87、0.87、0.81 和 0.79。目标 2 的 `BiGRU` 具有最高精确率，`F1` 和 `AUC` 值分别为 0.82、0.81\
  \ 和 0.82；`BiLSTM` 的召回率和准确率为 0.84。对于目标 3，`BiLSTM` 和 `BiGRU` 具有最高的精确率值 0.96，对于 `BiLSTM`，召回率、`F1`、准确率和\
  \ `AUC` 值分别为 0.8、0.87、0.8 和 0.88。最后，目标 4，`MLP` 具有最高精确率 0.96，`BiGRU` 具有最高召回率，`F1`、准确率和\
  \ `AUC` 值分别为 0.87、0.82 和 0.85。Tu 等人 [23] 采用了装袋算法 [23]，与 `DT` 算法进行了比较 [14]。由于装袋算法结合了不同模型的输出，它提升了单一模型的性能。该数据集来自\
  \ UCI 机器学习库 [10]，包含 920 条记录和 76 个属性。使用了敏感性、特异性和准确率作为性能指标。结果显示，装袋算法优于决策树，准确率为 81.4%，非常有效。\n\
  \nYuan 等人 [24] 提出使用“模糊逻辑”和装袋算法，基于梯度提升决策树 (`GBDT`) 预测 [24]。使用的数据集来自 UCI 库 [10]，包含\
  \ 303 条数据和 14 个参数。将装袋算法引入 `fuzzy-GBDT`，并使用准确率、召回率和 `AUC` 等作为性能指标以避免过拟合。`bagging-fuzzy-GBDT`\
  \ 的结果与 `fuzzy-GBDT` 模型、`DT` 模型、`GBDT` 模型以及 `bagging-GBDT` 比较，以验证模型的有效性。结果表明，“模糊逻辑和装袋算法”与\
  \ `GBDT` 结合时可以将 `AUC` 值提高到 0.87。Junwei 等人 [25] 提出使用 `LSTM` 来解决不规则时间间隔问题。使用的数据集收集自医院信息系统\
  \ (`HIS`)，连续、离散和缺失值用平均值最高出现值替换。作者使用 z-score 标准对输入数据进行预处理。在改进的 `LSTM` (`T-LSTM-TR`)\
  \ 和 `LSTM` 上均使用了 `Precision[micro]`、`Recall[micro]`、`F1[micro]` 和 `AUC` 作为性能指标，隐藏层数为\
  \ 120，`α` 为 0.5，丢弃层为 0.4。结果显示 `T-LSTM-TR` 的性能显著高于其他技术，其召回率为 0.811，而 `F1` 为 0.608，`AUC`\
  \ 为 0.896。\n\n\n\nLi 等人 \\[26\\] 提出使用某些机器学习算法，如 `SVM`、`LR`、`ANN`、`KNN`、`NB` 和 `DT`，基于分类算法开发一个高效准确的系统。他们采用了一些特征选择算法，如\
  \ `relief` \\[27\\], 最小冗余最大相关性 (`MRMR`) \\[28\\], 最小绝对收缩选择算 (`LASSO`) \\[29\\] 和基于局部学习的特征选择\
  \ (`LLBFS`) \\[30\\], 以及 “快速条件互信息 (FCMIM) 特征选择 (FS) 算法” \\[31\\]。Cleveland Heart\
  \ 数据集 \\[10\\]包含 303 个实例和 75 个属性，但在移除缺失值后，使用了 297 个实例和 13 个特征。所使用的性能评估指标为准确率、敏感性、特异性、精确率和马修斯相关系数\
  \ (`MCC`)。对于 FCMIM，`SVM` 实现了 92.37% 的最高准确率和 98% 的特异性。`LR` 具有 98% 的最高敏感性，`MCC` 显示为\
  \ 91%，执行时间为 0.01 s。Karaolis 等人 \\[32\\] 开发了一个基于 `DT` 的系统来评估冠心病（CHD）的风险因素，帮助减少患者人数。研究的事件包括“心肌梗死”(MI)、“经皮冠状动脉干预”(PCI)\
  \ 和 “冠状动脉旁路移植术”(CABG)，它们具有不同的风险因素。MI 和 CABG 的风险因素是“年龄”、“吸烟”和“高血压史”。对于 PCI，风险因素是“家族史”(FH)、“高血压史”和“糖尿病史”。所使用的数据收集自\
  \ 2003 年至 2006 年的 1,500 名冠心病患者，并在 2009 年在塞浦路斯 Paphos 总医院心脏病专家 J. Moutiris 的监督下完成。性能通过正确分类率\
  \ (%CC)、“真阳性率” (%TP)、“真阴性率” (%TN)、“假阴性率” (%FN)、“敏感性、“特异性”和“支持率进行衡量。使用了以下划分标准：信息增益\
  \ (IG)、吉尼指数 (GI)、似然比卡方统计量 (X²)、增益率 (GR) 和距离量 (DM)。结果显示，MI、PCI 和 CABG 的 %CC 分别为 66%、75%\
  \ 和 75%。\n\nMu 等人 \\[33\\] 提出使用双向 `RNN` 来记住患者过去和未来的所有访问情况，并包含某些患者属性。该数据集来自海南人民医院，包含诊断\
  \ ID、时间、诊断代码、订单执行时间、停止时间、药物代码和患者个人概况。与其他模型进行了评估，如 `KNN`、`SVM`、`RNN`（基础 `LSTM` 模型）、`RNN[y]`（提出的模型）和\
  \ `RNN[i]`（使用侧面信息作为输入）。实验使用的层数为 2 层，每层有 128 个隐藏单元，丢弃率为 0.4。根据在 100 次迭代的准确率指标上获得的结果，`RNN[y]`\
  \ 表现更好，在 10 次迭代后准确率为 64.75%。`RNN[i]` 可以显著提高模型的性能。侧面信息作为第一个输入单元及随后的变化，从而影响模型的判断。当\
  \ `RNN[i]` 与 `RNN[y]` 比较时，随着序列长度的增加，性能有所提升，这表明 `RNN[i]` 可以提高模型的性能。侧面信息被用作第一个输入单元和随后的变化，从而影响模型的判断。J\
  \ 等人 \\[34\\] 发现侧面信息可以提高模型的性能。使用的 Cleveland Heart 数据集 \\[10\\] 包含 303 个实例和 75 个属性，但在移除缺失值后，使用了\
  \ 297 个实例和 13 个特征。\n\n\n\n\n本章使用的数据集来自 Kaggle 上的 Framingham 数据库 [41]，这是一个由 Google\
  \ 拥有的平台，数据科学家利用其公开数据库发布基于机器学习的预测竞赛。该数据集源于美国马萨诸塞州进行的一项研究，包含 4,238 条记录，具有 16 个属性、15\
  \ 个独立变量和 1 个目标变量。表 1 | bool |\n| 2 | Age | int |\n| 13 | Education | int |\n| 4\
