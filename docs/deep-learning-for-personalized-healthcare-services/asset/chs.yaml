  \n### 摘要\n\n皮肤癌被认为是发病率和死亡率的主要原因，死亡率正在上升。如果能在早期进行治疗，其治愈机会很高。由于皮肤科专家人数有限，因此在早期进行良好的皮肤诊断至关重要。本研究通过深度学习（`DL`）技术对图像进行分类。该方法使用了\
  \ `ResNet-50` 模型，其准确率达到了 86%。关键词：良性、CNN、恶性\n\n## 引言\n\n皮肤癌是指皮肤细胞的不受控制生长，这是由于紫外线损伤皮肤细胞并激活基因突变引起的。最常见的皮肤类型是黑色素瘤、鳞细胞癌和基底细胞癌。在过去的几个世纪里，黑色素瘤和非黑色素瘤的数量在全球范围内增加，特别是在肤色浅的人群中。仅在\
  \ 2020 年就有近 30 万例新病例 1。非黑色素瘤是男性和女性第三常见的癌症，全球病例超过百万例 1。黑色素瘤的诊断依赖于皮肤科医生对对称性、直径和演变进行主观测试\
  \ 2。只有通过病理学程序切除受感染部分，黑色素瘤才有较高的治愈机会。皮肤恶性肿瘤检测的评估限制是缺乏能够快速检测癌症并提高准确率且降低误诊率的可靠技术 3、4。\n\
  \n居住在光照过强地区的人口以及需要在炎热环境下工作且不采取预防措施（如防晒霜、乳霜等）的人患该病的风险更大。特别是儿童时期经常晒太阳增加了皮肤癌的风险。`DL`\
  \ 是机器学习（`ML`）的一种，并解决了 `ML` 无法解决的问题。尽管 `ML` 技术也用于图像数据问题，但我们需要将图像标记为二值值（即 1 和 0），这可能会导致结果的不一致性\
  \ 5、6、7。因此，正在使用 `DL` 技术，因为它为引入图像增强和相似图形及像素的聚类提供了空间。\n\n\n\n\n\n先进的深度学习（DL）正在帮助治疗领域的教授和研究爱好者在医学数据分析中发现未知的机会，并为社区提供解决方案。健康领域中的深度学习为医生提供了任何疾病的准确分析。因此，通过使用分类系统和神经网络技术，我们可以预测特定图像是否可能是皮肤癌病例。机器学习（ML）和深度学习的区别在于它们处理数据的方式。在\
  \ ML 中，数据必须经过标记或结构化，但 DL 可以使用 `ANN`（人工神经网络）层对图像进行分类。通过识别特定图像的特征，DL 可以对其进行分类。然而，在\
  \ ML 的情况下，只有标记数据集有助于我们完成工作。即使在数据大量的情况下，DL 的表现也更好并给出准确的结果。在这项研究工作中，我们试图帮助肿瘤学家和放射学家对癌症和非癌症图像有一个良好的概述，并了解适用于特定皮肤癌恶性类型的适当医疗实践，以便他们传播意识。\n\
  \n本文的工作内容安排如下：第 2 节介绍了文献综述，提供了对类似数据执行的先前先进方法的信息；第 3 节描述了背景研究；第 4 节解释了我们在手稿中采用的方法；第\
  \ 5 节涵盖了此处涉及的结果分析与对比 ``[8, 9, 10]`；第 6 节提供了此处应用的测试台信息；第 7 节涵盖了本质上在本研究中产生障碍的数据泄露策略；第\
  \ 8 节讨论了结论。最后，在第 9 节讨论了整个过程的算法。\n\n## 2 文献综述\n\n本章使用的过程围绕寻找图像内模式的想法展开，这有助于识别相同对象的类别。我们的过程和技术不仅可以用于皮肤癌，还可以用于任何基于多类别的图像分类。在查看感染患者的医学报告时，医生倾向于从物理上观察叶片、异常细胞生长以及可能引起生物体问题也可能不会引起问题的曲线；同样，如果我们渴望通过计算找到结果，我们需要根据图像中出现的各种标记模式对图像进行分割——也称为图像分割（Image\
  \ Segmentation）。图像分割的目的是创建一个共同覆盖整个图像的段集，或者从图像中提取的一组轮廓（这在计算机图形学的边缘检测中也执行）。Antony\
  \ 等人和 Jaleel 等人使用简单的 `ANN` 架构 `[1, 2]` 执行了类似的分析，他们向神经网络输入了基于恶性和良良性的皮肤癌图像。在这里，我们应用了现有的基于\
  \ ML 的超参数调优技术和先进的迁移学习技术来解决这个问题。\n\nChoudhari 等人 `[3]` 也采用了一种基于 `ANN` 的模型，该模型使用了\
  \ `Adam` 优化器和未标记图像；自动成像后的病变检测是 Alcón 等人所研究的 `[4]` 的关键；在当代世界，一种通过早期检测和发现措施帮助皮肤癌预后的全面指南正由\
  \ Rigel 等人进行研究 `[5]`，我们发现这是理解检测基础及其数学建模的综合性内容。这项研究讨论了恶性黑色素瘤的形成、成因和预防。Giotis 等人正在研究一种有助于检测和诊断皮肤癌结的辅助设备\
  \ `[6]`，他们讨论了使用非显微图像簇的这种方法。Kawahara 等人 `[7]` 进行了解释。\n\n研究了一项使用 `CNN` 的深层次研究。Brinker\
  \ 等人 `[11]` 使用 `Adam` 来减少损失。虽然 Hosny 等人正在执行使用 `Alex-Net` 的迁移学习方法 `[12]` 以详细研究，但我们使用了最近的先进模型\
  \ `ResNet-50`（一种 50 层 `CNN`）来相比 `Alex-Net` 架构 `[12]` 提高准确性；\n\n### 2.1 图像预处理\n\n\
  图像预处理随后的图像分割是从失真图像中获得更好结果的基础且关键的步骤。区域内的每个像素都与某些特征或计算属性相似，例如颜色材料、强度或纹理。并发区域存在显著差异，但它们内部遵循相同性。当应用于一堆典型的医学图像时，在使用图像分割后，最终的轮廓线用于图像内部对比，使得具有相似标签的像素可以根据某些特征使用，并根据我们的需求易于构建\
  \ `[1, 2]`。\n\n在处理任何图像之前，我们删除其可能具有任何不需要的伪影。图像预处理任务的目标是改进图像数据或增强图像特征以便进一步处理。相机或卫星捕捉的图像在几何（形状和大小）和像素亮度值存在误差。这些误差使用统计或数学模型进行纠正，例如`尺度不变特征变换\
  \ (SIFT，计算机视觉中用于检测和描述图像局部特征的特征检测算法)` 和 `快速鲁棒特征技术，一种专利的局部特征检测器和描述符，可用于目标识别、图像配准、分类或\
  \ 3D 重建等任务`。\n\n为了检测癌症，预处理是提高分割步骤精度的基础步骤。\n\n\n\n\n在图像分割中，我们将图像划分为若干个称为“段”的部分。图像是不同像素的集合。我们将具有相似属性的像素分在一起。所采用的技术灵感源于\
  \ Rehman 等人 [11]]。在此处，使用广义高斯分布来对癌症进行分类。在这种技术中，所有训练图像都被划分为 `R`、`G` 和 `B` 颜色通道，以单独确定恶性程度\
  \ [11]]。获取了恶性区域的强度。在本章中，使用了训练图像。该模型的主要目标是在前景和背景扩展之和最小的位置处计算阈值。我们的观察发现，[12\\\\] 显示的方法可以用于执行基于直方图的图像阈值化或将灰度图像转换为二值图像。如果直方图保持呈现双峰分布，则\
  \ [12\\\\] 中的方法表现出较好的性能。\n\n### 2.3 图像分类\n\nBrinker 等人执行的方法启发了我们使用 `CNN` 对皮肤病变分类进行系统性研究，如\
  \ [13, 14\\\\]；我们还使用了来自标准相机的 399 张图像进行分类。分类在使用 `cosine distance metrics` 通过 `k-nearest\
  \ classifier` [15\\\\]] 完成的，但该任务非常耗时，且只要技术得到改进，就可以获得更广阔的视角。\n\nBhavya Sai V 等人 [16\\\
  \\]] 为皮肤分类设计了一个深度卷积神经网络（`DCNN`）系统 [17, 18\\\\]]。我们具有不同变体的方法被证明更为合适。在 `ML-based optimization\
  \ tasks` 中，分类问题是非常主观的 [19]]。这种现象涉及划分训练和测试数据；在此之前，数据应易于区分为两类或多于两类 [20\\], 21\\\\\
  ]]。\n\n### 2.4 随机梯度下降优化器\n\n`SGD` 代表 `随机 gradient descent`，其中随机意味着随机。梯度基本上意味着表面的斜率。`SGD`\
  \ 是一种迭代工作的方法，有助于通过某些属性最小化目标函数。沿梯度计算损失，并使用某些学习率更新模型。当均值为零且方差为单位时，我们倾向于使用默认的 `learning\
  \ rate`。通常表示为浮点值的 `sparse array` 数据是理想的数据集，我们可以使用 `SGD`。我们可以通过某些参数或损失参数来控制模型。通常，`SGD`\
  \ 与 `SVM`（支持向量机）匹配 [23\\], 24\\\\]]。我们可以通过向损失函数添加惩罚项 `regularizer` 来缩小模型向零。`SGD`\
  \ 的主要优势是效率高且易于实现。它对 `iterations` 等超参数敏感。\n\n## 3 背景\n\n以下流程图描述了我们的方法：\n\n### 3.1\
  \ 数据收集\n\n研究中的方法论涉及使用 `CNN` 分析 [1]]。数据收集显示了来自 `Kaggle` 的恶性和良性图像分布。\n\n```\n（图 1：良性和恶性）\n\
  ```\n\n```\n（图 2：图像分布）\n```\n\n## 4 方法论\n\n### 4.1 使用 SGD 分类器进行癌症分类\n\n使用 `CNN`\
  \ 分析进行分类。在此分析中，使用了如图 3 所示的 `Keras` 模块和 `TensorFlow` 后端。\n\n```\n（图 3：基于 SGD 方法流程图）\n\
  ```\n\n\n\n\n* `lr`: 浮点型 ≥0。学习率（梯度下降算法中的 `alpha`，此处为 0.9）\n* `momentum`: 浮点型 ≥0。在相关方向上加速\
  \ `SGD` 并抑制震荡的参数。（此处为 0.02）\n* `decay`: 浮点型 ≥0。每次更新期间的学习率衰减。\n* `nesterov`: 布尔值。为了应用\
  \ Nesterov 动量 [17]，用于给定的二分类问题。\n\n此外，这里使用了 `Keras.callback.ModelCheckpoint` API\
  \ 来指定从训练数据的 `loss` 或 `accuracy` 中选择哪一个要控制的指标，通过增加或减少该指标来提高分数。此处使用 `ModelCheckpoint`\
  \ 功能是为了保存网络权重，并避免每次运行模型时都频繁训练。这是一种在对给定数据集进行分析的同时，仅保存改进分数的设置。\n\n```python\nfrom\
  \ keras.callbacks import ModelCheckpoint\n```\n用于应用检查点的 Python 代码。\n\n简单来说，Dropout（丢弃）是从训练中移除随机神经元的过程。这意味着它们在决定激活的作用被降低，并在执行正向传播时被丢弃，因此在执行反向传播过程中不会对它们进行权重更新。在给定的模型中，使用了\
