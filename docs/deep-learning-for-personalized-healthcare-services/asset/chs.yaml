  \ NOIL 为 1000 次 epoch 敏感性参数的 RNN 算法比例扰动图。\n\n表 8：以 NOIL 为数据比例敏感性参数执行 RNN 算法次数与准确率结果。\n\
  \n| Epoch | `NOIL` = `2` | `NOIL` = `4` | `NOIL` = `6` | `NOIL` = `8` |\n| --- |\
  \ --- | --- | --- | --- |\n| 200 | 85.46 | 84.43 | 85.09 | 84.76 |\n| 500 | 84.43\
  \ | 85.04 | 85.23 | 84.73 |\n| 700 | 84.52 | 84.95 | 84.66 | 84.76 |\n| 1,000 |\
  \ 84.29 | 84.78 | 84.38 | 85.98 |\n| 1,500 | 84.19 | 84.76 | 84.76 | 84.51 |\n\n\
  ![图 7：以 NOIL 为 50:50 比例敏感性参数的 RNN 算法次数与准确率扰动图](img/b_9783110708127-010_fig_007)\n\
  图 7：以 NOIL 为 50:50 比例敏感性参数的 RNN 算法次数与准确率扰动图。\n\n表 8 所示的结果是通过改变训练次数在目标变量上执行 RNN 算法获得的。该表记录了当\
  \ `NOIL` 从 `8`、`6` 和 `4` 变为 `2` 时的准确率。随着数据划分比例的改变，记录的准确率值波动，如图 7 所示。在 700 次 epoch\
  \ 时记录的最低准确率为 83.95%，而在 1,000 次 epoch 时记录的最高准确率为 85.98%。随着每个 epoch 中 `NOIL` 数的增加，NOIL\
  \ 的准确率发生波动。\n\n### 6 性能评估对比\n\n对于 RNN 算法，观察到当 `NOIL` 为 8 时，比例和训练次数具有相同的准确率。对于 CNN，当\
  \ `NOIL` = `4` 时，比例和训练次数具有 85.79% 的相同准确率，如表 9 所示。\n\n表 9：CNN 和 RNN 模型的性能对比。\n\n\
  | 模型 | 准确率 |\n| --- | --- |\n\n\n\n\n\n| 比例 | 准确率 | NOIL | 周期数 (epoch) | 准确率 | NOIL\
  \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| CNN | 55:45 | 85.79 | 4 | 1,000\
  \ | 85.79 | 4 |\n| RNN | 50:50 | 85.98 | 8 | 1,000 | 85.98 | 8 |\n\n## 7 结论\n\n\
  本章讨论了三个参数——NOIL、周期数、数据比例的扰动对用于心脏病建模的 `CNN` 和 `RNN` 算法的影响，并对它们分别进行了敏感性分析。`RNN` 的结果显示，当\
  \ `NOIL` 为 8 时，比例和周期数上均达到了最高的扰动效果，准确率为 85.98%。`CNN` 算法在 `NOIL` 为 4 时，对于两种扰动下均表现出最高结果，准确率为\
  \ 85.79%。因此，`RNN` 的表现优于 `CNN`，因为它具有 85.98% 的最高准确率。本研究采用的技术可以用于开发辅助医生诊断的医疗决策支持系统。未来，我们打算探索其他扰动和敏感性参数，例如隐藏层数量、隐藏层神经元数量、激活函数、偏置以及\
  \ `RNN`、`CNN` 和 `MLP` 的权重。从医院收集真实数据并结合算法来帮助临床患者，无论从分析角度还是底层伦理角度来看，都是一项极有趣的挑战。\n\n\
