  \n### 4.2 循环神经网络 (RNN)\n\nRNN 使用其内部记忆和循环连接来估计当前输出 [46]。由于单元按顺序连接，梯度可能会消失或爆炸。LSTM\
  \ 用于解决梯度消失问题 [22]。LSTM 的构建块包含输入、输出和遗忘门，如图图 3 所示。\n\n\n\n\n\n在扰动分析中，我们想要找出 `x` 值的变化如何影响\
  \ `y`，而在敏感性分析中，我们想要找到特定变量 `x` 值如何影响 `y` 值。扰动分析是针对数据比例以及训练次数（epochs）与准确率进行的，并将不同的\
  \ `NOIL` 值作为敏感性参数。使用的比例有：`80:20`、`75:25`、`70:30`、`65:35`、`60:40`、`55:45` 和 `50:50`，训练次数设置为以下值：`200`、`500`、`700`、`1,000`\
  \ 和 `1,500`。\n\n### 5.1 CNN 算法扰动结果\n\n表 5 所示的结果是通过在目标变量上执行 CNN 算法获得的，通过改变 1000 次\
