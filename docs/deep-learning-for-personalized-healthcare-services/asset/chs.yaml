  \ pp. 1–6, doi: 10.1109/ICSCAN.2019.8878765. →\n\n# 深度学习在现代医学中的技术性能概述\n\nAna Carolina\
  \ Borges 电气与计算学院 (FEEC) – 坎皮纳州立大学 (UNICAMP)，巴西坎皮纳斯。Reinaldo Padilha França 电气与计算学院\
  \ (FEEC) – 坎皮纳州立大学 (UNICAMP)，巴西坎皮纳斯。Rangel Arthur 技术学院 (FT) – 坎皮纳州立大学 (UNICAMP)，巴西莱梅拉。Yuzo\
  \ Iano 电气与计算学院 (FEEC) – 坎皮纳州立大学 (UNICAMP)，巴西坎皮纳斯。\n\n### 摘要\n人工智能是一种利用多层数据和信息的技术，涵盖算法、机器以及深度学习模型、模式匹配，甚至认知计算，学习数字化的吸收数据，通过机器学习（ML）获取诊断、医疗治疗变异以及患者结果的见解。机器学习编程模型在实施之前会在数据集上进行训练，具有创建自身规则或问题的属性。随着训练这些模型（算法）的实验次数增加，它们会自动并逐渐提高其效率、准确性和精度。深度学习（DL）复制生物神经元的基本结构，使用复杂的算法，实现了预测性数字健康，并能够在不需要人类监督的情况下建立逻辑且复杂的结构。换句话说，这是一种研究、理解和学习解释与研究对象相关信息的数字架构，有助于更准确地识别肿瘤，例如，考虑到通过此类技术进行此类识别时，不需要成为该领域的专家。同样，更相关的诊断建议也是此类技术的应用示例，它们可以广泛应用于各个健康领域。强调的是，深度学习在健康领域的应用将为医生和患者提供更准确、更快速诊断、更果断的治疗、更好的风险计算，以及在几秒钟检测感染、异常和疾病的可能性，这对于减少人为误差是非常受认可的。因此，本文旨在提供深度学习的更新概述，涉及其核心概念及其在医学领域，以及其与具有意义的智能属性框架之间的关系，使当前现代医疗场景下实现成本效益型个性化数字服务成为目标。\n\
  \n关键词：医疗保健、数字图像、人工智能、深度学习、图像处理、医疗信息学、健康、认知医疗。\n\n## 1. 引言\n人工智能（AI）技术允许机器为人类做“很多事”，因为在人工智能的“标签”下有“机器学习（ML）”，而在该技术中，有一项被称为“深度学习（DL）”的技术。用于多个行业领域（如自动驾驶汽车的计算机视觉、图像识别、自然语言处理等应用）的技术基于试图“模拟”人脑的神经网络概念\
  \ [1]。\n\n深度学习是机器学习的一个分支，允许计算机像人类一样思考和学习。在这种意义上，可以把“机器”放在医生的位置，做出比医生自己更准确的疾病诊断。这是有优势的，因为可以减少偶尔的医疗错误，且不需要第二意见\
  \ [2, 3]。\n\n机器学习是一个计算科学领域，它从人工智能的数字模式识别研究和计算学习理论得到了更新、先进和发展，探索了具有学习属性的学习模型和算法的结构与结构，甚至对数据进行预测/推理\
  \ [4]。\n\n机器学习是人工智能的一个子领域，负责人类历史上最大的革命之一，因为机器被教导以越来越简单的方式以及通过越来越准确的系统和工具来做出决策和预测。机器学习已成功应用于多个领域。在医学中，它允许以个性化的方式和在短时间内对特定疾病和治疗进行预测，反映出目前机器学习在医学领域的主要优势之一是诊断领域，在检查和结果可用性方面提供了更大、更快速的分析准确性\
  \ [5]。\n\n在此背景下，广义地说，机器学习过程允许机器算法学习，而不是手动编程。在医学中，这项技术被用于分析肺部图像，通过识别这些医学图像上的数百个新特征，帮助更好地诊断和估算癌症的预后\
  \ [6]。\n\n深度学习使用由人脑功能甚至结构所建议的算法，称为人工神经网络（ANN），这将允许计算机像人类一样思考和学习。数字图像识别推测是深度学习技术速度之快的最佳示例之一，因为其算法中图像识别的错误率优于人类任务\
  \ [7]。\n\n除了放射学等医学学科外，它还代表了深度学习技术测试兴起的“被选潜力”，即医学中其他可以使用该技术进行骨折或癌症检测的医学领域。据规定，未来的健康将成为一项软件业务\
  \ [8]。\n\n糖尿病视网膜病等疾病可以在深度学习的帮助下以比人类更高的准确率进行诊断，深度学习分析眼底图像，并以更精确的引导至最合适的治疗，包括药物供应和医生分配。因此，医学在效率和效果方面从深度学习的使用中获益良浅，涉及疾病预防、新药研究以及减少基于结果而非原因的诊断。然而，这里的秘密在于基于认知计算的算法的持续改进和完善\
  \ [9]。\n\n未来，人类将不会具体告诉计算机做什么，而是提供他们希望计算机实现的示例，并期望由于在与深度学习相关的新技术浪潮中为了成功的努力，计算机将自己发现如何这样做\
  \ [10]。\n\n\n\n\n因此，显而易见，深度学习（DL）技术最有前景的领域之一是医学。该技术的应用涵盖了从数字诊断、图像识别到从电子病历中检索非结构化信息。深度学习的应用包括图像处理与识别、模式的分类与标记、数字放射学分析、培养分析、临床用药依从性分析、服装配饰的尺寸与适用性评估，以及自动化质量保障等其他功能和可能性\
  \ [11]。\n\n更快的诊断、更果断的治疗以及更精准的风险计算，使深度学习成为医生和患者的强大盟友。关于新发现和新应用的新闻不断发布表明，已经在多个相关领域进行了研究，包括眼科、心脏病学、病理学和放射学。目前，该技术已经过训练，可以分析图像、识别问题点，并告知专业人员需要更多关注的区域\
  \ [3, 12]。\n\n除了灵活性外，深度学习在健康领域的应用因其能减少人为错误范围并尝试纠正某些并发症而广受认可；它已卓越地履行了这一角色。此外，列出源自预测建模的技术预期，能够识别具有潜力转化为药物以对抗生物过程的分子，甚至对患者的筛选也更加精确和详细（甚至包含了遗传信息），而且实验室检查的随访是实时完成的，结果获取，避免了不必要的延迟或投入等等\
  \ [13]。\n\n因此，本手稿旨在提供深度学习的更新概述，涉及其在医学领域的核心概念——从疾病和肿瘤的诊断到专门为个人创建的个性化药物，以及其与具有意义智能属性框架的关系，使具有成本效益的个性化数字服务成为当前现代医疗保健的主要目标，并附有简要的文献背景，综合了智能技术的潜力。\n\
  \n## 2 智能医疗技术\n\n### 2.1 AI 概念\n\nAI 是一种根据大脑神经网络标准化的技术，它利用多层信息，涵盖算法、机器以及深度学习模型、模式匹配，甚至是认知计算，学习数字化地吸收数据，获取诊断见解，甚至了解医疗治疗的可变性，以及在机器学习（ML）支持下检查患者检查结果\
  \ [1, 14]。\n\nAI 代表了一组软件、逻辑、计算，旨在让计算机、机器和设备执行人类功能，考虑到高效的 AI 解决方案可以“思考”得更快、识别面部表情，甚至理解书面或口语语言的含义，并处理比任何人类大脑更多的信息。然而在\
  \ AI 中，不可避免地需要足够的计算力来支持机器的推理任务。无论应用哪个 AI 领域或 ML 技术，都将通过结合设计用于创建具有人类相同能力的机器的算法来实现，并在数据自动化方面也是如此\
  \ [14]。\n\nAI 在医学领域的使用是指这些工具可以发现原始数据中显著的相似性和联系，解决人类专业人员难以、耗时或效率低下的复杂问题。它还包括治疗决策、药物决策、患者护理，作为医疗人员的宝贵资源，允许他们为医疗生态系统增加价值\
  \ [15]。\n\nAI 在医学中的优势在于该技术具有从海量数据中提取显著信息的潜力。通过这种方式，可以通过发现非结构化文献中的知识来揭示治疗见解。AI 工具支持用户需求，并使医生在完整的健康澄清方面做出更知情的决策\
  \ [16]。\n\n这些工具具有搜索非结构化和结构化医学处方的属性和特征。通过查看这些数据集中的相似模式，可以协助研究人员创建动态研究和临床试验 [17]。\n\
  \n面向 AI 的系统旨在处理从现代医疗中生成的复杂信息和数据。复杂的 ML 使用 `ANN` 来学习极其复杂的相似性和联系，甚至提供了执行某些任务时超过人类技能的数字支持\
  \ [15, 17]。\n\nAI 在医学中的重要性在于它提供了相关性，考虑到技术使医疗机构能够快速解释海量数据，考虑文本数据和图像，这些被用于检测医学图像中的异常（如\
  \ `CT` 图像、`MRI` 或 `CT`），并以个性化的方式识别患者的相关信息。虽然 AI 算法不会疲劳或情绪波动（与人类相比），但以高速度和精度处理海量数据是昂贵的\
  \ [18]。\n\n因此，通过 AI 可以读取用于追踪肺癌患者的计算机断层扫描检查，无论是由于检测延迟、诊断错误，还是患者接受了导致并发症的不必要（侵入性）程序；通过\
  \ AI，可以避免这种情况的发生。即使考虑到对患者皮肤上的简单斑点进行活检是否是引起担忧的原因，在这种语境下应用 AI，其准确性更高，与皮肤科专家的诊断相比，更具优势\
  \ [19, 20]。\n\n\n\n\n值得强调的是人工智能在医学中的一个知名应用，即通过各种设备和应用程序对患者健康状况和患者特征的变化进行监测。考虑到智能手表、手环和其他智能可穿设备可以追踪血压、血糖飙升、心率等指标，这些设备生成的数据由人工智能处理，通过复制并产生有用的信息，供医生评估患者健康问题\
  \ [21]。\n\n人工智能在医学中的数据存储和处理是该工具的主要用途之一，考虑到其在存储、处理数据甚至执行特定分析（如检查结果或检查结果）方面的速度。同样，所有文件都可以数字化，考虑到这些数据的敏感性，这有助于文件的组织、数字化保护以及文件的访问\
  \ [22]。\n\n人工智能对医学的益处通常已通过深度学习（DL）等技术得到越来越多的应用，因为它允许从非结构化数据中提取洞察。考虑到其应用于疾病治疗所产生的主要收益：通过识别和关联症状对患者临床状况发出警报，以及诊断结果的精确性，即规模化采用基于人工智能的技术将使更多患者获得更高水平的医疗服务。在由于许多地区缺乏专门医疗服务的发展中国家，这种带有智能工具的技术将允许这些地区和这种情况下的患者获得极高精度的诊断\
  \ [23]。\n\n## 2.2 机器学习概念\n\n`ML` 在具有特定属性和特征的计算机上利用 `algorithms`，通过对不同数据的组合，根据预期结果获得学习。也就是说，机器收集信息、在网络上接收或搜索信息、检查这些数据（这些数据可以是数字图像\
  \ `sequences`、`cipher` 及其派生），以及任何可以计算的信息，这项技术能够识别并比人类更快地得出结果 [5, 6, 23]。\n\n`ML`\
  \ 采用的数字结构与传统编程不同，这体现在待检查、解释的数据，以及从中预期的结果（`results`）上，考虑到在处理结束时，`ML`-导向的系统具有创建自己的规则或问题的属性。在传统方法中，通过开发一套规则和逻辑序列，从处理中生成响应（`outcome`）。此外，考虑到\
  \ `ML` 模型在实施之前会在数据集上进行训练，它还会根据这些模型（`algorithms`）用于训练的实验次数，自动且逐渐地提高它们的效率、准确性和精度 [5,\
  \ 6, 23]。\n\n关于训练，这是一个迭代过程，会导致元素与数据之间关联类的改进，并体现在大量的 `dataset` 中，同时也考虑到这可以单独与数据进行随时间推移准确性更高的的学习；由于这些海量数据，如果没有\
  \ `ML` 的支持，人类执行的连接和模式可能是无效的 [24, 25, 26]。\n\n在强化学习中，`algorithm` 通常通过试错策略在数据中发现模式和相关性（非显性的洞察），识别哪些动作产生了最佳奖励，它基本上是一种行为学习模型。这种学习是有引导的，因为这些系统不是通过样本\
  \ `dataset` 训练的。相反，它通过试错策略学习，即在过程中强化正确的决策序列。可以在面向机器人、游戏甚至导航的解决方案中体现这种类型的学习 [24,\
  \ 25, 26]。\n\n监督式 `ML` 由标记的示例组成，通常带有一个固定的 `dataset` 以及对数据如何分类的理解，即一组输入以及匹配的输出。这种类型的学习旨在海量数据中寻找相似性和模式，体现了一种能够区分数百万图片的\
  \ `ML`-导向解决方案。对于这些数据，`ML algorithm` 通过比较当前输出与正确输出（`supervised learning`）来学习以发现错误\
  \ [24, 25, 26]。\n\n无监督机器学习被应用于没有标签的数据；当问题需要大量未标记数据时就会使用它，即在这种情况下，机器学习解决方案不知道“正确答案”。可以在具有大量未标记数据的社交媒体应用中体现这种类型的学习，因为它通过\
  \ `ML` 基于发现的类或模式进行分类来理解与该数据相关的含义。合法邮件和垃圾邮件中也存在多个变量，基于类和成员身份的 `ML classifiers` 被用于识别和分类恶意邮件。这种类型的学习导致一个无需人工干预的迭代过程，其目标是通过发现数据中的某些结构来探索数据，在交易数据中表现良好\
  \ [27]。\n\n`ML` 通过帮助更好地理解用户行为、偏好或用户满意度的细微变化，甚至是 `datasets` 中的隐藏模式和异常，为海量数据提供了潜在价值，并从中从海量数据中识别并提取模式，以这种方式构建学习模型，同时仍将这些\
  \ `algorithms` 和 `models` 之一视为结果预测（`insights`）的因素。因此，可以将这种智能技术定义为一种研究领域，允许计算机、机器和设备具备无需一定经过编程的数字学习能力，也就是说，它是基于过去的经验在未来更好地执行任务的方法\
  \ [5, 27]。\n\n\n\n\n\n从这个意义上说，考虑到社会最多样化领域中可用数据量的增长和多样性，考虑到计算处理变得更加廉价且强大，加之数据存储易于获取，可以快速产生智能模型，允许分析更复杂的数据，并提供更快、更准确的结果。这产生了高价值的洞察，能够在无需人工干预的情况下实现智能行动，并做出实时的更好的决策，即更高的准确性以及更合格、更果断的投资\
  \ [28, 29]。\n\n机器学习（ML）在健康领域的提议源于其基础知识和应用在临床环境中显著且高效，考虑到这为护理和数字医疗诊断带来了精确性，预测患者的预后并衡量主要的治疗行为，从而最大限度地减少人为医疗错误的概率。同样考虑到机器学习的潜力基于数字数据的汇编和用户输入的数据（这有助于决策制定），与通过设备生成的数据一样，可以提供比孤立分析更准确的结论，为医疗专业人员在为患者决策时提供更多安全，并将患者的临床数据与从政府健康网站获得的流行病学参考进行交叉检查，并对临床事件形成多种假设，例如在\
  \ COVID-19 流行病期间看到的 [29, 30]。\n\n机器学习可以通过一种工具应用，具有通过分析数字图像和对糖尿病患者数据进行推断以预测他们患糖尿病视网膜病变的可能，这种疾病可能导致失明并严重影响生活质量。医学的其他领域如心脏病学、病理学和放射学也在研究应用机器学习技术，以识别所获取图像解释中的缺陷\
  \ [31]。\n\n同样考虑到技术资源在健康领域的全面投入，例如数字系统的集成和临床问题的统计研究，机器学习工具为患者护理专业人员提供了差异化学习，减少了诊断错误和行为的概率，甚至促进了健康链中所有参与人员之间更快的沟通\
  \ [32, 33, 34]。\n\n通过这样，通过这种数字化集成，还可以通过更有效的通信资源将地理位置上遥远的人联系起来，预测长期的临床结果，并利用可用技术资源的优势对治疗，并对临床事件形成多种假设，例如在\
  \ COVID-19 疫情期间所示 [35, 36, 37]。\n\n### 2.3 深度学习概念\n\n深度学习（DL）作为一种技术，复制了人类的基本结构，在不需要人工监督的情况下，通过神经网络这种复杂的架构来研究、理解和学习相关信息，帮助医疗专业人士在不是该领域专家的情况下更准确地识别肿瘤\
  \ [38]。\n\n深度学习使用复杂的算法模仿大脑，提供先进的建议，这种类型已广泛应用于健康 [39, 39]。\n\n深度学习是一种包含人工神经网络（ANN）连续层结构的特定方法，特别适用于尝试学习非结构化数据、处理定义模糊的问题，通常用于图像识别。\n\
  \n此外，深度学习具有根据其使用的语境进行“学习”的属性，通过神经网络执行语音识别和语言处理。它已主要应用于健康行业，由随时产生的多种数据驱动，从而能够破解自然语言并关联术语，产生意义。考虑到深度学习使用的算法不需要预处理即可自动生成属性（由于这些层是非线性数据），它允许对数据进行复杂的抽象表示并形成有序分类\
  \ [40]。\n\n深度学习的高性能能够快速识别数据中的问题和模式，优化决策和报告，并减少重复和手动操作的需求。通过这种方式，员工的效率大大提高；深度学习的自学能力带来了更精确的结果和处理处理，产生了巨大的竞争优势，这是至关重要的\
  \ [41]。\n\n深度学习的多功能性是一个巨大的吸引力，包含了各种目的的适用应用，例如在企业环境、健康、教育和电子商务等行业。简而言之，凭借计算能力，机器可以识别数字图像中的物体并实时翻译语音，使得人工智能适用于任何行业的日常工作和业务\
  \ [39, 41]。\n\n\n\n\n\n基于深度学习（DL）原理训练的数字模型，可以识别从人脸识别中的面部特征，到医学数字影像检查中指示癌症和肿瘤等疾病的特征；这种处理是基于神经网络的“层”进行的，算法在这些层中以自然语言构建构建表征，例如，图像像素形成了第一层，每一层的输出成为下一层的输入。从这个意义上说，构建许多层这样的神经网络是深度学习算法的基本原理\
  \ [42]。\n\n神经网络是一种加权连接主义范式，也就是说，开发智能模型的能力在于大量人工神经元之间的连接（而不是神经元本身），考虑到在深度网络中算术运算会随深度增加呈指数级增长。然而，人工神经网络（ANN）与面向深度学习的神经网络的区别在于，后者人工神经元和连接的数量要多得多。简单的神经网络最多有五层，相比之下，深度神经网络具有五层以上；基于训练这些深度网络所需的足够处理能力，并取决于所使用的神经网络架构，它产生了对并行处理技术以及对\
  \ GPU（图形处理单元）的需求 [43]。\n\n深度学习可以应用于最各种领域，但最常见的是与数字图像处理和自然语言处理（NLP）有关，其中医学领域的应用旨在识别与乳腺癌、阿尔茨海默病、心血管疾病、皮肤癌甚至中风相关的医学图像。它还包含有助于基因组药物开发的应用，因为其应用非常广泛，且其结果和成就在此变革\
  \ AI 影响现代世界决策方面前景广阔 [44]。\n\n## CNN 与架构\n\n卷积神经网络（CNN）能够在高复杂性任务中获得卓越性能，使自动驾驶汽车、视频分类解决方案等成为可能。此外，CNN\
  \ 并不限于视觉数字感知（面向计算机的视觉数字图像）；它在旨在识别 NLP 的任务中同样有效，因为这类深度学习网络最重要的构建构建模块是卷积层，在卷积层中，数字神经元并非连接到输入图像的每个像素，而是只连接到感受区域内的像素。这些人工神经元以三维方式组织——高度、宽度和深度；注意，深度与激活体积的第三维度有关，而不是整个神经网络的深度（深度是指特定神经网络所属的总层数）\
  \ [45]。\n\n正如顺序卷积层中的每个人工神经元只连接到第一层中的特定人工神经元，CNN 关注第一个隐藏层中的低级资源，然后在随后的隐藏层中顺序将其汇聚为高级别的资源。这种分级结构在真实的数字图像中是常见的，因为\
  \ CNN 在图像识别方面表现非常好。因此，一个简单的 CNN 由一系列层组成，每层通过可微函数将一个激活体积转换为另一个，使用了创建的几类层，例如卷积层、展平层（flatten）、丢弃层（dropout）、池化层（pool\
  \ layer）和全连接层 [43, 45]。\n\n## 深度学习的临床应用\n\n因此，深度学习模型旨在深入一个或多个临床事件，并总结特定患者相关的既往医疗事件（患者健康问题、患者状况、检测结果、药物和患者治疗等方面）\
  \ [44, 45]。\n\n### 技术在医学中的性能\n\n通过 AI，更客观的评估成为可能。AI 和深度学习技术都将无法单一地满足医疗保健的需求 [46]。通过从可穿戴传感器收集的数据，某些判断是正确的\
  \ [47]。\n\n在产科中，同样通过使用传感器，AI 可以监测母婴的生命体征，确保提供必要的护理。在放射学中，通过认知计算机可以在数秒内扫描数千张图像。或者在肿瘤学中，AI\
  \ 将通过基因测序和生物标志物研究实现个性化医疗；肿瘤可以在早期进行诊断而无需手术程序，从而在化疗剂量上获得更高的精确度，减少副作用 [48, 49, 50,\
  \ 51]。\n\n在皮肤科中，通过皮肤图像和 AI，检测皮肤癌的算法有助于对人群进行更广泛、更快速的评估，从而无痛且低成本地诊断和治疗疾病。至于传染病，可以通过机器学习分析产生的新抗生素来对抗，例如\
  \ Halicin 用于对抗多药耐性细菌感染。在手术案例中，医生可以通过在操作中替代外科生的机械支持来实现更高水平的精确度和效率 [48, 49, 50, 51]。\n\
  \n\n\n\n关于老年学和 `AI` 的出现，平均预期寿命的增加是自然的，这可能是因为改善了生活质量，可能是因为对慢性疾病的描述更加详细，可能是因为发现了延长生命的药物，或者是因为预防了残疾性疾病。在重监护方面，`AI`\
  \ 通过 `ML` 进行聚合处理，理解患者在 `ICU` 中每毫秒生成的生理、病理和实验室数据，从而能够预测可能需要患者进入重监护室的疾病，或以更精细、更完整的方式对其进行治疗。\n\
  \n在算法发展方面，医学影像检查可以获得更高的准确性，例如 `MRI` 检查和肿瘤病变的自动分割，这些技术能够识别、制图并界定病变，有助于医学报告的准确性。即使是分析磁共振成像并指示是否存在前列腺癌及其恶性程度的算法，通过将共振信号解释为头骨（脑）的信号，并分离出异常部分，优先考虑神经放射科医生的分析。\n\
  \n考虑个性化护理和患者护理，这使用了日益增加的数据，使得医生无法实时分析所有内容。结合 `AI` 的大数据技术允许获取更完整的历史记录，旨在建立发现趋势、历史的数据库，甚至支持疾病和风险因素的追踪与监测，支持大规模的预防行动，这应该有助于医生更好地了解每个人，并选择最适合其特征的程序、药物和建议。\n\
  \n在通过远程医疗传输的检查中，可以使用 `ML` 进行筛选并在分析中将患者的紧急情况置首位，这是通过与其他检查进行数字对比，或者通过视觉识别过滤出具有关键诊断可能性的检查；在分析检查数据和图像时，`AI`\
  \ 会利用可用信息进行自我学习，并能够在更关键的检查中区分紧急情况，帮助医生。\n\n通过为具有 `ML` 技术的 `AI` 解决方案提供的文本图像分析工具（能够分析数据并检测检查中的异常），也可以立即告知检查质量是否受损以及是否需要重新做。这在本质上是有用的，因为医生不会在提供相关信息的检查上浪费时间，并避免召回患者重复检查。\n\
  \n通过 `ML` 工具，可以通过 `chatbot` 就指导、转诊和诊断进行沟通；每天运行的认知 `AI` 系统可以在线预约医疗预约，这包括与医生进行远程咨询、向患者发送处方。\n\
  \n健康领域的 `ML` 工具可以担任医疗机构急救的助手，使患者筛选更加准确和详细，包括实验室检查的随访，并快速获得结果，避免不必要的延迟；通过预测模型，它们可以识别出需要最高优先级的患者，优化无限数量的流程，从而提高等待治疗人员的护理质量。\n\
  \n## 4 讨论\n\n从历史角度来看，更准确地说在过去的几个世纪里，有无数人死于疾病，而这些疾病今天已通过抗生素和疫苗得到了控制和治愈；当时的世界更容易发生战争，所有的暴力行为都是手术需求的起点。即使在几十年前，视频腹内镜手术也几乎是超现实的，通过这种资源切除胆囊被认为是不可思议的。\n\
  \n这种背景仅说明了医学科学随着时间的推移呈指数级进化，更准确地说，近年来，这种发展得到了比较、分析和证据方面的科技支持，带来了许多有利于该技术数字化进展的资源。技术革命不应被视为医学的去人性化；相反，它带来了产生新的数字技术工具，这些工具增加了目前面临的医学问题的安全性和解决率，并配备了如\
  \ `ML` 和 `DL` 等智能技术。\n\n有必要在进化的背景下理解 `AI`，考虑到类似于人类智能的算法和模型。考虑到人工神经系统和学习过程的复杂性以及可用信息的海量，它提供了图像的数字识别。\n\
  \n这些 `DL` 技术和 `AI` 技术已应用于现代医院。在医学领域的诊断中，它们比人类评估更准确；这些机构通常配备了医疗设备，用于收集和共享大量数据，并在数字信息系统中使用\
  \ `AI` 进行临床分析。这涵盖了从使用 `DL` 进行数据快速分析以进行医疗干预的紧急病例（以便在几分钟内采取医疗措施，避免潜在的后遗症甚至患者死亡），到识别多种医学并发症（如心血管风险、乳腺病变、脊柱问题，以及数字图像中的无数其他示例），并在疾病预测中发挥作用。\n\
  \n\n\n在临床实践中，临床决策过程的效率一直是人们追求和研究的；然而，直到目前，AI 集成到临床工作流往往会显著增加临床人类医疗团队面临的认知负担，导致更大的压力、更低的效率以及更差的临床患者护理。同样，通过对\
  \ AI 领域数字图像诊断能力的研究，也显示出非常有前景的前景，例如视网膜病变图像；甚至在患者皮肤斑块图像中，在黑色素瘤诊断的敏感区域，通过对数十万张皮肤病变照片的分析，AI\
  \ 诊断恶性病变具有准确性。AI 在肿瘤学领域乳腺影像数字处理中的应用，使得 AI 在乳腺癌筛查中具有极高的准确性；甚至是肺断层扫描图像、血液图像，或使用 AI\
  \ 对脑肿瘤进行分类（考虑到观察者间的变异），在影响不同中枢神经系统（CNS）区域的数百种肿瘤的病理学诊断中，这代表了这种独特的 AI 诊断方法所实现的强大影响。\n\
  \n对优质医疗保健的需求呈指数级增长，实验室测试的数量也是如此，DL 技术已成功地增加了服务需求并提升了这些检查的质量和安全性。由于 `GPU` 中高速计算的可用性、`CNN`\
  \ 的集成以及不断扩大数据集上数字学习的优化，该技术在统计基准任务中的已显著提高，达到了一个拐点，实验室医学中病理诊断的显著增加已经通过数字化和自动化（例如基于数字图像学习的图像卷积和神经网络）。临床实验室中的数字图像在数量上不如其他诊断专科（例如放射学）那样丰富和常见，这可能会限制基于数字图像的技术在实验室医学中的应用。\n\
  \n同样值得提到，在日常实践的前沿，AI 是一项令人满意的工具，因为还没有什么技术能让智能技术超越预测阶段进入行动阶段。在这方面，在医患关系以及医生、护士和其他健康专业人员之间的社交礼中，医疗专业人员必须寻求一种伙伴关系，即机器以明显更高的精度进行预测，而由人类来解释和决定行动；AI\
  \ 目前仍然是一种技术工具，将护理的判断留给人类专业人员。\n\nAI 并不完全是一个算法，甚至不是一组指令代码行，而更多是一种数学公式的形式，影响算法的数字动态使其发生变化，即从以往经验中学习、发展并得出结论（提取海量信息中隐藏的见解），而无需预先对其进行编程，甚至根据数据分析做出决策和预测，因此被称为\
  \ `ML` 或 `DL`。\n\n## 5 大趋势\n\n`GANs`（生成对抗网络）是 `DL` 的算法工具，已应用于医学中，通过生成新的真实图像来帮助癌症的检测和识别。两个神经网络，一个作为生成器的深度神经网络，另一个被称为判别器的深度神经网络，相互识别生成器的操作。这些深度神经网络（`DNN`）之间相互竞争（对抗性特征），试图相互超越对方。生成器网络试图欺骗判别器；同时，判别器试图区分真实数据和由生成器制造的非真实数据。通过这种反馈和竞争，两个\
  \ `DNNs` 都改进了它们的运行情况；`GANs` 模仿了反事实推理和人类创造力 [56, 57]。\n\n医学医学，`GANs` 专注于医学数字图像的分割或合成，在以创造性方式发现疾病诊断中的缺失信息时表现出令人深刻的性能。基于\
  \ `GAN` 的方法可以提供稳健的分类，就像 `GANs` 在蛋白质折叠和药物发现应用中的应用一样，甚至在牙科中 [56, 57]。同样值得提到，在日常实践的前沿，AI\
  \ 是一项令人满意的工具，考虑到还没有什么技术能让智能技术超越预测阶段进入行动阶段。在这方面，在医患关系以及医生、护士和其他健康专业人员之间的社交礼中，医疗专业人员必须寻求一种伙伴关系，即机器以明显更高的精度进行预测，而由人类来解释和决定行动；AI\
  \ 目前仍然是一种技术工具，将护理的判断留给人类专业人员。\n\nAI 并不完全是一个算法，甚至不是一组指令代码行，而更多是一种数学公式的形式，影响算法的数字动态使其发生变化，即从以往经验中学习、发展并得出结论（提取海量信息中隐藏的见解），而无需预先对其进行编程，甚至根据数据分析做出决策和预测，因此被称为\
  \ `ML` 或 `DL`。\n\n`GANs`（生成对抗网络）是 `DL` 的算法工具，已应用于医学中，通过生成新的真实图像来帮助癌症的检测和识别。两个神经网络，一个作为生成器的深度神经网络，另一个被称为判别器的深度神经网络，相互识别生成器的操作。这些深度神经网络（`DNN`）之间相互竞争（对抗性特征），试图相互超越对方。生成器网络试图欺骗判别器；同时，判别器试图区分真实数据和由生成器制造的数据。通过这种反馈和竞争，两个\
  \ `DNNs` 都改进了它们的运行情况；`GANs` 模仿了反事实推理和人类创造力 [56, 57]。\n\n医学医学，`GANs` 专注于医学数字图像的分割或合成，在以创造性方式发现疾病诊断中的缺失信息时表现出令人深刻的性能。基于\
  \ `GAN` 的方法可以提供稳健的分类，就像 `GANs` 在蛋白质折叠和药物发现应用中的应用一样，甚至在牙科中 [56, 57]。\n\n\n\n数字图像解释模型将为医生和患者提供更准确的诊断，提供更高的安全性；在显微镜下的切片分析等应用中将支持医疗专业人士继续从事这项工作，使他们使用具有扩展智能的机器作为手术刀的延伸。由于它能提供更快的诊断、更果断的治疗方案、更精确的风险计算，以及在几秒内检测感染、异常和疾病的可能性，除了敏捷之外，`DL`\
  \ 在健康领域的应用也因能减少人为误差而受到广泛认可。\n\n医学实践涉及将描述患者的数据（诊断和预后）转换为知识，以帮助医生和专家，指导很大一部分临床决策，但这种转化会产生不一致且不完整的知识，且技能、培训和经验在人之间存在差异。因此，这导致医疗保健、临床决策、治疗甚至结果产生巨大差异。医生可以评估的数据量是庞大的；这些数据的数量、多样性以及获取速度不断增加，且通常处于时间受限的环境中，并受限于目前人类数据管理的局限性，这些都是健康强化医疗实践面临的挑战。\n\
  \n因此，诸如 `DL` 等智能学习技术和工具对于从这些海量数据中发现模式和提取信息非常有用。通常，会将当前患者的数据与该患者之前时刻的数据进行对比分析，通过经验分类为可识别的模式，如诊断甚至综合征。诊断取决于对与症状、实验室检查以及疾病自然病史相关的复杂且独特体征的辨，，并构成了预后以及潜在治疗的基础。\n\
  \n因此，可以评估认为，临床行为的不一致最终不仅会导致次优的临床决策或失败，从而导致对长期发病率产生更大影响（考虑到未能预防被忽视的疾病），甚至不仅增加了目前各国疾病的成本负担，对患者健康和整个医疗系统的成本影响也可能更高。因此，在健康领域拥有如此信息的\
  \ `AI` 时代，使用和应用 `DL` 技术对于验证基于数据、证据和价值的更一致的临床决策至关重要。\n\n## References\n\n[1] Joshi,\
