  \n### 1.3 swaha 在雅祭（Yajna）中的含义\n\n`swaha` 这个词由两个部分组成：\n\n`Svatva Hanana – iti svāhā`。它包含两个根源；\n\
  \n`sva` = `self`（自我），`ha` = `否定或抹除`。\n\n意思是：“我在此奉献我自己（自我牺牲），以造众生的利益和贡献！”它用于向火中投掷祭品。\n\
  \n### 1.4 咒语（Mantras）及其在雅祭中的地位\n\n作者团队选择这一主题是为了探索什么是咒语、它在雅祭期间如何在人类的生理、心理和精微层面上发挥作用，以及它如何帮助个体达到宇宙层面的合一。在这里，作者澄清了一个段落——我们都知道，每句咒语都代表一位神或女神的能量，而且根据神话，每位神灵都有植物起源。\n\
  \n例如，拉克希米密语“Shreem”是姜黄相关的。当伴随 Shreem samphut 诵读奎雅梯（Gayatri）时，尊敬的 Pt. Sriram Sharma\
  \ Acharya 要求我们在按摩用的油中使用姜黄，并在食物中使用姜黄。在他关于奎雅梯科学的伟大文章《奎雅梯大科学》（Gayatri MahaVigyan）中，他还要求我们想象穿着黄色衣服的奎雅梯。当你拥有水果、油、种子、叶子或根部时，咒语可以融入血液；如果你吟诵这些咒语，神性就开始在人的意识中生存，并实现咒语成就（mantra\
  \ siddhi）。\n\n`Nadi Shastra`（脉络科学）是为那些由于生活忙碌无法进行苦修（如大型祭法）的人准备的。这给了我们（作者）一个灵感，去寻找奎雅梯咒语的植物起源。他们寻找并找到了一种植物，喜马拉雅智慧树，也称为\
  \ `Jyotishmati`、`Vanhiruchi`、`Katumbhi` 等。在英语中，它被称为杖树（staff tree）。DSVV-Haridwar\
  \ 的 Vandana Shrivastava 博士已为自闭症和智力障碍患者开开了 `Jyotishmati` 油。阿育吠陀医生也可能对此提供帮助。\n\n在下图中，可以看到\
  \ Yagyopathy 的志愿者正在向普通人解释雅祭、咒语和呼吸法（pranayam）的科学，并让他们意识到其科学方面。\n\n![图 1：一位 Gayatri\
  \ Pariwar 志愿者以简单的方式向普通大众解释雅祭和咒语的科学方面。](img/b_9783110708127-002_fig_001.jpg)\n\n\
  图 1：一位 Gayatri Pariwar 志愿者以简单的方式向普通大众解释雅祭和咒语的科学方面。\n\n### 1.5 酸雨与雅祭的影响\n\n我们今天收到的雨水在性质上呈强酸性。硫化合物充满了每一滴降落在地球上的雨水。这种酸雨每年都在剥夺地球的收成和大型森林。我们正在遭受酸雨，是因为大量的工业和交通污染进入大气层并被云层吸收。这导致了雨水具有酸性本质。为了回答这个问题：人们为环境选择酸，还是药物？智者会说，选择权在于你！\n\
  \n### 1.6 通过雅祭的神圣甘露：对降雨的影响\n\n神圣的甘露通过雅祭降下。任何油性物质加入水中后，绝不会进入水中；相反，它会以未溶解的形式散在表面。同样，雅祭中发出的烟雾作为油性物质像保护层一样覆盖在云层，就像人类涂抹油性或油腻乳液作为隔热层，以防止冷空气的侵入。\n\
