  \n# 人类能量的视觉化：吠陀概念\n\nRohit Rastogi ABES 工程学院, Ghaziabad, 印度\nMamta Saxena 印度政府统计局,\
  \ 德里, 印度\nDevendra Kr. Chaturvedi 电气系, DEI, 阿格拉\nMayank Gupta 塔服务, 日本\nAkshit Rajan\
  \ Rastogi ABES 工程学院, Ghaziabad, 印度\nVrinda Kohli ABES 工程学院, Ghaziabad, 印度\nPradeep\
  \ Kumar ABES 工程学院, Ghaziabad, 印度\nMohit Jain ABES 工程学院, Ghaziabad, 印度\n\n### 摘要\n\
  \n人体（包括大脑）运行在一个非常不同的框架上，该框架包括钾、钠和钙等元素的带电离子。这就是信号在大脑与其他身体部位之间传输的方式。\n\n消费主义和物质文化有许多负面影响，但也将世界公民聚集在一起的益处。这有助于当地个体创建全球化的身份。有效来说，为了应对全球化带来的道德和身份挑战，需要一种全球意识。它体现了两种特质，即人与人的联系以及人类之间的差异，以及年轻人为了目标采取适当诚实行动的意愿。\n\
  \n关键词：克尔基安摄影、人类生物电、新冠肺炎、满意度与和平、设备辐射，\n\n\n\n\n通过理解人体电流流的理论、其产生模式、传输方式以及在什么条件下传输，我们可以绘制人类大脑图谱。生物电震荡往往出现在所有人身上。它们在认知活动中起着重要作用。由\
  \ SARS-Cov’19 引起的大流行是由大气中的杂质造成的。科学的吠陀“雅祭”（yajna）科学是这一问题的唯一治疗方法。及时的消毒可以从根源上消除这个问题。这是地球上唯一能够纠正整个环境的有效机制。这就是为什么我们需要让它在全球范围内被接受并普及。吠陀文献中也强调了这一点\
  \ [1]]。\n\n通过理解人体电流流的假设、它是如何产生的、如何传输以及在什么条件下传输，我们可能勾勒出人类的思维。通常情况下，生物电运动发生在所有人身上。它们在智力活动中起着关键作用。神经运动有助于向环境因素编码和发送信息。这是一种极其有效的方法。这种奇迹发生在每一个生命元素中，处于不同的层次\
  \ [2]]。\n\n### 1.2 菲尔兰摄影 (Kirlian photography)\n\n菲尔兰摄影由塞米昂·大卫多维奇·克尔里安（Semyon Davidovitch\
  \ Krilian）于 1939 年发现。它用于揭示被拍摄物体辐射出的可见“光环”或能量。塞米昂和他的妻子相信，这种摄影可以检测其他难以发现的植物疾病。在 1970\
  \ 年至 1980 年间，这种摄影被频繁用于观察叶片和指尖。它是在高频电场中，将高压电通过连接到摄影板的物体，导致物体周围形成彩色光环的过程。通过利用不同汗液成分的结果，可以检测一个人的生理和心理健康状况\
  \ [3]]。\n\n活组织的克尔兰摄影使用 Bio-well GDV 相机完成；这是一种使用特定相机和编程框架来量化人体活力场的非侵入性方法。它使用气体释放表示和电光成像（EPI），这在领先的人体活力检查中极其高效。它记录了器官的实用状态和炽热状态，并提供快照估计；非常重要的是理解所获取的属性不是稳定的；这里估计的生命力考虑了受试者的情感和心理状态，而这些状态可能会发生。此外，这项研究有助于定量地分析真实的心理和情感状态、不安，以及引入特定类型的辐射、治疗和药物对人体的影响\
  \ [4]]。\n\n### 1.3 能量测量\n\n活组织的克尔兰摄影使用 Bio-well GDV 相机完成；这是一种使用特定相机和编程框架来量化人体活力场的非侵入性方法。它使用气体释放表示和电光成像（EPI），这在领先的人体活力检查中极其高效。它记录了器官的实用状态和炽热状态，并提供快照估计；非常重要的是理解所获取的属性不是稳定的；这里估计的生命力考虑了受试者的情感和心理状态，而这些状态可能会发生变化。此外，这项研究有助于定量地分析真实的心理和情感状态、不安，以及引入特定类型的辐射、治疗和药物对人体的影响\
  \ [4]]。\n\n### 1.4 生物电\n\n生物电是指人体内部产生的电流。这些电流是人体内发生的多种生物过程的结果；这种电流通过神经纤维发送冲冲信号来执行不同的功能。\n\
  \n\n\n\n生物电是指人体内部产生的电流；这些电流是人体内发生的各种自然过程的结果；这种电流被用于沿着神经纤维输送动力信号，以执行各种与组织和器官相关的功能；它还控制着消化。这种能量的传递在生理活动和患病期间起着至关重要的作用。神经根据这些由生物电流产生的信号发送数据并管理人体的运作。这种信号或驱动是由自然组织直接产生的，并通过能量而非任何形式的液体传导给大脑。研究表明，生物电如何通过吸引巨噬细胞和中性粒细胞到达受损部位来帮助身体的修复/康复\
  \ [9]。\n\n### 1.5 Pranik Urja（生命能量）\n\nPranik 源于“prana”，意为生命，Urja 意为能量，Pranik Urja\
  \ 意味着生命能量。Pranik Urja 的三个主要来源是太阳、风和地，分别对应太阳普拉纳（solar prana）、空气普拉纳（air prana）和地普拉纳（ground\
  \ prana）。\n\n**太阳普拉纳**来源于太阳。它促进人体内能量的流动。可以通过接受约 5–10 分钟的浴或饮用放置在阳光下的水来获取。\n\n**空气普拉纳**来自空气中的能量。在呼吸时，我们的肺部吸收空气普拉纳；通过练习呼吸法（Pranayama）可以吸收更多的空气普拉纳。\n\
  \n**地普拉纳**从地面能量中获得。这种能量通过我们的脚底捕捉。通过赤脚在地上行走，我们的身体会吸收大量的地普拉纳 [10]。\n\n### 1.6 人体与七个脉轮\n\
  \n人体内有七个脉轮，负责不同的特征。这七个脉轮的颜色和作用如下：\n\n*   **根脉轮 – 红色：** 该脉轮的作用是接地，即将所有能量与大地连接。\n\
  *   **生殖脉轮 – 橙色：** 提供享受劳动成果之动力的能量，包括沉浸在快乐和愉的活动中。\n*   **太阳穴脉轮 – 黄色：** 信心与智慧。\n*\
  \   **心脉轮 – 绿色：** 这个脉轮包含了自爱和对他人的爱。\n*   **喉脉轮 – 蓝色：** 说话的能量来自这个脉轮。\n*   **第三眼脉轮\
  \ – 靛色：** 这种脉轮被认为是开启物质世界和五感之外信息的通道。\n*   **顶脉轮 – 紫色：** 纯净的意识能量。平衡它可以被视为实现纯净意识的精神之旅的终点\
  \ [11]。\n\n### 1.7 人光环\n\n人体光环由七层组成。这些能量层具有特定的属性。光环就像能量的光晕；它与身体的脉轮协同工作并影响人体的健康；它可以被视为精神能量的精髓。\n\
  \n人的感受和理解赋予了光环颜色，并描绘了他们在情感和生理上的感受。思想也会为光环增色。这是人在心理过程中释放的能量。光环颜色指的是个人所携带的能量振动。人体光环包含七层，分别是：\n\
  \n1.  原型层\n2.  精神层\n3.  心理层\n4.  情感层\n5.  想象层\n6.  以太层\n7.  物理层 [12]\n\n人体光环是人体辐射的能量。所有生物都有特殊的能量场，通常被称为生物场。它不仅限于我们的头部，而是延伸到身体的所有部位。人体光环辐射出精神、身体和心理层面的能量。这种光环由各种颜色频率的混合表示，每种颜色都有其特定的功能和特征。根据科学研究，光环是我们身体周围产生的电磁场。光环的振动可以通过精密的仪器检测到，因为它们非常敏感。据说，不健康的人光环会枯竭。如果我们希望身体能正常吸收氧气，我们就希望肺部正常工作。同样，如果我们希望身体吸收健康的普拉纳能量，我们就必须保持光环的强大。所有生物的光环都会表现出变化。服用毒品或药物的人的光环也会发生显著变化。今天，我们拥有数字光环扫描系统（DAS），据说它可以检测人体光环并检查任何不平衡\
  \ [13]。\n\n光环就像能量的光晕；它与身体的脉轮协同工作并影响人体的健康；它可以被视为精神能量的精髓。人的感受和理解赋予了光环颜色，并描绘了他们在情感和生理上的感受。思想也会为光环增色。这是人在心理过程中释放的能量。光环颜色指的是个人所携带的能量振动。\n\
  \n### 1.8 阴阳\n\n阴阳是一种二元论结构，代表光明与黑暗、负面与正面、寒冷与温暖；它描绘了两个完全相反的特征如何共存，而且相互补充、相互依赖并相互产生；它是中国宇宙学的一部分。阴被描述为黑色，阳被描述为白色。阴被描述为女性化的活力，细腻、超离、节奏缓慢且安静。阳被描绘为男性的，强有力、强大且核心。\n\
  \n阴阳能量是两个相反元素如何在同一时间同一地存在的真实例子。阴是夜晚的安静与静止，阳是太阳的能量。阴阳是构成整体的二元性。它由 `Taijitu`（太极图）表示。可见男女、昼夜等等，一方开始另一个必须结束。\n\
  \n### 1.9 量子意识\n\n\n\n\n量子意识是指意识需要量子过程的一种说法。它被称为量子心灵。然而，根据神经生物学的观点，这种观点是冲突的，因为神经生物学基于大脑功能是纯经典的理论。\n\
  \n人类大脑通过相关量子过程执行的功能来运作，但到目前为止，还没有关于此点的证实证据。量子效应表明思维过程是一个有效的点，除非科学家对于量子效应如何真正导致意识提供任何经证实的实践证据\
  \ [17]。\n\n量子意识本质上是一组假设，认为经典力学无法解释意识；根据此，我们大脑产生特定想法的概率等同于电子自旋的概率。关于该主题的工作大多是实验性的。已经进行了许多实验，得出结论：与心理状态动力学相关的量子意识模型在感知和认知模糊特征期间遵循量子力学，且量子波函数存在于大脑中\
  \ [18]。\n\n当人类思考时，脑海中会产生很多想法。我们的意识是我们的内心生活。它是我们感受的方式以及我们感受的原因。研究表明意识源于量子振动。因此，它源于大脑中复杂的神经计算。有意识的心是一个觉醒的心。然而，意识的概念是复杂的\
  \ [19]。\n\n量子感知本质上是推测的集合，认为旧式力学无法澄清认知；根据此，我们心灵产生特定想法的概率等于电子转动的概率。关于该主题的工作大部分是探索性的。许多调查得出结论：在观察和辨别不确定亮点期间，与心理状态元素识别的量子认知模型遵循量子力学，且量子波函数存在于脑海中\
  \ [20]。\n\n## 1.10 冥想科学及其对身体的影响\n\n（注：由于原文后续部分存在大量重复，此处翻译已提取核心逻辑内容。）\n\n\n\n\n从科学角度来说，`jap`\
  \ 是另一种冥想形式，由重复的念咒组成。念咒可以以任何方式念诵——可以轻声到让练习者自己听见，也可以在心中默念。`jap` 应在冥想坐姿下进行。这种姿势有助于长时间保持高度的力和专注力。冥想的一些巨大益处包括：对单一对象的关注和集中会导致能量的产生；根据宗教说法，如果加入了神灵，效果会增强；每个人都应该定期进行冥想，以净化心灵，使其从日常琐事中抽离并充满平静；它能为大脑注入能量，帮助处理更多的心理负荷而不会产生压力\
  \ [25, 26]。\n\n### 1.12 咒语科学及其对人体的影响\n\n`mantra` 是一个梵语词，意味着为了帮助反思中的专注而反复运用的单词或声音。`mantra`\
  \ 在诵读或静静念诵时，是印度超凡先驱们已知数千年的神奇治疗工具，而科学正在证明其价值和巨大作用。在其中一项研究中，科学家使用功能脑制图仪证实了在进行冥想时念诵`mantra`\
  \ 的医学益处；例如，它能够帮助释放内心基础的杂音并平息感官系统。另一项研究还发现，与伪造的（tamas 性的）`mantra` 相比，念诵真实的梵语`mantra`\
  \ 在降低抑郁和紧张水平方面具有更好的效果。杜克大学的一项针对人类的研究发现，为期 4 周的每天咒语冥思练习显著减轻了压力、焦虑和心理痛苦的表现，同时提振了心态\
  \ [27]。\n\n### 1.13 yajna（火祭）科学及其对人体的影响\n\n`yagya` 是一个过程，通过火的热能和节奏性诵读`mantras` 提供的声能在火中进行草药祭。`yagya`\
  \ 显著减少了各种电子设备（如笔记本电脑、手机和平板电脑）发射的电磁辐射。由能量或活力产生的 `Yagyagni` 似乎是一种宗教行为，但其力量和效果是非凡的，这通过科学家过去二十年来大量且成功的实验得到了证明。此外，已有多例慢性病患者获得缓解的案例。在急性糖尿病患者中，发现\
  \ `yagya` 后尿糖糖水平完全消失 [28]。\n\n### 1.14 用于健康信息的人工智能\n\n随着技术的飞速发展以及人工智能的发展，甚至神经网络正成为一种新技术。此外，随着对大数据存储的需求以及计算技术的改进，对良好的预测性文本\
  \ [29] 的需求有所增加。\n\n### 1.15 健康传感器数据管理\n\n技术的快速增长及其进步创造了许多机会。这导致了根据需要可以手动或自动监控并收集信息的引入。与过去不同，现代人可以很容易通过手机或电子媒体相互连接。这些媒体也帮助了医疗领域。在在线获取关于血糖、血压等信息的报告时，可以在身上佩戴设备以记录可以解读个人健康状况的数据。由于该数据集的大量增长带来了数据管理和协作方面的挑战\
  \ [30]。因此，一个采用云计算和大数据技术进行高效数据管理的服务平台变得必不可少 [28]。\n\n### 1.16 医疗多模态数据融合\n\n医疗多模态数据融合指的是电子记录，包括测量值和图像；然而，医疗部门产生的医疗数据流（尤其是尺寸巨大的数据）每年结合时给数据挖掘带来了新的挑战。为了克服这些挑战，我们需要一个模型，使信息能够以易于解读的方式呈现——就像医疗数据图像一样——适当的测量以及一个满足所有要求的多功能、多维模型。该模型将有助于整合来自无监督数据挖掘的数据，并有助于对其给出清晰的表示\
  \ [31]。\n\n### 1.17 物联网医疗的异构数据融合与环境感知系统\n\n随着技术的日益进步，医疗领域经历了从传统方法到基于智能传感器的技术的重大转变。然而，无线网络、云计算和大数据分析的发展导致物联网（IoT）使用的增加，但也随之带来了其自身的缺点——例如，准确性无法保证，且大数据可能会混淆导致困惑。因此，从异构集合中提取数据的数据融合应运而生。在这种技术中，多个传感器的结果被结合以产生一个共同且准确的结果。物联网应用可以从环境感知数据融合中受益，通过使用这些信息根据当前情况修改应用程序的行为\
  \ [32]。\n\n## 2 文献综述\n\n### 2.1 摘要\n\nBundzen 团队的这篇论文反映了 P. Bundzen 和 K. Korotkov\
  \ 基于放电可视化（GDV）参数的健康质量评估。他们的实验表明，良好的判断、快速决策和生物医学诊断能力主要取决于现代医学。评估、控制和维持健康人（RHP）的功能能力是一个重要的临床问题——包括处于生长期的儿童和处于缓解期的病患。寻找一种简单、具有成本效益的方法以及评估健康人和病患者健康状况的客观标准，似乎是显而易见且必要的。健康质量可以通过测量许多生理参数进行良好估算。开发一种用户友好、廉价的客观仪器评估和控制个人健康水平的方法是非常有希望的（Bundzen,\
  \ P. et al., 2000）。\n\nBundzen 团队得出结论，一种解决方案是 GDV 图技术。该指数有助于衡量健康人在冷静和放松心情下的机体稳态平均水平。对不同国家大型健康人群的实验，导致在\
  \ `GDV diagram` 程序中计算出的 `JS` 参数分布遵循名为“准高斯”的定律（Bundzen, P. et al, 2006）。\n\n\n\n\n\
  \n# 本文工作的应用：\n\nGDV 谱采集自美国和俄罗斯。由于对数函数的特殊属性，对治疗结果的检查发现其相对于零是不对称的。正值和负值应分别考虑。通过统计分析，使用符合正态分布的聚合值对数据段进行处理。平均值为\
  \ 0.072，接近中位数 0.078。中位数位于 25% 和 75% 之间（分别为 -0.078 和 0.217）。约 96% 的数值集中在平均值的两个标准差范围内。该数据库通过瑞典\
  \ 41 个 RHP 和美国 20 个 RHP 的检查结果进行了扩展，这些结果是于 1999 年和 2000 年间收集的，现有的数据结果显示在复合直方图中。总共测试了\
  \ 135 个 RHP，图表也证明了统计趋势得以保留：99% 的测试 RHP 符合 –0.6/+1.0 的范围。考虑到这 207 人是在在不知道其健康状况的情况下选出的，其中包括患有代偿性慢性或潜伏性疾病的人，因此\
  \ JS 范围可以取 –0.6/+1.0 作为相对正常健康状态的值。该范围可以被视为“健康”范围，并且在不同国家之间似乎相似，提供了一种数据交叉检查的方法。上述讨论的所有数据都是针对\
  \ 35 到 60 岁之间的 RHP 测量的（Bundzen, P. et al., 2006）。\n\n论文展示了未来的展望以及局限性，即仅根据 GDV 图形数据无法评估健康状况。许多患者的数据符合“健康”范围。然而，我们应该考虑所有其他\
  \ GDV 程序的数据。正如我们从 `t`-test 结果中看到的那样，在健康组和不健康组之间的大多数测量 GDV 参数之间存在统计学意义上的显著差异，而不同患者组之间没有显著差异。另一方面，正如许多临床研究所示所示，GDV\
  \ 参数对不同影响和治疗后机体状态的变化非常敏感。这项研究还提出了一个正确的陈述，即“为了对健康状况进行评估，我们应该使用一组复杂的 GDV 参数”（Bundzen,\
  \ P. et al, 2006）。\n\n它采用了 GDV 和 EPI，这两者在进行人体能量扫描方面非常高效。它记录了测量瞬间器官和系统的功能和能量状态；需要理解的是，获得的值不是恒定的——这里测量的能量考虑了受试者的情绪和心理状态，而这些状态是会变化的。此外，这项研究有助于定量分析实际的心理和情绪状态、焦虑、暴露于某些辐射对人体的影响、治疗和药物作用。由于多年对这项技术的投入，该研究的输出易于测量；有标准值和模式来描述受试者的不同水平的能量、压力和多种病理状况，且这些输出可以由非专业人员进行分析（Kototkov,\
  \ K. et al, 2019）。\n\n团队以如下方式应用工具和数据集：有助于上述研究的工具包括捕捉数字图像的 Bio-Well GDV 相机和处理光环的\
  \ Bio-Well 软件。技术包括 GDV 和 EPI。接收大量数据集作为输出，以便对受试者的各种能量和焦虑水平进行深度评估（Kototkov, K. et\
  \ al, 2019）。\n\n这项工作的应用：这项工作仍在各个领域寻找应用——它包括研究新药或治疗下的受者、长时间暴露在电磁辐射下的影响、通过练习冥想、瑜伽和其他精神活动引起的各种能量水平变化的研究、当今压力管理的研究以及各个领域（Kototkov,\
  \ K. et al）。\n\n## 局限性\n\n在局限性方面，GD-Well 仍在完善（Kototkov, K. et al）。\n\n## 结论\n\n\
  GDV 谱证明，图表也证明了统计趋势得以保留：99% 的测试 RHP 符合 –0.6/+1.0 的范围。考虑到这 207 人是在在不知道其健康状况的情况下选出的，其中包括患有代偿性慢性或潜伏性疾病的人，因此\
  \ JS 范围可以取 –0.6/+1.0 作为相对正常健康状态的值。该范围可以被视为“健康”范围，并且在不同国家之间似乎相似，提供了一种数据交叉检查的方法。上述讨论的所有数据都是针对\
  \ 35 到 60 岁之间的 RHP 测量的（Bundzen, P. et al., 2006）。\n\n论文展示了未来的展望以及局限性，即仅根据 GDV 图形数据无法评估健康状况。许多患者的数据符合“健康”范围。然而，我们应该考虑所有其他\
  \ GDV 程序的数据。正如我们从 `t`-test 结果中看到的那样，在健康组和不健康组之间的大多数测量 GDV 参数之间存在统计学意义上的显著差异，而不同患者组之间没有显著差异。另一方面，正如许多临床研究所示，GDV\
  \ 参数对不同影响和治疗后机体状态的变化非常敏感。这项研究还提出了一个正确的陈述，即“为了对健康状况进行评估，我们应该使用一组复杂的 GDV 参数”（Bundzen,\
  \ P. et al, 2006）。\n\n它采用了 GDV 和 EPI，这两者在进行人体能量扫描方面非常高效。它记录了测量瞬间器官和系统的功能和能量状态；需要理解的是，获得的值不是恒定的——这里测量的能量考虑了受试者的情绪和心理状态，而这些状态是会变化的。此外，这项研究有助于定量分析实际的心理和情绪状态、焦虑、暴露于某些辐射对人体的影响、治疗和药物作用。该研究的输出易于测量，由于多年对这项技术的投入；有标准值和模式来描述受试者的不同水平的能量、压力和多种病理状况，且这些输出可以由非专业人员进行分析（Kototkov,\
  \ K. et al, 2019）。\n\n团队以如下方式应用工具和数据集：有助于上述研究的工具包括捕捉数字图像的 Bio-Well GDV 相机和处理光环的\
  \ Bio-Well 软件。技术包括 GDV 和 EPI。接收大量数据集作为输出，以便对受试者的各种能量和焦虑水平进行深度评估（Kototkov, K. et\
  \ al, 2019）。\n\n这项工作的应用：这项工作仍在各个领域寻找应用——它包括研究新药或治疗下的受者、长时间暴露在电磁辐射下的影响、通过练习冥想、瑜伽和其他精神活动引起的各种能量水平变化的研究、当今压力管理的研究以及各个领域（Kototkov,\
  \ K. et al）。\n\n## 应用\n\n这项工作的应用：这项工作的结果表明，它在监测癌症患者治疗前后以及康复过程中是很有用的，这对于医疗保健行业至关重要。GDV\
  \ 相机可以接受为一种监测患者日常医疗系统的独特系统。计算结果也给了我们早期检测癌症的希望，基于 GDV 评估和主动测试系统，这将使全球数百万人受益。\n\n\
  他们得出结论，每个人都知道，如果癌症在发育早期被检测到，可以使用现有技术成功治疗。GDV 是一种廉价且无侵入的方法，不仅用于检测癌症，用于监测治疗后的患者健康。访问医院的患者可以通过该系统轻松检查。GDV\
  \ 方法易于应用。方法应基于计算机数据挖掘，与不同类型的病例数据库进行多参数比较。\n\n## 3 医疗保健实验的结果、讨论、解释与分析\n\n### 3.1\
  \ 能量分布\n\n```\n![图 1：两个受试者在执行雅祭/冥想和咒语方案前后，其不同器官系统的火花能量分布。](img/b_9783110708127-004_fig_001.jpg)\n\
  ```\n\n\n\n\n图 1：受试者在进行雅祭（yajna）/冥想和咒语方案前后，不同器官系统的克尔里安摄影（Kirlian）能量分布。\n\n通过对不同器官进行分析，其前后的能量分布如图\
  \ 1 所示。\n\n### 3.2 神经系统\n\n![图 2：受试者在进行雅祭/冥想和咒语方案前后，其神经系统的克尔里安摄影能量分布。](img/b_9783110708127-004_fig_002.jpg)\n\
  \n图 2：受试者在进行雅祭/冥想和咒语方案前后，其神经系统的克尔里安摄影能量分布。\n\n自主神经系统在对压力的生理反应中起着至关重要的作用，分为两个部分：\n\
  \n> 在压力条件下，交感神经系统（SNS）会诱发“战斗或逃跑”反应，即受试者要么对抗生命威胁，要么逃离敌人。交感神经系统向肾上腺发送信号释放肾上腺素和肾上腺质激素，这会增加心率并扩张腿部和手臂的血管；消化系统会调整以增加血糖血糖水平以应对紧急情况。\n\
  \n> 神经系统的能量水平可能会对生命造成严重问题，在急性攻击等情况下甚至可能导致死亡。\n\n### 3.3 呼吸系统\n\n![图 3：受试者在进行雅祭/冥想和咒语方案前后，其呼吸系统的克尔里安摄影能量分布。](img/b_9783110708127-004_fig_003.jpg)\n\
  \n图 3：受试者在进行雅祭/冥想和咒语方案前后，其呼吸系统的克尔里安摄影能量分布。\n\n![图 4：受试者在进行雅祭/冥想和咒语方案前后，其消化系统的克尔里安摄影能量分布。](img/b_9783110708127-004_fig_004.jpg)\n\
  \n图 4：受试者在进行雅祭/冥想和咒语方案前后，其消化系统的克尔里安摄影能量分布。\n\n该系统负责为细胞提供氧气，并将二氧化碳废物排出体。气道从鼻延伸到肺，经过气管和支气管。压力状态或能量缺失会导致通路收缩引起呼吸困难。研究证明，急性压力导致的亲人突然去世会诱发哮喘发作。雅祭（Yagya）显示受试者得到了放松，其能量水平的提高表明他们开始向身体平均能量水平靠拢，并变得更好（如图\
  \ 3 所示）。\n\n### 4. 雅祭与咒语的应用\n\n`雅祭`（Yajna 或 yagya）是一个在火的温暖生命力以及图 2 所示通过音乐化诵读咒语所产生的声音生命力的帮助下，火中发生自然奉献的过程。逻辑研究还额外证明了雅祭的作用，并进一步证明了其在消除医疗状况方面的价值。每天进行雅祭并恰当地诵读咒语，可以降低受试者的压力水平和紧张程度，大气毒素大幅减少，整体状况会有益得多。雅祭同样从本质上减少了不同电子设备（例如便携式电脑和平板电脑）释放的电磁辐射。通过整合能量或本质性传递的雅祭（Yagyagni）可能看起来是一种严格的演示；然而，其能力和影响是非常的，这已经通过研究人员在过去二十年中广泛而有效的实验得到了证实。此外，已有多种慢性疾病患者获得帮助的案例，在严重的糖尿病患者中，在每天参加雅祭半个月后，尿糖水平变得完全消失，血糖水平下降到正常水平[33]。\n\
  \n`咒语`（Mantra）——诵读咒语有助于集中注意力，因为当我们坐下尝试冥想时，我们的思想会到处飘散，难以集中注意力。诵读有助于将思想从无意义的绪中转移出来，有助于集中精神。报告显示，当以正确的频率、纯净的心和坚定诵语时，它通过向大脑输送最大的氧气来帮助大脑新生。它能调节心率、血压，并作为许多健康问题的药物。它创造了平静的心灵，并帮助对外界心理干扰产生免疫（Staples,\
  \ J. et al, 2009）。此外，诵读咒语被认为是释放情绪的有效方法。它也有助于刺激内系统。咒语使我们的振动同步以创造意识。这些来自咒语的振动具有巨大的力量，因为每个声音都有不同且独特的振动；因此，每个咒语都有不同的效果。此外，我们所有的思想、情感、言语和行动都会影响我们的意识[34]。\n\
  \n### 5. 克尔里安成像中的治疗\n\n`克尔里安成像`（Kirlian captures）——它采用了 GDV 和 EPI，这是一种进行人体能量扫描非常有效的方法。它记录了测量瞬间器官和系统的功能性和能量状态；需要的是，所获得的值不是恒定的——此处测量的能量考虑了受试者的情绪和心理状态，如图\
  \ 4 所示，这会变化。此外，这项研究有助于定量分析真实的心理和情绪状态、焦虑、暴露于某些辐射的影响、治疗和药物。由于对该技术的多年研究，研究结果易于测量，存在描述各种能量水平、压力和受试者多种因素的标准值和模式，可以由非专业人员进行分析[35]。\n\
  \n`阴阳能量`（Yin and yang energy）——阴阳是二元性的组成，明暗、正负、冷热；它描述了对立特征如何共存并互补、相互依赖并相互产生。它是中国宇宙学的一部分。它是和谐共存能量的象征。阴被描述为黑色，阳被描述为白色。阴被描述为女性能量，柔和、被动、缓慢且安静。另一方面，阳被描述为男性，侵略性、坚实且专注。它的本质在于阴阳能量无法孤立——就像生活的其他方面一样需要平衡。这两种能量在很大程度上影响着个人的生活，带来了必要的和平与冷静以及执行日常任务所需的能量和专注；这就是这两种能量共存并对人类至关重要的方式[35]。\n\
  \n### 6. 未来展望与研究方向\n\n\n\n\n\n这项研究能够创建一个用于癌症早期检测的系统。可以设计特殊的软件来监测患者状态，而且还可以实现 GDV\
  \ 数据的互联网交换，并进行在线分析。GDV 有助于使工作变得轻松，并有助于诊断多种疾病。该研究的未来前景在于它潜力扩展到许多现有领域；它将实现对人类情感、心理学及其随后的身体特征的研究，而这些特征在此之前是无法量化的。这些是比外部因素影响人类能量更多的参数。\n\
  \n## 7. 研究的创新性\n\n咒语（Mantra）还能减轻压力和焦虑，改善我们的心情。咒语能减慢呼吸，对我们的心脏有益。咒语在精神和物理层面起作用。练习大咒语（mahamantra）可以带来纯洁和智慧，减少我们生活的黑暗。练习真正的咒语而不是虚假的咒语非常重要，因为虚假的咒语没有帮助平衡自然力量——三性（gunas）。杜克大学的一项研究显示，在练习咒语\
  \ 4 周后，心情显著改善。咒语连接到我们的内在灵魂。当咒语伴随着和平与冷静时，它有助于找回积极的记忆。因此，研究证明了古代咒语练习可以治愈和增强我们的心体。\n\
  \n## 8. 建议\n\n致力于冥想科学的多年研究为冥想提供了一些基于证据的优势。仪器测量了个体的大脑和身体变化，并证明了定期的冥想如何影响它们 [35]。\n\
  \n根据一项研究，当每天练习冥想的人被要求检测意外刺激时，他们的表现比检测预期刺激时更好，这导致了一个结论：这些人拥有更长的注意力来积极执行给定任务。科学研究已经显示了雅杰（Yagya）的显著应用，并证明了其在净化环境价值。每天进行雅杰并配合正确的咒语吟诵会导致受试者紧张和焦虑水平下降，大气毒素减少，整体环境变得健康得多。\n\
  \n## 9. 结论\n\n冥想被认为是通往启蒙和自我实现的途径。它通过增加和谐、意识、自我反省和福祉，有助于减轻压力、焦虑、抑郁和痛苦。其中一些减轻了压力并减少了肌肉紧张。正念冥想对健康也有积极影响。除了冥想，进行雅杰也是改善健康的良好方法。\n\
  \n雅杰对于精炼我们的生活至关重要。雅杰被认为是我们进步和整体幸福的重要部分。我们的四部吠经规定了神圣创造中的伽雅特里（Gayathri）和雅杰（yagna）。基本上，雅杰意味着为了高尚的而牺牲自我、自私等。执行雅杰——伽雅特里咒语的声音和雅祭火的热量——将我们与热和光这两个主要的能量联系在一起。执行雅杰还有助于清除环境中的昆虫和细菌。在雅杰中供的牛油有助于杀死细菌。据说进行雅祭有助于作用于神经，从而帮助从神经系统疾病中康复\
