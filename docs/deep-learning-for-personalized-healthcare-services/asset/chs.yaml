  \n# 健康与医学深度学习\n\nRehab A. Rayan 流行病系，亚历山大大学公共卫生学院，埃及；Imran Zafar 生物信息学与计算生物系，巴基斯坦虚拟大学，巴基斯坦；Christos\
  \ Tsagkaris 医学学院，克里特大学，希腊\n\n### 摘要\n\n\n\n\n\n近期，随着医疗健康领域的飞速发展，产生了如患者相关检查、文本、演讲和图表等大数据，一个以数据为中心的时代已经出现；因此当前的系统和流程需要技术升级。机器学习（ML）作为人工智能（AI）的一个子集，通过不断进步的算法（特别是深度学习（DL）算法），使计算机系统根据分配给参数的权重来学习指令，而无需任何直接指令。深度学习可以自动开发具有多个处理层的模型，以便在多个抽象层次上学习数据表示。研究表明，深度学习算法在高级预测能力方面优于机器学习正受到越来越多的关注；它们在学习模型和从复合数据中提取参数方面具有前景。凭借超越人类效率的多种表征水平和结果，深度学习已广泛应用于健康医学信息学，例如：在药物基因组学的分子诊断和病原体变异识别中；在\
  \ DNA 测序和基因剪接的实验数据解释中；蛋白质结构分类；医学影像预测和药物开发等。本章讨论了深度学习在改善医疗健康方面的创新应用；首先介绍了机器学习和深度学习，接着重点介绍了它们在健康领域的应用，最后将它们的相关性与现代健康的未来展望联系起来。\n\
  \n关键词：深度学习，机器学习，人工智能，健康信息学，医学。\n\n## 1. 引言\n\n近期，生命科学领域的数据获取技术取得了巨大进展，加上计算生物学和自动存储技术的发展，将今天的生物学转变为一门数据驱动的学科。因此，如今的研究依赖于数据，并且针对生物问题有许多有前景的干预措施。生物信息学旨在通过维护、提取或探索对多个领域的此类大数据进行评估。计算生物学算法也能实现数据提取的管理。这些技术被称为数据挖掘，可以揭示生物学数据中有用的关系、趋势和表现[1]。\n\
  \n近期，计算科学的一个分支领域受到了更多关注，即软计算，它反映了在管理不确定现实世界情况的同时平滑处理数据的所有技术。硬计算的目标是精确，而软计算则在不完整事实、不确定性、不性和估计的领域运行以解决问题[2]。以前，只有原始系统可以通过计算方法进行准确的建模和分析；然而，健康、生物、管理研究、人文及类似的复杂学科系统很难通过传统的数学和分析方法进行管理。软计算技术互为补充；因此，软计算技术比传统技术能更贴地模拟生物过程（传统技术主要应用逻辑，如命题逻辑或谓词逻辑）。软计算的核心组件之一是神经网络，它在分类和反映计算生物数据方面具有广泛影响。神经网络在应用机器学习（ML）算法的数据驱动语境下非常稳健，并展现出强大的学习和抽象能力[3]。\n\
  \n## 2. 用于健康的机器学习\n\n机器学习是研究通过经验自动化的处理策略[4]，是借助人工智能（AI）对算法的图表化表示[5]。定量方法为样本结果创建了可重复和确定的蓝图，无需显式编程，这些被称为“训练数据”。在各种应用中[6]，机器学习算法被用于执行必要的功能，包括医疗保健[7]、医学[8]、邮件过滤[9]以及计算机视觉[10]。机器学习的一个类别是预测性分析，侧重于使用计算机进行预测，但数学学习并非所有的机器学习。数据挖掘是分析探索性数据的相关研究领域，依赖于无监督学习。机器学习在方法上也被称为数学智慧。\n\
  \n二十世纪已经过去了二十年，人工智能将是变革和赋能人类最重要的工具之一。人工智能及其相关服务和网络在架构上已经建立，将改变全球竞争、工作习惯和生活方式，并产生巨大的财富。毫无疑问，这种变化主要由强大的技术（ML）驱动，如深度卷积网络、对抗网络、梯度提升树模型（GBM）以及深度强化训练（DRL）。但这些并非受传统工业和技术影响的\
  \ AI 领域。健康被认为是实施 AI 工具的理想领域。\n\n健康记录（EMRs）等强制方法现在配备了评估海量数据的下一代医疗计划。AI/ML 工具旨在使这种流程更有意义。基层医疗和公共保健的智能决策质量有望提高。AI\
  \ 工具将产生最大的影响，因为它们可以改善全球数千人的生活质量。\n\n医疗机器学习（MLH）通常根据不同的预测因子预测临床效果。MLH 显示出巨大的前景，基于\
  \ ML 的工具可以达到几乎所有临床领域定义的诊断和预后功能[11]。然而，临床应用的 MLH 资源占整个领域投资的一分之一，表明大多数 MLH 应用尚未超过第一版水平[12]。仔细观察，如果领域利益相关者的专家能够将其转化为临床实践，机器学习研究人员倾向于认为已经了可靠的预后（因此就是消息）[13]。由于错误率高达\
  \ 6.8%，翻译较为复杂，但一些潜在问题可以轻松处理。\n\n\n\n\n机器学习（ML）在药学领域近期取得了显著进展。Google 开发出了一种机器学习算法来识别乳腺癌肿瘤。斯坦福大学正在使用一种稳健的皮肤癌识别学习算法。在\
  \ `JAMA` 最近的一一篇文章中，发表了一种用于通过视网膜成像诊断视网膜病变的深度技术算法的结果。在决策过程中，ML 增加了另一个维度。在这里这显而易见。对于某些系统来说，ML\
  \ 比其他技术更有吸引力。学科可以直接从可重复或系统系统中的算法中获益。许多具有广泛图像数据集的学科，如放射学、心脏病学和病学也是极具前景的候选。对于所有这些程序，ML\
  \ 都能够观察图像、识别模式，并识别需要更准确的重点区域。长远来看，ML 通过提供提高可靠性、结果和准确性的客观指导，帮助家庭医生或床旁学员。\n\n### 2.1\
  \ 监督学习\n\n监督学习始于预测已知结果或已知目标的目标。在机器学习竞赛中，个人参赛者根据其在标准数据集上的结果接受评判，反复出现的监督学习问题包括手写识别（如手写数字识别）、物体照片分类（例如判断是猫还是狗）以及文本分类。另一个例子是心脏病的临床试验或财务报告。所有这些都是智能个体能够很好完成的工作，因此机器也尝试估计人类的输出。监督学习侧重于分组，这意味着在子组之间选择解释和预测一个新的数据体，这可能包括预测一个不确定参数，例如旧金山明天下午的温度。\n\
  \n医学教育中应该受监督的解释示例有哪些？心脏病学家最经常使用的例子是自动心电图（ECG）判读，通过模式感知从几个诊断中进行选择（即分类任务）。自动放射学在从胸部\
  \ X 光中识别肺结节时也需要监督准备。在两种情况下，机器都能像熟练的专业人士一样以极高的准确性完成。跟踪学习也用于风险管理。弗兰明汉心脏病风险评分 `[14\\\
  ]` 也可能是受控医学教育最常见的例子。这些风险模型在心房颤动治疗 `[15\\]` 以及肥厚性心肌病-自动除颤器 `[16\\]` 中非常有用。机器接近医生在风险建模方面的技能，但并没有发现人类并不明显的新联系。\n\
  \n### 2.2 无监督学习\n\n然而，在无监督学习中，没有预见的含义。相反，我们的目标是考虑自然模型或数据组。这是一个更微妙的任务，即确定从无人经验获得的此类类别价值是否在随后的定向学习工作中仍被衡量（即：这些新模式是否在某些方面有益？）。这些手术形式何时被使用？最有趣的机会可能是潜在的“精准医疗”计划\
  \ `[17\\]`。常见疾病的内在异质性阻了通过病理生理通路重新定义疾病的广泛尝试，这可能为治疗提供替代可能性。然而，某些多因素复杂疾病的通路很难分类。\n\n\
  思考如何将无监管学习整合到你的心脏，并将心肌炎等异质性病变考虑在内。许多患不明急性系统性心脏疾病的相关人员可以是该过程的起点。随后会对心肌梗死患者进行活检，使用免疫疗法等程序来表征每个样本中的细胞结构。例如，将汇总\
  \ T 细胞、中性粒细胞、巨噬细胞和嗜酸性细胞。重复细胞结构模式的出现可以显示通路，并导致可以研究的干预措施。虽然基于基因组学，但一种相关方法发现了嗜酸性性哮喘亚型\
  \ `[18\\]`，它仅对针对嗜酸性细胞因子 IL-13 的新治疗有反应 `[19\\]`。注意监督学习和无监督学习的区别：没有预期结果；数据中仅检测到模式。事实上，它可以完全忽略这些子组，因为它们在这些受控学习障碍方面很困难——例如为心肌死亡率设计模型并将其分类为危险。\n\
  \n### 2.3 半监督学习\n\n半监督学习（SSL）被证明是利用未标记知识来最小化对大量选定数据依赖的强大范式。创建计算机辅助诊断系统（CAD）以支持医疗保健人员的诊断需要大量的标记（已诊断）样本；收集带有专家注释标记的数据非常昂贵且困难。这项任务被视为挑战，且耗时耗力。通过使用大量的大量的未标记（未诊断）数据结合最少标记数据来训练可靠的分类器，解决了这个问题，需要较少的人力和资源。SSL\
  \ 解决方案解决了这个问题。\n\n## 3 用于健康领域的深度学习\n\n在深度学习（DL）中，健康部门可以极快的速度处理数据而不会丢失精度 `[20\\]`。它既不是机器学习\
  \ true 人工智能；它是一种利用算法架构观察数据的优雅混合。深度教育的优势是丰富的——快速、可靠和精确，但并非终点。在多层神经网络中学习的能力比人工智能和机器学习提供了更多优势。然而，以深度学习成功的名义，医疗保健领域日益增加的学习技术让人们能够想象一个证据、研究和创意共同工作以造福患者的世界。很快，许多国家将基于机器学习的解决方案，结合来自医疗系统的实时患者数据，提高以前所未有的治疗方法的疗效\
  \ `[21\\]`。\n\n深度学习使用类似于人类大脑的数学结构。多层网络和基础设施允许了前所未有的计算资源以及处理以前缺失、遗忘或丢失的大数据的能力 `[22\\\
  ]`。这些基础学习网络可以解决困难的挑战，并从海量的医疗数据中得出结论。\n\n## 4 深度学习在医疗领域的应用\n\n\n\n\n深度学习（DL）在诊断和远程医疗方面具有巨大潜力。诊断领域最严重的问题之一是致命的医疗错误。根据一项大型分析，诊断错误占患者死亡人数的高达\
  \ 10%。DL 工具可以通过确认医生的诊断或对显著差异进行预警来辅助诊断过程[23]。在英国医院进行的一项元分析证实了并行式 DL 诊断在癌症和眼科疾病中的有效性[24]。\n\
  \n同样的原理在放射学中的应用更为广泛[25]。海量的工作负载可能会超出人类的承受能力。随着 DL 系统有效管理常规或常见的诊断，基于 AI 和 DL 的医学影像市场预计到\
  \ 2023 年达到 20 亿美元的价值[26]。DL 在医学影像中的优势体现在两个方面：不仅工作量变得可控，放射科医生还有更多时间投入复杂病例，并且与临床医生和研究人员进行更紧密的合作成为可能[24]。大量数据（主要来自磁共振成像（MRI）、X\
  \ 射线成像、正电子发射扫描（PET）和组织病理学）已经开始用于 DL 算法的输入[27, 28]。\n\n研究和开发的应用侧重于异常分类，以诊断癌症或精神分裂症。研究人员还在研究分割属性，以确保\
  \ DL 算法能够正确检测微观和宏观结构[25]。大量的 DL 研究正在调查如何通过 MRI 解读人的行为或情绪[29]。在同一框架下，基于人体记录的电活动的生物医学信号处理在\
  \ DL 背景下取得了巨大进展，以脑电图（`EEG`）、皮层电图（`ECoG`）、肌电图（`EMG`）和眼电图（`EOG`）作为输入。在将它们作为 DL 算法输入之前，区分原始信号中的噪声和伪影是有关重要的[30]。除了诊断患者，DL\
  \ 在诊断系统故障也很有用。机器学习 DL 算法已通过分析历史数据来预测设备和软件故障。DL 算法检测出了几十年来阻碍从业者进展的障碍[26, 29]。\n\n\
  除此之外，DL 与远程医疗之间的相互作用预计在未来几年内将变得更加具体[31]。远程医疗现在变得更加重要。随着跨国优化远程医疗特征的持续压力，包括 DL 在内的颠覆性技术预计将推动该领域的发展。远程医疗不仅包括与患者的直接沟通，还包括对记录的远程访问[32]。近期研究证实了\
  \ DL 诊断与传统方法在效率方面的相似性[33, 34]。这种相似性是否可以扩展到 DL 的应用中仍是一个待解决的问题。在斯坦福大学的一项研究显示，基于神经网络的算法是有效的[35]。\n\
  \n\n\n\n深度学习（DL）在医疗领域最重要的应用之一是识别和诊断其他被认为无法检测的疾病和状况。这包括难以治疗的所有早期癌症方面以及少数遗传异常。`IBM\
  \ Watson Genomics` 是一个突出的例子，它通过将基于基因的认知测量与肿瘤序列相结合，帮助实现快速诊断。全球生物医药公司 Berg 已在肿瘤药物的生产中使用人工智能。P1vital\
  \ 的 `PReDicT` 旨在在常规临床情况下建立一种商业上可行的诊断和治疗方案，提供抑郁症预测的详细背景。\n\n### 4.3.1 癌症诊断\n\n多年来，肿瘤学家一直使用计算机断层扫描（`CT`）、`MRI`\
  \ 和 X 射线等医学成像模式来检测癌症。虽然这些模式已被证明对某些癌症的诊断或分期是有效的，但仍有很大比例的患者癌症无法通过这些机器正确检测。深度学习系统作为神经网络（`CNN`），为未来的癌症诊断带来了希望。`CNN`\
  \ 能够依靠相同的诊断图像以更低的误诊率检测癌症，从而为患者带来更多结果。研究人员最近能够研究各种深度学习模型，以高精度诊断不同形式的癌症。\n\n### 4.4\
  \ 药物的发现与制造\n\n通过深度学习，药物开发已取得了突破。这包括研发技术，例如未来十年的测序和精准医疗，这些技术不断揭示多因素疾病预防的新方法。深度研究方法包括无监督学习，它可以没有预测的情况下理解数据中的模式。对于基于\
  \ `Microsoft` 的汉诺威项目，正在使用基于 `ML` 的技术，包括基于人工智能的癌症治疗技术和针对急性髓性白血病的药物组合适应。\n\n### 4.5\
  \ 医学成像\n\n一种名为 `Computer Vision` 的创新技术负责 `ML` 和深度学习。这在 `Microsoft` 的 InnerEye 计划中得到了体现，该计划使用图像诊断软件进行图像识别。随着\
  \ `ML` 可用性和解释性的提高，预计更多来自医疗图像的数据源将成为这一人工智能驱动的诊断过程的一部分。\n\n### 4.6 个性化医疗\n\n为了使定制治疗更有效，将个人健康与预测科学结合不仅可行的，而且已经准备好进行更多的研究和改进的疾病评估。通常，根据症状背景和可用的遗传数据，医生局限于选择或估计患者的风险。然而，医学领域的\
  \ `ML` 正在大量发展，`IBM Watson Oncology` 正处于该过程的前沿，利用患者的病史建立多种治疗方法。未来，具有特殊医疗特征的药物和生物传感器将上市。凭借领先的基于深度学习的医疗技术，它们的广泛使用预计将产生额外的成果。\n\
  \n### 4.7 基于深度学习的行为修正\n\n行为疗法是预防医学的重要部分，随着深度学习在医疗保健领域的普及，癌症检测和识别、医疗治疗等领域出现了许多初创公司。`Somatix`\
  \ 是一种针对企业对消费者（`B2B2C`）的数据分析器，已发布了一个 `ML` 应用来识别我们日常生活中的行为，以理解并改变我们的无意识行为。\n\n###\
  \ 4.8 智能健康\n\n保持患者报告更新是一种系统方法。虽然技术简化了数据输入过程，但事实是即使现在，其他过程仍需要大量时间。医疗保健中的深度学习在促进节省金钱、时间和精力的方面发挥着重要作用。向量分级和基于\
  \ `ML` 的光学字符识别变得越来越流行，考虑到 `Google Cloud Vision` 自动编程接口（`API`）以及基于 `MATLAB` 学习设备的手写识别技术的发展。`MIT`\
  \ 今天是创建下一波智能健康记录的先驱，包括辅助诊断和临床护理建议的地面基础 `ML` 工具。\n\n### 4.9 临床试验与研究\n\n深度学习在临床试验和研究中具有多种潜在应用。正如制药行业的任何人所说，临床研究需要大量的时间和费用，并将花费数年。使用专注于\
  \ `ML` 的预测分析来对可能的研究候选者进行分类，允许研究人员获取数据点池，例如过去的就医记录和社交媒体。例如，为测试提供最佳样本量，并利用电子记录的数据库优势。\n\
  \n### 4.10 众包数据收集\n\n今天，在医学领域众包是游戏规则的改变者，使学者和专家能够获取他们所拥有的大部分信息。诊断和治疗可以通过现场临床结果进行科学评估和修改。通过基于\
  \ `ML` 面部识别的沉浸式软件，`Apple` 的 `ResearchKit` 让医生能够观察并尝试治疗阿斯伯格症和帕金森病。`IBM` 最近致力于根据糖尿病和胰岛素大量数据解码、编译并包含实时数据。在应用这些证据的背景下，基于\
  \ `IoT` 的创新允许医疗保健识别难以诊断的病例，帮助诊断和药物治疗的总体进展。\n\n### 4.11 更好的放射治疗\n\n在放射学中，`ML` 发挥着主要作用。在医学照片的研究中有几个不同的变量可以在特定时刻出现。事故、疾病等也存在，此时无法建立复杂的方程。由于基于\
  \ `ML` 的算法使用多个样本进行训练，诊断和变量现在变得更加容易。在医学图像审查中，将对象作为病变归类为正常或病理、病变或非病变等类别是 `ML` 的常见应用。`Google`\
  \ 的 `DeepMind Wellness` 帮助 `UCLH` 研究人员例行构建算法，识别稳定组织或肿瘤组织之间的差异，并为了同一目的增强放射治疗。\n\n\
  ### 4.12 流行病和爆发预测\n\n\n\n\n\n为了监测和预测全球范围内的流行病，目前正在使用基于人工智能的技术和 `DL`（深度学习）。研究人员还可以访问从卫星、实时社交媒体警报、网站信息等收集的海量数据。人工神经网络有助于汇总这些信息，并预测从流感爆发到心肌梗死的各种病理变化\
  \ [51]。由于缺乏重要的医疗服务和教育系统，预测这些疾病的爆发对于低收入和中收入国家（LMICs）尤为有用。一个典型的例子是 ProMED 通事报，这是一个基于互联网的监测门户，用于追踪新兴感染病并提供实时的流行病更新。\n\
  \n## 5. 案例：深度学习保障患者安全\n\n`DL` 在很大程度上涉及患者安全，无论是在物理背景下（它可以提供诊断的交叉比对），还是在数字环境中（它可以检测方法论缺陷和错误操作）。`DL`\
  \ 应用在算法中整合了大量的患者记录、每日评估和生命体征测量，使其达到医疗保健提供者的可靠标准 [30]。一个有趣的案例是埃尔卡米医院（El Camino Hospital）。该机构的研究人员使用电子健康记录、床位报警数据和护士呼叫数据作为\
  \ `DL` 工具的输入，以预测患者跌倒 [52]。\n\n跌倒是老年人住院和门诊发病及死亡率的重要原因。他们的护理工作不仅对医疗保健提供者，对护理人员来说也是巨大的负担\
  \ [53]。埃尔卡米医院的 `DL` 工具可以提醒员工具有跌倒高风险的患者。医院工作人员能够及时采取行动，使跌倒率减少了 39% [52]。该应用对当地医疗的影响可以根据医疗转型委员会（Joint\
  \ Commission for Transforming Healthcare）发布的数据进行估算。具体而言，住院跌倒伤害将使住院时间平均增加 6.3 天，并使住院成本增加\
  \ 14,000 美元 [54, p. 09]。这些结果非常重要，考虑到减少患者跌倒的传统手段已屡失败。根据德克萨斯大学的一项研究，这种让执业者陷入僵局的失败通过患者教育、视力评估和助行器无法预防\
  \ [53, 54]。\n\n## 6. 挑战\n\n尽管 `DL` 在特征提取、识别和分类方面优于其他机器算法，但它也面临许多局限性。像 `DL` 中的这类生物数据非常复杂，难以被人类或算法进行转化，因为它们无法清晰地揭示生物学关系\
  \ [55]。它们仍然需要人类交互结合计算探索来充分研究特定的生物数据，这被称为“黑箱问题”。为了获得更高的精度，`DL` 算法需要大量并非容易获取的数据进行学习；因此存在过拟合风险，表现为较高的测试误差和较低的学习误差。在大多数情况下，选择适合任务的特定算法是一项挑战。\n\
  \n此外，随着超参数优化技术等选择辅助工具的出现，要决定应用框架并不容易，特别是考虑到不断有新框架的加入。计算技术减少了分析数据的开销并节省了时间；然而，`DL`\
  \ 算法特别有一个数据密集型学习过程，耗时性且需要程序员等专业人士。专家认为 `DL` 无法解决许多关键问题。例如，在任何分类问题中，`DL` 提供的多个高级可视化结果难以翻译或修改。`DL`\
  \ 并不能应用于所有情况，特别是罕见情况。`DL` 算法很容易通过输入中的微小改变被欺骗，从而产生未分类的信息。\n\n## 7. 结论\n\n如今，产生的生物数据量极其巨大，无法仅凭人类进行分析；因此需要\
  \ `ML`（机器学习）的支持，特别是 `DL` 算法来高效转化医学和健康相关数据。近期，医学 `DL` 的研究和进展已在药物开发、基因组和蛋白质组分析、转录组基因表达、多组学研究、剪接、医学图像处理以及其他等领域引入了无处不在的应用。在健康领域，`DL`\
  \ 已用于转化生物信息学、遗传变异识别、靶点与配体间相互作用的学习、医学影像、辅助可穿戴设备、健康信息学和人群健康等。然而，生物科学中的这种 `DL` 方法仍处于早期阶段；尽管如此，考虑到成本、时间和应用，它是一种现代技术在彻底改变生命科学格局方面具有前景。\n\
  \n然而，其应用存在一些局限性，因为可以通过生物领域的进展，通过合作设计生命科学数据的 `DL` 算法来处理算法。在全球范围内，IT 和制药行业正在快速投资计算生物学；因此预计该领域在未来几年将巨大增长。本章描述了\
  \ `DL` 的最新创新及其在健康科学中现有和预期应用。它揭示了 `DL` 在医学科学应用中的空白，这需要通过合作努力大幅推进研究。\n\n## References\n\
