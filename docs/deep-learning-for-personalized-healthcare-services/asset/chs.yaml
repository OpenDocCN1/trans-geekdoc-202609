  \n### 用于不同属性的雅杰物品/组件\n\n对于具有不同萨提贡（Satogun）、拉杰贡（Rajogun）和塔姆马贡（Tamogun）属性的人，雅杰中使用不同的物品和组件。\n\
  \n萨提贡——念珠——圣罗兰（Tulsi），坐垫——枯草（Kush），花——白色，容器——铜，布料——烟灰/粗布，方向——东方，油灯中的牛油，提拉克（Tilak）——檀香，雅杰中的火柴——菩提树、榕树、没药。火供材料（Havan\
  \ Samagri）成分：白檀香、沉香、小豆蔻、丁香、旋花花、婆罗米、天门冬、岩香草、凉糖、甘果、印度没药、竹节、肉蔻、吉骆草、百叶、眼泪草、甘草、莲蕊、坏掉根、椰子、杏仁、大麦、燕麦、冰糖。\n\
  \n雅杰不用任何咸味物品。科学原因是：在雅格中，不使用与盐相关的元素，因为它们会转化为氯。这种氯对人类和细菌一样有害的。牛油主要用于雅格。它有两个作用：第一，它点燃雅杰之火并将其温度保持在\
  \ 200–300 °C；其次，这种牛油在扩散到整个雅杰火周围后，提供了更强的燃烧能量。雅杰的主要益处是净化空气。由于火的存在，雅杰周围的空气变得轻盈并上升。取而代之的是更纯净的空气\
  \ [16, 17, 18]。\n\n![图 12：盐的化学成分（NaCl）。](img/b_9783110708127-002_fig_012.jpg)\n\n\
  图 12：盐的化学成分 (`NaCl`)。\n\n## 4. 结果与讨论\n\n为了观察雅格对电辐射和磁辐射的影响，作者团队进行了实验。如今，我们无法想象没有手机、笔记本电脑、平板电脑和电视的生活。现实情况是，我们生活在这些辐射的海洋中。所有这些设备都会发射电磁辐射。它们是有害的，会导致身体健康问题，包括癌症。联合国国际癌症研究机构通过收集\
  \ 13 个国家的数据进行研究发现，使用手机超过 10 年的人患脑癌和颈部癌的风险增加。\n\n雅格是印度经典中解释的一种强大的解决方案，用于保护我们免受这些宇宙射线的影响。因此，在哈里瓦德德梵里提大学（Dev\
  \ Sanskriti University）的支持下，雅格疗法团队进行了多次实验，测量了雅杰（前后不同地点的辐射。发现，在经过帕拉亚夫兰（Parayavran）咒语时期后，第一次匹配辐射水平显著下降。让我们来看一些实验结果。\n\
