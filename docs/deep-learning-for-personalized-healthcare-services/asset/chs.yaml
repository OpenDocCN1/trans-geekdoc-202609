  \ 1–12.\n\n# 患者健康记录系统\n\nNeha Mehta Engineering（顾问）,Chhattisgarh Swami Vivekanand\
  \ Technical University, Bhilai, India SVAV Prasad ECE Department, Lingaya’s Vidyapeeth,\
  \ Faridabad, India\n\n### 摘要\n\n患者健康记录（PHR）系统是赋能和支持医疗服务新愿景的新平台之一。它属于新兴的新一代信息系统大类，是一种以用户为中心的医疗保健记录系统。随着移动计算的普及，PHR\
  \ 经历了大幅增长。PHR 作为传统电子健康记录（EHR）的扩展已经启动；PHR 处于发展中，并能够让患者管理自己的记录，从而实现自我护理。强调 EHR 可以被地记录、计算和通信这一事实，让我们提供了其可以在治疗的及时性甚至完整性以及护理质量方面创造巨大差异的洞察。对于患者和医疗保健系统来说，它都是非常有前景的工具——为整个医疗保健系统提供了成本效益。该系统包含了患者的慢性疾病以及健康状况及其预防。为了有效建立基于\
  \ ICT（信息与通信技术）的医疗保健，需要重点关注患者个人信息的接受安全水平以及经过确保的术后护理。ICT 在维持无缝医疗保健的有效性和效率方面发挥着巨大的作用。医疗保健的增强也使研究人员关注关注电子健康（e-Health）。因此，重点已转向疾病更好的预测和预防，以及医疗保健的个性化。\n\
  \n关键词：信息系统，以用户为中心，移动计算，EHR，PHR，\n\n## 1 引言\n\n健康促进、疾病诊断、相关治疗以及治疗后康复是医疗保健过程组织的组成部分。患者健康记录（PHR）系统的愿景是一个互操作系统，其目的不仅是改进\
  \ PHR 过程，还改进健康生产过程（HPP）的核心。它连接了不同程序和工具的价值链，这些程序通过公共卫生角色中包含的支持过程和任务不可避免地连接在一起。因此，必须根据整个医疗保健过程各个阶段的定期安全指标来提高患者安全性。管理的关键支持作用允许并提供了定期健康更新，以便进行更好的预防和管理。然而，与\
  \ ICT（信息与通信技术）相关的系统和应用程序是患者持续及相关长期护理的后端。健康促进是核心健康交付系统的重要元素，而 PHR 和 EHR（电子健康记录）是健康交付系统的引导和支持工具。后端管理、相关规划、物流和组织是医疗保健系统管理的组成部分。日常研究也为该系统的促进带来了许多新的改进方法。相关的\
  \ CME（继续医学教育）和 CPD（继续专业发展）是该领域培训的一部分，尽管 EHR 充当了电子维护信息的存储库。\n\n在追求这些亮点的过程中，本章重点关注传统\
  \ EHR 的方案及其作为 PHR 的扩展。将阐述 PHR 系统的概念框架、PHR 的主要类别、其随时间演变的重点，以及 PHR 系统在提供和收集信息以及维护临床信息方面的侧重点。将介绍待维护的功能和偏好。将讨论\
  \ EHR 的不同级别以及通过支持服务进行的不同级别的通信。还将阐述持续的患者追踪和监测以及社会经济影响。识别患者数据相关的挑战和该领域数据存储的潜力将有助于提高服务的质量和数量。将简要介绍案例研究的历史及其相关性。\n\
  \n描述电子处方（E-prescription）的不同级别及其社会经济影响的概念。本章还将通过一个评估模型总结 EHR 对医院质量和患者满意度的影响。\n\n\
  本章还将探讨 EMR（电子病历）系统对长期护理工作流和效率的影响。这一演示将展示使用 EMR 如何减少完成多项日常临床过程的步骤，从而让支持人员有机会花时间对住院患者进行直接护理，从而对提高护理质量做出贡献。若干益处包括更好的临床决策、临床结果的改善、与患者沟通的加强、更少的医疗错误、获取医疗记录的便利性以及对临床指南的依从性的提高。在一项系统综述中，ICT\
  \ 运行的健康管理对效率、质量和成本的影响是巨大的。根据数据分析师的数据，EMR 对患者安全的影响很小，但报告显示，随着投资的增加和强有力的评估，这种影响随时间推改善。然而，ICT\
  \ 技术知识和医生实践环境的缺乏被确定为医院的主要障碍，而次要障碍（如实施成本、实施过程的复杂性以及缺乏证据）表明这些系统可以为用户提供利益。回顾了各种研究并报告了主要益处。因此，医疗保健社区正通过采用\
  \ ICT 和 EMR 系统向前发展。\n\n## 2 健康过程组织\n\n医疗是指通过诊断、治疗和预防来维护健康，或者指的是通过医疗专业人员适当的医疗交付来改善健康的过程。现代医疗交付由跨学科专业团队完成，如社区工作者团队、医疗从业人员团队、预防团队、辅助人员等。医疗过程是医疗活动中的相互关系之一。根据\
  \ B. Beryman 等人的观点 [1]，从公民的角度来看，医疗涉及五个重要的过程。这些是：\n\n* 预防\n* 检测\n* 诊断\n* 治疗\n* 良好的结果\n\
  \n预防意味着保持健康，是一种健康的机制，并包括个人层面的进一步改进。临床预防是一类，进一步分类为：一级预防，避免疾病发生；二级预防，旨在尽快治疗疾病以防止其恶化；以及三级预防，旨在减缓疾病的进展。\n\
  \n\n\n\n\n图 1 描述了涉及医疗流程的不同环节的参与情况及其后端支持。健康促进前台、诊断、治疗和术后护理是每个医疗流程背后流程过程中的步骤，在每个阶段都涉及各种专家和亚专科专家。信息和通信技术（ICT）是后端流程，对于个人、社区和医疗专业人员之间的访问和通信起着至关重要的作用。在研发方面，ICT\
  \ 构成了医疗部门与社区之间的信息桥梁。它还提高了医疗体系的效率，并防止了医疗错误。\n\n医疗一线工作人员和其他相关人员的基本资质也构成了系统的基础需求。然而，为了确保质量和可及性，医疗改进的重点需要开发用于医疗专业人员发展的培训计划\
  \ [2]。然而，可能来自研究中心、医疗报告、医疗或信息提供者以及医疗行业的研究和物流，有助于系统从核心开始产生新的、更改进的促进方式。\n\n## 3 ICT\
  \ 相关系统\n\n生活质量的提高是当今时代的挑战之一。因此，信息和通信技术在医疗健康的几乎所有方面都发挥着至关重要的作用。ICT 的结合使得医疗部门能够作为一个新兴的数字健康部门进行发展。ICT\
  \ 在医疗保健中的存在处于不同的阶段——记录管理、自动药物输送、手持数字医疗器器的无线访问等。患者医疗数据的电子化存储允许医务人员在任何时间检索信息，同样，数据也可以在任何地方、任何时间提供给患者。\n\
  \n换句话说，与 ICT 相关的医疗系统也被称为**以患者为中心的医疗保健**。它是共享信息、在患者希望的任何地方寻找更好的专家的最佳方式，甚至可以采用触达到的更好、更先进的技术。如今，ICT\
  \ 也被应用于药物处理路径，例如自动发药系统，这甚至极大地改进并减少了药物递送中的错误，并提高了生活质量。因此，基于 ICT 的基础设施实现了具有成本效益的特征，具备实时数据收集、获取以及带有存储容量的数据交付能力\
  \ [4]。\n\n患者记录中的 ICT 允许访问带有警报、药物和提醒的完整档案，并与决策支持系统相关。它包括主患者记录和次级患者记录 [5]。主患者记录是医疗机构使用的记录。次级患者记录是用于其他目的记录。\n\
  \n## 4 电子健康记录 (EHR)\n\nEHR 是患者纸质病历的数字版本。它是患者健康信息的计算机记录，授权的提供者可以实时获取。EHR 包含病史、药物、过敏史、实验室结果和其他临床数据。这可以实现更好的患者护理并减少重复检查。\n\
  \n### 4.1 EHR 实施\n\nEHR 的实施需要由可用性的增强来驱动。它旨在改善医患关系。在早期，计算机系统仅用于计费和财务系统；此后，它被用于存储患者数据，从而扩展到具有临床相关性。\n\
  \n\n\n\n\n根据 Wallis [13] 的研究，从 2009 年到 2017 年，使用 EHR 的医生百分比从 48%增加到 85%。然而，这是数据科学家和临床医生共同作用的结果。因此，机器学习以人工智能（AI）的形式投入了实施，这使得计算机机器能够识别参数并得出结论。这进一步提高了预测准确性并减少了错误，从而改善了患者护理。根据\
  \ Wallis [13] 的研究，斯坦福医学在 2018 年进行了一项“哈里斯民意”调查，调查报告了使用 EHR 的有效性，因为它节省了与患者交流的时间。\n\
  \n然而，利用 AI 的力量可以实现患者记录的数字化以及通过预测模型对其进行分析。在该领域，算法通过真实世界的示例进行设计，机器进行训练。\n\n2015 年，一个名为\
  \ Saykara 的系统启动了一家使用名为“Kara”的虚拟助手初创公司。该基础是为了应对满足 EHR 要求所花费的时间和负担。然而，“Kara”作为一个虚拟助手，会倾听患者与医生之间的对话，对其进行解释，并将其转换为笔记或转诊单。该虚拟助手还将数据输入\
  \ EHR 中。\n\n2009 年 6 月，Saykara 发布了其作为 AI 赋能助手的新版本“Kara2.0”。它作为一个突破性的语音应用程序，可以转录患者与医生之间所有的讨论，从而将所有文本转换为结构化数据。从此以后，它可以生成包含病史、评估、计划和转诊的临床记录。\n\
  \n这标志着一种多功能的增强型 AI 方法，并辅以人类反馈，使系统能够自我训练以满足医疗保健的准确性要求。\n\n2020 年 3 月，Saykara 推出了备受争议的\
  \ AI 突破，引发了更多创新；Saykara 因在 AI 领域的云计算实施和实际创新荣得了 Stratus 奖。\n\n最尖端的 EHR [3] 在五个不同的级别上使用了不一致的缩写，它们包括：\n\
  \n*   自动医疗记录 (AMR)\n*   计算机化医疗记录 (CMR)\n*   电子病历 (EMR)\n*   电子患者记录 (EPR)\n*   EHR\n\
  \n医疗记录的不同级别如图 3 所示。\n\n![图 3: 医疗记录的不同级别。](img/b_9783110708127-007_fig_003.jpg)\n\
  \n图 3：医疗记录的不同级别。\n\n`AMR` 包含了一半的 IT 生成信息，以及纸质记录和可能从通信或结果报告或任何可用数字记录生成的某些自动数据。\n\n\
  `CMR` 是所有医疗记录的数字化形式，以及所有可用纸质记录的扫描件。\n\n`EMR` 是 IT 生成的数据，通过交互式指南制作的数据管理和决策支持系统准备就。\n\
