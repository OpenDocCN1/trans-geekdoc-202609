  \ ML 论文[22]。其他作者通过对 3000 份患者图像使用深度 CNN 实现了癌症的自动检测[23, 24]。作者利用各种图像处理技术对宫颈涂片图像进行了调查并收集了\
  \ ML 算法[25]。他们实施了 SVM、FNN 和 KNN 来预测宫颈癌状态[26]。文章明确提到贝叶斯网络在识别宫颈癌方面具有最佳准确率[27]。该章节发现了检测宫颈癌的多种测量方法，并与其他算法进行了对比以显示结果[28]。作者完全专注于使用图像处理技术通过精确率、召回率和\
  \ F1 得分进行性能分析[29]。\n\n## 3 提出的方法\n\n### 3.1 数据收集\n\n所提出的方法通过应用统计模型和机器学习算法，使用了包含\
  \ 237 个样本、6 个阶段和 17 个特征属性的宫颈癌数据集。这些数据集是通过 Google 源链接从 MDE 实验室收集。\n\n### 3.2 特征选择\n\
  \n\n\n特征选择是一种分析原始和初始数据的有效方法。在进行分类和回归分析时，从多个属性中挑选出重要特征，以提高性能水平。在本文提出的工作中，从宫颈癌液涂片图像中提取了各种特征。作者从这些特征中仅选择了提供最佳准确性的有效统计和几何属性。基本特征包括几何特征、统计函数和\
  \ `GLCM`（灰度级共生矩阵）特征。他们从真实数据集中删除了某些特征，例如 `centroid`、`convex`、`convex-hull`、`surface\
  \ of the cell`、`compactness` 和 `min-max value`。\n\n表 1：宫颈细胞核特征。\n\n| 核特征的定义 |\n\
  | --- |\n| 形状特征 | 纹理特征 |\n| `1\\. Area:` 测量对象面积的像素数 | `9\\. Solidity:` 描述细胞核面积与凸面积之间的关系。\
  \ |\n| --- | --- |\n| `2\\. Eccentricity:` 它提供了图像像素到最接近路径、圆和球体位置的程度 | `10\\. Energy:`\
  \ 表示图像的相似性。这将根据细胞核区域的类型而变化。 |\n| `3\\. Perimeter:` 测量细胞核中细胞粒的微尺寸 | `11\\. Mean:\
  \ S*patial filtering 用于细胞中去噪的空间滤波。 |\n| `4\\. Diameter:` 它推导出包围整个细胞核的圆的最短长度 | `13\\\
  . Standard deviation:` 用于测量数据围绕平均值的离散程度。 |\n| `5\\. Radius:` 从细胞核中心向外的距离 | `14\\\
  . RMS:` 均方根值，用于获取结构不完备的可视化。 |\n| `6\\. Minor axis length:` 提供最小轴的距离。它根据细胞类型而变化。\
  \ | `15\\. Contrast:` 显示核的亮度。 |\n| `7\\. Major axis length:` 提供最大轴的距离。它根据细胞类型而变化。\
  \ | `16\\. Correlation`: 指像素在整个图像中与其最近邻居的相关性 |\n| `8\\. Orientation:` 细胞内 x 轴与物体最大距离之间的视角\
  \ | `17\\. Homogeneity: 它描述了细胞的相似性* |\n\n上述 表 1 提供了预测宫颈癌的属性定义。\n\n### 3.3 数据预处理\n\
  \n数据预处理属于数据挖掘技术。它指的是将真实数据转换为可理解的信息。通常，实时数据集经常是不完整的、不一致的并且包含缺失和空数据。数据预处理是解决此类问题的方法。数据清洗是预处理的第一步，通过填充空值、删除噪声数据和消除冗余来清洗数据。在预处理过程中可以对数据进行归一化并缩小数据规模。宫颈癌数据集检测未使用数据预处理，因为该数据集来自真实的液涂片图像，且不包含任何空值。从图像获取的信息将包含像素和强度值。每个像素值对于未来将进行的回归分析都非常重要。宫颈癌的检测仅基于细胞的像素和强度值。每个细胞都包含一个核和一个细胞质。癌症阶段的判定根据核的形状、属性和解剖形状。\n\
  \n### 3.4 使用分类器对多分类标签宫颈癌进行预测\n\n分类器用于分析训练和测试数据，帮助计算机根据类别和标签自动理解。分类器可能具有监督和无监督学习模型，并带有或不带标签。数据集包含\
  \ 237 条处于六个阶段的宫颈癌女性记录。使用各种分类器来检测宫颈癌并分析性能指标。\n\n## 4 结果与讨论\n\n### 4.1 数据收集\n\n宫颈癌数据集考虑了六个阶段的癌症图像。表\
