  \n[24] Witten, I. H., Frank, E., Hall, M. *数据挖掘：实用机器学习工具与技术*, 第 4 版，加利福尼亚州旧金山，美国，Morgan\
  \ Kaufmann, 2016.\n\n[25] Dhahri, H., Maghayreh, E., Mahmood, A., Elkilani, W.,\
  \ Nagi, M. 基于机器学习算法的自动乳腺癌诊断。*Journal of Healthcare Engineering*, ArticleID4253641,\
  \ doi: [`doi.org/10.1155/2019/4253641`](https://doi.org/10.1155/2019/4253641).\n\
  \n[26] Lynch, C. M., Abdollahi, B., Fuqua, J. D., Alexandra, R., Bartholomai, J.\
  \ A., Balgemann, R. N., … & Frieboes, H. B. (2017). 通过监督机器学习技术预测肺癌患者生存率。*International\
  \ journal of medical informatics*, 108, 1–8.\n\n\n\n\n随着技术的快速发展，许多医院正转向患者信息和记录的数字化维护。患者的治疗结果很大程度上受到外科医生所做的时间受限、复杂、不确定且高风险决策的影响。启发式方法、个人判断和假设演绎法推理通常主导着临床决策。传统的决策支持系统和预测分析面临某些挑战，导致准确率并非最优，且人工管理信息的工作既繁琐又耗时。这可能导致可避免的伤害、错误或偏见。通过实施使用深度学习自动化的人工智能模型，可以克服传统系统的挑战，在模型中，移动医疗设备的输出可以作为患者数据流馈到电子健康记录中。在这些系统中，决策过程涉及人类直觉、床旁评估保留、详细监控与实施、模型可解释性、数据标准化，以及对错误责任认定和算法偏见中伦理挑战的考虑。从患者挂号到手术及恢复，这个在线平台都可以被启动和优化。在治疗、用药和手术过程中，深度学习技术可以指导医生和患者。在复杂和致残的病例中，该技术利用统计和定量模型，能够实现更好的决策。感染可以使用该模型进行检测、跟踪、调查和控制。在本章中，我们讨论了利用深度学习技术分析临床图像以进行临床决策。我们还回顾了患者管理系统、可穿戴技术、标准化以及使用深度学习方法处理传感器节点的信息。与传统的临床方案相比，该系统提供了改进的解决方案、解释性和透明度。\n\
  \n**关键词：** 人智能，深度学习，临床决策，患者管理，决策支持系统，电子健康记录，\n\n## 1. 引言\n\n医学领域正随着技术的发展而发生变革，并在很大程度上采用和尝试自动化。智能技术，如人工智能（AI）和深度学习（DL），为个性化治疗、独特配比的药物以及多种针对性和定制化的治疗提供了更增强的解决方案\
  \ [1]。诸如 `AI` 等技术有助于数字化格式维护患者记录，并定期对患者进行检查。用于数据分析的海量信息的可用性以及计算能力和存储需求的增长，推动了 `DL`\
  \ 技术的进步。其应用正扩展到包括医学在内的各个领域，并带来了高效且充满前景的机会。随着有关 `DL` 研究的发展，医疗保健生态系统受到了极大影响 [2]。医学中的各种问题通过\
  \ `DL` 提供的广泛算法和技术解决方案得到了解决。患者记录的数字化、患者管理和临床决策是 `DL` 算法发挥主要作用的一些关键领域。\n\n现有技术，如虚拟现实、自然语言处理（NLP）、图像处理等，可以与\
  \ `DL` 结合，为医学领域的各种挑战提供极具前景的解决方案。这不仅有助于自动化，还极大地提高了临床医疗保健的服务质量 [3]。大型数据集的分类和预测是各种智能系统的关键因素，可以使用\
  \ `DL` 技术高效执行。这些系统由一系列嵌入式区块组成，其中数据传输通过区块之间的数据流发生，从而根据信息的汇总来实现最优决策。由于 COVID-19 的爆发，远程医疗和数字健康系统已成为必需品\
  \ [4]。在这种情况下，远程治疗、会诊和诊断的重要性被再次强调。在过去的几年里，远程医疗的进展由于行为和监管障碍而放缓。`AI` 和 `DL` 的贡献将有助于很大程度上转型远程医疗。通过智能管理和决策，可以从临床实践和医疗保健中获得整体性的治疗\
  \ [5]。\n\n预防残疾和疾病以及为协助患者预测健康状况是定量模型和精准医学的首要目标。在预测分析和临床研究加速方面，电子健康记录（EHRs）提供了极具前景的前景。基于数据驱动模型和\
  \ `EHRs` 的临床试验患者招募、自症谱系障碍、共病聚类发现、2 型糖尿病亚群识别、药物相互作用和效应预测变得更加流行和准确。尽管有这些优势，但由于工作流的限制，临床决策支持系统对这些\
  \ `DL` 方案和预测模型的使用有限。系统性偏见、随机错误、不完整、稀疏、异质性、噪声和高维是 `EHR` 数据建模和表示中的一些挑战。数据表示和特征选择很大程度上影响了预测算法的实现。然而，在门诊和医院护理环境中，`EHR`\
  \ 的使用一直在增长。\n\n## 2. 医疗保健中的深度学习\n\n科学家、研究人员和医学专家正尝试实施多项新技术并提供有影响的结果。可以根据传统方案中提供的原始数据和输入特征，利用从业者的领域知识和专业知识确定显式模式。通过选择、分析和创建过程对特征进行适当评估是耗时且费力的。`DL`\
  \ 在医疗保健领域提供了各种创新的应用和解决方案 [6]。来自患者保险记录、医学报告和患者记录的海量信息通过神经网络收集并处理以提供最优结果。尽管处于实施早期阶段，`DL`\
  \ 在各个维度上取得了显著成果 [7]。`DL` 在医疗保健领域最常见的应用包括药物发现、医学成像、保险欺诈、疾病早期检测和基因组学。诊断和图像分析涉及卷积神经网络（`CNN`），它有助于黑色素瘤和其他疾病的检测。`DL`\
  \ 的训练和学习能力使这项技术作为医疗保健的未来成为关注焦点。工作流优化、最大的临床医生支持和放射技术是实施 `DL Aidoc` 模型的成功成果 [8]。\n\
  \n\n\n\n董事会、经理、护士、医生、病理学家以及若干人员参与了医疗保健系统。临床和非临床决策由这组人员做出。战略规划、预算、资源分配等涉及非临床决策，而医疗处方、治疗、疗法和诊断涉及临床决策\
  \ [9]。\n\n临床决策涉及由技术驱动的安排，有助于医疗执业者、医生或手术机器人在做出更好决策的过程中。`DL` 可以同时辅助临床和非临床决策。在资源利用、术后管理、识别和减轻可改变风险因素、知情同意过程以及增强运营决策方面的共享决策，是利用\
  \ AI 进行临床决策的潜在益处 [10]。\n\n临床决策的复杂性很高，因为其属性既包括可测量参数也包括不可测量参数。之前的健康记录、诊断报告、教育程度、经验、生活方式、患者信仰等共同构临床决策的属性。将量化和可测量属性作为\
  \ `DL` 算法的输入至关重要，以提高其在决策过程中的效率。\n\n为了向读者提供更好的理解，图 1 展示了一个简单临床决策系统的框图。涉及医疗记录、诊断报告、观察到的症状、患者权利、饮食习惯、过敏史等信息的主要和次要患者信息，与一个由其他患者记录组成的知识库相结合，该知识库为决策提供参考。\n\
  \n`DL`、`Microsoft Cognitive Toolkit (CNTK)`、`Caffe`、`PyTorch`、`Torch`、`Keras`、`Theano`\
  \ 和 `TensorFlow` [11] 是实现 `DL` 算法的一些开源工具和主要编程语言。多层感知器、`CNN`、循环神经网络 `(RNN)` 和自动编码器\
  \ `(AE)` 是在监督或无监督学习功能上运行，用于信息提取、表示学习和结果预测的 `DL` 模型 [12]。\n\n![图 1: 一个简单的临床决策系统。](img/b_9783110708127-006_fig_001.png)\n\
  \n图 1：一个简单的临床决策系统。\n\n患者疗后的改善、医疗成本优化、具有高客观性和准确性的药物个性化，是 AI 在临床决策中的一些益处 [8]。医疗数据超过了从任何其他产生的数据。尽管存在法律影响和伦理讨论，但如果以正确的方式与海量数据协作，这项技术有着广阔的未来。\n\
  \n### 2.1 患者管理中的深度学习\n\n自我纠正或得出确定结论可以通过推理和利用在 AI 过程中通过学习获得的数据来完成 [13]。通过识别毒性、发病率和其他医疗系统障碍，可以克服诊断不足的障碍。通过使用预测建模、计算、机器学习、`DL`\
  \ 和 `AI` 检查结构化和非结构化数据，可以计算揭示可能的关联性、趋势和模式。机器学习和大数据应用于健康领域的广泛范围内 [14–15]。患者管理正因这些技术的进步而发生变革。`DL`\
  \ 和大数据的结合可以提供：异常或欺诈行为检测、风险组合的快速重新计算、近实时缺陷和问题、故障根本原因的确定、战略业务规划、智能决策、优化方案、新产品开发、节省时间和降低成本的解决方案\
  \ [16, 17, 18]。\n\n图 2 代表了 `DL` 在临床决策任务中的集成，涉及数据获取、特征提取、解释和决策。`Google` 利用 `DL` 的优势分析海量健康数据，成为医疗保健领域的全球创新领导者\
  \ [17]。这些技术也可用于健康领域的数据管理。根据美国医疗保险和医疗补助服务中心的报告，美国医疗支出预计每年增长 5.5%。全球国内生产总值的近 10% 由医疗支出贡献，金额约为\
  \ 7 万亿美元 [19]。\n\n![图 2: 临床决策任务中的深度学习集成。](img/b_9783110708127-006_fig_002.jpg)\n\
  \n图 2：临床决策任务中的深度学习集成。\n\n护士、医生和患者可以使用手机应用程序或 Apple 设备以安全的方式传输和接收数据，在使用某些药物时确保患者安全，查看放射影像和实验室结果，进一步了解患者的治疗和状况\
  \ [20]。糖尿病控制、中风相关的语言障碍、听力测试、视力测试、帕金森病和房颤可以通过使用 Apple Watch 检测不规则心律进行追踪。每年花费约 300\
  \ 亿美元的药物不依从问题正通过 Medisafe App 公司利用 `HealthKit` 应用程序接口的个性化技术协助人们管理药物 [21]。\n\n为了向全球研究人员和医疗专业人员提供帮助，`IBM\
  \ Watson Health` 被开发用于通过将知识和信息转化为见解来做出明智的患者护理决策。Watson 医疗保健的使用来自 300 多家医疗机构和医院日益增加的证据支持。\n\
  \n\n\n\n\n未来建议将预测建模、计算、深度学习（DL）、机器学习（ML）和人工智能（AI）整合到医学院课程中，以将教育扩展到统计学之外 [23]。通过可穿戴设备和健康应用的潜在支持，健康管理成为可能。对数据机密和隐私的意识得到了增强，使医生和患者能够参与克服安全障碍。通过利用现药物相关数据和公共疾病的爆发应用计算方案，药物发现技术发生了变革。利用多种可用的工具和资源，可以提高分析效率。可以使用适当的技术对患者个人数据进行屏蔽，克服数据安全和隐私方面的局限性。考虑到数据量的增加，必须加强安全方案以提供高效的患者管理\
  \ [24]。\n\n## 2.2 数据提取方案\n\n缩写词扩展、关系提取、时间事件提取和单概念提取是使用深度学习（DL）提取临床信息的主要子任务 [25]。使用单概念提取方案，可以在无临床文本中提取结构化医学概念，如程序、治疗和疾病。通过传统的自然语言处理（NLP）技术可以实现不同程度的成功。然而，临床笔记的复杂性为该领域留下了巨大的改进空间。在临床笔记中，每个单词都可以被分配与临床相关的标签，使序列标记成为解决概念提取问题的解决方案。疾病的严重程度、适应症、药物不良反应、用药途径、剂量、药名和其他相关标签在每个疾病和药物类别中均已可用。条件随机场（`CRF`）和长短期记忆（`LSTM`）网络在基于\
  \ `RNN` 的深度学习架构中，与双向 `LSTMs` 或门控循环单元结合 [9, 10, 11]。\n\n为了实验目的，使用最先进的技术从文本中提取临床概念，并与基准\
  \ `CRFs` 进行比较。实验结果显示，在疾病严重程度、用药频率、持续和其他细微属性方面，`RNN` 变体显著优于 `CRF` 基准。在与计费相关的临床代码结构中，尽管临床信息具有高度重要性，但目前尚可用。命名实体识别（`NER`）是另一种基于深度学习的重要临床概念提取应用。在该模型中，通过在预训练词嵌入上使用\
  \ `CNN` 改进了 `CRF` 基准。\n\n在提取的电子健康记录（EHR）中，分配时间概念是一个复杂问题，可以通过时间事件提取特征来克服。分析来自两家大型临床机构的信息，并将文本用于模型预训练，其中词向量和\
  \ `word2vec` 以及标准的 `RNN` 被用作临床笔记框架，用于提取医学事件和相关的事件时间 [8]。可以使用斯坦福大学开发的 `Deep Dive`\
  \ 应用进行预测和结构化关系分析。当执行共享任务时，该模型需要人工工程参与，这提供了巨大的改进空间。可以使用关系提取来提取各种关系，例如 `test X` 揭示了医学问题\
  \ `Y`，或者 `X 导致、恶化或改善了状况 Y`，以及其他关系 [25]。这与时间事件提取中看到的日期和时间跨与相应临床事件的关联形成对比。统一医学语言系统（`UMLS`）和其他文本预处理方案中的单词到概念的映射被用于带有稀疏\
  \ `AE` 的特征生成，为 `CRF` 分类器提供输入。该模型优于现有的 `HER-relation` 关系提取模型。这些技术在图 3 中所示。\n\n![图\
  \ 3：从电子健康记录中提取信息。](img/b_9783110708127-006_fig_003.jpg)\n\n图 3：从电子健康记录中提取信息。\n\n\
  临床文本包含超过 150,000 个独特的缩写。为了进行提取，必须完成结构化概念映射，随后进行扩展。缩写扩展是一项具有挑战性的任务，因为每个缩写可能有多个可能的解释\
  \ [23]。可以使用词嵌入技术来解决这个问题。来自书籍、期刊、医学文章和监护室的临床文本被用于 `word2vec` 预训练，以创建自定义嵌入。通过结合所有背景信息，可以获得准确率最高的嵌入。\n\
  \n### 2.3 临床决策中的深度学习\n\n根据最近的研究，数据驱动的人智能和临床决策支持系统使用了领域知识或纯数据驱动技术，这证明了数据驱动人工智能的主导地位。对可用知识的整合和结合采取适当步骤，可以创建允许多个人工智能类别之间进行协作的混合方法。这种协作所面临的需要解释和透明度的主要分辨率可以通过医学信息学来克服。在进行手术、优化资源利用、管理并发症和处理可变风险因素时，涉及高风险并由外科医生做出决策。通过克服判断和诊断错误，可以在很大程度上防止所造成的手术损害\
  \ [26]。个人判断和假设性推理很大程度上影响了手术决策。由于这些因素的高度性，无法提供标准的解决方案。\n\n![图 4：临床决策流程图。](img/b_9783110708127-006_fig_004.jpg)\n\
  \n图 4：临床决策流程图。\n\n图 4 展示了临床决策的流程图，其中实验室检查、影像、心电图采集、血压、身高、体重以及其他简单测量值、人口统计数据、患者临床史和其他相关数据被获取。参考数据和人类知识与医生获取的数据相结合，进行比较和解释\
  \ [19]。还考虑了测量不确定性和信息完整性以验证数据的可靠性。此外，做出了可解释的决策，通过回溯可以易于理解背后的逻辑。产生的决策有助于计划随访观察、即时治疗或让患者回家。\n\
  \n\n\n\n\n通过实施国家手术质量改进计划、手术风险计算器和其他传统的临床决策支持工具，可以进行风险缓解并减少变异。然而，该系统的数据采集和输入必须手动完成，这不仅耗时，而且准确性欠佳，阻碍了临床决策。尽管这项任务非常重要，但关于临床决策改进策略的研究仍然有限。本章提供了一种模型，将来自患者\
  \ `EHR` 的实时数据馈给智能模型，并结合人类直觉来辅助临床决策`[[19](https://link.springer.com/chapter/10.1007/9783110708004_01122#b_9783110708127-006_ref_020)]`。系统还可以与床旁健康系统集成。将细胞学记录中关于肿瘤阶段和扩散的数据与患者的肿瘤影像相结合，可以在很大程度上帮助理解疾病和患者状况。`DL`\
  \ 和 `AI` 提高了临床决策支持系统的可靠性。\n\n### 2.4 医院环境中的其他应用\n\n`DL`、`ML` 和 `AI` 方案可用于提高运营效率、患者监测、患者流量预测、临床决策、`EHR`\
  \ 管理与分析以及临床环境中的各种其他用途。通过预测算法减少预约延迟和等待时间，可以提高患者满意度并优化医院资源。放射、超声、磁共振成像 (`MRI`) 和计算机断层扫描设施被监测以识别延迟时间。这些数据结合就诊时间可以帮助预测等待时间。从放射科数据库中提取多个变量。`回归树`、`分类`、`bagging`、`梯度提升机制`、`k\
  \ 近邻`、`多变量自适应回归样条`、`弹性网络`、`支持向量机 (`SVM`)`、`随机森林`、`神经网络`以及多种此类算法可用于训练数据拟合和参数调优。\n\
  \n算法的预测精度可以使用均方根误差值确定。在延迟和等待预测方面，使用 `elastic-net` 算法可以获得高效且更高的精度。在必须做出应急诊断决策的医院病房和科室，自动化诊断决策支持应用可以加速这一过程[[27](https://link.springer.com/chapter/10.1007/9783110708004_01122#b_9783110708127-006_ref_028)]。当风险患者需要无计划转入重监护室时，使用\
  \ `AI` 模型利用多个预测变量进行特征识别是最优的。通过 `AI` 算法预测特定时间范围内的医院再入院，可以在很大程度上降低医疗系统成本。\n\n无人的门诊患者可以使用集成的`扩展医疗警报响应技术`无线系统进行监测。护理人员配备了该系统的无线接口，并具有其他功能，如定向警报、信号处理、地理定位、血氧饱和度和无线集成的心电图患者监护仪。急诊科和其他关键科室通过嵌入\
  \ `AI` 算法使用医疗信息系统，可以改善患者结局。使用基于 Web 的患者支持系统可以提高患者的生活质量并降低治疗成本。以医生为中心的健康监测和以患者为中心的决策是基于\
  \ Web 的患者支持系统的关键。在急诊科，通过评分算法对胸痛患者进行急性心肌并发症分析和心脏骤停预测。\n\n通过在 `AI` 模型中应用患者流量管理方案，实现医疗机构的高效患者管理和患者流量预测。这使得预测急诊科的访问量、避免可以预防的医疗中心访问和电话、定制治疗方案以及高效的患者流量管理成为可能。在医院中，患者流量管理、病床的获取和分配是一项挑战性任务。可以使用患者的临床数据以及床位使用情况和其他相关管理数据执行床位可用性和患者出院预测。床位可用性信息可用于手术安排并在医院环境中高效地组织系统。这增加了收入，并提供了医院人力和资源的有效利用。\n\
  \n预测性分析为病房数据的分类提供了解决方案。在医院中，患者流量不仅取决于医院和患者因素，还取决于环境因素。环境温度和其他日历变量也可预测患者流量。与每月季节性相比，每周季节性往往常见。`季节性自回归移动平均\
  \ (SARIMA)`、`广义估计方程`和`广义线性模型 (GLM)` 是用于预测的时间序列模型[[23](https://link.springer.com/chapter/10.1007/9783110708004_01122#b_9783110708127-006_ref_023)]\
  \ [[24](https://link.springer.com/chapter/10.1007/9783110708004_01122#b_9783110708127-006_ref_024),\
  \ [25](https://link.springer.com/chapter/10.1007/9783110708004_01122#b_9783110708127-006_ref_025),\
  \ [26](https://link.springer.com/chapter/10.1007/9783110708004_01122#b_9783110708127-006_ref_026)]。\n\
  \n## 3 深度学习在医疗领域实施的挑战\n\n多任务问题、偏差与方差的权衡、灵活性、生成问题、过拟合和欠拟合问题、高性能硬件需求、超参数调节、数据量以及选择正确的模型类型是\
  \ `DL` 算法的一些固有挑战。为任何与临床支持相关的任务设定共同基准也是具有挑战性的，因为大多数研究人员使用私有数据，他们不愿意共享这些数据[[28](https://link.springer.com/chapter/10.1007/9783110708004_01122#b_9783110708127-006_ref_029)]。`EHR`\
  \ 文以数字数据、打印文档和手写文本的形式存在。这些数据必须由 `DL` 算法分析和理解。临床文本中的简写和缩写在不同医生之间存在。\n\n### 3.1 数据标准化\n\
  \n`EHR` 可以成功捕捉并建模具有高变异性的患者护理和疾病轨迹。临终护理、晚期癌症治疗的选择、实验室检查时间、提供者方案的变异、癌症位置、疾病表现以及患者之间的其他自然差异提供了高变异性。尽管投入了持续的研究努力，但标准化患者护理仍然具有挑战性。由于疾病进展和变异源的存在，在巨大的搜索空间中导航纵向模型是具有挑战性的。与机器学习方案相比，`DL`\
  \ 在相同数据集上取得了更好的结果，并克服了许多与医疗决策相关的问题。临床决策支持工具的用例有助于整合患者信息的变异。基于多个科室特定患者亚群体构建的某些死亡预测模型在其他亚群体上的表现可能并不理想。\n\
  \n\n\n\n虽然深度学习（DL）技术需要大量数据，但机器学习（ML）只能处理较少的数据，尽管医疗保健领域存在巨大的问题。在较小的社区机构，由于资源有限或患者量不足，手动数据标注具有挑战性，导致导致相关训练数据不足。迁移学习是解决数据不足问题的可能解决方案[29]。在迁移学习中，借助已过充分验证的模型权重和架构，可以使用新的训练模型来执行不同的机构或不同的任务。可以通过较小的数据集和对获取的新数据集进行标注，高效地更新现有模型的权重，而不是从头构建新模型。这减少了重新训练模型或构建新数据集所需的精力和成本。\n\
  \n### 3.2 偏见与混杂因素\n\n沃森超级计算机是人工智能、机器学习和深度学习进展的一个显著案例。然而，它提供了几项有错误的癌症治疗建议。根据其他地理地区医生的说法，该系统的建议倾向于美国的常规护理。这种偏见放大了健康结果的差距。它还限制了个性化医疗的发展和增长到达少数群体。正如某些研究人员强调的，训练数据必须包含所有少数群体。偏见的训练数据集使得某些算法能够根据种族预测未来的犯罪分子。这些是人工智能、深度学习和机器学习解决方案所继承的人类偏见[23]。心肌发作后的护理是另一个性别偏见的例子，由于医疗误诊，不同性别组受到了不平等对待。根据训练数据和数据集中个人所做出的决策，深度学习解决方案继承了某些偏见因素。对临床目标的认知认知、临床决策中的偏袒和偏见是深度学习技术面临的一些现有挑战。成功且高效的决策应用涉及找到通过深度学习克服人类偏见的方法并从过去的错误中汲取教训。\n\
  \n图 5 展示了临床决策范式，比较了有效和无效的临床决策因素及其结果。在肺炎预后和风险评估期间，深度学习算法将哮喘患者分类为低风险，不需要进一步的干预。这是偏见的一个常见实例，也是医疗领域关注的问题。对怀疑患有肺炎的哮喘患者处方了积极治疗，因此与非哮喘患者相比，降低了风险。尽管存在危害影响，这个巨大的问题仍然需要高效的解决方案。德国和捷克的研究人员提出了去偏算法，以理解人类认知偏见及其影响。学习过程与偏见问题一样具有混杂性。在研究期间，会对输入数据和结果进行虚假关联分析。\n\
  \n![图 5：临床决策范式。](img/b_9783110708127-006_fig_005.jpg)\n\n图 5：临床决策范式。\n\n该问题的另一个例子是使用深度学习检测乳腺癌[28]。学习过程与偏见问题一样具有混杂性。在研究期间，会对输入数据和结果进行虚假关联分析。在白内障的情况下，由`ML`提供治疗建议和风险分层。\n\
  \n### 3.3 验证与持续性\n\n广泛的数据验证、审计和持续改进对于深度学习的性能至关重要。在某站点训练的模型的前瞻性验证可用于另一个站点。外部验证非常稀缺[30]。放射科医生在`DL`实施中的前瞻性验证是满意的。基于`ML`的系统的糖尿病视网膜前瞻性验证因其卓越的结果已获得美国食品药品监督管理局（FDA）批准。在结肠镜检查中，形成了肿瘤性息肉。\n\
  \n在整个数据库上重新训练模型需要更多的资源和时间。灾难性遗忘问题是一个重大挑战，模型在从新信息中学习时会忘记数据。这个问题可以通过去中心化的计算架构（联邦学习）来解决，在该架构中，模型可以在手机上本地运行，并可以使用单个用户的数据进行改进[29]。可以维护数据安全，并使用深度神经网络分割脑肿瘤。还开发了用于定期性能监控、更新和评估法规的算法。\n\
  \n### 3.4 可解释性与说明性\n\n以人类可以理解的方式呈现和表达信息被称为可解释性。在任何学习算法中，为用户提供解释算法输出的功能都是一项极具价值的特征。特别是在医学和其他其他严格监管的领域，由于缺乏可解释性，深度学习方案未被采用临床实践，这一特征可以帮助克服局限性。在将深度学习算法的结果转化为临床实践时，必须采取谨慎决策，特别是在在使用大数据集可能出现争议性结果的应用中。欧洲《通用数据保护条例》（GDPR）过滤器并未被各种深度学习算法超越，这揭示了每个决策涉及的逻辑和数据[31]。用户可以获得推理路径的访问权限，这使得算法能够提供特定的决策。预测和注意力图用于提高通过深度学习算法分析\
  \ CT 图像诊断急性颅内出血的解释能力。\n\n\n\n\n![图 6：临床决策方法。](img/b_9783110708127-006_fig_006.jpg)\n\
  \n## 图 6：临床决策方法。\n\n图 6 展示了各种临床决策方法。医生通过模型辅助进行临床决策，在该模型中，会针对每个患者查看特定数据，并关注事实的可信度。研究人员通过\
  \ `DL` 方法对 `MRI` 扫描进行分析以对肝脏病变进行分类，做出重大决策。在 `DL` 系统中，重要特征估计的可解释性与结合梯度提升机的预测相结合，用于手术期间预防低氧症的发生。局部可解释模型无关解释（`LIME`）是一种因其可解释性特征而广受欢迎的\
  \ `ML` 模型 [7]。在 `LIME` 中可以使用简单的局部模型轻松近似黑盒模型，而不是对整个模型进行近似。通过更改输入并改变人类理解的组件，可以使用 `LIME`\
  \ 评估预测的变化，以解释个体预测。使用基于机器学习的预测算法分析心肺数据，以检测患高血压的风险。\n\n### 3.5 安全与监管\n\n训练 `DL` 模型需要访问海量数据集。这带来了若干隐私和安全挑战。医疗机构之间如何以安全的方式进行数据传输仍在讨论中。利益相关者不再低估备受关注的数据泄露风险。通过使用欧洲\
  \ `GDPR` 建议的安全措施保护敏感信息，可以防止数据泄露和黑客攻击。故意攻击决策系统可能会造成大规模损害，这是一个非常严重的威胁。患者数据隐私和安全必须由信息技术资源的行业法规和标准来保障。\n\
  \n可以使用区块链技术传输不可撤销且安全的加密数据，提供更高水平的数据安全。数据访问通过智能合约进行监管，并使用加密工具确保数据安全和完整——区块链提供了不可篡改且公开的交易日志\
  \ [16]。数据不能存储在网络的单一位置，而必须在网络的每个节点可用。这一特性使得区块链难以扩展、维护成本高且处理速度较慢。尽管用户主权有助于防止有害公司访问数据，但在发生违规行为时仍无法剔除用户。在保护个人信息的同时，联邦学习允许通过去中心化的模型训练范式更新学习模型，从而确保患者数据安全。当需要解释时，完全匿名化的系统会导致自溃和失败。`DL`\
  \ 系统中的伪匿名化是可审计的，并且是一个非常理想的功能。\n\n`DL` 算法的学习失败和不当的临床决策属于医疗疏忽，会导致法律挑战。该领域缺乏适当规定，且\
  \ `DL` 应用中尚未定义对医疗事故及其他问题负责的实体 [12]。数据的快速演变在定义和更新方面带来了挑战。数据的质量、验证过程和标准必须由政策制定者进行分析，以确保算法对人类福祉的保障。\n\
  \n## 4 数据分析\n\n为了记录 `EHR` 中的事件和数据，存在多种受控词汇表：`RxNorm` 及其他代码、逻辑观察标识符（`LOINC`）、手术程序术语（`CPT`）、疾病及其健康国际分类（`ICD`）与其他代码、医学术语系统（`SNOMED\
  \ CT`）以及 `UMLS` 等资源被用于此目的。跨机构的数据分析和协调是部分实现的。\n\n![图 7：EHR 发布。](img/b_9783110708127-006_fig_007)\n\
  图 7：EHR 发布。\n\n![图 8：深度 EHR 趋势。](img/b_9783110708127-006_fig_008)\n图 8：深度 EHR 趋势。\n\
  \n跨机构的应用使用 `EHR` 执行。临床记录、给药、实验室检查结果、诊断和人口统计数据存储在 `EHR` 中。图 7 和图 8 代表了自 2015 年以来的研究。数据选择、概念表示、数据提取、质量保证和表型的研究数量巨大。\n\
  \n在使用 `DL` 算法收集数据时考虑了随机临床试验。与临床试验相比，临床实践的复杂性更高。对于 `DL` 算法面临的不完整数据，必须进行公式化或插值处理。某些患者可能会某些决策选择，他们可能处于不同的疾病阶段，根据生活方式、年龄、性别、种族或共症接受不同的调查方案。在长期监测患者时，还必须考虑经济、时间和数据存储限制。在使用此类数据训练算法涉及各种挑战。\n\
  \n![图 9：时间线表示。](img/b_9783110708127-006_fig_009.jpg)\n\n图 9：在 Google AI 博客上的时间线。\n\
  \n这是一个基于 Google AI 博客的模型解释案例研究。图 9 展示了在医院环境中跨越时间线的归因方案示意图 [32]。数据点由 `DL` 模型读取，并学习患者结果。由于涉及的数据点很多，使用了前馈神经网络和\
  \ `RNNs`。在患者入院 24 小时后，通过归因方案进行住院死亡率预测。根据病情严重程度，还可以使用 `DL` 模型预测死亡风险。对于单个患者，可能会从病历记录中考虑超过\
  \ 150,000 个数据点 [33]。\n\n\n\n\n\n必须对电子健康记录（EHR）的预测结果进行评估以验证模型。标准的分类指标，如诊断预测、高血压预测、风险分层、F1\
  \ 分数、召回率、精确率、非计划再次入院预测、镇痛药物反应预测和其他准确性指标、临床事件预测、骨病风险因素识别、诊断分类、心力衰竭预测以及其他适当的使用标准，可用于基于深度学习（DL）的结果预测方案评估。定时临床事件预测、疾病进展建模和时间诊断预测指标可用于时间预测任务。\n\
  \n## 5 未来研究方向\n\n目前已使用深度学习算法开发了多种诊断推理方案。然而，在早期阶段提供先验知识和对治疗后健康状况进行预测的深度学习预后是未来研究的一个理想方向。图\
  \ 9 显示，由于缺乏对深度学习算法的解释，预测路径被表示为黑盒。当临床医生必须做出生死决策时，可解释性能为深度学习算法提供足够的信任 [34]。未来的研究可以转向解决这一问题。人类由于各种原因可能会非理性地做出医疗决策。然而，深度学习（DL）、机器学习（ML）和其他\
  \ AI 算法在训练后是理性的学习者。基于博弈的方法可以作为此类行为的解决方案。然而，该问题尚未获得最优解决方案。\n\n为了改进未来的模型，必须实现机构和医院之间大量的数据传输，以确保深度\
  \ EHR 框架的高效运行。敏感的患者数据也必须通过严格的隐私政策进行保护。使用深度学习中的字符增强嵌入、双向 LSTM 和 RNN 对患者进行自动去标识化处理。这些模型利用词/句法特征进行操作。结果的可复现性是深度\
  \ EHR 的另一个主要挑战，因为目前缺乏用于算法增强的通用基准。隐私保护和对生成数据效用的评估应以更定量、更准确的方式进行 [35]。在进行监督数据生成时，生成数据往往会针对任务预测产生偏差。由于医院和机构之间缺乏数据共享，数据多样性无法保障。必须克服这些挑战来实现数据增强。\n\
  \n当使用众包数据池或数据库池进行在线训练和测试 AI 算法时，算法出现数据泄露或破解的风险是。专家系统非常关注安全问题。保护患者隐私至关重要。这需要高效的隐私和安全算法。研究人员在很大程度上致力于消除人类与\
  \ AI 之间的差异。随着这些进步，临床医生和患者对医疗行业中使用 AI 技术的信任有所增加 [36]。支持性和学习生态系统必须包含机器以支持人类的日常活动。在\
  \ AI 算法的训练或验证过程中，不应使用平衡或倾斜的数据集。为了实现无偏学习，在使用不平衡类别的数据时，必须对算法进行修改或进行数据预处理。大多数现有工作尚未解决这个问题，未来的研究必须关注这一点。关于数据量、变异性、质量、不确定性、因果干扰、可解释性以及法律伦道德问题都是未来研究的方向。\n\
  \n## 6 结论\n\n深度学习算法在患者管理和临床决策方面具有良好的应用。通过使用 AI 技术进行组织的数据管理，可以做出准确且快速的决策。传统决策系统中准确性不足，以及耗时乏味的人工数据输入问题已被深度学习方案所克服。偏差、假设-演绎推理、决策疲劳、复杂性、不确定性和时间限制是影响使用深度学习方案临床决策的一些因素，导致了可预防的伤害。EHR\
  \ 数据可以实时传输到自动化 AI 模型中。在临床决策与 AI 的成功整合中，必须考虑人类直觉的保留、床边评估、通过监测和细致实施对伦理挑战的关注、模型解释性的进步以及数据标准化因素。数据科学家和敏锐的临床医生必须以回溯的方式审视前期的临床应用和决策，以验证\
  \ AI 模型提供的数据。\n\n参考文献\n\n[1] Toh, T., Hodginger, I., Wang, D. Looking beyond the\
