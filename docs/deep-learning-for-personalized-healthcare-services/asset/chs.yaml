  \ →\n\n# 医疗服务中利用深度机器学习算法对多分类宫颈癌进行预测\n\nS. Jaya 科学系，Sri Sarada College for Women,\
  \ Salem 16, India M. Latha 科学系，Sri Sarada College for Women, Salem 16, India\n\n\
  **致谢：** 作者未获得出版本章节的任何资金支持。\n\n### 摘要\n\n宫颈癌是女性腹部发生的最不安全的肿瘤。宫颈癌是一种双形式疾病，分为正常状态和异常状态。两者表现出相似的细胞核和细胞质模式。宫颈癌分为七个阶段，包括浅表鳞状细胞、中层鳞状细胞、柱状上皮、轻度异型生、中度异型生、高度异型生和原位癌。宫颈癌阶段的预测非常困难，更不用说一个人是否受到肿瘤的影响了。在这种情况下，统计分析和机器学习算法对于预测癌症早期状态非常有帮助。本章的重点是分析各种深度机器学习算法，并寻找最佳性能衡量标准，以为宫颈癌预测提供最高准确率水平。尺寸、形状和结构的统计模型对于从宫颈涂片图像中提取特征最为重要。从数据集中收集了\
  \ 237 个样本，用于开发应用数学模型来分析纹理变化，并研究形状与纹理之间的相关性。在机器学习算法下实现并比较了各种分类器，以衡量准确率水平。本文提出的文章从数据分析、大数据和数字图像处理三种环境进行了分析。本章的整个执行均使用\
  \ `MATLAB R2016a` 完成。\n\n关键词：图像处理、宫颈癌、特征提取、分类器、机器学习、宫颈涂片图像，\n\n## 1. 引言\n\n### 1.1\
  \ 使用学习算法进行数据分析的基本概念\n\n分析（Analytics）是“分析的科学”。数据分析主要关注对原始数据进行测试和研究以获取有用的结构。数据分析的主要过程是从海量的结构化或非结构化数据中提取有意义的信息。数据分析已扩展到大多数商业企业，以正确的方式做出决策。它指的是对方法的假设和预测，旨在不同层面带来解决方案。原始数据可以随原始数据源进行过滤和分析，并应用统计模型在各个领域做出决策，例如商业、工业、医学、医疗保健、银行、客户互动和能源管理。分析的一个方面是决策支持，它为支持人类决策过程提供信息。\n\
  \n![图 1：数据分析的类型。](img/b_9783110708127-008_fig_001.jpg)\n\n图 1：数据分析的类型。\n\n图 1 显示了四种数据分析类型。\n\
  \n#### 1.1.1 描述性分析\n\n描述性分析是关于过去发生了什么。这种分析通过对原始数据进行模式化，为各种应用提供益处。描述性分析是使用过去数据来了解发生了什么。这种类型的分析通过分析过去的数据，以制定克服未来障碍的策略。例如，在医疗领域，这种分析有助于了解宫颈患者的状况。\n\
  \n#### 1.1.2 诊断性分析\n\n诊断性分析帮助专家快速了解为什么发生了什么。例如，在医疗领域，通过分析发热、头晕和疲劳等症状得出结论。\n\n####\
  \ 1.1.3 预测性分析\n\n预测性分析始于 1940 年，政府开始使用计算机。组织或业务中使用预测模型来预测未来。可用的预测算法有支持向量机、人工神经网络、贝叶斯网络、决策树和回归模型。例如，关于宫颈癌的预测分析可以根据细胞目前的形状、大小和结构以及患者的过去报告，预测未来是否会受到影响。这种类型的分析将现有数据加载到机器学习模型中，预测接下来将发生什么。\n\
  \n#### 1.1.4 规范性分析\n\n规范性分析是基于描述性和预测性分析结合而产生的数据集合，用于其模型并应用于决策系统。此外，它对于评估决策是否取决于各种可能的假设是很有益的。\n\
  \n### 1.2 数据分析与大数据的应用\n\n#### 1.2.1 银行业\n\n在银行和金融服务部门，管理层访问与客户相关的大量数据。然后向客户更新相关的产品和服务信息。这些产品和服务包括贷款详情、利率、新政策发布、账单详情和欠款。这些银行交易可以通过数据分析帮助进行处理。\n\
  \n#### 1.2.2 通信、媒体和娱乐\n\n媒体和娱乐的主要作用：消费者洞察——观众对特定业务的反馈。分析人类行为和思维的最佳方法是了解公司是否容易理解人类对产品的心理，以及的感受如何。通过获得此类反馈，公司可以利用它们来提高销售。\n\
  \n#### 1.2.3 执法与安全\n\n数据分析已用于近十年用于预测犯罪率，该技术被用于寻找特定位置的犯罪率。它用于分析犯罪率在过去几年是增加还是减少，以及哪种犯罪增加最多。通过使用数据分析中的先进技术可以预测各种犯罪。会有帮助的信息包括犯罪类型、日期、时间和犯罪地点。\n\
  \n#### 1.2.4 运输\n\n\n\n\n数据分析在一个国家的交通行业中非常有用。它可以用于生成路线优化的日常更新。它被用于解决交通问题、为运输服务选择盈利网络，并准时预测未来的事件。在现代社会，货物从一个地方运输到另一个地方。\n\
  \n### 1.2.5 风险\n\n在保险领域，数据分析被用于客户理赔数据。公司收集数据和策略，这些数据将有助于客户做出决策。在个人投保之前，由代理人进行评估，然后提供适当的保险。如今，分析软件被用于拒赔理赔。让管理层关注此类欺诈理赔是非常重要的。\n\
  \n### 1.2.6 递送物流\n\n全球范围内有许多物流公司，例如 Flipkart、Amazon、DHL 和 FedEx。这些公司为运输寻找最佳且最短的路线，以实现最佳送货时间。GPS\
  \ 是数据分析中用于货物交付最有用的跟踪系统之一。\n\n### 1.2.7 Web 服务\n\nWeb 服务是向人们传达信息的快速方式。实用的 Web 服务有\
  \ Facebook、Instagram 和 Twitter。通过使用这些社交媒体平台，信息传播到世界各个地区。数据分析在网络带宽方面对于实现这一目标起着关键作用。\n\
  \n### 1.2.8 医疗健康 – 医学图像分析\n\n数据分析是处理医院患者报告最重要的任务之一。在医院里，患者报告在就诊的每个阶段都会被维护。根据这些报告，医生可以预测患者的疾病状态，以及他们处于关键阶段还是初始阶段。\n\
  \n### 1.2.9 欺诈与风险检测\n\n为了识别具有信用的客户，银行根据客户在各个阶段提供的输入应用数据分析。输入包括 PAN CARD（PAN 卡）、CIBIL\
  \ 评分和支票交易详情。在这里，欺诈包括客户可能从多家银行贷款且留有未付余额的可能性。在这种情况下，分析有助于分析客户的过往经验。\n\n### 1.3 统计模型\n\
  \n数据分析的核心概念是通过使用统计模型和技术研究业务数据，以发现并理解历史模式，从而预测业务的未来状态。数学函数和方法被应用于数据集以获得某些解决方案。统计学和数学模型被用于各个领域，通过对公司过往报告进行分析来改进业务。此类分析包含不同的变量，用于探索其他变量之间的关系。为了测试推理和验证数据，应该使用置信区间和假设检验。在统计建模中，最好的方法之一是回归分析。多种类型的回归分析被用于实时应用。例如，本章考虑了基于特征提取数据集对\
  \ Pap 图像进行多类宫颈癌的诊断。\n\n### 1.4 用于预测分析的机器学习算法\n\n机器学习是命令计算机像人类一样学习的方法。这种学习比人类更具能力。如果存在大量数据，普通人无法理解数据集中的模式和模型，那么机器学习算法有助于做出决策并使其非常清晰。人类无法预测特定事件是否会发生。但是，通过使用机器学习，可以根据过去的经验和过去的数据集报告来预测未来的事件。我们给计算机的输入应该能被计算机理解，为此，数据集应该是非常清晰且真实的。\n\
  \n机器学习可以有多种用于预测目的的分类器。它们是用于分类的预测分析算法。\n\n1. 监督学习：模式识别和回归\n2. 无监督学习：聚类、关联规则、降维\n\
  3. 强化学习：遗传算法、SARSA Q-learning、DQN\n4. 集成学习：堆叠、装袋法、提升法\n5. 神经网络和深度学习：CNN、ANN。\n\n\
  这些是可以用于各种应用和领域的机器学习分类器，例如医疗、交通、降雨预测、自动驾驶汽车、卫星预报、脸指纹识别和法医检测。\n\n#### 1.4.1 监督学习\n\
  \n分类和回归是重要的。在统计模型中，我们有多种回归方法：最近邻、朴素贝叶斯、SVM（支持机）和决策树。\n\n#### (i) KNN（最近邻算法）\n\n\
  KNN 被用于机器学习算法。它是很容易实现的，并灵活地用于分类和回归。数据集是带有标签的，因此被称为监督学习。根据数据集，它将区分数据点是还是否。\n\nKNN\
  \ 实现步骤：\n\n1. 加载宫颈癌数据集。\n2. 分配 `K` 值，例如 `K = 3`。\n3. 找到查询与样本数据集之间的距离——计算欧几里距离。\n\
  4. 根据距离从小到大的顺序对排序。\n5. 从收集集中选择初始的 `K` 个条目。\n6. 为 `K` 个条目标记。\n\n朴素贝叶斯实现步骤：\n\n任务\
  \ 1：计算宫颈癌类别的概率。\n任务 2：计算所有属性对所有类别的概率。\n任务 3：将值应用贝斯定理，然后找到后验概率。\n任务 4：根据给定的输入属性注意概率最高的类别。\n\
  \n#### (ii) SVM（支持机）\n\nSVM 分类器的主要目标是确定最佳超平面，以将每个数据点与另一个类分开。SVM 的一个良好超平面表示划分类别的直线，通过两个类别之间的宽间隙来指示。属性被称为数据点。根据数据点，类别将被放置，SVM\
  \ 将使用直线分离每个类别。\n\n### (iii) 决策树\n\n\n\n\n\n# 决策树分类器在各种模式识别场景中被有效地用于分类技术，解决图像识别以及字符或文本识别的挑战。这种分类器通常适用于复杂的分类问题。决策树分类器在处理相反的数值或类别型数据集方面表现出更高的能力。决策树分类器基本上是非参数的，是处理特征属性与类别之间非线性关系的理想选择。决策树的结构看起来像树的基础。通常，决策树有三种基本结构：\n\
  \n1. 根节点（父节点）\n2. 隐藏节点\n3. 终端节点（也称为叶节点/子节点）\n\n根节点应至少有一个子节点。下图是基于具有面积和标准差属性的宫颈癌数据集的决策树结构。这里只显示了两个值，但原始数据集有\
  \ 17 个节点。这些都是唯一的连续值；没有分类数据。\n\n![图 3: 决策树模型。](img/b_9783110708127-008_fig_003.jpg)\n\
  \n图 3：决策树模型。\n\n图 3 通过使用两个特征（面积和标准差）解释了宫颈癌数据集的决策树。\n\n## 1.4.2 无监督学习\n\n无监督学习属于机器学习技术。没有必要观察模型。作为替代，必须使用一个框架来处理其内容。它主要处理没有类别标签的数据。与其他自然学习方法相比，无监督学习模型是一种更具不性的方法。使用无监督学习算法的主要原因如下：\n\
  \n* 在数据中发现各种未知的模式\n* 搜索有助于分类的特征。\n* 分析输入数据集并由用户完成标签拟合。\n\n### (i) 聚类 – 分层聚类\n\n\
  聚类是无监督学习中的重要概念之一。聚类的主要任务是在一组未分类的信息中找到某种形式。聚类算法分析数据并将数据分组（`cluster`）。无监督学习算法中有多种类型的聚类。在这种方法中，每个信息都根据其类型进行排序，使用户可以根据数据集设置聚类数量。示例包括层次聚类和\
  \ K-means 聚类。\n\n分层聚类技术是机器学习算法中的常用方法。“聚类”一词意味着从相应的数据集中收集相似的数据。聚类技术的类型有：\n\n1. 凝聚式\n\
  2. 分离式\n\n凝聚式层次聚类技术 – 最初，每个数据点被定义为一个一对一的聚类。在每个循环步骤中，通过不同的数据点合并相关的凝聚，直到定义了 K 个聚类。凝聚的基本规则是：\n\
  \n* 计算接近度数组\n* 将每个数据点视为一个聚类\n* 迭代；混合两个最最近的聚类并修改新的局部矩阵\n* 形成单个聚类\n\n分层聚类方法由树状图表示。树状图是一种存储系列统一或划分数据的树形结构。\n\
  \n分裂式分层聚类技术 – 在现实世界中并不常用。这种派系方法用于将每个数据点视为一个独立的聚类进行研究。所有数据点被隔离以形成单个聚类。因此，独特的个体组形成一个组聚类，这种方法被称为分裂式层次聚类。\n\
  \n### (ii) K-means 聚类\n\nK-means 是一种重复性的凝聚算法，旨在在所有迭代中发现最大值。首先，选取特定数量的聚类。这种聚类的主要任务是将数据点分组为\
  \ k 类。规则的结果是一组“标签”。它将数据点分配到 k 个组之一。在类聚类技术中，每个集合通过为单个组创建一个质心来表征。质心是聚类中一个至关重要的步骤，它获取了距离聚类最近的点。\n\
  \n### (iii) 降维\n\n降维是通过获取一组主变量来减少随机变量数量的操作。特征选择和特征提取是降维中的重要因素。降维包含两个部分：\n\n* `Feature\
  \ selection` 是最好的方法之一，通常通过选择精确的类别变量或属性来提高数据集的准确性。\n* `Feature extraction` 是获取对象/数据集的特征。阐述原始数据集的统计值称为特征。\n\
  \n适用于降维的不同方法有：\n\n1. 主成分分析\n2. 奇异值分解\n3. 独立成分分析\n\n主成分分析 (PCA)：PCA 的主要概念是修剪真实数据集的空间属性，该数据集具有许多相关的变量。它是一种从数据集中提取信息的非参数方法。它是一种识别模式的方法，同时也突出相似性和差异。在数据中找到模式是困难的。为了这样分析海量数据集，PCA\
  \ 是一个强大的工具。压缩是用于各种应用程序中减少空间和冗余数据的技术之一。\n\n奇异值分解 (SVD)：图像压缩是最好的例子之一。SVD 取一个具有若干行和列的矩形矩阵。最初，它找到\
  \ 2×2 或 4×4 矩阵的特征值和特征向量：\n\n```\nA = U * S * V^T\n```\n\n* `A` 指 m×n 数组\n* `U` 指\
  \ m×n 正交数组\n* `S` 指 n×n 对角数组\n* `V` 指 n×n 正交数组\n\n独立成分分析 (ICA)：ICA 属于从混合信号中分离独立源的机器学习技术。ICA\
  \ 的目标是将多个信号分离为组件。在医学应用中，它生物医学信号处理研究起着至关重要的作用，例如心脏大脑信号。目标是将信号分离为子组件以识别不同信号源的活动。\n\
  \n### (iv) 关联规则\n\n这种无监督技术被认为探索大型数据库中变量之间的相互关系。关联规则挖掘并不适用于数值数据。它适用于支持非数值数据集，即分类数据。关联规则的应用：\n\
  \n* 一组多类癌症患者报告根据其基因反射测量值进行聚类。\n* 销售网点取决于频繁购买历史。\n* 变量根据电影观众给出的评分进行分组。\n\n## 1.4.3\
  \ 强化学习\n\n强化学习是一种设备获取算法。它还作为通过使用自身经验的自然动作发生的测试和故障来获取情况的因素。强化学习的目标是获得对最佳合格激活触发器的洞察，这将增加智能体的总累积认可度。\n\
  \n### (i) 遗传算法患者\n\n\n\n\n遗传算法是一种在解群（种群规模）上运行的随机搜索算法。每个解被称为一个个体（single）。每个个体结果都有一个染色体。基本上，染色体被描述为指定特定解的属性单元或一组基因。每一条染色体都有一组基因。每个基因在图\
  \ 1 中被描述为一系列的 0 和 1。遗传算法的处理过程在达到最佳解决方案之前速度较慢。\n\n### (ii) 状态–动作–奖励–状态–动作 (SARSA)\n\
  \nSARSA 算法是流行的 Q-learning 算法的一种变体。强化学习算法在学习智能体中的策略分为两种：\n\n1. 同策略（On policy）：这种策略指的是“学习智能体根据当前使用的策略的动作来学习价值函数”。\n\
  2. 离策略（Off policy）：离策略是指“学习智能体根据新策略的动作来学习价值函数”。\n\n### (iii) Q-learning\n\nQ 一词代表质量（quality）。Q-learning\
  \ 可以被认为是在评估采取动作所处状态的程度，而不是决定状态“S”的可持续时间。Q 表（Q-table）也被称为一种简单的查找表，其目的是计算每个状态下动作在未来的最大总奖励。初始值为\
  \ 0。这个 Q 表对于寻找每个状态下的最佳动作非常有用。它就像选择最佳动作的参考表。\n\n### (iv) DQN\n\nDQN 的扩展是深度 Q 网络（deep\
  \ Q-network）。DeepMind”的应用是最早的学习方法。许多游戏都受益于这项技术。DQN 的工作比人类更有效。例如，如果我们取一个游戏，DQN 的职责将是从原始图像自动学习如何读取分数、射击敌人和救援用户。\n\
  \n#### 1.4.4 集成学习 (Ensemble learning)\n\n集成学习的目的是通过结合各种预测模型来提高机器学习的结果，以减少方差，这种方法被称为\
  \ bagging。偏差称为提升（boosting），改进的预测称为堆叠（stacking）。\n\n#### Bagging, boosting 和 stacking\n\
  \nbagging 术语被称为自助抽样（bootstrap sampling）。减少方差的一种最好方法是在不同的数据子集上训练不同的树并计算集成模型，从而对回归进行平均。\n\
  \n* Bagging 用于控制方差值。\n* Boosting 用于减少偏差值。\n* Stacking 用于开发分类器的预测能力。大多数错误发生在模型学习的三个因素期间。这些因素是方差、噪声和偏差，集成方法利用它们提高最终模型的稳定性。\n\
  \n#### 1.4.5 神经网络和深度学习 ANN 和 CNN\n\n人工神经网络（ANN）能够学习非线性函数。激活函数是 ANN 非线性属性的触发点。这种激活函数有助于学习输入和输出数据之间复杂的关系。激活函数是\
  \ ANN 的骨干。它还可以用于解决各种类型的数据，例如表格数据集、图像数据集和文本数据集。卷积神经网络（CNN）模型用于多个领域，特别是在图像和视频处理领域。CNN\
  \ 的主要优势是它可以在没有任何显式指令的情况下自动学习滤波器。滤波器的主要工作是提取图像的相关特征。CNN 允许在分类阶段通过数据集准确识别物体。\n\n###\
  \ 1.5 宫癌及其类型概述\n\n宫癌是世界上一种高风险的疾病。在 21 到 65 岁之间，有近 28.8 万女性受宫癌影响。在 21 岁以下可能很少发生。它始于女性的宫颈，即子宫的下部。它主要影响宫颈表面。如果发现宫颈部分有任何异常症状，患者可以咨询医生了解原因。每个女性都应该进行筛查程序。Pap（宫颈涂片）和\
  \ HPV（人乳头病毒）被推荐为女性识别宫颈状态的筛查测试。初始测试称为 Pap 测试。在识别出异常细胞后，可以进一步进行另一种测试，称为 HPV 测试。收集的组织样本将送往病理实验室，用显微镜检测细胞。在确认细胞阶段为异常组织后，它可能被归为六类癌症。每个细胞都是细胞和细胞质的结合。根据大小、形状和结构，我们可以确定癌细胞的类型。评估各种统计特征以寻找癌症分。在本章中，从正常和缺陷细胞的样本宫颈涂片图像中提取了十七个特征。正常细胞可分为三类：浅层鳞、、中层鳞、柱状上皮细胞以及不规则细胞、轻度不典型、重度不典型以及原位癌。病理学家根据其类型确定癌症分。使用统计函数和几何函数提取数值特征。所有特征都用于带有连续数据序列的机器学习算法。多种机器学习算法用于通过预测分析发现晚期宫癌。\n\
  \n## 2 文献综述\n\n\n\n\n作者确定监督学习技术具有良好的性能，并可以应用于股票领域来预测业务任务。对比并分析了机器学习算法[1]：作者的章节侧重于使用机器学习算法的大数据分析[2]。在本文，作者建立了一个基于变量线性回归的合适树，用于评估预测算法的性能。该方法对于从真实环境中获得的数值型和分类数据效果良好[3]。新的人工智能系统能够灵活地感知和识别各种疾病。执行的行动计划：相关的健康检查表示过程和连接组件数据有助于医生在分类疾病时做出正确的决策。AI\
  \ 方法论可以改进决策过程，并降低错误预测率[4]。中国作者李国正（Guo-Zheng Li）提到了中医药（TCM）数据分析查询的现状，在系统获取领域使用最新的特征选择、多分类和多标签算法来应对挑战。因此，他专注于引入判别性指示变异和多综合征学习，这些被用于提高研究工作的性能[5]。本文旨在考虑目前的猪流感医学诊断系统，并将其用于数据挖掘和神经网络。实施阶段提取了猪流感的\
  \ 12 个特征，并在神经网络中执行，同时在 SVM 和朴素贝叶斯分类器中执行[6]。电子健康数据可能存在一些质量问题，如缺失值、分类错误和空值。机器学习可能帮助回答基于研究的问题。集成算法运行集体算法，它们采用最佳算法来预测疾病并更新��妄风险预测[7]。该章节讨论了机器学习的改进、监督和无监督线性方法的性能，以及生物医学诊断领域贝叶斯推断的工作。它们被应用于生物医学疾病感知和识别的每一个应用中[8]。该章节的主要工作是关注血液测试期间的血液疾病预测。作者利用样本血检报告探索了几个分类器，并在分类中获得了\
  \ 98.16%的准确率。作者还提到，未来需要在结合 IoT 方法论的深度学习技术[9]。作者最后建议使用机器学习算法来增加神经退行性疾病的分类百分比。在他们的研究中，他们使用了公共数据集的步态生物标志物并执行了\
  \ ANN（人工神经网络）[10]。在本章节中，主要内容是大数据领域下机器学习决策树使用的监督和无监督医学数据。与许多算法相比，作者在基于 CNN 的单峰疾病风险预测中获得了\
  \ 94.8%的准确率[11]。作者 Paul Sajda 提到了使用 SVM、CNN、PNN、NN、ANN 等用于癌症预测的生物医学图像统计数据集——乳腺癌乳靶检查[12]。该作者开发了一种理论，利用逻辑回归、朴素贝叶斯、KNN、K-means\
  \ 聚类和反向传播等机器学习概念来预测心脏病。他证明反向传播比其他算法实现了 98.2%的最佳结果[13]。本文是关于大数据分析中机器学习算法的综述[14]。作者通过应用带有性能衡量的各种机器学习算法预测不同类型的疾病[15]。文章分析了生物医学应用领域的\
  \ AI 方法论，并清楚地声明了 AI 在不同方面的效率[16]。该章节是医疗保健领域机器学习算法的综述。它还专注于使用 ML 预测宫颈癌——通过 145 名患者的数据库执行，并得出决策树算法提供了更好的预测[17,\
