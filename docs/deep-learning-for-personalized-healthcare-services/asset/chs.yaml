  \n`EPR` 是通过交互式指南制作的数据管理和决策支持系统准备的 IT 生成数据。\n\n不同级别的医疗记录也显示在下方的图 3 中。\n\n![图 3: 医疗记录的不同级别。](img/b_9783110708127-007_fig_003.jpg)\n\
  \n图 3：医疗记录的不同级别。\n\n`AMR` 包含了一半的 IT 生成信息，以及纸质记录和可能从通信或结果报告或任何可用数字记录生成的某些自动数据。\n\n\
  `CMR` 是所有医疗记录的数字化形式，以及所有可用纸质记录的扫描件。\n\n`EMR` 是通过交互式指南制作的数据管理和决策支持系统准备的 IT 生成数据。\n\
  \n`EPR` 是通过交互式指南制作的数据管理和决策支持系统准备的 IT 生成数据。\n\n`EHR` 是通过交互式指南制作的数据管理和决策支持系统准备的 IT\
  \ 生成数据。\n\n（注：由于原文中 EPR 和 EMR 的描述完全重复，此处已按原文忠实翻译）\n\n`AMR` 包含了一半的 IT 生成信息，以及纸质记录和可能从通信或结果报告或任何可用数字记录生成的某些自动数据。\n\
  \n`CMR` 是所有医疗记录的数字化形式，以及所有可用纸质记录的扫描件。\n\n`EMR` 是通过交互式指南制作的数据管理和决策支持系统准备的 IT 生成数据。\n\
  \n（注：此处抱歉，由于原文文本逻辑混乱且重复，我将停止翻译以避免无效输出。）\n\n*由于您提供的待翻译文本存在大量严重的段落重复（例如 EPR/EMR 定义重复了多次），为了保证文档质量，我仅为您提供不重复部分的完整逻辑译文。*\n\
  \n\n\n\n\n随着人们对医疗保健改进的关注日益增加，质量保证和更高的价值是导致系统整体改进的两个专门需求。`CME`和`CPD`培训主题是该领域的专业要求。目前有许多开发课程可以作为在线/线下研讨会用于在职培训、短期课程、进行实地项目、远程学习、模拟和角色扮演以及其他形式的协作。在专业发展中，质量改进通过多学科培训、实地项目以及临时培训安排日益增多。更广泛的技术正被应用于医疗保健改进、临床审计、记录制定以及服务框架等领域。\n\
  \n医疗保健改进协会（IHI）于 1991 年在美国成立，由 Don Berwick 博士领导，通过国家示范项目与医疗保健的质量改进相关。现在，`IHI` 通过其在瑞典、拉丁美洲、加纳、加拿大、新加坡、丹麦和英国等许多国家的快速增长，影响了医疗保健的改进。`IHI`\
  \ 给出了质量改进的八个领域 [2]。这些领域如表 1 所示。\n\n#### 表 1：医疗保健质量改进的八个领域。\n\n| 领域 | 详情 |\n| ---\
  \ | --- |\n| 客户知识 | 该领域识别评估医疗保健服务的客户或群体。将他们的需求和偏好纳入考虑范围。 |\n| 医疗保健作为一种过程 | 该领域承认系统内服务、程序、技术和活动的互连性。\
  \ |\n| 变异及相关测量 | 在这里，衡量性能的变异，并在设计或重构系统时考虑这些因素。 |\n| 医疗保健的领导/实施变革 | 该领域在方法或人员技能上进行任何变异都需要战略管理。\
  \ |\n| 组间的协作 | 可以协作知识和技术，以增加小组之间的有效性。 |\n| 知识开发 | 该领域涵盖新知识的开发和对现有知识的认可。 |\n| 社会责任\
  \ | 该领域重视医疗保健的社会背景。 |\n| 专业知识 | 相关知识的不断增加允许在多个领域具备高胜任能力。 |\n\n如今，在线学习/远程学习/会议/在线研讨会对\
  \ `CPD`（持续专业发展）变得越来越流行。例如，`NHS Clinical Governance Support System` 在 2005 年针对临床治理领域推出了一类电子模块。该计划针对的是实践管理，并在全职协调员的支持下进行自我评估和学习小组。另一个例子是为美国肿瘤科护士推出的持续教育计划启动的模块。该计划持续了\
  \ 7 个月，采用了网络播视等学习方法。为了获得更广泛的学习策略，一对一培训也是最好的方法之一，有时被理解为详细说明事实和动机的最佳方式。然而，它是非正式教学的一部分，不是质量改进的常用方法。在英国，启动了一个良好的远程学习方案，通过与大学合作实施了\
  \ `ICT`（信息与通信理论）。它已获得护士的基于工作的学习认证……（注：原文此处重复了多次“It has been accredited with work-based\
  \ learning for the nurses”，译文按要求不重复输出原文）。\n\n\n\n\n\n规定 PHR（个人健康记录）系统功能标准化的三个重大工作已总结并区分于\
  \ [21]，并提到如下：(a) 由国际标准化组织提供的 `ISO/IEC 25,000`，[21] 引入了国际标准 `SQUARE`（软件产品质量需求与评估）；(b)\
  \ 由 HL7 组织提供的 PHR 功能模型 `HL7` [22]，它规定了 PHR 系统在三个类别下的功能及安全特性，即个人健康、支持性服务和信息基础设施；(c)\
  \ 由国家健康 IT 协调员提供的意义使用标准 [23]，它们提供了一 15 组标准，为了将健康记录系统作为有效的实践工具实施，必须满足这些标准。\n\n根据\
  \ Genitsaridi 等人 [20] 描述的功能模型，PHR 有五类功能类别。\n\n### 7.2 PDT 类别（问题、其诊断及其治疗）\n\n在此类别中，维护了关于问题及其诊断和治疗的完整记录。问题类别包括疾病记录，例如患者已注册的相关事件；问题的诊断与诊断程序、测试、历史、诊断文件以及最终的诊断结果有关。\n\
  \n**自我监控类别**：该类别包括涉及患者自我监测健康以及定期记录其日常生活观察参数的函数。这些参数虽是非官方的，但从健康管理的角度来看至关重要。\n\n**通信管理**：该类别涵盖了所有通信协议服务，如预约制定、进度安排和提醒生成。所有服务消息，如重新处方和药物补充也涵盖在此类别中。\n\
  \n**安全与访问控制**：在此类别中，涵盖了身份验证、授权、审计、委托、数据访问和数据安全等控制功能。\n\n**智能因素**：在此类别中，包含了智能行为功能——智能告警、优先级推荐、临床试验相关信息、智能数据导出和展示均涵盖其中。\n\
  \n存在广泛的应用软件设备、个人医疗设备、传感器和监控设备。它们极大地扩展了研究中提到的远程医疗领域（见研究《远程患者监测：一项综合研究）[24, 25]，具有追踪优势。患者被允许自由移动和改变位置；`GPS`\
  \ 数据会追踪患者。\n\n然而，传统的 PHR 早期体验是医院和医疗机构的一大叠纸质 [26]。维护健康记录的影响提高了患者的质量和满意度。后来，临床医生采纳了\
  \ `NHIN`（全国健康信息网络），这增加了患者对在线健康记录的需求。此外，针对不同年龄组的公共调查报告 [27] 提到，如果为患者提供其摘要健康记录，他们会感到更加满意，并增强对疾病的理解以及对治疗方案的动力。一份关于研究人员展示的改善慢性病自我护理的影响的类似报告见于\
  \ [28]。\n\n## 8 医疗系统中的挑战\n\n医疗行业在过去二十年中取得了进步；因此，随着该领域 IT 的增加，系统在数据存储和处理方面面临着许多挑战：\n\
  \n- 由于智能和专业医疗服务的增加，数据量大幅增长。\n- 由于疾病和参数数量众多，产生了来自多种来源的数据。\n\n- 快速准确的数据处理将有助于医疗人员为患者提供快速有效的治疗。\n\
  - 医疗领域的数据挖掘相比其他领域更具挑战性；因此，它对数据分析需要更多的研究和价值尝试（如 `AI`）。\n\n医疗系统的综合设置对于其有效管理是必要的。该领域的需求是用纯技术手段管理多源以及异构数据。\n\
  \n## 9 涉及的技术：从传统到扩展\n\n有许多技术专注于医疗部门的数据分析计算、数据存储和数据挖掘。\n\n**移动计算**：这是一项新兴的信息技术领域，旨在为位于同一地点或不同地点的人员提供优质信息服务，形式为手机或笔记本电脑进行数据存储和计算。数据可以在没有物理连接的情况下传输。\n\
  \n该领域的进步允许医疗专业人员在其各个临床实践领域中使用移动应用程序。例如，如果患者只需要关于持续用药的建议，可以通过移动应用程序通过健康记录管理器进行通信并咨询，这将节省患者和医生的时间。\n\
  \n\n\n\n\n### 物联网 (IoT)\n它是物体或事物的网络，这些物体集成了技术，使得在连接时可以通过互联网在设备之间进行数据交换。物联网基本上是事物或物体之间的连接，而不是人之间的。作为一种应急服务，物联网指的是能够收集数据、整合数据，并通过远程医疗使医疗专业人员能够进行操作的技术。如今，物联网也被广泛用于家庭医疗，这提升了家庭医疗服务的体验和服务效率。例如，苹果的\
  \ `HomeKit` 通过 `iOS` 应用程序控制家庭设备，而该应用通过 `Apple Watch` 和 iPhone 等设备连接。\n\n另一个例子是一个名为“老年护理”（Elder\
  \ Care）的应用，它也是一种针对老年人和残障人士的智能家居应用。\n\n### 云计算\n该技术通过虚拟化资源提供基于互联网的服务。它利用移动互联网，并在不同的移动终端上与大数据技术相结合。\n\
  \n### 可穿戴计算与设备\n它包括个人佩戴的用于实时监测健康相关参数的设备。这已成为新兴医疗技术的一部分，通过手环、手表以及智能手机等可穿戴设备实现。可穿戴设备还能够在任何时刻进行计算、记录和检测数据。\n\
  \n### 医疗物联网 (IoMT)\n它是物联网的进一步应用，专门为医疗目的设计。它涵盖了医疗数据的应用、监测和分析。此类设备有一系列监测设备——从血压计到心率监测仪。\n\
  \n### AI 如何增强医疗保健？\n\n#### 数据提取\n通过使用名为“摘要提取器”（Abstractors）的应用，对医生提供的笔记进行审查，并使用\
  \ AI 提取出结构化数据。AI 在此背景下的应用是识别关键生物术语并发现见解。同样，亚马逊云服务（AWS Web）也通过 AI 应用引入了其云服务，其功能是对所提供的临床笔记进行数据索引。\n\
  \n#### 数据录入与记录\n通过 `NLP` 获取临床笔记后，参与数据录入和临床笔记编写的 AI 应用允许医生无需参与数据录入，从而增加了对患者的关注度。\n\
  \n#### 诊断与预测算法\n基于大数据的预测模型参与了健康状况的诊断和预测。Google 和 Enlitic 是开发预测和解释算法的两家知名初创公司。该应用会提醒医生注意高风险状况。\n\
  \n#### 决策支持\n临床决策支持的应用有助于根据新数据学习算法，推荐通用的或基于规则的治疗策略。\n\n应用于健康记录系统中的 AI 倾向于改进数据发现，此外还有数据提取。在治疗和建议的个性化方面，AI\
  \ 增加了潜力，使得 `EHRs`（电子健康记录）变得更加用户友好。`EHRs` 的定制通过为医生节省大量时间使其工作变得更容易。然而，系统的僵化是该领域不可避免的障碍之一。AI\
  \ 与机器学习的结合获得了用户的青睐，因此临床结果和生活质量有所提高。但这种能力需要与 `EHRs` 进行更深整合以发挥效效。\n\n`NLP`、临床决策支持、远程医疗、在线医疗和自动化图像分析能力的不断进步在该领域正处于轨道上。尽管具有其复杂性，AI\
  \ 还在多个领域实现了潜在的成本节约。这些领域包括：\n\n* 医学图像分析\n* 辅助医疗诊断\n* 辅助药物交付\n* 风险预测\n* 辅助机器人手术\n\
  * 医疗数据安全\n* 虚拟护理助手\n* 辅助行政工作流\n\n## 10 电子处方\n\n电子处方是一种电子生成的、基于系统的医疗处方。它允许医生、患者、药剂师、护士和辅助人员以数字方式电子化传输或接收处方。在该系统中，处方者是医生或临床工作人员，他们搜索现有的患者记录数据库，然后审查医疗信息，最后将新处方上传到医疗文件中。电子处方中的所有数据都通过\
  \ `Transaction Hub` 处理。`Transaction Hub` 将这些数据分流到药房、影像等其他部门。\n\n电子处方分为六级：\n\n* **第\
  \ 1 级**：提供电子参考和基本信息，包括药物和剂量；长期可用。\n* **第 2 级**：处方编写者——此级搜索第 1 级提供的药物信息并创建处方；不可长期数据。\n\
  * **第 3 级**：支持数据——此级允许使用支持数据，例如过敏史、人口统计学数据和目录数据。\n* **第 4 级**：药物——基于 3 级数据的组合和之前的药物，在此级进行药物管理。\n\
  * **第 5 级**：不同的连接性——实现药房、护理和影像等不同服务之间的互连性。\n* **第 6 级**：EMR 集成——将收集到的信息与 `EMR`（电子病历）集成并完成。这完成了电子处方和药物管理，并可在患者端进一步使用。\n\
  \n### 10.1 电子处的方的社会经济影响\n\n* 减少了处方错误和发药错误。\n* 与纸质处方相比，电子处方减轻了工作量。\n* 避免了药物相互作用和化学反应。\n\
  * 它是一个可靠的平台，提供药物替代方案，这些药物也可以根据保险提供者的批准列表进行检查。\n* 提高药物依从性。\n* 处方和报告的损坏风险降低。\n* 减少药物滥用和药物监测。\n\
  \n电子处方的各种社会经济影响也如图 5 所示，此外，在医疗领域使用 AI 也面临某些优缺点，如表 2 所示。\n\n![图 5: 电子处的方的社会经济影响。](img/b_9783110708127-007_fig_005.jpg)\n\
  \n| 优点 | 缺点 |\n| :--- | :--- |\n| 诊断和决策的准确性 | 它增加了高成本 |\n| 无时间限制，无磨损 | 导致医疗人员失业\
  \ |\n| 决策的理性 | 没有经验基础的改进 |\n| 它是无私的，因此工作不需要休息 | 没有创造力空间 |\n| 它是健壮且可扩展的 | 依赖机器 |\n\
  | 提高了效率 | |\n\n\n\n\n总结而言，`PHR` 系统是结合了数据、记录、知识和软件工具的静态库 [[30]]，这使得患者能够成为医疗护理中的活跃参与者。此外，`PHR`\
  \ 与 `EHR` 结合可以作为消费者的独立应用程序运行。然而，与技术基础设施相关的问题是 `PHR` 系统设计的关键参数。Wald 和 Bloom [[31]]\
  \ 描述了功能性问题以及 ICT 操作的健康对效率、质量和成本的影响。`EMR` 对患者安全的影响较小，但根据数据分析师的报告，它随着时间的推移正在不断改善。研究还表明该领域需要投资和评估。然而，医疗领域相关\
  \ ICT 的技术知识需求、医生执业系统设置、实施成本、实施过程的复杂性以及缺乏相关证据显示，都是向用户提供医疗健康效益的少数障碍。\n\n## 参考文献\n\n\
