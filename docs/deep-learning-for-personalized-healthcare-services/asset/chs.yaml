  \n## 1.8 健康生活的组织图和不同参数\n\n组织图在疾病治疗中起着重要作用。当对患者进行针灸和按压时，这种起伏循环会有很大帮助（参见图 5）。人们出生的月份也是如此——这被称为昼夜节律/生物钟。如果我们根据上升周期时间进行治疗，治愈几率是否会增加？通常，专家建议在固定时间进行`Yajna`（火祭），他们会选取一两个案例尝试这种方法。当作者团队接手病例时，他们的首要调整是改变生活方式，然后是积极的态度，接着是理解`Yagyopathy`（火祭法）的哲学（如何、为什么以及何时）。然后，建议适当的饮食，必要时建议饮食补充剂。这是一个循环过程，最初是改变生活方式。应该根据昼夜节律和`Omkara`（唵姆）冥想建议时间。在穆斯林信仰中，建议进行`Bhramari`（呼吸练习），以便有更高的概率恢复正常[10,\
  \ 11]。\n\n## 2 文献综述\n\n为了回答科学在印度传统中是如何的，可以使用逻辑、影响和科学推导来阐述并从科学角度证明。这些与印度传统相关的科学论点如下：\n\
  \n1. **同姓特拉（Gotra）不结婚：** 在探索频道一个关于遗传疾病的资讯性节目中，一位美国科学家表示，遗传疾病——基因分离是没有治愈的。同一特拉的人不应该结婚，因为基因没有从近亲中分离出来，有\
  \ 100%的概率患上基因相关疾病，如血友病、色盲和白皮症。因此，印度教在数千年前是如何描述基因和 DNA 的，这现在已经得到了充分证明（Rastogi, R.\
  \ et al., 2018a and 2018b）[12]。印度哲学中总共有七个特拉，同一特拉的人不能结婚，以保持他们的基因相互分离（分裂）。上述文章的科学家说，现在全世界都必须相信，印度教是世界上唯一基于科学的宗教！\n\
  \n2. **顶礼长辈的脚：** 根据印度教信仰，每当你遇到长辈时，都必须触碰他们的脚。我们也教孩子这样做，让他们尊重长辈。此举的科学原理是，大脑释放的能量通过手脚完成一个循环。这被称为宇宙能量的流动。能量流动有两种模式，要么从长辈的脚到年轻者的手，要么从年轻者的手到长辈的脚。\n\
  \n3. **在印度教寺庙的 Aarti（祭礼）和祈祷期间击掌：** 在任何印度教寺庙，可以看到一些人在 Aarti 期间击掌，然后其他人加入击掌。科学解释是，击掌时右手的四个手指以强压力按在左手掌上，使压力完全且声音悦耳；这种击掌可以改善左掌的肺、肝和胆囊。同时，右手手指的压力穴会抑制肾脏、小肠、大肠和鼻窦。这会导致流向这些器官的血液加速。这种击掌应该一直持续到手掌变红。\n\
  \n伟大的古印度生活方式及其科学意义：在新冠肺炎 19 大流行期间，世界本可以选择`Adaab`（礼节），但为什么他们选择了“Namaste”（合十）呢？这是因为“Adaab”只用一只手，而另一只手也可以拿着匕首。相反，“Namaste”双手合在前；所以没有欺诈。这是一种哲学方法。印度文化的每种传统都有科学和精神上的基础。\n\
  \n## 3 实验设置与方法论\n\n为了支持`Yajna`和`mantra`（真咒）科学的实验，是为了测试由华盛顿大学虚拟现实镇痛先驱亨特·霍夫曼开发的游戏的有效性。西雅图华盛顿大学哈港湾医疗中心的骨科创伤外科医生扎·菲罗兹阿巴迪（Reza\
  \ Firoozabadi）正在测试该游戏的有效性。\n\n### 3.1 方案\n\n支持`Yajna`和`mantra`科学的实验，是为了测试由华盛顿大学虚拟现实镇痛先驱亨特·霍夫曼开发的游戏的有效性。西雅图华盛顿大学哈港湾医疗中心的骨科创伤外科医生扎·菲罗兹阿巴迪正在测试该游戏的有效性。\n\
  \n`45`分钟的课程包括一些`Asans`（坐式、站姿、仰卧）和一些`pranayam`（呼吸法）。支持`Yajna`和`mantra`科学的实验，是为了测试由华盛顿大学虚拟现实镇痛先驱亨特·霍夫曼开发的游戏的有效性。西雅图华盛顿大学哈港湾医疗中心的骨科创伤外科医生扎·菲罗兹阿巴迪正在测试该游戏的有效性。\n\
  \n### 3.2 使用的手印（Mudras）\n\n每天使用`Surya Mudra`、`Pran Mudra`、`Apan Mudra`和`Gyan Mudra`，每个持续`5`分钟。`Surya\
  \ Mudra`赋予知识、名声和声誉；`Pran Mudra`增加活力；`Apan Mudra`有助于排出多余的空气和废物；`Gyan Mudra`有助于集中注意力并获取知识（参见图\
  \ 6）。\n\n\n\n\n\n图 9：用于减重的太阳性手印（Surya Mudra）。\n\n图 10 和图 11 反映了雅格（Yagya）和瑜伽（Yoga）过程；它们有助于质量调节。\n\
