  \ 状态 ANN 输出——准确率为 78%。\n\n## 5 结论\n\n医疗分析具有降低治疗成本、预测疾病阶段、预防疾病发生以及通过分析经验数据来拯救生命的能力。机器学习和人工智能算法被频繁应用于各种领域，特别是在医疗领域用于预测疾病状态。在本章中，我们应用了一些监督和无监督机器学习技术，对病理学图像进行多类宫颈癌的分类预测。主要目的是分析预测模型并利用机器学习算法探索分类器的准确水平。宫颈癌数据集是从病理学家通常使用的宫颈涂片图像压缩而来的。\n\
