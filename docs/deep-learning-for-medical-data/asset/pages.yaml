- pgno: 38
  md: '# 3


    # PCAM


    There exists a barrier-to-entry for machine learning researchers to evaluate their
    methods on large medical datasets. This is especially the case for histopath-ology,
    where large datasets such as CamelyonEhteshamami Bejnordi et al., 2017 require
    developing intricate dataloders, that take care of balancing different types of
    tissue, and can efficiently work with the terabytes of data available. With the
    hopes that we will make a little easier for researchers looking to work with histopathology
    data, we are launching a dataset derived from Came-lyon: PatchCamelyon (PCAM).
    It was developed with input from pathologists and experts on deep learning for
    histopathology.


    PCAM is now available at github.com/baseling/pcam, and is just straight forward
    to work with CIFAR10 or MNIST.


    The PatchCamelyon benchmark is a new and challenging image classifica-tion dataset.
    It consists of 327,680 color images (96 x 96px) extracted from histopathic scans
    of lymph node sections. Each image is annotated with a binary label indicating
    presence of metastatic tissue. PCAM provides a new benchmark for machine learning
    models: bigger than CIFAR10, smaller than imagenet, trainable on a single GPU.


    # 3.0.1 Why PCAM


    Fundamental machine learning advancements are predominantly evaluated on straight-forward
    natural-image classification datasets. Think MNIST, CIFAR, SVHN. Medical imaging
    is becoming one of the major applications of ML and we believe it deserves a spot
    on the list of go-to ML datasets. Both to challenge future work, and to steer
    developments into directions that are beneficial for this domain.'
  merge: -1
  img_proc: true
- pgno: 39
  md: We think PCam can play a role in this. It packs the clinically-relevant task
    of metastasis detection into a straight-forward binary image classification task,
    akin to CIFAR-10 and MNIST. Models can easily be trained on a single GPU in a
    couple hours, and achieve competitive scores in the Camelyon16 tasks of tumor
    detection and WSI diagnosis. Furthermore, the balance between task-difficulty
    and tractability makes it a prime suspect for fundamental machine learning research
    on topics as active learning, model uncertainty and explainability.
