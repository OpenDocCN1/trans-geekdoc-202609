    \ parameterized mathematical function that accepts samples in the data space and\
    \ transforms it into the label space: $f : \\mathbb{R}_x \rightarrow \\mathbb{R}_y$.\
    \ Typically, this function is of a form of alternating linear transformations\
    \ followed by scalar non-linearity's (or activation functions): $f_\theta(\\chi)\
    \ = W^3l(W^2h(W^1x))$. This function is what is referred to as the neural network,\
    \ as it is loosely imposed by the layers of connected neurons found in the brain.\
    \ The parameters or weights $\theta : \\{W^l\\}$ are the knobs that we tune to\
    \ find the optimal model.\n\n# 1.4.3 Optimization\n\nWe optimizing the parameters\
    \ of $f$ by alternately estimating the error that the model makes on the training\
    \ data, and making small changes to the parameters to reduce this error using\
    \ the derivative. This is the essence of Gradient Descent, and works as follows.\
    \ We define a scalar error function (often called the $loss$) on the network $\\\
    mathcal{L} : \\{X, Y, W\\} \rightarrow \\mathbb{R}$. To improve the model, we\
    \ compute the derivative $\nabla\\ L = \\frac{d}{dW_{i,j}^l}\\mathcal{L}$ for\
    \ each parameter. We then make a small step in the direction of steepest descent\
    \ by updating each parameter:\n\n```\n$W_{i,j}^l = W_{i,j}^l - \\eta\\nabla_{W_{i,j}^l}\\\
    mathcal{L}$\n```\n\nwhere the step-size, or learning rate, is $\\eta$. We apply\
    \ this algorithm by drawing small mini-random subsets from the training data,\
    \ called mini-batches. This has been shown to improve the generalization and reduces\
    \ the computational cost. We refer to this stepwise optimization as Stochastic\
    \ Gradient Descent (SGD), in contrast to Gradient Descent, which uses the full\
    \ training datasets to compute the true gradient."
