    EXPERIMENTAL DETAILS We focus on the STL-1 dataset (Coates et al., 2011) which
    provides an additional unlabeled training dataset. For data augmentation, we take
    random $64 \times 64$ crops from the $96 \times 96$ images, flip horizontally
    with probability 0.5 and convert to grayscale. We divide each image of $64 \times
    64$ pixels into $7 \times 7$ local patches, each of size $16 \times 18$ pixels
    overlap. The patches are encoded by a ResNet-50 v2 model (He et al., 2016b) without
    batch normalization (Hoff and Szedy, 2015b). We split the model into three gradient-isolated
    modules that we train in sync with a constant learning rate. After convergence,
    a linear classifier is trained–without finetuning the representations–using a
    conventional softmax activation and cross-entropy loss. This linear classifier
    accepts the path representations $z_{ij}^M$ from the final module and first average-pools,
    resulting in a single vector representation $z^M$. Remaining implementation details
