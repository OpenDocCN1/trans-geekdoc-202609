    # Effect of different contrastive sample sources


    There are large variations in the appearance of histopathology slides captured
    across different labs. Each lab has varying protocols with regards to the quality
    of staining applied to the slides, and each slide digitizer brand comes with unique
    artifacts and measurement noise. Even between slides from the same lab, distribution
    shifts can occur. We explore if we can steer CPC towards more domain-robust features
    by drawing contrastive samples only from the same WSL. We hypothesize that in
    this scenario, it''s more cost effective for CPC to extract features that are
    useful across domains, as features that discriminate one from another do not provide
    any value. In Table 4.1 we compare C(2)PC performs on both scenarios (Same WSL
    indicating sampling contrastive samples solely inside the MSI). We find that contrasting
    only with patches from the same WSL slightly increases performance.


    # C2PC versus CPC


    C2PC enjoys a strong performance boost over CPC, which we attribute to the hypothesized
    noise and expert-knowledge based perturbation robustness. Test set performance
    on C2PC surprisingly increases slightly on the smaller label regimes. This can
    be explained as follows: The validation set of PCam is much closer to the training
    set, and its performance drops slightly as expected in the smaller label regimes.
    With fewer labels, the model overfits the training labels more quickly. As a result,
    the early-stopping method selects weights that end up more favorable for the test
    set domain.


    # Feature visualization


    In Figure 4.1 we visualize the 8 most predictive features extracted from a large
    input image spanning multiple patches. We find that CPC-based features appear
    much smoother than those learned in a fully supervised manner. This hints at the
    features being useful for other forms of tissue classification tasks as well.'
