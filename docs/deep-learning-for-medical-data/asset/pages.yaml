    Methods that enable equivariance under rotations and other transformations include
    Harmonic Networks (Worrall et al., 2017), which constrain the set of filters to
    circular harmonics, allowing for full 360°-equivariance. Weiler et al. (2017)
    employs steerable filters and evenly samples a small number of rotations. In this
    work, we focus on the straight-forward G-CNN method from Cohen and Welling (2016)
    applied on discrete rotation/reflection groups. These groups do not cover the
    full continuous rotational symmetry inherent in WSIs, the empirical evidence gathered
    so far shows that 90° rotation equivariance improves performance significantly
    (Weiler et al., 2017).


    # 2.2 METHODS


    # 2.2.1 Background


    In the mathematical model of CNNs and G-CNNs introduced in Cohen and Welling (2016),
    input images and output segmentation masks are considered to be functions $f:
    Z^2 \rightarrow R^K$, where $K$ denotes the number of channels, and $f$ is implicitly
    assumed to be zero outside some rectangular domain. A standard convolution*2 of
    an input $f$ with filter $\psi$ is defined as:


    ```

    $[f * \psi](x) = \sum_{y \in Z^2} \sum_{k=1}^{K} f_k(y)\psi_k(x-y). \quad (2.1)$

    ```


    G-CNNs are a generalization of CNNs that are equivariant under more general symmetry
    groups, such as the group $G = p4$ of 90° rotations, or $G = p4m$ which additionally
    includes reflection. In a G-CNN, the feature maps are thought of as functions
    on this group. For $p4$ and $p4m$, this simply means that feature channels come
    in groups of 4 or 8, corresponding to the 4 pure


