    | p(·) | Distributions (probability density functions) |

    | q(·) | Often used for variational approximative distributions |


    # 1.4 BASICS OF DEEP LEARNING


    Deep Learning refers to the modern practice of machine learning using stacked
    function approximators and the optimization of those using stochastic gradient
    descent. The term captures both the techniques as well as a broad spectrum of
    best practices surrounding the design, optimization and approach of machine learning.
    In the following parts we will briefly discuss the basic principles and practice
    of deep learning, which the expert reader can safely skip. The relevant background
    specific to each research question will be discussed in the following chapters.


    # 1.4.1 Data


    We start with considering the data. Ideally, we have gathered a large dataset
    of independently sampled, identically distributed (i.i.d) data points x. We might
