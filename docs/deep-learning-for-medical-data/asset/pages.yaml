    Recent work (Oord et al., 2018b; Hjelm et al., 2019) proposed how we can exploit
    this to learn representations that maximize the mutual information among shared
    neighbors. In this work, we specifically focus on Contrastive Predictive Coding
    (CPC) (Oord et al., 2018b). This self-supervised end-to-end learning approach
    extracts representations from sequential inputs by maximizing the mutual information
    between the extracted representations of temporally near patches.


    In order to achieve this, CPC first processes the sequential input signal $x$
    using a deep encoding model $g_{enc}(x_t) = z_t$, and additionally produces a
    representation $c_t$ that aggregates the information of all patches up to time-step
