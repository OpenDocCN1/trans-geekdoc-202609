    # 4.2 CONTRASTIVE PREIVE CODING


    Contrastive Predictive Coding (CPC) is a deep learning technique that provides
    universal unsupervised feature extraction, recently proposed by Oord et al. (2018a).
    It builds on fundamental work in areas of noise contrastive estimation and slow
    feature analysis Wiskott and Sejnowski, 2002. It has been shown to be effective
    across a variety of domains including image classification, speaker'
  merge: -1
  img_proc: true
- pgno: 46
  md: "and phone classification as well as reinforcement learning. CPC builds on the\
    \ notion that in time series, natural images and videos interesting features that\
    \ change slowly over time and space: so-called slow features. It differs from\
    \ nonlinear ICA methods in that feature vectors are compared jointly, rather than\
    \ per feature, which removes the need for the model to learn conditionally independent\
    \ features. Furthermore, it increases the difficulty of the task by performing\
    \ detection of the consecutive patch among K-1 non-consecutive patches, rather\
    \ than binary classification of pairs of patches being consecutive or not.\n\n\
    Imagine small patches from larger input data: two consecutive patches usually\
    \ share a large part of the information that is relevant to a downstream model.\
    \ CPC exploits this as follows: starting with a patch of interest, a consecutive\
    \ patch is put in a bag together with random patches from the dataset. A contrastive\
    \ classification model compares the patch of interest with each of the patches\
    \ in the bag, using a shared feature extraction model for the patches. An incur\
    \ occurs when it fails to predict which patch in the bag is the consecutive one.\
    \ This loss is then optimized using conventional stochastic gradient descent methods,\
    \ training both the feature extraction model and the contrastive classification\
    \ model in unison. This forces the feature extraction model to extract features\
    \ that distinguish consecutive patches and prevents it from learning trivial features\
    \ that do not provide information about the patches, such as local nuisance factors\
    \ and noise. The feature\n\nA major downside of CPC is that the feature model\
    \ will latch on any form of non-stationary signal that allows the contrastive\
    \ model to efficiently detect neighboring patches. If the data contains non-stationary\
    \ artifacts, such as chromatic aberration in a camera lens (which leaves a clear\
    \ position signature in photos), the feature model might learn to encode these,\
    \ rather than more insightful features. We propose a solution to this issue in\
    \ the following section.\n\nAt the base of CPC lies a typical deterministic feature\
    \ extraction model $z = e(\\cdot)$, e.g. a convolutional neural network with parameters\
    \ $\theta$, encoding input patches $x_t$ at timestep $t$ into feature vectors\
    \ $z_t: z_t = e_\theta(x_t)$. A simple loginear model compares pairs of feature\
    \ vectors and scores how likely these"
  merge: -1
  img_proc: true
- pgno: 47
  md: 'features come from a pair of consecutive patches versus a pair of randomly
    selected patches:


    ```

    $f_W(\mathbf{z}_a, \mathbf{z}_b) = \exp\left(\mathbf{z}_a^T\mathbf{W}\mathbf{z}_b\right)
    \quad (4.1)$

    ```


    We call this the contrastive model. The contrastive model is trained by taking
    one patch''s features $\mathbf{z}_i$ and a bag $\mathcal{X}$ filled with the consecutive
    patch features $\mathbf{z}_i$ as well as randomly selected patch features drawn
    from the training dataset. The contrastive model $f_W(\cdot)$ and feature model
    $e_{\theta}(\cdot)$ are jointly trained to solve the classification task of selecting
    the correct contrastive patch from the bag, minimizing this loss:


    ```

    $\mathcal{L} = -\log \frac{f(\mathbf{z}_l, \mathbf{z}_{l+1})}{\sum_{\\mathbf{z}_i
    \in \mathcal{X}} f(\mathbf{z}_l, \mathbf{z}_i)} \quad (4.2)$

    ```


    Which can be minimized using a typical mini-batch stochastic gradient descent
    method, using mini-batches consisting of multiple bags.


    To further improve the predictive quality of the features we contrast patches
    varying a number of steps ahead by jointly train multiple contrastive models.
    We can simply learn a model $f_k(\cdot)$ for each step size $k$, while using the
    same feature extraction model. As larger steps make the task more difficult, we
    introduce a context aggregation model $\mathbf{c}_l = a(\mathbf{z}_0, \cdots,
    \mathbf{z}_l)$ shared among the steps. This allows the contrastive model $f_{W_k}(\mathbf{c}_l,
    \mathbf{z}_{l+k})$ to consider a brief history of the signal, encoded into $\mathbf{c}_l$,
    to predict which patch $\mathbf{z}_i$ in the bag is the consecutive one. This
    results in the loss:


    ```

    $\mathcal{L}_{CPC} = -\sum_k \log \frac{f(\mathbf{c}_l, \mathbf{z}_{l+k})}{\sum_{\mathbf{z}_i
    \in \mathcal{X}} f(\mathbf{c}_l, \mathbf{z}_i)} \quad (4.3)$

    ```


    To extend the method to 2D images, we have to induce an arbitrary ordering of
    patches on an image. We can consider a top-down approach where we contrast patches
    underneath the patch of focus. In the 2D regime the context aggregation model
    $\mathbf{c} = a(-)$ can take shape of a small autoregressive PixelCNN-styleOord
    et al., 2016 neural network, where we are careful to maintain a receptive field
    of solely of patches that are above and up to $w$ steps to the side of the patch
    of focus, $\mathbf{z}_{i,j} = a(\mathbf{z}_{y\le i, x=j\pm w})$.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 4.3 CONTRASTIVE PERTURBATIVE PREDICTIVE CODING


    In order to alleviate the issue of CPC features collapsing to non-stationary nuisance
    signals, we utilize expert-driven data augmentation insights. The same data augmentation
    techniques are known to boost performance of a variety deep learning based medical
    imaging methods, e.g Liu et al., 2017; Ronneberger et al., 2015.


    We replace the deterministic input image $x$ with a random variable $x \sim r(x)$
    drawn from an expert-determined random perturbation function $r(\cdot)$. $r(\cdot)$
    defines a distribution over the region in the input space around a datapoint.
    This region is considered equivalent to $x$ in the context of the downstream prediction
    task. $r(\cdot)$ can potentially include color perturbation, elastic deformation,
    artificial measurement noise and artifacts, small translations and rotations,
    and more. We draw two samples $(x^1, x^2)$ from $r(x)$. The first sample is to
    compute $c$ and the second sample to compute the features $z$ used by the contrastive
    model.


    By being careful to use augmentations that maintain the ordering of the patches,
    the feature extraction model is forced to learn features that are either invariant
    to the perturbations or can be consistently matched by the linear contrastive
    model. This provides a simple vector for expert knowledge of symmetry modes to
    be injected in the feature extraction model, without the need to enforce these
    symmetries in the neural network using expensive equivariance methods Veeling
    et al. (2018).


    # 4.4 RELATED WORK


    In the field of medical image analysis, reducing the labeling burden required
    from experts is a recurring theme. A common technique when leveraging deep neural
    network architectures is using weights trained using ImageNet Rajpurkar et al.,
    2017. This approach is limited however, as the local and global statistics of
    medical imagery differ greatly from photos seen in ImageNet. Recent work training
    deep models on a large histopathology dataset find that ImageNet pretraining does
    not improve performance Liu et al., 2017.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Beyond borrowing weights, generative models have been used to pretrain feature
    models, using methods such as (Convolutional) Variational Auto Encoders (CVAE)
    Sedai et al., 2017; Uzunova et al., 2018 as well as their nonvariational counterparts.
    Likewise, variations of GANs have been explored for pretraining and feature extraction
    Donahue et al., 2016. Another area of interest is the use of self-supervised losses,
    as solving a jigsaw puzzle of patches drawn from an image Noroozi and Favaro,
    2016; predicting color channels from gray-scaled images Larsson et al., 2016;
    Vondrick et al., 2018 and in-painting small windows removed from an input image
    Pathak et al., 2016.


    Concurrently, Tellez et al., 2018 and Lu et al., 2019 have explored contrastive
    training for Whole Slide Images. While they only focus on histopathology data
    we show additional results on a bone X-ray anomaly detection task. Furthermore,
    we highlight the importance of extensive data augmentation during contrastive
    training, as well as the choice of the origin of the patches, see Table 4.1.


    #  4-5 EXPERIMENTS


    #  4.5.1 Datasets


    We evaluate CPC and CPC on two challenging large-scale medical imaging datasets:
    the histopathology dataset PCamVeeling et al., 2018; Ehtesami Bejordi et al.,
    2017 and the bone X-ray anomaly detection task MURAJpurkar et al., 2017. In the
    following sections, we will demonstrate to what extent the CPC-learned features
    allow a linear classifier to reach competitive performance on these two benchmarks.
    We will compare CPC against fully-supervised models, convolutional (variational)
    autoencoders (CVAEs, trained using a residual bilinear upsampling decoder with
    L2 reconstruction loss) as well as randomly initialized feature models. Furthermore,
    we will explore if the classification model can cope with fewer labels when using
    the pretrained features.'
