  md: 'layers lag behind their greedily counterparts. This suggests that, in contrast
    to the supervised loss, the InfoMax principle "stacks well", such that the greedy,
    iterative application of the InfoNCE loss performs similar to its global application.


    # 5.5 RELATED WORK


    We have studied the effectiveness of the self-supervised CPC approach (Oord et
    al., 2018b; Héaff et al., 2019) when applied to gradient-isolated modules, freeing
    the method from end-to-end backpropagation. There are a number of optimization
    algorithms that eliminate the need for backpropagation altogether (Scellier and
    Bengio, 2017; Lillicrap et al., 2016; Kohn et al., 2018; Balduzzi et al., 2015;
    Lee et al., 2015; Orroria et al., 2018; Xiao et al., 2019). In contrast to our
    method, these methods employ a global supervised loss function and focus on finding
    more biologically plausible ways to assign credit


    A recently published work by Nokland and Eidnes, 2019 demonstrates that backpropagation-free
    layer-wise training is possible. Their similarity might be vaguely interpreted
    as another way of enforcing clustered representations. However, while our method
    achieves this entirely in a self-supervised fashion by clustering temporally or
    spatially nearby inputs, their similarity loss groups representations based on
    their class labels. Likewise, Belilovsky et al. (2019) showed that greedy layer-wise
    training with a supervised loss can scale to ImageNet. In an attempt to validate
    information bottleneck theory, Elad et al. (2018) develop a supervised, layer-wise
    training method that maximizes the mutual information between the outputs of a
    layer and the target while minimizing the mutual information between the inputs
    and outputs. In contrast to our proposal, these methods rely only on labeled data.


    Jaderberg et al. (2017) develop decoupled neural interfaces, which enjoy the same
    asynchronous training benefits as Greedy InfoMax (GIM), but achieve this by taking
    an end-to-end supervised loss and locally predicting its gradients. Hinton et
    al. (2006) and Bengio et al. (2007) focus on deep belief networks and propose
    a greedy layer-wise unsupervised pretraining method based on Restricted Boltzmann
    Machine principles, followed by optimizing using supervised loss. Lee et al. (2009)
    use convolutional deep belief networks'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'for unsupervised training on the TIMIT audio dataset and then evaluate their
    performance by training supervised classifiers on top. Gao et al. (2018) and Veer
    Steeg Galstyan (2015) explore total correlation explanation, which is related
    to mutual information maximization, and show that it can be applied for layer-by-layer
    training.


    Several recent works investigated the utilization of mutual information maximization
    in a representation learning setting (McAllister, 2018; Oord et al., 2018b; Hjem
    et al., 2019; Belghazi et al., 2018). Poole et al. (2018) analyse these recent
    works under a common framework and highlight that InfoNCE exhibits low variance
    at the cost of high bias and propose new lower bounds that allow for balancing
    this bias/variance trade-off. However, the analysis of these improved bounds in
    the context of inter-patch mutual information optimization remains in order, and
    thus we focus on the original CPC InfoNCE to bias the learned representations
    towards slow features (Wiskott and Sejnowski, 2002).


    Outside the information-theoretic framework, context prediction methods have been
    explored for unsupervised representation learning. A prominent approach in language
    processing is Word2Vec (Mikolov et al., 2013), in which a word is directly given
    its context (continuous skip-gram). Likewise, Doersch et al., 2015 study such
    an approach for the visual domain. Similarly, graph neural networks use contrastive
    principles to learn unsupervised embeddings based on their neighbors (Nickel et
    al., 2011; Perozzi et al., 2014; Nickel et al., 2015; Kipf and Welling, 2016;
    Veličković et al., 2018). Noise contrastive estimation has also been explored
    for independent component analysis (Hyvarinen et al., 2018; Hyvarinen and Morioka,
    2016; Hyvarinen and Morioka, 2017). Schmidhuber,1992 proposes a method where individual
    features are minimized such that they cannot be predicted from other features,
    forcing them to extract independent factors that carry statistical information,
    at the risk of neurons latching onto local independent noise sources in the input.


    # 5.6 CONCLUSION


    We presented Greedy InfoMax, a novel self-supervised greedy learning approach.
    The relatively strong performance demonstrates that deep neural net-'
