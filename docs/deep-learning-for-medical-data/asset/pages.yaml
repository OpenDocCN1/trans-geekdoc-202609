    future work in chapter 7.


    # 1.3 NOTATION


    Throughout this work we follow the notation as presented in the table below.


    | Examples | Description |

    | --- | --- |

    | a, b, c | Random scalar |

    | x, y, z | Random vector |

    | x_i | Elements of random vector |

    | X, W, Y | Random matrices |

