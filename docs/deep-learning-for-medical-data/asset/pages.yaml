    # 2.4 CONCLUSION


    We present a novel histopathology patch-classification model that outperforms
    a competitive traditional CNN by enforcing rotation and reflection equivariance.
    A derived patch-level dataset is presented, allowing straightforward and precise
    evaluation on a challenging histopathology task. We demonstrate that rotation
    equivariance improves reliability of the model, motivating the application and
    further research of rotation equivariant models in the medical image domain.


