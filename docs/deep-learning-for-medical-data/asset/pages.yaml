    We propose to use SGR as evaluation metric for confidence estimation methods.
    Specifically, on a hold-out set we measure the percentage of predictions that
    are accepted by SGR under a specific guarantee, ie the coverage. To illustrate,
    one can imagine that a trivial solution to guarantee no errors is to reject all
    data-points, with 0% coverage. By lowering the confidence threshold, coverage
    goes up, but the accuracy of the method goes down. SGR finds the optimal threshold
    that ensures the accuracy does not drop below a predetermined threshold, and by
    measuring the coverage under this method we can effectively compute the real value
    of a confidence estimation methods.


    To limit the influence of hyper-parameters on the comparison, we use an expensive
    hyper-parameter scheme on all variants and baselines. Specifically we use the
    automated optimization method TPE (Bergstra et al., 2011) over a maximum of 100
    evaluations per model. The hyper-parameters are optimized for coverage at 2% risk
    (δ=0.01) on fashionMNIST (Xiao et al., 2017), and we evaluate the optimal hyperparameters
    on another dataset, notMNIST, to measure how sensitive the hyperparameters are
    to a change in the data-distribution. Larger models are evaluated on Street View
    Housing (SVHN) (Netzer et al., 2011) using the same optimization scheme. For the
    details on the evaluated search space and chosen hyper-parameters we refer to
    the appendix.


    We compare² our model against plain Multi-Layer Perceptrons (MLPs) with ReLU activations,
    MCDdropout using Maxout activations³ (Goodfellow et al., 2013; Chang and Chen,
    2015) and an information bottleneck model using mean


    > ² All models are optimized with ADAM (Kingma and Ba, 2014a), weight initialization
    proposed by He et al. (2015), a weight decay of 10⁻³ and adaptive learning rate
    decay scheme¹ after 10 epochs of no validation accuracy improvement¹ and early
    stopping after 20 epochs of no improvement.


    > ³ We found this baseline to perform stronger in comparison to conventional ReLU
    MCDdropout models, under equal number of latent variables.'
