- pgno: 100
  md: '# 7


    # CONCLUSION


    In this thesis we revisited the core components of the deep learning toolkit and
    reevaluated them in the context of medical image image analysis. We identified
    three main areas where deep learning is falling short. In part I, we explored
    the benefit of integrating expert knowledge on structure and constraints in the
    model. Part II followed with a study on how deep learning modes can better leverage
    the vast amounts of unlabeled medical imaging data available. Finally, in part
    III, we explored how to extract better uncertainty estimates from the model to
    provide diagnostic risk. Let us now consider the research questions posed at the
    beginning of this work.


    **Research Question 1**: Can roto-reflective equivariance improve accuracy and
    robustness of deep learning models in a large scale medical setting?


    Certain medical imaging problems come with symmetry modes and nuisance factors
    found in the real world images typically studied in deep learning for computer
    vision. We explored this problem in the context of histopathology for the task
    of detecting metastatic tissue. Using the framework of CNNs, we designed a new
    architecture that captures the rotational symmetries of slide images. This new
    model outperforms traditional CNN architectures, even under strict equivalence
    of computational cost and parameter count. Moreover, the new model proved more
    robust to perturbations. We can conclude that in the right circumstances and especially
    in the face of limited data, incorporating expert knowledge in the form of model
    invariance improves the robustness and accuracy of deep learning models.


    Looking forward, we consider that the research area of group equivariant neural
    networks have progressed since Cohen and Welling, 2016. Incorporating these novel
    methods to enable scale equivariance, continuous rotation equivariance and perhaps
    color equivariance, can potentially improve performance'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# CONCLUSION


    mance further. However, the effectiveness of integrating expert knowledge as priors
    in a deep learning model remains a point of contention. As discussed in the bitter
    lesson, Sutton, 2019, expert knowledge might hamper a deep learning model from
    discovering efficient solutions to a decision problem. General methods that benefit
    from scale in data and compute have historically outperformed custom methods.
    GPT-style language models contain little to no expertise from linguistics, and
    have proven to be highly effective. Incorporating invariants should be evaluated
    on a case-by-case basis. And as the size of models and datasets grows, we might
    find that they provide a diminishing impact on performance.


    **Research Question 2:** How can we motivate the deep learning research community
    to optimize models for real medical problems?


    To aid the study of deep learning for medical problems, we proposed PCAM, a dataset
    derived from Camel16. This dataset is structured similarly to typical deep learning
    benchmarks such as CIFAR-10. We demonstrate improvement on the PCAM benchmark
    translates to improvements on the large-scale Camel16 benchmark. Since its release,
    PCAM has been the center of a Kaggle challenge, with 1149 teams competing to improve
    performance on the challenge. The accompanying paper has been cited 175 times
    since, and as the dataset has been used as a benchmark for groundbreaking research
    such as CLIP (Radford et al., 2021).


    **Research Question 3:** Do medical imaging deep learning models benefit from
    contrastive predictive coding for self-supervised representation learning?


    Next, we studied how contrastive representation can learn medical imaging. We
    identified that CPC on its own performs well, but suffers from nuisance factors
    in medical images. By carefully incorporating a set of augmentations specific
    to the medical tasks, we found improved representations which translated to better
    downstream prediction in both histopathology and X-ray data.


    **Research Question 4:** Can we optimize deep learning models effectively without
    end-to-end backpropagation?


    As the scale of deep learning architecture grows, the cost of building the model
    training infrastructure explodes. To enable synchronized gradient backpropagation
    across the full network, computational nodes need to be connected with high-bandwidth
    channels and physically colocated. We explore contrastive representation learning
    as a for training large models without the'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# CONCLUSION | 91


    need for end-to-end backpropagation. We found that our proposed method, GIM, outperforms
    its supervised end-to-end counterpart and enables training layers of a network
    in relative isolation. Future work can study the effectiveness of GIM in a true
    distributed setting; can we train a neural network efficiently using GIM by distributing
    the model over multiple computational nodes with little communication between
    the nodes?


    Research Question 5: Can latent variable quantization enable more expressive approximate
    mean-field posterior distributions and yield improved confidence scores in DLVMs?


    Finally, we explored the problem of calibrated uncertainty. We considered the
    hypothesis that variational inference infers from a too restrictive class of approximate
    posterior functions. Based on this, we proposed a novel mean-field approximate
    posterior based based on quantizing latent variables called SQUAD. We demonstrate
    that this posterior can be effectively trained in a DLVM setting, does not need
    batch norm, and yields quality that reduces risk.


    Since this, the use of quantization as a way of modeling density over a continuous
    domain has taken off. Quantization such as the VQ-VAE (Oord et al., 2017b) has
    played a crucial role in the image generation tool DALLERamesh et al., 2021 and
    quantile regression in reinforcement learning Dabney et al., 2017b. This continues
    to be an interesting approach to approximate posterior modeling, and can be studied
    in a variety of variational inference settings.


    The search for a proper Bayesian treatment of deep learning is ongoing. This area
    of research has fallen out of favor, as various studies to train deep learning
    models in a Bayesian manner reached negative conclusions (Wenzel et al., 2020).
    Only recently, Chen et al., 2024 demonstrate that with an adapted optimizer, achieving
    well-calibrated uncertainty from a large probabilistic neural networks is possible.


    # CLOSING WORDS


    Deep learning brings a tremendously exciting realm of possibilities for the field
    of medical image analysis and medicine in general. Capturing expertise in statistical
    models enables humanity to improve diagnostic quality. Moreover, with the spread
    of computation and internet to every corner of the'
  merge: -1
  img_proc: true
- pgno: 103
  md: globe, it enables medical expertise to be easily replicated and made available
    to all communities. There are still technical roadblocks to overcome to make this
    vision a reality, but with the pace and breadth at which the field of machine
    learning is progressing, the future seems bright.
  merge: -1
