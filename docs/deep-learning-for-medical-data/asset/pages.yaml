    # 6.3 RESULTS


    Quantifying the quality of uncertainty estimates of models remains an open problem.
    Various methods have relative entropy (Louizos and Welling, 2017); Gal and Ghahramani,
    2015a), reliability calibration, and proper scoring rules (Lakshminarayanan et
    al., 2017). Although interesting in their right, these metrics do not directly
    measure a good ranking of predictions, not indicate applicability in high-risk
    domains. Proper scoring rules are the exception, but a model with good ranking
    does not necessarily exhibit good performance on proper scoring rules any score
    that provides relative ordering suffices and does not have to reflect well calibrated
    probabilities. In fact, well-ranked scores can be re-calibrated (Niculescu-Mizil
    and Caruana, 2005) after training to improve performance on proper scoring rules
    and calibration metrics.


    In order to evaluate the applicability of the model in high-risk fields such as
    medicine, we want to quantify how models perform under a desired risk guarantee.
    We propose to use the Selection with Guaranteed Risk (SGR) method¹


