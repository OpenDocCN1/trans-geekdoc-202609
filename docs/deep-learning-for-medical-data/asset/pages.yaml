    # 5.4 EXPERIMENTS


    We test the applicability of the GIM approach to the visual and audio domain.
    In both settings, a feature-extraction model is divided by depth into modules
    and trained without labels using GIM. The representations created the final (frozen)
    module are then used as the input for a linear classifier, whose accuracy provide
    us with a proxy for the quality and generalizability of the representations created
    by the self-supervised model.


    # 5.4.1 Vision


    To apply Greedy InfoMax to natural images, we impose a top-down ordering on 2D
    images. We follow Oord et al. (2018b) and Héaff et al. (2019) by extracting a
    grid of partly-overlapping patches from the image to restrict the receptive fields
    of the representations. For each patch $x_{i,j}$ in row $i$ and column $j$ of
    this grid, we predict up to K patches $x_{i+K,j}$ in the rows underneath, skipping
    the first overlapping patch $x_{i+1,j}$. Random contrast samples are drawn with
    replacement from all samples available inside a batch, using 16'
