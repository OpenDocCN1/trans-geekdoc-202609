- pgno: 60
  md: 'As a result of this configuration, one can derive the optimal solution for
    $f$ is proportional to the density ratio (Oord et al., 2018b):


    ```

    $f_t(z_{t+k}, c_t) \propto \frac{p(z_{t+k}|c_t)}{p(z_{t+k})}. \quad (5.2)$

    ```


    This insight allows us to reformulate $\mathcal{L}_N$ as a lower bound on the
    mutual information $I(z_{t+k}, c_t)$, as demonstrated in the work of Oord et al.
    (2018b) and proven by Poole et al. (2018). Minimizing the loss $\mathcal{L}_N$
    thus optimizes the mutual information between consecutive patch representations
    $I(z_{t+k}, c_t)$, which in itself bounds the mutual information $I(x_{t+k}, c_t)$
    between the future input $x_{t+k}$ and the current representation $c_t$. Hyvarinen
    and Morioka, 2016 show that a similar patch-contrastive setup leads to the extraction
    of conditionally-independent components, such as Gabor-like filters in the early
    biological system.


    LAYER-WISE INFORMATION PRESERVATION IN NEUROSCIENCE Linsker (1988) developed the
    InfoMax principle in 1988. It theorizes that the brain learns to process its inputs
    by maximally preserving the information of the input activities in each layer.
    On top of this, neuroscience suggests that the brain predicts its future inputs
    and learns by minimizing this prediction error (Friston, 2010). Empirical evidence
    indicates, for example, that retinal cells carry significant mutual information
    between the current and the state of their activity (Palmer et al., 2015). Rao
    and Ballard (1999) indicate that this process may happen at each layer within
    the brain. Our proposal draws motivation from these theories, resulting in a method
    that learns to preserve the information between the input and the output of each
    layer by learning representations that are predictive of future inputs.


    # 5.3 GREEDY INFOMAX


    In this paper, we pose the question if we can effectively optimize the mutual
    information between representations at each layer of a model in isolation, enjoying
    the many practical benefits that greedy training (coupled, isolated training of
    parts of a model) provides. In doing so, we introduce a novel approach for self-supervised
    representation learning: Greedy InfoMax (GIM). As depicted on the left side of
    Figure 5.1, we take a conventional deep learning'
