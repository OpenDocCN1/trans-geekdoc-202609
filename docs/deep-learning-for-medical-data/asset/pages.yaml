    PREDICTIVE CODING


    # 4.1 UNSUPERVISED FEATURE EXTRACTION


    In recent years large quantities of medical imaging data have become available
    to develop data-based models. However, much of this data is unlabeled. Hence,
    there is a growing interest in unsupervised training of feature extraction models.
    Current methods rely on some form of generative modeling: an encoder/discriminator
    learns a representation, and a decoder/generator generates images. Both models
    are optimized to improve the generation of realistic images. In practice, it turns
    out that the effectiveness of these representations is limited in comparison to
    training the model fully supervised with a large labeled dataset.


    Recently, an alternative form of unsupervised feature learning, called unsupervised
    learning, has garnered renewed interest. Rather than optimizing features such
    that a generative model can reproduce the original input, features are optimized
    such that a contrastive model can tell consecutive pairs of features apart from
    random pairs. In recent Oord et al., 2018 this has been shown to extract features
    that are very effective for medical classification, speaker identification and
    speech transcription. After training of the feature extractor only a small number
    of labels is required in order to train a linear classifier on top. This approach
    is commonly referred to as Contrastive Predictive Coding (CPC) Oord et al., 2018a


    In this work, we explore how CPC performs on medical imaging data, focusing on
    the histopathology dataset PCam Veeling et al., 2018 and bone X-ray dataset MURA
    Rajpurkar et al., 2017. We find that the method suffers'
  merge: -1
  img_proc: true
