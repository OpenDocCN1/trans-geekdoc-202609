- pgno: 54
  md: '# 4.6 CONCLUSIONS


    We have explored the effectiveness of Contrastive Predictive Coding for medical
    image analysis. On the histopathology dataset PCam we find that CPC suffers from
    non-stationary artifacts and trivial solutions. We demonstrate that our proposed
    C2PC alleviates these issues, and outperforms fully supervised models in small
    label regimes. On the bone X-ray anomaly detection dataset MURA we outperform
    other pretraining baselines, which motivates further study of the use of C(2)PC
    as a pretraining method, further work could study how to effectively incorporate
    C2PC in a semi-supervised regime, exploiting both labels and expert equivalence
    class to achieve best-of-both-worlds results. Contrastive Predictive Coding provides
    a big leap forward in unsupervised pretraining. And with expert labels coming
    at high cost, the medical community stands to benefit tremendously from such advances.'
  merge: -1
