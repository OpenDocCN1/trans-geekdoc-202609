- pgno: 61
  md: "architecture and divide it by a stack of M modules. This decoupling can happen\
    \ at the individual layer level or, for example, at the level of blocks found\
    \ in residual networks (He et al., 2016b). Rather training the end-to-end, we\
    \ prevent gradients from flowing between modules and employ a local self-supervised\
    \ loss instead, additionally reducing the issue of vanishing gradients.\n\nAs\
    \ shown on the right side of Figure 5.1, each encoding $z_t^{enc}$ within our\
    \ architecture maps the output from the previous module $z_t^{m-1}$ to an encoding\
    \ $z_t^m = z_t^{enc}(GradientBlock(z_t^{m-1}))$. No gradients are flowing between\
    \ modules, which are enforced using a gradient blocking operator defined as $GradientBlock(x)\
    \ \\triangleq x, \\nabla GradientBlock(x) \\equiv 0$. Oord et al. (2018b) propose\
    \ to use the output of an autoregressive model $gar(z_{0:}) = c_t$ to contrast\
    \ against future predictions $z_{t+k}$. However, our preliminary results showed\
    \ that this did not improve results if applied at every module in the stack and\
    \ optimizing requires backpropagation through time, which is considered biologically\
    \ implausible. We therefore train each module $z_t^{enc}$ using the following\
    \ module-local INFOnce:\n\n```\n$f_k^m(z_{t+k}^m, z_t^m) = \\exp\\left((z_{t+k}^m)^T\
    \ W_k^m z_t^m\\right) \\quad (5.3)$\n```\n\n```\n$\\mathcal{L}_N^m = -\\sum_{k\
    \ \\in X} \\log\\left[\\frac{f_k^m(z_{t+k}^m, z_t^m)}{\\sum_{j \\in X} f_j^m(z_{t+j}^m,\
    \ z_t^m)}\right] \\quad (5.4)$\n```\n\nAfter convergence of all modules, the scoring\
    \ functions $f_k^m(\\cdot)$ are discarded, leaving a conventional feed-forward\
    \ neural network architecture that extracts features $z_t^m$ for downstream tasks:\n\
    \n```\n$z_t^m = g_{enc}^m(g_{enc}^{m-1}(\\dots g_{enc}^1(x_t)))\\. \\quad (5.5)$\n\
    ```\n\nFor certain downstream tasks, a broad context is essential. For example,\
    \ in speech recognition, the receptive field of $z_t^m$ might not carry enough\
    \ information to distinguish phonetic structures. To provide this context, we\
    \ re the autoregressive model $gar$ as an independent module that we optionally\
    \ append to the stack of encoding modules, resulting in a context-aggregate representation\
    \ $c_t^m = g_{gar}^m(GradientBlock(z_{0:t}^{m-1}))$. In practice, a GRU or PixelCNN-style\
    \ model can serve in this role. We train this module independently using the following\
    \ altered scoring function:\n\n```\n$f_k^m(z_{t+k}^m, c_t^m) = \\exp\\left((GradientBlock(z_{t+k}^{M-1}))^T\
    \ W_k^mc_t^m\\right)\\ \\quad (5.6)$\n```"
