  md: '# ROTATION EQUIVARIANT CNNS FOR DIGITAL PATHOLOGY


    # 2.1 INTRODUCTION


    The field of digital pathology is developing rapidly, following recent advancements
    in microscopic neural imaging hardware that allow digitizing glass slides into
    whole-slide images (WSIs). This digitization has facilitated image analysis algorithms
    to assist and automate diagnostic tasks. A proven approach is to use convolutional
    neural networks (CNNs), a type of deep learning model, trained on patches extracted
    from whole-slide images. The aggregate of these patch-based predictions serves
    as a slide-level representation used by models to identify metastases, stage cancer
    or diagnose complications. This approach has been shown to outperform pathologists
    in a variety of tasks (Liu et al., 2017; Litjens et al., 2017b; Bjernordi et al.,
    2016).


    This performance is achieved using off-the-shelf CNN architectures originally
    designed for natural images (Litjens et al., 2017). The effectiveness of these
    models can be largely attributed to the efficient sharing of parameters in convolutional
    layers. As a result, local patterns are encoded independently of their spatial
    location, and shifting the input leads to a predictable shift in the output. This
    property, known as translational equivariance, effectively exploits the translational
    symmetry inherent in natural images leading to strong generalization.


    In contrast to natural images, WSIs exhibit not only translational symmetry but
    rotation and reflection symmetry as well. CNNs do not exploit these symmetries,
    and as a result are found empirically to spend a large part of their parameter
    budget on multiple rotated and reflected copies of filters (Zeiler et'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'al., 2014). Additionally, we find that CNNs trained on histopathology data
    exhibit erratic fluctuations in predictions under input rotation and reflection.
    Enforcing equivariance in the model under these transformations is expected to
    reduce such instabilities, and lower the risk of overfitting by improving parameter
    sharing.


    To encode these symmetries, we leverage recent findings in rotation equivariant
    CNNs (Cohen and Welling, 2016; Worall et al., 2017; Weiler et al., 2017), a topic
    of interest in the machine learning community. These methods show strong generalization
    under limited dataset size and are more robust under adversarial perturbations
    in rotation, translation and local geometric distortions (Dumont et al., 2018).
    We propose a fully-convolutional patch-classification model that is equivariant
    to $90^{\circ}$ rotations and reflection, using the method proposed by Cohen and
    Welling (2016). We evaluate the model on the Camelion16 benchmark (Ehtesami Bejnordi
    et al., 2017), showing significant improvement over a comparable CNN on slide
    level classification and tumor localization tasks.


    As slide-level metrics obscure the relative performance of patch-level models,
    we further validate on a patch-level task. In this regime, there currently no
    benchmarks the high volume, quality and variety of Camelion16. Thus, we present
    PatchCamelyon (PCam), a large-scale patch-level dataset derived from Camelion16
    data. Through this dataset, we demonstrate that the proposed model is more accurate
    and more robust under input rotation and reflection, compared to an equivalent
    standard CNN.


    The contributions of our work are as follows: **(1)** we propose new deep learning
    model that utilizes symmetries inherent to histopathology$^{1}$, **(2)** demonstrate
    that rotation equivariance improves model reliability and present a new large-scale
    histopathology dataset that enables model evaluation.


    **Related Work** A common approach to improve orientation robustness is to train
    CNNs using extensive data augmentation, perturbing data with random transformations
    (Liu et al., 2017; Litzens et al., 2017b). Although this may improve generalization,
    it fails to capture local symmetries and does not guarantee equivariance at every
    layer. As CNNs have to learn rotation equivariance to hold copies of identical
    filters, they require a larger model capacity. Even if rotation equivariance is
    achieved on training data, there is no


