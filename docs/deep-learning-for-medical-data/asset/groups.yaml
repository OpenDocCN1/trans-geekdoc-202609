    # 2 INTRODUCTION


    question (Maron et al., 2020; Perera et al., 2022). Decision making within this
    mist of uncertainty perhaps demands a level of intelligence beyond what us mere
    mortals may muster manually.


    # 1.1.2 Medical Imaging


    This problem is further exacerbated by the advent of modern medical imaging. With
    technology such as the X-ray, ultrasound and later Computed Tomography (CT) and
    Magnetic Resonance Imaging (MRI), as well as advances in digitization of histopathology,
    clinicians can gain a dramatically growing amount of information on their patient.
    As a result, doctors are overloaded with data that needs to be processed in diagnosing
    a disease and predicting treatment outcome. Processing of such complexity imagery
    that these methods generate have proven to assess and translating data into actionable
    advice, in the form of the Radiologist and Pathologist. Some of the tasks experts
    must undertake that humans are not naturally suited to. Often searching for a
    needle in a haystack, abstracted away the human connection with a patient, these
    experts must stay focused on dense streams of data to find outliers and score.
    In efforts to standardize insights, human experts rely on subjective scales such
    as the Gleason score (Gleason and Tannenbaum (1977)) that have tremendous impact
    on treatment invasiveness, yet come with surprisingly high inter-rater variability
    (Ozkan et al., 2016). Additionally, it is well known that introducing humans into
    a decision process brings its own set of challenges in regards to communication
    and handover. Once a diagnosis has taken place, there is little to no feedback
    loop between an expert’s advice and the actual treatment outcome.


    This is the promise of Computer Aided Diagnosis (CAD) comes in. Computers have
    infinite energy, unlimited attention span and, noteworthy, not show up to work
    hungry. Software is replicable and can continuously improved. Errone behaviour
    can be re-enacted, studied and remediated. Feedback loops can span months with
    treatment outcome flowing back as guiding signals for early recognition models.
    A promising path forward to improve medical decision making.


    While there are many aspects to the medical diagnostic process, encompassing the
    entire process is challenging. In this thesis, we focus on the challenge'
  - '[PAGE 14]


    of Computer Aided Diagnosis withing the scope of interpreting medical imagery.
    This is a crucial step towards developing a comprehensive system that can digest
    information from all facets of the medical diagnostic process and make recommendations
    along the way.


    # 1.1.3 Computer Aided Diagnosis


    The process of distilling the expertise of the field of medical image analysis
    into algorithms has proven difficult. Deriving rules based on intuition and theory
    carefully honored over centuries of study and practice turns out to be impossible,
    despite the armies of doctorates that have taken up the challenge.


    Fortunately, machine learning provides an alternative to the rigid design of rule
    based modeling. The field provides proven methods that take in examples annotated
    by experts, and derives models that aim to capture the principles with which these
    annotations were made. However, medical imaging data is especially vast and dense,
    and traditional machine learning approaches rely on handcrafted feature extracting
    to turn data into numbers that the methods can cope with. This hand crafting of
    features proves to be an almost equally difficult task as designing rules from
    the get go.


    # 1.1.4 Deep Learning


    This is why the advent of deep learning has brought a sea change in the field
    of medical image analysis. Through a combination of large randomly initialized
    feature extractors and stochastic gradient descent to traverse the search space,
    machine learning models can now be trained directly on raw dense imagery. This
    approach was popularized with the ImageNet challenge in 2012, where deep learning
    outperformed traditional machine learning approaches. Since then, most image analysis
    research communities have seen a shift to deep learning as the dominant paradigm.


    The effectiveness of deep learning in medical image analysis inspires a promising
    vision for the future. Deep learning models can be trained on data all over the
    world, rather than the handcrafted models designed by experts using small datasets
    from academic hospitals capturing only subsections of the demographics around
    the world. Moreover, deep learning models can learn from mistakes months after
    the initial diagnosis was made, a feedback loop'
  - '[PAGE 15]


    happens rarely in practice with human experts. Although often thought of as a
    black box, a team of experts akin to flight-crash investigators can exactly reproduce
    the state in which a model made the error, and various tools can be used to provide
    introspection and guidance on how to mitigate similar issues in the future. Additionally,
    the free replication of deep learning means expertise can be applied world wide.
    This brings access to high quality medical insights to communities that would
    otherwise be lacking.


    Deep learning models can change how primary care is delivered by removing the
    need for specialized expertise. This enables physicians to directly translate
    medical scans into actionable insights, thereby removing the burden of communication
    and reducing errors due to handover. Lastly, when a novel disease threatens the
    world, these models can be rapidly updated to incorporate new diagnoses, offering
    a nimble response to global health crises.


    # 1.1.5 Re-evaluating DL for Medical Image Analysis


    Despite its effectiveness, deep learning has been developed in an empirical manner
    – a process some equate to alchemy – and is still lacking fundamental first-principle
    justification. While this has clearly brought tremendous success and progress,
    the dominant benchmarks that have driven year over year improvements have significant
    differences from the problems seen in medical imaging. These benchmarks are often
    simple object detection in natural imagery, with a focus on classification accuracy,
    which misses the nuances of medical image analysis. It is not to say that deep
    learning has not shown its merit in this domain. It has lead to great success
    on impactful medical imaging benchmarks (Litijens et al., 2017a). To name a few
    early works, Gulshan et al., 2016 demonstrate a deep learning model capable of
    detecting diabetic retinopathy in retinal fund photographs, comparable in performance
    to a panel of certified ophthalmologists. Esteva et al., 2017 demonstrate (near)
    human expert level performance on classifying skin cancer. Wang et al., 2016 demonstrate
    strong performance on identifying metastatic breast cancer from histopathology
    whole slide images of sentinel lymph node biopsies.


    However, for a task as sensitive as medical decision making, the failure modes
    of deep learning models are not negligible (Zhang et al., 2016; Litijens et al.,
    2017a). Problems such as data bias, class imbalance, a lack of interpretability
    and explainability of decisions, input modality robustness and'
  - '[PAGE 16]


    label disagreement sensitivity need careful attention within the medical domain.
    Hence, it is worthy to re-evaluate the status quo of deep learning common knowledge
    under the lens of medical image analysis, to see if further improvement can be
    found and shortcomings can be fixed.


    # 1.2 SETUP


    We reevaluate the toolbox of deep learning with medical image analysis in mind,
    and find three main themes that require further study. The integration of expert
    knowledge on modeling constraints, the modeling and calibrated prediction of uncertainty,
    and the use of vast amounts of unlabeled medical imaging data. These themes form
    the basis of the thesis. In part ?? we study the integration of expert knowledge
    in deep neural networks. In part ?? we study probabilistic modeling to improve
    calibrated uncertainty to aid decision based on deep learning models. Finally,
    in part ?? we study how deep models learn from unlabeled data to augment smaller
    datasets. We ponder the following research questions throughout the thesis.


    **Research Question 1:** Can roto-reflective equivariance improve accuracy and
    robustness of deep learning models in a large scale medical setting?


    Deep learning is often studied in the natural image domain where images have a
    canonical orientation; texttithe sky is up. Medical images and especially histopathological
    imaging, differ in this regard. Our main contribution is evaluating the use of
    group equivariant models studied by Cohen and Welling (2016) in the context of
    a large scale real world histopathology benchmark. It is hypothesised, but not
    proven, that this will aid performance. It has been argued that models benefit
    from less parameter sharing so the model can learn it itself. If we explore incorporating
    symmetries in rotation and mirroring using this framework of GCNN, adds the sample
    efficiency of deep learning models in a real world scale medical imaging setting.


    **Research Question 2:** How can we motivate the deep learning research community
    to optimize models for real world medical problems?


    Next, we draw experience from the research from the previous question and derive
    a deep learning appropriate medical imaging benchmark, to enable researchers and
    practitioners to test new research ideas on a derived medical imaging task that
