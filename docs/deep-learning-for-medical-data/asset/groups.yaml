    share a large part of the information that is relevant to a downstream model.
    CPC exploits this as follows: starting with a patch of interest, a consecutive
    patch is put in a bag together with random patches from the dataset. A contrastive
    classification model compares the patch of interest with each of the patches in
    the bag, using a shared feature extraction model for the patches. An incur occurs
    when it fails to predict which patch in the bag is the consecutive one. This loss
    is then optimized using conventional stochastic gradient descent methods, training
    both the feature extraction model and the contrastive classification model in
    unison. This forces the feature extraction model to extract features that distinguish
    consecutive patches and prevents it from learning trivial features that do not
    provide information about the patches, such as local nuisance factors and noise.


