    # 114 | ACKNOWLEDGEMENTS


    foresight to pursue a degree in AI. Thijs, inspiring me to take initiative. David,
    for reminding us to celebrate all our wins. Otto, for making me laugh. Suin, for
    incredible korean food. Richard and Rien, for being great housemates. Maartje,
    for being a close friend and parnym, as well as Maurits, Ties and Jörg, for our
    many dinners and great company. Wendy, for being a great travel partner. Damla,
    Erin, Tunca, Amu, for providing a place of calm amongst the chaos. Thiviyan, for
    listening and sharing. Marloes, for coming me to Copenhagen. Jan Willem, for sharing
    notes and advice on career. Miriam, for showing me what strength and grace in
    the face of adversity is, and being regardless. Thomas, for being there from the
    start of the AI adventure in Amsterdam and staying in touch. Janna, for going
    above and beyond and helping me see things in a different light. Agner, for your
    friendship and helping me take my mind off work. Benjy, for pushing me to ride
    faster. Ana and Thomas, for taking karaoke to the next level. Johannes, for showing
    me the beauty of Austria and for a wonderful collaboration. Jose, for sharing
    the excitement for the metaverse where we''ll surely spend much time in the future.
    Elise, forit, for keeping it metal. Thijs, Giulia and Chin-Wei, for rocking together.


    Finally, I want to thank the committee members, Prof. Dr. Zeynep Akata, Prof.
    Dr. Paul Groth, Prof. Dr. Evangelous Kanulas, Dr. Stephan Mandt, and Dr. Erik
    Bekkers for generously taking the time to read this thesis and sharing their expertise.
    It is an honour to be able to discuss my work with all of you.


    Extending a PhD project beyond the typically allotted 4 years means the list of
    people who come to impact the thesis and myself grows ever larger. If you are
    reading this, you most likely are one of them. If my memory has lapsed in the
    haste of writing this and I have failed to acknowledge you: I beg your forgiveness,
    and invite you to reach out so I can promptly buy you a drink to make up and reminisce
    on the good old days.'
