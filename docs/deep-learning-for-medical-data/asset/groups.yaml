    ## EXPERIMENTAL DETAILS


    We follow the setup of Oord et al. (2018b) unless specified otherwise and use
    a 100-hour subset of the publicly available LibriSpeech dataset (Panayotov et
    al., 2015). It contains the utterances of 251 different speakers with aligned
    phone labels labeled into 41 classes. These phone labels were obtained by Oord
    et al. (2018b) by force-aligning phone sequences using the Kaldi toolkit (Povey
    et al., 2011) and pre-trained models on Libispeed (Panayotov, 2014). We first
    train the self-supervised model consisting of five convolutional layers and one
    autoregressive module, a single-layer gated recurrent unit (GRU). After convergence,
    a linear multi-class classifier is trained on top of the context-aggregate representation
    $c^M$ without fine-tuning the representations. Remaining implementation details
    are presented in appendix 5.A.2.


    ## RESULTS


    Following table 5.3, we analyze the performance of models on phone and speaker
    classification accuracy. Randomly initialized features perform poorly, demonstrating
    that both tasks require complex representations. The traditional, hand-engineered
    MFCC features are commonly used in speech recognition systems (Ganchev et al.,
    2005), and improve over the random features, but provide limited linear separation
    on both tasks. On the speaker classification task, CPC and GIM outperform the
    supervised baselines despite their features having been trained without, and GIM
    without end-to-end backpropagation. In this setting, GIM and Greedy Supervised,
    where individual layers are trained greedily with a supervised loss function,
    achieve similar results to their respective end-to-end counterparts (CPC and Supervised).
    When classifying phones, CPC does not reach the supervised performance (64.9%
    versus 77.7%). GIM achieves 62.5%, while Greedy Supervised accomplishes 73.4%.
    Thus, in contrast to the vision experiments (Section 5.4.1), we see similar differences
    in performance between the greedily trained models (GIM and Greedy Supervised)
    compared to their respective end-to-end optimized counterparts (CPC and Supervised).


