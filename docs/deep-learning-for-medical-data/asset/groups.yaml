    # # INTRODUCTION


    # ## 1.1 MOTIVATION


    # ### 1.1.1 Medical Decision Making


    Accately diagnosing diseases and determining the most effective treatment is a
    challenge that has persisted throughout history. Historically, difficult cases
    were often attributed to the supernatural. Demons and divine intervention were
    the catch-all medical cause for ancient societies, and treatments were chosen
    accordingly. We have developed since, and the scientific method has prevailed
    in medicine. With a growing body of knowledge, high evidence standards for interventions,
    and an array of modern diagnostic tools, medical doctors are now able to make
    informed treatment decisions like never before.


    Diagnosing disease and predicting treatment outcome is not rocket science; it
    is significantly more complicated. The challenge stems from the fact that uncertainty
    clouds every aspect of medical decision making. Whilst we have decent deterministic
    models of gravity and rocket engines, the human body is is not completely understood.
    This day, new organs are discovered that have implications for treatment (Benias
    et al., 2018; Valstar et al., 2021). Scientific evidence on test and treatment
    outcome is sparse and biased towards certain demographics. Research on intervention
    suffers from survivor-ship bays, where the justifiable desire for randomised controlled
    trials favor treatments that are amenable to double-blind study. The heterogeneity
    of humans complicates the equation, as does the associated human suffering and
    monetary cost with many diagnostic tools. Furthermore, the field constantly evolves,
    where interventions once hailed as the pinnacle of modern treatment have come
