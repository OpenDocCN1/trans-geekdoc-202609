    racy when applied to a large-scale real world challenge of detecting malignant
    tissue in lymph node biopsies.


    We will close this part in chapter 3, where we present a novel dataset that we
    have proposed as part of this research project. This dataset distills a plug and
    play dataset for deep learning researchers to explore how their methods fare in
    a task that is proxy to a highly relevant real world medical problem.'
