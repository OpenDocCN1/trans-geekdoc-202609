    ## 6.2 相关工作


    所提出的方法与利用 Gumbel-Softmax 技巧对类别隐变量建模的工作不同：我们的提议通过量化其定义域并使用多项分布对信念建模，考虑了连续标量隐变量。类别隐变量模型会产生得得
    $O(C^2)$ 多项式复杂度惩罚。


    该方法可以很容易集成到深度神经网络架构中，并在 github.com/anonymized 提供了 SQUAD 层的实现。


    在自然图像领域，我们预见到每个变量需要大量信息，因此少量的箱体（bins）是不够的。为了提高使用大量量化箱的可行性，我们提出了 SQUAD 的变体，使用分解方案来提高参数效率。从形式上，方程
    6.2 变为：


    ```

    $p(s_k = c(x)) = \text{softmax}(W_{k}^{u}(\mathbf{x}) + b_{k}^{u})$

    ```


    其中全权重 $W''''$ 和 $W''$ 分别形状为 $(K, B, C)$ 和 $(|X|, K, B)$，其中 $K$ 表示神经元数量，$B$ 表示分解输入数量，$C$
    表示量化箱数量，$|X|$ 是输入维度。为了提高参数效率，我们也可以每层学习 $W''$，其形状为 $(|X|, 1, B)$，根据 6.3 节中搜索的超参数，这对于较大的
    $C$ 是有利的。我们在图 6.2 的右侧描述了这种替代模型，并将其称为 SQUAD-factorized。我们将 Network-in-Network（Lin
    et al., 2013）等进一步扩展留给未来的工作。


    在深度变分模型（DLVMs）领域之外，已经探索了其他预测不确定性的方法。Lakshminarayanan 等人 (2017) 提出了深度集成（deep ensembles）：对一组单独经过对抗训练的小型
    DNN 的预测进行直接平均。尽管该方法具有良好的扩展性，但它需要重新训练模型高达 10 次，对于大型数据集来说，这可能极其昂贵。


    Gal 和 Ghahramani (2015b) 提出在测试时使用 dropout（Srivastava et al., 2014）（蒙特卡洛 Dropout，或
    MC-Dropout），并提出了这种方法的贝叶斯神经网络解释。Gal 等人 (2017) 的后续工作探索了使用 Gumbel-Softmax 来平滑地变形
    dropout 噪声，以便在训练期间优化 dropout 速率。MC-Dropout (MCD) 的缺点是施加在权重上的固定双峰脉冲分布灵活性有限，这需要大量的样本才能对不确定性进行良好估计。Oord
    等人 (2017a) 提出在变分推断中使用向量量化，对多维嵌入进行量化，我们在自动编码器的背景下探索了这一点。


    在学习非线性的空间，Su 等人 (2017) 探索了一种可以假设大多数标准激活函数形式的灵活非线性。Dabney 等人 (2017a) 使用分位数回归为分布强化学习探索了更灵活的分布，这可以看作
    SQUAD 的一个特例，其中箱体值是学习的但具有固定的均匀概率。Shayer 等人 (2017) 已使用标量变量上的类别分布来建模更灵活的贝叶斯神经网络后验。Miles
    等人 (2006) 提出使用狄拉克分布的混合来近似。


    ![](img/3013a5e7af0c305d337644a32207e3ef_87_0.png)

    **图 6.3：** 在 IB 中，边缘 $p(z)$ 使用固定分布 $r(z)$ 进行近似。使用我们提出的 SQUAD 分布，我们可以通过量化箱的间距和权重
    $r(z_i = v_i)$ 为 $r(z)$ 实施各种有趣的形状。对于值 $v$，我们比较了线性间隔的箱体（左侧）与正态分布下等概率质量的箱体（**右侧**）。此外，我们探索了允许基于每个神经元或每层通过
    SGD 优化箱体的影响，允许模型优化量化保真方案。对于先验概率，我们探索了均匀先验（**左侧**）和正态分布下的箱体概率质量（**中间**）。


