    samples and predict up to $k=5$ rows into the future. For contrasting patches
    against one another, we spatially mean-pool the representations of each patch.


    Before applying the linear logistic regression classifier on the output of the
    third residual block, we spatially mean-pool the created representations of size
    128 to decrease the dimensionality. We train the linear logistic regression classifier
    using the top, autoregressive module without pooling. We employ the Adam optimizer
    but select different learning rates than before. In the speaker classification
    experiment, we used a learning rate of 1e-3, while we set it to 1e-4 for the phone
    classification experiment. For the training set provided by Oord et al. (2018b),
    we split it into two random subsets using 25% of the samples as a validation set.


