    我们考虑到医学图像分析重新评估深度学习的工具箱，并发现三个需要进一步研究的主题：专家知识的整合、不确定性的建模与校准预测以及大量未标记医学影像数据的使用。这些主题构成了论文的基础。在部分
    ??，我们研究深度神经网络中专家知识的整合。在部分 ??，我们研究概率建模以改进不确定性的预测，以辅助深度学习模型的决策。最后，在部分 ??，我们研究如何从未标记数据中学习以增强小型数据集。在整个论文中，我们思考以下研究问题。


    研究问题 1：旋转反射等变性（roto-reflective equivariance）可以提高大规模医学环境下深度学习模型的准确性和稳健性吗？


