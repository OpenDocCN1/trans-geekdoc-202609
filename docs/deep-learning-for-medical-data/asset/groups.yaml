    # 3 PCAM


    机器学习人员在大型医学数据集上评估其方法存在障碍。这在病理学中尤为明显，像 Camelyon (Belfordi 等，2017) 这样的大数据集需要复杂的数据加载器来平衡不同类型的组织，并能高效地处理海量数据。为了能为希望处理病理学数据的研究人员提供便利，我们推出了一个从
    Camelyon 派生的数据集：PatchCamleon (PCAM)。它的开发参考了病理学家和病理学深度学习专家的意见。


    PCAM 现在发布于 github.com/baseling/pcam，处理起来就像 CIFAR10 或 MNIST 一样简单。


    PatchCamleon 基准是一个全新的且具有挑战性的图像分类数据集。它包含 327,680 张彩色图像（96 x 96px），提取自淋巴结切片的病理扫描图像。每张图像都有一个二分类标签，指示是否存在转移性组织。PCAM
    为机器学习模型提供了一个新的基准：比 CIFAR10 大，比 imagenet 小，可以在单 GPU 上进行训练。


    ### 3.0.1 为什么需要 PCAM


    基础性的机器学习进展主要在简单的自然图像分类数据集上进行评估。例如 MNIST、CIFAR、SVHN。医学影像正成为机器学习的主要应用之一，我们认为它应该在主流机器学习数据集列表中占有一席之地。


