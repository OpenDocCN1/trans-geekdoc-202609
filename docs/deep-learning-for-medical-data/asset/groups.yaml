    ### 4.2 CONTRASTIVE PREIVE CODING


    Contrastive Predictive Coding (CPC) is a deep learning technique that provides
    universal unsupervised feature extraction, recently proposed by Oord et al. (2018a).
    It builds on fundamental work in areas of noise contrastive estimation and slow
    feature analysis Wiskott and Sejnowski, 2002. It has been shown to be effective
    across a variety of domains including image classification, speaker and phone
    classification as well as reinforcement learning. CPC builds on the notion that
    in time series, natural images and videos interesting features that change slowly
    over time and space: so-called slow features. It differs from nonlinear ICA methods
    in that feature vectors are compared jointly, rather than per feature, which removes
    the need for the model to learn conditionally independent features. Furthermore,
    it increases the difficulty of the task by performing detection of the consecutive
    patch among K-1 non-consecutive patches, rather than binary classification of
    pairs of patches being consecutive or not.


