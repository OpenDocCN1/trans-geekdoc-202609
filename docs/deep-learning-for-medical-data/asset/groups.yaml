    pursuing internships. I also want to give special thanks to Dennis Koelma and
    Bas Tervijn for their advice and for enabling bits to flow where they have to
    go. On SURFSara’s side, I have to thank Vali for collaboration and enabling of
    my more excessive crunching stints.


    I am also grateful to the organizers and attendees of the wonderful Deep Bayes
    school by Dimitri Vetrov. Likewise, the summer school by Microsoft Research was
