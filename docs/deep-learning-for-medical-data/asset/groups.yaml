    ing collaborators. It was great to work alongside Thomas, Alexey, Aravind, Aidan,
    Sebastian and many others. Durk, thank you for honoring one of my more speculative
    research ideas. Continuing as a student researcher in Amsterdam was a dream come
    true and I have to thank Tim especially for my guidance and support. All my colleagues
    at Google Brain Amsterdam were a great source of inspiration and aspiration, including
    and certainly not limited to Lasse, Nal, Capser, Jonathan, Avital, Mostafa; I
