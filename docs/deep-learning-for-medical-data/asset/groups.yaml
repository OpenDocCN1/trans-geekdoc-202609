  - '[PAGE 123]


    exhaustible positivity, feedback and advice. As with Max, I seem to can''t help
    myself from following where you lead. Patrick, thank you for many white-boarding
    sessions. Arsenii, for advice and contagious excitement. Daniel and Shi, for being
    great office mates. Jakub, for endless mentorship. Tamis, for greening our offices.
    Zeynep, for your advice, for being a mentor. Karen, for advice and help. Tim,
    Victor, Emil, Jorn, Peter, Christoph, Herke, Priyanka, Qi, Elise, Putri, Heiko,
    Wouter, Tom, Eric, Teddy, Sara, Gjorgi, Pascal, and many others, thank you all
    for advice, feedback, frisbee games and more, you made the ride so much better.
    Marco, for a wonderful collaboration and discussions on all this information.
    Babak, Sharv, for the board game divisions. And, thank you for all the food, hikes,
    and discussions.


    My wonderful colleagues at MSR should not go unnoticed. Thank you all for contributing
    to the incredible warm, friendly and ambitious culture we now have in Amsterdam
    and beyond. You helped me find great joy in research after the bulk of my PhD
    was behind me, and taught me all so much. Thank you to Phillip, Paris, Rich, and
    Johannes for a great collaboration. Ryota, thank you for your invaluable mentorship
    and advice.


    Collaborating with Jim and Jasper is a joy, thank you for joining forces. Adam,
    for teaching me more about the brain. Govert, for an exciting deep dive into compositionality.
    Sindy and Peter, thank you for an incredible collaboration.


    All of this would not have been possible without the generous support from Philips
    Research. Special thanks to Bart Bakker, who always prioritized anything over
    else. Biyam, Ulf, Stojan, Dimitrios, Harold, Nicola, Karan, Vlado, Shakith, Karl,
    and Fritz, for many joyful brainstorming sessions, discussions, introductions
    and demonstrations of real messy wet science.


    I also have to thank Franks and Bart for introducing me to Ruud van Sloun, whom''s
    contagious optimism and out of the box thinking at the most welcome time. Our
    collaborations were a great source of joy and ever more reason to jump on the
    train to Eindhoven. Working together with the incredible Iris, Hans and Liz was
    a wonderful opportunity, and I can only hope our paths will cross.


    My internship at Google Brain Berlin was a formative period. Sebastian, thank
    you for your mentorship and drive, as well as for Jakob. My fellow interns Kuba,
    Linh, Kevin and Jasper, Rodolphe, Florian and Stephan, for being amaz-'
