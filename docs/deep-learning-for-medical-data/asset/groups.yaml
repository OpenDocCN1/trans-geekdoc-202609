    ### ABLATION STUDY


    The local greedy training enabled by GIM provides a step towards biologically
    plausible optimization and improves memory efficiency. However, the autoregressive
    module $g_{ar}$ aggregates its inputs over multiple patches and employs Backpropagation
    Through Time (BPTT), which puts a damper on both benefits. In Table 5.4, we present
    results on the performance of ablated models that restrict the flow of gradients
    through time.


    In order to limit the flow of gradients through time, we modify the autoregressive
    module. In the autoregressive module $g_{ar}$ takes the current input $z_t$, as
    well as the hidden state of the previous-step $h_{t-1}$, in order to produce its
    output $c_t$, $c_t = g_{ar}(z_t, h_{t-1})$ (omitting the module-index $m$ for
    brevity). In the standard model, we block the flow of gradients to the previous
    module, such that $c_t = g_{ar}(\text{GradientBlock}(z_t), h_{t-1})$. In the ablation
    GIM without BPTT, we remove BPTT by blocking the flow of gradients between time-steps,
    such that $c_t = g_{ar}(\text{GradientBlock}(z_t), \text{GradientBlock}(h_{t-1}))$.
    For the ablation GIM without $g_{ar}$, we remove the autoregressive module entirely,
    the linear classifier is applied to the representation created by the last encoding
    module (i.e. $z_t$).


    In Table 5.4, we present the performance of the ablated models. Together, these
    two ablations indicate a crucial difference between the tested downstream tasks.
    For the phone classification task, we see a steady decline of the performance
    when we reduce the modeling of temporal dependencies, indicating their importance
    for solving this task. When classifying the speaker identity, reducing the modeling
    of temporal dependencies in the ablated models barely influences their performance.


    With the image classification results from Section 5.4.1, where no autoregressive
    model was employed either, this indicates that the GIM performs best on downstream
    tasks where temporal or context dependencies do not to be modeled by an autoregressive
    module. In these settings, GIM can outperform the CPC model, which makes use of
    end-to-end backpropagation, a global objective, and BPTT.


    ## INTERMEDIATE MODULE REPRESENTATIONS


    The greedy-wise training of GIM allows us to train arbitrarily models without
    ever running into a memory constraint. We investigate how the created representations
    develop in each individual module by training a linear classifier on top of each
    module and measuring their performance on the speaker classification task. With
    results presented in Figure 5.4, we first observe that each GIM improves upon
    the representations of its predecessor. Interestingly, CPC exhibits similar performance
    in intermediate modules despite these modules relying solely on the error signal
    from the global loss function on the last module. This is in stark contrast with
    the supervised end-to-end model, whose intermediate layers lag behind their greedily
    counterparts. This suggests that, in contrast to the supervised loss, the InfoMax
    principle "stacks well", such that the greedy application of the Info loss performs
    similar to its global application.


