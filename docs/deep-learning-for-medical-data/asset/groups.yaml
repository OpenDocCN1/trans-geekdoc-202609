    在 TIMIT 音频数据集上进行无监督训练，然后通过在其上方训练监督分类器来评估其性能。Gao 等人 (2018) 和 Veer Steeg Galstyan
    (2015) 探索了全相关性解释，这与互信息最大化有关，并证明它可以用于逐层训练。


    最近几项工作研究了在表示学习设置中利用互信息最大化（McAllister, 2018; Oord et al., 2018b; Hjem et al., 2019;
    Belghazi et al., 2018）。Poole 等人 (2018) 在共同框架下分析了这些近期工作，并强调 InfoNCE 以高偏差为代价表现出低方差，并提出了新的下界以平衡这种偏差/方差权衡。然而，在斑块间（inter-patch）互信息优化的背景下对这些改进边界的分析仍待完成，因此我们专注于原始的
    CPC InfoNCE，使学习到的表示偏向慢特征（Wiskott and Sejnowski, 2002）。


    在信息论框架之外，已经探索了用于无监督表示学习的上下文预测方法。语言处理中的突出方法是 Word2Vec (Mikolov et al., 2013)，其中单词直接给定其上下文（连续
    skip-gram）。同样，Doersch 等人 (2015) 研究了视觉领域的此类方法。类似地，图神经网络使用对比原理根据其邻居学习无监督嵌入（Nickel
    et al., 2011; Perozzi et al., 2014; Nickel et al., 2015; Kipf and Welling, 2016;
    Veličković et al., 2018）。噪声对比估计也被用于独立分量分析（Hyvarinen et al., 2018; Hyvarinen and
    Morioka, 2016; Hyvarinen and Morioka, 2017）。Schmidhuber (1992) 提出了一种方法，使单个特征最小化，使其无法从其他特征中预测，强制它们提取带有统计信息的独立因子，但风险是神经元可能会锁定输入中的局部独立噪声源。


    ## 5.6 结论


    我们提出了 Greedy InfoMax，这是一种新颖的自监督贪婪学习方法。较强的性能证明了深度神经网络在感知任务上并不一定需要监督损失的端到端反向传播。我们的建议实现了贪婪自监督训练，使得模型不易受到过拟合的影响，减少了梯度消失问题，并实现了内存高效的异步分布式训练。虽然我们提议的生物学合理性受到使用负样本和模块内反向传播的限制，但结果证明，生物感知网络中理论上的自组织在人工网络中至少是可行且有效的，为感知网络中的信度分配讨论提供了思路（Bengio
    et al., 2015; Linsker, 1988）。


