    $r(z_i = v_i)$ 为 $r(z)$ 实施各种有趣的形状。对于值 $v$，我们比较了...


    我们将我们的模型与带有 ReLU 激活的普通多层感知机（MLPs）、使用 Maxout 激活的 MCDdropout（Goodfellow et al.,
    2013; Chang and Chen, 2015）以及使用均值的信息颈模型进行对比²


    为了限制超参数对对比的影响，我们对所有变体和基准都使用了昂贵的超参数方案。具体而言，我们使用了自动化优化方法 TPE（Bergstra et al., 2011），每个模型最多进行
    100 次评估。超参数在 fashionMNIST（Xiao et al., 2017）上针对 2% 风险（δ=0.01）的覆盖率进行了优化，我们在另一个数据集
