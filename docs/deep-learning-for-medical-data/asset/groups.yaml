    introduced by Geifman and El-Yaniv (2017) to measure this. In summary, the SGR
    method uses a confidence score, e.g. the estimated probability of the prediction,
    and rejects the prediction if this score is below a certain threshold. This threshold
    is optimized on a held-out set to the tightest possible value that still guarantees
    a minimal error rate with high probability (e.g. 99%). SGR is formally proven,
    and empirically shown, to ensure this minimal error rate under i.d. assumptions.
    We propose to use SGR as evaluation metric for confidence estimation methods.
    Specifically, on a hold-out set we measure the percentage of predictions that
    are accepted by SGR under a specific guarantee, ie the coverage. To illustrate,
    one can imagine that a trivial solution to guarantee no errors is to reject all
    data-points, with 0% coverage. By lowering the confidence threshold, coverage
    goes up, but the accuracy of the method goes down. SGR finds the optimal threshold
    that ensures the accuracy does not drop below a predetermined threshold, and by
    measuring the coverage under this method we can effectively compute the real value
    of a confidence estimation methods.


