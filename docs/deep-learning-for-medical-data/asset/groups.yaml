    # 5

    # GREEDY INFOMAX


    Modern deep learning models are typically optimized using end-to-end back-propagation
    and a global, supervised loss function. Although empirically proven to be highly
    successful (Krizhevsky et al., 2012; Szegedy et al., 2015), this approach is considered
    biologically implausible. For one, supervised learning requires large labeled
    datasets to ensure generalization. In contrast, children can learn to recognize
    a new category based on a handful of samples. Additionally, despite some evidence
    for top-down connections in the brain, there does not appear to be a global objective
    that is optimized by backpropagation signals (Crick, 1999; Marblesstone et al.,
    2016). Instead, the biological brain is highly modular and learns predominantly
    based on local information (Caporale and Dan, 2008).


    In addition to lacking a natural counterpart, the supervised training of neural
    networks with end-to-end backpropagation suffers from practical disadvantages.
    Supervised learning requires labeled inputs, which are expensive to obtain. As
    a result, it is not applicable to the majority of available data, and suffers
    from a higher risk of overfitting, as the number of parameters required for a
    deep model often exceeds the number of datapoints at hand. At the same time, end-to-end
    backpropagation creates a substantial overhead, as the entire computational graph,
    including activations and gradients, needs to fit in memory.


    ## 5.1 INTRODUCTION


    In this paper, we introduce a novel learning approach, Greedy InfoMax (GIM). Drawing
    inspiration from biological constraints, we replace end-to-end backpropagation
    with a self-supervised method where each module is trained greedily using a local
    loss. This problem is perpetuated as end-to-end training does not allow for locality.
    Our contributions are as follows:


    - The proposed Greedy InfoMax algorithm achieves strong performance on audio and
    image classification.

    - This enables asynchronous training of neural networks, allowing for arbitrarily
    deep networks despite memory constraints.

    - We show that mutual information maximization is especially suited for downstream
    tasks.


    ## 5.2 BACKGROUND


    In order to create representations that are useful for downstream tasks, we assume
    that natural data exhibit so-called slow features (Wiskott and Sejnowski, 2002).
    A patch of a few milliseconds of speech shares information with neighboring patches
    such as the speaker identity, emotion, and phonemes, while it does not necessarily
    share these with random patches drawn from other utterances. Similarly, a small
    patch from a natural image shares many aspects with neighbors such as the depicted
    object or lighting conditions.


    Recent work (Oord et al., 2018b; Hjelm et al., 2019) proposed how we can exploit
    this to learn representations that maximize the mutual information among shared
    neighbors. In this work, we specifically focus on Contrastive Predictive Coding
    (CPC) (Oord et al., 2018b).


    To achieve this, CPC first processes the sequential input signal $x$ using a deep
    encoding model $g_{enc}(x_t) = z_t$, and additionally produces a representation
    $c_t$ that aggregates the information of all patches up to time-step $t$.


    ![img/3013a5e7af0c305d337644a32207e3ef_58_0.png]


    Figure 5.1: The Greedy InfoMax Learning Approach. (Left) For the self-supervised
    learning of representations, we stack a number of modules through which the input
    is forward-propagated in the usual way, but gradients do not propagate. Instead,
    each module is trained greedily using a local loss. **(Right)** Every module maps
    inputs $z_t^{m-1}$ at time-step $t$ to $g_{enc}(GradientBlock(z_t^{m-1})) = z_t^m$,
    which is used as the input for the next module. The InfoNCE objective is used
    for its greedy optimization. This loss is contrasted with the predictions of a
    module for its future representations $z_{t+k}^m$, which enforces each module
    to maximally preserve the information of its inputs. We optionally employ an additional
    autoregressive module $g_{ar}$, which is not depicted here.

