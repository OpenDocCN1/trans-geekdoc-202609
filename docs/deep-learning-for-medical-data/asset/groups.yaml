    # 10 INTRODUCTION


    rankings of correct and incorrect predictions, remains an active area of research.


    Deep Latent Variable Models (DLVMs, fig. 1.1) approach by postulating latent variables
    $z$ for which the uncertainty in $p(z|x)$ influences the confidence in the target
    prediction. Recent, efficient inference algorithms have been proposed in the form
    of variational inference, where an inference network is optimized to predict parameters
    of a variational distribution that approximates an otherwise intractable distribution
    (Kingma and Welling, 2013; Rezende et al., 2014; Alemi et al., 2016; Achille and
    Soatto, 2016).


    ![](img/3013a5e7af0c305d337644a32207e3ef_21_0.png)


    In part III we explore how to quantify uncertainty in deep learning. We approach
    this through the lens of the Information Bottleneck (IB), as proposed by Tishby
    et al. (2000). The information bottleneck $I(y,z; \theta) - \beta I(x,z; \theta)$
    is optimized to maximize the mutual information between $z$ and $y$, while minimizing
    the mutual information between $z$ and $x$ using a variational inference scheme
    as shown by Alemi et al. (2016) and Achille and Soatto (2016). Under the Markov
    assumption $p(z,x,y) = p(z|x)p(y|x)p(x)$, we derive the following bound:


    ```

    $I(y,z;;theta) - \beta I(x,z;;theta) \geq \mathcal{L} = \frac{1}{N}\sum_{n=1}^N
    E_{p(z|x_n)}[\log q_\theta(z|x_n)] - \beta D_{KL}[p_\theta(z|x_n)||r(z)],$

    ```


    where the expectation with respect to $E_{p(z|x_n)}$ is commonly estimated using
    a single Monte Carlo sample and $r(z)$ is a variational approximation to the marginal
    distribution $p(z)$. A common choice for $r(z)$ is a simple distribution such
    as a standard Normal. Alemi et al. (2016) and Achille and Soatto (2016) continue
    to show that the Variational Auto Encoder (VAE) Evidence Lower Bound (ELBO) proposed
    in Kingma and Welling (2013) and Rezende et al. (2014) is a special case of the
    IB when $y=x$ and $\beta=1$


    ```

    $I(z,i) - I(z,i) \geq E_{p(z|x_n)}[\log q_\theta(z|x_n)] - D_{KL}[p_\theta(z|x_n)||r(z)],$

    ```


    where $i$ represents the identity of data-point $x_i$. Interestingly, the VAE
    perspective considers the bound to optimize a variational distribution $q(z|x)$,
    while the IB prescribes that $q(z|x)$ in the ELBO is not a variational posterior
    but the true encoder $p(z|x)$, and instead $p(y|z)$ and $p(z)$ are the distributions
    approximated with variational counterparts. However, deriving the ELBO on a conditional
    posterior $p(y|x)$ leads to a KL divergence between the approximate posterior
    $q(z|x)$ and the real posterior $p(z|x)$, which is not available at test time,
    rather than the prior $p(z)$.


    Alternatively, equation 1.1 can be interpreted as a domain-translating beta-VAE
    (Higgins et al., 2016), where an input image is encoded into a latent space and
    decoded into the target domain. The Lagrange multiplier $\beta$ then controls
    the trade-off between rate and distortion, as argued by Alemi et al. (2017). However,
    this does not naturally arise from deriving the ELBO using Jensen''s inequality
    on the conditional likelihood $p(y|x)$.


    # Part I

    # Integrating Expert Knowledge


    # MOTIVATION AND SUMMARY


    Before the advent of deep learning, medical image analysis was approached with
    classical methods using handcrafted features designed by experts. As deep learning
    became the go-to method of building image recognition, expert knowledge has taken
    a step back. Due to successes of deep learning in the natural image domain (Krizhevsky
    et al., 2012), early medical deep learning works have come to rely on design decisions
    driven predominantly by their effect on the natural image domain. However, medical
    images are clearly different modalities and optimal applications of deep learning
    require careful consideration of all decisions.


    In this first part of the thesis, we will explore how expert knowledge about symmetries
    of a medical image can be exploited by neural network. Symmetries come about in
    various form, and the most typical example of a neural architecture that exploits
    symmetries is the convolutional neural network (CNN). CNNs exploit the fact that
    an image exhibits translational equivariance: a dog is a dog regardless of where
    it sits in the frame. Through the reuse of weights at all locations in the image,
    a properly designed CNN is constrained to this symmetry. In medical images however,
    different symmetries might exist. Such is the case with top-down microscopy: where
    a microscopic image can be viewed under rotation and mirroring without changing
    its meaning. Such an image is called rotationally equivariant. In chapter 4, we
    explore how recent advancements in group equivariant neural networks can be applied
    to such medical data, with great effectiveness. By careful reuse of filters and
    their resulting feature maps, we will demonstrate neural networks that are equivariant
    to 90 degree rotations and reflections in the horizontal and vertical plane, and
    we will show how this improve sample efficiency and accuracy when applied to a
    large-scale real world challenge of detecting malignant tissue in lymph node biopsies.
    We will close this part in chapter 3, where we present a novel dataset that we
    have proposed as part of research project. This dataset distills a proxy to a
    highly relevant real world problem.


    # ROTATION EQUIVANT CNNS FOR DIGITAL PATHOLOGY


    ## 2.1 INTRODUCTION


    The field of digital pathology is developing rapidly, following recent advancements
    in microscopic imaging hardware that allow digitizing glass slides into whole-slide
    images (WSIs). This digitization has facilitated image analysis algorithms to
    assist and automate diagnostic tasks. A proven approach is to use convolutional
    neural networks (CNNs), a type of deep learning model, trained on patches extracted
    from whole-slide images. The aggregate of these patch-based predictions serves
    as a slide-level representation used by models to identify metastases, stage cancer
    or diagnose complications. This performance is achieved using off-the-shelf CNN
    architectures originally designed for natural images (Litjens et al., 2017). The
    effectiveness of these models can be largely attributed to the efficient sharing
    of parameters in convolutional layers. As a result, local patterns are encoded
    independently of their spatial location, and shifting the input leads to a predictable
    shift in the output. This property, known as translational equivariance, effectively
    exploits the translational symmetry inherent in natural images leading to strong
    generalization.


    In contrast to natural images, WSIs exhibit not only translational symmetry but
    rotation and reflection symmetry as well. CNNs do not exploit these symmetries,
    and as a result are found empirically to spend a large part of their parameter
    budget on multiple rotated and reflected copies of filters (Zeiler et al., 2014).
    Additionally, we find that CNNs trained on histopathology data exhibit erratic
    fluctuations in predictions under input rotation and reflection. Enforcing equivariance
    in the model under these transformations is expected to reduce such instabilities,
    and lower the risk of overfitting by improving parameter sharing.


    To encode these symmetries, we leverage recent findings in rotation equivariant
    CNNs (Cohen and Welling, 2016; Worall et al., 2017; Weiss et al., 2017), a topic
    of interest in the machine learning community. These methods show strong generalization
    under limited dataset size and are more robust under adversarial perturbations
    in rotation, translation and local geometric distortions (Dumont et al., 2018).
    We propose a fully-convolutional patch-classification model that is equivariant
    to $90^{\circ}$ rotations and reflection, using the method proposed by Cohen and
    Welling (2016). We evaluate the model on the Camelion16 benchmark (Ehtesami Bejnordi
    et al., 2017), showing significant improvement over a comparable CNN on slide
    level classification and tumor localization tasks.


    As slide-level metrics obscure the relative performance of patch-level models,
    we further validate on a patch-level task. In this regime, there currently no
    benchmarks match the high volume, quality and variety of Camelion16. Thus, we
    present PatchCamelyon (PCam), a large-scale patch-level dataset derived from Camelion16
    data. Through this dataset, we demonstrate that the proposed model is more accurate
    and more robust under input rotation and reflection, compared to an equivalent
    standard CNN.


    The contributions of our work are as follows:

    - **(1)** we propose new deep learning model that utilizes symmetries inherent
    to histopathology$^{1}$,

    - **(2)** demonstrate that rotation equivariance improves model reliability and
    present a new large-scale histopathology dataset that enables model evaluation.


    **Related Work** A common approach to improve orientation robustness is to train
    CNNs using extensive data augmentation, perturbing data with random transformations
    (Liu et al., 2017; Litjens et al., 2017b). Although this may improve generalization,
    it fails to capture local symmetries and does not guarantee equivariance at every
    layer.


    $^{1}$ PCam details and data at https://github.com/basveeling/pcam. Implementations
    of equivariant layers available at https://github.com/basveeling/keras.gcnn.

