    | CPC | 76.0% | 75.6% | 75.7% |

    | CAE | 75.2% | 74.7% | 74.7% |

    | $\beta$-CVAE($beta = 0.01$) | 72.0% | 72.2% | 74.7% |

    | Random | 74.5% | 68.8% | 72.2% |

    | Fully Supervised | **87.1%** | 83.9% | 80.3% |

    | $P_4M$-DenseNet Veeling et al., 2018 | 89.8% | - | - |

    | DenseNet Veeling et al., 2018 | 88.1% | - | - |


    **Table 4.1:** PCam classification accuracy on test set. C2PC achieves near-supervised
    performance, while the prediction model is simply a linear logistic regression
