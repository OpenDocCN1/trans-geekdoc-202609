    在本文中中，我们重新审视了深度学习工具包的核心组件，并在医学图像分析的背景下对它们进行了重新评估。我们识别出深度学习存在短板的三个主要领域。在第一部分，我们探索了在模型中整合关于结构和约束的专家知识的优势。第二部分研究了深度学习模式如何更好地利用海量的未标记医学影像数据。最后，在第三部分中，我们探索了如何从模型中提取更好的不确定性估计以提供诊断风险。现在让我们考虑这项工作开始时提出的研究问题。


    **研究问题 1**：旋转反射等变性（roto-reflective equivariance）能提高大规模医学场景下深度学习模型的准确性和鲁棒性吗？


    某些医学影像问题带有对称性模式和干扰因素，这些因素在计算机视觉深度学习研究的真实图像中也常见。我们在病理学学的背景下探索了这个问题，用于检测转移组织的任务。利用
    CNN 框架，我们设计了一种新的架构来捕捉幻片图像的旋转对称性。这种新模型在计算成本和参数数量严格相等的情况下，也优于传统的 CNN 架构。此外，新模型被证明对扰动更具鲁性。我们可以得出结论：在适当的情况下，特别是在数据有限的情况下，以模型不变性的形式引入专家知识可以提高深度学习模型的鲁棒性和准确性。


    展望未来，我们认为自 Cohen 和 Welling（2016）以来，群等变神经网络的研究领域已经取得了进展。引入这些新方法来实现尺度等变、连续旋转等变性以及可能的颜色等变性，可能会进一步提高性能。然而，将专家知识作为先验整合到深度学习模型中的有效性仍然存在争议。正如
    Sutton（2019）在《痛苦的教训》中所讨论的，专家知识可能会阻碍深度学习模型发现决策问题的有效解决方案。历史上来看，受益于数据和计算规模的通用方法一直优于定制方法。GPT
    风格的语言模型几乎完全没有语言学的专业知识，但已被证明是极其有效的。引入不变性应该根据具体情况进行评估。随着模型和数据集的增大，我们可能会发现它们对性能的影响在递减。


    **研究问题 2**：我们该如何激励深度学习研究社区，针对真实的医学问题优化模型？


    为了帮助医学问题的深度学习研究，我们提议了 PCAM，这是一个源自 Camel16 的数据集。该数据集的结构类似于 CIFAR-10 等典型的深度学习基准测试。我们证明了在
    PCAM 基准上的改进。自发布以来，PCAM 一直是 Kaggle 挑战的焦点，配套论文至今已被引用了 175 次（Radford et al., 2021）。


    **研究问题 3**：医学影像深度学习模型是否受益于对比表示学习（contrastive representation）？


    接下来，我们研究了对比表示学习如何学习医学影像。我们发现 CPC 本身表现良好，但受到医学影像中干扰因素的影响。通过仔细整合特定任务的一组增强，我们发现了改进的表示，这在病理和
    X 光数据中都有更好的预测。


    **研究问题 4**：我们如何有效地优化深度学习模型？


    随着深度学习架构规模的扩大，构建训练基础设施的成本爆炸。为了实现跨整个网络的梯度反传播，计算节点需要高带宽通道连接并物理部署。我们发现提出的方法 GIM 优于其监督对应，并允许独立训练网络层。


    **研究问题 5**：潜变量量化能否实现更具表达力的场后验分布？


    最后，我们探索了不确定性问题。我们认为分推断使用了过于受限的近似后验类。基于此，我们提出了一种基于潜变量量化的新型场后验，称为 SQUAD。我们证明了该后验在
    DLVM 设置下可以有效训练，不需要批归一化，并能产生降低风险的质量。


    自此之后，量化作为一种连续领域建模的方法开始兴起。如 VQ-VAE（Oord et al., 2017b）等量化技术在图像生成工具 DALL-E 和强化学习中的分位数回归（Dabney
    et al., 2017b）中发挥了关键作用。这仍然是近似后验建模的一种有趣方法，可以在各种变分推断设置下进行。


    对深度学习进行适当贝叶斯处理仍在进行中。这一领域曾一度过，因为许多以贝叶斯方式训练深度学习模型的研究得负面结论（Wenzel et al., 2020）。最近，Chen
    等人（2024）证明了通过适配的优化器，从大型概率神经网络中获得良好校准的不确定性是可能的。


    ## 结语


    深度学习为医学图像分析和整个医学领域带来了极其令人兴奋的可能性。将专家知识捕捉到统计模型中使人类能够提高诊断质量。


