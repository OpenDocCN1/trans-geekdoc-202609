    on C2PC surprisingly increases slightly on the smaller label regimes. This can
    be explained as follows: The validation set of PCam is much closer to the training
    set, and its performance drops slightly as expected in the smaller label regimes.
    With fewer labels, the model overfits the training labels more quickly. As a result,
    the early-stopping method selects weights that end up more favorable for the test
