    # 48 | GREEDY INFOMAX


    ![](img/3013a5e7af0c305d337644a32207e3ef_59_0.png)


    **Figure 5.2:** Groups of 4 image patches (red square) that excite a specific
    neuron, at 3 levels in the model (rows). Despite unsupervised greedy training,
    neurons appear to extract increasingly semantic features. Best viewed on screen.


    using an autoregressive model $g_{ar}(z_{0:t}) = c_t$. Then, the mutual information
    between the extracted representations $z_{j+t}$ and $c_t$ of temporally nearby
    patches is maximized by employing a specifically defined probabilistic loss: Following
    the principles of Noise Contrastive Estimation (NCE) (Gutmann and Hyvärinen, 2010),
    CPC takes a bag $X = \{z_{t+k_1}, z_{t+k_2}...z_{t+k_{N-1}}\}$ for each delay
    k, with one "positive sample" $z_{t+k}$ which is the encoding of the input that
    follows k-steps after $c_t$, and $N-1$ "negative samples" $z_{j_n}$ which are
    uniformly drawn from all encoded input sequences.


    Each pair of encodings $(z_j, c_i)$ is scored using a function $f(\cdot)$ to predict
    how likely it is that the given $z_j$ is the positive sample $z_{t+k}$. In practice,
    Oord et al. (2018b) use a log-bilinear model $f_k(z_j, c_i) = \exp\left(z_j^T
    W_kc_i\right)$ with a unique weight-matrix $W_k$ for each k-steps-ahead prediction.
    The scores from $f(\cdot)$ are used to predict which sample in the bag $X$ is
    correct, leading to the InfoNCE loss:


    ```

    $$\mathcal{L}_N=-\mathbb{E}_k\left[\log \frac{f_k(z_{t+k}, c_t)}{\sum_{z_j\in
    X} f_k(z_j, c_t)}\right].$ (5.1)$$

    ```


    This loss is used to optimize both the encoding model $g_{enc}$ and the autoregressive
    model $g_{ar}$ to extract features that are consistent over neighboring patches
    but diverge between random pairs of patches. At the same time, the scoring model
    $f_k$ learns to use these features to correctly classify the matching pair. In
    practice, the loss is trained using stochastic gradient descent with minibatches
    drawn from a large dataset of sequences, and negative samples drawn uniformly
    from all sequences in the minibatch. Note, that no min-max issues are found in
    adversarial training.


    As a result of this configuration, one can derive the optimal solution for $f$
    is proportional to the density ratio (Oord et al., 2018b):


    ```

    $f_t(z_{t+k}, c_t) \propto \frac{p(z_{t+k}|c_t)}{p(z_{t+k})}. \quad (5.2)$

    ```


    This insight allows us to reformulate $\mathcal{L}_N$ as a lower bound on the
    mutual information $I(z_{t+k}, c_t)$, as demonstrated in the work of Oord et al.
    (2018b) and proven by Poole et al. (2018). Minimizing the loss $\mathcal{L}_N$
    thus optimizes the mutual information between consecutive patch representations
    $I(z_{t+k}, c_t)$, which in itself bounds the mutual information $I(x_{t+k}, c_t)$
    between the future input $x_{t+k}$ and the current representation $c_t$. Hyvarinen
    and Morioka, 2016 show that a similar patch-contrastive setup leads to the extraction
    of conditionally-independent components, such as Gabor-like filters in the early
    biological system.


    LAYER-WISE INFORMATION PRESERVATION IN NEUROSCIENCE


    Linsker (1988) developed the InfoMax principle in 1988. It theorizes that the
    brain learns to process its inputs by maximally preserving the information of
    the input activities in each layer. On top of this, neuroscience suggests that
    the brain predicts its future inputs and learns by minimizing this prediction
    error (Friston, 2010). Empirical evidence indicates, for example, that retinal
    cells carry significant mutual information between the current and the state of
    their activity (Palmer et al., 2015). Rao and Ballard (1999) indicate that this
    process may happen at each layer within the brain. Our proposal draws motivation
    from these theories, resulting in a method that learns to preserve the information
    between the input and the output of each layer by learning representations that
    are predictive of future inputs.


    # 5.3 GREEDY INFOMAX


    In this paper, we pose the question if we can effectively optimize the mutual
    information between representations at each layer of a model in isolation, enjoying
    the many practical benefits that greedy training (coupled, isolated training of
    parts of a model) provides. In doing so, we introduce a novel approach for self-supervised
    representation learning: Greedy InfoMax (GIM). As depicted on the left side of
    Figure 5.1, we take a conventional deep learning architecture and divide it by
    a stack of M modules. This decoupling can happen at the individual layer level
    or, for example, at the level of blocks found in residual networks (He et al.,
    2016b). Rather training the end-to-end, we prevent gradients from flowing between
    modules and employ a local-supervised loss.


    As shown on the right side of Figure 5.1, each encoding $z_{enc}$ within the architecture
    maps the output from the previous module $z_{m-1}$ to an encoding $z_m$. Oord
    et al. (2018b) propose to use the output of an autoregressive model to contrast
    against $z_{j}$. However, our preliminary results showed that this did not improve
    if applied at every module. We therefore train each module using the following
    loss:


    ```

    $$\mathcal{L}_N=-\mathbb{E}_k\left[\log \frac{f_k(z_{t+k}, c_t)}{\sum_{z_j\in
    X} f_k(z_j, c_t)}\right].$ (5.3)$$

    ```


    After convergence of all modules, the scoring functions $f_k$ are discarded, leaving
    a conventional feed-forward network. In practice, the loss is trained using stochastic
    gradient descent with minibatches drawn from a large dataset of sequences, and
    negative samples drawn uniformly from all sequences in the minibatch. Note, that
    no min-max issues are found in adversarial training.


    In practice, Oord et al. (2018b) use the InfoNCE loss:


    ```

    $f_k(z_j, c_i) = \exp\left(z_j^T W_kc_i\right)$

    ```


    As a result of this configuration, one can derive the optimal solution for $f$
    is proportional to the density ratio (Oord et al., 2018b):


    ```

    $f_t(z_{t+k}, c_t) \propto \frac{p(z_{t+k}|c_t)}{p(z_{t+k})}. \quad (5.2)$

    ```


    This insight allows us to reformulate $\mathcal{L}_N$ as a lower bound on the
    mutual information $I(z_{t+k}, c_t)$, as demonstrated in the work of Oord et al.
    (2018b) and proven by Poole et al. (2018). Minimizing the loss $\mathcal{L}_N$
    thus optimizes the mutual information between consecutive patch representations
    $I(z_{t+k}, c_t)$, which in itself bounds the mutual information $I(x_{t+k}, c_t)$
    between the future input $x_{t+k}$ and the current representation $c_t$.


    ## ITERATIVE MUT INFORMATION MAXIMIZATION


    Similarly to the InfoNCE loss in (5.1), our module-local InfoNCE loss maximizes
    a lower bound on the mutual information $I(z_{t+k}, c_t)$ between nearby representations,
    encouraging the extraction of slow features.


    ## PRACTICAL BENEFITS


    Applying GIM to high-dimensional inputs, we can optimize each module in sequence
    to decrease the memory costs during training. In the most memory-constrained scenario,
    individual modules can be trained, frozen, and their outputs stored as a dataset
    for the next module, which effectively removes the depth of the network as a factor
    of the memory complexity.

