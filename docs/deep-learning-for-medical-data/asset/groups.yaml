    2011）上进行评估。关于所评估搜索空间和所选超参数的细节，请参考附录。


    ² 所有模型使用 ADAM（Kingma and Ba, 2014a）进行优化、He 等人（2015）提出的权重初始化、10⁻³ 的权重衰减以及在验证准确率未提高
    10 个 epoch 的自适应学习率衰减方案¹，并在未改进 20 个 epoch 后提前停止¹。


    ³ 我们发现在隐变量数量相同的情况下，该基准模型相比传统的 ReLU MCDdropout 模型性能更强。


