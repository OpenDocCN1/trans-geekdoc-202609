    **研究问题 3：** 医学影像深度学习模型是否受益于于对比预测编码（contrastive predictive coding）的自监督表示学习？


    医学影像数据并不匮缺，因为全球的医院每天都会采集大量数据。这些图像被存储在名为 PACS 的中心化存储系统中，现代医院已经配备了以自动化方式处理这些数据的系统。医学数据的挑战在于收集专家标签。这是一个昂贵的过程，需要多位“金标准”专家参与并达成共识。因此，利用未标记数据对于该领域来说是一个非常有前景的方法，因为标注数据与未标记数据的比例极度失衡。在论文的第二部分，我们探索了一种新的无监督表示学习技术，使得深度学习模型的大部分可以在不依赖下游层的情况下进行训练，以提高标签效率。


    **研究问题 4：** 我们是否可以在没有端到端反向传播的情况下有效优化深度学习模型？继续未标记数据的话题，我们探索了是否可以以贪心的方式进行无监督训练：即训练神经网络的单个层，而不通过整个网络进行反向传播。这种训练形式对医学图像神经网络特别有利。首先，无监督训练减轻了医学专家的标注负担。其次，每次只训练一层所需的内存比训练整个网络少几个数量级。最后，模型可以在大型医学图像的小裁剪块上进行训练，这在处理
    3D 或 4D 数据时尤为有效。


    **研究问题 5：** 隐变量量化是否能产生更好的置信度评分？深度决策受益于对特定预测置信度的准确表示。由于深度学习往往容易过度自信，研究能更好地捕捉不确定性的方法对医学影像具有高度相关。在第三部分，我们研究了深度隐变量模型中的变分推理（variational
