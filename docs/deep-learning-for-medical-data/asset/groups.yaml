    ### Feature visualization


    In Figure 4.1 we visualize the 8 most predictive features extracted from a large
    input image spanning multiple patches. We find that CPC-based features appear
    much smoother than those learned in a fully supervised manner. This hints at the
    features being useful for other forms of tissue classification tasks as well.

