    # CONCLUSION


    mance further. However, the effectiveness of integrating expert knowledge as priors
    in a deep learning model remains a point of contention. As discussed in the bitter
    lesson, Sutton, 2019, expert knowledge might hamper a deep learning model from
    discovering efficient solutions to a decision problem. General methods that benefit
    from scale in data and compute have historically outperformed custom methods.
    GPT-style language models contain little to no expertise from linguistics, and
    have proven to be highly effective. Incorporating invariants should be evaluated
    on a case-by-case basis. And as the size of models and datasets grows, we might
    find that they provide a diminishing impact on performance.


    **Research Question 2:** How can we motivate the deep learning research community
    to optimize models for real medical problems?


    To aid the study of deep learning for medical problems, we proposed PCAM, a dataset
    derived from Camel16. This dataset is structured similarly to typical deep learning
    benchmarks such as CIFAR-10. We demonstrate improvement on the PCAM benchmark
    translates to improvements on the large-scale Camel16 benchmark. Since its release,
    PCAM has been the center of a Kaggle challenge, with 1149 teams competing to improve
    performance on the challenge. The accompanying paper has been cited 175 times
