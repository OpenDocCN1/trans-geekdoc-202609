    # MOTIVATION AND SUMMARY


    Before the advent of deep learning, medical image analysis was approached with
    classical methods using handcrafted features designed by experts. As deep learning
    became the go-to-method of building image recognition models, expert knowledge
    has taken a step back. Due to successes of deep learning in the natural image
    domain (Krizhevsky et al., 2012), early medical deep learning works have come
    to rely on the design decisions driven predominantly by their effect on the natural
    image domain. However, medical images are clearly different modalities and optimal
    applications of deep learning in this domain require careful consideration of
    all decisions that determine a deep learning method''s design.


    In this first part of the thesis, we will explore how expert knowledge about the
    symmetries of a medical image can be exploited by a neural network. Symmetries
    come about in various form, and the most typical example of a neural architecture
    that exploits symmetries is the convolutional neural network (CNN). CNNs exploit
    the fact that an image exhibits translational equivariance: a dog is a dog regardless
    of where it sits in the frame. Through the reuse of weights at all locations in
    the image, a properly designed CNN is constrained to honor this symmetry.


    In medical images however, different symmetries might exist prevalent in the natural
    domain. Such is the case with top-down microscopy: where the sky is always up
    in the natural world, a microscopic image can be viewed under any rotation and
    mirroring without changing its semantic meaning. Such an image is called rotationally
    equivariant. In chapter 4, we explore how recent advancements in group equivariant
    neural networks can be applied to such medical data, with great effectiveness.
    By careful reuse of filters and their resulting feature maps, we will demonstrate
    neural networks that are equivariant to 90 degree rotations and reflections in
    the horizontal and vertical plane, and we will show how this improve sample efficiency
    and accu'
