    # 第二部分


    # 无监督学习


    ## 动机与总结


    医学数据通常被认为极难获取，但事实远非如此。事实是，医院正以惊人的速度获取医学影像数据，且这些数据已经集中存储在庞大的图像归档和通信系统（PACS）中。现代学术医院已经配备了相关系统，允许在当天获取的数据上对统计模型进行优化。相反，主要的挑战在于高质量标注的获取，以及分发敏感个人数据时带来的隐私考量。虽然隐私问题可以通过联邦学习（Rieke
    et al., 2020）和差分隐私（Abadi et al., 2016）的进展得以解决，但专家知识的成本仍未解决。此外，专家和学术医院在不同人口统计学特征之间的分布不均，导致了对影响世界富裕地区人群疾病产生预测偏见的风险。


    在第 ?? 章中，我们探索了自监督表示学习如何受益于医学领域。


    在第 5 章中，我们探索了如何将这种无监督训练扩展到大到无法放入内存的数据领域。


    # 4 对比扰动预测性编码


    ### 4.1 无监督特征提取


    近年来，大量的医学影像数据已可用于开发基于数据的模型。然而，这些数据大部分是无标记的。因此，人们对特征提取模型的无监督训练的兴趣日益增加。目前的方法依赖于某种形式的生成模型：编码器/判别器学习一种表示，解码器/生成器生成图像。两个模型都经过优化以改进真实图像的生成。在实践中证明，与使用大型标记数据集进行全监督训练模型相比，这些表示的有效性是有限的。


    最近，另一种形式的无监督特征学习——**无监督学习**重新引起了人们的关注。它不是优化特征使得生成模型能够重现原始输入，而是优化特征使得对比模型能够区分连续的特征对与随机特征对。在最近的
    Oord et al., 2018 中，这被证明可以提取出对医学分类、说话人识别和语音转录非常有效的特征。在训练特征提取器后，只需要少量的标签即可在顶层训练线性分类器。这种方法通常被称为对比预测性编码（Contrastive
    Predictive Coding, CPC）Oord et al., 2018a。


    在这项工作中，我们探索了 CPC 在医学影像数据上的表现，重点关注了病理学数据集 PCam（Veeling et al., 2018）和骨 X 光数据集 MURA（Rajpurkar
    et al., 2017）。我们发现该方法受到此类数据中非平稳性噪声以及训练集与测试集之间领域偏移的影响。因此，我们提出了一种方法，对医学图像中常见的每个后续共同变化和真实变形进行扰动。在下，我们将这种方法称为对比扰动预测性编码（C2PC）。我们进一步探索了从同一子域内部（例如来自单个患者的数据）与完整数据集抽取对比示例的效果，并发现前者可以改进结果。最后，我们证明了基于
    C2PC 衍生特征训练的线性预测模型即使在面对 1/512 的可用训练数据时也表现良好。


    ![](img/3013a5e7af0c305d337644a32207e3ef_45_0.png)


    **图 4.1：**（放大细节）。全监督模型学习的病理学特征（顶部）、CPC（中间）以及提出的 C2PC 方法（底部）。**左侧：**预测恶性概率图（更亮）。**右侧：**每个像素代表单个块的特征图。C2PC
    允许在孤立的情况下学习随多个块平滑变化的特征。相比之下，全监督特征看起来高度相关且充满噪声。


    ### 4.2 对比预测编码


    对比预测编码（Contrastive Predictive Coding, CPC）是一种由 Oord et al. (2018) 最近提出的通用无监督特征提取深度学习技术。它建立在对比估计（Wiskott,
    2002）的基础工作之上，已被证明在图像分类、说话人分类以及强化学习等多个领域都是有效的。CPC 构建在时间序列中随时间和空间缓慢变化的有趣特征的概念之上。它与非线性方法的区别在于，它是联合比较特征向量，而不是逐个比较，这消除了模型学习独立特征的需求。此外，它通过对块对是否连续进行二分类，增加了任务难度。


    想象来自较大输入数据的块：两个连续的块共享了下游模型相关的大部分信息。CPC 的利用方式如下：从感兴趣的块开始，将该块与随机块放在一起池中。对比模型使用共享的特征提取模型将感兴趣块与池中的每个块进行比较。当无法预测池中哪个是连续块时产生误差。该损失随后使用传统的梯度下降方法进行优化，同时训练特征提取模型和对比分类模型。这强制特征提取模型提取区分连续块的特征，并防止其学习提供块信息的平凡特征，如局部因子和噪声。


    CPC 的一个主要缺点是特征模型会关注任何形式的非平稳信号，使得对比模型能够高效检测相邻块。CPC 的底部有一个聚合模型 $z = a(-)$，它将输入 $x_t$
    通过参数 $\theta$ 转换为特征向量 $z_t = e_{\theta}(x_t)$。我们将此称为对比模型。想象来自较大输入数据的块：两个连续的块共享了下游模型相关的大部分信息。CPC
    的利用方式如下：从感兴趣的块开始，将该块与随机块放在一起池中。对比模型使用共享的特征提取模型将感兴趣块与池中的每个块进行比较。当无法预测池中哪个是连续块时产生误差。该损失随后使用传统的梯度下降方法进行优化，同时训练特征提取模型和对比分类模型。这强制特征提取模型提取区分连续块的特征，并防止其学习提供块信息的平凡特征，如局部因子和噪声。


    CPC 的一个主要缺点是特征模型会关注任何形式的非平稳信号，使得对比模型能够高效检测相邻块。如果数据包含非平稳伪影，特征模型可能会学习这些内容，而不是有见地的特征。我们在下一节中提出的解决方案。想象来自较大输入数据的块：两个连续的块共享了下游模型相关的大部分信息。我们使用以下公式对连续块对进行评分：


    $$f_W(z_a, z_b) = \exp(z_a^T W_b) \quad (4.1)$$


    我们将此称为对比模型。对比模型通过选择最小化该损失的块进行训练：


    $$\mathcal{L} = -\log \frac{f(z_l, z_{l+1})}{\sum_{z_i \in \mathcal{X}} f(z_l,
    z_i)} \quad (4.2)$$


    为了进一步提高特征的预测质量，通过联合训练多个对比模型来对比提前若干步的块。我们可以为每个步长 $k$ 学习一个 $f_k(\cdot)$，同时使用相同的特征提取模型。由于较大的步长增加了任务难度，我们引入了在步骤间共享的聚合模型
    $c_l = a(z_0, \dots, z_l)$。这允许对比模型 $f_{W_k}(c_l, z_{l+k})$ 考虑编码进 $c_l$ 的信号短期历史，以预测池中哪个块
    $z_i$ 是连续的。这导致了损失：


    $$\mathcal{L}_{CPC} = -\sum_k \log \frac{f(c_l, z_{l+k})}{\sum_{z_i \in \mathcal{X}}
    f(c_l, z_i)} \quad (4.3)$$


    为了将该方法扩展到2D 图像，我们必须对图像上的块引入任意排序。我们可以考虑一种自上而下的方法，即对比焦点块下方的块。在 2D 领域，上下文聚合模型 $c
    = a(-)$ 可以呈现为轻微的自回归 PixelCNN 风格（Oord et al., 2016）神经网络，其中我们仔细地维持一个仅由焦点块上方及侧面 $w$
    步块组成的感受野，$z_{i,j} = a(z_{y\le i, x=j\pm w})$。

