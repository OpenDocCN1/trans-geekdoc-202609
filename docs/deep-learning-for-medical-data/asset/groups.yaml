    ## 4.3 对比扰动预测编码 (CPC)


    为了缓解 CPC 特征塌陷到非平稳干扰信号的问题，我们利用了专家驱动的数据增强见解。众所周知，相同的数据增强技术可以提升多种基于深度学习的医学影像方法的性能，例如
    Liu 等，2017；Ronneberger 等，2015。


    我们将确定性的输入图像 $x$ 替换为从由专家确定的随机扰动函数 $r(\cdot)$ 中抽样的随机变量 $x \sim r(x)$。$r(\cdot)$
    定义了输入空间中数据点周围区域的分布。在下游预测任务任务的语境下，该区域被认为等同于 $x$。$r(\cdot)$ 可能包括颜色扰动、弹性形变、人工测量噪声和伪影、微小平移和旋转等。我们从
    $r(x)$ 中提取了两个样本 $(x^1, x^2)$。第一个样本用于计算 $c$，第二个样本用于计算对比模型使用的特征 $z$。


    通过仔细使用能够保持补块（patches）顺序的增强方法，特征提取模型被迫学习对扰动不不变的或可以被线性对比模型一致匹配的特征。这为对称模式的专家知识注入特征提取模型提供了一个简单的向量方法，而无需使用昂贵的等变性方法（Veeling
    等，2018）在神经网络中强制执行这些对称性。


    ## 4.4 相关工作


    在医学图像分析领域，减少专家所需的标注负担是一个贯反复出现的主题。在利用深度神经网络架构时，一种常用技术是使用在 ImageNet 上训练的权重（Rajpurkar
    等，2017）。然而，这种方法具有局限性，因为医学影像的局部和全局统计数据与 ImageNet 中看到的照片大不同。近期在大型组织病理数据集上训练深度模型的工作发现，ImageNet
    预训练并不能提高性能（Liu 等，2017）。


    除了借用权重，生成式模型也被用于预训练特征模型，使用的方法如（卷积）变分自编码器（CVAE;（Sedai 等，2017；Uzunova 等，2018）以及它们的非变分对应物。同样地，GAN
    的变体也被探索用于预训练和特征提取（Donahue 等，2016）。另一个感兴趣的领域是使用自监督损失，例如解决从图像中抽取的补块的拼图问题（Noroozi
    和 Favaro，2016）；从灰度图像中预测颜色通道（Larsson 等，2016；Vondrick 等，2018）以及修复从输入图像中移除的小窗口（Pathak
    等，2016）。


    同时，Tellez 等（2018）和 Lu 等（2019）探索了用于全片图像（Whole Slide Images）的对比训练。虽然他们只关注组织病理数据，但我们展示了在骨骼
    X 光异常检测任务上的额外结果。此外，我们强调了对比训练期间大量数据增强的重要性，以及补块来源的选择，见表 4.1。


    ## 4.5 实验


    ### 4.5.1 数据集


    我们在两个具有挑战性的大规模医学影像数据集上评估了 CPC 和 CPC：组织病理数据集 PCam（Veeling 等，2018；Ehtesami Bejordi
    等，2017）和骨骼 X 光异常检测任务 MURA（Rajpurkar 等，2017）。在接下来的章节中，我们将证明 CPC 学习到的特征在多大程度上允许线性分类器在这两个基准上达到竞争性性能。我们将
    CPC 与全监督模型、卷积（变分）自编码器（CVAEs，使用带有 L2 重建损失的残差线性上采样解码器训练）以及随机初始化的特征模型进行比较。此外，我们将探索对比训练期间大量数据增强的重要性，以及补块来源的选择。


    ### 数据增强与预处理


    对于无监督方法，我们使用以下数据增强：

    在对比训练期间，我们增加数据增强，方法包括：

    - 颜色扰动（对比度、色调、饱和度）。

    - 弹性形变。

    - 随机旋转（最高 15 度）。

    - 随机平移（最高 5 像素）。

    - 亮度噪声。

    - 亮度伪影。

    - 随机水平和垂直翻转。


    ### 超参数


    我们在训练对比模型时，从同一切片（WSL）内部抽样对比样本，batch size 为 256。对于 $\lambda$，我们根据从同一切片内部抽样的对比样本进行设置。对于激活函数，我们使用
    ReLU。对于池化层，使用全局平均池化。对于输出，我们使用 tanh。


    ## 4.2 PCam: 组织病理学分类


    PCam 包含恶性组织的图像。对于 CPC 和 C2PC，我们从同一切片内部抽样的对比样本进行实验。结果如表 4.1 所示：


    | 方法 | 所有标签 | 1/128 标签 | 1/512 标签 |

    | :--- | :--- | :--- | :--- |

    | C2PC 同一切片 | 84.3% | 85.2% | 85.2% |

    | C2PC | 83.5% | 84.3% | 82.4% |

    | CPC 同一切片 | 76.8% | 76.0% | 75.2% |

    | CPC | 76.0% | 75.6% | 75.7% |

    | CAE | 75.2% | 74.7% | 74.7% |

    | $\beta$-CVAE ($\beta=0.01$) | 72.0% | 72.2% | 74.7% |

    | 随机 | 74.5% | 68.8% | 72.2% |

    | 全监督 | **87.1%** | 83.9% | 80.3% |

    | $P_4M$-DenseNet Veeling 等，2018 | 89.8% | - | - |

    | DenseNet Veeling 等，2018 | 88.1% | - | - |


    **表 4.1:** 测试集上的 PCam 分类精度。C2PC 达到了接近监督的性能，而预测模型只是简单的线性回归模型。结果见表 4.1 并在下方讨论。


    ### 不同对比源的影响


    不同实验室采集的组织病理切片外观差异巨大。每个实验室在切片染色质量方面都有不同的方案，而且每个切片数字化设备都有独特的伪影和测量噪声。即使是来自同一实验室的切片之间也可能发生分布偏移。我们探索是否可以通过仅从同一切片（WSL）抽取对比样本来引导
    CPC 学习更具领域鲁棒性的特征。我们假设在这种情况下，CPC 提取跨领域有效的特征更为有效，因为区分不同区域的特征没有提供价值。在表 4.1 中，我们比较了
    C(2)PC 在两种情况下的表现（Same WSL 表示仅在 MSI 内部抽样）。我们发现，仅与同一切片的补块进行对比会略微提高性能。


    ### C2PC 与 CPC


    C2PC 比 CPC 有显著的性能提升，我们将其归因于假设噪声和基于专家知识的扰动鲁棒性。在标签较少的情况下，C2PC 的测试集性能意外略有增加。这可以解释为：PCam
    的验证集与训练集非常接近，在标签较少的情况下，其性能正如预期那样下降。由于标签较少，模型更快地过拟合了训练标签。因此，早停止方法选择权重对测试集更有利。


    ### 特征可视化


    在图 4.1 中，我们可视化了从跨多个补块的大图像中提取的 8 个最具预测性的特征。我们发现基于 CPC 的特征比以全监督方式学习的特征平滑得多。这暗示了这些特征对于其他组织分类任务也有用。


