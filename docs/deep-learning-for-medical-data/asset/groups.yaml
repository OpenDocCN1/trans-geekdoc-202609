    # 6.3.1 Main results


    We start our analysis by comparing the predictive uncertainty of 2-layer models
    with 32 latent variables per layer. In figure 6.4 we visualize the risk/coverage
    trade-off achieved using the predicted uncertainty as a selective threshold, and
    present coverage results in table 6.1. Overall, we find that SQUAD performs significantly
    better than plain MLPs and deep Gaussian IB models, and quantitatively attribute
    this to the increased flexibility of the multinomial distribution. Compared to
    a MCDropout model with a similar number of weights, SQUAD appears to have a slight
    |though not significant| advantage, despite the strong quantization scheme, especially
    at low risk guarantees. Deep ensembles improves results for all methods, which
    fits the hypothesis that ensembles integrate over a form of weight uncertainty.
    When comparing the optimal hyperparameters found for fashionMNIST on the similar
    notMNIST dataset, we find that SQUAD shows strong performance, as shown in table
    6.2. This provides some evidence despite the increase in number hyperparameters
    in SQUAD, the optimal settings are more robust to a change in the data distribu-.


    # 6.3.2 Natural Images


    To explore larger models trained on natural image datasets, we re-tune hyperparameters
    on 256-latent 2-layer models over 100 TPE evaluations. As SVHN contains natural
    images in color, we anticipate a need for a higher amount of information per variable.
    We thus explore the effect of the matrix-factorized variant.


    As shown in table 6.3, SQUAD-factorized outperforms the non-factorized variant.
    Considering the computational cost at the optimum of a 4-neuron factorization
    ($B = 4$) with $C=37$ quantization bins, the model clocks 3.4 million weights.
    In comparison, the optimum for the presented MCdropout results has $C=11$, using
    9.0 million weights. On an NVIDIA Titan X, the dropout baseline takes 13s per
    epoch on average, while SQUAD-factorized spans just 9s.'
