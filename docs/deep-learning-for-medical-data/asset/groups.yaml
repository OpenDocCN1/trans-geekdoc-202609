    确保这种方法可以推广到测试集。与之独立的是，Liu 等人 (2017) 和 Cires 等人 (2013) 提出了一种测试时增强策略，通过对 90° 旋转和镜像版本的预测进行平均处理，以提高对取向引起的不稳定性的鲁棒性。缺点是，这计算成本增加了
    8 倍，且无法提供等变性保证（Lenc et al., 2015）。


    能够在旋转和其他变换下实现等变性的方法包括谐波网络（Harmonic Networks, Worstall et al., 2017），它将滤波器集限制为圆形谐波，允许实现全
    360° 等变。Weiler 等人 (2017) 使用了可转向滤波器并均匀地采样了少量旋转。在这项工作中，我们关注来自 Cohen 和 Welling (2016)
    的应用于离散旋转/反射组的简单 G-CNN 方法。这些组并没有涵盖 WSI（全幅图像）中固有的完整连续旋转对称性，但目前收集的经验证据表明，90° 旋转等变可以显著提高性能（Weiler
    et al., 2017）。


    ## 2.2 方法


    ### 2.2.1 背景


    在 Cohen 和 Welling (2016) 引入的 CNN 和 G-CNN 数学模型中，输入图像和输出分割掩码被视为函数 $f: Z^2 \rightarrow
    R^K$，其中 $K$ 表示通道数，且隐含假设 $f$ 在某些矩形区域外为零。输入 $f$ 与滤波器 $\psi$ 的标准*卷积*定义为：


    ```

    $[f * \psi](x) = \sum_{y \in Z^2} \sum_{k=1}^{K} f_k(y)\psi_k(x-y). \quad (2.1)$

    ```


    G-CNN 是 CNN 的推广，它们在更通用的对称群下具有等变性，例如 90° 旋转群 $G = p4$，或者额外包含反射的群 $G = p4m$。在 G-CNN
    中，特征图被认为是该群上的函数。对于 $p4$ 和 $p4m$，这简单意味着特征通道以 4 个或 8 个一组出现，对应于 $p4$ 中的 4 个纯旋转或 $p4m$
    中的 8 个旋转反射。


    ![](img/3013a5e7af0c305d337644a32207e3ef_31_0.png)


    **图 2.1：** 给定一个标准输入和一个旋转后的副本，我们展示了 2 层 G-CNN 如何在 $p4$ 中具有等变性。图中显示了一个内核层的特征图，蓝色虚箭头表示两个输入的（中间层）表示是如何响应的。$Z^2
    \rightarrow p4$ 卷积将输入与同一卷积核的 4 个旋转版本相关联。$p4 \rightarrow p4$ 卷积将生成的特征图与 p4 卷积核相关联，并对每个取向循环位移和旋转卷积核。最后层表示对取向进行平均池化，产生一个局部对旋转不变且全局对旋转等变的表示。在
    $p4$ 上进行全局平均池化将产生一个全局对平移和旋转均不变的表示。


    在第一层中，这些是使用 $(Z^2 \rightarrow G)$-卷积产生的：


    ```

    $[f * \psi](g) = \sum_{y\in Z} \sum_{k=1}^K f_k(y)\psi_k(g^{-1}y), \quad (2.2)$

    ```


    $g = (r, t)$ 是旋转平移（在 $G = p4$ 的情况下）或旋转反射平移（在 $G = p4m$ 的情况下）。


    在后续层中，特征图和滤波器都是 $G$ 上的函数，它们使用 $(G \rightarrow G)$-卷积组合：


    ```

    $[f * \psi](g) = \sum_{h\in G} \sum_{k=1}^K f_k(h)\psi_k(g^{-1}h). \quad (2.3)$

    ```


    在最后一层，使用组池化层来确保输出对于旋转是等变的（对于分割任务）或不变的（对于分类任务）。在图 2.1 中我们展示了非线性激活和池化操作在 $p4m$ 下是等变的。


    ### 2.2.2 G-CNN DenseNet 架构


    所提出的块分类模型在图 2 中所示。该架构基于密集连接网络（DenseNet）（Huang et al., 2016），它由密集块组成，交替 $1 \times
    1$ 卷积层和 $2 \times 2$ 步长池化。由于感受野的限制，我们在每个密集块使用一层。模型对输入进行 $2^s$ 倍的空间池化，其输出类似于 Liu
    等人 (2017) 中的分辨率。


    全模型等变性通过将所有卷积层替换为等变版本来实现（$p4$）。归一化层（Loffe and Szegedy, 2015）通过聚合每个组的特征图量而不是空间特征图来实现组等变。消除了零填充。最后层由一个组池化层随
    sigmoid 激活函数组成，在 $Z^2$ 平面上产生肿瘤概率输出。


    由于模型是全卷积的，在测试时可以通过重用相邻块的计算来实现高效推理，在 NVIDIA Titan XP 上全 WSI 的分割时间从几小时缩短到约 2 分钟。


    ## 2.3 实验结果


    ### 2.3.1 数据集与评估


    为了评估所提出的模型，我们使用了 Camelyon16（Ehtesami Bejnordi 等., 2017）和 PCam。在 BreakHis（Spanhol
    et al., 2016）上进行了额外的测试。（1）Camelyon16 数据集包含 400 张哨点淋结的 H&E 染色 WSI，分为 270 张具有像素级标注的切片用于训练，130
    张未标记切片用于测试。这些切片是在两个中心使用 40 倍物镜采集并数字化的（像素分辨率为 0.243 微米）。Camelyon16 挑战使用 FROC 曲线对肿瘤定位进行评估。（2）PCam
    数据集包含来自 Camelyon16 的 327,680 个块，在 10 倍放大率下大小为 $96 \times 96$ 像素，采用 $75/12.5/12.5\%$
    的训练/验证/测试划分，这是使用硬负样本挖掘策略创建的。（3）


