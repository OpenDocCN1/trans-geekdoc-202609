    # MOTIVATION AND SUMMARY


    Medical data is often thought to be scarcely available, but this is actually far
    from the truth. The fact is that hospitals acquire medical imaging data at mind-boggling
    rates, and this data is already centrally stored in vast Picture Archiving and
    Communication Systems (PACS). Modern academic hospitals have systems in place
    that allow optimization of statistical models on data that was acquired that same
    day.


    Rather, it''s the acquisition of high-quality labeling that poses the main challenge,
    as well as the privacy considerations that come with distributing sensitive personal
    data. While the privacy problem can be solved with advancements in federated learning
    (Rieke et al., 2020) and differential privacy (Abadi et al., 2016). The cost of
    expert knowledge remains unsolved. Moreover, the lopsided distribution of experts
    and academic hospitals among varying demographics poses a risk of predictive bias
    towards ailments affecting affluent areas of the world''s population.


    In chapter ?? we explore how self-supervised representation learning can benefit
    the medical domain.


    In chapter 5 we explore how one can extend this unsupervised training towards
    data domains that are too large to fit in memory.'
