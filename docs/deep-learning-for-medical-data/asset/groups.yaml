    else. Biyam, Ulf, Stojan, Dimitrios, Harold, Nicola, Karan, Vlado, Shakith, Karl,
    and Fritz, for many joyful brainstorming sessions, discussions, introductions
    and demonstrations of real messy wet science.


    I also have to thank Franks and Bart for introducing me to Ruud van Sloun, whom''s
    contagious optimism and out of the box thinking at the most welcome time. Our
    collaborations were a great source of joy and ever more reason to jump on the
    train to Eindhoven. Working together with the incredible Iris, Hans and Liz was
    a wonderful opportunity, and I can only hope our paths will cross.


    My internship at Google Brain Berlin was a formative period. Sebastian, thank
    you for your mentorship and drive, as well as for Jakob. My fellow interns Kuba,
    Linh, Kevin and Jasper, Rodolphe, Florian and Stephan, for being amazing collaborators.
    It was great to work alongside Thomas, Alexey, Aravind, Aidan, Sebastian and many
    others. Durk, thank you for honoring one of my more speculative research ideas.
    Continuing as a student researcher in Amsterdam was a dream come true and I have
    to thank Tim especially for my guidance and support. All my colleagues at Google
    Brain Amsterdam were a great source of inspiration and aspiration, including and
    certainly not limited to Lasse, Nal, Capser, Jonathan, Avital, Mostafa; I want
    to thank Carlos, Ruth and Axel, for giving me a home away from home.


    I want to thank Felice Arends, Odette Compen-Hend, Erik Hitipur, de Jong and Boy
    Menist for helping me navigate both Philips and the UVA, and for enabling me in
    pursuing internships. I also want to give special thanks to Dennis Koelma and
    Bas Tervijn for their advice and for enabling bits to flow where they have to
    go. On SURFSara’s side, I have to thank Vali for collaboration and enabling of
    my more excessive crunching stints.


    I am also grateful to the organizers and attendees of the wonderful Deep Bayes
    school by Dimitri Vetrov. Likewise, the summer school by Microsoft Research was
    an incredible opportunity to learn and network. Equally was the DLMedia consortium
    who let me hitch a ride for the many interesting talks, the summer school and
    more.


    The following organizations have been vital for my PhD. Philips Research, for
    the financial support for my PhD. SURFSara, allowing me to test-drive the LISA
    GPU supercomputer. NVIDIA, for their generous GPU grant.


    Of the people close me, I want to thank Hüs, for supporting me during this wonderful
    and chaotic period of our lives. My grandpa, George, for teaching me to take things
    serious and inspiring me to take an academic career. My parents, for their unwavering
    support, advice, feedback on drafts and love. My sisters, being there for me.
    My uncles Henk and Frans, for their advice inspiring me to be ambitious.


    I want to thank the wonderful folks of Het Wilde Wat, for creating a sense of
    community, a creative outlet and a great source of joy, and Ben, for introducing
    me to this group. Luisa, thank you for being a voice of reason and inspiring me,
    as well as Maurits, Ties and Jörg, for our many dinners and company. Wendy, for
    being a travel partner. Damla, Erin, Tunca, Amu, for providing a place of calm
    amongst the chaos. Thiviyan, for listening and sharing. Marloes, for coming me
    to Copenhagen. Jan Willem, for sharing notes and advice. Miriam, for showing me
    what strength and grace in the face of adversity is, and being regardless. Thomas,
    for being there from the start of the AI adventure in Amsterdam and staying in
    touch. Janna, for going above and beyond and helping me see things in a different
    light. Agner, for your friendship and helping me take my mind off work. Benjy,
    for pushing me to ride faster. Ana and Thomas, for taking karaoke to the next
    level. Johannes, for showing me the beauty of Austria and for a wonderful collaboration.
    Jose, for sharing the excitement for the metaverse where we''ll surely spend much
    time in the future. Elise, forit for keeping it metal. Thijs, Giulia and Chin-Wei,
    for rocking together.


    Finally, I want to thank the committee members, Prof. Dr. Zeynep Akata, Prof.
    Dr. Paul Groth, Prof. Dr. Evangelous Kanulas, Dr. Stephan Mandt, and Dr. Erik
    Bekkers for generously taking the time to read this thesis and sharing their expertise.
    It is an honour to be able to discuss my work with all of you.


    Extending a PhD project beyond the typically allotted 4 years means the list of
    people who come to impact the thesis and myself grows ever larger. If you are
    reading this, you most likely are one of them. If my memory has lapsed in the
    haste of writing this and I have failed to acknowledge you: I beg your forgiveness,
    and invite you to reach out so I can promptly buy you a drink to make up and reminisce
    on the good old days.

