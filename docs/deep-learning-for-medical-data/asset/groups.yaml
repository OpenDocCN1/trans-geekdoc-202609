    ## 5.6 CONCLUSION


    We presented Greedy InfoMax, a novel self-supervised greedy learning approach.
    The relatively strong performance demonstrates that deep neural networks do not
    necessarily require end-to-end backpropagation of a supervised loss on perceptual
    tasks. Our proposal enables greedy self-supervised training, which makes the model
    less vulnerable to overfitting, reduces the vanishing gradient problem and enables
    memory-efficient asynchronous distributed training. While the biological plausibility
    of our proposal is limited by the use of negative samples and within-module backpropagation,
    the results provide evidence that the theorized self-organization in biological
    perceptual networks is at least feasible and effective in artificial networks,
    providing food for thought on the credit assignment discussion in perceptual networks
    (Bengio et al., 2015; Linsker, 1988).


