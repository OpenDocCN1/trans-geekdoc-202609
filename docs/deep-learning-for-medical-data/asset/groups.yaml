    # 5.5 RELATED WORK


    We have studied the effectiveness of the self-supervised CPC approach (Oord et
    al., 2018b; Héaff et al., 2019) when applied to gradient-isolated modules, freeing
    the method from end-to-end backpropagation. There are a number of optimization
