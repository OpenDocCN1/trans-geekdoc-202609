    - Han Gorp, Iris Huibben, Bastiaan S. Veeling, Max Welling (2018). “Rotation Equivariant
    CNNs for Digital Pathology.” In: International Conference on Medical Computing
    & Assisted Intervention (MICCAI).

    - Bastiaan S. Veeling, Bart Bakker, Max Welling (2018). “Contrastive Perturbative
    Coding.” Unpublished.

    - Sindy Löwe, Peter O’Connor, Bastiaan S. Veeling (2019). “Putting an end to end-end:
    Gradient-isolated learning.” In: Neural Information Processing Systems (NeurIPS).
    Honorable Mention for Outstanding New Directions.

    - Han Gorp, Iris Huibben, Bastiaan S. Veeling, Nicola Pezzotti, Ruud J. van Sloun
    (2019). “Active Deep Probabilistic Subsampling.” In: International Conference
    on Learning (ICML).

    - Florian Wenzel, Kevin Roth, Bastiaan S. Veeling, Linh Tran, Stephan Mandt, Jasper
    Snoek, Tim Salimans, Rodolphe Jenatton (2020). “How good is the bayes posterior
    in deep neural networks?” In: International Conference on Learning (ICML).

    - Jakub Swiatkowski, Kevin Roth, Bastiaan S. Veeling, Linh Tran, Joshua Dillon,
