    Methods that enable equivariance under rotations and other transformations include
    Harmonic Networks (Worrall et al., 2017), which constrain the set of filters to
    circular harmonics, allowing for full 360°-equivariance. Weiler et al. (2017)
    employs steerable filters and evenly samples a small number of rotations. In this
    work, we focus on the straight-forward G-CNN method from Cohen and Welling (2016)
    applied on discrete rotation/reflection groups. These groups do not cover the
    full continuous rotational symmetry inherent in WSIs, the empirical evidence gathered
    so far shows that 90° rotation equivariance improves performance significantly
    (Weiler et al., 2017).


    ## 2.2 METHODS


    ### 2.2.1 Background


    In the mathematical model of CNNs and G-CNNs introduced in Cohen and Welling (2016),
    input images and output segmentation masks are considered to be functions $f:
    Z^2 \rightarrow R^K$, where $K$ denotes the number of channels, and $f$ is implicitly
    assumed to be zero outside some rectangular domain. A standard convolution* of
    an input $f$ with filter $\psi$ is defined as:


    ```

    $[f * \psi](x) = \sum_{y \in Z^2} \sum_{k=1}^{K} f_k(y)\psi_k(x-y). \quad (2.1)$

    ```


    G-CNNs are a generalization of CNNs that are equivariant under more general symmetry
    groups, such as the group $G = p4$ of 90° rotations, or $G = p4m$ which additionally
    includes reflection. In a G-CNN, the feature maps are thought of as functions
    on this group. For $p4$ and $p4m$, this simply means that feature channels come
    in groups of 4 or 8, corresponding to the 4 pure rotations in $p4$ or the 8 roto-reflections
    in $p4m$.


    ![](img/3013a5e7af0c305d337644a32207e3ef_31_0.png)


    **Figure 2.1:** Given a canonical input and a rotated duplicate, we demonstrate
    how a 2-layer G-CNN is equivariant in $p4$. Feature maps of one kernel layer are
    shown, and the dashed blue arrows indicate how (intermediate) representations
    of the two inputs respond. The $Z^2 \rightarrow p4$ convolution correlates the
    input with 4 rotated versions of the same kernel. $p4 \rightarrow p4$ convolution
    correlates the resulting feature map with the p4-kernel, cyclically-shifting and
    rotating the kernel for each orientation. The final layer denotes average-pooling
    over the orientations produces a representation that is locally invariant and
    globally equivariant to rotation. Global average pooling over $p4$ would result
    in a representation globally invariant to translation and rotation.


    In the first layer, these are produced using the $(Z^2 \rightarrow G)$-convolution:


    ```

    $[f * \psi](g) = \sum_{y\in Z} \sum_{k=1}^K f_k(y)\psi_k(g^{-1}y), \quad (2.2)$

    ```


    $g = (r, t)$ is a roto-translation (in case $G = p4$) or roto-reflection-translation
    (in case $G = p4m$).


    In further layers, both feature maps and filters are functions on $G$, and these
    are combined using the $(G \rightarrow G)$-convolution:


    ```

    $[f * \psi](g) = \sum_{h\in G} \sum_{k=1}^K f_k(h)\psi_k(g^{-1}h). \quad (2.3)$

    ```


    In the final layer, a group-pooling layer is used to ensure that the output is
    either invariant (for classification tasks) or equivariant as a function of the
    plane (for segmentation tasks, where the output is supposed to transform together
    with the input). In Fig. 2.1 we demonstrate how equivariance is achieved through
    this process. Non-linear activations and pooling operations are equivariant in
    $p4m$ (Cohen and Welling, 2016), allowing layers to be freely stacked to enable
    deep architectures.


    ### 2.2.2 G-CNN DenseNet architecture


    The proposed patch-classification model is shown in Fig. 2 for for $p4$ ($p4m$-variant
    is a trivial extension). The architecture is based on the densely connected convolutional
    network (DenseNet) (Huang et al., 2016), which consist of dense blocks with layers
    that use the stack of all previous layers as input, alternated with transition
    blocks consisting of a $1 \times 1$ convolutional layer and $2 \times 2$ strided
    averaging pooling. We use one layer per dense block due to the limited receptive
    field of the model, with 5 dense-block/transition-block pairs. The model spatially-pools
    the input by a factor of $2^s$, the output of which resembles the segmentation
    resolution used in Liu et al. (2017).


    Full-model group equivariance is achieved by replacing all convolution layers
    with group-equivariant versions (Cohen and Welling, 2016). Batch normalization
    layers (Loffe and Szegedy, 2015a) are made group-equivariant by aggregating moments
    per group feature map rather than span spatial feature map (as proposed by Cohen
    and Welling (2016)). Zero-padding is removed to prevent boundary-effects. The
    final layer consists of a group-pooling layer followed by a sigmoid activation,
    resulting in tumor-probability output on the plane $Z^2$.


    As the model is fully convolutional, efficient inference can be achieved at test
    time by reusing computation of neighbouring patches, reducing segmentation time
    of a full WSI from hours to $\sim$ 2 minutes on a NVIDIA Titan XP.


    ## 2.3 EXPERIMENTAL RESULTS


    ### 2.3.1 Datasets and Evaluation


    To evaluate the proposed model, we use Camelyon16 (Ehtesami Bejnordi et al., 2017)
    and PCam. Additional testing is performed on BreakHis (Spanhol et al., 2016).
    **(1)** The Camelyon16 dataset contains 400 H&E stained WSIs of sentinel lymph
    nodes split into 270 slides with pixel-level annotations for training and 130
    unlabeled slides for testing. The slides were acquired and digitized at 2 different
    centers using $40\times$ objective (resultant pixel resolution of 0.243 microns).
    The Camelyon16 challenge, model performance is evaluated using the FROC curve
    for tumor localization. **(2)** The PCam dataset contains 327,680 patches from
    Camelyon16 at a size of $96 \times 96$ pixels at $10\times$ magnification, with
    a $75/12.5/12.5\%$ train/validate/test split, created using a hard-negative microscopy
    regime.\(3)** The BreakHis dataset contains 7909 H&E stained microscopy images
    at a size of $700 \times 460$ pixels. The task is to classify the images into
    benign or malignant cases for multiple magnification factors. We limit our evaluation
    to the images at $4\times$ magnification, for which previous approaches have reported
    the highest accuracy (Spanhol et al., 2016; Song et al., 2017).

