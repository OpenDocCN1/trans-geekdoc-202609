    # 5-3 GREEDY INFOMAX | 51


    ITERATIVE MUTUAL INFORMATION MAXIMIZATION Similarly to the InfoNCE loss

    in Equation (5.1), our module-local InfoNCE loss in Equation (5.4) maximizes

    a lower bound on the mutual information $I(z_{t+k,k}^{z^m})$ by nearby patch

    representations, encouraging the extraction of slow features.


    Most importantly, it follows from Oord et al. (2018b), the module-local

    InfoNCE loss also maximizes the lower bound of the mutual information $I(z_{t+k}^{m-1},
    z_t^m)$

    bween the future input to a module and its current representation. This can

    be seen as a maximization of the mutual information between the input and

    out of the module, subject to the constraint of temporal disparity. Thus, the

    InfoNCE loss can successfully enforce each module to maximally preserve the

    information of its inputs, providing the necessary regularization (Krause

    et al., 2010; Hu et al., 2017) for circumventing degenerate solutions. These fac-

    tors contribute to ensuring that the greedy optimized modules provide mean-

    ingful inputs to their successors and that the network as a whole provides

    useful features for downstream tasks without the use of a global error signal.


    PRACTICAL BENEFITS Applying GIM to high-dimensional inputs, we can op-

    timize each module in sequence to decrease the memory costs during training.

    in the most memory-constrained scenario, individual modules can be trained,

    frozen, and their outputs stored as a dataset for the next module, which effect-

    ively removes the depth of the network as a factor of the memory complexity.


    Additionally, GIM allows for training models on larger-than-memory in-

    put with architectures that would otherwise exceed memory limitations.

    Leveraging the conventional pooling and pooled layers found in common net-

    work architectures, we can start with small patches of the input, greedily train

    the first module, extract the now compressed representation spanning larger

    windows of the input and train the following module using these.


    But not least, GIM provides a highly flexible framework for the training

    of neural networks. It enables the training of individual parts of an architecture

    at varying update frequencies. When a higher level of abstraction is needed,

    GIM allows for adding new modules on top at any moment of the optimization

    process without having to fine-tune previous results.'
