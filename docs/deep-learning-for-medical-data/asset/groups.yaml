    despite its unsupervised features being optimized greedily without any backpropagation
    modules. An equivalent *randomly initialized* feature extraction model exhibits
    poor performance, showing that GIM extracts useful features. The feature extraction
    model end-to-end and fully supervised performs worse, likely due to the small
    size of the annotated dataset resulting in overfitting. Although through regularization
    techniques (DeVries and Taylor, 2017), the self-supervised methods do not appear
    to require regularization as they benefit from the full unlabeled dataset. Using
