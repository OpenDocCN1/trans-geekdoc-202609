    # 5

    # 贪心信息极大 (GREEDY INFOMAX)


    现代深度学习模型通常使用端到端反向传播和全局监督损失函数进行优化。尽管在经验上被证明非常成功（Krizhevsky et al., 2012; Szegedy
    et al., 2015），但这种方法被认为在生物学上是不可能的。其，监督学习需要大量的标记数据集来确保泛化能力。相比之下，儿童只需少量样本就能学会识别新类别。此外，尽管有一些证据表明大脑中存在自上而下的连接，但似乎并没有一个由反向传播信号优化的全局目标（Crick,
    1999; Marblesstone et al., 2016）。相反，生物大脑是高度模块化的，并且主要基于局部信息进行学习（Caporale and Dan,
    2008）。


    除了缺乏自然对应物外，端到端反向传播对神经网络进行监督训练还存在实际的劣势。监督学习需要标记输入，而这些标记的成本很高昂。因此，它不适用于大多数可用数据，并且具有更高的过拟合风险，因为深度模型所需的参数数量往往超过了现有数据点的数量。同时，端到端反向传播会产生巨大的开销，因为包括激活和梯度在内的整个计算图都需要适应内存。


    ## 5.1 引言


    在本文中，我们引入了一种新的学习方法——贪心 InfoMax (GIM)。受生物限制的启发，我们用自监督方法取代了端到端反向传播，每个模块都使用局部损失进行贪心训练。这种问题一直存在，因为端到端训练不允许具有局部性。我们的贡献如下：


    - 提出的 Greedy InfoMax 算法在音频和图像分类上取得了强有性能。

    - 这实现了神经网络的异步训练，使得在内存限制下能够构建任意深的网络。

    - 我们证明了互信息极大化特别适用于下游任务。


    ## 5.2 背景


    为了创建对下游任务有用的表示，我们假设自然数据表现出所谓的“慢特征”（Wiskott and Sejnowski, 2002）。几毫秒的语音块与相邻的块共享信息，如说话者身份、情感和音素，而它并不一定与从其他话语中抽取的随机块共享这些信息。同样，自然图像中的一个小块与邻居块共享许多方面，例如所描的物体或光照条件。


    最近的工作（Oord et al., 2018b; Hjelm et al., 2019）提出了我们如何利用这一点来学习最大化邻居之间互信息的表示。在这项工作中，我们特别关注对比预测编码
    (CPC) (Oord et al., 2018b)。


    为了实现这一点，CPC 首先使用深度编码模型 $g_{enc}(x_t) = z_t$ 处理序列输入信号 $x$，并额外产生一个表示 $c_t$，聚合直到时间步
    $t$ 的所有块的信息。


    ![img/3013a5e7af0c305d337644a32207e3ef_58_0.png]


