    # 6.4 DISCUSSION


    In this work, we have proposed a new flexible class of variational distributions.
    To measure the effectiveness for real world classification, we applied the class
    to a deep variational information bottleneck model. By placing a quantization-based
    distribution on the activations, we can compute uncertainty estimates over the
    outputs. We proposed an evaluation scheme motivated by the need in real-world
    domains to guarantee a minimal risk. The results present indicate that SQUAD provides
    an improvement over plain neural networks and Gaussian information bottleneck
    models. In comparison to a MCDropout model, which approximates a Bayesian neural
    network, we get competitive performance. Moreover, qualitatively we find that
    the flexible distribution is used to its full advantage. The method learns interesting
    non-linearity’s, is tractable and scale-able, and as the output domain is constrained,
    no batch normalization techniques are required.


    Various directions for future work arise. The improvement of ensemble methods
    over individual models indicates that there remains room for improvement for capturing
    the full uncertainty of the output, and thus a fully Bayesian approach to SQUAD
    which would include weight uncertainty, shows promise. The flexible class allows
    us to define a wide variety of interesting priors, which provides opportunity
    to study interesting priors that are hard to define as a continuous density. Likewise,
    more effective initialization of parameters for the proposed method requires further
    attention. Orthogonally, the proposed class can be applied to other variational
    objectives as well, such as the variational auto-encoder. Finally, the discretized
    nature of the variables allows for the analytical computation of other divergences
    such as mutual information and the Jensen-Shannon divergence, the effectiveness
    of which remains to be studied.'
