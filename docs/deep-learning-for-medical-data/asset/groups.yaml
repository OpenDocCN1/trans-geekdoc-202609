    The following organizations have been vital for my PhD. Philips Research, for
    the financial support for my PhD. SURFSara, allowing me to test-drive the LISA
    GPU supercomputer. NVIDIA, for their generous GPU grant.


    Of the people close me, I want to thank Hüs, for supporting me during this wonderful
    and chaotic period of our lives. My grandpa, George, for teaching me to take things
    serious and inspiring me to take an academic career. My parents, for their unwavering
    support, advice, feedback on drafts and love. My sisters, being there for me.
    My uncles Henk and Frans, for their advice inspiring me to be ambitious.


    I want to thank the wonderful folks of Het Wilde Wat, for creating a sense of
    community, a creative outlet and a great source of joy, and Ben, for introducing
    me to this wonderful group and being a great friend.


    Luisa, thank you for being a voice of reason and inspiring me, as well as the
    patient feedback on drafts. Joost, for many discussions, trips, advice, tireless
    feedback and encouragement. Marcel, for reminding me not to take things too serious.
    Bernice, for listening and riding together. Bertina, for great dinners and walks.
    Joost for listening when we'
