  md: 'this is that giving users too many ways to do the same thing can be confusing
    and lead to redundancy and should thus be avoided. Giving users control of what
    they are doing allows their cognitive resources to be focussed on the goal and
    not on other unnecessary and potentially redundant tasks. For instance, users
    should always be able to easily navigate to the home page of a website or exit
    of a system whenever needed. As a further example, folder navigation should allow
    the user to go back one step at any time, by providing a clear direction in which
    they can move (Figure 6.3).


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_124_0.png)


    Figure 6.3 The OneDrive folder navigation menu allows the user to go back one
    step at any time, by providing clear visibility of location and nesting


    # 6.4.4 CONSISTENCY AND STANDARDS


    The fourth heuristic of Consistency and Standards alludes to the importance of
    not making users wonder if different words, situation, or actions mean the same
    thing [19]. If we use consistent terminology, colours, layout, actions, fonts
    and the like it makes it much easier for users to know where to expect to find
    things and what different actions and situations are likely to mean. In addition,
    once users become familiar with the layout, colours, actions, terminology and
    so on, it becomes easier to find information and to interact with an interface.
    In essence, consistency allows users to more easily acquire schemas of where to
    find things and how things operate. It is good practice to not only ensure good
    consistency and standards within your own system, but also to consider the meanings
    of certain icons, colours, key presses and so on in other systems so as not to
    overload and confuse your users. User testing allows you to get a good understanding
    of your users’ prior knowledge and thus consider it in your design choices. Examples
    of good consistency and standards include using acronyms or key presses to mean
    the same things as in other website and systems, locating navigation panes in
    a consistent location across all your interfaces, and using icons and colours
    in the same manner and to mean the same thing across all your interfaces within
    your system. One of the most persistent examples of this consistency and standards
    is the use of the old floppy disk as an icon for the action ‘Save’. Despite the
    fact, that most younger people now have never used or even seen a floppy disk,
    they are still able to recognise this icon easily due to the consistency in its
    use.


