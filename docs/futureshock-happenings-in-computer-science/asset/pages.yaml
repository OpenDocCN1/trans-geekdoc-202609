- pgno: 17
  md: '# 1 Introduction


    *Sebastian Sequoiah-Grayson*

    School of Computer Science and Engineering, UNSW Sydney

    Kensington, Australia


    # 1.1 INTRODUCTION TO VOLUME


    “Well that escalated quickly” is the well-known phrase lurking amongst the meme-scapes
    of the online world. As far as phrases go, it is a useful one for the most part.
    Things do, perhaps now more than ever before, escalate quickly. In few places
    has this been more true than in computer science itself.


    In the very living memory of even young members of the discipline, computer science
    was the academic intrigue of the fascinated few. Things have changed. Digital
    technologies now affect nearly every aspect of our lives – both personally and
    professionally. Computer science, the discipline of the digital *par excellence*,
    finds itself now in the center of the academic, political, geopolitical, and popular
    worlds. From finance to space travel, from medicine to the military, from farming
    to education, computer science is there in the middle of all of it.


    Data is the new gold, and digital information processing is the method of its
    extraction and refinement. The age of artificial intelligence is upon us, and
    we are face-to-face with the dawn of quantum computing. Here, amongst cryptocurrencies,
    cyber warfare, deepfakes, generative artificial intelligence, and more, a genuine
    conceptual literacy of digital ecosystems is the mark of the modern person.


    The purpose of this book is to afford the reader with an opportunity – more than
    one, it is hoped – to pursue such a literacy directly. The topics have been chosen
    because they are both important and, by and large, off the radar of much of the
    general public (if not off the radar of some of the more distant locales of academia).


    The one exception to this is the chapter with which the book begins. In *AI and
    Ethics*, Sebastian Sequoiah-Grayson and Toby Walsh introduce the reader to a topic
    that is now front and center in many debates on artificial intelligence. Artificial
    intelligence is an area where the technological capabilities are evolving at warp
    speed. As such, the authors have worked hard to provide the reader with a grounding
    in the issues that will withstand such accelerations. To this end, the chapter
    is organized around a series of exercises of thought and invitations to careful,
    purposive explorations of foundational issues in ethics and artificial intelligence.


    In *The Future of Education Technology*, Jake Renzella explores the potential
    – both existent and speculative – of computer science technology to affect positive
    outcomes in higher education. Enticingly, there is more afoot here than transactional,'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'quantitative measures. A passionate pedagogical pioneer, Renzella lays out
    how it is exactly that computer science technology can bring out the best in both
    students and teachers alike – in both computer science itself and beyond.


    In *Exploring the Integration of Design Thinking into the Engineering Discipline*,
    Alexandra Vassar has written a powerful anecdotal history of her own exposure
    to design thinking in the early day of her computer science engineering education,
    how this affected her intellectual and academic growth, and how it is that she
    has integrated this into her training the next generations of computer scientists
    and engineers. With considerable attention paid to the potential of campus-based
    makerspaces, Vassar reveals the role of creativity in digital technologies, and
    the potential for its refinement.


    In *How the Metaverse and Brain Computer Interfaces can Revolutionise the Education
    Industry*, Ali Darejeh and Sara Mashayekh explore how virtual and augmented reality
    technologies – known collectively as *immersive technologies* – affect knowledge
    acquisition. With the recent advent of affordable brain-computer interfaces, Darejeh
    and Mashayekh explore the future of interface design and the possibilities that
    such design affords.


    In *UX Design Guided by Cognitive Load Theory*, Nadine Marcus and Alexandra Vassar
    explore the relationships between user experience and cognitive psychology. From
    the iPhone to ChatGPT, the psychosocial purchase of digital technologies depend
    upon an ongoing symbiosis with the ways in which humans navigate their world.
    Marcus and Vassar take the reader through a careful exploration of the topography
    of mental structures upon which the success of digital technologies depend.


    In *Ripple Down Rules and Classification*, Eric Martin takes theories of knowledge
    acquisition and learning into the realm of logico-mathematical modelling. Martin
    explores three subfields of artificial intelligence – *knowledge acquisition*,
    *knowledge representation*, and *formal learning theory*, and subsumes them within
    a single framework of *ripple down rules*. Some mathematical sophistication is
    required for Martin’s chapter, but nothing beyond that which is available in any
    good introductory book on logic and mathematical reasoning. It is well worth the
    time taken by the reader to do this, as such a mathematical literacy is the key
    to unlocking many of the abstract wonders that populate the rich world of theoretical
    computer science.


    In *Counterfeits and Kill Switches: How Hardware Security can Impact You*, Hammond
    Pearce takes us back to the physical world of *hardware security*. An increasingly
    vital part of cyber security, *hardware attacks* involve the fatal compromise
    of “upstream” manufacturing and supply lines. Such compromise can occur via brute
    physical intercept, or via remote sabotage. Devilishly hard to detect, and easy
    to scale, hardware attacks present cyber security in particular and computer science
    and society in general with one of the most exciting, and frightening, challenges
    today. Pierce presents several promising lines of defence for the ecosystems that
    will only continue to populate the digital futures that we share.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 2 AI and Ethics


    *Sebastian Sequoiah-Grayson*

    School of Computer Science and Engineering, UNSW Sydney

    Kensington, Australia


    *Toby Walsh*

    School of Computer Science and Engineering, UNSW Sydney

    Kensington, Australia


    # 2.1 AI AND ETHICS


    As artificial intelligence (AI) starts to leave the laboratory and enter many
    aspects of our lives, we need to start worrying about the impact it has. This
    is especially important when AI is being applied to issues of social good. The
    target groups we might be trying to help can often be some of the poorest and
    most disadvantaged in our communities. We might be trying to help homeless people,
    people with disabilities, racial or other minorities. We might be concerned with
    the impact of climate change, protecting ecosystems under threat from human actions,
    or groups in the developing world that are particularly vulnerable. It is therefore
    essential to consider whether we are doing the right thing. This then requires
    us to consider a range of ethical questions around the best course of action and
    around the systems we are building.


    # 2.2 ETHICS


    Ethics is a branch of philosophy that considers which behaviours are right and
    wrong. Philosophers have considered these questions for thousands of years and
    have proposed many different answers. Normative ethics, for example, asks how
    we might best make *moral judgements*. Moral judgements are claims about the moral
    or ethical status of some act or other. (In what follows, we will understand ‘moral’
    and ‘ethical’ to be synonymous.) Examples of moral judgements are statements such
    as *Lying is wrong*, *Giving to charity is good*, *The Beatles’ music is depraved*,
    *The Manson Family were a bit dodgy*, and so on.


    Moral judgements often appear in transparently *prescriptive* form. Indeed, normative
    ethics is often referred to as ‘prescriptive ethics’ for just this reason. For
    example, we might reformulate the four moral judgements above as *One should not
    lie*, *One must not listen to The Beatles*, *One should not mix with members of
    the Manson Family*, and so on. The Ten Commandments are one of the most well-known
    bodies of moral judgements in prescriptive form. There are others.


    The common-sense, canonical view is that moral judgements can be either true or
    false, just as with judgements about other matters. The problem waiting for us
    at this'
