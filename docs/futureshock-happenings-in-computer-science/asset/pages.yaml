  md: '# LESSON 6: DIVERSITY IN TEAMS HELPS


    Building AI systems responsibly is complex and difficult. There are plenty of
    traps awaiting the unwary and little in the way of standard procedures to avoid
    them. To compound matters, AI is a field lacking diversity. The percentage of
