    # Figure 7.5


    The evaluation of the conditions of the visited nodes of an RDR tree proceeds
    deterministically. Indeed, the nodes of a chain of elif nodes (a chain of possible
    alternatives) are to be evaluated in sequence. Evaluation stops at the first node
    in the chain, if any, whose condition evaluates to True. Usually, order matters;
    the order of alternatives cannot be changed, or at the very least it cannot be
    changed arbitrarily. It is interesting to consider the case where any chain of
    alternatives can be shuffled, in any way. This amounts to a non-deterministic
    RDR framework: it allows one to, at a given node, evaluate in parallel all possible
    alternatives and move to the node, if any, whose condition has first been found
    out to evaluate to True. This non-deterministic RDR framework starts with the
    definition that follows, that introduces the key concept of a gradation graph.
    We will then see how a gradation graph can be transformed into one or more gradation
    trees. Intuitively, the more gradation trees can be obtained'
