  md: 'example, we have been trying to tackle racial bias for decades. AI may have
    put the problem on steroids. But it is an old problem. Autonomy, on the other
    hand, is an entirely novel problem.


    We have never had machines before that could make decisions independent of their
    human masters. Previously machines only did what we decided they should do. In
    some sense, machines in the past have only ever been our servants. But we’ll soon
    have machines that make many of their own decisions. Indeed, anyone who owns a
