    # 5.5.3 OUR METAVERSE ARCHITECTURE


    The platform has been meticulously developed using a combination of the Unreal
    engine and the Unity game engine and Unity XR interaction toolkit, enabling seamless
    functionality on both Windows and Android-based headsets, such as HTC VIVE Pro
    and Meta Quest headset. The simulated equipment was designed using Blender and
    imported into Unity. To promote collaboration and enhance the learning experience,
    the system has been designed as a multiplayer environment, allowing multiple students
    to log in simultaneously and interact with one another. To achieve this, the Photon
    plugin has been seamlessly integrated into the platform, facilitating real-time
    communication and synchronisation among users across various locations.


    # 5.6 FINDINGS


    The combined results of these case studies highlight the transformative implications
    of the metaverse in higher education, particularly in addressing challenges related
    to resource constraints and enhancing learning outcomes across medical and engineering
    disciplines. By leveraging a custom-developed metaverse platform, we demonstrated
    the potential of virtual reality (VR) and immersive technologies to replicate
    complex laboratory environments, enabling hands-on practice with expensive and
    potentially hazardous equipment. For instance, the PCR machine simulation in medical
    science and the manufacturing robot simulation in mechanical engineering offered
    students an accessible, safe, and cost-effective alternative to traditional labs,'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'aligning with prior studies that emphasise the educational value of VR in different
    fields ([49] [60]).


    For example, Mergen, Graf, & Meyerheim, [49] found that VR-based simulations in
    medical education allow students to practice procedures without the risks associated
    with real-life practice, thereby enhancing learning outcomes. Similarly, in mechanical
    engineering, VR simulations are reported to enable students to engage with manufacturing
    processes in a controlled environment, facilitating a deeper understanding of
    complex systems [60]. Both these studies reported accessibility, repeatability,
    cost-effectiveness, and improved skill development as advantages of metaverse
    use.


    A key finding across the experiments was the reduction of cognitive load experienced
    by students when using the metaverse compared to traditional settings. This supports
    earlier research by Makransky and Lilleholt [48], which found that immersive VR
    environments reduced extraneous cognitive load, allowing learners to focus more
    effectively on core tasks. They emphasise that VR enhances procedural learning
    and emotional engagement, findings consistent with our observations that medical
    students reported improved understanding and confidence in performing PCR procedures.
    However, while Makransky and Lilleholt [48] observed long-term engagement benefits,
    our study primarily highlighted short-term cognitive load reductions, indicating
    a need for further longitudinal research to assess skill retention and transferability.


    The collaborative aspects of the metaverse platform further underline its potential
    to revolutionalise education. The inclusion of multiplayer functionality and virtual
    lecture theatres enabled students to engage in peer learning and interactive discussions,
    creating a more dynamic and participatory learning environment. This aligns with
    the findings of several studies that reported that VR-based collaborative platforms
    significantly boosted student motivation and engagement ([45] [52] [64]). Additionally,
    Lawson McLean, & Lawson McLean [42] demonstrated that real-time collaboration
    in VR enhanced teamwork and problem-solving skills, outcomes mirrored in our experiments
    where engineering students collaboratively optimised virtual manufacturing processes.
    Unlike traditional online tools like Zoom, these virtual spaces provided a sense
    of presence and interactivity that added value to the learning experience, a distinction
    also noted by Tsou and Mejia [72].


    The metaverse’s scalability and versatility have broad implications for interdisciplinary
    education. By simulating university campuses and incorporating specialised facilities
    for fields like computer science, mechanical engineering, and medical science,
    the platform fosters creativity and innovation across disciplines. This mirrors
    findings by Sharma et. al. [62], who highlighted the metaverse’s potential to
    bridge gaps between theoretical and practical knowledge across diverse fields.
    Furthermore, our case studies highlighted how virtual labs and lecture theatres
    provided an effective alternative for students in rural or remote areas, addressing
    accessibility issues-a key aspect of democratising education ([31] [51]). This
    is particularly relevant in resource-limited settings, where VR can offer equitable
    access to high-quality resources that might otherwise be unavailable.'
