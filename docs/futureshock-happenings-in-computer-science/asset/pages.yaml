  md: 'from a gradation graph, the more nondeterminism the gradation graph encompasses.
    Some gradation graphs cannot be transformed in more than one gradation tree, so
    they are themselves deterministic. Still, they can prove valuable as gradation
    graphs allow us to get rid of the redundancy that is built into some gradation
    trees. The tree depicted in Figure 7.5 exhibits redundancy: the two subtrees rooted
    at q are the same. We will see that this tree is the unique transformation of
    a gradation graph, the latter offering a more compact representation. There is
    actually more than one possible way to interpret “redundancy” in a gradation tree.
    To make sure that the interpretation is general enough and does not require more
    than finding identical subtrees in an RDR tree, ignoring the “contexts” where
    those identical subtrees appear, we resort to graphs over multisets rather than
    sets of vertices. Using formulas (or more generally, members of the lattice that
    subsumes the ℳ-embedding under consideration) as labels, we could instead consider
    a set of labelled vertices and possibly label distinct vertices with the same
    formula, but it is more direct and simpler to work with a multiset of formulas
    as vertices.


    # Definition 11.


    Let an ℳ-embedding ℰ = (h,A) be given. An ℰ-gradation graph is a pair of the form
    (V,E) where V is a multisubset of A ∪ {1} and E is finite nonempty binary relation
    over V with the following properties.


    +   - For all v ∈ V, v = 1 iff there is no v'' ∈ V with (v'', v) ∈ E.

    +   - E is acyclic: there exists no n ∈ ℕ and v0,…,vn ∈ V such that (vn, v0) ∈
    E and for all i < n, (vi, vi+1) ∈ E.


    A gradation graph (over ℳ) is an ℰ-gradation graph for some ℳ-embedding ℰ.


    # Example 12.


    Recall the convention and notation in Example 3. Let V denote {∧∅, p, q, r} and
    set:


    E = {(∧∅, p), (∧∅, q), (∧∅, r), (p, q), (p, r), (q, r)}.


    Then (V,E) is an 𝒜-gradation graph. It can be depicted as in Figure 7.6.


