    An important consideration when applying any of these ten design heuristics is
    that good design will always make the use of a system more enjoyable and less
    frustrating for your users. From a cognitive load perspective, this good design
    is particularly important for more complex and multifaceted systems that are high
    in intrinsic cognitive load and so are already challenging users limited cognitive
    resources. It is also particularly important that these principles are considered
    when designing for novice or less experienced users, who are cognitively overloaded
    because everything is new and unfamiliar. Although most users do not stay novices
    for too long, if you only design for and user test with intermediate or experienced
    users some of these complexities and their impacts on your most cognitively overloaded
    group of users could be missed [8]. This highlights the importance of also considering
    users experience and expertise, and so cognitive load, when designing your interface
    and the user testing.'
