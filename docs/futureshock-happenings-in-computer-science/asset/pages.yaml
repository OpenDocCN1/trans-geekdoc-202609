- pgno: 11
  md: '# Foreword


    Merriam Webster dictionary defines future shock as the physical and psychological
    distress suffered by one who is unable to cope with the rapidity of social and
    technological changes [1]. The term was first used was in 1965, and subsequently
    achieved instant name recognition through the book written by Alvin Toffler, co-authored
    with Heidi Toffler (even though she was not so credited) in 1970 [2]. Of their
    many true and not-so-true predictions, that of the ‘electronic frontier’ inspired
    Steve Case, who went on to start what eventually became AOL [3].


    Computing today is unrecognisable from the field that it was in 1970 even to its
    many protagonists. From its inception as a department within the School of Electrical
    Engineering in the 1970s, the School of Computer Science and Engineering at UNSW
    today grapples with many of the frontiers of computer science and their societal
    impact, some of which contribute to even more future shocks. This volume showcases
    the prowess of CSE’s academic and research community and its efforts at tackling
    these frontiers and abating the future shocks. The topics are wide ranging, from
    AI and ethics, educational technology, design thinking and engineering education,
    the future of computer interface design and cognitive load management and logico-mathematical
    modelling to ensuring computer hardware security.


    My congratulations to the editor Dr Sebastian Sequoiah-Grayson who has brought
    this volume together, and sincere thanks to all contributors for sharing their
    perspectives on significant happenings within the computing field at this point
    in time. I hope the reader finds this volume to be a useful guide in a fast changing
    landscape.


    Prof Arcot Sowmya

    Head, School of Computer Science and Engineering

    Sydney, 18 December, 2024


    +   1. https://www.merriam-webster.com/dictionary/future

    +   2. Toffler, Alvin, Future Shock, Bantam Books, New York, 1970

    +   3. https://www.fastcompany.com/1695307/future-shock-40-what-tofflers-got-right-and-wrong,
    Fast Company. 15 October 2010.'
