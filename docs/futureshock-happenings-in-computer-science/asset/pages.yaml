  md: 'While the traditional volcano model allows students to physically craft and
    observe a simulated eruption, XR takes this concept to new heights. Virtual Reality
    (VR), a subset of Extended Reality, can transport students to real volcanic environments,
    allowing wide-eyed students to stand at the base of an active volcano, feeling
    the rumble beneath their feet and witnessing the spectacle of an eruption in high-fidelity
    detail and scale.


    With augmented reality technology (AR), picture overlays transform a classroom
    tabletop into a dynamic, 3D model of tectonic plate movements.


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_71_0.png)


    Figure 3.13 A student wearing VR goggles learning about gears


    While generations of students have been captivated by their handcrafted volcanoes,
    XR has the similar potential to inspire students across a vast array of subjects,
    making it the ‘paper maché volcano’ of the 21st century – a versatile, engaging
    tool that brings learning to life in new ways.


    As head mounted displays (HMD) (the most common form of Virtual Reality) have
    dramatically come down in cost, explorations into the adoption of VR in classrooms
    has begun. [13] analysed the organisational, institutional, contextual and practical
    challenges and opportunities in the implementation of HMD VR in K-12 school contexts.
    They found that while teachers envision the potential of VR technologies in the
    classroom, economic weakness is highlighted as the major obstacle. In Bring Your
    Own Devices (BYOD) classrooms, serious concerns surrounding equality and access
    still limit the potential of VR today.


    Looking forward⁷, we could extrapolate that costs will continue to drop until
    the technology is available to most students in developed nations [8]. Once accessibility'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'is solved, the applications of VR in education are endless. [25] explores applications
    such as food digestion showing the process of how the human body digests food,
    to teaching concepts of electromagnetism and the magnetic field, as well as create
    experiential learning opportunities, such as transporting students back in time
    to pre-historic eras, sporting fields, or planets.


    # 3.9 THE ROAD AHEAD


    As we stand at the brink of what feels like a new era of education, we must not
    forget the lessons we have learned from a rich history of education technology.
    From the earliest flight simulators teaching life-saving skills, to the proliferation
    of education made possible via the simple cassette tape, the potential to transform
    lives remains as exciting as ever. Time and time again, educators and academics
    have been ready at the forefront of this revolution, together.


    Looking forward, the biggest challenges facing education are the very same which
    were introduced by technology itself. Threats to academic integrity brought upon
    by generative AI perhaps place the most stress on a massified educational environment.
    In this sense, the road ahead is challenging. Institutions will need to maintain
    a focus on learning outcomes, protecting academic integrity, prioritising privacy,
    and perhaps sacrificing some of the massification it has so far enjoyed thanks
    to technology.


    But as technology evolves, educators’ ultimate goal remains unchanged: to nurture
    curious minds, foster critical thinking, and prepare students for the challenging
    world they will inherit. From the simple cassette tape, to million dollar flight
    simulators, technology remains just a tool in this most ancient of pursuits.


