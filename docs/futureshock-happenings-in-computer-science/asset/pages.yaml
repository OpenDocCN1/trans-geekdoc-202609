    Open Online Courses (MOOCs) boom, with thousands of learners signing up for MOOCs
    such as Stanford University’s Machine Learning course delivered by Andrew Ng,
    having received 3,739,475 enrolments [4].


    So educational technology is nothing new, and while technology has undoubtedly
    increased the accessibility of university education on a global scale, it has
    also contributed to a modern academic environment fraught with challenges. Degrading
    student-tutor ratios and relationships, increased student distrust, and a concerning
    rise in breaches of academic integrity can be attributed to massification.


    Today, large language models (LLMs) such as OpenAI’s ChatGPT and Google’s Gemini
    cast a familiar shadow over educational landscapes, threatening to further disrupt
    the fabric of what it is that educators seek to achieve. These sophisticated AI
    tools challenge traditional notions of assessment and authorship, adding another
    layer of complexity to an already strained system.'
