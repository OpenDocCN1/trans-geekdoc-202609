  img_proc: true
- pgno: 184
  md: 'A simpler version of logic locking is known as IC metering [18]. This is a
    class of hardware security protocols that enables the designer to track the number
    of chips produced from the same mask and remotely activate only the desired number.
    This can be done in a few different ways, but one straightforward method is to
    have chips generate a unique signature based on a *physically unclonable function*.
    This signature needs to then be combined with a cryptographic key in order to
    enable the circuit to function – because the signature is unique; so too will
    the unlocking key.


    Related to this idea, both ICs and PCBs might be able to be secured against counterfeiting
    by adding similar attestation devices to the products. Here, special encrypted
    components are added to a given design. One example of these is found in modern
    Windows-based computers, known as trusted platform modules (TPMs) [4]. This can
    provide a variety of security benefits, from storing passwords safely to ensuring
    that the electronic components in the computer motherboard are authentic. Of course,
    no implementation is perfectly correct, and a variety of attacks exist, including
    leveraging side-channels for a timing-based analysis attack [19] (unfortunately,
    side channel analysis can work both ways!).


    A simpler defence technique, though not one that provides much protection, is
    to embed covert watermarks as design attributes inside hardware. These can be
    like icons and logos, or might be more subtle, such as an unusual and inefficient
    circuit trace. Watermarking is performed to provide evidence of ownership of a
    given circuit or IC layout.


    Each of these solutions come with their own complexities and costs. Anything based
    on cryptographic tags or keys can be overcome if the key management is weak or
    compromised. Most defences still rely at least in part on the trustworthiness,
    honesty, and vigilance of individual actors in the supply chain.


    Sometimes, the globalised and complex nature of the supply chain can itself be
    its own enemy. Any local or wide-scale shut-down of any of the geographic areas
    or companies which electronics manufacturing relies on can have disproportionate
    impact. The major example of this, of course, comes from the 2019-2020 Coronavirus
    pandemic COVID-19. Here, like many other sectors, the electronics supply chain
    was catastrophically disrupted, causing production lines to shut down and air
    and sea freight to dramatically cut capacity [31]. This resulted in shut downs
    and delays across the entire electronics sector, including Apple having to postpone
    deliveries of its new products, and Samsung and LG shutting down production. Overall,
    the Covid Chip Shortage had a huge impact on the automotive sector in particular,
    with Tesla, Volkswagen, Toyota, Fiat Chrysler, Nissan and Daimler all shutting
    factories or reducing production [30]. Access to in-demand chips and electronics
    became restricted via brokers, and manufacturers could pay more than eight times
    the pre-COVID value when items were eventually sourced. The consequences of these
    shortages were, naturally, a further explosion of counterfeits and illicit second-hand
    components.


    This highlighting of the fragile nature of the supply chain, and increasing attention
    on possible hardware hacks, is now encouraging a return to sovereign electronics
    manufacturing worldwide, particularly considering the production of Integrated'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Circuits. In the U.S., the CHIPS act included billions of dollars for companies
    to build new Integrated Circuit manufacturing plants within the country [26].
    This aims to boost both national security as well as spur national R&D. Similar
    legislation was also passed in the European Union [24] and United Kingdom. Even
    non-powerhouses such as Australia are also considering on-shoring some microchip
    manufacturing capability [7]. Combined with design defences such as those outlined
    in this chapter, such on-shoring may boost the trust within IC manufacturing.


    # 8.7 CONCLUDING REMARKS


    When considering the cybersecurity of a given computer system, much attention
    is placed on the software involved in that system. However, the security of the
    hardware that builds up each computer should be considered of equal importance.
    In general, we need to trust that our hardware will be designed and implemented
    according to our specifications, and will not include components and circuits
    we don’t desire! However, in this chapter we discussed how such hardware can in
    fact be compromised, either deliberately through the insertion of hardware Trojans
    or as a side effect of underperforming counterfeit parts.


    In general, the global nature of electronics manufacturing means that it is difficult
    to ensure trust in the supply chain. Individual actors can compromise systems
    passing through their hands, from malicious manufacturers to governments with
    the power to intercept shipments in progress.


    There are defences to these kinds of breaches. Traditional enforcement of intellectual
    property rights often depends on cooperation between countries with vastly different
    regulatory and legal frameworks, which can make legal recourse both slow and uncertain.
    Technical defences therefore include making our circuits difficult to compromise
    or copy by using techniques such as logic obfuscation, IC metering, and watermarking;
    and we can insert components like trusted platform modules to provide attestation
    that a given circuit is trustworthy. We can also use side-channel analysis, including
    power and timing measurements as well as visual checks to monitor our designs
    to make sure they appear to be operating with normal characteristics. This allows
    us to detect if a given circuit is suspiciously misbehaving.


    Of course, this chapter only provided the smallest introduction to Hardware Security.
    Though we briefly introduced how side channels can be used for defence, we did
    not present the universe of side channel attacks, whereby those same emissions
    are leveraged to steal data and secrets. Likewise, we did not present much detail
    on IP piracy, where malicious manufacturers might only steal part of a design,
    rather than a whole chip. We did not present many techniques on testing, including
    hardware fuzzing, as well as test-oriented attacks such as those based on JTAG
    and scan chains. Finally, we also didn’t in any detail cover the materials security
    side of things: hardware depends on physical inputs such as rare earth elements
    and chemicals, and these can likewise be tampered with to cause downstream effects.


    Interested readers can find many of these details in other resources, such as
    the recent book ‘Hardware Security’ [27] and its predecessor [6].'
