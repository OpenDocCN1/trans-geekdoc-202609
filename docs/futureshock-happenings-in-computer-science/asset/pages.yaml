- pgno: 138
  md: 'Let a strictly positive integer k be given.


    +   - φ is said to be Σ₁,ₖ in ℳ iff there exists positive formulas ψ₁, ..., ψₖ
    such that:

    +     - for all p ∈ {1, ..., k−1}, ψₚ₊₁ logically implies ψₚ in ℳ;

    +     - φ is logically equivalent to ∨₁≤p≤k, p mod 2=1 (ψₚ ∧ ∧ₚ<q≤k ∼ψ_q) in ℳ.

    +   - φ is said to be Π₁,ₖ in ℳ iff ∼φ is Σ₁,ₖ in ℳ.


    Figure 7.2 illustrates the kind of picture that is associated with a formula that
    is Σ₁,₈ in ℳ. We would have that ψ₁ is a positive formula that defines the outermost
    disk, ψ₂ a positive formula that defines the second outermost disk... and ψ₈ a
    positive formula that defines the innermost disk, the whole formula defining the
    union of all black rings: you are in the first and not in the second outermost
    disk, unless you are in the third and not in the fourth outermost disk, unless
    you are in the fifth and not in the sixth outmost disk, unless you are in the
    seventh and not in the eight outermost disk. More generally, as the value of k
    increases in Σ₁,ₖ, the number of disks in the associated picture increases, with
    the outermost ring being filled for any value of k, and with the innermost ring
    being filled for odd values of k, and not being filled for even values of k.


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_138_0.png)


    Figure 7.2


    All formulas are Σ₁,ₖ (and Π₁,ₖ) in ℳ for some natural number k.


    # 7.3.2 SPECIFIC BACKGROUND


    Next comes the first notation which is specific to our topic, though not exclusively
    as it is appears in one form or another in a few areas, for instance, in the literature
    on preferential models of belief revision [9], in particular in the form of Grove’s
    system of spheres [6].


    Notation 2. We denote by ℭ the set of finite sets S of nonempty subsets of ℳ such
    that ℳ ∈ S and S is totally ordered by inclusion (finite chains of nonempty subsets
    of ℳ that contain ℳ).'
