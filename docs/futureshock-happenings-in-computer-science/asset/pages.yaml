- pgno: 141
  md: 'The notation that follows will be used to aggregate the conditions found along
    the branch of an RDR tree, an except-node introducing a conjunction, an elif-node
    introducing a disjunction, resulting in a condition for the branch itself. More
    precisely, a branch of what will be defined as an ℰ-gradation tree, with ℰ an
    ℳ-embedding, will be a sequence σ of the kind defined in Notation 7; with σ̂ as
    defined in that notation, the set of models ℰ(σ̂) will be associated to that branch.


    # Notation 7. Given a Boolean algebra (B,∨,∧,¬,0,1), we inductively map each finite
    sequence of members of {∨,∧}×B to a member σ̂ of B, as follows.


    +   - (\widehat{}) = 1.

    +   - For all 𝕏 ∈ {∨,∧} and 𝕧 ∈ B, \widehat{(𝕏,𝕧)} = 𝕧.

    +   - Let 𝕏,𝕏'' ∈ {∨,∧}, 𝕧,𝕧'' ∈ B, and a finite sequence σ of members of {∨,∧}×B
    be given. Set σ'' = ((𝕏,𝕧),(𝕏'',𝕧''))·σ. Then \widehat{σ''} = 𝕧 𝕏'' ((𝕏'',𝕧''))·σ.


    # Example 8. Let a Boolean algebra (B,∨,∧,¬,0,1) and members b1,…,b9 of B be given.
    Set


    σ = ((∧,b1),(∨,b2),(∨,b3),(∧,b4),(∧,b5),(∨,b6),(∧,b7),(∧,b8),(∨,b9)).


    The ten initial segment τ of σ, considered from smallest to largest, are mapped
    to the following simplified members τ̂ of B:


    +   - 1

    +   - b1

    +   - b1 ∨ b2

    +   - b1 ∨ b2 ∨ b3

    +   - b1 ∨ b2 ∨ (b3 ∧ b4)

    +   - b1 ∨ b2 ∨ (b3 ∧ b4 ∧ b5)

