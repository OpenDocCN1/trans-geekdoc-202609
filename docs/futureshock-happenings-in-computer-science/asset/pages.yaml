- pgno: 39
  md: 'which states may resort to war and, once states are legally at war, the conditions
    in which warfare is conducted. The two sets of rules are deliberately independent
    of each other.


    *Jus ad bellum* requires, for example, that war must be fought for a just cause,
    such as to save life or protect human rights. It also requires that war must be
    defensive and not aggressive, and that it must be declared by a competent authority
    such as a government. For the present, it is unlikely that machines are going
    to be declaring war by themselves. It is perhaps reasonable to suppose therefore
    that humans are still going to be the ones taking us to war.


    Let us focus instead on *jus in bello*. The rules governing the conduct of war
    seek to minimise suffering, and protect all victims of armed conflict especially
    non-combatants. The rules apply to both sides, irrespective of the reasons for
    the conflict or the justness of the causes for which they are fighting. If it
    were otherwise, the laws would be pretty useless as each party would no doubt
    claim to be a victim of aggression.


    There are four main principles to jus in bello, the conduct of war. The first
    is the principle of humanity, which also goes under the name of the Martens clause.
    This was introduced in the preamble to the 1899 Hague Convention by Friedrich
    Martens, the Russian delegate to the convention. It requires war to be fought
    according to the laws of humanity, and the dictates of the public conscience.
    The Martens clause is a rather vague principle, a catch all that outlaws behaviours
    and weapons that the public might find repugnant. How, for instance, do we determine
    precisely public conscience? The Martens clause is often interpreted to prefer,
    for example, capturing an enemy over wounding them, wounding over killing, and
    the prohibitions of weapons that cause excessive injury or pain.


    The second principle of jus in bello is that of distinction. You must distinguish
    between the civilian population and combatants, and between civilian objects and
    military objectives. The only legitimate target is a military objective. It requires
    defenders to avoid placing military personnel or materiel in or near civilian
    objects, and attackers to use those only methods of attack that are discriminate
    in effect.


    The third principle of jus in bello is that of proportionality. This prohibits
    attacks against military objectives which are expected to kill or injure civilians,
    or to damage civilian objects which would be excessive compared to the expected
    military advantage. This principle requires attackers to take precautions to minimise
    collateral damage, and to choose where possible objectives expected to cause the
    least danger to civilians and civilian objects.


    The fourth and final principle of jus in bello is that of military necessity.
    This limits armed force to those actions that have legitimate military objectives.
    This means avoiding inflicting gratuitous injury on the enemy. The principle of
    necessity overlaps in part with the Martens clauses. Both take account of humanitarian
    concerns around the wounding of soldiers. And both prohibit weapons that cause
    unnecessary suffering.'
