    # 7.4 GRADATION TREES AND GRAPHS


    The condition of an RDR tree can be considered semantically, as the set of possible
    worlds where it holds, or syntactically, as a description in some language meant
    to be appropriately interpreted. To account for both points of view and avoid
    formalising concepts twice, we define the notion of an ℳ-embedding, to trivially
    map an interpretation to itself or to map a syntactic representation to its interpretation.
    It is natural to abstract interpretations as Boolean algebras (for readers keen
    to extend the setting and make it first-order, a bounded distributive lattice
    would be the natural choice). There is also a need to distinguish between the
    language that lets us work with a whole RDR tree, and the language of conditions
    of an RDR tree. The former should be naturally closed under negation, disjunction
    and conjunction—that is the very reason why a Boolean algebra is a appropriate—,
    while the latter could be much more restricted—for instance, one could naturally
    demand that conditions be atoms, or positive conjuncts. In the definition that
    follows, B targets the language of whole RDR trees, whereas A targets the language
    of conditions of RDR trees.


    **Definition 6.** We call ℳ-embedding a pair of the form (h,A) with the following
    properties.


    +   - h is a homomorphism from a Boolean algebra (B, ∨, ∧, ¬, 0, 1) into 2^ℳ;

    +   - A is a subset of B.


    In contexts where there is no risk of confusion, we identify A with (h,A) and
    use ∨, ∧, ¬, 0 and 1 being tacitly understood that they denote the second to the
    last members of (B, ∨, ∧, ¬, 0, 1). We also use ≤, <, > and ≥ in reference to
    the induced partial order on dom(h).


    We identify 2^ℳ with the ℳ-embedding (h,2^ℳ) where dom(h) is identical to (2^ℳ,
    ∪, ∩, ¬, ∅, ℳ) and h is the identity function. Given a set L of formulas, denoting
    by Ĺ the closure of L under ∨, ∧ and ∼, we identify L with the ℳ-embedding (h,Ĺ)
    where dom(h) = (Ĺ, ∨, ∧, ∼, ∨∅, ∧∅) and h maps each φ ∈ Ĺ to the set of members
    of ℳ in which φ is true.'
