  md: '# Definition 13.


    Let a gradation graph $G = (V,E)$ be given. We call *path of $G$* any sequence
    of the form $(v_0, ..., v_n)$, $n \in \mathbb{N}$, $v_0, ..., v_n \in V$, such
    that there exists no $v \in V$ with $(v, v_0) \in E$ and for all $i < n$, $(v_i,
    v_{i+1}) \in E$. We denote by $\mathrm{Paths}(G)$ the set of paths of $G$.


    # Property 14.


    Let a gradation graph $G = (V,E)$ be given.


    +   - *The multiplicity of 1 in V is equal to 1.*

    +   - *Every member of Paths(G) starts with 1.*

    +   - *Every member of V occurs in some member of Paths(G).*


    A gradation graph can be “unfolded” and turned into at least one gradation tree,
    with Figures 7.6 and 7.5 as an example (for this specific example, the “unfolding”
    is unique). This is what is expressed in the proposition and definition that follow.


    # Definition 15.


    Let a gradation graph $G = (V,E)$ be given. Set $|E| = n$. We call *presentation
    of $G$* any enumeration of $E$ such that for all $v, w, w'' \in V$ with $(v, w)
    \in E$ and $(v, w'') \in E$, if there exists a member of $\mathrm{Paths}(G)$ that
    ends in $(w, w'')$ then $(v, w)$ occurs before $(v, w'')$ in the enumeration.


    # Proposition 16.


    Let an $\mathscr{M}$-embedding $\mathfrak{E}$, an $\mathfrak{E}$-gradation graph
    $G = (V,E)$, and a presentation of $G$ be given. Map each $\sigma \in \mathrm{Paths}(G)$
    to a finite sequence $[\sigma]$ of members of $\{\vee, \wedge\} \times V$, as
    follows. Set $[(\wedge \emptyset)] = ()$. Given $\sigma \in \mathrm{Paths}(G)$
    of the form $(v_0, ..., v_n)$, $n > 0$, define $[\sigma]$ as


    $((\wedge, w_1^0), (\vee, w_1^1), ..., (\vee, w_1^{k_1}), ..., (\wedge, w_n^0),
    (\vee, w_n^1), ..., (\vee, w_n^{k_n}))$,


    $k_1, ..., k_n \in \mathbb{N}$, where for all nonzero $i \le n$, $(w_i^0, ...,
    w_i^{k_i})$ is the longest sequence of members of $V$ such that $w_i^{k_i} = v_i$
    and $(v_{i-1}, w_i^0), ..., (v_{i-1}, w_i^{k_i})$ all occur in $E$, in this order
    in the given presentation of $G$. Then $\{ [\sigma] \mid \sigma \in \mathrm{Paths}(G)
    \}$ is an $\mathfrak{E}$-gradation tree.


    # Proof.


    This is easily verified using the left-child, right-sibling representation of
    the tree defined by the closure of $\mathrm{Paths}(G)$ under subsequences.


    # Definition 17.


    Let a gradation graph $G$ be given.


    Given a presentation $\mathscr{R}$ of $G$, we say of the gradation tree defined
    in Proposition 16 from $G$ and $\mathscr{R}$ that it is *determined by $G$ and
    $\mathscr{R}$*.


    We say of a gradation tree that it is *determined by $G$* if it is determined
    by $G$ and one of $G$''s presentations.


    # Example 18.


    Recall the convention and notation in Examples 10 and 12. The gradation graph
    $G$ defined in the latter determines a unique gradation tree $T$, which is the
    one defined in the former. Based on the unique presentation of $G$, Proposition
    16 maps each $\sigma \in \mathrm{Paths}(G)$ to a member $[\sigma]$ of $T$. Figure
    7.7 shows $\sigma$ and $\widehat{[\sigma]}$ for all $\sigma \in \mathrm{Paths}(G)$.'
