    But it’s not only IBM that has elevated transparency to a position of great importance.
    It plays a central role in many of the ethical frameworks for AI proposed by governments,
    corporations and NGOs around the world.


    Transparency is certainly a useful tool in building AI systems, especially those
    with significant autonomy. But at best, it is a means to an end. It is not the
    end in itself. Indeed, there are situations where transparency is undesirable.
    For example, many companies use trade secrecy to protect valuable intellectual
    property. Google rightly does not share the secret sauce to its search algorithm.
    Not only is this the only way to protect the billions of dollars it invests into
    improving search, but it also helps prevent bad actors from manipulating search
    results. Transparency here would be a bad thing.


    There are also settings where transparency might not be possible. We have limited
