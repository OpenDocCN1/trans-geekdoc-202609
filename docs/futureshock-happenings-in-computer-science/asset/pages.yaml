  md: '# 3 The Future of Education Technology


    *Jake Renzella*

    School of Computer Science and Engineering, UNSW Sydney

    Kensington, Australia


    # 3.1 THE FUTURE OF EDUCATION TECHNOLOGY


    Technology’s impact on higher education has fundamentally changed the teaching,
    learning and assessment environment. Modern institutions have prioritised adopting
    educational technology to support the scalability and cost reduction towards the
    massification of higher education. While this has meant increased accessibility
    of university education, it has also contributed to a modern academic environment
    associated with degrading student-tutor relationships, student distrust, and regular
    breaches of academic integrity. Large-Language-Models (LLMs) such as ChatGPT and
    Gemini are already here, threatening the very fabric of the modern massified higher
    education environment.


    But technology can do more than increase the number of students enrolled in a
    course. In this chapter, we look forward and explore how educational technology
    can, has, and will unlock educators’ potential to change students’ lives. Artificial
    Intelligence may challenge modern assessment approaches, but alternative applications
    can provide dynamic, individualised learning pathways which can help tailor experiences
    to each student. Gamification can improve extrinsic motivation and help students
    achieve what they did not think possible. Machine learning techniques such as
    speaker verification can strengthen academic integrity in a student-friendly manner.
    Advances in extended reality (XR) will change how students interact with learning
    environments, introducing learning opportunities that were not previously possible,
    such as transporting students to rich, 3D-modelled worlds where they can interact
    and practice authentic activities to prepare them for the workforce.


    While it is true that technology can introduce friction between the student and
    educator, with thoughtful and collaborative applications, we have on the horizon
    the potential to unlock amazing educational experiences which can improve learning
    outcomes, strengthen academic integrity, and improve student–educator relationships
    – but it is up to us to build them.'
