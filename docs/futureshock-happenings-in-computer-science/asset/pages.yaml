  md: 'co-option of ethical language and broader pseudo-moral gestures. Extractivism
    – the process of extracting resources such as natural physical resources, as well
    as labour, data, and social resources such as identity, cultural tropes, and more,
    by AI for profit. Then as we will see, proper consideration of the issues surrounding
    ethics washing and extractivism lead quickly to an urgent need to acknowledge
    and confront the ethics of the relationship between AI and power.


    # 2.10.1 ETHICS WASHING


    Ethics washing is the simulation of ethical action via the co-option of ethical
    language and broader pseudo-moral gestures [26]. The allegation, not without some
    warrant, is that the dominant approach to AI ethics from within the tech-sector
    is largely a hollow exercise in marketing and public relations [28].


    As just one of a multitude of examples, consider IBM’s [16] statement that ‘ethics
    must be embedded in the design and development process of AI creation from the
    very beginning’. Here ‘ethics’, and more broadly terms such as ‘trustworthy AI’,
    ‘ethics by design’, and so on, appear as mere buzzwords. Their purpose, and the
    purpose of ethics washing more widely, is to distract from the need for, and to
    delay, meaningful regulation in the largely unregulated sphere of AI and machine
    learning [6], [29].


    Ethics washing involves the instrumentalisation of ethical language. This presents
    a twofold challenge. Not only does such instrumentalisation enable the very ethics
    washing described above, it threatens to conflate such ethics washing with genuine
    moral philosophy. This conflation risks precipitating ethics bashing. As argued
    forcefully by Elettra Bietti [2], bashing or ridiculing of washed ‘ethics’ occurs
    for two main reasons. Firstly, there exists a real tendency to conflate instrumentalised
    ethics washing with genuine moral philosophy, hence justifiable grievances with
    the former are extrapolated to the latter. Secondly, there exists either an ignorance
    of – or an outright hostility to – the possibilities afforded by genuine moral
    philosophy itself. Genuine moral philosophy, rather than aiding in the production
    of obscurantist pseudo-ethical slogans, is a mode of inquiry – underpinned by
    moral argument – that will enable the reasoned and warranted critical analysis
    of the grounds for the ‘ethical’ claims produced by the tech-sector’s moral laundromat.


    Such claims appear often as though they were ‘plucked out of thin air’ [28], with
    little if any indication of the normative ethical reasoning, if indeed there was
    any, out of which they emerged [28]. Moreover, such methodological opacity marginalises
    our ability to recognise and resolve conflicts that might occur between presumed
    moral norms on the one hand, and between those norms and the world on the other.
    One of the benefits of genuine moral philosophy is the mitigation of such marginalisation.


    Concerns about ethics washing have extended to wider concerns with transparency
    washing. Transparency washing is a trend that Zalnieriute [29] traces to a ‘procedural
    fetishism’ for compliance with micro-issues (such as onboarding modules and ‘ethics
    training’ workshops). Such compliance allows for a transparent presentation of
    itself, at the expense of any meaningful change of practice with regard'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'to moral behaviour. Transparency washing is not the exclusive province of the
    tech-sector. Rather, it is a cultural artefact that has emerged from a creeping
    corporate culture of responsibility-avoidance [29]. Transparency can cease to
    be a means to an end – of reforming practice in light of ethical failings – to
    become an end in itself.


    Of special concern with regard to AI is *participation washing* – the ‘exploitative
    and extractive means of community involvement in the name of participatory design’
    [1]. Participation washing is box-ticking, masquerading as genuine consultation.
    It is to treat people and communities as mere resources for reputational management,
    rather than as genuine partners in a process of moral growth. For example, having
    persons of colour in an advisory body is an empty gesture if one’s AI system continues
    to misidentify innocent person’s of colour as wanted felons, or ‘gorillas’ [13].
    Similarly, consulting members of the queer community is meritless if one’s AI
    is tasked with detecting sexual orientation from physiological features. Recalling
    the physiognomy case study in this chapter above, organisations such as Queer
    in AI warn, not without some plausibility, that the weaponisation of such technology
    – irrespective of its reliability – is horrifying to contemplate [1].


    Such ethical concerns take us beyond ethics washing and into considerations of
    *extractivism and power*. We now deal with each of these in turn.


    # 2.10.2 EXTRACTIVISM


    Extractivism is the process of extracting a resource for profit. Traditionally,
    the focus has been on the extraction of natural physical resources. Although this
    remains a focus for the ethics of AI, recent discussions of the ethical cost of
    extraction have expanded to include the extraction of labour, data, and social
    resources such as identity, cultural tropes, and more.


    The visual tropes used to market AI are clean, disembodied, hyper-realised high-res
    motifs, smoother than CGI world-scapes that point beyond the concrete and the
    flesh, promising transcendence. Would that AI be so ethereal.


    In reality, AI has emerged from and depends upon not only the space of pure reason
    and abstract ideas, but also a vast system of extraction of our planet’s natural
    resources. As discussed in this chapter above, Kate Crawford [8], Crawford explores
    in detail how it is that the lithium mines of Nevada are crucial for contemporary
    computation. Lithium is the main component of the rechargeable lithium-ion batteries
    on which all of our mobile devices depend, as do the backup systems of the data
    centres underpinning machine learning and AI. The manufacturing of such devices
    imposes a huge carbon footprint. The Bayan Obo mines of Mongolia contain approximately
    70% of Earth’s rare minerals, and the nearby artificial lake in Baotuo is black
    with over 180 million tonnes of toxic waste. The need for latex to insulate electrical
    cables has led to the destruction of the jungles of Malaysia and Singapore. The
    raw energy consumption of data centres and their cooling costs, from Amazon and
    Google to the NSA, as discussed above, are real. All of this reveals an infrastructure
    of AI with ethical imperatives that reach far beyond those suggested by the sci-fi
    aesthetic with which we are most familiar.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'The natural resources of our planet are one dimension of the common. Extractivism
    affects others – those within the wide category of ‘social production and social
    life’ [14]. Cases such as the ImageNet saga highlight the way in which personal
    details – in this case selfie images – have been harvested and extracted for the
    sake of training AI. Many millions of personal images were scraped from the internet,
    without the consent of their owners or subjects. The object and facial recognition
    systems built from ImageNet’s database have played a foundational role in the
    construction of training datasets for machine learning.


    ImageNet’s training datasets were not made by ImageNet’s AI. Necessarily they
    must predate it since they were used to train it in the first instance. Instead,
    the labour was undertaken by outsourcing it to a distributed workforce via Amazon’s
    Mechanical Turk service. This huge-scale labelling task was performed by human
    workers on piecemeal rates. Here too, this labour-extractivism performed by ImageNet
    reveals an infrastructure of AI with ethical imperatives that reach far beyond
    those suggested by any sci-fi aesthetic. Moreover, the labels used for the classification
    of images were far from ethically benign. Included in the taxonomy were ‘hooker’,
    ‘ape-man’, and worse. Two things are vital here. Firstly, training datasets are
    never accumulated neutrally [21]. Secondly, and a discussion of this will be forestalled
    until the following section, acts of classification are acts of power.


    Our medical histories are categorised and extracted by insurance companies and
    decisions are made (via the generation of statistical models) by their AI in order
    to mitigate risks to their revenues that affect our lives. Records of our online
    behaviour are taxonomised and extracted in order create categories of persons
    for the sake of prediction algorithms.


    Organisations such as Queer in AI have begun to warn against the extraction of
    marginalised communities by virtue of their exploitation in practices of participation
    washing as noted in the section above. Projects such as The Feminist Dataset [23],
    are attempts to accumulate datasets that are, although not morally neutral, aggregated
    in such a way as to mitigate some of the existent practices outlined so far. However,
    the massive amount of data required for AI training/machine learning renders projects
    such as The Feminist Dataset as proofs of concept only [7]. The resources required
    to implement such a dataset in practice, of such a size as to facilitate real
    concrete AI training, are simply not within the remit of such projects as they
    stand. Here again, we can see how an examination of extractivism as it relates
    to the ethics of AI and machine learning leads quickly to the need for a discussion
    of power.


    # 2.10.3 POWER


    We have seen above how the infrastructure of artificial intelligence can leverage
    access to, exploit, and extract resources from across the natural and social domains
    – from rare Earth minerals and water, to power consumption, labour, social capital,
    and identity. Such extractivism is both a demonstration and consolidation of great
    power.


    The earlier observation – that training datasets are never accumulated neutrally
    – is if anything conservative. Crawford [8] goes further, observing that the broader
    practice of data-scraping, tagging, and using data for systems training is'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'fundamentally a political act. The act of tagging, or classification, is one
    with potentially life-altering consequences.


    For example, the Australian government’s ‘Robodebt’ scheme (the automated Employment
    Income Confirmation System) saw a faulty algorithm incorrectly and unlawfully
    classify hundreds of thousands of Australians as owing the government roughly
    three billion dollars in repayments for overpaid social security benefits. Quite
    literally, this was the result of an elementary averaging error. In response to
    a Federal Court Class Action brought be Gordon Legal, the Australian government
    has cancelled hundreds of thousands of incorrect debts, and committed to repaying
    nearly one billion dollars in incorrectly and illegally recouped funds to all
    affected, and over one hundred million dollars in compensation. The scandal stopped
    the country, and caused incalculable psychological and social harm to nearly half
    a million social security recipients – those members of society least likely to
    have the political capital at their disposal required to defend themselves. At
    the time of writing, a royal commission appears likely.


    Where to from here? Crawford [8] quotes philosopher Achille Mbembé [18]:


    > > [AI] is about extraction, capture, the cult of data, the commodification of
    human capacity for thought and the dismissal of critical reason in favour of programming.
    Now more than ever before what we need is a new critique of technology, of the
    experience of technical life.


    Before we automate decision making, we might ask what reasons we have for doing
    so. For example, before succumbing to the fervour for autonomous vehicles, we
    might interrogate the vendors with some care. How will the vehicles’ avoidance
    systems be guided, and more dramatically, how secure is the software on which
    they are to run?


    Such a critique is not a call to reject artificial intelligence itself. However,
    in line with the suggestions made in [1], the distance between AI developers and
    AI users needs to be minimised as a precondition to any dialogue, and dialogue
    is a precondition to progress. Here our obligations are manifold.


    We have an obligation to investigate and communicate the nuances of the ethics
    of AI, with all of the opportunities and risks that AI affords. Similarly, our
    obligations with regard to educating ourselves and others, and to facilitate civic
    discussion of the issues, are very real. Information is power, so we might begin
    there.


    # 2.11 CONCLUSIONS


    When developing and deploying AI systems for social good, it is vital to consider
    the diverse and complex ethical challenges that arise. Checklists cannot be provided
    to address the many subtle issues that need to be considered. However, this brief
    introduction will hopefully help you start to ask some of the right questions.'
