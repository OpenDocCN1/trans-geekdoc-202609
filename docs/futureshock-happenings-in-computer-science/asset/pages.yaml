  md: 'We leave the interested reader with the following for consideration. Many of
    the issues above have been motivated by concerns surrounding accuracy, bias, and
    fairness. And rightly so at that. Let us suppose – for the sake of argument –
    that such concerns have been allayed. Does this imply that ethical concerns have
    been allayed also? Not obviously.


    Consider the situation where a COMPAS-type system has been optimised in such a
    way as to mitigate the concerns raised above. Suppose also that the accuracy of
    such a system when it comes to the prediction of recidivism far exceeds that of
    any human assessor. In this case, the problem of accuracy is, if not mitigated
    entirely, alleviated somewhat. Would this alleviate ethical worries in turn? This
    is doubtful. This predictive accuracy would emerge most likely from the sort of
    computational complexity that would ‘black-box’ the internal computational mechanisms
    that led to the recidivism prediction output. In such a scenario, it would not
    be possible for the presiding magistrate to give reasons for their decision, above
    and beyond a meek testimony along the line is ‘Well this is what the program has
    said, and it is rarely wrong’. This has more that a glimmer of dystopia about
    it.


    In case this scenario comes across as overly speculative, note that academics
    are facing a real concrete analogue at the time of writing. The cases in question
    are these where an academic is investigating a student illicit use of generative
    artificial intelligence in an assessment. The algorithms that check for and give
    a score on the use of generative artificial intelligence are black-boxed, proprietary
    applications. Such applications are themselves based upon artificial intelligence,
    and comprise many millions (or more) of calculations. In these cases, the academic
    is not able to give the student under suspicion any reasons of the sort that we
    would recognise as reasons per se. If the student is to ask for an explanation
    of why it is that the detection algorithm outputted the prediction that it outputted,
    what is the academic to say?


    Artificial intelligence – generative or otherwise – delivers already on promises
    of efficiency. We should mind however that efficiency is but one property amongst
    many. A practice may be inefficient, but of value nonetheless for the practitioner.
    Examples are many, and include law firm juniors preparing legal briefs, junior
    academics marking huge numbers of scripts, and more. In these cases and others
    like them, although the tasks might well be carried out by artificial intelligence
    in a manner more efficient, to pursue this would be to miss the point entirely.
    It is through such tasks that we form our character as members of a certain profession.
    Through them, we learn to put others ahead of ourselves and to distinguish crude
    material outputs from the acquisition of the moral virtues by which we conduct
    ourselves as moral agents. How it is that our use of artificial intelligence will
    contribute to the refinement of human character is a genuinely open question.
    Our moral duty is to answer it.


