  md: 'Once the design phase is completed, the chips can be synthesized to production
    files using Electronic Design Automation (EDA) software such as that provided
    by Synopsys and Cadence. Another way of testing them here is known as *emulation*,
    where special-purpose chips known as Field Programmable Gate Arrays (FPGAs) can
    be reprogrammed to mimic the chip being designed. All this testing is vitally
    important for integrated circuits, as there is usually quite an expensive cost
    associated with producing the final products, so one wants to make sure it will
    work after it comes out of the factory. Finally, once all the pre-silicon verification
    is finished, the designer will hand off to a fabrication company to physically
    produce (and usually package) the integrated circuits. The manufacturing of these
    chips is themselves a mind-bogglingly complex process worthy of a dozen books,
    but suffice to say it is usually completed with expensive photolithography machines
    which use light waves to transfer patterns onto silicon wafer substrates. Those
    machines are highly specialised, and the world leader in producing them is a company
    called ASML, which is based out of Europe.


    So, once the integrated circuits (and supporting components like resistors and
    capacitors) are all found on the global market, they will be purchased for assembly
    with the printed circuit board. This might happen in the same factory that produced
    the physical printed circuit board, or it can happen later at a different facility.
    A lot of things might need to be shipped around the world to make this happen.
    Once the components are obtained alongside the PCB, they can be hand- or machine-placed
    in the correct positions, with solder being used as the joining material. A soldering
    iron can be used to slowly melt the solder joint by joint, or a hot oven or plate
    could do it in a single pass.


    Once all this is completed, testing will usually need to happen again! If the
    board requires any on-board software or firmware, it could be installed as part
    of this process. Finally, the printed circuit board can be integrated with the
    rest of the product it is destined for.


    # 8.4 HARDWARE TROJAN COMPROMISES IN MANUFACTURING


    There are many, many ways in which the aforementioned process could be tampered
    with by a malicious actor. They might not even need to change very much of a circuit
    to achieve their nefarious goals. So what might a circuit’s compromise look like?
    Let’s consider what a malicious actor in the Integrated Circuit supply chain could
    do. This could be from a designer, who inserts a Hardware Trojan circuit at the
    early stages of the chip’s architecture, or it could be from a malicious foundry,
    which modifies the IC as it is being built. It could involve the addition of whole
    new circuits, or it could be as small as the modification of single gates.


    Let’s explore the theory behind a generalized IC’s Hardware Trojan here. Consider
    the circuit fragment depicted in Figure 8.3. Here, we have four inputs, ‘Alert1’,
    ‘Alert2’, ‘Alert3’, ‘Alert4’ which are joined with ‘OR’ gates such that if any
    one of the Alert signals is raised, an output ‘Alarm’ signal will also be raised.


    You could imagine how this circuit might be similar to something like a burglar
    alarm which could be triggered if any one of four windows was opened. Sounds'
