    Figure 6.1 An example of Visibility of System Status heuristic. Being able to
    understand and view the progress of the system task reduces cognitive load


    # 6.4.2 MATCH BETWEEN THE SYSTEM AND REAL WORLD


    The second heuristic of Match between the System and the Real World involves speaking
    the user’s language using words, phrases and concepts that are familiar rather
    than system-oriented terms and jargon [19]. If we can design a system that uses
    familiar language and concepts, this then allows the users to apply their prior
    knowledge and schemas to the task at hand and can help to reduce cognitive load.
    Moreover, an interface or system will be easier to use and understand if the information
    is presented in a way that is more familiar to users. This relies on avoiding
    jargon and unfamiliar terminology and keeping the language simpler and more user
    friendly. Ultimately, this heuristic relies on linking new information to users’
    prior knowledge to ultimately reduce the cognitive load of using an interface
    or a new system. An instance of this principle could involve using tools and icons
    that resemble items in the real world (Figure 6.2).


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_123_1.png)


    Figure 6.2 An example of Match between System and Real World. Email icons resemble
    the objects in the real world (for example Delete has an icon of a rubbish bin)
    to reinforce our understanding of what the command does and reduce cognitive load
    of learning the interface


    # 6.4.3 USER CONTROL AND FREEDOM


