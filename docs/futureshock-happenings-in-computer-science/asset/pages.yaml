- pgno: 134
  md: '# 7 Ripple Down Rules and Classification


    Eric Martin

    School of Computer Science and Engineering, UNSW Sydney

    Kensington, Australia


    # 7.1 RIPPLE DOWN RULES AND CLASSIFICATION


    Fields and subfields, often use variations on the same concepts and techniques,
    even if that is not always known to researchers working in their own domain of
    expertise. For instance, consider three subfields of Artificial intelligence:
    knowledge acquisition, knowledge representation, and . As particular techniques,
    they use Ripple Down Rules (RDR), belief revision based on preferential models,
    and learning in the limit with bounded mind changes, respectively. All three techniques
    are related to the topological concept known as the difference hierarchy. In this
    chapter, we show how developing a clear understanding of how RDR works, results
    in notions and questions on the basis of which such relationships naturally emerge.


    # 7.2 PRACTICAL RIPPLE DOWN RULES


    One aspect of knowledge acquisition is capturing human expertise. Recognising
    that it is an iterative process, that now and then requires revisions to what
    has been gathered so far, it is important to first, design a framework that makes
    the exercise as easy and effective as possible. Ripple Down Rules (RDR) is such
    a framework, developed at the School of Computer Science and Engineering (CSE)
    at the University of New South Wales (UNSW) by a former Head of School, Paul Compton
    [1]. Adapted from [5], Figure 7.2 shows an example of an RDR tree, the key structure
    of the RDR framework, at a very early stage of knowledge acquisition from medical
    experts.


    Each node of the tree comes with a set of conditions, meant to be evaluated as
    either true or false, and a conclusion—here, a reference to a particular diagnosis.
    That set is empty for the root of the tree, associated with a default conclusion.
    Each node has up to two children, connected to their parent either with an elif
    edge or with an unless edge; the latter kind of edge and only the latter leaves
    from the root. Decision trees only have implicit elif edges between siblings.
    This is illustrated in Figure 7.1 w.r.t. to the toy example of deciding whether
    to play golf: if the outlook is sunny then consider the level of humidity, elif
    it is overcast then decide to play, elif it is rainy then consider the strength
    of the wind.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '![](img/35d43ba1274e18d0f2f189e6392aa2e3_135_0.png)


    Each unless edge of an RDR tree, connecting a node A to a node B, often corresponds
    to having extended the tree from a stage where A was a leaf to the next stage,
    with B becoming a leaf, following the realisation that the conclusion associated
    with A’s condition is not always correct. Rather than fixing at least part of
    the tree, and possibly the whole tree, adding an unless edge amounts to applying
    a patch, leaving everything as it is except for... an exception node being added
    to the tree. An earlier stage of the RDR tree fragment given as an example likely
    did not have the leaf associated with “Diagnosis 48”. Processing a case that would
    lead to the conclusion that “Diagnosis 46” should not apply, despite the fact
    that the case satisfies the associated condition, the RDR framework would not
    fix that condition and then possibly, probably, the condition associated with
    “Diagnosis 32”, and the condition associated with “Diagnosis 01”; instead, the
    condition associated with “Diagnosis 48” plays the role of a patch, applied to
    the condition associated with “Diagnosis 46”. While it might appear that the procedure
    is “messy” and could result in a tree that is way larger than it optimally has
    to be, evidence supports the claim that it is the other way around.


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_135_1.png)


    # Figure 7.1'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Whereas decision trees are built from nothing but elif conditions, nonmonotonic
    reasoning is developed on the basis of nothing but unless conditions. Tweety flies,
    unless it is found out to be a penguin, in which case the conclusion switches
    to “it does not actually fly”, as the standard example goes. Whereas exceptions
    are usual built in by design in nonmonotonic reasoning, as a way to effectively,
    straight away bet for the most likely conclusion, accepting to later give it up
    and opt for a new conclusion as a new piece of information is being received,
    and then possibly give that second conclusion up as well for a third one, or why
    not for the first one again, as still another piece of information is being received,
    the RDR methodology reflects the more candid acknowledgement that one makes mistakes,
    but that’s okay, it is enough to apply patches; no need to get back to the drawing
    board and start from scratch.


    From a conceptual point of view, the RDR framework first appears as pretty straightforward.
    But “the devil is in the details”. A well explained data structure, a well explained
    algorithm is perfectly well “understood”, until one decides to implement it, then
    leading to the realisation that after all, this, and that, is not totally clear
    and further thinking is required. In this chapter, we will properly get into the
    formal details of the RDR framework. Also, “understand” is usually too crude a
    notion: from a level of understanding that happens to be shallow to start with,
    it is often possible for the understanding to get deeper and deeper by discovering
    connections to other notions or techniques. We just alluded to relationships between
    RDR and nonmonotonic reasoning. But there is much more. Once we’ve got all formal
    details right, a number of natural questions come to mind, that prompt for notions
    and techniques that directly relate to the preferential models of belief revision,
    to the mind changes of formal learning theory and its classification paradigm,
    to the difference hierarchies in topology, to the distinction between determinism
    and nondeterminism, between exponential and non-exponential complexity.


    For lack of space, we won’t be able to fully present the relevant notions from
    belief revision, formal learning theory, topology, complexity theory, and establish
    relationships in full generality and in great depth. Rather, we will define nothing
    but the notions that we need to formalise and study RDR, just pointing out to
    corresponding concepts in other fields, hoping to trigger the readers’ curiosity
    and leaving it to them to further explore the relationships. At the very least,
    we hope that readers will appreciate how simple notions can turn out to be fruitful
    and related to a broad body of knowledge, provided they are properly captured
    formally.


    # 7.3 LOGICAL BACKGROUND


    # 7.3.1 GENERAL BACKGROUND


    First, some general notation. Given a function f, we let dom(f) denote the domain
    of f. Given two sequences σ and τ, we denote by σ · τ the concatenation of σ and
    τ. Given a set S, |S| denotes the cardinality of S, whereas given a sequence σ,
    |σ| denotes the length of σ.'
