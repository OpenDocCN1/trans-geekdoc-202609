    # 5.5.2 OUR METAVERSE PLATFORM


    In our metaverse platform we recreated the university campus as a form of a virtual
    city, including distinct buildings representing schools like Computer Science,
    Mechanical Engineering, and Medical Science, mirroring the layout of the physical
    campus. Within this virtual campus, students can interact with each other through
    their avatars, engaging in discussions, collaborative work in labs, and attending
    lectures together in the VR lecture theatres. Each building in the city represents
    a specific academic discipline, allowing students to access the respective labs
    and facilities by navigating to the corresponding buildings.


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_102_0.png)


    Figure 5.1 The metaverse city environment and user''s avatar


    A key highlight of this project is the simulation of laboratory environments,
    providing students with access to expensive equipment that might not be readily
    available to all. Through this virtual environment, students can work with a wide
    range of lab equipment, including expensive and potentially hazardous instruments,
    within a safe and controlled setting. The dynamic nature of the equipment allows
    for authentic interactions and hands-on experiments, replicating the experience
    of using real-world machinery. They are functional tools, and students can grab,
    assemble, and conduct various experiments using them. For instance, we have successfully
    simulated a manufacturing robot and car engine from the School of Mechanical Engineering,
    a Programmable logic controller (PLC) from the School of Electrical Engineering
    and a'
