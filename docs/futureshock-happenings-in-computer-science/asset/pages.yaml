  md: '# LESSON 1: DATA IS HISTORICAL AND THEREFORE INHERENTLY BIASED


    Suppose you are building a machine learning system to predict where poachers poach
    based on past poaching data. By its very nature, historical data reflects the
    biases of the system in which it was captured. Perhaps patrols focused on particular
    watering holes and so caught more poachers near to these? There might have been
    significant poaching at other places, but you never found out about this. If you
    are not careful, you will bake into your AI systems these historical biases.


    **Case study (Google Translate):**

    In 2017, the media organisation Quartz uncovered significant gender biases in
    Google Translate. In Finnish, for example, there is only one pronoun, ‘hän’ that
    covers the third person singular. In English, on the other hand, there are two
    such pronouns, ‘he’ and ‘she’. So when Google Translate goes from Finnish to English,
    it has to choose whether ‘hän’ means ‘he’ or ‘she’. Despite significant work on
    this issue since 2017, the results remain disappointing.


    | Finnish | English |

    |---|---|

    | Hän tekee työn. | He does the work. |

    | Hän huolehtii lapsista. | She takes care of the children. |

    | Hän tekee rahaa. | He makes money. |

    | Hän tekee kotityöt. | She does the housework. |

    | Hän on pääministeri. | He is the prime minister. |

    | Hän on vaalea. | She is blond. |

    | Hän juo olutta. | He drinks beer. |

    | Hän hakee avioeroa. | She is filing for divorce. |


    In fact, Finland is the only developed country in the world where fathers spend
    more time daily with their school-aged children than mothers. Finland also recently
    had a female leader, the world’s youngest serving prime minister, and all five
    parties in the then coalition government were led by women.


    Tools like Google Translate are trained on large corpa, and this gender bias can
    be found in such English (and perhaps Finnish) texts. Despite knowing about this,
    it is proving difficult to remove such biases from the translations even for companies
    with the resources and expertise of Google.


