  img_proc: true
- pgno: 183
  md: '![](img/35d43ba1274e18d0f2f189e6392aa2e3_183_0.png)


    Figure 8.8 Side channel analysis examines the non-functional emissions from electrical
    devices. It can be used to non-destructively identify suspicious differences


    Side channels are any property of the device which is not directly associated
    with its function, so side-channel tests can include optical (e.g. take a photo),
    electrical characteristics (e.g. resistance, impedance, capacitance, slew rates,
    etc.), emissions (e.g. electro-magnetic interference waves which are produced
    during operation), heat (change in temperature as components warm up), vibration
    and acoustic (if there are moving parts), reaction times and clock frequency (how
    quickly does the device operate), power consumption (how much energy is it using),
    and so on. Some designs might even include ‘Hardware Performance Counters’ (HPCs),
    a type of internal circuit which can record instances of events occurring – more
    often used for functional testing, they provide yet another way we can characterise
    our circuits. Assuming all products have similar measurements, we can now perform
    destructive testing on just one of the samples. Then, if we prove that sample
    safe, each of the other samples should likewise be safe. Otherwise, if a sample
    does deviate, it is suspicious and it should also be more thoroughly tested. As
    an example, timing measurements were used to detect Trojan-introduced deviations
    in PCBs based on industrial controllers [21].


    Another method for defence, which can be used in conjunction with side-channel
    analysis, is to perform *split manufacturing* of a given product [13]. More typically
    used for integrated circuits, split manufacturing prevents overbuilding as well
    as greatly complicates the process for adding complex Hardware Trojans. Here,
    the process for building a given IC is split over two processes which will be
    done at two different foundries, ideally owned by two different companies. This
    prevents any one manufacturer from having the complete design files to compromise
    or plagiarize. Of course, split manufacturing is not a panacea, and certain attacks
    can still overcome this complication [29].


    Another defence for ICs is known as logic obfuscation or *logic locking*. This
    is a technique to manipulate a given circuit to add a key input. This input is
    designed to make sure that the overall circuit will only function correctly when
    provided the correct key value. Simultaneously, it should be difficult to figure
    out that key value! Logic locking is an enormous topic, and interested readers
    should explore Kamali’s recent survey [17].'
