  md: '# 3.4.1 **PERSONALISED, HIGHER EDUCATION**


    The challenge with implementing personalisation in higher education isn’t so much
    a technical one as it is a systemic issue. Current university policies and structures
    often focus on standardised curricula and fixed schedules which don’t easily adapt
    to the flexible, individualised approach of AI-driven personalised learning. Traditional
    assessment methods, like standardised, pre-scheduled exams and grading systems,
    are also not well-suited to accommodating personalised pacing and content.


    Another challenge is ensuring that personalised learning pathways align with accreditation
    standards and degree requirements. Universities must ensure that these personalised
    experiences meet the necessary academic standards and learning outcomes expected
    of their programs. This might mean rethinking how credit hours and course completion
    are measured.


    Despite these challenges, the benefits of personalised learning in higher education
    are substantial. It can increase student engagement, improve retention rates,
    and better accommodate diverse learning styles. As AI technologies continue to
    develop, integrating personalised learning into higher education is likely to
    become more common, offering a more flexible and student-centred approach.


    # 3.5 **GAMIFICATION: EDUCATION FOR THE TIKTOK GENERATION**


    Gamification is the application of game-design elements and principles in non-game
    contexts, such as education. It leverages elements like points, badges, and leaderboards
    to encourage participation and enhance the learning experience. The core idea
    is simple: make learning more enjoyable and fun by motivating extrinsic reward-centres.


    From the student perspective, extrinsic motivation involves engaging in an activity
    to earn rewards or avoid negative outcomes, this is in contrast with intrinsic
    motivation, which describes self-motivated students doing something because it
    is inherently interesting, valuable or enjoyable. Looking back, higher education
    has typically relied upon the intrinsic motivation of students who are assured
    (repeatedly) by friends, family, and society, that they will be rewarded for their
    efforts.


    Gamification is not new to higher education. Traditionally, higher education and
    society place significance on student results. Universities reward students with
    special titles for consistently achieving high grades (first class honours), and
    industry review student transcripts which contains a numbered grade. The sentiment
    goes that higher grades should improve a student’s chances of getting that dream
    job. This is an example of extrinsic motivation, it is not the learning and achievement
    itself that is motivating the student, but the high weighted average mark (WAM).
    Within shifting job markets, rising costs of living, and shortened attention spans,
    perhaps pulling further at the extrinsic motivational heartstrings could serve
    as a way to motivate student learning.


    Appropriate, technologically-powered applications of gamification in higher education
    include the use of points, badges, and leaderboards [16]. Points are a fundamental
    gamification element that can be awarded for completing tasks, answering'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'questions correctly, or participating in class discussions. Ideally, a point-based
    system could be integrated into a learning management system to provide immediate
    feedback, track progress, and even be exchanged for small rewards.


    Badges serve as a form of recognition for achieving specific milestones or mastering
    particular skills. They can represent various achievements, such as completing
    a course module, demonstrating proficiency in a subject, or displaying good study
    habits. Badges provide a sense of accomplishment, but also allow students to showcase
    their achievements to peers, fostering a sense of community and friendly competition.
    Moreover, the collection of badges can encourage students to explore different
    learning paths and challenge themselves in new areas.


    Leaderboards are another effective gamification tool that can boost motivation
    by introducing a competitive element to learning. By ranking students based on
    their performance or participation, leaderboards can create a sense of excitement.
    Courses at UNSW’s School of Computer Science and Engineering (CSE) such as Software
    Engineering Fundamentals have successfully utilised Leaderboards to anonymously
    rank students’ software accuracy. Anonymity, or pseudo-anonymity is essential
    to avoid discouraging lower-performing students. Leaderboards can be made more
    inclusive by recognising different types of achievements, such as effort or improvement,
    not just top scores. This approach ensures that all students feel motivated and
    valued, regardless of their initial skill level.


    Gamification has been in many other domains, including gaming itself to motivate
    particular behaviours and engagement. The very popular video game Dota 2 uses
    various gamification elements including badges, points, and leaderboards, with
