- pgno: 1
  md: '# Futureshock


    From AI ethics and cybersecurity to augmented realities, virtual interfaces, and
    much more, *Futureshock* provides an accessible introduction to the leading-edge
    topics of today. This collection of writings by experts in their respective fields
    invites the reader to explore new worlds that race towards us. This book serves
    as a map that shows the reader vantage points of understanding from which the
    new digital ecosystem may be seen with clarity. It does not presume any in-depth
    knowledge on behalf of the reader. Topics are covered from a conceptual angle,
    with the relevant conceptual architecture introduced without any need for a strong
    background in abstract mathematics.


    The common thread of the topics of this book is the new technologies, their environments
    and the user engagement and experience with them. There is broad coverage of topics
    pertaining to learning, design, education, metaverse, engineering, cybersecurity,
    and AI and ethics. It is organized independently and written purposively to enhance
    the reader’s conceptual literacy so that they may engage with future events in
    the field critically. By providing a view on the now and next across a broad range
    of areas, *Futureshock* is positioned as a springboard for discussion on these
    and related topics. An important topic on AI and ethics shares about developing
    and deploying AI systems for social good and considering the diverse and complex
    ethical challenges that arise.


    This book serves the professionals working in their fields as they gain further
    insight into the new digital ecosystem. It would be of interest to a general audience
    that is keen to learn about the state of play in the technology space. It can
    also be used as a supplementary text for students in a course that looks at the
    current and future issues in computer science.


    **Sebastian Sequ... Grayson** is a senior lecturer in epistemics at the School
    of Computer Science and Engineering at the University of New South Wales. His
    research spans across many areas of human information processing, including substructural
    epistemic logics, dynamic theories of negative information, data sonification,
    psychological theories of free will, ethics of computer science and information,
    and philosophy of mathematics.'
