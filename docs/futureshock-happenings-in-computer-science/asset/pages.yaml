    These capabilities have profound implications for education and society more broadly.
    Some notable AI figures, including Elon Musk, alongside other prominent tech leaders
    and researchers, signed an open letter in March 2023, urging a six-month moratorium
    on training powerful AI systems like GPT-4 [1]. The letter, organised by the Future
