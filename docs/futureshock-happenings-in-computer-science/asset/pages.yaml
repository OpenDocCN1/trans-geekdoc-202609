  img_proc: true
- pgno: 28
  md: 'in medicine, as doctors are often dealing with life-or-death situations. As
    a result, medicine has some very well-developed ethical principles to guide how
    technology touches our lives. Indeed, if we put to one side the thorny issue of
    machine autonomy, medicine appears to provide an adequate set of ethical principles
    to guide the development of artificial intelligence. There are four core ethical
    principles that have been developed over the last two millennia and that are used
    to steer medical practice.


    The first two principles commonly considered in medical ethics are *beneficence*
    and *non-maleficence*. These are closely related. Beneficence means ‘do good’,
    while non-maleficence means ‘do no harm’. Beneficence involves balancing the benefits
    of a treatment against the risks and costs it will bring. A medical intervention
    that has a net benefit is considered ethical. Non-maleficence, on the other hand,
    means avoiding harm. Of course, harm may not be totally avoidable, but any potential
    harms should be proportionate to the potential benefits.


    Many of the AI principles put forward in Google’s or the US DoD principles follow,
    in fact, from ensuring beneficence and non-maleficence. For instance, being built
    and tested for safety is needed to ensure AI doesn’t do unnecessary harms. Invasion
    of privacy is a common harm that AI may enable. And insisting that AI systems
    should be socially beneficial follows from beneficence.


    The third principle commonly considered in medical ethics is *autonomy*. It requires
    medical practitioners to respect the right of people to make informed decisions
    about their own medical care. Consent from a patient is essential before any medical
    treatment. And patients need to understand all the risks and benefits and to be
    free from coercion as they make decisions. Again, some of the AI principles put
    forward by Google follow from valuing the autonomy of humans as they interact
    with an AI system. Human accountability, for example, follows from a respect for
    human autonomy. Other ethical principles like transparency enable autonomy to
    be achieved. And respect for human autonomy explains why deceptive AI is to be
    avoided.


    The fourth and final principle commonly considered in medical ethics is the somewhat
    fuzzy principle of *justice*. This obliges us to distribute fairly benefits, risks,
    costs and resources. In particular, the principle of justice requires both the
    burdens and the benefits of new medical treatments to be distributed equally across
    all groups in society. As before, many proposed AI principles follow from seeking
    justice. Justice requires that AI systems should avoid creating or reinforcing
    unfair bias. AI systems should also be transparent and provide explanations so
    that justice can be seen to have been achieved.


    Of course, AI is not medicine. The four ethical principles commonly used in medicine
    are a very good start, but by far not the end of what we need for AI. Unlike medicine,
    artificial intelligence does not have the common aims and fiduciary duties found
    in medicine. AI also lacks the long and rich professional history and norms found
    in medicine, which ensure that these ethical standards are upheld. In addition,
    AI lacks the robust legal and professional structures found in medicine to ensure
    accountability.'
  merge: -1
