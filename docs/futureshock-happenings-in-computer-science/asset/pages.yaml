  md: '[35]. Cognitive load theory assumes a very limited working memory used to process
    new and unfamiliar information and an unlimited long-term memory used to store
    vast amounts of information over time and focuses on interactions between the
    two memory systems. Working memory, often referred to as our consciousness, is
    constrained by both the amount of new information it can process at one time,
    as well as the time the information remains in our consciousness. We overcome
    some of these processing limitations by relying on vast stores of prior knowledge
    stored in our long-term memories, in the form of schemas. Schemas are cognitive
    constructs that allow us to process large amounts of information by organizing
    information according to how it will be used [38]. Schemas allow us to process
    vast amounts of familiar information in a single unit. Moreover, the more knowledge
    you have in a domain the more information a single schema may contain. And the
    more practiced a schema is the more automated it becomes, and the less processing
    capacity it consumes [32]. Automated information can be processed without conscious
    attention and is often difficult to suppress, such when one is walking along a
    familiar route but aiming to arrive somewhere new and rather finds oneself walking
    in automatic mode to the usual destination. Schemas help reduce the burden on
    our limited working memories and the more automated they are the less of a burden
    they are on our limited processing resources. Prior knowledge can thus support
    our learning and reduce the burden on our limited cognitive resources.


    Moreover, more recent updates of the theory by Sweller [33] also allude to the
    evolutionary and biological aspects of our cognitive architecture that impact
    the way we learn. He alludes to the important distinction between biologically
    primary knowledge that we have evolved to acquire (such as facial recognition
    and learning to walk) and so does not need to be taught; and biologically secondary
    knowledge (such as mathematics and learning to write) that need to be explicitly
    taught to be learned. The purpose of our education system is to acquire biologically
    secondary knowledge, and we can use primary skills and knowledge (such as human
    movement or collaborating with others) to support the acquisition of new secondary
    knowledge and skills. Tapping into primary knowledge when users are overloaded
    can be a helpful strategy. Cognitive load theory is focused on empirically validated
    strategies to support the acquisition of biologically secondary information within
    educational institutions.


    Furthermore, Sweller [37] focuses on five biologically primary principles that
    relate to how we acquire knowledge and provide a framework for the cognitive architecture
    that underlies cognitive load theory. Amongst these principles, The Information
    Store Principle details the large store of information that we require to function
    in the natural world. The Borrowing and Reorganising Principle focusses on the
    bulk of information stored in long term memory that comes from other people –
    this principle is particularly useful in the context of educational collaborative
    practices. The third principle, Randomness as Genesis Principle, focusses on the
    generation of novel information during problem solving. Severe limitations of
    working memory when processing new information, with recent evidence showing depletion
    of working memory after cognitive effort [7]. And finally, the Environmental Organising
    and'
