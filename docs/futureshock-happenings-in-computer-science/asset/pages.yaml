    of rapidly advancing AI technologies, highlighting the need for shared safety
    protocols and thorough oversight.


    Putting aside the ethical and societal concerns, it is clear generative AI capabilities,
    notably LLMs will play a significant role in the future of education.


    This section explores how generative AI can be utilised in education in three
    broad categories: student-led use, tool-led use, and a forward look at the promised
    Personal AI Tutor.


    # 3.3.1 STUDENT-LED GENERATIVE AI


    Student-led use of generative AI encompasses a variety of pedagogical use of large
    language model tools such as ChatGPT. Students can leverage these tools directly
    to brainstorm ideas, generate outlines, and even receive feedback on their writing
    skills. Already, educators have begun to encourage or incorporate the use of LLMs
    in learning activities such as tasking students to revise LLM prompts to produce
    higher quality responses


    Generative AI can also assist students in content creation beyond traditional
    essays. For instance, students might use AI-powered tools to create visual aids
    for presentations, generate code for computer science projects, or even compose
    music for creative arts assignments. These approaches not only teach useful, AI
    literacy skills, but broadens possibilities of learning tasks.


    Generative AI tools can also be particularly beneficial for students with diverse
    learning needs. For example, LLMs are adept at providing real-time language translation,
    enabling non-native speakers to better understand course materials or engage with
    their educators. Similarly, text-to-speech and speech-to-text capabilities can
    assist students with visual or auditory impairments, promoting a more inclusive
    educational environment.


    # 3.3.2 TOOL-LED GENERATIVE AI


    Tool-led use of generative AI refers to the integration of AI technologies into
    existing educational tools and systems, often without direct student interaction
    with the AI itself.


    One potential application of tool-led generative AI are systems integrated into
    learning management systems (LMS). For example, AI chatbots integrated into LMS'
