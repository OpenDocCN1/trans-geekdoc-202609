  md: '# 6 UX Design Guided by Cognitive Load Theory


    Nadine Marcus

    School of Computer Science and Engineering, UNSW Sydney

    Kensington, Australia


    Alexandra Vassar

    School of Computer Science and Engineering, UNSW Sydney

    Kensington, Australia


    # UX DESIGN GUIDED BY COGNITIVE LOAD THEORY


    Jacob Nielsen has provided a list of 10 general principles for Interaction Design
    that are widely employed by UX (user experience) designers. These heuristic design
    principles serve to support the design of more usable interfaces. Cognitive load
    theory, which focuses on scientifically based empirical approaches to designing
    instructions and interfaces that minimize the burden on our limited capacity to
    process new or unfamiliar information, underpins the effectiveness of these principles.
    Using these principles in design therefore helps to guide the design in such a
    way that users can focus on the goals of the task at hand, rather than being distracted
    by the extraneous load of interacting with a poorly designed interface. Cognitive
    load theory posits that we have a limited working memory responsible for processing
    new information, and a vast store of familiar information stored within our long-term
    memories. Working memory, often referred to as our consciousness, is constrained
    both in terms of the amount of new information it can process at a time, as well
    as the time this information can remain in our consciousness. We can overcome
    some of these processing limitations by relying on our vast stores of prior knowledge
    stored in our long-term memories. By designing interfaces that aim to reduce constraints
    on our limited working memories and rather tap into resources stored in long-term
    memory, users will benefit from these design principles. This chapter aims to
    theoretically ground each of Nielsen’s heuristics within cognitive load theory
    principles, explaining why the practical guidelines are so effective in improving
    interface design. We will also provide an overview of relevant empirically validated
    cognitive load effects. Establishing this connection between the theory and the
    usability guidelines can help users of the heuristics better understand why they
    work and enable designers to more broadly and intuitively implement good design
    practices. It should be noted that while heuristic design principles and evaluation
    are a useful tool in the early stages'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'of the interaction design lifecycle, they should not replace thorough usability
    testing later in the design lifecycle.


    # 6.1 INTRODUCTION


    Usability heuristics are one of the most widely used methods that guide the design
    and evaluation of interactive interfaces, ensuring that interface design is comprehensive,
    simple, and user-friendly. The method is particularly useful for desktop interfaces.
    Used as part of a heuristic evaluation, these rules of thumb can be used to identify
    usability problems in a system’s interface design. Whilst they are not comprehensive,
    they cover a wide range of common issues that may affect the user experience.
    There are several different heuristics sets available for design and evaluation
    [28, 11, 25]. However, one of the most widely used heuristics guidelines were
    developed by Jacob Nielsen [20], based on years of experience in the field of
    human-computer interaction. Heuristics were not an entirely new concept, but were
    distilled from existing practice and research in usability. They were designed
    to be easy to remember and apply, making them accessible to practitioners in the
    field. While these rules of thumb are very practical, they also work because they
    tap into our cognitive strengths. The longevity of these heuristics is in part
    due to their broad applicability and the fact that they address fundamental issues
    in user interaction that go beyond specific technologies or trends. One of the
    other reasons, however, for this longevity is that these heuristics can tap into
    our understanding of cognitive architecture, specifically our limited working
    memory capacity. This chapter aims to improve our understanding of the value and
    durability of these original ten heuristics for good user experience and interface
    design, by linking them to cognitive load theory [19]. If we can better understand
    why the heuristics work so well then it can further facilitate their application.
    The heuristics work because they essentially reduce the load on our limited working
    memories and so make information easier to process and understand.


    However, it is important to understand the context in which the heuristics were
    originally developed by Jakob Nielsen [21]. Nielsen had access to a database of
    249 usability problems from 11 different projects, as well 101 usability principles
    that could explain the design flaws. He used a factor analysis to distil the principles
    down to 10 factors that explained most of the problems. This led to the 10 usability
    heuristics with the largest explanatory power, that have been extensively used
    for the past 30 years. Now that we understand how he derived these heuristic principles
    that are so widely used in the UX design domain, we will now tie this into a discussion
    of why these principles work, based on our understanding of human cognitive architecture.


    We begin with an overview of cognitive load theory and then use this understanding
    to expand on why and how each heuristic can work to improve UX design.


    # 6.2 COGNITIVE LOAD THEORY


    Cognitive load theory is an empirically validated theory that relates to how our
    cognitive architecture is used to support the learning and understanding of new
    information'
