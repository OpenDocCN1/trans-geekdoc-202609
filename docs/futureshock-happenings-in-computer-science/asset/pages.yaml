    remain under-represented. Diversity in the teams building AI is an important goal
    to strive for in order to help ensure tools are built that deploy AI fairly and
    responsibly. Businesses report that more diverse teams are better at spotting
    bias, better at creative to losses is greater than that to gains. Another example
    is risk aversion. Suppose you toss another fair coin, but this time if the coin
    lands on heads, you win $20, but on tails, you lose $10. Can I pay you $9 to let
    me play the game in your place? Play the game, and you win on average $10 more
    than they lose. But most people prefer certainty over risk and take the $9 even
    though it is less. This is not the choice that rational homo economicus makes.


    Algorithms offer the promise of defeating all of these cognitive biases, of making
    perfectly rational, fair and evidence-based decisions. Indeed, they even offer
    the promise to make decisions in settings either where humans are incompetent,
    such as decisions that require calculating precise conditional probabilities,
    or where humans are incapable, such as decisions based on data sets of a scale
    beyond human comprehension. Unfortunately the reality is that algorithms have
    done depressing little of this superior decision making yet. It is hard to find
