    and necessity. We can build autonomous systems like self-driving cars that perceive
    the world well enough not to cause an accident. But we cannot build systems that
    make subtle judgements about the expected damage inflicted by a particular weapon.
    Or the humanitarian trade-offs between a variety of different targets.


    Some of the principles of jus in bello like the principle of distinction may be
    achieved by AI systems at some point in the future. In a couple of decades, for
