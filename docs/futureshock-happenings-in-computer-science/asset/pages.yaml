  md: 'could potentially provide visual explanations, respond to verbal questions,
    and even analyse student handwriting or sketches.


    Furthermore, ongoing research in areas such as reinforcement learning and few-shot
    learning is improving the adaptability and personalisation capabilities of AI
    models. This could lead to AI tutors that can more effectively tailor their approach
    to individual students’ needs and learning trajectories.


    It’s also worth noting that the implementation of AI tutors need not be an all-or-nothing
    proposition. We are likely to see a gradual integration of AI tutoring capabilities
    into existing educational technologies and practices. For instance, AI-powered
    homework helpers, interactive textbooks, and personalised quiz generators are
    already making their way into classrooms and homes.


    # 3.3.3.1 Case Study: DCC Help


    The Debugging C Compiler (DCC) Help project [20] has been developed by academics
    at the University of New South Wales (UNSW) to integrate generative AI features
    into compilers. Compilers, the tools which all programmers use to convert source
    code into programs that can run on computers, are well known for being hard to
    use and especially hard to understand when things go wrong. When there are problems
    with a particular program (for example, a mistyped character or erroneous logic),
    compilers produce programming error messages which are designed to convey to the
    programmer what went wrong, and where.


    Improving compiler error message quality has been a pursuit as old as the tools
    themselves, but efforts are aimed at supporting error messages designed to help
    professional developers quickly find and fix bugs. To improve the code debugging
    training and support of novice programmers, DCC Help [21] integrated a large language
    model directly into the compiler. The integration provides accurate, novice-friendly
    programming error explanations. The family of AI tools has been used over 400,000
    times by UNSW Computing students to get back on their feet after a programming
    error, and is an example of a tool-integrated application of generative AI in
    education.


    Critically, most of the tool’s use occurs outside of business hours, demonstrating
    the role AI-driven tools can play in supporting student learning when the teaching
    team is not available, as well as reducing strain on limited resources.


    By designing custom integration of LLM-powered tools, educators can ensure pedagogical
    guardrails are enforced. For example, DCC Help limits the frequency in which students
    can use the tool, providing a gentle reminder that AI help features will not be
    available in the final exam.


    # 3.4 PERSONALISED LEARNING


    One of the most promising applications of AI in education is the creation of adaptive
