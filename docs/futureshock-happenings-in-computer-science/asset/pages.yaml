    # 2.6.2 THE MORALITY OF KILLER ROBOTS


    Can we build AI systems with significant autonomy that uphold the four principles
    of jus in bello, the conduct of war? Consider, for example, the Martens clause.
    The majority of the public are against the idea of lethal autonomous weapons.
    Indeed, as the UN Secretary General has clearly said, many of us find them morally
    repugnant. It seems therefore that lethal autonomous weapons conflict directly
    with the Martens clause.


    The other three principles are also violated by lethal autonomous weapons. For
    instance, we don’t know how to build weapons that can adequately distinguish between
    combatant and civilian. The Kargu drone deployed on the Turkish-Syrian border
    uses face recognition to identify targets. And yet we know that, in the wild,
