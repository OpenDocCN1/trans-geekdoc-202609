    # Case study (COMPAS):


    No discussion of fairness is complete without mention of this controversial case.
    The Correctional Offender Management Profiling for Alternative Sanctions (COMPAS)
    is a decision support tool developed by Northpointe and used by US courts in at
    least 20 different states to assess the likelihood of a defendant reoffending.


    Investigations have revealed significant racial biases in its predictions [10].
    In particular, the tool has been shown to fail to provide equality of opportunity.
    Many more Black people who will not go on to reoffend are predicted by the tool
    to reoffend than White people. On the other hand, Northpointe has vigorously defended
    the tool as it is optimised to ensure equality of precision. Black people who
    are predicted by the tool to reoffend will actually go on to reoffend at a similar
    rate to White people.


    This is a classic example of how we cannot optimise multiple measures of fairness
    simultaneously and must choose which we prefer. Is it better to avoid locking
    up people who won’t reoffend? Or should we care more that no racial group is disproportionately
    locked up incorrectly?


    # LESSON 5: FAIRNESS GOES TO THE CORE OF A JUST SOCIETY


    The identification of these sorts of trade-offs brings us back to some fundamental
    issues about what it is for society to be just and fair. Do we, for instance,
    adopt a utilitarian perspective where we maximise the total utility and worry
    about the net good to society as a whole? Or do we adopt a more egalitarian perspective
    where we minimise any individual harms and worry about just the worst off? AI
    tools may let us create new market places that can force us to make such difficult
    choices.


    Consider, for example, a health insurance company that data mines the UK Biobank
    containing genotypical and phenotypical information for half a million people.
    Suppose this identifies a new genetic test for bowel cancer. Through no fault
    of their own, people who fail this test might now have increased health insurance
    rates. Is this fair or should the burden of treating these people continue to
