    cannot see, even active sensors like radar and LIDAR which work in conditions
    which defeat passive sensors like our eyes and ears. It is plausible then that
    the killer robots will one day perceive the world better than humans can.


    However, there are other principle such as Martens clause that it is hard to imagine
