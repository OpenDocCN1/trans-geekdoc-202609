    users with ways to easily escape from places they unexpectedly find themselves,
    by providing clearly marked ‘exits’ or ways to undo things [19]. By giving the
    users clear control of what they are doing, this allows their cognitive resources
    to be focussed on what they are aiming to achieve and reduces unwanted distractions.
    It also has the potential to avoid the split attention involved with the user
    having to try to navigate many screens and possible options to work out where
    they want to be. The caveat to'
