  md: 'platforms can provide instant responses to common student queries about course
    logistics, deadlines, or basic content clarifications. Having a tool which can
    provide accurate, and instant responses to frequently asked questions reduces
    the administrative burden on teaching staff, and ensures students can focus their
    time on learning activities.


    Assessment is another area where tool-led generative AI could provide significant
    value. AI-powered systems can assist educators in quickly generating diverse and
    personalised assessment items, reducing the time required for test preparation.
    Furthermore, these tools can potentially automate the grading process for certain
