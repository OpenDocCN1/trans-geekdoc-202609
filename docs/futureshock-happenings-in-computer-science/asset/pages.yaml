  md: 'not remain but rather is constantly replaced with newer content and so if it
    is too long and too complex it may overwhelm our limited processing capacities.
    Tabbers et al. [40], and then Leahy et al. [15] found evidence for this effect
    with auditory information that was too long and complex leading to inferior performance
    when compared to visual information alone. In contrast, non-transient information
    (like written text or static graphics) is available to be revisited when needed.
    Singh et al. [29], found transient effects when comparing spoken to written text
    for learning, but found it could be moderated for the spoken information using
    segmentation and pauses. Moreover, Wong et al. [44] also found negative effects
    of transient information for both long and complex animated and audio content.
    We need to design materials and interfaces to be mindful of how transient information
    can lead to cognitive overload. Audio should not be too long or complex, and should
    ideally be under user control to pause, rewind and slow down, and similarly for
    instructional animations.


    # 6.3.6 HUMAN MOVEMENT EFFECT


    While the transient information effect can explain why users learn less from dynamic
    information (like animations) than static content, the Human Movement effect refers
    to the fact that it is better to use animations rather than statics to teach concepts
    that involve some form of human movement. This effect was discovered by Ayres,
    et el. [3] and Wong et al. [45] where they found superior learning outcomes when
    learning human motor skills (paper folding, knot tying) using instructional animations.
    We have an innate ability to learn by observing and learning human movement related
    content by observation can tap into this ability (as described by Van Gog et al.
    [42]). We learn how to tie a shoelace or throw a ball while watching others carry
    out these tasks, and animations that are designed with this in mind, can potentially
    reduce cognitive load and lead to improved user experiences. However, because
    we have an innate ability to learn by observing we sometimes overgeneralise this
    and include non-human movement related animations too liberally in our interfaces,
    and so potentially overload our users with transient information. Animations thus
    need to be included into interfaces with care and we should focus on animating
    content that has a human movement component associated with it.


    # 6.3.7 EXPERTISE REVERSAL EFFECT


    Another relevant cognitive load effect that has been empirically validated in
    numerous domains is the expertise reversal effect (see Kalyuga et al. [12]). This
    effect occurs when the format of information presentation that is best for experts
    is the opposite of what is best for novices and occurs because of the vast store
    of knowledge and schemas that experts in a domain, have acquired (e.g. [13, 7]).
    As an example of this, novices learn best by studying worked out examples, while
    experts may learn best by solving problems in a domain; additionally, novice users
    of an interface may want access to lots of help and extra tips, while experts
    may find this extra information unnecessary. The experts often design course materials
    and interfaces and so'
