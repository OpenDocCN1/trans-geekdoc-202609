  md: '# 4 Exploring the Integration of Design Thinking into the Engineering Discipline


    Alexandra Vassar

    School of Computer Science and Engineering, UNSW Sydney

    Kensington, Australia


    # 4.1 EXPLORING THE INTEGRATION OF DESIGN THINKING INTO THE ENGINEERING DISCIPLINE


    Ask someone to describe where the term ‘design’ can be applied, and chances are
    their mind will gravitate towards aesthetics – the cut of a piece of clothing,
    the curves of furniture, the architectural elements of a house or the composition
    of an art piece. I would imagine that not many would name engineering in that
    list, even though it is a field that lies at the very heart of problem-solving,
    and design, as a discipline, is centred on understanding problems and crafting
    solutions. So too, the idea of using design thinking to guide definition of problems
    in engineering is gaining momentum, and represents a huge shift in how we approach
    technical education and problem-solving.


    The marriage of design thinking and engineering recognises the fact that the challenges
    faced by modern engineers are not purely technical, but often involve complex
    human, social, and environmental factors that require a more integrated approach.
    And what can be more human than empathy – putting the people at the core of the
    solution first? Numerous case studies and real-world examples demonstrate the
    effectiveness of design thinking in tackling wicked problems, from improving healthcare
    delivery to addressing climate change concerns. One such example of this successful
    integration is the Mayo Clinic’s OB Nest program, which used design thinking to
    explore a new, low-risk pregnancy care model [9]. Pregnancy care is usually focused
    on clinical outcomes, with a complex regiment of frequent medical appointments.
    On average, women with low-risk pregnancies are required to attend 12-14 appointments
    over a forty-week period. Using design thinking to empathise with expectant mothers
    and understand their needs in care models, the new model redistributes care based
    on individual patient needs by providing self-measurement tools, and continuous
    flexible access to a care team [9]. The result of de-medicalising prenatal care
    for low-risk pregnancies has led to improved experiences for women overall, placing
    as'
