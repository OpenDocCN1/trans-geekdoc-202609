    is easily available and includes step to by step instructions that are easy to
    follow, for example, the Google calendar below allows a user to understand what
    each category is for by showing concise greyed out wording explanations (Figure
    6.11).


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_130_0.png)


    Figure 6.11 The Google calendar add an Event has short descriptions that provide
    guidance on what the user is meant to enter, thereby reducing cognitive load of
