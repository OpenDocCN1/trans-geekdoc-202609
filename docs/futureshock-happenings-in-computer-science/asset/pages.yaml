    Except-nodes shrink a set of models, elif-nodes expand it. It turns out that the
    branches of an RDR tree are associated with sets of models that make up a chain
    under inclusion (that is, the sets ℰ(σ) with σ ranging over an ℰ-gradation tree
    form a chain under inclusion). The strict order relation defined in Lemma 21 is
    designed to order the branches of a gradation tree accordingly, from the branch
    associated with the smallest set of models, to the branch associated with the
    largest set of models. Such is the contents of Proposition 29—a consequence of
    Lemma 27.


    **Lemma 21.** Let a gradation tree T be given. Let ≺ be the binary relation on
    T such that for all σ, τ ∈ T, σ ≺ τ iff σ ≠ τ and


    - either τ is the empty sequence, or

    - σ is of the form τ · ((∧, ∨)) · τ'', or

    - τ is of the form ((𝔛₀, 𝔳₀),..., (𝔛ₙ, 𝔳ₙ)), n ∈ ℕ, and there exists m < n with
    𝔛_{m+1} = ∨ such that σ is of the form ((𝔛₀, 𝔳₀),..., (𝔛_m, 𝔳_m)) · σ'' with σ''
    being either empty or of the form ((∧, ∨)) · σ''''.


    Then ≺ is a total strict order on T.


    *Proof.* Let nonempty σ₁, σ₂, σ₃ ∈ T be such that σ₁ ≺ σ₂ ≺ σ₃. Write σ₃ as ((𝔛₀,
    𝔳₀),..., (𝔛ₙ, 𝔳ₙ)), n ∈ ℕ.


    - Suppose that σ₂ is of the form σ₃ · ((∧, ∨)) · σ.

    - If σ₁ is of the form σ₂ · ((∧, ∨)) · σ'' then there exists a sequence σ''''
    such that σ₁ is σ₃ · ((∧, ∨)) · σ'''', hence σ₁ ≺ σ₃.'
