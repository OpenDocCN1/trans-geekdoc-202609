  md: '# 6.4.8 FLEXIBILITY AND EFFICIENCY OF USE


    Flexibility and efficiency of use is the eighth heuristic, which involves providing
    accelerators that are invisible to novice users, but that allow more experienced
    users to carry out tasks more efficiently [19]. This principle relies on the fact
    that the needs of novice and expert users are not the same and are almost the
    opposite, as per the expertise reversal effect, as described above [12]. Accelerators
    or short-cuts would require extra processing capacity for inexperienced or novice
    users who are still learning to use an interface or a system, so it is better
    to make them invisible. In contrast, accelerators, short-cuts, customised layouts,
    and macros all allow expert users to more easily automate basic functions and
    therefore work more efficiently and effectively. Examples of how to better cater
    for novices are training wheel systems, where certain system functionality is
    not available or greyed out in a menu system [24]; while for experts having short
    cut key presses like Ctrl+C for copying in a word processor and macros in spreadsheets,
    can facilitate and speed up their workflow and allow experts to work more productively
    (Figure 6.9).


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_128_0.png)


    Figure 6.9 Having a right click menu where novices can choose what they want to
    do, but also making shortcuts available for more expert users is an example of
    Flexibility and Efficiency of Use'
  merge: -1
  img_proc: true
