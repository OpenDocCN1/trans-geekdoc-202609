  md: 'human input. Human designers bring a level of intuition and sensory perception
    to these stages that AI cannot replicate. They can sense when something ‘feels
    right’ or identify potential issues that may not be apparent in data alone.


    Navigating ethical considerations, cultural sensitivities, and social implications
    requires human judgement and human values play an important role. AI, lacking
    consciousness and moral reasoning capabilities, cannot independently make the
    ethical decisions often required in the design process. This is not even considering
    the inherent bias and racial/gender stereotyping often present in LLM-generated
    output [45]


    Whilst AI can be a powerful tool in helping to augment and support the designs,
