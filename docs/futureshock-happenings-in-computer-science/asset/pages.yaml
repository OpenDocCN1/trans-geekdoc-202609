- pgno: 29
  md: '# Four central principles of medical ethics.


    +   - **Beneficence:** do net good.

    +   - **Non-maleficence:** do no harm.

    +   - **Autonomy:** respect human autonomy.

    +   - **Justice:** distribute fairly benefits, risks, costs and resources.


    # 2.3.1 ETHICAL PRINCIPLES FOR AI: FURTHER READING AND AN EXERCISE


    For a detailed survey and attempt to unify the many different ethical principles
    proposed for AI see [11]. For a discussion of ethical factors essential for projects
    focused on AI for social good see [12].


    # Exercise 2:


    Recall again the trolley problem (exercise 1).


    Consider and reflect upon the following. What do you think that the avoidance-protocols
    for a driverless car/autonomous vehicle should be, based on Google’s AI principles?
    Would the US DoD’s ethical principles suggest any different protocols or implementation
    decisions? If people’s identities and ‘social standing’ could be detected by the
    vehicles (by mobile devices of facial recognition say), then based on Google’s
    AI principles, should this be a relevant factor? According to Google’s AI principles,
    should all vehicles be programmed with the same protocols, or should they be permitted
    to vary – from private vehicles to those of the emergency services say? Should
    drivers be able to choose from different ‘protocol packages’ when purchasing or
    upgrading a vehicle from Google? Should such protocols be adjustable from within
    a vehicle, much like cruise control? Are the vehicles aware of the protocols under
    which other vehicles in their environment are operating?


    # 2.4 DECIDING TO USE AI


    Perhaps the most important ethical question that is often not asked is whether
    we should actually use AI. Once we have made the decision to use AI, we can use
    principles like beneficence, non-maleficence, autonomy and justice to guide its
    responsible deployment. But there remains the fundamental questions of whether
    we should have used AI in the first place. Consider the following.'
