    datasets.


    # Exercise 5:


    Recall again driverless cars/autonomous vehicles.


    Suppose you worked for a company building autonomous self-driving pods. Reflect
    upon and consider the following questions. From an environmental perspective,
    how many people should each such pod carry? Could such pods actually increases
    CO₂ emissions? You should consider issues like occupancy, distances travelled,
    parking and utilisation. In most cities today, the average car carries between
    one and two occupants. Is it possible that occupancy could dip below one person
    per vehicle if cars were autonomous? You might discuss different scenarios to
    explore different possible futures.


    # 2.9 REGULATION AND STANDARDS


    In terms of deploying AI responsibly, ethics does not provide a complete solution.
    Not every person or every organisation will invest the same energy and care in
    thinking ethically about their application of AI. Ethical judgements can also
    be highly personal and cultural. In addition, ethical judgements may permit behaviours
    that, whilst they are not morally wrong, may nevertheless harm society. For example,
    ethics has little to say about how unsophisticated investors can or should invest
    their retirement funds. But many countries regulate such investments to protect
    the unwary. There is therefore also an important role for regulation and standards
    to support the responsible deployment of AI.


    # 2.9.1 AI REGULATION


    Artificial intelligence is a generic technology. With other generic technologies
    such as electricity, we mostly regulate their application to specific tasks. Similarly,
    the regulation of AI may often be best focused on specific applications (e.g.
    the use of facial recognition software in law enforcement or the micro-targeting
    of adverts in social media). We must also be careful that regulation does not
    stifle innovation.


    There is an ongoing project within the European Union to regulate AI as a general
    purpose technology. The EU Artificial Intelligence Act is risk based. It identifies
    a list of high-risk applications where there are clear requirements such as safety
    assessment and risk mitigation before the AI system is put into service or placed
    on the market. It also identifies applications which are unacceptable to Europe,
    such as social scoring by governments. Other AI systems of limited risk will nevertheless
    carry transparency obligations. For example, users of chatbots should be made
    aware'
