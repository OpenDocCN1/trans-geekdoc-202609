  img_proc: true
- pgno: 173
  md: 'While hardware security is (a lot!) bigger than just the two topics of counterfeits
    and kill switches, these are what we’ll focus on in this chapter. Most hardware
    security concepts start from the same place as these: that is, the risk of misplaced
    trust in the manufacturers and suppliers of our devices. This foundation can provide
    you with a launch-point into other areas of hardware security as you find interest!


    So, in this chapter, we’ll cover how a little of how counterfeits and hardware
    Trojan attacks are possible in the first place, and what the possible consequences
    of such attacks are. We’ll talk a little bit about defence – in particular, what
    manufacturers of devices can be doing to try and protect their products. Finally,
    we’ll reflect on the future of hardware security, and how it might continue to
    impact you, the general reader, in future.


    # 8.3 THE FOUNDATIONS OF HARDWARE: CHIP & CIRCUIT MANUFACTURING


    Inside almost every modern device is a vast cornucopia of electronic components.
    Our cars, our televisions, our smart toothbrushes and our cellphones, our bluetooth
    speakers and our wireless headphones, our keyboards and electric guitars, and
    more – these are empowered by thousands of tiny microchips, also known as Integrated
    Circuits (ICs), each of which has been soldered onto larger Printed Circuit Boards
    (PCBs). For an example, see Figure 8.1.


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_173_0.png)


    Figure 8.1 A close-up photo of several microchip integrated circuits (ICs) soldered
    to a printed circuit board (PCB)


    Electronics such as these actually underpin more than just our households and
    personal items. They actually enable the entire modern world. They are in our
    infrastructure, with interconnected traffic lights and algorithmically controlled
    smart grids and municipal water supplies. They look after our communications and
    financial markets, with wireless communication towers and satellites in space.
    They are in our factories and our supermarkets, and they are in every vehicle
    of a modern military’s fleet. It is this reach which makes the concept that they
    could be tampered with so troubling.


    Historically, electronics and integrated circuit development could happen in-house.
    Many of the early electronics device companies around the world, such as Commodore,
    were good examples of vertically-integrated powerhouses capable of producing everything
    from the chip to the computer. But, during the late 20th and'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'early 21st century, manufacturing trends shifted globally, with outsourcing
    becoming more feasible, profitable, and popular. Nowadays, few countries have
    the sovereign capabilities to perform mass in-house manufacturing of electronic
    devices and components, and though the design of electronics continues in-house,
    most electronic devices and components in the modern era are now currently produced
    in vast factories in Asia, particularly in Taiwan and China.


    This separation of design and manufacturing has led to extremely long and complex
    supply chains for electronic devices. Devices can have components from dozens-to-hundreds
    of companies based out of an array of different countries. The supply chains include
    dependencies on both integrated circuits and the printed circuit boards they will
    be soldered to. Each IC and PCB also has to be specified, designed, and then tested.
    The magnitude of the complexity of this network is attempted to be illustrated
    in Figure 8.2.


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_174_0.png)


    Figure 8.2 Electronic product supply chains depend upon the creation of both Integrated
    Circuits and Printed Circuit Boards, which can happen in design houses and factories
    all over the world


    Of course, it is this complex globalized supply chain which enables the majority
    of the risks involved in electronics manufacturing. With so many different companies'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'and employees involved in the design of a single product, there are many more
    opportunities for a malicious actor to take part. These devices are not built
    in the same way that a bottle or a pot might be.


    Printed circuit boards are first designed in software, using computer-aided design
    tools like Altium, EasyEDA, or KiCAD. They are designed against specifications,
    i.e. a list of everything the final customer needs the system to do. PCBs can
    have a mix of analog and digital components, like resistors, transistors, and
    integrated circuits, which will interact with one another according to electrical
    rules like Ohms and Kirchhoff’s Laws. During this phase, the circuit designers
    will need to choose from a list of components which are available to them. They
    can peruse endless inventories from suppliers like Digikey, element14, and LSCC.
    You can think of this as finding the perfect piece of Lego to make a large set,
    or the exact size of screw you might need for securing the drawers in your kitchen
    at home.


    During the design phase, the circuit can be simulated using software like LT-SPICE
    and Proteus. This can be done in part or in whole, to ensure it meets the needed
    device specifications. Once satisfied, the designers now have a confirmed Bill
    of Materials (BOM) which lists all the parts and their quantities. They also have
    a schematic, which describes how each of the components are connected. The job
    will now pass to layout designers who will use this information to architect the
    actual physical circuit layout, where each component will actually be placed on
    the final printed circuit board, and the wires and copper tracks which actually
    join each component will be drawn. Another round of simulation can follow this
    step, and when satisfied, the layout and component position files can be passed
    with the BOM to the actual manufacturing company.


    To actually produce the printed circuit board itself, manufacturing processes
    proceed in layers, much like a cake. A base layer (often fiberglass) will get
    a thin layer of copper added, before a design is painted on using a special resistive
    material. This protects those areas when the board is then dipped into a chemical
    acid bath to etch away the unprotected copper, leaving only the desired circuit
    traces. This process might be repeated after an internal insulating layer if the
    board has additional copper layers – four and six layer boards are very popular.
    Then, holes can be drilled for components, and the board will get cleaned and
    plated, with a solder mask added to protect the board. Now it’s ready for the
    components to be added!


    Of course, someone also has to design the components which the PCB is going to
    rely on. This would usually have happened well before the design, but in rare
    cases could happen in parallel with the board design. For integrated circuits,
    this job actually looks remarkably similar to that already described, just on
    a smaller, more microscopic scale! Once again, designers will work to a specification,
    and design a circuit, although here the tools are likely to look quite different.
    Digital logic devices like computer processors will more often be designed using
    hardware description languages such as Verilog and VHDL. Chips with analogue components,
    meanwhile, may be designed via schematics and layout similar to the larger printed
    circuit boards. Simulation at this phase is possible for both digital and analogue
    chips.'
  merge: -1
  img_proc: true
