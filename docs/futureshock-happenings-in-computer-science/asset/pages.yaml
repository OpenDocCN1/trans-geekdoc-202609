  md: 'the importance of empathising with the player first, and using this as a way
    to set specific player experience goals early on in the design process to continue
    to guide ideas and exploration of design. However, much of the complexity in this
    field of design is due to the diversity of definitions, language, and experiences,
    which makes it difficult to drive a unified framework. Cormio et al. [8] in their
    interview with forty game designers, found that interviewees all acknowledges
    the presence of shared steps that structure the game design process and highlight
    the importance of an overall game design framework to ensure that development
    steps are not fragmented through misunderstanding.


    In our Game Design course, I am influenced by the design thinking process itself,
    and I encourage the use of the play-centric framework in the design of games.
    We also make full use of makerspaces, however, only after explicit instruction
    of concepts and ideas to ensure that students have the grounding of theory and
    a communal framework available to establish initial ideas. Interestingly, in the
    last offering of this small fourth-year course at UNSW, students arrived expecting
    to start coding their games. These students live and breathe games and yet they
    have never really thought about the very elements that make up a game per se,
    the building blocks and the design of a game itself. There appeared to be little
    understanding of iteration, and even less understanding of the importance of centring
    their design on the player. When I question what it is that they would expect
    to code, they often become overwhelmed, largely because they have not considered
    the actual design of the thing itself.


    The iterative nature of design thinking aligns well with the realities of game
    development. Games are rarely, if ever, perfect on the first attempt. They require
    constant refinement, and balancing. Design thinking embraces this, encouraging
    designers to view each iteration as an opportunity for improvement. This might
    involve playing with the game mechanics, refining the user interface, or adjusting
    the difficulty curve of the game. Even after a game’s release, this iterative
    process often continues through updates and potential expansions. This type of
    iteration at the very heart of the process encourages experimentation, creative
    thinking, and consistent playtesting.


    Before this can begin, game designers must understand their players, their motivations,
    and their behaviours. This understanding goes beyond simple demographics; it may
    involve creating detailed player personas and mapping out the emotional journey
    that a player might experience whilst experiencing the game. By putting themselves
    in the players’ shoes, designers can craft experiences that resonate with players,
    creating games that are not just played, but felt. The first time that I played
    a game called “To the Moon”¹, the opening score just tugged at the heart strings.
    The premise of the story was an experience that was felt, and the feelings were
    enough to forgive some of the gaps in the storyline.


    The process of empathising with players, thinking about different types of players,
    also encourages game designers to consider broader issues of accessibility and
    inclusivity. By keeping the diverse needs of players in mind, designers can create


