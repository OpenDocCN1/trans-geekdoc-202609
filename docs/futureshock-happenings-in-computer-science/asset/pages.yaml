    making high-quality resources more accessible to a wider range of institutions
    and learners.


    # 3.3.3 LOOKING FORWARD: PERSONALISED AI TUTORS


    One of the holy grails of generative AI is that of the personal, AI tutor. The
    application of LLMs and other generative models to compose an AI study companions
    or tutor has been spouted as one of the “game changers” of modern AI.


    A 24/7, personal tutor which can motivate, teach, test and otherwise support students
    along their learning pathway would clearly be a valuable tool, but how far are
    we away from this promise becoming a reality?


    Firstly, the issue of factual accuracy and reliability is paramount. LLMs are
    trained on vast amounts of data, but they are prone to producing incorrect or
    non-sensical output. This phenomenon, referred to as ‘hallucinations’, are one
    of LLM’s greatest challenges [24], with many efforts seeking to reduce the frequency
    of the behaviour [23]. In an educational context, where the accuracy of information
    is crucial, this presents a significant hurdle. Current AI models lack the ability
    to consistently distinguish between factual information and erroneous information,
    which could potentially mislead students or reinforce misconceptions.


    Secondly, while AI models can engage in dialogue with students, they currently
    lack the deep understanding of individual student needs, and emotional states
    that human tutors possess. They are text-based models, which cannot read body
    language or social cues. The ability to adapt teaching methods in real-time based
    on subtle cues from the student, or to provide motivational support during challenging
    periods, remains a complex challenge for AI systems where humans will likely remain
    superior.


    Despite these challenges, progress in this area is rapid and promising. Recent
    advancements in multi-modal AI models, which can process and generate text, images,
    and even speech, are bringing us closer to AI tutoring experiences. These models'
