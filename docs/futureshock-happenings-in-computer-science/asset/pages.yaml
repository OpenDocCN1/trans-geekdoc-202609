    # 5.5 OUR SUCCESSFUL METAVERSE EXPERIENCE FOR UNIVERSITIES


    Universities face challenges in providing high-tech and costly engineering and
    medical lab equipment to all students. Metaverse and virtual Reality (VR) offer
    a cost-effective solution by simulating lecture theatres and lab environments.
    Studies recognise VR’s potential for low-cost education [1]. Its immersive nature
    elevates user motivation [3], positively influencing perception in STEM courses
    [4, 8] by simulating laboratory environment to offer safe practice [5].


    While a couple of projects and studies have developed metaverse platforms for
    different purposes, to the best of our knowledge, no existing application has
    developed a multiplayer metaverse world that fully simulates an entire university
    campus, lecture theatres and lab environments with functional equipment, such
    as manufacturing robots or medical science labs employing Polymerase Chain Reaction
    (PCR) machines, to enable students to collaborate with each other in the virtual
    lab environment. Also, there is no study that evaluated the effect of metaverse
    on cognitive load of students in medical science and engineering laboratories.


    In response to this gap, we developed our own metaverse platform and conducted
    four different experiments, to evaluate the effect of Metaverse in Medical Science
    and Engineering students cognitive load while performing lab procedures. Two experiments
    are related to the medical science and another two to mechanical Engineering.'
