  img_proc: true
- pgno: 80
  md: 'It makes sense that it was only a matter of time, before we seriously started
    considering incorporating this type of thinking into the curriculum. Running for
    the first time in 2020, at the University of New South Wales each engineering
    discipline now requires students to complete a core second-year course focused
    on applying design thinking to real-world problems. From having taught this course
    myself twice, I find that undergraduate engineering students are often thrown
    by the course – they don’t quite know where to place it and how to go about the
    material. In the software engineering discipline, whilst most students go into
    the course with the idea that they will be able to “fly through” the material,
    once they are doing the course, they find that the large problem space and the
    wicked nature of the proposed problems actually leads to a large investment of
    time and effort. I would like to think that this may be a turning point for the
    students, as it was for me, and some do email me in later years describing their
    enjoyment of the process and asking for advice about other projects they are doing
    where they want to apply the same process.


    But these types of courses may have a huge part to play in engineering education.
    Traditional engineering education often focuses heavily on technical skills and
    theoretical concepts, sometimes at the expense of real-world applications. Design
    thinking addresses this by shifting the focus to empathy. Empathising with users
    helps to define the problem initially, and to re-imagine a solution that maintains
    user-centeredness. Students learn to consider the human aspects of engineering
    problems, not just technical specifications. Bridging the gap between theoretical
    knowledge and practical application, the most important element of these courses
    is it ignites something magical in our future engineers – there is nothing like
    the feeling of ideating and working together to solve difficult problems – probably
    the very reason they first enrolled in engineering.


    So the question remains as to what effects if any are there to integrating design
    thinking practices into engineering curriculum has on student learning outcomes.
    Pedagogical theory seems to support the principals of design thinking – in fact,
    the main characteristics of design thinking, such as collaboration and iteration,
    are relevant to pedagogical theories and cognitive psychology. The concepts of
    collaboration being beneficial to learning have been outlined as early as the
    1970s, as part of Vygotsky’s social learning theory [44], the concept of iterations
    builds into our growth mindset and theories of the self [11], which has also been
    associated with higher achievement in studies and greater resilience in students
    [46]. The iterative nature of design thinking – involving stages like empathising,
    defining, ideating, prototyping, and testing – teaches students to embrace failure
    as a learning opportunity and to continually refine their ideas. This further
    builds into the growth mindset, and aligns with industry, where innovation and
    continuous improvement are paramount. By encouraging multiple iterations and rapid
    prototyping, design thinking helps students develop resilience and adaptability,
    crucial traits for success in the fast-paced world of engineering.


    A vital aspect of these types of courses, and the process of ideating is the ability
    to work together with others, this may be within your own discipline, or across
    several'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'disciplines. Any course with teamwork will illicit very strong reactions from
    students and educators alike (not always positive). There are plenty of memes
    making their way round disavowing the virtues of teamwork, and plenty more that
    centre of constantly being let down by your teammates. Memes aside, in real life,
    engineering challenges rarely exist in isolation; they often intersect with economic,
    social, and environmental concerns. This complexity often necessitates collaboration
    in industry and beyond, and design thinking fosters this collaborative spirit
    inherently. For those that do get to have a positive experience in a collaborative
    environment, where all students have come to learn and to engage with the process
    and the project, they get to experience the Mecca of ideas. Teams are often composed
    of individuals with varied backgrounds, skills, and experiences and this combination
    is more likely to generate innovative solutions. For those teams, where things
    are not as collegial as they would want, students develop the communication and
    interpersonal skills necessary for success in the workplace, in addition to potential
    conflict resolution skills. There are however, also pedagogical theories supporting
    teamwork and collaborative learning [19, 42].


    Collaborative learning introduces the concept of a collective working memory,
    based on the principles of cognitive load theory, where the cognitive load of
    a task is shared between members of the group [42]. As Kirschner (2018) [19] posits,
    this shared cognitive resource provides team members with a dynamic scaffold of
    information, drawn not from external sources, but from the interactions of the
    team itself. This collective memory becomes a readily accessible repository of
    knowledge, available precisely when needed, thereby significantly enhancing learning
    opportunities. For this reason, teams can tackle more complex problems than individuals
    working alone. The collective knowledge and skills of a team allow for a more
    thorough exploration of challenges and potential solutions. The collaborative
    nature of this process also fosters a culture of continuous learning and adaptation,
    as team members share, critique, and build upon each other’s ideas throughout
    the design thinking journey. This iterative, team-based approach not only enhances
    the quality of outcomes but also accelerates the overall design process.


    Moreover, integration of design thinking skills helps to develop critical soft
    skills amongst students, which are often under-emphasised in traditional engineering
    curricula. Good communication skills are developed, as students are required to
    consistently and clearly articulate their ideas to their peers. Aspects of creative
    thinking, and thinking “outside-the-box” are encouraged, thereby helping to develop
    vital creativity skills. And lastly, problem-solving skills are practices as students
    are given problems with ill-defined domains, common to real-life engineering problems.
    Together, these help to develop resilience and a mindset that values challenges.


    Diversity within the discipline and within teams is an important factor in driving
    innovation and creating an inclusive environment for all. For years, the discipline
    of Engineering has been known to have a large gender imbalance [43]. In Australia,
    only 15% of graduates from STEM are women [14]. Research has explored the reasons
    for this imbalance, with various literature showing that females prefer the social
    and humanitarian side of engineering – solving problems that benefit'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'humanity [3, 15, 30]. The implementation of design thinking into the engineering
    curriculum, where the human-centred approach is valued, could be one way in which
    engineering programs can appeal to students who might otherwise be deterred by
    a purely technical focus. Fostering diversity has long been a goal in Engineering,
    and increasing the number of women in STEM professions has a long history of attempts
    – perhaps applying the design thinking process could also drive the solution to
    this wicked problem.


    # 4.3.1 MAKERSPACES


    The Maker Movement is a rapidly growing trend, where a group of people, or singular
    persons create products [21]. One of my favourite definitions, is given by Martin
    [28, p.30], and describes the maker movement as “...a community of hobbyists,
    tinkerers, engineers, hackers, and artists who creatively design and build projects
    for both playful and useful ends...”. A lot of maker-centred learning has most
    often been aligned with STEM subjects [39]. There is still a great deal of debate
    questioning what makers learn, and how that learning is achieved [39]. There are
    however, pedagogical theories to back the use of such spaces and position them
    as important in the overall learning process. For example, constructivism is based
    around the idea that students learn by doing [5], this means students use the
    environment around them and the information available to them to construct their
    knowledge – all integral to the makerspace. Cognitive theories centring around
    embodied cognition, also move to propel makerspaces and their place as important
    with regard to how students construct knowledge through movement – connecting
    their environment, body and knowledge [41]. There is however, evidence that explicit
    instruction and learning must take place prior to the making, in order for making
    to have a positive effect on learning outcomes [42].


    This move towards incorporating design thinking into the curricula at our large
    universities in Australia has resulted in the creation of design studios and makerspaces
    across campuses. These types of spaces provide the physical infrastructure necessary
    to implement design thinking principles effectively. They not only enhance technical
    skills but also foster creativity, collaboration, and innovation – qualities essential
    for future engineers. I have often found myself strongly wishing that these types
    of spaces existed when I was a student, and I am well known to get lost in the
    makerspace for hours experimenting with different ideas and building things –
    perhaps one of the greatest reasons for why I became an engineer in the first
    place. The Engineering makerspace at UNSW is always a hub of activity, fostering
    a community of makers and innovators within the engineering department and beyond.
    I love having a chat with the different personalities who use the makerspace,
    and particularly the people that run the makerspace itself – they always have
    a project moving, which is exciting to discuss! Around December of 2023, these
    makerspaces start to wind down and clear out for the holiday break, and this is
    my favourite time to get lost in the space. An abundance of small off-cuts, people
    making their home-made gifts, sunshine in the air (we are in Australia after all!)
    – together this really makes for a somewhat magical atmosphere.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'More seriously, despite providing me a way to use off-cuts and make ridiculously
    sized earrings, these spaces play a crucial role in modern engineering education,
    particularly in the context of design thinking. They serve as catalysts for creativity,
    innovation, and hands-on learning. The design of our makerspace encourages students
    to have open space for interaction, free exchange of ideas, and overall the feeling
    that you get when you walk into this space, with the dull scent of sawdust surrounded
    by what feels like creativity all around you plays a significant role in also
    getting the students excited about the opportunities that exist. Makerspaces often
    bring together students from various engineering disciplines and even other fields,
    such as industrial design or business. This cross-pollination of ideas fosters
    interdisciplinary thinking, which is important for solving complex real-world
    problems. These types of meetings are important for students to remove themselves
    from one-sided thinking, and to embrace different types of ideas and solutions.
    Makerspaces are also ideal for project-based learning, a key component of design
    thinking – unless a few people are operating the saws at once, in which case the
    space gets a little bit loud! We do have desks and tables set up in an alley outside,
    which allows students to work on long-term projects, simulating real-world engineering
    challenges (whilst also getting to be in the fresh air, which they sometimes forget
    to do as the term goes on!). With access to tools like 3D printers, laser cutters,
    and CNC machines, students can quickly prototype their ideas. This rapid iteration
    is a key principle of design thinking and is a huge part of the iterative lifecycle.
    This gives students a good baseline for which tools are appropriate at each stage
    of prototype development and allow experimentation without the fear of failure.
    Students can try out unconventional ideas and learn from both successes and failures.


    Of course, these types of spaces do not come without their challenges also. Establishing
    and maintaining these spaces requires significant investment in equipment and
    staff. The UNSW makerspace has a positive environment, and it shows in the way
    you are always greeted when you enter the space and helped.


    # 4.3.2 GAME DESIGN


    I wanted to touch on another course that I teach and absolutely love teaching
    – Game Design. This is an interesting branch of design, as the game studies did
    not become formally recognised as a legitimate academic discipline until recently,
    and the establishment of a cohesive framework became an important part of the
    process [35]. Literature offers multiple insights into methods for game design
    [8]. Bridging the gap between theoretical frameworks and the actual practical
    aspects of game design, some methods underline the importance of the iterative
    lifecycle and suggest the use of Prototype/Playtest/Evaluate/Refine lifecycle,
    which aligns with design thinking processes [38]. This method highlights the importance
    of the act of play itself, as it is the only means through which meaningful feedback
    is achieved, which makes it vital that this part of the cycle is not just an afterthought
    (as testing often is). Expanding on this, and now including the process of ideation,
    Schell [40] presents a playcentric iterative methodology that closer resembles
    the design thinking process, with stages of Ideation, Prototyping, Testing and
    Evaluation. Both authors underline'
