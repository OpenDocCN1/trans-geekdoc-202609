  md: 'Linking Principle focusses on the unlimited long-term memory and the environmental
    cues that can be generated to process information appropriate to that environment
    in our long-term memories. In summary, explicit instruction is necessary as we
    have evolved to learn from others via the borrowing and reorganising principle.
    This information needs to be organised in such a way as to reduce working memory
    load, because this load is most evident when processing new information (narrow
    limits of change). When we learn from others, we can reduce our cognitive load
    in comparison to generating our own novel information (randomness as genesis).
    Once we have obtained and stored the information in our long-term memory (information
    store), the limitations of working memory no longer apply, and the stored information
    can be transferred between long term and working memory via the organizing and
    linking principle. However, for the purposes of this chapter we will just focus
    on these basic tenets of the theory mentioned above that are most relevant to
    our discussions.


    Novice users rely on limited working memories to help them interact with new interfaces,
    and keeping the strain on limited working memory resources to a minimum is particularly
    important for them. In contrast, experts have huge amounts of familiar information
    stored in their long-term memories which they can retrieve as automated schemas
    when needed, and are less constrained by working memory limitations. Those that
    design interfaces are often experts and so less aware of these limitations, but
    need to be mindful of the needs of the novices they are also designing for [12].
    Moreover, when we design interfaces with the aim to reduce the strain on working
    memory (WM) and rather try to tap into familiar resources stored in long-term
    memory (LTM), all users will benefit. With this in mind, we begin an exploration
    of how to design interfaces that can also consider our novice users with limited
    working memory resources available to them.


    # 6.2.1 DIFFERENT TYPES OF COGNITIVE LOAD


    Also relevant to Cognitive Load Theory is the fact that there are three types
    of cognitive load. The first type of load is intrinsic load which is the load
    related to the inherent complexity of the information itself. This load is fixed
    and is related to the type of information the user is dealing with, and the concept
    of element interactivity [16]. This concept of element interactivity is dependent
    on how many elements are interacting in the presented information and is related
    to the prior knowledge of the person who is taking in information. For example,
    when learning to read English, the myriad of new letter formations and interpretations
    would constitute a high element interactivity, whereas for someone that knows
    how to read English, the characters would present as a single element and would
    therefore have a low element interactivity. Examples of high intrinsic load content
    that involve high element interactivity include learning the grammar of a new
    language, as there are many elements that need to be considered simultaneously,
    such as word order, tense, pronouns and so on. In contrast, learning the vocabulary
    of a new language is still a difficult task but each new word can be learnt individually
    and so the intrinsic load and level of interacting elements is low. However, intrinsic
    load is also impacted by the prior knowledge of the users and if they already
    have knowledge in the domain, it is less likely to have'
