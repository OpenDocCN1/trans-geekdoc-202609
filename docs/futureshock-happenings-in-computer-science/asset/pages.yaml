- pgno: 30
  md: '# Case study (Physiognomy).


    In 2018, Michal Kosinski and Yilun Wang made headlines by publishing controversial
    research claiming that computer vision algorithms could predict a person’s sexuality
    from a single image of their face. In 2021, Kosinski doubled down by publishing
    follow-up work claiming that computer vision algorithms could also predict a person’s
    political orientation, again from just a single image of their face. These are
    both examples of technologies that are chilling if they work and chilling if they
    don’t.


    Suppose, for a moment, you could predict someone’s sexuality from a single image.
    There are a number of countries where homosexuality remains illegal. In Afghanistan,
    Brunei, Iran, Mauritania, Nigeria, Saudi Arabia, Somalia and the UAE, homosexuals
    can even be sentenced to death. There are several other countries where homosexuals
    face persecution and violence. You have to ask, then, why Wang and Kosinski did
    their work in the first place. What possible good can come from software that
