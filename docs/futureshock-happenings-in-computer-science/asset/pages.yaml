  md: '# 6.4.9 AESTHETIC AND MINIMALIST DESIGN


    Creating an Aesthetic and minimalist design is the ninth heuristic and involves
    avoiding the use of information that is irrelevant and rarely needed [19]. This
    heuristic in essence refers to the Redundancy effect, as per above [5], where
    non-essential information is not neutral but rather requires extra processing
    and so increases the load on our limited working memories. If information is well
    laid out and easy to read and find, this reduces the amount of search needed to
    interact with an interface and find relevant information. Search using up our
    working memory capacity and so leaves less capacity to devote to understanding,
    decision making and learning. So, when we design an interface, we should only
    be including the essential information and should eliminate redundant information
    as processing it uses up our limited cognitive resources (Figure 6.10). For instance,
    websites that only include the essential information are much easier to use and
    navigate and thus more likely to lead to customers returning to use them again.
    Prior to Google, search engines were often cluttered with recent news, weather,
    and other information that was not necessary for the ultimate functionality of
    search. The Google search engine was able to optimize this principle by putting
    front and centre the essence of search and focusing on that single functionality
    without including the redundant information.


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_129_0.png)


    Figure 6.10 As an example, the Google countdown timer screen only has the counter,
    and three choices for adding extra time to this counter that would be frequently
    used (not adding an extra second for example, which would be redundant). The Start
    button is also well located, overall, the timer serves the purpose well with no
    redundancy on the screen to unnecessarily use up limited cognitive resources of
    the user


    # 6.4.10 HELP AND DOCUMENTATION


    The tenth and final heuristic is to provide Help and documentation, which alludes
    to providing your users with information that can be easily searched and providing
    help in a concrete set of steps that can be easily followed [19]. Help and system
    documentation that is easy to locate, understand and use makes it much easier
    to learn how to use the system. Information that is easier to learn uses up less
    of our cognitive resources and so is less of a burden on our limited working memories.
    A useful tip is to ensure help systems provide meaningful headings and cues that'
  merge: -1
  img_proc: true
- pgno: 130
