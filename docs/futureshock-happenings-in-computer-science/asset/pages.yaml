    # 4.5 CHALLENGES AND OPPORTUNITIES IN ENGINEERING DESIGN EDUCATION


    The last few years have seen an increased interest in generative AI, propelled
    by the release of OpenAI’s ChatGPT. Large Language Models (LLMs), such as ChatGPT,
    are based upon transformer architecture, and at their core exploit the fact that
    language follows a specific orderly structure. These models are trained over large
    quantities of text scraped from the internet. Huge strides have been made in the
    quality of output of these models, improvements in pattern recognition, data analysis,
    and even creative tasks like image generation and text composition have been consistently
    seen. There are, however, limitations to what can be produced by LLMs, which,
    despite their sophistication, operate within the constraints of their training
    data and predefined algorithms.


    Design thinking is inherently a human-centric process that relies heavily on empathy,
    innovation, and creativity – qualities that are, as yet, uniquely human. For example,
    the first stages of the design thinking process, requires one to empathise require
    a deep, intuitive understanding of human emotions, experiences, and unspoken needs.
    While AI can analyse vast amounts of user data, it lacks the emotional intelligence
    and lived experience necessary to truly empathise with users. This human touch
    is crucial in identifying subtle, often unsaid problems that play such an important
    role in coming up with innovative solutions.


    Similarly, the next stages of the design process, ideation, also show limitations
    of AI. True innovation often involves making unexpected connections, challenging
    established norms, and thinking outside-the-box. Despite the ability of LLMs to
    generate seemingly creative output, these models are fundamentally bound by the
    patterns and information present in their training data. They can combine existing
    ideas in novel ways, but they cannot truly innovate in the sense of creating something
    entirely new or revolutionary. Human creativity, on the other hand, can draw from
    a vast well of experiences, emotions, and abstract thinking to produce genuinely
    original ideas.


    Prototyping and testing phases of design thinking also highlight the importance
    of human involvement. While AI can assist in generating prototypes or analysing
    test data, it cannot fully grasp the tactile, experiential aspects of interacting
    with a physical prototype. Humans can quickly pivot their approach based on subtle
    feedback, intuition, or changing circumstances. They can read between the lines,
    understand implicit information, and make judgement calls based on complex, often
    contradictory factors. This is not yet possible to replicate, and still requires
    a vast well of'
