  img_proc: true
- pgno: 20
  md: 'juncture is largely epistemic in nature. Granting the position that moral judgements
    may be either true or false, how can we know, for some moral judgement in particular,
    that it is in fact a true and correct judgement?


    A well-worn and traditional way of responding to such epistemic concerns is through
    argument. An argument consists of one judgement, called the conclusion, and some
    other judgements, called the premises. The idea is that a good argument is one
    by which the premises give us good reasons or justifications for asserting or
    believing the conclusion. We often separate the premises from the conclusion with
    the word ‘therefore’. For example – All humans are mortal, and Socrates is human;
    therefore, Socrates is mortal.


    This looks like a good argument. If the premises are true, then they give us good
    reason to believe the conclusion. The wonderful thing here with this argument
    is that firstly the premises are true, and that secondly their truth is relatively
    uncontroversial. Other arguments are not so straightforward.


    A moral argument is one whose conclusion is a moral judgement. But what of its
    premises? What sort of judgements might give us good reasons to believe a moral
    judgement? As you will have noticed, moral judgements are very often a point of
    contention. Consider discussions concerning capital punishment, animal experimentation,
    sexuality, criminal justice, artificial intelligence, and so on.


    A good moral argument should make moral judgements less contentious by giving
    us good reasons to accept or reject the moral judgement that is the moral argument’s
    conclusion. How might we go about making such arguments? There are three main
    answers – utilitarianism, Kantian ethics, and virtue ethics. We will look at all
    three, starting with utilitarianism.


    # 2.2.1 UTILITARIANISM


    Utilitarianism [22] is a form of consequentialism. For consequentialists, actions
    do not have any intrinsic moral value. Instead, the only things that do have intrinsic
    moral value are consequences or states of affairs. Put simply, an act that brings
    about consequences that are, overall, morally good consequences is a morally good
    act. Similarly, an act that brings about consequences that are, again overall,
    morally bad consequences, is a morally bad act.


    Which consequences count as good and bad will depend on the type of consequentialism
    under consideration. For utilitarians, the only metric that matters is happiness.
    Specifically, the morally right action will be the one that results in a maximisation
    of happiness over unhappiness (hence ‘overall’ being emphasised in the paragraph
    above). As a toy example, suppose that we are considering which of two actions,
    A1 and A2 we should perform. Suppose that A1 will bring about 10 units of happiness
    and 5 units of unhappiness or suffering. Suppose also that A2 will bring about
    10 units of happiness and 11 units of suffering. A utility measurement U is the
    net balance of happiness H over suffering S: H − S = U. Given this, A1 is 10 −
    5 = 5 units of utility, and A2 is 10 − 11 = −1 units of utility. From a utilitarian
    perspective, A1 is the right thing to do.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'This is simplified, and contemporary utilitarians will calculate *expected
    utility* – which is the measure of happiness that *could* be brought about multiplied
    by the likelihood that it *will* come about – but the motivating idea remains
    the same. This idea, again, is that it is net amounts of happiness that matter,
    and only these, when it comes to deciding which of several actions is the right
    one to do with regard to some given situation. Utilitarianism gives us a clear
    methodology by which we might arbitrate between competing moral judgements. Its
    response to the epistemic problem outlined above is clear.


    A major attraction of utilitarianism is its epistemic stance towards moral judgements
    allows for easy compatibility with naturalistic scruples. *Naturalism* deserves
    a chapter all of its own, but put simply it can be thought of as the rejection
    of *supernaturalism*. All that exists, according to the naturalist, is the natural
    world. There is nothing outside of the natural order, so all things must be explained
    in terms of things within it if they are to be explained properly at all. Since
    happiness is a state of humans being in the world, measures of utility lend themselves
    to moral judgements being subsumable by empirical, scientific methodology. Utilitarians
    reject any claims about immutable, transcendent moral truths.


    # 2.2.1.1 Problems and responses


    Utilitarianism motivates many modern moral concerns, not least those close to
    discussions concerning AI. The by now infamous *trolly problem* concerns what
    it is that we should do in the following scenario. A runaway train car is heading
    towards a group of people along Track 1, and you are able to switch the track
    so that the train car is moved onto Track 2, thereby saving the people on Track
    1. Is switching the train car to Track 2 the right thing to do? Well, that depends
    on the situation on Track 2. Is it free of people, unlike Track 1, or does it
    have people on it too? A crude utilitarianism will say that the right thing to
    do is to ensure that the train car continues along the track with the fewer number
    of people. But is this right? What if one track has fewer people, but they are
    those who are close and dear to us? Utilitarianism appears blind to such considerations.
    Some utilitarians might insist that we are right to be.


    # 2.2.2 KANTIAN ETHICS


    Utilitarianism does not locate any intrinsic moral value in actions. All and any
    moral value to be found in an action are a function of the *consequences* of that
    action. Deontological or Kantian ethics [17] rejects this view. For Kant, actions
    *themselves* are the things with primary moral value. Consequences are not a consideration.
    A misgiving that many have felt with regard to utilitarianism is that it might
    count any action at all as being morally good if it resulted in a sufficient amount
    of net happiness. It can justify lying, torture, or slavery, supposing that only
    a small group of people were treated appallingly, and this resulted in overall
    net happiness.


    Kant, however, thinks that some things are absolutely right and wrong, come what
    may. Very importantly, according to Kant, we can work out what the correct moral'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'judgements are *simply by thinking about things carefully*. This too is in
    contrast to utilitarianism, for which empirical evidence plays a central role.
    For Kant it plays none. Instead, Kantians affirm that moral principles can be
    discerned through acts of pure reasoning. This is achieved via the *categorical
    imperative*:


    Act only according to that maxim whereby you can, at the same time, will that
    it should become a universal law


    This is wordy, but what it means is the following. One should only act according
    to a moral rule if one could want that same rule to be a universal law. The ‘could’
    here is important. It is meant to tie directly to rational conceivability – willing
    for an inappropriate moral ‘law’ to be universal is supposed to lead to a position
    that is inconceivable. It is this inconceivability that functions as a litmus
    test for moral judgements.


    An example helps to understand Kant’s categorical imperative. Consider lying and
    the moral judgement that *one should never lie*. Now suppose that you think it
    permissible to lie. Via the categorical imperative, consider that the permission
    to lie was universal. This means that everyone is permitted to lie. If everyone
    is permitted to lie, then there will be a lot of permissible lying going on. And
    if there is a lot of permissible lying going on, then there would not be much
    trust. In fact, there would be so little trust that basic social contracts would
    be unable to form. If basic social contracts had not formed, then we would not
    have advanced societies with intellectual institutions. Indeed, we might not have
    societies at all. But then we would not be here, contemplating the categorical
    imperative. But this is inconsistent with where we find ourselves and is hence
    ‘inconceivable’. Therefore, it cannot be the case that one is permitted to lie,
    and hence *do not lie* is a moral law revealed to us via our faculties of pure
    reason.


    Pure reason, or more specifically our ability to think rationally and to act on
    the basis of our rational deliberations, is for Kant, the mark of a person as
    opposed to a mere animal. It is also the centre of gravity for Kant’s larger ethical
    enterprise. Unlike animals, we have the capacity to act freely. We are acting
    freely when we are acting in accordance with our rational will. Although we are
    not always doing so – sometimes we are acting from instinct or impulse or our
    emotions – acting on the basis of our rational will means that we are, when doing
    so, acting freely, or *autonomously*, according to Kant.


    We have a duty to not violate or undermine this potential freedom of ourselves
    and others. This is because to do so would be to undermine one’s or another’s
    very personhood. It is this concern that motivates Kant to issue his dictum that
    we should always treat another person as an end in themselves only and never as
    a means to an end. If we were treating someone as a means to an end, then we would
    be treating them as a mere *resource* and not as a *person*. Understandably, Kantian
    ethicists take a dim view of advertising and marketing, as they depend essentially
    on manipulation and deceit.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 2.2.2.1 Problems and responses


    A Kantian ethics avoids some of the pitfalls presented by utilitarianism – namely,
    that otherwise horrific acts such as slavery and torture would count as morally
    good if they resulted in a sufficient degree of net happiness. However, whereas
    utilitarianism encounters criticism for deferring too far in the direction of
    contextual sensitivity, Kantian ethics encounters criticism for refusing any deference
    to context whatsoever. Infamously, the *come-what-may* condition on Kantian ethics
    is extreme and allows for no flexibility at all. If a gang of psychopathic murderers
    turns up at your door looking for their victim – an innocent child who is hiding
    under your bed, say – then deceiving the murderers by lying to them in order to
    save the child’s life remains the wrong thing to do. An unblinking Kantian response
    is that the murderers’ actions are on them, and them alone. You have an obligation
    to tell them the truth.


    # 2.2.3 VIRTUE ETHICS


    We have seen some reasons to be dissatisfied with both utilitarianism and Kantian
    ethics. What might said of both theories, is that they are *myopic*. The former
    attempts to reduce morality to the pursuit of utility maximisation, and the latter
    attempts to reduce morality to the pursuit of maximised rationality. To be sure,
    pursuing happiness over suffering, and pursuing rationally persuasive justifications
    of our actions should play a *role* in our moral judgements, but should either
    be *exhaustive*?


    Virtue ethicists [9] do not think so. Uniquely, they locate a distinctive role
    for *emotions* in moral judgement. Although alien to moral judgements from the
    perspective of utilitarian and Kantian ethics, a role for the emotions in moral
    judgements is not without some motivation. By way of example, consider a child
    gleefully burning ants with a magnifying glass. From a utilitarian point of view,
    there is no suffering at hand. Indeed, there is quite the opposite, given the
    resulting happiness of our sunbeam wielding child. Similarly, from a Kantian perspective,
    it is not obvious that any categorical imperative is being violated. If children
    were to burn ants one by one at will, then what of it?


    According to the virtue ethicist, however, surely we must think that the child
    is doing *something wrong*, and morally wrong at that. There is something disturbing
    about the child’s emotional reaction, something that betrays a deeper potential
    problem with their moral *character*. One’s character is composed of one’s dispositions
    to act in certain ways in certain circumstances reliably. A *virtue* is a morally
    good disposition, whilst a *vice* is a morally bad disposition. But where are
    the virtues *situated* in relation to the vices, and how might we *know* that
    a disposition is a virtue rather than a vice? Aristotle’s *doctrine of the mean*
    and *rationality of the passions* are answers to both of these questions, respectively.


    The doctrine of the mean is the idea that a virtue is always the average of a
    pair of vices. As an example, take the virtue of *courage*. Courage, according
    to Aristotle, lies in between the vices of *cowardice* and *recklessness*. The
    answer to the epistemic question – to how it is that we might know that a disposition
    such as courage is in fact a virtue and not a vice – reveals the unique role played
    by the emotions for virtue'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'ethicists. The emotions, or *passions*, have a central role to play in our
    rationally discerning the virtues from the vices. How so? Well, just as we use
    our faculties of visual perception in order to perceive colours, and our faculties
    of auditory perception in order to perceive sounds, so we use our faculties of
    *emotional perception* in order to perceive the virtues. Using the example of
    courage again, it is the emotion of *fear* by which we can perceive courage. But
    to do this, we must have the emotion in the right amount, or to the right degree.
    Too much fear will make me a coward, and too little will make me reckless.


    Having the right emotion to the right degree in the right situation is not something
    that we can learn overnight. Instead, it is a skill that we continue to refine
    throughout our lives. Having other virtues, such as honesty, modesty, benevolence,
    and so on, is a requirement for having any of them, since they cannot be had in
    *isolation*. One virtue cannot be had at the expense of another, as a *balance*
    between the virtues is a virtue in and of itself. Hence the guiding, or *meta-virtue*
    of *phronesis*, is the most important virtue of them all. Translated often as
    *practical wisdom*, *phronesis* is the virtue that a truly virtuous person has
    to have in order to adjudicate between the various virtues for a given situation
    in the right way.


    As distinct from both utilitarianism and Kantian ethics, in virtue ethics one’s
    motive matters greatly to the moral status of one’s action. A moral judgement
    is the right one for utilitarians if action upon it would result in the right
    consequences. A moral judgement is the right one for Kantians if it is arrived
    at via the right principles of pure reason. For the virtue ethicist, a moral judgement
    is the right one if acting upon it exemplifies a *virtuous character*. Merely
    imitating a virtuous person will not do. One must be moved by the same concerns
    and emotions, and in the same way, as would be the virtuous person, in order for
    one to be truly virtuous, and hence truly good.


    # 2.2.3.1 Problems and responses


    Aristotle, along with many virtue ethicists, holds the view that there is a right
    function for persons in general, just like there is for axes in general. The unique
    function of a person (in contrast to other objects and entities) is that they
    are *rational*. Recalling Aristotle’s views on the rationality of the emotions,
    we are good persons when we are living a good life, and a good life is one led
    by the pursuit of refined rationality. This position has, unsurprisingly, encouraged
    accusations that virtue ethics is *elitist*. On this point the virtue ethicist
    might plead guilty as charged.


    A more pointed criticism is that virtue ethics is a *messy* moral theory. One
    that does not give neat answers to moral questions in anything like the way accomplished
    by utilitarianism and Kantian ethics. Virtue ethics does not respond neatly to
    the epistemic question with which we started this discussion – namely how can
    we *know*, for some moral judgement in particular, that it is in fact a true and
    correct judgement? Here too the virtue ethicist might plead guilty as charged,
    and respond that utilitarianism and Kantian ethics are, although impressive intellectually,
    dangerously simplistic. Morality is many things, the virtue ethicist may say,
    but neat it is not.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'With frameworks of normative ethics now familiar to us, we may turn our attention
    to applications in artificial intelligence.


    # 2.2.4 ETHICAL FRAMEWORKS: FURTHER READING AND AN EXERCISE


    For a detailed exploration of the ethical requirements imposed by AI via autonomous
    vehicles – one that is especially relevant to the exercise below, see [3].


    Hooker and Kim [15] develop a systematic deontological approach to the ethics
    of AI. They take the rule-based nature of deontological ethics to be uniquely
    suited to machine applications, and they present their theory formally via quantified
    modal logic.


    Shannon Vallor [24] articulates and defends a carefully argued position for virtue
    ethics within the philosophy of technology and the ethics of AI. Vallor’s analysis
    includes a nuanced exposition of virtue ethics itself and covers social media,
    privacy concerns, armed military robots, transhumanism (the augmentation of human
    minds and bodies by technology into the ‘posthuman’ realm), and more.


    # Exercise 1:


    Recall the ‘trolley problem’ from the problems and responses section for utilitarianism
    above. The trolley problem soon becomes elaborate. For example, what if there
    are two people on the first track and one person on the second? Should you intervene
    in this case? Again, a crude utilitarianism would say that you should, as all
    things being equal, it is better to act in order to ensure that only one person
    is killed rather than two. More elaborately, what if there is one young person
    on the first track, with their entire life ahead of them, and on the second track
    there are five people, all of whom are old and very near the end of their lives?
    More elaborately still, what if the choice is between ten people on one track
    who are cruel and sadistic and one person on the other who has dedicated their
    life to benevolent medical research? Does the track on which either person or
    persons are on make a difference, morally speaking, to our actions?


    Here is your exercise. Imagine that you are responsible for designing the collision-avoidance
    protocols for driverless cars/autonomous vehicles. Given that the avoidance measures
    taken by such vehicles will be programmed in from the outset, the decisions that
    one thinks should be made with regard to the nature of such protocols map very
    closely to the decisions that one thinks should be made with regard to various
    elaborations of the trolley problem.


    Consider and reflect upon the following. What do you think that the avoidance-protocols
    should be from utilitarian, Kantian, and virtue ethics perspectives? Which of
    these, if any, do you think would guide you best when it comes to deciding on
    such protocols? If people’s identities and ‘social standing’ could be detected
    by the vehicles (by mobile devices or facial recognition say), then should this
    be a relevant factor? Should all vehicles be programmed with the'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'same protocols, or should they be permitted to vary – from private vehicles
    to those of the emergency services, perhaps? Should drivers be able to choose
    from different ‘protocol packages’ when purchasing or upgrading a vehicle? Should
    such protocols be adjustable from within a vehicle, much like cruise control?
    Are the vehicles aware of the protocols under which other vehicles in their environment
    are operating? All answers here will be important; none of them will be easy.


    # 2.3 ETHICAL PRINCIPLES FOR AI


    Ethical frameworks like utilitarianism provide a mechanism to argue for the right
    course of action. They can be applied to human decision-making just as well as
    machine decision-making. Indeed, they were all initially devised to understand
    human and not machine decision-making. We next consider how we might specialise
    such arguments to AI. In particular, we ask how we might instantiate such moral
    judgments to deal with the particular challenges thrown up by artificial intelligence?


    It turns out that there are many different answers to this question. Many governments,
    corporations, and NGOs have proposed somewhat different sets of ethical principles
    to govern the responsible deployment of AI. For example, in June 2018, Google
    announced a set of principles to guide its use of AI.


    **Google’s AI principles:**

    We believe that AI should


    +   1. Be socially beneficial.

    +   2. Avoid creating or reinforcing unfair bias.

    +   3. Be built and tested for safety.

    +   4. Be accountable to people.

    +   5. Incorporate privacy design principles.

    +   6. Uphold high standards of scientific excellence.

    +   7. Be made available for uses that accord with these principles.


    In addition to the above principles, Google also promised not to ‘design or deploy
    AI in the following application areas’:


    +   1. Technologies that cause or are likely to cause overall harm.

    +   2. Weapons or other technologies whose principal purpose or implementation
    is to cause or directly facilitate injury to people.

    +   3. Technologies that gather or use information for surveillance violating
    internationally accepted norms.

    +   4. Technologies whose purpose contravenes widely accepted principles of international
    law and human rights.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'One of these principles seems unnecessary. Contravening international law is
    already prohibited, by law. Others are not really concerned with ethics. For example,
    upholding standards of scientific excellence is good to ensure scientific progress,
    replicability, etc. It is not particularly concerned with any moral judgements.
    You might compare Google’s principles with the ethical principles for the use
    of AI put forward by the US Department of Defence in February 2020.


    # The US Department of Defence’s ethical principles for the use of AI:


    +   1. Responsible. Department of Defence personnel will exercise appropriate
    levels of judgement and care, while remaining responsible for the development,
    deployment, and use of AI capabilities.

    +   2. Equitable. The Department will take deliberate steps to minimise unintended
    bias in AI capabilities.

    +   3. Traceable. The Department’s AI capabilities will be developed and deployed
    such that relevant personnel possess an appropriate understanding of the technology,
    development processes, and operational methods applicable to AI capabilities,
    including with transparent and auditable methodologies, data sources, and design
    procedure and documentation.

    +   4. Reliable. The Department’s AI capabilities will have explicit, well-defined
    uses, and the safety, security, and effectiveness of such capabilities will be
    subject to testing and assurance within those defined uses across their entire
    life-cycles.

    +   5. Governable. The Department will design and engineer AI capabilities to
    fulfil their intended functions while possessing the ability to detect and avoid
    unintended consequences, and the ability to disengage or deactivate deployed systems
    that demonstrate unintended behaviour.


    You can find many similar principles in the dozens of ethical frameworks proposed
    to govern AI in the last half a dozen years. How do you make sense of this diversity
    of views? One reason for such diversity is that some of these principles are in
    conflict. For instance, transparency can make a system less robust, as bad actors
    can now manipulate its behaviours. As a second example, we might place different
    emphasis on collective good versus individual harms. Different frameworks may
    make different decisions about such trade-offs.


    We can also learn from other (older) technologies. After all, artificial intelligence
    isn’t the first technology to touch our lives, and every other technology we have
    invented has introduced ethical challenges.


    One field where we have worried greatly about the impact of new technologies on
    people’s lives is medicine. It’s not surprising that ethics has been a major concern'
