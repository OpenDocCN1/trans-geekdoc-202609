    The development of self-driving cars is one place where we have seen some of the
    most detailed and novel discussion around AI and ethics. This is unsurprising.
    A self-driving car is, in fact, a robot. And we don’t build many other robots
    that can travel autonomously at over 100 miles per hour. Much of this discussion
    has centred on the ‘trolley problems’ discussed above. Recall that this is a moral
    dilemma that was dreamt up by the English philosopher Philippa Foot in 1967. People
    seem to forget that it is designed to be a dilemma, and that like all dilemmas,
    you are required to choose between two outcomes, both of which are undesirable.


    # 2.6.1 AUTONOMY IN WARFARE


    Self-driving cars are not designed to kill. In fact, they are designed to do the
    opposite, to save lives. But when things go wrong, they may accidentally kill
    people. There are, however, other autonomous machines entering our lives which
    are designed expressly to kill: lethal autonomous weapons or, as the media like
    to call them, ‘killer robots’. The world faces a very critical choice about this
    application of autonomy in the battlefield. The technology to build autonomous
    weapons is ready to cross out of the research lab, and to be developed and sold
    by arms manufacturers around the world. Ongoing discussions at the UN have so
    far focused on retaining meaningful human control over lethal autonomous weapons.


    First and foremost, there is a strong moral argument against killer robots. We
    give up an essential part of our humanity if we hand over the decision of whether
    someone should live to a machine. Machines have no emotions, compassion or empathy.
    How then can machines be fit to decide who lives and who dies? Beyond the moral
    arguments, there are many technical and legal reasons to be concerned about whether
    we can build robots that able to follow the rules of war.


    War might appear from the outside to be a rather lawless activity. A lot of people
    get killed in war. And killing people is generally not permitted in peace time.
    But there are internationally agreed rules for fighting war. And these rules apply
    to robots as much as to people. The rules of war distinguish between jus ad bellum,
    literally the right conduct to go to war, and jus in bello, literally the right
    conduct in war. To put it in plainer language, the rules of war distinguish between
    the conditions under'
  merge: -1
