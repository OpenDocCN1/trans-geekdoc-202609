    # 6.4.6 ERROR PREVENTION


    Error prevention alludes to designing an interface in a way that errors are prevented
    from occurring in the first place [19]. This sixth heuristic is effective from
    a cognitive load perspective as when a user makes an error, cognitive resources
    are used up by trying to understand and then fix the problem, rather than being
    devoted to the task at hand. If errors can be avoided in the first place, then
    all cognitive resources can be devoted to the task which will lead to faster learning
    and better use of a users’ attention and limited cognitive resources. To achieve
    this goal, good user testing of an interface is needed, so that issues can be
    identified early on and resolved. Tips for how to design interfaces to prevent
    errors include avoiding confusing and redundant links, providing reminders and
    hints for common errors (such as reminders to attach a file or fill out a field
    in a form) as well using good consistent terminology, links, layout, and actions.
    For example, the AirBnB calendar picker dates will grey out any dates that are
    not available to prevent them from being chosen (Figure 6.6).


    # 6.4.7 RECOGNITION RATHER THAN RECALL


    The seventh heuristic is relying on Recognition rather than Recall, which involves
    making objects, actions, and options visible at the appropriate time [19]. If
    there is less information that needs to be remembered this can reduce the burden
    on our limited WM, which in turn can reduce the chance of making errors and can
    also make the interface and system easier to use and interact with. If the design
    can help minimise the load on our memories, this can also facilitate making good
    decisions. This heuristic works because we are much better at recognising a choice
    from an array of options than trying to recall an item stored in our long-term
    memories. Examples of how to apply this include using menus with familiar layouts
    and items instead of forcing users to type in their choices, making search histories
    available to your users'
