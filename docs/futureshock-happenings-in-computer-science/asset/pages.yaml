  md: '# Example 3.


    Suppose that 𝔞 consists of three atoms p, q and r and 𝓜 is the set of all interpretations
    over 𝔞. Define nine (positive) formulas as follows.


    +   - φ₀ = p ∧ q ∧ r

    +   - φ₁ = p ∧ q

    +   - φ₂ = p ∧ (q ∨ r)

    +   - φ₃ = p

    +   - φ₄ = p ∨ (q ∧ r)

    +   - φ₅ = p ∨ q

    +   - φ₆ = p ∨ q ∨ r

    +   - φ₇ = ∧ ∅

    +   - φ₈ = (p ∧ q) ∨ (p ∧ r) ∨ (q ∧ r).


    For all i ≤ 8, define Mᵢ as Mod(φᵢ). Set C₁ = {Mᵢ | i < 8} and C₂ = {M₀, M₈, M₆,
    M₇}. Then C₁ and C₂ are both in ℭ.


    Given a chain of models, the member of the chain that is most specific while being
    consistent with the information at hand is naturally of particular interest. In
    plain terms, this observation is captured by the notation that follows.


    # Notation 4.


    Let C ∈ ℭ and 𝔐 ∈ 𝓜 be given. We denote by min_C(𝔐) the ⊆-least member of C that
