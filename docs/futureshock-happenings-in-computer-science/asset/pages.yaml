- pgno: 137
  md: 'Here we let the logical setting be purely propositional; a first-order setting
    would bring interesting challenges and rewards, but require substantially more
    space. By 𝔞 , we denote a finite set of propositional atoms. For convenience,
    we let the syntax that defines formulas have a couple of notable features. First,
    a negation normal form is imposed. Second, conjunction and disjunction are defined
    as unary operators over finite sets of formulas rather than binary operators between
    pairs of formulas. In particular, ∨∅ and ∧∅ are formulas, that can play the role
    of False and True, respectively. So the set ℱ of formulas (over 𝔞) is the ⊆-minimal
    set such that (i) for all φ ∈ 𝔞 , φ and ¬φ are in ℱ and (ii) for all finite subsets
    F of ℱ, ∨F and ∧F are in ℱ. Having imposed a negation normal form, a unary operator
    is needed to negate an arbitrary formula, and the usual binary connectives are
    defined as abbreviations; all that could not be more standard. So given a formula
    φ, if φ is an atom then ∼φ denotes ¬φ, if φ is of the form ¬ψ then ∼φ denotes
    ψ, if φ is of the form ∨F then ∼φ denotes ∧{∼ψ | ψ ∈ F}, and if φ is of the form
    ∧F then ∼φ denotes ∨{∼ψ | ψ ∈ F}. Also, given two formulas φ and ψ, φ ∨ ψ, φ ∧
    ψ, φ → ψ, φ ↔ ψ and φ ⊕ ψ are alternative notations for ∨{φ, ψ}, ∧{φ, ψ}, ∼φ ∨
    ψ, (φ → ψ) ∧ (ψ → φ) and φ ↔ ∼ψ, respectively.


    Each node of an RDR tree is associated with a condition, often required to be
    a formula of a particular form, with specific results obtained for some forms
    and not for others. It is convenient to have a versatile and concise notation
    to define the particular forms of interest. Here we will restrict the investigation
    to three forms


    +   - 𝔞¬, the set of literals, built from 𝔞 using ¬;

    +   - 𝔞∧, the set of positive conjuncts, built from 𝔞 using conjunction;

    +   - 𝔞∨∧, the set of positive formulas, built from 𝔞 using conjunction and disjunction.


    We denote by 𝓜 a nonempty set of (propositional) interpretations (over 𝔞), that
    is, a nonempty set of subsets of 𝔞 (the possible models, or possible worlds).
    And given a formula φ, we denote by Mod𝓜(φ) the set of members of 𝓜 that are models
    of φ, according to the usual interpretation of the truth of a formula in an interpretation;
    given a set X of formulas, Mod𝓜(X) obviously denotes ⋂φ∈X Mod𝓜(φ). A formula φ
    is said to be (i) valid in 𝓜 if Mod𝓜(φ) = 𝓜, invalid in 𝓜 otherwise, (ii) satisfiable
    in 𝓜 if Mod𝓜(φ) ≠ ∅, unsatisfiable in 𝓜 otherwise. Given two sets X and Y of formulas,
    we say that Y logically implies X in 𝓜, and we write X ⊨𝓜 Y if Mod𝓜(∧X → ∧Y) =
    𝓜, and we say that X and Y are logically equivalent in 𝓜 if Mod𝓜(∧X ↔ ∧Y) = 𝓜;
    when X or Y is a singleton {φ}, we can replace X by φ in all notations and notation,
    and when 𝓜 is the set of all interpretations, we can omit “in 𝓜” in the expressions
    and omit 𝓜 as a subscript in the notation.


    The notions of Σ1,k, Π1,k and Δ1,k formulas, for k ∈ ℕ referring to a level in
    a so-called difference hierarchy [2, 3, 4], are relativised to 𝓜, the models of
    the members of 𝔞 making up the subbase of an underlying topology on 𝓜.


    # Definition 1. Let a formula φ be given.


    If φ is unsatisfiable in 𝓜 or valid in 𝓜 then φ is said to be Σ1,0 in 𝓜 or Π1,0
    in 𝓜, respectively.'
