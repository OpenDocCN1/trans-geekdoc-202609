  md: '# 3.6.2.1 Case Study: Real Talk with Deep Speaker


    Due to the serious concerns with full-blown proctoring approaches, academics explored
    more student and privacy-friendly alternatives. One innovative approach to maintaining
    academic integrity is speaker verification. This technology utilises voice recognition
    to verify a student’s identity during oral examinations or assessments [18]. By
    ensuring that the student who registered for the course is the same person taking
    an online assessment, institutions can prevent impersonation and ensure that assessments
    reflect the student’s own understanding and abilities. This method is less intrusive
    than other forms of surveillance.


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_66_0.png)


    Figure 3.8 The Deep Speaker System for Verifying Student Voice, as used in the
    Real Talk system [18]


    The tool as developed and evaluated by [17], facilitated AI-invigilated oral assessments.
    Students were prompted to begin their online oral assessment by verifying that
    their microphone and speaker equipment was functional. Once ready, students were
    played back a pre-recorded audio question spoken by their teacher. The questions,
    while provided to all students for a particular assessment, asked questions specific
    to the student’s work. For example, “Can you explain, line by line, the code your
    wrote for assessment A”. Students then had to respond to the question in real
    time, with the AI system verifying the respondent’s identity. The study found
    that the tool was successful in delivering scalable oral assessments in large
    computing courses, and paints a picture for a future, privacy-friendly approach
    to high-stake assessments.


    # 3.6.3 FUTURE ASSESSMENT SECURITY


    Contract cheating and generative AI tools have created new challenges for maintaining
    academic integrity in higher education. Meanwhile, the very technology which threatened
    assessment offers promising solutions to these challenges. Learning analytics,
    including keystroke logging and style detection, provide ways to verify student
    work without invasive surveillance. Online invigilation systems, while controversial,
    offer alternatives to traditional in-person exams. Less intrusive methods like
    speaker verification present a balance between integrity and privacy concerns.


    As the education industry moves forward, it’s clear that institutions have a variety
    of switches and levers which can be applied to design assessment of various levels
    of security and cost. More sophisticated and accurate style detection algorithms'
