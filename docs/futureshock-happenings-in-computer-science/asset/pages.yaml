    # Proposition 32.


    Let a gradation tree T with |T| > 1 and let σ ∈ T be given.


    +   - If σ is the longest sequence of the form ((∧, v0),…,(∧, vn)), n ∈ ℕ, then
    ρ_T^{-1}(σ) equals 1.

    +   - Assume that T contains a sequence of the form σ · ((∧, v)), and let τ be
    the (unique) longest sequence of the form ((∧, v0),(∨, v1),…,(∨, vn)), n ∈ ℕ,
    such that σ · τ is in T. Then ρ_T^{-1}(τ) equals ρ_T^{-1}(σ) − 1.

    +   - Suppose that none of the previous conditions applies. We can write σ as
    ((𝔛0, v0),…,(𝔛n, vn)), n > 1, and there exists a (unique) nonzero m ≤ n such that
    ((𝔛m, vm),…,(𝔛n, vn)) is of the form ((∨, vm)) · ((∧, vm+1),…,(∧, vn)). Then denoting
    ((𝔛0, v0),…,(𝔛m−1, vm−1)) by τ, ρ_T^{-1}(τ) equals ρ_T^{-1}(σ) − 1.


    # Proof.


    The proof is by induction on the size of gradation trees. The result is straightforward
    for gradation trees of size 2. Let k ≥ 2 be given, and assume that the result
    holds for all gradation trees of size between 2 and k. Let T be a gradation tree
    of size k+1. Let σ ∈ T and gradation tree T′ be such that T = T′ ∪ {σ}. Let σ′
    ∈ T′ be such that σ is of the form σ′ · ((∧, v)) or σ′ · ((∨, v)). We consider
    both cases in turn. Set i = ρ_{T′}^{-1}(σ′). Note that σ′ is not empty, so we
    can write σ′ as ((𝔛0, v0),…,(𝔛n, vn)), n ∈ ℕ, and i < |T′|.


