- pgno: 77
  md: '# 4.2 DESIGN THINKING


    The process of design is never simple. Imagine a series of nesting dolls. Who
    are these nesting dolls for? Are they for little hands, or big hands? In either
    case, each one has to be just the right size to fit into the next one. Thinking
    about who these dolls would be for would change how hard they are to open, and
    would also affect the patterns on the dolls themselves. Each two halves of a doll
    must meet precisely to have visual continuity. Who knew that such a simple toy
    would involve so much thinking, and the thinking can only start when we establish
    who these nested dolls are destined for. Similarly in real life, design involves
    thinking about a target audience, whilst also considering the multiple levels
    of interacting elements within a system, which may be nested or connected to another
    system and so another and so on.


    Central to the principle of design is the ability to engage in [20]. However,
    as a discipline, design thinking did not emerge until the later part of the twentieth
    century, when Rowe used the term ‘Design Thinking’, as a title of his book [37].
    In the ensuing decades, the process has moved from being an innovation buzzword
    to widely diffused practice [25, 32]. Multiple models have emerged that have described
    design thinking [10], with the community agreeing that a framework is needed to
    sustain the process across a variety of industries. The perceptions of design
    thinking are diverse, some describe it as a mindset or as a group of characteristics
    and principles [34, 12]; others consider it to be more as a process with distinct
    phases [32, 24, 31]. Liedtka mentions that despite the calls for the adoption
    of the design thinking process, “even the term itself is a subject of controversy
    among its practitioners and advocates.” [25, p. 926]. In fact, there appears to
    still be some substantial differences in the definition of the design thinking
    process, and agreement on its virtues [32, 18, 7, 6, 17].


    The tension perhaps centres upon the varied origin of the term [17]. Whilst design
    scholars have described the process extensively in design contexts [23], the term
    has only in the last decade become widely recognised in management practice as
    a process of creative problem solving [25]. Micheli et. al. in their systematic
    literature review of the process, propose eleven key principal attributes of design
    thinking [32]. One of the most commonly occurring themes in literature as related
    to the design thinking process is creativity and innovation [32]. Other commonly
    occurring themes are the user centredness of the process, frequently cited as
    a core feature of design thinking [7], its ability to problem-solve effectively,
    iteration and experimentation of design thinking, interdisciplinary collaboration,
    abductive reasoning, and tolerance of ambiguity and failure, amongst others.


    Despite the debate, design thinking, as a non-prescriptive approach to problem
    solving, is most well known for its categorisation into phases. Although there
    are variations on the names and number of phases included, when the most frequently
    cited models are considered a certain degree of commonality emerges [32]. Design
    Thinking is a non-linear, user-centric ideology and process that provides a solution-based
    approach to problem solving, consistently considering how the solution meets the
    needs of the user [34]. It is widely known to tackle “wicked” problems, ill-defined
    problems that are essentially unique and that have no immediate or ultimate test
    of a solution. Solutions to these wicked problems are not true-or-false, but rather'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'good-or-bad [27]. These kinds of problems require creative out of the box thinking
    and solutions.


    A number of frameworks define the process, but a number of distinct stages can
    be seen across all the frameworks. One of the common, core steps that we start
    with in the design thinking process is working through empathy to understand the
    user and their needs (to empathise). This helps us to define the problem, where
    the gathered insights from our empathy are synthesised to clearly articulate a
    core problem that needs to be addressed. The latter half of the process involves
    generating ideas – and is hence a judgement free zone. Following the ideating,
    a selection of ideas that are considered to be the most promising are turned into
    prototypes, allowing the exploration of different possibilities and the identification
    of potential issues early on in the design process. Finally, the prototypes are
    put to the test, however, the process does not end there! This is an iterative
    process, which means that we collect feedback from our users through all the stages,
    and apply it to help redefine the problem and define a solution. The process is
    simultaneously abductive (what is it that we are trying to solve), inductive (how
    are we trying to solve this problem?) and deductive (what is the result that we
    are looking for in our problem solving?) [10]. This means that all parts of the
    equation are considered starting with understanding what the actual problem is
    that is being solved. Throughout the process, however, the main aspect of the
    design thinking process is its focus on the needs of the user whilst also being
    practical and flexible with using some trial and error methods [10].


    You may be surprised to find out that in 2009, the company AirBnB, that provides
    homestay accommodation across the world, was close to going bankrupt. Within the
    startup game, they were just another idea that was getting swallowed up, with
    company revenue at just $200 a week [13]. The three co-founders of the business
    spent hours poring over the search results to understand why the business was
    just not growing, and what caught their attention is that the photos of the properties
    were just not up to par. People were using their phone cameras or using other
    images that were often the wrong resolution, were blurry, or were not appropriate
    to showcase the properties. It is no wonder that customers did not book properties
    when they did not even know for sure what those properties looked like! Surprisingly
    the team decided to take matters into their own hands, and travelled to New York
    to spend some time with the hosts of properties and to help them take higher resolution
    and more professional photographs of their properties. The team at this point
    was really going off a hunch, but this hunch was rooted in a higher understanding
    the needs of their customer base. A week later, the revenue doubled – the first
    financial improvement the company has seen in approximately eight months [13].
    AirBnb has grown steadily since then to a multi-billion dollar online platform.
    However, without that moment where the founders found themselves empathising with
    their customer and learning more about the customer’s needs that was a real turning
    point in the future of the company.


    It is not hard to see why design thinking really works. Solving a problem for
    a group of people, who are involved in first understanding the problem – surely
    this screams as a recipe for success. The other day I walked past a series of
    postcards that'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/35d43ba1274e18d0f2f189e6392aa2e3_79_0.png)


    Figure 4.1 A series of postcards introducing the concepts of Design Thinking to
    students


    were advertising the virtues of design and design thinking and were inviting students
    to find out more about these key concepts (Figure 4.1). What was most interesting
    about this set of postcards, is that perhaps the designers themselves did not
    consider the principles of design thinking when designing these. Despite their
    aesthetic value, it looks like the “empathise” step was forgotten with some questionable
    contrast appearing on a series of the cards. For example, the postcard that goes
    on to explain functionality as part of the process of design thinking has a dark
    text on a dark background, and ironically the postcard with vision of design thinking
    has a light text on a light background, therefore making it very hard to envision
    at all. This is just a simple example of what can happen when the key concepts
    of design thinking are not taken into consideration.


    # 4.3 DESIGN IN ENGINEERING EDUCATION


    From experience, I was an Engineering student about twenty years ago. Just two
    decades back, there was no design thinking or even really design being taught
    at university as part of the engineering curriculum. The courses were full of
    assessments and exams, that were broadly made up of clear-cut problems, where
    there was most definitely a correct answer. This put emphasis on rote learning,
    memorising facts and formulas and reciting those back. I found it to be fairly
    uninspiring. This continued until I was in the third year of university and by
    sheer accident had chosen Human Computer Interaction as an elective. This was
    my first encounter with user-centric thinking, iterative design processes, and
    with an introduction to creativity in problem solving. This was a turning point
    for me, as up until this point, I had contemplated changing degrees. But here,
    I finally got a glimpse of why I had decided to go into engineering, and what
    kind of problem solving I found to be particularly fascinating! It just made so
    much sense to me to involve the user, and to focus on iterating through the stages
    until an optimal solution (note that it may not be perfect) be reached through
    trial and error processes.'
