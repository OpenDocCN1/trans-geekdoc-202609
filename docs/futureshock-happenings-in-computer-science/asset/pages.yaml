  md: '# Definition 9.


    Let an 𝓜-embedding ℰ = (h,A) be given. An ℰ-gradation tree is a nonempty finite
    set T of sequences with the following properties.


    +   - T is closed under subsequences.

    +   - For all σ ∈ T, every member of σ is of the form (∨, v) or (∧, v) for some
    v ∈ A.

    +   - For all σ ∈ T, there is at most one v ∈ A with σ · ((∨, v)) ∈ T, and there
    is at most one v ∈ A with σ · ((∧, v)) ∈ T.

    +   - {ℰ(ρ̂) | ρ ∈ T} \ {∅} has cardinality |T|.


    A gradation tree (over 𝓜) is an ℰ-gradation tree for some 𝓜-embedding ℰ.


    # Example 10.


    Recall the convention and notation in Example 3. The closure of


    (( (∧,p), (∧,q), (∧,r) ), ((∧,p),(∧,q),(∨,r)),

    ((∧,p),(∨,q),(∧,r)), ((∧,p),(∨,q),(∨,r)))


    under subsequences is an 𝓐-gradation tree. It can be depicted as in Figure 7.5,
    with vertical links for pairs of the form (∨, v) and horizontal links for pairs
