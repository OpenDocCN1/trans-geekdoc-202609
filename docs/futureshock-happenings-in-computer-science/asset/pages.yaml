- pgno: 131
  md: '# 6.5 CONCLUSION


    Nielsen’s ten heuristics encompass a range of different guidelines and are very
    well regarded and used within the field of UX design. There have been different
    variations of heuristics and different sets of heuristics based on similar principles
    that can be used for evaluation of interfaces, as they allow scoring. The key
    message from this chapter is that Nielsen’s heuristics have survived the test
    of time as they ultimately reduce the load on our limited processing capacities
    and thereby improve overall interface design. If we as designers can better understand
    why they are effective, we can then more intuitively use and apply them into interface
    design. While the heuristics were not specifically designed with a focus on the
    nature of our cognitive architecture, they have in essence been so successfully
    used and applied over many decades because they tap into the nature of our cognitive
    architecture and make information easier to process and make sense of.


    # REFERENCES


    +   1. Robert K Atkinson, Sharon J Derry, Alexander Renkl, and Donald Wortham.
    Learning from Examples: Instructional Principles from the Worked Examples Research.
    *Review of Educational Research*, 70(2):181–214, 2000.

    +   2. Robert K Atkinson, Alexander Renkl, and Mary Margaret Merrill. Transitioning
    From Studying Examples to Solving Problems: Effects of Self-Explanation Prompts
