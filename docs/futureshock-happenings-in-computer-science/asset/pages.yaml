    # 5.2 WHAT THE METAVERSE IS


    The concept of the metaverse has transcended its origins in science fiction and
    has rapidly become a transformative force with diverse applications across various
    industries. The metaverse is a virtual reality space that transcends the traditional
    boundaries of online interaction, creating a digital universe where users can
    engage with a computer-generated environment and interact with each other in real-time.
    It goes beyond conventional two-dimensional internet experiences by offering immersive,
    three-dimensional environments where users can navigate, communicate, and collaborate
    seamlessly. In essence, the metaverse is a collective virtual shared space that
    encompasses the sum of all virtual worlds, virtual reality technology, and the
    internet itself, providing a comprehensive and interconnected digital experience
    [38].


    The gateway to the metaverse is virtual reality (VR) technology, immersing users
    in simulated environments that closely replicate real-world scenarios. Users can
    engage with these simulated environments using head-mounted displays (HMD), motion
    tracking, and haptic feedback devices, enhancing the overall sense of immersion
    [51], [39].


    Within the metaverse, users can create personalised avatars, representing themselves
    in the digital realm, and engage in various activities ranging from socialising
    and gaming to business meetings and educational experiences. Virtual currencies,
    blockchain technology, and decentralised systems are also integral components
    of the metaverse, providing users with a sense of ownership and security within
    the digital space. As the metaverse continues to evolve, it holds the promise
    of transforming the way we perceive and interact with the digital realm, offering
    new possibilities for entertainment, communication, and collaboration on a global
    scale. The metaverse is not confined to a single platform or application but is
    an interconnected network of virtual spaces, accessible through various devices
    and platforms. It has the potential to revolutionalise the way we work, socialise,
    and consume information by blending the physical and digital worlds seamlessly
    [41].


    Technology companies and innovators are investing heavily in the development of
    the metaverse, aiming to create a more immersive and interconnected online experience.
    For example, Meta (formerly Facebook) has developed an application called Horizon
    Workrooms that is a VR platform designed for collaboration and'
