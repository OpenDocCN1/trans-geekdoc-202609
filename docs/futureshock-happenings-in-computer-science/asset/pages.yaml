    # 6.4.5 HELP USERS RECOGNIZE, DIAGNOSE, AND RECOVER FROM ERRORS


    This fifth heuristic involves using plain language to describe the nature of the
    problem and suggest a way to solve it [19]. Some of the error messages presented
    to users can be confusing and not helpful to solving the error. Effective and
    useful feedback can increase the chances that a user will learn from their mistake
    and integrate new knowledge into their existing schemas. Moreover, familiar language
    increases the chance that the user will understand the information presented to
    them, and not be overloaded by the problem they have encountered. Good error messages
    help reduce the load associated with problem solving by providing hints towards
    an effective solution and in essence help the users by providing a partially worked
    out solution to their problem or error encountered, which relates to the empirically
    validated worked example completion effect [35]. A helpful error message provides
    a description of what and where the issue is and may suggest a potential solution.
    Avoid unhelpful error messages that contain jargon and don’t suggest how to recover
    from the issue.'
